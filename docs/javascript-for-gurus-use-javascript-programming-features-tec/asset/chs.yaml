  ## 引言\n\nJavaScript 函数可以变得更加简单，并在需要时自定义以使用特定参数。\n\n在本节中，你将学习普通 JavaScript 函数、偏函数和柯里化之间的区别。\n\
  \n## 结构\n\n* 偏函数\n* 柯里化\n\n## 目标\n\n* 理解偏函数应用函数式编程概念。\n* 理解柯里化函数式编程概念。\n\n## 偏函数\n\
  \n偏函数或偏应用在不真正完全求值函数的情况下，固定函数的几个参数的值。这会产生另一个参数较少的函数，随着函数链的进行，将值绑定到一个或多个参数上。\n\nJavaScript\
  \ 包含一个名为 `bind` 的内置方法，它可以作用于任意数量参数的函数并绑定任意数量参数。\n\n要调用 `bind` 方法，请使用以下语法：\n\n`function.prototype.bind(thisValue,\
  \ [argument1], [argument2], …)`\n\n`bind` 方法将函数转换为新函数，其隐式的 `this` 参数为该值，且初始参数始终如给定的那样。\n\
  \n为了更好地理解偏函数的概念，让我们做一个实际练习，并像往常逐个拆解它。\n\n1. 打开你任选的文本编辑器，并输入以下 HTML 和 JavaScript\
  \ 代码：\n\n```html\n<html><body><h1>Partials Example</h1><p>Partials Example</p><script>\n\
  function add (x, y) {\nreturn x + y;\n}\nfunction double (num) {\nreturn add(2,\
  \ num);\n}\nfunction addAgain (x, y) {\nreturn x + y;\n}\nvar doubleAgain = addAgain.bind(null,\
  \ 2);\nconsole.log(double);\nconsole.log(doubleAgain);\n</script></body></html>\n\
  ```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 18.1.html`。\n3. 双击该文件在默认浏览器中打开。\n4. 如果浏览器是\
  \ Google Chrome，按 `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\n上述代码的输出如下所示所示：\n\n![](img/Img_18_01.jpg)\n\
  \n图 18.1: 偏函数绑定示例\n\n函数 `add` 是 JavaScript 中调用和使用函数的普通方式。函数 `addAgain` 展示了绑定的实际应用。你可以看到，并不是所有的参数都提供了值，但\
  \ JavaScript 编译器完全没有抱怨。\n\n让我们做一个更复杂的例子。\n\n1. 打开你任选的文本编辑器，并输入以下 HTML 和 JavaScript\
  \ 代码：\n\n\n\n\n\n```javascript\nfunction addStudent(fullName, age, course) {\n \
  \   var message = ‘”’+ fullName + ‘, ‘ + age + ‘,” ‘ +\n    course + ‘ added to\
  \ database.’;\n    console.log(message);\n}\nvar student_1 = addStudent.bind(null,\
  \ “Ockert”);\nstudent_1(41, “JavaScript”);\nvar student_2 = addStudent.bind(null,\
  \ “du Preez”, 41, “JavaScript”);\nstudent_2();\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter\
  \ 18.2.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\n4. 如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift`\
  \ + `J` 打开控制台窗口。\n\n输出如截图所示：\n\n![](img/Img_18_02.jpg)\n\n图 18.2：复杂函数的 `bind` 示例。\n\
  \n原始函数 `addStudent` 包含三个参数：`fullName`、`age` 和 `course`。传递给此函数的任何内容都会带有友好的消息打印在控制台窗口中。`student_1`\
  \ 变量通过提供一个值绑定到 `addStudent` 函数。在下一行中，另外两个参数值被提供给绑定函数。`student_2` 也绑定到了 `addStudent`\
  \ 函数，但提供了一个额外的参数。\n\n让我们来看一个更复杂的例子。\n\n1.  打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\
  \n```html\n<html>\n<body>\n<h1>Partials Example</h1>\n<p>Partials Example</p>\n\
  <script>\nfunction listArgs() {\n    return Array.prototype.slice.call(arguments);\n\
  }\nfunction add(arg1, arg2) {\n    return arg1 + arg2\n}\nvar list_1 = listArgs(1,\
  \ 2, 3);\nvar result_1 = add(1, 2);\nvar list_2 = listArgs.bind(null, 41);\nvar\
  \ list_3 = add.bind(null, 41);\nvar list_4 = list_2();\nvar list_5 = list_2(1, 2,\
  \ 3);\nvar result_2 = list_3(5);\nvar result_3 = list_3(5, 10);\nconsole.log(list_1);\n\
  console.log(list_2);\nconsole.log(list_3);\nconsole.log(list_4);\nconsole.log(list_5);\n\
  console.log(result_1);\nconsole.log(result_2);\nconsole.log(result_3);\n</script>\n\
  </body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 18.3.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\
  \n4. 如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\n输出如截图所示：\n\n![](img/Img_18_03.jpg)\n\
  \n图 18.3：数组与函数绑定\n\n## 柯里化 (Currying)\n\n柯里化将一个具有多个参数的函数转换为嵌套函数的序列。它会持续返回一个新函数，该函数接收当前参数，直到所有参数耗尽。\n\
  \n这是一个简单的示例。\n\n1.  打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html>\n\
  <body>\n<h1>Currying Example</h1>\n<p>Currying Example</p>\n<script>\nfunction add_1(a,\
  \ b, c) {\n    return a + b + c;\n}\nfunction add_2(a) {\n    return (b) => {\n\
  \        return (c) => {\n            return a + b + c\n        }\n    }\n}\nconsole.log(add_1(2,4,6));\n\
  console.log(add_2(1)(2)(3))\n</script>\n</body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如\
  \ `Chapter 18.4.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\n4. 如果浏览器是 Google Chrome，按下 `Ctrl`\
  \ + `Shift` + `J` 打开控制台窗口。\n\n上述代码的输出如截图所示：\n\n![](img/Img_18_04.jpg)\n\n图 18.4：柯里化示例\n\
  \n第一个函数 `add_1` 是一个普通的 JavaScript 函数，并会被输出到控制台。函数 `adds_2` 是柯里化的示例。它将函数拆分为多个函数，每个函数接受一个参数。在这种情况下，有\
  \ 3 个参数，因此会有 3 个内联函数。\n\n## 总结\n\n在 *AdvancedConcepts* 章节的最后一个章节中，我们学习了如何在 JavaScript\
  \ 中使用函数式编程特性。你学习了如何利用部分应用（partial applications）来根据需求操纵函数的参数。最后，你看到了柯里化是如何使用内联函数的。\n\
  \n在接下来的最后一个章节中，我们将向你介绍各种基于 JavaScript 的语言和语言变体，如 AJAX、jQuery 和 JSON。\n\n## 问题\n\n\
  1. 定义部分应用（partials）这一术语。\n2. 什么是柯里化？\n\n# 第 V 部分\n\n## JAVASCRIPT 与朋友\n\n# 第 19\
  \ 章\n\n## JavaScript 与其他语言\n\n## 引言\n\nJavaScript 已经存在了很久，而且还将存在更久。像任何编程语言一样，它影响了许多不同的语言。\n\
  \n在本节中，你将学习如何将 JavaScript 与 AJAX、jQuery 和 JSON 结合使用。在课程后面的部分，你将快速了解受 JavaScript\
  \ 影响的语言，如 TypeScript、ActionScript 和 CoffeeScript。\n\n## 结构\n\n*   jQuery 和 JavaScript\n\
  *   JSON 和 JavaScript\n*   AJAX 和 JavaScript\n*   基于 JavaScript 或受 JavaScript 影响的语言\n\
  \n## 目标\n\n*   理解什么是 jQuery 以及如何使用。\n*   理解什么是 JSON 和 AJAX 以及如何在 JavaScript 中使用它们。\n\
  *   了解 ActionScript、CoffeeScript 和 TypeScript 如何工作。\n\n## 其他语言\n\n在整书中，你一直结合 HTML\
  \ 使用 JavaScript，因为 HTML 是任何网页的基础。如果你还记得，在[第 1 章：JavaScript 的威力概述及其目的] 中，我提到过 JavaScript\
  \ 的历史。另一种语言如 `CSS`（**层联样式表**）也让人联，它是任何网页都无法实现的语言。但是，世界上有很多语言。\n\n## jQuery 和 JavaScript\n\
  \njQuery 由 *John Resig* 于 2006 年创立。jQuery 是一个跨平台的 JavaScript 库。它是封装在一起的 JavaScript\
  \ 代码集合，比 JavaScript 更快、更容易地访问。它的主要用途是简化 HTML DOM 的遍历和操作，外加事件处理、CSS 动画和 AJAX（稍后我会谈论\
  \ AJAX）。jQuery 还提供了在 JavaScript 库之上创建插件的能力。\n\nJavaScript 和 jQuery 之间的一些重要区别下表所示：\n\
  \n| JavaScript | jQuery |\n| :--- | :--- |\n| 弱类型动态语言。 | 丰富且轻级的 JavaScript 库。 |\n\
  | 从头开始编写所有代码。 | 包含预定义的函数。 |\n| 开发者在开发时必须考虑浏览器兼容性。 | jQuery 是跨浏览器兼容的。 |\n| 运行 JavaScript\
  \ 不需要额外的插件。 | 网页必须包含 jQuery 库脚本链接。 |\n| 代码行长。 | 代码更少。 |\n| 学习困难。 | 相对容易学习。 |\n\n\
  表 19.1：JavaScript 对比 jQuery\n\n让我们通过几个练习快速查看代码编写上的差异。\n\n1.  打开你任选的文本编辑器并输入以下 HTML\
  \ 和 JavaScript 代码：\n\n```html\n<html\n<head>\n<script src= “https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js”></script>\n\
  </head>\n<body>\n<h1>jQuery versus JavaScript 1</h1>\n<p>jQuery versus JavaScript\
  \ 1</p>\n<input id=”button1” type=”button”value=”click Me!” //>\n<script>\n$(‘#button1’).click(function()\
  \ {\n    alert(“BpB”);\n});\n</script>\n</body>\n</html>\n```\n\n\n\n\n2. 以 HTML\
  \ 扩展名保存文件，例如 `Chapter 19.1.html`。\n\n3. 双击文件在默认浏览器中打开它。\n\n本次练习的第一部分演示了 jQuery 的处理方式；现在，让我们用纯\
  \ JavaScript 实现相同的功能。\n\n1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n\
  <html>\n<body>\n<h1>jQuery versus JavaScript 2</h1>\n<p>jQuery versus JavaScript\
  \ 2</p>\n<input id=”button1” type=”button”value=”click Me!”/>\n<script>\ndocument.getElementById(“button1”).addEventListener(‘click’,\
  \ function(){\nalert(“BpB”);\n});\n</script>\n</body>\n</html>\n```\n\n2. 以 HTML\
  \ 扩展名保存文件，例如 `Chapter 19.2.html`。\n\n3. 双击文件在默认浏览器中打开它。上述上述两个练习执行的是相同的操作。第一个是用 jQuery\
  \ 实现的，第二个是使用 JavaScript 实现的。通过打开上述练习中的任何一个，你将在下方看到一个类似于图 19.1 的屏幕：\n\n![](img/Img_19_01.jpg)\n\
  \n**图 19.1：** jQuery 与 JavaScript\n\n让我们来看代码。考虑到这只是演示 JavaScript 和 jQuery 之间差异的小示例，这两个练习的代码都相对很少。让我解释一下关键。\n\
  \n在之前的第一个程序中，你写了以下代码：\n\n```html\n<head>\n<script src= “https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js”>\n\
  </script>\n</head>\n```\n\n这段代码将 jQuery 库导入到你的页面。因为你将其放在 HTML 文档的 head 部分，它是完整页面的一部分，库中的方法会在其他任何内容之前加载。在\
  \ JavaScript 中，你不需要包含特殊的库来完成当前的任务（在本例中）。\n\n然后，你创建了一个普通的输入按钮并执行了以下操作：\n\n```javascript\n\
  <script>\n$(‘#button1’).click(function() {\nalert(“BpB”);\n});\n</script>\n```\n\
  \n为按钮绑定了一个点击事件处理器，显示一个带有文本 `BpB` 的警报框。非常简单且非常高效。\n\n在之前的第二个程序中，你不需要导入库。你也创建了一个按钮输入并执行了以下操作：\n\
  \n```javascript\n<script>\ndocument.getElementById(“button1”).addEventListener(‘click’,\
  \ function(){\nalert(“BpB”);\n});\n</script>\n```\n\n你首先必须通过 `getElementById` 方法获取名为\
  \ `button1` 的对象。之后，你必须通过添加一个监听事件的监听器手动为按钮绑定事件处理器。这也会显示一个带有文本 `BpB` 的警报框。\n\n## JSON\
  \ 和 JavaScript\n\n**JSON** 代表 **JavaScript 对象表示法**。它实际上并不是完全不同的编程语言，但许多初学者会混淆 JSON\
  \ 和 JavaScript。JSON 是一种用于存储和传输数据的轻量级格式。它是自描述的，主要用于从服务器向网页发送数据。\n\n如果你看这个名字，你会看到\
  \ JavaScript Object Notation，那么 JavaScript 对象和 JSON 之间的真实区别是什么？让我来回答。\n\nJavaScript\
  \ 对象在第 2 章：JavaScript 对象中有深入介绍，但这里有几个重点。\n\n## JavaScript 对象\n\n对象是拥有属性和方法的实体。属性描述对象。方法是该对象可以执行的操作。基本上，JavaScript\
  \ 中的一切万物都可以是对象。除了原始类型外，所有的 JavaScript 值都是对象。在详细介绍内置对象之前，让我们快速探索一下原始类型。\n\n## Object\
  \ 数据类型\n\n对象也是变量，但与原始类型不同，对象可以在其中存储多个值。对象存储键值对的数据集合和复杂实体。对象内部的信息以键值对的形式存储。键通常是属性名。值是该属性的值，例如：\n\
  \n```javascript\nvar objStudent = {\nName : “Ockert”,\nCourse : “JavaScript”,\n\
  Year : 2019\n};\n```\n\n在上面的代码段中，创建了一个名为 `objStudent` 的新 JavaScript 对象。`objStudent`\
  \ 包含三个属性，即 `Name`、`Course` 和 `Year`。\n\n## 创建 JavaScript 对象\n\n现在我们对对象有了更多了解，让我们来看看如何创建它们。可以使用以下任何一种方式创建对象：\n\
  \n*   对象字面量语法\n*   `new` 关键字\n*   `Object.create()`\n*   `Object.assign()`\n*  \
  \ ES6 类\n\n让我逐一解释它们。\n\n## 对象字面量语法\n\n这种方法非常易理解且执行速度快。这是一个示例：\n\n```javascript\n\
  var objCar = {\nmake : “BMW”,\nmodel : “i8 Roadster”,\nprice : 2329300\n};\n```\n\
  \n这个示例看起来可能非常熟悉。如果你仔细查看“Object 数据类型”部分中之前的代码段，你会发现这两个代码示例具有相同的相似之处。`var` 关键字创建了对象。大括号包含用冒号分隔的属性和值，每个属性之间用逗号分隔。\n\
  \n现在创建的对象名为 `objCar`。它包含 make、model 和 price 属性。为了使用 `objCar` 对象，你可以编写如下的语句：\n\n\
  ```javascript\nconsole.log(objCar); // 输出 {make: “BMW”, model: “i8 Roadster”, price:\
  \ “2329300”}\nconsole.log(objCar.make); // 输出 BMW\nconsole.log(objCar.model); //\
  \ 输出 i8 Roadster\nconsole.log(objCar.price); // 输出 2329300\n```\n\n## new 关键字\n\n\
  使用 `new` 关键字创建对象类似于在基于类的语言（如 C# 或 Java）中创建对象。使用 `new` 关键字创建对象有两种方法：\n\n*   **配合内置\
  \ Object 构造函数使用**：在基于类的面向对象编程中，构造函数是一种用于创建对象的特殊子程序。构造函数通过初始化对象的成员为使用做好准备。创建一个新对象，你必须配合\
  \ `Object()` 构造函数使用 `new` 关键字：\n\n```javascript\nvar house = new Object();\n```\n\
  \n这创建并初始化了一个名为 `house` 的新对象。我们可以通过如下代码为该对象添加属性：\n\n```javascript\nhouse.bedrooms\
  \ = 4;\nhouse.bathrooms = 2;\nhouse.garages = 2;\nhouse.hasSwimmingPool = false;\n\
  house.hasOutsideWalls = true;\n```\n\n可见，为使用 `Object()` 构造函数创建的对象创建属性可能会变成一项相当繁琐的任务，并且涉及大量输入。我们上面创建的\
  \ house 对象拥有卧室属性、浴室、车库属性，以及指示是否存在游泳池或外墙的布尔属性。\n\n如果我们需要创建成百个 house 对象怎么办？让我们看看如何通过使用自定义构造函数让这些代码更短一点。\n\
  \n*   **配合自定义构造函数使用**：在创建自定义构造函数时，你基本上是为对象的属性和方法创建了一个模板。你只需要创建一次函数，然后只需传递必要的属性，而不是像之前在“配合内置\
  \ Object 构造函数使用”部分所示那样手动输入每个属性和每个设置。\n\n让我们再次以 house 对象为示例创建一个自定义构造函数：\n\n```javascript\n\
  function House(_bed, _bath, _garage, _pool, _walls) {\nthis.bedRooms = _bed;\nthis.bathRooms\
  \ = _bath;\nthis.garages = _garage;\nthis.hasSwimmingPool = _pool;\nthis.hasOutsideWalls\
  \ = _walls;\n}\n```\n\n\n\n\n构造函数的名称为 `House`。在括号内有五个参数：（`_bed`、`_bath`、`_garage`、`_pool`\
  \ 和 `_walls`）。这些参数将用于向 `House` 函数传递信息。在构造函数内部，每个属性都将被设置为其对应的参数。记住，这仅仅是一个模板，目前还没有任何值。\n\
  \n现在我们已经有了构造函数，基于它创建对象就很简单了。方法如下：\n\n```javascript\nvar houseOne = new House(4,\
  \ 2, 2, false, true);\nvar houseTwo = new House(3, 1, 1, true, false);\n```\n\n\
  上面的 `houseOne` 变量是一个新的 `House` 对象。它有 4 卧室、2 间浴室、2 个车库、没有游泳池且有外墙。相比之下，`houseTwo`\
  \ 变量有 3 卧室、1 间浴室、1 个车库、一个游泳池，且没有外墙。\n\n## 创建 JSON 对象\n\nJSON 对象写在花括号内，并可以包含多个键/值对，如下所示：\n\
  \n```json\n{\"firstName”:”Ockert”, “lastName”:”du Preez”\n```\n\n你可以更进一步，在一个 `Student`\
  \ 对象中包含更多的 `firstName` 和 `lastName`，例如：\n\n```json\n{\n  “Student”:[\n    {\"firstName”:”Ockert”,\
  \ “lastName”:”du Preez”},\n    {\"firstName”:”William”, “lastName”:”Shakespeare”},\n\
  \    {\"firstName”:”Stephen”, “lastName”:”King}\n  ]\n}\n```\n\n## 有效 JSON 的规则\n\
  \n以下内容在 JSON 格式中都是允许的：\n\n-   空对象和空数组。\n-   字符串可以包含任何 Unicode 字符。\n-   Null 是一个有效的\
  \ JSON 值。\n-   所有对象的属性应始终使用双引号。\n-   数字值必须是十进制格式。\n-   数组中不允许有尾随逗号。\n\n让我们通过 JavaScript\
  \ 对 JSON 编码和解码进行一个快速练习：\n\n1.  打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n\
  <html>\n<body>\n    <h1>Encoding and Decoding JSON</h1>\n    <p>Encoding and Decoding\
  \ JSON</p>\n    <script>\n        const encodeData = {\n            name: “Ockert\
  \ du Preez”,\n            age: 41,\n            title: “JavaScript Guru”\n     \
  \   }\n        const encodeStr = JSON.stringify(encodeData);\n        console.log(encodeStr);\n\
  \        const decodeStr = ‘{\n            “name”:”Ockert du Preez”,\n         \
  \   “age”:41,\n            “title”:”JavaScript Guru”\n        }’;\n        const\
  \ decodeData = JSON.parse(decodeStr);\n        console.log(decodeData.title);\n\
  \    </script>\n</body>\n</html>\n```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter 19.3.html`。\n\
  \n3.  双击文件在默认浏览器中打开它。如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口：\n\n\
  控制台窗口中的输出所示：\n\n![](img/Img_19_02.jpg)\n\n**图 19.2：** JSON 的编码与解码\n\n让我分析一下这里发生了什么。\n\
  \n首先，创建了一个名为 `encodeData` 的 JavaScript 对象，并赋予了名称、年龄和标题等值。然后，一个名为 `encodeString`\
  \ 的变量利用 `JSON` 中的 `stringify` 方法将 JavaScript 对象转换为 JSON 对象。\n\n其次基本上是相反的。你提供了一个\
  \ JSON 对象给 `JSON` 的 `parse` 方法，以将其转换为普通的 JavaScript 对象。\n\n## AJAX 和 JavaScript\n\
  \nAJAX 不是一种编程语言。AJAX 代表异步 JavaScript 和 XML，它利用了：\n\n-   浏览器内置的 `XMLHttpRequest`\
  \ 对象，用于从 Web 服务器请求数据。\n-   JavaScript 和 HTML DOM，用于显示或使用这些数据。\n\nAJAX 的强大之处在于它允许通过与后台\
  \ Web 服务器交换数据来异步更新网页页面，这意味着可以更新网页的部分内容而无需重新加载整个页面。\n\n以下是 AJAX 工作原理的分解：在网页上发生了一个事件：\n\
  \n-   JavaScript 创建一个 `XMLHttpRequest` 对象。\n-   `XMLHttpRequest` 对象向 Web 服务器发送请求。\n\
  -   服务器处理该请求。\n-   服务器将响应返回给网页。\n-   JavaScript 读取响应。\n-   JavaScript 执行适当的操作。\n\
  \n下一个小练习将演示如何使用 JavaScript 和另一种名为 `PHP` 的脚本语言来使用 AJAX。PHP 是一种服务器脚本语言，因此请记住 `PHP`\
  \ 文件必须存在于服务器上，练习才能完全运行：\n\n1.  打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```php\n\
  <?php\nif(isset($_GET[“studentFirstName”]) && isset($_GET[“studentLastName”])) {\n\
  \    $fname = htmlspecialchars($_GET[“studentFirstName”]);\n    $lname = htmlspecialchars($_GET[“studentLastName”]);\n\
  \    $studentFullName = $studentFirstName.“ “.$studentLastName;\n    echo “Hello,\
  \ $studentFullName! Welcome!”;\n} else {\n    echo “Hi there, stranger! Welcome!”;\n\
  }\n?>\n```\n\n2.  以 HTML 扩展名保存文件，例如 `greet.php`。\n\n3.  打开你选择的文本编辑器，并输入以下 HTML 和\
  \ JavaScript 代码：\n\n```html\n<!DOCTYPE html>\n<head>\n    <script>\n        function\
  \ showStudentName() {\n            var request = new XMLHttpRequest();\n       \
  \     request.open(“GET”, “greet.php?studentFirstName=Ockert&studentLastName=du\
  \ Preez”);\n            request.onreadystatechange = function() {\n            \
  \    if(this.readyState === 4 && this.status === 200) {\n                    document.getElementById(“result”).innerHTML\
  \ = this.responseText;\n                }\n            };\n            request.send();\n\
  \        }\n    </script>\n</head>\n<body>\n    <h1>AJAX Example</h1>\n    <p>AJAX\
  \ Example</p>\n    <div id=”result”>\n        <p>Result will be displayed here</p>\n\
  \    </div>\n    <button type=”button” onclick=”showStudentName()”>Show Full Name</button>\n\
  </body>\n</html>\n```\n\n4.  以 HTML 扩展名保存文件，例如 `Chapter 19.4.html`。\n\n5.  双击文件在默认浏览器中打开。如所述，如果\
  \ PHP 文件保存在服务器上且一切设置正确，加载此文档时不会出现错误。\n\n这里发生了什么？`greet.php` 是存在于服务器上的 PHP 文件。它测试\
  \ `studentFirstName` 和 `studentLastname` 字段是否包含信息。如果是，它们的值将分别存储在两个 PHP 变量对象 `fname`\
  \ 和 `lname` 中。\n\n`studentFullName` PHP 变量由空格分隔的 `fname` 和 `lname` 变量组成。如果提供了值，将出现一条用全名问候学生的消息；否则，将出现一条问候陌生人的消息。\n\
  \n在你创建的 `Chapter19.4html` 文件中，你创建了一个函数 `showStudentName`。该函数的作用是调用 `greet.php` 文件中的逻辑，组合给定的名和姓。如果函数执行成功，它将在名为\
  \ `result` 的 `div` 中显示全名。\n\n\n\n\nCoffeeScript 可编译为 JavaScript。CoffeeScript 添加了受\
  \ Ruby、Python 和 Haskell 启发的语法糖，以增强 JavaScript 的可读性。\n\n假设你在 CoffeeScript 中有如下函数：\n\
  \n```javascript\nadd =(a,b) ->\nc=a+b\nconsole.log “Answer is: “+c\n```\n\n它在 JavaScript\
  \ 中等价于：\n\n```javascript\n(function() {\n  var add;\n  add = function(a, b) {\n\
  \    var c;\n    c = a + b;\n    return console.log(“Answer is: “ + c);\n  };\n\
  }).call(this);\n```\n\n虽然 CoffeeScript 使用的代码较少，但理解起来可能会稍微困难。这两个函数本质上是相同的，即两个数字相加并提供答案。\n\
  \n## TypeScript\n\nTypeScript 命令行编译器可以作为 Node.js 包安装，请访问以下 URL：\n\n[`www.typescriptlang.org/index.html#download-links`](https://www.typescriptlang.org/index.html#download-links)\n\
  \n这里是一个如何在 TypeScript 中创建类的简短示例：\n\n1. 打开你任的文本编辑器并输入以下代码：\n\n   ```typescript\n\
  \   class Car {\n     make: String;\n     model: String;\n     doors: Number;\n\
  \     isAutomatic: Boolean;\n     constructor(make: make, model: String, doors:\
  \ Number, isAutomatic: Boolean) {\n       this.make = make;\n       this.model =\
  \ model;\n       this.doors = doors;\n       this.isAutomatic = isAutomatic;\n \
  \    }\n     make(): void {\n       console.log(‘Car Make and model: ${this.make},\
  \ ${this.model}. Number of doors: ${this.doors}’ );\n     }\n   }\n   let newCar\
  \ = new Car(‘Lamborghini’, ‘Aventador’, 2, false);\n   newCar.make();\n   ```\n\n\
  2. 以指定的扩展名保存文件，例如 `Car.ts`。\n\n由于 TypeScript 可以扩展 JavaScript 的功能，这看起来与普通的 JavaScript\
  \ 类非常相似。\n\n## 结论\n\n在本章中，我们学习了如何使用 JavaScript 以及受其影响的其他变体和语言。jQuery、AJAX 和 JSON\
  \ 都是足以独立成一本书的话题。你还看到了其他语言的样貌以及它们与 JavaScript 的对比。\n\n## 问题\n\n1. 什么是 jQuery？\n2.\
  \ 什么是 JSON？\n3. 什么是 AJAX？\n4. 列举两种受 JavaScript 影响的语言。\n5. JavaScript 仍然很困难吗？\n"
