  *   nomodule\n*   打包工具\n\n# 目标](#toc.xhtml_s165a)\n\n*   创建模块\n*   导出模块函数\n\n\n\n\
  \n\n* 在 JavaScript 和 HTML 中导入模块函数\n* 了解模块的优点\n* 了解 CORS 以及如何解决 CORS 问题\n* 了解什么是模块打包器（Bundlers）\n\
  \n## 什么是模块？\n\n在`第 1 章：JavaScript 的力量及其用途]`中，我们讨论了 JavaScript 语言的历史和起源。快进十二十年后，这种语言已经有了巨大的增长，对其的需求也更加迫切。\n\
  \n过去 JavaScript 仅用于提供交互和一些脚本任务，而现在它的用途要广泛得多。简单来说：没有 JavaScript，2019 年就没有网页。\n\n\
  在过去，当开发者需要在页面中实现类似的功能时，他们只需将脚本复制粘贴到每个页面，或者创建 JavaScript 库。组织大型且通用的脚本是一项困难且麻烦的任务。幸运的是，今天存在一种组织大型脚本的机制，这些被称为模块。\n\
  \n## 模块\n\n模块是一个包含 JavaScript 代码的文件，它允许你将 Web 应用程序拆分为逻辑单元。模块是自包含的，具有独特且特定的功能。这允许开发者在移除某些模块或添加新模块，而不会破坏整个应用程序。\n\
  \n## 模块的优点\n\n使用模块的优点包括：\n\n* **可重用性**：拥有可重用的脚本或函数可以节省大量时间。你不需要在不同的地方编辑相同的代码；不需要在不同的地方进行相同的更改。模块中的代码是可重用的——需要时只需在模块内部进行更改，代码就可以轻松在不同的地方使用。\n\
  * **可维护性**：模块是自包含的。模块减少了对脚本代码部分的依赖，因为更新模块与其他代码是解耦的。\n* **避免命名空间污染**：顶层函数范围之外的变量是全局变量。这会导致命名空间污染，即无关的代码共享全局变量。模块允许通过为变量创建私有空间来避免这个问题。\n\
  \n## 使用模块\n\n可以使用 `export` 和 `import` 关键字从一个模块调用另一个模块的函数并交换功能。\n\n## 导出模块\n\n`export`\
  \ 标识你想要向其他模块暴露的变量和函数。解释如何导出函数最好的方法就是亲自实践，所以让我们来练习吧！\n\n以下示例创建一个包含两个函数的型模块，这些函数可以被导出供其他模块使用：\n\
  \n1. 打开你喜欢的文本编辑器并输入以下 JavaScript 代码：\n\n```javascript\nexport function sayHello(name)\
  \ {\nalert(‘Hello, ${name}!’);\n}\nexport function sayBye(name) {\nalert(‘Bye, ${name}!’);\n\
  }\n```\n\n2. 以 `.mjs` 扩展保存文件，例如 `greet.mjs`。\n\n通过使用 `.mjs` 扩展保存文件，你表示该文件中没有其他代码，从而使其成为一个模块。`.mjs`\
  \ 扩展有助于保持你的 JavaScript 模块和 JavaScript 类更有组织。此模块包含两个简单的函数，只需产生一个带有特定欢迎语的警告框。\n\n\
  这里需要注意的最重要的一点是小单词：`export`。它允许从其他模块该函数。\n\n我们将在本章中继续使用这个示例，所以暂时保持该文件不变。\n\n## 导入模块\n\
  \n`import` 关键字允许你从其他模块导入功能。让我们看看如何从现有模块将函数导入另一个模块中：\n\n1. 打开你喜欢的文本编辑器并输入以下 JavaScript\
  \ 代码：\n\n```javascript\nimport {sayHello} from ‘./greet.mjs’;\nimport {sayBye} from\
  \ ‘./greet.mjs’;\nalert(sayHello); // function…\nsayHello(‘Ockert’); // Hello, Ockert!\n\
  alert(sayBye); // function…\nsayBye(‘Ockert’); // Bye, Ockert!\n```\n\n2. 以 `.mjs`\
  \ 扩展保存文件，例如 `main.mjs`。\n\n如你所示，从其他模块导入函数非常简单。你只需要使用 `import` 关键字从目标模块导入所需的函数。因此，在上面的代码中，你从名为\
  \ `greet.js` 的模块中导入了 `sayHello` 和 `sayBye` 函数。\n\n函数导入后，就可以像普通函数一样使用。现在让我们看看如何将函数导入到\
  \ HTML 网页中。\n\n以下示例演示了如何将模块导入到你的网页页面中：\n\n1. 打开你喜欢的文本编辑器并输入以下 HTML 和 JavaScript\
  \ 代码：\n\n```html\n<!doctype html>\n<body>\n<h1>Import module functions example</h1>\n\
  <p>Import module functions example</p>\n<script type=”module\">\nimport {sayHello}\
  \ from ‘./greet.mjs’;\nimport {sayBye} from ‘./greet.mjs’;\ndocument.body.innerHTML\
  \ = sayHello(‘Ockert’);\n//document.body.innerHTML = sayBye(‘Ockert’);\n</script>\n\
  </body>\n</html>\n```\n\n2. 以 HTML 扩展保存文件，例如 `Chapter 11.1.html`。\n3. 双击文件在默认浏览器中打开它。\n\
  4. 如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\n我们将脚本类型标识为模块，然后导入函数。现在，这可能有效也可能无效，如下方的\
  \ `图 11.1` 所示。为什么？因为 CORS：\n\n![](img/Img_11_01.jpg)\n\n**图 11.1:** 控制台窗口中的错误\n\n\
  另一种导入模块的方法是。\n\n以下示例演示了如何将模块导入到你的网页页面中：\n\n```html\n<html>\n<body>\n<h1>Import module\
  \ functions example</h1>\n<p>Import module functions example</p>\n<script type=”module”\
  \ src=”greet.mjs\"></script>\n<script>\ndocument.body.innerHTML = sayHello(‘Ockert’);\n\
  document.body.innerHTML = sayBye(‘Ockert’);\n</script>\n</body>\n</html>\n```\n\n\
  2. 以 HTML 扩展保存文件，例如 `Chapter 11.2.html`。\n3. 双击文件在默认浏览器中打开它。\n4. 如果浏览器是 Google Chrome，按下\
  \ `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\n脚本文件的源被设置为目标模块。这稍微快一点且更易读。两个网页都可能因为**跨源资源共享**（**CORS**）产生错误。让我解释一下它。\n\
  \n## 跨源资源共享 (CORS)\n\n**跨源资源共享** (**CORS**) 利用额外的 HTTP Header 通知浏览器允许 Web 应用程序访问不同源的选资源。这通常发生在\
  \ Web 应用程序请求与其自身不同域、协议或端口的资源时。\n\nCORS 添加了新的 HTTP Header 来描述哪些源允许从 浏览器读取信息。对于 GET\
  \ 和 POST 以外的 HTTP 请求方法，可能会对服务器数据产生副作用，浏览器应该预检请求。这通过 `HTTP OPTIONS` 请求方法向服务器询问支持的方法。\n\
  \n这是它的工作原理。\n\n假设用户访问了以下网站：[`www.javascriptforgurus.com`](http://www.javascriptforgurus.com)，该网站上的一个页面尝试跨源请求以从\
  \ [`service.javascriptforgurus.com`](http://service.javascriptforgurus.com) 获取一些数据。兼容\
  \ CORS 的浏览器将尝试以以下方式向 `service.javascriptforgurus.com` 发起跨源请求。\n\n兼容 CORS 的浏览器发送一个带有\
  \ `Origin` Header 的 `OPTIONS` 请求到 [`service.javascriptforgurus.com`](http://service.javascriptforgurus.com)，该\
  \ Header 包含父页面的域：\n\n\n\n\n\n`http://www.javascriptforurus.com`\n\n`http://service.javascriptforurus.com`\
  \ 处的服务器可能会返回以下任意内容：\n\n* `Access-Control-Allow-Origin` 头部，显示哪些站点被允许。例如：\n    `Access-Control-Allow-Origin:\
  \ http://www.javascriptforurus.com`\n* 带有通配符的 `Access-Control-Allow-Origin` 头部，允许所有域。例如：\n\
  \    `Access-Control-Allow-Origin: *`\n* 错误页面\n\n## CORS 预检请求\n\n之前我提到浏览器应该对请求进行\
  \ `preflight`（预检）。在执行跨域请求时，兼容 CORS 的浏览器会插入 `preflight` 请求，以确定它们是否有权限执行该操作。这里是一个简单的示例：\n\
  \n`OPTIONS /`\n`Host: service.javascriptforurus.com`\n`Origin: http://www.javascriptforurus.com`\n\
  \n如果 `service.javascriptforurus.com` 接受该操作，它将返回以下头部：\n\n`Access-Control-Allow-Origin:\
  \ http://www.javascriptforurus.com`\n`Access-Control-Allow-Methods: PUT, DELETE`\n\
  \n另一个示例如下。此示例演示了客户端在发送 `DELETE` 预检请求之前，向服务器询问其是否允许 `DELETE` 请求：\n\n`OPTIONS http://www.javascriptforurus.com`\n\
  `Access-Control-Request-Method: DELETE`\n`Access-Control-Request-Headers: origin,\
  \ x-requested-with`\n`Origin: http://www.javascriptforurus.com`\n\n以下是服务器的响应：\n\n\
  `HTTP/1.1 204 No Content`\n`Connection: keep-alive`\n`Access-Control-Allow-Origin:\
  \ http://www.javascriptforurus.com`\n`Access-Control-Allow-Methods: POST, GET, OPTIONS,\
  \ DELETE`\n`Access-Control-Max-Age: 86400`\n\n因为服务器响应了 `Access-Control-Allow-Methods`，所以服务器允许该请求。但我们仍然面临\
  \ CORS 问题。我什么意思？嗯，你做的练习仍然抛出 CORS 错误，如图 1.1 所示。我们该如何修复这个问题？\n\n其实有很多绕过 CORS 错误的方法；这里有几种在\
  \ Google Chrome 中可能有效：\n\n* Origin & CORS Changer\n* 命令提示符 (Command Prompt)\n* Out\
  \ of blink CORS\n\n## Origin & CORS Changer\n\n`Origin & CORS Changer` Chrome 插件允许你发送跨域请求并覆盖源和\
  \ CORS 头部，而不会接收错误。使用以下步骤安装 `Origin & CORS Changer` 插件：\n\n1. 导航到：`https://chrome.google.com/webstore/detail/origin-cors-changer/digfaphondkpccljibejppibc?hl=US`\n\
  2. 点击 `Add to Chrome` 按钮将此扩展程序添加到 Chrome。如图 2 所示。\n3. 如必要，重启浏览器。\n4. 你会发现地址栏旁边有一个小图标。这就是该扩展。点击它，会出现下一个屏幕。\n\
  5. 点击 `SWITCH ON` 按钮，开启此扩展。\n6. 这应该可以解决问题。\n\n## 命令提示符 (Command Prompt)\n\n命令提示符用于执行输入的命令，例如通过脚本和批文件自动化任务、执行管理功能以及排排除\
  \ Windows 问题。以下步骤将以禁用安全模式打开 Google Chrome：\n\n1. 关闭所有 Google Chrome 实例。\n2. 按键盘上的\
  \ Windows 键。\n3. 输入 `cmd`。按 `Enter`。\n4. 命令提示符窗口将出现，如图 4 所示。\n5. 输入以下命令并按回车：\n \
  \  `CD \"Program Files (x86)\\Google\\Chrome\\Application\"`\n   这意味着更改目录（文件夹）到\
  \ Chrome 应用程序文件所在。\n6. 输入以下命令并按 `Enter`。屏幕如图 5 所示：\n   `Chrome.exe --disable-web-security`\n\
  \   OR\n   `chrome.exe --user-data-dir=\"C://Chrome dev session\" --disable-web-security`\n\
  \   OR\n   `chrome.exe --disable-web-security --disable-gpu --user-data-dir=\"C://Chrome\
  \ dev session\"`\n7. 这将启动禁用了安全的 Chrome，这可能不是一个完全好的主意。\n\n现在，让我们来看 Out of blink CORS\
  \ 设置。\n\n## Out of blink CORS\n\nOut of blink CORS 是 Chrome 的设置，你可以用它来启用或禁用 CORS\
  \ 检查。使用以下步骤禁用 Out of blink CORS：\n\n1. 打开你的 Chrome 浏览器（如果尚未打开）\n2. 导航到：`chrome://flags/#out-of-blink-cors`\n\
  3. 在 `Out of blink CORS` 设置旁边，从下拉菜单中选择 `Disabled`，如图 6 所示。\n\n\n\n\n\n```html\n\
  <script nomodule src=\"old.js\"></script>\n</body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如\
  \ `Chapter 11.5.html`。\n\n如果使用现代浏览器，所有的模块都可以被解析和使用。然而，当使用旧版浏览器时，它会使用旧的 JavaScript\
  \ 文件。\n\n## 打包工具 (Bundlers)\n\n在大型网站中，使用 `webpack`、`Rollup` 或 `Parcel` 等打包工具来整合脚本总是更容易。\n\
  \n打包工具可以实现以下功能：\n\n* 分析模块的依赖关系，包括导入以及嵌套导入。\n* 构建一个包含所有模块的单一文件。\n* 移除无法到达的代码。\n*\
  \ 移除未使用的导出。\n* 压缩文件。这将移除空格并将变量替换为更短的名字。\n\n我已经提到了三个流行的打包工具（`webpack`、`Rollup`、`Parcel`），让我快速告诉你们它们的作用。\n\
  \n## 关于打包工具的简要笔记\n\n* `webpack`: `webpack` 是一个用于现代 JavaScript 应用的静态模块打包器。它构建一个依赖图，映射你项目所需的每个模块，并生成一个或多个包。你可以在这里找到\
  \ `webpack`：[`webpack.js.org/concepts/`](https://webpack.js.org/concepts/)\n* `rollup.js`:\
  \ `Rollup` 将较小的代码片段编译成更大的整体，例如库或应用程序。你可以在这里找到 `Rollup`：https://rollupjs.org/guide/en/\n\
  * `parcel.js`: `Parcel` 是一个 Web 应用打包器，提供快速性能且需要零配置。在此处找到 `Parcel`：[`parceljs.org/getting_started.html`](https://parceljs.org/getting_started.html)\n\
  \n较小的网站可能不需要使用打包工具，但请记住：导入越多，可能瓶颈就越多，对于某个特定函数是否存在的困惑也越多。\n\n## 结论\n\n在本章中，我们学习了什么是模块，以及你为什么要以及如何使用它们。你了解了它的好处，以及当旧版浏览器不支持模块时会发生什么。你学习了\
  \ `CORS` 和一些可用工具，特别是在开发阶段。你学习了各种可用的打包工具。\n\n在下一章中，我们将通过解释变量、数据类型和作用域来开启*高效使用 JavaScript*\
  \ 章节。\n\n## 问题\n\n1. 给出一个导出模块函数的示例。\n2. 给出一个导入模块函数的示例。\n3. 解释为什么动态导入是如此不同。\n4. `nomodule`\
  \ 属性是做什么用的？\n5. 解释 `CORS` 术语。\n\n# 第三部分\n\n## 高效使用 JavaScript\n\n## 引言\n\n第三部分将深入探讨\
  \ JavaScript 的真实威力。理解 JavaScript 的运行机制对于创建极其强大的网站和 Web 应用至关重要。在本节中，你将学习如何创建类，然后学习原型、属性和承诺，最后是生成器和模块。\n\
  \n本节包含以下章节：\n\n1. 变量\n2. 控制流语句\n3. 循环\n4. 代码质量\n\n# 第 12 章\n\n## 变量\n\n## 引言\n\n\
  变量是用于存储信息的命名容器。该容器存储在内存中并持有临时值。\n\n在本节中，你将学习什么是变量。你将学习如何声明变量，最重要的是，你将学习 JavaScript\
  \ 语言中的各种原始数据类型。这节课程充满了练习，让我们开始吧！\n\n## 结构\n\n* 声明变量\n* 作用域\n* 原始类型\n\n## 目标\n\n\
  * 学习如何声明变量。\n* 理解变量作用域\n* 创建并使用各种内置原始类型：\n    * String（字符串）\n    * Boolean（布尔值）\n\
  \    * Number（数字）\n    * BigInt\n    * Symbol（符号）\n    * Null\n    * undefined\n\
  \n## 声明变量\n\n你通过 `var` 关键字创建变量。此过程创建一个命名的内存位置，准备存储值。\n\n你通过以下方式创建变量：\n\n```javascript\n\
  var progStudent;\n```\n\n变量已创建，目前没有值。在本章稍后的部分，我将为你介绍 `undefined` 原始类型。\n\n我们有了变量，现在呢？我们需要在里面存储一个值。我们通过给它赋值来实现，如下所示：\n\
  \n```javascript\nprogStudent = \"Ockert du Preez\";\n```\n\n在赋值时，你在左侧指定变量名，然后使用赋值运算符（即等号），最后提供你想存储在该变量中的值。这里是另外两个例子：\n\
  \n```javascript\nvar Age;\nAge = 41;\n```\n\n或者\n\n```javascript\nvar Grades;\n\
  Grades = 75.5;\n```\n\n或者\n\n```javascript\nvar progStudent = \"Ockert du Preez\"\
  , Age = 41, Grades = 75.5;\n```\n\n一些命名规则如下：\n\n* 对象名可以包含字母、数字、下划线甚至美元符号。\n* 对象名可以以字母或\
  \ `_` 开头。\n* 对象名区分大小写，`varname` 与 `varName` 和 `VarName` 不同。\n* JavaScript 关键字不能作为名称。\n\
  \n我想提到的最后一点是创建变量的作用域，如后文所示。\n\n## 作用域\n\n变量的作用域意味着它在何处是可知的。简单来说：在家里，只有你的亲家人认识你；在公司，你的同事认识你。JavaScript\
  \ 有两种作用域：\n\n* 局部\n* 全局\n\n## 局部作用域与全局作用域\n\n局部变量仅在定义它的函数内部可见。全局变量具有全局作用域，这意味着可以在代码的任何地方定义它。\n\
  \n## 原始类型\n\n在第 2 章：JavaScript 对象 中，我简要提到了原始类型（Primitives）。这里有一个快速复习。原始值是不具有属性或方法的值。原始数据类型仅仅是具有原始值的数据。JavaScript\
  \ 中实际上有七种原始类型，它们是：\n\n* string\n* number\n* BigInt\n* null\n* undefined\n* boolean\n\
  * Symbol\n\n其他所有内容都是对象。\n\n### String\n\nJavaScript 字符串数据类型表示文本数据。字符串的示例包括：\n\n\
  * ‘Ockert’\n* “BpB”\n* “1”\n\n与许多编程语言不同，这里没有单独的字符数据类型。JavaScript 字符串是不可变的，这意味着一旦创建了字符串，就无法修改。你可以通过对原始字符串进行操作来创建另一个字符串，使用的函数如\
  \ `String.concat()`（将两个字符串连接在一起）和 `String.substr()`（允许你提取字符串的一部分）。\n\n我稍后会详细介绍字符串函数。\n\
  \n现在，我如何识别或设置字符串呢？\n\n### 引号\n\n你在这个主题的开头注意到我将所有字符串都放在了引号内。但是，如果你仔细看，你会发现我使用了两种类型的引号：单引号和双引号。识别字符串的另一种方法是使用反引号（backticks）。\n\
  \n\n\n\n\n单引号（`‘`）和双引号（`“`）本质上是相同的，唯一需要记住的是你不能用单引号开头并双引号结束字符串，反之亦然。通过让你所有的字符串看起来都一样来保持某种标准，这会让将来更容易识别它们。\n\
  \n## 反引号 (Backticks)\n\n反引号（`‘`）允许你通过用 `${…}` 包裹表达式将其嵌入字符串中。在本书书中我们一直在进行这种用例，但让我们通过一个小型的练习来复习一下记忆吧。\n\
  \n下面的示例演示了如何在你的网页中使用反引号：\n\n1.  打开你选择的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n\
  <!doctype html>\n<html>\n<body>\n<h1>Backticks example</h1>\n<p>Backticks example</p>\n\
  <script>\nfunction sum(a, b) {\nreturn a + b;\n}\nalert(`1 + 2 = ${sum(1, 2)}.`);\
  \ // 1 + 2 = 3.\n</script>\n</body>\n</html>\n```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter\
  \ 12.1.html`。\n\n3.  双击该文件并在默认浏览器中打开它。\n\n在这里我们简单地创建了一个相加两个对象的函数，然后将其显示在警框框中，如下截图所示：\n\
  \n![](img/Img_12_01.jpg)\n\n**图 12.1：** 反引号\n\n我非常喜欢反引号的一个特性是允许一个字符串跨多行。如果我用单引号或双引号执行上述的操作，JavaScript\
  \ 编译器将会报错。\n\n```javascript\nlet students = `Students:\n* Ockert\n* BpB\n* John\n\
  * Peter\n* William\n* Jessica`;\nalert(students);\n```\n\n*图 12.2* 显示了上述代码执行后的样子：\n\
  \n![](img/Img_12_02.jpg)\n\n**图 12.2：** 用于多行字符串的反引号\n\n然而，你仍然可以使用单引号和双引号创建多行字符串。你通过在字符串内部插入换行符（写作\
  \ `\\n`）来实现这一点。下一行代码产生的结果与之前所示的反引号包裹的多行引号完全相同。\n\n```javascript\nlet students =\
  \ “Students:\\n * Ockert\\n * BpB\\n * John\\n * Peter\\n * William\\n* Jessica”;\n\
  alert(students);\n```\n\n特殊字符 `\\n`（换行）被插入到字符串必须拆分为新行的位置或位置上。\n\n说到特殊字符，让我们更详细查看下一个。\n\
  \n## 特殊字符\n\n特殊字符是指不是字母、数字、符号或标点符号的字符。*表 12.1* 列出了一些常见的特殊字符：\n\n| 字符 | 描述 |\n| :---\
  \ | :--- |\n| `\\n` | 换行 |\n| `\\r` | 回车。通常使用 `\\n` 和 `\\r` 的组合在文本文件中创建新行。 |\n|\
  \ `\\’` | 单引号 |\n| `\\”` | 双引号 |\n| `\\\\` | 反斜杠 |\n| `\\t` | 制表符 |\n| `\\b, \\\
  f, \\v` | 退格符、分页符、垂直制表符。主要为了兼容性而保留。 |\n| `\\xXX` | Unicode 字符。例如：‘`\\x6F`’ 等于‘`O`’\
  \ |\n| `\\uXXXX` | Unicode 符号。例如，`\\u00AE` 等于注册符号 `®`。 |\n\n**表 12.1：** 特殊字符\n\n\
  注意，所有特殊字符必须以反斜杠开头。从这个意义上说，它被称为转义字符。\n\n## 字符串属性\n\n基本值如 `Ockert du Preez` 不是一个对象，因此它不能拥有属性或方法。然而，JavaScript\
  \ 为基本值提供了方法和属性，因为这些值在执行方法和属性时被视为对象。\n\n`length` 属性返回给定字符串中的字符数。下面的示例演示了字符串长度属性：\n\
  \n1.  打开你选择的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<html>\n\
  <body>\n<h1>String length Property</h1>\n<p>String length Property</p>\n<script>\n\
  var str = new String( “Ockert du Preez” );\ndocument.write(“str.length is:” + str.length);\n\
  </script>\n</body>\n</html>\n```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter 12.2.html`。\n\
  \n3.  双击该文件并在默认浏览器中打开它。\n\n答案将是 `15`，因为 `length` 属性包含了空格。\n\n## 字符串方法\n\n下表列出了标准的字符串方法：\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `charAt()` | 获取指定索引处的字符。 |\n| `charCodeAt()` |\
  \ 获取指定索引字符的 Unicode。 |\n| `concat()` | 连接两个或多个字符串。 |\n| `endsWith()` | 确定字符串是否以指定的子字符串结束。\
  \ |\n| `fromCharCode()` | 将 Unicode 转换为字符。 |\n| `includes()` | 判断字符串是否包含指定的子字符串。\
  \ |\n| `indexOf()` | 获取指定值在字符串中第一次出现的索引。 |\n| `lastIndexOf()` | 获取指定值在字符串中最后一次出现的索引。\
  \ |\n| `localeCompare()` | 比较两个字符串。 |\n| `match()` | 字符串与正则表达式进行匹配。 |\n| `repeat()`\
  \ | 重复字符串。 |\n| `replace()` | 将字符串中的字符串或模式替换为另一个字符串。 |\n| `search()` | 字符串与正则表达式进行搜索。\
  \ |\n| `slice()` | 提取字符串的一部分。 |\n| `split()` | 将字符串拆分为子字符串。 |\n| `startsWith()`\
  \ | 确定字符串是否以指定的子字符串开头。 |\n| `substr()` | 提取字符串的部。 |\n| `substring()` | 提取字符串的一部分。\
  \ |\n| `toLocaleLowerCase()` | 将字符串转换为小写。 |\n| `toLocaleUpperCase()` | 将字符串转换为大写。\
  \ |\n| `toLowerCase()` | 将字符串转换为小写。 |\n| `toString()` | 创建一个表示指定字符串对象的字符串。 |\n|\
  \ `toUpperCase()` | 将字符串转换为大写。 |\n| `trim()` | 移除字符串开头和结尾的空白。 |\n| `valueOf()` |\
  \ 返回基本值。 |\n\n**表 12.2：** 字符串方法\n\n下面的示例演示了 `charAt` 字符串方法的使用：\n\n1.  打开你选择的文本编辑器并输入以下\
  \ HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<html>\n<body>\n<h1>String\
  \ charAt method</h1>\n<p>String charAt method</p>\n<script>\nvar str = new String(\
  \ “Ockert du Preez” );\ndocument.writeln(`<br />str.charAt(0) is:` + str.charAt(0));\n\
  document.writeln(`<br />str.charAt(1) is:` + str.charAt(1));\ndocument.writeln(`<br\
  \ />str.charAt(2) is:` + str.charAt(2));\ndocument.writeln(`<br />str.charAt(3)\
  \ is:` + str.charAt(3));\ndocument.writeln(`<br />str.charAt(4) is:` + str.charAt(4));\n\
  document.writeln(`<br />str.charAt(5) is:` + str.charAt(5));\n</script>\n</body>\n\
  </html>\n```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter 12.3.html`。\n\n3.  双击该文件并在默认浏览器中打开它。\n\
  \n创建了一个包含我名字和姓氏的字符串。然后使用 `charAt` 获取指定索引处的字符。例如：0 是字符串的第一个字符。\n\n\n\n\n`Number`\
  \ 类型是一个双精度 64 位二进制值。它可以存储浮点数或范围在 `-(2⁵³ -1)` 到 `(2⁵³ -1)` 之间的整数。数字类型还有三个特殊值：`+Infinity`、`-Infinity`\
  \ 和 `NaN`（不是数字）。常量 `Number.MAX_VALUE` 和 `Number.MIN_VALUE` 可用于确定 `+Infinity` 和 `-Infinity`\
  \ 之间的最大或最小值。你还可以使用 `Number.isSafeInteger()` 或 `Number.MAX_SAFE_INTEGER` 和 `Number.MIN_SAFE_INTEGER`\
  \ 来检查一个数字是否在双精度浮点范围内。\n\n# Number 属性](#toc.xhtml_s198a)\n\n原始类型数字具有以下属性：\n\n| 属性\
  \ | 描述 |\n| :--- | :--- |\n| `EPSILON` | 两个可表示数字之间的最小间隔 |\n| `MAX_SAFE_INTEGER`\
  \ | 最大安全整数 |\n| `MAX_VALUE` | 最大可表示正数 |\n| `MIN_SAFE_INTEGER` | 最小安全整数 |\n| `MIN_VALUE`\
  \ | 最接近零的正数 |\n| `NaN` | 不是数字 |\n| `NEGATIVE_INFINITY` | 负无穷 |\n| `POSITIVE_INFINITY`\
  \ | 正无穷 |\n\n**表 12.3:** Number 属性\n\n现在我们已经熟悉了数字类型的属性，让我们来看看它的方法。\n\n# Number 方法](#toc.xhtml_s199a)\n\
  \n原始类型数字具有以下方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `isFinite` | 该值是否为有限数字？ |\n|\
  \ `isInteger` | 该值是否为整数（整数字）？ |\n| `isNaN` | 该值是否不是数字？ |\n| `isSafeInteger` | 该值是否为\
  \ `-(253 -1)` 到 `(253 -1)` 之间的整数 |\n| `parseFloat` | 将参数解析为浮点数 |\n| `parseInt` |\
  \ 将参数解析为整数 |\n| `prototype.toExponential` | 科学计数法表示字符串 |\n| `prototype.toFixed`\
  \ | 固定点计数法 |\n| `prototype.toLocaleString` | 语言敏感的数字表示法 |\n| `prototype.toPrecision`\
  \ | 以固定点或科学计数法以指定的精确度表示数字 |\n| `prototype.toSource` | Number 对象的对象字面量 |\n| `prototype.toString`\
  \ | 数字的字符串表示 |\n| `prototype.valueOf` | 返回对象的原始值 |\n\n**表 12.4:** Number 方法\n\n\
  让我们来一个快速的练习吧！以下示例演示了几个数字方法的使用：\n\n1.  打开你任的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n\
