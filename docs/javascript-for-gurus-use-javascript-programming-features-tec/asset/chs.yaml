  \n# 前言\n\n从头到尾，本书将涵盖 JavaScript 语言的所有复杂细节！你将获得所有 `Statements`（语句）、`Functions`（函数）和\
  \ `Operators`（运算符）的概述。然后你将学习有趣的内容，包括：`Classes`（类）、`Prototypes`（原型）、`Promises`（承诺）和\
  \ `Generators`（生成器）。你将学习数组以及如何让脚本实现逻辑。最后，你将学习如何将 JavaScript 与其他语言结合。\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n2. JavaScript 对象\n4. JavaScript\
  \ 运算符\n\n\n\n\n\n\n\n*   JavaScript 历史\n*   JavaScript 特性\n## 目标\n*   学习什么是 JavaScript\n\
  *   了解早期的浏览器大战\n\n\n\nJavaScript 是**万维网**（**WWW**）的核心技术之一。JavaScript 是一种高级、解释型编程语言，这意味着它的大多数指令可以直接执行，而无需编译。JavaScript\
  \ 最吸引人的特性是它能够让网页具有交互性。JavaScript 语言支持动态类型、函数、基于原型的面向对象以及大量的 API，允许你处理数组、文本、正则表达式、日期和**文档对象模型**（**DOM**）。\n\
  JavaScript 最初仅在网络浏览器的客户端实现，但现在，JavaScript 引擎已嵌入到许多其他类型的宿主软件中，包括：\n*   Web 服务器和数据库中的服务端\n\
  *   允许使用 编写移动和桌面应用程序的运行时环境\n通过嵌入其他类型的宿主，这些软件使得 JavaScript 更加多功能、强大，并且对跨平台的变化更有适应性。\n\
  # JavaScript 历史\n为了更深入地了解 JavaScript 的历史，让我们快速看看“浏览器战争”这个术语。\n# 浏览器战争\n顾如其名，浏览器战争是浏览器之间的竞争，主要是关于市场份额的竞争。在\
  \ 20 世纪 90 年代后期，第一次浏览器战争发生在微软 Internet Explorer 和 Netscape Navigator 之间。\n第一次浏览器战争从\
  \ 1995 年开始，持续到 2001 年。Netscape Navigator 曾是最广泛使用的网络浏览器，因为微软在 1995 年 8 月仅作为 Windows\
  \ 95 Plus! 包的一部分发布了 Internet Explorer 1.0。\n三个月后，微软免费下载发布了 Internet Explorer 2.0。Internet\
  \ Explorer 4 改变了一切。Internet Explorer 4 被集成到 Microsoft Windows 中，这导致了 Netscape Navigator\
  \ 的衰落，因为用户觉得在已经有 Internet Explorer 浏览器的情况下，没有必要下载另一个浏览器。\n第一次浏览器战争结束时，Internet Explorer\
  \ 在其市场份额上已没有其他严肃的竞争对手，从而结束了 Web 浏览器的快速创新。\n随着 Internet Explorer 使用份额的下降以及 Firefox、Google\
  \ Chrome、Safari、Opera 等浏览器的流行，浏览器战争在 21 世纪 10 年代初加剧。\n# JavaScript 的诞生\nNetscape\
  \ Communications 的创始人 Marc Andreessen 设想了一种更具动态的 Web 体验。他不想只显示无法兼顾用户活动的静态网页，他想要更多。问题在于，想要一种包含自动化、动画和基础用户交互的更动态\
  \ Web 体验，需要一种轻量级的脚本语言，这种语言要让非程序员也能使用，并且能够与 `DOM` 直接交互。\nMocha 出生了。Mocha 将成为一种简单且动态的\
  \ Web 脚本语言。JavaScript 之父 Brendan Eich 出现了。Netscape Communications 聘请 Eich 为他们的浏览器开发\
  \ Scheme（一种轻量级 Lisp 方言）。Scheme 是强大、动态且函数式的。几个月后，Mocha 的原型在 1995 年 5 月集成到 Netscape\
  \ Communicator 中。不久后，它被更名为 LiveScript。1995 年 12 月，Mocha/LiveScript 被更名为 JavaScript，并作为一种用于客户端浏览器任务的脚本语言推出。\n\
  # 为什么选择 JavaScript?\n很难想象一个没有 JavaScript 的 Web。\n# JavaScript 特性\nJavaScript 是世界上最流行的语言之一。它被用于创建交互式网站、移动应用，甚至是服务端应用程序。JavaScript\
  \ 是一种多功能且灵活的语言，可以用于各种任务。\nJavaScript 的一些特性包括：\n*   动态类型\n*   基于原型的面向对象\n*   异步编程\n\
  JavaScript 是一门强大的语言，为开发者提供了许多机会。如果你对 Web 开发感兴趣，学习 JavaScript 是必修之路。\n# JavaScript\
  \ 特性总结\n在本章中，我们探索了 JavaScript 的历史及其特性。我们还学习了为什么 JavaScript 是一门强大且多功能的语言。在下一章中，我们将学习更多关于\
  \ JavaScript 对象以及如何使用它们。\n## 问题\n1. 谁创建了 JavaScript？\n3. 写出 JavaScript 的四个特性。\n\
  5. JavaScript 相比 HTML 有什么优势？\n# 第 2 章\n## JavaScript 对象\n## 引言\n在任何编程语言中，对象都是任何应用程序的基石。在对象内部存储信息并检索其值对于速度至关重要。\n\
  在对象内部存储信息并利用它们有许多方法。我们将学习 JavaScript 对象是什么，然后快速查看原始类型（primitives）。我们将通过五种方式创建对象。最后，我们将探索\
  \ `this` 关键字以及它的含义在不同用法下的何不同。\n## 结构\n*   JavaScript 对象\n*   `this` 关键字\n## 目标\n\
  *   理解 JavaScript 对象以及如何创建它们\n*   学习如何创建对象\n*   理解并使用 `this` 关键字\n## JavaScript\
  \ 对象\n对象是具有属性和方法的东西。属性描述对象。方法是该对象可以执行的操作。基本上，在 JavaScript 中，万物皆可对象。除了原始类型外，所有的 JavaScript\
  \ 值都是对象。在详细介绍内置对象之前，让我们先探索原始类型。\n## 原始值和原始数据类型\n原始值是不具有属性或方法的值。原始数据类型就是具有原始值的数据。JavaScript\
  \ 有 7 种原始数据类型。它们是：\n*   string\n*   bigint\n*   null\n*   symbol\n让我们逐一个探索这些原始数据类型。\n\
  ### string\n字符串代表文本数据。如果允许我表现得技术化一点：JavaScript 字符串原始数据类型简单来说是一组 16 位无符号整数值的集合。字符串中的每个项目都占据字符串中的一个位置，从\
  \ 0 开始。\n### number\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nvar objStudent = {\nCourse:”JavaScript”,\n\
  };\n\n\n\n\n-   `new` 关键字\n-   `Object.assign()`\n\n\n\n\nvar objCar = {\nmodel:\
  \ “i8 Roadster”,\n};\n\n\n\nconsole.log(objCar); // 输出 {make: “BMW”, model: “i8\
  \ Roadster”, price: 2329300}\nconsole.log(objCar.model); // 输出 i8 Roadster\n```\n\
  让我们把这些内容整合在一个小练习中：\n1.  打开你任的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n```html\n<html>\n\
  <h1>Object literal syntax</h1>\n<script>\nmake : “BMW”,\nprice : 2329300\nconsole.log(objCar);\
  \ // 输出 {make: “BMW”, model: “i8 Roadster”, price: 2329300}\nconsole.log(objCar.model);\
  \ // 输出 i8 Roadster\n</script>\n</html>\n\n\n\n\n\n-   使用 `new` 配合自定义构造函数\n让我们探索一下区别。\n\
  ### 使用 ‘new’ 配合内置对象函数\n在基于类的面向对象编程 (`OOP`) 中，构造函数是一种特殊的子程序，用于创建对象。构造函数通过初始化对象的成员为新对象做好准备。要创建一个新对象，必须使用\
  \ `new` 关键字配合 `Object()` 构造函数，如下所示：\n```javascript\n```\n这创建并初始化了一个名为 `house` 的新对象。我们可以使用下面的代码为此对象添加属性：\n\
  ```javascript\nhouse.bathrooms = 2;\nhouse.hasSwimmingPool = false;\n```\n你可以看到，为使用\
  \ `Object()` 构造函数创建的对象属性可能会变成一项繁琐的任务，并且涉及大量的输入工作。我们上面创建的 `house` 对象具有 `bedrooms`\
  \ 属性、`bathrooms`、`garages`，以及表示是否存在游泳池或外墙的布尔值属性。\n如果我们必须创建数百个 `house` 对象怎么办？让我们看看如何通过使用自定义构造函数让这段代码更短一些。\n\
  ### 使用 ‘new’ 配合自定义构造函数\n在创建自定义构造函数时，你基本上是为对象的属性和方法创建了一个模板。你只需要创建一次函数，然后向它传递必要的属性，而不是像之前在“使用\
  \ `new` 配合内置对象构造函数”部分所示那样手动输入每个属性和每个设置。\n让我们再次以 `house` 对象为例创建自定义构造函数：\n```javascript\n\
  \    this.bedRooms = _bed;\n    this.garages = _garage;\n    this.hasOutsideWalls\
  \ = _walls;\n```\n构造函数的名称是 `House`。括号内有五个参数：`_bed`、`_bath`、`_garage`、`_pool` 和 `_walls`。这些参数将用于向\
  \ `House` 函数传递信息。在构造函数内部，每个属性都被赋值为它自己的参数。记住，这仅仅是一个模板，目前还没有值。\n现在我们有了构造函数，根据它来创建对象就很简单了。方法如下：\n\
  ```javascript\nvar houseTwo = new House(3, 1, 1, true, false);\n\n\n\n\nthis.garages\
  \ = _garage;\nthis.hasOutsideWalls = _walls;\nvar houseOne = new House(4, 2, 2,\
  \ false, true);\nconsole.log(houseOne);\n```\n</script>\n</html>\n\n\n\n\n\n\n\n\
  \n\n\nlet Course = {name: ‘Web Programming’}\n\n\nlet Subject = Object.create(Course,\
  \ { name:{ value: ‘JavaScript’ } });\nconsole.log(Subject.Course); //Output: Web\
  \ Programming\n\n\n\n\n\nlet Course = {Coursename: ‘Web Programming’}\n```\n你有一个\
  \ `Student` 对象正在学习 `Web Programming` 课程，并且目前正忙于名为 `JavaScript` 的科目。你可以通过 `Object.assign`\
  \ 的帮助来实现这一点，如下所示：\n```javascript\n```\n现在，你有一个 `Student` 对象，它将 `Coursename` 和 `Subjectname`\
  \ 作为其属性：\n```javascript\nconsole.log(Student.Subjectname) //Output: JavaScript\n\
  \n\n<!DOCTYPE html>\n<body>\n<p>以下代码创建了一个 JavaScript 对象并在浏览器的控制台窗口中显示其结果</p>\nlet\
  \ Course = {Coursename: ‘Web Programming’}\nlet Student = Object.assign({}, Course,\
  \ Subject);\nconsole.log(Student.Subjectname) //Output: JavaScript\n</body>\n```\n\
