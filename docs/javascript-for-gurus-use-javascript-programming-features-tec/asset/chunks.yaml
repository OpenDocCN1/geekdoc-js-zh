  trans: "\n\n### 3. 双击文件并在默认浏览器中打开它。\n\n一旦加载，该网页将连续产生四个警告框（alert boxes）。在上面的示例中，输出了以下答案：\n\
    \n`名为 a 的变量值为 -1\\.` ` `这是因为我们对其进行了取反，将其变为负数。`\n\n`名为 b 的变量值为 1\\.` ` `它没有变化，因为已经是正数了。`\n\
    \n`名为 c 的变量值为 6\\.` ` `我们在它现有的值 5 的基础上加了 1。`\n\n`名为 d 的变量值为 4\\.` ` `我们在它现有的值\
    \ 5 的基础上减去了 1。`\n\n# 二元运算符\n\n当一个运算符是二元的时，它有两个操作数。下面的示例展示了一些二元运算符的操作：\n\n1. 打开你任选的文本编辑器，并输入以下\
    \ HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Binary Operators</h1>\n\
    \  <p>The following code demonstrates Binary operations on operands</p>\n  <script>\n\
    \    let a = 1;\n    let b = 2;\n    let c = 5;\n    let d = 2;\n    var e;\n\
    \    a = a + b;\n    alert( a ); // 3, 将 b 的值加到 a 上\n    b = b - c;\n    alert(\
    \ b ); // -1, 从 b 中减去 c 的值\n    e = c % d;\n    alert( e ); // 1, 余数为 1\n  </script>\n\
    </body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 4.2.html`。\n\n3. 双击文件并在默认浏览器中打开它。\n\
    \n一旦加载，该网页将连续产生三个警告框。在上面的示例中，输出了以下答案：\n\n`名为 a 的变量值为 3\\.` ` `这是因为将 b 的值加到了 a。`\n\
    \n`名为 b 的变量值为 -1\\.` ` `从 b 中减去了 c 的值。`\n\n`名为 e 的变量值为 1\\.` ` `余数为 1。`\n\n# 三元运算符\n\
    \n三元运算符是一种接受三个操作数的运算符。下面的示例展示了一些二元运算符的操作（注：此处原文应为三元运算符）：\n\n1. 打开你任选的文本编辑器，并输入以下\
    \ HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Ternary Operators</h1>\n\
    \  <p>The following code demonstrates Ternary operations on operands</p>\n  <script>\n\
    \    // 常规 if 条件\n    var age = 21;\n    var canEnterCollege;\n    if (age > 18)\
    \ {\n      canEnterCollege = “Old enough”;\n    }\n    else {\n      canEnterCollege\
    \ = “Too young”;\n    }\n    alert(canEnterCollege);\n    // 使用三元条件运算符简化\n   \
    \ var canEnterCollege = (age < 18) ? “Too young” : “Old enough”;\n    alert(canEnterCollege);\n\
    \  </script>\n</body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 4.2.html`。\n\
    \n3. 双击文件并在默认浏览器中打开它。\n\n一旦加载，该网页将连续产生两个警告框。在上面的示例中，输出了以下答案。\n\n名为 `canEnterCollege`\
    \ 的变量值为 `21`。在第一个控制流语句中（我们将在 *第 13 章：控制流语句* 中介绍控制流语句），我们测试变量 `canEnterCollege`\
    \ 是否大于 `18`。如果是，警告框将显示 `old enough`；`else`，另一个警告框将显示 `Too young`。\n\n在代码的最后部分，注意同时同时使用了\
    \ `?` 和 `:`。条件写在括号中——在本例中，为 `age < 18`。如果条件为真，则执行 `?`（问号）旁边的代码；如果条件为假（`age` 不小于\
    \ 18），则触发 `:`（冒号）旁边的代码。\n\n# 运算符优先级\n\n如果表达式包含多个运算符，其执行顺序由它们的优先级顺序定义，即优先级。下表显示了\
    \ JavaScript 中的运算符优先级：\n\n| 运算符类型 | 逐个运算符 |\n| :--- | :--- |\n| 分组 | `()` |\n\
    | 成员访问 | `.` |\n| 计算的成员访问 | `[ ]` |\n| new (带参数列表) | `new ( )` |\n| 函数调用 | `(\
    \ )` |\n| 可选链 | `?.` |\n| new (不带参数列表) | `new` |\n| 后置递增 | `++` |\n| 后置递减 | `--`\
    \ |\n| 逻辑非 | `!` |\n| 按位非 | `~` |\n| 一元加号 | `+` |\n| 一元取反 | `-` |\n| 前缀递增 | `++`\
    \ |\n| 前缀递减 | `--` |\n| 一元类型 | `typeof` |\n| 一元 void | `void` |\n| 一元删除 | `delete`\
    \ |\n| 一元 await | `await` |\n| 幂 | `**` |\n| 乘法 | `*` |\n| 除法 | `/` |\n| 余数 |\
    \ `%` |\n| 加法 | `+` |\n| 减法 | `-` |\n| 按位左移 | `<<` |\n| 按位右移 | `>>` |\n| 无符号符号右移\
    \ | `>>>` |\n| 小于 | `<` |\n| 小于或等于 | `<=` |\n| 大于 | `>` |\n| 大于或等于 | `>=` |\n\
    | 在 | `in` |\n| 实例类型 | `instanceof` |\n| 等于 | `==` |\n| 不等于 | `!=` |\n| 严格相等 |\
    \ `===` |\n| 严格不相等 | `!==` |\n| 按位与 | `&` |\n| 按位异或 | `^` |\n| 按位或 | `|` |\n|\
    \ 逻辑与 | `&&` |\n| 逻辑或 | `||` |\n| 空值合并 | `??` |\n| 逗号 | `,` |\n\n### 还没有结束\n\n\
    到为止我们学习了许多函数和各种运算符，但我们可以使用运算符来拼接字符串。字符串将在 *第 12 章：原始类型* 中介绍，并在 *第 2 章：对象* 中提到过。\n\
    \n运算符可以用于判断类型，还有按位运算符。我们将在后续内容介绍它们。\n\n### 总结\n\n在本章中，我们探索了运算符的世界。我们学习了什么是运算符，以及它们不同的类型和分组。我们对一元、二元和三元运算符进行了一些有趣的示例。最后，我们对运算符优先级进行了简单的介绍。\n\
    \n# 第 5 章\n\n# JavaScript 函数\n\n### 引言\n\n函数让事情发生。我们作为程序员编写函数是为了在代码中重复使用。每个函数在何时可以使用或何时应该触发，这取决于调用（invocation）。我们向函数传递信息以产生相似但又不同的结果。\n\
    \n### 结构\n\n* 什么是函数？\n* 函数声明\n* 参数\n* 默认值\n* 函数表达式\n\n### 目标\n\n* 理解函数\n* 学习如何声明函数\n\
    * 学习函数参数\n* 理解函数表达式\n\n"
- fmt: "\nIn layman’s terms, a `function` is a block of code that returns a certain\
    \ value. It can be compared to a little subprogram inside a script or program\
    \ that is invoked (or called) from another method or function. The calling method\
    \ or function or object makes use of the value that gets returned by the invoked\
    \ function. A function should always return a value. If no return value is specified,\
    \ a value of `undefined` gets returned.\n\nFunctions in JavaScript are first-class\
    \ objects meaning that they can have properties and methods. Any function consists\
    \ of a declaration or expression, optional parameters, and default values.\n\n\
    # Function declaration\n\nBy declaring a function, you tell the interpreter that\
    \ the function should be stored in memory for later use. This will occur when\
    \ the function is called or invoked from somewhere in the code. To declare a function,\
    \ you should use code similar to the following:\n\n```javascript\nfunction functionName(parameters)\
    \ {\n  // code block\n}\n```\n\nThe keyword `function` gets written first. This\
    \ is to tell the interpreter that you are creating a function. The name follows\
    \ the `function` keyword. It can be any name, except for a JavaScript keyword,\
    \ and remember that it is case sensitive. Inside the brackets, you can include\
    \ a list of parameters separated by commas. Here is a small example:\n\n```javascript\n\
    function showGreeting() {\n  alert(‘Good morning!’\n}\n```\n\nIn the code segment\
    \ above, a function named `showGreeting` is created without any parameters, and\
    \ displays an alertbox with the message `Good morning!` inside.\n\n### You have\
    \ a function, now what?\n\nWell, the function cannot run without being invoked\
    \ (or called) from somewhere. When invoking a function, you simply reference the\
    \ function name and include its optional parameters. A function can be invoked\
    \ from any of the following:\n\n* When an event occurs\n* When it’s invoked directly\n\
    * Self-Invoked\n\n# Event-invoked function example\n\nHere is an example of how\
    \ a function can be invoked from an event such as a button click, or mouse move:\n\
    \n1. Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n```html\n<html>\n<body>\n  <h1>Invoke function from button click</h1>\n\
    \  <p>The following code Calls a function from a button click</p>\n  <script>\n\
    \    function showGreeting() {\n      alert(‘Good morning!’);\n    }\n  </script>\n\
    \  <button onclick=”showGreeting()\">Greeting</button>\n</body>\n</html>\n```\n\
    \n2. Save the file with an HTML extension, for example `Chapter 5.1.html`.\n3.\
    \ Double-click the file to open it in the default browser.\n\nAs you will see,\
    \ the page loads normally, and there is no alertbox popping up yet. This is because\
    \ we have invoked the function from the button’s click event. If the button is\
    \ not clicked, then the function will not get executed.\n\nClick the button, and\
    \ notice the message that pops up, as shown in the following screenshot:\n\n![](images/Img_05_01.jpg)\n\
    \n**Figure 5.1:** Function invoked from a button click\n\n# Directly invoked function\
    \ example\n\nHere is an example of how a function can be invoked directly:\n\n\
    1. Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n```html\n<html>\n<body>\n  <h1>Invoke function directly</h1>\n  <p>The\
    \ following code Calls a function just after the function is created</p>\n  <script>\n\
    \    function showGreeting() {\n      alert(‘Good morning!’);\n    }\n    showGreeting();\n\
    \  </script>\n</body>\n</html>\n```\n\n2. Save the file with an HTML extension,\
    \ for example `Chapter 5.2.html`.\n3. Double-click the file to open it in the\
    \ default browser.\n\n# Self-invoked function example\n\nHere is an example of\
    \ how a function can be invoked automatically. Meaning it is a function, but there\
    \ is no need to add a separate call to it in order to invoke it, as it invokes\
    \ itself:\n\n1. Open a text editor of your choice and enter the following HTML\
    \ and JavaScript code:\n\n```html\n<html>\n<body>\n  <h1>Self-Invoke function\
    \ expression</h1>\n  <p>The following code creates a function and invokes it automatically</p>\n\
    \  <script>\n    (function showGreeting(){\n      alert(‘Good morning!’);\n  \
    \  })()\n  </script>\n</body>\n</html>\n```\n\n2. Save the file with an HTML extension,\
    \ for example `Chapter 5.3.html`.\n3. Double-click the file to open it in the\
    \ default browser.\n\nThe function declaration looks a bit different here the\
    \ reason for this is because we have now created a function expression (we will\
    \ cover function expressions later in this chapter). The function named `showGreeting`\
    \ is created and executed automatically without having to invoke it.\n\n# Parameters\n\
    \nA parameter or function argument is an extra piece of data that can be passed\
    \ to a function. The function can then use and manipulate the parameter in any\
    \ way it pleases. Another benefit of including parameters in functions is that\
    \ you can pass different values as parameters, and the function will still work\
    \ accordingly.\n\nHere is an example of how you can send different values to a\
    \ function by using its parameters:\n\n1. Open a text editor of your choice and\
    \ enter the following HTML and JavaScript code:\n\n```html\n<html>\n<body>\n \
    \ <h1>Function Parameters</h1>\n  <p>The following code creates a function with\
    \ parameters and makes use of the parameters inside the function</p>\n  <script>\n\
    \    function showGreeting(from, message) { // arguments: from, message\n    \
    \  alert(from + ‘: ‘ + message);\n    }\n    showGreeting(‘Ockert’, ‘Hello!’);\
    \ // Outputs - Ockert: Hello!\n    showGreeting(‘BpB’, “Hi!”); // Outputs - BPB:\
    \ Hi!\n  </script>\n</body>\n</html>\n```\n\n2. Save the file with an HTML extension,\
    \ for example `Chapter 5.4.html`.\n3. Double-click the file to open it in the\
    \ default browser.\n\nA function named `showGreeting` is declared with two parameters,\
    \ `from` and `message`. Inside the code block, an alert box is called with the\
    \ values copied into the parameters. The first call to the `showGreeting` function\
    \ includes: `Ockert`, `Hello!`. The second call to the `showGreeting` function\
    \ includes: `BpB`, `Hi!`. When this script is run, you will see two alert boxes\
    \ popping up after each other. The first alert contains the input data; the second\
    \ contains the last input data.\n\n# Default values\n\nWhen a parameter is not\
    \ provided, its value becomes `undefined`. For instance, if you do this:\n\n```javascript\n\
    function showGreeting(from, message) { // arguments: from, message\n  alert(from\
    \ + ‘: ‘ + message);\n}\nshowGreeting(‘Ockert’); // Outputs - Ockert: undefined\n\
    ```\n\nIt is perfectly acceptable, and the interpreter will not produce an error.\
    \ This is where default values come in. You can give a parameter a default value\
    \ so that if a value is not supplied, it still has a set default value that can\
    \ be used.\n\nHere is small example:\n\n```javascript\nfunction showGreeting(from,\
    \ message = ‘Hey there!’) { // arguments: from, message\n  alert(from + ‘: ‘ +\
    \ message);\n}\nshowGreeting(‘Ockert’); // Outputs - Ockert: Hey there!\n```\n\
    \n# Function expressions\n\nJavaScript functions can also be defined by using\
    \ expression and usually stored inside a variable. This variable can then be used\
    \ as a function. Here is a small example:\n\n```javascript\nvar answer = function\
    \ (operand1, operand2) {return operand1 * operand2};\n```\n\nIn `Chapter 12: Variables`,\
    \ we will go into much greater detail on variables and functions.\n\n# Conclusion\n\
    \nIn this chapter, welearnt `JavaScript` functions with some nice examples. We\
    \ learned how `Functions` can improve our code, and how we can improve it further\
    \ by using parameters and default values. A bit later in this book (in `Chapter\
    \ 12: Variables`) we will come back to functions again and explore the world of\
    \ `function expressions`.\n"
  raw: "In layman’s terms, a function is a block of code that returns a certain value.\
    \ It can be compared to a little subprogram inside a script or program that is\
    \ invoked (or called) from another method or function. The calling method or function\
    \ or object makes use of the value that gets returned by the invoked function.\
    \ A function should always return a value. If no return value is specified, a\
    \ value of undefined gets returned.\n\nFunctions in JavaScript are first-class\
    \ objects meaning that they can have properties and methods. Any function consists\
    \ of a declaration or expression, optional parameters, and default values.\n\n\
    # [Function declaration](#toc.xhtml_s86a)\n\nBy declaring a function, you tell\
    \ the interpreter that the function should be stored in memory for later use.\
    \ This will occur when the function is called or invoked from somewhere in the\
    \ code. To declare a function, you should use code similar to the following:\n\
    \n`function functionName(parameters) {`\n\n`// code block`\n\n`}`\n\nThe keyword\
    \ `function` gets written first. This is to tell the interpreter that you are\
    \ creating a function. The name follows the `function` keyword. It can be any\
    \ name, except for a JavaScript keyword, and remember that it is case sensitive.\
    \ Inside the brackets, you can include a list of parameters separated by commas.\
    \ Here is a small example:\n\n`function showGreeting() {`\n\n`alert( ‘Good morning!’`\
    \ `);`\n\n`}`\n\nIn the code segment above, a function named `showGreeting` is\
    \ created without any parameters, anddisplays an alertbox with the message `Good\
    \ morning!` inside.\n\nYou have a function, now what?\n\nWell, the function cannot\
    \ run without being invoked (or called) from somewhere. When an invoking a function,\
    \ you simply reference the function name and include its optional parameters.\
    \ A function can be invoked from any of the following:\n\n*   When an event occurs\n\
    \n*   When it’s invoked directly\n\n*   Self-Invoked\n\n# [Event-invoked function\
    \ example](#toc.xhtml_s87a)\n\nHere is an example of how a function can be invoked\
    \ from an event such as a button click, or mouse move:\n\n1.  Open a text editor\
    \ of your choice and enter the following HTML and JavaScript code:\n\n    `<html>`\n\
    \n    `<body>`\n\n    `<h1>Invoke function from button click</h1>`\n\n    `<p>The\
    \ following code Calls a function from a button click</p>`\n\n    `<script>`\n\
    \n    `function showGreeting() {`\n\n    `alert( ‘Good morning!’` `);`\n\n   \
    \ `}`\n\n    `</script>`\n\n    `<button onclick=”showGreeting()”>Greeting</button>`\n\
    \n    `</body>`\n\n    `</html>`\n\n2.  Save the file with an HTML extension,\
    \ for example `Chapter 5.1.html`.\n\n3.  Double-click the file to open it in the\
    \ default browser.\n\nAs you will see, the page loads normally, and there is no\
    \ alertbox popping up yet. This is because we have invoked the function from the\
    \ button’s click event. If the button is not clicked, then the function will not\
    \ get executed.\n\nClick the button, and notice the message that pops up, as shown\
    \ in the following screenshot:\n\n![](images/Img_05_01.jpg)\n\n**Figure 5.1:**\
    \ Function invoked from a button click\n\n# [Directly invoked function example](#toc.xhtml_s88a)\n\
    \nHere is an example of how a function can be invoked directly:\n\n1.  Open a\
    \ text editor of your choice and enter the following HTML and JavaScript code:\n\
    \n    `<html>`\n\n    `<body>`\n\n    `<h1>Invoke function directly</h1>`\n\n\
    \    `<p>The following code Calls a function just after the function is created</p>`\n\
    \n    `<script>`\n\n    `function showGreeting() {`\n\n    `alert( ‘Good morning!’`\
    \ `);`\n\n    `}`\n\n    `showGreeting();`\n\n    `</script>`\n\n    `</body>`\n\
    \n    `</html>`\n\n2.  Save the file with an HTML extension, for example `Chapter\
    \ 5.2.html`.\n\n3.  Double-click the file to open it in the default browser.\n\
    \n# [Self-invoked function example](#toc.xhtml_s89a)\n\nHere is an example of\
    \ how a function can be invoked automatically. Meaning it is a function, but there\
    \ is no need to add a separate call to it in order to invoke it, as it invokes\
    \ itself:\n\n1.  Open a text editor of your choice and enter the following HTML\
    \ and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>Self-Invoke\
    \ function expression</h1>`\n\n    `<p>The following code creates a function and\
    \ invokes it automatically</p>`\n\n    `<script>`\n\n    `(function showGreeting(){`\n\
    \n    `alert( ‘Good morning!’` `);`\n\n    `})()`\n\n    `</script>`\n\n    `</body>`\n\
    \n    `</html>`\n\n2.  Save the file with an HTML extension, for example `Chapter\
    \ 5.3.html`.\n\n3.  Double-click the file to open it in the default browser.\n\
    \nThe function declaration looks a bit different here the reason for this is because\
    \ we have now created a function expression (we will cover function expressions\
    \ later in this chapter). The function named `showGreeting` is created and executed\
    \ automatically without having to invoke it.\n\n# [Parameters](#toc.xhtml_s90a)\n\
    \nA parameter or function argument is an extra piece of data that can be passed\
    \ to a function. The function can then use and manipulate the parameter in any\
    \ way it pleases. Another benefit of including parameters in functions is that\
    \ you can pass different values as parameters, and the function will still work\
    \ accordingly.\n\nHere is an example of how you can send different values to a\
    \ function by using its parameters:\n\n1.  Open a text editor of your choice and\
    \ enter the following HTML and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\
    \n    `<h1>Function Parameters</h1>`\n\n    `<p>The following code creates a function\
    \ with parameters and makes use of the parameters inside the function</p>`\n\n\
    \    `<script>`\n\n    `function showGreeting(from, message) { // arguments: from,\
    \ message`\n\n    `alert(from + ‘: ‘ + message);`\n\n    `}`\n\n    `showGreeting(‘Ockert’,\
    \ ‘Hello!’); // Outputs - Ockert: Hello!`\n\n    `showGreeting(‘BpB’, “Hi!”);\
    \ // Outputs - BPB: Hi!`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\
    \n2.  Save the file with an HTML extension, for example `Chapter 5.4.html`.\n\n\
    3.  Double-click the file to open it in the default browser.\n\nA function named\
    \ `showGreeting` is declared with two parameters, from and message. Inside the\
    \ code block, an alert box is called with the values copied into the parameters.\
    \ The first call to the `showGreeting` function includes:\n\n**`Ockert`**\n\n\
    **`Hello!`**\n\nThe second call to the `showGreeting` function includes:\n\n**`BpB`**\n\
    \n**`Hi!`**\n\nWhen this script is run, you will see two alert boxes popping up\
    \ after each other. The first alert contains the first input data; the second\
    \ contains the last input data.\n\n# [Default values](#toc.xhtml_s91a)\n\nWhen\
    \ a parameter is not provided, its value becomes undefined. For instance, if you\
    \ do this:\n\n`function showGreeting(from, message) { // arguments: from, message`\n\
    \n`alert(from + ‘: ‘ + message);`\n\n`}`\n\n`showGreeting(‘Ockert’); // Outputs\
    \ - Ockert: undefined`\n\nIt is perfectly acceptable, and the interpreter will\
    \ not produce an error. This is where default values come in. You can give a parameter\
    \ a default value so that if a value is not supplied, it still has a set default\
    \ value that can be used.\n\nHere is small example:\n\n`function showGreeting(from,\
    \ message = ‘Hey there!’) { // arguments: from, message`\n\n`alert(from + ‘: ‘\
    \ + message);`\n\n`}`\n\n`showGreeting(‘Ockert’); // Outputs - Ockert: Hey there!`\n\
    \n# [Function expressions](#toc.xhtml_s92a)\n\nJavaScript functions can also be\
    \ defined by using expression and is usually stored inside a variable. This variable\
    \ can then be used as a function. Here is a small example:\n\n`var answer = function\
    \ (operand1, operand2) {return operand1 * operand2};`\n\nIn *[Chapter 12: Variables](#c12.xhtml)*,\
    \ we will go into much greater detail on variables and functions.\n\n# [Conclusion](#toc.xhtml_s93a)\n\
    \nIn this chapter, welearnt JavaScript functions with some nice examples. We learned\
    \ how Functions can improve our code, and how we can improve it further by using\
    \ parameters and default values. A bit later in this book (in *[Chapter 12: Variables](#c12.xhtml)*)\
    \ we will come back to functions again and explore the world of function expressions."
