    The `Number` type is a double-precision 64-bit binary value. It can hold floating-point
    numbers or integers between `-(2^(53) -1)` and `(2^(53) -1)`. The number type
    also has three special values: `+Infinity`, `-Infinity`, and `NaN` (not-a-number).
    The constants `Number.MAX_VALUE` and `Number.MIN_VALUE` can be used to determine
    the largest or smallest value within `+Infinity` and `-Infinity`. You can also
    check if a number is in the double-precision floating-point range by using `Number.isSafeInteger()`
    or `Number.MAX_SAFE_INTEGER` and `Number.MIN_SAFE_INTEGER`.


    # Number properties](#toc.xhtml_s198a)


    The number of primitive types has the following properties:


    | Property | Description |

    | :--- | :--- |

    | `EPSILON` | Smallest interval between 2 representable numbers |

    | `MAX_SAFE_INTEGER` | Maximum safe integer |

    | `MAX_VALUE` | Largest positive representable number |

    | `MIN_SAFE_INTEGER` | Minimum safe integer |

    | `MIN_VALUE` | The positive number closest to zero |

    | `NaN` | Not a Number |

    | `NEGATIVE_INFINITY` | Negative infinity |

    | `POSITIVE_INFINITY` | Positive infinity |


    **Table 12.3:** Number properties


    Now that we have been acquainted with the properties of the number type let’s
    have a look at its methods.


    # Number methods](#toc.xhtml_s199a)


    The number of primitive types has the following methods:


    | Method | Description |

    | :--- | :--- |

    | `isFinite` | Is the value a finite number? |

    | `isInteger` | Is the value an integer (whole number)? |

    | `isNaN` | Is the value not a number? |

    | `isSafeInteger` | Is the value an integer between `-(253 -1)` and `(253 -1)`
    |

    | `parseFloat` | Parses an argument to a floating-point number |

    | `parseInt` | Parses an argument to an integer number |

    | `prototype.toExponential` | String in Exponential notation |

    | `prototype.toFixed` | Fixed-point notation |

    | `prototype.toLocaleString` | language sensitive representation of the number
    |

    | `prototype.toPrecision` | Represents a number to a specified precision in fixed-point
    or exponential notation |

    | `prototype.toSource` | object literal of the Number object |

    | `prototype.toString` | String representation of the number |

    | `prototype.valueOf` | Returns primitive value of object |


    **Table 12.4:** Number methods


    Let’s do a quick exercise! The following sample demonstrates the use of a few
    numbers of methods:


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>Number methods</h1>

    <p>Number methods</p>

    <script>

    var num = 9.76386;

    var n = num.toExponential(3);

    document.writeln("<br />" + n);

    var x = 6.351;

    x.toFixed(2);

    document.writeln("<br />" + x);

    var numObj = new Number(42);

    var nn = numObj.valueOf();

    document.writeln("<br />" + nn);

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 12.4.html`.

    3.  Double-click the file to open it in the default browser.


    As you can see, it is quite easy working with the methods of numbers. In the above
    exercise, you display the exponential value of a number, get a fixed value of
    another number and display the value of a third number. *[Figure 12.4](#c12.xhtml_fig12_4)*
    shows the result:


    ![](images/Img_12_04.jpg)


    **Figure 12.4:** Number methods


    Speaking of numbers, let’s have a quick peek into the `BigInt` primitive type.


    # BigInt](#toc.xhtml_s200a)


    You may be wondering about the limits of the number primitive. Just a quick refresher:
    it is between `-(2^(53) -1)` and `(2^(53) -1)`. Now, what if you have a larger
    number? This is where `BigInt` comes in. `BigInt` represents whole numbers larger
    than `(2^(53) -1)`. It is quite easy to create a `BigInt`, all you need to do
    is to add an `n` to the integer literal, or by calling the function `BigInt()`.


    Let’s do a quick exercise! The following sample demonstrates how to create BigInts:


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>Creating BigInts</h1>

    <p>Creating BigInts</p>

    <script>

    const num1 = 9007199254740991n;

    const num2= BigInt(9007199254740991);

    const num3 = BigInt("9007199254740991");

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 12.5.html`.

    3.  Double-click the file to open it in the default browser.


    Notice the `n` I appended after the long number when I created the `num1` object.
    `num2` is created with the `BigInt` function and `num3` as well, but a string
    is supplied for `num3` which gets converted into a `BigInt` number.


    # Null versus undefined](#toc.xhtml_s201a)


    Null means nothing. It is the intentional absence of value. Undefined means that
    the variable has been created, but it hasn’t been assigned a value.


    A quick example may help; let’s see. The following sample demonstrates how to
    create BigInts:


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>null versus undefined</h1>

    <p>null versus undefined</p>

    <script>

    var nullVar = null;

    if (nullVar)

    document.writeln("<br />nullVar is not null");

    else

    document.writeln("<br />nullVar is null");

    var undefinedVar;

    document.writeln("<br />" + undefinedVar);

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 12.6.html`.

    3.  Double-click the file to open it in the default browser.


    Here I created a variable named `nullVar` and initialized it to `null`. This means
    that there is no value, so the `if` statement checking the value of the `nullVar`
    variable will produce a written line stating that `nullVar` is null.


    I then created another variable named `undefinedVar` and didn’t give it a value.
    The line that will get written will state that `undefinedVar` is undefined. Why?
    Because the object is created but isn’t populated with any value. *[Figure 12.5](#c12.xhtml_fig12_5)*
    shows the code in action:


    ![](images/Img_12_05.jpg)


    **Figure 12.5:** Null versus undefined


    # Boolean](#toc.xhtml_s202a)


    Now that we know how to store numeric and string values as well as complicated
    values such as null and undefined, we can move on to a simpler primitive named
    Boolean.


    A Boolean value is a value that can either be true or false. If it is not true,
    it is false and vice versa. Booleans are quite commonly used in binary options
    such as male or female, or cold and hot, and so on. Boolean contains no methods
    and only has a `length` property.


    A quick way to see a Boolean in action is to do another exercise.


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>Boolean example</h1>

    <p>Boolean example</p>

    <script>

    var varYES = true;

    var varNO = false;

    if(varYES)

    {

    alert("This code executes");

    }

    if(varNO)

    {

    alert("This code does not execute");

    }

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 12.7.html`.

    3.  Double-click the file to open it in the default browser.


    As you can see, I have made use of another if statement here, actually two `if`
    statements. I will go into greater detail on if statements in *[Chapter 13: Control
    Flow Statements](#c13.xhtml)*. These if statements check to see what value the
    passed object contains. If it contains a true value, the code inside its block
    will be executed, as shown in *[Figure 12.6](#c12.xhtml_fig12_6)*:


    ![](images/Img_12_06.jpg)


    **Figure 12.6:** Boolean test


    The last primitive I’d like to talk about is the Symbol primitive

