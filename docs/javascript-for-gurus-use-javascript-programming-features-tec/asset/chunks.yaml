  trans: "\n\n# 继承\n\n对象从其他对象继承特征。在本章的早些部分，我提到了汽车对象。我解释了每辆汽车都有四个轮子和其他共同特征，但卡车或巴士又是呢？\n\
    \n虽然卡车的轮子通常比四个多，但它们仍然是车辆家族的一部分。巴士可能有四个轮子，但它们的座位比汽车和卡车多得多；尽管如此，它们仍然是车辆家族的一部分。\n\
    \n另一个例子是你从父母那里继承特征。你可能拥有母亲的头发和眼睛，可能拥有父亲的性格，但你仍然是独一无二的，你依然是你自己。这个过程被称为继承。\n\n在`Chapter\
    \ 7: Prototypes` 中，我们将进一步探索继承，并使用 Mixins（混合器）来在不需要继承的情况下使用不同类的方法。\n\n# 结论\n\n\
    在本章中，我们学习了 JavaScript 类以及如何使用它们。我们学习了为什么类非常重要，以及我们如何向 JavaScript 类添加属性和方法。我们在本章中创建了许多示例，因为这是学习任何东西最简单的方法！熟能生巧。\n\
    \n在下一章中，我们将处理原型。虽然我们在本章中接触了这一主题，但我们将深入探讨。我们还将学习继承、Mixins 和原始类型的重要性。\n\n# 问题\n\n\
    1. 解释 `class` 术语。\n2. 列出创建类的两种方法。\n3. 方法和静态方法之间有什么区别？\n4. 列出属性的三个特征（attributes）。\n\
    5. 解释继承术语。\n\n# 第 7 章：JavaScript 原型\n\n## 引言\n\nJavaScript 中的原型使我们能够让代码更加面向对象。JavaScript\
    \ 原型帮助我们很好地构建对象。是的，类也做相同的事情，但原型解决了普通 JavaScript 类的几个缺点。\n\n有许多不同的原型，我们将研究其中几个。本章的有趣部分从继承和\
    \ Mixins 开始，通过我们可以从其他 JavaScript 类中借用属性和方法。\n\n## 结构\n\n- 什么是原型？\n- 原型继承\n- Mixins\n\
    \n## 目标\n\n- 学习不同类型的原型\n- 理解原型的需求\n- 理解原型继承\n- 理解 Mixins\n\n## 什么是原型？\n\nJavaScript\
    \ 中的原型使我们能够让代码更加面向对象。JavaScript 原型帮助我们很好地构建对象。是的，类也做相同的事情，但原型解决了普通 JavaScript\
    \ 类的几个缺点。\n\nJavaScript 中有两种原型，即 `prototype` 和 `[[Prototype]]`：\n\n- `prototype`：原型被赋值为你在\
    \ JavaScript 中创建的任何函数的属性，正如 `Chapter 6: JavaScript Classes` 中解释的那样。\n- `[[Prototype]]`：每个由运行上下文访问的对象都有一个\
    \ `[[Prototype]]` 属性，当读取对象的某个属性不可用时，就会读取它。\n\n好了，这现在听起来真的不太通，对吗？不。让我们仔细观察。\n\n\
    我们在 `Chapter 6: JavaScript Classes` 中学习过，你可以使用构造函数来创建对象。来看下面的示例：\n\n```\nfunction\
    \ Student(studentFirstName, studentLastName) {\n  this.studentFirstName = studentFirstName,\n\
    \  this.studentLastName = studentLastName,\n  this.studentFullName = function()\
    \ {\n    return this.studentFirstName + \" \" + this.studentLastName;\n  }\n}\n\
    \nvar student1 = new Student(\"Ockert\", \"du Preez\");\nvar student2 = new Student(\"\
    BpB\", \"Publications\");\nconsole.log(student1);\nconsole.log(student2)\n```\n\
    \n函数 `Student` 是 `Student` 对象的构造函数。它包含了名和姓参数，或者在本例中，是属性。`studentFullName` 是一个组合名和姓字符串的函数。\n\
    \n然后了两个 `Student` 对象：`student1` 和 `student2`，结果显示在控制台窗口中。\n\n现在，看这段代码，似乎没有任何异常之处。确实如此。它创建了两个\
    \ `Student` 构造函数的副本，分别用于 `student1` 和 `student2`。这意味着使用 `Student` 构造函数创建的每个对象都将拥有它自己的方法和属性副本。这正是问题出现的地方。构造函数中的\
    \ `studentFirstName` 方法通过拥有它的两个实例浪费了内存，并且在每个独立的对象中都执行相同的操作。\n\n我们通过创建原型来解决这个问题。\n\
    \n每当创建一个函数时，JavaScript 引擎都会自动向其添加一个原型属性。这被称为原型对象，它默认包含它自己的构造函数。构造函数指向该原型对象作为属性的那个函数。你使用\
    \ `functionName.prototype` 访问函数的原型属性。\n\n`Figure 7.1` 显示 `Student` 构造函数包含一个指向原型对象的原型属性。该原型对象包含一个指向回函数的构造函数。\n\
    \n"
- fmt: "\nThe `prototype` property of the function is an object that has two properties:\n\
    \n- `constructor` property: This points to the `Student` function.\n- `__proto__`\
    \ property: This points to the prototype object of the constructor function.\n\
    \n# Adding properties to a prototype object\n\nBy attaching properties and methods\
    \ to the prototype object, you enable all the objects created using the constructor\
    \ function to share them.\n\nYou attach properties and methods to the prototype\
    \ object in the next exercise.\n\nThe following sample demonstrates how to add\
    \ properties to the prototype object:\n\n1. Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n```html\n<html>\n<body>\n\
    <h1>Add properties to prototype object example</h1>\n<p>Add properties to prototype\
    \ object example</p>\n<script>\nfunction Student(studentFirstName, studentLastName)\
    \ {\n  this.studentFirstName = studentFirstName,\n  this.studentLastName = studentLastName,\n\
    \  this.studentFullName = function() {\n    return this.studentFirstName + “ “\
    \ + this.studentLastName;\n  }\n}\nvar student1 = new Student(“Ockert”, “du Preez”);\n\
    var student2 = new Student(“BpB”, “Publications”);\n//Method 1 - dot notation\n\
    Student.prototype.studentID = ‘Student001’\nconsole.log(Student.prototype.studentID)\n\
    //Method 2 - square brackets\nStudent.prototype[\"studentCourse\"] = ‘JavaScript’\n\
    console.log(Student.prototype)\n</script>\n</body>\n</html>\n```\n\n2. Save the\
    \ file with an HTML extension, for example `Chapter 7.3.html`.\n\n3. Double-click\
    \ the file to open it in the default browser.\n\n4. If the browser is Google Chrome,\
    \ press `Ctrl` + `Shift` + `J` to open the console window. The Console window\
    \ will look similar to [Figure 7.4] below:\n\n![](images/Img_07_04.jpg)\n\n**Figure\
    \ 7.4:** Properties added to prototype object\n\nIf you look closely, you will\
    \ notice that I have made use of two different techniques to attach a property\
    \ to the prototype object.\n\nThe first method I have used was to make use of\
    \ dot notation to add the `studentID` property and value to the `Student` prototype.\
    \ The next method I used was square brackets. I made use of the square bracket\
    \ notation technique to attach the `studentCourse` and value to the `Student`\
    \ prototype object.\n\n# Prototypal inheritance\n\nLet’s say, for example we have\
    \ various students. Do you really want to create a separate class for each student,\
    \ or a separate implementation of function prototypes? All `Student` objects contain\
    \ similar properties and methods. `Car` objects contain similar methods and properties\
    \ than other cars.\n\nNow, what if we simply want to take an existing object and\
    \ extend it? The answer is prototypal inheritance. Inheritance means when you\
    \ inherit features (methods or properties) from other prototypes. The benefit\
    \ of inheritance is that after you have inherited the object features, you can\
    \ extend it, and this saves a lot of work when creating objects and prototypes\
    \ because you do not have to recreate similar objects.\n\nLet’s look at an example.\n\
    \nThe following exercise demonstrates creating a prototype or a class:\n\n1. Open\
    \ a text editor of your choice and enter the following HTML and JavaScript code:\n\
    \n```html\n<html>\n<body>\n<h1>prototypal inheritance example</h1>\n<p>prototypal\
    \ inheritance example</p>\n<script>\nfunction Student (studentFirstName, studentLastName)\
    \ {\n  this.studentFirstName = studentFirstName,\n  this.studentLastName = studentLastName\n\
    }\nStudent.prototype.attendClass = function (timeIn, timeOut) {\n  console.log(this.studentFirstName\
    \ + ‘ arrived for class at: ‘ + timeIn + ‘ and left at ‘ + timeOut)\n}\nStudent.prototype.writeExam\
    \ = function () {\n  console.log(this.studentFirstName + ‘ is writing exam.’)\n\
    }\nconst student1 = new Student(‘Ockert’, ‘du Preez’);\nstudent1.attendClass(‘10:00’,\
    \ ‘14:00’);\nstudent1.writeExam()\n</script>\n</body>\n</html>\n```\n\n2. Save\
    \ the file with an HTML extension, for example `Chapter 7.4.html`.\n\n3. Double-click\
    \ the file to open it in the default browser.\n\n4. If the browser is Google Chrome,\
    \ press `Ctrl` + `Shift` + `J` to open the console window. The Console window\
    \ will look similar to [Figure 7.5] below:\n\n![](images/Img_07_05.jpg)\n\n**Figure\
    \ 7.5:** Prototype object\n\nIn the above exercise, you made use of a function\
    \ to create a `Student` and included the `studentFirstName` and `studentLastName`\
    \ parameters. You then added two methods to the `Student` prototype. One method\
    \ is `attendClass` and the last method is `writeExam`.\n\nIn the above exercise,\
    \ you made use of a function to create a `Student` and included the `studentFirstName`\
    \ and `studentLastName` parameters. You then added two methods to the `Student`\
    \ prototype. One method is `attendClass` and the last method is `writeExam`. As\
    \ you can see, the `ProgrammingStudent` class was created without the `attendClass`\
    \ and `writeExam` methods, but now contains them. This is because the `ProgrammingStudent`\
    \ class’ prototype has inherited its methods and properties from the `Student`\
    \ class’ prototype on this line:\n\n`ProgrammingStudent.prototype = Object.create(Student.prototype)`\n\
    \nBased on the `Student` prototype we created, sit with the student, if we want\
    \ to add a programming, a web design, or a literacy to the prototype, we have\
    \ to duplicate this code for each of. So, what now? If we want to add a programming,\
    \ a web design, or a literacy to the prototype, we have to duplicate this code\
    \ for each of.\n\n# Mixins\n\nA limiting factor of JavaScript is that we can only\
    \ inherit from a single object because an object can only have one `Prototype`.\
    \ Another limiting factor of JavaScript is that a class can extend only one other\
    \ class. What if we want to combine features of two or more different classes?\
    \ Or, what if we want to mix-up different classes?\n\nThe answer is Mixins.\n\n\
    A Mixin is a class that contains methods which can be used by other classes without\
    \ having to inherit from it.\n\nIn the next exercise you will create a Mixin with\
    \ its methods, then link this Mixin into an existing class.\n\n1. Open a text\
    \ editor of your choice and enter the following HTML and JavaScript code:\n\n\
    ```html\n<html>\n<body>\n<h1>Mixin example</h1>\n<p>Mixin example</p>\n<script>\n\
    </script>\n</body>\n</html>\n```\n"
