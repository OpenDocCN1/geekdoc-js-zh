    # else statement


    The `else` statement is used to execute when a certain condition doesn’t exist.
    So, to get back to my very first analogy of me winning the lottery. If I do not
    win the lottery, I must continue to work and cannot retire. In the above two exercises
    if the time is neither less than 12 nor 18 nothing currently happens.


    Let’s change that!The following sample adds an `else` statement:


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>If Statement example</h1>

    <p>If Statement example</p>

    <script>

    var time = new Date().getHours();

    if (time < 12) {

    greeting = “Good morning”;

    }

    else if (time < 18) {

    greeting = “Good afternoon”;

    }

    else {

    greeting = “Good evening”;

    }

    document.write(greeting);

    </script>

    </body>

    </html>

    ```


    2. Save the file with an HTML extension, for example `Chapter 13.3.html`.


    3. Double-click the file to open it in the default browser.


    When the time is neither less than 12 nor 18 the greeting will be `Good evening`.


    # switch statement


    In JavaScript, you can make use of a `switch` statement instead of having multiple
    if and else if statements. The `switch` statement provides a more descriptive
    way to check a value against multiple variants.


    The following sample shows how to create a `switch` statement:


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>Switch Statement example</h1>

    <p>Switch Statement example</p>

    <script>

    var objDay = new Date();

    switch (objDay.getDay())

    {

    case 0:

    console.log(“Sunday”);

    break;

    case 1:

    console.log(“Monday”);

    break;

    case 2:

    console.log(“Tuesday”);

    break;

    case 3:

    console.log(“Wednesday”);

    break;

    case 4:

    console.log(“Thursday”);

    break;

    case 5:

    console.log(“Friday”);

    break;

    case 6:

    console.log(“Saturday”);

    break;

    default:

    console.log(“Choose a proper day”);

    break;

    }

    </script>

    </body>

    </html>

    ```


    2. Save the file with an HTML extension, for example `Chapter 13.4.html`.


    3. Double-click the file to open it in the default browser.


    It looks much more complicated than what actually is! You create a new `Date`
    object named `objDay`. Then the `switch` statement starts by testing what day
    is currently. It achieves this via the use of the `getDay()` method. Depending
    on which day it is, that day will get logged to the console. In my case, day 0
    is on `Sunday` and day 6 is on `Saturday`. If you have even keener eyes, you will
    notice the little `break;` between each case statement. This is to indicate that
    the current branch’s code has finished, and the code should not continue through
    the other cases. Lastly, `default` put in there is a value if none of cases is
    met. Let’s do another example by changing the above one quickly:


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>Switch Statement example</h1>

    <p>Switch Statement example</p>

    <script>

    var objDay = new Date();

    switch (objDay.getDay())

    {

    case 0:

    case 5:

    case 6:

    console.log(“Weekend!”);

    break;

    case 1:

    case 2:

    case 4:

    console.log(“Work”);

    break;

    case 3:

    console.log(“Off”);

    break;

    }

    </script>

    </body>

    </html>

    ```


    2. Save the file with an HTML extension, for example `Chapter 13.5.html`.


    3. Double-click the file to open it in the default browser.


    There are some differences. You may notice that case 0 and 5 do not end with `break`
    statement. Why? Because case 0, 5 and 6 do the same thing, which is `Weekend`.
    This is called grouping and can save a lot of time instead of having to repetitive
    code. The same holds true for case 1, 2 and 4 where it will be at work. Case 3
    (`Wednesday`) will be off, for example.


    Now that we understand the basics of these statements, let’s get a bit complicated!


    # Nested statements


    Something that is nested means that it is placed in a similar thing. OK. That’t
    tell me much! A nested `if` statement is an `if` statement within another `if`
    statement. A nested `switch` statement is a `switch` statement that is inside
    another `switch` statement. Let’s see a nested `if` statement in action:


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>Nested If Statement example</h1>

    <p>nested If Statement example</p>

    <script>

    var studentAge = 15;

    if( studentAge < 18 )

    {

    document.write(“Under the age of 18!<br>”);

    document.write(“Needs parent’s consent to enroll.`);

    }

    else

    {

    if (studentAge >= 18 && studentAge <= 60 )

    {

    document.write(“Eligible to enroll<br>”);

    document.write(“Please continue to application page.”);

    }

    else

    {

    document.write(“Older than most students here.<br>”);

    document.write(“Would you prefer a softer chair and different time slot?”);

    }

    }

    }

    </script>

    </body>

    </html>

    ```


    2. Save the file with an HTML extension, for example `Chapter 13.6.html`.


    3. Double-click the file to open it in the default browser.


    As you can see, including whitespace in your code helps to see the flow of the
    script. A variable named `studentAge` gets created and assigned a value of 15.
    The outer if statement tests if `studentAge` is less than 18. If the `studentAge`
    is less than 18 (which it is currently at 15), then the page will inform the user
    that the age is under 18 and parents would need to give the student consent to
    enrol.


    Here is where the fun starts.


    In the `else` statement (meaning the `studentAge` variable’s value is 18 or higher)
    I have put another `if` statement. This is nested. The nested if statement checks
    to see if `studentAge` is 18 or higher and smaller or equal to 60. If both these
    conditions are met, i.e. `studentAge` is 18 or higher and less than or equal to
    60, the page will notify the user that he or she is eligible to enrol.


    If `studentAge` is higher than 60, the nested `if` statement’s `else` clause kicks
    in and informs the user that he or she may be older than the rest and asks if
    a softer chair will be needed.


    All possible results are shown below in Figure 13.2:


    ![](images/Img_13_02.jpg)


    **Figure 13.2:** Nested if statement results


    Let’s go crazy and look at the nested `switch` statement, next


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>Nested Switch Statement example</h1>

    <p>Nested Switch Statement example</p>

    <script>

    var Stops = 30;

    var Location = ‘South Africa’;

    switch(Location)

    {

    case ‘South Africa’:

    switch(Stops)

    {

    case 10:

    document.write(‘Visiting 10 places in 10 days’);

    break;

    case 20:

    document.write(‘Visiting 20 places in 20 days’);

    break;

    case 30:

    document.write(‘Visiting 30 places in 30 days’);

    break;

    }

    break;

    case ‘India’:

    switch(Stops)

    {

    case 5:

    document.write(‘Visiting 5 places in 5 days’);

    break;

    case 15:

    </script>

    </body>

    </html>

    ```

