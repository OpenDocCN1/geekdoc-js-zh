    \ message = ‘”’+ fullName + ‘, ‘ + age + ‘,” ‘ +\n    course + ‘ added to database.’;\n\
    \    console.log(message);\n}\nvar student_1 = addStudent.bind(null, “Ockert”);\n\
    student_1(41, “JavaScript”);\nvar student_2 = addStudent.bind(null, “du Preez”,\
    \ 41, “JavaScript”);\nstudent_2();\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 18.2.html`。\n\
    \n3. 双击该文件在默认浏览器中打开它。\n\n4. 如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\
    \n输出如截图所示：\n\n![](img/Img_18_02.jpg)\n\n图 18.2：复杂函数的 `bind` 示例。\n\n原始函数 `addStudent`\
    \ 包含三个参数：`fullName`、`age` 和 `course`。传递给此函数的任何内容都会带有友好的消息打印在控制台窗口中。`student_1`\
    \ 变量通过提供一个值绑定到 `addStudent` 函数。在下一行中，另外两个参数值被提供给绑定函数。`student_2` 也绑定到了 `addStudent`\
    \ 函数，但提供了一个额外的参数。\n\n让我们来看一个更复杂的例子。\n\n1.  打开你任选的文本编辑器并输入以下 HTML 和 JavaScript\
    \ 代码：\n\n```html\n<html>\n<body>\n<h1>Partials Example</h1>\n<p>Partials Example</p>\n\
    <script>\nfunction listArgs() {\n    return Array.prototype.slice.call(arguments);\n\
    }\nfunction add(arg1, arg2) {\n    return arg1 + arg2\n}\nvar list_1 = listArgs(1,\
    \ 2, 3);\nvar result_1 = add(1, 2);\nvar list_2 = listArgs.bind(null, 41);\nvar\
    \ list_3 = add.bind(null, 41);\nvar list_4 = list_2();\nvar list_5 = list_2(1,\
    \ 2, 3);\nvar result_2 = list_3(5);\nvar result_3 = list_3(5, 10);\nconsole.log(list_1);\n\
    console.log(list_2);\nconsole.log(list_3);\nconsole.log(list_4);\nconsole.log(list_5);\n\
    console.log(result_1);\nconsole.log(result_2);\nconsole.log(result_3);\n</script>\n\
    </body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 18.3.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\
    \n4. 如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\n输出如截图所示：\n\n![](img/Img_18_03.jpg)\n\
    \n图 18.3：数组与函数绑定\n\n# 柯里化 (Currying)\n\n柯里化将一个具有多个参数的函数转换为嵌套函数的序列。它会持续返回一个新函数，该函数接收当前参数，直到所有参数耗尽。\n\
    \n这是一个简单的示例。\n\n1.  打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html>\n\
    <body>\n<h1>Currying Example</h1>\n<p>Currying Example</p>\n<script>\nfunction\
    \ add_1(a, b, c) {\n    return a + b + c;\n}\nfunction add_2(a) {\n    return\
    \ (b) => {\n        return (c) => {\n            return a + b + c\n        }\n\
    \    }\n}\nconsole.log(add_1(2,4,6));\nconsole.log(add_2(1)(2)(3))\n</script>\n\
    </body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 18.4.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\
    \n4. 如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\n上述代码的输出如截图所示：\n\
    \n![](img/Img_18_04.jpg)\n\n图 18.4：柯里化示例\n\n第一个函数 `add_1` 是一个普通的 JavaScript 函数，并会被输出到控制台。函数\
    \ `adds_2` 是柯里化的示例。它将函数拆分为多个函数，每个函数接受一个参数。在这种情况下，有 3 个参数，因此会有 3 个内联函数。\n\n# 总结\n\
    \n在 *AdvancedConcepts* 章节的最后一个章节中，我们学习了如何在 JavaScript 中使用函数式编程特性。你学习了如何利用部分应用（partial\
    \ applications）来根据需求操纵函数的参数。最后，你看到了柯里化是如何使用内联函数的。\n\n在接下来的最后一个章节中，我们将向你介绍各种基于\
    \ JavaScript 的语言和语言变体，如 AJAX、jQuery 和 JSON。\n\n# 问题\n\n1. 定义部分应用（partials）这一术语。\n\
    2. 什么是柯里化？\n\n# 第 V 部分\n\n# JAVASCRIPT 与朋友\n\n# 第 19 章\n\n# JavaScript 与其他语言\n\
    \n# 引言\n\nJavaScript 已经存在了很久，而且还将存在更久。像任何编程语言一样，它影响了许多不同的语言。\n\n在本节中，你将学习如何将 JavaScript\
    \ 与 AJAX、jQuery 和 JSON 结合使用。在课程后面的部分，你将快速了解受 JavaScript 影响的语言，如 TypeScript、ActionScript\
    \ 和 CoffeeScript。\n\n# 结构\n\n*   jQuery 和 JavaScript\n*   JSON 和 JavaScript\n\
    *   AJAX 和 JavaScript\n*   基于 JavaScript 或受 JavaScript 影响的语言\n\n# 目标\n\n*   理解什么是\
    \ jQuery 以及如何使用。\n*   理解什么是 JSON 和 AJAX 以及如何在 JavaScript 中使用它们。\n*   了解 ActionScript、CoffeeScript\
    \ 和 TypeScript 如何工作。\n\n# 其他语言\n\n在整书中，你一直结合 HTML 使用 JavaScript，因为 HTML 是任何网页的基础。如果你还记得，在[第\
    \ 1 章：JavaScript 的威力概述及其目的] 中，我提到过 JavaScript 的历史。另一种语言如 `CSS`（**层联样式表**）也让人联，它是任何网页都无法实现的语言。但是，世界上有很多语言。\n\
    \n# jQuery 和 JavaScript\n\njQuery 由 *John Resig* 于 2006 年创立。jQuery 是一个跨平台的 JavaScript\
    \ 库。它是封装在一起的 JavaScript 代码集合，比 JavaScript 更快、更容易地访问。它的主要用途是简化 HTML DOM 的遍历和操作，外加事件处理、CSS\
    \ 动画和 AJAX（稍后我会谈论 AJAX）。jQuery 还提供了在 JavaScript 库之上创建插件的能力。\n\nJavaScript 和 jQuery\
    \ 之间的一些重要区别下表所示：\n\n| JavaScript | jQuery |\n| :--- | :--- |\n| 弱类型动态语言。 | 丰富且轻级的\
    \ JavaScript 库。 |\n| 从头开始编写所有代码。 | 包含预定义的函数。 |\n| 开发者在开发时必须考虑浏览器兼容性。 | jQuery\
    \ 是跨浏览器兼容的。 |\n| 运行 JavaScript 不需要额外的插件。 | 网页必须包含 jQuery 库脚本链接。 |\n| 代码行长。 | 代码更少。\
    \ |\n| 学习困难。 | 相对容易学习。 |\n\n表 19.1：JavaScript 对比 jQuery\n\n让我们通过几个练习快速查看代码编写上的差异。\n\
    \n1.  打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html\n<head>\n<script\
    \ src= “https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js”></script>\n\
    </head>\n<body>\n<h1>jQuery versus JavaScript 1</h1>\n<p>jQuery versus JavaScript\
    \ 1</p>\n<input id=”button1” type=”button”value=”click Me!” //>\n<script>\n$(‘#button1’).click(function()\
    \ {\n    alert(“BpB”);\n});\n</script>\n</body>\n</html>\n```\n"
