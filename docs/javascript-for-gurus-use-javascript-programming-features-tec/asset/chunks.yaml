- fmt: "\nThe name of the constructor function is `House`. Inside the brackets there\
    \ are five parameters: (`_bed`, `_bath`, `_garage`, `_pool`, and `_walls`. These\
    \ will be used to pass information to the `House` function. Inside the constructor\
    \ function, each property gets set to its own parameter. Remember, this is simply\
    \ a template, there are no values yet.\n\nNow that we have the constructor function,\
    \ it is easy to create objects based on it. Here is how to:\n\n```javascript\n\
    var houseOne = new House(4, 2, 2, false, true);\nvar houseTwo = new House(3, 1,\
    \ 1, true, false);\n```\n\nThe `houseOne` variable above is a new `House` object.\
    \ It has 4 bedrooms, 2 bathrooms, 2 garages, no swimming pool and it has outside\
    \ walls. The `houseTwo` variable, in contrast, has 3 bedrooms, 1 bathroom, 1 garage,\
    \ a swimming pool and it doesn’t have outside walls.\n\n# Creating JSON objects\n\
    \nJSON objects are written inside curly braces and can contain multiple name/value\
    \ pairs, as shown below:\n\n```json\n{\"firstName”:”Ockert”, “lastName”:”du Preez”\n\
    ```\n\nYou can take it a step further and include more `firstName` and `lastName`\
    \ to one `Student` object, for example:\n\n```json\n{\n  “Student”:[\n    {\"\
    firstName”:”Ockert”, “lastName”:”du Preez”},\n    {\"firstName”:”William”, “lastName”:”Shakespeare”},\n\
    \    {\"firstName”:”Stephen”, “lastName”:”King}\n  ]\n}\n```\n\n# Rules for valid\
    \ JSON\n\nThe following are all allowed in JSON format:\n\n- Empty objects and\
    \ empty arrays.\n- Strings may contain any Unicode characters.\n- Null is a valid\
    \ JSON value.\n- All object properties should always be double-quoted.\n- Number\
    \ values must be in decimal format.\n- No trailing commas are allowed on arrays.\n\
    \nLet’s do a quick exercise on encoding JSON and decoding JSON through JavaScript:\n\
    \n1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n```html\n<html>\n<body>\n    <h1>Encoding and Decoding JSON</h1>\n\
    \    <p>Encoding and Decoding JSON</p>\n    <script>\n        const encodeData\
    \ = {\n            name: “Ockert du Preez”,\n            age: 41,\n          \
    \  title: “JavaScript Guru”\n        }\n        const encodeStr = JSON.stringify(encodeData);\n\
    \        console.log(encodeStr);\n        const decodeStr = ‘{\n            “name”:”Ockert\
    \ du Preez”,\n            “age”:41,\n            “title”:”JavaScript Guru”\n \
    \       }’;\n        const decodeData = JSON.parse(decodeStr);\n        console.log(decodeData.title);\n\
    \    </script>\n</body>\n</html>\n```\n\n2.  Save the file with an HTML extension,\
    \ for example `Chapter 19.3.html`.\n\n3.  Double-click the file to open it in\
    \ the default browser. If the browser is Google Chrome, press `Ctrl` + `Shift`\
    \ + `J` to open the console window:\n\nThe output in the Console window is shown\
    \ next\n\n![](images/Img_19_02.jpg)\n\n**Figure 19.2:** Encoding and decoding\
    \ JSON\n\nLet me dissect what happens here.\n\nFirst, a JavaScript object called\
    \ `encodeData` is created and given values such as name, age and title. Then,\
    \ a variable named `encodeString` makes use of the `stringify` method in `JSON`\
    \ to convert the JavaScript object to a JSON object.\n\nSecond is basically the\
    \ opposite. You supplied a JSON object to the `parse` method of `JSON` to convert\
    \ it to an ordinary JavaScript object.\n\n# AJAX and JavaScript\n\nAJAX is not\
    \ a programming language. AJAX stands for Asynchronous JavaScript and XML and\
    \ makes use of:\n\n- A browser built-in `XMLHttpRequest` object that requests\
    \ data from a web server.\n- JavaScript and HTML DOM that displays or uses the\
    \ data.\n\nThe real power of AJAX is that it allows web pages to be updated asynchronously\
    \ by exchanging data with a web server behind the scenes, meaning it is possible\
    \ to update parts of a web page, without the need of reloading the whole page.\n\
    \nHere’s a breakdown of how AJAX works. An event occurs on a web page:\n\n- JavaScript\
    \ creates an `XMLHttpRequest` object.\n- The `XMLHttpRequest` object sends a request\
    \ to a web server.\n- The server processes the request.\n- The server sends a\
    \ response back to the web page.\n- JavaScript read the response.\n- JavaScript\
    \ performs the appropriate action.\n\nThe next little exercise, you will do demonstrates\
    \ how to use AJAX with JavaScript and another scripting language called `PHP`.\
    \ PHP is a server scripting language, so keep in mind that the `PHP` file must\
    \ exist on a server for this exercise to work completely:\n\n1.  Open a text editor\
    \ of your choice and enter the following HTML and JavaScript code:\n\n```php\n\
    <?php\nif(isset($_GET[“studentFirstName”]) && isset($_GET[“studentLastName”]))\
    \ {\n    $fname = htmlspecialchars($_GET[“studentFirstName”]);\n    $lname = htmlspecialchars($_GET[“studentLastName”]);\n\
    \    $studentFullName = $studentFirstName.“ “.$studentLastName;\n    echo “Hello,\
    \ $studentFullName! Welcome!”;\n} else {\n    echo “Hi there, stranger! Welcome!”;\n\
    }\n?>\n```\n\n2.  Save the file with an HTML extension, for example `greet.php`.\n\
    \n3.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n```html\n<!DOCTYPE html>\n<head>\n    <script>\n        function showStudentName()\
    \ {\n            var request = new XMLHttpRequest();\n            request.open(“GET”,\
    \ “greet.php?studentFirstName=Ockert&studentLastName=du Preez”);\n           \
    \ request.onreadystatechange = function() {\n                if(this.readyState\
    \ === 4 && this.status === 200) {\n                    document.getElementById(“result”).innerHTML\
    \ = this.responseText;\n                }\n            };\n            request.send();\n\
    \        }\n    </script>\n</head>\n<body>\n    <h1>AJAX Example</h1>\n    <p>AJAX\
    \ Example</p>\n    <div id=”result”>\n        <p>Result will be displayed here</p>\n\
    \    </div>\n    <button type=”button” onclick=”showStudentName()”>Show Full Name</button>\n\
    </body>\n</html>\n```\n\n4.  Save the file with an HTML extension, for example\
    \ `Chapter 19.4.html`.\n\n5.  Double-click the file to open it in the default\
    \ browser. As mentioned, if the PHP file is saved on the server and everything\
    \ is set up properly, you will not get errors when loading this document.\n\n\
    What happened here? The `greet.php` is a PHP file that exists on a server. It\
    \ tests to see if the `studentFirstName` and `studentLastname` fields contain\
    \ information. If they do, their values get stored inside two PHP variable objects\
    \ `fname` and `lname`, respectively.\n\nThe `studentFullName` PHP variable consists\
    \ of a combination of the `fname` and `lname` variables separated by a space.\
    \ If values were supplied, a message greeting the student by his/her full names\
    \ appear; else, a message greeting a stranger will appear.\n\nIn the file `Chapter19.4html`\
    \ you created a function `showStudentName`. The object function is to call the\
    \ logic inside the `greet.php` file to combine the given first name and last name.\
    \ If the function is successful, it will display the full name inside the `div`\
    \ named result.\n"
