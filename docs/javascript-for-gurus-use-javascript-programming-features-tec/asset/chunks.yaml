    \ header showing which origin sites are allowed. For example:\n\n    *   Access-Control-Allow-Origin:\
    \ [http://www.javascriptforgurus.com](http://www.javascriptforgurus.com)\n\n*\
    \   An Access-Control-Allow-Origin header with a wildcard that allows all domains.\
    \ For example:\n\n    *   Access-Control-Allow-Origin: `*`\n\n*   An error page\n\
    \n# [CORS preflight request](#toc.xhtml_s173a)\n\nEarlier I mentioned that browsers\
    \ should *preflight* requests. When performing cross-domain requests, CORS-compatible\
    \ browsers insert *preflight* requests that determine whether they have permission\
    \ to perform the action. Here is a small example:\n\n`OPTIONS /`\n\n`Host: service.javascriptforgurus.com`\n\
    \n`Origin:` [`http://www.javascriptforgurus.com`](http://www.javascriptforgurus.com)\n\
    \nIf service.javascriptforgurus.com accepts the action, it responds with the following\
    \ headers:\n\n`Access-Control-Allow-Origin:` [`http://www.javascriptforgurus.com`](http://www.javascriptforgurus.com)\n\
    \n`Access-Control-Allow-Methods: PUT, DELETE`\n\nAnother example follows. This\
    \ example demonstrates a client asking a server if it allows `DELETE` requests,\
    \ before sending the `DELETE` preflight request:\n\n`OPTIONS` [`http://www.javascriptforgurus.com`](http://www.javascriptforgurus.com)\n\
    \n`Access-Control-Request-Method: DELETE`\n\n`Access-Control-Request-Headers:\
    \ origin, x-requested-with`\n\n`Origin:` [`http://www.javascriptforgurus.com`](http://www.javascriptforgurus.com)\n\
    \nAnd here follows the server’s potential response:\n\n`HTTP/1.1 204 No Content`\n\
    \n`Connection: keep-alive`\n\n`Access-Control-Allow-Origin:` [`http://www.javascriptforgurus.com`](http://www.javascriptforgurus.com)\n\
    \n`Access-Control-Allow-Methods: POST, GET, OPTIONS, DELETE`\n\n`Access-Control-Max-Age:\
    \ 86400`\n\nBecause the server responded with an `Access-Control-Allow-Methods`\
    \ response header, the server allows the request.\n\nWe’re still sitting with\
    \ the CORS problem. What do I mean? Well, the exercise that you have done still\
    \ throws CORS errors, as shown in *[Figure 11.1](#c11.xhtml_fig11_1)*. How do\
    \ we fix this?\n\nWell, there are plenty of ways to bypass CORS errors; here are\
    \ a few ways that might work in Google Chrome:\n\n*   Moesif Origin &CORS Changer\n\
    \n*   Command Prompt\n\n*   Out of blink CORS\n\n# [Moesif Origin & CORS Changer](#toc.xhtml_s174a)\n\
    \nThe Moesif Origin &CORS Changer Google Chrome plugin enables you to send cross-domain\
    \ requests and override request origin and CORS headers without receiving errors.\n\
    \nUse the next few steps to install the Moesif Origin & CORS Changer plugin:\n\
    \n1.  Navigate to: https://chrome.google.com/webstore/detail/moesif-orign-cors-changer/digfbfaphojjndkpccljibejjbppifbc?hl=en-US\n\
    \n2.  Click on the **`Add to Chrome`** button to add this extension to Chrome.\
    \ This is shown in *[Figure 11.2](#c11.xhtml_fig11_2)*:\n\n    ![](images/Img_11_02.jpg)\n\
    \n    **Figure 11.2:** Moesif Origin & CORS changer (as found on the chrome web\
    \ store)\n\n3.  Restart your browser, if necessary.\n\n4.  You will notice a small\
    \ icon next to your address bar. This is the extension. Click on it, the next\
    \ screen appears.\n\n    ![](images/Img_11_03.jpg)\n\n    **Figure 11.3:** Moesif\
    \ CORS settings when clicked upon\n\n5.  Click on the **`SWITCH ON`** button,\
    \ top switch this extension on.\n\n6.  This should do the trick.\n\n# [Command\
    \ Prompt](#toc.xhtml_s175a)\n\nCommand Prompt executes entered commands such as\
    \ automate tasks via scripts and batch files, perform advanced administrative\
    \ functions, and troubleshoot Windows issues.\n\nThe next few steps open Google\
    \ Chrome in disabled security mode:\n\n1.  Close all Google Chrome instances.\n\
    \n2.  Press your Windows button on your keyboard.\n\n3.  Type `cmd`. Press *Enter*.\n\
    \n4.  The Command Prompt window will appear, as shown in *[Figure 11.4](#c11.xhtml_fig11_4)*:\n\
    \n    ![](images/Img_11_04.jpg)\n\n    **Figure 11.4:** Command Prompt\n\n5. \
    \ Enter the following command, and press enter:\n\n    **`CD\\Program Files (x86)\\\
    Google\\Chrome\\Application`**\n\n    This means change directory (folder) to\
    \ the location of the Chrome application file.\n\n6.  Type in the following command,\
    \ and press *Enter*. The screen is in *[Figure 11.5](#c11.xhtml_fig11_5)*:\n\n\
    \    **`Chrome.exe --disable-web-security`**\n\n    OR\n\n    **`chrome.exe --user-data-dir=”C://Chrome\
    \ dev session” --disable-web-security`**\n\n    OR\n\n    **`chrome.exe --disable-web-security\
    \ --disable-gpu --user-data-dir=~C://Chrome dev session`**\n\n7.  This launches\
    \ Chrome with disabled security, which may not be a completely good idea:\n\n\
    \    ![](images/Img_11_05.jpg)\n\n    **Figure 11.5:** Command Prompt in action\n\
    \nNow, let us have a look at the Out of Blink CORS setting.\n\n# [Out of blink\
    \ CORS](#toc.xhtml_s176a)\n\nOut of blink, CORS is Chrome setting which you could\
    \ use to enable or disable CORS checks. Use the next few steps to disable Out\
    \ of blink CORS:\n\n1.  Open your Chrome browser (if it is not already opened)\n\
    \n2.  Navigate to: chrome://flags/#out-of-blink-cors\n\n3.  Next to the **`Out\
    \ of blink CORS`** setting, select the dropdown arrow.\n\n4.  Select **`Disabled`**\
    \ from the list, as shown in *[Figure 11.6](#c11.xhtml_fig11_6)*:\n\n    ![](images/Img_11_06.jpg)\n\
    \n    **Figure 11.6:** Out of blink CORS\n\n5.  Restart Chrome for changes to\
    \ take effect.\n\nWhat if I am testing locally and still get the CORS errors?\n\
    \nSadly, there is not much you can do. You will run into CORS errors because of\
    \ the JavaScript module security requirements. The only thing you can do then\
    \ in this situation is to do your testing through a server.\n\n# [Dynamic import](#toc.xhtml_s177a)\n\
    \nYou can dynamically load or import modules only when needed, instead of having\
    \ to load everything up front. This increases performance greatly. You call `import()`\
    \ as a function, then pass the path to the module as a parameter. This returns\
    \ a promise that fulfils with a module object.\n\nThe following sample demonstrates\
    \ how to import a module dynamically into your web pages:\n\n1.  Open a text editor\
    \ of your choice and enter the following HTML and JavaScript code:\n\n    `<html>`\n\
    \n    `<body>`\n\n    `<h1>Dynamic Import example</h1>`\n\n    `<p>Dynamic Import\
    \ example</p>`\n\n    `<script>`\n\n    `import(‘greet.mjs’)`\n\n    `.then((module)\
    \ => {`\n\n    `document.body.innerHTML = sayHello(‘Ockert’);`\n\n    `});`\n\n\
    \    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file with an\
    \ HTML extension, for example `Chapter 11.3.html`.\n\nThis imports the functions\
    \ inside the module dynamically.\n\n# [Nomodule](#toc.xhtml_s178a)\n\nWith web\
    \ development, it is always good practice to be backwards compatible or at least\
    \ be aware of newer browser features compared to older browsers. Older browsers\
    \ may not understand the module type, so it is a good idea to make use of the\
    \ nomodule attributes to inform users that whatever they are trying to make use\
    \ of may not be available.\n\nThe following sample demonstrates how the nomodule\
    \ attribute works.\n\n1.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>nomodule\
    \ functions example</h1>`\n\n    `<p>nomodule functions example</p>`\n\n    `<script\
    \ type=”module”>`\n\n    `alert(“Works!”);`\n\n    `</script>`\n\n    `<script\
    \ nomodule>`\n\n    `alert(“For Older Browsers.”);`\n\n    `</script>`\n\n   \
    \ `</body>`\n\n    `</html>`\n\n2.  Save the file with an HTML extension, for\
    \ example `Chapter 11.4.html`.\n\nOlder browsers will ignore the unknown script\
    \ type, and then display a message for older browsers.\n\nThe following sample\
    \ demonstrates another way to make use of the nomodule attribute:\n\n1.  Open\
    \ a text editor of your choice and enter the following HTML and JavaScript code:\n\
    \n    `<html>`\n\n    `<body>`\n\n    `<h1>nomodule functions example</h1>`\n\n\
    \    `<p>nomodule functions example</p>`\n\n    `<script type=”module” src=”main.mjs”></script>`"
