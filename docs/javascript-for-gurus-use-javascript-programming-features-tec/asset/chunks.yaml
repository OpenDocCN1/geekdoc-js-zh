    # Object.assign()\n\n`Object.assign()` 方法在 `Object.create()` 的基础上更进了一步。`Object.create()`\
    \ 使用一个原型对象，而 `Object.assign()` 可以从任意数量的原型对象继承或获取属性。\n\n假设你有如下两个对象：\n\n```javascript\n\
    let Course = {Coursename: ‘Web Programming’}\nlet Subject = {Subjectname: ‘JavaScript’}\n\
    ```\n\n你有一个 `Student` 对象正在学习 `Web Programming` 课程，并且目前正忙于名为 `JavaScript` 的科目。你可以通过\
    \ `Object.assign` 的帮助来实现这一点，如下所示：\n\n```javascript\nlet Student = Object.assign({},\
    \ Course, Subject);\n```\n\n现在，你有一个 `Student` 对象，它将 `Coursename` 和 `Subjectname`\
    \ 作为其属性：\n\n```javascript\nconsole.log(Student.Coursename) //Output: Web Programming\n\
