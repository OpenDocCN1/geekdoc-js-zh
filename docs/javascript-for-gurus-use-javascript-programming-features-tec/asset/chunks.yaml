    \ = ‘”’+ fullName + ‘, ‘ + age + ‘,” ‘ +\n    course + ‘ added to database.’;\n\
    \    console.log(message);\n}\nvar student_1 = addStudent.bind(null, “Ockert”);\n\
    student_1(41, “JavaScript”);\nvar student_2 = addStudent.bind(null, “du Preez”,\
    \ 41, “JavaScript”);\nstudent_2();\n```\n\n2. Save the file with an HTML extension,\
    \ for example `Chapter 18.2.html`.\n\n3. Double-click the file to open it in the\
    \ default browser.\n\n4. If the browser is Google Chrome, press `Ctrl` + `Shift`\
    \ + `J` to open the console window.\n\nThe output is shown in the following screenshot:\n\
    \n![](images/Img_18_02.jpg)\n\nFigure 18.2: Complex function.bind example\n\n\
    The original function `addStudent` contains three parameters: `fullName`, `age`,\
    \ and `course`. Whatever is fed to this function gets printed in the console window\
    \ with a nice message. The `student_1` variable gets bound to the `addStudent`\
    \ function by only supplying one value. On the next line, the other two parameter\
    \ values are supplied to the bound function. The`student_2` is also bound to the\
    \ `addStudent` function, but an extra parameter is supplied.\n\nLet’s do an even\
    \ more complex example.\n\n1.  Open a text editor of your choice and enter the\
    \ following HTML and JavaScript code:\n\n```html\n<html>\n<body>\n<h1>Partials\
    \ Example</h1>\n<p>Partials Example</p>\n<script>\nfunction listArgs() {\n   \
    \ return Array.prototype.slice.call(arguments);\n}\nfunction add(arg1, arg2) {\n\
    \    return arg1 + arg2\n}\nvar list_1 = listArgs(1, 2, 3);\nvar result_1 = add(1,\
    \ 2);\nvar list_2 = listArgs.bind(null, 41);\nvar list_3 = add.bind(null, 41);\n\
    var list_4 = list_2();\nvar list_5 = list_2(1, 2, 3);\nvar result_2 = list_3(5);\n\
    var result_3 = list_3(5, 10);\nconsole.log(list_1);\nconsole.log(list_2);\nconsole.log(list_3);\n\
    console.log(list_4);\nconsole.log(list_5);\nconsole.log(result_1);\nconsole.log(result_2);\n\
    console.log(result_3);\n</script>\n</body>\n</html>\n```\n\n2. Save the file with\
    \ an HTML extension, for example `Chapter 18.3.html`.\n\n3. Double-click the file\
    \ to open it in the default browser.\n\n4. If the browser is Google Chrome, press\
    \ `Ctrl` + `Shift` + `J` to open the console window.\n\nThe output is shown in\
    \ the following screenshot:\n\n![](images/Img_18_03.jpg)\n\nFigure 18.3: Arrays\
    \ and function binding\n\n# Currying\n\nCurrying transforms a function with multiple\
    \ arguments into a sequence of nesting functions. It keeps returning a new function\
    \ that expects the current argument inline until all the arguments are exhausted.\n\
    \nHere is a small example.\n\n1.  Open a text editor of your choice and enter\
    \ the following HTML and JavaScript code:\n\n```html\n<html>\n<body>\n<h1>Currying\
    \ Example</h1>\n<p>Currying Example</p>\n<script>\nfunction add_1(a, b, c) {\n\
    \    return a + b + c;\n}\nfunction add_2(a) {\n    return (b) => {\n        return\
    \ (c) => {\n            return a + b + c\n        }\n    }\n}\nconsole.log(add_1(2,4,6));\n\
    console.log(add_2(1)(2)(3))\n</script>\n</body>\n</html>\n```\n\n2. Save the file\
    \ with an HTML extension, for example `Chapter 18.4.html`.\n\n3. Double-click\
    \ the file to open it in the default browser.\n\n4. If the browser is Google Chrome,\
    \ press `Ctrl` + `Shift` + `J` to open the console window.\n\nThe output of the\
    \ above code is shown in the following screenshot:\n\n![](images/Img_18_04.jpg)\n\
    \nFigure 18.4: Currying example\n\nThe first function, `add_1`, is an ordinary\
    \ JavaScript function and it gets output to the console. The function `adds_2`\
    \ is an example of currying in action. It splits the function into more functions,\
    \ each accepting an argument. In this case, there are 3 arguments, so there will\
    \ be 3 inline functions.\n\n# Conclusion\n\nIn this last chapter in the *AdvancedConcepts*\
    \ section, we have learnt how to make use of functional programming features in\
    \ JavaScript. You learned how to make use of partial applications to manipulate\
    \ a function’s arguments according to your needs. Lastly, you saw how currying\
    \ makes use of inline functions.\n\nIn the next final chapter, we will introduce\
    \ you to various languages and language variants based on JavaScript such as AJAX,\
    \ jQuery, and JSON.\n\n# Questions\n\n1. Define the term partials.\n2. What is\
    \ currying?\n\n# SECTION V\n\n# JAVASCRIPT AND FRIENDS\n\n# CHAPTER 19\n\n# JavaScript\
    \ and Other Languages\n\n# Introduction\n\nJavaScript has been around for a long\
    \ time and will be even longer. Like any programming language, it has influenced\
    \ a lot of different languages.\n\nIn this lesson, you will learn how to use JavaScript\
    \ with AJAX, jQuery, and JSON. Later on in the lesson, you will have a quick introduction\
    \ into languages influenced by JavaScript such as TypeScript, ActionScript, and\
    \ CoffeeScript.\n\n# Structure\n\n*   jQuery and JavaScript\n*   JSON and JavaScript\n\
    *   AJAX and JavaScript\n*   Languages based on or influenced by JavaScript\n\n\
    # Objectives\n\n*   Understand what jQuery is and how to use it.\n*   Understand\
    \ what JSON and AJAX are and how to use them in JavaScript.\n*   See how ActionScript,\
    \ CoffeeScript, and TypeScript work.\n\n# Other languages\n\nThroughout this book,\
    \ you have been using JavaScript with HTML because HTML is the foundation for\
    \ any web page. if you can recall, in [Chapter 1: Overview of the Power of JavaScript\
    \ and Its Purpose], I have spoken about the history of JavaScript. Another language\
    \ such as `CSS` (**Cascading Style Sheets**) also comes to mind as a language\
    \ that any webpage simply cannot do. But, there are many languages out there.\n\
    \n# jQuery and JavaScript\n\njQuery was founded by *John Resig* in 2006.jQuery\
    \ is a cross-platform JavaScript library. It is a collection of JavaScript code\
    \ packaged together that can be accessed quicker and easier than JavaScript. Its\
    \ main use is to simplify HTML DOM traversal and manipulation, plus event handling,\
    \ CSS animation, and AJAX (I will speak of AJAX bit later). jQuery also provides\
    \ capabilities to create plug-ins on top of the JavaScript library.\n\nSome important\
    \ differences between JavaScript and jQuery are included in the table below:\n\
    \n| JavaScript | jQuery |\n| :--- | :--- |\n| Weakly typed dynamic language. |\
    \ Rich and lightweight JavaScript library. |\n| Write all coding from scratch.\
    \ | Contains pre-written functions. |\n| Developers have to consider browser compatibility\
    \ when developing. | jQuery is cross-browser compatible. |\n| No additional plugins\
    \ needed to run JavaScript. | jQuery library script link must be included on the\
    \ web page. |\n| Long lines of code. | Less coding. |\n| Difficult to learn. |\
    \ Relatively easier to learn. |\n\nTable 19.1: JavaScript versus jQuery\n\nLet’s\
    \ quickly have a look at the differences in coding by doing a few exercises.\n\
    \n1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n```html\n<html>\n<head>\n<script src= “https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js”></script>\n\
    </head>\n<body>\n<h1>jQuery versus JavaScript 1</h1>\n<p>jQuery versus JavaScript\
    \ 1</p>\n<input id=”button1” type=”button”value=”click Me!” //>\n<script>\n$(‘#button1’).click(function()\
    \ {\n    alert(“BpB”);\n});\n</script>\n</body>\n</html>\n```\n"
