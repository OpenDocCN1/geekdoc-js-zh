    `Number` 类型是一个双精度 64 位二进制值。它可以存储浮点数或范围在 `-(2⁵³ -1)` 到 `(2⁵³ -1)` 之间的整数。数字类型还有三个特殊值：`+Infinity`、`-Infinity`
    和 `NaN`（不是数字）。常量 `Number.MAX_VALUE` 和 `Number.MIN_VALUE` 可用于确定 `+Infinity` 和 `-Infinity`
    之间的最大或最小值。你还可以使用 `Number.isSafeInteger()` 或 `Number.MAX_SAFE_INTEGER` 和 `Number.MIN_SAFE_INTEGER`
    来检查一个数字是否在双精度浮点范围内。


    # Number 属性](#toc.xhtml_s198a)


    原始类型数字具有以下属性：


    | 属性 | 描述 |

    | :--- | :--- |

    | `EPSILON` | 两个可表示数字之间的最小间隔 |

    | `MAX_SAFE_INTEGER` | 最大安全整数 |

    | `MAX_VALUE` | 最大可表示正数 |

    | `MIN_SAFE_INTEGER` | 最小安全整数 |

    | `MIN_VALUE` | 最接近零的正数 |

    | `NaN` | 不是数字 |

    | `NEGATIVE_INFINITY` | 负无穷 |

    | `POSITIVE_INFINITY` | 正无穷 |


    **表 12.3:** Number 属性


    现在我们已经熟悉了数字类型的属性，让我们来看看它的方法。


    # Number 方法](#toc.xhtml_s199a)


    原始类型数字具有以下方法：


    | 方法 | 描述 |

    | :--- | :--- |

    | `isFinite` | 该值是否为有限数字？ |

    | `isInteger` | 该值是否为整数（整数字）？ |

    | `isNaN` | 该值是否不是数字？ |

    | `isSafeInteger` | 该值是否为 `-(253 -1)` 到 `(253 -1)` 之间的整数 |

    | `parseFloat` | 将参数解析为浮点数 |

    | `parseInt` | 将参数解析为整数 |

    | `prototype.toExponential` | 科学计数法表示字符串 |

    | `prototype.toFixed` | 固定点计数法 |

    | `prototype.toLocaleString` | 语言敏感的数字表示法 |

    | `prototype.toPrecision` | 以固定点或科学计数法以指定的精确度表示数字 |

    | `prototype.toSource` | Number 对象的对象字面量 |

    | `prototype.toString` | 数字的字符串表示 |

    | `prototype.valueOf` | 返回对象的原始值 |


    **表 12.4:** Number 方法


    让我们来一个快速的练习吧！以下示例演示了几个数字方法的使用：


    1.  打开你任的文本编辑器，并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>Number methods</h1>

    <p>Number methods</p>

    <script>

    var num = 9.76386;

    var n = num.toExponential(3);

    document.writeln("<br />" + n);

    var x = 6.351;

    x.toFixed(2);

    document.writeln("<br />" + x);

    var numObj = new Number(42);

    var nn = numObj.valueOf();

    document.writeln("<br />" + nn);

    </script>

    </body>

    </html>

    ```


    2.  以 HTML 扩展名保存文件，例如 `Chapter 12.4.html`。

    3.  双击文件在默认浏览器中打开它。


    如你所示，使用数字方法非常简单。在上面的练习中，你显示了一个数字的指数值，获取了另一个数字的固定值并显示了第三个数字的值。*图 12.4* 显示了结果：


    ![](img/Img_12_04.jpg)


    **图 12.4:** Number 方法


    说到数字，让我们快速看一眼 `BigInt` 原始类型。


    # BigInt](#toc.xhtml_s200a)


    你可能对数字原始类型的限制感兴趣。简单回顾一下：它在 `-(2⁵³ -1)` 和 `(2⁵³ -1)` 之间。现在，如果你有一个更大的数字怎么办？这就是 `BigInt`
    用用用场。`BigInt` 表示大于 `(2⁵³ -1)` 的整数。创建一个 `BigInt` 非常简单，你只需要在整数字面量后添加一个 `n`，或者调用函数
    `BigInt()`。


    让我们来一个快速的练习吧！以下示例演示了如何创建 BigInt：


    1.  打开你任的文本编辑器，并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>Creating BigInts</h1>

    <p>Creating BigInts</p>

    <script>

    const num1 = 9007199254740991n;

    const num2= BigInt(9007199254740991);

    const num3 = BigInt("9007199254740991");

    </script>

    </body>

    </html>

    ```


    2.  以 HTML 扩展名保存文件，例如 `Chapter 12.5.html`。

    3.  双击文件在默认浏览器中打开它。


    注意我在创建 `num1` 对象时在长数字后面添加的 `n`。`num2` 是通过 `BigInt` 函数创建的，`num3` 也是如此，但为 `num3`
    提供的是一个字符串，它会被转换为 `BigInt` 数字。


    # Null 与 undefined](#toc.xhtml_s201a)


    Null 意味着无。它是值的刻意缺失。Undefined 意味着变量已经创建，但还没有被赋值。


    一个简单的示例可能会有所帮助；让我们来看看。以下示例演示了如何创建 BigInt：


    1.  打开你任的文本编辑器，并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>null versus undefined</h1>

    <p>null versus undefined</p>

    <script>

    var nullVar = null;

    if (nullVar)

    document.writeln("<br />nullVar is not null");

    else

    document.writeln("<br />nullVar is null");

    var undefinedVar;

    document.writeln("<br />" + undefinedVar);

    </script>

    </body>

    </html>

    ```


    2.  以 HTML 扩展名保存文件，例如 `Chapter 12.6.html`。

    3.  双击文件在默认浏览器中打开它。


    在这里我创建了一个名为 `nullVar` 的变量并将其初始化为 `null`。这意味着没有值，所以检查 `nullVar` 变量值的 `if` 语句将产生一行说明
    `nullVar` 是 null 的输出。


    然后我创建了另一个名为 `undefinedVar` 的变量没有给它赋值。将写入的行将说明 `undefinedVar` 是 undefined。为什么？因为对象被创建了但没有填充任何值。*图
    12.5* 显示了代码的运行：


    ![](img/Img_12_05.jpg)


    **图 12.5:** Null 与 undefined


    # Boolean](#toc.xhtml_s202a)


    现在我们已经知道了如何存储数字和字符串值，以及像 null 和 undefined 这样的复杂值，我们可以转向一个更简单的原始类型 Boolean。


    Boolean 值可以是 true 或 false 的值。如果不是 true，它就是 false，反之亦然。Boolean 经常用于二进制选项，例如男或女、冷或热等。Boolean
    不包含方法，只有一个 `length` 属性。


    快速查看 Boolean 作用的方法是做另一个练习。


    1.  打开你任的文本编辑器，并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>Boolean example</h1>

    <p>Boolean example</p>

    <script>

    var varYES = true;

    var varNO = false;

    if(varYES)

    {

    alert("This code executes");

    }

    if(varNO)

    {

    alert("This code does not execute");

    }

    </script>

    </body>

    </html>

    ```


    2.  以 HTML 扩展名保存文件，例如 `Chapter 12.7.html`。

    3.  双击文件在默认浏览器中打开它。


    如你所示，我在这里使用了另一个 if 语句，实际上是两个 `if` 语句。我将在 *第 13 章：控制流语句* 中更详细介绍 if 语句。这些 if 语句检查传递的对象包含什么值。如果它包含真值，则执行其块中的代码，如*图
    12.6*所示：


    ![](img/Img_12_06.jpg)


    **图 12.6:** Boolean 测试


    最后一个我想谈的原始类型是 Symbol 原始类型


