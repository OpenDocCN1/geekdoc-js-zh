    \ commas are allowed on arrays.\n\nLet’s do a quick exercise on encoding JSON\
    \ and decoding JSON through JavaScript:\n\n1.  Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\
    \n    `<h1>Encoding and Decoding JSON</h1>`\n\n    `<p>Encoding and Decoding JSON</p>`\n\
    \n    `<script>`\n\n    `const encodeData = {`\n\n    `name: “Ockert du Preez”,`\n\
    \n    `age: 41,`\n\n    `title: “JavaScript Guru”`\n\n    `}`\n\n    `const encodeStr\
    \ = JSON.stringify(encodeData);`\n\n    `console.log(encodeStr);`\n\n    `const\
    \ decodeStr = ‘{`\n\n    `“name”:”Ockert du Preez”,`\n\n    `“age”:41,`\n\n  \
    \  `“title”:”JavaScript Guru”`\n\n    `}’;`\n\n    `const decodeData = JSON.parse(decodeStr);`\n\
    \n    `console.log(decodeData.title);`\n\n    `</script>`\n\n    `</body>`\n\n\
    \    `</html>`\n\n2.  Save the file with an HTML extension, for example `Chapter\
    \ 19.3.html`.\n\n3.  Double-click the file to open it in the default browser.\
    \ If the browser is Google Chrome, press *Ctrl* + *Shift* + *J* to open the console\
    \ window:\n\nThe output in the Console window is shown next\n\n![](images/Img_19_02.jpg)\n\
    \n**Figure 19.2:** Encoding and decoding JSON\n\nLet me dissect what happens here.\n\
    \nFirst, a JavaScript object called `encodeData` is created and given values such\
    \ as name, age and title. Then, a variable named `encodeString` makes use of the\
    \ `stringify` method in JSON to convert the JavaScript object to a JSON object.\n\
    \nSecond is basically the opposite. You supplied a JSON object to the parse method\
    \ of JSON to convert it to an ordinary JavaScript object.\n\n# [AJAX and JavaScript](#toc.xhtml_s296a)\n\
    \nAJAX is not a programming language. AJAX stands for Asynchronous JavaScript\
    \ and XML and makes use of:\n\n*   A browser built-in `XMLHttpRequest` object\
    \ that requests data from a web server.\n\n*   JavaScript and HTML DOM that displays\
    \ or uses the data.\n\nThe real power of AJAX is that it allows web pages to be\
    \ updated asynchronously by exchanging data with a web server behind the scenes,\
    \ meaning it is possible to update parts of a web page, without the need of reloading\
    \ the whole page.\n\nHere’s a breakdown on how AJAX works. An event occurs on\
    \ a web page:\n\n*   JavaScript creates an `XMLHttpRequest` object.\n\n*   The\
    \ `XMLHttpRequest` object sends a request to a web server.\n\n*   The server processes\
    \ the request.\n\n*   The server sends a response back to the web page.\n\n* \
    \  JavaScript read the response.\n\n*   JavaScript performs the appropriate action.\n\
    \nThe next little exercise, you will do demonstrates how to use AJAX with JavaScript\
    \ and another scripting language called **PHP**. PHP is a server scripting language,\
    \ so keep in mind that the PHP file must exist on a server for this exercise to\
    \ work completely:\n\n1.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code:\n\n    `<?php`\n\n    `if(isset($_GET[“studentFirstName”])\
    \ && isset($_GET[“studentLastName”])) {`\n\n    `$fname = htmlspecialchars($_GET[“studentFirstName”]);`\n\
    \n    `$lname = htmlspecialchars($_GET[“studentLastName”]);`\n\n    `$studentFullName\
    \ = $studentFirstName.“ “.$studentLastName;`\n\n    `echo “Hello, $studentFullName!`\
    \ `Welcome!”;`\n\n    `} else {`\n\n    `echo “Hi there, stranger!` `Welcome!”;`\n\
    \n    `}`\n\n    `?>`\n\n2.  Save the file with an HTML extension, for example\
    \ `greet.php`.\n\n3.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code:\n\n    `<!DOCTYPE html>`\n\n    `<head>`\n\n    `<script>`\n\
    \n    `function showStudentName() {`\n\n    `var request = new XMLHttpRequest();`\n\
    \n    `request.open(“GET”, “greet.php?studentFirstName=Ockert&studentLastName=du\
    \ Preez”);`\n\n    `request.onreadystatechange = function() {`\n\n    `if(this.readyState\
    \ === 4 && this.status === 200) {`\n\n    `document.getElementById(“result”).innerHTML\
    \ = this.responseText;`\n\n    `}`\n\n    `};`\n\n    `request.send();`\n\n  \
    \  `}`\n\n    `</script>`\n\n    `</head>`\n\n    `<body>`\n\n    `<h1>AJAX Example</h1>`\n\
    \n    `<p>AJAX Example</p>`\n\n    `<div id=”result”>`\n\n    `<p>Result will\
    \ be displayed here</p>`\n\n    `</div>`\n\n    `<button type=”button” onclick=”showStudentName()”>Show\
    \ Full Name</button>`\n\n    `</body>`\n\n    `</html>`\n\n4.  Save the file with\
    \ an HTML extension, for example `Chapter 19.4.html`.\n\n5.  Double-click the\
    \ file to open it in the default browser. As mentioned, if the PHP file is saved\
    \ on the server and everything is set up properly, you will not get errors when\
    \ loading this document.\n\nWhat happened here? The `greet.php` is a PHP file\
    \ that exists on a server. It tests to see if the `studentFirstName` and `studentLastname`\
    \ fields contain information. If they do, their values get stored inside two PHP\
    \ variable objects `fname` and `lname,` respectively.\n\nThe `studentFullName`\
    \ PHP variable consists of a combination of the `fname` and `lname` variables\
    \ separated by a space character. If values were supplied, a message greeting\
    \ the student by his/her full nameswould appear; else, a message greeting a stranger\
    \ will appear.\n\nIn the file `Chapter19.4html`you created a function named `showStudentName`.\
    \ The object is function is to call the logic inside the `greet.php` file to combine\
    \ the given first name and last name. If the function is successful, it will display\
    \ the full name inside the `div` named result.\n\n# [Languages based on or influenced\
    \ by JavaScript](#toc.xhtml_s297a)\n\nThe following languages are a few of the\
    \ many languages that were influenced in some way by JavaScript:\n\n*   ActionScript\n\
    \n*   AtScript\n\n*   CoffeeScript\n\n*   Dart\n\n*   JScript .NET\n\n*   LiveScript\n\
    \n*   Objective-J\n\n*   Opa\n\n*   QML\n\n*   Raku\n\n*   TypeScript\n\nI’m quickly\
    \ going to explain some of these.\n\n# [ActionScript](#toc.xhtml_s298a)\n\nActionScript\
    \ is an object-oriented programming language developed by *Macromedia Inc*. Here\
    \ is a small example on how to create an ActionScript function:\n\n1.  Open a\
    \ text editor of your choice and enter the following code\n\n    `package{`\n\n\
    \    `import flash.display.Sprite;`\n\n    `public class Main extends Sprite{`\n\
    \n    `public function Main(){`\n\n    `showGreeting();`\n\n    `}`\n\n    `function\
    \ showGreeting():void {`\n\n    `trace(“Hello ActionScript”);`\n\n    `}`\n\n\
    \    `}`\n\n    `}`\n\n2.  Save the file with an HTML extension, for example `actionscript_ex.as`.\n\
    \nQuite simple and easy to follow.\n\n# [CoffeeScript](#toc.xhtml_s299a)"
