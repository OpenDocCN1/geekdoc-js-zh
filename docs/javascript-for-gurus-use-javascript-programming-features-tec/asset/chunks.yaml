  trans: '


    * 在 JavaScript 和 HTML 中导入模块函数

    * 了解模块的优点

    * 了解 CORS 以及如何解决 CORS 问题

    * 了解什么是模块打包器（Bundlers）


    # 什么是模块？


    在`第 1 章：JavaScript 的力量及其用途]`中，我们讨论了 JavaScript 语言的历史和起源。快进十二十年后，这种语言已经有了巨大的增长，对其的需求也更加迫切。


    过去 JavaScript 仅用于提供交互和一些脚本任务，而现在它的用途要广泛得多。简单来说：没有 JavaScript，2019 年就没有网页。


    在过去，当开发者需要在页面中实现类似的功能时，他们只需将脚本复制粘贴到每个页面，或者创建 JavaScript 库。组织大型且通用的脚本是一项困难且麻烦的任务。幸运的是，今天存在一种组织大型脚本的机制，这些被称为模块。


    # 模块


    模块是一个包含 JavaScript 代码的文件，它允许你将 Web 应用程序拆分为逻辑单元。模块是自包含的，具有独特且特定的功能。这允许开发者在移除某些模块或添加新模块，而不会破坏整个应用程序。


    # 模块的优点


    使用模块的优点包括：


    * **可重用性**：拥有可重用的脚本或函数可以节省大量时间。你不需要在不同的地方编辑相同的代码；不需要在不同的地方进行相同的更改。模块中的代码是可重用的——需要时只需在模块内部进行更改，代码就可以轻松在不同的地方使用。

    * **可维护性**：模块是自包含的。模块减少了对脚本代码部分的依赖，因为更新模块与其他代码是解耦的。

    * **避免命名空间污染**：顶层函数范围之外的变量是全局变量。这会导致命名空间污染，即无关的代码共享全局变量。模块允许通过为变量创建私有空间来避免这个问题。


    # 使用模块


    可以使用 `export` 和 `import` 关键字从一个模块调用另一个模块的函数并交换功能。


    # 导出模块


    `export` 标识你想要向其他模块暴露的变量和函数。解释如何导出函数最好的方法就是亲自实践，所以让我们来练习吧！


    以下示例创建一个包含两个函数的型模块，这些函数可以被导出供其他模块使用：


    1. 打开你喜欢的文本编辑器并输入以下 JavaScript 代码：


    ```javascript

    export function sayHello(name) {

    alert(‘Hello, ${name}!’);

    }

    export function sayBye(name) {

    alert(‘Bye, ${name}!’);

    }

    ```


    2. 以 `.mjs` 扩展保存文件，例如 `greet.mjs`。


    通过使用 `.mjs` 扩展保存文件，你表示该文件中没有其他代码，从而使其成为一个模块。`.mjs` 扩展有助于保持你的 JavaScript 模块和 JavaScript
    类更有组织。此模块包含两个简单的函数，只需产生一个带有特定欢迎语的警告框。


    这里需要注意的最重要的一点是小单词：`export`。它允许从其他模块该函数。


    我们将在本章中继续使用这个示例，所以暂时保持该文件不变。


    # 导入模块


    `import` 关键字允许你从其他模块导入功能。让我们看看如何从现有模块将函数导入另一个模块中：


    1. 打开你喜欢的文本编辑器并输入以下 JavaScript 代码：


    ```javascript

    import {sayHello} from ‘./greet.mjs’;

    import {sayBye} from ‘./greet.mjs’;

    alert(sayHello); // function…

    sayHello(‘Ockert’); // Hello, Ockert!

    alert(sayBye); // function…

    sayBye(‘Ockert’); // Bye, Ockert!

    ```


    2. 以 `.mjs` 扩展保存文件，例如 `main.mjs`。


    如你所示，从其他模块导入函数非常简单。你只需要使用 `import` 关键字从目标模块导入所需的函数。因此，在上面的代码中，你从名为 `greet.js`
    的模块中导入了 `sayHello` 和 `sayBye` 函数。


    函数导入后，就可以像普通函数一样使用。现在让我们看看如何将函数导入到 HTML 网页中。


    以下示例演示了如何将模块导入到你的网页页面中：


    1. 打开你喜欢的文本编辑器并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>Import module functions example</h1>

    <p>Import module functions example</p>

    <script type=”module">

    import {sayHello} from ‘./greet.mjs’;

    import {sayBye} from ‘./greet.mjs’;

    document.body.innerHTML = sayHello(‘Ockert’);

    //document.body.innerHTML = sayBye(‘Ockert’);

    </script>

    </body>

    </html>

    ```


    2. 以 HTML 扩展保存文件，例如 `Chapter 11.1.html`。

    3. 双击文件在默认浏览器中打开它。

    4. 如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口。


    我们将脚本类型标识为模块，然后导入函数。现在，这可能有效也可能无效，如下方的 `图 11.1` 所示。为什么？因为 CORS：


    ![](img/Img_11_01.jpg)


    **图 11.1:** 控制台窗口中的错误


    另一种导入模块的方法是。


    以下示例演示了如何将模块导入到你的网页页面中：


    ```html

    <html>

    <body>

    <h1>Import module functions example</h1>

    <p>Import module functions example</p>

    <script type=”module” src=”greet.mjs"></script>

    <script>

    document.body.innerHTML = sayHello(‘Ockert’);

    document.body.innerHTML = sayBye(‘Ockert’);

    </script>

    </body>

    </html>

    ```


    2. 以 HTML 扩展保存文件，例如 `Chapter 11.2.html`。

    3. 双击文件在默认浏览器中打开它。

    4. 如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口。


    脚本文件的源被设置为目标模块。这稍微快一点且更易读。两个网页都可能因为**跨源资源共享**（**CORS**）产生错误。让我解释一下它。


    # 跨源资源共享 (CORS)


    **跨源资源共享** (**CORS**) 利用额外的 HTTP Header 通知浏览器允许 Web 应用程序访问不同源的选资源。这通常发生在 Web 应用程序请求与其自身不同域、协议或端口的资源时。


    CORS 添加了新的 HTTP Header 来描述哪些源允许从 浏览器读取信息。对于 GET 和 POST 以外的 HTTP 请求方法，可能会对服务器数据产生副作用，浏览器应该预检请求。这通过
    `HTTP OPTIONS` 请求方法向服务器询问支持的方法。


    这是它的工作原理。


    假设用户访问了以下网站：[`www.javascriptforgurus.com`](http://www.javascriptforgurus.com)，该网站上的一个页面尝试跨源请求以从
    [`service.javascriptforgurus.com`](http://service.javascriptforgurus.com) 获取一些数据。兼容
    CORS 的浏览器将尝试以以下方式向 `service.javascriptforgurus.com` 发起跨源请求。


    兼容 CORS 的浏览器发送一个带有 `Origin` Header 的 `OPTIONS` 请求到 [`service.javascriptforgurus.com`](http://service.javascriptforgurus.com)，该
    Header 包含父页面的域：


    '
- fmt: "\n`http://www.javascriptforurus.com`\n\nThe server at `http://service.javascriptforurus.com`\
    \ may respond with any of the following:\n\n* An `Access-Control-Allow-Origin`\
    \ header showing which sites are allowed. For example:\n    `Access-Control-Allow-Origin:\
    \ http://www.javascriptforurus.com`\n* An `Access-Control-Allow-Origin` header\
    \ with a wildcard that allows all domains. For example:\n    `Access-Control-Allow-Origin:\
    \ *`\n* An error page\n\n# CORS preflight request\n\nEarlier I mentioned that\
    \ browsers should `preflight` requests. When performing cross-domain requests,\
    \ CORS-compatible browsers insert `preflight` requests that determine whether\
    \ they have permission to perform the action. Here is a small example:\n\n`OPTIONS\
    \ /`\n`Host: service.javascriptforurus.com`\n`Origin: http://www.javascriptforurus.com`\n\
    \nIf `service.javascriptforurus.com` accepts the action, it responds with the\
    \ following headers:\n\n`Access-Control-Allow-Origin: http://www.javascriptforurus.com`\n\
    `Access-Control-Allow-Methods: PUT, DELETE`\n\nAnother example follows. This example\
    \ demonstrates a client asking a server if it allows `DELETE` requests, before\
    \ sending the `DELETE` preflight request:\n\n`OPTIONS http://www.javascriptforurus.com`\n\
    `Access-Control-Request-Method: DELETE`\n`Access-Control-Request-Headers: origin,\
    \ x-requested-with`\n`Origin: http://www.javascriptforurus.com`\n\nAnd here follows\
    \ the server’s response:\n\n`HTTP/1.1 204 No Content`\n`Connection: keep-alive`\n\
    `Access-Control-Allow-Origin: http://www.javascriptforurus.com`\n`Access-Control-Allow-Methods:\
    \ POST, GET, OPTIONS, DELETE`\n`Access-Control-Max-Age: 86400`\n\nBecause the\
    \ server responded with `Access-Control-Allow-Methods` response, the server allows\
    \ the request. We’re still sitting with CORS problem. What do I mean? Well, the\
    \ exercise you have done still throws CORS errors, as shown in Figure 1.1. How\
    \ do we fix this?\n\nWell, there are plenty of ways to bypass CORS errors; here\
    \ are a few that might work in Google Chrome:\n\n* Origin & CORS Changer\n* Command\
    \ Prompt\n* Out of blink CORS\n\n# Origin & CORS Changer\n\nThe `Origin & CORS\
    \ Changer` Chrome plugin enables you to send cross-domain requests and override\
    \ origin and CORS headers without receiving errors. Use the next few steps to\
    \ install the `Origin & CORS Changer` plugin:\n\n1. Navigate to: `https://chrome.google.com/webstore/detail/origin-cors-changer/digfaphondkpccljibejppibc?hl=US`\n\
    2. Click on the `Add to Chrome` button to add this extension to Chrome. This is\
    \ shown in Figure 2.\n3. Restart your browser, if necessary.\n4. You will notice\
    \ a small icon next to your address bar. This is the extension. Click on it, the\
    \ next screen appears.\n5. Click on the `SWITCH ON` button, switch this extension\
    \ on.\n6. This should do the trick.\n\n# Command Prompt\n\nCommand Prompt executes\
    \ entered commands such as automate tasks via scripts and batch files, perform\
    \ administrative functions, and troubleshoot Windows issues. The next few steps\
    \ open Google Chrome in disabled security mode:\n\n1. Close all Google Chrome\
    \ instances.\n2. Press your Windows button on your keyboard.\n3. Type `cmd`. Press\
    \ `Enter`.\n4. The Command Prompt window will appear, as shown in Figure 4.\n\
    5. Enter the following command, and press enter:\n   `CD \"Program Files (x86)\\\
    Google\\Chrome\\Application\"`\n   This means change directory (folder) to the\
    \ location of the Chrome application file.\n6. Type in the following command,\
    \ and press `Enter`. The screen is in Figure 5:\n   `Chrome.exe --disable-web-security`\n\
    \   OR\n   `chrome.exe --user-data-dir=\"C://Chrome dev session\" --disable-web-security`\n\
    \   OR\n   `chrome.exe --disable-web-security --disable-gpu --user-data-dir=\"\
    C://Chrome dev session\"`\n7. This launches Chrome with disabled security, which\
    \ may not be a completely good idea.\n\nNow, let us have a look at the Out of\
    \ Blink CORS setting.\n\n# Out of blink CORS\n\nOut of blink, CORS is a Chrome\
    \ setting which you could use to enable or disable CORS checks. Use the next few\
    \ steps to disable Out of blink CORS:\n\n1. Open your Chrome browser (if it is\
    \ not already opened)\n2. Navigate to: `chrome://flags/#out-of-blink-cors`\n3.\
    \ Next to the `Out of blink CORS` setting, select `Disabled` from the dropdown,\
    \ as shown in Figure 6.\n"
  raw: "[http://www.javascriptforgurus.com](http://www.javascriptforgurus.com)\n\n\
