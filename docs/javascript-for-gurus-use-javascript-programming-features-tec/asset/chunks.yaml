    # else 语句


    `else` 语句用于在特定条件不存在时执行。所以，回到我最初那个关于我中彩票的类比。如果我没有中彩票，我必须继续工作而不能退休。在上面的两个练习中，如果时间既小于
    12 也小于 18，那么目前什么都不会发生。


    让我们改变一下！下面的示例添加了一个 `else` 语句：


    1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>If Statement example</h1>

    <p>If Statement example</p>

    <script>

    var time = new Date().getHours();

    if (time < 12) {

    greeting = “Good morning”;

    }

    else if (time < 18) {

    greeting = “Good afternoon”;

    }

    else {

    greeting = “Good evening”;

    }

    document.write(greeting);

    </script>

    </body>

    </html>

    ```


    2. 将该文件保存为 HTML 扩展名，例如 `Chapter 13.3.html`。


    3. 双击该文件并在默认浏览器中打开。


    当时间既小于 12 也小于 18 时，问候语将是 `Good evening`。


    # switch 语句


    在 JavaScript 中，你可以使用 `switch` 语句代替多个 `if` 和 `else if` 语句。`switch` 语句提供了一种更具描述性的方法来检查值相对于多个变体。


    下面的示例展示了如何创建一个 `switch` 语句：


    1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>Switch Statement example</h1>

    <p>Switch Statement example</p>

    <script>

    var objDay = new Date();

    switch (objDay.getDay())

    {

    case 0:

    console.log(“Sunday”);

    break;

    case 1:

    console.log(“Monday”);

    break;

    case 2:

    console.log(“Tuesday”);

    break;

    case 3:

    console.log(“Wednesday”);

    break


    case 4:

    console.log(“Thursday”);

    break;

    case 5:

    console.log(“Friday”);

    break;

    case 6:

    console.log(“Saturday”);

    break;

    default:

    console.log(“Choose a proper day”);

    break;

    }

    </script>

    </body>

    </html>

    ```


    2. 将该文件保存为 HTML 扩展名，例如 `Chapter 13.4.html`。


    3. 双击该文件并在默认浏览器中打开。


    它看起来比实际情况复杂得多！你创建了一个名为 `objDay` 的新 `Date` 对象。然后，`switch` 语句开始测试当前是星期几。这是通过使用 `getDay()`
    方法实现的。根据是哪一天，该会被记录到控制台中。在我的情况下，第 0 是 `Sunday`（星期日），第 6 是 `Saturday`（星期六）。如果你眼睛更敏锐，你会注意到每个
    case 语句之间的小小的 `break;`。这是为了表示当前分支的代码已执行完毕，不应继续执行其他 case。最后，放在那里的 `default` 是当没有任何
    case 满足时的值。让我们通过快速修改上面的代码再做另一个例子：


    1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>Switch Statement example</h1>

    <p>Switch Statement example</p>

    <script>

    var objDay = new Date();

    switch (objDay.getDay())

    {

    case 0:

    case 5:

    case 6:

    console.log(“Weekend!”);

    break;

    case 1:

    case 2:

    case 4:

    console.log(“Work”);

    break;

    case 3:

    console.log(“Off”);

    break;

    }

    </script>

    </body>

    </html>

    ```


    2. 将该文件保存为 HTML 扩展名，例如 `Chapter 13.5.html`。


    3. 双击该文件并在默认浏览器中打开。


    这里有一些不同之处。你可能会注意到 case 0 和 5 并没有以 `break` 语句结束。为什么？因为 case 0、5 和 6 执行的是相同的操作，即
    `Weekend`（周末）。这被称为“分组”，可以节省大量时间，而无需编写重复的代码。case 1、2 和 4 也是如此，它们代表工作日。例如，case 3
    (`Wednesday`，星期三）将是休息。


    现在我们已经理解了这些语句的基础知识，让我们来来点复杂的吧！


    # 嵌套语句


    嵌套意味着它被放置在类似的结构中。好吧，这告诉我不多！嵌套 `if` 语句是另一个 `if` 语句内部的 `if` 语句。嵌套 `switch` 语句是另一个
    `switch` 语句内部的 `switch` 语句。让我们来看看嵌套 `if` 语句的操作：


    1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>Nested If Statement example</h1>

    <p>nested If Statement example</p>

    <script>

    var studentAge = 15;

    if( studentAge < 18 )

    {

    document.write(“Under the age of 18!<br>”);

    document.write(“Needs parent’s consent to enroll.`);

    }

    else

    {

    if (studentAge >= 18 && studentAge <= 60 )

    {

    document.write(“Eligible to enroll<br>”);

    document.write(“Please continue to application page.”);

    }

    else

    {

    document.write(“Older than most students here.<br>”);

    document.write(“Would you prefer a softer chair and different time slot?”);

    }

    }

    }

    </script>

    </body>

    </html>

    ```


    2. 将该文件保存为 HTML 扩展名，例如 `Chapter 13.6.html`。


    3. 双击该文件并在默认浏览器中打开。


    如你所见，在代码中包含空白有助于观察脚本的流程。创建了一个名为 `studentAge` 的变量并赋值为 15。外层 `if` 语句测试 `studentAge`
    是否小于 18。如果 `studentAge` 小于 18（目前它确实为 15），则页面将告知用户年龄未满 18 岁，且父母需要对学生的入学授权。


    这里是有趣开始的地方。


    在 `else` 语句中（意味着 `studentAge` 变量的值为 18 或更高），我放置了另一个 `if` 语句。这就是嵌套。嵌套的 `if` 语句检查
    `studentAge` 是否大于或等于 18 且小于或等于 60。如果这两个条件都满足，即 `studentAge` 大于或等于 18 且小于或等于 60，页面将通知用户其有资格入学。


    如果 `studentAge` 大于 60，嵌套 `if` 语句的 `else` 子句就会触发，并告知用户他们可能比其他人大，并询问是否需要更软的椅子。


    所有可能的结果都显示在下面的图 13.2 中：


    ![](img/Img_13_02.jpg)


    **图 13.2:** 嵌套 if 语句结果


    让我们来疯狂一下，接着看看嵌套 `switch` 语句：


    1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：


    ```html

    <!doctype html>

    <body>

    <h1>Nested Switch Statement example</h1>

    <p>Nested Switch Statement example</p>

    <script>

    var Stops = 30;

    var Location = ‘South Africa’;

    switch(Location)

    {

    case ‘South Africa’:

    switch(Stops)

    {

    case 10:

    document.write(‘Visiting 10 places in 10 days’);

    break;

    case 20:

    document.write(‘Visiting 20 places in 20 days’);

    break;

    case 30:

    document.write(‘Visiting 30 places in 30 days’);

    break;

    }

    break;

    case ‘India’:

    switch(Stops)

    {

    case 5:

    document.write(‘Visiting 5 places in 5 days’);

    break;

    case 15:

    </script>

    </body>

    </html>

    ```


