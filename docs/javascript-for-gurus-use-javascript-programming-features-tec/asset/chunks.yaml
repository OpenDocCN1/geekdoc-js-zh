    \n2. Save the file with an HTML extension, for example `Chapter 11.5.html`.\n\n\
    If a modern browser is used, all the modules can be interpreted and used. However,\
    \ when an older browser is used, it makes use of an older JavaScript file.\n\n\
    # Bundlers\n\nIn large websites, it is always easier to make use of bundlers such\
    \ as `webpack`, `Rollup`, or `Parcel` to bundle your scripts.\n\nBundlers achieve\
    \ the following:\n\n* Analyze a module’s dependencies, which include imports and\
    \ imports of imports.\n* Build one singular file with all modules.\n* Removes\
    \ unreachable code.\n* Removes unused exports\n* Minifies file. This removes spaces\
    \ and replaces variables with shorter names\n\nI have mentioned the three most\
    \ popular bundlers (`webpack`, `Rollup`, `Parcel`), let me quickly tell you what\
    \ they’re about.\n\n## Quick notes on Bundlers\n\n* `webpack`: `webpack` is a\
    \ static module bundler for modern JavaScript applications. It builds a dependency\
    \ graph which maps every module your project needs and generates one or more bundles.\
    \ `webpack` can be found here: [https://webpack.js.org/concepts/](https://webpack.js.org/concepts/)\n\
    * `rollup.js`: `Rollup` compiles small pieces of code into something larger, such\
    \ as a library or application. `Rollup` can be found here: https://rollupjs.org/guide/en/\n\
    * `parcel.js`: `Parcel` is a web application bundler that offers fast performance\
    \ and requires zero configurations. Find `Parcel` here: [https://parceljs.org/getting_started.html](https://parceljs.org/getting_started.html)\n\
    \nSmaller websites may not have to use bundlers but remember: the more imports\
    \ there are, the more bottlenecks may appear, and the more confusion of where\
    \ a certain function is or not.\n\n# Conclusion\n\nIn this chapter, we learned\
    \ what modules are and why and how you should use them. You had a look at its\
    \ benefits, and what happens when older browsers do not understand modules. You\
    \ learned about `CORS` and some tools available, especially in the developing\
    \ phase. You have learned about the various bundler tools available.\n\nIn the\
    \ next chapter, we will kick off the *Using JavaScript Productively* section by\
    \ explaining variables, data types and scope.\n\n# Questions\n\n1. Give an example\
    \ of how to export a module function.\n2. Give an example of how to import a module\
    \ function.\n3. Explain what makes dynamic importing so different.\n4. What is\
    \ the `nomodule` attribute used for?\n5. Explain the term `CORS`.\n\n# SECTION\
    \ III\n\n# Using JavaScript Productively\n\n## Introduction\n\nSection 3 dives\
    \ right into the real power of JavaScript. Understanding what makes JavaScript\
    \ tick is pivotal in creating extremely powerful websites and web applications.\
    \ In this section, you will learn how to create classes, and then move on to prototypes,\
    \ properties and promises, finally generators and modules\n\nThis section will\
    \ have the following chapters:\n\n1. Variables\n2. Control Flow Statements\n3.\
    \ Loops\n4. Code Quality\n\n# CHAPTER 12\n\n## Variables\n\n### Introduction\n\
    \nA variable is a named container for a piece of information. The container is\
    \ in memory and holds temporary values.\n\nIn this lesson, you will learn what\
    \ variables are. You will learn how to declare variables, and most importantly,\
    \ you will learn about the various primitive data types in the JavaScript language.\
    \ This lesson is jam-packed with exercises, so let’s get started!\n\n### Structure\n\
    \n* Declaring variables\n* Scope\n* Primitive types\n\n### Objectives\n\n* Learn\
    \ how to declare variables.\n* Understand variable scope\n* Create and use the\
    \ various built-in primitives:\n    * String\n    * Boolean\n    * Number\n  \
    \  * BigInt\n    * Symbol\n    * Null\n    * undefined\n\n### Declaring variables\n\
    \nYou create variables by using the `var` keyword. This process creates a named\
    \ memory location ready to store values.\n\nYou create a variable the following\
    \ way:\n\n```javascript\nvar progStudent;\n```\n\nThe variable is created and\
    \ currently contains no value. Later in this chapter, I will introduce you to\
    \ the `undefined` primitive type.\n\nWe have the variable, now what? We need to\
    \ store a value inside it. We do so by assigning it a value, as shown next:\n\n\
    ```javascript\nprogStudent = \"Ockert du Preez\";\n```\n\nIn an assignment you\
    \ specify the variable name on the left-hand side, then use the assignment operator\
    \ which is the equal sign and then supply the value you’d like to store in that\
    \ variable. Here is another example of two:\n\n```javascript\nvar Age;\nAge =\
    \ 41;\n```\n\nOR\n\n```javascript\nvar Grades;\nGrades = 75.5;\n```\n\nOR\n\n\
    ```javascript\nvar progStudent = \"Ockert du Preez\", Age = 41, Grades = 75.5;\n\
    ```\n\nSome rules for naming are as follows:\n\n* Object names can contain letters,\
    \ digits, underscores, and even dollar signs.\n* Object names can begin with a\
    \ letter or `_`.\n* Object names are case sensitive, `varname` is different from\
    \ `varName` and `VarName`.\n* JavaScript keywords cannot be used as names\n\n\
    The last thing I’d like to mention that creating variables is the scope, as explained\
    \ next.\n\n## Scope\n\nThe scope of a variable means where it is known. To explain\
    \ it simpler: At home, you are known to your close family. At work, you are known\
    \ to your co-workers. JavaScript has two types of scope:\n\n* Local\n* Global\n\
    \n## Local Scope versus Global\n\nA local variable will be visible only within\
    \ a function where it is defined. A global variable has a global scope which means\
    \ it can be defined anywhere in your code.\n\n## Primitive types\n\nIn [Chapter\
    \ 2: JavaScript Objects](#c02a), I briefly spoke about Primitives. Here is a quick\
    \ refresher. Primitive values are values that do not have properties or methods.\
    \ A primitive data type is simply data that has a primitive value. There are actually\
    \ seven types of primitive types in JavaScript, and they are:\n\n* string\n* number\n\
    * BigInt\n* null\n* undefined\n* boolean\n* Symbol\n\nEverything else is an object.\n\
    \n### String\n\nThe JavaScript string data type represents textual data. Examples\
    \ of strings include:\n\n* ‘Ockert’\n* “BpB”\n* “1”\n\nUnlike many other programming\
    \ languages, there is no separate data type for a single character. JavaScript\
    \ strings are immutable, which means that once a string is created, it cannot\
    \ be modified. You can make another string which is based on an operation on the\
    \ original string with functions such as `String.concat()` which joins two strings\
    \ together and `String.substr()` which allows you to take out part of the string.\n\
    \nI will go into string functions a bit later.\n\nNow, how do I identify or set\
    \ a string?\n\n### Quotes\n\nYou will notice at the beginning of this topic that\
    \ I have placed all the strings inside quotes. But, if you look closer, you will\
    \ notice that I have made use of two different types of quotes, the single quote\
    \ and double quote. Another way to identify a string is by making use of backticks.\n"
