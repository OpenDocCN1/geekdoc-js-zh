  trans: "\n\n```javascript\n// mixin\nlet HumanMixin = {\n  cry() {\n    alert('Stop\
    \ crying’);\n  },\n  laugh() {\n    alert('Be happy’);\n  }\n};\n\nfunction Student\
    \ (studentFirstName, studentLastName) {\n  this.studentFirstName = studentFirstName,\n\
    \  this.studentLastName = studentLastName\n}\nStudent.prototype.attendClass =\
    \ function (timeIn, timeOut) {\n  console.log(this.studentFirstName + ‘ arrived\
    \ for class at: ‘ + timeIn + ‘ and left at ‘ + timeOut)\n}\nStudent.prototype.writeExam\
    \ = function () {\n  console.log(this.studentFirstName + ‘ is writing exam.’)\n\
    }\nfunction ProgrammingStudent(studentFirstName, studentLastName, language) {\n\
    \  Student.call(this)\n  this.language = language\n}\nProgrammingStudent.prototype\
    \ = Object.create(Student.prototype)\n// copy the methods from HumanMixin\nObject.assign(ProgrammingStudent.prototype,\
    \ HumanMixin);\nconst progStudent = new ProgrammingStudent('Ockert’, ‘du Preez’,\
    \ ‘JavaScript’).laugh();\n```\n\n2 将文件保存为 HTML 扩展名，例如 `Chapter 7.6.html`。\n\n\
    3. 双击文件在默认浏览器中打开它。\n\n4. 如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口。下方将显示一个类似\
    \ `Figure 7.7` 的警框：\n\n![](img/Img_07_07.jpg)\n\n**图 7.7:** Mixin 方法\n\n部分代码看起来很熟悉。我尝试让练习尽可能简单，并让每个练习都建立在上一个练习的基础上。让我们分析一下这些代码。\n\
    \n你创建了一个名为 `HumanMixin` 的 Mixin，包含两个方法：`cry()` 和 `laugh()`。你创建了一个 `Student` 类，然后利用继承创建了一个基于\
    \ `Student` 类的 `ProgrammingStudent` 类。这意味着 `ProgrammingStudent` 现在包含了它自己的方法和属性，以及继承自\
    \ `Student` 类的方法和属性。\n\n通过以下代码，你使用 `Object` 的 `assign` 方法将 Mixin 的方法复制到目标类中。最后，你简单地使用了\
    \ `laugh` 方法，该方法现在也存在于 `ProgrammingStudent` 类中：\n\n`Object.assign(ProgrammingStudent.prototype,\
    \ HumanMixin);`\n\n`const progStudent = new ProgrammingStudent('Ockert’, ‘du Preez’,\
    \ ‘JavaScript’).laugh();`\n\n# 结论\n\n在本章中，我们学习了 JavaScript 原型（prototypes）。为了充分利用\
    \ JavaScript 的力量，你需要了解它的面向对象特性，例如原型。原型允许你通过继承和 Mixins 来扩展 JavaScript 类。\n\n在下一章中，我们将深入研究\
    \ JavaScript 属性。你将学习如何正确创建属性。我们将转向为属性创建 getter（get 器）和 setter（set 器），以及更复杂的特性，如属性标志和属性描述符。\n\
    \n# 问题\n\n1. 解释什么是原型（prototype）。\n2. 使用原型有哪些好处？\n3. 解释什么是原型继承。\n4. 为什么要使用 Mixins？\n\
    5. 如何将属性附加到原型上？\n\n# 第 8 章\n\n# JavaScript 属性\n\n# 介绍\n\nJavaScript 中的属性允许你在应用程序生命周期内存储和设置各种值。通过在属性中存储信息，可以为应用程序提供更好的结构。\n\
    \n在本节中将创建属性并学习如何将每个属性的特征设为可写或只读。你将学习对象属性和访问器属性（accessor properties）之间的区别。最后，你将学习\
    \ getter 和 setter 的内部细节。\n\n# 结构\n\n* 什么是属性？\n* 属性的属性\n* Getter 和 setter\n\n#\
    \ 目标\n\n* 学习什么是属性\n* 理解属性\n* 创建属性\n\n# 什么是属性？\n\n在*第 6 章：类*中，我们看到过对象具有某些属性。例如，这里有属性包括：\n\
    \n* 品牌 (Make)\n* 型 (Model)\n* 变速箱 (Transmission)\n* 颜色 (Color)\n*  (Number)\n\n\
    属性最常见的特征是它的值和名称。为了访问任何属性的特征，你可以使用 `getOwnPropertyDescriptor` 方法。你提供想要查询的对象，然后是属性名。\n\
    \n下面的示例展示了 `getOwnPropertyDescriptor` 的用法：\n\n```html\n<html>\n<body>\n  <h1>Object.getPropertyDescriptor\
    \ example</h1>\n  <p>Object.getPropertyDescriptor example</p>\n  <script>\n  \
    \  let student = class {\n      constructor(studentName, studentCourse) {\n  \
    \      this.studentName = studentName;\n        this.studentCourse = studentCourse;\n\
    \      }\n      showInfo() {\n        let descriptor = Object.getOwnPropertyDescriptor(newStudent,\
    \ ‘studentName’);\n        alert(JSON.stringify(descriptor, null, 2));\n     \
    \ }\n    };\n\n    // Usage:\n    var newStudent = new student('Ockert’, ‘JavaScript’);\n\
    \    newStudent.showInfo();\n  </script>\n</body>\n</html>\n```\n\n# 属性特征\n\n\
    属性的特征取决于赋值。共有三个：\n\n*   **writable**（可写性）：决定属性的值是否可以被更改。\n*   **enumerable**（可枚举性）：属性可以在循环中被列出吗？\n\
    *   **configurable**（可配置性）：允许删除属性或修改属性特征。\n\n这些都取决于某个特定属性的特征（或标志）。某些属性是只读的，无法更改。设置属性时，使用点符号法。这是一个示例：\n\
    \n```javascript\nstudentCourse = “JavaScript”;\n```\n\n这非常简单！下方将显示一个类似 `Figure\
    \ 7.7` 的警框：\n\n![](img/Img_07_07.jpg)\n\n**图 7.7:** Mixin 方法\n\n"
- fmt: "\n**Figure 8.1:** `studentName` attributes\n\nTo change these attributes,\
    \ you should use the `defineProperty` method of the `Object` class. The next example\
    \ changes the writable attribute of the `studentName` property to `false`. This\
    \ means that this property is now read-only and cannot be changed from code:\n\
    \n```javascript\nObject.defineProperty(newStudent, “studentName”, {\nwritable:\
    \ false\n}); own```\n\n```javascript\nnewStudent.studentName = “Test”; // Error:\
    \ Cannot assign to read only property ‘studentName’ own```\n\n*[Figure 8.2](#c08.xhtml_fig8_2)*\
    \ shows the error if code similar to the code segment above was run inside the\
    \ browser:\n\n![](images/Img_08_02.jpg)\n\n**Figure 8.2:** `defineProperty` error\n\
    \nNow that we have a proper understanding of properties, let’s move on to creating\
    \ getters and setters for our properties.\n\n# Getters and setters](#toc.xhtml_s124a)\n\
    \nSo far, in this book, I have mostly dealt with data properties. There is another\
    \ type of property called an accessor property. This means that these types of\
    \ properties are actually functions that can get and set values but are seen as\
    \ regular properties from the outside.\n\nAccessor properties contain `getter`\
    \ and `setter` methods, as shown next:\n\n```javascript\nlet object = {\n  get\
    \ propertyName() {\n    //Code executed on getting object.propertyName\n  },\n\
    \  set propertyName(value) {\n    // Code executed on setting object.propertyName\
    \ = value\n  }\n};\n```\n\nIn the object declaration above, you will notice a\
    \ `get` and a `set`. Get will execute when the object’s property is requested.\
    \ For example: `c = Object.Color`. The get function will return the value of the\
    \ object’s `Color` property to the variable named `c`.\n\nSet is used to give\
    \ a property value. For example: `Object.Color = Red`. The `Color` property will\
    \ be set to `Red` via the use of the setter.\n\nLet’s do a small exercise so that\
    \ you can see how easy it is to make use of getters and setters.\n\n1.  Open a\
    \ text editor of your choice and enter the following HTML and JavaScript code:\n\
    \n```html\n<html>\n<body>\n    <h1>Property Getters and Setters example</h1>\n\
    \    <p>Property Getters and Setters example</p>\n    <script>\n    let Student\
    \ = {\n        studentName: “Ockert”,\n        studentSurname: “du Preez”,\n \
    \       get studentFullName() {\n            return ‘${this.studentName} ${this.studentSurname}’;\n\
    \        },\n        set studentFullName(value) {\n            [this.studentName,\
    \ this.studentSurname] = value.split(“ “);\n        }\n    };\n    Student.studentFullName\
    \ = “BpB Publications”;\n    alert(Student.studentName); //BPB\n    alert(Student.studentFullName);\
    \ //BpB Publications\n    </script>\n</body>\n</html>\n```\n\n2.  Save the file\
    \ with an HTML extension, for example `Chapter 8.3.html`.\n\n3.  Double-click\
    \ the file to open it in the default browser.\n\nWith the use of the setter, you\
    \ set the `studentFullName` property to `BPB Publications`. If there was no property\
    \ setter but a property letter, then you might have gotten an error. With the\
    \ use of the property getter, you got access to the property’s current value.\
    \ When opened, two alertboxes will be displayed. One showing `BpB`, and the next\
    \ showing `BPB Publications`.\n\n*[Figure 8.3](#c08.xhtml_fig8_3)* shows a combination\
    \ of the given alertboxes based on the above example:\n\n![](images/Img_08_03.jpg)\n\
    \n**Figure 8.3:** Getter and setter properties\n\nJust as with property flags,\
    \ explained earlier in this chapter, there are descriptors for accessors. Let’s\
    \ have a look at them.\n\nAccessor descriptors differ slightly from descriptors\
    \ those for data properties. Accessor properties have no writable descriptor but\
    \ include get and set functions. Accessor descriptors have the following:\n\n\
    *   **get**: Works when a property is read.\n*   **set**: Called when the property\
    \ is set.\n*   **enumerable**: Can the property be listed.\n*   **configurable**:\
    \ Allows property deletion.\n"
