- fmt: "\nA symbol represents a unique identifier, and it is guaranteed to be unique.\n\
    \nHere is a short example. The following sample demonstrates how to create and\
    \ use Symbols:\n\n1.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code\n\n    ```html\n<!doctype html>\n<body>\n<h1>Symbol\
    \ example</h1>\n<p>Symbol example</p>\n<script>\n  let student = {\n  name: “Ockert”\n\
    \  };\n  let id = Symbol(“id”);\n  student[id] = 123;\n  alert( student[id] );\n\
    </script>\n</body>\n</html>\n    ```\n\n2.  Save the file with an HTML extension,\
    \ for example `Chapter 12.8.html`.\n\n3.  Double-click the file to open it in\
    \ the default browser\n\nWhen run, the ID `idsymbol` is assigned to the `student`\
    \ object, and it will produce `123`.\n\n# Conclusion\n\nIn this chapter, we learntabout\
    \ data types and variables. Without variables, you cannot store any information\
    \ or manipulate information. Most importantly, you have learned which data type\
    \ is correct for which use.\n\nIn the next chapter, we willdig into control-flow\
    \ statements. Although you may have seen them during this book, in the further\
    \ chapter, we will explain all the ins and outs of how to include logic in your\
    \ scripts with the use of control-flow stamens.\n\n# Questions\n\n1.  What is\
    \ a variable?\n2.  What is the difference between local and global scope?\n3.\
    \  Name the seven primitive data types.\n4.  Name three-string functions.\n5.\
    \  What is a symbol?\n\n# CHAPTER 13\n\n## Control Flow Statements\n\n## Introduction\n\
    \nControlflow statements dictate the flow of your script based on conditions or\
    \ small little tests it performs. These tests can include testing for the time\
    \ of day, or the user’s age, or whether a certain piece of information was supplied.\n\
    \nIn this lesson, you will learn what controlflow statements are, and which statements\
    \ are best suited for your particular needs. You will learn how to make use of\
    \ the `if` statement, `else…if` statement and `else` to execute code depending\
    \ on a situation. You will then learn how the `switch` statement and the conditional\
    \ operator can save you time. Lastly, you will learn how to nest statements.\n\
    \n## Structure\n\n*   Control flow statements definition\n*   if\n*   else…if\n\
    *   else\n*   switch\n*   nested statements\n*   Conditional operator‘`?’\n\n\
    ## Objectives\n\n*   Understand how the control-flow statements work.\n*   Make\
    \ use of the `if` statement to test for conditions.\n*   Make use of the `else…if`\
    \ statement to test for multiple conditions.\n*   Make use of the `else` statement\
    \ when a condition is false.\n*   Understand how the `switch` statement works.\n\
    *   Understand how to nest `if` statements and `switch` statements.\n*   Know\
    \ how to use the conditional operator.\n\n## Control-flow statements definition\n\
    \nStatements get executed one line at a time. The browser’s interpreter starts\
    \ executing statements from top to bottom. This is known as the control flow of\
    \ the script or program. Very often, the control flow of the script can be changed\
    \ depending on certain conditions. These conditionals are unknown values or situations\
    \ that we, as developers need to test for.\n\nA good example will be if the website\
    \ requires a password to be entered. What happens if there is no text entered,\
    \ or the password entered is too short? Based on these situations, a different\
    \ branch of code should be executed. What if the password entered was wrong? Yet\
    \ another branch of code should get executed. What if the password entered was\
    \ correct? The branch that then gets executed would allow further user entry into\
    \ the website.\n\nHow do we do this? The answer is simple. Controlflow statements\
    \ such as `if`, `if…else`, `else`, `switch`, and the conditional operator. Let’s\
    \ have a look at each of them.\n\n## if statement\n\nWhat would you do if you\
    \ win the lottery? I know what I’d do! I’d pay off all my debt, buy a nice car.\
    \ Retire and go live somewhere off the grid and in the middle of nowhere with\
    \ my wife and kid. Bear with me; I’m trying to make a point.\n\nIt becomes night;\
    \ what do you do? You switch on lights, and when it becomes dawn, you start switching\
    \ off lights. It rains, and you’re outside. If you have an umbrella, you take\
    \ it out and use it. If you don’t have an umbrella, you run for shelter.\n\nNotice\
    \ the little two-letter keyword I keep using in my analogies?\n\nThe `if` statement\
    \ works the same way in a script. It is just a different platform. There are a\
    \ few things you need to test for namely:\n\n*   User interaction\n*   Certain\
    \ events or situations in your script\n*   Computer events.\n\nTo explain it better.\
    \ You may need to check the state of a variable in order to complete a task. A\
    \ user, for example, cannot continue to the site if certain information hasn’t\
    \ been supplied. Or, you may be busy with the following:\n\n```html\n<!doctype\
    \ html>\n<body>\n<h1>Symbol example</h1>\n<p>Symbol example</p>\n<script>\n  let\
    \ student = {\n  name: “Ockert”\n  };\n  let id = Symbol(“id”);\n  student[id]\
    \ = 123;\n  alert( student[id] );\n</script>\n</body>\n</html>\n```\n\n1.  Open\
    \ a text editor of your choice and enter the following HTML and JavaScript code:\n\
    \n    ```html\n<!doctype html>\n<body>\n<h1>Symbol example</h1>\n<p>Symbol example</p>\n\
    <script>\n  let student = {\n  name: “Ockert”\n  };\n  let id = Symbol(“id”);\n\
    \  student[id] = 123;\n  alert( student[id] );\n</script>\n</body>\n</html>\n\
    \    ```\n\n2.  Save the file with an HTML extension, for example `Chapter 12.8.html`.\n\
    \n3.  Double-click the file to open it in the default browser\n\nWhen run, the\
    \ ID `idsymbol` is assigned to the `student` object, and it will produce `123`.\n\
    \nThis is perhaps the most basic demonstration of an `if` statement. Because `time`\
    \ is a `Date` object, we can access `Date` properties such as `getHours`.\n\n\
    ```html\n<!doctype html>\n<body>\n<h1>Symbol example</h1>\n<p>Symbol example</p>\n\
    <script>\n  var time = new Date().getHours();\n  if (time < 12) {\n    greeting\
    \ = “Good morning”;\n  }\n  document.write(greeting);\n</script>\n</body>\n</html>\n\
    ```\n\nIf the hour is less than 12, then another variable `greeting` gets populated\
    \ with the text: `Good morning`. Lastly, the value of the greeting gets written\
    \ to the page.\n\n![](images/Img_13.jpg)\n\n**Figure 13.1:** if statement in action\n\
    \nThere may be times when one `if` statement isn’t enough. In comes the `else…if`\
    \ statement.\n\n## else…if statement\n\nThe `else…if` statement is used to check\
    \ for multiple conditions. If the original condition doesn’t exist, the flow jumps\
    \ to the next `else…if` statement, if that condition doesn’t exist, it continues\
    \ to the next, and so on. If none of the conditions exists, nothing happens, the\
    \ code in all the `if` and `else…if` statements simply will be executed.\n\nThe\
    \ following sample adds an `else…if` statement:\n\n```html\n<!doctype html>\n\
    <body>\n<h1>Symbol example</h1>\n<p>Symbol example</p>\n<script>\n  var time =\
    \ new Date().getHours();\n  if (time < 12) {\n    greeting = “Good morning”;\n\
    \  }\n  else if (time < 18) {\n    greeting = “Good afternoon”;\n  }\n  document.write(greeting);\n\
    </script>\n</body>\n</html>\n```\n\n2.  Save the file with an HTML extension,\
    \ for example `Chapter 13.2.html`.\n\n3.  Double-click the file to open it in\
    \ the default browser.\n\nIf time is less than 18, then a greeting `greeting`\
    \ will contain the message `Good afternoon`.\n\nEarlier I mentioned that when\
    \ no `else…if` condition exists, nothing will happen. Well, we can make something\
    \ happen!\n"
