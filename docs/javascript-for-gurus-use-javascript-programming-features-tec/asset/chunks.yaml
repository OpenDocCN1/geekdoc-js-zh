    模块允许你将逻辑从页面逻辑中移动出来。我们可以从模块中导入函数，也可以从模块中导出函数，这非常用户友好。\n\n在本节中，你将学习模块是什么。你将看到导出和导入模块函数是多简单。然后我们将深入讨论\
    \ CORS 以及它可能引起的问题以及 CORS 错误的解决方案。最后，你将学习对你的模块进行打包。\n\n# 结构](#toc.xhtml_s164a)\n\
