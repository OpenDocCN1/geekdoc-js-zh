    \ 输出\n\n让我们进入 ES6 类。\n\n# ES6 classes\n\n使用 ES6（ECMAScript 6 或 JavaScript 6）类就像使用\
    \ `new` 关键字配合用户定义的构造函数一样。构造函数简单地被类所取代。这是一个简短的示例：\n\n```javascript\nclass Car {\n\
    \  constructor(_make, _model) {\n    this.carMake = _make;\n    this.carModel\
    \ = _model;\n  }\n}\n```\n\n如下所示创建一个新的 `Car` 对象：\n\n```javascript\nmyCar = new\
    \ Car(“BMW”, “i8 Roadster”);\n```\n\n# ‘this’ 关键字\n\n`this` 关键字通常指的是它所属的对象。`this`\
    \ 关键字的含义取决于它所使用的位置。\n\n`this` 关键字可以在以下位置使用：\n\n* 在方法中\n* 单独使用\n* 在函数中\n* 在严格模式下的函数中\n\
    * 在事件中\n\n# Method\n\n在方法内部，`this` 指向方法的拥有者。所以，如果一个 `Student` 对象有一个名为 `Write()`\
    \ 的方法，并且在 `Write()` 方法内部使用了 `this`，那么它将指向 `Student` 对象：\n\n```javascript\nvar\
    \ Student = {\n  firstName: “Ockert”,\n  lastName : “du Preez”,\n  subject : “JavaScript”,\n\
    \  score : 85,\n  Write : function() {\n    return this.firstName + “ wrote “\
    \ + this.subject + “ and got “ + this.score + “%”;\n  }\n};\n```\n\n上述代码将产生以下输出：\n\
    \n**Ockert wrote JavaScript and got 85%**\n\n# Alone\n\n当 `this` 单独使用时，它的拥有者是全局对象。在浏览器中，全局对象是\
    \ `[object Window]`：\n\n```javascript\nvar objWindow = this; //returns [object\
    \ window]\n```\n\n# In a function\n\n当 `this` 在函数中使用时，它的拥有者也是全局对象：\n\n```javascript\n\
    function mainWindow() {\n  return this; //returns [object window]\n}\n```\n\n\
    # In a function in strict mode\n\n当 `this` 在严格模式的函数中使用时，`this` 是未定义的（undefined）：\n\
    \n```javascript\n“use strict”;\nfunction mainWindow() {\n  return this; //returns\
    \ undefined\n}\n```\n\n# In an event\n\n当 `this` 在事件中使用时，`this` 指向接收事件的 HTML 元素：\n\
    \n```html\n<button onclick=”this.style.display=’none’”>\nClick Me!\n</button>\n\
    ```\n\n# Conclusion\n\n在本章中，我们探索了 JavaScript 中的对象。我们学习了各种对象创建技术：`new` 关键字、用户定义构造函数、对象构造、ES6\
    \ 类，然后学习了 `Object.create()` 和 `Object.assign()` 方法。最后，我们学习了 `this` 关键字的不同实现方式。\n\
    \n在下一章中，我们将学习 JavaScript 语句（它们是什么以及如何构造）和 JavaScript 关键字。\n\n# Questions\n\n1.\
    \ `Object.create()` 和 `Object.assign()` 方法的区别是什么？\n2. 解释基本数据类型（primitives）。\n\
