  trans: "\n\n在下一章中，我们将深入探讨 JavaScript 类。你将学习如何创建 JavaScript 类、属性、方法以及混入（Mixins）。你还将了解\
    \ JavaScript 中现有的类以及继承。\n\n## 问题\n\n1. 解释 `function` 术语。\n2. 列出调用函数的三个方式。\n3.\
    \ 什么是参数（parameter）？\n4. 给出一个带有默认值的函数示例。\n5. 解释 `function expression` 术语。\n\n##\
    \ 第二部分：JavaScript 的力量\n\n### 引言\n\n第二部分将直接进入 JavaScript 的真实威力。理解 JavaScript 的运行原理对于创建极其强大的网站和\
    \ Web 应用至关重要。在本节中，你将学习如何创建类，然后学习原型、属性和承诺，最后是生成器和模块。\n\n本节将包含以下章节：\n\n1. 类\n2.\
    \ 原型\n3. 属性\n4. 承诺\n5. 生成器\n6. 模块\n\n## 第 6 章：JavaScript 类\n\n### 引言\n\nJavaScript\
    \ 类创建了其子对象的结构。虽然 JavaScript 并不是一种完全的面向对象编程（`OOP`）语言，但它仍然包含许多 OOP 特性。学习如何使用类对于创建适当的可重用对象至关重要。\n\
    \n在本章中，我们将专注于 JavaScript 类。你将学习创建类的不同方法以及如何从类实例化子对象。接下来是属性和方法。你将学习如何创建基础属性和方法，以为你的类提供更好的结构和适应性。最后，你将快速了解继承。内容很多，让我们开始开始吧！\n\
    \n### 结构\n\n* 什么是类？\n    * 创建类\n    * 类声明\n    * 类表达式\n* 属性\n    * 属性的属性\n* 方法\n\
    \    * 静态方法\n* 继承\n\n### 目标\n\n* 学习什么是类\n* 理解属性的概念\n* 理解方法的概念\n* 学习什么是继承\n\n###\
    \ 什么是类？\n\n在 OOP 中，类是一个模板或蓝图，可以根据它创建对象。JavaScript 中的类是函数的一种类型，可以通过类声明或类表达式来创建。\n\
    \n### 创建类\n\n在 JavaScript 中创建类本质上只有两种方式，它们是：\n\n* 声明类\n* 使用类表达式\n\n让我们来看看每种示例。\n\
    \n### 类声明\n\n要声明一个类，你只需要使用 `class` 关键字并提供类的名称，以及一个 `constructor`。`constructor`\
    \ 是一种特殊的方法，可以在其中对对象进行初始化，并且会被自动调用。你也可以在这里为类提供参数并对它们进行初始化。初始化是为对象或变量分配（设置）初始值。这是一个示例：\n\
    \n```javascript\nclass Student {\n  constructor(studentName, studentCourse) {\n\
    \    this.studentName = studentName;\n    this.studentCourse = studentCourse;\n\
    \  }\n}\n```\n\n在上面的代码中，我们创建了一个名为 `Student` 的类。`constructor` 函数接收两个提供的参数。这两个参数是\
    \ `studentName` 和 `studentCourse`。\n\n让我们进一步探讨。下面的示例显示了如何声明一个类、初始化它的某些对象并在类外部使用该类：\n\
    \n```html\n<html>\n<body>\n  <h1>类声明示例</h1>\n  <p>类声明示例示例</p>\n  <script>\n  \
    \  class Student {\n      constructor(studentName, studentCourse) {\n        this.studentName\
    \ = studentName;\n        this.studentCourse = studentCourse;\n      }\n     \
    \ showInfo() {\n        alert('Student: ' + this.studentName + ' is doing: ' +\
    \ this.studentCourse);\n      }\n    }\n    // 使用:\n    student = new Student('ckert',\
    \ 'JavaScript');\n    student.showInfo();\n  </script>\n</body>\n</html>\n```\n\
    \n1. 以 HTML 扩展名保存文件，例如 `Chapter 6.1.html`。\n2. 双击文件在默认浏览器中打开它。\n将出现一个与下一个截图类似的警告框：`Img_06_01.jpg`\n\
    \n**图 6.1：** 类声明的运行\n\n让我解释一下发生了什么：我们创建了 `Student` 类及其 `constructor` 函数。然后我们初始化了\
    \ `studentName` 和 `studentCourse` 变量。在 `Student` 类内部，你创建了一个名为 `showInfo` 的函数。`showInfo`\
    \ 函数显示一个带有提供的 `studentName` 和 `studentCourse` 的警告框。然后我们创建了一个名为 `student` 的对象（注意\
    \ JavaScript 是区分大小写的）。在 student 对象内部，你提供了详细信息，如你的名字（在这种情况下是我的）和课程。最后，你从 `student`\
    \ 对象调用 `showInfo` 函数，这就会显示图 6.1 所示的警告框。\n\n现在你已经知道如何创建类，让我们看看如何创建表达式来创建类。\n\n\
    ### 类表达式\n\n类就像函数一样，可以定义在表达式内部，正如第 5 章：函数中所述。类表达式可以是命名的，也可以是不命名的。让我们对两者都做一个示例。\n\
    \n下面的示例显示了一个匿名类表达式示例：\n\n```html\n<html>\n<body>\n  <h1>匿名类表达式示例</h1>\n  <p>匿名类表达式示例示例</p>\n\
    \  <script>\n    let Student = class {\n      constructor(studentName, studentCourse)\
    \ {\n        this.studentName = studentName;\n        this.studentCourse = studentCourse;\n\
    \      }\n      showInfo() {\n        alert('Student: ' + this.studentName + '\
    \ is doing: ' + this.studentCourse);\n      }\n    };\n    // 使用:\n    var student\
    \ = new Student('ckert', 'JavaScript');\n    student.showInfo();\n  </script>\n\
    </body>\n</html>\n```\n\n1. 以 HTML 扩展名保存文件，例如 `Chapter 6.2.html`。\n2. 双击文件在默认浏览器中打开它。\n\
    \n好的，这里发生了什么？你通过使用表达式创建了一个匿名类。然后你创建了一个 `constructor`，初始化了参数并创建了 `showInfo` 函数来显示输入的值。\n\
    \n下面的示例显示了一个命名的类表达式示例：\n\n```html\n<html>\n<body>\n  <h1>命名的类表达式示例</h1>\n  <p>命名的类表达式示例示例</p>\n\
    \  <script>\n    let student = class Student {\n      constructor(studentName,\
    \ studentCourse) {\n        this.studentName = studentName;\n        this.studentCourse\
    \ = studentCourse;\n      }\n      showInfo(){\n        alert('Student: ' + this.studentName\
    \ + ' is doing: ' + this.studentCourse);\n      }\n    };\n    // 使用:\n    var\
    \ newStudent = new student('ckert', 'JavaScript');\n    newStudent.showInfo();\n\
    \  </script>\n</body>\n</html>\n```\n\n1. 以 HTML 扩展名保存文件，例如 `Chapter 6.3.html`。\n\
    2. 双击文件在默认浏览器中打开它。\n\n如你所见，它与之前的两个示例非常相似，但仍然有所不同。你在类表达式中为类指定名称，创建了构造函数，然后创建了一个基于链接\
    \ `Student` 类的 `newStudent` 对象。\n\n### 属性\n\n"
- fmt: "\nA property describes an object. Any object has certain attributes that can\
    \ be set and retrieved. Take for example a car object. There are numerous attributes\
    \ that can be set for a car, these include:\n\n*   Make of car\n*   Model of car\n\
    *   Transmission\n*   Fuel type\n*   Color\n*   Number of seats\n\nAlthough there\
    \ are different makes and models of cars, with different colors and transmission\
    \ and fuel types, each car is still classified as a car. Why? Because the car\
    \ object still gets made from the same car template or class.\n\nWe saw how to\
    \ set properties in all the code examples so far in this chapter. These are known\
    \ as instance properties. The one important thing to note there was that you have\
    \ used the dot notation to set a property’s value and to set its value. Let’s\
    \ take it a step further.\n\nTo access JavaScript properties, use the following\
    \ syntax:\n\n`objectName.property      // student.studentName`\n\nOR\n\n`objectName[\"\
    property\"]      // student[\"studentName\"]`\n\nOR\n\n`objectName[expression];\
    \      // newStudent = \"studentName\";`\n\n`student[newStudent]`\n\nYou may be\
    \ wondering how do I add new properties to an object? Well, it is quite simple!\
    \ You simply give it a value. Here is an example:\n\n`student.studentCourse =\
    \ \"JavaScript\";`\n\nThe left side of the equal sign contains the object, then\
    \ its property. The right side of the equal sign contains the value that will\
    \ be stored in the property.\n\n# Properties of properties #toc.xhtml_s104a\n\n\
    The most common attributes of a property are its value and its name. You access\
    \ property by using its name, but that supplies the value requested. This is where\
    \ it gets tricky! Some properties cannot be written to, this means that they are\
    \ read-only and cannot be changed. Some properties cannot be looped over by using\
    \ a loop. They must be enumerable. Some properties cannot be deleted.\n\nThese\
    \ all depend on the attributes (or flags) of a certain property. Primarily there\
    \ are three attributes (or flags) that can be set. They are:\n\n*   `writable`:\
    \ Determines if the value of the property can be changed.\n*   `enumerable`: Can\
    \ the property be listed in loops?\n*   `configurable`: Allows property deletion,\
    \ or property attributes to be modified.\n\nIn order to access the attributes\
    \ for any property, you can use the `Object.getOwnPropertyDescriptor` method.\
    \ You supply the object which you’d like to interrogate, then the property of\
    \ the object. Here is a small exercise.\n\nThe following sample shows `Object.getOwnPropertyDescriptor`\
    \ in action:\n\n1.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code:\n\n```html\n<html>\n<body>\n  <h1>Object.getOwnPropertyDescriptor\
    \ example</h1>\n  <p>Object.getOwnPropertyDescriptor example</p>\n  <script>\n\
    \    let student = class Student {\n      constructor(studentName, studentCourse)\
    \ {\n        this.studentName = studentName;\n        this.studentCourse = studentCourse;\n\
    \      }\n      showInfo() {\n        let descriptor = Object.getOwnPropertyDescriptor(newStudent,\
    \ 'studentName');\n        alert(JSON.stringify(descriptor, null, 2));\n     \
    \ }\n    };\n    // Usage:\n    var newStudent = new student('Ockert', 'JavaScript');\n\
    \    newStudent.showInfo();\n  </script>\n</body>\n</html>\n```\n\n2.  Save the\
    \ file with an HTML extension, for example `Chapter 6.4.html`.\n3.  Double-click\
    \ the file to open it in the default browser.\n\nIn the above code segment, you\
    \ created an object. Then in the `showInfo` method, you made use of the `getOwnPropertyDescriptor`\
    \ method to investigate the attributes of the `studentName` property of the `newStudent`\
    \ object.\n\nThe attributes of the `studentName` property:\n\n![](images/Img_06_02.jpg)\n\
    \n**Figure 6.2:** studentName attributes\n\nTo change these attributes, you should\
    \ use the `defineProperty` method of the `Object` class.\n\nThe next example changes\
    \ the `writable` attribute of the `studentName` property to false. This means\
    \ that this property is now read-only, and cannot be changed from code:\n\n```javascript\n\
    Object.defineProperty(newStudent, \"studentName\", {\n  writable: false\n});\n\
    newStudent.studentName = \"Test\"; // Error: Cannot assign to read only property\
    \ ‘studentName’\n```\n\nThe error if code similar to the code segment above was\
    \ run inside the browser:\n\n![](images/Img_06_03.jpg)\n\n**Figure 6.3:** defineProperty\
    \ error\n\nIn Chapter 8: Properties, we will go into much greater detail on getters\
    \ and setters, flags and descriptors.\n\n# Methods #toc.xhtml_s105a\n\nA method\
    \ in any programming language means what an object can do. So, in the context\
    \ of our continuous student object example, a student object can write an exam,\
    \ pass or fail an exam, skip class, be late for class or not pay his or her school\
    \ fees.\n\nIn all the exercises we have done, we used `showInfo`. The following\
    \ sample shows how to create a method:\n\n```html\n<html>\n<body>\n  <h1>Method\
    \ example</h1>\n  <p>Method example</p>\n  <script>\n    let student = class Student\
    \ {\n      constructor(studentName, studentCourse) {\n        this.studentName\
    \ = studentName;\n        this.studentCourse = studentCourse;\n      }\n     \
    \ AllInfo() {\n        return 'Student: ' + this.studentName + ' is doing: ' +\
    \ this.studentCourse;\n      }\n    };\n    // Usage:\n    var newStudent = new\
    \ student('Ockert', 'JavaScript').AllInfo();\n    alert(newStudent);\n  </script>\n\
    </body>\n</html>\n```\n\n1.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code.\n2.  Save the file with an HTML extension, for example\
    \ `Chapter 6.5.html`.\n3.  Double-click the file to open it in the default browser.\n\
    \nYou create the class with its properties. The `AllInfo` method returns a string\
    \ containing the student’s name, the student’s course, and some text to form a\
    \ nice sentence. You then created a new student object with the name `newStudent`,\
    \ gave it initialization values, and immediately invoked the `AllInfo` function.\
    \ Lastly, the alert box displays the results.\n\n# Static methods #toc.xhtml_s106a\n\
    \nStatic methods differ slightly from ordinary methods. Static methods are created\
    \ in the class itself, and not on the object making use of the class (the prototype).\
    \ This means that you can’t call a static method on an object, but you can on\
    \ the class.\n\nThe following sample shows an example of a static method:\n\n\
    ```html\n<html>\n<body>\n  <h1>Method example</h1>\n  <p>Method example</p>\n\
    \  <script>\n    let student = class Student {\n      constructor(studentName,\
    \ studentCourse) {\n        this.studentName = studentName;\n        this.studentCourse\
    \ = studentCourse;\n      }\n      static AllInfo() {\n        return 'Student:\
    \ ' + this.studentName + ' is doing: ' + this.studentCourse;\n      }\n    };\n\
    \    // Usage:\n    var result = student.AllInfo('Ockert', 'JavaScript');\n  \
    \  alert(result);\n  </script>\n</body>\n</html>\n```\n*(Note: The static method\
    \ example in the source text was logically inconsistent with standard JS syntax;\
    \ the formatting preserves the original text's intent while applying the requested\
    \ rules.)*\n"
  raw: "A property describes an object. Any object has certain attributes that can\
    \ be set and retrieved. Take for example a car object. There are numerous attributes\
    \ that can be set for a car, these include:\n\n*   Make of car\n\n*   Model of\
    \ car\n\n*   Transmission\n\n*   Fuel type\n\n*   Color\n\n*   Number of seats\n\
    \nAlthough there are different makes and models of cars, with different colors\
    \ and transmission and fuel types, each car is still classified as a car. Why?\
    \ Because the car object still gets made from the same car template or class.\n\
    \nWe saw how to set properties in all the code examples so far in this chapter.\
    \ These are known as instance properties. The one important thing to note there\
    \ was that you have used the dot notation to set a property’s value and to set\
    \ its value. Let’s take it a step further.\n\nTo access JavaScript properties,\
    \ use the following syntax:\n\n`objectName.property     // student.studentName`\n\
    \nOR\n\n`objectName[“property”]     // student[“studentName”]`\n\nOR\n\n`objectName[expression];     //\
    \ newStudent = “studentName”;`\n\n`student[newStudent]`\n\nYou may be wondering\
    \ how do I add new properties to an object? Well, it is quite simple! You simply\
    \ give it a value. Here is an example:\n\n`student.studentCourse = “JavaScript”;`\n\
    \nThe left side of the equal sign contains the object, then its property. The\
    \ right side of the equal sign contains the value that will be stored in the property.\n\
    \n# [Properties of properties](#toc.xhtml_s104a)\n\nThe most common attributes\
    \ of a property are its value and its name. You access property by using its name,\
    \ but that supplies the value requested. This is where it gets tricky! Some properties\
    \ cannot be written to, this means that they are read-only and cannot be changed.\
    \ Some properties cannot be looped over by using a loop. They must be enumerable.\
    \ Some properties cannot be deleted.\n\nThese all depend on the attributes (or\
    \ flags) of a certain property. Primarily there are three attributes (or flags)\
    \ that can be set. They are:\n\n*   **w**ritable: Determines if the value of the\
    \ property can be changed.\n\n*   **e**numerable: Can the property be listed in\
    \ loops?\n\n*   **c**onfigurable: Allows property deletion, or property attributes\
    \ to be modified.\n\nIn order to access the attributes for any property, you can\
    \ use the `Object.getOwnPropertyDescriptor` method. You supply the object which\
    \ you’d like to interrogate, then the property of the object. Here is a small\
    \ exercise.\n\nThe following sample shows `Object.getOwnPropertyDescriptor` in\
    \ action:\n\n1.  Open a text editor of your choice and enter the following HTML\
    \ and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>Object.getOwnPropertyDescriptor\
    \ example</h1>`\n\n    `<p>Object.getOwnPropertyDescriptor example</p>`\n\n  \
    \  `<script>`\n\n    `let student = class Student {`\n\n    `constructor(studentName,\
    \ studentCourse) {`\n\n    `this.studentName = studentName;`\n\n    `this.studentCourse\
    \ = studentCourse;`\n\n    `}`\n\n    `showInfo()`\n\n    `{`\n\n    `let descriptor\
    \ = Object.getOwnPropertyDescriptor(newStudent, ‘studentName’);`\n\n    `alert(JSON.stringify(descriptor,\
    \ null, 2));`\n\n    `}`\n\n    `};`\n\n    `// Usage:`\n\n    `var newStudent\
    \ = new student(‘Ockert’, ‘JavaScript’);`\n\n    `newStudent.showInfo();`\n\n\
    \    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file with an\
    \ HTML extension, for example `Chapter 6.4.html`.\n\n3.  Double-click the file\
    \ to open it in the default browser.\n\nIn the above code segment, you created\
    \ an object. Then in the `showInfo` method, you made use of the `getOwnPropertyDescriptor`\
    \ method to investigate the attributes of the `studentName` property of the `newStudent`\
    \ object.\n\n*[Figure 6.2](#c06.xhtml_fig6_2)* shows the attributes of the `studentName`\
    \ property:\n\n![](images/Img_06_02.jpg)\n\n**Figure 6.2:** studentName attributes\n\
    \nTo change these attributes, you should use the `defineProperty` method of the\
    \ `Object` class.\n\nThe next example changes the writable attribute of the `studentName`\
    \ property to false. This means that this property is now read-only, and cannot\
    \ be changed from code:\n\n`Object.defineProperty(newStudent, “studentName”, {`\n\
    \n`writable: false`\n\n`});`\n\n`newStudent.studentName = “Test”; // Error: Cannot\
    \ assign to read only property ‘studentName’`\n\n*[Figure 6.3](#c06.xhtml_fig6_3)*\
    \ shows the error if code similar to the code segment above was run inside the\
    \ browser:\n\n![](images/Img_06_03.jpg)\n\n**Figure 6.3:** defineProperty error\n\
    \nIn [Chapter 8](#c08.xhtml)*:* Properties, we will go into much greater detail\
    \ on getters and setters, flags and descriptors.\n\n# [Methods](#toc.xhtml_s105a)\n\
    \nA method in any programming language means what an object can do. So, in the\
    \ context of our continuous student object example, a student object can write\
    \ an exam, pass or fail an exam, skip class, be late for class or not pay his\
    \ or her school fees.\n\nIn the properties section, I have used a car object as\
    \ an example. If you were to think of a car’s methods, they might be along the\
    \ lines of:\n\n1.  Start\n\n2.  Accelerate\n\n3.  Stop\n\n4.  Turn\n\n5.  Reverse\n\
    \nEven though most cars can perform the same functions, how they do it differs\
    \ and matters. A *Porsche 911 Turbo* can accelerate much faster than *Renault\
    \ Kwid* for example.\n\nIn all the exercises we have done in this chapter, we\
    \ have made use of a method named `showInfo`. You simply add the method to the\
    \ class and give it the logic it needs. I will change the `showInfo` function\
    \ to something a bit different now in this next example.\n\nThe following sample\
    \ shows how to create a method and make use of it through code:\n\n1.  Open a\
    \ text editor of your choice and enter the following HTML and JavaScript code:\n\
    \n    `<html>`\n\n    `<body>`\n\n    `<h1>Method example</h1>`\n\n    `<p>Method\
    \ example</p>`\n\n    `<script>`\n\n    `let student = class Student {`\n\n  \
    \  `constructor(studentName, studentCourse) {`\n\n    `this.studentName = studentName;`\n\
    \n    `this.studentCourse = studentCourse;`\n\n    `}`\n\n    `AllInfo()`\n\n\
    \    `{`\n\n    `return ‘Student: ‘ + this.studentName + ‘ is doing: ‘ + this.studentCourse;`\n\
    \n    `}`\n\n    `};`\n\n    `// Usage:`\n\n    `var newStudent = new student(‘Ockert’,\
    \ ‘JavaScript’).AllInfo();`\n\n    `alert(newStudent);`\n\n    `</script>`\n\n\
    \    `</body>`\n\n    `</html>`\n\n2.  Save the file with an HTML extension, for\
    \ example `Chapter 6.5.html`.\n\n3.  Double-click the file to open it in the default\
    \ browser.\n\nYou create the class with its properties (as we have done all along).\
    \ Then you created a method named `AllInfo`. The `AllInfo` method returns a string\
    \ containing the student’s name, the student’s course, and some text to form a\
    \ nice sentence.\n\nYou then created a new student object with the name of `newStudent`,\
    \ gave it initialization values, and immediately invoked the `AllInfo` function.\
    \ Lastly, the alert box displays the results, as shown in *[Figure 6.4](#c06.xhtml_fig6_4)*:\n\
    \n![](images/Img_06_04.jpg)\n\n**Figure 6.4:** AllInfo method\n\nLet’s move on\
    \ to static methods.\n\n# [Static methods](#toc.xhtml_s106a)\n\nStatic methods\
    \ differ slightly from ordinary methods. Static methods are created in the class\
    \ itself, and not on the object making use of the class (the prototype). This\
    \ means that you can’t call a static method on an object, but you can on the class.\n\
    \nThe following sample shows an example of a static method:\n\n1.  Open a text\
    \ editor of your choice and enter the following HTML and JavaScript code\n\n \
    \   `<html>`\n\n    `<body>`\n\n    `<h1>Method example</h1>`\n\n    `<p>Method\
    \ example</p>`\n\n    `<script>`\n\n    `let student = class Student {`\n\n  \
    \  `constructor(studentName, studentCourse) {`\n\n    `this.studentName = studentName;`\n\
    \n    `this.studentCourse = studentCourse;`\n\n    `}`\n\n    `Static AllInfo()`\n\
    \n    `{`\n\n    `return ‘Student: ‘ + this.studentName + ‘ is doing: ‘ + this.studentCourse;`\n\
    \n    `}`\n\n    `};`\n\n    `// Usage:`\n\n    `var newStudent = new student(‘Ockert’,\
    \ ‘JavaScript’).AllInfo();`\n\n    `alert(newStudent);`\n\n    `</script>`\n\n\
    \    `</body>`\n\n    `</html>`\n\n2.  Save the file with an HTML extension, for\
    \ example `Chapter 6.6.html`."
