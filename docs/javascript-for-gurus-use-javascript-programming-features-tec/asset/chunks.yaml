    \ Statements\n\n# Introduction\n\n没有语句，就不会有程序。语句是发送给解释器或编译器的指令。你组合语句的方式对于整个脚本的成功至关重要。是的，这听起来有点极端，但如果你使用没有空格或换行的粗糙代码，它很快就会变得混乱。\n\
    \n在本节中，你将学习 JavaScript 语句是什么，以及为了可读性和理解性组合它们有多重要。\n\n# Structure\n\n本章涵盖的主题有：\n\
    \n* 语句结构\n* JavaScript 代码块\n* 空格和换行\n* JavaScript 关键字\n\n# Objectives\n\n* 学习什么是\
    \ JavaScript 语句\n* 学习如何创建 JavaScript 语句\n* 学习什么是代码块\n* 学习空格和换行\n* 初接触 JavaScript\
    \ 关键字\n\n# Anatomy of a statement\n\n编程语言中的语句是由编译器或解释器执行的指令行。许多语句组成程序。在 JavaScript\
    \ 中，语句通常由关键字、运算符（形成表达式）和值组成。也可以包含注释。\n\n以下是几个示例：\n\n```javascript\nvar objWidth,\
    \ objHeight;\nobjWidth = 50;\nobjHeight = 100;\nvar size = objWidth * objHeight;\
    \ //乘以高度和宽度计算屏幕尺寸\ndocument.getElementById(“displaySizeLabel”).innerHTML = size;\
    \ /*显示屏幕尺寸*/\n```\n\n"
- fmt: '

    A JavaScript statement should be ended with a semi-colon (`;`). You can also include
    multiple statements on one line, as long as they are separated by a semi-colon,
    as in the next example:


    ```

    objWidth = 50; objHeight = 100; var size = objWidth * objHeight;

    ```


    Three statements are combined into one line, by separating each with a semi-colon.


    # JavaScript code blocks


    Code blocks group statements together. Because the statements are grouped inside
    a code block, they get executed together. A common place to group statements together
    in code blocks is to use a function. JavaScript functions have the following format:


    ```javascript

    function functionName() {

    //statement_1;

    //statement_2;

    //statement_3;

    }

    ```


    A function starts with the keyword `function`. The open and closing brackets allow
    you to put in parameters for the function. The code block exists between the opening
    and closing curly braces of the function. In *[Chapter 5: JavaScript Functions](#c05.xhtml)`*,
    we will delve deeper into functions as a whole.


    Separate code blocks can also appear inside a code block such as a function. For
    example a function can contain grouping statements such as a `while` loop, a `for`
    loop, or an `if` statement. Here is a very quick explanation and example on each.


    # Grouping statements


    Grouping statements in JavaScript include loops and conditional tests. A loop
    in JavaScript is a block of code that gets executed repeatedly until a certain
    condition becomes true. A condition is something that gets tested upon, for example:
    if a certain value is less than 100, something should happen. A conditional statement
    is a statement that determines if a certain condition is true or false, for example:
    has a name been entered, or not.


    The following few code blocks will demonstrate various loops and conditional tests.


    # while loop


    A `while` loop loops through a block of code as long as a specified condition
    exists. Let’s look at an example:


    ```javascript

    var counter = 0;

    while (counter <= 100)

    {

    document.write(counter + “<br>);

    counter++;

    }

    ```


    In the above example, a variable named `counter` is created. The `while` loop
    starts. Notice that the statements inside the `while` loop are also grouped with
    enclosing curly braces. The `while` loop checks if the `counter` variable is less
    than or equal to `100` every time it loops. If it is, it increments the `counter`
    variable. Once it becomes more than `100`, the loop exits. I will not go into
    too much detail now, as loops will be explained in full in *[Chapter 14: Loops](#c14.xhtml)`*.


    # for loop


    A `for` loop executes a block of code a specified number of times. So, if you
    want to repeat certain text 10 times, you would use a `for` loop, or if you want
    to loop through all the images on a page, you will use a `for` loop. Here is a
    small example:


    ```javascript

    for (let i = 0; i <= 100; i++)

    {

    document.write(i + “<br>”);

    }

    ```


    The `for` loop differs slightly from the `while` loop. Whereas the `while` loop
    is what is called a *conditional* loop (it loops while a certain condition exists,
    or until a certain condition becomes true), a `for` loop is a counter loop. With
    a `for` loop, you specify exactly from where the loop should start, and where
    it should stop. To demonstrate the difference, I have kept the parameters the
    same as the `while` loop above. The `for` loop will loop from `0` to `100`.


    It will then write the value of the loop counter on the document. As you can see,
    there is no need to increment the looping variable as it gets incremented automatically.
    I will not go into too much detail now, as loops will be explained in full in
    *[Chapter 14: Loops](#c14.xhtml)`*.


    # if statement


    The JavaScript `if` statement executes the grouped statements if a certain condition
    is true. Here is a small example:


    ```javascript

    if (counter > 50)

    {

    alert(“stop it!”);

    break;

    }

    ```


    The `if` statement above also groups a bunch of statements together by the using
    curly braces. In the above example, it determines if the `counter` variable is
    greater than `50`. If it is, it will display a popup box stating: `stop it!` if
    `counter` is smaller than or equal to `50`, nothing will happen. I will not go
    into too much detail now, as `if` statements will be explained in full in *[Chapter
    13: Control Flow Statements](#c13.xhtml)`*.


    # Whitespace and line breaks


    Code can become messy very quick, and you can get lost in code even quicker. Imagine
    a script containing 1000 lines. Imagine further that you have to change a few
    lines somewhere in there. Now, without whitespace you will struggle to find where
    your functions and grouping statements end. You will struggle immensely trying
    to find the place you need to edit.


    This is where whitespace and line breaks come in. Whitespace allows you to format
    the flow of your code nicely in a way that


    # Whitespace


    Whitespace is simply the addition of spaces, tabs or line-characters so that your
    code is more readable. The JavaScript interpreter ignores spaces, so let’s take
    the while loop, for loop, and if statement and write them without whitespace.


    # A while loop without whitespace


    ```javascript

    var counter = 0;

    while (counter <= 100)

    {

    document.write(counter + “<br>);

    counter++;

    }

    ```


    Above is a short example of what a `while` loop looks like.


    # A for loop without whitespace


    ```javascript

    for (let i = 0; i <= 100; i++)

    {

    document.write(i + “<br>”);

    }

    ```


    # if without whitespace


    ```javascript

    if (counter > 50)

    {

    alert(“stop it!”);

    break;

    }

    ```


    As you can see, it is not easy to read the code anymore, even though the code
    is not long. Now, imagine having a very long script with tens of `if` statements
    and loops combined. It will be extremely difficult to follow the code, not only
    for you but for the other developers on your team. You may now know everything
    going on in the script, but it may not be the case a month from now.


    Let’s make our code pretty!


    # A while loop with whitespace


    ```javascript

    var counter = 0;

    while (counter <= 100)

    {

    document.write(counter + “<br>);

    counter++;

    }

    ```


    Above is a short example of what a small `while` loop can look like with a bit
    of whitespace.


    # A for loop with whitespace


    ```javascript

    for (let i = 0; i <= 100; i++)

    {

    document.write(i + “<br>”);

    }

    ```


    # if with whitespace


    ```javascript

    if (counter > 50)

    {

    alert(“stop it!”);

    break;

    }

    ```


    The code already looks much more legible. By adding line breaks, you can make
    it even more readable.


    # Line breaks


    A long JavaScript statement can be broken into multiple lines. Usually, a line
    longer than 80 characters makes reading and following code difficult. A line such
    as the following is quite long:


    ```javascript

    document.getElementById(“displaySizeLabel”).innerHTML = size; /*Display screen
    size*/

    ```


    A good place to break it off would be after an operator ([Chapter 4: JavaScript
    Operators](#c04.xhtml) will cover operators in detail) like the next code snippet
    will show:


    ```javascript

    document.getElementById(“displaySizeLabel”).innerHTML =

    size; /*Display screen size*/

    ```


    A line break also aids in making your code more readable. I will refer to the
    `while` loop example again, and just add a bit of more line breaks in there. Let’s
    add line breaks to the above code examples

