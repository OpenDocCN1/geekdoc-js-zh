    \ in the regular expression pattern. Only `h` and `m` were specified.\n\nAll tests\
    \ for `regex3` succeed because all of them contain at least one number.\n\n`regexp4`\
    \ tests for either a `green apple` or a `red apple`. When supplied with the text\
    \ `orange apple` it failed.\n\n# [Conclusion](#toc.xhtml_s274a)\n\nIn this chapter,\
    \ we have learntwhat regular expressions are and how to use them productively\
    \ when searching for text or validating text. It is an important skill to know,\
    \ but luckily it is not too complicated once you get the hang of the modifiers\
    \ and patterns.\n\nThe next chapter is the last chapter in the *Advanced Concepts*\
    \ section. You will revisit functions for a while and then dive into currying\
    \ and partials.\n\n# [Questions](#toc.xhtml_s275a)\n\n1.  Define the term regular\
    \ expression.\n\n2.  Name two ways regular expressions can be constructed.\n\n\
    3.  Name three regular expression flags.\n\n# [CHAPTER 18](#toc.xhtml_c18)\n\n\
    # [Partials and Currying](#toc.xhtml_c18)\n\n# [Introduction](#toc.xhtml_s276a)\n\
    \nJavaScript functions can be made much easier and be customized to make use of\
    \ specific arguments when needed.\n\nIn this lesson, you will learn the difference\
    \ between normal JavaScript functions, partials, and currying.\n\n# [Structure](#toc.xhtml_s277a)\n\
    \n*   Partials\n\n*   Currying\n\n# [Objectives](#toc.xhtml_s278a)\n\n*   Understand\
    \ the partial application functional programming concept.\n\n*   Understand the\
    \ currying functional programming concept.\n\n# [Partials](#toc.xhtml_s279a)\n\
    \nPartials or partial applications fix the value of a few of a function’s arguments\
    \ without really fully evaluating the function. This produces another function\
    \ of smaller arguments which binds values to one or more of those arguments as\
    \ the chain of function progressed.\n\nJavaScript contains a built-in method named\
    \ bind that can work on functions with any number of arguments and can bind an\
    \ arbitrary number of parameters.\n\nTo invoke the bind method, make use of the\
    \ following syntax:\n\n`function.prototype.bind(thisValue, [argument1], [argument2],\
    \ …)`\n\nThe bind method turns the function into a new function whose implicit\
    \ this parameter is this value and whose initial arguments are always as given.\n\
    \nTo better understand the concept of the partial, let’s do a practical exercise\
    \ and dissect it piece by piece, as usual.\n\n1.  Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\
    \n    `<h1>Partials Example</h1>`\n\n    `<p>Partials Example</p>`\n\n    `<script>`\n\
    \n    `function add (x, y) {`\n\n    `return x + y;`\n\n    `}`\n\n    `function\
    \ double (num) {`\n\n    `return add(2, num);`\n\n    `}`\n\n    `function addAgain\
    \ (x, y) {`\n\n    `return x + y;`\n\n    `}`\n\n    `var doubleAgain = addAgain.bind(null,\
    \ 2);`\n\n    `console.log(double);`\n\n    `console.log(doubleAgain);`\n\n  \
    \  `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file with an\
    \ HTML extension, for example `Chapter 18.1.html`.\n\n3.  Double-click the file\
    \ to open it in the default browser.\n\n4.  If the browser is Google Chrome, press\
    \ *Ctrl* + *Shift* + *J* to open the console window.\n\nThe output of the above\
    \ code is shown in the following screenshot:\n\n![](images/Img_18_01.jpg)\n\n\
    **Figure 18.1:** Partials example binding\n\nFunction `add` is the normal way\
    \ in JavaScript in calling a function and using it. The function `addAgain` demonstrates\
    \ binding in action. As you can see, not all parameters have values supplied,\
    \ but the JavaScript compiler doesn’t complain at all.\n\nLet’s do a more complex\
    \ example.\n\n1.  Open a text editor of your choice and enter the following HTML\
    \ and JavaScript code\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>Partials Example</h1>`\n\
    \n    `<p>Partials Example</p>`\n\n    `<script>`"
