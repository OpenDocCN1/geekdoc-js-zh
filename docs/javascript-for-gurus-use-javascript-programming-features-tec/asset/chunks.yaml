    # SECTION I


    # Introductory Concepts


    # Introduction


    It is always best to start things off easy, especially when it is a topic that
    many people are scared of or find complicated. Section I starts off easy with
    the general purpose and history of JavaScript. Then we start with objects, statements,
    operators, and functions, all relatively easy topics – so there is a lot to look
    forward to and nothing to be afraid of, as you will see.


    This section will have the following chapters:


    1.  Overview of the Power of JavaScript and Its Purpose

    2.  JavaScript Objects

    3.  JavaScript Statements

    4.  JavaScript Operators

    5.  JavaScript Functions


    # CHAPTER 1


    # Overview of the Power of JavaScript and Its Purpose


    # Introduction


    JavaScript came into being because of a need for more dynamic content and interactivity.
    Although it started off small and specific to web browsers, it has matured and
    grown into a necessity for any web page and any web and mobile developer.


    The first chapter of this book focuses on the origins of JavaScript. It provides
    a brief history of the language and a brief introduction to its features. Most
    importantly, it answers the question: Why JavaScript, and why do we need it?


    # Structure


    *   What is JavaScript?

    *   History of JavaScript

    *   Why JavaScript?

    *   JavaScript features


    # Objectives


    *   Learn what JavaScript is

    *   Understand the need for JavaScript

    *   Learn about the early browser wars

    *   Learn about the exciting features of JavaScript


