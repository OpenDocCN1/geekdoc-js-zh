    \n# Conditional operator ‘？’\n\nIn [Chapter 4: JavaScript Operators](#c04.xhtml),\
    \ I spoke about the ternary operator. The ternary operator is also known as a\
    \ conditional operator. The operator is ternary because it accepts three operands\
    \ in order to function.\n\nThe three operands accepted by the ternary operator\
    \ is:\n\n* The condition\n* True expression\n* False expression\n\nA small example\
    \ of what it looks like follows:\n\n`Condition ? Value if true : Value if false`\n\
    \nThe condition is what gets tested. When the condition is true, the code after\
    \ the question mark executes, if the condition is false, the code after the colon\
    \ is executed.\n\nLet’s see a nested if statement in action:\n\n1. Open a text\
    \ editor of your choice and enter the following HTML and JavaScript code:\n\n\
    ```html\n<!doctype html>\n<body>\n<h1>Conditional statement example</h1>\n<p>Conditional\
    \ statement example</p>\n<script>\nvar studentAge = 19;\nvar greeting = (studentAge\
    \ < 18) ? “Not Allowed” : “Welcome!”;\ndocument.write(greeting);\n</script>\n\
    </body>\n</html>\n```\n\n2. Save the file with an HTML extension, for example\
    \ `Chapter 13.8.html`.\n\n3. Double-click the file to open it in the default browser.\n\
    \nThe value of the `studentAge` variable is tested and thus becomes the condition.\
    \ If `studentAge` is less than `18`, `Not Allowed` will be printed on the page,\
    \ else, as is the current case because `studentAge` is `19`, `Welcome!` will be\
    \ printed on the web page.\n\n# Conclusion\n\nIn this chapter, we had lots of\
    \ practical exercises demonstrating the use of all the various controlflow statements.\
    \ You learned that most of a script just depends on the logic and the conditions\
    \ that need to be tested for. You saw the differences between the `switch` statement\
    \ and the `if` statements and the conditional operator.\n\nIn the next chapter,\
    \ we will learnabout the various loops in JavaScript.\n\n# Questions\n\n1. Why\
    \ would you use a `switch` statement instead of an `else…if` statement?\n2. What\
    \ is a ternary operator?\n3. Why would you use the `else` clause?\n4. Explain\
    \ the term condition.\n\n# CHAPTER 14\n\n# Loops\n\n# Introduction\n\nYou simply\
    \ cannot avoid loops in any programming environment or language. JavaScript has\
    \ a nice variety of loops, including counter loops and conditional loops. JavaScript\
    \ also includes features to exit loops early or to skip iterations.\n\nIn this\
    \ lesson, you will learn what loops exist in JavaScript and their differences\
    \ in syntax and inner workings. You will do a lot of practical exercises because\
    \ it is always easier to learn practically.\n\n# Structure\n\n* JavaScript loops\n\
    * `for`\n* `for…in`\n* `for…of`\n* `while`\n* `do…while`\n* Exiting loops\n  \
    \  * The `break` statement\n    * `break` with labels\n* The `continue` statement\n\
    \n# Objectives\n\n* Identify the different loops in JavaScript.\n* Make use of\
    \ the `for` loop to loop a certain number of times.\n* Make use of the `for…in`loop\
    \ to loop through object properties.\n* Make use of the `for…of`loop through arrays,\
    \ strings, Maps and NodeLists.\n* Make use of the `while` loop to loop based on\
    \ on.\n* Learn how to exit loops.\n\n# JavaScript loops\n\nA loop is something\
    \ that repeats. In JavaScript, there are several types of loops you can use to\
    \ repeat a block of code multiple times. The most common loops are `for`, `for…in`,\
    \ `for…of`, `while`, and `do…while`.\n\nA loop is a structure that repeats as\
    \ long as a certain condition is true.\n\nThe following loops are available in\
    \ JavaScript:\n\n* `for`\n* `for…in`\n* `for…of`\n* `while`\n* `do…while`\n\n\
    The `for` loop is the most common loop. It is used when you know how many times\
    \ you want to loop a block of code. The syntax of the `for` loop is:\n\n`for (initialization;\
    \ condition; increment/decrement)`\n\nThe `initialization` is where you set the\
    \ loop variable. The `condition` is what is tested before each iteration. If the\
    \ condition is true, the loop body executes. The `increment/decrement` is what\
    \ updates the loop variable after each iteration.\n\nHere is an example of a `for`\
    \ loop:\n\n```javascript\nfor (var i = 0; i < 10; i++) {\n  document.write(i +\
    \ \"<br>\");\n}\n```\n\nIn this example, the variable `i` is initialized to `0`.\
    \ The condition `i < 10` is tested before each iteration. If the condition is\
    \ true, the `document.write(i)` executes. After each iteration, `i` is incremented\
    \ by `1`. This continues until `i` is no longer less than `10`.\n\nThe `while`\
    \ loop is used when you don't know how many times you want to loop a block of\
    \ code, but you know the condition that should stop the loop. The syntax of the\
    \ `while` loop is:\n\n```javascript\nwhile (condition) {\n  // code to execute\n\
    }\n```\n\nThe `condition` is tested before each iteration. If the condition is\
    \ true, the loop body executes. If it is false, the loop does not run.\n\nHere\
    \ is an example of a `while` loop:\n\n```javascript\nvar i = 0;\nwhile (i < 10)\
    \ {\n  document.write(i + \"<br>\");\n  i++;\n}\n```\n\nIn this example, the variable\
    \ `i` is initialized to `0`. The condition `i < 10` is tested before each iteration.\
    \ If the condition is true, the `document.write(i)` executes. Then, `i` is incremented\
    \ by `1`. This continues until `i` is no longer less than `10`.\n\nThe `do…while`\
    \ loop is similar to the `while` loop, but the loop body is executed at least\
    \ once before the condition is tested. The syntax of the `do…while` loop is:\n\
    \n```javascript\ndo {\n  // code to execute\n} while (condition);\n```\n\nHere\
    \ is an example of a `do…while` loop:\n\n```javascript\nvar i = 0;\ndo {\n  document.write(i\
    \ + \"<br>\");\n  i++;\n} while (i < 10);\n```\n\nIn this example, the variable\
    \ `i` is initialized to `0`. The code body executes once, printing `0`. Then the\
    \ condition `i < 10` is tested. If it is true, the loop runs again. This continues\
    \ until `i` is no longer less than `10`.\n\nThe `for…in` loop is used to iterate\
    \ over the properties of an object. The syntax of the `for…in` loop is:\n\n```javascript\n\
    for (var property in object) {\n  // code to execute\n}\n```\n\nHere is an example\
    \ of a `for…in` loop:\n\n```javascript\nvar person = {name: \"John\", age: 30,\
    \ city: \"New York\"};\nfor (var property in person) {\n  console.log(property\
    \ + \": \" + person[property]);\n}\n```\n\nThe `for…of` loop is used to iterate\
    \ over the values of arrays, strings, Maps and NodeLists. The syntax of the `for…of`\
    \ loop is:\n\n```javascript\nfor (var value of iterable) {\n  // code to execute\n\
    }\n```\n\nHere is an example of a `for…of` loop:\n\n```javascript\nvar fruits\
    \ = [\"apple\", \"banana\", \"cherry\"];\nfor (var fruit of fruits) {\n  console.log(fruit);\n\
    }\n```\n\nSometimes you want to exit a loop early or skip an iteration. For this,\
    \ you can use the `break` and `continue` statements.\n\nThe `break` statement\
    \ is used to break out of a loop.\n\n```javascript\nfor (var i = 0; i < 10; i++)\
    \ {\n  if (i === 5) {\n    break;\n  }\n  document.write(i + \"<br>\");\n}\n```\n\
    \nThe `continue` statement is used to skip the current iteration and move to the\
    \ next one.\n\n```javascript\nfor (var i = 0; i < 10; i++) {\n  if (i === 5) {\n\
    \    continue;\n  }\n  document.write(i + \"<br>\");\n}\n```\n\nYou can also use\
    \ labels with `break` and `continue` to break out of nested loops.\n\n```javascript\n\
    outerLoop:\nfor (var i = 0; i < 10; i++) {\n  for (var j = 0; j < 10; j++) {\n\
    \    if (i === 2 && j === 2) {\n      break outerLoop;\n    }\n    document.write(i\
    \ + \", \" + j + \"<br>\");\n  }\n}\n```\n"
