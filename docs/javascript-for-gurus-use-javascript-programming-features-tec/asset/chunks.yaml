  trans: "\n\n属性描述了一个对象。任何对象都具有某些可以设置和检索的属性。以汽车对象为例，可以为汽车设置许多属性，这些包括：\n\n*   汽车品牌\n\
    *   汽车型号\n*   变速箱\n*   燃料类型\n*   颜色\n*   座位数量\n\n尽管汽车有不同的品牌、型号、颜色、变速箱和燃料类型，但每辆汽车仍然被归类为汽车。为什么？因为汽车对象仍然是由相同的汽车模板或类创建的。\n\
    \n在本章之前的所有代码示例中，我们已经学习了如何设置属性。这些属性被称为实例属性。这里需要注意的重要的一点是，你使用了点表示法（dot notation）来设置属性的值并进行赋值。让我们更进一步。\n\
    \n要访问 JavaScript 属性，请使用以下语法：\n\n`objectName.property      // student.studentName`\n\
    \nOR\n\n`objectName[\"property\"]      // student[\"studentName\"]`\n\nOR\n\n\
    `objectName[expression];      // newStudent = \"studentName\";`\n\n`student[newStudent]`\n\
    \n你可能想知道如何向对象添加新属性呢？嗯，这非常简单！你只需要给它一个值即可。这里有一个示例：\n\n`student.studentCourse = \"\
    JavaScript\";`\n\n等号左侧包含对象，然后是它的属性。等号右侧包含将存储在属性中的值。\n\n# 属性的属性 #toc.xhtml_s104a\n\
    \n属性最常见的特征是它的值和名称。你通过它的名称来访问属性，但它提供了请求的值。这里就变得复杂了！某些属性是不可写入的，这意味着它们是只读的且不能更改。某些属性无法通过循环遍历。它们必须是可枚举的（enumerable）。某些属性不能被删除。\n\
    \n这些都取决于特定属性的属性（或标记）。主要有三个可以设置的属性（或标记）。它们是：\n\n*   `writable`: 决定属性的值是否可以更改。\n\
    *   `enumerable`: 属性可以在循环列表中列出？\n*   `configurable`: 允许删除属性或修改属性。\n\n为了访问任何属性的属性，你可以使用\
    \ `Object.getOwnPropertyDescriptor` 方法。你提供想要查询的对象，然后是该对象的属性。这是一个小练习。\n\n以下示例显示了\
    \ `Object.getOwnPropertyDescriptor` 的用法：\n\n1.  打开你喜欢的文本编辑器，并输入以下 HTML 和 JavaScript\
    \ 代码：\n\n```html\n<html>\n<body>\n  <h1>Object.getOwnPropertyDescriptor example</h1>\n\
    \  <p>Object.getOwnPropertyDescriptor example</p>\n  <script>\n    let student\
    \ = class Student {\n      constructor(studentName, studentCourse) {\n       \
    \ this.studentName = studentName;\n        this.studentCourse = studentCourse;\n\
    \      }\n      showInfo() {\n        let descriptor = Object.getOwnPropertyDescriptor(newStudent,\
    \ 'studentName');\n        alert(JSON.stringify(descriptor, null, 2));\n     \
    \ }\n    };\n    // Usage:\n    var newStudent = new student('Ockert', 'JavaScript');\n\
    \    newStudent.showInfo();\n  </script>\n</body>\n</html>\n```\n\n2.  以 HTML\
    \ 扩展名保存文件，例如 `Chapter 6.4.html`。\n3.  双击文件在默认浏览器中打开它。\n\n在上面的代码段中，你创建了一个对象。然后在\
    \ `showInfo` 方法中，你利用 `getOwnPropertyDescriptor` 方法来调查 `newStudent` 对象中 `studentName`\
    \ 属性的属性。\n\n`studentName` 属性的属性：\n\n![](img/Img_06_02.jpg)\n\n**图 6.2:** studentName\
    \ 属性\n\n要更改这些属性，你应该使用 `Object` 类的 `defineProperty` 方法。\n\n下一个示例将 `studentName`\
    \ 属性的 `writable` 属性改为 `false`。这意味着该属性现在是只读的，无法通过代码更改：\n\n```javascript\nObject.defineProperty(newStudent,\
    \ \"studentName\", {\n  writable: false\n});\nnewStudent.studentName = \"Test\"\
    ; // Error: Cannot assign to read only property ‘studentName’\n```\n\n如果在浏览器中运行上述代码段的代码，产生的错误：\n\
    \n![](img/Img_06_03.jpg)\n\n**图 6.3:** defineProperty 错误\n\n在第 8 章：属性中，我们将更详细地讨论\
    \ getter（getters）和 setter（setters）、标记（flags）和描述符（descriptors）。\n\n# 方法 #toc.xhtml_s105a\n\
    \n任何编程语言中的方法都意味着对象可以做什么。因此，在我们持续的学生对象示例上下文中，学生对象可以考试、通过或未通过考试、旷课、上到或不交学费。\n\n\
    在我们所做的所有练习中，我们使用了 `showInfo`。接下来的示例显示了如何创建一个方法：\n\n```html\n<html>\n<body>\n \
    \ <h1>Method example</h1>\n  <p>Method example</p>\n  <script>\n    let student\
    \ = class Student {\n      constructor(studentName, studentCourse) {\n       \
    \ this.studentName = studentName;\n        this.studentCourse = studentCourse;\n\
    \      }\n      AllInfo() {\n        return 'Student: ' + this.studentName + '\
    \ is doing: ' + this.studentCourse;\n      }\n    };\n    // Usage:\n    var newStudent\
    \ = new student('Ockert', 'JavaScript').AllInfo();\n    alert(newStudent);\n \
    \ </script>\n</body>\n</html>\n```\n\n1.  打开你喜欢的文本编辑器，并输入以下 HTML 和 JavaScript\
    \ 代码。\n2.  以 HTML 扩展名保存文件，例如 `Chapter 6.5.html`。\n3.  双击文件在默认浏览器中打开它。\n\n你创建了带有其属性的类。`AllInfo`\
    \ 方法返回一个包含学生姓名、学生课程和一些组成漂亮句子的文本字符串。然后你创建了一个名为 `newStudent` 的新学生对象，赋予了它初始化值，并立即调用了\
    \ `AllInfo` 函数。最后，alert 框显示了结果。\n\n# 静态方法 #toc.xhtml_s106a\n\n静态方法与普通方法略有不同。静态方法是在类本身中创建的，而不是在使用类的对象（原型）上。这意味着你不能在对象上调用静态方法，但可以在类上调用。\n\
    \n以下示例显示了静态方法的用法：\n\n"
- fmt: "\n# Inheritance\n\nObjects inherit features from other objects. Earlier in\
    \ this chapter, I have spoken about the car object. I have explained that each\
    \ car has four wheels and other common features, but what about trucks or buses?\n\
    \nAlthough trucks usually have more than four wheels, they still form part of\
    \ the vehicle family. Buses may have four wheels, but they have many more seats\
    \ than cars and trucks; still they form part of the vehicle family.\n\nAnother\
    \ example would be that you inherit features from your parents. You may have your\
    \ mother’s hair and eyes, and you may have your dad’s personality, but you are\
    \ still unique and still you. This process is known as inheritance.\n\nIn `Chapter\
    \ 7: Prototypes`, we will explore inheritance much further as well as use Mixins\
    \ to use methods from different classes without the need of inheritance.\n\n#\
    \ Conclusion\n\nIn this chapter, we learnt JavaScript classes and how to make\
    \ use of them. We learned why classes are important, and how we can add properties\
    \ and methods to JavaScript classes. We created a lot of examples in this chapter\
    \ because that is the easiest way to learn anything! Practice makes perfect.\n\
    \nIn the next chapter, we will deal with prototypes. Although we have touched\
    \ on the subject in this chapter, we will dive deeper into them. We will also\
    \ learn the importance of inheritance and Mixins and primitives.\n\n# Questions\n\
    \n1. Explain the term `class`.\n2. Name the two ways in which a class can be created.\n\
    3. What is the difference between a method and a static method?\n4. Name the three\
    \ attributes of a property.\n5. Explain the term inheritance.\n\n# CHAPTER 7:\
    \ JavaScript Prototypes\n\n## Introduction\n\nPrototypes in JavaScript enable\
    \ us to make our code a bit more Object Oriented. JavaScript prototypes help us\
    \ construct objects nicely. Yes, classes do the same thing, but prototypes address\
    \ several shortcomings of ordinary JavaScript classes.\n\nThere are different\
    \ prototypes, and we will investigate a few of them. The fun part of this chapter\
    \ starts with inheritance and Mixins where we can borrow properties and methods\
    \ from other JavaScript classes.\n\n## Structure\n\n- What are prototypes?\n-\
    \ Prototypal inheritance\n- Mixins\n\n## Objectives\n\n- Learn the different types\
    \ of prototypes\n- Understand the need for prototypes\n- Understand prototypal\
    \ inheritance\n- Understand Mixins\n\n## What are prototypes?\n\nPrototypes in\
    \ JavaScript enable us to make our code a bit more object-oriented. JavaScript\
    \ prototypes help us construct objects nicely. Yes, classes do the same thing,\
    \ but prototypes address several shortcomings of ordinary JavaScript classes.\n\
    \nThere are two prototypes in JavaScript, namely `prototype` and `[[Prototype]]`:\n\
    \n- `prototype`: The prototype is assigned as a property of any function you create\
    \ in JavaScript, as explained in `Chapter 6: JavaScript Classes`.\n- `[[Prototype]]`:\
    \ Each object that is accessed by the running context has a `[[Prototype]]` property,\
    \ which gets read when a certain property on the object being read, is not available.\n\
    \nOK, this doesn’t really make sense now, does it? No. Let’s have a closer look.\n\
    \nWe have learned in `Chapter 6: JavaScript Classes`, that you can create objects\
    \ by using a constructor function. Let’s have a look at the below example:\n\n\
    ```\nfunction Student(studentFirstName, studentLastName) {\n  this.studentFirstName\
    \ = studentFirstName,\n  this.studentLastName = studentLastName,\n  this.studentFullName\
    \ = function() {\n    return this.studentFirstName + \" \" + this.studentLastName;\n\
    \  }\n}\n\nvar student1 = new Student(\"Ockert\", \"du Preez\");\nvar student2\
    \ = new Student(\"BpB\", \"Publications\");\nconsole.log(student1);\nconsole.log(student2)\n\
    ```\n\nThe function `Student` is the constructor function for a `Student` object.\
    \ It includes the first name and last name parameters, or in this case, properties.\
    \ `studentFullName` is a function combining the first name and last name strings.\n\
    \nTwo `Student` objects are then created: `student1` and `student2`, and the results\
    \ get displayed in the console window.\n\nNow, by looking at this code, nothing\
    \ seems to be out of place. It is not. It creates two copies of the `Student`\
    \ constructor function, each for `student1` and `student2`. This means that every\
    \ object created by using the `Student` constructor function will have its own\
    \ copy of methods and properties. This is where the problem comes in. The `studentFirstName`\
    \ method in the constructor. It wastes memory by having two instances of it, and\
    \ it does the same thing in each separate object.\n\nWe fix this by creating prototypes.\n\
    \nEvery time a function is created, the JavaScript engine automatically adds a\
    \ prototype property to it. This is known as a prototype object, and it includes\
    \ its own constructor by default. The constructor points back to the function\
    \ on which the prototype object is a property. You access the function’s prototype\
    \ property using `functionName.prototype`.\n\n`Figure 7.1` shows that the `Student`\
    \ constructor contains a prototype property that points to the prototype object.\
    \ This prototype object contains a constructor that points back to the function.\n"
