  trans: "\n\n*   了解如何在 JavaScript 中使用注释。\n\n# 调试\n\n给我看一个没有任何错误的脚本，我就给你看“尼湖湖水怪”。虽然在浏览网站时，它看起来似乎是完美的，而且从任何意义上来说，它确实如此，但它曾经存在大量的错误，也许现在可能仍然存在。错误会发生。失误也会发生。这是编程的一部分。然而，技巧之处在于你如何处理它们。\n\
    \nJavaScript 中主要有两种类型的错误；它们是：\n\n*   **语法错误 (Syntax errors)**：语法错误发生在输入代码时。当人打字速度很快时，他或她并不总是能立即发现错误。这些错误可能很难找到，除非你手头有一个调试工具，否则你可能需要逐行扫描代码。\n\
    \n*   **逻辑错误 (Logical errors)**：逻辑错误让开发者陷入噩梦。这些错误通常发生在你预期某个结果但实际发生了不同情况时。例如：假设你想把背景变成蓝色，并编写了相关代码，但背景最终变成了红色。这就是逻辑错误。\n\
    \n*   **运行时错误 (Runtime errors)**：运行时错误发生在用户正在使用页面时。假设用户输入了错误信息或提供了格式错误的信息。这些都是运行时错误，你应该能够处理它们。\n\
    \n为了修复这些任何一类型的错误，你需要工具。记住，JavaScript 并没有一个带有调试工具和功能的全功能 `IDE`（集成开发环境），因此可用的选项并不多。\n\
    \n# JavaScript 调试语言特性\n\nJavaScript 语言包含两个调试特性；它们是：\n\n*   控制台窗口 (the console\
    \ window)\n*   `debugger` 关键字\n\n让我们进入更多细节。\n\n# 控制台窗口\n\n控制台窗口比你想象的要强大得多！你不仅可以向它输出重要内容，还可以对某些过程计时，查看它们需要多长时间。这可能是一个长循环或复杂的语句。毕竟，速度在\
    \ Web 应用中至关重要。\n\n# console.log\n\n`console.log` 函数的功能是将信息输出到浏览器的控制台窗口。在目前为止的所有课程中，我一直在控制台窗口演示各种代码输出，但以防你忘记，让我们来做一个小练习，演示\
    \ `console.log()` 的用法。\n\n*   打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n    ```html\n\
    \    <html>\n    <body>\n    <h1>console.log Output</h1>\n    <p>The following\
    \ code demonstrates the use of console.log</p>\n    <script>\n    console.log(“I\
    \ love JavaScript”);\n    var myObj = { firstname : “Ockert”, lastname : “du Preez”\
    \ };\n    console.log(myObj);\n    var myArr = [“JavaScript”, “CSS”, “HTML5”,\
    \ “jQuery” ];\n    console.log(myArr);\n    </script>\n    </body>\n    </html>\n\
    \    ```\n\n*   用 HTML 扩展名保存文件，例如 `Chapter 15.1.html`。\n*   双击该文件在默认浏览器中打开它。\n\
    *   在 Google Chrome 中按 `Ctrl` + `Shift` + `J` 或 `F12` 打开控制台窗口。\n\n当控制台窗口打开时，你将看到被写入其中的三个不同类型的内容。首先是字符串：`I\
    \ love JavaScript!`，然后是显示我名字和姓氏的对象。最后，数组的内容也被打印出来。*图 15.1** 显示了结果：\n\n![](img/Img_15_01.jpg)\n\
    \n**图 15.1：** console.log\n\n控制台窗口的另一个有用功能是 `console.time` 关键字。\n\n# console.time\
    \ 和 console.timeEnd 关键字\n\n有时你需要确保代码在每个浏览器上运行得足够快。为此，你可以使用 `console` 对象的 `time()`\
    \ 和 `timeEnd` 方法分别启动和停止内置计时器。让我们来快速快速练习！\n\n1.  打开你任选的文本编辑器并输入以下 HTML 和 JavaScript\
    \ 代码：\n\n    ```html\n    <html>\n    <body>\n    <h1>console timing features</h1>\n\
    \    <p>The following code demonstrates the use of console.time and console.timeEnd</p>\n\
    \    <script>\n    console.time(‘Timer1’);\n    var items = [];\n    for(var i\
    \ = 0; i < 500000; i++){\n    items.push({index: i});\n    }\n    console.timeEnd(‘Timer1’);\n\
    \    </script>\n    </body>\n    </html>\n    ```\n\n2.  用 HTML 扩展名保存文件，例如 `Chapter\
    \ 15.2.html`。\n3.  双击该文件在默认浏览器中打开它。\n4.  在 Google Chrome 中按 `Ctrl` + `Shift` +\
    \ `J` 或 `F12` 打开控制台窗口。\n\n我得到的输出显示在*图 15.2*中：\n\n![](img/Img_15_02.jpg)\n\n**图\
    \ 15.2：** console timing features\n\n控制台告诉我们，完成 `for` 循环的所有迭代耗时 `114` 毫秒。你指定了计时器应该在哪里开始，在哪里结束。\n\
    \n# 更多 console 方法\n\n`console` 对象包含了许多其他方法来帮助调试。它们列在下表中：\n\n| 方法 | 描述 |\n| :---\
    \ | :--- |\n| `assert()` | 如果断言为假，则向控制台写入错误消息 |\n| `clear()` | 清空控制台 |\n| `count()`\
    \ | 记录 count() 函数被调用的次数 |\n| `error()` | 向控制台输出错误消息 |\n| `group()` | 在控制台中创建一个新的内联分组\
    \ |\n| `groupCollapsed()` | 在控制台中创建一个新的折叠内联分组 |\n| `groupEnd()` | 退出控制台中的当前内联分组\
    \ |\n| `info()` | 向控制台输出信息消息 |\n| `table()` | 将表格数据显示为表格 |\n| `trace()` | 向控制台输出堆栈跟踪\
    \ |\n| `warn()` | 向控制台输出警告消息 |\n\n**表 15.1：** 控制台方法\n\n让我们来做一个练习！\n\n还有几个 console\
    \ 方法，下一个练习将演示：\n\n1.  打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n    ```html\n\
    \    <html>\n    <body>\n    <h1> more console methods</h1>\n    <p>The following\
    \ code demonstrates the use of console methods</p>\n    <script>\n    var myObj\
    \ = { firstname : “Ockert”, lastname : “du Preez” };\n    console.assert(document.getElementById(“demo”),\
    \ myObj);\n    console.clear();\n    for (i = 0; i < 10; i++) {\n    console.count();\n\
    \    }\n    console.error(“I am a mistake!”);\n    console.log(“Hello world!`\
    \ `- Normal”);\n    console.group();\n    console.log(“Hello again!` `- Inside\
    \ a group”);\n    console.info(“I love JavaScript!”);\n    function myFunction()\
    \ {\n    anotherFunction();\n    }\n    function anotherFunction() {\n    console.trace();\n\
    \    }\n    console.warn(“This is a warning!”);\n    console.table([“JavaScript”,\
    \ “HTML5”, “CSS”]);\n    </script>\n    </body>\n    </html>\n    ```\n\n2.  用\
    \ HTML 扩展名保存文件，例如 `Chapter 15.3.html`。\n3.  双击该文件在默认浏览器中打开它。\n4.  在 Google Chrome\
    \ 中按 `Ctrl` + `Shift` + `J` 或 `F12` 打开控制台窗口。\n\n上述代码的输出如下方的所示：\n\n![](img/Img_15_03.jpg)\n\
    \n**图 15.3：** 更多 console 方法\n\n如所见，控制台比想象的要强大得多。通过使用 `assert`、`warn` 和 `error`\
    \ 方法，你可以快速检查错误，通过分组和表格方法，你可以组织数据的输出。\n\n接下来的 JavaScript 调试语言特性是 `debugger` 关键字，将在后面解释。\n\
    \n"
- fmt: "\nThe next little exercise demonstrates the use of the `debugger` keyword:\n\
    \n1. Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n```html\n<html>\n<body>\n<h1>debugger statement</h1>\n<p>The following\
    \ code demonstrates the use of the debugger statement</p>\n<script>\nvar x = 30\
    \ * 5;\ndebugger;\ndocument.getElementbyId(“Answer”).innerHTML = x;\n</script>\n\
    </body>\n</html>\n```\n\n2. Save the file with an HTML extension, for example\
    \ `Chapter 15.4.html`.\n\n3. Double-click the file to open it in the default browser.\n\
    4. Press `Ctrl` + `Shift` + `J` or `F12` in Google Chrome to open the console\
    \ window.\n\nThe paused browser window is displayed:\n\n![](images/Img_15_04.jpg)\n\
    \n**Figure 15.4:** Code paused in the Debugger\n\nAs you can see, in debugging\
    \ mode, the screen turns grey and highlights the debugger line. Also, notice the\
    \ small yellow window in the browser window. It states that the code is paused\
    \ in the debugger and provides two buttons. Resume execution continues code execution\
    \ until the next breakpoint, if present. Step over the next function goes to the\
    \ next line (in this case).\n\nIf the `Resume` is pressed, the next line will\
    \ be underlined as an error because there is no Answer field present in the document.\n\
    \nLet’s see how to deal with runtime errors.\n\n# try and catch blocks #toc.xhtml_s243a\n\
    \nThe `try…catch` statement handles the errors that can occur while running code.\
    \ You put the potential breaking code inside the `try` block, and the debugger\
    \ will try and execute it. In the event of an error, the code inside the `catch`\
    \ block will fire. This prevents the page from breaking and the browser to produce\
    \ an error.\n\nYou may optionally add a `finally` statement after the `catch`\
    \ block, which will execute irrespective of an error.\n\nThe next exercise demonstrates\
    \ the use of the `try…catch`statement.\n\n1. Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p>try and catch</p>\n<p>Please input a number between 15 and\
    \ 20:</p>\n<input id=”userInput” type=”text\">\n<button type=”button” onclick=”Check()\"\
    >Test Input</button>\n<p id=”output”></p>\n<script>\nfunction Check() {\n  var\
    \ message, x;\n  message = document.getElementById(“output”);\n  message.innerHTML\
    \ = “”;\n  x = document.getElementById(“userInput”).value;\n  try {\n    if(x\
    \ == “”) throw “is Empty”;\n    if(isNaN(x)) throw “not a number”;\n    if(x >\
    \ 20) throw “too high”;\n    if(x < 15) throw “too low”;\n  }\n  catch(err) {\n\
    \    message.innerHTML = “Input “ + err;\n  }\n}\n</script>\n</body>\n</html>\n\
    ```\n\n2. Save the file with an HTML extension, for example `Chapter 15.5.html`.\n\
    \n3. Double-click the file to open it in the default browser.\n4. Press `Ctrl`\
    \ + `Shift` + `J` or `F12` in Google Chrome to open the console window.\n\nAn\
    \ example of the output is shown below:\n\n![](images/Img_15_05.jpg)\n\n**Figure\
    \ 15.5:** try and catch example\n\nThe `try` block is used to determine what is\
    \ input by the user into the `userInput` field. If the number is between `15`\
    \ and `20,`, nothing will happen; in other words, no error will be produced. If,\
    \ however, there is no value input, a word instead of a number, or a value higher\
    \ than `20`, as is the case in `[Figure 15.5](#c15.xhtml_fig15_5)`*, or a value\
    \ less than `15` an error will be thrown, and it will be handled inside the `catch`\
    \ block.\n\n# Coding style #toc.xhtml_s244a\n\nEach programming language has a\
    \ set of unwritten rules that developers should follow. OK, not totally unwritten,\
    \ but rules that are followed, standards if you may, to improve the readability\
    \ of code. This is necessary because scripts can become very, very long and you\
    \ can get lost quite quickly in the plethora of bad variable and object names\
    \ and messy conditional statements and loops.\n\n# Variable and object names #toc.xhtml_s245a\n\
    \nThere are mainly two naming conventions for variable names, namely: camel case\
    \ and pascal case. They differ in the way they are capitalized, as shown next:\n\
    \n* `camelCase`\n* `PascalCase`\n\nThroughout this book, I have tried to keep\
    \ the `camelCase` naming convention.\n\nIt is also quite common to have global\
    \ variables in UPPERCASE.\n\nVariable names can contain letters, numbers, the\
    \ dollar sign, and the underscore. A few examples follow:\n\n`full_Name`\n`student1`\n\
    `student_Name$`\n\nRemember though that you should always maintain the same naming\
    \ convention throughout your script. Variables were discussed in `[Chapter 12:\
    \ Variables](#c12.xhtml)`.\n\n# Operators and indentation #toc.xhtml_s246a\n\n\
    The common rule with operators is always to have spaces between all the operands.\
    \ Compare the following:\n\n`Result=varibale1+variable2`\n\nversus\n\n`Result\
    \ = varibale1 + variable2`\n\nSpaces make the code much more legible. Operators\
    \ were discussed in `[Chapter 4: JavaScriptOperators](#c04.xhtml)`.\n\nTalking\
    \ about spaces, when you have controlflow statements `[Chapter 13: Control Flow\
    \ Statements](#c13.xhtml)` in your code or make use of functions `[Chapter 5:\
    \ JavaScript Functions](#c05.xhtml)` you absolutely should make use of spaces\
    \ to improve the flow of your code. Compare the following code segments:\n\n```javascript\n\
    var time = new Date().getHours();\nif (time < 12) {\n  greeting = “morning”;\n\
    } else if (time < 18) {\n  greeting = “afternoon”;\n} else {\n  greeting = “evening”;\n\
    }\n```\n\nversus\n\n```javascript\nvar time = new Date().getHours();\nif (time\
    \ < 12) {greeting =“morning”;}else if (time < 18) {greeting =“afternoon”;}else\
    \ {greeting =“evening”;}\n``` (Note: reconstructed based on text context)\n\n\
    The segment with the spaces is much easier to read. This may be a very simple\
    \ example, but when nested control-flow statements come into play, you can get\
    \ confused.\n\n# Rules for objects #toc.xhtml_s247a\n\nCommon practices for object\
    \ `[Chapter 2: Objects](#c02.xhtml)` definitions are as follows:\n\n* The opening\
    \ bracket should be placed on the same line as the object name.\n* Use a colon\
    \ and one space between property name and its value.\n* Use quotes around string\
    \ values only, unless the numeric value should be a string.\n* No comma is needed\
    \ after the last property-value pair.\n* The closing bracket should be placed\
    \ on a new line, without a leading space.\n* End an object definition with a semicolon.\n\
    \nHere is a small example making use of all the rules:\n\n```javascript\nvar student\
    \ = {\n  firstName: “Ockert”,\n  lastName: “du Pz”,\n  age: 41,\n  course: “JavaScript”\n\
    };\n```\n\nIt is very easy to see what the object consists of.\n\n# Comments #toc.xhtml_s248a\n\
    \nComments are used to describe what the code is doing. Trust me; you don’t realize\
    \ how important this is until it is too late. Imagine working on a complex problem,\
    \ and after a while, you figured it out. Imagine further that you didn’t add comments\
    \ to describe the code and that you come back to the code 6 months later to do\
    \ an update. It can be extremely hard to remember what you have done and where\
    \ you have done it.\n\nAnother important fact to remember is that you may be working\
    \ in a team environment. Comments can help you understand another team member’s\
    \ code and vice versa.\n\nThere are two types of comments:\n\n* Single line comments\n\
    * Multi-line comments\n\nLet’s have a closer look.\n\n# Single line comments #toc.xhtml_s249a\n\
    \nA single line comment can be placed anywhere on a line, for example:\n\n```javascript\n\
    var objstudent; //Declare student object here\n```\n\nIn the above code, the comment\
    \ starts with two forward slashes and is placed after an object declaration.\n\
    \n# Multi-line comment #toc.xhtml_s250a\n\nA multi-line comment can span multiple\
    \ lines, for example:\n\n```javascript\n/*This conditional statement tests the\
    \ time\nThe result that will be shown depends on the time of day*/\n```\n"
  raw: "The next little exercise demonstrates the use of the `debugger` keyword:\n\
    \n1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>debugger statement</h1>`\n\
    \n    `<p>The following code demonstrates the use of the debugger statement</p>`\n\
    \n    `<script>`\n\n    `var x = 30 * 5;`\n\n    `debugger;`\n\n    `document.getElementbyId(“Answer”).innerHTML\
    \ = x;`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file\
    \ with an HTML extension, for example `Chapter 15.4.html`.\n\n3.  Double-click\
    \ the file to open it in the default browser.\n\n4.  Press *Ctrl* + *Shift* +\
    \ *J* or *F12* in Google Chrome to open the console window.\n\nThe paused browser\
    \ window is displayed:\n\n![](images/Img_15_04.jpg)\n\n**Figure 15.4:** Code paused\
    \ in the Debugger\n\nAs you can see, in debugging mode, the screen turns grey\
    \ and highlights the debugger line. Also, notice the small yellow window in the\
    \ browser window. It states that the code is paused in the debugger and provides\
    \ two buttons. Resume execution continues code execution until the next breakpoint,\
    \ if present. Step over the next function goes to the next line (in this case).\n\
    \nIf the **`Resume`** is pressed, the next line will be underlined as an error\
    \ because there is no Answer field present in the document.\n\nLet’s see how to\
    \ deal with runtime errors.\n\n# [try and catch blocks](#toc.xhtml_s243a)\n\n\
    The `try…catch` statement handles the errors that can occur while running code.\
    \ You put the potential breaking code inside the `try` block, and the debugger\
    \ will try and execute it. In the event of an error, the code inside the `catch`\
    \ block will fire. This prevents the page from breaking and the browser to produce\
    \ an error.\n\nYou may optionally add a `finally` statement after the `catch`\
    \ block, which will execute irrespective of an error.\n\nThe next exercise demonstrates\
    \ the use of the `try…catch`statement.\n\n1.  Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n    `<!DOCTYPE html>`\n\
    \n    `<html>`\n\n    `<body>`\n\n    `<p>try and catch</p>`\n\n    `<p>Please\
    \ input a number between 15 and 20:</p>`\n\n    `<input id=”userInput” type=”text”>`\n\
    \n    `<button type=”button” onclick=”Check()”>Test Input</button>`\n\n    `<p\
    \ id=”output”></p>`\n\n    `<script>`\n\n    `function Check() {`\n\n    `var\
    \ message, x;`\n\n    `message = document.getElementById(“output”);`\n\n    `message.innerHTML\
    \ = “”;`\n\n    `x = document.getElementById(“userInput”).value;`\n\n    `try\
    \ {`\n\n    `if(x == “”) throw “is Empty”;`\n\n    `if(isNaN(x)) throw “not a\
    \ number”;`\n\n    `if(x > 20) throw “too high”;`\n\n    `if(x < 15) throw “too\
    \ low”;`\n\n    `}`\n\n    `catch(err) {`\n\n    `message.innerHTML = “Input “\
    \ + err;`\n\n    `}`\n\n    `}`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\
    \n2.  Save the file with an HTML extension, for example `Chapter 15.5.html`.\n\
    \n3.  Double-click the file to open it in the default browser.\n\n4.  Press *Ctrl*\
    \ + *Shift* + *J* or *F12* in Google Chrome to open the console window.\n\nAn\
    \ example of the output is shown below:\n\n![](images/Img_15_05.jpg)\n\n**Figure\
    \ 15.5:** try and catch example\n\nThe `try` block is used to determine what is\
    \ input by the user into the `userInput` field. If the number is between `15`\
    \ and `20,` nothing will happen; in other words, no error will be produced. If,\
    \ however, there is no value input, a word instead of a number, or a value higher\
    \ than `20`, as is the case in *[Figure 15.5](#c15.xhtml_fig15_5)*, or a value\
    \ less than `15` an error will be thrown, and it will be handled inside the `catch`\
    \ block.\n\n# [Coding style](#toc.xhtml_s244a)\n\nEach programming language has\
    \ a set of *unwritten* rules that developers should follow. OK, not totally unwritten,\
    \ but rules that are followed, standards if you may, to improve the readability\
    \ of code. This is necessary because scripts can become very, very long and you\
    \ can get lost quite quickly in the plethora of bad variable and object names\
    \ and messy conditional statements and loops.\n\n# [Variable and object names](#toc.xhtml_s245a)\n\
    \nThere are mainly two naming conventions for variable names, namely: camel case\
    \ and pascal case. They differ in the way they are capitalized, as shown next:\n\
    \n*   camelCase\n\n*   PascalCase\n\nThroughout this book, I have tried to keep\
    \ the camelCase naming convention.\n\nIt is also quite common to have global variables\
    \ in UPPERCASE.\n\nVariable names can contain letters, numbers, the dollar sign,\
    \ and the underscore. A few examples follow:\n\n`full_Name`\n\n`student1`\n\n\
    `student_Name$`\n\nRemember though that you should always maintain the same naming\
    \ convention throughout your script. Variables were discussed in *[Chapter 12:\
    \ Variables](#c12.xhtml)*.\n\n# [Operators and indentation](#toc.xhtml_s246a)\n\
    \nThe common rule with operators is always to have spaces between all the operands.\
    \ Compare the following:\n\n`Result=varibale1+variable2`\n\nversus\n\n`Result\
    \ = varibale1 + variable2`\n\nSpaces make the code much more legible. Operators\
    \ were discussed in [Chapter 4: JavaScriptOperators](#c04.xhtml).\n\nTalking about\
    \ spaces, when you have controlflow statements (*[Chapter 13: Control Flow Statements](#c13.xhtml)*)\
    \ in your code or make use of functions (*[Chapter 5: JavaScript Functions](#c05.xhtml)*)\
    \ you absolutely should make use of spaces to improve the flow of your code. Compare\
    \ the following code segments:\n\n`var time = new Date().getHours();`\n\n`if (time\
    \ < 12) {`\n\n`greeting = “Good morning”;`\n\n`}`\n\n`else if (time < 18) {`\n\
    \n`greeting = “Good afternoon”;`\n\n`}`\n\n`else {`\n\n`greeting = “Good evening”;`\n\
    \n`}`\n\n`document.write(greeting);`\n\nversus\n\n`var time = new Date().getHours();`\n\
    \n`if (time < 12) {`\n\n`greeting = “Good morning”;`\n\n`}`\n\n`else if (time\
    \ < 18) {`\n\n`greeting = “Good afternoon”;`\n\n`}`\n\n`else {`\n\n`greeting =\
    \ “Good evening”;`\n\n`}`\n\n`document.write(greeting);`\n\nThe segment with the\
    \ spaces is much easier to read. This may be a very simple example, but when nested\
    \ control-flow statements come into play, you can get confused very quickly.\n\
    \n# [Rules for objects](#toc.xhtml_s247a)\n\nCommon practices for object (*[Chapter\
    \ 2: JavaScript Objects](#c02.xhtml)*) definitions are as follows:\n\n*   The\
    \ opening bracket should be placed on the same line as the object name.\n\n* \
    \  Use a colon and one space between a property name and its value.\n\n*   Use\
    \ quotes around string values only, unless the numeric value should be a string.\n\
    \n*   No comma is needed after the last property-value pair.\n\n*   The closing\
    \ bracket should be placed on a new line, without a leading space.\n\n*   End\
    \ an object definition with a semicolon.\n\nHere is a small example making use\
    \ of all the above rules:\n\n`var student = {`\n\n`firstName: “Ockert”,`\n\n`lastName:\
    \ “du Preez”,`\n\n`age: 41,`\n\n`course: “JavaScript”`\n\n`};`\n\nIt is very easy\
    \ to see what the object consists of.\n\n# [Comments](#toc.xhtml_s248a)\n\nComments\
    \ are used to describe what the code is doing. Trust me; you don’t realize how\
    \ important this is until it is too late. Imagine working on a complex problem,\
    \ and after a while, you figured it out. Imagine further that you didn’t add comments\
    \ to describe the code and that you come back to the code 6 months later to do\
    \ an update. It can be extremely hard to remember what you have done and where\
    \ you have done it.\n\nAnother important fact to remember is that you may be working\
    \ in a team environment. Comments can help you understand another team member’s\
    \ code and vice versa.\n\nThere are two types of comments:\n\n*   Single line\
    \ comments\n\n*   Multi-line comments\n\nLet’s have a closer look.\n\n# [Single\
    \ line comments](#toc.xhtml_s249a)\n\nA single line comment can be placed anywhere\
    \ on a line, for example:\n\n`var objstudent; //Declare student object here`\n\
    \nIn the above code, the comment starts with two forward slashes and is placed\
    \ after an object declaration.\n\n# [Multi-line comment](#toc.xhtml_s250a)\n\n\
    A multi-line comment can span multiple lines, for example:\n\n`/*This conditional\
    \ statement tests the time`\n\n`The result that will be shown depends on the time\
    \ of day`"
