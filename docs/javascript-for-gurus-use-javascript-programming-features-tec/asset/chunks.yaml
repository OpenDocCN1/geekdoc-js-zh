    Single quotes (`‘`) and double quotes (`“`) are essentially the same, the only
    thing to remember is that you cannot start with a single quote and end the string
    with a double quote for example, or vice versa. Keep some sort of standard as
    well by making all your strings look the same. It just makes it easier to identify
    them in future.


    # Backticks


    Backticks (`‘`)allow you to embed expressions into a string, by enclosing it with
    `${…}`. We have been doing examples of this throughout this book, but let’s refresh
    our memory with a small exercise.


    The following sample demonstrates the use of backticks your web pages:


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <html>

    <body>

    <h1>Backticks example</h1>

    <p>Backticks example</p>

    <script>

    function sum(a, b) {

    return a + b;

    }

    alert(`1 + 2 = ${sum(1, 2)}.`); // 1 + 2 = 3.

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 12.1.html`.


    3.  Double-click the file to open it in the default browser.


    Here we simply create a very basic function that adds two objects, and then display
    it inside an alertbox, as shown in the next screenshot:


    ![](images/Img_12_01.jpg)


    **Figure 12.1:** Backticks


    One feature I really love about backticks is the ability for one string to span
    multiple lines. If I were to do the following with a single quote or a double
    quote, the JavaScript compiler would throw an error.


    ```javascript

    let students = `Students:

    * Ockert

    * BpB

    * John

    * Peter

    * William

    * Jessica`;

    alert(students);

    ```


    *[Figure 12.2](#c12.xhtml_fig12_2)* shows what the above code, when executed,
    will look like:


    ![](images/Img_12_02.jpg)


    **Figure 12.2:** Backticks for multiple line strings


    You can, however, still create multiline strings with single and double-quotes.
    You do this by inserting the newline character, written as `\n`, inside the string.
    The next line of code produces the exact same result as the multiline quote surrounded
    by backticks shown earlier.


    ```javascript

    let students = “Students:\n * Ockert\n * BpB\n * John\n * Peter\n * William\n*
    Jessica”;

    alert(students);

    ```


    The special character `\n` (newline) is inserted in the string at the place or
    places where the string must be split into a new line.


    Speaking of special characters, let’s have a more detailed look into the next.


    # Special characters


    A special character is a character that is not a letter, number, symbol, or punctuation
    mark. *[Table 12.1](#c12.xhtml_tab12_1)* shows some common special characters:


    | Character | Description |

    | :--- | :--- |

    | `\n` | New line |

    | `\r` | Carriage return. Usually, a combination of `\n` and `\r` is used to create
    a new line in text files |

    | `\’` | Single quote |

    | `\”` | Double quote |

    | `\\` | Backslash |

    | `\t` | Tab |

    | `\b, \f, \v` | Backspace, form feed, a vertical tab. Mostly kept for compatibility
    |

    | `\xXX` | Unicode characters. For example: ‘`\x6F`’ is the same as ‘`O`’ |

    | `\uXXXX` | Unicode symbol. For example,`\u00AE` – is the same as the Registered
    sign `®`. |


    **Table 12.1:** Special characters


    Notice that all special characters must start with the backslash. In this sense,
    it is known as an escape character.


    # String properties


    A primitive value such as `Ockert du Preez` is not an object, so it cannot have
    properties or methods. JavaScript, however, makes methods and properties available
    to primitive values because these values are treated as objects while executing
    methods and properties.


    The `length` property returns the number of characters in a given string. The
    following sample demonstrates the length string property:


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <html>

    <body>

    <h1>String length Property</h1>

    <p>String length Property</p>

    <script>

    var str = new String( “Ockert du Preez” );

    document.write(“str.length is:” + str.length);

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 12.2.html`.


    3.  Double-click the file to open it in the default browser.


    The answer will be `15` because the `length` property includes spaces.


    # String methods


    The next table lists the standard string methods:


    | Method | Description |

    | :--- | :--- |

    | `charAt()` | Gets character at specified index. |

    | `charCodeAt()` | Gets Unicode of the character at a specified index. |

    | `concat()` | Joins two or more strings. |

    | `endsWith()` | Determines if a string ends with a specified substring. |

    | `fromCharCode()` | Converts Unicode to characters. |

    | `includes()` | Determines if a string contains the specified substring. |

    | `indexOf()` | Gets the index of the first occurrence of a specified value in
    a string. |

    | `lastIndexOf()` | Gets the index of the last occurrence of a specified value
    in a string. |

    | `localeCompare()` | Compares two strings. |

    | `match()` | Matches a string against a regular expression. |

    | `repeat()` | Repeats a string. |

    | `replace()` | Replaces a string or pattern inside a string with another string.
    |

    | `search()` | Searches a string against a regular expression. |

    | `slice()` | Extracts a portion of a string. |

    | `split()` | Splits a string into substrings. |

    | `startsWith()` | Determines if a string begins with a specified substring. |

    | `substr()` | Extracts the part of a string. |

    | `substring()` | Extracts the part of a string. |

    | `toLocaleLowerCase()` | Converts a string to lowercase. |

    | `toLocaleUpperCase()` | Converts a string to uppercase. |

    | `toLowerCase()` | Converts a string to lowercase. |

    | `toString()` | Creates a string representing the specified string object. |

    | `toUpperCase()` | Converts a string to uppercase. |

    | `trim()` | Removes whitespace from the start and end of a string. |

    | `valueOf()` | Returns the primitive value. |


    **Table 12.2:** String methods


    The following sample demonstrates the use of the `charAt` string method:


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <html>

    <body>

    <h1>String charAt method</h1>

    <p>String charAt method</p>

    <script>

    var str = new String( “Ockert du Preez” );

    document.writeln(`<br />str.charAt(0) is:` + str.charAt(0));

    document.writeln(`<br />str.charAt(1) is:` + str.charAt(1));

    document.writeln(`<br />str.charAt(2) is:` + str.charAt(2));

    document.writeln(`<br />str.charAt(3) is:` + str.charAt(3));

    document.writeln(`<br />str.charAt(4) is:` + str.charAt(4));

    document.writeln(`<br />str.charAt(5) is:` + str.charAt(5));

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 12.3.html`.


    3.  Double-click the file to open it in the default browser.


    A string gets created with my name and surname. Then I obtain the character at
    the specified index with the `charAt` method. For instance: 0 is the first character
    of the string.

