    \nIn this chapter, we learnt about the ins-and-outs of JavaScript statements.\
    \ We learned how to create statements, how a statement is formed, and we then\
    \ learned about white space and line breaks. Lastly, we had a quick look at the\
    \ available JavaScript keywords.\n\n# CHAPTER 4: JavaScript Operators\n\n## Introduction\n\
    \nOperators enable us to work with different operands. These operands can be the\
    \ name of an object we would like to add, subtract, multiply, or divide. There\
    \ are many operators, each with its own function. This chapter explains what operators\
    \ are and breaks them down into categories and types for better understanding\
    \ and gives practical examples on how to use the most common operators.\n\n##\
    \ Objectives\n\n* What are operators?\n* Understand what operators are\n* Know\
    \ what arithmetic operators are\n* Learn about comparison operators\n* Understand\
    \ assignment operators\n* Compare the different operator types\n* Learn about\
    \ operator precedence\n\n## What are operators?\n\nOperators can be explained\
    \ as constructs which behave almost like functions but differ semantically or\
    \ syntactically from ordinary functions. There are many types of operators, even\
    \ categories that they will cover shortly. Some common operators include the following:\n\
    \n| Operator type/category | Operator(s) |\n| :--- | :--- |\n| Arithmetic | `+\
    \ - / %` |\n| Comparison | `>< <= ===` |\n| Logical | `||` |\n| Assignment | `=`\
    \ |\n\n**Table 4.1:** General operators\n\n## Major operators\n\nMajor operators\
    \ can be classified as any operator category that achieves a similar goal. Major\
    \ operators include arithmetic, assignment, comparison, and logical operators.\
    \ I will highlight each major type one by one in the next few tables and headings.\n\
    \n## Arithmetic operators\n\nArithmetic operators are mostly used to perform arithmetic\
    \ on numbers. The available arithmetic operators in JavaScript are shown in Table\
    \ 4.2:\n\n| Operator type | Operator | Description |\n| :--- | :--- | :--- |\n\
    | Arithmetic | `+` | Addition |\n| Arithmetic | `-` | Subtraction |\n| Arithmetic\
    \ | `*` | Multiplication |\n| Arithmetic | `**` | Exponentiation |\n| Arithmetic\
    \ | `/` | Division |\n| Arithmetic | `%` | Modulus (remainder) |\n| Arithmetic\
    \ | `++` | Increment |\n| Arithmetic | `--` | Decrement |\n\n**Table 4.2:** Arithmetic\
    \ operators\n\n## Comparison operators\n\nComparison operators are used to determine\
    \ equality or difference between values:\n\n| Operator type | Operator | Description\
    \ |\n| :--- | :--- | :--- |\n| Comparison | `==` | Equal to |\n| Comparison |\
    \ `===` | Equal value and type |\n| Comparison | `!=` | Not equal |\n| Comparison\
    \ | `!==` | Not equal value or equal type |\n| Comparison | `>` | Greater than\
    \ |\n| Comparison | `<` | Less than |\n| Comparison | `>=` | Greater than or equal\
    \ to |\n| Comparison | `<=` | Less than or equal to |\n| Comparison | `?` | Ternary\
    \ operator |\n\n**Table 4.3:** Conditional operators\n\n## Logical operators\n\
    \nLogical operators are used to determine the logic between values. The available\
    \ logical operators in JavaScript are shown in Table 4.4:\n\n| Operator type |\
    \ Operator | Description |\n| :--- | :--- | :--- |\n| Logical | `&&` | Logical\
    \ and |\n| Logical | `||` | Logical or |\n| Logical | `!` | Logical not |\n\n\
    **Table 4.4:** Logical operators\n\n## Assignment operators\n\nAssignment operators\
    \ assign values to variables. The available assignment operators in JavaScript\
    \ are shown in Table 4.5:\n\n| Operator | Example | Equivalent |\n| :--- | :---\
    \ | :--- |\n| `=` | `a = b` | `a = b` |\n| `+=` | `a += b` | `a = a + b` |\n|\
    \ `-=` | `a -= b` | `a = a - b` |\n| `*=` | `a *= b` | `a = a * b` |\n| `/=` |\
    \ `a /= b` | `a = a / b` |\n| `%=` | `a %= b` | `a = a % b` |\n| `**=` | `a **=\
    \ b` | `a = a ** b` |\n\n**Table 4.5:** Assignment operators\n\n## Operator sub-types\n\
    \nApart from having different functions as operators, there are different ways\
    \ to formulate a statement with various operators. In most cases, you will need\
    \ two operands (what operators are applied to) and an operator. Sometimes you\
    \ may need three operands and two operators. The operator sub-types as I’d like\
    \ to call them are listed below:\n\n* Unary\n* Binary\n* Ternary\n\n## Unary operators\n\
    \nWhen an operator is unary, it means that the operator only has a single operand.\
    \ The following sample shows some unary operators in action:\n\n1. Open a text\
    \ editor of your choice and enter the following HTML and JavaScript code\n\n```html\n\
    <html>\n<body>\n  <h1>Unary Operators</h1>\n  <p>The following code demonstrates\
    \ Unary operations on operands</p>\n  <script>\n    let a = 1;\n    let b = 1;\n\
    \    let c = 5;\n    let d = 5;\n    a = -a;\n    alert( a ); // -1, unary negation\
    \ was applied\n    b = +b;\n    alert( b ); // +1, unary addition was applied\n\
    \    c++;\n    alert( c ); // 6, increment was applied\n    d--;\n    alert( d\
    \ ); // 4, decrement was applied\n  </script>\n</body>\n</html>\n```\n"
  raw: "# [A while loop with line breaks and whitespace](#toc.xhtml_s59a)\n\n`var\
    \ counter = 0;`\n\n`while (counter <= 100)`\n\n`{`\n\n`document.write(counter\
    \ + “<br>”);`\n\n`counter++;`\n\n`}`\n\nThe above is a short example of what a\
    \ small `while` loop can look like with a bit of whitespace and line breaks. Let’s\
    \ add some line breaks to the `for` loop.\n\n# [A for loop with line breaks and\
    \ whitespace](#toc.xhtml_s60a)\n\n`for (let i = 0; i <= 100; i++)`\n\n`{`\n\n\
    `document.write(i + “<br>”);`\n\n`}`\n\nNext, here is an example of an `if` statement\
    \ with good use of both whitespace and line breaks.\n\n# [if with whitespace and\
    \ line breaks](#toc.xhtml_s61a)\n\n`if (counter > 50)`\n\n`{`\n\n`alert(“stop\
    \ it!”);`\n\n`break;`\n\n`}`\n\nLooks and reads much better than having a bunch\
    \ of statements just grouped together without any spaces or line breaks.\n\n#\
    \ [JavaScript keywords](#toc.xhtml_s62a)\n\nKeywords or reserved words are words\
    \ in JavaScript that means something specific to JavaScript. These words cannot\
    \ be used to name variables or functions. A list of JavaScript keywords follow:\n\
    \n| `abstract` | `await` |\n\n| `arguments` | `boolean` |\n\n| `break` | `case`\
    \ |\n\n| `byte` | `catch` |\n\n| `char` | `const` |\n\n| `class` | `continue`\
    \ |\n\n| `debugger` | `delete` |\n\n| `default` | `do` |\n\n| `double` | `enum`\
    \ |\n\n| `else` | `eval` |\n\n| `export` | `FALSE` |\n\n| `extends` | `final`\
    \ |\n\n| `finally` | `for` |\n\n| `float` | `function` |\n\n| `goto` | `implements`\
    \ |\n\n| `if` | `import` |\n\n| `in` | `int` |\n\n| `instanceof` | `interface`\
    \ |\n\n| `let` | `native` |\n\n| `long` | `new` |\n\n| `null` | `private` |\n\n\
    | `package` | `protected` |\n\n| `public` | `short` |\n\n| `return` | `static`\
    \ |\n\n| `super` | `synchronized` |\n\n| `switch` | `this` |\n\n| `throw` | `transient`\
    \ |\n\n| `throws` | `TRUE` |\n\n| `try` | `var` |\n\n| `typeof` | `void` |\n\n\
    | `volatile` | `with` |\n\n| `while` | `yield` |\n\n**Table 3.1:** JavaScript\
    \ keywords\n\nDuring the course of this book, we will cover these keywords, as\
    \ this chapter is only an introduction.\n\n# [Conclusion](#toc.xhtml_s63a)\n\n\
    In this chapter, welearnt about the ins-and-outs of JavaScript statements. We\
    \ learned how to create statements, how a statement is formed, and we then learned\
    \ about white space and line breaks. Lastly, we had a quick look at the available\
    \ JavaScript keywords.\n\nIn the next chapter, we will learn about JavaScript\
    \ operators. We explore the operator types, how to use operators to assign values.\
    \ We then get a bit technical by comparing unary operators with binary operators.\n\
    \n# [Questions](#toc.xhtml_s64a)\n\n1.  What is the difference between a JavaScript\
    \ statement and a code block?\n\n2.  What is the main advantage of adding white\
    \ space to your code?\n\n3.  Why should you add line breaks in your code?\n\n\
    4.  Name 4 JavaScript keywords.\n\n5.  What is the purpose of the semi-colon character?\n\
    \n# [CHAPTER 4](#toc.xhtml_c04)\n\n# [JavaScript Operators](#toc.xhtml_c04)\n\n\
    # [Introduction](#toc.xhtml_s65a)\n\nOperators enable us to work with different\
    \ operands. These operands can be the name of an object which type we would like\
    \ to identify. It can be two numbers we’d like to add, subtract, multiply, or\
    \ divide.\n\nThere are many operators, each with its own function. This chapter\
    \ explains what operators and operands are. It breaks them down into its categories\
    \ and types for better understanding and gives practical examples on how to use\
    \ the most common operators in JavaScript.\n\n# [Structure](#toc.xhtml_s66a)\n\
    \n*   What are operators?\n\n    *   Major operators\n\n    *   Operator sub-types\n\
    \n*   Operator precedence\n\n# [Objectives](#toc.xhtml_s67a)\n\n*   Understand\
    \ what operators are\n\n*   Know what arithmetic operators there are\n\n*   Learn\
    \ about comparison operators\n\n*   Understand logical operators\n\n*   Understand\
    \ assignment operators\n\n*   Compare the different operator sub-types\n\n*  \
    \ Learn about operator precedence\n\n# [What are operators?](#toc.xhtml_s68a)\n\
    \nOperators can be explained as constructs which behave almost like functions\
    \ but differ semantically or syntactically from ordinary functions. There are\
    \ many types of operators, or even, categories and they will be cover shortly.\
    \ There are comparison, arithmetic, and logical operators.\n\nSome common operators\
    \ include the following:\n\n| **Operator type/category** | **Operator(s)** |\n\
    \n| Arithmetic | `+ - * / %` |\n\n| Comparison | `><>= <= == ===` |\n\n| Logical\
    \ | `&& &#124;&#124;` |\n\n| Assignment | `=` |\n\n**Table 4.1:** General operators\n\
    \n# [Major operators](#toc.xhtml_s69a)\n\nMajor operators can be classified as\
    \ any operator category that achieves a similar goal. Major operators would include\
    \ arithmetic, assignment, comparison, logical, and type operators. I will highlight\
    \ each major type one by one in the next few tables and headings.\n\n# [Arithmetic\
    \ operators](#toc.xhtml_s70a)\n\nArithmetic operators are mostly used to perform\
    \ arithmetic on numbers. The available arithmetic operators in JavaScript are\
    \ shown in *[Table 4.2](#c04.xhtml_tab4_2)*:\n\n| **Operator type** | **Operator**\
    \ | **Description** |\n\n| Arithmetic | `+` | Addition |\n\n|  | `-` | Subtraction\
    \ |\n\n|  | `*` | Multiplication |\n\n|  | `**` | Exponentiation |\n\n|  | `/`\
    \ | Division |\n\n|  | `%` | Modulus (remainder division) |\n\n|  | `++` | Increment\
    \ |\n\n|  | `--` | Decrement |\n\n**Table 4.2:** Arithmetic operators\n\n# [Comparison\
    \ operators](#toc.xhtml_s71a)\n\nComparison operators are used to determine equality\
    \ or difference between values:\n\n| **Operator type** | **Operator** | **Description**\
    \ |\n\n| Comparison | `==` | Equal to |\n\n|  | `===` | Equal value and equal\
    \ type |\n\n|  | `!=` | Not equal |\n\n|  | `!==` | Not equal value or not equal\
    \ type |\n\n|  | `>` | Greater than |\n\n|  | `<` | Less than |\n\n|  | `>=` |\
    \ Greater than or equal to |\n\n|  | `<=` | Less than or equal to |\n\n|  | `?`\
    \ | Ternary operator |\n\n**Table 4.3:** Conditional operators\n\n# [Logical operators](#toc.xhtml_s72a)\n\
    \nLogical operators are used to determine the logic between values. The available\
    \ logical operators in JavaScript are shown in *[Table 4.4](#c04.xhtml_tab4_4)*:\n\
    \n| **Operator type** | **Operator** | **Description** |\n\n| Logical | `&&` |\
    \ Logical and |\n\n|  | `&#124;&#124;` | Logical or |\n\n|  | `!` | Logical not\
    \ |\n\n**Table 4.4:** Logical operators\n\n# [Assignment operators](#toc.xhtml_s73a)\n\
    \nAssignment operators assign values to variables. The available assignment operators\
    \ in JavaScript are shown in *[Table 4.5](#c04.xhtml_tab4_5)*:\n\n| **Operator**\
    \ | **Example** | **Equivalent** |\n\n| `=` | `a = b` | a = b |\n\n| `+=` | `a\
    \ += b` | a = a + b |\n\n| `-=` | `a -= b` | a = a – b |\n\n| `*=` | `a *= b`\
    \ | a = a * b |\n\n| `/=` | `a /= b` | a = a / b |\n\n| `%=` | `a %= b` | a =\
    \ a % b |\n\n| `**=` | `a **= b` | a = a ** b |\n\n**Table 4.5:** Assignment operators\n\
    \n# [Operator sub-types](#toc.xhtml_s74a)\n\nApart from having different functions\
    \ as operators, there are different ways to formulate a statement with various\
    \ operators. In most cases, you will need two operands (what operators are applied\
    \ to) and an operator. Sometimes you may need three operands and two operators.\
    \ The operator sub-types as I’d like to call them are listed below:\n\n*   Unary\n\
    \n*   Binary\n\n*   Ternary\n\nLet’s explore them.\n\n# [Unary operators](#toc.xhtml_s75a)\n\
    \nWhen an operator is unary, it means that the operator only has a single operand.\
    \ The following sample shows some unary operators in action:\n\n1.  Open a text\
    \ editor of your choice and enter the following HTML and JavaScript code\n\n \
    \   `<html>`\n\n    `<body>`\n\n    `<h1>Unary Operators</h1>`\n\n    `<p>The\
    \ following code demonstrates Unary operations on operands</p>`\n\n    `<script>`\n\
    \n    `let a = 1;`\n\n    `let b = 1;`\n\n    `let c = 5;`\n\n    `let d = 5;`\n\
    \n    `a = -a;`\n\n    `alert( a ); // -1, unary negation was applied`\n\n   \
    \ `b = +b;`\n\n    `alert( b ); // +1, unary addition was applied`\n\n    `c++;`\n\
    \n    `alert( c ); // 6, increment was applied`\n\n    `d--;`\n\n    `alert( d\
    \ ); // 4, decrement was applied`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\
    \n2.  Save the file with an HTML extension, for example `Chapter 4.1.html`."
