    \n# [The object data type](#toc.xhtml_s25a)\n\nObjects are variables too, but\
    \ unlike with primitives, objects can store more than one value in it. Objects\
    \ store keyed collections of data and complex entities. The information inside\
    \ an object is stored as key-value pairs. The key is usually the property name.\
    \ The value is the property’s value, for example:\n\n`var objStudent = {`\n\n\
    `Name:”Ockert”,`\n\n`Course:”JavaScript”,`\n\n`Year: 2019`\n\n`};`\n\nIn the above\
    \ code segment, a new JavaScript object called `objStudent` is created. `objStudent`\
    \ contains three properties, namely: `Name`, `Course`, and `Year`.\n\n# [Creating\
    \ objects](#toc.xhtml_s26a)\n\nNow that we know a bit more about objects let’s\
    \ have a look at how to create them. Objects can be created using any of the following\
    \ ways:\n\n*   Object literal syntax\n\n*   The `new` keyword\n\n*   `Object.create()`\n\
    \n*   `Object.assign()`\n\n*   ES6 classes\n\nLet me explain them one by one.\n\
    \n# [Object literal syntax](#toc.xhtml_s27a)\n\nThis method is quite easy to understand\
    \ and quick to do. Here is an example:\n\n`var objCar = {`\n\n`make: “BMW”,`\n\
    \n`model: “i8 Roadster”,`\n\n`price: 2329300`\n\n`};`\n\nThis example may look\
    \ almost familiar. If you look closely at the previous code segment in the Object\
    \ data type section, you will notice that both code examples have the same similarities.\
    \ The keyword `var` creates the object. The curly braces contain the properties\
    \ and values separated with a colon, and each property is separated with a comma.\n\
    \nThe object created now is named `objCar`. It contains the properties `make`,\
    \ `model`, and `price`. To make use of the `objCar` object, you can have a statement\
    \ like:\n\n`console.log(objCar); //Outputs {make: “BMW”, model: “i8 Roadster”,\
    \ price: “2329300”}`\n\n`console.log(objCar.make); //Outputs BMW`\n\n`console.log(objCar.model);\
    \ //Outputs i8 Roadster`\n\n`console.log(objCar.price); //Outputs 2329300`\n\n\
    Let’s put it all together in a small exercise:\n\n1.  Open a text editor of your\
    \ choice and enter the following HTML and JavaScript code:\n\n    `<!DOCTYPE html>`\n\
    \n    `<html>`\n\n    `<body>`\n\n    `<h1>Object literal syntax</h1>`\n\n   \
    \ `<p>The following code creates a JavaScript object and displays its results\
    \ in the console window of the browser</p>`\n\n    `<script>`\n\n    `var objCar\
    \ = {`\n\n    `make : “BMW”,`\n\n    `model : “i8 Roadster”,`\n\n    `price :\
    \ 2329300 };`\n\n    `console.log(objCar); //Outputs {make: “BMW”, model: “i8\
    \ Roadster”, price: “2329300”}`\n\n    `console.log(objCar.make); //Outputs BMW`\n\
    \n    `console.log(objCar.model); //Outputs i8 Roadster`\n\n    `console.log(objCar.price);\
    \ //Outputs 2329300`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n\
    2.  Save the file with an HTML extension, for example,`Chapter 2.1.html`.\n\n\
    3.  Double-click the file to open it in the default browser. If the browser is\
    \ Google Chrome, press *Ctrl* + *Shift* + *J* to open the console window.\n\n\
    Your Google Chrome Console window should resemble *[Figure 2.1](#c02.xhtml_fig2_1)*\
    \ below:\n\n![](images/Img_02_01.jpg)\n\n**Figure 2.1:** objCar property values\n\
    \n# The ‘new’ keyword\n\nUsing the `new` keyword to create objects resembles the\
    \ way objects are created in class-based programming languages, like C# or Java.\
    \ There are 2 ways to use the `new` keyword to create objects, they are:\n\n*\
    \   Using `new` with in-built object constructor functions\n\n*   Using `new`\
    \ with user defined constructor functions\n\nLet’s explore the differences.\n\n\
    # [Using ‘new’ with in-built object constructor functions](#toc.xhtml_s28a)\n\n\
    A constructor, in class-based **object-oriented programming** (**OOP**), is a\
    \ special type of subroutine called to *create an object*. A constructor prepares\
    \ the new object for use by initializing the object’s members. To create a new\
    \ object, you must use the `new` keyword with the `Object()` constructor, like\
    \ this:\n\n`var house = new Object();`\n\nThis creates and initializes a new object\
    \ named `house`. We can add properties to this object by using code like the following:\n\
    \n`house.bedrooms = 4;`\n\n`house.bathrooms = 2;`\n\n`house.garages = 2;`\n\n\
    `house.hasSwimmingPool = false;`\n\n`house.hasOutsideWalls = true;`\n\nAs you\
    \ can see, creating properties for an object, which was created using the `Object()`\
    \ constructor, can become quite a tedious task, and involves a lot of typing.\
    \ The `house` object we created above has a bedrooms property, `bathrooms`, `garages`,\
    \ as well as Boolean properties indicating the presence of a swimming pool, or\
    \ outside walls.\n\nWhat if we had to create hundreds of `house` objects? Let’s\
    \ see how we can make this code a bit shorter, by using a user defined constructor\
    \ function.\n\n# [Using ‘new’ with user defined constructor functions](#toc.xhtml_s29a)\n\
    \nWhen creating a user-defined constructor function, you basically create a template\
    \ for the object’s properties and methods. You create the function once, and just\
    \ feed the necessary properties to it, instead of manually entering each property\
    \ and each setting as shown earlier in the Using `new` with in-built object constructor\
    \ functions section.\n\nLet’s create the user defined constructor using the `house`\
    \ object as an example again:\n\n`function House(_bed, _bath, _garage, _pool,\
    \ _walls) {`\n\n`this.bedRooms = _bed;`\n\n`this.bathRooms = _bath;`\n\n`this.garages\
    \ = _garage;`\n\n`this.hasSwimmingPool = _pool;`\n\n`this.hasOutsideWalls = _walls;`\n\
    \n`}`\n\nThe name of the constructor function is `House`. Inside the brackets,\
    \ there are five parameters: (`_bed`, `_bath`, `_garage`, `_pool`, and `_walls`.\
    \ These will be used to pass information to the `House` function. Inside the constructor\
    \ function, each property gets set to its own parameter. Remember, this is simply\
    \ a template, there are no values yet.\n\nNow that we have the constructor function,\
    \ it is easy to create objects based on it. Here is how to:\n\n`var houseOne =\
    \ new House(4, 2, 2, false, true);`\n\n`var houseTwo = new House(3, 1, 1, true,\
    \ false);`\n\nThe `houseOne`object above is a new `House` object. It has 4 bedrooms,\
    \ 2 bathrooms, 2 garages, no swimming pool and it has outside walls. `houseTwo`,\
    \ in contrast, has 3 bedrooms, 1 bathroom, 1 garage, a swimming pool and it doesn’t\
    \ have outside walls.\n\nLet’s put it all together in a small exercise:\n\n1.\
    \  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<!DOCTYPE html>`\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>new\
    \ Keyword</h1>`\n\n    `<p>The following code creates a JavaScript object and\
    \ displays its results in the console window of the browser</p>`\n\n    `<script>`\n\
    \n    `function House(_bed, _bath, _garage, _pool, _walls) {`\n\n    `this.bedRooms\
    \ = _bed;`\n\n    `this.bathRooms = _bath;`"
