    The first part of this exercise demonstrated the jQuery way of doing things; now,
    let’s do the same in pure JavaScript.


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <html>

    <body>

    <h1>jQuery versus JavaScript 2</h1>

    <p>jQuery versus JavaScript 2</p>

    <input id=”button1” type=”button”value=”click Me!”/>

    <script>

    document.getElementById(“button1”).addEventListener(‘click’, function(){

    alert(“BpB”);

    });

    </script>

    </body>

    </html>

    ```


    2. Save the file with an HTML extension, for example `Chapter 19.2.html`.


    3. Double-click the file to open it in the default browser.Both the above exercises
    do the same thing. The first one is done in jQuery, and the second one is done
    with JavaScript. By opening either one of the above exercises, you will see a
    screen similar to [Figure 19.1](#c19.xhtml_fig19_1) underneath:


    ![](images/Img_19_01.jpg)


    **Figure 19.1:** jQuery versus JavaScript


    Let’s have a look at the code. Considering that this is just a small example demonstrating
    the differences between JavaScript and jQuery, both exercises have relatively
    little code. Let me explain the crux.


    In the previous first program, you wrote the following:


    ```html

    <head>

    <script src= “https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js”>

    </script>

    </head>

    ```


    This code imports a jQuery library into your page. Because you put it into the
    head section of your HTML document, it is part of the complete page, and the methods
    inside the library get loaded before anything else. In JavaScript, you do not
    need to include a special library to do the task at hand (in this example).


    You then created a normal input button and did the following:


    ```javascript

    <script>

    $(‘#button1’).click(function() {

    alert(“BpB”);

    });

    </script>

    ```


    This attaches a click event handler to the button which shows an alert box with
    the text `BpB`. Very simple and very streamlined.


    In the previous second program, you didn’t have to import a library. You also
    created a button input and did the following:


    ```javascript

    <script>

    document.getElementById(“button1”).addEventListener(‘click’, function(){

    alert(“BpB”);

    });

    </script>

    ```


    You first had to get the object named `button1` through the `getElementById` method.
    After that, you had to manually attach an event handler to the button by adding
    a listener which listens for events. This also then shows an alert box with the
    text `BpB`


    # [JSON and JavaScript](#toc.xhtml_s288a)


    **JSON** stands for **JavaScript Object Notation**. It is not actually a different
    programming language at all, but many a newbie confuse JSON and JavaScript. JSON
    is a lightweight format for storing and transporting data. It is self-describing
    and is used mostly to send data from a server to a web page.


    If you look at the name, you will see JavaScript Object Notation, now what is
    the real difference between JavaScript objects and JSON? Let me answer it.


    JavaScript objects were covered in depth in [Chapter 2: JavaScript Objects](#c02.xhtml),
    but here are a few highlights.


    # [JavaScript objects](#toc.xhtml_s289a)


    An object is something that has properties and methods. Properties describe an
    object. Methods are the actions which that object can take. Basically, everything
    can be an object in JavaScript. All JavaScript values, except primitives, are
    objects. Before we go into detail about Built-in objects, let’s explore primitives
    quickly.


    # [The Object data type](#toc.xhtml_s290a)


    Objects are variables too, but unlike with primitives, objects can store more
    than one value in it. Objects store keyed collections of data and complex entities.
    The information inside an object is stored as key-value pairs. The key is usually
    the property name. The value is the property’s value, for example:


    ```javascript

    var objStudent = {

    Name : “Ockert”,

    Course : “JavaScript”,

    Year : 2019

    };

    ```


    In the above code segment, a new JavaScript object called `objStudent` is created.
    `objStudent` contains three properties, namely: `Name`, `Course`, and `Year`.


    # [Creating JavaScript objects](#toc.xhtml_s291a)


    Now that we know a bit more about objects let’s have a look at how to create them.
    Objects can be created using any of the following ways:


    *   Object literal syntax

    *   The `new` keyword

    *   `Object.create()`

    *   `Object.assign()`

    *   ES6 classes


    Let me explain them one by one.


    # [Object literal syntax](#toc.xhtml_s292a)


    This method is quite easy to understand and quick to do. Here is an example:


    ```javascript

    var objCar = {

    make : “BMW”,

    model : “i8 Roadster”,

    price : 2329300

    };

    ```


    This example may look almost familiar. If you look closely at the previous code
    segment in the Object data type section, you will notice that both code examples
    have the same similarities. The keyword `var` creates the object. The curly braces
    contain the properties and values separated with a colon, and each property is
    separated with a comma.


    The object created now is named `objCar`. It contains the properties make, model
    and price. To make use of the `objCar` object, you can have a statement like:


    ```javascript

    console.log(objCar); //Outputs {make: “BMW”, model: “i8 Roadster”, price: “2329300”}

    console.log(objCar.make); //Outputs BMW

    console.log(objCar.model); //Outputs i8 Roadster

    console.log(objCar.price); //Outputs 2329300

    ```


    # [The ‘new’ keyword](#toc.xhtml_s293a)


    Using the `new` keyword to create objects resembles the way objects are created
    in class-based programming languages, like C# or Java. There are 2 ways to use
    the `new` keyword to create objects; they are:


    *   **Using ‘new’ with in-built Object constructor functions**: A constructor,
    in class-based object-oriented programming, is a special type of subroutine called
    to create an object. A constructor prepares the new object for use by initializing
    the object’s members. To create a new object, you must use the `new` keyword with
    the `Object()` constructor, like this:


    ```javascript

    var house = new Object();

    ```


    This creates and initializes a new object named `house`. We can add properties
    to this object by using code like the following:


    ```javascript

    house.bedrooms = 4;

    house.bathrooms = 2;

    house.garages = 2;

    house.hasSwimmingPool = false;

    house.hasOutsideWalls = true;

    ```


    As you can see, creating properties for an object, which was created using the
    `Object()` constructor, can become quite a tedious task, and involves a lot of
    typing. The house object we created above has a bedrooms property, bathrooms,
    garages, as well as Boolean properties indicating the presence of a swimming pool,
    or outside walls.


    What if we had to create hundreds of house objects? Let’s see how we can make
    this code a bit shorter by using a user-defined constructor function.


    *   **Using ‘new’ with user-defined constructor functions**: When creating a user-defined
    constructor function, you basically create a template for the object’s properties
    and methods. You create the function once, and just feed the necessary properties
    to it, instead of manually entering each property and each setting as shown earlier
    in the Using `new` with in-built Object constructor functions section.


    Let’s create the user-defined constructor using the house object as an example
    again:


    ```javascript

    function House(_bed, _bath, _garage, _pool, _walls) {

    this.bedRooms = _bed;

    this.bathRooms = _bath;

    this.garages = _garage;

    this.hasSwimmingPool = _pool;

    this.hasOutsideWalls = _walls;

    }

    ```

