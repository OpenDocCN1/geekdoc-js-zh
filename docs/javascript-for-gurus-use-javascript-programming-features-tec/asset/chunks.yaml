    \n**Figure 8.2:** defineProperty error\n\nNow that we have a proper understanding\
    \ of properties, let’s move on to creating getters and setters for our properties.\n\
    \n# [Getters and setters](#toc.xhtml_s124a)\n\nSo far, in this book, I have mostly\
    \ dealt with data properties. There is another type of property called an accessor\
    \ property. This means that these types of properties are actually functions that\
    \ can get and set values but are seen as regular properties from the outside.\n\
    \nAccessor properties contain *getter* and *setter* methods, as shown next:\n\n\
    `let object = {`\n\n`get propertyName() {`\n\n`//Code executed on getting object.propertyName`\n\
    \n`},`\n\n`set propertyName(value) {`\n\n`// Code executed on setting object.propertyName\
    \ = value`\n\n`}`\n\n`};`\n\nIn the object declaration above, you will notice\
    \ a `get` and a `set`. Get will execute when the object’s property is requested.\
    \ For example: `c = Object.Color`. The get function will return the value of the\
    \ object’s `Color` property to the variable named `c`.\n\nSet is used to give\
    \ a property value. For example: `Object.Color = Red`. The `Color` property will\
    \ be set to `Red` via the use of the setter.\n\nLet’s do a small exercise so that\
    \ you can see how easy it is to make use of getters and setters.\n\n1.  Open a\
    \ text editor of your choice and enter the following HTML and JavaScript code:\n\
    \n    `<html>`\n\n    `<body>`\n\n    `<h1>Property Getters and Setters example</h1>`\n\
    \n    `<p>Property Getters and Setters example</p>`\n\n    `<script>`\n\n    `let\
    \ Student = {`\n\n    `studentName: “Ockert”,`\n\n    `studentSurname: “du Preez”,`\n\
    \n    `get studentFullName() {`\n\n    `return ‘${this.studentName} ${this.studentSurname}’;`\n\
    \n    `},`\n\n    `set studentFullName(value) {`\n\n    `[this.studentName, this.studentSurname]\
    \ = value.split(“ “);`\n\n    `}`\n\n    `};`\n\n    `Student.studentFullName\
    \ = “BpB Publications”;`\n\n    `alert(Student.studentName); //BPB`\n\n    `alert(Student.studentFullName);\
    \ //BpB Publications`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n\
    2.  Save the file with an HTML extension, for example `Chapter 8.3.html`.\n\n\
    3.  Double-click the file to open it in the default browser.\n\nWith the use of\
    \ the setter, you set the `studentFullName` property to `BPB Publications`. If\
    \ there was no property setter but a property letter, then you might have gotten\
    \ an error. With the use of the property getter, you got access to the property’s\
    \ current value. When opened, two alertboxes will be displayed. One showing `BpB`,\
    \ and the next showing `BPB Publications`.\n\n*[Figure 8.3](#c08.xhtml_fig8_3)*\
    \ shows a combination of the given alertboxes based on the above example:\n\n\
    ![](images/Img_08_03.jpg)\n\n**Figure 8.3:** Getter and setter properties\n\n\
    Just as with property flags, explained earlier in this chapter, there are descriptors\
    \ for accessors. Let’s have a look at them.\n\nAccessor descriptors differ slightly\
    \ from descriptors those for data properties. Accessor properties have no writable\
    \ descriptor but include get and set functions. Accessor descriptors have the\
    \ following:\n\n*   **get**: Works when a property is read.\n\n*   **set**: Called\
    \ when the property is set.\n\n*   **enumerable**: Can the property be listed\
    \ in loops?\n\n*   **configurable**: Allows property deletion, or property attributes\
    \ to be modified.\n\nLet’s do a small exercise so that you can see how easy it\
    \ is to make use of getters and setters.\n\n1.  Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code\n\n    `<html>`\n\n    `<body>`\n\
    \n    `<h1>Accessor Descriptors example</h1>`\n\n    `<p>Accessor Descriptors\
    \ example</p>`\n\n    `<script>`\n\n    `let Student = {`\n\n    `studentName:\
    \ “Ockert”,`\n\n    `studentSurname: “du Preez”,`\n\n    `};`\n\n    `Object.defineProperty(Student,\
    \ ‘studentFullName’, {`\n\n    `get() {`\n\n    `return ‘${this.` `studentName}\
    \ ${this.` `studentSurname}’;`\n\n    `},`\n\n    `set(value) {`\n\n    `[this.`\
    \ `studentName, this.` `studentSurname] = value.split(“ “);`\n\n    `}`\n\n  \
    \  `});`\n\n    `alert(Student.studentFullName); //Ockert du Preez`\n\n    `</script>`\n\
    \n    `</body>`\n\n    `</html>`\n\n2.  Save the file with an HTML extension,\
    \ for example `Chapter 8.4.html`.\n\n3.  Double-click the file to open it in the\
    \ default browser/\n\nIn the above exercise, I have made use of the `defineProperty`\
    \ method of `Object`. I included it get and set methods, and there you go, another\
    \ property added.\n\n# [Adding tricks to getters and setters](#toc.xhtml_s125a)\n\
    \nBy tricks I mean include logic to see if a supplied value is of the correct\
    \ type or the value is in the correct range. We can include logic to check the\
    \ length of strings or check a certain integer’s value. By adding logic to getters\
    \ and setters, we basically create a wrapper over real property values.\n\nLet’s\
    \ quickly do an example.\n\n1.  Open a text editor of your choice and enter the\
    \ following HTML and JavaScript code\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>\
    \ Age Wrapper example</h1>`\n\n    `<p> Age Wrapper example</p>`\n\n    `<script>`\n\
    \n    `let Student = {`\n\n    `studentName: “Ockert”,`\n\n    `studentSurname:\
    \ “du Preez”,`\n\n    `get studentAge() {`\n\n    `return this._age;`\n\n    `},`\n\
    \n    `set studentAge(value) {`\n\n    `if (value < 18) {`\n\n    `alert(“Student\
    \ must have parent’s consent to enrol.”);`\n\n    `return;`\n\n    `}`\n\n   \
    \ `this._age = value;`\n\n    `}`\n\n    `};`\n\n    `Student.studentAge = 17;`\n\
    \n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file with\
    \ an HTML extension, for example `Chapter 8.5.html`.\n\n3.  Double-click the file\
    \ to open it in the default browser.\n\nI have created a getter and setter to\
    \ store the `Student` object’s `age` and to retrieve it. You will notice that\
    \ I have included an `if` check inside the setter to ensure that the student’s\
    \ `age` is higher than or equal to 18\\. When you set the `studentAge` property\
    \ to a value less than `18`, an alert box displays stating that the student needs\
    \ the parent’s consent in order to enroll for a course.\n\n*[Figure 8.4](#c08.xhtml_fig8_4)*\
    \ below shows the resulting alert box:\n\n![](images/Img_08_04.jpg)\n\n**Figure\
    \ 8.4:** Age test inside property setter\n\nIf however the correct input is supplied\
    \ to the `studentAge` property, in this case, age above 17, there will be no alert\
    \ box as the value is acceptable.\n\n# [Conclusion](#toc.xhtml_s126a)\n\nIn this\
    \ chapter, we learntexplained JavaScript properties. Knowing how to create properties\
    \ is crucial in building proper apps in JavaScript. You have learned how to create\
    \ properties and the different types of properties you get. You have then learned\
    \ how to create flags and descriptors for your properties. Lastly, you have created\
    \ a complex property that checks for valid input.\n\nIn the next chapter, we willdive\
    \ into JavaScript promises. You will learn what promises are, how to chain them\
    \ and get a bit complicated with the Promise methods, asynchronous and synchronous\
    \ calls and microtasks.\n\n# [Questions](#toc.xhtml_s127a)\n\n1.  Explain the\
    \ term property.\n\n2.  What is the difference between accessor properties and\
    \ object properties?\n\n3.  What is the purpose of getters and setters?\n\n4.\
    \  Explain property attributes.\n\n5.  Give an example of how you would create\
    \ a property that can produce an error when a wrong value is supplied to it.\n\
    \n# [CHAPTER 9](#toc.xhtml_c09)\n\n# [JavaScript Promises](#toc.xhtml_c09)\n\n\
    # [Introduction](#toc.xhtml_s128a)"
