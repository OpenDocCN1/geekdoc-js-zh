  trans: "\n\n| 模式 | 描述 |\n| --- | --- |\n| `\\n` | 匹配换行符 |\n| `\\r` | 匹配回车符 |\n|\
    \ `\\s` | 匹配空白字符 |\n| `\\S` | 匹配非空白字符的字符 |\n| `\\t` | 匹配制表符 |\n| `\\v` | 匹配垂直制表符\
    \ |\n| `\\w` | 匹配任何字母数字字符 |\n| `\\W` | 匹配任何非单词字符 |\n| `\\0` | 匹配 NULL 字符 |\n|\
    \ `\\xhh` | 匹配代码为 `hh` 的字符（两个十六进制数字） |\n| `\\uhhhh` | 匹配代码为 `hhhh` 的字符（四个十六进制数字）\
    \ |\n\n表 17.2: 特殊字符模式\n\n让我们来做个快速练习吧！\n\n1. 打开你任选的文本编辑器，并输入以下 HTML 和 JavaScript\
    \ 代码：\n\n```html\n<html><body><h1>RegEx Example 2</h1><p>RegEx Example 2</p><script>\n\
    var Num = /^\\d{10}$/;\nconsole.log(Num.test‘7795483645’));\nvar Dt = /^(\\d{1,2}-){2}\\\
    d{2}(\\d{2})?$/;\nconsole.log(Dt.test‘01-01-1990’));\nconsole.log(Dt.test‘01-01-90’));\n\
    var Txt = /^(.{3}\\.){3}.{3}$/;\nconsole.log(Txt.test‘abc.def.123.456’));\nconsole.log(Txt.test‘abc.def.ghi.jkl’));\n\
    </script></body></html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 17.2.html`。\n3.\
    \ 双击该文件在默认浏览器中打开。\n4. 在 Google Chrome 中按 `Ctrl` + `Shift` + `F12` 打开控制台窗口。\n\n\
    这看起来非常复杂！其实其实不是。让我来拆解一下。\n\n* 变量 `Num` 包含一个正则表达式模式。\n    * 在此模式中，你通过在开头包含 `^`\
    \ 在字符串结尾包含 `$` 来确保匹配跨越整个字符串。\n    * 表达式中的 `\\d` 匹配数字。\n    * `{10}` 精确匹配前一个表达式\
    \ 10 次。\n* 变量 `Dt` 也以 `^` 开头并以 `$` 结尾，以便查看整个字符串。\n    * 第一个左括号开始第一个子表达式。\n   \
    \ * `\\d{1,2}` 匹配 1 个数字，但最多可以有 2 个数字。\n    * 匹配一个连字符 `-`。\n    * 右括号结束第一个子表达式。\n\
    \    * `{2}` 将第一个子表达式匹配 2 次。\n* 变量 `Txt` 仅允许由四个三字母组组成的字符串输入，每组之间由点隔开。\n\n在每个表达式中，都使用了\
    \ `test` 方法。该方法将返回 `true` 或 `false`，取决于表达式是否匹配成功。\n\n结果如如下截图所示：\n\n![](img/Img_17_02.jpg)\n\
    \n图 17.2: 运行中的正则表达式\n\n所有测试均成功。\n\n让我们再做另一个练习，确保你理解了这些概念。\n\n1. 打开你任选的文本编辑器，并输入以下\
    \ HTML 和 JavaScript 代码：\n\n```html\n<html><body><h1>RegEx Example 3</h1><p>RegEx\
    \ Example 3</p><script>\nvar regex1 = /lo{2}t/;\nconsole.log(regex1.test‘loot’));\n\
    console.log(regex1.test‘lot’));\nvar regex2 = /[hm]ail/;\nconsole.log(regex2.test‘hail’));\n\
    console.log(regex2.test‘mail’));\nconsole.log(regex2.test‘nail’));\nvar regex3\
    \ = /\\d+/;\nconsole.log(regex3.test‘7’));\nconsole.log(regex3.test‘77845’));\n\
    console.log(regex3.test‘77777723’));\nvar regex4 = /(green|red) apple/;\nconsole.log(regex4.test‘green\
    \ apple’));\nconsole.log(regex4.test‘red apple’));\nconsole.log(regex4.test‘orange\
    \ apple’));\n</script></body></html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 17.3.html`。\n\
    3. 双击该文件在默认浏览器中打开。\n4. 在 Google Chrome 中按 `Ctrl` + `Shift`+ `J` 或 `F12` 打开控制台窗口。\n\
    \n[图 17.3] 显示了测试结果：\n\n![](img/Img_17_03.jpg)\n\n图 17.3: 更多的正则表达式测试\n\n让我们来看看这里测试了什么。第一个对象\
    \ `regex1` 测试了两个单词：`loot` 和 `lot`。`loot` 成功了，但 `lot` 没有。为什么？因为你指定了在结尾的 `t` 之前需要\
    \ 2 个字符。\n\n对象 `regex2` 在测试 `hail` 和 `mail` 时成功，但测试 `nail` 时失败。这是因为正则表达式模式中没有指定字符\
    \ `n`。它只指定了 `h` 和 `m`。\n\n`regex3` 的所有测试都成功，因为它们都包含至少一个数字。\n\n`regex4` 测试 `green\
    \ apple` 或 `red apple`。当提供文本 `orange apple` 时，它失败了。\n\n# 结论\n\n在本章中，我们学习了什么是正则表达式，以及在搜索文本或验证文本时如何有效地使用它们。这是一项重要的技能，但幸运的是，一旦你掌握了修饰符和模式，它并不复杂。\n\
    \n下一章是*高级概念* 部分的最后一章。你将再次回顾函数，然后深入研究柯里化（currying）和偏函数（partials）。\n\n# 问题\n\n1.\
    \ 定义正则表达式术语。\n2. 写出构造正则表达式的两种方法。\n3. 写出三个正则表达式标志。\n\n# 第 18 章\n\n# 偏函数与柯里化\n\n\
    # 引言\n\nJavaScript 函数可以变得更加简单，并在需要时自定义以使用特定参数。\n\n在本节中，你将学习普通 JavaScript 函数、偏函数和柯里化之间的区别。\n\
    \n# 结构\n\n* 偏函数\n* 柯里化\n\n# 目标\n\n* 理解偏函数应用函数式编程概念。\n* 理解柯里化函数式编程概念。\n\n# 偏函数\n\
    \n偏函数或偏应用在不真正完全求值函数的情况下，固定函数的几个参数的值。这会产生另一个参数较少的函数，随着函数链的进行，将值绑定到一个或多个参数上。\n\n\
    JavaScript 包含一个名为 `bind` 的内置方法，它可以作用于任意数量参数的函数并绑定任意数量参数。\n\n要调用 `bind` 方法，请使用以下语法：\n\
    \n`function.prototype.bind(thisValue, [argument1], [argument2], …)`\n\n`bind`\
    \ 方法将函数转换为新函数，其隐式的 `this` 参数为该值，且初始参数始终如给定的那样。\n\n为了更好地理解偏函数的概念，让我们做一个实际练习，并像往常逐个拆解它。\n\
    \n1. 打开你任选的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html><body><h1>Partials\
    \ Example</h1><p>Partials Example</p><script>\nfunction add (x, y) {\nreturn x\
    \ + y;\n}\nfunction double (num) {\nreturn add(2, num);\n}\nfunction addAgain\
    \ (x, y) {\nreturn x + y;\n}\nvar doubleAgain = addAgain.bind(null, 2);\nconsole.log(double);\n\
    console.log(doubleAgain);\n</script></body></html>\n```\n\n2. 以 HTML 扩展名保存文件，例如\
    \ `Chapter 18.1.html`。\n3. 双击该文件在默认浏览器中打开。\n4. 如果浏览器是 Google Chrome，按 `Ctrl` +\
    \ `Shift` + `J` 打开控制台窗口。\n\n上述代码的输出如下所示所示：\n\n![](img/Img_18_01.jpg)\n\n图 18.1:\
    \ 偏函数绑定示例\n\n函数 `add` 是 JavaScript 中调用和使用函数的普通方式。函数 `addAgain` 展示了绑定的实际应用。你可以看到，并不是所有的参数都提供了值，但\
    \ JavaScript 编译器完全没有抱怨。\n\n让我们做一个更复杂的例子。\n\n1. 打开你任选的文本编辑器，并输入以下 HTML 和 JavaScript\
    \ 代码：\n\n"
