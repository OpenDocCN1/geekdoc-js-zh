    首先，我要感谢上帝给我写这本书的勇气。我要感谢 BPB Publications 的所有人，给了我这个编写和出版这本书的机会。


    感谢我的妻子和女儿一直对我的信任。


    最后，我要感谢我的批评者。没有他们的批评，我永远无法写出这本书。


    # 前言


    从头到尾，本书将涵盖 JavaScript 语言的所有复杂细节！你将获得所有 `Statements`（语句）、`Functions`（函数）和 `Operators`（运算符）的概述。然后你将学习有趣的内容，包括：`Classes`（类）、`Prototypes`（原型）、`Promises`（承诺）和
    `Generators`（生成器）。你将学习数组以及如何让脚本实现逻辑。最后，你将学习如何将 JavaScript 与其他语言结合。


    **第 1 章** 详细介绍了 JavaScript 的历史，并解释了它在编程语言世界中的作用。


    **第 2 章** 教你 JavaScript 对象。你将学习它们是什么、如何正确使用它们以及如何处理它们。


    **第 3 章** 展示了如何为现实场景编写良好的 JavaScript 语句。还将深入探讨 JavaScript 关键字。


    **第 4 章** 详细解释 JavaScript 运算符。


    **第 5 章** 探索 JavaScript 函数的奥秘。


    **第 6 章** 展示了如何创建 JavaScript 类以获得更好的代码！


    **第 7 章** 详细解释了原型以及我们为什么需要它们。


    **第 8 章** 指导你如何正确创建属性。


    **第 9 章** 教你关于编写 Promise 的复杂性。


    **第 10 章** 介绍了 JavaScript 生成器和迭代器。


    **第 11 章** 解释了模块是什么以及它们如何影响你代码的清晰度。


    **第 12 章** 教你如何正确使用变量。


    **第 13 章** 教你如何为任何应用引入逻辑。


    **第 14 章** 展示了如何使用 `of`。


    **第 15 章** 解释什么是数组。


    **第 16 章** 展示了如何搜索或替换文本。


    **第 17 章** 展示了柯里化（Currying）与偏函数（Partials）之间的区别。


    **第 18 章** 展示了它如何与其他语言一起工作。


    **第 19 章** 展示了什么是 JavaScript。


