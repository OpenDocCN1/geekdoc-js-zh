    JavaScript 语句应该以分号（`;`）结束。你也可以在一行中包含多个语句，只要它们之间用分号隔开，如下例所示：


    ```

    objWidth = 50; objHeight = 100; var size = objWidth * objHeight;

    ```


    通过用分号隔开，三个语句被合并了一行。


    # JavaScript 代码块


    代码块将语句组合在一起。因为语句被分组在代码块内部，它们会被一起执行。在代码块中组合语句的常用方法是使用函数。JavaScript 函数的格式如下：


    ```javascript

    function functionName() {

    //statement_1;

    //statement_2;

    //statement_3;

    }

    ```


    函数以关键字 `function` 开始。左括号和右括号允许你为函数输入参数。代码块存在于函数的左右大括号之间。在 *第 5 章：JavaScript 函数*
    中，我们将更深入地探讨函数。


    单独的代码块也可以出现在另一个代码块（如函数）内部。例如，一个函数可以包含分组的语句，如 `while` 循环、`for` 循环或 `if` 语句。这里是对每种语句的简短说明和示例。


    # 语句分组


    JavaScript 中的语句分组包括循环和条件测试。JavaScript 中的循环是一段重复执行的代码块，直到某个条件变为真。条件是用于进行测试的事物，例如：如果某个值小于
    100，则应该发生某些事情。条件语句是判断特定条件为真还是为假的语句，例如：是否输入了名称。


    接下来的几个代码块将演示各种循环和条件测试。


    # while 循环


    `while` 循环只要指定的条件存在，就会循环执行代码块。让我们来看一个示例：


    ```javascript

    var counter = 0;

    while (counter <= 100)

    {

    document.write(counter + “<br>);

    counter++;

    }

    ```


    在上面的示例中，创建了一个名为 `counter` 的变量。`while` 循环开始。注意 `while` 循环内部的语句也通过大括号进行了分组。`while`
    循环每次循环时都会检查 `counter` 变量是否小于或等于 `100`。如果是，它就会增加 `counter` 变量。一旦它超过 `100`，循环就会退出。我现在不会细说太详细，因为循环将在
    *第 14 章：循环* 中进行详细解释。


    # for 循环


    `for` 循环按指定的次数执行代码代码块。所以，如果你想重复某些文本 10 次，你就会使用 `for` 循环；或者如果你想遍历页面上所有的图像，你将使用
    `for` 循环。这是一个小示例：


    ```javascript

    for (let i = 0; i <= 100; i++)

    {

    document.write(i + “<br>”);

    }

    ```


    `for` 循环与 `while` 循环略有不同。`while` 循环被称为*条件*循环（它在某个条件存在时循环，或者直到某个条件变为真），而 `for`
    循环是计数器循环。通过 `for` 循环，你可以精确指定循环从哪里开始，在哪里停止。为了演示区别，我保持了与上面 `while` 循环相同的参数。`for`
    循环将从 `0` 循环到 `100`。


    它随后会将循环计数器的值写入文档。正如你所见的，不需要手动增加循环变量，因为它是自动增加的。我现在不会细说太详细，因为循环将在 *第 14 章：循环* 中进行详细解释。


    # if 语句


    JavaScript 的 `if` 语句在特定条件为真时执行分组的语句。这里有一个小示例：


    ```javascript

    if (counter > 50)

    {

    alert(“stop it!”);

    break;

    }

    ```


    上面的 `if` 语句也通过使用大括号将一组语句组合在一起。在上面的示例中，它判断 `counter` 变量是否大于 `50`。如果是，它将显示一个带有 `stop
    it!` 的弹出框；如果 `counter` 小于或等于 `50`，则什么都不会发生。我现在不会细说太详细，因为 `if` 语句将在 *第 13 章：控制流语句*
    中进行详细解释。


    # 空格和换行


    代码会变得非常杂乱，你可能会更快迷失在代码中。想象一个包含 1000 行的脚本。进一步想象你必须更改其中某处的几行。现在，如果没有空格，你将挣苦于寻找你的函数和分组语句何时结束。你将在寻找需要编辑的地方时面临极大困难。


    这就是空格和换行的用武之地。空格允许你以一种优化的方式格式化代码的流：


    # 空格


    空格简单地添加空格、制表符或换行符，以便你的代码更具读性。JavaScript 解释器忽略空格，让我们把 `while` 循环、`for` 循环和 `if`
    语句在没有空格的情况下写出来。


    # 没有空格的 while 循环


    ```javascript

    var counter = 0;

    while (counter <= 100)

    {

    document.write(counter + “<br>);

    counter++;

    }

    ```


    上面是 `while` 循环样子的简短示例。


    # 没有空格的 for 循环


    ```javascript

    for (let i = 0; i <= 100; i++)

    {

    document.write(i + “<br>”);

    }

    ```


    # 没有空格的 if


    ```javascript

    if (counter > 50)

    {

    alert(“stop it!”);

    break;

    }

    ```


    正如你所见的，代码不再容易阅读了，尽管代码并不长。现在，想象有一个包含几十个 `if` 语句和循环组合在一起的长脚本。不仅对你来说，对你团队中的其他开发者来说，跟踪代码都将极其困难。你现在可能知道脚本中发生的一切切，但一个月后可能就不如此了。


    让我们让代码变得漂亮起来！


    # 带有空格的 while 循环


    ```javascript

    var counter = 0;

    while (counter <= 100)

    {

    document.write(counter + “<br>);

    counter++;

    }

    ```


    上面是一个小型 `while` 循环带有一点空格后的简短示例。


    # 带有空格的 for 循环


    ```javascript

    for (let i = 0; i <= 100; i++)

    {

    document.write(i + “<br>”);

    }

    ```


    # 带有空格的 if


    ```javascript

    if (counter > 50)

    {

    alert(“stop it!”);

    break;

    }

    ```


    代码看起来已经清晰多了。通过添加换行符，你可以让它更易读。


    # 换行符


    一条长的 JavaScript 语句可以分成多行。通常，超过 80 个字符的行会让阅读和跟踪代码变得困难。像这样的行就很长：


    ```javascript

    document.getElementById(“displaySizeLabel”).innerHTML = size; /*Display screen
    size*/

    ```


    一个很好的断行位置是在运算符之后（*第 4 章：JavaScript 运算符* 将详细介绍运算符），如下下面的代码段所示：


    ```javascript

    document.getElementById(“displaySizeLabel”).innerHTML =

    size; /*Display screen size*/

    ```


    换行符也有助于提高代码的可读性。我将再次引用 `while` 循环的示例，并在里面再多添加一些换行符。让我们为上面的代码示例添加换行符


