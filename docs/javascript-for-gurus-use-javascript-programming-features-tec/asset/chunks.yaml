    \nIn [Chapter 9: JavaScript Promises](#c09.xhtml), I have talked about asynchronous\
    \ and synchronous tasks and methods. Here is a little refresher.\n\nLet’s assume\
    \ you start your very own cupcake business. It is relatively small, so you have\
    \ direct interaction with your clients. They will order a cupcake or two, you\
    \ will bake the number of cupcakes, and then you will deliver the cupcakes. This\
    \ is synchronous behavior because it is an ask-and-get scenario.\n\nImagine further\
    \ that your cupcakes are really taking off and you get busier, and there are even\
    \ talks of franchising! You cannot be at different places at the same time. You\
    \ cannot serve different customers at the same time. You need help. This is where\
    \ asynchronicity comes in. Asynchronocity allows you to put orders on a waiting\
    \ list and complete them when and if you can.\n\nIn JavaScript, doing a synchronous\
    \ task means that the browser must halt the rendering of the page in order to\
    \ complete the execution of JavaScript code. This blocks the page from rendering\
    \ completely until the code execution completes.\n\nWhen doing tasks asynchronously,\
    \ JavaScript code is processed in parallel to the rest of the page content. Asynchronous\
    \ tasks will not slow down the rest of the page and minimize the impact of loading\
    \ external JavaScript files on the page rendering process.\n\n# Async iterators](#toc.xhtml_s155a)\n\
    \nAsync iterators iterate over asynchronous data on-demand. There are a few syntactic\
    \ differences between regular iterators and async iterators. A regular iterator\
    \ looks like the following code segment:\n\n```javascript\nlet iRange = {\n  start:\
    \ 1,\n  finish: 5,\n  [Symbol.iterator]() {\n    return {\n      current: this.start,\n\
    \      end: this.finish,\n      next() {\n        if (this.current <= this.end)\
    \ {\n          return { done: false, value: this.current++ };\n        } else\
    \ {\n          return { done: true };\n        }\n      }\n    }\n  }\n};\nfor(let\
    \ val of iRange) {\n  alert(val);\n}\n```\n\n# Code segment 1: Regular iterator](#toc.xhtml_s156a)\n\
    \nThe iterator will start at 1 and continue to 5. While the current value is within\
    \ range, it will increment, and once it is outside of the range, it will notify\
    \ the iterator that it cannot iterate anymore.\n\n`Now, let’s have a look at the\
    \ same example, but as an async iterator:`\n\n```javascript\nlet iRange = {\n\
    \  start: 1,\n  finish: 5,\n  [Symbol.asyncIterator]() {\n    return {\n     \
    \ current: this.start,\n      end: this.finish,\n      async next() {\n      \
    \  await new Promise(resolve => setTimeout(resolve, 1000));\n        if (this.current\
    \ <= this.end) {\n          return { done: false, value: this.current++ };\n \
    \       } else {\n          return { done: true };\n        }\n      }\n    }\n\
    \  }\n};\n(async () => {\n  for await (let val of iRange) {\n    alert(val);\n\
    \  }\n})()\n```\n\n# Code segment 2: Async iterator](#toc.xhtml_s157a)\n\nYou\
    \ can perhaps already see the subtle differences between regular iterators and\
    \ async iterators. In case you cannot, here are a few differences:\n\n*   Async\
    \ iterators make use of `Symbol.asyncIterator` and regular iterators make use\
    \ of `Symbol.iterator`.\n*   Async `next()` methods must return promises. Promises\
    \ were discussed in [Chapter 9: JavaScript Promises](#c09.xhtml).\n\n# Async generators](#toc.xhtml_s158a)\n\
    \nThe main difference between regular generators and async generators is that\
    \ an async generator returns a promise. Let’s have a look:\n\n```javascript\n\
    function* quickSequence(begin, end) {\n  for (let i = begin; i <= end; i++) {\n\
    \    yield i;\n  }\n}\nfor(let val of quickSequence(1, 5)) {\n  alert(val);\n\
    }\n```\n\n# Code segment 3: Regular generator](#toc.xhtml_s159a)\n\nThe above\
    \ generator creates a sequence between 1 and 5. Now, let’s have a look at the\
    \ same function with async capabilities:\n\n```javascript\nasync function* quickSequence(begin,\
    \ end) {\n  for (let i = begin; i <= end; i++) {\n    await new Promise(resolve\
    \ => setTimeout(resolve, 1000));\n    yield i;\n  }\n}\n(async () => {\n  let\
    \ gen = quickSequence(1, 5);\n  for await (let val of gen) {\n    alert(val);\n\
    \  }\n})();\n```\n\n# Code segment 4: Async generator function](#toc.xhtml_s160a)\n\
    \nThe async generator returns a promise, and it makes use of `await` to `yield`\
    \ another number.\n\n# Conclusion](#toc.xhtml_s161a)\n\nThis chapter was a bit\
