  trans: "\n\n符号（Symbol）代表一个唯一的标识符，并且被保证是唯一的。\n\n这里有一个短小的示例。下面的示例演示了如何创建和使用符号：\n\n\
    1.  打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码\n\n    ```html\n<!doctype html>\n<body>\n\
    <h1>Symbol example</h1>\n<p>Symbol example</p>\n<script>\n  let student = {\n\
    \  name: “Ockert”\n  };\n  let id = Symbol(“id”);\n  student[id] = 123;\n  alert(\
    \ student[id] );\n</script>\n</body>\n</html>\n    ```\n\n2.  以 HTML 扩展名保存该文件，例如\
    \ `Chapter 12.8.html`。\n\n3.  双击该文件在默认浏览器中打开它\n\n运行后，ID `idsymbol` 会被赋值给 `student`\
    \ 对象，它将产生 `123`。\n\n# 结论\n\n在本章中，我们学习了数据类型和变量。没有变量，你就无法存储任何信息或对信息进行操作。最重要的是，你已经学会了哪种数据类型适用于哪种用途。\n\
    \n在下一章中，我们将深入探讨控制流语句。虽然你可能在本书中见过它们，但在随后的章节中，我们将解释如何使用控制流语句在脚本中包含逻辑的所有细节。\n\n#\
    \ 问题\n\n1.  什么是变量？\n2.  局部作用域和全局作用域之间的区别是什么？\n3.  列出七种原始数据类型。\n4.  列出三个字符串函数。\n\
    5.  什么是符号？\n\n# 第 13 章\n\n## 控制流语句\n\n## 简介\n\n控制流语句根据其执行的条件或微小测试来决定你脚本的执行流。这些测试可以包括测试一天的时间、用户的年龄，或者是否提供了某些特定信息。\n\
    \n在本节中，你将学习什么是控制流语句，以及哪些语句最适合你的特定需求。你将学习如何利用 `if` 语句、`else…if` 语句和 `else` 来根据情况执行代码。然后，你将学习\
    \ `switch` 语句和条件运算符如何为你节省时间。最后，你将学习如何嵌套语句。\n\n## 结构\n\n*   控制流语句定义\n*   if\n*\
    \   else…if\n*   else\n*   switch\n*   嵌套语句\n*   条件运算符‘`?’`\n\n## 目标\n\n*   理解控制流语句的工作原理。\n\
    *   利用 `if` 语句测试条件。\n*   利用 `else…if` 语句测试多个条件。\n*   当条件为假时利用 `else` 语句。\n*  \
    \ 理解 `switch` 语句的工作原理。\n*   理解如何嵌套 `if` 语句和 `switch` 语句。\n*   知道如何使用条件运算符。\n\n\
    ## 控制流语句定义\n\n语句是逐行执行的。浏览解释器从上到下开始执行语句。这被称为脚本或程序的控制流。很多时候，脚本的控制流可以根据某些条件发生改变。这些条件判断是开发者作为开发者需要测试的未知值或情况。\n\
    \n一个很好的例子是，如果网站要求输入密码。如果没有输入文本，或者输入的密码太短，会发生什么？根据这些情况，应该执行不同的代码分支。如果输入的密码是错误的呢？应该执行另一条代码。如果输入的密码是正确的呢？随后执行的分支将允许用户进一步进入网站。\n\
    \n我们如何做到这一点？答案很简单。控制流语句如 `if`、`if…else`、`else`、`switch` 和条件运算符。让我们来看其中的每一个。\n\n\
    ## if 语句\n\n如果你中了票你会做什么？我知道我会怎么做！我会还清所有债务，买一辆好车。退休和我妻子孩子一起住在一个远离世俗、荒无人烟的地方。听我解释；我正试图表达一个观点。\n\
    \n晚上到了，你会做什么？你打开灯，当黎明来临时，你开始关灯。下雨了，而你在外面。如果你有伞，你就把它拿出来使用。如果你没有伞，你就去寻找避难所。\n\n\
    注意我在类比中不断使用的那个两个字母关键词了吗？\n\n`if` 语句在脚本中的工作方式一样。它只是不同的平台。你需要测试的几点内容如下：\n\n*   用户交互\n\
    *   脚本中的某些事件或情况\n*   计算机事件。\n\n为了解释得更清楚。你可能需要检查变量的状态以完成任务。例如，如果未提供某些信息，用户无法继续进入网站。或者，你可能忙于以下事务：\n\
    \n```html\n<!doctype html>\n<body>\n<h1>Symbol example</h1>\n<p>Symbol example</p>\n\
    <script>\n  let student = {\n  name: “Ockert”\n  };\n  let id = Symbol(“id”);\n\
    \  student[id] = 123;\n  alert( student[id] );\n</script>\n</body>\n</html>\n\
    ```\n\n1.  打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n    ```html\n<!doctype html>\n\
    <body>\n<h1>Symbol example</h1>\n<p>Symbol example</p>\n<script>\n  let student\
    \ = {\n  name: “Ockert”\n  };\n  let id = Symbol(“id”);\n  student[id] = 123;\n\
    \  alert( student[id] );\n</script>\n</body>\n</html>\n    ```\n\n2.  以 HTML 扩展名保存该文件，例如\
    \ `Chapter 12.8.html`。\n\n3.  双击该文件在默认浏览器中打开它\n\n运行后，ID `idsymbol` 会被赋值给 `student`\
    \ 对象，它将产生 `123`。\n\n这也许是 `if` 语句最基本的演示。因为 `time` 是一个 `Date` 对象，我们可以访问 `Date` 属性如\
    \ `getHours`。\n\n```html\n<!doctype html>\n<body>\n<h1>Symbol example</h1>\n<p>Symbol\
    \ example</p>\n<script>\n  var time = new Date().getHours();\n  if (time < 12)\
    \ {\n    greeting = “Good morning”;\n  }\n  document.write(greeting);\n</script>\n\
    </body>\n</html>\n```\n\n如果小时小于 12，那么另一个变量 `greeting` 将填充为：`Good morning`。最后，greeting\
    \ 的值被写入页面。\n\n![](img/Img_13.jpg)\n\n**图 13.1：** if 语句的应用\n\n有时一个 `if` 语句是不够的。这就是\
    \ `else…if` 语句。\n\n## else…if 语句\n\n`else…if` 语句用于检查多个条件。如果原始条件不存在，流跳转到下一个 `else…if`\
    \ 语句，如果该条件不存在，它继续到下一个，以此此类推。如果所有条件都不，则什么都不会发生，所有 `if` 和 `else…if` 语句中的代码都不会被执行。\n\
    \n下面的示例添加了一个 `else…if` 语句：\n\n```html\n<!doctype html>\n<body>\n<h1>Symbol example</h1>\n\
    <p>Symbol example</p>\n<script>\n  var time = new Date().getHours();\n  if (time\
    \ < 12) {\n    greeting = “Good morning”;\n  }\n  else if (time < 18) {\n    greeting\
    \ = “Good afternoon”;\n  }\n  document.write(greeting);\n</script>\n</body>\n\
    </html>\n```\n\n2.  以 HTML 扩展名保存该文件，例如 `Chapter 13.2.html`。\n\n3.  双击该文件在默认浏览器中打开它。\n\
    \n如果时间小于 18，那么 greeting 变量 `greeting` 将包含消息 `Good afternoon`。\n\n之前我提到过，当没有 `else…if`\
    \ 条件存在时，什么都不会发生。好吧，我们可以让某些事情发生！\n\n"
