    # 引言


    从简单开始总是最好的，特别是当主题是一个许多人感到害怕或认为复杂的领域时。第一部分从 JavaScript 的通用用途和历史开始，非常简单。然后我们从对象、语句、运算符和函数开始，这些都是相对容易的话题——正如你所看到的，有很多值得期待，没有什么可畏的。


    本部分包含以下章节：


    1. JavaScript 的威力及其用途概述

    2. JavaScript 对象

    3. JavaScript 语句

    4. JavaScript 运算符

    5. JavaScript 函数


    # 第一章


    # JavaScript 的威力及其用途概述


    # 引言


    JavaScript 的诞生是因为对更多动态内容和交互性的需求。虽然它最初很小且专门针对网络浏览器，但它已经成熟并成长为任何网页以及任何 Web 和移动端开发者的必需品。


    本书的第一章重点介绍 JavaScript 的起源。它提供了该语言的简要历史和特性的简要介绍。最重要的是，它回答了这个问题：为什么是 JavaScript？我们为什么需要它？


