  trans: "\n接下来的这个小练习演示了 `debugger` 关键字的使用：\n\n1.  打开你任选的文本编辑器，并输入以下 HTML 和 JavaScript\
    \ 代码：\n\n```html\n<html>\n<body>\n<h1>debugger 语句</h1>\n<p>以下代码演示了 debugger 语句的使用</p>\n\
    <script>\nvar x = 30 * 5;\ndebugger;\ndocument.getElementbyId(“Answer”).innerHTML\
    \ = x;\n</script>\n</body>\n</html>\n```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter 15.4.html`。\n\
    \n3.  双击该文件在默认浏览器中打开它。\n4.  在 Google Chrome 中按 `Ctrl` + `Shift` + `J` 或 `F12`\
    \ 打开控制台窗口。\n\n屏幕将显示暂停的浏览器窗口：\n\n![](img/Img_15_04.jpg)\n\n**图 15.4：** 调试器中暂停的代码\n\
    \n如你所见，在调试模式下，屏幕会变成灰色并高亮 debugger 所在的行。此外，注意浏览器窗口中的黄色黄色窗口。它显示代码已在调试器中暂停，并提供了两个按钮。Resume\
    \ execution（恢复执行）将继续执行代码，直到遇到下一个断点（如果有的话）。Step over the next function（单步下一个函数）将进入下一行（在本例中）。如果按下\
    \ `Resume`，下一行将显示为错误，因为文档中不存在 `Answer` 字段。\n\n让我们看看如何处理运行时错误。\n\n# try 和 catch\
    \ 块 #toc.xhtml_s243a\n\n`try…catch` 语句处理运行代码时可能发生的错误。你将可能出错的代码放在 `try` 块中，调试器会尝试执行它。如果发生错误，`catch`\
    \ 块中的代码将触发。这可以防止页面崩溃以及浏览器产生错误。\n\n你可以选择性在 `catch` 块之后添加一个 `finally` 语句，它无论是否发生错误都会执行。\n\
    \n下一个练习演示了 `try…catch` 语句的使用。\n\n1.  打开你任选的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>try and catch</p>\n<p>请输入一个 15\
    \ 到 20 之间的数字：</p>\n<input id=”userInput” type=”text\">\n<button type=”button”\
    \ onclick=”Check()\">测试输入</button>\n<p id=”output”></p>\n<script>\nfunction Check()\
    \ {\n  var message, x;\n  message = document.getElementById(“output”);\n  message.innerHTML\
    \ = “”;\n  x = document.getElementById(“userInput”).value;\n  try {\n    if(x\
    \ == “”) throw “is Empty”;\n    if(isNaN(x)) throw “not a number”;\n    if(x >\
    \ 20) throw “too high”;\n    if(x < 15) throw “too low”;\n  }\n  catch(err) {\n\
    \    message.innerHTML = “Input “ + err;\n  }\n}\n</script>\n</body>\n</html>\n\
    ```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter 15.5.html`。\n\n3.  双击该文件在默认浏览器中打开它。\n4.\
    \  在 Google Chrome 中按 `Ctrl` + `Shift` + `J` 或 `F12` 打开控制台窗口。\n\n输出示例所示：\n\n![](img/Img_15_05.jpg)\n\
    \n**图 15.5：** try and catch 示例\n\n`try` 块用于确定用户输入到 `userInput` 字段的内容。如果数字在 `15`\
    \ 到 `20` 之间，什么都不会发生；换句话说，不会产生错误。然而，如果没有输入值、输入单词而不是数字、或者值大于 `20`（如 `Figure 15.5`所示），或值小于\
    \ `15`，将抛出错误并在 `catch` 块内部处理。\n\n# 编码风格 #toc.xhtml_s244a\n\n每种编程语言都有一套开发者应该遵循的不成文规则。好吧，并非完全不成文，而是一些被遵循的规则，你可以称之为标准，以提高代码的可读性。这是必要的，因为脚本可能会变得非常非常长，你很快就会在大量糟糕的变量和对象名称以及混乱的条件语句和循环中迷失。\n\
    \n# 变量和对象名称 #toc.xhtml_s245a\n\n变量命名主要有两种规范，即：驼峰命名法（camel case）和帕斯命名法（pascal case）。它们在大写方式上有所不同，如下：\n\
    \n* `camelCase`\n* `PascalCase`\n\n在本书中，我尽量保持 `camelCase` 命名规范。\n\n使用大写的全局变量也很常见。\n\
    \n变量名可以包含字母、数字、美元符号和下划线。以下是几个例子：\n\n`full_Name`\n`student1`\n`student_Name$`\n\
    \n但记住，你应该在整个脚本始终保持相同的命名规范。变量在 `第 12 章：变量` 中已经讨论过。\n\n# 运算符和缩进 #toc.xhtml_s246a\n\
    \n运算符的通用规则是在所有操作数之间始终保持空格格。比较以下内容：\n\n`Result=varibale1+variable2`\n\n对比\n\n`Result\
    \ = varibale1 + variable2`\n\n空格让代码更易读。运算符在 `第 4 章：JavaScript 运算符` 中讨论过。\n\n说到空格，当你在代码中使用控制流语句\
    \ `第 13 章：控制流语句` 或使用函数 `第 5 章：JavaScript 函数` 时，你绝对应该利用空格来提高代码流。比较以下代码段：\n\n```javascript\n\
    var time = new Date().getHours();\nif (time < 12) {\n  greeting = “morning”;\n\
    } else if (time < 18) {\n  greeting = “afternoon”;\n} else {\n  greeting = “evening”;\n\
    }\n```\n\n对比\n\n```javascript\nvar time = new Date().getHours();\nif (time < 12)\
    \ {greeting =“morning”;}else if (time < 18) {greeting =“afternoon”;}else {greeting\
    \ =“evening”;}\n```（注：根据文本上下文重构）\n\n带有空格的部分要易读得多。这可能是一个非常简单的例子，但当嵌套控制流语句时，你会感到困惑。\n\
    \n# 对象规则 #toc.xhtml_s247a\n\n`第 2 章：对象` 定义的常见做法如下：\n\n* 左括号应放在与对象名称同一行。\n* 在属性名和值之间使用冒号和一个空格。\n\
    * 仅对字符串值使用引号，除非数值应该是字符串。\n* 最后一个属性-值对之后不需要逗号。\n* 右括号应放在新行，且没有领先空格。\n* 用分号结束对象定义。\n\
    \n这是一个使用了所有规则的小示例：\n\n```javascript\nvar student = {\n  firstName: “Ockert”,\n\
    \  lastName: “du Pz”,\n  age: 41,\n  course: “JavaScript”\n};\n```\n\n很容易看出对象由什么组成。\n\
    \n# 注释 #toc.xhtml_s248a\n\n注释用于描述代码正在做什么。相信我，在太晚之前你不会这有多重要。想象你在解决一个复杂的问题，过了一段时间你解决了。进一步想象你没有添加注释来描述代码，并在\
    \ 6 个月后回到代码处进行更新。记住你做了什么以及在哪里做的可能极其困难。\n\n另一个需要记住的事实是，你可能在团队环境中工作。注释可以帮助理解理解团队成员的代码，反之亦然。\n\
    \n注释有两种类型：\n\n* 单行注释\n* 多行注释\n\n让我们仔细观察。\n\n# 单行注释 #toc.xhtml_s249a\n\n单行注释可以放在一行的任何位置，例如：\n\
    \n```javascript\nvar objstudent; //在此处声明学生对象\n```\n\n在上述代码中，注释以两个斜杠开头，并放在对象声明之后。\n\
    \n# 多行注释 #toc.xhtml_s250a\n\n多行注释可以跨多行，例如：\n\n```javascript\n/*这个条件语句测试时间\n显示的结果取决于一天中的时间*/\n\
    ```\n"
- fmt: "\n`Created by: OJ du Preez`\n\n`2019 */`\n\n```javascript\nvar time = new\
    \ Date().getHours();\nif (time < 12) {\n  greeting = “Good morning”;\n}\nelse\
    \ if (time < 18) {\n  greeting = “Good afternoon”;\n}\nelse {\n  greeting = “Good\
    \ evening”;\n}\ndocument.write(greeting);\n```\n\nThe code between the forward\
    \ slashes and asterisks describe what the code does and who developed it.\n\n\
    Comments do not get displayed on the web page; they are solely for informational\
    \ purposes.\n\n# Conclusion\n\nThis was the last chapter in the *Using JavaScript\
    \ Productively* section. In this chapter, we learnt the importance of writing\
    \ good code and making use of all the debugging and coding tools at your disposal.\
    \ The better your code is structured, the better it is to navigate and to debug.\n\
    \nIn the next chapter, we will kick off the *Advanced Concepts* section and will\
    \ cover arrays in JavaScript. Although you may have seen the term, or even used\
    \ them in code inside this book, you do not know all the intricacies and how to\
    \ use them productively. That is what you will do next.\n\n# Questions\n\n1. Name\
    \ the two most common types of errors in JavaScript\n2. What do the `console.time`\
    \ and `console.timeEnd` keywords do?\n3. How do you pause code in the debugger?\n\
    4. Why would you use `try…catch`?\n5. Name the two types of comments in JavaScript.\n\
    \n# SECTION IV\n\n# Advanced Concepts\n\n# Introduction\n\nSection 4 explores\
    \ some advanced concepts in JavaScript. [Chapter 16](#c16.xhtml) deals with arrays.\
    \ You will learn how to create and use arrays productively. [Chapter 17](#c17.xhtml)\
    \ explores the world of regular expressions and demonstrates how easy it is to\
    \ search for text in strings and to limit text input. [Chapter 18](#c18.xhtml)\
    \ takes functions a huge step further where it explains functional programming\
    \ concepts such as partial applications and currying.\n\nThis section will have\
    \ the following chapters:\n\n1. Arrays\n2. Regular Expressions\n3. Partials and\
    \ Currying.\n\n# CHAPTER 16\n\n# JavaScript Arrays\n\n# Introduction\n\nArrays\
    \ give you the ability to store more than one value inside a named container.\
    \ You access elements of an array by using the array’s index.\n\nIn this lesson,\
    \ you will learn how to add and remove elements from arrays, how to access items,\
    \ and how to iterate over arrays.\n\n# Structure\n\n*   Arrays\n    * Creating\
    \ arrays\n        * Adding items to an array\n        * Removing items from arrays\n\
    \    * Multidimensional arrays\n\n# Objectives\n\n* Understand what arrays are\
    \ and what you can do with them.\n* Know the various ways of adding elements to\
    \ the array.\n* Know the various ways of removing items from an array.\n* Know\
    \ what Multidimensional arrays are.\n\n# Arrays\n\nThere are occasions when an\
    \ ordinary object is simply not enough. What if I have a list of information such\
    \ as results that I’d like to store? One object cannot store multiple values in\
    \ this case. An array is a list of values that are organized. You may remember\
    \ that I have mentioned the term numerous times thus far in this book, but I never\
    \ really explained it extensively.\n\n# Creating arrays\n\nThere are essentially\
    \ two ways to create arrays:\n\n* `let arr = new Array();`\n* `let arr = [];`\n\
    \nAlthough the latter is more preferred, I will explain both practically.\n\n\
    # Method 1\n\nThe first method makes use of the `Array` keyword to create arrays.\
    \ There is an easy way and a hard way, as you will shortly see in the following\
    \ exercise:\n\n1. Open a text editor of your choice and enter the following HTML\
    \ and:\n\n```html\n<html>\n<body>\n  <script>\n    var time = new Date().getHours();\n\
