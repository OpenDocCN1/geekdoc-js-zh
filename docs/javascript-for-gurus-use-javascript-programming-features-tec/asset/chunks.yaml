    \n* Understand what debugging means.\n* Identify the types of errors and fix them.\n\
    * Make use of the console object’s debugging features.\n* Make use of the `debugger`\
    \ keyword to pause script execution.\n* Make use of `try` and `catch` blocks to\
    \ catch errors.\n"
  raw: "When this page is opened, you will see a box that looks like *[Figure 14.6](#c14.xhtml_fig14_6),*\
    \ where the numbers should be entered. Now, you can enter `1` every time, and\
    \ it will keep adding 1 until it reaches `100`. Or, you can enter `50` and `50`,\
    \ or even `100` directly.\n\nIf you had entered `1` every time it wouldloop `100`\
    \ times;if you entered `50` and `50` again, it wouldloop twice, if you enter `100`\
    \ immediately, it willloop just once. To test this, refresh the page after you\
    \ have reached `100` and try again with a different combination of numbers:\n\n\
    ![](images/Img_14_06.jpg)\n\n**Figure 14.6:** while loop in action\n\nThe `do…while`loop\
    \ (which I will cover next) is almost identical to the `while` loop, let’s have\
    \ a look\n\n# [do…while](#toc.xhtml_s226a)\n\nThe `do…while`loop is also a conditional\
    \ loop as the while loop you did earlier. There is just one main difference. Whereas\
    \ with the while loop the condition was tested at the beginning of the loop, with\
    \ a `do…while`loop, the condition is tested at the end of the loop. This means\
    \ that the loop will always execute at least once. Its syntax looks like the following:\n\
    \n`do`\n\n`{`\n\n`Statement(s)`\n\n`} while (condition);`\n\nThe next sample demonstrates\
    \ a `do…while`loop.\n\n1.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code:\n\n    `<!doctype html>`\n\n    `<body>`\n\n    `<h1>while\
    \ loop example</h1>`\n\n    `<p>while loop example</p>`\n\n    `<script>`\n\n\
    \    `let i = 0; //change to 6`\n\n    `do`\n\n    `{`\n\n    `i += 1;`\n\n  \
    \  `document.write(i);`\n\n    `} while (i < 5);`\n\n    `</script>`\n\n    `</body>`\n\
    \n    `</html>`\n\n2.  Save the file with an HTML extension, for example `Chapter\
    \ 14.7.html`.\n\n3.  Double-click the file to open it in the default browser.\n\
    \nThis code will simply output `12345` of the page when run. Now since the condition\
    \ gets evaluated at the end of the loop, this can be troublesome. For instance,\
    \ if you were to change the value of `1`to `6` instead of `0` before the loop,\
    \ the loop will still execute once and produce `7`.\n\n# [Exiting loops](#toc.xhtml_s227a)\n\
    \nThere may be times that you need to exit a loop early. In these cases, you should\
    \ use the break statement. There are two ways in which you can use the break statement\
    \ in loops.\n\n*   break\n\n*   break to label\n\nLet’s see how they work.\n\n\
    # [break](#toc.xhtml_s228a)\n\nYou can exit a loop by including the `break` statement\
    \ at the point where you want to exit. This is usually based on a condition that\
    \ has become true.\n\nThe next sample demonstrates how to exit a loop early.\n\
    \n1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<!doctype html>`\n\n    `<body>`\n\n    `<h1>Exiting a loop with\
    \ break example</h1>`\n\n    `<p>Exiting a loop with break example</p>`\n\n  \
    \  `<script>`\n\n    `var num = “”;`\n\n    `var i = 0;`\n\n    `while (i < 5)`\n\
    \n    `{`\n\n    `num += “<br>Current Number: “ + i;`\n\n    `i++;`\n\n    `if\
    \ (i === 3)`\n\n    `{`\n\n    `break;`\n\n    `}`\n\n    `}`\n\n    `document.write(num);`\n\
    \n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file with\
    \ an HTML extension, for example,`Chapter 14.8.html`\n\n3.  Double-click the file\
    \ to open it in the default browser\n\nThe loop is supposed to loop from 0 to\
    \ 5, but the `if` statement tested if `i` is `3`. If it is, then the loop should\
    \ exit denoted by the `break` statement. *[Figure 14.7](#c14.xhtml_fig14_7)* displays\
    \ the half-completed loop.\n\n![](images/Img_14_07.jpg)\n\n**Figure 14.7:** The\
    \ loop exited early\n\nLet’s add a twist.\n\n# [break with label](#toc.xhtml_s229a)\n\
    \nAs you saw, the `break` statement causes the loop to exit early. You can specify\
    \ where to start executing code by including a label and exiting to that label.\
    \ You simply add a labelled statement and add the code afterwards\n\nLet’s do\
    \ an example.\n\nThe next sample demonstrates how to exit a loop early with a\
    \ label.\n\n1.  Open a text editor of your choice and enter the following HTML\
    \ and JavaScript code:\n\n    `<!doctype html>`\n\n    `<body>`\n\n    `<h1>Exiting\
    \ a loop with break example</h1>`\n\n    `<p>Exiting a loop with break example</p>`\n\
    \n    `<script>`\n\n    `let i = 0;`\n\n    `let j = 0;`\n\n    `Repeat: while\
    \ (true)`\n\n    `{`\n\n    `document.write(‘Outer: ‘ + i + ‘</br>’);`\n\n   \
    \ `i += 1;`\n\n    `j = 1;`\n\n    `while (true)`\n\n    `{`\n\n    `document.write(‘Inner:\
    \ ‘ + j + ‘</br>’);`\n\n    `j += 1;`\n\n    `if (i === 5 && j === 5)`\n\n   \
    \ `{`\n\n    `break Repeat;`\n\n    `}`\n\n    `else if (j === 5)`\n\n    `{`\n\
    \n    `break;`\n\n    `}`\n\n    `}`\n\n    `}`\n\n    `</script>`\n\n    `</body>`\n\
    \n    `</html>`\n\n2.  Save the file with an HTML extension, for example `Chapter\
    \ 14.9.html`.\n\n3.  Double-click the file to open it in the default browser.\n\
    \nWhen the variable `i`and `j`both equal `5,` the execution will jump to the outer\
    \ loop labelled`Repeat`. It will repeat this process until `j` is equal to `5`.\
    \ *[Figure 14.8](#c14.xhtml_fig14_8)* shows the result:\n\n![](images/Img_14_08.jpg)\n\
    \n**Figure 14.8:** break with a label\n\nNow that you know how to exit loops,\
    \ let’s have a look at how to continue loops.\n\n# [The continue statement](#toc.xhtml_s230a)\n\
    \nThe continue statement restarts a `while`, `do…while`, or `for` loop.\n\nThe\
    \ next sample demonstrates the use of the `continue` statement in a loop:\n\n\
    1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<!doctype html>`\n\n    `<body>`\n\n    `<h1>continue statement\
    \ example</h1>`\n\n    `<p>continue example</p>`\n\n    `<script>`\n\n    `for\
    \ (let i = 0; i < 9; i++)`\n\n    `{`\n\n    `if (i === 1)`\n\n    `continue;`\n\
    \n    `else if (i === 7)`\n\n    `continue;`\n\n    `document.write(i + ‘</br>’\
    \ );`\n\n    `}`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save\
    \ the file with an HTML extension, for example `Chapter 14.10.html`.\n\n3.  Double-click\
    \ the file to open it in the default browser.\n\nThe loop is supposed to loop\
    \ from `0` to `9`. It does, but it skips a loop when `i` is `1` and when `i` is\
    \ `7` because of the continue statement. *[Figure 14.9](#c14.xhtml_fig14_9)* shows\
    \ the result:\n\n![](images/Img_14_09.jpg)\n\n**Figure 14.9:** continue statement\
    \ in action\n\nAs you can see the numbers `1` and `7` are skipped.\n\n# [Conclusion](#toc.xhtml_s231a)\n\
    \nIn this chapter, we learnt how to use loops. You saw how you coulduse the `for`\
    \ loop to repeat tasks for a certain number of times. You saw that the `for…in`and\
    \ `for…of`loops provide more power to the ordinary `for` loop where you can easily\
    \ iterate through strings, arrays, and object properties. You learned about the\
    \ `while` statement and how it is different from the various for loops. Lastly,\
    \ you learned how to quickly exit loops and continue to different iterations with\
    \ the help of labelled statements and the break and `continue` keywords.\n\nThe\
    \ next chapteris the last chapter in the *Using JavaScript Productively* section.\
    \ You will learn about the importance of code quality and how to improve your\
    \ sloppy code.\n\n# [Questions](#toc.xhtml_s232a)\n\n1.  What is the difference\
    \ between the `for` loop and the `while` loop?\n\n2.  Give the syntax for a basic\
    \ `for` loop.\n\n3.  Give the syntax for a basic `while` loop.\n\n4.  How can\
    \ you exit a loop?\n\n5.  What is the `continue` statement used for?\n\n# [CHAPTER\
    \ 15](#toc.xhtml_c15)\n\n# [Code Quality](#toc.xhtml_c15)\n\n# [Introduction](#toc.xhtml_s233a)\n\
    \nAny written code will always have errors. The trick is to write code in such\
    \ a way that it makesspotting problematic code easier.\n\nIn this lesson, you\
    \ will learn how to debug JavaScript code with the built-in tools JavaScript provides.\
    \ You will also learn how to write neat code so that you can read it easier\n\n\
    # [Structure](#toc.xhtml_s234a)\n\n*   Debugging\n\n*   Coding style\n\n*   Comments\n\
    \n# [Objectives](#toc.xhtml_s235a)\n\n*   Understand what debugging means.\n\n\
    *   Identify the types of errors and fix them.\n\n*   Make use of the console\
    \ object’s debugging features.\n\n*   Make use of the `debugger` keyword to pause\
    \ script execution.\n\n*   Make use of `try` and `catch` blocks to catch errors.\n\
    \n*   Learn how to write tidy code."
