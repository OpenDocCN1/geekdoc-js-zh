  trans: "\n\n在字符串中搜索文本可能是困难的，特别是当你只知道字符串中短语的一部分时。幸运的是，JavaScript 包含了正则表达式。正则表达式帮助你通过特殊字符和模式的组合来识别文本部分。\n\
    \n在本节中，你将学习如何使用正则表达式来识别特定的文本片段。\n\n# 结构\n\n*   正则表达式定义\n*   正则表达式修饰符/标志（flags）\n\
    *   正则表达式模式\n\n# 目标\n\n*   了解正则表达式。\n*   了解如何使用修饰符/标志来改进搜索结果。\n*   利用模式搜索文本或短语。\n\
    \n# 正表达式定义\n\n`JavaScript` 中的正则表达式是用于匹配字符串中各种字符组合的模式。这些字符序列形成搜索模式，可以用于搜索字符串内部的文本以及替换字符串中的文本。它可以是一个单个字符，也可以是一个更复杂的模式。\n\
    \n正则表达式可以通过以下两种方式之一构建：\n\n*   使用正则表达式字面量（regular expression literal）\n*   调用 `RegExp`\
    \ 对象的构造函数。\n\n让我们进入更多细节。\n\n## 使用正则表达式字面量\n\n正则表达式字面量由包含在斜杠之间的模式组成，例如：\n\n```javascript\n\
    let exp = /ab+c/;\n```\n\n正则表达式字面量有助于正则表达式在脚本加载时被编译。如果一个正则表达式保持不变，使用正则表达式字面量可以提高性能。\n\
    \n## 调用 RegExp 对象的构造函数\n\n你通过使用关键字 `new`（在 `第 2 章：JavaScript 对象` 中已解释）来调用 `RegExp`\
    \ 对象的构造函数，例如：\n\n```javascript\nlet exp = new RegExp('‘ab+c’);\n```\n\n当你知道正则表达式模式可能会发生，或者你不知道模式并正在从其他来源获取它时，这种方法是最好的。\n\
    \n正则表达式模式可以由简单字符组成，例如 `/xyz/`，也可以由简单字符和特殊字符组合，例如 `/xy*z/` 或 `/Student Number (\\\
    d+)\\.\\d*/`。稍后我会详细介绍模式。现在，让我们来看正则表达式的修饰符。\n\n# 正则表达式修饰符/标志\n\n所有的正则表达式都可以包含影响搜索的修饰符或标志。`JavaScript`\
    \ 有 6 个标志，如下表所示：\n\n| 修饰符 | 描述 |\n| :--- | :--- |\n| `i` | 不区分大小写的搜索 |\n| `g`\
    \ | 搜索所有匹配项 |\n| `m` | 多行模式 |\n| `s` | 启用点全模式（dotall） |\n| `u` | 启用全 Unicode 支持\
    \ |\n| `y` | 粘性模式（Sticky mode）。在精确位置搜索 |\n\n**表 17.1:** 正则表达式标志\n\n正则表达式显然有很多需要学习的，但我觉得我们可以做一个快速练习，将我们目前所学的内容整合在一起。\n\
    \n这个练习利用了上述标志和 `match` 方法（字符串函数在 `第 12 章：变量` 中介绍过）来使用正则表达式查找某些文本。\n\n1.  打开你选择的文本编辑器并输入以下\
    \ HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n    <h1>RegEx Example 1</h1>\n\
    \    <p>RegEx Example 1</p>\n    <script>\n        let str = “Ob-La-Di, ob-la-da”;\n\
    \        document.write( str.match(/Ob/gi) + “</br>” ;\n        let result = str.match(/La/i);\n\
    \        document.write( result[0] + “</br>”) ;\n        document.write( result.length\
    \ + “</br>”) ;\n        // Details:\n        document.write( result.index + “</br>”)\
    \ ;\n        document.write( result.input + “</br>”) ;\n        try {\n      \
    \      let matches = str.match(/JavaScript/);\n            if (!matches.length)\
    \ {\n            }\n        } catch(err) {\n            document.write(“Error\
    \ in the line above”);\n        }\n    </script>\n</body>\n</html>\n```\n\n2.\
    \  用 HTML 扩展保存文件，例如 `Chapter 17.1.html`。\n3.  双击文件在默认浏览器中打开它。\n\n上述代码的输出显示如下所示：\n\
    \n![](img/Img_17_01.jpg)\n\n**图 17.1:** `string.match` 正则表达式\n\n我首先创建一个包含 `Ob-La-Di,\
    \ ob-la-da` 的字符串。这是一首 1968 年发行的披头士老歌，仍然是经典。无论如何，然后我使用了字符串的 `match` 方法来搜索术语 `Ob`。因为我提供了\
    \ `g` 和 `i` 修饰符，它忽略字符串中的大小写搜索了所有的 `Ob` 实例。\n\n接下来，我创建名为 `results` 的变量，它将是正则表达式搜索\
    \ `La` 的结果。注意我在这里没有包含 `g` 标志，所以只会找到第一个实例。它的索引是。最后，我包含了 `try` 和 `catch` 块来演示当没有匹配项时该做什么。\n\
    \n# 正则表达式模式\n\n正则表达式模式可以由简单字符组成，例如 `/xyz/`，也可以由简单字符和特殊字符组合，例如 `/xy*z/` 或 `/Student\
    \ Number (\\d+)\\.\\d*/`。以下是你可以使用的特殊字符列表：\n\n| 字符 | 描述 |\n| :--- | :--- |\n| `\\\
    ` | 当反斜杠位于字符之前，表示该字符是特殊的且不进行解释 |\n| `^` | 匹配输入的开头 |\n| `$` | 匹配输入的结尾 |\n| `*`\
    \ | 匹配前面的表达式 0 次或多次 |\n| `+` | 匹配前面的表达式 1 次或多次 |\n| `?` | 匹配前面的表达式 0 次或 1 次 |\n\
    | `.` | 匹配除换行符以外的单个字符 |\n| `(x)` | 匹配 `x` 并记录结果 |\n| `(?:x)` | 匹配 `x` 但不记录结果 |\n\
    | `x(?=y)` | 仅当 `x` 后面跟着 `y` 时匹配 `x` |\n| `x(?!y)` | 仅当 `x` 后面不是 `y` 时匹配 `x` |\n\
    | `(?<=y)x` | 仅当 `x` 前面是 `y` 时匹配 `x` |\n| `(?<!y)x` | 仅当 `x` 前面不是 `y` 时匹配 `x`\
    \ |\n| `x|y` | 匹配 `x` 或 `y`（当没有匹配到 `x` 时） |\n| `{n}` | 匹配表达式 `n` 次 |\n| `{n,}`\
    \ | 匹配前面的表达式至少 `n` 次 |\n| `{n,m}` | 匹配前面的表达式至少 `n` 次最多 `m` 次 |\n| `[xyz]` | 匹配括号内的任意一个字符\
    \ |\n| `[^xyz]` | 匹配不在括号内的任意内容 |\n| `[\\b]` | 匹配退格符 |\n| `\\b` | 匹配单词字符与非单词字符之间的边界\
    \ |\n| `\\B` | 匹配以下位置： |\n\n*   字符串第一个字符之前 |\n\n*   字符串最后一个字符之后 |\n\n*   两个单词字符之间\
    \ |\n\n*   两个非单词字符之间 |\n\n*   空字符串。 |\n| `\\cX` | 匹配字符串中的控制字符 |\n| `\\d` | 匹配数字字符\
    \ |\n| `\\D` | 匹配非数字字符 |\n| `\\f` | 匹配分页符 |\n\n"
- fmt: "\n| Pattern | Description |\n| --- | --- |\n| `\\n` | Matches a line feed\
    \ |\n| `\\r` | Matches a carriage return. |\n| `\\s` | Matches a white space character.\
    \ |\n| `\\S` | Matches a character other than white space. |\n| `\\t` | Matches\
    \ a tab. |\n| `\\v` | Matches a vertical tab. |\n| `\\w` | Matches any alphanumeric\
    \ character. |\n| `\\W` | Matches any non-word character. |\n| `\\0` | Matches\
    \ a NULL character. |\n| `\\xhh` | Matches the character with the code `hh` (two\
    \ hexadecimal digits). |\n| `\\uhhhh` | Matches the character with the code `hhhh`\
    \ (four hexadecimal digits). |\n\nTable 17.2: Special character patterns\n\nLet’s\
    \ do a quick exercise!\n\n1. Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code:\n\n```html\n<html><body><h1>RegEx Example 2</h1><p>RegEx\
    \ Example 2</p><script>\nvar Num = /^\\d{10}$/;\nconsole.log(Num.test‘7795483645’));\n\
    var Dt = /^(\\d{1,2}-){2}\\d{2}(\\d{2})?$/;\nconsole.log(Dt.test‘01-01-1990’));\n\
    console.log(Dt.test‘01-01-90’));\nvar Txt = /^(.{3}\\.){3}.{3}$/;\nconsole.log(Txt.test‘abc.def.123.456’));\n\
    console.log(Txt.test‘abc.def.ghi.jkl’));\n</script></body></html>\n```\n\n2. Save\
    \ the file with an HTML extension, for example `Chapter 17.2.html`.\n3. Double-click\
    \ the file to open it in the default browser.\n4. Press `Ctrl` + `Shift` + `F12`\
    \ in Google Chrome to open the console window.\n\nThis looks seriously complicated!\
    \ It isn’t. Let me break it down.\n\n* The variable `Num` contains a regular expression\
    \ pattern.\n    * In this pattern, you ensure that the match spans the whole string\
    \ by including `^` at the beginning and the `$` at the end of the string.\n  \
    \  * The `\\d` in the expression matches digits.\n    * `{10}` matches the previous\
    \ expression exactly 10 times.\n* The variable `Dt` also starts with `^` and ends\
    \ with `$` to look at the whole string.\n    * The first open bracket starts the\
    \ first sub-expression.\n    * `\\d{1,2}` matches 1 digit but can have at most\
    \ 2 digits.\n    * A hyphen character gets matched.\n    * The closing bracket\
    \ ends the first sub-expression.\n    * `{2}` matches the first sub-expression\
    \ 2 times.\n* The variable `Txt` is only allowed to have string input which consists\
    \ of four three-letter groups, each separated by dots.\n\nIn each of the expressions,\
    \ the `test` method is used. This will return either true or false, depending\
    \ on whether the expression will be successful.\n\nThe result is shown in the\
    \ following screenshot:\n\n![](images/Img_17_02.jpg)\n\nFigure 17.2: Regular expressions\
    \ in action\n\nAll the tests are successful.\n\nLet’s do another exercise just\
    \ to make sure you understand the concepts.\n\n1. Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n```html\n<html><body><h1>RegEx\
    \ Example 3</h1><p>RegEx Example 3</p><script>\nvar regex1 = /lo{2}t/;\nconsole.log(regex1.test‘loot’));\n\
    console.log(regex1.test‘lot’));\nvar regex2 = /[hm]ail/;\nconsole.log(regex2.test‘hail’));\n\
    console.log(regex2.test‘mail’));\nconsole.log(regex2.test‘nail’));\nvar regex3\
    \ = /\\d+/;\nconsole.log(regex3.test‘7’));\nconsole.log(regex3.test‘77845’));\n\
    console.log(regex3.test‘77777723’));\nvar regex4 = /(green|red) apple/;\nconsole.log(regex4.test‘green\
    \ apple’));\nconsole.log(regex4.test‘red apple’));\nconsole.log(regex4.test‘orange\
    \ apple’));\n</script></body></html>\n```\n\n2. Save the file with an HTML extension,\
    \ for example `Chapter 17.3.html`.\n3. Double-click the file to open it in the\
    \ default browser.\n4. Press `Ctrl` + `Shift`+ `J` or `F12` in Google Chrome to\
    \ open the console window.\n\n[Figure 17.3] shows the results of the tests:\n\n\
    ![](images/Img_17_03.jpg)\n\nFigure 17.3: More regular expression tests\n\nLet’s\
    \ have a look and see what gets tested here. The first object, `regex1` tests\
    \ for two words: `loot` and `lot`. Loot succeeds, but a lot does not. Why? Well\
    \ because you have indicated that you need 2 characters before the ending t.\n\
    \nThe object `regex2` succeeds when testing for `hail` and `mail`, but not for\
    \ `nail`. This is because the `n` character wasn’t specified in the regular expression\
    \ pattern. Only `h` and `m` were specified.\n\nAll tests for `regex3` succeed\
    \ because all of them contain at least one number.\n\n`regexp4` tests for either\
    \ a `green apple` or a `red apple`. When supplied with the text `orange apple`\
    \ it failed.\n\n# Conclusion\n\nIn this chapter, we have learnt what regular expressions\
    \ are and how to use them productively when searching for text or validating text.\
    \ It is an important skill to know, but luckily it is not too complicated once\
    \ you get the hang of the modifiers and patterns.\n\nThe next chapter is the last\
    \ chapter in the *Advanced Concepts* section. You will revisit functions for a\
    \ while and then dive into currying and partials.\n\n# Questions\n\n1. Define\
    \ the term regular expression.\n2. Name two ways regular expressions can be constructed.\n\
    3. Name three regular expression flags.\n\n# CHAPTER 18\n\n# Partials and Currying\n\
    \n# Introduction\n\nJavaScript functions can be made much easier and be customized\
    \ to make use of specific arguments when needed.\n\nIn this lesson, you will learn\
    \ the difference between normal JavaScript functions, partials, and currying.\n\
    \n# Structure\n\n* Partials\n* Currying\n\n# Objectives\n\n* Understand the partial\
    \ application functional programming concept.\n* Understand the currying functional\
    \ programming concept.\n\n# Partials\n\nPartials or partial applications fix the\
    \ value of a few of a function’s arguments without really fully evaluating the\
    \ function. This produces another function of smaller arguments which binds values\
    \ to one or more of those arguments as the chain of function progressed.\n\nJavaScript\
    \ contains a built-in method named `bind` that can work on functions with any\
    \ number of arguments and can bind an arbitrary number of parameters.\n\nTo invoke\
    \ the `bind` method, make use of the following syntax:\n\n`function.prototype.bind(thisValue,\
    \ [argument1], [argument2], …)`\n\nThe `bind` method turns the function into a\
    \ new function whose implicit `this` parameter is this value and whose initial\
    \ arguments are always as given.\n\nTo better understand the concept of the partial,\
    \ let’s do a practical exercise and dissect it piece by piece, as usual.\n\n1.\
    \ Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n```html\n<html><body><h1>Partials Example</h1><p>Partials Example</p><script>\n\
    function add (x, y) {\nreturn x + y;\n}\nfunction double (num) {\nreturn add(2,\
    \ num);\n}\nfunction addAgain (x, y) {\nreturn x + y;\n}\nvar doubleAgain = addAgain.bind(null,\
    \ 2);\nconsole.log(double);\nconsole.log(doubleAgain);\n</script></body></html>\n\
    ```\n\n2. Save the file with an HTML extension, for example `Chapter 18.1.html`.\n\
    3. Double-click the file to open it in the default browser.\n4. If the browser\
    \ is Google Chrome, press `Ctrl` + `Shift` + `J` to open the console window.\n\
    \nThe output of the above code is shown in the following screenshot:\n\n![](images/Img_18_01.jpg)\n\
    \nFigure 18.1: Partials example binding\n\nFunction `add` is the normal way in\
    \ JavaScript in calling a function and using it. The function `addAgain` demonstrates\
    \ binding in action. As you can see, not all parameters have values supplied,\
    \ but the JavaScript compiler doesn’t complain at all.\n\nLet’s do a more complex\
    \ example.\n\n1. Open a text editor of your choice and enter the following HTML\
    \ and JavaScript code:\n"
