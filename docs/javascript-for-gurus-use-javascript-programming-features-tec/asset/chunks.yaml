    \ on operands</p>`\n\n    `<script>`\n\n    `//Normal if condition`\n\n    `var\
    \ age = 21;`\n\n    `var canEnterCollege;`\n\n    `if (age > 18) {`\n\n    `canEnterCollege\
    \ = “Old enough”;`\n\n    `}`\n\n    `else {`\n\n    `canEnterCollege = “Too young”;`\n\
    \n    `}`\n\n    `alert(canEnterCollege);`\n\n    `//Shortened by ternary conditional\
    \ operator`\n\n    `var canEnterCollege = (age < 18) ?` `“Too young” : “Old enough”;`\n\
    \n    `alert(canEnterCollege);`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\
    \n2.  Save the file with an HTML extension, for example `Chapter 4.2.html`.\n\n\
    3.  Double-click the file to open it in the default browser.\n\nOnce loaded, the\
    \ web page will produce a total of two alert boxes, one after the other. In the\
    \ above example, the following answers were produced.\n\nThe variable named `canEnterCollege`\
    \ has a value of `21`. In the first control-flow statement (we will cover control-flow\
    \ statements in *[Chapter 13: Control Flow Statements](#c13.xhtml)*) we test if\
    \ the variable `canEnterCollege` is greater than `18`. If it is, the alert will\
    \ display `old enough`; `else`, another alert will show `Too young`.\n\nIn the\
    \ last segment of the code, notice the use of both the `?` and `:`. The condition\
    \ is written in brackets – in this case, age `< 18`. If the condition is true,\
    \ the code next to the `?` (question-mark) will execute, if the condition is false\
    \ (`age` is not less than 18), the code next to the `:` (colon) will fire.\n\n\
    # [Operator precedence](#toc.xhtml_s78a)\n\nIn the event that expression has more\
    \ than one operator, the order of execution is defined by their priority order,\
    \ that is, precedence. The next table shows the operator precedence in JavaScript:\n\
    \n| **Operator type** | **Individual operators** |\n\n| Grouping | `()` |\n\n\
    | Member access | `.` |\n\n| Computed member access | `[ ]` |\n\n| new (with argument\
    \ list) | `new ( )` |\n\n| Function call | `( )` |\n\n| Optional chaining | `?.`\
    \ |\n\n| new (without argument list) | `new` |\n\n| Postfix increment | `++` |\n\
    \n| Postfix decrement | `--` |\n\n| Logical NOT | `!` |\n\n| Bitwise NOT | `~`\
    \ |\n\n| Unary plus | `+` |\n\n| Unary negation | `-` |\n\n| Prefix increment\
    \ | `++` |\n\n| Prefix decrement | `--` |\n\n| typeof | `typeof` |\n\n| void |\
    \ `void` |\n\n| delete | `delete` |\n\n| await | `await` |\n\n| Exponentiation\
    \ | `**` |\n\n| Multiplication | `*` |\n\n| Division | `/` |\n\n| Remainder |\
    \ `%` |\n\n| Addition | `+` |\n\n| Subtraction | `-` |\n\n| Bitwise left shift\
    \ | `<<` |\n\n| Bitwise right shift | `>>` |\n\n| Bitwise unsigned right shift\
    \ | `>>>` |\n\n| Less than | `<` |\n\n| Less than or equal | `<=` |\n\n| Greater\
    \ than | `>` |\n\n| Greater than or equal | `>=` |\n\n| In | `in` |\n\n| instanceof\
    \ | `instanceof` |\n\n| Equality | `==` |\n\n| Inequality | `!=` |\n\n| Strict\
    \ equality | `===` |\n\n| Strict inequality | `!==` |\n\n| Bitwise AND | `&` |\n\
    \n| Bitwise XOR | `^` |\n\n| Bitwise OR | `&#124;` |\n\n| Logical AND | `&&` |\n\
    \n| Logical OR | `&#124;&#124;` |\n\n| Conditional | `?` `:` |\n\n| Assignment\
    \ | `=` |\n\n| `+=` |\n\n| `-=` |\n\n| `**=` |\n\n| `*=` |\n\n| `/=` |\n\n| `%=`\
    \ |\n\n| `<<=` |\n\n| `>>=` |\n\n| `>>>=` |\n\n| `&=` |\n\n| `^=` |\n\n| `&#124;=`\
    \ |\n\n| yield | `yield` |\n\n| yield* | `yield*` |\n\n| Comma / Sequence | `,`\
    \ |\n\n**Table 4.6:** Operator precedence\n\n# [That’s not all](#toc.xhtml_s79a)\n\
    \nWe have covered a lot of functions and a lot of different operators in this\
