    \ JavaScript Productively）章节的最后一章。在本章中，我们学习了编写良好代码以及利用所有可用调试和编码工具的重要性。代码结构越良好，导航和调试就越易如反。\n\
    \n在下一章中，我们将开启*高级概念*（Advanced Concepts）章节，并将涵盖 JavaScript 中的数组。虽然你可能已经见过这个术语，甚至在书中的代码中使用过它们，但你并不了解所有的复杂细节以及如何高效地使用它们。这就是你接下来要做的。\n\
    \n# 问题\n\n1. 写出 JavaScript 中两种最常见的错误类型\n2. `console.time` 和 `console.timeEnd`\
    \ 关键字的作用是什么？\n3. 如何在调试器中暂停代码？\n4. 为什么需要使用 `try…catch`？\n5. 写出 JavaScript 中的两种注释类型。\n\
    \n# 第四部分\n\n# 高级概念\n\n# 引言\n\n第 4 节探索了 JavaScript 的一些高级概念。第 16 章涉及数组。你将学习如何高效地创建和使用数组。第\
    \ 17 章探索了正则表达式的世界，并演示了搜索字符串中的文本以及限制文本输入有多简单。第 18 章将函数向前迈进了一大步，解释了部分应用和柯里化等函数编程概念。\n\
    \n本节包含：\n\n1. 数组\n2. 正则表达式\n3. 部分应用与柯里化。\n\n# 第 16 章\n\n# JavaScript 数组\n\n# 引言\n\
    \n数组让你能够在命名的容器内存储多个值。你通过使用数组的索引来访问数组元素。\n\n在本节中，你将学习如何向数组中添加和删除元素，如何访问项目以及如何遍历数组。\n\
    \n# 结构\n\n*   数组\n    * 创建数组\n        * 向数组中添加项目\n        * 从数组中删除项目\n    * 多维数组\n\
    \n# 目标\n\n* 理解数组是什么以及你可以用它们做什么。\n* 了解向数组中添加元素的各种方式。\n* 了解从数组中删除项目的各种方式。\n* 了解什么是多维数组。\n\
    \n# 数组\n\n在某些情况下，普通的对象是不够的。如果我有一组想要存储的信息（例如结果）怎么办？在这种情况下，一个对象无法存储多个值。数组是一个组织良好的值列表。你可能记得我在书中到为止已经多次提到过这个术语，但我从未详细地解释过它。\n\
    \n# 创建数组\n\n创建数组本质上有两种方法：\n\n* `let arr = new Array();`\n* `let arr = [];`\n\n\
    虽然后者更受青睐，但我将从实践角度解释两种方法。\n\n# 方法 1\n\n第一种方法利用 `Array` 关键字来创建数组。有一种简单的方法和一种困难的方法，正如你很快将在接下来的练习中看到的：\n\
