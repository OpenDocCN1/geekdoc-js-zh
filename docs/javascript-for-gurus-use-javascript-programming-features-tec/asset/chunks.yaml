    * Import module functions in JavaScript and HTML

    * Know the benefits of modules

    * Understand CORS and how to fix CORS problems

    * Understand what Bundlers are


    # What are the modules?


    In `[Chapter 1: Overview of the Power of JavaScript and Its Purpose](#c01.xhtml)]`,
    we discussed the history and origin of the JavaScript language. Fast-forward a
    decade or two and the language have grown tremendously and the need for it even
    more.


    Where JavaScript was used to provide interactivity and a few scripting tasks,
    it is now used much more. Simply put: without JavaScript, there is no webpage
    in 2019.


    In older days, when developers needed similar functionality in their pages, they
    simply copied and pasted the scripts to each page or created JavaScript libraries.
    Organizing large and common scripts were problematic and difficult to do. Luckily,
    today there exists a mechanism for organizing large scripts, these are called
    modules.


    # Modules


    A module is a file containing JavaScript code, allowing you to divide your web
    application into logical pieces. Modules are self-contained with distinct and
    specific functionality. This allows developers to remove them or add new ones,
    without disrupting the whole application.


    # Benefits of modules


    Benefits of using manifests include the following:


    * **Reusability**: Having scripts or functions that are reusable saves a lot of
    time. You do not have to edit the same code at different places; you do not have
    to make the same changes at different places. The code in a module is reusable
    - you only have to change it inside the module when needed, and the code can be
    used at different places easily.

    * **Maintainability**: A module is self-contained. Modules lessen dependencies
    on parts of the script’s code because updating modules are decoupled from the
    other pieces of code.

    * **Avoid namespace pollution**: Variables outside the scope of top-level functions
    are global. This causes namespace pollution, where unrelated code shares global
    variables. Modules enable you to avoid this by creating a private space for variables.


    # Working with modules


    Modules can call functions of one module from another one and interchange functionality
    by using the `export` and `import` keywords.


    # Exporting modules


    The `export` keyword identifies variables and functions you want to expose to
    other modules. The best way to explain how to export module functions is to do
    it, so let’s do an exercise!


    The following sample creates a small module with two functions that can be exported
    and used by other modules:


    1. Open a text editor of your choice and enter the following JavaScript code:


    ```javascript

    export function sayHello(name) {

    alert(‘Hello, ${name}!’);

    }

    export function sayBye(name) {

    alert(‘Bye, ${name}!’);

    }

    ```


    2. Save the file with a `.mjs` extension, for example `greet.mjs`.


    By saving the file with an `.mjs` extension, you indicate that there is no other
    code in it, thus making it a module. The `.mjs` extension helps to keepyour JavaScript
    modules and JavaScript classes more organized. This module contains simple two
    functions that simply produces an alert box with aspecific greeting.


    The most important thing to note here is the little word: `export`. This allows
    the function to be used from other modules.


    We will continue with this example as we go on with this chapter, so, leave the
    file as is for now.


    # Importing modules


    The `import` keyword enables you to import functionality from other modules. Let’s
    see how to import functions from an existing module into another module:


    1. Open a text editor of your choice and enter the following JavaScript code:


    ```javascript

    import {sayHello} from ‘./greet.mjs’;

    import {sayBye} from ‘./greet.mjs’;

    alert(sayHello); // function…

    sayHello(‘Ockert’); // Hello, Ockert!

    alert(sayBye); // function…

    sayBye(‘Ockert’); // Bye, Ockert!

    ```


    2. Save the file with a `.mjs` extension, for example,main.mjs`.


    As you can see, it is quite easy to import functions from other modules. All you
    need is to use the `import` keyword to import the desired function from the module
    in question. So, in the code above, you import the sayHello and sayBye functions
    from the module named greet.js.


    After the functions have been imported, they can be used as ordinary functions.
    Let’s now see how we can import a function into an HTML web page.


    The following sample demonstrates how to import a module into your web pages:


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <!doctype html>

    <body>

    <h1>Import module functions example</h1>

    <p>Import module functions example</p>

    <script type=”module">

    import {sayHello} from ‘./greet.mjs’;

    import {sayBye} from ‘./greet.mjs’;

    document.body.innerHTML = sayHello(‘Ockert’);

    //document.body.innerHTML = sayBye(‘Ockert’);

    </script>

    </body>

    </html>

    ```


    2. Save the file with an HTML extension, for example `Chapter 11.1.html`.

    3. Double-click the file to open it in the default browser.

    4. If the browser is Google Chrome, press `Ctrl` + `Shift` + `J` to open the console
    window.


    We identify the script type as a module, and then we import the functions. Now,
    this may or may not work, as shown in `[Figure 11.1](#c11.xhtml_fig11_1)` below.
    Why? Because of CORS:


    ![](images/Img_11_01.jpg)


    **Figure 11.1:** Error in the console window


    Another way to import a module is next.


    The following sample demonstrates how to import a module into your web pages:


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <html>

    <body>

    <h1>Import module functions example</h1>

    <p>Import module functions example</p>

    <script type=”module” src=”greet.mjs"></script>

    <script>

    document.body.innerHTML = sayHello(‘Ockert’);

    document.body.innerHTML = sayBye(‘Ockert’);

    </script>

    </body>

    </html>

    ```


    2. Save the file with an HTML extension, for example `Chapter 11.2.html`.

    3. Double-click the file to open it in the default browser.

    4. If the browser is Google Chrome, press `Ctrl` + `Shift` + `J` to open the console
    window.


    The source of the script file gets set to the module in question. This is a bit
    quicker and legible. Both web pages may throw errors because of **Cross-Origin
    Resource Sharing** (**CORS**). Let me explain what it is.


    # Cross-Origin Resource Sharing (CORS)


    **Cross-Origin Resource Sharing** (**CORS**) makes use of additional HTTP headers
    to inform browsers to give the web application access to selected resources from
    a different origin. This usually occurs when a web application requests a resource
    that has a different domain or protocol or port, from its own.


    CORS adds new HTTP headers to describe which origins are permitted to read information
    from a web browser. For HTTP request methods other than GET and POST, that could
    cause side-effects on server data, and browsers should preflight the request.
    This solicits supported methods from the server via the `HTTP OPTIONS` request
    method.


    Here is how it works.


    Suppose a user visits the following website: [http://www.javascriptforgurus.comand](http://www.javascriptforgurus.comand)
    a page on the site attempt a cross-origin request to fetch some data from [http://service.javascriptforgurus.com](http://service.javascriptforgurus.com).
    A CORS-compatible browser will attempt to make a cross-origin request to `service.javascriptforgurus.com`
    in the following way.


    The CORS-compatible browser sends an `OPTIONS` request with an `Origin` header
    to [http://service.javascriptforgurus.com](http://service.javascriptforgurus.com)
    containing the domain that served the parent page:

