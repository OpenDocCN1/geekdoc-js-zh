    A nice feature of the JavaScript language is that it’s able to do tasks asynchronously.
    Synchronous tasks can block other needed tasks, thus delaying instructions. Being
    able to do tasks independently and not to worry about when they will finish is
    very helpful. It is also quite easy to set up.


    In this lesson, you will learn how to create promises to enable more `async` features
    on your pages. We will also have a look at callbacks and how to chain multiple
    promises.


    ## Structure

    * JavaScript Promises description

    * Synchronous versus asynchronous methods

    * Chaining Promises

    * Callbacks and Promisification

    * Microtasks and macrotasks

    * Promise methods


    ## Objectives

    * Learn what Promises are

    * Understand the difference between synchronous and asynchronous methods

    * Understand the difference between macrotasks and microtasks

    * Learn how to make multiple promises work together


    ## JavaScript Promises description

    A dictionary explains the noun `promise` as the following: A declaration or assurance
    that one will do something or that a particular thing will happen. So, what happens
    when a promise is made between two parties?


    A promise gives one party the assurance that something will be done. Whether the
    task will be done by the party that has made the promise, or someone else is immaterial.
    The assurance is given, based on which the other party can plan something.


    Promises can either be kept or broken. This is where different routes develop,
    and different scenarios should be catered for. When a promise is kept the one-party
    expects something out of that promise. This allows the party to make use of the
    promise’s output for its further actions or plans. When a promise is broken, one-party
    should know why the promise was not kept. Once the party knows the reason for
    the promise not being kept, the party can plan what to do next or how to handle
    it.


    Upon making a promise, both parties have an assurance that a task will get done
    and they can decide a course of action when the promise is kept, or when the promise
    is broken.


    The party that has made the promise may even never respond at all. What happens
    then?


    In such cases, one party should keep a time threshold. For example: if the promising
    party doesn’t respond in a given time, the promised party may realize that the
    promise may not be kept, due to unforeseen circumstances. Even then if the promising
    party responds later than what it was supposed to, it doesn’t matter, because
    the promised party may have made alternate plans already.


    ## JavaScript promises

    A JavaScript promise works similar to an ordinary promise, as explained above.
    You can associate handlers with an asynchronous action’s success value or failure
    reason. Instead of immediately returning the success or failure value, the asynchronous
    method returns a promise to supply the appropriate value eventually.


    A Promise has three states:

    * `pending`: this is the promise’s initial state. The promise is neither fulfilled
    nor rejected (the other two states).

    * `resolved`: this means that the promise’s operation has completed successfully.

    * `rejected`: this means that the promise’s operation has failed.


    JavaScript promises can either be fulfilled with a value or rejected with a reason
    - an error. Depending on which of these options happens, the associated handlers
    queued up by a promise’s `then` method is called. We will do some examples now.


    The following sample shows a resolved promise in action:


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:

    ```html

    <html>

    <body>

    <h1>Promise resolve example</h1>

    <p>Promise resolve example</p>

    <script>

    let promise = new Promise(function(resolve, reject) {

    setTimeout(() => resolve(“Success!”), 5000); //5000 milliseconds = 5 seconds

    });

    promise.then(

    result => alert(result), //Displays “Success!” after 5 seconds, if successful

    error => alert(error) // doesn’t run

    );

    </script>

    </body>

    </html>

    ```

    2. Save the file with an HTML extension, for example `Chapter 9.1.html`.

    3. Double-click the file to open it in the default browser.


    In the above code segment, you created a new `Promise` with two arguments – `resolve`
    and `reject`. Inside the Promise, you make use of the built-in JavaScript timer
    function named `setTimeout` to start a timer. After 5 seconds, it should display
    a message of `Success!`.


    When the `Promise` has completed its task, it will either return a reject message
    or a resolved message. In this case, an alert box with the message of `Success!`will
    pop-up. This looks like [Figure 9.1] underneath:


    ![](images/Img_09_01.jpg)

    **Figure 9.1:** Resolved Promise


    Let’s do an example of a rejected promise next.


    The following sample shows a rejected promise in action:


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:

    ```html

    <html>

    <body>

    <h1>Promise resolve example</h1>

    <p>Promise resolve example</p>

    <script>

    let promise = new Promise(function(resolve, reject) {

    setTimeout(() => reject(new Error(“Failure!”)), 5000); //5000 milliseconds = 5
    seconds

    });

    promise.then(

    result => alert(result), // doesn’t run

    error => alert(error) //Displays “Error: Failure!” after 5 seconds

    );

    </script>

    </body>

    </html>

    ```

    2. Save the file with an HTML extension, for example `Chapter 9.2.html`.

    3. Double-click the file to open it in the default browser.


    When the `Promise` has completed its task, it will either return a reject message
    or a resolvedmessage. In this case, an alert box with the message of `Error: Failure!`
    shows. This looks like [Figure 9.2] underneath:


    ![](images/Img_09_02.jpg)

    **Figure 9.2:** Rejected Promise


    I have mentioned asynchronous and synchronous methods and tasks earlier, but what
    are they? Let’s go into greater detail.


    ## Synchronous versus asynchronous methods

    Let’s assume you start your very own cupcake business. It is relatively small,
    so you have direct interaction with your clients. They will order a cupcake or
    two, you will bake the number of cupcakes, and then you will deliver the cupcakes.
    This is synchronous behavior because it is an ask-and-get scenario.


    Imagine further that your cupcakes are really taking off and you get busier, and
    there are even talks of franchising! You cannot be at different places at the
    same time. You cannot serve different customers at the same time. You need help.
    This is where asynchronicity comes in. Asynchronocity allows you to put orders
    on a waiting list and complete them when and if you can.


    When JavaScript does a synchronous task, the browser stops the loading (or rendering)
    of the page so that the code can execute. This blocks the page from finishing
    to load until the code execution completes.


    Asynchronously acts in the opposite way than synchronous. When JavaScript does
    an asynchronous task, the code is processed in parallel to the rest of the page
    content. This means that the page doesn’t stop loading, and it doesn’t slow down
    the loading of the page.


    Let’s do an exampleto demonstrate the differences between synchronous and asynchronous
    tasks.


    The following sample shows synchronous calls in action:


    1. Open a text editor of your choice and enter the following HTML and JavaScript
    code:

    ```html

    <html>

    <body>

    <h1>Synchronous methods example</h1>

    <p>Synchronous methods example</p>

    <script>

    console.log(“First”);

    console.log(“Second”);

    console.log(“Third”);

    </script>

    </body>

    </html>

    ```

    2. Save the file with an HTML extension, for example `Chapter 9.3.html`.

    3. Double-click the file to open it in the default browser.

