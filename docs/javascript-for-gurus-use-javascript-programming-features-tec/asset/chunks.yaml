  trans: "\n\n# 带有换行和空格的 while 循环\n\n```javascript\nvar counter = 0;\nwhile (counter\
    \ <= 100)\n{\n  document.write(counter + \"<br> \");\n  counter++;\n}\n```\n\n\
    以上是一个小型 `while` 循环在添加了一些空格和换行后的简短示例。让我们为 `for` 循环添加一些换行。\n\n# 带有换行和空格的 for 循环\n\
    \n```javascript\nfor (let i = 0; i <= 100; i++)\n{\n  document.write(i + \"<br>\
    \ \");\n}\n```\n\n接下来，是一个很好利用了空格和换行的 `if` 语句示例。\n\n# 带有空格和换行的 if\n\n```javascript\n\
    if (counter > 50)\n{\n  alert(\"stop it!\");\n  break;\n}\n```\n\n这比一堆语句在没有任何空格或换行的情况下堆在一起要好看且读起来也好得多。\n\
    \n# JavaScript 关键字\n\n关键字或保留字是 JavaScript 中具有特定含义的单词。这些单词不能用于命名变量或函数。以下是 JavaScript\
    \ 关键字列表：\n\n| `abstract` | `await` |\n| `arguments` | `boolean` |\n| `break` |\
    \ `case` |\n| `byte` | `catch` |\n| `char` | `const` |\n| `class` | `continue`\
    \ |\n| `debugger` | `delete` |\n| `default` | `do` |\n| `double` | `enum` |\n\
    | `else` | `eval` |\n| `export` | `FALSE` |\n| `extends` | `final` |\n| `finally`\
    \ | `for` |\n| `float` | `function` |\n| `goto` | `implements` |\n| `if` | `import`\
    \ |\n| `in` | `int` |\n| `instanceof` | `interface` |\n| `let` | `native` |\n\
    | `long` | `new` |\n| `null` | `private` |\n| `package` | `protected` |\n| `public`\
    \ | `short` |\n| `return` | `static` |\n| `super` | `synchronized` |\n| `switch`\
    \ | `this` |\n| `throw` | `transient` |\n| `throws` | `TRUE` |\n| `try` | `var`\
    \ |\n| `typeof` | `void` |\n| `volatile` | `with` |\n| `while` | `yield` |\n\n\
    **表 3.1：** JavaScript 关键字\n\n在本书的学习过程中，我们将涵盖这些关键字，因为本章只是一个介绍。\n\n# 结论\n\n在本章中，我们学习了\
    \ JavaScript 语句的细节。我们学习了如何创建语句、语句是如何形成的，然后学习了空白字符和换行。最后，我们快速查看了可用的 JavaScript\
    \ 关键字。\n\n# 第 4 章：JavaScript 运算符\n\n## 引言\n\n运算符允许我们对不同的操作数进行操作。这些操作数可以是我们想要加、减、乘、除的对象名称。有很多运算符，每个运算符都有自己的功能。本章将解释什么是运算符，并将它们分为类别和类型以便更好地理解，并提供了如何使用常用运算符的实用示例。\n\
    \n## 目标\n\n* 什么是运算符？\n* 理解运算符是什么\n* 了解什么是算术运算符\n* 学习比较运算符\n* 理解赋值运算符\n* 比较不同的运算符类型\n\
    * 学习运算符优先级\n\n## 什么是运算符？\n\n运算符可以被解释为行为几乎像函数的结构，但在语义或语法上与普通函数不同。有许多类型的运算符，甚至还有我们很快将涵盖的类别。一些常用的运算符包括：\n\
    \n| 运算符类型/类别 | 运算符(s) |\n| :--- | :--- |\n| 算术 | `+ - / %` |\n| 比较 | `>< <= ===`\
    \ |\n| 逻辑 | `||` |\n| 赋值 | `=` |\n\n**表 4.1：** 通用运算符\n\n## 主要运算符\n\n主要运算符可以归类为实现相似目标的任何运算符类别。主要运算符包括算术、赋值、比较和逻辑运算符。我将在接下来的几个表格和标题中逐一强调每个主要类型。\n\
    \n## 算术运算符\n\n算术运算符主要用于对数字进行算术运算。JavaScript 中可用的算术运算符如表 4.2 所示：\n\n| 运算符类型 | 运算符\
    \ | 描述 |\n| :--- | :--- | :--- |\n| 算术 | `+` | 加法 |\n| 算术 | `-` | 减法 |\n| 算术 |\
    \ `*` | 乘法 |\n| 算术 | `**` | 幂 |\n| 算术 | `/` | 除法 |\n| 算术 | `%` | 取模（余数） |\n| 算术\
    \ | `++` | 增一 |\n| 算术 | `--` | 减一 |\n\n**表 4.2：** 算术运算符\n\n## 比较运算符\n\n比较运算符用于确定值之间的相等性或差异：\n\
    \n| 运算符类型 | 运算符 | 描述 |\n| :--- | :--- | :--- |\n| 比较 | `==` | 等于 |\n| 比较 | `===`\
    \ | 值和类型相等 |\n| 比较 | `!=` | 不相等 |\n| 比较 | `!==` | 值不等或类型不相等 |\n| 比较 | `>` | 大于\
    \ |\n| 比较 | `<` | 小于 |\n| 比较 | `>=` | 大于等于 |\n| 比较 | `<=` | 小于等于 |\n| 比较 | `?`\
    \ | 三元运算符 |\n\n**表 4.3：** 条件运算符\n\n## 逻辑运算符\n\n逻辑运算符用于确定值之间的逻辑关系。JavaScript 中可用的逻辑运算符如表\
    \ 4.4 所示：\n\n| 运算符类型 | 运算符 | 描述 |\n| :--- | :--- | :--- |\n| 逻辑 | `&&` | 逻辑与 |\n\
    | 逻辑 | `||` | 逻辑或 |\n| 逻辑 | `!` | 逻辑非 |\n\n**表 4.4：** 逻辑运算符\n\n## 赋值运算符\n\n赋值运算符将值赋给变量。JavaScript\
    \ 中可用的赋值运算符如表 4.5 所示：\n\n| 运算符 | 示例 | 等价 |\n| :--- | :--- | :--- |\n| `=` | `a\
    \ = b` | `a = b` |\n| `+=` | `a += b` | `a = a + b` |\n| `-=` | `a -= b` | `a\
    \ = a - b` |\n| `*=` | `a *= b` | `a = a * b` |\n| `/=` | `a /= b` | `a = a /\
    \ b` |\n| `%=` | `a %= b` | `a = a % b` |\n| `**=` | `a **= b` | `a = a ** b`\
    \ |\n\n**表 4.5：** 赋值运算符\n\n## 运算符子类型\n\n除了作为运算符具有不同功能外，还有使用各种运算符构建语句的多种方法。在大多数情况下，你需要两个操作数（运算符作用于的对象）和一个运算符。有时你可能需要三个操作数和两个运算符。我所称的运算符子类型列在下方：\n\
    \n* 一元\n* 二元\n* 三元\n\n## 一元运算符\n\n当运算符是一元的时，意味着该运算符只有一个操作数。接下来的示例显示了一些一元运算符的用法：\n\
    \n1.  打开你任选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码\n\n```html\n<html>\n<body>\n  <h1>一元运算符</h1>\n\
    \  <p>以下代码演示了对操作数进行的一元操作</p>\n  <script>\n    let a = 1;\n    let b = 1;\n   \
    \ let c = 5;\n    let d = 5;\n    a = -a;\n    alert( a ); // -1, 应用了一元否定\n  \
    \  b = +b;\n    alert( b ); // +1, 应用了一元加法\n    c++;\n    alert( c ); // 6, 应用了增一\n\
    \    d--;\n    alert( d ); // 4, 应用了减一\n  </script>\n</body>\n</html>\n```\n\n"
- fmt: "\n### 3. Double-click the file to open it in the default browser. \n\nOnce\
    \ loaded, the web page will produce a total of four alert boxes, one after the\
    \ other. In the above example, the following answers were produced:\n\n`The variable\
    \ named a has a value of -1\\.` `This is because we negated it, we made it negative.`\n\
    \n`The variable named b has a value of 1\\.` `It hasn’t changed, because it was\
    \ already positive.`\n\n`The variable named c has a value of 6\\.` `We added one\
    \ to its existing value of 5.`\n\n`The variable named d has a value of 4\\.` `We\
    \ subtracted one from its existing value of 5.`\n\n# Binary operators\n\nWhen\
    \ an operator is binary, it has two operands. The following sample shows some\
    \ binary operators in action:\n\n1. Open a text editor of your choice and enter\
    \ the following HTML and JavaScript code:\n\n```html\n<html>\n<body>\n  <h1>Binary\
    \ Operators</h1>\n  <p>The following code demonstrates Binary operations on operands</p>\n\
    \  <script>\n    let a = 1;\n    let b = 2;\n    let c = 5;\n    let d = 2;\n\
    \    var e;\n    a = a + b;\n    alert( a ); // 3, the value of b is added to\
    \ a\n    b = b - c;\n    alert( b ); // -1, the value of c is subtracted from\
    \ b\n    e = c % d;\n    alert( e ); // 1, The remainder is 1\n  </script>\n</body>\n\
    </html>\n```\n\n2. Save the file with an HTML extension, for example `Chapter\
    \ 4.2.html`.\n\n3. Double-click the file to open it in the default browser.\n\n\
    Once loaded, the web page will produce a total of three alert boxes, one after\
    \ the other. In the above example, the following answers were produced:\n\n`The\
    \ variable named a has a value of 3\\.` `This is because the value of b was added\
    \ to a.`\n\n`The variable named b has a value of -1\\.` `The value of c is subtracted\
    \ from b.`\n\n`The variable named e has a value of 1\\.` `The remainder is 1.`\n\
    \n# Ternary operators\n\nA ternary operator is an operator that takes three operands.\
    \ The following sample shows some binary operators in action:\n\n1. Open a text\
    \ editor of your choice and enter the following HTML and JavaScript code:\n\n\
    ```html\n<html>\n<body>\n  <h1>Ternary Operators</h1>\n  <p>The following code\
    \ demonstrates Ternary operations on operands</p>\n  <script>\n    //Normal if\
    \ condition\n    var age = 21;\n    var canEnterCollege;\n    if (age > 18) {\n\
    \      canEnterCollege = “Old enough”;\n    }\n    else {\n      canEnterCollege\
    \ = “Too young”;\n    }\n    alert(canEnterCollege);\n    //Shortened by ternary\
    \ conditional operator\n    var canEnterCollege = (age < 18) ? “Too young” : “Old\
    \ enough”;\n    alert(canEnterCollege);\n  </script>\n</body>\n</html>\n```\n\n\
    2. Save the file with an HTML extension, for example `Chapter 4.2.html`.\n\n3.\
    \ Double-click the file to open it in the default browser.\n\nOnce loaded, the\
    \ web page will produce a total of two alert boxes, one after the other. In the\
    \ above example, the following answers were produced.\n\nThe variable named `canEnterCollege`\
    \ has a value of `21`. In the first control-flow statement (we will cover control-flow\
    \ statements in *[Chapter 13: Control Flow Statements](#c13.xhtml)*) we test if\
    \ the variable `canEnterCollege` is greater than `18`. If it is, the alert will\
    \ display `old enough`; `else`, another alert will show `Too young`.\n\nIn the\
    \ last segment of the code, notice the use of both the `?` and `:`. The condition\
    \ is written in brackets – in this case, `age < 18`. If the condition is true,\
    \ the code next to the `?` (question-mark) will execute, if the condition is false\
    \ (`age` is not less than 18), the code next to the `:` (colon) will fire.\n\n\
    # Operator precedence\n\nIn the event that expression has more than one operator,\
    \ the order of execution is defined by their priority order, that is, precedence.\
    \ The next table shows the operator precedence in JavaScript:\n\n| Operator type\
    \ | Individual operators |\n| :--- | :--- |\n| Grouping | `()` |\n| Member access\
    \ | `.` |\n| Computed member access | `[ ]` |\n| new (with argument list) | `new\
    \ ( )` |\n| Function call | `( )` |\n| Optional chaining | `?.` |\n| new (without\
    \ argument list) | `new` |\n| Postfix increment | `++` |\n| Postfix decrement\
    \ | `--` |\n| Logical NOT | `!` |\n| Bitwise NOT | `~` |\n| Unary plus | `+` |\n\
    | Unary negation | `-` |\n| Prefix increment | `++` |\n| Prefix decrement | `--`\
    \ |\n| Unary type | `typeof` |\n| Unary void | `void` |\n| Unary delete | `delete`\
    \ |\n| Unary await | `await` |\n| Exponentiation | `**` |\n| Multiplication |\
    \ `*` |\n| Division | `/` |\n| Remainder | `%` |\n| Addition | `+` |\n| Subtraction\
    \ | `-` |\n| Bitwise left shift | `<<` |\n| Bitwise right shift | `>>` |\n| Bitwise\
    \ unsigned right shift | `>>>` |\n| Less than | `<` |\n| Less than or equal |\
    \ `<=` |\n| Greater than | `>` |\n| Greater than or equal | `>=` |\n| In | `in`\
    \ |\n| Instanceof | `instanceof` |\n| Equality | `==` |\n| Inequality | `!=` |\n\
    | Strict equality | `===` |\n| Strict inequality | `!==` |\n| Bitwise AND | `&`\
    \ |\n| Bitwise XOR | `^` |\n| Bitwise OR | `|` |\n| Logical AND | `&&` |\n| Logical\
    \ OR | `||` |\n| Conditional | `?` |\n| Colon | `:` |\n| Assignment | `=` |\n\
    | Addition assignment | `+=` |\n| Subtraction assignment | `-=` |\n| Multiplication\
    \ assignment | `*=` |\n| Division assignment | `/=` |\n| Remainder assignment\
    \ | `%=` |\n| Left shift assignment | `<<=` |\n| Right shift assignment | `>>=`\
    \ |\n| Unsigned right shift assignment | `>>=` |\n| Bitwise AND assignment | `&=`\
    \ |\n| Bitwise XOR assignment | `^=` |\n| Bitwise OR assignment | `|=` |\n| Logical\
    \ AND assignment | `&&=` |\n| Logical OR assignment | `||=` |\n| Null assignment\
    \ | `??=` |\n| Comma | `,` |\n\n### That’s not all\n\nWe have covered a lot of\
    \ functions and a lot of different operators thus far, but we can use operators\
    \ to add strings together. Strings will be covered in *[Chapter 12: Primitive\
    \ Types](#c12.xhtml)*, and was mentioned in *[Chapter 2: Objects](#c02.xhtml)*.\n\
    \nOperators can be used to determine types of objects, and then there are bitwise\
    \ operators. We will cover all of these as we go on.\n\n### Conclusion\n\nIn this\
    \ chapter, we explored the world of operators. We learned what operators are,\
    \ and the different types and groups of operators there are. We had a little fun\
    \ and did some practical examples on unary, binary and ternary. Lastly, we had\
    \ a quick introduction into operator precedence.\n\nIn the next chapter, we will\
    \ learn about functions. JavaScript has many features, but the functions are where\
    \ everything happens. This lesson explores the ins-and-outs of functions.\n\n\
    ### Questions\n\n1. What is the difference between unary, binary, and ternary\
    \ operators?\n2. Explain operator precedence.\n3. Explain the use of the following\
    \ operator: `%`\n4. What is an assignment operator?\n5. What are logical operators?\n\
    \n# CHAPTER 5\n\n# JavaScript Functions\n\n### Introduction\n\nFunctions make\
    \ things happen. We as programmers write functions to be used repeatedly throughout\
    \ our code. It depends on each function where it can be used or when it should\
    \ fire, this is where invocation comes in. We pass information to functions to\
    \ produce similar yet different results.\n\n### Structure\n\n* What are functions?\n\
    * Function declaration\n* Parameters\n* Default values\n* Function expressions\n\
    \n### Objectives\n\n* Understand functions\n* Learn how to declare functions\n\
    * Learn about function parameters\n* Understand function expressions\n"
