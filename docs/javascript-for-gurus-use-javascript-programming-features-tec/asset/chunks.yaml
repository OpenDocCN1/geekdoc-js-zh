- fmt: "\nSearching text in strings can be difficult, especially if you only know\
    \ a portion of a phrase within the string. Luckily JavaScript includes regular\
    \ expressions. Regular expressions help you identify parts of the text with a\
    \ combination of special characters and patterns.\n\nIn this lesson, you will\
    \ learn how to use regular expressions to identify certain pieces of text.\n\n\
    # Structure\n\n*   Regular expression definition\n*   Regular expression modifiers/flags\n\
    *   Regular expression patterns\n\n# Objectives\n\n*   Know what regular expressions\
    \ are.\n*   Know how to use modifiers/flags to improve search results.\n*   Make\
    \ use of patterns to search for text or phrases.\n\n# Regular expression definition\n\
    \nRegular expressions in `JavaScript` are patterns used to match various character\
    \ combinations in strings. This sequence of characters forms a search pattern\
    \ which can be used to search for text inside strings as well as replace text\
    \ in strings. It can be a single character or a more complex pattern.\n\nA regular\
    \ expression can be constructed in either of the following two ways:\n\n*   Using\
    \ a regular expression literal\n*   Calling the constructor function of the `RegExp`-object.\n\
    \nLet’s get into more details.\n\n## Using a regular expression literal\n\nA regular\
    \ expression literal consists of a pattern enclosed between slashes, for example:\n\
    \n```javascript\nlet exp = /ab+c/;\n```\n\nRegular expression literals help the\
    \ regular expression to be compiled upon the loading of the script. If a regular\
    \ expression remains the same, using regular expression literals can improve performance.\n\
    \n## Calling the constructor function of the RegExp object\n\nYou call the constructor\
    \ function of the `RegExp` object by using the keyword `new` (as explained in\
    \ `Chapter 2: JavaScript Objects`), for example:\n\n```javascript\nlet exp = new\
    \ RegExp('‘ab+c’);\n```\n\nGoing this route is best when you know the regular\
    \ expression pattern may change, or you don’t know the pattern and are getting\
    \ it from another source.\n\nRegular expression patterns can consist of simple\
    \ characters, such as `/xyz/`, or a combination of simple and special characters,\
    \ such as `/xy*z/` or `/Student Number (\\d+)\\.\\d*/`. I will get into details\
    \ of the pattern a little bit later. Now, let’s have a look at regular expression\
    \ modifiers.\n\n# Regular expression modifiers/flags\n\nAll regular expressions\
    \ can contain modifiers or flags that can affect the search. `JavaScript` has\
    \ 6 flags, as shown in the table below:\n\n| Modifier | Description |\n| :---\
    \ | :--- |\n| `i` | Case insensitive search |\n| `g` | Searches for all matches\
    \ |\n| `m` | Multiline mode |\n| `s` | Enables dotall mode |\n| `u` | Enables\
    \ full Unicode support |\n| `y` | Sticky mode. Search at the exact position |\n\
    \n**Table 17.1:** Regular expression flags\n\nThere is obviously still a lot to\
    \ learn about regular expressions, but I feel let’s do a quick exercise to fit\
    \ everything we have learned so far together.\n\nThis exercise makes use of the\
    \ above flags and the `match` method (string functions were covered in `Chapter\
    \ 12: Variables`) to find some text using a regular expression.\n\n1.  Open a\
    \ text editor of your choice and enter the following HTML and JavaScript code:\n\
    \n```html\n<html>\n<body>\n    <h1>RegEx Example 1</h1>\n    <p>RegEx Example\
    \ 1</p>\n    <script>\n        let str = “Ob-La-Di, ob-la-da”;\n        document.write(\
    \ str.match(/Ob/gi) + “</br>” ) ;\n        let result = str.match(/La/i);\n  \
    \      document.write( result[0] + “</br>”) ;\n        document.write( result.length\
    \ + “</br>”) ;\n        // Details:\n        document.write( result.index + “</br>”)\
    \ ;\n        document.write( result.input + “</br>”) ;\n        try {\n      \
    \      let matches = str.match(/JavaScript/);\n            if (!matches.length)\
    \ {\n            }\n        } catch(err) {\n            document.write(“Error\
    \ in the line above”);\n        }\n    </script>\n</body>\n</html>\n```\n\n2.\
    \  Save the file with an HTML extension, for example `Chapter 17.1.html`.\n3.\
    \  Double-click the file to open it in the default browser.\n\nThe output of the\
    \ above code is shown in the following screenshot:\n\n![](images/Img_17_01.jpg)\n\
    \n**Figure 17.1:** `string.match` regular expression\n\nI start off by creating\
    \ a string containing `Ob-La-Di, ob-la-da`. An old Beatles song that was released\
    \ in 1968, still a classic. Anyway, then I used the `match` method of string to\
    \ search for the term `Ob`. Because I supplied the `g` and `i` modifiers, it searched\
    \ for all instances of `Ob` irrespective of the case in the string.\n\nNext, I\
    \ created variable named `results` that will the result of the regular expression\
    \ searching for `La`. Notice that I didn’t include the `g` flag here, so only\
    \ the first instance will be found. Its index is. Lastly, I included `try` and\
    \ `catch` block to demonstrate what to do when there are no.\n\n# Regular expression\
    \ patterns\n\nRegular expression patterns can consist of simple characters, such\
    \ as `/xyz/`, or a combination of simple and special characters, such as `/xy*z/`\
    \ or `/Student Number (\\d+)\\.\\d*/`. Below is a list of all the special characters\
    \ you can use:\n\n| Character | Description |\n| :--- | :--- |\n| `\\` | When\
    \ a backslash precedes a character, it indicates that the next character is special\
    \ and must not be interpreted. |\n| `^` | Matches the beginning of input. |\n\
    | `$` | Matches the end of input. |\n| `*` | Matches the preceding expression\
    \ 0 or more times. |\n| `+` | Matches the preceding expression 1 or more times.\
    \ |\n| `?` | Matches the preceding expression 0 or 1 time. |\n| `.` | Matches\
    \ any single character except the newline |\n| `(x)` | Matches `x` and remembers\
    \ the match. |\n| `(?:x)` | Matches `x` but does not remember the match. |\n|\
    \ `x(?=y)` | Matches `x` only if `x` is followed by `y`. |\n| `x(?!y)` | Matches\
    \ `x` only if `x` is not followed by `y`. |\n| `(?<=y)x` | Matches`x`only if `x`is\
    \ preceded by `y`. |\n| `(?<!y)x` | Matches`x`only if`x`is not preceded by`y`.\
    \ |\n| `x&#124;y` | Matches `x`, or `y` (when there is no match for `x`). |\n\
    | `{n}` | Matches `n` occurrences of the expression. |\n| `{n,}` | Matches at\
    \ least `n` occurrences of the preceding expression. |\n| `{n,m``}` | Matches\
    \ at least `n` and at most `m` occurrences of the preceding expression. |\n| `[xyz]`\
    \ | Matches any one of the characters in the brackets. |\n| `[^xyz]` | Matches\
    \ anything not enclosed in the brackets. |\n| `[\\b]` | Matches a backspace. |\n\
    | `\\``b` | Matches the position between a word character followed by a non-word\
    \ character. |\n| `\\B` | Matches the following:\n\n*   Before the first character\
    \ of the string.\n\n*   After the last character of the string.\n\n*   Between\
    \ two-word characters.\n\n*   Between two non-word characters.\n\n*   Empty string.\
    \ |\n| `\\cX` | Matches a control character in a string. |\n| `\\d` | Matches\
    \ a digit character. |\n| `\\D` | Matches a non-digit character. |\n| `\\f` |\
    \ Matches a form feed. |\n"
