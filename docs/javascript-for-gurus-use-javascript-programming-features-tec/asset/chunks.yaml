    \nThe following exercise demonstrates creating a prototype or a class:\n\n1. \
    \ Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>prototypal inheritance example</h1>`\n\
    \n    `<p>prototypal inheritance example</p>`\n\n    `<script>`\n\n    `function\
    \ Student (studentFirstName, studentLastName) {`\n\n    `this.studentFirstName\
    \ = studentFirstName,`\n\n    `this.studentLastName = studentLastName`\n\n   \
    \ `}`\n\n    `Student.prototype.attendClass = function (timeIn, timeOut) {`\n\n\
    \    `console.log(this.studentFirstName + ‘ arrived for class at: ‘ + timeIn +\
    \ ‘ and left at ‘ + timeOut)`\n\n    `}`\n\n    `Student.prototype.writeExam =\
    \ function () {`\n\n    `console.log(this.studentFirstName + ‘ is writing exam.’)`\n\
    \n    `}`\n\n    `const student1 = new Student(‘Ockert’, ‘du Preez’);`\n\n   \
    \ `student1.attendClass(‘10:00’, ‘14:00’);`\n\n    `student1.writeExam()`\n\n\
    \    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file with an\
    \ HTML extension, for example `Chapter 7.4.html`.\n\n3.  Double-click the file\
    \ to open it in the default browser\n\n4.  If the browser is Google Chrome, press\
    \ *Ctrl* + *Shift* + *J* to open the console window. The Console window will look\
    \ similar to *[Figure 7.5](#c07.xhtml_fig7_5)* below:\n\n    ![](images/Img_07_05.jpg)\n\
    \n    **Figure 7.5:** Prototype object\n\nIn the above exercise, you made use\
    \ of a function to create a `Student` and included the `studentFirstName` and\
    \ `studentLastName` parameters. You then added two methods to the `Student` prototype.\
    \ One method is `attendClass` and the last method is `writeExam`. Both functions\
    \ log a string to the browser’s console window, as shown in *[Figure 7.5](#c07.xhtml_fig7_5)*\
    \ above.\n\nBased on the `Student` prototype we have created, we sit with a problem.\
    \ If we want to add a programming student, or a web design student, or a literacy\
    \ student to the project, we’d basically have to duplicate this code for each\
    \ of the classes or prototypes. So, what now? You will have to inherit from the\
    \ `Student` class:\n\nLet’s look at an example.\n\nThe following exercise demonstrates\
    \ prototypal inheritance:\n\n1.  Open a text editor of your choice and enter the\
    \ following HTML and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>prototypal\
    \ inheritance example</h1>`\n\n    `<p>prototypal inheritance example</p>`\n\n\
    \    `<script>`\n\n    `function Student (studentFirstName, studentLastName) {`\n\
    \n    `this.studentFirstName = studentFirstName,`\n\n    `this.studentLastName\
    \ = studentLastName`\n\n    `}`\n\n    `Student.prototype.attendClass = function\
    \ (timeIn, timeOut) {`\n\n    `console.log(this.studentFirstName + ‘ arrived for\
    \ class at: ‘ + timeIn + ‘ and left at ‘ + timeOut)`\n\n    `}`\n\n    `Student.prototype.writeExam\
    \ = function () {`\n\n    `console.log(this.studentFirstName + ‘ is writing exam.’)`\n\
    \n    `}`\n\n    `function ProgrammingStudent(studentFirstName, studentLastName,\
    \ language) {`\n\n    `Student.call(this)`\n\n    `this.language = language`\n\
    \n    `}`\n\n    `const progStudent = new ProgrammingStudent(‘Ockert’, ‘du Preez’,\
    \ ‘JavaScript’)`\n\n    `ProgrammingStudent.prototype = Object.create(Student.prototype)`\n\
    \n    `console.log(progStudent)`\n\n    `console.log(ProgrammingStudent.prototype)`\n\
    \n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file with\
    \ an HTML extension, for example `Chapter 7.5.html`.\n\n3.  Double-click the file\
    \ to open it in the default browser.\n\n4.  If the browser is Google Chrome, press\
    \ *Ctrl* + *Shift* + *J* to open the console window. The Console window will look\
    \ like *[Figure 7.6](#c07.xhtml_fig7_6)* below:\n\n    ![](images/Img_07_06.jpg)\n\
    \n    **Figure 7.6:** Prototypal inheritance\n\nAs you can see, the `ProgrammingStudent`\
    \ class was created without the `attendClass` and `writeExam` methods, but now\
    \ contains them as well. This is because the `ProgrammingStudent` class’ prototype\
    \ has inherited its methods and properties from the `Student` class’ prototype\
    \ on this line:\n\n`ProgrammingStudent.prototype = Object.create(Student.prototype)`\n\
    \n# [Mixins](#toc.xhtml_s116a)\n\nA limiting factor of JavaScript is that we can\
    \ only inherit from a single object because an object can only have one [[Prototype]].\
    \ Another limiting factor of JavaScript is that a class can extend only one other\
    \ class. What if we want to combine features of two or more different classes?\
    \ Or, what if we want to mix-up different classes?\n\nThe answer is *Mixins*.\n\
    \nA Mixin is a class that contains methods which can be used by other classes\
    \ without having to inherit from it.\n\nIn the next exercise you will create a\
    \ Mixin with its methods, then link this Mixin into an existing class.\n\n1. \
    \ Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>Mixin example</h1>`\n\n  \
    \  `<p>Mixin example</p>`\n\n    `<script>`"
