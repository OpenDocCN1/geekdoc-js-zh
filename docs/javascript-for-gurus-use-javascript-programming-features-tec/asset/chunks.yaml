  trans: "\n函数的 `prototype` 属性是一个对象，它包含两个属性：\n\n- `constructor` 属性：它指向 `Student` 函数。\n\
    - `__proto__` 属性：它指向构造函数的原型对象。\n\n# 在原型对象上添加属性\n\n通过在原型对象上附加属性和方法，你可以让使用该构造函数创建的所有对象都共享这些内容。\n\
    \n在下一个练习中，你将向原型对象上附加属性和方法。\n\n以下示例演示了如何向原型对象添加属性：\n\n```html\n<html>\n<body>\n\
    <h1>Add properties to prototype object example</h1>\n<p>Add properties to prototype\
    \ object example</p>\n<script>\nfunction Student(studentFirstName, studentLastName)\
    \ {\n  this.studentFirstName = studentFirstName,\n  this.studentLastName = studentLastName,\n\
    \  this.studentFullName = function() {\n    return this.studentFirstName + “ “\
    \ + this.studentLastName;\n  }\n}\nvar student1 = new Student(“Ockert”, “du Preez”);\n\
    var student2 = new Student(“BpB”, “Publications”);\n//Method 1 - dot notation\n\
    Student.prototype.studentID = ‘Student001’\nconsole.log(Student.prototype.studentID)\n\
    //Method 2 - square brackets\nStudent.prototype[\"studentCourse\"] = ‘JavaScript’\n\
    console.log(Student.prototype)\n</script>\n</body>\n</html>\n```\n\n2. 以 HTML\
    \ 扩展名保存文件，例如 `Chapter 7.3.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\n4. 如果浏览器是 Google Chrome，按下\
    \ `Ctrl` + `Shift` + `J` 打开控制台窗口。控制台窗口将与下方的[图 7.4] 类似：\n\n![](img/Img_07_04.jpg)\n\
    \n**图 7.4：** 添加到原型对象的属性\n\n如果你仔细观察，你会注意到我使用了两种不同的技术向原型对象上附加属性。\n\n我使用的第一种方法是使用点符号（dot\
    \ notation）向 `Student` 原型添加了 `studentID` 属性和值。我使用的下一种方法是方括号。我利用方括号符号技术将 `studentCourse`\
    \ 及其值附加到 `Student` 原型对象上。\n\n# 原型继承\n\n例如，假设我们有各种学生。你真的想为每个学生创建一个独立的类，或者为每个函数原型创建一个独立的实现吗？所有的\
    \ `Student` 对象都包含相似的属性和方法。`Car` 对象包含比其他汽车相似的方法和属性。\n\n现在，如果我们只是想获取一个现有的对象并扩展它呢？答案是原型继承。继承意味着从其他原型继承特征（方法或属性）。继承的好处是，在你继承了对象特征后，可以对其进行扩展，这在创建对象和原型时节省了大量工作，因为你不需要重新创建相似的对象。\n\
    \n让我们来看一个例子。\n\n以下练习演示了如何创建一个原型或类：\n\n```html\n<html>\n<body>\n<h1>prototypal\
    \ inheritance example</h1>\n<p>prototypal inheritance example</p>\n<script>\n\
    function Student (studentFirstName, studentLastName) {\n  this.studentFirstName\
    \ = studentFirstName,\n  this.studentLastName = studentLastName\n}\nStudent.prototype.attendClass\
    \ = function (timeIn, timeOut) {\n  console.log(this.studentFirstName + ‘ arrived\
    \ for class at: ‘ + timeIn + ‘ and left at ‘ + timeOut)\n}\nStudent.prototype.writeExam\
    \ = function () {\n  console.log(this.studentFirstName + ‘ is writing exam.’)\n\
    }\nconst student1 = new Student('Ockert’, ‘du Preez’);\nstudent1.attendClass(‘10:00’,\
    \ ‘14:00’);\nstudent1.writeExam()\n</script>\n</body>\n</html>\n```\n\n2. 以 HTML\
    \ 扩展名保存文件，例如 `Chapter 7.4.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\n4. 如果浏览器是 Google Chrome，按下\
    \ `Ctrl` + `Shift` + `J` 打开控制台窗口。控制台窗口将与下方的[图 7.5] 类似：\n\n![](img/Img_07_05.jpg)\n\
    \n**图 7.5：****\n\n在上面的练习中，你使用函数创建了 `Student` 并包含了 `studentFirstName` 和 `studentLastName`\
    \ 参数。然后你向原型添加了两个方法。其中一个是 `attendClass`，另一个是 `writeExam`。正如你所见，`ProgrammingStudent`\
    \ 类在创建时没有 `attendClass` 和 `writeExam` 方法，但现在包含了它们。这是因为 `ProgrammingStudent` 类的原型通过这一行代码从\
    \ `Student` 类继承了方法和属性：\n\n`ProgrammingStudent.prototype = Object.create(Student.prototype)`\n\
    \n基于我们创建的 `Student` 原型，如果我们想向原型添加编程、Web 设计或文字处理功能，必须为每个功能重复这段代码。\n\n# 混入 (Mixins)\n\
    \nJavaScript 的一个局限性是我们只能继承一个对象，因为一个对象只能有一个 `Prototype`。JavaScript 的另一个局限性是一个类只能扩展另一个其他类。如果我们想合并两个或多个不同类的特征呢？或者，如果我们想混合不同的类呢？\n\
    \n答案是混入（Mixins）。\n\n混入是一个包含方法的类，其他类可以使用这些方法而无需继承自它。\n\n在下一个练习中，你将创建一个带有方法的 Mixin，然后将此\
    \ Mixin 连接到现有的类中。\n\n```html\n<html>\n<body>\n<h1>Mixin example</h1>\n<p>Mixin\
    \ example</p>\n<script>\n</script>\n</body>\n</html>\n```\n"
- fmt: "\n```javascript\n// mixin\nlet HumanMixin = {\n  cry() {\n    alert('Stop\
    \ crying’);\n  },\n  laugh() {\n    alert('Be happy’);\n  }\n};\n\nfunction Student\
    \ (studentFirstName, studentLastName) {\n  this.studentFirstName = studentFirstName,\n\
    \  this.studentLastName = studentLastName\n}\nStudent.prototype.attendClass =\
    \ function (timeIn, timeOut) {\n  console.log(this.studentFirstName + ‘ arrived\
    \ for class at: ‘ + timeIn + ‘ and left at ‘ + timeOut)\n}\nStudent.prototype.writeExam\
    \ = function () {\n  console.log(this.studentFirstName + ‘ is writing exam.’)\n\
    }\nfunction ProgrammingStudent(studentFirstName, studentLastName, language) {\n\
    \  Student.call(this)\n  this.language = language\n}\nProgrammingStudent.prototype\
    \ = Object.create(Student.prototype)\n// copy the methods from HumanMixin\nObject.assign(ProgrammingStudent.prototype,\
    \ HumanMixin);\nconst progStudent = new ProgrammingStudent('Ockert’, ‘du Preez’,\
    \ ‘JavaScript’).laugh();\n```\n\n2. Save the file with an HTML extension, for\
    \ example `Chapter 7.6.html`.\n\n3. Double-click the file to open it in the default\
    \ browser.\n\n4. If the browser is Google Chrome, press `Ctrl` + `Shift` + `J`\
    \ to open the console window. An alert box like `[Figure 7.7](#c07.xhtml_fig7_7)`\
    \ below will be displayed:\n\n![](images/Img_07_07.jpg)\n\n**Figure 7.7:** Mixin\
    \ method\n\nSome of the code may look familiar. I try to keep the exercises as\
    \ easy as possible and let each exercise build upon the previous. Let’s interrogate\
    \ the code.\n\nYou created a Mixin named `HumanMixin` containing two methods:\
    \ `cry()` and `laugh()`. You create a `Student` class, and then make use of inheritance\
    \ to create a `ProgrammingStudent` class based on the `Student` class. This means\
    \ that the `ProgrammingStudent` now contains its own methods and properties as\
    \ well as those inherited from the `Student` class.\n\nWith the following code,\
    \ you use the `assign` method of `Object` to copy the Mixins methods to the desired\
    \ class. Lastly, you simply made use of the `laugh` method, which now also exists\
    \ in the `ProgrammingStudent` class:\n\n`Object.assign(ProgrammingStudent.prototype,\
    \ HumanMixin);`\n\n`const progStudent = new ProgrammingStudent('Ockert’, ‘du Preez’,\
    \ ‘JavaScript’).laugh();`\n\n# [Conclusion](#toc.xhtml_s117a)\n\nIn this chapter,\
    \ we learnt JavaScript prototypes. To fully make use of JavaScript’s power, you\
    \ need to know its object-oriented features such as prototypes. Prototypes let\
    \ you extend JavaScript classes with the help of inheritance and Mixins.\n\nIn\
    \ the next chapter, we will dive into JavaScript properties. You will learn how\
    \ to create properties properly. We will move on to creating getters and setters\
    \ for properties and more involved features such as property flags and property\
    \ descriptors.\n\n# [Questions](#toc.xhtml_s118a)\n\n1. Explain the term prototype.\n\
    2. What are some benefits of using prototypes?\n3. Explain the term prototypal\
    \ inheritance.\n4. Why would you make use of Mixins?\n5. How do you attach properties\
    \ to prototypes?\n\n# [CHAPTER 8](#toc.xhtml_c08)\n\n# [JavaScript Properties](#toc.xhtml_c08)\n\
    \n# [Introduction](#toc.xhtml_s119a)\n\nProperties in JavaScript enable you to\
    \ store and set various values during the course of your application’s lifetime.\
    \ By storing information in properties provides a better structure to your applications.\n\
    \nIn this lesson you will create properties and learn how to set each property’s\
    \ attributes to be writeable or read-only. You will learn about the differences\
    \ between object properties and accessor properties. Finally, you will learn the\
    \ ins-and-outs of getters and setters.\n\n# [Structure](#toc.xhtml_s120a)\n\n\
    * What are properties?\n* Properties of properties\n* Getters and setters\n\n\
    # [Objectives](#toc.xhtml_s121a)\n\n* Learn what properties are\n* Understand\
    \ properties\n* Create properties\n\n# [What are properties?](#toc.xhtml_s122a)\n\
    \nIn *Chapter 6: Classes*, we had seen that object has certain attributes. Here\
    \ is for example, there are attributes that include:\n\n* Make\n* Model\n* Transmission\n\
    * Color\n* Number\n\nThe most common attributes of a property are its value and\
    \ its name. In order to access the attributes for any property, you can use the\
    \ `getOwnPropertyDescriptor` method. You supply the object you’d like to interrogate,\
    \ then the property.\n\nThe following sample shows `getOwnPropertyDescriptor`\
    \ in action:\n\n```html\n<html>\n<body>\n  <h1>Object.getPropertyDescriptor example</h1>\n\
    \  <p>Object.getPropertyDescriptor example</p>\n  <script>\n    let student =\
    \ class {\n      constructor(studentName, studentCourse) {\n        this.studentName\
    \ = studentName;\n        this.studentCourse = studentCourse;\n      }\n     \
    \ showInfo() {\n        let descriptor = Object.getOwnPropertyDescriptor(newStudent,\
    \ ‘studentName’);\n        alert(JSON.stringify(descriptor, null, 2));\n     \
    \ }\n    };\n\n    // Usage:\n    var newStudent = new student('Ockert’, ‘JavaScript’);\n\
    \    newStudent.showInfo();\n  </script>\n</body>\n</html>\n```\n\n# [Properties\
    \ attributes](#toc.xhtml_s123a)\n\nThe attributes of a property depend on the\
    \ assignment. There are three:\n\n*   **writable**: Determines if the value of\
    \ the property can be changed.\n*   **enumerable**: Can the property be listed\
    \ in loops?\n*   **configurable**: Allows property deletion, or property attributes\
    \ to be modified.\n\nThese all depend on the attributes (or flags) of a certain\
    \ property. Some properties are read-only and cannot be changed. To set properties,\
    \ use the dot notation. Here is an example:\n\n```javascript\nstudentCourse =\
    \ “JavaScript”;\n```\n\nThis is quite simple! An alert box like `[Figure 7.7](#c07.xhtml_fig7_7)`\
    \ below will be displayed:\n\n![](images/Img_07_07.jpg)\n\n**Figure 7.7:** Mixin\
    \ method\n"
