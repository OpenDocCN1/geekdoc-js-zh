    \ in syntax and inner workings. You will do a lot of practical exercises because\
    \ it is always easier to learn practically.\n\n# [Structure](#toc.xhtml_s219a)\n\
    \n*   JavaScript loops\n\n*   for\n\n*   for…in\n\n*   for…of\n\n*   while\n\n\
    *   do…while\n\n*   Exiting loops\n\n    *   The break statement\n\n    *   break\
    \ with labels\n\n*   The continue statement\n\n# [Objectives](#toc.xhtml_s220a)\n\
    \n*   Identify the different loops in JavaScript.\n\n*   Make use of the `for`\
    \ loop to loop a certain number of times.\n\n*   Make use of the `for…in`loop\
    \ to loop through object properties.\n\n*   Make use of the `for…of`loop through\
    \ arrays, strings, Maps and NodeLists.\n\n*   Make use of the `while` loop to\
    \ loop based on certain conditions.\n\n*   Understand the difference between the\
    \ while and `do…while` statements.\n\n*   Learn how to exit loops.\n\n*   Learn\
    \ how to skip iterations in loops.\n\n# [JavaScript loops](#toc.xhtml_s221a)\n\
    \nA loop by definition is something that repeats. In the context of JavaScript,\
    \ a loop is a block of code that repeats until a certain condition becomes true\
    \ or while a certain condition exists. There are also loops that can iterate over\
    \ similar items (in *[Chapter 10: JavaScript Generators and Iterators](#c10.xhtml)*,\
    \ I explained iterables and iteration) and loops that execute a code block a specified\
    \ number of times.\n\nThe following loops are available in JavaScript:\n\n*  \
    \ for\n\n    *   for…in\n\n    *   for…of\n\n*   while\n\n    *   do…while\n\n\
    Let’s have a look at them one by one.\n\n# [for](#toc.xhtml_s222a)\n\nThe `for`\
    \ loop executes a block of code a given number of times. Its syntax is as follows:\n\
    \n`for (statement1; statement2; statement3)`\n\n`{`\n\n`// code block that will\
    \ be executed`\n\n`}`\n\nThe loop is broken up in three parts. The first part\
    \ is the initialization of the loop. This sets the starting point of the loop.\
    \ The second part is where the condition comes in. here you supply the condition\
    \ that needs to be evaluated in order for the loop to execute. The third and final\
    \ part is the incrementation or decrementation of the loop and gets executed with\
    \ each iteration of the loop.\n\nHere is a more practical example. The next sample\
    \ shows a `for` loop in action:\n\n1.  Open a text editor of your choice and enter\
    \ the following HTML and JavaScript code:\n\n    `<!doctype html>`\n\n    `<body>`\n\
    \n    `<h1>for loop example</h1>`\n\n    `<p>for loop example</p>`\n\n    `<script>`\n\
    \n    `document.write(“Forward:</br>”);`\n\n    `for (i = 0; i < 10; i++)`\n\n\
    \    `{`\n\n    `document.write(i);`\n\n    `}`\n\n    `</script>`\n\n    `</body>`\n\
    \n    `</html>`\n\n2.  Save the file with an HTML extension, for example `Chapter\
    \ 14.1.html.`\n\n3.  Double-click the file to open it in the default browser.\n\
    \nIn this exercise you printed the word `Forward` on the web page, then I created\
    \ a `for`a loop. The variable `i` is 0, so this means that the loop counter will\
    \ start counting at `0`. The condition is next. The condition simply states that\
    \ `i` is less than `10`. This means that `i` is anywhere between `0` and `9`.\
    \ Not at the same time, though. The loop will loop `10` times, from `0` to `9`,\
    \ thus repeating its code block. The last part of the `for` loop increments the\
    \ i variable. The first time `i` is equal to `0`, the next time `i` is `1`, then\
    \ `i` is `2` and so on.\n\nNow, this is where it gets interesting!\n\nThe code\
    \ block that is executed is writing the current value of `i` to the page. The\
    \ first time `i` is `0`, so it will print `0`, then `i` is `1`, then `2` and so\
    \ on, until `i` becomes greater than or equal to `10`.\n\nThe result of this loop\
    \ looks like *[Figure 14.1](#c14.xhtml_fig14_1)*, as shown below:\n\n![](images/Img_14_01.jpg)\n\
    \n**Figure 14.1:** Incrementing for loop\n\nLet’s loop backwards!\n\nHere is a\
    \ more practical example. The next sample shows a `for` loop looping backwards.\n\
    \n1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<!doctype html>`\n\n    `<body>`\n\n    `<h1>for loop example</h1>`\n\
    \n    `<p>for loop example</p>`\n\n    `<script>`\n\n    `document.write(“Backward:</br>”);`\n\
    \n    `for (i = 9; i > -1; i--)`\n\n    `{`\n\n    `document.write(i);`\n\n  \
    \  `}`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file\
    \ with an HTML extension, for example `Chapter 14.2.html`."
