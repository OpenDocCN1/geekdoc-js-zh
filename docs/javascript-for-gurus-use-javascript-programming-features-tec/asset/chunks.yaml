    \ have relatively little code. Let me explain the crux.\n\nIn the previous first\
    \ program, you wrote the following:\n\n`<head>`\n\n`<script src= “https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js”>`\n\
    \n`</script>`\n\n`</head>`\n\nThis code imports a jQuery library into your page.\
    \ Because you put it into the head section of your HTML document, it is part of\
    \ the complete page, and the methods inside the library get loaded before anything\
    \ else. In JavaScript, you do not need to include a special library to do the\
    \ task at hand (in this example).\n\nYou then created a normal input button and\
    \ did the following:\n\n`<script>`\n\n`$(‘#button1’).click(function() {`\n\n`alert(“BpB”);`\n\
    \n`});`\n\n`</script>`\n\nThis attaches a click event handler to the button which\
    \ shows an alert box with the text `BpB`. Very simple and very streamlined.\n\n\
    In the previous second program, you didn’t have to import a library. You also\
    \ created a button input and did the following:\n\n`<script>`\n\n`document.getElementById(“button1”).addEventListener(‘click’,\
    \ function(){`\n\n`alert(“BpB”);`\n\n`});`\n\n`</script>`\n\nYou first had to\
    \ get the object named `button1` through the `getElementById` method. After that,\
    \ you had to manually attach an event handler to the button by adding a listener\
    \ which listens for events. This also then shows an alert box with the text `BpB`\n\
    \n# [JSON and JavaScript](#toc.xhtml_s288a)\n\n**JSON** stands for **JavaScript\
    \ Object Notation**. It is not actually a different programming language at all,\
    \ but many a newbie confuse JSON and JavaScript. JSON is a lightweight format\
    \ for storing and transporting data. It is self-describing and is used mostly\
    \ to send data from a server to a web page.\n\nIf you look at the name, you will\
    \ see JavaScript Object Notation, now what is the real difference between JavaScript\
    \ objects and JSON? Let me answer it.\n\nJavaScript objects were covered in depth\
    \ in *[Chapter 2: JavaScript Objects](#c02.xhtml)*, but here are a few highlights.\n\
    \n# [JavaScript objects](#toc.xhtml_s289a)\n\nAn object is something that has\
    \ properties and methods. Properties describe an object. Methods are the actions\
    \ which that object can take. Basically, everything can be an object in JavaScript.\
    \ All JavaScript values, except primitives, are objects. Before we go into detail\
    \ about Built-in objects, let’s explore primitives quickly.\n\n# [The Object data\
    \ type](#toc.xhtml_s290a)\n\nObjects are variables too, but unlike with primitives,\
    \ objects can store more than one value in it. Objects store keyed collections\
    \ of data and complex entities. The information inside an object is stored as\
    \ key-value pairs. The key is usually the property name. The value is the property’s\
    \ value, for example:\n\n`var objStudent = {`\n\n`Name : “Ockert”,`\n\n`Course\
    \ : “JavaScript”,`\n\n`Year : 2019`\n\n`};`\n\nIn the above code segment, a new\
    \ JavaScript object called `objStudent` is created. `objStudent` contains three\
    \ properties, namely: `Name`, `Course`, and `Year`.\n\n# [Creating JavaScript\
    \ objects](#toc.xhtml_s291a)\n\nNow that we know a bit more about objects let’s\
    \ have a look at how to create them. Objects can be created using any of the following\
    \ ways:\n\n*   Object literal syntax\n\n*   The `new` keyword\n\n*   `Object.create()`\n\
    \n*   `Object.assign()`\n\n*   ES6 classes\n\nLet me explain them one by one.\n\
    \n# [Object literal syntax](#toc.xhtml_s292a)\n\nThis method is quite easy to\
    \ understand and quick to do. Here is an example:\n\n`var objCar = {`\n\n`make\
    \ : “BMW”,`\n\n`model : “i8 Roadster”,`\n\n`price : 2329300`\n\n`};`\n\nThis example\
    \ may look almost familiar. If you look closely at the previous code segment in\
    \ the Object data type section, you will notice that both code examples have the\
    \ same similarities. The keyword var creates the object. The curly braces contain\
    \ the properties and values separated with a colon, and each property is separated\
    \ with a comma.\n\nThe object created now is named `objCar`. It contains the properties\
    \ make, model and price. To make use of the `objCar` object, you can have a statement\
    \ like:\n\n`console.log(objCar); //Outputs {make: “BMW”, model: “i8 Roadster”,\
    \ price: “2329300”}`\n\n`console.log(objCar.make); //Outputs BMW`\n\n`console.log(objCar.model);\
    \ //Outputs i8 Roadster`\n\n`console.log(objCar.price); //Outputs 2329300`\n\n\
    # [The ‘new’ keyword](#toc.xhtml_s293a)\n\nUsing the `new` keyword to create objects\
    \ resembles the way objects are created in class-based programming languages,\
    \ like C# or Java. There are 2 ways to use the `new` keyword to create objects;\
    \ they are:\n\n*   **Using ‘new’ with in-built Object constructor functions**:\
    \ A constructor, in class-based object-oriented programming, is a special type\
    \ of subroutine called to create an object. A constructor prepares the new object\
    \ for use by initializing the object’s members. To create a new object, you must\
    \ use the ‘`new`’ keyword with the `Object()` constructor, like this:\n\n    `var\
    \ house = new Object();`\n\n    This creates and initializes a new object named\
    \ `house`. We can add properties to this object by using code like the following:\n\
    \n    `house.bedrooms = 4;`\n\n    `house.bathrooms = 2;`\n\n    `house.garages\
    \ = 2;`\n\n    `house.hasSwimmingPool = false;`\n\n    `house.hasOutsideWalls\
    \ = true;`\n\n    As you can see, creating properties for an object, which was\
    \ created using the `Object()` constructor, can become quite a tedious task, and\
    \ involves a lot of typing. The house object we created above has a bedrooms property,\
    \ bathrooms, garages, as well as Boolean properties indicating the presence of\
    \ a swimming pool, or outside walls.\n\n    What if we had to create hundreds\
    \ of house objects? Let’s see how we can make this code a bit shorter by using\
    \ a user-defined constructor function.\n\n*   **Using ‘new’ with user-defined\
    \ constructor functions**: When creating a user-defined constructor function,\
    \ you basically create a template for the object’s properties and methods. You\
    \ create the function once, and just feed the necessary properties to it, instead\
    \ of manually entering each property and each setting as shown earlier in the\
    \ Using `new` with in-built Object constructor functions section.\n\n    Let’s\
    \ create the user-defined constructor using the house object as an example again:\n\
    \n    `function House(_bed, _bath, _garage, _pool, _walls) {`\n\n    `this.bedRooms\
    \ = _bed;`\n\n    `this.bathRooms = _bath;`\n\n    `this.garages = _garage;`\n\
    \n    `this.hasSwimmingPool = _pool;`\n\n    `this.hasOutsideWalls = _walls;`\n\
    \n    `}`"
