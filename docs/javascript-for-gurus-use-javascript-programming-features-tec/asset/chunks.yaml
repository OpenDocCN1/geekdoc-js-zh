    \ request methods other than GET and POST, that could cause side-effects on server\
    \ data, and browsers should *preflight* the request. This solicits supported methods\
    \ from the server via the `HTTP OPTIONS` request method.\n\nHere is how it works.\n\
    \nSuppose a user visits the following website: [http://www.javascriptforgurus.comand](http://www.javascriptforgurus.comand)\
    \ a page on the site attempt a cross-origin request to fetch some data from [http://service.javascriptforgurus.com](http://service.javascriptforgurus.com).\
    \ A CORS-compatible browser will attempt to make a cross-origin request to `service.javascriptforgurus.com`\
    \ in the following way.\n\nThe CORS-compatible browser sends an `OPTIONS` request\
    \ with an `Origin HTT`P header to [http://service.javascriptforgurus.com](http://service.javascriptforgurus.com)\
    \ containing the domain that served the parent page:"
