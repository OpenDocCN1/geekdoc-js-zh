    \ by `y`. |\n\n| `x(?!y)` | Matches `x` only if `x` is not followed by `y`. |\n\
    \n| `(?<=y)x` | Matches`x`only if`x`is preceded by`y`. |\n\n| `(?<!y)x` | Matches`x`only\
    \ if`x`is not preceded by`y`. |\n\n| `x&#124;y` | Matches `x`, or `y` (when there\
    \ is no match for `x`). |\n\n| `{n}` | Matches `n` occurrences of the expression.\
    \ |\n\n| `{n,}` | Matches at least `n` occurrences of the preceding expression.\
    \ |\n\n| `{n,m``}` | Matches at least `n` and at most `m` occurrences of the preceding\
    \ expression. |\n\n| `[xyz]` | Matches any one of the characters in the brackets.\
    \ |\n\n| `[^xyz]` | Matches anything not enclosed in the brackets. |\n\n| `[\\\
    b]` | Matches a backspace. |\n\n| `\\``b` | Matches the position between a word\
    \ character followed by a non-word character. |\n\n| `\\B` | Matches the following:\
    \ \n\n*   Before the first character of the string.\n\n*   After the last character\
    \ of the string.\n\n*   Between two-word characters.\n\n*   Between two non-word\
    \ characters.\n\n*   Empty string.\n\n |\n\n| `\\cX` | Matches a control character\
    \ in a string. |\n\n| `\\d` | Matches a digit character. |\n\n| `\\D` | Matches\
    \ a non-digit character. |\n\n| `\\f` | Matches a form feed. |"
