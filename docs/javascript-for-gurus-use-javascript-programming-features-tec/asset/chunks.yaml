    \n    `console.log(list_4);`\n\n    `console.log(list_5);`\n\n    `console.log(result_1);`\n\
    \n    `console.log(result_2);`\n\n    `console.log(result_3);`\n\n    `</script>`\n\
    \n    `</body>`\n\n    `</html>`\n\n2.  Save the file with an HTML extension,\
    \ for example `Chapter 18.3.html`.\n\n3.  Double-click the file to open it in\
    \ the default browser.\n\n4.  If the browser is Google Chrome, press *Ctrl* +\
    \ *Shift* + *J* to open the console window.\n\nThe output is shown in the following\
    \ screenshot:\n\n![](images/Img_18_03.jpg)\n\n**Figure 18.3:** Arrays and function\
    \ binding\n\n# [Currying](#toc.xhtml_s280a)\n\nCurrying transforms a function\
    \ with multiple arguments into a sequence of nesting functions. It keeps returning\
    \ a new function that expects the current argument inline until all the arguments\
    \ are exhausted.\n\nHere is a small example.\n\n1.  Open a text editor of your\
    \ choice and enter the following HTML and JavaScript code:\n\n    `<html>`\n\n\
    \    `<body>`\n\n    `<h1>Currying Example</h1>`\n\n    `<p>Currying Example</p>`\n\
    \n    `<script>`\n\n    `function add_1(a, b, c) {`\n\n    `return a + b + c;`\n\
    \n    `}`\n\n    `function add_2(a) {`\n\n    `return (b) => {`\n\n    `return\
    \ (c) => {`\n\n    `return a + b + c`\n\n    `}`\n\n    `}`\n\n    `}`\n\n   \
    \ `console.log(add_1(2,4,6));`\n\n    `console.log(add_2(1)(2)(3))`\n\n    `</script>`\n\
    \n    `</body>`\n\n    `</html>`\n\n2.  Save the file with an HTML extension,\
    \ for example `Chapter 18.4.html`.\n\n3.  Double-click the file to open it in\
    \ the default browser.\n\n4.  If the browser is Google Chrome, press *Ctrl* +\
    \ *Shift* + *J* to open the console window.\n\nThe output of the above code is\
    \ shown in the following screenshot:\n\n![](images/Img_18_04.jpg)\n\n**Figure\
    \ 18.4:** Currying example\n\nThe first function, `add_1,` is an ordinary JavaScript\
    \ function and it gets output to the console. The function `adds_2` is an example\
    \ of currying in action. It splits the function into more functions, each accepting\
    \ an argument. In this case, there are 3 arguments, so there will be 3 inline\
    \ functions.\n\n# [Conclusion](#toc.xhtml_s281a)\n\nIn this last chapter in the\
    \ *AdvancedConcepts* section, we have learnt how to make use of functional programming\
    \ features in JavaScript. You learned how to make use of partial applications\
    \ to manipulate a function’s arguments according to your needs. Lastly, you saw\
    \ how currying makes use of inline functions.\n\nIn the next final chapter, we\
    \ will introduce you to various languages and language variants based on JavaScript\
    \ such as AJAX, jQuery, and JSON.\n\n# [Questions](#toc.xhtml_s282a)\n\n1.  Define\
    \ the termpartials.\n\n2.  What is currying?\n\n# [SECTION V](#toc.xhtml_p05)\n\
    \n# [JAVASCRIPT AND FRIENDS](#toc.xhtml_p05)\n\n# [CHAPTER 19](#toc.xhtml_c19)\n\
    \n# [JavaScript and Other Languages](#toc.xhtml_c19)\n\n# [Introduction](#toc.xhtml_s283a)\n\
    \nJavaScript has been around for a long time and will be even longer. Like any\
    \ programming language, it has influenced a lot of different languages.\n\nIn\
    \ this lesson, you will learn how to use JavaScript with AJAX, jQuery, and JSON.\
    \ Later on in the lesson, you will have a quick introduction into languages influenced\
    \ by JavaScript such as TypeScript, ActionScript, and CoffeeScript.\n\n# [Structure](#toc.xhtml_s284a)\n\
    \n*   jQuery and JavaScript\n\n*   JSON and JavaScript\n\n*   AJAX and JavaScript\n\
    \n*   Languages based on or influenced by JavaScript\n\n# [Objectives](#toc.xhtml_s285a)\n\
    \n*   Understand what jQuery is and how to use it.\n\n*   Understand what JSON\
    \ and AJAX are and how to use them in JavaScript.\n\n*   See how ActionScript,\
    \ CoffeeScript, and TypeScript work.\n\n# [Other languages](#toc.xhtml_s286a)\n\
    \nThroughout this book, you have been using JavaScript with HTML because HTML\
    \ is the foundation for any web page. if you can recall, in *[Chapter 1: Overview\
    \ of the Power of JavaScript and Its Purpose](#c01.xhtml)*, I have spoken about\
    \ the history of JavaScript and why it became such a strong language that developers\
    \ simply cannot work without.\n\nAnother language such as **CSS** (**Cascading\
    \ Style Sheets**) also comes to mind as a language that any webpage simply cannot\
    \ do without. But, there are many languages out there. There are numerous scripting\
    \ languages and numerous variants of languages. Each with their own flavor and\
    \ purpose.\n\n# [jQuery and JavaScript](#toc.xhtml_s287a)\n\njQuery was founded\
    \ by *John Resig* in 2006.jQuery is a cross-platform JavaScript library. It is\
    \ a collection of JavaScript code packaged together that can be accessed quicker\
    \ and easier than JavaScript. Its main use is to simplify HTML DOM tree traversal\
    \ and manipulation, plus event handling, CSS animation, and AJAX (I will speak\
    \ of AJAX a bit later). jQuery also provides capabilities to create plug-ins on\
    \ top of the JavaScript library.\n\nSome important differences between JavaScript\
    \ and jQuery are included in the table below:\n\n| **JavaScript** | **jQuery**\
    \ |\n\n| Weakly typed dynamic language. | Rich and lightweight JavaScript library.\
    \ |\n\n| Write all coding from scratch. | Contains pre-written functions. |\n\n\
    | Developers have to consider browser compatibility when developing. | jQuery\
    \ is cross-browser compatible. |\n\n| No additional plugins needed to run JavaScript.\
    \ | jQuery library script link must be included on the web page. |\n\n| Long lines\
    \ of code. | Less coding. |\n\n| Difficult to learn. | Relatively easier to learn.\
    \ |\n\n**Table 19.1:** JavaScript versus jQuery\n\nLet’s quickly have a look at\
    \ the differences in coding by doing a few exercises.\n\n1.  Open a text editor\
    \ of your choice and enter the following HTML and JavaScript code:\n\n    `<html>`\n\
    \n    `<head>`\n\n    `<script src= “https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js”></script>`\n\
    \n    `</head>`\n\n    `<body>`\n\n    `<h1>jQuery versus JavaScript 1</h1>`\n\
    \n    `<p>jQuery versus JavaScript 1</p>`\n\n    `<input id=”button1” type=”button”value=”click\
    \ Me!”` `/>`\n\n    `<script>`\n\n    `$(‘#button1’).click(function() {`\n\n \
    \   `alert(“BpB”);`\n\n    `});`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`"
