  trans: "\n3. 双击文件在默认浏览器中打开它。\n\n`for` 循环从 `9` 开始。然后你进行测试以确保 `i` 大于 `-1`，最后循环使用递减运算符进行递减。运算符在`第\
    \ 4 章：JavaScript 运算符`中讨论过。最终结果如下一个截图所示：\n\n![](img/Img_14_02.jpg)\n\n**图 14.2：**\
    \ 逆向 for 循环\n\n`for` 循环也经常与数组结合使用。数组将在`第 16 章：数组`中进行讨论，所以稍后会进行详细介绍。`for` 循环有几种变体，让我们检查一下它们。\n\
    \n## for…in\n\n`for…in` 语句遍历对象的属性。它的语法如下：\n\n```\nfor (variable in object)\n{\n\
    \  Statement(s)\n}\n```\n\n如你所见，这个 `for` 循环与我们之前讨论的完全不同。在此语境中，变量是当前属性的临时占位符。在此语文中，对象是被遍历的那个对象。让我们做一个小练习。\n\
    \n这是一个更实用的例子。下一个示例展示了 `for…in` 循环的运行。\n\n1. 打开你喜欢的任何文本编辑器并输入以下 HTML 和 JavaScript\
    \ 代码：\n\n```html\n<!doctype html>\n<body>\n  <h1>for…in loop example</h1>\n  <p>for…in\
    \ loop example</p>\n  <script>\n    var student = {studentName: “Ockert”, studentSubject:\
    \ “JavaScript”, studentAge: 41};\n    var output = “”;\n    var stu;\n    for\
    \ (stu in student)\n    {\n      output += student[stu] + “</br>”;\n      document.write(“<b>”\
    \ + ‘${stu}’ + “</b> = “ + ‘${student[stu]}’ + “</br>”);\n    }\n    document.write(“<p>”\
    \ + output);\n  </script>\n</body>\n</</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter\
    \ 14.3.html`。\n\n3. 双击文件在默认浏览器中打开它。\n\n这个练习合二为一。让我们拆解一下：创建一个名为 `student` 的对象。它的属性包括\
    \ `studentName`、`studentSubject` 和 `studentAge`。我们创建了两个名为 `output` 和 `stu` 的变量。然后开始\
    \ `for…in` 循环。`stu` 变量作为 `student` 对象内部属性的占位符。此循环将运行三次，因为学生对象有三个属性。`output` 变量会被加上当前属性的值。`+=`\
    \ 运算符表示将新值加到现有值，正如`第 4 章：JavaScript 运算符`中所解释的那样。下一行使用反引号加粗写入属性名及其设置，正如`第 12 章：变量`中所解释的那样。最后，`output`\
    \ 变量的值也会写入页面。\n\n最终输出如`图 14.3`：\n\n![](img/Img_14_03.jpg)\n\n**图 14.3：** for…in\
    \ 循环\n\n我想讨论的下一个也是最后一个 `for` 语句是 `for…of` 语句。\n\n## for…of\n\n`for…of` 循环遍历可迭代数据结构，如数组、字符串、NodeLists\
    \ 和 Maps。它的语法如下：\n\n```\nfor (variable of iterable)\n{\n  Statement(s)\n}\n```\n\
    \n它看起来与 `for…in` 循环相似，不同在于它遍历的是内容。它遍历一个可迭代对象。在`第 10 章：JavaScript 生成器和迭代器`中你已经学习过迭代对象是可以重复的东西，因此在这种情况下，变量会遍历迭代对象的每个部分直到完成。为了给出更好的解释，让我们做一个练习！\n\
    \n下一个示例展示了 `for…of` 循环的运行。\n\n1. 打开你喜欢的任何文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n\
    ```html\n<!doctype html>\n<body>\n  <h1>for…of loop example</h1>\n  <p>for…of\
    \ loop example</p>\n  <script>\n    var subject = ‘JavaScript’;\n    var s;\n\
    \    for (s of subject)\n    {\n      document.write(s + “<br >”);\n    }\n  </script>\n\
    </body>\n</</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 14.4.html`。\n\n3. 双击文件在默认浏览器中打开它。\n\
    \n首先，创建一个名为 `subject` 的变量并赋值为 `JavaScript`。创建另一个名为 `s` 的变量。开始 `for…of` 循环。变量 `s`\
    \ 等于存储在 `subject` 变量中的字符串 `JavaScript` 中的一个字符。它被写入页面，如`图 14.4`所示：\n\n![](img/Img_14_04.jpg)\n\
    \n**图 14.4：** for…of 循环运行\n\n让我们再做另一个例子。这个例子将遍历数组，数组将在`第 16 章：数组`中更详细地介绍。\n\n\
    下一个示例展示了 `for…of` 循环遍历数组。\n\n1. 打开你喜欢的任何文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n\
    <!doctype html>\n<body>\n  <h1>for…of loop example</h1>\n  <p>for…of loop example</p>\n\
    \  <script>\n    var arraySubjects = [‘JavaScript’, ‘HTML’, ‘CSS’, ‘PHP’, ‘jQuery’];\n\
    \    var sub;\n    for (sub of arraySubjects) {\n      document.write(sub + “<br\
    \ >”);\n    }\n  </script>\n</body>\n</</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter\
    \ 14.5.html`。\n\n3. 双击文件在默认浏览器中打开它。\n\n`arraySubjects` 是我们 true 数组。数组存储了多个值，所以从某种意义上说，数组是一组同名的变量。该数组提供了五个字符串，现在这五个字符串都存储在一个地方，即数组中。\n\
    \n创建了一个变量 `sub`。与 `for…in` 示例以及上一个 `for…of` 示例一样，该变量将用于获取数组（或值组）中的当前值。然后，我们只需简单地将该值写入页面，如`图\
    \ 14.5`所示：\n\n![](img/Img_14_05.jpg)\n\n**图 14.5：** 遍历数组的 for…of 循环\n\n让我们条件循环。\n\
    \n## while\n\n`while` 循环只要给定条件为真就会执行代码块。它的语法如下：\n\n```\nwhile (condition)\n{\n\
    \  Statement(s)\n}\n```\n\n这很简单。条件可以是测试一个值是否为假，或者例如一个数值是否小于 100。只要条件存在，语句就会重复。这被称为条件循环，因为与\
    \ `for` 循环指定起始和结束参数不同，在 `while` 循环中，你可能不知道它将执行几次。\n\n让我们做一个真正的例子。\n\n下一个示例展示了条件循环的威力：\n\
    \n1. 打开你喜欢的任何文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<body>\n\
    \  <h1>while loop example</h1>\n  <p>while loop example</p>\n  <script>\n    let\
    \ total = 0;\n    while (total < 100) {\n      let newVal = + prompt(“Enter a\
    \ number”, ‘’);\n      total += newVal;\n    }\n    alert( ‘Total: ‘ + total );\n\
    \  </script>\n</body>\n</</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 14.6.html`。\n\
    \n3. 双击文件在默认浏览器中打开它。\n\n在上面的练习中，你创建了一个名为 `total` 的变量并赋值为 `0`。`while` 循环检查 `total`\
    \ 变量是否小于 `100`。这意味着如果 `total` 变量变为 100 或更多，循环应该退出。\n\n在循环内部，另一个名为 `newVal` 的变量接收提示框中输入的任何值，然后这个值会被加到\
    \ `total` 变量上。\n\n这里非常重要的一点是，测试的是变量 `total` 的值，如果值在循环某处没有发生变化，循环将是无限循环且永远不会结束，例如\
    \ total 永远不会变成 100 或更多。\n\n"
- fmt: "\nWhen this page is opened, you will see a box that looks like [Figure 14.6](#c14.xhtml_fig14_6),\
    \ where the numbers should be entered. Now, you can enter `1` every time, and\
    \ it will keep adding `1` until it reaches `100`. Or, you can enter `50` and `50`,\
    \ or even `100` directly.\n\nIf you had entered `1` every time it would loop `100`\
    \ times; if you entered `50` and `50` again, it would loop twice, if you enter\
    \ `100` immediately, it will loop just once. To test this, refresh the page after\
    \ you have reached `100` and try again with a different combination of numbers:\n\
    \n![](images/Img_14_06.jpg)\n\n**Figure 14.6:** while loop in action\n\nThe `do…while`\
    \ loop (which I will cover next) is almost identical to the `while` loop, let’s\
    \ have a look\n\n# [do…while](#toc.xhtml_s226a)\n\nThe `do…while` loop is also\
    \ a conditional loop as the `while` loop you did earlier. There is just one main\
    \ difference. Whereas with the `while` loop the condition was tested at the beginning\
    \ of the loop, with a `do…while` loop, the condition is tested at the end of the\
    \ loop. This means that the loop will always execute at least once. Its syntax\
    \ looks like the following:\n\n```\ndo\n{\n  Statement(s)\n} while (condition);\n\
    ```\n\nThe next sample demonstrates a `do…while` loop.\n\n1. Open a text editor\
    \ of your choice and enter the following HTML and JavaScript code:\n\n```html\n\
    <!doctype html>\n<body>\n<h1>while loop example</h1>\n<p>while loop example</p>\n\
    <script>\n  let i = 0; //change to 6\n  do\n  {\n    i += 1;\n    document.write(i);\n\
    \  } while (i < 5);\n</script>\n</body>\n</html>\n```\n\n2. Save the file with\
    \ an HTML extension, for example `Chapter 14.7.html`.\n\n3. Double-click the file\
    \ to open it in the default browser.\n\nThis code will simply output `12345` of\
    \ the page when run. Now since the condition gets evaluated at the end of the\
    \ loop, this can be troublesome. For instance, if you were to change the value\
    \ of `1` to `6` instead of `0` before the loop, the loop will still execute once\
    \ and produce `7`.\n\n# [Exiting loops](#toc.xhtml_s227a)\n\nThere may be times\
    \ that you need to exit a loop early. In these cases, you should use the `break`\
    \ statement. There are two ways in which you can use the `break` statement in\
    \ loops.\n\n* `break`\n* `break` to label\n\nLet’s see how they work.\n\n# [break](#toc.xhtml_s228a)\n\
    \nYou can exit a loop by including the `break` statement at the point where you\
    \ want to exit. This is usually based on a condition that has become true.\n\n\
    The next sample demonstrates how to exit a loop early.\n\n1. Open a text editor\
    \ of your choice and enter the following HTML and JavaScript code:\n\n```html\n\
    <!doctype html>\n<body>\n<h1>Exiting a loop with break example</h1>\n<p>Exiting\
    \ a loop with break example</p>\n<script>\n  var num = \"\";\n  var i = 0;\n \
    \ while (i < 5)\n  {\n    num += \"<br>Current Number: \" + i;\n    i++;\n   \
    \ if (i === 3)\n    {\n      break;\n    }\n  }\n  document.write(num);\n</script>\n\
    </body>\n</html>\n```\n\n2. Save the file with an HTML extension, for example\
    \ `Chapter 14.8.html`.\n\n3. Double-click the file to open it in the default browser.\n\
    \nThe loop is supposed to loop from 0 to 5, but the `if` statement tested if `i`\
    \ is `3`. If it is, then the loop should exit denoted by the `break` statement.\
    \ [Figure 14.7](#c14.xhtml_fig14_7) displays the half-completed loop.\n\n![](images/Img_14_07.jpg)\n\
    \n**Figure 14.7:** The loop exited early\n\nLet’s add a twist.\n\n# [break with\
    \ label](#toc.xhtml_s229a)\n\nAs you saw, the `break` statement causes the loop\
    \ to exit early. You can specify where to start executing code by including a\
    \ label and exiting to that label. You simply add a labelled statement and add\
    \ the code afterwards\n\nLet’s do an example.\n\nThe next sample demonstrates\
    \ how to exit a loop early with a label.\n\n1. Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n```html\n<!doctype html>\n\
    <body>\n<h1>Exiting a loop with break example</h1>\n<p>Exiting a loop with break\
    \ example</p>\n<script>\n  let i = 0;\n  let j = 0;\n  Repeat: while (true)\n\
    \  {\n    document.write('Outer: ' + i + '<br>');\n    i++;\n    j = 1;\n    while\
    \ (true)\n    {\n      document.write('Inner: ' + j + '<br>');\n      j++;\n \
    \     if (i === 5 && j === 5)\n      {\n        break Repeat;\n      }\n     \
    \ else if (j === 5)\n      {\n        break;\n      }\n    }\n  }\n</script>\n\
    </body>\n</html>\n```\nWait, let me re-examine the provided text for the `break\
    \ with label` section as it was slightly jumbled in the source. I will reconstruct\
    \ the logic based on the provided text strings:\n\n```javascript\nlet i = 0;\n\
    let j = 0;\nRepeat: while (true)\n{\n  document.write('Outer: ' + i + '<br>');\n\
    \  i++;\n  j = 1;\n  while (true)\n  {\n    document.write('Inner: ' + j + '<br>');\n\
    \    j++;\n    if (i === 5 && j === 5)\n    {\n      break Repeat;\n    }\n  \
    \  else if (j === 5)\n    {\n      break;\n    }\n  }\n}\n```\nActually, looking\
    \ at the raw text provided:\n`let i = 0;` `let j = 0;` `Repeat: while (true)`\
    \ `{ document.write('Outer: ' + i + '<br>'); i++; j = 1; while (true) { document.write('Inner:\
    \ ' + j + '<br>'); j++; if (i === 5 && j === 5) { break Repeat; } else if (j ===\
