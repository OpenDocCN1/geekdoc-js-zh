    # About the Author


    **Ockert du Preez** has always had a love for computers, but never thought he
    would end up working as a systems developer, never mind writing programming books!


    His real interest in programming started in 1998 when he encountered `Visual C++
    6` and `Visual Basic 6`.


    After his wife, programming is his greatest love.


    He has been writing online articles for platforms such as `CodeGuru`, `DevX`,
    `Developer.com`, and `Database Journal` for several years. He was a `.NET` Microsoft
    MVP from 2009 to 2017.


    You can find his Visual Studio book here:


    [https://rb.gy/kgnsbg](https://rb.gy/kgnsbg)


    # Acknowledgements


    First and foremost, I would like to thank God for giving me the courage to write
    this book. I would like to thank everyone at BPB Publications for giving me this
    opportunity to write and publish this book.


    Thank you to my wife and my daughter for always believing in me.


    Lastly, I would like to thank my critics. Without their criticism, I would never
    be able to write this book.


    # Preface


    From start to finish, this book will cover all the intricacies of the JavaScript
    language! You will get an overview of all the `Statements`, `Functions` and `Operators`.
    Then you will learn the fun stuff which includes: `Classes`, `Prototypes`, `Promises`,
    and `Generators`. You will learn about arrays and how to make your scripts achieve
    logic in your scripts. Lastly, you will learn how to combine JavaScript with other
    languages.


    **[Chapter 1](#c01.xhtml)** details the history of JavaScript and explains its
    purpose in the world of programming languages.


    **[Chapter 2](#c02.xhtml)** teaches you about JavaScript objects. You learn what
    they are, how to use them properly, and how to dispose them.


    **[Chapter 3](#c03.xhtml)** presents how to write decent JavaScript statements
    for real world scenarios. Have a deep dive into JavaScript keywords as well.


    **[Chapter 4](#c04.xhtml)** explains JavaScript Operators in detail.


    **[Chapter 5](#c05.xhtml)** explores the ins-and-outs of JavaScript functions.


    **[Chapter 6](#c06.xhtml)** demonstrates how to create JavaScript Classes for
    better code!


    **[Chapter 7](#c07.xhtml)** explains Prototypes in detail and why we need them.


    **[Chapter 8](#c08.xhtml)** guides you on how to create Properties properly.


    **[Chapter 9](#c09.xhtml)** teaches you about the complexities of writing Promises.


    **[Chapter 10](#c10.xhtml)** introduces JavaScript Generators and Iterators.


    **[Chapter 11](#c11.xhtml)** explains what modules are and how they affect your
    code clarity.


    **[Chapter 12](#c12.xhtml)** teaches you how to use variables properly.


    **[Chapter 13](#c13.xhtml)** teaches you how to introduce logic into any app.


    **[Chapter 14](#c14.xhtml)** shows you how to use of.


    **[Chapter 15](#c15.xhtml)** explains what arrays are.


    **[Chapter 16](#c16.xhtml)** shows you how to search or replace text.


    **[Chapter 17](#c17.xhtml)** presents the differences between Currying and Partials.


    **[Chapter 18](#c18.xhtml)** shows how it works with other languages.


    **[Chapter 19](#c19.xhtml)** shows what JavaScript is.


