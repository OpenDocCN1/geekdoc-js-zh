  trans: "\n构造函数的名称为 `House`。在括号内有五个参数：（`_bed`、`_bath`、`_garage`、`_pool` 和 `_walls`）。这些参数将用于向\
    \ `House` 函数传递信息。在构造函数内部，每个属性都将被设置为其对应的参数。记住，这仅仅是一个模板，目前还没有任何值。\n\n现在我们已经有了构造函数，基于它创建对象就很简单了。方法如下：\n\
    \n```javascript\nvar houseOne = new House(4, 2, 2, false, true);\nvar houseTwo\
    \ = new House(3, 1, 1, true, false);\n```\n\n上面的 `houseOne` 变量是一个新的 `House` 对象。它有\
    \ 4 卧室、2 间浴室、2 个车库、没有游泳池且有外墙。相比之下，`houseTwo` 变量有 3 卧室、1 间浴室、1 个车库、一个游泳池，且没有外墙。\n\
    \n# 创建 JSON 对象\n\nJSON 对象写在花括号内，并可以包含多个键/值对，如下所示：\n\n```json\n{\"firstName”:”Ockert”,\
    \ “lastName”:”du Preez”\n```\n\n你可以更进一步，在一个 `Student` 对象中包含更多的 `firstName` 和 `lastName`，例如：\n\
    \n```json\n{\n  “Student”:[\n    {\"firstName”:”Ockert”, “lastName”:”du Preez”},\n\
    \    {\"firstName”:”William”, “lastName”:”Shakespeare”},\n    {\"firstName”:”Stephen”,\
    \ “lastName”:”King}\n  ]\n}\n```\n\n# 有效 JSON 的规则\n\n以下内容在 JSON 格式中都是允许的：\n\n\
    -   空对象和空数组。\n-   字符串可以包含任何 Unicode 字符。\n-   Null 是一个有效的 JSON 值。\n-   所有对象的属性应始终使用双引号。\n\
    -   数字值必须是十进制格式。\n-   数组中不允许有尾随逗号。\n\n让我们通过 JavaScript 对 JSON 编码和解码进行一个快速练习：\n\
    \n1.  打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n   \
    \ <h1>Encoding and Decoding JSON</h1>\n    <p>Encoding and Decoding JSON</p>\n\
    \    <script>\n        const encodeData = {\n            name: “Ockert du Preez”,\n\
    \            age: 41,\n            title: “JavaScript Guru”\n        }\n     \
    \   const encodeStr = JSON.stringify(encodeData);\n        console.log(encodeStr);\n\
    \        const decodeStr = ‘{\n            “name”:”Ockert du Preez”,\n       \
    \     “age”:41,\n            “title”:”JavaScript Guru”\n        }’;\n        const\
    \ decodeData = JSON.parse(decodeStr);\n        console.log(decodeData.title);\n\
    \    </script>\n</body>\n</html>\n```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter 19.3.html`。\n\
    \n3.  双击文件在默认浏览器中打开它。如果浏览器是 Google Chrome，按下 `Ctrl` + `Shift` + `J` 打开控制台窗口：\n\
    \n控制台窗口中的输出所示：\n\n![](img/Img_19_02.jpg)\n\n**图 19.2：** JSON 的编码与解码\n\n让我分析一下这里发生了什么。\n\
    \n首先，创建了一个名为 `encodeData` 的 JavaScript 对象，并赋予了名称、年龄和标题等值。然后，一个名为 `encodeString`\
    \ 的变量利用 `JSON` 中的 `stringify` 方法将 JavaScript 对象转换为 JSON 对象。\n\n其次基本上是相反的。你提供了一个\
    \ JSON 对象给 `JSON` 的 `parse` 方法，以将其转换为普通的 JavaScript 对象。\n\n# AJAX 和 JavaScript\n\
    \nAJAX 不是一种编程语言。AJAX 代表异步 JavaScript 和 XML，它利用了：\n\n-   浏览器内置的 `XMLHttpRequest`\
    \ 对象，用于从 Web 服务器请求数据。\n-   JavaScript 和 HTML DOM，用于显示或使用这些数据。\n\nAJAX 的强大之处在于它允许通过与后台\
    \ Web 服务器交换数据来异步更新网页页面，这意味着可以更新网页的部分内容而无需重新加载整个页面。\n\n以下是 AJAX 工作原理的分解：在网页上发生了一个事件：\n\
    \n-   JavaScript 创建一个 `XMLHttpRequest` 对象。\n-   `XMLHttpRequest` 对象向 Web 服务器发送请求。\n\
    -   服务器处理该请求。\n-   服务器将响应返回给网页。\n-   JavaScript 读取响应。\n-   JavaScript 执行适当的操作。\n\
    \n下一个小练习将演示如何使用 JavaScript 和另一种名为 `PHP` 的脚本语言来使用 AJAX。PHP 是一种服务器脚本语言，因此请记住 `PHP`\
    \ 文件必须存在于服务器上，练习才能完全运行：\n\n1.  打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```php\n\
    <?php\nif(isset($_GET[“studentFirstName”]) && isset($_GET[“studentLastName”]))\
    \ {\n    $fname = htmlspecialchars($_GET[“studentFirstName”]);\n    $lname = htmlspecialchars($_GET[“studentLastName”]);\n\
    \    $studentFullName = $studentFirstName.“ “.$studentLastName;\n    echo “Hello,\
    \ $studentFullName! Welcome!”;\n} else {\n    echo “Hi there, stranger! Welcome!”;\n\
    }\n?>\n```\n\n2.  以 HTML 扩展名保存文件，例如 `greet.php`。\n\n3.  打开你选择的文本编辑器，并输入以下 HTML\
    \ 和 JavaScript 代码：\n\n```html\n<!DOCTYPE html>\n<head>\n    <script>\n       \
    \ function showStudentName() {\n            var request = new XMLHttpRequest();\n\
    \            request.open(“GET”, “greet.php?studentFirstName=Ockert&studentLastName=du\
    \ Preez”);\n            request.onreadystatechange = function() {\n          \
    \      if(this.readyState === 4 && this.status === 200) {\n                  \
    \  document.getElementById(“result”).innerHTML = this.responseText;\n        \
    \        }\n            };\n            request.send();\n        }\n    </script>\n\
    </head>\n<body>\n    <h1>AJAX Example</h1>\n    <p>AJAX Example</p>\n    <div\
    \ id=”result”>\n        <p>Result will be displayed here</p>\n    </div>\n   \
    \ <button type=”button” onclick=”showStudentName()”>Show Full Name</button>\n\
    </body>\n</html>\n```\n\n4.  以 HTML 扩展名保存文件，例如 `Chapter 19.4.html`。\n\n5.  双击文件在默认浏览器中打开。如所述，如果\
    \ PHP 文件保存在服务器上且一切设置正确，加载此文档时不会出现错误。\n\n这里发生了什么？`greet.php` 是存在于服务器上的 PHP 文件。它测试\
    \ `studentFirstName` 和 `studentLastname` 字段是否包含信息。如果是，它们的值将分别存储在两个 PHP 变量对象 `fname`\
    \ 和 `lname` 中。\n\n`studentFullName` PHP 变量由空格分隔的 `fname` 和 `lname` 变量组成。如果提供了值，将出现一条用全名问候学生的消息；否则，将出现一条问候陌生人的消息。\n\
    \n在你创建的 `Chapter19.4html` 文件中，你创建了一个函数 `showStudentName`。该函数的作用是调用 `greet.php`\
    \ 文件中的逻辑，组合给定的名和姓。如果函数执行成功，它将在名为 `result` 的 `div` 中显示全名。\n\n"
- fmt: "\nCoffeeScript compiles to JavaScript. CoffeeScript adds syntactic sugar inspired\
    \ by Ruby, Python and Haskell to enhance JavaScript’s readability.\n\nLet’s assume\
    \ you have the following function in Coffeescript:\n\n```javascript\nadd =(a,b)\
    \ ->\nc=a+b\nconsole.log “Answer is: “+c\n```\n\nIt’s equivalent in JavaScript\
    \ is:\n\n```javascript\n(function() {\n  var add;\n  add = function(a, b) {\n\
    \    var c;\n    c = a + b;\n    return console.log(“Answer is: “ + c);\n  };\n\
    }).call(this);\n```\n\nAlthough CoffeeScript makes use of less code, it can be\
    \ a bit more difficult to follow. Both functions essentially do the same which\
    \ is to add two numbers and provide an answer.\n\n# TypeScript\n\nThe command-line\
    \ TypeScript compiler can be installed as a Node.js package, by navigating to\
    \ the following URL:\n\n[https://www.typescriptlang.org/index.html#download-links](https://www.typescriptlang.org/index.html#download-links)\n\
    \nHere’s a small example on how to create a class in TypeScript:\n\n1. Open a\
    \ text editor of your choice and enter the following code:\n\n   ```typescript\n\
    \   class Car {\n     make: String;\n     model: String;\n     doors: Number;\n\
    \     isAutomatic: Boolean;\n     constructor(make: make, model: String, doors:\
    \ Number, isAutomatic: Boolean) {\n       this.make = make;\n       this.model\
    \ = model;\n       this.doors = doors;\n       this.isAutomatic = isAutomatic;\n\
    \     }\n     make(): void {\n       console.log(‘Car Make and model: ${this.make},\
    \ ${this.model}. Number of doors: ${this.doors}’ );\n     }\n   }\n   let newCar\
    \ = new Car(‘Lamborghini’, ‘Aventador’, 2, false);\n   newCar.make();\n   ```\n\
    \n2. Save the file with an HTML extension, for example `Car.ts`.\n\nBecause TypeScript\
    \ can extend JavaScript features, this looks quite similar to an ordinary JavaScript\
    \ class.\n\n# Conclusion\n\nIn this chapter, we saw how to use JavaScript with\
    \ other variants and languages influenced by it. jQuery, AJAX, and JSON are topics\
    \ that could fill books on their own. You have also seen what other languages\
    \ look like and how they compare to JavaScript.\n\n# Questions\n\n1. What is jQuery?\n\
    2. What is JSON?\n3. What is AJAX?\n4. Name two languages influenced by JavaScript\n\
    5. Is JavaScript still difficult?\n"
  raw: "CoffeeScript compiles to JavaScript. CoffeeScript adds syntactic sugar inspired\
