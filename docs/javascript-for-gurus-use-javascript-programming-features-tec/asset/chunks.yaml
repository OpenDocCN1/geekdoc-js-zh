    The console window shows `Sachin` and `CSS`, as expected. Play around with the
    other elements and don’t be scared to add more elements to the initial arrays.


    The beauty of an array is that you can manipulate its elements by adding more
    elements to it and removing elements from it. You are also able to insert elements
    at specific locations and remove elements from specific locations.


    # Adding items to an array (#toc.xhtml_s261a)


    Arrays are surprisingly versatile when adding items to it. You can add elements
    to the beginning of an array, to the end of an array and to the middle of an array.


    ### Using push to add items to the end of an array


    In order to add elements to the end of an array, you need to use the `push` method,
    as demonstrated below:


    ```javascript

    let arrStudents = [“Ockert”, “Sachin”, “Shoaib”]; //Easy

    arrStudents.push(“John”);

    ```

    John is added to the back of the array


    ### Using unshift to add items to the beginning of an array


    Make use of `unshift` to add items to the beginning of an array. Here is a small
    example:


    ```javascript

    let arrStudents = [“Ockert”, “Sachin”, “Shoaib”];

    arrStudents.unshift(“Sam”);

    ```

    Sam is now at the beginning.


    ### Using splice to add items into the middle of an array


    To add items into the middle of an array (or anywhere other than the beginning
    or end of an array), you need to make use of the `splice` `array` method. This
    is shown below:


    ```javascript

    let arrStudents = [“Ockert”, “Sachin”, “Shoaib”];

    arrStudents.splice(2, 0, “Peter”);

    ```

    Here `Peter` is placed in the third position of the array. One thing about the
    `splice` method is that you can remove items as well, but in this case you supply
    `0`, because you do not want to remove an item, you simply want to insert.


    To bring all the adding methods together, let’s do a quick exercise:


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <html>

    <body>

    <h1>Adding Array elements</h1>

    <p>Adding Array elements</p>

    <script>

    let arrStudents = [“Ockert”, “Sachin”, “Shoaib”];

    console.log(arrStudents);

    arrStudents.push(“John”);

    console.log(arrStudents);

    arrStudents.unshift(“Sam”);

    console.log(arrStudents);

    arrStudents.splice(2, 0, “Peter”);

    console.log(arrStudents);

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 16.4.html`.

    3.  Double-click the file to open it in the default browser.

    4.  Press `Ctrl` + `Shift` + `J` or `F12` in Google Chrome to open the console
    window.


    The output is shown below:


    ![](images/Img_16_03.jpg)


    **Figure 16.3:** Adding array elements


    The initial array contained three items. John was added to the back, then Sam
    was added to the beginning of the array. Finally, Peter was added to the middle.
    Removing items work similarly, let’s have a look


    # Removing items from arrays (#toc.xhtml_s262a)


    Arrays are just as versatile when it comes to removing items from them. You can
    remove items from the beginning of an array and at the end. You can also remove
    items from the middle of an array.


    In order to remove an item from the end of an array, you need to make use of the
    `pop()` method. Let’s do this practically:


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code:


    ```html

    <html>

    <body>

    <h1>Removing Array elements</h1>

    <p> Removing Array elements</p>

    <script>

    let arrStudents = [“Ockert”, “Sachin”, “Shoaib”];

    console.log(arrStudents);

    arrStudents.pop();

    console.log(arrStudents);

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 16.5.html`.

    3.  Double-click the file to open it in the default browser.

    4.  Press `Ctrl` + `Shift` + `J` or `F12` in Google Chrome to open the console
    window.


    The resulting array is shown in the following screenshot:


    ![](images/Img_16_04.jpg)


    **Figure 16.4:** Removing items at the end of an array


    The initial array contained three elements, and now only two. This is because
    of the `pop()` method removing the last array item (`Shoaib`). Let’s now remove
    items from the front, and middle.


    To remove items from the front of an array make use of the `shift` method and
    use `splice` to remove items from the middle:


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code


    ```html

    <html>

    <body>

    <h1>Adding Array elements</h1>

    <p>Adding Array elements</p>

    <script>

    let arrStudents = [“Ockert”, “Sachin”, “Shoaib”, “Jack”, “Carl”];

    console.log(arrStudents);

    arrStudents.shift();

    console.log(arrStudents);

    arrStudents.splice(2, 1)

    console.log(arrStudents);

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 16.6.html`.

    3.  Double-click the file to open it in the default browser.

    4.  Press `Ctrl` + `Shift` + `J` or `F12` in Google Chrome to open the console
    window.


    [Figure 16.5](#c16.xhtml_fig16_5) shows the output:


    ![](images/Img_16_05.jpg)


    **Figure 16.5:** Removing items from the front


    The initial array contained three items. John was added to the back, then Sam
    was added to the beginning of the array. Finally, Peter was added to the middle.
    Removing items work similarly, let’s have a look (`Ockert` is removed via `shift`).


    # Multidimensional arrays (#toc.xhtml_s263a)


    Arrays are just as versatile when it comes to removing items from them. You can
    remove items from the beginning of an array and at the end. You can also remove
    items from the middle of an array.


    To explain this, or at least have more clarity, let’s quickly do an exercise:
    we have been working with single-dimensional arrays, but now I’d talk about multidimensional
    arrays. JavaScript doesn’t directly support them, but it can hold array elements
    inside other elements, thus becoming multidimensional.


    1.  Open a text editor of your choice and enter the following HTML and JavaScript
    code


    ```html

    <html>

    <body>

    <h1>Multidimensional Array</h1>

    <p>Multidimensional Array</p>

    <script>

    var emp1 = [“Ockert”, 15, 25000];

    var emp2 = [“Jack”, 30, 50000];

    var emp3 = [“Joseph”, 45, 75000];

    var emp4 = [“William”, 60, 100000];

    var emp5 = [“Paul”, 75, 125000];

    var salaries = [emp1, emp2, emp3, emp4, emp5];

    for(var i = 0; i < salaries.length; i++) {

    document.write(salaries[i] + “</br>”);

    }

    </script>

    </body>

    </html>

    ```


    2.  Save the file with an HTML extension, for example `Chapter 16.7.html`.

    3.  Double-click the file to open it in the default browser.

    4.  Press `Ctrl` + `Shift` + `J` or `F12` in Google Chrome to open the console
    window.


    The resulting text that gets written to the page is shown below:


    ![](images/Img_16_06.jpg)


    **Figure 16.6:** Multidimensional array


    Five arrays are created. Each with a string value and two numeric values. Another
    array is then created, and it contains the five arrays, thus becoming multidimensional.
    Finally, the array gets iterated with a `for` loop, and its contents get printed
    onto the page, as shown above.


    # Conclusion (#toc.xhtml_s264a)


    In this chapter, we learnt how to use arrays. You learned how to remove items
    from an array as well as add items into an array. You also learned what multidimensional
    arrays are.


    In the next chapter, we will cover regular expressions in JavaScript.


    # Questions (#toc.xhtml_s265a)


    1.  Define the term array.

    2.  What does the `shift` method do?

    3.  Give an example of how to use `splice` to remove an array item.

    4.  What is a multidimensional array?

    5.  What does the `pop` method do?


    # CHAPTER 17 (#toc.xhtml_c17)


    # Regular Expressions (#toc.xhtml_c17)


    # Introduction (#toc.xhtml_s266a)

