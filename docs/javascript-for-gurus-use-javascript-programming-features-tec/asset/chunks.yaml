  trans: "\n\n**图 8.1：** `studentName` 属性\n\n要更改这些属性，你应该使用 `Object` 类的 `defineProperty`\
    \ 方法。下一个示例将 `studentName` 属性的 `writable` 属性改为 `false`。这意味着该属性现在是只读的，无法通过代码进行更改：\n\
    \n```javascript\nObject.defineProperty(newStudent, “studentName”, {\nwritable:\
    \ false\n}); own\n```\n\n```javascript\nnewStudent.studentName = “Test”; // Error:\
    \ 无法赋值给只读属性 ‘studentName’ own\n```\n\n*图 8.2* 显示了在浏览器中运行类似上述代码段的代码时的错误：\n\n![](img/Img_08_02.jpg)\n\
    \n**图 8.2：** `defineProperty` 错误\n\n现在我们对属性有了正确的理解，让我们继续为属性创建 getters（get 器）和\
    \ setters（set 器）。\n\n# Getters and setters](#toc.xhtml_s124a)\n\n到为止，在书中我主要处理的是数据属性。另一种类型的属性被称为访问器属性（accessor\
    \ property）。这意味着这些类型的属性实际上是能够获取和设置值的函数，但从外部看是普通的属性。\n\n访问器属性包含 `getter` 和 `setter`\
    \ 方法，如下：\n\n```javascript\nlet object = {\n  get propertyName() {\n    // 在获取\
    \ object.propertyName 时执行代码\n  },\n  set propertyName(value) {\n    // 在设置 object.propertyName\
    \ = value 时执行代码\n  }\n};\n```\n\n在上面的对象声明中，你会注意到一个 `get` 和一个 `set`。当请求对象的属性时，会执行\
    \ `get`。例如：`c = Object.Color`。get 函数将把对象的 `Color` 属性的值返回给变量为 `c`。\n\n`Set` 用于给属性赋值。例如：`Object.Color\
    \ = Red`。通过使用 setter，`Color` 属性将被设置为 `Red`。\n\n让我们做一个小练习，让你看到使用 getters 和 setters\
    \ 是多么简单。\n\n1.  打开你喜欢的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n\
    \    <h1>Property Getters and Setters example</h1>\n    <p>Property Getters and\
    \ Setters example</p>\n    <script>\n    let Student = {\n        studentName:\
    \ “Ockert”,\n        studentSurname: “du Preez”,\n        get studentFullName()\
    \ {\n            return ‘${this.studentName} ${this.studentSurname}’;\n      \
    \  },\n        set studentFullName(value) {\n            [this.studentName, this.studentSurname]\
    \ = value.split(“ “);\n        }\n    };\n    Student.studentFullName = “BpB Publications”;\n\
    \    alert(Student.studentName); //BPB\n    alert(Student.studentFullName); //BpB\
    \ Publications\n    </script>\n</body>\n</html>\n```\n\n2.  以 HTML 扩展名保存文件，例如\
    \ `Chapter 8.3.html`。\n\n3.  双击文件在默认浏览器中打开它。\n\n通过使用 setter，你将 `studentFullName`\
    \ 属性设置为 `BPB Publications`。如果没有属性 setter 而是属性字母，你可能会得到错误。通过使用属性 getter，你获取了属性当前值的访问。打开时，将显示两个警告框。一个显示\
    \ `BpB`，另一个显示 `BpB Publications`。\n\n*图 8.3* 显示了基于上述示例给出的警告框组合：\n\n![](img/Img_08_03.jpg)\n\
    \n**图 8.3：** Getter 和 setter 属性\n\n就像本章之前解释的属性标记一样，访问器也有描述符（descriptors）。让我们来看看。\n\
    \n访问器描述符与数据属性的描述符略有不同。访问器属性没有 `writable` 描述符，但包含 get 和 set 函数。访问器描述符具有：\n\n* \
    \  **get**: 读取属性时工作。\n*   **set**: 设置属性时调用。\n*   **enumerable**: 属性是否可以被列出。\n\
    *   **configurable**: 允许删除属性。\n\n"
