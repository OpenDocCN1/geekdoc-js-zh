    \ produce an error because the `AllInfo` method is static and can only be accessed\
    \ from within the class.\n\n# [Inheritance](#toc.xhtml_s107a)\n\nObjects inherit\
    \ features from other objects. Earlier in this chapter, I have spoken about the\
    \ car object. I have explained that each car has four wheels and other common\
    \ features, but what about trucks or buses?\n\nAlthough trucks usually have more\
    \ than four wheels, they still form part of the vehicle family. Buses may have\
    \ four wheels, but they have many more seats than cars and trucks; still they\
    \ form part of the vehicle family.\n\nAnother example would be that you inherit\
    \ features from your parents. You may have your mother’s hair and eyes, and you\
    \ may have your dad’s personality, but you are still unique and still you. This\
    \ process is known as inheritance.\n\nIn [Chapter 7](#c07.xhtml)*:* Prototypes,\
    \ we will explore inheritance much further as well as use Mixins to use methods\
    \ from different classes without the need of inheritance.\n\n# [Conclusion](#toc.xhtml_s108a)\n\
    \nIn this chapter, welearnt JavaScript classes and how to make use of them. We\
