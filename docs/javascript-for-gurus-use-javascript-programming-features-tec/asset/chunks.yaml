    \n4.  Name the three attributes of a property.\n\n5.  Explain the term inheritance.\n\
    \n# [CHAPTER 7](#toc.xhtml_c07)\n\n# [JavaScript Prototypes](#toc.xhtml_c07)\n\
    \n# [Introduction](#toc.xhtml_s110a)\n\nPrototypes in JavaScript enable us to\
    \ make our code a bit more Object Oriented. JavaScript prototypes help us construct\
    \ objects nicely. Yes, classes do the same thing, but prototypes address several\
    \ shortcomings of ordinary JavaScript classes.\n\nThere are different prototypes,\
    \ and we will investigate a few of them. The fun part of this chapter starts with\
    \ inheritance and Mixins where we can borrow properties and methods from other\
    \ JavaScript classes\n\n# [Structure](#toc.xhtml_s111a)\n\n*   What are prototypes?\n\
    \n*   Prototypal inheritance\n\n*   Mixins\n\n# [Objectives](#toc.xhtml_s112a)\n\
    \n*   Learn the different types of prototypes\n\n*   Understand the need for prototypes\n\
    \n*   Understand prototypal inheritance\n\n*   Understand Mixins\n\n# [What are\
    \ prototypes?](#toc.xhtml_s113a)\n\nPrototypes in JavaScript enable us to make\
    \ our code a bit more object-oriented. JavaScript prototypes help us construct\
    \ objects nicely. Yes, classes do the same thing, but prototypes address several\
    \ shortcomings of ordinary JavaScript classes.\n\nThere are two prototypes in\
    \ JavaScript, namely prototype and [[Prototype]]:\n\n*   `prototype`: The prototype\
    \ is assigned as a property of any function you create in JavaScript, as explained\
    \ in *[Chapter 6: JavaScript Classes](#c06.xhtml)*.\n\n*   `[[Prototype]]`: Each\
    \ object that is accessed by the running context has a `[[Prototype]]` property,\
    \ which gets read when a certain property on the object being read, is not available.\n\
    \nOK, this doesn’t really make sense now, does it? No.\n\nLet’s have a closer\
    \ look.\n\nWe have learned in [Chapter 6: JavaScript Classes](#c06.xhtml), that\
    \ you can create objects by using a constructor function. Let’s have a look at\
    \ the below example:\n\n`function Student(studentFirstName, studentLastName) {`\n\
    \n`this.studentFirstName = studentFirstName,`\n\n`this.studentLastName = studentLastName,`\n\
    \n`this.studentFullName = function() {`\n\n`return this.studentFirstName + “ “\
    \ + this.studentLastName;`\n\n`}`\n\n`}`\n\n`var student1 = new Student(“Ockert”,\
    \ “du Preez”);`\n\n`var student2 = new Student(“BpB”, “Publications”);`\n\n`console.log(student1)`\n\
    \n`console.log(student2)`\n\nThe function `Student` is the constructor function\
    \ for a `Student` object. It includes the first name and last name parameters,\
    \ or in this case, properties. `studentFullName` is a function combining the first\
    \ name and last name strings.\n\nTwo `Student` objects are then created: `student1`\
    \ and `student2`, and the results get displayed in the console window.\n\nNow,\
    \ by looking at this code, nothing seems to be out of place. It is not. It creates\
    \ two copies of the `Student` constructor function, each for `student1` and `student2`.\
    \ This means that every object created by using the `Student` constructor function\
    \ will have its own copy of methods and properties. This is where the problem\
    \ comes in. The `studentFirstName` method in the constructor. It wastes memory\
    \ by having two instances of it, and it does the same thing in each separate object.\n\
    \nWe fix this by creating prototypes.\n\nEvery time a function is created, the\
    \ JavaScript engine automatically adds a prototype property to it. This is known\
    \ as a prototype object, and it includes its own constructor by default. The constructor\
    \ points back to the function on which the prototype object is a property. You\
    \ access the function’s prototype property using `functionName.prototype`.\n\n\
    *[Figure 7.1](#c07.xhtml_fig7_1)* below shows that the Student constructor function\
    \ contains a prototype property that points to the prototype object. This prototype\
    \ object contains a constructor property that points back to the Student constructor\
    \ function:\n\n![](images/Img_07_01.jpg)\n\n**Figure 7.1:** Student constructor\
    \ function\n\nLet’s do a quick example\n\nThe following sample makes use of a\
    \ function to construct `Student` objects:\n\n1.  Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code\n\n    `<html>`\n\n    `<body>`\n\
    \n    `<h1>Prototype object example</h1>`\n\n    `<p>Prototype object example</p>`\n\
    \n    `<script>`\n\n    `function Student(studentFirstName, studentLastName) {`\n\
    \n    `this.studentFirstName = studentFirstName,`\n\n    `this.studentLastName\
