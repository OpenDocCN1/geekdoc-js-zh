  trans: "\n\n通俗地来说，`function` 是一个返回特定值的代码块。它可以被比作脚本或程序内部的一个小型子程序，从另一个方法或函数中调用（或触发）。调用它的方法、函数或对象将使用被调用函数返回的值。函数应该始终返回一个值。如果没有指定返回值，则将返回\
    \ `undefined`。\n\nJavaScript 中的函数是一等对象，这意味着它们可以拥有属性和方法。任何函数都由一个声明或表达式、可选参数和默认值组成。\n\
    \n# 函数声明\n\n通过声明函数，你告诉解释器该函数应该被存储在内存中以备后用。当函数从代码的某处被调用时，就会发生这种情况。要声明一个函数，你应该使用类似于以下的代码：\n\
    \n```javascript\nfunction functionName(parameters) {\n  // code block\n}\n```\n\
    \n首先编写 `function` 关键字。这是为了告诉解释器你正在创建一个函数。名称紧随 `function` 关键字之后。它可以可以是任何名称，JavaScript\
    \ 关键字除外，并记住它是区分大小写的。在括号内，你可以包含一个用逗号分隔的参数列表。这是一个小例子：\n\n```javascript\nfunction\
    \ showGreeting() {\n  alert(‘Good morning!’\n}\n```\n\n在上面的代码段中，创建了一个名为 `showGreeting`\
    \ 的没有任何参数的函数，并显示一个包含 `Good morning!` 消息的警告框。\n\n### 你有了一个函数，现在怎么办？\n\n嗯，函数如果没有从某处被调用（或触发），它是无法运行的。在调用函数时，你只需要引用函数名并包含它的可选参数。函数可以从以下任何方式被调用：\n\
    \n* 当事件发生时\n* 当被直接调用时\n* 自执行\n\n# 事件触发的函数示例\n\n以下是一个如何从按钮点击或鼠标移动等事件调用函数的示例：\n\n\
    1. 打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Invoke\
    \ function from button click</h1>\n  <p>The following code Calls a function from\
    \ a button click</p>\n  <script>\n    function showGreeting() {\n      alert(‘Good\
    \ morning!’);\n    }\n  </script>\n  <button onclick=”showGreeting()\">Greeting</button>\n\
    </body>\n</html>\n```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 5.1.html`。\n3. 双击文件在默认浏览器中打开它。\n\
    \n正如你将看到的，页面正常加载，还没有弹出警告框。这是因为我们从按钮的点击事件中调用了该函数。如果没有点击按钮，函数将不会执行。\n\n点击按钮，注意弹出的消息，如下截图所示：\n\
    \n![](img/Img_05_01.jpg)\n\n**图 5.1：** 从按钮点击调用的函数\n\n# 直接调用的函数示例\n\n以下是一个如何直接调用函数的示例：\n\
    \n1. 打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Invoke\
    \ function directly</h1>\n  <p>The following code Calls a function just after\
    \ the function is created</p>\n  <script>\n    function showGreeting() {\n   \
    \   alert(‘Good morning!’);\n    }\n    showGreeting();\n  </script>\n</body>\n\
    </html>\n```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 5.2.html`。\n3. 双击文件在默认浏览器中打开它。\n\
    \n# 自执行函数示例\n\n以下是一个如何自动调用函数的示例。这意味着它是一个函数，但不需要添加单独的调用来触发它，因为它调用了它自己：\n\n1. 打开你任选的文本编辑器并输入以下\
    \ HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Self-Invoke function\
    \ expression</h1>\n  <p>The following code creates a function and invokes it automatically</p>\n\
    \  <script>\n    (function showGreeting(){\n      alert(‘Good morning!’);\n  \
    \  })()\n  </script>\n</body>\n</html>\n```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter\
    \ 5.3.html`。\n3. 双击文件在默认浏览器中打开它。\n\n这里的函数声明看起来有一点不同，原因是因为我们现在创建了一个函数表达式（我们将在本章稍后部分介绍函数表达式）。名为\
    \ `showGreeting` 的函数被创建并自动执行，无需手动调用。\n\n# 参数\n\n参数或函数参数是用来传递给函数的额外数据。函数随后可以以它喜欢的方式使用并操纵该参数。在函数中包含参数的另一个好处是，你可以传递不同的值作为参数，函数仍然会相应地工作。\n\
    \n这里是一个如何使用其参数向函数发送不同值的示例：\n\n1. 打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n\
    <html>\n<body>\n  <h1>Function Parameters</h1>\n  <p>The following code creates\
    \ a function with parameters and makes use of the parameters inside the function</p>\n\
    \  <script>\n    function showGreeting(from, message) { // arguments: from, message\n\
    \      alert(from + ‘: ‘ + message);\n    }\n    showGreeting(‘Ockert’, ‘Hello!’);\
    \ // Outputs - Ockert: Hello!\n    showGreeting(‘BpB’, “Hi!”); // Outputs - BPB:\
    \ Hi!\n  </script>\n</body>\n</html>\n```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 5.4.html`。\n\
    3. 双击文件在默认浏览器中打开它。\n\n声明了一个名为 `showGreeting` 带有两个参数 `from` 和 `message` 的函数。在代码块内部调用了警告框并将值复制到参数中。第一次调用\
    \ `showGreeting` 函数包括：`Ockert`、`Hello!`。第二次调用 `showGreeting` 函数包括：`BpB`、`Hi!`。当运行此脚本时，你将看到两个警告框相继弹出。第一个警告包含输入数据；第二个警告包含最后的输入数据。\n\
    \n# 默认值\n\n当未提供参数时，它的值将变为 `undefined`。例如，如果你这样做：\n\n```javascript\nfunction showGreeting(from,\
    \ message) { // arguments: from, message\n  alert(from + ‘: ‘ + message);\n}\n\
    showGreeting(‘Ockert’); // Outputs - Ockert: undefined\n```\n\n这是完全可以的，解释器不会产生错误。这就是默认值发挥作用的地方。你可以给参数一个默认值，这样即使没有提供值，它仍然有一个可以使用的设置默认值。\n\
    \n这是一个小例子：\n\n```javascript\nfunction showGreeting(from, message = ‘Hey there!’)\
    \ { // arguments: from, message\n  alert(from + ‘: ‘ + message);\n}\nshowGreeting(‘Ockert’);\
    \ // Outputs - Ockert: Hey there!\n```\n\n# 函数表达式\n\nJavaScript 函数也可以通过表达式定义，并且通常存储在变量中。该变量随后可以被作函数使用。这是一个小例子：\n\
    \n```javascript\nvar answer = function (operand1, operand2) {return operand1 *\
    \ operand2};\n```\n\n在 `Chapter 12: Variables` 中，我们将对变量和函数进行更详细的介绍。\n\n# 总结\n\n\
    在本章中，我们通过一些很好的示例学习了 `JavaScript` 函数。我们学习了 `Functions` 如何改进我们的代码，以及如何通过参数和默认值进一步改进它。在本书稍后部分（在\
    \ `Chapter 12: Variables` 中），我们将再次回到函数并探索函数表达式的世界。\n\n"
- fmt: "\nIn the next chapter, we will dive into JavaScript classes. You will learn\
    \ how to create JavaScript classes, properties and methods and Mixins. You will\
    \ also have a look into the existing classes in JavaScript as well as inheritance.\n\
    \n## Questions\n\n1. Explain the term `function`.\n2. Name the three ways in which\
    \ a function can be invoked.\n3. What is a parameter?\n4. Give an example of a\
    \ function with a default value.\n5. Explain the term `function expression`.\n\
    \n## SECTION II: The Power of JavaScript\n\n### Introduction\n\nSection 2 dives\
    \ right into the real power of JavaScript. Understanding what makes JavaScript\
    \ tick is pivotal in creating extremely powerful websites and web applications.\
    \ In this section, you will learn how to create classes, and then move on to prototypes,\
    \ properties and promises, finally generators, and modules.\n\nThis section will\
    \ have the following chapters:\n\n1. Classes\n2. Prototypes\n3. Properties\n4.\
    \ Promises\n5. Generators\n6. Modules\n\n## CHAPTER 6: JavaScript Classes\n\n\
    ### Introduction\n\nA JavaScript class creates the structure of its child objects.\
    \ Although JavaScript is not a full-on object-oriented programming (`OOP`) language,\
    \ it still contains many an OOP feature. Learning how to work with classes is\
    \ essential to create proper reusable objects.\n\nIn this chapter, we will focus\
    \ on JavaScript classes. You will learn different ways to create classes and how\
    \ to instantiate child objects from classes. Properties and methods are next.\
    \ You will learn how to create basic properties and methods to give your classes\
    \ better structure and better adaptability. Lastly, you will get a quick introduction\
    \ to inheritance. There is a lot of work, so let’s get started!\n\n### Structure\n\
    \n* What are classes?\n    * Creating a class\n    * Class declarations\n    *\
    \ Class expressions\n* Properties\n    * Properties of properties\n* Methods\n\
    \    * Static methods\n* Inheritance\n\n### Objectives\n\n* Learn what classes\
    \ are\n* Understand the concepts of properties\n* Understand the concepts of methods\n\
    * Learn what inheritance is\n\n### What are classes?\n\nA class, in OOP, is a\
    \ template or blueprint from which objects can be created. A class in JavaScript\
    \ is a type of function which can be created with a class declaration or a class\
    \ expression.\n\n### Creating a class\n\nThere are essentially two ways to create\
    \ a class in JavaScript; they are:\n\n* Declaring a class\n* Using a class expression\n\
    \nLet’s have a look at examples for each.\n\n### Class declarations\n\nTo declare\
    \ a class, all you need to do is to use the `class` keyword and supply name of\
    \ the class, with a `constructor`. A `constructor` is a special type of method\
    \ where the object can be initialized, and it gets called automatically. You can\
    \ also supply arguments (parameters) to the class here and initialize them as\
    \ well. Initialization is the assignment (setting) of an initial value for an\
    \ object or variable. Here is an example:\n\n```javascript\nclass Student {\n\
    \  constructor(studentName, studentCourse) {\n    this.studentName = studentName;\n\
    \    this.studentCourse = studentCourse;\n  }\n}\n```\n\nIn the above code, we\
    \ created a class named `Student`. The `constructor` function gets two arguments\
    \ supplied to it. These two arguments are `studentName` and `studentCourse`.\n\
    \nLet’s take it further. The following sample shows how to declare a class, initialize\
    \ some of its objects, and make use of a class outside of the class:\n\n```html\n\
    <html>\n<body>\n  <h1>Class declaration example</h1>\n  <p>Class Declaration example</p>\n\
    \  <script>\n    class Student {\n      constructor(studentName, studentCourse)\
    \ {\n        this.studentName = studentName;\n        this.studentCourse = studentCourse;\n\
    \      }\n      showInfo() {\n        alert('Student: ' + this.studentName + '\
    \ is doing: ' + this.studentCourse);\n      }\n    }\n    // Usage:\n    student\
    \ = new Student('ckert', 'JavaScript');\n    student.showInfo();\n  </script>\n\
    </body>\n</html>\n```\n\n1. Save the file with an HTML extension, for example\
    \ `Chapter 6.1.html`.\n2. Double-click the file to open it in the default browser.\n\
    An alert box similar to the next screenshot will appear: `Img_06_01.jpg`\n\n**Figure\
    \ 6.1:** Class Declaration in action\n\nLet me explain what happens: we have created\
    \ the `Student` class and its `constructor`. Then we initialize the `studentName`\
    \ and `studentCourse` variables. Inside the `Student` class you created a function\
    \ named `showInfo`. The `showInfo` function displays an alert box with the supplied\
    \ `studentName` and `studentCourse`. Then we created a `Student` object name (notice\
    \ that JavaScript is case sensitive). Inside the student object, you supply details\
    \ such as your name (or mine in this case) and the course. Lastly, you invoke\
    \ the `showInfo` function from the `student` object, and this displays the alert\
    \ box shown in Figure 6.1.\n\nNow that you know how to create a class let’s see\
    \ how to create expressions to create classes.\n\n### Class expressions\n\nClasses,\
    \ just like functions, can be defined inside expressions, as explained in Chapter\
    \ 5: Functions. Class expressions can be named or unnamed. Let’s do an example\
    \ on both.\n\nThe following sample shows an unnamed class example:\n\n```html\n\
    <html>\n<body>\n  <h1>Unnamed Class expression example</h1>\n  <p>Unnamed Class\
    \ expression example</p>\n  <script>\n    let Student = class {\n      constructor(studentName,\
    \ studentCourse) {\n        this.studentName = studentName;\n        this.studentCourse\
    \ = studentCourse;\n      }\n      showInfo() {\n        alert('Student: ' + this.studentName\
    \ + ' is doing: ' + this.studentCourse);\n      }\n    };\n    // Usage:\n   \
    \ var student = new Student('ckert', 'JavaScript');\n    student.showInfo();\n\
    \  </script>\n</body>\n</html>\n```\n\n1. Save the file with an HTML extension,\
    \ for example `Chapter 6.2.html`.\n2. Double-click the file to open it in the\
    \ default browser.\n\nOK, so what happens here? You created an unnamed class by\
    \ using an expression. Then you created a `constructor`, initialize the arguments\
    \ and created the `showInfo` function to display the values input.\n\nThe following\
    \ sample shows a named class expression example:\n\n```html\n<html>\n<body>\n\
    \  <h1>Named Class expression example</h1>\n  <p>Named Class expression example</p>\n\
    \  <script>\n    let student = class Student {\n      constructor(studentName,\
    \ studentCourse) {\n        this.studentName = studentName;\n        this.studentCourse\
    \ = studentCourse;\n      }\n      showInfo(){\n        alert('Student: ' + this.studentName\
    \ + ' is doing: ' + this.studentCourse);\n      }\n    };\n    // Usage:\n   \
    \ var newStudent = new student('ckert', 'JavaScript');\n    newStudent.showInfo();\n\
    \  </script>\n</body>\n</html>\n```\n\n1. Save the file with an HTML extension,\
    \ for example `Chapter 6.3.html`.\n2. Double-click the file to open it in the\
    \ default browser.\n\nAs you can see, it is almost similar to the preceding two\
    \ examples, but it is still different. You specify a name for the class in the\
    \ class expression, create the constructor and then create a `newStudent` object\
    \ which is based on the student object linking to the `Student` class.\n\n###\
    \ Properties\n"
