  raw: 'JavaScript is one of the core technologies of the **World Wide Web** (**WWW**).
    JavaScript is a high-level, interpreted programming language, meaning that most
    of its instructions execute directly without having to be compiled. The most enticing
    feature of JavaScript is its ability to make web pages interactive. The JavaScript
    language supports dynamic typing, functions, prototype-based orientation, and
    a plethora of APIs allowing you to work with arrays, text, regular expressions,
    dates and the **Document Object Model** (**DOM**).


    JavaScript was initially only implemented client-side in web browsers, but now,
    JavaScript engines are embedded in many other types of host software, which includes:


    *   Server-side in web servers and databases


    *   Non-web programs


    *   Runtime environments which make JavaScript available for writing mobile and
    desktop applications


    By being embedded in other types of host, the software makes JavaScript more versatile,
    more powerful and more adaptable to change across platforms.


    # [History of JavaScript](#toc.xhtml_s6a)


    In order to shed more light on the history of JavaScript, let’s quickly have a
    look at the term browser wars.


    # [Browser wars](#toc.xhtml_s7a)


    As the name implies, a browser war is a competition between web browsers, mostly
    about usage share. During the late 1990s, the first browser war occurred between
    Microsoft Internet Explorer and Netscape Navigator.


    The first browser war lasted from 1995 and continued until 2001\. Netscape Navigator
    was the most widely used web browser because Microsoft only released Internet
    Explorer 1.0 as part of the Microsoft Windows 95 Plus! pack in August 1995.


    Microsoft released Internet Explorer 2.0 as a free download three months later.
    Internet Explorer 4 changed everything. Internet Explorer 4 was integrated into
    Microsoft Windows, and this started Netscape Navigator’s downfall, as users didn’t
    feel the need to download another browser when they have a browser in Internet
    Explorer already.


    The first browser war ended with Internet Explorer having no remaining serious
    competition for its market share thus, bringing an end to the rapid innovation
    in web browsers.


    With the decline of Internet Explorer’s usage share and rise in popularity of
    browsers such as Firefox, Google Chrome, Safari, Opera browser wars intensified
    in the early 2010s.


    # [The start of JavaScript](#toc.xhtml_s8a)


    *Marc Andreessen*, the founder of *Netscape Communications,* envisioned a more
    dynamic web experience. Instead of displaying only static web pages that couldn’t
    cater much for user activity, he wanted more. The problem was that wanting a more
    dynamic web experience which included automation, animations and basic user interaction,
    needed a lightweight scripting language which was accessible to non-programmers
    and a language that could directly interact with the DOM.


    *Mocha* was born. Mocha would become a web scripting language which was simple
    and dynamic. Enter *Brendan Eich*, the father of JavaScript. Netscape Communications
    contracted Eich to develop Scheme (lightweight Lisp dialect) for their browser.
    Scheme was powerful, dynamic, and functional. After a few months, a prototype
    of Mocha was integrated into Netscape Communicator during May 1995\. Quickly thereafter
    it was renamed to LiveScript. In December 1995, Mocha/LiveScript was renamed to
    JavaScript, and it was presented as a scripting language for client-side browser
    tasks.


    # [Why JavaScript?](#toc.xhtml_s9a)


    It is hard to imagine a web browser with no scripting, except for HTML, in 2019\.
    There would be no interaction, no dynamic content, no communication with the DOM.
    Worse than that, imagine a world without JavaScript entirely. There would be no
    JSON, no jQuery and no AJAX. If there had been mobile applications, it would have
    been more difficult to write.


    # [JavaScript features](#toc.xhtml_s10a)


    In this book, we will explore the ins-and-outs of JavaScript, so some of the features
    listed here in the next list might be covered sooner than the others. It just
    depends on the complexity of the feature as well as our level of understanding
    of JavaScript and its features.


    The following list highlights a few awesome features of JavaScript:


    *   Validating the user’s input


    *   Client-side calculations


    *   Browser control


    *   Platform independent


    *   Handling dates and time


    *   Generating HTML content


    *   Detecting the user’s operating system information


    *   Create new functions within scripts


    During the course of this book, we will learn more about these features and make
    use of them practically.


    # [Conclusion](#toc.xhtml_s11a)


    In this chapter, we explored the general purpose of the JavaScript language. It
    is important to understand why a language exists, and what gap it filled within
    the web development landscape. We then briefly looked into its history and touched
    on some of its most common uses and features.


    As you saw, it is important to understand the origins of JavaScript in order to
    fully appreciate its power. You have learned the history of JavaScript, what influence
    the browser wars had on the creation of JavaScript, and lastly answered the question
    of why there is a need for JavaScript.


    In the next chapter, wecontinue with the introductory section and explain JavaScript
    objects. We will learn how to create them and how to use them properly within
    our web pages. Without objects, there simply is no JavaScript.


    # [Questions](#toc.xhtml_s12a)


    1.  Who created JavaScript?


    2.  Explain the term browser war.


    3.  Name four features of the JavaScript language.


    4.  Explain the term DOM.


    5.  What is JavaScript’s benefit over a language such as HTML?


