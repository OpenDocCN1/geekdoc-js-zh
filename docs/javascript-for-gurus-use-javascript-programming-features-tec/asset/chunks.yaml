- fmt: "\n3. Double-click the file to open it in the default browser. If the browser\
    \ is Google Chrome, press `Ctrl` + `Shift` + `J` to open the console window.\n\
    \nThe instructions will happen one at a time and one after the other. In the event\
    \ of one of the instructions are taking too long, the next instructions will wait\
    \ until its completion to be run. Your console window should resemble `[Figure\
    \ 9.3](#c09.xhtml_fig9_3)* below:\n\n![](images/Img_09_03.jpg)\n\n**Figure 9.3:**\
    \ Synchronous calls in action\n\nThe following sample shows asynchronous calls\
    \ in action:\n\n1.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code:\n\n    ```html\n    <html>\n    <body>\n    <h1>Asynchronous\
    \ methods example</h1>\n    <p>Asynchronous methods example</p>\n    <script>\n\
    \    console.log(“Hello”)\n    setTimeout(function()\n    {\n    console.log(“Ockert”)\n\
    \    }, 3000);\n    console.log(“My name is “)\n    </script>\n    </body>\n \
    \   </html>\n    ```\n\n2.  Save the file with an HTML extension, for example\
    \ `Chapter 9.4.html`.\n\n3.  Double-click the file to open it in the default browser.\
    \ If the browser is Google Chrome, press `Ctrl` + `Shift` + `J` to open the console\
    \ window.\n\nThe first statement to be run would be the statement logging `Hello`\
    \ into the console window. It will start the `Timer`, but still continue onto\
    \ the next statement logging `My name`. When the timer has completed, it will\
    \ log my name. As you can see, it didn’t wait for the timer to completeits task\
    \ in order to continue. Your console window should resemble `[Figure 9.4](#c09.xhtml_fig9_4)*\
    \ below:\n\n![](images/Img_09_04.jpg)\n\n**Figure 9.4:** Asynchronous calls in\
    \ action\n\nNow that you have a better understanding of asynchronous calls let’s\
    \ shift our focus back to promises.\n\n# [Chaining Promises](#toc.xhtml_s134a)\n\
    \nWhat if we take asynchronous tasks a bit further? How? Well, imagine you have\
    \ a sequence of asynchronous tasks to be done one after another. In other words,\
    \ you want to call `method_2` when `method_1` completes, and when `method_2` completes,\
    \ you then want to call `method_3`, and so on. This is where chaining comes in.\n\
    \nYou literally chain as many then ables needed in your promise by using the keyword\
    \ `.then`. The following sample shows how to chain promises:\n\n1.  Open a text\
    \ editor of your choice and enter the following HTML and JavaScript code:\n\n\
    \    ```html\n    <html>\n    <body>\n    <h1>Chaining promises example</h1>\n\
    \    <p>Chaining Promises example</p>\n    <script>\n    var Method_1 = function()\
    \ {\n    var promise = new Promise(function(resolve, reject){\n    setTimeout(function()\
    \ {\n    console.log(‘Method_1 Done.’);\n    resolve({string: ‘1’});\n    }, 3000);\n\
    \    });\n    return promise;\n    };\n    var Method_2 = function(strTemp) {\n\
    \    var promise = new Promise(function(resolve, reject){\n    setTimeout(function()\
    \ {\n    console.log(‘Method_2 Done.’);\n    resolve({newString: strTemp.string\
    \ + ‘2’});\n    }, 3000);\n    });\n    return promise;\n    };\n    var Method_3\
    \ = function(strTemp) {\n    var promise = new Promise(function(resolve, reject){\n\
    \    setTimeout(function() {\n    console.log(‘Method_3 Done.’);\n    resolve({endString:\
    \ strTemp.newString});\n    }, 3000);\n    });\n    return promise;\n    };\n\
    \    Method_1()\n    .then(Method_2)\n    .then(Method_3);\n    </script>\n  \
    \  </body>\n    </html>\n    ```\n\n2.  Save the file with an HTML extension,\
    \ for example `Chapter 9.5.html`.\n\n3.  Double-click the file to open it in the\
    \ default browser. If the browser is Google Chrome, press `Ctrl` + `Shift` + `J`\
    \ to open the console window.\n\nThere are three asynchronous methods in the example\
    \ above. You will also notice that each method contains a promise with a resolve\
    \ argument. This is the trick. When the asynchronous method completes successfully,\
    \ it sends the resolve argument to the next asynchronous method. The argument\
    \ contains a simple string value that is passed on to the next method.\n\nThis\
    \ information is then not really used, but the string grows continuously. In the\
    \ event of something wrong happens, the resolve argument will fail, and the promise\
    \ would also fail.\n\nEach method contains a timer that prints a string of text\
    \ after three seconds. If all went well, your console window should resemble `[Figure\
    \ 9.5](#c09.xhtml_fig9_5)* underneath:\n\n![](images/Img_09_05.jpg)\n\n**Figure\
    \ 9.5:** Chaining Promises\n\nContinuing with asynchronous tasks and methods,\
    \ those of you who are a bit more advanced or experienced, may be surprised that\
    \ I haven’t mentioned callbacks yet, well I try to do things systematically, especially\
    \ for newbies.\n\n# [Callbacks and Promisification](#toc.xhtml_s135a)\n\nI will\
    \ do callbacks now, but I will then talk about Promisification as well because\
    \ they tie into one another.\n\n# [Callbacks](#toc.xhtml_s136a)\n\nA callback\
    \ is simply a function that executes after another function has finished executing.\
    \ It sounds easy enough, so let’s look at an easy but complex example.\n\nThe\
    \ following sample creates a callback:\n\n1.  Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n    ```html\n    <html>\n\
    \    <body>\n    <h1>Callback example</h1>\n    <p>Callback example</p>\n    <script>\n\
    \    function DisplayName(name, surname, callback){\n    document.write(‘Welcome\
    \ ${name + surname}!` `+”<br>”);\n    callback();\n    }\n    function EnjoyMessage(){\n\
    \    document.write(‘Enjoy your.’);\n    }\n    DisplayName(‘Ockert’, du Preez’,\
    \ EnjoyMessage);\n    </script>\n    </body>\n    </html>\n    ```\n\n2.  Save\
    \ the file with an HTML extension, for example `Chapter 9.6.html`.\n\n3.  Double-click\
    \ the file to open it in the default browser.\n\nIn the above example, you have\
    \ created a function named `DisplayName`. This function accepts three arguments:\
    \ `name`, `surname` and `callback`. The next line you use `document.write` to\
    \ write text to the page; The next function you created is the function named\
    \ `EnjoyMessage`. This function simply writes more text to the web. The question,,\
    \ however, is when does it do that?\n\nWell, the last line of code you invoke\
    \ the `DisplayName` function. You feed it my name and surname, and then you feed\
    \ it the `EnjoyMessage` function. The `EnjoyMessage` function is the callback\
    \ function, and it will run as soon as the other function has completed.\n\nSee,\
    \ it is not too difficult!\n\nYour web browser should resemble `[Figure 9.6](#c09.xhtml_fig9_6)*:\n\
    \n![](images/Img_09_06.jpg)\n\n**Figure 9.6:** Callback in action\n\nNow that\
    \ we know more about callbacks let’s have a look into Promisification.\n\n# Promisification\n\
    \nPromisification is the process of converting a function that accepts a callback\
    \ into a function that returns a promise.\n\nThe following sample shows a quick\
    \ way to promisify a callback function:\n\n1.  Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n    ```html\n    <html>\n\
    \    <body>\n    <h1>Promisification example</h1>\n    <p>Promisification example</p>\n\
    \    <script>\n    function promiseDisplayName(name, surname) {\n    return new\
    \ Promise((resolve, reject) =>\n    DisplayName(name, surname, (err, result) =>\n\
    \    // If there’s an error, reject; otherwise resolve\n    err ? `reject(err)`\
    \ : resolve(result)`\n    )\n    );\n    }\n    //Invoke it like:\n    promiseDisplayName(‘Ockert’,\
    \ ‘ Du Preez’).then(result => {\n    //resolved\n    }).catch(err => {\n    //\
    \ error\n    });\n    </script>\n    </body>\n    </html>\n    ```\n\n2.  Save\
    \ the file with an HTML extension, for example `Chapter 9.7.html`.\n\n3.  Double-click\
    \ the file to open it in the default browser.\n\nCallbacks and promises have their\
    \ uses. There are some tasks that can be easily promisified.\n\n# [Microtasks\
    \ and macrotasks](#toc.xhtml_s137a)\n"
