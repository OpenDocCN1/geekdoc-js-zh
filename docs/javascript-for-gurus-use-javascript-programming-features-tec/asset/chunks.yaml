  trans: "\n\n```javascript\ndocument.write('Visiting 15 places in 15 days');\nbreak;\n\
    case 25:\ndocument.write('Visiting 25 places in 25 days');\nbreak;\n}\nbreak;\n\
    case ‘America’:\nswitch(Stops)\n{\ncase 7:\ndocument.write('Visiting 7 places\
    \ in 7 days');\nbreak;\ncase 14:\ndocument.write('Visiting 14 places in 14 days');\n\
    break;\ncase 21:\ndocument.write('Visiting 21 places in 21 days');\nbreak;\n}\n\
    break;\n}\n</script>\n</body>\n</</html>\n```\n\n2. 将文件以 HTML 扩展名保存，例如 `Chapter\
    \ 13.7.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\n大量的输入……\n\n这里发生的情况是一个微型旅游网站，潜在游客可以选择想要访问的国家以及在所选国家访问的数量。\n\
    \n有三个国家：`America`、`India` 和 `South Africa`。每个国家在每个地方都有独特的 `Stops`数量。因此，当选择南非洲时，你有\
    \ 10、20 和 30 个站点的可选；而如果你选择印度，你将有 5、15 和 25 个站点。\n\n# 条件运算符 ‘？’\n\n在第 4 章：JavaScript\
    \ 运算符中，我介绍过三元运算符。三元运算符也称为条件运算符。该运算符之所以被称为三元，是因为它接受三个操作数才能运行。\n\n三元运算符接受的三个操作数是：\n\
    \n* 条件\n* 真表达式\n* 假表达式\n\n以下是其外观的一个小示例：\n\n`Condition ? Value if true : Value\
    \ if false`\n\n条件是进行测试的内容。当条件为真时，执行问号后面的代码；如果条件为假，则执行冒号后面的代码。\n\n让我们来看嵌套 `if`\
    \ 语句的运行：\n\n1. 打开你任用的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n\
    <body>\n<h1>条件语句示例</h1>\n<p>条件语句示例</p>\n<script>\nvar studentAge = 19;\nvar greeting\
    \ = (studentAge < 18) ? “Not Allowed” : “Welcome!”;\ndocument.write(greeting);\n\
    </script>\n</body>\n</html>\n```\n\n2. 将文件以 HTML 扩展名保存，例如 `Chapter 13.8.html`。\n\
    \n3. 双击该文件在默认浏览器中打开它。\n\n变量 `studentAge` 的值被经过了测试，因此成为了条件。如果 `studentAge` 小于 `18`，则页面上将打印\
    \ `Not Allowed`；否则（正如当前情况，因为 `studentAge` 为 `19`），网页上将打印 `Welcome!`。\n\n# 总结\n\
    \n在本章中，我们进行了大量的实操练习，演示了各种控制流语句的使用。你学习了脚本的大部分内容仅取决于需要测试的逻辑和条件。你看到了 `switch` 语句、`if`\
    \ 语句与条件运算符之间的区别。\n\n在下一章中，我们将学习 JavaScript 中的各种循环。\n\n# 问题\n\n1. 为什么你会使用 `switch`\
    \ 语句而不是 `else…if` 语句？\n2. 什么是三元运算符？\n3. 为什么你会使用 `else` 子句？\n4. 解释“条件”这一术语。\n\n\
    # 第 14 章\n\n# 循环\n\n# 简介\n\n在任何编程环境或语言中，你都无法避免循环。JavaScript 拥有多种类型的循环，包括计数循环和条件循环。JavaScript\
    \ 还包含了提前退出循环或跳过迭代的功能。\n\n在本节中，你将学习 JavaScript 中存在哪些循环以及它们在语法和内部工作原理上的差异。你将进行大量的实践练习，因为通过实践学习总是更容易。\n\
    \n# 结构\n\n* JavaScript 循环\n* `for`\n* `for…in`\n* `for…of`\n* `while`\n* `do…while`\n\
    * 退出循环\n    * `break` 语句\n    * 带有标签的 `break`\n* `continue` 语句\n\n# 目标\n\n* 识别\
    \ JavaScript 中不同的循环。\n* 利用 `for` 循环执行固定次数。\n* 利用 `for…in` 循环遍历对象属性。\n* 利用 `for…of`\
    \ 循环遍历数组、字符串、Maps 和 NodeLists。\n* 利用 `while` 循环根据条件进行循环。\n* 学习如何退出循环。\n\n# JavaScript\
    \ 循环\n\n循环是重复的内容。在 JavaScript 中，有几种类型的循环可以使用来多次重复一段代码块。最常见的循环是 `for`、`for…in`、`for…of`、`while`\
    \ 和 `do…while`。\n\n循环是一种只要特定条件为真就会不断重复的结构。\n\n JavaScript 提供了以下循环：\n\n* `for`\n\
    * `for…in`\n* `for…of`\n* `while`\n* `do…while`\n\n`for` 循环是最常见的循环。当你知道想要循环执行代码块的次数时，可以使用它。`for`\
    \ 循环的语法为：\n\n`for (initialization; condition; increment/decrement)`\n\n`initialization`\
    \ 是设置循环变量的地方。`condition` 是每次迭代之前测试的内容。如果条件为真，则执行循环体。`increment/decrement` 是在每次迭代后更新循环变量的内容。\n\
    \n这是一个 `for` 循环的示例：\n\n```javascript\nfor (var i = 0; i < 10; i++) {\n  document.write(i\
    \ + \"<br>\");\n}\n```\n\n在这个示例中，变量 `i` 被初始化为 `0`。每次迭代之前测试条件 `i < 10`。如果条件为真，则执行\
    \ `document.write(i)`。在每次迭代后，`i` 加 1。这会持续进行直到 `i` 不再小于 10。\n\n`while` 循环用于在你不知道想要循环执行代码块的次数，但知道应该停止循环的条件时。`while`\
    \ 循环的语法为：\n\n```javascript\nwhile (condition) {\n  // 要执行的代码\n}\n```\n\n`condition`\
    \ 在每次迭代之前测试。如果条件为真，则执行循环体。如果为假，则循环不运行。\n\n这是一个 `while` 循环的示例：\n\n```javascript\n\
    var i = 0;\nwhile (i < 10) {\n  document.write(i + \"<br>\");\n  i++;\n}\n```\n\
    \n在这个示例中，变量 `i` 被初始化为 `0`。每次迭代之前测试条件 `i < 10`。如果条件为真，则执行 `document.write(i)`。然后，`i`\
    \ 加 1。这会持续进行直到 `i` 不再小于 10。\n\n`do…while` 循环类似于 `while` 循环，但在测试条件之前，循环体至少会执行一次。`do…while`\
    \ 循环的语法为：\n\n```javascript\ndo {\n  // 要执行的代码\n} while (condition);\n```\n\n这是一个\
    \ `do…while` 循环的示例：\n\n```javascript\nvar i = 0;\ndo {\n  document.write(i + \"\
    <br>\");\n  i++;\n} while (i < 10);\n```\n\n在这个示例中，变量 `i` 被初始化为 `0`。代码体执行一次，打印\
    \ `0`。然后测试条件 `i < 10`。如果为真，循环再次运行。这会持续进行直到 `i` 不再小于 10。\n\n`for…in` 循环用于遍历对象的属性。`for…in`\
    \ 循环的语法为：\n\n```javascript\nfor (var property in object) {\n  // 要执行的代码\n}\n```\n\
    \n这是一个 `for…in` 循环的示例：\n\n```javascript\nvar person = {name: \"John\", age: 30,\
    \ city: \"New York\"};\nfor (var property in person) {\n  console.log(property\
    \ + \": \" + person[property]);\n}\n```\n\n`for…of` 循环用于遍历数组、字符串、Maps 和 NodeLists\
    \ 的值。`for…of` 循环的语法为：\n\n```javascript\nfor (var value of iterable) {\n  // 要执行的代码\n\
    }\n```\n\n这是一个 `for…of` 循环的示例：\n\n```javascript\nvar fruits = [\"apple\", \"banana\"\
    , \"cherry\"];\nfor (var fruit of fruits) {\n  console.log(fruit);\n}\n```\n\n\
    有时你想提前退出循环或跳过迭代。对于这种情况，可以使用 `break` 和 `continue` 语句。\n\n`break` 语句用于跳出循环。\n\n\
    ```javascript\nfor (var i = 0; i < 10; i++) {\n  if (i === 5) {\n    break;\n\
    \  }\n  document.write(i + \"<br>\");\n}\n```\n\n`continue` 语句用于跳过当前迭代并移动到下一个。\n\
    \n```javascript\nfor (var i = 0; i < 10; i++) {\n  if (i === 5) {\n    continue;\n\
    \  }\n  document.write(i + \"<br>\");\n}\n```\n\n你也可以配合标签使用 `break` 和 `continue`\
    \ 来跳出嵌套循环。\n\n```javascript\nouterLoop:\nfor (var i = 0; i < 10; i++) {\n  for\
    \ (var j = 0; j < 10; j++) {\n    if (i === 2 && j === 2) {\n      break outerLoop;\n\
    \    }\n    document.write(i + \", \" + j + \"<br>\");\n  }\n}\n```\n\n"
- fmt: "\n3. Double-click the file to open it in the default browser.\n\nThe `for`\
    \ loops starts at `9`. Then you test to make sure that `i` is greater than minus\
    \ `1`, lastly the loop decrements with the decrement operator. Operators were\
    \ discussed in `[Chapter 4: JavaScript Operators](#c04.xhtml)`. The end result\
    \ looks like the next screenshot:\n\n![](images/Img_14_02.jpg)\n\n**Figure 14.2:**\
    \ Backward for loop\n\nThe `for` loops are also quite commonly used in conjunction\
    \ with arrays. Arrays will be discussed in `[Chapter 16: Arrays](#c16.xhtml)*,\
    \ so more on that a bit later. The `for` loop has a few variants, let’s examine\
    \ them.\n\n## for…in\n\nThe `for…in`statement loops through the properties of\
    \ an object. Its syntax is as follows:\n\n```\nfor (variable in object)\n{\n \
    \ Statement(s)\n}\n```\n\nAs you can see, this `for` loop looks quite different\
    \ than the one we discussed earlier. A variable in this context is a temporary\
    \ place holder for the current property. The object in this context is the object\
    \ which gets looped over. Let’s do a small exercise.\n\nHere is a more practical\
    \ example. The next sample shows a `for…in`loop in action.\n\n1. Open a text editor\
    \ of your choice and enter the following HTML and JavaScript code:\n\n```html\n\
    <!doctype html>\n<body>\n  <h1>for…in loop example</h1>\n  <p>for…in loop example</p>\n\
    \  <script>\n    var student = {studentName: “Ockert”, studentSubject: “JavaScript”,\
    \ studentAge: 41};\n    var output = “”;\n    var stu;\n    for (stu in student)\n\
    \    {\n      output += student[stu] + “</br>”;\n      document.write(“<b>” +\
    \ ‘${stu}’ + “</b> = “ + ‘${student[stu]}’ + “</br>”);\n    }\n    document.write(“<p>”\
    \ + output);\n  </script>\n</body>\n</html>\n```\n\n2. Save the file with an HTML\
    \ extension, for example `Chapter 14.3.html`.\n\n3. Double-click the file to open\
    \ it in the default browser.\n\nThis exercise has two examples in one. Let’s break\
    \ it down;an object named `student` is created. Its properties include `studentName`,\
    \ `studentSubject`, and `studentAge`. We created two variables named `output`\
    \ and `stu`. Then, the `for…in`loop begins. The `stu` variable acts as a placeholder\
    \ for the properties inside the `student` object. This loop will loop three times\
    \ because the student object has three properties. The output variable gets the\
    \ current property value added to it. The `+=` operator means to add the new value\
    \ to the existing value, as explained in `[Chapter 4: JavaScript Operators](#c04.xhtml)*`.\
    \ The next line writes in bold the property name, and its setting with the use\
    \ of backticks, as explained in `[Chapter 12: Variables](#c12.xhtml)*`. Finally,\
    \ the value of the output variable gets written to the page as well.\n\nThe final\
    \ output looks like `[Figure 14.3](#c14.xhtml_fig14_3)*:\n\n![](images/Img_14_03.jpg)\n\
    \n**Figure 14.3:** for…in loop\n\nThe next and last `for`the statement I’d like\
    \ to talk about is the `for…o`f statement.\n\n## for…of\n\nThe `for…of` loops\
    \ over iterable data structures such as Arrays, Strings, NodeLists and Maps. Its\
    \ syntax is as follows:\n\n```\nfor (variable of iterable)\n{\n  Statement(s)\n\
    }\n```\n\nIt looks similar to the `for…in`loop, except for the fact that it loops\
    \ through something else. It loops through an iterable. In `[Chapter 10: JavaScript\
    \ Generators and Iterators](#c10.xhtml)*` you have learned that an iterable is\
    \ a thing which can be repeated, so in this case, the variable loops through each\
    \ part of the iterable until it is done. To give a better explanation, let’s do\
    \ an exercise!\n\nThe next sample shows a `for…of`loop in action.\n\n1. Open a\
    \ text editor of your choice and enter the following HTML and JavaScript code:\n\
    \n```html\n<!doctype html>\n<body>\n  <h1>for…of loop example</h1>\n  <p>for…of\
    \ loop example</p>\n  <script>\n    var subject = ‘JavaScript’;\n    var s;\n\
    \    for (s of subject)\n    {\n      document.write(s + “<br >”);\n    }\n  </script>\n\
    </body>\n</html>\n```\n\n2. Save the file with an HTML extension, for example\
    \ `Chapter 14.4.html`.\n\n3. Double-click the file to open it in the default browser.\n\
    \nFirst, a variable named `subject` is created and gets assigned a value of `JavaScript`.\
    \ Another variable named `s` is created. The `for…of`loop starts. The variable\
    \ `s` is equal to a character in the string `JavaScript` which is stored inside\
    \ the `subject` variable. It gets written to the page, as shown in `[Figure 14.4](#c14.xhtml_fig14_4)*:\n\
    \n![](images/Img_14_04.jpg)\n\n**Figure 14.4:** for…of loop in action\n\nLet’s\
    \ do another example. This example will loop through an array which will be covered\
    \ in greater detail in `[Chapter 16: Arrays](#c16.xhtml)*`.\n\nThe next sample\
    \ shows a `for…of`loop looping through an array.\n\n1. Open a text editor of your\
    \ choice and enter the following HTML and JavaScript code:\n\n```html\n<!doctype\
    \ html>\n<body>\n  <h1>for…of loop example</h1>\n  <p>for…of loop example</p>\n\
    \  <script>\n    var arraySubjects = [‘JavaScript’, ‘HTML’, ‘CSS’, ‘PHP’, ‘jQuery’];\n\
    \    var sub;\n    for (sub of arraySubjects) {\n      document.write(sub + “<br\
    \ >”);\n    }\n  </script>\n</body>\n</html>\n```\n\n2. Save the file with an\
    \ HTML extension, for example `Chapter 14.5.html`.\n\n3. Double-click the file\
    \ to open it in the default browser.\n\nThe `arraySubjects` is what is known as\
    \ an array. An array stored more than one value, so in a sense, anarray is a group\
    \ of variables with the same name. The array gets supplied with five strings,\
    \ and all five strings are now stored in one place, the array.\n\nA variable `sub`\
    \ gets created. As with the `for…in`example, and the previous `for…of`example,\
    \ this variable will be used to obtain the current value in the array (or group\
    \ of values). Then, we simply write the value on the page, as shown in `[Figure\
    \ 14.5](#c14.xhtml_fig14_5)*:\n\n![](images/Img_14_05.jpg)\n\n**Figure 14.5:**\
    \ for…of loop looping through the array\n\nLet’s move on to conditional loops.\n\
    \n## while\n\nThe `while` loop executes a block of code as long as the given condition\
    \ is true. Its syntax is as follows:\n\n```\nwhile (condition)\n{\n  Statement(s)\n\
    }\n```\n\nThis is simple. The condition can be testing if a value is false, or\
    \ if a numeric value is less than 100, for example. While the condition exists,\
    \ the statements would repeat. This called a conditional because unlike a `for`\
    \ loop where you specify the start and end parameters, with a `while` loop, you\
    \ may not know how many times it will execute.\n\nLet’s do a proper example.\n\
    \nThe next sample demonstrates the power of a conditional loop:\n\n1. Open a text\
    \ editor of your choice and enter the following HTML and JavaScript code:\n\n\
    ```html\n<!doctype html>\n<body>\n  <h1>while loop example</h1>\n  <p>while loop\
    \ example</p>\n  <script>\n    let total = 0;\n    while (total < 100) {\n   \
    \   let newVal = + prompt(“Enter a number”, ‘’);\n      total += newVal;\n   \
    \ }\n    alert( ‘Total: ‘ + total );\n  </script>\n</body>\n</html>\n```\n\n2.\
    \ Save the file with an HTML extension, for example `Chapter 14.6.html`.\n\n3.\
    \ Double-click the file to open it in the default browser.\n\nIn the above exercise,\
    \ you create a variable named `total` and give it a value of `0`. The `while`\
    \ loop checks to see if the `total` variable is less than `100`. This means that\
    \ if the `total` variable becomes `100` or more, the loop should exit.\n\nInside\
    \ the loop, another variable named `newVal` accepts the value of whatever was\
    \ entered in the prompt box, and then this gets added to the `total` variable.\n\
    \nVery important here is that the variable `total` is the one whose value gets\
    \ tested, if the value doesn’t change somewhere in the loop, the loop will be\
    \ infinite and will never end because total will never become `100` or more for\
    \ example.\n"
  raw: "3.  Double-click the file to open it in the default browser.\n\nThe `for`\
    \ loops starts at `9`. Then you test to make sure that `i` is greater than minus\
    \ `1`, lastly the loop decrements with the decrement operator. Operators were\
    \ discussed in *[Chapter 4: JavaScript Operators](#c04.xhtml)*. The end result\
    \ looks like the next screenshot:\n\n![](images/Img_14_02.jpg)\n\n**Figure 14.2:**\
    \ Backward for loop\n\nThe `for` loops are also quite commonly used in conjunction\
    \ with arrays. Arrays will be discussed in *[Chapter 16: Arrays](#c16.xhtml)*,\
    \ so more on that a bit later. The `for` loop has a few variants, let’s examine\
    \ them.\n\n# [for…in](#toc.xhtml_s223a)\n\nThe `for…in`statement loops through\
    \ the properties of an object. Its syntax is as follows:\n\n`for (variable in\
    \ object)`\n\n`{`\n\n`Statement(s)`\n\n`}`\n\nAs you can see, this `for` loop\
    \ looks quite different than the one we discussed earlier. A variable in this\
    \ context is a temporary place holder for the current property. The object in\
    \ this context is the object which gets looped over. Let’s do a small exercise\n\
    \nHere is a more practical example. The next sample shows a `for…in`loop in action.\n\
    \n1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<!doctype html>`\n\n    `<body>`\n\n    `<h1>for…in loop example</h1>`\n\
    \n    `<p>for…in loop example</p>`\n\n    `<script>`\n\n    `var student = {studentName:\
    \ “Ockert”, studentSubject: “JavaScript”, studentAge: 41};`\n\n    `var output\
    \ = “”;`\n\n    `var stu;`\n\n    `for (stu in student)`\n\n    `{`\n\n    `output\
    \ += student[stu] + “</br>”;`\n\n    `document.write(“<b>” + ‘${stu}’ + “</b>\
    \ = “ + ‘${student[stu]}’ + “</br>”);`\n\n    `}`\n\n    `document.write(“<p>”\
    \ + output);`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save\
    \ the file with an HTML extension, for example `Chapter 14.3.html`.\n\n3.  Double-click\
    \ the file to open it in the default browser.\n\nThis exercise has two examples\
    \ in one. Let’s break it down;an object named `student` is created. Its properties\
    \ include `studentName`, `studentSubject`, and `studentAge`. We created two variables\
    \ named `output` and `stu`. Then, the `for…in`loop begins. The `stu` variable\
    \ acts as a placeholder for the properties inside the `student` object. This loop\
    \ will loop three times because the student object has three properties. The output\
    \ variable gets the current property value added to it. The `+=` operator means\
    \ to add the new value to the existing value, as explained in *[Chapter 4: JavaScript\
    \ Operators](#c04.xhtml)*. The next line writes in bold the property name, and\
    \ its setting with the use of backticks, as explained in *[Chapter 12: Variables](#c12.xhtml)*.\
    \ Finally, the value of the output variable gets written to the page as well\n\
    \nThe final output looks like *[Figure 14.3](#c14.xhtml_fig14_3)*:\n\n![](images/Img_14_03.jpg)\n\
    \n**Figure 14.3:** for…in loop\n\nThe next and last `for`the statement I’d like\
    \ to talk about is the `for…o`f statement.\n\n# [for…of](#toc.xhtml_s224a)\n\n\
    The `for…of` loops over iterable data structures such as Arrays, Strings, NodeLists\
    \ and Maps. Its syntax is as follows:\n\n`for (variable of iterable)`\n\n`{`\n\
    \n`Statement(s)`\n\n`}`\n\nIt looks similar to the `for…in`loop, except for the\
    \ fact that it loops through something else. It loops through an iterable. In\
    \ *[Chapter 10: JavaScript Generators and Iterators](#c10.xhtml)* you have learned\
    \ that an iterable is a thing which can be repeated, so in this case, the variable\
    \ loops through each part of the iterable until it is done. To give a better explanation,\
    \ let’s do an exercise!\n\nThe next sample shows a `for…of`loop in action.\n\n\
    1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<!doctype html>`\n\n    `<body>`\n\n    `<h1>for…of loop example</h1>`\n\
    \n    `<p>for…of loop example</p>`\n\n    `<script>`\n\n    `var subject = ‘JavaScript’;`\n\
    \n    `var s;`\n\n    `for (s of subject)`\n\n    `{`\n\n    `document.write(s\
    \ + “<br >”);`\n\n    `}`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\
    \n2.  Save the file with an HTML extension, for example `Chapter 14.4.html`.\n\
    \n3.  Double-click the file to open it in the default browser.\n\nFirst, a variable\
    \ named `subject` is created and gets assigned a value of `JavaScript`. Another\
    \ variable named `s` is created. The `for…of`loop starts. The variable `s` is\
    \ equal to a character in the string `JavaScript` which is stored inside the `subject`\
    \ variable. It gets written to the page, as shown in *[Figure 14.4](#c14.xhtml_fig14_4)*:\n\
    \n![](images/Img_14_04.jpg)\n\n**Figure 14.4:** for…of loop in action\n\nLet’s\
    \ do another example. This example will loop through an array which will be covered\
    \ in greater detail in [Chapter 16: Arrays](#c16.xhtml).\n\nThe next sample shows\
    \ a `for…of`loop looping through an array.\n\n1.  Open a text editor of your choice\
    \ and enter the following HTML and JavaScript code:\n\n    `<!doctype html>`\n\
    \n    `<body>`\n\n    `<h1>for…of loop example</h1>`\n\n    `<p>for…of loop example</p>`\n\
    \n    `<script>`\n\n    `var arraySubjects = [‘JavaScript’, ‘HTML’, ‘CSS’, ‘PHP’,\
    \ ‘jQuery’];`\n\n    `var sub;`\n\n    `for (sub of arraySubjects) {`\n\n    `document.write(sub\
    \ + “<br >”);`\n\n    `}`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\
    \n2.  Save the file with an HTML extension, for example `Chapter 14.5.html`.\n\
    \n3.  Double-click the file to open it in the default browser.\n\nThe `arraySubjects`\
    \ is what is known as an array. An array stored more than one value, so in a sense,\
    \ anarray is a group of variables with the same name. The array gets supplied\
    \ with five strings, and all five strings are now stored in one place, the array.\n\
    \nA variable sub gets created. As with the `for…in`example, and the previous `for…of`example,\
    \ this variable will be used to obtain the current value in the array (or group\
    \ of values). Then, we simply write the value on the page, as shown in *[Figure\
    \ 14.5](#c14.xhtml_fig14_5)*:\n\n![](images/Img_14_05.jpg)\n\n**Figure 14.5:**\
    \ for…of loop looping through the array\n\nLet’s move on to conditional loops.\n\
    \n# [while](#toc.xhtml_s225a)\n\nThe `while` loop executes a block of code as\
    \ long as the given condition is true. Its syntax is as follows:\n\n`while (condition)`\n\
    \n`{`\n\n`Statements(s)`\n\n`}`\n\nThis is simple. The condition can be testing\
    \ if a value is false, or if a numeric value is less than 100, for example. While\
    \ the condition exists, the statements would repeat. This called a conditional\
    \ loop because unlike a `for` loop where you specify the start and end parameters,\
    \ with a `while` loop, you may not know how many times it will execute.\n\nLet’s\
    \ do a proper example.\n\nThe next sample demonstrates the power of a conditional\
    \ loop:\n\n1.  Open a text editor of your choice and enter the following HTML\
    \ and JavaScript code:\n\n    `<!doctype html>`\n\n    `<body>`\n\n    `<h1>while\
    \ loop example</h1>`\n\n    `<p>while loop example</p>`\n\n    `<script>`\n\n\
    \    `let total = 0;`\n\n    `while (total < 100) {`\n\n    `let newVal = + prompt(“Enter\
    \ a number”, ‘’);`\n\n    `total += newVal;`\n\n    `}`\n\n    `alert( ‘Total:\
    \ ‘ + total );`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save\
    \ the file with an HTML extension, for example `Chapter 14.6.html`.\n\n3.  Double-click\
    \ the file to open it in the default browser.\n\nIn the above exercise, you create\
    \ a variable named `total` and give it a value of `0`. The `while` loop checks\
    \ to see if the `total` variable is less than `100`. This means that if the `total`\
    \ variable becomes `100` or more, the loop should exit.\n\nInside the loop, another\
    \ variable named `newVal` accepts the value of whatever was entered in the prompt\
    \ box, and then this gets added to the `total` variable.\n\nVery important here\
    \ is that the variable `total` is the one whose value gets tested, if the value\
    \ doesn’t change somewhere in the loop, the loop will be infinite and will never\
    \ end because total will never become `100` or more for example."
