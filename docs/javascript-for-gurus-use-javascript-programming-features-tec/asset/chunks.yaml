    \ you have the following function in Coffeescript:\n\n`add =(a,b) ->`\n\n`c=a+b`\n\
    \n`console.log “Answer is: “+c`\n\nIt’s equivalent in JavaScript is:\n\n`(function()\
    \ {`\n\n`var add;`\n\n`add = function(a, b) {`\n\n`var c;`\n\n`c = a + b;`\n\n\
    `return console.log(“Answer is: “ + c);`\n\n`};`\n\n`}).call(this);`\n\nAlthough\
    \ CoffeeScript makes use of less code, it can be a bit more difficult to follow.\
    \ Both functions essentially do the same which is to add two numbers and provide\
