    \ use JavaScript with other variants and languages influenced by it. jQuery, AJAX,\
    \ and JSON are topics that could fill books on their own. You have also seen what\
    \ other languages look like and how they compare to JavaScript.\n\n# [Questions](#toc.xhtml_s302a)\n\
    \n1.  What is jQuery?\n\n2.  What is JSON?\n\n3.  What is AJAX?\n\n4.  Name two\
