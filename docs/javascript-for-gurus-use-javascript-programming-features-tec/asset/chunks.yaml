  trans: "\n\n`number` JavaScript 原始数据类型是双精度 64 位二进制格式的 IEEE 754 值。整数没有特定的类型。`number`\
    \ 除了能够表示浮点数外，这种`primitive` 类型还具有三个特殊的符号值，即：`+Infinity`、`-Infinity` 和 `NaN`（不是数字）。为了检查\
    \ `+Infinity` 或 `-Infinity` 的最大值或最小值，请使用 `Number.MAX_VALUE` 或 `Number.MIN_VALUE`\
    \ 常量。你也可以通过使用 `Number.isSafeInteger()` 或 `Number.MAX_SAFE_INTEGER` 和 `Number.MIN_SAFE_INTEGER`\
    \ 来检查数字是否在双精度浮点数范围内。\n\n# bigint\n\n`bigint` JavaScript 原始数据类型用于存储和操作大整数。这些大整数可以超过数字类型的安全整数限制。你通过在整数末尾附加\
    \ `n` 来创建一个 `bigint`。\n\n# boolean\n\n`boolean` JavaScript 原始数据类型可以有两个值之一：`true`\
    \ 或 `false`。\n\n# null\n\n`null` JavaScript 原始数据类型意味着没有值。\n\n# undefined\n\n当变量的值为\
    \ `undefined` 时，意味着它还没有被赋值。\n\n# symbol\n\n`symbol` JavaScript 原始数据类型是唯一且不可变的，主要被用作对象属性的键。\n\
    \n# 对象数据类型\n\n对象也是变量，但与原始类型不同，对象内部可以存储多个值。对象存储的是键值数据集合和复杂实体。对象内部的信息以键值对的形式存储。键通常是属性名，值是属性的值，例如：\n\
    \n```javascript\nvar objStudent = {\nName:”Ockert”,\nCourse:”JavaScript”,\nYear:\
    \ 2019\n};\n```\n\n在上面的代码段中，创建了一个名为 `objStudent` 的新 JavaScript 对象。`objStudent`\
    \ 包含三个属性，即：`Name`、`Course` 和 `Year`。\n\n# 创建对象\n\n现在我们对对象有了更多了解，让我们来看看如何创建它们。可以使用以下任何方式创建对象：\n\
    \n-   对象字面量语法\n-   `new` 关键字\n-   `Object.create()`\n-   `Object.assign()`\n-\
    \   ES6 类\n\n让我逐一解释它们。\n\n# 对象字面量语法\n\n这种方法非常易理解且执行快速。这是一个示例：\n\n```javascript\n\
    var objCar = {\nmake: “BMW”,\nmodel: “i8 Roadster”,\nprice: 2329300\n};\n```\n\
    \n这个示例看起来可能非常熟悉。如果你仔细观察“对象数据类型”部分中之前的代码段，你会发现这两个代码示例具有相同的相似之处。`var` 关键字创建了对象。大括号包含用冒号分隔的属性和值，每个属性之间用逗号分隔。\n\
    \n现在创建的对象名为 `objCar`。它包含了 `make`、`model` 和 `price` 属性。要使用 `objCar` 对象，你可以编写如下语句：\n\
    \n```javascript\nconsole.log(objCar); // 输出 {make: “BMW”, model: “i8 Roadster”,\
    \ price: 2329300}\nconsole.log(objCar.make); // 输出 BMW\nconsole.log(objCar.model);\
    \ // 输出 i8 Roadster\nconsole.log(objCar.price); // 输出 2329300\n```\n\n让我们把这些内容整合在一个小练习中：\n\
    \n1.  打开你任的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<h1>Object literal syntax</h1>\n<p>以下代码创建了一个 JavaScript 对象并在浏览器的控制台窗口中显示其结果</p>\n\
    <script>\nvar objCar = {\nmake : “BMW”,\nmodel : “i8 Roadster”,\nprice : 2329300\n\
    };\nconsole.log(objCar); // 输出 {make: “BMW”, model: “i8 Roadster”, price: 2329300}\n\
    console.log(objCar.make); // 输出 BMW\nconsole.log(objCar.model); // 输出 i8 Roadster\n\
    console.log(objCar.price); // 输出 2329300\n</script>\n</body>\n</html>\n```\n\n\
    2.  以 HTML 扩展名保存文件，例如 `Chapter21.html`。\n\n3.  双击文件在默认浏览器中打开它。如果浏览器是 Google Chrome，按下\
    \ `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\n# ‘new’ 关键字\n\n使用 `new` 关键字创建对象的方法类似于在基于类的语言（如\
    \ C# 或 Java）中创建对象的方法。使用 `new` 关键字创建对象有两种方式：\n\n-   使用 `new` 配合内置对象函数\n-   使用 `new`\
    \ 配合自定义构造函数\n\n让我们探索一下区别。\n\n# 使用 ‘new’ 配合内置对象函数\n\n在基于类的面向对象编程 (`OOP`) 中，构造函数是一种特殊的子程序，用于创建对象。构造函数通过初始化对象的成员为新对象做好准备。要创建一个新对象，必须使用\
    \ `new` 关键字配合 `Object()` 构造函数，如下所示：\n\n```javascript\nvar house = new Object();\n\
    ```\n\n这创建并初始化了一个名为 `house` 的新对象。我们可以使用下面的代码为此对象添加属性：\n\n```javascript\nhouse.bedrooms\
    \ = 4;\nhouse.bathrooms = 2;\nhouse.garages = 2;\nhouse.hasSwimmingPool = false;\n\
    house.hasOutsideWalls = true;\n```\n\n你可以看到，为使用 `Object()` 构造函数创建的对象属性可能会变成一项繁琐的任务，并且涉及大量的输入工作。我们上面创建的\
    \ `house` 对象具有 `bedrooms` 属性、`bathrooms`、`garages`，以及表示是否存在游泳池或外墙的布尔值属性。\n\n如果我们必须创建数百个\
    \ `house` 对象怎么办？让我们看看如何通过使用自定义构造函数让这段代码更短一些。\n\n# 使用 ‘new’ 配合自定义构造函数\n\n在创建自定义构造函数时，你基本上是为对象的属性和方法创建了一个模板。你只需要创建一次函数，然后向它传递必要的属性，而不是像之前在“使用\
    \ `new` 配合内置对象构造函数”部分所示那样手动输入每个属性和每个设置。\n\n让我们再次以 `house` 对象为例创建自定义构造函数：\n\n```javascript\n\
    function House(_bed, _bath, _garage, _pool, _walls) {\n    this.bedRooms = _bed;\n\
    \    this.bathRooms = _bath;\n    this.garages = _garage;\n    this.hasSwimmingPool\
    \ = _pool;\n    this.hasOutsideWalls = _walls;\n}\n```\n\n构造函数的名称是 `House`。括号内有五个参数：`_bed`、`_bath`、`_garage`、`_pool`\
    \ 和 `_walls`。这些参数将用于向 `House` 函数传递信息。在构造函数内部，每个属性都被赋值为它自己的参数。记住，这仅仅是一个模板，目前还没有值。\n\
    \n现在我们有了构造函数，根据它来创建对象就很简单了。方法如下：\n\n```javascript\nvar houseOne = new House(4,\
    \ 2, 2, false, true);\nvar houseTwo = new House(3, 1, 1, true, false);\n```\n\n\
    上面的 `houseOne` 对象是一个新的 `House` 对象。它有 4 卧室、2 间浴室、2 个车库、没有游泳池且有外墙。相比之下，`houseTwo`\
    \ 有 3 卧室、1 间浴室、1 个车库、一个游泳池且没有外墙。\n\n"
- fmt: "\n```javascript\nthis.garages = _garage;\nthis.hasSwimmingPool = _pool;\n\
    this.hasOutsideWalls = _walls;\n}\nvar houseOne = new House(4, 2, 2, false, true);\n\
    var houseTwo = new House(3, 1, 1, true, false);\nconsole.log(houseOne);\nconsole.log(houseTwo);\n\
    ```\n```html\n</script>\n</body>\n</html>\n```\n\n2. Save the file with an HTML\
    \ extension, for example, `Chapter 2.2.html`.\n\n3. Double-click the file to open\
    \ it in the default browser. If the browser is Google Chrome, press `Ctrl` + `Shift`\
    \ + `J` to open the console window.\n\nYour Chrome console window should resemble\
    \ [Figure 2.2](#c02.xhtml_fig2_2) below:\n\n![](images/Img_02_02.jpg)\n\nFigure\
    \ 2.2: House object property values\n\nLet’s move onto the `Object.Create()` method.\n\
    \n# [Object.create()](#toc.xhtml_s30a)\n\nBy using the `Object.create()` method,\
    \ you create a new object, using an existing object as the template or prototype.\
    \ Let’s look at a quick example:\n\nSuppose you have a course object represented\
    \ by `Course`:\n\n```javascript\nlet Course = {name: ‘Web Programming’}\n```\n\
    \nAnd you want to create subjects for the course. The subjects depend on the course.\
    \ So, the subject object that we will see an example of next is based on the course\
    \ object because the `Course` object acts as a template to it:\n\n```javascript\n\
    let Subject = Object.create(Course, { name:{ value: ‘JavaScript’ } });\nconsole.log(Subject.name);\
    \ //Output: JavaScript\nconsole.log(Subject.Course); //Output: Web Programming\n\
    ```\n\nInside the `Object.create()` method you pass the object you’d like to use\
    \ as a prototype, then, you supply a new property and value for the inherited\
    \ object. We will cover Inheritance of objects in detail in [Chapter 7: JavaScript\
    \ Prototypes](#c07.xhtml).\n\n# [Object.assign()](#toc.xhtml_s31a)\n\nThe `Object.assign()`\
    \ method takes `Object.create()` a level or two further. Whereas `Object.create()`\
    \ makes use of one prototype object, `Object.assign()` can inherit or obtain properties\
    \ from any number of prototype objects.\n\nSuppose you have two objects as below:\n\
    \n```javascript\nlet Course = {Coursename: ‘Web Programming’}\nlet Subject = {Subjectname:\
    \ ‘JavaScript’}\n```\n\nAnd you want a `Student` object doing a `Web Programming`\
    \ course and are currently busy with the subject named `JavaScript`. You can do\
    \ that with the help of `Object.assign` as below:\n\n```javascript\nlet Student\
    \ = Object.assign({}, Course, Subject);\n```\n\nNow, you have a Student object\
    \ that has `Coursename` and `Subjectname` as its properties:\n\n```javascript\n\
    console.log(Student.Coursename) //Output: Web Programming\nconsole.log(Student.Subjectname)\
    \ //Output: JavaScript\n```\n\nAn example complete script and a screenshot of\
    \ its results are as follows:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>Object.assign</h1>\n\
    <p>The following code creates a JavaScript object and displays its results in\
    \ the console window of the browser</p>\n<script>\nlet Course = {Coursename: ‘Web\
    \ Programming’}\nlet Subject = {Subjectname: ‘JavaScript’}\nlet Student = Object.assign({},\
    \ Course, Subject);\nconsole.log(Student.Coursename) //Output: Web Programming\n\
    console.log(Student.Subjectname) //Output: JavaScript\n</script>\n</body>\n</html>\n\
    ```\n\nYour Chrome console window should resemble [Figure 2.3](#c02.xhtml_fig2_3)\
    \ below:\n\n![](images/Img_02_03.jpg)\n\nFigure 2.3: Object.assign() output\n\n\
    Let’s move onto the ES6 classes.\n\n# [ES6 classes](#toc.xhtml_s32a)\n\nUsing\
    \ ES6 (ECMAScript 6 or JavaScript 6) classes is like using the `new` keyword with\
    \ user defined constructor functions. The constructor functions are simply replaced\
    \ by classes. Here is a short example:\n\n```javascript\nclass Car {\n  constructor(_make,\
    \ _model) {\n    this.carMake = _make;\n    this.carModel = _model;\n  }\n}\n\
    ```\n\nCreate a new `Car` object as shown below:\n\n```javascript\nmyCar = new\
    \ Car(“BMW”, “i8 Roadster”);\n```\n\n# [The ‘this’ keyword](#toc.xhtml_s33a)\n\
    \nThe `this` keyword generally refers to the object it belongs to. The `this`\
    \ keyword has different meanings depending on where it is used.\n\nThe `this`keyword\
    \ can be used in the following locations:\n\n* In a method\n* Alone\n* In a function\n\
    * In a function in strict mode\n* In an event\n\n# [Method](#toc.xhtml_s34a)\n\
    \nInside a method, `this` refers to the owner of the method. So, if a `Student`\
    \ object has a method named `Write()` and `this` was used inside the `Write()`\
    \ method, this would refer to the `Student` object:\n\n```javascript\nvar Student\
    \ = {\n  firstName: “Ockert”,\n  lastName : “du Preez”,\n  subject : “JavaScript”,\n\
    \  score : 85,\n  Write : function() {\n    return this.firstName + “ wrote “\
    \ + this.subject + “ and got “ + this.score + “%”;\n  }\n};\n```\n\nThe above\
    \ code will give the following output:\n\n**Ockert wrote JavaScript and got 85%**\n\
    \n# [Alone](#toc.xhtml_s35a)\n\nWhen `this` is used alone, the owner of it is\
    \ the global object. In a browser the global object is `[object Window]`:\n\n\
    ```javascript\nvar objWindow = this; //returns [object window]\n```\n\n# [In a\
    \ function](#toc.xhtml_s36a)\n\nWhen `this` is used in a function, the owner of\
    \ it is also the global object:\n\n```javascript\nfunction mainWindow() {\n  return\
    \ this; //returns [object window]\n}\n```\n\n# [In a function in strict mode](#toc.xhtml_s37a)\n\
    \nWhen `this` is used in a function, in strict mode, `this` is undefined:\n\n\
    ```javascript\n“use strict”;\nfunction mainWindow() {\n  return this; //returns\
    \ undefined\n}\n```\n\n# [In an event](#toc.xhtml_s38a)\n\nWhen `this` is used\
    \ in an HTML event handler, `this` refers to the HTML element that received the\
    \ event:\n\n```html\n<button onclick=”this.style.display=’none’”>\nClick Me!\n\
    </button>\n```\n\n# [Conclusion](#toc.xhtml_s39a)\n\nIn this chapter, we explored\
    \ objects inside JavaScript. We learned about the various object creation techniques\
    \ including: the `new` keyword, user-defined constructors, the object constructor,\
    \ ES6 classes, and then we learned the benefits of the `Object.create()` and `Object.assign()`\
    \ methods. Lastly, we learned the different ways to implement the `this` keyword.\n\
    \nIn the next chapter, we will learn about JavaScript statements (what they are,\
    \ how to properly construct a statement) and JavaScript keywords.\n\n# [Questions](#toc.xhtml_s40a)\n\
    \n1. What is the difference between the `Object.create()` and `Object.assign()`\
    \ methods?\n2. Explain the term primitives.\n3. What are user-defined constructor\
    \ functions?\n4. Where can the `this` keyword be used?\n5. Explain the term parameter.\n\
    \n# [CHAPTER 3](#toc.xhtml_c03)\n\n# [JavaScript Statements](#toc.xhtml_c03)\n\
    \n# [Introduction](#toc.xhtml_s41a)\n\nWithout statements there simply would not\
    \ be any program. A statement is an instruction that gets sent to an interpreter\
    \ or a compiler. How you compose your statements is vital to the overall success\
    \ of your script. Yes, it sounds a bit drastic, but if you use sloppy code without\
    \ whitespace or line breaks, it can get messy quite quickly.\n\nIn this lesson,\
    \ you will learn what JavaScript statements are and how important it is to compose\
    \ them for readability and understandability.\n\n# [Structure](#toc.xhtml_s42a)\n\
    \nThe topics covered in this chapter are:\n\n* Anatomy of a statement\n* JavaScript\
    \ code blocks\n* Whitespace and line breaks\n* JavaScript keywords\n\n# [Objectives](#toc.xhtml_s43a)\n\
    \n* Learn what a JavaScript statement is\n* Learn how to create JavaScript statements\n\
    * Learn what code blocks are\n* Learn about whitespace and line breaks\n* Get\
    \ introduced to the JavaScript keywords\n\n# [Anatomy of a statement](#toc.xhtml_s44a)\n\
    \nA statement in a programming language is an instruction line that gets executed\
    \ by a compiler or an interpreter. Lots of statements become a program. In JavaScript,\
    \ statements are usually composed of keywords and operators (forming an expression)\
    \ and values. Optionally, comments may also be included.\n\nA few examples follow:\n\
