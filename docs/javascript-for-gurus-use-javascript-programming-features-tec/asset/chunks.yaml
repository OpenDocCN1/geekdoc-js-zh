    \ a conditional loop as the `while` loop you did earlier. There is just one main\
    \ difference. Whereas with the `while` loop the condition was tested at the beginning\
    \ of the loop, with a `do…while` loop, the condition is tested at the end of the\
    \ loop. This means that the loop will always execute at least once. Its syntax\
    \ looks like the following:\n\n```\ndo\n{\n  Statement(s)\n} while (condition);\n\
    ```\n\nThe next sample demonstrates a `do…while` loop.\n\n1. Open a text editor\
