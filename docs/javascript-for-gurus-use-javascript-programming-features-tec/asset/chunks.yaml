    \n    `}`\n\n    `showInfo(){`\n\n    `alert( ‘Student: ‘ + this.studentName +\
    \ ‘ is doing: ‘ + this.studentCourse);`\n\n    `}`\n\n    `};`\n\n    `// Usage:`\n\
    \n    `var newStudent = new student(‘Ockert’, ‘JavaScript’);`\n\n    `newStudent.showInfo();`\n\
