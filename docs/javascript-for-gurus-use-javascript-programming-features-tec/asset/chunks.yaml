    \n# [JavaScript Properties](#toc.xhtml_c08)\n\n# [Introduction](#toc.xhtml_s119a)\n\
    \nProperties in JavaScript enable you to store and set various values during the\
    \ course of your application’s lifetime. By storing information in properties\
    \ provides a better structure to your applications\n\nIn this lesson you will\
    \ create properties and learn how to set each property’s attributes to be writeable\
    \ or read-only. You will learn about the differences between object properties\
    \ and accessor properties. Finally, you will learn the ins-and-outs of getters\
    \ and setters.\n\n# [Structure](#toc.xhtml_s120a)\n\n*   What are properties?\n\
    \n*   Properties of properties\n\n*   Getters and setters\n\n*   Adding tricks\
    \ to getters and setters\n\n# [Objectives](#toc.xhtml_s121a)\n\n*   Learn what\
    \ properties are\n\n*   Understand getters and setters\n\n*   Create properties\
    \ with limitations\n\n# [What are properties?](#toc.xhtml_s122a)\n\nIn *[Chapter\
    \ 6: JavaScript Classes](#c06.xhtml),* we had a quick overview of properties.\
    \ Let’s refresh our minds a bit. A property describes an object. Any object has\
    \ certain attributes that can be set and retrieved. Take, for example, a car object.\
    \ There are numerous attributes that can be set for a car; these include:\n\n\
    *   Make of car\n\n*   Model of car\n\n*   Transmission\n\n*   Fuel type\n\n*\
    \   Color\n\n*   Number of seats\n\nAlthough there are different makes and models\
    \ of cars, with different colors and transmission and fuel types, each car is\
    \ still classified as a car. Why? Because the car object still gets made from\
    \ the same car template or class.\n\nIn the code examples we have done in this\
    \ chapter thus far, we have seen how to set properties. These are known as *instance\
    \ properties*. The one important thing to note there was that you had used the\
    \ dot notation to set a property’s value and to set its value. Let’s take it a\
    \ step further.\n\nTo access JavaScript properties, use the following syntax:\n\
    \n`objectName.property     // student.studentName`\n\nOR\n\n`objectName[“property”]     //\
    \ student[“studentName”]`\n\nOR\n\n`objectName[expression];     // newStudent\
    \ = “studentName”;`\n\n`student[newStudent]`\n\nYou may be wondering how do I\
    \ add new properties to an object. Well, it is quite simple! You simply give it\
    \ a value. Here is an example:\n\n`student.studentCourse = “JavaScript”;`\n\n\
    You start with the instance of the class, then the property that needs to be set,\
    \ and after the assignment operator (the equal sign) you supply the new value\
    \ for the property.\n\n# [Properties of properties](#toc.xhtml_s123a)\n\nThe most\
    \ common attributes of a property are its value and its name. You access property\
    \ by using its name, but that supplies the value requested. This is where it gets\
    \ tricky! Some properties cannot be written to, this means that they are read-only\
    \ and cannot be changed. Some properties cannot be looped over by using a loop.\
    \ They must be enumerable. Some properties cannot be deleted.\n\nThese all depend\
    \ on the attributes (or flags) of a certain property. Primarily there are three\
    \ attributes (or flags) that can be set. They are:\n\n*   **writable**: Determines\
    \ if the value of the property can be changed.\n\n*   **enumerable**: Can the\
    \ property be listed in loops?\n\n*   **configurable**: Allows property deletion,\
    \ or property attributes to be modified.\n\nIn order to access the attributes\
    \ for any property, you can use the `Object.getOwnPropertyDescriptor` method.\
    \ You supply the object which you’d like to interrogate, then the property of\
    \ the object. Here is a small exercise.\n\nThe following sample shows `Object.getOwnPropertyDescriptor`\
    \ in action:\n\n1.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>Object.getOwnPropertyDescriptor\
    \ example</h1>`\n\n    `<p>Object.getOwnPropertyDescriptor example</p>`\n\n  \
    \  `<script>`\n\n    `let student = class Student {`\n\n    `constructor(studentName,\
    \ studentCourse) {`\n\n    `this.studentName = studentName;`\n\n    `this.studentCourse\
    \ = studentCourse;`\n\n    `}`\n\n    `showInfo()`\n\n    `{`\n\n    `let descriptor\
    \ = Object.getOwnPropertyDescriptor(newStudent, ‘studentName’);`\n\n    `alert(JSON.stringify(descriptor,\
    \ null, 2));`\n\n    `}`\n\n    `};`\n\n    `// Usage:`\n\n    `var newStudent\
    \ = new student(‘Ockert’, ‘JavaScript’);`\n\n    `newStudent.showInfo();`\n\n\
    \    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n2.  Save the file with an\
    \ HTML extension, for example `Chapter 8.1.html`.\n\n3.  Double-click the file\
    \ to open it in the default browser.\n\nIn the above code segment, you created\
    \ an object. Then in the `showInfo` method, you made use of the `getOwnPropertyDescriptor`\
    \ method to investigate the attributes of the `studentName` property of the `newStudent`\
    \ object.\n\n*[Figure 8.1](#c08.xhtml_fig8_1)* shows the attributes of the `studentName`\
    \ property:\n\n![](images/Img_08_01.jpg)"
