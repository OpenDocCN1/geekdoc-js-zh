    JavaScript 是**万维网**（**WWW**）的核心技术之一。JavaScript 是一种高级、解释型编程语言，这意味着它的大多数指令可以直接执行，而无需编译。JavaScript
    最吸引人的特性是它能够让网页具有交互性。JavaScript 语言支持动态类型、函数、基于原型的面向对象以及大量的 API，允许你处理数组、文本、正则表达式、日期和**文档对象模型**（**DOM**）。


    JavaScript 最初仅在网络浏览器的客户端实现，但现在，JavaScript 引擎已嵌入到许多其他类型的宿主软件中，包括：


    *   Web 服务器和数据库中的服务端

    *   非网页程序

    *   允许使用 编写移动和桌面应用程序的运行时环境


    通过嵌入其他类型的宿主，这些软件使得 JavaScript 更加多功能、强大，并且对跨平台的变化更有适应性。


    # JavaScript 历史


    为了更深入地了解 JavaScript 的历史，让我们快速看看“浏览器战争”这个术语。


    # 浏览器战争


    顾如其名，浏览器战争是浏览器之间的竞争，主要是关于市场份额的竞争。在 20 世纪 90 年代后期，第一次浏览器战争发生在微软 Internet Explorer
    和 Netscape Navigator 之间。


    第一次浏览器战争从 1995 年开始，持续到 2001 年。Netscape Navigator 曾是最广泛使用的网络浏览器，因为微软在 1995 年 8
    月仅作为 Windows 95 Plus! 包的一部分发布了 Internet Explorer 1.0。


    三个月后，微软免费下载发布了 Internet Explorer 2.0。Internet Explorer 4 改变了一切。Internet Explorer
    4 被集成到 Microsoft Windows 中，这导致了 Netscape Navigator 的衰落，因为用户觉得在已经有 Internet Explorer
    浏览器的情况下，没有必要下载另一个浏览器。


    第一次浏览器战争结束时，Internet Explorer 在其市场份额上已没有其他严肃的竞争对手，从而结束了 Web 浏览器的快速创新。


    随着 Internet Explorer 使用份额的下降以及 Firefox、Google Chrome、Safari、Opera 等浏览器的流行，浏览器战争在
    21 世纪 10 年代初加剧。


    # JavaScript 的诞生


    Netscape Communications 的创始人 Marc Andreessen 设想了一种更具动态的 Web 体验。他不想只显示无法兼顾用户活动的静态网页，他想要更多。问题在于，想要一种包含自动化、动画和基础用户交互的更动态
    Web 体验，需要一种轻量级的脚本语言，这种语言要让非程序员也能使用，并且能够与 `DOM` 直接交互。


    Mocha 出生了。Mocha 将成为一种简单且动态的 Web 脚本语言。JavaScript 之父 Brendan Eich 出现了。Netscape Communications
    聘请 Eich 为他们的浏览器开发 Scheme（一种轻量级 Lisp 方言）。Scheme 是强大、动态且函数式的。几个月后，Mocha 的原型在 1995
    年 5 月集成到 Netscape Communicator 中。不久后，它被更名为 LiveScript。1995 年 12 月，Mocha/LiveScript
    被更名为 JavaScript，并作为一种用于客户端浏览器任务的脚本语言推出。


    # 为什么选择 JavaScript?


    很难想象一个没有 JavaScript 的 Web。


    # JavaScript 特性


    JavaScript 是世界上最流行的语言之一。它被用于创建交互式网站、移动应用，甚至是服务端应用程序。JavaScript 是一种多功能且灵活的语言，可以用于各种任务。


    JavaScript 的一些特性包括：


    *   动态类型

    *   函数

    *   基于原型的面向对象

    *   APIs

    *   异步编程


    JavaScript 是一门强大的语言，为开发者提供了许多机会。如果你对 Web 开发感兴趣，学习 JavaScript 是必修之路。


    # JavaScript 特性总结


    在本章中，我们探索了 JavaScript 的历史及其特性。我们还学习了为什么 JavaScript 是一门强大且多功能的语言。在下一章中，我们将学习更多关于
    JavaScript 对象以及如何使用它们。


    # 问题


    1. 谁创建了 JavaScript？

    2. 解释浏览器战争。

    3. 写出 JavaScript 的四个特性。

    4. 解释 `DOM` 术语。

    5. JavaScript 相比 HTML 有什么优势？


    # 第 2 章


    # JavaScript 对象


    # 引言


    在任何编程语言中，对象都是任何应用程序的基石。在对象内部存储信息并检索其值对于速度至关重要。


    在对象内部存储信息并利用它们有许多方法。我们将学习 JavaScript 对象是什么，然后快速查看原始类型（primitives）。我们将通过五种方式创建对象。最后，我们将探索
    `this` 关键字以及它的含义在不同用法下的何不同。


    # 结构


    *   JavaScript 对象

    *   创建对象

    *   `this` 关键字


    # 目标


    *   理解 JavaScript 对象以及如何创建它们

    *   学习什么是原始类型

    *   学习如何创建对象

    *   理解并使用 `new` 关键字

    *   理解并使用 `this` 关键字


    # JavaScript 对象


    对象是具有属性和方法的东西。属性描述对象。方法是该对象可以执行的操作。基本上，在 JavaScript 中，万物皆可对象。除了原始类型外，所有的 JavaScript
    值都是对象。在详细介绍内置对象之前，让我们先探索原始类型。


    # 原始值和原始数据类型


    原始值是不具有属性或方法的值。原始数据类型就是具有原始值的数据。JavaScript 有 7 种原始数据类型。它们是：


    *   string

    *   number

    *   bigint

    *   boolean

    *   null

    *   undefined

    *   symbol


    让我们逐一个探索这些原始数据类型。


    # string


    字符串代表文本数据。如果允许我表现得技术化一点：JavaScript 字符串原始数据类型简单来说是一组 16 位无符号整数值的集合。字符串中的每个项目都占据字符串中的一个位置，从
    0 开始。


    # number

    '
- fmt: "\nThe `number` JavaScript primitive data type is a double-precision 64-bit\
    \ binary format IEEE 754 value. Integers do not have a specific type. The `number`\
    \ in addition to being able to represent floating-point numbers, the `primitive`\
    \ type also has three special symbolic values, namely: `+Infinity`, `-Infinity`,\
    \ and `NaN` (not-a-number). In order to check for the largest or smallest value\
    \ in `+Infinity` or `-Infinity`, use the `Number.MAX_VALUE` or `Number.MIN_VALUE`\
    \ constants. You can also check if a number is in the double-precision floating-point\
    \ range by using `Number.isSafeInteger()` or `Number.MAX_SAFE_INTEGER` and `Number.MIN_SAFE_INTEGER`.\n\
    \n# bigint\n\nThe `bigint` JavaScript primitive data type stores and operates\
    \ on very large integers. These large integers can be beyond the safe integer\
    \ limit for numbers. You create a `bigint` by appending `n` to the end of an integer.\n\
    \n# boolean\n\nThe `boolean` JavaScript primitive data type can have one of two\
    \ values, `true` or `false`.\n\n# null\n\nThe `null` JavaScript primitive data\
    \ means that there is no value.\n\n# undefined\n\nWhen a variable has a value\
    \ that is `undefined`, it means that it has not been assigned a value.\n\n# symbol\n\
    \nThe `symbol` JavaScript primitive data type is unique and immutable and is mostly\
    \ used as a key to an object property.\n\n# The object data type\n\nObjects are\
    \ variables too, but unlike with primitives, objects can store more than one value\
    \ in it. Objects store keyed collections of data and complex entities. The information\
    \ inside an object is stored as key-value pairs. The key is usually the property\
    \ name. The value is the property’s value, for example:\n\n```javascript\nvar\
    \ objStudent = {\nName:”Ockert”,\nCourse:”JavaScript”,\nYear: 2019\n};\n```\n\n\
    In the above code segment, a new JavaScript object called `objStudent` is created.\
    \ `objStudent` contains three properties, namely: `Name`, `Course`, and `Year`.\n\
    \n# Creating objects\n\nNow that we know a bit more about objects let’s have a\
    \ look at how to create them. Objects can be created using any of the following\
    \ ways:\n\n-   Object literal syntax\n*   The `new` keyword\n*   `Object.create()`\n\
    *   `Object.assign()`\n*   ES6 classes\n\nLet me explain them one by one.\n\n\
    # Object literal syntax\n\nThis method is quite easy to understand and quick to\
    \ do. Here is an example:\n\n```javascript\nvar objCar = {\nmake: “BMW”,\nmodel:\
    \ “i8 Roadster”,\nprice: 2329300\n};\n```\n\nThis example may look almost familiar.\
    \ If you look closely at the previous code segment in the Object data type section,\
    \ you will notice that both code examples have the same similarities. The keyword\
    \ `var` creates the object. The curly braces contain the properties and values\
    \ separated with a colon, and each property is separated with a comma.\n\nThe\
    \ object created now is named `objCar`. It contains the properties `make`, `model`,\
    \ and `price`. To make use of the `objCar` object you can have a statement like:\n\
    \n```javascript\nconsole.log(objCar); //Outputs {make: “BMW”, model: “i8 Roadster”,\
    \ price: 2329300}\nconsole.log(objCar.make); //Outputs BMW\nconsole.log(objCar.model);\
    \ //Outputs i8 Roadster\nconsole.log(objCar.price); //Outputs 2329300\n```\n\n\
    Let’s put it all together in a small exercise:\n\n1. Open a text editor of your\
    \ choice and enter the following HTML and JavaScript code:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<h1>Object literal syntax</h1>\n<p>The following code\
    \ creates a JavaScript object and displays its results in the console window of\
    \ the browser</p>\n<script>\nvar objCar = {\nmake : “BMW”,\nmodel : “i8 Roadster”,\n\
    price : 2329300\n};\nconsole.log(objCar); //Outputs {make: “BMW”, model: “i8 Roadster”,\
    \ price: 2329300}\nconsole.log(objCar.make); //Outputs BMW\nconsole.log(objCar.model);\
    \ //Outputs i8 Roadster\nconsole.log(objCar.price); //Outputs 2329300\n</script>\n\
    </body>\n</html>\n```\n\n2. Save the file with an HTML extension, for example,\
    \ `Chapter21.html`.\n\n3. Double-click the file to open it in the default browser.\
    \ If the browser is Google Chrome, press `Ctrl` + `Shift` + `J` to open the console\
    \ window.\n\n# The ‘new’ keyword\n\nUsing the `new` keyword to create objects\
    \ resembles the way objects are created in class-based languages, like C# or Java.\
    \ There are 2 ways to use the `new` keyword to create objects:\n\n-   Using `new`\
    \ with in-built object functions\n-   Using `new` with user defined constructor\
    \ functions\n\nLet’s explore the differences.\n\n# Using ‘new’ with in-built object\
    \ functions\n\nA constructor, in class-based object-oriented programming (`OOP`),\
    \ is a special type of subroutine called to create an object. A constructor prepares\
    \ the new object for use by initializing the object’s members. To create a new\
    \ object, you must use the `new` keyword with `Object()` constructor, like this:\n\
    \n```javascript\nvar house = new Object();\n```\n\nThis creates and initializes\
    \ a new object named `house`. We can add properties to this object using code\
    \ like the following:\n\n```javascript\nhouse.bedrooms = 4;\nhouse.bathrooms =\
    \ 2;\nhouse.garages = 2;\nhouse.hasSwimmingPool = false;\nhouse.hasOutsideWalls\
    \ = true;\n```\n\nAs you can see, creating properties for an object, which was\
    \ created using the `Object()` constructor, can become a tedious task, and involves\
    \ a lot of typing. The `house` object we created above has `bedrooms` property,\
    \ `bathrooms`, `garages`, as well as Boolean properties indicating the presence\
    \ of a swimming pool, or outside walls.\n\nWhat if we had to create hundreds of\
    \ `house` objects? Let’s see how we can make this code a bit shorter by using\
    \ a user defined constructor function.\n\n# Using ‘new’ with user defined constructor\
    \ functions\n\nWhen creating a user-defined constructor function, you basically\
    \ create a template for the object’s properties and methods. You create the function\
    \ once, and just feed the necessary properties to it, instead of manually entering\
    \ each property and each setting as shown earlier in the Using `new` with in-built\
    \ object constructor functions section.\n\nLet’s create the user defined constructor\
    \ using the `house` object as an example again:\n\n```javascript\nfunction House(_bed,\
    \ _bath, _garage, _pool, _walls) {\n    this.bedRooms = _bed;\n    this.bathRooms\
    \ = _bath;\n    this.garages = _garage;\n    this.hasSwimmingPool = _pool;\n \
    \   this.hasOutsideWalls = _walls;\n}\n```\n\nThe name of the constructor function\
    \ is `House`. Inside the brackets, there are five parameters: `_bed`, `_bath`,\
    \ `_garage`, `_pool`, and `_walls`. These will be used to pass information to\
    \ the `House` function. Inside the constructor function, each property gets set\
    \ to its own parameter. Remember, this is simply a template, there are no values\
    \ yet.\n\nNow that we have the constructor function, it is easy to create objects\
    \ based on it. Here is how to:\n\n```javascript\nvar houseOne = new House(4, 2,\
    \ 2, false, true);\nvar houseTwo = new House(3, 1, 1, true, false);\n```\n\nThe\
    \ `houseOne` object above is a new `House` object. It has 4 bedrooms, 2 bathrooms,\
    \ 2 garages, no swimming pool and it has outside walls. `houseTwo`, in contrast,\
    \ has 3 bedrooms, 1 bathroom, 1 garage, a swimming pool and it doesn’t have outside\
    \ walls.\n"
