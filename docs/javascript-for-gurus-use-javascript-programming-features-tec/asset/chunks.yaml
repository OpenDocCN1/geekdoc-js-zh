  trans: "\n3.  双击文件在默认浏览器中打开它。如果浏览器是 Google Chrome，请按 `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\
    \n指令将一个接一个地按顺序执行。万遇其中某条指令执行耗时过长，下一条指令将等待其完成后再运行。你的控制台窗口应该类似于下方的`Figure 9.3*`：\n\
    \n![](img/Img_09_03.jpg)\n\n**图 9.3：** 同步调用的执行\n\n以下示例显示了异步调用的执行：\n\n1.  打开你选择的文本编辑器，并输入以下\
    \ HTML 和 JavaScript 代码：\n\n    ```html\n    <html>\n    <body>\n    <h1>Asynchronous\
    \ methods example</h1>\n    <p>Asynchronous methods example</p>\n    <script>\n\
    \    console.log(“Hello”)\n    setTimeout(function()\n    {\n    console.log(“Ockert”)\n\
    \    }, 3000);\n    console.log(“My name is “)\n    </script>\n    </body>\n \
    \   </html>\n    ```\n\n2.  用 HTML 扩展名保存文件，例如 `Chapter 9.4.html`。\n\n3.  双击文件在默认浏览器中打开它。如果浏览器是\
    \ Google Chrome，请按 `Ctrl` + `Shift` + `J` 打开控制台窗口。\n\n第一个执行的语句将向控制台窗口打印 `Hello`\
    \ 的语句。它会启动 `Timer`，但仍会继续执行下一条打印 `My name` 的语句。当计时器完成后，它将打印我的名字。如你所见，它并没有等待计时器完成任务再继续。你的控制台窗口应该类似于下方的`Figure\
    \ 9.4*`：\n\n![](img/Img_09_04.jpg)\n\n**图 9.4：** 异步调用的执行\n\n现在你已经对异步调用有了更好的理解，让我们重新关注\
    \ Promise（承诺）。\n\n# Promise 链式调用\n\n如果我们把异步任务更进一步一步会怎样？如何做？嗯，想象你有一系列需要按顺序执行的异步任务。换句话说，你希望在\
    \ `method_1` 完成后调用 `method_2`，当 `method_2` 完成后，你想调用 `method_3`，依此类推。这就是链式调用大用用场。\n\
    \n你可以通过使用 `.then` 关键字在 Promise 中链式连接任意数量的方法。以下示例展示了如何链式调用 Promise：\n\n1.  打开你选择的文本编辑器，并输入以下\
    \ HTML 和 JavaScript 代码：\n\n    ```html\n    <html>\n    <body>\n    <h1>Chaining\
    \ promises example</h1>\n    <p>Chaining Promises example</p>\n    <script>\n\
    \    var Method_1 = function() {\n    var promise = new Promise(function(resolve,\
    \ reject){\n    setTimeout(function() {\n    console.log(‘Method_1 Done.’);\n\
    \    resolve({string: ‘1’});\n    }, 3000);\n    });\n    return promise;\n  \
    \  };\n    var Method_2 = function(strTemp) {\n    var promise = new Promise(function(resolve,\
    \ reject){\n    setTimeout(function() {\n    console.log(‘Method_2 Done.’);\n\
    \    resolve({newString: strTemp.string + ‘2’});\n    }, 3000);\n    });\n   \
    \ return promise;\n    };\n    var Method_3 = function(strTemp) {\n    var promise\
    \ = new Promise(function(resolve, reject){\n    setTimeout(function() {\n    console.log(‘Method_3\
    \ Done.’);\n    resolve({endString: strTemp.newString});\n    }, 3000);\n    });\n\
    \    return promise;\n    };\n    Method_1()\n    .then(Method_2)\n    .then(Method_3);\n\
    \    </script>\n    </body>\n    </html>\n    ```\n\n2.  用 HTML 扩展名保存文件，例如 `Chapter\
    \ 9.5.html`。\n\n3.  双击文件在默认浏览器中打开它。如果浏览器是 Google Chrome，请按 `Ctrl` + `Shift` +\
    \ `J` 打开控制台窗口。\n\n上面的示例中有三个异步方法。你还会注意到，每个方法都包含一个带有 `resolve` 参数的 Promise。这就是秘诀所在。当异步方法成功完成时，它会将\
    \ `resolve` 参数传递给下一个异步方法。该参数包含一个简单的字符串值，并传递给下一个方法。\n\n这些信息随后并没有被真正使用，但字符串会不断增长。如果发生了某些错误，`resolve`\
    \ 参数将失败，Promise 也会失败。\n\n每个方法都包含一个计时器，在三秒后打印一段文本。如果一切进展顺利，你的控制台窗口应该类似于下方的`Figure\
    \ 9.5*`：\n\n![](img/Img_09_05.jpg)\n\n**图 9.5：** Promise 链式调用\n\n继续讨论异步任务和方法，那些水平稍高或经验更丰富的读者可能会很惊讶，为什么我还没有提到回调函数（callbacks）。好吧，我正尝试系统化地讲解，特别是对于新手来说。\n\
    \n# 回调函数与 Promise 化\n\n我现在将讲解回调函数，稍后会谈论 Promise 化，因为它们是关联的。\n\n# 回调\n\n回调就是一个在另一个函数执行后执行的函数。听起来很简单，让我们来看一个简单的复杂的例子。\n\
    \n以下示例创建了一个回调：\n\n1.  打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n    ```html\n\
    \    <html>\n    <body>\n    <h1>Callback example</h1>\n    <p>Callback example</p>\n\
    \    <script>\n    function DisplayName(name, surname, callback){\n    document.write(`Welcome\
    \ ${name + surname}!<br>`);\n    callback();\n    }\n    function EnjoyMessage(){\n\
    \    document.write(‘Enjoy.’);\n    }\n    DisplayName('Ockert’, du Preez’, EnjoyMessage);\n\
    \    </script>\n    </body>\n    </html>\n    ```\n\n2.  用 HTML 扩展名保存文件，例如 `Chapter\
    \ 9.6.html`。\n\n3.  双击文件在默认浏览器中打开它。\n\n在上面的例子中，你创建一个名为 `DisplayName` 的函数。它接受三个参数：`name`、`surname`\
    \ 和 `callback`。下一行你使用 `document.write` 写入文本；然而问题是它什么时候执行的？\n\n嗯，代码最后一行调用了 `DisplayName`\
    \ 函数。你向它传递了名字和姓氏，然后传递了 `EnjoyMessage` 函数。`EnjoyMessage` 函数就是回调函数，当另一个函数执行完成后它就会运行。\n\
    \n看，这并不难！\n\n你的网页浏览器应该类似于：`Figure 9.6*`：\n\n![](img/Img_09_06.jpg)\n\n**图 9.6：**\
    \ 回调函数的执行\n\n现在我们对回调函数有了更多了解，让我们来看看 Promise 化（Promisification）。\n\n# Promise 化\n\
    \nPromise 化是将接受回调的函数转换为返回 Promise 的函数的过程。\n\n以下示例展示了转换回调函数的快速方法：\n\n1.  打开你选择的文本编辑器，并输入以下\
    \ HTML 和 JavaScript 代码：\n\n    ```html\n    <html>\n    <body>\n    <h1>Promisification\
    \ example</h1>\n    <p>Promisification example</p>\n    <script>\n    function\
    \ promiseDisplayName(name, surname) {\n    return new Promise((resolve, reject)\
    \ =>\n    DisplayName(name, surname, (err, result) =>\n    // 如果有错误，则 reject；否则\
    \ resolve\n    err ? `reject(err)` : resolve(result)`\n    )\n    );\n    }\n\
    \    // 像这样调用：\n    promiseDisplayName('Ockert’, ‘ Du Preez’).then(result => {\n\
    \    // 解析\n    }).catch(err => {\n    // 错误\n    });\n    </script>\n    </body>\n\
    \    </html>\n    ```\n\n2.  用 HTML 扩展名保存文件，例如 `Chapter 9.7.html`。\n\n3.  双击文件在默认浏览器中打开它。\n\
    \n回调函数和 Promise 有它们自己的用处。有些任务可以很容易地 Promise 化。\n\n# 微任务与宏任务\n\n"
- fmt: "\nA microtask is simply a short function (hence the name) that executes after\
    \ its creation function exits. Promises in JavaScript make use of microtasks in\
    \ order to run their callbacks.\n\nA macrotask is any JavaScript code which is\
    \ run by event callbacks, starting of a program or firing intervals.\n\nAllow\
    \ me to explain, and there are mainly two differences.\n\nThe first difference\
    \ is, when a macrotask exits, the JavaScript event loop checks whether the macrotask\
    \ is returning control to any other code. If it does not, the event loop proceeds\
    \ to run all the microtasks present in the microtask queue.\n\nThe second difference\
    \ is, when a microtask adds more microtasks to its queue by using the `queueMicrotask()`\
    \ method, the new microtasks execute before the next task is run. This is because\
    \ the event loop will keep calling microtasks until there are none left in the\
    \ queue.\n\nLet’s see this in a practical example.\n\nThe following sample shows\
    \ how to chain promises:\n\n1.  Open a text editor of your choice and enter the\
    \ following HTML and JavaScript code:\n\n```html\n<html>\n<body>\n    <h1>Microtasks\
    \ versus Macrotasks example</h1>\n    <p>Microtasks versus Macrotasks example</p>\n\
    \    <script>\n        let firstCallback = () => console.log(\"Fifth. First callback\
    \ has run with setTimeout\");\n        let secondCallback = () => console.log(\"\
    Fourth. Second callback\");\n        let doTasks = () => {\n            let result\
    \ = 1;\n            queueMicrotask(secondCallback);\n            for (let i =\
    \ 5; i <= 20; i++) {\n                result *= i;\n            }\n          \
    \  return result;\n        };\n        console.log(\"First\");\n        setTimeout(firstCallback,\
    \ 0);\n        console.log('Second Answer: ${doTasks()}');\n        console.log(\"\
    Third\");\n    </script>\n</body>\n</html>\n```\n\n2.  Save the file with an HTML\
    \ extension, for example `Chapter 9.8.html`.\n\n3.  Double-click the file to open\
    \ it in the default browser. If the browser is Google Chrome, press `Ctrl` + `Shift`\
    \ + `J` to open the console window.\n\nThe above code sample uses `queueMicrotask()`\
    \ to schedule a microtask. The microtask isn’t processed upon function exit, but\
    \ instead when the main program exits. The `doTasks()` function calls `queueMicrotask()`,\
    \ yet the microtask being called doesn’t fire until the entire program exists,\
    \ because that’s when the task exists and there’s nothing else on the execution\
    \ stack. Notice the order in which the tasks get executed.\n\nYour screen would\
    \ resemble *[Figure 9.7](#c09.xhtml_fig9_7)* shown below:\n\n![](images/Img_09_07.jpg)\n\
    \n**Figure 9.7:** Macrotasks versus microtasks\n\nBecause we made use of the `queueMicrotask`\
    \ method, the order in which the tasks got executed differs from how we entered\
    \ them.\n\n# Promise methods\n\nThe `Promise` class contains a few static methods\
    \ in the `Promise` class. They are:\n\n*   `Promise.all`\n*   `Promise.allSettled`\n\
    *   `any`\n*   `Promise.race`\n*   `Promise.resolve/reject`\n\nI have covered\
    \ resolve and reject here this whole chapter, so let me concentrate on the others\
    \ for a while.\n\n# Promise.all\n\nWhen you need to run many promises in parallel\
    \ and wait until all of them are ready, the all method should be used. `Promise.all`\
    \ takes an array of promises and returns a new promise. This new promise is resolvedonly\
    \ when all listed promises are settled. The array of their results becomes its\
    \ result.\n\nFor example, the `Promise.all` method below is resolved after 3 seconds,\
    \ and then its result is gets stored as an `array [1, 2, 3]`:\n\n```javascript\n\
    Promise.all([\n    new Promise(resolve => setTimeout(() => resolve(1), 3000)),\
    \ // 1\n    new Promise(resolve => setTimeout(() => resolve(2), 2000)), // 2\n\
    \    new Promise(resolve => setTimeout(() => resolve(3), 1000)) // 3\n]).then(alert);\n\
    ```\n\nAlthough the first promise takes the longest, it still comes first in the\
    \ array.\n\n# Promise.allSettled\n\nThe problem with `Promise.all` is that it\
    \ rejects if any promise rejects. It needs all the results in order to continue.\
    \ What if you’d like to fetch information, but if one request fails, you still\
    \ want the other successful information. This is where `Promise.allSettled` comes\
    \ in handy. Let’s have a look at the next code segment:\n\n```javascript\nconst\
    \ prom_1 = Promise.resolve(5);\nconst prom_2 = new Promise((resolve, reject) =>\
    \ setTimeout(reject, 100, ‘fail’));\nconst promArray = [prom_1, prom_2];\nPromise.allSettled(promArray).then((results)\
    \ =>\n    results.forEach((result) =>\n    console.log(result.status)));\n```\n\
    \nWe will get the following output:\n\n`fulfilled`\n\n`rejected`\n\nEven though\
    \ there was a rejected, it continued to go through all the promises and didn’t\
    \ immediately reject the whole array of results.\n\n# Promise.any\n\n`Promise.any()`\
    \ takes an array of `Promise` objects and, as soon as one of the promises in the\
    \ array fulfills, returns a single promise that resolves with the value from that\
    \ promise.\n\n# Promise.race\n\nWait for the first settled promise and gets its\
    \ result. So whichever promise is fastest to be fulfilled, becomes the result.\
    \ The others are then ignored.\n\n# Conclusion\n\nIn this chapter, we learnt about\
    \ JavaScript Promises. We learned how to create them and the real need for Promises\
    \ in today’s web-oriented world. We learned how to combine multiple microtasks\
    \ for one promise, thus changing them and we learned about the various methods\
    \ of the `Promise` JavaScript class.\n\nIn the next chapter, we will dives into\
    \ JavaScript generators and iterators. You will learn what generators and iterators\
    \ are, how to make use of them properly.\n\n# Questions\n\n1.  Name 4 `Promise`\
    \ methods.\n2.  What is the difference between macrotasks and microtasks?\n3.\
    \  What is the difference between calls backs and Promisification?\n4.  What is\
    \ the difference between synchronous and asynchronous tasks?\n5.  Define the term:\
    \ JavaScript `Promise`.\n\n# CHAPTER 10\n\n# JavaScript Generators and Iterators\n\
    \n# Introduction\n\nBeing able to loop or iterate through lists of information,\
    \ whether it be a sequence of characters, an array of numbers or names, or custom\
    \ lists, is vital for any web application. The trick, however, is to know which\
    \ option to use for which occasion.\n\nThis lesson will teach you what generators,\
    \ iterators, and iterables are with practical exercises and guidance. You will\
    \ also learn the differences between async iterators and regular iterators, and\
    \ the same with generators.\n\n# Structure\n\n*   What are JavaScript generators?\n\
    *   Advantages of generators\n*   Iterators\n*   Iterables\n*   Asynciterators\
    \ vs.async generators\n\n# Objectives\n\n*   Learn what generators are\n*   Learn\
    \ what iterators are\n*   Learn what iterables are\n*   Understand the advantages\
    \ of generators\n*   Compare regular iterators with async iterators\n*   Compare\
    \ regular generators with async generators\n\n# What are JavaScript generators?\n\
    \nIn *[Chapter 5: JavaScript Functions](#c05.xhtml)*, we introduced you to functions.\
    \ You have learned that each JavaScript function has a beginning and an end. Once\
    \ a function starts, it continues until all the lines of code inside it, has executed,\
    \ whether these lines are macrotasks or microtasks.\n\nFunctions can also be exited\
    \ depending on a certain condition by using the `return` keyword. The `return`\
    \ keyword exits the function and continues onto the next statement or function\
    \ call in the script.\n\nGenerator functions are similar yet different. Generator\
    \ functions return a generator object which holds the entire generator iterable\
    \ that can be iterated using `next()` method or a `for`of loop. You can assign\
    \ this object to a variable and then keep track of where you are in the current\
    \ generator function.\n"
