    \ `Symbol` 并告诉它应该从哪里获取信息。接着，你进行了几次非常重要的检查。这些检查用于判断每个流派中的乐队是否遍历完毕，然后检查所有流派是否已循环完毕。这很重要，因为迭代器需要知道何时停止；否则它将一直持续迭代。最后，你将每个流派的所有乐队打印到控制台中。\n\
