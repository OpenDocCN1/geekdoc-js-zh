  trans: "\n打开此页面时，你将看到一个类似于图 14.6 的框，你可以在其中输入数字。现在，你可以每次输入 `1`，它会不断累加 `1` 直到达到 `100`。或者你可以输入\
    \ `50` 和 `50`，甚至直接输入 `100`。\n\n如果你每次都 `1`，它将循环 `100` 次；如果你再次输入 `50` 和 `50`，它将循环两次；如果你立即输入\
    \ `100`，它将只循环一次。要测试这一点，在达到 `100` 后刷新页面，并尝试不同的数字组合：\n\n![](img/Img_14_06.jpg)\n\
    \n**图 14.6：** 运行中的 while 循环\n\n`do…while` 循环（我将在下文中介绍）与 `while` 循环几乎相同，让我们来看一下：\n\
    \n# do…while\n\n`do…while` 循环也是一种条件循环，就像你之前做的 `while` 循环一样。它们只有一个主要区别：在 `while`\
    \ 循环中，条件是在循环开始时测试的，而在 `do…while` 循环中，条件是在循环结束测试的。这意味着循环将至少执行一次。它的语法如下：\n\n```\n\
    do\n{\n  Statement(s)\n} while (condition);\n```\n\n下一个示例演示了 `do…while` 循环。\n\n\
    1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<body>\n\
    <h1>while 循环示例</h1>\n<p>while 循环示例</p>\n<script>\n  let i = 0; // 更改为 6\n  do\n\
    \  {\n    i += 1;\n    document.write(i);\n  } while (i < 5);\n</script>\n</body>\n\
    </html>\n```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 14.7.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\
    \n这段代码在运行时将简单地在页面上输出 `12345`。现在由于条件是在循环结束时评估的，这可能会带来麻烦。例如，如果你在循环之前将 `1` 的值改为 `6`\
    \ 而不是 `0`，循环仍然会执行一次并产生 `7`。\n\n# 退出循环\n\n有时你可能提前退出循环。在这种情况下，你应该使用 `break` 语句。你有两种方法在循环中使用\
    \ `break` 语句：\n\n* `break`\n* 带有标签的 `break`\n\n让我们看看它们是如何工作的。\n\n# break\n\n你可以通过在想要退出的地方包含\
    \ `break` 语句来退出循环。这通常基于一个已变为真的条件。\n\n下一个示例演示了如何提前退出循环。\n\n1. 打开你选择的文本编辑器，并输入以下\
    \ HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<body>\n<h1>使用 break 退出循环的示例</h1>\n\
    <p>使用 break 退出循环的示例</p>\n<script>\n  var num = \"\";\n  var i = 0;\n  while (i\
    \ < 5)\n  {\n    num += \"<br>当前数字: \" + i;\n    i++;\n    if (i === 3)\n    {\n\
    \      break;\n    }\n  }\n  document.write(num);\n</script>\n</body>\n</html>\n\
    ```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 14.8.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\n循环本应该从\
    \ 0 循环到 5，但 `if` 语句测试了 `i` 是否为 `3`。如果是，循环应该通过 `break` 语句退出。图 14.7 显示了未完成的循环。\n\
    \n![](img/Img_14_07.jpg)\n\n**图 14.7：** 循环提前退出\n\n让我们增加一个花样。\n\n# 带有标签的 break\n\
    \n正如你所看到的，`break` 语句会导致循环提前退出。你可以通过包含一个标签并跳转到该标签来指定开始执行代码的位置。你只需要添加一个带标签的语句，并在之后添加代码即可。\n\
    \n让我们来看一个例子。\n\n下一个示例演示了如何使用标签提前退出循环。\n\n1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript\
    \ 代码：\n\n```html\n<!doctype html>\n<body>\n<h1>使用 break 退出循环的示例</h1>\n<p>使用 break\
    \ 退出循环的示例</p>\n<script>\n  let i = 0;\n  let j = 0;\n  Repeat: while (true)\n\
    \  {\n    document.write('外层: ' + i + '<br>');\n    i++;\n    j = 1;\n    while\
    \ (true)\n    {\n      document.write('内层: ' + j + '<br>');\n      j++;\n    \
    \  if (i === 5 && j === 5)\n      {\n        break Repeat;\n      }\n      else\
    \ if (j === 5)\n      {\n        break;\n      }\n    }\n  }\n</script>\n</body>\n\
    </html>\n```\n（注：原文中关于 `break with label` 的部分文本有些杂乱，我已根据提供的代码字符串重构了逻辑。）\n"
- fmt: "\n*   Know how to use comments in JavaScript.\n\n# Debugging\n\nShow me a\
    \ script without any errors, and I’ll show you the `Loch Ness` monster. Whilst\
    \ surfing a website, it may seem perfect, and by all means, it is, but there used\
    \ to be a plethora of errors, and maybe there still are. Errors happen. Mistakes\
    \ happen. It is part of programming. The trick, however, is how you handle them.\n\
    \nThere are mainly two types of errors in JavaScript; they are:\n\n*   **Syntax\
    \ errors**: Syntax errors happen whilst typing code. When a person types fast,\
    \ he or she doesn’t always registera mistake until later. These can be difficult\
    \ to find, as you may have to scan the lines one by one unless you have a proper\
    \ debugging tool at hand.\n\n*   **Logical errors**: Logical errors give developers\
    \ nightmares. These usually occur when a certain result is expected, but something\
    \ different happens. For example: Say you want to turn the background blue, and\
    \ you write code for it, but the background ends up red. That is a logical error.\n\
    \n*   **Runtime errors**: A runtime error happens while a user is busy using the\
    \ page. Let’s say the user enters the wronginformation or supplies information\
    \ in the wrong format. These are runtime errors, and you should be able to handle\
    \ them.\n\nIn order to fix any of these types of errors, you need tools. Remember,\
    \ JavaScript doesn’t have a fully-fledged `IDE` (`Integrated Development Environment`)\
    \ which comes with debugging tools and features, so there aren’t too many options\
    \ available.\n\n# JavaScript debugging language features\n\nThe JavaScript language\
    \ includes two debugging features; they are:\n\n*   the console window\n*   the\
    \ `debugger` keyword\n\nLet’s get into more details.\n\n# The console window\n\
    \nThe console window is more powerful than what you may realize! You can not only\
    \ output important content to it, but you can time certain procedures seeing how\
    \ long they will take. This can be a long loop or a complex statement. After all,\
    \ speed is crucial in web applications.\n\n# console.log\n\nThe function of `console.log`\
    \ is to output information to the browser’s console window. I have been demonstrating\
    \ various code output to the console window in practically all the lessons thus\
    \ far, but, just in case you have forgotten, let’s do a small exercise demonstrating\
    \ the use of `console.log()`.\n\n*   Open a text editor of your choice and enter\
    \ the following HTML and JavaScript code:\n\n    ```html\n    <html>\n    <body>\n\
    \    <h1>console.log Output</h1>\n    <p>The following code demonstrates the use\
    \ of console.log</p>\n    <script>\n    console.log(“I love JavaScript”);\n  \
    \  var myObj = { firstname : “Ockert”, lastname : “du Preez” };\n    console.log(myObj);\n\
    \    var myArr = [“JavaScript”, “CSS”, “HTML5”, “jQuery” ];\n    console.log(myArr);\n\
    \    </script>\n    </body>\n    </html>\n    ```\n\n*   Save the file with an\
    \ HTML extension, for example `Chapter 15.1.html`.\n*   Double-click the file\
    \ to open it in the default browser.\n*   Press `Ctrl` + `Shift` + `J` or `F12`\
    \ in Google Chrome to open the console window.\n\nWhen the console window is opened,\
    \ you will see the three different types of content written to it. First, you\
    \ have the string: `I love JavaScript!`, then the object displaying my first name\
    \ and last name. Lastly, the content of the array is also printed. *[Figure 15.1](#c15.xhtml_fig15_1)*\
    \ shows the result:\n\n![](images/Img_15_01.jpg)\n\n**Figure 15.1:** console.log\n\
    \nAnother useful feature of the console window is the `console.time` keywords.\n\
    \n# console.time and console.timeEnd keywords\n\nSometimes you need to ensure\
    \ that your code runs fast enough on every browser. For this, you can use the\
    \ `time()` and `timeEnd` methods of the `console` object start the timer andstop\
    \ the built-in timer respectively. Let’s do a quick exercise!\n\n1.  Open a text\
    \ editor of your choice and enter the following HTML and JavaScript code:\n\n\
    \    ```html\n    <html>\n    <body>\n    <h1>console timing features</h1>\n \
    \   <p>The following code demonstrates the use of console.time and console.timeEnd</p>\n\
    \    <script>\n    console.time(‘Timer1’);\n    var items = [];\n    for(var i\
    \ = 0; i < 500000; i++){\n    items.push({index: i});\n    }\n    console.timeEnd(‘Timer1’);\n\
    \    </script>\n    </body>\n    </html>\n    ```\n\n2.  Save the file with an\
    \ HTML extension, for example `Chapter 15.2.html`.\n3.  Double-click the file\
    \ to open it in the default browser.\n4.  Press `Ctrl` + `Shift` + `J` or `F12`\
    \ in Google Chrome to open the console window.\n\nThe output I got is displayed\
    \ in *[Figure 15.2](#c15.xhtml_fig15_2)*:\n\n![](images/Img_15_02.jpg)\n\n**Figure\
    \ 15.2:** console timing features\n\nThe console informs us that it took `114`\
    \ milliseconds to complete all the iterations of the `for` loop. You specify where\
    \ the timer should start and where it should end.\n\n# More console methods\n\n\
    The `console` object includes many other methods to help with debugging. They\
    \ are listed in the following table:\n\n| Method | Description |\n| :--- | :---\
    \ |\n| `assert()` | Writes an error message to the console if the assertion is\
    \ false |\n| `clear()` | Clears the console |\n| `count()` | Logs the number of\
    \ times that the call to count() has been called |\n| `error()` | Outputs an error\
    \ message to the console |\n| `group()` | Creates a new inline group in the console.\
    \ |\n| `groupCollapsed()` | Creates a new inline group in the console. |\n| `groupEnd()`\
    \ | Exits the current inline group in the console |\n| `info()` | Outputs an informational\
    \ message to the console |\n| `table()` | Displays tabular data as a table |\n\
    | `trace()` | Outputs a stack trace to the console |\n| `warn()` | Outputs a warning\
    \ message to the console |\n\n**Table 15.1:** Console methods\n\nLet’s do an exercise!\n\
    \nThere are a few more console methods, as the next exercise will demonstrate:\n\
    \n1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    ```html\n    <html>\n    <body>\n    <h1> more console methods\
    \ </h1>\n    <p>The following code demonstrates the use of more console methods</p>\n\
    \    <script>\n    var myObj = { firstname : “Ockert”, lastname : “du Preez” };\n\
    \    console.assert(document.getElementById(“demo”), myObj);\n    console.clear();\n\
    \    for (i = 0; i < 10; i++) {\n    console.count();\n    }\n    console.error(“I\
    \ am a mistake!”);\n    console.log(“Hello world!` `- Normal”);\n    console.group();\n\
    \    console.log(“Hello again!` `- Inside a group”);\n    console.info(“I love\
    \ JavaScript!”);\n    function myFunction() {\n    anotherFunction();\n    }\n\
    \    function anotherFunction() {\n    console.trace();\n    }\n    console.warn(“This\
    \ is a warning!”);\n    console.table([“JavaScript”, “HTML5”, “CSS”]);\n    </script>\n\
    \    </body>\n    </html>\n    ```\n\n2.  Save the file with an HTML extension,\
    \ for example `Chapter 15.3.html`.\n3.  Double-click the file to open it in the\
    \ default browser.\n4.  Press `Ctrl` + `Shift` + `J` or `F12` in Google Chrome\
    \ to open the console window.\n\nThe output of the above code is shown in the\
    \ following screenshot:\n\n![](images/Img_15_03.jpg)\n\n**Figure 15.3:** More\
    \ console methods\n\nAs you can see, the console is much more powerful than what\
    \ is thought. With the use of the `assert`, `warn`, and `error` methods, you can\
    \ quickly interrogate errors, and with the grouping and table methods, you can\
    \ organize the output of your data.\n\nThe following JavaScript debugging language\
    \ feature is the `debugger` keyword which will be explained next.\n\n# The debugger\
    \ keyword\n\nThe JavaScript `debugger` statement stops the execution of code and\
    \ calls the browser debugging function. This is the same as setting a breakpoint\
    \ in code. For those of you not familiar with the term breakpoint, a breakpoint\
    \ allows the debugger to stop execution so that you can interrogate variable values\
    \ before and while the code executes.\n"
  raw: "*   Know how to use comments in JavaScript.\n\n# [Debugging](#toc.xhtml_s236a)\n\
    \nShow me a script without any errors, and I’ll show you the *Loch Ness* monster.\
    \ Whilst surfing a website, it may seem perfect, and by all means, it is, but\
    \ there used to be a plethora of errors, and maybe there still are. Errors happen.\
    \ Mistakes happen. It is part of programming. The trick, however, is how you handle\
    \ them.\n\nThere are mainly two types of errors in JavaScript; they are:\n\n*\
    \   **Syntax errors**: Syntax errors happen whilst typing code. When a person\
    \ types fast, he or she doesn’t always registera mistake until later. These can\
    \ be difficult to find, as you may have to scan the lines one by one unless you\
    \ have a proper debugging tool at hand.\n\n*   **Logical errors**: Logical errors\
    \ give developers nightmares. These usually occur when a certain result is expected,\
    \ but something different happens. For example: Say you want to turn the background\
    \ blue, and you write code for it, but the background ends up red. That is a logical\
    \ error.\n\n*   **Runtime errors**: A runtime error happens while a user is busy\
    \ using the page. Let’s say the user enters the wronginformation or supplies information\
    \ in the wrong format. These are runtime errors, and you should be able to handle\
    \ them.\n\nIn order to fix any of these types of errors, you need tools. Remember,\
    \ JavaScript doesn’t have a fully-fledged **IDE** (**Integrated Development Environment**)\
    \ which comes with debugging tools and features, so there aren’t too many options\
    \ available.\n\n# [JavaScript debugging language features](#toc.xhtml_s237a)\n\
    \nThe JavaScript language includes two debugging features; they are:\n\n*   The\
    \ console window\n\n*   The debugger keyword\n\nLet’s get into more details.\n\
    \n# [The console window](#toc.xhtml_s238a)\n\nThe console window is more powerful\
    \ than what you may realize! You can not only output important content to it,\
    \ but you can time certain procedures seeing how long they will take. This can\
    \ be a long loop or a complex statement. After all, speed is crucial in web applications.\n\
    \n# [console.log](#toc.xhtml_s239a)\n\nThe function of console.log is to output\
    \ information to the browser’s console window. I have been demonstrating various\
    \ code output to the console window in practically all the lessons thus far, but,\
    \ just in case you have forgotten, let’s do a small exercise demonstrating the\
    \ use of `console.log`.\n\n*   Open a text editor of your choice and enter the\
    \ following HTML and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>console.log\
    \ Output</h1>`\n\n    `<p>The following code demonstrates the use of console.log</p>`\n\
    \n    `<script>`\n\n    `console.log(“I love JavaScript”);`\n\n    `var myObj\
    \ = { firstname : “Ockert”, lastname : “du Preez” };`\n\n    `console.log(myObj);`\n\
    \n    `var myArr = [“JavaScript”, “CSS”, “HTML5”, “jQuery” ];`\n\n    `console.log(myArr);`\n\
    \n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n*   Save the file with\
    \ an HTML extension, for example `Chapter 15.1.html`.\n\n*   Double-click the\
    \ file to open it in the default browser.\n\n*   Press *Ctrl* + *Shift* + *J*\
    \ or *F12* in Google Chrome to open the console window.\n\nWhen the console window\
    \ is opened, you will see the three different types of content written to it.\
    \ First, you have the string: `I love JavaScript!`, then the object displaying\
    \ my first name and last name. Lastly, the content of the array is also printed.\
    \ *[Figure 15.1](#c15.xhtml_fig15_1)* shows the result:\n\n![](images/Img_15_01.jpg)\n\
    \n**Figure 15.1:** console.log\n\nAnother useful feature of the console window\
    \ is the `console.time` keywords\n\n# [console.time and console.timeEnd keywords](#toc.xhtml_s240a)\n\
    \nSometimes you need to ensure that your code runs fast enough on every browser.\
    \ For this, you can use the `time,` and `timeEnd` methods of the `console`object\
    \ start the timer andstop the built-in timer respectively. Let’s do a quick exercise!\n\
    \n1.  Open a text editor of your choice and enter the following HTML and JavaScript\
    \ code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1>console timing features</h1>`\n\
    \n    `<p>The following code demonstrates the use of console.time and console.timeEnd</p>`\n\
    \n    `<script>`\n\n    `console.time(‘Timer1’);`\n\n    `var items = [];`\n\n\
    \    `for(var i = 0; i < 500000; i++){`\n\n    `items.push({index: i});`\n\n \
    \   `}`\n\n    `console.timeEnd(‘Timer1’);`\n\n    `</script>`\n\n    `</body>`\n\
    \n    `</html>`\n\n2.  Save the file with an HTML extension, for example `Chapter\
    \ 15.2.html`.\n\n3.  Double-click the file to open it in the default browser.\n\
    \n4.  Press *Ctrl* + *Shift* + *J* or *F12* in Google Chrome to open the console\
    \ window.\n\nThe output I got is displayed in *[Figure 15.2](#c15.xhtml_fig15_2)*:\n\
    \n![](images/Img_15_02.jpg)\n\n**Figure 15.2:** console timing features\n\nThe\
    \ console informs us that it took `114`milliseconds to complete all the iterations\
    \ of the `for` loop. You specify where the timer should start and where it should\
    \ end.\n\n# [More console methods](#toc.xhtml_s241a)\n\nThe `console` object includes\
    \ many other methods to help with debugging. They are listed in the following\
    \ table:\n\n| **Method** | **Description** |\n\n| `assert()` | Writes an error\
    \ message to the console if the assertion is false |\n\n| `clear()` | Clears the\
    \ console |\n\n| `count()` | Logs the number of times that the call to count()\
    \ has been called |\n\n| `error()` | Outputs an error message to the console |\n\
    \n| `group()` | Creates a new inline group in the console. |\n\n| `groupCollapsed()`\
    \ | Creates a new inline group in the console. |\n\n| `groupEnd()` | Exits the\
    \ current inline group in the console |\n\n| `info()` | Outputs an informational\
    \ message to the console |\n\n| `table()` | Displays tabular data as a table |\n\
    \n| `trace()` | Outputs a stack trace to the console |\n\n| `warn()` | Outputs\
    \ a warning message to the console |\n\n**Table 15.1:** Console methods\n\nLet’s\
    \ do an exercise!\n\nThere are a few more console methods, as the next exercise\
    \ will demonstrate:\n\n1.  Open a text editor of your choice and enter the following\
    \ HTML and JavaScript code:\n\n    `<html>`\n\n    `<body>`\n\n    `<h1> more\
    \ console methods </h1>`\n\n    `<p>The following code demonstrates the use of\
    \ more console methods</p>`\n\n    `<script>`\n\n    `var myObj = { firstname\
    \ : “Ockert”, lastname : “du Preez” };`\n\n    `console.assert(document.getElementById(“demo”),\
    \ myObj);`\n\n    `console.clear();`\n\n    `for (i = 0; i < 10; i++) {`\n\n \
    \   `console.count();`\n\n    `}`\n\n    `console.error(“I am a mistake!”);`\n\
    \n    `console.log(“Hello world!` `- Normal”);`\n\n    `console.group();`\n\n\
    \    `console.log(“Hello again!` `- Inside a group”);`\n\n    `console.info(“I\
    \ love JavaScript!”);`\n\n    `function myFunction() {`\n\n    `anotherFunction();`\n\
    \n    `}`\n\n    `function anotherFunction() {`\n\n    `console.trace();`\n\n\
    \    `}`\n\n    `console.warn(“This is a warning!”);`\n\n    `console.table([“JavaScript”,\
    \ “HTML5”, “CSS”]);`\n\n    `</script>`\n\n    `</body>`\n\n    `</html>`\n\n\
    2.  Save the file with an HTML extension, for example `Chapter 15.3.html`.\n\n\
    3.  Double-click the file to open it in the default browser.\n\n4.  Press *Ctrl*\
    \ + *Shift* + *J* or *F12* in Google Chrome to open the console window.\n\nThe\
    \ output of the above code is shown in the following screenshot:\n\n![](images/Img_15_03.jpg)\n\
    \n**Figure 15.3:** More console methods\n\nAs you can see, the console is much\
    \ more powerful than what is thought. With the use of the `assert`, warn, and\
    \ error methods, you can quickly interrogate errors, and with the grouping and\
    \ table methods, you can organize the output of your data.\n\nThe following JavaScript\
    \ debugging language feature is the debugger keyword which will be explained next.\n\
    \n# [The debugger keyword](#toc.xhtml_s242a)\n\nThe JavaScript `debugger` statement\
    \ stops the execution of code and calls the browser debugging function. This is\
    \ the same as setting a breakpoint in code. For those of you not familiar with\
    \ the term breakpoint, a breakpoint allows the debugger to stop execution so that\
    \ you can interrogate variable values before and while the code executes."
