  \n  });\n\n});\n```\n\n## 9.3 动态 HTML\n\n我们在 第 9.2 节 结束时有了一个可以工作的回文检测器，但在 `alert`\
  \ 中显示结果有点笨拙。在这一节中，我们将通过直接更新页面 HTML 来改进设计。（通过 `prompt` 接受输入也是麻烦的；我们将在 第 9.4 节 中解决这个问题。）\n\
  \n为了准备这一工作，让我们为结果添加另一个标题和一个带有 CSS id 的段落（列表 9.12）。\n\n**列表 9.12：** 为回文结果添加 HTML。\n\
  \n`palindrome.html`\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Palindrome\
  \ Tester</title>\n    <meta charset=\"utf-8\">\n    <script src=\"bundle.js\"></script>\n\
  \  </head>\n  <body>\n    <h1>Palindrome Tester</h1> \n    <button id=\"palindromeTester\"\
  >Test palindrome</button>\n    <h2>Result</h2> \n    <p id=\"palindromeResult\"\
  ></p>\n  </body>\n</html> \n```\n\n注意 列表 9.12 中的段落（`<p>`）是空的；这是因为我们将动态填充它。令人惊讶的是，将代码改为使用\
  \ HTML 而不是 `alert` 只需要一行。我们首先使用 `querySelector`：\n\n```javascript\nfunction palindromeTester()\
  \ {\n  let string = prompt(\"Please enter a string for palindrome testing:\");\n\
  \n  let phrase = new Phrase(string); \n\n  if (phrase.palindrome()) {\n    alert(`\"\
  ${phrase.content}\" is a palindrome!`);\n\n  } else {\n    alert(`\"${phrase.content}\"\
  \ is not a palindrome.`)\n  }\n}\n\n// 修改后\nfunction palindromeTester() {\n  let\
  \ string = prompt(\"Please enter a string for palindrome testing:\");\n\n  let phrase\
  \ = new Phrase(string);\n\n  let palindromeResult = document.querySelector(\"#palindromeResult\"\
  );\n\n  if (phrase.palindrome()) {\n    palindromeResult.innerHTML = `\"${phrase.content}\"\
  \ is a palindrome!`;\n  } else {\n    palindromeResult.innerHTML = `\"${phrase.content}\"\
  \ is not a palindrome.`;\n  }\n}\n```\n\n然后，而不是使用 `alert`，我们只需将字符串赋值给 `palindromeResult`\
  \ 的 `innerHTML`：\n\n```javascript\nfunction palindromeTester() {\n  let string =\
  \ prompt(\"Please enter a string for palindrome testing:\");\n\n  let phrase = new\
  \ Phrase(string);\n\n  let palindromeResult = document.querySelector(\"#palindromeResult\"\
  );\n\n  if (phrase.palindrome()) {\n    palindromeResult.innerHTML = `\"${phrase.content}\"\
  \ is a palindrome!`;\n  } else {\n    palindromeResult.innerHTML = `\"${phrase.content}\"\
  \ is not a palindrome.`;\n  }\n}\n```\n\n完整的 `main.js` 现在出现在 列表 9.13 中。\n\n**列表\
  \ 9.13：** 添加结果通知。\n\n`main.js`\n\n```javascript\nlet Phrase = require(\"<username>-palindrome\"\
  ); \n\nfunction palindromeTester() {\n\n  let string = prompt(\"Please enter a string\
  \ for palindrome testing:\");\n\n  let phrase = new Phrase(string);\n\n  let palindromeResult\
  \ = document.querySelector(\"#palindromeResult\");\n\n  if (phrase.palindrome())\
  \ {\n    palindromeResult.innerHTML = `\"${phrase.content}\" is a palindrome!`;\n\
  \  } else {\n    palindromeResult.innerHTML = `\"${phrase.content}\" is not a palindrome.`;\n\
  \  }\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", function() {\n\n  let\
  \ button = document.querySelector(\"#palindromeTester\");\n\n  button.addEventListener(\"\
  click\", function() {\n\n    palindromeTester();\n\n  });\n\n});\n```\n\n\n\n\n\
  作为最后的收尾，在本节中，我们将之前章节中使用的 `prompt` 替换为更自然的 `HTML 表单`。虽然通用的表单处理通常需要在服务器上有一个后端 Web\
  \ 应用程序（例如由 Sinatra ([`www.learnenough.com/ruby`](https://www.learnenough.com/ruby))\
  \ 或 Rails ([`www.railstutorial.org/`](https://www.railstutorial.org/)) 提供的），但我们可以通过在\
  \ JavaScript 中添加事件监听器来拦截产生的 `\"submit\"` 事件来模拟它。\n\n第一步是将 `button` 标签（Listing 9.12）封装在表单中：\n\
  \n```\n<form id=\"palindromeTester\">\n\n  <textarea name=\"phrase\" rows=\"10\"\
  \ cols=\"30\"></textarea>\n\n  <br>\n\n  <button type=\"submit\">Is it a palindrome?</button>\n\
  \n</form> \n```\n\n在这里，我们将 CSS `id` 转移到了 `form` 标签本身，并引入了 HTML `textarea` 标签（10\
  \ 行高、30 列宽），同时将 `button` 标识为类型 `\"submit\"`。同样注意，`textarea` 有一个 `name` 属性（值为 `\"\
  phrase\"`）；这在稍后会变得重要。\n\n将表单放在我们的回文页面上，会生成如 Listing 9.14 所示的代码。结果出现在 Figure 9.13\
  \ 中。\n\n![images](img/09fig13.jpg)\n**Figure 9.13:** 带有精美表单的回文页面。\n\n**Listing 9.14:**\
  \ 在回文页面上添加表单。\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Palindrome\
  \ Tester</title>\n    <meta charset=\"utf-8\">\n    <script src=\"bundle.js\"></script>\n\
  \  </head>\n  <body>\n    <h1>Palindrome Tester</h1>\n    <form id=\"palindromeTester\"\
  >\n      <textarea name=\"phrase\" rows=\"10\" cols=\"30\"></textarea>\n      <br>\n\
  \      <button type=\"submit\">Is it a palindrome?</button>\n    </form>\n    <h2>Result</h2>\n\
  \    <p id=\"palindromeResult\"></p>\n  </body>\n</html>\n```\n\n由于我们更改了事件类型，我们需要更新监听器，将其从\
  \ `\"click\"` 更改为 `\"submit\"`：\n\n```javascript\ndocument.addEventListener(\"DOMContentLoaded\"\
  , function() {\n\n  let tester = document.querySelector(\"#palindromeTester\");\n\
  \n  tester.addEventListener(\"submit\", function(event) {\n    palindromeTester(event);\n\
  \n  });\n\n});\n```\n\n注意，我们在调用 `palindromeTester` 时在函数参数中添加了 `event` 参数；更多内容稍后会介绍。然后，在\
  \ `palindromeTester` 方法中，我们必须做两处更改。第一个涉及防止表单的默认行为，即是将信息提交回服务器。由于我们的“服务器”只是一个静态页面，我们无法处理此类提交，因此我们需要阻止这一默认行为：\n\
  \n```javascript\nfunction palindromeTester(event) {\n  event.preventDefault();\n\
  }\n```\n\n在这里，`event` 是 JavaScript 专门为此类情况提供的特殊对象。第二个更改是，不再从 `prompt` 获取短字符串，而是直接从表单提交中获取。这就是表单中\
  \ `textarea` 的 `name` 属性（Listing 9.14）发挥作用：我们可以从 `event` 的 `target` 获取短语。在这种情况下，`event.target`\
  \ 只是 `form` 对象，所以 `event.target` 就是表单本身。此外，由于表单 `textarea` 中存在 `name=\"phrase\"\
  ` 键值对，`event.target` 拥有一个 `value` 为提交字符串的属性。换句话说，如果我们输入了例如“Madam, I’m Adam.”，我们可以这样提取值：\n\
  \n```javascript\nevent.target.phrase // 结果为 \"Madam, I'm Adam.\"\n```\n\n将此应用于 `palindromeTester`\
  \ 函数并结合新的监听器，将得到 Listing 9.15 所示的结果。顺便说一下，在 `function(event)` 中包含 `event` 在某些系统上并不是必要的，但为了最大的浏览器兼容性，应该包含。\n\
  \n**Listing 9.15:** 在 JavaScript 中处理表单提交。\n\n```javascript\nlet Phrase = require(\"\
  ./username-palindrome\");\n\nfunction palindromeTester(event) {\n  event.preventDefault();\n\
  \  let phrase = new Phrase(event.target.phrase.value);\n  let palindromeResult =\
  \ document.querySelector(\"#palindromeResult\"); \n\n  if (phrase.palindrome())\
  \ {\n    palindromeResult.innerHTML = `${phrase.content} is a palindrome!`;\n  }\
  \ else {\n    palindromeResult.innerHTML = `${phrase.content} is not a palindrome.`;\n\
  \  }\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", function() {\n  let tester\
  \ = document.querySelector(\"#palindromeTester\");\n\n  tester.addEventListener(\"\
  submit\", function(event) {\n     palindromeTester(event);\n  });\n\n});\n```\n\n\
  重新运行 Listing 9.2，刷新并在 `textarea` 中填充我最喜欢的超长回文句之一（Figure 9.14），将得到 Figure 9.15 所示的结果。Figure\
  \ 9.14 中惊人的回文句是由计算机科学家 Guy Steele 在 1983 年在程序的帮助下创建的。\n\n![images](img/09fig14.jpg)\n\
  **Figure 9.14:** 在表单文本框中输入长字符串。\n\n![images](img/09fig15.jpg)\n**Figure 9.15:**\
  \ 那个长字符串是一个回文！\n\n随着“A man, a plan, a canoe, pasta, heros, rajahs, a coloratura,\
  \ maps, snipe, percale, macaroni, a gag, a banana bag, a tan, a tag, a banana bag\
  \ again (or a camel), a crepe, pins, Spam, a rut, a Rolo, cash, a jar, sore hats,\
  \ a peon, a canal— Panama!”——我们的 JavaScript 回文检测器 Web 版完成了。\n\n### 9.4.1 练习\n\n\
  1. 通过提交空表单确认空字符串目前被视为回文（Figure 9.16）。这在空洞意义上是正确的，但可能不是我们想要的行为。\n2. 要解决此问题，遵循 Box\
  \ 8.2 中概述的步骤，编写一个断言空字符串不是回文的 RED 测试（Listing 9.16），然后确认测试通过。\n3. 使用 Box 8.1 中的指南增加版本号，按照\
  \ 第 8.5.1 节 发布新模块，然后使用 `npm update` 命令更新它（Listing 9.18）。您的应用程序正确识别 `\"\"` 不是回文了吗（Figure\
  \ 9.17）？*提示*：不要忘记重新运行 Listing 9.2。）\n\n\n\n\n**Listing 9.18:** 更新 NPM 模块。\n\n```\n\
  $ npm update <username>-palindrome\n```\n\n# 第 10 章 使用 Node.js 编写 Shell 脚本\n\n在本章中，我们将回到命令行世界，使用\
  \ Node.js 编写三个复杂度逐渐递增的`shell scripts`。这种对 JavaScript 的用法目前比在浏览器中使用 JavaScript 要少，但预计随着\
  \ JavaScript（特别是通过 `Node` 和 `NPM`）继续扩展其最初的 Web 编程领域，这种用法将会增长。这些程序也为用传统上被认为是“脚本语言”的语言（如\
  \ Perl、Python 和 Ruby）编写的类似程序提供了有用的基础。\n\n也许令人惊讶的是，在此过程中发现，在第 9 章中开发的 DOM 操作技巧在 shell\
  \ 脚本中仍然有用。事实上，我们将大幅扩展能力，其方向恰好是第 11 章中用到的更高级操作所需的。\n\n第一个程序（第 10.1 节）展示了如何使用 JavaScript\
  \ 从文件系统读取并处理文件内容。第 10.2 节中的程序随后展示了如何实现读取 URL 内容类似的功能。（这对我来说很有意义，因为我清楚地记得第一次编写自动化程序从\
  \ Web 读取并处理文本时，那在当时看起来简直是奇迹。）最后，在第 10.3 节中，我们将编写一个我曾为自己编写的程序改编而来的真实实用程序；它包含了对 Web\
  \ 浏览器之外背景下的 DOM 操作的介绍（上文已提及）。\n\n## 10.1 从文件中读取\n\n我们的第一个任务是读取并处理文件内容。该示例在设计上很简单，但它演示了必要的原理，并为你提供了阅读更高级文档所需的背景。\n\
  \n我们将首先使用 `curl` 下载一个包含简单短语的文件（注意，这应该位于我们在第 8 章），并在 Google 上搜索了“node open file”。（为什么不搜“javascript\
  \ open file”呢？那可能有效，但我怀疑——事实证明我是对的——JavaScript 以浏览器为中心的起源使得“node”成为一个更有前景的搜索词。）这次搜索很快就找到了文件系统模块\
  \ `fs`，它恰好解决了我们面临的问题：\n\n```\n$ npm install --global fs\n```\n\n文件系统的文档可能让人无从下手，因此我又深入研究了一下，找到了文章使用\
  \ Node.js 读取文件)，它描述了我们问题的准确解决方案。根据我们当前的文件名和编程规范（例如用 `let` 代替 `var`，使用双引号），它在 REPL\
  \ 中看起来如下：\n\n```\n> let fs = require(\"fs\");\n\n> let text = fs.readFileSync(\"\
  phrases.txt\", \"utf-8\");\n```\n\n在这里，我们选择了 `readFile` 函数的“Sync”（同步）版本，主要是因为我们没有需要同时运行多个此类程序（那是“异步”的用处）。我们还（遵循博客文章）添加了第二个参数来指示源是\
  \ UTF-8，这是在*Learn Enough HTML to Be Dangerous*（[`www.learnenough.com/html`](https://www.learnenough.com/html））中讨论过的\
  \ Unicode 字符集（[https://www.learnenough.com/htmltutorial/html_intro#sec-an_html_skeleton](https://www.learnenough.com/htmltutorial/html_intro#sec-an_html_skeleton)）。\n\
  \n运行这段代码的结果是将文本文件的完整内容加载到 `text` 变量中：\n\n```\n> text.length;\n\n1373\n\n> text.split(\"\
  \\n\")[0];     // 按换行符分割并提取第一个短语。\n\n'A butt tuba'\n```\n\n这里的第二个命令按换行符 `\\n` 分割文本并选择索引零的元素，揭示了文件中神秘的第一行，“A\
  \ butt tuba”。\n\n让我们把 REPL 中的想法放入脚本中：\n\n```\n$ touch palindrome_file\n\n$ chmod\
  \ +x palindrome_file\n```\n\n脚本本身非常简单：我们只需打开文件，按换行符分割内容，并遍历生成的数组，打印任何是回文的行。\n\n\n\
  \n在本节中，我们将编写一个脚本，其效果与第 10.1 节中的相同，不同之处在于直接从公网 URL 读取 `phrases.txt` 文件。程序本身并没有做任何花哨的操作，但请意识到这是多么奇迹：这些想法并不特定于我们正在访问的\
  \ URL，这意味着在学习完本节后，你将能够编写程序来访问和处理 Web 上的几乎任何公共网站。（这种做法有时被称为“网络爬虫”，在进行时应经过充分考虑并保持谨慎。）\n\
  \n与第 10.1 节 一样，安装 NPM 模块是必要的先决条件。正如 NPM 模块通常的情况，有多种不同的方法可以完成相同的任务。根据对“node read\
  \ web page url”以及 `request` 的替代方案列表”^(2) 的网络搜索结果，我们将使用 `urllib` 模块，我们可以按照以下方式安装它：^(3)\n\
  \n2。本教程的原始版本使用了 `request`，但它已被废弃。\n\n3。出于某些我不太理解的原因，`urllib` 模块的全局安装不起作用（至少在我的系统上是这样），所以我们在这里本地安装。\n\
  \n```\n$ npm install urllib\n```\n\n然后我们就可以像第 10.1 节那样创建我们的脚本：\n\n```\n$ touch palindrome_url\n\
  \n$ chmod +x palindrome_url\n```\n\n查阅 `urllib` 文档 ([`www.npmjs.com/package/urllib`](https://www.npmjs.com/package/urllib))，我们发现了（截至本书时）列表\
  \ 10.2 中的示例代码。\n\n**列表 10.2：** 读取 URL 内容的示例代码。\n\n```\nvar urllib = require('urllib');\n\
  \nurllib.request('http://cnodejs.org/', function (err, data, res) {\n\n  if (err)\
  \ {\n    throw err; // 你需要处理错误\n  }\n\n  console.log(res.statusCode);\n\n  console.log(res.headers);\n\
  \n  // data 是 Buffer 实例\n\n  console.log(data.toString());\n\n});\n```\n\n基于列表 10.2\
  \ 这样的代码示例进行引导是一项很好的实践。事实上，在每个阶段实际执行代码并不是一个坏主意，但为了简洁起见，我将在脚本完成之前省略输出。\n\n我们可以通过更新约定（例如使用\
  \ `let` 代替 `var`）、使用更具描述性的名称以及删除我们确定不需要的行来根据我们的目的修改默认代码：\n\n```\nlet urllib = require(\"\
  urllib\");\n\nurllib.request(\"http://www.cnodejs.org/\", function(error, data,\
  \ response) {\n\n  console.log('body:', data.toString());\n\n});\n```\n\n我们开始看到解决方案的雏形。`urllib`\
  \ 模块为给定的 URL 开启网络请求，并接受一个带有三个参数的函数：一个错误（如果有）、一个包含页面主体的数据对象（它是*完整*页面，不要与 HTML `body`\
  \ 标签混淆）以及一个响应对象。\n\n此时需要强调的是，*我并不清楚这些对象具体是什么*，所以你也不需要清楚。我知道的——也就是从列表 10.2 的示例代码中合理推断出的——是\
  \ `data.toString()` 是一个可以替代列表 10.1 中 `text` 的字符串。（回想一下，我们在第 4.1.2 节中见过对数字应用 `toString()`\
  \ 方法。）这已经足够解决我们的问题了，因为这意味着我们可以将列表 10.2 中的 cnodejs.org URL 替换为 `phrases.txt` 的 URL，并将\n\
  \n```\nconsole.log('body:', data.toString());\n```\n\n替换为列表 10.1 中的回文检测逻辑。\n\n最后还有一个细微之处，即\
  \ `phrases.txt` 的 URL 实际上是一个*重定向*：如果你访问[`cdn.learnenough.com/phrases.txt`](https://cdn.learnenough.com/phrases.txt)，你会发现它实际上*跳转*（使用\
  \ 301 重定向）到 Amazon Simple Storage Service（S3）上的一个页面，如图 10.2 所示。\n\n![images](img/10fig02.jpg)\n\
  \n**图 10.2：** 访问短 URL。\n\n某些 URL 库默认遵循重定向，但 `urllib` 不，因此我们必须在 `urllib` 文档中添加 `followRedirect`\
  \ 选项 ([`www.npmjs.com/package/urllib`](https://www.npmjs.com/package/urllib))：\n\
  \n```\nurllib.request(url, { followRedirect: true }, function(error, data, response)\
  \ {\n```\n\n将 `followRedirect` 选项设置为 `true` 后，`urllib` 将如图 10.2 所示所示遵循 301 重定向。\n\
  \n**列表 10.3：** 一个 URL 读取脚本。\n\n```\n#!/usr/bin/node\n\nlet urllib = require(\"urllib\"\
  );\n\nlet Phrase = require(\"./palindrome\");\n\nlet url = 'https://cdn.learnenough.com/phrases.txt';\n\
  \nurllib.request(url, { followRedirect: true }, function(error, data, response)\
  \ {\n\n  let body = data.toString();\n\n  body.split(\"\\n\").forEach(function(line)\
  \ {\n    let phrase = Phrase(line);\n\n    if (phrase) {\n      console.log(\"palindrome\
  \ detected:\", line);\n    }\n  });\n\n});\n```\n\n此时，我们准备好在命令行中尝试该脚本：\n\n```\n\
  $ ./palindrome_url\n```\n\n```\npalindrome detected: Anna\npalindrome detected:\
  \ Bob\npalindrome detected: Civic\npalindrome detected: Did\npalindrome detected:\
  \ Eve\npalindrome detected: Hannah\npalindrome detected: Eye\npalindrome detected:\
  \ Kay\npalindrome detected: Level\npalindrome detected: Madam\npalindrome detected:\
  \ Mom\npalindrome detected: Noon\npalindrome detected: Nan\npalindrome detected:\
  \ Otto\npalindrome detected:ed\npalindrome detected: Race\npalindrome detected:\
  \ Renner\npalindrome detected: Tenet\npalindrome detected: Wow\npalindrome detected:\
  \ Go, banana boy!\n```\n\n\n\n太棒了！结果与我们在第 10.1 节中看到的相同，但这次我们是从网上获取的数据。\n\n### 10.2\
  \ 练习\n\n1\\. 通常需要一个独立的变量来存储你选择的项（在本例中，是回文）。使用第 6.2 节中讨论的 `filter` 方法，创建一个包含回文数组的\
  \ `palindromes` 变量，如列表 10.4 所示。其输出与列表 10.3 的输出相同吗？\n\n**列表 10.4：** 用函数方式读取 URL。\n\
  \n```\n#!/usr/bin/node\n\nlet urllib = require(\"urllib\");\n\nlet Phrase = require(\"\
  <username>-palindrome\");\n\nlet url = 'https://cdn.learnenough.com/phrases.txt';\n\
  \nurllib.request(url, { followRedirect: true }, function(error, data, response)\
  \ {\n\n  let body = data.toString();\n\n  let lines = body.split(\"\\n\");\n\n \
  \ let palindromes = lines.filter(line => /* FILL IN */);\n\n  palindromes.forEach(function(palindrome)\
  \ {\n\n    console.log(\"palindrome detected:\", palindrome);\n\n  });\n\n});\n\
  ```\n\n## 10.3 命令行中的 DOM 操作\n\n在最后一节中，我们将充分利用第 10.2 节中学学的 URL 读取技巧，编写一个我曾为自己编写的实际实用脚本的版本。首先，我将解释该脚本出现的背景以及它解决的问题。\n\
  \n\n\n\n\n近年来，学习外语言的资源爆炸式增长，包括 Duolingo、Google 翻译以及操作系统对多语言文本转语音（TTS）的支持。几年前，我决定利用这个机会温习一下我高中和大学的西班牙语。\n\
  \n我发现自己经常使用的资源之一是维基百科，因为它拥有海量的非英语语言文章。特别是，我发现从西班牙语维基百科（图 10.3）复制文本并将其到 Google 翻译（图\
  \ 10.4）非常有用。那时我可以使用 Google 翻译（图 10.4 中的红色方块）或 macOS 的文本转语音功能来听西班牙语发音，同时对照原始语言或译文。Es\
  \ muy útil。\n\n![images](img/10fig03.jpg)\n\n**图 10.3:** 一篇关于 JavaScript 的文章。\n\n\
  ![images](img/10fig04.jpg)\n\n**图 10.4:** 拖入 Google 翻译的关于 JavaScript 的文章。\n\n过了一段时间，我注意到两个持续存在的摩擦点：\n\
  \n-   手动复制大量段落非常繁琐。\n-   手动复制文本往往会选中我不需要的内容，特别是 `reference numbers`（引用数字），TTS 系统会如实地读出它们，导致句子中间出现随机数字（例如，“Se\
  \ define como orientado a objetos, 3 [tres] basado en prototipos” = “It’s defined\
  \ as object-oriented, 3 [three] based on prototypes.”¿Qué pasó?）。\n\n这种摩擦启发了许多实用脚本，于是\
  \ `wikp`（“维基百科段落”）诞生了，这是一个下载维基百科文章的 HTML 源码、提取段落并消除引用数字，并将所有结果输出到屏幕的程序。\n\n原始的 `wikp`\
  \ 程序是用 Ruby 写的，但用 JavaScript 写同样简单（甚至可以说更简单）。我们已经从 列表 10.3 知道如何下载源码。剩余的任务是：\n\n\
  1.  在命令行接收一个任意的 URL 参数。\n2.  像处理普通 DOM 一样（第 9.3 节）处理下载的 HTML。\n3.  移除引用。\n4.  输出段落。\n\
  \n我想强调的是，当我开始编写本教程时，*我无法用 JavaScript 完成这些任何一件事*。所以，这一节不仅仅是教你如何做它们，而是教你如何独立地解决这类问题——换句话说，就是经典的技术磨练。\n\
  \n让我们从创建初始脚本开始：\n\n```\n$ touch wikp\n\n$ chmod +x wikp\n```\n\n现在我们准备好开始编写主程序了。对于上面的每个任务，我将包含你可能会用来研究如何操作的\
  \ Google 搜索词。\n\n首先，我们将 URL 作为命令行参数输入（javascript node command line arguments），如\
  \ 列表 10.5 所示。注意，我们包含了一行 `console.log`，作为跟踪我们进度的临时方法。\n\n**列表 10.5:** 接收命令行参数。\n\n\
  `wikp`\n\n```javascript\n#!/usr/local/bin/node\n\n// 从维基百科链接返回返回的段落，并去除引用数字。\n\n\
  let urllib = require(\"urllib\");\n\nlet url = process.argv[2];\n\nconsole.log(url);\n\
  ```\n\n我们可以确认 列表 10.5 正如广告所示工作：\n\n```\n$ ./wikp https://es.wikipedia.org/wiki/JavaScript\n\
  \nhttps://es.wikipedia.org/wiki/JavaScript\n```\n\n接下来，我们需要学习如何用 Node 解析 HTML（node\
  \ parse html），这有几种可能性。与我们已有知识衔接得最好的是 JSDOM：\n\n```\n$ npm install jsdom\n```\n\n\
  将 JSDOM 添加到我们的脚本中得到了 列表 10.6。\n\n**列表 10.6:** 添加 JSDOM。\n\n`wikp`\n\n```javascript\n\
  #!/usr/local/bin/node\n\n// 从维基百科链接返回返回的段落，并去除引用数字。\n\nlet urllib = require(\"urllib\"\
  );\n\nlet url = process.argv[2];\n\nconst jsdom = require(\"jsdom\");\n\nconst {\
  \ JSDOM } = jsdom;\n```\n\n为什么 列表 10.5 有这个看起来奇怪的赋值？\n\n```javascript\nconst { JSDOM\
  \ } = jsdom;\n```\n\n答案是，我并不清楚；我是直接从 JSDOM 文档复制并粘贴的代码（[`github.com/jsdom/jsdom#basic-usage`](https://github.com/jsdom/jsdom#basic-usage)）。这是每位开发者的必备技能（图\
  \ 10.5）。^(4)\n\n4\n\n![images](img/placeholder.jpg)\n\n**图 10.5:** 他们不使用。\n\n![images](img/10fig06.jpg)\n\
  \n**图 10.6:** 在网页检查器中查看引用。\n\n\n\n\n\n```\n#!/usr/local/bin/node\n\n// Returns the\
  \ paragraphs from a Wikipedia link, stripped of reference numbers.\n\nlet urllib\
  \ = require(\"urllib\");\n\nlet url = process.argv[2];\n\nconst jsdom = require(\"\
  jsdom\");\n\nconst { JSDOM } = jsdom;\n\nurllib.request(url, { followRedirect: true\
  \ }, function(error, data, response) {\n\n  let body = data.toString();\n\n  //\
  \ Simulate a Document Object Model.\n\n  let { document } = (new JSDOM(body)).window;\n\
  \n  // Grab all the paragraphs and references.\n\n  let paragraphs =document.querySelectorAll(\"\
  p\");\n\n  let references = document.querySelectorAll(\".reference\");\n\n});\n\
  ```\n\n到此为止，我们几乎已经完成了。我们只需要移除引用，然后打印每个段落的内容。第一个任务很简单，因为有一个原生的 `remove` 方法可以移除 HTML\
  \ “节点”（文档对象模型树中的一个元素；javascript dom 移除元素）：\n\n```\nreferences.forEach(function(reference)\
  \ {\n\n  reference.remove();\n});\n```\n\n请注意，这涉及到假设 `references` 是一个可以使用 `forEach`\
  \ 进行迭代的集合，这在目前应该已经在你的技术能力范围之内。（从技术上讲，`querySelectorAll` 返回的不是数组，而是一个“NodeList”。尽管如此，该对象仍然可以使用\
  \ `forEach` 进行遍历。）\n\n一旦知道每个元素都有一个 `textContent` 属性（javascript dom 元素打印内容），第二个任务也很简单：\n\
  \n```\nparagraphs.forEach(function(paragraph) {\n\n  console.log(paragraph.textContent);\n\
  });\n```\n\n将所有内容整合在一起，就得到了列表 10.9 所示的 `wikp` 脚本。\n\n**列表 10.9：** 最终的维基百科段落脚本。\n\
  \n`wikp`\n\n```\n#!/usr/local/bin/node\n\n// Returns the paragraphs from a Wikipedia\
  \ link, stripped of reference numbers.\n\nlet urllib = require(\"urllib\");\n\n\
  let url = process.argv[2]; \n\nconst jsdom = require(\"jsdom\");\n\nconst { JSDOM\
  \ } = jsdom; \n\nurllib.request(url, { followRedirect: true }, function(error, data,\
  \ response) {\n\n  let body = data.toString();\n\n  // Simulate a Document Object\
  \ Model.\n\n  let { document } = (new JSDOM(body)).window;\n\n  // Grab all the\
  \ paragraphs and references.\n\n  let paragraphs = document.querySelectorAll(\"\
  p\");\n\n  let references = document.querySelectorAll(\".reference\");\n\n  // Remove\
  \ any references.\n\n  references.forEach(function(reference) {\n\n    reference.remove();\n\
  \n  });\n\n  // Print out all of the paragraphs.\n\n  paragraphs.forEach(function(paragraph)\
  \ {\n\n    console.log(paragraph.textContent);\n\n  });\n\n});\n```\n\n让我们看看结果如何：\n\
  \n```\n$ ./wikp https://es.wikipedia.org/wiki/JavaScript\n\n.\n\n.\n\n.\n\nExisten\
  \ algunas herramientas de ayuda a la depuración, también escritas en\n\nJavaScript\
  \ y construidas para ejecutarse en la Web. Un ejemplo es el programa\n\nJSLint,\
  \ desarrollado por Douglas Crockford, quien ha escrito extensamente\n\nsobre el\
  \ lenguaje. JSLint analiza el código JavaScript para que este quede\n\nconforme\
  \ con un conjunto de normas y directrices y que aseguran su correcto\n\nfuncionamiento\
  \ y mantenibilidad.\n```\n\n成功！通过在终端中向上滚动，我们现在可以选择所有文本并将其粘贴到 Google 翻译或我们选择的文本编辑器中。在\
  \ macOS 上，我们可以通过管道（[`www.learnenough.com/command-line-tutorial/inspecting_files#sec-wordcount_and_pipes`](https://www.learnenough.com/command-line-tutorial/inspecting_files#sec-wordcount_and_pipes)）将结果传递给\
  \ `pbcopy`，它会自动结果复制到 macOS 剪贴板（也称为“clipboard”）：\n\n```\n$ ./wikp https://es.wikipedia.org/wiki/JavaScript\
  \ | pbcopy\n```\n\n此时，粘贴到 Google 翻译（或其他任何地方）将粘贴完整文本^(5)\n\n5。Google 翻译对一次翻译的文本量有限制，但对于语音转文本的目的，你始终将其粘贴到文字处理器中，然后使用操作系统的原生\
  \ TTS 功能。\n\n想想这项成就是多么了不起。列表 10.9 中的脚本有点复杂——要完全靠自己运行这样一个程序，可能在过程中需要编写不少 `console.log`\
  \ 语句——但这并不是什么航天科技。然而，它确实非常有用，这种东西（如果你活跃于外语学习）你可能会经常使用。此外，其中涉及的基本技能——不仅包括编程，还包括技术熟练度（<咳>Google\
  \ 搜索</咳>）——开启了大量的潜在应用。\n\n### 10.3.1 练习题\n\n1. 通过移动文件或更改你的系统配置，将 `wikp` 脚本添加到环境的\
  \ PATH 中。（你可能会发现这些步骤（[`www.learnenough.com/text-editor-tutorial/advanced_text_editing#sec-wordcount_and_pipes`](https://www.learnenough.com/text-editor-tutorial/advanced_text_editing#sec-wordcount_and_pipes)\
  \ *Learn Enough Text Editor*。）\n\n2. 如果在不带参数的情况下运行 `wikp` 会发生什么？\n\n3. 文中提到的“管道到\
  \ `pbcopy`”技巧仅适用于 macOS，但任何 Unix 兼容系统都可以将输出重定向到文件。\n\n\n\n\n\n**图 11.2:** 在 GitHub\
  \ 上分叉起始应用。\n\n下一步取决于你目前是否已经在 `<username>.github.io` 有一个 GitHub Pages 站点。如果你没有这样的仓库，可以相应地重命名你的应用（图\
  \ 11.3），之后它将自动在 URL `<username>.github.io` 下可用。\n\n![images](img/11fig03.jpg)\n\n\
  **图 11.3:** 重命名为默认的 GitHub Pages 名称。\n\n一旦你重命名了仓库，就可以使用 GitHub 提供的克隆 URL 将画廊应用克隆到本地系统（图\
  \ 11.4）：\n\n![images](img/11fig04.jpg)\n\n**图 11.4:** 在 GitHub 上获取克隆 URL。\n\n```\n\
  $ git clone <clone URL> <username>.github.io\n```\n\n如果你通过遵循 *Learn Enough CSS &\
  \ Layout to Be Dangerous* 已经在 `<username>.github.io` 拥有了一个仓库，你应该通过省略 `git clone`\
  \ 的第二个参数，将画廊应用（不重命名）克隆到默认目录：\n\n```\n$ git clone <clone URL>     # 如果你已经有了 <username>.github.io\
  \ 使用此命令\n```\n\n这将创建一个名为 `le_js_full` 的本地仓库，你可以将其作为复制所需文件的参考。特别是，你需要画廊的 `index.html`\
  \ 以及大、小图片：\n\n```\n# 仅在你已经拥有 <username>.github.io 时运行这些命令\n\n# 假设遵循了 Learn Enough\
  \ CSS & Layout to Be Dangerous。\n\n$ cd le_js_full/\n\n$ cp gallery/index.html /path/to/repo/<username>.github.io/gallery/\n\
  \n$ cp -r images/* /path/to/repo/<username>.github.io/images/\n```\n\n（如果你在 `<username>.github.io`\
  \ 已经有一个仓库，但该仓库不是遵循 *Learn Enough CSS & Layout to Be Dangerous* 的结果，我假设你已经具备足够的技术水平来自己解决问题。）\n\
  \n无论哪种情况，一旦应用组合完成后，你就可以使用 Jekyll 静态站点生成器运行它。*Learn Enough CSS & Layout to Be Dangerous*\
  \ 中的 Jekyll 设置说明 ([https://www.learnenough.com/cssand-layout-tutorial/struct-layout#sec-jekyll])\
  \ 解释了如果你的系统中尚未安装 Jekyll，该如何安装它。简短版本是是你首先需要安装 *Bundler*：\n\n```\n$ gem install bundler\
  \ -v 2.2.17\n```\n\n然后使用 `bundle` 命令安装仓库中包含的 `Gemfile` 里列出的 `jekyll` 宝石：\n\n```\n\
  $ bundle _2.2.17_ install\n```\n\n一旦安装了 Jekyll，你就可以使用 Bundler 执行正确版本的 `jekyll` 程序来启动示例网站：\n\
  \n```\n$ bundle exec jekyll serve\n```\n\n此时，应用将运行在 localhost:4000 上，并且看起来应该像 图\
  \ 11.5 所示。\n\n![images](img/11fig05.jpg)\n\n**图 11.5:** 我们的初始示例应用。\n\n### 11.1.1\
  \ 准备 JavaScript\n\n作为最后的准备工作，我们将为主画廊函数 `activateGallery` 添加一个存位（stub），我们将在本章的其余部分填充该函数。由于我们将使用原生\
  \ JavaScript 完成所有工作，因此不需要包含任何 Node 模块、运行 `browserify` 等。事实上，我们需要做的只是创建一个目录和 JavaScript\
  \ 文件：\n\n```\n$ mkdir js\n\n$ touch js.js\n```\n\n为了开始，我们将在 `js.js` 中添加一个初始警告（图\
  \ 11.1）：\n\n```javascript\nfunction activateGallery() {\n  alert(\"Hello from the\
  \ gallery!\");\n}\n```\n\n在文件的 head 部分，我们将使用 `src` 属性包含画廊 JavaScript，并添加一个事件监听器在\
  \ DOM 加载后自动运行画廊函数（图 11.2）。结果如图 11.2 所示：\n\n```html\n<head>\n  .\n  .\n  <link rel=\"\
  stylesheet\" href=\"/css/main.css\">\n\n  <script src=\"/js/gallery.js\"></script>\n\
  \n  <script>\n    document.addEventListener(\"DOMContentLoaded\",function() {\n\
  \      activateGallery();\n    });\n  </script>\n</head>\n```\n\n现在访问本地页面确认 JavaScript\
  \ 已正确加载（图 11.6）：\n\n![images](img/11fig06.jpg)\n\n**图 11.6:** 来自画廊的问！\n\n### 11.1.2\
  \ 练习\n\n将你的存位画廊部署到 GitHub Pages 并确认其运行。\n\n## 11.2 修改画廊\n\n看看现状。画廊页面有三列：缩略图、主图和描述。如图\
  \ 11.7 所示，在默认状态下，缩略图与主图不匹配，描述也是如此。\n\n![images](img/11fig07.jpg)\n\n**图 11.7:**\
  \ 画廊。\n\n我们可以通过查看 HTML 来发现这种不匹配的根源，它显示如列表 11.3 所示：\n\n**列表 11.3:** 画廊。\n\n`gallery/index.html`\n\
  \n\n\n\n\n正如第 10.3 节中简要提到的，从技术上讲，`querySelectorAll` 的结果是一个“NodeList”对象而不是数组，但为了迭代的目的，我们可以将其视为数组。具体来说，我们可以使用\
  \ `forEach` 方法遍历它的元素。\n\n```\nlet thumbnails = document.querySelector(\"#gallery-thumbs\"\
  ).\n                          querySelectorAll(\"img\");\n```\n\n请注意，JavaScript\
  \ 允许我们跨行编写方法调用，以使结构更清晰并避免打破 80 字符的限制（Box 2.3）。\n\n通过遍历 `thumbnails` 集合，我们可以像下面的代码一样为每个元素添加事件监听器：\n\
  \n```\nthumbnails.forEach(function(thumbnail) {\n\n  thumbnail.addEventListener(\"\
  click\", function() {\n\n    // 将点击的图像设置为主图的代码\n\n  });\n\n});\n```\n\n这安排了监听我们在代码列表\
  \ 9.13 中看到的同一个“click”事件。\n\n正如代码示例中间的 JavaScript 注释所示，监听器的主体应该将点击的图像设置为主图。我们将采取的方法是将当前显示图像的\
  \ `src` 属性设置为被点击图像的“大”版本。参考代码列表 11.3，我们看到主图位于 CSS id 为 `gallery-photo` 的 `div` 内部，因此我们可以通过链式调用\
  \ `querySelector` 来选择它：\n\n```\nlet mainImage = document.querySelector(\"#gallery-photo\"\
  ).\n                         querySelector(\"img\");\n```\n\n事实上，`querySelector`\
  \ 非常智能，可以让我们将其合并为单个命令：\n\n```\nlet mainImage = document.querySelector(\"#gallery-photo\
  \ img\");\n```\n\n值得注意的是，还有一种等效的替代表示法，使用角括号 `>` 来强调元素之间的嵌套关系（在这种情况下，一个 `img` 元素嵌套在\
  \ CSS id 为 `gallery-photo` 的元素内部）：\n\n```\nlet mainImage = document.querySelector(\"\
  #gallery-photo > img\");\n```\n\n我们将在第 11.2.1 节中配合 `querySelectorAll` 使用这种替代表示法。\n\
  \n一旦获取了主图，我们就可以使用 `setAttribute` 方法（javascript dom set attribute src）来更改其 `src`\
  \ 属性：\n\n```\nmainImage.setAttribute(\"src\", newImageSrc);\n```\n\n如果你一直在紧跟步骤，你现在已经意识到除了\
  \ `newImageSrc`（新图像的源）之外，我们需要的所有内容都已创建。幸运的是，示例应用程序已经安排在图像标签本身中编码了必要的路径。假设我们点击了太平洋日落图像，其\
  \ HTML 如下：\n\n```html\n<<div>\n  <img src=\"/images/small/sunset.jpg\" alt=\"sunset\"\
  \n       data-large-version=\"/images/large/sunset.jpg\"\n       data-title=\"Pacific\
  \ Sunset\"\n       data-description=\"A sunset over the Pacific Ocean.\">\n</div>\n\
  ```\n\n在像这样的标签中编码数据是非侵入式 JavaScript（unobtrusive JavaScript）的一个重要方面，这涉及到永远不要将 JavaScript\
  \ 放在 HTML 体内部。当在 HTML 标签上使用这些数据属性时，浏览器会自动创建一个特殊的 `dataset` 属性，其值与 HTML 源代码对应如下：\n\
  \n```\ndata-large-version -> thumbnail.dataset.largeVersion\ndata-title        \
  \ -> thumbnail.dataset.title\ndata-description   -> thumbnail.dataset.description\n\
  ```\n\n通常，HTML 元素 `object` 上的数据标签 `data-foo-bar-baz` 对应变量 `object.dataset.fooBarBaz`，最后的属性采用驼峰命名法（CamelCase）（图\
  \ 2.3）。\n\n现在我们有了将主图替换为点击图像所需的一切。如果你想自己尝试，这将是一个非常好的练习。照旧，如果你遇到问题，请使用调试控制台（Box 5.1）。答案出现在代码列表\
  \ 11.4 中。\n\n**列表 11.4：** 设置画库主图像。\n\n`js/gallery.js`\n\n```\n// 激活图像库。\n// 主要任务是为画库中的每个图像附加事件监听器\n\
  // 并在点击时做出相应响应。\nfunction activateGallery() {\n  let thumbnails = document.querySelector(\"\
  #gallery-thumbs\").\n                            querySelectorAll(\"img\");\n  let\
  \ mainImage = document.querySelector(\"#gallery-photo img\"); \n  thumbnails.forEach(function(thumbnail)\
  \ {\n    thumbnail.addEventListener(\"click\", function() {\n      // 将点击的图像设置为主图。\n\
  \      let newImageSrc = thumbnail.dataset.largeVersion;\n      mainImage.setAttribute(\"\
  src\", newImageSrc);\n    });\n  });\n}\n```\n\n除了更改 `src` 属性外，我们应该更改替换图像的 `alt`\
  \ 属性。添加这一细节留作练习（第 11.2.1 节）。\n\n### 11.2.1 练习\n\n1. 代码列表 11.4 中的代码交换了新图像的 `src`，但遗憾的是\
