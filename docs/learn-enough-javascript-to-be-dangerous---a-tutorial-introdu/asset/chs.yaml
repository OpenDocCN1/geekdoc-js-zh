  \n# 第 6 章 函数式编程\n\n在学习了如何在几种不同的环境下定义函数并应用它们之后，现在我们将通过学习*函数式编程*的基础将我们的编程提升到一个水平。这是一种强调函数——你猜得没错——的编程风格。这是一个具有挑战性的章节，你可能需要进行一些练习才能完全理解它（框\
  \ 6.1），但回报确实是非常丰厚的。\n\n**框 6.1：进行练习**\n\n在从武术、象棋到语言学习的各种语境下，实践者都会达到一个点，无论进行多少分析或反思都无法帮助他们进步——他们只需要进行更多的重复，或者说“练习”。\n\
  \n通过尝试某事、似懂非懂地（但可能并不完全），然后*再次做一遍*，你能获得多少进步是令人惊讶的。在像这样的教程语境下，有时这意味着重读某个特别棘手的章节或小节。有些人（包括我）甚至会重读整本书。\n\
  \n进行练习的一个重要方面是*悬起自我评判*——允许自己不要立刻就变好。（许多人——再次包括我——往往需要通过练习才能习惯于不需要立刻就变好。可以说这是练习的“元练习”。）\n\
  \n给自己放个假，进行你的练习，看着你的技术熟练度与日增长。\n\n函数式编程淡化了变异和副作用等内容，而是关注应用函数来处理和转换函数的参数。这个定义相当抽象，而且主题本身非常庞大，因此我们将通过关注函数式编程中常用的经典三剑客方法：`map`、`filter`\
  \ 和 `reduce`，让事情变得具体且易于管理。\n\n## 6.1 Map\n\n我们三剑客中的第一种是 `map`，它通过对数组中的每个元素应用相同的函数来工作。例如，为了将数字数组中的每个元素平方，我们可以对数组映射函数\
  \ `n * n`，如 REPL 所示：\n\n```javascript\n> [1, 2, 3, 4].map(function(n) { return n\
  \ * n; });\n\n[ 1, 4, 9, 16 ]\n```\n\n三剑客中的第二种是 `filter`，它通过创建一个仅包含通过测试元素的数组来工作。例如，从数组中获取偶数，如\
  \ REPL 所示：\n\n```javascript\n> [1, 2, 3, 4].filter(function(n) { return n % 2 ===\
  \ 0; });\n\n[ 2, 4 ]\n```\n\n三剑客最后的最后是 `reduce`，它用于将数组还原为单个值。例如，对数组中的数字求和，如 REPL\
  \ 所示：\n\n```javascript\n> [1, 2, 3, 4].reduce(function(acc, n) { return acc + n;\
  \ }, 0);\n\n10\n```\n\n通过这三种方法——`map`、`filter` 和 `reduce`，我们可以高效地执行大量的数组操作。让我们看看如何使用它们来解决问题。\n\
  \n### 6.1.1 生成 URL 字符串\n\n假设我们有一个名称数组，并想要创建一个 URL 字符串数组。为了这一点，我们需要：\n\n1. 将每个字符串转换为小写。\n\
  2. 根据一个或多个空白字符将每个字符串分割。\n3. 用连字符将单词连接起来。\n\n使用我们目前学到的技术，可以使用 `forEach` 循环来实现，但使用\
  \ `map` 会优雅得多。\n\n以下是我们如何使用 `map` 创建 URL 友好字符串数组：\n\n```javascript\nlet states =\
  \ [\"Kansas\", \"Nebraska\", \"North Dakota\", \"South Dakota\"];\n\nlet urls =\
  \ states.map(function(state) {\n  return state.toLowerCase().split(/\\s+/).join(\"\
  -\");\n});\n\nconsole.log(urls);\n```\n\n输出是 `['kansas', 'nebraska', 'north-dakota',\
  \ 'south-dakota']`。\n\n注意这比命令式的 `forEach` 循环简洁得多。`map` 方法为我们创建新数组，所以我们不需要手动创建一个空数组并向其中元素元素。现在，让我们看看如何使用\
  \ `filter` 获取数组中的长名称。\n\n```javascript\nlet states = [\"Kansas\", \"Nebraska\",\
  \ \"North Dakota\", \"South Dakota\"];\n\nlet longStates = states.filter(function(state)\
  \ {\n  return state.length > 10;\n});\n\nconsole.log(longStates);\n```\n\n输出是 `['North\
  \ Dakota', 'South Dakota']`。\n\n最后，让我们看看如何使用 `reduce` 来对数组中的所有数字求和。\n\n```javascript\n\
  let numbers = [1, 2, 3, 4];\n\nlet sum = numbers.reduce(function(acc, n) {\n  return\
  \ acc + n;\n}, 0);\n\nconsole.log(sum);\n```\n\n输出是 `10`。\n\n\n\n在这里，我们对数组执行了匿名函数的映射（Section\
  \ 5.4)），生成了每个元素的平方。在箭头函数表示法（Section 5.1.2）下，看起来更加整洁：\n\n```\n> [1, 2, 3, 4].map(\
  \ (n) => { return n * n; });\n\n[ 1, 4, 9, 16 ]\n```\n\n更棒的是，对于单参数这种非常常见的情况，JavaScript\
  \ 允许我们省略括号、大括号，甚至 `return` 关键字，从而得到了极其紧凑的代码：\n\n```\n> [1, 2, 3, 4].map(n => n *\
  \ n);\n\n[ 1, 4, 9, 16 ] \n```\n\n回到我们的主示例，我们可以将“小写后分割再连接”的转换视为单个操作，并使用 `map` 将该操作按顺序应用于数组中的每个元素。结果非常紧凑，可以轻松放入\
  \ REPL 中：\n\n```\n> let states = [\"Kansas\", \"Nebraska\", \"North Dakota\", \"\
  South Dakota\"];\n\n> states.map(state => state.toLowerCase().split(/\\s+/).join('-'));\n\
  \n[ 'kansas', 'nebraska', 'north-dakota', 'south-dakota' ] \n```\n\n将其粘贴到 `function.js`\
  \ 中，如 Listing 6.2 所示，我们可以看到它短了多少。\n\n**Listing 6.2:** 使用 `map` 添加一种函数式技巧。\n\n`functional.js`\n\
  \n```\nlet states = [\"Kansas\", \"Nebraska\", \"North Dakota\", \"South Dakota\"\
  ];\n\n// urls: 命令式版本\n\nfunction imperativeUrls(elements) {\n\n  let urls = [];\n\
  \n  elements.forEach(function(element) {\n\n    urls.push(element.toLowerCase().split(/\\\
