  \ BaDGer”是否包含字符串“dge”（从索引 1 开始）。\n8. 编写 JavaScript 代码来测试字符串“hoNeY BaDGer”是否包含字符串“badger”（从索引\
  \ 1 开始）。\n\n## 2.6 迭代\n\n循环是重复执行代码块的方式。在编程中，我们经常需要执行某些操作多次，例如，处理数组中的每个元素，或者遍历字符串中的每个字符。JavaScript\
  \ 提供了几种循环结构：`for` 循环、`while` 循环和 `do...while` 循环。\n\n### `for` 循环\n\n`for` 循环是最常用的循环结构，它允许你精确地控制循环的次数。它的语法如下：\n\
  \n```javascript\nfor (初始化; 条件; 迭代) {\n  // 循环体中的代码\n}\n```\n\n这个结构包含三个部分：\n1. **初始化**：在循环开始前执行一次。通常用于初始化计数器（例如\
  \ `let i = 0`）。\n2. **条件**：在每次循环开始前都会检查。如果为 `true`，则继续循环；如果为 `false`，则退出循环。\n3.\
  \ **迭代**：在每次循环执行后执行。通常用于更新计数器（例如 `i++`）。\n\n让我们看一个简单的例子：\n\n```javascript\nfor (let\
  \ i = 0; i < 5; i++) {\n  console.log(i);\n}\n```\n\n这段代码会输出 0, 1, 2, 3, 4。当 `i`\
  \ 增加到 5 时，条件 `i < 5` 为假，循环结束。\n\n### `while` 循环\n\n`while` 循环在条件为 `true` 时会一直执行代码块。它在你不知道循环需要执行多少次，但知道何时停止条件时非常有用。\n\
  \n```javascript\nwhile (条件) {\n  // 循环体中的代码\n}\n```\n\n例如：\n\n```javascript\nlet\
  \ count = 0;\nwhile (count < 5) {\n  console.log(count);\n  count++;\n}\n```\n\n\
  ### `do...while` 循环\n\n`do...while` 循环与 `while` 循环的区别在于，它会至少执行一次代码块，然后再检查条件。\n\n\
  ```javascript\ndo {\n  // 循环体中的代码\n} while (条件);\n```\n\n例如：\n\n```javascript\n\
  let i = 0;\ndo {\n  console.log(i);\n  i++;\n} while (i < 5);\n```\n\n### `break`\
  \ 和 `continue`\n\n这两个语句可以用来控制循环的流：\n- `break`：立即跳出整个循环。\n- `continue`：跳过当前迭代的剩余代码，直接进入下一次迭代。\n\
  \n例如：\n\n```javascript\nfor (let i = 0; i < 10; i++) {\n  if (i === 5) break; //\
  \ 当 i 等于 5 时停止循环\n  if (i === 2) continue; // 跳过 i 为 2 的情况\n  console.log(i);\n\
  }\n```\n\n这会输出 0, 1, 3, 4。\n\n\n\n\n\n如果你觉得 Listing 2.17 中的代码令人困惑或难看，你并不孤单。我认为良好编程的一个标志是尽可能*避免*使用\
  \ `for` 循环，而是优先使用 `forEach` 循环（第 5.4 节），或者通过函数式编程完全避免循环（第 6 章 和 第 8.5 节）。计算机科学家（也是我的朋友）Mike\
  \ Vanier (图 2.14) 曾在发给 Paul Graham 的邮件中写道：\n\n![images](img/02fig14.jpg)\n\n**图\
  \ 2.14：** 再写几个 `for` 循环，Mike Vanier 就能成为百万富翁。\n\n这种[枯燥的重复]久了会让你精疲力竭；如果我在 C 中每写一次\
  \ `for (i = 0; i < N; i++)` 就能得到一个美分，我已经是百万富翁了。\n\n注意 Mike 邮件中的 `for` 循环语法与 Listing\
  \ 2.17 中的几乎完全相同；唯一的区别在于缺少了 `let` 以及使用了 `N`，我们可以从上下文推断出它代表循环索引的某个上界。\n\n我们将从第 6 章开始学习如何避免这种精疲力竭的感觉，但目前\
  \ Listing 2.17 已经是我们所能做的。\n\n让我们结合 Listing 2.16 和 Listing 2.17 来遍历哈姆特著名独白第一行中的所有字符。我们唯一的新需求是循环停止时的索引。在\
  \ Listing 2.17 中，我们硬编码了上限（`i < 5`），如果我们想的话，在这里也可以这样做。不过，`soliloquy` 变量太长了，不方便手动计数，所以让\
  \ JavaScript 使用 `length` 属性告诉我们（第 2.4 节）：\n\n```\n> soliloquy.length\n\n42\n```\n\
  \n这个异常吉利的结果暗示编写这样的代码：\n\n```\nfor (let i = 0; i < 42; i++) {\n\n  console.log(soliloquy.charAt(i));\n\
  \n}\n```\n\n这段代码可以运行，而且与 Listing 2.17 完美对应，但它也提出了一个问题：既然我们可以在循环本身中使用 `length` 属性，为什么还要硬编码长度呢？\n\
  \n答案是我们不应该这样做，而且在循环时，尽可能使用 `length` 属性是常见做法。改进后的 `for` 循环（结果如下所示）出现在 Listing 2.18\
  \ 中。\n\n**Listing 2.18：** 结合 `charAt` 和 `for` 循环。\n\n```\n> for (let i = 0; i <\
  \ soliloquy.length; i++) {\n\n  console.log(soliloquy.charAt(i));\n\n}\n\nT\no\n\
  b\ne\n.\n.\n.\n.\nt\ni\no\nn\nn:\n```\n\n如上所述，如果可能，最好避免使用 `for` 循环，但这种不优雅的循环风格仍然是一个极佳的开始点。正如我们在第\
  \ 8 章中将看到的，一种强大的技术是为我们想要的功能编写一个*测试*，然后尽一切办法让它通过测试，最后*重构*代码以使用更优雅的方法。这个过程的第二步（称为*测试驱动开发*，或\
  \ TDD）通常涉及编写不优雅但易于理解的代码——这项任务我们擅长。\n\n### 3.1 练习题\n\n1. 将“A man, a plan, a canal,\
  \ Panama”按逗号分割后的结果赋值给 `a`。生成的数组有多少个元素？\n2. 你能猜出原地反转 `a` 的方法吗？\n\n## 3. 数组\n\n在第\
  \ 2 章中，我们看到字符串可以被视为字符序列。在本章中，我们将学习数组数据类型，它是存储任意元素的通用容器。我们将通过 `split` 方法将字符串与数组连接起来（第\
  \ 3.1 节）。\n\n### 分割\n\n到为止我们在字符串上花费了大量时间，但从这里可以看出 `split` 返回的是一个数组：\n\n```\n> \"\
  ant cat\".split(\" \");\n\n[ 'ant', 'cat' ]\n```\n\n我们可以对任何其他内容进行分割，分割是最常用的操作之一：\n\
  \n```\n> \"ant,bat,cat\".split(\",\");\n\n[ 'ant', 'bat', 'cat' ]\n\n> \"ant cat\"\
  .split(\" \");\n\n[ 'ant', 'bat', 'cat' ]\n```\n\n我们甚至可以对空字符串进行分割：\n\n```\n> \"\
  badger\".split(\"\")\n\n[ 'b', 'a', 'd', 'g', 'e', 'r' ]\n```\n\n最后，值得注意的是 `split`\
  \ 支持*正则表达式*，这将在第 4.3 节](#ch04.xhtml_43)中介绍。\n\n### 3.1 练习题\n\n1. 将“A man, a plan,\
  \ a canal, Panama”按逗号分割后的结果赋值给 `a`。\n2. 使用 `let` 定义 `a`。你能原地反转 `a` 吗？\n\n## 3.2\
  \ 数组访问\n\n通过 `split` 方法连接字符串与数组后，我们首先将字符数组赋值给变量：\n\n```\n> let a = \"badger\".split(\"\
  \");\n```\n\n我们可以使用方括号符号访问 `a` 的特定元素，这种符号在许多语言中都很常见，如 Listing 3.1。\n\n**Listing\
  \ 3.1：** 使用方括号访问数组。\n\n```\n> a[0];\n\n'b'\n\n> a[1];\n\n'a'\n\n> a[2];\n\n'd'\n\
  ```\n\nListing 3.1 看起来眼眼吗？它是我们在 Listing 2.16 中通过 `charAt` 方法看到的字符与数值索引之间的相同关系。（上句中的符号表示\
  \ `charAt` 是一个*实例方法*，即字符串实例的方法。）事实上，方括号符号可以直接作用于字符串：\n\n```\n> \"badger\"[0];\n\n\
  'b'\n\n> \"badger\"[1];\n\n'a'\n```\n\n我们从 Listing 3.1 中看到，与字符串一样，数组是*零偏移的*，这意味着“第一个”元素的索引为\
  \ `0`，“第二个”元素的索引为 `1`，以此此类推。这种约定可能会令人困惑，事实上，将零偏移数组的初始元素称为“零位”（zeroth）元素是为了提醒人们索引从\
  \ 0 开始。在使用多种语言（某些语言数组索引从 1 开始）时，这种约定也可能令人困惑，如 xkcd 漫画“Donald Knuth”([`m.xkcd.com/163/`](https://m.xkcd.com/163/))\
  \ 所示。^(1)\n\n1。这条特定的 xkcd 漫画取自著名的计算机科学家 Donald Knuth（读作“kuh-NOOTH”），他是《计算机程序设计》的作者，也是\
  \ TEX 排版系统的创建者，该系统被用于准备许多技术文档，包括本文。\n\n到为止我们处理的完全都是字符数组，但 JavaScript 数组可以包含各种类型的元素：\n\
  \n```\n> a = [\"badger\", 42, soliloquy.includes(\"To be\")];\n\n[ 'badger', 42,\
  \ true ]\n\n> a[2];\n\ntrue\n\n> a[3];\n\nundefined\n```\n\n\n\n\n我们从这里看到，中括号访问表示法对于混合类型的数组来说像往常一样工作，这并不令人意外。我们还看到，尝试访问定义范围之外的数组索引会返回\
  \ `undefined`（我们之前在 `console.log` 的上下文中见过这个值 (见图 2.4)）。如果你有之前的编程经验，这可能会让你感到惊讶，因为许多语言在尝试访问范围外元素时会抛出错误，但\
  \ JavaScript 在这方面更有包容性。\n\n### 3.2.1 练习题\n\n1. 写一个 `for` 循环，打印出通过空字符串对“honey badger”进行分割后得到的字符。\n\
  2. 看看你是否能猜出 `undefined` 在布尔语境下的值。使用 `!!` 来确认。\n\n## 3.3 数组切片 (Array Slicing)\n\n\
  除了支持第 3.2 节描述的括号表示，JavaScript 还支持一种名为数组切片（array slicing）的技术，用于一次访问多个元素。为了在第 3.4\
  \ 节学习排序做好准备，让我们重新定义数组 `a`，使其包含纯数字元素：\n\n```\n> a = [42, 8, 17, 99];\n\n[ 42, 8,\
  \ 17, 99 ]\n```\n\n切片数组最简单的方法是仅提供一个参数，它将返回从该索引开始的所有元素。例如，对于一个包含四个元素的数组，`slice(1)`\
  \ 返回第二个、第三和第四个元素（记住“第一个”或第 0 个元素的索引为 `0`）：\n\n```\n> a.slice(1);\n\n[ 8, 17, 99\
  \ ]\n```\n\n我们也可以从一个索引切片到另一个索引：\n\n```\n> a.slice(1, 3);\n\n[ 8, 17 ]\n```\n\n切片为我们提供了一种执行常用任务的简单方法，即访问数组的最后一个元素。数组像字符串一样，有一个\
  \ `length` 属性，所以我们可以这样找到最后一个元素：\n\n```\n> a.length;\n\n4\n\n> a[a.length-1];\n\n\
  99\n```\n\n不过，如果变量名很长，这可能会变得有点凌乱，这在有很多变量的大型项目中经常发生：\n\n```\n> let aMuchLongerArrayName\
  \ = a;\n\n> aMuchLongerArrayName[aMuchLongerArrayName.length - 1];\n\n99\n```\n\n\
  这引出了我们提取最后一个元素的第二方法，即使用带负数的 `slice`，它从末尾开始计数：\n\n```\n> aMuchLongerArrayName.slice(-1);\n\
  \n[ 99 ]\n```\n\n这是一个包含一个元素的数组，所以我们可以使用括号表示法选择该元素本身：\n\n```\n> aMuchLongerArrayName.slice(-1)[0];\n\
  \n99\n```\n\n最后一个常见的情况是，我们想要访问最后一个元素的同时将其删除。我们将在第 3.4.2 节中介绍实现此操作。\n\n### 3.3.1\
  \ 练习题\n\n1. 定义一个包含 1 到 10 数字的数组。使用切片和 `length` 选择从第 3 个到倒数第 3 个元素。\n2. 证明字符串也支持\
  \ `slice` 方法，通过从字符串 \"ant cat\" 中仅选择 `bat`。（你可能需要进行一些实验来获得正确的索引。）\n\n## 3.4 更多数组方法\n\
  \n除了第 3.3 节中看到的 `slice` 方法外，数组还响应丰富的其他方法。和往常一样，文档（https://developer.mozilla.org/en/docs/Web/Reference/Global_Objects/Array）是一个很好的参考地方。\n\
  \n正如字符串一样，数组响应 `includes` 方法来测试包含性：\n\n```\n> a = [\"ant\", \"bat\", \"cat\", 42];\n\
  [ 'ant', 'bat', 'cat', 42 ]\n\n> a.includes(42);\n\ntrue\n\n> a.includes(\"foo\"\
  );\n\nfalse\n```\n\n### 3.4.1 排序与反转\n\n你还可以对数组进行排序，使用 `sort()` 在地进行排序：\n\n```\n\
  > a.sort();\n\n[ 42, \"ant\", \"bat\", \"cat\" ]\n\n> a;\n```\n\n你可能会注意到这里奇怪的地方，`sort()`\
  \ 对元素的排序并不是根据它们的数值，而是按照“字母”顺序（这在第 5 节中会讨论）。另一个方法是 `reverse()`，由于 `reverse()` 会就地反转数组：\n\
  \n```\n> a.reverse();\n\n[ \"cat\", \"bat\", \"ant\", 42 ]\n\n> a;\n```\n\n### 3.4.2\
  \ 推入与弹出 (Push and Pop)\n\n一组实用的数组方法是 `push` 和 `pop`；`push` 允许向数组末尾添加元素，而 `pop` 则移除它（返回被移除的）：\n\
  \n```\n> a = [42, 8, 17, 99];\n\n> a.push(6);\n\n5\n\n> a;\n[ 42, 8, 17, 99, 6 ]\n\
  \n> a.pop();\n\n6\n\n> a;\n[ 42, 8, 17, 99 ]\n```\n\n正如注释所示，`pop` 返回被移除的元素，而 `push`（有点反直觉地）返回新数组的长度。\n\
  \n### 3.4.3 撤销分割 (Undoing a Split)\n\n数组方法的最后一个示例是 `join`。正如 `split` 将字符串分割为数组元素一样，`join`\
  \ 将数组元素合并为字符串（参见第 3.1 节）。\n\n**列表 3.2:** 不同的连接方式。\n\n```\n> a = [\"ant\", \"bat\"\
  , \"cat\", 42];\n\n[ 'ant', 'bat', 'cat', 42 ]\n\n> a.join(); // 默认连接（逗号）。\n\n'ant,bat,cat,42'\n\
  \n> a.join(\",  \"); // 逗号空格连接。\n\n'ant, bat, cat, 42'\n\n> a.join(\" -- \"); //\
  \ 双连字符连接。\n\n'ant -- bat -- cat -- 42'\n\n> a.join(\"\"); // 空字符串连接。\n\n'antbat42'\n\
  ```\n\n注意 `42` 是一个整数，在 join 中会被自动转换为字符串。\n\n### 3.4.4 练习题\n\n1. `split` 和 `join`\
  \ 方法几乎是逆操作，但并不完全。具体来说，使用 `==`（不是 `===`）确认列表 3.2 中的 `a.join(\" \").split(\" \")`\
  \ 不等于 `a`。为什么？\n2. 使用数组文档，弄清楚如何在数组的开头推入或弹出元素。*提示*名称完全不直观，所以你可能需要费一番。\n\n## 3.5 数组迭代\
  \ (Array Iteration)\n\n数组最常见的任务之一是遍历其元素并对每个元素执行操作。这听起来可能很熟悉，因为我们在第 2.6 节中用字符串解决过完全相同的问题，实际上解决方案也几乎相同。我们只需要将列表\
  \ 2.18 中的 `for` 循环适配到数组即可。\n\n\n\n我们可以相当容易地一步到达该目标，但如果我们先使用中括号访问符号重写字符串 `for` 循环，这种联系会变得更加清晰（正如我们在第\
  \ 3.2 节中看到的，这种方法也适用于字符串）。在列表 2.15 中定义的 `soliloquy` 字符串的结果显示在列表 3.3 中。\n\n**列表 3.3：**\
  \ 结合字符串访问与 `for` 循环。\n\n```\n> for (let i = 0; i < soliloquy.length; i++) {\n\n\
  \  console.log(soliloquy[i]);\n\n}\n\nT\no\nb\ne.\n.\n.\n.\nt\ni\no\nn\n:\n```\n\
  \n列表 3.3 中的结果与列表 2.18 中所示的完全相同。\n\n现在应该很清楚这种模式在数组上的应用了。我们只需要将 `soliloquy` 替换为 `a`，如列表\
  \ 3.4 所示；代码的其他部分完全相同。\n\n**列表 3.4：** 结合数组访问与 `for` 循环。\n\n```\n> for (let i = 0;\
  \ i < a.length; i++) {\n\n    console.log(a[i]);\n\n  }\n\nant\nbat\ncat\n42\n```\n\
  \n这里值得注意的一点是迭代索引变量 `i` 在两个 `for` 循环中都出现了。正如你可能记得的，如果你完成了第 2.2.2 节中的练习，重新定义已经用 `let`\
  \ 声明的变量通常会导致错误。为什么我们在这个语境下可以重用 `i` ？\n\n答案是，在 `for` 循环的语境下，变量的作用范围被限制在循环内部，并在循环结束时消失。\n\
  \n这很方便，但并不是遍历数组的最佳方法，而且 Mike Vanier 仍然不会高兴（图 3.1）。我们将在第 5.4 节中看到更简洁的数组遍历方法，并在第 6\
  \ 章中看到完全避免迭代的方法。\n\n![images](img/03fig01.jpg)\n\n**图 3.1：** Mike Vanier 仍然对输入 `for`\
  \ 循环感到恼恼。\n\n### 3.5.1 练习\n\n1. 显示标识符 `i` 在 `for` 循环执行之前之后都是未定义的。（你可能需要退出并重新进入 Node\
  \ 控制。）\n\n2. 定义一个累加变量 `total` 并将其与循环结合，加上列表 3.4 中的所有元素。你可以使用列表 3.5 中的代码作为开始（只需将注释替换为相应的代码）。`total`\
  \ 的值与 `a.join(\"\")` 相比如何？\n\n**列表 3.5：** 计算总和的骨架。\n\n```\n> let total = \"\";\n\
  \n> for (let i = 0; i < a.length; i++) {\n\n    // 将 total 设置为运行总和加上当前元素\n\n  }\n\
  ```\n\n## 第 4 章。其他原生对象\n\n现在我们已经查看了字符串和数组，我们将继续介绍其他重要的 JavaScript 对象：数学、日期、正则表达式和通用对象。\n\
  \n## 4.1 Math 和 Number\n\n和大多数编程语言一样，JavaScript 支持大量的数学运算：\n\n```\n> 1 + 1;\n\n\
  2\n\n> 2 - 3;\n\n-1\n\n> 2 * 3;\n\n6\n\n> 10/5;\n\n2 > 2/3;\n\n0.6666666666666666\n\
  ```\n\n注意这里的最后一个例子并不是精确的；它是一个浮点数（也称为 float），计算机无法精确表示。但事实上 JavaScript 只有一种数值类型，即使是像\
  \ `1` 或 `2` 这样的数字在底层也被被视为浮点数。这对我们程序员来说非常方便，因为这意味着我们不需要在不同类型的数字之间进行区分。(1)\n\n与 JavaScript\
