  \ Jekyll 静态站点生成器（在处理 Node 模块时有时会导致错误），如列表 9.5 所示。（有些读者报告，目前不需要此步骤也可以运行。）代码在上线后有效吗？\n\
  \n**列表 9.5:** 告诉 GitHub Pages 不要使用 Jekyll 静态站点生成器。\n\n```\n$ touch .nojekyll\n\n\
  $ git add -A\n\n$ git commit -m \"Prevent Jekyll build\"\n```\n\n## 9.2 事件监听器\n\n\
  在第 9.1 节中，我们近乎奇迹地让一个回文检测器运行了，但用户体验并不理想：访问页面的用户会立即看到一个提示，甚至没有机会看到页面的内容。\n\n在本节中，我们将通过添加一个\
  \ `button` 让回文页面更友好一些，该按钮为用户提供了启动操作的。对于多次检测回文来说也更好，因为用户可以再次点击按钮，而无需刷新整个页面。\n\n我们的第一步是添加按钮本身，如列表\
  \ 9.6 所示，它展示了如何使用 HTML 的 `button` 标签。\n\n**列表 9.6:** 添加按钮。\n\n`palindrome.html`\n\
  \n```\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Palindrome Tester</title>\n\
  \    <meta charset=\"utf-8\">\n    <script src=\"bundle.js\"></script>\n  </head>\n\
  \  <body>\n    <h1>Palindrome Tester</h1>\n    <button id=\"palindromeTester\">Is\
  \ it a palindrome?</button>\n  </body>\n</html>\n```\n\n注意，列表 9.6 中的按钮使用了 CSS `id`。这符合《精通\
  \ CSS 与布局》（Learn Enough CSS & Layout to Be Dangerous](https://www.learnenough.com/css-and-layout)）中讨论的建议（[`www.learnenough.com/css-and-layout-tutorial/style-of-style#sec-css_why`](https://www.learnenough.com/css-and-layout-tutorial/style-of-style#sec-css_why)），即建议不要使用\
  \ `ids` 进行样式设置（优先使用类），并将它们留给 JavaScript 应用程序等用途（现在已经到了！）。\n\n刷新页面后，我们看到按钮出现了（图 9.4）。\n\
  \n![images](img/09fig04.jpg)\n\n**图 9.4:** 出现了一个按钮。\n\n你可以通过点击它来确认，按钮目前没有任何作用，但我们可以使用\
  \ JavaScript *事件监听器* 来改变这一点，它是一段等待特定事件发生并做出相应响应的代码。在这种情况下，响应将是回文测试本身，因此我们将列表 9.4\
  \ 中的相应代码提取到一个单独的函数中，如列表 9.7 所示。\n\n**列表 9.7:** 将回文检测器提取为函数。\n\n`main.js`\n\n```\n\
  function palindromeTester() {\n  let string = prompt(\"Please enter a string for\
  \ palindrome testing:\");\n  let phrase = new Phrase(string); \n\n  if (phrase.palindrome())\
  \ {\n    alert(`\"${phrase.content}\" is a palindrome!`);\n  } else {\n    alert(`\"\
  ${phrase.content}\" is not a palindrome.`)\n  }\n}\n```\n\n接下来，我们将创建一个表示按钮本身的特殊对象。实现此方法的方法使用强大的\
  \ `querySelector` 函数，它允许我们通过 id 查找页面 DOM 中的元素：2。我原本打算在本文教程中介绍流行的 jQuery 库，但使用它确实会引入一些开销和第三方依赖，所以我发现\
  \ `querySelector` 和与其密切相关的 `querySelectorAll`（第 11.2 节）已经让原生 JavaScript 对于我们的需求变得足够强大。\n\
  \n```\nlet button = document.querySelector(\"#palindromeTester\");\n```\n\n这里注意，JavaScript\
  \ 知道要查找 CSS id（而不是 CSS 类），因为 `#palindromeTester` 以哈希符号 `#` 开头。回想《精通 CSS 与布局》（Learn\
  \ Enough CSS & Layout to Be Dangerous）中的[`www.learnenough.com/css-and-layout-tutorial/style-of-style#sec-naming_things`](https://www.learnenough.com/css-and-layout-tutorial/style-of-style#sec-naming_things)，这与\
  \ CSS 中选择 CSS id 的表示法相同。\n\n（`querySelector` 方法是一个罕见的情况，通过 Google 搜索可能会误导你；截至本文写作，搜索\
  \ \"javascript find element by id\" 主要指向 `getElementById`，而它确实有效）\n\n\n\n\n\n```javascript\n\
  document.addEventListener(\"DOMContentLoaded\", function() {\n\n  let button = document.querySelector(\"\
  #palindromeTester\");\n\n  button.addEventListener(\"click\", function() {\n\n \
  \   palindromeTester(); \n\n  });\n\n});\n```\n\n让我们这段扩展后的代码放入 `main.js` ([列表 9.9)\
  \ 中看看会发生什么。\n\n**列表 9.9：** 用于 DOM 加载的事件监听器。\n\n`main.js`\n\n```javascript\nlet Phrase\
  \ = require(\"<username>-palindrome\"); \n\nfunction palindromeTester() {\n\n  let\
  \ string = prompt(\"Please enter a string for palindrome testing:\");\n\n  let phrase\
  \ = new Phrase(string); \n\n  if (phrase.palindrome()) {\n\n    alert(`\"${phrase.content}\"\
  \ is a palindrome!`);\n\n  } else {\n    alert(`\"${phrase.content}\" is not a palindrome.`)\n\
  \  }\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", function() {\n\n  let\
  \ button = document.querySelector(\"#palindromeTester\");\n\n  button.addEventListener(\"\
  click\", function() {\n\n    palindromeTester();\n\n  });\n});\n```\n\n重新运行 列表 9.2，刷新浏览器并点击按钮，显示它正在工作！结果显示在\
