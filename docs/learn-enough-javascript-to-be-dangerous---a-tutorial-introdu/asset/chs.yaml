  \    </script>\n  </head>\n  <body>\n  </body>\n</html>\n```\n\n## 5.3 方法链式调用\n\n\
  在本节中，我们将开始开发 `palindrome`（回文，即正反读相同的单词、短语、数字或其他序列）。我们的目标是编写一个函数，如果字符串是回文则返回 `true`，否则返回\
  \ `false`。\n\n由于链式调用，我们可以在一行内实现：\n\n1. 将字符串拆分以创建字符数组。\n2. 反转数组。\n3. 将数组合并以创建反转后的字符串。\n\
  \n```javascript\nfunction palindrome(string) {\n  return string.split(\"\").reverse().join(\"\
  \") === string;\n}\n```\n\n（由于 `split(\"\")`的工作方式，这种方法对于包含表情符号的文本实际上会失败。我们将在章节 5.3.1\
  \ 修复这个小瑕疵。）\n\n让我们将 `reverse` 函数放入回文库中，命名为 `palindrome.js`：\n\n```bash\n$ touch\
  \ palindrome.js\n```\n\n**列表 5.8：** 反转字符串的函数。\n\n*palindrome.js*\n\n```javascript\n\
  // 反转字符串。\nfunction reverse(string) {\n  return string.split(\"\").reverse().join(\"\
  \");\n}\n```\n\n注意列表 5.8 包含了一个*文档注释*（在列表 5.3 中简要介绍），说明函数的用途。这并不是强制要求的，但对于未来的编程人员（包括我们）来说，这是一种良好的习惯。\n\
  \n为了检查列表 5.8 的效果，我们可以在 Node REPL 中使用“点加载”（dot load）加载外部文件（注意后面没有结尾的分号，为了避免错误是必要的）：\n\
  \n```javascript\n> .load palindrome.js\n> reverse(\"Racecar\");\n\n'racecaR'\n```\n\
  \n\n\n\n我们现在可以编写回文函数的第一个版本了，它将把一个字符串与其自身的反转字符串进行比较：\n\n```\n> string;    // 只是提醒一下我们的字符串是什么\n\
  \n'Racecar'\n\n> string === reverse(string);\n\nfalse\n```\n\n`palindrome` 的最终定义出现在\
  \ Listing 5.9 中。\n\n**Listing 5.9：** 我们初始的 `palindrome` 函数。\n\n`palindrome.js`\n\
  \n```\n// 反转一个字符串。\n\nfunction reverse(string) {\n\n  return string.split(\"\").reverse().join(\"\
  \");\n}\n\n// 如果是回文则返回 true，否则返回 false。\n\nfunction palindrome(string) {\n\n  return\
  \ string === reverse(string);\n}\n```\n\n重新加载 `palindrome.js` 让我们可以直接检查 `palindrome`\
  \ 函数的节点：\n\n```\n> .load palindrome.js\n\n> palindrome(\"To be or not to be\");\n\
  \nfalse\n\n> palindrome(\"Racecar\");\n\nfalse\n\n> palindrome(\"level\");\n\ntrue\n\
  ```\n\n它可以工作！\n\n有一个非常好的立即添加的微小改进，就是能够不区分大小写地检测回文。换句话说，我们希望对于“Racecar”这样的字符串返回 `true`，即使初始字母“R”是大写写的。我们可以通过在比较之前将字符串转换为小写来实现这一点，我们可以使用\
  \ Section 2.5 中的 `toLowerCase` 方法：\n\n```\n> let processedContent = string.toLowerCase();\n\
  \n> processedContent;\n\n'racecar'\n\n> processedContent === reverse(processedContent);\n\
  \ntrue\n```\n\n将此放入 `palindrome.js` 中得到 Listing 5.10。\n\n**Listing 5.10：** 不区分大小写的回文检测。\n\
  \n`palindrome.js`\n\n```javascript\n// 反转一个字符串。\n\nfunction reverse(string) {\n\n\
  \  return string.split(\"\").reverse().join(\"\");\n}\n\n// 如果是回文则返回 true，否则返回 false。\n\
  \nfunction palindrome(string) {\n\n  let processedContent = string.toLowerCase();\n\
  \n  return processedContent === reverse(processedContent);\n}\n```\n\n使用 REPL，我们可以确认它是有效的：\n\
  \n```\n> .load palindrome.js\n\n> palindrome(\"racecar\");\n\ntrue\n\n> palindrome(\"\
  Racecar\");\n\ntrue\n\n> palindrome(\"Able was I ere I saw Elba\");\n\ntrue\n```\n\
  \n### 5.3.1 表情符号注意事项\n\n在 Listing 5.10 中开发的 `reverse` 方法有一个微小的注意事项，就是它无法适用于包含更复杂字符（如表情符号）的文本。例如，尝试反转一个包含“狐狸脸”和“狗脸”表情符号的句子会得到混乱的结果，如\
  \ Figure 5.7 所示。\n\n![images](img/05fig07.jpg)\n\n**Figure 5.7：** 失败的表情符号反转。\n\n\
  这是因为每个表情符号实际上被表示为两个独立的字符，而像 Listing 5.10 那样通过空字符串进行分割会将每个表情符号拆分成半（哎！）。解决方案是使用不同的方法从字符串创建数组，使用一个名为\
  \ `Array.from()` 的自定义数组方法：\n\n```\n> Array.from('honey badger');\n\n[ 'h', 'o',\
  \ 'n', 'e', 'y', '  ', 'b', 'a', 'd', 'g', 'e', 'r' ]\n```\n\n将 Listing 5.10 中的\
  \ `split` 替换为这种改进的方法将得到 Listing 5.11 中更新的 `reverse` 代码。\n\n**Listing 5.11：** 使用\
  \ `Array.from` 改进 `reverse`。\n\n```javascript\n// 反转一个字符串。\n\nfunction reverse(string)\
  \ {\n\n  return Array.from(string).reverse().join(\"\")\n}\n\n// 如果是回文则返回 true，否则返回\
  \ false。\n\nfunction palindrome(string) {\n\n  let processedContent = string.toLowerCase();\n\
  \n  return processedContent === reverse(processedContent);\n}\n```\n\n确认这段代码是否有效将留作为练习题。\n\
