  \n\n\n\n另一个经常使用的内置对象是 `Date`，它代表时间中的某一个时刻。\n\n`Date` 对象让我们第一次有机会使用 `new` 函数的机会，这是一种所谓的*构造函数*，它是\
  \ JavaScript 中创建新对象的标准方式。到目前为止，我们一直依赖于引号和方括号等“字面量构造函数”，但我们也可以使用 `new` 来定义字符串和数组等：\n\
  \n```\n> let s = new String(\"A man, a plan, a canal—Panama!\");\n\n> s;\n\n[String:\
  \ 'A man, a plan, a canal—Panama!']\n\n> s.split(\",  \");\n\n[ 'A man', 'a plan',\
  \ 'a canal—Panama!' ]\n```\n\nand\n\n```\n> let a = new Array();\n\n> a.push(3);\n\
  \n1\n\n> a.push(4);\n\n2\n\n> a.push(\"hello, world!\");\n\n3\n\n> a;\n\n[ 3, 4,\
  \ 'hello, world!' ]\n\n> a.pop();\n\n'hello, world!'\n```\n\n与字符串和数组不同，日期没有字面量构造函数，因此在这种情况下我们*必须*使用\
  \ `new`：\n\n```\n> let now = new Date();\n\n> now;\n\n2018-03-01T05:01:47.136Z\n\
  \n> let moonLanding = new Date(\"July 20, 1969 20:18\");\n\n> now - moonLanding;\n\
  \n1534038227136\n```\n\n这里的的结果是自首次登月之日期和时间以来的毫秒数（图 4.2）。^(4)（当然，你的结果会有不同，因为时间在流逝，你的\
  \ `new Date()` 取值也会不同。）\n\n4. 图片感谢 Castleski/Shutterstock。\n\n![images](img/04fig02.jpg)\n\
  \n**图 4.2：** 巴兹·奥尔德林和尼尔·阿姆斯特朗竟然在没有 JavaScript 的情况下到达月球（并回来了！）。\n\n与其他 JavaScript\
  \ 对象一样，`Date` 对象也响应多种方法：\n\n```\n> now.getYear();        // 出了一个奇怪的答案\n\n118\n\n\
  > now.getFullYear();    // 这才是我们想要的。\n\n2018\n\n> now.getMonth();\n\n1\n\n> now.getDay();\n\
  \n3\n```\n\n这里的的第一行显示，JavaScript 方法的结果有时会令人困惑，因此保持警惕并偶尔手动双检值是非常重要的。\n\n月份和日期等内容是以索引返回的，和\
  \ JavaScript 中的所有内容一样，它们是从零偏移的。例如，月份 `0` 是一月，月份 `1` 是二月，月份 `2` 是三月，以此此类推。\n\n尽管官方国际标准规定星期一是第一天，但\
  \ JavaScript 遵循使用周日的美国习惯。我们可以通过为星期创建一个字符串数组，然后使用 `getDay()` 作为数组的索引（使用括号符号）来获取名称（第\
  \ 3.1 节）：\n\n```\n> let daysOfTheWeek = [\"Sunday\", \"Monday\", \"Tuesday\", \"\
  Wednesday\",\n\n                       \"Thursday\", \"Friday\", \"Saturday\"];\n\
  \n> daysOfTheWeek[now.getDay()];\n\n'Wednesday'\n```\n\n当然，你的结果会有不同，除非你恰好在周三读到这里。\n\
  \n作为最后一个练习，让我们更新网页，添加一个包含星期的警报框。代码出现在列表 4.1 中，结果如图 4.3 所示。\n\n![images](img/04fig03.jpg)\n\
  \n**图 4.3：** 仅为今天定制的问候语。\n\n**列表 4.1：** 添加根据星期定制的问候。\n\n`index.html`\n\n```html\n\
  <!DOCTYPE html>\n<html>\n  <head>\n    <title>学习足够的 JavaScript</title>\n    <meta\
  \ charset=\"utf-8\">\n    <script>\n      const daysOfTheWeek = [\"Sunday\", \"\
  Monday\", \"Tuesday\", \"Wednesday\",\n                             \"Thursday\"\
  , \"Friday\", \"Saturday\"];\n      let now = new Date();\n      let dayName = daysOfTheWeek[now.getDay()];\n\
  \      alert(`Hello, world! Happy ${dayName}.`);\n    </script>\n  </head>\n  <body>\n\
  \  </body>\n</html>\n```\n\n注意列表 4.1 在定义 `daysOfTheWeek` 时使用了 `const` 而不是 `let`：\n\
  \n```javascript\nconst daysOfTheWeek = [\"Sunday\", \"Monday\", \"Tuesday\", \"\
  Wednesday\",\n                       \"Thursday\", \"Friday\", \"Saturday\"];\n\
  ```\n\n这里的 `const`（你可能猜到了，它是“constant”的缩写）为我们提供了一种方法来指示变量的值不会改变。^(5) 有人甚至倾向于尽可能地使用\
  \ `const` 而不是 `let`。我偏向于使用 `const`。\n\n\n\n\n\n基础正则表达式由一组匹配特定模式的字符序列组成。我们可以使用 `RegExp`\
  \ 对象在第 4.2 节中的 `new` 函数来创建一个新的正则表达式。例如，这里有一个匹配标准美国邮政编码（图 4.6）的正则表达式：`^(6)`，它由连续的五个数字组成：\n\
  \n6。图片来自 4kclips/123RF。\n\n```\n> let zipCode = new RegExp(\"\\\\d{5}\");\n```\n\
  \n![images](img/04fig06.jpg)\n\n**图 4.6：**90210 是美国昂贵的邮政编码之一。\n\n在这里，`\\d` 代表任何数字（0–9），第一个反斜杠是为了`转义`第二个反斜杠，从而在字符串中获得一个字面上的反斜杠。（我们将在第\
  \ 4.3.2 节中看到如何使用字面量构造函数来避免这种不便的要求。）同时，`{5}` 表示匹配连续的五个数字。\n\n如果你经常使用正则表达式，最终你会记住很多这些规则，但你始终可以在快速参考表（图\
  \ 4.5）中查找它们。\n\n现在让我们如何判断一个字符串是否匹配某个正则表达式。正则表达式带有一个 `exec` 方法，它可以在字符串上“执行”正则表达式：\n\
  \n```\n> let result = zipCode.exec(\"Beverly Hills 90210\");\n\n> result;\n\n[ '90210',\
  \ index: 14, input: 'Beverly Hills 90210' ]\n```\n\n这里的结果包含了匹配的字符串、匹配开始的索引以及原始输入。\n\
  \n我不喜欢上面结果的格式，主要是因为输出是一个奇怪且令人困惑的伪数组，它似乎有三个元素，但实际上长度为 `1`：\n\n```\n> result.length\n\
  \n1\n```\n\n## 4.3.2 字符串方法\n\n进行正则匹配的更方便的方法是使用字符串方法。还有一种字面量正则表达式构造语法，对于大多数用途来说更方便。\n\
  \n正如我们在第 4.2 节中所学习的，某些 JavaScript 对象需要使用 `new` 创建，而另一些对象具有可选的字面量构造函数，例如用于创建字符串的引号和用于创建数组的中括号。正则表达式也支持这种字面量构造语法，即斜杠内部的模式：\n\
  \n```\n> zipCode = /\\d{5}/;\n\n/\\d{5}/\n```\n\n注意，与第 4.3.1 节中的具名 `RegExp` 构造函数不同，使用字面量构造函数时，我们不需要用额外的反斜杠来转义\
  \ `\\d`。\n\n现在我们来构建一个包含多个邮政编码的较字符串（图 4.7）：`^(7)`\n\n7。图片来自 kitleong/123RF。\n\n![images](img/04fig07.jpg)\n\
  \n**图 4.7：**91125 是加州理工学院（Caltech）校区的专用邮政编码。\n\n```\n> let s = \"Beverly Hills 90210\
  \ was a '90s TV show set in Los Angeles.\";\n\n> s += \" 91125 is another ZIP code\
  \ in the Los Angeles area.\"\n\n'Beverly Hills 90210 was a \\'90s TV show set in\
  \ Los Angeles. 91125 is another\n\nZIP code in the Los Angeles area.'\n```\n\n如果你以前没见过它，你应该能够利用你的技术素养（框\
  \ 1.1）来推断 `+=` 运算符在这里的作用（这可能涉及进行快速的 Google 搜索）。\n\n要找出字符串是否匹配正则表达式，我们可以使用字符串的 `match`\
  \ 方法：\n\n```\n> s.match(zipCode);\n\n[ '90210',\n\n  index: 14,\n\n  input: 'Beverly\
  \ Hills 90210 was a \\'90s TV show set in Los Angeles. 91125 is\n\n   another ZIP\
  \ code in the Los Angeles area.' ]\n```\n\n结果是我们在第 4.3.1 节中看到的同样奇怪的伪数组，但至少在第二次运行时会得到相同的结果：\n\
  \n```\n> s.match(zipCode);\n\n[ '90210',\n\n  index: 14,\n\n  input: 'Beverly Hills\
  \ 90210 was a \\'90s TV show set in Los Angeles. 91125 is\n\n   another ZIP code\
  \ in the Los Angeles area.' ]\n```\n\n`match` 方法在条件语句中特别有用；回想起第 2.4.2 节中的“双叹号”符号，我们可以对匹配进行求值：\n\
  \n```\n> !!s.match(zipCode);\n\ntrue\n```\n\n因此，我们可以这样做：\n\n```javascript\nif (s.match(zipCode))\
  \ {\n  console.log(\"Looks like there's at least one ZIP code!\");\n}\n```\n\n更好方法是使用\
  \ `global` 标志匹配所有出现项的常用技术：\n\n```javascript\nzipCode = /\\d{5}/g;\n```\n\n结果输出为：\n\
  \n```\n> s.match(zipCode);\n\n[ '90210', '91125' ]\n```\n\n我们在这里看到了字面量构造函数的值：对于短正则表达式，没有定义中间变量；相反，我们可以直接使用正则表达式。\n\
  \n```\n**列表 4.2：带有换行符的文本。\n\n```javascript\nconst sonnet = `Let me not to the marriage\
  \ of true minds\n\nAdmit impediments. Love is not love\n\nWhich alters when alteration\
  \ finds,\n\nOr bends with the remover to remove.\n\nO no, it is an ever-fixed mark\n\
  \nThat looks on tempests and is never shaken;\n\nIt is the star to every wand'ring\
  \ bark,\n\nWhose worth's unknown, although his height be taken.\n\nLove's not time's\
  \ fool, though rosy lips and cheeks\n\nWithin his bending sickle's compass come:\n\
  \nLove alters not with his brief hours and weeks,\n\nBut bears it out even to the\
  \ edge of doom.\n\n   If this be error and upon me proved,\n\n   I never writ, nor\
  \ no man ever loved.`;\n```\n\n### 4.3.3 练习\n\n1. 编写一个正则表达式来匹配扩展格式的邮政编码，由五个数字、一个连字符和四个数字扩展组成（例如\
  \ 10118-0110）。使用 `match()` 确认其有效性。\n\n2. 编写一个仅按换行符分割的正则表达式。这种正则表达式用于将文本块分割成行。具体来说，通过将列表\
  \ 4.2 中的诗歌粘贴到控制台并使用 `sonnet.split(/your regex/)` 来测试你的正则表达式。结果数组的长度是多少？\n\n\n\n\n\
  \n`object` 一词在 JavaScript 的各种上下文中都会被使用，通常指的是数据集合（属性）和函数集合（方法）的抽象概念。正如第 2.4 节所出的，JavaScript\
  \ 中的（几乎）一切内容都是对象，我们将在第 7 章中看到如何定义与 `String`、`Array` 和 `RegExp` 等内置对象平行的对象。在本节中，我们将关注\
  \ `plain objects`（普通对象），它们的定义比我们目前遇到的更通用的对象要简单。\n\n通常情况下，JavaScript 中的对象可能复杂得令人眼晕，但在简单的形式下，它们的工作方式类似于其他语言中的哈希表（也称为`关联数组`）。你可以将它们想象成普通数组，但使用字符串而不是整数作为索引。因此，每个元素都是一对值：一个字符串（`key`键）和一个任意类型的元素（`value`值）。这些元素也被称为\
  \ `key/value pairs`（键值对）。\n\n作为一个简单的示例，让我们创建一个对象来存储用户的姓和名，就像我们在 Web 应用程序中可能需要的那样：\n\
  \n```\n> let user = {};                     // {} 是一个空 Object。\n\n{}\n\n> user[\"\
  firstName\"] = \"Michael\";     // Key \"firstName\", value \"Michael\"\n\n'Michael'\n\
  \n> user[\"lastName\"] = \"Hartl\";        // Key \"lastName\", value \"Hartl\"\n\
  \n'Hartl'\n```\n\n如你所见，空的 `Object` 用大括号表示，我们可以使用与数组相同的方括号语法进行赋值。我们可以以相同的方式获取值：\n\
  \n```\n> user[\"firstName\"];      // 元素访问类似于数组\n\n'Michael'\n\n> user[\"lastName\"\
  ];\n\n'Hartl'\n```\n\n我们对象中的键无非我们在第 2.4 节中首次遇到的 `properties`（属性），因此，它们也可以使用我们过的点符号（dot\
  \ notation）来访问，例如 `string.length`：\n\n```\n> user.firstName;       // 使用点符号访问元素\n\
  \n'Michael'\n\n> user.lastName;\n\n'Hartl'\n```\n\n决定使用哪种语法取决于上下文和风格。注意，在何种情况下，未定义的键/属性名简单地返回\
  \ `undefined`：\n\n```\n> user[\"dude\"];\n\nundefined\n\n> user.dude;\n\nundefined\n\
  \n> !!user.dude\n\nfalse\n```\n\n最后这一行提醒我们，`undefined` 在布尔上下文中为 `false`，如果你解决过第\
  \ 3.2.1 节中相应的练习，你可能会回起来。\n\n最后，我们可以简单地显示或定义整个对象，从而展示所有的键值对（列表 4.3）。\n\n**列表 4.3：**\
  \ 对象的字面量表示。\n\n```\n> user;\n\n{ firstName: 'Michael', lastName: 'Hartl' }\n\n>\
  \ let otherUser = { firstName: 'Foo', lastName: 'Bar' };\n\n> otherUser[\"firstName\"\
  ];\n\n'Foo'\n\n> otherUser[\"lastName\"];\n\n'Bar'\n```\n\n## 4.4.1 练习\n\n1. 证明\
  \ `new Object()` 也可以创建一个新的空对象。如果你给对象构造函数传递一个与列表 4.3 输出相等的参数，会发生什么？\n\n## 4.5 应用：唯一单词\n\
  \n让我们将普通对象应用于一个挑战性练习中，这包含了我们到目前为止编写的最长程序。我们的任务是从一段相当长的文本中提取所有唯一的单词，并统计每个单词出现的次数。\n\
  \n由于命令序列相当冗长，我们的主要工具将是一个 JavaScript 文件（第 1.4 节）。由于我们打算让它成为一个通用的脚本，因此我们将使用 `node`\
  \ 命令来执行它（这正如我们在第 1.5 节中提到的）。在每个阶段，我建议使用 REPL 交互式执行代码，如果你有任何疑问。\n\n让我们创建文件开始：\n\n\
  ```\n$ touch count.js\n```\n\n现在，向其中填充一个包含文本的 `const`，我们将从第 2.2 节中介绍的列表 4.2 中选择，并再次在列表\
  \ 4.4 中显示。注意，在莎士比亚的原始发音中，像“love”和“remove”这样的单词是押韵的，正如“come”和“doom”一样。10 的图片由 psychoshadowmaker/123\
  \ 提供。\n\n![04fig9.jpg](img/04fig9.jpg)\n\n**图 4.9：** 十四行诗 16。\n\n**列表 4.4：** 添加一些\
  \ `const`。\n\n*`count.js`*\n\n```\nconst sonnet = `Let me not to the marriage of\
  \ true minds\n\nAdmit impediments. Love is not love\n\nWhich alters when alteration\
  \ finds,\n\nOr bends with remove.\n\nO no, it is an ever-fixed mark\n\nThat looks\
  \ on tempests and is never shaken;\n\nIt is the star to every wand'ring bark,\n\n\
  Whose worth's unknown, although his height be taken.\n\nLove's not time's fool,\
  \ though rosy lips and cheeks\n\nWithin his bending sickle's come:\n\nBut bears\
  \ it out even to the edge of doom.\n\n   If this be error and upon me proved,\n\n\
  \   I never writ, nor no man ever loved.`;```\n\n注意列表 4.4 使用了反引号（第 2.2 节），这允许我们换行（特别是某些版本的\
  \ Sublime Text 可能需要正确配置）。\n\n12 的图片来自 to。\n\n12 我不得不搜索学习如何。\n\n接下来，我们将初始化对象，将其命名为\
  \ `uniques`，因为它对每个唯一的单词有一个条目：\n\n```\nlet uniques = {};\n```\n\n为了这个练习，我们将“单词”定义为一个或多个（字母或数字）的连续序列。\n\
  \n现在是程序的核心。我们将遍历 `words`数组（第 3.5 节）并执行以下操作：\n\n1. 如果该单词在 `uniques` 对象中已，则将其计数加 `1`。\n\
  \n2. 如果该单词尚未在 `uniques` 中条目，则将其初始化为 `1`。\n\n使用我们在第 4.3.2 节中简要遇到过的 `+=` 运算符，结果如下：\n\
  \n\n\n\n\n```javascript\nfor (let i = 0; i < words.length; i++) {\n  let word =\
  \ words[i];\n  if (uniques[word]) {\n    uniques[word] += 1;\n  } else {\n    uniques[word]\
  \ = 1;\n  }\n}\n```\n\n除此之外，我们在这里看到了方括号访问符号的威力，因为使用点符号语法（dot syntax）无法完成同样的任务。请注意，如果\
  \ `word` 还不是一个有效的键，我们依赖于 `uniques[word]` 将是 `undefined`（在布尔语境下为 `false`）。\n\n最后，我们将结果打印到终端：\n\
  \n```javascript\nconsole.log(uniques)\n```\n\n完整的程序（带有添加的注释）如代码列表 4.6 所示。\n\n**代码列表\
  \ 4.6：** 一个统计文本中单词数的程序。\n\n`count.js`\n\n```javascript\nconst sonnet = `Let me not\
  \ to the marriage of true minds\n\nAdmit impediments. Love is not love\n\nWhich\
  \ alters when it alteration finds,\n\nOr bends with the remover to remove.\n\nO\
  \ no, it is an ever-fixed mark\n\nThat looks on tempests and is never shaken;\n\n\
  It is the star to every wand'ring bark,\n\nWhose worth's unknown, although his height\
  \ be taken.\n\nLove's not time's fool, though rosy lips and cheeks\n\nWithin his\
  \ bending sickle's compass come:\n\nLove alters not with his brief hours and weeks,\n\
  \nBut bears it out even to the edge of doom.\n\n   If this be error and upon me\
  \ proved,\n\n   I never writ, nor no man ever loved.`;\n\n// 唯一单词\nlet uniques =\
  \ {};\n\n// 中所有的单词\nlet words = sonnet.match(/\\w+/g);\n\n// 遍历 `words` 并构建一个唯一单词的关联数组。\n\
  for (let i = 0; i < words.length; i++) {\n  let word = words[i];\n  if (uniques[word])\
  \ {\n    uniques[word] += 1;\n  } else {\n    uniques[word] = 1;\n  }\n}\n\nconsole.log(uniques)\n\
  ```\n\n值得注意的是，即使是在像代码列表 4.6 这样较短的程序中，让所有的大括号、括号等匹配起来也很困难。良好的文本编辑器可以提供帮助；例如，当光标位于右大括号旁边时，Atom\
  \ 会开启/关闭对的每个成员下方显示细微的线条（图 4.10）。\n\n![images](img/04fig10.jpg)\n\n**图 4.10：** 文本编辑器在匹配大括号等方面非常有帮助。\n\
  \n在终端中运行 `count.js` 的结果看起来如下：\n\n```bash\n$ node count.js\n\n{ Let: 1,\n  me: 2,\n\
  \  not: 4,\n  to: 4,\n  the: 4,\n  marriage: 1,\n  .\n  .\n  .\n  upon: 1,\n  proved:\
  \ 1,\n  I: 1,\n  writ: 1,\n  nor: 1,\n  man: 1,\n  loved: 1 }\n```\n\n### 4.5.1\
  \ Map\n\n虽然原生 JavaScript 对象可以作为哈希表/关联数组（如我们上面所做的），但它们确实有局限性，例如性能较慢以及对提取键和值的支持有限。JavaScript\
  \ 提供了一个专门的 `Map` 对象来解决这些局限性，并带有 `set` 和 `get` 方法通过键设置和获取值：\n\n```javascript\n> let\
  \ uniques = new Map();\n> uniques.set(\"loved\", 0);\nMap { 'loved' => 0 }\n> let\
  \ currentValue = uniques.get(\"loved\");\n> uniques.set(\"loved\", currentValue\
  \ + 1);\nMap { 'loved' => 1 }\n```\n\n将上述技术结合起来重写 `count.js` 程序是一项练习（ 4.5.2 节）。\n\
  \n### 4.5.2 练习题\n\n1. 扩展代码列表 4.6 中使用的正则表达式，以包含撇号，使其能够匹配，例如“wand’ring”。*提示*：将 regex101\
  \ 中的第一个引用正则（图 4.11）与 `\\w`、撇号以及加号运算符 `+` 结合。\n\n![images](img/04fig11.jpg)\n\n**图\
  \ 4.11：** 练习提示。\n\n2. 使用 `Map`（ 6.1 节）代替原生 JavaScript 对象重写代码列表 4.6。\n\n## 第 5 章.\
  \ 函数\n\n到在本教程目前为止，我们反复提到了 JavaScript 函数，在本章中，我们终于学习如何定义自己的函数。这种能力让我们作为程序员具有更大的灵活性，并让许多强大的技术成为可能，如\
  \ `forEach`（ 5.4 节）和*函数式编程*（第 6 章）。函数：成就已解锁（图 5.1）。\n\n![images](img/05fig1.jpg)\n\
  \n**5.1：** 升级。\n\n## 5.1 函数定义\n\n在 2.2 节 中看到的，函数调用由一个名称和位于括号内的内容组成：\n\n```javascript\n\
  > log(\"hello!\");\nhello!\n```\n\n在 2.5 节 中看到的，函数由一个名称和括号内的内容组成：\n\n```javascript\n\
  > function greet() {\n  log(\"hello world!\");\n}\n```\n\n在 1 节 中讨论的，函数定义包含一个 `return`\
  \ 来返回值：\n\n```javascript\n> function test() {\n  return \"hello\";\n}\n```\n\n理解\
  \ `return` 对于调用者来说是重要的。在 1.1 节 中，我们看到 `return` 的使用：\n\n```javascript\n> test()\n\
  \"hello\"\n```\n\n在 2.2 节 中看到的，函数定义包含一个参数：\n\n```javascript\n> function greet(name)\
  \ {\n  log(name);\n}\n```\n\n在 2.3 节 中看到的，函数定义包含多个参数：\n\n```javascript\n> function\
  \ add(a, b) {\n  log(a + b);\n}\n```\n\n在 2.4 节 中看到的，函数定义可以包含默认参数：\n\n```javascript\n\
  > function greet(name = \"Guest\") {\n  log(name);\n}\n```\n\n在 2.5 节 中看到的，函数定义可以使用剩余参数（rest\
  \ parameters）：\n\n```javascript\n> function sum(...numbers) {\n  log(numbers);\n\
  }\n```\n\n在 3.1 节 中看到的，函数定义可以返回一个值：\n\n```javascript\n> function multiply(a, b)\
  \ {\n  return a * b;\n}\n```\n\n在 3.2 节 中看到的，函数定义可以返回另一个函数：\n\n```javascript\n>\
  \ function getAdder(x) {\n  return function(y) {\n    return x + y;\n  };\n}\n```\n\
  \n在 3.3 节 中看到的，函数可以使用闭包：\n\n```javascript\n> function counter() {\n  let count =\
  \ 0;\n  return function() {\n    count++;\n    return count;\n  };\n}\n```\n\n在\
  \ 3.4 节 中看到的，函数可以使用箭头函数：\n\n```javascript\n> const add = (a, b) => a + b;\n```\n\
  \n在 3.5 节 中看到的，箭头函数可以有多个语句：\n\n```javascript\n> const multiply = (a, b) => {\n \
  \ log(a * b);\n  return a * b;\n};\n```\n\n在 3.6 节 中看到的，箭头函数可以是异步的：\n\n```javascript\n\
  > const fetchData = async (url) => {\n  const response = await fetch(url);\n  return\
  \ response.json();\n};\n```\n\n### 5.1.1 排序数组\n\n在 3.4 节 中，我们看到 JavaScript 默认按“字母顺序”排序数组：\n\
  \n```javascript\n> let a = [8, 17, 42, 99];\n> a.sort();\n[17, 42, 8, 99]\n```\n\
  \n为了按数值排序数组，我们可以定义一个函数（我们将命名为 `numberCompare`），它接收两个数字 `a` 和 `b`并在 `a > b` 时返回 `1`，在\
  \ `a < b` 时返回 `-1`，在它们相等时返回 `0`。这是[Array sort 文档要求的格式](https://developer.mozilla.org/en-US/docs/Web/Reference/Global_Objects/Array/sort)(https://developer.mozilla.org/en-US/docs/Web/Reference/Global_Objects/Array/sort)，正如我们将看到的，这会让\
  \ `sort` 知道我们想要按数值排序而不是按字母顺序。\n\n```javascript\nfunction numberCompare(a, b) {\n\
  \  if (a > b) {\n    return 1;\n  } else if (a < b) {\n    return -1;\n  } else\
  \ {\n    return 0;\n  }\n}\n```\n\n我们可以通过以下方式直接测试它：\n\n```javascript\n> numberCompare(8,\
  \ 17);\n-1\n> numberCompare(17, 99);\n-1\n> numberCompare(99, 42);\n1\n> numberCompare(99,\
  \ 99);\n0\n```\n\n此时，我们可以通过给 `sort` 传递*函数参数*来排序数组，这会改变它的默认比较：\n\n```javascript\n\
  > a.sort(numberCompare);\n[8, 17, 42, 99]\n```\n\n这就是我们寻找的结果。在底层，JavaScript 正在遍历数组并询问：“`numberCompare(a,\
  \ b)` 的值是多少？”如果为负，则 `a` 在 `b` 之前；如果正，则 `b` 在 `a` 之前。（如果它们相等，则无所谓。）”结果是按照我们直觉预期的方式排序的数组。\n\
  \n\n\n\n当我们在第 5.4 节中学习*匿名函数*（没有名字的函数）时，我们将看到更好的数组排序方法。特别是，第 5.4.1 节中的某项练习包含了最符合惯用法的\
  \ JavaScript 数组数值排序方法（代码清单 5.17）。\n\n### 5.1.2 胖箭头函数 (Fat Arrow)\n\nES6 添加了另一种定义函数的方法，称为“胖箭头”（fat\
  \ arrow），用等号加大于号表示：`=>`。我们可以通过结合 `=>` 和 `let` 关键字来定义备的字符串消息函数：\n\n```\n> let altStringMessage\
  \ = (string) => {\n\n    if (string) {\n\n      return \"The string is nonempty.\"\
  ;\n\n    } else {\n      return \"It's an empty string!\";\n\n    }\n\n  }\n\n>\
  \ altStringMessage(\"honey badger\");\n\n'The string is nonempty '\n```\n\n这里，`(string)\
  \ => ...` 表示创建一个带参数（`string`）的函数，函数体由箭头右侧的代码定义。换句话，\n\n```\nfunction name(arg) {\n\
  \n  // code\n\n}\n```\n\n等同于\n\n```\nlet name = (arg) => {\n\n   // code\n\n}\n\
  ```\n\n一些开发者更倾向于对*所有*函数都使用这种替代表示法，这最终可能成为一种通用做法，但目前使用 `function` 仍然*非常*常见。它也能更整洁地映射到你实际调用函数的方式：\n\
  \n```\nfunction foo(bar, baz) {\n\n  // do something with bar and baz\n\n}\n\nlet\
  \ x = 1;\n\nlet y = 2;\n\nlet result = foo(x, y);\n```\n\n因为这里的实际代码使用了 `foo(x, y)`，所以能在函数定义中看到类似的字符序列是很棒的。\n\
  \n在本教程中，我们通常会坚持使用 `function` 来定义函数，但在某些语境下，我们将对匿名函数使用箭头符号，特别是在第 6 节中讨论的*函数式编程*技术背景下。\n\
  \n与 `var` 和 `let`/`const` 一样，`function` 和 `=>` 都在使用。即使你为自己的代码统一了某种约定，你也必须熟悉这两种语法才能阅读他人编写的代码。\n\
  \n### 5.1.3 练习题\n\n1. 使用 `function` 定义一个返回数字平方的 `square` 函数。同样使用胖箭头表示法定义一个类似的 `altSquare`\
  \ 函数。\n\n## 5.2 文件中的函数\n\n虽然在 REPL 中定义函数对于演示目的很方便，但这样做有点繁琐，更好的做法是将它们放在文件中（正如我们在第\
  \ 4.5 节的脚本中所做的那样）。我们将首先在第 1.2 节中创建的 `index.html` 文件中直接定义函数，然后将该函数移动到更方便的外部文件中。\n\
  \n回想第 4.2 节，`Date` 对象有一个 `getDay()` 方法，该方法返回对应星期几的索引（星期为 `0`，星期一为 `1` 等等）。在代码清单\
  \ 4.1 中，我们为星期几定义了一个 `const`，然后使用 `getDay()` 定义了 `dayName` 变量：\n\n```\nconst daysOfTheWeek\
  \ = [\"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\",\n\n                   \
  \    \"Thursday\", \"Friday\", \"Saturday\"];\n\nlet now = new Date();\n\nlet dayName\
  \ = daysOfTheWeek[now.getDay()];\n\nalert(`Hello, world! Happy ${dayName}.`);\n\
  ```\n\n将此定义和逻辑*封装*在一个 `dayName` 函数中将非常方便，这样我们就可以这样写 alert：\n\n```\nalert(`Hello,\
  \ world! Happy ${dayName(now)}.`);\n```\n\n这消除了对 `dayName` 变量的使用，取而代之的是函数调用 `dayName(now)`。\n\
  \n应用第 5.1 节中的函数定义语法，可以得到如下 `dayName` 函数：\n\n```\nfunction dayName(date) {\n\n  const\
  \ daysOfTheWeek = [\"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\",\n\n     \
  \                    \"Thursday\", \"Friday\", \"Saturday\"];\n\n  return daysOfTheWeek[date.getDay()];\n\
  \n}\n```\n\n注意我们是如何从变量 `now` 切换到听起来更通用的 `date` 的，这表明我们的函数可以处理传递给它的任何日期。\n\n将此定义放入代码清单\
  \ 4.1 的代码中，可以很好地将 `alert` 逻辑与生成星期几的代码隔离开，如代码清单 5.2 所示。结果如图 5.2 中。\n\n![images](img/05fig2.jpg)\n\
  **图 5.2：** 分离逻辑。\n\n**代码清单 5.2：** 将逻辑提取到函数中。*`index.html`*\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <title>Learn JavaScript</title>\n  <meta charset=\"utf-8\"\
  >\n  <script>\n    const daysOfTheWeek = [\"Sunday\", \"Monday\", \"Tuesday\", \"\
  Wednesday\",\n                           \"Thursday\", \"Friday\", \"Saturday\"\
  ];\n\n    function dayName(date) {\n      return daysOfTheWeek[date.getDay()];\n\
  \    }\n\n    let now = new Date();\n    alert(`Hello, world! Happy ${dayName(now)}`);\n\
  \  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n\n\n\n- **注释掉代码。** 有时，将你怀疑与问题无关的代码注释掉是一个好主意，这可以让你专注于那些无法运行的代码。\n\
  - **使用 REPL。** 启动 REPL 并粘贴出现问题的代码通常是隔离问题的极佳方法。\n- **用 Google 搜索。** 搜索错误信息或其他与 bug\
  \ 相关的搜索词（这通常会引导找到 Stack Overflow 上非常有用的帖子）是每个现代开发人员的必备技能（图 5.4）。\n\n![images](img/05fig04.jpg)\n\
