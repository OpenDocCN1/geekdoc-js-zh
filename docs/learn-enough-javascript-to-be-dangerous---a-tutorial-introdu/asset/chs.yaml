  \ 方法可以工作了。\n\n这是一项巨大的改进，但实际上还有一次重构，它是展示 JavaScript 力量的绝佳例子。回想第 4.3 节中的内容，`match`\
  \ 可以使用正则表达式从字符串返回一个数组。通过与来自第 4.5 节的全局标志 `g` 结合，我们可以直接选择字母：\n\n```javascript\n> \"\
  Madam, I'm Adam.\".match(/[a-z]/gi);\n\n[ 'M', 'a', 'd', 'a', 'm', 'I', 'm', 'A',\
  \ 'd', 'a', 'm' ]\n\n> \"Madam, I'm Adam.\".match(/[a-z]/gi).join(\"\");\n\n'MadamImAdam'\n\
  ```\n\n通过对我们在本节一直使用的相同正则表达式进行匹配，然后用空字符串连接，我们几乎复制了 `letters` 方法的功能！只有一个细微之处，即当*没有*字母时，结果是\
  \ `null`：\n\n```javascript\n> \"1234\".match(/[a-z]/gi);\n\nnull\n\n>\n\n\"1234\"\
  .match(/[a-z]/gi).join(\"\");\n\nTypeError: Cannot read property 'join' of null\n\
  ```\n\n我们可以使用 `||`（“或”）运算符（第 2.4 节）修复这个问题，它使用一种被称为“短路求值”的方法。\n\n如果 `||` 语句列表中的第一个元素评估为\
  \ `true`，评估将“短路”，JavaScript 会立即返回该元素。如果第一个元素为 `false`，JavaScript 将评估下一个，依此类推，直到找到一个\
  \ `true` 元素，然后返回最后一个元素（如果所有元素都是 `false`，则返回最后一个元素）。这意味着我们可以这样处理上面的情况：\n\n```javascript\n\
  > null || []\n\n[]\n```\n\n在这里，JavaScript 看到 `null`，将其评估为 `false`，然后移动到 `[]`，它是\
  \ `true` 并因此被返回。\n\n我们可以如下将此想法与 `match` 结合使用：\n\n```javascript\n> (\"1234\".match(/[a-z]/gi)\
  \ || []);\n\n[]\n\n> (\"1234\".match(/[a-z]/gi) || []).join(\"\");\n\n''\n```\n\n\
  使用这种技术，我们可以进一步简化应用程序代码，如列表 8.25 所示。\n\n**列表 8.25：** 用 `match` 替换 `letters`。\n\n\
