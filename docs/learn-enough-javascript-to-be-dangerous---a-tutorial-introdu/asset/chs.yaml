  \n### 1.2.2 练习\n\n1. 如果你在第一个 alert 之后放第二个 alert，会发生什么？\n\n## 1.3 REPL 中的 JS\n\n\
  我们接下来的两个密切相关的“hello, world”示例涉及读取-评估-打印循环，或 *REPL*（读作“repple”）。REPL 是一个程序，它**读取**（reads）输入、**评估**（evaluates）它、**打印**（prints）结果（如果有的话），然后**循环**（loops）回到读取步骤。绝大多数现代编程语言都提供\
  \ REPL，JavaScript 也不例外。事实上，如上面暗示的，它实际上提供了两个。\n\n### 1.3.1 浏览器控制台\n\n我们的第一个 REPL\
  \ 示例是浏览器*控制台*（console），它在大多数现代浏览器中作为标准开发工具包的一部分可用。这些工具是否默认可用取决于你使用的浏览器；例如，它们自动包含在\
  \ Google Chrome 中，但在 Safari 中必须手动安装。利用你的技术素养（框 1.1）来确定你所选浏览器的设置。\n\n通常可以通过在浏览器窗口中右键点击（或按\
  \ Ctrl 点击）并选择“检查”（Inspect Element）来访问开发者工具以打开网页检查器（图 1.11）。结果应该像图 1.12 所示。\n\n![images](img/01fig11.jpg)\n\
  \n**图 1.11：** 通过检查元素激活开发者工具。\n\n![images](img/01fig12.jpg)\n\n**图 1.12：** 开发者工具。\n\
  \n此时，我们可以通过点击开发者工具中相应的选项卡来访问控制台，如图 1.13 所示。正如我们在第 5.2 节](#ch05.xhtml_ch5lev2)所示，控制台是一个非常有用的调试工具，因为它可以访问\
  \ DOM 和应用程序的其他方面，并显示可能影响应用程序的任何警告或错误。特别注意图 1.13 显示了一个关于 `favicon.ico` 文件的警告；了解何时可以安全忽略此类警告是技术素养的标志。（在这种情况下，可以安全忽略。此外，你的设置可能显示完全相同的错误。这会有问题吗？）\n\
  \n![images](img/01fig13.jpg)\n\n**图 1.13：** 交互式 JavaScript 控制台。\n\n我们终于准备好使用控制台\
  \ REPL 编写我们的“hello, world”程序。我们的方法是使用 `console`，它是一个代表控制台及其相关数据、函数的 JavaScript *对象*。特别是，`console`\
  \ 对象有一个函数叫做 `log`，它将其参数打印到屏幕上。我们使用“点”这种在各种*对象导*语言中已成为标准的语法来访问它，如列表 1.3 所示。\n\n**列表\
  \ 1.3：** 控制台中的“hello, world”命令。\n\n```\n> console.log(\"hello, world!\");\n```\n\
  \n在对象的上下文中，使用点符号调用的类似 `log` 函数通常被称为*方法*（method）。\n\n此时，你应该在你的浏览器控制台中输入 `console.log`\
  \ 命令，注意列表 1.3 中的 `>` 代表控制台提示符本身，不应字字输入。结果应该像图 1.14 所示。（我们将在第 2.3 节](#ch02.xhtml_ch2lev3)中解释\
  \ `undefined` 的含义。）\n\n![images](img/01fig14.jpg)\n\n**图 1.14：** 在浏览器控制台中打印出“hello,\
  \ world!”。\n\n\n\n\n\n警觉的读者（此处并非双关语）可能已经注意到，列表 1.3 中的命令包含一个终止分号（图 1.3），而图 1.14 中显示的命令则没有。之所以包含这种差异，是为了说明这两个命令的作用是相同的，而且在用交互式控制台时，省略分号是常见做法。为了保持一致性，在本文教程的后续部分中，我们通常会包含分号（即使在控制台中也是），但了解这两种约定是有处的，以防你在他人的代码中看到不同的写法。\n\
  \n### 1.3.2 Node 提示符\n\n已知宇宙中的每个网络浏览器都可以执行 JavaScript 程序，但将 JavaScript 视为通用编程语言的一部分也意味着要在命令行中运行它。这意味着需要安装并使用一个能够评估\
  \ JavaScript 程序的命令行程序，如今最流行的选择已经显而易见：`Node.js`（通常读作“node jay-ess”，通常简称为 `Node`）。\n\
  \n你的系统中可能已经安装了 `Node.js`。最简单的方法是使用 `which` 命令（在 *Learn Enough Command Line to Be\
  \ Dangerous* 一书中 ([https://www.learnenough.com/command-line-tutorial/inspecting_files#sec-downloading_a_file])\
  \ 有描述）：\n\n```\n$ which node\n\n/usr/local/bin/node\n```\n\n如果显示了 `node` 可执行文件的路径，那么你就可以使用了。\n\
  \n如果系统中没有 Node，你应该在此时安装它。如果你使用的是安装了 Homebrew ([https://www.learnenough.com/dev-environment-tutorial#sec-homebrew])\
  \ 的 Macintosh，你可以运行：\n\n```\n$ brew install node\n```\n\n来获取最新版本。如果你已经安装了，请运行：\n\
  \n```\n$ brew upgrade node\n```\n\n否则，请访问 `Node.js` 网站 ([https://nodejs.org/en/])\
  \ 并按照你系统的下载和安装说明进行操作。\n\n安装完成后，运行 `Node.js` REPL 非常简单——只需在命令行运行 `node` 命令即可，如列表\
  \ 1.4 所示。\n\n**列表 1.4：** 在命令行中启动 Node 提示符。\n\n```\n$ node\n\n>\n```\n\n与浏览器控制台一样，>`\
  \ 代表 Node 提示符，像控制台一样，它允许我们交互式运行命令。（为了简单，我们有时会用“console”统指浏览器控制台或 Node REPL。）特别是，为了复制列表\
  \ 1.3 中的“hello, world”程序，我们只需要在 Node 提示符下输入相同的命令，如下：\n\n```\n> console.log(\"hello,\
  \ world!\");\n\nhello, world!\n```\n\n（取决于你的系统，你可能还会看到 `undefined` 出现；我们将在 2.3 节中讨论这个细节。）\n\
  \n就这样！在浏览器控制台和 Node 提示符中，我们都可以这一个命令就能打印“hello, world!”：\n\n```\n> console.log(\"\
  hello, world!\");\n```\n\n### 1.3.3 练习\n\n1. 在浏览器控制台中运行 `alert` 会发生什么？在 Node 控制台中又呢？\n\
  \n## 1.4 文件中的 JS\n\n虽然能够交互式探索 JavaScript 非常方便，但大多数 Real Programming™（实际编程）都是在文本编辑器创建的文件中进行的。在本节中，我们将展示如何创建并执行一个\
  \ JavaScript 文件，使用我们在前两个节中讨论过的相同“hello, world”程序。结果将是我们将在 5.2 节中开始学习的可重用 JavaScript\
  \ 文件的简化原型。\n\n我们首先为我们的 `hello` 程序创建一个 JavaScript 文件（扩展名为 `.js`）：\n\n```\n$ touch\
  \ hello.js\n```\n\n接下来，使用我们最喜欢的文本编辑器，在文件中填充如列表 1.5 所示的内容。请注意，代码与列表 1.3 及后续示例中的代码完全相同，区别在于\
  \ JavaScript 文件中没有命令提示符 `>`。\n\n**列表 1.5：** JavaScript 文件中的“hello, world”程序。\n\n\
  *hello.js*\n\n```\nconsole.log(\"hello, world!\");\n```\n\n此时，我们准备好使用与列表 1.4 中启动\
  \ Node 提示符相同的 `node` 命令来执行我们的程序。唯一的区别是这次我们包含了一个文件名的参数：\n\n```\n$ node hello.js\n\
  \nhello, world!\n```\n\n与之前一样，结果是打印“hello, world!”，这次是到终端屏幕上。（程序内部的返回值将是 `undefined`。）\n\
  \n### 1.4.1 练习\n\n1. 如果给 `console.log` 两个参数，如列表 1.6 所示，会发生什么？\n\n**列表 1.6：** 使用两个参数。\n\
  \n*hello.js*\n\n```\nconsole.log(\"hello, world!\", \"how's it?\");\n```\n\n## 1.5\
  \ Shell 中的 JS\n\n虽然 1.4 节中的代码完全可行，但最好使用*可执行脚本*。让我们看看如何使用 Node 一个可执行脚本。我们首先创建一个名为\
  \ `hello` 的文件：\n\n```\n$ touch hello\n```\n\n注意我们没有包含 `.js` 扩展名——这是因为文件名本身就是用户界面，没有理由向用户暴露实现语言。事实上，还有一个理由：通过使用\
  \ `hello` 名称，我们可以在以后用其他语言重写脚本，而无需更改用户输入的命令。\n\n编写一个工作的脚本有两个步骤。第一步是使用之前在列表 1.5 中看到的相同命令，并在其前面加上“shebang”行，告诉我们的系统使用\
  \ `node` 执行脚本。\n\n确切的 shebang 行取决于系统；你可以通过运行 `which` 命令找到你系统的正确可执行路径：\n\n```\n$\
  \ which node\n\n/usr/local/bin/node\n```\n\n将此命令作为 `hello` 文件的 shebang 行，得到了列表 1.7\
  \ 所示的 shell 脚本：\n\n**列表 1.7：** “hello, world”shell 脚本。\n\n*hello*\n\n```\n#!/usr/local/bin/node\n\
  \nconsole.log(\"hello, world!\");\n```\n\n我们可以像 1.4 节那样使用 `node` 命令直接执行此文件，但真正的\
  \ shell 脚本应该能够在不使用辅助程序的情况下执行。（这就是 shebang 行的作用。）相反，我们将遵循上面提到的两个步骤中的第二步，使用 `chmod`（更改模式）命令结合\
  \ `+x`（增加执行权限）使文件本身变为可执行：\n\n```\n$ chmod +x hello\n```\n\n\n\n\n\n此时，该文件应该是可执行的，我们可以通过在命令前加上\
  \ `./` 来执行它，这会告诉我们的系统在当前目录（点 = `.`）中查找可执行文件。（将 `hello` 脚本添加到 `PATH`（[`www.learnenough.com/text-editor-tutorial/advanced_text_editing#code-export_path`](https://www.learnenough.com/text-editor-tutorial/advanced_text_editing#code-export_path)）中以便从任何目录调用，这将留作为一个练习。）结果如下：\n\
  \n```\n$ ./hello\n\nhello, world!\n```\n\n成功了！我们现在编写了一个适用于扩展和完善的 JavaScript Shell\
  \ 脚本。正如上面简单提到的，我们将在第 10.3 节](#ch10.xhtml_ch10lev3) 中看到一个真实的实用工具脚本示例。\n\n在教程的剩余部分中，我们将主要使用\
  \ Node REPL 进行初步研究，但最终目标几乎总是创建一个包含 JavaScript 的文件（纯代码或 HTML）。\n\n### 1.5.1 练习\n\n\
  1. 通过移动文件或更改系统配置，将 `hello` 脚本添加到环境的 `PATH` 中。（你可能会发现 *Learn Enough Text Editor to\
  \ Be Dangerous* 一书中的步骤很有帮助。）确认你可以在不在命令名前加 `./` 的情况下运行 `hello`。\n\n# 第 2 章 字符串\n\n\
  字符串可能是 Web 上最重要的数据结构，因为网页最终由从服务器发送到浏览器的字符字符串组成，而且许多其他类型的程序也需要字符串处理。因此，字符串是我们开启 JavaScript\
  \ 编程之旅的极佳起点。\n\n## 2.1 字符串基础\n\n字符串由特定顺序的字符序列组成。我们已经在第 1 章的“hello, world”程序](#ch01.xhtml_ch01）中看到过的几个例子。让我们看看在\
  \ Node 会话中直接输入一个字符串（不使用 `console.log`）会发生什么：\n\n```\n$ node\n\n> \"hello, world!\"\
  \n\n'hello, world!'\n```\n\n字面输入的字符序列被称为*字符串字面量*（string literal），我们在这里使用双引号字符 `\"\
  ` 创建了它。REPL 打印评估该行的结果，对于字符串字面量来说，结果就是字符串本身。\n\n你可能注意到了上面的一个细节：我们使用双引号输入字符串，但 REPL\
  \ 使用单引号返回它。这个细节取决于系统（例如，Chrome 和 Safari 等浏览器中的控制台使用双引号作为字符串的返回值），所以如果你的系统有所不同，你不必担心。但这个微小的差异给了我们一个学习\
  \ JavaScript 中单引号和双引号区别的机会。\n\n与许多其他语言不同，JavaScript 在几乎所有的实际用途中都可以交叉使用双引号和单引号。主要的例外是，当单引号字符串内包含单引号时，必须使用反斜杠进行*转义*（escaped）：\n\
  \n```\n> \"It's not easy being green\"\n\n'It\\'s not easy being green'\n```\n\n\
  在这里，输出在“It’s”中的单引号前包含了一个反斜杠。如果我们在不转义单引号的情况下输入相同的字符串，REPL 将认为字符串已结束，从而导致错误。\n\n##\
  \ 2.2 拼接与插值\n\n最重要的操作中的两个是*拼接*（concatenation，连接字符串）和*插值*（interpolation，将变量放入字符串中）。\n\
  \n对于拼接，我们使用 `+` 运算符将两个字符串连接在一起。例如：\n\n```javascript\n\"hello \" + \"world\" // 返回\
  \ \"hello world\"\n```\n\n对于插值，我们使用反引号（`` ` ``）和 `${}` 语法将变量插入字符串中。例如：\n\n```javascript\n\
  let name = \"Alice\";\n`Hello, ${name}!` // 返回 \"Hello, Alice!\"\n```\n\n### 2.2.1\
  \ 练习\n\n1. 创建两个字符串并使用 `+` 运算符将它们拼接。\n2. 创建变量并使用插值将其值插入字符串中。\n\n\n\n\n```javascript\n\
  /* console.log(\"foobar\");\n\nconsole.log(\"racecar\");\n\nconsole.log(\"Racecar\"\
  ); */\n```\n\n由于现代文本编辑器可以轻松地将单行注释应用于多行，在实践中，我发现自己很少使用 `/* ... */` 语法。\n\n通常你不会控制台会话中包含注释，但为了教学目的，我有时会在后续内容中包含注释，如下：\n\
  \n```bash\n$ node\n\n> 17 + 42   // 整数加法\n\n59\n```\n\n如果你通过在自己的控制台中输入或复制-粘贴命令来跟进操作，你可以根据自己的意愿省略注释；无论如何，控制台都会忽略它们。\n\
  \n让我们在 `variables` 的语境下再次查看字符串拼接，你可以将其看作包含某些值的具名盒子（正如在 *Learn Enough CSS & Layout\
  \ to Be Dangerous* ([[`www.learnenough.com/css-and-layout`](https://www.learnenough.com/css-and-layout))\
  \ 中提到的，并在 Box 2.2 中进行了进一步讨论）。\n\n### Box 2.2: 变量与标识符\n\n如果你以前从未编写过程序，可能对 `variable`\
  \ 这个术并不熟悉，它是计算机科学中的一个核心概念。你可以将变量想象为一个具名的盒子，它可以存放不同的（或“可变的”）内容。\n\n作为一个具体的类比，请考虑许多小学为学生提供的带标签的盒子，用于存放衣服、书籍、背包等（Figure\
  \ 2.2）。变量是盒子的所在位置，盒子的标签是变量名（也称为 `identifier`），而盒子的内容就是变量值。\n\n![images](img/02fig02.jpg)\n\
  \n**图 2.2:** 计算机变量的具体类比。\n\n在实践中，这些不同的定义经常被混淆，“variable”通常被指代这三个概念中的任何一个（位置、标签或值）。\n\
  \n我们可以使用 JavaScript 命令 `let` 为名字和姓创建变量，如 Listing 2.1 所示。\n\n**Listing 2.1:** 使用\
  \ `let` 给变量赋值。\n\n```javascript\n> let firstName = \"Michael\";\n\n> let lastName\
  \  = \"Hartl\";\n```\n\n在这里，`let` 将标识符 `firstName` 与字符串 `\"Michael\"` 关联，并将标识符 `lastName`\
  \ 与字符串 `\"Hartl\"` 关联。\n\nListing 2.1 中的标识符 `firstName` 和 `lastName` 使用了所谓的 CamelCase（驼峰命名法，因大写字母类似于驼峰而命名，Figure\
  \ 2.3]），这是 JavaScript 变量的常用命名规范。变量名习惯以小写字母开头，而像 `String` 这样的 `object prototypes`\
  \ ([Chapter 7) 则以大写字母开头。\n\n3。图片感谢 Utsav Academy and Art Studio。Pearson India Education\
  \ Services Pvt. Ltd.。\n\n![images](img/02fig03.jpg)\n\n**图 2.3:** 驼峰命名法的起源。\n\n\
  在 Listing 2.1 中定义变量名后，我们可以使用它们来拼接名字和姓，同时在中间插入一个空格（Listing 2.2）。\n\n**Listing 2.2:**\
  \ 拼接字符串变量（以及一个字符串字面量）。\n\n```javascript\n> firstName + \"  \" + lastName;\n\n'Michael\
  \ Hartl'\n```\n\n顺便说一下，Listing 2.1 中 `let` 的使用现代 JavaScript 的特征（通常被称为 ES6，因为 ECMAScript\
  \ 标准第 6 版代表了重大升级，[Box 1.2]）。在本书书中，我们将始终使用 `let`（或与之密切相关的 `const`，我们即将在 Section 4.2\
  \ 中首先看到它）进行变量赋值，但你应该意识到，几乎等价的 `var` 仍然*极其*常见（Listing 2.3），因此，理解这两者都是重要的。\n\n**Listing\
  \ 2.3:** 使用稍显过时的 `var` 给变量赋值。\n\n```javascript\nvar firstName = \"Michael\";\n\n\
  var lastName  = \"Hartl\";\n```\n\n（你不应该在 Listing 2.3 中输入它；它仅用于说明。）\n\n#### 2.2.1\
  \ 反引号语法\n\n构建字符串的另一种方法是通过 *interpolation*（插值），使用一种特殊的 ES6 反引号语法，被称为 *template literals*：\n\
  \n```javascript\n> `${firstName} is my first name.`\n\n'Michael is my first name.'\n\
  ```\n\n在这里，我们有一个被反引号 ``` `...` ``` 包围的字符串，待插值的变量用美元符号 `$` 引入并括在花括号 `{...}` 中。JavaScript\
  \ 会自动插入或插值 `firstName` 的值 [4]。\n\n\n\n\n```html\n<!DOCTYPE html>\n<html\n  <head>\n\
  \    <title>Learn Enough JavaScript</title>\n    <meta charset=\"utf-8\">\n    <script>\n\
  \      alert(\"hello, world!\");\n      console.log(\"This page contains a friendly\
  \ greeting.\");\n    </script>\n  </head>\n  <body>\n    <h1>Hello, world!</h1>\n\
  \    <p>This page includes an alert written in JavaScript.</p>\n  </body>\n</html>\n\
  ```\n\n结果是索引页（在显示警告框后）将消息打印到控制台，如图 2.5 所示。\n\n![images](img/02fig05.jpg)\n\n**图\
  \ 2.5：** 首页上的控制台日志消息。\n\n最后，值得注意的是（如第 1.4.1 节简要提到的），`console.log` 的默认行为是插入空格：\n\n\
  ```\n> console.log(firstName, lastName);\n\nMichael Hartl\n```\n\n如果你实际上想要得到一个代表组合的字符串（如第\
  \ 2.2 节所示），那么这对你帮助不大，但这意味着如果你只感兴趣输出，那么你可以省略拼接或插值。\n\n### 2.3.1 练习\n\n1. 在 `index.html`\
  \ 中定义 `firstName` 和 `lastName` 变量（如第 2.2 节所示），并使用 `console.log` 在浏览器控制台中输出它们。\n\n\
  ## 2.4 属性、布尔值控制流\n\nJavaScript 中的几乎所有内容（包括字符串）都是对象。这意味着我们可以使用第 1.3.1 节中引入的点符号语法来获取有关字符串的有用信息并对其进行有用操作。\n\
  \n我们将从访问字符串属性（也称为特征）开始，它是附加到对象上的数据。特别是在控制台中，我们可以使用 `length` 属性来查找字符串中的字符数：\n\n```\n\
  $ node\n\n> \"badger\".length;   // 访问字符串的 \"length\" 属性\n\n6\n\n> \"\".length \
  \         // 空字符串的长度为 0。\n\n0\n```\n\n恰好，`length` 是字符串对象的唯一属性，你可以通过 MDN 的 String\
  \ 条目 ([`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String))\
  \ 以及使用浏览器的“查找”功能搜索字符串“properties”来验证。\n\n`length` 属性在比较中特别有用，例如检查字符串长度以查看它与特定值的比较（注意\
  \ REPL 支持使用“上箭头”来检索之前的行，就像命令行终端一样）：\n\n```\n> \"badger\".length > 3;\n\ntrue\n\n\
  > \"badger\".length > 6;\n\nfalse\n\n> \"badger\".length >= 6;\n\ntrue\n\n> \"badger\"\
  .length < 10;\n\ntrue\n\n> \"badger\".length == 6;\n\ntrue\n```\n\n最后一行使用了相等比较运算符\
  \ `==`，JavaScript 与许多其他语言共享该运算符，但有一个巨大的陷阱：\n\n```\n> \"1\" == 1;     // 噢！\n\ntrue\n\
  ```\n\n换句话说，JavaScript 认为字符串 `\"1\"` 等于数字 `1`，至少在使用 `==` 进行比较时是这样。\n\n作为编程语言，这种行为是不寻常的，对于从其他语言转向\
  \ JavaScript 的人来说，这可能是令人沮丧的错误来源。为了避免混乱，最好使用三等号：\n\n```\n> \"1\" === 1;     // 这可能是你想要的。\n\
  \nfalse\n```\n\n在教程的其余部分，我们将始终使用 `===` 进行相等比较。\n\n上述比较的返回值始终为 `true` 或 `false`）被称为布尔值，以数学家和逻辑学家乔治·布尔（George\
  \ Boole）（图 2.6)\n\n[5]. 图片由 Yogi Black/Alamy Stock Photo 提供。\n\n![images](img/02fig06.jpg)\n\
  \n**图 2.6：** 真还是假？这是乔治·布尔的照片。\n\n布尔值对于控制流特别有用，控制流允许我们根据比较结果采取行动（列表 2.6）。\n\n**代码列表\
  \ 2.6：** 使用 `if` 的控制流。\n\n```\n> let password = \"foo\";\n\n> if (password.length\
  \ < 6) {\n\n    \"Password is too short.\";\n\n  }\n\n'Password is too short.'\n\
  ```\n\n注意在列表 2.6 中，`if` 之后的比较在括号内，而字符串在大括号 `{...}` 内部。\n\n\n\n\n\n```\n> password\
  \ = \"foobar\";\n\n> if (password.length < 6) {\n    \"Password is too short.\"\
  ;\n  } else {\n    \"Password is long enough.\";\n  }\n'Password is long enough.'\n\
  ```\n\nListing 2.7 中的第一行通过为 `password` 赋新值来重新定义了它（不需要 `let`，因为在之前已经定义过了）。重新赋值后，`password`\
  \ 变量的长度为 6，因此 `password.length < 6` 的结果为 `false`。结果是语句的 `if` 部分（称为 `if` 分支）不会被评估；相反，JavaScript\
  \ 会评估 `else` 分支，结果是一个指示密码长度足够的消息。\n\n### 2.4.1 合并与反转布尔值\n\n布尔值可以使用 `&&`（“与”）、`||`（“或”）和\
  \ `!`（“bang”或“非”）运算符进行合并或反转。\n\n让我们从 `&&` 开始。当使用 `&&` 比较两个布尔值时，只有当两者都为 `true`时，组合结果才为\
  \ `true`。例如，如果我说我既想要薯条又想要烤土豆，那么这种组合为 `true` 的唯一方法就是我能对“你想要薯条吗？”和“你想要烤土豆吗？”这两个问题回答“是”（true）。如果我对其中任何一个问题的回答是\
  \ `false`，那么组合结果也必须是 `false`。由此产生的可能组合组合被称为“真值表”，显示在 Listing 2.8 中。\n\n**Listing\
  \ 2.8:** `&&`（“与”）的真值表。\n\n```\n> true && true\n\ntrue\n\n> false && true\n\nfalse\n\
  \n> true && false\n\nfalse\n\n> false && false\n\nfalse\n```\n\n我们可以像 Listing 2.9\
  \ 所示将将其应用于条件语句中。\n\n**Listing 2.9:** 在条件中使用 `&&` 运算符。\n\n```\n> let x = \"foo\"\
  ;\n\n> let y = \"\";\n\n> if (x.length === 0 && y.length === 0) {\n    \"两个字符串都是空的!\"\
  ;\n  } else {\n    \"至少有一个字符串是非空的.\";\n  }\n'至少有一个字符串是非空的.'\n```\n\n在 Listing 2.9\
  \ 中，`y.length` 实际上是 `0`，但 `x.length` 不是，所以组合结果为 `false`（与 Listing 2.8 一致），因此 JavaScript\
  \ 评估了 `else` 分支。\n\n与 `&&` 不同，`||` 允许我们在任一比较（或两者都）为 `true` 时采取行动 Listing 2.10。\n\
  \n**Listing 2.10:** `||`（“或”）的真值表。\n\n```\n> true || true\n\ntrue\n\n> true || false\n\
  \ntrue\n\n> false || true\n\ntrue\n\n> false || false\n\nfalse\n```\n\n我们可以像 Listing\
  \ 2.11 所示在条件语句中使用 `||`。\n\n**Listing 2.11:** 在条件中使用 `||` 运算符。\n\n```\n> if (x.length\
  \ === 0 || y.length === 0) {\n    \"至少有一个字符串是空的!\";\n  } else {\n    \"两个字符串都不是空的.\"\
  ;\n  }\n'至少有一个字符串是空的!'\n```\n\n注意来自 Listing 2.10，`||` 并不是排他的，这意味着即使当两个语句都为 `true`\
  \ 时，结果也是 `true`。这与口语中的用法形成对比，在口语中，像“我想要薯条或烤土豆”这样的语句意味着你想要薯条或者烤土豆，但两者都不要（Figure 2.8）。^(7)\n\
  \n7. 图片感谢来自 Rikaphoto/Shutterstock。\n\n![images](img/02fig08.jpg)\n\n**Figure 2.8:**\
  \ 结果证明我只想要薯条。\n\n除了 `&&` 和 `||` 之外，JavaScript 还支持通过“非”运算符 `!`（通常读作“bang”）进行取反，它只是将\
  \ `true` 转换为 `false`，将 `false` 转换为 `true`（Listing 2.12）。\n\n**Listing 2.12:** `!`\
  \ 的真值表。\n\n```\n> !true\n\nfalse\n\n> !false\n\ntrue\n```\n\n我们可以像 Listing 2.13\
  \ 所示在条件语句中使用 `!`。\n\n**Listing 2.13:** 在条件中使用 `!` 运算符。\n\n```\n> if (!(x.length\
  \ === 0)) {\n  \"x 不是空的.\";\n  } else {\n  \"x 是空的.\";\n}\n'x 不是空的.'\n```\n\nListing\
  \ 2.13 中的代码是有效的，因为它简单地反转了 `x.length === 0`，产生了 `true`：\n\n```\n> (!(x.length ===\
  \ 0)\ntrue\n```\n\n在这种情况下，更常见的是使用 `!==`（“不等于”）：\n\n```\n> if (x.length !== 0) {\n\
  \    \"x 不是空的.\";\n  } else {\n  \"x 是空的.\";\n  }\n```\n\n### 2.4.2 Bang Bang\n\n\
  并不是所有的布尔值都是比较的结果，事实上，每个 JavaScript 对象在布尔上下文中都有一个 `true` 或 `false` 的值。我们可以使用 `!!`\
  \ 强制 JavaScript 使用布尔上下文（`!!` 读作“bang bang”，这是因为 `!` 会在 `true` 和 `false` 之间转换，使用两个感叹号让我们回到了原始值）：\n\
  \n```\n> !!true\n\ntrue\n\n> !!false\n\nfalse\n```\n\n使用这个技巧可以让我们看到一个像 `\"foo\"\
  ` 这样的字符串在布尔上下文中是 `true`：\n\n```\n> !!\"foo\"\n\ntrue\n```\n\n恰好，空字符串在布尔上下文中是 `false`：^(8)。这种正是随语言而异的细节。例如，在\
  \ Ruby 中，即使是空字符串在布尔上下文中也是 `true`。\n\n```\n> !!\"\"\nfalse\n```\n\n因此，我们可以像 Listing\
  \ 2.9 所示，通过省略长度（同时反转 `x` 和 `y`）来更简洁地重写 Listing 2.14：\n\n**Listing 2.14:** 使用条件强制布尔上下文。\n\
  \n```\n> if (!x && !y) {\n    \"两个字符串都是空的!\";\n  } else {\n    \"至少有一个字符串是非空的.\"\
  ;\n  }\n'x 是非空的.'\n```\n\n### 2.4.3 练习\n\n1. 如果 `x` 是 `\"foo\"` 且 `y` 是 `\"\"`，`x\
  \ && y` 的值是多少？使用“bang bang”验证 `x && y` 在布尔上下文中是 false。*提示*:将整个表达式包裹在括号中。\n2. `x\
  \ || y` 是什么？它在布尔上下文中是什么？重写 Listing 2.14 以使用 `x || y`，确保结果相同。*提示*: 切换字符串的顺序。\n\n\
  ## 2.5 方法\n\n如第 2.4 节](#ch02.xhtml_ch4）所示，JavaScript 对象只有一个属性（`length`），但它们支持多种方法。^(9)\
  \ 在面向对象的编程语言中，特定的字符串或字符串实例被认为“响应”某个特定方法，如在第 1.3.1 节](#ch01.xhtml_ch1sec1)中首次使用的点符号。\n\
  \n9. 回想第 1.3.1 节](#ch01.xhtml_ch1sec1)，方法是一种特殊的函数，它附加到对象上并被调用。例如，字符串响应实例方法 `toLowerCase()`，它（令人惊讶地！）将字符串转换为全小写字母（Figure\
  \ 2.9）：^(10)。\n\n10. 图片感谢来自 Pavel Kovaricek/Shutterstock。\n\n![images](img/02fig09.jpg)\n\
  \n**Figure 2.9:** 原来这只蜜蜜獾曾是 HONEY BADGER，但他不在乎。\n\n```\n$ node\n\n> \"HONEY BADGER\"\
  .toLowerCase();\n\n'honey badger'\n```\n\n这种方法可能非常有用，例如在统一电子邮件地址的小写字母时：^(11)。\n\n\
  11. 如果你退出并重新进入 Node 控制台，`firstName` 可能不再定义，因为此类定义不会在会话之间持续。如果是这样，应用你的技术专业知识（Box\
  \ 1.1;\n\n> `${username}@example.com`;   // 电子邮件地址\n\n'michael@example.com'\n```\n\
  \n注意，与 `length` 属性不同，方法必须带参数调用，即使没有参数。这就是为什么\n\n```\ntoLowerCase()\n```\n\n\n\n\n\
  以圆合括号结尾：`toLowerCase` 是一个不接受任何参数的函数。请注意，官方 JavaScript 字符串方法也遵循相同的大小写约定（首字母小写的驼峰命名法），这正是我们在第\
  \ 2.2 节中介绍过的。\n\n正如你可能猜到的那样，JavaScript 也支持相反的操作；在看下面的示例之前，看看你是否能猜出将字符串转换为大写的方法（图\
