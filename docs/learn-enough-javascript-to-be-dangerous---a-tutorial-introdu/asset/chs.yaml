  \n**框 8.1: Semver**\n\n您可能在列表 8.1 中注意到我们为新模块使用了版本号 0.1.0。前前的零表示我们的包处于早期阶段，通常被称为“beta”（非常早期项目甚至称为“alpha”）。\n\
  \n我们可以通过增加版本号中间的数字来表示更新，例如从 0.1.0 变为 0.2.0、`0.3.0` 等。错误修复通过增加最右侧的数字表示，如 0.2.1、`0.2.2`，而成熟版本（供他人使用，可能与之前的版本不兼容）由版本\
  \ 1.0.0 表示。\n\n这些命名约定被称为*语义版本化*（semantic versioning），简称 *semver*。有关更多信息，请参见 NPM\
  \ 关于如何使用语义版本的文章（[`docs.npmjs.com/about-semantic-versioning`](https://docs.npmjs.com/about-semantic-versioning)）。\n\
