  \ Branch Name with Learn Enough and the Rails Tutorial”（[`news.learnenough.com/default-git-branch-name-with-learn-enough-and-the-rails-tutorial`](https://news.learnenough.com/default-git-branch-name-with-learn-enough-and-the-rails-tutorial)）。\n\
