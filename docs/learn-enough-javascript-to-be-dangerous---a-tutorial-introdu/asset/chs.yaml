  \n  return // FILL IN\n\n}\n```\n\n# 第 9 章：事件与 DOM 操控\n\n在本章中，我们将回到 JavaScript 的原生环境，并将新创建的\
  \ Node 模块在浏览器中运行。具体来说，我们将制作一个简单的单页 JavaScript 应用程序，它接收用户输入的字符串并指示该字符串是否为回文。\n\n\
  我们的方法涉及逐渐增加复杂性，从一个简单的“你好，世界”风格的概念验证（第 9.1 节）开始。然后我们将添加一个提示/警告设计，以此引入事件监听器（第 9.2\
  \ 节）。在第 9.3 节中，我们将用插入页面本身的动态 HTML 替换警告——这是我们第一次操控文档对象模型（DOM）树的示例。最后，在第 9.4 节中，我们将添加\
  \ HTML 表单，这比 JavaScript 提示更方便的数据输入方法。\n\n## 9.1 一个可以运行的回文页面\n\n为了开始构建我们的回文检测器，我们将创建一个\
  \ HTML 文件和网站的主 JavaScript 文件，分别称为 `palindrome.html` 和 `main.js`：\n\n```\n$ cd ~/repos/js_tutorial\n\
  \n$ touch palindrome.html main.js\n```\n\n正如第 1 章所示，我们将创建一个最小的“你好，世界”应用，仅为了证明一切基本正常。为了实现这一点，我们需要安装在第\
  \ 8.1 节中创建的 `<username>-palindrome` 模块：\n\n```\n$ npm install <username>-palindrome\
  \   # 将 <username> 替换为你的用户名\n```\n\n如果由于某种原因没有完成第 8.1 节，你可以使用我版本的模块 `mhartl-palindrome`。\n\
  \n要使用模块导出的 `Phrase` 对象（列表 8.2），我们只需要编辑 `main.js` 并使用 `let` 将名称 `Phrase` 绑定到 `require`\
  \ 函数的结果，如列表 9.1 所示。\n\n**列表 9.1：** 添加一个概念验证。\n\n`main.js`\n\n```\nlet Phrase = require(\"\
  <username>-palindrome\");\n\nalert(new Phrase(\"Madam, I'm Adam.\").palindrome());\n\
  ```\n\n列表 9.1 也包含一个 `alert`，如果它运行，将告诉我们 `require` 成功。\n\n回想第 5.2 节，可以使用 `script`\
  \ 标签的 `src` 属性包含外部 JavaScript 文件（列表 5.5）：\n\n```\n<script src=\"filename.js\"></script>\
  \ \n```\n\n你可能认为我们可以直接包含 `main.js`，如下：\n\n```\n<script src=\"main.js\"></script>\
  \ \n```\n\n遗憾的是，由于浏览器不支持 `require`，这将不起。相反，我们需要使用一个名为 `browserify` 的 NPM 模块（搜索“require\
  \ node module into browser”）：\n\n```\n$ npm install --global browserify\n```\n\n\
  `browserify` 工具将我们的离线代码以浏览器可以理解的方式进行打包，如列表 9.2 所示。\n\n**列表 9.2：** 使用 `browserify`\
  \ 为浏览器准备 JavaScript 程序包。\n\n```\n$ browserify main.js -o bundle.js\n```\n\n使用 `-o`（输出文件）标记，列表\
  \ 9.2 安排创建一个名为 `bundle.js` 的文件，该文件*可以*包含在浏览器中。(1)（browserify 是如何做到的？我不知道。能够使用内部原理神秘的模块是技术老练的一个重要部分。）\n\
