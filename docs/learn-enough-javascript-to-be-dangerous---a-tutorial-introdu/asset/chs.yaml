- "# 学会足够的 JavaScript 以应对挑战 - JavaScript 编程入门指南 [第2版初稿]\n\n\n\n\n\n\n\n\n## 前言\n\n\
  *学习足够的 JavaScript 以以走天下* 旨在让你尽可能快地开始编写实用的现代 JavaScript 程序，使用最新的 JavaScript 技术，并关注软件开发者每天使用的真实工具。JavaScript\
  \ 是一门大语言，相应的教程也极其巨大。但好消息是，你不需要学习所有内容就可以开始——你只需要学习足够变得*危险*的内容。\n\n\n\n\n与大多数 JavaScript\
  \ 教程不同，《学会足够的 JavaScript 以应对挑战》（*Learn Enough JavaScript to Be Dangerous*从一开始就将\
  \ JavaScript 视为一种*通用型*编程语言，因此我们的示例不仅限于浏览器。除了交互式 HTML 网站外，你还将学习如何编写命令行程序和自包含的 JavaScript\
  \ 包。我们甚至有机会探索重要的软件开发实践，如版本控制、函数式编程和测试驱动开发。其结果是一个关于 JavaScript 的实用叙述性介绍——既是对浏览器内编码教程的完美补充，也是对\
  \ Web 上庞杂但难以检索的 JavaScript 参考资料的完美补充。\n\n除了教你特定的技能外，《学会足够的 JavaScript 以应对挑战》还能帮助你培养*技术老练度*（technical\
  \ sophistication）——这种看似像魔术般的、解决几乎任何技术问题的能力。技术老练包括版本控制和 HTML 等具体技能，也包括更模糊的技能，例如 Google\
  \ 搜索错误信息以及知道何时该直接重启那个该死的东西。在*本书*中，我们有充足的机会在真实案例的背景下培养技术老练。\n\n### 章节详解\n\n第 1 章从基础开始，使用多种不同的技术编写一系列简单的“Hello\
  \ World”程序，包括浏览器中的“alert”和使用 `Node.js` 的命令行 脚本（`Node.js` 是一个快速且被广泛使用的 JavaScript\
  \ 程序执行环境）。我们甚至会将一个（非常简单的）动态 JavaScript 应用程序部署到实时 Web。\n\n接下来的三章涵盖了一些最重要的 JavaScript\
  \ 数据结构。第 2 章涵盖了字符串，第 3 章涵盖了数组，第 4 章涵盖了数字、日期和正则表达式等其他原生对象。这些章节合在一起，构成了一个使用 JavaScript\
  \ 进行*面向对象编程*的温和入门。\n\n在第 5 章中，你将学习函数的基础知识，这是几乎每种编程语言的必修课程。第 6 章随后将将这些知识应用于一种优雅且强大的编码风格，被称为*函数式编程*。\n\
  \n第 7 章展示如何利用回文（正读反读都相同的字符串）的示例创建自定义 JavaScript 对象。我们将从最简单的回文定义开始，然后在第 8 章中通过一种名为*测试驱动开发*的强大编程技术进行大幅扩展。在此过程中，你将学习如何创建和发布名为\
  \ *NPM 模块*的自包含 JavaScript 软件包。\n\n第 9 章在回文模块的基础上构建了一个用于检测回文的实时网站。在此过程中，我们将学习事件、*DOM\
  \ 操作、alert、提示（prompts）*以及 HTML*表单*的示例。\n\n第 10 章涵盖了被严重忽视的利用 JavaScript *shell 脚本*的话。你将学习如何从本地文件和实时\
  \ URL 读取文本。你还将学习如何像处理 HTML 网页一样，从普通文本文件中提取信息。\n\n第 11 章通过向你展示如何使用 HTML、CSS 和 JavaScript\
  \ 创建真实的工业级网站来完成本教程。结果是一个交互式图片库，它能根据用户的点击动态更改图像、CSS 类和页面文本。我们通过将完整的示例网站部署到实时 Web\
  \ 来结束课程。\n\n### 额外功能\n\n除了主教程材料外，《学会足够的 JavaScript 以应对挑战》包含了大量的练习，帮助你测试自己的理解并扩展正文中的材料。练习包含频繁的提示，并通常包含预期答案，还可以在\
  \ [www.learnenough.com](http://www.learnenough.com) 单独订阅获取社区解决方案。\n\n### 结语\n\n\
  《学会足够的 JavaScript 以应对挑战》为你提供了关于 JavaScript 基础知识的实用介绍，无论是在它最初的浏览器浏览器领域，还是作为一种通用型编程语言。在学习了本教程涵盖的技巧之后，特别是在培养了你的技术老练度之后，你将掌握编写\
  \ shell 脚本、发布 Node 包以及使用 JavaScript 设计和部署交互式网站所需的所有知识。你也将准备好面对各种其他资源，包括书籍、博客文章和在线文档。一个特别好的后续步骤是学习如何制作动态数据库支持的\
  \ Web 应用程序，这在《学会足够的 Ruby 以应对挑战》和 *Ruby on Rails*™ *教程*中有所涵盖。\n\n### Learn Enough\
  \ 学学金\n\nLearn Enough 致力于为尽可能广泛的人提供技术教育。作为这一承诺的一部分，我们在 2016 年创建了 Learn Enough 学学金计划（[`www.learnenough.com/scholarship`](https://www.learnenough.com/scholarship)）。奖学金获得者可以免费或深度折扣访问\
  \ Learn Enough All Access 订阅，其中包含了所有的 Learn Enough 在线书籍内容、嵌入视频、练习和社区练习答案。\n\n正如\
  \ 2019 年 RailsConf 快速演讲中（[`youtu.be/AI5wmnzzBqc?t=1076`](https://youtu.be/AI5wmnzzBqc?t=1076)）提到的，Learn\
  \ Enough 学学金的申请过程极其简单：只需填写一个机密文本区域，告诉我们一些关于你的情况。奖学金标准慷慨且灵活——我们理解想要奖学金的原因有许多，从学生身份到失业状态，再到生活在对美元汇率不利的国家。迄为止，Learn\
  \ Enough 已为全国及各地的有志开发人员授予了 2500 多份奖学金。如需申请，请访问 Learn Enough 页面 `www.learnenough.com/scholarship`。也许下一个奖学金获得者就是你！\n\
  \n\n\n\n你无法学到 JavaScript 的所有知识——那需要数千页的内容和几个世纪的努力——但你将学会足够的 JavaScript 来变得`独当一面`（图\
  \ 1.1）。^(1)\n\n1. 图片由谢 Kirk Fisher/Shutterstock 提供。\n\n![images](img/01fig01.jpg)\n\
  \n**图 1.1:** JavaScript 知识就像罗马一样，不是一天之功的。\n\n《Learn Enough JavaScript to Be Dangerous》没有编程前提条件，尽管如果你有过编程经验，那无疑大有益。重要的是你已经开始培养自己的`技术素养`（框\
  \ 1.1），无论是自学还是使用之前的 Learn Enough 教程（[`www.learnenough.com/courses`](https://www.learnenough.com/courses））。这些教程包含了以下内容，它们共同构成了本书良好的先决条件列表：\n\
  \n1. *Learn Enough Command Line to Be Dangerous*（[https://www.learnenough.com/command-line](https://www.learnenough.com/command-line)）\n\
  2. *Learn Enough Text Editor to Be Dangerous*（[`www.learnenough.com/text-editor`](https://www.learnenough.com/text-editor)）\n\
  3. *Learn Enough Git to Be Dangerous*（[`www.learnenough.com/git`](https://www.learnenough.com/git)）\n\
  4. *Learn Enough HTML to Be Dangerous*（[`www.learnenough.com/html`](https://www.learnenough.com/html)）\n\
  5. *Learn Enough CSS & Layout to Be Dangerous*（[`www.learnenough.com/cssand-layout`](https://www.learnenough.com/cssand-layout)）\n\
  \n**框 1.1: 技术素养**\n\n使用计算机的一个基本方面是独立发现问题和排排除故障的能力，我们在 Learn Enough（[`www.learnenough.com/`](https://www.learnenough.com/)）将这种能力称为`技术素养`。\n\
  \n培养技术素养不仅意味着遵循系统性的教程，如 *Learn Enough Command Line to Be Dangerous*、*Learn Enough\
  \ Git to Be Dangerous*、*Learn Enough HTML to Be Dangerous* 以及 *Learn Enough CSS\
  \ & Layout to Be Dangerous*，还要知道何时该跳出结构化的演示，直接开始在 Google 上搜索解决方案。\n\n《Learn Enough\
  \ JavaScript to Be Dangerous》将为我们提供充足的机会来练习这项本质的技术技能。\n\n正如上文提到的，Web 上有大量的 JavaScript\
  \ 参考资料，但除非你已经基本上知道自己在做什么，否则这些资料很难使用。本教程的目标之一是成为解锁文档的钥匙。这将包括许多指向我喜爱的 JavaScript 资源——Mozilla\
  \ 开发者网络（MDN）Web 文档（或简称为“MDN”）。\n\n特别是随着讲解内容的不断深入，我还会经常包含我为了找出如何完成当前特定任务而使用的确切网络搜索词。例如，如何使用\
  \ JavaScript 返回页面上所有匹配某个特定 CSS 类的元素？如下所示：`javascript css class return all elements`。\n\
  \n为了学会足够的 JavaScript 以变得独当一面，我们将从头开始，使用不同的技术编写一系列简单的“Hello, World”程序（第 1 章），包括对\
  \ `Node.js` 的介绍，这是一种快速且广泛使用的 JavaScript 程序执行环境。根据 Learn Enough “凡事求真”的哲学，即使在第 1\
  \ 章，我们也会向实时 Web 部署一个（非常简单的）动态 JavaScript 应用程序。\n\n在掌握“Hello, World”之后，我们将浏览一些 JavaScript\
  \ `对象`，包括字符串（第 2 章）、数组（第 3 章）以及其他原生对象（第 4 章）。这些章节合在一起，构成了 JavaScript *面向对象编程*的入门介绍。\n\
  \n在第 5 章中，我们将学习`函数`的基础知识知识，这是几乎每种编程语言都至关重要的课题。然后，我们将这些知识应用于一种优雅且强大的编码风格，被称为*函数式编程*（第\
  \ 6 章）。\n\n在涵盖了内置 JavaScript 对象的基础后，在第 7 章中，我们将学习如何创建自己的对象。特别是，我们将为一个短语（短语）定义一个对象，然后开发一个方法来判断该短语是否为`回文`（正读反读都相同的字符串）。\n\
  \n我们最初的回文实现将相当初级，但我们将在第 8 章中使用一种名为*测试驱动开发*（TDD）的强大技术进行扩展。在此过程中，我们将学习更多关于测试的知识，以及如何创建和发布一个名为`NPM\
  \ module`的自包含软件软件包（从而加入由 `npm`，即 Node 包管理器管理的庞大且不断增长的软件包生态系统）。\n\n在第 9 章中，我们将新的\
  \ NPM 模块应用于一个 JavaScript Web 应用程序：一个用于检测回文的网站。这将让我们有机会学习`事件`和`DOM 操作`。我们将从最简单的实现开始，然后增加逐渐复杂的扩展。\n\
  \n在第 10 章中，我们将学习使用 JavaScript 编写非简单的`脚本`，这是一个经常被忽视的话题，包含了从文件和 URL 读取数据，就像处理一个 HTML\
  \ 页面一样。\n\n在第 11 章中，我们将把第 9 章和第 10 章](#ch10.xhtml_ch10)的技术应用于一个真实的工业级网站。特别是，我们将扩展\
  \ *Learn Enough CSS & Layout To Dangerous* 的示例应用程序，添加一个功能性的图片库，它可以根据用户的点击动态更改图像、CSS\
  \ 类和页面文本。（我们将使用 `Git` 直接 `clone` 仓库，因此即使你没有完成 *Learn Enough CSS & Layout To Dangerous*，也能构建该图片库。）\n\
  \n\n\n我们现在称为 `JavaScript` 的语言最初由其 Netscape 创造者称为“LiveScript”，但在计划发布当时，由 Sun Microsystems\
  \ 开发的语言 `Java` 正引起着极大的热度。为了利用这一热度，Netscape 将 LiveScript 的名称改为“JavaScript”——这让开发者们在疑惑它与\
  \ `Java` 有什么关系时产生了无尽的困惑。（答案是：毫无关系。）后来，人们创建一个名为 `ECMAScript` 的 `JavaScript` 标准版本（读音为\
  \ ECK-muh-script），旨在提高跨浏览器兼容性。从技术上讲，大多数人所说的“JavaScript”更恰切的称呼本应是“ECMAScript”，而 `JavaScript`\
  \ 仅是 ECMAScript 最常见的实现方式，但在本教程中，我们遵循通用惯例，使用“JavaScript”来泛指这种语言。该规则的一个主要例外是我们偶尔会使用诸如“ES6”之类的缩写名称，它指的是\
  \ `ECMAScript` 的第六版（这是一个特别巨大且重要的更新，为 ECMAScript/JavaScript 标准增加了许多实用功能）。\n\n最后，值得注意的是，写成“Javascript”（小写“s”）的拼写方式极其常见，以至于在相对正式的背景下也几乎可以接受。坦率地说，我觉得“Javascript”这种拼写比那个相当呆板的官方版本更有吸引力，但从技术角度讲它是错误的，因此在教程中我们将坚持使用“JavaScript”，并保持技术上的准确。\n\
  \n为了给您提供最全面的 `JavaScript` 编程介绍，*Learn Enough JavaScript to Be Dangerous* 使用了四种主要方法：\n\
  \n1. 运行在用户浏览器中的前端 `JavaScript` 程序\n2. 带有 `Node.js` 读-评估-打印循环（REPL）的交互式提示符\n3. 独立的\
  \ `JavaScript` 文件（包括 Node 包管理器）\n4. Shell 脚本（如在 *Learn Enough Text Editor to Be\
  \ Dangerous* 中介绍的）\n\n我们将从这一悠老的主题——“hello, world”程序的四种变体开始学习 `JavaScript`，这一传统可以追溯到\
  \ C 语言语言的早期。“hello, world”的主要目的是确认我们的系统配置正确，能够执行一个在屏幕上打印字符串 `hello, world!`（或某些类似的变体）的简单程序。从设计上来说，该程序非常简单，使我们能够专注于让程序运行起来这一挑战本身。\n\
  \n由于 `JavaScript` 原始且目前最常见的应用是编写在 Web 上执行的程序，我们将从编写（并部署！）一个在网页浏览器中显示问候信息的程序开始。然后，我们将使用\
  \ `JavaScript` 执行系统 `Node.js` 编写系列三个程序：首先在 Node REPL 中，然后在一个名为 `hello.js` 的 JavaScript\
  \ 库文件中，最后在一个名为 `hello` 的可执行 shell 脚本中。\n\n在接后的内容中，我假设您可以访问兼容 Unix 的系统，如 macOS、Linux\
  \ 或 Cloud9 IDE，正如免费教程 *Learn Enough Dev Environment to Be Dangerous* 中描述的那样。如果您无法访问此类系统，建议在继续之前遵循\
  \ *Learn Enough Dev Environment to Be Dangerous*。（如果您使用云端 IDE，我建议创建一个名为 `javascript-tutorial`\
  \ 的开发环境。）\n\n*给 Mac 用户的提示*：尽管在 *Learn Enough JavaScript to Be Dangerous* 中这并不重要，但建议您使用\
  \ Bourne-again shell (Bash) 而不是默认的 Z shell 来完成本教程。要将您的 shell 切换到 Bash，请在命令行运行 `chsh\
  \ -s /bin/bash`，输入密码并重启终端程序。任何产生的警告信息都可以安全忽略。更多信息请参阅 Learn Enough 博客文章“Using Z Shell\
  \ on Macs with the Learn Enough Tutorials”。\n\n## 1.2 浏览器中的 JS\n\n尽管 `JavaScript`\
  \ 越来越多地被用作通用编程语言，但它在浏览器这一原生栖息地仍然蓬勃发展。因此，我们的第一个“hello, world”程序涉及在网页上显示一个由 `JavaScript`\
  \ 代码创建的通知或 `alert`。\n\n我们将首先使用 `mkdir -p`（它会在需要时创建中间目录）为本教程创建一个目录，并使用 `touch` 命令创建一个\
  \ HTML 索引文件。\n\n如果您正在使用 *Learn Enough Dev Environment to Be Dangerous* 推荐的云端 IDE，我建议将主目录\
  \ `~` 替换为目录 `~/environment`，尽管教程在这两种情况下运行效果应该是样的。您可以在 *Learn Enough Command Line\
  \ to Be Dangerous* 中找到此类 Unix 命令的内容。\n\n```\n$ mkdir -p ~/repos/js_tutorial\n\n\
  $ cd ~/repos/js_tutorial\n\n$ touch index.html\n```\n\n接下来，我们将遵循 *Learn Enough Git\
  \ to Be Dangerous* 中引入的实践，使用 Git 将我们的项目纳入版本控制：\n\n```\n$ git init\n\n$ git add -A\n\
  \n$ git commit -m \"Initialize repository\"\n```\n\n此时，我们准备好进行第一次编辑了。我们将从熟悉的领域开始，为我们的索引页面添加一个简单的\
  \ HTML 骨架（不包含 JavaScript），如列表 1.1 所示。结果出现在图 1.2。\n\n![images](img/01fig02.jpg)\n\
  \n**图 1.2：**我们的初始静态索引页。\n\n**列表 1.1：** 一个 HTML 骨架。\n\n`index.html`\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n  <head>\n    <title>Learn Enough JavaScript</title>\n    <meta\
  \ charset=\"utf-8\">\n  </head>\n  <body>\n    <h1>Hello, world!</h1>\n    <p>This\
  \ page includes an alert written in JavaScript.</p>\n  </body>\n</html>\n```\n\n\
  这个页面的段落有一点点是谎言，因为我们还没有添加任何 JavaScript。让我们通过放入一个包含单个命令的 `script` 标签来改变这一点：\n\n```\n\
  <script>\n   alert(\"hello, world!\");\n</script>\n```\n\n在这里我们使用了 `alert`，它是 JavaScript\
  \ `function`，即接收参数并对它们执行某些任务的代码。如图 1.3 所示，`JavaScript` 函数调用的结构是函数名、左括号、零或多个参数、右括号以及结束行的行的分号。\n\
  \n![images](img/01fig03.jpg)\n\n**图 1.3：** JavaScript 函数调用的结构。\n\n在这种情况下，`alert`\
  \ 接收一个 `string` 并在浏览器中以 alert 的形式显示它。为了看到效果，我们将 `alert` 代码添加到我们的索引页面，如列表 1.2 所示。从技术上讲，我们可以将\
  \ `script` 标签放置在页面的任何位置，但惯例将其放在文档的 `head` 中（特别是当引入外部 JavaScript 文件时，正如我们在第 5.2 节看到的）。\n\
  \n**列表 1.2：** JavaScript 编写的“Hello, world!”。\n\n\n\n\n\n```\n<!DOCTYPE html>\n\n\
  <html>\n  <head>\n    <title>学会足够的 JavaScript</title>\n    <meta charset=\"utf-8\"\
  >\n    <script>\n      alert(\"hello, world!\");\n    </script>\n  </head>\n  <body>\n\
  \    <h1>Hello, world!</h1>\n    <p>此页面包含一个用 JavaScript 编写的警告框。</p>\n  </body>\n\
  </html>\n```\n\n刷新页面后，我们的浏览器现在显示了一个友善的问候（图 1.4）。\n\n![images](img/01fig04.jpg)\n\
  \n**图 1.4：** “hello, world!” 警告框的结果。\n\n### 1.2.1 部署\n\n最后一步，让我们把极其精妙的 JavaScript\
  \ 应用部署到实时 Web 上。我们使用的技术与 *Learn Enough Git to Be Dangerous*、*Learn Enough HTML to\
  \ Be Dangerous* 以及 *Learn Enough CSS & Layout to Be Dangerous* 中涵盖的方法相同，即托管在 GitHub\
  \ Pages 上的免费网站。\n\n即使在这么早阶段进行部署也是一种强大的概念验证——抛开对我们“极其精妙”应用的的玩笑不谈，我们确实在部署一个实时网站，这在几年前是一个极其困难的步骤，而现在我们几秒钟内就能完成。\n\
  \n首先，让我们提交列表 1.2 中完成的更改：\n\n```\n$ git commit -am \"Add a JavaScript 'hello, world'\"\
  \n```\n\n下一步是在 GitHub 上创建一个新的远程仓库，如图 1.5 所示。（如果你对这些步骤中的任何一步不熟悉，请参阅 *Learn Enough\
  \ Git to Be Dangerous* 了解详情。）\n\n![images](img/01fig05.jpg)\n\n**图 1.5：** 在 GitHub\
  \ 上创建新仓库。\n\n接下来，用远程仓库配置你的本地系统，并将其推送到远程（注意将 `<username>` 替换为您的 GitHub 用户名，并在提示密码时使用\
  \ GitHub 个人访问令牌），然后进行推送：\n\n```\n$ git remote add origin https://github.com/<username>/js_tutorial.git\n\
  \n$ git push -u origin main\n```\n\n由于视频相对较难更新，本书配套的视频演示使用的是 `master`（这是 Git 存在前\
