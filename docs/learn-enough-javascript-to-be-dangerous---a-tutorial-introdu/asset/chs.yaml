  1. 通过填充列表 8.7 中的代码，为像“RaceCar”这样的大小写回文添加测试。测试套件仍然是 GREEN 吗？\n\n2. 为了 100% 确保测试正在测试我们认为它们测试的内容，良好的做法是通过故意破坏测试来进入失败状态（RED）。依次更改应用程序代码以破坏每个现有测试，然后在恢复原始代码后确认它们再次变为\
