  **Figure 5.8：** 成功的表情符号反转。\n\n**Listing 5.12：** 返回电子邮件部分\n\n```javascript\nfunction\
  \ emailParts(email) {\n  // 在此处实现\n}\n```\n\n## 5.4 迭代\n\n到到为止，我们看到了几种迭代的示例：字符串（Section\
  \ 2.6）、数组（Section 3）和对象（Section 4）。在本节中，我们将学习 `forEach`，它允许我们对数组的每个元素执行操作，而无需使用索引变量。将：\n\
  \n```\nfor (let i = 0; i < array.length; i++) {\n\n  console.log(array[i]);\n}\n\
  ```\n\n改为：\n\n```javascript\narray.forEach(function(element) {\n\n  console.log(element);\n\
  });\n```\n\n\n\n结果是一个字符数组，我们可以使用 `forEach` 对其进行迭代。\n\n我们首先在 `foreach.js` 文件中包含列表\
  \ 2.15 中的 `soliloquy` 变量，然后使用 `Array.from` 和 `forEach`。生成的代码（我们将将其放在列表 5.13 中的数组迭代之后）如列表\
  \ 5.15 所示。\n\n**列表 5.15：** 使用 `forEach` 循环遍历字符串。\n\n*foreach.js*\n\n```javascript\n\
  .\n\n.\n\n.\n\nlet soliloquy = \"To be, or not to be, that is the question:\";\n\
  \nArray.from(soliloquy).forEach(function(character) {\n\n  console.log(character);\n\
  \n});\n```\n\n在命令行中执行列表 5.15 中的程序，得到的输出与我们在列表 2.18 中看到的相同（在此情况下，之前是来自列表 5.14 的输出），如列表\
  \ 5.16 所示。\n\n**列表 5.16：** 字符串迭代的输出。\n\n```bash\n$ node foreach.js\n\nant\n\nbat\n\
  \ncat\n\n42\n\nT\n\no\n\nb\n\ne\n\n.\n\n.\n\n.\n\nt\n\ni\n\no\n\nn\n\n:\n```\n\n\
  使用 `forEach` 方法，我们可以直接遍历数组中的元素，从而避免了输入 Mike Vanier 的*心头之患*——“for (i = 0; i < N;\
  \ i++)”。结果是更简洁的代码和更快乐的程序员（图 5.9）。\n\n![images](img/05fig09.jpg)\n\n**图 5.9：** 使用\
  \ `forEach` 让 Mike Vanier 变得快乐了一些。\n\n### 5.4.1 练习\n\n1. 使用节 5.1.2 中的箭头符号重写列表 5.13\
  \ 中的 `forEach` 循环。\n\n2. 我们在列表 5.1 中看到了如何定义一个数字比较函数，让我们能够对 JavaScript 数组进行数值排序。在在那里我们使用了\
  \ `1`、`-1` 和 `0` 的返回值，但事实证明 `sort` 只关心比较的*符号*，所以 `17` 等于 `1`，`-42` 等于 `-1` 等。对于数字\
  \ `a` 和 `b`，值 `a - b` 具有正确的符号，请证明列表 5.17 中使用匿名函数的代码能够正确地对数组排序。\n\n3. 写一个 `forEach`\
