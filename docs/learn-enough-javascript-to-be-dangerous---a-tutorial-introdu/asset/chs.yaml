  \ 通过一个名为 `Math` 的全局对象支持更高级的操作，该对象具有用于数学常数、指数（幂）、根和三角函数的属性和方法。增加对双星号 `**` 幂的支持正在进行中，但到编写时尚未在全球范围内实现。\n\
