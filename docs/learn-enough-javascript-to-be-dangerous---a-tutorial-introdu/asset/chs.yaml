  \ === \"Helloworld\"\n\n  this.letters = function letters() {\n\n      return Array.from(this.content).filter(c\
  \ => c.match(/[a-z]/i)).join(\"\");\n  }\n\n  // 如果短语是回文则返回 true，否则返回 false。\n\n\
