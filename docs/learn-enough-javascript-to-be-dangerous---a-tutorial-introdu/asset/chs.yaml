  \  let thumbnails = document.querySelectorAll(\"#gallery-thumbs > ??? > ???\");\n\
  \n  let mainImage = document.querySelector(\"#gallery-photo img\");\n\n  .\n\n \
  \ .\n\n  .\n\n}\n```\n\n## 11.3 设置图像为当前\n\n第 11.2 节 代表了一项重大成就：照片图库的主要任务——即根据用户的点击切换主显示图像——已经完成。我们现在需要做的是更改第一列（本节）中的“当前图像”指示，并更新第三列（第\
  \ 11.4 节）中的图像信息。这两个任务都涉及新旧技术的结合。\n\n如 Listing 11.3 所示，HTML 源代码中使用一个名为 `current`\
  \ 的 CSS 类来指示当前图像：\n\n```\n<div class=\"current\">\n\n   <img src=\"/images/small/beach.jpg\"\
  \ alt=\"Venice Beach\"\n\n        data-large-version=\"/images/large/beach.jpg\"\
  \n\n        data-title=\"Venice Beach\"\n\n        data-description=\"加州威尼斯海滩的俯拍图。\"\
  >\n\n</div>\n```\n\n这由于 `main.css` 中的某行代码产生了橙色的框阴影：\n\n```css\n.\n.\n.\n.gallery-thumbs\
  \ .current img {\n\n  box-shadowshadow: 0 0 0 5px #ed6e2f;\n\n  opacity: 1;\n\n\
  }\n\n.\n.\n.\n```\n\n我们的基本策略是向 Listing 11.4 中的监听器添加代码，从当前缩略图上移除当前图像指示，并将其移动到被点击的缩略图上。这比看起来要稍微复杂一点，因为该类不在图像上，而是在环图像的\
  \ `div` 上。幸运的是，JavaScript 让我们能够轻松地上下遍历 DOM，因此我们可以轻松访问树中上一层的 DOM 元素（图 9.6）——所谓的父节点。\n\
  \n简而言之，我们更改当前图像类的算法如下：\n\n1. 找到当前缩略图并移除 `current` 类。\n2. 为被点击图像的父元素添加 `current`\
  \ 类。\n\n由于页面上只有一个类名为 `current` 的元素，我们可以使用 `querySelector` 选择它：\n\n```javascript\n\
  document.querySelector(\".current\");\n```\n\n但我们如何移除该类呢？啊：javascript dom 移除类。这引导我们使用\
  \ `classList` 方法及其连带的 `remove` 方法：\n\n```javascript\ndocument.querySelector(\".current\"\
  ).classList.remove(\"current\");\n```\n\n这里有很多方法链，但其意义足够清晰。\n\n幸运的是，一旦我们知道如何找到元素的父节点（javascript\
  \ dom 父节点），我们就可以使用相应的 `classList.add` 方法（javascript dom 添加类）来添加所需的类：\n\n```javascript\n\
  thumbnail.parentNode.classList.add(\"current\");\n```\n\n将这些组合在一起意味着我们已经完成了！结果出现在\
  \ Listing 11.7 中（包含了解决第 11.2.1 节中练习题的答案）。\n\n**Listing 11.7:** 更改当前类。\n\n`js/gallery.js`\n\
  \n```javascript\n// 激活图像图库。\n\n// 主要任务是为图库中的每个图像绑定事件监听器\n// 并在点击时做出相应响应。\n\nfunction\
  \ activateGallery() {\n\n  let thumbnails = document.querySelectorAll(\"#gallery-thumbs\
  \ > div > img\");\n\n  let mainImage = document.querySelector(\"#gallery-photo img\"\
  );\n\n  thumbnails.forEach(function(thumbnail) {\n    thumbnail.addEventListener(\"\
  click\", function() {\n      // 设置当前图像为显示图像。\n      let newImageSrc = thumbnail.dataset.largeVersion;\n\
  \      mainImage.setAttribute(\"src\", newImageSrc);\n\n      // 更改哪个图像是当前的。\n \
  \     document.querySelector(\".current\").classList.remove(\"current\");\n    \
  \  thumbnail.parentNode.classList.add(\"current\");\n    });\n  });\n}\n```\n\n\
  作为 Listing 11.7 中代码的结果，点击缩略图会自动更新当前图像，无论是位于蒙特利湖山（图 11.12）还是加利福尼亚州的亨廷顿（图 11.13）。\n\
