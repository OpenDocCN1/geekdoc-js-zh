  \ Flexbox（参见第 5 卷，第 2 章）和 Grid（参见第 5 卷，第 3 章）。\n\n## 网页木工：如何构建表格\n\n好了，是时候给 HTML\
  \ 表格踩上油门，开始制作这些表格内容了。接下来的几节将带你完成构建基础表格的步骤。\n\n### 最简单的情况：单行表格\n\n作为一个示例，我将构建一个与食物相关的有趣城市名称的简单表格。为什么不呢？表格总是从以下容器开始：\n\
  \n```html\n<table>\n</table>\n```\n\n所有其他表格标签都放在这两个标签之间。接下来，你添加表格体的容器（即行和列，不包括稍后会学到的表头）。\n\
  \n```html\n<table>\n<tbody>\n</tbody>\n</table>\n```\n\n在你准备好这个基础结构后，剩余大部分表格工作都涉及以下四个步骤的过程：\n\
  \n1.  **添加一行。**\n2.  **将该行分为你需要的列数。**\n3.  **在每个单元格中插入数据。**\n4.  **重复步骤 1 到 3 直到完成。**\n\
  \n要添加一行，你在 `<tbody>` 和 `</tbody>` 之间丢入 `<tr>`（表格行）标签和一个 `</tr>` 标签（其对应的结束标签）：\n\n\
  ```html\n<table>\n<tbody>\n<tr></tr>\n</tbody>\n</table>\n```\n\n现在，通过在 `<tr>` 和\
  \ `</tr>` 之间放置 `<td>` 标签将行分为你需要的列数。例如，如果你想要三列，这样做：\n\n```html\n<table>\n<tbody>\n\
  <tr>\n<td></td><td></td><td></td>\n</tr>\n</tbody>\n</table>\n```\n\n现在通过输入 `<td>`\
  \ 及其结束标签 `</td>` 输入每个单元格的数据：\n\n```html\n<table>\n<tbody>\n<tr>\n<td>Candy</td>\n\
  <td>New Mexico</td>\n<td>59</td>\n</tr>\n</tbody>\n</table>\n```\n\n![HTML 表格的示意图，将数据在行、列和单元格中进行矩形排列。](img/9781394164684-fg020401.png)\n\
  \n图 4-1： HTML 表格是将数据在行、列和单元格中进行矩形排列。\n\n为了确保你理解正在发生什么（毕竟这是我的工作），请查看一些表格术语：\n\n*\
  \   **行（Row）：** 横跨表格的单行数据“线”。\n*   **列（Column）：** 单个垂直数据区域。在图 4-1 表格中，有五列。\n*  \
  \ **单元格（Cell）：** 行和列的交叉点。单元格保存着你用来展示表格的单个数据项。\n*   **标题（Caption）：** 出现在（通常）表格上方的文本，用于描述表格的内容。\n\
  *   **表头（Headers）：** 表格的第一行。表头是可选的，但许多人使用它们来标记每一列。\n\n### 创建表头行\n\n如果你的表格显示统计数据、财务数据或数值信息，很有可能你的读者将无法弄懂一或多列内容的含义。例如，回回看图\
  \ 4-3。你知道第三列中的数字代表什么吗？你可能猜得到，但你真的不希望你的读者对你的数据做猜测。\n\n### 添加行\n\n当第一行准备好后，对其他行重复该操作。对于我的示例，这里是\
  \ HTML：\n\n```html\n<table>\n<tbody>\n<tr>\n<td>Candy</td>\n<td>New Mexico</td>\n\
  <td>59</td>\n</tr>\n<tr>\n<td>Hot Coffee</td>\n<td>Mississippi</td>\n<td>2586</td>\n\
  </tr>\n<tr>\n<td>Ketchuptown</td>\n<td>South Carolina</td>\n<td>84</td>\n</tr>\n\
  <tr>\n<td>Sandwich</td>\n<td>New Hampshire</td>\n<td>1354</td>\n</tr>\n<tr>\n<td>Two\
  \ Egg</td>\n<td>Florida</td>\n<td>3683</td>\n</tr>\n</tbody>\n</table>\n```\n\n\
  为了让代码更易读，我将每一行的 `td` 元素放在单行内。图 4-3 显示了目前的进展（查看 bk02ch04/example02.html）。\n\n![完成表格体的截图。很好看！](img/9781394164684-fg020403.png)\n\
  \n图 4-3： 完成的表格体。很好看！\n\n\n\n\n\n你可以通过在每列的顶部添加描述该列内容的标签，来让读者的阅读变得更轻松。（你不需要冗长的解释；在大多数情况下，一两个单词即可完成。）要添加这些标签，你首先需要创建一个名为\
  \ `head:` 的新表格部分：\n\n```html\n<thead>\n\n</thead>\n```\n\n将此部分放置在 `<tbody>` 标签的正上方。\n\
  \n现在，你来创建一个 `header row`（表头行）。这与普通行类似，不同之处在于将 `<td>` 和 `</td>` 替换为 `<th>`（表格表头单元格）和\
  \ `</th>`，如下所示：\n\n```html\n<thead>\n  <tr>\n    <th>第一列表头</th>\n    <th>第二列表头</th>\n\
  \    <th>以此类推，直到产生厌烦</th>\n  </tr>\n</thead>\n```\n\n如代码所示，`th` 元素与 `td` 元素非常相似。区别在于，浏览器会将显示在\
  \ `<th>` 和 `</th>` 标签之间的文本显示为**粗体**并且在单元格内**居中对齐**。这有助于读者将表头与表格其余数据区分开来。不过请记住，表头是可选的；如果你的表格不需要表头，可以跳过它们。\n\
  \n好了，为你的示例表格添加表头部分和表头行：\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th>城镇</th>\n\
  \      <th>州</th>\n      <th>人口</th>\n    </tr>\n  </thead>\n  <tbody>\n    等。\n\
  \  </tbody>\n</table>\n```\n\n图 4-4 显示了带有列标题的表格（bk02ch04/example03.html）。\n\n![示例表格的截图，现在添加了列标题。](img/9781394164684-fg020404.png)\n\
  \n图 4-4： 示例表格，现在添加了列标题。\n\n### 添加标题 (Caption)\n\n下一个基础表格元素是 `caption`（表格标题）。标题是一个简短的描述（一或两句话），用于告诉读者表格的目的。你使用\
  \ `<caption>` 元素来定义标题：\n\n```html\n<caption>\n  此处填写标题文字\n</caption>\n```\n\n你紧接在\
  \ `<table>` 标签之后添加标题代码。默认情况下，浏览器会将标题显示在表格上方居中的位置，但你可以通过一些 CSS 来更改此默认设置（查看本章后面的“更改标题的位置”）。这是我添加了标题的表格代码的第一部分：\n\
  \n```html\n<table>\n  <caption>\n    有趣的基于食物的城镇名称\n  </caption>\n  <thead>\n   \
  \ 等。\n  </thead>\n</table>\n```\n\n图 4-5 显示了带有标题的表格（bk02ch04/example04.html）。\n\n\
  ![示例表格的截图，添加了标题。](img/9781394164684-fg020405.png)\n\n图 4-5： 添加了标题的示例表格。\n\n### 创建表头\
  \ (Header column)\n\n在某些表格中，第一列的值充当描述该行内容的标签。HTML 并没有为这种列头提供特定的元素，但你可以通过将第一列中的 `<td>`\
  \ 和 `</td>` 替换为 `<th>` 和 `</th>` 来来实现。这告诉浏览器将第一列的内容显示为**粗体**并在单元格内**居中**。这里有一个示例（bk02ch04/example05.html）：\n\
  \n```html\n<table>\n  <caption>\n    第五季度销售情况\n  </caption>\n  <thead>\n    <tr>\n\
  \      <th></th><th>销量</th>\n      <th>总销售额</th>\n    </tr>\n  </thead>\n  <tbody>\n\
  \    <tr>\n      <th>小配件</th><td>5732</td><td>$28,603</td>\n    </tr>\n    <tr>\n\
  \      <th>小部件</th><td>8502</td><td>$59,429</td>\n    </tr>\n    <tr>\n      <th>小装置</th><td>10468</td><td>$41,767</td>\n\
  \    </tr>\n    <tr>\n      <th>各种小件</th><td>4498</td><td>$40,437</td>\n    </tr>\n\
  \    <tr>\n      <th>各种名称</th><td>7165</td><td>$57,248</td>\n    </tr>\n  </tbody>\n\
  </table>\n```\n\n需要注意的一点是，头部部分的第一个单元格使用了 `<th></th>`。这告诉浏览器不要在该单元格中显示任何内容。图 4-6\
  \ 显示了表格在浏览器中的外观。\n\n![带有列头的表格截图。](img/9781394164684-fg20406.png)\n\n图 4-6： 带有列头的表格。\n\
  \n### 创建页脚 (Footer)\n\n如果你的表格数据适用于某种总结（例如一或多列的总和或平均值），你可以将该总结放在表格的底部。你从由 `<tfoot>`\
  \ 和 `</tfoot>` 标签构建的容器开始：\n\n```html\n<tfoot>\n</tfoot>\n```\n\n将此部分放置在 `<tbody>`\
  \ 标签下方。现在你创建一个 `footer row`（页脚行）。这是一个使用 `<tr>` 元素制作普通行，加上你需要的任何 `<td>`（或 `<th>`）元素：\n\
  \n```html\n<tfoot>\n  <tr>\n    <td>第一列页脚</td>\n    <td>第二列页脚</td>\n    <td>另一列页脚</td>\n\
  \  </tr>\n</tfoot>\n```\n\n将 `<tfoot>` 元素插入到 `<tbody>` 标签下方，如下示例所示（bk02ch04/example06.html）：\n\
  \n```html\n<table>\n  <caption>\n    第五季度销售情况\n  </caption>\n  <thead>\n    <tr>\n\
  \      <th></th><th>销量</th>\n      <th>总销售额</th>\n    </tr>\n  </thead>\n  <tbody>\n\
  \    <tr>\n      <th>小配件</th><td>5732</td><td>$28,603</td>\n    </tr>\n    <tr>\n\
  \      <th>小部件</th><td>8502</td><td>$59,429</td>\n    </tr>\n    <tr>\n      <th>小装置</th><td>10468</td><td>$41,767</td>\n\
  \    </tr>\n    <tr>\n      <th>各种小件</th><td>4498</td><td>$40,437</td>\n    </tr>\n\
  \    <tr>\n      <th>各种名称</th><td>7165</td><td>$57,248</td>\n    </tr>\n  </tbody>\n\
  \  <tfoot>\n    <tr>\n      <th>总计</th><td>3365</td><td>$227,484</td>\n    </tr>\n\
  \  </tfoot>\n</table>\n```\n\n图 4-7 显示了带有页脚行的表格。\n\n![带有页脚行的表格截图。](img/9781394164684-fg20407.png)\n\
  \n\n\n\n\n`一条将城市老雅士与具有简单、传统或缺乏文化趣味的人隔开来的虚拟界限。`\n\n如图 4-8 所示，第一列左对齐，第二列居中对齐，第三列右对齐，第四列两端对齐。\n\
  \n![text-align 取值效果的截图](img/9781394164684-fg020408.png)\n\n图 4-8： `text-align` 值的实际应用。\n\
  \n![技术细节](img/technicalstuff.png) 注意，我在第四个 `td` 标签中添加了声明 `width: 200px;`。如果不限制宽度，该列将占据浏览器窗口中的所有可用宽度，从而无法显示两端对齐的效果。请参阅第三部分的第\
  \ 1 章以了解更多关于 `width` 属性的信息。同样注意，我为每个单元格添加了边框，以便更容易观察对齐情况。查看本章节稍后的“添加边框”，学习如何处理表格边框。\n\
  \n### 垂直对齐单元格文本\n\n你也可以在单元格内垂直对齐文本。如果单元格很大（因为它包含大量文本或较大的图像），而你想调整同一行中其他单元格的垂直位置，这就会非常有用。要控制单元格内的垂直对齐，你可以使用\
  \ CSS 的 `vertical-align` 属性：\n\n```css\nselector {\n  vertical-align: value;\n}\n\
  ```\n\n或者作为属性使用：\n\n```html\nstyle=\"vertical-align: value;\"\n```\n\n对于 `value`，`vertical-align`\
  \ 属性支持许多预定义的关键字，以下是你需要了解的：\n\n- `bottom`: 将文本与单元格底部对齐。\n- `middle`: 将文本与单元格的垂直中心对齐。这是默认的垂直对齐方式。\n\
  - `top`: 将文本与单元格顶部对齐。\n\n例如，如果你想让所有的 `td` 元素与其单元格顶部对齐而不是居中对齐，可以在 CSS 中添加以下规则：\n\n\
  ```css\ntd {\n  vertical-align: top;\n}\n```\n\n这是一个较大的示例，展示了所有三个 `vertical-align`\
  \ 值（bk02ch04/example08.html）：\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th>Idiom</th>\n\
  \      <th>Part of Speech</th>\n      <th>First Used</th>\n      <th>Definition</th>\n\
  \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td style=\" vertical-align:\
  \ top;\">\n        goat cheese curtain\n      </td>\n      <td style=\" vertical-align:\
  \ middle;\">\n        noun\n      </td>\n      <td style=\" vertical-align: bottom;\"\
  >\n        2012\n      </td>\n      <td style=\"text-align: justify; width: 200px;\"\
  >\n        一条将城市老雅士与具有简单、传统或缺乏文化趣味的人隔开来的虚拟界限。\n      </td>\n    </tr>\n  </tbody>\n\
  </table>\n```\n\n如图 4-9 所示，第一列顶部对齐，第二列居中对齐，第三列底部对齐。\n\n![vertical-align 取值演示的截图](img/9781394164684-fg020409.png)\n\
  \n图 4-9： `vertical-align` 值的演示。\n\n## 添加边框\n\n默认情况下，网页浏览器显示的表格不带任何边框，无论是整个表格周围还是行与列之间。这种无边框的状态通常不是致命问题，因为由于单元格项目宽度的不同，大多数表格单元格内部都有足够的空白。\n\
  \n然而，如果表格项目在每列中的宽度大致相同，表格可能会开始看起来非常拥挤，如图 4-10 (bk02ch04/example09.html）所示。\n\n![某些表格看起来可能非常拥挤的截图](img/9781394164684-fg020410.png)\n\
  \n图 4-10： 某些表格看起来可能非常拥挤。\n\n让此类表格更容易阅读的一种方法是在表格本身以及每行每列之间都添加边框。要构建边框，你需要使用 CSS。具体来说，你可以使用\
  \ `border` 属性的以下简化语法：\n\n```css\nselector {\n  border: width style color;\n}\n```\n\
  \n在这里，`selector` 是你想要样化的元素，`border` 属性接受以下值：\n\n- `width`: 边框的厚度，用任何 CSS 认可的单位表示（例如像素\
  \ `px`）。\n- `style`: 边框的类型，可以是以下任意一种：`dotted`、`dashed`、`double`、`groove`、`inset`、`outset`\
  \ 或 `solid`。\n- `color`: 边框的颜色，可以是任何 CSS 认可的颜色（例如 `black`）。\n\n\n\n\n\n例如，为了给表格的\
  \ `th` 和 `td` 元素添加 5 像素的内边距（padding），你需要在 CSS 中添加以下规则：\n\n```css\nth, td {\npadding:\
  \ 5px;\n}\n```\n\n图 4-13 显示了更新后的表格（`bk02ch04/example12.html`](example12.html)）。啊，这样好多了。\n\
  \n![为每个单元格添加了内边距的表格截图](img/9781394164684-fg020413.png)\n\n**图 4-13：**\n\n### 更改标题的位置\n\
  \n如果你为表格添加了标题（caption），默认情况下，网页浏览器会将标题文本放在表格上方。如果你希望表格标题出现在表格下方，可以使用 `caption-side`\
  \ 属性来实现这一目标：\n\n```css\ncaption {\ncaption-side: bottom;\n}\n```\n\n图 4-14 显示了一个标题位于底部的表格（`bk02ch04/example13.html](example13.html)）。\n\
  \n![标题位于底部的表格截图](img/9781394164684-fg020414.png)\n\n**图 4-14：**\n\n# 第 5 章\n\n#\
  \ 使用表单使页面交互\n\n## 本章内容\n\n- ![Bullet](img/check.png) 理解网页表单基础知识\n- ![Bullet](img/check.png)\
  \ 添加一个或两个按钮\n- ![Bullet](img/check.png) 插入文本框和文本区域\n- ![Bullet](img/check.png) 添加复选框和单选按钮\n\
  - ![Bullet](img/check.png) 使用列表和标签\n- ![Bullet](img/check.png) 在页面上放置选择器\n\n*从最初的阶段开始，HTML5\
  \ 中的表单现在变得极其灵活和强大，它原生提供了许多多年年来我们作为开发者一直在通过 JavaScript 手动添加的功能。*\n\n— PETER GASSTON\n\
  \n在网络上发布页面绝对是一次令人兴奋的体验。但在这种最初的兴奋感消失后，你可能会注意到一个发布后的副作用：你的页面就那样静静地呆在那里。诚实地说，呆在那里对于页面来说并不是一个糟糕的状态，因为发布到网络的真正意义在于发布别人想读的信息。在这种情况下，让页面静静待着是件好事。\n\
  \n尽管如此，如果你的某些页面能为好奇的访问者提供更多内容，那就更好了。与其让人们总是点进来，读一会儿你的内容，然后离开，如果还能提供一些能让他们多留一会儿的东西，那不是很棒吗？想些办法让你的页面更具交互性怎么样？\n\
  \n啊，你现在才说对频道了，因为 HTML *确实*提供了一种将静止的网页转变为交互式页面的机制：网页表单。在本章中，你将探索网页表单提供的所有功能。在掌握基础知识后，你将研究\
  \ HTML 网页表单提供的惊功能，这些功能不仅包括按钮、文本框和列表等标准组件，还包括用于选择日期和颜色等更高级控件。这是一场真正的表单盛宴，准备好大快享吧！\n\
  \n## 什么是网页表单？\n\n大多数现代程序在需要从你那里提取某些信息时，会在你面前弹出一个对话框。例如，选择程序的 `Print`（打印）命令可能会显示某种\
  \ `Print` 对话框。该对话框的目的是询问信息，例如你需要的份数、想要打印的页面、想要使用的打印机等。\n\n表单本质上是网页版的对话框。它是一个页面区域，填充了文本框、列表、复选框、命令按钮和其他控件，用于从用户那里获取信息。例如，图\
  \ 5-1](0001.html) 显示了我网站上的一个表单。这是一个人们可以用它向我发送信息的表单。该表单包含一个用于姓名的文本框、另一个用于电子邮件地址、一个用于消息的较大文本区域，以及一个将数据发送到我服务器的命令按钮。\n\
  \n![典型网页表单的截图](img/9781394164684-fg020501.png)\n\n**图 5-1：**\n\n网页表单是一个小型的数据收集机器。它可以收集什么类型的数据？只要你想到的都可以：\n\
  \n- 文本，从单个单词到长篇帖子\n- 数字、日期和时间\n- 列表中选择了哪一项（或哪些项）\n- 复选框是否被选中\n- 一组单选按钮中选择了哪一个\n\n\
  在你收集这些数据后，数据会发生什么？数据有两条路可以走：服务器街（Server Street）和本地巷（Local Lane）。\n\n### 在服务器街上驰驰\n\
  \n服务器街路线意味着你的 Web 服务器参与了进来。以下是发生的基本步骤：\n\n1. 用户点击按钮提交表单。\n2. 你的 `JavaScript` 代码收集并准备发送表单数据。\n\
  3. 代码将表单数据发送到服务器上的脚本。\n4. 服务器脚本提取表单数据。\n5. 服务器脚本以某种方式处理表单数据（例如，通过从数据库获取信息）。\n6.\
  \ 服务器脚本输出所请求的数据或某种指示操作结果的代码。\n7. 你的 `JavaScript` 代码处理从服务器返回的数据并相应地更新网页。\n\n如果这一切听起来复杂得令人生畏，你是对的：它确实如此，这就是为什么它超出了本书的范范围。\n\
  \n![Tip](img/tip.png) 如果你真的感兴趣将表单数据提交到服务器，我有另一本书会告诉你你需要的一切。它叫《自学者 Web Web 编码与开发大全》（Web\
  \ Coding and Development All-in-One For Dummies, Wiley）。\n\n### 在本地巷散步\n\n本地巷路线完全不涉及\
  \ Web 服务器：\n\n1. 用户以某种方式更改表单数据。\n2. 你的 `JavaScript` 代码检测到更改的数据。\n3. 与表单字段关联的 `JavaScript`\
  \ 代码根据更改的数据更新网页。\n\n啊，这简单得多，不是吗？但通过这种有限的表单处理你可以做什么呢？\n\n- **添加过滤器：** 如果你的页面非常长，你可以给读者提供一个表单，让他们能够过滤内容。\n\
  - **隐藏和显示内容：** 如果你的页面包含许多折叠小部件（即点击时会显示某些隐藏内容的对象；它们也被称为*手风琴*），你可以添加按钮来一次性显示或隐藏所有内容。\n\
  - **自定义页面：** 你可以提供一个表单让访问者以某种方式自定义页面外观（例如，更改颜色或字体）。\n- **存储用户偏好：** 你可以使用表单获取访问者的个人信息或偏好，并将这些数据存储在浏览器中。\n\
  - **计算内容：** 你可以构建一个表单接收一个或多个输入，然后显示计算结果（例如贷款还款或从英制单位到公制单位转换）。\n- **增强可访问性：** 你可以使用表单让访问者激活辅助功能，如高对比度颜色和更大的字号。\n\
  \n在本章中，我将遵循“本地巷”的慢速节奏，并教你如何构建可以在本地使用的表单。要学习处理表单事件，你需要 JavaScript，所以我将这部分推迟到第四本第\
  \ 11 章。\n\n\n\n\n\n![Remember](img/remember.png) 因为你只是用表单为网页添加本地交互，而不会向服务器提交任何表单数据，从技术上讲，你完全不需要\
  \ `<form>` 标签。然而，在大多数情况下你应该使用它，因为包含 `<form>` 标签允许用户通过按 Enter 或 Return 键提交表单，而且在移动浏览器中还会为你提供提交按钮（如“前往”）。\n\
  \n### 添加表单按钮\n\n大多数表单都包含一个按钮，用户在完成表单并想要启动表单底层操作时点击它。这被称为*提交*表单，该术语传统上是指表单数据发送到服务器端脚本进行处理。然而，如今（至少在本本书中），提交”表单也可以意味着在不向服务器发送任何内容的情况下更新网页内容。例如，点击按钮可能会设置页面的背景颜色。\n\
  \n提交表单的旧样式是使用 `<input>` 标签并将 `type` 属性设置为 `submit`：\n\n```\n<input type=\"submit\"\
  \ value=\"buttonText\">\n```\n\n这里的 `buttonText` 是显示在按钮上的文本的占位符。\n\n例如：\n\n```\n\
  <input type=\"submit\" value=\"Submit Me!\">\n```\n\n这种样式在现代 Web 开发中很少使用，因为对这种按钮进行样式设置比较困难。出于这个原因，大多数\
  \ Web 开发者改用 `<button>` 标签：\n\n```\n<button type=\"submit\">buttonText</button>\n\
  ```\n\n这里的 `buttonText` 同样代表显示在按钮上的文本。\n\n例如：\n\n```\n<button type=\"submit\">Ship\
  \ It</button>\n```\n\n![Tip](img/tip.png) 为了让按钮更好看，使用 CSS 对以下内容进行样式设置：\n\n*   **圆角：**\
  \ 要控制按钮角的圆圆度，请使用 `border-radius` 属性，将其设置为测量值（例如像素）或百分比。例如：\n\n    ```\n    button\
  \ {\n      border-radius: 15px;\n    }\n    ```\n\n*   **投影：** 要给按钮添加投影，应用 `box-shadow:`\
  \ `x` `y` `blur` `color` 属性，其中 `x` 是投影的水平偏移量，`y` 是投影的垂直偏移量，`blur` 是投影的模糊程度，`color`\
  \ 是投影颜色。例如：\n\n    ```\n    button {\n      box-shadow: 3px 3px 5px grey;\n    }\n\
  \    ```\n\n#### 使用文本字段\n\n基于文本的字段是最常用的表单元素，大部分它们都使用 `<input>` 标签：\n\n```\n<input\
  \ type=\"textType\" name=\"textName\" value=\"textValue\" placeholder=\"textPrompt\"\
  >\n```\n\n*   `textType`：你想在表单使用的文本字段类型。\n*   `textName`：分配给字段的名称。\n*   `textValue`：字段的初始值（如果有）。\n\
  *   `textPrompt`：页面首次加载时临时显示在字段中的文本，用于提示用户所需的输入。当用户开始在字段中输入时，占位符文本就会消失。\n\n以下是你可以用于\
  \ `type` 属性的可用文本类型列表：\n\n*   `text`：显示一个文本框，用户可以在其中输入一行文本。添加 `size` 属性来指定字段的宽度（以字符为单位，默认值为\
  \ `20`）。这是一个示例：\n\n    ```\n    <input type=\"text\" name=\"company\" size=\"50\"\
  >\n    ```\n\n*   `number`：显示一个文本框，用户可以在其中输入数值。大多数浏览器会添加一个计数器（spin box），允许用户通过点击向上或向下箭头分别递增或减少数字。查看这个示例：\n\
  \n    ```\n    <input type=\"number\" name=\"points\" value=\"100\">\n    ```\n\n\
  \    我还应该提到 `range` 类型，它显示一个滑块控件，允许用户点击并拖动在指定的最小和最大值之间选择数值：\n\n    ```\n    <input\
  \ type=\"range\" name=\"transparency\" min=\"0\" max=\"100\" value=\"100\">\n  \
  \  ```\n\n*   `email`：显示一个文本框，用户可以在其中输入电子邮箱地址。添加 `multiple` 属性允许用户输入两个或多个用逗号分隔的地址。添加\
  \ `size` 属性来指定字段的宽度（以字符为单位）。给你的示例：\n\n    ```\n    <input type=\"email\" name=\"\
  user-email\" placeholder=\"you@yourdomain.com\">\n    ```\n\n*   `url`：显示一个文本框，用户可以在其中输入\
  \ URL。添加 `size` 属性来指定字段的宽度（以字符为单位）。例如：\n\n    ```\n    <input type=\"url\" name=\"\
  homepage\" placeholder=\"e.g., http://domain.com/\">\n    ```\n\n*   `tel`：显示一个文本框，用户可以在其中输入电话号码。使用\
  \ `size` 属性来指定字段的宽度（以字符为单位）。这是一个示例：\n\n    ```\n    <input type=\"tel\" name=\"\
  mobile\" placeholder=\"(xxx)xxx-xxxx\">\n    ```\n\n*   `time`：显示一个文本框，用户可以在其中输入时间（通常是小时和分钟）。\n\
  \n    ```\n    <input type=\"time\" name=\"start\">\n    ```\n\n*   `password`：显示一个文本框，用户可以在其中输入密码。出于安全考虑字符会被屏蔽。添加\
  \ `autocomplete` 属性来指定浏览器是否应自动填充。使用 `off` 禁用此功能。例如：\n\n    ```\n    <input type=\"\
  password\" autocomplete=\"off\">\n    ```\n\n*   `search`：显示一个文本框，用户可以在其中输入搜索词。添加\
  \ `size` 属性来指定字段的宽度（以字符为单位）。例如：\n\n    ```\n    <input type=\"search\" name=\"q\"\
  \ placeholder=\"Search...\">\n    ```\n\n*   `hidden`：向表单中添加一个你想包含但不想让用户注意到的输入字段。这是一个示例：\n\
  \n    ```\n    <input id=\"userSession\" name=\"session\" type=\"hidden\" value=\"\
  jwr274\">\n    ```\n\n那是有很多相关的文本字段，但还没结束！还有两个你需要了解的：\n\n*   `<textarea>`：此标签显示一个可以在其中输入多行文本的文本框。添加\
  \ `rows` 属性来指定显示的行数。如果你想在文本框中显示默认文本，请在 `<textarea>` 和 `</textarea>` 之间添加文本。\n\n\
  \    ```\n    <textarea name=\"message\" rows=\"5\">\n默认文本。\n    </textarea>\n \
  \   ```\n\n*   `<label>`：将标签与表单字段关联。使用标签有两种方法：\n\n    方法 #1 — 用 `<label>` 和 `</label>`\
  \ 标签包裹字段，并在字段之前或之后插入标签文本，如下：\n\n    ```\n    <label>\n      Email:\n      <input\
  \ type=\"email\" name=\"user-email\" placeholder=\"you@yourdomain.com\">\n    </label>\n\
  \    ```\n\n    方法 #2 — 为字段标签添加一个 `id` 值，将 `<label>` 标签的 `for` 属性设置为相同的值，并在 `<label>`\
  \ 和 `</label>` 之间插入标签文本，就像我在这里这样做：\n\n    ```\n    <label for=\"useremail\">Email:</label>\n\
  \    <input id=\"useremail\" type=\"email\" name=\"user-email\" placeholder=\"you@yourdomain.com\"\
  >\n    ```\n\n\n\n\n\n你在 Web 表单中使用复选框（checkbox）来开启（即选中复选框）或关闭设置（即取消选中复选框）。你通过在表单中包含以下版本的\
  \ `<input>` 标签创建一个复选框：\n\n```html\n<input type=\"checkbox\" name=\"checkName\" value=\"\
  checkValue\" [checked]>\n```\n\n*   `checkName`: 你想赋予复选框的名称。\n*   `checkValue`:\
  \ 你想赋予复选框的值。\n*   `checked`: 当此可选属性存在时，复选框初始为被选中状态。\n\n这是一个示例（查看 `bk02ch05/example02.html`）：\n\
  \n```html\n<fieldset>\n  <legend>\n    你恐怕什么？（请勾选所有适用项）：\n  </legend>\n  <label>\n\
  \    <input type=\"checkbox\" name=\"phobia\" value=\"Ants\">恐鼠症（恐惧蚂蚁）\n  </label>\n\
  \  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Bald\">秃发症（恐惧秃头）\n\
  \  </label>\n  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Beards\"\
  \ checked>恐须症（恐惧胡子）\n  </label>\n  <label>\n    <input type=\"checkbox\" name=\"\
  phobia\" value=\"Bed\">恐床症（恐惧睡觉）\n  </label>\n  <label>\n    <input type=\"checkbox\"\
  \ name=\"phobia\" value=\"Chins\" checked>恐颌症（恐惧下巴）\n  </label>\n  <label>\n   \
  \ <input type=\"checkbox\" name=\"phobia\" value=\"Flowers\">恐花症（恐惧花）\n  </label>\n\
  \  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Flying\">恐高症（恐惧飞行）\n\
  \  </label>\n  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Purple\"\
  >恐紫症（恐惧紫色）\n  </label>\n  <label>\n    <input type=\"checkbox\" name=\"phobia\"\
  \ value=\"Teeth\" checked>恐齿症（恐惧牙齿）\n  </label>\n  <label>\n    <input type=\"checkbox\"\
  \ name=\"phobia\" value=\"Thinking\">恐思症（恐惧思考）\n  </label>\n  <label>\n    <input\
  \ type=\"checkbox\" name=\"phobia\" value=\"Vegetables\">恐菜症（恐惧蔬菜）\n  </label>\n\
  \  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Fear\" checked>恐恐症（恐惧恐惧）\n\
  \  </label>\n  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Everything\"\
  >泛恐症（恐惧一切）\n  </label>\n</fieldset>\n```\n\n关于这段代码的一些要点：\n\n*   你使用 `<fieldset>`\
  \ 标签将一组相关的表单字段组合在一起。\n*   你使用 `<legend>` 标签为父元素 `fieldset` 创建一个标题说明图 5-3 显示了它在浏览器中的显示效果。\n\
  *   由于`<input>` 标签被封装在各自的 `<label>` 标签中，用户可以通过点击复选框本身或点击其标签来选择或取消选择每个复选框。\n*   为了让每个复选框单独一行，我为\
  \ `label` 元素的 CSS 添加了 `display: block` 声明。查看第三本书第 1 章了解 `display` 属性的工作原理。\n\n###\
  \ 使用单选按钮\n\n如果你想为用户提供一组相关的选项，且每次只能选择其中一个，那么单选按钮（radio buttons，有时称为选项按钮）是最佳选择。表单单选按钮以两个或更多一组的形式聚集，并且组内只有一个按钮可以被选中。如果用户点击该组中的另一个按钮，它将被选中，而之前选中的按钮将取消选中。\n\
  \n![一些复选框表单字段的截图，封装在一个带有 legend 元素的 fieldset 组中。](img/9781394164684-fg020503.png)\n\
  \n图 5-3： 一些复选框表单字段，封装在一个带有 `legend` 元素的 `fieldset` 组中。\n\n你使用以下版本的 `<input>` 标签创建单选按钮：\n\
  \n```html\n<input type=\"radio\" name=\"radioGroup\" value=\"radioValue\" [checked]>\n\
  ```\n\n*   `radioGroup`: 你想赋予单选按钮组的名称。所有使用相同 `name` 值的单选按钮都属于该组。\n*   `radioValue`:\
  \ 你想赋予单选按钮的值。如果在提交表单时此单选按钮被选中，则发送此值。\n*   `checked`: 当此可选属性存在时，单选按钮初始为被选中状态。\n\n\
  这是一个示例，图 5-4 显示了发生了什么（`bk02ch05/example03.html`）：\n\n```html\n<fieldset>\n  <legend>\n\
  \    选择配送方式\n  </legend>\n  <div>\n    <input type=\"radio\" id=\"carrier-pigeon\"\
  \ name=\"delivery\" value=\"pigeon\">\n  </div>\n  <div>\n    <input type=\"radio\"\
  \ id=\"carrier-pigeon\" name=\"delivery\" value=\"pony\">\n    <label for=\"carrier-pigeon\"\
  >信鸽</label>\n  </div>\n  <div>\n    <input type=\"radio\" id=\"snail-mail\" name=\"\
  delivery\" value=\"snail\">\n    <label for=\"snail-mail\">蜗牛</label>\n  </div>\n\
  \  <div>\n    <input type=\"radio\" id=\"some-punk\" name=\"delivery\" value=\"\
  bike\" checked>\n    <label for=\"some-punk\">斑马</label>\n  </div>\n</fieldset>\n\
  ```\n\n![单选按钮的截图。](img/9781394164684-fg02004.png)\n\n### 选择列表\n\n选择列表（selection\
  \ lists）在 HTML 表单中很常见：为了创建列表容器，你使用 `<select>` 标签：\n\n```html\n<select name=\"selectName\"\
  \ size=\"\n```\n\n*   `selectName`: 你想赋予选择列表的名称。\n*   `selectSize`: 列表中可见的行数。如果省略此值，浏览器将以下拉框的形式显示列表。\n\
  *   `multiple`: 当此属性存在时，允许用户选择多个选项。\n\n对于列表中的每个项目，你在 `<select>` 和 `</select>` 标签之间添加一个\
  \ `<option>` 标签：\n\n```html\n<option value=\"optionValue\" []>\n```\n\n*   `optionValue`:\
  \ 你想赋予列表选项的值。\n*   `selected`: 当此可选属性存在时，该列表选项初始被选中。\n\n以下是一些示例（`bk02ch05/example04.html`）：\n\
  \n```html\n<form>\n  <div>\n    <label for=\"hair-color\">选择你的发色：</label>\n    <select\
  \ id=\"hair-color\" name=\"hair-color\">\n      <option value=\"black\">黑色</option>\n\
  \      <option value=\"blonde\">金色</option>\n      <option value=\"brunette\" selected>褐色</option>\n\
  \      <option value=\"red\">红色</option>\n      <option value=\"neon\">荧色</option>\n\
  \      <option value=\"none\">无</option>\n    </select>\n  </div>\n  <div>\n   \
  \ <label for=\"hair-style\">选择你的发型：</label>\n    <select id=\"hair-style\" name=\"\
  hair-style\" size=\"4\">\n      <option value=\"bouffant\">蓬松头</option>\n      <option\
  \ value=\"mohawk\">莫霍头</option>\n      <option value=\"page-boy\">齐肩头</option>\n\
  \      <option value=\"permed\">烫发</option>\n      <option value=\"shag\">百层剪</option>\n\
  \      <option value=\"straight\" selected>直发</option>\n      <option value=\"none\"\
  >款式？什么款式？</option>\n    </select>\n  </div>\n  <div>\n    <label for=\"hair-products\"\
  >过去一年使用的发产品：</label>\n    <select id=\"hair-products\" name=\"hair-products\" size=\"\
  5\" multiple>\n      <option value=\"gel\">发胶</option>\n      <option value=\"grecian-formula\"\
  >古腊配方</option>\n    </select>\n  </div>\n</form>\n```\n\n\n\n\n\n```html\n<option\
  \ value=\"mousse\">Mousse</option>\n<option value=\"peroxide\">Peroxide</option>\n\
  <option value=\"shoe-black\">Shoe black</option>\n</select>\n</div>\n</form>\n```\n\
  \n这里有三个列表（参考图 5-5）：\n\n*   `hair-color`: 此列表未指定大小，因此浏览器将其显示为下拉列表。\n*   `hair-style`:\
  \ 此列表使用的 `size` 属性值为 `4`，因此列表中可见四个选项。\n*   `hair-products`: 此列表使用的 `size` 值为 `5`，因此列表中可见五个选项。此外，设置了\
  \ `multiple` 属性，因此你可以在列表中选择多个选项。\n\n![选择列表示例的截图。](img/9781394164684-fg020505.png)\n\
  \n图 5-5： 选择列表的一些示例。\n\n### 引入选择器\n\nHTML 还提供了许多其他的 `<input>` 类型，我将它们归为“选择器”（pickers），这意味着在每情况下，字段都会显示一个按钮，点击后会打开一个控件，允许用户选择一个值。以下是可用选择器的快速览：\n\
  \n*   `color`: 打开颜色选择器对话框，允许用户选择颜色。颜色选择器因浏览器和操作系统而异；图 5-6 显示了 Mac 版 Google Chrome。设置\
  \ `#rrggbb` 格式的 `value` 属性来指定初始颜色（默认为黑色：`#000000`）。这是一个示例（bk02ch05/example05.html）：\n\
  \n```html\n<input type=\"color\" name=\"bg-color\" value=\"#4f5392\">\n```\n\n*\
  \   如果你觉得文本 `#rrggbb` 对你没有意义，不用担心：我会在第三本书第 6 章中进行详尽的解释。![Mac 版 Google Chrome 中出现的颜色选择器截图。](img/9781394164684-fg020506.png)\n\
  \n    图 5-6： Mac 版 Google Chrome 中出现的颜色选择器。\n\n*   `date`: 打开日期选择器对话框，使用户可以选择选择日期。图\
  \ 5-7 显示了 Microsoft Edge 版本。设置 `yyyy-mm-dd` 格式的 `value` 属性来指定初始日期。注意，用户看到的日期可能使用不同的格式（例如图\
  \ 5-7 所示的 `mm/dd/yyyy`），但元素返回的值始终是 `yyyy-mm-dd` 格式。这是一个示例（bk02ch05/example06.html）：\n\
  \n```html\n<input type=\"date\" name=\"appt-date\" value=\"2023-08-23\">\n```\n\n\
  ![Microsoft Edge 中出现的日期选择器截图。](img/9781394164684-fg020507.png)\n\n    图 5-7： Microsoft\
  \ Edge 中出现的日期选择器。\n\n*   `file`: 显示一个“选择文件”按钮（参考图 5-8），点击后会打开用户操作系统的文件选择对话框，使用户可以选择文件。你可以添加\
  \ `multiple` 属性来允许用户选择多个文件。这是一个示例（bk02ch05/example07.html）：\n\n```html\n<input type=\"\
  file\" name=\"user-photo\">\n```\n\n![Chrome 中出现的日期选择器截图。](img/9781394164684-fg020508.png)\n\
  \n    图 5-8： Chrome 中出现的日期选择器。\n\n*   `month`: 打开月份选择器对话框（参考图 5-9），使用户可以选择月份和年份。设置\
  \ `yyyy-mm` 格式的 `value` 属性来指定初始月份和年份。用户看到的数值可能是不同的格式（例如 `August 2023`），但元素返回的值始终是\
  \ `yyyy-mm` 格式。这是一个示例（bk02ch05/example08.html）：\n\n```html\n<input type=\"month\"\
  \ name=\"birthday-month\" value=\"2023-08\">\n```\n\n![Microsoft Edge 中出现的月份选择器截图。](img/9781394164684-fg020509.png)\n\
  \n    图 5-9： Microsoft Edge 中出现的月份选择器。\n\n\n\n\n\n![Remember](img/remember.png)\
  \ 在在线讨论和文章中，“无障碍”（accessibility）通常缩写为 `a11y`：即字母 `a`，后面跟着数字 `11`，然后是字母 `y`。为什么是\
  \ 11？因为在 `accessibility` 这个单词中，`a` 和 `y` 之间正好有 11 个字母。此外，`a11y` 看起来像单词 `ally`，强调了任何实现无障碍功能的人都是残障人士盟友。\n\
  \n## 无障碍带来的其他好处\n\n我相信，让你的网页供所有人访问在道德和伦理上都是正确的，这足以成为你所需的动力。然而，让你的页面无障碍化也会带来其他好处。\n\
  \n例如，一个考虑到无障碍构建的页面也是搜索引擎友好的页面，这意味着你的无障碍页面在搜索结果中的排名将高于类似的非无障碍页面。\n\n无障碍页面也为非残障群体提供便利，例如那些关闭图片浏览网页的人或必须应对极慢网速的人。\n\
  \n最后，为无障碍化提供商业理由是非常简单的：\n\n* **无障碍让你立即进入一个大市场：** 根据世界卫生组织的数据，约有 13 亿人患某种形式的严重残障，估计这十多亿人的购买能力超过\
  \ 6 万亿美元。那可是很多零啊！如果你想在你的网站上销售东西，为什么要排除如此巨大的市场份额呢？\n* **无障碍可能是法律要求的行为：** 在许多司法管辖区，商业网站无法访问现在是非法的。大多数国家都制定了政策，要求企业为所有人提供平等访问。如果你的企业网站具有全球影响力，未能使网站无障碍化将使你的公司面临巨大的法律风险。\n\
  \n* **无障碍让你看起来形象良好：** 让你的业务页面对所有人开放可以创造好感，为你的品牌增色，并让你成为解决方案的一部分，而不是问题的一部分。\n\n![Remember](img/remember.png)\
  \ 无论是什么促使你让页面无障碍都是棒的。然而，重要的是，虽然让你的网站对百分之百的访问实现百分之百无障碍可能是一个高尚且值得实现的目标，但从实践上来说这几乎是不可能的，接下来的章节将解释这一点。\n\
  \n## 理解网络无障碍\n\n为了让页面添加功能以实现无障碍难道不是一种负担吗？不，完全不是。只要你从一开始就考虑到平等访问来构建页面，那么整合无障碍功能对你来说只需要花费很少的。\n\
  \n正如你在本章后面将看到的，网络无障碍的实现并不困难或繁琐。或者，我应该说，如果你理解了谁需要无障碍功能以及他们为什么需要，以及残障人士使用哪些类型的辅助技术，那么实现它并不困难或繁琐。接下来的几节将告诉你你需要的所有信息。\n\
  \n### 理解谁需要无障碍\n\n如今对网络创新的主要抱怨之一是，网页开发者正在构建仅解决开发者自身问题的应用程序和服务。食物外卖、杂货上门服务和宠物寄护服务只是众多例子中的几个。这里的问题在于，认为如果我有一个需要解决的问题，那么世界上其他人也一定想解决这个问题。更广泛地说，这些应用程序是网页开发者假定每个使用网站的人基本上和开发者一模一样的例子。\n\
  \n要真正*理解*无障碍，第一步是深刻理解一个简单的事实：\n\n*你的用户不是你*。\n\n特别是是，访问你网站的人中，有令人震惊的高比例（估计在 5% 到\
  \ 20% 之间）将以不同程度伴有某种形式的残障生活。\n\n我谈论的是什么类型的残障？规划无障碍意味着考虑以下情况：\n\n* **视觉：** 包括全盲或部分失明、色盲和视力下降。\n\
  * **听力：** 包括全耳聋或部分耳聋、听力困难、无法听到某些频率的声音以及耳鸣。\n* **运动：** 包括无法使用鼠标等指向设备、活动受限、缺乏精细的运动控制、过度颤抖或抖动，以及反应迟钝或响应时间缓慢。\n\
  * **认知：** 包括学习障碍、注意力问题、记忆力受损和极易分心。\n\n在每情况下，残障可能是与生俱有的，也可能是通过疾病或创伤引起的。然而，重要的是，这些残障中的一个或多个可能仅仅是年龄增长的结果。不再是活力的小鸡（甚至不是夏天的小鸡）的人可能会出现视力下降、部分或完全耳聋、运动控制力下降以及轻度到严重的认知障碍。由于我们的人口（除少数例外）正在迅速老龄化，带有某种形式残障的人上网数量将只会增加。\n\
  \n### 学习用于上网的辅助技术\n\n知道许多访问你页面的人会有某种形式的残障是一回事。然而，除非你也知道这种残障如何改变这些人的网络体验，否则这种知识对你没有太大帮助。视力有限的人如何“阅读”网页？无法控制鼠标的人如何“点击”链接？\n\
  \n这些以及类似问题的答案是，大多数残障人士使用某种形式的软件或硬件工具来帮助他们浏览、阅读、导航和与网页交互。这些工具属于*辅助技术*（assistive technology，简称\
  \ AT）范畴，了解残障人士求助于哪些工具对于帮助你设计无障碍障碍的网页至关重要。\n\n#### 针对视觉残障的辅助技术\n\n视力有限的人使用各种 AT 来让屏幕元素更容易看：\n\
  \n* **屏幕放大器：** 放大部分屏幕的硬件设备或软件程序。Windows 提供 `放大器` 程序；macOS 有 `缩放` 功能。\n* **浏览器的缩放功能：**\
  \ 所有主流网络浏览器都提供放大整个页面的 `缩放` 命令。\n* **自定义字体大小：** 所有主流浏览器都允许用户设置自定义字体大小。\n\n对于盲或近盲的人来说，屏幕阅读器是首选的\
  \ AT。*屏幕阅读器*是一种能够朗读网页上显示的任何文字的软件程序，包括：\n\n* 标题\n* 页面文本\n* 链接文本\n* 图像和其他媒体的描述\n\n\
  虽然有第三方屏幕阅读器，但所有的操作系统都内置了屏幕阅读器，包括 Windows 的 `讲述器` 和 macOS 的 `VoiceOver`。能够免费使用操作系统中强大的屏幕阅读器是一个好消息，这意味着你可以开启它并尝试用它来上网，以感受它是如何工作的。\n\
  \n#### 针对听力残障的辅助技术\n\n听力不好的人通常使用特殊的耳机或助听器来增强声音输入。然而，对于聋或近聋的人，你可以采取一些通融措施：\n\n* 如果你的页面有视频内容，视频应该包含开启字幕的功能。\n\
  * 如果你的页面有音频内容，你应该提供一个指向音频转录的链接。\n\n#### 针对运动残障的辅助技术\n\n\n\n\n\n一些患严重运动障碍的人仅可以通过头戴指针设备浏览网页（或使用任何计算机功能）。然而，对于大多数运动障碍者来说，主要问题是他们缺乏足够的控制力来操作鼠标或触控板。相反，他们依赖键盘与网页进行交互，因此你的页面需要可以通过键盘输入进行导航。请参见本章后后的“让你的页面支持键盘友好”。\n\
  \n## 针对认知障碍的辅助技术\n\n某些特定类型认知障碍的人会使用软件工具来帮助他们专注于当前任务。你也可以设置你的网页来帮助人们专注并避免不必要的困惑：\n\
  \n*   不要为了酷炫而给页面添加花哨装饰。保持页面设计尽可能简单。\n*   让所有页面的导航和布局保持一致。\n*   为诸如填写表单等任务提供清晰、简单的指令。\n\
  *   尽可能遵循网络惯例，例如使用带下划线的链接文本。\n\n## 让你的页面结构具备访问性\n\n到目前为止，提高网页可访问性最简单的方法是将可访问性融入到\
  \ HTML 结构中。这意味着你要跳过许多新关卡并学习许多新标签和属性吗？并不是。恰恰相反：它意味着要使用标题和语义分段元素，正如我在书中前面讨论如何使用它们的方式一样（参见书籍第二卷，第\
  \ 1 章）。\n\n### 分级使用标题\n\n屏幕阅读器用户通常通过导航标题来对页面建立整体感。为了帮助这类用户，你首先应该确保你的标题在朗读时是有意义的，并准确地描述后续章节的内容。你还应该以符合内置层次结构的方式使用标题：\n\
  \n*   **每个页面只使用一个 `h1` 元素：**该 `h1` 元素应该是页面标题。\n*   **使用 `h2` 作为标题：**对于页面上所有的主标题，使用\
  \ `h2` 元素。\n*   **使用 `h3` 作为子标题，依此类推：** 在每个 `h2` 元素内部，主要的子标题应该是 `h3` 元素。同样地，在 `h3`\
  \ 内部，主要的次子标题应该是 `h4` 元素；在 `h4` 内部，主要的次次子标题应该是 `h5` 元素；在 `h5` 内部，主要的次次次子标题应该是 `h6`\
  \ 元素。\n*   **不要跳过标题：** 不要仅仅因为你觉得可以或更喜欢文本的外观，就从 `h2` 直接跳到 `h4`（参见下一项）。\n*   **不要为了装饰目的而使用标题：**\
  \ 不要仅仅因为你需要加粗效果或喜欢该标题文本的大小就使用标题。那是 CSS 的用场。\n\n### 使用语义分段元素\n\n你完全可以只使用样式化的 `div`\
  \ 元素来构建页面（而且令人震惊的是网页编码人员正是这样做的！），但结果不仅混乱且无结构，而且是一场可访问性的噩梦。为什么？因为屏幕阅读器或其他辅助技术可以说找不到可以“抓取”的地方。当然，它仍然会朗读（或处理）页面内容，但将没有上下文。\n\
  \n幸运的是，使用语义分段元素（如 `header`、`nav`、`main`、`article` 和 `footer`）来构建页面并不会花费额外的时间，这些元素我在书籍第二卷第\
  \ 1 章中提到过。这种方法不仅为页面布局提供了欢迎的结构，还免费带给了你可访问性，因为这些所谓的“地标”有助于辅助技术理解页面，屏幕阅读器会将底层的语义含义作为读取内容的一部分。\n\
  \n例如，当屏幕阅读器遇到 `nav` 元素时，它通常会说“导航”（navigation），当它遇到 `header` 元素时，它通常会说“横幅”（banner）。\n\
  \n## 让文本具备访问性\n\n几乎所有的网页都是文本，所以如果你能让你的文本具有可访问性，你在让页面具备访问性的方面就已经迈出了一步。以下是需要记住的几点：\n\
  \n*   **不要对文本大小使用绝对测量单位：** 视力困难的人在浏览网页之前可能做的第一件事就是使用较大的默认字体大小来自定义浏览器。如果你用用像素（pixels）等绝对测量单位对文本设置样式，你就覆盖了那个较大的默认值。你突然会变得那个人以及其他花精力调整了浏览器文本的人变得极其不受欢迎。可访问的文本始于使用相对测量单位（如\
  \ `em` 或 `rem`）的文本大小。（对这些感到困惑吗？别担心：我将在第三卷第 5 章](#c15.xhtml)中以近乎痛苦的细节详细介绍 CSS 测量单位。）\n\
  *   **确保文本是读的：** 不要让你的文本小得离谱，并确保文本颜色与背景颜色之间有足够的对比（参见本章后后的“确保足够的色彩对比”）。\n*   **让链接文本具有描述性：**\
  \ 对于你页面上的每个链接，链接文本都应该描述链接另一侧的内容。屏幕阅读器会朗读链接文本，所以如果你的链接只说“点击”或“点击此处”，你并没有告诉访客任何关于链接去向的有用信息。\n\
  \n    这样做：\n\n    ```\n    <a href=\"kumquats.html\">了解更多关于金橘的知识</a>\n    ```\n\n\
  \    不要这样做：\n\n    ```\n    了解更多关于金橘的信息请<a href=\"kumquats.html\">点击此处</a>\n   \
  \ ```\n\n*   **如果可能，不要隐藏文本：** 你可以使用 CSS 或 JavaScript 临时隐藏不需要显示的文本。例如，你可以创建一个标签，其中一个标签的内容可见，而其他标签的内容不可。。隐藏某些文本的标准方法是将其隐藏，但这将给屏幕阅读器带来麻烦。所以，如果可以的话，永远不要隐藏页面文本。\n\
  \n## 让多媒体具备访问性\n\n网页文本本身就是可访问的，因为屏幕阅读器默认朗读它们，而且通过你的留心可以让视力不佳的人更容易阅读。遗憾的是，这种友好性并不适用于网页媒体，包括图像、视频和音频片段。这些元素更难实现访问，但你仍然可以做很多来确保所有访客都能享受页面媒体。\n\
  \n### 为图像指定 alt 文字\n\n为了帮助视障用户或关闭图片浏览的用户，你可以使用 `img` 标签的 `alt` 属性为页面上的每个重要图像提供描述。对于视障人士，屏幕阅读器会朗读每个\
  \ `img` 标签的 `alt` 属性值，因此重要或结构性的图像应包含一个简单的描述作为 `alt` 值：\n\n```\n<img src=\"twitter.png\"\
  \ alt=\"Twitter 图标\">\n```\n\n关于编写有用 alt 文字的注意事项：\n\n*   保持简洁。冗长的描述通常不需要或没用。\n*\
  \   直接说明图像代表什么。\n*   包含图像中有意义的细节。在这里，“有意义”意味着与页面上下文或周围文本相关。\n*   不要重复周围文本中已经包含的信息。\n\
  *   对于纯装饰性的图像，不需要添加 `alt` 值，但必须包含 `alt` 标签（为空字符串：`alt=\"\"`），否则你的 HTML 代码将无法通过。\n\
  \n### 让其他媒体具备访问性\n\n与图像相比，视频和音频内容需要更多工作才能实现访问性，这本质上意味着要做以下操作之一：\n\n*   **音频内容：**\
  \ 听力障碍用户无法听到通过 `audio` 元素的内容。你可以通过提供音频的转录文本来支持这些用户。\n\n\n\n\n\n-   **视频内容：** 视觉障碍的用户无法看到通过\
  \ `video` 元素传输的内容，而听力障碍的用户则无法听到 `video` 元素的音频轨道。对于后者，应该提供视频音频轨的转录文本。对于前者，你的视频应该带有在播放时显示的闭路字幕（closed\
  \ captions）或字幕（subtitles）。\n\n在视频播放时显示字幕的一种方法是创建一个 Web 视频文本轨道（WebVTT）文件，这是一个文本文件，包含了时间提示和在这些时间提示期间显示的文本。\n\
  \n![Tip](img/tip.png) 构建 WebVTT 文本文件非常简单，但这超出了本书的范围。幸运的是，Mozilla 开发者网络对该格式有极佳的描述：[`https://developer.mozilla.org/en-US/docs/Web/API/WebVTT_API`](https://developer.mozilla.org/en-US/docs/Web/API/WebVTT_API)\n\
  \n在你准备好 WebVTT 文件（使用 `.vtt` 扩展名）后，然后使用 `track` 元素让浏览器知道该文件供 `video` 元素可用：\n\n```\n\
  <track kind=\"type\" src=\"filename\">\n```\n\n-   `kind`: 指定轨道的类型。对于 `value`，你可以使用以下任何关键词：`subtitles`（默认值）、`captions`（闭路字幕）、`descriptions`（视频内容的描述）或\
  \ `chapters`（仅章节标题）。\n-   `src`: WebVTT 文件的文件名（如果文件位于存储 HTML 文件的其他目录，则包含路径）。\n\n\
  你将 `<track>` 标签插入 `<video>` 和 `</video>` 标签之间，如下：\n\n```html\n<video src=\"/media/videos/kumquats.mp4\"\
  \ controls>\n  <track kind=\"captions\" src=\"/media/cc/kumquats-captions.vtt\"\
  >\n</video>\n```\n\n## 增强页面的可访问性语义\n\n当你戴上“可访问性”帽子时，对于页面上的每个元素，你需要问自己的关键问题之一是：“辅助技术可能需要关于该元素的什么？”也就是说，你需要提供什么信息，以便屏幕阅读器或类似的辅助技术（AT）确定该元素的用途？\n\
  \n换句话说，你想让每个元素的*含义*变得清晰，而你提供的关于每个元素含义的信息被称为*可访问性语义*。在接下来的几个章节中，我将介绍几种增强页面可访问性语义的方法。\n\
  \n### 添加表单字段标签\n\n在第二本书的第 5 章中，我提到了 `label` 元素，你可以用它将文本标签或说明与表单字段关联。你可以使用两种方法：\n\
  \n-   **隐式标签：** 用 `<label>` 和 `</label>` 标签包围表单字段，并在字段之前或之后插入标签文本。这里是一个示例：\n\n```html\n\
  <label>\n  最喜欢的蔬菜：\n  <input type=\"text\">\n</label>\n```\n\n-   **显式标签：** 在字段标签中插入一个\
  \ `id` 值，将 `<label>` 标签的 `for` 属性设置为相同的值，并在 `<label>` 和 `</label>` 标签之间插入标签文本。例如：\n\
  \n```html\n<label for=\"fave-veg\">最喜欢的蔬菜：</label>\n<input id=\"fave-veg\" type=\"\
  text\">\n```\n\n添加 `<label>` 标签提供了两个可访问性优势：\n\n-   它允许用户通过点击标签来选择字段。这增加了点击目标区域，有助于手部不稳的用户。\n\
  -   标签文本现在与字段关联起来，这意味着当用户选择字段时，屏幕阅读器将读出标签文本。\n\n请确保为每个 `<input>` 标签以及每个 `<select>`\
  \ 和 `<textarea>` 标签添加标签。\n\n### 理解 ARIA 角色、状态和属性\n\n世界网联盟（W3C）是 Web 可访问性倡议（WAI）的所在地，其目标是让\
  \ Web 成为所有人都可以的地方。WAI 的关键技术之一是可访问富互联网应用程序（ARIA），它是角色、状态和属性的集合，旨在为网页用户界面的每个元素带来可访问性语义：\n\
  \n-   **ARIA 角色 (role)：** 定义页面元素代表什么类型的用户界面控件的关键字。例如，如果你编写了一个 `div` 元素看起来和操作像一个命令按钮，那么该元素的角色就是\
  \ `button`。你使用 `role` 属性为元素分配角色，如下：\n\n```html\n<div role=\"button\">应用更改</div>\n\
  ```\n\n-   **ARIA 属性 (property)：** 描述用户界面控件某些方面的值。例如，如果你想在可编辑的 `div` 元素中包含占位符文本，可以通过添加\
  \ `aria-placeholder` 属性让辅助技术知道占位符：\n\n```html\n<div contenteditable role=\"textbox\"\
  \ aria-placeholder=\"user@domain.com\"></div>\n```\n\n-   **ARIA 状态 (state)：** 指定界面控件当前条件的键盘或值。例如，如果你的\
  \ Web 应用程序使用 `div` 元素作为开启/关闭开关，但该元素目前被禁用，你可以通过将 `aria-disabled` 属性设置为 `true` 来向辅助技术发出禁用状态信号：\n\
  \n```html\n<div aria-disabled=\"true\"></div>\n```\n\nARIA 角色分为三大类：\n\n-   地标角色\
  \ (Landmark roles)\n-   区域结构角色 (Section structure roles)\n-   组件角色 (Widget roles)\n\
  \n![Remember](img/remember.png) 我将介绍这些类别中的每个角色。然而，需要理解的是如果你使用了语义元素，就不需要使用 ARIA 角色。例如，`<button>`\
  \ 具有隐式的 `button` 角色，因此不需要在 `<button>` 标签中包含 `role=\"button\"`。访问 [`https://developer.mozilla.org/en-US/docs/Web/Accessibility/Roles`](https://developer.mozilla.org/en-US/docs/Web/Accessibility/Roles/)\
  \ 以获得对 ARIA 角色的全面了解。\n\n#### 地标角色\n\n*地标* ARIA 角色识别页面的主要结构元素，辅助技术利用这些地标让用户快速遍历页面部分。表\
  \ 6-1 列出了地标角色及其对应的 HTML 元素。\n\n| ARIA 角色 | HTML 语义元素 |\n| --- | --- |\n| `banner`\
  \ | `header` |\n| `complementary` | `aside` |\n| `contentinfo` | `footer` |\n| `form`\
  \ | `form` |\n| `main` | `main` |\n| `navigation` | `nav` |\n| `region` | `section`\
  \ |\n| `search` | 无 |\n\n`search` 角色没有同等的 HTML 元素，但大多数情况下你会在 `form` 元素中使用它，如下：\n\
  \n```html\n<form role=\"search\">\n  你的搜索控件放在这里\n</form>\n```\n\n![Warning](img/warning.png)\
  \ 地标角色（及其对应的 HTML 区域元素）的目的是为辅助技术提供“森林而非树木”的视角。因此，不要过度使用地标角色，否则你可能会面临页面看起来满是树木的风险！\n\
  \n#### 区域结构角色\n\n*区域结构* ARIA 角色识别具有特定目的页面内容区域。大多数区域结构 ARIA 角色都有语义 HTML 元素，但少数没有，我将它们列在表\
  \ 6-2 中。\n\n| ARIA 角色 | 描述 |\n| --- | --- |\n| `feed` | 识别一个滚动列表，当用户滚动到列表底部时，会添加新项目\
  \ |\n| `math` | 识别数学表达式 |\n| `none` (或 `presentation`) | 向辅助技术隐藏元素的隐式 ARIA 角色 |\n\
  | `note` | 识别与主页面主题相关的辅助内容区域 |\n| `toolbar` | 识别一个旨在作为工具栏使用的控件 |\n\n\n\n\n\n| `tooltip`\
  \ | 识别用户将鼠标指针悬停在元素上或通过键盘为元素获取焦点时显示的文本 |\n\n## 表 6-2 无 HTML 等效项的章节结构角色\n\n表 6-3 列出了具有语义化\
  \ HTML 等效项的章节结构 ARIA 角色。在任何情况下，使用语义化 HTML 元素比使用 ARIA 角色更好。\n\n| ARIA role | HTML\
  \ 语义元素 |\n| --- | --- |\n| `article` | `article` |\n| `cell` | `td` |\n| `definition`\
  \ | `dfn` |\n| `figure` | `figure` |\n| `heading` | `h1` 到 `h6` |\n| `img` | `img`\
  \ 或 `picture` |\n| `list` | `ol` 或 `ul` |\n| `listitem` | `li` |\n| `meter` | `meter`\
  \ |\n| `row` | `tr` |\n| `rowgroup` | `tbody`, `thead`, 或 `tfoot` |\n| `rowheader`\
  \ | `th` |\n| `table` | `table` |\n| `term` | `dfn` 或 `dt` |\n\n## 表 6-3 有 HTML\
  \ 等效项的章节结构角色\n\n### 组件 ARIA 角色\n\n组件 ARIA 角色识别交互式用户界面元素。表 6-4 列出了那些没有语义化 HTML 等效项的组件\
  \ ARIA 角色。\n\n| ARIA role | 识别 |\n| --- | --- |\n| `combobox` | 一种输入控件，允许用户输入值或从列表中选择值\
  \ |\n| `menu` | 允许用户从选项列表中选择某项的控件 |\n| `menubar` | 包含一组 `menu` 组件的控件 |\n| `scrollbar`\
  \ | 控制视图区域内垂直或水平滚动的页面对象 |\n| `searchbox` | 特别用于输入搜索操作文本的文本框控件 |\n| `slider` | 允许用户从值范围内进行选择的输入控件\
  \ |\n| `spinbutton` | 允许用户增加或减少某个值的输入控件 |\n| `switch` | 用户可以在“开启”和“关闭”状态之间进行切换的输入控件\
  \ |\n| `tab` | 一种控件，选中后会显示其关联的 `tabpanel` 组件 |\n| `tablist` | 包含一组 `tab` 组件的控件 |\n\
  | `tabpanel` | 包含当前已选 `tab` 组件内容的控件 |\n| `tree` | 允许用户从分层结构集合中选择一个或多个项的组件 |\n| `treegrid`\
  \ | `tree` 组件的表格版本 |\n| `treeitem` | `tree` 组件中的某项 |\n\n## 表 6-4 无 HTML 等效项的组件角色\n\
  \n一些组件 ARIA 角色也具有语义化 HTML 等效项，正如我在 表 6-5 中概述的那样。在任何情况下，使用语义化 HTML 元素比使用 ARIA 角色更好。\n\
  \n| ARIA role | HTML 语义元素 |\n| --- | --- |\n| `button` | `button` |\n| `checkbox`\
  \ | `input type=\"checkbox\"` |\n| `link` | `a` |\n| `option` | `option` |\n| `progressbar`\
  \ | `progress` |\n| `radio` | `input type=\"radio\"` |\n| `textbox` | `input type=\"\
  text\"` |\n\n## 表 6-5 有 HTML 等效项的组件角色\n\n### 区分相同类型的语义化页面元素\n\n当你尝试在代码中适配屏幕阅读器时，会遇到的问题之一是你有多个相同类型的语义化页面元素。例如，你的页面可能有两个\
  \ `nav` 元素：一个在页面的 `header` 中，另一个在页面的 `article` 中，如下所示：\n\n```html\n<header>\n<nav>\n\
  <h3>Site Navigation</h3>\n*Site navigation code goes here*\n</nav>\n</header>\n\
  <main>\n<article>\n<nav>\n<h3>Article Navigation</h3>\n*Article navigation code\
  \ goes here*\n</nav>\n</article>\n</main>\n```\n\n屏幕阅读器用户如何知道每个 `nav` 元素的作用？一种方案是遍历元素以查看每个元素包含的内容，这个过程既耗时又费力。更好的方法是在每个\
  \ `nav` 元素内部的 `h3` 元素添加 `id` 属性，然后在 `nav` 元素中使用 `aria-labelledby` 属性来指定关联标题的 id。这里是更新后的示例：\n\
  \n```html\n<header>\n<nav aria-labelledby=\"site-navigation\">\n<h3 id=\"site-navigation\"\
  >Site Navigation</h3>\n*Site navigation code goes here*\n</nav>\n</header>\n<main>\n\
  <article>\n<nav aria-labelledby=\"article-navigation\">\n<h3 id=\"article-navigation\"\
  >Article Navigation</h3>\n*Article navigation code goes here*\n</nav>\n</article>\n\
  </main>\n```\n\n## 让你的页面对键盘友好\n\n许多残障用户缺乏手灵活性或使用鼠标的能力，因此让你的页面对键盘友好至关重要。HTML 默认提供了以下键盘支持：\n\
  \n- 表单控件和链接可以通过键盘进行导航。\n- 所有其他 HTML 元素均不可导航。\n- 按 Tab 键会将焦点向前移动到下一个可导航元素，其中“向前”指的是元素在源代码中出现的方向。\n\
  - 按 Shift+Tab 键会将焦点从当前元素向后移动到上一个可导航元素，其中“向后”指的是元素在源代码中反反方向。\n- 对于具有多个组件的可导航元素——例如单选按钮组或选择列表——在用户将焦点置于该元素后，用户可以通过方向键导航各个组件。\n\
  - 按空格键会选中当前元素。例如，当按钮获得焦点时，按空格键等同于点击按钮；当复选框获得焦点时，按空格键会在复选框的选中和未选中状态之间切换。\n\n\n\n\n\
  \n要从制表顺序中移除元素，请在元素的标签中插入 `tabindex=\"-1\"`，如下所示：\n\n```html\n<button tabindex=\"\
  -1\">\n  Can't touch this\n</button>\n```\n\n当网页浏览器在标签内部遇到 `tabindex=\"-1\"` 时，会将该元素从制表顺序中移除，因此按下\
  \ `Tab` 或 `Shift+Tab` 的用户将直接跳过它。\n\n## 确保足够的色彩对比\n\n如果文本颜色与背景颜色之间没有足够的对比度，某些人——即使是视力良好的人——阅读网页文本也会遇到困难。例如，现在非常常见的现象是：在稍浅的灰色背景上使用浅灰色文字（参见图\
  \ 6-1 的左侧），或在稍深的灰色背景上使用深灰色文字（参见图 6-1 的右侧）。有些网页设计师认为这很“酷”，但我们其他人可能会用更刻薄的语言来描述它。\n\
  \n![浅色背景上的浅色文字（左）和深色背景上的深色文字（右）的截图](img/9781394164684-fg020601.png)\n\nFIGURE 6-1:\
  \ 浅色背景上的浅色文字（左）和深色背景上的深色文字（右）。\n\n诚然，图 6-1 中的例子有点极端，但你不应该假设仅仅因为你能轻松阅读你的文本，其他人读起来也会同样容易。许多有视觉障碍或视力衰化的人在阅读看起来比背景不够深或不够浅的文本时会遇到困难。\n\
  \n那么，如何知道你选择的前景和背景颜色是否有足够的色彩对比度呢？你可以参考一种名为 `contrast ratio`（对比率）的测量方法，它将一种颜色的色调和亮度与另一种颜色的色调和亮度进行比较。结果是一个大于一的数字，具有以下属性：\n\
  \n*   数字越小，两种颜色之间的对比度越低。\n*   数字越大，两种颜色之间的对比度越高。\n*   对比比例为 `1` 意味着两种颜色相同（或足够相同）。\n\
  \n好了，那么什么是*足够*的色彩对比度呢？网页无障碍领域的专家们规定，你的目标应该是 `4.5` 或更高的对比率。幸运的是，你不需要自己计算对比率。相反，你可以使用名为\
  \ `WebAim (Web Accessibility In Mind) Contrast Checker` 的在线工具，可以在此处访问：\n\n[`https://webaim.org/resources/contrastchecker/`](https://webaim.org/resources/contrastchecker/)\n\
  \n在前景颜色和背景颜色框中，可以输入 RGB 进制颜色代码，或者点击色块来选择颜色。页面会立即输出对比率（参见图 6-2）。\n\n![使用 WebAIM 对比检查器查找任意两种颜色对比率的截图](img/9781394164684-fg020602.png)\n\
  \nFIGURE 6-2: 使用 WebAIM 对比检查器查找任意两种颜色之间的对比率。\n\n![提示](img/tip.png) 要了解所谓的“RGB 进制颜色代码”到底是什么意思，请参见第\
  \ 3 本第 6 章。\n\n## 验证网页的无障碍性\n\n在本章中讨论的所有无障碍调整可能看起来有很多需要记录。如果你漏掉了某些内容怎么办？这是一个合理的担心，但网页可以提供帮助。一旦你的页面发布到网上，你就可以访问网页无障碍评估工具\
  \ (WAVE)，地址 [`http://wave.webaim.org`](http://wave.webaim.org)，来检查其无障碍性，如图 6-3。\n\
  \n![网页无障碍评估工具的截图，它将告诉你你的页面是否存在任何无障碍错误](img/9781394164684-fg020603.png)\n\nFIGURE\
  \ 6-3: 网页无障碍评估工具将告诉你你的页面是否存在任何无障碍错误。\n\n将你的网页地址粘贴到文本框中并按 `Enter/Return`，即可看到一份包含以下内容的报告：\n\
  \n*   缺失的语义元素\n*   跳过的标题层级\n*   字体过小\n*   色彩对比率过低\n\n第 3 本\n\n# 学习 CSS 基础\n\n##\
  \ 内容概览\n\n1.  第 1 章：理解 CSS 盒模型\n    1.  在模型之外（但也包括内部）思考\n    2.  关于空白的简短插叙\n   \
  \ 3.  内边距 (Padding)\n    4.  边框 (Border)\n    5.  外边距 (Margins)\n    6.  样式化\n2.\
  \  第 2 章：认识选择器\n    1.  进入网页\n    2.  什么是选择器\n    3.  学习选择器\n    4.  后代元素、子元素和兄弟元素\n\
  \    5.  属性选择\n3.  第 3 章：伪类与伪元素\n    1.  研究伪类\n    2.  上手伪元素\n4.  第 4 章：让 CSS 易懂\n\
  \    1.  编写注释\n    2.  使用 CSS 重置\n    3.  调试 CSS\n    4.  原理：样式是如何生效的\n5.  第 5 章：衡量\
  \ CSS\n    1.  熟悉 CSS 单位\n    2.  查看绝对单位\n    3.  认识相对单位\n    4.  这里视口单位\n    5.\
  \  CSS 计算\n6.  第 6 章：用色彩和背景美化页面\n    1.  指定颜色\n    2.  使用颜色修饰文本\n    3.  设置元素背景\n\
  \    4.  用渐变色惊艳你的朋友\n    5.  设置边框颜色\n    6.  在开发工具中调试色彩\n7.  第 7 章：通过网页字体提升文本水平\n\
  \    1.  照顾好文本\n    2.  字体三剑客：字号、行高和行宽\n    3.  应用文本样式\n    4.  更多排版技巧\n    5. \
  \ 改造你的链接\n    6.  调整对齐方式\n\n\n\n\n我不想对你撒谎：当你刚开始学习 CSS 时，页面上的元素有时看起来完全在违背你的每一个指令。它们就像脾气古怪的青少年，忽视你最好的建议，并拒绝承认你——或者说你本应该是——它们的老板。好吧，我确实对你撒了一点小谎：这种情况甚至会发生在经验丰富的\
  \ Web 程序员身上。为什么会有这种态度？因为虽然网络浏览器是浏览网页的优秀软件，但默认情况下，它们并不擅长布局网页。它们就像过度溺爱的的祖父母，直接让页面元素随心所欲。作为一名父母——呃，我的意思是一名\
  \ Web 开发人员，你的任务是给页面引入一些纪律。\n\n幸运的是，CSS 提供了大量的工具和技术，你可以利用它们来让固执的页面元素听话。这些工具和技术构成了本书大部分，也是第\
  \ 2 、第 5  和 6 章的主题。但作为 CSS 开发人员你做的一切几乎都会以某种方式涉及（或受到）CSS 盒模型的影响，而这正是本章要探讨的内容。盒模型对于\
  \ CSS 中的几乎所有内容都是如此基础，以至于你应该将本章视为书中几乎所有其他 CSS 主题的基础。\n\n## 在盒模型之外（但也包括在内）思考\n\n每个网页都由一系列\
  \ HTML 标签组成，其中每个标签都代表页面上的一个元素。在名为“样式表之地（Style Sheet Land）”的奇异而极客的世界里，每个这些元素都被认为在周围有一个不可见的盒子（好吧，这是一个非常奇怪的世界）。这听起来可能不是大什么，但这些盒子是通往\
  \ CSS 精通的王之路。\n\n### 理解盒模型的组件\n\n图 1-1 显示了上述不可见盒子在抽象状态下的样子，而图 1-2 显示了一个真实的页面元素。\n\
  \n![CSS 盒模型组件的示意图。](img/9781394164684-fg030101.png)\n\n图 1-1： CSS 盒模型的组件。\n\n![应用于实际页面元素的\
  \ CSS 盒模型示意图。](img/9781394164684-fg030102.png)\n\n图 1-2： 应用于实际页面元素的 CSS 盒模型。\n\n\
  图 1-1 和 1-2 显示了以下盒组件：\n\n*   **内容 (Content):** 盒子内部的东西，如文本、链接、列表、图像和视频。换句话说，你页面中所有盒子的内容无非就是你添加到页面的实际内容。内容区域的四边——即它的上、左、下、右边缘——定义了`content\
  \ box（内容盒）`。\n*   **内边距 (Padding):** 环绕内容的空间。也就是说，它是紧邻内容之外但在边框（下文讨论）内部的空间。参考本章稍后的“添加内边距”，了解更多关于调整内边距的内容。内边距区域的四边定义了`padding\
  \ box（内边距盒）`。\n*   **边框 (Border):** 环绕内边距的空间。也就是说，它是紧邻内边距之外但在外边距（下文讨论）内部的空间。参考本章稍后的“添加边框”，详细查看如何使用\
  \ CSS 控制边框。边框的四边定义了`border box（边框盒）`。\n*   **外边距 (Margin):** 环绕边框的空间。也就是说，它是紧邻边框之外的空间。外边距的四边定义了`margin\
  \ box（外边距盒）`。\n\n注意，这些意义上都是“可选”的，你可以使用 CSS 规则将它们缩到。此外，内边距盒、边框盒和外边距盒的上、左、下、右边缘都有对应的\
  \ CSS 属性供你尝试。\n\n### 理解块级盒子和内联盒子\n\n你可能想觉得这些不可见的盒子只环绕块级元素，即那些开启新文本段的元素：`p`、`blockquote`、`h1`\
  \ 到 `h6`、`div`、所有页面布局语义标签（如 `header`、`article` 和 `section` 等）。这很有道理，但实际上每一个标签，即使是像\
  \ `a` 和 `span` 这样的内联元素，在周围都有一个盒子。因此，到头来，你总是处理两种类型的盒子：\n\n*   **块级盒子 (Block boxes):**\
  \ 这种类型的盒子使用以下特征在网页上渲染：\n    *   盒子在新的一行开始。\n    *   如果你不为盒子设置宽度，盒子将填充其容器元素的整个水平空间。\n\
  \    *   如果你设置了盒子的宽度和高度，这些属性就会生效。\n    *   增大盒子的内边距、边框和外边距尺寸会导致周围元素被推开。\n    * \
  \  根据定义，块盒的 `display` 属性默认值为 `block`：\n    ```\n    display: block;\n    ```\n*\
  \   **内联盒子 (Inline boxes):** 这种类型的盒子在网页上以如下方式渲染：\n    *   盒子随内容流动。\n    *   盒子的宽度与内容等宽。\n\
  \    *   如果你设置了盒子的宽度和高度，这些属性不会生效。\n    *   增大内边距、边框和外边距尺寸对周围元素没有影响。\n    *   根据定义，内联盒的\
  \ `display` 属性默认值为 `inline`：\n    ```css\n    display: inline;\n    ```\n\n### 盒的显示类型\n\
  \n虽然像 `h1` 或 `div` 这样的元素默认是块盒，而像 `a` 或 `span` 这样的元素默认是内联盒，并不意味着这些元素不能改变显示类型。例如，在创建一组链接时，许多开发者会将链接放在\
  \ `li`（列表）元素中（这些是块盒），并将这些元素改为内联以便链接水平排列。我稍后会展示一个示例。\n\n你可以使用 `display` 属性更改元素的显示类型：\n\
  \n```css\nselector {\n  display: value;\n}\n```\n\n*   `selector`: 选择你想要样化的元素的 CSS\
  \ 选择器。\n*   `value`: 指定显示类型的关键字。你可以使用任何一个：\n    *   `block`: 将显示类型改为块盒。\n    * \
  \  `inline`: 将显示类型改为内联盒。\n    *   `inline-block`: 将显示类型改为内联盒，但浏览器会尊重你对元素 `width`\
  \ 和 `height` 属性的任何更改。\n\n![记住](img/remember.png) *选择器 (selector)* 是一种 CSS 功能，允许你通过元素名、类、HTML\
  \ 属性等来选择页面对象。详细查看 CSS 选择器请参考第 3 章第 2 和 3。\n\n这是一个使用选择器更改 `li` 元素显示类型的示例（请查看书中示例文件\
  \ `bk03ch01/example01.html`）：\n\nHTML:\n\n```html\n<ul>\n  <li>Home</li>\n  <li>Blog</li>\n\
  \  <li>Contact Us</li>\n  <li>Surprise!</li>\n  <li>Support</li>\n</ul>\n```\n\n\
  CSS:\n\n```css\nli {\n  display: inline;\n  margin-right: 8px;\n}\n```\n\n\n\n\n\
  # 列表样式\nHTML 代码定义了一个无序列表。在 CSS 中，`li` 元素的 `display` 属性被设置为 `inline`，这导致列表项水平显示，如图\
  \ 1-3 所示。（我添加了 `margin-right: 8px` 声明，以便为每个 `li` 项目右侧留出一点空间；请参阅本章节后部分的“操作元素边距”。）\n\
  \n![![列表项现在作为内联框显示。](img/9781394164684-fg030103.png)\n\n图 1-3： 列表项现在作为内联框显示。\n\n\
  ![记住](img/remember.png) `display` 属性还有许多其他可能的值。例如，如果你想临时隐藏一个元素，可以使用 `display: none`\
  \ 对该元素进行样式化。在使用 Flexbox（见第 5 本，第 2 章）和 Grid（见第 5 本，第 3 章）时，也会修改元素的 `display` 属性。\n\
  \n## 目测元素的框\n包围元素的框是不可见的，因此所有关于框的内容可能显得有些抽象。此外，正如你在本章其他部分发现的那样，有很多 CSS 属性可以用来更改顶部、右、底部和左侧内边区域、边框和边距的大小。需要跟踪的内容很多，那么你如何确保你的\
  \ CSS 是按照你想要的方式应用的呢？\n\n最好的方法是使用网络浏览器的开发工具。我将在第 3 本第 4 章 中详细介绍 CSS 相关的开发工具。现在，你可以通过右键点击元素并点击\
  \ `检查`（或“检查元素”，取决于你使用的浏览器）在开发工具中查看元素。在出现的面板中，点击右侧出现的 `Computed` 标签。如图 1-4 所示，此标签页包含了所选元素盒模型的表示。内框告诉你内容框的尺寸，而同心框则显示每个内边距区域、边框和边距的大小。\n\
  \n![开发工具 Computed 标签页显示了所选元素盒模型的尺寸。](img/9781394164684-fg030104.png)\n\n图 1-4： 开发工具的\
  \ Computed 标签页显示了所选元素盒模型的尺寸。\n\n## 关于空白的短插曲\n一个主要的网页设计概念是空白（`whitespace:`）的概念，即页面中不含内容的区块。空白的颜色是可选的：只要它不包含任何内容，空白可以是任何你喜欢的颜色；在设计上，是空白的“空白感”起到了关键作用。\n\
  \n为什么空白如此重要？因为当慷慨且审慎地使用时，空白可以打开你的页面，使其更具吸引力、更容易导航且阅读起来更愉快。\n\n例如，看看图 1-5 所示的页面。这个页面几乎没有任何空白区域，因此呈现出来的就像一堵文字。谁会想读那个？现在对比一下图\
  \ 1-6 所示的相同页面版本。啊，好多了。是什么产生了区别？在图 1-5 所示的页面版本中，我故意将所有边距都设置为 `0`。在图 1-6 中，我删除了该设置并让浏览器使用默认规则对内容进行样式处理，这些规则包含了大多数元素周围的空白。\n\
  \n![空白极少的网页截图。](img/9781394164684-fg030105.png)\n\n图 1-5： 空白极少的网页。\n\n![相同页面的截图，现在增加了空白！](img/9781394164684-fg030106.png)\n\
  \n图 1-6： 相同页面，现在增加了空白！\n\n你如何在页面中控制空白？CSS 实际上有很多种技术可以采用，但以下两个将成为你空白工作的骨干：\n\n* \
  \  **控制每个元素内部的空白：** 这意味着给每个元素慷慨的内边距，确保元素的内容不会被边框挤压。\n*   **控制每个元素外部的空白：** 这意味着给每个元素慷慨的边距，确保元素不会被周围元素挤压。\n\
  \n## 添加内边距\n在 CSS 盒模型中，`padding` 是环绕内容到边框的空间。\n\n内边距分为四个部分——内容的上方、右侧、下方和左侧——因此 CSS\
  \ 提供了四个相应的属性：\n\n```css\nselector {\n  padding-top: value1;\n  padding-right: value2;\n\
  \  padding-bottom: value3;\n  padding-left: value4;\n}\n```\n\n每个属性都需要一个值（如 `px`、`em`、`rem`、`vw`、`vh`\
  \ 或百分比），如图 1-7 所示。\n\n## `padding` 简写\n这是使用 `padding` 简写重写上一个示例的方式\n\n```css\np\
  \ {\n  padding: 16px 12px 16px 20px;\n}\n```\n\n## 添加边框\n现代网页设计避免使用垂直和水平线作为分割内容的手段，而是倾向于让大量的空白来完成工作。然而，这并不意味着你不应该在设计中使用线条，特别是边框。元素的*border*（边框）*是包围元素内容和内边距的虚拟线条集。边框是一种很有用的方法，可以清楚地表示元素与页面周围元素分开。\n\
  \n### 应用边框\n元素的边框有四条线——内边距的上方、右侧、下方和左侧——因此 CSS 提供了四个属性为元素添加边框：\n\n```css\nselector\
  \ {\n  border-top: top-width top-style top-color;\n  border-right: right-width right-style\
  \ right-color;\n  border-bottom: bottom-width bottom-style bottom-color;\n  border-left:\
  \ left-width left-style left-color;\n}\n```\n\n每个边框需要三个值：\n\n\n\n\n\n*   **宽度 (Width):**\
  \ 框线的厚度，你可以使用数字后跟 CSS 测量单位（例如 `px`、`em`、`rem`、`vw` 或 `vh`）。但要注意，大多数边框宽度是以像素为单位，通常为\
  \ `1px`。你也可以指定以下关键词之一：`thin`、`medium` 或 `thick`（请注意，每个关键词对应的厚度在 CSS 标准中并未定义，因此效果可能会因浏览器而异）。\n\
  \n*   **样式 (Style):** 框线的类型，必须是以下关键词之一：\n\n    *   `dotted`: 将边框显示为一系列圆点。\n    *\
  \   `dashed`: 将边框显示为一系列虚线。\n    *   `solid`: 将边框显示为不间断的实线。\n    *   `double`: 将边框显示为两条平行的实线。\n\
  \    *   `groove`: 将边框显示为像刻在页面上的 V 形槽（与 `ridge` 的效果相反）。\n    *   `ridge`: 将边框显示为像从页面隆起的\
  \ V 形凸起（与 `groove` 的效果相反）。\n    *   `inset`: 将边框显示为像嵌入页面中一样（与 `outset` 的效果相反）。\n\
  \    *   `outset`: 将边框显示为像在页面上浮雕一样（与 `inset` 的效果相反）。\n\n图 1-9 显示了每种样式的示例。（使用 `24px`\
  \ 作为 `groove`、`ridge`、`inset` 和 `outset` 样式的边框宽度，因为这些效果在较小的宽度下很难辨；请查看 `bk03ch01/example03.html`。）\n\
  \n![提示](img/tip.png) **颜色:** 框线的颜色。你可以使用颜色关键词、`rgb()` 函数、`hsl()` 函数或 RGB 代码，正如我在第三本书第\
  \ 6 章](#c16.xhtml) 中描述的那样。\n\n这是一个示例，为 `header` 元素添加了 1 像素、虚线的、红色底部边框：\n\n```css\n\
  header {\n  border-bottom: 1px dashed red;\n}\n```\n\n在你的 CSS 工作中，你可能需要关注边框的某个特定部分。例如，你可能只想处理底部边框的样式或左侧边框的颜色。没问题！\n\
  \n![边框样式关键词生效的截图。](img/9781394164684-fg030109.png)\n\n图 1-9: 边框样式关键词的实际效果。\n\n你可以使用以下任何属性，例如，处理特定的边框宽度（其中\
  \ `border-width` 是任何 CSS 测量单位的宽度）：\n\n```css\nborder-top-width: border-width;\n\
  border-right-width: border-width;\nborder-bottom-width: border-width;\nborder-left-width:\
  \ border-width;\n```\n\n同样，你可以使用以下任何属性来处理特定的边框样式（其中 `border-style` 是任何有效的边框样式关键词，如\
  \ `solid` 或 `dashed`）：\n\n```css\nborder-top-style: border-style;\nborder-right-style:\
  \ border-style;\nborder-bottom-style: border-style;\nborder-left-style: border-style;\n\
  ```\n\n最后，你可以使用以下任何属性来处理特定的边框颜色（其中 `border-color` 是任何有效的 CSS 颜色）：\n\n```css\nborder-top-color:\
  \ border-color;\nborder-right-color: border-color;\nborder-bottom-color: border-color;\n\
  border-left-color: border-color;\n```\n\n如果你想在元素周围添加完整的边框，并且希望四边都使用相同的宽度、样式和颜色，你会很高兴知道\
  \ CSS 仁地提供了一个使用 `border` 属性的简写版本：\n\n```css\nborder: width style color;\n```\n\n\
  这是我用于为图 1-5 和 1-6 中所示元素添加边框的声明：\n\n```css\nborder: 4px solid black;\n```\n\n![提示](img/tip.png)\
  \ 技术上，`border` 简写属性唯一要求的值是 `style`。如果你声明类似 `border: solid` 的内容，浏览器将绘制一个宽度为 `3px`、深灰色的实边框。\n\
  \n![提示](img/tip.png) 为了帮助视觉化页面上的各种框，你可能认为给某些或所有元素添加边框是一个好主意。然而，出于两个原因，这并不是一个好主意。首先，工作量很大。其次，添加边框会影响布局，所以你看到的并不是页面真实的盒模型全貌。更好的解决方案是……\n\
  \n\n\n\n\n`border-bottom-left-radius: radiusBL;`\n\n`}`\n\n例如，以下两条 CSS 规则实现了相同的圆角效果：\n\
  \n```css\naside {\n  border: 1px solid black;\n  border-radius: 50px 100px 10px;\n\
  }\n```\n\n```css\naside {\n  border: 1px solid black;\n  border-top-left-radius:\
  \ 50px;\n  border-top-right-radius: 100px;\n  border-bottom-right-radius: 10px;\n\
  \  border-bottom-left-radius: 100px;\n}\n```\n\n### 基于椭圆弧线圆化边框\n\n另一种圆化元素边角的方法是基于椭圆的弧度，这通过同时指定水平半径和垂直半径来定义。以下是此情况下使用的\
  \ `border-radius` 语法：\n\n```css\nselector {\n  border-radius: horizontal vertical;\n\
  }\n```\n\n- `selector`: 指定你想要样化的项目（或项目）的 CSS 选择器。\n- `horizontal`: 数值形式的水平半径（使用标准\
  \ CSS 测量单位之一，如 `px`、`em`、`rem`、`vw` 或 `vh`）或百分比（即元素宽度的百分比）。\n- `vertical`: 数值形式的垂直半径（使用标准\
  \ CSS 测量单位之一，如 `px`、`em`、`rem`、`vw` 或 `vh`）或百分比（即元素高度的百分比）。\n\n水平垂直半径定义了一个椭圆。图 1-11\
  \ 显示了工作原理（bk03ch01/example04.html）。左侧的元素没有圆角，因此它具有标准的直角。右侧的元素右上角设置了 `100px 50px`\
  \ 的圆角。注意边框的圆角是如何遵循内切椭圆的弧度的。\n\n例如，假设你有一个 `div` 元素，你想根据椭圆对其边框进行稍微圆化。以下是实现该效果的 CSS：\n\
  \n```css\ndiv {\n  border: 3px outset darkgreen;\n  border-radius: 10px 20px;\n\
  }\n```\n\n![CSS 基于椭圆弧线圆化边框的截图](img/9781394164684-fg030111.png)\n\n图 1-11： CSS 如何基于椭圆弧线圆化边框。\n\
  \n如果你想处理单个边角，语法会略有不同：\n\n```css\nselector {\n  border-top-left-radius: horizontalTL\
  \ verticalTL;\n  border-top-right-radius: horizontalTR verticalTR;\n  border-bottom-right-radius:\
  \ horizontalBR verticalBR;\n  border-bottom-left-radius: horizontalBL verticalBL;\n\
  }\n```\n\n这是一个示例：\n\n```css\naside {\n  border: 5px dashed red;\n  border-top-left-radius:\
  \ 50px 75px;\n  border-top-right-radius: 100px 50px;\n  border-bottom-right-radius:\
  \ 75px 100px;\n  border-bottom-left-radius: 50px 25px;\n}\n```\n\n## 操作元素外边距\n\n\
  CSS 盒模型的最后一个组件是 `margin`（外边距），它是框框周围的空间。外边距是 Web 设计中重要的细节，因为它可以防止元素紧贴浏览器内容区域边缘，确保两个元素不会相互重叠（除非你希望如此），并在元素之间创建舒适的留白。\n\
  \n与内边距（padding）一样，外边距分为四个部分——边框上方、右侧、下方和左侧——CSS 提供了四个相应的属性来为元素添加外边距：\n\n```css\n\
  selector {\n  margin-top: top-value;\n  margin-right: right-value;\n  margin-bottom:\
  \ bottom-value;\n  margin-left: left-value;\n}\n```\n\n- `selector`: 指定你想要样化的项目（或项目）的\
  \ CSS 选择器\n- `top-value` 等：一个数字后跟一个 CSS 测量单位（如 `px`、`em`、`rem`、`vw` 或 `vh`；请参考第\
  \ 3 册第 5 章 了解这些单位的含义）或百分比\n\n这是一个示例：\n\n```css\naside {\n  margin-top: 16px;\n \
  \ margin-right: 8px;\n  margin-bottom: 32px;\n  margin-left: 24px;\n}\n```\n\n![警告](img/warning.png)\
  \ 使用百分比时要小心。\n\n\n\n\n\n不，你没有幻觉：`header` 和 `nav` 元素之间的空间没有一点都没有改变！来到 CSS 的怪异世界！在这种情况下，这种怪异源于一种被称为“外边距合并”（collapsing\
  \ margins）的 CSS “特性”。当一个元素的底部边距与另一个元素的顶部边距紧挨时，按照常识，浏览器会将这两个外边距值相加。哈，想得美！相反，浏览器使用两个外边距值中较大的那，并放弃较小的值。也就是说，它将两个外边距值“合并”为一个单一值。\n\
  \n所以，这意味着你被住了吗？完全不是。要在两个元素之间获得额外的垂直空间，你有四种选择：\n\n*   增加底部元素的 `margin-top` 值。\n*\
  \   增加上方元素的 `margin-bottom` 值。\n*   如果你已经在底部元素上定义了 `margin-top`，且上方元素没有使用边框，则给上方元素添加一个\
  \ `padding-bottom` 值。\n*   如果你已经在上方元素上定义了 `margin-bottom`，且底部元素没有使用边框，则给底部元素添加一个\
  \ `padding-top` 值。\n\n在最后两点中，将一个元素的顶部或底部外边距与另一个元素的底部或顶部内边距相结合是有效的，因为浏览器不会合并外边距/内边距的组合。\n\
  \n![记住](img/remember.png) 如果你使用浮动或绝对定位元素（正如我在第 5 卷第 1 章中解释的那样），这些元素的外边距永远不会合并。此外，外边距在弹性容器中也不会合并（查看第\
  \ 5 卷第 2 章以了解什么是“弹性容器”）。\n\n## 处理负外边距\n\n我目前为止关于外边距合并的所有说明都适用于正外边距值，但负外边距呢？在这种情况下，有两种情况需要考虑：\n\
  \n*   **两个外边距都是负值：** 浏览器合并边距并使用“最负”的外边距作为合并后的值。例如，如果一个元素具有 `-20px` 的底部边距，而它下方的元素具有\
  \ `-10px` 的顶部边距，那么它们之间的垂直边距将合并为 `-20px`。\n*   **一个外边距为负值，另一个为正值：** 浏览器合并边距并取两个边距之间的净值作为合并后的值。例如，如果一个元素具有\
  \ `24px` 的底部边距，而它下方的元素具有 `-8px` 的顶部边距，那么它们之间的垂直边距将是 `16px`。\n\n## 其他外边距合并场景\n\n\
  ![技术细节](img/technicalstuff.png) 两个相邻元素之间垂直边距空间的合并令人费疼，而且完全不直观。然而，还有两种外边距会合并的场景，信你不信，这些场景其实是有道理的：\n\
  \n*   **当元素与其包含元素的顶部或底部之间没有任何任何内容时：** 假设元素 A 包含元素 B。如果元素 A 的顶部边距和元素 B 的顶部边距之间什么都没有——没有内容、内边距或边框——那么这些边距就会合并。同样，如果元素\
  \ A 的底部边距和元素 B 的底部边距之间没有内容、内边距或边框，这些边距也会合并。\n*   **当一个元素为空时：** 如果一个元素是空的——也就是说，它不包含任何内容，没有任何内边距或边框，并且没有设置\
  \ `height` 或 `min-height` 属性（参见下节）——该元素的顶部和底部外边距就会合并。\n\n## 设置元素尺寸\n\n当 Web 浏览器渲染页面时，它会检查每个元素并设置该元素的尺寸。对于像\
  \ `<header>` 和 `<div>` 这样的块级元素，浏览器按如下设置设置：\n\n*   **宽度 (Width)：** 设置为元素包含块的宽度。由于默认\
  \ `<body>` 元素的宽度设置为浏览器内容区域的宽度，在实践中，所有块级元素的宽度都设置为内容区域的宽度。\n*   **高度 (Height)：** 设置为刚好容纳元素所有内容的高度。\n\
  \n通过样式元素的 `width` 和 `height` 属性来更改元素的尺寸：\n\n```css\nselector {\n  width: width-value;\n\
  \  height: height-value;\n}\n```\n\n*   `selector`：CSS 选择器，用于指定你想要样化的项目（或多个项目）。\n\
  *   `width-value`, `height-value`：以下值之一：\n    *   **数字：** 确保在数字后面跟上我在第 3 卷第 5 章中提到的\
  \ CSS 测量单位（如 `px`、`em`、`rem`、`vw` 或 `vh`）。\n    *   **百分比：** 结果是应用于元素包含块相应维度的百分比。如果你设置宽度，该值为百分比乘以包含元素的宽度；如果你设置高度，该值则是百分比乘以包含元素的高度。\n\
  \    *   **关键字：** 对于 `width` 属性，你有三个选择：\n        *   `fit-content`：设置宽度大到包含元素的所有文本。如果文本多于包含元素宽度所容的，文本将在包含元素内换行。\n\
  \        *   `max-content`：设置宽度大到包含元素的所有文本。如果文本多于包含元素宽度所容的，文本将在包含元素内换行。\n      \
  \  *   `min-content`：将宽度设置为元素中最长的单词的。\n\n![技术细节](img/technicalstuff.png) 两个相邻元素之间垂直边距空间的合并令人费疼，而且完全不直观。然而，还有两种外边距会合并的场景，信你不信，这些场景其实是有道理的：（等等，用户文本重复了一些章节，我将保持流程流畅）。\n\
  \n例如，如果你有一个想要占据宽度四之三的 `aside` 元素，使用以下规则：\n\n```css\naside {\n  width: 75%;\n}\n\
  ```\n\n![记住](img/remember.png) 大多数时候你只会调整元素的宽度；设置正确的高度是出名的困难，因为它取决于太多的因素：内容、窗口大小、用户的默认字体大小等。\n\
  \n![提示](img/tip.png) 想把一个元素变成完美的圆形吗？你当然想！只需给元素设置相同的 `height` 和 `width` 值，然后将 `border-radius`\
  \ 属性（我在之前的“圆角边框”部分讨论过）设置为 `50%`：\n\n```css\ndiv {\n  border-radius: 50%;\n  height:\
  \ 100px;\n  width: 100px;\n}\n```\n\n### 设置最小或最大高度或宽度\n\n有时（实际上经常），为了让页面设计生效，你需要一个元素至少以某个高度或宽度渲染，即使元素的内容通常会决定更小的尺寸。如果元素最终的内容超过了指定的高度或宽度，元素按需要扩展也是允许的。\n\
  \n我在这里讨论的是为元素设置最小高度或宽度，你可以像操作 `min-height` 和 `min-width` 属性一样这样做：\n\n```css\nselector\
  \ {\n  min-height: height-value;\n  min-width: width-value;\n}\n```\n\n\n\n\n例如，如果\
  \ `section` 元素无论包含什么内容，高度都至少为 200 像素，请使用以下规则：\n\n```css\nsection {\n  min-height:\
  \ 200px;\n}\n```\n\n相反的情况是，你不希望一个元素的高度或宽度超过特定值。元素的高度或宽度可以小于该值，但永远不会超过该值，即使它的内容已经超过了其容纳范围。\n\
  \n为了实现这一目标，你需要为元素设置最大高度或最大宽度，这可以通过使用 `max-height` 和 `max-width` 属性来实现：\n\n```css\n\
  selector {\n  max-height: height-value;\n  max-width: width-value;\n}\n```\n\n*\
  \   `selector`: 指定你想样式的项目（或多个项目）的 CSS 选择器。\n*   `width-value`, `height-value`: 使用数字（后跟单位，如\
  \ `px`、`em`、`rem`、`vw` 或 `vh`；参见第 3 本书第 5 章）、百分比或关键字（`max-content`、`min-content`\
  \ 或 `auto`，由浏览器决定）。\n\n例如，如果一个 `aside` 元素无论包含什么内容，高度上不超过 200 像素且宽度不超过 150 像素，请使用以下规则：\n\
  \n```css\nfooter {\n  max-height: 200px;\n  max-width: 150px;\n}\n```\n\n![Tip](img/tip.png)\
  \ 使用 `max-height` 和 `max-width` 属性时遇到的一个问题是，当最大高度或宽度设置得太小无法包含内容时，内容会溢出。幸运的是，CSS\
  \ 有几个属性允许你优雅地处理此类溢出问题。从[`www.dummies.com/go/htmlcss&javascriptaiofd`](http://www.dummies.com/go/htmlcss&javascriptaiofd)\
  \ 下载奖励章节 4 深入了解这些属性。\n\n### 让宽度和高度合理\n\n宽度和高度似乎是非常直观的概念，但你现在就可以发现，CSS 擅长把简单的问题变得复杂。块级元素的尺寸就是一个很好的例子，因为你可能会认为块级元素的“尺寸”是其从内容到边框的大小：即内容加上内边距，再加上边框本身。并非如此。默认情况下，块级元素框的大小仅仅是框的内容部分。\n\
  \n这听起来可能并不令人警惕，但它意味着当你处理元素的尺寸时，如果你想让结果正确，就必须考虑它的内边距宽度和边框大小。相信我，考虑到所有这些并不是件容易事。幸运的是，帮助就在身边。你可以通过强制网络浏览器变得明智并定义元素的大小不仅包含内容，还包括内边距和边框，从而避免所有那些额外的计算。名为\
  \ `box-sizing` 的 CSS 属性是这里的英雄：\n\n```css\nselector {\n  box-sizing: border-box;\n\
  }\n```\n\n`box-sizing: border-box` 声明告诉浏览器将元素的高度和宽度设置为内容、内边距和边框。你可以将此声明添加到所有的块级元素规则中，但那样工作量太大了。相反，你可以使用一种技巧，即使用星号\
  \ (`*`) 选择器，它是引用页面上每个元素的简写方式：\n\n```css\n* {\n  box-sizing: border-box;\n}\n```\n\
  \n将此放在样式表的顶部，然后你再也不用担心它了。\n\n### 魔法般将内联元素转换为块级元素\n\n高度和宽度仅适用于 `<article>`、`<div>`\
  \ 和 `<p>` 等块级元素，而不适用于 `<span>` 和 `<a>` 等内联元素。然而，将内联元素转换为块是可能的。CSS 提供了两种方法来实现这种内联到块的蜕变：\n\
  \n*   **将其变为内联块。** 如果你想设置内联元素的宽度、高度或其他块相关的属性，但仍允许元素随周围文本流，请在元素的 CSS 声明中添加以下内容：\n\
  \n    ```css\n    display: inline-block;\n    ```\n*   **将其变为真正的块。** 如果你想设置内联元素的块相关属性，并且不再希望元素随周围文本流，请通过在元素的\
  \ CSS 声明中添加以下内容将其变成实实在在的块级元素：\n\n    ```css\n    display: block;\n    ```\n\n第二章\n\
  \n# 了解 CSS 选择器\n\n本章内容\n\n*   ![Bullet](img/check.png) **弄清楚父、子、兄弟和其他 CSS 亲属**\n\
  *   ![Bullet](img/check.png) **理解为什么选择器如此地重要**\n*   ![Bullet](img/check.png) **按类型、类或\
  \ ID 选择元素**\n*   ![Bullet](img/check.png) **定位子元素和兄弟元素**\n*   ![Bullet](img/check.png)\
  \ **按属性选择元素**\n\n*理解 CSS 最大的关键在于理解选择器。*\n*CHRIS COYIER*\n\n在第一本书第 1 章中，我们探索了 HTML\
  \ 的基础。在本章中，我们将深入探索 CSS 世界。\n\n### 向网络家族介绍你自己\n\n本章的核心概念之一——实际上也是所有 CSS 中最有用的概念之一——是每个元素之间的关系集。为了帮助你理解这些关系，有一个可以参考的下一页示例非常有用，在这里（参考\
  \ `bk03ch02/example00.html`）：\n\n```html\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  UTF-8\">\n  <title>So Many Kale Recipes</title>\n</head>\n<body>\n  <header>\n \
  \   <h1>Above and Beyond the Kale of Duty</h1>\n  </header>\n  <main>\n    <p>Do\
  \ you love to cook with kale?</p>\n    <p>Do you know the history of kale?</p>\n\
  \    <p>Are you obsessed with kale?</p>\n  </main>\n</body>\n</html>\n```\n\n如图\
  \ 1 所示，查看此代码的方法是将将其视为一组嵌套容器：\n\n*   `html` 元素包含了页面所有其他元素，因此它的容器包裹了一切。\n*   `html`\
  \ 元素内部有两个较小的容器：`head` 和 `body` 元素。\n*   `head` 元素内部有 `meta` 和 `title` 元素的容器。\n*\
  \   `body` 元素内部有 `header` 和 `main` 元素的容器。\n*   `header` 元素内部有一个 `h1` 元素的容器。\n* \
  \  `main` 元素内部有三个 `p` 元素的容器。\n\n![网页代码作为一组嵌套容器的示意图。](img/9781394164684-fg030201.png)\n\
  \n图 2-1: 网页代码作为一组嵌套容器。\n\n这里的关键在于这些容器的嵌套，因为正是嵌套决定了每个元素与其他所有元素之间的关系。其工作原理如下：\n\n\n\
  \n\n\n*   如果元素 `P` 包含元素 `C`，则元素 `P` 被称为元素 `C` 的`parent`（父）。例如在图 2-1 中，`body` 元素是\
  \ `header` 和 `main` 元素的父。\n\n*   如果元素 `C` 被包含在元素 `P` 中，则元素 `C` 被称为元素 `P` 的`child`（子）。例如在图\
  \ 2-1 中，`h1` 元素是 `header` 元素的子。\n\n*   如果元素 `C1` 和 `C2` 都包含在元素 `P` 中，则 `C1` 和 `C2`\
  \ 彼此称为`siblings`（兄弟）。例如在图 2-1 中，`main` 元素中的三个 `p` 元素是兄弟。\n\n*   如果元素 `C` 被包含在元素\
  \ `P` 中，且元素 `D` 被包含在 `C` 中，则元素 `D` 被称为元素 `P` 的`descendant`（后代），而元素 `P` 是元素 `D` 的`ancestor`（祖先）。例如在图\
  \ 2-1 中，`h1` 元素是 `body` 元素的后代。同样，`body` 元素是任何 `p` 元素的祖先。\n\n我在列表中向你介绍了很多新术语，如果现在还没有完全理解，请不要担心。当你通用\
  \ CSS（尤其是选择器）时，这些概念会迅速成为你的本能。\n\n## 选择器到底是做什么的？\n\n好了，选择器到底是什么？`selector`（选择器）是一种模式，用于尽可能准确地定义你想对页面上的哪些元素或元素进行样式设置。\n\
  \n通用的 CSS 规则看起来如下：\n\n```css\nselector {\n  one or more CSS declarations go here\n\
  }\n```\n\n这条规则的实际意思是：“打扰一下！给定匹配 `selector` 的任意元素或多个元素，请应用后续声明块中提供的所有样式。非常感谢。”\n\n\
  被选择器引用的任何元素被称为选择器的 `subject`（主体）。\n\n### 查看一些选择器示例\n\n我们在这里讨论的是什么类型的主体？种类都有：\n\n\
  *   元素名称（例如 `header` 或 `p`）\n*   具有指定 `id` 的元素\n*   具有特定属性或属性值的元素\n*   当前被选中的复选框\n\
  *   用户鼠标指针当前悬停的元素\n*   特定父元素的子\n*   特定祖先的后代\n*   特定元素的兄弟\n\n考虑到最后三点，你就能理解为什么学习页面元素之间的关系很重要了，正如我在上一节讨论的那样。\n\
  \n使用 使用选择器列表\n\n选择器最强大的方面之一是你可以将单个 CSS 声明块应用于多个选择器。例如，你可能需要对页面的 `nav` 和 `footer`\
  \ 元素应用完全样式。\n\n对多个元素应用相同的样式并不是问题，因为你可以创建一个`selector list`（选择器列表），允许你添加所需的任意选择器，而不是为每个元素创建独立的（且相同的）CSS\
  \ 规则。在你的列表中，每个选择器都用逗号隔开：\n\n```css\nselectorA, selectorB, …, selectorN {\n  one\
  \ or more CSS declarations go here\n}\n```\n\n为了方便阅读，大多数 Web 开发者会将每个选择器放在单独的一行，如下：\n\
  \n```css\nselectorA,\nselectorB,\n...,\nselectorN {\n  one or more CSS declarations\
  \ go here\n}\n```\n\n好了，理论够了。是时候开始实际选择东西了。\n\n![Remember](img/remember.png) 在接下来的页面中，我为你提供了大多数选择器的示例代码。问题是，为了让示例既实用又有趣，我使用了许多你可能不熟悉的属性名称。在大多数情况下，你可以查阅后续章节的解释：\n\
  \n*   任何与 padding（内边距）、borders（边框）、margins（外边距）和 sizes（尺寸）相关的内容，请参考第 3 卷第 1 章。\n\
  *   任何与颜色和背景相关的内容，前往第 3 卷第 6 章。\n*   任何与文本和对齐相关的内容，查看第 3 卷第 7 章。\n\n## 学习标准选择器\n\
  \n关于 CSS 选择器的好消息是，虽然 CSS 标准中有几十种选择器，但只有少数几个“主力军”是你编写大部分 CSS 规则时使用的。特别是我在接下来几节中介绍的选择器可能值得你纹在身体某处以便参考。\n\
  \n### 类型选择器\n\n`type selector`（类型选择器）通过元素名称匹配页面项目（因此它有时也被称为`element selector`元素选择器或`tag\
  \ selector`标签选择器）：\n\n```css\nelement {\n  property1: value1;\n  property2: value2;\n\
  \  ...\n}\n```\n\n例如，如果你想给每个 `aside` 元素加上边框，可以使用这样的 CSS 规则（查看 bk03）：\n\n```css\n\
  aside {\n  border: 3px solid black;\n}\n```\n\n### 类选择器\n\n`class selector`（类选择器）根据元素的\
  \ `class` 属性匹配元素。要使用类选择器，请在类名前加一个点 (`.`)。\n\n```css\n.class-name {\n  property1:\
  \ value1;\n  property2: value2;\n  ...\n}\n```\n\n例如，这里是 `subtitle` 类的规则：\n\n```css\n\
  .subtitle {\n  color: royalblue;\n  font-style: italic;\n}\n```\n\n#### 组合类型和类选择器\n\
  \n当你使用像 `.subtitle` 的选择器时，你是在要求浏览器匹配所有使用 `subtitle` 类的元素。然而，假设你的页面不仅不仅用于所有的 `h2`\
  \ 元素，还用于所有的 `h3` 元素。如何只针对这些 `h3` 元素呢？在类选择器之前加上元素名称：\n\n```css\nh3.subtitle {\n \
  \ border: 2px dashed royalblue;\n}\n```\n\n#### 匹配多个类\n\n元素拥有两个或多个类是可能的（事实上相当常见）。给标签添加多个类，仍然使用\
  \ `class` 属性，但在值中，用空格分隔每个类名。这里有一个例子：\n\n```html\n<h4 class=\"subtitle aside-title\"\
  >\n```\n\n然后你可以通过将类选择器链在一起来定位任何包含这两个类的元素，如下所示：\n\n```css\n.subtitle.aside-title\
  \ {\n  color: red;\n}\n```\n\n### id 选择器 (#)\n\n`id selector`（id 选择器）通过其唯一的 `id`\
  \ 属性匹配元素。要使用 id 选择器，请在 `id` 值前加一个哈希符号 (`#`)。\n\n```css\n#id-name {\n  property1:\
  \ value1;\n  property2: value2;\n}\n```\n\n\n\n\n`…`\n\n`}`\n\n例如，这里有一个 `page-title`\
  \ id (`bk03ch02/example03.html`) 的规则：\n\n```css\n#page-title {\ncolor: maroon;\n\
  font-family: \"Times New Roman\", serif;\ntext-transform: uppercase;\n}\n```\n\n\
  这个规则没有标签选择器或类选择器那么用，因为它只能针对单个元素，这就是为什么 Web 开发者很少使用 id 选择器。\n\n![Warning](img/warning.png)\
  \ 你可能正在考虑在多个元素上使用相同的 `id` 值，以便于应用某些 CSS 规则。请，离开文本编辑器！在同一个 HTML 文档中对两个或多个元素使用相同的有效\
  \ `id` 将使你的代码无效，并可能导致无尽的、无法预见的 CSS 困恼。更好的解决方案是在这些元素上都使用相同的 `class` 值，然后使用该 `class`\
  \ 来应用 CSS 规则。\n\n### 通用选择器 (*)\n\n*通用选择器*（*universal selector*）是类型选择器的一种特殊实例，因为你用它来匹配页面上的每一个元素：\n\
  \n```css\n* {\nproperty1: value1;\nproperty2: value2;\n…\n}\n```\n\n一些 Web 开发者使用通用选择器来对他们的\
  \ CSS 进行简单的重置：\n\n```css\n* {\npadding: 0;\nmargin: 0;\nbox-sizing: border-box;\n\
  }\n```\n\n要了解更多关于在项目中使用重置的信息，请查看第 3 本，第 4 章。\n\n## 选择后代、子元素和兄弟元素\n\nCSS 选择器中最强大且实用的类别之一是所谓的*组合器*（*combinators*）集合。这些是运算符（例如\
  \ `>` 和 `~`），允许你以某种方式将其他类型的选择器组合，以匹配选择器之间特定类型的关系：后代、子元素或兄弟元素。\n\n![Remember](img/remember.png)\
  \ 组合器的强大之处源于，你可以将它们与在本章中学到的任何其他类型的选择器配合使用。这种灵活性使你能够创建真正实用的 CSS 规则，只针对你想要样式的元素。\n\
  \n### 后代组合器 ( )\n\n与其针对特定的标签、类或 id，你可能需要针对包含在另一个元素中的特定元素的每一个实例。我在这里说的不仅仅是某些父元素的子元素，还包括该元素的后代。\n\
  \n为了对所有祖先元素的所有后代应用样式，CSS 提供了*后代组合器*。要设置一个使用后代组合器的选择器，你在规则中包含想要样式的祖先和后代类型，并用空格隔开：\n\
  \n```css\nancestor descendant {\nproperty1: value1;\nproperty2: value2;\n…\n}\n\
  ```\n\n例如，考虑以下 HTML (`bk03ch02/example04.html`)：\n\n```html\n<aside>\n  <h4>Links:</h4>\n\
  \  <div>\n    <a href=\"example01.html\">类型选择器</a><br>\n    <a href=\"example02.html\"\
  >类选择器</a><br>\n    <a href=\"example03.html\">id 选择器</a>\n  </div>\n</aside>\n```\n\
  \n这里有一个规则，为 `<aside>` 标签后代的 `<a>` 标签应用了一些样式：\n\n```css\naside a {\ncolor: red;\n\
  font-style: italic;\ntext-decoration: none;\n}\n```\n\n### 子组合器 (>)\n\n我在上一节中讨论的后代组合器是\
  \ CSS 世界中最强大的之一，因为它针对位于祖先元素内的所有特定类型的后代，无论这些后代在页面层级中处于多少层。然而，仅针对那些位于下方一层的后代（简而言之，即某些父元素的子元素）通常更合适且更于管理。\n\
  \n要对父元素的子元素应用某些样式，你使用*子组合器*，你用大于号 (`>`) 将父元素和子元素隔开：\n\n```css\nparent > child {\n\
  property1: value1;\nproperty2: value2;\n…\n}\n```\n\n例如，这里有一个规则，针对任何作为 `aside` 元素子元素的\
  \ `<h4>` 元素 (`bk03ch02/example05.html`)：\n\n```css\naside > h4 {\ncolor: green;\n\
  border-top: 3px solid black;\nborder-bottom: 5px double black;\npadding: 4px 0;\n\
  text-transform: uppercase;\n}\n```\n\n### 后续兄弟组合器 (~)\n\n一个常见的 CSS 任务是对符合以下标准的特定对象应用样式规则：\n\
  \n*   目标元素出现在 HTML 中指定元素（该元素被称为*引用*元素，*reference* element）的之后。\n*   目标元素和引用元素是兄弟元素。\n\
  \n为了对这样的对象应用某些样式，你使用*后续兄弟组合器*，你用波浪号 (`~`) 将引用元素和目标元素隔开：\n\n```css\nreference ~ target\
  \ {\nproperty1: value1;\nproperty2: value2;\n…\n}\n```\n\n例如，这里有一个规则，针对任何作为 `<h2>`\
  \ 元素后续兄弟的 `<ul>` 元素 (`bk03ch02/example06.html`)：\n\n```css\nh2 ~ ul {\nbackground:\
  \ lightpink;\nborder: 5px outset;\nlist-style: square;\npadding: 20px;\n}\n```\n\
  \n### 相邻兄弟组合器 (+)\n\n我在上一节讨论的后续兄弟组合器针对引用元素之后的所有兄弟，而你可能只需要针对紧跟在其后的*下一个*兄弟。\n\n为了对紧跟的兄弟元素应用样式，你使用*相邻兄弟组合器*，你用加号\
  \ (`+`) 将引用元素和目标元素隔开：\n\n```css\nreference + target {\nproperty1: value1;\nproperty2:\
  \ value2;\n…\n}\n```\n\n例如，这里有一个规则，针对任何 `<h2>` 元素的相邻 `<p>` 元素 (`bk03ch02/example07.html`)：\n\
  \n```css\nh2 + p {\nfont-style: italic;\n}\n```\n\n## 通过属性选择元素\n\n属性（*attribute*），正如我在第\
  \ 1 本第 1 章](#c01.xhtml) 中讨论的，是插入标签的某些额外代码。例如，在 `<a>` 标签中，`href` 属性指定地址。\n\n属性也允许你区分页面中的元素。例如，你的页面可能有许多\
  \ `<a>` 元素，但只有一个 `href` 属性等于 `https://www.w3.org/` 的 `<a>` 元素。\n\nCSS 利用这种差异性提供了多种*属性选择器*，允许你针对属性的存在、指定属性的值或该值的子集。\n\
  \n这是属性选择器的通用语法：\n\n```css\nelement[expression] {\nproperty1: value1;\nproperty2:\
  \ value2;\n…\n}\n```\n\n*   `element`: 你想要针对元素名称\n*   `expression`: 指定你想匹配的 `element`\
  \ 中的属性或属性值的表达式\n\n语法中的 `expression` 部分是关键，它通常是属性名、运算符和值的组合。表 2-1 为你介绍了所有可用的表达式类型。\n\
  \n| **选择器名称** | **语法** | **匹配内容** |\n| --- | --- | --- |\n| 仅属性 | `element[attr]`\
  \ | 任何包含 `attr` 属性的 `element` 实例。以下示例设置了所有具有 `title` 属性的 `abbr` 元素：`abbr[title]\
  \ {border: 1px dotted gray;}` |\n\n\n\n\n\n| 属性等于 | 选择器 | 描述 |\n| :--- | :--- |\
  \ :--- |\n| 属性等于 | `element[`attr=\"value\"]` | 任何 `element` 实例，其属性名为 `attr`，且值等于\
  \ `value`。下面的示例样式了所有 `href` 属性等于 [`https://www.w3.org/`](https://www.w3.org/) (bk03ch02/example09.html)\
  \ 的 `a` 元素：`a[href=\"https://www.w3.org/\"] {color: green;}`。 |\n| 属性开头为 | `element[`attr^=\"\
  value\"]` | 任何 `element` 实例，其属性名为 `attr`，且值以 `value` 开头。下面的示例样式了所有 `href` 属性以 `http://`\
  \ 开头的 `a` 元素 (bk03ch02/example10.html)：`a[href^=\"http://\"] {color: red;}`。 |\n\
  | 属性包含 | `element[`attr*=\"value\"]` | 任何 `element` 实例，其属性名为 `attr`，且值包含 `value`。下面的示例样式了所有\
  \ `id` 属性包含字符串 `navbar` 的 `div` 元素 (bk03ch02/example11.html)：`div[id*=\"navbar\"\
  ] {font-size: 14px;}`。 |\n| 属性结尾为 | `element[`attr$=\"value\"]` | 任何 `element` 实例，其属性名为\
  \ `attr`，且值以 `value` 结尾。下面的示例样式了所有 `href` 属性以 `.org` 结尾的 `a` 元素 (bk03ch02/example12.html)：`a[href$=\"\
  .org\"] {color: firebrick;}`。 |\n| 属性匹配 | `element[`attr|=\"value\"]` | 任何 `element`\
  \ 实例，其属性名为 `attr`，值等于 `value` 或以 `value`- 开头（即 `value` 后面跟着一个连字符 `-`）。下面的示例匹配了所有\
  \ `lang` 属性等于 `en` 或以 `en-` 开头的 `div` 元素 (bk03ch02/example13.html)：`div[lang|=\"\
  en\"] {color: blue;}`。 |\n| 属性包含单词 | `element[`attr~=\"value\"]` | 任何 `element`\
  \ 实例，其属性名为 `attr`，且值包含完整单词的 `value`。下面的示例匹配了所有 `alt` 属性包含完整单词 `photo` 的 `img` 元素\
  \ (bk03ch02/example14.html)：`img[alt~=\"photo\"] {border: 12px ridge saddlebrown;}`\
  \ 注意，此选择器不会匹配包含 `photograph` 或 `telephoto` 等单词的 `alt` 属性（假设它们在 `alt` 字符串的其他地方没有完整单词\
  \ `photo`）。 |\n\n[表格 2-1] CSS 属性选择器\n\n## 第 3 章\n\n# 伪学校：学习伪类和伪元素\n\n## 本章内容\n\n\
  - 掌握伪类\n- 选择子元素\n- 根据类型、状态或用户操作为元素设置样式\n- 使用功能性伪类让你的选择器游戏更上一楼次\n- 尝试使用一些伪元素\n\n\
  *pseudo: 形容词，几乎是，接近，或试图成为。* —— DICTIONARY.COM\n\n当你使用 CSS 时，你本质上是在为你用于构建页面结构的 HTML\
  \ 应用样式。你的 CSS 规则处理的是真实的东西（如果 HTML 标签可以被看作“真实”的话），比如标题（`h1`、`h2` 等）、段落（`p` 元素）、链接（`a`\
  \ 元素）和图像（`img` 元素）。\n\n然而，你的页面有一个在 HTML 代码中并不明显的（至少不显式）隐藏世界。页面访问者是否选中了复选框或单选按钮？用户是否将鼠标指针悬停在图像上？用户以前是否访问过你的某个链接？某个元素是否是其父元素的第一个子元素？（如果你不确定我指的*父*和*子*是什么意思，请参考第三部分的第\
