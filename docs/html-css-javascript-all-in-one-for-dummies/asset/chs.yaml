  \n## 使用 String 对象处理文本\n\n到目前为止，我在书中已经使用了几十个字符串示例。这些不仅包括字符串字面量（如 `\"HTML, CSS, and\
  \ JavaScript For Dummies\"`），还包括返回字符串的方法（例如 `prompt()` 方法）。因此，现在应该很清楚，字符串在所有的 JavaScript\
  \ 编程中都起着重要作用。\n\n为了帮助你完成这些任务，在本章中，你将探索 JavaScript 的三个内置对象：`String` 对象、`Date` 对象和\
  \ `Math` 对象。你将研究每个对象最重要的属性，掌握最常用的方法，并在这一过程中遇到许多实用的示例。\n\n*(注：由于输入文本存在大量重复，此处译文已进行去重处理)*\n\
  \n\n\n\n以下是你可以使用字符串模板来解决上述三个问题的方法：\n\n*   **处理内部引号：** 你可以在字符串模板内自由地放置任意数量的单引号或双引号：\n\
  \n    `` `Ah, here's the better way to do this!` ``\n\n*   **引入变量值：** 字符串模板支持一种被称为“变量插值”（variable\
  \ interpolation）的技术，这是一种直接在字符串内部引用变量值的方法。这里有一个示例：\n\n`const adjective = \"better\"\
  ;`\n\n``const paean = `Ah, here's the ${adjective} way to do this!`;``\n\n在任何字符串模板中，使用\
  \ `${variable}` 都会插入 `variable` 的值，无需疑问。实际上，你并不局限于变量。字符串模板还可以插值任何 JavaScript 表达式，包括函数的执行结果。\n\
  \n*   **多行字符串：** 字符串模板可以很好地工作且无错误地处理跨越多行的字符串：\n\n```javascript\nconst myHeader =\
  \ `\n  <nav class=\"banner\">\n    <h3 class=\"nav-heading\">Navigation</h3>\n \
  \   <ul class=\"nav-links\">\n      <li>Home</li>\n      <li>Away</li>\n      <li>In\
  \ Between</li>\n    </ul>\n  </nav>`;\n```\n\n### 确定字符串的长度\n\n`String` 对象的最基本属性是\
  \ `length`，它告诉你字符串中有多少个字符：\n\n`string`.`length`\n\n字符串中的所有字符——包括空格和标点符号——都计入长度内。唯一的例外是转义序列（例如\
  \ `\\n`），它们始终被计为一个字符。以下代码获取了各种 `String` 对象类型的 `length` 属性值。\n\n```javascript\nfunction\
  \ myFunction() {\n  return \"filename.htm\";\n}\n\nconst bookName = \"HTML, CSS,\
  \ and JavaScript For Dummies\";\nlength1 = myFunction().length; // 返回 12\nlength2\
  \ = bookName.length; // 返回 37\nlength3 = \"123\\n5678\".length; // 返回 8\n```\n\n\
  `String` 对象在属性上的缺失在方法上得到了倍补偿。有几十种方法，它们让你的代码能够执行许多有用任务，从在大写和小写字母之间转换，到在字符串中查找文本，再到提取字符串的部分。\n\
  \n### 查找子字符串\n\n*子字符串*（substring）是现有字符串的一部分。例如，字符串“JavaScript”的某些子字符串可以是“Java”、“Script”、“vaSc”和“v”。在脚本中处理字符串时，你通常需要判断给定的字符串是否包含给定的子字符串。例如，如果你正在验证用户的电子邮件地址，你应该检查它是否包含\
  \ @ 符号。\n\n[表 8-1] 列出了若干种在较大字符串中查找子字符串的 `String` 对象方法。\n\n你将在将在脚本中频繁使用这些方法中的每一个，因此我在接下来的章节中对它们进行了详细介绍。\n\
  \n| 方法 | 功能 |\n| --- | --- |\n| `string`.endsWith(substring, start)` | 检查 `substring`\
  \ 是否出现在 `string` 的末尾 |\n| `string`.includes(substring, start)` | 检查 `substring`\
  \ 是否出现在 `string` 中 |\n| `string`.indexOf(substring, start)` | 在 `string` 中搜索 `substring`\
  \ 的第一次出现的位置 |\n| `string`.lastIndexOf(substring, start)` | 在 `string` 中搜索 `substring`\
  \ 的最后一次出现的位置 |\n| `string.startsWith(substring, start)` | 检查 `substring` 是否出现在 `string`\
  \ 的开头 |\n\n[表 8-1] 用于查找子字符串的 String 对象方法\n\n#### startsWith(), includes(), 和 endsWith()\
  \ 方法\n\n如果你只想知道某个特定的子字符串是否存在于较大的字符串中，请使用以下方法之一：\n\n`string`.startsWith(substring,\
  \ position)`\n\n`string`.includes(substring, position)`\n\n`string`.endsWith(substring,\
  \ position)`\n\n*   `string`: 你想要从中搜索的字符串。\n*   `substring`: 你想要在 `string` 中查找的子字符串。\n\
  *   `position`: 一个可选的数值值，用于定义搜索的起始字符位置（对于 `startsWith()` 和 `includes()` 方法）或搜索的结束字符位置（对于\
  \ `endsWith()` 方法）。如果你省略此参数，JavaScript 将从字符串的开头（对于 `startsWith()` 和 `includes()`\
  \ 方法）或字符串的结尾（对于 `endsWith()` 方法）开始搜索。\n\n搜索是区分大小写的。如果这些方法在 `string` 中找到了 `substring`，它们返回\
  \ `true`；否则返回 `false`。以下是一些示例（请查看本书中的示例文件 bk04ch08/example01.html）：\n\n```javascript\n\
  const bookName = \"HTML, CSS, and JavaScript For Dummies\";\nbookName.startsWith(\"\
  HTML\"); // 返回 true\nbookName.startsWith(\"CSS\", 6); // 返回 true\nbookName.includes(\"\
  JavaScript\"); // 返回 true\nbookName.includes(\"And\"); // 返回 false\nbookName.endsWith(\"\
  Dummies\"); // 返回 true\nbookName.endsWith(\"JavaScript\", 25); // 返回 true\n```\n\
  \n从更实用的角度来说，以下代码（查看 bk04ch08/example01a.html）展示了一个使用 `includes()` 的简单验证脚本：\n\n```javascript\n\
  let emailAddress = \"\";\ndo {\n  emailAddress = prompt(\"Enter a valid email address:\"\
  );\n}\nwhile (!emailAddress.includes(\"@\"));\n```\n\n该脚本提示用户输入有效的电子邮件地址，并将其存储在\
  \ `emailAddress` 变量中。任何有效的地址都会包含 @ 符号，因此 `do…while()` 循环的 `while()` 部分会检查判断输入的字符串是否包含\
  \ @：\n\n`while (!emailAddress.includes(\"@\"));`\n\n如果不是（即 `emailAddress.includes(\"\
  @\")` 返回 `false`），循环将继续并再次提示用户。\n\n![记住](img/remember.png) `startsWith()`、`endsWith()`\
  \ 和 `includes()` 方法作为 ECMAScript 2015 (ES6) 的一部分引入，因此只有在你不需要支持像 Internet Explorer\
  \ 11 这样的旧浏览器时才使用它们。\n\n#### indexOf() 和 lastIndexOf() 方法\n\n当你想要找到子字符串的第一次出现时，请使用\
  \ `indexOf()` 方法；如果你需要找到子字符串的最后一次出现，请使用 `lastIndexOf()` 方法：\n\n`string`.indexOf(substring,\
  \ start)`\n\n`string`.lastIndexOf(substring, start)`\n\n*   `string`: 你想要从中搜索的字符串。\n\
  *   `substring`: 你想要查找的子字符串。\n*   `start`: 开始搜索的可选字符位置。如果你省略此参数，JavaScript 将从字符串的开头（对于\
  \ `indexOf()` 方法）或字符串的结尾（对于 `lastIndexOf()` 方法）开始搜索。\n\n在使用 `indexOf()` 或 `lastIndexOf()`\
  \ 时，你应该记住以下几点：\n\n*   字符串中的每个字符都有一个索引数字，该数字与字符在字符串中的位置相同。\n*   字符串像数组一样，是从零开始的，这意味着第一个字符的索引为\
  \ 0，第二个字符的索引为 1，依此类推。\n*   两种方法都区分大小写。例如，如果你搜索 `B`，这两种方法都无法找到任何 `b` 的实例。\n*   如果任一方法找到了\
  \ `substring`，它们返回 `substring` 第一个字符的索引位置。\n*   如果任一方法都没有找到 `substring`，它们返回 -1。\n\
  \n以下代码（bk04ch08/example02.html）在几种不同的情况下尝试了这些方法：\n\nHTML:```html\n<pre>\nHTML, CSS,\
  \ and JavaScript For Dummies\n0123456789012345678901234567890123456\n</pre>\n<div\
  \ id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\nconst bookName = \"HTML,\
  \ CSS, and JavaScript For Dummies\";\nlet str = \"\\\"C\\\" is at index \" + bookName.indexOf(\"\
  C\") + \"<br>\";\nstr += \"\\\"v\\\" is at index \" + bookName.indexOf(\"v\") +\
  \ \"<br>\";\nstr += \"The first space is at index \" + bookName.indexOf(\" \") +\
  \ \"<br>\";\nstr += \"The first \\\"S\\\" is at index \" + bookName.indexOf(\"S\"\
  ) + \"<br>\";\ndocument.getElementById(\"output\").innerHTML = str;\n```\n\n\n\n\
  ```javascript\nstr += \"The last \\\"S\\\" is at index \" + bookName.lastIndexOf(\"\
  S\") + \"<br>\";\nstr += \"The first \\\"a\\\" after index 12 is at index \" + bookName.indexOf(\"\
  a\", 12) + \"<br>\";\nstr += \"The substring \\\"Script\\\" begins at index \" +\
  \ bookName.indexOf(\"Script\");\ndocument.getElementById(\"output\").innerHTML =\
  \ str;\n```\n\n如图 8-1 所示，这些数字显示了脚本中每个字符的索引位置。\n\n![显示脚本中每个字符索引位置的数字的截图](img/9781394164684-fg040801.png)\n\
  \n图 8-1： `indexOf()` 和 `lastIndexOf()` 方法用于在字符串中搜索子字符串。\n\n### 提取子字符串的方法\n\n在子字符串中找到子字符串是一回事，但你通常也需要提取子字符串。例如，如果用户输入了电子邮件地址，你可能只需要提取用户名（@\
  \ 符号左侧的部分）或域名（@ 符号右侧的部分）。对于这类操作，JavaScript 提供了六种方法，这些方法列在表 8-2 中。\n\n| 方法 | 作用 |\n\
  | --- | --- |\n| `string.charAt(index)` | 返回 `string` 中由 `index` 指定索引位置的字符 |\n|\
  \ `string.charCodeAt(index)` | 返回 `string` 中由 `index` 指定索引位置的字符的代码 |\n| `string.slice(start,\
  \ end)` | 返回 `string` 中从 `start` 指定的索引位置开始、在 `end` 指定的索引位置之前立即结束的子字符串 |\n| `string.split(separator,\
  \ limit)` | 返回一个数组，数组中的每个项目都是 `string` 中的一个子字符串，这些子字符串由 `separator` 字符分隔 |\n| `string.substr(start,\
  \ length)` | 返回 `string` 中从 `start` 指定的索引位置开始且长度为 `length` 个字符的子字符串 |\n| `string.substring(start,\
  \ end)` | 返回 `string` 中从 `start` 指定的索引位置开始、在 `end` 指定的索引位置之前立即结束的子字符串 |\n\n表 8-2\
  \ 用于提取子字符串的字符串对象方法\n\n#### charAt() 方法\n\n你使用 `charAt()` 方法可以返回字符串内指定位置的单个字符：\n\n\
  `string.charAt(index)`\n\n*   `string`: 包含该字符的字符串\n*   `index`: `string` 中你想要字符所在的位置\n\
  \n以下是关于该方法的一些说明：\n\n*   要返回 `string` 中的第一个字符，请使用：\n    `string.charAt(0)`\n*   要返回\
  \ `string` 中的最后一个字符，请使用使用：\n    `string.charAt(string.length - 1)`\n*   如果 `index`\
  \ 值为负数或大于等于 `string.length`，JavaScript 将返回空字符串 (`\"\"`)。\n\n以下代码展示了一个示例 (bk04ch08/example03.html)：\n\
  \nHTML:\n```html\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\n\
  // 设置一个测试字符串数组\nconst stringArray = [];\nstringArray[0] = \"Not this one.\";\nstringArray[1]\
  \ = \"Not this one, either.\";\nstringArray[2] = \"1\\. Step one.\";\nstringArray[3]\
  \ = \"Should't get this far.\";\n// 遍历数组\nfor (const currentString of stringArray)\
  \ {\n  // 获取字符串的第一个字符\n  const firstChar = currentString.charAt(0);\n  // 它是数字吗？\n\
  \  if (!isNaN(firstChar)) {\n    // 如果是，则显示该字符串，因为我们要这个\n    document.getElementById(\"\
  output\").innerHTML = `Here's the one: \"${currentString}\"`;\n    // 到此结束，所以跳出循环\n\
  \    break;\n  }\n}\n```\n\n这里的思路是检查一个字符串集合并找到以数字开头的那个。该集合存储在名为 `stringArray` 的数组中，并设置了一个\
  \ `for…of` 循环遍历数组中的每个项目。`charAt()` 方法应用于每个数组项目（存储在变量 `currentString` 中），以返回第一个字符，并将其存储在变量\
  \ `firstChar` 中。在 `if` 测试中，逻辑表达式 `!isNaN(firstChar)` 当 `firstChar` 的值为数字时返回 `true`，此时正确的字符串将显示在网页上并中断循环。\n\
  \n![提示](img/tip.png) JavaScript 字符串中的每个字符都有一个索引数字，其中第一个字符索引为 0，第二个字符索引为 1，依此类推。你使用方括号表示法指定特定字符。例如，表达式\
  \ `myString[5]` 引用的是 `myString` 变量中存储的任何字符串索引为 5 的字符。\n\n因此，使用 `charAt()` 的替代方案是根据其索引数字引用你想要的字符。例如，以下两个表达式引用的是同一个字符：\n\
  \n`currentString.charAt(0)`\n`currentString[0]`\n\n#### slice() 方法\n\n使用 `slice()`\
  \ 方法从字符串中切出一个：\n\n`string.slice(start, end)`\n\n*   `string`: 你想要处理的字符串。\n*   `start`:\
  \ `string` 中你想要提取的第一个字符的位置。\n*   `end`: `string` 中紧接你想要提取的字符的可选位置。如果你省略此参数，`slice()`\
  \ 将提取从 `start` 到字符串结束的子字符串。此外，此参数可以是负数，在这种情况下它指定从字符串末尾的偏移量。\n\n以下代码 (bk04ch08/example03.html)\
  \ 运行了几个示例（查看图 8-2）：\n\nHTML:\n```html\n<pre>HTML, CSS, and JavaScript Dummies</pre>\n\
  <div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\nconst bookName = \"\
  HTML, CSS, and JavaScript Dummies\";\nlet str = \"slice(0, 4) = \" + bookName.slice(0,\
  \ 4) + \"<br>\";\nstr += \"slice(6, 9) = \" + bookName.slice(6, 9) + \"<br>\";\n\
  str += \"slice(15) = \" + bookName.slice(15) + \"<br>\";\nstr += \"slice(0, -12)\
  \ = \" + bookName.slice(0, -12);\ndocument.getElementById(\"output\").innerHTML\
  \ = str;\n```\n\n![slice() 方法的一些示例的截图](img/9781394164684-fg040802.png)\n\n图 8-2：\
  \ slice() 方法的一些示例。\n\n#### split() 方法\n\n`split()` 方法分解字符串并返回一个存储片段的数组：\n\n`string.split(separator,\
  \ limit)`\n\n*   `string`: 你想要处理的字符串。\n*   `separator`: 用于标记字符串分割位置的字符。例如，如果 `separator`\
  \ 是逗号，则将在字符串的每个逗号处进行分割。\n*   `limit`: 设置数组中存储项目数的可选值。例如，如果 `limit` 为 5，`split()`\
  \ 将前五个片段存储在数组中并忽略字符串的其余部分。\n\n![提示](img/tip.png) 如果你想将字符串中的每个字符作为独立的数组项目，请使用空字符串\
  \ (`\"\"`) 作为 `separator` 值。\n\n当你处理一个“结构良好”的字符串时，`split()` 方法非常有用。这意味着字符串包含一个字符，作为你想要设置为数组项目的每个字符串片段之间的分隔符。例如，我们经常处理*逗号分隔*的字符串：\n\
  \n`string1 = \"Sunday,Monday,Tuesday,Wednesday,Thursday,Friday,Saturday\";`\n\n\
  幸运的是，字符串中的每天都用逗号分隔，这使得使用 `split()` 方法变得轻而易举：\n\n`const string1Array = string1.split(\"\
  ,\");`\n\n\n\n\n当你运行此语句时，`string1Array[0]` 将包含 `\"Sunday\"`，`string1Array[1]` 将包含\
  \ `\"Monday\"`，依此类推。同样请注意，JavaScript 会自动为你设置好数组。你不需要使用 `new Array()` 来声明数组。\n\n\
  以下代码（`bk04ch08/example05.html`）尝试使用两个示例字符串来测试 `split()` 方法：\n\nHTML:\n```html\n\
  <div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\nconst string1 = \"\
  Sunday,Monday,Tuesday,Wednesday,Thursday,Friday,Saturday\";\nconst string2 = \"\
  ABCDEF\";\nlet str = \"\";\nconst string1Array = string1.split(\",\");\nstring1Array.forEach((value,\
  \ index) => {\n  str += `string1Array[${index}] = ${value}<br>`;\n});\nconst string2Array\
  \ = string2.split(\"\", 4);\nstring2Array.forEach ((value, index) => {\n  str +=\
  \ `string2Array[${index}] = ${value}<br>`;\n});\ndocument.getElementById(\"output\"\
  ).innerHTML = str;\n```\n\n在 `string1` 被拆分为 `string1Array` 后，该数组的 `forEach()` 方法会遍历数组并将项目写入全局变量\
  \ `str` 中。对于 `string2`，它使用空字符串作为分隔符，并对 `string2Array` 的大小限制为 4。同样，该数组的 `forEach()`\
  \ 方法会将数组值写入 `str` 变量。脚本最后通过将 `str` 写入页面来结束。图 8-3 显示了发生的情况。\n\n![split() 方法的一些示例截图。](img/9781394164684-fg0408.png)\n\
  \n图 8-3： split() 方法的一些示例。\n\n### substr() 方法\n\n如果你想提取子字符串并且知道该子字符串的长度，`substr()`\
  \ 方法通常是最佳选择：\n\n`string.substr(index, length)`\n\n*   `string`: 要操作的字符串。\n*   `index`:\
  \ 要提取的起始字符在 `string` 中的位置。\n*   `length`: 指定子字符串长度的可选值。如果你省略此参数，JavaScript 将提取到字符串的末尾。\n\
  \n以下代码（`bk04ch08/example06.html`）运行了 `substr()` 的一些示例；结果所示图 8-4。\n\nHTML:\n```html\n\
  <pre>\nHTML, CSS, and JavaScript For Dummies\n012345678901234567890123456\n</pre>\n\
  <div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\nconst bookName = \"\
  HTML, CSS, and JavaScript For Dummies\";\nlet str = \"substr(0, 9) = \" + bookName.substr(0,\
  \ 9)+\"br>\";\nstr += \"substr(15, 10) = \" + bookName.substr(15, 10) + \"<br>\"\
  ;\nstr += \"substr(26) = \" + bookName.substr(26);\ndocument.getElementById(\"output\"\
  ).innerHTML = str;\n```\n\n![substr() 方法的一些示例截图。](img/9781394164684)\n\n图 8-4： substr()\
  \ 方法的一些示例。\n\n### substring() 方法\n\n使用 `substring()` 方法从字符串中提取子字符串：\n\n`string.substring(start,\
  \ end)`\n\n*   `string`: 要操作的字符串。\n*   `start`: 要提取的第一个字符在 `string` 中的位置。\n*   `end`:\
  \ 可选值，指定要提取的最后一个字符之后的 `string` 位置。如果你遗漏了此参数，JavaScript 将提取从 `start` 到字符串末尾的子字符串。\n\
  \n以下代码（`bk04ch08/example07.html`）演示了 `substring()` 方法，结果所示图 8-5。\n\nHTML:\n```html\n\
  <pre>\nHTML, CSS, and JavaScript For Dummies\n0123456789012345678901234567890123456\n\
  </pre>\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\nconst bookName\
  \ = \"HTML, CSS, and JavaScript For Dummies\";\nlet str = \"substring(0, 9) = \"\
  \ + bookName.substring(0, 9) + \"<br>\";\nstr += \"substring(11, 14) = \" + bookName.substring(11,\
  \ 14) + \"<br>\";\nstr += \"substring(30) = \" + bookName.substring(30);\ndocument.getElementById(\"\
  output\").innerHTML = str;\n```\n\n![substring() 方法的一些示例截图。](img/9781394164684)\n\
  \n图 8-5： substring() 方法的一些示例。\n\n### 理解 splice(), substr() 和 substring() 之间的区别\n\
  \n`splice()`、`substr()` 和 `substring()` 方法非常相似，即使是经验丰富的 JavaScript 程序员也经常会混淆它们。以下是一些笔记，帮助你理解这三种字符串提取方法之间的区别：\n\
  \n*   `splice()` 和 `substring()` 方法执行相同的任务。唯一的区别是 `splice()` 允许对 `end` 参数使用负值。如果你想从原始字符串的末尾省略特定数量的字符，这非常有用。例如，如果你想提取最后三个字符以外的所有内容，可以使用：\n\
  \n    `string.splice(0, -3)`\n\n*   当你不确定提取出的字符串有多长时，使用 `splice()` 或 `substring()`。这通常意味着你会使用\
  \ `indexOf()` 和 `lastIndexOf()` 方法来寻找标记子字符串起点和终点的特定字符。然后将这些值作为 `splice()` 或 `substring()`\
  \ 的 `start` 和 `end` 参数。例如，假设你有一个格式为 [`www.domain.com`](http://www.domain.com) 的字符串，你想提取\
  \ `domain` 部分。这里有一个可以实现它的短程序：\n\n    ```javascript\n    const hostName = \"www.domain.com\"\
  ;\n    const firstDot = hostName.indexOf(\".\");\n    const lastDot = hostName.lastIndexOf(\"\
  .\");\n    const domainName = hostName.substring(firstDot + 1, lastDot);\n    ```\n\
  \n    ![提示](img/tip.png) 这种提取域名的技术虽然直观，但效率极低。使用 `split()` 是更好的方法（查看 split 方法）：\n\
  \n    `const domainName = hostName.split('.')[1];`\n\n\n\n\n| `date` | 变量名 | `Date`\
  \ 对象 |\n| :--- | :--- | :--- |\n| `yyyy` | 年份 | 四位整数 |\n| `yy` | 年份 | 两位整数 |\n|\
  \ `month` | 月份 | 从 `\"January\"` 到 `\"December\"` 的月份名称 |\n| `mth` | 月份 | 从 0（1\
  \ 月）到 11（12 月）的整数 |\n| `dd` |get 月的几 | 从 1 到 31 的整数 |\n| `hh` | 小时 | 从 0（午夜）到 23（晚上\
  \ 11:00）的整数 |\n| `mm` | 分钟 | 从 0 到 59 的整数 |\n| `ss` | 秒 | 从 0 到 59 的整数 |\n| `ms`\
  \ | 毫秒 | 从 0 到 999 的整数 |\n\n表 8-3 与 Date 对象相关的参数\n\n### 使用 Date 对象\n\n每当你在 JavaScript\
  \ 中处理日期和时间时，你都在操作一个 `Date` 对象的实例。准确地说，当你在 JavaScript 中处理 `Date` 对象时，你处理的是时间中的特定时刻，精确到毫秒。一个\
  \ `Date` 对象永远不会是一个时间段，它也不是一个在你的脚本运行时持续跳动的时钟。相反，`Date` 对象是一个时间快照，你用它来提取快照时的具体信息：年份、月份、日期、小时等。\n\
  \n### 指定当前日期和时间\n\n`Date` 对象最用途是存储当前的日期和时间。你可以通过调用 `Date()` 函数来实现，它是创建新 `Date` 对象的构造函数。通用格式如下：\n\
  \n```\nconst dateToday = new Date();\n```\n\n### 指定任何日期和时间\n\n如果你需要处理特定的日期或时间，就需要使用\
  \ `Date()` 函数的参数。`Date()` 函数的语法有五种版本（参考本章开头的参数列表）：\n\n```\nconst date = new Date(\"\
  monthdd,yyyyhh:mm:ss\");\n```\n\n```\nconst date = new Date(\"monthdd,yyyy\");\n\
  ```\n\n```\nconst date = new Date(yyyy,mth,dd,hh,mm,ss);\n```\n\n```\nconst date\
  \ = new Date(yyyy,mth,dd);\n```\n\n```\nconst date = new Date(ms);\n```\n\n以下语句给出了每种语法的示例：\n\
  \n```\nconst myDate = new Date(\"August 23, 2023 3:02:01\");\nconst myDate = new\
  \ Date(\"August 23, 2023\");\nconst myDate = new Date(2023, 8, 23, 3, 2, 1);\nconst\
  \ myDate = new Date(2023, 8, 23);\nconst myDate = new Date(1692763200000);\n```\n\
  \n### 提取关于日期的信息\n\n当你的脚本直接抛出存储在变量中的 `Date` 对象值时，结果并不特别吸引人。如果你想以更吸引的格式显示日期，或者想对日期进行算术操作，你需要更深入研究\
  \ `Date` 对象以提取特定信息，如月份、年份、小时等。你可以通过使用 表 8-4 中列出的 `Date` 对象方法来实现。\n\n利用这些方法的方法之一是使用任何你格式向用户显示时间或日期。这里有一个示例\
  \ (bk04ch08/example08.html)：\n\nHTML:\n\n```html\n<div id=\"output\"></div>\n```\n\
  \n| 方法语法 | 返回值 |\n| :--- | :--- |\n| `date.getFullYear()` | 四位数字形式的年份（1999、2000\
  \ 等） |\n| `date.getMonth()` | 年份中的月份；从 0（1 月）到 11（12 月） |\n| `date.getDate()` |\
  \ 月份中的日期；从 1 到 31 |\n| `date.getDay()` | 星期；从 0（星期日）到 6（星期六） |\n| `date.getHours()`\
  \ |get 中的小时；从 0（午夜）到 23（晚上 11:00） |\n| `date.getMinutes()` | 小时中的分钟；从 0 到 59 |\n\
  | `date.getSeconds()` | 分钟中的秒；从 0 到 59 |\n| `date.getMilliseconds()` | 秒中的毫秒；从 0\
  \ 到 999 |\n| `date.getTime()` | 自 GMT 1970 年 1 月 1 日以来的毫秒数 |\n\n表 8-4 提取日期值的 Date\
  \ 对象方法\n\nJavaScript:\n\n```javascript\nconst timeNow = new Date();\nconst hoursNow\
  \ = timeNow.getHours();\nconst minutesNow = timeNow.getMinutes();\nlet message =\
  \ \"It's \";\nlet hoursText;\nif (minutesNow <= 30) {\n    message += minutesNow\
  \ + (minutesNow === 1 ? \" minute past \" : \" minutes past \");\n    hoursText\
  \ = hoursNow;\n} else {\n    message += (60 - minutesNow) + ((60 - minutesNow) ===\
  \ 1 ? \" minute before \" : \" minutes before \");\n    hoursText = hoursNow + 1;\n\
  }\nif (hoursNow == 0 && minutesNow <= 30) {\n    message += \"midnight.\";\n} else\
  \ if (hoursNow == 11 && minutesNow > 30) {\n    message += \"noon.\";\n} else if\
  \ (hoursNow < 12) {\n    message += hoursText + \" in the morning.\";\n} else if\
  \ (hoursNow == 12 && minutesNow <= 30) {\n    message += \"noon.\";\n} else if (hoursNow\
  \ < 18) {\n    message += parseInt(hoursText - 12) + \" in the afternoon.\";\n}\
  \ else if (hoursNow == 23 && minutesNow > 30) {\n    message += \"midnight.\";\n\
  } else {\n    message += parseInt(hoursText - 12) + \" in the evening.\";\n}\ndocument.getElementById(\"\
  output\").innerHTML = message;\n```\n\n该脚本首先将用户的本地时间存储在 `timeNow` 变量中。然后使用 `getHours()`\
  \ 提取当前小时并存储在 `hoursNow` 变量中，使用 `getMinutes()` 提取当前分钟。\n\n### 从日期中提取月份名称\n\n如果你想以比标准\
  \ `Date` 对象显示更好的格式使用月份，你会遇到一个问题。`getMonth()` 方法返回的是数字而不是月份的实际名称：0 代表 1 月，1 代表 2\
  \ 月，以此类推。如果你倾向于使用名称，你需要某种方法从 `Date` 对象中提取名称。\n\n从日期中提取月份名称最简单的方法是使用 `toLocaleDateString()`\
  \ 方法：\n\n```\ndate.toLocaleDateString(locale, options)\n```\n\n- `date`: 你从中提取月份名称的\
  \ `Date` 对象。\n- `locale`: 指定要使用的语言的字符串，例如 `en-us`。使用 `default` 使用当前语言。\n- `options`:\
  \ 指定方法输出方式的 JavaScript 对象。要仅提取月份名称，使用对象 `{ month: 'long' }`。\n\n这里有一个示例 (bk04ch08/example09.html)：\n\
  \nHTML:\n\n```html\n<div id=\"output\"></div>\n```\n\nJavaScript:\n\n```javascript\n\
  const dateNow = new Date();\n```\n\n\n\n\n\n```javascript\ndocument.getElementById(\"\
  output\").innerHTML =\n`The date is ${dateNow}<br>`\n`The month name is ${dateNow.toLocaleDateString('default',\
  \ { month: 'long' })}`;\n```\n\n### 从日期中提取星期名称\n\n你在使用 `getDay()` 时面临着与使用 `getMonth()`\
  \ 类似的问题：将返回的数字转换为“易读”的名称，例如在本例中，0 代表星期日，1 代表星期一，依此类推。正如你所想象的，解决方案也是类似的：使用 `toLocaleDateString()`\
  \ 方法，但这次将对象 `{ weekday: 'long' }` 指定为 `options` 参数。这里是一个示例（bk04ch08/example10.html）：\n\
  \nHTML:\n```html\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\n\
  const dateNow = new Date();\ndocument.getElementById(\"output\").innerHTML =\n`The\
  \ date is ${dateNow}<br>`\n`The month name is ${dateNow.toLocaleDateString('default',\
  \ { weekday: 'long' })}`;\n```\n\n### 设置日期\n\n当你执行日期算术时，通常需要更改现有 `Date` 对象的值。例如，一个电子商务脚本可能需要计算出一个从销售发生日期起\
  \ 90 天后的日期。最简单的方法是创建一个 `Date` 对象，然后使用表达式或字面量来更改年份、月份或日期的其他组件。你可以通过使用在 表 8-5 中列出的\
  \ `Date` 对象方法来实现。\n\n| 方法语法 | 设置的是什么 |\n| :--- | --- |\n| `date`.setFullYear(yyyy)`\
  \ | 四位数字的年份（1999、2000 等） |\n| `date`.setMonth(mth)` | 年份中的月份；从 0（1 月）到 11（12 月）\
  \ |\n| `date`.setDate(dd)` | 月份中的日期；从 1 到 31 |\n| `date`.setHours(hh)` | 一天中的小时；从\
  \ 0（午夜）到 23（晚上 11:00） |\n| `date`.setMinutes(mm)` | 小时中的分钟；从 0 到 59 |\n| `date`.setSeconds(ss)`\
  \ | 分钟中的秒；从 0 到 59 |\n| `date`.setMilliseconds(ms)` | 秒中的毫秒；从 0 到 999 |\n| `date`.setTime(ms)`\
  \ | 自 GMT 1970 年 1 月 1 日以来的毫秒数 |\n\n表 8-5 设置值的 Date 对象方法\n\n以下代码（bk04ch08/example11.html）尝试了这些方法中的一些：\n\
  \nHTML:\n```html\n<div>\n<label for=\"user-year\">输入年份：</label>\n<input type=\"\
  text\" id=\"user-year\" size=\"4\" value=\"2024\">\n</div>\n<div>\n<label for=\"\
  user-month\">输入月份 (1-12):</label>\n<input type=\"text\" id=\"user-month\" size=\"\
  2\" value=\"1\">\n</div>\n<div>\n<label for=\"user-day\">输入日期 (1-31):</label>\n\
  <input type=\"text\" id=\"user-day\" size=\"2\" value=\"1\">\n</div>\n<div id=\"\
  output\"></div>\n```\n\nJavaScript:\n```javascript\n// 获取输入\nconst inputs = document.querySelectorAll('input');\n\
  // 为每个输入框添加 `change` 事件监听器\ninputs.forEach( input => {\n  input.addEventListener('change',\
  \ makeDate);\n});\n// 每当输入变化时运行此函数\nfunction makeDate() {\n  // 获取年份、月份（减 1）和日期\n\
  \  const userYear = document.querySelector('#user-year').value;\n  const userMonth\
  \ = document.querySelector('#user-month').value - 1;\n  const userDay = document.querySelector('#user-day').value;\n\
  \  // 创建一个新的 Date 对象\n  const userDate = new Date();\n  // 设置年份、月份和日期\n  userDate.setFullYear(userYear);\n\
  \  userDate.setMonth(userMonth);\n  userDate.setDate(userDay);\n  // 将日期信息转换为字符串\n\
  \  const dateString = userDate.toLocaleDateString('default', { month: 'long', day:\
  \ 'numeric', year: 'numeric' });\n  const dayName = userDate.toLocaleDateString('default',\
  \ { weekday: 'long' });\n  // 显示消息\n  document.getElementById(\"output\").innerHTML\
  \ =\n    `The date entered is: ${dateString}\n<br>The day of the week is: ${dayName}`;\n\
  }\n// 页面加载后立即运行函数\nmakeDate();\n```\n\nHTML 定义了三个 `input` 元素来收集年份、月份和日期。JavaScript\
  \ 将 `input` 元素存储在 `inputs` 节点列表中，然后遍历这些元素，为每个元素添加一个 `change` 事件处理器，并将 `makeDate`\
  \ 定义为回调函数。\n\n`makeDate` 回调函数将每个输入元素的值存储在一个变量中。注意，脚本从月份值中减去了 `1`，以获得 JavaScript\
  \ 使用的正确月份数字。\n\n接下来的四条语句是此示例的关键。一个新的 `Date` 对象被存储在 `userDate` 变量中。然后脚本运行了 `setFullYear()`、`setMonth()`\
  \ 和 `setDate()` 方法。\n\n此时，`userDate` 变量包含一个与提供的日期相对应的新日期。这意味着你可以使用 `toLocaleDateString`\
  \ 方法将日期转换为你需要的任何字符串。脚本首先定义了完整日期的字符串 (`dateString`)，然后定义了仅包含星期名称的字符串 (`dayName`)。完成后，脚本显示该日期及其对应的星期（查看\
  \ 图 8-7）。\n\n![记住](img/remember.png) 所有的“set”方法也会返回值。具体而言，它们返回了从 GMT 1970 年 1 月\
  \ 1 日到方法结果对应的新日期的毫秒数。因此，你可以使用“set”方法的返回值来创建一个新的 `Date` 对象：\n\n```javascript\nnewDate\
  \ = new Date(userDate.SetFullYear(userYear))\n```\n\n![脚本显示给定年份、月份和日期的星期](img/9781394684-fg0408.png)\
  \ 图 8-7 给定年份、月份和日期的。\n\n### 执行日期算术\n\n许多日期相关的脚本需要进行算术运算。例如，你可能需要计算两个日期之间的天数，或者可能需要计算从今天起六周后的日期。你目前为止学的方法以及\
  \ JavaScript 内部表示日期的方式，使得大多数日期计算变得简单。最简单的计算是涉及基本日期和时间单位的计算：年、月、日、小时、分钟和秒。例如，假设你需要计算从当前日期起五后的日期。这是一个可以实现此目的的代码片段：\n\
  \n```javascript\nconst myDate = new Date();\nconst myYear = myDate.getFullYear()\
  \ + 5;\nmyDate.setFullYear(myYear);\n```\n\n你使用 `getFullYear()` 获取年份，加上 5，然后使用 `setFullYear()`\
  \ 修改日期。\n\n### Determine 年龄\n\n作为一个实际示例，以下代码展示了一个计算年龄的脚本（bk04ch08/example12.html）：\n\
  \nHTML:\n```html\n<label for=\"date-picker\">选择你的出生日期：</label>\n<input type=\"date\"\
  \ id=\"date-picker\" value=\"2000-01-01\">\n<div id=\"output\"></div>\n```\n\nJavaScript:\n\
  ```javascript\n// 为日期选择器添加 `change` 事件监听器\nconst datePicker = document.querySelector('#date-picker');\n\
  datePicker.addEventListener('change', calculateAge);\n// 当日期变化时运行此函数\nfunction calculateAge()\
  \ {\n  // 从日期选择器的值创建一个 Date 对象\n  const birthDate = new Date(datePicker.value);\n\
  \  // 存储用户的出生年份\n  const birthYear = birthDate.getFullYear();\n  // 创建 Date 对象并将其设置为\n\
  \  // 用户在今年的生日\n  const birthdayDate = new Date();\n  birthdayDate.setMonth(birthDate.getMonth());\n\
  \  birthdayDate.setDate(birthDate.getDate());\n  // 存储当前日期和当前年份\n  const currentDate\
  \ = new Date();\n  const currentYear = currentDate.getFullYear();\n  // 计算用户的年龄\n\
  \  let userAge = currentYear - birthYear;\n  // 今年是否已经过生日？\n  if (currentDate <\
  \ birthdayDate) {\n    // 如果没有，将年龄减一\n    userAge -= 1;\n  }\n  // 输出结果\n  document.getElementById(\"\
  output\").innerHTML = `You are ${userAge} years old.`;\n}\n```\n\n\n\n\nHTML 设置了一个日期选择器来获取用户的出生日期。JavaScript\
  \ 部分为该日期选择器添加了一个 `change` 事件监听器，并在每次日期选择器发生变化时运行 `calculateAge` 函数。`calculateAge`\
  \ 函数将日期选择器的值转换为 `Date` 对象，然后将出生年份提取到 `birthyear` 变量中。\n\n脚本创建一个新的 `Date` 对象并将其存储在\
  \ `birthdayDate` 中。使用 `setMonth()` 修改日期——它被设置为 `birthDate.getMonth()`——以及使用 `setDate()`\
  \ 修改日期——它被设置为 `birthDate.getDate()`——但*没有*使用 `setFullYear()`。这让你让你了用户今年的生日。然后，将当前日期存储在\
  \ `currentDate` 中，并将年份存储在 `currentYear` 中。\n\n现在，脚本通过从 `currentYear` 中减去 `birthYear`\
  \ 来计算用户的年龄。然而，如果用户的生日在今年还没有到，这个结果将是不准确的，因此脚本会比较 `currentDate` 和 `birthdayDate`：如果\
  \ `currentDate` 小，意味着用户的生日还没到，所以脚本会在用户的年龄上减去 `1`。\n\n## 执行复杂的日期计算\n\n其他的日期计算更为复杂。例如，你可能需要计算两个日期之间的天数。对于这类计算，你需要利用\
  \ JavaScript 在内部将日期存储为毫秒值的这一特性。换句话说，它们是以数字形式存储的，当你处理数值时，可以使用数值表达式来对这些值进行计算。\n\n\
  这里的关键是将基础日期单位——秒、分钟、小时、天和周——转换为毫秒。这里是的一些可以帮助到你的代码：\n\n```javascript\nconst ONESECOND\
  \ = 1000;\nconst ONEMINUTE = ONESECOND * 60;\nconst ONEHOUR = ONEMINUTE * 60;\n\
  const ONEDAY = ONEHOUR * 24;\nconst ONEWEEK = ONEDAY * 7;\n```\n\n![记住](img/remember.png)\
  \ 在编程中，每当你拥有*常量*变量时——也就是说，它们的值在整个脚本运行过程中永远不会改变——传统的做法是将它们完全写大写字母，以帮助将其与普通变量区分开。\n\
  \n由于一秒等于 1,000 毫秒，`ONESECOND` 变量被赋值为 1000；由于一分钟等于 60 秒，`ONEMINUTE` 变量被赋值为 `ONESECOND\
  \ * 60`，即 60,000 毫秒。其他值也是以此得出的。\n\n### 计算两个日期之间的天数\n\n常见的日期计算涉及找出任意两个日期之间的天数。以下代码展示了一个执行此计算的函数（bk04ch08/example13.html）：\n\
  \n```javascript\nfunction daysBetween(date1, date2) {\n  // 将两个日期都转换为毫秒\n  const\
  \ date1Ms = date1.getTime();\n  const date2Ms = date2.getTime();\n  // 计算毫秒差\n \
  \ const differenceMs = Math.abs(date1Ms - date2Ms);\n  // 一天的毫秒数\n  const ONEDAY\
  \ = 1000 * 60 * 60 * 24;\n  // 转换为天并返回\n  return Math.round(differenceMs/ONEDAY);\n\
  }\n```\n\n该函数接受两个 `Date` 对象参数——`date1` 和 `date2`。注意，哪个日期早哪个日期后并不重要，因为该函数计算的是它们之间差值的绝对值。常量\
  \ `ONEDAY` 存储了一天的毫秒数，然后使用 `getTime()` 方法将两个日期转换为毫秒。结果存储在变量 `date1Ms` 和 `date2Ms`\
  \ 中。\n\n接下来，以下语句计算了两个日期之间差值的毫秒绝对值：\n\n```\nconst differenceMs = Math.abs(date1Ms\
  \ - date2Ms);\n```\n\n然后，通过将差值除以 `ONEDAY` 常量将其转换为天数。`Math.round()`（我将在下一节中讨论）确保了结果是一个整数。\n\
  \n## 处理数字：Math 对象\n\n很少有 JavaScript 程序员从不处理数字。我们大多数人都不得不编写拼凑的脚本来处理订单总额、生成销售税和运费、计算抵押贷款还款并执行其他数字计算任务。为此此，必须说，JavaScript\
  \ 的数值工具在编程世界中并不是最好的，但它们有足够的功能让大多数脚本编写者感到满意。这一节将向你介绍这些功能，并特别强调 `Math` 对象。\n\n你需要了解的第一点是，JavaScript\
  \ 喜欢保持简单，特别是在涉及数字时。例如，JavaScript 仅限于处理两种数值数据类型：*整数*——不带分数部分或小数部分的数字，例如 1、759 和 -50——以及*浮点数*——具有分数部分或小数部分的值，例如\
  \ 2.14、0.01 和 -25.3333。\n\n### 在字符串和数字之间转换\n\n当你在 JavaScript 中处理数值表达式时，确保你所有的操作数都是数值值是非常重要的。例如，如果你提示用户输入一个值，你需要检查结果以确保它不是字母或\
  \ `undefined`（`prompt()` 的默认值）。如果你尝试使用后者，例如，JavaScript 将报告其不是数字。\n\n\n\n\n`Math`\
  \ 对象的属性都是在数学运算中常用的常量。表 8-6 列出了所有可用的 `Math` 对象属性。\n\n| 属性语法 | 代表含义 | 近似值 |\n| ---\
  \ | --- | --- |\n| `Math.E` | 欧拉常数 | 2.718281828459045 |\n| `Math.LN10` | 10 的自然对数\
  \ | 2.302585092994046 |\n| `Math.LN2` | 2 的自然对数 | 0.6931471805599453 |\n| `Math.LOG2E`\
  \ | `E` 的底数为 2 对数 | 1.4426950408889633 |\n| `Math.LOG10E` | `E` 的底数为 10 对数 | 0.4342944819032518\
  \ |\n| `Math.PI` | 常数 π | 3.141592653589793 |\n| `Math.SQRT1_2` | 1/2 的平方根 | 0.7071067811865476\
