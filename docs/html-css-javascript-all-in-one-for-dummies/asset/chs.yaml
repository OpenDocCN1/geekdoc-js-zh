  \ **与 JavaScript 握手**\n\n*善始善终。*— 古腊谚言\n\n### HTML、CSS 和 JavaScript 到底是做什么的？\n\n\
  如果你是编织网页的新手，你可能会对 HTML、CSS 和 JavaScript 问一个非常基础——但也非常*敏锐*的问题：它们到底是做什么的？\n\n\n\n\n\
  从宏观来看，HTML、CSS 和 JavaScript 是当你访问网页时所看到内容的背后技术。诚然，你可靠的网页浏览器向你展示了页面文本和图像，但这些文本和图像呈现给你的方式取决于页面底层的\
  \ HTML、CSS 和 JavaScript 代码。这些技术具有三种独立但又相互关联的功能：\n\n*   **结构（Structure）：** 页面的基本骨架，例如页面标题、文本段落以及图像出现的位置。这是\
  \ HTML 的领域。\n*   **样式（Style）：** 页面的外观，包括字体、颜色和外边距。这是 CSS 的职权范围。\n*   **动态性（Dynamism）：**\
  \ 让页面能够执行动作的额外功能，例如与用户交互、“监听”鼠标点击和按键按下，以及根据特定条件向页面写入内容。这是 JavaScript 的工作。\n\n这就是大局。稍后我将在本书的后续部分更详细地介绍这些内容（从使用\
  \ HTML 添加结构 节中的 HTML 开始）。\n\n### 为什么要学习 HTML、CSS 和 JavaScript？\n\n我在引言中提到过，学习 HTML、CSS\
  \ 和 JavaScript 并不困难。这仍然是真的，但我必须承认，这并没有说明全部情况。是的，学习这些技术并不困难，但它们也绝非易事。虽然你可能在一个下午就能背下\
  \ HTML 的每一个元素，但 CSS 和 JavaScript 都是巨大的课题，需要时间来掌握。而且尽管 HTML、CSS 和 JavaScript 的基础知识具有令人愉悦的平缓学习曲线，但在你过了这些基础知识之后，很快就会遇到许多怪癖和陷阱，这些问题会让攀登之路变得陡峭。\n\
  \n因此，开门见山的 Basic 问题是合理的：你为什么可能想要费力学习 HTML、CSS 和 JavaScript 呢？毕竟，世界上不缺模板、网页生成器、内容管理系统和网页设计师，它们可以以不同的易用程度、成本和成功率，将你的文字和图像转换成实实在在的网页。为什么不采取这些更简单的路径来建立网络存在感呢？\n\
  \n问得好。事实确实可能是，如果你长期缺乏时间或动力，这些“让别人代劳大部分工作”的解决方案可能最适合你。但对于其他人，这里有我的理由——我称之为“四 C”——学习\
  \ HTML、CSS 和 JavaScript 来手工制作你自己的网页：\n\n*   **自由创作权（Carte blanche）：** 当你使用 HTML、CSS\
  \ 和 JavaScript 手工构建网页时，你对创作的每一个方面都拥有完全的自由：内容、颜色、字体、布局，以及一切。新网页是一张白纸（tabula rasa），你可以以任何喜欢的方式填充它。\n\
  *   **创造力（Creativity）：** 打造自己的网页意味着你不仅对你说什么，还对如何说拥有最终决定权（更不用说第一、二三权了）。你不会被他人的设计或愿景束缚手脚。相反，你可以以任何你想向世界展示的方式来表达自我。\n\
  *   **定制化（Customization）：** 几乎任何预制网页都是僵化的结构，在创建时仅提供最基础的自定义，而且在页面发布后通常无法进一步自定义。忘掉这些！当你的页面是手工制作时，从开始每种可能性对你都是开放，而且你的页面永远是无限自定义的。\n\
  *   **成本（Cost）：** 你可能会惊讶地发现，使用 HTML、CSS 和 JavaScript 制作自己网页的成本实际上为零。没错：零（0）美元（或欧元、比索等）。这怎么可能呢？因为，正如我在后续章节中讨论的，手工制作网页真正只需要一个文本编辑器，而大多数编辑器都是免费的。是的，你通常需要付钱让人将你的页面托管在网上（详情请查看第一部分的第\
  \ 3 章），但制作这些页面是免费的。\n\n### 看看这一切是如何运作的\n\n你了解网络。你浏览到手指发蓝。你体验过那些真正壮观的网站的奇妙。现在，当你准备开启学习如何创建自己网页的旅程时，你可能认为为了实现那些惊人的效果，你需要一些花哨软件。也许是一个大型页面布局程序，或者是一个带有制作网页的特殊插件和模板的高端文字处理器。又你可能需要一个极其复杂且昂贵的“网页处理器”应用，它提供了制作完美且看起来专业的页面所需的各种花哨。\n\
  \n嗯，我很荣幸地报告，你不需要任何那些东西。你开始制作网页真正需要的只是一个简陋的文本编辑器。你只有 Windows 的记事本（Notepad）或 Mac 的文本编辑（TextEdit）？是的，任选一个都可以。（谢天谢地，你不必使用这两个低级程序，因为世界上充斥着许多编辑器，旨在让输入和编辑\
  \ HTML、CSS 和 JavaScript——当然还有文本——变得轻而易举。而且大多数都是免费的！更多信息请参考第一部分的第 2 章：** 在 Windows\
  \ 11 中，选择开始⇒所有应用⇒记事本。启动程序时，记事本会自动显示一个新的文本文件。你也可以通过选择文件⇒新建来启动新文档。\n*   **文本编辑 (Mac)：**\
  \ 点击菜单栏中的搜索（放大镜），开始输入 `textedit`，然后在搜索结果中出现时点击 `TextEdit`。在弹出的对话框中，点击新建文档。你可以在任何需要的时候通过选择文件⇒新建启动新的文本文件。\n\
  *   **其他：** 如果你有其他文本编辑器，按你通常的方式启动它并创建一个新文件。\n\n![警告](img/warning.png) 使用文字处理器怎么样？嗯，从技术上讲，你可以使用\
  \ Microsoft Word 或 Apple Pages，但不推荐这样做。这些程序倾向于产生复杂的网页文件，并带有产生其不知用途的额外文件。为自己一个忙，使用文本编辑器来保持简单。\n\
  \n\n\n\n![Tip](img/tip.png) 如果你希望立即开始尝试，而无需创建任何文件，可以使用一些在线工具来让你无费地摆弄 HTML、CSS 和\
  \ JavaScript。查看第一本书的最后章节第 2 章来了解如何在在线进行网页编码。\n\n#### 关于保存 HTML 文件的注意事项\n\n在埋头编写将成为你网页的文本文件时，请确保养成良好的安全计算习惯。也就是说，确保定期保存你的工作。然而，根据我从读者那里收到的数千条笔记，我可以告诉你，让那些新手网页大师栽车的首要问题就是没有正确保存他们的\
  \ HTML 文件。\n\n为了帮助你轻松跨越这些保存障碍，这里有几条笔记需要仔细研究：\n\n*   **保存命令：** 你通过选择文件⇒  保存来保存文件。当你第一次对新文件执行此操作时，会弹出“另存为”对话框。你使用此对话框来指定三点：文件名、文件类型以及文件在硬盘上的位置。接下来的几条笔记将讨论关于名称和类型的小知识。\n\
  \n*   **使用正确的文件扩展名：** 对于普通的网页，你的文件名必须以 `.htm` 或 `.html` 文件扩展名结尾（例如 `mypage.html`）。因此，在为文件命名时，请务必指定\
  \ `.htm` 或 `.html`。\n\n    ![Remember](img/remember.png) 许多 HTML 初学者在命名文件时对应该使用\
  \ `.htm` 还是 `.html` 感到困惑。实际上，你可以使用其中任何一个，因为它们没有区别。尽管如此，大多数人选择使用 `.html` 扩展名。无论如何，在本章和整本书中，我都将此类称为“HTML\
  \ 文件”。\n\n*   **使用小写文件名：** 大多数服务器（存储网页的计算机）在处理大写字母和小写字母时是非常挑剔的。例如，典型的服务器认为 `index.html`\
  \ 和 `INDEX.HTML` 是两个不同的文件。我知道这很蠢。所以为了安全起见，请始终使用小写字母输入文件名。\n\n*   **不要使用空格：** Windows\
  \ 和 macOS 乐于处理包含空格的文件名。然而，如果网络服务器和浏览器遇到带有一个或多个空格的文件，可能会产生混乱。因此，不要在文件名中使用空格。如果你想在文件和目录名中分隔单词，请使用下划线\
  \ (`_`) 或连字符 (`-`)。\n\n*   **使用正确的文件类型：** 在“另存为”对话框中，你需要为你的 HTML 文件选择正确的文件类型。你如何操作取决于你正在使用的程序。在大多数程序（包括\
  \ TextEdit）中，你使用“文件格式”（或“另存为类型”）列表来选择网页（`.html`）或类似的内容，如图 1-1。这将确保记事本使用 `.htm` 或\
  \ `.html` 扩展名（而不是普通的 `.txt` 扩展名）。\n\n*   **保存：** 当你完成“另存为”对话框中的操作后，点击“保存”来保存文件。\n\
  \n#### 这本书四个字：编辑。保存。重新加载。重复。\n\n到目前，你可能已经发现了从文本文件制作网页最大的问题：你无法知道页面在发布到网上后看起来是什么样！幸运的是，一切还没有结束。大多数浏览器都乐意让你直接从计算机硬盘（或你用于保存文件的任何位置）加载文本文件。这意味着你可以在不必将其发布到网上之前测试你的页面。太棒了。\n\
  \n![大多数文本编辑器允许你选择网页文件类型的截图。](img/9781394164684-fg010101.png)\n\n图 1-1: 大多数文本编辑器允许你选择网页文件类型。\n\
  \n所以，假设你已经按照我在上一节中的描述创建并保存了 HTML 文件，你的第一个任务是在文本编辑器和网络浏览器中打开该 HTML 文件：\n\n*   **文本编辑器：**\
  \ 运行`打开` 命令（几乎总是通过选择文件⇒  打开或按下 `Ctrl+O` 或 `⌘  +O`来打开你要处理的 HTML 文件（如果它还没有打开的话）。\n\
  \n    ![Tip](img/tip.png) 当你运行“打开”命令时，出现的“打开”对话框可能不会显示你的 HTML 文件，因为默认情况下，编辑器只显示使用\
  \ `.txt` 扩展名的普通文本文件。要让你的 HTML 文件显示出来，请使用“文件类型”列表选择所有文档 (`*.*`) 或所有文件 (`*.*`)。\n\n\
  *   **网络浏览器：** 运行`打开` 命令来加载你在文本编辑器中打开的同一个 HTML 文件。寻找“打开”命令是易事还是难事，取决于你的操作系统：\n\n\
  \    *   **Windows：** 无论你使用 Edge、Chrome 还是 Firefox，按下 `Ctrl+O` 显示“打开”对话框；然后选择 HTML\
  \ 文件并点击“打开”。\n\n    *   **macOS：** 无论你使用 Safari、Chrome 还是 Firefox，选择文件⇒  打开，然后选择\
  \ HTML 文件并点击“打开”。\n\n\n\n\n\n* **超文本（HyperText）：** 在史前时代——即 20 世纪 80 年代——老人们将任何选中后能带你进入不同文档的文本称为\
  \ `hypertext`。所以这只是作为网页定义特征的链接的一种委婉指代。\n* **标记（Markup）：** 这些是指定网页内容在 Web 浏览器中如何显示的指令。\n\
  * **语言（Language）：** 这个词指的是构成页面所有标记可能性的代码集。\n\n但尽管 `HTML` 这个名字听起来很令人生畏，但 `HTML` 使用的代码甚至一点也不难学。它们只有寥几个，而且在很多情况下，它们甚至很有意义！\n\
  \n### 掌握 HTML 元素和标签\n\n从最基础的来说，`HTML` 不过一组标记代码的集合——被称为 `elements` ——它们定义了你网页的结构。在\
  \ `HTML` 中，“结构”是一个灵活的概念，可以指从页面的整体布局到单个单词，甚至仅仅是一个两个字符。\n\n对于你大多数的 `HTML` 工作，你都在创建一种容器。这个容器里可以存放什么类型的内容？主要是文本，尽管它们通常是整个网页区块，甚至是其他元素。\n\
  \n大多数 `HTML` 容器使用以下通用格式：\n\n```<element>content</element>```\n\n你在这里看到的是几个定义了特定\
  \ `HTML` `element` 容器的代码。许多 `elements` 是一个或两个字母的缩写，但有时也是整个单词。你总是用角括号 `<>` 包围这些元素；这些括号告诉\
  \ Web 浏览器它处理的是一段 `HTML`，而不仅仅是随机文本。被角括号包围的元素被称为 `tag`（标签）。\n\n![Remember](img/remember.png)\
  \ 一个 `HTML` 代码本身被称为 `element`；被角括号包围的元素被称为 `tag`。\n\n这些代码中的第一个——`<element>` 被称为\
  \ `start tag`（起始标签），它标记了容器的开始；第二个代码——`</element>` 被称为 `end tag`（结束标签），它标记了容器的结束。（注意结束标签中出现的额外斜杠\
  \ (`/`)。）\n\n在起始标签和结束标签之间，你拥有 `content`（内容），指的是标签中包含的任何内容。例如，这里有一个可能出现在网页中的简单句子：\n\
  \n```This is a web page with something important to say.```\n\nFigure 1-2 显示了这在\
  \ Web 浏览器中可能后的子的。\n\n![Screenshot of the sample sentence as it appears in a web\
  \ browser.](img/9781394164684-fg010102.png)\n\nFIGURE 1-2: 在 Web 浏览器中显示的示例句子。\n\n\
  呵，对吧？假设你想通过强调“important”来加强一下语气。在 `HTML` 中，用于强调的元素是 `em`，所以你可以这样修改你的句子：\n\n```This\
  \ is a web page with something <em>important</em> to say.```\n\n注意我是如何将 `important`\
  \ 这个词用 `<em>` 和 `</em>` 包围的？第一个 `<em>` 是起始标签，它告诉浏览器：“嘿，浏览器小哥！你知道接后面的文本吗？听话，把它当成强调文本处理。”这会一直持续到浏览器遇到结束标签\
  \ `</em>`，它让浏览器知道应该停止正在做的事情。所以 `</em>` 告诉浏览器：“好了，好了，强调已经足够了！”\n\n所有的 Web 浏览器都用斜体显示强调文本，所以该单词现在的显示方式，正如你可以从\
  \ Figure 1-3 中看到的。\n\n![Screenshot of the sentence revised to italicize the word\
  \ important.](img/9781394164684-fg010103.png)\n\nFIGURE 1-3: 修改后将 `important` 词斜体的句子。\n\
  \n许多其他结构都有标签，包括重要文本、段落、标题、页面标题、链接和列表。`HTML` 只是所有标签的总和。\n\n![Warning](img/warning.png)\
  \ 新手网页制作者最常的错误之一是忘记标识结束标签的斜杠 (`/`)。如果你在浏览器中查看页面时看起来不对，请寻找缺失的斜杠。还要检查是否使用了反斜杠 (\\\
  ) 而不是斜杠，这是另一个常见的错误。\n\n### 理解标签属性\n\n你经常会直接使用标签，但所有标签都能够以各种方式进行修改。这种修改可能简单到为标签提供一个唯一的标识符以供脚本或样式使用，也可能是更改标签运行的方式。无论何种情况，你都通过向起始标签中添加一个或多个\
  \ `attributes`（属性）来修改标签。大多数属性使用以下通用语法：\n\n```<tag attribute=\"value\">```\n\n在这里，你用想要应用于标签的属性名称替换\
  \ `attribute`，并用你想要的值替换 `value`。\n\n\n\n\n\n接下来，你添加 `<html lang=\"en\">` 标签。这个标签并没有太大作用，除了告诉任何尝试读取该文件的浏览器，它正在处理的是一个包含\
  \ HTML 元素的文件。它还使用 `lang` 属性来指定文档语言，在本例中是英语。\n\n同样，你文档的最后一行将始终是对应的结束标签：`</html>`。你可以将这个标签想象成\
  \ HTML 版本的“结束”。因此，你的每个网页都将在第二行包含这个内容：\n\n`<html lang=\"en\">`\n\n并且在最后一行包含这个：\n\n\
  `</html>`\n\n接下来的项目用于将页面分为两个部分：头部（head）和正文（body）。`head` 部分就像是页面的介绍。网络浏览器使用 `head`\
  \ 来收集有关该页面的各种类型的信息。`head` 部分可以出现许多项目，但在这个早期阶段，唯一具有实际意义的是页面标题，我会在下一节中讨论它，即“为你的页面命名标题”。\n\
  \n要定义头部，请在你之前输入的 `<html>` 标签下方立即添加 `<head>` 和 `</head>` 标签。所以，你的网页现在看起来像这样：\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n</head>\n</html>\n```\n\n\
  ![记住](img/remember.png) 虽然从技术上讲，输入大写或小写字母的标签名称没有区别，但 HTML 官方机构建议使用小写字母 HTML 标签，因此这是我在书中使用的风格，我也鼓励你这样做。\n\
  \n![记住](img/remember.png) 注意，我对 `<head>` 和 `</head>` 标签稍微缩进了一点（实际上是缩进了四个空格）。每当你的\
  \ HTML 标签位于另一个 HTML 容器内部时，这种缩进都是良好的做法，因为它使你的代码更易读且更易排查故障。\n\n当你处于 `head` 部分时，这里有一个让人头疼的问题（额外的小知识）：\n\
  \n```html\n<meta charset=\"utf-8\">\n```\n\n你将此元素放在 `<head>` 和 `</head>` 标签之间（为了方便阅读，再缩进四个空格）。它告诉网络浏览器你的网页使用了\
  \ UTF-8 字符集，你可以在大部分忽略它，只需知道 UTF-8 包含了人类已知的几乎每一个字符（国内和外国）、标点符号和符号。\n\n`body` 部分是你输入文本以及浏览器实际显示的其他有趣内容的地方。要定义正文，请在\
  \ `head` 部分之后（即 `</head>` 标签下方）放置 `<body>` 和 `</body>` 标签：\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n![警告](img/warning.png) 一个常见的页面错误是包含两个或多个副本的这些基础标签，特别是 `<body>`\
  \ 标签。为了获得最佳效果，请确保在每个页面上这五个基础结构标签——`<!DOCTYPE>`、`<html>`、`<head>`、`<meta>` 和 `<body>`——只使用一次。\n\
  \n#### 为你的页面命名标题\n\n当你浏览网页时，你可能注意到浏览器在当前标签页中显示了某些文本。标签页上的文字就是网页标题，这是一个简短（有时很长）的描述性短语。你可以通过在页面的\
  \ `head` 部分添加 `<title>` 标签来为自己的网页命名。\n\n要定义标题，请用 `<title>` 和 `</title>` 标签包裹标题文本。例如，如果你想让页面的标题为“我的温馨家首页”，请如下所示输入：\n\
  \n```html\n<title>My Home Sweet Home Page</title>\n```\n\n注意，你始终将标题放在 `head` 部分内部，所以你的基础\
  \ HTML 文档现在看起来像这样（查看 bk01ch01/example03.html）：\n\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>My Home Sweet Home Page</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n图 1-6 显示了此 HTML 文件加载到网络浏览器中的情况。注意标题是如何出现在浏览器的标签栏中的。\n\
  \n![插入到 title 标签中的文本显示在浏览器标签页中的截图](img/9781394164684-fg010106.png)\n\n图 1-6： 你插入\
  \ `<title>` 标签的文本显示在浏览器标签页中。\n\n在为你的页面考虑标题时，有几点需要记住：\n\n*   确保你的标题描述了页面的全部内容。\n\
  *   不要让你的标题太长。如果是这样，浏览器可能会将其截断，因为标签页没有足够的空间显示它。通常 50 或 60 个字符是极限。\n*   使用在离开上下文查看时也有意义的标题。例如，如果有人非常喜欢你的页面，那个人可能会将其添加到收藏或书签列表中。浏览器会在收藏列表中显示页面标题，因此当观众以后查看书签时，标题是有意义的。\n\
  *   不要使用晦涩或模糊的标题。\n\n#### 添加一些文本\n\n现在是时候输入你想在 `body` 中显示的文本来为骨架填充肉了。在大多数情况下，你可以像这样在\
  \ `<body>` 和 `</body>` 标签之间输入：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n<meta charset=\"utf-8\">\n<title>My Home Sweet Home Page</title>\n</head>\n\
  <body>\nHello World!\n</body>\n</html>\n```\n\n图 1-7 显示了浏览器如何显示此 HTML。\n\n![添加到页面正文的文本显示在浏览器窗口中的截图](img/9781394164684-fg010107.png)\n\
  \n图 1-7： 你添加到页面正文的文本显示在浏览器窗口中。\n\n\n\n\n前端 Web 开发的关键点之一是将网页的结构与其样式分离开。这使得页面构建更快、更易于维护，并且在各种浏览器和操作系统中更具预测性。`HTML`\
  \ 提供结构部分，而 `CSS` 则处理样式。\n\n就这部分而言这没问题，但 `HTML` 在执行其结构职责时有一些你需要了解的怪癖：\n\n- **这可不是你父辈眼中的结构。**\
  \ 换句话说，当你考虑文档的结构时，你可能会想到像文章（articles）、章节（sections）和段落这样较大的区块。`HTML` 处理了所有这些，但它也会在句子、单词甚至字符层级处理结构。\n\
  - **HTML 的结构通常都附带了一些样式。** 或者说，我应该说，所有网络浏览器在渲染某些 `HTML` 标签时，都带有一套预定义的样式。是的，我知道我刚刚说过分离结构和样式是最好的，所以这可能会让人有点困惑。可以这样想：当你用雪松木建造一个新的甲板时，完成的甲板具有天然的“雪松”外观，但你可以自由地涂上一层清漆或油漆。`HTML`\
  \ 是雪松木，而 `CSS` 就是油漆。\n\n我提到这些怪癖是因为它们可以帮助回答你在处理 `HTML` 标签时可能会产生的一些问题。\n\n![Remember](img/remember.png)\
  \ 理解为什么 `HTML` 如此运作的另一个关键是，大部分 `HTML` —— 特别其最新形态 `HTML5` —— 被设计成使得网页在某种程度上可以被分析页面的软件“理解”。一个重要的例子是某些视障用户使用的屏幕阅读器。如果屏幕阅读器能够轻松地从\
  \ `HTML` 标签中识别出整个页面的结构，它就能向用户正确呈现页面。同样，寻求索引、读取或通过其他分析页面的软件，只有当页面的 `HTML` 标签是页面意图结构的真实表示时，才能成功地做到。\n\
  \n# 使用 CSS 添加样式\n\n使用 `HTML` 进行 Web 编码如此着迷的原因之一是，你只需要几个基础标签就能搭建页面，并发现当你在浏览器中查看结果时，它通常运行得相当不错。它虽然不是艺术品，但不会让你的眼睛酸疼。这种基本功能和外观得益于所有网络浏览器应用于各种\
  \ `HTML` 元素的默认格式。例如，`<strong>` 文本以粗体显示，`<p>`（段落）元素之间留有一些垂直空间，而 `<h1>`（一级标题）文本显示比普通文本大得多。\n\
  \n浏览器的默认格式意味着即使是基础页面看起来也算合理，但我敢打赌，你之所以读这本书是因为你想追求比“合理”更高的目标。在这一节中，你将发现创建美观页面的秘诀是用你自己的样式来覆盖浏览器的默认格式。你通过为页面添加一些\
  \ `CSS` 来实现。\n\n## 了解级联样式表\n\n如果你想控制网页的外观，实现这一目标的捷径是一种被称为级联样式表（cascading style sheets，或\
  \ `CSS`）的 Web 编码技术。正如我在上一节中提到的，在构建任何 Web 项目时，你的设计目标应该始终分离结构和格式。`HTML` 的工作是处理结构部分，但要处理页面的格式，你必须转向\
  \ `CSS`。在进入细节之前，我先回答三个简单的问题：什么是样式？什么是表（sheet）？什么是级联？\n\n#### 样式：格式选项的组合\n\n如果你曾经用过像\
  \ `Microsoft Word`、`Google Docs` 或 `Apple Pages` 这样花哨的文字处理器，你可能在旅途中遇到过一两种样式。简而言之，一个样式（style）是一组封装成一个精美、整洁包的格式选项。例如，你可能有一个“标题”样式，它结合了四种格式选项：粗体、居中、24\
  \ 字体大小和 Verdana 字体。你可以将此样式“应用”到任何文本上，程序就会尽职尽地使用这四个选项对文本进行格式化。如果你以后改变了主意，决定标题应该使用\
  \ 18 点字体，你所做的就是重新定义“标题”样式。然后程序会自动遍历整个文档，并更新每个使用“标题”样式的文本片段。\n\n在网页中，样式的具有类似的功能。也就是说，它允许你为给定的页面元素（如\
  \ `<div>` 或 `<h1>` 等标签）定义一系列格式选项。像文字处理器的样式一样，网页样式有两个主要优势：\n\n- 它们节省了时间，因为你只需要创建一次样式格式定义，浏览器在每次使用相应的页面元素时都会应用该格式。\n\
  - 它们让你的页面更容易修改，因为你只需要编辑样式定义，然后页面中所有使用该样式的地方都会自动更新。\n\n例如，图 1-8 显示了 `<h1>` 文本在网络浏览器默认格式下的外观（查看\
  \ `bk01ch01/example05.html`）。图 1-9 显示了相同的 `<h1>` 文本，但现在我用几种样式增强了文本，包括边框、72 像素的字体大小和\
  \ Verdana 字体。\n\n\n\n\n`property` 部分是你想要应用的的 CSS 属性的名称。CSS 提供了大量的属性，每种属性都是一个短促的字母关键字，例如用于字体的\
  \ `font-family`、用于文本颜色的 `color` 以及用于边框粗细的 `border-width`。属性名后面跟着一个冒号（`:`）、一个为了提高可读性的空格、你想要赋值给属性的\
  \ `value`（值），最后是一个分号（`;`）。这行代码在行业内被称为 `CSS declaration`（CSS 声明）（尽管 `property-value\
  \ pair` 这种描述也很常见）。\n\n![Remember](img/remember.png) 始终使用小写字母输入 `property` 名称。如果\
  \ `value` 包含字母或连字符以外的任何字符，则需要用引号（单引号或双引号）将该值括起来。\n\n同样注意，声明被花括号（`{` 和 `}`）括起来。你可以在花括号之间放置多个声明，该集合被称为\
  \ `declaration block`（声明块）。应用到页面项目（如 HTML 元素）的声明块被称为 `style rule`（样式规则）。\n\n例如，以下规则对\
  \ `<h1>` 标签应用了 72 像素（由 `px` 单位表示）的字体大小：\n\n```\nh1 {\n  font-size: 72px;\n}\n```\n\
  \n下面的示例展示了我之前用于为 `h1` 元素设置的规则，如图 1-9 所示（再次，这段代码出现在 `bk01ch01/example06.html` 中）：\n\
  \n```\nh1 {\n  border-width: 1px;\n  border-style: solid;\n  border-color: black;\n\
  \  font-family: Verdana;\n  font-size: 72px;\n  text-align: center;\n}\n```\n\n\
  ![Remember](img/remember.png) 注意，如果使用制表符或两个四个空格对声明进行缩进，声明块最容易阅读。声明的顺序并不关重要；有些开发者使用字母顺序，而另一些则会将相关的属性分组。\n\
  \n除了对单个项目应用多种样式外，也可以对多个项目应用单个样式。你按照通常的方式设置样式，但在规则的开头不是单个项目，而是列出所有你想设置样式的项目，并用逗号分隔。在下面的示例中，`<header>`、`<aside>`\
  \ 和 `<footer>` 元素应用了黄色背景色：\n\n```\nheader,\naside,\nfooter {\n  background-color:\
  \ yellow;\n}\n```\n\n## 在页面上添加样式\n\n对于 HTML 标签，你只需要将标签放在你希望它出现在页面上的地方，但样式的处理并不那么简单。事实上，有三种主要方法为你的网页设置样式：内联样式（inline\
  \ styles）、内部样式表（internal style sheets）和外部样式表（external style sheets）。\n\n#### 插入内联样式\n\
  \n`inline style` 是直接插入到你想要格式化的任何标签中的样式规则。以下是通用的语法：\n\n```\n<element style=\"property1:value1;property2:value2;\
  \ ...\">\n```\n\n也就是说，你向标签添加了 `style` 属性，然后将其设置为一个或多个由分号分隔的声明。\n\n例如，为了给 `<h1>`\
  \ 标题应用 72 像素的字体，你可以添加一个使用 `font-size` CSS 属性的内联样式：\n\n```html\n<h1 style=\"font-size:\
  \ 72px;\">\n```\n\n![Remember](img/remember.png) 注意，内联样式仅应用于它所所在的标签内。考虑以下代码（查看 `bk01ch01/example07.html`）：\n\
  \n```html\n<h1 style=\"font-size: 72px;\">The Big Cheese</h1>\n<h1>Just How Big\
  \ Is This Cheese?</h1>\n<h1>And Why Cheese, Of All Things?</h1>\n```\n\n如图 1-10\
  \ 所示，较大的字体大小仅应用到第一个 `<h1>` 标签，而另外两个 `h1` 元素（此处应为 h1）将以浏览器的默认大小显示。\n\n#### 嵌入内部样式表\n\
  \n内联样式是一个非常有用的工具，但因为它们被硬挤在标签内部，它们往往难以维护，因为它们散落在整个页面的 HTML 代码中。你可能更希望将特定的样式规则应用到多个页面项目。\n\
  \n为了更方便维护样式，并利用 CSS 提供的将单个样式规则应用到多个页面项目的多种方法，你需要转向样式表，它可以是内部的（如我在此讨论的）或外部的（如我在下一节中讨论的）。\n\
  \n![只有顶部的 ltltlth1gtgt 标签具有内联样式，因此只有它的文本被设置了 72 像素。](img/...)\n\n\n\n如果你为 CSS 文件创建了子文件夹，请务必将该子文件夹添加到\
  \ `href` 值中（例如，`href=\"styles/filename.css\"`）。\n\n例如，假设你创建一个名为 `styles.css` 的样式表文件，并且该文件包含了以下样式规则：\n\
  \n```css\nh1 {\n  color: blue;\n}\n\np {\n  font-size: 24px;\n}\n```\n\n然后你通过 `<link>`\
  \ 标签引用该文件，如下所示（查看 `bk01ch01/example09.html`）：\n\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n<head>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
  <body>\n  <h1>This Heading Will Appear Blue</h1> <!-- 这一标题将显示为蓝色 -->\n  <p>这段文字将以\
  \ 24 像素的字体显示。</p>\n</body>\n</html>\n```\n\n为什么这种使用样式表的方法如此强大？你可以向任意数量的网页中添加相同的\
  \ `<link>` 标签，它们都将使用相同的样式规则，这为你的网站创建一致的视觉效果变得轻而易举。而且如果你决定 `<h1>` 文字应该变成绿色，你只需要编辑样式表文件（`styles.css`）。所有链接到该文件的每个页面都将自动更新为新样式！\n\
  \n## 使用 JavaScript 增加动态性\n\nJavaScript 在 Web 上是（而且在很长以来都是）通。诚然，网上有很多简陋的主页除了 HTML\
  \ 和少量的 CSS 别无一物，但其他一切——从简单的个人博客到华丽的设计师作品集，再到大型企业电子商务运营——都依赖 JavaScript 来让事物看起来美观，并按照预期的方式运行（至少在大多数情况下是这样）。\n\
  \n### 什么是 JavaScript？\n\n当 Web 浏览器遇到一个 HTML 文件时，它会经历一个简单但枯燥的过程：它逐行读取文件，从（通常是）顶部的\
  \ `<html>` 标签开始，到底部的 `</html>` 标签结束。过程中，它可能需要打破这种逐行的单调模式，根据其读取的内容执行某些操作。例如，如果它遇到了\
  \ `<img>` 标签，浏览器将立即要求 Web 服务器发送 `src` 属性中指定的图形文件副本（查看第二卷，第 3 章）。\n\n这里的重点是，Web 浏览器本质上真的只是一个页面读取机器，除了遵循\
  \ HTML 文件中的指令（标记）之外，它并不知道做其他任何事情。（为了方便起见，我忽略了浏览器的其他功能，如保存书签。）\n\n很多人痴迷于创建网页的原因之一，是因为他们从一开始就意识到自己对这个页面读取机器具有控制权。在\
  \ `<b>` 标签及其对应的 `</b>` 结束标签之间放入一些文本，浏览器就会忠实地将文本显示为**粗体**。创建一个 CSS 网格结构（查看第五卷，第 3\
  \ 章），浏览器就会将你原本杂乱无章的文本以整齐的行和列显示出来，不问任何问题。这两个例子说明，你现在不再仅仅是从外部查看页面，而是拥有了一把钥匙，可以进入机器的*内部*并开始操作它的控件。*这*就是吸引人们并让他们对网页设计产生浓厚兴趣的钩子。\n\
  \n想象一下，如果你能把控制页面读取机器的想法提升到新高度。想象一下，如果你不再是命令机器处理简单的标签和规则，而是发出更复杂的命令，实际上可以控制页面读取机器的内部运作。谁会想要呢？\n\
  \n嗯，这就是 JavaScript 的原理。它本质上只是一组你可以用它控制浏览器的命令。就像 HTML 标签一样，JavaScript 命令被直接插入到网页文件中。当浏览器对文件进行逐行读取并遇到\
  \ JavaScript 命令时，它就会执行该命令，就如此。\n\n然而，这里的在于，JavaScript 对页面读取机器提供的控制力远大于通过 HTML 标签获得的控制力。原因是\
  \ JavaScript 是一种完整的*编程语言*。HTML 中的“L”可能代表“Language”（语言），但 HTML 甚至没有一丝与编程语言相关的暗示。然而，JavaScript\
  \ 才是真正的编程程序。\n\n### 在页面中添加脚本\n\n好了，理论已经足够了。是时候卷起袖子，活动手指关节，开始编码了。本节描述了构建和测试脚本的标准程序，并将带你通过几个示例。\n\
  \n### <script> 标签\n\n脚本的基本容器自然而然是 HTML `<script>` 标签及其相关的 `</script>` 结束标签：\n\n\
  ```html\n<script>\n  // JavaScript 语句放在这里\n</script>\n```\n\n![技术细节](img/technicalstuff.png)\
  \ 在 HTML5 中，你可以不带任何属性地使用 `<script>`，但在 HTML5 之前，该标签看起来像：\n\n```html\n<script type=\"\
  text/javascript\">\n```\n\n`type` 属性告诉浏览器脚本中使用的编程语言，但现在 JavaScript 是默认的，所以你不再需要它。你仍然会在很多页面上看到带有\
  \ `type` 属性的 `<script>` 标签，所以我认为最好让你知道它的含义。\n\n### 你把 <script> 放在哪里？\n\n在某些例外情况下，你将\
  \ `<script>` 标签放在哪里并不重要。HTML 标准建议将 `<script>` 标签放置在页面头部（即在 `<head>` 和 `</head>`\
  \ 之间），这就是我使用的风格：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta\
  \ charset=\"utf-8\">\n  <title>你把脚本放在哪里？</title>\n  <script>\n    // JavaScript\
  \ 语句放在这里\n  </script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n以下是“脚本可以随处放置”技巧的例外情况：\n\
  \n*   如果你的脚本被设计为向页面写入数据，则 `<script>` 标签必须位于页面主体内（即在 `<body>` 和 `</body>` 之间），并位于你希望文本出现的精确位置。\n\
  *   如果你的脚本引用页面上的某个项目（例如表单对象），则脚本必须放在该项目*之后*。\n*   对于许多 HTML 标签，你可以作为标签内的属性添加一个或多个\
  \ JavaScript 语句。\n\n![记住](img/remember.png) 在单个页面内插入多个 `<script>` 标签是完全可以的，只要每个标签都有相应的\
  \ `</script>` 结束标签，并且你没有将一个 `<script>` 块嵌套另一个。\n\n### 示例 #1：向用户显示消息\n\n你现在准备好构建并尝试你的第一个脚本了。这个示例为你展示了最简单的\
  \ JavaScript 操作：向用户显示基本消息。以下代码显示了 HTML 文件中的脚本（参考 `bk01ch01/example10.html`）：\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>向用户显示消息</title>\n  <script>\n    alert(\"Hello JavaScript World!\");\n\
  \  </script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n如所示，将脚本放置在页面头部，保存文件，然后在浏览器中打开该\
  \ HTML 文件。\n\n此脚本只包含一行：\n\n`alert(\"Hello JavaScript World!\");`\n\n这被称为一个*语句*（statement），每个语句都旨在执行单个\
  \ JavaScript 任务。你的脚本范围将从只有几个语句的简单程序到包含几百条语句的大型项目。\n\n你可能对语句末尾的分号（`;`）感到好奇。眼光不错。你使用分号来标记每个\
  \ JavaScript 语句的结束。\n\n\n\n在示例中，该语句运行 JavaScript 的 `alert()` 方法，该方法会向用户显示括号内的任何消息（这可以是欢迎信息、你网站新功能的公告、促销广告等）。图\
  \ 1-12 显示了你打开该文件时出现的消息。\n\n![技术性内容](img/technicalstuff.png) `method`（方法）是一种特殊的 JavaScript\
  \ 特性，你用它来指定你想让代码执行的操作。\n\n![打开包含示例脚本的 HTML 文件时，出现此“alert”消息的截图](img/9781394164684-fg010112.png)\n\
  \n图 1-12： 当你打开包含示例脚本的 HTML 文件时，会出现这个“alert”消息。\n\n浏览器是如何知道要运行这段 JavaScript 语句的？当浏览器处理（用术语说就是\
  \ `parses`，解析）一个页面时，正如我之前提到的，它基本上是从 HTML 文件的开始处，一行一行向下工作的。如果它遇到了 `<script>` 标签，它就知道后面有一条或多个\
  \ JavaScript 语句，并在读取到这些语句时立即按顺序自动执行它们。唯一的例外是 JavaScript 语句被封装在一个 `function`（函数）中，我将在第\
  \ 4 卷第 5 章 中解释。\n\n![警告](img/warning.png) JavaScript 编程的格律之一是“一条语句一行”。也就是说，每条语句必须出现在单行中，并且每行不能超过一个语句。我在上一句的后半部分使用“应该”一词，是因为在单行内放置多条语句的，只要你用分号（`;`）将每条语句分开即可。在少数情况下，确实在一行中编写两个或多个语句，但在大多数编程中，你应该避免这样做，因为包含多条语句的行难以阅读和排查故障。\n\
  \n### 示例 #2：向页面写入文本\n\nJavaScript 最强大的功能之一是能够动态地向网页写入文本，甚至写入 HTML 标签和 CSS 规则。也就是说，当网络浏览器加载页面时，文本（或其他任何内容）会被插入到页面中。这有什么用呢？首先，它对于时间敏感的数据非常理想。例如，你可能想显示网页最后修改的日期和时间，以便访问者知道页面的新旧程度。这里是展示恰好此类脚本的一些代码（请查看\
  \ `bk01ch01/example11.html`）：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n<meta charset=\"utf-8\">\n<title>向页面写入数据</title>\n</head>\n<body>\n这是一行普通的文本。<br>\n\
  <script>\ndocument.write(\"Last modified: \" + document.lastModified)\n</script>\n\
  <br>这是另一行普通的文本。\n</body>\n</html>\n```\n\n注意脚本是如何出现在 HTML 文档的 `body` 标签中的，每当你想向页面写入数据时，这都是必要的。图\
  \ 1-13 显示了结果。\n\n![打开文件时，文本显示了文件最后修改的日期和时间的截图](img/9781394164684-fg010113.png)\n\
  \n图 1-13： 当你打开文件时，文本显示了文件最后修改的日期和时间。\n\n此脚本使用了 `document` 对象，这是一个内置的 JavaScript\
  \ 结构，指向脚本所在的任何 HTML 文件（文档）（有关 `document` 对象的更多信息，请参阅第 4 卷第 6 章）。`document.write()`\
  \ 语句告诉浏览器将括号内的任何内容插入网页。`document.lastModified` 部分返回文件最后更改并保存的日期和时间。\n\n# 第 2 章：准备编码\n\
  \n## 本章内容\n\n- ![项目符号](img/check.png) **安装各种 浏览器进行测试**\n- ![项目符号](img/check.png)\
  \ **设置你的文件夹**\n- ![项目符号](img/check.png) **学习在良好的文本编辑器中寻找什么**\n- ![项目符号](img/check.png)\
  \ **确保你拥有所需的一切**\n- ![项目符号](img/check.png) **使用 WebDev Workbench 构建代码**\n\n*警惕那些要求新衣服的企业。*\n\
  —— 亨利·戴卫·梭罗\n\n对于开始尝试新爱好或消遣的人来说，快速让人沮丧的事情之一，就是早早意识到要尽可能把某事做对，你需要相当多的新东西：新工具、新材料，是的，也许甚至还有新衣服。这就足以扼灭对烘焙、跑步或麦织绳结的新奇兴趣了。\n\
  \n学习使用 HTML、CSS 和 JavaScript 构建网页最具吸引力的特征之一是，你不需要昂贵或复杂的设置即可开始。事实上，你可能什么新东西都不需要，因为如果你有一台\
  \ Windows PC 或 Mac，那么几乎可以肯定你已经拥有了一切。\n\n尽管如此，仍有一些基础工作需要你完成，以确保有一个良好的开始，在本章中，你将探索这些相关内容。你还将深入文本编辑器的世界，以防你的\
  \ Windows 或 Mac 默认编辑器无法满足需求。最后，本章将介绍测试 HTML、CSS 和 JavaScript 的工具。准备好了吗？\n\n### 设置你的浏览器\n\
  \n在第 1 卷第 [1 章]中，我讨论了“编辑-保存-刷新”循环，即你修改并保存代码，然后在浏览器中重新加载文件以检查效果。这是一个良好的习惯，但我还想敦你在各种浏览器中练习这种习惯。为什么？因为现在的现代桌面浏览器渲染页面的方式相似，但并非总是如此。页面越大、越复杂，在某个浏览器中出现明显差异的可能性越高。\n\
  \n在大多数情况下，这种差异不会是致命的，是可以接受的。但在某些情况下，差异可能会对页面的外观或运行产生重大影响，这时你需要找到解决方法或替代方案。\n\n好消息是，你不需要为\
  \ Windows 和 macOS 提供的几十种浏览器测试你的页面。相反，安装并使用以下“四大”浏览器就足够了，它们占据了桌面浏览器市场 90% 以上份额：\n\
  \n- **Google Chrome:** `https://www.google.com/chrome/`\n- **Apple Safari（仅限 macOS）:**\
  \ `https://support.apple.com/downloads/safari`\n- **Microsoft Edge:** `https://support.microsoft.com/microsoft-edge`\n\
  - **Mozilla Firefox:** `https://www.mozilla.org/firefox/new/`\n\n手机和平板浏览器呢？是的，它们同样重要，但在你把页面放到网上之前，我会先不讨论它们。我将在第\
  \ 1 卷第 [4 章]中详细讨论测试你的页面。\n\n## 创建本地文件夹\n\n你可能只想创建一个网页，在这种情况下，你不需要太担心将 HTML 文件存储在计算机的哪个位置。例如，将文件放入你用户账户的“文档”文件夹中即可。\n\
  \n\n\n然而，你购买了这本相当厚的书，这说明你不是那种看一页就去尝试下一个爱好的人。不，你来这里是为了创建`bunch`（一大堆）页面，我说的对吗？如果是这样，那么在开始之前，你得考虑一下你想要如何在本地上存储你的网页内容（即存储在你的电脑上）。\n\
  \n### 第一步，创建本地根文件夹\n\n你首先创建一个文件夹，作为你所有 Web 项目的基地。在 Web 开发行业中，这个文件夹被称为 `root`（根目录），因为你所有的\
  \ Web 项目都从这个文件夹“分支”出来。\n\n在哪里创建这个 `root` 文件夹或给它起什么名字其实并不太重要。这里有几点需要考虑：\n\n*   **让它易于找到。**\
  \ 文件夹应该相对容易，这通常意味着不要把它深埋在硬盘的文件夹层级中。在你的用户账户的“文档”文件夹下创建一个子文件夹作为 `root` 是一个不错的选择。\n\
  *   **起一个好记的名字。** 名字应该具有足够的描述性，让你立刻看出它是你的网页根目录。`public_html` 这个名字非常常见，因为（正如你在第一本书第\
  \ 3 章中所学到的），许多 Web 托管提供商会自动为你在服务器上的根目录分配这个名字。另一个常见的根文件夹名称是 `htdocs`（`hypertext documents`\
  \ 的缩写）。\n\n### 现在创建本地子文件夹（如果有的话）\n\n从这里开始的操作取决于你打算构建多少 Web 开发项目，以及每个项目中的文件数量：\n\n\
  *   **仅包含几个文件的单个 Web 开发项目。** 在这种情况下，只需将所有文件放入 `root` 文件夹即可。\n*   **包含许多文件的单个 Web\
  \ 开发项目。** 典型的 Web 开发项目更有可能的情况有多个 HTML、CSS 和 JavaScript 文件，以及图像、字体等大量辅助文件。虽然将所有 HTML\
  \ 文件放在 `root` 文件夹中也可以，但为了 sake 你自己的考虑，请按文件类型将所有其他文件组织到子文件夹中：一个用于 CSS 文件的 `css` 子文件夹，一个用于\
  \ JavaScript 文件的 `js` 子文件夹，一个用于图形的 `images` 文件夹，以此此类推。\n*   **多个 Web 开发项目。** 作为一名\
  \ Web 开发者，你几乎会创建大量的 Web 项目，因此对它们进行组织至关重要。理想的方法是为每个项目创建一个独立的根子文件夹。然后在这些子文件夹中的每一个中，你可以为\
  \ CSS、JavaScript、图像等文件类型创建子子文件夹。\n\n## 选择你的文本编辑器\n\n前端 Web 开发真正令人惊叹的特点之一是，你处理的始终都是基础文本文件。（在这里我忽略了图像、视频和字体等文件。）但你用\
  \ HTML 标签添加的所有结构难道不需要某种晦涩且复杂的类型类型吗？没门，José：从头到都是文本。那么与 CSS 相关的所有格式内容呢？不：除了文本外什么都没有。JavaScript？文本。\n\
  \n这种纯文本的格局意味着，你不需要任何高大上、昂贵的软件来开发 Web。你只需要一个谦逊的文本编辑器就能在 Web 编码的海洋里浅尝浅水。\n\n然而，说编码只需要文本编辑器，就像说生存只需要食物一样：这无疑是正确的，但显然缺乏细节。毕竟，在很大程度上，你的生活质量取决于你所食的食物。如果你只靠面包和水生存，那么你只是在“活着”而已。你真正需要的是一种能提供身体所需所有营养的均衡饮食。还有派。\n\
  \n文本编辑器的“面包加水版”就是电脑自带的精简版程序：如果你运行 Windows，就是记事本（Notepad）；如果你使用 Mac，则是 TextEdit。你可以使用这些程序作为\
  \ Web 开发者生存，但听我的，那不是生活。如果你想作为一名 Web 程序员蓬勃发展，你需要编辑领域等同于维生素和矿物质（是的，还有派）。这些营养是成为一个高效且有组织的开发人员至关重要的功能和工具：\n\
  \n*   **语法高亮：** `syntax` 指创建正确编程代码的字符和符号排列，而 `syntax highlighting`（语法高亮）是一种编辑功能，通过对某些语法元素进行上色以便阅读。例如，普通文本可能显示为黑色，而所有的\
  \ HTML 标签可能显示为蓝色，CSS 属性可能显示为红色。最好的文本编辑器让你选择语法颜色，可以通过提供预设主题或允许应用自定义颜色来实现。\n*   **行号：**\
  \ 这看起来是一件小事，但拥有一个能为每行编号的文本编辑器（如图 2-1 所示，该图显示了流行的文本编辑器 Visual Studio Code），可以节省大量时间。当浏览器向你发出代码中错误的警告时（参考第四本书第\
  \ 10 章），它会给你一个错误信息，至关重要的是还有错误的行号。这些信息使你能够快速定位罪祸首并（祈好运）尽快解决问题。![行号的截图，如窗口左侧所示，是文本编辑器的一个关键功能。](img/9781394164684-fg010201.png)\n\
  \n    ![行号的截图，如窗口左侧所示，是文本编辑器的一个关键功能。](img/9781394164684-fg010201.png)\n\n*   **代码预览：**\
  \ 好的编辑器可以让你预览代码在浏览器中的显示效果。预览可以在与代码相同的窗口中出现，并在修改和保存代码时更新。\n*   **代码补全：** 这是一个实用的功能，当你开始输入内容时，它会显示可能的代码项。然后你可以选择你需要的并按\
  \ Tab 键添加到代码中。\n*   **拼写检查：** 你总是希望展现最好的一面，这在某种程度上意味着发布不包含拼写错误或用词错误的页面。优秀的文本编辑器内置拼写检查器，会在发布前捕捉你的错误。\n\
  *   **文本处理：** 最好的编辑器提供一系列文本处理功能，如代码自动缩进、将制表符转换为空格及反之、移动代码块、删除行尾多余空格、隐藏代码块等。\n\n\
  好消息是，支持这些功能的文本编辑器并不稀缺。这也是坏消息，因为这意味着你有大量的程序可以选择。为了帮助你开始，这里按字母顺序排列了一些可以尝试的编辑器：\n\n\
  *   **Atom：** 适用于 Windows 和 Mac。免费！[`atom.io`](http://atom.io)\n*   **Brackets：**\
  \ 适用于 Windows 和 Mac。同样免费！[`brackets.io/`](http://brackets.io/)\n*   **Notepad++：**\
  \ 适用于 Windows。另一个免费软件。[`notepad-plus-plus.org/`](https://notepad-plus-plus.org/)\n\
  *   **Nova：** 适用于 Mac，售价 99，但提供免费试用。[`nova.app`](https://nova.app)\n*   **Sublime\
  \ Text：** 适用于 Windows 和 Mac。售价 99，但提供免费试用。[www.sublimetext.com](http://www.sublimetext.com)\n\
  *   **Visual Studio Code：** 适用于 Windows 和 Mac。为什么，是的，这个也是免费的。[`code.visualstudio.com/`](https://code.visualstudio.com/)\n\
  \n## 你还需要什么？\n\n虽然说只需要文本编辑器来编写网页代码是正确的，但在将“发布网页”从你的愿清单上勾掉之前，你可能还需要其他东西：\n\n\n\n\n\
  \n*   **照片编辑器：** 如果你计划在网页上包含自己的照片（请参阅第 2 本 第 3 章] 学习如何在 HTML 文件中引用图像），你可能需要一些照片编辑软件来执行基础的照片改进任务，如裁剪掉不需要的部分、增强颜色和添加特殊效果。你可能还需要添加注释、调整图像大小并将图像文件格式更改为\
  \ JPEG。Windows 和 macOS 自带的“照片”应用可以完成基础工作，但对于更专业的工作，你可能需要一个更高级的应用程序，例如 Adobe Photoshop（昂贵；[`https://www.adobe.com/products/photoshop.html`](https://www.adobe.com/products/photoshop.html))）或\
  \ GIMP（免费；[`https://www.gimp.org/`](https://www.gimp.org/)））。\n\n*   **设计软件：** 如果你想创建用于网页的自定义图像，你需要一个拥有能够实现你愿景所需工具的设计程序。你可以使用\
  \ Windows 画画程序来处理基础图像，但对于更具野心的工作，你可能需要一个功能齐全的应用，例如 Adobe Illustrator（昂贵；[`https://www.adobe.com/products/illustrator.html`](https://www.adobe.com/products/illustrator.html))）或\
  \ Inkscape（免费；[`https://inkscape.org/`](https://inkscape.org/)））。\n\n*   **FTP 客户端：**\
  \ 许多网络托管服务要求你将文件上传到服务器，这几乎意味着要使用 FTP（文件传输协议）程序。关于 FTP 和 FTP 客户端的更多信息，请参阅第 1 本 第\
  \ 3 章。\n\n## 使用 WebDev Workbench\n\n使用 HTML、CSS 和 JavaScript 构建网页的“编辑-保存-重新加载”工作流非常好用，但有时你只想尝试一个快速的实验或微调。这并没有问题。（相反，学习\
  \ HTML、CSS 和 JavaScript 的最佳方法是频繁进行实验，并对代码进行细微调整，以观察会发生什么。）然而，取决于实验或微调的大小，创建一个新的\
  \ HTML 文件、保存并将其加载到浏览器中可能显得大材小用。\n\n每当你只想快速尝试 Web 编码时，最好的方法通常是使用在线环境，它允许你输入标签、规则或脚本并立即获得结果。CodePen\
  \ ([`codepen.io/``](https://codepen.io/))）是一个流行的在线 Web 开发工具。不过，我是否也可以谦推荐一下我自己构建的交互式在线开发沙箱？它被称为\
  \ WebDev Workbench，你可以在这里找到：\n\n[`https://webdevworkshop.io/wb`](https://webdevworkshop.io/wb)\
  \ [`https://webdevworkshop.io/wb`](https://webdevworkshop.io/wb)\n\n如图 2-2 所示，WebDev\
  \ Workbench 由三个标签页组成：\n\n*   **HTML：** 使用此标签页输入文本和 HTML 标签。注意，“页面”基础设施——即 `<html>`\
  \ 和 `</html>` 标签、整个 head 部分以及 `<body>` 和 `</body>` 标签都在后台运行，因此你只需在 HTML 标签页中输入页面主体的内容。\n\
  \n*   **CSS：** 使用此标签页输入你的 CSS 规则。规则被添加到 `<style>` 和 `</style>` 标签内的“页面”头部中，这一切都是在无中完成的。\n\
  \n*   **JavaScript：** 使用此标签页输入你的 JavaScript 语句。语句被添加（在后台）到`<script>` 和 `</script>`\
  \ 标签内的“页面”头部中。\n\n![WebDev Workbench 截图是一个你可以玩的在线 Web 编码沙箱。](img/9781394164684-fg010202.png)\n\
  \n图 2-2： WebDev Workbench 是一个你可以玩的在线 Web 编码沙箱。\n\n当你准备好让你的作品投入运行时，点击 Run 按钮，WebDev\
  \ Workbench 会在底部框中渲染 HTML、CSS 和 JavaScript 结果（如图 2-2 所示）。\n\n如果你写了一些想要保留的代码，显示包含代码的标签页，然后点击\
  \ Copy 按钮将标签页的代码放置到计算机的剪贴板上。你可以将复制的代码粘贴到你的文本编辑器中。\n\n# 第 3 章\n\n# 寻找和设置 Web Host\n\
  \n本章内容\n\n*   ![Bullet](img/check.png) **理解网络托管提供商**\n*   ![Bullet](img/check.png)\
  \ **检查托管网站的各种选择**\n*   ![Bullet](img/check.png) **选择适合你的托管主机**\n*   ![Bullet](img/check.png)\
  \ **浏览你的新网络家**\n*   ![Bullet](img/check.png) **将你的网站文件传输到网络托管主机**\n\n*没有什么比一堆未发表的作品更令人作臭的。*\n\
  — 希尔维娅·普拉斯 (SYLVIA PLATH)\n\n你可以在 Mac 或 PC 上舒适地构建网页，如果你选择了良好的文本编辑器（正如我在第 1 本 第 2\
  \ 章 中描述的那样），你甚至可以使用电脑预览网页的外观。\n\n## 理解网络托管提供商\n\nWeb 开发新手提出的一个常见问题是：“我的网页做完后到底该放在哪儿？”如果你问了这个问题，说明你状态不错，因为你意识到了一个关键点：仅仅你创建了网页并连接了互联网，并不意味着你的网站就自动成为了互联网的一部分。\n\
  \n换句话说，互联网上的人没有办法访问你的计算机。可以执行这些事情的计算机被称为服务器，而专门分发网页的计算机被称为 Web 服务器。因此，只有当你将网页存储在远程\
  \ Web 服务器上，它才位于互联网上。因为这台计算机实际上在托管你的页面，所以此类机器也被称为 Web Host（托管主机）。运行这些托管主机的公司被称为托管提供商。现在，到底如何寻找托管主机呢？嗯，答案取决于许多因素，包括你网站的类型、你最初是如何连接互联网的，以及你愿意为此支付多少钱（如果有的话）。最后，你有三个选择：\n\
  \n*   你现有的互联网提供商\n*   免费托管提供商\n*   商业托管提供商\n\n如果你通过互联网服务提供商（ISP）访问互联网，可以电话或电子邮件给其客户服务部门，询问该公司是否提供可用的\
  \ Web 服务器。几乎所有的 ISP 都会提供空间，让客户可以免费发布个人页面。\n\n### 寻找免费托管提供商\n\n\n\n\n\n如果资金短缺，会有少数托管提供商出于好意，让你的网站“走出冷冬”（恢复运行）。在某些情况下，这些服务仅对特定群体开放，例如学生、艺术家、非营利组织等。然而，许多提供商免费提供个人网站托管。陷阱在哪里？嗯，几乎总是对你能够存储的数据量以及你可以存储的数据类型（不准广告、不准色情图片等）有限制。你还可能被要求在你的页面上为托管提供商显示某种“横幅”广告。或者，也有很多网站可以免费托管你的页面，且没有烦人的横幅广告。这里的陷阱在于，这些网站只托管“静态”文件，即不需要服务器处理数据的\
  \ HTML、CSS 和 JavaScript 文件。以下是一些值得尝试的全免费静态网站托管服务：\n\n* `Cloudflare Pages`: `https://pages.cloudflare.com/`\n\
  * `GitHub Pages`: `https://pages.github.com/`\n* `Netlify`: `https://www.netlify.com/`\n\
  \n### 向商业托管提供商注册\n\n对于个人和业务相关的网站，许多 Web 工人最终会从商业托管提供商那里租用 Web 服务器的一部分。你通常需要支付一笔设置费来启动账户，然后就要面对月费。既然有这么多免费网站触手可用，为什么要花那些钱呢？因为，就像生活中的大多数事情一样，一分钱一货。通过为你的托管商付费，你通常可以获得更多功能、更好的服务以及更少的困扰（例如某些免费网站显示的广告）。\n\
  \n## Web 托管购买指南\n\n遗憾的是，选择 Web 托管服务并不像你想象的那么简单。一方面，有成百上千主机在争夺你的业务；另一方面，普通 Web 托管商所采用的推销和诱惑充满了术语和技术词汇。我无法帮助你减少\
  \ Web 托管商的数量，但我可以帮你理解这些托管商在说什么。以下是你在研究 Web 托管时最可能遇到的术语列表：\n\n* `Storage space`（存储空间）：指的是在托管商\
  \ Web 服务器上分配给你的存储文件的空间大小。你获得的面积决定了你可以存储的数据量。例如，如果你获得 `1MB`（1 兆字节）的限制，那么你就无法在服务器上存储超过\
  \ `1MB` 大小的文件。HTML 文件不占什么空间，但大图形确实很占空间，所以你需要关注你的限制。例如，你可能可以在 `1MB` 的存储空间中存储大约 200\
  \ 个页面（假设每页约 `5KB`），但只能存储大约 20 张图片（假设每张图片约 `50KB`）。通常情况下，为主机付得越多，获得的存储空间就越多。\n\n\
  * `Bandwidth`（带宽）：衡量服务器传输的数据数据量。例如，假设你的页面 HTML 文件为 `1KB`（1 千字节），与页面相关的图形消耗了 `9KB`。如果有人访问你的页面，服务器将总共发送\
  \ `10KB`；如果有 10 个人访问页面（无论同时还是在一段时间内），总带宽就是 `100KB`。大多数主机会提供一个带宽限制（或“上限”），通常是每月若干兆字节或千字节。（1\
  \ 千字节等于约 1000 兆字节）。同样，你付得越多，获得的带宽就越大。\n\n![Warning](img/warning.png) 如果你超过了带宽限制，用户通常仍然可以访问你的页面（有些主机会关闭对违规站的访问）。然而，几乎所有的\
  \ Web 托管都会对超出带宽限制的行为收取额外费用，因此在注册前请检查这种可能性。通常的罚金是超出上限的每兆字节或每千字节收取固定费用。\n\n* `Domain\
  \ name`（域名）：通用的互联网地址，例如 `wiley.com` 或 `whitehouse.gov`。它们往往比大多数 Web 托管商默认为你提供的冗长地址更容易记忆，因此是一个很受欢迎的功能。有两种类型的域名可用：\n\
  \n    * 普通域名（例如 `yourdomain.com` 或 `yourdomain.org`）\n    * 子域名（例如 `yourdomain.webhostdomain.com`）\n\
  \n    要获得普通域名，你只需使用许多域名注册服务之一，如 GoDaddy (`https://www.godaddy.com/`) 或 Register.com\
  \ (`https://www.register.com/`)）。更方便的方法是选择一个会为你完成此工作的 Web 托管提供商。无论采取哪种方式，它通常每年会花费你\
  \ 35 美元（尽管有些主机提供廉价域名作为“引流产品”，并通过托管费收回成本；此外，像 GoDaddy 等折扣域名注册商提供的域名每年低至 9.99 美元）。如果你选择直接路径，几乎所有的\
  \ Web 托管都会托管你的域名，这意味着使用你域名的人将被重定向到托管 Web 服务器上的你的网站。要使此运行，你必须在域名注册商处调整域名设置。这通常涉及更改与域名关联域名系统\
  \ (`DNS`;该系统将域名转换为互联网上资源的实际地址）服务器，使其指向 Web 托管的域名服务器。你的 Web 托管会提供如何操作的说明。\n\n   \
  \ 对于子域名，`webhostdomain.com` 是 托管公司的域名，它在开头加上你想要的任何名称。许多主机会为你提供这种域名，通常是免费的。\n\n*\
  \ `Email addresses`（邮箱地址）：大多数主机在提供托管空间的同时都会提供一个或多个邮箱地址。付得越多，获得的信箱就越多。有些主机提供 `email\
  \ forwarding`（邮件转发），让你将发送到 Web 托管地址的邮件路由到其他邮箱地址。\n\n* `Shared server`（共享服务器）：如果主机提供\
  \ `共享服务器`（或`虚拟服务器`），这意味着你将与几十甚至上百个网站共享该服务器。Web 主机负责所有高技术性的服务器管理工作，你只需要维护自己的网站。这对于个人或小型业务类型来说，是商业选项中最好（也是最便宜）的选择。\n\
  \n* `Dedicated server`（独立服务器）：你拥有自己的自己的服务器计算机。这听起来可能是件好事，但通常由你来管理服务器，这可能是一项令人生畏的技术任务。此外，独立服务器比共享服务器贵得多。\n\
  \n* `Operating system`（操作系统）：Web 服务器上的操作系统。你通常有两个选择：`Unix`（或 `Linux`）和 `Windows\
  \ Server`。Unix 系统以可靠和快速著称，即使在高流量负载下也是如此，因此通常是共享服务器的最佳选择。Windows 系统更适合独立服务器，因为更容易管理。同样注意，Unix\
  \ 服务器在文件名和目录上区分大小写；而 Windows 则不。\n\n* `Databases`（数据库）：你的账户可以创建的数据库数量。Unix 系统通常提供\
  \ `MySQL` 数据库，而 Windows 服务器提供 `SQL Server` 数据库。\n\n* `Administration interface`（管理界面）：这是用于执行服务器任务的托管应用，例如上传文件或创建用户。许多主机提供优秀的\
  \ `cPanel` 界面，大多数基于 Unix 的系统都提供 `phpMyAdmin` 应用来管理你的 `MySQL` 数据。\n\n\n\n\n\n-  \
  \ **广告需求：** 少数免费网站托管服务商要求你在页面上显示某种类型的广告。这可能是页面顶部的横幅广告、用户每次访问你的页面时出现的“弹出式”广告，或者是“水印”广告（通常是悬浮在页面上的半透明标志）。幸运的是，如今坚持要投放广告的免费托管商已经不多见了。\n\
  -   **可用性（Uptime）：** 托管服务器运行并提供服务的时间百分比。并不存在 100% 的可用性说法，因为所有服务器在某些时候都需要维护和升级。然而，最好的托管商可用性数字超过\
  \ 99%。（如果一个托管商没有宣传其可用性，可能因为它非常低。在决定之前务必问清楚。）\n-   **技术支持：** 如果你在设置或访问网站时遇到问题，你希望帮助——以\
  \ `tech support` 的形式——触手可及。最好的托管商提供 24/7 技术支持，这意味着你可以通过电话、聊天或电子邮件每天 24 小时、每周 7 天联系公司。\n\
  -   **FTP 支持：** 你使用互联网的 `FTP` 服务将文件从计算机传输到 Web 主机。如果托管商提供 `FTP access`（某些托管商有自己的文件传输方法），请确保你可以在任何时候使用它，并且对单次传输的数据量没有限制。\n\
  -   **网站统计：** 告诉你许多信息，例如有多少人访问了你的网站、哪些页面最受欢迎、你的页面消耗了多少带宽、访问者使用什么浏览器和浏览器版本等。大多数良好的托管商都提供现成的统计包，但最好的托管商还会让你获得“原始”日志文件的访问权限，以便你可以自己处理数据。\n\
  -   **电子商务：** 一些托管商提供一种服务，让你建立一个网络“商店”，以便在你的网站上销售商品。该服务通常包括“购物脚本”、访问信用卡授权和其他支付系统的权限，以及建立安全连接的能力。你通常只有在昂贵的托管方案中获得这种功能，而且你通常需要支付设置费用来构建你的商店。\n\
  -   **可扩展性：** 托管商可以根据需要修改你网站的功能。例如，如果你的网站变得非常受欢迎，你可能需要增加带宽限制。如果托管商具有可扩展性，它可以轻松更改你的限制（或你网站的任何其他功能）。\n\
  \n## 寻找网站主机\n\n好了，你准备好开始研究各种托管商，以找到一个适合你网站风格的。正如我之前提到的，有数百个甚至数千个托管商，那么该如何将它们筛选成一份短名单呢？这里是一些建议：\n\
  \n-   **询问你的朋友和同事。** 寻找良好托管商的最佳方法是那个老掉牙的办法：口碑。如果你信任的人说某个托管商很好，那么你可能不会失望。这前提是你和朋友有类似的托管需求。如果你想建立一个功能完备的电子商务网站，不要向那些只有一个简陋主页的人征求推荐。\n\
  -   **向专家索取托管商评论。** 询问现有的网站管理员和其他“圈内人士”他们推荐哪些托管商，或者听过哪些托管商的好评。寻找此类专家的好地方是 Web Hosting\
  \ Talk ([[www.webhostingtalk.com](http://www.webhostingtalk.com)])，这是一个与网站托管相关的论坛集合。\n\
  -   **联系网站托管的客户。** 访问使用特定网站托管服务的网站，并向网站管理员发送电子邮件，询问他们对该托管商服务的看法。\n-   **查阅网站托管商列表。**\
  \ 许多网站跟踪并比较网站托管商，因此是获取大量研究信息的简单方法。不过要小心，因为那里有很多不可靠的列表，它们只想通过让你点击广告来赚钱。以下是一些信誉较好的起点：\n\
  \    -   **CNET 网站托管解决方案：** `www.cnet.com/web-hosting`\n    -   **PC Magazine 网站托管服务评论：**\
  \ `www.pcmag.com/reviews/web-hosting-services`\n    -   **Review Hell：** `www.reviewhell.com`\n\
  \    -   **Review Signal 网站托管评论：** [`reviewsignal.com/webhosting`](http://reviewsignal.com/webhosting)\n\
  \n## 在你的新家园穿梭\n\n当你注册网站托管提供商并建立账户后，网站管理员会为你创建两个东西：一个你可以在服务器上用来存储网站文件的目录，以及一个完全属于你自己的网址。（如果你使用与公司或学校网络关联\
  \ Web 服务器，情况也是如此。）该目录在行业内被称为你的 `root directory`（根目录），通常采取以下形式之一：\n\n`/yourname/`\n\
  \n`/home/yourname/`\n\n`/yourname/public_html/`\n\n在每情况下，`yourname` 是提供商分配给你的登录名（或用户名），也可能是你的域名（带有或不带\
  \ .com 部分）。记住，你的根目录是主机 Web 服务器的一个切片，这个切片由你随心所欲地摆弄。这通常意味着你可以对根目录执行所有或大部分操作：\n-  \
  \ 向目录中添加文件。\n-   向目录中添加子目录。\n-   将文件从一个目录移动或复制到另一个目录。\n-   重命名文件或目录。\n-   从目录中删除文件。\n\
  \n你的网址通常呈以下形状之一：\n\n`https://provider/yourname/`\n\n`https://yourname.provider/`\n\
  \n`https://yourname.com/`\n\n在这里，`provider` 是提供商的主机名，`yourname` 是你的域名。以下是一些例子：\n\
  \n`https://www.hostcompany.com/mywebsite/`\n\n`https://mywebsite.com/.\n\n`.com/`\n\
  \n### 你的目录与网址\n\n你的网址和服务器目录之间存在着直接且重要的关系。也就是说，你的网址实际上“指向”你的目录，让其他人能够查看存储在该目录中的文件。例如，假设我在目录中存储了一个名为\
  \ `thingamig.html` 的文件，我的主网址是 [`mywebsite.hostcompany.com/`](http://mywebsite.hostcompany.com/)。这意味着其他人可以在浏览器中输入以下\
  \ URL 查看该页面：\n\n```\nhttps://mywebsite.hostcompany.com/thingamig.html\n```\n\n同样，假设我创建一个名为\
  \ `stuff` 的子目录并用它存储一个名为 `index.html` 的文件。访问者可以通过浏览器前往以下 URL 来查看该文件：\n\n```\nhttps://mywebsite.hostcompany.com/stuff/index.html\n\
  ```\n\n换句话说，人们可以通过在网址后面加上相应的文件名和目录名来访问你的文件和目录。\n\n\n\n\n\n![Tip](img/tip.png) 为了避免混淆，请考虑将你的本地根文件夹重命名为与\
  \ Web 主机根目录相同的名称。例如，如果你的 Web 主机分配了一个名为 `public_html` 的根目录，那么将你的本地根文件夹重命名为 `public_html`\
  \ 是一个好主意。为了帮助你理解镜像本地和远程目录结构为何如此有用，假设你在本地根文件夹中设置了一个名为 `graphics` 的子文件夹，用于存储图像文件。要在页面中插入该文件夹中名为\
  \ `mydog.jpg` 的文件，你将使用以下引用（参阅第 2 卷第 3 章）：\n\n```\ngraphics/mydog.jpg\n```\n\n当你将\
  \ HTML 文件发送到服务器并在浏览器中显示该文件时，它会在 `graphics` 子目录中查找 `mydog.jpg`。如果你没有这样的子目录——要么是你没有创建它，要么是你使用了不同的名称（例如\
  \ `images`）——浏览器将找不到 `mydog.jpg`，你的图片也将无法显示。换句话说，如果你让 Web 服务器上的根子目录与电脑上的根子文件夹保持一致，你的页面在本地和网页上无需任何修改即可正常运行。\n\
  \n![Warning](img/warning.png) 网页开发者初学者犯的一个常见错误是在引用文件时包含了本地驱动器和所有文件夹名称。这里有一个示例：\n\
  \n```\nC:\\users\\paul\\documents\\public_html\\graphics\\mydog.jpg\n```\n\n这张图片在你的电脑上查看时会正常显示，但当你将其上传到服务器并在网页上查看时，它会彻底失败。这是因为\
  \ `C:\\users\\paul\\documents\\` 部分仅存在于你的电脑上。\n\n![Warning](img/warning.png) 绝大多数\
  \ Web 服务器使用的 Unix（或 Linux）计算机在处理文件和目录名称中使用的大小写字母时非常挑剔。检查代码中的文件引用至关重要，以确保你使用的文件和目录名称与服务器上使用的字母大小写组合完全匹配。例如，假设你的服务器上有一个名为\
  \ `styles.css` 的 CSS 文件。如果你的 HTML 以 `STYLES.CSS` 等名称引用该文件，服务器将找不到该文件，你的样式也无法被应用。\n\
  \n### 上传你的网站文件\n\n当你的网页或网站准备好上线时，是时候将文件发送到主机的 Web 服务器了。如果服务器位于你的公司或学校网络上，你通过网络将文件发送到系统管理员设置的目录。否则，你将文件上传到托管提供商\
  \ Web 服务器上为你创建的根目录。你如何上传网站文件取决于 Web 主机，但这里有四种常见的场景：\n\n*   **使用 FTP 程序。** 很少有 Web\
  \ 主机不支持对文件传输协议（简称 `FTP`）的支持，这是互联网上从这里传输文件到那里最流行的方法。要使用 FTP，你通常需要获取名为 `FTP client`\
  \ 的软件，它允许你连接到 Web 主机的 FTP 服务器（你的主机主机可以为你提供相关说明），并为标准文件任务提供界面，例如导航和创建文件夹、上传文件、删除和重命名文件等。适用于\
  \ Windows 和 macOS 版本的流行（且免费！）FTP 应用程序包括 [Cyberduck](https://cyberduck.io) 和/或 [FileZilla](https://filezilla-project.org)](https://filezilla-project.org)。\n\
  \n*   **使用文本编辑器的文件上传功能。** 某些文本编辑器内置了 FTP 客户端，因此你可以编辑文件并立即通过单个命令将其上传。Nova 文本编辑器（[`nova.app`](https://nova.app）；仅限\
  \ macOS）也支持这种非常方便的功能。\n\n*   **使用 cPanel 的文件管理器功能。** 我之前提到过，许多 Web 主机提供名为 `cPanel`\
  \ 的管理工具，它为电子邮件和域名管理等托管任务提供了界面。cPanel 还提供了 `File Manager` 功能，你可以用它上传文件并执行其他文件管理工作。\n\
  \n*   **使用 Web 主机的专用上传工具。** 出于某种原因，少数 Web 主机仅提供自己的专用界面来上传和处理文件及目录。请查看你主机的帮助或支持页面获取说明。\n\
  \n### 修改你的网页文件\n\n如果你将一个网页开发文件发送到 Web 主机，然后发现自己写错了字或发现了一个编码错误，会怎样？或者如果你有更多信息要添加到其中一个网页中？该如何修改已经发送的文件？嗯，简单的答案是：你不需要这样做。没错，在你发送文件之后，你再也不需要操心它们了。但这并不意味着你永远无法更新网站。相反，你对电脑上的文件进行修改，然后将这些修订后的文件发送到你的\
  \ Web 主机。这些文件将替换旧文件，你的网站就此更新了。\n\n![Warning](img/warning.png) 确保你将更新后的文件发送到服务器上的正确目录。否则，你可能会疑惑为什么在浏览器中刷新页面时你的更改没有出现（而且还有你可能覆盖了其他目录中某个同名的文件）。\n\
  \n\n\n\n\n新手 Web 开发者会犯的最大错误之一就是使用单一网页浏览器来检查页面的进度。最常见的情况是开发者使用运行在 Windows 上的 `Google\
  \ Chrome` 作为唯一的测试浏览器。当然，页面在 `Chrome` 上看起来可能很完美，但当那些在 Mac 上使用 `Firefox` 或在 iPad 上使用\
  \ `Safari` 的用户遇到页面问题时，开发者就会大吃震惊了！\n\n然，`Chrome` 是目前最流行的网页浏览器，但作为 Web 开发者，令人苦恼的事之一就是并不是所有人都使用\
  \ `Chrome`，也不是每个人都使用桌面式电脑上网。\n\n### 查看浏览器市场份额\n\n为了证明并不是每个人都使用 `Chrome` 浏览器或桌面电脑，表\
  \ 4-1 列出了整体市场前四名的浏览器市场份额值，并按照桌面端、平板和平智能手机进行了分类。\n\n| **市场** | **第一** | **第二** |\
  \ **第三** | **第四** |\n| --- | --- | --- | --- | --- |\n| 整体 | Chrome (64.5%) | Safari\
  \ (18.8%) | Edge (4.1%) | Firefox (3.4%) |\n| 桌面 | Chrome (65.8%) | Edge (11.1%)\
  \ | Safari (10.9%) | Firefox (6.5%) |\n| 平板 | Chrome (49.3%) | Safari (35.2%) |\
  \ Android (13.3%) | Opera (0.7%) |\n| 智能手机 | Chrome (64.6%) | Safari (25.1%) | Samsung\
  \ Internet (4.5%) | Opera (1.8%) |\n\n来源：StatCounter ([`gs.statcounter.com/browser-market-share``](https://gs.statcounter.com/browser-market-share))\n\
  \n表 4-1 浏览器市场份额（2023 年 3 月）\n\n这些数字证实了 `Chrome` 的流行，但它们也表明 `Chrome` *并没有*主导网页浏览器市场。是的，拥有约二之二（整体、桌面和智能手机）的市场份额令人印象深刻，但如果你只为\
  \ `Chrome` 编写代码，那么对于整整三分之一的页面访问者（以及超过一半的平板访问者）来说你是盲目的。\n\n### 你的跨浏览器测试套件\n\n为了确保大多数访问你网站的人获得良好的体验，你需要扩展你的浏览器测试。一个最小的测试套件应包含：\n\
  \n*   Windows：`Chrome`、`Safari`、`Edge` 和 `Firefox`\n*   Mac：`Chrome`、`Safari` 和\
  \ `Firefox`\n*   iPadOS：`Chrome` 和 `Safari`\n*   Android 平板：`Chrome`\n*   iOS：`Chrome`\
  \ 和 `Safari`\n*   Android 智能手机：`Chrome`\n\n![Remember](img/remember.png) 几乎所有的 Android\
  \ 浏览器都是使用 `Chromium` 构建的，它是 `Google Chrome` 的开源版本。这意味着所有浏览器将像 `Chrome` 一样加载和渲染网页，所以仅使用\
  \ `Chrome` 作为 Android 测试浏览器也是没问题的。\n\n### 在线跨浏览器测试\n\n好了，我听到了你们对上一节中提出的测试套件的*非常*强烈的反对：并不是每个人都有\
  \ Windows PC 和 Mac！并不是每个人都拥有苹果和 Android 平板以及智能手机！老天，并不是每个人都同时拥有平板和平智能手机！\n\n这些反对都是合理的。那么，如果你真的想进行广泛的跨浏览器测试，但又无法接触各种浏览器、操作系统和设备，你该怎么办？\n\
  \n不要害怕：在线跨浏览器测试来了！有很多在线网站可以获取页面 URL 并在许多不同的（虚拟）浏览器上进行测试，然后向你显示结果。这些网站大部分在大量使用时需要付费订阅，但每月提供有限次数的免费测试。以下是最流行的在线跨浏览器测试网站：\n\
  \n*   BrowserStack：[`www.browserstack.com/screenshots`](http://www.browserstack.com/screenshots)\n\
  *   Comparium：[`https://comparium.app/`](https://comparium.app/)\n*   LambdaTest：[`www.lamdatest.com`](http://www.lamdatest.com)\n\
  *   Sauce Labs：[`https://saucelabs.com`](https://saucelabs.com)\n\n## 理解验证（Validation）\n\
  \n*验证*是一个检查你的代码是否存在错误和非标准语法的自动化过程。拥有有效的 `HTML`、`CSS` 和 `JavaScript` 代码不能保证网页完美无缺，但它确实确保了所有现代浏览器都能正确解析并解释你的代码。如果你的代码是有效的，但页面仍然很奇怪，你就知道问题出在其他地方（例如你的页面整体设计）。\n\
  \n那么，我所谓的“有效”网页代码是指什么？这取决于语言：\n\n*   HTML：Web 超文本应用技术工作组（幸运的是，几乎总是缩写为更合理的 `WHATWG`）维护所谓的\
  \ `HTML` “活标准（Living Standard）”，有些人也将其称为 `HTML5`。“活的”部分意味着该标准在不断演进，因此没有大型的新版本发布，也没有子版本（如\
  \ 5.1 或 5.2.129）。当你验证 `HTML` 时，你是在将你的标签、属性和其他 `HTML` 内容与活标准中概述的规范进行比较（可以在此处找到：[`https://html.spec.whatwg.org/`](https://html.spec.whatwg.org/)）。\n\
  *   CSS：万维网联盟（`W3C`）维护大量的 `CSS` 。这些方面被称为“模块”，涵盖了颜色、字体、选择器和盒模型等 `CSS` 内容。目前的发布版本是\
  \ `CSS 3`。当你验证 `CSS` 时，你是在将你的属性、声明和其他 `CSS` 内容与 `W3C` 概述的规范进行比较（[`https://www.w3.org/TR/css`](https://www.w3.org/TR/css)）。\n\
  *   JavaScript：非营利组织 `Ecma` 维护一套不断演进的 `JavaScript` 标准，所有标准属于 `ECMAScript`。每个版本都有版本号和发布年份。例如，第\
  \ 6 版于 2015 年发布，因此也称为 `ECMAScript 2015`（尽管这个重要的版本也被称为 JavaScript 6 或 `JS 6`）。验证\
  \ `JavaScript` 意味着运行检查器（linter），它不仅会根据指定的 `ECMAScript` 版本查找错误，还会检查你的代码是否存在某些风格问题（例如不正确的缩进）。\n\
  \n\n\n\n\n与语法一样，关于验证（validation）也有两种观点：\n\n*   **验证并不重要：** 只要你的网页能够正常渲染，就没有必要对代码进行验证。\n\
  *   **验证至关重要：** 即使你的网页看起来渲染正常，包含无效的 HTML 或 CSS 代码也意味着你的整体结构更加脆弱；读取你代码的程序（包括搜索引擎爬虫和屏幕阅读器等辅助技术）在解析代码时可能会遇到困难；你可能会为某些访问者提供糟糕的用户体验。\n\
  \n因此，我认为我的立场很明确了：你的写作应该是符合语法的，你的网页应该使用经过验证的 HTML 和 CSS。好消息是，虽然编写语法完全完美的句子可能很难，但发布完全有效的\
  \ HTML 和 CSS 代码一点也不难，因为在接下来的几章节中你会了解到，有大量的免费工具可以提供帮助。\n\n## 验证你的 HTML 代码\n\nHTML\
  \ 为你的网页创建结构，因此如果你的标签错乱或属性歪斜，你的页面很可能会遭受影响。幸运的是，保持 HTML 代码井井有然比你想象的要容易，因为你可以在线上验证代码，也可以在任何支持\
  \ HTML 文件的功能足够强大的文本编辑器中直接验证。\n\n### 在线验证 HTML\n\nW3C 运行着一个名为标记验证服务（查看图 4-4）的在线应用程序，它可以通过将代码与当前的\
  \ HTML 规范对比来检查 HTML 代码的错误。最重要的是，这项服务完全免费！\n\n![W3C 标记验证服务的截图让你可以通过地址、文件上传或代码输入来验证页面](img/9781394164684-fg010404.png)\n\
  \n图 4-4： W3C 标记验证服务让你通过地址、文件上传或代码输入来验证页面。\n\nW3C 标记验证服务提供了三种验证 HTML 代码的：\n\n*  \
  \ **通过地址：** 如果你已将页面发布到网上，请输入或粘贴页面地址。\n*   **通过文件上传：** 将你的 HTML 文件上传到该服务。\n*   **通过代码输入：**\
  \ 输入或粘贴你的 HTML 代码。\n\n以下是其工作原理：\n\n1.  **用你喜欢的浏览器访问 [`validator.w3.org`](https://validator.w3.org)。**\n\
  \    出现标记验证服务界面。\n2.  **告诉验证器你想要如何检查 HTML：**\n    *   **通过地址：** 确保选中了“Validate By\
  \ URI”选项卡（默认选中），然后使用 Address 文本框输入或粘贴要验证的页面地址。\n        ![技术细节](img/technicalstuff.png)\
  \ URI 是 Uniform Resource Identifier（统一资源标识符）的缩写，指的是用于识别网络上某些资源的任何字符集。URL（统一资源定位符，即网页地址）就是\
  \ URI 的示例。\n    *   **通过文件上传：** 点击“Validate By File Upload”选项卡，点击“Choose File”，使用打开对话框选择要验证的\
  \ HTML 文件，然后点击“Open”。\n    *   **通过代码输入：** 点击“Validate By Direct Input”选项卡；然后使用大文本框输入或粘贴要验证的\
  \ HTML 代码。\n3.  **点击 Check。**\n    标记验证服务会深入检查你的 HTML 代码并显示结果。如果你完美地处理了 HTML 中的每一个\
  \ `i` 和 `t`，你就会看到 `No errors or warnings to show` 的消息，如图 4-5 所示。相反，如果你的代码有问题，你会收到一条或多条错误消息，如图\
  \ 4-6 所示。（在此示例中，验证器正在抱怨页面的 `head` 部分不包含 `title` 元素。）![截图显示如果你的 HTML 检查通过，会出现此页面](img/9781394164684-fg010405.png)\n\
  \n图 4-5： 如果你的 HTML 检查通过，会出现此页面。\n\n#### 在你的编辑器中验证 HTML\n\n我在第一本书第 2 章中列了一份顶级文本编辑器。大多数应用程序都支持额外功能——被称为*插件*（add-ins）或*扩展*（extensions）——它们允许你安装应用程序默认不支持的功能。其中一项功能就是\
  \ HTML 验证，它可以实时检查你的 HTML 代码并在你走错时立即通知你。\n\n![截图显示如果你的 HTML 不符合规范，你会收到一条或多条错误消息](img/9781394164684-fg010406.png)\n\
  \n图 4-6： 如果你的 HTML 不符合规范，你会收到一条或多条错误消息。\n\n参考你编辑器的帮助文档了解如何安装 HTML 验证。由于 Visual Studio\
  \ Code 是目前流行的 HTML 编辑器，以下是安装 HTML 验证的步骤：\n\n1.  **启动 Visual Studio Code。**\n2. \
  \ **在扩展视图中搜索 HTMLHint。**\n3.  **点击安装。**\n4.  **打开 HTML 文件。**\n5.  **检查波浪线。**\n\n\
  \n\n\n1. **使用最近的 浏览器，导航至 `https://jigsaw.w3.org/css-validator/`。**\n\n   出现标记验证服务（Markup\
  \ Validation Service）。\n\n2. **告诉验证器你想要如何检查 CSS：**\n\n   * **通过地址：** 点击 `By URI`\
  \ 标签页，然后使用 `Address` 文本框输入或粘贴想要验证的 HTML 文件地址（如果你的 CSS 位于那里）或 CSS 文件地址。\n   * **通过文件上传：**\
  \ 点击 `By File Upload` 标签页，点击 `Choose File`，使用 `Open` 对话框选择想要验证的 HTML 文件（如果你的 CSS\
  \ 位于那里）或 CSS 文件，然后点击 `Open`。\n   * **通过代码输入：** 点击 `By Direct Input` 标签页，然后使用文本框输入或粘贴想要验证的\
  \ CSS 代码。\n\n3. **点击 Check（检查）。**\n\n   CSS 验证服务会将你的 CSS 与官方规范进行比较并显示结果。如果你的 CSS\
  \ 棒极，你会看到欢快的提示 `Congratulations! No error found`（恭喜！未发现错误），如图 4-10\n\nFIGURE 4-10:\
  \ 如果你的 CSS 代码通过所有检查，将显示此页面。\n\n![如果你的 CSS 代码尚未准备好，将显示一条或多个错误消息的截图。](img/9781394164684-fg010411.png)\n\
  \nFIGURE 4-11: 如果你的 CSS 代码尚未准备好，你将收到一条或多个错误消息。\n\n#### 在文本编辑器中验证 CSS\n\n大多数支持 CSS\
  \ 的良好文本编辑器（例如我在第一书中提到的，第 2 章）都可以验证你的 CSS 代码，可以是开箱即用，也可以通过安装插件或扩展。请参考编辑器的帮助文档了解如何添加或使用\
  \ CSS 验证。\n\n一个默认支持 CSS 验证的编辑器是 VS Code，它会在发现的任何 CSS 错误下方显示波浪线。要了解这到底是怎么回事，可以将鼠标指针悬停在波浪线上，或者选择\
  \ `View Problems`（`Ctrl+Shift+M` 或 `⌘+Shift+M`）来打开问题（Problems）面板，如图 4-12\n\nFIGURE\
  \ 4-12: 当一条或多条波浪线破坏你的 CSS 代码时，打开 VS Code 的问题面板以了解原因。\n\n## 验证你的 JavaScript 代码\n\n\
  你将 JavaScript 代码添加到网页中以使页面具有动态和交互性。相反，如果页面只是停留在那里，可能意味着你遇到了某种 JavaScript 故障，阻止了脚本运行。追踪编程错误的艺术和科学被称为*调试*（debugging），我在书的后部分专门用了一整章介绍了它（查看第四本第\
  \ 10 章）。不过现在你可以通过验证代码来减少整体调试负担。正如接下来的两个部分所示，你可以在线或使用可靠的文本编辑器来验证 JavaScript。\n\n\
  ### 在线验证 JavaScript\n\n有很多免费的在线工具正等待验证你的 JavaScript 代码。最简单、最流行的之一是 JSHint，它可以直接验证输入或粘贴的代码。其工作原理如下：\n\
  \n1. **使用任何方便的浏览器访问 `https://jshint.com`。**\n\n   出现 JS Hint 页面。\n\n2. **点击 Configure（配置）。**\n\
  \n   JSHint 显示了你可以配置的选项列表。为了本书中的代码，你需要配置 JSHint 以支持第 6 版发布的 JavaScript 特性（ECMAScript\
  \ 2015 或 ES6）。\n\n3. **选择 New JavaScript Features (ES6)（新 JavaScript 特性）选项。**\n\n\
  4. **点击 Configure（配置）。**\n\n   JSHint 关闭了选项列表。\n\n5. **在窗口左侧输入或粘贴想要验证的 JavaScript\
  \ 代码。**\n\n   JSHint 会扫描并分析你的代码，如果它发现了一个或多个无法理解的内容，会在代码右侧显示错误消息，如图 4-13\n\nFIGURE\
  \ 4-13: 你的 JavaScript 代码有缺陷，JSHint 显示了一条或多个错误消息。\n\n\n\n\n# 第 1 章：构建良好的基础：页面结构\n\
  \n## 目录\n1. 为什么要让你的页面无障碍访问\n2. 理解网页无障碍访问\n3. 让你的页面结构无障碍访问\n4. 让文本无障碍访问\n5. 让媒体无障碍访问\n\
  6. 增强你的页面无障碍语义\n7. 让你的页面键盘友好\n8. 确保足够的色彩对比度\n9. 验证页面的无性\n\n## 本章内容\n- ![Bullet](img/check.png)\
  \ **将你的文本整理成段落**\n- ![Bullet](img/check.png) **使用标题组织你的页面**\n- ![Bullet](img/check.png)\
  \ **添加换行符和水平规则**\n- ![Bullet](img/check.png) **熟悉 HTML 中至关重要的语义页面标签**\n- ![Bullet](img/check.png)\
  \ **用注释标记你的代码**\n\n*让我们共同渴望、构想并创造未来的新结构。*\n— 沃尔特·格罗皮斯 (WALTER GROPIUS)\n\n如果你曾经买过房——特别是如果你的预算更倾向于要价中的廉价端——你的房地产中介很可能向你展示过几个房子，这些房子显然需要一些装修，但仍然值得考虑，因为它们拥有“良好的基础”。在中介术语中，*良好的基础*意味着房子（除其他属性外）拥有坚实的地基、结构良好的框架和不错的屋顶。换句话说，这个房子有一个强大的整体结构。\n\
  \n在构建网页“家园”时，你也希望你的页面拥有良好的基础。创建这种稳固的结构是 `HTML` 的职责，特别是那些将纯文本转换为页面结构元素的元素。\n\n在本章中，你将探索那些为任何页面添加最基础结构的\
  \ `HTML` 标签，包括标题和段落、文章和章节，以及页和页脚。你还将学习其他一些用于创建换行符和水平规则的结构相关元素。你在本章中学到的知识将成为你所承担每一个网页项目的基础。\n\
  \n## 了解 HTML 的基础结构标签\n\n在开始学习 `HTML` 时，你需要理解的最概念之一是：无论你挤进 `<body>` 和 `</body>` 标签之间的文本是什么，都没有固有的结构。为了向你说明我的意思，我复制了本节的前几个标题和段落，并将它们粘贴到\
  \ `HTML` 文件中。图 1-1 显示了当我在网页浏览器中打开该 `HTML` 文件时发生的情况（请查看书中示例文件中的 `bk02ch01/example01.html`）。\n\
  \n![HTML 文档中的纯文本没有结构的截图](img/9781394164684-fg020101.png)\n\n图 1-1： HTML 文档中的纯文本没有结构。\n\
  \n生成的网页一点也不美观，而且非常难以阅读。为什么？因为与你现在正在看到的结构良好——因此极易阅读——的文本不同，当我将文本粘贴到 `HTML` 文件时，所有的结构都被抛之窗外了。记住，`HTML`\
  \ 文件实际上只是纯文本文件，因此我原始 Microsoft Word 文档中的所有花哨格式和样式都被丢弃了。\n\n幸运的是，格式的缺失*并不*意味着你不能构建结构良好的网页文档。让你的网页看起来像你正在阅读的页面一样精美的秘密在于\
  \ `HTML` 强大的结构元素集合。使用这些元素，你可以创建段落和标题等标准结构，以及像页眉、文章和页脚等较大的页面项目。\n\n### 创建段落\n\n本章的主题之一是探索各种方法，避免向网页访问者呈现大片大部分无区别的文本，就像之前图\
  \ 1-1 所示的那样。为什么？因为这种文本看起来令人厌恶且难以阅读。\n\n几乎所有的 `HTML` 都考虑了这个主题，并且在最广泛的解释中，几乎每个 `HTML`\
  \ 元素的设计都是以某种方式在结构上区分文本。\n\n最简单且常见的例子是使用 `p` 元素，它将任何被 `<p>` 开始标签和 `</p>` 标签包围的文本转换为段落：\n\
  \n```html\n<p>\n现在这是一个段落。\n</p>\n```\n\n说网页中的一段文本是段落是什么意思？在最基础的层，它仅仅意味着文本在渲染时上下留有一些空间。为了演示，我向之前图\
  \ 1-1 所示的纯文本添加了 `p` 元素。结果（参见 `bk02ch01/example02.html`）如图 1-2 所示，即文本现在分成了段落，这已经是巨大的改进。\n\
  \n![来自图 1-1 的文本截图](img/9781394164684-fg0102.png) 图 1-2： 文本现在分成了段落，这已经是巨大的改进。\n\n\
  现在 body 部分看起来如下：\n\n```html\n<p>\n在开始学习 `HTML` 时，你需要理解的最概念之一是：无论你挤进 <body> 和 </body>\
  \ 标签之间的文本是什么，都没有固有的结构。为了向向你说明我的意思，我复制了本节的前几个标题和段落，并将它们粘贴到 `HTML` 文件中。图 1-1` 显示了当我在网页浏览器中打开该\
  \ `HTML` 文件时发生的情况。\n</p>\n<p>\n生成的网页一点也不美观，而且非常难以阅读。为什么？因为与你现在正在看到的结构良好——因此极易阅读——的文本不同，当我将文本粘贴到\
  \ `HTML` 文件时，所有的结构都被抛之窗外了。记住，`HTML` 文件实际上只是纯文本文件，因此我原始 Microsoft Word 文档中的所有花哨格式和样式都被丢弃了。\n\
  </p>\n```\n\n![记住](img/remember.png) 第一段中的 `<` 和 `>` 是怎么的？这些是 HTML 实体名称，你用它们在 HTML\
  \ 代码中插入特殊字符。在这种情况下，`<` 插入小于符号（`<`），而 `>` 插入大于符号（`>`）。我需要包含这些，否则浏览器会将 `<body>` 和\
  \ `</body>` 读取为标签而不是文本并尝试对其进行解释，这会导致各种问题。有关实体名称的更多信息，请查看卷 2，第 2 章。\n\n![技术细节](img/technicalstuff.png)\
  \ 如果段落文本紧随另一个 `<p>` 标签或以下标签之一，你可以省略 `</p>` 结束标签：`<address>``<article>``<aside>``<blockquote>``<details>``<<div>``<dl>``<fieldset>``<figcaption>``<figure>``<<footer>>``<form>``<h1>``<h2>``<h3>``<h4>``<h5>``<h6>``<header>``<hgroup>``<hr>``<main>``<menu>``<nav>``<ol>``<pre>``<section>`<table>`\
  \ 或 `<ul>`。（你将在书中其他地方学习这些标签的大部分。）如果你的段落是父元素（即包含段落的元素）中的最后一个项目，你也可以跳过 `</p>` 标签。\n\
  \n### 使用标题划分文本\n\n\n\n\n\n在第一本书的第 1 章中，我提到可以使用名副其实的 `<title>` 标签为你的网页设置标题。然而，该标题只会出现在浏览器的标签页上。如果你想在页面正文中添加一个标题呢？这几乎比说起来做起来容易，因为\
  \ HTML 提供了几个标签，让你能够定义 `headings`（标题），它们是出现在独立段落中的文本，通常会通过字体变大、加粗等方式与周围文本区分开来。\n\n\
  总共有六个标题标签，从使用最大字号的 `<h1>` 到使用最小字号的 `<h6>`。这些起始标签每一个都有对应的结束标签，从 `</h1>` 到 `</h6>`。\n\
  \n这里是一些网页代码（查看 `bk02ch01/example03.html`），展示了这六个标题标签，而图 1-3 显示了它们在网页浏览器中的外观：\n\n\
  ```\n<h1><h1>1 is Heading 1</h1>\n<h2>This is Heading 2</h2>\n<h3>This is Heading\
  \ 3</h3>\n<h4>This is Heading 4</h4>\n<h5>This is Heading 5</h5>\n<h6>This is Heading\
  \ 6</h6>\n```\n\n![六个 HTML 标题标签的截图](img/9781394164684-fg020103.png)\n\n图 1-3： 六个\
  \ HTML 标题标签。\n\n为什么要这么多不同的标题？其意图是使用它们为你的网页创建一个大大纲。具体做法取决于页面，但这里有一种可能的方法：\n\n*  \
  \ 使用 `<h1>` 作为整体页面标题。\n*   使用 `<h2>` 作为页面副标题。\n*   使用 `<h3>` 作为页面主要章节标题。\n*   使用\
  \ `<h4>` 作为页面子章节的标题。\n\n![记住](img/remember.png) 你创建的每个网页应该只包含一个 `<h1>` 元素。从技术上讲，你可以使用多个\
  \ `<h1>` 元素，但只使用一个被认为是最佳实践。\n\n![警告](img/warning.png) 不要跳跃标题级别。例如，如果你使用了 `<h1>`\
  \ 然后是 `<h2>`，请不要直接跳到 `<h4>`。这种跳级行为会破坏那些依赖于一致使用标题来创建页面目录等内容的程序。\n\n例如，在之前图 1-2 所示的段落增强网页中，第一行（了解\
  \ HTML 的基本结构标签”）是一个主章节的标题，而靠近底部的单独成行的行（创建段落”）是一个子章节的标题。我可以将这些转换为标题，如下所示：\n\n```\n\
  <h3>Getting to Know HTML's Basic Structure Tag</h3>\n<h4>Creating paragraphs</h4>\n\
  ```\n\n图 1-4 显示了结果（查看 `bk02ch01/example04.html`）。\n\n![添加标题后的图 1-2 文本的截图](img/9781394164684-fg020104.png)\n\
  \n图 1-4： 添加了标题的图 1-2 文本。\n\n### 添加换行\n\n如果你仔细观察图 1-4 所示的段落和标题，你可能会注意到的事情之一是浏览器在元素元素之间留了大量的空间。这是一件好事，因为正是这些空白使得页面比图\
  \ 1-1 中拥挤在一起的文本易读得多。\n\n然而，对于某些形式形式，“段落”是单行的，例如地址块、代码列表或诗歌。在这种情况下，你不希望行与行之间有那么多空白。例如，图\
  \ 1-5 显示当我用 `<p>` 标签编写下面这段五韵律诗时发生的情况（参考 `bk02ch01/example05.html`）：\n\n```\n<p>There\
  \ once was woman named Elle,</p>\n<p>Who learned tons of HTML.</p>\n<p>Then she\
  \ came to an ode</p>\n<p>That she just couldn't code,</p>\n<p>Now she lives in a\
  \ white padded cell.</p>\n```\n\n![每行都是段落的五韵律诗截图](img/9781394164684-fg020105.png)\n\
  \n图 1-5： 每行都是段落的五韵律诗。\n\n这看起来不太对吧？幸运的是，HTML 考虑到了这种情况，并创建了一个特殊的元素来处理：`br`。这个换行元素的作用正是：它告诉网页浏览器在新的一行开始下一个元素，但行之间没有任何间距。你在需要换行的地方放置\
  \ `<br>` 标签（它没有结束标签），通常是在文本行的末尾，如下所示（查看 `bk02ch01/example06.html`）：\n\n```\nThere\
  \ once was woman named Elle,<br>\nWho learned tons of HTML.<br>\nThen she came to\
  \ an ode<br>\nThat she just couldn't code,<br>\nNow she lives in a white padded\
  \ cell.\n```\n\n图 1-6 显示了结果。\n\n![带有换行的五韵律诗截图](img/9781394164684-fg020106.png)\n\
  \n图 1-6： 带有换行的五韵律诗。\n\n### 使用水平线分割内容\n\n如果你仔细观察图 1-4 所示的段落和标题，你可能会注意到的事情之一是浏览器在元素元素之间留了大量的空间。这是一件好事，因为正是这些空白使得页面比图\
  \ 1-1 中拥挤在一起的文本易读得多。\n\n然而，对于某些文本形式，“段落”是单行的，例如地址块、代码列表或诗歌。在这种情况下，你不希望行与行之间有那么多空白。例如，图\
  \ 1-5 显示当我用 `<p>` 标签编写下面这段五韵律诗时发生的情况（参考 `bk02ch01/example05.html`）：\n\n```\n<p>There\
  \ once was woman named Elle,</p>\n<p>Who learned tons of HTML.</p>\n<p>Then she\
  \ came to an ode</p>\n<p>That she just couldn't code,</p>\n<p>Now she lives in a\
  \ white padded cell.</p>\n```\n\n![每行都是段落的五韵律诗截图](img/9781394164684-fg020105.png)\n\
  \n图 1-5： 每行都是段落的五韵律诗。\n\n这看起来不太对吧？幸运的是，HTML 考虑到了这种情况，并创建了一个特殊的元素来处理：`br`。这个换行元素的作用正是：它告诉网页浏览器在新的一行开始下一个元素，但行之间没有任何间距。你在需要换行的地方放置\
  \ `<br>` 标签（它没有结束标签），通常是在文本行的末尾，如下所示（查看 `bk02ch01/example06.html`）：\n\n```\nThere\
  \ once was woman named Elle,<br>\nWho learned tons of HTML.<br>\nThen she came to\
  \ an ode<br>\nThat she just couldn't code,<br>\nNow she lives in a white padded\
  \ cell.\n```\n\n图 1-6 显示了结果。\n\n![带有换行的五韵律诗截图](img/9781394164684-fg020106.png)\n\
  \n图 1-6： 带有换行的五韵律诗。\n\n### 使用水平线分割内容\n\n等等，提示词部分的提供的文本有些重复。让我根据提供的输入正确地格式化实际文本。\n\
  \n（修正：基于提供的文本块）\n\n为什么要这么多不同的标题？其意图是使用它们为你的网页创建一个大大纲。具体做法取决于页面，但这里有一种可能的方法：\n\n\
  *   使用 `<h1>` 作为整体页面标题。\n*   使用 `<h2>` 作为页面副标题。\n*   使用 `<h3>` 作为页面主要章节标题。\n*  \
  \ 使用 `<h4>` 作为页面子章节的标题。\n\n![记住](img/remember.png) 你创建的每个网页应该只包含一个 `<h1>` 元素。从技术上讲，你可以使用多个\
  \ `<h1>` 元素，但只使用一个被认为是最佳实践。\n\n![警告](img/warning.png) 不要跳跃标题级别。例如，如果你使用了 `<h1>`\
