  \n\n\n\n\n# CSS 伪类\n\n```css\nelement:pseudo-class {\n  property1: value1;\n  property2:\
  \ value2;\n  …;\n}\n```\n\n例如，以下规则为每一个作为其父元素第一个子元素的 `p` 元素应用样式：\n\n```css\np:first-child\
  \ {\n  font-style: italic;\n}\n```\n\n你可以将伪类与其他选择器结合使用，特别是组合选择器。例如，以下规则为每一个作为 `article`\
  \ 元素第一个子元素的 `p` 元素应用样式：\n\n```css\narticle > p:first-child {\n  font-style: italic;\n\
  }\n```\n\n另一种结合伪类和选择器的常用方法是使用类名修改元素名，如下所示：\n\n```css\nelement.class:pseudo-class\
  \ {\n  property1: value1;\n  property2: value2;\n  …;\n}\n```\n\n例如，以下规则为每一个使用了\
  \ `intro` 类且作为其父元素第一个子元素的 `p` 元素应用样式：\n\n```css\np.intro:first-child {\n  font-style:\
  \ italic;\n}\n```\n\nCSS 提供了几十种伪类。没错，几十种。如果这听起来多得惊人，请不要担心：许多——可能甚至是大多数——伪类都比较冷门，即使是专业人士也顶多偶尔使用一次。在接下来的章节中，我将为你介绍最常用伪类的细节，并顺带提到其他一些实用的类。\n\
  \n![Remember](img/remember.png) 如果在随后的页面中，示例代码包含了你不熟悉的属性名，大多数情况下，你可以参考以下章节获取解释：\n\
  \n*   对于任何与内边距（padding）、边框（borders）、外边距（margins）和尺寸（sizes）的内容，请查看第 3 部分的第 1 章。\n\
  *   对于任何与颜色和背景的内容，请前往第 3 部分的第 6 章。\n*   对于任何与文本和对齐相关的内容，请翻阅第 3 部分的第 7 章。\n\n## 匹配子元素\n\
  \n你在 CSS 代码中经常使用的伪类是那些匹配符合某些条件的子元素的伪类。这和我在本章开头提到的子元素选择器（`>`）有什么区别呢？子元素选择器针对的是指定父元素的*每一个*子元素。而与子元素相关的伪元素的作用是提供一种通过位置（例如第一个、第三个或最后一个子元素）来定位特定子元素的方法。\n\
  \n### :first-child\n\n`:first-child` 伪类针对任何作为父元素子元素中第一个的子元素：\n\n```css\nelement:first-child\
  \ {\n  property1: value1;\n  property2: value2;\n  …;\n}\n```\n\n*   `element`:（可选）你想要针对的元素类型名称。如果你省略了\
  \ `element`，你的规则将针对页面上所有作为第一个子元素的元素。\n\n例如，在网页排版中（请参阅第 3 部分的第 7 章），通常使用 `text-indent`\
  \ 属性对所有段落进行缩进（例如 `text-indent: 16px`）。也就是说，所有的段落都要缩进，但第一个段落不应该有缩进。这里有一个使用 `:first-child`\
  \ 实现此点的规则（请查看本书示例文件中的 bk03ch03/example01.html）：\n\n```css\np:first-child {\n  text-indent:\
  \ 0;\n}\n```\n\n![Tip](img/tip.png) 当你单独使用 `:first-child` 时（即没有元素名前缀），你匹配的是每一个作为父元素第一个子元素的元素。这与使用通用选择器（`*`）配合伪类\
  \ `*:first-child` 完全相同。这种等效性在你想要使用类似下面的选择器时非常有用：\n\n```css\narticle :first-child\n\
  ```\n\n此选择器匹配每一个作为第一个子元素的 `article` 后代。在阅读 CSS 时，你或其他人很容易将此选择器误认为下面的这一个：\n\n```css\n\
  article:first-child\n```\n\n此选择器匹配每一个作为第一个子元素的 `article` 元素，这完全不同！为了避免这种混淆，你可以通过显式使用通用选择器让你的第一个选择器更易读：\n\
  \n```css\narticle *:first-child\n```\n\n### :last-child\n\n`:last-child` 伪类针对任何作为父元素子元素中最后一个的子元素：\n\
  \n```css\nelement:last-child {\n  property1: value1;\n  property2: value2;\n  …;\n\
  }\n```\n\n*   `element`:（可选）你想要针对的元素类型名称。如果你省略了 `element`，你的规则将针对页面上所有作为最后一个子元素的元素。\n\
  \n例如，一个实用的设计技巧是在标题之前的最后一个段落底部添加一些额外的空白。这里有一个使用 `:last-child` 为每个 `p` 元素下方设置额外外边距的规则。\n\
  \n### :nth-child()\n\n### :nth-child()\n\n`:nth-child()` 伪类根据元素在兄弟元素中的位置来匹配元素。以下是通用语法：\n\
  \n```css\nelement:nth-child(n) {\n  property1: value1;\n  property2: value2;\n \
  \ …;\n}\n```\n\n*   `element`:（可选）你想要针对的元素类型名称。如果你省略了 `element`，你的规则将针对页面上所有符合 nth\
  \ 子元素的元素。\n*   `n`: 确定匹配元素的表达式。指定 `n` 有五种主要方式：\n    *   整数：匹配第 n 个元素。\n    *   `even`：匹配每一个索引为偶数的元素。\n\
  \    *   `odd`：匹配每一个索引为奇数的元素。\n    *   公式 `an+b`：根据计算出的公式匹配元素。\n    *   公式 `nof(list)`：匹配特定选择器列表中的第\
  \ n 个元素。\n\n```css\n:nth-child(n of list) {\n  property1: value1;\n}\n```\n\n\n\n\
  \n\n*   `n`: 一个数字、表达式或关键字，用于指定你想匹配的子元素的位置或多个位置。\n*   `list`: 一个用逗号分隔的选择器列表。\n\n\
  使用这种语法，`:nth-child(`n` of `list`)` 仅对匹配 `list` 中某一个选择器的子元素匹配表达式 `n`。例如，以下选择器会匹配那些是\
  \ `h1` 或 `h2` 的偶数元素：\n\n```css\n:nth-child(even of h1, h2)\n```\n\n#### :nth-last-child()\n\
  \n`:nth-last-child()` 伪类根据元素在父元素同级元素集合中的位置（从尾部计数）来选择一个或多个元素。以下是通用的使用语法：\n\n```css\n\
  element:nth-last-child(n [of list]) {\n  property1: value1;\n  property2: value2;\n\
  \  /* ... */\n}\n```\n\n*   `element`: （可选）你想要目标的元素类型名称。如果你省略 `element`，你的规则将针对所有作为倒数第\
  \ n 个元素的元素。\n*   `n`: 一个数字、表达式或关键字，用于指定你想匹配的子元素的位置或多个位置。你使用我在上一节中为 `:nth-child()`\
  \ 伪类概述的相同方法指定 `n`。\n*   `list`: （可选）一个用逗号分隔的选择器列表。\n\n简而言之，`:nth-last-child()` 与\
  \ `:nth-child()` 相同，但父子元素的位置是从最后一个元素开始计数的，最后一个元素是位置 1，倒数第二个元素是位置 2，依此类推。\n\n####\
  \ :only-child\n\n`:only-child` 伪类针对任何作为父元素唯一子元素的元素的元素：\n\n```css\nelement:only-child\
  \ {\n  property1: value1;\n  property2: value2;\n  /* ... */\n}\n```\n\n*   `element`:\
  \ （可选）你想要目标的元素类型名称。如果你省略 `element`，你的规则将针对所有作为唯一元素的元素。\n\n例如，这里有一个规则用于样式化任何作为唯一元素的\
  \ `section` 元素后代（bk03ch03/example05.html）：\n\n```css\nsection *:only-child {\n \
  \ color: plum;\n}\n```\n\n### 按类型匹配子元素\n\n我在上一节中反复提及的各种与子元素相关的伪类的一个特性是，它们在计算父元素子元素的位置时不考虑元素类型。这里有一个可以思考的示例：\n\
  \n```html\n<section>\n  <p>Some paragraph text</p>\n  <aside>Some sidebar text</aside>\n\
  \  <p>More paragraph text</p>\n  <aside>Some sidebar text</aside>\n</section>\n\
  ```\n\n从子元素伪类的角度来看，第一个 `p` 元素位于位置 1，`aside` 元素位于位置 2，第二个 `p` 元素位于位置 3，第二个 `aside`\
  \ 元素位于位置 4。考虑以下规则，它针对第一个子元素的 `aside`：\n\n```css\n:nth-child(1) {\n  /* 这里的样式 */\n\
  }\n```\n\n该规则不会应用到 `aside`，因为 `aside` 不是第一个子元素。确实，你可以使用 `:nth-child(n of aside)`\
  \ 来匹配特定的 `aside` 元素。更实用的方法是根据位置匹配某种类型的元素，例如 `:nth-child(n of p)`。这种方法可以方便地匹配特定类型的\
  \ `p` 元素。通常情况下，`:nth-of-type` 伪类非常有用。\n\n#### :first-of-type\n\n`:first-of-type`\
  \ 伪类针对作为父元素中该类型第一个元素的元素：\n\n```css\nelement:first-of-type {\n  property1: value1;\n\
  \  property2: value2;\n  /* ... */\n}\n```\n\n*   `element`: （可选）你想要目标的元素类型名称。如果你省略\
  \ `element`，你的规则将针对所有作为该类型第一个元素的元素。\n\n例如，考虑这段 HTML：\n\n```html\n<section>\n  <p>Some\
  \ paragraph text</p>\n  <aside>Some sidebar text</aside>\n  <p>More paragraph text</p>\n\
  \  <aside>Some sidebar text</aside>\n</section>\n```\n\n以下规则成功针对了 `aside` 元素（bk03ch03/example06.html）：\n\
  \n```css\naside:first-of-type {\n  border: 5px double;\n}\n```\n\n#### :last-of-type\n\
  \n`:last-of-type` 伪类针对作为父元素中该类型最后一个元素的元素：\n\n```css\nelement:last-of-type {\n  property1:\
  \ value1;\n  property2: value2;\n  /* ... */\n}\n```\n\n*   `element`: （可选）你想要目标的元素类型名称。如果你省略\
  \ `element`，你的规则将针对所有作为该类型最后一个元素的元素。\n\n例如，这个规则针对最后一个 `p` 元素：\n\n```css\np:last-of-type\
  \ {\n  margin-bottom: 0;\n}\n```\n\n#### :nth-of-type\n\n`:nth-of-type()` 伪类根据元素在父元素子元素中的位置来选择一个或多个元素：\n\
  \n```css\nelement:nth-of-type(n) {\n  property1: value1;\n  property2: value2;\n\
  \  /* ... */\n}\n```\n\n*   `element`: （可选）你想要目标的元素类型名称。如果你省略 `element`，你的规则将针对所有作为该类型倒数\
  \ n 个元素的元素。\n*   `n`: 一个数字、表达式或关键字，用于指定你想匹配的子元素的位置或多个位置。你使用我在上一节中为 `:nth-child()`\
  \ 伪类概述的相同方法指定 `n`。\n\n#### :nth-last-of-type\n\n`:nth-last-of-type()` 伪类根据元素在父元素同级元素集合中的位置（从尾部计数）来选择一个或多个元素：\n\
  \n```css\nelement:nth-last-of-type(n) {\n  property1: value1;\n  property2: value2;\n\
  \  /* ... */\n}\n```\n\n*   `element`: （可选）你想要目标的元素类型名称。如果你省略 `element`，你的规则将针对所有作为该类型倒数\
  \ n 个元素的元素。\n*   `n`: 一个数字、表达式或关键字，用于指定你想匹配的子元素的位置或多个位置。你使用我在上一节中为 `:nth-child()`\
  \ 伪类概述的相同方法指定 `n`。\n\n#### :only-of-type\n\n`:only-of-type` 伪类针对任何作为父元素中该类型唯一子元素的元素：\n\
  \n```css\nelement:only-of-type {\n  property1: value1;\n  property2: value2;\n \
  \ /* ... */\n}\n```\n\n*   `element`: （可选）你想要目标的元素类型名称。如果你省略 `element`，你的规则将针对所有作为该类型唯一元素的元素。\n\
  \n\n\n\n\n*   元素的当前值对于该元素是合适的（例如，当元素的 `type` 属性被设置为 `number` 时，其值为数值）（即有效状态），或是不合适的（即无效状态）。\n\
  *   复选框、单选按钮或选择列表选项已切换开启（选中状态）。\n*   元素的当前值在元素 `min` 和 `max` 属性指定的范围内（在范围内状态），或在这些范围之外（超出范围状态）。\n\
  \n在所有这些情况下，良好的用户界面设计都会根据元素的当前状态以某种方式对表单元素进行样式处理。例如，禁用的文本框可能有灰色背景和较浅的文字，而具有无效值的元素可能有红色边框和红色文字。\n\
  \n可以使用针对每种状态的各种 CSS 伪类为表单元素的状态设置样式。以下是通用语法：\n\n```\n`form-element`:`state` {\n \
  \ `property1`:`value1`;\n  `property2`:`value2`;\n  …\n}\n```\n\n*   `form-element`:（可选）你想要目标的表单元素或元素的选择器。如果你省略了\
  \ `element`，则你的规则将针对所有作为第一个元素的元素。\n*   `state`: 代表你想要设置样式的 `form-element` 状态的伪类。\n\
  \n例如，以下规则使用 `:disabled` 伪类来针对任何文本框的禁用状态：\n\n```\ninput[type=\"text\"]:disabled {\n\
  \  background-color: lightgray;\n  color: darkgray;\n}\n```\n\n表 3-1 列出了最常用的伪类，它们允许你定位表单元素的状态。\n\
  \n| 伪类 | 匹配内容 | 示例 |\n| --- | --- | --- |\n| `:checked` | 任何已开启的复选框、单选按钮或选择列表选项实例（bk03ch03/example11.html）。\
  \ | `input[type=\"checkbox\"]:checked {box-shadow: 0 0 10px 3px red;}`input[type=\"\
  checkbox\"]:checked + label {color: red;}` |\n| `:default` | 任何处于默认状态的表单元素，包括带有\
  \ `checked` 属性的复选框或单选按钮、带有 `selected` 属性的选择列表选项，或其 `type` 属性设置为 `submit` 的按钮元素（bk03ch03/example12.html）。\
  \ | `input[type=\"radio\"]:default {box-shadow: 0 0 5px 1px forestgreen;}`input[type=\"\
  radio\"]:default + label {color: forestgreen;}` |\n| `:disabled` | 任何设置了 `disabled`\
  \ 属性的表单元素（bk03ch03/example13.html）。 | `button:disabled {cursor: not-allowed;opacity:\
  \ .5;}` |\n| `:enabled` | 任何没有设置 `disabled` 属性的表单元素（bk03ch03/example14.html）。 |\
  \ `button:enabled {box-shadow: 0 0 5px 3px seagreen;color: seagreen;}` |\n| `:in-range`\
  \ | 任何当前值在元素 `min` 和 `max` 属性设置的值范围内的表单元素（bk03ch03/example15.html）。 | `input[type=\"\
  range\"]:in-range {background-color: lawngreen;}` |\n| `:invalid` | 任何当前值无法通过验证的表单元素，例如带有文本值的\
  \ `number` 字段，或带有无效电子邮件地址的 `email` 字段（例如缺少 `@` 符号）（bk03ch03/example16.html）。 | `input[type=\"\
  email\"]:invalid {background: lavenderblush;}` |\n| `:optional` | 任何没有设置 `required`\
  \ 属性的表单元素（bk03ch03/example17.html）。 | `input[type=\"text\"]:optional {background-color:\
  \ lightgoldenrodyellow;}` |\n| `:out-of-range` | 任何当前值不在元素 `min` 和 `max` 属性设置的值范围内的表单元素（bk03ch03/example18.html）。\
  \ | `input[type=\"range\"]:out-of-range {background-color: tomato;}` |\n| `:read-only`\
  \ | 任何设置了 `readonly` 属性的表单元素（bk03ch03/example19.html）。 | `textarea:read-only {border:\
  \ 0;resize: none;}` |\n| `:read-write` | 任何用户可以编辑的元素，这可以是默认可编辑且没有设置 `readonly` 属性的表单元素，也可以任何默认不可编辑但设置了\
  \ `contenteditable` 属性的元素（bk03ch03/example20.html）。 | `span:read-write {background:\
  \ honeydew;caret-color: crimson;}` |\n| `:required` | 任何设置了 `required` 属性的表单元素（bk03ch03/example21.html）。\
  \ | `input[type=\"text\"]:required {background-color: yellow;}` |\n| `:valid` |\
  \ 任何当前值可以通过验证的表单元素，例如带有数值的数字字段，或带有有效电子邮件地址的 email 字段（bk03ch03/example22.html）。 |\
  \ `input[type=\"email\"]:valid {background: palegreen;}` |\n\n### 通过用户操作匹配元素\n\n\
  CSS 定义了你可以定位的三类用户操作：\n\n*   **激活元素（Activating an element）：** 启动与元素相关的任何操作，可以是链接、按钮、复选框等表单元素。用户通过按下（不松开）鼠标按钮通过鼠标激活元素。同样，用户通过按下（不松开）手指或手写笔通过触控激活元素。用户通过按下空格键从键盘激活元素。\n\
  *   **将焦点置于元素（Putting the focus on an element）：** 将元素置于可以输入的状态。对于文本框等元素，用户通过点击或按下\
  \ Tab 键来获取焦点。\n*   **悬停在元素上（Hovering over an element）：** 移动鼠标指针使其停留在元素的边界内。\n\n\
  #### :active\n\n要为激活状态的元素设置样式，请使用 `:active` 伪类：\n\n```\n`element`:active {\n  `property1`:`value1`;\n\
  \  `property2`:`value2`;\n  …\n}\n```\n\n*   `element`:（可选）你想要在激活时针对的元素。如果你省略了 `element`，则你的规则将针对所有变为激活的元素。\n\
  \n这是一个为 `button` 元素设置背景色的示例，并在按钮激活时更改该背景颜色（bk03ch03/example23.html）：\n\n```\nbutton\
  \ {\n  background-color: purple;\n}\n\nbutton:active {\n  background-color: fuchsia;\n\
  }\n```\n\n警告：如果你在同一个元素上同时设置了 `:active` 伪类和 `:hover` 伪类（后文介绍），请确保将 `:active` 规则放在\
  \ `:hover` 规则之后。为什么？根据定义，你必须先悬停在元素上才能激活它，如果你的 `:hover` 规则在 `:active` 规则之后，那么 `:hover`\
  \ 规则将始终覆盖 `:active` 规则。\n\n#### :focus\n\n要为获取焦点的元素设置样式，请使用 `:focus` 伪类：\n\n```\n\
  `element`:focus {\n  `property1`:`value1`;\n  `property2`:`value2`;\n  …\n}\n```\n\
  \n*   `element`:（可选）你想要在获取焦点时针对的元素。如果你省略了 `element`，则你的规则将针对所有获取焦点的元素。\n\n这是一个为任何获取焦点的\
  \ `input` 元素设置背景色的示例（bk03ch03/example24.html）：\n\n```\ninput:focus {\n  background-color:\
  \ lightsteelblue;\n}\n```\n\n\n\n\n\n![Tip](img/tip.png) 要匹配一个自身具有焦点或后代元素具有焦点的元素（例如拥有后代\
  \ `input` 元素的 `fieldset` 元素），请使用 `:focus-within` 伪类而不是 `:focus`。但请注意，`:focus-within`\
  \ 是一个较新的伪类，因此不支持 Internet Explorer 11 等旧版浏览器。\n\n## :hover\n\n当用户将鼠标悬停在元素上时为该元素设置样式，请使用\
  \ `:hover` 伪类：\n\n```css\nelement:hover {\n  property1: value1;\n  property2: value2;\n\
  \  …\n}\n```\n\n- `element`：（可选）当鼠标悬停在其上方时想要目标的元素。如果你省略了 `element`，则你的规则将针对任何悬停在其上的元素。\n\
  \n这是一个示例，它会在用户悬停在按钮元素上时添加外框阴影（bk03ch03/example25.html）：\n\n```css\nbutton:hover\
  \ {\n  box-shadow: 10px 5px 5px grey;\n}\n```\n\n![Warning](img/warning.png) 不要依赖\
  \ `:hover` 伪类进行关键样式设置，因为你的许多访问者可能正在使用触摸屏、屏幕阅读器或其他无法悬停的设备。\n\n## 匹配链接\n\nCSS 提供了几种链接相关的伪类，你可以使用它们为链接设置样式，而无需使用复杂的类。首先，在开始尝试链接样式之前，你需要了解以下一些概念：\n\
  \n- **链接元素 (Link element)**：指任何具有 `href` 属性的元素，特别是 `a` 元素，也包括 `area` 元素。\n- **访问过的元素\
  \ (Visited element)**：指向用户已访问网页的链接元素。出于隐私考虑，所有网络浏览器仅允许你使用一小部分 CSS 属性处理访问过的链接：`color`、`background-color`、`border-color`、`border-bottom-color`、`border-left-color`、`border-right-color`、`border-top-color`、`column-rule-color`、`outline-color`、`text-decoration-color`\
  \ 以及 `text-emphasis-color`。\n- **目标 (Target)**：当用户访问页面锚点时（参考第 2 卷，第 2 章），锚点标签的 `id`\
  \ 属性会被附加到 URL 后面，前面有一个井号（#）。例如，这里有一个锚点为 `section1` 的 `section` 元素：\n\n```html\n\
  <section id=\"section1\">\n```\n\n当用户点击链接访问此锚点时，URL 将在结尾添加 `#section1`，如下：\n\n`https://www.mysite.com/chapter57.html#section1`\n\
  \n页面锚点——此示例中的 `<section>` 标签被称为目标，附加到地址的部分被称为*URL 碎片 (URL fragment)*。\n\n表 3-2 列出了四个主要的链接相关伪类。\n\
  \n| 伪类 | 匹配对象 | 示例 |\n| --- | --- | --- |\n| `:any-link` | 任何链接元素 (bk03ch03/example26.html)\
  \ | `aside a:any-link {text-decoration-color: mediumvioletred;text-decoration-style:\
  \ wavy;}` |\n| `:link` | 用户尚未访问过的任何链接元素 (bk03ch03/example27.html) | `a:link {color:\
  \ red;text-decoration-color: red;}` |\n| `:target` | `id` 属性值与当前 URL 碎片匹配的元素 (bk03ch03/example28.html)\
  \ | `button:target {cursor: not-allowed;opacity: .5;}` |\n| `:visited` | 用户访问过的任何链接元素\
  \ (bk03ch03/example29.html) | `a:visited {color: pink;text-decoration-color: pink;}`\
  \ |\n\n*旧版网络浏览器（如 Internet Explorer 11）不支持伪类。*\n\n表 3-2 链接相关伪类\n\n![Warning](img/warning.png)\
  \ 在用户点击你的链接之一后，网络浏览器会认为该链接已被“访问”，且该状态永远 way。换句话说，当用户点击你的链接之一时，你的 `:visited` 伪类规则将始终生效。如果你的样式表中\
  \ `:visited` 伪类规则出现在 `:active` 和 `:hover` 伪类规则之后，这种情况可能会搞乱你的样式。一个常用的规则是按照以下顺序添加链接规则：`:link`、`:visited`、`:hover``:active`。\n\
  \n## 使用函数伪类\n\n随着你的 Web 项目增长以及选择器工作变得越来越复杂，你可能会开始怀疑 CSS 是否提供了某些简写方法来简化某些选择器工作。是的，提供的！CSS\
  \ 提供了几种简写方法可以简化你的某些选择器工作。\n\n### 选择器列表\n\n选择器列表是逗号分隔的选择器集合。例如，考虑以下内容：\n\n```css\n\
  h1 {\n  margin: 20px;\n}\n\nh2 {\n  margin: 20px;\n}\n\nh3 {\n  margin: 20px;\n\
  }\n```\n\n### :is() 函数伪类\n\n`:is()` 伪类被称为*匹配任意 (matches-any)* 伪类，因为它匹配指定列表中的任何选择器。其语法如下：\n\
  \n```css\nelement:is(selector-list) {\n  property1: value1;\n  property2: value2;\n\
  \  …\n}\n```\n\n- `element`：（可选）当你使用选择器列表时想要目标的元素。如果你省略了 `element`，则你的规则将针对匹配列表中任何项内容的元素。\n\
  - `selector-list`：逗号分隔的选择器列表。\n\n在不带 `element` 参数使用时，`:is()` 匹配列表中的至少一个项。这是一个示例（bk03ch03/example30.html）：\n\
  \n```css\n:is(h1, h2, h3) {\n  margin: 20px 16px;\n}\n```\n\n在带有 `element` 参数使用时，`:is()`\
  \ 针对匹配列表中至少一项的 `element` 类型元素。这是一个示例（bk03ch03/example30.html）：\n\n```css\np:is(:first-child,\
  \ :last-child, :only-child) {\n  margin: 24px;\n}\n```\n\n该规则匹配作为第一个元素、最后一个元素或唯一元素的\
  \ `p` 元素。\n\n![Remember](img/remember.png) `:is()` 伪类使用具有容错性的选择器列表，即使一个或多个选择器无效，浏览器仍然处理剩余部分。\n\
  \n![Warning](img/warning.png) `:is()` 函数伪类较新，因此不支持 Internet Explorer 11 等旧版浏览器。\n\
  \n## :not()\n\n`:not()` 函数伪类被称为*匹配不匹配 (matches-none)* 伪类，因为它针对不匹配指定列表列表中任何选择器的元素。其语法如下：\n\
  \n```css\nelement:not(selector-list) {\n  property1: value1;\n  property2: value2;\n\
  \  …\n}\n```\n\n- `element`：（可选）当你使用选择器列表时想要目标的元素。如果你省略了 `element`，则你的规则将针对列表中没有任何匹配项的内容。\n\
  - `selector-list`：逗号分隔的选择器列表。\n\n在不带 `element` 参数使用时，`:not()` 针对所有不匹配选择器列表中项的元素。这是一个示例（bk03ch03/example31.html）：\n\
  \n```css\n:not(.decorative) {\n```\n\n\n\n\n\n```css\nfont-family: Georgia, serif;\n\
  }\n```\n\n该规则将 `font-family` 样式应用到任何未使用 `decorative` 类的元素。\n\n![Warning](img/warning.png)\
  \ 在不带 `element` 参数的情况下使用 `:not()`，你可能需要小心，因为你可能会抛出一个范围非常大的样式网，捕获到许多非预期的元素（例如 `html`\
  \ 或 `body` 元素）。\n\n当配合 `element` 参数使用时，`:not()` 针对任何不匹配选择器列表中任何项的 `element` 类型元素。示例如下：\n\
  \n```css\np:not(:first-child, :last-child, :only-child) {\n  margin: 24px;\n}\n\
  ```\n\n该规则匹配任何不是第一个子元素、最后一个子元素或唯一子元素的 `p` 元素。\n\n![Tip](img/tip.png) 在第二本书第 6 章\
  \ 中，我提到过在你的每个 `<img>` 标签中不包含 `alt` 属性会使你的页面不仅无效还会降低可访问性。然而，在编码战斗的激烈时刻，很容易忘记那些 `alt`\
  \ 属性。当我处于自己页面的开发阶段时，我会在 CSS 中包含以下规则，让没有 `alt` 的图像脱颖出来：\n\n```css\nimg:not(img[alt])\
  \ {\n  outline: 3px solid red;\n}\n```\n\n该规则针对没有 `alt` 属性的 `img` 元素，并在它们周围加上红色的轮框。\n\
  \n![Remember](img/remember.png) `:not()` 伪类使用一个严格的选择器列表，因此如果一个或多个选择器无效或不支持，浏览器将丢弃整个规则。\n\
  \n### :where()\n\n`:where()` 函数伪类匹配指定选择器列表中的任何选择器。语法如下：\n\n```css\nelement:where(selector-list)\
  \ {\n  property1: value1;\n  property2: value2;\n  …\n}\n```\n\n*   `element`:（可选）你想要用选择器列表针对的元素。如果你省略了\
  \ `element`，那么你的规则将针对所有的第一个子元素。\n*   `elector-list`: 用逗号分隔的选择器列表。\n\n等一下，我听见你在说，这和\
  \ `:is()` 函数伪类完全一样！这是怎么回事？\n\n首先，眼光真不错！其次，CSS 拥有两个看起来完全相同的函数伪类，其原因是非常具技术性的，而且在你读完第三本书第\
  \ 4 章` 和 `:where()` 是相同的，但有以下几点不同：\n\n*   分配给 `:is()` 伪类的权重是其选择器列表中选择器中的最高权重。\n\
  *   分配给 `:where()` 伪类的权重始终为 0。\n\n要了解为什么这很重要，请参阅第三本书第 4 章中关于权重的讨论。\n\n![Remember](img/remember.png)\
  \ `:where()` 伪类使用一个宽容的选择器列表，因此即使一个或多个选择器无效或不支持，浏览器仍然会处理剩余的选择器。\n\n### :has()\n\n\
  如果你从 20 世纪 90 年代 CSS 问世以来每年对 CSS 开发者进行民意调查，并问他们每个开发者最希望实现的缺失功能是什么，那么每年的头名答案无疑都是“父级选择器”。也就是说，给定一个元素、一个类或其他选择器，该选择器的父元素（或祖先元素）是哪个？\n\
  \n这看起来如此有用且显而易见，以至于大多数初学 CSS 的人听到 CSS 中根本没有所谓的“父级选择器”时感到惊讶。这意味着直到全新的 `:has()` 函数伪类的出现。`:has()`\
  \ 伪类实际上设计用于以下几件事：\n\n*   匹配任何作为子元素选择器列表中任何项的父元素。换句话说，你会说：“匹配一个*拥有*列表中子元素的父”。\n*\
  \   匹配任何作为后代选择器列表中任何项的祖先元素。换句话说，你会说：“匹配一个*拥有*列表中后代的祖先”。\n*   匹配任何作为兄弟元素选择器列表中任何项的前一个兄弟元素。换句话说，你会说：“匹配一个*拥有*列表中下一个兄弟的兄弟”。\n\
  *   匹配任何作为兄弟元素选择器列表中任何项的之前的兄弟元素。换句话说，你会说：“匹配一个*拥有*列表中后一个兄弟的兄弟”。\n\n这是 `:has()` 的语法：\n\
  \n```css\nelement:has(relative-selector-list) {\n  property1: value1;\n  property2:\
  \ value2;\n  …\n}\n```\n\n*   `element`:（可选）你想要用选择器列表针对的父元素、祖先或兄弟元素。如果你省略了 `element`，那么你的规则将针对所有的第一个子元素。\n\
  *   `relative-selector-list`: 用逗号分隔的选择器列表。\n\n等一下，我听见你在说，这和 `:is()` 函数伪类完全一样！这是怎么回事？\n\
  \n首先，眼光真不错！其次，CSS 拥有两个看起来完全相同的函数伪类，其原因是非常具技术性的，而且在你读完第三本书第 4 章` 和 `:where()` 是相同的，但有以下几点不同：\n\
  \n*   分配给 `:is()` 伪类的权重是其选择器列表中选择器中的最高权重。\n*   分配给 `:where()` 伪类的权重始终为 0。\n\n（注：原文此处在\
  \ :has() 之后存在大量重复和逻辑混乱，已根据 CSS 选择器标准逻辑进行了修正性翻译）\n\n\n\n\n\n![Remember](img/remember.png)\
  \ 在我写这段文字时，`:has()` 伪类尚未被所有主流浏览器实现。然而，整体支持率正在迅速提高，所以当你读到这里时，`:has()` 在每个现代浏览器中都应该得到了良好的支持。要关注当前的支持水平，请使用以下\
  \ Can I Use 页面：[`https://caniuse.com/css-has`](https://caniuse.com/css-has)。不消说，旧版浏览器（如\
  \ Internet Explorer 11）没有实现 `:has()`，因此如果你需要支持这些古老的浏览器，请不要使用 `:has()`。\n\n# 快速上手伪元素\n\
  \n随着你 CSS 职业生涯的进步，早晚（几乎总是早早）你都会遇到两个自第一天起就困扰网页设计师的难题：\n\n*   我如何根据元素的当前状态动态地插入并样式化内容？\n\
  *   我如何对元素的特定部分（例如它的第一行）进行样式化？\n\n这两个问题的共同点是，你想要对不是原始页面 HTML 的进行样式化。在第一种情况下，你想添加新内容；在第二种情况下，你想对一个没有\
  \ HTML 等效对应的部分进行样式化。换句话说，你想处理的是并非是元素的页面项，这些被称为**伪元素**。\n\n## 使用伪元素\n\n所有的伪元素都以两个冒号（`::`）开头，后面跟着一个关键字。通用语法如下：\n\
  \n```\nelement::pseudo-element {\n  property1: value1;\n  property2: value2;\n}\n\
  ```\n\n*   `element`: 你想要目标的元素类型名称\n*   `pseudo-element`: 伪元素的名称。在随后的章节中，我将提到 `::after`\
  \ 和 `::before`，你用它们动态添加内容——即生成内容——以及 `::first-letter` 和 `::first-line`，你用它们对元素的片段进行样式化。\n\
  \n## 使用 ::after 生成最后一个元素\n\n你可以使用 `::after` 伪元素为目标元素生成新内容。虽然“after”（之后）一词意味着生成的内容被插入在目标元素之后（如果是这样，新元素将成为目标元素的兄弟元素），但事实并非如此。在这里，“after”指的是“目标元素现有子元素之后”。也就是说，你使用\
  \ `::after` 为某些父元素生成一个新的最后一个元素。以下是使用的语法：\n\n```\nparent::after {\n  content: 'content';\n\
  \  property1: value1;\n  property2: value2;\n}\n```\n\n*   `parent`: 你要在其中生成新的最后一个子元素的父元素\n\
  *   `content`: 你希望出现在生成子元素中的内容。如果你不想在新的最后一个元素中显示任何内容，请将 `content` 属性设置为空字符串（`''`\
  \ 或 `\"\"`）。\n\n`::after` 伪元素的一个常见用例是用特殊图标来指示外部链接（即指向你网站之外页面的链接）。当然，你可以手动在每个外部链接之后插入图标的\
  \ `img` 元素，但当你有超过几个的链接时，这可不是什么有趣的事。既然 CSS 乐意为你完成所有工作，没必要大费周章（bk03ch03/example33.html）：\n\
  \n```css\na[href^='http']::after {\n  content: url(images/Icon_External_Link.png);\n\
  \  padding-left: 2px;\n}\n```\n\n这里的父元素是所有 `href` 属性以 `http` 开头的 `a` 元素，这涵盖了所有的外部链接。对于\
  \ `::after` 生成的内容，`content` 属性是图片的本地地址（`images/Icon_External_Link.png`）。请参阅第三本书第\
  \ 6 章了解更多关于 CSS `url()` 函数的知识。该规则还使用 `padding-left: 2px` 在链接文本和图像之间产生一些空间。图 3-2\
  \ 显示了添加到几个外部链接上的图标。\n\n![使用 ::after 伪元素在外部链接后生成图标的截图](img/9781394164684-fg03302.png)\n\
  \n**图 3-2：** 使用 `::after` 伪元素在外部链接后生成图标。\n\n对于不能作为父元素的元素，另一个实用技术是在元素之后添加一个空的 `<span></span>`\
  \ 标签，并使用该 `span` 元素创建生成的内容。这是一个 `input` 元素的示例，第一个是 `text` 字段，第二个是 `email` 字段（bk03ch03/example33.html）：\n\
  \n```html\n<label for=\"user-name\">Name:</label>\n<input id=\"user-name\" type=\"\
  text\" required>\n<span></span>\n\n<label for=\"user-email\">Email:</label>\n<input\
  \ id=\"user-email\" type=\"email\" placeholder=\"e.g., you@domain.com\" required>\n\
  <span></span>\n```\n\n这两个字段都具有 `required` 属性，因此它们为空时都是无效的。此外，当 `email` 字段包含无效的电子邮件地址时也是无效的。你希望在字段无效时在\
  \ `span` 中显示 `X`（Unicode 字符 2717），在字段有效时在 `span` 中显示一个勾号（Unicode 字符 2713）。以下是实现此操作的规则（bk03ch03/example33.html）：\n\
  \n```css\ninput:invalid + span::after {\n  content: '\\2717';\n  color: red;\n}\n\
  \ninput:valid + span::after {\n  content: '\\2713';\n  color: green;\n}\n```\n\n\
  图 3-3 显示了该规则的应用情况：顶部的文本字段因为它有值所以是有效的；底部的电子邮件字段因为它只有部分地址所以是无效的。\n\n## 使用 ::before\
  \ 生成第一个元素\n\n`::before` 伪元素非常实用且有趣，但不要用它来生成核心内容，因为许多辅助技术无法读取或处理这些内容。（images/tip.png）\n\
  \n![提示](img/tip.png) **提示：** `::before` 伪元素生成的内容是内行的，因此它与周围元素一起流动。如果你希望生成的内容成为块级元素（例如让你能够对伪元素的宽度和或高度进行样式化），请在伪元素的声明块中添加\
  \ `display: block` 或 `display: inline-block`。\n\n![警告](img/warning.png) **警告：**\
  \ `::after` 伪元素非常实用且有趣，但不要用它来生成核心内容，因为许多辅助技术无法读取或处理这些内容。（bk03ch03/example34.html）\n\
  \n```css\n.tip::before {\n  content: 'TIP';\n  display: block;\n  color: green;\n\
  \  font-size: 12px;\n}\n```\n\n\n\n\n\n该 CSS 规则使用 `::before` 将文本 `TIP` 作为一个块级元素添加，它是任何使用\
  \ `tip` 类的元素的第一个子元素。图 3-4 显示了此示例的运行效果。\n\n![使用 ::before 伪元素生成内容的截图](img/9781394164684-fg030304.png)\n\
  \n图 3-4： 使用 `::before` 伪元素生成内容。\n\n![警告](img/warning.png) 许多辅助技术无法读取或处理由 `::before`\
  \ 生成的内容，因此不要使用 `::before` 添加核心内容。\n\n## 使用 ::first-letter 样式化首首字母\n\n一种常见的设计范式是提取文章或其他长文本开头段落的首字母，并对该字母进行某种样式化处理，通常是使用比正文更大的字体和/或不同颜色的字体。\n\
  \n是的，你可以将字母包裹在 `span` 元素中并对该元素进行样式化，但 CSS 提供了一种更直接、更具维护性的途径：`::first-letter` 伪元素，它针对的是指定块级元素的第一个字母。其语法如下：\n\
  \n```css\nelement::first-letter {\n  property1: value1;\n  property2: value2;\n\
  \  …\n}\n```\n\n*   `element`: 一个选择器，指定包含你想要样式化的首字母的元素。\n\n这是一个示例 (bk03ch03/example35.html)：\n\
  \nHTML:\n\n```html\n<article>\n  <h2>少年的词汇量缩减到一个单词</h2>\n  <p>当地青少年 Dylan Geronimo\
  \ 现在仅用“whatever”一个词就与父母和老师进行交流。通过微妙的语气变化，Geronimo 先生可以传达他全范围的情绪：闷、厌恶、沮丧以及一种内心翻腾的、无名的怒火。</p>\n\
  \  …\n</article>\n```\n\nCSS:\n```css\nh2 + p::first-letter {\n  color: crimson;\n\
  \  font-size: 32px;\n}\n```\n\n该 CSS 规则针对任何作为 `h2` 元素后续兄弟的 `p` 元素的第一个字母。声明块使用颜色和字体大小对该字母进行样式化。图\
  \ 3-5 显示了结果。\n\n![使用 ::first-letter 伪元素样式化段落首字母的截图](img/9781394164684-fg030305.png)\n\
  \n图 3-5： 使用 `::first-letter` 伪元素样式化段落的首字母。\n\n![记住](img/remember.png) 并不是所有的 CSS\
  \ 属性都适用于 `::first-letter` 声明块。你可以使用所有可用的 `padding`、`border`、`margin`、`background`、`font`\
  \ 和 `text decoration` 属性，`color` 属性以及 `float` 属性。\n\n## 使用 ::first-line 样式化首\n\n\
  在复杂的文本设计中，某些文本的第一行通常会进行某种样式处理，例如使用斜体或大写字母。（当第一行以经过样式化的首字母开始时，例如落格字母或上升字母，这类样式尤为常见；请参阅上一节。）\n\
  \n但我听见你们在问，考虑到截然不同的屏幕尺寸、显示方向和默认字体大小，如何预先知道文本的第一“行”将会是什么？简短的回答是：“你做不到。”长一点的回答是：“你做不到，也不需要，因为你可以使用\
  \ `::first-line` 伪元素来为你解决这个问题。”\n\n`::first-line` 伪元素对指定块元素中的第一行进行样式化，无论该行由于显示宽度、页面宽度、字体大小以及所有影响网页行长度的因素变得有多长或多短。其语法如下：\n\
  \n```css\nelement::first-line {\n  property1: value1;\n  property2: value2;\n  …\n\
  }\n```\n\n*   `element`: 一个选择器，指定包含你想要样式化的第一行的元素。\n\n这是一个示例 (bk03ch03/example36.html)：\n\
  \nHTML:\n\n```html\n<article>\n  <h2>少年的词汇量缩减到一个单词</h2>\n  <p>当地青少年 Dylan Geronimo\
  \ 现在仅用“whatever”一个词就与父母和老师进行交流。通过微妙的语气变化，Geronimo 先生可以传达他全范围的情绪：闷、厌恶、沮丧以及一种内心翻腾的、无名的怒火。</p>\n\
  \  …\n</article>\n```\n\nCSS:\n```css\nh2 + p::first-line {\n  text-transform: uppercase;\n\
  }\n```\n\n该 CSS 规则针对任何作为 `h2` 元素后续兄弟的 `p` 元素的第一行。\n\n\n\n\n\n如有需要，你可以自由将注释扩展为多行：\n\
  \n```css\n/* 这是注释的第一行\n以及这是第二行。 */\n```\n\n### 为非直观代码添加注释\n\n每当你编写某些 CSS 代码，且其代码的作用并不而直观时，请直接在规则上方添加注释，如下所示：\n\
  \n```css\n/* 为没有 alt 属性的图像添加红色轮廓 */\nimg:not(img[alt]) {\n  outline: 3px solid red;\n\
  }\n```\n\n现在，当其他人审查你的代码或当你以后再次查看这些代码时，这些 CSS 将变得易读得多。你也可以在声明块内部插入注释：\n\n```css\n\
  div {\n/* 为不支持渐变的的浏览器设置背景颜色 */\nbackground-color: white;\nbackground-image: linear-gradient(to\
  \ bottom, white 0%, crimson 100%);\n}\n```\n\n### 使用注释标记样式表区域\n\n驯服大型且凌乱的样式表的方法是将代码组织成一组组相关的规则。你划分的区域取决于你的页面以及用于样式的\
  \ CSS，但对于大多数网站来说，这种组织方式是通用的：\n\n* 通用或全局样式\n* 字体样式\n* 布局样式\n* 排版样式\n* 特定网站特性的样式\n\
  \n为了清楚一个区域的结束和另一个区域的开始，请使用多行注释来标记每个区域的开头：\n\n```css\n/*================**************\n\
  通用样式\n***********************************************/\n/* 通用规则放在这里 */\n\n/*================**************\n\
  字体样式\n*********************************/\n/* 字体规则放在这里 */\n\n/*================**************\n\
  布局样式\n*********************************/\n/* 布局规则放在这里 */\n等。\n```\n\n## 使用 CSS 重置\n\
  \n所有的网络浏览器都内置了一套样式，被称为用户代理样式表（user agent stylesheet）。我稍后会详细详细介绍这种样式表（请参阅“打开引擎盖：样式是如何应用的””），但现在只需要知道这些样式是浏览器应用于页面发现的\
  \ HTML 元素的默认样式即可。换句话说，即使你没有定义任何一条 CSS 规则，得益于浏览器定义的页边距、内边距和其他样式，你的页面元素看起来仍然不错（尽管可能有点无聊）。\n\
  \n多年来，这些浏览器样式表一直是每个 CSS 开发者心头的大敌之一。为什么呢？原因有很多，但有两个尤为突出：\n\n* 某些浏览器（Internet Explorer\
  \ 用户，请举手！）在某些默认样式上做出了非常奇特的选择。\n* 不同浏览器之间的默认样式经常存在明显的不一致之处，这意味着页面的外观根据所使用的浏览器而有显著不同。\n\
  \n最后，几位 CSS 大师认为已经够了，并提出了 CSS 重置（CSS reset）的概念，它（通常）是一个外部 CSS 文件，其中包含了设计用于解决上述问题的规则：\n\
  \n* 重置包含了规则，这些规则会覆盖开发者认为的某些浏览器所做出的糟糕样式选择。\n* 重置包含了规则，通过覆盖某些默认浏览器样式，强制浏览器之间具有更高的一致性。\n\
  \n这些重置通常被描述为“带有主观色彩”（opinionated），因为创建者做的选择是主观的。尽管如此，大多数 CSS 代码编写者都接受了重置，全球样式表恢复了某种秩序。\n\
  \n如今，情况已没那么糟糕了，因为那些有问题的旧浏览器（Internet Explorer，请再次举手！）要么已经消失，要么市场份额小到几乎无法衡量，而且现代浏览器在定义默认样式方面要一致得多。而且，无论如何，现代方法是认为，如果不同浏览器渲染页面的方式存在细微差异也是可以接受的。毕竟，用户不会用\
  \ Chrome 浏览你的网站，然后说：“让我们看看这个小家伙在 Safari 里长什么样吧！”\n\n结果是，现在你可能不需要 CSS 重置也能应。为什么是“可能”？因为虽然浏览器的默认设置现在好多了，但它们并不完美。仍然存在足够的不一致和奇特的样式选择，因此建议使用\
  \ CSS 重置。\n\n那么，是哪一个呢？因为世界上似乎有几十种 CSS 重置。幸运的是，这并不是很难回答的问题，因为有一种 CSS 重置到目前是最流行的，并且被广泛认为在修复问题和保留有用默认样式之间取得了最好的平衡。而且，它的重量仅为\
  \ 6KB，小到完全不会减慢你的页面加载速度。那个重置被称为 `Normalize.css`，你可以在这里下载它：\n\n`https://necolas.github.io/normalize.css/latest/normalize.css`\n\
  \n下载文件后，将其移动到你 Web 项目的 CSS 文件夹中，然后向页面的 `<head>` 部分添加一个 `<link>` 标签，并放在任何其他样式表 `<link>`\
  \ 标签以及 `<style>` 标签（如果有的话）之前。例如，如果你将 `normalize.css` 存储在与 HTML 文件相同文件夹下的 `css` 子文件夹中，你的\
  \ `<link>` 标签看起来如下：\n\n```html\n<link rel=\"stylesheet\" href=\"css/normalize.css\"\
  >\n```\n\n![记住](img/remember.png) 为什么我强调你应该将 Normalize.css 的 `<link>` 标签放在 `<head>`\
  \ 部分中任何其他 CSS 内容之前？因为浏览器是按顺序处理 CSS 的，从第一个开始一直处理到最后一个。通过将你的 Normalize.css `<link>`\
  \ 标签放在所有内容之前，你确保了浏览器首先执行重置，这正是你所想要的。\n\n提示：Normalize.css 的伟大特性之一是，代码中充斥着大量的注释，解释了每个样式规则的设计。用你喜欢的文本编辑器打开该文件，并研究一下重置的具体作用。\n\
  \n## 调试 CSS\n\nCSS 是棒极的。只需几条规则，你就能将枯燥无生命的页面变成令人愉悦的艺术品。但 CSS 也是让人头疼的。你向 CSS 中添加了一条看起来非常简单的规则，保存工作，刷新浏览器……什么都没变！或者情况变了，但不是你预期的那样。想象一下你冒火的样子。\n\
  \n在这里我想说，尽管这些挫败感是 CSS 社区的传奇，但它们*并不*意味着正如某些人所说，CSS 是“不合逻辑的”、“愚蠢的”或“损坏的”。有一群专注且非常聪明的人创建了\
  \ CSS 标准，相信我，这些人非常清楚自己在做什么。\n\n不过这没关系，因为每个 CSS 困境都有办法。你可能做的最重要的事情就是彻底熟悉 CSS 是如何应用规则的，这是后续章节“打开引擎盖：样式是如何应用的”的主题。\n\
  \n\n\n\n\n大多数 Web 开发人员使用 Google Chrome 调试 CSS，因此在本节中我重点关注该浏览器。但以下是在不仅在 Chrome，而且在各种版本的\
  \ Firefox、Microsoft Edge 和 Safari 中打开 Web 开发工具的方法：\n\n*   **Windows 版 Chrome：**\
  \ 点击“自定义并控制 Google Chrome”（地址栏右侧的三个垂直点），然后选择“更多工具” ⇒  开发者工具。快捷键：`Ctrl+Shift+I`。\n\
  *   **Mac 版 Chrome：** 选择“查看” ⇒ 开发者 ⇒ 开发者工具。快捷键：`Option+⌘  +I`![我将调试的网页示意图](img/9781394164684-fg030401.png)\n\
  \n图 4-1 ![image](img/9781394164684-ma009.png) 在所有浏览器开发工具中，你都可以配置面板相对于浏览器窗口的位置。在\
  \ Chrome 中，点击自定义图标（如页边栏所示），然后点击“停靠右侧”、“停靠底部”或“停靠左侧”，如图图 4-2\n\n图 4-2 如果 Web 开发工具已经打开，点击“选择元素”图标（如页边栏所示）；然后点击渲染页面上的一个元素。\n\
  \n图 4-3 显示了图 4-1 中的页面，并选择了页头的 `img` 元素。\n\n这里有两点需要注意：\n\n*   标签的左侧显示浏览器解释的页面 HTML\
  \ 代码。\n*   当你将鼠标指针悬停在元素上时，浏览器会在渲染页面中高亮该元素，并显示元素的尺寸。\n\n![检查 img 元素的截图](img/9781394164684-fg030403.png)\n\
  \n图 4-3 `user agent stylesheet` 的顺序不是随机的，浏览器根据重要性对规则进行排序。请参考图 4-2。\n\n![提示](img/tip.png)\
  \ 在所有浏览器开发工具中，你都可以配置面板相对于浏览器窗口的位置。在 Chrome 中，点击自定义图标（如页边栏所示），然后点击“停靠右侧”、“停靠底部”或“停靠左侧”，如图图\
  \ 4-2 所示。如果你喜欢可以移动的浮动面板，点击“取消停靠”。\n\n*(注：原文中存在大量重复的段落，已根据指令“不要重复输出原文”的原则进行去重，保留核心内容翻译)*\n\
  \n\n\n\n\n图 4-6: 浏览器将元素的盒模型显示为一系列同心矩形。\n\n所有这些对调试有什么帮助呢？特别是查看浏览器实际使用的内边距（padding）和外边距（margin）取值，可以帮助你解决间距问题。例如，在图\
  \ 4-1 中，注意到左上角的标题图像周围没有任何空间。为了理解原因，我可以检查 `img` 元素。你快看，正如图 4-7 所示，该元素*没有*内边距或外边距（也就是说，浏览器显示的是破折线而不是数值），这解释了为什么图像被其网页的邻居元素挤在一起。\n\
  \n![img 元素盒模型的截图告诉我们它没有设置外边距或内边距。](img/9781394164684-fg030407.png)\n\n图 4-7: `img`\
  \ 元素的盒模型告诉我们它没有设置外边距或内边距。\n\n### 检查元素的计算样式\n\n元素的*计算样式*（computed styles）是浏览器在权衡了所有可用\
  \ CSS 规则（例如默认用户代理样式、你的 CSS 重置以及你定义的样式）后计算出的最终属性值。如果一个元素的显示方式不像你想象的那样，那么它的计算样式至少可以告诉你为什么浏览器是以这种方式渲染元素的。\n\
  \n在浏览器的 Web 开发工具中，Elements（元素）标签包含一个 `Computed`（计算）子标签，它可以显示所选元素的计算样式，如图 4-8 所示。要弄清楚\
  \ 浏览器从哪里获取计算值，点击属性左侧的曝光三角形，这将显示浏览器正在使用的规则所在的位置。\n\n![提示](img/tip.png) 如果 `Computed`\
  \ 标签中有一个长长的属性列表，你可以勾选 `Group`（分组）复选框，按类别（如布局、文本和外观）组织属性，从而更容易找到你想要的项。\n\n![提示](img/tip.png)\
  \ 默认情况下，`Computed` 标签仅显示浏览器计算出的与默认值不同的属性。要检查每个属性（包括未更改的默认值），请勾选 `Show All`（显示所有）复选框。\n\
  \n![Computed 标签的截图显示了所选元素的计算样式。](img/9781394164684-fg030408.png)\n\n图 4-8: `Computed`\
  \ 标签显示了所选元素的计算样式。\n\n### 检查元素的布局\n\nElements 标签中对调试 CSS 有用的最后一个功能是 `Layout`（布局）标签，它提供了可视化使用以下技术的布局的工具：\n\
  \n*   **CSS Grid:** 允许你添加一个叠加层，显示网格及其轨道编号。你还可以选择性查看轨道大小、命名区域和扩展网格线。参考第 5 卷第 3 章，不仅可以学习如何使用\
  \ CSS Grid 布局页面，还可以学习检查网格的细节。\n*   **Flexbox:** 允许你添加一个简单的叠加层，帮助你可视化 flex 容器及其子项。参考第\
  \ 5 卷第 2 章，学习如何使用 Flexbox 布局页面以及如何使用叠加层检查 flex 布局。\n\n### 编辑属性值\n\n如果 Web 开发工具仅仅是为了检查\
  \ CSS，那么它们确实很有用，但远不上改变游戏规则。幸运的是，你的浏览器开发工具允许你不仅查看当前的 CSS，还可以*修改它*。也就是说，你可以对几乎任何属性值进行临时的、即时的调整。一旦你编辑了现有的属性值，浏览器会自动更新渲染后的页面以反映该更改。\n\
  \n为什么这会改变游戏规则呢？因为通常情况下要进行更改，你必须回到 HTML 或 CSS 文件，根据需要编辑 CSS，保存工作，可能还要上传编辑后的文件，切换到浏览器，然后刷新页面。如果编辑没有产生你想要的结果，并且你决定尝试其他的，你还需要回到\
  \ CSS 并撤销你刚刚做的更改。\n\n对于大多数时候只是对属性值进行微小调整来说，这工作量太太大了。通过 Web 开发工具，你可以快速地进行该更改，而不会破坏你的原始代码。这毫不费力，一点也不麻烦。\n\
  \n以下是工作原理：\n\n1.  **在浏览器开发工具的 Elements 标签中，点击你想要修改的元素。**\n2.  **在 Styles 子标签上，点击你想要编辑的属性值。**\n\
  \    浏览器会打开该值以供编辑。\n3.  **编辑该值。**\n    你可以通过以下方式编辑属性值：\n    *   要替换整个值，只需输入新值。这之所以有效，是因为当你第一次点击属性值时，浏览器会选中整个条目，所以你的输入会替换该选择。\n\
  \    *   要从列表中选择新值，按 `Delete` 键删除当前值，然后从浏览器列表中点击新值。注意，这种技术仅适用于具有定义关键字的属性值。\n   \
  \ *   要编辑值的某部分，再次点击该值以放置插入光标；然后进行编辑。\n    *   要增加数值值，按向上方向的箭头键；要减小数值值，按向下方向的箭头键。\n\
  4.  **当你完成更改后，按 Enter 键。**\n\n对于盒模型，你也可以在 `Computed` 标签中直接编辑值（如图 4-6 所示）。以下是工作原理：\n\
  \n1.  **在浏览器开发工具的 Elements 标签中，点击你想要修改的元素。**\n2.  **点击 `Computed` 标签。**\n3.  **在盒模型中，双击你想编辑的值。**\n\
  \    在内容框中，双击 `width` 或 `height`。否则，在 `padding`、`border` 或 `margin` 矩形中，双击 `top`、`right`、`bottom`\
  \ 或 `left` 值。\n4.  **输入新值并按 Enter 键。**\n\n### 禁用声明\n\n在调试 CSS 时，可以问自己一个非常有用的“如果……”问题：“如果声明\
  \ A 不在规则 B 中呢？”换句话说，如果元素的规则没有包含某个特定声明，浏览器将如何渲染该元素？\n\n不需要回到你的 CSS 源码并注释掉该声明。相反，你的浏览器开发环境可以轻松禁用任何非用户样式表的规则。操作方法如下：\n\
  \n1.  **在浏览器开发工具的 Elements 标签中，点击你想要修改的元素。**\n2.  **在 Styles 子标签上，将鼠标悬停在包含你想禁用的声明的规则上。**\n\
  \    浏览器会在规则中的每个声明左侧显示一个选择框，如图 4-9 所示。\n\n![鼠标悬停在规则上会在每个声明旁边显示选择框的截图](img/9781394164684-fg030409.png)\n\
  \n图 4-9: 鼠标悬停在规则上会在每个声明旁边显示选择框。\n\n3.  **取消勾选你想禁用的声明的选择框。**\n    当你准备好再次启用该声明时，重复步骤\
  \ 1 和 2，然后勾选选择框。\n\n### 为元素添加内联声明\n\n与其像我在上一节描述的那样禁用一个现有声明，你的 CSS 调试任务可能还需要你向元素添加一个新声明。幸运的是，与禁用声明一样，你不需要修改现有的\
  \ CSS 来添加声明，因为你可以在 Web 开发工具的便利范围内完成此任务。\n\n\n\n\n\n以下是添加声明需要遵循的步骤：\n\n1. **在浏览器开发工具的\
  \ Elements（元素）选项卡中，点击你想要修改的元素。**\n\n2. **在 Styles（样式）子标签页上，点击 `element.style` 规则（它位于样式列表的顶部，紧接在\
  \ Filter（过滤器）框下方）。**\n\n   浏览器会创建一个空的 CSS 声明，并将光标置在属性字段中，紧挨冒号（`:`）之前。\n\n3. **开始输入你想要使用的\
  \ CSS 属性。在匹配你输入内容的属性列表中，当该属性出现时点击该属性；然后按 Tab 键。**\n\n   浏览器会将光标移动到空值字段。\n\n4. **要么输入你想要使用的属性值，要么从出现的列表（如果有）中选择该值。**\n\
  \n   浏览器会在元素的标签上添加一个新的内联声明，并使用新的属性值更新已渲染的元素，如图 4-10 所示。\n\n### 向检检查器样式表中添加元素声明\n\
  \n如图 4-10 所示，浏览器会在元素的标签上添加一个 `style` 属性。这没有问题，但内联样式会产生大量的权重（CSS 意义上的；更多信息请参阅“打开引擎盖：样式是如何应用的””），这可能无法让你准确地了解情况。一种更好的方法——即产生权重较少的方法——是将新规则添加到名为\
  \ `inspector stylesheet`（检检查器样式表）的特殊样式表中。这是一组浏览器仅在你检查元素时使用的临时样式。你向检检查器样式表添加的任何规则都将覆盖你自己的规则，这正是你所需要的。\n\
  \n![向元素添加新声明的截图。](img/9781394164684-fg030410.png)\n\n图 4-10： 你可以为元素添加新声明。\n\n以下是向检查器样式表中添加新规则需要遵循的步骤：\n\
  \n1. **在浏览器开发工具的 Elements（元素）选项卡中，点击你想要修改的元素。**\n\n2. ![image](img/9781394164684-ma011.png)\
  \ **在 Styles（样式）子标签页工具栏上，点击 New Style Rule（新建样式规则）图标（如图所示）。**\n\n   浏览器将使用优先级最高的元素选择器启动新规则。它还会打开用于编辑的选择器字段。\n\
  \n3. **根据需要修改规则的选择器；然后按 Tab 键。**\n\n   浏览器会创建一个空的 CSS 声明，并将光标置在属性字段中，紧挨冒号（`:`）之前。\n\
  \n4. **开始输入你想要使用的 CSS 属性。在匹配你输入内容的属性列表中，当该属性出现时点击该属性；然后按 Tab 键。**\n\n   浏览器会将光标移动到空值字段。\n\
  \n5. **要么输入你想要使用的属性值，要么从出现的列表（如果有）中选择该值。**\n\n   浏览器会将新规则添加到检检查器样式表中，并使用新声明更新已渲染的元素，如图\
  \ 4-11 所示。\n\n![向检查器样式表添加新规则的截图。](img/9781394164684-fg030411.png)\n\n图 4-11： 你可以向检查器样式表添加新规则。\n\
  \n![提示](img/tip.png) 你可以通过点击新规则右侧出现的 `inspector-stylesheet` 链接来编辑检查器样式表。打开检查器样式表进行编辑后，可以根据任何喜欢的选择器随意添加新规则。这包括添加新的类规则，然后你可以像我在下一节描述的那样将它们添加到元素中。\n\
  \n### 为元素添加类\n\n在调试顽固元素时，另一个有用的“假设”问题是：“如果给那个元素应用一个类会怎样？”也就是说，如果某个类已经在你的 CSS 某处定义，那么将该类添加到元素中——即将类名插入标签的\
  \ `class` 属性中——是否能解决问题？问得好！\n\n要向元素添加已有的类——即使用该类作为选择器的规则，该规则可能位于你自己的 CSS、第三方 CSS\
  \ 文件或检查器样式表中——请遵循以下步骤：\n\n1. **在浏览器开发工具的 Elements（元素）选项卡中，点击你想要修改的元素。**\n\n2. **在\
  \ Styles（样式）子标签页工具栏上，点击 `.cls` 按钮。**\n\n   浏览器会显示 Add New Class（添加新类）文本框。\n\n3.\
  \ **输入类的名称然后按 Enter 或回车键。**\n\n   如图 4-12 所示，浏览器会在元素上添加 `class` 属性（如果该属性不存在），并将类名作为值添加。浏览器还在\
  \ Styles 子标签页中为该类添加一个复选框，允许你快速禁用和启用该类。\n\n![为元素添加类的截图。](img/9781394164684-fg030412.png)\n\
  \n图 4-12： 你可以为元素添加类。\n\n### 模拟类状态\n\n在调试顽固元素时，另一个有用的“假设”问题是：“如果给那个元素应用一个类会怎样？”也就是说，如果某个类已经在你的\
  \ CSS 某处定义，那么将该类添加到元素中——即将类名插入标签的 `class` 属性中——是否能解决问题？问得好！\n\n要向元素添加已有的类——即使用该类作为选择器的规则，该规则可能位于你自己的\
  \ CSS、第三方 CSS 文件或检查器样式表中——请遵循以下步骤：\n\n1. **在浏览器开发工具的 Elements（元素）选项卡中，点击你想要修改的元素。**\n\
  \n2. **在 Styles（样式）子标签页工具栏上，点击 `.cls` 按钮。**\n\n   浏览器会显示 Add New Class（添加新类）文本框。\n\
  \n3. **输入类的名称然后按 Enter 或回车键。**\n\n   如图 4-12 所示，浏览器会在元素上添加 `class` 属性（如果该属性不存在），并将类名作为值添加。浏览器还在\
  \ Styles 子标签页中为该类添加一个复选框，允许你快速禁用和启用该类。\n\n### 模拟伪类状态\n\n在第 3 章第 3 ](#c13.xhtml)中讨论了伪类以及它们有多么用。许多伪类处理用户行为，例如用户将指针悬停在元素上、将焦点留在元素上或点击。\n\
  \n你在调试 CSS 时可能会遇到一个困惑：伪类规则没有显示在 Styles 面板中。如果你想尝试新的或修改后的值怎么办？别担心，调试员，因为你的开发工具提供了一个功能，允许你快速启用或禁用元素状态。\n\
  \n点击你想操作的元素。（例如，如果你正在跟随 `03ch04/example02.html`，点击 `nav` 元素内的任何 `a` 元素）。然后，在 Styles\
  \ 工具栏上点击 `:hov` 按钮。浏览器会显示如图 4-13 所示的复选框集合。每个复选框对应一个伪类：`:active`、`:hover`、`:focus`\
  \ 等。为了模拟特定的状态并显示使用该伪类作为选择器的任何规则，请选择复选框。取消选择复选框以禁用元素状态。\n\n![模拟 :active 和 :hover\
  \ 状态的截图。](img/9781394164684-fg030413.png)\n\n图 4-13： 你可以模拟。\n\n### 解析继承\n\n如果父元素使用属性/值声明设置样式，在许多情况下，其子元素和后代元素也将使用相同的属性和值设置。例如，考虑以下规则：\n\
  \n```css\nsection {\n  color: navy;\n}\n```\n\n该规则将 `section` 文本样式为 `navy` 蓝色（参阅第\
  \ 3 章第 6 章](#c16.xhtml）了解 CSS 中的颜色）。现在考虑以下 HTML：\n\n```html\n<section>\n  <p>\n\
  \    我是什么颜色？\n  </p>\n</section>\n```\n\n`p` 元素是 `section` 元素的元素，因此 `p` 元素继承了 `section`\
  \ 元素的 `color` 属性值，这意味着 `p` 元素的文本将是 `navy` 蓝色。\n\n这种样式传播在 CSS 游戏中被称为 `inheritance:`（继承）。父元素会将其某些属性传递给它们的子元素和后代。请注意，我说的是“某些”属性是可以继承的。许多属性——例如我在第\
  \ 3 章第 1 章](#c11.xhtml)中涵盖的内边距、边框和外边距——不会被继承的。\n\n\n\n\n\n![Tip](img/tip.png) 为了让你直观了解哪些属性继承而哪些不继承，请查看后续\
  \ W3C 页面上的表格：[`https://www.w3.org/TR/CSS2/propidx.html`](https://www.w3.org/TR/CSS2/propidx.html)。对于每个属性，`Inherited?`\
  \ 列会显示 `yes`（表示该属性继承）或 `no`（该属性不继承）。（这个列表有点过时了，但我找不到提供相同信息的更新版本。）\n\n## 为什么某些属性不继承\n\
  \n为什么某些属性不继承？通常是因为如果继承，结果将是灾难性的。例如，考虑以下代码（查看 `bk03ch04/example03.html`）：\n\nHTML:\n\
  ```html\n<section>\n<p>\n如果 <code>border` 属性继承了会怎样？\n</p>\n</section>\n```\n\nCSS:\n\
  ```css\nsection {\n  border: 3px solid black;\n}\n```\n\n在这里我们有一个设置了边框的 `section`\
  \ 元素，一个作为 `section` 子元素的 `p` 元素，以及一个作为 `p` 子元素的 `code` 元素。`border` 属性不会继承，但如果它继承，这段代码的渲染结果如图\
  \ 4-14 所示。那是一团糟！\n\n![（瑟抖）边框属性继承的截图](img/9781394164684-fg030414.png)\n\n图 4-14：\
  \ 如果（瑟抖）`border` 属性继承了。\n\n## 强制继承\n\n通过继承，属性会从一种元素传递给下一代元素。这通常是你想要的，但并不总是如此。例如，考虑以下代码（`bk03ch04/example04.html`）：\n\
  \nHTML:\n```html\n<section>\n<h3>关于海豚的一切</h3>\n<p>\n欢迎来到关于海豚的一切！\n</p>\n<aside>\n\
  <h3>你知道吗？</h3>\n<p>\n海豚可以睁着一只眼睛睡觉，以防范掠食者。\n</p>\n</aside>\n</section>\n```\n\nCSS:\n\
  ```css\nsection {\n  color: navy;\n}\nh3 {\n  color: green;\n}\n```\n\n`section`\
  \ 规则将所有文本设为 `navy`，而 `h3` 规则将 `h3` 文本设为 `green`。但是，如果你希望 `aside` 元素内部的 `h3` 元素的文本不是绿色，而是采用\
  \ `section` 规则定义的颜色怎么办？换句话说，你如何强制任何作为 `aside` 子元素的 `h3` 继承其文本颜色呢？这就是 `inherit` 属性值的工作。通常情况下，当你将属性值设置为\
  \ `inherit` 时，它会强制选择器从设置该属性的父元素或祖先元素继承该属性。这里有一条规则允许任何作为 `aside` 子元素的 `h3` 继承其文本颜色：\n\
  \n```css\naside > h3 {\n  color: inherit;\n}\n```\n\n## 顺着级联流动\n\n对于那些可以从父元素传递给子元素再传递给后代元素的属性，这种传播就是我在上一节中提到的继承。继承看起来可能很直观，但浏览器实际上使用了一套相当复杂的算法来决定如何应用继承属性。该算法在\
  \ CSS 领域被称为*级联*（*cascade*）。没错，这就是*级联样式表*（cascading stylesheets）名称中“级联”一部分的来源。）\n\
  \n为了帮助你理解级联需要解决的难题，请查看这段代码：\n\nHTML:\n```html\n<section>\n<p style=\"color: salmon\"\
  >\n我是什么颜色？\n</p>\n</section>\n```\n\nCSS:\n```css\nsection {\n  color: navy;\n}\n\
  ```\n\n`section` 规则将文本样式设为 `navy`，这通常会传播到 `p` 元素，因为 `color` 属性是可以继承的。然而，`<p>` 标签有一个\
  \ `style` 属性，将 `color` 属性设置为 `salmon`。当浏览器渲染 `p` 元素时，它将使用什么颜色？\n\n在回答这个问题之前，你需要了解更多关于浏览器如何执行其继承职责的内容。\n\
  \n### 级联是如何工作的\n\n级联的核心是一种用于属性声明的排序算法。对于页面中的每个元素（或伪元素），级联首先遍历页面的所有 CSS 源，查找所有选择器匹配该元素的属性声明。\n\
  \n如果给定的属性声明对于该元素只出现一次，那么级联就会将该声明应用到元素上，无需疑问。然而，通常的情况是，特定属性对于同一个元素有多个声明，且这些已声明的属性值中有两个或多个是不同的。当一个元素属性有多个可能的适用值时，算法必须确定使用这些声明中的哪一个。为了决定应用哪个声明，级联为每个声明分配一个*权重*——这本质上是相关性的衡量标准——并使用权重最大的声明来样式化元素。\n\
  \n\n\n\n\n| 3 | 作者样式表：内部或外部 | 正常 |\n| 4 | 作者样式表：内联 | 正常 |\n| 5 | 作者样式表：内部或外部 | 强制\
  \ |\n| 6 | 作者样式表：内联 | 强制 |\n| 7 | 用户样式表 | 强制 |\n| 8 | 用户代理样式表 | 强制 |\n\n表 4-1 声明类型/源类型权重层级\n\
  \n例如，在任何作者样式表中的，一个普通属性声明（权重排名在表 4-1 中为 3 或 4）始终会覆盖用户代理样式表中的相同普通属性声明（权重排名在表 4-1 中为\
  \ 1），因为作者样式表被赋予了更高的权重。同样，一个内联普通属性声明（权重排名 4）会覆盖外部或内部样式表中相同的普通属性声明（权重排名 3），因为内联样式被赋予了更高的权重。\n\
  \n权重排名允许你回答以下代码提出的问题：\n\n```html\n<section>\n  <p style=\"color: salmon\">\n   \
  \ 我是什么颜色？\n  </p>\n</section>\n```\n\n```css\nsection {\n  color: navy;\n}\n```\n\
  \n`p` 元素的文本颜色将是三文鱼，因为内联声明 `color: salmon` 的权重比 `color: navy` 声明高。\n\n关于源类型、声明类型和权重的最后一点，请注意表\
  \ 4-1 中的强制声明类型本质上反转了普通声明类型的权重排名。也就是说，当在声明上添加了 `!important` 注解时，用户样式表源被赋予的权重高于作者样式表源，而用户代理样式表源被赋予了最高权重。\n\
  \n![技术细节](img/technicalstuff.png) 表 4-1 是不完整的，因为 CSS 标准定义了另外两种源类型。第一个涉及与 CSS 过渡相关的声明（参见附录章节\
  \ 2），它们拥有所有类型最大的权重；第二个涉及 CSS 动画声明（参见附录章节 3），它们的排名比普通内联作者样式表声明高一个等级。你可以在[`www.dummies.com/go/htmlcss&javascriptaiofd`](http://www.dummies.com/go/htmlcss&javascriptaiofd)\
  \ 下载这些附录章节。\n\n### 理解确定性\n\n当两个或多个具有相同声明类型和相同源类型的属性声明指向同一个元素时会发生什么？这些声明在表 4-1 中具有相同的权重排名，因此你必须转向级联的下一个决胜机制：*确定性（specificity）。*\n\
  \n确定性是一种用于区分两种选择器的评分：\n\n*   **宽泛 (Broad)：** 针对大范围元素的选择器。例如，以下规则针对页面 `body` 中的每一个元素：\n\
  \n    ```css\n    body {\n      color: slateblue;\n    }\n    ```\n\n*   **狭窄 (Narrow)：**\
  \ 针对小范围元素的选择器。例如，以下规则仅针对 `id` 值为 `subtitle` 的元素：\n\n    ```css\n    #subtitle {\n\
  \      color: dodgerblue;\n    }\n    ```\n\n为了理解为什么这种宽泛和狭窄选择器的区分很重要，请想象一个拥挤的讲堂，舞台上有四位小组员面对观众。想象每位小组员都想吸引人群中同一个人的注意力。以下是每位小组员可能使用的一些策略：\n\
  \n| 小组员动作 | 最可能的结果 |\n| --- | --- |\n| 小组员 A 大喊“嘿！” | 小组员 A 吸引了许多人的注意力。 |\n| 小组员\
  \ B 说“喂！”并看向人的大体方向。 | 小组员 B 吸引了其视线范围内几个人的注意力。 |\n| 小组员 C 喊出那个人的名字。 | 除非那个人的名字在观众中是唯一的，否则小组员\
  \ C 吸引了其他所有同名者的注意力。 |\n| 小组员 D 喊出人的姓名并指向他。 | 小组员 D 吸引了那个人的注意力。 |\n\n在某种意义上，这些小组员正在竞争那个人的注意力，他们的策略从宽泛（小组员\
  \ A）到狭窄（小组员 D）。在这个类比中，每种策略就像一条 CSS 规则，其中小组员的动作是选择器，而人群中的人是目标页面元素。\n\n对你这里的用途最关键的是一个\
  \ CSS 概念，称为*确定性（specificity），它是衡量一个特定选择器是宽泛、狭窄还是介于两者之间的标准。也就是说，针对宽泛元素的选择器被认为具有*低确定性*，而针对狭窄元素的选择器被认为具有*高确定性*。\n\
  \n核心思想是，从级联的角度来看，选择器针对元素越狭窄，CSS 开发者意图让该规则应用于该元素的概率就越大。因此，选择器越具体，它的确定性得分越高，级联赋予选择器声明块的权重就越大。\n\
  \n（让我在这里强调，以上是从*级联*的角度来看的……根据指令省略了后续文本）\n\n\n\n\n\n![Tip](img/tip.png) 将特性权重视为数字通常很有帮助，例如将\
  \ 1-2-4 视为 124，将 0-3-2 视为 32。在这个例子中，数字 124 明显高于数字 32，因此 1-2-4 具有更高的特性。然而，这是一个略微危险的做法，因为至少在理论上，某个桶的分可能达到\
  \ 10 或更高，因此类似 1-14-3 这样的特性并没有对应的数值等。\n\n为了帮助你熟悉将选择器转换为特性权重的方法，下表提供了几个示例。\n\n| 选择器\
  \ | I 桶 (ID) | C 桶 (Class) | E 桶 (Element) | 特性 (I-C-E) |\n| --- | --- | --- | ---\
  \ | --- |\n| `#title` | `#title` | | | 1-0-0 |\n| `#title > h2` | `#title` | | `h2`\
  \ | 1-0-1 |\n| `.warning` | | `.warning` | | 0-1-0 |\n| `section` | | | `section`\
  \ | 0-0-1 |\n| `header > nav > a:hover` | | `:hover` | `header`, `nav`, `a` | 0-1-3\
  \ |\n| `p.intro + aside` | | `.intro` | `p`, `aside` | 0-1-2 |\n| `footer > div.social::before`\
  \ | | `.social` | `footer`, `div`, `::before` | 0-1-3 |\n| `#nav-header li.external\
  \ > span` | `#nav` | `.external` | `p`, `li`, `span` | 1-1-3 |\n\n在实践中，你可以利用特性权重找出为什么某个元素的样式看起来不正确的。。很多时候，问题在于浏览器应用了另一个具有更高特性权重选择器的样式规则。\n\
  \n![Remember](img/remember.png) 通用选择器 `*` 的特性权重值为 0，因此在计算特性权重时可以忽略它。\n\n![Remember](img/remember.png)\
  \ 如果你配合 `list` 参数使用 `:nth-child()` 或 `:nth-last-child()` 伪元素，伪类本身的特性权重为 0-1-0，加上\
  \ `list` 中选择器的最高特性权重。例如，如果 `list` 只包含类型选择器，则权重为 0-0-1，因此该元素的总权重为 0-1-1。\n\n![Tip](img/tip.png)\
  \ 与其自己计算特性权重，不如让几个在线计算器之一为你处理这项繁杂工作。这里有一个好用的：[`https://polypane.app/css-specificity-calculator/`](https://polypane.app/css-specificity-calculator/)。\n\
  \n### 特性权重与 :is(), :where(), :not(), 和 :has()\n\n特性权重可以说是所有 CSS 中最令人困惑的话题，所以如果现在感觉有点模糊也不要担心。只需坚持用\
  \ ICE 桶思维，尽可能经常计算选择器的特性权重，最终你都会理解的。\n\n当然，我即将要在特性权重计算中增加另一个复杂因素，这对比解决问题完全没有帮助！我说的是函数伪类：`:is()`、`:where()`、`:not()`\
  \ 和 `:has()`。由于这些是伪类，在为选择器计算 I-C-E 权重时，你可能会想将它们加入 C 桶。这是一个非常合理的假设，但并不是正确的。以下是将函数伪类计入你的特性权重分值的方法：\n\
  \n*   `:is()`、`:where()`、`:not()` 和 `:has()` 伪类本身不会为特性权重增加任何值。\n*   `:is()`、`:not()`\
  \ 和 `:has()` 伪类的特性权重由其各自选择器列表中选择器的最高特性权重分决定。\n*   `:where()` 伪类的特性权重始终为 0，无论其选择器列表中包含哪些选择器。\n\
  \n`:is()`、`:not()` 和 `:has()` 伪类的特性权重有点让人费解，所以这里有一个详细说明。假设你有如下选择器：\n\n```\nis(#subtitle,\
  \ nav:first-child, h1.title > h2)\n```\n\n在选择器列表中有三个选择器，从左到右它们的 ICE 特性权重分别为 1-0-0、0-1-1\
  \ 和 0-1-2。其中第一个 (1-0-0) 是最高的，因此该这就是应用于整个 `:is()` 选择器的权重。\n\n### 终极平局判定者：源代码顺序\n\n\
  如果两个或多个属性声明具有相同的声明类型、相同的源权重排名以及相同的选择器特性权重，级联（cascade）还有最后一个平局策略可以回退：源代码顺序。也就是说，在给定多个等权重属性声明的情况下，出现在源代码中最后的声明被宣布为获胜者。\n\
  \n为了清楚起见（因为这个平局判定者对于理解级联的工作原理以及解决级联问题至关重要），我所说的源代码中的“最后”是指：\n\n*   如果所有声明都位于同一个内部或外部样式表中，“最后”意味着靠近样式表底部的声明。考虑以下代码：\n\
  \n```\np {\n  color: darkorchid;\n}\ndiv, aside {\n  color: indigo;\n}\n```\n\n\
  *   如果声明位于不同的外部样式表中，“最后”意味着靠近 HTML 样式表底部的声明。考虑以下内容：\n\n```html\n<head>\n  <meta\
  \ charset=\"utf-8\">\n  <title>Specificity?</title>\n  <link rel=\"stylesheet\"\
  \ href=\"yourstyles.css\">\n  <link rel=\"stylesheet\" href=\"mystyles.css\">\n\
  </head>\n```\n\n\n\n\n\n![Bullet](img/check.png) 弄懂视口测量到底是怎么回事\n\n![Bullet](img/check.png)\
  \ 如何使用 CSS 进行计算\n\n*测量可测量的量，使不可测量的量变得可测量。*\n\n— 伽利略·伽利莱\n\n由于与设计关系紧密，CSS 感觉非常像 Web\
  \ 开发中的艺术部分。而且，CSS 确实提供了许多方法让你的右脑得到很好的锻炼：颜色、背景和渐变（参见第 3 本，第 6 章）；字体、对齐和其他排版细节（第 3\
  \ 本，第 7 章）；花哨页面布局（第 5 本）；以及令人惊目、嘴角上扬的动画（附录 1-3 章，可在 [`www.dummies.com/go/htmlcss&javascriptaiofd`](http://www.dummies.com/go/htmlcss&javascriptaiofd)\
  \ 下载）。\n\n但 CSS 也有一个比艺术家更让工程师感到欣慰的一面。这是 CSS 中涉及测量东西的部分：那个按钮应该用什么尺寸？`aside` 元素周围的边框多厚看起来最好？页面文本的正确字体大小是多少？页面段落之间想要留多少空间？\n\
  \n这些问题可能看起来无关紧要，甚至微不足道，但准确获取这些以及许多其他测量是页面设计过程的重要部分，也是创建外观良好且运行良好的网页的关键因素之一。\n\n\
  在本章中，你将替换艺术家的贝雷帽，戴上工程师的安全帽，进入 CSS 测量单位的世界。幸运的是，尽管 CSS 似乎支持无限数量的单位，但你将在本章了解到，对于日常\
  \ CSS 需求，你只需要熟悉几个单位。\n\n## 熟悉 CSS 测量单位\n\n许多 CSS 属性需要一个某种类型的测量值。例如，边框需要一个长度值来决定该边框的宽度。同样，块元素可以接受一个维度值来设置该块的宽度或高度。诸如长度或维度等值被称为测量值，它们不仅对盒模型组件（如内边距、边框、外边距、宽度和高度）至关重要，对于许多其他\
  \ CSS 特性也是如此，包括字体大小、投影宽度行间。\n\n几乎每个测量值都需要一个测量单位，这是一个指定你希望浏览器应用到测量值的单位的短代码。（我在上一句开头加了“几乎”，是因为某些属性——例如\
  \ `line-height`；参见第 3 本，第 7 章——会接受不带单位的值。）到目前为止，我一直在讨论以像素表示的测量值，它们由 `px` 单位指定：\n\
  \n```\nfooter {\nmax-height: 200px;\nmax-width: 150px;\n}\n```\n\n然而，CSS 还提供了许多其他的测量单位。其中大多数是极其晦涩或小众的，因此在接下来的几个章节中，我会告诉你需要知道哪些测量值。\n\
  \n## 检查绝对测量单位\n\n绝对测量单位具有固定尺寸的单位。例如，`px`（像素）单位被定义为 1/96 英寸。一些 Web 设计师偏于绝对测量，因为他们觉得这让他们对设计有更多控制。然而，正如我接下来解释的，在“了解相对测量单位”部分，许多\
  \ Web 开发者正在放弃绝对测量单位，因为它们太僵化了。\n\n表 5-1 列出了所有的 CSS 绝对测量单位。\n\n| **单位** | **名称** |\
  \ **等于** |\n| --- | --- | --- |\n| `px` | 像素 | 1/96 英寸 |\n| `pt` | 磅 | 1/72 英寸 |\n\
  | `cm` | 厘米 | 37.8px 或约 0.4in |\n| `mm` | 毫米 | 1/10 厘米；约 3.8px |\n| `Q` | 分之一毫米\
  \ | 1/40 厘米；约 1px |\n| `in` | 英寸 | 96px；约 2.54cm |\n| `pc` | 亚磅 | 1/6 英寸；16px |\n\
  \n表 5-1 CSS 绝对测量单位\n\n在这些单位中，`px` 远是最常运行的，少数设计师在编写将要打印的文档的 CSS 时偶尔会使用 `pt` 和 `cm`。如果你打算使用绝对测量，并且只为显示在屏幕上的文档编写\
  \ CSS，请坚持使用 `px`。\n\n我的建议：\n\n* 对于非常小的长度可以使用 `px`，例如那些用于大多数边框和轮廓的长度，因为这些宽度使用绝对值是有意义的。\n\
  * 不要其他任何地方使用 `px`（或任何绝对测量单位）。\n* 永远、永远不要在字体大小上使用 `px`。为什么？因为这会让你的网页对于那些需要增大浏览器默认字体的视障人士变得更难以访问。如果他们自定义了默认字体大小，例如\
  \ `32px`，而你在 `html` 中添加了如 `font-size: 12px` 的声明。\n\n## 了解相对单位\n\n相对单位不是具有固定尺寸的单位。相反，它的尺寸取决于——即相对于——其他东西。偶尔这种其他东西是视口的大小，这种情况我推到了以后的章节，“查看视口测量单位](#c15.xhtml_c15-sec-0008)。”在其他情况下，相对单位尺寸的测量方式如\
  \ 5-2。\n\n| **单位** | **名称** | **相对于** |\n| --- | --- | --- |\n| `%` | 百分比 | 元素或祖先元素定义的数量。（具体数量取决于你正在处理的\
  \ CSS 属性。） |\n| `em` | M 宽 | 元素的继承或定义的字体大小。*em* 一词源于印刷字体，当时它指的是大写字母 *M* 的宽度。 |\n\
  | `ex` | x 高 | 元素的 x 高。*x 高* 指的是指定字体中小写字母 *x* 的高度。 |\n| `ch` | 0 宽 | 元素字体中数字 0 的宽度。\
  \ |\n| `rem` | 根 em | 网页根元素的字体大小。 |\n\n 使用百分比\n\n让你的页面元素在不同尺寸的屏幕上良好运行的一种快速方法是将 CSS\
  \ 长度表示为百分比值。百分比效果很好，因为它们通常是相对于元素父元素的相同属性计算的。例如，默认情况下，子块元素占据其父块的整个宽度。如果你想让该子元素只使用父元素的一半宽度，你可以设置如下规则：\n\
  \n```\n.child {\nwidth: 50%;\n}\n```\n\n\n\n\n\n这是一种对屏幕友好的方法，因为当父元素的大小发生变化（例如，用户正在调整浏览器窗口大小或更改屏幕方向），子元素的宽度也会随之变化，以保持那\
  \ 50 百比的比例。\n\n使用百分比时需要注意的一个陷阱是，有时百分比的相对对象并不是你预期的那个。例如，在设置 `padding-top`、`padding-bottom`、`margin-top`\
  \ 或 `margin-bottom` 时，你可能会认为这些垂直间距值是相对于父容器的高度。事实并非如此。它们实际上是相对于父元素的 `width` 计算的，如果你在声明中没有考虑到这一点，可能会导致一些意料之外的行为。\n\
  \n### 掌握 em 单位\n\n要理解 `em` 测量单位，你首先需要知道 CSS 使用 `font-size` 属性来设置元素的字体大小。这里有一个一个示例：\n\
  \n```css\narticle {\n  font-size: 24px;\n}\n```\n\n![Remember](img/remember.png)\
  \ (在这里使用了绝对值，这是一种糟糕的 CSS 实践，正如我在本章早些在“检查绝对测量单位”节中所解释的那样。)\n\n其次，你还需要记住 `font-size`\
  \ 是一个继承属性，所以除非另有指定，否则子元素始终使用与其父元素相同的 `font-size` 值。\n\n在完成这些准备工作后，我可以告诉你，`em` 单位的值相对于你正在处理的任何元素的计算出的字体大小。（这就是为什么\
  \ `em` 被描述为一种“字体相对”（`font-relative`）单位。）在这里，*计算出的*意味着级联算法（参见第 3 本，第 4 章）在计算了各种 CSS\
  \ 源类型（用户代理样式表、用户样式表和作者样式表）中针对该元素的选择器的所有 `font-size` 属性声明权重后，最终应用的字体大小。\n\n该计算出的字体大小将是以下值之一：\n\
  \n*   **元素继承的字体大小：** 继承的字体大小是具有 `font-size` 声明的最近祖先元素上定义的 `font-size` 属性值。如果没有祖先元素具有\
  \ `font-size` 声明，则继承的字体大小将是默认字体大小。（也就是说，即 Web 浏览器指定的默认大小或用户设置的自定义默认大小。）\n\n*   **在元素上定义的字体大小：**\
  \ 定义的字体大小是直接针对元素的 `font-size` 声明的值。\n\n那么，`em` 单位使用的是这些计算出的字体大小中的哪一个呢？为了让我们所有人彻底困惑，这取决于你正在处理哪种\
  \ CSS 属性！幸运的是，只有两种可能：\n\n*   如果你正在处理元素的 `font-size` 属性（以及其他几个与字体相关的属性，如 `text-indent`），则\
  \ `em` 单位相对于元素继承的字体大小。在这种情况下，你可以将 `em` 单位解释为“该元素父元素的 `font-size` 值”。\n\n*   如果你正在处理任何其他属性（如\
  \ `width`、`margin` 或 `padding`），则 `em` 单位相对于元素定义的字体大小。在这种情况下，你可以将 `em` 单位解释为“该元素的\
  \ `font-size` 值”。\n\n在理论上，这些可能性是有意义的。例如，如果你想让某些子元素使用比其父元素略小的字体大小，你可以设置一条如下的规则：\n\
  \n```css\nchild {\n  font-size: 0.75em;\n}\n```\n\n同样，`width` 和 `padding` 等属性随元素的字体大小一起放大或缩小也是合乎逻辑的。\n\
  \n但在实践中，`em` 单位可能极其复杂。例如，假设你有一个 `section` 元素，并希望它的文本比默认文本稍微大一点。你想“1.25em 应该可以了”。现在，假设你的代码看起来所示（在本书的示例文件中，请查看\
  \ `bk03ch05/example01.html`）：\n\nHTML:\n\n```html\n<body>\n  <main>\n    <article>\n\
  \      <section>\n        What font size am I?\n      </section>\n    </article>\n\
  \  </main>\n</body>\n```\n\nCSS:\n\n```css\narticle {\n  font-size: 1.5em;\n}\n\
  section {\n  font-size: 1.25em;\n}\n```\n\n`section` 元素中的文本使用了什么种字体大小？这是一个两步计算：\n\
  \n1.  **计算 `section` 元素的父元素（即 `article` 元素）的字体大小。**\n\n    假设 `article` 元素继承了 `16px`\
  \ 的默认字体大小，则 `em` 单位将相对于该默认值，因此是 `article` 在应用 `font-size` 声明后使用的字体大小：\n\n    * \
  \  1.5em = `1.5 * 16px` = 24px\n\n2.  **计算 `section` 元素本身的字体大小。**\n\n    `em` 单位将相对于父元素\
  \ `article` 元素的字体大小，即步骤 1 中的 `24px`。因此，这里是 `section` 在应用 `font-size` 声明后使用的字体大小：\n\
  \n    *   1.25em = `1.25 * 24px` = 30px\n\n惊讶的是，`section` 元素中的文本不仅比默认的 `16px` 文本大，而且几乎是两倍。欢迎来到\
  \ `em` 单位的世界！\n\n同样注意，我这里的示例假设只设置了父元素 `article` 的 `font-size` 属性。想象一下如果祖先元素 `main`\
  \ 和 `body` 上也有基于 `em` 的 `font-size` 声明。现在你的计算必须考虑到四级继承！在处理 `em` 单位时，情况可能会变得非常糟糕。\n\
  \n`em` 单位让你惊讶的另一种方式是当你将其用于 `font-size` 以外的属性时。考虑以下代码（查看 `bk03ch05/example02.html`）：\n\
  \nHTML:\n\n```html\n<article>\n  <section>\n    How wide am I?\n  </section>\n</article>\n\
  ```\n\nCSS:\n\n```css\narticle {\n  font-size: 1.5em;\n  width: 600px;\n}\nsection\
  \ {\n  font-size: 1.25em;\n  width: 25em;\n}\n```\n\n`section` 元素有多宽？对于 `width`\
  \ 属性，`em` 单位相对于元素的字体大小，根据前面的计算结果为 `30px`。因此，这里是决定 `width` 的计算：\n\n`25em = 25 * 30px`\
  \ = 750px\n\n子元素现在比其父元素宽得多！\n\n那么，我们应该在 CSS 代码中避免使用 `em` 单位吗？正如你所学的，`em` 可能会非常波动且难以捉摸，因为计算值受到多个层次继承的影响。然而，你通常可以利用继承为你服务。例如，经常某个子元素的字体大小随父元素的变化而改变。为了实现这一点，你可以这样做：\n\
  \n*   使用不会产生叠加的单位设置父字体大小，例如下一节讨论的 `rem` 单位。\n\n*   使用 `em` 设置子字体大小。这样，当父元素字体大小变化时，子字体大小也会随之变化，但是完全可预测的。\n\
  \n也就是说，最好在页面的局部组件中使用 `em` 单位。\n\n### 认识你的 CSS 测量好友：rem 单位\n\n当你改用 `rem` 单位时，`em`\
  \ 单位所有复杂的数学运算都消失了。为什么？因为虽然 `rem` 单位也是相对于字体，但 `rem` 的值只相对于一个事物：`html` 元素的根元素的字体大小。根字体大小可以是以下值之一（按权重排序）：\n\
  \n*   Web 浏览器指定的默认字体大小。在所有现代浏览器中，该默认大小均为 `16px`。\n\n*   用户通过 浏览器设置修改的自定义字体大小。例如，如果用户将\
  \ Chrome 的字体大小设置改为 `24px`，如图 5-1 所示，根字体大小变为 `24px`。\n\n*   你的 CSS 代码在 `html` 元素上设置的\
  \ `font-size` 值。\n\n\n\n\n你为 `html` 元素定义的 `font-size` 值将优先于用户设置的任何自定义值，因此符合访问友好的做法是不在\
  \ `html` 元素中包含 `font-size` 声明，或者像现在的做法一样，将 `font-size` 设置为 `100%`，以确保你是从用户的偏好尺寸开始的：\n\
  \n```css\nhtml {\nfont-size: 100%;\n}\n```\n\n![用户可以（而且经常）在网页浏览器设置修改默认字体大小的截图](img/9781394164684-fg030501.png)\n\
  \n图 5-1: 用户可以（而且经常）修改网页浏览器设置中的默认字体大小。\n\n为了演示 `em` 和 `rem` 之间的区别，这里是我之前使用的相同代码，只是我在\
  \ `font-size` 声明中将 `em` 单位替换成了 `rem` 单位 (bk03ch05/example03.html)：\n\nHTML:\n\n\
  ```html\n<body>\n<main>\n<article>\n<section>\n我的字体大小有多大？\n</section>\n</article>\n\
  </main>\n</body>\n```\n\nCSS:\n\n```css\narticle {\nfont-size: 1.5rem;\n}\nsection\
  \ {\nfont-size: 1.25rem;\n}\n```\n\n现在 `section` 元素中的文字使用什么多大的字体？假设默认字体大小为 `16px`，则不需要复杂的计算：\n\
  \n`1.25rem = 1.25 * 16px = 20px`\n\n无论哪个元素声明了 `font-size: 1.25rem;`，无论该元素的父元素或祖先元素使用多大的字体（当然，最终祖元素\
  \ `html` 元素除外），计算都是都是。\n\n如果用户将默认字体大小设置为 `16px` 以外的其他值怎么办？使用 `rem` 单位可以确保你的文本会相应缩放。例如，如果现在的默认字体大小是\
  \ `24px`，计算变为：\n\n`1.25rem = 1.25 * 24px = 30px`\n\n这种缩放不仅适用于 `font-size` 属性，还适用于任何使用长度度量的属性，例如外边距。例如，如果默认字体大小为\
  \ `24px`，以下代码意味着 `aside` 元素的外边距也将为 `24px`：\n\n```css\naside {\nmargin: 1rem;\n}\n\
  ```\n\n那么，这是否意味着你应该始终使用 `rem` 单位？不一定。以下是我的建议：\n\n- 除了 `html` 元素（你应该在其中声明 `font-size:\
  \ 100%`），对所有其他字体大小都使用 `rem` 单位。\n- 对于所有在页面上创建留白的属性（如 `margin` 和 `padding`），请使用 `rem`。这样做会让你的页面在范围内看起来一致。\n\
  - 假设用户会更改默认字体大小并据此计划，这意味着要做两件事：\n    - 如果某个特定的长度测量（例如元素的外边距）随默认字体大小的变化而缩放是有意义的，请使用\
  \ `rem` 单位进行测量。\n    - 如果你不希望特定的长度测量随默认字体大小缩放，请使用任何非字体相关的单位（如 `px`、`%` 或我在下一节中讨论的视口单位之一）进行测量。\n\
  - 如果你希望子元素中使用字体值的属性随父元素字体大小的变化而缩放，请对子属性使用 `em` 单位。然后，为了减少由于继承引起的复合影响，请使用 `rem` 单位声明父元素的字体大小。\n\
  \n## 来看视口（视口测量单位）\n\n从 CSS 的角度来看，*视口*（viewport）是由 `html`（根）元素定义的矩形（正式名称为*初始包含块*），根据定义，它延伸了浏览器窗口的全宽度和高度，但减除了浏览器的*框架*（chrome）——即它的用户界面功能，如工具栏、地址栏和书签栏。换句话说，视口是浏览器窗口中显示当前网页可见部分。\n\
  \nCSS 包含了几种所谓的*视口百分比*（viewport-percentage）单位，它们相对于视口的某些维度，如表 5-3 所示。\n\n| 单位 | 名称\
  \ | 相对于……的测量 |\n| --- | --- | --- |\n| `vw` | 视口宽度 | 视口宽的 1/100 |\n| `vh` | 视口高度\
  \ | 视口高的 1/100 |\n| `vmin` | 视口最小 | 视口较小维度的 1/100 |\n| `vmax` | 视口最大 | 视口较大维度的 1/100\
  \ |\n\n表 5-3 CSS 视口测量单位\n\n这是一个示例：\n\n```css\narticle {\nwidth: 75vw;\n}\n```\n\n\
  ### 使用 calc() 计算\n\n`calc()` 函数接收两个或多个字面量值，对这些值执行一次或多次算术操作，然后返回计算结果，最后将其赋值给正在操作的属性。语法如下：\n\
  \n`property`: calc(`expression`);\n\n- `property`: 你想要赋值 `calc()` 结果的 CSS 属性。\n\
  - `expression`: 二或多个测量值（称为表达式的*操作数*），每对值之间插着一个符号（称为*运算符*），用于定义要执行的计算类型：\n    - `operand`:\
  \ 这通常是一个字面量，如 `50px` 或 `10rem`，但也可以是 CSS 变量（参见第 4 章）甚至是另一个 `calc()` 函数。你可以混合测量单位。\n\
  \    - `operator`: `calc()` 函数支持四运算：加法（使用 `+` 运算符）、减法（`-`）、乘法（`*`）和除法（`/`）。如果在表达式中使用多个运算符，请注意乘法和除法通常在加法之前执行。你可以通过给操作加上括号来强制\
  \ `calc()` 先执行特定的操作。\n\n这里是带有示例表达式的一些 `calc()` 函数：\n\n```css\ncalc(50vw + 10px)\n\
  calc(100vh - 5rem)\ncalc(10% * 3)\ncalc(100% / 8)\ncalc(100vw - (5rem + 10px))\n\
  ```\n\n在最后一个示例中，`calc()` 首先执行括号内的加法 `5rem + 10px`，然后 `calc()` 执行减法。\n\n![记住](img/remember.png)\
  \ 在 `+` 和 `-` 运算符两边必须有空格。在 `*` 和 `/` 运算符两边有空格是可选的，但为了可读性强烈建议这样做。\n\n\n\n\n\n当你使用百分比时，浏览器会根据你用于声明的任何属性来计算该百分比。例如，假设你有一个\
  \ `article` 元素和一个并排的 `aside` 元素。`aside` 元素的宽度为 `15rem`，你希望 `article` 元素占据剩余的宽度。这里有一个可以实现效果的规则（`bk03ch05/example04.html`）：\n\
  \n```\narticle {\n  width: calc(100% - 15rem);\n}\n```\n\n此计算取 `article` 元素可用宽度的\
  \ `100%`，减去 `15rem`，并将结果设为 `width` 值。\n\n### 使用 min() 寻找最小值\n\n如果你想为属性值设置一个上限，请使用\
  \ `min()` 函数，它接受一个值列表并返回其中最小的一个：\n\n`property`: min(`list`);`\n\n- `property`: 你想要为其分配\
  \ `min()` 结果的 CSS 属性。\n- `list`: 一个用逗号分隔的 CSS 测量值列表，可以包含算术表达式和 `calc()` 函数。\n\n\
  这是一个示例（`bk03ch05/example05.html`）：\n\n```\narticle {\n  width: min(75vw, 1200px);\n\
  }\n```\n\n如果视口宽 `1600px`，`75vw` 将大于 `1200px`，因此 `min()` 返回 `1200px`。如果视口宽度低于 `1600px`，`75vw`\
  \ 将低于 `1200px`，因此 `min()` 返回 `75vw`。换说，这个 `min()` 函数为 `article` 元素的 `width` 属性设置了\
  \ `1200px` 的上限。\n\n### 使用 max() 寻找最大值\n\n如果你想为属性值设置一个下限，请使用 `max()` 函数，它接受一个值列表并返回其中最大的一个：\n\
  \n`property`: max(`list`);`\n\n- `property`: 你想要为其分配 `max()` 结果的 CSS 属性。\n- `list`:\
  \ 一个用逗号分隔的 CSS 测量值列表，可以包含算术表达式和其他 CSS 函数，如 `calc()`。\n\n这是一个示例（`bk03ch05/example06.html`）：\n\
  \n```\narticle {\n  width: max(75vw, 450px);\n}\n```\n\n如果视口宽度小于 `600px`，`75vw`\
  \ 将小于 `450px`，因此 `max()` 返回 `450px`。如果视口宽度超过 `600px`，`75vw` 将大于 `450px`，因此 `max()`\
  \ 返回 `75vw`。换说，这个 `max()` 函数为 `article` 元素的 `width` 属性设置了 `450px` 的下限。\n\n### 使用\
  \ clamp() 设置边界\n\n一个非常常见的网页设计难题是找到一种方法，防止某些动态测量值变得过大或过小。例如，在设置普通页面文本时，行太短会读起来很烦，而行太长则难以跟随。如果你正在样式化例如\
  \ `article` 元素中的文本，并使用 `calc()` 设置 `width` 属性，那么如果有一种方法可以防止 `width` 值变得过小或过大就太好了。请让我以\
  \ `clamp()` 函数的形式为你展示这个难题的解决方案：\n\n`property`: clamp(`min, expression, max`);`\n\
  \n- `property`: 你想要为其分配 `clamp()` 结果的 CSS 属性。\n- `min`: 可以分配给 `property` 的最低值。\n\
  - `expression`: 你想要分配给 `property` 的首选值。它可以是一个字面量、表达式或 CSS 函数，如 `calc()`。\n- `max`:\
  \ 可以分配给 `property` 的最高值。\n\n`clamp()` 背后的思想是浏览器评估 `expression` 参数，然后按如下方式为属性赋值：\n\
  \n- 如果 `expression` 值在 `min` 和 `max` 之间，浏览器使用 `expression` 的结果作为属性值。\n- 如果 `expression`\
  \ 值小于 `min`，浏览器使用 `min` 作为属性值。\n- 如果 `expression` 值大于 `max`，浏览器使用 `max` 作为属性值。\n\
  \n这是一个示例（`bk03ch05/example07.html`）：\n\n```\narticle {\n  width: clamp(450px, calc(100%\
  \ - 15rem), 1200px);\n}\n```\n\n该规则使用 `calc(100% - 15rem)` 来计算 `width`，但设置 `450px`\
  \ 为下限，`1200px` 为上限。\n\n# 第 6 章：用颜色和背景美化页面\n\n本章内容\n- 学习在 CSS 中应用颜色的多种方法\n- 创建既华丽又高级的背景\n\
  - 使用渐变提升你的色彩技巧\n- 发挥边框的最佳魅力\n\n颜色在网络上是免费的……使用不同的颜色不仅为页面增添了戏剧性，还为内容创建了层次感。 — E SPI\
  \ SPIEMANN\n\n我热爱黑白摄影。当一张图像无视世界上所有的红、绿、蓝时，总会有某种引人入胜且优美的感脱颖而出。用这样的调色板展示你的艺术是一个勇敢且充满风险的选择。\n\
  \n然而，我绝对不爱黑白网页！任何只提供白色背景上的黑色文字（或黑色背景上的白色文字）的网站都告诉了我重要的一点：页面设计者并不关心（或太懒了）在网页上放置一些漂亮的东西。因为这正是色彩的作用：它们让网页更漂亮、更生动、更有趣。色彩不仅仅是视觉上的点缀；它们是网页设计不可或缺的一部分。当你学会如何应用颜色后，只需稍作努力，就能将页面从枯燥无力转变为充满色彩和活力的创意侧面表达。\n\
  \n在本章中，你将探索 CSS 颜色的奇妙世界。你将学习指定颜色的各种方法，然后运用这些新学的知识通过颜色来样式化文本。从那里开始，你学习如何设置页面背景颜色或图像、如何创建深受喜爱的渐变、如何设置边框颜色以及如何样式化你的图像。这是一场视觉的盛宴，请尽情投入吧。\n\
  \n## 在 CSS 中指定颜色\n\n在使用默认样式渲染页面时，浏览器对颜色并没有做什么，除了将链接文本显示为默认且熟悉的蓝色之外。但 CSS 提供了大量的属性、关键字和函数，让你能够为页面增添一抹（如果你喜欢，甚至是一股洪流）色彩。\n\
  \n接下来的几节将介绍 CSS 提供的作为属性值指定颜色的主要方法。\n\n### Papayawhip、peachpuff 以及更多：颜色关键字\n\n如果你不是一个色彩发烧者，你可能不想根据分量（红、绿、蓝）来指定颜色值。（如果你是色彩发烧者，别担心：在本节之后我会介绍极客的内容。）CSS\
  \ 提供了一种不能更简单的方法来指定颜色值：颜色关键字。这些是预定义的术语，每个术语都对应一种特定的颜色。\n\nCSS 定义了 140 多个颜色关键字，这足以满足任何只想在网页上增添一点色彩的人。某些关键字是直观且易于理解的，如\
  \ `red`、`yellow` 和 `purple`。另一些则是，嗯，有点奇幻（让人产生食欲）：`lemonchiffon`、`blanchedalmond`\
  \ 和 `mintcream`。我的 WebDev Workshop 列出了它们所有，如图 6-1 所示（访问 [`https://webdevworkshop.io/ck`](https://webdevworkshop.io/ck)）。\n\
  \n![记住](img/remember.png) CSS 颜色关键字是不区分大小写的，因此 `red`、`RED` 甚至 `ReD` 都指向同一种颜色。\n\n\
  ![我的 WebDev Workshop 查看 CSS 颜色完整列表的截图](img/9781394164684-fg030601.png)\n\n图 6-1：\
  \ 在我的 WebDev Workshop 查看 CSS 颜色关键字完整列表。\n\n\n\n\n\n你可能知道，通过混合三种颜色（红、绿、蓝），可以指定彩虹中的几乎任何颜色。以下是一些示例：\n\
  \n- 混合纯红色和纯绿色产生黄色\n- 混合纯绿色和纯蓝色产生青色\n- 混合纯红色和纯蓝色产生洋红色\n- 混合所有三种纯色产生白色\n\n在 CSS 中，你使用\
  \ `0` 到 `255` 之间的数字来表示颜色的“纯度”，其中 `255` 代表强度最高（最纯）的颜色，而 `0` 代表强度最低（最不纯）的颜色。\n\n要通过混合红、绿、蓝来指定任何颜色，你可以使用\
  \ `rgb()` 函数：\n\n```\nrgb(red green blue / alpha)\n```\n\n- `red`: 一个从 `0` 到 `255`\
  \ 之间的数字（或 `0%` 到 `100%` 的百分比），用于指定最终颜色中红色部分的强度。\n- `green`: 一个从 `0` 到 `255` 之间的数字（或\
  \ `0%` 到 `100%` 的百分比），用于指定最终颜色中绿色部分的强度。\n- `blue`: 一个从 `0` 到 `255` 之间的数字（或 `0%`\
  \ 到 `100%` 的百分比），用于指定最终颜色中蓝色部分的强度。\n- `alpha`: 一个从 `0` 到 `1` 之间的数字或 `0%` 到 `100%`\
  \ 的百分比，用于指定*不透明度*，它是衡量颜色不透明程度的指标（`0` 或 `0%` 表示完全透明，`1` 或 `100%` 表示完全不透明）。\n\n![Tip](img/tip.png)\
  \ 与其使用 `0` 或 `0%` 作为 `alpha` 参数使元素完全透明，你可以用 `transparent` 关键字替换整个 `rgb()` 函数。\n\n\
  令人惊讶的是，这些组合可以产生 1600 万种颜色。例如，以下函数产生一种漂亮的红色（实际上与 `tomato` 颜色关键字的红色相同）：\n\n```\nrgb(255\
  \ 99 71)\n```\n\n如果你想让元素背后的内容透颜色显示出来，可以添加不透明度值，如下所示：\n\n```\nrgb(255 99 71 / 90%)\n\
  ```\n\n![Remember](img/remember.png) 直最近，`rgb()` 函数在 `red`、`green` 和 `blue` 参数之间需要逗号，并且不接受\
  \ `alpha` 参数。在过去，你使用 `rgba()` 函数来指定不透明度，其语法为 `rgba(red, green, blue, alpha)`。这些旧语法仍然常见，因此你在查看其他网站源代码时几乎会遇到它们。\n\
  \n## 极客风格指定颜色：RGB 代码\n\n*RGB 代码*是一个哈希符号（`#`）后跟一个六位数值，格式为 `rdgrbl`，其中 `rd` 是一个指定颜色红色分部分的两位数值，`gr`\
  \ 是一个指定绿色部分的两位数值，`bl` 是一个指定蓝色部分的两位数值。\n\n听起来很合理，对吧？别急。这些两位数值实际上是*十六进制*——即 16 进制数值，其取值范围从\
  \ 0 到 9，然后是 a 到 f。作为两位数值，十进制的 0 到 255 在十六进制中表示为 00 到 ff。\n\n例如，以下 RGB 代码产生与函数 `rgb(255\
  \ 99 71)` 相同的红色：\n\n```\n#ff6347\n```\n\n![Tip](img/tip.png) 如果每个两位十六进制代码中的数字相同，你可以将代码缩短为三位版本，去掉重复的数字。例如，以下两个\
  \ RGB 代码是等价的（并且产生一种非常漂亮的蓝色）：\n\n```\n#3388cc\n#38c\n```\n\n## 使用 hsl() 函数迈向专业\n\n\
  如果你读了之前的两个章节，你现在可能在想：“哇，这些内容*一点也不不*直观！”我深有同感。RGB 代码是纯粹的极客行为，即使使用 `rgb()` 函数混合红、绿、蓝，除非你对颜色混合的工作原理非常直觉，否则很难理解。\n\
  \nRGB 指定颜色的非直观性，导致许多 CSS 开发者（无论业余还是专业）开始采用一种基于三个属性的不同颜色模型：\n\n- **色相 (hue)**：颜色，或者更具体地说，在色轮上的位置（如图\
  \ 6-2 所示），其中红色定义为 0 度，颜色绕色轮移动到黄色（60 度）、绿色（120 度）、青色（180 度）、蓝色（240 度）和洋红色（300 度），当然以及之间的所有颜色。\n\
  - **饱和度 (saturation)**：色相的纯度，全饱和意味着色相是纯色，无饱和意味着色相是灰度范围的一部分。\n- **亮度 (lightness)**：色相的明暗程度，全亮度产生白色，无亮度产生黑色。\n\
  \n（顺便提一下，HSL 模型比 RGB 直观得多，因为它它是基于我们感知感知颜色的方式。）\n\n\n\n\n\n![Tip](img/tip.png) 如果你需要让一个元素完全透明，与其在\
  \ `alpha` 参数上使用 `0` 或 `0%`，不如将整个 `hsl()` 函数替换为关键字 `transparent`。\n\n以下是我在之前作为示例时使用的\
  \ `tomato` 和 `rgb(255 99 71)` 颜值的 `hsl()` 等效值：\n\n`hsl(9deg 100% 64%)`\n\n为了得到分裂补色，我只需要在\
  \ `hue` 值上加上 `150deg` 和 `210deg` 了：\n\n`hsl(159deg 100% 64%)`\n\n`hsl(219deg 100%\
  \ 64%)`\n\n![Remember](img/remember.png) 注意，在不久以前，`hsl()` 函数要求 `hue`、`saturation`\
  \ 和 `lightness` 参数之间使用逗号，并且不接受 `alpha` 参数。在以前，你使用 `hsla()` 函数来指定透明度，其语法为 `hsla(hue,\
  \ saturation, lightness, alpha)`。这些旧的语法仍然很常见，所以当你查看其他网站的源代码时，可能会遇到它们。\n\n## 使用颜色点缀文本\n\
  \nCSS 提供了许多属性，让你不仅可以为页面文本着色，还可以为文本背景、文本装饰（如链接下划线）以及文本阴影着色。接下来的几节将告诉你关于为这些元素应用颜色所需的所有知识。\n\
  \n### 应用文本颜色\n\n要为某些文本应用 CSS 颜色，你使用 `color` 属性：\n\n`color: value;`\n\n*   `value`:\
  \ 颜色关键字、`rgb()` 函数、RGB 代码或 `hsl()` 函数。\n\n下面的示例（查看 `bk03ch06/example02.html`）将 `aside`\
  \ 元素的文本颜色设置为由 `hsl(209deg 50% 30%)` 提供的深蓝色：\n\n```css\naside {\n  color: hsl(209deg\
  \ 50% 30%);\n}\n```\n\n### 设置文本装饰颜色\n\n在第三本书第 7 章 中，你将学习用于样式化链接下划线的各种属性，这些在 CSS\
  \ 术语中被称为文本装饰。参考该章节获取完整的讨论，但目前我只需要说，你可以使用 `text-decoration-color` 属性来样式化链接下划线的颜色：\n\
  \n`text-decoration-color: value;`\n\n*   `value`: 颜色关键字、`rgb()` 函数、RGB 代码或 `hsl()`\
  \ 函数。\n\n例如，下面的规则为所有链接设置了红色下划线（`bk03ch06/example03.html`）：\n\n```css\na {\n  text-decoration-color:\
  \ red;\n}\n```\n\n### 创建文本阴影\n\n为了实现酷的效果，你可以用阴影为文本设置样式，它是文本的精确副本，具有三个特征：\n\n*  \
  \ 副本相对于原始文本略有偏移。\n*   副本经过了模糊处理。\n*   副本有自己的颜色。\n\n例如，投影略微向下并向右偏移，这使得原始文本看起来像是从页面上浮了起来。\n\
  \n要创建文本阴影，请使用 `text-shadow` 属性：\n\n`text-shadow: offset-x offset-y blur-radius color;`\n\
  \n*   `offset-x`: 长度值，指定阴影副本相对于原始文本水平移动了多少。\n*   `offset-y`: 长度值，指定阴影副本相对于原始文本垂直移动了多少。\n\
  *   `blur-radius`: 长度值，指定应用于阴影副本的模糊程度；你使用的 `blur-radius` 值越大，阴影文本就越模糊。\n*   `color`:\
  \ 你想应用到阴影副本的颜色；使用颜色关键字、`rgb()` 函数、RGB 代码或 `hsl()` 函数。\n\n阴影在小字体上会丢失（并让文本更难阅读），因此请将阴影留给大字体，越大越好。这里有一个示例（`bk03ch06/example04.html`），它创建了图\
  \ 6-3 所示所示投影效果：\n\n```css\ndiv {\n  color: steelblue;\n  font-size: 15vw;\n  text-shadow:\
  \ 7px 7px 5px cornflowerblue;\n}\n```\n\n![带有投影的某些文本的截图。](img/9781394164684-fg030603.png)\n\
  \n图 6-3： 带有投影的一些大文本。\n\n![Tip](img/tip.png) `text-shadow` 属性可以接受多个阴影定义，每个之间用逗号分隔，可以创建一些有趣的效果。这是一个简单的示例：\n\
  \n```css\ntext-shadow:\n  7px 7px 5px cornflowerblue,\n  9px 9px 5px darkblue;\n\
  ```\n\n欲需更详尽的内容，请查看 `bk03ch06/example05.html`。\n\n## 设置元素的背景\n\n对于每个 HTML 元素，背景是元素盒模型中的层，其他内容都显示在其之上，包括文本和图像（它们共同构成了前景）。对于每个元素，背景都是……（默认情况下，背景是透明的。）然而，CSS\
  \ 提供了许多相关属性，让你可以使用颜色或图像装饰背景。\n\n### 应用背景颜色\n\n要为背景添加颜色，你可以使用 `background-color`\
  \ 属性：\n\n`background-color: value;`\n\n*   `value`: 颜色关键字、`rgb()` 函数、RGB 代码或 `hsl()`\
  \ 函数。\n\n下面的示例（`bk03ch06/example06.html`）将 `aside` 元素的背景设置为由 `hsl(209deg 50% 30%)`\
  \ 提供的深蓝色：\n\n```css\naside {\n  background-color: hsl(209deg 50% 30%);\n}\n```\n\
  \n### 使用图像装饰元素\n\n为了给元素背景增添活力，可以通过设置元素的 `background-image` 属性使用图像覆盖：\n\n`background-image:\
  \ image;`\n\n*   `image`: 你想作为元素背景显示的图像。你有多种方法指定图像，但以下两种最常见：\n\n    *   **图像文件**:\
  \ 使用 `url(\"file\")`，其中 `file` 是图像文件名，如果文件与 CSS 代码文件不在同一目录，则需要包含路径。\n    *   **渐变**:\
  \ 使用渐变函数（如 `linear-gradient()` 或 `radial-gradient()`指定渐变。（前往“用颜色渐变惊艳你的朋友”学习如何使用渐变。）\n\
  \n这里有一个示例（`bk03ch06/example07.html`）为 `div` 元素添加了背景图像：\n\n```html\n<body>\n  <div></div>\n\
  </body>\n```\n\n```css\ndiv {\n  background-image: url(\"images/webdev-workshop.png\"\
  );\n  border: 1px solid black;\n  height: 75vh;\n  width: 75vw;\n}\n```\n\n图 6-4\
  \ 显示了结果。注意，当图像小于目标元素的尺寸时，浏览器会重复——或*平铺*图像来填充背景。\n\n\n\n\n\n![Warning](img/warning.png)\
  \ 当你将图像作为包含文本的元素的背景时，请确保图像不要过于杂乱，导致元素文本难以识别。此外，请确保图像使用的颜色与你的文本颜色之间有足够的对比度。\n\n![浏览器平铺较小的图像以填充元素的背景。](img/9781394164684-fg030604.png)\n\
  \n图 6-4 浏览器平铺较小的图像以填充元素的背景。\n\n另一个使用图像作为 `body` 元素背景的示例（bk03ch06/example08.html）：\n\
  \n```css\nbody {\n  margin: 0;\n  font-size: 100%;\n  background-image: url(\"images/ant-on-a-flower.jpg\"\
  );\n  height: 100vh;\n  width: 100vw;\n}\n```\n\n如图 6-5 所示，当你使用的图像比元素尺寸大时，浏览器会使用该图像填充整个背景，然后裁剪掉图像的其余部分。\n\
  \n为了控制背景图像的特性，例如较小的图像如何（以及是否）平铺以及较大的图像如何适应元素的背景，CSS 提供了大量与背景图像相关的属性。以下是大部分属性的概述：\n\
  \n*   `background-position: x y`: 指定背景图像的起始位置，其中 `x` 是水平起始位置，`y` 是垂直起始位置。`x` 和 `y`\
  \ 都可以关键字（`top`、`right`、`bottom`、`left` 或 `center`）、百分比或长度值（如 `50px` 或 `5rem`）。默认值为\
  \ `left top`。Bk03ch06/example09.html![浏览器仅使用了足够大的图像来填充元素背景。](img/9781394164684-fg030605.png)\n\
  \    图 6-5 浏览器仅使用了足够大的图像来填充元素背景。\n\n*   `background-size: width height | keyword`:\
  \ 指定背景图像的大小。`width` 和 `height` 都可以是百分比或长度值（如 `250px` 或 `15rem`）。你也可以只指定 `width`\
  \ 值，浏览器会自动调整高度以保持图像的初始宽高比例。或者，你也可以指定一个 `keyword`，可以是以下任意之一：\n    *   `contain`:\
  \ 缩放图像直到其达到元素的完整宽度或高度（以先发生者为准）。如果另一个维度仍留有空间，浏览器将平铺图像直到填满空间。\n    *   `cover`: 缩放图像直到其覆盖元素的完整宽度和高度。如果图像大于元素的背景，浏览器将裁剪图像的其余部分。\n\
  \n    默认值为 `auto auto`（这意味着浏览器根据图像的固有尺寸设置设置和高度）。查看 bk03ch06/example10.html。\n\n\
  *   `background-repeat: horizontal vertical`: 指定当图像小于元素背景时，背景图像是否重复以及如何重复（平铺）。`horizontal`\
  \ 和 `vertical` 都可以采用以下任何关键字：\n    *   `repeat`: 图像沿着指定的轴（即水平或垂直）重复，直到填满可用区域。如果需要，如果没有足够的空间容纳整个图像，图像的最后一次将被裁剪。\n\
  \    *   `space`: 图像沿着指定的轴重复而不进行裁剪。如果有额外空间，图像的第一次和最后一次重复将固定在轴的端点（例如 `horizontal`\
  \ 参数的左端和右端），额外空间将均匀地分布在其余图像重复之间。\n    *   `round`: 图像沿着指定的轴重复而不进行裁剪。如果有额外空间，图像的重复将在轴方向上拉伸以填满该空间。\n\
  \    *   `no-repeat`: 图像不沿指定的轴重复。\n\n    你可以只使用这些关键字中的任何一个，浏览器会将该关键字应用于两个维度（例如，`background-repeat:\
  \ space` 等同于 `background-repeat: space space`）。你也可以使用以下单值型关键字：\n    *   `repeat-x`:\
  \ 图像仅沿水平轴重复。这与使用 `repeat no-repeat` 相同。\n    *   `repeat-y`: 图像仅沿垂直轴重复。这与使用 `no-repeat\
  \ repeat` 相同。\n\n    默认值为 `repeat`。查看 bk03ch06/example11.html（如图 6-6 所示）。\n\n* \
  \  `background-clip: keyword`: 指定背景延伸到元素的哪个部分。\n*   `background-origin: keyword`:\
  \ 指定背景图像在元素框内的起始位置。`keyword` 的取值为 `content-box`、`padding-box` 或 `border-box`。默认值为\
  \ `border-box`。查看 bk03ch06/example12.html。\n*   `background-attachment: keyword`:\
  \ 指定背景图像是随内容滚动还是保持固定。对于 `keyword`，请使用以下内容之一：\n    *   `local`: 图像随内容滚动。\n    * \
  \  `scroll`: 图像相对于元素固定。\n    *   `fixed`: 图像相对于视口固定。\n\n    默认值为 `scroll`。查看 bk03ch06/example13.html。\n\
  \n![background-repeat 的各种值。](img/9781394164684-fg030606.png)\n图 6-6 background-repeat\
  \ 的各种值。\n\n### 利用简写属性\n\n据我统计，在之前的两个章节中，我涵盖了不不少于背景相关的属性。它们按字母顺序排列如下：\n\n*   `background-attachment`\n\
  *   `background-clip`\n*   `background-color`\n*   `background-image`\n*   `background-origin`\n\
  *   `background-position`\n*   `background-repeat`\n*   `background-size`\n\n在规则中添加这么多行非常繁琐，因此\
  \ CSS 提供了一个名为 `background` 的替代属性，它允许你一次性设置某些或所有上述背景属性。以下是 W3C 推荐的语法：\n\n`background:\
  \ image position / size repeat attachment origin color;`\n\n这是一个示例：\n\n```css\n\
  background: url(\"images/webdev-workshop.png\") center / 50px space local content-box\
  \ content-box red;\n```\n\n注意事项：\n\n*   对于每个参数，使用适用于该属性的任何值，例如 `image` 参数使用 `url(\"\
  my-image.png\")`，`repeat` 参数使用 `repeat-x`，`color` 参数使用任何颜色值。\n*   你不需要指定所有参数；可以随意跳过任何不需要设置的属性。\n\
  *   如果你确实跳过了某个属性，请记住浏览器会将该属性设为其默认值。\n*   如果你包含了 `size` 参数，请务必也去掉前导斜杠 (`/`)。\n* \
  \  如果你只包含了 `origin` 和 `clip` 参数之一，浏览器将将两者都设置为你指定的值。\n\n\n\n\n\n`background` 属性也支持多个背景定义，这允许你将一个背景叠加在另一个背景之上。要设置这种效果，请用逗号分隔每个背景定义。请注意，第一个定义位于最顶层，第二个定义将位于下方的第二层，依此类推。另请注意，你可以在最后一一层指定颜色。\n\
  \n这里有一个示例（`bk03ch06/example15.html` 和 图 6-7），它定义了两个背景层——顶部是一个 logo，下方是一张照片：\n\n\
  ```\ndiv {\n  background: url(\"images/webdev-workshop.png\") bottom right / 150px\
  \ no-repeat,\n  url(\"images/ant-on-a-flower.jpg\") top left / cover;\n  border:\
  \ 1px solid black;\n  height: 50vh;\n  width: 50vw;\n}\n```\n\n![一个背景（logo）叠加在另一个背景（照片）之上的截图](img/9781394164684-fg030607.png)\n\
  \nFIGURE 6-7: 一个背景（logo）叠加在另一个背景（照片）之上。\n\n## 用颜色渐变惊艳你的朋友\n\n为元素着色是网页添加视觉趣味的绝佳方法。但如果你想在页面上添加更接近“炫酷效果”的东西，那么看颜色渐变就对了。`gradient`\
  \ 是两种或多种颜色的集合，其中一种颜色逐渐过渡到下一种颜色，再逐渐过渡到下一种，依此类推。当使用得当且颜色协调时，渐变是历史上伟大的网页效果之一。\n\n在进入细节之前，让我先指出关于渐变的两点通用说明：\n\
  \n*   你只能将渐变作为背景。\n*   渐变实际上是网络浏览器根据你的规范动态生成的图像。\n\n### 应用线性渐变\n\n`linear gradient`（线性渐变）是指颜色过渡发生在直线上的。例如，颜色过渡可以从元素的顶部到底部，或者从左上角到右下角。要创建线性渐变，你使用\
  \ `linear-gradient()` 函数：\n\n```\nlinear-gradient(angle, color1-stop1%, color2-stop2%,...,colorN-stopN%)\n\
  ```\n\n*   `angle`: 线性渐变的方向。你可以使用 `0deg` 到 `359deg` 之间的值。或者，你可以使用关键字 `to` 加上垂直方向关键字（`top`\
  \ 或 `bottom`）、水平方向关键字（`left` 或 `right`）或对角线方向关键字（`top left`、`top right`、`bottom\
  \ left` 或 `bottom right`）。\n*   `color1`, `color2`, `…`, `colorN`: 你在线性渐变中使用的颜色。可以使用本章前面讨论过的任何颜色值。\n\
  *   `stop1`, `stop2`, `…`, `stopN`: 线性渐变的颜色停止点（color stops），`color stop` 是指定前一种颜色停止和下一种颜色开始的过渡位置的百分比。第一种颜色的默认停止点是\
  \ 0%（即从从开始），最后一种颜色的默认停止点是 100%（即它在结束处停止），因此你不需要输入这些值。\n\n这里有一个示例，将线性渐变应用于 `div`\
  \ 元素的背景（`bk03ch06/example16.html` 和 图 6-8）：\n\n```\ndiv {\n  background: linear-gradient(to\
  \ bottom right, yellow, greenyellow 50%, darkgreen);\n  border: 1px solid black;\n\
  \  height: 50vh;\n  width: 50vw;\n}\n```\n\n![应用于 div 元素背景的线性渐变截图](img/9781394164684-fg030608.png)\n\
  \nFIGURE 6-8: 应用 div 元素背景的线性渐变。\n\n### 应用径向渐变\n\n`radial gradient`（径向渐变）是指颜色过渡发生在椭圆或圆形形状中的。以下是其语法：\n\
  \n```\nradial-gradient(shape, size at position, color1-stop1%, color2-stop2%,...,colorN-stopN%)\n\
  ```\n\n*   `shape`: 渐变的整体形状，你可以将其设置为 `circle` 或 `ellipse`。（这是默认值，所以你可以省略它。）\n* \
  \  `size`: 结束形状（ending shape）的大小，它是倒数第二个颜色停止点创建的最外椭圆或圆形。（最后一个颜色停止点仅填充元素背景的剩余部分，并被认为是无限的，至少可能是如此！）你有多种选择：\n\
  \    *   单个长度（例如 `15rem`）用于圆形。\n    *   两个长度值（例如 `15rem 10rem`）用于椭圆。\n    *   `closest-side`、`farthest-side`。\n\
  *   `position`: 指定形状的中心点（即渐变的起点）。你可以指定一组 x-y 点（例如 `45px 100px`）或组合了垂直位置（`top`、`center`\
  \ 或 `bottom`）与水平位置（`left`、`center` 或 `right`）的关键字对。默认 `position` 值为 `center center`。\n\
  *   `color1`, `color2`, `…`, `colorN`: 你在径向渐变中使用的颜色。可以使用本章前面讨论过的任何颜色值。\n*   `stop1`,\
  \ `stop2`, `…`, `stopN`: 径向渐变的颜色停止点（即前一种颜色停止和下一种颜色开始的百分比）。第一种颜色的默认停止点是 0%，最后一种颜色的默认停止点是\
  \ 100%。\n\n这里有一个示例，将椭圆径向渐变应用于 `div` 元素的背景：\n\n```\ndiv {\n  background: radial-gradient(closest-corner\
  \ at 250px 100px, yellow, darkgreen);\n  border: 1px solid black;\n  height: 50vh;\n\
  \  width: 50vw;\n}\n```\n\n![应用于 div 元素背景的径向渐变截图](img/9781394164684-fg030609.png)\n\
  \nFIGURE 6-9: 应用 div 元素背景的径向渐变。\n\n### 应用锥形渐变\n\n\n\n\n\n*锥形渐变*是指颜色转换围绕中心点旋转的渐变。要创建一个锥形渐变，可以使用\
  \ `conic-gradient()` 函数：\n\n`conic-gradient(from `angle` at `x y`, `color1`, `color2`,...,`colorN`)`\n\
  \n*   `angle`: 锥形渐变的初始顺时针旋转角度。你可以使用 `0deg` 到 `359deg` 之间的值。\n*   `x y`: 锥形渐变的中心点，其中\
  \ `x` 是水平起始位置，`y` 是垂直起始位置。`x` 和 `y` 都可以关键字（`top`、`right`、`bottom`、`left` 或 `center`）、百分比或长度值（例如\
  \ `50px` 或 `5rem`）。默认值是 `center`。\n*   `color1`, `color2`...,`colorN`: 你想在锥形渐变中使用的颜色。可以使用本章稍后讨论过的任何颜色值。\n\
  \n以下是我用于创建之前在图 6-2 (bk03ch06/example01.html) 中显示的色轮的 `conic-gradient()` 函数：\n\n\
  ```css\n#color-wheel {\n  width: 33vw;\n  height: 33vw;\n  background: conic-gradient(\n\
  \    from 90deg,\n    hsl(0 100% 50%),\n    hsl(330 100% 50%),\n    hsl(300 100%\
  \ 50%),\n    hsl(270 100% 50%),\n    hsl(240 100% 50%),\n    hsl(210 100% 50%),\n\
  \    hsl(180 100% 50%),\n    hsl(150 100% 50%),\n    hsl(120 100% 50%),\n    hsl(90\
  \ 100% 50%),\n    hsl(60 100% 50%),\n    hsl(30 100% 50%),\n    hsl(0 100% 50%)\n\
  \  );\n  clip-path: circle(50%);\n}\n```\n\n## 设置边框颜色\n\n如果你为元素添加了边框，你可能想给这个边框设置一点颜色。CSS\
  \ 非常乐意配合，并提供了一长系列属性供你用来设置边框颜色：\n\n*   `border:` `width` `style` `color`: 允许你在定义边框的同时设置整个边框的颜色。\n\
  *   `border-color:` `top` `right` `bottom` `left`: 简写属性，允许你为边框的 `top`、`right`、`bottom`\
  \ 和 `left` 侧指定颜色。\n*   `border-top:` `color`: 设置上边框的颜色。\n*   `border-right-color`\
  \ `color`: 设置右边框的颜色。\n*   `border-bottom-color` `color`: 设置下边框的颜色。\n*   `border-left-color`\
  \ `color`: 设置左边框的颜色。\n\n![提示](img/tip.png) 令人稍微惊讶的是，如果你为元素添加了边框但没有指定边框颜色，边框将继承元素的文本颜色。\n\
  \n## 在开发工具中玩转颜色\n\n你的网络浏览器开发工具（参考第 3 本，第 4 章）有很多功能，可以让尝试和应用颜色变得简单得多。每个浏览器都提供不同的颜色工具，但大多数都提供了我在下面描述的部分或全部\
  \ Google Chrome 颜色工具。\n\n首先，对于你应用了颜色属性的元素，右键点击该元素并点击“检查”（Inspect）打开开发工具。样式面板（显示在图\
  \ 6-10）显示你的颜色声明，其中左侧有一个小色块，显示了正在应用的颜色。\n\n![浏览器开发工具截图，元素颜色包含显示已应用颜色的色块。](img/9781394164684-fg030610.png)\n\
  \n图 6-10： 在浏览器开发工具中，元素颜色包含显示已应用颜色的色块。\n\n### 修改颜色\n\n如果你想更改颜色格式（例如，如果颜色目前是 RGB 代码，你可能更倾向于使用\
  \ `hsl()` 函数）。要这样做，按住 Shift 键并点击色块。每点击一次色块，浏览器都会以不同的格式（`hsl()`、`rgb()`、RGB 代码等）显示颜色。\n\
  \n如果你想尝试不同的颜色，除了直接编辑属性值外，还可以点击色块打开颜色选择器，如图 6-11 所示。\n\n![颜色选择器截图。](img/9781394164684-fg030611.png)\n\
  \n图 6-11： 在浏览器开发工具中，元素颜色包含显示已应用颜色的色块。\n\n两种颜色之间的对比度是通过较亮色的亮度除以较暗色的亮度计算出的。网页内容无障碍指南（WCAG）定义了两个对比级别：\n\
  \n| 文本 | 最小 (AA 级) | 增强 (AAA 级) |\n| --- | --- | --- |\n| 正文文本 | 至少 4.5 | 至少 7 |\n\
  | 标题和其他大字体 | 至少 3 | 至少 4.5 |\n\n如何计算对比度？一种方法是使用 WebAIM（Web Accessibility In Mind）对比度检查器：[`https://webaim.org/resources/contrastchecker/](https://webaim.org/resources/contrastchecker/)。但是，使用浏览器的开发工具通常更容易，因为\
  \ Chrome、Firefox 和 Edge 都显示文本的对比度。\n\n对于你应用了 `color` 属性的任何元素，检查元素打开开发工具，然后点击属性左侧的色块。颜色选择器会显示对比数值，告诉你元素文本和背景颜色之间的对比度。浏览器还会显示一个显示对比级别的图标（AAA\
  \ 级显示两个勾选；AA 级显示一个勾选；比例过低则显示通用“否”符号）。\n\n点击“更多”图标（在图 6-11 中指出）以显示更多对比度工具（如图 6-12\
  \ 所示）：\n\n*   现在出现在颜色选择器顶部大色调块中的白色线条代表了不同的对比度级别。顶线以上的任何颜色都太低；两条线之间的任何颜色都是 AA 级；底线以下的任何颜色都是\
  \ AAA 级。\n*   如果你的对比度太低，可以点击 AA 或 AAA 级右侧出现的色块，以自动选择一种能够达到该级别的文本颜色。\n\n![颜色选择器的额外对比度工具截图。](img/9781394164684-fg030612.png)\n\
  \n图 6-12： 颜色选择器的额外对比度工具。\n\n\n\n\n\n## 本章内容\n\n![Bullet](img/check.png) **选择与应用字体**\n\
  \n![Bullet](img/check.png) **让你成为排版高手的三个属性**\n\n![Bullet](img/check.png) **让你的页面文本看起来极其惊艳**\n\
  \n![Bullet](img/check.png) **链接样式**\n\n![Bullet](img/check.png) **让你的文本对齐恰到好处**\n\
  \n*90% 的设计都是排版。*\n\n—JEFFREY ZELDMAN\n\n下次当你遇到一个你认为视觉上很有吸引力的网页时，问问自己这种吸引力源自哪里。是因为它使用的图片吗？可能吧，但大多数网站都使用通用图片，所以可能不是这个原因。是颜色吗？当然，颜色在让页面变得好看方面起着很大作用，但绝大多数网页要么不在意颜色，要么用得很糟糕。\n\
  \n不，我推测大部分吸引力来自于某些你几乎没有察觉到的东西：页面的排版（typography），这意味着页面使用字体、间距和对齐的方式。最好的排版在引导你进入页面的同时，不会引起自身的注意力。当一个页面拥有出色的排版时，它会在你的大脑中营造一种舒适感，让阅读变成一种真正的享受。幸的是，通过学习应用于\
  \ Web 的少数排版方面，你可以在自己的页面上创造出同样的舒适和愉悦。\n\n在本章中，你将探索网页排版的迷人世界。你将学习足够的字体族（typefaces）和字体（fonts）知识来足以应对战斗；如何在你的网页上使用漂亮的字体；学习仅三个\
  \ CSS 属性如何让你成为网页排版大师；如何设置链接、列表和其他文本技巧；以及如何细致地让你的文本对齐得到位。\n\n## Care 好你的文本\n\n所有的网页浏览器都使用默认样式显示页面文本和标题，这些样式充其量只能说是够用。我假设你阅读这本厚书并不是因为你是那种甘于“勉强合用”的人。为此，通过关注文本本身的外观和吸引力，你可以让网页的整体视觉效果和吸引力产生巨大的改变。这是所有排版工作的开端，也是你在页面设计中需要做正确的一件事。\n\
  \n### 认识字体族（以及字体）\n\n`typeface`（字体族）是应用于所有字母、数字、符号和其他字符的特定设计。两个字体族之间最根本的区别是某些字符的末端是否有微小的横笔。这些横笔在排版术中被称为\
  \ `serifs`（衬线），图 7-1 展示了带有衬线的字符和不带衬线的字符之间的区别。\n\n![左侧字母有衬线；右侧字母没有的示意图。](img/9781394164684-fg030701.png)\n\
  \n图 7-1： 左侧字母有衬线；右侧字母没有。\n\n装饰有衬线的字体族被称为——这并不意外——`serif`（衬线）字体族，而那些缺乏衬线的则是 `sans-serif`（无衬线）字体族。\n\
  \n### 衬线与无衬线\n\n所有的网页浏览器都使用默认样式显示页面文本和标题，这些样式充其量只能说是够用。我假设你阅读这本厚书并不是因为你是那种甘于“勉强合用”的人。为此，通过关注文本本身的外观和吸引力，你可以让网页的整体视觉效果和吸引力产生巨大的改变。\n\
  \n`typeface`（字体族）是应用于所有字母、数字、符号和其他字符的特定设计。两个字体族之间最根本的区别是某些字符的末端是否有微小的横笔。这些横笔在排版术中被称为\
  \ `serifs`。\n\n装饰有衬线的字体族被称为 `serif`（衬线）字体族，而那些缺乏衬线的则是 `sans-serif`（无衬线）字体族。`sans-serif`\
  \ 中的 `sans` 实际上在法语中意为“没有”。\n\n### 通用字体族\n\n`generic`（通用）字体族是由浏览器实现的，并通过使用以下关键词之一设置的：\n\
  \n*   `serif`: 一种衬线字体。\n*   `sans-serif`: 一种无衬线字体。\n*   `cursive`: 一种看起来像手写的字体。\n\
  *   `fantasy`: 一种装饰性字体，根据浏览器的不同，它可能具有极端的元素。\n*   `monospace`: 所谓的等宽字体，因为它为每个字符提供相同的空间，因此像\
  \ `i` 和 `l` 这样的细字母占据的空间与像 `m` 和 `w` 这样宽的字母一样。\n\n### 系统字体族\n\n`system`（系统）字体族是安装在用户计算机上的字体。几乎所有的系统字体比浏览器的通用字体好看得多，而且你可以获得更广泛的选择。你也不会产生性能损失，因为字体已经是浏览器可供使用的了。\n\
  \n\n\n\n\n你怎么可能知道每个用户系统上安装了哪些字体？你无法做到。相反，你有两种选择。一种可能性是使用在通用范围内安装的系统字体。例如 `Georgia`\
  \ 和 `Times New Roman`（衬线字体）、`Verdana` 和 `Tahoma`（无衬线字体），以及 `Courier New`（等宽字体）。另一种方法是使用你的字体堆栈（font\
  \ stack）列出两个（或多个）系统字体，并知道浏览器将使用用户设备上实现的第一个字体。这里有一个衬线字体示例：\n\n```css\nfont-family:\
  \ \"Big Caslon\", Georgia, serif;\n```\n\n![Tip](img/tip.png) 某些系统字体安装在至少 90% 的\
  \ Mac 和 Windows 电脑上。对于无衬线字体，你可以使用 `Arial`、`Arial Black`、`Tahoma`、`Trebuchet MS`\
  \ 或 `Verdana`。对于衬线字体，你可以使用 `Georgia` 或 `Times New Roman`。对于等宽字体，它是 `Courier New`。要获取许多流行系统字体的安装百分比，请访问\
  \ [`www.cssfontstack.com`](https://www.cssfontstack.com)。\n\n![Tip](img/tip.png)\
  \ 如果你想让用户获得他们操作系统字体熟悉的熟悉，请使用 `font-family: system-ui`，这会告诉浏览器使用操作系统的默认字体。\n\n![Tip](img/tip.png)\
  \ 一个方便快速地将系统字体整合到你的页面设计中的绝佳资源是 Modern Font Stacks ([`https://modernfontstacks.com/`](https://modernfontstacks.com/))，它提供了各种历史字体分类（旧式字体、工业风、古董风等）的系统字体堆栈集合。找到你喜欢的堆栈，复制\
  \ `font-family` 声明，将其粘贴到你的 CSS 中，然后从你的待办事项中勾掉“添加系统字体堆栈”。\n\n## Web 字体族\n\n系统字体非常棒，因为它们是免费的，并且浏览器可以立即使用，*前提是*它们安装在用户的设备上。然而，这是一个巨大的假设。如果你想完全控制你网页的排版命运，你需要接触*网络*（web）字体族，它们托管在网络上，你使用特殊的\
  \ CSS 指令在代码中使用它们。\n\n你有两种方法使用网络字体：链接和自托管。\n\n### 链接到网络字体族\n\n现在有很多第三方字体族提供者提供你可以链接的字体。其中大多数字体都需要支付许可费用。然而，如果你已经拥有\
  \ Adobe 账户，你可以访问 Adobe Fonts ([`https://fonts.adobe.com`](https://fonts.adobe.com))，它提供了大量的字形。\n\
  \n但是，大多数网页设计师通过 Google Fonts 获取网络字体族，Google Fonts 提供了数百种免费且制作精良字体，你可以在网站上使用它们。以下是如何从\
  \ Google Fonts 选择字体族的方法：\n\n1.  **访问** [`https://fonts.google.com`](https://fonts.google.com)。**\n\
  \n    图 7-3 显示了 Google Fonts 的主页。\n\n2.  **使用类别列表选择你想要的字体族类型（例如衬线字体或等宽字体）。**\n\n\
  3.  **使用其他下拉菜单和控制控件根据需要过滤列表。**\n\n4.  **当你遇到喜欢的字体族时，点击它显示字体的详细信息，其中包含可用字体列表。**![Screenshot\
  \ of Google Fonts is by far the most popular font provider.](img/9781394164684-fg030703.png)\n\
  \n    图 7-3: Google Fonts 是目前最流行的字体提供者。\n\n5.  **为你想要的每种字体点击 Select 链接。你通常只需要三个：**\n\
  \n    *   Regular 400（这是没有应用斜体或加粗的常规正文）\n    *   Regular 400 Italic（带有斜体的常规文本）\n\
  \    *   Bold 700（加粗文本）\n\n    （请参阅本章节稍后部分的“设置文本字重”，以了解 400 和 700 等数字的含义。） Google\
  \ Fonts 会显示一个侧边栏，列出你做的选择。\n\n    ![Warning](img/warning.png) 你可能想选择所有可用字体，但这是一个坏主意，因为你选择的字体越多，获取所有字体的时间就越长，你的网页加载速度就越慢。除非你有非常特定的设计要求，否则你对给定的字体族只需要常规、斜体和加粗字体。\n\
  \n6.  **当你完成选择后，确保选中了 `<link>` 单选按钮，然后使用 Copy 图标复制该单选按钮下方框框中出现的代码（如 **图 7-4** 所示）。**\n\
  \n7.  **将复制的代码粘贴到你的 HTML 文件中，`<head>` 部分的某处（如果你使用内部样式表，则在你的 `<style>` 标签之前；如果你使用外部样式表，则在你的\
  \ CSS `<link>` 标签之前）。**\n\n8.  **返回 Google Fonts，向下滚动侧边栏直到到达“指定字体族的 CSS Rules”部分，复制该\
  \ `font-family` 声明，然后将其代码粘贴到你的 CSS 中。**\n\n    ![Screenshot of Google Fonts is by\
  \ far the most popular font provider.](img/9781394164684-fg030703.png)\n\n    图\
  \ 7-3: Google Fonts 是目前最流行的字体提供者。\n\n```html\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>Link to a font family</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\
  >\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\
  \  <link href=\"https://fonts.googleapis.com/css2?family=Roboto:ital,0,400;1,400;1,700&display=swap\"\
  \ rel=\"stylesheet\">\n  <style>\n    body {\n      font-family: Roboto, Tahoma,\
  \ sans-serif;\n    }\n  </style>\n</head>\n```\n\n    等等，\n\n现代字体提供的简单性、可靠性和速度是大多数网页开发者链接远程字体文件的原因。然而，你也可以下载字体文件并与你的\
  \ HTML、CSS 和其他文件一起托管在服务器上。自托管字体文件是可靠且快速的，但简单吗？不，完全不是！如果你考虑自托管字体文件，请考虑以下因素：\n\n*\
  \   **字体许可：** 几乎每种商业字体都带有内置限制，防止在网页上使用该字体，或者需要你购买允许在网页上使用的许可。或者，你可以在以下字体集合中搜索允许网页使用的的免费或开源字体：\n\
  \n    *   Font Space [`www.fontspace.com/category/open`](http://www.fontspace.com/category/open))\n\
  \n\n\n\n\n*   Font Spring ([`www.fontspring.com/free`](http://www.fontspring.com/free))\n\
  *   Font Squirrel ([`www.fontsquirrel.com`](http://www.fontsquirrel.com))\n*   The\
  \ League of Moveable Type ([`www.theleagueofmoveabletype.com`](http://www.theleagueofmoveabletype.com))\n\
  *   Open Font Library (fontlibrary.org)\n\n### 文件格式\n字体文件格式有很多种，但如今你只需要担心一种：`WOFF2`（Web\
  \ Open Font Format，版本 2），它提供了极佳的文件压缩率，可以保持字体文件尽可能地小。\n\n### 获取 WOFF2 文件\n遗憾的是，当你从提供者下载字体文件时，并不会得到\
  \ `WOFF2` 文件。相反，你可能会得到 `TTF`（真类型字体）或 `OTF`（OpenType 字体）文件。我想你可以使用这些文件，但它们的大小通常是\
  \ `WOFF2` 文件的五到六倍，这会严重减慢你的页面加载速度。相反，你可以使用以下方法之一来获取 `WOFF2` 文件：\n\n*   **Google Fonts：**\
  \ 只有 Google 之神才知道为什么 Google Fonts 没有提供下载 `WOFF2` 文件的简单方法。幸运的是，一位名为 Mario Ranftl\
  \ 的开发者创建了一个名为 `google-webfonts-helper` 的工具 ([`https://gwfh.mranftl.com/fonts`](https://gwfh.mranftl.com/fonts))，它可以让你搜索\
  \ Google 字体，选择所需的样式，然后下载一个包含 `WOFF2` 文件的 `.zip` 包（它也包含了 `WOFF` 文件，这是 `WOFF` 类型的原始版本）。在工具的\
  \ CSS 部分，务必点击 Modern Browsers 以获取正确的 CSS 代码（稍后将详细介绍该代码）。\n*   **Font Squirrel:**\
  \ 如果你已经下载了 `TTF` 或 `OTF` 文件，可以使用 Font Squirrel 的一项服务——`Webfont Generator` ([`www.fontsquirrel.com/tools/webfont-generator`](https://www.fontsquirrel.com/tools/webfont-generator))，它可以处理你下载的字体文件并自动创建一个包含\
  \ `WOFF2` 格式（以及 `WOFF` 文件）的包。`Webfont Generator` 包还包含了在网站上使用这些字体所需的 CSS 代码。\n\n\
  好了，假设你现在已经有了 `WOFF2` 文件，如何将它们引入 CSS 中呢？你将使用 CSS 代码 `@font-face`（这是一种特殊的 CSS 规则，称为操作规则），其通用语法如下：\n\
  \n```css\n@font-face {\nfont-family: 'name';\nfont-style: style;\nfont-weight: weight;\n\
  src: url('filename.woff2') format('woff2');\n}\n```\n\n*   `name`: 字体名称。\n*   `style`:\
  \ 字体样式，通常为 `normal` 或 *italic*（斜体*）。\n*   `weight`: 字重数字，例如正文使用 `400`，粗体使用 `700`。\n\
  *   `filename.woff2`: `WOFF2` 字体文件的文件名。\n\n为你为下载的每个样式和字重创建一个 `@font-face` 规则。这里有一个示例（`bk03ch07/example04.html`），它为\
  \ Roboto 字体设置了三个 `@font-face` 规则：\n\n```css\n@font-face {\nfont-display: swap;\n\
  font-family: 'Roboto';\nfont-style: normal;\nfont-weight: 400;\nsrc: url('roboto-regular.woff2')\
  \ format('woff2');\n}\n\n@font-face {\nfont-display: swap;\nfont-family: 'Roboto';\n\
  font-style: italic;\nfont-weight: 400;\nsrc: url('roboto-italic.woff2') format('woff2');\n\
  }\n\n@font-face {\nfont-display: swap;\nfont-family: 'Roboto';\nfont-style: normal;\n\
  font-weight: 700;\nsrc: url('roboto-700.woff2') format('woff2');\n}\n```\n\n然后我可以在样式表中使用它，如下：\n\
  \n```css\nbody {\nfont-family: Roboto, Tahoma, sans-serif;\n}\n```\n\n![Tip](img/tip.png)\
  \ 为了获得最佳性能，请将 `@font-face` 规则放在 HTML 文件的 `head` 部分，位于 `<style>` 标签的开头。\n\n![Technical\
  \ stuff](img/technicalstuff.png) 每个 `@font-face` 规则中的 `font-display: swap` 声明是什么意思？`font-display`\
  \ 属性告诉网页浏览器如果字体文件没有立即加载该怎么做。你想要避免的是浏览器在等待字体文件到达时停止加载页面。`swap` 值告诉浏览器极短地等待字体文件，如果在此期间没有显示，则继续使用下一个可用的备用字体。当字体加载完成时，它就会显示。\n\
  \n\n\n\n![Warning](img/warning.png) 记住切不要在字体大小上使用 `px`，因为这样做会覆盖用户的自定义字体大小，从而降低页面的可访问性。对于\
  \ `font-size` 值，始终使用相对单位。\n\n除了使用 `16px` 作为普通页面文本的默认字体大小外，现代浏览器还对标题使用以下默认大小：\n\n\
  | **Heading** | **默认 `font-size` 值** |\n| --- | --- |\n| `h1` | `2em` |\n| `h2`\
  \ | `1.5em` |\n| `h3` | `1.17em` |\n| `h4` | `1em` |\n| `h5` | `0.83em` |\n| `h6`\
  \ | `0.67em` |\n\n![Technical stuff](img/technicalstuff.png) 奇怪的是，`h1` 元素的 `font-size`\
  \ 值取决于 `h1` 是否嵌套在 `article`、`aside`、`nav` 或 `section` 元素中。如果 `h1` 嵌套在这些任何一个元素中，它的新默认大小将变为\
  \ `1.5em`（与 `h2` 元素的默认值相同）。如果 `h1` 嵌套了两层（例如，在位于 `article` 元素中的 `section` 元素中），新的默认大小将变为\
  \ `1.17em`（与 `h3` 元素的默认值相同）。嵌套三层后，`h1` 的大小变为 `1em`；嵌套四层后变为 `0.83em`；嵌套五层后变为 `0.67em`。这种意料之外的行为进一步说明了为什么你应该在页面顶部只使用单一的\
  \ `h1`，并对所有其他标题使用 `h2` 到 `h6`。注意，这种字体大小层上的愚蠢行为*并不*适用于嵌套的 `h2` 到 `h6` 元素。呼！\n\n你能够、也应该覆盖浏览器的默认大小。例如，我可以修改\
  \ `p` 元素（该元素包含了之前在图 7-5 中所示的文本），将 `font-size` 提高到 `1.25rem`：\n\n```css\np {\n  font-size:\
  \ 1.25rem;\n}\n```\n\nFigure 7-7 (bk03ch07/example06.html) 显示了结果，相比原始已经有了显著的改进。\n\
  \n![font-size 设置为 1.25rem 的示例页面截图](img/9781394164684-fg030707.png)\n\nFIGURE 7-7:\
  \ `font-size` 设置为 `1.25rem` 的示例页面。\n\n设置字体大小的方法一种是使用模块比例（modular scale），你从一个基础字体大小开始，使用一个固定系数来推导出所有比基准大或小的所需字体大小。\n\
  \n对于比基准大的字体大小，你将基准乘以系数以得到第一个更大的大小，将该结果再次乘以系数得到第二个更大的大小，以此此类推。例如，如果你的基准是 `1.25rem`\
  \ 且系数是 1.5，那么生成的三个较大字体大小的模块比例如下：\n\n| **起始值** | **计算方式** | **结果** | **应用对象** |\n\
  | --- | --- | --- | --- |\n| `1.25rem` | 无（基准） | `1.25rem` | 普通文本，`h4` |\n| `1.25rem`\
  \ | `1.25rem * 1.5` | `1.875rem` | `h3` |\n| `1.875rem` | `1.875rem * 1.5` | `2.813rem`\
  \ | `h2` |\n| `2.813rem` | `2.813rem * 1.5` | `4.219rem` | `h1` |\n\n对于比基准小的字体大小，你将基准除以系数得到第一个更小的大小，将该结果再次除以系数得到第二个更小的大小，以此此类推。例如，如果你的基准是\
  \ `1.25rem` 且系数是 1.5，那么生成的两个较小字体大小的模块比例如下：\n\n| **起始值** | **计算方式** | **结果** | **应用对象**\
  \ |\n| --- | --- | --- | --- |\n| `1.25rem` | 无（基准） | `1.25rem` | 普通文本，`h4` |\n\
  | `1.25rem` | `1.25rem / 1.5` | `0.833rem` | `h5` |\n| `0.833rem` | `0.833rem /\
  \ 1.5` | `0.556rem` | `h6` |\n\n为什么要这么麻烦？模块比例为网页设计带来了许多显著优势：\n\n*   **你可以在页面中获得一套合理的字体大小组合。**\
  \ 这六种大小对于大多数页面都是足够了。\n\n\n\n\n回看图 7-5 中那个排版可疑的页面，问题之一是行距太拥密。这是因为由于未知原因，所有网络浏览器的默认\
  \ `line-height` 值都非常小，通常在 `1.15` 到 `1.2` 之间。这些值使得文本挤成一团，对于视力正常的人来说难以阅读，更不用说那些视力不好、有阅读障碍或其他视觉问题的人了。图\
  \ 7-11 (bk03ch07/example09.html) 显示了将 `line-height` 设置为 `1.5` 的文本（以及我在上一节中设置的相同\
  \ `font-size` 值 `1.25rem`）。现在看起来好多了！\n\n![line-height 设置为 1.5 的示例页面截图。](img/9781394164684-fg030711.png)\n\
  \n图 7-11： `line-height` 设置为 `1.5` 的示例页面。\n\n![提示](img/tip.png) 根据《Web 内容可访问性指南》中的“文本间距”部分（参考\
  \ [`https://www.w3.org/WAI/WCAG21/Understanding/text-spacing.html`](https://www.w3.org/WAI/WCAG21/Understanding/text-spacing.html)），行高应至少为\
  \ `1.5` 以确保所有人都能阅读。因此，在你的页面设计中，`line-height` 值 `1.5` 应该是你的起点。\n\n### 设置行长\n\n我排版三要素的第三也是最后一个方面是行长，按字符测量时被称为行的\
  \ `measure`。行长是一个至关重要的指标，原因有两个：\n\n* 行长过短会导致阅读断断续，导致你的眼睛频繁来回移动，引起眼睛疲劳（以及整体的烦躁）。\n\
  * 行长过长会导致眼睛疲劳，因为你需要对每一行扫描太长时间。此外，非常长的行很难快速定位下一行的开头（更加令人烦躁！）。\n\n图 7-12 展示了左侧行长过短和右侧行长过长的两个问题。\n\
  \n![行长过短（左）和过长（右）的文本截图。](img/9781394164684-fg030712.png)\n\n图 7-12： 行长过短（左）和过长（右）的某些文本。\n\
  \n简单来说，我们可能会尝试使用 `max-width` 属性来控制行长，如例所示：\n\n```css\np {\n  max-width: 40rem;\n\
  }\n```\n\n这是一个合理的解决方案，但它没有考虑到当前的段落字体大小。相反使用 `em` 单位是有问题的，因为由于级联机制（查看第 3 卷，第 4 章），很难预测段落将继承什么字体大小（查看第\
  \ 3 卷，第 5 章）。\n\n此外，使用 `rem` 或 `em` 这样的长度单位并不直观。我们知道（通过实证研究和数百年的排版经验）的是，特定字符数量的行长——通常不少于\
  \ 45 个且不超过 75 个——对于可读性是最理想的。注意我在这里说的是字符，而不是宽度。也就是说，尝试通过设置类似 `rem`（或更糟的 `px`）这样的单位的最大宽度来控制行长并没有真正意义。\n\
  \n这里有一个难得的机会可以利用 `ch` 测量单位，它是元素当前字体大小下字符 `0`（零）的宽度。与其将行长悬挂父元素 (`em`) 或根元素 (`rem`)\
  \ 的字体大小上，为什么不直接将最大宽度设置为一个 `ch` 值呢？看这里：\n\n```css\np {\n  max-width: 65ch;\n}\n```\n\
  \n现在这就符合直觉了！在图 7-13 (bk03ch07/example11.html) 中，我将此规则应用于最初在图 7-5 中展示的那个问题示例。现在这是一段非常漂亮的文本！\n\
  \n![max-width 设置为 65ch 的示例页面截图。漂亮！](img/9781394164684-fg030713.png)\n\n图 7-13： `max-width`\
  \ 设置为 `65ch` 的示例页面。漂亮！\n\n### 排版三要素之间的关系\n\n在过去的三个节中，我将字号、行高和行长作为独立的排版属性，但在现实世界中，这三个测量是密切且复杂关联的。如果你对其中一个值有设计限制，你需要调整其他值以保持排版的和谐与平衡。其工作原理如下：\n\
  \n* **字号：** 字体号的大小对行高和行长的影响如下：\n    * 使用较大的字号，可以使用更大的行高和更长的行长。\n    * 使用较小的字号，可以使用较小的行高和较短的行长。\n\
  * **行高：** 行的高度对字号和行长的影响如下：\n    * 使用较大的行高，可以使用较大的字号和更长的行长。\n    * 使用较小的行高，可以使用较小的字号和较短的行长。\n\
  * **行长：** 行的长度对字号和行高的影响如下：\n    * 使用较长的行长，可以使用较大的字号和更大的行高。\n    * 使用较短的行长，可以使用较小的字号和较小的行高。\n\
  \n## 应用文本\n\n你可以为文本添加另一个排版修饰是使用斜体进行样式化。接下来的章节将带你了解。\n\n### 设置字重\n\n在 CSS 中，构成字符笔画的相对粗细被称为该字符的权重（weight）。你可以通过应用\
  \ `font-weight` 来控制某些文本的字重：\n\n```css\nfont-weight: value;\n```\n\n* **数值：** 使用以下值之一：`100`、`200`、`300`、`400`、`500`、`600`、`700`、`800`\
  \ 或 `900`。如图 7-14 所示，这些数字应用了从极细（`100`）到极粗（`900`）的权重。这些是在检查字体样式时通常遇到的标签。注意，并非所有字体都支持上述值。如果某种字体不支持特定的字重，浏览器将使用最接近可用值。\n\
  * **关键字：** 使用 `bold` 代替 `700`，使用 `normal` 代替 `400`。要设置相对于父元素字重的权重，请使用 `lighter`（使元素比父元素轻一个权重；该关键字仅支持\
  \ `100`、`400` 和 `700`）或 `bolder`（使元素比父元素重一个权重；该关键字仅支持 `400`、`700` 和 `900`）。\n\n\n\
  \n\n\n### 使用斜体样式化文本\n\n在第二本书的第二章中，我提到过 `<Em>` 和 `<i>` 标签具有语义意义（分别表示强调和备用文本），但你可能某些文本应该渲染为斜体，但并不带有强调或作为备用文本。此类文本的示例包括标题、说明、表格列标题和脚注。没问题：通过在你的规则中添加\
  \ `font-style` 属性来使用 CSS：\n\n```css\nfont-style: italic;\n```\n\n除了 `italic` 值外，你还可以指定\
  \ `oblique` 来倾斜正体。\n\n```css\nfont-style: oblique\n```\n\n然而，由于 `oblique` 文本只是以特定角度渲染的正体，其视觉吸引力通常不如\
  \ `italic` 文本，后者通常是专门设计的字体。\n\n### 通过可变字体获取更多样式\n\n无论是链接到远程字体还是自托管字体文件，你都会面临一个主要的限制：你无法使用超过三个或最多四种字体。超过这个数字，你的页面性能将从两个方面受到损耗：\n\
  \n- **带宽消耗：** 所有这些字体文件加起来对于用户的浏览器来说是一次非常大的下载。\n- **加载时间：** 每个字体文件都通过对服务器的单独请求进行加载，这些请求累加起来会占用你页面加载的大量时间。\n\
  \n如果你自托管，WOFF2 字体是高度压缩的，因此它们可以帮助带宽问题，但加载大量字体仍然意味着与服务器之间频繁往返。\n\n由于大多数网站设计三三字体（正体、斜体和粗体）就足够了，因此它们不受这些性能问题的影响。但如果你的网站真的、真的、真的需要细体（`font-weight:\
  \ 100`）、轻体（`font-weight: 300`）、中体（`font-weight: 500`）和黑色（`font-weight: 900`），加上部分或全部对应的斜体版本呢？\n\
  \n如果是这样，忘记使用那种每个文件仅提供单一字体的静态字体吧。相反，你需要查看将多种字体封装到单个文件中的可变字体。从性能角度来看，决定是否使用可变字体是一种权衡：\n\
  \n- **优点：** 你只提供一个文件，而不是多个文件。\n- **缺点：** 可变字体文件的大小通常巨大。\n\n这种权衡意味着，如果你计划只使用标准字体（如正体、斜体、粗体，可能还有粗斜体），请坚持使用静态字体，因为它们更小，你不需要可变字体的全部功能。另一方面，如果你的页面设计要求你使用大量字体——比如六个或更多——那么使用可变字体会更好。\n\
  \n大多数字体提供者至少包含一些可变字体。例如，在 Google Fonts 中，你可以勾选“仅显示可变字体”（Show Only Variable Fonts）复选框来过滤字体列表，只显示可变字体（在我写这里时大约有\
  \ 300 种字体）。你也可以查看这些专门展示可变字体的网站：\n\n- **Axis-Praxis:** `https://www.axis-praxis.org/`\n\
  - **Font Playground:** `https://play.typedetail.com/`\n- **Variable Fonts:** `https://v-fonts.com/`\n\
  \n可变字体是一个复杂的课题，需要几个章节才能充分介绍它的价值。在这里，我只想通过向你展示如何使用 Google Fonts 使用远程可变字体，让你在多种字重范围内同时获得正体和斜体文本，从而领略可变字体的世界。\n\
  \n以下是需要遵循的步骤：\n\n1. **在 Google Fonts (`https://fonts.google.com`) 中，勾选“仅显示可变字体”复选框。**\n\
  2. **点击你想要使用的可变字体。**\n3. **在可用字体样式列表中，选择以下内容：**\n    - 你想要的正体文本中最轻的版本。\n    - 你想要的斜体文本中最轻的版本。\n\
  \    - 你想要的正体文本中最粗的版本。\n    - 你想要的斜体文本中最粗的版本。\n4. **复制 `<link>` 标签，然后将它们粘贴到你 HTML\
  \ 文件的 `head` 部分，置在任何其他 `<link>` 标签或 `<style>` 标签之前。**\n5. **找到第三个 `<link>` 标签，即连接到\
  \ `fonts.googleapis.com` 的那个。这里是一个示例：**\n\n```html\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,900;1,100;1,900&display=swap\"\
  \ rel=\"stylesheet\">\n```\n\n6. **在那个 `href` 属性内部，找到类似于这样的字符串部分：**\n\n```text\n\
  0,100;0,900;1,100;1,900\n```\n\n这些值指的是单个字体：`0,100` 是字重为 100 的正体；`0,900` 是字重为 900\
  \ 的正体；`1,100` 是字重为 100 的斜体；`1,900` 是字重为 900 的斜体。\n\n编辑字符串使其像这样：\n\n```text\n0,100..900;1,100..900\n\
  ```\n\n双点（`..`）表示一个范围，所以你告诉 Google 的是你想要 100 到 900 之间所有的正体权重，以及 100 到 900 之间所有的斜体权重。\n\
  7. **保存你的工作。**\n\n修改后 `<link>` 标签看起来如下：\n\n```html\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap\"\
  \ rel=\"stylesheet\">\n```\n\n## 更多排版技巧\n\n在你设置字体、字号、行高和行宽之后，你可能可以宣布排版任务完成并进入待办列表中的下一项了。但这并不是我已经用尽了\
  \ CSS 所有的排版技巧。远非如此。为了让你体验 CSS 还能为文本做些什么，接下来的章节将快速介绍你可能会用到的属性。\n\n### 控制大小写\n\n要修改元素文本的大小写，请使用\
  \ `text-transform` 属性：\n\n```css\ntext-transform: keyword;\n```\n\n这里是 `keyword`\
  \ 最常用的值（bk03ch07/example14.html）：\n\n- `capitalize`：将每个单词的首字母 true 大写。\n- `lowercase`：将所有字母转换为小写。\n\
  - `uppercase`：将所有字母转换为大写。\n\n这里有一个示例：\n\n```css\np {\n  text-transform: uppercase;\n\
  }\n```\n\n### 设置字母间距\n\n要修改元素当前字体中每个字符之间的间距，请使用 `letter-spacing` 属性：\n\n```css\n\
  letter-spacing: value;\n```\n\n对于 `value`，你可以使用任何 CSS 测量单位，并且允许负值（bk03ch07/example15.html）：\n\
  \n```css\n.site-heading {\n  letter-spacing: -5px;\n}\n```\n\n什么时候你会使用这个属性？我可以想到两个常见的场景：\n\
  \n- 如果你有一个很短但使用了大字号的标题，通过减少几个像素的字母间距，可以让该标题看起来好看一点。\n- 如果你的文本包含连续的大写字母、小型大写字母或数字，增加几个像素的字母间距可以提高这些字符的可读性。\n\
  \n\n\n\n\n![Tip](img/tip.png) 类似的属性是 `font-stretch`，它利用了某些字体显示其字符收缩或扩展版本的内置能力。你可以将\
  \ `font-stretch` 设置为百分比（使用小于 `100%` 来压缩文本，大于 `100%` 来扩展文本）或以下关键字之一：`ultra-condensed`、`extra-condensed`、`condensed`、`semi-condensed`、`normal`、`semi-expanded`、`expanded`、`extra-expanded`\
  \ 或 `ultra-expanded`。\n\n### 显示小型大写字母\n\n小型大写字母 —— 简称 `small caps` —— 是缩小到小写字母大小的大写字母。要指定元素的文本是否（以及如何）以小型大写形式出现，请使用\
  \ `font-variant-caps` 属性：\n\n`font-variant-caps:` `keyword`;`;`\n\n对于 `keyword`，你有三个值可选（bk03ch07/example16.html）：\n\
  \n*   `normal`: 显示文本，不使用任何小型大写。\n*   `small-caps`: 将元素文本中的小写字母显示为缩小到小写字母大小的大写字母。元素的大写字母不受影响。\n\
  *   `all-caps`: 将元素文本中的所有字母显示为缩小到小写字母大小的大写字母。\n\n这是一个示例：\n\n```css\n.subtitle {\n\
  \  font-variant-caps: small-caps;\n}\n```\n\n![Warning](img/warning.png) 极少数字体带有小型大写字母，因此当你将\
  \ `font-variant-caps` 设置为 `small-caps` 或 `all-caps` 时，浏览器会为你生成小型大写（基本上是通过将现有的大写字母缩小到小写大小），导致所谓的\
  \ `伪小型大写`，这通常看起来不太好看。如果你偶尔使用小型大写字母，那没关系。但如果你的设计大量使用小型大写字母，请寻找带有小型大写字母的字体（非常罕见），或使用仅带有小型大写字母的字体族（这些字体名称中通常带有“SC”，例如\
  \ Google Fonts 上的 Alegreya Sans SC 和 Playfair Display SC）。\n\n![Technical stuff](img/technicalstuff.png)\
  \ 你可能知道如何知道给定字体是否支持如小型大写这样的的功能，以及其他 OpenType 功能，如字间距（自动调整某些字母的相对位置使单词显示得更好）、连字（用于替换双字母组合如\
  \ `ff` 和 `fi` 的单字符/字形）以及备用数字字形（在下一节中描述）。遗憾的是，这些信息很难找到，尤其是当你使用 Google Fonts 时。然而，一个名字很搞怪的工具\
  \ Wakamai Fondue (`https://wakamaifondue.com/`) 可以派上用。将你的字体文件拖到该网站上，该工具将告诉该字体支持的所有功能。（在我写这段文字时，该网站包含一个测试版功能，允许你检查来自\
  \ Google Fonts 的字体。）\n\n### 使用备用数字字形\n\n如果你使用的字体支持，你可以使用 `font-variant-numeric`\
  \ 属性为你的序数词（1st, 2nd, 3rd 等）、数字和分数添加一些样式：\n\n`font-variant-numeric:` `keyword`;`;`\n\
  \n对于 `keyword`，你有以下选择（bk03ch07/example17.html）：\n\n*   `ordinal`: 以特殊方式显示与每个序数相关的字母（例如\
  \ `1st` 中的 `st`），通常作为上标。\n*   `slashed-zero`: 显示带有内部斜线或点的点的数字 0（这有助于区分数字 `0` 和大写字母\
  \ `O`）。\n*   `lining-nums`: 显示所有数字，使其底部与基线对齐。\n*   `oldstyle-nums`: 显示数字，使某些数字（通常是\
  \ 3, 4, 5, 7 和 9）具有下伸部。\n*   `proportional-nums`: 显示数字，使每个数字只占据所需的空间。\n*   `tabular-nums`:\
  \ 显示数字，使它们都占据相同的水平空间。\n*   `diagonal=fractions`: 显示分子和分母较小并用斜杠（`/`）分隔的分。\n*   `stacked-fractions`:\
  \ 显示分子和分母较小并用水平线分隔的分。\n\n### 字体简写属性\n\nCSS 提供了 `font` 简写属性，允许你在单个声明中指定所有以下属性的值：`font-family`、`font-size`、`font-stretch`、`font-style`、`font-variant`、`font-weight`\
  \ 和 `line-height`：\n\n`font:` `size/line-height style variant weight family`;`;`\n\
  \n在使用此简写时，请记住以下几点：\n\n*   除了下述异常外，你可以以任何顺序放置值。\n*   只有 `font-family` 和 `font-size`\
  \ 属性值是必须。但记住，如果你在简写中跳过了某个属性，浏览器会将该属性重置为其初始值。\n*   `line-height` 值必须紧跟在 `font-size`\
  \ 值之后，两者之间用斜杠（`/`）分隔。\n*   `font-stretch` 值只能是一个关键字。\n*   `font-variant` 值只能是 `small-caps`\
  \ 或 `normal`。\n*   `font-family` 值必须是最后一个值。\n\n## 为你的链接换新行装\n\n当你向页面添加链接时，网页浏览器会以不同的颜色（通常是蓝色）并带有下划显示文本。这种样式可能与你的页面设计完全不匹配。\n\
  \n程序员经常问的问题是：“链接是否有下划线？”并不是人都喜欢带下划线的文本，如果你属于这一派，可以使用以下规则取消下划线：\n\n```css\na {\n\
  \  text-decoration-line: none;\n}\n```\n\n![Warning](img/warning.png) 为链接创建自定义样式是\
  \ Web 开发人员的标准操作，但需要注意，因为新网页设计师的一个错误是将链接样式化为普通文本（特别是当他们去掉了下划线时）。\n\n与其冒险取消下划线，为什么不保留它们并装饰一下呢？你可以使用以下属性对链接下划线进行建模（bk03ch07/example18.html）：\n\
  \n*   `text-decoration-color`: `color`: 下划线的颜色。\n*   `text-decoration-style`: `keyword`:\
  \ 下划线的样式：`solid`、`double`、`dotted`、`dashed` 或 `wavy`。\n*   `text-decoration-thickness`:\
  \ `value`: 下划线的宽度，可以使用任何 CSS 长度单位。\n\n```css\na {\n  text-decoration-color: hsl(250,\
  \ 100%, 75%);\n  text-decoration-style: dotted;\n  text-decoration-thickness: 3px;\n\
  }\n\n```\n\n![Tip](img/tip.png) CSS 还提供了 `text-decoration` 简写属性，允许你指定指定 `text-decoration-line`、`text-decoration-color`、`text-decoration-style`\
  \ 和 `text-decoration-thickness` 的值：\n\n`text-decoration:` `line``color``style``thickness`;`;`\n\
  \n你可以以任何顺序指定值，并包含全部或部分值：\n\n```css\ntext-decoration: underline tomato wavy 2px;\n\
  ```\n\n记住，如果你在简写中跳过了某个属性，浏览器会将该属性重置为其初始值。\n\n\n\n\n当你考虑到排版（typography）时（你*确实*考虑过排版，对吧？），自然会首先想到字体族、字号和字体样式。我的意思是，*type*（字体）这个词（某种程度上）就包含在\
  \ *typography* 这个词里。这些都是很好的内容，但我认为这些与字体相关的方面是排版中的*树木*。但还有一整片排版的*森林*，它关注的是网页更宏观的。这种森林视角主要是关于如何以令人满意的方式对齐元素。幸运的是，CSS\
  \ 提供了几个属性，让你对文本的对齐方式有相当大的控制力。\n\n### 对齐文本\n\n默认情况下，页面块级元素内部的文本会沿着内容块的左边缘整齐地对齐。这没有问题，但如果你想让元素沿右边缘对齐呢？或者，你可能想在容器内居中显示某些内容。那样不是很好吗？通过使用\
  \ `text-align` 属性，你可以实现这一切以及更多操作：\n\n```css\ntext-align: keyword;\n```\n\n*   `keyword`：你想要应用的对齐方式。你可以使用\
  \ `left`（默认值）、`right`、`center` 或 `justify`（它使元素的文本与左右页边距都对齐）。\n\n图 7-16 显示了 `text-align`\
  \ 属性的作用，段落从左到右分别样式为 `left`、`right`、`center` 和 `justify` (bk03ch07/example19.html)。\n\
  \n![text-align 属性生效的截图（从左到右）：左对齐、居中、右对齐和两端对齐。(images/9781394164684-fg030716.png)图\
  \ 7-16 `text-align` 属性的作用（从左到右）：左对齐、居中、右对齐和两端对齐。### 文本连字符在图 7-16 中，考虑最右侧那个样式为 `text-align:\
  \ justify` 的段落。这个段落包含了巨大的空白区域，特别是在第三和第四行。遗憾的是，大多数网页浏览器并不擅长文本两端对齐，因此这些难看的间隙经常出现，尤其是在行较短的情况下。你可以简单地不对文本进行两端对齐，但如果你非常喜欢两端对齐带来的整洁外观，你可以允许浏览器在需要时对单词进行连字符，以此帮助它完成两端对齐。你可以通过为元素设置\
  \ `hyphens` 属性样式来实现：```csshyphens: keyword;```*   `keyword`：你希望浏览器使用的连字符类型。默认值是\
  \ `none`，但你可以使用 `auto` 关键字告诉浏览器在需要时断开单词。（第三种选项 `manual` 允许你通过插入 `&shy;`——这是软连字符的\
  \ HTML 代码——来指定你自己的单词断句建议。）图 7-17 显示了两个段落：左侧段落使用了 `text-align: justify` 但没有使用连字符，而右侧段落同时使用了\
  \ `text-align: justify` 和 `hyphens: auto` (bk03ch07/example20.html)。让浏览器处理单词连字符对文本的外观和可读性都有巨大的提升。![一个两端对齐但无连字符的段落（左）和一个两端对齐且带连字符的段落（右）的截图。(images/9781394164684-fg030717.png)图\
  \ 7-17 两端对齐且无连字符的段落（左）和两端对齐且带连字符的段落（右）。### 缩进段落首行如果你的页面包含分为段落的长文本，你需要提供某种视觉线索来帮助读者判断一个段落在哪里结束，另一个在哪里开始。为每个段落设置上下边距是视觉上分离段落的最常用方法：```cssp\
  \ {  margin: 1rem auto;}```另一种方法是使用 `text-indent` 属性缩进每个段落的首行：```csstext-indent:\
  \ value;```*   `value`：使用你偏好的 CSS 测量单位定义的缩进长度。默认值为 `0`。![记住](img/remember.png) 将缩进设置为至少与段落字体一样大，或者最多等于段落行高。例如，如果段落字体大小为\
  \ `1rem` 且行高为 `1.5`，将缩进设置在 `1rem` 到 `1.5rem` 之间。\n\n注意，在排版实践中，通常认为不要紧跟在标题、侧注或图像、视频等页面元素之后的任何段落的首行缩进。\n\
  \n幸运的是，有一种简单的方法可以为所有 `p` 元素设置首行缩进，但紧跟在标题或其他非段落元素之后的除：只需针对跟随 `p`（即另一个 `p` 的相邻兄弟元素）之后的\
  \ `p` 元素即可：\n\n```css\np + p {\n  text-indent: 1.5rem;\n}\n```\n\n# 使用 JavaScript\
  \ 构建动态页面\n\n## 目录概览\n\n1. 第 1 章：JavaScript：鸟瞰视角\n2. 第 2 章：理解变量\n3. 第 3 章：构建表达式\n\
  4. 第 4 章：控制 JavaScript 流\n5. 第 5 章：利用函数的力量\n6. 第 6 章：玩转文档对象模型\n\n\n\n\n\n## 6. 使用\
