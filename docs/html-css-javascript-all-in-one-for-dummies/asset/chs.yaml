  \ 4. 暂停你的代码\n## 5. 单步执行代码\n## 6. 监控脚本值\n## 7. 更多调试策略\n## 8. 十种常见的 JavaScript 错误\n\
  ## 9. 十种常见的 JavaScript 错误信息\n\n# 第 11 章：处理表单数据\n\n## 1. 查看 HTMLFormElement 对象\n\
  ## 2. 了解 HTMLInputElement 对象\n## 3. 编写文本字段\n## 4. 编写复选框代码\n## 5. 处理单选按钮\n## 6. 编写选择列表\n\
  ## 7. 处理和触发表单事件\n## 8. 为表单控件创建快捷键\n## 9. 处理表单数据\n\n# 第 1 章\n# JavaScript：概览\n\n\
  ## 本章内容\n\n- 对泛泛的编程（特别是 JavaScript）的初步感受\n- 学习 JavaScript 可以（和不能）做什么\n- 检查你编程所需的工具\n\
  - 处理旧版浏览器\n- 在你的 JavaScript 代码中添加注释\n- 将你的代码存储在单独的 JavaScript 文件中\n\n*大多数优秀的程序员之所以编程，并不是因为他们获得报酬或公众的赞誉，而是因为编程本身很有趣。*\n\
  ——林斯·托瓦兹 (LINUS TORVALDS)\n\nHTML（我将在第 2 本中介绍）和 CSS（我将在第 3 本中介绍）是非常强大的技术，你可以用它们创建看起来惊艳的页面。但当你把页面上传到\
  \ Web 服务器并查看几次（几十次）后，你可能会发现一种微妙的失望感悄然袭来。为什么？这很难界定，但那种失落感源于一个残酷的事实：你的网页就那样呆在那里。\n\
  \n当然，你可能有一两个三个链接可以点击，但这些链接很可能只是带你进入更多的页面，而那些页面也只是在那里呆着。或者某个链接带你去了……\n\n## 什么是 Web\
  \ 编码？\n\n当人们谈论编码时，他们实际上谈论的是 JavaScript。确实，你可以在那里找到许多原始的主页，除了 HTML 和少量的 CSS 外别无他，但其他一切——从简单的博客到华丽的设计师作品——都依赖\
  \ JavaScript 来让一切变得更好。\n\n所以，涉及到你 Web 教育的培养和维护时，JavaScript 是你需要学习的主题中最重要的、可能是核心的之一。\n\
  \n## 什么是编程语言？\n\nJavaScript 是一种编程语言。好吧，没错，但把某个东西称为“编程语言”到底是什么意思？要理解这个术语，你只需要观察你说话和写作的语言。在最基础的层，人类语言由两部分组成——单词和规则：\n\
  \n- 单词是对于相同语言的人来说具有共同含义的字母组合。例如，`book` 这个词表示一种对象；`heavy` 这个词表示一种性质；而 `read` 这个词表示一种动作。\n\
  - 规则是组合单词以创建连贯理解的概念的方法。如果你想让其他语言的使用者理解，你组合两个或多个单词的方式是有限的。“I read a heavy book”是一个通而易懂的句子，但“book\
  \ I read heavy”则是胡言。\n\n人类语言的主要目标是让听你说话或阅读你作品的人理解你。如果你使用正确的单词来指代事物动作，并根据规则组合单词，对方就能理解你。\n\
  \n编程语言的工作方式大同小异。这意味着它也有单词和规则：\n\n- 单词是一组指向你的程序处理的特定事物或处理这些特定方式的术语。它们被称为`保留字`（reserved\
  \ words）或`关键字`（keywords）。\n- 规则是组合单词以产生预期效果的方法。在编程世界中，这些规则被称为语言的`语法`（syntax）。\n\n\
  \n\n\n在 JavaScript 中，你所使用的许多单词都非常直观。有些指代浏览器的某些方面，另一些指代网页的某些部分，还有一些是 JavaScript 内部使用的。例如，在\
  \ JavaScript 中，`document` 一词指的是一个特定的对象（整个网页），而 `write()` 一词指的是一个特定的动作（向页面写入数据）。\n\
  \n这里的核心概念是：就像人类语言的根本目的是为了让别人理解一样，编程语言的根本目的是为了让任何处理该语言的机器能够理解。对于 JavaScript 来说，这台机器就是读取页面的机器：网络浏览器。\n\
  \n你可以通过使用正确的 JavaScript 单词并使用正确的 JavaScript 语法将它们组合，让页面读取机器理解你的意图。例如，JavaScript\
  \ 的语法规则告诉，你可以像这样组合 `document` 和 `write()` 单词：`document.write()`。如果你使用 `write().document`\
  \ 或 `document` `write()` 或任何其他组合，页面读取机器将无法理解你的意思。\n\n然而，关键在于，被页面读取机器“理解”实际上意味着能够*控制*这台机器。也就是说，你的\
  \ JavaScript“句子”实际上是你希望机器执行的命令。例如，如果你想用 JavaScript 在网页上添加“Hello World!”文本，你只需要在代码中包含以下语句：\n\
  \n```javascript\ndocument.write(\"Hello World!\");\n```\n\n当页面读取机器艰难地穿过 HTML 文件并遇到这条语句时，它将直接将其插入页面中。\n\
  \n## JavaScript 难学吗？\n\n我认为这是许多人对创建网页感到兴奋的第二个原因：它并不难。HTML 听起来像是一件很难的事情，而且如果你在对 HTML\
  \ 一无所知的情况下查看一个典型网页的源代码，那些代码看起来比你能想象的任何东西都要令人生畏。\n\n然而，我发现只要从基础标签开始，研究大量关于它们工作方式的示例，并逐渐过渡到更复杂的页面，任何人都可以学习\
  \ HTML。这只是建立一个坚实基础并在此基础上构建的问题。\n\n我深信 JavaScript 也可以以非常相似的方式来。我绝不会告诉你 JavaScript\
  \ 学起来像 HTML 一样简单，那是彻裸裸的谎言。但是，我会告诉你，JavaScript 本质上并没有什么困难之处。用我们的语言来类比，它只是多几个需要掌握的单词和几个需要学习的规则。但我相信，如果你从基础单词和规则开始，学习大量的示例来掌握它们的工作原理，然后慢慢构建到更复杂的脚本，你就能学会\
  \ JavaScript 编程。我在这里预言，当你读完这本书时，你甚至会对自己以及你所能做到的感到惊讶。\n\n## 你用 JavaScript 可以做什么\n\
  \n我教过的创建网页的人是一群非常友好的群体，他们喜欢写信告诉我他们的网页进展得如何。在很多情况下，他们告诉我他们遇到了网页版的“路障障”。也就是说，他们想做某些特定的事情，但不知道如何在\
  \ HTML 中实现。因此，我最终会收到很多这样的问题：\n\n*   我如何显示那种弹出框？\n*   我如何动态地向页面添加内容？\n*   我如何让用户点击按钮时发生某些事情？\n\
  *   我如何让鼠标悬停在图片上时图片发生变化？\n*   我如何计算订单表单的总金额？\n\n对于每个问题，答案的开头总是这一句：“抱歉，你无法使用 HTML\
  \ 实现这一点；你必须使用 JavaScript。”然后我会为他们提供一些代码，他们可以将其“剪粘贴”到自己的网页中，然后继续过自己的生活。\n\n如果你刚开始学习\
  \ JavaScript，我在书中的目标是帮助你从“剪粘贴”转向“编写并加载”。也就是说，你最终将能够创建自己的脚本来解决你自己独特的 HTML 和网页问题。我希望向你展示学习\
  \ JavaScript 是值得的，因为你可以用它做很多其他事情：\n\n*   添加、修改或删除页面文本、HTML 标签，甚至是 CSS 属性。\n*   向用户显示消息并向用户索取信息。\n\
  *   “监听”并根据访客点击鼠标或按下按键等事件执行操作。\n*   将用户的浏览器引导到另一个页面。\n*   在将表单提交到服务器之前验证表单中的值。例如，你可以确保某些字段已填写。\n\
  *   为每个用户收集、保存和检索数据，例如网站个性化设置。\n\n在本书书中，你将学习如何做所有这些事情以及更多内容。\n\n## 你用 JavaScript\
  \ 不能做什么\n\nJavaScript 确实很好，但它并没有那么完美。JavaScript 可以做很多事情，但有一长串事情是它根本做不到的。以下是一些做不到的事情示例：\n\
  \n*   向现有文件永久写入数据。例如，你无法从访客簿中获取数据并将其添加到存储消息的文件中。\n*   访问服务器上的文件。\n*   收集关于用户的任何信息，包括电子邮箱或\
  \ IP 地址。\n*   提交基于信用卡的购买以进行授权和支付。\n*   创建多人游戏。\n*   直接从服务器数据库获取数据。\n*   处理文件上传。\n\
  \nJavaScript 无法完成这些大多数事情，因为它是行业内所谓的客户端编程语言，这意味着它运行在用户的浏览器上（程序员喜欢称之为*客户端*）。有所谓的服务器端\
  \ JavaScript 工具可以完成其中的某些事情，但它们非常复杂，因此超出了本书的范围。幸运的是，客户端 JavaScript 可以做的事情太多了，以至于你完全不用担心没事可。\n\
  \n\n\n你不必担心 浏览器无法处理 JavaScript，因为所有现代浏览器都支持 JavaScript 已经很久了。然而，你可能需要担心那些不支持 JavaScript\
  \ 的人。虽然很罕见，但确实有一些人关闭了浏览器的 JavaScript 功能。为什么有人会这样做呢？许多人禁用 JavaScript 是因为他们担心安全，不希望将\
  \ cookie 写入他们的硬盘，等等。\n\n为了处理这些不墨成规的人，请在页面的 `body` 中放置 `<noscript>` 标签：\n\n```html\n\
  <noscript>\n<p>\n嘿，你的浏览器禁用了 JavaScript！\n</p>\n<p>\n好的，太酷了，也许你更喜欢这个页面的这个 <a href=\"\
  no-js.html\">非 JavaScript 版本</a>。\n</p>\n</noscript>\n```\n\n如果浏览器启用了 JavaScript，浏览器就不会显示\
  \ `<noscript>` 标签内的任何文本。但是，如果禁用了 JavaScript，浏览器就会向用户显示 `<noscript>` 标签内的文本和标签。\n\
  \n如果你想在禁用 JavaScript 的情况下测试你的网站，以下是在一些常用浏览器中使用的技术：\n\n*   **Chrome（桌面版）：** 打开“设置”，点击“隐私和安全”，点击“网站设置”，点击“JavaScript”，然后选择“不允许网站使用\
  \ JavaScript”选项，如图图 1-1 所示所示![Google Chrome 中禁用 JavaScript 的截图](img/9781394164684-fg040101.png)\n\
  \    图 1-1： Google Chrome 中禁用 JavaScript。\n\n*   **Chrome（Android）：** 打开“设置”，点击“网站设置”，点击“JavaScript”，然后将\
  \ JavaScript 开关切换到关闭。\n*   **Edge：** 打开“设置”，点击“设置菜单”，点击“Cookie 和网站权限”，点击“JavaScript”，然后将“允许”开关切换到关闭。\n\
  *   **Safari (macOS)：** 打开“设置”，点击“高级”选项卡，选择“在菜单栏中显示开发菜单”，然后关闭“设置”。选择“开发 ⇒ 禁用 JavaScript”。\n\
  *   **Safari (iOS 或 iPadOS)：** 打开“设置”，点击“Safari”，点击“高级”，然后将 JavaScript 开关切换到关闭。\n\
  *   **Firefox（桌面版）：** 在地址栏中输入 `about:config` 并按回车或返回键。如果 Firefox 显示警告页面，点击“接受风险并继续”以显示高级偏好页面。在“搜索偏好名称”框中输入\
  \ `javascript`。在搜索结果中查找 `javascript.enabled` 偏项。在该偏项的最右侧，点击切换按钮将该偏项的值从 `true` 更改为\
  \ `false`，如图图 1-2 所示。\n![Firefox 中禁用 JavaScript 的截图](img/9781394164684-fg040102.png)\n\
  \    图 1-2： Firefox 中禁用 JavaScript。\n\n### 处理非常旧的浏览器\n\n在本书中，你将学习名为 ECMAScript 2015\
  \ 的 JavaScript 版本，也称为 ECMAScript 6，或者简称为 `ES6`。为什么特别选择这个版本，而不是之后的任何版本？原因有两个：\n\n\
  *   ES6 具有极佳的浏览器支持，超过 98% 的当前浏览器都支持 ES 6 发布的功能。后续版本的 JavaScript 的支持程度较少。\n*   ES6\
  \ 包含了你为页面添加各种有用且有趣的动态功能所所需的所有内容。除非你是一个专业程序员，否则 JavaScript 后续版本发布的功能远超你的需求。\n\n那么，那百分之二不支持\
  \ ES6 的浏览器又该怎么办呢？\n\n首先，要知道因 ES6 特性而卡顿的浏览器数量每天都在减少。诚然，现在是 2%（实际上大约是 1.7%），但六个月后将变为\
  \ 1%，一年后将变为 0.5%，以此类推，直到这些数字小到无法测量。\n\n其次，不支持 ES6 的浏览器百分比因地区而异（例如，非洲许多国家较高）并因环境而异。大多数运行不支持完全支持\
  \ ES6 的浏览器的人都在使用 Internet Explorer 11，而且其中大多数人处于无法升级的情况（例如某些企业环境）。\n\n如果运气不好，你的网页吸引了极高比例的这些旧浏览器，你可能需要放弃\
  \ ES6 的强大特性，转而使用 ECMAScript 5 经过久验证的功能。为此，每当我介绍每个新的 JavaScript 特性时，都会指出那些随 ES6 引入的特性，并让你如果你想使用\
  \ ES5，是否有简单的回退方案或替代方案（在 JavaScript 行业中称为 polyfill 补丁）。\n\n### 在你的代码中添加注释\n\n一个只有几行的脚本通常易于阅读和理解。然而，你的脚本不会一直那么简单，这些更长、更复杂的创建将变得同样难以阅读。（如果你在首次编写代码几周或几个月后再次查看代码，这种难度会尤为显著。）为了帮助你解读代码，在整个脚本中大量使用注释是一种良好的编程习惯。*注释*是描述或解释语句或一组语句的文本。浏览器会忽略注释，因此你可以在脚本中随意添加。\n\
  \n对于短的单行注释，使用双斜杠 `//`。在行开头放置 `//` 然后输入你的注释。例如：\n\n```javascript\n// 显示修改日期\ndocument.write(\"\
  最后修改于 \" + document.lastModified);\n```\n\n你也可以使用 `//` 注释三行的文本，只要每行都以 `//` 开头。但是，如果你的注释超过了三行，最好使用多行注释，它们以\
  \ `/*` 开头并 `*/` 结尾。例如：\n\n```javascript\n/*\n此脚本演示了使用 document.write() 方法\n向网页写入日期和时间\n\
  此脚本版权所有 Paul Fedries。\n*/\n```\n\n![警告](img/warning.png) 虽然在你刚开始时添加很多注释是可以的，但不必对每个内容都添加注释。如果一个语句很简单或其目的显而易见，就忘记注释继续吧\n\
  \n### 创建外部 JavaScript 文件\n\n在书中第一章中，我介绍了如何通过在页面头部中插入 `<script>` 和 `</script>` 标签（即\
  \ `<head>` 和 `</head>` 标签之间），或有时插入页面主体（即 `<body>` 和 `</body>` 标签之间）来添加 JavaScript\
  \ 代码。然后你在 `<script>` 和 `</script>` 标签之间编写代码。\n\n如果脚本较短，这种将其放在页面内并没有问题。但如果你的脚本占据了数十甚至数百行，你的\
  \ HTML 代码看起来就会很杂乱。另一个问题是你需要在多个页面使用相同的代码。诚然，你可以将代码复制到每个需要的页面中，但如果你以后对其进行了更改，就需要更新每个使用该代码的页面。\n\
  \n这两个问题的解决方案是将代码移出 HTML 文件并放入外部 JavaScript 文件。移动代码可以将 HTML 文件中的 JavaScript 呈现减少到单行（你很快就会学会），并意味着你可以通过编辑外部文件来更新代码。\n\
  \n关于使用外部 JavaScript 文件有几点注意：\n\n*   文件必须使用纯文本格式。\n*   命名文件时使用 `.js` 扩展名。\n*   不要在文件中使用\
  \ `<script>` 标签。直接输入你的语句，就像在 HTML 文件中编写一样。\n\n\n\n\n*   浏览器执行外部文件中语句的规则与在 HTML 文件中执行语句的规则完全相同。也就是说，函数之外的语句当浏览器遇到你的文件引用时会自动执行，而函数内部的语句在函数被调用之前是不会执行的。（不确定什么是“函数”吗？你可以在第\
  \ 4 本的第 5 章中了解到详细信息。）\n\n要让浏览器知道存在外部 JavaScript 文件，请向 `<script>` 标签添加 `src` 属性。例如，如果外部文件名为\
  \ `myscripts.js`，则你的 `<script>` 标签设置如下：\n\n```html\n<script src=\"myscripts.js\"\
  >\n```\n\n此示例假设 `myscripts.js` 文件与 HTML 文件位于同一目录下。如果文件位于不同的目录，请相应调整 `src` 的值。例如，如果\
  \ `myscripts.js` 文件位于名为 `scripts` 的子目录中，你应该使用以下代码：\n\n```html\n<script src=\"scripts/myscripts.js\"\
  >\n```\n\n你甚至可以通过指定完整的 URL 作为 `src` 的值，来指定另一个网站（推测是你自己的网站！）的文件：\n\n```html\n<script\
  \ src=\"http://www.host.com/myscripts.js\">\n```\n\n例如，以下代码显示了一个名为 `footer.js` 的单行外部\
  \ JavaScript 文件：\n\n```javascript\ndocument.write(\"This page is Copyright \" +\
  \ new Date().getFullYear());\n```\n\n这条语句写入了“Copyright”文本，随后是当前年份。（我知道：这段代码现在看起来像是一些胡言乱语。别担心，因为当我在第\
  \ 4 本的第 8 章中讨论 JavaScript Date 对象时，你会确切知道这里发生了什么。）\n\n下面的代码显示了一个包含外部 JavaScript\
  \ 文件引用的 HTML 文件（查看本书示例文件中的 bk04ch01/example01.html）：\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Using an External JS\
  \ File</title>\n</head>\n<body>\n<p>\nRegular page doodads go here.\n</p>\n<hr>\n\
  <footer>\n<script src=\"footer.js\">\n</script>\n</footer>\n</body>\n</html>\n```\n\
  \n当你加载该页面时，浏览器会逐行运行 HTML。当它运行到 `<footer>` 标签时，它会注意到 `<script>` 标签引用的外部 JavaScript\
  \ 文件。浏览器加载该文件，然后运行文件中的代码，代码会将版权信息写入页面，如图 1-3\n\n图 1-3： 此页面使用外部 JavaScript 文件显示页脚消息。\n\
  \n第 2 章\n\n# 理解变量\n\n本章内容\n\n* ![项目](img/check.png) **弄懂变量**\n* ![项目](img/check.png)\
  \ **为变量命名**\n* ![项目](img/check.png) **介绍 JavaScript 数据类型**\n* ![项目](img/check.png)\
  \ **搞定数字**\n* ![项目](img/check.png) **将字符串连接在一起**\n\n*一个人的常数是另一个人的变量。*\n\n—艾兰·珀利斯\
  \ (ALAN PERLIS)\n\n你可能听说过——甚至可能知道——某些人由于意外或不幸，失去了保留短期记忆的能力。如果你向其中某人介绍自己，他们五分钟后会再次询问你的名字。他们生活在永恒的当下，在每天的每一分钟都在重新体验世界。\n\
  \n我确定你现在一定在想，以上这些内容与编码有什么关系呢？仅仅是，默认情况下，你的 JavaScript 程序也过着没有短期记忆的生活。浏览器一次执行一条语句执行你的代码，直到没有更多语句需要处理为止。这一切都发生在永恒的当下。啊，但注意，我将这种缺乏短期记忆称为脚本的“默认”状态。它并不是唯一的状态，这意味着情况可以有所不同。你有权赋予你的脚本短期记忆的礼物，而你通过使用被称为“变量”的方便的小段代码块来实现这一点。在本章中，你将深入研究变量，这是一个基础且至关重要的编程主题。你将研究变量是什么、你可以对它们做什么，以及如何在你的\
  \ JavaScript 代码中运用它们。\n\n## 理解变量\n\n为什么脚本需要短期记忆？因为编码时出现的最常见概念之一就是需要存储一个临时值以便以后使用。在大多数情况下，你希望在同一个脚本中稍后使用该值。然而，你可能还需要在其他脚本中使用它，用于填充\
  \ HTML 表单，或者作为更大或更复杂计算的一部分。\n\n例如，你的页面可能有一个按钮，可以在大字体大小和普通字体大小之间切换页面文本，因此你需要某种方式“记住”那个选择。同样，如果你的脚本执行了计算，你可能需要留出一个或多个计算值供以后使用。例如，如果你正在构建一个购物车脚本，你可能需要计算总额。\n\
  \n在编程中，为以后保存值的方法是将其存储在变量中。*变量*是一块预留用于存储数据的小块内存。好消息是，数据存储和检索的具体细节在幕后完成的，所以这不是你需要担心的事情。作为一名编码员，与变量工作只涉及三件事：\n\
  \n*   创建（或*声明*）变量\n*   为这些变量赋值\n*   将变量包含语句中\n\n接下来的三个部分将介绍细节。\n\n### 使用 let 声明变量\n\
  \n创建变量的过程在编程术语中被称为*声明*。所有声明实际上的意思就是你为变量提供一个名称，并告诉浏览器留出一点内存来存放你最终存储的任何内容。在 JavaScript\
  \ 中声明变量，使用 `let` 关键字，后面跟着一个空格、变量名以及通常的行尾分号。例如，要声明名为 `interestRate` 的变量，你使用以下语句：\n\
  \n```javascript\nlet interestRate;\n```\n\n![记住](img/remember.png) 在声明变量时，有几点需要注意：\n\
  \n*   **只声明一次变量**：虽然你可以在脚本中根据需要多次使用变量，但变量只需声明一次。尝试多次声明变量会导致错误。\n*   **使用注释描述每个变量**：变量往往会激增，以至于很难记住每个变量代表什么。你可以通过在变量声明后直接添加注释来使每个变量的目的清晰可见，如下：\n\
  \n  ```javascript\n  let interestRate; // 贷款计算的年利率\n  ```\n*   **在使用之前声明变量**：如果你在声明之前使用变量，你将得到错误。\n\
  \n  ![记住](img/remember.png) 在上述两项中，当我说你会“得到错误”时，我不是指错误消息会弹在屏幕上。你唯一注意到的将是脚本没有运行。要读取错误消息，你需要访问浏览器的\
  \ Web 开发工具，这项任务我在第 4 本的第 10 章中进行了详细的介绍。\n\n*   **在第一次使用之前声明每个变量**：如果你遵循这一简单规则，即在第一次使用变量之前（或尽可能靠近）声明每个变量，会让你的编程和调试（参考第\
  \ 4 本[第 10 章](#c27.xhtml））生活变得简单得多。\n\n\n\n\n\n![技术细节](img/technicalstuff.png) `let`\
  \ 关键字引入于 ECMAScript 2015 (ES6)。如果你需要支持非常旧的浏览器——我说的就是*你*，Internet Explorer 11 及更早版本——请改用\
  \ `var` 关键字。\n\n### 在变量中存储值\n\n在声明变量之后，你的下一个任务是给它赋一个值。你使用赋值运算符——等号 (`=`)——将值存储在变量中，如下通用语句所示：\n\
  \n`variableName` = `value;`\n\n这里有一个将值 `0.06` 赋值给名为 `interestRate` 变量的示例：\n\n`interestRate\
  \ = 0.06;`\n\n注意，如果你提前知道变量的初始值，可以将声明和初始赋值合并为单个语句，如下：\n\n`let interestRate = 0.06;`\n\
  \n需要记住，对于使用 `let` 关键字声明的变量，你可以随地更改该变量的值。例如，如果你赋给 `interestRate` 变量的值是年利率，稍后你的代码可能需要处理月利率（即年利率除以\
  \ 12）。与其手动计算，不如直接在代码中使用除法运算符 (`/`)：\n\n`interestRate = 0.06 / 12;`\n\n关于使用变量赋值的最后一点说明，请看一种经常让初学者感到困惑的变体。具体来说，你可以设置一个语句，通过更改变量现有值来为其赋新值。这里有一个示例：\n\
  \n`interestRate = interestRate / 12;`\n\n如果你从未遇到过这种语句，它看起来可能有点不符合逻辑。一个东西怎么能等于它自己除以\
  \ 12 呢？理解这种语句的在于记住浏览器总是先评估语句的右侧——即等号 (`=`) 右侧的表达式。换句话说，它获取 `interestRate` 的当前值（即\
  \ `0.06`），并将其除以 12。大功告成后，结果会被存储在 `interestRate` 中。关于运算符和表达式的更深入讨论，请参阅第 4 本书第 3 章。\n\
  \n![记住](img/remember.png) 由于这种“先求表达式后存储结果”的行为，JavaScript 赋值语句不应被读为“变量*等于*表达式”。相反，将其理解为“变量*被设置为*表达式”或“变量*采用表达式所给的值*”更符合逻辑。这样读取赋值语句有助于强化一个重要概念：表达式的结果被存储在变量中。\n\
  \n### 学习另一种声明变量的方法：const\n\n*variable*（变量）一词意味着赋值给变量的值是允许*变化*的，你声明的大多数变量都是如此。大部分是，但不是所有。有时，你的脚本需要使用一个保持不变的值。例如，假设你正在构建一个将英里转换为公里的计算器。转换因子是\
  \ 1.60934，该值在整个脚本执行过程中将保持不变。\n\n为了便于阅读，将此类值存储在变量是一种良好的编程习惯。然而，如果你使用 `let` 进行此类声明，就有可能在代码某处意外更改该值，因为用\
  \ `let` 声明的变量是可以改变的。\n\n为了避免意外更改想要保持的值，你可以使用 `const` 关键字声明变量。通用语法如下：\n\n`const`\
  \ `variableName` = `value;`\n\n注意，与 `let` 不同，在用 `const` 声明变量时必须为它赋值。这里有一个声明名为 `milesToKilometers`\
  \ 的变量并赋值为 `1.60934` 的示例：\n\n`const milesToKilometers = 1.60934;`\n\n![记住](img/remember.png)\
  \ 在变量值永远不会改变的情况下，使用 `const` 相比 `let` 是否有真正的优势？是的的，有两个非常好的处：\n\n*   使用 `const` 关键字是一个提醒，提醒你正在处理一个不变的值，这有助于你记住不要给变量赋新值。\n\
  *   如果你尝试更改用 `const` 声明的变量的值，将产生错误，这是另一种提醒你变量值是不允许被乱动的方式。\n\n![提示](img/tip.png)\
  \ 鉴于这些优势，许多 JavaScript 程序员会用 `const` 声明每个变量，并仅对他们知道会变化的变量使用 `let`。随着代码的进展，如果你发现某个\
  \ `const` 变量需要更改，可以回去将 `const` 改为 `let`。\n\n### 在语句中使用变量\n\n在声明并赋值变量后，你就可以在其他语句中使用该变量了。当浏览器遇到该变量时，它会进入计算机内存，获取变量的当前值，然后将该值替换到语句中。以下代码展示了一个示例（查看本书中的示例文件\
  \ bk04ch02/example01.html）：\n\n```\nlet interestRate = 0.06;\ninterestRate = interestRate\
  \ / 12;\ndocument.write(interestRate);\n```\n\n这段代码声明了一个名为 `interestRate` 的变量，值为\
  \ `0.06`；随后它将该值除以 12 并将结果存储在变量中。`document.write()` 语句随后显示变量的当前值，如图 2-1 所示。\n\n![浏览器替换变量当前值的截图](img/9781394164684-fg040201.png)\n\
  \n图 2-1：浏览器替换变量的当前值。\n\n以下代码展示了一个稍有不同的示例（查看 bk04ch02/example02.html）：\n\n```\nlet\
  \ firstName;\nfirstName = prompt(\"Please tell me your first name:\");\ndocument.write(\"\
  Welcome to my website, \" + firstName);\n```\n\n该脚本使用 `prompt()` 方法（稍后会解释）要求用户输入他们的名字，如图\
  \ 2-2 所示。\n\n![脚本首先提示用户姓名的截图](img/9781394164684-fg040202.png)\n\n图 2-2：脚本首先提示用户名。\n\
  \n![脚本随后使用名字显示个性化消息的截图](img/9781394164684-fg040203.png)\n\n图 2-3：脚本随后使用名字显示个性化消息。\n\
  \n\n\n\n*   变量名的其余部分可以包含任何字母、数字或下划线。你不能使用任何其他字符，包括空格、符号和标点符号。\n*   与 JavaScript\
  \ 的其他部分一样，变量名是区分大小写的。也就是说，名为 `InterestRate` 的变量被认为与名为 `interestRate` 的变量完全不同的变量。\n\
  *   变量名的长度没有限制。\n*   你不能将 JavaScript 的`reserved words`（保留字）作为变量（例如 `let`、`const`、`var`、`alert`\
  \ 或 `prompt`）。所有的编程语言都有一组内部使用的词汇，这些词不能作为变量名，因为这样做会导致混乱（或更糟）。请查看本章后文的“JavaScript\
  \ 保留字”以获取完整列表。\n\n### 良好的变量命名建议\n\n声明变量的过程不需要费太多脑筋，但这并不意味着你应该随手输入脑子里想到的任何旧变量名。多花几秒钟，遵循这些指南想出一个好名字：\n\
  \n*   **让名称具有描述性。** 诚然，使用只有几个字符的名字更容易输入，但我向你保证，当你以后回看脚本时，你不会记得这些变量代表什么。例如，如果你想让一个变量代表账号，请使用\
  \ `accountNumber` 或 `accountNum`，而不是 `acnm` 或 `accnum`。\n*   ![记住](img/remember.png)\
  \ **尽量避免使用单字母命名。** 尽管最好避免单字母变量名，但在某些地方这种短名称是可以接受的，例如在构建循环时，正如第 4 卷第 4 章所示。\n*  \
  \ **使用不带空格的多个单词。** 创建描述性变量名的最佳方法是使用多个单词。然而，因为 JavaScript 不欢迎名称中出现空格，你需要某种方法来分隔单词以保持名称的可读性。使用多单词变量名的两种约定是\
  \ `camelCase`（驼峰命名法），即将单词挤在一起并将除第一个单词以外的所有字母大写（例如 `lastName`），或者用下划线分隔每个单词（例如 `last_name`）。我更倾向于前者风格，因此在整本书中一直使用它。\n\
  *   **使用不同的命名规范。** 为 JavaScript 变量使用一种命名规范，为 HTML 标识符和 CSS 类使用另一种。例如，如果你对 JavaScript\
  \ 变量使用 `camelCase`，则对 `id` 值和类名使用连字符。\n*   **将变量名与 JavaScript 关键字区分开。** 尽量让你的变量名看起来与\
  \ JavaScript 的关键字和其他内置术语（如 `alert`）尽可能不同。区分变量名有助于避免混乱——当你看到一个术语却不记得它是变量还是 JavaScript\
  \ 词汇时。\n*   **不要让你的名字太长。** 虽然应该摒弃短小晦涩的变量名而转而使用更长、描述性的名称，但这意味着你应该使用整个句子。极长的名字效率低下，因为输入需要太长时间，而且它们很危险，因为名字越长，你就越容易拼错。2\
  \ 到 4 个单词、8 到 20 个字符的名字就足够了。\n\n### 理解字面量数据类型\n\n在编程中，变量的`data type`（数据类型）指定了存储在变量中的数据类型。数据类型是一个核心概念，因为它决定了两个或多个变量如何组合（例如数学运算），还决定了它们是否可以组合。`Literals`（字面量）是一种特殊的数据类型，它们涵盖了那些固定的（即使是暂时的）值。例如，考虑以下变量赋值语句：\n\
  \n```\nlet todaysQuestion = \"What color is your parachute?\";\n```\n\n在这里，文本 `\"\
  What color is your parachute?\"` 是一个字面量字符串值。JavaScript 支持三种字面量数据类型：数值、字符串和布尔值。接下来的三节将讨论每种类型。\n\
  \n### 使用数值字面量\n\n与许多其他编程语言不同，JavaScript 对所有数字一视为仁，因此在处理两种基本的数值字面量（整数和浮点数）时，你不需要任何特殊操作：\n\
  \n*   **整数：** 这些是不带分数部分或小数部分的数字。因此，你使用一个或多个数字的序列来表示整数，如下例：\n\n```\n0\n42\n2001\n\
  -20\n```\n*   **浮点数：** 这些是带有分数部分或小数部分的数字。因此，你通过先写整数部分，然后是小数点，最后是分数部分或小数部分来表示浮点数，如下例：\n\
  \n```\n0.07\n3.14159\n-16.6666667\n7.6543e+21\n1.234567E-89\n```\n\n#### 指数计数法\n\
  \n最后两个浮点数示例需要更多的解释。这两个例子使用了`exponential notation`（指数计数法），这是一种表示非常大或非常小的浮点数的有效方法。指数计数法使用\
  \ `e`（或 `E`）后跟`exponent`（指数），指数是一个带有加号（`+`）或减号（`-`）的数字。\n\n将数字的第一部分（即 `e` 或 `E`\
  \ 的部分）乘以 10 的指数次方。这是一个示例：\n\n```\n98764e+5\n```\n指数是 5，10 的 5 次方是 100,000。所以，98764\
  \ 乘以 100,000 的结果是 9876400000。\n\n另一个例子：\n\n```\n34567e-4\n```\n指数是 -4，10 的 -4 次方是\
  \ 0.0001。所以，34567 乘以 0.0001 的结果是 3.4567。JavaScript 有大量的内置功能用于数学计算。要了解这些细节，请查看第 4\
  \ 卷第 8 章。\n\n![技术细节](img/technicalstuff.png) 我之前提到 JavaScript 对所有数值字面量一视为仁其实意味着……\n\
  \n你在职业生涯的大部分时间内都会处理常用的十进制系统。然而，万一你需要处理十六进制数字，本节将展示 JavaScript 如何处理它们。\n\n十六进制系统使用数字\
  \ 0 到 9 以及字母 A 到 F（或 a 到 f），这些字母代表十进制 10 到 15。所以，十进制中的 16 在十六进制中实际上是 10。在 JavaScript\
  \ 中指定十六进制数字，以 `0x`（或 `0X`）开头，如下：\n\n```\n0x23\n0xff\n0X10ce\n```\n\n### 使用字符串字面量\n\
  \n*字符串字面量*是一个或多个字母、数字或标点符号的序列，包含在双引号（`\"`）或单引号（`'`）中。以下是一些例子：\n\n```\n\"HTML, CSS,\
  \ and JavaScript\"\n'August 23, 1959'\n\"\"\n\"What's the good word?\"\n```\n\n\
  字符串 `\"\"`（或 `''` — 两个连续的单引号）被称为*空字符串*（null string）。它代表一个不包含任何字符的字符串。\n\n#### 在字符串中使用引号\n\
  \n\n\n上一节节中的最后一个示例表明，在由另一种引号（如 `\"`）括围的字符串内部插入一个或多个实例的引号（例如 `'`）是允许的。当你需要将一个字符串嵌入另一个字符串中时，嵌套引号会非常有用，这种情况非常常见（特别是在\
  \ HTML 标签中使用少量的 JavaScript 代码时）。这里有一个示例：\n\n```\nonsubmit=\"processForm('testing')\"\
  ;\n```\n\n然而，在字符串内部插入与封装该字符串的相同的引号的一个或多个实例是非法的，如下例所示：\n\n```javascript\n\"This is\
  \ \"illegal\" in JavaScript.\";\n```\n\n### 理解转义序列\n\n如果你必须在一个由双引号括围的字符串中包含（例如）双引号，该怎么办？嵌套相同类型的引号虽然罕见，但如果你在双引号之前加上一个反斜杠（`\\\
  `），这是可以的，如下所示：\n\n```javascript\n\"The double quotation mark (\\\") encloses this\
  \ string.\";\n```\n\n`\\\"` 组合被称为转义序列。你可以将反斜杠与其他许多字符组合形成其他转义序列，每个转义序列都能让浏览器表示一个其本身非法或无法通过其他方式表示的字符。Table\
  \ 2-1 列出了最常用的转义序列。\n\n| Escape Sequence | 它代表的字符 |\n| --- | --- |\n| `\\'` | 单引号\
  \ |\n| `\\\"` | 双引号 |\n| `\\b` | 退格 |\n| `\\f` | 换页 |\n| `\\n` | 换行 |\n| `\\r` |\
  \ 回车 |\n| `\\t` | 制表符 |\n| `\\\\` | 反斜杠 |\n\nTABLE 2-1 Common JavaScript 转义序列\n\n\
  以下代码显示了一个示例脚本，它使用 `\\n` 转义序列在警告框中多行显示文本。\n\n```javascript\nalert(\"This is line\
  \ 1.\\nSo what. This is line 2.\");\n```\n\nFigure 2-4 显示了结果。\n\n要学习如何组合两个或多个字符串字面量，请参阅第\
  \ 4 册，第 3 章。此外，JavaScript 有一系列很好的字符串处理功能，我在第 4 册第 8 章中讨论了它们。\n\n![截图 使用 \\n 转义序列允许你格式化文本使其在不同行显示](img/9781394164684-fg040204.png)\n\
  \nFIGURE 2-4: 使用 `\\n` 转义序列允许你格式化文本使其在不同行显示。\n\n#### 处理布尔字面量\n\n布尔是所有字面量数据类型中最简单的，因为它们只能取两个值之一：`true`\
  \ 或 `false`。这种简单性可能让布尔看起来并不用，但在 JavaScript 编程中，测试特定变量或条件真假的能力是无价的。\n\n你可以直接将布尔字面量赋值给变量，如下：\n\
  \n```javascript\ntaskCompleted = true;\n```\n\n或者，你可以使用表达式隐式地处理布尔值：\n\n```javascript\n\
  currentMonth === \"August\"\n```\n\n比较表达式 `currentMonth === \"August\"` 询问：变量 `currentMonth`\
  \ 的值等于字符串 `\"August\"` 吗？如果是，表达式求值为布尔值 `true`；如果不是，表达式求值为 `false`。我在第 4 册第 3 章中讨论了更多关于比较表达式的内容。\n\
  \n## JavaScript 关键字\n\n如前所述，JavaScript 有许多在为变量命名时需要避开的关键字。Table 2-2 列出了 JavaScript\
  \ 关键字列表。将这些任何词用变量名或函数名是非法的。\n\n| `abstract` | `arguments` | `await` | `boolean`\
  \ |\n| `break` | `byte` | `case` | `catch` |\n| `char` | `class` | `const` | `continue`\
  \ |\n| `debugger` | `default` | `delete` | `do` |\n| `double` | `else` | `enum`\
  \ | `eval` |\n| `export` | `extends` | `false` | `final` |\n| `finally` | `float`\
  \ | `for` | `function` |\n| `goto` | `if` | `implements` | `import` |\n| `in` |\
  \ `instanceof` | `int` | `interface` |\n| `let` | `long` | `native` | `new` |\n\
  | `null` | `package` | `private` | `protected` |\n| `public` | `return` | `short`\
  \ | `static` |\n| `super` | `switch` | `synchronized` | `this` |\n| `throw` | `throws`\
  \ | `transient` | `true` |\n| `try` | `typeof` | `var` | `void` |\n| `volatile`\
  \ | `while` | `with` | `yield` |\n\n\n\n\n尽可能模糊地说，一个 `expression`（表达式）是符号、单词和数字的集合，它们执行计算并产生结果。我知道这是一个非常模糊的定义，所以我会让它变得更具体一些。\n\
  \n当你在餐厅吃完饭拿到账单时，你可能做的第一件事就是拿出智能手机，使用计算器计算出小费金额。服务和食物很好，所以你认为 20% 是合适的。手拿着手机，你输入账单总额，点击乘法按钮，点击\
  \ 20%，然后点击等号。*大搞定！* 小费金额出现在屏幕上，你就可以准备走了。\n\nJavaScript 的 `expression` 就像这种过程，因为它接收一个或多个输入（例如账单总额和小费百分比），并以某种方式将它们结合——例如，使用乘法。在表达式的术语中，输入被称为\
  \ `operands`（操作数），它们通过被称为 `operators`（运算符）的特殊符号结合。\n\n*   **operand（操作数）：** `expression`\
  \ 的输入值。换句话说，它是 `expression` 处理以产生结果的原始数据。它可以是一个数字、字符串、`variable`（变量）、函数结果（参见第 4\
  \ 卷第 5 章）或对象属性（参见第 4 卷第 6 章）。\n*   **operator（运算符）：** 代表对一个或多个 `operands` 执行特定操作的符号。例如，`*`\
  \ 运算符代表乘法，`+` 运算符代表加法。我在本章中会讨论各种 JavaScript `operators`。\n\n例如，这里有一个计算小费金额并将结果赋值给\
  \ `variable` 的 `expression`：\n\n```\ntipAmount = billTotal * tipPercentage;\n```\n\
  \n`expression` 是等号（`=`）右侧的所有内容。在这里，`billTotal` 和 `tipPercentage` 是 `operands`，而乘号（`*`）是\
  \ `operator`。\n\n![Technical stuff](img/technicalstuff.png) 表达式的结果始终具有特定的数据类型——数值、字符串或\
  \ `Boolean`。因此，当你处理 `expressions` 时，务要记住你需要什么类型的结果，然后据此选择合适的 `operands` 和 `operators`。\n\
  \n![Remember](img/remember.png) 我喜欢的另一个比喻 `operands` 和 `operators` 的例子是语法的——也就是说，如果你把一个\
  \ `expression` 看作一个句子，那么 `operands` 就是句子中的名词（事物），而 `operators` 就是句子中的动词（动作）。\n\n\
  ## 构建数值表达式\n\n在餐厅账单上计算小费金额是一项数学计算，所以你可能认为 JavaScript `expressions` 将大部分是数学性的。如果我站在你面前，并且碰巧带着一盒金星星，我肯定会给你一个，因为是的，基于数学的\
  \ `expressions` 可能是你遇到的最常见类型。\n\n在 JavaScript 中，数学计算被称为 `numeric expression`（数值表达式），它结合数值\
  \ `operands` 和算术 `operators` 来产生数值结果。本节将讨论所有的 JavaScript 算术 `operators` 并向你展示如何更好地使用它们来构建实用方便的数值\
  \ `expressions`。\n\n### 快速查看算术运算符\n\nJavaScript 的基本算术 `operators` 与你手机上的计算器 App\
  \ 或电脑键盘数字键盘上的运算符大体相同，外加几个用于高级操作的 `operators`。表 3-1 列出了你可以在 JavaScript `expressions`\
  \ 中使用的基本算术 `operators`。（在随后的章节中，我将详细讨论每一个。）\n\n| **Operator** | **Name** | **Example**\
  \ | **Result** |\n| --- | --- | --- | --- |\n| `+` | 加法 | `10 + 4` | `14` |\n| `++`\
  \ | 递增 | `10++` | `11` |\n| `-` | 减法 | `10 - 4` | `6` |\n| `-` | 负号 | `-10` | `-10`\
  \ |\n| `--` | 递减 | `10--` | `9` |\n| `*` | 乘法 | `10 * 4` | `40` |\n| `/` | 除法 |\
  \ `10 / 4` | `2.5` |\n| `%` | 取模 | `10 % 4` | `2` |\n\n表 3-1 JavaScript 算术运算符\n\n\
  JavaScript 还带了一些额外的 `operators`，它们结合了一些算术 `operators` 和赋值 `operator`（即谦虚的等号 `=`=`，它用于将值分配给\
  \ `variable`）。表 3-2 列出了这些所谓的“算术赋值” `operators`。\n\n| **Operator** | **Example**\
  \ | **Equivalent** |\n| --- | --- | --- |\n| `+=` | `x += y` | `x = x + y` |\n|\
  \ `-=` | `x -= y` | `x = x - y` |\n| `*=` | `x *= y` | `x = x * y` |\n| `/=` | `x\
  \ /= y` | `x = x / y` |\n| `^=` | `x ^= y` | `x = x ^ y` |\n| `%=` | `x %= y` |\
  \ `x = x % y` |\n\n表 3-2 JavaScript 算术赋值运算符\n\n### 使用加法运算符\n\n加法运算符（`+`）用于计算两个 `operands`\
  \ 的和。例如，考虑以下语句（bk04ch03/example01.html）：\n\n```\nwidthMax = widthContent + 100;\n\
  ```\n\n第三条语句将 `widthContent` 加 100，结果存储在 `widthMax` 变量中。\n\n### 使用递增 (++) 运算符\n\n\
  最常见的编程操作之一是对现有的 `variable` 或或其他操作数加 1。这种操作被称为对值进行*递增*（incrementing），通常写法如下：\n\n\
  ```\nsomeVariable = someVariable + 1;\n```\n\n然而，JavaScript 提供了一种更紧凑的替代方案，使用递增运算符（`++`），你将其直接放在变量名之后（查看\
  \ bk04ch03/example02.html）：\n\n```\nlet someVariable = 0;\nsomeVariable++;\n```\n\
  \n执行这两个语句后，`someVariable` 的值将变为 `1`。\n\n![Warning](img/warning.png) 现在认为使用递增运算符是不良习惯。为什么？大多数原因是技术性的，但主要原因是这个运算符有点晦涩，使代码难以阅读。几乎所有的现代代码大师都建议使用加赋值运算符（`+=`），而不是递增运算符（参见本章后面的“使用赋值运算符”）。\n\
  \n也就是说，而不是：\n\n```\nsomeVariable++;\n```\n\n而是使用：\n\n```\nsomeVariable += 1;\n```\n\
  \n### 使用减法和负号运算符\n\n减法运算符（`-`）从运算符左侧的数值值减去右侧的数值值。例如，考虑以下语句（bk04ch03/example03.html）：\n\
  \n```\nconst targetYear = 2025;\nconst birthYear = 1985;\nconst yearsDifference\
  \ = targetYear - birthYear;\n```\n\n第三条语句从 2025 中减去 1985，结果——40——存储在 `yearsDifference`\
  \ 变量中。\n\n负号运算符（`-`）使用相同的符号，但工作方式完全不同。你将其作为前缀附加到操作数前面。结果是一个与原始符号相反的新值。换句话说，对操作数应用负号运算符等同于将操作数乘以\
  \ -1。这意味着以下两个语句是完全相同的：\n\n```\nnegatedValue = -originalValue;\nnegatedValue = originalValue\
  \ * -1;\n```\n\n### 使用递减 (--) 运算符\n\n另一种常见的编程操作是从现有的变量或其他操作数减去 1。这种操作被称为对值进行*递减*（decrementing），通常的方法是像这样的语句：\n\
  \n```\nthisVariable = thisVariable - 1;\n```\n\n\n\n\n然而（你早就知道会有一个“但是”了），JavaScript\
  \ 提供了一个更简洁的替代方案，它利用了递减运算符（`--`），你将其放在变量名之后（`bk04ch03/example04.html`）：\n\n```javascript\n\
  let thisVariable = 1;\nthisVariable--;\n```\n\n在执行这两条语句后，`thisVariable` 的值将变为 `0`。\n\
  \n![Warning](img/warning.png) 与递增运算符一样，如今使用递减运算符也是不受欢迎的。相反，使用减法赋值运算符（`-=`）而不是递减运算符会让你的代码可读性更佳（参见本章稍后部分的“使用算术赋值运算符”）。\n\
  \n也就是说，与其用这种：\n\n```javascript\nthisVariable--;\n```\n\n不如用这种：\n\n```javascript\n\
  thisVariable -= 1;\n```\n\n### 使用乘法法 (*) 运算符\n\n乘法运算符（`*`）将两个操作数相乘。这是一个示例（`bk04ch03/example05.html`）：\n\
  \n```javascript\nconst columns = 8;\nconst columnWidth = 100;\nconst totalWidth\
  \ = columns * columnWidth;\n```\n\n当你想要计算使用多列的网页布局所占据的宽度时，可以使用这段代码。这段代码为变量 `columns`\
  \ 和 `columnWidth` 赋值了字面数值。然后它使用一个数值表达式将这两个值相乘，并将结果赋值给 `totalWidth` 变量。\n\n### 使用除法\
  \ (/) 运算符\n\n除法运算符（`/`）将一个数值除以另一个数值。你可以在派对上炫耀你的知识，记住斜杠（`/`）左侧的数字被称为被除数（`dividend`），而\
  \ `/` 右侧的数字被称为除数（`divisor`）：\n\n`dividend` / `divisor`\n\n这是一个示例（`bk04ch03/example06.html`）：\n\
  \n```javascript\nconst contentWidth = 600;\nconst windowWidth = 1200;\nconst contentRatio\
  \ = contentWidth / windowWidth;\n```\n\n你可以使用这段代码来计算页面内容当前使用的浏览器窗口宽度的比例。在代码中，变量\
  \ `contentWidth` 和 `windowWidth` 被赋予了字面数值，然后通过一个数值表达式将第一个值除以第二个值，结果存储在 `contentRatio`\
  \ 变量中。\n\n![Warning](img/warning.png) 每只要你使用除法运算符，就必须防范除数为 0 的情况。如果发生这种情况，你的脚本将产生\
  \ `Infinity` 结果，这几乎会破坏你所有的计算。在执行任何除法操作之前，你的脚本应该使用 `if()` 语句（参考第 4 册第 4 章]）检查除数是否为\
  \ 0，如果是，则取消除法或执行某种补救措施。\n\n### 使用模 (%) 运算符\n\n模运算符（`%`）将一个数字除以另一个数字，并将余数作为结果：\n\n\
  `dividend` % `divisor`\n\n例如，以下代码将值 `1` 存储在名为 `myRemainder` 的变量中，因为 5（`myDivisor`\
  \ 值；也称为模）除 16（`myDividend` 值）三次后余数为 1（`bk04ch03/example07.html`）：\n\n```javascript\n\
  const myDividend = 16;\nconst myDivisor = 5;\nconst myRemainder = myDividend % myDivisor;\n\
  ```\n\n在更实用的层，假设你正尝试设计一种网页配色方案，并想使用两种互补的颜色。“互补”（Complementary）意味着两种色调位于色轮的对侧，因此计算第二种颜色的方法是在第一个颜色的色调值上加上\
  \ 180。当第一个颜色的色调在 0 到 179 之间时，这种方法有效，得到的第二种颜色色调值在 180 到 359 之间。然而，初始色调为 180、181 等会产生\
  \ 360、361 等第二种色调，这些都是非法值。你可以使用这样的模表达式来解决这个问题（`bk04ch03/example07.html`）：\n\n```javascript\n\
  complementaryColor = (originalColor + 180) % 360;\n```\n\n这条语句给原始颜色加了 180，但随后使用\
  \ `% 360` 返回除以 360 的余数，以避免非法值。\n\n### 使用算术赋值运算符\n\n你的网页编码脚本经常会通过加上另一个操作数的值来更新变量的值。这是一个示例：\n\
  \n```javascript\ntotalInterestPaid = totalInterestPaid + monthlyInterestPaid\n```\n\
  \n程序员是一群追求效率的人，所以 `totalInterestPaid` 变量在那条语句中出现两次的事实，对一个普通程序员来说就像在嚼锡箔纸一样。JavaScript\
  \ 智囊团也讨厌那种事情，于是他们想出了加赋值运算符（`+=`），你可以像这样使用它（`bk04ch03/example08.html`）：\n\n```javascript\n\
  totalInterestPaid += monthlyInterestPaid;\n```\n\n是的，这条语句的作用与第一条完全相同，但少了 19 个字符。太棒了！\n\
  \n如果你需要从一个操作数中减去另一个，同样可以用旧方法：\n\n```javascript\nprincipleOwing -= monthlyPaid\n\
  ```\n\n![Warning](img/warning.png) 与递增递减运算符一样，算术赋值运算符的设计是为了节省手指并缩小脚本体积，特别是当你使用长变量名时：\n\
  \n```javascript\nprincipleOwing -= monthlyPaid\n```\n\n### 构建字符串表达式\n\n字符串表达式是指操作数中至少有一个是字符串，且结果也是字符串的表达式。字符串表达式非常直观，因为它们只有一个运算符需要处理：拼接（`+`）。你使用这个运算符来合并（拼接）字符串。例如，`\"\
  Java\" + \"Script\"` 返回 `\"JavaScript\"`。但请注意，拼接运算符与加法运算符是相同的，这会导致某些困惑。例如，`2 + 2`\
  \ 返回数值 `4`，因为操作数是数值。然而，`\"2\" + \"2\"` 返回字符串值 `22`，因为操作数是字符串。更的是，JavaScript 会根据上下文将数字转换为字符串：\n\
  \n- 如果表达式的第一个数是字符串，JavaScript 将表达式中的任何数字转换为字符串。例如，以下表达式返回字符串 `222`：\n`\"2\" + 2\
  \ + 2`\n\n- 如果表达式的前两个或更多操作数是数字，而表达式其余包含字符串，JavaScript 先处理数值部分，然后将结果转换为字符串。例如，以下表达式返回字符串\
  \ `42`：\n`2 + 2 + \"2\"`\n\n作为一个这种转换如何产生问题的示例，请考虑以下代码（`bk04ch03/example09.html`）：\n\
  \n```javascript\nconst preTipTotal = 10.00;\nconst tipAmount = preTipTotal * 0.15;\n\
  const message1 = \"Your tip is \";\nconst message2 = \"<br>Your total bill is \"\
  ;\ndocument.write(message1 + tipAmount + message2 + preTipTotal + tipAmount);\n\
  ```\n\n`preTipTotal` 变量存储了餐厅账单的总额，`tipAmount` 变量存储了总额的 15%。变量 `message1` 和 `message2`\
  \ 用字符串初始化，然后将结果写入页面。特别是 `preTipTotal + tipAmount` 表达式包含在 `document.write()` 方法中以显示总账单。然而，如图\
  \ 3-1 所示，显示的“总额”实际上是 `101.5`，而不是 `11.5`（10 加上 1.5 小费）。\n\n\n\n\n\n这里发生的情况是因为由于 `document.write()`\
  \ 方法中表达式的第一部分是一个字符串，JavaScript 将 `preTipTotal` 和 `tipAmount` 的值转换为字符串并对其进行了拼接，而不是相加。\n\
  \n![拼接而非相加 preTipTotal 和 tipAmount 值的截图。](img/9781394164684-fg040301.png)\n\n图 3-1:\
  \ 拼接而非相加 `preTipTotal` 和 `tipAmount` 值。\n\n要解决这个问题，你可以在单独的语句中执行加法，然后在 `document.write()`\
  \ 表达式中仅使用该和。以下代码演示了这种方法（`bk04ch03/example10.html`）：\n\n```\nconst preTipTotal =\
  \ 10.00;\nconst tipAmount = preTipTotal * 0.15;\nconst totalBill = preTipTotal +\
  \ tipAmount;\nconst message1 = \"Your tip is \";\nconst message2 = \"<br>Your total\
  \ bill is \";\ndocument.write(message1 + tipAmount + message2 + totalBill);\n```\n\
  \n声明了一个名为 `totalBill` 的新变量，用于存储 `preTipTotal + tipAmount` 的和。然后使用 `totalBill` 在\
  \ `document.write()` 表达式中显示该和，如 图 3-2 所示，它现在显示了正确的答案。\n\n![分别计算 preTipTotal 和 tipAmount\
  \ 解决了问题的截图。](img/9781394164684-fg040302.png)\n\n图 3-2: 分别计算 `preTipTotal` 和 `tipAmount`\
  \ 解决了问题。\n\n## 构建比较表达式\n\n你使用比较表达式来比较两个或多个数字、字符串、变量、属性或函数结果的值。如果表达式为真（true），则表达式结果被设置为布尔值\
  \ `true`；如果表达式为假（false），则表达式结果被设置为布尔值 `false`。你将在 JavaScript 代码中频繁地使用比较，因此理解它们是什么以及如何使用它们非常重要。\n\
  \n### 比较运算符\n\n表 3-3 总结了 JavaScript 的比较运算符。\n\n| 运算符 | 名称 | 示例 | 结果 |\n| --- | ---\
  \ | --- | --- |\n| `==` | 等于 | `10 == 4` | `false` |\n| `!=` | 不等于 | `10 != 4` |\
  \ `true` |\n| `>` | 大于 | `10 > 4` | `true` |\n| `<` | 小于 | `10 < 4` | `false` |\n\
  | `>=` | 大于等于 | `10 >= 4` | `true` |\n| `<=` | 小于等于 | `10 <= 4` | `false` |\n| `===`\
  \ | 严格相等 | `\"10\" === 10` | `false` |\n| `!==` | 严格不等于 | `\"10\" !== 10` | `true`\
  \ |\n\n表 3-3 JavaScript 比较运算符\n\n### 使用相等 (==) 运算符\n\n你使用相等运算符（`==`（通常也称为等号运算符）来比较两个操作数的值。如果两者的值相同，则比较返回\
  \ `true`；如果操作数的值不同，则比较返回 `false`。\n\n例如，在以下语句中，变量 `booksRead` 和 `weeksPassed` 包含相同的值，因此表达式\
  \ `booksRead == weeksPassed` 返回 `true`（查看 图 3-3 和 `bk04ch03/example11.html`）：\n\n\
  ```\nconst booksRead = 48;\nconst weeksPassed = 48;\nconst bookAWeek = booksRead\
  \ == weeksPassed;\ndocument.write(\"Me: I'm averaging a book a week, amirite?<br>\"\
  );\ndocument.write(\"JavaScript: \" + bookAWeek);\n```\n\n![表达式 booksRead == weeksPassed\
  \ 返回 true 的截图。](img/9781394164684-fg040303.png)\n\n图 3-3: 表达式 `booksRead == weeksPassed`\
  \ 返回 `true`。\n\n![警告](img/warning.png) 初学者和丰富的 JavaScript 程序员常犯的最常见错误之一是在比较表达式中使用\
  \ `=` 而不是 `==`。如果你的脚本没有正常运行或生成了错误，你应该检查的最要事项之一是你的相等运算符是否有两个等号。\n\n![记住](img/remember.png)\
  \ 这里的一点很重要：当两个操作数的值相同时，即使它们数据类型不同，相等运算符也会返回 `true`。（关于为什么发生这种情况的解释，请查看本章后面的“比较运算符和数据转换”。）\n\
  \n表达式 `booksRead == weeksPassed` 返回 `true`。\n\n### 使用不等于 (!=) 运算符\n\n你使用不等于运算符（`!=`）来比较两个操作数的值。如果值不同，则比较返回\
  \ `true`；如果操作数的值相同，则比较返回 `false`。\n\n例如，在以下语句中，变量 `currentFontSize` 和 `defaultFontSize`\
  \ 包含不同的值，因此表达式 `currentFontSize != defaultFontSize` 返回 `true`（`bk04ch03/example12.html`）：\n\
  \n```\nconst currentFontSize = 19;\nconst defaultFontSize = 16;\nconst isDifferent\
  \ = currentFontSize != defaultFontSize;\n```\n\n当两个操作数的值相同时，即使数据类型不同，相等运算符也会返回 `true`。\n\
  \n### 使用大于 (>) 运算符\n\n你使用大于运算符（`>`）比较两个操作数，判断左侧操作数的值是否大于右侧操作数。如果是，表达式返回 `true`；否则返回\
  \ `false`。\n\n例如，在以下语句中，`contentWidth` 变量的值大于 `windowWidth` 变量，因此表达式 `contentWidth\
  \ > windowWidth` 返回 `true`（`bk04ch03/example13.html`）：\n\n```\nconst contentWidth\
  \ = 1000;\nconst windowWidth = 800;\nconst tooBig = contentWidth > windowWidth;\n\
  ```\n\n### 使用小于 (<) 运算符\n\n你使用小于运算符（`<`）比较两个操作数，判断左侧操作数的值是否小于右侧操作数。如果是，表达式返回 `true`；否则返回\
  \ `false`。\n\n例如，在以下语句中，`kumquatsInStock` 和 `kumquatsSold` 的值相同，因此表达式 `kumquatsInStock\
  \ < kumquatsSold` 返回 `false`（查看 图 3-4 和 `bk04ch03/example14.html`）：\n\n```\nconst\
  \ kumquatsInStock = 3;\nconst kumquatsSold = 3;\nconst backordered = kumquatsInStock\
  \ < kumquatsSold;\ndocument.write(\"Are kumquats on back order? \" + backordered);\n\
  ```\n\n![表达式 kumquatsInStock < kumquatsSold 返回 false 的截图。](img/9781394164684-fg040304.png)\n\
  \n图 3-4: 表达式 `kumquatsInStock < kumquatsSold` 返回 `false`。\n\n### 使用大于等于 (>=) 运算符\n\
  \n你使用大于等于运算符（`>=`）比较两个操作数，判断左侧操作数的值是否大于或等于右侧操作数的值。如果这两个比较中至少有一个通过，则表达式返回 `true`；否则返回\
  \ `false`。\n\n例如，在以下语句中，`score` 变量的值大于 `prize1Minimum` 变量，且等于 `prize2Minimum` 变量。因此，表达式\
  \ `score >= prize1Minimum` 和 `score >= prize2Minimum` 都返回 `true`（`bk04ch03/example15.html`）：\n\
  \n```\nconst score = 90;\nconst prize1Minimum = 80;\nconst prize2Minimum = 90;\n\
  ```\n\n\n\n\n\n```javascript\nconst getsPrize1 = score >= prize1Minimum;\nconst\
  \ getsPrize2 = score >= prize2Minimum;\n```\n\n### 使用小于等于 (<=) 运算符\n\n你使用小于等于运算符\
  \ (`<=`) 来比较两个操作数，以确定 `<=` 左侧的操作数的值是否小于或等于 `=` 右侧操作数的值。如果这两个比较中有一个或两个都通过了，则该表达式返回\
  \ `true`；否则，它返回 `false`。\n\n例如，在以下语句中，`defects` 变量的值小于 `defectsMaximumA` 变量的值，并且等于\
  \ `defectsMaximumB` 变量的值。因此，表达式 `defects <= defectsMaximumA` 和 `defects <= defectsMaximumB`\
  \ 都返回 `true` (bk04ch03/example16.html):\n\n```javascript\nconst defects = 5;\nconst\
  \ defectsMaximumA = 10;\nconst defectsMaximumB = 5;\nconst getsBonus = defects <=\
  \ defectsMaximumA;\nconst getsRaise = defects <= defectsMaximumB;\n```\n\n### 比较运算符与数据类型转换\n\
  \n在之前节的示例中，我只使用数字来演示各种比较运算符。然而，你也可以使用字符串和布尔值。如果你的表达式只包含相同数据类型的操作数（例如，比较两个字符串或两个布尔值），那么这些比较是非常直观的。（不过，请参阅我在本章稍后章节中“在比较表达式中使用字符串”中的讨论。）\n\
  \n![技术细节](img/technicalstuff.png) 如果你在单个比较表达式中混合了数据类型，情况就会变得不再简单。在这种情况下，你需要记住，JavaScript\
  \ 始终会在运行比较之前尝试将每个操作数转换为数字。其工作原理如下：\n\n*   如果一个操作数是字符串而另一个是数字，JavaScript 尝试将字符串转换为数字。例如，在以下语句中，字符串\
  \ `\"5\"` 被转换为数字 5，所以比较 `value1 == value2` 返回 `true`:\n\n    ```javascript\n   \
  \ const value1 = \"5\";\n    const value2 = 5;\n    const result = value1 == value2;\n\
  \    ```\n\n    如果字符串无法转换为数字（例如，字符串 `\"rutabaga\"` 无法转换为数字），比较始终返回 `false`。\n\n\
  \    ![记住](img/remember.png) 空字符串 (`\"\"`) 被转换为 0。\n\n*   如果一个操作数是布尔值而另一个是数字，JavaScript\
  \ 将布尔值转换为数字，如下：\n\n    *   `true` ——此值被转换为 `1`。\n\n    *   `false` ——此值被转换为 `0`。\n\
  \n    例如，在以下语句中，布尔值 `true` 被转换为数字 1，所以比较 `value1 == value2` 返回 `true`:\n\n    ```javascript\n\
  \    const value1 = true;\n    const value2 = 1;\n    const result = value1 == value2;\n\
  \    ```\n\n*   如果一个操作数是布尔值而另一个是字符串，JavaScript 将布尔值转换为数字（如上），并尝试将字符串转换为数字。例如，在以下语句中，布尔值\
  \ `false` 被转换为数字 0，字符串 `\"0\"` 被转换为数字 0，所以比较 `value1 == value2` 返回 `true`:\n\n \
  \   ```javascript\n    const value1 = false;\n    const value2 = \"0\";\n    const\
  \ result = value1 == value2;\n    ```\n\n    如果字符串无法转换为数字，比较始终返回 `false`。\n\n###\
  \ 使用严格相等 (===) 运算符\n\n严格相等运算符 (`===`) 检查两个操作数是否相同，这意味着它不仅检查操作数的值是否相等，还检查操作数的数据类型是否相同。（这就是为什么严格相等运算符有时被称为身份运算符。）\n\
  \n例如，在以下语句中，变量 `albumName` 包含一个字符串，变量 `albumReleaseDate` 包含一个数字。这些值属于不同的数据类型，因此表达式\
  \ `albumName === albumReleaseDate` 返回 `false` (bk04ch03/example17.html):\n\n```javascript\n\
  const albumName = \"1984\";\nconst albumReleaseDate = 1984;\nconst result = albumName\
  \ === albumReleaseDate;\n```\n\n相比之下，如果你使用不检查操作数数据类型的相等运算符 (`==`)，那么表达式 `albumName\
  \ == albumReleaseDate` 将返回 `true`。\n\n![记住](img/remember.png) 那么，你应该在什么时候使用相等 (`==`)\
  \ 呢，什么时候应该使用严格相等 (`===`) 呢？许多专业的 JavaScript 程序员完全忽略了这个问题，并且一直使用严格相等运算符。你也应该这样做。\n\
  \n### 使用严格不不等 (!==) 运算符\n\n严格不不等运算符 (`!==`) 执行的是（某种意义上）严格相等运算符相反的功能。也就是说，它不仅检查两个操作数的值是否不同，还检查操作数的数据类型是否不同。（这就是为什么严格不不等运算符有时被称为非身份运算符。）\n\
  \n在以下语句中，变量 `hasBugs` 包含布尔值 `true`，变量 `totalBugs` 包含一个数字。这些值属于不同的数据类型，因此表达式 `hasBugs\
  \ !== totalBugs` 返回 `true` (bk04ch03/example18.html):\n\n```javascript\nconst hasBugs\
  \ = true;\nconst totalBugs = 1;\nconst result = hasBugs !== totalBugs;\n```\n\n\
  ### 在比较中使用字符串\n\n涉及数字的比较很少惊喜，但涉及字符串的比较有时会让人意外。在这些情况下，JavaScript 逐字母比较字符串。例如，考虑以下表达式：\n\
  \n```javascript\n\"Smith\" < \"Smyth\"\n```\n\n字符串的前两个字母相同，但第三个字母不同。`Smith` 中的 `i`\
  \ 的内部值小于 `Smyth` 中的 `y` 的内部值，所以前面的比较返回 `true`。（注意，一旦发现差异点，JavaScript 会忽略字符串中剩余字母。）\n\
  \n此外，空格是一个合法的比较字符，它的内部值在所有字母和其他打印符号之前。（如果你阅读“Unicode 值 [或为什么 *a* 不小于 *B*”侧栏，我可以告诉你空格字符的\
  \ Unicode 值为 32。）那么，考虑以下比较：\n\n```javascript\n\"Marge Simpson\" > \"Margerine\"\n\
  ```\n\n表达式返回 `false`，因为左操作数的六个“字母”是空格，而 `\"Margerine\"` 的六个字母是 `r`。\n\n### 使用三元运算符\
  \ (?:)\n\n![技术细节](img/technicalstuff.png) 了解比较运算符让你能够使用我最喜欢的表达式工具之一——复杂但非常有用的三元运算符\
  \ (`?:`)。在表达式中使用三元运算符的基本语法如下：\n\n`expression ? result_if_true : result_if_false`\n\
  \n`expression` 是一个产生 `true` 或 `false` 值的比较表达式。事实上，你可以使用任何具有 `true` 或 `false` 布尔值的变量、函数结果或属性。`result_if_true`\
  \ 是当 `expression` 结果为 `true` 时表达式返回的值；`result_if_false` 是当 `expression` 结果为 `false`\
  \ 时表达式返回的值。\n\n![提示](img/tip.png) 在 JavaScript 中，根据定义，以下值是 `false` 的等效值：\n\n*  \
  \ `0`（数字零）\n\n*   `\"\"`（空字符串）\n\n*   `null`\n\n\n\n\n\n*   `undefined`（例如，未初始化变量的“值”）\n\
  \n其他所有内容等同于 `true`。\n\n这里有一个示例（bk04ch03/example19.html）：\n\n```javascript\nconst\
  \ screenWidth = 768;\nconst maxTabletWidth = 1024;\nconst screenType = screenWidth\
  \ > maxTabletWidth ? \"Desktop!\" : \"Tablet!\";\n```\n\n变量 `screenWidth` 初始化为 `768`，变量\
  \ `maxTabletWidth` 初始化为 `1024`，变量 `screenType` 存储条件表达式返回的值。对于后者，`screenWidth > maxTabletWidth`\
  \ 是比较表达式，`\"Desktop!\"` 是结果为 `true` 时返回的字符串，而 `\"Portable!\"` 是结果为 `false` 时返回的字符串。因为\
  \ `screenWidth` 小于 `maxTabletWidth`，比较结果将为 `false`，所以结果将是 `\"Tablet!\"`。\n\n## 构建逻辑表达式\n\
  \n你使用逻辑表达式来组合或操作布尔值，特别是比较表达式。例如，如果你的代码需要在继续执行之前测试两个不同的比较表达式是否为 `true`，你可以使用逻辑表达式来实现。\n\
  \n### 逻辑运算符\n\n表 3-4 列出了 JavaScript 的逻辑运算符。\n\n| **运算符** | **名称** | **通用语法** | **返回值**\
  \ |\n| --- | --- | --- | --- |\n| `&&` | 与 (AND) | `expr1` `&&` `expr2` | 如果 `expr1`\
  \ 和 `expr2` 均为 `true` 则返回 `true`；否则返回 `false`。 |\n| `||` | 或 (OR) | `expr1` `||`\
  \ `expr2` | 如果 `expr1` 或 `expr2` 至少有一个为 `true` 则返回 `true`；否则返回 `false`。 |\n| `!`\
  \ | 非 (NOT) | `!expr` | 如果 `expr` 为 `false` 则返回 `true`；如果 `expr` 为 `true` 则返回 `false`。\
  \ |\n\n表 3-4 JavaScript 逻辑运算符\n\n### 使用与 (&&) 运算符\n\n当你想要测试两个布尔操作数以确定它们是否都为 `true`\
  \ 时，使用与运算符 (`&&`）。例如，考虑以下语句（bk04ch03/example20.html）：\n\n```javascript\nconst finishedDinner\
  \ = true;\nconst clearedTable = true;\nconst getsDessert = finishedDinner && clearedTable;\n\
  ```\n\n因为 `finishedDinner` 和 `clearedTable` 均为 `true`，逻辑表达式 `finishedDinner && clearedTable`\
  \ 的结果为 `true`。\n\n另一方面，考虑这些语句：\n\n```javascript\nconst haveWallet = true;\nconst\
  \ haveKeys = false;\nconst canGoOut = haveWallet && haveKeys;\n```\n\n在此示例中，因为 `haveKeys`\
  \ 为 `false`，逻辑表达式 `haveWallet && haveKeys` 的结果为 `false`。如果仅仅 `haveWallet` 为 `false`\
  \ 或者 `haveWallet` 和 `haveKeys` 均为 `false`，该逻辑表达式也会返回 `false`。\n\n表 3-5 列出了你可以输入的各种操作数以及它们产生的结果（这被称为*真值表*）。\n\
  \n| **left_operand** | **right_operand** | **left_operand && right_operand** |\n\
  | --- | --- | --- |\n| `true` | `true` | `true` |\n| `true` | `false` | `false`\
  \ |\n| `false` | `true` | `false` |\n| `false` | `false` | `false` |\n\n表 3-5 与\
  \ (`&&`) 运算符的真值表\n\n### 使用或 (||) 运算符\n\n当你想要测试两个布尔操作数以确定其中至少有一个为 `true` 时，使用或运算符\
  \ (`||`）。例如，考虑以下语句（bk04ch03/example21.html）：\n\n```javascript\nconst hasFever =\
  \ true;\nconst hasCough = false;\nconst missSchool = hasFever || hasCough;\n```\n\
  \n因为 `hasFever` 为 `true`，逻辑表达式 `hasFever || hasCough` 的结果为 `true`，因为只需要其中一个操作数为\
  \ `true` 即可。如果只有 `hasCough` 为 `true` 或两个操作数均为 `true`，你将得到相同的结果。\n\n另一方面，考虑这些语句：\n\
  \n```javascript\nconst salesOverBudget = false;\nconst expensesUnderBudget = false;\n\
  const getsBonus = salesOverBudget || expensesUnderBudget;\n```\n\n在此示例中，因为 `salesOverBudget`\
  \ 和 `expensesUnderBudget` 均为 `false`，逻辑表达式 `salesOverBudget || expensesUnderBudget`\
  \ 的结果为 `false`。\n\n表 3-6 显示了你可以输入的各种操作数的真值表。\n\n| **left_operand** | **right_operand**\
  \ | **left_operand || right_operand** |\n| --- | --- | --- |\n| `true` | `true`\
  \ | `True` |\n| `true` | `false` | `True` |\n| `false` | `true` | `True` |\n| `false`\
  \ | `false` | `False` |\n\n表 3-6 或 (`||`) 运算符的真值表\n\n### 使用非 (!) 运算符\n\n非 (`!`)\
  \ 运算符是我在本章稍后介绍的取反运算符（`-`）的逻辑等效物。在这种情况下，非返回操作数相反的布尔值。例如，考虑以下语句（bk04ch03/example22.html）：\n\
  \n```javascript\nconst dataLoaded = false;\nconst waitingForData = !dataLoaded;\n\
  ```\n\n`dataLoaded` 为 `false`，所以 `!dataLoaded` 的结果为 `true`。\n\n表 3-7 显示了你可以输入的各种操作数的真值表。\n\
  \n| **Operand** | **`!`Operand** |\n| --- | --- |\n| true | false |\n| false | true\
  \ |\n\n表 3-7 非 (`!`) 运算符的真值表\n\n### 关于 && 和 || 的高级说明\n\n`&&` 和 `||` 运算符有一些奇的行为：它们并不仅仅返回\
  \ `true` 或 `false`；而是返回操作数的值。这被称为*短路求值*。\n\n对于 `&&` 运算符：\n1. 求左侧操作数。\n2. 如果左侧操作数为\
  \ `false`，返回其值并停止。\n3. 如果左侧操作数为 `true`，则求右侧操作数的值并返回。\n\n对于 `||` 运算符：\n1. 求左侧操作数。\n\
  2. 如果左侧操作数为 `true`，返回其值并停止。\n3. 如果左侧操作数为 `false`，则求右侧操作数的值并返回。\n\n要尝试这些概念，请使用以下代码（bk04ch03/example23.html）：\n\
  \n```javascript\nconst v1 = true;\nconst v2 = 10;\nconst v3 = \"testing\";\nconst\
  \ v4 = false;\nconst v5 = 0;\nconst v6 = \"\";\n\nconst leftOperand = eval(prompt(\"\
  输入左侧操作数（值或表达式）\", true));\nconst rightOperand = eval(prompt(\"输入右侧操作数（值或表达式）\",\
  \ true));\n\nconst result = leftOperand && rightOperand;\ndocument.write(result);\n\
  ```\n\n脚本首先声明并初始化六个变量。前三个（`v1`、`v2` 和 `v3`）被赋予等于 `true` 的值，后三个（`v4`、`v5` 和 `v6`）被赋予等于\
  \ `false` 的值。脚本随后提示输入左侧操作数右侧操作数，然后将其输入到与表达式中。这里的关键在于你可以为每个操作数输入任何值，也可以使用 `v1` 到\
  \ `v6` 变量输入比较表达式，例如 `v2 > v5`。对 `prompt()` 结果使用 `eval()` 确保 JavaScript 按照输入的方式处理这些表达式。\n\
  \n表 3-8 列出了一些示例输入以及它们产生的结果。\n\n| **`left_operand`** | **`right_operand`** | **`left_operand\
  \ && right_operand`** |\n| --- | --- | --- |\n| `true` | `true` | `true` |\n| `true`\
  \ | `false` | `false` |\n| `5` | `10` | `10` |\n| `false` | `\"Yo\"` | `false` |\n\
  | `v2` | `v5` | `0` |\n| `true` | `v3` | `testing` |\n| `v5` | `v4` | `0` |\n| `v2\
  \ > v5` | `v5 == v4` | `true` |\n\n\n\n\n\n表格 3-8 之前代码的一些示例结果\n\n与 AND 运算符一样，JavaScript\
  \ 评估 OR 表达式的逻辑非常奇异，需要被理解，特别是当你使用等价于 `true` 或 `false` 的操作数时：\n\n1. 评估 OR 运算符左侧的操作数。\n\
  2. 如果左侧操作数的值为 `true` 或等价 `true`，则返回该值并停止；否则，继续第 3 步。\n3. 如果左侧操作数的值为 `false` 或等价\
  \ `false`，则评估 OR 运算符右侧的操作数（注：原文此处为 AND，根据上下文应为 OR）。\n4. 返回右侧操作数的值。\n\n## 理解运算符优先级\n\
  \n你的 JavaScript 代码通常会使用非常简单的表达式：只有一两个操作数和一个运算符。遗憾的是，这里的“通常”并不意味着“大部分”，因为你使用的许多表达式将包含多个值和运算符。在这些复杂的表达式中，执行计算的顺序至关重要。例如，考虑表达式\
  \ `3+5*2`。如果你从左到右计算，得到的结果是 `16`（`3+5` 等于 `8`，`8*2` 等于 `16`）。然而，如果你先执行乘法再执行加法，结果就是\
  \ `13`（`5*2` 等于 `10`，`3+10` 等于 `13`）。换句话说，同一个表达式根据执行计算的顺序产生多个答案。\n\n为了控制这种顺序问题，JavaScript\
  \ 根据预定义的`优先级`（priority）来评估表达式。这种优先级让 JavaScript 通过确定表达式中哪些部分先计算、哪些部分后计算以此类推，从而无歧地计算表达式。\n\
  \n### 优先级\n\nJavaScript 使用的优先级由本章目前为止介绍的各种表达式运算符决定。表格 3-9 总结了 JavaScript 使用的完整优先级。\n\
  \n例如，表格 3-9 告诉你在 JavaScript 中加法之前执行乘法。因此，表达式 `3+5*2`（刚刚讨论过的）的正确答案是 `13`。\n\n同样注意，表格\
  \ 3-9 中的某些运算符具有相同的优先级（例如乘法和除法）。相同的优先级意味着 JavaScript 评估这些运算符的顺序无关。例如，考虑表达式 `5*10/2`。如果你先执行乘法，得到的答案是\
  \ `25`（`5*10` 等于 `50`，`50/2` 等于 `25`）。如果你先执行除法，同样得到答案 `25`（`10/2` 等于 `5`，`5*5` 等于\
  \ `25`）。\n\n然而，JavaScript 对此类表达式确实有预定义的顺序，这就是“评估顺序”（Order of Evaluation）列所告诉你的内容。`L\
  \ -> R` 值意味着相同优先级的操作从左到右评估；`R -> L` 意味着操作从右到左评估。\n\n| **运算符** | **操作** | **优先级**\
  \ | **评估顺序** |\n| --- | --- | --- | --- |\n| `++` | 自增 | 第一 | R -> L |\n| `--` |\
  \ 自减 | 第一 | R -> L |\n| `—` | 否定 | 第一 | R -> L |\n| `!` | 非 | 第一 | R -> L |\n| `*`,\
  \ `/`, `%` | 乘法、除法、取模 | 第二 | L -> R |\n| `+`, `—` | 加法、减法 | 第三 | L -> R |\n| `+`\
  \ | 拼接 | 第三 | L -> R |\n| `<`, `<=` | 小于、小于等于 | 第四 | L -> R |\n| `>`, `>=` | 大于、大于等于\
  \ | 第四 | L -> R |\n| `==` | 等于 | 第五 | L -> R |\n| `!=` | 不等于 | 第五 | L -> R |\n|\
  \ `===` | 严格相等 | 第五 | L -> R |\n| `!==` | 严格不等于 | 第五 | L -> R |\n| `&&` | AND |\
  \ 第六 | L -> R |\n| `||` | OR | 第六 | L -> R |\n| `?:` | 三元运算符 | 第七 | R -> L |\n|\
  \ `=` | 赋值 | 第八 | R -> L |\n| `+=`, `-=`, 等. | 算术赋值 | 第八 | R -> L |\n\n表格 3-9 JavaScript\
  \ 运算符优先级\n\n### 控制优先级\n\n有时你想要控制局面并覆盖优先级。这看起来似乎是一件相当奇怪的事情，所以可能需要一个示例。正如你可能知道的，你通过将零售价乘以税率，然后将结果加到零售价上来计算零售物品的总价：\n\
  \n`Total Price = Retail Price + Retail Price * Tax Rate`\n\n但是，如果你想反转这个计算呢？也就是说，假设你知道物品的最终价格，并且给定税率，你想知道原始（即税前）价格。\n\
  \n\n\n\n\n![Bullet](img/check.png) # 理解代码循环\n\n![Bullet](img/check.png) 设置代码循环\n\
  \n![Bullet](img/check.png) 避免可怕的无限循环\n\n*一个优秀的程序员在穿过单行道之前，总是会向左右顾顾。*\n\n—DOUG LINDER\n\
  \n如果任其自然发展，网络浏览器将以默认方式处理 HTML 和 JavaScript 代码。这种默认方式本身并没有错，但如果你退后一步，让浏览器按其标准方式运行，结果将只是一个普通的网页。\n\
  \n制作精美且生动的网页的秘密在于从网络浏览器手中夺取控制权，并将一切掌握在自己手中。你将在第 5 本 中学习如何打破浏览器默认的布局流。在这里，我指的是 JavaScript，所以你需要学习如何打破浏览器默认的脚本处理流。\n\
  \n默认的脚本流意味着浏览器逐条语句地处理 `script` 元素或外部 JavaScript 文件内部的代码。浏览器读取并执行第一条语句，读取并执行第二条语句，以此此类推，直到没有更多的\
  \ JavaScript 代码需要读取和执行为止。\n\n这种逐条语句的流看起来很合理，但它的局限性极大。如果你想让代码测试某些条件，并根据测试结果跳转到特定的代码块怎么办？如果你想让代码重复执行某些语句，并在每次重复中发生某些变化怎么办？运行测试的代码和自我重复的代码都属于控制\
  \ JavaScript 执行流的范畴。在本章中，你将探索这个迷人且强大的主题。\n\n## 使用 if 语句进行真/假决策\n\n智能的脚本会对其环境进行测试，然后根据每项测试的结果决定下一步做什么。例如，假设你声明了一个变量，稍后在表达式将其用作除数。你应该在表达式中使用该变量之前对其测试，以确保变量的值不为\
  \ 0。\n\n最基本的测试是简单的真/假决策（也可以被认为是是/否决策或开/关的决策）。在这种情况下，你的程序查看某个条件，确定其当前是真还是假，并采取相应的行动。比较表达式和逻辑表达式（在第\
  \ 4 本第 3 章中介绍）在这里起着很大作用，因为它们总是返回 `true` 或 `false` 结果。\n\n在 JavaScript 中，简单的真/假决策由\
  \ `if` 语句处理。你可以使用单行语法：\n\n```\nif (expression) statement;\n```\n\n或者块语法：\n\n```\n\
  if (expression) {\n  statement1;\n  statement2;\n  …\n}\n```\n\n在这两种情况下，`expression`\
  \ 是一个返回 `true` 或 `false` 的比较或逻辑表达式，而 `statement(s)` 代表如果 `expression` 返回 `true`\
  \ 则运行的 JavaScript 语句。如果 `expression` 返回 `false`，JavaScript 将跳过这些语句。\n\n![Tip](img/tip.png)\
  \ 这里需要注意，JavaScript 将以下值视为 `false` 的等价：`0`、`\"\"`（即空字符串）、`null` 和 `undefined`。其他所有值都是\
  \ `true` 的等价。\n\n![Remember](img/remember.png) 这是你第一次遇到 JavaScript 的大括号（`{` 和 `}`），所以花点时间理解它们的作用，因为它们经常出现。大括号包围你希望\
  \ JavaScript 视为单个实体的一个或多个语句。这个实体本身也是语句，所以整体——大括号和它们包含的代码——被称为块语句。此外，任何由一个语句（如 `if`）后跟一个块语句组成的\
  \ JavaScript 结构被称为复合语句。而且，为了让你保持警惕，注意包含大括号的行末尾不加分号。\n\n使用单行语法还是块语法取决于当 `expression`\
  \ 返回 `true` 结果时你想运行的语句。如果你只有一条语句，可以使用任何一种语法。如果你有多个语句，请使用块语法。\n\n考虑以下示例（查看此书中的示例文件\
  \ bk04ch04/example01.html）：\n\n```\nif (totalSales != 0) {\n  const grossMargin\
  \ = (totalSales - totalExpenses) / totalSales;\n}\n```\n\n这段代码假设脚本在此之前已经计算了总销售额和总支出，并分别存储在\
  \ `totalSales` 和 `totalExpenses` 变量中。代码现在计算毛利率，其定义为毛利（即销售额减去支出）除以销售额。代码使用 `if` 来测试\
  \ `totalSales` 变量的值是否不等于零。如果 `totalSales != 0` 表达式返回 `true`，则执行 `grossMargin` 计算；否则，什么都不会发生。此示例中的\
  \ `if` 测试是正确的，因为它确保了计算中的除数——`totalSales`——永远不会为零。\n\n## 使用 if…else 语句进行分支\n\n使用\
  \ `if` 语句做出决策为你的 JavaScript 工具库增添了强大的新武器。然而，`if` 的简单版本有一个重要的局限性：`false` 结果只会跳过一个或多个语句；它不会执行它自己的任何语句。在很多情况下这是可以的，但有时你需要在条件返回\
  \ `true` 时运行一组语句，而在结果为 `false` 时运行另一组。为了处理这些场景，你需要使用 `if…else` 语句：\n\n```\nif (expression)\
  \ {\n  statements-if-true\n} else {\n  statements-if-false\n}\n```\n\n`expression`\
  \ 是一个返回 `true` 或 `false` 的比较或逻辑表达式。`statements-if-true` 代表当 `expression` 返回 `true`\
  \ 时希望 JavaScript 运行的语句块，而 `statements-if-false` 代表当 `expression` 返回 `false` 时希望执行的语句块。\n\
  \n例如，考虑以下代码（查看 bk04ch04/example02.html）：\n\n```javascript\nlet discountRate;\nif\
  \ (currMonth === \"December\") {\n  discountRate = 0.2;\n} else {\n  discountRate\
  \ = 0.1;\n}\n\nconst discountedPrice = regularPrice * (1 – discountRate);\n```\n\
  \n这段代码计算商品的折扣价，折扣取决于当前月份是否为十二月。代码假设脚本在此之前设置了当前月份（`currMonth`）和商品的原价（`regularPrice`）。在声明\
  \ `discountRate` 变量后，`if…else` 语句检查 `currMonth` 是否等于十二月。如果是，将 `discountRate` 设置为\
  \ 0.2；否则，将 `discountRate` 设置为 0.1。最后，代码使用 `discountRate` 的值计算 `discountedPrice`。\n\
  \n![Tip](img/tip.png) 如果像我在示例中那样对每个块内的语句进行缩进，`if…else` 语句将更易读。这种缩进让你轻松识别当存在 `true`\
  \ 结果时将运行哪个块，以及当结果为 `false` 时将运行哪个块。我发现四个空格的缩进很好，但许多程序员更倾向于两个空格或制表符（tab）。\n\n`if…else`\
  \ 语句与我在第 4 本第 3 章中讨论的三元运算符（`?:`）非常相似。事实上，对于非常特定的 `if…else` 语句，两者是完全相同的。\n\n`?:`\
  \ 运算符评估比较表达式，如果表达式为 `true` 则返回一个值，如果为 `false` 则返回另一个值。例如，如果你有一个名为 `currentHour`\
  \ 的变量，它包含当前时间的小时部分，考虑以下语句：\n\n```javascript\nlet greeting = currentHour < 12 ? \"\
  Good morning!\" : \"Good day!\";\n```\n\n\n\n\n如果 `currentHour` 小于 12，则字符串 `\"Good\
  \ morning!\"` 被存储在 `greeting` 变量中；否则，字符串 `\"Good day!\"` 被存储在变量中。此语句与以下 `if…else`\
  \ 语句完全相同：\n\n```javascript\nlet greeting;\n\nif (currentHour < 12) {\n  greeting\
  \ = \"Good morning!\";\n} else {\n  greeting = \"Good day!\";\n}\n```\n\n三元运算符的版本在总字符数和使用的总行数方面显然更高效。因此，每当你发现自己只是为了测试一个条件并根据结果将内容存储在变量中时，请使用三元运算符代替\
  \ `if…else`。\n\n## 做出多个决策\n\n`if…else` 控制结构只进行一次单一决策。`if` 部分计算一个单一逻辑结果并执行两个操作之一。然而，在许多情况下，在决定采取哪种操作之前，需要进行多次决策。\n\
  \n例如，给定商品的总价和税率来计算其税前价格，你需要将总价除以税率加 1。在现实世界的 Web 开发中，作为开发者，你的工作之一就是确保处理的数字是有意义的。什么样的税率是合理的？可能是它大于或等于\
  \ 0 且小于 1（即 100%）。对于代码中的任何税率值，这需要测试两个点，而 JavaScript 提供了多种处理此类问题的方法。\n\n### 使用与 (&&)\
  \ 和或 (||) 运算符\n\n解决多决策问题的方案之一是将多个比较表达式组合在单个 `if` 语句中。正如我在第 4 本第 3 章中讨论的，你可以使用 JavaScript\
  \ 的与 (`&&`) 和或 (`||`) 运算符来组合比较表达式。\n\n以下代码显示了一个使用 `&&` 运算符组合两个比较表达式的 `if` 语句示例（bk04ch04/example03.html）：\n\
  \n```javascript\nif (taxRate >= 0 && taxRate < 1) {\n  const retailPrice = totalPrice\
  \ / (1 + taxRate);\n  document.write(retailPrice);\n} else {\n  document.write(\"\
  Please enter a tax rate between 0 and 1.\");\n}\n```\n\n这里的关键是 `if` 语句：\n\n`if (taxRate\
  \ >= 0 && taxRate < 1);`\n\n这告诉浏览器，只有当 `taxRate` 值大于或等于 `0` 且小于 `1` 时，才执行 true 块中的语句。如果其中一个为\
  \ `false`（或者两者都为 `false`），浏览器将转而写入 false 块中的消息。\n\n### 连接多个 if 语句\n\n`if…else` 语句有第三种语法，允许你使用*多块语句*（multi-block\
  \ statement）连接任意数量的逻辑测试（之所以命名是因为包含了多个 `if/else` 块）：\n\n```javascript\nif (expression1)\
  \ {\n  statements-if-expression1-true\n} else if (expression2) {\n  statements-if-expression2-true\n\
  } etc.\nelse {\n  statements-if-false\n}\n```\n\nJavaScript 首先测试 `expression1`。如果\
  \ `expression1` 返回 `true`，JavaScript 运行由 `statements-if-expression1-true` 表示的块并跳过其他所有内容。如果\
  \ `expression1` 返回 `false`，JavaScript 然后测试 `expression2`。如果 `expression2` 返回 `true`，JavaScript\
  \ 运行由 `statements-if-expression2-true` 表示的块并跳过其他所有内容。否则，如果所有的 `if` 测试都返回 `false`，JavaScript\
  \ 运行由 `statements-if-false` 表示的块。\n\n以下代码显示了一个连接了几个 `if` 语句的脚本（bk04ch04/example04.html）：\n\
  \n```javascript\nlet greeting;\n\nif (currentHour < 12) {\n  greeting = \"Good morning!\"\
  ;\n} else if (currentHour < 18) {\n  greeting = \"Good afternoon!\";\n} else {\n\
  \  greeting = \"Good evening!\";\n}\n\ndocument.write(greeting);\n```\n\n该代码假设在脚本之前的部分，当前小时值已存储在\
  \ `currentHour` 变量中。第一个 `if` 检查 `currentHour` 是否小于 12。如果是，则字符串 `\"Good morning!\"\
  ` 被存储在 `greeting` 变量中；如果不是，下一个 `if` 检查 `currentHour` 是否小于 18（即下午 6:00）。如果是，则给 `greeting`\
  \ 赋值字符串 `\"Good afternoon!\"`；否则，则给 `greeting` 赋值 `\"Good evening\"`。\n\n### 使用\
  \ switch 语句\n\n使用 `if…else if` 执行多次测试是一种实用的技巧——这是你将经常用到的一个 JavaScript 工具。然而，随着需要进行的测试数量的增加，它会迅速变得臃肿。对于两个或三个测试是可以的，但超过这个数量就会让逻辑变得难以理解。\n\
  \n对于需要进行大量测试的情况（例如，四个个或更多），JavaScript 的 `switch` 语句是更好的选择。其思想是在开始处提供一个表达式，然后列出该表达式的一系列可能值。对于每个可能的结果——称为*case*（情况）——如果该\
  \ case 匹配表达式，你就提供一个或多个 JavaScript 语句来执行。其语法如下：\n\n```javascript\nswitch (expression)\
  \ {\n  case Case1:\n    Case1 statements\n    break;\n  case Case2:\n    Case2 statements\n\
  \    break;\n  // 等.\n  default:\n    Default statements\n}\n```\n\n`expression`\
  \ 在结构开始时求值。它必须返回一个值（数字、字符串或布尔值）。`Case1`、`Case2` 等是 `expression` 的可能值。JavaScript\
  \ 检查每个 case 值，以确定一个是否匹配 `expression` 的结果。如果 `expression` 返回 `Case1` 值，则执行由 `Case1\
  \ statements` 表示的代码，`break` 语句告诉 JavaScript 停止处理 `switch` 语句的剩余部分。否则，如果 `expression`\
  \ 返回 `Case2` 值，则执行由 `Case2 statements` 表示的代码。\n\n如果你在 JavaScript 中处理大量日期工作，你的代码最终可能弄出任何月份有多少天，如下所示（bk04ch04/example05.html）：\n\
  \n```javascript\nlet daysInMonth;\n\nswitch (monthName) {\n  case \"January\":\n\
  \    daysInMonth = 31;\n    break;\n  case \"February\":\n    if (yearValue % 4\
  \ === 0) {\n      daysInMonth = 29;\n    } else {\n      daysInMonth = 28;\n   \
  \ }\n    break;\n  case \"March\":\n    daysInMonth = 31;\n    break;\n  case \"\
  April\":\n    daysInMonth = 30;\n    break;\n  case \"May\":\n    daysInMonth =\
  \ 31;\n    break;\n  case \"June\":\n    daysInMonth = 30;\n    break;\n  case \"\
  July\":\n    daysInMonth = 31;\n    break;\n  case \"August\":\n    daysInMonth\
  \ = 31;\n    break;\n  case \"September\":\n    daysInMonth = 30;\n    break;\n\
  \  case \"October\":\n    daysInMonth = 31;\n    break;\n  case \"November\":\n\
  \    daysInMonth = 30;\n    break;\n  case \"December\":\n    daysInMonth = 31;\n\
  \    break;\n}\n```\n此代码假设变量 `monthName` 是你想要处理的月份名称，而 `yearValue` 是年份。（你需要后者来判断何时遇到闰年）。`switch`\
  \ 基于月份名称：然后为每个月份设置了 `case` 语句。\n\n\n\n\n![Technical stuff](img/technicalstuff.png)\
  \ 时间极客们无疑会对我“一个年份只要能被 4 整除就是闰年”的断言感到不满。事实上，这只适用于 1901 年到 2099 年，这已经可以满足大多数人的需求。该公式对于\
  \ 1900 年和 2100 年无效，因为这些年份虽然能被 4 整除，但并不是闰年。通用规则是：如果一个年份能被 4 整除且不能被 100 整除，除非它也能被\
  \ 400 整除，否则它就是闰年。\n\n## 理解代码循环\n\n有些人会认为，程序员唯一的真正目标应该是完成工作。只要代码能产生正确的结果或按正确的顺序执行正确的任务，其他一切都是多余的。也许如此，但*真正的*程序员知道，编程的真正目标不仅是完成工作，而且要*尽可能高效地*完成。高效的脚本运行速度更快，编码时间更短，并且通常（并非总是，但通常如此）更容易阅读和排除故障。\n\
  \n在编码中引入效率最好的方法之一是避免过度重复造轮子。例如，考虑以下代码片段：\n\n```javascript\nlet sum = 0;\nlet num\
  \ = prompt(\"Type a number:\", 1);\nsum += Number(num);\nnum = prompt(\"Type a number:\"\
  , 1);\nsum += Number(num);\nnum = prompt(\"Type a number:\", 1);\nsum += Number(num);\n\
  document.write(\"The total of your numbers is \" + sum);\n```\n\n这段代码首先声明了一个名为 `sum`\
  \ 的变量。代码提示用户输入一个数字（使用默认值为 `1` 的 `prompt` 方法），将其存储在 `num` 变量中，将该值加到 `sum` 上，然后重复这个“提示并累加”的程序另外两次。（注意我这里使用的\
  \ `Number` 函数，它确保了 `prompt` 返回的值被视为数字而不是字符串。）最后，向用户显示三个数字之和。\n\n除了这段代码有点没用之外，它还散发着低效的气息，因为代码大部分是由以下重复三次的组成的：\n\
  \n```javascript\nnum = prompt(\"Type a number:\", 1);\nsum += Number(num);\n```\n\
  \n如果你在代码中只写这两句语句，然后设法让 JavaScript 按照需要重复执行这些语句，不是会更高效吗？\n\n是的，确实会更高效。好消息是，这不仅是可能的，JavaScript\
  \ 还提供了多种不同的方法来执行这种所谓的*循环*。我将在本章的剩余部分调查这些每种方法。\n\n## 使用 while 循环\n\nJavaScript 循环结构中最简单直接的是\
  \ `while` 循环，它使用以下语法：\n\n```javascript\nwhile (expression) {\n    statements\n}\n\
  ```\n\n在这里，`expression` 是一个比较或逻辑表达式（即返回 `true` 或 `false` 的表达式），只要它返回 `true`，就会告诉\
  \ JavaScript 继续执行块内部的 `statements`。\n\n本质上，JavaScript 对 `while` 循环的解释如下：“好的，只要 `expression`\
  \ 保持为 `true`，我就会一直运行循环体语句，但一旦 `expression` 变为 `false`，我就离开。”\n\n下面是 `while` 循环工作原理的详细观察：\n\
  \n1. 评估 `while` 语句中的 `expression`。\n2. 如果 `expression` 为 `true`，继续执行第 3 步；如果 `expression`\
  \ 为 `false`，跳到第 5 步。\n3. 执行块中的每条语句。\n4. 返回第 1 步。\n5. 退出循环（即执行 `while` 块之后的下一条语句）。\n\
  \n以下代码演示了如何使用 `while` 重写上一节所示的低效代码（bk04ch04/example06.html）：\n\n```javascript\n\
  let sum = 0;\nlet counter = 1;\nlet num;\nwhile (counter <= 3) {\n    num = prompt(\"\
  Type a number:\", 1);\n    sum += Number(num);\n    counter += 1;\n}\ndocument.write(\"\
  The total of your numbers is \" + sum);\n```\n\n为了控制循环，代码声明了一个名为 `counter` 的变量并将其初始化为\
  \ `1`，这意味着表达式 `counter <= 3` 为 `true`，因此代码进入块执行提示并累加的操作，然后增加 `counter`。这种操作会一直重复，直到循环第三次，此时\
  \ `counter` 增加到 `4`，此时表达式 `counter <= 3` 变为 `false`，循环结束。\n\n![Tip](img/tip.png)\
  \ 为了让你的循环代码尽可能可读，请始终对 `while` 块中的每条语句使用两个或四个空格的缩进。这同样适用于在本章后面提到的 `for` 循环和 `do…while`\
  \ 循环。\n\n当你确切知道要循环多少次时，`while` 语句并不是最好的循环选择。对于这种情况，请使用下一节描述的 `for` 语句。\n\n\n\n\n\
  \n*   `statements`：你希望 JavaScript 在每次循环时执行的语句。\n\n当 JavaScript 遇到 `for` 语句时，它会切换到\
  \ for 循环模式并遵循以下七个步骤：\n\n1. 将 `counter` 设置为 `start`。\n2. 评估 `for` 语句中的 `counterExpression`。\n\
  3. 如果 `counterExpression` 为 `true`，则继续第 4 步；如果 `counterExpression` 为 `false`，则跳转到第\
  \ 7 步。\n4. 执行块中的每条语句。\n5. 使用 `counterUpdate` 增加（或执行其他操作）`counter`。\n6. 返回第 2 步。\n\
  7. 退出循环（即执行 `for` 块之后的下一条语句）。\n\n例如，以下代码展示了如何使用 `for` 重写本章之前所示的低效代码（`bk04ch04/example08.html`）：\n\
  \n```\nlet sum = 0;\nlet num;\nfor (let counter = 1; counter <= 3; counter += 1)\
  \ {\n    num = prompt(\"Type a number:\", 1);\n    sum += Number(num);\n}\ndocument.write(\"\
  The total of your numbers is \" + sum);\n```\n\n这是目前最高效的版本，因为 `counter` 变量的声明、初始化和递增都在\
  \ `for` 语句内部完成。\n\n![记住](img/remember.png) 为了尽可能减少脚本中声明的变量数量，请始终尝试在所有的 `for` 循环计数器中使用相同的名称。在编程中，传统上使用\
  \ `i` 到 `n` 的字母作为计数器。为了清晰，你可能更喜欢使用完整的单词，如 `count` 或 `counter`。\n\n![技术细节](img/technicalstuff.png)\
  \ 这一点并不明显，但你在 `for` 语句中声明的任何变量（特别是计数器变量）作用域仅限于 `for` 块。\n\n这里有一个稍微复杂的示例（`bk04ch04/example09.html`）：\n\
  \n```\nlet sum = 0;\nfor (let counter = 1; counter < 4; counter += 1) {\n    let\
  \ num;\n    let ordinal;\n    switch (counter) {\n        case 1:\n            ordinal\
  \ = \"first\";\n            break;\n        case 2:\n            ordinal = \"second\"\
  ;\n            break;\n        case 3:\n            ordinal = \"third\";\n     \
  \       break;\n    }\n    num = prompt(\"Enter the \" + ordinal + \" number:\"\
  , 1);\n    sum += Number(num);\n}\ndocument.write(\"The average is \" + sum / 3);\n\
  ```\n\n该脚本的目的是向用户询问三个数字，然后显示这些值的平均值。`for` 语句被设置为循环三次（注意 `counter < 4` 等同于 `counter\
  \ <= 3`）。循环块的第一项操作是使用 `switch` 来确定 `ordinal` 变量的值：如果 `counter` 为 1，则 `ordinal` 被设置为\
  \ `\"first\"`；如果 `counter` 为 2，`ordinal` 变为 `\"second\"`；依此类推。这些值使得脚本能够在每次循环时自定义化\
  \ `prompt` 消息（查看图 4-2）。在每次循环中，用户输入一个数字，该值会被加到 `sum` 变量中。循环退出后，显示平均值。\n\n![此脚本使用计数器变量的当前值来自定义提示消息的截图](img/9781394164684-fg040402.png)\n\
  \n图 4-2： 此脚本使用 `counter` 变量的当前值来自定义提示消息。\n\n你也可以使用 `for` 进行倒计时。你通过使用减赋值运算符代替加赋值运算符来实现这一点：\n\
  \n```\nfor (let counter = start; counterExpression; counter -= 1) {\n    statements\n\
  }\n```\n\n在这种情况下，你必须将 `counter` 变量初始化为想要用于循环计数器的最大值，并使用 `counterExpression` 将 `counter`\
  \ 的值与结束循环所需的最小值进行比较。\n\n在下面的示例（`bk04ch04/example10.html`）中，我使用递减计数器让用户倒序对他们最喜的前三种\
  \ CSS 颜色进行排名（有关使用颜色的细节，请参阅第 3 本第 6 章）：\n\n```\nfor (let rank = 3; rank >= 1; rank\
  \ -= 1) {\n    let ordinal;\n    let color;\n    switch (rank) {\n        case 1:\n\
  \            ordinal = \"first\";\n            break;\n        case 2:\n       \
  \     ordinal = \"second\";\n            break;\n        case 3:\n            ordinal\
  \ = \"third\";\n            break;\n    }\n    color = prompt(\"What is your \"\
  \ + ordinal + \"-favorite CSS color?\", \"\");\n    document.write(rank + \" \"\
  );\n}\n```\n\n\n\n\n\n```javascript\nnum = prompt(\"Type a number; when you're done,\
  \ click Cancel:\", 1);\nsum += Number(num);\n}\nwhile (num !== null || sum === 0);\n\
  document.write(\"The total of your numbers is \" + sum);\n```\n\n这段代码与我在本节之前展示的\
  \ `while` 代码非常相似。唯一的变化是，`while` 语句及其表达式被移动到了语句块之后，这样循环在评估表达式之前必须先执行一次。\n\n# 控制循环的执行\n\
  \n大多数循环都会按照其自然过程运行，然后程序继续执行。然而，某些情况下，你可能想要提前退出循环，或者跳过某些语句并继续下一次循环。你可以分别使用 `break`\
  \ 和 `continue` 语句来处理每种情况。\n\n### 使用 break 语句退出循环\n\n当循环遇到某个值或条件时，如果该值或条件会阻止后续语句正常执行，或者满足了循环试图实现的目标，你就使用\
  \ `break`。以下代码通过一个简单的示例演示了 `break`（`bk04ch04/example12.html`）：\n\n```javascript\n\
  let sum = 0;\nfor (let counter = 1; counter <= 3; counter += 1) {\n    let num =\
  \ prompt(\"Type a positive number:\", 1);\n    if (num < 0) {\n        sum = 0;\n\
  \        break;\n    }\n    sum += Number(num);\n}\nif (sum > 0) {\n    document.write(\"\
  The average of your numbers is \" + sum / 3);\n}\n```\n\n此脚本设置了一个 `for` 循环来提示用户输入正数。在本节而言，关键代码是\
  \ `if` 测试：\n\n```javascript\nif (num < 0) {\n    sum = 0;\n    break;\n}\n```\n\n\
  如果用户输入负数，变量 `sum` 将被重置为 `0`（防止在脚本稍后的部分将消息写入页面）。此外，`break` 语句告诉 JavaScript 完全退出循环。\n\
  \n这里有一个更复杂的示例（`bk04ch04/example13.html`）：\n\n```javascript\nconst numberToGuess\
  \ = Math.ceil(Math.random() * 10);\nlet promptMessage = \"Guess a number between\
  \ 1 and 10:\";\nlet totalGuesses = 1;\ndo {\n    const guess = Number(prompt(promptMessage,\
  \ \"\"));\n    if (guess === 0) {\n        break;\n    } else if (guess === numberToGuess)\
  \ {\n        document.write (\"You guessed it in \" + totalGuesses +\n        (totalGuesses\
  \ === 1 ? \" try.\" : \" tries.\"));\n        break;\n    } else if (guess < numberToGuess)\
  \ {\n        promptMessage = \"Sorry, your guess was too low. Try again:\";\n  \
  \  } else {\n        promptMessage = \"Sorry, your guess was too high. Try again:\"\
  ;\n    }\n    totalGuesses += 1;\n}\nwhile (true);\n```\n\n此脚本是一个游戏，生成一个 1 到 10\
  \ 之间的数字，用户必须尝试猜出它。前四行设置了一些变量。这里让人困惑的是 `numberToGuess` 变量的表达式。该表达式使用了 `Math` 对象的几个方法，我将在第\
  \ 4 册 第 8 章 中讨论它们。目前，只需知道该表达式会生成一个 1 到 10 之间（包含边界）的随机整数。\n\n然后设置了一个如下结构的 `do…while`\
  \ 循环：\n\n```javascript\ndo {\n    // statements\n}\nwhile (true);\n```\n\n这告诉 JavaScript\
  \ 在不考虑比较表达式的情况下运行循环。正如你将学到的，循环本身将通过使用 `break` 语句处理退出循环。\n\n接下来，提示用户输入猜测，并将其存储在 `guess`\
  \ 变量中。脚本随后检查 `guess` 是否等于 `0`，这意味着用户点击了“取消”（点击“取消”返回 `null`，但 `Number` 函数会将 `null`\
  \ 转换为 `0`）。如果是，则使用 `break` 通过退出循环来停止游戏：\n\n```javascript\nconst guess = Number(prompt(promptMessage,\"\
  \"));\nif (guess === 0) {\n    break;\n}\n```\n\n否则，一系列 `if` 语句将对猜测的数字与实际数字进行测试。第一个测试检查它们是否相同。如果是，则将消息写入页面，然后通过另一个\
  \ `break` 语句退出循环，因为游戏已经结束：\n\n```javascript\nelse if (guess === numberToGuess) {\n\
  \    document.write(\"You guessed it in \" + totalGuesses +\n    (totalGuesses ===\
  \ 1 ? \" try.\" : \" tries.\"));\n    break;\n}\n```\n\n![Tip](img/tip.png) 注意 `document.write`\
  \ 语句包含一个三元运算符表达式：\n\n```javascript\ntotalGuesses === 1 ? \" try.\" : \" tries.\"\
  \n```\n\n这说明了一种极其常见的编程情况：你必须向用户显示一个单词，但根据某些变量或表达式的值，该单词可能是单数可能是复数。在这种情况下，如果 `totalGuesses`\
  \ 等于 1，你想显示单词 `try`。\n\n\n\n\n如果你遇到了无限循环且不确定原因，可以在循环语句块中插入一个或多个 `debugger` 和 `console.log`\
  \ 语句，以便你能够逐条执行脚本，并显示计数器或比较变量的当前值。（想知道“debugger”和 “console.log” 到底是什么吗？我将在第 4 卷的\
  \ 第 10 章 中介绍它们。）这个过程能让你了解变量在每次通过循环时发生了什么变化。\n\n# 第 5 章\n\n# 掌握函数的威力\n\n## 本节内容\n\
  \n- **了解 JavaScript 函数**\n- **创建和使用自定义函数**\n- **传递和返回函数值**\n- **使用匿名函数和箭头函数**\n\
  - **深入理解变量作用域**\n- **理解递归函数**\n\n*简化的能力意味着消除不必要的因素，以便必要的部分得以呈现。*\n\n— 汉斯·霍夫曼 (HANS\
  \ HOFMANN)\n\n在第 1 卷的 第 1 章 中，我介绍了两种方法：`alert()` 和 `document.write()`。虽然它们不是 JavaScript\
  \ 标准的一部分（它们来自不同的 Web API；请参阅第 4 卷 第 6 章），但网页浏览器提供了这些方法以便你可以在 JavaScript 代码中使用它们。`alert()`\
  \ 和 `document.write()` 都是即插即用功能的示例，无需了解它们的内部工作原理即可使用。\n\n当你将所有内置 JavaScript 特性与所有\
  \ Web API 结合时，你将拥有数百种操作，它们执行的任务从不可或缺到晦涩理解不等。这听起来似乎已经涵盖了代码可能采取的所有操作，但实际上远非如此。除了最简单的脚本外，几乎每个\
  \ JavaScript 项目都需要一个或多个（通常多得多）不属于 JavaScript 语言或任何 Web API 的任务或计算。程序员该怎么办？你需要卷起袖子，编写自己的代码来完成任务或运行计算。\n\
  \n本章将向你展示如何创建这种 DIY 代码。在接下来的页面中，你将探索强大且无限用的自定义函数领域，在那里，你可以编写可重用的代码来执行原生 JavaScript\
  \ 无法完成的任务。\n\n## 什么是函数？\n\n*函数* 是一组 JavaScript 语句，它们与脚本的其他部分分离并执行指定的任务。（从技术上讲，一个函数可以执行任何数量的杂务，但作为一般原则，最好让每个函数专注于一个特定的任务。）当你的脚本需要执行该任务时，你告诉它运行——或者用术语说*执行*（execute）——该\
  \ `function`。\n\n函数对于那些需要精确控制特定任务何时发生（如果发生的话）的情况也非常有用。如果你只是在页面的 `<script>` 和 `</script>`\
  \ 标签之间输入一些语句，浏览器会在页面加载时自动运行这些语句。然而，函数内部的语句不会被浏览器自动执行。（实际上，该规则有一些例外，我会在本章稍后的部分简要提到。）相反，只有当你的代码要求函数运行或者发生了某些事件（例如用户点击按钮），且你已经设置好页面以响应该事件运行函数时，函数才会执行。\n\
  \n## 函数的结构\n\n函数的结构结构如下：\n\n```javascript\nfunction functionName([arguments]) {\n\
  \    JavaScript statements\n}\n```\n\n以下是函数各个部分的总结：\n\n- `function`：标识随其后的代码块为函数。\n\
  - `functionName`：函数的唯一名称。我在第 4 卷 第 2 章 中为变量概述的命名规则和准则也适用于函数名。\n- `arguments`：传递给函数的一个或多个值，它们在函数内部充当变量。参数（有时称为\
  \ *parameters*）通常是函数在执行任务或计算时用作原始材料的一个或多个值。你始终在函数名后的括号内输入参数，并用逗号分隔多个参数。如果你不使用参数，仍然要在函数名后包含括号。\n\
  - `JavaScript statements`：这是执行函数任务或计算的代码。\n\n注意示例中的 `JavaScript statements` 这一行相对于左边距略有缩进。这是一种标准且高度推荐的编程实践，因为这使得你的代码更易读。此示例缩进了四个空格，足以完成工作但并不过度。有些程序员使用两个空格，另一些人使用单个制表符进行缩进。\n\
  \n此外，注意大括号（`{` 和 `}`）的使用。它们用于将函数的语句封装在一个块中，这告诉你（以及浏览器）函数代码的开始和结束位置。大括号出现的位置只有两条规则：\n\
  \n- 左括号必须出现在函数括号之后、第一个函数语句之前。\n- 右括号必须出现在最后一个函数语句之后。\n\n没有铁板钉的规定规定大括号出现的的位置。之前的函数语法中使用的位置是传统的，但如果你愿意，也可以自由尝试其他位置。例如：\n\
  \n```javascript\nfunction functionName([arguments])\n{\n    JavaScript statements\n\
  }\n```\n\n## 你把函数放在哪里？\n\n对于大多数应用程序，你将函数放在哪里并不重要，只要它们位于 `<script>` 块中。然而，函数最常见的用途之一是处理触发的事件。特定的事件可能会在页面加载时触发，如果这在浏览器解析相应函数之前发生，你可能会得到奇怪的结果或错误。为了防止这种情况，良好的做法是将包含所有函数的脚本放在页面的头部部分（或外部\
  \ JavaScript 文件）。\n\n同样注意，你可以在单个 `<script>` 块中添加任意数量的函数，但要确保每个函数都有唯一的名称。事实上，页面存在或引用的函数必须具有唯一名称。\n\
  \n## 调用函数\n\n在定义函数之后，你最终需要告诉浏览器执行——或*调用*（call）该 `function`。有三种主要方法可以：\n\n- 当浏览器解析\
  \ `<script>` 标签时\n- 页面加载后\n- 响应事件，例如用户点击按钮\n\n接下来的三个部分将涵盖这些场景。\n\n### 在解析 <script>\
  \ 标签时调用函数\n\n调用函数的最简单方法是在脚本中包含一个仅由函数名加括号组成的语句（假设你的函数没有参数）。以下代码（查看此书中示例文件中的 bk04ch05/exaample01.html）提供了一个示例。（我列出了整个页面，以便让你看到函数和调用它的语句出现在页面代码中的位置。）\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"\
  >\n<title>在解析 <script> 标签时调用函数</title>\n<script>\nfunction displayGreeting() {\n\
  \    const currentHour = new Date().getHours();\n    if (currentHour < 12) {\n \
  \       console.log(\"Good morning!\");\n    } else {\n        console.log(\"Good\
  \ day!\");\n    }\n}\ndisplayGreeting();\n</script>\n</head>\n<body>\n\n</body>\n\
  </html>\n```\n\n\n\n\n`<script>` 标签包含一个名为 `displayGreeting` 的函数，它确定当前的小时，然后根据当前是否为早晨向控制台写入问候（查看图\
  \ 5-1）。该函数由紧随函数后面的 `displayGreeting` 语句调用。\n\n![记住](img/remember.png) 控制台是每个网络浏览器开发者工具的一部分。你使用控制台显示消息（如本节示例所示）、实时运行\
  \ JavaScript 代码以及查找脚本错误信息。你将在第 4 本第 10 章 中学习关于控制台的所有知识。\n\n![提示](img/tip.png) 在大多数网络浏览器中显示控制台，请右键点击网页，点击“检查”（或在\
  \ Windows 上按下 `Ctrl+Shift+I`，或在 macOS 上按下 `Option+⌘  +I`），然后点击 `Console`（控制台）选项卡。\n\
  \n![解析 <script> 标签时调用函数的示例截图](img/9781394164684-fg040501.png)\n\n图 5-1: 解析 `<script>`\
  \ 标签时调用函数的示例。\n\n### 在页面加载后调用函数\n\n如果你的函数引用了页面元素，那么从页面的 `head` 区域内部调用该函数将不起作用，因为当浏览器解析脚本时，页面的其余尚未加载，因此你的元素引用将失败。\n\
  \n为了解决这个问题，请在 `body` 区域的末尾、闭合的 `</body>` 标签之前放置另一个 `<script>` 标签，如下所示（查看 bk04ch05/example02.html）：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"\
  >\n<title>在页面加载后调用函数</title>\n<script>\nfunction makeBackgroundRed() {\n  document.body.style.backgroundColor\
  \ = \"red\";\n  console.log(\"The background is now red.\");\n}\n</script>\n</head>\n\
  <body>\n<!-- 其他 body 元素放在此处 -->\n<script>\nmakeBackgroundRed();\n</script>\n</body>\n\
  </html>\n```\n\n`makeBackgroundRed` 函数执行了两个件事：它使用 `document.body.style.backgroundColor`\
  \ 将 `body` 元素的背景颜色更改为红色，并使用 `console.log` 在控制台上写入相应的消息。\n\n在函数中，`document.body`\
  \ 是对 `body` 元素的引用，它在页面完全加载之前并不“存在”。这意味着如果你尝试用初始脚本调用该函数，将得到错误。为了正确执行该函数，在 `body`\
  \ 元素的底部会出现第二个 `<script>` 标签，该脚本通过以下语句调用该函数：\n\n```javascript\nmakeBackgroundRed();\n\
  ```\n\n当浏览器执行该语句时，`body` 元素已经存在，因此函数运行不会产生错误（查看图 5-2）。\n\n![在页面加载后调用函数的示例截图](img/9781394164684-fg040502.png)\n\
  \n图 5-2: 在页面加载后调用函数的示例。\n\n### 响应事件调用函数\n\nJavaScript 函数调用的最常见方式之一是响应某些事件。事件是一个如此重要的主题，以至于我在第\
  \ 4 本第 6 章中花了大量篇幅讲解它们。现在，请查看一个简单的应用程序：当用户点击按钮时执行函数。以下代码展示了实现这一点的一种方法（bk04ch05/example03.html）：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"\
  >\n<title>响应事件调用函数</title>\n<script>\nfunction makeBackgroundRed() {\n  document.body.style.backgroundColor=\
  \ \"red\";\n}\nfunction makeBackgroundWhite() {\n  document.body.style.backgroundColor=\
  \ \"white\";\n}\n</script>\n</head>\n<body>\n<button onclick=\"makeBackgroundRed()\"\
  >\n  Make Background Red\n</button>\n<button onclick=\"makeBackgroundWhite()\">\n\
  \  Make Background White\n</button>\n</body>\n</html>\n```\n\n我在这里所做是在脚本中放置了两个函数：`makeBackgroundRed`\
  \ 如之前一样将页面背景更改为红色，而 `makeBackgroundWhite` 将背景颜色改回白色。\n\n按钮是标准的 HTML `button` 元素（查看图\
  \ 5-3），每个按钮都包含 `onclick` 属性。该属性定义了一个*处理器*——即在用户点击按钮发生事件时要执行的函数。例如，考虑第一个按钮：\n\n```html\n\
  <button onclick=\"makeBackgroundRed()\">\n```\n\n这里的 `onclick` 属性实际上说：“当有人点击此按钮时，调用名为\
  \ `makeBackgroundRed` 的函数。”\n\n![警告](img/warning.png) 我在这里使用的示例有点过时，因为它在 HTML 标签内部定义了事件处理器，这现在被认为是不良好的编程习惯。现代方法是使用\
  \ JavaScript 设置事件监听器。我将在本章节后面的部分向你展示该示例使用事件监听器的修订版本（该部分为“理解匿名函数””）。我将在第 4 本第 6 章中更多地讨论事件监听器。\n\
  \n![响应事件调用函数的示例截图](img/9781394164684-fg040503.png)\n\n图 5-3: 响应事件调用函数的示例。\n\n##\
  \ 向函数传递值\n\n使用函数的主要原因之一是控制某些 JavaScript 代码段执行的时机。例如，上一节讨论了如何轻松使用函数进行设置，使得代码只有在点击按钮时才运行。\n\
  \n然而，使用函数的另一个主要原因是避免不必要的代码重复。为了理解我的意思，请考虑上一节中的两个函数：\n\n```javascript\nfunction makeBackgroundRed()\
  \ {\n  document.body.style.backgroundColor= \"red\";\n}\nfunction makeBackgroundWhite()\
  \ {\n  document.body.style.backgroundColor= \"white\";\n}\n```\n\n这些函数执行相同的任务——更改背景颜色——它们唯一的区别一个是将颜色改为红色，另一个改为白色。当你发现两个或多个执行相同功能的函数时，你就知道你的代码效率不高。\n\
  \n那么如何让代码更高效呢？这就是之前提到的参数（arguments）发挥作用的地方。参数是“发送”到函数的值——在编程术语中称为*传递*。参数的作用就像变量，它会自动存储所发送的值。\n\
  \n### 向函数传递单个值\n\n作为一个示例，你可以将之前的两个函数合并为一个函数，并将颜色值设置为参数。这里是实现此操作的新函数：\n\n```javascript\n\
  function changeBackgroundColor(newColor) {\n  document.body.style.backgroundColor\
  \ = newColor;\n}\n```\n\n参数命名为 `newColor` 并位于函数名后的括号内。JavaScript 会自动声明 `newColor`\
  \ 为变量，因此不需要单独的 `let` 或 `const` 语句。然后函数使用 `newColor` 值更改背景颜色。那么如何向函数传递值呢？以下代码提供了一个此操作的示例文件（bk04ch05/example04.html）：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"\
  >\n<title>向函数传递单个值</title>\n<script>\nfunction changeBackgroundColor(newColor) {\n\
  \  document.body.style.backgroundColor = newColor;\n}\n</script>\n</head>\n<body>\n\
  <button onclick=\"changeBackgroundColor('red')\">\n  Make Background Red\n</button>\n\
  <button onclick=\"changeBackgroundColor('white')\">\n  Make Background White\n</button>\n\
  </body>\n</html>\n```\n\n这里的关键是两个 `<button>` 标签中出现的 `onclick` 属性。例如：\n\n\n\n\n\n\
  ```javascript\nonclick=\"changeBackgroundColor('red')\"\n```\n\n字符串 `'red'` 被插入到函数名后的括号中，这样该值就会传递给函数本身。另一个按钮传递了值\
  \ `'white'`，函数的结果也随之改变。\n\n![Warning](img/warning.png) 在示例代码的两个 `onclick` 属性中，注意传递给函数的数值是用单引号（'）括起来的。这是必要的，因为\
  \ `onclick` 的值作为一个整体是用双引号（\"）括起来的。\n\n### 向函数传递多个值\n\n对于更复杂的函数，你可能需要使用多个参数，以便传递不同类型的值。如果你使用多个参数，请用逗号分隔每个参数，如下所示：\n\
  \n```javascript\nfunction changeColors(newBackColor, newForeColor) {\n  document.body.style.backgroundColor\
  \ = newBackColor;\n  document.body.style.color = newForeColor;\n}\n```\n\n在这个函数中，`document.body.style.color`\
  \ 语句更改了前景颜色（即页面文本的颜色）。下面的代码显示了一个修改后的页面，其中按钮向函数传递了两个值（`bk04ch05/example05.html`）：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>Passing multiple values to a function</title>\n  <script>\n    function\
  \ changeColors(newBackColor, newForeColor) {\n      document.body.style.backgroundColor\
  \ = newBackColor;\n      document.body.style.color = newForeColor;\n    }\n  </script>\n\
  </head>\n<body>\n  <h1>Passing Multiple Values to a Function</h1>\n  <button onclick=\"\
  changeColors('red', 'white')\">\n    Red Background, White Text\n  </button>\n \
  \ <button onclick=\"changeColors('white', 'red')\">\n    White Background, Red Text\n\
  \  </button>\n</body>\n</html>\n```\n\n![Warning](img/warning.png) 如果你定义了一个具有多个参数的函数，你必须始终为这些每个参数传递值。如果你没有这样做，传递的将是“值”\
  \ `undefined`，这可能会导致问题。\n\n![Technical stuff](img/technicalstuff.png) 如果你使用变量向函数传递数据，发送的只是该变量的当前值，而不是变量本身。因此，如果你在函数内部更改了参数的值，原始变量的值不会改变。这是一个例子：\n\
  \n```javascript\nlet passThis = 10;\nfunction sendMe(acceptThis) {\n  acceptThis\
  \ = 5;\n}\nsendMe(passThis);\nconsole.log(passThis);\n```\n\n变量 `passThis` 的初始值为\
  \ `10`。函数 `sendMe` 定义为接受一个名为 `acceptThis` 的参数，并将该参数的值改为 `5`。调用 `sendMe` 并将 `passThis`\
  \ 变量的值传递给它。然后，`console.log` 语句显示 `passThis` 的值。如果你运行这段代码，显示的值将是 `10`，即 `passThis`\
  \ 的原始值。换句话说，在函数内部更改 `acceptThis` 的值对 `passThis` 变量的值没有影响。\n\n### 使参数变为可选\n\n在你的大多数函数中，参数是必选的，如果在调用函数时没有包含所有参数，函数将以某种方式失败。然而，将参数设为可选并不罕见。你的函数可能仍然需要某种值来产生正确的结果，但你可以指定一个在函数调用未包含该参数时使用的默认值。\n\
  \n例如，考虑以下计算小费的函数：\n\n```javascript\nfunction calculateTip(preTip, tipPercent) {\n\
  \  const tipResult = preTip * tipPercent;\n  return tipResult;\n}\n```\n\n这是一个调用示例：\n\
  \n```javascript\ncalculateTip(100, 0.15);\n```\n\n如果你通常给 15% 的小费，那么如果不需要在每次函数调用时都指定\
  \ `tipPercent` 参数，那就太好了。你可以设置这种设置——即你可以将 `tipPercent` 参数设为可选——通过将 `tipPercent` 参数设置为默认值来实现，如下所示：\n\
  \n```javascript\nfunction calculateTip(preTip, tipPercent = 0.15) {\n  const tipResult\
  \ = preTip * tipPercent;\n  return tipResult;\n}\n```\n\n现在你可以像这样调用这个函数：\n\n```javascript\n\
  calculateTip(100);\n```\n\nJavaScript 注意到缺少了 `tipPercent` 参数，因此它在计算时使用了 `0.15` 作为默认值。\n\
  \n![Tip](img/tip.png) 如果你的函数有多个可选参数，在调用函数时如何跳过中间的某个参数呢？问得好！这里有一个此类函数的示例，第二个和第三个参数是可选的：\n\
  \n```javascript\nfunction addEmUp(argA, argB = 10, argC = 15) {\n  return argA +\
  \ argB + argC;\n}\n```\n\n在函数调用中如何只跳过第二个参数？你传递 `undefined` 值，如下：\n\n```javascript\n\
  addEmUp(100, undefined, 200);\n```\n\n![Remember](img/remember.png) 指定默认值以使函数参数可选是\
  \ ES6 (ECMAScript 2015) 的特性，如果你必须支持像 Internet Explorer 11 这样早已过时的浏览器，请避免使用它。\n\n\
  ## 从函数返回值\n\n到目前为止，我概述了使用函数的两个主要优势：\n\n*   你可以使用它们来控制代码何时执行。\n*   你可以使用它们将重复的代码合并到一个例程中。\n\
  \n函数为 JavaScript 带来的第三个主要优势是，你可以使用它们执行计算并返回结果。例如，这里有一个计算餐厅账单小费的函数（`bk04ch05/example06.html`）：\n\
  \n```javascript\nfunction calculateTip(preTip, tipPercent) {\n  const tipResult\
  \ = preTip * tipPercent;\n  return tipResult;\n}\nconst preTipTotal = 100.00;\n\
  const tipPercentage = 0.15;\nconst tipCost = calculateTip(preTipTotal, tipPercentage);\n\
  const totalBill = preTipTotal + tipCost;\ndocument.write(\"Your total bill is $\"\
  \ + totalBill);\n```\n\n名为 `calculateTip` 的函数接受两个参数：`preTip` 是付小费前的金额，`tipPercent`\
  \ 是计算小费的百分比。该函数声明了一个变量 `tipResult` 并使用它存储计算结果——`preTip` 乘以 `tipPercent`。关键在于函数的行：\n\
  \n```javascript\nreturn tipResult;\n```\n\n`return` 语句是 JavaScript 将值*返回*给调用语句的方式。该语句位于函数之后：\n\
  \n```javascript\ntipCost = calculateTip(preTipTotal, tipPercentage);\n```\n\n该语句首先将\
  \ `preTipTotal`（在早些时候初始化为 `100.00`）和 `tipPercentage`（在早些时候初始化为 `0.15`）传递给 `calculateTip`\
  \ 函数。当函数返回结果时，整个表达式 `calculateTip(preTipTotal, tipPercentage)` 被该结果替换，这意味着它被存储在变量\
  \ `tipCost` 中。然后 `preTipTotal` 和 `tipCost` 相加，结果存储在 `totalBill` 中，`document.write`\
  \ 语句显示了最终计算结果（查看图 5-4）。\n\n![输出的包含了自定义函数的返回值。](img/9781394164684-fg040504.png)\n\
  \n图 5-4： 输出包含了自定义函数的返回值。\n\n## 理解匿名函数\n\n让我们再次查看本章早前的函数语法：\n\n```javascript\nfunction\
  \ functionName([`*`arguments`*]) {\n  /* JavaScript statements */\n}\n```\n\n这种版本的函数语法创建了一个所谓的*命名函数*，因为——正如你猜的——这个函数有一个名字。\n\
  \n然而，创建一个没有名字的函数也是可能的：\n\n```javascript\nfunction ([`*`arguments`*]) {\n  /* JavaScript\
  \ statements */\n}\n```\n\n这种形式的函数语法创建了一个所谓的*匿名函数*，因为——没错——这个函数没有名字。\n\n\n\n\n\n\
  为什么要使用匿名函数？嗯，首先，如果你不想用，就不需要用。其次，使用匿名函数的主要原因是在不需要的时候避免创建命名对象。每个大型 Web 项目都有一个巨大的 `namespace`（命名空间），它指的是分配给变量和函数等内容的标识符的完整集合。命名空间越大，发生\
  \ `namespace collision`（命名空间冲突）的可能性就越大，即为两个不同的事物使用了相同的标识符。坏消息是！\n\n![Remember](img/remember.png)\
  \ 匿名函数是在 ES6 中引入的，所以如果你需要支持非常旧浏览器（例如 Internet Explorer 11），请不要使用它们。\n\n如果你有一个在项目中只使用一次的函数，那么将其变为匿名函数被认为是一种良好的现代编程习惯，这样你的命名空间中就少了一个标识符。\n\
  \n好了，我听出你在想：你之前说我们通过使用函数名来调用函数。如果匿名函数没有名称，我们该如何运行它呢？非常棒的问题！主要有两种方法可以来看：\n\n*   将函数赋值给变量\n\
  *   用函数本身替换函数调用\n\n### 将匿名函数赋值给变量\n\n再次，这里是上一节的示例代码：\n\n```\nconst preTipTotal =\
  \ 100.00;\nconst tipPercentage = 0.15;\nfunction calculateTip(preTip, tipPercent)\
  \ {\n  const tipResult = preTip * tipPercent;\n  return (tipResult);\n}\nconst tipCost\
  \ = calculateTip(preTipTotal, tipPercentage);\nconst totalBill = preTipTotal + tipCost;\n\
  document.write(\"Your total bill is $\" + totalBill);\n```\n\n这段代码定义了命名函数 `calculateTip()`，并在之后使用\
  \ `tipCost` 变量来存储函数结果。这是一个不需要命名函数的完美示例，因为你只使用过了一次该命名函数来计算 `tipCost` 值。在不需要时向命名空间添加标识符被称为“污染”（`polluting`）命名空间，这在现代\
  \ JavaScript 编程中是一个大忌。\n\n你可以重写这段代码以使用匿名函数（`bk04ch05/example07.html`）：\n\n```javascript\n\
  const preTipTotal = 100.00;\nconst tipPercentage = 0.15;\n// 使用匿名函数声明 tipCost\n\
  const tipCost = function (preTip, tipPercent) {\n  const tipResult = preTip * tipPercent;\n\
  \  return (tipResult);\n}\nconst totalBill = preTipTotal + tipCost(preTipTotal,\
  \ tipPercentage);\ndocument.write(\"Your total bill is $\" + totalBill);\n```\n\n\
  这里很大的变化是，现在我将 `tipCost` 变量的值为一个匿名函数。这个匿名函数与之前的 `calculateTip()` 命名函数相同，只是没有名称。在倒数第二语句中，我们通过使用\
  \ `tipCost(preTipTotal, tipPercentage)` 调用匿名函数。\n\n### 用匿名函数替换函数调用\n\n匿名函数常见的用途之一是需要将函数作为参数传递给另一个函数。传递的函数被称为\
  \ `callback`（回调）函数。\n\n首先，这里有一个使用命名函数的示例（`bk04ch05/example08.html`）：\n\n```html\n\
  <body>\n  <button id=\"bgRed\">Make Background Red</button>\n  <button id=\"bgWhite\"\
  >Make Background White</button>\n  <script>\n    function makeBackgroundRed() {\n\
  \      document.body.style.backgroundColor= 'red';\n    }\n    function makeBackgroundWhite()\
  \ {\n      document.body.style.backgroundColor= 'white';\n    }\n    document.getElementById('bgRed').addEventListener(\n\
  \      'click',\n      makeBackgroundRed\n    );\n    document.getElementById('bgWhite').addEventListener(\n\
  \      'click',\n      makeBackgroundWhite\n    );\n  </script>\n</</body>\n```\n\
  \n脚本声明了两个命名函数：`makeBackgroundRed()` 和 `makeBackgroundWhite()`。代码随后创建了两个事件监听器。其中一个监听\
  \ `id` 值为 `bgRed` 的按钮的点击，当检测到点击时，运行 `makeBackgroundRed()` 回调函数。另一个事件监听器监听 `id` 值为\
  \ `bgWhite` 的按钮的点击，当检测到点击时，运行 `makeBackgroundWhite()` 回调函数。参阅第 4 卷第 6 章 获取 `document`\
  \ 对象以及 `getElementById()` 和 `addEventListener()` 方法的详情。\n\n再次，你有两个不需要命名的函数，因此你可以通过用匿名函数替换回调来将它们从命名空间中移除。这是修改后的代码（`bk04ch05/example09.html`）：\n\
  \n```html\n<body>\n  <button id=\"bgRed\">Make Background Red</button>\n  <button\
  \ id=\"bgWhite\">Make Background White</button>\n  <script>\n    document.getElementById('bgRed').addEventListener(\n\
  \      'click',\n      function() {\n        document.body.style.backgroundColor=\
  \ 'red';\n      }\n    );\n    document.getElementById('bgWhite').addEventListener(\n\
  \      'click',\n      function() {\n        document.body.style.backgroundColor=\
  \ 'white';\n      }\n    );\n  </script>\n</body>\n```\n\n### 转向箭头函数\n\n随着 JavaScript\
  \ 学习的深入，你会发现自己不断地使用匿名函数。当你达到那个阶段时，你会高兴地知道 ES6 还提供了一种简单的匿名函数语法。也就是说，而不是使用这种：\n\n\
  ```javascript\nfunction ([arguments]) {\n  JavaScript statements\n}\n```\n\n你可以使用这种：\n\
  \n```javascript\n([arguments]) => {\n  JavaScript statements\n}\n```\n\n我所做的只是删除了\
  \ `function` 关键字，并在参数和左括号之间替换为字符 `=` 和 `>`。`=>` 字符看起来像一个箭头（JavaScript 程序员称其为 `fat\
  \ arrow` 胖箭头），所以这种版本的语法被称为 `arrow function`（箭头函数）。\n\n![Remember](img/remember.png)\
  \ 箭头函数是 ES6 的发明，所以如果你需要支持非常旧浏览器（例如 Internet Explorer 11），请不要使用它们。\n\n例如，这里是之前的一个匿名函数（将匿名函数赋值给变量）：\n\
  \n```javascript\n// 使用匿名函数声明 tipCost\nconst tipCost = function (preTip, tipPercent)\
  \ {\n  const tipResult = preTip * tipPercent;\n  return (tipResult);\n}\n```\n\n\
  你可以使用箭头函数重写它（`bk04ch05/example10.html`）：\n\n```javascript\n// 使用箭头函数声明 tipCost\n\
  const tipCost = (preTip, tipPercent) => {\n  const tipResult = preTip * tipPercent;\n\
  \  return (tipResult);\n}\n```\n\n如果你的匿名函数只包含一条语句，你可以利用箭头函数的一个特性 `implicit return`（隐式返回）:\
  \ \n\n```javascript\n([arguments]) => statement\n```\n\n在这里，JavaScript 假设单语句函数意味着函数在执行该语句后立即返回，因此你可以省略大括号和\
  \ `return` 关键字。这是一个示例：\n\n```javascript\n// 使用带有隐式返回的箭头函数声明 tipCost\nconst tipCost\
  \ = (preTip, tipPercent) => preTip * tipPercent;\n```\n\n同样，这里是上一节中的一个匿名回调函数：\n\n\
  ```javascript\ndocument.getElementById('bgRed').addEventListener(\n  'click',\n\
  \  function() {\n    document.body.style.backgroundColor= 'red';\n  }\n);\n```\n\
  \n你可以按照如下方式重写这段代码以使用带有隐式返回的箭头函数（`bk04ch05/example11.html`）：\n\n```javascript\ndocument.getElementById('bgRed').addEventListener(\n\
  \  'click',\n  () => document.body.style.backgroundColor= 'red'\n);\n```\n\n###\
  \ 未来运行函数\n\n在本书目前展示的脚本中，代码以以下三种方式之一执行：\n\n*   在页面加载时自动执行\n*   当你的脚本调用函数时\n*   响应某些事件，例如用户点击按钮\n\
  \nJavaScript 还提供了第四种基于时间的执行方法。有两种可能：\n\n*   在指定的毫秒数后运行某些代码。这被称为 `timeout`（超时）。\n\
  *   在指定的毫秒数后运行某些代码，每当该毫秒数过期时重复一次。这被称为 `interval`（间隔）。\n\n\n\n\n接下来的几个章节将向你展示如何设置这两个程序。\n\
  \n### 使用超时执行一次未来的操作\n\n要设置 JavaScript 超时，请使用 `setTimeout()` 方法：\n\n```javascript\n\
  setTimeout(function, delay, arg1, arg2, …)\n```\n\n*   `function`: 你希望 JavaScript\
  \ 在超时到期后运行的匿名函数或具名函数。除了函数外，你也可以使用用引号括起来的 JavaScript 语句。\n*   `delay`: JavaScript\
  \ 在执行 `function` 之前等待的毫秒数。\n*   `arg1`, `arg2`, `…`: 传递给 `function` 的可选参数。\n\n注意，`setTimeout()`\
  \ 返回一个用于唯一标识该超时的值。你可以存储这个值，以防稍后需要取消该超时（将在在本节的稍后部分描述）。\n\n以下是展示了 `setTimeout()` 是如何工作的代码（bk04ch05/example12.html）：\n\
  \n```javascript\n// 创建一条消息\nconst str = \"Hello World!\";\n// 设置超时\nconst timeoutId\
  \ = setTimeout(function (msg) {\n  document.write(msg);\n}, 5000, str);\n```\n\n\
  该脚本首先创建一个消息字符串并将其存储在 `str` 变量中。然后，`setTimeout()` 方法告诉 JavaScript 在五秒（5,000 毫秒）后运行一个匿名函数，并将\
  \ `str` 变量传递给该函数。匿名函数接收 `msg` 参数并使用 `document.write()` 将其显示在页面上。\n\n如果你设置了超时，然后由于某些原因决定不再执行该代码，你可以通过运行\
  \ `clearTimeout()` 方法来取消超时：\n\n```javascript\nclearTimeout(id)\n```\n\n*   `id`:\
  \ 用于存储 `setTimeout()` 方法返回值的变量名。\n\n例如，假设你使用以下语句设置了超时：\n\n```javascript\nconst timeoutId\
  \ = setTimeout(function (msg) {\n  document.write(msg);\n}, 5000, str);\n```\n\n\
  你可以使用以下语句取消超时：\n\n```javascript\nclearTimeout(timeoutId);\n```\n\n### 使用间隔重复执行未来的操作\n\
  \n在指定的秒数后运行一次代码只是偶尔有用的程序。一种更实用的技能是在指定的间隔内重复代码。这使你能够设置倒计时、定时器、动画、图片幻灯片等。要设置间隔，请使用\
  \ `setInterval()` 方法：\n\n```javascript\nsetInterval(function, delay, arg1, arg2,\
  \ …)\n```\n\n*   `function`: 你希望 JavaScript 在每个间隔结束时运行的匿名函数或具名函数。除了函数，你也可以使用用引号括起来的\
  \ JavaScript 语句。\n*   `delay`: 每个间隔的毫秒数，在该数之后 JavaScript 将执行 `function`。\n*   `arg1`,\
  \ `arg2`, `…`: 传递给 `function` 的可选参数。\n\n与 `setTimeout()` 一样，`setInterval()` 方法返回一个唯一标识该间隔的值。你使用该值通过\
  \ `clearInterval()` 方法来取消间隔：\n\n```javascript\nclearInterval(id);\n```\n\n*   `id`:\
  \ 用于存储 `setInterval()` 方法返回值的变量名。\n\n例如，假设你使用以下语句设置了间隔：\n\n```javascript\nconst\
  \ intervalId = setInterval(countdown, 5000);\n```\n\n你可以使用以下语句取消间隔：\n\n```javascript\n\
  clearInterval(intervalId);\n```\n\n注意，虽然在 `setTimeout()` 中 `clearTimeout()` 方法是可选的，但在使用\
  \ `setInterval()` 时，你应该始终使用 `clearInterval()`。否则，间隔将一直执行下去。\n\n下面的代码演示了 `setInterval()`\
  \ 和 `clearInterval()`（bk04ch05/example13.html）：\n\n```javascript\nlet counter =\
  \ 10;\n// 设置间隔\nconst intervalId = setInterval(function () {\n  // 显示倒计时然后递减计数器\n\
  \  document.open();\n  document.write(counter);\n  counter -= 1;\n  // 在我们达到 0 后取消间隔\n\
  \  if (counter < -1) {\n    clearInterval(intervalId);\n    document.open();\n \
  \   document.write(\"All done!\");\n  }\n}, 1000);\n```\n\n该脚本的作用是在页面上显示从 10 到 0\
  \ 的倒计时。该脚本首先声明一个名为 `counter` 的变量并将其初始化为 `10`。然后，`setInterval()` 方法设置了一个每一秒（1,000\
  \ 毫秒）运行一次的匿名函数。该匿名函数使用 `document.open` 清空页面，在页面上显示 `counter` 的当前值，并递减 `counter`。然后，一个\
  \ `if` 测试检查 `counter` 的值。如果是负数，则意味着 `counter` 刚刚为 `0`，因此完成。`clearInterval()` 方法取消了间隔，然后向页面写入最后的消息。\n\
  \n## 理解变量作用域\n\n在编程中，变量的 `作用域`（scope）定义了变量在脚本的何处可以使用以及何时无法。换句话说，变量的作用域决定了哪些语句和函数可以访问并处理它。你需要关注作用域的两个主要原因：\n\
  \n*   你可能想在多个函数中使用相同的变量名。在这种情况下，你希望确保对正在处理的变量不会产生混淆。\n*   你可能需要在多个块中使用同一个变量。否则，你希望限制变量的作用域。\n\
  \nJavaScript 允许建立三种类型的作用域：\n\n*   块作用域\n*   函数作用域\n*   全局作用域\n\n接下来的三个章节将详细介绍每种类型。\n\
  \n### 作用域\n\n当变量具有块作用域时，意味着它是使用 `let` 或 `const` 在语句块中（即大括号 `{` 和 `}` 之间）声明的，只有该块内的语句可以访问它。块外部的语句和其他块中的语句无法访问它（bk04ch05/example14.html）：\n\
  \n```javascript\nif (true) {\n  const myMessage = \"I'm in the scope!\";\n  console.log(\"\
  Inside the block: \" + myMessage);\n}\nconsole.log(\"Outside the block: \" + myMessage);\n\
  ```\n\n此代码使用 `if` 结构创建一个语句块。在该块内部，代码声明了一个名为 `myMessage` 的变量，将其赋值为文本字符串，并使用 JavaScript\
  \ 的 `console.log()` 方法在控制台中显示该字符串。\n\n在块外部，另一个 `console.log` 语句尝试显示 `myMessage`\
  \ 变量。然而，如图 5-5 所示，JavaScript 生成了错误信息 `myMessage is not defined`。为什么？因为 `myMessage`\
  \ 变量的作用域仅限于 `if` 块。块外部的语句“看不到” `myMessage` 变量，因此无物可显示。事实上，在 `if` 语句执行完毕后 JavaScript\
  \ 从内存中完全删除了 `myMessage` 变量，这就是为什么最后引用的 `myMessage` 变量是未定义的。\n\n![尝试在块之外显示 myMessage\
  \ 变量导致错误的截图](img/9781394164684-fg040505.png)\n\n[图 5-5：尝试在块之外显示 myMessage 变量会导致错误。]\n\
  \n### 函数作用域\n\n当变量具有函数作用域（通常也称为局部作用域）时，意味着变量是在函数内部声明的，只有该函数内部的语句可以访问它。函数外部的语句和其他函数中的语句无法访问它。下面的代码演示了函数作用域：\n\
  \n```javascript\nfunction A() {\n```\n\n\n\n\n```javascript\nconst myMessage = \"\
  I'm in the scope!\";\n\nconsole.log(\"Function A: \" + myMessage);\n}\n\nfunction\
  \ B() {\nconsole.log(\"Function B: \" + myMessage);\n}\n\nA();\nB();\n```\n\n这里有两个函数，分别命名为\
  \ `A()` 和 `B()`。函数 `A()` 声明了一个名为 `myMessage` 的变量，将其设置为一个文本字符串，并使用 JavaScript 的 `console.log()`\
  \ 方法在控制台中显示该字符串。\n\n函数 `B()` 同样使用 `console.log` 尝试显示 `myMessage` 变量。如图 5-6 所示，JavaScript\
  \ 会生成一个显示 `myMessage is not defined` 的错误。为什么呢？因为 `myMessage` 变量的作用范围仅限于函数 `A()`；函数\
  \ `B()` 无法“看到” `myMessage` 变量，而该变量在函数 `A()` 执行完毕后就从内存中被移除了。\n\n![在函数 B() 中尝试使用 myMessage\
  \ 变量报错的截图。](img/9781394164684-fg040506.png)\n\n图 5-6： 在函数 `B()` 中使用 `myMessage`\
  \ 变量报错。\n\n如果你尝试在任何函数之外使用 `myMessage` 变量，会出现相同的结果，如下代码所示：\n\n```javascript\nfunction\
  \ A() {\nconst myMessage = \"I'm in the scope!\";\nconsole.log(\"Function A: \"\
  \ + myMessage);\n}\n\nA();\n// 以下语句会生成错误：\nconsole.log(myMessage);\n```\n\n####\
  \ 使用全局作用域\n\n如果你想在多个函数中甚至在同一页面的多个脚本块中使用同一个变量怎么办？在这种情况下，你需要使用*全局*（global）作用域，这使得变量可以被页面上的任何语句或函数访问。（这就是为什么全局作用域也被称为*页面级*作用域。）要设置具有全局作用域的变量，请在任何块或函数之外声明它。以下代码演示了这种用法（bk04ch05/example16.html）：\n\
  \n```javascript\nconst myMessage = \"I've got global scope!\";\n\nif (true) {\n\
  console.log(\"Inside the if block: \" + myMessage);\n}\n\nfunction C() {\nconsole.log(\"\
  Function C: \" + myMessage);\n}\n\nC();\nconsole.log(\"Outside any block or function:\
  \ \" + myMessage);\n```\n\n脚本首先声明变量 `myMessage` 并将其赋值为一个字符串字面量。然后，一个 `if` 块使用 `console.log`\
  \ 语句尝试显示 `myMessage` 的值。接下来，创建了一个名为 `C()` 的函数，并显示一条控制台消息，尝试显示 `myMessage` 的值。调用该函数后，另一个\
  \ `console.log` 语句尝试在任何块或函数之外显示 `myMessage` 的值。图 5-7 显示了结果：三个 `console.log` 语句都能顺利地显示\
  \ `myMessage` 的值。\n\n![当声明全局变量时，可以在任何块或函数的内部和外部访问其值的截图。](img/9781394164684-fg040507.png)\n\
  \n图 5-7： 当你声明全局变量时，可以在任何块或函数的内部和外部访问其值。\n\n## 使用递归函数\n\n对函数执行的最奇的操作之一是让它执行自身。也就是说，你在函数内部放置了一个调用该函数的语句。这被称为*递归*（recursion），这样的函数被称为*递归函数*（recursive\
  \ function）。\n\n在尝试实际示例之前，这里有一个演示基本步骤的脚本（bk04ch05/example17.html）：\n\n```javascript\n\
  let counter = 0;\naddOne();\n\nfunction addOne() {\ncounter += 1;\nif (confirm(\"\
  counter is now \" + counter + \". Add another one?\")) {\naddOne();\n}\n}\ndocument.write(\"\
  Counter ended up at \" + counter);\n```\n\n脚本首先声明名为 `counter` 的变量并将其初始化为 `0`。然后调用名为\
  \ `addOne()` 的函数。该函数增加 `counter` 的值。然后它显示 `counter` 的当前值并询问你是否再增加一个。如果你点击 OK，就会再次调用\
  \ `addOne()` 函数，但这次是在 `addOne()` 内部调用的！这意味着整个过程会不断重复，直到你最终在对话框中点击“取消”。函数完全退出后，一个\
  \ `document.write()` 语句会显示最终 `counter` 总数。\n\n递归在现实世界中有什么用处？这是一个很好的问题。考虑一个常见的业务问题：根据公司利润的百分比计算利润分享方案。这不是一个简单的乘法问题，因为利润部分是由利润分享金额决定的。例如，假设一家公司的销售额为\
  \ 1,000,000，支出为 900,000。这剩下 100,000 的利润。如果公司与员工分享利润的 10%，金额将是 10,000。但由于利润分享金额本身是一项支出，新的利润变成了\
  \ 90,000，而它的 10% 是 9,000。这个过程一直持续直到数字收敛。\n\n猜测接近计算值的过程被称为*收敛*（convergence）。当猜测足够接近（例如在\
  \ 1 元以内）时，就可以停止了。\n\n这是一个递归运行的脚本。查看以下代码（bk04ch05/example18.html）：\n\n```javascript\n\
  const profitSharingPercent = 0.1;\nconst grossProfit = 10000;\nlet netProfit;\n\n\
  // 这是初始猜测\nlet profitSharing = grossProfit * profitSharingPercent;\ncalculateProfitSharing(profitSharing);\n\
  \nfunction calculateProfitSharing(guess) {\n  // 首先，计算新的利润\n  netProfit = grossProfit\
  \ - guess;\n  // 现在用它再次猜测利润分享值\n  profitSharing = Math.ceil(netProfit * profitSharingPercent);\n\
  \  // 我们有解决方案了吗？\n  if ((netProfit + profitSharing) != grossProfit) {\n    // 如果没有，再次代入\n\
  \    calculateProfitSharing(profitSharing);\n  }\n}\n\n// 写入解决方案\ndocument.write(\"\
  Gross Profit: \" + grossProfit +\n  \"<br>Net Profit: \" + netProfit +\n  \"<br>Profit\
  \ Sharing: \" + profitSharing);\n```\n\n变量 `grossProfit` 初始化为 `10000`，声明了变量 `netProfit`，变量\
  \ `profitSharingPercent` 设置为 `0.1`（10%），并将变量 `profitSharing` 设置为总利润的 10% 的初始猜测。然后调用\
  \ `calculateProfitSharing` 函数，并将 `profitSharing` 猜测作为参数 `guess` 的初始值传入。\n\n\n\n\n\
  该函数首先计算 `netProfit`，然后使用该值计算新的 `profitSharing` 数字。记住，你这里的目标是让 `netProfit` 和 `profitSharing`\
  \ 的和等于 `grossProfit`。`if` 语句会进行这一测试，如果总和不等于 `grossProfit`，就会再次调用 `calculateProfitSharing()`\
  \ 函数（这里就是递归），这次将传入新的 `profitSharing` 值。当最终找到正确的值时，函数将退出并显示结果，如图 5-8 所示。\n\n![记住](img/remember.png)\
  \ 注意，上一个示例中的所有变量都声明为全局变量。这是因为如果你在 `calculateProfitSharing()` 函数内部声明它们，它们在每次调用时都会被清除并重置，这并不是你在执行递归时所想要的结果。\n\
  \n![使用递归计算利润分值的截图](img/9781394164684-fg040508.png)\n\n图 5-8： 使用递归计算利润分值。\n\n# 第\
  \ 6 章\n\n# 玩转文档对象模型 (DOM)\n\n## 本章内容\n\n* ![项目](img/check.png) **理解对象**\n* ![项目](img/check.png)\
  \ **操纵对象的属性和方法**\n* ![项目](img/check.png) **深入研究文档对象模型**\n* ![项目](img/check.png)\
  \ **弄懂事件**\n* ![项目](img/check.png) **处理鼠标点击、按键及更多操作**\n\n*程序员就像诗人，他们的工作离纯粹的思想物质只有一步之遥。他们在空中构筑城堡，利用空气，通过想象力的运用来创造它们。很少有创作媒介能如此灵活、如此易于打磨和重做、如此容易地实现宏大的概念结构。*\n\
  \n——弗雷德·布鲁克斯 (FRED BROOKS)\n\n在过去的几章节中，我讨论了很多 JavaScript，但从现实意义上说，这一切都只是编程层面的“吃几道开菜”。现在是时候坐下来吃主菜了：编写文档对象模型。我会很快解释它是什么，但现在只需要知道它意味着控制网页的每一个方面即可。想动态更改网页上的某些文本？JavaScript\
  \ 可以做到。想在页面上添加一个元素？JavaScript 能够胜任。想修改元素的 CSS？JavaScript 对此游刃有余。想根据用户点击某些内容或按下组合键来执行某些操作？JavaScript\
  \ 会举起手说：“噢，噢，选我，选我！”\n\n在本章中，你将探索文档对象模型这个迷人的世界。你将学习许多强大的编码技术，这些技术让你让你的网页执行几乎任何你想它们做的事情。你还会发现，这正是\
  \ Web 编程变得有趣甚至可能有一点上瘾的地方（我保证是良好的方面）。\n\n## 与对象交互\n\n在开始讨论文档对象模型之前，你需要熟悉该名称中可以认为最重要的词：`object`（对象）。在接下来的几页内容中，你将学习什么是对象、你可以对它们做什么，以及它们为什么重要。\n\
  \n### 到底什么是对象？\n\n只有最简单的 JavaScript 程序才会只做给变量赋值和计算表达式。为了超越这些基础的编程起步——即编写真正实用的脚本——你必须做\
  \ JavaScript 设计之初要做的事情：操作它正在显示的网页。这才是 JavaScript 的核心所在，而这种操作可以有许多不同的形式：\n\n* 向 `element`（元素）添加文本和\
  \ HTML 属性。\n* 修改类或其他选择器的 CSS `property`（属性）。\n* 在浏览器的内部 `storage`（存储）中存储某些数据。\n\
  * 在提交 `form`（表单）数据之前对其进行验证。\n\n列表中的粗体项是可以处理的“事物”的示例，它们之所以特殊没有其他原因是因为它们是可编程的。在 JavaScript\
  \ 术语中，这些“可编程事物”被称为 `objects`（对象）。\n\n你可以通过以下三种方式在 JavaScript 中操作对象：\n\n* 你可以读取并更改对象的\
  \ `properties`（属性）。\n* 你可以通过激活与对象关联的 `method`（方法）让对象执行任务。\n* 你可以定义一个程序，当特定的 `event`（事件）发生在对象上时运行该程序。\n\
  \n为了帮助你理解对象及其属性、方法和事件，我将使用现实世界的术语来解释。具体来说，把你的电脑想象成一个 `object`：\n\n* 如果你想描述整台电脑，你会提到制造商名称、价格、硬盘容量和\
  \ RAM（内存）量等内容。这些每一项都是电脑的 `property`（属性）。\n* 你也可以用你的电脑来执行任务，如写信、计算数字和编写网页。这些是与你的电脑关联的\
  \ `methods`（方法）。\n* 电脑发生了很多事情，导致它以预定义的方式做出响应。例如，当按下电源按钮时，电脑会运行开机自检、初始化组件等。电脑自动响应的这些动作就是它的\
  \ `events`（事件）。\n\n所有这些属性、方法和事件都为你提供了对电脑的整体描述。\n\n但你的电脑也是一组对象的集合，每个对象都有自己的属性、方法和事件。例如，硬盘就有它自己的属性。\n\
  \n最后，你对电脑有一个完整的描述：它是什么样的（属性），你如何与其交互（方法），以及它对什么响应（事件）。\n\n### 操纵对象属性\n\n所有的 JavaScript\
  \ 对象至少有一个属性，有些甚至有几十个。对这些属性做什么取决于对象，但你通常用它们执行以下任务：\n\n* 获取对象当前设置的信息：例如，对于元素（如 `div`\
  \ 或 `p` 元素），你可以使用 `textContent` 属性获取当前的文本。\n* 更改对象的当前设置：例如，你可以使用 `document` 对象的\
  \ `location` 属性将浏览器跳转到不同的 URL。\n* 修改对象的外观：例如，对于元素的 `style` 对象，你可以使用 `fontSize` 属性更改字体大小。\n\
  \n#### 引用属性\n\n无论任务是什么，你都通过使用以下通用表达式语法来引用属性：\n\n`object.property`\n\n* `object`：拥有属性的对象。\n\
  * `property`：你想操作的属性名称。\n\n中间的点（`.`)被称为属性访问操作符。\n\n例如，考虑以下表达式：\n\n`document.location`\n\
  \n该表达式引用 `document` 对象的 `location` 属性，它持有当前在浏览器窗口中显示的文档地址。（在对话中，你会读这个表达式为“document\
  \ dot location”。）以下代码显示了一个单行脚本，在控制台中显示此属性，如图 6-1 所示。\n\n```\nconsole.log(document.location);\n\
  ```\n\n![提示](img/tip.png) 在大多数网络浏览器中显示控制台的方法是：右键点击网页，点击“检查”（在 Windows 上按 Ctrl+Shift+I，在\
  \ macOS 上按 Option+⌘+I），然后点击“Console”（控制台）选项卡。\n\n\n\n\n\n由于属性始终包含一个值，你可以自由地在几乎任何类型的\
  \ JavaScript 语句中使用属性表达式，并作为 JavaScript 表达式中的操作数。（要了解什么是操作数，请参考第 4 本的第 3 章。）例如，以下语句将\
  \ `document.location` 属性的当前值赋值给名为 `currentUrl` 的变量：\n\n```javascript\nconst currentUrl\
  \ = document.location;\n```\n\n同样，以下语句将 `document.location` 作为字符串表达式的一部分：\n\n```javascript\n\
  const message = \"The current address is \" + document.location + \".\";\n```\n\n\
  ### 某些属性是对象\n\n为了让你保持警惕，当你处理对象时，会不断遇到一个常见但又困惑的概念：某些属性兼具双重身份，可以当作完整的对象使用！这是对象与属性之间关系中最令人困惑的方面之一，但也是最重要的方面之一，因此我将深入探讨一下，以确保你理解了发生了什么。\n\
  \n基本思想是，属性返回的值通常是一个字面量（程序员术语，意为“它就是它本身”），例如字符串或数字，但它通常也是对象。后者的一个例子是 `document` 对象的\
  \ `location` 属性，它实际上返回一个 `Location` 对象。由于 `location` 是一个对象，它也有它自己的属性。例如，它有一个 `hostname`\
  \ 属性，引用地址中的主机名部分（例如，`paulmcfedries.com`）。要处理此属性，你需要相应地扩展语法：\n\n```javascript\ndocument.location.hostname\n\
  ```\n\n### 修改属性的值\n\n某些属性是“只读”的，这意味着你的代码只能读取当前值而不能更改它。然而，许多属性是“可读/写”的，这意味着你也可以更改它们的值。要更改属性的值，请使用以下通用语法：\n\
  \n`object.property = value`\n\n*   `object`: 拥有该属性的对象\n*   `property`: 你想要更改的属性名称\n\
  *   `value`: 字面量值（如字符串或数字）或返回你想要设置的属性的值的表达式\n\n这里有一个例子：\n\n```javascript\nconst\
  \ newAddress = prompt(\"Enter the address you want to surf to:\");\ndocument.location\
  \ = newAddress;\n```\n\n此脚本提示用户输入网页地址，并将结果存储在 `newAddress` 变量中。然后，使用该值来更改 `document.location`\
  \ 属性，在这种情况下，它告诉浏览器打开指定的地址。\n\n### 使用对象方法\n\n每个 JavaScript 对象都至少有一个或两个方法，你可以利用这些方法让对象执行某些操作。这些操作通常分为以下类：\n\
  \n*   **模拟用户操作：** 例如，`form` 对象的 `submit()` 方法向服务器提交表单，就像用户点击了表单的提交按钮一样。\n*   **执行计算：**\
  \ 例如，`Math` 对象的 `sqrt()` 方法计算数字的平方根。\n*   **操作对象：** 例如，`String` 对象的 `toLowerCase()`\
  \ 方法将字符串中的所有字母改为小写。\n\n要运行方法，从最简单的情况开始，即不接受任何参数的方法：\n\n`object.method()`\n\n*  \
  \ `object`: 拥有你想要操作的方法的对象\n*   `method`: 你想要执行的方法名称\n\n例如，考虑以下语句：\n\n```javascript\n\
  history.back();\n```\n\n这运行 `history` 对象的 `back()` 方法，告诉浏览器返回上一个访问的页面。以下代码显示了该方法的用法：\n\
  \n```javascript\nconst goBack = confirm(\"Do you want to go back?\");\nif (goBack\
  \ === true) {\n  history.back();\n}\n```\n\n首先询问用户是否想返回。如果用户点击 OK，布尔值 `true` 将存储在\
  \ `goBack` 变量中，比较表达式 `goBack === true` 变为 `true`，因此运行 `history.back()` 方法。\n\n我在第\
  \ 4 本第 5 章中提到你可以定义一个函数使其接受一个或多个参数，这些参数随后被作为函数执行的任何计算或操作的输入值。方法与其相似之处在于它们也可以接受一个或多个参数，并将这些值作为原始数据。\n\
  \n如果方法需要参数，你使用以下通用语法：\n\n`object.method(argument1, argument2, ...)`\n\n例如，考虑在以下语句使用的\
  \ `confirm()` 方法，它接受一个参数——指定显示给用户的文本的字符串：\n\n```javascript\nconfirm(\"Do you want\
  \ to go back?\")\n```\n\n最后，与属性一样，如果方法返回一个值，你可以将该值赋值给变量（正如我在前面的示例中对 `confirm()`\
  \ 方法所做的那样），或者你可以将方法合并到表达式中。\n\n### 自定义对象\n\n虽然你主要处理的是预制对象，例如内置在 JavaScript 中的对象或由\
  \ Web API 暴露的对象（参见下一节），但你也可以创建自己的对象。为什么要这样做呢？有很多原因，但就你这里的用途而言，最大的原因是自定义对象允许你在单个数据结构中存储多个相关值。\n\
  \n例如，假设你的脚本需要处理以下应用于页面样式的用户偏好：背景颜色、字体颜色、字体大小和字体。你可以将这些偏好存储在单独的变量中：\n\n```javascript\n\
  const bgColor = \"darkolivegreen\";\nconst textColor = \"antiquewhite\";\nconst\
  \ fontSize = \"1.25em\";\nconst typeface = \"Comic Sans\";\n```\n\n这种方法并不糟糕，但如果你存储的偏好增加到\
  \ 10 个或 15 个，就会变得非常笨。处理此类数据的更好、更灵活的方法是使用以下语法将一切倒入一个自定义对象中：\n\n```javascript\nconst\
  \ objectName = {\n  propertyName1: value1,\n  propertyName2: value2,\n  ...\n  propertyNameN:\
  \ valueN\n}\n```\n\n*   `objectName`: 对象的变量名\n*   `propertyName1` 到 `propertyNameN`:\
  \ 对象的属性名称\n*   `value1` 到 `valueN`: 分配给属性的值\n\n这种数据结构被称为对象字面量。这里是你使用对象字面量来存储之前的用户偏好：\n\
  \n```javascript\nconst userPrefs = {\n  bgColor: \"darkolivegreen\",\n  textColor:\
  \ \"antiquewhite\",\n  fontSize: \"1.25em\",\n  typeface: \"Comic Sans\"\n};\n```\n\
  \n然后你可以使用标准的 `property.value` 语法引用属性值：\n\n```javascript\ndocument.body.style.backgroundColor\
  \ = userPrefs.bgColor;\n```\n\n你也可以用通常的方法更改属性值：\n\n```javascript\nuserPrefs.textColor\
  \ = \"papayawhip\";\n```\n\n![Remember](img/remember.png) 等一下，用 `const` 声明了 `userPrefs`，然后更改了属性值。这怎么可能的？这是一个常见问题，它直击使用\
  \ `const` 声明变量的真正含义。在这种情况下，`const` 是将 `userPrefs` 绑定到一个特定的对象，你不能更改该绑定。然而，你可以自由地更改该对象的*内容*。\n\
  \n关于自定义对象方法呢？是的，你也可以添加它们：\n\n```javascript\nconst objectName = {\n  propertyName1:\
  \ value1,\n  propertyName2: value2,\n  ...\n  propertyNameN: valueN,\n  methodName:\
  \ function(arguments) {\n    code\n  }\n};\n```\n\n*   `methodName`: 方法名称\n\n\n\n\
  \n\n*   `arguments`: 方法所接收的参数列表（可选，用逗号分隔）\n*   `code`: 调用该方法时运行的 JavaScript 代码\n\
  \n这是一个示例（参见此书中示例文件中的 `bk04ch06/example00.html`）：\n\n```javascript\nconst userPrefs\
  \ = {\n  bgColor: \"darkolivegreen\",\n  textColor: \"antiquewhite\",\n  textSize:\
  \ \"1.25em\",\n  typeface: \"Comic Sans\",\n  resetDefaults: function() {\n    document.body.style.backgroundColor\
  \ = 'white';\n    document.body.style.color = 'black';\n    document.body.style.fontSize\
  \ = '1em';\n    document.body.style.fontFamily = 'initial';\n  }\n};\n```\n\n这段代码定义了一个\
  \ `resetDefaults()` 方法，运行时，它会将背景颜色、文本颜色、文本大小和字体重置为默认值。你的代码将如下方式调用此方法：\n\n`userPrefs.resetDefaults();`\n\
  \n### Web APIs：一些特殊对象\n\nJavaScript 拥有自己的一套内置对象，包括 `String`、`Date` 和 `Math` 对象，这些都是本书第\
  \ 4 部分第 8 章的主题。然而，JavaScript 之外还存在大量的对象集合，你的脚本可以使用这些对象。这个集合被称为 Web 应用程序接口，简称 Web\
  \ APIs。\n\n为了理解 Web APIs 是如何工作的，请考虑你的汽车（如果你有一辆的话；如果没有，考虑别人的车）。汽车内部的发动机是一个极其复杂的工程产，但启动汽车时你不需要担心其中任何问题。相反，你只需要将钥匙（或遥控器，等等）插入点火器并旋转（或按下按钮，等等）。发动机及其启动过程的复杂性对你是隐藏的，它被简化为将钥匙（或遥控器，等等）插入点火器。\n\
  \n从编程的角度来看，汽车发动机是一个对象，而点火器就是所谓的接口（interface）：即访问对象属性和方法的方法（例如，启动发动机的“方法”）。\n\n简单来说，应用程序接口（API）是你的\
  \ JavaScript 代码通过暴露该对象的属性和方法来访问隐藏的（且推测是复杂的）对象的方法。幸运的是，许多 Web APIs 直接构建在网络浏览器中，因此你的\
  \ JavaScript 代码可以开箱即用地访问许多复杂的对象。\n\n一个很好的例子是 Web Storage API，它允许你的 JavaScript 代码在用户的网络浏览器中存储和检索数据。这是一个非常实用的\
  \ API，这就是为什么我专门用了一整章来介绍它（参见第四部分 9 章）。\n\n其他 Web APIs 允许你访问设备的电池状态（Battery API）、剪贴板（Clipboard\
  \ API）、服务器数据（Fetch API）、地理位置数据（Geolocation API）、音频（Web Audio API）和通知（Web Notifications）。\n\
  \n然而，对于本章的内容（实际上，对于本书的大部分内容），最重要的 API 是文档对象模型（DOM），我接下来将重点介绍它。\n\n## 了解文档对象模型\n\n\
  这里是一个简单网页的源代码：\n\n```html\n<html lang=\"en\">\n<head>\n  <title>So Many Kale Recipes</title>\n\
  </head>\n<body>\n  <header>\n    <h1>Above and Beyond the Kale of Duty</h1>\n  </header>\n\
  \  <main>\n    <p>Do you love to cook with <a href=\"kale.html\">kale</a>?</p>\n\
  \  </main>\n</body>\n</html>\n```\n\n检查这段代码的一种方法是按层级查看。也就是说，在某种意义上，`html` 元素是顶部元素，因为所有其他元素都包含在其中。层级中的下一层包含\
  \ `head` 和 `body` 元素。`head` 元素包含一个 `title` 元素，它包含文本 `So Many Kale Recipes`。同样，`body`\
  \ 元素包含一个 `header` 元素和一个 `main` 元素。`header` 元素包含一个 `h1` 元素，文本为 `Above and Beyond\
  \ the Kale of Duty`，而 `main` 元素包含一个 `p` 元素，文本为 `Do you love to cook with kale?`。\n\
  \n层级通常以视觉形式更容易理解，因此 图 6-2 以层级方式绘制了页面元素。\n\n![Remember](img/remember.png) 在说对象层级时，如果对象\
  \ P 包含对象 C，则认为 P 是对象 C 的父对象，C 是对象 P 的子对象。在 图 6-2 中，箭头代表父子子关系。此外，相同层级的元素（例如 `header`\
  \ 和 `main` 元素）被称为兄弟元素。\n\n这里有几个需要考虑的关键点：\n\n*   图 6-2 中的每个方框都代表一个对象。\n*   图 6-2\
  \ 中的每个对象都是三种类型之一：元素、文本或属性。\n*(注：原文中存在大量重复的列表项，此处按要求保留格式并翻译内容)*\n\n\n\n\n\n![Warning](img/warning.png)\
  \ 当你编写 `document` 对象的代码时，不要将`<script>` 标签放在 网页的 `head` 区域（即 `<head>` 和 `</head>`\
  \ 标签之间）。如果你将代码放在那里，网络浏览器将在尚未有机会创建 `document` 对象之前运行该代码，这意味着你的代码将会失败，而且失败得非常彻底。相反，请将`<script>`\
  \ 标签放在页面的底部，紧接在 `</body>` 标签之前。\n\n## 通过标签名指定元素\n\n除了处理单个元素外，你还可以处理元素集合。其中一种集合是页面中所有使用相同标签名的元素集合。例如，你可以引用所有的\
  \ `<a>` 标签或所有的 `<div>` 标签。这是对这些标签进行大规模更改的一种方便方法（例如，通过更改你链接中所有的 `target` 属性）。\n\n\
  返回具有相同标签的元素集合的机制是 `getElementsByTagName()` 方法：\n\n`document.getElementsByTagName(\"\
  tag\")`\n\n*   `tag`: 一个字符串，表示你想要操作的标签所使用的 HTML 名称\n\n该方法返回一个类数组集合，其中包含文档中所有使用指定标签的元素。（参阅第\
  \ 4 卷第 7 章 了解数组是如何工作的。另请查看本章后面的“操作元素集合”。）例如，要返回包含当前页面中所有 `div` 元素的集合，可以使用以下语句：\n\
  \n`const divs = document.getElementsByTagName(\"div\");`\n\n### 通过类名指定元素\n\n你可以处理的另一个元素集合是页面中所有使用相同类的元素集合。用于返回所有共享特定类名的元素的\
  \ JavaScript 工具是 `getElementsByClassName()` 方法：\n\n`document.getElementsByClassName(\"\
  class\")`\n\n*   `class`: 一个字符串，表示你想要操作的元素所使用的类名\n\n该方法返回一个类数组集合，其中包含文档中所有使用指定类名的元素。集合顺序与元素在文档中出现的顺序相同。这是一个示例：\n\
  \n`const keywords = document.getElementsByClassName(\"keyword\");`\n\n### 通过选择器指定元素\n\
  \n在第 3 卷的第 2 章 和 第 3 章 中，我讨论了 CSS 选择器，包括 id、标签、类、后代和子选择器。你可以在 JavaScript 代码中使用相同的选择器，通过使用\
  \ `document` 对象的 `querySelector()` 和 `querySelectorAll()` 方法来引用页面元素：\n\n`document.querySelector(\"\
  selector\")`\n\n`document.querySelectorAll(\"selector\")`\n\n*   `selector`: 一个字符串，表示你想要的元素或元素的选择器\n\
  \n这些方法之间的区别在于，`querySelectorAll()` 返回匹配你的选择器的元素集合，而 `querySelector()` 只返回第一个匹配你的选择器的元素。\n\
  \n例如，以下语句返回所有作为 `article` 元素直接子节点的 `section` 元素集合：\n\n`const articles = document.querySelectorAll(\"\
  article > section\");`\n\n![Remember](img/remember.png) 许多 Web 开发者比起使用三种不同的 `document`\
  \ 对象方法（即通过 id、标签和类名来引用页面元素）更倾向于使用 `querySelector()` 和 `querySelectorAll()` 提供的更通用的方法。\n\
  \n## 操作元素集合\n\n`getElementsByTagName()`、`getElementsByClassName()` 和 `querySelectorAll()`\
  \ 方法各返回一个类数组集合，其中分别包含文档中所有使用指定标签、类或选择器的元素。集合顺序与元素在文档中出现的顺序相同。例如，考虑以下 HTML 代码（查看此书示例文件中的\
  \ bk04ch06/example01.html）：\n\n```html\n<div id=\"div1\">\n  This, of course, is\
  \ div 1.\n</div>\n<div id=\"div2\">\n  Yeah, well <em>this</em> is div 2!\n</div>\n\
  <div id=\"div3\">\n  Ignore those dudes. Welcome to div 3!\n</div>\n```\n\n现在考虑以下语句：\n\
  \n`divs = document.getElementsByTagName(\"div\");`\n\n在生成的集合中，第一个项 (`divs[0]`) 将是\
  \ `id` 等于 `div1` 的 `<div>` 元素；第二个项 (`divs[1]`) 将是 `id` 等于 `div2` 的 `<div>` 元素；第三个项\
  \ (`divs[2]`) 将是 `id` 等于 `div3` 的 `<div>` 元素。\n\n你也可以直接使用 `id` 值引用元素。例如，以下语句是等价的：\n\
  \n`const firstDiv = divs[0];`\n\n`const firstDiv = divs.div1;`\n\n要了解集合中有多少项，使用\
  \ `length` 属性：\n\n`const totalDivs = divs.length;`\n\n要对集合中的每个项执行一次或多次操作，你可以使用 `for...of`\
  \ 循环来逐个遍历集合。在 JavaScript 领域中，这被称为对集合进行*迭代*（iterating）。使用的语法如下：\n\n```javascript\n\
  for (const item of collection) {\n  // perform operations\n}\n```\n\n## 遍历 DOM\n\
  \nJavaScript 代码中的一个常见任务是处理某些元素的子节点、父节点或兄弟节点。这被称为*遍历 DOM*，因为你正在使用这些技术在 DOM 层次结构中向上、向下和沿水平方向移动。\n\
  \n在接下来的章节中，我每个示例都使用以下 HTML 代码（bk04ch06/example02.html）：\n\n```html\n<html lang=\"\
  en\">\n<head>\n  <title>So Many Kale Recipes</title>\n</head>\n<body>\n  <header\
  \ id=\"page-banner\">\n    <h1>Above and Beyond the Kale of Duty</h1>\n  </header>\n\
  \  <main id=\"page-content\">\n    <p>\n      Do you love to cook with <a href=\"\
  kale.html\">kale</a>?\n    </p>\n  </main>\n</body>\n</html>\n```\n\n### 获取父元素的子节点\n\
  \n当你处理一个特定元素时，通常想要对该元素的子节点执行一次或多次操作。每个父元素都提供了几个属性，允许你处理其全部或部分部分子节点：\n\n*   所有子节点\n\
  \n*   第一个子节点\n\n*   最后一个子节点\n\n#### 获取所有子节点\n\n要返回父元素的所有子节点集合，请使用 `childNodes` 属性：\n\
  \n`parent.childNodes`\n\n*   `parent`: 你正在操作的父元素\n\n例如，以下语句将 `body` 元素的所有子节点存储在变量中：\n\
  \n\n\n` 标签且内容中包含大量的英文说明，我将根据你的要求，将该标签内的英文内容翻译为中文。\n\n以下是翻译后的内容：\n\n[content]\n\n\
  ```javascript\nconst bodyChildren = document.body.childNodes;\n```\n\n结果是一个 `NodeList`\
  \ 对象，它是节点的集合。如果你使用控制台（参考第 4 本第 10 章]）显示 `bodyChildren` 的值，将得到如图 6-4 所示的输出。\n\n![提示](img/tip.png)\
  \ 如果你需要遍历 `NodeList` 集合，可以使用我在在本节前面介绍过的 `for…of` 循环（回到“处理元素元素集合”）。\n\n![控制台中显示的\
  \ bodyChildren 变量值的截图。](img/9781394164684-fg040604.png)\n\n图 6-4： 控制台中显示的 `bodyChildren`\
  \ 变量的值。\n\n这里是控制台中显示的输出：\n\n```\nNodeList(5) [ #text, header, #text, main, #text\
  \ ]\n```\n\n`(5)` 部分告诉你有五个项目在 `NodeList` 中，根据括号内的值，你知道这些节点包含 `header` 和 `main` 元素（正如预期的那样），还有三个文本节点。这些文本节点是从哪里来的呢？它们代表（在本例中）元素之间的空白。例如，第一个文本节点是出现在\
  \ `<body>` 标签结束处和 `<header>` 标签开始处的回车符和八个空格。其他文本节点代表 `</header>` 和 `<main>` 标签之间，以及\
  \ `</main>` 和 `</body>` 标签之间的空白。\n\n如果你真正想要的是作为“元素”的子节点集合，你需要转到另一个属性：\n\n`parent.children`\n\
  \n*   `parent`: 父元素\n\n例如，以下语句将 `body` 元素的所有子元素节点存储在一个变量中：\n\n```javascript\nconst\
  \ bodyChildElements = document.body.children;\n```\n\n结果是一个 `HTMLCollection` 对象，它是类数组的元素节点集合。如果你使用控制台（参考第\
  \ 4 本第 10 章]）显示 `bodyChildElements` 的值，将得到如图 6-5 所示的输出。\n\n![控制台中显示的 bodyChildElements\
  \ 变量值的截图。](img/9781394164684-fg040605.png)\n\n图 6-5： 控制台中显示的 `bodyChildElements`\
  \ 变量的值。\n\n这里是输出：\n\n```\nHTMLCollection { 0: header, 1: main, length: 2 }\n```\n\
  \n数字 `0` 和 `1` 是每个子元素的索引。例如，你可以使用 `bodyChildElements[0]` 来引用集合中的第一个元素，在本例中它是 `header`\
  \ 元素。\n\n### 获取第一个子节点\n\n如果你使用父元素的 `childNodes` 或 `children` 属性来返回父元素的子节点（正如我在上一节中描述的那样），你可以在集合变量名后加上\
  \ `[0]` 来引用结果集合中的第一项。例如：\n\n```javascript\nbodyChildren[0]\nbodyChildElements[0]\n\
  ```\n\n然而，DOM 提供了一条更直接的获取第一个子节点的路径：\n\n`parent.firstChild`\n\n*   `parent`: 父元素\n\
  \n例如，假设你想处理本节开头 HTML 示例中 `main` 元素的第一个子节点。这里是能够完成此任务的代码（bk04ch06/example03.html）：\n\
  \n```javascript\nconst content = document.getElementById(\"page-content\");\nconst\
  \ firstContentChildNode = content.firstChild;\n```\n\n在本例中，生成的节点是文本节点（`<main>` 和\
  \ `<p>` 标签之间的空白）。如果你想获取第一个子元素元素节点，请改用 `firstElementChild` 属性：\n\n`parent.firstElementChild`\n\
  \n*   `parent`: 父元素\n\n要从本节开头的代码中获取 `main` 元素的第一个子元素节点，你可以这样操作（bk04ch06/example04.html）：\n\
  \n```javascript\nconst content = document.getElementById(\"page-content\");\nconst\
  \ firstContentChildElement = content.firstElementChild;\n```\n\n在本例中，此代码返回了 `p`\
  \ 元素。\n\n### 获取最后一个子节点\n\n如果你的代码需要处理最后一个子节点，请使用父元素的 `lastChild` 属性：\n\n`parent.lastChild`\n\
  \n*   `parent`: 父元素\n\n例如，假设你想处理本节开头 HTML 示例中 `p` 元素的最后一个子节点。这里是能够完成此任务的代码（bk04ch06/example05.html）：\n\
  \n```javascript\nconst para = document.querySelector(\"main > p\");\nconst lastParaChildNode\
  \ = para.lastChild;\n```\n\n在本例中，生成的节点是文本节点（`<main>` 和 `<p>` 标签之间的空白）。如果你想获取第一个子元素节点，请改用\
  \ `firstElementChild` 属性：\n\n`parent.firstElementChild`\n\n*   `parent`: 父元素\n\n\
  要从本节开头的代码中获取 `main` 元素的第一个子元素节点，你可以这样操作（bk04ch06/example04.html）：\n\n```javascript\n\
  const content = document.getElementById(\"page-content\");\nconst firstContentChildElement\
  \ = content.firstElementChild;\n```\n\n在本例中，此代码返回了 `p` 元素。\n\n### 获取子元素的父元素\n\n\
  如果你的代码需要处理子元素的父元素，请使用子元素的 `parentNode` 属性：\n\n`child.parentNode`\n\n*   `child`:\
  \ 子元素\n\n例如，假设你想处理本节开头 HTML 示例中 `h1` 元素的父元素。这里是能够完成此任务的代码（bk04ch06/example07.html）：\n\
  \n```javascript\nconst childElement = document.querySelector(\"h1\");\nconst parentElement\
  \ = childElement.parentNode;\n```\n\n### 获取元素的兄弟元素\n\n代码中经常需要处理元素的兄弟元素。记住，元素的兄弟元素是\
  \ DOM 中共享相同父元素的元素。父元素的子节点在 DOM 中的出现顺序与它们在 HTML 中的顺序相同，这意味着兄弟元素也按顺序排列。因此，对于一个给定的子元素，有两种兄弟情况：\n\
  \n*   **前一个兄弟**：位于 DOM 中紧挨在你处理的元素之前。如果该元素是第一个兄弟，则没有前一个兄弟。\n*   **后一个兄弟**：位于 DOM\
  \ 中紧跟在你处理的元素之后。如果该元素是最后一个兄弟，则没有后一个兄弟。\n\n#### 获取前一个兄弟元素\n\n要返回特定元素的前一个兄弟元素，使用 `previousElementSibling`\
  \ 属性：\n\n`element.previousElementSibling`\n\n*   `element`: 你处理的元素\n\n例如，以下语句将 `main`\
  \ 元素的前一个兄弟存储在一个变量中（bk04ch06/example08.html）：\n\n```javascript\nconst currElement\
  \ = document.querySelector(\"main\");\nconst prevSib = currElement.previousElementSibling;\n\
  ```\n\n#### 获取后一个兄弟元素\n\n要返回特定元素的后一个兄弟元素，使用 `nextElementSibling` 属性：\n\n`element.nextElementSibling`\n\
  \n*   `element`: 你处理的元素\n\n例如，以下语句将 `header` 元素的后一个兄弟存储在一个变量中（bk04ch06/example09.html）：\n\
  \n```javascript\nconst currElement = document.querySelector(\"header\");\nconst\
  \ nextSib = currElement.nextElementSibling;\n```\n\n\n\n\n1. **为你想要添加的元素类型创建一个对象。**\n\
  2. **将第 1 步中创建的新对象作为现有元素的子元素添加。**\n3. **在第 1 步创建的新对象中插入一些文本和标签。**\n\n#### 第 1 步：创建元素\n\
  \n对于第 1 步，你使用 `document` 对象的 `createElement()` 方法：\n\n```javascript\ndocument.createElement(elementName)\n\
  ```\n\n- `elementName`: 包含你想要创建的元素类型的 HTML 元素名称字符串\n\n该方法会创建元素并将其返回，这意味着你可以将新元素存储在变量中。这里有一个示例：\n\
  \n```javascript\nconst newArticle = createElement(\"article\");\n```\n\n#### 第 2\
  \ 步：将新元素作为子元素添加\n\n创建元素后，第 2 步是将将其添加到现有的父元素中。你有四种选择：\n\n- **将新元素追加到父元素子元素集合的末尾：**\
  \ 使用 `append()` 方法：\n\n  ```javascript\n  parent.append(child)\n  ```\n\n  - `parent`:\
  \ 指向将添加新元素的父元素的引用。\n  - `child`: 指向正在添加的子元素的引用。注意，你可以通过逗号分隔每个元素来同时添加多个元素。`child`\
  \ 参数也可以是一个文本字符串。\n\n- **将新元素插入到父元素子元素集合的开头：** 使用 `prepend()` 方法：\n\n  ```javascript\n\
  \  parent.prepend(child)\n  ```\n\n  - `parent`: 指向将插入新元素的父元素的引用。\n  - `child`:\
  \ 指向正在插入的子元素的引用。注意，你可以通过逗号分隔每个元素来同时插入多个元素。`child` 参数也可以是一个文本字符串。\n\n- **将新元素紧插入到父元素的某个现有子元素之后：**\
  \ 使用 `after()` 方法：\n\n  ```javascript\n  child.after(sibling)\n  ```\n\n  - `child`:\
  \ 指向新元素将插入之后的子元素的引用。\n  - `sibling`: 指向你正在插入的新元素的引用。注意，你可以通过逗号分隔每个元素来同时插入多个元素。`sibling`\
  \ 参数也可以是一个文本字符串。\n\n- **将新元素紧插入到父元素的某个现有子元素之前：** 使用 `before()` 方法：\n\n  ```javascript\n\
  \  child.before(sibling)\n  ```\n\n  - `child`: 指向新元素将插入之前的子元素的引用。\n  - `sibling`:\
  \ 指向你正在插入的新元素的引用。注意，你可以通过逗号分隔每个元素来同时插入多个元素。`sibling` 参数也可以是一个文本字符串。\n\n这里有一个示例创建了一个新的\
  \ `article` 元素并将其追加到 `main` 元素（bk04ch06/example10.html）：\n\n```javascript\nconst\
  \ newArticle = document.createElement(\"article\");\ndocument.querySelector(\"main\"\
  ).append(newArticle);\n```\n\n这里另一个示例创建了一个新的 `nav` 元素并将其插入到 `main` 元素的开头：\n\n```javascript\n\
  const newNav = document.createElement(\"nav\");\ndocument.querySelector(\"main\"\
  ).prepend(newNav);\n```\n\n#### 第 3 步：为新元素添加文本和标签\n\n创建元素并将其添加到父元素后，最后一步是使用 `innerHTML`\
  \ 属性添加一些文本和标签：\n\n```javascript\nelement.innerHTML = text\n```\n\n- `element`: 指向你希望在其中添加文本和标签的新元素的引用\n\
  - `text`: 包含你想要插入的文本和 HTML 标签的字符串\n\n![Warning](img/warning.png) 无论你为 `innerHTML`\
  \ 属性赋值什么值，都会完全覆盖元素现有的文本和标签，因此在使用 `innerHTML` 时要小心。查看下一节了解如何插入文本和标签而不是覆盖它们。\n\n在这个示例中，代码创建了一个新的\
  \ `nav` 元素，将其插入到 `main` 元素的开头，然后添加了一个标题（bk04ch06/example10.html）：\n\n```javascript\n\
  const newNav = document.createElement(\"nav\");\ndocument.querySelector(\"main\"\
  ).prepend(newNav);\nnewNav.innerHTML = \"<h2>Navigation</h2>\";\n```\n\n### 向元素插入文本或\
  \ HTML\n\n你可以使用元素的 `innerHTML` 属性来覆盖该元素的标签和文本，正如我在上一节中描述的那样。但通常情况下，你希望保留元素现有的标签和文本，并插入新的标签和文本。每个元素都提供了方法可以让你实现这一点：\n\
  \n- **向元素中仅插入文本：** 使用 `insertAdjacentText()` 方法：\n\n  ```javascript\n  element.insertAdjacentText(location,\
  \ text)\n  ```\n\n  - `element`: 指向将插入新文本的元素的引用。\n  - `location`: 指定插入位置的字符串。稍后将说明。\n\
  \  - `text`: 包含要插入文本的字符串。\n\n- **向元素中插入标签和文本：** 使用 `insertAdjacentHTML()` 方法：\n\n\
  \  ```javascript\n  element.insertAdjacentHTML(location, data)\n  ```\n\n  - `element`:\
  \ 指向将插入标签和文本的元素的引用。\n  - `location`: 指定插入位置的字符串。稍后将说明。\n  - `data`: 包含要插入标签和文本的字符串。\n\
  \n对于两种方法，可以使用以下字符串作为 `location`：\n\n- `\"beforebegin\"`: 插入到元素外部之前\n- `\"afterbegin\"\
  `: 插入到元素内部、第一个子元素之前\n- `\"beforeend\"`: 插入到元素内部、最后一个子元素之后\n- `\"afterend\"`: 插入到元素外部之后\n\
  \n例如，假设你的文档有以下元素：\n\n```html\n<h2 id=\"nav-heading\">Navigation</h2>\n```\n\n如果你想将标题更改为\
  \ `Main Navigation`，以下代码将完成此任务：\n\n```javascript\nconst navHeading = document.getElementById(\"\
  nav-heading\");\nnavHeading.insertAdjacentText(\"afterbegin\", \"Main \");\n```\n\
  \n### 元素\n\n如果不再需要页面上的某个元素，可以使用该元素的 `remove()` 方法将其从 DOM 中删除：\n\n```javascript\n\
  element.remove()\n```\n\n例如，以下语句从页面上移除 `id` 为 `temp-div` 的元素：\n\n```javascript\n\
  document.getElementById(\"temp-div\").remove();\n```\n\n## 使用 JavaScript 修改 CSS\n\
  \n尽管你在静态样式表（`.css`）文件中指定了 CSS 规则，但这并不意味着规则本身必须是静态的。通过 JavaScript，你可以以多种方式修改元素的 CSS。你可以\n\
  \n- 读取 CSS 属性的当前值\n- 修改 CSS 属性的值\n- 添加或移除类（class）\n- 切换类的开启或关闭\n\n### 修改元素的样式\n\n\
  \n\n\n\n大多数 HTML 标签都可以拥有一个 `style` 属性，你可以用它来设置内联样式。由于标准属性都有对应的元素对象属性（正如我稍后在“使用 JavaScript\
  \ 调整 HTML 属性”节中所解释的那样），你不会惊讶地发现，大多数元素还有一个 `style` 属性，允许你获取和修改标签的样式。它的工作原理如下：`style`\
  \ 属性实际上返回一个 `style` 对象，该对象包含了每个 CSS 属性对应的属性。在引用这些样式属性时，你需要记住两点：\n\n- 对于单单词的 CSS\
  \ 属性（如 `color` 和 `visibility`），请使用全小写字母。\n- 对于多单词的 CSS 属性，去掉连字符，并将第二个单词的第一个字母（如果属性超过两个单词，则后续每个单词的第一个字母）大写。例如，`font-size`\
  \ 和 `border-left-width` CSS 属性变为 `style` 对象属性中的 `fontSize` 和 `borderLeftWidth`。\n\
  \n这是一个示例（`bk04ch06/example12.html`）：\n\n```\nconst pageTitle = document.querySelector(\"\
  h1\");\npageTitle.style.fontSize = \"64px\";\npageTitle.style.color = \"maroon\"\
  ;\npageTitle.style.textAlign = \"center\";\npageTitle.style.border = \"1px solid\
  \ black\";\n```\n\n这段代码获取了页面上第一个 `<h1>` 元素的引用。获取该引用后，代码使用 `style` 对象为标题的四个属性设置样式：`fontSize`、`color`、`text-align`\
  \ 和 `border`。\n\n### 为元素添加类\n\n如果你在 CSS 中定义了一个类规则，可以通过向元素标签添加 `class` 属性，并将 `class`\
  \ 属性的值设置为类规则的名称，将该规则应用到元素上。\n\n首先，你可以使用 `classList` 属性获取元素分配的类列表：\n\n`element.classList`\n\
  \n- `element`:你正在操作的元素\n\n返回的类列表是一个类数组对象，包含一个 `add()` 方法，你可以用该方法向元素现有的类添加新类：\n\n\
  `element.classList.add(\"class\")`\n\n- `element`:你正在操作的元素。\n- `class`:一个表示你想向 `element`\
  \ 添加的类名的字符串。你可以通过逗号分隔每个类名来添加多个类。\n\n这是一个示例（`bk04ch06/example13.html`），图 6-6.classList.add('my-class');\n\
  ```\n\n![此代码使用 add() 方法为 <div> 标签添加了名为 my-class 的类。](img/9781394164684-fg040606.png)\n\
  \n图 6-6： 此代码使用 `add()` 方法为 `<div>` 标签添加了名为 `my-class` 的类。\n\n![记住](img/remember.png)\
  \ 如果元素中不存在 `class` 属性，`addClass()` 方法将其插入标签中。因此在上一个示例中，代码执行后，`<div>` 标签现在所示：\n\n\
  ```html\n<div id=\"my-div\" class=\"my-class\">\n```\n\n### 移除类\n\n要从元素的 `class`\
  \ 属性中移除类，`classList` 对象提供了 `remove()` 方法：\n\n`element.classList.remove(\"class\"\
  )`\n\n- `element`:你正在操作的元素。\n- `class`:一个表示你想从 `element` 移除的类名的字符串。你可以通过逗号分隔每个类名来移除多个类。\n\
  \n这是一个示例：\n```javascript\ndocument.getElementById('my-div').classList.remove('my-class');\n\
  ```\n\n### 切换类\n\n一个非常常见的 Web 开发场景是网页元素在两种不同状态之间切换。例如，你可能想根据复选框被选中或取消选中来更改元素的样式，或者你可能想在用户点击元素标题时交替显示和隐藏元素的文本。\n\
  \n处理这种情况的一种方法是：使用 `classList` 对象的 `add()` 方法在元素处于一种状态时（例如用户第一次点击元素标题时）添加特定类，然后在元素处于另一种状态时（例如用户第二次点击元素标题时）使用\
  \ `remove()` 方法移除该类。\n\n## 使用 JavaScript 调整 HTML 属性\n\nDOM 的关键特性之一是每个标签都有属性。你可能会奇怪，这些属性有属性吗？是的，它们有许多属性。例如，考虑以下\
  \ `<img>` 标签：\n\n```html\n<img id=\"header-image\" src=\"mangeen.png\" alt=\"Drawing\
  \ of a mangeen\">\n```\n\n该标签有三个属性：`id`、`src` 和 `alt`。在 DOM 对 `<img>` 元素的表示中，这些属性变成了属性。\n\
  \n然而，DOM 不为自定义属性或通过程序添加的属性创建属性。幸运的是，每个元素对象还提供了方法，允许你读取任何属性，以及添加、修改或移除元素的属性。接几节将介绍。\n\
  \n### 读取属性值\n\n如果你想读取元素属性的当前值，请使用元素对象的 `getAttribute()` 方法：\n\n`element.getAttribute(\"\
  attribute\")`\n\n- `element`:你想要操作的元素\n- `attribute`:你想读取的属性名\n\n这是一个示例，获取 `id`\
  \ 值为 `header-image` 的元素的 `src` 属性：\n\n```javascript\nconst headerImage = document.getElementById(\"\
  header-image\");\nconst srcHeaderImage = headerImage.getAttribute(\"src\");\n```\n\
  \n### 设置属性值\n\n要为元素设置属性值，请使用元素对象的 `setAttribute()` 方法：\n\n`element.setAttribute(\"\
  attribute\", \"value\")`\n\n- `element`:你想要操作的元素\n- `attribute`:你想设置的属性名\n- `value`:你想赋值给\
  \ `attribute` 的字符串值\n\n如果属性已存在，`setAttribute` 将覆盖属性的当前值；如果属性不存在，`setAttribute` 将将其添加到元素中。\n\
  \n这是一个示例，为 `id` 值为 `header-image` 的元素设置 `alt` 属性：\n\n```javascript\nconst headerImage\
  \ = document.getElementById(\"header-image\");\nheaderImage.setAttribute(\"alt\"\
  , \"a new description\");\n```\n\n\n\n\n```javascript\nconst headerImage = document.getElementById(\"\
  header-image\");\nheaderImage.setAttribute(\"alt\", \"Lithograph of a mangosteen\"\
  );\n```\n\n### 移除属性\n\n要从元素中移除属性，请使用元素对象的 `removeAttribute()` 方法：\n\n```javascript\n\
  element.removeAttribute(attribute);\n```\n\n*   `element`: 你想要操作的元素\n*   `attribute`:\
  \ 一个字符串，指定你想要从元素中移除的属性名称\n\n这里有一个示例：\n\n```javascript\nconst headerImage = document.getElementById(\"\
  header-image\");\nheaderImage.removeAttribute(\"id\");\n```\n\n## 使用事件构建响应式页面\n\n\
  当你买了一辆车时，无论你花了多少钱，或者它的技术有多先进，除非你做些什么，否则汽车只会停在那儿。（如果你是在一个全自动驾驶的未来阅读这段文字，我深表歉意。）如果是一辆好看的汽车，停在那儿也没关系，但你可能想让汽车做些什么，任何事情。以下是你可以实现这一目标的简短操作列表：\n\
  \n*   启动汽车。\n*   将变速箱挂入挡位。\n*   踩加速器。\n*   打开收音机。\n\n所有这些动作的共同点是它们设定了一个局面，汽车必须以某种方式做出响应：启动、接合齿轮、移动、播放声音。从这个角度来看，汽车是一种对外部刺激做出响应的机器，或者用一句话说，是对事件做出响应。\n\
  \n令人惊讶的是，网页也是一种对外部刺激做出响应的机器。继续读下去了解我的意思。\n\n### 什么是事件？\n\n在 Web 开发中，`event` 是为了响应某些外部刺激而发生的动作。外部刺激的一种常见类型是用户与网页的交互。以下是一些示例：\n\
  \n*   浏览到页面或重新加载页面\n*   点击按钮\n*   按下按键\n*   滚动页面\n\n你的网页如何可能知道这些动作中的任何一个是在何时发生的呢？秘密在于\
  \ JavaScript 在设计时就考虑了事件。正如计算机科学教授们所说的，JavaScript 是一种`事件驱动`语言。\n\n那么，为什么网页不会自动响应事件呢？它们为什么只是停在那儿？因为网页默认是`static`（静态），这意味着它们忽略了周围触发的所有事件。作为\
  \ Web 开发人员，你的工作是通过让你的网页“监听”特定事件的发生来改变这种行为。你通过设置特殊的代码块称为 `event handlers`（事件处理器）来实现，这些代码实际上是在说：“请留意事件\
  \ X 的发生，好吗？当它发生时，请务必执行我在这里为你放置的代码。非常感谢。”一个事件处理器由两部分组成：\n\n*   **Event listener（事件监听器）：**\
  \ 指向浏览器的指令，让它关注（监听）特定元素上发生的特定事件。\n*   **Callback function（回调函数）：** 当浏览器检测到事件已发生时执行的代码。\n\
  \n在本章的剩余部分中，我将介绍如何使用 JavaScript 构建你自己的事件处理器，并将你的脚本提升到更具交互性的水平。\n\n### 理解事件类型\n\n\
  你的网页可以响应几十种可能的事件，但幸运的是，在大多数日常 Web 开发中，只需要这些事件中的一小部分集。我将它们分为以下五类：\n\n*   **Document（文档）：**\
  \ 与 `document` 对象加载相关的触发事件。你需要关注的唯一事件是 `DOMContentLoaded`，它在 `document` 对象完成加载时触发。\n\
  *   **Mouse（鼠标）：** 当用户使用鼠标（或类似设备，如触控板或触摸屏）进行操作时触发的事件。此类类别中最重要的事件是 `click`（用户点击鼠标）；`dblclick`（用户双击鼠标）；以及\
  \ `mouseover`（用户将鼠标指针移动到元素上方）。\n*   **Keyboard（键盘）：** 当用户与键盘交互时触发的事件。此类类别中的主要事件是\
  \ `keypress`，它在用户按下按键时触发的。\n*   **Form（表单）：** 与网页表单相关的事件。重要的有 `focus`（元素获得焦点，例如当用户通过\
  \ Tab 键到表单控件时）；`blur`（元素失去焦点）；`change`（用户更改表单控件的值）；以及 `submit`（用户提交表单）。查看第 4 本 第\
  \ 11 章 了解表单和表单事件。\n*   **Browser window（浏览器窗口）：** 当用户与浏览器窗口交互时触发的事件。这里的两个主要事件是 `scroll`（当用户垂直或水平滚动窗口时触发）和\
  \ `resize`（当用户更改窗口宽度或高度时触发）。\n\n你通过使用元素对象的 `addEventListener()` 方法设置事件处理器，来配置代码以监听并响应事件。其语法如下：\n\
  \n```javascript\nelement.addEventListener(event, callback);\n```\n\n*   `element`:\
  \ 要监控该事件的网页元素。该事件被认为`bound`（绑定）到该元素。\n*   `event`: 一个字符串，指定你想要让浏览器监听的事件名称。对于我在上一节中提到的主要事件，请使用用引号括的以下内容之一：`DOMContentLoaded`,\
  \ `click`, `dblclick`, `mouseover`, `keypress`, `focus`, `blur`, `change`, `submit`,\
  \ `scroll` 或 `resize`。\n*   `callback`: 当事件发生时 JavaScript 执行的函数。回调可以是匿名函数，也可以是命名函数的引用。\n\
  \n这里有一个示例 (bk4ch06/example15.html)：\n\n```html\n<div id=\"my-div\"></div>\n<button\
  \ id=\"my-button\">Click to add some text</button>\n```\n\n```javascript\nconst\
  \ myButton = document.getElementById('my-button');\nmyButton.addEventListener('click',\
  \ function() {\n  const myDiv = document.getElementById('my-div');\n  myDiv.innerHTML\
  \ = '<h1>Hello World!</h1>';\n});\n```\n\n![点击事件回调函数为 div 元素添加了一些 HTML 和文本的截图](img/9781394164684-fg04067.png)\n\
  \n> 如果你想在网页文档加载后运行某些代码，请向 `document` 对象上添加一个监听 `DOMContentLoaded` 事件的事件处理器 (bk4ch06/example16.html)：\n\
  \n```javascript\ndocument.addEventListener('DOMContentLoaded', function() {\n  console.log('We\
  \ are loaded!');\n});\n```\n\n### 获取有关事件的数据\n\n当事件被触发时，DOM 会创建一个 `Event` 对象，其属性包含有关事件的信息，包括以下内容：\n\
  \n*   `target`: 事件发生的网页元素。例如，如果你为 `div` 元素设置了 `click` 处理器，那么该 `div` 就是点击的目标。\n*\
  \   `which`: 一个数字代码，指定在 `keypress` 事件期间按下的键值。\n*   `pageX`: 事件触发时，鼠标指针距离浏览器内容区域左边缘的距离（以像素为单位）。\n\
  *   `pageY`: 事件触发时，鼠标指针距离浏览器内容区域顶边缘的距离（以像素为单位）。\n*   `metaKey`: 一个布尔值。如果用户在事件触发时按下\
  \ Windows 键(!image](images/windows.png)) 或 Mac Command 键 (⌘  )，则值为 `true`。\n*  \
  \ `shiftKey`: 一个布尔值。如果用户在事件触发时按住 Shift 键，则值为 `true`。\n\n要访问这些属性，你需要在事件处理器的回调函数中将\
  \ `Event` 对象的名称作为参数：\n\n\n\n\n\n```javascript\nelement.addEventListener(event, function(e)\
  \ {\n  // This code runs when the event fires\n});\n```\n\n*   `e`: DOM 在事件触发时生成的\
  \ `Event` 对象的名称。你可以使用任何喜欢的名称，但大多数代码人员使用 `e`（尽管 `evt` 和 `event` 也很常见）。\n\n例如，在处理\
  \ `keypress` 事件时，你需要访问 `which` 属性来找到用户按下的键值代码。这里有一个示例页面，可以帮助你确定应该使用哪个代码值（bk04ch06/example17.html）：\n\
  \nHTML:\n```html\n<div>\n  Type a key:\n</div>\n<input id=\"key-input\" type=\"\
  text\">\n<div>\n  Here's the code of the key you pressed:\n</div>\n<div id=\"key-output\"\
  >\n</div>\n```\n\nJavaScript:\n```javascript\nconst keyInput = document.getElementById('key-input');\n\
  keyInput.addEventListener('keypress', function(e) {\n  const keyOutput = document.getElementById('key-output');\n\
  \  keyOutput.innerHTML = e.which;\n});\n```\n\nHTML 设置了一个 `<input>` 标签来接收按键输入，以及一个\
  \ `id=\"key-output\"` 的 `div` 标签用于输出。JavaScript 代码为 `input` 元素添加了 `keypress` 事件监听器，当事件触发时，回调函数会将\
  \ `e.which` 写入输出 `div`。图 6-8 显示了该页面的运行情况。\n\n![在输入框中输入按键的截图， keypress 事件回调函数使用 e.which\
  \ 将所按键的数字代码写入 div 元素。](img/9781394164684-fg040608.png)\n\n图 6-8： 在输入框中输入按键，`keypress`\
  \ 事件回调函数使用 `e.which` 将所按键的数字代码写入 `div` 元素。\n\n### 防止默认事件动作\n\n![提示](img/tip.png)\
  \ 某些事件在触发时会执行默认动作。例如，链接的 `click` 事件会打开目标 URL，而表单的 `submit` 事件会将表单数据发送到服务器上的脚本。大多数时候，这些默认动作正是你需要的，但并非总是如此。例如，你可能想拦截链接点击以执行某些自定义动作，如显示菜单。同样，与其让浏览器提交表单，你可能更喜欢处理表单数据然后通过你的脚本发送数据。\n\
  \n对于这些以及许多类似的情况，你可以通过运行 `Event` 对象的 `preventDefault()` 方法来告诉浏览器不要执行事件的默认动作：\n\n\
  ```javascript\nevent.preventDefault();\n```\n\n*   `event`: DOM 在事件触发时创建的 `Event`\
  \ 对象的引用。\n\n例如，查看以下代码（bk04ch06/example18.html）：\n\nHTML:\n```html\n<a href=\"https://wiley.com/\"\
  >Wiley</a><br>\n<a href=\"https://262.ecma-international.org/6.0/\">ECMAScript 2015\
  \ Spec</a><br>\n<a href=\"https://webdev.mcfedries.com/tools/workbench/\">WebDev\
  \ Workbench</a>\n<div id=\"output\">\n  Link URL:\n</div>\n```\n\nJavaScript:\n\
  ```javascript\nconst links = document.getElementsByTagName('a')\nfor (const link\
  \ of links) {\n  link.addEventListener('click', function(e) {\n    e.preventDefault();\n\
  \    strURL = e.target.href;\n    document.getElementById('output').innerHTML =\
  \ 'Link URL: ' + strURL;\n  })\n}\n```\n\nHTML 定义了三个链接（样式为行内块，我在这里没有显示）以及和一个 `div`\
  \ 元素。JavaScript 使用 `for...of` 循环为所有 `a` 元素设置了 `click` 事件监听器，回调函数执行了三件事：\n\n*   它使用\
  \ `e.preventDefault()` 方法告诉浏览器不要导航到链接地址。\n*   它使用 `e.target.href` 获取链接的 URL。\n*\
  \   它在 `div` 元素中显示该 URL。图 6-9 显示了一个示例。\n\n![使用 e.preventDefault() 停止浏览器导航到链接 URL\
  \ 的截图。](img/9781394164684-fg04009.png)\n\n图 6-9： 你可以使用 `e.preventDefault()` 停止浏览器导航到链接\
  \ URL。\n\n# 第 7 章：数组数组操作\n\n本章内容\n\n*   学习数组能为你完成什么\n*   声明数组变量\n*   向数组中填充数据\n\
  *   遍历数组\n*   尝试多维数组\n*   与 JavaScript 的 Array 对象工作\n\n*桌子、地板的凌乱；到处都是黄色的便利贴；写满涂鸦的白板：这一切都是人类思维混乱的外在表现。这种混乱是无法进入程序的的；它会在程序员周围堆积。*\n\
  —ELLEN ULLMAN\n\n在这本书中我花了很多关于高效编程的内容，因为我相信（好吧，我知道）高效的脚本运行速度更快，且编程和调试的时间更短。编程中的效率实际上意味着消除不必要的重复，无论是将语句合并到一个可以根据需要重复的循环中（参见第\
  \ 4 本，第 4 章），还是将代码移动到可以根据需要调用的函数中（参见第 4 本，第 5 章）。\n\n在本章中，你通过探索 JavaScript 最重要的概念之一：数组，将你的编码效率提高到更高的水平。数组之所以不仅是因为它们极其高效且强大，而且是因为在你学会如何使用它们后，你会想到成千种用途。\n\
  \n## 什么是数组？\n\n不必要的重复的一个常见来源是变量。例如，考虑以下声明（查阅 bk0407/example01.html）：\n\n```javascript\n\
  const dog1 = \"dog-1\";\nconst dog2 = \"dog-2\";\nconst dog3 = \"dog-3\";\nconst\
  \ dog4 = \"dog-4\";\nconst dog5 = \"dog-5\";\n```\n\n这些是字符串变量，存储了一些狗照片的名字。这段代码看起来可能并不极端低效，但如果你实际上需要考虑的不是\
  \ 5 张图片，而是 10 张、20 张甚至 100 张图片呢？我确定，输入 100 个 `const` 声明并不是你认为有趣的时光。\n\n要理解解决办法，首先要理解变量\
  \ `dog1` 到 `dog5` 均包含相关的值。也就是说，每个变量都持有一张狗照片文件名的一部分，而这又是该图像完整 URL 的一部分。在 JavaScript\
  \ 中（或者说，在几乎任何编程语言中），每当你有一组具有相关数据的变量时，你就可以将它们组合在一个名为数组的变量中。你可以向数组中输入任意数量的值，JavaScript\
  \ 通过索引数字来跟踪每个值。例如，你添加的第一个值被赋予索引 0（由于某些模糊的原因，程序员自古以来从 0 而不是 1 开始计数）。放入数组的第二个值被赋予索引\
  \ 1；第三个值得到 2；以此此类推。然后你可以通过指定索引数字访问数组中的任何值。\n\n## 声明数组\n\n由于数组是变量的一种类型，你需要在使用它之前声明它。事实上，不像普通的数字、字符串或布尔变量不需要真的声明（但总是应该声明），JavaScript\
  \ 要求你预先声明数组。你再次使用 `const`（或 `let`）语句，但这次带有略有不同的语法。实际上，有四种你可以使用的语法。这里是最具信息量的语法：\n\
  \n```javascript\nconst arrayName = new Array();\n```\n\n在这里，`arrayName` 是你想为数组变量使用的名称。\n\
  \n\n\n\n\n在 JavaScript 中，数组实际上是一个对象，因此，`new` 关键字在这里的作用是创建一个新的 `Array` 对象。语句中的 `Array()`\
  \ 部分被称为*构造函数*（constructor），因为它的工作是在内存中构建该对象。例如，要创建一个名为 `dogPhotos` 的新数组，你可以使用以下语句：\n\
  \n```javascript\nconst dogPhotos = new Array();\n```\n\n如果你预先知道要放入数组中的值（或*元素*）的数量，那么第二种语法就会很有用：\n\
  \n```javascript\nconst arrayName = new Array(num);\n```\n\n* `arrayName`：你想要为数组变量使用的名称\n\
  * `num`：你将放入数组中的值数量\n\n例如，这里有一个语句声明了一个包含五个元素的 `dogPhotos` 的新数组：\n\n```javascript\n\
  const dogPhotos = new Array(5);\n```\n\n如果你不确定需要多少个元素，不用担心，因为 JavaScript 乐意让你根据需要向数组添加元素或删除元素，并且它会自动扩展或收缩数组以补偿。我将在下一节中介绍另外两种数组声明语法。\n\
  \n## 为数组填充数据\n\n声明数组后，你就可以开始向其中填充想要存储的数据值。以下是执行此操作的通用语法：\n\n```javascript\narrayName[index]\
  \ = value;\n```\n\n* `arrayName`：数组变量的名称\n* `index`：你想存储值的数组索引数字\n* `value`：你存储在数组中的值\n\
  \nJavaScript 乐意将数组放入几乎任何类型的数据，包括数字、字符串、布尔值，甚至是其他数组！你甚至可以在单个数组中混合多种数据类型。\n\n![Tip](img/tip.png)\
  \ 你最常见的操作是在数组的末尾添加新元素。幸运的是，`Array` 对象有一个特殊的方法可以执行此操作。它被称为 `push()`，我将在本章的后后部分讨论它（具体是“向数组末尾添加元素：`push()`”章节）。\n\
  \n例如，这里有几条语句声明了一个名为 `dogPhotos` 的新数组，然后向数组中输入了五个字符串值：\n\n```javascript\nconst dogPhotos\
  \ = new Array(5);\ndogPhotos[0] = \"dog-1\";\ndogPhotos[1] = \"dog-2\";\ndogPhotos[2]\
  \ = \"dog-3\";\ndogPhotos[3] = \"dog-4\";\ndogPhotos[4] = \"dog-5\";\n```\n\n要引用数组值（例如，在表达式中使用它），你需要指定相应的索引：\n\
  \n```javascript\nstrURL + dogPhotos[3]\n```\n\n以下代码提供了一个完整的示例（查看 bk04ch078/example02.html）：\n\
  \nHTML:\n\n```html\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\n\
  // Declare the array\nconst dogPhotos = new Array(5);\n// Initialize values\ndogPhotos[0]\
  \ = \"dog-1\";\ndogPhotos[1] = \"dog-2\";\ndogPhotos[2] = \"dog-3\";\ndogPhotos[3]\
  \ = \"dog-4\";\ndogPhotos[4] = \"dog-5\";\n// 显示一个示例\ndocument.getElementById('output').innerHTML\
  \ = '<img src=\"images/' + dogPhotos[0] + '.png\" alt=\"\">';\n```\n\n### 同时声明并填充数组\n\
  \n之前，我提到 JavaScript 有另外两种声明数组的语法。这两种语法都允许你仅通过一条语句声明数组*并*为其填充值。\n\n第一方法使用以下通用格式的\
  \ `Array()` 构造函数：\n\n```javascript\nconst arrayName = new Array(value1, value2,\
  \ ...);\n```\n\n* `arrayName`：你想要为数组变量使用的名称\n* `value1`, `value2`, `…`：你想要填充数组的初始值\n\
  \n这里有一个示例：\n\n```javascript\nconst dogPhotos = new Array(\"dog-1\", \"dog-2\", \"\
  dog-3\", \"dog-4\", \"dog-5\");\n```\n\nJavaScript 还支持创建*数组字面量*（array literals），这与字符串、数字和布尔字面量相似。就像你通过引号包含值来创建字符串字面量一样，你通过将一个或多个值放在方括号内创建一个数组字面量。以下是通用格式：\n\
  \n```javascript\nconst arrayName = [value1, value2, ...];\n```\n\n* `arrayName`：你想要为数组变量使用的名称\n\
  * `value1`, `value2`, `…`：你想要填充数组的初始值\n\n一个示例：\n\n```javascript\nconst dogPhotos=\
  \ [\"dog-1\", \"dog-2\", \"dog-3\", \"dog-4\", \"dog-5\"];\n```\n\n![Remember](img/remember.png)\
  \ 在数组字面量的声明中包含值是可选的，这意味着你可以使用以下语句声明空数组：\n\n```javascript\nconst arrayName = [];\n\
  ```\n\n大多数 JavaScript 程序员倾向于使用这种语法而不是 `Array` 构造函数。\n\n### 使用循环填充数组\n\n到为止，你可能还不认为数组比使用单独的变量高效多少。这是因为你还没有学习处理数组时最强大的方面：使用循环和某种计数器变量来通过编程方式访问数组的索引号。\n\
  \n例如，这里有一个 `for()` 循环，替换了之前用于声明和初始化 `dogPhotos` 数组的六条语句：\n\n```javascript\nconst\
  \ dogPhotos = [];\nfor (let counter = 0; counter < 5; counter += 1) {\n  dogPhotos[counter]\
  \ = \"dog-\" + (counter + 1);\n}\n```\n\n`for()` 循环内部的语句使用变量 `counter` 作为数组的索引。例如，当\
  \ `counter` 为 `0` 时，语句如下：\n\n```javascript\ndogPhotos[0] = \"dog-\" + (0 + 1);\n\
  ```\n\n在这种情况下，等号右边的表达式求结果为 `\"dog-1\"`，这是正确的值。以下代码展示了这种循环技巧（bk04ch078/example03.html）：\n\
  \nHTML:\n\n```html\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\n\
  // Declare the array\nconst dogPhotos = [];\n// 使用循环初始化数组值\nfor (let counter = 0;\
  \ counter < 5; counter += 1) {\n  dogPhotos[counter] = \"dog-\" + (counter + 1);\n\
  }\n// 显示一个示例\ndocument.getElementById('output').innerHTML = '<img src=\"images/'\
  \ + dogPhotos[0] + '.png\" alt=\"\">';\n```\n\n使用循环向数组插入数据在两种情况下效果最好：\n\n* 当数组值可以使用随每次循环而改变的表达式生成时\n\
  * 当你需要为数组的每个元素分配相同的值时\n\n![Remember](img/remember.png) 如果你用特定数量的元素声明数组，如果你最终填充的元素数量超过了该数量，JavaScript\
  \ 完全不在意。\n\n## 我如何迭代？让我数数方法\n\n使用大量相似变量的真正问题不在于声明它们，而在于如何操作它们。这里有一个示例（bk04ch07/example01.html）：\n\
  \n```javascript\nconst dog1 = \"dog-1\";\nconst dog2 = \"dog-2\";\nconst dog3 =\
  \ \"dog-3\";\nconst dog4 = \"dog-4\";\nconst dog5 = \"dog-5\";\nconst promptNum\
  \ = prompt(\"输入你想看的狗 (1-5):\", \"\");\nif (promptNum !== \"\" && promptNum !== null)\
  \ {\n  const promptDog = \"dog-\" + promptNum;\n  if (promptDog === dog1) {\n  \
  \  document.body.style.backgroundImage = \"url('images/\" + dog1 + \".png')\";\n\
  \  } else if (promptDog === dog2) {\n    document.body.style.backgroundImage = \"\
  url('images/\" + dog2 + \".png')\";\n  } else if (promptDog === dog3) {\n    document.body.style.backgroundImage\
  \ = \"url('images/\" + dog3 + \".png')\";\n  } else if (promptDog === dog4) {\n\
  \    document.body.style.backgroundImage = \"url('images/\" + dog4 + \".png')\"\
  ;\n  } else if (promptDog === dog5) {\n    document.body.style.backgroundImage =\
  \ \"url('images/\" + dog5 + \".png')\";\n  }\n}\n```\n\n在这个示例中，脚本必须使用五个独立的 `if()`\
  \ 测试来将输入值与五个变量进行对比。\n\n数组可以极大地提高代码效率，因为它允许你将这类冗长的程序缩减为位于函数内部的短例程。这些例程是 `Array` 对象的迭代方法，其中*迭代*意味着该方法遍历数组中的项，并且对于每个项，一个函数（称为*回调*函数）会对该项执行某些操作或利用它进行操作。\n\
  \n\n\n\n\n`Array` 对象实际上有十四种迭代方法。我不会全部介绍它们，但在接下来的几个章节中，我将介绍最实用的方法。\n\n### 遍历数组：forEach()\n\
  \n`Array` 对象的 `forEach()` 方法会为数组中的每个元素运行回调函数。该回调函数最多接受三个参数：\n\n* `value`: 元素的值\n\
  * `index`:（可选）元素的数组索引\n* `array`:（可选）正在被迭代的数组\n\n你可以使用以下任何一种语法：\n\n`array.forEach(namedFunction);`\n\
  \n`array.forEach(function (value, index, array) { code });`\n\n`array.forEach((value,\
  \ index, array) => { code });`\n\n* `array`: 你想要遍历的 `Array` 对象。\n* `namedFunction`:\
  \ 现有函数的名称。该函数应该接受 `value` 参数，可能还可以接收可选的 `index` 和 `array` 参数。\n* `code`: 在每次迭代期间执行的语句。\n\
  \n这是一个示例（`bk04ch07/example04.html`）：\n\n```\n// 声明数组\nconst dogPhotos= [\"dog-1\"\
  , \"dog-2\", \"dog-3\", \"dog-4\", \"dog-5\"];\n// 遍历数组\ndogPhotos.forEach((value,\
  \ index) => {\n  console.log(\"Element \" + index + \" has the value \" + value);\n\
  });\n```\n\n在声明数组后，代码使用 `forEach()` 来遍历数组。在每次迭代中，`console.log()`（参见第 4 本，第 10 章）显示一个包含\
  \ `index` 和 `value` 参数的字符串。图 7-1 显示了结果。\n\n![提示](img/tip.png) 要要在大多数网页浏览器中显示控制台，右键点击网页，点击“检查”（在\
  \ Windows 上按 Ctrl+Shift+I，或在 macOS 上按 Option+⌘  +I），然后点击“控制台”标签。\n\n![使用 forEach()\
  \ 每次迭代显示的控制台消息截图](img/9781394164684-fg040701.png)\n\n图 7-1： 使用 `forEach()` 每次迭代显示的控制台消息。\n\
  \n### 遍历数组：for…of\n\n虽然你通常使用 `forEach()` 方法遍历数组，但有时你需要使用更传统的循环来遍历每个数组元素。那种循环类型是\
  \ `for…of` 循环：\n\n```\nfor (element of array) {\n  code\n}\n```\n\n* `array`: 你想要遍历的\
  \ `Array` 对象\n* `element`: 循环每次通过过程中的当前数组元素\n* `code`: 在每次迭代期间执行的语句\n\n![记住](img/remember.png)\
  \ `for…of` 循环是在 ECMAScript 2015 (ES6) 中引入的，如果你需要支持旧版浏览器（如 Internet Explorer 11），请不要使用它。\n\
  \n这是一个示例（`bk04ch07/example04a.html`）：\n\n```\n// 声明数组\nconst dogPhotos= [\"dog-1\"\
  , \"dog-2\", \"dog-3\", \"dog-4\", \"dog-5\"];\n// 遍历数组\nfor (const currentPhoto\
  \ of dogPhotos) {\n  console.log(\"The current element has the value \" + currentPhoto);\n\
  }\n```\n\n在声明数组后，代码使用 `for…of` 循环来遍历数组。在每次迭代中，`console.log()`（参见第 4 本，第 10 章）显示一个包含当前元素值的字符串。\n\
  \n### 遍历以测试数组：every() 和 some()\n\n一种常见的数组模式是检查数组元素以确定某些或所有元素是否通过了测试。例如，如果你有一组利率作为值，你可能想测试它们是否都在合理的范围内（例如，0.01\
  \ 到 0.1 之间）。同样，如果你有一组数字，你可能想确定数组中至少有一个为零。\n\n#### 测试是否所有元素都通过测试：every()\n\n要检查数组中的所有元素是否通过了测试，请使用\
  \ `Array` 对象的 `every()` 方法。有三种语法可以使用：\n\n`array.every(namedFunction);`\n\n`array.every(function\
  \ (value, index, array) { code });`\n\n`array.every((value, index, array) => { code\
  \ });`\n\n* `array`: 你想要遍历的 `Array` 对象。\n* `namedFunction`: 现有函数的名称。该函数应该接受 `value`\
  \ 参数，可能还可以接收可选的 `index` 和 `array` 参数。\n* `code`: 在每次迭代期间执行的语句。\n\n在 `namedFunction`\
  \ 或 `code` 中，使用 `return` 语句将测试结果传回 `every()` 方法。如果所有元素都通过了测试，`every()` 返回 `true`；否则返回\
  \ `false`。这是一个示例（`bk04ch07/example05.html`）：\n\n```\n// 声明利率数组\nconst rates = [0.05,\
  \ 0.07, 0.01, 0.02, 0.09];\n// 测试每个利率\nconst legitRates = rates.every(currentValue\
  \ => {\n  return currentValue >= 0.01 && currentValue <= 0.1;\n});\n// 输出结果\nconsole.log(legitRates);\n\
  ```\n\n#### 测试是否某些元素通过了测试：some()\n\n要检查数组中至少有一个元素通过了某些测试，请使用 `Array` 对象的 `some()`\
  \ 方法。有三种语法可以使用：\n\n`array.some(namedFunction);`\n\n`array.some(function (value,\
  \ index, array) { code });`\n\n`array.some((value, index, array) => { code });`\n\
  \n这是一个示例（`bk04ch07/example06.html`）：\n\n```\n// 声明除数数组\nconst divisors = [27, 53,\
  \ 6, 0, 17, 88, 32];\n// 测试每个除数\nconst zeroDivisors = divisors.some(currentValue\
  \ => {\n  return currentValue === 0;\n});\n// 输出结果\nconsole.log(zeroDivisors);\n\
  ```\n\n\n\n\n\n![some() 方法最终结果（在此情况下为 true）的截图。](img/9781394164684-fg040703.png)\n\
  \nFIGURE 7-3: `some()` 方法的最终结果（在此情况下为 `true`）。\n\n### 迭代以创建新数组：`map()`\n\n当你遍历一个数组时，通常会对每个元素的值应用某些操作。然而，在某些情况下，你想要保留原始数组的值，并创建一个包含更新后值的新数组。\n\
  \n创建一个存储现有数组更新后值的新数组的最简单方法是使用 `Array` 对象的 `map()` 方法。这里有种语法可以可以使用：\n\n* `array`.map(`namedFunction`);`\n\
  * `array`.map(function (`value`,`index`,`array`) { `code` });`\n* `array`.map((value`,`index`,`array))\
  \ => { `code` });`\n\n* `array`: 包含你想要使用的值的 `Array` 对象。\n* `namedFunction`: 现有函数的名称，该函数对每个数组值执行操作。此函数应该接受\
  \ `value` 参数，可能也接受可选的 `index` 和 `array` 参数。\n* `code`: 在每次迭代期间运行的语句，用于对每个值执行操作。\n\
  \n`map()` 方法返回一个包含更新后值的 `Array` 对象，因此请确保将结果存储在变量中。\n\n这是一个示例（bk04ch07/example07.html）：\n\
  \n```javascript\n// 声明一个华氏度温度数组\nconst tempsFahrenheit = [-40, 0, 32, 100, 212];\n\
  // 将每个数组值转换为摄氏度\nconst tempsCelsius = tempsFahrenheit.map(currentTemp => {\n  return\
  \ (currentTemp - 32) * 0.5556;\n});\n// 输出结果\nconsole.log(tempsCelsius);\n```\n\n\
  这段代码声明了一个华氏度温度数组，然后 `map()` 方法遍历 `tempsFahrenheit` 数组，并在每次迭代中将当前的华氏度值（存储在参数 `currentTemp`中）转换为摄氏度。结果是一个名为\
  \ `tempsCelsius` 的新数组，它显示在控制台中，如图 7-4 所示。\n\n![map 方法通过对原始数组中的每个值应用操作来创建一个新数组的截图。](img/9781394164684-fg040704.png)\n\
  \nFIGURE 7-4: `map()` 方法通过对原始数组中的每个值应用操作创建一个新数组。\n\n### 迭代数组为单个值：`reduce()`\n\n\
  一种常见的迭代模式是对数组中的每个元素执行累加操作，以产生一个值。例如，你可能想知道数组中所有值的和。\n\n以这种方式迭代数组以产生一个值是 `Array`\
  \ 对象的 `reduce()` 方法的工作。这里有种语法可以可以使用：\n\n* `array`.reduce(`namedFunction`,`initialValue`);`\n\
  * `array`.reduce(function (`accumulator`,`value`,`index`,`array`) { `code` },`initialValue`);`\n\
  * `array`.reduce((accumulator`,`value`,`index`,`array)) => { `code` },`initialValue`);`\n\
  \n* `array`: 包含你想要归约值的 `Array` 对象。\n* `namedFunction`: 现有函数的名称，该函数对每个数组值执行归约操作。此函数应该接受\
  \ `accumulator` 和 `value` 参数，可能也接受可选的 `index` 和 `array` 参数。\n* `code`: 在每次迭代期间运行的语句，用于对每个值执行归约操作。\n\
  * `initialValue`: `accumulator` 的起始值。如果你省略 `initialValue`，JavaScript 将使用 `array`\
  \ 中第一个元素的值。\n\n这是一个示例（bk04ch07/example08.html）：\n\n```javascript\n// 声明一个产品库存数组\n\
  const unitsInStock = [547, 213, 156, 844, 449, 71, 313, 117];\n// 获取库存总数\nconst\
  \ initialUnits = 0;\nconst totalUnits = unitsInStock.reduce((accumulatedUnits, currentInventoryValue)\
  \ => {\n  return accumulatedUnits + currentInventoryValue;\n}, initialUnits);\n\
  // 输出结果\nconsole.log(\"Total units in stock: \" + totalUnits);\n```\n\n这段代码声明了一个产品库存数组，并声明了一个值为\
  \ `0` 的 `initialUnits`。然后 `reduce()` 方法（使用 `initialUnits` 作为累加器的起始值）遍历 `unitsInStock`\
  \ 数组，并在每次迭代中将当前的产品库存值（存储在参数 `currentInventoryValue` 中）加到累加器（存储在参数 `accumulatedUnits`\
  \ 中）。得到的总和存储在变量 `totalUnits` 变量中，然后显示在控制台中，如图 7-5 所示。\n\n![reduce() 方法将数组的值迭代还原为单个值的截图。](img/9781394164684-fg040705.png)\n\
  \nFIGURE 7-5: `reduce()` 方法将数组的值迭代还原为单个值。\n\n### 迭代以定位元素：`find()`\n\n要在数组中搜索匹配某些条件的第一个元素，请使用\
  \ `Array` 对象的 `find()` 方法。这里有种语法可以可以使用：\n\n* `array`.find(`namedFunction`);`\n*\
  \ `array`.find(function (`value`,`index`,`array`) { `code` });`\n* `array`.find((value`,`index`,`array))\
  \ => { `code` });`\n\n* `array`: 包含你想要使用的值的 `Array` 对象。\n* `namedFunction`: 现有函数的名称，该函数对每个数组值执行操作。此函数应该接受\
  \ `value` 参数，可能也接受可选的 `index` 和 `array` 参数。\n* `code`: 在每次迭代期间运行的语句，用于对每个值执行操作。\n\
  \n`find()` 方法返回测试结果为 `true` 的第一个元素，如果所有元素的测试均为 `false`，则返回 `undefined`。\n\n这是一个示例（bk04ch07/example08a.html）：\n\
  \n```javascript\n// 声明一个对象数组\nconst products = [\n  { name: 'doodad', units: 547\
  \ },\n  { name: 'gizmo', units: 213 },\n  { name: 'gimcrackery', units: 156 },\n\
  \  { name: 'knickknack', units: 844 },\n  { name: 'bric-a-brac', units: 449 },\n\
  \  { name: 'thingamajig', units: 71 },\n  { name: 'watchamacallit', units: 313 },\n\
  \  { name: 'widget', units: 117 }\n];\n// 查询数组\nconst strQuery = \"gizmo\";\nconst\
  \ stock = products.find((currentProduct) => {\n  return currentProduct.name ===\
  \ strQuery;\n});\n// 输出结果\nif (stock) {\n  console.log(\"Product \" + stock.name\
  \ + \" has \" + stock.units + \" units in stock.\");\n} else {\n  console.log(\"\
  Product \" + strQuery + \" not found.\");\n}\n```\n\n这段代码声明了一个包含对象字量量的数组。然后 `find()`\
  \ 方法遍历 `products` 数组，并在每次迭代中检查当前数组元素值的 `name` 属性（通过参数 `currentProduct` 传递给回调函数）是否与存储在变量\
  \ `strQuery` 中的值相等。结果存储在变量 `stock` 中。\n\n![提示](img/tip.png) 如果你想知道匹配条件的数组项的索引，请使用\
  \ `findIndex()` 而不是 `find()`。\n\n## 创建多维数组\n\n*多维数组*是指在每个数组元素中存储了两个或多个值的数组。例如，如果你想创建一个数组来存储用户数据，你可能需要每个元素存储名、姓、用户名、密码等更多信息。坏消息是\
  \ JavaScript 不支持多维数组。好消息是你可以使用一种技巧来模拟多维数组。\n\n\n\n\n这个技巧是以这种方式填充数组，使得每个元素本身也是一个数组。为了理解这个奇特的想法是如何工作的，首先回想数组字面量的通用语法：\n\
  \n`[`value1`, `value2`, ...]`\n\n现在回想给数组元素赋值的通用语法：\n\n`arrayName[`index`] = `value`;`\n\
  \n在一个一维数组中，`value` 通常是字符串、数字或布尔值。现在，想象一下，如果 `value` 是一个数组字面量呢？对于二维数组，将数组字面量赋值给数组元素的通用语法如下：\n\
  \n`arrayName[`index`] = [`value1`, `value2`];`\n\n作为一个例子，假设你想存储一个包含背景颜色和前景颜色的数组。以下是你可以声明并填充这样一个数组的方法：\n\
  \n```\nconst colorArray = [];\ncolorArray[0] = ['white', 'black'];\ncolorArray[1]\
  \ = ['aliceblue', 'midnightblue'];\ncolorArray[2] = ['honeydew', 'darkgreen'];\n\
  ```\n\n或者，你也可以仅使用数组字面量符号来声明和填充数组：\n\n```javascript\nconst colorArray = [\n  ['white',\
  \ 'black'],\n  ['aliceblue', 'midnightblue'],\n  ['honeydew', 'darkgreen']\n];\n\
  ```\n\n无论哪种方法，你都可以使用双方括号引用单个元素，如示例所示：\n\n```\ncolorArray[0][0]; // 返回 'white'\n\
  colorArray[0][1]; // 返回 'black'\ncolorArray[1][0]; // 返回 'aliceblue'\ncolorArray[1][1];\
  \ // 返回 'midnightblue'\ncolorArray[2][0]; // 返回 'honeydew'\ncolorArray[2][1]; //\
  \ 返回 'darkgreen'\n```\n\n左侧括号中的数字是整个数组的索引，右侧括号中的数字是元素数组的索引。\n\n## 操作数组\n\n与任何良好的对象一样，`Array`\
  \ 带有大量的属性和方法，你可以对它们进行处理和操作。本章的其余部分将介绍这些属性和方法中最实用的几个。\n\n### length 属性\n\n`Array`\
  \ 对象只有几个属性，但你唯一频繁使用的一个就是 `length` 属性：\n\n`array.length`\n\n`length` 属性返回指定数组中当前元素的数量。这在遍历数组时非常有用，因为这意味着不需要指定循环计数器最大值的字面量。例如，考虑下面的\
  \ `for` 语句：\n\n```\nfor (let counter = 0; counter < 5; counter += 1) {\n  dogPhotos[counter]\
  \ = \"dog-\" + (counter + 1);\n}\n```\n\n该语句假设 `dogPhotos` 数组有五个元素，事实可能并非。为了让循环适用于任意数量的元素，请将\
  \ `5` 替换为 `dogPhotos.length`：\n\n```\nfor (let counter = 0; counter < dogPhotos.length;\
  \ counter += 1) {\n  dogPhotos[counter] = \"dog-\" + (counter + 1);\n}\n```\n\n\
  同样注意，循环在 `counter` 变量小于 `dogPhotos.length` 时运行。这是因为数组索引从 0 到数组的 `length` 值减 1。换句话之，之前的\
  \ `for` 循环示例等同于：\n\n```\nfor (let counter = 0; counter <= dogPhotos.length - 1;\
  \ counter += 1)\n```\n\n### 合并创建新数组：concat()\n\n`concat()` 方法获取一个或多个现有数组的元素，并将它们合并到现有数组中以创建一个新数组：\n\
  \n`array.concat(array1, array2, ...)`\n\n*   `array`: 你想要处理的数组名称。\n*   `array1`,\
  \ `array2`, `...`: 你想要合并到 `array` 之上的数组。这些也可以是值。\n\n注意，原始数组保持不变。下面的代码 (`bk04ch07/example09.html`)\
  \ 展示了如何使用 `concat()` 将两个数组合并成第三个数组，每个元素都打印到页面上，如图 7-6 所示。\n\n```javascript\n// 声明数组\n\
  const array1 = [\"One\", \"Two\", \"Three\"];\nconst array2 = [\"A\", \"B\", \"\
  C\"];\n\n// 合并它们\nconst array3 = array1.concat(array2);\n\n// 显示合并后的数组\nconsole.log(array3);\n\
  ```\n\n![合并 array1 和 array2 产生此处所示值的 array3 的截图](img/9781394164684-fg040706.png)\n\
  \n图 7-6： 合并 `array1` 和 `array2` 产生此处所示值的 `array3`。\n\n### 从数组创建字符串：join()\n\n`join()`\
  \ 方法允许你获取数组的元素并将它们合并成单个字符串。\n\n`array.join(separator)`\n\n*   `array`: 你想要处理的数组名称。\n\
  *   `separator`: 插入在元素之间的可选字符串。如果省略此参数，则将使用逗号。\n\n在下面的代码 (`04ch07/example10.html`)\
  \ 中，创建了三个数组然后将它们合并成字符串：\n\n```javascript\n// 声明数组\nconst array1 = [\"John\", \"\
  Paul\", \"George\"];\nconst array2 = [\"Ringo\"];\nconst array3 = [\"The Beatles\"\
  , \"Best Band\"];\n\n// 将它们合并为字符串\nconst string1 = array1.join(\", \");\nconst string2\
  \ = array2.join(\"\");\nconst string3 = array3.join(\" \");\n\n// 显示结果\ndocument.getElementById('output').innerHTML\
  \ = string1 + '<br>' + string2 + '<br>' + string3;\n```\n\n页面上的输出将是：\n\nJohn, Paul,\
  \ George\nRingo\nThe Beatles - Best Band\n\n\n\n\n执行这些语句后，`myArray` 包含了六个值：`\"First\"\
  `、`\"Second\"`、`\"Third\"`、`\"Fourth\"`、`\"Fifth\"` 和 `\"Sixth\"`。我为什么不一次性添加整个 `pushArray`\
  \ 呢？例如：\n\n```\nmyArray.push(pushArray);\n```\n\n这是完全允许，但这意味着 `myArray` 将包含以下四个元素：`\"\
  First\"`、`\"Second\"`、`\"Third\"` 和 `pushArray`，这意味着你创建了一种混合多维数组，这可能不是你在这种情况下想要的结果。\n\
  \n![记住](img/remember.png) 在运行 `push()` 方法后，JavaScript 会根据添加的新元素数量增加数组 `length` 属性的值。\n\
  \n### 反转数组元素的顺序：reverse()\n\n`reverse()` 方法获取数组中的现有元素并反转它们的顺序：第一个移动到最后一个，最后一个移动到第一个，依此类推。语法只需一眼就能懂：\n\
  \n`array.reverse()`\n\n以下代码 (bk04ch07/example11.html) 让 `reverse()` 方法发挥作用，图 7-8\
  \ 显示了发生了什么。\n\n```\nconst myArray = [\"Show\", \"Place\", \"Win\"];\nmyArray.reverse();\n\
  console.log(myArray);\n```\n\n![使用 reverse() 方法反转数组中元素顺序的截图](img/9781394164684-fg040708.png)\n\
  \n图 7-8： 使用 `reverse()` 方法反转数组中元素的顺序。\n\n### 移除数组的第一个元素：shift()\n\n`shift()` 方法从数组中移除第一个元素并返回该元素的值：\n\
  \n`array.shift()`\n\n例如，考虑以下语句：\n\n```\nconst myArray = [\"First\", \"Second\",\
  \ \"Third\"];\nconst myString = myArray.shift();\n```\n\n`myArray` 的第一个元素是 `\"First\"\
  `，因此 `myArray.shift()` 会从数组中移除该值并将其存储在变量 `myString` 中。\n\n![记住](img/remember.png)\
  \ 在运行 `shift()` 方法后，JavaScript 会将数组 `length` 属性的值减一。\n\n### 返回数组的子集：slice()\n\n\
  `slice()` 方法返回一个包含现有数组元素子集的新数组。这里是其语法：\n\n`array.slice(start, end)`\n\n*   `array`:\
  \ 你想要操作的数组名称。\n*   `start`: 一个数字，指定 `array` 中你想要包含在子集中的第一个元素的索引。如果这个数字是负数，则子集的起点将从\
  \ `array` 的末尾计算（例如，-1 是数组的最后一个元素）。如果你留空此值，JavaScript 将使用 0（即数组的第一个元素）。\n*   `end`:\
  \ 一个可选数字，指定 `array` 中元素的索引，你希望子集在该元素索引之前结束。如果你留空此值，子集将包含 `array` 中从 `start` 到最后一个元素的所有元素。此值可以是负数。\n\
  \n![提示](img/tip.png) 使用不带任何参数的 `slice()` 是复制数组的快速方法：\n\n```\nconst thisArray = [\"\
  alpha\", \"beta\", \"gamma\"];\nconst thatArray = thisArray.slice();\n// thatArray()\
  \ 是 [\"alpha\", \"beta\", \"gamma\"];\n```\n\n![提示](img/tip.png) 你也可以使用展开运算符（…）来快速复制数组，如之前侧边栏中描述的，“快速查看展开运算符（…](#c24.xhtml_c24-fea-0001)”：\n\
  \n```\nconst thisArray = [\"alpha\", \"beta\", \"gamma\"];\nconst thatArray = […thisArray];\n\
  // thatArray() 是 [\"alpha\", \"beta\", \"gamma\"];\n```\n\n以下代码 (bk04ch07/example12.html)\
  \ 定义了一个数组，然后尝试了 `slice()` 参数的不同值。结果显示在图 7-9 中。\n\nHTML:\n```html\n<div id=\"output\"\
  ></div>\n```\n\nJavaScript:\n```javascript\nconst myArray = [\"A\", \"B\", \"C\"\
  , \"D\", \"E\", \"F\"];\nconst array1 = myArray.slice(0, 4);\nconst array2 = myArray.slice(3);\n\
  const array3 = myArray.slice(-3, -1);\nlet str = \"array1: \" + array1 + \"<br>\"\
  ;\nstr += \"array2: \" + array2 + \"<br>\";\nstr += \"array3: \" + array3;\ndocument.getElementById('output').innerHTML\
  \ = str;\n```\n\n![使用 slice() 方法从另一个数组的子集创建新数组的截图](img/9781394164684-fg040709.png)\n\
  \n图 7-9： `slice()` 方法从另一个数组的子集创建一个新数组。\n\n### 排序数组元素：sort()\n\n`sort()` 方法是处理常见编程问题的简易方法：重新排列数组元素，使其按字母顺序、数字或其他顺序进行排列。你可以使用四种语法：\n\
  \n```javascript\narray.sort()\narray.sort(namedFunction)\narray.sort(namedFunction(a,\
  \ b)) { code });\narray.sort((a, b) => { code });\n```\n\n*   `array`: 你想要排序的数组名称\n\
  *   `namedFunction`: 现有函数的名称，该函数通过每次比较两个数组项来执行排序操作，比较中的第一个数组项作为参数 `a` 传递，比较中的第二个数组项作为参数\
  \ `b` 传递\n*   `code`: 在每次迭代期间运行的语句，用于对每个值执行排序操作\n\n不带参数使用 `sort()` 可以给你提供一个简单直接的字母排序：\n\
  \n```javascript\nmyArray.sort();\n```\n\n如果你想根据其他标准对数组进行排序，你需要创建一个函数来定义排序顺序。你的函数必须设置如下：\n\
  \n*   函数必须接受两个参数，代表两个要比较的数组值，以便它们可以进行相对排序。在本列表中，我将这些参数称为 `a` 和 `b`。\n*   使用这些参数，函数必须定义一个返回数值的表达式。\n\
  *   对于你希望将 `a` 排在 `b` 之前的情况，函数必须返回一个负值。\n*   对于你希望将 `a` 排在 `b` 之后的情况，函数必须返回一个正值。\n\
  *   对于你希望 `a` 和 `b` 被视为相等的情况，函数必须返回零。\n\n以下代码 (bk04ch07/example13.html) 显示了一个名为\
  \ `numericSort` 的函数，如果你想从低到高进行数字排序，可以使用它。图 7-10 显示了原始数组然后是排序后的数组。\n\nHTML:\n```html\n\
  <div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\n// 此函数从高到低对数字排序\n\
  function numericSort(a, b) {\n  return b - a;\n}\nconst myArray = [3, 5, 1, 6, 2,\
  \ 4];\n// 排序前的数组\nlet str = \"myArray (before sorting): \" + myArray + \"<br>\"\
  ;\n// 排序数组\nmyArray.sort(numericSort);\n// 排序后的数组\nstr+= \"myArray (after sorting):\
  \ \" + myArray;\ndocument.getElementById('output').innerHTML = str;\n```\n\n![提示](img/tip.png)\
  \ 若要从低到高进行数字排序，可以使用不带参数的 `sort()`，或者使用以下 `return` 表达式：\n\n```javascript\nreturn\
  \ a - b;\n```\n\n![使用 sort() 和函数对数字从高到低排序的截图](img/9781394164684-fg040710.png)\n\n\
  图 7-10： 使用 `sort()` 和函数对数字从高到低排序。\n\n\n\n\n\n*   `elementsToDelete`: 一个可选数字，指定从\
  \ `array` 的 `start` 位置开始要删除的元素个数。如果不包含此参数，则将删除从 `start` 到数组末尾的所有元素。\n*   `value1`,\
  \ `value2`, `…`: 可选值，将从 `start` 位置开始插入到 `array` 中。\n\n有了 `splice()` 的助阵，你可以执行以下一项或多项任务：\n\
  \n*   **删除：** 如果 `elementsToDelete` 大于 0 或未指定且未包含插入值，`splice()` 将从索引 `start` 开始删除元素。被删除的元素将在一个单独的数组返回。\n\
  *   **替换：** 如果 `elementsToDelete` 大于 0 或未指定且包含一个或多个插入值，`splice()` 将先从索引 `start`\
  \ 开始删除元素，然后在该索引 `start` 处插入指定的值。\n*   **插入：** 如果 `elementsToDelete` 为 `0`，`splice()`\
  \ 将在索引 `start` 处插入指定的值。\n\n以下代码（`bk04ch07/example14.html`）演示了所有这三个任务，结果如图 7-11 所示。\n\
  \nHTML:\n\n```html\n<div id=\"output\">\n</div\n```\n\nJavaScript:\n\n```javascript\n\
  const array1 = [\"A\", \"B\", \"C\", \"D\", \"E\", \"F\"];\nconst array2 = [\"A\"\
  , \"B\", \"C\", \"D\", \"E\", \"F\"];\nconst array3 = [\"A\", \"B\", \"C\", \"D\"\
  , \"E\", \"F\"];\n// 删除\n// 在 array1 中，从索引 2 开始删除到最后\n// 将删除的元素返回 delete1 数组\nconst\
  \ delete1 = array1.splice(2);\n// 写入 array1\nlet str = \"array1: \" + array1 + \"\
  <br>\";\n// 写入 delete1\nstr += \"delete1: \" + delete1 + \"<br>\";\n// 替换\n// 在\
  \ array2 中，从索引 3 开始删除 2 个元素\n// 插入 2 个元素来替换它们\n// 将删除的元素返回 delete2 数组\nconst delete2\
  \ = array2.splice(3, 2, \"d\", \"e\");\n// 写入 array2\nstr += \"array2: \" + array2\
  \ + \"<br>\";\n// 写入 delete2\nstr += \"delete2: \" + delete2 + \"<br>\";\n// 插入\n\
  // 在 array3 中，从索引 1 开始插入 3 个元素\narray3.splice(1, 0, \"1\", \"2\", \"3\")\n// 写入\
  \ array3\nstr += \"array3: \" + array3;\ndocument.getElementById('output').innerHTML\
  \ = str;\n```\n\n![splice() 方法可以删除、替换和插入数组元素。](img/9781394164684-fg040711.png)\n\
  \n图 7-11： `splice()` 方法可以删除、替换和插入数组元素。\n\n### 在数组开头插入元素：unshift()\n\n`unshift()`\
  \ 方法是 `shift()` 方法的相反操作：它在数组开头插入一个或多个值。操作完成后，`unshift()` 返回数组的新 `length`。其语法如下：\n\
  \n`array`.unshift(`value1`, `value2`, `…`)\n\n*   `array`: 你想要操作的数组名称\n*   `value1`,\
  \ `value2`, `…`: 你想要添加到 `array` 开头的值\n\n例如，考虑以下语句：\n\n```javascript\nconst myArray\
  \ = [\"First\", \"Second\", \"Third\"];\nconst newLength = myArray.unshift(\"Fourth\"\
  , \"Fifth\", \"Sixth\");\n```\n\n执行这些语句后，`myArray` 包含六个值——`\"Fourth\"`、`\"Fifth\"\
  `、`\"Sixth\"`、`\"First\"`、`\"Second\"` 和 `\"Third\"`，且 `newLength` 的值为 6。\n\n# 第\
  \ 8 章：处理字符串、日期和数字\n\n## 本章内容\n\n![](img/check.png) **处理字符串**\n![](img/check.png)\
