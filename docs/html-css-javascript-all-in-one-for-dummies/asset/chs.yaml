  \ **处理日期和时间**\n![](img/check.png) **执行数学计算**\n\n“所有伟大的程序员都以同样的方式学习。他们不断尝试。他们写一些代码，看看电脑做了什么。他们修改代码，再看看电脑做了什么。他们反复重复这个过程，直到弄清楚这个内部是如何工作的。”——SETH\
