  \ | `number` 的整数部分 |\n\n表 8-7 Math 对象的一些方法\n\n### Math 对象的方法\n\n`Math` 对象的方法允许你执行各种数学运算，如平方根、幂、四舍入、三角函数等更多。`Math`\
  \ 对象的许多方法被总结在表 8-7 中。\n\n*(注：由于提供的源文本存在大量重复和乱码，翻译已根据逻辑结构进行了清理，仅保留了关于 Math 对象和 JSON\
  \ 的核心内容。)*\n\n\n\n在下一节中，我将讨论 JSON 在在网络存储（web storage）之间传输数据时有多用。不过，你也可以在非网络存储的代码中使用\
  \ JSON 数据。你首先需要声明一个 JSON 变量（请查看书中示例文件中的 `bk04ch09/example01.html`）：\n\n```javascript\n\
  const customer = {\n  \"account\": 853,\n  \"name\": \"Alfreds Futterkiste\",\n\
  \  \"supplier\": false,\n  \"recentOrders\": [28394,29539,30014],\n  \"contact\"\
  : {\n    \"name\": \"Maria Anders\",\n    \"phone\": \"030-0074321\",\n    \"email\"\
  : \"anders@futterkiste.com\"\n  }\n}\n```\n\n然后，你可以通过 `variable.property` 语法引用 JSON\
  \ 数据中的任何属性。以下是一些示例：\n\n```javascript\ncustomer.account // Returns 853\ncustomer.name\
  \ // Returns \"Alfreds Futterkiste\"\ncustomer.recentOrders[1] // Returns 29539\n\
  customer.contact.email // Returns \"anders@futterkiste.com\"\n```\n\n![提示](img/tip.png)\
  \ JSON 语法可能有点复杂，因此在代码中使用数据之前，检查数据是否有效是一个好主意。最简单的方法是使用 JSONLint ([`jsonlint.com`](https://jsonlint.com))\
  \ 验证工具。拷贝你的 JSON 代码，粘贴到 JSONLint 文本区域中，然后点击 Validate JSON。\n\n### 将 JavaScript 对象转换为\
  \ JSON\n\n虽然你可以在代码中直接使用 JSON 数据，但你更有可能将数据存储在 JavaScript 对象中。如果你随后需要将该对象转换为 JSON\
  \ 格式，可以通过调用 `JSON` 对象的 `stringify()` 方法将对象进行字符串化。以下是可以使用的简化语法：\n\n`JSON.stringify(object,\
  \ replacer, spaces)`\n\n*   `object`: 你想要转换为 JSON 格式的 JavaScript 对象。\n*   `replacer`:\
  \ 一个函数或数组，可以以某种方式修改字符串化过程。此参数超出了本书的讨论范围，因此在示例中我将此参数设置为 `null`。\n*   `spaces`: 可选值，用于指定你希望\
  \ JSON 字符串缩进的空格数以提高可读性。（如果你永远不需要查看生成的 JSON 字符串，可以省略 `null` 和 `spaces` 参数，只使用 `object`\
  \ 参数。）\n\n这里有一个示例（查看 `bk04ch09/example02.html`）：\n\nHTML:\n```html\n<pre id=\"output\"\
  ></pre>\n```\n\nJavaScript:\n```javascript\n// 声明一个 JavaScript 对象\nconst userData\
  \ = {\n  bgColor: \"darkolivegreen\",\n  textColor: \"antiquewhite\",\n  textSize:\
  \ \"1.25em\",\n  typefaces: [\"Georgia\", \"Verdana\", \"serif\"],\n  subscriber:\
  \ true,\n  subscriptionType: 3\n};\n\n// 将其字符串化\nconst userDataJSON = JSON.stringify(userData,\
  \ null, \" \");\n\n// 显示结果\ndocument.querySelector('#output').innerHTML = userDataJSON;\n\
  ```\n\n图 9-1 显示了输出。\n\n![JavaScript 对象转换为 JSON 字符串的截图。(images/9781394164684-fg040901.png)![图\
  \ 9-1:](img/#c26.xhtml_rc26-fig-0001) 转换为 JSON 字符串的 JavaScript 对象。\n\n### 将 JSON\
  \ 字符串转换为 JavaScript 对象\n\n当你的脚本接收到 JSON 字符串时（来自服务器，或者为了本章的目的，来自网络存储），你通常希望将该字符串转换为一个传统的\
  \ JavaScript 对象。你通过调用 `JSON` 对象的 `parse()` 方法来完成该转换：\n\n`JSON.parse(json)`\n\n*``json`:\
  \ 你想要转换为 JavaScript 对象的 JSON 字符串。\n\n这里有一个示例 (`bk04ch09/example03.html`)：\n\n```javascript\n\
  // 声明一个 JSON 字符串\nconst userDataJSON = `{\n  \"bgColor\": \"darkolivegreen\",\n\
  \  \"textColor\": \"antiquewhite\",\n  \"textSize\": \"1.25em\",\n  \"typefaces\"\
  : [\n    \"Georgia\",\n    \"Verdana\",\n    \"serif\"\n  ],\n  \"subscriber\":\
  \ true,\n  \"subscriptionType\": 3}`;\n\n// 解析它\nconst userData = JSON.parse(userDataJSON);\n\
  \n// 显示结果\nconsole.log(userData);\n```\n\n注意 `userDataJSON` 字符串在使用反引号（``` `）分隔符，这允许我为了可读性多行显示\
  \ JSON 数据。图 9-2 显示了控制台中的输出（参见第 4 册，第 10 章）。\n\n![提示](img/tip.png) 在大多数网络浏览器中显示控制台，右键点击网页，点击“检查”（在\
  \ Windows 上按 Ctrl+Shift+I，在 macOS 上按 Option+⌘  +I），然后点击“控制台”标签页。\n\n![JSON 字符串转换为\
  \ JavaScript 对象的截图。(images/9781394164684-fg040902.png)![图 9-2:](img/#c26.xhtml_rc26-fig-0002)\
  \ 转换为 JavaScript 对象的 JSON 字符串。\n\n### 向网络存储添加数据\n\n当你想要使用 `localStorage` 存储超出当前浏览器会话的数据，或使用\
  \ `sessionStorage` 仅存储当前浏览器会话的数据时，你使用 `setItem()` 方法向网络存储添加数据：\n\n`localStorage.setItem(key,\
  \ value)`\n\n或者：\n\n`sessionStorage.setItem(key, value)`\n\n*   `key`: 一个指定网络存储项之键的字符串。\n\
  *   `value`: 与网络存储键关联的值。该值可以是字符串、数字、布尔值或对象。但注意，网络存储只能存储字符串，因此你指定的任何值在存储时都会被转换为字符串。\n\
  \n这里有一个示例：\n\n`localStorage.setItem('fave-color', '#ba55d3');`\n\n将一组相关的键值对对存储为\
  \ JSON 字符串是常见做法。例如，假设你将数据收集到一个 JavaScript 对象中：\n\n```javascript\n// 声明一个 JavaScript\
  \ 对象\nconst userData = {\n  bgColor: \"darkolivegreen\",\n  textColor: \"antiquewhite\"\
  ,\n  textSize: \"1.25em\",\n  typefaces: [\"Georgia\", \"Verdana\", \"serif\"],\n\
  \  subscriber: true,\n  subscriptionType: 3\n};\n```\n\n在将此类对象添加到网络存储之前，你必须使用 `JSON.stringify()`\
  \ 方法将其字符串化（\n\n```javascript\nlocalStorage.setItem('user-data', JSON.stringify(userData));\n\
  ```\n\n![提示](img/tip.png) 当你在测试网页时，你可能想要检查数据是否存储正确。你只需打开浏览器的开发工具（参见第 4 册，第 10 章），然后点击“应用程序”标签页（如果你使用的是\
  \ Chrome 或 Edge）或“存储”标签页（对于 Firefox 或 Safari）。该标签页包含本地存储和会话存储，你可以在那里查看。\n\n![记住](img/remember.png)\
  \ 当你使用网络存储存储数据时，该数据仅对同一设备上的网络浏览器可用。例如，如果你为运行 Safari 的用户保存了数据，当该用户使用桌面上的 Chrome 返回你的网站时，该数据将不可用。\n\
  \n\n\n\n*   `key`: 一个指定存储项键值的字符串\n\n这里有一个示例：\n\n```javascript\nlocalStorage.removeItem('fave-color');\n\
  ```\n\n如果你想从头开始并删除网络存储中的所有内容，请使用 `clear()` 方法：\n\n```javascript\nlocalStorage.clear()\n\
  ```\n\n或者：\n\n```javascript\nsessionStorage.clear()\n```\n\n# 第 10 章：调试你的代码\n\n\
  ## 本章内容\n\n* ![Bullet](img/check.png) 学习 JavaScript 的错误类型\n* ![Bullet](img/check.png)\
  \ 使用控制台 (Console) 调试错误\n* ![Bullet](img/check.png) 设置断点\n* ![Bullet](img/check.png)\
  \ 观察变量和表达式的值\n* ![Bullet](img/check.png) 学习 JavaScript 最常见的错误和错误信息\n\n> *测试证明了程序员的失败。而调试是程序员的辩护。*\n\
  > — BORIS BEIZER\n\n让短脚本和函数运行起来通常不需要太长时间。然而，随着你的代码变得越来越大越来越复杂，错误不可避免地会产生。事实上，数学上已经证明，任何超过最小复杂度水平的代码都会包含至少一个错误，而且可能比这多得多。\n\
  \n渗透你代码中的许多 bug 将由你可以快速修复的简单语法问题组成，但另一些将更为微妙且更难发现。对于后者——无论是函数返回了错误值，还是脚本整体逻辑存在问题——你需要能够“进入”你的代码内部以找出哪里出了问题。好消息是，JavaScript\
  \ 和现代网络浏览器提供了大量的顶尖调试工具，可以减轻部分解决程序问题的负担。在本章中，你将深入探究这些工具，探索它们如何帮助你发现并修复大多数编程错误。你还将研究一些技巧和方法，这些技巧对帮助你从源上避免编码错误大有裨益。\n\
  \n## 理解 JavaScript 的错误类型\n\n当问题发生时，你首先需要确定你正在处理的是哪种错误。基本有三种类型：语法错误、运行时错误和逻辑错误。\n\
  \n### 语法错误\n\n语法错误源于拼写错误的关键词、缺失的关键词或错误的标点符号。JavaScript 在加载页面时总是捕捉这些错误（这就是为什么语法错误也被称为加载时错误）。也就是说，当\
  \ JavaScript 读取脚本语句时，它会检查每条语句是否有语法错误。如果发现错误，它将停止处理脚本并显示错误信息。这里有一个示例语句（查看书中的示例文件\
  \ `bk04ch10/example01.html`），包含一个典型的语法错误（你能发现它吗？），并且 图 10-1 显示了 Firefox 控制台窗口是如何标记该错误的。\n\
  \n```javascript\nconst pageFooter - document.querySelector(\"footer\");\n```\n\n\
  ![Firefox 控制台窗口显示有关典型语法错误数据的截图。](img/9781394164684-fg041001.png)\n\n图 10-1： Firefox\
  \ 控制台窗口显示有关典型语法错误的数据。\n\n### 运行时错误\n\n运行时错误发生在脚本的执行期间。它们通常意味着 JavaScript 遇到了一个它无法理解的语句。这可能是由于尝试在表达式中使用未初始化的变量（即尚未赋值的变量），或者由于在错误的对象上使用了属性或方法导致的。\n\
  \n如果你的脚本中有在页面加载时执行的语句，且没有发现语法错误，JavaScript 将尝试运行这些语句。如果它遇到有问题的语句，它会停止脚本的执行并显示错误。如果你的脚本有一个或多个函数，JavaScript\
  \ 在你调用它们之前不会在这些函数中寻找运行时错误。\n\n这里有一段代码（查看 `bk04ch10/example02.html`），我在第三行拼错了一个变量名（是\
  \ `pagefooter` 而不是 `pageFooter`），并且 图 10-2 显示了 Chrome 控制台窗口显示的相应运行时错误。\n\n```javascript\n\
  const pageFooter = document.querySelector(\"footer\");\nconst currDate = new Date();\n\
  pagefooter.innerHTML = \"Copyright \" + currDate.getFullYear() + \" Logophilia Limited.\"\
  ;\n```\n\n![Chrome 控制台显示有关典型运行时错误数据的截图。(images/9781394164684-fg041002.png)\n\n图\
  \ 10-2： Chrome 控制台显示有关典型运行时错误的数据。\n\n### 逻辑错误\n\n如果你的代码走 Z 字形而非之字形，原因通常是脚本逻辑的缺陷。它可能是一个永远不会的的循环，或者没有切换到任何内容的\
  \ `switch` 测试。\n\n逻辑错误最难定位，因为你不会得到任何错误信息来提示哪里出了问题以及问题出在哪里。你通常需要做的是设置调试代码，帮助你监控值并跟踪程序的执行。我将在本章稍后部分介绍最实用的调试技巧。\n\
  \n## 了解你的调试工具\n\n所有主要的网络浏览器都带有一套复杂的调试工具，这可以让你作为 Web 开发者的生活变得更容易、更理智。大多数 Web 开发者使用\
  \ Google Chrome 调试他们的脚本。由于大多数 Web 开发者使用 Google Chrome，因此我将重点介绍它。但在本节中，我将提供所有浏览器可用工具的概述以及如何获取它们。\n\
  \n以下是在 Chrome、Firefox 和 Safari 中打开开发工具的方法：\n\n*   **Windows 版 Chrome**: 点击自定义 Chrome（地址栏右侧的三个点），然后选择“更多工具”。\n\
  *   **Mac 版 Chrome**: 选择“查看” -> “开发者工具”。\n*   **Windows 版 Firefox**: 点击应用菜单（工具栏最右侧的三条横线），然后选择“更多工具”\
  \ -> “Web 开发工具”。\n*   **Mac 版 Firefox**: 选择“工具” -> “浏览器工具”。\n*   **Windows 版 Edge**:\
  \ 点击“设置和更多”（地址栏右侧的三个点），然后选择“更多工具” -> “开发者工具”。\n*   **Safari**: 选择“开发” -> “显示 Web\
  \ 检查器”。如果你没有开发菜单，请选择“Safari” -> “设置”，点击“高级”选项卡，然后勾选“在菜单栏显示开发菜单”。\n\n这些开发工具在功能上有所不同，但每个工具都提供同一组基础工具，这些是你最常用的工具。这些基础\
  \ Web 开发工具包括：\n\n*   **HTML 查看器**: 该标签在 Firefox 中称为 `Inspector`，在其他浏览器中称为 `Elements`，显示网页使用的\
  \ HTML 源代码。当鼠标悬停在标签上时，浏览器会突出显示页面中的元素并显示其宽度和高度，如图 10-3 所示。点击标签时，浏览器会显示应用该标签的样式，以及标签的盒模型尺寸（再次参考图\
  \ 10-3）。查看第三本书的第 4 章，了解更多如何使用开发工具检查 CSS。![HTML 查看器，如 Chrome 的 Elements 标签，允许你检查每个元素的样式和盒模型尺寸。(images/9781394164684-fg041003.png)\n\
  \n    图 10-3： HTML 查看器，如 Chrome 的 Elements 标签，允许你检查每个元素的样式和盒模型尺寸。\n\n*   **控制台 (Console)**:\
  \ 此标签允许你查看错误信息、日志消息、测试表达式并执行语句。我将在下一节中详细介绍控制台。\n\n\n\n\n\n*   **调试工具（Debugging tool）：**\
  \ 此标签页（在 Firefox 中称为 `Debugger`，在其他浏览器中称为 `Sources`）允许你暂停代码执行、单步执行代码、观察变量和属性的值以及更多功能。这是最重要的\
  \ JavaScript 调试工具，因此我将在本章稍后的部分详细介绍它。\n*   **网络（Network）：** 此标签页会告诉你你的网页中引用的每个文件加载需要多长时间。如果你发现页面加载缓慢，此标签页可以帮助你找到瓶颈。\n\
  *   **Web 存储（Web storage）：** 此标签页（在 Chrome 和 Edge 中称为 `Application`，在 Firefox 和\
  \ Safari 中称为 `Storage`）允许你检查使用 `Web Storage API` 存储在浏览器中的数据，我将在第 4 本的第 9 章中讨论该内容。\n\
  \n## 使用控制台进行调试\n\n如果你的网页运行异常——例如，页面是空白或缺少元素——你应该首先检查你的 HTML 代码以确保它是正确的。（常见的 HTML\
  \ 错误包括没有用大于号（`>`）结束标签、未包含结束标签，以及属性值缺少结束引号。）如果你的 HTML 没问题，那么很有可能是你的 JavaScript 代码出了问题。你如何知道呢？访问\
  \ `Console`（控制台）窗口是你的第一步。\n\n`Console` 是一个交互式浏览器窗口，可以显示警告和错误、显示 `console.log()`\
  \ 语句的输出，并允许你执行表达式和语句，而无需运行整个脚本。`Console` 是最实用的 浏览器调试工具之一，因此你需要熟悉它的操作。\n\n### 在各种浏览器中显示控制台\n\
  \n要显示 `Console`，请打开浏览器的开发工具，然后点击 `Console` 标签页。你也可以使用以下快捷键：\n\n*   **Windows 版 Chrome：**\
  \ 按 `Ctrl+Shift+J`。\n*   **Mac 版 Chrome：** 按 `Option+⌘  +J`。\n*   **Windows 版 Firefox：**\
  \ 按 `Ctrl+Shift+K`。\n*   **Mac 版 Firefox：** 按 `Option+⌘  +K`。\n*   **Microsoft Edge：**\
  \ 按 `Ctrl+Shift+J`。\n*   **Safari：** 按 `Option+⌘  +C`。\n\n### 向控制台记录日志数据\n\n你可以使用特殊\
  \ `Console` 对象的 `console.log()` 方法在控制台中打印文本和表达式的值：\n\n```\nconsole.log(output)\n\
  ```\n\n*   `output`: 你想在控制台中打印的表达式\n\n`output` 表达式可以是一个文本字符串、变量、对象属性、函数结果，或者这些者的任何组合。\n\
  \n![Tip](img/tip.png) 你还可以使用方便的 `console.table()` 方法以易于阅读的表格格式输出数组或对象的值：\n\n```\n\
  console.table(output)\n```\n\n*   `output`: 你想在控制台中查看的数组或对象（以变量或字面量形式存在）\n\n出于调试之目的，你最经常使用\
  \ `Console` 来监控变量、对象属性和表达式的值。也就是说，当你的代码设置或更改某个值的值时，你插入一个 `console.log()`（或 `console.table()`）语句来输出新值。当脚本执行完成后，你可以打开\
  \ `Console` 然后检查已记录的单个或多个值。\n\n### 在控制台中执行执行代码\n\n`Console` 的强大功能之一是它的交互性，这意味着你不仅可以读取浏览器或你的\
  \ `console.log()` 语句生成的消息，还可以直接在 `Console` 中输入代码。也就是说，你可以使用 `Console` 执行表达式和语句。该功能有许多用途：\n\
  \n*   你可以尝试一些实验性的表达式或语句，以确定它们对脚本的影响。\n*   当脚本暂停时，你可以输出变量或属性的当前值。\n*   当脚本暂停时，你可以更改变量或属性的值。例如，如果你注意到值为零的变量即将被用作除数，你可以将该变量更改为非零值以避免脚本崩溃。\n\
  *   当脚本暂停时，你可以运行函数或方法，以确定它在当前条件下是否按预期运行。\n\n每个浏览器的 `Console` 标签页都包含一个文本框（通常用大于号\
  \ `>` 提示符标记），你可以用它输入你的表达式或语句。\n\n![Tip](img/tip.png) 你可以通过分号隔开每个语句在 `Console` 中执行多个语句。例如，你可以通过输入类似下面的语句来测试\
  \ `for…` 循环：\n\n```\nfor (let i=1; i < 10; i += 1){console.log(i**2); console.log(i**3);}\n\
  ```\n\n![Tip](img/tip.png) 如果你想在 `Console` 中重复早前的代码执行，或者你想运行某些与之前运行的代码非常相似的代码，你可以回溯当前浏览器会话中使用的语句和表达式。按向上箭头可以向上滚动之前执行的代码；按向下箭头可以向下滚动代码。\n\
  \n## 暂停你的代码\n\n在代码执行途中暂停代码允许你检查某些元素，例如变量和属性的当前值。它还允许你一次一条地执行程序代码，以便你可以监控脚本的执行流。\n\
  \n当你暂停代码时，JavaScript 会进入 `break mode`（中断模式），这意味着浏览器会显示其调试工具并突出显示当前语句（即当前执行的语句）。\n\
  \n### 进入中断模式\n\nJavaScript 提供了两种进入中断的方式：\n\n*   通过设置断点\n*   使用 `debugger` 语句\n\n\
  ![当进入中断模式时，浏览器会显示调试工具并突出显示下一个执行的语句。](img/9781394164684-fg04104.png)\n\n图 10-4 当进入中断模式时，浏览器显示调试工具并突出显示下一个执行的语句。\n\
  \n### 设置断点\n\n如果你知道错误或逻辑缺陷发生的大致位置，可以通过特定语句进入中断模式。以下是设置断点的步骤：\n\n1.  **显示你浏览器的开发工具并切换到调试工具（例如\
  \ Chrome 中的 `Sources` 标签页）。**\n2.  **打开要调试的代码文件。**\n    这取决于浏览器；在 Chrome 中你有两种选择：\n\
  \    *   在左侧面板中点击 HTML 文件（如果 JavaScript 代码在 HTML 文件的 `script` 元素中）或 JavaScript (`.js`)\
  \ 文件（如果代码位于外部文件）。\n    *   按 `Ctrl+P` (Windows) 或 `⌘  +P` (macOS)，然后点击出现的文件。\n3.\
  \  **找到你想进入中断模式的语句。**\n    JavaScript 将运行到该语句之前，但不包括该语句。\n4.  **点击语句左侧的行号来设置断点，如图\
  \ 10-5 所示。](#c27.xhtml_c27-fig-0005)\n\n![设置断点的截图。](img/9781394164684-fg04105.png)\n\
  \n图 10-5 当进入中断模式时，浏览器显示调试工具并突出显示下一个执行的语句。\n\n要移除断点，大多数浏览器提供三个选择：\n\n*   要临时禁用某个断点，请取消勾选断点列表中的复选框。\n\
  *   要临时禁用所有断点，点击“禁用断点”按钮。Chrome 版本的此按钮在此边边所示。再次点击此按钮可以激活所有断点。\n*   要完全移除断点，点击语句的行号。\n\
  \n\n\n\n\n在开发网页时，你经常会通过向脚本发送各种测试值或在不同条件下运行来测试脚本的健壮性。在许多情况下，你可能希望进入中断模式（break mode）以确保一切正常。你可以在特定语句处设置断点，但如果你关闭了文件，断点就会丢失。对于更持久的方法，你可以在脚本中包含\
  \ `debugger` 语句。JavaScript 每当遇到 `debugger` 语句时，会自动进入中断模式。\n\n这里有一段包含 `debugger`\
  \ 语句的代码（`bk04ch10/example03.html`）：\n\n```javascript\n// 将句子添加到 <<div>> 中\ndocument.querySelector('div').innerHTML\
  \ = sentence;\n\n// 生成随机颜色（使用小于 128 的值以保持文字颜色）\nconst randomRed = parseInt(Math.random()\
  \ * 128);\nconst randomGreen = parseInt(Math.random() * 128);\nconst randomBlue\
  \ = parseInt(Math.random() * 128);\ndebugger;\n```\n\n## 退出中断模式\n\n要退出中断模式，你可以在浏览器的调试工具中使用以下两种方法之一：\n\
  \n*   ![image](img/9781394164684-ma004.png) **点击恢复按钮。** Chrome 中的此按钮显示在侧边栏。\n* \
  \  **按下浏览器的恢复快捷键。** 在 Chrome（以及大多数浏览器）中，按下 `F8` 或按下 `Ctrl+\\` (Windows) 或 `⌘  +`\
  \ (macOS)。\n\n## 逐语句执行代码\n\n最常见（也是最有用）的调试技术之一是逐语句地执行代码。这样做可以让你感知程序的流程，以确保循环和函数调用等内容执行正常。你可以使用四种技术：\n\
  \n*   逐语句执行\n*   单步进入代码（Step Into）\n*   跳过代码（Step Over）\n*   跳出代码（Step Out）\n\n\
  ### 逐语句执行\n\n逐语句执行代码最常见的方法是每次执行一条语句。在中断模式下，逐语句执行意味着两点：\n\n*   你执行当前语句，然后在下一语句处暂停。\n\
  *   如果要执行的当前语句是一个函数调用，单步将带你进入该函数并在函数的第一条语句处暂停。然后你可以继续逐语句执行函数，直到执行最后一条语句，此时浏览器会将你返回到函数调用之后的语句。\n\
  \n要逐语句执行你的代码，请设置一个断点，然后在代码进入中断模式后，执行以下操作之一来执行单条语句：\n\n*   ![image](img/9781394164684-ma005.png)\
  \ **点击单步按钮。** Chrome 中的此按钮显示在侧边栏。\n*   **按下浏览器的单步快捷键。** 在 Chrome（以及大多数浏览器，Firefox\
  \ 除外；在本文编写时 Firefox 不支持“单步”，请改用“单步进入”按钮）中，按下 `F9`。\n\n持续单步执行，直到脚本结束或你准备好恢复正常执行（通过点击恢复）。\n\
  \n### 单步进入某些代码\n\n在所有主流浏览器（Firefox 除外）中，单步进入代码与逐语句执行代码完全相同。区别在于语句异步异步执行时（即它在某些延迟后执行操作，而不是立即执行）。\n\
  \n为了理解这种区别，请考虑以下代码（我在左侧添加了行号；它们不是代码的一部分；请查看 `bk04ch10/example04.html`）：\n\n```javascript\n\
  1 setTimeout(() => {\n2 console.log('Inside the setTimeout() block!');\n3 }, 5000);\n\
  4 console.log('Outside the setTimeout) block!');\n```\n\n这段代码使用 `setTimeout()` 在五秒后执行一个匿名函数。假设你在\
  \ `setTimeout()` 语句（第 1 行）处进入了中断模式。在这里使用“单步”与“单步进入”会发生什么？来看一下：\n\n*   **单步 (Step)：**\
  \ 点击单步按钮不会像你预期的那样带你进入第 2 行。相反由于 `setTimeout()` 是异步的，单步实际上忽略了匿名函数并直接带你进入第 4 行。\n\
  *   **单步进入 (Step Into)：** 点击单步进入按钮*会*带你进入第 2 行，但在指定的延迟之后（在本例中为五秒后）。然后你可以根据需要逐语句执行匿名函数。\n\
  \n要单步进入你的代码，请设置一个断点，然后在代码进入中断模式后，执行以下操作之一：\n\n*   ![image](img/9781394164684-ma006.png)\
  \ **点击单步进入按钮。** Chrome 中的此按钮显示在侧边栏。\n*   **按下浏览器的单步进入快捷键。** 在 Chrome（以及大多数浏览器）中，按下\
  \ `F11` 或按下 `Ctrl+;` (Windows) 或 `⌘  +;` (macOS)。\n\n![Remember](img/remember.png)\
  \ 我在这里对“单步进入”的描述（至少在我写作时）不适用于 Firefox。相反，Firefox 的单步进入功能与我在上一节中描述的“单步”功能类似。\n\n\
  ### 跳过某些代码\n\n某些语句调用其他函数。如果你不想逐语句执行被调用的函数，可以跳过它。跳过函数意味着 JavaScript 正常执行该函数，然后在函数调用*之后*的下一语句处恢复中断模式。\n\
  \n要跳过一个函数，首先要逐语句执行代码，直到到达你想跳过的函数调用处，或者在函数调用处设置断点并刷新网页。当你处于中断模式时，可以使用以下任何技术跳过该函数：\n\
  \n*   ![image](img/9781394164684-ma007.png) **点击跳过按钮。** Chrome 中的此按钮显示在侧边栏。\n* \
  \  **按下浏览器的跳过快捷键。** 在 Chrome（以及大多数浏览器）中，按下 `F10` 或按下 `Ctrl+'` (Windows) 或 `⌘  +'`\
  \ (macOS)。\n\n### 跳出某些代码\n\n我经常不小心地进入了我本想跳过的函数。如果函数很短，我只需逐语句执行它，直到回到原始代码。然而，如果函数很长，我不想浪费时间逐语句执行每一条语句。相反，我使用以下任何方法调用“跳出”功能：\n\
  \n*   ![image](img/9781394164684-ma008.png) **点击跳出按钮。** Chrome 中的此按钮显示在侧边栏。\n* \
  \  **按下浏览器的跳出快捷键。** 在 Chrome（以及大多数浏览器）中，按下 `Shift+F11` 或按下 `Ctrl+Shift+` (Windows))\
  \ `⌘  +Shift+` (macOS)。\n\nJavaScript 执行函数的剩余部分，然后在函数调用后的第一行重新进入中断模式。\n\n## 监控脚本值\n\
  \n许多运行时错误和逻辑错误是变量或属性假设意外值的结果（在某些情况下也会导致这些结果）。如果你的脚本多处使用或更改这些元素，你需要进入中断模式并监控这些元素的值以找出问题所在。浏览器开发工具提供了三种方法来监控脚本值：\n\
  \n*   查看单个变量的值。\n*   查看本地和全局作用域内所有变量的值。\n*   查看自定义表达式或对象属性的值。\n\n### 查看单个变量值\n\n\
  如果你只想查看变量的当前值，Chrome（以及所有主流浏览器）的开发工具对此非常简单：\n\n1.  **在包含要检查变量的代码进入中断模式。**\n2.  **如果脚本尚未设置变量值，请逐语句执行代码，直到通过语句为变量赋值。**\n\
  \    如果你对变量值在脚本执行期间的变化感兴趣，请逐语句执行脚本，直到通过任何更改值的语句。\n3.  **将鼠标悬停在变量名上。**\n    浏览器弹出一个提示框，显示变量的当前值。图\
  \ 10-6 显示了一个示例。\n\n\n\n\n\n![断点模式截图，将鼠标指针悬停在变量名上可以显示变量的当前值](img/9781394164684-fg041006.png)\n\
  \n图 10-6： 在断点模式下，将鼠标指针悬停在变量名上即可显示变量的当前值。\n\n### 查看所有变量值\n\n你想要监控的大多数值都是变量，它们分为三种（或*作用域*）：\n\
  \n* **块级作用域（Block scope）：** 这些是在当前语句块内声明的变量，仅对该语句块可见。\n* **局部作用域（Local scope）：**\
  \ 这些是在当前函数中声明的变量，仅对该函数可见。\n* **全局作用域（Global scope）：** 这些是在任何函数之外声明的变量，使得页面上的任何脚本或函数都可以访问。\n\
  \n关于变量作用域的更详细介绍，请参阅第 4 本第 5 章。\n\n当你处于断点模式时，Chrome 调试工具（与所有主流浏览器调试器一样）会在右侧显示一个面板，其中包含一个部分显示你所有已声明变量的当前值。在\
  \ Chrome 中，该部分命名为 `Scope`，包含几个列表：`Block`（用于块级变量）、`Local`（用于局部变量）和 `Script`（用于全局变量）。混淆的是，还有一个\
  \ `Global` 部分，它仅引用 `Window` 对象。Chrome 的 `Scope` 部分出现在之前的图 10-4 中。\n\n在图 10-7 中，注意某些局部变量显示的值为\
  \ `undefined`。这些变量之所以未定义，是因为脚本尚未到达为这些变量赋值的点。\n\n![断点模式截图，Firefox 的 Scopes 部分显示了局部和全局变量的当前值](img/9781394164684-fg041007.png)\n\
  \n图 10-7： 在断点模式下，Firefox 的 `Scopes` 部分显示了局部和全局变量的当前值。\n\n### 添加观察表达式\n\n除了监控变量值，JavaScript\
  \ 还允许你监控任何表达式的结果或对象属性的当前值。为了做到这一点，你需要设置一个*监视表达式*（watch expression）来定义你想监控的内容。这些监视表达式会出现在浏览器调试工具的特殊区域中。以下是在\
  \ Chrome 中添加监视表达式的方法（其他主流浏览器的步骤类似）：\n\n1. **让你的代码进入断点模式。**\n2. **在右侧面板中打开 Watch\
  \ 部分。**\n3. **点击 Add Watch Expression (+)。**\n   会出现一个空白文本框。\n4. **在文本框中输入你的表达式，然后按\
  \ Enter 或 Return 键。**\n\n浏览器会添加该表达式，然后在右侧显示该表达式的当前值。图 10-8 显示了一个示例。\n\n![为你的代码定义监视表达式截图](img/9781394164684-fg041008.png)\n\
  \n图 10-8： 你可以为代码定义监视表达式。\n\n你可以使用以下技术来处理监视表达式：\n\n* **编辑监视表达式。** 双击表达式，进行编辑，然后按\
  \ Enter 或 Return 键。\n* **更新监视表达式的值。** 点击 Refresh Watch Expression 按钮（位于图 10-8 的右上角）。\n\
  * **删除监视表达式。** 将鼠标悬停在想要移除的监视表达式上；然后点击出现在表达式右侧的删除图标 (X)。\n\n## 更多调试策略\n\n调试脚本可能是一项令人沮丧的工作，即使对于简单的脚本也是如此。在追踪编程问题时，有几点需要记住：\n\
  \n* **缩进代码以提高可读性。** 在每个语句块内对代码进行缩进时，JavaScript 代码的可读性会极大提高。易读的代码更容易追踪和破译，因此你的调试工作就少了一个障碍的障碍。缩进多少取决于个人风格，但通常是两个或四个空格：\n\
  \n```javascript\nfunction myFunction() {\n//// 此函数中的每个语句\n// 块缩进了了四个空格。\n}\n```\n\
  \n如果你将一个块嵌套另一个块内部，请将嵌套块再缩进四个空格：\n\n```javascript\nfunction myFunction() {\n  //\
  \ 此函数中的每个语句\n  // 块缩进了四个空格。\n  for (const item of someArray) {\n    // 此嵌套 for…of\
  \ 块中的每个语句\n    // 块又缩进了四个空格。\n  }\n}\n```\n\n* **拆解复杂任务。** 不要试图一次性解决所有问题。如果你有一个运行不正常的大脚本或函数，请分小块进行测试，以缩小问题范围。\n\
  * **拆分长语句。** 脚本调试最复杂的方面之一是理解长语句（尤其是表达式）。控制台窗口可以提供帮助（你可以用它打印语句的一部分），但通常最好保持语句尽可能简短。在程序运行正常后，你通常可以重新组合语句以获得更高效的代码。\n\
  * **注释掉问题语句。** 如果某个特定语句带来问题，可以通过在行开头放置两个斜杠（`//`）来临时禁用它。斜杠告诉 JavaScript 将该行视为注释。如果你有多个语句想要跳过，在第一个语句开头放置\
  \ `/*`，在最后一个语句末尾放置 `*/`。\n* **使用注释来记录你的脚本。** 提到注释，编程界有一条真理：良好的代码——意味着（至少部分）使用清晰的变量和函数名以及逻辑结构的代码——应该是自明易懂的。然而，几乎每段代码都包含一些在之后查看时并不显而易见的。对于这些部分，另一个编程真理是注释越多越好。对复杂的代码块注释越多，脚本就越容易调试。\n\
  \n## 十种常见的 错误\n\n当你遇到脚本问题时，首先要做的应该是检查代码中的常见错误。为了帮助你这样做，这里是初学者和经验丰富的程序员常犯的十种错误：\n\
  \n* **变量使用了关键字。** JavaScript 有许多内置的保留字和关键字，因此人们常用这些词作为变量或函数名。双击你的名称，确保你没有使用任何保留字，或任何对象、属性和方法的名称。\n\
  * **拼错误的变量和其他名称。** 检查你的变量和函数名，确保它们在整个脚本中拼写一致。还要检查你使用的对象、属性和方法的拼写。\n* **误用大小写字母。**\
  \ JavaScript 是一种大小写敏感的语言，这意味着它根据字母是大写还是小写区别对待。例如，考虑以下两个语句：\n\n```javascript\nconst\
  \ firstName = \"Millicent\";\nconst message = \"Welcome \" + firstname;\n```\n\n\
  第一个语句声明了一个名为 `firstName` 的变量，但第二个语句使用了 `firstname`。这段代码会产生 `firstname is not defined`错误（或类似的错误，取决于浏览器），因为\
  \ JavaScript 认为 `firstname` 是另一个（未初始化的）变量。\n\n\n\n\n\n*   **`引号不匹配.`** 在任何你用引号（`\"\
  ` 或 `'`）开始字符串字面量的语句中，请务必检查你是否在字符串末尾包含了相应的闭合引号。此外，检查你是否在字符串内部使用了一个或多个相同的引号。如果是这样，请编辑字符串以使用正确的转义序列（`\\\
  \"` 或 `\\'`），或者切换到反引号（`` ` ``）：\n\n    ```javascript\n    // Bad\n    const myString\
  \ = \"There are no \"bad\" programs.\";\n\n    // Better\n    const myString = \"\
  There are no \\\"bad\\\" programs.\";\n\n    // Best\n    const myString = `There\
  \ are no \"bad\" programs.`;\n    ```\n\n*   **`括号不匹配.`** 检查你的代码中包含左括号 — `(` — 的语句，并确保有对应的右括号：`)`。这同样适用于方括号\
  \ — `[` 和 `]` — 以及大括号 — `{` 和 `}`。\n\n    ![Tip](img/tip.png) 对于包含三或更多组括号的复杂表达式，快速快速匹配检查方法是计算表达式中左括号的数量，然后计算右括号的数量。如果这些数字不匹配，你就知道表达式中的某处存在不匹配。\n\
  \n*   **`函数名后缺少括号.`** 提到括号，如果你的脚本调用了一个不接受任何参数的函数或方法，请检查你是否在函数或方法名后包含了括号 — `()`：\n\
  \n    ```javascript\n    function tryThis() {\n      alert(\"Parentheses travel\
  \ in pairs!\");\n    }\n\n    // This won't work\n    tryThis;\n\n    // This will\n\
  \    tryThis();\n    ```\n\n*   **`大括号使用不当.`** JavaScript 使用大括号来标记语句块的开始 (`{`) 和结束\
  \ (`}`)，这些块关联函数、涉及 `if` 和 `switch` 的测试以及循环（包括 `for…of`、`for`、`while` 和 `do…while`）。在块中很容易漏掉一个或两个大括号，而在将一个测试或循环嵌套另一个内部时，混淆大括号变得更容易。双双检查你的大括号，确保每个块都有起始大括号和结束大括号。\n\
  \n    ![Tip](img/tip.png) 确保不漏掉任何大括号的方法之一是在整个脚本中一致地放置它们。例如，许多人倾向于使用传统的大括号位置：\n\n\
  \    `keyword` `{`\n    `statements`\n    `}`\n\n    （在这里，`keyword` 指定义该块的语句——例如\
  \ `function` 或 `if`。）如果你喜欢这种风格，请在整个脚本中统一使用，这样你就能确切知道在哪里找到每个大括号。\n\n    确保你永远不会忘记结束大括号的简单方法是在输入起始大括号后立即输入结束括号。也就是说，你输入\
  \ `{`，按两次回车键，然后输入 `}`。\n\n    此外，对块内的语句使用一致的缩进。一致的缩进使得查看大括号更容易，特别是当你有一个块嵌套在另一个块内部时。\n\
  \n*   **`使用 = 或 == 代替 ===.`**** 恒等运算符 (`===`) 是 JavaScript 中最不直观的特征之一，因为赋值运算符 (`=`)\
  \ 感觉要自然得多。等等运算符 (`==`) 可能会导致问题，因为它在进行比较之前经常转换数据类型。因此，检查你所有的比较表达式，确保你始终使用 `===` 而不是\
  \ `=` 或 `==`。\n\n*   **`全局变量与块或局部变量之间的冲突.`** 全局变量在整个页面中可用，甚至在块和函数内部。因此，在块或函数内部，确保你没有声明并使用与全局变量同名的变量。\n\
  \n*   **`在元素加载之前使用页面元素.`** JavaScript 逐行运行页面 HTML，并在遇到每个 JavaScript 语句时检查其语法。如果你的代码引用了\
  \ JavaScript 尚未到达的元素（例如表单字段），它将生成错误。因此，如果你的代码处理元素，请务必将脚本放在 HTML 文件中元素之后。\n\n## 十种常见的\
  \ JavaScript 错误消息\n\n为了帮助你解读 JavaScript 抛出的错误消息，这里有一个十种常见错误及其含义：\n\n*   **`Syntax\
  \ error` (语法错误).** 这种加载时错误意味着 JavaScript 检测到语句中存在不正确的语法。错误消息几乎总是告诉你错误发生的确切行数和字符。例如，如果你查看图\
  \ 10-1 所示的错误消息，注意在错误消息右侧你会看到以下内容：\n\n    ```text\n    example01:17:18\n    ```\n\
  \n    这段文字意味着错误发生在 `example01` 文件中，第 17 行，字符位置 18（从语句开始计数）。\n\n*   **`Expected (`\
  \ (期望 ( ) 或 `Missing (` (缺少 ()。** 这些消息意味着你忘记了包含左括号：\n\n    ```javascript\n    function\
  \ changeBackgroundColor newColor) {\n    ```\n\n    如果你忘记的是右括号，将得到 `Expected )`\
  \ (期望 ) ) 或 `Missing )` (缺少 ) )：\n\n    ```javascript\n    function changeBackgroundColor\
  \ (newColor{\n    ```\n\n*   **`Expected {` (期望 { ) 或 `Missing { before function\
  \ body` (函数体前缺少 {)。** 这些错误告诉你你的代码缺少函数的起始大括号：\n\n    ```javascript\n    function\
  \ changeBackgroundColor (newColor)\n    statements\n    }\n    ```\n\n    如果你缺少的是结束大括号，将得到\
  \ `Expected }` (期望 } ) 或 `Missing }` (缺少 })。\n\n*   **`Unexpected end of input`\
  \ (输入意外结束) 或 `Missing } in compound statement` (复合语句中缺少 }).** 这些消息表示你忘记了 `if` 块或其他复合语句中的结束大括号：\n\
  \n    ```javascript\n    if (currentHour < 12) {\n      console.log(\"Good morning!\"\
  );\n    } else {\n      console.log(\"Good day!\");\n    }\n    ```\n\n    如果你忘记的是起始大括号，将得到一个\
  \ `Syntax error` 消息，它会地指向块的结束大括号（这是浏览器第一次意识到错误的地方）。\n\n*   **`Missing ;` (缺少 ;)\
  \ ) 或 `Missing ; after for-loop initializercondition` (for 循环初始化器条件后缺少 ;)。** 这些错误意味着\
  \ `for` 循环定义缺少分号（`;`），要么是因为你忘记了分号，要么是因为你使用了其他字符（例如逗号）：\n\n    ```javascript\n  \
  \  for (let counter = 1; counter < 5, counter += 1) {\n    ```\n\n*   **`Unexpected\
  \ identifier` (意外的标识符) 或 `Missing ; before statement` (语句前缺少 ;)。** 这些错误告诉你上一个语句由于某种原因没有正常结束，或者你用无效值开始了一个新语句。在\
  \ JavaScript 中，语句应该以分号（`;`）结束，但使用分号是可选的。所以，如果 JavaScript 认为你没有完成语句，它就假设缺少分号。例如，这可能发生在你忘记包含起始\
  \ `/*` 来开始多行注释时：\n\n    ```javascript\n    /* Start the comment (oops!)\n    Close\
  \ the comment */\n    ```\n\n*   **`X is not defined` (X 未定义).** 这条消息通常指的是一个名为 `X`\
  \ 的未声明或未初始变量，而你正尝试在表达式中使用它。如果是这样，请声明并初始化该变量。另一个可能是未包含引号的字符串字面量。最后，还要检查是否拼写了变量名：\n\
  \n    ```javascript\n    const grossProfit = 100000;\n    const profitSharing =\
  \ grossPrifit * profitSharingPercent;\n    ```\n\n*   **`X is not an object` (X\
  \ 不是对象) 或 `X has no properties` (X 没有属性)。** 这些消息意味着你的代码引用了一个不存在的对象，或者引用了一个不属于指定对象的属性。检查你是否拼写了对象或属性，或者对于第二种情况，检查是否使用了错误的对象：\n\
  \n    ```javascript\n    document.alert(\"Nope!\")\n    ```\n\n*   **`Unterminated\
  \ string constant` (未终止的字符串常量) 或 `Unterminated string literal` (未终止的字符串字面量)。** 这两条消息都意味着你用引号开始了一个字符串字面量，但忘记包含闭合引号：\n\
  \n    ```javascript\n    const greeting = \"Welcome to my Web site!\n    ```\n\n\
  \n\n\n\n* `此页面上的脚本正在导致 [browser name] 运行缓慢。你是否要中止脚本？` 或 `JavaScript 仍在运行。继续吗？`。**这些错误提示你，你的代码可能陷入了无限循环。你无法获得关于问题问题的任何特定信息，因此你需要仔细检查代码以寻找可能的原因。**\n\
  \n# 第 11 章\n\n## 处理表单数据\n\n本章内容\n\n* ![Bullet](img/check.png) **编写文本框**\n* ![Bullet](img/check.png)\
  \ **编写复选框和单选按钮**\n* ![Bullet](img/check.png) **处理选择列表**\n* ![Bullet](img/check.png)\
  \ **监控和触发表单事件**\n* ![Bullet](img/check.png) **处理表单数据**\n\n*编程比其他活动需要更多的注意力。这就是为什么程序员对“快速中断”感到恼火的原因——这种中断等同于让一个杂技演员在保持三个球在空中旋转的同时，还要提着购物袋。*\n\
  \n——史夫·麦康内尔 (STEVE MCCONNELL)\n\n构建 HTML 表单（第 2 本的主题，第 5 章）是奇妙且有趣的，但你可能已经注意到你的表单中有些许令人沮丧的地方：它们并没有真正做什么！诚然，切换复选框、从列表中选择一个值以及从颜色选择器中选择一种色调确实有一定的成就感，但这种成就感是短暂的。这就像装修你的厨房，转动新烤箱的炉旋钮，结果什么都没有发生。为什么呢？没电！为什么你的\
  \ HTML 表单什么都不做？因为没有 JavaScript！\n\n在本章中，你将学习如何通过将 HTML 表单连接到某些 JavaScript 代码来为其“接线”。你将探索各种与表单相关的对象，然后直接开始编写文本字段、复选框、单选按钮和选择列表的代码。你还将深入实用的表单事件世界，甚至学习如何使用键盘快捷键增强你的表单控件。最后，你将尽情施展，学习如何使用我在第\
  \ 4 本第 9 章中提到过的 Web Storage API 来存储表单数据。\n\n### 观察 HTMLFormElement 对象\n\n`form`\
  \ 元素是一个 `HTMLFormElement` 对象，它提供了几个可能有用的属性（在每情况下，假设 `form` 是 `form` 元素对象的引用）：\n\n\
  * `form`.action`: 表单 `action` 属性的值\n* `form`.elements`: 返回表单所有控件的集合（一个 `HTMLFormControlsCollection`\
  \ 对象）\n* `form`.length`: 表单中控件的数量\n* `form`.method`: 表单 `method` 属性的值\n* `form`.name`:\
  \ 表单 `name` 属性的值\n* `form`.target`: 表单 `target` 属性的值\n\n### 浅探 HTMLInputElement\
  \ 对象\n\n任何基于 `input` 元素的表单字段都是一个 `HTMLInputElement` 对象，它提供了许多实用的属性（在每情况下，假设 `input`\
  \ 是 `input` 元素对象的引用）：\n\n* `input`.form`: 元素所属的表单（一个 `HTMLFormElement` 对象）\n* `input`.labels`:\
  \ 返回与元素关联的 `label` 元素的 `NodeList`\n* `input`.name`: 元素 `name` 属性的值\n* `input`.type`:\
  \ 元素的 `type` 属性\n* `input`.value`: 元素的当前值\n* `input`.valueAsDate`: 元素的当前值，解释为日期\n\
  * `input`.valueAsNumber`: 元素的当前值，解释为时间值，然后解释为数字\n\n### 编写文本字段\n\n基于文本的字段是最常用的表单元素，大多数字段都使用\
  \ `<input>` 标签。`input` 元素有许多属性（参考第 2 本第 5 章），但从编码的角度来看，你通常只对其中四个感兴趣：\n\n`<input\
  \ id=\"textId\" type=\"textType\" name=\"textName\" value=\"textValue\">`\n\n* `textId`:\
  \ 文本字段的唯一标识符\n* `textType`: 你想在表单使用的文本字段类型\n* `textName`: 你分配给字段的名称\n* `textValue`:\
  \ 字段的初始值（如果有的话）\n\n#### 通过字段类型引用文本字段\n\n一种常见的表单脚本技术是对同种类型的每个字段执行某种操作。例如，你可能想对所有\
  \ URL 字段应用样式。以下是用于选择给定类型的所有 `input` 元素的 JavaScript 选择器：\n\n```\ndocument.querySelectorAll('input[type=fieldType]')\n\
  ```\n\n* `fieldType`: 你想要选择的 `type` 属性值，例如 `text` 或 `url`\n\n这是一个示例，JavaScript 返回所有使用\
  \ `url` 类型的 `input` 元素的集合（查看此书中示例文件中的 bk04ch11/example01.html）：\n\nHTML:\n```html\n\
  <label for=\"url1\">站点 1:</label>\n<input id=\"url1\" type=\"url\" name=\"url1\"\
  \ value=\"https://\">\n<label for=\"url2\">站点 2:</label>\n<input id=\"url2\" type=\"\
  url\" name=\"url2\" value=\"https://\">\n<label for=\"url3\">站点 3:</label>\n<input\
  \ id=\"url3\" type=\"url\" name=\"url3\" value=\"https://\">\n```\n\nJavaScript:\n\
  ```javascript\nconst urlFields = document.querySelectorAll('input[type=url]');\n\
  ```\n\n#### 获取文本字段的值\n\n你的脚本可以通过字段对象的某些属性来获取任何文本字段的值：\n\n* `field`.value`\n* `field`.valueAsDate`\n\
  * `field`.valueAsNumber`\n\n* `field`: 你想要处理的表单字段\n\n这是一个示例（查看 bk04ch11/example02.html）：\n\
  \nHTML:\n```html\n<label for=\"search-field\">搜索站点:</label>\n<input id=\"search-field\"\
  \ name=\"q\" type=\"search\">\n```\n\nJavaScript:\n```javascript\nconst searchString\
  \ = document.getElementById('search-field').value;\n```\n\n#### 设置文本字段的值\n\n要更改文本字段的值，将字符串赋值给字段对象：\n\
  \n`field`.value = value`\n\n* `field`: 你想要处理的表单字段\n* `value`: 你想分配给文本字段的字符串\n\n\
  这是一个示例（bk04ch11/example03.html）：\n\nHTML:\n```html\n<label for=\"homepage-field\"\
  >输入你的首页地址:</label>\n<input id=\"homepage-field\" name=\"homepage\" type=\"url\"\
  \ value=\"HTTPS://PAULFEDRIES.COM/\">\n```\n\nJavaScript:\n```javascript\nconst\
  \ homepageField = document.getElementById('homepage-field');\nconst homepageURL\
  \ = homepageField.value;\nhomepageField.value = homepageURL.toLowerCase();\n```\n\
  \nHTML 定义了一个类型为 `url` 的 `input` 元素，其默认值为全大写。JavaScript 代码获取 URL，将其转换为全小写，然后将其返回给\
  \ `url` 字段。如图 11-1 所示，文本框现在显示全小写字母。\n\n![默认文本转小写的截图](img/9781394164684-fg041101.png)\n\
  \n[图 11-1：]脚本将 `input` 元素的默认文本转换为全小写。\n\n### 编写复选框\n\n你在 Web 表单中使用复选框切换设置的开启（即复选框被选中）和关闭（复选框未被选中）。通过在表单中包含以下版本的\
  \ `<input>` 标签来创建复选框：\n\n`<input id=\"checkId\" type=\"checkbox\" name=\"checkName\"\
  \ value=\"checkValue\" [checked]>`\n\n* `checkId`: 复选框的唯一标识符\n* `checkName`: 你分配给复选框的名称\n\
  * `checkValue`: 你分配给复选框的值。注意，这是一个隐藏值，你的脚本在提交表单时可以访问；用户永远不会遇到它。\n* `checked`: 当此可选属性存在时，复选框初始为选中状态。\n\
  \n\n\n\n\n![Remember](img/remember.png) 复选框字段的一个奇之处是，只有当它被选中时，才会被包含在表单提交中。如果复选框未勾选，它就不会包含在提交中。\n\
  \n### 引用复选框\n\n如果你的代码需要引用页面上所有的复选框，请使用以下选择器（bk04ch11/example04.html）：\n\n`document.querySelectorAll('input[type=checkbox]')`\n\
  \n如果你只需要特定表单中的复选框，可以使用表单的 `id` 值使用后代或子选择器：\n\n`document.querySelectorAll('#`*`formid`*\
  \ `input[type=checkbox]')`\n\n或者：\n\n`document.querySelectorAll('#`*`formid`* `>\
  \ input[type=checkbox]')`\n\n### 获取复选框状态\n\n在讨论复选框的“值”时需要小心。如果你想处理 `value` 属性，那么通过复选框对象的\
  \ `value` 属性获取它与获取文本字段的 `value` 属性没有区别。\n\n然而，你可能更感兴趣复选框是否被选中或未勾选。这被称为复选框的 `state`。在这种情况下，你需要检查复选框对象的\
  \ `checked` 属性：\n\n`checkbox`.checked`\n\n*   `checkbox`: 你想要处理的复选框对象的引用。\n\n如果复选框被选中，`checked`\
  \ 属性返回 `true`；如果未选中，则返回 `false`。\n\n这是一个示例（bk04ch11/example05.html）：\n\nHTML:\n\
  ```html\n<label>\n<input id=\"autosave\" type=\"checkbox\" name=\"autosave\">\n\
  自动保存此项目\n</label>\n```\n\nJavaScript:\n```javascript\nconst autoSaveCheckBox = document.querySelector('#autosave');\n\
  if (autoSaveCheckBox.checked) {\n  console.log(`${autoSaveCheckBox.name} is checked`);\n\
  } else {\n  console.log(`${autoSaveCheckBox.name} is unchecked`);\n}\n```\n\nJavaScript\
  \ 代码在 `autoSaveCheckBox` 变量中存储了复选框对象的引用。然后，一个 `if` 语句会检查对象的 `checked` 属性，并根据 `checked`\
  \ 返回 `true` 还是 `false` 在控制台中显示不同的消息。\n\n### 设置复选框状态\n\n要将复选框字段设置为选中或未选中状态，请将布尔表达式赋值给\
  \ `checked` 属性：\n\n`checkbox`.checked = `Boolean`\n\n*   `checkbox`: 你想要处理的复选框对象的引用。\n\
  *   `Boolean`: 你想要赋值给复选框的布尔值或表达式。使用 `true` 选中复选框；使用 `false` 取消选中。\n\n例如，假设你有一个有很多复选框的表单，你想设置该表单让使用户最多选择三个复选框。以下是实现该功能的代码（bk04ch11/example06.html）：\n\
  \n```javascript\ndocument.querySelector('form').addEventListener('click', event\
  \ => {\n  // 确保点击的是复选框\n  if (event.target.type === 'checkbox') {\n    // 获取已选中复选框的总数\n\
  \    const totalSelected = document.querySelectorAll('input[type=checkbox]:checked').length;\n\
  \    // 是否选了多于三个复选框？\n    if (totalSelected > 3) {\n      // 如果是，取消刚点击的复选框的选择\n\
  \      event.target.checked = false;\n    }\n  }\n});\n```\n\n该事件处理器在点击 `form` 元素内的任何内容时运行，并将点击事件引用作为参数\
  \ `event` 传递。然后，代码使用 `:checked` 选择器返回所有具有 `checked` 属性的 `checkbox` 元素集合，`length`\
  \ 属性告诉你有集合中有多少元素。一个 `if` 测试检查现在是否选了多于三个。如果 true，代码将取消刚点击的复选框的选择。\n\n## 处理单选按钮\n\n\
  如果你想为用户提供一组相关的选项，且一次只能选中一个，那么单选按钮（radio buttons）是最佳选择。单选按钮成两个或多个组成一组，每组在任何时候只能选中一个按钮。如果用户点击该组中的另一个按钮，它将被选中，而之前选中的按钮将变为未选中。\n\
  \n使用以下 `<input>` 标签的变体创建单选按钮：\n\n```html\n<input id=\"`*`radioId`*\"` type=\"radio\"\
  \ name=\"`*`radioGroup`*\"` value=\"`*`radioValue`*\"` [checked]>\n```\n\n*   `radioId`:\
  \ 单选按钮的唯一标识符。\n*   `radioGroup`: 你想赋予单选按钮组的名字。所有使用相同 `name` 值的单选按钮都属于该组。\n*   `radioValue`:\
  \ 你想赋予单选按钮的值。如果提交表单时此单选按钮被选中，该值将包含在提交中。\n*   `checked`: 当此可选属性存在时，单选按钮初始为选中状态。\n\
  \n### 引用单选按钮\n\n如果你的代码需要处理页面上所有的单选按钮，请使用此 JavaScript 选择器：\n\n`document.querySelectorAll('input[type=radio]')`\n\
  \n如果你只需要特定表单的单选按钮，可以使用表单的 `id` 值使用后代或子选择器：\n\n`document.querySelectorAll('#`*`formid`*\
  \ `input[type=radio]')`\n\n或者：\n\n`document.querySelectorAll('#`*`formid`* `> input[type=radio]')`\n\
  \n如果你只需要某一组单选按钮，请使用以下选择器，其中 `radioGroup` 是公共名称：\n\n`document.querySelectorAll('input[name=`*`radioGroup`*]')`\n\
  \n### 获取单选按钮状态\n\n如果你的代码需要知道特定的单选按钮是被选中还是未选中，你需要确定单选按钮的 `state`。你可以通过检查单选按钮的 `checked`\
  \ 属性来实现，如下：\n\n`radio`.checked`\n\n*   `radio`: 你想要处理的复选框对象的引用（注：此处原文误写为 checkbox\
  \ object，应为 radio button object）\n\n例如，考虑以下 HTML（bk04ch11/example07.html）：\n\n```html\n\
  <form>\n  <fieldset>\n    <legend>选择一种配送方式</legend>\n    <label>\n      <input type=\"\
  radio\" id=\"carrier-pigeon\" name=\"delivery\" value=\"pigeon\" checked>信鸽快递\n\
  \    </label>\n    <label>\n      <input type=\"radio\" id=\"pony-express\" name=\"\
  delivery\" value=\"pony\">马术快递\n    </label>\n    <label>\n      <input type=\"\
  radio\" id=\"snail-mail\" name=\"delivery\" value=\"postal\">蜗信\n    </label>\n\
  \    <label>\n      <input type=\"radio\" id=\"some-punk\" name=\"delivery\" value=\"\
  bikecourier\">骑车的朋克\n    </label>\n  </fieldset>\n</form>\n```\n\n以下语句存储了 `id` 为\
  \ `pony-express` 的单选按钮的状态：\n\n`const ponySelected = document.querySelector('#pony-express').checked;`\n\
  \n然而，你的代码可能更想知道组中哪个单选按钮被选中。你可以通过对组应用 `:checked` 选择器，然后获取返回对象的 `value` 属性来实现：\n\n\
  `const deliveryMethod = document.querySelector('input[name=delivery]:checked').value;`\n\
  \n![Tip](img/tip.png) 获取与单选按钮关联的标签文本，使用 `input` 元素的 `labels` 属性获取 `label` 元素的引用，然后使用\
  \ `innerText` 属性获取标签文本：\n\n`document.querySelector('input[name=delivery]:checked').labels[0].innerText;`\n\
  \n### 设置单选按钮状态\n\n要将单选按钮字段设置为选中或未选中状态，请将布尔表达式赋值给 `checked` 属性：\n\n`radio`.checked\
  \ = `Boolean`\n\n*   `radio`: 你想要修改的单选按钮对象的引用。\n*   `Boolean`: 你想要赋值给单选按钮的布尔值或表达式。使用\
  \ `true` 选中单选按钮；使用 `false` 取消选中。\n\n\n\n\n\n例如，在上一节的 HTML 代码中，表单组的初始状态是第一个单选按钮被选中。你可以通过选择该按钮来重置该组。你可以获取第一个单选按钮的\
  \ `id` 引用，但如果以后你更改（或其他人更改）了单选按钮的顺序怎么办？更安全的方法是获取组内第一个单选按钮的引用（无论是什么），然后选择该元素。这里是实现此操作的代码（`bk04ch11/example08.html`）：\n\
  \n```\nconst firstRadioButton = document.querySelectorAll('input[name=delivery]')[0];\n\
  firstRadioButton.checked = true;\n```\n\n这段代码使用 `querySelectorAll()` 返回 `delivery`\
  \ 组所有单选按钮的 `NodeList` 集合；然后使用 `[0]` 引用集合中的第一个元素。接着将该元素的 `checked` 属性设置为 `true`。\n\
  \n# 编程选择列表\n\n选择列表在 HTML 表单中非常常见，因为它们允许 Web 开发者在一个紧凑的控件中显示较多的选项，而大多数用户都知道如何操作这种控件。\n\
  \n要创建列表容器，你使用 `<select>` 标签：\n\n`<select id=\"selectId\" name=\"selectName\" size=\"\
  selectSize\" [multiple]>`\n\n*   `selectId`: 选择列表的唯一标识符。\n*   `selectName`: 你想分配给选择列表的名称。\n\
  *   `selectSize`: 选择列表框中可见的行数（可选）。如果你省略此值，浏览器将列表列表显示为下拉框。\n*   `multiple`: 当存在此可选属性时，允许用户在列表中选择多个选项。\n\
  \n对于列表中的每个项目，你需要在 `<select>` 和 `</select>` 标签之间添加一个 `<option>` 标签：\n\n`<option value=\"\
  optionValue\" [selected]>`\n\n*   `optionValue`: 你想分配给列表选项的值。\n*   `selected`: 当存在此可选属性时，该列表选项初始为被选中状态。\n\
  \n## 检查 HTMLSelectElement 对象\n\n选择列表是一个 `HTMLSelectElement` 对象，它提供了许多实用的属性（在每种情况下，假设\
  \ `select` 是选择列表对象的引用）：\n\n*   `select`.form: 选择列表所在的表单（一个 `HTMLFormElement` 对象）。\n\
  *   `select`.length: 选择列表中 `option` 元素的数量。\n*   `select`.multiple: 一个布尔值。如果选择列表包含\
  \ `multiple` 属性，则返回 `true`；否则返回 `false`。\n*   `select`.name: 选择列表 `name` 属性的值。\n\
  *   `select`.options: 选择列表中包含的 `option` 元素（一个 `HTMLOptionsCollection` 对象）。\n*  \
  \ `select`.selectedIndex: 第一个被选中的 `option` 元素的索引（第一个 `option` 元素的索引值从 `0` 开始）。如果没有选中任何\
  \ `option` 元素，此属性返回 `-1`。\n*   `select`.selectedOptions: 选择列表中当前选中的 `option` 元素（一个\
  \ `HTMLCollection` 对象）。\n*   `select`.type: 选择列表类型：普通列表为 `select-one`，应用了 `multiple`\
  \ 属性的列表为 `select-multiple`。\n*   `select`.value: 第一个被选中的 `option` 元素的 `value` 属性。如果没有选中\
  \ `option` 元素，此属性返回空字符串。\n\n## 检查 HTMLOptionElement 对象\n\n选择列表中的每个 `option` 元素都是一个\
  \ `HTMLOptionElement` 对象。这里有几个需要记住的 `HTMLOptionElement` 属性（在每种情况下，假设 `option` 是\
  \ `option` 元素的引用）：\n\n*   `option`.defaultSelected: 一个布尔值。如果 `option` 元素默认包含了 `selected`\
  \ 属性，则返回 `true`；否则返回 `false`\n*   `option`.form: `option` 元素所在的表单（一个 `HTMLFormElement`\
  \ 对象）\n*   `option`.index: `option` 元素在选择列表中的索引（第一个 `option` 元素的索引值从 `0` 开始）\n*\
  \   `option`.selected: 一个布尔值。如果 `option` 元素当前被选中，则返回 `true`；否则返回 `false`\n*   `option`.text:\
  \ `option` 元素的文本内容\n*   `option`.value: `option` 元素的 `value` 属性的值\n\n## 引用选择列表选项\n\
  \n如果你的代码需要处理选择列表中的所有选项，请使用选择列表对象的 `options` 属性（`bk04ch11/example09.html`）：\n\n```\n\
  document.querySelector(`list`).options\n```\n\n*   `list`: 指定你想要处理的 `select` 元素的选择器。\n\
  \n要处理列表中的特定选项，使用 JavaScript 的方括号运算符（`[]`）来指定选项在列表中位置的索引（`bk04ch11/example09.html`）：\n\
  \n```\ndocument.querySelector(`list`).options[n]\n```\n\n*   `list`: 指定你想要处理的 `select`\
  \ 元素的选择器。\n*   `n`: 返回的 `NodeList` 集合中选项的索引（其中 `0` 是第一个选项，`1` 是第二个选项，依此类推）\n\n要获取选项的文本（即在列表中显示的文本），使用选项对象的\
  \ `text` 属性：\n\n```\ndocument.querySelector(`list`).options[2].text\n\n## 获取选中的选项\n\
  \n如果你的代码需要知道选择列表中的某个选项是否被选中或未选中，请检查选项的 `selected` 属性，如下：\n\n```\noption.selected\n\
  ```\n\n*   `option`: 你想要处理的 `option` 对象。\n\n`selected` 属性在选项被选中时返回 `true`，在未选中时返回\
  \ `false`。\n\n例如，考虑以下选择列表：\n\n```html\n<select id=\"hair-color\" name=\"hair-color\"\
  >\n<option value=\"black\">Black</option>\n<option value=\"blonde\">Blonde</option>\n\
  <option value=\"brunette\" selected>Brunette</option>\n<option value=\"red\">Red</option>\n\
  <option value=\"neon\">Something neon</option>\n<option value=\"none\">None</option>\n\
  </select>\n```\n\n以下 JavaScript 语句存储了列表中第一个项目的状态：\n\n```javascript\nlet black =\
  \ document.querySelector('#hair-color').options[0].selected;\n```\n\n然而，你可能更想知道哪个选项被选中了。通过列表的\
  \ `selectedOptions` 属性来实现：\n\n```javascript\nconst hairColor = document.querySelector('#hair-color').selectedOptions[0];\n\
  ```\n\n这不是多选列表，因此 `selectedOptions[0]` 会返回选中的 `option` 元素。在示例中，你的代码可以使用 `hairColor.text`\
  \ 获取选中选项的文本。\n\n如果列表包含 `multiple` 属性，`selectedOptions` 属性可能会返回一个包含多个元素的 `HTMLCollection`\
  \ 对象。你的代码需要考虑到这种可能性，例如通过遍历集合（`bk04ch11/example10.html`）：\n\nHTML：\n\n```html\n<select\
  \ id=\"hair-products\" name=\"hair-products\" size=\"5\" multiple>\n<option value=\"\
  gel\" selected>Gel</option>\n<option value=\"grecian-formula\" selected>Grecian\
  \ Formula</option>\n<option value=\"mousse\">Mousse</option>\n<option value=\"peroxide\"\
  >Peroxide</option>\n<option value=\"shoe-black\">Shoe black</option>\n</select>\n\
  ```\n\nJavaScript：\n\n```javascript\nconst selectedHairProducts = document.querySelector('#hair-products').selectedOptions;\n\
  for (const hairProduct of selectedHairProducts) {\n  console.log(hairProduct.text);\n\
  }\n```\n\n## 修改选中的选项\n\n要将选择列表选项设置为选中或未选中状态，请为选项对象的 `selected` 属性赋值一个布尔表达式：\n\n\
  ```\noption.selected = Boolean\n```\n\n*   `option`: 你想要修改的 `option` 元素的引用。\n* \
  \  `Boolean`: 你想分配给该选项的布尔值或表达式。使用 `true` 选中选项；使用 `false` 取消选项。\n\n\n\n\n\n使用上一节中的\
  \ HTML 代码，以下语句选择了列表中的第三个选项：\n\n`document.querySelector('#hair-products').options[2].selected\
  \ = true;`\n\n你可以通过取消选择所有选项来重置列表。你可以通过将选择列表对象的 `selectedIndex` 属性设置为 `-1` 来实现：\n\
  \n`document.querySelector('#hair-products').selectedIndex = -1`\n\n## 处理和触发表单事件\n\
  \n在不断的点击、输入、制 键切换和拖拽中，Web 表单是其实的事件工厂。幸运的是，你可以忽略大多数此类事件，但有少数事件非常有用，无论是在事件发生时运行代码，还是由你手动触发这些事件。\n\
  \n大多数表单事件都是点击，因此你可以通过使用 JavaScript 的 `addEventListener()` 方法设置 `click` 事件处理程序来处理它们（我将在第\
  \ 4 本第 6 章] 中介绍）。这里有一个示例 (`bk04ch11/example11.html`)：\n\nHTML:\n```html\n<form>\n\
  \  <label for=\"user\">Username:</label>\n  <input id=\"user\" type=\"text\" name=\"\
  username\">\n  <label for=\"pwd\">Password:</label>\n  <input id=\"pwd\" type=\"\
  password\" name=\"password\">\n</form>\n```\n\nJavaScript:\n```javascript\ndocument.querySelector('form').addEventListener('click',\
  \ () => {\n  console.log('Thanks for clicking the form!');\n});\n```\n\n此示例监听了整个\
  \ `form` 元素的点击，但你也可以为按钮、`input` 元素、复选框、单选按钮等创建 `click` 事件处理程序。\n\n### 设置焦点\n\n一个可以提高表单页面用户体验的一个简单功能，是在页面加载时为第一个表单字段设置焦点。设置焦点可以避免用户在第一个字段内进行那种恼人的点击操作。\n\
  \n要完成这一点，请在你希望启动时获取焦点的元素上运行 JavaScript 的 `focus()` 方法：\n\n`field.focus()`\n\n* \
  \  `field`: 你希望获取焦点的表单字段的引用。\n\n这是一个在启动时为 `id` 等于 `user` 的文本字段设置焦点的示例 (`bk04ch11/example12.html`)：\n\
  \nHTML:\n```html\n<form>\n  <label for=\"user\">Username:</label>\n  <input id=\"\
  user\" type=\"text\" name=\"username\">\n  <label for=\"pwd\">Password:</label>\n\
  \  <input id=\"pwd\" type=\"password\" name=\"password\">\n</form>\n```\n\nJavaScript:\n\
  ```javascript\ndocument.querySelector('#user').focus();\n```\n\n### 监控焦点事件\n\n与其设置焦点，你可能更想监控特定字段何时获得焦点（例如，通过用户点击字段或使用\
  \ Tab 键切换到该字段）。你可以通过在字段上设置 `focus` 事件处理程序来监控它：\n\n`field.addEventListener('focus',\
  \ () => {\n  // 焦点处理代码写在这里\n});`\n\n*   `field`: 你想要监控 `focus` 事件的表单字段的引用。\n\n这是一个示例\
  \ (`bk04ch11/example13.html`)：\n\n```javascript\ndocument.querySelector('#user').addEventListener('focus',\
  \ () => {\n  console.log('The username field has the focus!');\n});\n```\n\n###\
  \ 监控失去焦点事件\n\n给元素设置焦点的反面是让元素*失去焦点*（blurring），这会移除元素上的焦点。你通过在元素上运行 `blur()` 方法来使其失去焦点：\n\
  \n`field.blur()`\n\n*   `field`: 你不再希望继续拥有焦点的表单字段的引用。\n\n然而，与其让元素失去焦点，你可能更想在特定元素失去焦点时运行某些代码（例如，通过用户点击字段或使用\
  \ Tab 键离开字段）。你可以通过设置 `blur()` 事件处理程序来监控特定的失去焦点元素：\n\n`field.addEventListener('blur',\
  \ () => {\n  // 失去焦点处理代码写在这里\n});`\n\n*   `field`: 你想要监控 `blur` 事件的表单字段的引用。\n\n\
  这是一个示例 (`bk04ch11/example14.html`)：\n\n```javascript\ndocument.querySelector('#user').addEventListener('blur',\
  \ () => {\n  console.log('The username field no longer has the focus!');\n});\n\
  ```\n\n### 监听元素变化\n\n最有用的表单事件之一是 `change` 事件，当字段的值或状态以某种方式被修改时触发。该事件的触发取决于元素的类型：\n\
  \n*   对于 `textarea` 元素和各种与文本相关的 `input` 元素，`change` 事件在元素失去焦点时触发。\n*   对于复选框、单选按钮、选择列表和选择器，一旦用户点击元素来修改选择或值，`change`\
  \ 事件就会立即触发。\n\n你通过设置一个 `change()` 事件处理程序来监听字段的 `change` 事件：\n\n`field.addEventListener('change',\
  \ () => {\n  // 变化处理代码写在这里\n});`\n\n*   `field`: 你想要监控 `change` 事件的表单字段的引用。\n\n\
  这是一个示例 (`bk04ch11/example15.html`)：\n\nHTML:\n```html\n<label for=\"bgcolor\">Select\
  \ a background color</label>\n<input id=\"bgcolor\" type=\"color\" name=\"bg-color\"\
  \ value=\"#ffffff\">\n```\n\nJavaScript:\n```javascript\ndocument.querySelector('#bgcolor').addEventListener('change',\
  \ (event) => {\n  const backgroundColor = event.target.value;\n  document.body.style.backgroundColor\
  \ = backgroundColor;\n});\n```\n\n\n\n\nHTML 创建了一个简单的按钮。JavaScript 为按钮的 `click`\
  \ 事件设置了事件处理器，该处理器会更改按钮文本，然后使用 `setTimeout()` 在三秒后将文本改回。代码还设置了一个 `keydown` 事件处理器，用于检查是否同时按了\
  \ `Ctrl`、`Shift` 和 `E` 键。如果是，代码将调用按钮的 `click()` 方法，从而触发 `click` 事件并执行 `click` 事件处理器。\n\
  \n## 处理表单数据\n\n我之前还没有涵盖其中一个表单事件，它非常重要：`submit` 事件，它在表单数据准备发送到服务器时触发。\n\n然而，如果你的脚本仅在本地处理表单数据——也就是说你从不将数据发送到服务器——那么你就不需要提交表单。相反，更直接的方法是在表单中添加一个按钮，然后使用该按钮的\
  \ `click` 事件处理器以你需要的任何方式处理表单数据。\n\n![Tip](img/tip.png) 将表单数据提交到服务器超本书的范围。如果你感兴趣，我在我的配套书籍\
  \ *Web Coding and Development All-in-One For Dummies*（Wiley）中对这些内容进行了详细介绍。\n\n这里有一个示例\
  \ (bk04ch11/example17.html)：\n\nHTML:\n\n```html\n<form>\n<fieldset>\n<legend>\n\
  Settings\n</legend>\n<label for=\"background-color\">选择背景颜色</label>\n<input id=\"\
  background-color\" type=\"color\" name=\"bg-color\" value=\"#ffffff\">\n<label for=\"\
  text-color\">选择文本颜色</label>\n<input id=\"text-color\" type=\"color\" name=\"text-color\"\
  \ value=\"#000000\">\n<label for=\"font-stack\">选择字体:</label>\n<select id=\"font-stack\"\
  \ name=\"font-stack\">\n<option value=\"Georgia, 'Times New Roman', serif\" selected>衬线字体</option>\n\
  <option value=\"Verdana, Tahoma, sans-serif\">无衬线字体</option>\n<option value=\"'Bradley\
  \ Hand', Brush Script MT, cursive\">草字体</option>\n<option value=\"Luminari\">幻想字体</option>\n\
  <option value=\"Monaco, Courier, monospace\">等宽字体</option>\n</select>\n<button>\n\
  保存设置\n</button>\n</fieldset>\n</form>\n```\n\nJavaScript:\n\n```javascript\n// 监听\
  \ #background-color 颜色选择器的变化\ndocument.querySelector('#background-color').addEventListener('change',\
  \ function() {\n  const backgroundColor = this.value;\n  document.body.style.backgroundColor\
  \ = backgroundColor;\n});\n\n// 监听 #text-color 颜色选择器的变化\ndocument.querySelector('#text-color').addEventListener('change',\
  \ function() {\n  const textColor = this.value;\n  document.body.style.color = textColor;\n\
  });\n\n// 监听 #font-stack 选择列表的变化\ndocument.querySelector('#font-stack').addEventListener('change',\
  \ function() {\n  const fontStack = this.selectedOptions[0].value;\n  document.body.style.fontFamily\
  \ = fontStack;\n});\n\n// 监听按钮点击事件\ndocument.querySelector('button').addEventListener('click',\
  \ () => {\n  // 将表单数据存储在 JavaScript 对象中\n  const userSettings = {\n    backgroundColor:\
  \ document.querySelector('#background-color').value,\n    textColor: document.querySelector('#text-color').value,\n\
  \    fontStack: document.querySelector('#font-stack').selectedOptions[0].value\n\
  \  }\n  // 将设置保存到本地存储中\n  localStorage.setItem('user-settings', JSON.stringify(userSettings));\n\
  });\n```\n\nHTML 设置了一个表单（查看图 11-2）来收集某些用户设置——背景颜色、文本颜色和字体样式——以及一个按钮。JavaScript 为两个选择器和选择列表设置了\
  \ `change` 事件处理器。最后，代码监听按钮上的 `click` 事件，处理器将表单数据存储在 JavaScript 对象中，然后将数据保存到本地存储（参见第\
  \ 4 卷第 9 章）。\n\n![收集页面用户设置的截图](img/9781394164684-fg041102.png)\n\n图 11-2： 用于收集页面用户设置的表单。\n\
  \n第 5 卷\n\n# 使用布局美化界面\n\n## 概览\n\n1.  第 1 章：探索布局基础\n    1.  掌握页面流\n    2.  浮动元素\n\
  \    3.  元素定位\n    4.  元素堆叠\n2.  第 2 章：玩转 Flexbox 高级\n    1.  引入 Flexbox\n    2.\
  \  既然有了 CSS Grid，我现在还需要 Flexbox 吗？\n    3.  设置和配置 Flex 容器\n    4.  控制 Flex 项目\n\
  3.  第 3 章：使用 CSS Grid 布局页面\n    1.  引入 CSS Grid\n    2.  设置网格容器\n    3.  指定网格行和列\n\
  \    4.  控制：分配网格项目\n    5.  让你的网格元素就齐（行或列）\n4.  第 4 章：创建响应式布局\n    1.  什么是响应式布局？\n\
  \    2.  顺应流程：流式布局\n    3.  通过查询实现响应：适应布局\n    4.  响应式处理图像\n    5.  探索移动优先开发原理\n\
  \n第 1 章\n\n# 探索布局基础\n\n本章内容\n\n![Bullet](img/check.png) **理解页面流**\n\n![Bullet](img/check.png)\
  \ **通过浮动元素脱离流**\n\n![Bullet](img/check.png) **在页面上定位元素**\n\n![Bullet](img/check.png)\
  \ **将元素堆叠在一起**\n\n*如果将链接颜色、布局、导航系统和视觉层级等基础背景视为“无聊”或“平庸”，就像是嘲笑汽车的方向盘缺乏想象力一样。*\n\n\
  —JEFFREY VEEN\n\n\n\n\n\n![Remember](img/remember.png) 这些规则假设当前语言文本是从左到右、从上到下阅读的（例如英语）。在某些语言（如希伯来语和阿拉伯语）中，默认的文本流是从右到左、从上到下的。在垂直语言中，默认文本流是从上到下，然后是从右到左（如日语和中文）或从左到右（如蒙古语）。\n\
  \n这被称为`页面流`（page flow）。例如，考虑以下 HTML 代码（参考本书示例文件中的 `bk05ch01/example01.html`）：\n\n\
  ```html\n<header>\n`The page header goes here.`\n`</header>`\n<nav>\n`The navigation\
  \ doodads go here.`\n`</nav>`\n<section>\n`This is the first section of the page.`\n\
  `</section>`\n<section>\n`This is—you got it—the second section of the page.`\n\
  `</section>`\n<aside>\n`This is the witty or oh-so-interesting aside.`\n`</aside>`\n\
  <footer>\n`The page footer goes here.`\n`</footer>`\n```\n\n这段代码包含六个块级元素——一个 `header`、一个\
  \ `nav`、两个 `section` 标签、一个 `aside` 和一个 `footer`——图 1-1 显示了网页浏览器如何将它们渲染为一叠盒子。\n\n\
  ![网页浏览器将块级元素渲染为一叠盒子的示意图。](img/9781394164684-fg050101.png)\n\n图 1-1: 网页浏览器将块级元素渲染为一叠盒子。\n\
  \n默认的页面流本身没有问题，但让你的网页渲染为一叠盒子确实缺乏某种美感。幸运的是，由于你的创意精神，你并不局限于默认的、一个接一个堆叠流。CSS 为你提供了许多实用的方法来打破正常的页面流，并为你的页面增添活力。在本章中，你将学习其中三种方法：浮动、定位和堆叠。\n\
  \n## 浮动元素 (Floating Elements)\n\n当你对元素进行`float`（浮动）时，网页浏览器会将该元素从默认页面流中取出。元素在页面上的位置取决于你是向左浮动还是向右浮：\n\
  \n* **左浮动 (Float left):** 浏览器将元素放置在其父容器内尽可能靠左且尽可能靠的位置。\n* **右浮动 (Float right):**\
  \ 浏览器将元素放置在其父容器内尽可能靠右且尽可能靠的位置。\n\n在这两种情况下，未浮动的元素都会环绕浮动元素流动。\n\n你通过添加 `float` 属性来让网页浏览器浮动元素：\n\
  \n```css\n`element` {\n`float: left|right|none;`\n}\n```\n\n例如，考虑以下代码（查看 `bk05ch01/example02.html`）及其在图\
  \ 1-2 中的渲染效果：\n\n```html\n<header>\n<img src=\"images/notw.png\" alt=\"News of the\
  \ Word logo\">\n<h1>News of the Word</h1>\n<h2>Language news you won't find anywhere\
  \ else (for good reason!)</h2>\n</header>\n<nav>\n<a href=\"#\">Home</a>\n<a href=\"\
  #\">What's New</a>\n<a href=\"#\">What's Old</a>\n<a href=\"#\">What's What</a>\n\
  <a href=\"#\">What's <em>That</em>?</a>\n</nav>\n```\n\n![截图：如既往常，浏览器将块级元素显示为一叠盒子。](img/9781394164684-fg050102.png)\n\
  \n图 1-2: 如既往一样，浏览器将块级元素显示为一叠盒子。\n\n在图 1-2 中，请注意网页浏览器正在使用它惯用的页面流技巧：将所有块级元素堆叠在一起。然而，我认为如果标题和副标题（`h1`\
  \ 和 `h2` 元素）出现在 Logo 的右侧，这个页面看起来会更好。为了实现这一点，我可以将 `img` 元素向左浮动（`bk05ch01/example03.html`）：\n\
  \n```css\nheader > img {\nfloat: left;\nmargin-right: 2em;\n}\n```\n\n图 1-3 显示了结果。随着\
  \ Logo 向左浮动，标题和副标题——`h1` 和 `h2` 元素——现在环绕（或者准确地说，在 `img` 元素的右侧）流动。\n\n![截图：当 Logo\
  \ 向左浮动时，标题和副标题环绕它。](img/9781394164684-fg050103.png)\n\n图 1-3: 当 Logo 向左浮动时，标题和副标题环绕它。\n\
  \n### 示例：创建侧边引用 (pull quote)\n\n`pull quote`（摘引用）是从当前页面文本中复制（“拉取”）的短摘录。摘录应该是引人入胜或有趣的，且侧边引用与正文隔开。选择良好且设计良好的侧边引用可以吸引犹豫不决的游客阅读（或至少开始）文章。\n\
  \n你通过复制文章摘录并将其放置在 `aside` 等元素内部来创建侧边引用。然后对该元素进行浮动，通常是向右浮。根据需要对元素进行样式处理使其与正文区分开，就完成了。\n\
  \n这是一个示例（`bk05ch01/example04.html`）：\n\nHTML（部分内容）：\n\n```html\n<p>\n\"None of it\
  \ made a lick of sense\" he said.\n</p>\n<aside class=\"pullquote\">\nThey can't\
  \ understand a word anyone is texting to them.\n</aside>\n<p>\nIt has long been\
  \ thought that teen instant messages contained abbreviations (such as <i>LOL</i>\
  \ for \"laughing out loud\" and <i>MAO</i> for \"my area\"), short forms (such as\
  \ W2UP for \"what's up\"), and slang. However, the report reveals that this so-called\
  \ teenspeak began to change so fast that kids could not keep up. Each teen developed\
  \ his own lingo, and the instant messaging devolved into anarchy.\n</p>\n```\n\n\
  CSS：\n\n```css\n.pullquote {\nborder-top: 4px double black;\nborder-bottom: 4px\
  \ double black;\nfloat: right;\ncolor: hsl(0deg, 0%, 40%);\nfont-size: 1.9rem;\n\
  font-style: italic;\nmargin: 0 0.75rem 0;\npadding: 8px 0 16px;\nwidth: 50%;\n}\n\
  ```\n\n图 1-4 显示了效果。\n\n### 清除浮动 (Clearing your floats)\n\n非浮元素的默认行为是环绕任何浮动内容，这通常是你想要的。然而，你有时并不希望某个元素环绕你的浮动元素。例如，考虑以下代码（`bk05ch01/example05.html`）以及它的渲染方式，如图\
  \ 1-5 所示：\n\n```html\n<header>\n<h1>Can't You Read the Sign?</h1>\n</header>\n<nav>\n\
  <a href=\"/\">Home</a>\n<a href=\"semantics.html\">Signs</a>\n<a href=\"contact.html\"\
  >Contact Us</a>\n<a href=\"about.html\">Suggest a Sign</a>\n</nav>\n<article>\n\
  <img src=\"/images/keep-off-grass.jpg\" alt=\"A sign reading Keep Off the Grass\
  \ beside a well-trodden path running across the grass.\">\n</article>\n<footer>\n\
  &copy; Can't You Read?, Inc.\n</footer>\n```\n\n![页脚环绕浮动图片的截图。](img/9781394164684-fg050105.png)\n\
  \n图 1-5: 当图片向左浮动时，页脚环绕它。\n\n由于 `img` 标签向左浮动，其余内容环绕它，包括 `footer`标签的内容现在出现在图片的顶部。\n\
  \n你希望页脚自然地出现在页面底部，那么如何修复这个问题呢？通过告诉网页浏览器定位 `footer` 元素，使其“清除”（clear）浮动的图片，这意味着它在页面流中出现在图片之后。你通过添加\
  \ `clear` 属性来清除元素：\n\n```css\n`element` {\nclear: left|right|both|none;\n}\n```\n\
  \n\n\n\n使用 `clear: left` 清除所有左浮动元素，使用 `clear: right` 清除所有右浮动元素，或使用 `clear: both`\
  \ 清除所有。当我向 `footer` 元素添加 `clear: left`（`bk05ch01/example06.html`）时，你可以从图 1-6 注意到页脚内容现在出现在页面底部。\n\
  \n```css\nfooter {\n  clear: left;\n}\n```\n\n![显示在 footer 元素上添加 clear: left 会导致页脚清除左浮动图像并出现在页面底部。](img/9781394164684-fg050106.png)\n\
  \n图 1-6: 在 `footer` 元素上添加 `clear: left` 会导致页脚清除左浮动图像并出现在页面底部。\n\n### 容器塌陷提前了！\n\n\
  CSS 的怪异行为似乎是无尽的，浮动又提供了一个例子。考虑以下 HTML（`bk05ch01/example07.html`）以及其在图 1-7 中的结果：\n\
  \n```html\n<article>\n  <section>\n    在很久很久以前……\n  </section>\n  <aside>\n    <b>注意：</b>通过……创建一个新词汇……\n\
  \  </aside>\n</article>\n```\n\n![显示一个包含 <section> 标签和 <aside> 标签的 <article> 标签，使用默认页面流渲染的截图。](img/9781394164684-fg050107.png)\n\
  \n图 1-7: 一个包含 `<section>` 标签和 `<aside>` 标签的 `<article>` 标签，使用默认页面流渲染。\n\n特别注意，我为\
  \ `article` 元素设置了边框。\n\n与其使用图 1-10 所示的堆叠块，你可能更喜欢让 `section` 和 `aside` 元素并排显示。好主意！所以你给它们添加了\
  \ `width` 属性，并将 `section` 元素向左浮动，将 `aside` 元素向右浮动。这里是规则（`bk05ch01/example08.html`），图\
  \ 1-8 显示了结果。\n\n```css\nsection {\n  float: left;\n  width: 25rem;\n}\naside {\n\
  \  float: right;\n  width: 16rem;\n}\n```\n\n![显示内容浮动，<article> 元素塌陷到仅剩边框。](img/9781394164684-fg050108.png)\n\
  \n图 1-8: 当内容浮动时，`<article>` 元素塌陷到仅剩边框。\n\n嗯，这太奇怪了！顶部的线条是 `article` 元素的剩余部分。发生了什么？因为我同时浮动了\
  \ `section` 和 `aside` 元素，浏览器将它们移出了页面流，这使得 `article` 元素就像完全没有内容一样。结果是？一种被称为*容器塌陷*的\
  \ CSS Bug。\n\n要修复这个问题，你必须强制父容器清除其子元素。\n\nHTML:\n```html\n<article class=\"self-clear\"\
  >\n```\n\nCSS:\n```css\n.self-clear::after {\n  content: \"\";\n  display: block;\n\
  \  clear: both;\n}\n```\n\n`::after` 伪元素告诉浏览器添加空字符串（因为你不想向页面添加任何实质内容），该字符串作为块显示，并使用\
  \ `clear: both` 清除容器。这很奇怪，但它是有效的，如图 1-9（`bk05ch01/example09.html`）所示。![显示在 <article>\
  \ 标签上添加 self-clear 类，article 元素现在清除其子元素且不再塌陷。](img/9781394164684-fg050109.png)\n\
  \n图 1-9: 在 `<article>` 标签上添加 `self-clear` 类，`article` 元素现在清除其子元素且不再塌陷。\n\n## 定位\n\
  \n打破浏览器“堆叠盒子”页面流的第二个主要方法是通过 CSS 属性定位元素。例如，你可以告诉浏览器将图像放在窗口的左上角，无论该 `<img>` 标签出现在\
  \ HTML 代码的什么位置。在 CSS 世界，这被称为*定位*，它是一个强大的工具，以至于大多数网页开发者很少使用。\n\n你需要了解第一个定位技巧是 `position`\
  \ 属性：\n\n```css\nelement {\n  position: static|relative|absolute|sticky;\n}\n```\n\
  \n- `static`: 将元素放在页面流中的默认位置。\n- `relative`: 在保持元素处于页面流的同时，相对于默认位置偏移。\n- `absolute`:\
  \ 相对于父元素（有时是更早的祖先元素）从默认位置偏移元素，同时将元素移出页面流。\n- `fixed`: 相对于浏览器窗口从默认位置偏移元素，同时将元素移出页面流。\n\
  - `sticky`: 元素以相对定位开始，直到相对于视口的指定偏移（通常是因为用户正在滚动页面），此时元素切换到固定定位。如果元素的父块滚动到元素所在的位置，元素将恢复相对定位并随父元素滚动。\n\
  \n由于 `static` 定位是浏览器的默认行为，我不再对其做说明。对于其他四个值——`relative`、`absolute`、`fixed` 和 `sticky`——注意每一个值都会偏移元素：\n\
  \n```css\nelement {\n  top: top-value;\n  right: right-value;\n  bottom: bottom-value;\n\
  \  left: left-value;\n}\n```\n\n- `top`: 将元素向下移动。\n- `right`: 从右侧偏移元素。\n- `bottom`:\
  \ 将元素向上移动。\n- `left`: 从左侧偏移元素。\n\n在每情况下，你提供的值都是数字加上 CSS 单位（如 `px`、`em`、`rem`、`vw`、`vh`）或百分比。\n\
  \n### 使用相对定位\n\n相对定位有点奇怪，因为它不仅相对于父元素偏移元素，而且保持了元素在页面流中的空间完整。\n\n这是一个示例（`bk05ch01/example10.html`）：\n\
  \nHTML:\n```html\n<h1>holloway</h1>\n<div><i>n.</i> 一条下陷的小径或道路；一条两侧有高土堤的路径。</div>\n\
  <img src=\"/images/holloway1.jpg\" alt=\"holloway\">\n<img src=\"/images/holloway2.jpg\"\
  \ alt=\"holloway\" class=\"offset-image\">\n<img src=\"/images/holloway3.jpg\" alt=\"\
  holloway\">\n```\n\nCSS:\n```css\n.offset-image {\n  position: relative;\n  left:\
  \ 200px;\n}\n```\n\nCSS 为名为 `offset-image` 的类定义了一个规则，它应用相对定位并将元素向左偏移 `200px`。在 HTML\
  \ 中，`offset-image` 类应用于中间的图像。如图 1-10 所示，不仅中间图像向左偏移了，而且它在页面流中默认出现的空间仍然保持完整，因此第三张图像在页面流中的位置没有改变。对于第三张图像来说，中间图像仍然在它的上方。\n\
  \n![显示中间图像使用相对定位从左偏移，但其在页面流中的位置保持完整。](img/9781394164684-fg050110.png)\n\n图 1-10:\
  \ 中间图像使用相对定位从左偏移，但其在页面流中的位置保持完整。\n\n### 尝试绝对定位\n\n*绝对定位*不仅将元素从默认位置偏移，还将元素移出页面流。听起来很有用，但如果元素不再是页面流的一部分，它是相对于哪个元素偏移的呢？这是一个好问题，简单的答案是：使用非静态定位的最近祖先元素。\n\
  \n\n\n\n如果这让你感到困惑，我有一个更详尽的答案可以提供帮助。要确定使用哪个祖先元素作为绝对定位元素的偏移依据，浏览器会执行类似下面的过程：\n\n1.\
  \  在页面层级结构向上移动一级，到达上一个祖先元素。\n2.  检查该祖先元素的 `position` 属性。\n3.  如果祖先元素的 `position`\
  \ 值为 `static`，则返回步骤 1，并对层级结构的下一层重复该过程；否则（即如果父元素的 `position` 值任何非 `static`），则相对于该祖先对原始元素进行偏移。\n\
  4.  如果在反复执行步骤 1 到步骤 3 后，你到达了页面层级结构的顶端——即 `html` 元素——则使用 `html` 元素对元素进行偏移，这意味着在实践中，该元素是相对于浏览器视口进行偏移的。\n\
  \n我在上一节中提到，相对定位很奇怪，因为它保持了元素在页面流中的默认位置不变。然而，现在这种奇怪之处变成了优点，因为如果你想让子元素使用绝对定位，只需在父元素的样式规则中添加\
  \ `position: relative`。因为你没有为父元素提供偏移量，它会留在页面流中，但现在你为子元素拥有了 CSS 痴迷者所说的 `positioning\
  \ context`（定位上下文）。\n\n我想现在正需要一个示例（`bk05ch01/example11.html`）：\n\nHTML:\n```html\n\
  <section>\n  <img src=\"images/new.png\" alt=\"\">\n  <h1>holloway</h1>\n  <div>\n\
  \    <i>n.</i> 一种凹陷的小径或道路；一种两侧被高土堤包围的路径。\n  </div>\n  <div>\n    创建凹槽小路（holloways）有两种主要方法：通过多年（几十年、几个世纪）持续的人流量磨损路径（这一过程通常会被水侵蚀略微加速）；或者在两个房产之间挖掘一条路径并在两侧堆积土壤。\n\
  \  </div>\n</section>\n```\n\nCSS:\n```css\nsection {\n  position: relative;\n \
  \ border: 1px double black;\n}\nimg {\n  position: absolute;\n  top: 0;\n  right:\
  \ 0;\n}\n```\n\n在 CSS 中，`section` 元素使用 `position: relative` 进行了样式设置，而 `img` 元素使用\
  \ `position: absolute` 设置，并将 `top` 和 `right` 偏移量设置为 `0`。在 HTML 中，注意 `<section>`\
  \ 标签是 `<img>` 标签的父元素，因此后者的绝对定位将相对于前者。由于 `top` 和 `right` 偏移量设置为 `0`，图像现在将出现在 `section`\
  \ 元素的右上角，事实确实如此，如图 1-11 所示。\n\n![Warning](img/warning.png) 由于绝对定位的元素现在位于正常页面流之外，该元素不再遵守“任何两个元素都不应重叠”的默认“规则”。因此，在对元素进行绝对定位时需要小心，确保它不会意外地出现在你的页面文本或其他元素之上。\n\
  \n![Screenshot of the img element uses absolute positioning to send it to the top-right\
  \ corner of the section element.](img/9781394164684-fg050111.png)\n\nFIGURE 1-11:\
  \ `img` 元素使用绝对定位将其发送到 `section` 元素的右上角。\n\n### 尝试固定定位\n\n使用 `fixed positioning`（固定定位），元素会被移出正常页面流，然后相对于浏览器视口进行偏移，这意味着当你滚动页面时，元素不会移动，即使是一点也不移动（即元素被“固定”在了它的新位置）。\n\
  \n固定定位最常用的用途之一是在页面顶部放置一个页眉，并让它在用户滚动其余内容时停留在那里。这里有一个示例（`bk05ch01/exmple12.html`）向你展示：\n\
  \nHTML:\n```html\n<header>\n  <img src=\"images/holloway.jpg\" alt=\"Photo of a\
  \ holloway\">\n  <h1>holloway</h1>\n</header>\n<main>\n  ...\n</main>\n```\n\nCSS:\n\
  ```css\nheader {\n  position: fixed;\n  top: 0;\n  left: 0;\n  width: 100%;\n  background-color:\
  \ rgba(255, 255, 255, 0.9);\n  z-index: 1000;\n}\n```\n\n在 CSS 中，`header` 元素使用 `position:\
  \ fixed` 设置样式。为了指定元素固定的阈值，我设置了 `top: 0`，这意味着该元素将固定在浏览器窗口顶部。\n\n### 让元素粘住\n\n`Sticky\
  \ positioning`（粘性定位）是相对和固定定位的一种结合。也就是说，元素从相对开始，直到它的包含块跨越指定的阈值，此时它会切换到固定。\n\n例如，假设你的页面有一个\
  \ `section`，在那个 `section` 内部有一个 `h2`，你将其定位为粘性：\n\n```html\n<section>\n  <h2>Cat\
  \ ipsum</h2>\n  <p><a href=\"http://www.catipsum.com/\">http://www.catipsum.com/</a></p>\n\
  \  <p class=\"sample-text\">Cat ipsum sit amet, prance along the garden, annoy the\
  \ neighbor's dog and make me sleep everywhere, but not in my bed 那些美元凉鞋？</p>\n</section>\n\
  ```\n\n```css\nh2 {\n  position: sticky;\n  top: 0;\n}\n```\n\n在 CSS 中，注意 `h2` 元素使用了\
  \ `position: sticky`。为了指定元素固定的阈值，我设置了 `top: 0`，这意味着当 `section` 元素的顶部碰到视口顶部时，它将固定。\n\
  \n当用户开始向下滚动页面时，会发生这种情况：\n\n1.  起初`section` 和 `h2` 元素一起滚动，如图 1-13 所示。注意我为 `section`\
  \ 元素添加了轮廓，以便你可视化其边缘。\n2.  当 `section` 元素的顶部碰到视口顶部时（因为我设置了 `top: 0` 为粘性阈值），`h2` 停止滚动并“固定”在原地，如图\
  \ 1-14 所示。\n3.  随着用户继续滚动，`section` 内容继续向上滚动，如图 1-15 所示。\n4.  当 `section` 元素的底部到达固定的\
  \ `h2` 元素的底部时，`h2` 变得“不再固定”（即它变回相对定位），并与 `section` 一起向上滚动，如图 1-16 所示。\n\n![Screenshot\
  \ of at first, the section and h2 elements scroll up together.](img/9781394164684-fg050113.png)\n\
  \n\n\n\n\n图 1-13: 起初，`section` 和 `h2` 元素一起向上滚动。\n\n![Screenshot of the top of the\
  \ section element hits the top of the viewport, the h2 “sticks” in place.](img/9781394164684-fg050114.png)\n\
  \n图 1-14: 当 `section` 元素的顶部到达视口顶部时，`h2` 会“固定”在位置。\n\n![Screenshot of keep scrolling,\
  \ the section content keeps scrolling up.](img/9781394164684-fg050115.png)\n\n图\
  \ 1-15: 当你继续滚动时，`section` 内容会继续向上滚动。\n\n![Screenshot of when the section bottom\
  \ reaches the stuck h2 element, the h2 becomes “unstuck.”](img/9781394164684-fg050116.png)\n\
  \n图 1-16: 当 `section` 底部到达固定的 `h2` 元素时，`h2` 会“取消固定”。\n\n## 元素堆叠 (Stacking Elements)\n\
  \n当你使用 `position: fixed` 或 `position: sticky` 定位元素（正如我在上一节中描述的那样），会发生一件奇怪：当你滚动过固定或粘元素时，随后的文本和其他页面杂物会滑到该元素的*下方*。\n\
  \n同样，如果你使用 `position: relative` 或 `position: absolute` 定位元素，可能会通过操作 `top`、`right`、`bottom`\
  \ 和 `left` 属性将元素放置在页面上，使其位于某些其他元素的*上方*。\n\n浏览器是如何知道哪些元素位于其他元素之上的？浏览器使用以下默认层级结构：\n\
  \n1. `html` 元素的背景和边框渲染在最底层。\n2. 所有非定位元素（即 `position` 属性为 `static` 的元素）被放置在下一层。\n\
  3. 所有定位元素（即 `position` 值为 `relative`、`absolute`、`fixed` 或 `sticky` 的元素）按照它们在 HTML\
  \ 中出现的顺序放置在后续层中。\n\n这些层代表了浏览器的默认设置，但 CSS 提供了一种按照*你*想要的方式对内容分层的方法，这是下一节的主题。\n\n###\
  \ 使用 z-index 进行元素分层\n\n如果你回想起高中几何（如果这让你感到很痛苦，请向我道歉），你会想起二维笛卡尔坐标面的概念，其中 x 轴代表水平值，y\
  \ 轴代表垂直值。你可能还遇到过三维版本，它增加了一个垂直于平面的 z 轴，代表相对于你（观察者）更近（正值）或更远（负值）的点。\n\n这种让点离你近或远的想法可以应用于浏览器的层级：页面背景最远，非定位元素层更近，而定位元素层又是另一个更近的层。\n\
  \nCSS 允许你通过设置一个堆栈来覆盖浏览器的默认层级，使得较高堆栈层级元素元素渲染在较低层级元素之上。你通过在定位元素上设置 `z-index` 属性来指定元素的堆栈层级（`z-index`\
  \ 对非定位元素无效）：`z-index: value`\n\n* `value`: 一个指定堆栈层级的整数。`0`（或 `auto`）是默认值。具有较大 `z-index`\
  \ 值的定位元素渲染在定位元素上方。\n\n具有较大 `z-index` 值的定位元素渲染在具有较小 `z-index` 值的定位元素上方。负值也是允许的。这里有一个\
  \ `bk0501.html` 的示例：\n\nHTML：\n```html\n<body>\n  <div id=\"div1\">\n    <span>1</span>\n\
  \  </div>\n  <div id=\"div2\">\n    <span>2</span>\n  </div>\n</body>\n```\n\nCSS：\n\
  ```css\n#div1 {\n  position: relative;\n  z-index: 2;\n}\n#div2 {\n  position: relative;\n\
  \  bottom: 100px;\n  left: 100px;\n  z-index: 1;\n}\n```\n\n在 HTML 中创建了 `div1` 和\
  \ `div2` 两个元素。由于 `div2` 处在 `div1` 之后，默认情况下 `div2` 应该位于 `div1` 之上。然而，我们为 `div1` 设置了\
  \ `z-index: 2`，它比 `div2` 的 `z-index` 高，因此 `div1` 现在位于 `div2` 之上，正如图 1-17 所示。\n\n\
  ![Screenshot of the element div1 on top of div2 because its z-index is higher.](img/9781394164684-fg050117.png)\n\
  \n图 1-17: `div1` 现在位于 `div2` 之上，因为其 `z-index` 值较高。\n\n### 理解堆叠上下文 (Getting your\
  \ head around stacking contexts)\n\n`z-index` 值较大的元素位于 `z-index` 值较小的元素之上的这个想法似乎很直观。啊，但这里有坑！为了了解\
  \ `z-index` 如何变得复杂，请看 `bk0501.html`：\n\nHTML：\n```html\n<body>\n  <div id=\"div1\"\
  >\n    <span>1</span>\n  </div>\n  <div id=\"div2\">\n    <span>2</span>\n    <aside>\n\
  \      <span>aside</span>\n    </aside>\n  </div>\n</body>\n```\n\nCSS：\n```css\n\
  #div1 {\n  position: relative;\n  z-index: 2;\n}\n#div2 {\n  position: relative;\n\
  \  bottom: 100px;\n  left: 100px;\n  z-index: 1;\n}\naside {\n  position: relative;\n\
  \  top: 25px;\n  left: 80px;\n  z-index: 3;\n}\n```\n\n这段代码与上一节相同，但有点不同：\n* HTML\
  \ 在第二个 `div` 中添加了一个 `aside` 子元素。\n* CSS 将 `aside` 相对定位，添加了偏移量，并将 `z-index` 设置为 `3`。\n\
  \n`aside` 现在拥有三个元素中最大的 `z-index` 值，所以你会认为 `aside` 会渲染在最上方。图 1-18 显示了实际情况。\n\n![Screenshot\
  \ of the new aside element appears behind the div1 despite having a higher z-index\
  \ value (3)](img/9781394164684-fg050118.png)\n\n图 1-18: 新的 `aside` 元素位于 `div1` 之后，尽管其\
  \ `z-index` 值较高（3）。\n\n等等，什么？要理解发生这种情况，你需要快速熟悉“堆叠上下文”（stacking context）这一概念，它是父元素元素可以相互堆叠的能力。\n\
  \n默认堆叠上下文由 `html` 元素创建，在这个堆叠上下文中，适用以下规则：\n* 非定位元素渲染在堆叠顺序的底部。\n* 定位元素根据它们在 HTML 中出现的顺序，渲染在非定位元素之上。\n\
  * 定位元素可以使用 `z-index` 在堆叠顺序中向上或向下移动。\n\n\n\n\n在页面的整体层级顺序中，任何创建叠加上下文（stacking context）的元素的定位子元素或后代元素，其层级永远高于该元素的层级。\n\
  \n再次查看代码，但这次带着全新的视角：\n\nHTML:\n```html\n<body>\n  <div id=\"div1\">\n    <span>div1</span>\n\
  \  </div>\n  <div id=\"div2\">\n    <span>div2</span>\n    <aside>\n      <span>aside</span>\n\
  \    </aside>\n  </div>\n</body>\n```\n\nCSS:\n```css\n#div1 {\n  position: relative;\n\
  \  z-index: 2;\n}\n#div2 {\n  position: relative;\n  bottom: 100px;\n  left: 100px;\n\
  \  z-index: 1;\n}\naside {\n  position: relative;\n  top: 25px;\n  left: 80px;\n\
  \  z-index: 3;\n}\n```\n\n`div2` 元素使用了 `position: relative` 和 `z-index: 1`，因此它创建了一个叠加上下文。`aside`\
  \ 元素是 `div2` 元素的子元素，所以它的 `z-index: 3` 仅在 `div2` 内部有效。由于 `div2` 被声明为 `z-index: 1`，`aside`\
  \ 在整个页面的层级顺序中永远无法高于这个值。这就是为什么 `aside` 出现在图 1-18 中 `div1` 元素之后。\n\n# 第 2 章\n\n# 玩转\
  \ Flexbox\n\n## 本章内容\n\n* **认识 Flexbox**\n* **设置你的 flex 容器**\n* **对齐 flex 项目**\n\
  * **使用 Flexbox 实现居中布局**\n* **让 flex 项目听你差遣**\n\n*Flexbox 是第一种适用于现代网页的 CSS 布局技术。*\n\
  —PADDI MACDONNELL\n\n网页设计极客使用“脆性（brittle）”一词来描述任何过于复杂且过度设计的页面布局系统，这种系统只在非常受限的条件下运行，一旦这些条件发生即使是微小的变化，它就会崩溃。相反的设计哲学可以描述为“刚性（rigid）”页面布局，其中所有代码的编写方式使得无论你向页面投入什么设备、屏幕或其他变量，一切都不可能发生变化。\n\
  \n脆性和刚性页面布局设计共同缺乏的是简单而优美的“灵活性（flexibility）”特质。刚性布局完全没有灵活性，而脆性布局只要引入一点点灵活性就会分崩离析。网页设计极客当然知道，并渴望一种技术能够让他们创建出处理各种环境而不会引起麻烦的灵活布局。\n\
  \n这项技术几年前以 Flexbox 的形式出现了，它最初受限于浏览器支持的糟糕和冲突。然而，如今 Flexbox 已经是一项成熟的技术，拥有近乎通用的浏览器支持。这是一个极好的消息，因为\
  \ Flexbox 是任何人页面布局工具箱的绝佳补充。在本章中，你将探索 Flexbox 提供的所有功能，并学习如何将 Flexbox 整合到你的整体页面布局规划中。\n\
  \n##介绍 Flexbox\n\n多年来，大多数 CSS 专家的首选布局技术要么是浮动元素（floating），要么是内联块（即将块元素的 `display`\
  \ 属性设置为 `inline-block`，以便元素在布局上表现得内联元素）。这两种技术在路径上都布满了许多“香蕉皮”，绊住了许多开发者，包括忘记清除浮动导致容器塌陷（请查看第\
  \ 5 卷 第 1 章 了解更多关于这些陷阱的内容）。\n\n然而，除了这些小麻烦之外，基于浮动或内联块的布局在处理一些更重要的事情时存在困难，导致很难实现实现：\n\
  \n*   让元素的内容在元素容器内垂直居中\n*   让元素在父容器的整个宽度内（或整个高度内）实现水平均匀间距\n*   让页脚元素出现在浏览器内容区域的底部\n\
  \n幸运的是，如果你使用名为“弹性盒布局模块”（Flexible Box Layout Module，简称 `Flexbox`）的 CSS 技术，这些问题就会消失。这里的关键在于名称中的“flex（弹性）”部分。与使用浮动和内联块的默认页面流和布局（它们都使用刚性块渲染内容）不同，Flexbox\
  \ 使用可以伸缩的容器——我这里同时指的是宽度和高度——来响应内容的变化或浏览器窗口大小的变化。但 Flexbox 还提供了强大的属性，使其在布局、对齐、分布和调整父容器子元素的大小变得轻而易举。\n\
  \n我很快就会介绍 Flexbox 的细节，但首先我需要回答这今年最常见的页面布局问题。\n\n## CSS Grid 已经出现了，我还需要 Flexbox 吗？\n\
  \nCSS Grid 是一种新的页面布局工具，你将在第 5 卷 第 3 章 中深入学习，但目前可以说它可以将你的页面变为网格，让你对网格内元素的水平和垂直位置进行精确控制。CSS\
  \ Grid 比 Flexbox 新得多，但它已经拥有与 Flexbox 几乎相同的浏览器支持。所以，如果 Grid 那么好，为什么要费劲学习 Flexbox\
  \ 呢？\n\n答案是，从某种意义上说，这种比较并不完全对。是的，Flexbox 和 Grid 都是布局工具，但它们关注的重点不同：\n\n*   Flexbox\
  \ 擅长处理你希望在*一个*方向上布局的页面元素：即*要么*水平*要么*垂直。\n*   Grid 擅长处理你希望在*两个*方向上布局的页面元素：即*同时*水平*和*垂直。\n\
  \n在大多数非简单的网页中，这两个方面可以轻松共存。例如，如果你有一个 `nav` 元素，其中包含你想要横跨页面布局的链接列表，那么 Flexbox 是完美选择。在同一页页面上，你可能还有复杂但规律的文本和图像交织。Grid\
  \ 可能是布局这种布局的完美工具。\n\n所以，令人的是，Flexbox 与 Grid 的问题并不是二选一。你既可以使用 Flex 也可以 Grid。\n\n\
  ## 设置和配置 Flex 容器\n\n要开始使用 Flexbox，你一开始就要知道 Flexbox 将世界分为两类：\n\n*   Flex 容器（Flex\
  \ container）：这是一个作为内部弹性元素父元素的块级元素。\n*   Flex 项目（Flex items）：这些位于 flex 容器内部的子元素。\n\
  \n我将在本章后面详细介绍 Flex 项目（请查看“控制 Flex 项目”）。现在，接下来的章节将为你介绍 Flex 容器。\n\n### 设置 flex 容器\n\
  \n要将一个元素标记为 flex 容器，请将其 `display` 属性设置为 `flex`：\n\n```css\nelement {\n  display:\
  \ flex;\n}\n```\n\n只需这一个声明，该元素的子元素自动变成了 flex 项目，就如此。太棒了！\n\n### 游览 flex 容器景观\n\n\
  Flexbox 令人困惑的地方之一在于它对 flex 容器的方向和维度区分。我的意思是：\n\n*   方向（Direction）：flex 容器是*单向的*，因为\
  \ flex 项目在它们的 flex 容器内仅以水平（即行）或垂直（即列）的方式流动。\n*   维度（Dimensionality）：flex 容器是*二维的*，因为作为一个块元素，它定义了两个垂直的轴。首先，flex\
  \ 容器的流方向沿着*主轴*（也称为轴轴）运行。因此，如果流方向是水平的，主轴也是水平的。其次，与主轴垂直的轴被称为*次轴*（也称为交叉轴 axis）。因此，如果流方向是水平的，次轴将是垂直的。\n\
  \n\n\n\n\n同时拥有主轴（primary axis）和次轴（secondary axis）意味着你可以对 flex 容器中元素的排列进行细粒度的控制。我稍会介绍这一点，但首先你需要选择一个\
  \ flex 方向（flex direction）。\n\n### 设置 flex 方向\n\n在创建好 flex 容器之后，Flexbox 任务列表的下一步是决定你想让\
  \ flex 项目在容器内的流向方向。你使用 `flex-direction` 来指定该方向：\n\n```css\nelement {\n  display:\
  \ flex;\n  flex-direction: row|row-reverse|column|column-reverse;\n}\n```\n\n* `row`：主轴为水平方向，flex\
  \ 项目从左到右排列。这是默认值。\n* `row-reverse`：主轴为水平方向，flex 项目从右到左排列。\n* `column`：主轴为垂直方向，flex\
  \ 项目从上到下排列。\n* `column-reverse`：主轴为垂直方向，flex 项目从下上排列。\n\n下面是一个示例。首先是一些 HTML 和 CSS\
  \ 代码（查看 `bk05ch02/example01.html`），并且图 2-1 展示了如果你让浏览器进行布局，它的外观：\n\nHTML:\n```html\n\
  <div class=\"container\">\n  <div class=\"item item1\">1</div>\n  <div class=\"\
  item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div class=\"item item4\"\
  >4</div>\n  <div class=\"item item5\">5</div>\n</div>\n```\n\nCSS:\n```css\n.container\
  \ {\n  border: 5px double black;\n}\n.item {\n  font-family: Verdana, sans-serif;\n\
  \  font-size: 5rem;\n  padding: .1rem;\n  text-align: center;\n}\n.item1 {\n  background-color:\
  \ hsl(0, 0%, 94%);\n}\n.item2 {\n  background-color: hsl(0, 0%, 88%);\n}\n.item3\
  \ {\n  background-color: hsl(0, 0%, 82%);\n}\n.item4 {\n  background-color: hsl(0,\
  \ 0%, 76%);\n}\n.item5 {\n  background-color: hsl(0, 0%, 70%);\n}\n```\n\n![让浏览器布局元素，你获得默认的块堆叠截图](img/9781394164684-fg050201.png)\n\
  \n图 2-1： 让浏览器布局元素，你会得到默认的块堆叠。\n\n浏览器执行其默认操作，将 `div` 块堆叠在一起，并让每个块占据其父 `div`（带有 `container`\
  \ 类的那个）的完整宽度，在图 2-1 中，它的边界由双边框标记。\n\n现在将父级 `div`——同样是带有 `container` 类的那个——配置为具有水平主轴的\
  \ flex 容器（查看 `bk05ch02/example02.html`）：\n\n```css\n.container {\n  display: flex;\n\
  \  flex-direction: row;\n  border: 5px double black;\n}\n```\n\n这会自动将子级 `div` 元素——带有\
  \ `item` 类的那些——配置为 flex 项目。如图 2-2 所示，flex 项目现在水平对齐，并仅占据内容所需的水平空间。\n\n![显示父容器作为 flex\
  \ 容器，子元素成为 flex 项目的截图](img/9781394164684-fg050202.png)\n\n图 2-2： 父容器作为 flex 容器，子元素成为\
  \ flex 项目。\n\n### 沿主轴对齐 flex 项目\n\n注意图 2-2，flex 项目聚集在容器的左侧。这是沿主轴的默认对齐方式，但你可以通过修改\
  \ `justify-content` 属性的值来改变这种对齐方式：\n\n```css\ncontainer {\n  display: flex;\n  justify-content:\
  \ flex-start|flex-end|center|space-around|space-evenly;\n}\n```\n\n* `flex-start`：将所有\
  \ flex 项目与 flex 容器的起点对齐（当 `flex-direction` 为 `row` 时指左侧，为 `row-reverse` 时指右侧，为 `column`\
  \ 时指顶部，为 `column-reverse` 时指底部）。该值是默认值，如果你需要的对齐方式是 `flex-start`，可以省略 `justify-content`\
  \ 属性。\n* `flex-end`：将所有 flex 项目与 flex 容器的终点对齐（当 `flex-direction` 为 `row` 时指右侧，为\
  \ `row-reverse` 时左左侧，为 `column` 时指底部，为 `column-reverse` 时顶部）。\n* `center`：将所有 flex\
  \ 项目与 flex 容器的中间对齐。\n* `space-around`：在每个 flex 项目的前后分配等距离的空间，空间量的计算方式是为了让 flex 项目沿主轴均匀分布。实际上，分布并不完全均匀，因为内部的\
  \ flex 项目（图 2-3 中的 2、3 和 4）它们之间有两个单位的空间，而起始和结束的 flex 项目（图 2-3 中的 1 和 5）外部只有一个单位的空间（即项目左侧和\
  \ 5 右侧）。\n* `space-between`：将第一个 flex 项目放在容器的起点，最后一个 flex 项目放在终点，然后在剩余的 flex 项目之间均匀分布。\n\
  * `space-evenly`：在每个 flex 项目的前后分配等距离的空间，空间量的计算是为了沿主轴均匀分布。与 `space-around` 不同，这次的间距真的是均匀的！\n\
  \n图 2-3（查看 `bk05ch02/example03.html`）演示了当 `flex-direction` 属性设置为 `row` 时，`justify-content`\
  \ 属性的所有可能值。\n\n![当主轴为水平（flex-direction: row）时，justify-content 值如何对齐 flex 项目的截图](img/9781394164684-fg050203.png)\n\
  \n图 2-3： 当主轴为水平（flex-direction: row）时，justify-content 值如何对齐 flex 项目。\n\n### 沿次轴对齐\
  \ flex 项目\n\n除了沿主轴对齐 flex 项目外，你还可以沿次轴对齐它们。例如，如果你将 `flex-direction` 设置为 `row`，这提供了水平主轴，那么次轴就是垂直的，这意味着你也可以垂直对齐\
  \ flex 项目。\n\n这很奇怪（我听到你这么想），当我检查图 2-3 中的示例时，似乎没有任何垂直空间可以进行操作，更不用说对齐 flex 项目了。\n\n\
  确实！默认情况下，flex 项目始终占据 flex 容器的高度，如果你没有指定高度（如我在图 2-3 所示的示例中没有做的那样），Flexbox 只会让容器足够高以容纳最高的内容。\n\
  \n当你为具有垂直次轴的 flex 容器设置高度（或为具有水平次轴的 flex 容器设置宽度）时，可以通过更改 `align-items` 属性的值获得不同的次轴对齐：\n\
  \n```css\ncontainer {\n  display: flex;\n  align-items: stretch|flex-start|flex-end|center|baseline;\n\
  }\n```\n\n* `stretch`：在次轴方向上扩展每个 flex 项目，直到填充整个 flex 容器的高度（如果次轴是垂直的）或宽度（如果次轴是水平的）。这种对齐是默认的，如果你需要的对齐方式是\
  \ `stretch`，可以省略 `align-items` 属性。\n* `flex-start`：将所有 flex 项目与 flex 容器次轴的起点对齐（当\
  \ `flex-direction` 为 `row` 或 `row-reverse` 时顶部，为 `column` 或 `column-reverse` 时指左侧）。\n\
  * `flex-end`：将所有 flex 项目与 flex 容器次轴的终点对齐（当 `flex-direction` 为 `row` 或 `row-reverse`\
  \ 时底部，为 `column` 或 `column-reverse` 时右侧）。\n\n\n\n\n\n* `center`: 将所有 flex 项目在 flex\
  \ 容器次要轴的中间对齐。\n* `baseline`: 沿项目文本的底部边缘对齐 flex 项目。（从技术上讲，对于一行文本，`baseline` 是一条让\
  \ `o` 和 `x` 等小写字母看起来坐在其上的隐线。）如果 flex 项目包含多行文本，则 flex 项目将根据每个项目第一行的基线进行对齐。\n\n图 2-4（查看\
  \ `bk05ch02/example04.html` 示例文）展示了当次要轴为垂直方向时，`align-items` 属性的所有可能值（即在这种情况下，`flex-direction`\
  \ 属性设置为 `row`），并且每个 flex 容器都被赋予了 `30vh` 的高度（每个容器的边缘都设置了双边框）。为了使 `baseline` 示例有用，我为每个\
  \ flex 项目添加了随机数量的顶部和底部内边距。\n\n![当次要轴为垂直方向时，align-items 值如何对齐 flex 项目的截图。](img/9781394164684-fg050204.png)\n\
  \n图 2-4： 当次要轴为垂直方向时，`align-items` 值如何对齐 flex 项目。\n\n![提示](img/tip.png) 如果你想为单个 flex\
  \ 项目设置次要轴对齐，可以使用 `align-self` 属性，它接受与 `align-items` 相同的值，但仅适用于指定的 flex 项目：\n\n`item`\
  \ `{`\n```css\nalign-self: stretch|flex-start|flex-end|center|baseline;\n}\n```\n\
  \n### 水平和垂直居中元素\n\n在 CSS 的早期，要在父元素内同时水平和垂直居中一个元素是众所周知难题。样式大师们经常熬夜想出实现这一成就的方法。他们成功了，但这些技术晦涩且复杂。随后\
  \ Flexbox 的出现改变了一切，让让某个东西直接放在页面正中间变得几乎荒谬地简单：\n\n`container` `{`\n```css\ndisplay:\
  \ flex;\njustify-content: center;\nalign-items: center;\n}\n```\n\n是的，就是这么简单。这里有一个示例（查看\
  \ `bk05ch02/example05.html`）：\n\nHTML:\n```html\n<div class=\"container\">\n  <div\
  \ class=\"item\">看，妈妈，我居中了！</div>\n</div>\n```\n\nCSS:\n```css\n.container {\n \
  \ border: 5px double black;\n  display: flex;\n  justify-content: center;\n  align-items:\
  \ center;\n  height: 50vh;\n}\n.item {\n  font-family: Georgia, serif;\n  font-size:\
  \ 2rem;\n}\n```\n\n如 图 2-5 所示，flex 项目正好位于其 flex 容器的正中央。\n\n![居中一个项目的截图，将容器的 justify-content\
  \ 和 align-items 属性设置为 center。](img/9781394164684-fg050205.png)\n\n图 2-5： 要居中一个项目，将容器的\
  \ `justify-content` 和 `align-items` 属性设置为 `center`。\n\n### 允许 flex 项目换行\n\n默认情况下，flex\
  \ 容器要么是单行（如果你将 `flex-direction` 设置为 `row` 或 `row-reverse`），要么是单列（如果你将 `flex-direction`\
  \ 设置为 `column` 或 `column-reverse`）。如果 flex 项目太大无法放入容器的行或列中，Flexbox 会沿主轴缩小 flex 项目，恰好让它们适应。如果由于某种原因，Flexbox\
  \ 无法足够缩小一个或多个项目以使其适应（例如，某个项目可能有一个 `min-width` 值，或者其内容可能强制了最小宽度），项目将沿主轴溢出。\n\n让 Flexbox\
  \ 缩小 flex 项目可能会导致宽度过窄或我提到的溢出场景等问题。与其让 Flexbox 缩小项目以适应，不如请求浏览器将容器的项目换行到多行（如果主轴是水平方向）或多列（如果主轴是垂直方向）。通过使用容器的\
  \ `flex-wrap` 属性启用换行：\n\n`element` `{`\n```css\ndisplay: flex;\nflex-wrap: nowrap|wrap|wrap-reverse;\n\
  }\n```\n\n* `nowrap`: 不换行容器的项目。这是默认行为。\n* `wrap`: 根据需要将项目换行到多行（如果主轴是水平方向）或多列（如果主轴是垂直方向）。\n\
  * `wrap-reverse`: 从次要轴的末尾开始换行。\n\n这里有一个示例（查看 `bk05ch02/example06.html`）：\n\nHTML:\n\
  ```html\n<div class=\"container\">\n  <div class=\"item item1\">1</div>\n  <div\
  \ class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div class=\"\
  item item4\">4</div>\n  <div class=\"item item5\">5</div>\n</div>\n<div><code>wrap</code></div>\n\
  <div class=\"container wrap\">\n  <div class=\"item item1\">1</div>\n  <div class=\"\
  item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div class=\"item item4\"\
  >4</div>\n  <div class=\"item item5\">5</div>\n</div>\n<div><code>wrap-reverse</code></div>\n\
  <div class=\"container wrap-reverse\">\n  <div class=\"item item1\">1</div>\n  <div\
  \ class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div class=\"\
  item item4\">4</div>\n  <div class=\"item item5\">5</div>\n</div>\n```\n\nCSS:\n\
  ```css\n.container {\n  border: 5px double black;\n  display: flex;\n  flex-direction:\
  \ row;\n  align-items: flex-start;\n  height: 40vh;\n  width: 85vw;\n}\n.wrap {\n\
  \  flex-wrap: wrap;\n}\n.wrap-reverse {\n  flex-wrap: wrap-reverse;\n}\n.item {\n\
  \  height: 50%;\n  width: 25vw;\n}\n```\n\nflex 容器（`container` 类）设置了高度和宽度。我还使用 `wrap`\
  \ 和 `wrap-reverse` 类来应用相应的 `flex-wrap` 值。图 2-6 显示了结果。\n\n![三种 flex-wrap 值的截图。](img/9781394164684-fg050206)\n\
  \n### 沿次要轴对齐行或列\n\n当 flex 容器内有多或列后，你需要决定如何在次要轴上对齐这些行或列。这类似于使用 `justify-content`\
  \ 属性沿主轴对齐单个项目，只不过现在处理的是整行或列。\n\n要在次要轴上对齐整行或列，请使用容器的 `align-content` 属性：\n\n`element`\
  \ `{`\n```css\ndisplay: flex;\nalign-content: stretch|center|flex-start|flex-end|space-around|space-between|space-evenly;\n\
  }\n```\n\n* `stretch`: 沿次要轴扩展行或列以填充容器的高度或宽度。这是默认值。\n* `center`: 将行或列在次要轴的中间对齐。\n\
  * `flex-start`: 将行或列在次要轴的起始端对齐。\n* `flex-end`: 将行或列在次要轴的末端对齐。\n* `space-around`:\
  \ 在容器内均匀分布大部分行或列，在每个项目两边提供固定的空间，但第一个项目在前面获得一半空间，最后一个项目在后面获得一半空间。\n* `space-between`:\
  \ 将第一行或列放在次要轴的起始，最后行或列放在末尾，并在其余行或列之间均匀分布。\n* `space-evenly`: 通过在每个行或列的前后提供相同数量的空间，在容器内均匀分布行或列。\n\
  \n图 2-7（查看 `bk05ch02/example07.html`）展示了当次要轴为垂直方向时，`align-content` 属性的所有可能值。\n\n\
  你可以通过使用 `place-content` 属性将 `align-content` 和 `justify-content` 属性合并到一个声明中：\n\n\
  `place-content:` `align-value` `[`justify-value``];\n\n\n\n\n将 `align-value` 替换为你想要使用的\
  \ `align-content` 值；将 `justify-value` 替换为你想要使用的 `justify-content` 值。如果你只指定了一个值，浏览器将把该值同时应用于\
  \ `align-content` 和 `justify-content`。\n\n![当次要轴为垂直方向时，align-content 值如何对齐多行的截图](img/9781394164684-fg050207.png)\n\
  \nFIGURE 2-7: 当次轴为垂直方向时，`align-content` 值如何对齐多行。\n\n### 在项目之间添加间隙\n\n默认情况下，当你使用\
  \ `stretch`、`flex-start`、`flex-end` 和 `center` 等对齐值时，Flexbox 会所有的 flex 项目挤在一起。这可能正是你想要的效果，但有时你可能希望在\
  \ flex 项目之间留出空间。添加外边距（margins）是在项目之间留出呼吸空间的一种方法，但如果你不想费心处理外边距，可以让 Flexbox 自动在行、列或两者之间创建间隙——通常称为*gutters*（槽）来为你完成工作。以下是你可以使用的属性：\n\
  \n`row-gap:` `row-gap-value`;`\n\n`column-gap:` `column-gap-value`;`\n\n`gap:` `row-gap-value`\
  \ [`column-gap-value`];`\n\n*   `row-gap-value`: 一个长度值，指定 flex 容器中每行项目之间的空间。\n*\
  \   `column-gap-value`: 一个长度值，指定 flex 容器中每列项目之间的空间。\n\n![记住](img/remember.png) 当你使用\
  \ `gap` 写属性时，如果你只指定了 `row-gap-value`，Flexbox 会将该值同时应用于行和列。\n\n这是一个示例（查看 `bk05ch02/example08.html`）：\n\
  \n```css\n.container {\n  border: 5px double black;\n  display: flex;\n  flex-direction:\
  \ row;\n  flex-wrap: wrap;\n  gap: 1rem;\n  height: 50vh;\n  width: 50vw;\n}\n```\n\
  \n这段代码使用 `gap` 属性在 flex 容器的行和列之间应用了 `1rem` 的空间，如图图 2-8\n\nFIGURE 2-8: 使用 `gap` 属性为\
  \ flex 容器的行和列留出个人空间。\n\n## 控制 flex 项目\n\n到目前为止，这段 Flexbox 之之旅主要是关于控制 flex 容器属性（如方向、对齐和换行）的大观。但如果没有\
  \ flex 项目，flex 容器就一无所有，因此存在一个整个“微观”的 Flexbox 世界，可以在其中处理单个的 flex 项目。本章的其余部分将带你了解\
  \ Flexbox 提供的控制 flex 项目的各种属性。\n\n### 允许 flex 项目增长\n\n默认情况下，当你将 `justify-content`\
  \ 属性设置为 `flex-start`、`flex-end` 或 `center` 时，flex 项目在主轴上占据的空间仅为其内容所需的空间，如前面的图 2-3\n\
  \nFIGURE 2-9: 默认情况下，所有 flex 项目的 `flex-grow` 值为 `0`，导致空隙。\n\n对于 `flex-grow` 的正值，你有三种场景需要考虑：\n\
  \n*   **你只给一个 flex 项目分配正的 `flex-grow` 值。** 该 flex 项目会增长直到 flex 容器不再有空隙。例如，这里有一个规则为类\
  \ `item1` 的元素设置 `flex-grow` 为 `1`，图 2-10\n\n    FIGURE 2-10: 使用 `flex-grow: 1`，项目增长直到容器不再有空隙。\n\
  \n*   **你给两个或多个 flex 项目分配相同的正 `flex-grow` 值。** flex 项目等等增长，直到 flex 容器中不再有空隙。例如，这里有一个规则为类\
  \ `item1`、`item2` 和 `item3` 的元素设置 `flex-grow` 为 `1`，图 2-11\n\n    FIGURE 2-11: 当项目\
  \ 1、2 和 3 使用 `flex-grow: 1` 样式时，项目等等增长。\n\n*   **你给两个或多个 flex 项目分配不同的正 `flex-grow`\
  \ 值。** flex 项目根据 `flex-grow` 值比例增长直到 flex 容器中不再有空隙。例如，如果你给一个项目分配 `flex-grow` 值为\
  \ `1`，第二个项目 `flex-grow` 值为 `2`，第三个项目 `flex-grow` 值为 `1`，那么分配给每个项目的 flex 容器空隙比例将分别为\
  \ 25%、50% 和 25%。图 2-12\n\n    FIGURE 2-12: 项目 1 和 3 占据容器 25% 的空隙，项目 2 占据 50%。\n\n\
  ### 允许 flex 项目缩小\n\nFlexbox 弹性不仅意味着 flex 项目可以增长以填充 flex 容器的空隙，还意味着当空间不足时它们可以缩小。缩小以适应容器是\
  \ Flexbox 的默认行为，但通过在 flex 项目上使用 `flex-shrink` 属性，你可以对哪些项目缩小以及缩小的程度获得某种控制：\n\n```css\n\
  .item {\n  flex-shrink: value;\n}\n```\n\n*   `value`: 一个大于或等于 `0` 的数字。默认值为 `1`，告诉浏览器等等缩小所有\
  \ flex 项目以适应 flex 容器。\n\n例如，考虑以下代码：\n\n```html\n<div class=\"container\">\n  <div\
  \ class=\"item item1\">1</div>\n  <div class=\"item item2\">2</div>\n  <div class=\"\
  item item3\">3</div>\n  <div class=\"item item4\">4</div>\n  <div class=\"item item5\"\
  >5</div>\n</div>\n```\n\n```css\n.container {\n  display: flex;\n  width: 600px;\n\
  }\n```\n\n\n\n\n\n```css\nborder: 5px double black;\n}\n\n.item {\n  width: 200px;\n\
  }\n```\n\n弹性容器（`container` 类）的宽度为 `600px`，但每个弹性项目（`item` 类）的宽度为 `200px`。为了让所有内容都能适应容器，浏览器会等比例缩小每个项目，结果如图\
  \ 2-13 所示（查看 `bk05ch02/example13.html`）。\n\n![默认情况下，浏览器沿主轴等比例缩小项目，直到适应为止的截图。](img/9781394164684-fg050213.png)\n\
  \n图 2-13： 默认情况下，浏览器沿主轴等比例缩小项目，直到适应为止。\n\n![技术细节](img/technicalstuff.png) 只有当每个项目在主轴上的尺寸相同时（例如，当主轴为水平方向时宽度相同），浏览器才会真正等比例地缩小每个弹性项目（即收缩量相同）。如果弹性项目的尺寸不同，浏览器将根据其尺寸大致比例缩小每个项目：较大的项目缩小得更多，而较小的项目缩小得较少。我在这里使用“大致”一词是因为实际上，浏览器用于确定收缩系数的计算复杂得令人大脑头疼。如果你想学习更多（别说我没没警告过你！），请查看[`https://madebymike.com.au/writing/understanding-Flexbox`](https://madebymike.com.au/writing/understanding-Flexbox)。\n\
  \n你有三种方法来控制弹性项目的收缩：\n\n*   **给项目分配一个 0 到 1 之间的 `flex-shrink` 值。** 浏览器缩小该项目的程度小于其他弹性项目。例如，这里有一条规则为类名为\
  \ `item1` 的元素设置 `flex-shrink` 为 `0.5`，图 2-14 显示项目 1 的收缩程度小于容器中的其他项目（查看 `bk05ch02/example14.html`）：\n\
  \n```css\n.item1 {\n  flex-shrink: 0.5;\n}\n```\n\n![使用 flex-shrink: 0.5 设置项目 1，使其收缩小于其他项目的截图。](img/9781394164684-fg050214.png)\n\
  \n图 2-14： 使用 `flex-shrink: 0.5` 设置项目 1，其收缩程度小于其他项目。\n\n*   **给项目分配一个大于 1 的 `flex-shrink`\
  \ 值。** 浏览器缩小该项目的程度大于其他弹性项目。例如，接下来的规则为类名为 `item1` 的元素设置 `flex-shrink` 为 `2`，图 2-15\
  \ 显示项目 1 的收缩程度大于容器中的其他项目（查看 `bk05ch02/example15.html`）：\n\n```css\n.item1 {\n  flex-shrink:\
  \ 2;\n}\n```\n\n![使用 flex-shrink: 2 设置项目 1，使其收缩大于其他项目的截图。](img/9781394164684-fg050215.png)\n\
  \n图 2-15： 使用 `flex-shrink: 2` 设置项目 1，其收缩程度大于其他项目。\n\n*   **给项目分配一个 0 的 `flex-shrink`\
  \ 值。** 浏览器不缩小该项目。接下来的规则为类名为 `item1` 的元素设置 `flex-shrink` 为 `0`，图 2-16 显示浏览器不缩小项目\
  \ 1（查看 `bk05ch02/example16.html`）：\n\n```css\n.item1 {\n  flex-shrink: 0;\n}\n```\n\
  \n![警告](img/warning.png) 如果弹性项目在主轴上的长度大于其弹性容器，且你对该项目设置了 `flex-shrink: 0`，那么难看就会就会。也就是说，弹性项目会超出容器，取决于它所在的位置，可能会连带一个或多个项目。\n\
  \n![使用 flex-shrink: 0 设置项目 1，项目不会收缩的截图。](img/9781394164684-fg050216.png)\n\n图 2-16：\
  \ 使用 `flex-shrink: 0` 设置项目 1，项目不会收缩。\n\n### 建议弹性项目的尺寸\n\n弹性项目有一个初始的主轴尺寸（Flexbox\
  \ 标准称之为“假设的主尺寸”），这是项目在主轴（主轴）上自然消耗的空间量。当你对一个项目声明 `flex-grow: 1` 和 `flex-shrink: 1`\
  \ 时，该项目会从这个初始主尺寸开始增长或收缩。\n\n![记住](img/remember.png) 为了减少冗长，我假设 `flex-direction:\
  \ row`，因此主轴是水平的，初始主尺寸是项目的宽度。然而，如果对容器上声明了 `flex-direction: column`，则主轴是垂直的，初始主尺寸是项目的高度。因此，在本节中，如果你的容器主轴是垂直的，请将每个“width”更改为“height”。\n\
  \n你可以通过设置 `flex-basis` 属性为项目建议一个不同的初始主尺寸：\n\n```css\nitem {\n  flex-basis: value;\n\
  }\n```\n\n*   `value`：初始主尺寸的长度或百分比值。你也可以使用以下关键词之一：\n    *   `auto`：将初始主尺寸设置为项目的\
  \ `width` 值。如果项目没有声明宽度，`auto` 将初始主尺寸设置为项目内容的大小（`auto` 关键字是 `flex-basis` 的默认值）。\n\
  \    *   `content`：根据项目内容设置初始主尺寸。该关键字会覆盖项目声明的 `width` 值（如果有）。\n    *   `max-content`：将初始主尺寸设置为在不换行的情况下能容纳内容的最宽值（或弹性容器可用的最大宽度，以较者为准）。\n\
  \    *   `min-content`：根据项目最小可能的宽度设置初始主尺寸。\n    *   `fit-content`：根据项目内容在 `max-content`\
  \ 和 `min-content` 之间设置初始主尺寸。\n\n![记住](img/remember.png) 除了 `auto` 关键字外，你在 `flex-basis`\
  \ 属性上设置的任何值都会覆盖你应用于同一项目的 `width` 值。\n\nCSS Flexible Box 布局标准（查看[`https://www.w3.org/TR/css-flexbox-1/`](https://www.w3.org/TR/css-flexbox-1/)）将\
  \ `flex-basis`、`flex-grow` 和 `flex-shrink` 称为“弹性组件”。这并不意外，因为这三个属性密切相关：\n\n*   `flex-basis`\
  \ 为项目创建一个新的初始主尺寸。但注意，`flex-basis` 值（或 `width` 值）仅仅是一个建议的宽度。\n*   `flex-grow` 允许项目尺寸从初始主尺寸的最小值扩展到初始主尺寸加上主轴可用空间的最大值。\n\
  *   `flex-shrink` 允许项目尺寸从初始主尺寸的最大值收缩到基于内容的最小尺寸。\n\n为了帮助你理解 `flex-basis` 属性，这里有四个常见的场景：\n\
  \n*   **你希望一个弹性项目具有最小宽度。** 将 `flex-basis` 设置为你想要用作最小宽度的值；将 `flex-grow` 设置为正值，以便项目在有可用空间时能够超过\
  \ `flex-basis` 值值；并声明 `flex-shrink: 0` 以防止项目缩小到 `flex-basis` 值以下。这里有一个示例（查看图 2-17\
  \ 和 `bk05ch02/example17.html`）：\n\n```css\n.item1 {\n  flex-grow: 1;\n  flex-shrink:\
  \ 0;\n  flex-basis: 200px;\n}\n```\n\n![设置项目 1 具有最小宽度的截图](img/9781394164684-fg050217.png)\n\
  \n图 2-17： 设置项目 1 具有最小宽度。\n\n*   **你希望一个弹性项目具有最大宽度。** 将 `flex-basis` 设置为你想要用作最大宽度的值；将\
  \ `flex-grow` 设置为 0 以防止项目增长超过 `flex-basis` 值；并声明 `flex-shrink:` 为非零值，允许项目缩小到 `flex-basis`\
  \ 值以下。这里有一个示例（查看图 2-18 和 `bk05ch02/example18.html`）：\n\n```css\n.item1 {\n  flex-grow:\
  \ 0;\n  flex-shrink: 1;\n  flex-basis: 200px;\n}\n```\n\n\n\n\n\n![设置项目 1 最大宽度的截图](img/9781394164684-fg050218.png)\n\
  \nFIGURE 2-18: 设置项目 1 具有最大宽度。\n\n- **你希望一个 flex 项目具有固定的宽度。** 将 `flex-basis` 设置为你你想要作为固定宽度的值；设置\
  \ `flex-grow: 0` 防止项目增长超过 `flex-basis` 值；并声明 `flex-shrink: 0` 防止项目缩小到 `flex-basis`\
  \ 值以下。这里有一个示例（请查看图 2-19 和 `bk05ch02/example19.html`）：\n\n```css\n.item1 {\nflex-grow:\
  \ 0;\nflex-shrink: 0;\nflex-basis: 200px;\n}\n```\n\n![设置项目 1 具有固定宽度的截图](img/9781394164684-fg050219.png)\n\
  \nFIGURE 2-19: 设置项目 1 具有最大宽度。\n\n- **你希望一个 flex 项目具有最小和最大宽度。** 将 `flex-basis` 设置为你想要作为初始主宽度的值；将\
  \ `flex-grow` 设置为正值允许项目增长超过 `flex-basis` 值；将 `flex-shrink` 设置为非零值允许项目缩小到 `flex-basis`\
  \ 值以下；将 `min-width` 设置为你想要作为最小宽度的值；并将 `max-width` 设置为你想要作为最大宽度的值。这里有一个示例（请查看图 2-20\
  \ 和 `bk05ch02/example19a.html`）：\n\n```css\n.item1 {\nflex-grow: 1;\nflex-shrink:\
  \ 1;\nflex-basis: 300px;\nmin-width: 200px;\nmax-width: 400px;\n}\n```\n\n![设置项目\
  \ 1 具有固定宽度的截图](img/9781394164684-fg050220.png)\n\nFIGURE 2-20: 设置项目 1 具有最大宽度。\n\n\
  ### 使用 flex 简写属性\n\n`flex-grow`、`flex-shrink` 和 `flex-basis` 属性对于 Flexbox 工作非常基础，因此标准定义了一个\
  \ `flex` 简写属性，你可以一次性设置这三个属性。`flex` 简写可以接受一个、两个或三个值，我在表 2-1 中详细列出了这些语法的每一种。\n\n![记住](img/remember.png)\
  \ 当你使用 `flex` 简写时，至关重要的是记住，如果你只指定了一个或两个值，Flexbox 会为缺失的属性应用默认值。例如，考虑以下代码：\n\n```css\n\
  .item1 {\nflex-shrink: 0;\nflex-basis: 10rem;\nflex: 1;\n}\n```\n\n| **语法** | **描述**\
  \ | **示例** | **等效于** |\n| --- | --- | --- | --- |\n| `flex:grow;` | 将 `flex-grow`\
  \ 设置为 `grow`；将 `flex-shrink` 设置为 `1` 并 `flex-basis` 设置为 `0` | `flex: 2;` | `flex-grow:\
  \ 2; flex-shrink: 1; flex-basis: 0;` |\n| `flex:basis;` | 将 `flex-basis` 设置为 `basis`；将\
  \ `flex-grow` 设置为 `1` 并 `flex-shrink` 设置为 `1` | `flex: 10rem;` | `flex-grow: 1;\
  \ flex-shrink: 1; flex-basis: 10rem;` |\n| `flex:grow basis;` | 将 `flex-grow` 设置为\
  \ `grow`；将 `flex-basis` 设置为 `basis`；将 `flex-shrink` 设置为 `1` | `flex: 2 12vw;` |\
  \ `flex-grow: 2; flex-shrink: 1; flex-basis: 12vw;` |\n| `flex:grow shrink basis;`\
  \ | 将 `flex-grow` 设置为 `grow`；将 `flex-shrink` 设置为 `shrink`；将 `flex-basis` 设置为 `basis`\
  \ | `flex 0 0 200px;` | `flex-grow: 0; flex-shrink: 0; flex-basis: 200px;` |\n\n\
  表 2-1 `flex` 简写属性。乍看，这段代码似乎是在为 `item` 设置 `10rem` 的最小尺寸。然而，通过使用 `flex: 1` 简写，Flexbox\
  \ 为 `flex-shrink` 和 `flex-basis` 应用了默认值，因此之前的代码等于：\n\n```css\n.item1 {\nflex-shrink:\
  \ 0;\nflex-basis: 10rem;\nflex-grow: 1;\n}\n```\n\n后两个声明覆盖了第一个，所以如果你不了解默认值，当你的 flex\
  \ 项目行为不符合你的预期时，你可能会感到困惑。\n\n### 使用 Flexbox 布局列\n\nFlexbox 在你使用它沿单维度维度布局组件时效果最好，但这并不意味着你不能用它来布局整个页面。只要页面结构相对简单，Flexbox\
  \ 在水平和垂直布局元素方面都非常出色。一个很好的例子是经典的页面布局：跨页面顶部的页眉和导航栏；一个带有侧边文章的主区域；以及横跨页面底部的页脚。这里是创建这种布局的\
  \ Flexbox 代码，显示在图 2-21 中（请查看 `bk05ch02/example20.html`）：\n\nHTML:\n```html\n<body>\n\
  <header>Header</header>\n<nav>Navigation</nav>\n<main>\n<article>Article</article>\n\
  <aside>Aside</aside>\n</main>\n<footer>Footer</footer>\n</body>\n```\n\nCSS:\n```css\n\
  html {\nheight: 100%;\n}\nbody {\ndisplay: flex;\nflex-direction: column;\ngap:\
  \ 1rem;\nheight: 100%;\nwidth: 75vw;\n}\nmain {\nflex: 1;\ndisplay: flex;\nflex-wrap:\
  \ wrap;\ngap: 1rem;\n}\narticle {\nflex: 1 0 15rem;\n}\naside {\nflex: 0 0 10rem;\n\
  }\n```\n\n![Flexbox 风格的经典页面布局](img/9781394164684-fg050221.png)\n\nFIGURE 2-21: 经典的页面布局，Flexbox\
  \ 风格。以下是这段代码的原理：\n\n- `<body>` 标签被设置为一个 flex 容器，该容器通过 `flex-direction: column` 样式，为整个页面创建了一个垂直轴。\n\
  - `body` 元素的 `height` 属性设置为 `100%`，这使得 flex 容器占据浏览器视口的高度的高度。\n- `main` 元素被设置为 `flex:\
  \ 1`，这告诉浏览器垂直增长 `main` 元素，直到用完 flex 容器中的空隙。这也确保了如果内容不足以填充 `main` 元素，`<footer>` 元素将出现在内容区域的底部。\n\
  - `main` 元素也是一个 flex 容器，设置为 `flex-direction: row`，创建一个水平主轴。该容器还声明了 `flex-wrap: wrap`，允许\
  \ `aside` 元素在较小的屏幕上换到 `article` 元素下方。\n- 在 `main` flex 容器内部，`article` 元素被赋予 `flex:\
  \ 1 0 15rem`，因此它根据需要增长以占据 `main` 元素的剩余宽度（即在考虑了 `aside` 元素的宽度之后），但不会小于 `15rem`。\n\
  - 为了获得固定宽度的侧边栏，`aside` 元素的规则使用了 `flex: 0 0 10rem`。\n\n### 调整 flex 项目顺序 调整 flex 项目的最后一个技巧是你可以更改浏览器在容器内渲染\
  \ flex 项目的顺序。这听起来可能是一个奇怪的想法，但它非常有用。例如，当我在第 5 本第 4 章](#c32.xhtml)中讨论响应式布局时，支持移动浏览器的关键之一是确保页面主要内容出现在移动用户的初始屏幕上。如果页面的桌面版本先其他内容，而不是为移动端重构一切，你可以创建一个使用\
  \ Flexbox 更改内容的媒体查询。类似的思路是，无障碍最佳实践要求页面主要内容尽可能靠近页面顶部。为什么？因为我们不希望使用辅助技术的人在进入主要部分之前遍历广告或其他非本质内容。如果你的设计有一个（例如）在\
  \ HTML 代码中先出现的左侧边栏，可以使用 Flexbox 让侧边栏代码在主内容之后渲染。你使用 `order` 属性自定义 flex 项目的顺序：\n\n\
  ```css\n.item {\norder: value;\n}\n```\n\n\n\n\n\n* `value`: 默认情况下，flex 容器的子项目分配的\
  \ `order` 值为 `0`。你可以像这样更改项目的顺序：\n\n  * flex 项目的 `order` 值越高，该项目在 flex 容器中中出现的位置就越靠后。\n\
  \  * `order` 值最大的 flex 项目出现在 flex 容器的最后面。\n  * `order` 值最小的 flex 项目出现在 flex 容器的最前面。\n\
  \  * 负数 `order` 值也是很有用的，所以你可以通过将项目的 `order` 值设置为 `-1` 来将 flex 项目移动到其 flex 容器的前面。\n\
  \n这是一个示例（查看 `bk05ch02/example21.html`）：\n\n```\n.item1 {\n  order: 1;\n}\n```\n\n\
  在这个示例中，通过对类名为 `item1` 的项目声明 `order: 1`，浏览器会将该项目移动到容器的末尾，如图图 2-22 所示。\n\n![在 item\
  \ 1 上设置 order: 1 的截图，该项目移动到了其 flex 容器的末尾。](img/9781394164684-fg050222.png)\n\n图\
  \ 2-22： 为 item 1 设置 `order: 1`，该项目移动到了其 flex 容器的末尾。\n\n第 3 章\n\n# 使用 CSS Grid 布局页面\n\
  \n本章内容\n\n* 熟悉 CSS Grid\n* 设置网格容器\n* 将网格划分为行和列\n* 创建网格间隙\n* 对齐网格项目\n\n*如果你还没有学习过\
  \ CSS Grid（而且你是一个编写 CSS 的人），那你真的错过了很多东西。*\n— JEN SIMMONS\n\n也许我有点老了，但当我开始制作网页时，布局页面的激动人心的新技术是创建一个巨大的\
  \ `table` 元素，并将页面的各个部分放入一个或多个表格单元格中。这使我们能够像训练营的新兵一样对齐内容，这很很棒，但我们的页面看起来像训练营教官一样死板且冷不可亲，这并不那么好。\n\
  \n从那时起，Web 开发人员一直梦想有一种 CSS 解决方案，既能让我们控制布局，又能保留一定的灵活性创造力。这个目标在不久前通过 Flexbox 部分实现（查看第\
  \ 5 本的第 2 章），它使得在单维度上布局网页元素变得轻而易举。但网页本质上是坚决的二维生物，所以尽管我们热爱 Flexbox，但也知道我们还没有完全到位。\n\
  \n最后，一种既精确又灵活的现代全页布局方法的梦想在几年前以 CSS Grid 的形式实现了。噢，Web 开发领域的极客们都兴奋不已了！但他们也很不耐烦，因为浏览器实现大型且复杂的\
  \ Grid 规范需要一些时间。但现在 Grid 已经拥有近乎通用的浏览器支持，准备好让你将页面布局提升到一个高度。在本章中，我将向你介绍 CSS Grid，并帮助你探索它提供的所有功能。\n\
  \n## 介绍 CSS Grid\n\nCSS Grid Layout Level 1 —— 一个很拗口的名称，我在本章中将其称为 CSS Grid 或简单的\
  \ Grid —— 它为你提供了一种直接的方法，将容器划分为一个或多个列和一个或多个行 —— 即网格 —— 然后可选地将容器元素分配给网格的特定区域。通过 CSS\
  \ Grid，你可以向 浏览器下达指令：\n\n* 将 `<body>` 标签设置为具有四行三列的网格。\n* 将 `header` 元素放在第一行，并让它跨越所有列。\n\
  * 将 `nav` 元素放在第二行，并让它跨越所有列。\n* 将 `article` 元素放在第三行的第 1 和第 2 列。\n* 将 `aside` 元素放在第三行的第\
  \ 3 列。\n* 将 `footer` 元素放在第四行，并让它跨越所有列。\n\n在学习如何执行这些及其他操作之前，你需要知道 Grid 使用两类元素：\n\n\
  * **网格容器 (Grid container):** 这是一个块级元素，作为其内部元素的父元素，你通过一组行和列对这些元素进行配置。\n* **网格项目 (Grid\
  \ items):** 这些位于网格容器内的元素，你将它们（或浏览器分配）分配给网格的特定部分。\n\n## 设置网格\n\n要将一个元素指定为网格容器，你需要将它的\
  \ `display` 属性设置为 `grid`：\n\n```\ncontainer {\n  display: grid;\n}\n```\n\n完成第一步后，该元素的子元素变成了网格项目。查看这段代码（你可以在本书的示例\
  \ `bk05ch03/example01.html` 中找到它）：\n\n```html\n<div class=\"container\">\n  <div\
  \ class=\"item1\">1</div>\n  <div class=\"item2\">2</div>\n  <div class=\"item3\"\
  >3</div>\n  <div class=\"item4\">4</div>\n  <div class=\"item5\">5</div>\n  <div\
  \ class=\"item6\">6</div>\n</div>\n```\n\n```css\n.container {\n  border: 5px double\
  \ black;\n  display: grid;\n  text-align: center;\n}\n.item {\n  font-family: Verdana,\
  \ sans-serif;\n  font-size: 3rem;\n}\n.item1 {\n  order: 1;\n}\n.item2 {\n  order:\
  \ 2;\n}\n.item3 {\n  order: 3;\n}\n.item4 {\n  order: 4;\n}\n.item5 {\n  order:\
  \ 5;\n}\n.item6 {\n  order: 6;\n}\n```\n\n在这个示例中，通过对类名为 `item1` 的项目声明 `order: 1`，浏览器会将该项目移动到容器的末尾，如图图\
  \ 2-22 所示。\n\n![网格容器的截图](img/9781394164684-fg050301.png)\n\n图 2-22： 为 item 1 设置\
  \ `order: 1`，该项目移动到了其 flex 容器的末尾。\n\n### 指定网格行和列\n\n图 3-1 显示的结果有点令人失望，不是吗？这里我讨论的是\
  \ Grid 作为一个一列六行的网格。然而，那并不是事实。你在这里看到的实际上是一个一列六行的网格。这被称为隐式网格 (implicit grid)，因为它是浏览器自动创建的。隐式网格是\
  \ CSS Grid 的一大优势，因为它们减少了你需要的工作。现在，继续阅读以了解如何创建自己的行和列。\n\n### 设置自己的行和列：显式网格\n\n当你明确告诉浏览器你的网格中需要多少列和多少行时，你就在创建一个显式网格\
  \ (explicit grid)。你通过创建一个网格模板来实现这一点，通过在网格容器上添加 `grid-template-columns` 和 `grid-template-rows`\
  \ 属性：\n\n```css\ncontainer {\n  display: grid;\n  grid-template-columns: 100px 300px\
  \ 200px;\n  grid-template-rows: 100px 200px;\n}\n```\n\n```css\n.container {\n \
  \ border: 5px double black;\n  display: grid;\n  text-align: center;\n  grid-template-columns:\
  \ 100px 300px 200px;\n  grid-template-rows: 100px 200px;\n}\n.item {\n  font-family:\
  \ Verdana, sans-serif;\n  font-size: 3rem;\n}\n.item1 {\n  background-color: lightcoral;\n\
  }\n.item2 {\n  background-color: lightgreen;\n}\n.item3 {\n  background-color: lightblue;\n\
  }\n.item4 {\n  background-color: tomato;\n}\n.item5 {\n  background-color: gold;\n\
  }\n.item6 {\n  background-color: plum;\n}\n```\n\n```html\n<div class=\"container\"\
  >\n  <div class=\"item item1\">1</div>\n  <div class=\"item item2\">2</div>\n  <div\
  \ class=\"item item3\">3</div>\n  <div class=\"item item4\">4</div>\n  <div class=\"\
  item item5\">5</div>\n  <div class=\"item item6\">6</div>\n</div>\n```\n\n图 3-2\
  \ 显示了结果：\n\n* `column-values`: 用于网格中每列尺寸的空格分隔列表。\n* `row-values`: 用于网格中每行尺寸的空格分隔列表。\n\
  \n在最简单的情况下，列和行的大小可以是用任何标准 CSS 测量单位（`px`、`em`、`rem`、`vw`、`vh` 等）表示的数字，或者以百分比表示。\n\
  \n这是一个示例（查看 `bk05ch03/example02.html`），并且图 3-2 显示了结果：\n\n```html\n<div class=\"\
  container\">\n  <div class=\"item item1\">1</div>\n  <div class=\"item item2\">2</div>\n\
  \  <div class=\"item item3\">3</div>\n  <div class=\"item item4\">4</div>\n  <div\
  \ class=\"item item5\">5</div>\n  <div class=\"item item6\">6</div>\n</div>\n```\n\
  \n```css\n.container {\n  border: 5px double black;\n  display: grid;\n  text-align:\
  \ center;\n  grid-template-columns: 100px 300px 200px;\n  grid-template-rows: 100px\
  \ 200px;\n}\n.item {\n  font-family: Verdana, sans-serif;\n  font-size: 3rem;\n\
  }\n.item1 {\n  background-color: lightcoral;\n}\n.item2 {\n  background-color: lightgreen;\n\
  }\n.item3 {\n  background-color: lightblue;\n}\n.item4 {\n  background-color: tomato;\n\
  }\n.item5 {\n  background-color: gold;\n}\n.item6 {\n  background-color: plum;\n\
  }\n```\n\n\n\n\n\n![仅通过设置三个属性（display, grid-template-columns 和 grid-template-rows）创建的基础网格截图。](img/9781394164684-fg050302.png)\n\
  \n图 3-2: 仅通过设置三个属性：`display`、`grid-template-columns` 和 `grid-template-rows` 创建的基础网格。\n\
  \n## 让列或行根据需要增长或收缩\n\n请注意图 3-2，那两行并没有占据网格容器的整个宽度。这是因为我为列宽设置了固定的像素（pixel）值，而这些值值的总和并不等于网格容器的宽度。如果网格容器小于列宽的总和，列将从右侧溢出容器。\n\
  \n这些都是说明了我们不应该总是使用像素来设置列和行大小的充分理由。通常情况下，更好的方法是使用一种名为 `fr` 的新单位来指定列或行的大小，该单位专门用于\
  \ Grid，并代表网格容器中可用剩余空间的比例，无论是水平方向（列）还是垂直方向（行）。例如，这里是上一节中的 CSS 代码，它将第三列的原始值 `200px`\
  \ 替换为了 `1fr`（bk05ch03/example03.html）：\n\n```css\n.container {\n  display: grid;\n\
  \  grid-template-columns: 100px 300px 1fr;\n  grid-template-rows: 100px 200px;\n\
  }\n```\n\n如图 3-3 所示，第三列现在扩展以填充右侧可用的网格容器空间。\n\n![截图显示通过将第三列的大小改为 1fr，该列扩展以填充容器的剩余空间。](img/9781394164684-fg050303.png)\n\
  \n图 3-3: 通过将第三列的大小改为 `1fr`，该列扩展以填充容器的剩余空间。\n\n如果你为多个列（或行）分配比例大小，浏览器将按比例分配剩余空间。例如，如果你给一列分配\
  \ `1fr` 空间，给另一列分配 `2fr`，浏览器会将水平剩余空间的三之一分给第一列，将水平剩余空间的三之二分给第二列。\n\n## 简化 Grid 繁琐操作：`repeat()`\
  \ 函数\n\n根据你想要的布局，你可能会指定多个使用相同大小的连续行或列。这里有一个例子：\n\n```css\ngrid-template-columns:\
  \ 250px 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 300px;\n```\n\n此声明在左侧创建了一个 250 像素的列，右侧创建一个\
  \ 300 像素的列，中间有八列比例大小的列。所有这些 `1fr` 实例不仅输入起来很痛苦，而且很难知道——你到底定义了多少总列。编写此类声明的更简单更清晰的方法是将重复的值适当地替换为\
  \ `repeat()` 函数：\n\n```css\nrepeat(number, size)\n```\n\n* `number`: 你希望浏览器重复 `size`\
  \ 的次数。\n* `size`: 你想要的列宽或行高。\n\n所以，而不是之前的声明，你可以使用以下代码（bk05ch03/example04.html）：\n\
  \n```css\ngrid-template-columns: 250px repeat(8, 1fr) 300px;\n```\n\n![提示](img/tip.png)\
  \ 你可以用于 `number` 参数的一个经常非常有用的关键字是 `auto-fill`，它要求浏览器根据 `size` 参数自动在网格容器中填充尽可能多的列或行。在接下来的示例中，浏览器将创建尽可能多能放入网格容器宽度的\
  \ `100px` 列：\n\n```css\ngrid-template-columns: repeat(auto-fill, 100px);\n```\n\n\
  ## 设置值范围：`minmax()` 函数\n\n在列或行上设置不灵活的大小（例如，使用像素）会创建一个不适应内容的僵硬结构。相反，在列或行上使用灵活的大小（即使用\
  \ `fr` 单位），如果列或行扩展到远大于内容的尺寸，可能会导致问题。我在下一节中提到了一些解决此问题的关键字，但另一个解决方案是使用 `minmax()`\
  \ 函数设置尺寸范围：\n\n```css\nminmax(min, max)\n```\n\n* `min`: 允许列或行收缩的最小尺寸。\n* `max`:\
  \ 允许列或行扩展的最大尺寸。\n\n例如，在下面的声明中，第三列宽度不会小于 `200px`，且不会大于 `500px`（bk05ch03/example05.html）：\n\
  \n```css\ngrid-template-columns: 150px 200px minmax(200px, 500px);\n```\n\n在下面的示例中，第一列可以扩展填充可用空间，但其宽度永远不会小于\
  \ `250px`（bk05ch03/example06.html）：\n\n```css\ngrid-template-columns: minmax(250px,\
  \ 1fr) repeat(5, 10vw);\n```\n\n## 使用 `auto` 关键字命名\n\n你可以使用 `auto` 关键字设置 `grid-template-columns`\
  \ 或 `grid-template-rows` 的大小。`auto` 关键字向浏览器发送以下指令：\n\n* **对于列：** 缩小列是可以接受的，但不能小于最小可能的宽度（通常是列中最长单词的长度）。同样，扩展列是可以接受的，但不能大于最大可能的宽度（如果有空间的话，通常是列中最长不换行的条目的长度）。如果容器有额外的水平空间，扩展列以填充额外空间是可以接受的（因此在这种情况下，`auto`\
  \ 的作用与 `1fr` 相同）。\n* **对于行：** 缩小行是可以接受的，但不能小于行中最高的条目。同样，扩展行是可以接受的，但不能大于行中最高的内容。\n\
  \n这里是一个使用 `auto` 关键字的示例（bk05ch03/example07.html）：\n\n```css\ngrid-template-columns:\
  \ repeat(3, auto);\ngrid-template-rows: auto auto;\n```\n\n### 让浏览器承担一些工作：隐式网格\n\
  \n处理显式网格——即在网格容器上指定 `grid-template-columns` 和 `grid-template-rows` 属性——意味着在定义网格布局时，你正在完成所有的体力工作。大多数情况下，这正是你想要的，因为显式网格给了你对网格结构的显式控制。\n\
  \n然而，有时你可以采取更不干预的方法，让网络浏览器分担一些任务。例如，如果你遗漏了 `grid-template-columns` 和 `grid-template-rows`\
  \ 属性，浏览器将创建一个单列网格，行数等于网格容器中的子元素数量（示例请查看本章早前的设置网格容器）。这就是*隐式网格*的示例，在缺少一个或多个网格模板属性的情况下，浏览器会自动设置网格结构。\n\
  \n你并不需要完全没有网格模板，但有时你的设计可能要求只指定列模板或行模板。\n\n#### 省略行模板\n\n如果你指定了 `grid-template-columns`\
  \ 属性而遗漏了 `grid-template-rows` 属性，浏览器会自动执行两件事：\n\n* 创建所需的行以将网格容器的所有子元素放入列模板中\n* 将行高配置为\
  \ `auto` 值（查看使用 auto 关键字命名），这通常意味着将每行的高度设置为行中最高元素的高度\n\n这里有一个示例（bk05ch03/example08.html）：\n\
  \nHTML:\n```html\n<div class=\"container\">\n  <div class=\"item item1\">1</div>\n\
  \  <div class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div\
  \ class=\"item item4\">4</div>\n  <div class=\"item item5\">5</div>\n  <div class=\"\
  item item6\">6</div>\n  <div class=\"item item7\">7</div>\n  <div class=\"item item8\"\
  >8</div>\n</div>\n```\n\nCSS:\n```css\n.container {\n  border: 5px double black;\n\
  \  display: grid;\n  grid-template-columns: 1fr 3fr 2fr;\n}\n```\n\n\n\n\n此示例仅设置了三列网格，而没有指定行模板。如图\
  \ 3-4 所示，浏览器会自动创建所需的行数以适应所有的子 `div` 元素（第三行留有一个空白单元格）。\n\n## 省略网格列模板\n\n如果你指定了 `grid-template-rows`\
  \ 属性而省略了 `grid-template-columns` 属性，浏览器会自动执行两件事：\n\n* 为网格容器的所有子元素创建一个单列\n* 使用值 `auto`\
  \ 配置列宽（请参阅“使用 auto 关键字进行尺寸调整”）\n\n![截图显示在没有行模板的情况下，浏览器创建了所需的行以适应所有子元素。](img/9781394164684-fg050304.png)\n\
  \n图 3-4： 在没有行模板的情况下，浏览器创建了所需的行以适应所有子元素。\n\n这是一个示例（请参阅图 3-5 和 bk05ch03/example09.html）：\n\
  \nHTML:\n```html\n<div class=\"container\">\n<div class=\"item item1\">1</div>\n\
  <div class=\"item item2\">2</div>\n<div class=\"item item3\">3</div>\n<div class=\"\
  item item4\">4</div>\n<div class=\"item item5\">5</div>\n<div class=\"item item6\"\
  >6</div>\n<div class=\"item item7\">7</div>\n<div class=\"item item8\">8</div>\n\
  </</div>\n```\n\nCSS:\n```css\n.container {\n  border: 5px double black;\n  display:\
  \ grid;\n  grid-template-rows: repeat(8, auto);\n}\n```\n\n你可能会奇奇，为什么在图 3-5 中列宽默认为\
  \ `auto`，但列的宽度并没有与其最宽的项一样。这是因为网格列的默认对齐方式是 `stretch`，这会导致列占据网格容器中所有可水平空间。要学习如何控制列和行的对齐，请参阅本章后半部分的“让你的网格项目排齐（或成列）：对齐项目”\n\
  \n![截图显示在没有列模板的情况下，浏览器创建了一个跨越网格容器宽度的单列。](img/9781394164684-fg050305.png)\n\n图 3-5：\
  \ 在没有列模板的情况下，浏览器创建了一个跨越网格容器宽度的单列。\n\n## 为隐式行或列指定尺寸\n\n当你省略了 `grid-template-rows`\
  \ 或 `grid-template-columns` 属性时，浏览器会使用关键字 `auto` 分别对隐式列或行进行定价。如果这些自动尺寸不能满足你的设计需求，你可以使用以下属性覆盖它们：\n\
  \n`grid-auto-rows: value;`\n\n`grid-auto-columns: value;`\n\n* `value`: 一个长度、百分比或\
  \ `minmax()` 函数，用于指定你偏尺寸\n\n例如（请参阅 bk05ch03/example10.html），这里是对隐式行代码的更新（请参阅“省略网格行模板”），它指示浏览器对每行应用\
  \ 100px 的高度（如图 3-6 所示）。\n\n```css\n.container {\n  border: 5px double black;\n \
  \ display: grid;\n  grid-template-columns: 1fr 3fr 2fr;\n  grid-auto-rows: 100px;\n\
  }\n```\n\n![使用 grid-auto-rows 为隐式行设置高度的截图](img/9781394164684-fg050306.png)\n\n图\
  \ 3-6: 使用 `grid-auto-rows` 为隐式行设置高度。\n\n## 创建网格间隙\n\n默认情况下，浏览器不包含任何*间隙（gutters）：*即每列之间的水平空间或每行之间的垂直空间。如果你希望在网格项目之间留有一些空白，可以为网格容器添加以下属性：\n\
  \n`row-gap: row-gap-value;`\n\n`column-gap: column-gap-value;`\n\n`gap: row-gap-value\
  \ [column-gap-value];`\n\n* `row-gap-value`: 一个长度值，指定网格容器中每行项目之间的空间。\n* `column-gap-value`:\
  \ 一个长度值，指定网格容器中每列项目之间的空间。\n\n![记住](img/remember.png) 当你使用 `gap` 简写属性时，如果只指定 `row-gap-value`，Grid\
  \ 会将该值同时应用于行和列。\n\n在这三个属性中，值都是用任何标准 CSS 测量单位（`px`、`em`、`rem`、`vw` 或 `vh`）表示的数字。这是一个示例（请参阅\
  \ bk05cho3/example11.html 和图 3-7）：\n\n```css\n.container {\n  display: grid;\n \
  \ grid-template-columns: repeat(3, 1fr);\n  grid-template-rows: 1fr 2fr;\n  gap:\
  \ 1vw;\n}\n```\n\n![带有间隙的网格截图](img/9781394164684-fg050307.png)\n\n图 3-7： 带有间隙的网格。\n\
  \n## 取控制：分配网格项目\n\nGrid 世界中最重要的概念之一是*网格单元格（grid cell）*，它是网格列行的交叉点。无论你是通过在网格容器上指定\
  \ `grid-template-columns` 和 `grid-template-rows` 来建立显式网格，还是通过省略这两个属性来建立隐式网格，浏览器都会自动填充网格并将每个项目分配到单个单元格。\n\
  \n与其让浏览器使用默认的“每个单元格一个项目”算法来填充网格，你可以控制这个过程。这正是 Grid 变得实用的地方。Grid 提供了两种分配网格项目的方法：\n\
  \n* 将项目分配到特定的列和行\n* 将项目分配到命名区域\n\n### 将网格项目分配到列和行\n\n打破浏览器“每个单元格一个项目”网格布局最明显的方法，是将网格项目分配到你的设计所需的任何矩形列行集合。为什么我在最后句话中使用了*矩形（rectangular）*这个词呢？因为在\
  \ CSS Grid 中非矩形分配是不允许的。\n\n例如，查看图 3-8 所示的网格设计，其中 A、B 和 C 代表网格项目。\n\n![三列三行网格设计的截图](img/9781394164684-fg050308.png)\n\
  \n你可能认为实现这种设计将涉及如下分配：\n\n* 将项目 A 分配到第 1 行的第 1、2、3 列。\n* 将项目 B 分配到第 1 列的第 2 和 3 行。\n\
  * 将项目 C 分配到第 2、3 列的第 2 和 3 行。\n\n#### 确定网格线、轨道和轴\n\n在 CSS 规范中，网格容器不像你预期的那样被分为列和行。相反，网格容器被一系列被称为*网格线（grid\
  \ lines）*的垂直和水平线划分。在图 3-8 中，每条虚线代表一条网格线。在网格容器中，网格线具有以下特征：\n\n* 网格轨道（grid track）*是网格列或网格行的通用术语，定义为两条相邻网格线之间的空间。\n\
  \n\n\n\n\n*   垂直网格轨道——即你我之间的一列——由左侧的垂直网格线和右侧的垂直网格线边界。\n*   水平网格轨道——一行——由上方的水平网格线和下方的水平网格线边界。\n\
  *   垂直网格线从最左侧的网格线开始编号为 1，直到最右侧的网格线，其编号比列数多 1（例如，在三列网格中，最右侧的垂直网格线编号为 4）。\n*   水平网格线从顶部的网格线开始编号为\
  \ 1，直到底部的网格线，其编号比行数多 1（例如，在三行网格中，底部的水平网格线编号为 4）。\n\n图 3-9 显示了应用于来自图 3-8 网格容器的网格线编号。\n\
  \n![截图：CSS 网格通过带编号的垂直和水平线划分网格容器。](img/9781394164684-fg050309.png)\n\n图 3-9： CSS\
  \ 网格通过带编号的垂直和水平线划分网格容器。\n\n因此，我在上一节中提出的特定列和行的项目分配，实际上应该是特定的 `column-line-`（列线-）和\
  \ `row-line-`（行线-）分配：\n\n*   将项目 A 分配为跨越从列线 1 到 4 以及从行线 1 到 2。\n*   将项目 B 分配为跨越从列线\
  \ 1 到 2 以及从行线 2 到 4。\n*   将项目 C 分配为跨越从列线 2 到 4 以及从行线 2 到 4。\n\n鉴于 CSS Grid 是一种二维布局机制，当你发现网格容器有两个轴时，你不会感到任何意外：\n\
  \n*   **块轴（Block axis）：** 网格容器的列网格线运行的垂直轴。\n*   **内联轴（Inline axis）：** 网格容器的行网格线运行的水平轴。\n\
  \n![记住](img/remember.png) 这些定义假设当前语言是水平阅读且从上到下阅读的语言（如英语）。在垂直语言中（如日语和中文），块轴是水平的，内联轴是垂直的。\n\
  \n如果你在心里想：“哇，这看起来并不那么直观，”请知道我完全赞同你的观点！好消息是，CSS Grid 确实提供了一种更直观的方法来分配网格项目（查看“将网格项目分配到命名的网格区域”）；但坏消息是我首先应该完成向你介绍行号分配方法的工作，这是下一节的任务。\n\
  \n### 使用行号分配网格项目\n\n要将网格项目放置在网格容器内的任何位置，你需要指定起始和结束列线编号，以及起始和结束行线编号。因此，对于每个网格项目，你需要设置四个属性值：\n\
  \n```css\nitem {\n  grid-column-start: column-start-value;\n  grid-column-end: column-end-value;\n\
  \  grid-row-start: row-start-value;\n  grid-row-end: row-end-value;\n}\n```\n\n\
  *   `grid-column-start`：指定你希望项目开始的列线的数字。\n*   `grid-column-end`：指定你希望项目结束的列线的数字。例如，如果将\
  \ `grid-column-end` 设置为 `4`，则网格项目在第 3 列结束。注意点：\n    *   如果你省略了此属性，项目将仅使用起始列。\n \
  \   *   值 `-1` 始终指向最右侧的列线。因此，当你声明 `grid-column-end: -1` 时，项目将从其起始列线跨到网格中最右侧的列（即使你随后向网格中添加了更多列）。\n\
  \    *   你可以使用关键字 `span` 后面跟一个空格和一个数字，指定你希望项目跨越网格的列数。例如，以下两组声明是等效的：\n        ```css\n\
  \        grid-column-start: 1;\n        grid-column-end: 4;\n\n        grid-column-start:\
  \ 1;\n        grid-column-end: span 3;\n        ```\n*   `grid-row-start`：指定你希望项目开始的行线的数字。\n\
  *   `grid-row-end`：指定你希望项目结束的行线的数字。例如，如果将 `grid-row-end` 设置为 `3`，则网格项目在第 2 行结束。注意点：\n\
  \    *   如果你省略了此属性，项目将仅使用起始行。\n    *   值 `-1` 始终指向底部的行线。因此，当你声明 `grid-row-end: -1`\
  \ 时，项目将从其起始行线跨到网格中的底部行（即使你之后向网格中添加了更多行）。\n    *   你可以使用关键字 `span` 后面跟一个空格和一个数字，指定你希望项目向下跨越网格的行数。例如，以下两组声明是等效的：\n\
  \        ```css\n        grid-row-start: 2;\n        grid-row-end: 4;\n\n      \
  \  grid-row-start: 2;\n        grid-row-end: span 2;\n        ```\n\n这是一个示例 (bk05ch03/example12.html)，结果显示在图\
  \ 3-10 中：\n\nHTML:\n```html\n<div class=\"container\">\n  <div class=\"item item1\"\
  >1</div>\n  <div class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n\
  \  <div class=\"item item4\">4</div>\n  <div class=\"item item5\">5</div>\n  <div\
  \ class=\"item item6\">6</div>\n</div>\n```\n\nCSS:\n```css\n.container {\n  display:\
  \ grid;\n  grid-template-columns: 15vw repeat(3, 1fr) 20vw;\n  grid-template-rows:\
  \ 15vh 1fr 1fr;\n  height: 100%;\n}\n\n.item1 {\n  grid-column-start: 1;\n  grid-row-start:\
  \ 1;\n}\n\n.item2 {\n  grid-column-start: 2;\n  grid-column-end: 4;\n  grid-row-start:\
  \ 1;\n}\n\n.item3 {\n  grid-column-start: 1;\n  grid-row-start: 2;\n}\n\n.item4\
  \ {\n  grid-column-start: 2;\n  grid-column-end: 5;\n  grid-row-start: 2;\n  grid-row-end:\
  \ -1;\n}\n\n.item5 {\n  grid-column-start: 5;\n  grid-row-start: 2;\n}\n\n.item6\
  \ {\n  grid-column-start: 5;\n  grid-row-start: 3;\n}\n```\n\n![提示](img/tip.png)\
  \ CSS Grid 还提供了两个简写属性，可以使列和行的分配过程更加简洁：\n\n```css\nitem {\n  grid-column: column-start-value\
  \ / column-end-value;\n  grid-row: row-start-value / row-end-value;\n}\n```\n\n\
  #### 在浏览器开发工具中显示网格线编号\n\n网格越复杂，跟踪列和行编号就越困难。不过不用担心，你的浏览器会支持这一点。具体来说，浏览器的开发工具提供了一项功能，可以将列和行编号覆盖在你的网格容器上，以便你直观地看到发生的情况。\n\
  \n以下是在 Google Chrome 中（所有主流浏览器的步骤都类似）检查网格容器线的步骤：\n\n1.  **在网格容器内部任何地方右键点击，然后点击“检查”（Inspect）。**\n\
  \    打开开发工具。\n2.  **在 Elements（元素）选项卡中，点击 Layout（布局）。**\n3.  **在 Grid 部分的 Overlay\
  \ Display Settings ，确保下拉列表中选择了 Show Line Numbers（显示行号）。**\n4.  **在 Grid Overlays\
  \ 列表中，勾选你的网格容器旁边的复框。**\n    浏览器会将编号覆盖在你的网格容器上，如图 3-11 所示。\n\n![截图：使用浏览器开发工具可视化网格容器的列和行编号。](img/9781394164684-fg050311.png)\n\
  \n图 3-11： 使用浏览器开发工具可视化网格容器的列和行编号。\n\n\n\n\nCSS Grid 面临着直觉问题。也就是说，虽然 Grid 的基础知识很容易掌握，但你的代码实际在执行的操作往往难以理解。例如，考虑上一节中的网格容器定义：\n\
  \n```css\n.container {\n  display: grid;\n  grid-template-columns: 15vw repeat(3,\
  \ 1fr) 20vw;\n  grid-template-rows: 15vh 1fr 1fr;\n}\n```\n\n当你第一次看到这样的代码时，你可能大致能感觉到它的作用，但大概率是，这种大概的感觉与图\
  \ 3-10 中显示的最终成品完全不像。\n\n提到图 3-10 中的网格，你可能多或少直观感觉到每个网格项目（grid item）的用途：项目 1 可能是网站\
  \ Logo；项目 2 可能是页眉；项目 3 可能是导航区域；项目 4 可能是主内容；项目 5 和 6 可能是侧边栏或广告。\n\n以项目 3 为例，现在看看上一节中的赋值代码：\n\
  \n```css\n.item3 {\n  grid-column-start: 1;\n  grid-row-start: 2;\n  grid-row-end:\
  \ -1;\n}\n```\n\n这告诉了你关于该项目的什么信息？不多！当然，只要花一点精力，你可以算出该项目在网格中的尺寸和位置，但这正是我的观点：这需要费精力。现在想象一下将这种精力乘以网格中的所有六个项目。想象一下，如果你的网格包含十几个项目呢？算了吧！\n\
  \n幸运的是，CSS 的的大师们怜悯了我们所有人，设计了第二种分配网格项目的方法：*命名网格区域（named grid areas）*。这些正如其名所示：网格中的矩形区域，你为这些区域提供语义化或描述性的名称。然后你将每个网格项目分配给每个命名区域，就完成了。这是一个非常棒且直观的\
  \ Grid 特性，接下来的两节将解释你所需要的所有知识。\n\n### 设置命名网格区域\n\n使用命名网格区域时，你的首要任务是进行实际命名。在确定了网格模板后，你对网格容器应用\
  \ `grid-template-areas` 属性：\n\n```css\ngrid-template-areas:\n  \"first row named\
  \ areas\"\n  \"second row named areas\"\n  \"etc.\"\n  \"bottom row named areas\"\
  ;\n```\n\n*   `row named areas`: 为行中的每个单元格提供一个名称，并遵循以下指南：\n    *   值中每个由引号包围的行代表网格中的某一行。\n\
  \    *   如果一个命名区域跨越 X 列，则在该行的字符串中重复该名称 X 次。\n    *   如果命名区域跨越 X 行，则在连续的行字符串中重复该名称\
  \ X 次。\n    *   为了方便直观查看网格结构，请在声明中将每行的命名区域单独写在一行中。\n    *   若要留空一个单元格，请使用点 `.` 代替名称。\n\
  \    *   为网格中的每个单元格输入一个名称（或点）。\n    *   你只能定义矩形的命名区域。\n    *   如果你在网格的某部分定义了一个命名区域，则不能在网格的其他地方使用相同的名称。\n\
  \n命名网格区域在抽象层很难解释，但在实践中很容易理解。为此，以下是我将如何为图 3-10 中显示的网格命名区域进行命名：\n\n```css\n.container\
  \ {\n  display: grid;\n  grid-template-columns: 15vw repeat(3, 1fr) 20vw;\n  grid-template-rows:\
  \ 15vh 1fr 1fr;\n  grid-template-areas:\n    \"logo header header header header\"\
  \n    \"nav content content content sidebar\"\n    \"nav content content content\
  \ ad\";\n}\n```\n\n以下是 `grid-template-area` 值中发生的情况：\n\n*   **第一行**：第一个单元格是一个名为\
  \ `logo` 的区域；接下来的四个单元格组成一个名为 `header` 的区域。\n*   **第二行**：第一个单元格是名为 `nav` 的区域的一部分；接下来的三个单元格是名为\
  \ `content` 的区域的一部分；最右侧的单元格是一个名为 `sidebar` 的区域。\n*   **第三行**：第一个单元格是名为 `nav` 的区域的第二部分；接下来的三个单元格形成了名为\
  \ `content` 的区域的剩余部分；最右侧的单元格是一个名为 `ad` 的区域。\n\n接下来，将每个项目分配给命名区域。\n\n### 将项目分配到区域\n\
  \n定义命名区域后，你的最后一个任务是使用 `grid-area` 属性将每个网格项目分配到这些命名区域之一：\n\n```css\n.item {\n  grid-area:\
  \ name;\n}\n```\n\n*   `name`：你想要分配给项目的命名区域。此名称必须是你在网格容器的 `grid-template-areas`\
  \ 属性中指定的名称之一。\n\n例如（查看 bk05ch03），以下代码将网格项目分配给区域：\n\n```css\n.item1 {\n  grid-area:\
  \ logo;\n}\n.item2 {\n  grid-area: header;\n}\n.item3 {\n  grid-area: nav;\n}\n\
  .item4 {\n  grid-area: content;\n}\n.item5 {\n  grid-area: sidebar;\n}\n.item6 {\n\
  \  grid-area: ad;\n}\n```\n\n我认为你会同意，这种代码比分配项目要易读得多。\n\n### 在浏览器中显示命名区域\n\n命名网格区域是设置网格的一种直观的方法。然而，网格越复杂，越容易引入问题。如果你只是想检查命名区域是否正常，请在\
  \ Chrome 中遵循以下步骤（所有主流浏览器大同小异）来叠加你的网格：\n\n1.  在网格容器内部任何地方右键并点击检查（Inspect）。\n2.  在\
  \ `Elements` 标签页中，点击 `Layout`。\n3.  在 `Grid` 部分，选择 `Hide Labels`。\n4.  勾选 `Show\
  \ Area Names`。\n5.  在 Grid Overlays 列表中，选中你网格容器图 3-12 旁的复选框。\n\n![使用开发者工具查看网格容器的命名区域](img/9781394164684-fg050312.png)\n\
  \n## 让你的网格排成行（或列）：对齐内容\n\nCSS Grid 提供了几种属性可以用来对齐网格中的内容。Grid 的对齐属性分为两个大类：\n\n*  \
  \ **Direction（方向）**：执行对齐的轴：\n    *   **Justify（对准）**：沿网格容器的内联轴（inline）。\n    * \
  \  **Align（对齐）**：沿网格容器的块轴（block）。\n*   **Target（目标）**：应用对齐的网格部分：\n    *   **Content（内容）**：对网格中的所有列或所有行进行对齐。\n\
  \    *   **Items（项目）**：对赋值网格区域内的单个网格项目进行对齐。\n\n根据上述分类，CSS Grid 定义了四个对齐属性：\n\n* \
  \  `justify-content`：沿所有网格列的内联轴设置对齐。语法图 3-13 展示了每个值：\n\n```css\ncontainer {\n  justify-content:\
  \ start|center|end|stretch|space-around|space-between|space-evenly;\n}\n```\n\n\
  *   `align-content`：沿所有网格行的块轴设置对齐。语法图 3-14 展示了这些值：\n\n```css\ncontainer {\n  align-content:\
  \ start|center|end|stretch|space-around|space-between|space-evenly|baseline;\n}\n\
  ```\n\n\n\n\n![Remember](img/remember.png) 为了让 `align-content`（或下方的 `align-items`）生效，你需要为网格容器设置一个高度——具体来说，是一个是一个大于所有行自然高度之和的高度。如果没有这个自定义高度，浏览器设置的容器高度将恰好容纳这些行，因此没有额外的空间让\
  \ `align-content`（或 `align-items`）发挥作用。此外，在图 3-14（以及图 3-16 显示了每个值的效果）：\n\n    ```\n\
  \    container {\n      justify-items: start|center|end|stretch;\n    }\n    ```\n\
  \n*   `align-items`: 设置每个网格项目在其网格区域内沿块级轴（block axis）的对齐方式。其语法如下（图 3-16 尝试了每个值）：\n\
  \n    ```\n    container {\n      align-items: start|center|end|stretch|baseline;\n\
  \    }\n    ```\n\n![justify-content 属性值的实际演示。](img/9781394164684-fg050313.png)\n\
  图 3-13: `justify-content` 属性值的实际演示。\n\n![align-content 属性值的展示。](img/9781394164684-fg050314.png)\n\
  图 3-14: `align-content` 属性值的展示。\n\n![justify-items 属性值的实际演示。](img/9781394164684-fg050315.png)\n\
  图 3-15: `justify-items` 属性值的实际演示。\n\n![align-items 属性值的展示。](img/9781394164684-fg050316.png)\n\
  图 3-16: `align-items` 属性值的展示。\n\n# 第 4 章\n\n# 创建响应式布局\n\n## 本章内容\n\n*   ![Bullet](img/check.png)\
  \ **使用 Flexbox、Grid 和视口单位实现流式布局**\n*   ![Bullet](img/check.png) **使用媒体查询、容器查询和用户偏好查询实现自适应布局**\n\
  *   ![Bullet](img/check.png) **让你的页面具有响应式**\n*   ![Bullet](img/check.png) **响应式交付图像**\n\
  *   ![Bullet](img/check.png) **了解移动优先的布局方法**\n\n我们可以为了最佳的视觉体验进行设计，并在设计中嵌入基于标准的技术，使它们不仅更加灵活，而且更适应渲染它们的介质。很可能，你所有的或大部分网页代码都是在相对较大的屏幕上完成的，无论是使用全尺寸桌面显示器还是笔记本电脑屏幕。当然，这没有问题，但它可能会（而且确实会导致）一个大问题：你构建的网页只在大屏幕屏幕上看起来良好且运行正常。为什么这是一个问题呢？简单的原因是，你页面的访问者将使用各种尺寸的设备，从\
  \ 60 英寸电视到 27 英寸桌面显示器，一直到 5 英寸智能手机。在现代网页中，一种尺寸并不能适应所有，因此你需要构建你的页面，让每个人都能获得良好的用户体验。\n\
  \n在本章中，你将学习如何使用 Flexbox 和 Grid 通过几个属性让你的布局变为流式；如何使用查询让你的布局具有自适应性；如何考虑到响应式交付图像；以及深入研究页面布局中最大的趋势：移动优先方法。\n\
  \n## 什么是响应式布局？\n\n为了让你的网页在任何尺寸的屏幕上看起来良好且运行良好，你需要通过响应式规划页面。响应式网页会改变其布局、样式，通常还有内容，以确保页面在读者使用的任何屏幕尺寸或设备类型上都能工作。\n\
  \n为了理解为什么你需要从网页开始就开始编写响应式代码，请考虑你可能使用的两种主要的非响应式布局：\n\n*   固定宽度（Fixed-width）：内容宽度设置为固定大小的布局。在这种情况下，如果固定大于屏幕宽度，用户通常必须水平滚动才能看到内容，如图\
  \ 4-1 所示（检查 `05ch04/example01.html`）。\n*   无宽度（No-width）：内容没有设置宽度的布局。你可能认为没有宽度会让文本和图像在小屏幕上很好地换行，你是对的。然而，问题出在较大的屏幕上，你的文本行会扩展并填充整个浏览器宽度，如图\
  \ 4-2 所示（检查 `05ch04/example02.html`），这些行可能会变得长得离谱，以至于扫描这些行变得不可能。\n\n你可以将上述两种场景描述为“不在乎”布局，因为它们一种都不关心正在使用什么设备或屏幕尺寸。如果你不想做一个“不在乎”的开发者，你需要在从一开始就在你的网页中建立“关注”意识。你该怎么做呢？在你写的每行代码中，都要考虑以下所有（而非是部分）因素：\n\
  \n*   设备类型：如今，访问你页面的人可能正在使用手机、平板电脑、笔记本电脑、桌面计算机或现在提供的各种“智能”设备：电视、手表、冰箱、割草机等。所有这些设备都有不同的尺寸，你的目标应该是设计页面，使其在每个屏幕尺寸上看起来良好且运行良好。\n\
  *   浏览器窗口大小：并不是每个访问页面的电脑用户都会最大化浏览器窗口。有些人喜欢较小的窗口；另一些人使用操作系统的分屏功能；还有人根据页面内容动态调整浏览器窗口。关键在于，你不能按照访问者只会使用常用视口尺寸来设计页面。\n\
  *   屏幕方向：智能手机和平板电脑用户可以轻松将设备从竖屏切换到横屏，某些“云台”（或“旋转”）显示器也可以同样的切换。你的页面需要优雅地处理方向之间的切换，而不费吹灰。\n\
  *   用户缩放比例：有些人会在放大浏览器缩放比例的情况下上网。也就是说，而不是默认的 100% 缩放比例，有些人使用 125%、150% 甚至 200%。当用户调大缩放比例时，你的页面仍然应该是可读且可用的。\n\
  \n![当具有固定宽度时，小屏幕用户必须水平滚动才能看到内容。](img/9781394164684-fg050401.png)\n\n\n\n\n\n# 响应式设计原则\n\
  \n- **用户默认字体大小**：有些人并不是通过放大比例（或者有时也会这样做），而是将默认字体从 `16px` 增加到 `20px`、`24px`、`32px`\
  \ 甚至更高。你的页面不仅应该尊重这种变化（不要使用绝对单位，如像素，来设置字体大小），还应该在这些较大的字体下看起来良好并能正常工作。\n\n- **用户偏好**：访问你页面的人中许多人自定义了操作系统，使用如深色模式、高对比度颜色和减少动画效果等设置。你的页面应该通过检查这些偏好并在检测到时实施必要的\
  \ CSS 来尊重这些偏好。\n\n- **设备和网络性能**：许多人使用性能有限的设备、缓慢的网络连接和有限的带宽浏览网页。你的页面不应该因为负担不必要的数据或功能而忽视这些人。\n\
  \n![Tip](img/tip.png) 你可以使用浏览器的开发工具来模拟较慢的网络速度。在 Chrome（以及大多数其他浏览器也类似）中，打开开发工具（例如，右键点击页面并点击\
  \ `Inspect`），点击 `Network` 选项卡，点击 `Throttling` 列表（默认显示 `No Throttling`），然后选择网络速度：Fast\
  \ 3G、Slow 3G 甚至 Offline。你也可以点击 `Add` 创建自定义的节流配置。要模拟较慢的设备 CPU，点击 `Performance` 选项卡，点击\
  \ `Capture Settings`（齿轮图标），然后使用 `CPU` 列表选择减速选项（`4x Slowdown` 或 `6x Slowdown`）。现在你可以重新加载页面，测试在开启这些模拟减速时的性能。\n\
  \n响应式网页是指能够成功处理所有这些场景的页面。这听起来可能是一项艰巨的任务，但现代 CSS 足够强大，你可以通过采用以下方法之一来实现大部分的响应式目标：\n\
  \n- **流式布局 (Fluid layout)**：一种响应浏览器环境的小变化（如视口大小变化）平滑调整的布局。\n\n- **自适应布局 (Adaptive\
  \ layout)**：仅在满足某些预定义标准时才调整的布局，例如视口宽度超过指定的阈值。\n\n![Remember](img/remember.png) 注意，这些并不是二选一的。相对简单的页面可能只使用流式或仅使用自适应技术，但更复杂的页面可能会结合这两种技术的元素。\n\
  \n接下来的两个部分将详细解释流式布局和自适应布局。\n\n## 顺势流动：流式布局\n\n响应式设计的早期完全围绕桌面端与移动端用户展开，至于 CSS 设计师被要求构建两个完全独立的网站：一个在桌面设备上运行良好的网站，另一个针对移动端用户优化的网站。\n\
  \n那种策略无疑是疯狂的，但在现代 Web 开发圈中仍然留有这种桌面端/移动端二元论的痕迹。在那里，使用响应式技术（通常是媒体查询；请查看本章稍后章节的 `通过查询实现响应式：自适应布局`\
  \ 部分）来确保页面在移动设备屏幕和桌面显示器上最大化的浏览器窗口中看起来良好，但仅此而已。但我向你保证，大部分用户将使用介于这些尺寸之间的浏览器窗口访问你的页面。\n\
  \n为了确保无论用户的浏览器窗口有多大，甚至当用户动态更改窗口大小时，你的页面都能良好且正常工作，你需要使用流式布局技术来构建页面。到底什么是流式布局？这是一个大课题，但就本节而言，我可以将其缩小为以下几点：\n\
  \n- 块级元素自然填充可用空间。\n- 块级元素随着视口的扩大而扩展，随着视口的缩小而收缩。\n- 块级元素随着视口的变小自然地换到多行（或多列）。\n- 大字体（非正文文本）随视口伸缩。\n\
  - 图像大小随视口伸缩。\n\n在理想的流式布局中，你使用 CSS 为网络浏览器提供一些关于你希望布局如何运行的准则，然后将剩下的工作交给浏览器处理。\n\n\
  ### Flexbox 如何让页面变为流式\n\n创建流式布局你可以使用的最佳策略是为一维布局部署 Flexbox，为二维布局部署 CSS Grid。我将在下一节中讨论\
  \ CSS Grid，但在这里我关注基于 Flexbox 布局固有的响应性。（有关 Flexbox 的所有细节请查看第 5 本 `Chapter 2`）。\n\n\
  首先，你可以通过为每个 flex 项目添加单个声明，让 flex 项目自然地填充 flex 容器中的可用空间，并随视口伸缩：\n\n```css\nflex:\
  \ 1;\n```\n\n这等同于设置以下三个声明：\n\n```css\nflex-grow: 1;\nflex-shrink: 1;\nflex-basis:\
  \ 0;\n```\n\n`flex-grow: 1` 允许项目在视口大小变化时沿主轴扩展；`flex-shrink: 1` 允许项目在视口大小变化时沿主轴收缩；而\
  \ `flex-basis: 0` 对项目的大小没有尺寸限制（除了不缩小到最小内容尺寸之外）。\n\n如果你所有的 flex 项目都具有相似的内容和相似的盒模型属性（内边距等），那么在每个项目上设置\
  \ `flex: 1` 意味着你最终将等宽的列（如果你使用 `flex-direction: row`）或等高的行（如果你使用 `flex-direction:\
  \ column`）。\n\n\n\n\n代码还为 `article` 元素设置了最小宽度（`22rem`），为 `aside` 元素设置了最小宽度（`16rem`），因此当浏览器视口宽度低于\
  \ `38rem`（两个元素的最小宽度之和）时，`main` 元素的 `flex-wrap: wrap` 就会生效，`aside` 元素发生换行，此时你就有了单列布局，如图\
  \ 4-4 所示。\n\n![较小视口的截图，由于 aside 元素已换行（右侧），main 元素变为单列（左侧）。](img/9781394164684-fg050404.png)\n\
  \n图 4-4： 在较小的视口中，由于 aside 元素已换行（右侧），main 元素变为单列（左侧）。\n\n### 借助 CSS Grid 如何让页面具有流活性\n\
  \n根据页面内容，CSS Grid 是将静态布局转换为流体布局的极佳选择。（查看第 5 本第 3 章 了解 CSS Grid 的工作原理。）Grid 有许多构建响应式的选项，但在大多数情况下，以下三种技术可以帮你实现目标：\n\
  \n*   使用 `fr` 单位允许网格项目填充网格容器中的可用空间。\n*   通过仅指定列或行模板（而不是两者都指定），让浏览器为你完成部分工作。\n* \
  \  在模板中使用 `auto-fit` 关键字，让浏览器自动执行列宽或行高的计算。\n\n例如，以下声明告诉浏览器自动使用等宽的（`1fr`）列来适应容器宽度，且列宽不小于\
  \ `15rem`：\n\n`grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));`\n\n\
  这是一个应用该声明的示例（bk05ch04/example04.html）：\n\nHTML（缩写版）：\n\n```html\n<header>\n  <h1>语言生动的边缘</h1>\n\
  \  <p class=\"subtitle\">在其中，我们无畏的作家们尽情谈论各种形式的文字游戏</p>\n</header>\n<main>\n  <p>\n\
  \    我们对英语单词的幽默效果有着根深蒂固的，不仅在广告语中，而且在最高水平的追求中。<br>—BILL BRYSON, *The Mother Tongue*,\
  \ 1990\n  </p>\n  <p>等等。</p>\n</main>\n```\n\nCSS:\n\n```css\nmain {\n  display:\
  \ grid;\n  grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));\n  gap:\
  \ 2rem;\n}\nmain > p:nth-child(even) {\n  background: hsl(208deg 50% 80%);\n}\n\
  ```\n\n在较大的屏幕上，`main` 元素是一个四列网格，如图 4-5 所示。\n\n稍微缩小视口宽度，布局会自动切换到三列网格，如图 4-6 所示。\n\
  \n![桌面浏览器视口中网格布局的截图。](img/9781394164684-fg050405.png)\n\n图 4-5： 桌面浏览器视口中的网格布局。\n\
  \n![平板电脑视口中网格布局的截图。](img/9781394164684-fg050406.png)\n\n图 4-6： 平板电脑视口中的网格布局。\n\n\
  进一步缩小视口宽度，布局最终会自动切换到两列布局，然后是单列布局，如图 4-7 所示。\n\n![智能手机视口中网格布局的截图。](img/9781394164684-fg050407.png)\n\
  \n图 4-7： 智能手机视口中的网格布局。\n\n### 利用视口单位\n\n在布局中构建流性的最简单方法之一是使用第 3 本第 5 章中提到的视口单位。这里再次列出（参见表\
  \ 4-1）：\n\n| **单位** | **名称** | **测量相对于** |\n| --- | --- | --- |\n| `vw` | 视口宽度 |\
  \ 视口宽度的 1/100 |\n| `vh` | 视口高度 | 视口高度的 1/100 |\n| `vmin` | 视口最小 | 视口较小维度的 1/100\
  \ |\n| `vmax` | 视口最大 | 视口较大维度的 1/100 |\n\n表 4-1 CSS 视口测量单位\n\n我还应该提到一些在大多数主流浏览器中可用了一段时间、但尚未获得通用支持的新视口单位。创建这些视口单位是为了处理一个不便：当你向下滚动页面时，大多数移动浏览器会隐藏其用户界面（UI）功能（如工具栏和地址/搜索栏），然后在向上滚动时又显示这些功能。这意味着你实际上在处理三个视口：\n\
  \n*   **小视口 (Small viewport)**：这是当浏览器 UI 显示时可用的视口。这个视口之所以“小”，是因为浏览器 UI 占据了屏幕的一部分。\n\
  *   **大视口 (Large viewport)**：这是浏览器 UI 隐藏时可用的视口。这个视口之所以“大”，是因为浏览器 UI 不再占据屏幕空间。\n\
  *   **动态视口 (Dynamic viewport)**：这是当前显示的浏览器视口，根据用户的滚动行为，它可以是小的也可以是大的。\n\n基于这些视口，表\
  \ 4-2 列出了基于这些尺寸的新单位：\n\n| **单位** | **名称** | **测量相对于** |\n| --- | --- | --- |\n|\
  \ `svw` | 小视口宽度 | 小视口宽度的 1/100 |\n| `svh` | 小视口高度 | 小视口高度的 1/100 |\n| `svmin` |\
  \ 小视口最小 | 小视口较小维度的 1/100 |\n| `svmax` | 小视口最大 | 小视口较大维度的 1/100 |\n| `lvw` | 大视口宽度\
  \ | 大视口宽度的 1/100 |\n| `lvh` | 大视口高度 | 大视口高度的 1/100 |\n| `lvmin` | 大视口最小 | 大视口较小维度的\
  \ 1/100 |\n| `lvmax` | 大视口最大 | 大视口较大维度的 1/100 |\n| `dvw` | 动态视口宽度 | 动态视口宽度的 1/100\
  \ |\n| `dvh` | 动态视口高度 | 动态视口高度的 1/100 |\n| `dvmin` | 动态视口最小 | 动态视口较小维度的 1/100 |\n\
  | `dmax` | 动态视口最大 | 动态视口较大维度的 1/100 |\n\n\n\n\n\n这种计算适用于正文。对于标题，你需要进行一些尝试，以确定最适合你页面的样式。例如，`h1`\
  \ 元素可以使用以下声明：\n\n```\nfont-size: calc(1.75rem + 2vmax);\n```\n\n### 介绍你最好的流体朋友：`clamp()`\n\
  \n使用视口单位（viewport units）处理长度和字体大小的问题在于，你会失去对所处理属性最终值的某些控制权。当然，这是设计意为之的，因为流体布局的价值主之一就是将部分控制权交给浏览器，让它承担更多响应式设计的繁重工作。\n\
  \n然而，基于视口的尺寸虽然在中间屏幕尺寸下看起来良好，但在最小的视口宽度下可能会变得小到无法阅读，而在面对最大的视口时又变得大得谱。幸运的是，你可以转向强大的\
  \ `clamp()` 函数（查看第三本书的第 5 章），为你的流体计算设置最小值和最大值。\n\n例如，如果你希望正文的最小尺寸是 `1.25rem`，最大尺寸是\
  \ `1.75rem`，那么以下 `clamp()` 函数可以胜任（bk05ch04/example06.html）：\n\n```\nfont-size: clamp(1.25rem,\
  \ 0.75rem + 1vmax, 1.75rem);\n```\n\n## 通过查询实现响应式：自适应布局\n\n在第四本书的第 4 章中，我讨论了如何使用\
  \ `if…else` 语句控制 JavaScript，当指定的表达式为真时，脚本运行一段代码；如果表达式为假，则运行另一段代码。\n\nCSS 有类似的机制称为\
  \ `query`（查询），你对其测试特定条件，如果该条件为真，浏览器就会应用一个或多个样式；如果条件为假，浏览器就会直接跳过这些样式。（因此，查询就像一个不带\
  \ `else` 部分的 JavaScript `if` 语句。）\n\nCSS 许多查询类型，但就你的用途而言，可以考虑以下三种：\n\n*   **媒体查询（Media\
  \ query）：** 询问屏幕某些特性的查询，通常是视口宽度\n*   **容器查询（Container query）：** 检查父元素或祖先元素的某些特性，例如元素的宽度或方向\n\
  *   **用户偏好查询（User preference query）：** 一种特殊的媒体查询，检查用户是否声明了对特定特性的偏好，例如深色模式\n\n在每种情况下，核心都是使用查询来创建一个`自适应布局`（adaptive\
  \ layout），即根据查询结果而改变的布局。在每种情况下，你都可以指定一个在查询为真时浏览器应用的声明块。这使得自适应布局比流体布局更强大，因为当查询为真时，你可以应用任何需要的\
  \ CSS 规则：\n\n*   你可以隐藏一个显示元素或显示一个隐藏元素。\n*   你可以修改现有的布局，例如将三列网格改为一列或两列。\n*   你可以切换到完全不同的布局类型，例如从\
  \ `Grid` 切换到 `Flexbox`。\n*   如果你在使用 `Flexbox`，可以更改元素的顺序。\n*   你可以修改任何 CSS 属性，如 `font-size`、`width`\
  \ 和 `margin`。\n\n接下来的三个章节将带你每个查询类型的细节。\n\n### 使用媒体查询询问屏幕\n\n到为止最常见的自适应布局类型使用一种名为\
  \ `媒体查询`（media query）的 CSS 特性，即 `@media` 规则，这是一个求值为真或假的表达式，以及一个由一个或多个样式规则组成的代码块。该表达式询问视口的某些特性，通常是它的宽度。如果该表达式对当前设备为真，浏览器就会应用媒体查询的样式规则；如果表达式为假，浏览器将忽略媒体查询的规则。语法如下：\n\
  \n```\n@media (expression) {\n  declarations\n}\n```\n\n*   `expression`: 浏览器用于测试当前设备视口的属性值对\n\
  *   `declarations`: 浏览器在 `expression` 为真时应用的样式声明\n\n`expression` 有许多可能，但大多数媒体查询测试视口宽度小于或等于某个值，或大于或等于某个值。\n\
  \n要测试视口宽度大于或等于某个值，使用 `min-width` 属性：\n\n```\n@media (min-width: value) {\n  declarations\n\
  }\n```\n\n*   `value`: 使用任何标准 CSS 测量单位的长度值\n\n要测试视口宽度小于或等于某个值，使用 `max-width` 属性：\n\
  \n```\n@media (max-width: value) {\n  declarations\n}\n```\n\n*   `value`: 使用任何标准\
  \ CSS 测量单位的长度值。\n\n这是一个示例（bk05ch04/example07.html）：\n\nHTML:\n```html\n<header>\n\
  \  <img src=\"images/notw.png\" alt=\"News of the Word logo\" class=\"site-logo\"\
  >\n  <h1>News of the Word</h1>\n  <p class=\"subtitle\">你可以在任何地方都找不到的语言新闻（这有其道理的！)</p>\n\
  </header>\n```\n\nCSS:\n```css\n@media (max-width: 40rem) {\n  .site-logo {\n  \
  \  display: none;\n  }\n}\n```\n这个媒体查询查找宽度为 `40rem` 的视口。当条件为真时，查询内部的规则对 `.site-logo`\
  \ 运行，将 `display` 属性设置为 `none`。\n\n### 使用容器查询布局“树”而非“森林”\n\n我在上一节中提到的媒体查询至少从 2009\
  \ 年起就是 CSS 布局的基础，甚至被 Internet Explorer 9 及更高版本所支持。媒体查询相比于我之前讨论的流体技术（查看“顺应潮流：流体布局”）的主要优势是，当媒体查询表达式为真时，你可以编写非常具体的样式规则，让浏览器应用到一个或多个元素上。\n\
  \n但媒体查询虽然仍然有用且相关，由于两个原因，开始显得有些老旧了：\n\n*   媒体查询几乎总是询问整个视口的大小。\n*   现代网页设计聚焦于“组件”的概念，组件是一组独立的元素集合，特别是在不同语文中被复用的元素。\n\
  \n例如，一个产品组件可能包含产品照片、一个带有产品名称的标题、描述产品的正文文本以及与产品相关的操作按钮。以下是该组件可能被使用的示例上下文：\n\n*  \
  \ 在产品落地页上，此组件可能占据视口的大部分区域。\n*   在网站首页上，产品可能会以大卡片的形式突出显示。\n\n\n\n\n\n* 在产品目录页面上，组件可能是一个中型卡片。\n\
  * 在网站的导航侧边栏中，组件可能是一个小卡片，也许没有图片。\n\n这些不同的上下文要求组件有不同的布局。媒体查询（Media queries）在这种场景下效果并不好，因为它们只检查整个视口的大小，而在上述的任何一个环境中，视口的大小可能都不会改变。\n\
  \n因此，整个 CSS 社区对一种名为 `container queries`（容器查询）的新型自适应布局技术感到兴奋并不意外。这些查询允许你检查父元素的宽度（以及其他几个属性，该元素正是由于这些查询命名的容器），每当该宽度（或其他任何属性）满足你的指定标准时，对子元素和后代元素应用样式规则。\n\
  \n例如，假设你的产品组件封装在一个父元素（如一个 `div`）中，那么容器查询将检查该 `div` 的宽度，并根据结果对子元素和后代元素——图片、标题、文本和链接——应用不同的样式。\n\
  \n![Warning](img/warning.png) 在我写这些文字时，容器查询刚刚获得所有主流浏览器的支持，因此它们尚未准备好投入生产。然而，当你读到这里时，容器查询很有可能已经获得了几乎普及的支持（例如超过\
  \ 90%），所以请查看以下 Can I Use 页面以了解最新进展：[`https://caniuse.com/css-container-queries`](https://caniuse.com/css-container-queries)。\n\
  \n### 设置查询容器\n\n要使用容器查询，你首先需要将一个元素设置为查询容器。它将成为你想要样式的子元素或后代元素的父级或祖先。要将元素设置为查询容器，请使用\
  \ `container-type` 属性：\n\n```css\nelement {\n  container-type: value;\n}\n```\n\n\
  * `element`: 你想要样式的元素的父级或祖先。\n* `value`: 如果在容器查询中只想检查容器的宽度（假设为水平内联方向），请使用 `inline-size`。如果你想在容器查询中检查宽度和/或高度，请使用\
  \ `size`。\n\n这是一个示例 (`bk05ch04/example08.html`)，它为产品卡片设置了默认布局：\n\nHTML:\n```html\n\
  <div class=\"card-container\">\n  <div class=\"card-wrapper\">\n    <img class=\"\
  card-image\" src=\"images/inflatable-dartboard.png\" alt=\"充气飞镖盘产品照\">\n    <div>\n\
  \      <h3 class=\"card-title\">充气飞镖盘</h3>\n      <p class=\"card-description\"\
  >\n        是的，这是世界闻名的充气飞镖盘！安装非常方便！带有一个易于使用的充气管。只需深吸气并吹。继续吹。一直吹。总之，在几小时内，你就可以准备好玩飞镖了。现在仅需\
  \ $1,999！补丁包单独出售。\n      </p>\n      <div class=\"card-actions\">\n        <button\
  \ class=\"card-button learn-more\">了解更多</button>\n        <button class=\"card-button\
  \ add-to-cart\">加入购物车</button>\n      </div>\n    </div>\n  </div>\n</div>\n```\n\
  \nCSS:\n```css\n.card-container {\n  container-type: inline-size;\n}\n.card-wrapper\
  \ {\n  display: grid;\n  gap: 1.5rem;\n  grid-template-columns: auto auto;\n  grid-template-rows:\
  \ auto;\n}\n.card-image {\n  min-width: auto;\n  height: auto;\n  object-fit: cover;\n\
  \  object-position: center;\n  overflow: hidden;\n}\n.card-title {\n  text-align:\
  \ left;\n}\n.card-actions {\n  display: flex;\n  gap: 1rem;\n  justify-content:\
  \ flex-start;\n}\n```\n\n特别值得注意的是类为 `card-container` 的父级 `div`。该 `div` 在 CSS 中被样式化查询容器：\n\
  \n```css\n.card-container {\n  container-type: inline-size;\n}\n```\n\n图 4-10 显示了默认卡片。\n\
  \n![默认布局下的产品卡片截图。](img/9781394164684-fg050410.png)\n\n图 4-10： 默认布局下的产品卡片。\n\n![Tip](img/tip.png)\
  \ 我应该指出，如果你在页面上有多个查询容器，你需要通过向容器元素添加 `container-name` 属性来为每个容器命名：\n\n```css\nelement\
  \ {\n  container-type: value;\n  container-name: name;\n}\n```\n\n### 查询容器\n\n设置好查询容器后，你就可以使用\
  \ `@container` 规则对其进行查询：\n\n```css\n@container (expression) {\n  declarations\n\
  }\n```\n\n* `expression`: 浏览器用于测试容器某些属性（如宽度）的表达式\n* `declarations`: 浏览器在 `expression`\
  \ 为真时应用的样式声明\n\n例如，这里是上一节中容器宽度小于 `25rem` 时应用样式规则的产品片容器查询：\n\n```css\n@container\
  \ (width < 25rem) {\n  .card-wrapper {\n    align-items: center;\n    display: block;\n\
  \    padding: 1rem;\n  }\n  .card-image {\n    display: none;\n  }\n  .card-title\
  \ {\n    margin-top: 0;\n  }\n}\n```\n\n图 4-11 显示了容器宽度小于 `25rem` 时生成的卡片。\n\n![父元素宽度小于\
  \ 25rem 时的产品卡片布局截图。](img/9781394164684-fg050411.png)\n\n图 4-11： 父元素宽度小于 25rem 时的产品卡片布局。\n\
  \n与媒体查询一样，你也可以在容器查询中使用多个表达式。使用 `and` 隔开表达式，以便仅在每个表达式都为真时应用规则；使用 `or` 隔开表达式，以便在至少有一个表达式为真时应用规则。\n\
  \n这里是上一节中产品卡片的容器查询，当容器宽度大于 `25rem` 且小于 `35rem` 时应用样式规则：\n\n```css\n@container (width\
  \ > 25rem) and (width < 35rem) {\n  .card-wrapper {\n    grid-template-columns:\
  \ auto;\n    grid-template-rows: auto auto;\n  }\n  .card-image {\n    width: 100%;\n\
  \    height: 10rem;\n  }\n  .card-title {\n    text-align: center;\n  }\n  .card-actions\
  \ {\n    justify-content: center;\n  }\n}\n```\n\n图 4-12 显示了容器宽度在 `25rem` 到 `35rem`\
  \ 之间时生成的卡片布局。\n\n![父元素宽度在 25rem 到 35rem 之间的产品卡片布局截图。](img/9781394164684-fg050412.png)\n\
  \n图 4-12： 父元素宽度在 25rem 到 35rem 之间的产品卡片布局。\n\n### 使用容器查询单位\n\n设置好查询容器后，你可以自由使用 `container\
  \ query units` 来调整该元素子元素和后代元素的大小，这些单位是相对于查询容器尺寸的测量单位。表 4-3 列出了你可以使用的可用容器查询单位。\n\n\
  | **单位** | **名称** | **相对于...测量** |\n| --- | --- | --- |\n| `cqw` | 容器宽度 | 容器宽度的\
  \ 1/100 |\n| `cqh` | 容器高度 | 容器高度的 1/100 |\n| `cqmin` | 容器最小 | 容器较小维度的 1/100 |\n\
  | `cqmax` | 容器最大 | 容器较大维度的 1/100 |\n\n表 4-3 CSS 容器查询单位\n\n### 通过用户偏好尊重访问者\n\n通过操作系统的设置，用户可以表达对设备外观和运行的某些偏好。例如，许多人选择使用浅色方案或深色方案，如\
  \ 图 4-13 所示。\n\n![在 macOS 中选择浅色或深色方案的截图。](img/9781394164684-fg050413.png)\n\n\n\n\
  \n\n你可以使用 CSS 媒体查询来检测某些用户偏好，并据此对页面进行样式。以下是通用语法：\n\n```css\n@media (preference:value)\
  \ {\n  declarations\n}\n```\n\n* `preference`: 关键字，指定你正在检测哪种偏好。\n* `value`: 查询正在查找的偏好设置。\n\
  * `declarations`: 当 `preference` 匹配 `value` 时，浏览器应用的样式声明。\n\n尽管未来会有更多偏好出现，但目前你可以检测其中三种。以下是相关的关键字和值：\n\
  \n* `prefers-color-scheme`：检测用户是否设置了颜色方案偏好。你可以查询的两个值是 `dark`（深色）或 `light`（浅色）。通常的做法是假设使用浅色方案来设置页面，然后使用类似下面的代码在检测到深色方案偏好时应用较暗的颜色：\n\
  \n    ```css\n    @media (prefers-color-scheme: dark) {\n      /* 在此处设置深色方案颜色 */\n\
  \    }\n    ```\n\n    ![提示](img/tip.png) 如果你在颜色上使用 `hsl()` 函数，将浅色转换为深色变体的一种简单方法是在保持色相和饱和度不变的情况下，从\
  \ 100 中减去亮度。例如，如果浅色是 `hsl(180deg 50% 80%)`，对应的深色模式颜色将是 `hsl(180deg 50% 20%)`。\n\n\
  * `prefers-contrast`：检测用户是否设置了更高或更低对比度颜色的偏好。你可以查询的值有 `no-preference`（用户未设置对比度偏好）、`more`（用户偏好高对比度）、`less`（用户偏好低对比度）或\
  \ `custom`（用户设置了自定义对比度）。大多数设置此偏好的用户都倾向于高对比度颜色，你可以按照如下方式检测它：\n\n    ```css\n    @media\
  \ (prefers-contrast: more) {\n      /* 在此处设置高对比度颜色 */\n    }\n    ```\n\n* `prefers-reduced-motion`：检测用户是否设置了减少动画效果和屏幕上类似的非必要运动的偏好。你可以查询的值有\
  \ `no-preference`（用户未设置减少运动偏好）或 `reduced`（用户偏好减少运动）。这是一个媒体查询，用于检测用户是否偏好减少运动，如果是，则将所有动画设置为最小值：\n\
  \n    ```css\n    @media (prefers-reduced-motion: reduce) {\n      *,\n      ::after,\n\
  \      ::before {\n        animation-duration: 0.01ms;\n        animation-iteration-count:\
  \ 1;\n        transition-duration: 0.01ms;\n        scroll-behavior: auto;\n   \
  \   }\n    }\n    ```\n\n![提示](img/tip.png) ![image](img/9781394164684-ma009.png)\
  \ 你可以使用浏览器开发者工具来测试这些偏好，而无需在操作系统的设置应用中进行切换。在 Chrome 中，打开开发者工具，点击“自定义和控制开发工具”图标（如边栏所示），选择“更多工具\
  \ ⇒  渲染”，然后使用模拟每个用户偏好的控件。\n\n## 响应式处理图像\n\n在规划网页时，你总是需要考虑图像对你的设计以及用户的影响。\n\n###\
  \ 使图像具有响应式\n\n在设计方面，你需要确保图像根据屏幕宽度或高度进行响应式缩放。例如，如果用户的屏幕宽度为 1024 像素，宽度为 800 像素的图像将毫无问题地适应，但同一张图像在\
  \ 400 像素宽的屏幕上就会溢出。你使用以下 CSS 规则创建响应式图像：\n\n```css\nimage {\n  max-width: 100%;\n\
  \  height: auto;\n}\n```\n\n在这里，`image` 是引用你希望具有响应式的图像或图像的选择器。设置 `max-width: 100%`\
  \ 允许图像宽度随视口（或图像容器）的大小变化而缩小或放大，但同时也规定图像的宽度不能大于其原始宽度。设置 `height: auto` 则让浏览器根据图像当前的宽度自动计算高度，从而保持图像的原始宽高比例。\n\
  \n![提示](img/tip.png) 有时，你可能希望图像的高度而不是宽度是响应式的。要做到，你对上述规则使用以下变体：\n\n```css\nimage\
  \ {\n  max-height: 100%;\n  width: auto;\n}\n```\n\n### 响应式交付图像\n\n在用户端，交付远大于屏幕尺寸的图像可能会引发大问题。当然，你可以让图像具有响应式，但你仍然在传输巨大的文件，这对于那些使用慢连接和有限流量套餐的移动上网用户来说并不受欢迎。\n\
  \n相反，你需要向用户提供与设备屏幕大小合适的图像文件版本。例如，你可能为桌面用户提供完整尺寸，为平板用户提供中尺寸版本，为智能手机用户提供小型版本。这听起来可能很复杂，但\
  \ HTML5 让你能够轻松通过 `img` 标签处理一切。秘密在于？`sizes` 和 `srcset` 属性。\n\n![记住](img/remember.png)\
  \ `sizes` 属性是一组 `expression-width` 对的集合：\n\n* `expression` 部分指定屏幕特征，例如最小或最大宽度，并用括号括起来。\n\
  * `width` 部分指定在匹配表达式的屏幕上，你希望图像显示多宽。\n\n例如，要指定在宽度小于 600 像素的屏幕上，你希望图像显示宽度为 `90vw`，你需要使用以下表达式-宽度对：`(max-width:\
  \ 600px) 90vw`。\n\n典型的 `sizes` 属性是由逗号分隔的表达式-宽度对的集合。其通用语法如下：\n\n```html\nsizes=\"\
  (expression1)width1, (expression2)width2, etc., widthN\"\n```\n\n注意最后一项没有指定表达式。这告诉\
  \ Web 浏览器指定的宽度适用于任何不匹配任何表达式的屏幕。\n\n这是一个示例：\n\n```html\nsizes=\"(max-width: 600px)\
  \ 90vw, (max-width: 1000px) 60vw, 30vw\"\n```\n\n![记住](img/remember.png) `srcset`\
  \ 属性是图像文件位置的逗号分隔列表，每个位置后面跟着图像宽度和字母 `w`。通用语法如下：\n\n```html\nsrcset=\"location1width1w,\
  \ location2width2w, etc.\"\n```\n\n这为浏览器提供了图像尺寸的选择，它根据当前设备屏幕尺寸以及你在 `sizes` 属性中指定的偏好宽度选择最佳的一个。这里有一个完整的示例，图\
  \ 4-14 显示了浏览器如何为不同的屏幕尺寸提供不同的图像：\n\n```html\n<img src=\"/images/img-small.jpg\" alt=\"\
  \"\n  sizes=\"(max-width: 600px) 90vw, (max-width: 1000px) 60vw, 30vw\"\n  srcset=\"\
  /images/img-small.jpg 450w, /images/img-medium.jpg 900w, /images/img-large.jpg 1350w\"\
  >\n```\n\n![当 ltltltimgggt 标签的 sizes 和 srcset 属性起作用时，浏览器为不同的屏幕尺寸提供不同的图像。](img/9781394164684-fg050414.png)\n\
  \n图 4-14： 通过 `<<img>>` 标签的 `sizes` 和 `srcset` 属性，浏览器为不同的屏幕尺寸提供不同的图像。\n\n\n\n\n\n\
  如果你在网络上混迹了一段时间，你可能还记得那些日子：你使用手机或类似的便携设备等小屏幕访问某个网站，获取的不是网站的正版版本，而是“移动版”版本。在少数情况下，这个替代版本会针对移动端的查看和导航进行优化，但更多时候，它只是正版网站的一个拙劣仿品，只更改了几个字体，并删除了所有有趣且实用的功能。\n\
  \n从 Web 开发者的角度来看，这些移动端网站的质量糟糕并不意外。毕竟，谁想构建并维护同一个网站的两个版本呢？幸运的是，需要完全不同的网站来支持移动用户的时代早已一去复。是的，使用响应式\
  \ Web 设计可以让你创建一个站点，它在从壁挂显示器到手持设备的任何设备上看起来都很良好且运行流畅。但在现代 Web 开发中，有一种强有力的观点认为，所有的网页都应该从零开始构建，就像它们只将在移动设备上显示一样。在本章的剩余部分，你将探索这种“移动优先”Web\
  \ 开发方法背后的原理和技术。\n\n### 什么是移动优先 Web 开发？\n\n正如我在本章早期讨论过的，当你开发一个在桌面尺寸屏幕上看起来良好且运行良好的网页时，你可以采用许多响应式技巧，让相同的代码在移动设备屏幕上同样看起来良好且运行良好：\n\
  \n*   设置 `Flexbox` 或 `Grid` 布局，使其能够自动适应任何尺寸的屏幕。\n*   使用视口单位（viewport units），特别是用于字体大小。\n\
  *   使用媒体查询在屏幕宽度低于指定阈值时移除元素。\n\n![Remember](img/remember.png) 这第三种技术——即移除不适合较小屏幕的元素——在\
  \ Web 编码行业被称为`渐退式增强`（regressive enhancement，`RE`）。`RE` 统治了 Web 开发世界多年，但最近出现了反弹。原因如下：\n\
  \n*   `RE` 将移动屏幕降级为二等网络公民。\n*   `RE` 导致开发缺乏纪律，因为编码人员和设计师不可避免地会将桌面尺寸的屏幕塞满内容、小部件以及各种\
  \ Web 的花哨功能。\n\n![Remember](img/remember.png) 解决方案是什么？你现在可能已经猜到了：`渐进式增强`（progressive\
  \ enhancement），这意味着从适合你需要支持的最小屏幕尺寸的内容开始，随着屏幕变大再添加组件。当这些原始内容代表了你网页的核心内容，并且当基础屏幕宽度针对移动设备（尤其是今天最流行的智能手机）进行了优化时，你就拥有了一套`移动优先`的\
  \ Web 开发方法。\n\n让我开门见山：移动优先 Web 开发是令人生畏的，因为如果你习惯了在桌面屏幕巨大的画布上挥洒，转而从一个宽度仅为 360 或 400\
  \ 像素的屏幕开始可能会感到有些幽闭。然而，我可以向你保证，之所以看起来是仅仅是因为人们天性地好奇你如何可能将你巨大的页面挤进如此狭小的空间。移动优先思维采取了相反的方法，即忽略（至少在开始阶段）大屏幕，转而关注最适合移动屏幕的内容，毕竟移动端代表了你页面的多数访客。以移动优先的方式进行思考并不困难：它只是意味着记住几点关键的设计原则。\n\
  \n### 移动优先意味着内容优先\n\n采用移动优先 Web 开发方法最大的优势之一是它迫使你考虑优先顺序。也就是说，移动优先设计意味着你在初始布局中只包含对用户页面体验至关重要的页面元素。这种“只保留核心内容”的想法，部分是为了应对屏幕较小无法显示所有内容的问题，但对于许多在网络连接缓慢、数据流量有限的情况下上网的移动用户来说，这也是必要的。你的职责——不，删掉这句话，是你作为一名尽责的\
  \ Web 开发者的`义务`——确保那些用户不会看到任何多余、轻浮或任何其他非本质的内容。\n\n“这些都很好，”我听到你在想，“但请定义一下什么是‘多余’和‘轻浮’。”说得好。当然的问题在于，一个\
  \ Web 开发者的无用小菜可能是另一个人的主食。只有你才能根据你的页面目标和潜在受众，决定什么是无关紧要的，什么是至关重要的。\n\n所以，迈向移动优先设计的第一步是决定以下内容类别中什么是最重要的：\n\
  \n*   ![Remember](img/remember.png) `文本:` 决定哪些词对于传达你的页面信息是至关重要的。可用性专家 Steve Krug\
  \ 告诉 Web 设计师：“删掉每个页面一半的单词，然后再删掉剩下的一半。”对于移动优先的页面，你可能需要再次减半单词。要冷酷。用户真的需要来自 CEO 的那条信息或你的“关于我们”文本吗？可能不需要。\n\
  *   `图像:` 决定哪些图像对用户是至关重要的，或者是否根本需要图像。图像的问题在于，虽然大家都喜欢一点视觉享受，但这种甜是以屏幕空间和带宽为代价的。如果你确实需要在你的移动优先页面中包含一两个图像，至少为你的移动访客提供较小的图像。要学习如何这样做，请查看本章前面的“[响应式处理图像]”。\n\
  *   `导航:` 所有用户都需要能够导航你的网站，但最近的趋势是创建包含网站每个部分和页面链接的巨型菜单。决定这些链接中哪些对导航真正重要，并把它们包含在你的移动优先布局中。\n\
  *   `小部件:` 现代网页点缀着社交媒体、内容滚动条、照片灯箱、自动视频播放以及广告的小部件。移动用户希望内容优先，所以请考虑完全放弃这些小部件。如果你真的想包含某个小部件，并且确定它不会给页面加载时间或用户带宽带来过重负担，就把该小部件推到页面底部。\n\
  \n### 为你的网站选择一个合理的测试宽度\n\n![Remember](img/remember.png) 对于大多数网站，测试移动优先布局应该从最小的设备开始，如今这意味着屏幕宽度为\
  \ 360 像素的智能手机。然而，你不一定非要从 360px 那么小的宽度开始测试。如果你可以访问网站的分析数据，它们应该告诉你的访客使用什么设备。如果你发现所有或大多数移动用户都在至少\
  \ 400 像素宽的设备上，那么这就是你应该为移动优先布局测试的初始宽度。\n\n### 让你的内容随设备缩放\n\n为了让你的移动优先方法成功，最重要的是配置网站上的每个页面，使其随设备屏幕宽度进行水平缩放。你可以通过在每个页面的\
  \ `head` 部分添加以下 `<meta>` 标签来实现：\n\n```\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n```\n\n这指示 浏览器做两件事：\n\n*   将页面内容的初始宽度设置为设备屏幕的宽度。\n*   将页面的初始缩放级别设置为\
  \ 1.0，这意味着页面既没有放大也没有缩小。\n\n### 以移动优先的方式构建你的 CSS\n\n\n\n\n当你准备好为你的页面编写 CSS 时，请理解你所编写的样式定义和规则将是你页面的默认样式——也就是说，这些是浏览器在所有设备上都将显示的样式，除非你定义了一个或多个媒体查询（或容器查询）来覆盖这些默认设置。只要你遵循响应式网页设计的几项基本原则，就不需要编写任何特殊规则：\n\
  \n*   ![记住](img/remember.png) 使用视口单位（viewport units）测量宽度和内边距等。\n*   使用 `rem` 单位设置字体大小。\n\
  *   让你的所有图片都是响应式的。\n*   使用 `Grid` 或 `Flexbox` 进行页面布局。如果你正在使用 Flexbox，请确保对任何弹性容器应用\
  \ `flex-wrap: wrap`。\n\n此外，确保你的移动优先布局渲染内容的方式与你希望在移动屏幕上显示的方式完全一致也很重要。这意味着要避免任何技巧，例如使用\
  \ Flexbox 的 `order` 属性来打乱页面元素的顺序。\n\n最后，可能最重要的一点是，务必通过对内容设置 `display: none` 来隐藏任何不必要的内容。\n\
  \n最终，你的移动优先 CSS 应该是简单和高效的典范。\n\n### 选择一个符合内容逻辑的“非移动端”断点\n\n你的移动优先 CSS 代码可能包含了几个你已经用\
  \ `display: none` 隐藏的元素。我假设你最终会显示这些元素（否则，你就直接把它们全部删除了），因此你需要决定在何时显示它们。具体来说，你需要决定能够成功显示你内容的最小屏幕宽度是多少。\n\
  \n注意，我并没有说你应该根据目标设备的宽度来决定何时显示隐藏的内容。例如，多年来，开发者认为当一个屏幕宽度至少与 iPad 竖屏模式下的屏幕一样宽时，它就是“足够宽”的，这在很长一段时间里，这个宽度是\
  \ 768 像素。这很有道理，但尽管 iPad mini 仍然使用该宽度，但较新的 iPad 现在已经宽得多了（例如，iPad Pro 在竖屏模式下的宽度为 1,024\
  \ 像素）。\n\n![提示](img/tip.png) 设备在不断变化，试图跟上它们是一场徒劳。忘记所有这些吧。相反，决定当隐藏内容可见时，什么最小宽度对你的页面最合适。你如何做到这一点？这里有一个简单的方法：\n\
  \n1.  **将你的页面加载到 Chrome 浏览器。**\n2.  **显示 Chrome 开发者工具。**\n    按下 `Ctrl+Shift+I`\
  \ (Windows) 或 `⌘  +Shift+I` (Mac)。\n3.  **使用鼠标调整浏览器窗口的大小：**\n    *   如果开发者工具位于浏览器视口下方或未停靠，请拖动浏览器窗口的右边缘或左边缘。\n\
  \    *   如果开发者工具停靠在视口的右侧或左侧，请拖动分离开发者工具与视口的垂直条。\n4.  **读取当前的视口尺寸，Chrome 显示在视口的右上角。**\n\
  \    尺寸以“宽 x 高”的形式以像素为单位显示。\n5.  **缩小窗口到你的移动优先测试宽度（例如 360px）。**\n6.  **增加宽度，并在增加的过程中，观察你的布局变化。**\n\
  \    特别注意观察内容第一次看起来像你在大屏幕上希望显示的那样的宽度。记下那个宽度。\n\n![记住](img/remember.png) 你的完整内容看起来良好的宽度，就是\
  \ CSS 媒体查询断点的基础，你将使用它来显示在移动优先布局中隐藏的元素。例如，假设你的移动优先布局隐藏了 `aside` 元素，并且你发现完整内容在 `742px`\
  \ 的宽度下看起来很合适。你就可以设置如下媒体查询（使用 `750px` 取一个整数）：\n\n```css\n@media (min-width: 750px)\
  \ {\n  aside {\n    display: block;\n  }\n}\n```\n\n这个媒体查询告诉浏览器，当屏幕宽度为 `750px` 或更多时，显示\
