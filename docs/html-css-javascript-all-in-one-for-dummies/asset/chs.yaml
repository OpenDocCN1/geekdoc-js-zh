  prompt(\"Enter the name:\").length;\nmyFunction().length;\n```\n\n最后一个示例假设 `myFunction()`\
  \ 返回一个字符串。\n\n### 使用字符串模板\n\n在深入学习 `String` 属性和方法之前，花点时间观察一种解决三种问题的字符串类型：\n\n* \
