  \ HTML 的基本结构标签”）是一个主章节的标题，而靠近底部的单独成行的行（创建段落”）是一个子章节的标题。我可以将这些转换为标题，如下所示：\n\n```\n\
  <h3>Getting to Know HTML's Basic Structure Tag</h3>\n<h4>Creating paragraphs</h4>\n\
  ```\n\n图 1-4 显示了结果（查看 `bk02ch01/example04.html`）。\n\n![添加标题后的图 1-2 文本的截图](img/9781394164684-fg020104.png)\n\
  \n图 1-4： 添加了标题的图 1-2 文本。\n\n### 添加换行\n\n如果你仔细观察图 1-4 所示的段落和标题，你可能会注意到的事情之一是浏览器在元素元素之间留了大量的空间。这是一件好事，因为正是这些空白使得页面比图\
  \ 1-1 中拥挤在一起的文本易读得多。\n\n然而，对于某些文本形式，“段落”是单行的，例如地址块、代码列表或诗歌。在这种情况下，你不希望行与行之间有那么多空白。例如，图\
  \ 1-5 显示当我用 `<p>` 标签编写下面这段五韵律诗时发生的情况（参考 `bk02ch01/example05.html`）：\n\n```\n<p>There\
  \ once was woman named Elle,</p>\n<p>Who learned tons of HTML.</p>\n<p>Then she\
  \ came to an ode</p>\n<p>That she just couldn't code,</p>\n<p>Now she lives in a\
  \ white padded cell.</p>\n```\n\n![每行都是段落的五韵律诗截图](img/9781394164684-fg020105.png)\n\
  \n图 1-5： 每行都是段落的五韵律诗。\n\n这看起来不太对吧？幸运的是，HTML 考虑到了这种情况，并创建了一个特殊的元素来处理：`br`。这个换行元素的作用正是：它告诉网页浏览器在新的一行开始下一个元素，但行之间没有任何间距。你在需要换行的地方放置\
  \ `<br>` 标签（它没有结束标签），通常是在文本行的末尾，如下所示（查看 `bk02ch01/example06.html`）：\n\n```\nThere\
  \ once was woman named Elle,<br>\nWho learned tons of HTML.<br>\nThen she came to\
  \ an ode<br>\nThat she just couldn't code,<br>\nNow she lives in a white padded\
  \ cell.\n```\n\n图 1-6 显示了结果。\n\n![带有换行的五韵律诗截图](img/9781394164684-fg020106.png)\n\
  \n\n\n\n\n除非为 `body` 区域添加一些结构，否则你的网页将面临同样的命运。在本章前面的部分，我讨论了如标题和段落之类的结构化元素，但现在我要提升一个台阶，讨论\
  \ HTML 的高级结构标签了。\n\n了解这些标签的第一点是，它们被设计用来为你的页面结构注入意义——即语义化（semantics）。在我介绍每个标签时，你将学习它的含义，但现在，请看图\
  \ 1-8 所示的抽象页面。\n\n![HTML5 语义化页面结构标签抽象视图截图](img/9781394164684-fg020108.png)\n\n图\
  \ 1-8： HTML5 语义化页面结构标签的抽象视图。\n\n让我们来看图 1-8 中显示的每个标签。\n\n### `<header>` 标签\n\n你使用\
  \ `<header>` 标签来创建页眉，它通常是横跨页面顶部的一条带，包含了网站或页面标题以及 logo 等元素。（不要将其与出现在 `<head>` 和 `</head>`\
  \ 标签之间的页面 `head` 区域混淆。）\n\n由于页眉几乎总是出现在页面顶部，因此 `<header>` 标签通常紧跟在 `<body>` 标签之后，如下例所示（以及图\
  \ 1-9 尽管 `header` 元素通常出现在网页 的顶部，但那并不是你可以使用它的唯一地方。例如，如果你有以介绍性内容开头的 `section` 元素——例如图标、章节编号、链接或日期——你可以在每个章节的开头添加一个\
  \ `header` 元素。\n\n![带有 logo、标题和水平规则的页面头部截图](img/9781394164684-fg020109.png)\n\n\
  图 1-9： 带有 logo、标题和水平规则的页面头部。\n\n### `<nav>` 标签\n\n`<nav>` 标签定义了一个页面区域，其中包含几个帮助访问者导航网站的元素。这些元素可以是指向网站主要部分的链接、指向最近发布内容的链接（查看第二卷，第\
  \ 2 章）或搜索功能。`<nav>` 区域通常出现在页面顶部，紧跟在页眉之后，如下所示（以及图 1-10；参考 bk02ch01/example09.html）：\n\
  \n```\n<body>\n<header>\n<img src=\"iis-logo.png\" alt=\"Isn't it Semantic? company\
  \ logo\">\n<h1>Welcome to \"Isn't it Semantic?\"</h1>\n<hr>\n</header>\n<nav>\n\
  <a href=\"/\">Home</a>\n<a href=\"semantics.html\">Semantics</a>\n<a href=\"contact.html\"\
  >Contact</a>\n<a href=\"about.html\">About</a>\n</nav>\n…\n</body>\n```\n\n![记住](img/remember.png)\
  \ 在任何你有导航链接的地方，都可以尽管使用 `nav` 元素。全站导航链接几乎总是嵌套在紧邻主页面页眉下方的 `nav` 元素中。然而，你可能会有特定文章或章节的导航链接，在这些元素的顶部放置一个\
  \ `nav` 元素是完全可以的。\n\n![<nav> 区域通常紧跟在 <header> 区域 之后的 截图](img/9781394164684-fg020110.png)\n\
  \n图 1-10： `<nav>` 区域通常紧跟在 `<header>` 区域之后。\n\n### `<main>` 标签\n\n`<main>` 标签设置了一个区域来存放从某种意义上说是页面重点的内容。例如，如果你创建一个页面是为了告诉所有人你关于中国斗鱼的所有知识，那么你的斗鱼文本、图像、链接等都会进入\
  \ `<main>` 区域。\n\n`<main>` 区域通常紧跟在 `<head>` 和 `<nav>` 区域之后：\n\n```\n<body>\n<header>\n\
  …\n</header>\n<nav>\n…\n</nav>\n<main>\n这里放置内容\n</main>\n…\n</body>\n```\n\n###\
  \ `<article>` 标签\n\n你使用 `<article>` 标签来表示文档或页面中完整的、自包含的作品，该作品旨在独立分发或重用（例如，博客文章）。\n\
  \n```\n<body>\n<header>\n…\n</header>\n<nav>\n…\n</nav>\n<main>\n<article>\n…\n\
  </article>\n</main>\n</body>\n```\n\n### `<section>` 标签\n\n`<section>` 元素表示文档中一个独立的章节，它没有更具语义的元素来表示。一个章节应该有一个标题（通常是\
  \ `h2`–`h6`）。\n\n```\n<body>\n<header>\n…\n</header>\n<nav>\n…\n</nav>\n<main>\n\
  <article>\n<section>\n章节 1 在这里\n</section>\n<section>\n章节 2 在这里\n</section>\n</article>\n\
  </main>\n</body>\n```\n\n### `<aside>` 标签\n\n`<aside>` 元素表示文档中与其周围内容间接相关的部分。它通常用于侧边栏、引言或广告。\n\
  \n```\n<body>\n<header>\n…\n</header>\n<nav>\n…\n</nav>\n<main>\n<article>\n<aside>\n\
  侧边栏内容在这里\n</aside>\n</article>\n</main>\n</body>\n```\n\n### `<footer>` 标签\n\n`<footer>`\
  \ 元素表示其最近章节或主体元素的页脚。页脚通常包含关于章节的信息，如作者数据、相关文档的链接或版权。\n\n```\n<body>\n<header>\n…\n\
  </header>\n<nav>\n…\n</nav>\n<main>\n<article>\n…\n</article>\n</main>\n<footer>\n\
  页脚内容在这里\n</footer>\n</body>\n```\n\n### 使用 `<div>` 处理非语义内容\n\n`<header>`, `<nav>`,\
  \ `<main>`, `<article>`, `<section>`, `<aside>` 和 `<footer>` 元素在页面内创建了具有意义的结构，这就是为什么\
  \ HTML 迷们称这些为语义元素。即使在本章早期介绍的简单的 `<p>` 标签也是语义化的，因为它表示一个单独段落，通常位于 `<section>` 元素内部。\n\
  \n当一个网页编织者想要添加一组不符合任何标准语义标签的内容时，他们该怎么办？这种情况经常发生，解决方案是将这些内容放在 `div`（代表“division”元素元素中。`div`\
  \ 标签是一个通用的容器，不表示任何意义，因此它是任何需要归宿的非语义内容的完美去处：\n\n```html\n<div>\n非语义内容直接放在这里\n</div>\n\
  ```\n\n这里有一个示例：\n\n```html\n<div>\n必要的社交媒体链接：\n</div>\n<div>\n<a href=\"https://facebook.com/\"\
  >Facebook</a>\n</div>\n```\n\n\n\n\n`<a href=\"https://twitter.com/\">Twitter</a>`\n\
  \n`<a href=\"https://instagram.com/\">Instagram</a>`\n\n`<a href=\"http://www.hbo.com/silicon-valley\"\
  >Hooli</a>`\n\n`</div>`\n\n注意图 1-11 所示，浏览器将两个 `<div>` 元素渲染在不同的行上。\n\n![浏览器将每个 <div>\
  \ 部分渲染在新行上的截图。](img/9781394164684-fg020111.png)\n\n图 1-11： 浏览器将每个 `<div>` 区域渲染在新的行上。\n\
  \n### 使用 `<span>` 处理单词和字符\n\n如果你想对大段文本中的一小部分（例如短语、单词，甚至是一个或三个字符）进行处理，你需要转向所谓的**内联元素**（inline\
  \ element），它创建一个存在于某个较大元素内部的容器，并与该元素中的其余内容一起流动。最常用的内联元素是 `<span>`，它在一段文本周围创建一个容器（参见\
  \ `bk02ch01/example11.html`）：\n\n```\n<p>\n注意这个 <span style=\"font-variant: small-caps\"\
  >\n内联元素</span>是如何与文本\n的其余部分一起流动的。\n</p>\n```\n\n这里发生的情况是 `<span>` 标签对 `<span>` 和\
  \ `</span>` 之间的文本（`inline element`）应用了名为 `small caps`（小型大写）的样式。如图 1-12\n\n图 1-12：\
  \ 使用 `<span>` 使容器与周围文本一起流动。\n\n## 为你的代码注释\n\nHTML 标签及其尖括号和属性需要一点时间来适应，一旦你掌握了它们，阅读和扫描代码就会变得更容易。翻阅一个仅包含少量\
  \ HTML 元素的小型网页通常很直观，但这种状态不会持续多久。似乎即使是最简单的 Web 项目，最终也会有几十行、更有可能是几百行 HTML。\n\n掌握所有这些\
  \ HTML 并不是易事，特别是如果你已经一段时间没有看这些代码了。那时，问题通常会接踵而至：那个 `div` 元素在做什么？我为什么要把那个 `nav` 元素放在那儿？那个`<hr>`\
  \ 标签是怎么回事？\n\n一种帮助你的代码更具可读性和易理解的方法——特别是如果其他人要看你的代码，或者你希望在六个月后回到代码时给自己提供帮助——就是在代码中添加大量的注释。在\
  \ HTML 文件中，`comment`（注释）是一段 浏览器在渲染页面时完全忽略的文本。这在你听来可能完全没用，但请放心，注释有许多用途：\n\n* 添加文本来解释为什么某个特定的\
  \ HTML 块要这样写。\n* 帮助区分使用相似标签结构的 HTML 代码部分。\n* 标记你或其他人需要开始工作或完成的 HTML 文件章节。\n\n要将某些文本标记为注释，请在文本前加上\
  \ `<!--`，在文本后加上 `-->`。这里有一个示例：\n\n```\n<div>\n必要的社交媒体链接：\n</div>\n<!--\n以下每个链接都需要更新为指向\n\
  我们相应社交媒体页面的 \n完整地址。\n谢谢！\n-->\n<div>\n<a href=\"https://facebook.com/\">Facebook</a>\n\
  <a href=\"https://twitter.com/\">Twitter</a>\n<a href=\"https://instagram.com/\"\
  >Instagram</a>\n<a href=\"http://www.hbo.com/silicon-valley\">Hooli</a>\n</div>\n\
  ```\n\n第 2 章\n\n# 添加链接、列表和其他文本片段\n\n**本章内容**\n\n* ![Bullet](img/check.png) **标记强调和重要的文本**\n\
  * ![Bullet](img/check.png) **处理引用**\n* ![Bullet](img/check.png) **为你的页面添加链接**\n\
  * ![Bullet](img/check.png) **构建无序和有序列表**\n* ![Bullet](img/check.png) **插入特殊字符**\n\
  \n\n\n\n\n`页面的角落？<strong>永远不要点击红色按钮！</strong>` `你已收到警告。`\n\n所有 Web 浏览器都会用 `<strong>`\
  \ 标签标记的文本渲染为粗体，如图 2-2 所示。\n\n![浏览器使用粗体渲染重要文本的截图](img/9781394164684-fg020202.png)\n\
  \n图 2-2： 浏览器使用粗体字体渲染重要文本。\n\n为了让我们大家在网页开发中保持警惕，HTML 还提供了一个与 `<strong>` 标签非常相似的标签：`<b>`\
  \ 标签。你使用 `<b>` 标签来标记文本中的关键词。`关键词` 是你希望引起注意的术语，因为它起的作用与普通文本不同。它可以是一个公司名称或人名（想想那些作为名人八卦专栏常客的著名“粗体名字”）。浏览器会用粗体字体渲染\
  \ `<b>` 和 `</b>` 标签之间的文本。\n\n### 嵌套标签\n\n通过将一个标签嵌套另一个标签内部来组合多个类型的标签是完全允许——而且通常是必要的。例如，查看这段代码\
  \ (`bk02ch02/example03.html`）：\n\n```\n亲爱的读者：你看到这个页面右上角的红色按钮了吗？<strong>永远不要，我重复一遍，<em>绝不</em>，点击那个红色按钮！</strong>你已收到警告。\n\
  ```\n\n你注意到我刚才在那儿做了什么吗？在 `<strong>` 和 `</strong>` 标签之间的文本中，我用 `<em>` 和 `</em>` 标签标记了一个单词。结果是什么？你猜对了：粗体加斜体的文本，如图\
  \ 2-3 所示。\n\n![浏览器通常组合嵌套标签的截图，例如此处所示粗体、斜体文本](img/9781394164684-fg020203.png)\n\n\
  图 2-3： 浏览器通常组合嵌套标签，例如此处所示的粗体、斜体文本。\n\n### 添加引用\n\n你可能已经注意到这本书的每一章都以一段简短且恰当的引用开头，因为，嘿，谁不喜欢好的名言呢？我确信，你网页的读者也会欣赏引言的，所以为什么不在你的文中加入几句智者的话呢？在\
  \ HTML 中，你通过使用 `<blockquote>` 标签将一段文本指定为引用。这里有一个示例 (`bk02ch02/example04.html`)：\n\
  \n```\n关于双关语，伟大的法学家奥利弗·温恩德尔·霍尔姆斯（Oliver Wendell Holmes, Sr.）是这样说的：\n<blockquote>\n\
  双关语通常不能作为还击的正当理由。\n但如果是因为这种原因遭受了击打并导致死亡，陪审团将同时对事实和双关语进行审判，如果后者具有加重性质，可能会给出正当杀人的判决。\n\
  </blockquote>\n显然，这家伙不是双关语的粉丝。\n```\n\nWeb 浏览器会将 `<blockquote>` 和 `</blockquote>`\
  \ 之间的文本渲染在自己的段落中，并从左侧边距稍微缩进，如图 2-4 所示。\n\n![浏览器渲染 <blockquote> 文本从左侧稍微缩进的截图](img/9781394164684-fg020204.png)\n\
  \n图 2-4： 浏览器渲染 `<blockquote>` 文本从左侧稍微缩进。\n\n我应该应该提到密切相关的 `q` 元素，你可以用它来标记所谓的*内联引用*。你将内联引用用于可以随普通文本流动的短篇引言。这里有一个示例\
  \ (`bk02ch02/example05.html`)：\n\n`无论你喜欢还是讨厌玩双关语的人，你无法与罗恩·沃尔夫（Ron Wolfe）争论，他说：<q>双关语者是那种言行一致的人。</q>`\n\
  \n如图 2-5 所示，Web 浏览器会渲染引号之间的引用。\n\n![浏览器渲染被引号围绕的 q 文本的截图](img/9781394164684-fg020205.png)\n\
  \n图 2-5： 浏览器渲染被引号的 `<q>` 文本。\n\n![提示](img/tip.png) `q` 元素支持 `cite` 属性，这是一个指定引用来源的\
  \ Web 地址，并且可以被屏幕阅读器和其他辅助技术读取。这里有一个示例 (`bk02ch02/example05a.html`)：\n\n`WHATWG 规定使用\
  \ q 元素是可选的，且 <q cite=\"https://html.spec.whatwg.org/#the-q-element\">`\n\n## 创建链接\n\
  \n当你想要链接到另一个页面时，你使用 `<a>`（锚点）元素。`<a>` 元素最重要的属性是 `href`，它指定了页面的 URL。这里有一个示例：\n\n\
  ```\n<a href=\"https://www.google.com\">谷歌搜索</a>\n```\n\n`href` 属性可以包含多种类型的值：\n\n\
  - **绝对 URL**：指向互联网上的特定页面（例如 `https://www.google.com`）。\n- **相对 URL**：指向相对于当前页的文件（例如\
  \ `about.html` 或 `images/logo.png`）。\n- **锚点链接**：指向同一页面上的特定部分（例如 `#section1`）。\n\
  \n要链接到你网站上的另一个页面，你使用相对 URL：\n\n```html\n<a href=\"contact.html\">联系我们</a>\n```\n\
  \n要链接到子文件夹中的页面，你使用路径：\n\n```html\n<a href=\"projects/portfolio.html\">我的项目</a>\n\
  ```\n\n要链接到父目录中的页面，你使用 `..` 记法：\n\n```html\n<a href=\"../index.html\">返回首页</a>\n\
  ```\n\n`<a>` 元素还有一个 `target` 属性，它指定了打开链接文档的位置。例如，`target=\"_blank\"` 会在新窗口或标签中打开链接：\n\
  \n```html\n<a href=\"https://www.wikipedia.org\" target=\"_blank\">维基百科</a>\n```\n\
  \n### 锚点起：内部链接\n\n你可以通过锚点链接到同一页面上的特定部分。首先，使用 `id` 属性为目标部分赋予一个唯一标识：\n\n```html\n\
  <h2 id=\"section1\">第一部分</h2>\n```\n\n然后，创建一个 `href` 属性设置为 `#` 后紧跟该 ID 的链接：\n\n\
  ```html\n<a href=\"#section1\">跳转到第一部分</a>\n```\n\n这对于在长页面上创建目录或“回到顶部”链接特别有用。\n\n\
  \n\n\n\n你什么时候会用到内部链接呢？你的大多数 HTML 页面可能都短小精悍，造访的网页浏览者在页面间导航时不会遇到任何困难。但如果你像我一样，深受严重的“终端啰症”并时而发作极度啰嗦，那么你最终得到的网页充其保守地说会非常冗长。与其强迫读者翻阅你那些像巨著一样的作品，你完全可以设置指向文档各个部分的链接。例如，你可以将这些链接汇集在页面顶部，形成一种“超级目录”。\n\
  \n内部链接实际上是链接到一个被特殊标记的区域——称为 `anchor`（锚点）——这个锚点由你插入在同一页面的某个地方。要理解锚点是如何工作的，可以想象一下你在读书时是如何标记某个位置的。你可以折起页角、贴上便签，或者在书页之间放置某些东西，比如书签或你猫的尾巴。锚点的功能相同：它“标记”了网页中的某个特定位置，然后你可以使用普通的\
  \ `<a>` 标签链接到该位置。锚点标签的一般格式如下：\n\n```html\n<element id=\"name\">\n```\n\n锚点标签看起来和普通标签很像，但它还包含了\
  \ `id` 属性，该属性设置为你想给锚点的名称。这里有一个示例：\n\n```html\n<section id=\"section1\">\n```\n\n\
  ![Remember](img/remember.png) 你可以使用任何想要的名称，但它必须以字母开头，并包含字母、数字、下划线（`_`）和连字符（`-`）的任意组合。此外，`id`\
  \ 值区分大小写，因此浏览器处理 `id` 值 `section1` 的方式与 `id` 值 `Section1` 不同。要设置锚点链接，你需要创建一个普通的\
  \ `<a>` 标签，但 `href` 值变为锚点的名称，并在前面加上哈希符号（#`）：\n\n```html\n<a href=\"#name\">\n```\n\
  \n这是一个链接到我之前展示的锚点的示例：\n\n```html\n<a href=\"#section1\">\n```\n\n虽然你主要使用锚点来链接到同一个网页的章节，但法律并不禁止使用它们链接到其他页面的特定部分。你的做法是在另一个页面上添加适当的锚点，然后通过在页面文件名末尾添加锚点名称（一如常惯，前面加上\
  \ `#`）来链接到它。这里是一个示例：\n\n```html\n<a href=\"chapter57.html#section1\">\n```\n\n##\
  \ 构建无序列表和有序列表\n\n出于某种原因，人们喜欢列表：最时髦（及最丑）穿着列表、排行榜、我史以来最喜欢的 *X* 列表，其中 *X* 是你想要的任何内容：电影、歌曲、书籍、《我爱露西》剧集——随你心意。人们喜欢列表，无论出于什么。好了，让我们做一些列表吧。很容易，对吧？嗯，当然，任何网页高手都可以通过连续输入每个项目，在页面上直接丢出一个“史上最棒棒棒糖口味”列表。也许我们的列表制作人还会变得聪明一点，在每个项目之间插入\
  \ `<br>` 标签，让它们在不同的行中显示。噢。\n\n是的，你可以用那样创建列表，我想效果也算不错，但有种更好的方法。HTML 有几个专门设计的标签，可以让你对构建列表的任务拥有更多的控制力。例如，你可以创建一个无序列表，在每个项目前面真的有那些小圆点。太棒了！想要一个排行榜吗？HTML\
  \ 也提供了有序列表的特殊标签来支持你的需求。\n\n### 使用无序列表表达观点\n\n一个没有任何修饰、用 `<br>` 分隔的列表并不好用也不易于阅读，因为它没有任何有助于区分一个项目与下一个项目的视觉元素。一个正式的、经\
  \ HTML 认可的无序列表通过在每个项目开头使用圆点——一个可爱的小黑点——解决了这个问题。无序列表使用两种类型的标签：\n\n*   整个列表被 `<ul>`\
  \ 和 `</ul>` 标签包裹。为什么是“ul”？嗯，世界上其他地方称为无序列表，HTML 专家们称为 `unordered list`（无序列表）。\n*\
  \   列表中的每个项目由 `<li>`（列表项）标签引导，并用 `</li>` 结束标签关闭。（从技术上讲，只要下一个项目是另一个 `<li>` 标签或 `</ul>`\
  \ 结束标签，`</li>` 标签就是可选的。）\n\n一般的设置如下：\n\n```html\n<ul>\n  <li>这里是圆点文本</li>\n  <li>还有这里</li>\n\
  \  <li>还有这里</li>\n  <li>你懂意思的……</li>\n</ul>\n```\n\n注意我将列表项目缩进了四个空格，这更容易让人意识到它们是\
  \ `<ul></ul>` 容器的一部分。这里有一个可以推敲的示例（bk02ch02/example07.html）：\n\n```html\n<h3>我史以来最喜欢的矛盾修辞法</h3>\n\
  <ul>\n  <li>美得丑</li>\n  <li>军事智能</li>\n  <li>大号虾仁</li>\n  <li>原稿复件</li>\n  <li>随机顺序</li>\n\
  \  <li>自然な</li>\n  <li>紧身裤</li>\n  <li>冷冻</li>\n</ul>\n```\n\n\n\n\n\n它看起来可能不像，但那个标签为你的网页增添了一点魔力。神奇之处在于，你现在可以直接在网页文本中添加如\
  \ `©` 和 `™` 等特殊字符，而网络浏览器会毫无意见地显示它们。诀窍在于你如何将这些字符直接添加到文本中，而这取决于你的操作系统。首先，如果你使用的是 Windows，你有两个选择：\n\
  \n*   按住 `Alt` 键，然后使用键盘上的数字键盘输入该字符的四位 ASCII 编码。例如，通过按下 `Alt+0151` 来输入一个破折号（—）。\n\
  *   从 Windows 自带的“字符表”（Character Map）应用程序中粘贴字符。\n\n如果你是 Mac 用户，同样有两个选择：\n\n*   输入字符的特殊键盘快捷键。例如，通过按下\
  \ `Option+Shift+-`（连字符）来输入破折号（—）。\n\n*   从 macOS 自带的“符号查看器”（Symbols Viewer）中粘贴字符。\n\
  \n话如此，我应该指出还有另一种方法可以在页面上添加特殊字符。创建 HTML 的网页魔法师们发明了特殊的代码，被称为“字符实体”（character entities，这显然是一个只有真正的极客才会喜欢的名称），用来表示这些奇特的符号。这些代码有两种形式：“字符引用”（character\
  \ reference）和“实体名称”（entity name）。字符引用基本上就是数字，而实体名称是更友好的符号，描述了你正尝试显示的字符。例如，你可以使用\
  \ `&#174;` 字符引用或 `&reg;` 实体名称来显示注册商标符号（™），如下所示：\n\n```\nPrint-On-Non-Demand&#174;\n\
  ```\n\n或者\n\n```\nPrint-On-Non-Demand&reg;\n```\n\n注意，字符引用和实体名称都以和符号（`&`）开头并以分号（`;`）结束。在自己的页面中使用特殊符号时，不要忘记这这两个字符。\n\
  \n![Remember](img/remember.png) 字符引用的一个非常常见的用途是显示 HTML 标签，而不让网络浏览器将其渲染为标签。要做到这一点，将标签的小于号（`<`）替换为\
  \ `&lt;`（或 `&#060;`），并将标签的大于号（`>`）替换为 `&gt;`（或 `&#062;`）。\n\n## 需要了解的更多 HTML 文本标签\n\
  \n很有可能在你整个 HTML 职业生涯中只会使用我在本章目前为止介绍过的 HTML 文本元素：`em`, `i`, `strong`, `b`, `blockquote`,\
  \ `q`, `a`, `ul`, `ol` 和 `li`。然而，HTML 还提供了许多与文本相关的标签。诚然，这些标签中的许多非常晦涩，而且使用其中大多数感觉有点像语义过度，但你永远不知道某个特定元素何时会成为网页项目的完美之选。带着这种精神，接下来的几节将带你了解一系列丰富的（但绝非完整的）文本标签集合，这些标签值得加入你的\
  \ HTML 工具箱。\n\n![Remember](img/remember.png) 在接下来的章节中，我提到了网络浏览器对每个元素内文本应用的默认样式（如果有的话）。但是，你随时可以使用\
  \ `CSS` 覆盖元素的默认样式，所以不要仅仅因为不喜欢浏览器的默认渲染方式就避开某个特定标签。\n\n### <abbr>: 缩写文本标签\n\n你使用 `abbr`\
  \ 元素来标记缩写或首字母词。使用该元素有两种方法：\n\n```\n<abbr>abbreviation</abbr> (`expansion`)\n```\n\
  \n```\n<abbr title=\"expansion\">abbreviation</abbr>\n```\n\n在这两种情况下，`abbreviation`\
  \ 是你标记的缩写，而 `expansion` 是该缩写的全文本扩展。第一种方法将扩展直接放在文本中供用户阅读；第二种方法则隐藏扩展，直到读者将鼠标指针悬停在缩写上，此时扩展将出现在提示框中，如下例和图\
  \ 2-9 (bk02ch02/example09.html) 所示：\n\n```\nWhat happens to upwardly-mobile couples\
  \ who have children\nand then one spouse stops working to raise the kids?\nWhy,\
  \ their life becomes a\n<abbr title=\"single income, two children, oppressive mortgage\"\
  >SITCOM</abbr>, of course.\n```\n\n![当包含 title 属性时的截图，鼠标悬停在缩写上会在提示框中显示扩展。](img/9781394164684-fg020209.png)\n\
  \n图 2-9： 当包含 `title` 属性时，鼠标悬停在缩写上会在提示框中显示扩展。\n\n### <address>: 地址文本标签\n\n你的网页——或网页的某部分，例如\
  \ `article` 元素——可能包含联系信息，其中可能包括电子邮件地址、电话和邮寄地址。你可以用 `<address>` 和 `</address>` 标签包裹这些联系信息以进行语义化标记，如下（bk02ch02/example10.html）：\n\
  \n```\n<p>\nHaving a problem? Please \"contact us\" here:\n</p>\n<address>\nThe\
  \ Complaints Department<br>\n</address>\n```\n\n如图 2-10 所示，`address` 文本以斜体显示。\n\n\
  ### <cite>: 引用文本标签\n\n如果你的网页引用了某个作品，你可以使用 `cite` 元素对该作品的引用进行语义化标记。通过将作品名称（或指向作品的链接）放在\
  \ `<cite>` 和 `</cite>` 标签之间来实现。\n\n![Remember](img/remember.png) 就 `cite` 元素而言，“创作作品”一词具有广泛的含义，包括以下列表：书籍、论文、文章、诗歌、歌曲、脚本、电影、电视节目、游戏、雕塑、绘画、戏剧制作、歌剧、音乐剧、展览、法律案件、计算机程序。\n\
  \n### <code>: 代码文本标签\n\n如果你的网页包含一个单词、短语或一行计算机代码——例如 HTML 元素名称、CSS 声明（属性/值对）或 JavaScript\
  \ 语句——你可以恰当地将该代码封装在 `code` 元素中。这是一个示例：\n\n```\n<p>\nWay back in 1994 年，Netscape（原始网络浏览器之一）的某人产生了一个并不聪明的想法，认为闪烁的文本是件好事。因此，<code><blink></code>\
  \ 标签——这个历史上最受敌厌的标签——诞生了。\n</p>\n```\n\n\n\n\n如图 2-12 所示，浏览器会用等宽字体渲染 `code` 文本。\n\
  \n![浏览器以等宽字体显示代码文本的截图](img/9781394164684-fg020212.png)\n\n图 2-12： 浏览器用等宽字体显示 `code`\
  \ 文本。\n\n![记住](img/remember.png) `<code>` 标签是一个内联元素，这意味着 `code` 文本会随周围文本一起流动。如果你想在页面上包含多行计算机代码，你需要使用\
  \ `<pre>` 标签。请参考本章稍后部分的“<pre>: 预格式化文本标签”。\n\n![提示](img/tip.png) 如果你的代码中包含变量名，可以使用\
  \ `var` 元素（代表“variable”，即变量）对该名称进行语义化标记：\n\n`假设变量 <var>x</var> 和 <var>y</var> 为正值，中国的茶叶价格是多少？`\n\
  \n网络浏览器会用斜体渲染 `var` 文本。\n\n![提示](img/tip.png) 另一种不同的场景是，你想在网页中包含计算机程序的示例输出（例如错误消息）。为此首选的\
  \ HTML 元素是 `samp` 元素（“samp”是“sample output”，即示例输出的缩写）：\n\n`输入该 URL 产生了可怕的 <samp>404\
  \ Not Found</samp> 错误。`\n\n### <dfn>: 定义文本标签\n\n术语的*定义实例（*defining instance*）*紧跟在术语定义之后的该术语的用法。你注意到刚才发生了什么吗？我使用的“定义实例（defining\
  \ instance）”正是术语“定义实例（*defining instance*）”的*定义实例*！这些语言小花招的意义在于，每当你在网页中使用定义实例时，可以使用\
  \ `dfn` 元素对其进行语义化标记（bk02ch02/example13.html）：\n\n`术语的 <dfn>定义实例</dfn> 是紧跟在`\n\n\
  `术语定义之后的`\n\n`用法。`\n\n如图 2-13 所示，浏览器用斜体渲染 `dfn` 文本。\n\n![浏览器用斜体渲染 dfn 文本的截图](img/9781394164684-fg020213.png)\n\
  \n图 2-13： 浏览器用斜体渲染 `dfn` 文本。\n\n### <dl>: 描述列表文本标签\n\n在本章前面（参见“构建项目符号列表和编号列表”），我提到了两种可以添加到网页的列表：项目符号列表和编号列表。然而，HTML\
  \ 还支持第三种列表，称为“描述列表（*description list*）”，其中每个条目都是一个键值对。最初，人们将描述列表用于词汇表或字典，每个键值对由一个术语和该术语的定义组成。不过，正如你将学到的，描述列表不仅用于定义。为了标记这些列表中的每个条目的键值对，你需要两个不同的标签。名称包含在\
  \ `dt` 元素中，而值包含在 `dd` 元素中，如下：\n\n```\n<dt>name</dt>\n<dd>value</dd>\n```\n\n对每个键值对重复此操作，并用\
  \ `<dl>` 和 `</dl>` 标签包裹整个列表以完成你的描述列表。整个结构看起来如下：\n\n```\n<dl>\n<dt>A name</dt>\n\
  <dd>Its value</dd>\n<dt>Another name</dt>\n<dd>Another value</dd>\n<dt>Yet another\
  \ name</dt>\n<dd>Yet another value</dd>\n<dt>Etc.</dt>\n<dd>意为“等等”的拉丁短语的缩写。</dd>\n\
  </dl>\n```\n\n这里有一个更真实的例子（bk02ch02/example14.html）：\n\n```html\n<h3>一些值得吐的的骂</h3>\n\
  <dl>\n<dt>disingenuflect</dt>\n<dd>以不诚或虚伪的方式表现出奴态或崇拜的样子。</dd>\n<dt>dudefussing</dt>\n\
  <dd>假装努力而进行许多细微、多余的调整，尤其是男性如此。</dd>\n<dt>escalefter</dt>\n<dd>站在拥挤电扶梯左侧的人，从而阻挡了向上或向下走的人。</dd>\n\
  <dt>nerdsplaining</dt>\n<dd>用过度理智、痴迷细节的方式进行解释，特别是当话题晦涩或高度技术化时。</dd>\n<dt>omnishambles</dt>\n\
  <dd>在所有可能方面都是一团糟的情况或人。</dd>\n</dl>\n```\n\n图 2-14 图 2-14：浏览器用等宽字体渲染 `code` 文本。\n\
  \n\n\n\n![pre 元素显示的文本与其编写的内容完全一致，包括多个空格在内。](img/9781394164684-fg020216.png)\n\n\
  FIGURE 2-16: `pre` 元素显示的文本与其编写的内容完全一致，包括多个空格在内。\n\n![记住](img/remember.png) 为你的计算机代码列表添加一些语义化的美感，请用\
  \ `code` 元素包围文本，如下：\n\n```html\n<pre><code>\nYour code goes here\n</</code></pre>\n\
  ```\n\n### `<s>` 元素：删除线文本标签\n\n在你发布网页 后，页面上的某些信息可能会变得不准确或不再相关。在大多数情况下，你只需要修复不准确之处、删除文本或更新文本以使其保持相关。然而，在某些情况下，你可能想在保留旧文本的同时添加新的或更新的文本。为什么要这样做呢？通常，是因为你希望读者能够将旧文本与新的进行对比。例如，如果一个产品现在的价格更低，如果用户还能看到旧的较高价格，那么这个降低后的价格将更有冲击力。在\
  \ HTML 中，你使用 `s` 元素来表示不准确或不再相关的文本，如下例所示（`bk02ch02/example18.html`）：\n\n```html\n\
  <h3>谁需要门票？</h3>\n<hr>\n<h4>巴西核桃夹子舞</h4>\n<p>\n<s>所有场次：每张票 $950 </s>\n</p>\n<p>\n\
  已售罄！\n</p>\n<hr>\n<h4>睡眠药美颜</h4>\n<p>\n<s>所有场次：每张票 $15,000 </s>\n</p>\n<p>\n现价 $9.99！\n\
  </p>\n<hr>\n```\n\n结果显示在 图 2-17 中，其中网页浏览器使用删除线效果渲染 `s` 元素的文本。\n\n![s 元素渲染带有删除线效果文本的截图。](img/9781394164684-fg020217.png)\n\
  \nFIGURE 2-17: `s` 元素渲染带有删除线效果的文本。\n\n![记住](img/remember.png) 你可能想（也许是讽刺地）使用 `s`\
  \ 元素来表示已删除的文本，如下：\n\n```html\n哪个<s>傻瓜</s>person（人会花这么多钱去参加芭蕾舞？\n```\n\n然而，这种标记的首选方法是使用\
  \ `del` 元素，它专门设计用于指示已删除的文本（并且同样使用删除线效果渲染文本）：\n\n```html\n哪个<del>傻瓜</del>人会花这么多钱去参加芭蕾舞？\n\
  ```\n\n### `<sub>` 元素：下标文本标签\n\n如果你的网页包含数学公式或化学符号（嘿，这确实可能发生），一个或多个术语可能需要下标。下标是一个较小的字符（通常是数字或字母），它稍微向下移动，使得字符的某部分出现在文本基准线的下方。例如：H<sub>O</sub>（水的化学式）。你使用\
  \ `sub` 元素将一个或三个字符标记为下标。这里有一个示例（`bk02ch02/example19.html`）：\n\n```html\n<p>\n今天感觉不错吗？也许你的大脑正在进行多巴胺\
  \ C<sub>8</sub>H<sub>11</sub>NO<sub>2</sub> 浴。\n</p>\n```\n\n图 2-18 显示了这些内容在浏览器中呈现的样式。\n\
  \n![使用 sub 元素将字符标记为下标的截图。](img/9781394164684-fg02018.png)\n\nFIGURE 18: 你可以使用 `sub`\
  \ 元素将字符标记为下标。\n\n### `<sup>` 元素：上标文本标签\n\n上标是一个较小的字符（通常是数字或字母），它被向上移动，使得字符的顶部部分出现在正文上方。例如：e\
  \ = mc²（爱因斯坦著名的显示质量和能量等效的公式）。现在，当然，你的网页可能包含这样的公式，但上标更常见的用法是标记脚注。无论是为了指定公式还是脚注标记，你都可以使用\
  \ `sup` 元素告诉浏览器将一个或多个字符上标显示。这里有一个脚注示例（`bk02ch02/example20.html`）：\n\n```html\n<p>\n\
  从工厂工人到教职员工，每个人都欣赏语言的某些方面；每个人都以某种方式的方式“被言语困扰”<sup>1</sup>。\n</p>\n<sup>1 这个短语出自莎士比亚：\n\
  <blockquote>\n天哪！我从未像现在这样被言语困扰过，直到我第一次称呼我的兄弟\n</blockquote>\n</p>\n```\n现在，当然，你的网页可能包含这样的公式，但上标更常见的用法是标记脚注。无论是为了指定公式还是脚注标记，你都可以使用\
  \ `sup` 元素告诉浏览器将一个或多个字符上标显示。这里有一个脚注示例（`bk02ch02/example20.html`）：\n\n```html\n<p>\n\
  Everyone, from the factory worker to the faculty member, appreciates some aspect\
  \ of language; everyone is, in one way or another, \"bethump'd with words\"<sup>1</sup>.\n\
  </p>\n<sup>1This phrase comes from Shakespeare:\n<blockquote>\nZounds! I was never\
  \ so bethump'd with words Since I first call'd my brother\n</blockquote>\n</p>\n\
  ```\n*(注：由于原文文本在结尾处存在重复和混乱的部分，译文已根据逻辑进行了对齐处理，确保了技术术语的准确性。)*\n\n\n\n\n\n*   **JPEG:**\
  \ 命名于发明它的联合图像专家小组（Joint Photographic Experts Group）。`JPEG`（读作“jay-peg”）支持具有数百万颜色的复杂图像。`JPEG`\
  \ 文件的主要优势是，在相同图像的情况下，它们比 `GIFs` 小，因此下载时间更短。不过要注意：`JPEG` 使用的是有损（lossy）压缩，这意味着它通过丢弃冗余像素来缩小图像。压缩率越高，丢弃的像素越多，图像看起来越不清晰。尽管如此，如果你有一张照片或类似的图像，`JPEG`\
  \ 几乎总是最佳选择，因为它提供的文件大小最小。\n\n*   **PNG:** 可移植网络图形格式支持数百万颜色。`PNG`（读作“p-n-g”或“ping”）是一种压缩格式，但与\
  \ `JPEGs` 不同，`PNGs` 使用的是无损（lossless）压缩。这意味着图像能够保持锐度，但文件大小可能会变得很大。如果你有一个使用纯色的插图或图标，或者一张包含大面积近纯色区域的照片，`PNG`\
  \ 是一个很好的选择。`PNG` 还支持透明度。\n\n*   **SVG:** 使用可缩放矢量图形（Scalable Vector Graphics）格式，图像是使用矢量（基于网格上点和形状的数学公式）而不是像素生成的。惊讶的是，这些矢量以一组指令的形式存在于特殊的文本格式中，这意味着你可以使用文本编辑器编辑图像！`SVG`\
  \ 是插图的良好选择，特别是当你有支持 `SVG` 格式的软件时，如 `Inkscape` 或 `Adobe Illustrator`。\n\n### 插入图像\n\
  \n好了，关于这些就够了。是时候开始把一些图像挤到你的网页上了。正如之前提到的，有一段 HTML 代码告诉浏览器显示图像。它是 `<img>` 标签，其工作原理如下：\n\
  \n```html\n<img src=\"filename\" alt=\"description\" title=\"title\">\n```\n\n在这里，`src`\
  \ 是 source（源）的缩写；`filename` 是你想显示的图形文件的名称（通常也包括位置）；`description` 是图像的简短描述（由屏幕阅读器读取，并在未显示图像或图像加载失败的用户看到）；而\
  \ `title` 是用户将鼠标指针悬停在图像上时显示的工具提示。注意，这里没有需要添加的结束标签。\n\n![警告](img/warning.png) `alt`\
  \ 属性是必须的，如果你有的图像没有 `alt` 值，你的网页就不是合法的 HTML。这是因为 `alt text`（通常称为 `alt` 值）是你页面可访问性的关键方面；有关关于\
  \ alt 文本和可访问性的更多信息，请参考第 2 本，第 6 章。尽管如此，如果你使用的是纯装饰性的图像，则不需要描述它们。在每种情况下，在 `<img>`\
  \ 标签中包含 `alt` 属性，但将其值设置为空字符串（\" \"），如下所示：\n\n```html\n<img src=\"filename\" alt=\"\
  \" title=\"title\">\n```\n\n这里有一个示例供参考。假设你有一个名为 `logo.png` 的图像。要将其添加到页面中，你使用以下行：\n\
  \n```html\n<img src=\"logo.png\" alt=\"Logophilia Ltd. company logo\" title=\"Logophilia\
  \ Ltd.\">\n```\n\n实际上，这个标签告诉浏览器：“请问，你能不能去获取一个名为 `logo.png` 的图像文件，并将其插入到页面 `<img>`\
  \ 标签所在的位置？”浏览器会尽职地从你的 Web 服务器获取图像并在页面中显示它。\n\n为了让这个简单示例正常工作，请记住你的 HTML 文件和图形文件需要位于同一个目录中。许多网站管理员会专门为图像创建一个子目录，这可以保持内容整洁有序。如果你计划这样做，请务必学习我在第\
  \ 1 本中关于使用目录和子目录的说明，第 2 章。\n\n这是一个在网页中包含图像的示例，图 3-1 显示了内容在网页浏览器中的外观（参见本书中示例文件中的\
  \ `bk02ch03/example01.html`）：\n\n```html\nTo see a World in a Grain of Sand<br>\n\
  And a Heaven in a Wild Flower<br>\n—William Blake<br>\n<img src=\"images/flower-and-ant.jpg\"\
  \ alt=\"Macro photo showing an ant exploring a flower\" title=\"Flower and Ant\"\
  >\n```\n\n![插入了图像的网页截图](img/9781394164684-fg020301.png)\n\n图 3-1： 一个插入了图像的网页。\n\n\
  ### 插入带有说明的插图\n\n在本书中，当我让你查看附近的屏幕截图时，我会说类似“图 3-1 显示了内容在网页浏览器中的外观”的话。这就是在提示你寻找说明文字中包含“图\
  \ 3-1”的图像。\n\n通常，`figure` 是在文档正文中以某种方式引用的图像。你可能不会在网页中频繁使用插图，但你需要使用时，你会高兴地发现 HTML\
  \ 有 `figure` 元素可以为 `img` 元素添加一些语义色彩。需要为图像添加说明吗？HTML 有 `figcaption` 元素提供支持。\n\n以下是指定图像带有说明的插图的通用语法：\n\
  \n```html\n<figure>\n  <img src=\"filename\" alt=\"description\" title=\"title\"\
  >\n  <figcaption>\n    在此处插入你的说明\n  </figcaption>\n</figure>\n```\n\n这是一个完整的示例，结果在\
  \ 图 3-2 中显示（图片引用稍后提供）（查看 `bk02ch03/example02.html`）：\n\n```html\n<p>\nChecking out\
  \ the source code of a web page isn't\nnormally a \"fun\" experience. Most\ndelightful\
  \ one\n</p>\n<figure>\n  <img src=\"guardian-hiring.jpg\" alt=\"Screenshot of the\
  \ Guardian\n\" title=\"Source Code Ad\">\n  <figcaption>\n    <b>Figure 1</b>—Source\
  \ Code\nnewspaper web page.\n  </figcaption>\n</figure>\n```\n\n![带有说明的网页截图](img/9781394164684-fg02032.png)\n\
  \n图 3-2： 带有说明的网页。\n\n\n\n\n我这样做是因为否则浏览器会将图像与文本内行对齐。为什么呢？因为可能让你惊讶的是，`img` 是一个行内元素，而不是块级元素。幸运的是，如果你确实想让图片跟随文本流，你对图像和文本的对齐方式拥有一定的控制权，但这需要快速涉足\
  \ CSS 领域。要控制对象的垂直对齐，你需使用 `vertical-align` 属性：\n\n```css\n`selector` {\n  vertical-align:\
  \ `value`;\n}\n```\n\n或者，作为一种属性使用：\n\n```html\nstyle=\"vertical-align: value;\"\n\
  ```\n\n对于 `value`，你可以输入一个长度（例如像素），正值长度会将图像向上移动，负值长度会将图像向下移动。`vertical-align` 属性还支持许多预定义值，其中以下这些是你需要了解的：\n\
  \n*   `baseline`：将图像底部与图像所在文本行的基线（baseline）在垂直方向对齐。（`baseline` 是一条穿过 `c` 和 `i` 等没有下部笔的字母底部的虚拟水平线。）这是默认值。\n\
  *   `bottom`：将图像底部与图像所在文本行的底部在垂直方向对齐。（`bottom` 行是一条穿过 `g` 和 `y` 等字母最低最低部分的虚拟水平线。这些位于基线以下的部分被称为下部笔（descenders）。）\n\
  *   `middle`：将图像的中间与图像所在文本行的基线加上当前字体 x 高度的一半在垂直方向对齐。（字体的 `x-height` 是指没有上部笔或下部笔的字母（如\
  \ `c` 和 `x`）的高度。）\n*   `top`：将图像顶部与图像所在文本行的顶部在垂直方向对齐。（`top` 行是一条穿过 `h` 和 `t` 等字母最顶端部分的虚拟水平线。这些位于\
  \ x 高度以上的部分被称为上部笔（ascenders）。）\n\n这是一个示例，图 3-3 显示了在浏览器中的视觉效果（`bk02ch03/example04.html`）：\n\
  \n```html\n<div>\n  <img src=\"images/image01.jpg\" alt=\"\" style=\"vertical-align:\
  \ baseline;\">Baseline\n</div>\n<div>\n  <img src=\"images/image02.jpg\" alt=\"\"\
  \ style=\"vertical-align: bottom\">Bottom\n</div>\n<div>\n  <img src=\"images/image03.jpg\"\
  \ alt=\"\" style=\"vertical-align: middle\">Middle\n</div>\n<div>\n  <img src=\"\
  images/image04.jpg\" alt=\"\" style=\"vertical-align: top\">Top\n</div>\n```\n\n\
  ![vertical-align 属性值的应用截图。](img/9781394164684-fg020303.png)\n\n图 3-3： vertical-align\
  \ 属性值的应用。\n\n![记住](img/remember.png) 想如何为页面定义背景图像吗？我猜到了。这是通过 CSS 实现的，我将在第三本书的第 6\
  \ 章 中详细介绍细节。\n\n### 嵌入视频\n\n如果说一张画胜过千言，那么视频又值多少钱呢？我不知道，但考虑到网络上海量的视频内容，这一定是一个巨大的数字。似乎每个拥有个人主页的\
  \ Tom、Diego 和 Harriette 都在提供视频内容。如果你想加入他们的行列，那么你来对地方了。\n\n如何将视频嵌入网页中取决于视频的类型：\n\n\
  *   **第三方视频：**对于来自 YouTube、Vimeo 和 Dailymotion 等第三方网站的视频，你向页面中插入一些 HTML 代码，这些代码会自动播放来自第三方网站的视频。\n\
  *   **你自己的视频：**对于你自己创建的视频文件，你将文件上传到服务器，然后使用 `video` 元素将视频插入你的页面。\n\n接下来的几个章节将提供有时非常详尽的细节。\n\
  \n### 嵌入第三方视频\n\n到目前为止，用视频内容活跃你的网页最简单的方法是嵌入一些 HTML 代码，播放来自第三方在线视频提供商（如 YouTube）的视频。这是一条捷径，因为这意味着你不需要担心视频格式、上传视频文件以及处理提供视频时往往高昂的带宽成本。\n\
  \n几乎每个在线视频提供商都为每个视频提供“分享”（Share）功能，该分享功能通常包含一个“嵌入”（Embed）组件，使你能够复制所需的代码将视频嵌入你的页面中。以下是从三个主要的在线视频提供商获取所需\
  \ HTML 代码的说明：\n\n*   ![image](img/9781394164684-ma002.png) **Dailymotion：**访问 `dailymotion.com`\
  \ 并找到你想嵌入到页面的视频。点击分享图标（如侧边栏所示），然后点击“嵌入视频”（Embed Video）显示所需代码的对话框。根据需要开启或关闭自动播放（Autoplay）开关。（当开启自动开启，视频将自动播放。）\n\
  *   **Vimeo：**访问 `vimeo.com` 并找到你想嵌入到页面的视频。点击分享图标（如侧边栏所示），然后点击“嵌入视频”（Embed Video）显示所需代码的对话框。\n\
  *   **YouTube：**访问 `youtube.com` 并找到你想嵌入到页面的视频。点击分享图标（如侧边栏所示），然后点击“嵌入视频”（Embed Video）显示所需代码的对话框。\n\
  \n### 嵌入你自己的视频\n\n如果你倾向于（或需要）走 DIY 视频路线，我既有好消息也有坏消息，但恐怕后者的比例要更倾向于坏消息。\n\n好消息是，HTML\
  \ 提供了 `video` 元素，你可以用它将视频播放器嵌入页面，视频播放器不仅可以显示你的视频，还提供播放控制功能。坏消息是，如今网页友好的视频文件格式混杂，因此并不总是清楚哪种是最佳方案。\n\
  \n#### 关于网络媒体格式的一些要说明\n\n![技术细节](img/technicalstuff.png) 在继续之前，你需要知道网络媒体格式有两个重要的方面：\n\
  \n*   **容器（container）：**媒体的文件格式。为什么称它为*容器*？因为它是一个存档文件——类似于 Zip 文件——包含了媒体所需的多个项目，包括编解码器（参见下一项）和元数据。\n\
  \n\n\n\n\n- **解码器 (codec)：** 用于将媒体编码并压缩为数字格式，以及为了播放而解码并解压缩媒体的算法。（因此，`codec` 是一个结合了\
  \ `code/decode` 和 `compress/decompress` 的组合词。）\n\n这意味着每个网络媒体文件都采用特定的媒体格式，该格式使用特定的容器（container），而容器内部（除其他内容外）包含了该格式支持的所有解码器。这极其复杂，但当你发现世界上根本没有所谓的“标准视频格式”时，情况就变得更糟了！\n\
  \n## 坏消息：网络视频格式\n\n当你需要在页面中嵌入视频时，你有三种主要的格式需要处理：\n\n- **MPEG-4：** 使用 `MPEG-4` 容器，其中包含\
  \ `H.264` 视频解码器以及 `AAC` 音频解码器。该格式受专利保护，但对终端用户是的。`MPEG-4` 视频文件使用 `.mp4` 扩展名。\n- **Ogg：**\
  \ 使用 `Ogg` 容器，其中包含 `Theora` 视频解码器，以及 `Vorbis` 或 `Opus` 音频解码器。该格式是开源且免版税的。`Ogg` 视频文件使用扩展名\
  \ `.ogg` 或 `.ogv`。\n- **WebM：** 使用 `WebM` 容器，其中包含 `VP8` 或 `VP9` 视频解码器，以及 `Vorbis`\
  \ 或 `Opus` 音频解码器。该格式是开源且免版税的。`WebM` 视频文件使用 `.webm` 扩展名。\n\n![提示](img/tip.png) 有大量的在线工具可以将视频转换为我列出的格式。两个值得尝试的网站是\
  \ Zamzar ([`www.zamzar.com`](http://www.zamzar.com)) 和 Online-Convert ([`www.online-convert.com/`](http://www.online-convert.com/))。\n\
  \n我希望能指着其中一种格式说：“只用这一个。”然而，有两点阻止了我这样做：\n\n- **浏览器支持：** `MPEG-4` 和 `WebM` 都得到了所有主流浏览器的支持，但对\
  \ `Ogg` 的支持尚未到位。\n- **版税：** `Ogg` 和 `WebM` 都是免版税的，但受专利的 `MPEG-4` 需要浏览器公司支付版税才能使用。`MPEG-4`\
  \ 视频的卓越质量意味着所有浏览器都支持它，但未来可能并不总是如此。\n\n底线是，尽管你为自己的视频文件使用 `MPEG-4` 可能没问题，但如果你还能制作一个\
  \ `WebM` 版本，你应该为访问者提供这两种文件格式。要学习如何操作，请继续阅读关于 HTML `video` 元素的详细说明。\n\n## 好消息：`<video>`\
  \ 标签\n\n鉴于我在上一节中长篇大论的网络视频格式的复杂性，发现得益方便的 `video` 元素，将自己的视频嵌入网页中实际上相对简单，这真是令人欣慰。你如何使用\
  \ `video` 元素取决于你提供的是单一视频文件格式还是多种格式。\n\n首先，如果你只提供单一视频文件格式，可以使用通用的 `video` 元素语法：\n\
  \n```html\n<video src=\"source\"\nposter=\"poster\"\nwidth=\"width\"\nheight=\"\
  height\"\nautoplay\ncontrols\nloop\n</video>\n```\n\n以下是每个属性的含义：\n\n- `src`：视频文件的名称，如果该文件与\
  \ HTML 文件位于同一位置。如果视频文件位于不同的目录，你需要包含该信息，以便浏览器知道去哪里查找文件。\n- `poster`：你希望浏览器在视频播放开始前显示的图像的名称（以及目录，如果需要的话）。大多数情况下，你会使用视频的标题帧或静止帧。\n\
  - `width`：视频播放窗口的宽度（单位为像素）。\n- `height`：视频播放窗口的高度（单位为像素）。\n- `autoplay`：包含此属性可让浏览器在文件下载足够以进行流畅播放后自动开始播放视频。如果你不想让视频自动播放，请省略\
  \ `autoplay` 属性。\n- `controls`：包含此属性可让浏览器在视频窗口中显示播放控件。如果你不希望访问者能够控制播放，请省略 `controls`\
  \ 属性。\n- `loop`：包含此属性让浏览器每当视频结束时自动从头开始播放。如果你只想让视频播放一次，请省略 `loop` 属性。\n\n这是一个嵌入视频的示例，图\
  \ 3-5 显示了嵌入网页的视频（bk02ch03/example05.html）。\n\n```html\n<video src=\"videos/bear.mp4\"\
  \nposter=\"images/bear.png\"\nwidth=\"640\"\nheight=\"480\"\nautoplay\ncontrols\n\
  loop\n</video>\n```\n\n![嵌入网页的 MPEG-4 视频截图](img/9781394164684-fg020305.png)\n\n\
  图 3-5： 嵌入网页的 MPEG-4 视频。\n\n如果你想提供多种格式，请从 `<video>` 标签中移除 `src` 属性，并添加多个 `source`\
  \ 元素，每个元素对应你想要的每种格式：\n\n```html\n<video poster=\"poster\"\nwidth=\"width\"\nheight=\"\
  height\"\nautoplay\ncontrols\nloop>\n<source src=\"filename1\" type=\"type1\">\n\
  <source src=\"filename2\" type=\"type2\">\n</video>\n```\n\n浏览器按照你指定的顺序运行 `source`\
  \ 元素，并播放它遇到的第一个兼容格式。`video` 属性与我之前描述的相同，但这里是关于 `<source>` 标签你需要了解的：\n\n- `src`：视频文件的名称，如果该文件与\
  \ HTML 文件位于同一位置。如果视频文件位于不同的目录，你需要包含该信息，以便浏览器知道去哪里查找文件。\n- `type`：一个用引号括的字符串，用于指定视频和解码器：\n\
  \    - *MPEG-4:* 使用以下内容：`video/mp4; codecs=\"avc1.4D0E, mp4a.02\"`\n    - *Ogg:*\
  \ 使用以下内容：`video/ogg; codecs=\"theora, vorbis\"` 或 `video/ogg; codecs=\"opus\"`\n\
  \    - *WebM:* 使用以下内容：`video/webm; codecs=\"vp8, vorbis\"` 或 `video/webm; codecs=\"\
  vp9, opus\"`\n\n这是一个嵌入视频的示例（bk02ch03/example06.html）：\n\n```html\n<video poster=\"\
  images/bear.png\"\nwidth=\"640\"\nheight=\"480\"\nautoplay\ncontrols\nloop>\n<source\
  \ src=\"videos/bear.mp4\" type=\"video/mp4; codecs=\"avc1.4D0E, mp4a.02\">\n<source\
  \ src=\"videos/bear.webm\" type=\"video/webm; codecs=\"vp8, vorbis\">\n<source src=\"\
  videos/bear.ogv\" type=\"video/ogg; codecs=\"theora, vorbis\">\n</video>\n```\n\n\
  ## 嵌入音频片段\n\n在现代网页中，音频片段不像视频那样流行，但你可能会有机会为访问者提供某种音频享受。和视频一样，将音频嵌入网页的方法取决于音频的类型：\n\
  \n- **第三方音频：** 对于来自 SoundCloud、Bandcamp 或 Mixcloud 等第三方网站的音频文件，你向页面插入一些 HTML 代码来自动播放这些网站的音频。\n\
  - **自己的音频：** 对于你自己创建的音频文件，你将其上传到服务器，然后使用 `audio` 元素将其插入页面中。\n\n接下来的几节将提供细节。\n\n\
  ### 嵌入第三方音频\n\n通过嵌入一些从第三方在线音频提供处获取的 HTML 代码，你可以快速地在网页上建立音频片段。\n\n\n\n\n\n- **Bandcamp:**\
  \ 访问 bandcamp.com 并打开你想嵌入到页面中的音频。点击 Share（分享/嵌入）按钮，点击 Embed This Album（嵌入此专辑），然后点击播放器样式以显示代码。根据需要自定义播放器，然后复制\
  \ Embed 框中出现的代码。将该代码粘贴到 HTML 文件中你想显示音频播放器的位置。\n\n- **Mixcloud:** 访问 mixcloud.com\
  \ 并显示你想嵌入到页面中的音频。点击 Share（分享）按钮，在弹出的对话框中，点击 Embed Player（嵌入播放器）标签页。点击你想使用的音频小组件样式，然后复制对话框中出现的代码。（你也可以点击\
  \ More Options 更多选项来自定义你的播放器。）将代码粘贴到 HTML 文件中你想显示音频小组件的位置。\n\n- **SoundCloud:**\
  \ 访问 soundcloud.com 并找到你想嵌入到页面中的音频。点击 Share（分享）按钮，在弹出的对话框中，点击 Embed（嵌入）标签页显示代码，如图\
  \ 3-6\n\n图 3-6： SoundCloud 音频轨道的嵌入代码和选项。\n\n![警告](img/warning.png) 除非你清楚自己在做什么，否则不要编辑由在线音频提供商提供的\
  \ HTML 代码。一个轻率的更改就可能导致你的嵌入音频无法播放。\n\n### 嵌入你自己的音频\n\n你有自己的音频文件并想提供给页面访问者吗？没问题！音频文件格式比视频格式世界要理智得多，而且\
  \ HTML 提供了 `audio` 元素可以实现相对轻松的音频嵌入。\n\n### 网页音频格式\n\n对于网页音频，你需要处理以下格式：\n\n- **MP3:**\
  \ 该格式既是容器也是音频编解码器。该格式受专利保护，但对终端用户免费。这些音频文件使用 `.mp3` 扩展名。\n\n- **WAV:** 该格式既是容器也是音频编解码器。这些音频文件使用\
  \ `.wav` 扩展名。\n\n- **WebM:** 该格式使用 WebM 容器，内部是 Vorbis 或 Opus 音频编解码器。该格式开源且免版税费。这些音频文件使用\
  \ `.webm` 扩展名。\n\n- **Ogg:** 该格式使用 Ogg 容器，内部是 Vorbis 或 Opus 音频编解码器。该格式开源且免版税费。这些音频文件使用\
  \ `.ogg` 或 `.oga` 扩展名。\n\n- **MPEG-4:** 该格式使用 MPEG-4 容器，内部是 AAC 音频编解码器。该格式受专利保护，但对终端用户免费。这些音频文件使用\
  \ `.m4a` 扩展名。\n\n![提示](img/tip.png) 有有很多工具可以将音频文件转换为我列出的格式。三个值得尝试的网站是：Zamzar ([`www.zamzar.com`](http://www.zamzar.com))、Online-Convert\
  \ ([`www.online-convert.com/`](http://www.online-convert.com/)) 以及 Media.io ([`https://media.io`](https://media.io))。\n\
  \n![记住](img/remember.png) 所有主流浏览器都长期支持 MP3 格式，所以你几乎一直可以使用 MP3 文件类型。\n\n### <audio>\
  \ 标签\n\n首先，如果你只提供单个音频文件格式，这是通用的 `audio` 元素语法：\n\n```html\n<audio src=\"source\"\n\
  autoplay\ncontrols\nloop\n</audio>\n```\n\n以下是每个属性的含义：\n\n- `src`: 音频文件的名称，如果该文件与\
  \ HTML 文件位于同一位置。如果音频文件位于不同的目录，你需要包含该信息，以便浏览器知道去哪里查找该文件。\n\n- `autoplay`: 包含此属性，让浏览器在文件下载足够以进行平滑播放后自动开始播放音频。如果你不想让音频自动开始，请省略\
  \ `autoplay` 属性。\n\n- `controls`: 包含此属性，让浏览器在音频窗口中显示播放控件。如果你不想让访问者能够控制播放，请省略 `controls`\
  \ 属性。\n\n- `loop`: 包含此属性，让浏览器在每次音频结束时自动从头开始播放。如果你只想让音频播放一次，请省略 `loop` 属性。\n\n这是一个嵌入音频的示例，图\
  \ 3-7 显示了嵌入网页中的音频 (bk02ch03/example07.html)。\n\n```html\n<audio src=\"audio/jabberwocky.mp3\"\
  \nautoplay\ncontrols\nloop\n</audio>\n```\n\n![嵌入网页的 MP3 音频文件截图](img/9781394164684-fg020307.png)\n\
  \n图 3-7： 嵌入网页的 MP3 音频文件。\n\n如果你想提供多种格式，浏览器按照你指定的顺序遍历 `source` 元素，并播放遇到的第一个兼容格式：\n\
  \n```html\n<audio autoplay controls loop>\n<source src=\"audio/jabberwocky.mp3\"\
  \ type=\"audio/mp3\">\n<source src=\"audio/jabberwocky.wav\" type=\"audio/wav\"\
  >\n<source src=\"audio/jabberwocky.webm\" type=\"audio/webm\">\n<source src=\"audio/jabberwocky.ogg\"\
  \ type=\"audio/ogg\">\n<source src=\"audio/jabberwocky.m4a\" type=\"audio/m4a\"\
  >\n您的浏览器不支持 audio 元素。\n</audio>\n```\n\n`audio` 内部的文本仅显示给不支持该元素的浏览器。\n\n\n\n\n\n\
  HTML `table` 是一种以矩形排列方式呈现数据的结构，由一或多个列和一或多行组成。从这个意义上说，你可以将表格看作一种数据库：每个表格列等同于数据库字段，包含单一类型的信息，例如名称、地址或电话号码；每一行都等同于数据库记录，持有一组相关的字段值，例如单个联系人的信息。图\
  \ 4-1 显示了一个典型的表格，并指出了几个关键特征（如需查看代码，请检查此书示例文件中的 `bk02ch04/example01.html`）。\n\n![HTML\
  \ 表格的示意图，将数据在行、列和单元格中进行矩形排列。](img/9781394164684-fg020401.png)\n\n图 4-1： HTML 表格是将数据在行、列和单元格中进行矩形排列。\n\
  \n为了确保你理解了正在发生什么（毕竟这是我的工作），请查看一些表格术语：\n\n*   **行（Row）：** 横跨表格的单行数据“线”。\n*   **列（Column）：**\
  \ 单个垂直数据区域。在图 4-1 表格中，有五列。\n*   **单元格（Cell）：** 行和列的交叉点。单元格保存着你用来展示表格的单个数据项。\n* \
  \  **标题（Caption）：** 出现在（通常）表格上方的文本，用于描述表格的内容。\n*   **表头（Headers）：** 表格的第一行。表头是可选的，但许多人使用它们来标记每一列。\n\
  \n这里没什么什么高深的科学原理。到此时，你脑中可能会跳出两个问题。首先，鉴于 `pre` 元素（参见第 2 卷，第 2 章）让文本对齐得整整齐齐非常出色，既然\
  \ `pre` 能够完成类似的工作，为什么还要用表格呢？问得好。以下是表格为……呃，表格带来的少数几个优势：\n\n*   **对齐文本非常简单。** 使用 `pre`\
  \ 让文本对齐充其量是令人沮丧的，最糟糕甚至是让人抓狂、头痛欲裂、诅咒该死的@#$%&!-网页的苦差事。但使用表格，你可以毫不费力地让文本像训练营的新兵一样对齐。\n\
  *   **单元格之间互不影响。** 每个表格单元格都是自自包含的。你可以编辑和样式化单元格的内容，而不会干扰其他表格元素的布局。\n*   **文本换行效果极佳。**\
  \ 文本会在每个单元格内换行，使得创建多行条目变得轻而易举。\n*   **你可以无所不能。** 表格不仅可以包含文本，还可以包含图像和链接（甚至是表格！）。\n\
  *   **它们很好看。** `pre` 元素内换行的文本使用等宽字体，看起来并不好看，但表格使用的是普通的页面字体，看起来好得多。而且，作为一个额外，表格带有许多你可以利用的\
  \ CSS 属性让你的表格看起来非常酷。\n\n其次，鉴于表格非常擅长精确定位文本，并且考虑到表格不仅支持文本还支持图像和其他内容，是否可以使用一个巨大的表格来布局我的页面呢？另一个问得很好的问题！你越来越顺了！\n\
  \n让我先说，使用表格组织页面元素在多年来一直是标准的布局技术。然而，没有人非常喜欢这样使用表格，因为表格太僵化、太笨重，而且在大屏幕和小屏幕上都难以良好渲染。如今，没有人使用表格来布局页面，而是倾向于使用更新、更强大的技术，例如\
  \ Flexbox（参见第 5 卷，第 2 章）和 Grid（参见第 5 卷，第 3 章）。\n\n## 网页木工：如何构建表格\n\n好了，是时候给 HTML\
  \ 表格踩上油门，开始制作这些表格内容了。接下来的几节将带你完成构建基础表格的步骤。\n\n### 最简单的情况：单行表格\n\n作为一个示例，我将构建一个与食物相关的有趣城市名称的简单表格。为什么不呢？表格总是从以下容器开始：\n\
  \n```\n<table>\n</table>\n```\n\n所有其他表格标签都放在这两个标签之间。接下来，你添加表格体的容器（即行和列，不包括稍后会学到的表头）。\n\
  \n```html\n<table>\n<tbody>\n</tbody>\n</table>\n```\n\n在你准备好这个基础结构后，剩余大部分表格工作都涉及以下四个步骤的过程：\n\
  \n1.  **添加一行。**\n2.  **将该行分为你需要的列数。**\n3.  **在每个单元格中插入数据。**\n4.  **重复步骤 1 到 3 直到完成。**\n\
  \n要添加一行，你在 `<tbody>` 和 `</tbody>` 之间丢入 `<tr>`（表格行）标签和一个 `</tr>` 标签（其对应的结束标签）：\n\n\
  ```html\n<table>\n<tbody>\n<tr></tr>\n</tbody>\n</table>\n```\n\n现在，通过在 `<tr>` 和\
  \ `</tr>` 之间放置 `<td>` 标签将行分为你需要的列数。例如，如果你想要三列，这样做：\n\n```html\n<table>\n<tbody>\n\
  <tr>\n<td></td><td></td><td></td>\n</tr>\n</tbody>\n</table>\n```\n\n现在通过输入 `<td>`\
  \ 及其结束标签 `</td>` 输入每个单元格的数据：\n\n```html\n<table>\n<tbody>\n<tr>\n<td>Candy</td>\n\
  <td>New Mexico</td>\n<td>59</td>\n</tr>\n</tbody>\n</table>\n```\n\n![HTML 表格的示意图，将数据在行、列和单元格中进行矩形排列。](img/9781394164684-fg020401.png)\n\
  \n图 4-1： HTML 表格是将数据在行、列和单元格中进行矩形排列。\n\n为了确保你理解正在发生什么（毕竟这是我的工作），请查看一些表格术语：\n\n*\
  \   **行（Row）：** 横跨表格的单行数据“线”。\n*   **列（Column）：** 单个垂直数据区域。在图 4-1 表格中，有五列。\n*  \
  \ **单元格（Cell）：** 行和列的交叉点。单元格保存着你用来展示表格的单个数据项。\n*   **标题（Caption）：** 出现在（通常）表格上方的文本，用于描述表格的内容。\n\
  *   **表头（Headers）：** 表格的第一行。表头是可选的，但许多人使用它们来标记每一列。\n\n这里没什么什么高深的科学原理。到此时，你脑中可能会跳出两个问题。首先，鉴于\
  \ `pre` 元素（参见第 2 卷，第 2 章让文本对齐得整整齐齐非常出色，既然 `pre` 能够完成类似的工作，为什么还要用表格呢？问得好。以下是表格为……呃，表格带来的少数几个优势：\n\
  \n*   **对齐文本非常简单。** 使用 `pre` 让文本对齐充其量是令人沮丧的，最糟糕甚至是让人抓狂、头痛欲裂、诅咒该死的@#$%&!-网页的苦差事。但使用表格，你可以毫不费力地让文本像训练营的新兵一样对齐。\n\
  *   **单元格之间互不影响。** 每个表格单元格都是自包含的。你可以编辑和样式化单元格的内容，而不会干扰其他表格元素的布局。\n*   **文本换行效果极佳。**\
  \ 文本会在每个单元格内换行，使得创建多行条目变得轻而易举。\n*   **你可以无所不能。** 表格不仅可以包含文本，还可以包含图像和链接（甚至是表格！）。\n\
