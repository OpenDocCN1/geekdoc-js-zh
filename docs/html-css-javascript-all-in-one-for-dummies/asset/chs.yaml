  \n多年来，我一直听到许多聪明人认为，HTML、CSS 和 JavaScript 超出了他们的能力。为什么没有人谈论这些技术到底有多容易上手呢？\n\n在反复问自己这些问题后，我终于决定做些什么。我写这本书是为了向所有人——是的，甚至是那些怀疑的人——证明这些技术是平易近人的、直观且易于学习的。让我告诉你们一个秘密。准备好了吗？\n\
  \n*学习网页并不困难*\n\n当然，听起来很难，如果你曾经窥探过，我会承认构建网站确实很难。但创建一个个人网站呢？不容易。为本地团队创建一个网站？不容易。为了爱好创建一个网站？不容易。\n\
  \n## 关于本书\n\n那么，欢迎阅读《HTML、CSS 和 JavaScript 全通指南》。本书将为你提供关于如何打造专业网页的完整教育。你将学习如何设置工具、如何使用\
  \ HTML 和 CSS 设计并构建你的网站，以及如何使用 JavaScript 编写页面。我的目标是让你们看到这些技术并不难学，即使是最绿的网页设计师也能制作出令家人和朋友惊讶的页面。\n\
  \n如果你在寻找大量的编程历史、计算机科学理论以及对概念的长篇解释，我很抱歉，在这里找不到。我在整本书中的哲学源于 Linux 系统的创始人 Linus Torvalds：“空谈很容易。给我看代码。”我会解释需要解释的内容，然后就不再多言（大多数时候完全不废话），直接进入示例和脚本，这些内容比我能提供的任何冗长解释都能更好地说明一个概念（相信我，我确实擅长啰嗦）。\n\
  \n### 如何开始本书\n\n你阅读这本书的方式取决于你目前的网页编码水平（或缺乏水平）：\n\n*   如果你是初学者，请从头开始阅读第一部分，并按照自己的节奏顺序阅读第二部分\
  \ 和第三部分。这将让你获得在书的其他部分中想要选择学习的内容所需的所有知识。\n\n\n\n\n\n*   如果你了解 HTML 和 CSS，可能只需要快速浏览一下第\
  \ 2 和第 3 ，然后开始仔细学习第 4 本及之后的内容。\n\n*   如果你已经做过一些 JavaScript 编码，我建议你快速过一遍第 4 本中的材料，然后根据自己的需要探索其他微型书籍。\n\
  \n### 我的“无 AI”保证\n\n当我开始更新这个版本的书籍时，世界正充斥着关于人工智能的帖子、讨论和无休止的推测，甚至似乎我们很快就要迎接新的 AI 统治者了。这种情况在短期内不太可能发生，但\
  \ AI 已经到来，并且已经成为许多人工作日常的重要组成部分。\n\n我曾像那些最大的 AI 推动者一样痴迷 ChatGPT 及其类产品。我使用 AI 进行娱乐和满足好奇，但我不会用它来工作。这意味着，书书中使用的任何文字、代码或示例都不是由\
  \ AI 生成的。你在这里读到的所有内容，无论好坏，都是我这个与生就有些扭曲的大脑的产物。\n\n## 愚的假设\n\n这本书并不是关于互联网或使用万维网的入门教程。这是一本纯粹的关于构建网页的书。这意味着我假设了以下情况：\n\
  \n*   你知道如何操作基础文本编辑器，以及如何在电脑的操作系统和文件系统中进行切换。\n\n*   你有一个互联网连接。\n\n*   你知道如何使用网络浏览器。\n\
  \n没错，就是这些。\n\n我应该在这里提一下，这本书完全关于编码网页发烧友所说的 `front end`（前端），这意味着你在网络浏览器中看到的内容。网页还有\
  \ `back end`（后端），指的是在 Web 服务器上发生的事情。在本书书中，我不涉及任何后端编码。如果你对网页的这部分感兴趣，我可以不谦虚地推荐我的书《Web\
  \ Coding and Development All-in-One For Dummies》（Wiley 出版）。\n\n## 本书中使用的图标\n\n![记住](img/remember.png)\
