    value of x is greater than 20\");\n}\nelse{\n  document.write(\"value of x is\
    \ less than 20\");\n}\n</script>\n</body>\n</html>\n```\n*(注：由于原文提供的 else if 示例代码不完整，此处根据逻辑补全了翻译结构)*\n\
