- fmt: "\nWhile a `while` loop executes items indefinitely, a `do while` loop executes\
    \ code only once, regardless of whether the condition is true or false. We utilize\
    \ `do-while` when we need to repeat the statement block at least once.\n\n![Image\
    \ 6.jpg](Image00012.jpg)\n\n## Syntax\n\n```javascript\ndo{\n  code to be executed\n\
    \  increment/decrement\n} while (condition);\n```\n\n## Example\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>\nvar i=11;\ndo{\n  document.write(i + \"<br/>\"\
    );\n  i++;\n}while (i<=15);\n</script>\n</body>\n</html>\n```\n\n### Output\n\
    11\n12\n13\n14\n15\n\n## JavaScript Function\n\nThe ability to define new functions\
    \ within the `<script>.....</script>` tag is an important feature of JavaScript.\
    \ The `function` keyword is used to declare a function in JavaScript.\n\nTo reuse\
    \ the code, we call the JavaScript method numerous times.\n\n### Advantages -\
    \ JavaScript functions\n1. **Code reusability**: We use the same method several\
    \ times to save time and code.\n2. **Less coding**: Our application is compressed\
    \ as a result of this. When we conduct a routine task, we don't write a lot of\
    \ code.\n\n### Syntax\n```javascript\nfunction functionName(parameter or not)\n\
    {\n  statements\n}\n```\n\n### Example\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <script>\nfunction msg()\n{\n  alert(\"Hello! world\");\n}\n</script>\n<input\
    \ type=\"button\" onclick=\"msg()\" value=\"click here\"/>\n</body>\n</html>\n\
    ```\n\n### Output\nHello world!\n\n## Function with arguments\nCall function by\
    \ passing arguments.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction\
    \ getcube(number)\n{\n  alert(number* number* number);\n}\n</script>\n<form>\n\
    \  <input type=\"button\" value=\"click\" onclick=\"getcube(3)\"/>\n</form>\n\
    </body>\n</html>\n```\n\n### Output\n27\n\n## Example\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<script>\nfunction getname()\n{\n  name=prompt(\"Enter the Name\"\
    );\n  alert(\"Welcome Mr/Mrs \" + name);\n}\n</script>\n</body>\n<form>\n  <input\
    \ type=\"button\" value=\"Click\" onclick=\"getname()\"/>\n</form>\n</html>\n\
    ```\n\n## Function with return value\nCall function that - return value and -\
    \ use it in program.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction\
    \ getInfo()\n{\n  return \"Hello Raj! How are you?\";\n}\n</script>\n<script>\n\
    \  document.write(getInfo());\n</script>\n</body>\n</html>\n```\n\n### Output\n\
    Hello Raj! How are you?\n\n## The Function() Constructor\nA function statement\
    \ isn't just for defining new functions; it may also be used to define functions\
    \ dynamically using the `Function()` constructor and the `new` operator.\n\n###\
    \ Syntax\n```javascript\n<script>\n  var varilename = new Function(Arg1, Arg2...,\
    \ \"Function Body\");\n</script>\n```\n\n### Example\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<script>\nvar func = new Function(\"a\", \"b\", \"return a+b;\"\
    );\nfunction secondFunction(){\n  var result;\n  result = func(50,50);\n  document.write\
    \ (result );\n}\n</script>\n</head>\n<body>\n  <p>Click button to call the function</p>\n\
    \  <form>\n    <input type=\"button\" onclick=\"secondFunction()\" value=\"Call\
    \ Function\">\n  </form>\n  <p>Use different parameters inside the function and\
    \ try yourself...</p>\n</body>\n</html>\n```\n\n## Function Literals\nThe concept\
    \ of function literals, which is another way to construct functions, is introduced\
    \ in JavaScript 1.2. It's an expression that defines a function that't have a\
    \ name. The syntax for a function literal is similar to that of a function statement,\
    \ except that it is used as an expression rather than statement, and there is\
    \ no need for a function name.\n\n### Syntax\n```javascript\n<script>\nvar varilename\
    \ = function (Argument){\n  Function Body\n};\n</script>\n```\n\n### Example\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nvar func =function(a,b){return\
    \ a+b};\nfunction secondFunction(){\n  var result;\n  result = func(10,20);\n\
    \  document.write (result );\n}\n</script>\n</head>\n<body>\n  <p>Click the button\
    \ to call the function</p>\n  <form>\n    <input type=\"button\" onclick=\"secondFunction()\"\
    \ value=\"Call Function\">\n  </form>\n  <p>Use different parameters inside the\
    \ function and try yourself...</p>\n</body>\n</html>\n```\n\n## Javascript Object\n\
    An object is a state-and-behavioral entity. JavaScript is a scripting language\
    \ that focuses on objects. Although JavaScript is template-based rather than class-based,\
    \ it allows us to create objects.\n\n### Syntax - add property - add object\n\
    `objectName.objectProperty = propertyValue;`\nWe use the `write()` method to document\
    \ objects to write any content on the document. `Document.write(\"Hello world\"\
    )`\n\n### Example\nThe following example shows how to create an Object.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>User-defined objects</title>\n<script\
    \ type=\"text/javascript\">\nvar book=new Object(); // Object created\nbook.subject\
    \ = \"5 points someone\"; // Properties assign to the object\nbook.author = \"\
    ChetanBhagat\";\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n  document.write(\"Book Name is : \" + book.subject + \"<br>\");\n  document.write(\"\
    Book Author is : \" + book.author + \"<br>\");\n</script>\n</body>\n</html>\n\
    ```\n\n### Output\nBook Name is : 5 points someone\nBook Author is : ChetanBhagat\n\
    \n## Methods of an Object\n\n### Example\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>User-defined objects</title>\n<script type=\"text/javascript\">//Define\
    \ a function which will work as a method\nfunction addPrice(amount){\n  this.price\
    \ = amount;\n}\nfunction book(title,author){\nitle=title;\nauthor=author;\nprice;\
    \ //Assign that method as property.\n}\n</script>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\nvarmyBook=new book(\"5 Points Someone\",\"ChetanBhagat\");\n\
    myBook.addPrice(150);\n  document.write(\"Book Title is : \" + myBook.title +\
    \ \"<br>\");\n  document.write(\"Book Author is : \" + myBook.author + \"<br>\"\
    );\n  document.write(\"Book Price is : \" + myBook.price + \"<br>\");\n</script>\n\
    </body>\n</html>\n```\n*(Note: The source text contained some typos in the last\
    \ example block logic; the structure has been preserved as per semantic rules).*\n\
    \n### Output\nBook Title is: 5 Points Someone\nBook Author is :ChetanBhagat\n\
    Book Price is : 150\n\n## Javascript array\nArrays are used to represent a collection\
    \ of elements in a single unit or memory region. Every element that enters the\
    \ array will be stored in the array with a unique index starting at zero. We can\
    \ store data with the help of indexes. In JavaScript, we must use the `new` keyword\
    \ to declare an array. We use `new Array` to construct an array `(n)`. The number\
    \ of slots in the array is denoted by `n`.\n\n### Syntax\n`myarray = new array(n);`\n\
    NOTE: We construct array objects with zero size whenever we build an array in\
    \ JavaScript without specifying the size.\n\n### Example\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<script>\nvar i;\nvar emp=new Array();\nemp[0] = \"Ajay\";\nemp[1]\
    \ = \"Abhay\";\nemp[2] = \"Arun\";\nemp[3] = \"Shipra\";\nfor (i=0; i<emp.length;\
    \ i++) {\n  document.write(emp[i] + \"<br>\");\n}\n</script>\n</body>\n</html>\n\
    ```\n\n### Output\nAjay\nAbhay\nArun\n"
