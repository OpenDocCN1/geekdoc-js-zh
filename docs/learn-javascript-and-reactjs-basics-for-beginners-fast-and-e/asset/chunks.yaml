    \ 语句。\n3. `if else if` 语句。\n\n### if 语句\n\n如果条件为真或假，JavaScript 中使用 `if` 语句来运行函数。\n\
    \n```javascript\nif (condition){\n  //要评估的内容\n}\n```\n\n![Image 1.jpg](img/Image00007.jpg)\n\
    \n示例：-\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=50;\nif(x>30){\n\
