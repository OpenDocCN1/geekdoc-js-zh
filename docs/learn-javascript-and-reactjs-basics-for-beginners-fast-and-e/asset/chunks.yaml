  trans: "\n\n```javascript\nconsole.log('ComponentWillUPDATE!');\n\n}\n\ncomponentDidUpdate(prevProps,prevState){\n\
    \n  console.log('ComponentDidUPDATE!')\n\n}\n\ncomponentWillUnmount(){\n\n  console.log('ComponentWillUNMOUNT!')\n\
    }\n\n}\n\nexport default App;\n```\n\n# React 构造函数\n\n## 什么是 constructor？\n\n\
    函数 `Object() { [native code] }` 是用于初始化类对象状态的方法。它在类中的对象被创建时被自动调用。\n\n函数 `Object()\
    \ { [native code] }` 的概念在 React 中也是一样的。React 组件的函数 `Object() { [native code] }`\
    \ 在组件挂载之前被调用。\n\n在编写 React 组件的函数 `Object() { [native code] }` 时，必须在任何其他行之前调用 `super(pros)`\
    \ 函数。如果没有调用 `super(pros)`，在函数 `Object() { [native code] }` 中 `this.props` 将是 `undefined`，这可能会导致错误。\n\
    \n### 语法\n\n```javascript\nconstructor(props){\n  super(props);\n}\n```\n\n构造函数在\
    \ React 中主要有两个用途：\n\n1. 通过将对象赋值给 `this.state`，它用于初始化组件的本地状态。\n2. 它用于绑定组件拥有的事件处理函数。\n\
    \n如果你不需要为 React 组件初始化状态或绑定方法，则没有必要为 React 组件构建 `Object() { [native code] }` 函数。\n\
    \n函数 `Object() { [native code] }` 不能直接调用 `setState()` 函数。如果组件需要本地状态，你必须在函数 `Object()\
    \ { [native code] }` 中使用 `this.state` 分配初始状态。函数 `Object() { [native code] }` 使用\
    \ `this.state` 分初始状态，而所有其他方法都需要使用 `setState()` 方法。\n\n## 示例\n\n下面的示例演示了构造函数的概念：\n\
    \n**App.js**\n```javascript\nimport React, { Component } from 'react';\n\nclass\
    \ App extends Component {\n  constructor(props){\n    super(props);\n    this.state\
    \ = {\n      data: 'Hello World'\n    }\n    this.handleEvent = this.handleEvent.bind(this);\
    \  \n  }\n\n  handleEvent(){\n    console.log(this.props);\n  }\n\n  render()\
    \ {\n    return (\n      <div className=\"App\">  \n        <center>\n       \
    \   <h2>Example of React Constructor</h2>\n          <input type =\"text\" value={this.state.data}/>\n\
    \          <br/><br/>\n          <button onClick={this.handleEvent}>Please Click</button>\
    \ </center>\n      </div>\n    );\n  }\n}  \n\nexport default App;\n```\n\n**Main.js**\n\
    ```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    import App from './App.js';\n\nReactDOM.render(<App />, document.getElementById('app'));\n\
    ```\n\n# 箭头函数\n\n这是 ES6 规范中的一项全新新特性。在使用箭头函数时，不需要将任何事件绑定到 `this`，也没有必要在函数 `Object()\
    \ { [native code] }` 内部绑定 `this`。\n\n### 示例\n\n我们在上一个示例中使用了 `bind()`，但现在我们使用箭头函数，就不需要它了。下面的示例展示了如何使用程序的箭头函数。\n\
    \n```javascript\nimport React,{Component} from'react';\n\nclass App extends Component{\n\
    \  constructor(props){\n    super(props);\n    this.state={\n      data:'HelloWorld'\n\
    \    }\n    this.handleEvent=this.handleEvent.bind(this);\n  }\n\n  handleEvent=()=>{\n\
    \    console.log(this.props);\n  }\n\n  render(){\n    return(\n      <div className=\"\
    App\">\n        <center>\n          <h2>Example of React Constructor</h2>\n  \
    \        <input type=\"text\" value={this.state.data}/>\n          <br/><br/>\n\
    \          <button onClick={this.handleEvent}>Please Click</button></center>\n\
    \      </div>\n    );\n  }\n}\n\nexport default App;\n```\n\n"
