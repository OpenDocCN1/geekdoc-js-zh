    ## ReactJS vs AngularJS


    ### ReactJS 和 AngularJS 之间的区别


    ### AngularJS


    `AngularJS` 是一个开源 JavaScript 框架，可用于创建动态 Web 应用程序。它由 Misko Hovery 和 Adam Abrons
    于 2009 年创建，目前由 Google 维护。2019 年 3 月 11 日，`AngularJS` 更新到了 `1.7.8` 版本。它主要用于创建单页应用，并利用了
    `HTML` 和 JavaScript 属性。使用 `<script>` 标签将其引入到 `HTML` 页面中。它使用表达式将数据绑定到 `HTML`，并通过使用指令添加内置属性来扩展
    `HTML`。


    #### AngularJS 的特性


    以下是 `AngularJS` 的一些特性：


    1. **数据绑定**：`AngularJS` 支持双向数据绑定。模型和显示组件之间的数据同步会自动发生。

    2. **POJO 模型**：`AngularJS` 使用的“纯旧 JavaScript 模型”（Plain Old JavaScript Model）缩写为
    `POJO`。它提供了自发和计划良好的对象。它使得 `AngularJS` 自包含且易于使用。

    3. **MVC 框架（模型视图控制器）**：`MVC` 是一种用于创建 Web 的软件架构范式。`AngularJS` 的功能模型主要基于 `MVC` 概念。`AngularJS`
    中的 `MVC` 具有动态、舒适且多功能的架构。

    4. **服务**：`AngularJS` 带有许多内置服务，例如 `$http`，可用于 `XMLHttpRequest`。

    5. **用于用户界面的 HTML**：`AngularJS` 使用 `HTML` 创建用户界面。`AngularJS` 是一种声明性语言，使用更短、更易理解的标签。它提供了一个整洁、组织良好且结构良好的用户界面。

    6. **依赖注入**：`AngularJS` 具有依赖注入子系统，简化了开发者设计、理解和测试应用程序的过程。

    7. **Google 的活跃社区**：众所周知，Google 维护着 `AngularJS`，因此一旦出现维护问题，有许多论坛可以解答问题。

    8. **路由**：`Routing` 是允许你从一个视图移动到另一个视图的系统。对于单页应用至关重要，因为所有内容都包含在一个页面。开发者不希望每次点击菜单项时都将访问者发送新页面。开发者要求在
    URL 更改时在同一页面加载内容。


