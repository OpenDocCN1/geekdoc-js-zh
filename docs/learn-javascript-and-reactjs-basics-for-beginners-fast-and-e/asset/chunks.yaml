    </html>\n```\n**output**\nValue of x is greater than 30\n\n### if else statement\n\
    \nIf either condition is true or false, the `if else` statement is used.\n\n####\
    \ Syntax\n\n```javascript\nif(condition)\n{\n  //set of statements\n}\nelse\n\
    {\n  //set of statements\n}\n```\n![Image 2.jpg](Image00008.jpg)\n\n#### Example\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=20;\nif(x%2==0){\n\
