  trans: "\n\n`render()` 方法可以渲染 `this.state` 属性。\n\n### 示例\n\n以下示例演示了如何使用 ES6 语法创建一个有状态的组件（Stateful\
    \ component）：\n\n```javascript\nimport React, { Component } from 'react'; \n\n\
    class App extends React.Component { \n  constructor() {\n    super()\n    this.state\
    \ = { displayBio: true }\n  }\n\n  render() {\n    const bio = this.state.displayBio\
    \ ? ( \n      <div>\n        <p><h3>This is tutorialexample website which provides\
    \ you lot of tutorials.</h3></p>\n      </div>\n    ) : null;\n    return (\n\
    \      <div>\n        <h1> Hello World !!!!!!</h1>\n        { bio }\n      </div>\n\
    \    )\n  }\n}\n\nexport default App;\n```\n\n在函数 `Object() { [native code] }`\
    \ 中必须执行 `super()` 方法来设置状态。这是因为在调用 `super()` 方法之前，`this.state` 是未初始化的。\n\n### 修改状态\n\
    \n可以通过调用 `setState()` 并提供一个新的状态对象作为参数来更新组件的状态。现在，在上述示例中，构建一个新方法 `toggleDisplayBio()`\
    \ 并将 `this` 绑定到它；否则，在 `toggleDisplayBio()` 方法内部将无法访问。\n\n```javascript\nthis.toggleDisplayBio=this.toggleDisplayBio.bind(this)\n\
    ```\n\n### 示例\n\n我们将在下面的示例的 `render()` 方法中添加一个按钮。当点击按钮时，会调用 `toggleDisplayBio()`\
    \ 方法并显示指定的输出。\n\n```javascript\nimport React, { Component } from 'react'; \n\n\
    class App extends React.Component {\n  constructor() {\n    super()\n    this.state\
    \ = { displayBio: false }\n    console.log('Component this', this)\n    this.toggleDisplayBio\
    \ = this.toggleDisplayBio.bind(this)\n  }\n\n  toggleDisplayBio() {\n    this.setState({displayBio:\
    \ !this.state.displayBio});\n  }\n\n  render() {\n    return (\n      <div>\n\
    \        <h1>!! Hello World !!</h1>\n        {\n          this.state.displayBio\
    \ ? (\n            <div>\n              <p><h4>This is tutoriaexample website\
    \ that has a lot of tutorials. This website provides you a better source of learning.</h4></p>\n\
    \              <button onClick={this.toggleDisplayBio}> Show Less </button>\n\
    \            </div>\n          ) : (\n            <div>\n              <button\
    \ onClick={this.toggleDisplayBio}> Read More </button>\n            </div>\n \
    \         )\n        }\n      </div>\n    )\n  }\n}\n\nexport default App\n```\n\
    \n### React Props\n\n“properties”（属性）一词缩写为“prop”。由于 props 是不可变的，因此状态（state）和 props\
    \ 在本质上是不同的。Props 是只读的组件属性。它是跟踪标签属性值的对象，工作方式类似于 HTML 元素。它促进了数据从一个组件到另一个组件的传输。Props\
    \ 类似于函数中的参数，因为它们传递给组件的方式与参数传递给函数的方式相同。\n\n组件内部的 props 无法被更改。在组件内部，我们可以添加 props（即属性）。这些属性以\
    \ `this.props` 的形式暴露在组件中，并用于在 `render` 方法中渲染动态数据。\n\n当你在组件中需要不可变数据时，请向 ReactJS\
    \ 项目的 `main.js` 文件中添加 `reactDom.render()` 方法，并在需要的组件中使用该文件。\n\n例如：\n\n**App.js**\n\
    ```javascript\nimport React, { Component } from 'react';\nclass App extends React.Component\
    \ {\n  render() {\n    return (\n      <div>\n        <h1> Hello { this.props.name\
    \ } </h1>\n        <p> <h4> This is tutorialexample website which provides you\
    \ lot of tutorials </h4></p>\n      </div>\n    );\n  }\n}\n\nexport default App;\n\
    ```\n\n**Main.js**\n```javascript\nimport React from 'react';\nimport ReactDOM\
    \ from 'react-dom';\nimport App from './App.js';\nReactDOM.render(<App name =\
    \ \"World\" />, document.getElementById('app'));\n```\n\n### 默认 Props\n\n并不要求在任何时候在\
    \ `reactDom.render()` 元素中包含 props。默认 props（Default props）也可以直接设置在组件函数 `Object()\
    \ { [native code] }` 上。在下面的示例中对其进行了详细解释：\n\n### 示例\n\n```javascript\nimport React,\
    \ { Component } from 'react';\nclass App extends React.Component {\n  render()\
    \ {\n    return (\n      <div>\n        <h1>Hello World</h1>\n        <h2> Default\
    \ Pros Example </h2>\n        <h3>Welcome to {this.props.name}</h3>\n        <p>tutorialexample\
    \ provides you one of the best tutorials.</p>\n      </div>\n    );\n  }\n}\n\n\
    App.defaultProps = {\n  name: \"tutorialexample\"\n}\nexport default App;\n```\n\
    \n**Main.js**\n```javascript\nimport React from 'react';\nimport ReactDOM from\
    \ 'react-dom';\nimport App from './App.js';\nReactDOM.render(<App/>, document.getElementById('app'));\n\
    ```\n\n### 状态与属性 (State and Props)\n\n在应用中，状态和 props 都可以合并。Props 可以用于设置父组件中的状态，然后将其提供给子组件。\n\
    \n例如：\n\n**App.js**\n```javascript\nimport React, { Component } from 'react';\n\
    class App extends React.Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = {\n      name: \"tutorialexample\",\n    }\n  }\n\n  render()\
    \ {  \n    return (\n      <div>\n        <Tutorial tutorialProp = {this.state.name}/>\n\
    \      </div>\n    );\n  }\n}  \n\nclass Tutorial extends React.Component {\n\
    \  render() {\n    return (\n      <div>\n        <h1>State and Props</h1>\n \
    \       <h2>tutorialProp</h2>\n        <p>tutorialexample provides you one of\
    \ the best tutorials.</p>\n      </div>\n    )\n  }\n}\n\nexport default App\n\
    ```\n\n"
- fmt: "\nIt's a really high-level API. It gives the application's code reusability\
    \ while also making it absolutely unique. It can be used in a variety of ways\
    \ to:\n\n* Creating Elements.\n* Transforming Elements.\n* Fragments.\n\nWe'll\
    \ now go over the three most significant methods accessible in the React component\
    \ API:\n\n* `findDOMNode()`\n* `setState()`\n* `forceUpdate()`\n\n## findDOMNode()\n\
    \nYou must use `ReactDOM` to manipulate the DOM. The method `findDOMNode()` is\
    \ used to locate DOM nodes. This approach assists us in locating or gaining access\
    \ to the underlying DOM node.\n\n### Syntax:\n\n`ReactDOM.findDOMNode(component)`\n\
    \n### Example:\n\n```javascript\nApp.js\nimport React, { Component } from 'react';\n\
    import ReactDOM from 'react-dom';\n\nclass App extends React.Component {\n  constructor()\
    \ {\n    super()\n    this.findDomNodeHandler1 = this.findDomNodeHandler1.bind(this);\n\
    \    this.findDomNodeHandler2 = this.findDomNodeHandler2.bind(this);\n  };\n\n\
    \  findDomNodeHandler1() {\n    var div1 = document.getElementById('One');\n \
    \   ReactDOM.findDOMNode(div1).style.color = 'red';\n  }\n\n  findDomNodeHandler2()\
    \ {\n    var div2 = document.getElementById('Two');\n    ReactDOM.findDOMNode(div2).style.color\
    \ = 'blue';\n  }\n\n  render() {\n    return (\n      <div>\n        <center>\n\
    \          <h1>ReactJS Find DOM Node Example</h1>\n          <button onClick =\
    \ {this.findDomNodeHandler1}>Button1</button>\n          <button onClick = {this.findDomNodeHandler2}>Button2</button>\n\
    \          <h3 id = \"One\">Red Color</h3>\n          <h3 id = \"Two\">Blue Color</h3>\n\
    \        </center>\n      </div>\n    )\n  }\n}\nexport default App;\n```\n\n\
    ## setState()\n\nThis method is used to update the component's state. Rather than\
    \ altering the state instantaneously, it just modifies the existing state. It's\
    \ the main technique for modifying the user interface (UI) in response to event\
    \ handlers and server responses.\n\n### Syntax:\n\n`this.stateState(object newState[,\
    \ function callback])`\n\n### Example:\n\n```javascript\nApp.js\nimport React,\
    \ { Component } from 'react';\nimport PropTypes from 'prop-types';\nclass App\
    \ extends React.Component {\n  constructor() {\n    super();\n    this.state =\
    \ {\n      data: \"!!!! Hello World !!!!\"\n    }\n    this.updateSetState = this.updateSetState.bind(this);\n\
    \  }\n\n  updateSetState() {\n    this.setState({\n      data:\"Welcome to tutorialexample\"\
    \n    });\n  }\n\n  render() {\n    return (\n      <div>\n        <center>\n\
    \          <h1>{this.state.data}</h1> <button onClick = {this.updateSetState}>SET\
    \ STATE</button>\n        </center>\n      </div>\n    )\n  }\n}  \nexport default\
    \ App\n```\n\n```javascript\nMain.js\nimport React from 'react';\nimport ReactDOM\
    \ from 'react-dom';\nimport App from './App.js';\nReactDOM.render(<App/>, document.getElementById('app'));\n\
    ```\n\n## forceUpdate()\n\nThis method allows the manually updating of the components.\n\
    \n### Syntax:\n\n`Component.forceUpdate(callback)`\n\n### Example:\n\n```javascript\n\
    App.js\nimport React, { Component } from 'react';\nclass App extends React.Component\
    \ {\n  constructor() {\n    super()\n    this.forceUpdateState = this.forceUpdateState.bind(this);\n\
    \  }\n\n  forceUpdateState() {\n    this.forceUpdate();\n  };\n\n  render() {\n\
    \    return (\n      <div>\n        <center>\n          <h1>Example of Force Update\
    \ method</h1>\n          <h2>Example to Generate Random Number</h2>\n        \
    \  <h3>Random number: {Math.random()}</h3>\n          <button onClick = {this.forceUpdateState}>ForceUpdate</button>\n\
    \        </center>\n      </div>\n    );\n  }\n}\nexport default App;\n```\n\n\
    ## React Component Life-Cycle\n\nEach component's construction process in ReactJS\
    \ has multiple lifecycle functions. These methods are referred to as the component's\
    \ lifespan. The component's life cycle is divided into four phases:\n\n* Initial\
    \ Phase\n* Mounting Phase\n* Updating Phase\n* Unmounting Phase\n\nEvery stage\
    \ of the lifecycle has its own set of methods. Let's go over each of these stages\
    \ one by one:\n\n### Initial Phase\n\nThe birth step of a ReactJS component's\
    \ lifecycle is referred to as this. The component's initial state and default\
    \ props are included in this phase. These default properties are set in the function\
    \ `Object() { [native code] }` of the component. This is a one-time step that\
    \ involves the following methods:\n\n* `getDefaultProps()`: It's where you set\
    \ the default value for `this.props`. It is called before the component is created.\n\
    * `getInitialState()`: `this.state`'s default value is specified with `this.state.default`.\n\
    \n### Mounting Phase\n\nIn this phase, an instance of a component is created and\
    \ added into the DOM. It entails the following procedures:\n\n* `componentWillMount()`:\
    \ It is called just before a component is rendered into the DOM. If you call `setState()`\
    \ within this method, the component will not be re-rendered.\n* `componentDidMount()`:\
    \ It is called immediately after a component has been rendered and placed on the\
    \ DOM. You can now query the DOM in any way you want.\n* `render()`: Every component\
    \ has a definition for it. It's in charge of returning only one root HTML node\
    \ element. You can produce a null or false value.\n\n### Updating Phase\n\nIt's\
    \ the next step in the lifecycle. This phase, unlike the Birth or Death phases,\
    \ repeats over and over. It entails the following procedures:\n\n* `componentWillReceiveProps()`:\
    \ When a component receives new props, this method is called. You must expect\
    \ the state to change.\n* `shouldComponentUpdate()`: It is called anytime a component\
    \ decides to make change. If this function returns true, the component will be\
    \ updated.\n* `componentWillUpdate()`: It is called right before a component update\
    \ occurs. By invoking this, you are able to change the state.\n* `render()`: `this.props`\
    \ and `this.state` are examined, and types such as React Elements, Arrays, Fragments,\
    \ Booleans or null, String, and Number are returned. The function ensures that\
    \ the component shows correctly.\n* `componentDidUpdate()`: It is called immediately\
    \ after the component has been updated. This function allows you to put whatever\
    \ code inside it to run when an update occurs.\n\n### Unmounting Phase\n\nThe\
    \ lifespan of a React component comes to an end with this phase. When the component's\
    \ instance is killed and unmounted from the DOM, this function is called. Only\
    \ one method is included in this phase, which is listed below:\n\n* `componentWillUnmount()`:\
    \ Before a component is permanently deleted and unmounted, this procedure is called.\
    \ It executes any cleanup actions that are required, such as invalidating timers,\
    \ event listeners, cancelling network requests, and clearing up DOM elements.\
    \ It will not be possible to remount the component instance once it has been unmounted.\n\
    \n### Example\n\n```javascript\nimport React,{Component} from 'react';\nclass\
    \ App extends React.Component {\n  constructor(props) {\n    super(props);\n \
    \   this.state={world:\"World\"};\n    this.changeState=this.changeState.bind(this)\n\
    \  }\n\n  render(){\n    return(\n      <center>\n        <div>\n          <h1>Example\
    \ of ReactJS components lifecycle</h1>\n          <h3>Hello{this.state.world}</h3>\n\
    \          <button onClick={this.changeState}>ClickHere!</button>\n        </div>\n\
    \      </center>\n    );\n  }\n\n  componentWillMount(){\n    console.log('ComponentWillMOUNT!')\n\
    \  }\n\n  componentDidMount(){\n    console.log('ComponentDidMOUNT!')\n  }\n\n\
    \  changeState(){\n    this.setState({world:\"All!!-ItsanexampleofReactJScomponentlifecycle.\"\
    });\n  }\n\n  componentWillReceiveProps(newProps){\n    console.log('ComponentWillRecieveProps!')\n\
    \  }\n\n  shouldComponentUpdate(newProps,newState){\n    return true;\n  }\n\n\
    \  componentWillUpdate(nextProps,nextState){\n  }\n}\n```\n"
