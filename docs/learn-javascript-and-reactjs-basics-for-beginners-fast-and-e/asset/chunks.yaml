    else if (condition3)\n{\n  Statement(s)to be executed if condition3 is true\n\
    }\nelse\n{\n  Statement(s)to be executed if no condition is true\n}\n```\n\n####\
    \ Example\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=50;\nif\
    \ (x==10){\n  document.write(\"x is equal to 10\");\n}\nelse if(x==50){\n  document.write(\"\
    x is equal to 50\");\n}\nelse if(x==30){\n  document.write(\"x is equal to 30\"\
    );\n}\nelse{\n  document.write(\"a is not equal to 10, 50 or 30\");\n}\n</script>\n\
    </body>\n</html>\n```\n**Output**\nx is equal to 50\n\n## Javascript Switch Statement\n\
    \nIn JavaScript, the `switch` statement is used to execute a single code under\
    \ several conditions. It's the same as the `else if` statement, but it's easier\
    \ to remember than the `if..else..if` statement.\n\n![Image 3.jpg](Image0009.jpg)\n\
    \n#### Syntax\n\n```javascript\nswitch (expression)\n{\n  case 1: statement(s)\n\
    \  break;\n  case 2: statement(s)\n  break;\n  ..\n  case n: statement(s)\n  break;\n\
    \  default:statements(s)\n}\n```\n**NOTE**: In `switch-case` statements, the `break`\
    \ statement is very important.\n\n#### Example\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<script>\nvar grade='B';\nvar result;\nswitch(grade){\n  case 'A':\n \
