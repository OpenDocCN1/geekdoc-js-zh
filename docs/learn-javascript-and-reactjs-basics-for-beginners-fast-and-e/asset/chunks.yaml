    It''s the object that keeps track of a tag''s attribute value, and it works similarly
    to HTML elements. It facilitates the transfer of data from one component to another.
    Props are comparable to function arguments in that they are supplied to the component
    in the same way that function arguments are passed to the function.


    The props inside the component can''t be changed. Within the components, we may
