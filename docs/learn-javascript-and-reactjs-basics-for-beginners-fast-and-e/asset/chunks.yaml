  trans: "\n\n### 3. `src`: 此文件夹包含多个文件，包括 `App.css`、`App.js`、`App.test.js`、`index.css`、`index.js`\
    \ 和 `serviceWorker.js`。`App.js` 文件始终负责显示 React 输出屏幕。\n\n### 4. `package-lock.json`:\
    \ 每当 `npm` 包更改 `package.json` 或 `node modules` 树时，它就会自动生成。它无法被发布。如果发现位置不在顶层包，它将会被忽略。\n\
    \n### 5. `package.json`: 它包含了项目元数据信息。它向 `npm` 提供信息，用于识别项目的依赖关系以及项目本身。\n\n### 6.\
    \ `README.md`: 它还包含了 React 主题的文档。\n\n# React JSX\n\n正如我们所知，所有的 React 组件都有一个 `render`\
    \ 函数。React 组件的 HTML 输出由 `render` 函数指定。\n\nJavaScript 扩展 `JSX` 允许你编写看起来像 HTML 一样的\
    \ JavaScript 代码。`JSX` 是一种 React 特有的类 HTML 语法，它扩展了 `ECMAScript`，允许 HTML 类语法与 JavaScript/React\
    \ 编程并存。\n\n预处理器（如 `Babel` 等转换器）使用这种语法将 HTML 类语法转换为 JavaScript 引擎可以理解的标准 JavaScript\
    \ 对象。\n\n它允许你将 HTML/XML 类结构（例如 DOM 类树结构）放在与 JavaScript 代码相同的文件中，然后由预处理器将这些表达式转换为实际的\
    \ JavaScript 代码。像 XML/HTML 标签一样，`JSX` 标签具有名称、属性和元素。\n\n## 为什么使用 JSX？\n\n- 它比 JavaScript\
    \ 快，因为它在翻译成 JavaScript 之前对代码进行了优化。\n- React 没有通过将 HTML 和逻辑放在不同的文件中来分离技术，而是使用包含两者的组件。\n\
    - 它是类型安全的，因为大多数问题在编译期间就会被发现。\n- 它简化了创建模板的过程。\n\n## JSX 中的嵌套元素\n\n如果你想使用多个元素，必须将它们封装在一个容器元素中。这里使用\
    \ `div` 作为三个嵌套项目的容器元素。\n\n### App.JSX\n\n```javascript\nimport React, { Component\
    \ } from 'react';\n\nclass App extends Component{\n  render(){\n    return(\n\
    \      <div>\n        <h1>Hello World !!</h1>\n        <h2>This is TutorialandExample</h2>\n\
    \        <p>Website with the best tutorials.</p>\n      </div>\n    )\n  }\n}\n\
    \nexport default App;\n```\n\n## JSX 属性\n\n`JSX` 中 HTML 元素的特性与普通 HTML 中的特性相同。在\
    \ `JSX` 中，属性名使用驼峰命名法（camelcase），而不是 HTML 的传统命名模式，例如 HTML 中的 `class` 在 `JSX` 中变为\
    \ `className`。这是因为在 JavaScript 中，`class` 关键字是一个保留关键字。在 `JSX` 中也可以使用自定义属性。对于自定义属性，我们必须使用\
    \ `data-prefix`。\n\n自定义属性 `data-customAttr` 用作下面示例中 `<p>` 标签的属性。\n\n例如：\n\n```javascript\n\
    import React, { Component } from 'react';\n\nclass App extends Component{\n  render(){\n\
    \    return(\n      <div>\n        <h1>Hello World !!</h1>\n        <h2>This is\
    \ TutorialandExample</h2>\n        <p data-customAttr = \"hello\">Website with\
    \ the best tutorials.</p>  \n      </div>\n    );\n  }\n}\n\nexport default App;\n\
    ```\n\n## JavaScript 表达式\n\nJavaScript 表达式可以用于 `JSX` 内部。我们需要用大括号 `{}` 将其包裹起来。下一个示例更清晰地演示了这一点。\n\
    \n示例：\n\n```javascript\nimport React, { Component } from 'react';\n\nclass App\
    \ extends Component{\n  render(){\n    return(\n      <div>\n        <h1>{12+28}</h1>\n\
    \        <h1>Hello World !!</h1>\n        <h2>This is TutorialandExample</h2>\n\
    \        <p data-customAttr = {\"hello\"}>Website with the best tutorials.</p>\n\
    \      </div>\n    );\n  }\n}\n```\n\n我们不能在 `JSX` 中使用 `if else` 语句；相反，我们必须使用条件（三元）表达式。在下面的示例中，变量\
    \ `x` 的值为 `1`，因此浏览器返回 true；但如果我们此此值改为其他，浏览器将返回 false。\n\n例如：\n\n```javascript\n\
    import React, { Component } from 'react';\n\nclass App extends Component{\n  render(){\n\
    \    var x=1;\n    return(\n      <div>\n        <h1>{x == 1 ? 'True!' : 'False'}</h1>\n\
    \        <h2>This is TutorialandExample</h2>\n        <p data-customAttr = {\"\
    hello\"}>Website with the best tutorials.</p>\n      </div>\n    );\n  }\n} \n\
    ```\n\n## JSX 样式\n\nReact 推荐使用内联样式。设置内联样式需要使用驼峰命名法。对于特定项目，React 会自动在数值值后附加 `px`。`JSX`\
    \ 中的样式在下面的示例中演示：\n\n例如：\n\n```javascript\nimport React, { Component } from 'react';\n\
    \nclass App extends Component{\n  render(){\n    var newStyle = {\n      fontSize:\
    \ 90,\n      fontFamily: 'Times New Roman',\n      color: '#789067'\n    }\n \
    \   return(  \n      <div>\n        <h1 style = {newStyle}>www.google.com</h1>\n\
    \        <h2>This is TutorialandExample</h2>\n        <p data-customAttr = {\"\
    hello\"}>Website with the best tutorials.</p>\n      </div>\n    );\n  }\n}\n\n\
    export default App;\n```\n\n## JSX 注释\n\n在组合时必须使用大括号。在 `JSX` 中，注释以 `/*` 开始并以 `*/`\
    \ 结束。\n\n例如：\n\n```javascript\nimport React, { Component } from 'react';\n\nclass\
    \ App extends Component{\n  render(){\n    return(\n      <div>\n        {/* this\
    \ is a comment */}\n        <h1>Hello World</h1>\n      </div>\n    );\n  }\n\
    }\n```\n\n"
- fmt: "\nA class that extends the component and has a `render` function can be defined\
    \ to build the `Class`.\n\nThe following is an example of a class component:\n\
    \n## Example\n\nIn this example, we'll create a list of unordered components in\
    \ which we'll dynamically append `Name` for each object in the data array. `EcmaScript6`\
    \ arrow syntax (`=>`) is used here, which is significantly cleaner than the old\
    \ JavaScript syntax. It aids us in writing less lines of code for our elements.\
    \ It comes in handy when we need to create a large number of item lists.\n\n```javascript\n\
    import React, { Component } from 'react';\n\nclass App extends React.Component\
    \ {\n  constructor() {\n    super();\n    this.state = {\n      data: [\n    \
    \    {\n          \"name\":\"Arun\"\n        },\n        {\n          \"name\"\
    :\"Anup\"\n        },\n        {\n          \"name\":\"Anil\"\n        }\n   \
    \   ]\n    }\n  }\n  render() {\n    return (\n      <div>\n        <Name/>\n\
    \        <ul>\n          {this.state.data.map((item) => <List data = {item} />)}\n\
    \        </ul>\n      </div>\n    );\n  }\n}\n\nclass Name extends React.Component\
    \ {\n  render() {\n    return (\n      <div>\n        <h1>Student Names</h1>\n\
    \      </div>\n    );\n  }\n}\n\nclass List extends React.Component {\n  render()\
    \ {\n    return (\n      <ul>\n        <li>{this.props.data.name}</li>\n     \
    \ </ul>\n    );\n  }\n}\n\nexport default App;\n```\n\n## Pros and Cons of ReactJS\n\
    \nThe following are some benefits and drawbacks of `ReactJS`:\n\n### Benefits\
    \ of ReactJS\n\n1. **Easy to Learn and Use**: `ReactJS` is a simple to use and\
    \ learn framework. It comes with lot of documentation, training materials, and\
    \ tutorials. It is simple to comprehend for a developer with JavaScript experience\
    \ who can immediately begin developing applications in days. It is one of the\
    \ JavaScript frameworks and is the `view` portion in `MVC` (Model-View-Controller)\
    \ model. We can't say `ReactJS` is feature-rich, but it does have the benefit\
    \ of an open-source user interface (`UI`) library, which aids in task execution.\n\
    2. **Creating Dynamic applications becomes easier**: Creating dynamic web apps\
    \ using HTML was difficult due to complicated coding necessary, but `ReactJS`\
    \ has overcome this problem and made it simple. It needs less coding and offers\
    \ more features. It makes use of `JSX` extension, which is a syntax that allows\
    \ HTML tag syntax to render certain components. Machine-readable codes are also\
    \ supported.\n3. **Reusable Components**: The `ReactJS` web application is made\
    \ up of several components, each with its own logic and controls. These are in\
    \ charge of producing short, reusable HTML code that can be reused. This reusable\
    \ code makes it easier to design and maintain applications. `ReactJS` uses virtual\
    \ DOM-based technique to fill the HTML with data. Because it simply alters particular\
    \ `DOM` rather than reloading it every time, the virtual DOM is quick.\n4. **Performance\
    \ Enhancement**: Because of `Virtual DOM`, `ReactJS` speed has increased. `ReactJS`\
    \ is extremely fast. `ReactJS` becomes significantly better than other frameworks\
    \ as a result of this functionality. There is a concept of managing virtual DOM\
    \ behind this rationale. The Document Object Model (`DOM`) is a cross-platform\
    \ programming API for `HTML`, `XML`, and `XHTML`. The `DOM` is exclusively contained\
    \ within memory. As result, anytime we build a component, we don't write it to\
    \ the `DOM` directly; instead we write virtual components that transform into\
    \ the `DOM`, resulting in smoother and faster performance.\n5. **Handy Tools Support**:\
    \ `ReactJS` is also popular due to the availability of a useful collection of\
    \ tools. These technologies improve readability and make the developer's job easier.\
    \ These tools are Chrome and Firefox dev extensions that allow you to investigate\
    \ react components in the virtual DOM.\n6. **SEO friendly**: When it comes to\
    \ SEO, there is a problem with standard frameworks. Search engines have a hard\
    \ time reading massive JavaScript apps in general. `ReactJS` solves this problem,\
    \ making it easier for developers to navigate across search engines. React apps\
    \ may run on the server with virtual DOM rendering and returning a standard page\
    \ to the browser.\n7. **Benefit of having JavaScript library**: `ReactJS` provides\
    \ a rich range of JavaScript libraries, which is why it is so popular among web\
    \ developers. The JavaScript library gives web developers more freedom freedom.\n\
    8. **Scope for Code Testing**: `ReactJS` applications are simple to start up.\
    \ It gives developers with the ability to swiftly test and debug their programmes\
    \ using native tools.\n\n### Disadvantages of ReactJS\n\n1. **High Pace development**:\
    \ It serves as both a benefit and a detriment. It's a disadvantage since the environment\
    \ changes so quickly that most developers don't want to have relearn new ways\
    \ of doing things on a frequent basis. It might be difficult to keep up with all\
    \ of these changes and constant updates. They have to keep their abilities up\
    \ to date and learn new ways of doing things.\n2. **Poor Documentation**: Another\
    \ common drawback of continuously changing technologies is this. Due to rapid\
    \ updating of react technologies, there is a lack of good documentation.\n3. **View\
    \ Part**: Only the app's UI layers are handled by `ReactJS`. As result, other\
    \ technologies must be chosen to provide a complete set of tooling for the project's\
    \ development.\n4. **JSX as a barrier**: `ReactJS` makes use of `JSX`, a syntax\
    \ extension that allows HTML and JavaScript to be mixed together. This strategy\
    \ is advantageous, but some members of the development community, particularly\
    \ new developers, regard `JSX` as a barrier. Developers disagree about how difficult\
    \ `JSX` is to learn.\n\n## Features of ReactJS\n\n`ReactJS` is currently gaining\
    \ popularity among developers as the greatest JavaScript framework. It's critical\
    \ to the front-end ecosystem's success. The following are some of the most important\
    \ aspects of `ReactJS`:\n\n* `JSX`\n* `Components`\n* One-way data binding\n*\
    \ `Virtual DOM`\n* Simplicity\n* Performance\n\n### Let’s elaborate on these features:\n\
    \n### JSX\nJavaScript XML is abbreviated as `JSX`. It's a JavaScript syntax that's\
    \ been extended. It has a syntax that is comparable to that of `XML` or `HTML`.\
    \ This syntax is converted into `React` Framework JavaScript Calls. It improves\
    \ `ES6` to allow HTML-like text to coexist with JavaScript react code. It is not\
    \ required to use `JSX` in `ReactJS`, however it is recommended.\n\n### One-Way\
    \ Data Binding\n`ReactJS` is built to follow the unidirectional data flow, often\
    \ known as one-way Data Binding. One-way data binding is beneficial since it allows\
    \ for more control across the application. When data flows in the opposite direction,\
    \ additional characteristics are necessary. It occurs because the components are\
    \ assumed to be immutable, and the data contained within them is unchangeable.\
    \ `Flux` is a pattern that aids in data unidirectionality. It gives the application\
    \ additional flexibility, which leads to increased efficiency.\n\n### Virtual\
    \ DOM\nThe `virtual DOM` is simply a replica of the real `DOM`. It's similar to\
    \ one-way data binding. Every time the web application is modified, the entire\
    \ UI is re-rendered in virtual DOM representation. The discrepancy between the\
    \ new `DOM` (which is re-rendered) and the prior `DOM`'s representation is then\
    \ examined. When it's done, real `DOM` modifies the items that have changed. It\
