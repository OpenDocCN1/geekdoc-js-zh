  trans: "\n\n# 学习 JavaScript 和 ReactJS 基础：初学者教程\n## 快速易用学习编程基础\nJP TAM\n\n![](img/Image00032.jpg)\n\
    \n## JavaScript 教程\n本 JavaScript 课程让初学者和专家都能轻松学习 JavaScript。\n\n### 什么是 JavaScript\
    \ 以及如何工作？\nJavaScript 是一种用于计算机的动态编程语言。它是一种轻量级的、基于对象的脚本语言。通过 JavaScript，我们可以让网站变得更有活力和吸引力。\n\
    \nBrendan Eich 作为 Netscape 的员工于 1995 年设计了它。它是一种用于创建交互式网站的编程语言。它常用于：\n- 客户端验证。\n\
    - 动态的下拉菜单。\n- 显示当前日期和时间。\n- 在将数据传输到服务器之前，验证 HTML 表单中的用户输入。\n- 创建无需连接服务器即可响应用户输入的表单。\n\
    - 安装和关闭新窗口或帧。\n- 使用弹出窗口和对话框显示信息（例如：警告对话框、确认对话框或提示对话框）。\n- 创建小型但完整的客户端程序。\n- 闹钟和其他计时器。\n\
    - 移动设备的游戏和应用开发。\n\n### JavaScript 的特性\n- JavaScript 是一种基于对象的脚本语言。\n- 该语言对大小写敏感。\n\
    - 它非常轻量。\n- 在 JavaScript 中，每个语句后面必须紧跟一个分号（`;`）。\n\n### JavaScript 的优势\n- JavaScript\
    \ 是一种解释型脚本语言。不需要编译器，因为没有编译过程。JavaScript 由浏览器作为 HTML 标签进行解释。\n- JavaScript 是一种简单的编程语言。对任何人来说都非常容易学习。它被用于创建动态且吸引人的网站。\n\
    - 因为 JavaScript 在客户端运行，所以它降低了网站服务器的负载。\n- 它包含了条件检查、循环和分支功能，可以使用在网页中。\n- 对于终端用户来说，JavaScript\
    \ 是相对快速。他们不需要等待页面加载即可查看是否漏掉了某些内容。\n- 网页现在拥有更多功能。为了给网站提供更多功能，我们可以使用 JavaScript\
    \ 引入拖放组件。\n\n### JavaScript 示例\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>Welcome\
    \ to JavaScript</h2>\n<script>\n  document.write(\"Hello JavaScript by Example\"\
    );\n</script>\n</body>\n</html>\n```\n**输出：** Welcome to JavaScript Hello JavaScript\
    \ by Example\n\n### 示例\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>Welcome\
    \ to JavaScript</h2>\n<script>\n  document.write(\"Hello Friends\");\n</script>\n\
    </body>\n</html>\n```\n**输出：** Welcome to JavaScript Hello Friends\n\n### JavaScript\
    \ 可以通过在代码中包含 JavaScript 语句来引入\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\n  document.write(\"Hello World\");\n</script>\n</body>\n\
    </html>\n```\n**输出：** Hello World\n\n在 JavaScript 中，代码可以写三个地方：\n1. 在 HTML 的 `<body>...</body>`\
    \ 标签之间。\n2. 在 HTML 的 `<head>...</head>` 标签之间。\n3. 在 `.js` 文件中（外部 JavaScript）。\n\
    \n### 演示（body 标签之间的代码）\n在下例示例中，`<body>` 标签包含了 JavaScript 代码。\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script type=\"text/javascript\">\n  alert(\"world\"\
    );\n</script>\n</body>\n</html>\n```\n\n### 示例 2（在 head 标签之间，代码）\n我们将在下面的示例中创建函数\
    \ `msg()`。在 JavaScript 中，你必须编写函数名来定义一个函数。要调用函数，我们必须先创建一个事件。在这种情况下，我们正在使用 `onclick`\
    \ 事件来调用 `msg()` 函数。\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script type=\"\
    text/javascript\">\n  function msg() {\n    alert(\"world\");\n  }\n</script>\n\
    </head>\n<body>\n  <p>Welcome to Javascript</p>\n  <form>\n    <input type=\"\
    button\" value=\"click\" onclick=\"msg()\"/>\n  </form>\n</body>\n</html>\n```\n\
    \n### 外部 JavaScript 文件\n我们可以创建一个 JavaScript 文件并将其引入到 HTML 文件中。由于单个 JavaScript\
    \ 文件可以在多个 HTML 页面中使用，因此它允许代码的复用。它改进了网页的性能。文件必须具有 `.js` 扩展名。\n**示例：**\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<script type=\"text/javascript\" src=\"message.js\"\
    ></script>\n</head>\n<body>\n  <p>Hello world</p>\n  <form>\n    <input type=\"\
    button\" value=\"click\" onclick=\"msg()\"/>\n  </form>\n</body>\n</html>\n```\n\
    \n### JavaScript 注释\nJavaScript 中的注释用于描述代码。它用于包含代码相关的信息，例如警告或建议，以便终端用户可以理解它。\n\
    \n#### 注释类型\n1. 单行注释\n2. 多行注释\n\n#### 单行注释\n双正斜杠（`//`）用于表示单行注释。在程序运行时，双正斜杠（`//`）与行尾之间的任何文本都会被忽略。\n\
    \n**示例：在语句之前的注释。**\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n// 单行注释\
    \ //\n  document.write(\"hello world\");\n</script>\n</body>\n</html>\n```\n\n\
    **示例：在语句后的注释。**\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n  var a=10;\n\
    \  var b=20;\n  var c=a+b; // 它相加变量 a 和 b 的值\n  document.write(c); // 打印 10 和\
    \ 20 的和\n</script>\n</body>\n</html>\n```\n**输出：** 30\n\n#### 多行注释\n单行和多行注释都可以通过多行注释来实现。跨多行的注释以\
    \ `/*` 开始，以 `*/` 结束。JavaScript 将忽略其中的文本。\n\n```javascript\n/* 在此处编写注释 */\n```\n\
    **示例：**\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n  /* 这是多行注释。\n  \
    \   它不会被显示 */\n  document.write (\"Example of JavaScript multi line comment\"\
    );\n</script>\n</body>\n</html>\n```\n\n### JavaScript 变量\n值（`name=\"Ram\"`）和表达式（`Sum=x+y`）存储在变量中。在使用变量之前我们必须先声明它。声明变量时，我们如下使用\
    \ `var` 关键字：\n```javascript\nvar name;\n```\n变量有 2 种类型：\n1. 局部变量\n2. 全局变量\n\n\
    **局部变量** – 它在函数或块内部声明。\n\n"
- fmt: "\n```html\n<script>\n  function abc(){\n  var x=10; //local variable\n  }\n\
    </script>\n```\n\n## Global Variable\n\nIt has a global scope, meaning that it\
    \ can be defined anywhere in JavaScript code.\n\nOutside of the function, a variable\
    \ is declared.\n\n### Example\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    var data =200; //global variable\nfunction a(){\n  document.writeln(data);\n}\n\
    function b(){\n  document.writeln(data);\n}\na();//calling javascript function\n\
    b();\n</script>\n</body>\n</html>\n```\n\n## In JavaScript, declaring a global\
    \ variable within a function\n\nTo declare a JavaScript global variable inside\
    \ a function, we must use the `window` object.\n\n### Example\n\n`window.value=90;`\n\
    \nIt can now be declared within any function and accessed from within any function.\n\
    \n### Example\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction\
    \ a(){\n  window.value=50;//declare global variable by use of window object\n\
    }\nfunction b(){\n  alert(window.value);//access global variable from other function\n\
    }\na();\nb();\n</script>\n</body>\n</html>\n```\n\n## Javascript Data Types\n\n\
    It has a variety of data types to hold various types of values.\n\nIn Javascript,\
    \ there are two sorts of data types.\n\n1. Primitive data types.\n2. Non-primitive\
    \ data types.\n\nBecause JavaScript is a dynamic type language, we don't need\
