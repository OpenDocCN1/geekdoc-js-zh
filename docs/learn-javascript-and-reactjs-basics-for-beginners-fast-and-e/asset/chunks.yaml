  trans: "\n这是一个非常高级的 API。它在赋予应用代码复用性的同时，使其具有绝对的唯一性。它可以通过多种方式使用：\n\n*   创建元素。\n* \
    \  转换元素。\n*   片段（Fragments）。\n\n现在我们来介绍 React 组件 API 中可用的三个最重要的方法：\n\n* `findDOMNode()`\n\
    * `setState()`\n* `forceUpdate()`\n\n## findDOMNode()\n\n你必须使用 `ReactDOM` 来操作\
    \ DOM。`findDOMNode()` 方法用于定位 DOM 节点。这种方法帮助我们定位或访问底层的 DOM 节点。\n\n### 语法：\n\n`ReactDOM.findDOMNode(component)`\n\
    \n### 示例：\n\n```javascript\nApp.js\nimport React, { Component } from 'react';\n\
    import ReactDOM from 'react-dom';\n\nclass App extends React.Component {\n  constructor()\
    \ {\n    super()\n    this.findDomNodeHandler1 = this.findDomNodeHandler1.bind(this);\n\
    \    this.findDomNodeHandler2 = this.findDomNodeHandler2.bind(this);\n  };\n\n\
    \  findDomNodeHandler1() {\n    var div1 = document.getElementById('One');\n \
    \   ReactDOM.findDOMNode(div1).style.color = 'red';\n  }\n\n  findDomNodeHandler2()\
    \ {\n    var div2 = document.getElementById('Two');\n    ReactDOM.findDOMNode(div2).style.color\
    \ = 'blue';\n  }\n\n  render() {\n    return (\n      <div>\n        <center>\n\
    \          <h1>ReactJS Find DOM Node Example</h1>\n          <button onClick =\
    \ {this.findDomNodeHandler1}>Button1</button>\n          <button onClick = {this.findDomNodeHandler2}>Button2</button>\n\
    \          <h3 id = \"One\">Red Color</h3>\n          <h3 id = \"Two\">Blue Color</h3>\n\
    \        </center>\n      </div>\n    )\n  }\n}\nexport default App;\n```\n\n\
    ## setState()\n\n该方法用于更新组件的状态。它不是即时更改状态，而是修改现有状态。它是响应事件处理程序和服务器响应修改用户界面（UI）的主要技术。\n\
    \n### 语法：\n\n`this.setState(object newState[, function callback])`\n\n### 示例：\n\
    \n```javascript\nApp.js\nimport React, { Component } from 'react';\nimport PropTypes\
    \ from 'prop-types';\nclass App extends React.Component {\n  constructor() {\n\
    \    super();\n    this.state = {\n      data: \"!!!! Hello World !!!!\"\n   \
    \ }\n    this.updateSetState = this.updateSetState.bind(this);\n  }\n\n  updateSetState()\
    \ {\n    this.setState({\n      data:\"Welcome to tutorialexample\"\n    });\n\
    \  }\n\n  render() {\n    return (\n      <div>\n        <center>\n          <h1>{this.state.data}</h1>\
    \ <button onClick = {this.updateSetState}>SET STATE</button>\n        </center>\n\
    \      </div>\n    )\n  }\n}  \nexport default App\n```\n\n```javascript\nMain.js\n\
    import React from 'react';\nimport ReactDOM from 'react-dom';\nimport App from\
    \ './App.js';\nReactDOM.render(<App/>, document.getElementById('app'));\n```\n\
    \n## forceUpdate()\n\n该方法允许手动更新组件。\n\n### 语法：\n\n`Component.forceUpdate(callback)`\n\
    \n### 示例：\n\n```javascript\nApp.js\nimport React, { Component } from 'react';\n\
    class App extends React.Component {\n  constructor() {\n    super()\n    this.forceUpdateState\
    \ = this.forceUpdateState.bind(this);\n  }\n\n  forceUpdateState() {\n    this.forceUpdate();\n\
    \  };\n\n  render() {\n    return (\n      <div>\n        <center>\n         \
    \ <h1>Example of Force Update method</h1>\n          <h2>Example to Generate Random\
    \ Number</h2>\n          <h3>Random number: {Math.random()}</h3>\n          <button\
    \ onClick = {this.forceUpdateState}>ForceUpdate</button>\n        </center>\n\
    \      </div>\n    );\n  }\n}\nexport default App;\n```\n\n## React 组件生命周期 (Life-Cycle)\n\
    \n在 ReactJS 中，每个组件的构建过程都有多个生命周期函数。这些方法被称为组件的生命周期。组件的生命周期分为四个阶段：\n\n*   初始化阶段 (Initial\
    \ Phase)\n*   挂载阶段 (Mounting Phase)\n*   更新阶段 (Updating Phase)\n*   卸载阶段 (Unmounting\
    \ Phase)\n\n生命周期的每个阶段都有自己的一组方法。让我们逐一回顾这些阶段：\n\n### 初始化阶段 (Initial Phase)\n\nReactJS\
    \ 组件生命周期的诞生步骤被称为此。组件的初始状态和默认属性（props）包含在此阶段中。这些默认属性在组件的函数 `Object() { [native\
    \ code] }` 中设置。这是一个一次性步骤，涉及以下方法：\n\n*   `getDefaultProps()`：你在此处设置 `this.props`\
    \ 的默认值。它在组件创建之前被调用。\n*   `getInitialState()`：`this.state` 的默认值通过 `this.state.default`\
    \ 指定。\n\n### 挂载阶段 (Mounting Phase)\n\n在此阶段，组件的实例被创建并添加到 DOM 中。它包含以下程序：\n\n*  \
    \ `componentWillMount()`：在组件渲染到 DOM 之前被调用。如果你在此方法中调用 `setState()`，组件将不会重新渲染。\n\
    *   `componentDidMount()`：在组件渲染并放置到 DOM 之后立即调用。现在你可以以任何想要的方式查询 DOM。\n*   `render()`：每个组件都有其定义。它负责返回一个根\
    \ HTML 节点元素。你可以产生 null 或 false 值。\n\n### 更新阶段 (Updating Phase)\n\n这是生命周期的下一步。此阶段与诞生或死亡阶段不同，它会反复进行。它包含以下程序：\n\
    \n*   `componentWillReceiveProps()`：当组件接收到新 props 时，调用此方法。你必须预料状态会发生。\n*   `shouldComponentUpdate()`：当组件决定进行更改时随时调用。如果此函数返回\
    \ true，则组件将更新。\n*   `componentWillUpdate()`：在组件更新发生之前被调用。通过调用它，你可以更改状态。\n*   `render()`：检查\
    \ `this.props` 和 `this.state`，并返回 React Elements、数组、片段、布尔值或 null、字符串和数字等类型。该函数确保组件显示正确。\n\
    *   `componentDidUpdate()`：在组件更新后立即调用。此函数允许你在更新发生时运行其内部的代码。\n\n### 卸载阶段 (Unmounting\
    \ Phase)\n\n组件的生命周期在此阶段结束。当组件实例被删除并从 DOM 中卸载时，会调用此函数。此阶段包含一个方法，如下：\n\n*   `componentWillUnmount()`：在组件永久删除和卸载之前调用此过程。它执行所需的清理操作，例如失效定时器、事件监听器、取消网络请求和清理\
    \ DOM 元素。一旦卸载，将无法重新挂载该组件实例。\n\n### 示例\n\n```javascript\nimport React,{Component}\
    \ from 'react';\nclass App extends React.Component {\n  constructor(props) {\n\
    \    super(props);\n    this.state={world:\"World\"};\n    this.changeState=this.changeState.bind(this)\n\
    \  }\n\n  render(){\n    return(\n      <center>\n        <div>\n          <h1>Example\
    \ of ReactJS components lifecycle</h1>\n          <h3>Hello{this.state.world}</h3>\n\
    \          <button onClick={this.changeState}>ClickHere!</button>\n        </div>\n\
    \      </center>\n    );\n  }\n\n  componentWillMount(){\n    console.log('ComponentWillMOUNT!')\n\
    \  }\n\n  componentDidMount(){\n    console.log('ComponentDidMOUNT!')\n  }\n\n\
    \  changeState(){\n    this.setState({world:\"All!!-ItsanexampleofReactJScomponentlifecycle.\"\
    });\n  }\n\n  componentWillReceiveProps(newProps){\n    console.log('ComponentWillRecieveProps!')\n\
    \  }\n\n  shouldComponentUpdate(newProps,newState){\n    return true;\n  }\n\n\
    \  componentWillUpdate(nextProps,nextState){\n  }\n}\n```\n"
