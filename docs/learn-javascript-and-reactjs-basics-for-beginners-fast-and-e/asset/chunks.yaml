    React Props Validation


    Props are a good way to pass read-only attributes to react components, as we all
    know.


    Proper use of the props is necessary in the component. If it is not utilised correctly,
    the component''s behaviour may not be as expected.


    As a result, props validation is critical for enhancing react components.


    Props validation is a tool that aids developers in avoiding faults and problems
    in the future.


    It improves the readability of the code.


    PropTypes is a specific property used in React components that aids in bug detection
    by checking data types of values supplied by props, however it is not required
    to define components with PropTypes.


    Validating Props


    The react component''s props are validated using App.propTypes.


    When an invalid type passes any of the props, the JavaScript console will display
    warnings.


    You''ll configure the App.defaultProps after you''ve explained the validation
    rules.


    Syntax:


    class App extends React.Component {


    render() {}


    }


