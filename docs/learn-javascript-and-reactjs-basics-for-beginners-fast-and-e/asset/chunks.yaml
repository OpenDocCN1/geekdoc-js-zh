    \ number\")\n}\n</script>\n</body>\n</html>\n```\n**Output**\nX is even number\n\
    \n### else if\n\nIt merely looks at the content to see if the expression is true.\
    \ `else if` is a complex version of the `if` statement.\n\n#### Syntax\n\n```javascript\n\
    if (condition1)\n{\n  Statement(s)to be executed if condition1 is true\n}\nelse\
