    * **JSX**：JavaScript XML 缩写为 `JSX`。它是一种扩展的 JavaScript 语法。其语法与 `XML` 或 `HTML` 相似。这种语法被转换为
    `React` 框架的 JavaScript 调用。它改进了 `ES6`，允许 `HTML` 类文本与 JavaScript React 代码共存。在 `ReactJS`
    中不需要使用 `JSX`，但建议使用。

    * **单向数据绑定**：`ReactJS` 的构建遵循单向数据流，通常被称为单向数据绑定。单向数据绑定是有益益的，因为它允许对整个应用程序进行更多的控制。当数据向反方向流动时，需要额外的特性。它的发生是因为组件是不可变的。

    * **虚拟 DOM**：虚拟 DOM 是真实 `DOM` 的副本。它类似于单向数据绑定。每当 Web 应用程序被修改时，整个 UI 都会被重新渲染。然后检查新的
    `DOM` 与之前的 `DOM` 之间的差异。完成后，真实的 `DOM` 会修改被更改的对象。这减少了内存占用并加快了应用程序运行。

