    \n  console.log('ComponentDidUPDATE!')\n\n}\n\ncomponentWillUnmount(){\n\n  console.log('ComponentWillUNMOUNT!')\n\
    \n}\n\n}\n\nexport default App;\n```\n\n# React Constructors\n\n## What is constructor?\n\
    \nThe function `Object() { [native code] }` is a method that is used to initialise\
    \ the state of a class object. It is called automatically when an object in the\
    \ class is created.\n\nThe function `Object() { [native code] }` notion is the\
    \ same in React as well. A React component's function `Object() { [native code]\
    \ }` is called before the component is mounted.\n\nYou must call the `super(pros)`\
    \ function before any other line when writing a React component's function `Object()\
    \ { [native code] }`. `this.props` will be undefined in the function `Object()\
    \ { [native code] }` if `super(pros)` is not called, which might lead to errors.\n\
    \n### Syntax\n\n```javascript\nconstructor(props){\n  super(props);\n}\n```\n\n\
    The constructors are mostly used for two purposes in React:\n\n1. By assigning\
    \ an object to `this.state`, it is utilised to initialise the component's local\
    \ state.\n2. It's utilised to bind the event handler function that your component\
    \ has.\n\nIt is not necessary to build a function `Object() { [native code] }`\
    \ for a React component if you are not initialising the state or binding the methods\
    \ for your React component.\n\nThe function `Object() { [native code] }` cannot\
    \ call the `setState()` function directly (). If the component requires local\
    \ state, you must assign the initial state using `this.state` in the function\
    \ `Object() { [native code] }`. The lone function `Object() { [native code] }`\
    \ assigns the initial state using `this.state`, while all other methods need the\
    \ usage of the `setState()` method.\n\n## Example\n\nThe constructor's notion\
    \ is demonstrated in the following example:\n\n**App.js**\n```javascript\nimport\
    \ React, { Component } from 'react';\n\nclass App extends Component {\n  constructor(props){\n\
    \    super(props);\n    this.state = {\n      data: 'Hello World'\n    }\n   \
    \ this.handleEvent = this.handleEvent.bind(this);  \n  }\n\n  handleEvent(){\n\
    \    console.log(this.props);\n  }\n\n  render() {\n    return (\n      <div className=\"\
    App\">  \n        <center>\n          <h2>Example of React Constructor</h2>\n\
    \          <input type =\"text\" value={this.state.data}/>\n          <br/><br/>\n\
    \          <button onClick={this.handleEvent}>Please Click</button> </center>\n\
    \      </div>\n    );\n  }\n}  \n\nexport default App;\n```\n\n**Main.js**\n```javascript\n\
    import React from 'react';\nimport ReactDOM from 'react-dom';\nimport App from\
    \ './App.js';\n\nReactDOM.render(<App />, document.getElementById('app'));\n```\n\
    \n# Arrow Functions\n\nIt's a brand-new feature in the ES6 specification. It is\
    \ not necessary to tie any event to `this` while using arrow functions, nor is\
    \ it necessary to bind `this` inside the function `Object() { [native code] }`.\n\
    \n### Example\n\nWe used `bind()` in the previous example, but we don't need it\
    \ now that we're utilising the arrow function. The following example shows how\
    \ to use the program's arrow function.\n\n```javascript\nimport React,{Component}\
    \ from'react';\n\nclass App extends Component{\n  constructor(props){\n    super(props);\n\
    \    this.state={\n      data:'HelloWorld'\n    }\n    this.handleEvent=this.handleEvent.bind(this);\n\
    \  }\n\n  handleEvent=()=>{\n    console.log(this.props);\n  }\n\n  render(){\n\
    \    return(\n      <div className=\"App\">\n        <center>\n          <h2>Example\
    \ of React Constructor</h2>\n          <input type=\"text\" value={this.state.data}/>\n\
    \          <br/><br/>\n          <button onClick={this.handleEvent}>Please Click</button></center>\n\
    \      </div>\n    );\n  }\n}\n\nexport default App;\n```\n"
