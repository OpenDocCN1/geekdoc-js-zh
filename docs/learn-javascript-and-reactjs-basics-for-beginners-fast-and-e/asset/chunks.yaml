  trans: "\n\n## React Native 优势\n\n1. **原生组件**：如果我们需要原生功能，则需要编写尚未设计的特定平台代码。\n2. **类性能**：`React\
    \ Native` 的代码被编译成原生代码，使其能够在两个操作系统上运行，并执行相同的功能。\n3. **跨平台使用**：它同时兼容 Android 和 iOS\
    \ 设备。\n4. **JavaScript**：它被用于原生移动应用程序的开发。\n5. **随时间改进**：社区不断开发最佳实践方案。\n6. **社区**：它拥有庞大的社区，可以帮助人们找到所需的答案。\n\
    7. **存在的不确定性**：由于该框架是由 Facebook 创建的，其存在性是未知的，因为公司保留了随时终止项目的权利。随着 `React Native`\
    \ 流行度的增加，这种情况不太可能发生。\n\n##  Native - React Native \n\n1. **学习困难**：对于应用开发领域的新手来说，学习是非常困难的。\n\
    2. **初始化耗时更多**：即使对于高科技产品和设备，启动也需要长时间。\n3. **React Native - 仍然很新 - 不成熟**：`React\
    \ Native` 仍处于测试阶段，且仅适用于 Android 和 iOS，这对移动应用产生了负面影响。\n4. **缺乏 - 安全健壮性**：`React\
    \ Native` 创建了安全漏洞。专家建议不要使用 `React Native` 开发对安全性要求较高的银行和金融应用。\n\n## ReactJS\n\n\
    `ReactJS` 是一个用于开发单页应用程序界面的开源 JavaScript 库。\n\n根据 MVC 模式，`React` 是“V”，代表 View（视图）。\n\
    \n构建一个 `ReactJS` 应用需要各种组件；这些组件共同构成了所有 `React` 应用的核心。\n\n当这些组件与其他部分结合时，它们允许创建复杂的应用程序。\n\
    \n它是由由名为 Jordan Walke 的 Facebook 软件工程师创建的关键前端库。\n\nFacebook 是第一个创建并维护它的实体，后来它被集成到\
    \ Whatsapp 和 Instagram 等主流产品中。\n\n2011 年，Facebook 首次引入了 `React`，但直到 2013 年 5 月才开源。\n\
    \n## ReactJS 的优势\n\n1. **易于 学习和使用**：\n`ReactJS` 是一个简单易用且易学习的框架。它带有大量的文档、培训材料和教程。\n\
    对于具有 `JavaScript` 经验的开发者来说，它很容易理解，他们可以在几天内开始开发 Web 应用程序。\n它是 `JavaScript` 框架之一，是\
    \ `MVC`（模型-视图-控制器）模型中的 V（视图部分）。\n我们不能说 `ReactJS` 功能非常丰富，但它确实具有开源 JavaScript 用户界面\
    \ (UI) 库的优势，这有助于任务执行。\n\n2. **创建动态 - web 应用程序 - 变得更容易**：\n由于需要复杂的编码，使用 HTML 字符串创建动态\
    \ Web 应用是很困难的，但 `ReactJS` 解决了这个问题并使其变得简单。它需要更少的代码并提供更多功能。它利用了 `JSX`（JavaScript）扩展，这种语法允许使用\
    \ HTML 引和 HTML 标签语法来渲染某些子组件。同时也支持机器可读的代码。\n\n3. **可复用组件**：\n`ReactJS` Web 应用由多个组件组成，每个组件都有自己的逻辑和控制。\n\
    这些组件负责产生短小的、可复用的 HTML 代码。\n这种可复用的代码使得应用程序的设计和维护变得更容易。\n`ReactJS` 使用基于虚拟 DOM 的技术向\
    \ HTML DOM 填充数据。\n因为它仅仅是更改特定 DOM 的元素而不是每次都重新加载，所以虚拟 DOM 非常快。\n\n4. **性能增强**：\n\
    因为有了虚拟 DOM，`ReactJS` 的速度提高了。`ReactJS` 极快。\n由于这一功能，`ReactJS` 明显优于其他框架。\n这背后有一个管理虚拟\
    \ DOM 的概念。\n文档对象模型 (`DOM`) 是一种用于 HTML、XML 和 XHTML 的跨平台计算机编程 API。\n`DOM` 仅包含在内存中。\n\
    因此，每当我们构建组件时，我们不会直接将其写入 `DOM`；而是编写转换为 `DOM` 的虚拟组件，从而获得更平滑、更快的性能。\n\n5. **便捷工具支持**：\n\
    `ReactJS` 也因为提供了实用的工具集而受欢迎。\n这些技术提高了可读性并让开发人员工作更容易。\n这些工具是 Chrome 和 Firefox 的开发扩展，允许您调查虚拟\
    \ DOM 中 react 组件的层次结构。\n\n6. **已知对 SEO 友好**：\n在 SEO 方面，标准框架存在问题。\n搜索引擎通常难以读取大型\
    \ JavaScript 应用。\n`ReactJS` 解决了这个问题，让开发者更容易在多个搜索引擎之间导航。\n这就是为什么 `React.js` 应用可以在服务器上运行，通过虚拟\
    \ DOM 渲染并将标准页面返回给浏览器。\n\n7. **JavaScript 库的优势**：\n`ReactJS` 提供了丰富的 JavaScript\
    \ 库，这就是它在 Web 开发者中如此流行的原因。\nJavaScript 库为 Web 开发者提供了更多自由来做自己的事情。\n\n8. **范围 -\
    \ 代码测试**：\n`ReactJS` 应用启动简单。它让开发者能够使用原生工具轻松测试和调试代码。\n\n## ReactJS 的缺点\n\n1. **高节奏开发**：\n\
    这既是优势也是劣势。\n这是一个劣势，因为环境变化太快，开发者需要不断学习新方法。\n跟上这些变化可能很困难。\n他们必须与时同步。\n\n2. **文档匮乏**：\n\
    这是不断变化的技术的另一个缺点。\n由于 React 的快速更新，缺乏良好的文档。\n\n3. **视图部分**：\n`ReactJS` 只处理 UI 层。因此，为了提供完整的工具集，必须选择其他技术。\n\
    \n4. **JSX 障碍**：\n有些开发者认为 `JSX` 是一个障碍。\n\n"
- fmt: "\nThe `render()` method can render the `this.state` attribute.\n\n### Example\n\
    \nThe following example demonstrates how to create a Stateful component using\
    \ ES6 syntax:\n\n```javascript\nimport React, { Component } from 'react'; \n\n\
    class App extends React.Component { \n  constructor() {\n    super()\n    this.state\
    \ = { displayBio: true }\n  }\n\n  render() {\n    const bio = this.state.displayBio\
    \ ? ( \n      <div>\n        <p><h3>This is tutorialexample website which provides\
    \ you lot of tutorials.</h3></p>\n      </div>\n    ) : null;\n    return (\n\
    \      <div>\n        <h1> Hello World !!!!!!</h1>\n        { bio }\n      </div>\n\
    \    )\n  }\n}\n\nexport default App;\n```\n\nIt is necessary to execute the `super()`\
    \ method in the function `Object() { [native code] }` to set the state. This is\
    \ due to the fact that `this.state` is uninitialized before the `super()` method\
    \ is called.\n\n### Changing the State\n\nThe component's state can be updated\
    \ by calling `setState()` and supplying a new state object as an argument. Now,\
    \ in the aforementioned example, build a new method `toggleDisplayBio()` and bind\
    \ this keyword to it; otherwise, it will not be accessible inside the `toggleDisplayBio()`\
    \ method.\n\n```javascript\nthis.toggleDisplayBio=this.toggleDisplayBio.bind(this)\n\
    ```\n\n### Example\n\nWe're going to add a button to the `render()` method in\
    \ the example below. The `toggleDisplayBio()` method is called when the button\
    \ is pressed, and it displays the specified output.\n\n```javascript\nimport React,\
    \ { Component } from 'react'; \n\nclass App extends React.Component {\n  constructor()\
    \ {\n    super()\n    this.state = { displayBio: false }\n    console.log('Component\
    \ this', this)\n    this.toggleDisplayBio = this.toggleDisplayBio.bind(this)\n\
    \  }\n\n  toggleDisplayBio() {\n    this.setState({displayBio: !this.state.displayBio});\n\
    \  }\n\n  render() {\n    return (\n      <div>\n        <h1>!! Hello World !!</h1>\n\
    \        {\n          this.state.displayBio ? (\n            <div>\n         \
    \     <p><h4>This is tutoriaexample website that has a lot of tutorials. This\
    \ website provides you a better source of learning.</h4></p>\n              <button\
    \ onClick={this.toggleDisplayBio}> Show Less </button>\n            </div>\n \
    \         ) : (\n            <div>\n              <button onClick={this.toggleDisplayBio}>\
    \ Read More </button>\n            </div>\n          )\n        }\n      </div>\n\
    \    )\n  }\n}\n\nexport default App\n```\n\n### React Props\n\nThe term \"properties\"\
    \ is abbreviated as \"prop.\" Because props are immutable, state and props are\
    \ fundamentally different. Props are components that can only be read. It's the\
    \ object that keeps track of a tag's attribute value, and it works similarly to\
    \ HTML elements. It facilitates the transfer of data from one component to another.\
    \ Props are comparable to function arguments in that they are supplied to the\
    \ component in the same way that function arguments are passed to the function.\n\
    \nThe props inside the component can't be changed. Within the components, we may\
    \ add props, which are attributes. These properties are exposed as `this.props`\
    \ in the component and are used to render dynamic data in our `render` method.\n\
    \nWhen you need immutable data in a component, add the `reactDom.render()` method\
    \ to the ReactJS project's `main.js` file and utilise that file inside the component\
    \ you need it in.\n\nFor example:\n\n**App.js**\n```javascript\nimport React,\
    \ { Component } from 'react';\nclass App extends React.Component {\n  render()\
    \ {\n    return (\n      <div>\n        <h1> Hello { this.props.name } </h1>\n\
    \        <p> <h4> This is tutorialexample website which provides you lot of tutorials\
    \ </h4></p>\n      </div>\n    );\n  }\n}\n\nexport default App;\n```\n\n**Main.js**\n\
    ```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    import App from './App.js';\nReactDOM.render(<App name = \"World\" />, document.getElementById('app'));\n\
    ```\n\n### Default Props\n\nIt is not required to include props in the `reactDom.render()`\
    \ element at all times. Default props can also be set directly on the component\
    \ function `Object() { [native code] }`. In the following example, it is well\
    \ explained:\n\n### Example\n\n```javascript\nimport React, { Component } from\
    \ 'react';\nclass App extends React.Component {\n  render() {\n    return (\n\
    \      <div>\n        <h1>Hello World</h1>\n        <h2> Default Pros Example\
    \ </h2>\n        <h3>Welcome to {this.props.name}</h3>\n        <p>tutorialexample\
    \ provides you one of the best tutorials.</p>\n      </div>\n    );\n  }\n}\n\n\
    App.defaultProps = {\n  name: \"tutorialexample\"\n}\nexport default App;\n```\n\
    \n**Main.js**\n```javascript\nimport React from 'react';\nimport ReactDOM from\
    \ 'react-dom';\nimport App from './App.js';\nReactDOM.render(<App/>, document.getElementById('app'));\n\
    ```\n\n### State and Props\n\nIn the app, both state and props can be merged.\
    \ Props can be used to set the state in the parent component and then provide\
    \ it to the child component.\n\nFor example:\n\n**App.js**\n```javascript\nimport\
    \ React, { Component } from 'react';\nclass App extends React.Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {\n      name: \"tutorialexample\",\n\
    \    }\n  }\n\n  render() {  \n    return (\n      <div>\n        <Tutorial tutorialProp\
    \ = {this.state.name}/>\n      </div>\n    );\n  }\n}  \n\nclass Tutorial extends\
    \ React.Component {\n  render() {\n    return (\n      <div>\n        <h1>State\
    \ and Props</h1>\n        <h2>tutorialProp</h1>\n        <p>tutorialexample provides\
    \ you one of the best tutorials.</p>\n      </div>\n    )\n  }\n}\n\nexport default\
    \ App\n```\n"
