    \ type=\"text/javascript\">\nfunction array() {\n  num = new Array(5)\n  num[0]\
    \ = 10;\n  num[1] = 20;\n  num[2] = 30;\n  num[3] = 40;\n  num[4] = 50;\n  sum\
