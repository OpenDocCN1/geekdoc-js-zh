    \n# 学习 ReactJS 基础：初学者教程\n学习编程基础的快速简便方法\nJP TAM\n\n## ReactJS 简介\nReactJS 教程将教你基础知识以及一些高级思想。\n\
    \n它是目前由一位名为 Jordan Walke 的 Facebook 软件工程师构建的最前端库。\n\n它建立在坚实的基础上，并拥有庞大的社区。Facebook\
    \ 是第一个构建并维护它的机构，从那时已被包含在 WhatsApp 和 Instagram 等主要产品中。\n\n2011 年，Facebook 首次引入了\
    \ React，但直到 2013 年 5 月才开源。\n\nMVC（模型-视图-控制器）架构现在被大量网站使用。MVC 中的“V”代表视图（View），而\
    \ React 就是 MVC 中的那个“V”。\n\n构建一个 ReactJS 应用需要各种不同的组件；这些组件是所有 React 应用的核心。\n\n当这些组件与其他部分结合时，它们允许创建复杂的应用程序。\n\
    \n它使用虚拟 DOM 向 HTML DOM 填充数据。由于只需要更改 DOM 的部分组件而不是整个 DOM，所以虚拟 DOM 运行非常快。\n\n我们需要\
    \ React 组件来构建 React 应用，这些组件将组织在决定应用结构的层级元素内部。\n\n让我们看一个包含按钮、标签和输入字段的表单示例，看看它是如何工作的。\n\
    \n表单的每个元素都是一个 React 组件，而表单本身是一个定义表单结构的层级组件。\n\n在更新虚拟 DOM 后，React 会确定实际浏览器 DOM\
    \ 中所需的修改。\n\n正因如此，我们必须编写虚拟组件让 React 将其转换为真实的 DOM，而不是直接将 React 组件写入 DOM 中。\n\n\
    ## React 环境搭建步骤详解\n本节将教你如何成功地为开发 ReactJS 应用搭建环境：\n\n### ReactJS 的前提条件\n1. `NodeJS`\
    \ 和 `NPM`\n2. `React` 和 `React DOM`\n3. `Webpack`\n4. `Babel`\n\n安装 ReactJS 有两种方法：\n\
    1. 使用 `npm` 命令\n2. 使用 `create-react-app`\n\n### 使用 npm 命令\n**第 1 步：** 安装 `NodeJS`。访问\
    \ `https://nodejs.org`\n\n**第 2 步：** 点击 downloads。\n![Image 1.jpg](img/Image00014.jpg)\n\
    \n**第 3 步：** 安装 Node.js\n\n**第 4 步：** 使用以下命令确定版本。\n![使用命令检查版本](img/Image00015.jpg)\n\
    \n**第 5 步：** 现在，在你所在的目录下创建一个你想要命名的根文件夹。\n![在所需的目录中创建根文件夹](img/Image00016.jpg)\n\
    \n**第 6 步：** 创建一个名为 `package.json` 的文件。该文件对于模块生成是必要的。使用以下命令创建此文件：\n```\nnpm init\
    \ -y\n```\n\n**第 7 步：** 使用 `npm` 命令安装 React 相关的 DOM 包：\n```bash\nnpm install react\
    \ react-dom --save\n```\n\n**第 8 步：** 安装 Webpack\nWebpack 主要用于模块打包、开发以及生产流水线的自动化。我们必须使用以下命令安装\
    \ Webpack：\n```bash\nnpm install webpack webpack-dev-server webpack-cli --save\n\
    ```\n`webpack-dev-server` 用于开发期间，`webpack` 用于制作生产构建，而 `webpack-cli` 在上述命令中提供一组指令。\n\
    \n**第 9 步：** 安装 Babel。\nBabel 是一个 JavaScript 编译器，允许你将一种源代码转换为另一种。使用以下命令安装 Babel：\n\
    ```bash\nnpm install babel-core babel-loader babel-preset-env babel-preset-react\
    \ babel-webpack-plugin --save-dev\n```\n\n**第 10 步：** 创建文件。以下是文件：\n* `index.html`\n\
    * `App.js`\n* `main.js`\n* `webpack.config.js`\n* `.babelrc`\n\n#### 配置 Webpack\n\
    要配置 Webpack，将以下内容添加到 `webpack.config.js` 中。这是加载器：\n```javascript\nconst path =\
    \ require('path');\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\n\
    \nmodule.exports = {\n  entry: './main.js',\n  output: {\n    path: path.join(__dirname,\
    \ '/dist'),\n    filename: 'index.js'\n  },\n  devServer: {\n    inline: true,\n\
    \    port: 8080\n  },\n  module: {\n    rules: [\n      {\n        test: /\\.jsx$/,\n\
    \        exclude: /node_modules/,\n        use: {\n          loader: \"babel-loader\"\
    \n        }\n      }\n    ]\n  },\n  plugins: [\n    new HtmlWebpackPlugin({\n\
    \      template: './index.html'\n    })\n  ]\n};\n```\n\n### 启动服务器\n现在是时候启动服务器了。要启动服务器，请在命令行提示符中输入以下命令，并确保处于\
    \ React 文件所在的文件夹中：\n```bash\nnpm start\n```\n此命令将显示端口号，这将需要打开浏览器窗口。打开后，你将看到以下：\n\
    ![Image 9.jpg](img/Image00019.jpg)\n![](img/Image00020.jpg)\n![Image 10.jpg](img/Image00021.jpg)\n\
    \n"
- fmt: "\n### 3. `src`: There are multiple files in this folder, including `App.css`,\
    \ `App.js`, `App.test.js`, `index.css`, `index.js`, and `serviceWorker.js`. The\
    \ `App.js` file will be in charge of displaying the React output screen at all\
    \ times.\n\n### 4. `package-lock.json`: It generated automatically whenever the\
    \ `npm` package alters either the `package.json` or the `node modules` tree. It\
    \ isn't possible to publish it. It will be disregarded if it discovers a location\
    \ other than the top-level package.\n\n### 5. `package.json`: It contains information\
    \ on the project's metadata. It gives `npm` information that allows it to identify\
    \ the project's dependencies as well as the project itself.\n\n### 6. `README.md`:\
    \ It also includes the documentation for React topics.\n\n# React JSX\n\nAll React\
    \ components, as we know, have a `render` function. A React component's HTML output\
    \ is specified by the `render` function.\n\nThe JavaScript extension `JSX` allows\
    \ you to write JavaScript code that appears like HTML. `JSX` is a react-specific\
    \ HTML-like syntax that extends `ECMAScript` to allow HTML-like syntax to coexist\
    \ alongside JavaScript/React programming.\n\nPreprocessors (transpilers like `Babel`)\
    \ employ this syntax to convert HTML-like syntax into standard JavaScript objects\
    \ that a JavaScript engine can comprehend.\n\nIt allows you to put HTML/XML-like\
    \ structures (e.g., DOM-like tree structures) in the same file as your JavaScript\
    \ code, and then the preprocessor converts these expressions to actual JavaScript\
    \ code. Like XML/HTML tags, `JSX` tags have a tag name, attributes, and children.\n\
    \n## Why use JSX?\n\n- It is faster than JavaScript because it optimises the code\
    \ before it is translated to JavaScript.\n- Rather than separating technologies\
    \ by putting HTML and logic in different files, React uses components that include\
    \ both.\n- It is type-safe since most problems are discovered during compilation.\n\
    - It simplifies the process of creating templates.\n\n## Nested Elements in JSX\n\
    \nIf you want to use multiple elements, you must enclose them in a container element.\
    \ The `div` is being utilised as a container element for three nested items.\n\
    \n### App.JSX\n\n```javascript\nimport React, { Component } from 'react';\n\n\
    class App extends Component{\n  render(){\n    return(\n      <div>\n        <h1>Hello\
    \ World !!</h1>\n        <h2>This is TutorialandExample</h2>\n        <p>Website\
    \ with the best tutorials.</p>\n      </div>\n    )\n  }\n}\n\nexport default\
    \ App;\n```\n\n## JSX Attributes\n\nThe characteristics of HTML elements in `JSX`\
    \ are the same as in ordinary HTML. In `JSX`, attributes are named in camelcase\
    \ rather than the conventional naming pattern of HTML, such as `class` in HTML\
    \ becoming `className` in `JSX`. This is due to the fact that in JavaScript, the\
    \ `class` keyword is a reserved keyword. In `JSX`, custom attributes can also\
    \ be used. For custom attributes, we must use `data-prefix`.\n\nThe custom attribute\
    \ `data-customAttr` is used as an attribute for the `<p>` tag in the example below.\n\
    \nFor example:\n\n```javascript\nimport React, { Component } from 'react';\n\n\
    class App extends Component{\n  render(){\n    return(\n      <div>\n        <h1>Hello\
    \ World !!</h1>\n        <h2>This is TutorialandExample</h2>\n        <p data-customAttr\
    \ = \"hello\">Website with the best tutorials.</p>  \n      </div>\n    );\n \
    \ }\n}\n\nexport default App;\n```\n\n## JavaScript Expressions\n\nJavaScript\
    \ expressions can be used inside of `JSX`. We'll need to wrap it with curly brackets\
    \ `{}`. The next example demonstrates this point more clearly.\n\nExample:\n\n\
    ```javascript\nimport React, { Component } from 'react';\n\nclass App extends\
    \ Component{\n  render(){\n    return(\n      <div>\n        <h1>{12+28}</h1>\n\
    \        <h1>Hello World !!</h1>\n        <h2>This is TutorialandExample</h2>\n\
    \        <p data-customAttr = {\"hello\"}>Website with the best tutorials.</p>\n\
    \      </div>\n    );\n  }\n}\n```\n\nWe can't utilise `if else` statements in\
    \ `JSX`; instead, we must use conditional (ternary) expressions. In the following\
    \ example, the value of variable `x` equals `1`, therefore the browser returns\
    \ true; however, if we change this value to something other, the browser returns\
    \ false.\n\nFor Example:\n\n```javascript\nimport React, { Component } from 'react';\n\
    \nclass App extends Component{\n  render(){\n    var x=1;\n    return(\n     \
    \ <div>\n        <h1>{x == 1 ? 'True!' : 'False'}</h1>\n        <h2>This is TutorialandExample</h2>\n\
    \        <p data-customAttr = {\"hello\"}>Website with the best tutorials.</p>\n\
    \      </div>\n    );\n  }\n} \n```\n\n## JSX styling\n\nInline styles are recommended\
    \ by React. CamelCase syntax is required to set inline styles. On particular items,\
    \ React automatically appends `px` after the numeric value. The styling in `JSX`\
    \ is demonstrated in the following example:\n\nFor example:\n\n```javascript\n\
    import React, { Component } from 'react';\n\nclass App extends Component{\n  render(){\n\
    \    var newStyle = {\n      fontSize: 90,\n      fontFamily: 'Times New Roman',\n\
    \      color: '#789067'\n    }\n    return(  \n      <div>\n        <h1 style\
    \ = {newStyle}>www.google.com</h1>h1>\n        <h2>This is TutorialandExample</h2>h2>\n\
    \        <p data-customAttr = {\"hello\"}>Website with the best tutorials.</p>\n\
    \      </div>\n    );\n  }\n}\n\nexport default App;\n```\n\n## JSX Comments\n\
    \nCurly braces must be used while composing. In `JSX`, comments start with `/*`\
    \ and end with `*/`.\n\nFor example:\n\n```javascript\nimport React, { Component\
    \ } from 'react';\n\nclass App extends Component{\n  render(){\n    return(\n\
    \      <div>\n        {/* this is a comment */}\n        <h1>Hello World</h1>\n\
    \      </div>\n    );\n  }\n}\n```\n"
  raw: '3.  src:  There are multiple files in this folder, including App.css, App.js,
    App.test.js, index.css, index.js, and serviceWorker.js. The App.js file will be
    in charge of displaying the React output screen at all times.


    4.  package-lock.json:  It generated automatically whenever the npm package alters
    either the package.json or the node modules tree. It isn''t possible to publish
    it. It will be disregarded if it discovers a location other than the top-level
    package.


    5.  package.json:  It contains information on the project''s metadata. It gives
    npm information that allows it to identify the project''s dependencies as well
    as the project itself.


    6.  README.md:  It also includes the documentation for React topics.


    React JSX


    All React components, as we know, have a render function.


    A React component''s HTML output is specified by the Render function.


    The JavaScript extension JSX allows you to write JavaScript code that appears
    like HTML. JSX is a react-specific HTML-like syntax that extends ECMAScript to
    allow HTML-like syntax to coexist alongside JavaScript/React programming.


    Preprocessors (transpilers like Babel) employ this syntax to convert HTML-like
    syntax into standard JavaScript objects that a JavaScript engine can comprehend.


    It allows you to put HTML/XML-like structures (e.g., DOM-like tree structures)
    in the same file as your JavaScript code, and then the preprocessor converts these
    expressions to actual JavaScript code. Like XML/HTML tags, JSX tags have a tag
    name, attributes, and children.


    Why use JSX?


    • It is faster than JavaScript because it optimises the code before it is translated
    to JavaScript.


    • Rather than separating technologies by putting HTML and logic in different files,
    React uses components that include both.


    • It is type-safe since most problems are discovered during compilation.


    • It simplifies the process of creating templates.


    Nested Elements in - JSX


    If you want to use multiple elements, you must enclose them in a container element.
    The div is being utilised as a container element for three nested items.


    App.JSX


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    return(


    <div>


    <h1>Hello World !!</h1>


    <h2>This is TutorialandExample</h2>


    <p>Website with the best tutorials.</p>


    </div>


    )


    }


    }


    export default App;


    JSX Attributes


    The characteristics of HTML elements in JSX are the same as in ordinary HTML.
    In JSX, attributes are named in camelcase rather than the conventional naming
    pattern of HTML, such as class in HTML becoming className in JSX. This is due
    to the fact that in JavaScript, the class keyword is a reserved keyword. In JSX,
    custom attributes can also be used. For custom attributes, we must use data-prefix.


    The custom attribute data-customAttr is used as an attribute for the p> tag in
    the example below.


    For example:


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    return(


    <div>


    <h1>Hello World !!</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = "hello">Website with the best tutorials.</p>  


    </div>


    );


    }


    }


    export default App;


    JavaScript Expressions


    JavaScript expressions can be used inside of JSX. We''ll need to wrap it with
    curly brackets {}.


    The next example demonstrates this point more clearly.


    Example:


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    return(


    <div>


    <h1>{12+28}</h1>


    <h1>Hello World !!</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = {"hello"}>Website with the best tutorials.</p>


    </div>


    );


    }


    }


    export default App;


    We can''t utilise if else statements in JSX; instead, we must use conditional
    (ternary) expressions. In the following example, the value of variable x equals
    1, therefore the browser returns true; however, if we change this value to something
    other, the browser returns false.


    For Example


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    var x=1;


    return(


    <div>


    <h1>{x == 1 ? ''True!'' : ''False''}</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = {"hello"}>Website with the best tutorials.</p>


    </div>


    );


    }


    }


    export default App; 


    JSX styling


    Inline styles are recommended by React. CamelCase syntax is required to set inline
    styles. On particular items, React automatically appends px after the numeric
    value.


    The styling in JSX is demonstrated in the following example:


    For example:


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    var newStyle = {


    fontSize: 90,


    fontFamily: ''Times New Roman'',


    color: ''#789067''


    }


    return(  


    <div>


    <h1 style = {newStyle}>www.google.com</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = {"hello"}>Website with the best tutorials.</p>


    </div>


    );


    }


    }


    export default App;


    JSX Comments


    Curly braces must be used while composing comments. In JSX, comments start with
    /* and end with */, just like in JSX expressions. The example below demonstrates
    how to use comments in JSX.


    For example:


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    var newStyle = {fontSize: 90,


    fontFamily: ''Times New Roman'',


    color: ''#789067''


    }  


    return(


    <div>


    <h1 style = {newStyle}>www.google.com</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = {"hello"}>Website with the best tutorials.</p>


    {/* this is a comment of JSX*/


    </div>


    );


    }


    }


    export default App;


    React Components


    To create a single-page application in the past, developers had to write thousands
    of lines of code.


    It was quite difficult to make any changes to these applications because they
    follow the structure of traditional DOM.


    If a mistake is discovered, it must be manually searched across the application
    and updated. To overcome this problem, a component-based strategy is used.


    The entire application is separated into discrete logical groups of code, known
    as components, using this approach.


    Components are the fundamental building blocks of a React application.


    It simplifies the process of creating user interfaces.


    Every component shares the same physical area but operates independently of one
    another, eventually merging into a parent component that will serve as the application''s
    final user interface.


    React components have their own structure, functions, and APIs.


    They can be re-used depending on the situation.


    The following are the two types of components in ReactJS:


    1.  Functional Components (Stateless Components).


    2.  Class Components (Stateful component).


    Functional Components


    Because they do not hold or maintain state, functional components are sometimes
    known as stateless components.


    Functional components are a means of writing components that only have a render
    method and no state.


    They are simple JavaScript functions that may or may not accept data as parameters.


    We can also write a function that takes props (properties) as input and returns
    the displayed result.


    The following is an example of stateless components:


    Example


    import React, { Component } from ''react''; 


    class App extends React.Component { 


        render() { 


           return ( 


              <div> 


                 <First/> 


                 <Second/> 


              </div>   


           ); 


        } 


    } 


    class First extends React.Component { 


        render() { 


           return ( 


              <div>   


                 <h1>Stateless Components</h1> 


              </div> 


           ); 


        } 


    } 


    class Second extends React.Component { 


        render() {   


           return ( 


              <div> 


                 <h2>www.tutorialandexample.com</h2> 


                 <p>This website has several tutorials.</p> 


              </div> 


           );   


        } 


    }   


    export default App;


    Class Components


    Because they retain or manage local state, class components are sometimes known
    as Stateful Components.


    These components are more complicated than those that are stateless.


    It necessitates extending React.'
