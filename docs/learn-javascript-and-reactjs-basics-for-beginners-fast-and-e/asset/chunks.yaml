    \  case 'C':\n    result=\"C Grade\";\n  break;\n  default:\n    result=\"No Grade\"\
    ;\n}\ndocument.write(result);\n</script>\n</body>\n</html>\n```\n**Output**\n\
    B Grade\n\n## Javascript loop\n\nBecause the method of repeating forms a circle,\
