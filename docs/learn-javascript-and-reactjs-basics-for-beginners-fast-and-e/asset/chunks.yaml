    {\n  如果 condition3 为真则执行的语句\n}\nelse\n{\n  如果没有任何条件为真，则执行的语句\n}\n```\n\n#### 示例\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=50;\nif(x>30){\n \
