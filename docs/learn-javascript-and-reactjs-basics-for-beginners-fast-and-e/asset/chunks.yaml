    \ If Else\n\nA conditional statement in JavaScript is used to conduct different\
    \ activities depending on the criteria.\n\nIn JavaScript, there are three types\
    \ of statements.\n\n1. `if` Statement.\n2. `if else` Statement.\n3. `if else if`\
    \ Statement.\n\n### if statement\n\nIf the condition is true or false, the `if`\
    \ statement is used in JavaScript to run the function.\n\n```javascript\nif (condition){\n\
    \  //content to be evaluated\n}\n```\n\n![Image 1.jpg](Image00007.jpg)\n\nExample:-\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=50;\nif(x>30){\n \
