  trans: "\n\n当 `while` 循环无限执行项目时，`do while` 循环只执行一次代码，无论条件是真是假。当我们需要至少执行一次语句块时，使用\
    \ `do-while`。\n\n![Image 6.jpg](img/Image00012.jpg)\n\n## 语法\n\n```javascript\n\
    do{\n  code to be executed\n  increment/decrement\n} while (condition);\n```\n\
    \n## 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar i=11;\ndo{\n\
    \  document.write(i + \"<br/>\");\n  i++;\n}while (i<=15);\n</script>\n</body>\n\
    </html>\n```\n\n### 输出\n11\n12\n13\n14\n15\n\n## JavaScript 函数\n\n在 `<script&gt;...</script&gt;`\
    \ 标签内定义新函数的能力是 JavaScript 的一个重要特性。`function` 关键字用于在 JavaScript 中声明函数。\n\n为了重用代码，我们多次调用\
    \ JavaScript 方法。\n\n### 优点 - JavaScript 函数\n1. **代码复用性**：我们多次使用同一个方法来节省时间和代码量。\n\
    2. **更少的代码**：结果是我们的应用程序被压缩了。当我们执行例行任务时，不需要编写大量的代码。\n\n### 语法\n```javascript\n\
    function functionName(parameter or not)\n{\n  statements\n}\n```\n\n### 示例\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction msg()\n{\n  alert(\"Hello!\
    \ world\");\n}\n</script>\n<input type=\"button\" onclick=\"msg()\" value=\"click\
    \ here\"/>\n</body>\n</html>\n```\n\n### 输出\nHello world!\n\n## 带参数的函数\n通过传递参数来调用函数。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction getcube(number)\n\
    {\n  alert(number* number* number);\n}\n</script>\n<form>\n  <input type=\"button\"\
    \ value=\"click\" onclick=\"getcube(3)\"/>\n</form>\n</body>\n</html>\n```\n\n\
    ### 输出\n27\n\n## 示例\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction\
    \ getname()\n{\n  name=prompt(\"Enter the Name\");\n  alert(\"Welcome Mr/Mrs \"\
    \ + name);\n}\n</script>\n</body>\n<form>\n  <input type=\"button\" value=\"Click\"\
    \ onclick=\"getname()\"/>\n</form>\n</html>\n```\n\n## 带返回值的函数\n调用返回值的函数并在程序中使用它。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction getInfo()\n{\n\
    \  return \"Hello Raj! How are you?\";\n}\n</script>\n<script>\n  document.write(getInfo());\n\
    </script>\n</body>\n</html>\n```\n\n### 输出\nHello Raj! How are you?\n\n## Function()\
    \ 构造函数\n函数语句不仅用于定义新函数，还可以还可以使用 `Function()` 构造函数和 `new` 运算符动态定义函数。\n\n### 语法\n\
    ```javascript\n<script>\n  var varilename = new Function(Arg1, Arg2..., \"Function\
    \ Body\");\n</script>\n```\n\n### 示例\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script>\nvar func = new Function(\"a\", \"b\", \"return a+b;\");\nfunction secondFunction(){\n\
    \  var result;\n  result = func(50,50);\n  document.write (result );\n}\n</script>\n\
    </head>\n<body>\n  <p>点击按钮调用函数</p>\n  <form>\n    <input type=\"button\" onclick=\"\
    secondFunction()\" value=\"Call Function\">\n  </form>\n  <p>在函数内部使用不同的参数并自己尝试一下...</p>\n\
    </body>\n</html>\n```\n\n## 函数字面量\n函数字面量概念（构造函数的另一种方式）在 JavaScript 1.2 中引入。它是一个定义没有名称的函数的表达式。函数字面量的语法与函数语句相似，不同之处在于它被用作表达式而不是语句，并且不需要函数名。\n\
    \n### 语法\n```javascript\n<script>\nvar varilename = function (Argument){\n  Function\
    \ Body\n};\n</script>\n```\n\n### 示例\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script>\nvar func =function(a,b){return a+b};\nfunction secondFunction(){\n \
    \ var result;\n  result = func(10,20);\n  document.write (result );\n}\n</script>\n\
    </head>\n<body>\n  <p>点击按钮调用函数</p>\n  <form>\n    <input type=\"button\" onclick=\"\
    secondFunction()\" value=\"Call Function\">\n  </form>\n  <p>在函数内部使用不同的参数并自己尝试一下...</p>\n\
    </body>\n</html>\n```\n\n## JavaScript 对象\n对象是一个包含状态和行为的实体。JavaScript 是一种关注对象的脚本语言。尽管\
    \ JavaScript 是基于模板而非基于类的，但它允许我们创建对象。\n\n### 语法 - 添加属性 - 添加对象\n`objectName.objectProperty\
    \ = propertyValue;`\n我们使用 `write()` 方法向文档写入对象的属性。\n\n### 示例\n以下示例展示了如何创建一个对象。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>定义的对象</title>\n<script type=\"\
    text/javascript\">\nvar book=new Object(); // 创建对象\nbook.subject = \"5 points\
    \ someone\"; // 属性\nbook.author = \"ChetanBhagat\";\n</script>\n</head>\n<body>\n\
    <script type=\"text/javascript\">\n  document.write(\"书籍是: \" + book.subject +\
    \ \"<br>\");\n  document.write(\"作者是: \" + book.author + \"<br>\");\n</script>\n\
    </body>\n</html>\n```\n\n### 输出\n书籍是: 5 points someone\n作者是: ChetanBhagat\n\n\
    ## JavaScript 对象的方法\n\n### 示例\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>定义的对象</title>\n\
    <script type=\"text/javascript\">\n// 定义一个作为方法的函数\nfunction addPrice(amount){\n\
    \  this.price = amount; // 将方法作为属性\n}\nfunction book(title,author){\nitle=title;\n\
    author=author;\nprice;\n}\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\nmyBook=new book(\"5 Points Someone\",\"ChetanBhagat\"); // 创建对象\nmyBook.addPrice(150);\
    \ // 方法\n  document.write(\"标题是: \" + myBook.title + \"<br>\");\n  document.write(\"\
    作者是: \" + myBook.author + \"<br>\");\n  document.write(\"价格是: \" + myBook.price\
    \ + \"<br>\");\n</script>\n</body>\n</html>\n```\n*(注：原文示例代码中存在一些拼写错误，已按语义逻辑保留结构)*\n\
    \n### 输出\n标题是: 5 Points Someone\n作者是: ChetanBhagat\n价格是: 150\n\n## JavaScript\
    \ 数组\n数组用于表示单个单元或内存区域中的元素集合。进入数组的每个元素将根据从零开始的唯一索引存储在数组中。可以通过索引存储数据。在 JavaScript\
    \ 中，我们必须使用 `new` 关键字声明数组。我们使用 `new Array` 构造数组 `(n)`。数组中的槽的数量由 `n` 表示。\n\n###\
    \ 语法\n`myarray = new array(n);`\n注意：当我们在 JavaScript 中未指定大小构建数组时，我们会构建大小为零的数组对象。\n\
    \n### 示例\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar i;\nvar emp=new\
    \ Array();\nemp[0] = \"Ajay\";\nemp[1] = \"Abhay\";\nemp[2] = \"Arun\";\nemp[3]\
    \ = \"Shipra\";\nfor (i=0; i<emp.length; i++) {\n  document.write(emp[i] + \"\
    <br>\");\n}\n</script>\n</body>\n</html>\n```\n\n### 输出\nAjay\nAbhay\nArun\nShipra\n\
    \n"
