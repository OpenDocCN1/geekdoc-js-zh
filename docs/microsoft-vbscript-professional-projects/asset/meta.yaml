  - 第 15 章：创建管理员账户
- - '##'
  - 创建本地账户
- - '###'
  - 手动创建账户的选项
- - '###'
  - 使用本地用户组组件
- - '###'
  - 选择 `Users` 节点
- - '###'
  - 右键点击 `Users` 并选择 `New User`
- - '###'
  - 打开 `New User` 对话框
- - '###'
  - 在 `User name` 字段输入 `ADMT01`
- - '###'
  - 在 `Full name` 字段输入 `Management Acct`
- - '###'
  - 在 `Description` 字段输入 `Emergency Management Acct`
- - '###'
  - 在 `Password` 和 `Confirm password` 字段中输入密码
- - '###'
  - 选择 `Password never expires` 以防止账户过期
- - '###'
  - 在更改密码之前锁定账户
- - '###'
  - 点击 `Create` 然后点击 `Close`
- - '###'
  - 新账户将出现在管理控制台右侧
- - '###'
  - 右键点击该账户并选择 `Properties`
- - '###'
  - 选择 `Member of` 属性页
- - '###'
  - 默认情况下，新账户设为本地 `Users` 组的成员
- - '###'
  - 点击 `Add` 出现 `Select Groups` 对话框
- - '###'
  - 点击 `Advanced`。`Select Groups` 对话框展开显示更多选项
- - '###'
  - 点击 `Find Now` 显示本地组列表
- - '###'
  - 选择 `Administrators` 组并双击 `OK`
- - '###'
  - 本地 `Administrators` 组现在显示为该账户已添加的组之一
- - '###'
  - 点击 `OK`
