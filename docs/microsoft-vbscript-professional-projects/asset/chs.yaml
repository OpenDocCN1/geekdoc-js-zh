  \ VBScript 执行了一个如下所示归档维护脚本。这是一个功能有限的短脚本。它首先定义了两个变量，分别代表要删除的上个月归档文件，以及归档文件所在的 Web\
  \ 服务器上的文件夹位置。\n\nAlexander 收到公司 Web 管理员 Michael Burns 的通知，他不被允许修改公司 Web 服务器上的 Windows\
  \ 注册表。因此，他决定在脚本中硬编码归档文件夹的位置。脚本的“主处理部分”（Main Processing Section）仅由三条语句组成。第一条语句调用\
  \ `MonthToDelete()` 子程序，该子程序确定哪些归档文件符合删除条件。第二条语句调用 `RemoveOldSummaryFiles()` 子程序，执行实际的文件删除操作。第三条语句使用\
  \ `WScript` 对象的 `Quit()` 方法终止脚本的执行。`MonthToDelete()` 和 `RemoveOldSummaryFiles()`\
  \ 子程序中的逻辑在本书之前的示例中已经介绍过多次。\n\n```\n '*************************************************************************\n\
  'Script Name: Script 32.2.vbs\n'Author: Jerry Ford\n'Created: 05/09/03\n'Description:\
  \ This script deletes HTML and Word versions of the\n'consolidated summary reports\
  \ that are older than 3 months old\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nDim strDeleteMonth, strHTMLFolder\n\
  \nstrHTMLFolder = \"d:\\Intuit\\OrderInventory\\Reporting\\Rpts\\\"\n\n'Main Processing\
  \ Section\n\nMonthToDelete()\n\nRemoveOldSummaryFiles()\n\nWScript.Quit()\n\n'Procedure\
  \ Section\n\nSub MonthToDelete()\n\n  Dim intGetSlashPosition, strCurrentMonth\n\
  \n  intGetSlashPosition = Instr(Date(), \"/\")\n\n  strCurrentMonth = Mid(Date(),\
  \ 1, intGetSlashPosition - 1)\n  strDeleteMonth = strCurrentMonth - 4\n\n  If strDeleteMonth\
  \ = 0 Then\n    strDeleteMonth = \"12\"\n  End If\n  If strDeleteMonth = -1 Then\n\
  \    strDeleteMonth = \"11\"\n  End If\n  If strDeleteMonth = -2 Then\n    strDeleteMonth\
  \ = \"10\"\n  End If\n  If strDeleteMonth = -3 Then\n    strDeleteMonth = \"9\"\n\
  \  End If\n\nEnd Sub\n\nSub RemoveOldSummaryFiles()\n\n  Dim FsoObject, strSummaryRptPath\n\
  \  Set FsoObject = WScript.CreateObject(\"Scripting.FileSystemObject\")\n\n  FsoObject.DeleteFile\
  \ strHTMLFolder & strDeleteMonth & \"*\"\n\nEnd Sub\n```\n\n## 总结\n\n在本章中，你学习了如何使用远程\
  \ WSH（Remote WSH）。这包括对 `WshController`、`WshRemote` 和 `WshRemoteError` 对象及其方法和属性的详细检查。然后，你学习了如何应用远程\
  \ WSH 对 Intuit 公司 Web 服务器上的 Word 和 HTML 文件进行远程文件管理。有了本章提供的信息，你现在拥有了开发脚本所需的背景，可以从一台\
  \ Windows 远程管理任意数量计算机。\n\n# 第 VI 部分：Microsoft VBScript 基础介绍\n\n## 附录列表\n\n附录 A:\
  \ Windows XP 命令参考\n\n附录 B: 辅助网站有什么\n\n# 附录 A：Windows XP 命令参考\n\n本附录提供了 Windows 命令的按字母顺序参考。此命令列表基于\
  \ Windows XP 专业版和家庭版操作系统支持的命令。此处列出的某些命令将不支持其他 Windows 操作系统。每个 Windows 命令都有简要描述，并详细解释了其语法。有关这些命令的更多信息，请参考你所版本\
  \ Windows 提供的帮助系统。\n\n## Append\n\n允许程序打开位于不同文件夹中的文件，就像它们存储在当前文件夹一样。\n\n**语法**\n\
  \n```\n append [;] [[drive:]path[;...]] [/x:{on | off}][/path:{on | off}] [/e]\n\
  ```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `;` | 清空追加文件夹列表。 |\n| `[`drive`:]`path`\
  \ | 设置要追加的驱动器、路径和文件夹。 |\n| `/x:{on | off}` | 决定在运行程序时 MS-DOS 子系统是否搜索追加的文件夹。使用 `/x:on`\
  \ 时程序执行搜索，使用 `/x:off` 则不执行。 |\n| `/path:{on | off}` | 决定在提供程序查找的文件名的同时提供了路径，程序是否应搜索追加的文件夹。`/path:on`\
  \ 是默认值。 |\n| `/e` | 创建一个名为 `APPEND` 的环境变量，并将其值设置为追加文件夹列表。`/e` 开关只能在每次重启系统后使用一次。\
  \ |\n\n### Arp\n\n一种 TCP/IP 协议命令，用于显示和修改 ARP（地址解析协议）使用的 IP 到 MAC 地址的翻译表。\n\n**语法**\n\
  \n```\n arp -a [inet_addr] [-N [if_addr]]\narp -d inet_addr [if_addr]\narp - g [-N\
  \ [if_addr]]\narp -s inet_addr ether_addr [if_addr]\n```\n\n**参数**\n\n| 参数 | 目的\
  \ |\n| --- | --- |\n| `-a` | 列出 ARP 条目。 |\n| `-g` | 以与 `-a` 相同的方式列出 ARP 条目。 |\n\
  | `[inet_addr]` | 指定 IP 地址。 |\n| `-N` | 列出接口 ARP 条目。 |\n| `[if_addr]` | 指定要修改翻译的接口。否则将使用第一个接口。\
  \ |\n| `-d` | 删除由 `inet_addr` 指定的目。 |\n| `-s` | 在 ARP 缓存中添加 `inet_addr` IP 地址与 `ether_addr`\
  \ MAC 地址。 |\n| `ether_addr` | 指定 MAC 地址。 |\n\n### Assoc\n\n列出或更改关联。\n\n**语法**\n\n\
  ```\n assoc [.ext[=[filetype]]]\n```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n|\
  \ `None` | 列出当前的关联。 |\n| `.ext` | 指定要列出或修改的扩展名。 |\n| `[filetype]` | 指定文件类型。 |\n\n\
  ### At\n\n显示调度任务（命令、脚本或程序）列表并调度新任务的执行。\n\n**语法**\n\n```\n at [\\\\computername]\
  \ [[id] [/delete] | /delete [/yes]]\nat [\\\\computername] time [/interactive] [/every:date[,...]\n\
  \  | /next:date[,...]] command\n```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `None`\
  \ | 显示所有调度任务。 |\n| `[\\\\computername]` | 指定执行任务的远程计算机。如果省略，则在本地调度。 |\n| `id` |\
  \ 指定分配给调度命令的 ID 号。 |\n| `/delete]` | 终止调度命令。如果不存在 `id`，则终止所有调度任务。 |\n| `/yes]` |\
  \ 在终止调度任务前需要确认。 |\n| `time` | 以 24 小时制的 `hh`:mm 指定执行任务的时间。 |\n| `/interactive]`\
  \ | 允许与桌面和登录用户交互。 |\n| `/every:date[,...]` | 根据指定的星期或月份建立任务执行计划。日期指定为 M, T, W, Th,\
  \ F, S, Su 或 1–31。多个日期用逗号隔开。如果省略，则计划设置为当天。 |\n| `/next:date[,...]` | 在下一次指定的星期（M,\
  \ T, W, Th, F, S, Su）或日期（1–31）时运行任务。多个日期用逗号隔开。如果省略，则计划设置为当天。 |\n| `command` | 指定要执行的任务。\
  \ |\n\n### Atmadm\n\n监控连接和地址，并显示 ATM（异步传输模式）网络的统计数据。\n\n**语法**\n\n```\n atmadm [-c][-a]\
  \ [-s]\n```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[-c]` | 列出计算机到 ATM 网络已建立连接的信息。\
  \ |\n\n\n\n\n\n| `[-a]` | 显示计算机上每个 ATM 网络接口注册的 ATM 网络服务访问点地址。 |\n| `[-s]` | 为活动中的\
  \ ATM 连接提供统计数据。 |\n\n### Attrib\n列出或修改文件属性。\n\n### Syntax\n```\n attrib [+r|-r]\
  \ [+a|-a] [+s|-s] [+h|-h] [[drive:][path] filename] [/s[/d]]\n```\n\n### Parameters\n\
  | Parameter | Purpose |\n| --- | --- |\n| `[+r]` | 指定只读属性。 |\n| `[-r]` | 清除只读属性。\
  \ |\n| `[+a]` | 指定归档属性。 |\n| `[-a]` | 清除归档属性。 |\n| `[+s]` | 将文件标识为系统文件。 |\n| `[-s]`\
  \ | 清除系统文件属性。 |\n| `[+h]` | 指定隐藏文件属性。 |\n| `[-h]` | 清除隐藏文件属性。 |\n| `[[drive:][path]\
  \ filename]` | 设置处理的驱动器、路径和文件名。 |\n| `[/s]` | 对当前目录及所有子目录中的匹配文件应用更改。 |\n| `[/d]`\
  \ | 处理目录。 |\n\n### Cacls\n显示或更改文件 ACL（访问控制列表）。\n\n### Syntax\n```\n cacls filename\
  \ [/t] [/e] [/c] [/g user:perm] [/r user [...]]\n  [/p user:perm [...]] [/d user\
  \ [...]]\n```\n\n### Parameters\n| Parameter | Purpose |\n| --- | --- |\n| `filename`\
  \ | 显示指定文件的 ACL。 |\n| `[/t]` | 修改目录及其子目录中指定文件的 ACL。 |\n| `[/e]` | 编辑 ACL 而不是替换它。\
  \ |\n| `[/c]` | 无论出现错误都进行更改。 |\n| `[/g user:perm]` | 设置指定用户的访问权限，包括：`n` 无，`r` 读取，`c`\
  \ 更改，`f` 完全控制 |\n| `[/r user]` | 移除用户访问权限。 |\n| `[/p user:perm]` | 替换用户访问权限，包括：`n`\
  \ 无，`r` 读取，`c` 更改，`f` 完全控制 |\n| `[/d user]` | 拒绝用户访问。 |\n\n### Call\n调用标签或另一个脚本作为过程执行。\n\
  \n### Syntax\n```\n call [drive:][path] filename [batch-parameters]\ncall :label\
  \ [arguments]\n```\n\n### Parameters\n| Parameter | Purpose |\n| --- | --- |\n|\
  \ `[[drive:][path] filename` | 设置脚本的位置和名称。 |\n| `[batch-parameters]` | 指定传递给脚本的命令行信息。\
  \ |\n| `label` | 指定脚本内跳转的标签。 |\n\n### Chcp\n显示或修改活动控制台代码页号。\n\n### Syntax\n```\n\
  \ chcp [nnn]\n```\n\n### Parameters\n| Parameter | Purpose |\n| --- | --- |\n| `None`\
  \ | 显示活动控制台代码页号。 |\n| `[nnn]` | 指定以下代码页之一：`437`（美国），`850`（多语言（Latin I）），`852`（斯拉夫语（Latin\
  \ II）），`855`（西里尔语（俄罗斯语）），`857`（土耳其语），`860`（葡萄牙语），`861`（冰岛语），`863`（加拿大法语），`865`（北欧语），`866`（俄罗斯语），`869`（现代希腊语）\
  \ |\n\n### Chdir (Cd)\n显示当前目录名称或更改当前目录。\n\n### Syntax\n```\n chdir [/d] [drive:][path]\
  \ [..]\ncd [/d] [drive:][path] [..]\n```\n\n### Parameters\n| Parameter | Purpose\
  \ |\n| --- | --- |\n| `None` | 显示当前驱动器和目录名称。 |\n| `[/d]` | 更改当前驱动器和目录。 |\n| `[drive:][path]`\
  \ | 更改指定的驱动器和目录。 |\n| `[..]` | 将当前目录更改为父目录。 |\n\n### Chkdsk\n显示磁盘状态并修正指定磁盘上的错误。\n\
  \n### Syntax\n```\n chkdsk [drive:][[path] filename] [/f] [/v] [/r] [/i] [/c] [/l[:size]]\n\
  ```\n\n### Parameters\n| Parameter | Purpose |\n| --- | --- |\n| `None` | 显示当前驱动器的磁盘状态。\
  \ |\n| `[drive:]` | 指定要检查的驱动器。 |\n| `[path] filename` | 指定用于碎片整理的文件。 |\n| `[/f]`\
  \ | 修复磁盘错误。 |\n| `[/v]` | 显示处理的每个文件名。 |\n| `[/r]` | 查找坏道并尝试恢复丢失的数据。 |\n| `[/x]`\
  \ | 仅限 NTFS。强制卸载卷。 |\n| `[/i]` | 仅限 NTFS。通过对卷进行不彻底的检查来加速 `chkdsk`。 |\n| `[/c]` |\
  \ 仅限 NTFS。消除对文件夹循环的检查。 |\n| `/l[:size]` | 仅限 NTFS。显示或更改卷上的日志文件大小。 |\n\n### Chkntfs\n\
  显示或调度初始化期间对 FAT、FAT32 或 NTFS 卷进行自动检查。\n\n### Syntax\n```\n chkntfs volume: [...]\n\
  chkntfs [/d]\nchkntfs [/t[:time]]\nchkntfs [/x volume: [...]]\nchkntfs [/c volume:\
  \ [...]]\n```\n\n### Parameters\n| Parameter | Purpose |\n| --- | --- |\n| `volume:`\
  \ | 显示指定卷的系统类型。 |\n| `/d` | 恢复默认设置。 |\n| `/t` | 显示或修改自动检查的剩余时间。 |\n| `/x` | 防止指定卷在初始化期间被检查。\
  \ |\n| `/c` | 指定在初始化期间检查卷。 |\n\n### Cipher\n显示或修改 NTFS 卷上的文件夹和文件加密。\n\n### Syntax\n\
  ```\n cipher [/e| /d] [/s:dir] [/a] [/i] [/f] [/q] [/h] [/k] [/u] [/n] [pathname\
  \ [...]] [/r:pathname] [/w:pathname]\n```\n\n### Parameters\n| Parameter | Purpose\
  \ |\n| --- | --- |\n| `None` | 显示当前文件夹及其内容的加密状态。 |\n| `[/e]` | 加密指定的文件夹，并对以后添加到该文件夹的任何文件开启加密。\
  \ |\n| `[/d]` | 解密指定的文件夹，并对以后添加到该文件夹的任何文件关闭加密。 |\n| `[/s:dir]` |指定文件夹中的所有文件夹和子文件夹执行指定的操作。\
  \ |\n| `[/a]` | 对所有指定的文件执行指定的操作。 |\n| `[/i]` | 如果发生错误则执行指定的操作。 |\n| `[/f]` | 无论加密状态如何，都加密或解密所有指定对象。\
  \ |\n| `[/q]` | 将报告限制为基本信息。 |\n| `[/h]` | 显示具有隐藏或系统属性的文件。 |\n| `[/k]` | 创建新的加密密钥。\
  \ |\n| `[/u]` | 更新加密密钥。 |\n| `[/n]` | 防止更新加密密钥。 |\n| `[pathname]` | 设置文件夹、文件或模式。\
  \ |\n| `[/r:pathname]` | 创建新的恢复代理证书和新的私钥。 |\n\n### Cls\n清除命令控制台屏幕并显示提示符和光标。\n\n\
  ### Syntax\n```\n cls\n```\n\n### Cmd\n启动一个新的 Windows 壳实例。\n\n### Syntax\n```\n\
  \ cmd [ [/c | /k] [/s] [/q] [/d] [/a | /u] [/t:fg] [/e: on | off] [/f: on | off]\
  \ [/v: on | off] string]\n```\n\n### Parameters\n| Parameter | Purpose |\n| ---\
  \ | --- |\n| `[/c]` | 执行指定命令后退出 shell。 |\n| `[/k]` | 执行指定命令并继续。 |\n| `[/q]` | 禁用回显。\
  \ |\n| `[/d]` | 防止执行 AutoRun 命令。 |\n| `[/a]` | 以 ANSI 字符格式输出。 |\n| `[/u]` | 以 Unicode\
  \ 字符格式输出。 |\n| `[/t:fg]` | 指定前景和背景颜色。 |\n| `[/e: on | off]` | 打开命令扩展的支持。 |\n| `[/f:\
  \ on | off]` | 打开文件名和目录名补全。 |\n| `[/v: on | off]` | 打开延迟变量扩展的支持。 |\n| `[string]`\
  \ | 设置要执行的命令。 |\n\n### Color\n设置控制台前景和背景颜色。如果尝试将前景和背景颜色设置为相同值，则返回 `ERRORLEVEL 1`。\n\
  \n### Syntax\n```\n color fb\n```\n\n### Parameters\n| Parameter | Purpose |\n|\
  \ --- | --- |\n| `none` | 恢复默认颜色。 |\n\n\n\n\n\n| `f` | 根据十六进制值设置前景颜色。 |\n| `b` |\
  \ 根据十六进制值设置背景颜色。十六进制颜色分配包括：`0` 黑色 `1` 蓝色 `2` 绿色 `3` 青色 `4` 红色 `5` 紫色 `6` 黄色 `7`\
  \ 白色 `8` 灰色 `9` 浅蓝 `A` 浅绿 `B` 浅青 `C` 浅红 `D` 浅紫 `E` 浅黄 `F` 白色 |\n\n## Comp\n\n对两个文件或两组文件进行逐字节比较。\n\
  \n**语法**\n\n```\n comp [data1] [data2] [/d] [/a] [/l] [/n=number] [/c]\n```\n\n\
  **参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[data1]` | 设置第一个文件或一组文件的路径和文件名。 |\n| `[data2]`\
  \ | 设置第二个文件或一组文件的路径和文件名。 |\n| `[/d]` | 使用十进制格式显示任何差异。 |\n| `[/a]` 使用字符格式显示任何差异。\
  \ |\n| `[/l]` | 显示差异所在的行号。 |\n| `[/n=number]` | 比较两个文件中指定的 `number` 行。 |\n| `[/c]`\
  \ | 执行不区分大小的比较。 |\n\n### Compact\n\n显示并更改 NTFS 分区上文件和文件夹的压缩设置。\n\n**语法**\n\n```\n\
  \ compact [/c|/u] [/s[:dir]] [/a] [/i] [/f] [/q] [filename[...]]\n```\n\n**参数**\n\
  \n| 参数 | 目的 |\n| --- | --- |\n| `None` | 显示当前文件夹的压缩状态信息。 |\n| `[/c]` | 压缩文件夹或文件。\
  \ |\n| `[/u]` | 解压缩文件夹或文件。 |\n| `[/s:dir]` | 指定应处理所有子文件夹。 |\n| `[/a]` | 显示隐藏或系统文件。\
  \ |\n| `[/i]` | 指定忽略错误。 |\n| `[/f]` | 强制对文件夹或文件进行压缩或解压缩。 |\n| `[/q]` | 将报告限制为基本信息。\
  \ |\n| `[filename]` | 设置文件或目录。 |\n\n### Convert\n\n将 FAT 和 FAT32 卷转换为 NTFS 卷。\n\n\
  **语法**\n\n```\n convert [volume] /fs:ntfs [/v] [/cvtarea:filename] [/nosecurity]\
  \ [/x]\n```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `volume` | 指定要转换的驱动器号。 |\n\
  | `/fs:ntfs` | 转换卷。 |\n| `[/v]` | 开启详细消息。 |\n| `[/cvtarea:filename]` | 指定主文件表写入现有的占位符。\
  \ |\n| `[/nosecurity]` 让转换后的文件和文件夹所有人都可以访问。 |\n| `[/x]` 在转换之前卸载卷。 |\n\n### Copy\n\
  \n复制一个或多个文件。\n\n**语法**\n\n```\n copy [/d] [/v] [/n] [/y | /-y] [/z] [/a | /b] source\
  \ [/a | /b]\n  [+ source [/a | /b] [+ ...]] [destination [/a | /b]\n```\n\n**参数**\n\
  \n| 参数 | 目的 |\n| --- | --- |\n| `[/d]` | 允许加密文件复制并保存为解密文件。 |\n| `[/v]` | 验证复制操作是否成功。\
  \ |\n| `[/n]` 使用短文件名作为目标文件的新文件名。 |\n| `[/y]` | 抑制任何确认提示。 |\n| `[/-y]` | 显示确认提示。\
  \ |\n| `[/z]` 在复制网络文件之前开启可重新启动模式，这样如果网络连接断，`copy` 操作将在重新建立连接后恢复。 |\n| `[/a]` | 将文件识别为\
  \ ASCII 文本文件。 |\n| `[/b]` | 将文件识别为二进制文件。 |\n| `source` | 指定要复制的文件或一组文件的文件名。 |\n\
  | `destination` | 指定文件要复制到的名称和目标位置。 |\n\n### Country\n\n配置 MS-DOS 子系统，使其可以使用国际日期、时间、货币、大小写转换和十进制分隔符。\n\
  \n**语法**\n\n```\n country=xxx[,[yyy][,[drive:][path] filename]]\n```\n\n**参数**\n\
  \n| 参数 | 目的 |\n| --- | --- |\n| `xxx` | 指定国家/区域代码。 |\n| `[yyy]` | 指定国家/区域代码页。 |\n\
  | `[drive:][path] filename` | 设置包含国家/区域信息的文件的驱动器、路径和文件名。 |\n\n## Cprofile\n\n从配置文件中移除不必要的空间。\n\
  \n**语法**\n\n```\n cprofile [/l] [/i] [/v] [filelist]\ncprofile [/ii] [/v] [filelist]\n\
  ```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[/l]` 清理本地配置文件。 |\n| `[/i]` 在处理每个配置文件之前提示。\
  \ |\n| `[/v]` 显示已执行的每个操作的详细信息。 |\n| `[filelist]` 显示从其中移除用户特定文件关联的文件列表。 |\n\n## Date\n\
  \n显示或更改当前日期。\n\n**语法**\n\n```\n date [mm-dd-yy]\ndate [/t]\n```\n\n**参数**\n\n| 参数\
  \ | 目的 |\n| --- | --- |\n| `[mm-dd-yy]` 指定日期。`mm` 必须是 1–12 `dd` 必须是 1–31 `yy` 必须是\
  \ 80–99 或 1980–2099 |\n| `[/t]` 在不提示更改日期的情况下显示日期。 |\n\n### Debug\n\n启动用于测试 MS-DOS\
  \ 可执行程序的 Debug 程序。\n\n**语法**\n\n```\n debug [[drive:][path] filename [parameters]]\n\
  ```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[drive:][path] filename` 指定可执行程序的驱动器号、路径和文件名。\
  \ |\n| `[parameters]` 命令行参数。 |\n\n### Defrag\n\n整理本地卷上的数据以改进存储和检索。\n\n**语法**\n\n\
  ```\n defrag volume [/a]\ndefrag volume [/v]\ndefrag volume\n```\n\n**参数**\n\n|\
  \ 参数 | 目的 |\n| --- | --- |\n| `volume` 要进行整理的卷。 |\n| `[/a]` 显示分析报告。 |\n| `[/v]`\
  \ 显示详细分析。 |\n\n## Del (Erase)\n\n删除文件。\n\n**语法**\n\n```\n del [drive:][path] filename\
  \ [...] [/p] [/s] [/q]\n```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[drive:][path]\
  \ filename` 指定要删除文件的驱动器、路径和文件名。 |\n| `[/p]` 提示确认。 |\n| `[/s]` 删除当前文件夹及其子文件夹中的文件。\
  \ |\n| `[/q]` 抑制确认。 |\n| `[/a]` 根据属性删除。 |\n\n## Dir\n\n显示目录列表。\n\n**语法**\n\n```\n\
  \ dir [drive:][path][filename] [...] [/p] [/q] [/w] [/d]\n  [/a[:attributes]][/o[:sortorder]]\
  \ [/s] [/l] [/n] [/x] [/c]\n```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `None`\
  \ 显示磁盘卷标签、序列号和内容列表。 |\n| `[drive:][path][filename]` 指定要显示的驱动和路径。 |\n| `[/p]` 分页显示数据。\
  \ |\n| `[/q]` 显示所有权信息。 |\n| `[/w]` 多列显示文件夹列表。 |\n| `[/d]` 与 `/w` 相同但按列排序。 |\n| `/a[:attributes]`\
  \ 限制为符合指定属性的目录和文件。可以使用以下属性：`h` 隐藏文件 `s` 系统文件 `d` 目录 `a` 存档文件 `r` 只读文件 `-h` 非隐藏文件\
  \ `-s` 非系统文件 `-d` 显示文件 `-a` 自上次备份以来未更改的文件 `-r` 非只读文件。 |\n| `/o[:sortorder]` 指定显示目录和文件的排序顺序。可以使用选项：`n`\
  \ 按名称排序 `e` 按扩展名排序 `d` 按日期时间排序 `s` 按大小排序。 |\n| `[/s]` 显示当前文件夹及其子文件夹。 |\n| `[/l]`\
  \ 以列表格式显示。 |\n| `[/n]` 以短文件名格式显示。 |\n| `[/x]` 以所有者格式显示。 |\n| `[/c]` 以分页格式显示。 |\n\
  \n\n\n\n\n| `g` | 在文件之前显示文件夹 |\n| :--- | :--- |\n| `-n` | 按名称反字母顺序排序 |\n| `-e` |\
  \ 按扩展名反字母顺序排序 |\n| `-d` | 按日期和时间反序排序 |\n| `-s` | 按大小反序排序 |\n| `-g` | 在文件之后显示文件夹\
  \ |\n\n| `/t [[:]timefield]` | 确定用于显示或或排序列表的时间字段。有效选项有： |\n| :--- | :--- |\n| `c`\
  \ | 创建时间 |\n| `a` | 最后访问时间 |\n| `w` | 最后写入时间 |\n\n| `/s` | 列出指定文件名的所有出现项。 |\n| `/b`\
  \ | 列出每个目录或文件名。 |\n| `/l` | 显示未排序的小写文件夹和文件名。 |\n| `/n` | 显示长列表格式。 |\n| `/x` | 显示短名称。\
  \ |\n| `/c` | 在显示文件大小时显示千分位符（逗号）。 |\n| `/4` | 以四位年份格式显示日期。 |\n\n### Diskcomp\n\n\
  比较两个软盘的内容。\n\n**语法**\n\n```\ndiskcomp [drive1: [drive2:]]\n```\n\n**参数**\n\n| 参数\
  \ | 用途 |\n| --- | --- |\n| `[drive1]` | 标识第一个磁盘的位置。 |\n| `[drive2]` | 标识第二个磁盘的位置。\
  \ |\n\n### Diskcopy\n\n将源磁盘的内容复制到目标磁盘。\n\n**语法**\n\n```\ndiskcopy [drive1: [drive2:]]\
  \ [/v]\n```\n\n**参数**\n\n| 参数 | 用途 |\n| --- | --- |\n| `[drive1]` | 标识源磁盘的位置。 |\n\
  | `[drive2]` | 标识目标磁盘的位置。 |\n| `/v` | 验证复制操作是否成功。 |\n\n### Diskperf\n\n指定可与系统监视器使用的计数器类型。\n\
  \n**语法**\n\n```\ndiskperf [-y[d|v]|-n[d|v] [\\\\computername]\n```\n\n**参数**\n\n\
  | 参数 | 用途 |\n| --- | --- |\n| `None` | 显示性能计数器的状态。 |\n| `[-y]` | 指定在系统初始化时启动物理和逻辑磁盘性能计数器。\
  \ |\n| `[-yd]` | 在系统初始化时启用物理驱动器的性能计数器。 |\n| `[-yv]` | 在系统初始化时启用逻辑驱动器的性能计数器。 |\n\
  | `[-n]` | 防止性能计数器在系统初始化时启动。 |\n| `[-nd]` | 在系统初始化时禁用物理驱动性能计数器。 |\n| `[-nv]` | 在系统初始化时禁用逻辑驱动性能计数器。\
  \ |\n| `[\\\\computername]` | 允许指定一个网络计算机进行查看。 |\n\n### Doskey\n\n执行 Doskey 程序，该程序可回想命令并创建宏。\n\
  \n**语法**\n\n```\ndoskey [/reinstall] | [/listsize=size] | [/macros:[all | exename]]\n\
  \  | [/history] | [/insert|] | [/overstrike] | [/exename=exename]\n  | [/macrofile=filename]\
  \ | [macroname=[text]]\n```\n\n**参数**\n\n| 参数 | 用途 |\n| --- | --- |\n| `/reinstall`\
  \ | 安装 Doskey 的新副本。 |\n| `[/listsize=size]` | 设置历史缓冲区中包含的最大命令数。 |\n| `/macros` |\
  \ 显示宏。 |\n| `all` | 显示所有可执行程序的宏。 |\n| `[exename]` | 显示指定可执行程序的宏。 |\n| `/history`\
  \ | 显示当前存储在内存中的命令。 |\n| `/insert | /overstrike` | 指定插入模式。 |\n| `/exename=exename`\
  \ | 标识将运行宏的程序。 |\n| `/macrofile=filename` | 标识包含要安装宏的文件。 |\n| `[macroname=[text]]`\
  \ | 创建宏并分配由 `text` 设置的命令。 |\n\n### Dosonly\n\n防止非 MS-DOS 应用程序在 COMMAND.COM 中执行。\n\
  \n**语法**\n\n```\nDosonly\n```\n\n### Driverquery\n\n显示设备驱动程序信息。\n\n**语法**\n\n```\n\
  driverquery [/s computer] [/u domain\\user /p password] [/fo table | list | csv]\
  \ [/nh] [/v] [/si]\n```\n\n**参数**\n\n| 参数 | 用途 |\n| --- | --- |\n| `[/s computer]`\
  \ | 标识计算机或其 IP 地址。 |\n| `/u domain\\user /p password` | 使用所提供用户的权限执行命令。 |\n| `[/fo\
  \ table|list|csv]` | 指定返回结果的格式。 |\n| `/nh` | 与 `/fo table` 选项配合使用时防止显示标题。 |\n| `/v`\
  \ | 显示驱动程序的详细信息。 |\n| `/si` | 显示数字签名信息。 |\n\n### Echo\n\n显示消息或启用/禁用命令回显。\n\n**语法**\n\
  \n```\necho [on | off] [message]\n```\n\n**参数**\n\n| 参数 | 用途 |\n| --- | --- |\n\
  | `None` | 显示当前的 `echo` 设置。 |\n| `on | off` | 开启或关闭命令回显。 |\n| `[message]` | 指定要显示的文本。\
  \ |\n\n### Echoconfig\n\n在 MS-DOS 子系统初始化期间处理 CONFIG.NT 和 AUTOEXEC.NT 文件时显示消息。\n\n\
  **语法**\n\n```\nechoconfig\n```\n\n### Edit\n\n启动 MS-DOS 编辑器。\n\n**语法**\n\n```\n\
  edit [[drive:][path] filename] [/b] [/g] [/h] [/nohi]\n```\n\n**参数**\n\n| 参数 | 用途\
  \ |\n| --- | --- |\n| `[drive:][path] filename` | 指定文本文件的驱动器、路径和文件名，如果文件不存在则创建它。\
  \ |\n| `/b` | 以黑色背景和白色前景显示 MS-DOS 编辑器。 |\n| `/g` | 加快 CGA 监器上的屏幕更新速度。 |\n| `/h`\
  \ | 显示显示器上可以显示的行数。 |\n| `/nohi` | 从 16 色方案更改为 8 色方案。 |\n\n### Edlin\n\n启动面向行的 ASCII\
  \ 文本编辑器。\n\n**语法**\n\n```\nedlin [drive:][path] filename [/b]\n```\n\n**参数**\n\n\
  | 参数 | 用途 |\n| --- | --- |\n| `[drive:][path] filename` | 指定 ASCII 文件的驱动器、路径和文件名。\
  \ |\n| `/b` | 指示 `edlin` 忽略文件结束符。 |\n\n### Endlocal\n\n结束脚本中环境更改的本地化，并将环境变量恢复到之前的值。\n\
  \n**语法**\n\n```\nEndlocal\n```\n\n### Evntcmd\n\n显示 SNMP（简单网络管理协议）事件。\n\n**语法**\n\
  \n```\nevntcmd [/s sysname][/v number] [/n] filename\n```\n\n**参数**\n\n| 参数 | 用途\
  \ |\n| --- | --- |\n| `/s sysname` | 设置目标系统名称。 |\n| `/v number` | 设置消息级别：`0`=无；`10`=详细。\
  \ |\n| `/n` | 在接收到陷获（trap）更改时防止重启 SNMP 服务。 |\n| `filename` | 标识包含要陷获信息的配置文件。 |\n\
  \n### Eventcreate\n\n为管理员提供向事件日志发布事件的能力。\n\n**语法**\n\n```\neventcreate [/s computer\
  \ [/u domain\\user [/p password]] [/l application\n  | system] | [/so srcname] [/t\
  \ error | warning | information |\n  successaudit | failureaudit] [/id event] [/d\
  \ description]\n```\n\n**参数**\n\n| 参数 | 用途 |\n| --- | --- |\n| `/s computer` | 指定目标计算机名称。\
  \ |\n| `/u domain\\user` | 使用分配给指定用户的权限执行命令。 |\n| `/p password` | 指定用户的密码。 |\n|\
  \ `/l application|system]` | 指定目标事件日志。 |\n| `/so srcname` | 设置事件源。 |\n| `/t error\
  \ | warning | information | successaudit | failureaudit]` | 识别事件类型。 |\n| `/id event`\
  \ | 设置事件类型（1–65535 之间）。 |\n| `/d description` | 指定事件描述。 |\n\n### Eventquery\n\n\
  显示存储在事件日志中的事件。\n\n**语法**\n\n```\nEventquery[.vbs] [/s computer [/u domain\\user\
  \ [/p password]] [/fi filter]\n  [/fo table | list | csv] [/r evtrange] [/nh] [/v]\
  \ [/l [application]\n  | [system] | [security] [\"DNS server\"] [userlog] [dirlogname]\
  \ [*]]\n```\n\n\n\n\n\n| `[/u]` | 使用指定用户的分配权限执行命令。 |\n| `[/p]` | 指定用户的密码。 |\n| `[/fi\
  \ filter]` | 标识要包含的事件。 |\n| `[/fo table &#124; list &#124; csv]` | 指定命令输出的格式。 |\n\
  | `[/r evtrange]` | 指定要显示的事件范围。`N` 列出日志中最近的 `n` 个事件。`-n` 列出日志中最早旧的 `n` 个事件。`n1–n2`\
  \ 列出指定范围内的事件。 |\n| `[/nh]` | 抑制列标题的显示。 |\n| `[/v]` | 指定详细输出（verbose output）。 |\n\
  | `[/l application &#124; system &#124; security]` | 指定目标事件日志。 |\n| `[\"DNS server\"\
  ]` | 仅当目标计算机上的 DNS 激活时才能指定。 |\n| `[`userlog]` | 要处理的用户定义日志。 |\n| `[`dirlogname]`\
  \ | 要处理的目录日志。 |\n| `[*]` | 指定所有日志。 |\n\n### Exit\n终止 Windows Shell 会话。\n\n**Syntax**\n\
  ```\n exit [/b] [exitcode]\n```\n\n**Parameters**\n\n| 参数 | 目的 |\n| --- | --- |\n\
  | `[/br]` | 退出当前处理的批文件。 |\n| `exitcode` | 设置退出代码。 |\n\n### Expand\n从发行磁盘中解压压缩文件。\n\
  \n**Syntax**\n```\n expand [-r] source [destination]\nexpand -d source.cab [-f:files]\n\
  expand source.cab -f:files destination\n```\n\n**Parameters**\n\n| 参数 | 目的 |\n|\
  \ --- | --- |\n| `[-r]` | 在解压时重命名文件。 |\n| `-d` | 显示指定源位置的文件列表。 |\n| `[-f:files]`\
  \ | 指定 .CAB 文件中要解压的文件。 |\n| `[destination]` | 指定文件解压的位置。 |\n\n### Fc\n比较两个文件并报告它们的差异。\n\
  \n**Syntax**\n```\n fc [/a] [/b] [/c] [/l] [/lbn] [/n] [/t] [/u] [/w] [/nnnn]\n\
  \  [drive1:][path1]filename1 [drive2:][path2]filename2\n```\n\n**Parameters**\n\n\
  | 参数 | 目的 |\n| --- | --- |\n| `[/a]` | 显示每组差异的第一行和最后一行。 |\n| `[/b]` | 以二进制模式对文件进行比较。\
  \ |\n| `[/c]` | 忽略大小差异。 |\n| `[/l]` | 以 ASCII 模式对文件进行比较。 |\n| `[/lbn]` | 指定内部行缓冲区使用的行数。此值必须大于或等于所比较文件中的差异行数。\
  \ |\n| `[/n]` | 显示行号。 |\n| `[/t]` | 防止将制表符扩展为空格。 |\n| `[/u]` 以 Unicode 文本对文件进行比较。\
  \ |\n| `[/w]` | 在比较期间压缩空间。 |\n| `[/nnnn]` | 设置在两个文件被识别为重新同步之前必须匹配的连续行数。 |\n| `[`drive1:][path1]`filename1]`\
  \ | 设置第一个文件的驱动器、路径和文件名。 |\n| `[`drive2:][path2]`filename2]` | 设置第二个文件的驱动器、路径和文件名。\
  \ |\n\n### Fcbs\n限制 MS-DOS 子系统同时访问的 FCB 文件控制块数量。\n\n**Syntax**\n```\n fcbs=x\n```\n\
  \n**Parameters**\n\n| 参数 | 目的 |\n| --- | --- |\n| `x` | 设置 FCB 数量，最大设定值为 255。 |\n\
  \n### Files\n限制 MS-DOS 子系统一次可以打开的文件数量。\n\n**Syntax**\n```\n files=x\n```\n\n**Parameters**\n\
  \n| 参数 | 目的 |\n| --- | --- |\n| `x` | 设置文件数量，最大设定值为 255。 |\n\n### Find\n在文件中搜索字符串并显示任何匹配项。\n\
  \n**Syntax**\n```\n find [/v] [/c] [/n] [/i] \"string\" [[drive:][path]filename]\n\
  ```\n\n**Parameters**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[/v]` | 显示不匹配字符串的行。 |\n\
  | `[/c]` | 显示匹配行的计数。 |\n| `[/n]` | 在每行之前显示行号。 |\n| `[/i]` | 执行忽略大小的搜索。 |\n| `\"\
  string\"` | 指定要搜索的字符串。 |\n| `[`drive:][path]`filename]` | 指定文件的驱动器、路径和文件名。 |\n\n\
  ### Findstr\n使用正则表达式在文件中搜索字符串。\n\n**Syntax**\n```\n findstr [/b] [/e] [/l] [/r]\
  \ [/s] [/i] [/x] [/v] [/n] [/m] [/o] [/p]\n  [/offline] [/g:file] [/f:file] [/c:string]\
  \ [/d:dirlist]\n  [/a:color attribute] [strings] [[drive:][path] filename]]\n```\n\
  \n**Parameters**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[/b]` | 指定匹配必须发生在行首。 |\n| `[/c:string]`\
  \ 使用指定的字符串作为字面搜索字符串。 |\n| `[/e]` | 指定匹配必须发生在行尾。 |\n| `[/l]` 使用搜索字符串进行字面搜索。 |\n|\
  \ `[/r]` | 将搜索字符串作为正则表达式。 |\n| `[/s]` | 在当前文件夹及其所有子目录中搜索匹配。 |\n| `[/i]` 执行忽略大小的搜索。\
  \ |\n| `[/x]` 匹配整个单词。 |\n| `[/v]` 显示不包含匹配项的行。 |\n| `[/n]` 显示行号。 |\n| `[/m]` 只打印匹配的行。\
  \ |\n| `[/o]` 显示匹配项的字符位置。 |\n| `[/p]` 忽略空行。 |\n| `[/offline]` 离线模式查找。 |\n| `[/g:file]`\
  \ 从文件中读取搜索字符串。 |\n| `[/f:file]` 从文件中读取搜索字符串。 |\n| `[/c:string]` 使用指定的字符串进行搜索。 |\n\
  | `[/d:dirlist]` 从目录列表中读取字符串。 |\n| `[/a:color attribute]` 指定颜色属性。 |\n| `[strings]`\
  \ 字符串。 |\n| `[[drive:][path] filename]] |\n\n（注：原文中 Find 处存在格式重复，已按逻辑对应翻译。）\n\n\n\
  \n\n\n| `[/a:unitsize]` | 设置 FAT、FAT32 或 NTFS 卷上使用的分配单元大小。 |\n| `[/q]` | 执行快速格式化。\
  \ |\n| `[/f:size]` | 指定软磁盘的大小。 |\n| `[/t:tracks]` | 指定磁盘上的磁道数。 |\n| `[/n:sectors]`\
  \ | 指定每个磁道上的扇区数。 |\n| `[/c]` | 指定在新卷上创建的文件应自动压缩。 |\n| `[/x]` | 在格式化卷之前如果需要，则自动卸载该卷。\
  \ |\n\n### Ftp\n\n与运行 FTP 服务的计算机之间传输文件。\n\n### 语法\n\n```\nftp [-v] [-d] [-i] [-n]\
  \ [-g] [-s:filename] [-a] [-w:windowsize] [-A] [computer]\n```\n\n### 参数\n\n| 参数\
  \ | 目的 |\n| --- | --- |\n| `[-v]` | 防止显示远程服务器的消息。 |\n| `[-d]` | 启用调试。 |\n| `[-i]`\
  \ | 防止在传输多个文件时进行交互式提示。 |\n| `[-n]` | 在初始连接时抑制自动登录。 |\n| `[-g]` | 允许在本地文件名和路径名中使用通配符。\
  \ |\n| `[-s:filename]` | 指定包含 FTP 命令的文本文件，这些命令将在 FTP 会话开始时自动执行。 |\n| `[-a]` | 使用任何本地接口绑定数据连接。\
  \ |\n| `[-w:windowsize]` | 将默认传输缓冲区大小从 4096 更改为新值。 |\n| `[-A]` | 以匿名身份登录。 |\n| `[computer]`\
  \ | 指定要连接的远程计算机。 |\n\n### Ftype\n\n显示或修改用于关联文件扩展名的文件类型。\n\n### 语法\n\n```\nFtype\
  \ [filetype[=[command]]]\n```\n\n### 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[filetype]`\
  \ | 指定你想要处理的文件类型。 |\n| `[command]` | 指定用于打开此类类型文件的打开命令。 |\n\n### Getmac\n\n显示网络设备的\
  \ MAC（介质访问控制）地址，并列出分配给每个地址的网络协议。\n\n### 语法\n\n```\nGetmac[.exe] [/s computer [/u\
  \ domain\\user] [/p passwd]] [/fo [table | list | csv] [/nh] [/v]\n```\n\n### 参数\n\
  \n| 参数 | 目的 |\n| --- | --- |\n| `[/s computer]` | 通过名称或 IP 地址识别目标计算机。 |\n| `[/u\
  \ domain\\user]` | 使用提供的用户权限执行命令。 |\n| `[/p password]` | 指定用户的密码。 |\n| `[/fo [table\
  \ | list | csv]` | 指定返回结果的格式。 |\n| `[/nh]` | 抑制列头的显示。 |\n| `[/v]` | 指定详细输出。 |\n\n\
  ### Goto\n\n指示 shell 跳跃到脚本中的某个标签，并从下一行开始处理命令。\n\n### 语法\n\n```\ngoto label\n```\n\
  \n### 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `label` | 指定 shell 应该跳转到脚本中的某行。 |\n\n\
  ### Gpresult\n\n在目标计算机上显示组策略设置和策略结果集（RSo）。\n\n### 语法\n\n```\ngpresult [/s computer]\
  \ [/u domain\\user /p password] [/user trgtusername] [/scope [user | computer]]\
  \ [/v] [/z]\n```\n\n### 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[/s computer]` | 通过名称或\
  \ IP 地址识别目标计算机。 |\n| `[/u domain\\user /p password]` | 使用提供的用户权限执行命令。 |\n| `[/user\
  \ trgtusername]` | 指定要显示策略结果集的用户名。 |\n| `[/scope [user | computer]]` | |\n| `[/v]`\
  \ | 指定详细输出。 |\n| `[/z]` | |\n\n### Gpupdate\n\n刷新组策略设置。 |\n\n### 语法\n\n```\ngpupdate\
  \ [/s computer] [/target:scope] [/target: computer]\n```\n\n### 参数\n\n| 参数 | 目的\
  \ |\n| --- | --- |\n| `[/s computer]` | 通过名称或 IP 地址识别目标计算机。 |\n| `[/target:scope]`\
  \ | 指定更新的范围。 |\n| `[/target: computer]` | 指定要更新的计算机。 |\n\n### Graft\n\n指示 shell\
  \ 合并两个文件。\n\n### 语法\n\n```\ngraftabl [txt]\n```\n\n### 参数\n\n| 参数 | 目的 |\n| ---\
  \ | --- |\n| `[txt]` | 指定文本文件。 |\n\n### Help\n\n提供有关命令的信息。\n\n### 语法\n\n```\nhelp\
  \ [command]\n```\n\n### 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[command]` | 指定命令。\
  \ |\n\n### Hostname\n\n显示计算机的 TCP/IP 名称。\n\n### 语法\n\n```\nhostname\n```\n\n###\
  \ If\n\n在脚本中支持条件逻辑。\n\n```\nif [not] errorlevel number\nif [not] string1==string2\n\
  if [not] exist filename\nif [/i] string1 string2\nif defined variable\n```\n\n|\
  \ 参数 | 目的 |\n| --- | --- |\n| `[not]` | 反转测试。 |\n| `errorlevel number` | 如果上一个程序返回的退出码等于或大于\
  \ `number`，则返回真。 |\n| `command` | 指定在满足前提条件时让 shell 执行的命令。 |\n| `string1==string2`\
  \ | 当 `string1` 和 `string2` 相同时时返回真。 |\n| `exist filename` | 当 `filename` 存在时返回真。\
  \ |\n| `[/i]` | 强制进行不区分大小写的字符串比较。 |\n| `string1 string2` | 比较字符串。 |\n| `defined\
  \ variable` | 如果环境变量已定义则返回真。 |\n\n### Ipconfig\n\n一种诊断命令，显示并设置 TCP/IP 网络配置设置。\n\n\
  ### 语法\n\n```\nipconfig [/all [/renew [adapter]] [/release [adapter]] [/flushdns]\n\
  \  [/displaydns] [/registerdns] [/showclassid adapter]\n  [/setclassid adapter [classid]]\n\
  ```\n\n| 参数 | 目的 |\n| --- | --- |\n| `None` | 显示每个网络接口的 IP 地址、子网掩码和默认网关。 |\n| `[/all]`\
  \ | 生成所有可用配置信息。 |\n| `[/renew [adapter]]` | 提交更新 DHCP 配置参数请求。 |\n| `[/release [adapter]]`\
  \ | 丢弃当前的 DHCP 配置。 |\n| `[/flushdns]` | 清除并重置 DNS 客户端缓存。 |\n\n\n\n\n\n| `[/displaydns]`\
  \ | 显示 DNS 客户端缓存。 |\n\n| `[/registerdns]` | 为计算机注册 DNS 名称和 IP 地址。 |\n\n| `[/showclassid\
  \ adapter]` | 显示指定网络适配器的 DHCP 类 ID。 |\n\n| `[/setclassid adapter [classid]]` | 为指定的网络适配器配置\
  \ DHCP 类 ID。 |\n\n## Ipxroute\n\n显示并更改 IPX (*国际数据包交换*) 表信息。\n\n### 语法\n\n```\nipxroute\
  \ servers [/type=x]\nipxroute ripout network\nipxroute resolve [guid | name] [guid\
  \ | adapter]\nipxroute board=x [def] [gbr] [mbr] [remove=xxxx]\nipxroute config\n\
  ```\n\n### 参数\n\n| 参数 | 用 |\n| --- | --- |\n| `servers [/type=x]` | 显示 SAP（服务访问点）表。\
  \ |\n| `ripout network` | 确定 `network` 是否可用。 |\n| `resolve [guid | name] [guid |\
  \ adapter]` | 将 GUID 解析为友好名称，反之亦然。 |\n| `board=x` | 标识要查询的网络适配器。 |\n| `[def]` |\
  \ 使用 ALL ROUTES 广播传输数据包。当数据包发送到路由表中未列出的唯一 MAC 地址时，它将被发送到 SINGLE ROUTES 广播。 |\n|\
  \ `[gbr]` | 使用 ALL ROUTES 广播传输数据包。当数据包发送到广播地址 255 时，它将被发送到 SINGLE ROUTES 广播。 |\n\
  | `[mbr]` | 使用 ALL ROUTES 广播传输数据包。当数据包发送到多播地址时，它将被发送到 SINGLE ROUTES 广播。 |\n| `[remove=xxxx]`\
  \ | 从路由表中删除指定的地址。 |\n| `config` | 显示所有 IPX 绑定的信息。 |\n\n### Irftp\n\n通过红外链路发送和接收数据。\n\
  \n### 语法\n\n```\nirftp [drive:\\][[path]filename] [/h]\nirftp /s\n```\n\n### 参数\n\
  \n| 参数 | 用 |\n| --- | --- |\n| `[drive:] [[path]filename]` | 要传输的驱动器、路径和文件名。 |\n\
  | `/h` | 指定隐藏模式，防止显示无线链路对话框。 |\n| `/s` | 打开无线链路属性。 |\n\n### Label\n\n创建、删除或修改磁盘的卷标签。\n\
  \n### 语法\n\n```\nlabel [drive:][label]\nlabel [/MP] [volume] [label]\n```\n\n###\
  \ 参数\n\n| 参数 | 用 |\n| --- | --- |\n| `none` | 指示 shell 提示更改或删除当前标签。 |\n| `[drive:]`\
  \ | 指定磁盘。 |\n| `[label]` | 指定一个新的卷标签。 |\n| `[/MP]` | 指定卷为挂载点或卷名。 |\n| `[volume]`\
  \ | 设置驱动器号、卷名或挂载点。 |\n| `[label]` | 指定卷标签。 |\n\n### Loadfix\n\n将程序加载到常规内存的前 64KB\
  \ 之上并执行。\n\n### 语法\n\n```\nloadfix [drive:][path] filename\n```\n\n### 参数\n\n| 参数\
  \ | 用 |\n| --- | --- |\n| `[drive:][path]` | 指定程序的驱动器和路径。 |\n| `filename` | 指定程序名。\
  \ |\n\n### Lodctr\n\n为服务和驱动程序注册性能计数器和文本。\n\n### 语法\n\n```\nlodctr [\\\\computer]\
  \ filename [/s:filename] [/r:filename]\n```\n\n### 参数\n\n| 参数 | 用 |\n| --- | ---\
  \ |\n| `[\\\\computer] filename` | 在指定的目标计算机上注册 `filename` 中的性能计数器。 |\n| `[/s:filename]`\
  \ | 将性能计数器设置保存到 `filename`。 |\n| `[/r:filename]` | 从 `filename` 还原性能计数器设置。 |\n\n\
  ### Logman\n\n调度性能计数器和事件跟踪日志收集。\n\n### 语法\n\n```\nlogman [create [counter | trace]\
  \ collection] [start collection]\n  [stop collection] [delete collection] [query\
  \ collection | providers]\n  [update collection]\n```\n\n### 参数\n\n| 参数 | 用 |\n\
  | --- | --- |\n| `[create [counter | trace] collection]` | 创建收集查询或跟踪收集。 |\n| `[start\
  \ collection]` | 启动指定的收集查询。 |\n| `[stop collection]` | 停止指定的收集查询。 |\n| `[delete\
  \ collection]` | 删除指定的收集查询。 |\n| `[query collection | providers]` | `Collection`\
  \ 显示指定收集的属性。Providers 显示所有已注册的提供程序。 |\n| `[update collection]` | 更新收集查询。 |\n\n###\
  \ Lpq\n\n一种诊断工具，提供运行 LPD 服务器的计算机上打印队列的状态信息。\n\n### 语法\n\n```\nlpq --S server --P\
  \ printer [-l]\n```\n\n### 参数\n\n| 参数 | 用 |\n| --- | --- |\n| `-S server` | 指定计算机。\
  \ |\n| `-P printer` | 指定打印机名。 |\n| `[-l]` | 提供详细状态。 |\n\n### Lpr\n\n用于向运行 LPD 服务器的计算机提交打印文件的程序。\n\
  \n### 语法\n\n```\nlpr [-S server] --P printer [-C bannercontent] [-J jobname] [-o\
  \ | -ol]\n  filename\n```\n\n### 参数\n\n| 参数 | 用 |\n| --- | --- |\n| `[-S server]`\
  \ | 指定打印机所在计算机的计算机或 IP 地址。 |\n| `-P Printer` | 指定打印机名。 |\n| `[-C bannercontent]`\
  \ | 指定横幅内容。 |\n| `[-J jobname]` | 指定作业名。 |\n| `[-o | -ol]` | 指定选项。 |\n| `filename`\
  \ | 指定文件。 |\n\n### Mem\n\n显示内存使用信息。\n\n### 语法\n\n```\nmem [/program|debug|classify]\n\
  ```\n\n### 参数\n\n| 参数 | 用 |\n| --- | --- |\n| `/program` | 显示程序状态。 |\n| `/debug`\
  \ | 显示驱动程序状态。 |\n| `/classify` | 显示内存区域状态。 |\n\n### Mkdir (md)\n\n创建目录或子目录。\n\n\
  ### 语法\n\n```\nmkdir [drive:]path\nmd [drive:]path\n```\n\n### 参数\n\n| 参数 | 用 |\n\
  | --- | --- |\n| `[drive:]` | 指定创建新文件夹的驱动器。 |\n| `path` | 指定文件夹名。 |\n\n### Mmc\n\
  \n打开 MMC (*微软管理控制台*)。\n\n### 语法\n\n```\nmmc path\\filename.msc [/a] [/64] [/32]\n\
  ```\n\n### 参数\n\n| 参数 | 用 |\n| --- | --- |\n| `path\\filename.msc` | 使用现有控制台启动。\
  \ |\n| `[/a]` 以作者模式打开现有控制台。 |\n| `[/64]` | 打开 64 位 MMC。 |\n| `[/32]` | 打开 32 位 MMC。\
  \ |\n\n### Mountvol\n\n创建、删除或显示卷挂载点。\n\n### 语法\n\n```\nmountvol [drive:]path VolumeName\n\
  mountvol [drive:]path /d\nmountvol [drive:]path /L\nmountvol drive: /s\n```\n\n\
  ### 参数 | 用 |\n| --- | --- |\n| `[drive:]path` | 指定包含挂载点的 NTFS 文件夹。 |\n\n\n\n\n\n\
  | `VolumeName` | 标识作为挂载点目标的卷名称。 |\n| `/d` | 删除指定文件夹中的卷挂载点。 |\n| `/L` | 显示指定文件夹中挂载的卷名称。\
  \ |\n| `/s` | 在指定的驱动器和基于 Itanium 的计算机上挂载 EIF 系统分区。 |\n\n## Move\n\n将一个或多个文件从一个位置移动到另一个位置，并从原始位置删除。\n\
  \n**语法**\n\n```\n move [/y | /-y] [source] [target]\n```\n\n**参数**\n\n| 参数 |set\
  \ |\n| --- | --- |\n| `[/y]` | 抑制确认提示。 |\n| `[/-y]` | 启用确认提示。 |\n| `[source]` |\
  \ 指定要移动源文件的位置。 |\n| `[target]` | 指定文件的目标位置。 |\n\n## Msinfo32\n\n显示有关操作系统、软件和硬件的信息。\n\
  \n**语法**\n\n```\n Msinfo32 [/pch] [/nfo filename] [/report filename] [/computer\
  \ system]\n  [/showcategories] [/category categoryID] [/categories categoryID]\n\
  ```\n\n**参数**\n\n| 参数 |set |\n| --- | --- |\n| `[/pch]` | 使用历史视图显示结果。 |\n| `[/nfo\
  \ filename]` | 将结果保存为 .nfo 文件。 |\n| `[/report filename]` | 将结果保存为 .txt 文件。 |\n|\
  \ `[/computer system]` | 在目标计算机上启动系统信息工具。 |\n| `[/showcategories]` | 使用所有可用类别 ID\
  \ 在目标计算机上启动系统信息工具。 |\n| `[/category categoryID]` | 使用指定的类别 ID 在目标计算机上启动系统信息工具。 |\n\
  | `[/categories categoryID]` | 使用指定的类别 ID 或类别 ID 在目标计算机上启动系统信息工具。 |\n\n## Nbtstat\n\
  \n使用基于 TCP/IP 的 NetBIOS 显示当前的 TCP/IP 连接和统计。\n\n**语法**\n\n```\n nbtstat [-a remotename]\
  \ [-A IP address] [-c] [-n] [-r] [-R] [RR] [-s]\n  [-S] [interval]\n```\n\n**参数**\n\
  \n| 参数 |set |\n| --- | --- |\n| `[-a remotename]` | 使用名称显示远程计算机名称表。 |\n| `[-A IP\
  \ address]` | 使用 IP 地址显示远程计算机名称表。 |\n| `[-c]` | 显示 NetBIOS 名称缓存的内容。 |\n| `[-n]`\
  \ | 显示本地 NetBIOS 名称。 |\n| `[-r]` | 显示名称解析统计数据。 |\n| `[-R]` | 清除 NetBIOS 名称缓存中的所有名称并重新加载\
  \ `Lmhosts` 文件。 |\n| `[RR]` | 释放并刷新 NetBIOS 名称。 |\n| `[-s]` | 尝试使用主机名显示客户端和服务器会话。\
  \ |\n| `[-S]` | 以 IP 地址的形式显示客户端和服务器会话。 |\n| `[interval]` | 在指定的 `interval`（秒）显示统计。\
  \ |\n\n## Net accounts\n\n修改用户账户数据库并更改登录和密码要求。\n\n**语法**\n\n```\n net accounts [/forcelogoff:{minutes\
  \ | no}] [/minpwlen:length]\n  [/maxpwage:[days | unlimited]] [/minpwage:days] [/uniquepw:number]\n\
  \  [/domain]\n\nnet accounts [/sync] [/domain]\n```\n\n**参数**\n\n| 参数 |set |\n|\
  \ --- | --- |\n| `None` | 显示当前的域、登录和密码设置。 |\n| `[/forcelogoff:{minutes | no}]` |\
  \ 指定在用户登录时间过期后，终止与服务器的会话之前等待的分钟数。`No` 防止强制注销。 |\n| `[/minpwlen:length]` | 设置最小密码长度。\
  \ |\n| `[/maxpwage:[days | unlimited]]` | 设置密码有效期。 |\n| `[/minpwage:days]` | 指定用户更改密码之前必须经过的最少天数。\
  \ |\n| `[/uniquepw:number]` | 密码历史要求，防止用户在指定的次数内重复使用密码。 |\n| `[/domain]` | 指定操作应在域控制器上执行，而不是在本地。\
  \ |\n| `[/sync]` | 使主域控制器与所有备用域控制器同步。 |\n\n## Net computer\n\n在域数据库中添加或删除计算机帐户。\n\
  \n**语法**\n\n```\n net computer \\\\computername [/add | /del]\n```\n\n**参数**\n\n\
  | 参数 |set |\n| --- | --- |\n| `\\\\computername` | 指定要添加或删除的计算机。 |\n| `[/add]` |\
  \ 添加计算机。 |\n| `[/del]` | 删除计算机。 |\n\n## Net config\n\n显示并更改可配置活动活动。\n\n**语法**\n\n\
  ```\n net config [server | workstation]\n```\n\n**参数**\n\n| 参数 |set |\n| --- | ---\
  \ |\n| `[server]` | 显示或更改服务器服务的设置。 |\n| `[workstation]` | 显示或更改工作站服务的设置。 |\n\n##\
  \ Net continue\n\n重新激活挂起的服务。\n\n**语法**\n\n```\n net continue service\n```\n\n**参数**\n\
  \n| 参数 |set |\n| --- | --- |\n| `service` | 设置要重新激活的服务器。 |\n\n## Net file\n\n显示服务器上所有打开的共享文件列表以及每个文件的锁定数量。\n\
  \n**语法**\n\n```\n net file [id [/close]]\n```\n\n**参数**\n\n| 参数 |set |\n| --- |\
  \ --- |\n| `None` | 显示服务器上打开的文件列表。 |\n| `id` | 标识文件编号。 |\n| `[/close]` | 关闭打开的文件并释放任何锁定记录。\
  \ |\n\n## Net group\n\n在 Windows 域上添加、显示或更改全局组。\n\n**语法**\n\n```\n net group [groupname\
  \ [/comment:\"text\"]] [/domain]\nnet group groupname {/add [/comment:\"text\"]\
  \ | /delete} [/domain]\nnet group groupname username {/add | /delete} [/domain]\n\
  ```\n\n**参数**\n\n| 参数 |set |\n| --- | --- |\n| `None` | 显示服务器上的组。 |\n| `[groupname]`\
  \ | 指定要添加、扩展或删除的组名。 |\n| `[/comment:\"text\"]` | 为新组或现有组添加注释。 |\n| `[/domain]` |\
  \ 在域控制器上执行操作，而不是在本地。 |\n| `username` | 列出要从组中添加或删除的一个或多个用户名或组名。 |\n| `/add` | 将用户名或全局组添加到本地组。\
  \ |\n| `/delete` | 从本地组移除用户名或组名。 |\n\n## Net help\n\n列出提供帮助的网络命令，并为指定的网络命令提供帮助。\n\
  \n**语法**\n\n```\n net help [command]\n```\n\n**参数**\n\n| 参数 |set |\n| --- | ---\
  \ |\n| `None` | 显示提供帮助的网络命令和主题列表。 |\n| `[command]` | 指定要获取帮助的命令。 |\n| `/help | /?`\
  \ | 显示命令的语法。 |\n\n## Net helpmsg\n\n为 Windows 消息提供帮助。\n\n**语法**\n\n```\n net helpmsg\
  \ message#\n```\n\n**参数**\n\n| 参数 |set |\n| --- | --- |\n| `message#` | 指定错误消息的位数。\
  \ |\n\n## Net localgroup\n\n添加、显示或修改本地组。\n\n**语法**\n\n```\n net localgroup [groupname\
  \ [/comment:\"text\"]] [/domain]\nnet localgroup groupname {/add [/comment:\"text\"\
  ] | /delete} [/domain]\nnet localgroup groupname name [...] {/add | /delete} [/domain]\n\
  ```\n\n**参数**\n\n| 参数 |set |\n| --- | --- |\n| `None` | 显示服务器名称和服务器上的本地组。 |\n| `[groupname]`\
  \ | 指定本地组的名称。 |\n| `[/comment:\"text\"]` | 为新组或现有组添加或更改注释。 |\n| `[/domain]` | 在域控制器上执行操作，而不是在本地。\
  \ |\n| `name` | 列出要从本地组中添加或删除的一个或多个用户名或组名。 |\n| `/add` | 将用户名或全局组添加到本地组。 |\n| `/delete`\
  \ | 从本地组移除组名。 |\n\n## Net name\n\n显示接受消息的计算机名称列表，或添加或删除消息名称。\n\n**语法**\n\n```\n\
  \ net name [name [/add | /delete]]\n```\n\n**参数**\n\n| 参数 |set |\n| --- | --- |\n\
  | `None` | 显示已使用的名称列表。 |\n| `name` | 指定要添加或删除的消息名称。 |\n\n\n\n\n\n| `[name]` | 为计算机指定一个名称。\
  \ |\n| `[/add]` | 为计算机添加一个名称。 |\n| `[/delete]` | 从计算机删除一个名称。 |\n\n## Net pause\n\
  \n暂停正在运行的服务。\n\n### 语法\n\n```\n net pause service\n```\n\n### 参数\n\n| 参数 | Purpose\
  \ |\n| --- | --- |\n| `service` | 服务名称。 |\n\n## Net print\n\n列出或管理打印作业和打印机队列。\n\n\
  ### 语法\n\n```\n net print \\\\computername\\sharename\nnet print [\\\\computername]\
  \ job# [/hold | /release | /delete]\n```\n\n### 参数\n\n| 参数 | Purpose |\n| --- |\
  \ --- |\n| `somputername` | 指定管理打印机队列的计算机名称。 |\n| `sharename` | 指定打印机队列的名称。 |\n\
  | `job#` | 指定分配给打印作业的 ID 号。 |\n| `[/hold]` | 暂停打印作业。 |\n| `[/release]` | 释放挂起状态的打印作业。\
  \ |\n| `[/delete]` | 删除打印作业。 |\n\n## Net send\n\n向用户、计算机和消息名称发送消息。\n\n### 语法\n\n\
  ```\n net send {name | * | /domain[:name] | /users} message\n```\n\n### 参数\n\n|\
  \ 参数 | Purpose |\n| --- | --- |\n| `name` | 指定用户名、计算机名或消息名称。 |\n| `*` | 向域或你的工作组中的所有名称发送消息。\
  \ |\n| `/domain[:name]` | 如果未指定 `name`，则将消息发送到域中的所有名称。如果指定了 `name`，则将消息发送到指定域或工作组中的所有名称。\
  \ |\n| `/users` | 向当前连接到服务器的所有用户发送消息。 |\n| `message` | 指定消息文本。 |\n\n## Net session\n\
  \n列出或终止连接计算机的客户端会话。\n\n### 语法\n\n```\n net session [\\\\computername] [/delete]\n\
  ```\n\n### 参数\n\n| 参数 | Purpose |\n| --- | --- |\n| `None` | 显示所有活动会话的信息。 |\n| `[\\\
  \\computername]` | 标识特定的网络计算机。 |\n| `[/delete]` | 终止与 `\\\\computername` 的会话，并关闭该会话在计算机上所有打开的文件。\
  \ |\n\n## Net share\n\n创建、删除和显示共享资源。\n\n### 语法\n\n```\n net share [sharename]\n\n\
  net share [sharename=drive:path [/users:number | /unlimited]\n  [/remark:\"text\"\
  ] [/cache: [manual | automatic | no]]\n\nnet share [sharename [/users:number | unlimited]\
  \ [/remark:\"text\"] \"]\n  [/cache: [manual | automatic | no]]\n\nnet share [[sharename\
  \ | drive:path] /delete]\n```\n\n### 参数\n\n| 参数 | Purpose |\n| --- | --- |\n| `None`\
  \ | 显示计算机上当前共享的所有资源的信息。 |\n| `sharename` | 指定分配给共享资源的名称。 |\n| `drive:path` | 指定要共享文件夹的绝对路径。\
  \ |\n| `/users:number` | 限制同时访问共享的最大用户数。 |\n| `/unlimited` | 允许无限制地同时访问共享。 |\n|\
  \ `/remark:\"text\"` | 为共享资源添加注释。 |\n| `/cache:automatic` | 启用离线缓存和自动重新整合。 |\n|\
  \ `/cache:manual` | 启用手动重新整合的离线缓存。 |\n| `/cache:no` | 建议不使用离线缓存。 |\n| `/delete`\
  \ | 终止资源的共享。 |\n\n## Net start\n\n显示已启动的服务列表。用于启动服务。\n\n### 语法\n\n```\n net start\
  \ [service]\n```\n\n### 参数\n\n| 参数 | Purpose |\n| --- | --- |\n| `None` | 显示活动服务的列表。\
  \ |\n| `[service]` | 指定要启动的服务名称。 |\n\n## Netstat\n\n显示当前 TCP/IP 连接的统计数据。\n\n###\
  \ 语法\n\n```\n netstat [-a] [-e] [-n] [-o] [-p protocol] [-r] [-s] [interval]\n```\n\
  \n### 参数\n\n| 参数 | Purpose |\n| --- | --- |\n| `[-a]` | 显示所有连接。 |\n| `[-e]` | 显示以太网相关的统计数据。\
  \ |\n| `[-n]` | 以数字形式显示 IP 地址和端口号。 |\n| `[-o]` | 显示活动的 TCP 连接并显示每个连接的进程 ID (PID)。\
  \ |\n| `[-p protocol]` | 显示指定 TCP/IP 协议的连接。 |\n| `[-r]` | 显示路由表。 |\n| `[-s]` | 按协议组织的信息。\
  \ |\n| `[interval]` | 按指定的 `interval`（秒）显示统计数据。 |\n\n## Net statistics\n\n显示本地工作站服务、服务器服务或任何可用统计数据的服务的日志统计信息。\n\
  \n### 语法\n\n```\n net statistics [workstation | server]\n```\n\n### 参数\n\n| 参数 |\
  \ Purpose |\n| --- | --- |\n| `None` | 显示提供统计数据的活动服务列表。 |\n| `[workstation]` | 显示本地工作站服务统计数据。\
  \ |\n| `[server]` | 显示本地服务器服务统计数据。 |\n\n## Net stop\n\n终止网络服务。\n\n### 语法\n\n```\n\
  \ net stop service\n```\n\n### 参数\n\n| 参数 | Purpose |\n| --- | --- |\n| `Service`\
  \ | 指定任何有效的 Windows NT 或 2000 服务。 |\n\n## Net time\n\n将计算机内部钟与另一台计算机的时钟同步。\n\n###\
  \ 语法\n\n```\n net time [\\\\computername | /domain[:domainname] | /rtsdomain[:domainname]]\n\
  \  [/set]\n\nnet time [\\\\computername] [/querysntp] | [/setsntp[:ntp server list]]\n\
  ```\n\n### 参数\n\n| 参数 | Purpose |\n| --- | --- |\n| `None` | 显示指定为网络时间服务器的计算机上的日期时间。\
  \ |\n| `\\\\computername` | 指定网络服务器的名称。 |\n| `/domain[:domainname]` | 指定要同步的域。 |\n\
  | `/rtsdomain[:domainname]` | 指定要同步的可靠时间服务器 (Reliable Time Server) 域。 |\n| `/set`\
  \ | 将计算机内部与指定的计算机或域同步。 |\n| `/querysntp` | 显示网络时间协议 (NTP) 服务器的名称。 |\n| `/setsntp[:ntp\
  \ server list]` | 指定网络时间协议服务器列表。 |\n\n## Net use\n\n显示网络连接信息，并将计算机连接到网络资源。\n\n###\
  \ 语法\n\n```\n net use [devicename | *] [\\\\computername\\sharename[\\volume]]\n\
  \  [password | *]] [/user:[domainname]]\n  [/user:[dotteddomainname]]\n  [/user:[username@dotteddomainname]]\n\
  \  [.savecred] [/smartcard] [[/delete | /persistent:[yes | no]]]\n\nnet use devicename\
  \ [/delete] /persistent:{yes | no}]\n```\n\n### 参数\n\n| 参数 | Purpose |\n| --- |\
  \ --- |\n| `None` | 显示网络连接列表。 |\n| `[devicename]` | 为新连接分配名称或指定要断开的设备。对于磁盘驱动器使用\
  \ D: 到 Z%，对于打印机使用 LPT1: 到 LPT3。 |\n| `[\\\\computername\\sharename]` | 指定网络计算机及其共享资源的名称。\
  \ |\n| `[\\volume]` | 指定 NetWare 。 |\n| `[password]` | 指定访问资源所需的密码。 |\n| `[*]` |\
  \ 指定提示密码。 |\n| `[/user]` | 在建立连接时指定不同的用户名。 |\n| `[domainname]` | 允许指定另一个域。 |\n|\
  \ `[username]` | 指定登录时使用的用户名。 |\n| `[dotteddomainname]` | 完全限定 DNS 域名。 |\n| `[/delete]`\
  \ | 终止网络连接。 |\n| `[/persistent]` | 允许定义跨系统重启的持久连接。 |\n| `[yes]` | 在下次登录时恢复连接。 |\n\
  | `[no]` | 在下次登录时不恢复连接。 |\n\n## Net user\n\n显示用户账户信息，或添加和修改用户账户。\n\n### 语法\n\n```\n\
  \ net user [username [password | *] [options]] [/domain]\n\nnet user [username {password\
  \ | *} /add [options] [/domain][\nnet user [username [/delete] [/domain][\n```\n\
  \n### 参数\n\n| 参数 | Purpose |\n| --- | --- |\n\n\n\n\n\n| `None` | 显示本地计算机上的用户账户列表。\
  \ |\n| `[username]` | 指定要添加、删除、更改或查看的帐户名称。 |\n| `[password]` | 为新账户分配密码或更改现有账户的密码。\
  \ |\n| `*` | 提示输入密码。 |\n| `/domain]` | 在主域控制器上执行操作，而不是在本地。 |\n| `/add` | 添加用户账户。\
  \ |\n| `[/delete]` | 删除用户账户。 |\n| `[options]` | 指定以下任意选项： |\n| `/active:{no | yes}`\
  \ | 启用或禁用账户。 |\n| `/comment:\"text\"` | 为账户添加注释。 |\n| `/countrycode:nnn` | 指定用于帮助和错误消息的国家/地区代码。\
  \ |\n| `/expires:{date | never}` | 指定账户过期的状态。 |\n| `/fullname:\"name\"` | 设置用户的全名而非用户名。\
  \ |\n| `/homedir:path` | 建立用户的家目录。 |\n| `/passwordchg:{yes | no}` | 决定用户是否可以更改其密码。\
  \ |\n| `/passwordreq:{yes | no}` | 指定密码要求。 |\n| `/profilepath:[path]` | 建立用户的登录配置文件。\
  \ |\n| `/scriptpath:path` | 建立用户登录脚本的路径。 |\n| `/times:{times | all}` | 定义用户允许使用计算机的时间段。例如：W,8AM-5PM;\
  \ F,8AM-1PM。 |\n| `/usercomment:\"text\"` | 决定管理员是否可以更改或添加用户注释。 |\n| `/workstations:}\
  \ {computername[,…] |` | 指定用户登录的最多八个工作站。 |\n\n## Net view\n\n显示指定计算机共享的域、计算机或资源列表。\n\
  \n#### 语法\n\n```\nnet view [\\\\computername | /domain[:domainname]]\nnet view /network:nw\
  \ [\\\\computername]\n```\n\n#### 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `None` | 显示域中的计算机列表。\
  \ |\n| `\\[computername]` | 指定一台计算机以便查看其资源。 |\n| `/domain[:domainname]` | 指定要查看的域。\
  \ |\n| `/network:nw` | 显示 Novell NetWare 网络上的服务器。 |\n\n### Nslookup\n\n显示来自 DNS\
  \ (*域名系统*）名称服务器的信息。\n\n#### 语法\n\n```\nnslookup [-option ...] [computer-to-find\
  \ | - [server]] \n```\n\n#### 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[-option …]`\
  \ | 指定作为命令行选项使用的 `nslookup` 命令。 |\n| `[computer-to-find]` | 使用默认 DNS 服务器显示 `computer-to-find`\
  \ 的信息。 |\n| `[server]` | 指定一个不同的 DNS 服务器进行查询。 |\n\n### Ntbackup\n\n提供从命令提示符启动备份的手段。\n\
  \n#### 语法\n\n```\nNtbackup backup [systemstate] \"@filename\" /J [\"jobname\"] [/P\
  \ [\"poolname\"]]\n  [/G [\"guidname\"]] [/T [\"tapename\"] [/N {\"medianame\"]]\
  \ [/F [\"filename\"]]\n  [/D [\"description\"] [/DS [\"server\"]] [/IS [\"server\"\
  ]]\n  [/A] [/V: {yes | no]] [/R: [yes | no]] [/L: [f | s | n]]\n  [/M backuptype]]\
  \ [/RS: [yes | no ]] [/HC: [on | off]] [/SNAP: [on | off]]\n```\n\n#### 参数\n\n|\
  \ 参数 | 目的 |\n| --- | --- |\n| `backup` | 指定执行备份操作。 |\n| `[systemstate]` | 备份系统状态数据。\
  \ |\n| `\"@filename\"` | 标识使用的备份选择文件。 |\n| `/J [\"jobname\"]` | 设置在作业文件中列出的作业名称。\
  \ |\n| `/P [\"poolname\"]` | 设置媒体池值。 |\n| `/G [\"guidname\"]` | 更改或添加 GUID。 |\n\
  | `/T [\"tapename\"]` | 更改或添加带名。 |\n| `/N {\"medianame\"}` | 设置新的带名。 |\n| `/F [\"\
  filename\"]` | 指定路径和文件名。 |\n| `/D [\"description\"]` | 设置备份集的标签。 |\n| `/DS [\"server\"\
  ]` | 备份交换服务器上的目录服务文件。 |\n| `/IS [\"server\"]` | 备份信息服务文件。 |\n| `/A]` | 执行追加。 |\n\
  | `/V: {yes | no}` | 验证备份。 |\n| `/R: [yes | no]` | 决定资源保留。 |\n| `/L: [f | s | n]`\
  \ | 指定日志。 |\n| `/M backuptype]` | 指定备份类型。 |\n| `/RS: [yes | no ]` | 指定增量备份。 |\n\
  | `/HC: [on | off]` | 使用硬件压缩。 |\n| `/SNAP: [on | off]` | 指定影**副本。 |\n\n### Ntprompt\n\
  \n运行 `CMD` 而不是 `prompt`。\n\n#### 语法\n\n```\nNtprompt\n```\n\n## Path\n\n建立搜索路径。\n\
  \n#### 语法\n\n```\npath\n```\n\n#### 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `None` |\
  \ 显示当前路径。 |\n| `path[:]` | 设置搜索路径。 |\n\n### Pathping\n\n结合了 `ping` 和 `tracert` 命令功能的命令。\n\
  \n#### 语法\n\n```\npathping [-n] [-h hops] [-q [-p count]] computer-to-find\n```\n\
  \n### Pause\n\n暂停脚本的处理并提示用户按任意键继续。\n\n#### 语法\n\n```\npause\n```\n\n### Pentnt\n\
  \n显示 `pentnt` 命令的帮助。\n\n#### 语法\n\n```\npentnt\n```\n\n### Pbadmin\n\n管理电话簿。\n\n\
  #### 语法\n\n```\nNtbackup backup [systemstate] \"@filename\" /J [\"jobname\"] [/P\
  \ [\"poolname\"]]\n  [/G [\"guidname\"]] [/T [\"tapename\"] [/N {\"medianame\"]]\
  \ [/F [\"filename\"]]\n  [/D [\"description\"] [/DS [\"server\"]] [/IS [\"server\"\
  ]]\n  [/A] [/V: {yes | no]] [/R: [yes | no]] [/L: [f | s | n]]\n  [/M backuptype]]\
  \ [/RS: [yes | no ]] [/HC: [on | off]] [/SNAP: [on | off]]\n```\n\n\n\n\n\n查找奔腾芯片中的浮点除法错误，如果找到则禁用浮点硬件并启用浮点仿真。\n\
  \n## 语法\n\n```\n pentnt [-c] [-f] [-o]\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | ---\
  \ |\n| `[-c]` | 开启条件仿真。 |\n| `[-f]` | 开启强制仿真。 |\n| `[-o]` | 关闭强制仿真并启用浮点硬件。 |\n\n\
  ## Perfmon\n\n使用与 Windows NT 4.0 监视器程序相同的设置打开性能控制台。\n\n## 语法\n\n```\n Perfmon.exe\
  \ [filename] [/HTMLFILE:settingsfile]\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | ---\
  \ |\n| `[filename]` | 指定可选设置文件的文件名。 |\n| `[/HTMLFILE:settingsfile]` | 指定转换后的文件名称以及\
  \ Windows NT 4 设置文件的名称。 |\n\n## Ping\n\n测试 TCP/IP 网络上网络设备的连接。\n\n## 语法\n\n```\n\
  \ ping [-t] [-a] [-n count] [-l length] [-f] [-i ttl] [-v tos] [-r count]\n[-s count]\
  \ [[-j computer-list] | [-k computer-list]] [-w timeout]\n destination-list\n```\n\
  \n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[-t]` | 持续 ping 指定的计算机。 |\n| `[-a]` |\
  \ 将 IP 地址解析为计算机名。 |\n| `[-n count]` | 发送 `count` 指定数量的 `ECHO` 数据包。 |\n| `[-l length]`\
  \ | 传输指定 `length` 的 `ECHO` 数据包。 |\n| `[-f]` | 防止数据包被网关分片。 |\n| `[-i ttl]` | 将 `TTL`\
  \ 字段设置为指定的 `ttl` 值。 |\n| `[-v tos]` | 将 `TOS` 字段设置为指定的 `tos` 值。 |\n| `[-r count]`\
  \ | 在路由记录字段中存储发送数据包和返回数据包经过的路径。 |\n| `[-s count]` | 为 `count` 指定跳数设置时间戳。 |\n| `[-j\
  \ computer-list]` | 通过 `computer-list` 指定的计算机列表路由数据包，并允许连续的计算机被中间网关分隔。 |\n| `[-k\
  \ computer-list]` | 通过 `computer-list` 指定的计算机列表路由数据包，并防止连续的计算机被中间网关分隔。 |\n| `[-w\
  \ timeout]` | 指定超时间隔（毫秒）。 |\n| `destination-list` | 指定目标计算机列表。 |\n\n## Popd\n\n\
  切换到由 `pushd` 的目录。\n\n## 语法\n\n```\n popd\n```\n\n## Print\n\n显示打印队列的内容或打印文本文件。\n\
  \n## 语法\n\n```\n print [/d:device] [[drive:][path] filename[ ...]]\n```\n\n## 参数\n\
  \n| 参数 | 目的 |\n| --- | --- |\n| `None` | 显示打印队列内容。 |\n| `[/d:device]` | 指定打印设备。可以使用\
  \ `LPT1`、`LPT2` 和 `LPT3` 或 `\\\\servername\\print_share`。 |\n| `[drive:][path] filename`\
  \ | 指定要打印文件的驱动器、路径和文件名。 |\n\n## Prompt\n\n更改命令提示符。\n\n## 语法\n\n```\n prompt [text]\n\
  ```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `none` | 将命令提示符重置为默认设置。 |\n| `[text]`\
  \ | 指定作为命令提示符显示的文本。除了文本，你还可以包含以下内容： |\n| `$q` | 等号 |\n| `$$` | 美元符号 |\n| `$t` |\
  \ 时间 |\n| `$d` | 日期 |\n| `$p` | 驱动器和路径 |\n| `$v` | Windows 版本号 |\n| `$n` | 驱动器 |\n\
  | `$g` | 大于符号 |\n| `$l` | 小于符号 |\n| `$b` | 管道 |\n| `$_` | 回车换行符 |\n| `$e` | ANSI\
  \ 转义代码（代码 27） |\n| `$h` | 退格符 |\n| `$a &` | 和符号 |\n| `$c` | 左括号 |\n| `$f` | 右括号\
  \ |\n| `$s` | 空格 |\n| `$+` | 取决于 `pushd` 目录栈的深度，零个或多个加号 (+) 字符 |\n| `$m` | 与当前驱动器相关的远程名称\
  \ |\n\n## Pushd\n\n记录当前目录名称供 `popd` 命令使用，然后切换到指定的目录。\n\n## 语法\n\n```\n pushd [path]\n\
  ```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[path]` | 指定设置为当前目录的目录。 |\n\n## Rasdial\n\
  \n自动化 RAS (*远程访问服务*)客户端连接过程。\n\n## 语法\n\n```\n rasdial connection\n```\n\n## 参数\n\
  \n| 参数 | 目的 |\n| --- | --- |\n| `connection` | 指定连接名称。 |\n| `password` | 指定连接的密码。\
  \ |\n| `username` | 指定连接的用户名。 |\n| `disconnect` | 断开连接。 |\n| `persistent` | 在用户注销后保持连接活动。\
  \ |\n\n## Rcp\n\n在计算机之间复制文件。\n\n## 语法\n\n```\n rcp [-a] [-b] [-h] [-r] source [/destination]\
  \ \n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[-a]` | 指定使用 ASCII 模式。 |\n| `[-b]`\
  \ | 指定使用二进制模式。 |\n| `[-h]` | 指定使用隐藏属性。 |\n| `[-r]` | 复制子目录的内容。 |\n| `source` | 指定源计算机。\
  \ |\n| `destination` | 指定目标计算机。 |\n\n## Recover\n\n尝试从损坏的磁盘恢复信息。\n\n## 语法\n\n```\n\
  \ recover [drive:][path] filename\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n\
  | `[drive:][path] filename` | 指定要恢复的文件驱动器、路径和文件名。 |\n\n## Reg add\n\n显示、更改或添加注册表子项和值。\n\
  \n## 语法\n\n```\n reg add keyname [/v entry] [/ve] [/t type] [/s separator] [/d value]\
  \ [/f]\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `keyname` | 指定子项的路径。 |\n|\
  \ `[/v entry]` | 指定要添加的项名称。 |\n| `[/ve]` | 将项作为空值添加。 |\n| `[/t type]` | 设置项类型（REG_SZ,\
  \ REG_MULTI-SZ, REG_DWORD_BIG_ENDIAN, REG_DWORD, REG_BINARY, REG_DWORD_LITTLE_ENDIAN,\
  \ REG_LINK, REG_FULL_RESOURCE_DESCRIPTOR AND REG_EXPAND_SZ）。 |\n| `[/s separator]`\
  \ | 使用 REG_MULTI-SZ 类型时，此参数指定用于识别多个部分的分隔符。 |\n| `[/d value]` | 为新注册表项指定值。 |\n| `[/f]`\
  \ | 在不需要确认的情况下添加子项或项。 |\n\n## Reg compare\n\n比较两个注册表项或子项。\n\n## 语法\n\n```\n reg\
  \ compare key1 key2 [/v entry] [/ve] [[/oa] | [od] | [/os] | [/on]] [/s]\n```\n\n\
  ## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `key1` | 指定第一个项或子项的路径和名称。 |\n| `key2` | 指定第二个项或子项的路径和名称。\
  \ |\n| `[/v entry]` | 比较特定的子项项。 |\n| `[/ve]` | 将比较限制为没有值的项。 |\n| `[/oa]` | 显示所有差异和匹配项。\
  \ |\n| `[od]` | 仅显示差异。 |\n| `[/os]` | 仅显示匹配项。 |\n| `[/on]` | 仅显示新项。 |\n| `[/s]`\
  \ | 指定要比较的字符串。 |\n\n\n\n\n\n| `[/os]` | 仅显示匹配项。 |\n| `[/on]` | 防止显示差异或匹配项。 |\n|\
  \ `[/s]` | 对所有项和子项进行比较。 |\n\n### Reg copy\n\n复制注册表项。\n\n**语法**\n\n```\n reg copy\
  \ key1 key2 [/s] [/f]\n```\n\n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n\
  | `key1` | 指定第一个项或子项的路径和名称。 |\n| `key2` | 指定第二个项或子项的路径和名称。 |\n| `[/s]` | 复制所有项和子项。\
  \ |\n| `[/f]` | 无需确认复制子项。 |\n\n### Reg delete\n\n删除注册表项和子项。\n\n**语法**\n\n```\n reg\
  \ delete key [/v entry | /ve | /va] [/f]\n```\n\n**参数**\n\n| Parameter | Purpose\
  \ |\n| --- | --- |\n| `key` | 指定项或子项的路径和名称。 |\n| `[/v entry]` | 删除特定的项。 |\n| `[/ve]`\
  \ | 仅删除空值的项。（(*继续*)） |\n| `[/va]` | 删除子项上的所有项。 |\n| `[/f]` | 无需确认执行删除。 |\n\n###\
  \ Reg export\n\n将子项、项和值复制到外部文件，以便将其传输到另一台计算机。\n\n**语法**\n\n```\n reg export key\
  \ filename\n```\n\n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `key` | 指定子项的路径和名称。\
  \ |\n| `filename` | 指定外部文件的名称。 |\n\n### Reg import\n\n将外部文件中的子项、值和项复制到注册表中。\n\n\
  **语法**\n\n```\n reg import filename\n```\n\n**参数**\n\n| Parameter | Purpose |\n\
  | --- | --- |\n| `filename` | 指定外部文件的名称和路径。 |\n\n### Reg load\n\n将保存的项和子项复制到不同的注册表子项。\n\
  \n**语法**\n\n```\n reg load keyname filename\n```\n\n**参数**\n\n| Parameter | Purpose\
  \ |\n| --- | --- |\n| `keyname` | 指定子项的路径。 |\n| `filename` | 指定要加载的文件的名称和路径。 |\n\
  \n### Reg query\n\n显示指定子项的子项和子项。\n\n**语法**\n\n```\n reg query key [/v entry | /ve]\
  \ [/s]\n```\n\n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `key` | 指定子项的路径。\
  \ |\n| `[/v entry]` | 获取指定的项及其值。 |\n| `[/ve]` | 仅返回空值的项。 |\n| `[/s]` | 获取所有层级的所有项和子项。\
  \ |\n\n### Reg restore\n\n恢复保存的注册表子项和项。\n\n**语法**\n\n```\n reg restore key filename\n\
  ```\n\n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `key` | 指定子项的路径。 |\n\
  | `filename` | 指定包含项和子项的文件的名称和路径。 |\n\n### Reg save\n\n将指定的值、项和子项保存到文件中。\n\n**语法**\n\
  \n```\n reg save key filename\n```\n\n**参数**\n\n| Parameter | Purpose |\n| --- |\
  \ --- |\n| `key` | 指定子项的路径。 |\n| `filename` | 指定将创建的文件名称和路径。 |\n\n### Regsvr32\n\
  \n在注册表中注册 `.dll` 文件。\n\n**语法**\n\n```\n Regsvr32 [/u] [/s] [/n] [/I:cmdline] dllname\n\
  ```\n\n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `[/u]` | 卸销服务器。 |\n|\
  \ `[/s]` | 设置 `regsvr32` 在后台模式运行。 |\n| `[/n]` | 禁止调用 `DllRegister`。 |\n| `[/I:cmdline]`\
  \ | 调用 `DllInstall` 如果存在则提供参数 `cmdline`。 |\n| `dllname` | 指定要注册的 DLL。 |\n\n### Reg\
  \ unload\n\n移除之前使用 `reg load` 命令加载的注册表部分。\n\n**语法**\n\n```\n reg unload key\n```\n\
  \n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `key` | 指定子项的路径。 |\n\n## Relog\n\
  \n从日志中提取性能计数器并将数据转换为不同的格式，包括文本、逗号分隔文本和 SQL。\n\n**语法**\n\n```\n Relog [filename ...]\
  \ [-a] [-c path [path ...]] [-cf filename] [-f [bin | csv | tsv | SQL]] [-t value]\
  \ [-o outputfile | DSNcouterlog] [-b start_time] [-e stop_time] [-config filename]\
  \ [-q]\n```\n\n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `filename ...`\
  \ | 指定一个或多个输入文件的路径和名称。 |\n| `[-a]` | 追加输入文件的数据。 |\n| `[-c path [path ...]]` | 指定记录的性能计数器路径。\
  \ |\n| `[-cf filename]` | 指定文本文件的路径，该文件包含要添加到 `relog` 文件的计数器列表。 |\n| `[-f [bin |\
  \ csv | tsv | SQL]]` | 设置输出文件格式（`bin` = 二进制，`csv` = 文本，`tsv` = 逗号分隔文本，`sql` = SQL）。\
  \ |\n| `[-t value]` | 指定采集间隔。 |\n| `[-o outputfile | DSNcouterlog]` | 设置输出文件或存储计数器的\
  \ SQL 数据库路径。 |\n| `[-b start_time]` | 设置从输入文件中复制第一个记录的开始时间。 |\n| `[-e stop_time]`\
  \ | 设置从输入文件中复制最后一条记录的停止时间。 |\n| `[-config filename]` | 设置提供命令行参数的可选设置文件路径。 |\n|\
  \ `[-q]` | 显示指定输入文件的性能计数器时间范围。 |\n\n### Rem\n\n用于在脚本中放置注释。\n\n**语法**\n\n```\n rem\
  \ [comment]\n```\n\n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `[comment]`\
  \ | 一段描述性文本信息字符串。 |\n\n## Rename (Ren)\n\n重命名文件或一组文件。\n\n**语法**\n\n```\n rename\
  \ [drive:][path] filename1 filename2\nren [drive:][path] filename1 filename2\n```\n\
  \n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `[drive:][path]] filename1`\
  \ | 指定要重命名文件的驱动器、路径和文件名。 |\n| `filename2` | 指定文件的新名称。 |\n\n### Replace\n\n用与目标目录中同名的文件替换其中的文件。\n\
  \n**语法**\n\n```\n replace [drive1:][path1] filename [drive2:][path2] [/a] [/p] [/r]\
  \ [/w]\nreplace [drive1:][path1] filename [drive2:][path2] [/p] [/r] [/s] [/w] [/u]\n\
  ```\n\n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `[drive1:][path1]] filename`\
  \ | 指定源文件的驱动器、路径和文件名。 |\n| `[drive2:][path2]]` | 指定目标文件的驱动器和路径。 |\n| `[/a]` | 将文件添加到目标文件夹。\
  \ |\n| `[/p]` | 在允许替换之前提示确认。 |\n| `[/r]` | 允许替换只读文件。 |\n| `[/w]` | 在开始查找源文件之前等待插入磁盘。\
  \ |\n| `[/s]` | 搜索目标文件夹中的所有子文件夹并替换匹配文件。 |\n| `[/u]` | 仅当目标文件夹中的文件旧于源文件夹中的文件时，才替换它们。\
  \ |\n\n### Reset session\n\n重置终端服务器会话。\n\n**语法**\n\n```\n Reset session [sessionname\
  \ | sessionid] [/server:servername] [/v]\n```\n\n**参数**\n\n| Parameter | Purpose\
  \ |\n| --- | --- |\n| `sessionname` | 要重置的会话名称。 |\n| `sessionid` | 要重置的会话 ID。 |\n\
  | `[/server:servername]` | 识别会话所在的终端服务器。 |\n| `[/v]` | 显示详细信息。 |\n\n### Rexec\n\n\
  在支持 Rexec 远程计算机上执行命令。\n\n**语法**\n\n```\n rexec computer [-l username] [-n] command\n\
  ```\n\n**参数**\n\n| Parameter | Purpose |\n| --- | --- |\n| `computer` | 指定远程计算机。\
  \ |\n| `[-l username]` | 指定远程计算机上的用户名。 |\n| `[-n]` | 将 REXEC 的输入重定向到 `NULL`。 |\n\
  | `command` | 指定要执行的命令。 |\n\n## Rmdir (Rd)\n\n\n\n\n\n# 删除文件夹。\n\n## 语法\n\n```\n\
  rmdir [drive:]path [/s] [/q]\nrd [drive:]path [/s] [/q]\n```\n\n## 参数\n\n| 参数 |\
  \ 目的 |\n| --- | --- |\n| `[`drive`:]`path` | 指定要删除文件夹的驱动器和路径。 |\n| `[/s]` | 删除文件夹及其子文件夹和内容。\
  \ |\n| `[/q]` | 在不需要确认的情况下删除文件夹。 |\n\n## Route\n\n配置路由表。\n\n## 语法\n\n```\nroute\
  \ [-f] [-p] [command [destination] [mask subnetmask] [gateway]\n  [metric costmetric]]\
  \ [if interface]]\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[-f]` | 清除路由表中的网关条目。\
  \ |\n| `[-p]` | 使路由在系统重启后依然有效。 |\n| `[command]` | 打印、添加、删除或更改目的地。 |\n| `[destination]`\
  \ | 指定发送命令的计算机。 |\n| `[mask subnetmask]` | 为路由条目指定子网掩码。 |\n| `[gateway]` | 指定网关。\
  \ |\n| `[metric costmetric]` | 分配一个整数代价系数。 |\n| `[if interface]` | 指定接口的索引。 |\n\n\
  ### Rsh\n\n在运行 RSH 服务的远程计算机上执行命令。\n\n## 语法\n\n```\nrsh computer [-l username] [-n]\
  \ command\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `computer` | 指定远程计算机。 |\n\
  | `[-l username]` | 指定在远程计算机上用户名。 |\n| `[-n]` | 将 `Rsh` 的输入重定向到 `NULL`。 |\n| `command`\
  \ | 指定命令。 |\n\n### Runas\n\n允许以与当前用户账户不同的权限执行特定的工具和程序。\n\n## 语法\n\n```\nrunas [/profile\
  \ | /noprofile] [/env] [/netonly] [/smartcard]\n  [/showtrustlevels] [/trustlevel]\
  \ /user:UserAccountName program\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `/profile`\
  \ | 提供用户配置文件的名称。 |\n| `/noprofile` | 防止加载用户配置文件。 |\n| `/env` | 用当前网络环境替换用户的本地环境。\
  \ |\n| `/netonly` | 指定用户信息将仅用于远程访问。 |\n| `[/smartcard]` | 指定由智能卡提供凭据。 |\n| `[/showtrustlevels]`\
  \ | 显示 `/trustlevel` 选项。 |\n| `[/trustlevel]` | 设置运行应用程序的授权级别。 |\n| `/user:UserAccountName`\
  \ | 指定用于执行程序的账户，格式为 `user@domain` 或 `domain\\user`。 |\n| `program` | 指定由特定账户执行的程序或命令。\
  \ |\n\n### Set\n\n显示、更改和删除环境变量。\n\n## 语法\n\n```\nSet [[/a [expression]] [/p [variable=]]\
  \ string]\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `None` | 显示环境设置。 |\n| `[/a\
  \ expression]` | 将 `string` 设置为数值表达式。 |\n| `[/p]` | 将变量值设置为输入行。 |\n| `variable`\
  \ | 标识要设置或修改的变量。 |\n| `string` | 将变量的值设置为 `string`。 |\n\n### Setlocal\n\n在脚本中启动环境变量局部化。\n\
  \n## 语法\n\n```\nSetlocal [enableextension | disableextensions] [enabledelayedexpansion\n\
  \  | disabledelayedexpansion]\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[enableextension]`\
  \ | 启用命令扩展。 |\n| `[disableextensions]` | 禁用命令扩展。 |\n| `[enabledelayedexpansion]`\
  \ | 启用延迟环境变量扩展。 |\n| `[disabledelayedexpansion]` | 禁用延迟环境变量扩展。 |\n\n### Setver\n\
  \n修改 MS-DOS 子系统向执行程序报告的版本号。\n\n## 语法\n\n```\nsetver [drive:path] [filename n.nn]\n\
  setver [drive:path] [filename [/delete [/quiet]]\nsetver [drive:path]\n```\n\n##\
  \ 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `None` | 显示当前版本表。 |\n| `[drive:path]` | 指定\
  \ `SETVER.EXE` 的驱动器和路径。 |\n| `[filename]` | 指定要添加到版本表的程序名。 |\n| `[n.nn]` | 指定向指定的程序文件报告的\
  \ MS-DOS 版本。 |\n| `[/delete]` | 删除指定程序的版本表条目。 |\n| `[/quiet]` | 隐藏删除消息。 |\n\n###\
  \ Sfc\n\n扫描受保护的文件系统并验证其完整性。\n\n## 语法\n\n```\nSfc [/scannow] [/scanonce] [/scanboot]\
  \ [/revert] [purgecache]\n  [/cachesize=x]\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- |\
  \ --- |\n| `[/scannow]` | 对所有受保护的文件系统进行立即扫描。 |\n| `[/scanonce]` | 一次扫描所有受保护的文件系统。\
  \ |\n| `[/scanboot]` | 每次启动计算机时扫描所有受保护的文件系统。 |\n| `[/revert]` | 将扫描恢复默认设置。 |\n|\
  \ `[purgecache]` | 清除 Windows 文件保护缓存并执行立即扫描。 |\n| `[/cachesize=x]` | 为 Windows 文件保护缓存设置最大缓存大小（单位：MB）。\
  \ |\n\n### Shell\n\n指定用于替代 MS-DOS 子系统的替代命令解释器。\n\n## 语法\n\n```\nshell=[[drive:]path]\
  \ filename [parameters]\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[[drive:]path]\
  \ filename` | 指定替代命令解释器的驱动器、路径和名称。 |\n| `[parameters]` | 提供命令解释器所需的任何命令行参数。 |\n\n\
  ### Shift\n\n移动（更改）脚本中参数的位置。\n\n## 语法\n\n```\nShift /n\n```\n\n## 参数\n\n| 参数 | 目的\
  \ |\n| --- | --- |\n| `/n` | 标识开始移动的参数，`n` 是 0 到 8 之间的值。 |\n\n### Shutdown\n\n关闭\
  \ Windows，可选重启计算机或注销用户。\n\n## 语法\n\n```\nshutdown [[-l | -s | -r | -a]] [-f] --m[\\\
  \\computer]] [-t xx] [-c \"msg\"]\n  [-d[u][p]:xx:yy]\n```\n\n## 参数\n\n| 参数 | 目的\
  \ |\n| --- | --- |\n| `[-l]` | 注销用户。 |\n| `[-s]` | 关闭 Windows。 |\n| `[-r]` | 重启计算机。\
  \ |\n| `[-a]` | 取消关闭过程。 |\n| `[-f]` | 强制终止活动应用程序。 |\n| `--m[\\\\computer]]` | 允许指定远程计算机。\
  \ |\n| `[-t xx]` | 指定关闭之前等待的时间（秒）。 |\n| `[-c \"msg\"]` | 在系统关闭区域显示消息。 |\n| `[-d[u][p]:xx:yy]`\
  \ | 列出原因代码（`u` = 用户代码，`p` = 计划代码，`xx` = 0 到 255 之间的主要原因代码，`yy` = 0 到 65536 之间的次要原因代码）。\
  \ |\n\n### Sort\n\n读取输入排序后输出。\n\n## 语法\n\n```\nsort [/r] [/+n] [/m kilobytes] [/l\
  \ locale] [/rec characters]\n  [[drive1:][path1]filename1] [/t [drive2:][path2]]\n\
  \  [/o [drive3:][path3]filename3]\n\n[command |] sort [/r] [/+n] [/m kilobytes]\
  \ [/l locale] [/rec characters]\n  [[drive1:][path1]filename1] [/t [drive2:][path2]]\
  \ [/o\n  [drive3:][path3]filename3]\n```\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n\
  | `/r` | 反转排序顺序。 |\n| `/+n` | 指定 `sort` 开始比较的起始字符位置 `n`。 |\n| `/m kilobytes` | 指定\
  \ `sort` 命令使用的内存分配（KB）。 |\n| `/l locale` | 更改按默认区域定义的字符排序顺序。唯一可用选项是 `\"C\"` 区域。\
  \ |\n| `/rec characters` | 设置输入文件中每行允许的最大字符数（默认值为 4096；最大值为 65535）。 |\n| `[`drive1:`][`path1]`filename1`\
  \ | 指定要排序的文件的位置。 |\n\n\n\n\n\n| `/t` [`drive2:`][`path2`]] | 指定文件夹的路径，当待排序的数据无法放入内存时，`sort`\
  \ 命令可以使用其作为工作存储空间。 |\n| `/o` [`drive3:`][`path3`]] | 指定排序后的输入文件的存储位置。`filename3`\
  \ |\n\n### Start\n\n打开一个新的命令提示符窗口并执行指定的程序、脚本或命令。\n\n**语法**\n\n```\n start [\"title\"\
  ] [/d path] [/I] [/min] [/max] [/separate | /shared]\n  [/low | /normal | /high\
  \ | /realtime | /abovenormal | /belownormal]\n  [/wait] [/b] [filename] [parms]\n\
  ```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[\"`title\"]]` | 在命令提示符标题栏中显示指定的标题。\
  \ |\n| `[/d `path`]` | 指定启动文件夹的路径。 |\n| `[/I]` | 将 `CMD.exe` 启动环境的环境传递给命令提示符窗口。\
  \ |\n| `[/min]` | 将新窗口最小化。 |\n| `[/max]` | 将新窗口最大化。 |\n| `[/separate]` | 将 16 位应用程序加载到单独的内存空间。\
  \ |\n| `[/shared]` | 将 16 位应用程序加载到共享内存空间中。 |\n| `[/low]` | 运行程序并分配空闲优先级。 |\n| `[/normal]`\
  \ | 运行程序并为其分配普通优先级。 |\n| `[/high]` | 运行程序并为其分配高优先级。 |\n| `[/realtime]` | 运行程序并为其分配实时优先级。\
  \ |\n| `[/abovenormal]` | 运行程序并为其分配高于正常的优先级。 |\n| `[/belownormal]` | 运行程序并为其分配低于正常的优先级。\
  \ |\n| `[/wait]` | 运行程序并等待其结束。 |\n| `[/b]` | 在不打开命令提示符窗口的情况下启动应用程序。 |\n| `[`filename]`\
  \ | 指定要执行的命令或应用程序。 |\n| `[`parms]` | 传递给命令或程序的参数。 |\n\n### Subst\n\n在路径和驱动器号之间建立关联。\n\
  \n**语法**\n\n```\n subst [drive1: [drive2:]path]\nsubst drive1: /d\n```\n\n**参数**\n\
  \n| 参数 | 目的 |\n| --- | --- |\n| `None` | 显示任何虚拟驱动器的名称。 |\n| `[`drive1:]]` | 指定虚拟驱动器。\
  \ |\n| `[`drive2:]]` | 指定包含指定路径的物理驱动器。 |\n| `[`path]` | 指定分配给虚拟驱动器的路径。 |\n| `/d`\
  \ | 移除虚拟驱动器。 |\n\n### Systeminfo\n\n显示关于计算机及其操作系统和硬件的配置信息。\n\n**语法**\n\n```\n systeminfo[.exe]\
  \ [/s computer [/u domain\\user [/p passwd]]]\n  [/fo [table | list | csv]] [/nh]\n\
  ```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[/s `computer`]` | 指定目标计算机名称或 IP\
  \ 地址。 |\n| `[/u `domain\\user`]` | 使用提供的用户权限执行命令。 |\n| `[/p `passwd`]` | 指定用户的密码。\
  \ |\n| `[/fo [table | list | csv]]` | 指定输出格式（表格、列表或 CSV）。 |\n| `[/nh]` | 抑制列标题。\
  \ |\n\n### Taskkill\n\n终止任务和进程。\n\n**语法**\n\n```\n taskkill [/s computer] [/u domain\\\
  user [/p passwd]] [/fi filter]\n  [/pid processid] | [/im image] [/f] [/t]\n```\n\
  \n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[/s `computer`]` | 指定目标计算机的名称或 IP 地址。\
  \ |\n| `[/u `domain\\user`]` | 使用提供的用户权限执行命令。 |\n| `[/p `passwd`]` | 指定用户的密码。 |\n\
  | `[/fi `filter`]` | 指定要终止或不终止的进程类型。 |\n| `[/pid `processid`]` | 指定要杀死进程的进程 ID。\
  \ |\n| `[/im `image`]` | 指定要杀死进程的映像名称。 |\n| `[/f]` | 强制终止进程。 |\n| `[/t]` | 终止父进程的所有子进程。\
  \ |\n\n### Tasklist\n\n列出应用程序和服务，包括它们的进程 ID。\n\n**语法**\n\n```\n Tasklist[.exe] [/s\
  \ computer] [/u domain\\user [/p passwd]]\n  [/fo [table | list | csv]] [/nh] [/fi\
  \ filter] [/fi filter2 [ ... ]]]\n  [/m [module] | /svc] /v]\n```\n\n**参数**\n\n\
  | 参数 | 目的 |\n| --- | --- |\n| `[/s `computer`]` | 指定目标计算机的名称或 IP 地址。 |\n| `[/u `domain\\\
  user`]` | 使用提供的用户权限执行命令。 |\n| `[/p `passwd`]` | 指定用户的密码。 |\n| `[/fo [table | list\
  \ | csv]]` | 指定命令输出的格式。 |\n| `[/nh]` | 抑制列标题。 |\n| `[/fi filter]` | 指定从输出中包含或排除的进程类型。\
  \ |\n| `[/m [module]` | 指定时，列出所有使用该模块的进程，否则将其排除。 |\n| `[/svc]` | 显示所有可用服务信息。 |\n\
  | `[/v]` | 显示详细输出。 |\n\n## Tcmsetup\n\n配置电话客户端。\n\n**语法**\n\n```\n tcmsetup [/q]\
  \ [/x] /c server1 [server2 ... serverN]\ntcmsetup [/q] /c /d\n```\n\n**参数**\n\n\
  | 参数 | 目的 |\n| --- | --- |\n| `[/q]` | 防止显示消息。 |\n| `[/x]` | 设置为高流量。 |\n| `/c` |\
  \ 必需参数。 |\n| `server1 [server2 ... serverN]` | 列出额外的服务器。 |\n| `/d` | 清除服务器列表。 |\n\
  \n## Tftp\n\n在本地和远程计算机之间传输文件（*简单文件传输协议*）。\n\n**语法**\n\n```\n tftp [-i] computer\
  \ [get | put] source [destination]\n```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n\
  | `[-i]` | 设置二进制模式。 |\n| `computer` | 指定远程计算机。 |\n| `[get | put]` | 上传或下载。 |\n|\
  \ `source` | 识别文件。 |\n| `[destination]` | 指定传输的位置。 |\n\n## Time\n\n显示系统时间或更改计算机内部时钟。\n\
  \n**语法**\n\n```\n time [/t] [hours[:seconds[:hundredths]]] [A|P]]\n```\n\n**参数**\n\
  \n| 参数 | 目的 |\n| --- | --- |\n| `None` | 显示当前时间并提示输入新时间。 |\n| `[/t]` | 显示时间而不提示更改时间。\
  \ |\n| `[hours]` | 设置小时。 |\n| `[minutes]` | 设置分钟。 |\n| `[seconds]` | 设置秒。 |\n| `[hundredths]`\
  \ | 设置百分秒。 |\n| `[A|P]` | 为 12 小时制设置 A.M 或 P.M.。 |\n\n## Title\n\n在命令控制台标题栏上放置消息。\n\
  \n**语法**\n\n```\n title [string]\n```\n\n**参数**\n\n| 参数 | 目的 |\n| --- | --- |\n\
  | `[string]` | 指定消息文本。 |\n\n## Tracerpt\n\n处理来自跟踪提供程序的日志或数据并创建报告。\n\n**语法**\n\n\
  ```\n tracerpt [filename [filename ...]] [-o [filename]] [-report [filename]]\n\
  \  [-rt session [session ...]] [-summary [filename]] [-config [filename]\n```\n\n\
  **参数**\n\n| 参数 | 目的 |\n| --- | --- |\n| `[filename [filename ...]]` | 指定跟踪会话期间使用的文件名。\
  \ |\n| `[-o [filename]]` | 指定逗号分隔文件。 |\n| `[-report [filename]]` | 设置输出报告文件的名称。\
  \ |\n| `[-rt session [session ...]]` | 从实时源收集数据。 |\n| `[-summary [filename]]` |\
  \ 指定输出摘要文件的名称。 |\n| `[-config [filename]` | 指定命令行参数的设置文件的路径。 |\n\n## Tracert\n\n\
  确定通往目的地路由的工具。\n\n**语法**\n\n```\n tracert [-d] [-h maximum_hops] [-j computer-list]\
  \ [-w timeout] target_name\n```\n\n\n\n\n\n## 参数\n\n| 参数 | 目的 |\n| --- | --- |\n\
  | `[-d]` | 防止将 IP 地址解析为主机名。 |\n| `[-h maximum_hops]` | 设置最大跳数。 |\n| `[-j computer-list]`\
  \ | 指定沿 `computer-list` 的松散源路由。 |\n| `[-w timeout]` | 为每个响应等待指定的毫秒数。 |\n| `[target_name]`\
  \ | 识别目标计算机。 |\n\n### Tree\n\n提供指定路径或磁盘文件夹结构的图形视图。\n\n### 语法\n\n```\n tree [drive:][path]\
  \ [/f] [/a]\n```\n\n### 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[drive:]` | 识别包含要显示目录结构的磁盘驱动器。\
  \ |\n| `[path]` | 识别要显示目录结构的文件夹。 |\n| `[/f]` | 显示每个目录中找到的文件名。 |\n| `[/a]` | 设置 `tree`\
  \ 命令在识别指向子文件夹链接时使用文本字符代替图形字符。 |\n\n### Type\n\n显示文本文件的内容。\n\n### 语法\n\n```\n type\
  \ [drive:][path] filename\n```\n\n### 参数\n\n| 参数 | 目的 |\n| --- | --- |\n| `[drive:][path]\
  \ filename` | 指定要查看的驱动器、路径和文件名。 |\n\n### Typeperf\n\n将性能计数器输出显示到控制窗口或记录到文件中。\n\n\
  ### 语法\n\n```\n typeperf [path [path ...]] [-cf filename] [-f [csv | tsv | bin]]\n\
  \  [-si interval] [-o filename] [-q [object]] [-qx [object]]\n  [-sc samples] [-config\
  \ filename] [-s computer]\n```\n\n### 参数 | 目的 |\n| --- | --- |\n| `[path [path ...]]`\
  \ | 指定要使用的性能计数器日志的路径和名称。 |\n| `[-cf filename]` | 指定列出要监控计数器路径的文件名。 |\n| `[-f [csv\
  \ | tsv | bin]]` | 指定输出格式（`csv` = 号分隔文本文件，`tsv` = 制表符分隔文本文件，`bin` = 二进制）。 |\n| `[-si\
  \ interval]` | 以 `[mm:]ss` 格式设置集合之间的时间间隔。 |\n| `[-o filename]` | 指定输出文件。 |\n| `[-q\
  \ [object]]` | 显示没有实例的计数器。 |\n| `[-qx [object]]` | 显示带有实例的计数器。 |\n\n### 参数 | 目的\
  \ |\n| --- | --- |\n| `[-sc samples]` | 指定要收集的样本数。 |\n| `[-config filename]` | 指定包含命令行参数的文件名。\
  \ |\n| `[-s computer]` | 指定目标计算机。 |\n\n### Unlodctr\n\n从注册表中卸载服务和设备驱动程序的性能计数器名称。\n\
  \n### 语法\n\n```\n unlodctr [\\\\computer] drivername\n```\n\n### 参数 | 目的 |\n| ---\
  \ | --- |\n| `[\\\\computer]` | 指定目标计算机。 |\n| `drivername` | 卸载服务和设备驱动程序 `drivername`\
  \ 的性能计数器名称。 |\n\n### Ver\n\n显示 Windows 版本号。\n\n### 语法\n\n```\n ver\n```\n\n### Vol\n\
  \n显示磁盘的序列号和磁盘卷标签。\n\n### 语法\n\n```\n vol [drive:]\n```\n\n### 参数 | 目的 |\n| --- |\
  \ --- |\n| `[drive:]` | 指定您想要显示的驱动器信息。 |\n\n### Vssadmin\n\n显示卷影拷贝备份和阴影拷贝写入器。\n\n\
  ### 语法\n\n```\n vssadmin list [shadows [/set= [shadow copy of GUID]] | writers |\
  \ provides]\n```\n\n### 参数 | 目的 |\n| --- | --- |\n| `List [shadows [/set= [shadow\
  \ copy of GUID]]]` | 显示阴影拷贝集的阴影拷贝。 |\n| `[writers]` | 显示已安装的阴影拷贝写入器的信息。 |\n| `[provides]`\
  \ | 显示已安装的阴影拷贝提供者信息。 |\n\n### W32tm\n\n诊断 Windows 时间问题。\n\n### 语法\n\n```\n W32tm\
  \ [/config [/computer] [[/update] [/manualpeerlist:list fo names]]\n  [/syncfromflags:listofflags]]\
  \ | /monitor | /ntpte | /register | resync\n  [[:computer] [/nowait] | [/rediscover]]\
  \ | [/tz | /unregister]\n```\n\n### 参数 | 目的 |\n| --- | --- |\n| `[/config [/computer]\
  \ [[/update] [/manualpeerlist:list fo names]] [/syncfromflags:listofflags]` | 更改目标计算机的时间设置。\
  \ |\n\n### 参数 | 目的 |\n| --- | --- |\n| `/monitor` | 监控目标计算机。 |\n| `/ntpte` | 将系统时间转换为可读格式。\
  \ |\n| `/register` | 将执行注册为服务。 |\n| `resync [[:computer] [/nowait] | [/rediscover]]`\
  \ | 在第一个可用机会重新同步时。 |\n| `[/tz]` | 显示时区信息。 |\n| `[/unregister]` | 取消注册的服务和任何配置日期。\
  \ |\n\n### Xcopy\n\n复制文件夹及其内容，包括文件和子文件夹。\n\n### 语法\n\n```\n xcopy source [destination]\
  \ [/w] [/p] [/c] [/v] [/q] [/f] [/l] [/d[:date]]\n  [/u] [/i] [/s [/e]] [/t] [/k]\
  \ [/r] [/h] [/a|/m] [/n] [/o] [/x]\n  [/exclude:file1[+[file2]][+[file3]] [/y |\
  \ /-y] [/z]\n```\n\n### 参数 | 目的 |\n| --- | --- |\n| `source` | 指定文件的位置。 |\n| `destination`\
  \ | 指定目标。 |\n| `[/w]` | 显示确认并等待回复。 |\n| `[/p]` | 在创建目标文件之前提示确认。 |\n| `[/c]` | 忽略所有错误。\
  \ |\n| `[/v]` | 验证每次复制操作的成功与。 |\n| `[/q]` | 防止显示 `xcopy` 消息。 |\n| `[/f]` | 显示正在复制的文件名。\
  \ |\n| `[/l]` | 防止执行命令并显示将复制的文件列表。 |\n| `/d[:date]` | 复制在 `date` 或或之后更改的源文件。 |\n\
  | `[/u]` | 如果文件也存在于 `destination`，则从中复制。 |\n| `[/i]` | 如果 `source` 是目录或包含通配符，且目标不存在，则创建文件夹。\
  \ |\n| `[/s]` | 只要包含文件，就复制目录和子目录。 |\n| `[/e]` | 复制所有子目录。 |\n| `[/t]` | 复制子目录结构而不复制文件。\
  \ |\n| `[/k]` | 将只读文件复制到目标，并在目标处保留只读状态。 |\n| `[/r]` | 覆盖只读文件。 |\n| `[/h]` | 复制具有隐藏和系统文件属性的文件。\
  \ |\n| `[/a]` | 复制设置了归档属性的源文件。 |\n| `[/m]` | 复制设置了归档属性的源文件，然后关闭归档属性。 |\n| `[/o]`\
  \ | 复制所有权和控制列表数据。 |\n| `[/x]` | 复制审计设置和系统访问控制列表数据。 |\n| `[/n]` | 使用 NTFS 短名称复制文件。\
  \ |\n| `[/exclude:file1[+[file2]][+[file3]]]` | 排除指定文件中列出的文件。 |\n| `[/y]` | 在覆盖现有目标文件时不显示提示。\
  \ |\n| `/-y]` | 在覆盖现有目标文件时需要提示。 |\n| `[/z]` | 以可恢复的模式向网络复制文件，以便在连接重新建立后恢复复制操作。 |\n\
