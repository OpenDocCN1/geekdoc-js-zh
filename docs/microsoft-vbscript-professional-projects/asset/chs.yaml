  \ = \"SummaryOnly\" Then\n      OutPutFile.WriteLine \"Sales summary:\"\n      OutPutFile.WriteBlankLines(1)\n\
  \      OutPutFile.WriteLine \"Part # Qty Description\"\n      OutPutFile.WriteBlankLines(1)\n\
  \    End If\n\n    For Each intArrayCounter In astrReportArray\n      OutPutFile.WriteLine\
  \ intArrayCounter\n    Next\n\n    OutPutFile.Close()\n\n    If strDebug = \"True\"\
