  \ |\n| `Size` | 获取构成文件或文件夹的字节 |\n| `SubFolders` | 获取文件夹内的文件夹 |\n| `Type` | 获取文件或文件夹的类型\
  \ |\n| `VolumeName` | 获取或修改卷器名称 |\n\n## 属于 VBScript 运行时对象的方法\n\nVBScript 的运行时方法提供了访问文件系统、创建、修改和删除文件文件夹的能力。表\
