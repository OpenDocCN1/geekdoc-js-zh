  \ HTML 表单从访问者那里收集数据。你还学习了如何处理各种表单元素，以及如何使用 VBScript 验证内容。一旦收集了有效数据，就可以使用 cookie\
  \ 将保存以便以后参考。通过构建一个包含过期日期的字符串并存储在访问者的计算机上来实现。\n\n# 第 30 章：将报告转换为 HTML 页面\n\n在本章中，Alexander\
  \ 将为订单/库存报告 Web 项目开发第一个 VBScript。该脚本的目的是根据每日汇总报告的内容创建一个 HTML 页面。他将通过打开文本版本的报告文件、读取它并使用其内容创建一个嵌入\
  \ HTML 标签的输出文件来完成此任务。输出文件将被保存为 HTML 文件。\n\n## 准备创建 HTML 脚本\n\n创建汇总报告的 HTML 版本不会使用任何新的\
  \ VBScript 或 WSH 函数或方法。它将使用你在其他章节中看到的 `FileSystem Object` 输入输出方法。主要的区别是本章创建的输出文件将包含创建网页所需的嵌入\
  \ HTML 标签。因此，你将大量使用 `FileSystemObject` 对象的 `WriteLine()` 方法，如下：\n\n```\n Dim FsoObj\n\
  Set FsoObj = CreateObject(\"Scripting.FileSystemObject\")\nSet strReportFile = FsoObj.OpenTextFile(\"\
  D:\\Temp\\Test.HTML\", 2, \"True\")\nstrReportFile.WriteLine(\"<HTML>\")\nstrReportFile.WriteLine(\"\
  \  <HEAD>\")\nstrReportFile.WriteLine(\"    <TITLE>Test HTML Page</TITLE>\")\nstrReportFile.WriteLine(\"\
  \  </HEAD>\")\nstrReportFile.WriteLine(\"  <BODY>\")\nstrReportFile.WriteLine(\"\
  \  </BODY>\")\nstrReportFile.WriteLine(\"</HTML>\")\nstrReportFile.Close()\n```\n\
  \n执行时，该示例将创建一个名为 `Test.html` 的 HTML 文件，其内容如下：\n\n```\n <HTML>\n  <HEAD>\n    <TITLE>Test\
  \ HTML Page</TITLE>\n  </HEAD>\n  <BODY>\n  </BODY>\n</HTML>\n```\n\n为了创建汇总报告的 HTML\
  \ 版本，VBScript 必须大量使用解析函数来识别和提取单个报告元素。在之前的章节中，这是通过使用 VBScript 实现的。然而，正如你所看到的，此脚本更复杂的解析需求还需要使用\
  \ `RegExp` 对象及其属性。\n\n\n\n\n\n| | 注意 | `RegExp` 对象及其属性已在第 7 章中的“VBScript 对象”中介绍并演示。\
  \ |\n\n本章脚本使用的最后一个脚本元素是 VBScript 的 `Ubound()` 对象。该函数检索指定数组的上界元素，并将与 `RegExp` 对象配合使用，用于处理当日汇总报告的部分内容。\n\
  \n| | 注意 | VBScript `Ubound()` 函数之前在第 5 章中的“数组”中介绍过。 |\n\n## 创建 HTML 转换脚本\n\nAlexander\
  \ 计划提供 Molly 在其上一个项目中 VBScript 中提供的所有基本功能特性，包括对 Windows 注册表的支持、调试模式和事件日志。接下来的章节详细说明了\
  \ HTML 转换脚本的组件，并提供了它们设计和目的的概述。\n\n### 初始化部分\n\n脚本所示的“初始化部分”（Initialization Section）从要求严格变量解释开始。接下来，它定义了脚本全局使用的所有变量。它还定义了表示\
  \ `WshShell` 和 `FileSystemObject` 对象的变量，以及一个名为 `astrErrors` 的数组，该数组将用于存储报告每一行的内容。接着定义了一个常量集合。最后，将名为\
  \ `intReturnCode` 的变量设置为 0。该变量代表脚本将传回给执行它的脚本（调度脚本）的返回码值。在“初始化部分”中将变量设置为 0，可以确保除非在脚本执行期间显式更改了变量的值，否则将返回零返回码。\n\
  \n```\n Option Explicit\n\nDim intReturnCode, strOutputFile, strReportFile, strSourceLine\n\
  Dim strSourceFile, strConsolTxtRpt, i, strFileNameString\nDim strEventLog, strDebug\n\
  Dim WshShl, FsoObj\nDim astrErrors\n\nSet WshShl = WScript.CreateObject(\"WScript.Shell\"\
  )\nSet FsoObj = CreateObject(\"Scripting.FileSystemObject\")\n\nConst cForReading\
  \ = 1\nConst cForWriting = 2\nConst cForAppending = 8\nConst cTitleBarMsg = \"HTML\
  \ Report Conversion Script\"\n\nintReturnCode = 0\n```\n\n### 主处理部分\n\n与书中介绍的其他脚本不同，此\
  \ VBScript 的“主处理部分”（Main Processing Section）非常复杂。它由过程调用、循环和条件测试组合，控制汇总报告文本版本的处理以及新\
  \ HTML 创建。\n\n“主处理部分”首先调用 `GetRegistrySettings()` 子程序，该程序从 Windows 注册表中检索脚本的配置设置，随后调用\
  \ `AssembleFileNames(` 子程序，该程序构建两个代表当日报告名称的字符串。\n\n```\n GetRegistrySettings()\n\
  AssembleFileNames()\n```\n\n接下来，读取模式打开当前的汇总报告文件并创建一个 HTML 文件，如下所示\n\n```\n Set strSourceFile\
  \ = FsoObj.OpenTextFile(strConsolTxtRpt, cForReading)\nSet strReportFile = FsoObj.OpenTextFile(strOutputFile,\
  \ cForWriting , \"True\")\n```\n\n下一组语句如果为脚本启用了事件日志，将向 Windows 应用程序事件日志写入消息。\n\n\
  ```\n If strEventLog = \"Enabled\" Then\n  WriteToEventLog(\"HTML Report Conversion\
  \ Script now executing.\")\n End If\n```\n\n同样，接下来的几语句只有在脚本以调试模式下手动运行时才会执行。\n\n\
  ```\n If strDebug = \"Enabled\" Then\n  MsgBox \"Beginning report development.\"\
  , , cTitleBarMsg\n End If\n```\n\n接下来的三条语句设置了一个 `For`…Next 循环，跳过由 `strSourceFile`\
  \ 表示的每日汇总报告的标题。\n\n```\n For i = 0 to 8\n  strSourceFile.SkipLine\nNext\n```\n\n\
  接下来的几语句调用子程序，将 HTML 标签集合写入文件。\n\n```\n WriteHeader()\nBeginTableDefinition()\nWriteTableHeader(\"\
  Errors:\")\nWriteErrorsColHeadings()\n```\n\n接下来，使用所示的 `Do`…Until 循环来遍历报告的文本版本，直到找到第一个空行（到达报告中\
  \ `Errors:` 部分的结束）。在循环的每次迭代中，从报告中读取一行并将其赋值给变量 `strSourceLine`。然后检查赋值给 `strSourceLine`\
  \ 的字符串长度以判断是否为零（空）。如果是，则终止循环；否则，使用 `Split()` 函数将字符串内容加载到数组中并调用 `WriteErrorsData()`\
  \ 子程序。该子程序使用数组的内容向 HTML 页面写入一行数据。\n\n```\n Do Until strSourceFile.AtEndOfStream\n\
  \  strSourceLine = strSourceFile.ReadLine()\n  If Len(strSourceLine) = 0 Then\n\
  \    Exit Do\n  Else\n    astrErrors = Split(strSourceLine, \" \", 5)\n    WriteErrorsData()\n\
  \  End If\nLoop\n```\n\n| | 注意 | 注意在一组语句中使用了 `Split()` 函数。它指定了一个值为 `5` 的第三个参数。该参数限制了由\
  \ `Split()` 函数创建的数组大小为五个元素。如果你将此语句与此脚本创建的 HTML 页面上的输出进行比较，你会发现它与报告中显示的五列数据匹配，其中第五列显示代表报告行中第五个单词之后所有剩余数据的字符串（即描述）。\
  \ |\n\n接下来，调用 `EndTableDefinition()` 子程序。该子程序写入一个标记 `Errors:` 表格结束的 HTML 标签（`</Table>`）。\n\
  \n```\n EndTableDefinition()\n```\n\n“主处理部分”中的其余语句通过重复你目前为止看到的一系列基本步骤来写入 HTML 文件的其余部分，并根据需要进行调整以指定适当的章节结束标记并打印正确的报告标题。\n\
  \n\n\n\n\n```\n BeginTableDefinition()\n\nWriteTableHeader(\"Sales Summary:\")\n\
  WriteTableSubHeader(\"Government:\")\nWriteSalesAndReturnsColHeadings()\n\nFor i\
  \ = 0 to 7\n   strSourceFile.SkipLine\nNext\n\nDo Until strSourceFile.AtEndOfStream\n\
  \  strSourceLine = strSourceFile.ReadLine()\n  If Len(strSourceLine) <> 0 Then\n\
  \    If Instr(1, strSourceLine, \"Other Customers:\") Then\n      Exit Do\n    End\
  \ If\n    astrErrors = Split(strSourceLine, \" \", 3)\n    WriteSalesAndReturnsData()\n\
  \  End If\nLoop\n\nWriteTableSubHeader(\"Other Customers:\")\nWriteSalesAndReturnsColHeadings()\n\
  \nFor i = 0 to 2\n   strSourceFile.SkipLine\nNext\n\nDo Until strSourceFile.AtEndOfStream\n\
  \  strSourceLine = strSourceFile.ReadLine()\n  If Len(strSourceLine) <> 0 Then\n\
  \    If Instr(1, strSourceLine, \"----------\") Then\n      Exit Do\n    End If\n\
  \    astrErrors = Split(strSourceLine, \" \", 3)\n    WriteSalesAndReturnsData()\n\
  \  End If\nLoop\n\nEndTableDefinition()\n\nBeginTableDefinition()\n\nWriteTableHeader(\"\
  Returns Summary:\")\nWriteTableSubHeader(\"Government:\")\nWriteSalesAndReturnsColHeadings()\n\
  \nFor i = 0 to 6\n   strSourceFile.SkipLine\nNext\n\nDo Until strSourceFile.AtEndOfStream\n\
  \  strSourceLine = strSourceFile.ReadLine()\n  If Len(strSourceLine) <> 0 Then\n\
  \    If Instr(1, strSourceLine, \"Other Customers:\") Then\n      Exit Do\n    End\
  \ If\n    astrErrors = Split(strSourceLine, \" \", 3)\n    WriteSalesAndReturnsData()\n\
  \  End If\nLoop\n\nWriteTableSubHeader(\"Other Customers:\")\nWriteSalesAndReturnsColHeadings()\n\
  \nFor i = 0 to 2\n   strSourceFile.SkipLine\nNext\n\nDo Until strSourceFile.AtEndOfStream\n\
  \  strSourceLine = strSourceFile.ReadLine()\n  If Len(strSourceLine) <> 0 Then\n\
  \    If Instr(1, strSourceLine, \"----------\") Then\n      Exit Do\n    End If\n\
  \    astrErrors = Split(strSourceLine, \" \", 3)\n    WriteSalesAndReturnsData()\n\
  \  End If\nLoop\n\nEndTableDefinition()\n\nBeginTableDefinition()\n\nWriteTableHeader(\"\
  Daily Production Summary:\")\nWriteProductionColHeadings()\n\nFor i = 0 to 4\n \
  \  strSourceFile.SkipLine\nNext\n```\n\n脚本处理的每日汇总摘要报告的最后一部分是 `Daily Production Summary`（每日生产摘要）部分。与之前一样，该部分中的每一行数据都会被读入\
  \ `strSourceLine`。然而，这里没有使用 `Split()` 函数来解析报告行的内容，而是执行了 `ParseProductionData()`\
  \ 子程序。之所以进行此更改，是因为报告最后这一部分的描述性信息位于每行的中间，且长度不可预测。因此，无法简单地将其拆分为数组并从那里写入 HTML 页面。需要更复杂的解析逻辑。Alexander\
  \ 开发了 `ParseProductionData()` 子程序，使用 `RegExp` 对象及其方法和属性来解析此报告该部分每行中的数据。\n\n```\n\
  \ Do Until strSourceFile.AtEndOfStream\n  strSourceLine = strSourceFile.ReadLine()\n\
  \  ParseProductionData(strSourceLine)\n  WriteProductionData()\nLoop\n\nstrSourceFile.Close()\n\
  \nWriteFooter()\n\nIf strDebug = \"Enabled\" Then\n  MsgBox \"Report development\
  \ completed.\", , cTitleBarMsg\nEnd If\n\nIf strEventLog = \"Enabled\" Then\n  WriteToEventLog\
  \ (\"HTML Report Conversion Script finished executing.\")\nEnd If\n```\n\n`Main\
  \ Processing Section`（主处理部分）中的最后一个语句调用了 `TerminateScript()` 子程序并将存储在 `intReturnCode`\
  \ 中的值传递给它。该函数使用 `WScript` 对象的 `Quit()` 方法终止脚本执行，并向调用脚本传递一个指示此脚本是否错误的返回码。\n\n```\n\
  \ TerminateScript(intReturnCode)\n```\n\n### GetRegistrySettings() 子程序\n\n正如之前所示，下面的\
  \ `GetRegistrySettings()` 子程序负责从存储在 Windows 注册表中的值获取脚本配置设置。如果在获取任何脚本配置设置时发生错误，会将消息发布到\
  \ Windows 应用程序事件日志，并将值 `4`（代表返回码）传递给 `TerminateScript()` 子程序。\n\n```\n Sub GetRegistrySettings()\n\
  \n  On Error Resume Next\n\n  strEventLog = _\n    WshShl.RegRead(\"HKLM\\Software\\\
  Intuit\\VBScripts\\WebRpting\\EventLogging\")\n  If Err <> 0 Then\n    If strEventLog\
  \ = \"Enabled\" Then\n      WriteToEventLog (\"HTML Report Conversion Script - Using\
  \ default \" & _\n        \"for strEventLog. RC = 4\")\n      TerminateScript(4)\n\
  \    End If\n  End If\n\n  strDebug = WshShl.RegRead(\"HKLM\\Software\\Intuit\\\
  VBScripts\\WebRpting\\Debug\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\"\
  \ Then\n      WriteToEventLog (\"HTML Report Conversion Script - Using default \"\
  \ & _\n        \"for strDebug. RC = 4\")\n      TerminateScript(4)\n    End If\n\
  \  End If\n\n  strOutputFile = _\n    WshShl.RegRead(\"HKLM\\Software\\Intuit\\\
  VBScripts\\WebRpting\\HTMLFolder\")\n  If Err <> 0 Then\n    If strEventLog = \"\
  Enabled\" Then\n      WriteToEventLog (\"HTML Report Conversion Script - Using default\
