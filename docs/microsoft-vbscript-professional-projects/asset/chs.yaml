  \ `False` |\n| `IsNumeric` | 根据表达式是否求值为数字返回 `True` 或 `False` |\n| `Join` | 返回通过连接数组内容创建的字符串\
  \ |\n| `Lbound` | 返回指定数组维的最小下标 |\n| `Lcase` | 返回小写字符串 |\n| `Len` | 返回数字或字符串的字符长度\
  \ |\n| `LoadPicture` | 返回图片对象 |\n| `Log` | 返回指定参数的自然对数 |\n| `Mid` | 根据提供的起始和长度参数从字符串中返回指定数量的字符\
  \ |\n| `Minute` | 返回一小时内的分钟（0 到 59 之间的数字） |\n| `Month` | 返回一年中的月份（1 到 12 之间的数字）\
  \ |\n| `MsgBox` |返回用户在对话框中点击按钮的值 |\n| `Now` | 返回当前日期和时间 |\n| `Oct` | 返回包含八进制表示的字符串\
  \ |\n| `RGB` | 返回表示 RGB 色的数字 |\n| `Right` | 返回字符串右侧的字符 |\n| `Rnd` | 返回随机数 |\n| `RTrim`\
  \ | 去除字符串结尾的任意空格并返回结果 |\n| `ScriptEngine` | 返回标识当前脚本语言的字符串 |\n| `ScriptEngineBuildVersion`\
  \ | 返回脚本引擎的生成次数 |\n| `ScriptEngineMinorVersion` | 返回脚本引擎的小版本号 |\n| `Second` | 返回一分钟内的秒（0\
  \ 到 59 之间的数字） |\n| `Sgn` | 返回指定参数的正负号 |\n| `Space` | 返回由指定数量空格组成的字符串 |\n| `Split`\
  \ | 将字符串组织为数组 |\n| `Sqr` | 返回数字的平方根 |\n| `String` | 返回由字符组成的字符字符串 |\n| `Tan` | 返回参数正切值的三角函数\
  \ |\n| `Time` | 返回系统当前时间 |\n| `TimeSerial` | 返回包含时、分、秒的 `Date` 类型变体 |\n| `TimeValue`\
  \ | 返回指定时间的 `Date` 类型变体 |\n| `Trim` | 在去除字符串两端空格后返回字符串 |\n| `Ubound` | 返回数组的最大下标\
  \ |\n| `Ucase` | 返回大写字符串 |\n| `VarType` | 返回变体类型 |\n| `WeekdayName` | 返回标识特定星期几的字符串\
  \ |\n| `Year` | 返回指定的年份 |\n\n\n作为使用内置函数节省时间并简化脚本的一个快速示例，请查看以下自定义函数，它由五条脚本语句组成：\n\
  \n Function SqrtSolver()\n  intUserInput = InputBox (\"输入一个数字\", \"自定义平方根函数\")\n\
  \  X = 1\n    X = X - ((X² - intUserInput) / (2 * X))\n  Next\n  MsgBox \" intUserInput\
  \ & \" 的平方根是 \" & X\n```\n\n函数中包含的五个语句要求用户输入数字，然后使用 `For...Next` 循环通过相当复杂的数学计算确定该数字的平方根图\
  \ 4.6 和 4.7 展示了该函数的操作。\n![点击展开](img/fig4-6_0.jpg)\n\n图 4.6：创建一个根据输入数字确定平方根的自定义函数![](img/fig4-7.jpg)\n\
  图 4.7：显示平方根计算的结果\n\n使用 VBScript 内置的 `Sqr()` 函数，你可以像下面所示仅用两行代码完成相同的任务：\n```\n UserInput\
  \ = InputBox (\"输入一个数字\", \"平方根计算器\")\nMsgBox \" UserInput & \" 的平方根是 \" & Sqr(UserInput)\n\
  \n使用 VBScript 内置 `Sqr()` 函数不仅减少了代码行数，还大大降低了脚本的复杂性，从而缩短了开发时间。\n\n\n\n\n在本章中，你学习了如何通过将\
  \ VBScript 组织成子程序（subroutines）和函数（functions）来增强它们。这包括理解这两种类型程序之间的区别，以及如何利用 VBScript\
  \ 内置函数集的强大功能和便利性。程序不仅使脚本更易于读取和维护，还提供了一种限制变量作用域的机制。你还学习了如何使用事件处理程序调用 VBScript 程序，以便开发能够对用户和浏览器活动做出动态响应的\
  \ VBScript。\n\n# 第 5 章：数组\n到目前，所有的讨论都集中在将变量作为脚本执行期间存储信息的主要手段。变量在有效处理大量数据方面的能力有限。脚本通常设计用于处理以某种方式相关的数据。VBScript\
  \ 提供了数组结构作为更有效地管理大量相关数据的手段。在本章中，你将学习如何操作一维数组和多维数组。此外，你将学习调整数组大小的各种技术以及处理和删除其内容。\n\
  \n## 在数组中存储相关数据\n通常，脚本处理以某种方式相关的数据。当要处理的数据量较小时，可以将其存储在单独变量中。然而，随着脚本处理的数据量增加，依赖变量变得变得越来越困难。例如，一个脚本可能需要处理一组用户名称。定义\
  \ 100 个唯一的变量名将是一个异常艰巨的过程。相反，VBScript 提供了数组作为存储大量相关数据的结构。\n\n`array` 是一个相关数据的索引列表。数组提供了以易于管理的方式存储相关信息的能力。大多数数组由单维度组成，可以被看作单列表格。VBScript\
  \ 数组是基于 0 的（zero-based），这意味着它们的第一个元素始终被分配索引值为 0。存储在数组中的第二个元素被分配索引值为 1，依此类推。通过指定数组名称和索引值，你可以引用存储在数组中的任何元素。\n\
  然而，VBScript 数组不仅限于单维度。例如，一个二维 VBScript 数组可以被看作是一个由多个列和行组成的表格，如图 5.1 所示。\n\n| **![开始图片](img/_1.gif)**\
  \ |\n|   | `Cust_No` | `Cust_Name` | `Cust_Phone` |\n| --- | --- | --- | --- |\n\
  | `Customer1` | `0,0` | `1,0` | `2,0` |\n| `Customer3` | `0,2` | `1,2` | `2,2` |\n\
  | **![结束图片](img/_1.gif)** |\n\n\n随着额外维度的增加，数组变得更加复杂。例如，三维数组可以被看作是一个立方体。对于大多数人来说，超过三维的任何东西都很概念，图形表示同样困难。幸运的是，尽管\
  \ VBScript 可以支持多达 60 维的数组，大多数情况只需要一或二维数组。\n\n\n## 操作一维数组\n\n\n### 定义一维数组\n\n\n```\n\
  \ Dim ArrayName(dimensions)\n\n`ArrayName` 是分配给数组的名称，`dimensions` 是一个用逗号分隔的列表，用于指定数组的维度数及其长度。\n\
  \n Dim astrCustomerList(4)\n```\n\n\n| | | 提示 | 为了让数组与其他变量区分开来，请为它们开发一套独特的命名规范。在书中，数组名称开头会附加小写字母\
  \ a，后跟一个三个字符的匈牙利风格描述，用于说明数组中存储的数据类型，以及一个或多个标识数组内容的描述性单词。在前面的例，`astrCustomerList`\
  \ 数组包含代表客户名称的字符串数据。 |\n\n\n一旦定义了数组，你就可以开始在其中存储元素。例如，以下语句创建一个名为 `astrCustomerList`\
  \ 的数组，并为其五个元素中的每一个分配数据。\n\n Dim astrCustomerList(4)\nastrCustomerList(0) = \"XYZ\
  \ Corp.\"\nastrCustomerList(1) = \"ABC Co.\"\nastrCustomerList(3) = \"A&B Corp\"\
  \nastrCustomerList(4) = \"ZZZ Enterprises\"\n```\n如果你想让用户为数组提供数据，可以如下所示收集。\n\n```\n\
  \nFor i = 0 to 4\n  astrCustomerList(i) = InputBox(\"请输入客户名称\")\n```\n\n循环被设置为迭代五次（从\
  \ 0 到 4）。它使用 VBScript 的 `InputBox()` 函数提示用户输入名称，如图 5.2 所示。然后通过将 `i` 的值与索引值关联，将用户输入的值存储在数组中。\n\
  ![点击展开](img/fig5-2_0.jpg)\n\n图 5.2：使用用户输入填充数组\n### 处理一维数组可以使用不同的技术来访问数组的内容。这包括通过引用索引值访问特定元素以及创建遍历所有元素的循环。这两种技术都将在接后的章节中进行回顾。\n\
  \n#### 直接访问\n一旦数组填充了数据，你就可以处理它。访问数组内容的方法是指定特定元素的索引值，如下所示。\n\n```\n\nastrCustomerList(0)\
  \ = \"XYZ Corp.\"\nastrCustomerList(1) = \"ABC Co.\"\nastrCustomerList(3) = \"A&B\
  \ Corp\"\nastrCustomerList(4) = \"ZZZ enterprises\"\n\n```\n\n图 5.3 显示了此脚本的输出。\n\
  ![](img/fig5-3.jpg)\n\n图 5.3：访问存储在数组中的特定元素\n#### For Each…Next\n\n通过指定单个元素来处理数组内容通常是不实际的。相反，你可以创建一个\
  \ `For Each…Next` 循环遍历数组，允许你程序化地处理存储在数组中的每个元素。`For Each…Next` 循环的语法如下。\n```\n For\
  \ Each element In group\nStatements ...\n```\n\n`Element` 是一个在遍历数组时控制循环的变量。`Group`\
  \ 指定要处理的数组名称。`Statements` 是用于处理数组内容的语句。\n\n\n`For Each`…Next`循环会持续迭代，直到数组中存储的每一个元素都处理完毕，如下例所示。\n\
  ```html\n <HTML>\n  <HEAD>\n      array</TITLE>\n</HEAD>\n\n\n    <SCRIPT language=\"\
  VBScript\">\n      Option Explicit\n      Dim i\n      Dim astrCustomerList(4)\n\
  \n      astrCustomerList(1) = \"ABC Co.\"\n      astrCustomerList(2) = \"Acme Inc.\"\
  \n      astrCustomerList(3) = \"A&B Corp\"\n\n      Document.Write \"<B>\" & \"\
  Customer Contacts:\" & \"</B> \" & \"<BR>\"\n\n        Document.Write i & \"<BR>\"\
  \n      Next\n\n\n  </BODY>\n</HTML>\n\n如你所见，一段 VBScript 被嵌入到 HTML 页面的 `BODY` 部分。该脚本首先定义了一个名为\
  \ `astrCustomerList` 的数组，它可以最多存储五个元素。接下来的五条语句在数组的每个元素中存储值。接着，使用 `Document.Write`\
  \ 语句在 Web 上显示列标题。最后，使用 `For Each`…Next` 循环遍历数组并显示其内容，内容由变量 `i` 表示。图 5.4 显示了加载此 HTML\
  \ 页面时生成的输出。\n\n\n图 5.4: 使用 `For Each`…Next` 循环处理存储在数组中的所有元素\n\n\n|   | 备注 | 关于如何使用\
  \ `For Each`…Next` 循环的更多信息，请参阅第 3 章，“条件逻辑和迭代结构。” |\n\n\nVBScript 提供了两个函数，允许你通过编程确定数组的上限和下界。这些是\
  \ `UBound()` 和 `LBound()` 函数。`LBound()` 函数返回数组下界（即其最低元素）的值。然而，由于 VBScript 的循环始终从\
  \ 0 开始索引，因此该函数的意义不大。\n\n\n相反，`UBound()` 函数是有价值的。它用于检索数组上限（其最高元素）的值。当用于处理一维数组时，`UBound()`\
  \ 函数的语法如下。\n\n UBound(ArrayName)\n```\n\n\n```\n x = UBound(ArrayName)\n\n赋值给 `x`\
  \ 的值等于数组中实际元素个数减 1。因此，要确定存储在数组中的元素个数，将 `UBound()` 返回的值加 1，如下所示。\n\n x = UBound(ArrayName)\
  \ + 1\n```\n\n\n```\n '*************************************************************************\n\
  'Author: Jerry Ford\n'Created: 01/17/2003\n'Description: Using UBound() to determine\
  \ an array's upper boundary\n\n'Initialization Section\n\n\nDim intArrayUpperBound,\
  \ i, strDisplayString\n\nastrCustomerList(0) = \"XYZ Corp.\"\nastrCustomerList(1)\
  \ = \"ABC Co.\"\nastrCustomerList(2) = \"Acme Inc.\"\nastrCustomerList(4) = \"ZZZ\
  \ Enterprises\"\n\n'Main Processing Section\nFor i = 0 to intArrayUpperBound\n \
  \ strDisplayString = strDisplayString & astrCustomerList(i) & \" \" & vbCrLf\nNext\n\
  MsgBox \"Contacts:\" & vbCrLf & vbCrLf & strDisplayString, , \"Contacts\"\n```\n\
  \n\n\n```\nConst cCustomerNo = 1\nConst cCustomerPhone = 2\n\n\nastrCustomerList(cCustomerName,0)\
  \ = \" XYZ Corp.\"\nastrCustomerList(cCustomerNo,0) = 12345\nastrCustomerList(cCustomerName,1)\
  \ = \" ABC Co \"\nastrCustomerList(cCustomerNo,1) = 98765\nastrCustomerList(cCustomerPhone,1)\
  \ = \"877-444-4444\"\nastrCustomerList(cCustomerNo,2) = 11122\nastrCustomerList(cCustomerPhone,2)\
  \ = \"800-555-5555\"\nastrCustomerList(cCustomerName,3) = \" A&B Corp.\"\nastrCustomerList(cCustomerPhone,3)\
  \ = \"888-888-9999\"\nastrCustomerList(cCustomerName,4) = \" ZZZ Enterprises \"\n\
  astrCustomerList(cCustomerNo,4) = 33344\n```\n\n|   | 提示 | 注意上一个示例中前三个语句对常量的使用。通过分配常量来表示数组中三列对应的值，代码变得具有自文档性，使其更易阅读和维护。\
  \ |\n## 处理多维数组\n\n一旦定义了多维数组并填充了数据，就可以对其进行处理。与静态数组一样，你可以指定单个元素的位置来访问它们的值。对于二维数组，这意味着要像下文所示同时指定行和列坐标。\n\
  ```\n WScript.Echo astrCustomerList(cCustomerName,2)\nWScript.Echo astrCustomerList(cCustomerPhone,2)\n\
  \n然而，为了处理包含大量数据的多维数组，你需要建立一个循环，如下例所示。\n\n '*************************************************************************\n\
  'Script Name: Script 5.3.vbs\n'Author: Jerry Ford\n'Description: 一个多维数组示例\n'*************************************************************************\n\
  \n\nOption Explicit\n\nConst cCustomerNo = 1\nConst cCustomerPhone = 2\n\n\nDim\
  \ astrCustomerList(2,4)\n\n\nLoadArray()\n\nFor i = 0 to intArrayUpperBound\n  strDisplayString\
  \ = strDisplayString & _\n    astrCustomerList(cCustomerName, i) & _\nNext\nMsgBox\
  \ strDisplayString, , \"Multidimensional Array Example\"\n\n\nFunction LoadArray()\n\
  \  astrCustomerList(cCustomerName,0) = \" XYZ Corp.\"\n  astrCustomerList(cCustomerPhone,0)\
  \ = \"800-333-3333\"\n  astrCustomerList(cCustomerName,1) = \" ABC Co \"\n  astrCustomerList(cCustomerNo,1)\
  \ = 98765\n  astrCustomerList(cCustomerName,2) = \" Acme Inc.\"\n  astrCustomerList(cCustomerNo,2)\
  \ = 11122\n  astrCustomerList(cCustomerPhone,2) = \"800-555-5555\"\n  astrCustomerList(cCustomerNo,3)\
  \ = 22233\n  astrCustomerList(cCustomerPhone,3) = \"888-888-9999\"\n  astrCustomerList(cCustomerName,4)\
  \ = \" ZZZ Enterprises \"\n  astrCustomerList(cCustomerPhone,4) = \"877-444-1111\"\
  \nEnd Function\n```\n\n\n\n '*************************************************************************\n\
  'Script Name: Script 5.4.vbs\n'Author: Jerry Ford\n'Description: 演示如何调整数组大小的大小\n\
  '*************************************************************************\n\n\n\
  Option Explicit\n\nstrMessage = \"Dynamic Array Demonstration\" & vbCrLf & vbCrLf\n\
  \n'Main Processing Section\nDimTheArray()\nReDimTheArray()\nDisplayResults()\n'Procedure\
  \ Section\n\nFunction DimTheArray()\n  astrCustomerList(0) = \"XYZ Corp.\"\n  astrCustomerList(1)\
  \ = \"ABC Co.\"\n  astrCustomerList(2) = \"Acme Inc.\"\n\nFunction ReDimTheArray()\n\
  \  ReDim Preserve astrCustomerList(4)\n  astrCustomerList(4) = \"ZZZ Enterprises\"\
  \nEnd Function\n\n  For Each i In astrCustomerList\n    strMessage = strMessage\
  \ & i & vbCrLf\n  Next\nEnd Function\n```\n\n\n接下来，执行 `ReDimTheArray()` 函数。该函数重新调整数组的大小，使其能够存储多达五个元素。包含\
  \ `Preserve` 关键字是为了确保数组中当前存储的数据不会丢失。该随后为两个新的数组元素赋值了值。\n\n\n![点击展开](img/fig5-8_o.jpg)\n\
  \n\n上一个示例演示了在预先知道数组需要扩展到多大的假设如何调整动态数组。然而，在许多情况下，你无法预先知道动态数组应该有多大。接下来的示例演示了如何编写脚本，在每次添加新元素时动态地调整数组的大小。这允许脚本根据需要增加数组的大小，以适应任何所需的数据量。\n\
  \n '*************************************************************************\n\
  'Script Name: Script 5.5.vbs\n'Author: Jerry Ford\n'Description: 根据用户输入调整动态数组\n\
  '*************************************************************************\n\n\n\
  Option Explicit\n\n\nReDim astrCustomerList(0)\n\n\nCollectInputData()\nProcessInputData()\n\
  'Procedure Section\n\nFunction CollectInputData()\n  Dim i\n  i = 0\n\n\n    strUserInput\
  \ = InputBox(\"Type a customer name\")\n\n      astrCustomerList(i) = strUserInput\n\
  \    Else\n      Exit Do\n    i = i + 1\n\n    ReDim Preserve astrCustomerList(i)\n\
  Loop\n\nEnd Function\nFunction ProcessInputData()\n\n  Dim i\n\n  For Each i In\
  \ astrCustomerList\n    strMessage = strMessage & i & vbCrLf\n\n  MsgBox strMessage\n\
  \n```\n\n脚本开始时定义变量并定义一个名为 `astrCustomerList` 的初始大小为 `0` 的数组。这允许数组存储单个元素。脚本的控制逻辑位于主处理部分，包含两个函数调用。第一个调用的函数是\
  \ `CollectInputData()`。该函数使用 `Do` `…` `While` 循环来控制数据收集。使用 VBScript 的 `InputBox()`\
  \ 函数从用户处收集文本输入。数据收集持续到用户输入单词 `quit`。`Ucase()` 函数用于测试用户输入的每条数据以查找单词 `Quit`。每当输入新条目时，脚本将其分配为数组的最后一个元素，然后调整数组大小以容纳新元素。\n\
  |  | 提示  | `Ucase()` 函数可将文本转换为全大写。这允许你进行全大写文本比较，而无需担心用户使用的大小写。例如，在之前的脚本中，用户可以输入\
  \ `QUIT`、`quit` 或 `QuIt` 来终止数据输入过程。 |\n\n脚本中调用的最后一个函数使用 `For Each` `…` `Next` 循环处理存储在数组中的每个元素，构建显示字符串并显示结果。\n\
  ### 调整多维动态数组的大小\n\n在保留多维数组中存储的数据时，只有定义的最后一个维度可以被调整大小。例如，在本章之前介绍的二维数组中，设置了一个数组来存储客户名称、客户编号和客户电话号码。由于数组的第二个维度被用于存储客户电话，因此它是唯一可以调整大小的维度。幸运的是，这在这种情况下是可以行的，因为客户不太更改姓名。电话号码可能会变。\n\
  作为另一个示例，考虑以下二维数组：\n\n```\n ReDim astrCustomerList(2,2)\n```\n\n此语句定义的数组可以看作是一个三列三行的表格。然而，由于多维数组的最后一个维度可以调整大小，因此存储在第二个维度中的元素可以被调整大小。为了调整数组以包含更多数据，你可以如下所示增加其第二个维度的大小：\n\
  \n```\n ReDim astrCustomerList(2,9)\n```\n\n此语句允许将第二个维度扩展到存储 10 个元素。\n\n### 擦数组\n\
  \nVBScript 提供使用 `Erase` 语句删除数组的功能。该语句的语法如下：\n\n```\n Erase arrayname\n```\n\n`Erase`\
  \ 语句删除静态数组的内容，但不会缩小数组的大小。用于删除动态数组时，`Erase` 语句删除数组的内容并释放数组使用的所有存储，从而释放内存。\n\n例如，以下语句删除名为\
  \ `astrCustomerList` 的数组的内容：\n\n```\n Erase astrCustomerList\n```\n\n### 使用 VBScript\
  \ 函数处理数组\n\nVBScript 提供了两个在处理数组时非常有用的函数。这些函数的简单定义如下：\n\n*   `Array()`。获取一个包含数组的变体\n\
  *   `IsArray()`。提供判断变量是否为数组的能力\n\n\n\n\n\n`Arglist` 是一个用逗号分隔的元素列表，用于存储在数组中。如果省略\
  \ `arglist`，则设置一个长度为零的数组。否则，数组的初始大小由 `arglist` 中提供的元素数量决定。例如，以下语句定义了一个包含五个元素的数组。\n\
  \n```\n astrCustomerList = Array(\"ABC Corp\", \"XYZ Inc\", \"Acme Co.\", \"L&F\
  \ Inc\", \"IV World\")\n```\n\n`Array()` 函数允许你减少创建小型数组所需的语句数量。例如，上面的数组也可以同样像下面所示那样进行定义。\n\
  \n```\n ReDim astrCustomerList(4)\nastrCustomerList(0) = \"XYZ Corp.\"\nastrCustomerList(1)\
  \ = \"ABC Co.\"\nastrCustomerList(2) = \"Acme Inc.\"\nastrCustomerList(3) = \"A&B\
  \ Corp\"\nastrCustomerList(4) = \"ZZZ Enterprises\"\n```\n\n### 使用 IsArray() 函数\n\
  \nVBScript `IsArray()` 函数用于测试指定的变量是否为数组。如果测试的变量是数组，它返回 `True` 值。否则，返回 `False` 值。\n\
  \n除了数组外，VBScript 变量是标量的，这意味着它们只包含一个值。如果 VBScript 尝试对标量变量使用 `UBound()` 或 `LBound()`\
  \ 等数组相关函数，就会发生错误并终止脚本执行。如果脚本尝试在引用标量变量时指定索引号将其作为数组处理，也会发生错误。防止意外将标量变量当作数组处理的一种方法是先使用\
  \ `IsArray()` 函数进行测试。\n\n`IsArray()` 函数的语法如下。\n\n```\n IsArray(variablename)\n```\n\
  \n例如，以下语句定义了一个数组，然后演示了如何使用 `IsArray()` 函数。\n\n```\n ReDim astrCustomerList(4)\n\
  X = IsArray(astrCustomerList)\nIf x = \"True\" then\n  MsgBox \"This variable is\
  \ an array.\"\nElse\n  MsgBox \"This is a scalar variable.\"\nEnd If\n```\n\n##\
  \ 总结\n\n在本章中，你学习了如何处理单维和多维数组。你还学习了如何处理静态和动态数组。此外，你学习了处理数组内容的不同技术，包括如何访问存储在特定数组单元格中的数据，以及如何创建循环来迭代处理整个数组的内容。本章涵盖的其他主题还包括如何调整数组大小，以及如何保留和删除其内容。\n\
  \n# 第 6 章：数据收集、通知与错误报告\n\n在本章中，你将学习如何使用 VBScript 的 `InputBox()` 和 `MsgBox()` 函数显示弹出对话框，用于收集用户输入和显示输出。你学习如何控制这些弹出对话框内文本的呈现，以及如何查询用户指定的输入。此外，本章将介绍有关错误处理的信息，包括如何生成更友好的错误消息。\n\
  \n## 与用户交互\n\n根据你开发 VBScript 的编程环境，你有多种不同的选项来显示输出并与用户交互。例如，在 HTML 页面中，你可以使用 `Window`\
  \ 和 `Document` 对象提供的方法显示输出。这些方法在表 6.1 中进行了描述。\n\n表 6.1：VBScript 字符串常量\n\n| 对象 |\
  \ 方法 | 描述 |\n\n| --- | --- | --- |\n\n| `Document` | `Write` | 直接在 HTML 页面上显示文本\
  \ |\n| `Window` | `Alert` | 在带有 `OK` 按钮的弹出对话框中显示文本 |\n|   | `Prompt` | 在带有文本输入框以及\
  \ `OK` 和 `Cancel` 按钮的弹出对话框中显示文本 |\n|   | `Confirm` | 在弹出对话框中显示文本消息，并要求用户通过点击 `OK`\
  \ 或 `Cancel` 按钮提供确认 |\n|   | `Status` | 在浏览器状态栏中显示文本消息 |\n|  | | 注意 | `Window` 和\
  \ `Document` 对象是浏览器对象。`Window` 对象代表当前打开的浏览器窗口或帧。`Document` 对象代表当前加载的 HTML 页面。关于这些对象的更多信息请参阅第\
  \ 8 章，“VBScript and Internet Explorer”。 |\n\n在为 WSH（Windows 主机）开发脚本时，程序员可以选择使用 `WScript`\
  \ 和 `WshShell` 提供的方法显示输出。这些方法在下方指定。\n\n*   `Echo()`。一个属于 `WScript` 对象的方法，可在 Windows\
  \ 控制台或弹出对话框中显示文本消息。\n*   `Popup()`。一个属于 `WshShell` 对象的方法，可在弹出对话框中显示文本消息，并控制图标和按钮的选择，且能够确定用户点击了哪个按钮。\n\
  \n|  | 注意 | `WScript` 和 `WshShell` 对象是 WSH 对象。`WScript` 对象是其他 WSH 对象的顶级或父对象。`WshShell`\
  \ 对象提供了可用的方法和属性。 |\n\n除了 Internet Explorer 提供的特定环境输出外，VBScript 还提供了一对始终可用于输出和收集输入的函数。这两个函数描述如下。\n\
  \n*   `InputBox()`。显示一个带有文本输入框的弹出对话框。\n*   `MsgBox()`。显示一个包含文本消息和可选图标的弹出对话框。\n\n\
  ## InputBox() 函数\n\nVBScript 的 `InputBox()` 函数提供了在脚本执行期间提示用户输入数据的能力。这允许你开发可以与用户直接交互的脚本。`InputBox()`\
  \ 函数显示具有以下能力的弹出对话框：\n\n*   一个用于收集输入的文本字段\n*   能够显示长达 1,024 个字符的文本消息\n*   允许用户控制弹出对话框的\
  \ OK 和取消按钮\n\n### 定义 InputBox() 函数\n\n`InputBox()` 函数的语法如下。\n\n```\n Response =\
  \ InputBox(Prompt[, Titlebarmsg][, Default][, Xpos]\n  [, Ypos][, Hhelpfile, Context])\n\
  ```\n\n`Response` 是一个带有字符串子类型的变体，用于存储用户提供的文本。`Prompt` 是一个长达 1,024 个字符的文本消息，为用户提供指令和方向。`Titlebarmsg`\
  \ 是可选的。如果提供，将其显示在弹出对话框的标题栏中。如果省略，标题栏将显示“VBScript”。`Default` 是可选的。使用时，它提供一个自动显示在弹出对话框文本字段中的默认答案。`Xpos`\
  \ 和 `Ypos` 是以点（twips）为指定的指定的测量值。使用时，`Xpos` 指定从显示左侧到弹出对话框左侧的距离。`Ypos` 指定从弹出对话框顶部到显示顶部的距离。`Helpfile`\
  \ 和 `Context` 是可选的。它们指定可用上下文帮助的外部文件位置。\n\n|  | 注意 | *Twip* 是一种空间测量单位，代表点的 1/20 或英寸的\
  \ 1/1440。 |\n\n以下语句演示了如何使用 `InputBox()` 函数。\n\n```\n strUserName = InputBox(\"Please\
  \ enter your name\")\nMsgBox (\"Greetings \" & strUserName)\n```\n\n\n\n\n\n此示例中的第一个语句显示了图\
  \ 6.1 所示的弹出对话框。如你所见，它显示了一条消息并等待用户输入名称并点击 OK 按钮，或者点击 Cancel 按钮取消操作。\n\n![点击展开](img/fig6-1_0.jpg)\n\
  \n图 6.1：使用 `InputBox()` 函数从用户处收集数据输入\n\n`InputBox()` 函数在点击 OK 按钮时返回用户输入的文本。然而，如果用户在未输入任何文本的情况下点击了\
  \ OK，或者点击了 `Cancel` 按钮，则会返回一个长度为零的字符串（即 \"\"）。在上一个示例中，用户输入的数据被保存为名为 `strUserName`\
  \ 的变量，其类型为字符串子类型的变体。图 6.2 显示了上述第二个语句显示的弹出对话框。\n\n![](img/fig6-2.jpg)\n\n图 6.2：按名称问候用户\n\
  \n`InputBox()` 函数的参数对位置敏感。如果你不使用特定参数，必须替换一个逗号以便继续添加被省略参数之后的后续参数。例如，以下语句将显示如图 6.3\
  \ 所示的弹出对话框。此示例将显示一条消息和一个默认答案，而不会指定在弹出对话框标题栏中显示的任何消息文本。\n\n![点击展开](img/fig6-3_0.jpg)\n\
  \n图 6.3：使用 `InputBox()` 函数显示带有默认答案的弹出对话框\n\n```\n strFileName = InputBox(\"Please\
  \ specify a temporary file name.\", ,\"C:\\Temp\")\n```\n\n|  | 注意项 | 如果在使用 `InputBox()`\
  \ 函数时省略了 `titlebarmsg` 参数，VBScript 将弹出对话框的标题栏中显示“VBScript”字样。 |\n\n### 输入验证\n\n\
  用户可能是完全不可预测的。因此，对 `InputBox()` 函数返回的所有数据进行询问和验证至关重要，以确保它们符合你的 VBScript 的要求。例如，你可能会编写一个脚本，意图收集用户的姓名。然而，用户可能不会输入姓名，而是执行以下操作之一：\n\
  \n*   点击 Cancel 按钮\n*   按下 Escape 键\n*   在未输入任何文本的情况下点击 OK\n\n每种操作都会导致一个长度为零的字符串。以下语句演示了在使用\
  \ `InputBox()` 函数时如何检查数据是否存在。\n\n```\n strUserName = InputBox(\"Please enter your\
  \ name.\", \"User Questionnaire\")\n\nIf strUserName = \"\" Then\n  MsgBox \"You\
  \ did not provide any information!\"\nElse\n  MsgBox \"Greetings \" & strUserName\n\
  End If\n```\n\n第二个语句检查由 `InputBox()` 函数返回并存储在 `strUserName` 中的数据是否等于 \"\"。\n\n以下示例显示了另一种查看用户是否向\
  \ `InputBox()` 函数提供了数据的方法。\n\n```\n strChoice = InputBox(\"What do you prefer: Games,\
  \ Utilities or Other?\")\nIf Len(strChoice) = 0 Then\n  MsgBox \"You did not enter\
  \ any data.\"\nEnd If\n```\n\n在此示例中，使用了 VBScript 的 `Len()` 函数来查看存储在 `strChoice`\
  \ 中的值是否为零长度。有时，在用户未能提供任何数据的情况下，提供一个默认答案可能是合适的，如下所示。\n\n```\n strChoice = InputBox(\"\
  What do you prefer: Games, Utilities or Other?\")\nIf Len(strChoice) = 0 Then\n\
  \  strChoice = \"Other\"\nEnd If\n```\n\n在此示例中，如果用户未能输入任何数据，`strChoice` 的值将自动设置为\
  \ `Other`。在某些情况下，提供默认答案是不够的。在这种情况下，你可以将 `InputBox()` 函数封装在一个循环中，该循环一直迭代直到用户提供正确的响应。例如，以下语句使用\
  \ `Do...While` 循环强制用户在 `InputBox()` 函数的提示下输入 `quit` 以退出循环。\n\n```\n Do While UCase(strChoice)\
  \ <> \"QUIT\"\n\n  strChoice = InputBox(\"What do you want to do?\")\n\n  If UCase(strChoice)\
  \ <> \"QUIT\" Then\n    MsgBox \"Invalid option. Please specify your selection again.\"\
  \n  Else\n    Exit Do\n  End If\n\nLoop\n```\n\n在此示例中，使用 `UCase()` 函数将所有用户的响应转换为大写字母。然后检查用户的响应以确认是否提供了正确的输入。\n\
  \nVBScript 为你提供了工具来控制 `InputBox()` 函数显示的提示消息的格式。你可以使用表 6.2 列出的任何 VBScript 常量来格式化文本输出。\n\
  \n表 6.2：VBScript 字符串常量\n\n| 函数 | 说明 |\n| --- | --- |\n| `VbCr` | 执行回车操作 |\n| `vbCrLf`\
  \ | 执行回车和换行操作 |\n| `vbLf` | 执行换行操作 |\n| `vbTab` | 执行水平制表 |\n\n以下示例演示了如何在 `InputBox()`\
  \ 对话框中格式化文本。\n\n```\n intAnswer = InputBox(\"Please enter the number of one of the\n\
  following options:\" & vbCrLf &\n\"-- Choices --\" & vbCrLf &\n\"1\\. View copyright\
  \ information.\" & vbCrLf &\n\"2\\. View information about the script.\" & vbCrLf\
  \ &\n\"3\\. View help.\", \"Menu List\")\nIf IsNumeric(intAnswer) Then\n  Select\
  \ Case intAnswer\n    Case 1\n      MsgBox \"Copyright 2003, Jerry Lee.\"\n    Case\
  \ 2\n      MsgBox \"This script demonstrates how to format text in \" &\n      \
  \  \"InputBox()s\"\n    Case 3\n      MsgBox \"For additional assistance visit \"\
  \ &\n        msdn.microsoft.com/scripting\"\n    Case Else\n      MsgBox \"Invalid\
  \ selection.\"\n  End Select\nElse\n  MsgBox \"The only valid options are 1, 2 or\
  \ 3.\"\nEnd If\n```\n\n### 数据转换\n\nVBScript 只支持变体类型。然而，它支持多种变体子类型。VBScript 会尽可能确定存储在变量中的数据类型。为了解决这个问题，VBScript\
  \ 提供了两种更改子类型的方法：隐式转换和显式转换。\n\n#### 隐式转换\n\n`InputBox()` 函数无论用户输入什么，只返回字符串数据。然而，VBScript\
  \ 提供了解决方法。在大多数情况下，VBScript 能够根据情况自动转换存储在变量中的数据。例如，如果用户在 `InputBox()` 弹出对话框的字段中输入数字\
  \ 66，VBScript 将将其视为字符串 \"66\"。如果执行使用该变量的数学运算，VBScript 将自动将其子类型转换为数值型。这被称为隐式转换。\n\
  \n使用隐式转换，以下 VBScript 能够自动将用户输入的任何数字从字符串转换为数值值。\n\n```\n dblAnswer = InputBox(\"\
  Enter the number\", \"Implicit Conversion Example\")\nMsgBox TypeName(dblAnswer)\n\
  dblAnswer = 100 + dblAnswer\nMsgBox TypeName(dblAnswer)\n```\n\n|   | 注意项 | 上一个示例中使用的\
  \ VBScript `TypeName()` 函数返回显示指定变量子类型的字符串。`TypeName()` 函数可以返回以下任何字符串。 |\n\n*   Byte\n\
  *   Integer\n*   Long\n*   Single\n*   Double\n*   Currency\n*   Decimal\n*   Date\n\
  *   String\n*   Boolean\n*   Empty\n*   Null\n*   Object\n*   Unknown\n*   Error\
  \ |\n\n执行时，此示例中的第二个语句将显示如图 6.4 所示的输出，证明 `InputBox()` 函数总是返回字符串值。\n\n![](img/fig6-4.jpg)\n\
  \n图 6.4：`InputBox()` 函数总是返回字符串值\n\n\n\n\n脚本的第三行执行了一个数学操作，在用户输入的数字上加上 100。通过隐式转换，VBScript\
  \ 会自动将变量的值转换为子类型为 `double` 的 `variant`。脚本最后一行显示的输出（如图 6.5 所示）证明了变量已经过转换。\n\n![](img/fig6-5.jpg)\n\
  \n图 6.5：VBScript 会根据情况自动尝试将变量从一个子类型转换为另一个子类型\n\n## 显式转换\n\n虽然 VBScript 会尽力根据每个情况自动调整变量的子类型，但可能会出现它无法按你预期的进行调整的情况。当这种情况发生时，你可以尝试使用`显式转换`（explicit\
  \ coercion）来强制子类型转换。VBScript 提供了大量的转换函数，如表 6.3 所示。\n\n表 6.3：VBScript 转换函数\n\n| 函数\
  \ | 说明 |\n| --- | --- |\n| `Asc` | 返回字符串中第一个字母的 ANSI 字符码 |\n| `CBool` | 将变量转换为 `Boolean`\
  \ 子类型 |\n| `CByte` | 将变量转换为 `Byte` 子类型 |\n| `CCur` | 将变量转换为 `Currency` 子类型 |\n|\
  \ `CDate` | 将变量转换为 `Date` 子类型 |\n| `CDbl` | 将变量转换为 `Double` 子类型 |\n| `Chr` | 返回指定的\
  \ ANSI 字符码字符 |\n| `CInt` | 将变量转换为 `Integer` 子类型 |\n| `CLng` | 将变量转换为 `Long` 子类型\
  \ |\n| `CSng` | 将变量转换为 `Single` 子类型 |\n| `CStr` | 将变量转换为 `String` 子类型 |\n| `Hex`\
  \ | 返回表示数字十六进制值的的字符串 |\n| `Oct` | 返回表示数字八进制数值的字符串 |\n\n以下示例演示了 `CInt()` 转换函数的应用。\n\
  \n```\nintUserNumber = InputBox(\"输入 0 到 9 之间的数字\",\n  \"输入你的答案\")\n\nIf IsNumeric(intUserNumber)\
  \ = \"True\" Then\n  intUserNumber = CInt(intUserNumber)\n  If Len(intUserNumber)\
  \ = 1 Then\n    MsgBox \"你输入了 \" & intUserNumber\n  Else\n    MsgBox \"选择无效!\"\n\
  \  End If\nElse\n  MsgBox \"无效非数字\"\nEnd If\n```\n\n`InputBox()` 函数用于提示用户输入 0 到\
  \ 9 之间的值。为了确保用户输入的是数字而不是字母或特殊字符，使用了 `IsNumeric()` 函数。如果输入的是数字，则该函数返回的值将等于 `True`。在这种情况下，使用\
  \ `CInt()` 函数显式地将输入值转换为 `Integer` 值。虽然在这个示例中不是严格要求的，但使用 `CInt()` 函数可以让程序员的意图更加清晰。\n\
  \n| | 注意 |\n| --- | --- |\n| `IsNumeric()` 函数返回一个布尔值，指定测试的值是否为数字。 |\n\n## 类型不匹配\n\
  \n如果 VBScript 尝试对一个其子类型不支持的变量进行操作，就会发生错误。VBScript 无法对非数字数据进行算术比较。例如，以下脚本提示用户输入一个\
  \ 1 到 9 之间的数值。\n\n```\nintAnswer = InputBox(\"输入 1 到 9 之间的数字\", \"菜单列表\")\n\nIf\
  \ intAnswer > 0 Then\n  If intAnswer < 10 Then\n    MsgBox \"你输入了 \" & intAnswer\n\
  \  End if\nEnd If\n```\n\n如果用户输入 1 到 9 之间的数字，将显示消息。如果用户输入范围之外的数字，则什么都不会发生。然而，如果用户输入字母或特殊字符而不是数值，就会发生类型不匹配（Type\
  \ Mismatch）错误，如图 6.6 所示。\n\n![点击展开](img/fig6-6_0.jpg)\n\n图 6.6：当 VBScript 尝试对一个子类型不支持的\
  \ variant 执行操作时，会发生类型不匹配错误\n\n为了避免类型不匹配错误的发生，你需要进行输入验证。这通常涉及测试变量以确定其子类型分配，可以使用 `TypeName()`\
  \ 函数或使用表 6.4 中列出的任何子类型测试函数。\n\n表 6.4：测试 Variant 子类型的 VBScript 函数\n\n| 函数 | 说明 |\n\
  | --- | --- |\n| `IsArray` | 根据指定的变量是否为数组返回 `True` 或 `False` |\n| `IsDate` | 根据指定的变量是否为日期返回\
  \ `True` 或 `False` |\n| `IsEmpty` | 根据指定的变量是否已初始化返回 `True` 或 `False` |\n| `IsFinite`\
  \ | 根据指定的数字是否为有限值返回 `True` 或 `False` |\n| `IsNaN` | 根据指定的变量是否为 `NaN` 返回 `True` 或\
  \ `False` |\n| `IsNull` | 根据指定的变量是否为空返回 `True` 或 `False` |\n| `IsNumeric` | 根据指定的变量是否为数字返回\
  \ `True` 或 `False` |\n| `IsError` | 根据指定的变量是否包含错误返回 `True` 或 `False` |\n\n## MsgBox\
  \ 函数\n\n`MsgBox()` 函数提供了一种收集数据的方便方法。然而，你通常需要向用户展示一个范围供选择。你可以使用 `MsgBox()` 函数来实现这一点。\n\
  \n### 定义 MsgBox 函数\n\n`MsgBox()` 函数的语法如下所示。\n\n```\nMsgBox(Prompt[, Buttons][, TitleMsg][,\
  \ Helpfile, Context])\n```\n\n`Prompt` 是一个长达 124 个字符的消息，向用户提供指示。`Buttons` 是一个指定显示哪些按钮的值。`TitleMsg`\
  \ 是可选的。提供时，将其显示在弹出框的标题栏中。如果省略，将显示 \"VBScript\"。`Helpfile` 和 `Context` 是可选的。它们指定了可用帮助文件的位置。\n\
  \n`MsgBox()` 函数提供了自定义弹出对话框的功能。这些功能列举如下：\n\n*   显示的按钮组合\n*   显示的图标\n*   默认按钮\n* \
  \  对话框的模态\n\n这些选项均在随后的表格中描述。在使用 `MsgBox()` 函数显示弹出对话框时，你可以从每个表中选择一个选项。表 6.5 列出了可以通过\
  \ `MsgBox()` 函数显示的不同按钮。\n\n表 6.5：VBScript MsgBox() 函数按钮\n\n| 常量 | 数值 | 说明 |\n| ---\
  \ | --- | --- |\n| `vbOKOnly` | 0 | 显示 `OK` 按钮 |\n| `vbOKCancel` | 1 | 显示 `OK` 和\
  \ `Cancel` 按钮 |\n| `vbAbortRetryIgnore` | 2 | 显示 `Abort`、`Retry` 和 `Ignore` 按钮 |\n\
  | `vbYesNoCancel` | 3 | 显示 `Yes`、`No` 和 `Cancel` 按钮 |\n| `vbYesNo` | 4 | 显示 `Yes`\
  \ 和 `No` 按钮 |\n| `vbRetryCancel` | 5 | 显示 `Retry` 和 `Cancel` 按钮 |\n\n以下示例演示了创建一个显示\
  \ `OK` 按钮的弹出对话框。\n\n```\nMsgBox \"点击 OK 继续。\"\n```\n\n由于 `vbOKOnly` 常量代表 `MsgBox()`\
  \ 函数的默认选择，因此不需要指定它。但你可以像下面所示那样指定它，并获得与图 6.7 所示相同的结果。\n\n![](img/fig6-7.jpg)\n\n\
  图 6.7：使用 `MsgBox()` 函数显示带有 `OK` 按钮的弹出对话框\n\n```\nMsgBox \"点击 OK 继续。\", vbOKOnly\n\
  ```\n\n\n\n\n## 替代方案\n\n或者，你可以像这样替换 `vbOKOnly` 常量的数值值。\n\n```\nMsgBox \"Click on\
  \ OK to continue.\", 0\n```\n\n表 6.6 列出了由 `MsgBox()` 函数可以显示的不同图标。\n\n表 6.6：VBScript\
  \ `MsgBox()` 函数图标\n\n| 常量 | 值 | 描述 |\n| --- | --- | --- |\n| `vbCritical` | 16 |\
  \ 显示严重图标 |\n| `vbQuestion` | 32 | 显示问号图标 |\n| `vbExclamation` | 48 | 显示感叹号图标 |\n\
  | `vbInformation` | 64 | 显示信息图标 |\n\n下面的示例演示了如何创建一个显示 `OK` 和 `Cancel` 按钮以及问号图标的弹出对话框。\n\
  \n```\nMsgBox \"Click on OK to try again.\", vbOKCancel + vbQuestion\n```\n\n或者，你也可以像所示重写此语句。\n\
  \n```\nMsgBox \"Click on OK to try again.\", 1 + 32\n```\n\n你也可以如下所示重写。\n\n```\n\
  MsgBox \"Click on OK to try again.\", 33\n```\n\n第一个示例的格式是最清晰且易读的。无论你使用上述哪种格式，图\
  \ 6.8 中所示输出将始终相同。\n\n![点击展开](img/fig6-8_0.jpg)\n\n图 6.8：使用 `MsgBox()` 函数向用户提示指令\n\
  \n表 6.7 提供了你可以使用的常量列表，用于用于指定弹出对话框的默认按钮。\n\n表 6.7：VBScript `MsgBox` 按钮默认常量\n\n| 常量\
  \ | 值 | 描述 |\n| --- | --- | --- |\n| `vbDefaultButton1` | 0 | 将第一个按钮设为默认 |\n| `vbDefaultButton2`\
  \ | 256 | 将第二个按钮设为默认 |\n| `vbDefaultButton3` | 512 | 将第三个按钮设为默认 |\n| `vbDefaultButton4`\
  \ | 768 | 将第四个按钮设为默认 |\n\n下面的示例演示了如何创建一个显示 `Yes`、`No` 和 `Cancel` 按钮的弹出对话框。此外，`Cancel`\
  \ 按钮设置为默认按钮。\n\n```\nMsgBox \"Please select an option.\", vbYesNoCancel + vbDefaultButton3\n\
  ```\n\n图 6.9 显示了执行此语句时弹出对话框的样式。\n\n![点击展开](img/fig6-9_0.jpg)\n\n图 6.9：使用 `MsgBox()`\
  \ 函数向用户提供多个选项\n\n表 6.8 提供了你可以使用的常量列表，用于指定 `MsgBox()` 函数产生的弹出对话框的模态。\n\n表 6.8：VBScript\
  \ `MsgBox` 模态设置常量\n\n| 常量 | 值 | 描述 |\n| --- | --- | --- |\n| `vbApplicationModal`\
  \ | 0 | 用户在脚本继续之前必须做出响应。 |\n| `vbSystemModal` | 4096 | 用户在脚本继续之前必须做出响应。此外，弹出对话框将保持显示在其他活动应用程序之上。\
  \ |\n\n下面的示例演示了如何创建一个显示 `Retry` 和 `Cancel` 按钮以及感叹号图标的弹出对话框。此外，Cancel 按钮设置为默认按钮，且弹出对话框设置为应用程序模态。\n\
  \n```\nMsgBox \"Click on Retry to try again.\", vbRetryCancel + vbExclamation +\n\
  vbDefaultButton2 +\nvbApplicationModal\n```\n\n图 6.10 显示了执行此语句时弹出对话框的样式。\n\n![点击展开](img/fig6-10_0.jpg)\n\
  \n图 6.10：使用 `MsgBox()` 函数创建应用程序模态弹出对话框\n\n### 质查询结果\n\n为了确定用户点击了哪个按钮，你需要使用 `MsgBox()`\
  \ 函数，如下所示。\n\n```\nintChoice = MsgBox(\"Would you like to continue?\", vbYesNo,\
  \ _\n  \"Confirmation dialog\")\n```\n\n在这里，用户点击的按钮的数值由 `MsgBox()` 函数返回并存储在名为 `intChoice`\
  \ 的变量中。表 6.9 概述了 `MsgBox()` 函数可能返回的所有值。在上例中，如果用户点击 Yes 按钮，则返回值 6；如果用户点击 No 按钮，则返回值\
  \ 7。\n\n表 6.9：VBScript `MsgBox()` 函数返回值\n\n| 常量 | 值 | 描述 |\n| --- | --- | --- |\n\
  | `vbOK` | 1 | 用户点击了 `OK` |\n| `vbCancel` | 2 | 用户点击了 `Cancel` |\n| `vbAbort` |\
  \ 3 | 用户点击了 `Abort` |\n| `vbRetry` | 4 | 用户点击了 `Retry` |\n| `vbIgnore` | 5 | 用户点击了\
  \ `Ignore` |\n| `vbYes` | 6 | 用户点击了 `Yes` |\n| `vbNo` | 7 | 用户点击了 `No` |\n\n## 处理错误\n\
  \n错误可能由于多种原因发生在 VBScript 中，包括语法错误、无效输入和资源可用。在错误、常量和变量中你学习了语法错误。另一类发生在 VBScript 中的错误是运行时错误。当\
  \ VBScript 语句尝试执行无效操作时（例如访问损坏的驱动器），就会发生运行时错误。由于运行时错误与语法错误不同，它们在解释阶段不会被检测，它们只在代码执行时发生。除非测试所有的\
  \ VBScript 部分，否则可能发现运行时错误。在许多情况下，你可以添加编程逻辑来预测并恢复运行时错误。然而，某些情况是你无法控制的，例如磁盘崩溃。在这种情况下，你通常只能向用户显示一个自定义错误消息，说明脚本为何未完成任务。\n\
  \n### 决定不采取行动\n\n许多 VBScript 仅包含几个语句，为了快速自动化特定任务而在几分钟内编写。在这种情况下，最好省略任何错误处理逻辑并让错误直接发生，因为预测它们并编写处理代码的时间是昂贵的。这对于开发仅自己使用的小型工具脚本来说是可以接受的。如果脚本将与其他用户共享，可以提供说明，要求用户报告他们可能遇到的任何问题。\n\
  \n### 让 VBScript 忽略错误\n\n处理运行时错误的另一种选择是告诉 VBScript 忽略它们并继续处理。这在许多情况下是一种有效的技术。下面的示例提示用户输入三个数字，然后将它们相加。\n\
  \n```\nintNoOne = CInt(InputBox(\"Enter the first number\"))\n\nintNoTwo = CInt(InputBox(\"\
  Enter the second number\"))\n\nintNoThree = CInt(InputBox(\"Enter the final number\"\
  ))\n\nintTotal = intNoOne + intNoTwo\nintTotal = intTotal + intNoThree\n\nMsgBox\
  \ intTotal\n```\n\n如果用户按照要求输入三个数字，一切运行正常。但用户的行为往往不预期。例如，如果用户先输入数字 3，然后是数字 3，最后是单词“three”，就会发生运行时错误。然而，如果你通过将以下语句作为第一行来修改脚本，VBScript\
  \ 将忽略该错误并显示值 6（即错误发生语句之前 `intTotal` 的值）。\n\n```\nOn Error Resume Next\n```\n\n\n\
  \n\n虽然这种方法有时有效，但仍应谨慎使用。在极少数情况下，忽略脚本某部分的错误不会导致在脚本执行的后续阶段出现另一个错误。此外，某些错误是该语句无法忽略的，并且会阻止脚本的执行。\n\
  \n当将 `On Error Resume Next` 语句添加到脚本开头时，该语句对整个脚本有效。如果你需要，稍后可以禁用此语句的效果；你可以通过在 VBScript\
  \ 中添加以下语句来实现：\n\n```\nOn Error GoTo 0\n```\n\n|  | 备注 | 就像变量一样，你可以将 `On Error Resume\
  \ Next` 语句的作用范围局部化到过程（procedures）中。这使你能够将该语句的影响限制在脚本中可能有用的部分，而不影响整个脚本的行为。 |\n\n\
  ### 开发错误处理例程\n\n处理运行时错误的另一种方法是尝试开发能够处理这些错误的错误处理例程。为了能够有效地实施错误处理程序，你需要预测脚本中可能发生错误的位置，并能够设计出相应的逻辑来处理这种情况。可能的错误恢复操作示例包括：\n\
  \n* 要求用户报告错误\n* 指导用户下一步该做什么\n* 提供更具描述性的错误信息\n* 尝试自动执行纠正操作\n* 如果涉及数据输入，给用户再次尝试\n\
  * 为错误向用户道歉\n\n为了创建错误处理例程，你需要了解如何与 VBScript 的 `Err` 对象配合。此 VBScript 对象提供了访问错误信息的接口，以及用于处理这些信息的方法。`Err`\
  \ 对象有三个属性提供了有关错误事件的以下信息：\n\n* `Number`：上一次错误事件的错误\n* `Description`：上一次错误事件的描述\n\
  * `Source`：引起错误的源对象\n\n这些属性中的每一个都可以修改，允许你在将它们显示给用户之前对其进行重表述并使其更易理解。下面的示例演示了如何创建一个自定义的错误处理例程。\n\
  \n```\nOn Error Resume Next\n\nBogusProcedure()\n\nIf Err > 0 then\n  Err.Number\
  \ = 9000\n  Err.Description = \"This script has attempted to execute a \" _\n  \
  \  \"procedure that has not been defined by the programmer.\"\n  MsgBox \"Error:\
  \ \" & Err.Number & \" - \" & Err.description\nEnd if\n```\n\n设置错误处理程序的第一步是在脚本或过程开头添加\
  \ `On Error Resume Next` 语句。然后，你必须在你认为可能发生错误的语句之后立即添加一个检查错误的语句。你可以通过判断分配给错误 `Err.Number`\
  \ 的错误号是否大于 0 来检查特定错误或任何错误。你可以在 VBScript 中认为认为可能发生错误的任何点进行错误检查，并根据每种情况采取不同的操作。在前面的示例案例中，错误处理程序为用户提供了更具描述性的错误信息。\n\
  \n图 6.11 显示了上一个示例的输出内容。\n\n![点击展开](img/fig6-11_0.jpg)\n\n图 6.11：VBScript 提供了识别和对错误事件做出反应的能力\n\
  \n表 6.10 提供了 VBScript 运行时错误列表。\n\n表 6.10：VBScript 运行时错误\n\n| 十六进制 | 十进制 | 描述 |\n\
