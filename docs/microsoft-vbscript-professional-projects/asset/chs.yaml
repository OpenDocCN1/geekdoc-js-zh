  =\" & vbTab & strRptFormat & vbCrLf & _\n      \"strNetworkNotification\" & vbTab\
  \ & \"=\" & vbTab & strNetworkNotification & _\n        vbCrLf & _\n      \"strConsolFolder\"\
  \ & vbTab & \"=\" & vbTab & strConsolFolder, , cTitleBarMsg\n  End If\n\nEnd Sub\n\
  ```\n\n### `IdentifyRptsToProcess()` 子程序\n\n`IdentifyRptsToProcess()` 的逻辑在书中已多次演示。该子程序负责设置赋值给今天的报告。\n\
  \n```\n Sub IdentifyRptsToProcess()\n\n  Dim strFileName\n\n  strFileName = Replace(Date(),\
  \ \"-\")\n\n  strConsolptName = strConsolFolder & \"\\\" & strFileName &\n    \"\
  _Consolpt.txt\"\n\n  strRpt1 = strArchive & \"\\\" & Left(strSvrList, 8) & \"_\"\
  \ & strFileName\n  strRpt2 = strArchive & \"\\\" & Right(strSvrList, 8) & \"_\"\
  \ & strFileName\n\n  If strDebug = \"Enabled\" Then\n    MsgBox \"1st report to\
  \ process = \" & strRpt1 & vbCrLf &\n    \"2nd report to process = \" & strRpt2\n\
  ```\n\n### `ReadSummaryReport()` 子程序\n\n下所示的 `ReadSummaryReport()` 子程序使用 `FileSystem\
  \ Object` 对象的 `FileExists()`、`OpenTextFile()`、`ReadLine()` 和 `Close()` 方法以及 `Do`\
  \ 循环处理报告。要处理报告通过传递给子程序的参数进行标识。该子程序将每个报告的内容存储在数组 `astr001Array` 或 `astr002Array`\
  \ 中。\n\n```\n Sub ReadSummaryReport(strServerName)\n\n  Dim strSourceFile\n\n  Dim\
  \ FileRef, strRptLine\n\n  Dim intArrayCounter, IntErrLevel\n  intArrayCounter =\
  \ 0\n\n  If strServerName = \"SERV0001\" then\n    strSourceFile = strRpt1\n  Else\n\
  \    strSourceFile = strRpt2\n  End If\n\n  If (FsoObj.FileExists(strSourceFile))\
  \ Then\n    Set FileRef = FsoObj.OpenTextFile(strSourceFile, cForReading)\n    \
  \  Do Until FileRef.AtEndOfStream\n\n        strRptLine = FileRef.ReadLine()\n\n\
  \        If strServerName = \"SERV0001\" Then\n          If Instr(1, intArrayCounter,\
  \ \"Date\") <> 1 Then\n            If Instr(1, intArrayCounter, \"Part\") <> 1 Then\n\
  \              ReDim Preserve astr001Array(intArrayCounter)\n              astr001Array(intArrayCounter)\
  \ = strRptLine\n            End If\n          End If\n        Else\n          If\
  \ Instr(1, intArrayCounter, \"Date\") <> 1 Then\n            If Instr(1, intArrayCounter,\
  \ \"Part\") <> 1 Then\n              ReDim Preserve astr002Array(intArrayCounter)\n\
  \              astr002Array(intArrayCounter) = strRptLine\n            End If\n\
  \          End If\n        End If\n\n        intArrayCounter = intArrayCounter +\
  \ 1\n\n      Loop\n    FileRef.Close()\n\n  Else\n    WriteToEventLog(\"Consolidated\
  \ Summary Report Creator - unable to open \" & _\n      strSourceFile)\n    TerminateScript()\n\
  \  End If\n\nEnd Sub\n```\n\n### `CreateConsolidatedTextReport()` 子程序\n\n下所示的 `CreateConsolidatedTextReport()`\
