  \ WSH 的基本架构。最后，你学习了如何使用 WSH 和 Internet Explorer 创建并执行脚本。\n\n# 第二章：错误、常量和变量\n本章将涵盖许多\
  \ VBScript 主题。它从 VBScript 语句及其语法要求开始，然后描述如何纠正和修复这些类型的错误。创建 VBScript 注释以及定义常量变量的语句也得到了审查。此外，本章将提供有关内置\
  \ VBScript 常量的信息。关于变量的各种主题，包括变量命名规则和限制变量作用域的方法也将进行讨论。\n\n\n\n\nVBScript 由许多编程语句组成，每个语句都执行特定的功能。表\
  \ 2.1 列出了构成 VBScript 编程语言的语句列表。本章将介绍处理 VBScript 注释、常量和变量 VBScript 语句。\n### 表 2.1：VBScript\
  \ 语句\n\n| 语句 | 描述 |\n| `Call` | 将脚本中的控制流重定向到过程 |\n| `Class` | 定义类名 |\n| `Const`\
  \ | 定义常量 |\n| `Do...Loop` | 只要条件为 `True` 或直到条件变为 `True`，就重复一组语句 |\n| `Erase` | 重新初始化数组中的元素\
