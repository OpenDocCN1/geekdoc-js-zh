  \ |\n*术语*在全书中首次被提到时会斜体显示，以突出并强调关键信息。\n# 第一部分：微软 VBScript 基础介绍\n\n## 章节列表\n*   第\
  \ 1 章: 什么是 VBScript？\n*   第 3 章: 条件逻辑和迭代结构\n*   第 4 章: 过程过程\n*   第 5 章: 数组\n*  \
  \ 第 7 章: VBScript 对象\n*   第 9 章: VBScript 与 WSH\n# 第 1 章：什么是 VBScript？\n\n*VBScript*\
  \ 是由微软创建的一种脚本语言。它最初开发用于支持客户端 Web 页面开发。然而，微软随后将其移植到许多编程环境中，包括 `WSH`（Windows 脚本主机）。`WSH`\
  \ 是一个旨在支持在 Windows 操作系统上执行脚本的执行环境。通过提供结合 VBScript 和 `WSH` 的能力，微软为高级用户、程序员以及系统和网络管理员提供了一种脚本语言，该语言使用与\
  \ Visual Basic 闻名的相同的友好且易于学习的语法来支持快速应用程序开发。\n## 介绍 VBScript\nVBScript 是一种解释型脚本语言。VBScript\
  \ 需要一个执行环境才能运行。VBScript 执行环境示例包括 Internet Explorer 和 `WSH`。在 Web 页面开发背景下，VBScript\
  \ 嵌入在 HTML（超文本标记语言）页面中执行。当通过 `WSH` 执行时，VBScript 以 `.vbs` 扩展名的纯文本文件存储，并在 Windows\
  \ 命令行或桌面运行。\n\nVBScript 是改进客户端 Web 页面开发以及开发用于 Windows 操作系统自动化任务的小型脚本的极佳语言。它也是快速开发小型应用程序和工具或原型设计的良好选择。\n\
  VBScript 受限于其执行环境的限制。这意味着虽然嵌入 HTML 页面中的 VBScript 可以验证表单内容并控制浏览器活动，但它无法访问执行计算机上的本地磁盘或其他资源。另一方面，通过\
  \ `WSH` 执行的 VBScript 可以访问本地驱动器和打印机，但它们无法与浏览器资源协作。\n\n嵌入 Web 页面内部的 VBScript 可以执行的任务包括：\n\
  *   创建动画效果\n*   使用对话框与 Internet 和内部网访问者交互\n*   根据检测到的浏览器类型和版本将访问者重定向到特定的 HTML 页面集\n\
  *   验证 HTML 表单\n*   管理 HTML 帧\n为 `WSH` 设计的 VBScript 有完全不同的用途。由 `WSH` 运行的 VBScript\
  \ 可以执行的任务包括：\n*   创建用户账户\n*   创建快捷方式\n*   管理本地驱动器和打印机\n*   管理网络驱动器和打印机\n*   直接与其他应用程序交互\n\
  *   通过修改 Windows 注册表修改系统设置\n*   管理 Windows 服务和服务日志\n### VBScript 的历史\n\n\n\n从编程语言来说，`VBScript`\
  \ 仍然相对较。微软于 1996 年首次引入它，作为 `Internet Explorer 3.0` 的客户端 Web 页面开发脚本语言。然而，在 `VBScript`\
  \ 出现之前，还有另一种客户端脚本语言出现，它在当时被称为 `LiveScript`，后来重命名为 `JavaScript`。`JavaScript` 的领先优势，加上对\
  \ `VBScript` 专有性的担忧，导致微软这种新脚本语言的起步缓慢。此外，Netscape 从未在其浏览器中添加对 `VBScript` 的支持，这使得\
  \ `JavaScript` 成为唯一被普遍支持的客户端脚本语言。因此，尽管 `JavaScript` 很快被互联网社区接受，但 `VBScript` 的成功来得缓慢。\n\
  随着微软发布 `VBScript` 2.0 版本，`VBScript` 的流行开始增加，并使其为 `IIS 3.0`（Internet 信息服务器 3.0）提供了一种服务器端\
  \ Web 开发脚本语言。通过在 `ASPs`（活动服务器服务器页）中嵌入 `VBScripts`，Web 开发人员能够使用 `VBScript` 作为访问存储在服务器端数据库的数据手段，并更轻松地提供动态\
  \ Web 内容。\n`VBScript` 3.0 版本作为许多微软产品的组成组件发布。该产品列表包括：\n*   Internet Explorer 4\n\
  *   IIS 4\n*   Outlook 98\n\n\n`VBScript` 4.0 版本作为 `Microsoft Visual Studio` 应用开发套件的一部分引入，并被赋予了访问\
  \ `Windows` 文件系统的能力。`VBScript` 5.0 版本随着 `Windows 2000` 发布。此外，微软将其作为 `WSH 2.0` 和\
  \ `Internet Explorer 5.0` 的部分进行分。当微软在 2001 年发布 `Windows XP` 和 `Internet Explorer\
  \ 6.0` 时，包含了 `VBScript 5.6` 和 `WSH 5.6`，两者都代表了这些产品的当前发布版本。\n\n\n`VBScript` 是组成 `Visual\
  \ Basic` 编程语言族的三种语言之一。这三种语言包括：\n\n*   `VBA`（Visual Basic Applications）。这种语言用于自定义支持\
  \ `VBA` 的桌面应用程序，例如 `Microsoft Excel` 或 `Microsoft Access`。\n\n虽然这三种语言都紧密相关并共享许多相同特性，但每种设计都是为了适应不同的开发需求。`Visual\
  \ Basic` 设计用于支持新应用程序的开发，而 `VBA` 设计为特定应用程序提供自动化设施。另一方面，`VBScript` 被设计为一种通用的脚本语言，部署在许多不同的环境中。\n\
