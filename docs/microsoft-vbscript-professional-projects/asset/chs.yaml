  \ 第 32 章：报告分发与存档\n\n在本章中，你将观察 Alexander 如何创建一个 VBScript 来移动三个月的 HTML 和 Word 文件。该脚本也将\
  \ HTML 和 Word 文件移动到存档文件夹。随着时间的推移，存档将不断增大。\n\n## 实现远程管理\n\n订单/库存报告项目中最后需要完成的任务是将文件从\
  \ Windows 2000 工作站移动到公司服务器。该脚本也将 HTML 和 Word 文件移动到存档文件夹。随着时间的推移，存档将不断增大。\n\n当他坐下来思考如何完成这些任务时，Alexander\
  \ 想出了三种方法。这些选项包括：\n\n* 使用 Windows 2000 工作站上的 Windows 计划程序触发工作站上的脚本，该脚本建立网络连接并执行存档维护\n\
  * 在公司服务器上设置计划任务以触发本地脚本\n* 使用 Windows 2000 工作站上的 Windows 计划程序将存档脚本复制到服务器并使用 Remote\
  \ WSH 触发其执行\n\n最初，Alexander 倾向于第二种方案，因为它最简单。该方案消除了对以下需求：\n\n* 网络连接\n* 建立远程驱动器\n\
  * 工作站可用性\n\n然而，Molly 建议 Alexander 在服务器上设置计划 WSH VBScript 之前，最好咨询公司的网页管理员。事实证明 Molly\
  \ 是正确的。公司的网页管理员 Michael Barns 毫不告诉 Alexander 他不允许使用服务器的计划程序服务。Alexander 被允许在服务器本地存储和运行任何\
  \ VBScript。\n\n在剩下的两个选项中，Alexander 决定选择 Remote WSH 选项，因为这允许他在本地执行存档维护脚本，而无需将其存储在\
  \ Web 服务器上。Remote WSH 提供了额外的优势，即允许监控远程执行的脚本。\n\n### 介绍 Remote WSH\n\nRemote WSH\
  \ 提供了启动、监控、响应甚至终止远程执行脚本的能力。Remote WSH 是 WSH 版本 5.6 引入的新功能。使用它必须满足以下要求：\n\n* 本地和远程计算机都支持\
  \ WSH 版本 5.6。\n* 本地和远程计算机都运行 Windows NT 4.0 Service Pack 3 或更高版本。\n* 远程计算机需要管理员权限。\n\
  \n除了这些要求外，必须在目标计算机上启用 Remote WSH。这是通过在以下注册表项上添加 Remote 值并将其设置为 1 来的：\n\n```\n HKCU\\\
  Software\\Microsoft\\Windows Script Host\\Settings\\\n```\n\n\n\n\n\n| | Note |\
  \ 如果你正尝试使用 Remote WSH 在运行 Windows XP Professional 版本的计算机上执行远程脚本，你可能需要先在工作站上执行以下命令。\
  \ \n\n```\nWScript -regserver\n```\n\n此命令将 `WScript.exe` 执行宿主机注册为远程 COM 服务器。 |\n\
  \n## 远程 WSH 架构\n\nRemote WSH 由几个对象组成。这些对象及其相关的属性、方法和事件如图 32.1 所示。![点击展开](img/fig32-1_0.jpg)\n\
  \n图 32.1：Remote WSH 包含三个对象\n\n这些对象中位于顶端的是 `WshController` 对象。`WshController` 对象的实例化如下所示。\n\
  \n```\n Set WshControl = CreateObject(\"WshController\")\n```\n\n`WshController`\
  \ 对象没有任何属性，且仅支持一个方法 `CreateScript()`。`CreateScript()` 用于创建 `WshRemote` 对象（即实例化 `WshRemote`\
  \ 对象）。`CreateScript()` 方法的语法所示。\n\n```\n ObjectReference.CreateScript(CommandLine,[ComputerName])\n\
  ```\n\n`ObjectReference` 代表对 `WshController` 对象的引用。`CommandLine` 是一个字符串值，指定要远程运行的脚本的位置以及任何需要包含的开关。必须指定脚本的路径，因为它相对于控制脚本执行的本地计算机的位置。`ComputerName`\
  \ 指定执行远程脚本的远程计算机的 UNC 名称。如果省略了 `ComputerName`，则远程脚本将在本地运行。例如，可以使用以下语句设置一个名为 `RemoteScript`\
  \ 的 `WshRemote` 对象引用，该引用会将名为 `TestScript.vbs` 的脚本复制到名为 `SERV0010` 的计算机并将其加载到 WSH\
  \ 进程中。然而，此时远程脚本尚未开始执行。\n\n``` Set RemoteScript = WshControl.CreateScript(TestScript.vbs,\
  \ SERV0010)\n```\n\n`WshRemote` 对象（`RemoteScript`）代表远程脚本，并提供启动、监控和终止远程脚本的能力。\n\n\
  | | Note | 远程脚本存储在远程计算机的内存中。它永远不会写入远程计算机的硬盘驱动器，并在执行完成后被删除。 |\n\n### WshRemote 方法\n\
  \n`WshRemote` 对象提供了两个方法的访问。`Execute()` 方法用于在脚本复制到远程计算机内存后触发脚本的远程执行。该方法具有以下语法。\n\n\
  ```\n ObjectReference.Execute\n```\n\n`ObjectReference` 指定对 `WshRemote` 对象的引用。为了让之前设置的远程脚本在远程计算机上运行，必须执行以下语句。\n\
  \n```\n RemoteScript.Execute\n```\n\n`WshRemote` 对象的第二个方法是 `Terminate()` 方法。该方法提供了终止远程脚本的能力。它具有以下语法。\n\
  \n```\n ObjectReference.Terminate\n```\n\n`ObjectReference` 指定对 `WshRemote` 对象的引用。例如，要终止在上一个示例中设置远程执行的脚本，控制脚本必须执行以下语句。\n\
  \n```\n RemoteScript.Terminate\n```\n\n### WshRemote 事件\n\n当远程脚本执行时，它们可以触发最多三个不同的事件，这些事件可以被控制脚本跟踪。要设置控制脚本来处理事件，你必须使用\
  \ `WScript` 对象的 `ConnectObject()` 方法，该方法用于对象的事件与具有指定前缀的函数或子程序连接。远程 WSH 事件过程通过分配一个由该前缀加上下划线字符和事件名称组成的名称来建立。`ConnectObject()`\
  \ 方法具有以下语法。\n\n```\n ObjectReference.ConnectObject(TargetObject, EventPrefix)\n\
  ```\n\n`ObjectReference` 代表 `WScript` 对象。`TargetObject` 指定要连接的对象名称，`EventPrefix`\
  \ 指定将作为事件前缀的字符串值。例如，以下语句允许控制脚本使用 `RemoteScript_` 前缀捕获由远程脚本生成的事件。\n\n```\n WScript.ConnectObject\
  \ RemoteScript, \"RemoteScript_\"\n```\n\n表 32.1 列出了远程脚本可以触发的三种类型的事件。\n\n表 32.1：远程脚本触发的事件\n\
  \n| 事件 | 描述 |\n| --- | --- |\n| `Start` | 当远程脚本开始执行时触发 |\n| `End` | 当远程脚本停止执行时触发\
  \ |\n| `Error` | 当远程脚本发生错误时触发 |\n\n使用上一个示例，你可以为远程脚本的 `Start` 事件建立一个事件处理器，如下所示。\n\
  \n```\n Function RemoteScript_Start()\n.\n.\n.\nEnd Function\n```\n\n### WshRemote\
  \ 属性\n\n如果远程脚本发生错误，可以使用 `Error` 事件执行处理由 `WshRemoteError` 对象提供的错误信息的过程。如果远程脚本发生错误，你可以使用\
  \ `WshRemote` 对象的 `Error` 属性获取有关错误的信息。此属性检索 `WshRemoteError` 对象，该对象提供了属性列表访问。表 32.2\
  \ 列出了与 `WshRemoteError` 对象相关的每个属性。\n\n表 32.2：与错误对象相关的属性\n\n| 属性 | 描述 |\n| --- |\
  \ --- |\n| `Description` | 错误的描述 |\n| `Number` | 与错误相关的数字错误代码 |\n| `Line` | 发生错误的行号\
  \ |\n| `Source` | 负责报告错误的对象 |\n| `SourceText` | 生成错误的代码行 |\n| `Character` | 错误发生代码行中的字符位置\
  \ |\n| | Note | 允许 `WshController` 对象工作的后台技术是 `DCOM`，它是分布式组件对象模型（Distributed Component\
  \ Object Model）的缩写。使用 `DCOM`，`WshController` 对象会自动处理控制脚本和远程脚本之间所有的底层通信。 |\n\n`WshRemote`\
  \ 对象的另一个属性是 `Status` 属性，它提供了跟踪远程执行脚本状态的能力。`Status` 属性以数值表示远程脚本的状态。表 32.3 列出并解释了存储在\
  \ `Status` 属性中的不同值。\n\n表 32.3：远程脚本执行状态\n\n| 值 | 描述 |\n| --- | --- |\n| 0 | 远程脚本尚未开始执行。\
  \ |\n| 1 | 远程脚本正在执行。 |\n| 2 | 远程脚本已完成执行。 |\n\n### 快速 Remote WSH 示例\n\n为了确保他对 Remote\
  \ WSH 有良好的理解，Alexander 决定进行快速测试。首先，他编写了一个 VBScript，在执行脚本的计算机的 `c:\\temp` 文件夹中创建一个小型日志文件。他将此脚本命名为\
  \ `TestScript.vbs`。它作为远程脚本执行的。然后，他在 Windows 2000 Professional 工作站上创建并执行了以下控制脚本。\n\
  \n```\n Set wshController = CreateObject(\"WshController\")\nSet wshRemote = wshController.CreateScript(\"\
  TestScript.vbs\", \"\\\\SERV0010\")\n\nWScript.ConnectObject wshRemote, \"RemoteScript_\"\
  \n\nwshRemote.Execute\n\nDo Until wshRemote.Status = strExecutionComplete\n  WScript.Sleep\
  \ 2000\nLoop\n\nSub RemoteScript_Start()\n  MsgBox \"Script TestScript.vbs is not\
  \ executing.\"\nEnd Sub\nSub RemoteScript_End()\n  MsgBox \"Script TestScript.vbs\
  \ is finished.\"\nEnd Sub\n```\n\n\n\n\n控制脚本通过实例化 `WshController` 对象开始。随后，脚本将名为\
  \ `TestScript.vbs` 的脚本复制到名为 `SERV0010` 的计算机，并创建一个名为 `wshRemote` 的 `WshRemote` 对象实例以便进行交互。接下来，使用\
  \ `ConnectObject()` 方法定义事件前缀，以便控制脚本对远程脚本生成的事件做出响应。然后，使用 `Execute()` 方法启动远程脚本。控制脚本随后开始一个循环，每隔\
  \ 2 秒检查一次远程脚本是否完成执行。在此期间，控制脚本的 `RemoteScript_Start()` 和 `RemoteScript_End()` 子程序会在远程脚本启动和结束执行时分别执行。\n\
  \n## 远程 WSH 的局限性\n\n在处理远程 WSH 之前，你必须意识到它的若干局限性。首先，它不支持执行任何生成 GUI 界面的语句。换句话说，你不能在远程执行的脚本中使用\
  \ VBScript 的 `MsgBox()` 或 `InputBox()` 函数，或者 WSH 的 `Echo()` 和 `Popup()` 方法。\n\n\
  远程 WSH 脚本在远程计算机上执行时（使用启动者的凭据），无法访问共享文件夹。此外，远程 WSH 未提供将脚本输出返回给控制脚本的内置机制，将确定如何实现此点的责任留给了脚本开发者。\n\
  \n## 创建最终脚本\n\n在审查了构成远程 WSH 的对象、方法、属性和事件后，Alexander 现在准备好开始开发报告分发和远程存档管理流程了。Alexander\
  \ 将通过开发两个脚本来完成任务。第一个脚本将负责在 Windows 2000 专业版工作站与 Web 服务器之间复制和移动文件，并在每月第一天远程运行第二个较小的存档维护脚本。存档维护脚本将管理公司\
  \ Web 服务器上为期 3 个月的报告和 HTML 文件的存档存储。\n\n### 初始化部分\n\n第一个脚本（称为控制脚本）通过在其 `Initialization\
  \ Section`（初始化部分）中定义全局变量、常量和对象开始，如下所示。`intReturnCode` 被赋值为零，这设置了脚本的默认返回代码。\n\n```\n\
  \ Option Explicit\n\nDim strEventLog, strDebug, strHTMLFolder, strSharedRptFolder,\
  \ strWebSvrName\nDim strConSolRptLoc, strSharedHTMLFolder, strWordRpt, strHTMLRpt,\
  \ intReturnCode\nDim strResults\n\nConst cTitleBarMsg = \"Remote Archive Management\
  \ Script\"\nConst strExecutionComplete = 2\n\nDim FsoObj, WshNtk, WshShl\n\nSet\
  \ FsoObj = CreateObject(\"Scripting.FileSystemObject\")\nSet WshNtk = WScript.CreateObject(\"\
  WScript.Network\")\nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\n\nintReturnCode\
  \ = 0\n```\n\n### 主处理部分\n\n后续所示的控制脚本 `Main Processing Section`（主处理部分）通过调用 `GetRegistrySettings()`\
  \ 子程序开始，从 Windows 2000 专业版工作站的 Windows 注册表中检索配置设置。如果启用了调试模式和事件日志，将显示弹出消息并写入 Windows\
  \ 应用程序事件日志，记录脚本的执行状态。然后调用两次 `MapNetworkDrive()` 函数，并传递公司 Web 服务器上存放报告文件的共享文件夹的驱动器号和\
  \ UNC 名称。\n\n接下来，调用 `GetFileNames()` 子程序确定 HTML 和 Word 文件的名称，这些文件代表要复制到 Web 服务器的当日汇总摘要报告。随后，`CopyAndMoveFiles()`\
  \ 子程序复制当天的 Word 文件并移动当天的 HTML 文件。此外，更新后的 `Archive.html` 页面也会被移动到 Web 服务器。然后执行两次\
  \ `DisconnectNetworkDrive()` 子程序，以删除脚本之前建立的网络驱动器连接。\n\n接下来，执行 `TimeToCleanArchive()`\
  \ 函数以确定是否到了远程运行每月存档维护脚本的时间。如果是，则实例化 `WshController` 对象。然后使用 `CreateScript()` 方法设置\
  \ `WshRemote` 对象引用，并将名为 `RemoteArchiveMgr.vbs` 的存档维护脚本移动到 Web 服务器。随后运行 `WScript`\
  \ 对象的 `ConnectObject()` 方法，允许控制脚本跟踪远程脚本生成的事件。使用 `WshRemote` 对象的 `Execute()` 方法启动远程脚本的执行。设置一个\
  \ `Do...Until` 循环，该循环运行到 `WshRemote` 对象的 `Status` 属性值等于 `strExecutionComplete`（即\
  \ 2）为止。此时，调用 `TerminateScript()` 子程序并结束脚本执行。\n\n```\n GetRegistrySettings()\n\n\
  If strEventLog = \"Enabled\" Then\n  WriteToEventLog(\"Remote Archive Management\
  \ Script now executing.\")\nEnd If\n\nIf strDebug = \"Enabled\" Then\n  MsgBox \"\
  Remote Archive Management Script now executing.\", , cTitleBarMsg\nEnd If\n\nMapNetworkDrive\
  \ \"W:\", \"\\\\\" & strWebSvrName & \"\\\" & strSharedRptFolder\nMapNetworkDrive\
  \ \"X:\", \"\\\\\" & strWebSvrName & \"\\\" & strSharedHTMLFolder\n\nGetFileNames()\n\
  \nCopyAndMoveFiles()\n\nDisconnectNetworkDrive(\"W:\")\nDisconnectNetworkDrive(\"\
  X:\")\n\nIf strDebug = \"Enabled\" Then\n  MsgBox \"Remote Archive Management Script\
  \ now completed.\", , cTitleBarMsg\nEnd If\n\nIf strEventLog = \"Enabled\" Then\n\
  \  WriteToEventLog(\"Remote Archive Management Script finished executing.\")\nEnd\
  \ If\n\nstrResults = TimeToCleanArchive()\n\nIf strResults = \"Yes\" Then\n\n  Set\
  \ wshController = CreateObject(\"WshController\")\n  Set wshRemote = wshController.CreateScript(\"\
  RemoteArchiveMgr.vbs\", \"\\\\\" & _\n    strWebSvrName)\n\n  WScript.ConnectObject\
  \ wshRemote, \"RemoteScript_\"\n\n  wshRemote.Execute\n\n  Do Until wshRemote.Status\
  \ = strExecutionComplete\n             WScript.Sleep 2000\n  Loop\n\nEnd If\n\n\
  TerminateScript(intReturnCode)\n```\n\n### GetRegistrySettings() 子程序\n\n正如你在许多示例中所看到的，下所示的\
  \ `GetRegistrySettings()` 子程序负责从 Windows 注册表中检索脚本的配置设置。\n\n\n\n\n```\n Sub GetRegistrySettings()\n\
  \n  On Error Resume Next\n\n  strEventLog = _\n    WshShl.RegRead(\"HKLM\\Software\\\
  Intuit\\VBScripts\\WebRpting\\EventLogging\")\n    If Err <> 0 Then\n      If strEventLog\
  \ = \"Enabled\" Then\n        WriteToEventLog (\"HTML Report Conversion Script -\
  \ Using default \" & _\n          \"for strEventLog. RC = 4\")\n        TerminateScript(12)\n\
  \      End If\n    End If\n\n    strDebug = WshShl.RegRead(\"HKLM\\Software\\Intuit\\\
  VBScripts\\WebRpting\\Debug\")\n    If Err <> 0 Then\n      If strEventLog = \"\
  Enabled\" Then\n        WriteToEventLog (\"HTML Report Conversion Script - Using\
  \ default & _\n          \"for strDebug. RC = 4\")\n        TerminateScript(12)\n\
  \      End If\n    End If\n\n    strHTMLFolder = _\n      WshShl.RegRead(\"HKLM\\\
  Software\\Intuit\\VBScripts\\WebRpting\\HTMLFolder\")\n    If Err <> 0 Then\n  \
  \    If strEventLog = \"Enabled\" Then\n        WriteToEventLog (\"HTML Report Conversion\
  \ Script - Using default \" & _\n          \"for strHTMLFolder. RC = 4\")\n    \
  \    TerminateScript(12)\n      End If\n    End If\n\n    strConSolRptLoc = _\n\
  \      \"WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\WebRpting\\ConSolRptLoc\"\
  )\n    If Err <> 0 Then\n      If strEventLog = \"Enabled\" Then\n        WriteToEventLog\
  \ (\"HTML Report Conversion Script - Using default \" & _\n          \"for strConSolRptLoc.\
  \ RC = 4\")\n        TerminateScript(12)\n      End If\n    End If\n\n    strSharedRptFolder\
  \ = _\n    \"WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\WebRpting\\Share_Rpts\"\
  )\n    If Err <> 0 Then\n      If strEventLog = \"Enabled\" Then\n        WriteToEventLog\
  \ (\"HTML Report Conversion Script - Using default \" & _\n          \"for strSharedRptFolder.\
  \ RC = 4\")\n        TerminateScript(12)\n      End If\n    End If\n\n    strSharedHTMLFolder\
  \ = _\n      \"WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\WebRpting\\Share_HTML\"\
  )\n    If Err <> 0 Then\n      If strEventLog = \"Enabled\" Then\n        WriteToEventLog\
  \ (\"HTML Report Conversion Script - Using default \" & _\n          \"for strSharedHTMLFolder.\
  \ RC = 4\")\n        TerminateScript(12)\n      End If\n    End If\n\n    strWebSvrName\
  \ = _\n      WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\WebRpting\\WebServer\"\
