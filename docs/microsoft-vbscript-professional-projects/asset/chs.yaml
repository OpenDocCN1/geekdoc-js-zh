  \ `key=value` 对，以提取它们所需的。 |\n\n## 创建 INI 文件处理\n\n现在 Molly 已经设计了 RptLog.ini 文件，她开始开发一个可以用于处理它的过程。稍后当她开始编写每个脚本时，会将此过程整合到这些脚本中。为了访问和处理\
  \ INI 文件，她必须学习如何使用以下 `FileSystemObject` 方法：\n\n*   `FileExists()`\n*   `OpenTextFile()`\n\
  *   `ReadLine()`\n*   `Close()`\n\n使用 `FileSystemObject` 方法的第一步是设置它的实例。这是通过 `WScript`\
  \ 对象的 `CreateObject()` 方法并引用为 `Scripting.FileSystemObject` 完成的，如下所示：\n\n```\n Set\
  \ FsoObject = WScript.CreateObject (\"Scripting.FileSystemObject\")\n```\n\n一旦如所示实例化，您就可以在脚本中使用\
  \ `FsoObject` 引用 `FileSystemObject`。\n\n|  | 备注 | 如果您的 VBScript 将在使用 Windows NT、2000\
  \ 或 XP 操作系统以及 NTFS 文件系统的计算机上运行，您必须采取措施确保您拥有执行 VBScript 任务所需的相应权限。 |\n\n### 验证 INI\
  \ 文件是否存在\n\n在准备处理文件时，始终应该采取的第一步是在尝试打开文件之前验证该文件是否存在。这允许您在文件不存在时避免错误，或者根据需要创建一个新文件。要确定文件是否存在，请使用\
  \ `FileSystemObject` 对象的 `FileExists()` 方法。该方法的语法如下：\n\n```\n ObjectReference. FileExists(FileName)\n\
  ```\n\n`ObjectReference` 是脚本定义的 `FileSystemObject` 实例名称，`FileName` 是要验证是否存在的文件名和路径。如果文件存在，`FileExists()`\
  \ 方法返回 `True`，如果不存在，则返回 `False`。\n\n|  | 备注 | INI 文件可能会由于各种原因被意外删除或重命名。处理这种可能情况的方法是与系统管理员合作，加强\
  \ Windows 安全权限，防止非管理员访问存储脚本和 INI 文件所在文件夹的内容。应对这种情况的另一种方法是尽可能硬编码一组默认配置设置。 |\n\n\n\
  \n\n以下 VBScript 语句演示了如何使用 `FileExists()` 方法来确定名为 `Sample.ini` 的文件是否存在于与 VBScript\
  \ 相同的文件夹中。\n\n```vb\n If (FsoObject.FileExists(\"Sample.ini \")) Then\n  MsgBox\
  \ \"Sample.ini already exists.\"\nElse\n  MsgBox \"Sample.ini does not exist.\"\n\
  End If\n```\n\n| | 注意 |\n| --- | 如果要验证存在性的文件不在与 VBScript 相同的文件夹中，你必须指定其完整路径和文件名。\
  \ |\n\n### 打开 INI 文件\n\n一旦你确认了存储 VBScript 配置设置的 INI 文件存在，你就可以打开它了。要打开一个文件，请使用 `FileSystemObject`\
  \ 对象的 `OpenTextFile()` 方法。该方法打开指定的文件并返回一个 `TextStream` 对象，该对象可用于处理文件内容。`TextStream`\
  \ 对象将文件表示为连续的数据流。`OpenTextFile()` 方法具有以下语法。\n\n```\n ObjectReference.OpenTextFile(FileName,\
  \ [OpenMode, [Create, [FormatType]]])\n```\n\n`ObjectReference` 是分配给脚本内定义的 `FileSystemObject`\
  \ 实例的名称，`FileName` 是要打开的文件名和路径。`OpenMode` 是一个可选参数，指定打开文件的模式，并使用表 17.1 所示的数值之一指定。\n\
  \n表 17.1：`OpenTextFile()` 常量\n\n| 常量 | 说明 | 值 |\n| --- | --- | --- |\n| `ForReading`\
  \ | 打开或创建文件以便读取 | 1 |\n| `ForWriting` | 打开新文件并向其中写入 | 2 |\n| `ForAppending` | 打开现有文件并追加到末尾\
  \ | 8 |\n\n`Create` 是一个可选的布尔参数。当设置为 `True` 时，指定如果指定的文件不存在，则创建它。当设置为 `False` 时，如果指定的文件不存在，则不创建新文件。默认值为\
  \ `False`。`FormatType` 是一个可选参数，指定创建新文件时的文件格式。该参数的可用选项列在表 17.2 中。\n\n表 17.2：`OpenTextFile()`\
  \ 文件格式类型选项\n\n| 值 | 说明 |\n| --- | --- |\n| `TristateTrue` | 以 Unicode 格式打开文件 |\n\
  | `TristateFalse` | 以 ASCII 格式打开文件 |\n| `TristateUseDefault` | 使用操作系统默认的文件类型打开文件\
  \ |\n\n| | 注意 | 在指定要读取、写入还是追加文件时，要特别小心。如果你以 `ForWriting` 模式打开文件且该文件已存在，其内容将被重新初始化，导致所有现有数据丢失。\
  \ |\n\n下面的示例演示了如何打开文件以进行写入。在此示例中，通过指定 `ForWriting` 为其 `OpenMode` 设置，如果文件不存在则创建它。然而，如果文件已存在，则使用\
  \ `ForAppending` 模式打开它。\n\n```vb\n Dim FsoObject, strSourceFile, OpenFile\nConst\
  \ cForReading = 1\nConst cForWriting = 2\nConst cForAppending = 8\nSet FsoObject\
  \ = WScript.CreateObject(\"Scripting.FileSystemObject\")\nstrSourceFile = \"D:\\\
  LogFiles\\DailyRpt.log\"\n\nIf (FsoObject.FileExists(strSourceFile)) Then\n  Set\
  \ OpenFile = FsoObject.OpenTextFile(strSourceFile, cForAppending)\nElse\n  Set OpenFile\
  \ = FsoObject.OpenTextFile(strSourceFile, cForWriting, \"True\")\nEnd If\n```\n\n\
  | | 注意 | 不能同时对打开的文件执行不同类型的操作。换句话说，如果你使用 `ForReading` 模式打开文件，在先关闭并重新打开文件之前，无法切换到\
  \ `ForWriting` 或 `ForAppending` 模式。 |\n\n### 读取 INI 文件\n\n一旦你知道如何打开文件并设置适当的模式，就可以对文件进行读取、写入或追加了。在读取文件时需要采取下面所示的步骤：\n\
  \n* 确定文件是否包含任何数据\n* 读取文件\n* 完成后关闭文件\n\n这些任务中的每一个都将在后续章节中介绍。\n\n#### 确定文件是否包含任何数据\n\
  \n打开文件时要的第一件事是确定它是否包含任何数据。否则，打开它并尝试从中读取是没有意义的。可以使用 `AtEndOfStream` 属性来实现，如果文件包含数据，该属性将返回布尔值\
  \ `True`；如果不包含，则返回 `False`。\n\n你也可以在执行任何读取操作之前继续检查 `AtEndOfStream` 属性的值，以确保没有到达文件末。例如，下面的\
  \ VBScript 语句演示了如何确定文件是否存在以及是否包含数据。如果发现文件包含数据，则设置一个循环来处理文件，当 `AtEndOfStream` 的值变为\
  \ `True` 时终止。\n\n```vb\n Dim FsoObject, strSourceFile, OpenFile\nConst cForReading\
  \ = 1\nConst cForWriting = 2\nConst cForAppending = 8\nSet FsoObject = WScript.CreateObject(\"\
  Scripting.FileSystemObject\")\nstrSourceFile = \"D:\\LogFiles\\DailyRpt.log\"\n\n\
  If (FsoObject.FileExists(strSourceFile)) Then\n  Set OpenFile = FsoObject.OpenTextFile(strSourceFile,\
  \ cForReading)\n    Do while False = OpenFile.AtEndOfStream\n...............\n \
  \   Loop\nElse\n  MsgBox strSourceFile & \" does not exist.\"\nEnd If\n```\n\n所示，在示例开头定义了常量以便读取。接下来实例化\
  \ `FileSystemObject` 实例，并指定要读取的 INI 文件位置。然后执行 `If` 语句以确定 INI 文件是否包含任何数据。如果是，则打开文件进行读取，并执行一个循环来处理文件。循环直到到达文件末尾。\n\
  \n#### 读取整个 INI 文件\n\n处理文件内容的一种方法是使用 `FileSystemObject` 对象的 `ReadLine()` 方法。该方法返回表示文件中一整行的输出字符串。`ReadLine()`\
  \ 方法的语法所示：\n\n```\n ObjectReference.ReadLine()\n```\n\n`ObjectReference` 是分配给脚本内定义的\
  \ `FileSystemObject` 实例的名称。\n\n通过修改所示的示例，你可以开发一个处理之前开发的 RptLog.ini 全部内容的程序。\n\n\
  ```vb\n Dim FsoObject, strSourceFile, OpenFile\nConst cForReading = 1\nConst cForWriting\
  \ = 2\nConst cForAppending = 8\n\nSet FsoObject = WScript.CreateObject(\"Scripting.FileSystemObject\"\
  )\n\nstrSourceFile = \"D:\\VBScripts\\Analyzers\\RptLog.ini\"\n\nIf (FsoObject.FileExists(strSourceFile))\
  \ Then\n  Set OpenFile = FsoObject.OpenTextFile(strSourceFile, cForReading)\n  \
  \  Do while False = OpenFile.AtEndOfStream\n      WScript.Echo(OpenFile.ReadLine())\n\
  \   Loop\n   OpenFile.Close\nElse\n  MsgBox strSourceFile & \" does not exist.\"\
  \nEnd If\n```\n\n前面的示例确保在开始逐行读取内容之前，INI 文件存在且其中有数据。使用 `FileSystemObject` 对象的 `ReadLine()`\
  \ 方法从头到尾尾读取 INI 文件。通过执行 `FileSystemObject` 对象的 `Close()` 方法结束。\n\n\n\n\n\n| Note\
  \ | 在允许 VBScript 结束执行之前，请始终使用 `FileSystemObject` 对象的 `Close()` 方法。否则，当你下次尝试处理该文件时，可能会导致错误的发生。这是因为文件的结束标记标记（EOF\
  \ marker）可能没有被正确创建。 |\n\n如果你将之前的 VBScript 语句保存为脚本并针对 Molly 的 `RptLog.ini` 文件运行，你将看到如图\
  \ 17.1 所示的结果。\n\n![点击展开](img/fig17-1_0.jpg)\n\n图 17.1：处理 INI 文件的全部内容\n\n### 读取 INI\
  \ 文件的某个节\n\n在许多情况下，一次性读取并处理 INI 文件的全部内容可能是合适的。例如，当有多个脚本共享同一个 INI 文件时（如 Molly 项目中的情况），你需要一种方法来一次选择性地处理\
  \ INI 文件的单个节。以下 VBScript 语句演示了实现这一目标的一种方法。\n\n```\n Dim FsoObject, strSourceFile,\
  \ OpenFile, strInputLine, intCounter\n\nConst cForReading = 1\nConst cForWriting\
  \ = 2\nConst cForAppending = 8\n\nSet FsoObject = WScript.CreateObject(\"Scripting.FileSystemObject\"\
  )\n\nstrSourceFile = \"d:\\VBScripts\\Analyzers\\RptLog.ini\"\n\nIf (FsoObject.FileExists(strSourceFile))\
  \ Then\n Set OpenFile = FsoObject.OpenTextFile(strSourceFile, cForReading)\n\n \
  \   Do Until Mid(strInputLine, 1, 15) = \"[DailyReturns]\"\n      strInputLine =\
  \ OpenFile.ReadLine\n    Loop\n\n    Do Until OpenFile.AtEndOfStream = \"True\"\n\
  \      strInputLine = OpenFile.ReadLine\n      If Mid(strInputLine, 1, 1) = \"[\"\
  \ Then\n        Exit do\n      End If\n        WScript.Echo strInputLine\n    Loop\n\
  \n  OpenFile.Close\n\nElse\n  MsgBox strSourceFile & \" does not exist.\"\nEnd If\n\
  ```\n\n设置了一个 `Do`...Until 循环来开始对 INI 文件进行初始处理。在本例中，`Do`...Until 循环会一直运行直到找到 `[DailyReturns]`\
  \ 节头部。这是通过使用 VBScript 的 `MID()` 函数实现的，传递了参数 `1` 和 `15`，它们代表了 `[DailyReturns]` 节头部中方括号的起始和结束字符位置。一旦找到位置，`Do`...Until\
  \ 循环停止执行，并开始运行第二个 `Do`...Until 循环。该循环使用 `ReadLine()` 方法执行并处理存储在 `[DailyReturns]`\
  \ 节中的键=值对。该循环将一直运行，直到找到下一个节 头部（例如，通过查找后续每行的第一个字符是否为 `[` 字符）或到达文件末尾（例如，当 `AtEndOfStream`\
  \ 的值等于 `\"True\"` 时）。 |\n\n| Note | `Mid()` 函数用于从脚本中检索或解析指定数量的字符。其语法所示。 |\n\n```\n\
  \ Mid(string, StartPosition[, Length])\n```\n\n`String` 代表要解析字符的字符串。`StartPosition`\
  \ 指定字符串内解析操作应该开始的字符位置，`Length` 是一个可选参数，指定要返回的字符数。如果省略 `Length` 参数，则返回从起始位置到字符串结束的所有字符。\
  \ |\n\n如果你将之前的 VBScript 语句保存为脚本并针对 Molly 的 `RptLog.ini` 文件运行，你将看到如图 17.2 所示的结果。\n\
  \n![点击展开](img/fig17-2_0.jpg)\n\n图 17.2：将 INI 文件的处理限制为单个节\n\n使用之前的示例作为模板，你可以开发一个过程，并将其整合到报告和日志分析脚本中，以便这些脚本能够从\
  \ Molly 的 INI 文件中检索它们的配置设置。\n\n## 总结\n\n在本章中，你学习了如何使用 INI 文件作为存储 VBScript 配置设置的手段。这包括对其结构和设计的回顾，以及对验证其存在性、打开和读取一个或所有组成\
  \ INI 文件的节的步骤的解释，以及在完成后如何关闭它们。通过使用本章介绍的技术，你将能够将 INI 文件的处理整合到你的 VBScript 中，并开发下一章所需的报告和日志分析脚本。\n\
  \n# 第 18 章：开发脚本日志分析器\n\n在本章中，你将学习如何编写一组报告和日志分析脚本，每个脚本都设计用于处理具有独特格式的文件。通过这样做，你将继续扩展对读取和处理文件相关技术的理解。此外，你还将学习创建输出文件和报告的基本技术。本章还将向你介绍许多\
  \ VBScript 函数和方法。\n\n### 读取报告和日志文件\n\n在上一章中，你学习了如何应用 `FileSystemObject` 的许多方法来读取报告文件的内容。在本章中，你将继续扩展文件\
  \ I/O 脚本的知识，通过学习处理文件的技术来开发本项目的报告和日志分析脚本。你还将学习使用 `SkipLine()` 方法。该方法允许你跳过文件中的行（例如标题），以开发输入文件。\n\
  \n`SkipLine()` 方法的语法所示：\n\n```\n ObjectReference.SkipLine()\n```\n\n`ObjectReference`\
  \ 代表正在处理的文件的实例。\n\n| Note | `SkipLine()` 不允许你反向遍历文件，且仅适用于读取模式打开的文件。 |\n\n`SkipLine`\
  \ 方法不接受任何参数，限制为一次跳过一行。然而，通过将其封装在循环中，你可以重复执行该方法以跳过所需的行数，如下所示：\n\n```\n Set FsoObject\
  \ = CreateObject(\"Scripting.FileSystemObject\")\nSet SampleRpt = FsoObject.OpenTextFile(\"\
  d:\\VBScripts\\Demo\\SampleRpt.txt\", 1)\nFor i = 1 to 3\n SampleRpt.SkipLine()\n\
  Next\n```\n\n在此示例中，打开名为 `SampleRpt.txt` 的文件并跳过了前三行。结果下一个操作将在第四行进行。\n\n### 写入文件\n\
  \n为了完成报告和日志分析脚本的开发，你需要知道向文件中写入文本输出以生成摘要报告。为了执行此任务，你需要学习使用 `FileSystemObject` 对象的\
  \ `WriteLine()` 方法，其语法如下：\n\n```\n ObjectReference.WriteLine([TextMsg])\n```\n\n\
  `ObjectReference` 代表 `FileSystemObject` 的实例。`TextMsg` 是一个可选参数，代表要作为文件中下一行写入的文本字符串。\n\
  \n| Note | `WriteLine()` 在向文件中写入每个文本字符串末尾自动附加换行符。另一种向文件中写入文本数据的方法是使用 `Write()` 方法，它在不附加换行符的情况下将文本字符串写入文件，从而允许通过多次写入操作在文件中创建单行文本。\
  \ |\n\n以下示例演示了如何使用 `WriteLine()` 方法将字符串追加到报告文件的末尾。\n\n```\n Set FsoObject = CreateObject(\"\
  Scripting.FileSystemObject\")\nSet SampleRpt = FsoObject.OpenTextFile(\"d:\\VBScript\\\
  s\\Demo\\SampleRpt.txt\", 8)\nSampleRpt.WriteLine(\"--- Account Summary Report ---\"\
  )\nSampleRpt.Close()\n```\n\n\n\n\n如果你在调用 `WriteLine()` 方法时不提供文本字符串，它将将写入一个空行。你可能需要添加空行，以改进摘要报告中文本输出的显示效果。然而，写入空行的首选方法是使用\
  \ `WriteBlankLines()` 方法，其语法如下：\n\n```\n ObjectReference. WriteBlankLines(NoOfLines)\n\
  ```\n\n`ObjectReference` 是代表 `FileSystemObject` 实例的变量。`NoOfLines` 代表要写入的空行数。\n\n\
  示例演示了如何使用 `WriteBlankLines()` 方法在报告文件的末尾添加两个空行。\n\n```\n Set FsoObject = CreateObject(\"\
  Scripting.FileSystemObject\")\nSet SampleRpt = FsoObject.OpenTextFile(\"d:\\VBScript\\\
  s\\Demo\\SampleRpt.txt\", 8)\nSampleRpt.WriteLine(\"--- Account Summary Report ---\"\
  )\nSampleRpt.WriteBlankLines(2)\nSampleRpt.Close()\n```\n\n## 创建错误日志分析器\n\nMolly\
  \ 将处理第一个报告和日志分析脚本是 `ErrorAnalyzer.vbs`，它将负责执行以下任务：\n\n* 设置脚本配置默认值，以防 `RptLog.ini`\
  \ 文件缺少某些键=值对或已从 Windows 2000 服务器中删除\n* 读取并处理 INI 文件\n* 创建新的摘要报告\n* 向 Windows 应用程序事件日志记录消息\n\
  * 读取并解析 `Error.Log` 日志文件，查找 3 级或更高级事件消息\n* 写入摘要报告文件的 `Errors:` 章节\n\n`ErrorAnalyzer.vbs`\
  \ 需要读取位于 `D:\\VBScripts\\Analyzers` 的 `RptLog.ini` 文件，并处理来自 `[ErrorRpt]` 的键=值对条目，如下所示。\n\
  \n```\n [ErrorRpt]\nSourDir=d:\\Order_Inventory\\Logs\\Error.log\nReportOn=3\nEventLog=True\n\
  DestFile=d:\\Order_Inventory\\SummaryRpts\\\nDebug=False\n```\n\n此外，`ErrorAnalyzer.vbs`\
  \ 必须读取并处理位于 Windows 2000 服务器 `D:\\Order_Inventory\\Logs` 中的 `Error.log` 文件。该文件的副本下所示。\n\
  \n```\n *******************************************************************************\n\
  \nError Report 3/15/03\n\n*******************************************************************************\n\
  \nDate     TimeCode Description\n\n12:15:44 3/15/03 001 Unable to access card reader\
  \ on device wkstn442\n\n12:26:43 3/15/03 005 Invalid application password supplied\
  \ by AMAT01\n\n14:00:14 3/15/03 001 No inventory for part # 58694 - unable to fill\
  \ order 39312\n\n15:05:02 3/15/03 005 Invalid application password supplied by MJLF01\n\
  \n16:16:46 3/15/03 003 Unable to print summary rpt on master printer (no paper)\n\
  \n-------------------------------------------------------------------------------\n\
  \nTotal number of errors reported = 5\n```\n\n### 初始化部分\n\n下一页显示的脚本 `Initialization\
  \ Section`（初始化部分）开始定义脚本全局需要的变量、常量和对象。这包括设置了一个名为 `astrReportArray` 的一维数组，将用于在读取 `Error.log`\
  \ 文件时存储选定的文本行。\n\n还定义了三个常量以使脚本更易读。这些常量被称为 `cForReading`、`cForWriting` 和 `cForAppending`。每个常量代表不同的文件\
  \ I/O 模式。`FileSystemObject` 也被全局实例化，因为它将被脚本中的多个过程使用。最后，变量 `strSourceFile` 被赋值脚本\
  \ INI 文件的名称和路径。\n\n```\n '*************************************************************************\n\
  'Script Name: Script 18.3.vbs\n'Author: Jerry Ford\n'Created: 03/22/03\n'Description:\
  \ 此脚本从 INI 文件中检索配置设置，\n'处理报告文件并创建摘要报告文件。\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nDim FsoObject, strSourceFile, OpenFile,\
  \ strInputLine, intCounter\nDim strSourDir, strReportOn, strEventLog, strDestFile,\
  \ strDebug\n\nReDim astrReportArray(0)\n\nConst cForReading = 1\nConst cForWriting\
  \ = 2\nConst cForAppending = 8\n\nSet FsoObject = WScript.CreateObject(\"Scripting.FileSystemObject\"\
  )\n\nstrSourceFile = \"d:\\VBScripts\\Analyzers\\RptLog.ini\"\n```\n\n### 主处理部分\n\
  \n下一页显示的 `Main Processing Section`（主处理部分）调用了六个过程，然后执行 `WScript` 对象的 `Quit()` 方法。`SetUpDefault()`\
  \ 调用子程序为脚本建立默认配置设置。`ProcessIniFile()` 打开 `RptLog.ini` 文件，从 `[ErrorRpt]` 章节提取键=值对，并将其赋值给本地变量，覆盖任何匹配的默认变量设置。`RefineOutputFileName()`\
  \ 使用 VBScript 的 `Date()` 和 `Replace()` 函数为脚本将创建并写入输出的摘要报告创建一个带有日期戳的文件名。\n\n接下来，使用\
  \ `If` 语句来确定是否向 Windows 应用程序日志记录消息，这是通过检查 `strEventLog` 的值并在适当的情况下调用来实现的。`ProcessReportFile()`\
  \ 过程被调用。\n\n```\n 'Main Processing Section\n\nSetUpDefault()ProcessIniFile()RefineOutputFileName()\n\
  \nIf strEventLog = \"True\" Then\n  WriteToEvent()\nEnd If\n\nProcessReportFile()\n\
  \nRecordSummaryData()\n\n'Terminate execution\nWScript.Quit()\n```\n\n\n\n### SetUpDefaults\
  \ 部分\n\n默认值：\n\n* `strSourDir`: 指定 `Error.log` 文件的位置。\n* `strReportOn`: 指定要报告的最小消息级别。\n\
  * `strEventLog`: 指定脚本是否向 Windows 应用程序日志记录消息。\n* `strDestFile`: 指定保存摘要报告的文件夹。\n*\
  \ `strDebug`: 指定脚本是否以调试模式运行。在调试模式下运行时，弹出对话框将显示中间变量值并识别各个执行的过程，以跟踪脚本进度。\n\n```\n\
  \ 'Procedure Section\n\nSub SetUpDefaults()\n\n  strSourDir = \"d:\\Order_Inventory\\\
  Logs\\Error.log\"\n  strReportOn = 3\n  strEventLog = \"True\"\n  strDestFile =\
  \ \"d:\\Order_Inventory\\SummaryRpts\\\"\n  strDebug = \"False\"\n\nEnd Sub\n```\n\
  \n### ProcessIniFile() 子程序\n\n下所示的 `ProcessIniFile()` 子程序采用了从第 17 章“[使用配置文件控制脚本执行]中的示例\
  \ INI 处理脚本中开发的逻辑。它处理 `RptLog.ini` 文件并提取位于 `[ErrorRpt]` 章节的键=值对。\n\n\n\n\n```\n Sub\
  \ ProcessIniFile()\n\n  Dim strKeyName, intGetEqualsPosition\n\n  If (FsoObject.FileExists(strSourceFile))\
  \ Then\n    Set OpenFile = FsoObject.OpenTextFile(strSourceFile, cForReading)\n\
  \    Do Until Mid(strInputLine, 1, 10) = \"[ErrorRpt]\"\n      strInputLine = OpenFile.ReadLine\n\
  \    Loop\n\n    Do Until OpenFile.AtEndOfStream = \"True\"\n      strInputLine\
  \ = OpenFile.ReadLine\n\n      If Mid(strInputLine, 1, 1) = \"[\" Then\n       \
  \ Exit do\n      End If\n      If Len(strInputLine) <> 0 Then\n        intGetEqualsPosition\
  \ = Instr(strInputLine, \"=\")\n        strKeyName = Mid(strInputLine, 1, intGetEqualsPosition\
  \ - 1)\n\n        Select Case strKeyName\n          Case \"SourDir\"\n         \
  \   strSourDir = Mid(strInputLine, intGetEqualsPosition + 1, _\n              Len(strInputLine))\n\
  \          Case \"ReportOn\"\n            strReportOn = Mid(strInputLine, intGetEqualsPosition\
  \ + 1, _\n              Len(strInputLine))\n          Case \"EventLog\"\n      \
  \      strEventLog = Mid(strInputLine, intGetEqualsPosition + 1, _\n           \
  \   Len(strInputLine))\n          Case \"DestFile\"\n            strDestFile = Mid(strInputLine,\
  \ intGetEqualsPosition + 1, _\n              Len(strInputLine))\n          Case\
  \ \"Debug\"\n            strDebug = Mid(strInputLine, intGetEqualsPosition + 1,\
  \ _\n              Len(strInputLine))\n        End Select\n\n      End If\n\n  \
  \  Loop\n\n  OpenFile.Close()\n\n  End If\n\n  If strDebug = \"True\" Then\n   \
  \ MsgBox \"strSourDir = \" & strSourDir\n    MsgBox \"strReportOn = \" & strReportOn\n\
  \    MsgBox \"strEventLog = \" & strEventLog\n    MsgBox \"strDestFile = \" & strDestFile\n\
  \    MsgBox \"strDebug = \" & strDebug\n  End If\nEnd Sub\n```\n\n当解析出 `key=value`\
  \ 对时，会设置一个 `Select Case` 语句，将脚本配置设置赋值给本地变量，从而覆盖任何匹配的默认设置。\n\n在此子程序结束时，会设置一个 `If`\
  \ 语句来检查赋值给 `strDebug` 变量的值，以确定脚本是否在调试模式下运行。如果是，则按顺序显示这些变量变量的值，以显示脚本配置设置的状态。\n\n\
  ### RefineOutputFileName() 子程序\n\n下一页显示的 `RefineOutputFileName()` 子程序负责确定摘要报告保存的文件名。为了方便摘要报告存档的维护，每个报告都分配了一个包含日期戳的唯一文件名。该子程序使用\
  \ `Date()` 函数获取格式为 `mm/dd/yyyy` 的当前日期。然后使用 `Replace()` 函数将每个反斜杠（`/`）字符替换为连字符（`–`）。\n\
  \n| | 注意事项 |\n|---| | Windows 不允许在文件名中使用反斜杠（`/`）字符。因此使用连字符（`–`）作为替换字符来分隔日期的月、日、年部分。\
  \ |\n\n```\n Sub RefineOutputFileName()\n\n  Dim DataString\n\n  DataString = Replace(Date(),\
  \ \"/\", \"-\")\n\n  strDestFile = strDestFile & DataString & \"_SumRpt.txt\"\n\n\
  End Sub\n```\n\n### ProcessReportFile() 子程序\n\n下方所示的 `ProcessReportFile()` 子程序打开\
  \ `Error.log` 文件进行读取，建立一个 `Do...Loop` 来定位以 `Date` 单词开头的行，然后设置第二个循环来处理文件的剩余部分。在第二个循环的每次迭代中，使用\
  \ `Instr()` 函数来确定 `00` 字符的位置（每个错误事件编号都以两个前导零开头），然后使用 `Mid()` 函数来确定错误消息的事件错误级别。错误级别为\
  \ 3 或更高的错误事件级别消息会被添加到名为 `astrReportArray` 的动态数组中。\n\n如果脚本在调试模式下执行，则使用 `MsgBox()`\
  \ 函数显示添加到数组中的每条错误消息。第二个 `Do...Loop` 将继续迭代，直到所有剩余的错误消息都检查完毕。最后关闭 `Error.log` 文件。\n\
  \n```\n Sub ProcessReportFile()\n\n  Dim FileRef, strRptLine, intGetFirstBlankPosition,\
  \ OutPutFile\n\n  Dim intArrayCounter, IntErrLevel\n  intArrayCounter = 0\n\n  If\
  \ (FsoObject.FileExists(strSourDir)) Then\n    Set FileRef = FsoObject.OpenTextFile(strSourDir,\
  \ cForReading)\n        Do Until Mid(strRptLine, 1, 4) = \"Date\"\n          strRptLine\
  \ = FileRef.ReadLine()\n        Loop\n        Do Until FileRef.AtEndOfStream\n\n\
  \          FileRef.SkipLine()\n          strRptLine = FileRef.ReadLine()\n     \
  \     If Left(strRptLine, 1) = \"-\" Then\n            Exit Do\n          End If\n\
  \          intGetFirstBlankPosition = Instr(strRptLine, \" 00\")\n          intErrLevel\
  \ = Mid(strRptLine, intGetFirstBlankPosition + 3, 1)\n          If intErrLevel <=\
  \ 3 Then\n            ReDim Preserve astrReportArray\n            astrReportArray(intArrayCounter)\
  \ = strRptLine\n          End If\n\n          If strDebug = \"True\" Then\n    \
  \        MsgBox \"Storing '\" & strRptLine & \"' in astrReportArray\"\n        \
  \  End If\n\n          intArrayCounter = intArrayCounter + 1\n        Loop\n   \
  \ FileRef.Close()\n\n  Else\n\n    astrReportArray(intArrayCounter) = \"Error.log\
  \ file not available.\"\n  End If\n\nEnd Sub\n```\n\n### RecordSummaryData() 子程序\n\
  \n下一页显示的 `RecordSummaryData()` 子程序创建一个新的摘要报告文件，并使用 `WriteLine()` 和 `WriteBlankLines()`\
  \ 函数写入标题以及 `Errors:` 部分。然后设置一个 `For...Each` 循环处理存储在 `astrReportArray` 中的字符串并将其写入摘要文件的\
  \ `Errors:` 部分。关闭摘要报告文件。最后，如果在调试模式下运行脚本，则使用 `MsgBox()` 函数显示显示该过程已执行的弹出消息。\n\n```\n\
  \ Sub RecordSummaryData()\n\n  Dim intArrayCounter, OutPutFile, strMessage\n\n \
  \ intArrayCounter = 0\n\n  Set OutPutFile = FsoObject.OpenTextFile(strDestFile,\
  \ 2, \"True\")\n\n  If strDebug = \"True\" Then\n    MsgBox \"Now writing to the\
  \ Summary Report\"\n  End If\n\n  OutPutFile.WriteLine\n\"***************************************************************\"\
  \n  OutPutFile.WriteBlankLines(1)\n  OutPutFile.WriteLine \"Consolidated Summary\
  \ report for \" & Date()\n  OutPutFile.WriteBlankLines(1)\n  OutPutFile.WriteLine\n\
  \"***************************************************************\"\n  OutPutFile.WriteBlankLines(1)\n\
  \  OutPutFile.WriteLine \"Errors:\"\n  OutPutFile.WriteBlankLines(1)\n  OutPutFile.WriteLine\
  \ \"Date     Time Code Description\"\n\n  For Each intArrayCounter In astrReportArray\n\
  \    If Len(intArrayCounter) <> 0 Then\n      OutPutFile.WriteLine intArrayCounter\n\
  \    End If\n  Next\n\n  OutPutFile.Close()\n\n  If strDebug = \"True\" Then\n \
  \   MsgBox \"Done writing to the Summary Report\"\n  End If\n\nEnd Sub\n```\n\n\
  ### WriteToEventLog() 子程序\n\n下方的 `WriteToEventLog()` 子程序实例化 `WshShell` 对象并使用其 `LogEvent()`\
  \ 方法向 Windows 事件日志记录一条消息。该消息被赋值为 4，表示这是一个信息消息。最后，如果在调试模式下运行脚本，则使用 `MsgBox()` 函数显示该过程已执行的弹出消息。\n\
  \n```\n Sub WriteToEventLog()\n\n  Dim WshShl\n\n  Set WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n\n  '4 indicates an information message\n  WshShl.LogEvent 4,\
  \ \"The Daily Error Log Analyzer Script is now running.\"\n\n  If strDebug = \"\
  True\" Then\n    MsgBox \"Event log message has been recorded\"\n  End If\n\nEnd\
  \ Sub\n```\n\n\n\n\n\n| Note |\n| :--- |\n| 要将错误消息写入 Windows 应用程序事件日志，你需要了解如何使用\
  \ `WshShell` 对象的 `LogEvent()` 方法。虽然本章使用该方法来演示如何写入事件日志消息，但并未对其进行详尽介绍。有关如何使用 `LogEvent()`\
  \ 方法的详细说明，请参阅第 20 章“维护 30 天日志存档”。 |\n\n## 创建每日销售报告分析器\n\n与错误日志分析脚本类似，每日销售报告分析脚本读取位于\
