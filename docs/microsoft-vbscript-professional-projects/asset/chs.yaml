  \ HTML 和 Word 报告存档。 |\n\n### 完成前提任务\n\nAlexander 负责执行项目的初步任务，包括自动调度执行该项目的 WSH VBScripts\
  \ 以及创建新的注册表项。为了方便执行项目的 WSH 运行 VBScripts，Alexander 决定修改由 Molly 开发的在 Windows 2000\
  \ 专业工作站上运行的调度脚本（见第 19 章，“调度脚本执行”），如下所示。\n\n|   | 注意 | 通过修改现有的调度脚本，Alexander 将消除许多安全障碍。Molly\
  \ 已经设置让该脚本使用 `ScriptSchlr` 账户运行，该账户提供了管理员级权限。Alexander 已经请求公司 Web 主管 Michael Barns\
  \ 为该账户提供公司 Web 服务器上 `d:\\Intuit\\OrderInventory\\Reporting` 文件夹的完全访问权限。 |\n\n\n\n\
  \n\n```\n '*************************************************************************\n\
  'Script Name: Script 26.1.vbs\n'Author: Jerry Ford\n'Created: 04/25/03\n'Description:\
  \ 此脚本运行与订单/库存报告\n'报告系统相关的脚本\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nOn Error Resume Next\n\nDim WshShl, intRcChk\n\n\
  Set WshShl = WScript.CreateObject(\"WScript.Shell\")\n\nintRcChk = 0\n\n'主处理部分\n\
  \nRunScript(\"ErrorAnalyzer.vbs\")\nRunScript(\"SalesAnalyzer.vbs\")\nRunScript(\"\
  ReturnsAnalyzer.vbs\")\nRunScript(\"ProductionAnalyzer.vbs\")\n\n'为了支持基于 Web 的报告添加的三组新语句\n\
  intRcChk = RunScript(\"HTMLConvert.vbs\")\nIf intRcChk > 0 Then\n  NotifyOperationsStaff(\"\
  HTMLConvert.vbs\")\nElse\n  intRcChk = RunScript(\"ArchiveLinkMgr.vbs\")\n  If intRcChk\
  \ > 0 Then\n    NotifyOperationsStaff(\"ArchiveLinkMgr.vbs\")\n  Else\n    intRcChk\
  \ = RunScript(\"WebArchiveMgr.vbs\")\n    If intRcChk > 0 Then\n      NotifyOperationsStaff(\"\
  WebArchiveMgr.vbs\")\n    End If\n  End If\nEnd If\n\nIf Day(date()) = 1 Then\n\
  \  RunScript(\"ArchiveManager.vbs\")\nEnd If\n\n'终止脚本执行\nTerminateScript()\n\n'过程部分\n\
  \nFunction RunScript(strScriptName)\n\n RunScript = WshShl.Run(ScriptName, 1, True)\n\
  \nEnd Function\n\nSub WriteToEventLog()\n\n  WshShl.LogEvent 4, \"Report and Log\
  \ Analyzer Scheduler Script executing.\"\n\nEnd Sub\n\nSub NotifyOperationsStaff(strFailedScript)\n\
  \n  Dim strUserName, strNtkNotifiyList\n\n  Dim astrNotifyArray\n\n  strNtkNotifiyList\
  \ = _\n    WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\NtkNotifiyList\"\
  )\n\n  astrNotifyArray = Split(strNtkNotifiyList)\n\n  For Each strUserName In astrNotifyArray\n\
  \    WshShl.Run \"Net Send \" & strUserName & \" \" & \"Script \" & _\n\n    strFailedScript\
  \ & \" failed. \" &_\n    \"Please notify The IT Dept.\"\n  Next\n\nEnd Sub\n\n\
  Sub TerminateScript()\n\n  WScript.Quit()\n\nEnd Sub\n```\n\nAlexander 计划在他负责开发的每个由\
  \ WSH 执行的 VBScript 中添加逻辑，以返回一个错误代码，指示这些脚本是否运行成功。通过这种方式，他让调度脚本具备了判断是否发生问题的能力。\n\n\
  |  | 注意  | VBScript 可以使用 `WScript` 对象的 `Quit()` 方法向调用语句返回返回代码，如 第 30 章 中提到的，“将报告转换为\
  \ HTML 文档”所示。 |\n\nAlexander 暂时决定不修改调度脚本现有执行调用的方式。相反，他将向 Molly 解释他做了什么，并建议她对她的 VBScript\
  \ 进行改造，以支持相同的功能。然而，他为自己正在开发的脚本设置了脚本返回代码检查。他这样做的方法是定义名为 `intRcChk` 的变量，并使用它来存储 `RunScript`\
  \ 函数返回的值。如果返回的值大于零，则表示调用脚本内部发生了错误，并将调用 `NotifyOperationsStaff()` 子程序并传递失败脚本的名称。\n\
  \n为了适应这一新功能，Alexander 必须修改 `RunScript()` 过程，将其从子程序改为函数。他还修改了该过程，以便返回由执行的每个脚本提供的返回代码。\n\
  \nAlexander 还修改了调度脚本，将 `WScript.Quit()` 语句移动到它自己的子程序中，以改进调度脚本的整体结构。最后，他在脚本中添加了 `NotifyOperationsStaff()`\
  \ 子程序，该子程序是从创建汇总摘要报告的 VBScript 中复制粘贴的（来自 第 24 章，“处理和合并报告数据”）。通过使用该子程序，调度脚本可以在处理其脚本时向操作人员通知任何错误。这将让\
  \ IT 编程人员有机会在大家上班寻找汇总摘要报告的在线副本之前修复问题。\n\n与其开发一个脚本来为此新脚本创建注册表项和值，Alexander 决定由于他只需要创建七个新的注册表值，不如使用\
  \ `Regedt32` 工具手动创建它们会更快。Alexander 在 `HKLM\\Intuit\\VBScript` 下创建了一个名为 `WebRpting`\
  \ 的新注册表子项，用于存储他新脚本的每个值，下面简要解释如下：\n\n- `HKLM\\Intuit\\VBScript\\WebRpting\\Debug`:\
  \ 指定脚本在执行时是否应在弹出对话框中显示中间结果（例如，当为了故障排除而手动执行时）\n- `HKLM\\Intuit\\VBScript\\WebRpting\\\
  EventLogging`: 指定脚本是否应向 Windows 应用程序事件日志写入信息消息\n- `HKLM\\Intuit\\VBScript\\WebRpting\\\
  ConSolpt`: 指定 HTML 报告所在的 Windows 2000 工作站文件夹\n- `HKLM\\Intuit\\VBScript\\WebRpting\\\
  HTMLFolder`: 指定 HTML 报告所在的 Windows 2000 工作站文件夹位置\n- `HKLM\\Intuit\\VBScript\\WebRpting\\\
  WebServer`: 指定分配给服务器的网络名称\n- `HKLM\\Intuit\\VBScript\\WebRpting\\Share_Rpts`: 指定存储报告副本的服务器共享文件夹名称\n\
  - `HKLM\\Intuit\\VBScript\\WebRpting\\Share_HTML`: 指定存储报告 HTML 版本副本的服务器共享文件夹名称\n\
  \n|  | 注意  | 有关 Windows 注册表及其如何工作的更多信息，请参阅 第 22 章，“开发设置脚本](#LiB0112_split_000.html_926)”。\
  \ |\n\n### 设计网站\n\nAlexander 负责开发项目中的 HTML 部分以及嵌入的 VBScript。正如前文图 26.2 所示，Alexander\
  \ 计划创建一个主页面并使用框架来控制数据的显示。开发此网站需要对 HTML 语法的基础知识，以及对框架设计和实现的熟悉程度。此外，还需要创建和使用 HTML\
  \ 链接来连接各个页面的知识。\n\n### 开发主页\n\n主页面或主页是所有访问者打开 Internet Explorer 浏览器并输入 [`http://Intuit.com/OrdInv/Default.html`](http://Intuit.com/OrdInv/Default.html)\
  \ 时看到的默认页面。为了开发此 HTML 页面，Alexander 需要使用多种开发技术，包括：\n\n- 嵌入 VBScript：提供图形效果并处理存储在客户端\
  \ Cookie 中的设置\n- 创建链接页（左窗）：创建一个指向组成网站的其他 HTML 页面的链接的网页\n- 创建欢迎页（右窗）：为访问者提供自定义的欢迎消息以及使用网站的说明\n\
  - 使用重定向：在允许新访问者访问网站之前，将其重定向到注册和配置页面\n- 实现浏览器检测：确保访问者使用的是支持的 Internet Explorer 版本\n\
  - 读取 Cookie：检索网站注册和配置页面上建立的用户偏好和配置设置\n\n## 创建注册和配置页面\n\n\n\n\n注册与配置页面将用于收集订单/库存报告网站的每位访问者的姓名。此外，它还允许访问者指定个人偏好，例如链接页的背景颜色和他们偏好的默认页面。为了完成该页面的开发，William\
  \ 将不得不使用以下技术：\n\n* HTML 表单\n* VBScript 表单验证功能\n* VBScript 创建和存储 cookie 的能力\n* VBScript\
  \ 控制浏览器状态栏的能力\n* VBScript 使用弹出对话框与访问者交互的能力\n\n### 将汇总摘要报告转换为 HTML 页面\n\nAlexander\
  \ 想要开发一段 VBScript，根据文本版本报告的内容创建汇总摘要报告的 HTML 版本。为此，他将需要使用许多 `FileSystemObject` 对象方法，包括：\n\
  \n* `FileExists()`` 用于在尝试打开文件之前先验证文件是否存在，以避免错误。\n* `OpenTextFile()`` 打开指定的文件，允许通过其他方法对其进一步处理。\n\
  * `ReadLine()`` 提供读取文件中某行文本的能力。\n* `Close()`` 关闭之前打开的文件。\n* `WriteLine()`` 提供向指定文件写入一行文本的能力。\n\
  * `WriteBlankLines()`` 提供在指定文件中写入一个空行的能力。\n\n除了这些方法外，Alexander 还需要对 HTML 语法有深入的理解，并必须使用这些知识在此脚本生成的\
  \ HTML 文件中插入 HTML 格式标签。Alexander 还需要使用 `WshShell` 对象的 `RegRead()` 方法从 Windows 注册表中检索脚本的配置设置。\n\
  \n### 构建报告归档页面\n\n除了设置归档链接管理脚本从 Windows 注册表中检索其配置设置外，Alexander 还需要熟悉以下对象、属性和方法：\n\
  \n* `GetFolder()`` 一个 `FileSystemObject` 方法，提供检索指定文件夹引用的能力。\n* `Folder Object` 文件夹对象。访问与文件夹相关的所有属性。\n\
  * `File Object` 文件对象。访问与文件相关的所有属性。\n* `Files Collection` 文件集合。提供访问指定文件夹中所有文件的权限。\n\
  * `Files Property` 属于 `File` 对象的属性，用于检索 `Files Collection` 的引用。\n\n除了这些新对象、属性和方法外，Alexander\
  \ 还必须使用以下 `FileSystemObject` 方法来生成归档链接管理 HTML 页面：\n\n* `OpenTextFile()`\n* `Close()`\n\
  * `WriteLine()`\n* `WriteBlankLines()`\n\n### 分发 HTML 和 Word 文件并执行归档管理\n\n在项目的最后一个脚本中，Alexander\
  \ 需要学习如何使用 `File` 对象的 `Copy()` 方法，将 HTML 和 Word 文件从 Windows 2000 专业工作站复制到公司的 Web\
  \ 服务器。此外，他还需要使用以下 `WshNetwork` 方法建立到 Web 服务器的网络连接，并在脚本完成后断开该连接。\n\n* `MapNetworkDrive()`\n\
  * `RemoveNetworkDrive()`\n\n具体而言，Alexander 需要将在 Windows 2000 专业工作站上创建的 HTML 页面和\
  \ Word 文件复制到 Web 服务器上列出的文件夹中：\n\n* `D:\\Order_Inventory\\HTML`。存储至少 90 天的 HTML 报告，包含汇总摘要报告的\
  \ Web 版本。\n* `D:\\Order_Inventory\\Rpts`。存储至少 90 天的 Word 报告，包含汇总摘要报告。\n\n最后，为了自动执行归档管理过程，Alexander\
  \ 必须使用以下 `FileSystemObject` 对象方法：\n\n* `FileExists()`\n* `DeleteFile()`\n\n## 总结\n\
  \n本章向您介绍了书中的最后一个案例。提供了分配给 Alexander 和 William 的项目概述。这包括制定了一份项目需求列表。此外，还展示了一个层级设计，概述了提供\
  \ Web 报告解决方案的整体计划。这包括确定每个要开发的脚本，以及创建这些每个脚本时将使用的主要 VBScript 语言结构。在接下来的六章中，您将有机会看到\
  \ Alexander 和 William 如何应对完成此项目涉及的各项任务。\n\n# 第 27 章：网站设计\n\n在本章中，William 将根据上一章概述的高级设计，为订单/库存报告网站提供低级设计。这包括所有界面元素和数据内容的识别和布局。它还包括支持构成网站页面之间导航的链接的识别和布局。此外，William\
  \ 将确定他想使用 VBScript 为网站上的每个页面添加哪些功能，并描述每个 VBScript 将提供什么。\n\n## 订单/库存报告网站快速概述\n\n\
  正如第 26 节所述，“[项目案例：通过企业内网报告应用程序摘要数据]”，Alexander 和 William 计划将订单/库存报告网站组织成 HTML 页面集合。该网站将有一个主页（Main\
  \ page），作为所有访问者的默认页面。从该页面，访问者可以直接访问以下三个页面：\n\n* 每日汇总报告页面。显示今日摘要报告的 HTML 版本。\n* 报告归档页面。显示以前摘要报告的链接列表，并提供下载这些报告的\
  \ Microsoft Word 版本的权限。\n* 注册与配置设置页面。为访问者提供识别网站身份的能力，并指定自定义设置（如背景颜色和默认页面）。\n\n网站主页和注册与配置设置页面提供的内容是静态的，这意味着它们将根据需要由\
  \ William 手动开发和更新。每日汇总报告页面和报告归档页面提供的内容是动态的，这意味着这些页面提供的内容将由 WSH VBScript 在每天早上根据摘要报告中找到的信息创建。\n\
  \n| | 注意 | 本章及接下来的章节假设读者对 HTML 有基础了解。因此，书中仅对创建 HTML 页面所涉及的 HTML 进行了简要解释。如果您觉得需要更多关于\
  \ HTML 以及如何使用它的额外信息，请参阅 Steve Callihan 编写的 *Learn HTML in a Weekend, 3rd Edition*\
  \ (Premier Press, 2000)。 |\n\n## 网站主页\n\nWilliam 决定使用 HTML 框架作为订单/库存报告网站的关键设计元素。他计划通过将显示划分为两个独立的框架来组织该网站所有内容的显示，如图\
  \ 27.1 所示。\n\n图 27.1：订单/库存报告网站处的数据将使用框架\n\n\n\n\n\n左框架将命名为 `left_frame`，用于显示从主页面（Main\
  \ page）可以直接访问的三个 HTML 页面的 链接。右框架将命名为 `right_frame`，用于显示网站提供的内容，包括报告、存档以及注册和配置设置页面的`链接`。\n\
  \n### 定义链接页面\n\n为了在显示左侧提供链接列表，William 计划创建一个名为 `Links.html` 的 HTML 页面，并将此页面加载到 `Default.html`\
  \ 页面（网站主页）的 `left_frame` 框架中。链接页面展示内容的示例参见图 27.2。\n\n![点击展开展开](img/fig27-2_0.jpg)\n\
  \n图 27.2：链接页提供了指向其他 HTML 页面的导航链接\n\n将显示以下链接：\n\n*   今日汇总摘要报告\n*   汇总摘要报告存档\n*  \
  \ 个人配置设置与注册\n\n这些链接都将左对齐。为了增强这些链接的外观，William 计划在链接页面上嵌入若干 VBScript，提供下面概述的功能：\n\n\
  *   `Link rollovers`。当鼠标移入和移出链接时，更改链接的颜色。\n*   `Status bar messages`。在状态栏中显示补充文本消息。\n\
  \nWilliam 将添加悬停效果，当鼠标移动到链接上时，链接颜色将变为红色；移开时变为蓝色。通过这种方式实现悬停效果，William 将让访问者更容易识别当前哪个链接具有焦点（点击左键将打开哪个链接）。此外，每当访问者将指针移动到链接上时，William\
  \ 将在浏览器状态栏上显示描述该链接指向的 HTML 页面的消息，从而在不拥挤主区域的情况下为访问者提供额外信息。\n\n### 定义欢迎页面\n\n默认情况下，所有访问订单/库存报告网站的访问者将在右框架中看到欢迎页面。页面上提供的内容所示图\
  \ 27.3，将包含有关网站的基本信息，以及如果访问者有任何疑问或疑虑时的若干部门的联系信息。\n\n![点击展开展开](img/fig27-3_0.jpg)\n\
  \n图 27.3：欢迎页面将作为默认页面，通过名称问候访问者并提供有关网站的通用信息\n\n在这个看似简单的 HTML 页面上显示的文本外，William 还计划以嵌入\
