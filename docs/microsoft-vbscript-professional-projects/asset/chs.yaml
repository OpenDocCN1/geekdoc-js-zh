  \ :--- |\n| `GetFile` | 返回一个 `File` 对象 |\n| `GetFileName` | 返回指定路径的最后一个文件名或文件夹 |\n\
  | `GetFileVersion` | 返回文件的版本号 |\n| `GetFolder` | 返回与指定路径中的文件夹相关的 `Folder` 对象 |\n\
