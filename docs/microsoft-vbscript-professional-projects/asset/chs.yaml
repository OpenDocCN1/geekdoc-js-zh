  \ 文件时跳过整行 |\n| `Write` | 在 `TextStream` 文件中写入指定的字符串 |\n| `WriteBlankLines` | 向 `TextStream`\
  \ 文件写入指定数量的 `newline`（换行符） |\n| `WriteLine` | 向 `TextStream` 文件写入指定的字符串 |\n\n##\
  \ 运行时字典对象\n\n所有的 VBScript 运行时对象（`Dictionary` 对象外）都设计为与文件和 Windows 文件系统协同工作。这些对象的用法在本书的第三部分、第四部分和第五部分中有详细介绍。本节提供了\
  \ `Dictionary` 对象的回顾。\n\n`Dictionary` 对象和 `FileSystemObject` 对象是两个顶级的 VBScript 运行时对象。`Dictionary`\
  \ 对象提供了根据键-项对设置关联数组的能力。换句话说与传统的 VBScript 数组根据数据在数组中的索引位置来存储和检索数据不同，`Dictionary`\
  \ 对象中存储的项是使用“键”来存储和检索的。该键可以是数字、字符串，或 VBScript 支持的任何数据子类型。`Dictionary` 对象甚至不支持使用索引数字，因为它不是根据顺序存储项的。`Dictionary`\
  \ 对象具有数组的所有优点，同时在存储和检索数据方面提供了更大的灵活性。此外，`Dictionary` 对象还提供了许多属性和方法，增强了你控制存储在 `Dictionary`\
  \ 对象中数据的能力。\n\n`Dictionary` 对象支持以下三个属性：\n\n* `Count`：获取存储在 `Dictionary` 对象中的项的数量\n\
  * `Item`：在 `Dictionary` 对象中检索或添加指定键的项\n* `Key`：在 `Dictionary` 对象中添加一个键\n\n此外，`Dictionary`\
  \ 对象提供了对以下方法的访问：\n\n* `Add`：向 `Dictionary` 对象添加一个键-项对\n* `Exists`：如果指定的键存在于 `Dictionary`\
  \ 对象中，则返回布尔值 `True`，否则返回 `False`\n* `Items`：返回一个包含 `Dictionary` 对象中所有项的数组\n* `Keys`：返回一个包含\
  \ `Dictionary` 对象中所有已存在的键的数组\n* `Remove`：从 `Dictionary` 对象中移除一个键-项对\n* `RemoveAll`：从\
  \ `Dictionary` 对象中移除所有键-项对\n\n为了更好地演示 `Dictionary` 对象的实现，请考虑以下示例。要在 VBScript 中添加\
  \ `Dictionary` 对象的实例，必须首先定义一个可以引用它的变量，然后创建该对象的实例。\n\n```\nDim dicObject\nSet dicObject\
  \ = CreateObject(\"Scripting.Dictionary\")\n```\n\n一旦实例化，你就可以像下面所示将项及其关联键存储在对象中。\n\
  \n```\ndicObject.Add \"Aug2003Rpt\", \"AugReports.txt\"\ndicObject.Add \"Sep2003Rpt\"\
  , \"SepReports.txt\"\ndicObject.Item(\"Oct2003Rpt\") = \"OctReports.txt\"\n```\n\
  \n前两个语句使用 `Add()` 方法向 `Dictionary` 对象添加数据。指定的第一个参数是用于与数据关联的键，它作为第二个参数出现。最后一条语句通过\
  \ `Item()` 属性添加了第三条数据，从而证明了如果你引用一个键/项对，它将会被添加。\n\n```\nIf dicObject.Exists(\"Sep2003Rpt\"\
  ) = True Then\n  MsgBox \"The value stored in Sep2003Rpt is \" & dicObject.Item(\"\
  Sep2003Rpt\")\nEnd If\n```\n\n从 `Dictionary` 对象中移除键/项对与添加它们一样简单。例如，以下语句显示了如何使用 `Remove`\
  \ 方法删除元素：\n\n```\ndicObject.Remove \"Sep2003Rpt\"\n```\n\n或者，如果你倾向于删除 `Dictionary`\
  \ 对象中存储的所有数据，可以像下面所示使用 `RemoveAll()` 方法：\n\n```\ndicObject.RemoveAll\n```\n\n##\
  \ 总结\n\n在本章中，除了回顾这些对象及其相关的属性和方法外，你还学习了如何创建自定义对象。你学习了在开发运行 WSH 的 VBScript 时使用 `Dictionary`\
  \ 对象创建关联数组。还讨论了其他对象模型，包括 Internet Explorer 和 WSH 提供的模型。\n\n第 8 章：VBScript 与 Internet\
  \ Explorer\n\n在之前的章节中，你学习了 VBScript 编程的基础，并接触了 VBScript 的内置和运行时对象。本章重点关注在 Internet\
  \ Explorer 中执行时为 VBScript 提供的特定对象模型。正如你所看到的，这些对象为你提供了使用浏览器对象方法和属性与浏览器对象进行交互的能力。这允许你打开和关闭浏览器窗口、显示弹出消息、验证表单输入、创建视觉效果以及控制用户访问你的\
  \ Web 页面时的许多其他方面。本章还将讨论基于器的事件以及开发对这些事件做出反应的代码。\n\n## Internet Explorer 对象\n\n基于对象的对象代表\
  \ Web 页面或器的特定功能或组件。它们是编程结构，提供了属性和方法，VBScript 可以利用它们交互并控制功能和组件。这些对象由 Internet Explorer\
  \ 给 VBScript 提供，Internet 根据其加载的每个 Web 页面的内容暴露这些对象。\n\n\n\n\n\n从 Internet Explorer\
  \ 3 版本开始，该浏览器的每个新版本都引入了对额外浏览器对象的支持。在当前 Internet Explorer 6.X 版本中发现的许多对象在更早的版本中是不存在的。这使得编程环境变得具有挑战性，因为你无法控制访问者将使用哪种版本的\
  \ Internet Explorer 来查看你的 Web 页面。例如，如果你开发了一个包含 VBScript 的网页，该脚本利用了 Internet Explorer\
  \ 6 版本中可用的对象，而访问者尝试使用 Internet Explorer 4 版本查看你的网页，你的脚本将会失败，结果将不尽如人意。\n\n当然，你始终可以基于最小公约数（你打算支持的最低\
  \ Internet Explorer 版本）来开发脚本，但这意味着要放弃 Internet Explorer 6 版本提供的许多功能。这就是互联网的现状。幸运的是，如果你开发的用于公司内网运行的\
  \ Web 页面，你通常会发现所有用户运行的相同版本的 Internet Explorer。这允许你根据该特定浏览器版本支持的功能和特性来开发 VBScript。或者，你可以开发不同版本的网页，添加代码来测试每个访问者的浏览器类型，并将浏览器重定向到相应的网页集。\n\
  \n| 注意 | 截至本书编写时，微软已发布了四个支持 VBScript 的 Internet Explorer 大版本（版本 3.X、4.X、5.X 和 6.X）。你在书中看到的所有脚本都是使用\
  \ Internet Explorer 6.0 开发和测试的。 |\n\nInternet Explorer 将 Web 页面组织成逻辑树形结构，网页上发现的对象之间存在父、子和兄弟关系。为了演示\
  \ Internet Explorer 如何将此结构应用于典型的 Web 页面，请考虑以下示例。\n\n``````\n <HTML>\n\n  <HEAD>\n\
  \    <TITLE>Script 8.1 - HTML Page Object Organization Example</TITLE>\n  </HEAD>\n\
  \n  <BODY>\n    <P>Welcome to the home page of</P>\n    <P>ABC Enterprises Inc.</P>\n\
  \  </BODY>\n\n</HTML>\n```\n\n图 8.1 显示了 Internet Explorer 如何在逻辑上表示此网页。`document`\
  \ 对象始终处于层次结构的顶端。`document` 对象的子是 `<HTML>` 元素。`<HTML>` 元素有两个子元素，即 `<HEAD>` 和 `<BODY>`\
  \ 元素。`<HEAD>` 元素有一个子元素，而 `<BODY>` 元素有两个子元素。\n\n![点击展开](img/fig8-1_0.jpg)\n\n图 8.1：检查\
  \ Internet Explorer 逻辑上表示网页内容的方式\n\nInternet Explorer 3 和 4 版本支持一组被称为 DHTML 对象模型的集合。从\
  \ Internet Explorer 5 版本开始，浏览器开始支持第二种对象模型，即 DOM。Internet Explorer 5 和 6 版本将 DOM\
  \ 作为其主要对象模型，同时为了向后兼容而提供对 DHTML 对象模型的支持。DHTML 对象模型为 VBScript 提供了访问网页上大多数元素的权限，而 DOM\
  \ 则提供了对每个元素的访问权限。\n\n| 注意 | DOM 由一个名为世界维网联盟（World Wide Web Consortium）的团体开发，并已被所有主要的浏览器采用。要了解更多关于\
  \ DOM 的信息，请查看 [`www.w3c.org/DOM`](http://www.w3c.org/DOM)。 |\n\n### 检查 DHTML 对象模型\n\
  \nDHTML 对象模型将网页上发现的元素组织成逻辑层次结构。`window` 对象位于 DHTML 对象模型的顶端。每个 Web 页面都有一个 `window`\
  \ 对象，包含框架（frames）的页面除外，在这种情况下，除了单个父 `window` 对象外，每个框架都有一个 `window` 对象。`window` 对象提供了许多子对象的访问，如图\
  \ 8.2 所示。\n\n![点击展开](img/fig8-2_0.jpg)\n\n图 8.2：`window` 对象提供了对其他对象的访问，允许 VBScript\
  \ 与 HTML 页面上的元素进行交互并控制它们\n\n`window` 对象提供了你可以用于打开和关闭窗口、在浏览器状态栏或弹出对话框中显示文本以及将 URL\
  \ 加载到 Web 页面的属性和方法。以下列表列出了其子对象提供的功能。\n\n*   `navigator` 对象。提供有关用于查看 HTML 页面的浏览器的信息。\n\
  *   `history` 对象。提供对 `document` 对象历史列表的访问（即自浏览器窗口打开以来访问的 Web 页面）。\n*   `document`\
  \ 对象。提供对当前 HTML 页面上元素的访问。\n*   `location` 对象。提供有关当前加载的 HTML 页面的信息以及加载新 URL 的能力。\n\
  *   `frames` 集合。提供对代表 HTML 页面上定义的每个框架的索引列表的访问。\n\n在 `window` 对象的所有子对象中，你会发现 `document`\
  \ 对象是你最操作的一个。如图 8.3 所示，`document` 对象提供了对许多其他代表 HTML 元素类型的对象的访问。\n\n![点击展开](img/fig8-3_0.jpg)\n\
  \n图 8.3：`document` 对象提供了其他对象的访问\n\n要使用 DHTML 对象模型引用网页上的任何元素，必须根据 DHTML 对象模型引用其位置。例如，查看以下\
  \ HTML 语句。\n\n```html\n <FORM NAME=\"ApplicationForm\">\n  Last Name:\n  <INPUT\
  \ NAME=\"FirstName\" TYPE=\"text\" SIZE=\"10\" MAXLENGTH=\"25\">\n</FORM>\n```\n\
  \n这些语句定义了一个名为 `ApplicationForm` 的 HTML 表单，其中包含一个文本字段。虽然你可以选择开发不分配名称的 HTML 页面，但必须分配名称，VBScript\
  \ 才能引用页面元素。例如，以下 VBScript 语句可以添加到插入 HTML 页面的 VBScript 中，以判断访问者是否输入了文本。\n\n```vbscript\n\
  \ If Len(document.ApplicationForm.FirstName.value) < 1 Then\n  MsgBox \"Last name\
  \ is a required field\"\n End If\n```\n\n可见，要确定是否在文本字段中输入了内容，必须指定其位置，从 HTML 页面的顶端元素（`document`）开始，然后是表单名称（`ApplicationForm`）、字段名称（`FirstName`），最后是\
  \ `value` 属性。\n\n### 检查 DOM\n\nDOM 对 HTML 页面上的所有元素提供了完全控制，并且比 DHTML 对象模型更容易访问。除了可以通过指定在逻辑层次结构中的位置来访问页面上的任何元素外，DOM\
  \ 还允许你在层次结构中向上、向下和导航，而无需通过名称引用元素。DOM 通过使用表 8.1 中列出的属性来实现此功能。\n\n表 8.1：DOM 属性\n\n\
  | 属性 | 描述 |\n| --- | --- |\n| `firstChild` | 对象的第一个子节点 |\n| `lastChild` | 对象的最后一个子节点\
  \ |\n| `childNodes` | 对象所有子对象的集合/数组 |\n| `parentNode` | 对象的父对象 |\n| `nextSibling`\
  \ | DOM 树中紧随其子节点 |\n| `prevSibling` | 在当前子节点之前的子节点 |\n| `nodeName` | HTML 标签的名称\
  \ |\n\n\n\n\n\n| `nodeType` | 指定一个表示 HTML 元素类型（标签、属性或文本）的值 |\n| `nodeValue` | 分配给文本节点的值\
  \ |\n| `data` | 所指定文本节点的值 |\n| `specified` | 指定属性是否已设置 |\n| `attributes` | 该对象所有属性的集合/数组\
  \ |\n\n为了演示这是如何工作的，请考虑以下 HTML 页面：\n\n```html\n <HTML>\n  <HEAD>\n    <TITLE>Script\
  \ 8.2 - A DOM Navigation Example</TITLE>\n  </HEAD>\n\n  <BODY ID=\"BodyTag\">\n\
  \    <P ID=\"TopParagraph\" Name=\"FirstTag\">Welcome to the home page of</P>\n\
  \    <P ID=\"BottomParagraph\">ABC Enterprises Inc.</P>\n  </BODY>\n</HTML>\n```\n\
  \n图 8.4 描绘了 DOM 如何查看此页面的。如你所见，`document` 对象是父对象，它只有一个孩子，即 `<HTML>` 标签，该标签也被称为 `documentElement`。\n\
  \n![点击展开](img/fig8-4_0.jpg)\n\n图 8.4：从 DOM 的视角查看 HTML 页面\n\n以下语句演示了如何使用 DOM 导航到位于\
  \ HTML 页面上的元素。\n\n```vbscript\nwindow.alert(\"The ID for the first element is: \"\
  \ & _\n   document.documentElement.firstChild.tagName)\n```\n\n这条 VBScript 语句通过指定其与\
  \ `document` 对象的关系，引用了 HTML 页面上的 `<HEAD>` 标签。下一条语句通过再次引用 `<BODY>` 标签与 `document`\
  \ 对象的关系显示了 `<BODY>` 标签的。\n\n```vbscript\nwindow.alert(\"The ID for the second element\
  \ is: \" & _\n  document.documentElement.firstChild.nextSibling.tagName)\n```\n\n\
  下一个 VBScript 语句显示了如何显示 ID 为 `BottomParagraph` 的 `<P>` 标签第一个子节点的值。此 VBScript 使用 DOM\
  \ `getElementById()` 方法执行此操作，如下所示。\n\n```vbscript\nwindow.alert(\"The Value associated\
  \ with the BottomParagraph tag \"& _\n  element is: \" & _\n  document.getElementById(\"\
  BottomParagraph\").firstChild.nodeValue)\n```\n\n使用 DOM，你也可以更改分配给 HTML 元素的值，如以下\
  \ VBScript 语句所示。\n\n```vbscript\ndocument.getElementById(\"BottomParagraph\").firstChild.nodeValue=\"\
  ABC Inc.\"\n```\n\n![点击展开](img/fig8-5_0.jpg)\n\n图 8.5：显示分配给特定 HTML 元素的值\n\n该语句首先使用\
  \ `document` 对象的 `getElementById()` 方法引用第二个 `<P>` 标签（即 `BottomParagraph`）。然后它引用\
  \ `<P>` 标签的 `firstChild` 对象的 `nodeValue` 属性。结果是 HTML 页面的内容被动态更改了，如 图 8.6 所示。\n\n\
  ![点击展开](img/fig8-6_0.jpg)\n\n图 8.6：动态更改 HTML 页面的内容\n\n显然，DOM 为导航 HTML 页面以及访问和操作其内容提供了一个强大的工具。DOM\
  \ 非常复杂，本书书中无法完全涵盖所有的对象、属性和方法。然而，你可以访问 [`www.w3c.org/DOM`](http://www.w3c.org/DOM)\
  \ 了解更多。\n\n## 高级浏览器对象\n\n若干高级浏览器对象值得特别关注。这些对象列在下方。\n\n*   `window`\n*   `document`\n\
  *   `location`\n*   `history`\n*   `navigator`\n\n这些每个对象将在后续章节中进行详细描述，并带有示例演示它们如何被嵌入在\
  \ HTML 页面中的 VBScript 使用。\n\n### 使用 window 对象\n\n`window` 对象是对象模型层次结构中的顶层对象。它也是 `document`、`location`、`history`\
  \ 和 `navigator` 对象的父对象。 HTML 页面只建立一个 `window` 对象，除非该页面包含框架（frames），在这种情况下每个帧存在一个\
  \ `window` 对象，并且存在一个父 `window` 对象作为所有其他对象的父对象。\n\n| | 注意 |\n在 图 8.2 中，描绘了多框架对象。在这种背景下，描绘的每个帧都代表\
  \ `window` 对象的另一个实例，并可以统称为集合。 |\n\n除了子对象和集合外，`window` 对象还提供了对属性和方法集合的访问，这些在本章中以及本书的\
  \ 第五部分 中都有演示。例如，以下 HTML 页面包含一个 VBScript，演示了如何使用 `window` 对象的若干方法。\n\n```html\n <HTML>\n\
  \n  <HEAD>\n    <TITLE>Script 8.3 - Working with window object's methods</TITLE>\n\
  \  </HEAD>\n\n  <BODY onLoad=\"window.status = 'Welcome to the ABC Inc. Home page'\"\
  >\n    <H3>ABC Inc. Home Page!<H3>\n\n    <SCRIPT LANGUAGE=\"VBScript\">\n    <!-\
  \ Start VBScript statements\n\n      Option Explicit\n      Dim blnValue, strUserName\n\
  \n      blnValue = window.confirm(\"This web site is the exclusive \" &\n      \
  \  property of ABC Inc. All material here is \" &\n        strictly confidential.\
  \ Click on OK to confirm your &\n        acceptance of these terms and access this\
  \ site.\")\n\n      If blnValue = \"True\" Then\n        strUserName = window.prompt(\"\
  Please type your name.\", \"\")\n        window.alert(\"Welcome \" & strUserName)\n\
  \      Else\n        window.open \"http://www.yahoo.com\", \"Window1\", \"toolbar=no\"\
  ,\nmenubar=No\", \"scrollbar=no\"\n        window.close()\n      End If\n\n    \
  \  'End VBScript statements ->\n    </SCRIPT>\n\n  </BODY>\n\n</HTML>\n```\n\n此示例的基本原理是为访问者提供中间页面\
  \ URL，在重定向到公司网站之前提示他们确认隐私声明。首先，`window` 对象的 `status` 属性用于在浏览器状态栏中显示消息。然后它的 `confirm()`\
  \ 方法用于提示访问者确认权利。接下来使用 document 对象的 `prompt` 方法收集姓名，然后使用 `alert()` 方法欢迎访问者。最后，使用\
  \ window 对象的 `open()` 方法打开一个新的浏览器窗口并将访问者重定向到公司的实际网站（[`www.yahoo.com`](http://www.yahoo.com)\
  \ 在此示例中用于有一个去的地方）。此新窗口配置为没有滚动条、菜单栏或工具栏。此示例以 `close()` 方法关闭原始浏览器窗口结束。图 8.7 显示了访问者被重定向到的网站时第二个浏览器窗口的样子。\n\
  \n### 使用 document 对象\n\n`document` 对象是最常用的对象。`document` 对象的属性和方法提供了对当前加载的 HTML 页面元素的访问。以下示例演示了如何使用这些\
  \ `document` 对象属性和方法：\n\n*   `bgColor`: 获取或设置当前加载的 HTML 页面的背景颜色\n*   `fgColor`:\
  \ 获取或设置当前加载的 HTML 页面的前景颜色\n*   `write()`:在当前加载的 HTML 页面上显示或写入文本字符串\n\n\n\n\n\n```\n\
  \ <HTML>\n\n  <HEAD>\n    <TITLE>脚本 8.4- 使用文档对象操作</TITLE>\n  </HEAD>\n  <BODY>\n\
  \n    <SCRIPT LANGUAGE=\"VBScript\">\n    <!-- 开始隐藏 VBScript 语句\n\n      Option\
  \ Explicit\n\n      document.bgColor=\"black\"\n      document.fgColor=\"yellow\"\
  \n\n      document.write(\"<B>使用 write() 方法显示 </B> <P>\")\n      document.write(\"\
  <B>document 对象属性! </B> <P>\")\n\n      document.write(\"文档标题: \" & document.title\
  \ & \"<P>\")\n      document.write(\"最后修改时间: \" & document.lastModified & \"<P>\"\
  )\n\n    ' 隐藏 VBScript 语句 -->\n    </SCRIPT>\n\n  </BODY>\n\n</HTML>\n```\n\n如你所见，脚本首先将\
  \ HTML 页面的背景颜色和前景颜色更改为黑色和黄色。然后，使用 `document` 对象的 `write()` 方法在 HTML 页面上显示若干行输出。图\
  \ 8.8 显示了该示例生成的 HTML 页面。\n\n![点击展开](img/fig8-8_0.jpg)\n\n图 8.8：使用属于 `document` 对象的属性和方法控制\
  \ HTML 页面的内容和外观\n\n|  | 注意事项  | `document` 对象提供了对许多其他属性的访问，你将在本书的第 V 部分](#LiB0130_split_000.html_1146)\
  \ 中看到它们。一个特别有用的属性是 `cookie` 属性，它让你能够在每位访问者的计算机上存储少量数据。例如，使用 cookie，你可以存储并稍后检索访问者的姓名，并在用户下次返回你的网站时使用它来创建个性化问候消息。\
  \ |\n\n### 使用 location 对象\n\n`location` 对象提供了刷新当前显示的 HTML 页面或使用其 `replace()` 和 `reload()`\
  \ 方法加载不同 URL 的功能。此外，`location` 对象的 `href` 属性可以设置或检索当前加载的 URL 名称。例如，你可以将以下语句添加到嵌入\
  \ HTML 页面中的 VBScript 中，以加载微软的主 URL：\n\n```\n location.href=\"http://www.microsoft.com\"\
  \n```\n\n作为一个工作性示例，以下 VBScript 显示了如何使用 `location` 对象的 `href` 属性通过 HTML 下拉选择表元素加载用户选择的\
  \ URL。\n\n```\n <HTML>\n\n  <HEAD>\n    <TITLE>脚本 8.5 - 使用 navigator 对象加载网页</TITLE>\n\
  \  </HEAD>\n\n  <BODY>\n\n    <SCRIPT LANGUAGE=\"VBScript\">\n    <!-- 开始隐藏 VBScript\
  \ 语句\n\n      Option Explicit\n\n      Function OpenButton_onClick()\n        location.href=document.OnLineSitesForm.SupportList.value\n\
  \      End Function\n\n  ' 隐藏 VBScript 语句 -->\n  </SCRIPT>\n\n  <H2>在线支持网站</H2>\n\
  \n    <FORM NAME=\"OnLineSitesForm\">\n      <SELECT NAME=\"SupportList\" size=1>\n\
  \      <OPTION VALUE=\"http://www.microsoft.com\"> Microsoft\n      <OPTION VALUE=\"\
  http://www.compaq.com\"> Compaq\n      <OPTION VALUE=\"http://www.dell.com\"> Dell\n\
  \      <OPTION VALUE=\"http://www.ibm.com\"> IBM\n      <OPTION VALUE=\"http://www.gateway.com\"\
  > Gateway\n      </SELECT>\n      <INPUT NAME=\"OpenButton\" TYPE=\"button\" VALUE=\"\
  打开供应商站点\">\n    </FORM>\n  </BODY>\n\n</HTML>\n```\n\nHTML 页面和 VBScript 通过在访问者选择表单下拉列表中的某一项时触发\
  \ `OpenButton` 表单元素的 `click` 事件来工作。这反过来执行了 `OpenButton_onClick` 函数。该函数使用 `location`\
  \ 对象的 `href` 属性加载与访问者选择相关的 URL，如下所示。\n\n```\n window.location=document.myForm.myList.value\n\
  ```\n\n图 8.9 显示允许访问者选择新 URL 的 HTML 页面。从下拉列表中选择一个供应商名称后，将加载与该选择相关的 URL，替换当前加载的 URL。\n\
  \n![点击展开](img/fig8-9_0.jpg)\n\n图 8.9：使用 `location` 对象的 `href` 属性开发自定义导航控制\n\n###\
  \ 使用 history 对象\n\n`history` 对象提供了另一种控制浏览器导航的方法。通过使用该对象的 `back()` 和 `forward()`\
  \ 方法，你可以程序化地遍历浏览器历史记录中存储的 URL 列表（此浏览器最近打开的 URL 列表）。此外，你可以使用 `history` 对象的 `go()`\
  \ 方法加载列表中的任何 URL。例如，以下语句指示 Internet Explorer 加载之前过的 URL：\n\n```\n history.back()\n\
  ```\n\n同样，要向历史列表向前移动一个位置，可以使用以下语句：\n\n```\n history.forward()\n```\n\n要刷新当前加载的 URL，请使用以下语句：\n\
  \n```\n history.go(0)\n```\n\n要在历史列表中向后或向前跳转若干位置，请向 `go()` 方法传递正数或负数。\n\n### 使用\
  \ navigator 对象\n\n`navigator` 对象提供了对以下属性的访问：\n\n*   `appCodeName` 返回分配浏览器的代码名称\n\
  *   `appName` 返回浏览器名称\n*   `appVersion` 返回浏览器版本信息\n\n以下示例演示了使用 `appName` 和 `appVersion`\
  \ 属性的一种方法。该示例中的 VBScript 会询问浏览器并跳转到另一个 URL 或显示需要 Internet 的消息。该示例对于非 Internet 浏览器，显示相同的消息。\n\
  \n```\n <HTML>\n\n  <HEAD>\n    <TITLE>脚本 8.6 - 检测浏览器类型和版本</TITLE>\n  </HEAD>\n\n\
  \  <BODY>\n\n    <SCRIPT LANGUAGE=\"VBScript\">\n    <!-- 开始隐藏 VBScript 语句\n\n \
  \     Option Explicit\n\n      Dim strBrowserName, strBrowserVersion, strFindString\n\
  \      Dim intVersionNumber\n\n      strBrowserName=navigator.appName\n\n      If\
  \ strBrowserName = \"Microsoft Internet Explorer\" Then\n\n        strBrowserVersion\
  \ = navigator.appVersion\n\n        strFindString = Instr(1, strBrowserVersion,\
  \ \"MSIE\")\n        strFindString = strFindString + 5\n        intVersionNumber\
  \ = Mid(strBrowserVersion, strFindString, 1)\n\n        If intVersionNumber < 5\
  \ then\n          'document.write(\"此网站需要 IE 5 或更高版本\")\n        Else\n        \
  \  window.location=\"http://www.yahoo.com\"\n        End If\n      End If\n\n  \
  \  ' 隐藏 VBScript 语句 -->\n    </SCRIPT>\n\n    访问此网站请使用 Internet Explorer 5 或以上版本。\n\
  \  </BODY>\n\n</HTML>\n```\n\n此示例首先将 `strBrowserName` 设置为 `navigator.appName`。然后它检查赋值给此变量的值是否等于\
  \ `Microsoft Internet Explorer`。如果是，则将 `navigator.version` 的值赋值给名为 `strBrowserVersion`\
  \ 的变量。以下三个语句随后解析出浏览器的版本号。\n\n```\n strFindString = Instr(1, strBrowserVersion, \"\
  MSIE\")\nstrFindString = strFindString + 5\nintVersionNumber = Mid(strBrowserVersion,\
  \ strFindString, 1)\n```\n\n\n\n\n\n例如，如果使用 Internet Explorer 6.X 版本加载 HTML 页面，则\
  \ `strBrowserName` 的值将被设置为以下内容：\n\n```\n 4.0 (compatible; MSIE 6.0; Windows NT 5.1;\
  \ Q312461)\n```\n\n第一条语句使用 VBScript 的 `Instr()` 函数设置一个值，指示字母 `MSIE` 在 `strFindString`\
  \ 中的起始位置。第二条语句在该数字的基础上加上 5。第三条语句接着使用 VBScript 的 `Mid()` 函数剥离浏览器的主版本号（即 6）。\n\n如果浏览器的版本号小于\
  \ 5（例如 Internet Explorer 4.X 版本），则网页上将显示一条消息，告知访问者需要 Internet Explorer 5.X 或更高版本才能访问该网站。如果版本号为\
  \ 5 或更大，则使用 `location` 对象的 `href` 属性来加载指定的 URL。\n\n| | 注意 | 如果访问者使用的是 Netscape Communicator\
  \ 或任何非 Internet Explorer 兼容的浏览器，浏览器将自动忽略嵌入的 VBScript，转而显示位于 HTML 页面底部的以下消息： |\n\n\
  ```\n Sorry. To access this web site use Internet Explorer version 5 or above.\n\
  ```\n\n| | |\n\n## 处理浏览器事件\n\n为了与你网站的访问者真正交互，你需要开发 VBScript，以便在访问者导航和操作你的网站时做出反应。每当你的\
  \ HTML 页面发生任何变化时，就会发生一个事件。例如，当 HTML 页面加载到浏览器时，会发生 `load` 事件；当它卸载时，会发生 `unload` 事件。当访问者将指针移入或离开链接、按钮和图像，或者与\
  \ HTML 表单上的各种元素交互时，也会发生事件。\n\n你可以使用 VBScript 创建事件处理器来对发生的事件做出反应。`event handler`（事件处理器）是一个在事件发生时触发的触发器。例如，你可以创建一个事件处理器，在访问者首次加载你的\
  \ HTML 页面时在弹出框中显示欢迎消息，或者在浏览器卸载你的 HTML 页面之前感谢用户的访问。此外，你还可以使用事件处理器通过在访问者指针悬过链接时更改文本颜色创建图形效果。你可能还会使用事件处理器在用户与\
  \ HTML 表单字段交互时对这些字段进行验证。\n\n事件处理器与特定对象相关。换句话说，如果你有一个定义了四个链接的 HTML 页面，那么你可以创建单独的事件处理器来管理每个单独链接的用户交互性。\n\
  \n表 8.2 提供了浏览器事件及其相关事件处理器的列表。如你所示，事件处理器的名称是通过在其关联的事件名称开头添加单词 `on` 来确定的。\n\n### 表\
  \ 8.2：文档对象模型事件和事件处理器\n\n| 属性 | 事件 |  |\n| --- | --- | --- |\n| `Abort` | `onAbort`\
  \ | 当访问者在图像加载时中止加载时执行 |\n| `Blur` | `onBlur` | 当当前选中的对象失去焦点时执行 |\n| `Change` | `onChange`\
  \ | 当访问者更改对象时执行 |\n| `Click` | `onClick` | 当访问者点击对象时执行 |\n| `DblClick` | `onDblClick`\
  \ | 当访问者双击对象时执行 |\n| `DragDrop` | `onDragDrop` | 当访问者将对象拖放到到框架或窗口上时执行 |\n| `Error`\
  \ | `onError` | 当 HTML 页面上发生错误时执行 |\n| `Focus` | `onFocus` | 当访问者选择对象时执行 |\n| `KeyDown`\
  \ | `onKeyDown` | 当访问者按下按键时执行 |\n| `KeyPress` | `onKeyPress` | 当访问者按下并释放按键时执行 |\n\
  | `KeyUp` | `onKeyUp` | 当访问者释放按键时执行 |\n| `Load` | `onLoad` | 当 HTML 页面或图像加载完成时执行\
  \ |\n| `MouseDown` | `onMouseDown` | 当访问者按下鼠标键时执行 |\n| `MouseMove` | `onMouseMove`\
  \ | 当访问者移动指针时执行 |\n| `MouseOut` | `onMouseOut` | 当访问者将指针离开对象时执行 |\n| `MouseOver`\
  \ | `onMouseOver` | 当访问者将指针移过对象时执行 |\n| `MouseUp` | `onMouseUp` | 当访问者释放鼠标键时执行 |\n\
  | `MouseWheel` | `onMouseWheel` | 当旋转鼠标轮时执行 |\n| `Move` | `onMove` | 当访问者移动框架或窗口时执行\
  \ |\n| `Reset` | `onReset` | 当访问者点击重置按钮时执行 |\n| `Resize` | `onResize` | 当访问者调整框架或窗口大时执行\
  \ |\n| `Select` | `onSelect` | 当访问者选择表单文本字段的内容时执行 |\n| `Submit` | `onSubmit` | 当访问者点击提交按钮时执行\
  \ |\n| `Unload` | `onUnload` | 当访问者关闭浏览器窗口或框架或加载不同的 URL 时执行 |\n\n在 HTML 页面中设置事件处理器有很多不同的方法。例如，你可以将它们直接嵌入\
  \ HTML 标签中，如下所示。\n\n```\n <BODY onLoad=\"window.status\">\n```\n\n此语句会在 HTML 页面加载时在浏览器的状态栏中显示欢迎消息。设置事件处理器的另一种方法是将它们设置为过程。为了实现这一点，你必须根据想要使其反应的事件来命名你的过程。例如，为了创建一个在用户指针移过名为\
  \ `strLogo` 的链接时做出反应的事件处理器，你需要像下面所示命名你的过程。\n\n```\n Sub strLogo_onMouseOver\n  window.status\
  \ = 'ABC Enterprises Inc.'\nEnd Sub\n```\n\n另一种设置事件处理器的方法是将它们嵌入 `<SCRIPT>` 标签中，如下所示。\n\
  \n```\n <SCRIPT FOR=\"strLogo\" EVENT=\"onMouseOver\" LANGUAGE=\"VBScript\">\n \
  \ window.status = \"ABC Enterprises Inc.\"\n</SCRIPT>\n```\n\n\n\n\n\n这两条语句执行位于\
  \ HTML 页面 `HEAD` 部分的两个 VBScript 过程。第一条语句在浏览器最初加载 HTML 页面或访问者刷新页面时执行。第二条语句在访问者加载不同的\
  \ URL 或关闭浏览器时执行。无论哪种情况，都会显示一个弹出消息，欢迎访问者或与其告别。图 8.10 显示了当脚本的 `Goodbye()` 函数执行时（即触发\
  \ `Unload` 事件时）所弹出的对话框。\n\n![点击展开](img/fig8-10_0.jpg)\n\n图 8.10：使用 `onLoad` 和 `onUnload`\
  \ 事件处理器触发文本消息的显示\n\n### 鼠标和键盘事件\n\n作为设置事件处理器的最后一个示例，以下 VBScript 使用 `onMouseOver`\
  \ 和 `onMouseOut` 事件处理器为几个 HTML 链接创建图形化菜单悬停效果。为了为这些链接设置悬停效果，必须在 HTML 页面上定义的每个链接上添加\
  \ `NAME` 属性。然后，必须为每个链接定义一对过程，一个用于 `onMouseOver` 事件处理器，另一个用于 `onMouseOut` 事件处理器。随后，每个过程必须修改分配给链接文本的颜色属性。\n\
  \n```\n <HTML>\n  <HEAD>\n    <TITLE>脚本 8.8 - 使用鼠标事件创建悬停效果</TITLE>\n\n    <SCRIPT\
  \ LANGUAGE=\"VBScript\">\n    <!- 开始隐藏 VBScript 语句\n\n      Function gateway_onMouseOver\n\
  \        gateway.style.color=\"red\"\n      End Function\n      Function gateway_onMouseOut\n\
  \        gateway.style.color=\"blue\"\n      End Function\n\n      Function compaq_onMouseOver\n\
  \        compaq.style.color=\"red\"\n      End Function\n      Function compaq_onMouseOut\n\
  \        compaq.style.color=\"blue\"\n      End Function\n      Function dell_onMouseOver\n\
  \        dell.style.color=\"red\"\n      End Function\n      Function dell_onMouseOut\n\
  \        dell.style.color=\"blue\"\n      End Function\n\n    ' 隐藏 VBScript 语句 -->\n\
  \    </SCRIPT>\n  </HEAD>\n\n  <BODY>\n    <B>选择供应商站点：B><P>\n    <A HREF=\"http://www.gateway.com\"\
  \ NAME=\"gateway\"> Gateway</A><P>\n    <A HREF=\"http://www.compaq.com\" NAME=\"\
  compaq\"> Compaq</A><P>\n    <A HREF=\"http://www.dell.com\" NAME=\"dell\"> Dell</A><P>\n\
  \  </BODY>\n</HTML>\n```\n\n图 8.11 显示了 Web 页面由 Internet Explorer 加载时的外观。遗憾的是，这张图无法完全展示示例。为了更详细地查看此图，请从\
  \ [`www.premierpressbooks.com/download.asp`](http://www.premierpressbooks.com/download.asp)\
  \ 下载它。正如你在运行时看到的那样，当指针移入和移离开链接时，颜色会从红色变为蓝色。\n\n![点击展开](img/fig8-11_0.jpg)\n\n图 8.11：使用\
  \ `onMouseOver` 和 `onUnload` 事件处理器创建图形化悬停效果\n\n## 总结\n\n在本章中，你学习了 DOM 和 DHTML 对象模型。你还学习了如何开发与这些对象模型提供的对象交互的脚本，以增强你对\
  \ HTML 页面的控制。此外，你还学习了浏览器事件以及如何设置事件处理器，以开发允许你创建交互式 HTML 页面的过程。\n\n# 第 9 章：VBScript\
  \ 与 WSH\n\n在本章中，你将学习 WSH 提供的对象、属性和方法。随后，你将学习如何使用这些对象来访问和操作大量的 Windows 资源。本章还将演示如何创建可以接收并处理运行时传递参数的脚本。最后，你将学习如何使用\
  \ XML（`扩展标记语言`）创建一种新的脚本文件，这将允许你将用不同脚本语言编写的两个或多个独立脚本合并到一个新的 Windows 脚本文件中。\n\n##\
  \ WSH 对象模型\n\nWSH 的核心是它的核心对象模型。构成该模型的对象提供了直接访问其所代表的 Windows 资源的权限。WSH 核心对象模型总共由\
  \ 14 个对象组成。这些对象及其它们之间的关系在图 9.1 中所示。\n\n![点击展开](img/fig9_1_0.jpg)\n\n图 9.1：WSH 核心对象模型由\
  \ 14 个独立对象组成\n\n`WScript` 对象位于对象模型的顶端或根节点。`WScript` 对象由 WSH 在脚本执行开始时隐式实例化，这意味着脚本可以自动访问它的任何属性或方法。WSH\
  \ 核心对象模型中的所有其他对象都必须先实例化，才能使用它们的属性和方法。\n\n### 公共对象\n\n`WScript` 对象在脚本执行开始时自动暴露。`WScript`\
  \ 对象也被称为公共对象。`WScript` 对象包含了 `WshController`、`WshShell` 和 `WshNetwork` 对象。要实例化这些对象，必须使用\
  \ `WScript` 对象的 `CreateObject()` 方法。表 9.1 提供了构成 WSH 核心模型的 10 个对象列表。\n\n表 9.1：低级对象\n\
  \n| 对象 | 实例化方法 |\n| --- | --- |\n| `WshArguments` | `WScript.Arguments` |\n| `WshNamed`\
  \ | `WScript.Arguments.Named` |\n| `WshUnnamed` | `WScript.Arguments.Unnamed` |\n\
  | `WshRemote` | `WshController.CreateScript()` |\n| `WshRemote` | `WshRemote.Error`\
  \ |\n| `WshShortcut` | `WshShell.CreateShortcut()` |\n| `WshUrlShortcut` | `WshShell.CreateShortcut()`\
  \ |\n| `WshEnvironment` | `WshShell.Environment` |\n| `WshSpecialFolders` | `WshShell.SpecialFolders`\
  \ |\n| `WshScriptExec` | `WshShell.Exec()` |\n\n### WSH 对象属性和方法\n\n对象模型中的每个对象都有其独特的属性和方法。表\
  \ 9.2 提供了 WSH 对象的简要描述。此外，它还提供了与每个对象相关的属性和方法列表。\n\n表 9.2：WSH 对象\n\n| 对象 | 描述 |\n\
  | --- | --- |\n| `WScript` | 这是 WSH 的根对象。它提供了许多实用的属性和方法。它提供了对 WSH 对象模型中其余对象的访问。属性：`Arguments`、`FullName`、`Interactive`、`Name`、`Path`、`ScriptFullName`、`ScriptName`、`StdErr`、`StdIn`、`StdOut`\
  \ 和 `Version` 方法：`ConnectObject(), CreateObject(), DisconnectObject(), Echo(), GetObject(),\
  \ Quit(), 和 Sleep()` |\n| `WshArguments` | 该对象允许访问执行时传递给脚本的命令行参数。属性：`Count`、`Item`\
  \ 和 `Length`；`Named` 和 `Unnamed` 方法：`Count()` 和 `ShowUsage()` |\n| `WshNamed` |\
  \ 该对象提供一组命名的命令行参数。属性：`Item` 和 `Length` 方法：`Count()` 和 `Exists()` |\n| `WshUnnamed`\
  \ | 该对象提供一组未命名的命令行参数。属性：`Item` 和 `Length` 方法：`Count()` |\n| `WshController` | 该对象提供创建远程脚本进程的能力。属性：该对象不支持任何属性。方法：`CreateScript`\
  \ |\n| `WshRemote` | 该对象提供了通过网络使用脚本管理远程计算机的能力。属性：`Status` 和 `Error` 方法：`Execute()`\
  \ 和 `Terminate()` |\n\n\n\n\n\n| `WshRemoteError` | 此对象提供访问远程脚本产生的错误信息。属性：`Description`、`Line`、`Character`、`SourceText`、`Source`\
  \ 和 `Number`。方法：此对象不支持任何方法。 |\n| `WshNetwork` | 此对象提供许多不同的网络资源，例如网络打印机和驱动器。属性：`ComputerName`、`UserDomain`\
  \ 和 `UserName`。方法：`AddWindowsPrinterConnection()`、`AddPrinterConnection()`、`EnumNetworkDrives()`、`EnumPrinterConnection()`、`MapNetworkDrive()`、`RemoveNetworkDrive()`、`RemovePrinterConnection()`\
  \ 和 `SetDefaultPrinter()` |\n| `WshShell` | 此对象提供访问 Windows 注册表、事件日志、环境变量、快捷方式和应用程序。属性：`CurrentDirectory`、`Environment`\
  \ 和 `SpecialFolders`。方法：`AppActivate()`、`CreateShortcut()`、`ExpandEnvironmentStrings()`、`LogEvent()`、`Popup()`、`RegDelete()`、`RegRead()`、`RegWrite()`、`Run()`、`SendKeys()`\
  \ 和 `Exec()` |\n| `WshShortcut` | 此对象为脚本提供了创建和操作 Windows 快捷方式的方法和属性。属性：`Arguments`、`Description`、`FullName`、`Hotkey`、`IconLocation`、`TargetPath`、`WindowStyle`\
  \ 和 `WorkingDirectory`。方法：`Save()` |\n| `WshUrlShortcut` | 此对象为脚本提供了创建和操作 URL 快捷方式的方法和属性。属性：`FullName`\
  \ 和 `TargetPath`。方法：`Save()` |\n| `WshEnvironment` | 此对象提供访问 Windows 环境变量。属性：`Item`\
  \ 和 `Length`。方法：`Remove()` 和 `Count()` |\n| `WshSpecialFolders` | 此对象访问特殊的 Windows\
  \ 文件夹，允许脚本配置开始菜单、桌面、快速启动工具和其他特殊的 Windows 文件夹。属性：`Item`。方法：`Count()` |\n| `WshScriptExec`\
  \ | 此对象提供访问使用 `Exec` 方法运行的脚本的错误信息。属性：`Status`、`StdOut`、`StdIn` 和 `StdErr`。方法：`Terminate()`\
  \ |\n\nWSH 对象太多，无法在一个章节中全部涵盖。因此，本章将限于为您提供 WSH 对象引用，并提供一些操作某些 WSH 对象的示例。本书的其余章节将让您有机会操作属于\
  \ 表 9.2 所示对象的许多属性和方法。\n\n### 核心对象属性\n\n对象属性存储它们所代表的资源的信息。通过引用对象属性，VBScript 可以收集有关其执行环境的信息。此外，通过修改对象属性，VBScript\
  \ 可以对该环境以及其中的 Windows 资源进行直接更改。\n\nWSH 核心对象提供了对几十种不同属性的访问。表 9.3 列出了这些每一个属性。\n\n\
  #### 表 9.3：WSH 对象属性\n\n| 属性 | 描述 |\n| --- | --- |\n| `Arguments` | 设置指向 `WshArguments`\
  \ 集合的指针引用 |\n| `AtEndOfLine` | 返回 `True` 或 `False`，取决于流中是否到达行结束符 |\n| `AtEndOfStream`\
  \ | 返回 `True` 或 `False`，取决于是否到达输入流末尾 |\n| `Character` | 识别代码行中发生错误的特定字符 |\n| `Column`\
  \ | 返回输入流中的当前列位置 |\n| `ComputerName` | 获取计算机名称 |\n| `CurrentDirectory` | 设置或检索脚本的当前工作目录\
  \ |\n| `Description` | 获取指定快捷方式的描述 |\n| `Environment` | 设置指向 `WshEnvironment` 的指针引用\
  \ |\n| `Error` | 提供暴露 `WshRemoteError` 对象的能力 |\n| `ExitCode` | 返回使用 `Exec()` 启动的脚本的退出代码\
  \ |\n| `FullName` | 获取快捷方式或可执行程序的路径 |\n| `HotKey` | 获取与指定快捷方式关联的热键 |\n| `IconLocation`\
  \ | 获取图标的位置 |\n| `Interactive` | 提供通过程序化设置脚本模式的能力 |\n| `Item` | 从集合中检索指定的项，或提供对存储在\
  \ `WshNamed` 对象中的项的访问 |\n| `Length` | 获取枚举项的计数 |\n| `Line` | 返回输入流中当前行的行号，或识别脚本中发生错误的行号\
  \ |\n| `Name` | 返回表示 `WScript` 对象名称的字符串 |\n| `Number` | 提供对错误号的访问 |\n| `Path` |\
  \ 返回 `CScript` 或 `WScript` 执行主机所在文件夹的位置 |\n| `ProcessID` | 获取使用 `WshScriptExec`\
  \ 对象启动的进程的 PID（进程 ID） |\n| `ScriptFullName` | 返回执行脚本的路径 |\n| `ScriptName` | 返回执行的脚本的名称\
  \ |\n| `Source` | 获取导致脚本错误的对象的标识 |\n| `SourceText` | 获取创建错误的源代码 |\n| `SpecialFolders`\
  \ | 提供对 Windows 开始菜单和桌面文件夹的访问 |\n| `Status` | 提供状态 |\n| `StdErr` | 允许写入错误流 |\n|\
  \ `StdIn` | 允许对输入流进行访问 |\n| `StdOut` | 允许对输出流进行访问 |\n| `TargetPath` | 获取快捷方式指向对象的路径\
  \ |\n| `UserDomain` | 获取域名称 |\n| `UserName` | 获取当前登录用户的名称 |\n| `Version` | 获取 WSH\
  \ 版本 |\n| `WindowStyle` | 获取快捷方式的窗口样式 |\n| `WorkingDirectory` | 返回快捷方式关联的工作目录 |\n\
  \n### 使用对象属性\n\n作为操作属性的示例，请查看以下 VBScript。在此脚本中，引用了 `WshNetwork` 对象的属性以收集网络信息。\n\n\
  ```vbscript\n '*****************************************\n'Script Name: Script 9.1.vbs\n\
  'Author: Jerry Ford\n'Created: 02/12/03\n'Description: 此脚本演示了如何使用\n'WshNetwork 对象的属性获取网络信息\n\
  '*****************************************\n'初始化部分\n\nOption Explicit\n\nDim WshNtwk,\
  \ strDisplayText\n\n'实例化 WshNetwork 对象\nSet WshNtwk = WScript.CreateObject(\"WScript.Network\"\
  )\n\n'主处理部分\n\n'调用收集并显示网络信息的过程\nDisplayNetInfo()\n\n'终止脚本执行\nWScript.Quit()\n\n\
  '过程部分\n\n'显示网络信息的子程序\nSub DisplayNetInfo()\n\n  strDisplayText = \"此计算机是 \" & WshNtwk.ComputerName\
  \ & \". \" & _\n    \"它连接到以下域：\" & vbCrLf & vbCrLf & _\n    WshNtwk.UserDomain &\
  \ vbCrLf & vbCrLf & vbCrLf\n\n  MsgBox strDisplayText, , \"网络信息\"\n\nEnd Sub\n```\n\
  \n此脚本首先定义了两个变量，`WshNtwk` 和 `strDisplayText`。随后使用 `WshNtwk` 实例化 `WshNetwork` 对象，如下所示。\n\
  \n```vbscript\n Dim WshNtwk, strDisplayText\nSet WshNtwk = WScript.CreateObject(\"\
  WScript.Network\")\n```\n\n\n\n\n\n如你所见，设置 `WshNetwork` 对象的实例需要使用 `Set` 语句和 `WScript`\
  \ 对象的 `Create-Object()` 方法。一旦实例化，你就可以引用该对象的任何属性和方法。接下来，脚本将执行一个名为 `DisplayNetInfo()`\
  \ 的过程。该子程序包含两条语句。第一条语句使用 `strDisplayText` 变量以及以下 `WshNetwork` 属性创建一个显示字符串：\n\n*\
  \   `ComputerName`：检索分配给执行脚本的计算机的网络名称\n*   `UserDomain`：检索计算机所属的 Windows 域名称；如果计算机是基于工作组的网络的成员，则检索分配给该计算机的工作组名称。\n\
  \n`DisplayNetInfo()` 子程序中的第二条语句将如图 9.2 所示显示该字符串。最后，控制权返回主处理部分（Main Processing Section），使用\
  \ `WScript` 对象的 `Quit()` 方法终止脚本的执行。\n\n![点击展开](img/fig9-2_0.jpg)\n\n图 9.2：显示从属于\
  \ `WshNetwork` 属性收集的网络信息\n\n## 核心对象方法\n\nWSH 对象方法提供了交互和操作它们所代表资源的能力。这些资源包括桌面快捷方式、Windows\
  \ 文件系统、打印机和 Windows 注册表。表 9.4 提供了 WSH 核心对象方法的列表。\n\n表 9.4：WSH 对象方法\n\n| 方法 | 说明\
  \ |\n| --- | --- |\n| `AddPrinterConnection()` | 创建打印机映射 |\n| `AddWindowsPrinterConnection()`\
  \ | 创建新的打印机连接 |\n| `AppActivate()` | 激活目标应用程序窗口 |\n| `Close()` | 终止或结束打开的数据流 |\n\
  | `ConnectObject()` | 与对象建立连接 |\n| `Count` | 检索 `WshNamed` 和 `WshUnnamed` 对象中找到开关数量\
  \ |\n| `CreateObject()` | 创建对象的新实例 |\n| `CreateScript()` | 实例化代表远程运行脚本的 `WshRemote`\
  \ 对象 |\n| `CreateShortcut()` | 创建 Windows 快捷方式 |\n| `DisconnectObject()` | 终止对象的连接\
  \ |\n| `Echo()` | 显示文本消息 |\n| `EnumNetworkDrives()` | 启用访问网络驱动器 |\n| `EnumPrinterConnections()`\
  \ | 启用访问网络打印机 |\n| `Exec()` | 在子命令 shell 中执行应用程序并提供对环境变量的访问 |\n| `Execute()` | 启动远程脚本对象的执行\
  \ |\n| `Exists()` | 确定 `WshNamed` 对象中是否存在指定的键 |\n| `ExpandEnvironmentStrings()`\
  \ | 检索表示 `Process` 环境变量内容的字符串 |\n| `GetObject()` | 检索一个 `Automation` 对象 |\n| `GetResource()`\
  \ | 根据 `<resource>` 标签指定的检索资源值 |\n| `LogEvent()` | 在 Windows 事件日志中写入消息 |\n| `MapNetworkDrive()`\
  \ | 创建网络驱动器映射 |\n| `Popup()` | 在弹出对话框中显示文本消息 |\n| `Quit()` | 终止或结束脚本 |\n| `Read()`\
  \ | 从输入流中检索字符字符串 |\n| `ReadAll()` | 检索由输入流中的字符组成的 `s` 字符串 |\n| `ReadLine()` | 从输入流中检索包含整行数据的字符串\
  \ |\n| `RegDelete()` | 删除注册表键或值 |\n| `RegRead()` | 检索注册表键或值 |\n| `RegWrite()` |\
  \ 创建注册表键或值 |\n| `Remove()` | 删除指定的环境变量 |\n| `RemoveNetworkDrive()` | 删除到指定网络驱动器的连接\
  \ |\n| `RemovePrinterConnection()` | 删除到指定网络打印机的连接 |\n| `Run()` | 启动新进程 |\n| `Save()`\
  \ | 保存快捷方式 |\n| `SendKeys()` | 模拟击键并将输入数据发送到指定的窗口 |\n| `SetDefaultPrinter()` | 建立默认\
  \ Windows 打印机 |\n| `ShowUsage()` | 检索有关脚本预期执行方式的信息 |\n| `Skip()` | 从输入流读取时跳过 `x`\
  \ 个字符 |\n| `SkipLine()` | 从输入流读取时跳过整整行 |\n| `Sleep()` | 暂停脚本执行 `x` 秒 |\n| `Terminate()`\
  \ | 停止由 `Exec()` 启动的进程 |\n| `Write()` | 在输出流中放置字符串 |\n| `WriteBlankLines()` | 在输出流中留空行\
  \ |\n| `WriteLine()` | 在输出流中放置字符串 |\n\n## 使用 WSH 对象方法\n\n作为如何使用 WSH 对象方法的示例，请检查以下\
  \ VBScript。在此 VBScript 中，使用了属于 `WshShell` 对象的方法来设置到网络文件夹的映射驱动器连接。\n\n```\n '*************************************************************************\n\
  'Script Name: Script 9.2.vbs\n'Author: Jerry Ford\n'Created: 02/12/03\n'Description:\
  \ 此脚本演示了如何使用属于\n'the WshNetwork 对象的方法来映射网络驱动器\n*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\nDim WshNetworkk, strLetter, strPath\n\n'实例化 WshNetwork\
  \ 对象\nSet WshNetworkk = WScript.CreateObject(\"WScript.Network\")\n\nstrLetter =\
  \ \"z:\"\nstrPath = \"\\\\PC\\Shared\"\n\n'主处理部分\n\n'调用映射网络驱动器的过程\nMapDrive strLetter,\
  \ strPath\n\n'终止脚本执行\nWScript.Quit()\n\n'过程部分\n'此子程序创建网络驱动器\n\nSub MapDrive(letter,\
  \ path)\n  '创建到指定网络驱动器的映射\n  WshNetworkk.MapNetworkDrive letter, path\n\nEnd Sub\n\
  ```\n\n## 向脚本传递参数\n\n在到目前为止看到的所有脚本中，数据要么被硬编码在脚本的常量、变量和数组中，要么通过弹出框与用户交互式收集。脚本还经常通过在运行时作为参数传递数据来接收需要处理的数据。例如，你可能会设置一个脚本来调用另一个脚本，并将第一个脚本的输出作为第二个脚本的输入。\n\
  \n或者，你也可以从 Windows 命令行向脚本传递参数。例如，以下命令将执行名为 `TestScript.vbs` 的脚本并向其传递三个参数：\n\n```\n\
  \ WScript TestScript.vbs log txt doc\n```\n\n发生什么取决于脚本。例如，接收 `log`、`txt` 和 `doc`\
  \ 作为输入的脚本可能会使用这些参数来构建一个需要以某种方式处理的文件列表。\n\n\n\n\n\n| **注意** | 您也可以向脚本传递包含空格的参数，但要做到这一点，您必须将参数封装在一对匹配的引号内，如下文所示。\
  \ |\n\n```\nCSScript TestScript.vbs reports, \"log files\", documents\n```\n\n脚本的设计必须能够处理可能传递给它们的任何参数输入。这可以使用属于\
  \ `WshArguments` 对象的属性来实现，如下例所示。\n\n```vbscript\n'*************************************************************************\n\
  'Script Name: Script 9.3.vbs\n'Author: Jerry Ford\n''Created: 02/12/03\n'Description:\
  \ 此脚本演示了如何处理传递给\n'a VBScript 的参数\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nDim WshArgs\nSet WshArgs = WScript.Arguments\n\
  \n'Main Processing Section\n\nIf WshArgs.Count < 1 Then\n  MsgBox \"Error: 没有传递参数给此脚本。\"\
  \n  WScript.Quit()\nElse\n  ProcessArguments()\nEnd If\nWScript.Quit()\n\n'Procedure\
  \ Section\n\nSub ProcessArguments()\n\n  Dim i, strDisplayString\n\n  strDisplayString\
  \ = \"Total number of arguments passed to this \" & _\n    script: \" \" & vbTab\
  \ & WshArgs.Count & vbCrLf & vbCrLf\n\n  For i = 0 to (WshArgs.Count - 1)\n    strDisplayString\
  \ = strDisplayString & WshArgs.Item(i) & vbCrLf\n  Next\n\n  MsgBox strDisplayString\n\
  \nEnd Sub\n```\n\n此 VBScript 执行的第一件事是定义一个变量并使用它实例化 `WshArguments` 对象的实例，如下所示。\n\n\
  ```vbscript\nDim WshArgs\nSet WshArgs = WScript.Arguments\n```\n\n在脚本的主处理部分（Main\
  \ Processing Section）中，脚本随后使用 `WshArguments` 对象的 `Count` 属性来确保至少传递了一个参数，如果是如此，则调用\
  \ `ProcessArguments()` 函数。否则，将显示错误消息并执行 `WScript` 对象的 `Quit()` 方法，终止脚本的执行。\n\n`ProcessArguments()`\
  \ 函数首先向显示字符串中添加一个标题，如下所示。\n\n```vbscript\nstrDisplayString = \"Total number of arguments\
  \ passed to this script: \" & _\n    vbTab & WshArgs.Count & vbCrLf & vbCrLf\n```\n\
  \n接下来，它使用 `For`…`Next` 循环遍历传递给脚本的参数列表。`WshArguments` 对象将参数存储在从零开始的索引列表中。循环从零开始一直运行到\
  \ `WshArgs.Count – 1`（例如，如果传递了五个参数，索引将从位置 0 开始，到位置 4 结束）。在循环的每次迭代中，都会根据变量 `i` 指定的索引号将每个参数的值添加到字符串中（例如，`WshArguments.Item(i)`），从而修改显示字符串的内容。\n\
  \n[图 9.4] 展示了当向此脚本传递 `SalesReport.doc`、`MarketReport.doc`、`Forecast.xls`、`MonthlyStats.xls`\
  \ 和 `LogReports.log` 参数列表时产生的输出。\n\n![点击展开](img/fig9-4_0.jpg)\n\n图 9.4：在运行时处理传递给\
  \ VBScript 的参数\n\n## 使用 XML 创建 Windows 脚本文件\n\nWSH 为编程人员提供了一个健壮的脚本环境，该环境包含对一组通用对象的访问权限。这些对象通过属性和方法访问它们所代表的\
  \ Windows 资源。WSH 的优势之一是，无论编程人员使用何种脚本语言，它都能提供相同级别的访问权限。\n\n微软在发布 WSH 时自带了 VBScript\
  \ 和 JScript，但同时也提供了第三方的、兼容 WSH 的脚本语言，包括 Perl、Python 和 Rexx。WSH 并不止于此。除了允许您使用选择的脚本语言外，它还提供了将两个或多个脚本（包括使用不同语言编写的脚本）合并成单个名为\
  \ `Windows Script File`（Windows 脚本文件）脚本的能力。Windows 脚本文件是以 `.wsf` 扩展名保存的纯文本文件。\n\n\
  WSH 使用 XML 的子集来创建 Windows 脚本文件。XML 是一种在语法上与 HTML 相似的标记语言。Windows 脚本文件中使用 XML 标签来标识或标记组成文件的组件。例如，Windows\
  \ 脚本文件中的每个脚本都封装在一对 `<script> </script>` 标签中。WSH 目前对 XML 1.0 版本提供支持。\n\nXML 是一种区分大小敏感的标记语言。在格式化标签时，它必须遵循一套严格的规则。与\
  \ HTML 标记语言不同，您不能省略所需的闭合标签。本章的其余部分将演示一些常用的 XML 标签，如 [表 9.5] 所示。\n\n### 表 9.5：Windows\
  \ 脚本文件中常用的 XML 标签\n\n| 标签 | 描述 |\n| --- | --- |\n| `<?XML ?>` | 此标签指定 Windows 脚本文件的\
  \ XML 级别。 |\n| `<?job ?>` | 此标签用于启用或禁用指定作业的错误处理和调试。 |\n| `<comment> </comment>`\
  \ | 此标签提供了在 Windows 脚本文件中嵌入注释的能力。 |\n| `<script> </script>` | 此标签标识 Windows 脚本文件内脚本的开始和结束。\
  \ |\n| `<job> </job>` | 此标签标识 Windows 脚本文件内作业的开始和结束。 |\n| `<package> </package>`\
  \ | 此标签允许在 Windows 脚本文件中定义多个作业。 |\n| `<resource> </resource>` | 此标签定义供脚本引用的静态数据（常量）。\
  \ |\n| **注意** | XML 1.0 允许标签使用大小写。然而，使用大写通常被认为是不规范的。 |\n\n### <?XML ?> 标签\n\n`<?XML\
  \ ?>` 标签是一个可选标签，指定 Windows 脚本文件执行所需的 XML 版本。如果使用，`<?XML ?>` 标签必须是 Windows 脚本文件的第一个语句。其语法所示：\n\
  \n```xml\n<?XML version=\"X.X\" standalone=\"dtdflag\" ?>\n```\n\n`version` 指定所需的\
  \ XML 版本。`standalone` 指定一个布尔值，指示脚本是否包含外部 DTD（文档类型定义）。DTD 目前是一项不支持的 WSH 功能。然而，如果您愿意，可以包含它。如果这样做，必须将其指定为\
  \ `Yes`。`<?XML ?>` 标签没有闭合标签。\n\n### <?job ?> 标签\n\n`<?job ?>` 标签是一个可选标签，允许您启用或禁用错误报告和调试。`<?job\
  \ ?>` 标签没有闭合标签。其语法所示：\n\n```xml\n<?job error=\"errorflag\" debug=\"debugflag\" ?>\n\
  ```\n\n`errorflag` 是一个布尔值。当设置为 `True` 时，启用错误报告。如果省略，Windows 脚本文件将禁用错误报告。`debugflag`\
  \ 也是一个布尔值，控制错误发生时是否会启动 Windows 脚本调试器。\n\n\n\n\n\n|  | Note | Microsoft Windows 脚本调试器是微软提供的一种实用程序，帮助编程人员调试脚本错误。访问\
  \ [`msdn.microsoft.com/scripting`](http://msdn.microsoft.com/scripting) 了解更多关于此工具。\
  \ |\n\n以下示例演示了如何在 Windows 脚本文件中启用错误报告和脚本调试。\n\n```\n <job>\n  <?job error=\"true\"\
  \ debug=\"true\"?>\n  <script language=\"VBScript\">\n    MsgBox \"Error handling\
  \ and debugging are now enabled.\"\n  </script>\n</job>\n```\n\n### `<comment>`\
  \ 和 `</comment>` 标签\n\n`<comment>` 和 `</comment>` 标签提供了在 Windows 脚本文件中放置注释。`<comment>`\
  \ 和 `</comment>` 标签也可用于将注释跨多行。`<comment>` 和 `</comment>` 标签的语法所示。\n\n```\n <comment>\
  \ comment text  </comment>\n```\n\n以下示例演示了 `<comment>` 和 `</comment>` 标签的使用。\n\n\
  ```\n <job>\n  <comment>在此处放置您的注释</comment>\n  <script language=\"VBScript\">\n\
  \    MsgBox \"Error handling and debugging are now enabled.\"\n  </script>\n</job>\n\
  ```\n\n### `<script>` 和 `</script>` 标签\n\nWindows 脚本文件包含一个或多个用各种 WSH 支持的脚本语言编写的脚本文件。<script>`\
  \ 和 `</script>` 标签用于识别 Windows 脚本文件中单个脚本的开始和结束。其语法所示。\n\n```\n <script language=\"\
  scriptlanguage\" [src=\"externalscript\"]>\n   ...\n</script>\n```\n\n`language`\
  \ 用于指定开发脚本使用的脚本语言。`src` 是可选的，用于指定外部脚本的位置。\n\n以下示例演示了如何使用 `<script>` 和 `</script>`\
  \ 标签在 Windows 脚本文件中嵌入 VBScript。\n\n```\n <job>\n  <script language=\"VBScript\"\
  >\n    MsgBox \"Windows Script Host - Script number 2 executing\"\n  </script>\n\
  </job>\n```\n\n下一个示例演示了如何设置与 Windows 脚本文件同一文件夹下的外部 VBScript 引用。\n\n```\n <job>\n\
  \  <script language=\"VBScript\" src=\"ScriptName.vbs\" />\n</job>\n```\n\n### `<job>`\
  \ 和 `</job>` 标签\n\nWindows 脚本文件可以包含一个或多个作业，每个作业可以包含任意数量的脚本。每个作业使用 `<job>` 和 `</job>`\
  \ 标签标识。至少，每个 Windows 脚本文件必须包含一个作业。这些标签的语法所示。\n\n```\n <job [id=jobid]>\n  . . .\n\
  </job>\n```\n\n`id` 用于唯一标识包含多个作业的 Windows 脚本中的作业。在仅包含一个作业的 Windows 脚本文件中可以省略此参数。通过为\
  \ Windows 脚本文件中的每个作业分配作业 ID，你可以在执行 Windows 脚本文件时指定想要运行的作业。以下示例显示了一个由单个作业组成的 Windows\
  \ 脚本文件。\n\n```\n <job>\n\n  <script language=\"VBScript\">\n    MsgBox \"The first\
  \ VBScript is now executing.\"\n  </script>\n\n  <script language=\"VBScript\" src=\"\
  SecondVBScript.vbs\" />\n\n  <script language=\"JScript\">\n    WScript.Echo(\"\
  The first JScript is now executing.\");\n  </script>\n\n</job>\n```\n\n如你所见，此作业执行了三个脚本，两个用\
  \ VBScript 编写，一个用 JScript 编写。作业内定义的第二个 VBScript 代表一个外部脚本。\n\n### `<package>` 和 `</package>`\
  \ 标签\n\n为了在 Windows 脚本文件中放置多个作业，你必须首先指定 `<package>` 和 `</package>` 标签，并将作业嵌入这些标签中。`<package>`\
  \ 和 `</package>` 标签的语法所示。\n\n```\n <package>\n   . . .\n</package>\n```\n\n以下示例演示了如何使用\
  \ `<package>` 和 `</package>` 标签向 Windows 脚本文件添加三个作业。\n\n```\n <package>\n\n  <job\
  \ id=\"Job_A\">\n    <script language=\"VBScript\">\n      MsgBox \"Job_A is now\
  \ executing.\"\n    </script>\n  </job>\n\n  <job id=\"Job_B\">\n\n    <script language=\"\
  VBScript\">\n      MsgBox \"Job_B is now executing.\"\n    </script>\n  </job>\n\
  \n  <job id=\"Job_C\">\n    <script language=\"JScript\">\n      WScript.Echo(\"\
  Job_C is now executing.\");\n    </script>\n  </job>\n\n</package>\n```\n\n第一个作业命名为\
  \ `Job_A`。它包含一个 VBScript。第二个和第三个作业分别命名为 `Job_B` 和 `Job_C`。\n\n### `<resource>` 和\
  \ `</resource>` 标签\n\nXML `<resource>` 和 `</resource>` 标签允许你定义常量，这些常量可以被 Windows\
  \ 脚本文件中同一作业定义的任何脚本访问。使用这些标签，你可以定义 Windows 脚本文件中单个脚本可能需要的一个或多个常量。这避免了为 Windows 脚本中的每个脚本重复定义常量的麻烦。这也有助于让你的脚本更容易支持。\n\
  \n\n\n\n\n# 第 15 章：创建管理员账户\n\n## 项目 1 概述\n\n在这个项目中，一家名为 ABC, Inc. 的小公司希望开始实现其桌面电脑管理的自动化。为了实现这一目标，ABC,\
  \ Inc. 的管理层创建了一个桌面管理项目，并指派了一位程序员开始开发一系列 `VBScripts`，这些脚本将执行以下任务：\n\n*   自动化桌面自定义\n\
  *   配置`开始`菜单\n*   配置`快速启动`工具栏\n*   建立远程网络驱动器连接\n*   建立到网络打印机的连接\n*   自动化创建新用户账户\n\
  \n在项目开发过程中，你将学习如何开发 `VBScripts`，使其能够多种方式与操作系统及其环境进行交互，包括：\n\n*   直接访问 Windows 桌面和网络资源\n\
  *   使用 `VBScript` 登录脚本自动建立网络连接\n*   直接访问 Windows 文件夹的内容\n*   通过操作注册表键和值来配置系统\n*\
  \   在 `VBScripts` 内部直接执行 Windows 命令\n*   自动化执行 Windows 实用程序\n\n# 第 10 章：项目案例研究——桌面自定义与部署\n\
  \n在本书的`Part I`中，你学习了 `VBScript` 编程的基础，包括如何在 `WSH` 和 `Internet Explorer` 执行环境中创建和执行\
  \ `VBScripts`。你还学习了 `WSH` 核心对象模型以及与其对象相关的属性和方法。在本章，你将开始编写一组桌面管理脚本，这些脚本将扩展你对许多 `WSH`\
  \ 对象的工作知识。\n\n## 项目概述\n\n在这个项目中，你将研究并复制一家名为 ABC, Inc. 的虚拟公司近期开展的桌面管理项目。ABC, Inc.\
  \ 在弗吉尼亚中部地区从事广播和报营销、广告和咨询业务。ABC, Inc. 是一家有 50 名员工的小公司。除了少数例外，这些员工都被认为精通电脑。\n\n目前，公司每个员工都有一台用于工作的电脑。所有电脑都连接到一个小型\
  \ Windows 域网络上。公司拥有六台 `Windows NT` 和 `2000` 服务器，通过这些服务器支持公司网站、文件和打印服务以及客户和项目数据库。为了管理这些服务器和\
  \ Windows 网络，公司有两位 IT 员工：Rick 和 Sue。在大多数情况下，这些服务器的运行非常顺利，公司对 Rick 和 Sue 的维护工作非常满意。\n\
  \n然而，当涉及到桌面支持时，情况就不那么乐观了。由于公司拥有一批技术型员工，公司在桌面支持上投入的时间和精力很少。办公室经理 Carl 和他的助手 Becky\
  \ 负责公司桌面。在大多数情况下，他们的职责仅限于购买和接收新电脑，然后为个人用户进行设置。在初始设置和配置之后，用户只能自己想解决桌面电脑问题。因此，ABC,\
  \ Inc. 的桌面支持可以被归类为“松散支持”。\n\n偶尔，用户会给 Carl 或 Becky 打电寻求他们无法解决的硬件或软件帮助。这通常会导致 Carl\
  \ 或 Becky 上门，以判断是某些东西坏了需要更换，还是他们可以解决的软件或配置问题。许多时候，Carl 和 Becky 会寻求被视为公司电脑导师的 Rick\
  \ 和 Sue 的帮助。\n\n桌面支持对 Carl 和 Becky 来说只是兼职任务，他们尽可能少地关注它。由于缺乏关注，在过去的几年里，情况变得有些混乱。首先，管理层要求\
  \ Carl 和 Becky 在每次购买新电脑时都要寻找最优价格。结果是公司多年来从许多制造商处购买了电脑，包括 `IBM`、`Compa`、`Dell` 和\
  \ `Gateway`。此外，Carl 和 Becky 现在发现自己支持多种不同的 Microsoft 操作系统，包括 `Windows 98`、`Workstation\
  \ NT 4.0`、`Windows 2000 Professional` 和 `Windows XP Professional`。\n\n更糟糕的是，用户开始发现他们的电脑没有足够的硬件资源（如处理器、内存和驱动空间）来支持新的应用程序。结果，Carl\
  \ 和 Becky 注意到在过去的六个月里，他们投入到桌面支持的时间大幅增加。在与高层进行多次会议和讨论后，Carl 和 Becky 终于获得了授权招聘一名全职员工负责管理所有公司桌面。这个人是\
  \ Tom。\n\nTom 于上个月上班，并立即开始处理现有的用户问题。Tom 没有花很长时间就得出了结论，并迅速记录并将这些内容转给了 Carl 和 Becky。Tom\
  \ 还给他们提供了一份正式报告，其中识别了一些他认为公司需要立即解决的问题。以下是这些问题的简要概述：\n\n*   除了 5 台运行 `Windows 2000\
  \ Professional` 的电脑外，所有电脑都需要重大的内存、磁盘驱动器或处理器升级。\n*   来自许多不同制造商的电脑型号太多，无法有效地支持每台电脑。Tom\
  \ 建议在明年一年内用新电脑替换所有现有电脑。此外，他强烈建议公司将单一制造商的电脑系列作为标准，以简化未来的升级和故障排除，并在购买新电脑时获得谈判更优优惠的谈判筹码。\n\
  *   Tom 建议采用 `Windows XP Professional` 作为所有电脑的标准桌面操作系统。`Windows XP` 为最广泛的硬件和业务软件提供支持，并配备了许多辅助计算机管理的软件工具和实用程序。这将有助于简化许多支持和维护问题。\n\
  *   Tom 还提到了在办公室里流传的一个传言，称公司即将扩大规模，并在年底前将再增加 20 名员工。Tom 说，随着所支持的桌面数量的进一步增长，向标准化转型迫于必行的。\n\
  \n管理层对 Tom 的建议表示接受并决定实施。新电脑将每 10 台一组进行购买，并在五个月月内完成对公司桌面环境的全面改造。`Dell` 被选为公司的桌面电脑供应商。已安排购买\
  \ 50 台新电脑，每台均配备 `2GHz` 处理器、`256MB` 内存、`20GB` 硬盘、`17 英`显示器和预装网网适配器。所有电脑都将预装 `Windows\
  \ XP Professional` 和 `Microsoft Office`。\n\n\n\n\n第一批电脑预计在三周后到达，Tom 知道自己在配置和尽快部署这些电脑方面将面临着巨大的压力。此前，Carl\
  \ 和 Becky 平均需要花费五个工作日来对新购买的电脑进行定制和部署。考虑到 Tom 在未来几个月内需要处理的电脑数量，他知道管理层不会对这种周转率满意。他决定设定一个目标：在收到电脑后的四天内交付\
  \ 10 台。这不仅会让高层留下深刻印象，还能为 Tom 腾出更多时间协助培训用户并帮助他们排除故障。此外，这还能让 Tom 有更多时间与 Rick 和 Sue\
  \ 合作，开始培训备份服务器管理员。\n\n## 分析现有流程\n\nTom 计划开发一套 WSH VBS 脚本来加速桌面配置过程，他将其统称为“桌面部署工具包”（Desktop\
  \ Deployment Toolkit）。开发完成后，这些脚本将允许 Tom 快速配置新桌面。这些脚本将消除因人为错误引起的问题和故障（例如错误输入配置设置、错误执行操作等）。\n\
  \n首先，Tom 坐下来记录了当前的桌面设置和配置过程，并寻找改进和加速它的的方法。当他完成工作时，Tom 将设置和配置新电脑的过程分解为以下步骤：\n\n1.\
  \ 当新电脑到达时，对其进行拆箱、组装并放置在临时台上，桌面每次最多可以放置两台电脑。\n2. 随后，使用一对专门为此目的设置的网络连接将电脑物理连接到网络。\n\
  3. 每台电脑最初都使用 `Administrator` 账户登录。\n4. 每台电脑都预装了操作系统和 Microsoft Office。对每个应用程序进行测试以验证其运行正常。然后，测试关键硬件（如\
  \ `CD-ROM` 驱动器和软盘驱动器）以确保它们可以使用。\n5. 为每台电脑配置由 Rick 和 Sue 提供的计算机名称，并加入公司域。然后重启。\n\
  6. 接下来，使用 `User Accounts` 文件夹设置本地管理员账户，如图 10.1 所示。将该账户及其密码记录在纸上并存在保险箱中以确保安全。创建此账户的原因是在当用户和网络管理员（Rick\
  \ 和 Sue）丢失对电脑的访问权限时，可以提供一个后门入口。\n\n    ![点击展开](img/fig10-1_0.jpg)\n\n    图 10.1：创建一个用于紧急情况的本地管理员账户\n\
  \n7. 在 `Scheduled Tasks` 文件夹中为两个磁盘维护实用程序设置每月执行计划，如图 10.2 所示。\n\n    ![点击展开](img/fig10-2_0.jpg)\n\
  \n    图 10.2：计划任务文件夹用于设置和管理计划任务\n\n    在计划的这些磁盘管理任务中的第一个是 `Disk Cleanup` 向导，如图 10.3\
  \ 所示。该向导通过删除非关键文件来释放磁盘空间，包括：\n    * 下载的程序文件\n    * 临时 Internet 文件\n    * 离线网页\n\
  \    * 垃圾回收桶\n    * 安装日志文件\n    * 临时文件\n    * 内容索引器的目录文件\n\n    ![点击展开](img/fig10-3_0.jpg)\n\
  \n    图 10.3：使用磁盘清理向导从电脑中删除不需要的文件\n\n    要设置的第二个磁盘管理任务是 `Disk Defragmenter` 实用程序，如图\
  \ 10.4 所示。该实用程序用于保持每个用户电脑上的 `C:` 盘经过碎片整理。\n\n    ![点击展开](img/fig10-4_0.jpg)\n\n\
  \    图 10.4：设置磁盘碎片整理程序每月运行\n\n8. 在电脑 `D:` 盘的根目录下创建一个 `Images` 文件夹，并将一个包含公司 Logo\
  \ 的桌面背景文件的 `.bmp` 文件复制到该文件夹。\n9. 接下来，安装若干应用程序，包括 `WinZip`、`Adobe Acrobat Reader`、`Paint\
  \ Shop Pro` 和一个 FTP 程序。\n10. 此时，每台电脑都关机并从组装台上移下，存放在房间角落，同时设置下一组电脑并重复之前的步骤。\n11.\
  \ 随后与个人用户预约时间以交付并完成其新电脑的设置。告诉每个用户将其当前电脑上存储的任何文件保存到公司文件服务器上，以便用户在新电脑交付并设置好后将它们移回来。\n\
  12. 在适当的时间，将电脑装上推车并交付到用户桌桌，并在那里进行组装。然后要求用户登录。\n13. 要求用户执行若干桌面自定义任务。使用 `Create Shortcut`\
  \ 向导通过设置指向公司网站的快捷方式来自定义 Windows 桌面，如图 10.5 所示。\n\n    ![点击展开](img/fig10-5_0.jpg)\n\
  \n    图 10.5：使用快捷方式向导创建 URL | 注意：在加载用户配置之前，这些更改保存在注册表的 `HKEY_CURRENT_USER` 中。\n\
  14. 使用图 10.6 所示的 `Display Properties` 对话框，配置一个 15 分钟后启动的 Windows 屏幕保护。还配置密码保护。\n\
  \n    ![点击展开](img/fig10-6.jpg)\n\n    图 10.6：设置屏幕保护在 15 分钟后启动\n\n15. 随后配置 Windows\
  \ 桌面显示 `D:\\Images` 文件夹中的 Logo 文件，如图 10.7 所示。\n\n    ![点击展开](img/fig10-7_0.jpg)\n\
  \n    图 10.7：配置桌面显示公司 Logo\n\n16. 配置若干菜单和任务栏设置。这些设置包括创建一个 `Standard Applications`\
  \ 文件夹，然后填充 `Microsoft Word`、`Adobe Acrobat Reader`、`Paint Shop Pro` 和一个 FTP 应用程序的快捷方式，如图\
  \ 10.8 所示。\n\n    ![点击展开](img/fig10-8_0.jpg)\n\n    图 10.8：创建一个包含所有人使用的应用程序的 Standard\
  \ Applications 文件夹\n\n17. 通过添加 `Windows Calculator` 和 `WinZip` 应用程序的链接来自定义 `Quick\
  \ Launch` 工具栏。\n18. 通过将 `Standard Applications` 文件夹添加到 `All Programs` 文件夹来自定义开始菜单，如图\
  \ 10.9 所示。\n\n    ![点击展开](img/fig10-9_0.jpg)\n\n    图 10.9：在开始菜单上添加 Standard Applications\
  \ 快捷方式\n\n19. 完成的任务是设置到公司文件服务器和共享网络打印机的连接。设置网络打印机连接使用 `Add Printer Wizard` 向导，如图\
  \ 10.10 所示。然后使用 `Map Network Drive` 向导创建驱动器映射，如图 10.11 所示。\n\n    ![点击展开](img/fig10-10_0.jpg)\n\
  \n\n\n\n图 10.1：使用“添加打印机”向导设置到公司网络打印机的连接\n\n![点击展开图片](img/fig10-11_0.jpg)\n\n图 10.11：使用“映射网络驱动器”向导将驱动器连接到公司的共享网络驱动器\n\
  \n20. 最后，将用户的旧电脑打包并带走。\n\n### 确定哪些任务可以自动化\n\n在研究部署流程一段时间后，Tom 确定通过使用 `VBScript`\
  \ 和 `WSH` 自动化流程中的关键部分，可以显著提高速度。Tom 列出了一份他认为可以自动化的任务列表，并认为自己可以在未来三周内编写这些脚本。\n\n随后，他将这些任务分成逻辑组，认为自己将一次专注于自动化一组相关任务。Table\
  \ 10.1 显示了 Tom 汇总的列表。\n\n表 10.1：桌面管理任务列表\n\n| 任务类型 | 描述 |\n| --- | --- |\n| 桌面个性化\
  \ | 通过添加公司网站的快捷方式来自定义 Windows 桌面。设置每个用户的屏幕保护程序在 15 分钟后启动，并显示启用密码保护的星空屏幕保护程序。将 Windows\
  \ 背景设置为显示公司标志。 |\n| 开始菜单和任务栏 | 创建“标准应用程序”文件夹，并向其中填充 Microsoft Word、Adobe Acrobat\
  \ Reader、Paint Shop Pro、WinZip 和 FTP 应用程序的快捷方式。通过添加 Windows 计算器和 WinZip 应用程序的链接自定义快速启动工具栏。通过将“标准应用程序”文件夹添加到开始菜单的“所有程序”文件夹中自定义开始菜单。\
  \ |\n| 任务调度 | 计划每月执行一次“磁盘清理”向导。计划每月执行一次“磁盘碎片整理”工具。 |\n| 网络连接 | 设置到公司网络打印机池的网络打印机连接。设置到公司文件服务器的映射驱动器。\
  \ |\n| 账户管理 | 在每台计算机上添加一个本地管理员维护用户账户。 |\n\n### 执行高级设计\n\n作为一项准备工作，Tom 决定从开始研究他为了自动化每个任务而需要的\
  \ `WSH` 对象以及 Windows 实用工具和命令。作为一种设计策略，Tom 决定想要将任务拆分为较小的脚本，并且脚本应限制为执行不超过一个或两个任务。这将有助于脚本的快速开发和测试，这对\
  \ Tom 来说非常重要，因为距离第一批电脑预计到达只有几周时间了。\n\n#### 桌面个性化\n\nTom 已将桌面个性化任务拆分为两个独立的任务，如下所示。\n\
  \n* 在桌面上添加 URL 快捷方式\n* 配置屏幕保护程序和 Windows 桌面壁纸背景\n\nTom 确定要创建一个指向公司网站的 URL 快捷方式，他需要利用\
  \ `WSH` 的 `WshUrlShortcut` 对象，该对象提供了通过其 `TargetPath` 属性指定 URL 的功能。此外，他还需要使用 `WshShell`\
  \ 对象的 `SpecialFolders` 属性来建立对 Windows 桌面的引用。\n\n为了程序化配置 Windows 屏幕保护程序和桌面背景，Tom\
  \ 了解到他需要更改 Windows 注册表。为此，他将需要使用 `WSH` `WshShell` 对象的 `RegWrite()` 方法来修改存储在 `HKCU\\\
  Control Panel\\Desktop` 键中的屏幕保护程序和桌面壁纸值。\n\n为了让桌面壁纸的更改生效，Tom 需要让用户注销并重新登录。Tom 发现\
  \ Windows XP 提供了 `logoff.exe` 命令行工具，他可以在脚本中使用它来自动注销用户。\n\n#### 开始菜单和任务栏\n\nTom 将开始菜单和任务栏任务拆分为三个独立的任务：\n\
  \n* 创建“标准应用程序”文件夹并向其中填充应用程序快捷方式\n* 自定义快速启动工具栏\n* 自定义开始菜单\n\nTom 发现，为了创建一个文件夹，他需要学习如何处理\
  \ `VBScript` 运行时的 `FileSystemObject`。要创建桌面快捷方式，Tom 需要从建立 `WshShell` 对象的实例开始。然后，他需要使用\
  \ `WScript` 对象的 `SpecialFolders` 属性访问 Windows 桌面特殊文件夹。此外，Tom 还需要使用 `WshShell` 对象的\
  \ `CreateShortCut()` 来完成快捷方式的创建。\n\n为了配置快速启动工具栏，Tom 发现他需要对其进行配置并添加快捷方式。为此，他需要学习如何处理另一个名为\
  \ `AppData` 的特殊文件夹。此外，他还需要学习如何处理代表开始菜单和“所有程序”菜单的特殊文件夹，以便配置开始菜单。\n\n#### 任务调度\n\n\
  Tom 识别出两个需要设置每 30 天运行一次的磁盘管理任务。这些工具列如下：\n\n* 磁盘清理向导\n* 磁盘碎片整理工具\n\n为了程序化地与 Windows\
  \ 调度服务交互，Tom 计划使用 Windows `At` 命令。他发现，要在 `WSH` `VBScript` 内部执行此命令，他需要学习如何使用 `WshShell`\
  \ 对象的 `Run()` 方法。\n\nTom 还了解到他可以使用 `defrag.exe` 命令行工具对硬盘驱动器进行碎片。。可以向该工具传递参数，使其能够静默运行。\n\
  \n#### 网络连接\n\nTom 需要作为计算机设置的一部分设置两个网络连接。建立连接的网络资源概述如下：\n\n* `\\\\PrinterServer\\\
  LazerPtr`：位于复印机房的高速打印机\n* `\\\\FileServer\\D-drive`：供所有员工使用的大容量硬盘\n\n为了设置这两个网络连接，Tom\
  \ 需要学习如何处理 `WshNetwork` 对象。具体而言，他将需要使用以下 `WshNetwork` 方法：\n\n* `MapNetworkDrive`：映射到指定的驱动器\n\
  * `AddPrinterConnection`：建立到指定打印机的连接\n\n#### 账户管理\n\nTom 计划使用 Windows `net user`\
  \ 命令创建本地账户。为此，他将需要使用 `WshShell` 对象的 `Run()` 方法。一旦新账户添加到本地计算机，他将需要再次使用 `WshShell`\
  \ 对象的 `Run()` 方法将其添加到管理员组。为了完成此任务，他计划执行 Windows `net localgroup` 命令。\n\n\n\n\n\n\
  | ID | Category | Description |\n| :--- | :--- | :--- |\n| 0200 | 开始菜单和任务栏 | 创建一个“标准应用程序”文件夹并在其中填充应用程序快捷方式。\
  \ |\n| 0220 | 开始菜单和任务栏 | 向快速启动工具栏添加应用程序快捷方式。 |\n| 0230 | 开始菜单和任务栏 | 向开始菜单上的“所有程序”菜单添加应用程序快捷方式。\
  \ |\n| 0300 | 计划 | 计划 `defrag.exe` 工具的执行。 |\n| 0310 | 计划 | 计划 `cleanmgr` 工具的执行。\
  \ |\n| 0400 | 网络 | 自动设置网络打印机连接。 |\n| 0410 | 网络 | 自动设置到公司文件服务器的映射驱动器。 |\n| 0500 |\
  \ 账户管理员 | 创建本地管理员维护用户账户。 |\n\n在审查了 Tom 的计划后，Carl 高兴地批准了它。然而，Carl 想知道 Tom 计划如何将这些脚本整合到发布过程中。Tom\
  \ 解释说，虽然组成整个过程的步骤保持不变，但他现在能够更快速地执行这些步骤，同时消除过去经常发生的错误。\n\nTom 告诉 Carl，他计划将所有脚本拷贝到软磁盘上，当每台电脑首次放在组装台上时，将其插入电脑。然后他将从软磁盘运行每个代表组装台任务的脚本。接着，在交付每台电脑时，他会带上软磁盘的副本。在用户登录后，Tom\
  \ 将插入软磁盘并运行剩余的脚本。这个过程不仅减少了对每个用户造成的干扰，还能让 Tom 在从组装台上移除电脑后，在一天内完成所有电脑的部署。\n\n## 总结\n\
  \n在本章中，你了解了 ABC 公司。你回顾了该公司在桌面电脑支持和部署方面面临的挑战。此外，你还观察了公司新任桌面支持分析师 Tom 如何制定一个计划，通过开发\
  \ VBScript 来自动处理许多手动任务，从而精简桌面部署流程。在接下来的五章中，你将有机会跟随 Tom 如何通过开发这些脚本来实现他的计划。\n\n# 第\
  \ 11 章：自定义桌面\n\n在本章中，你将学习如何开发两个 VBScript，以多种方式自定义 Windows 桌面。第一个脚本将演示如何创建 Internet\
  \ URL 的快捷方式，以及如何与 Windows 特殊文件夹工作。第二个脚本将演示如何通过程序手段操作 Windows 注册表的内容，以配置 Windows\
  \ 桌面壁纸和 Windows 屏幕保护程序。\n\n## 为公司网站添加 URL 桌面快捷方式\n\n需要完成的第一个脚本是在 Windows 桌面创建一个指向公司网站的快捷方式。这是两个脚本中最容易编写的，它将让来自第\
  \ 10 章的新型桌面支持员工 Tom 有一个机会，在尝试学习如何通过程序手段与 Windows 注册表交互之前进行练习。\n\n在开发第一个脚本时，你必须考虑许多不同的信息。首先，你需要学习如何与\
  \ `WshUrlShortcut` 对象进行工作。为了在 Windows 桌面上添加快捷方式，你还需要了解一种名为“特殊文件夹”的 Windows 管理功能。特殊文件夹用于表示和管理许多\
  \ Windows 功能，包括开始菜单、快速启动工具栏和桌面。\n\n### 与特殊文件夹工作\n\nWindows 特殊文件夹代表了许多重要的系统资源。通过操作这些文件夹的内容，你可以直接修改许多\
  \ Windows 资源，包括：\n\n* 桌面 (Desktop)\n* 收藏夹 (Favorites)\n* 字体 (Fonts)\n* 我的文档 (MyDocuments)\n\
  * 网络位置 (NetHood)\n* 打印队列 (PrintHood)\n* 程序 (Programs)\n* 最近 (Recent)\n* 发送到... (SendTo)\n\
  * 开始菜单 (StartMenu)\n* 启动 (Startup)\n* 模板 (Templates)\n\n要检查这些特殊文件夹，右键点击 Windows\
  \ XP 开始按钮并点击“资源”。这将打开一个资源管理器文件夹。默认情况下，“文档和设置”文件夹将展开，代表你个人用户配置设置的文件夹也会展开。要查看你的 Windows\
  \ 桌面的内容，请选择“桌面”文件夹，如图 11.1 所示。\n\n![点击展开](img/fig11-1_0.jpg)\n\n图 11.1：检查“桌面”特殊文件夹的内容\n\
  \n配置 Windows 桌面内容的一种方法是在此文件夹与之间拖放 Windows 快捷方式。\n\n除了与你的特定配置相关的特殊文件夹外，Windows 还提供了第二组适用于计算机所有用户的特殊文件夹。要查看这些文件夹，请展开“所有用户”文件夹，如图\
  \ 11.2 所示。\n\n![点击展开](img/fig11-2_0.jpg)\n\n图 11.2：对存储在“所有用户”文件夹下的文件夹进行的更改影响计算机的所有用户\n\
  \n这些特殊文件夹并不易于识别。但它们的名称很容易解释。例如，下列表显示了常用特殊文件夹的名称。\n\n* `AllUsersDesktop`：添加到此文件夹的项目在计算机上每个用户的桌面上可见。\n\
  * `AllUsersStartMenu`：添加到此文件夹的项目在计算机上每个用户的开始菜单上可见。\n* `AllUsersPrograms`：添加到此文件夹的项目在计算机上每个用户的“所有程序”菜单上可见。\n\
  * `AllUsersStartup`：添加到此文件夹的项目在用户每次登录计算机时自动启动。\n\n如你所见，这些特殊文件夹的名称是通过在文件夹名称（去掉任何空格）后附加\
  \ `AllUsers` 生成的。\n\n### 与 WshUrlShortcut 对象工作\n\n为了为 URL 创建快捷方式，你必须使用属于 `WshUrlShortcut`\
  \ 对象的方法和属性。该对象是 `WshShell` 对象的子对象。为了与 `WshUrlShortcut` 对象工作，你必须首先实例化 `WshShell`\
  \ 对象，如下所示。\n\n```\nSet Wshl = WScript.CreateObject(\"WScript.Shell\")\n```\n\n为了在\
  \ Windows 桌面上放置快捷方式，你必须使用 `WshShell` 对象的 `SpecialFolders` 属性为其设置引用。该方法的语法如下：\n\n\
  ```\nWshl.SpecialFolders(SpecialFolderName)\n```\n\n`SpecialFolderName` 指定特殊文件夹的名称，在\
  \ Windows 桌面的情况下为 `Desktop` 特殊文件夹。`Desktop` 特殊文件夹的引用设置如下：\n\n```\nDesktopFolder\
  \ = Wshl.SpecialFolders(\"Desktop\")\n```\n\n| | 注意 |\n| :--- | :--- |\n| | 如果指定的文件夹不存在，WshShell\
  \ 对象的 `SpecialFolders` 属性将返回空字符串。 |\n\n一旦建立了 `WshShell` 对象并设置了特殊文件夹的引用，你就可以使用 `WshShell`\
  \ 对象的 `CreateShortcut` 方法实例化 `WshUrlShortcut` 对象。该方法的语法如下：\n\n```\nWshShell.CreateShortcut(ShortcutPathname)\n\
  ```\n\n在特殊文件夹（如桌面特殊文件夹）中创建 URL 快捷方式时，分配 `ShortcutPathname` 参数的值由两个不同的部分组成。第一部分是特殊文件夹引用的名称。第二个部分是以\
  \ .url 结尾的描述性字符串。\n\n这两个部分信息随后被连接到特殊文件夹名称，如下所示。\n\n```\nSet UrlShortcut = Wshl.CreateShortcut(DesktopFolder\
  \ + \"\\\\Premier Press Publishing.url\")\n```\n\n\n\n\n\n在 Windows 桌面上设置 URL 快捷方式时，下一步是指定该快捷方式所代表的\
  \ URL 地址。设置 `WshUrlShortcut` 对象的 `TargetPath` 属性即可实现此操作。\n\n```\n UrlShortcut.TargetPath\
  \ = \"www.premierpressbooks.com\"\n```\n\n剩下的唯一步骤是使用 `WshUrlShortcut` 对象的 `Save()`\
  \ 方法将对象保存到磁盘，如下所示。\n\n```\n UrlShortcut.Save\n```\n\n完整组合后，上述语句将创建一个指向 Premier Press\
  \ 网站的桌面快捷方式，如下所示。\n\n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\n\
  DesktopFolder = WshShl.SpecialFolders(\"Desktop\")\nSet UrlShortcut = WshShl.CreateShortcut(DesktopFolder\
  \ + \"\\\\Premier Press\nPublishing.url\")\nUrlShortcut.TargetPath = \"www.premierpressbooks.com\"\
  \nUrlShortcut.Save\n```\n\n### 开发桌面 URL VBScript\n\n通过复制上一个示例的逻辑，你可以轻松创建一个 VBScript，用于在\
  \ Windows 桌面上放置一个 URL 快捷方式，如下例所示。\n\n```\n '*************************************************************************\n\
  'Script Name: Script 11.1.vbs\n'Author: Jerry Ford\n'Created: 02/17/03\n'Description:\
  \ 此脚本在 Windows 桌面上创建一个指向公司网站的 URL\n'*************************************************************************\n\
  '初始化部分\n\nOption Explicit\n\nDim WshShl, DesktopFolder, UrlShortcut\n\nSet WshShl\
  \ = WScript.CreateObject(\"WScript.Shell\")\n\n'主处理部分\n\nCreateUrlShortcut()\n\n\
  WScript.Quit()\n\n'过程部分\n\n'创建桌面 URL 快捷方式\nSub CreateUrlShortcut()\n\n  DesktopFolder\
  \ = WshShl.SpecialFolders(\"Desktop\")\n\n  Set UrlShortcut = WshShl.CreateShortcut(DesktopFolder\
  \ + \"\\\\ABC Inc \" _ _\n    \"Home Page.url\")\nUrlShortcut.TargetPath = \"www.abc_inc.com\"\
  \n  UrlShortcut.Save\n\nEnd Sub\n```\n\n该脚本以 `Option Explicit` 语句开始，然后定义了工作所需的变量。接下来实例化\
  \ `WshShell` 对象。主处理部分包含两条语句。第一条语句调用名为 `CreateUrlShortcut()` 的子程序，该子程序创建桌面 URL 快捷方式。第二条语句使用\
  \ `WScript` 对象的 `Quit()` 方法终止脚本的执行。\n\n脚本的关键部分包含 `CreateUrlShortcut()` 子程序中。它首先设置对\
  \ `Desktop` 特殊文件夹的引用。接着创建快捷方式。然后分配其 URL 地址，最后将其保存到磁盘。运行后，此脚本将创建如图 11.3 所示的桌面 URL\
  \ 快捷方式。\n\n![](img/fig11-3.jpg)\n\n图 11.3：由 VBScript 创建的桌面 URL 快捷方式示例\n\n| | Note\
  \ | 本章对桌面快捷方式的介绍有限。如需详细回顾快捷方式（包括其属性和构造），请参考第 12 章“自定义开始菜单和任务栏](#LiB0060_split_000.html_532)”。\
  \ |\n\n### 理解 Windows 注册表\n\n现在你已经编写了一个用于配置桌面 URL 快捷方式的 VBScript，是时候开始编写一个自动配置 Windows\
  \ 桌面壁纸和屏幕保护程序的脚本了。该脚本必须满足许多要求，包括：\n\n* 如果 `D:\\Images` 文件夹不存在则创建它\n* 从软磁盘将 `CorpLogo.bmp`\
  \ 桌面背景文件复制到 `D:\\Images` 文件夹\n* 将 `CorpLogo.bmp` 配置为 Windows 桌面壁纸\n* 将 Windows 桌面背景设置为白色，这样桌面上显示的文字将没有背景颜色\n\
  * 禁止“壁纸填充”设置\n* 启用屏幕保护程序\n* 启用密码保护\n* 在屏幕保护程序开始执行前设置 15 分钟延迟\n* 启用“星空”屏幕保护程序\n*\
  \ 注销用户以使更改生效\n\n## 使用注册表\n\nWindows 注册表是一个内置数据库，为存储以下配置提供了中央仓库：\n\n* 用户配置设置和配置文件信息\n\
  * Windows 操作系统设置\n* 软件配置设置\n* 硬件设置\n* Windows 服务的配置信息\n* 软件设备驱动程序的配置信息\n\n注册表包含了关于\
  \ Windows 计算机几乎每个方面的配置信息。通过修改 Windows 注册表的内容，你可以配置许多 Windows 功能的操作，包括桌面设置、桌面壁纸和屏幕保护程序。\n\
  \n用户和管理员每天都在与注册表工作，往往甚至没有意识到。例如，位于 Windows 控制面板中的工具或小型程序提供了修改注册表的图形化界面。控制面板小型程序通过提供直观的界面简化了更改注册表的过程。处理\
  \ Windows 注册表的另一种方法是使用 `Regedit` 注册表编辑器。\n\n| | Tip | 在 Windows NT、2000 和 XP 上，你也可以使用\
  \ `Regedt32` 注册表编辑器。 |\n\n图 11.4 提供了 Windows XP 注册表的概要视图，它由五个根键组成。\n\n![点击展开](img/fig11-4_jpg)\n\
  \n图 11.4：使用 `Regedit` 注册表编辑器查看注册表内容\n\n| | Note | 修改 Windows 注册表的内容可能会对计算机产生破坏性影响。在某些情况下，甚至会导致计算机无法启动。除非你非常确定对注册表进行更改的影响，否则不要进行更改。此外，尽可能利用控制面板小型程序和其他工具来避免手动修改注册表。最后，请定期备份注册表，以便从任何更改引起的问题中恢复。\
  \ |\n\n### 理解注册表的组织结构\n\nWindows 注册表在逻辑上组织为树状结构，具有五个根键（父键），如表 11.1 所示。\n\n表 11.1：Windows\
  \ 注册表根键\n\n| 键 | 缩写 | 说明 |\n| --- | --- | --- |\n| HKEY_CLASSES_ROOT | HKCR | 存储关于\
  \ Windows 文件关联的信息 |\n| HKEY_CURRENT_USER | HKCU | 存储关于当前登录用户的信息 |\n| HKEY_LOCAL_MACHINE\
  \ | HKLM | 存储本地计算机的全局设置 |\n| HKEY_USERS | N/A | 存储关于该计算机上所有用户的信息 |\n| HKEY_CURRENT_CONFIG\
  \ | N/A | 存储关于计算机当前配置的信息 | |\n\n| | Note | Windows 98 和 Me 上还有一个第六个根键 `HKEY_DYN_DATA`。该键引用了即插即用的信息。\
  \ |\n\n在物理上，Windows 注册表由许多不同的文件组成。在运行 Windows 2000 或 XP 的计算机上，这些文件位于 `%system-root%\\\
  system32\\config`，并包括以下内容：\n\n* `DEFAULT`\n* `SAM`\n* `SECURITY`\n* `SOFTWARE`\n\
  * `SYSTEM`\n* `Userdiff`\n\n除了这些文件，信息还存储在单独的用户配置文件中。这些配置文件位于“文档和设置”文件夹中，并按用户名组织。\
  \ |\n\n\n\n\n\n在这五个注册表项中，你可能只需要处理的是表 11.1 中列出的前三个键。为了方便起见，每个根键都有一个关联的缩写，你在处理这些键时，可以在\
  \ VBScript 中可以使用它们。其余两个键没有缩写。要处理这两个键，你必须使用它们的完整名称（`HKEY_CURRENT_CONFIG` 或 `HKEY_USERS`）来引用它们。\n\
  \n### 键、值与数据\n\nWindows 注册表数据内部存储着由键和值组成的复杂层级结构。`key`（键）可以被看作是一个包含其他键或值的容器。五个根键类似于磁盘驱动器，而位于它们下方的各个级子键可以被看作类似于文件夹。注册表中的实际数据存储在值之中。因此，`value`（值）非常像文件，而文件又存储数据。\n\
  \n数据以以下格式存储在注册表中：\n\n```\n Key : key_type : value\n```\n\n`Key` 代表注册表键的名称。例如，以下语句引用了名为\
  \ `Desktop` 的键，它是 `Control Panel` 键的子键，而该键本身又是 `HKEY_CURRENT_USERS` 根键的子键。\n\n```\n\
  \ HKCU\\\n     Control Panel\\\n          \\Desktop\\\n```\n\n通过在键名末尾添加反斜杠 `\\`\
  \ 来区分键和值，如上所示。相反，值的指定时不带结尾的反斜杠 `\\`，如下文所示。\n\n```\n HKCU\\\n    Control Panel\\\n\
  \         \\Desktop\n              \\Wallpaper\n```\n\n在这个示例中，指定了位于 `Desktop` 键中的\
  \ `Wallpaper` 值。\n\n`Key_type` 指定了要存储的数据类型。Windows 注册表支持存储多种类型的数据，如表 11.2 所示。`Value`\
  \ 用于指定要存储的的数据。\n\n表 11.2：Windows 注册表数据类型\n\n| 类型 | 说明 |\n| --- | --- |\n| `REG_BINARY`\
  \ | 存储二进制值 |\n| `REG_DWORD` | 存储十六进制 DWORD 值 |\n| `REG_EXPAND_SZ` | 存储可扩展字符串 |\n\
  | `REG_MULTI_SZ` | 存储多个字符串 |\n| `REG_SZ` | 存储字符串 |\n\n注册表值有两种类型：`named`（命名）和 `unnamed`（未命名）。大多数注册表值都是\
  \ `named` 的。`named` 值是分配了一个名称的值，通过该名称可以引用值中存储的数据。`unnamed` 值是不带名称的值。每个注册表键都有一个 `unnamed`\
  \ 值，代表其默认值（即在未指定命名值时会更改的值）。`Unnamed` 值在 Windows 注册表用用 `Default` 标签表示，如图 11.5 所示。\n\
  \n![点击展开](img/fig11-5_0.jpg)\n\n图 11.5：当使用 `Regedit` 工具查看时，`Unnamed` 值用 `Default`\
  \ 标签表示\n\n### 编写能够程序化与 Windows 注册表交互的 VBScript\n\n为了使用 VBScript 和 WSH 程序化地与 Windows\
  \ 注册表交互，你必须首先实例化 `WshShell` 对象。`WshShell` 对象提供了三个方法，你可以用于读取、写入、添加、删除和修改注册表键及值。这些方法描述如下：\n\
  \n* `RegRead()`：从注册表中检索键或值\n* `RegWrite()`：创建或修改注册表键或值\n* `RegDelete()`：从注册表中删除键或值\n\
  \n#### 读取注册表键和值\n\n`WshShell` 对象的 `RegRead()` 方法提供了检查注册表键和值内容的能力。`RegRead()` 方法具有以下语法：\n\
  \n```\n X = WshShell.RegRead(KeyOrValue)\n```\n\n`KeyOrValue` 指定了要检索的注册表键或值的名称。`RegRead()`\
  \ 方法只能从注册表中检索以下类型的数据：\n\n* `REG_SZ`\n* `REG_MULTI-SZ`\n* `REG_DWORD`\n* `REG_BINARY`\n\
  * `REG_EXPAND_SZ`\n\n如果 VBScript 尝试检索一个其内容未存储在上述数据类型之一的值，则会返回 `DISP_E_TYPEISMATCH`\
  \ 值。\n\n为了使用 `RegRead()` 方法，你必须首先建立 `WshShell` 对象的实例，如下所示。\n\n```\n Set wshObject\
  \ = WScript.CreateObject(\"WScript.Shell\")\n```\n\n然后你可以使用该方法从注册表中检索信息并将其赋值给变量以便稍后查询。\n\
  \n```\n results = wshObject.RegRead(\"HKCU\\TestKey\\FileName\")\n```\n\n在这个示例中，检索了赋值给\
  \ `FileName` 值的数据（存储在名为 `HKCU\\TestKey` 的键中）。\n\n#### 添加或更改注册表键和值\n\n`WshShell`\
  \ 对象的 `RegWrite()` 方法提供了创建新注册表键或值的能力。如果它们已经存在，它还提供了修改的能力。语法为：\n\n```\n WshShell.RegWrite(KeyOrValue,\
  \ Data, DataType)\n```\n\n`KeyOrValue` 指定键或值的名称。`Data` 是要写入的值。`DataType` 指定数据的类型。\n\
  \n为了使用 `RegWrite()` 方法，你必须首先实例化 `WshShell` 对象，如下所示。\n\n```\n Set wshObject = WScript.CreateObject(\"\
  WScript.Shell\")\n```\n\n然后你可以使用该方法创建或修改注册表值。例如：\n\n```\n wshObject.RegWrite(\"\
  HKCU\\TestKey\\FileName\", \"Error.log\", \"REG_SZ\")\n```\n\n在这个示例中，创建了一个新值，如图\
  \ 11.6 所示。它存储在名为 `Error.log` 的键中，该键位于 `HKCU\\TestKey` 下。如果 `TestKey` 键不存在，`RegWrite()`\
  \ 方法会自动创建它。\n\n![点击展开](img/fig11-6_0.jpg)\n\n图 11.6：使用 `Regedit` 工具查看新值\n\n要修改此值，只需为其赋值一个新的字符串，如下：\n\
  \n```\n wshObject.RegWrite(\"HKCU\\TestKey\\FileName\", \"Error.txt\", \"REG_SZ\"\
  )\n```\n\n在这个示例中，Error 文件的扩展名从 .log 为了 .txt。\n\n注册表键可以存储无限数量的子键。例如，以下语句可用于在 `HKCU\\\
  TestKey\\FileName` 下创建第二个值：\n\n```\n wshObject.RegWrite(\"HKCU\\TestKey\\FileStatus\"\
  , \"Active\", \"REG_SZ\")\n```\n\n#### 删除注册表键和值\n\n`WshShell` 对象的 `RegDelete()`\
  \ 方法为 VBScript 提供了删除注册表键和值的能力。使用该方法时遵循语法：\n\n```\n WshShell.RegDelete(KeyOrValue)\n\
  ```\n\n`KeyOrValue` 指定要删除的键或值的名称。\n\nWindows 2000 和 XP 如果注册表键包含其他子键，则不允许删除它。你必须在删除父键之前删除所有子键。Windows\
  \ 98 和 Me 的情况不同，`RegDelete()` 方法允许删除包含子键的父键。\n\n为了使用 `RegDelete()` 方法，你必须首先实例化 `WshShell`\
  \ 对象。然后你就可以删除键或值。\n\n\n\n\n\n```\n Set wshObject = WScript.CreateObject(\"WScript.Shell\"\
  )\nwshObject.RegDelete \"HKCU\\TestKey\\FileName\"\n```\n\n在此示例中，从 `HKCU\\TestKey`\
  \ 中删除了名为 `FileName` 的值。同样，如下所示删除 `HKCU\\TestKey` 键。\n\n```\n Set wshObject = WScript.CreateObject(\"\
  WScript.Shell\")\nwshObject.RegDelete \"HKCU\\ TestKey\n```\n\n## 定义桌面壁纸和屏幕保护程序设置\n\
  \n修改桌面壁纸和屏幕保护程序设置的 VBScript 需要执行若干任务。这些任务包括创建一个文件夹来存储 `CorpLogo.bmp` 壁纸文件、修改位于 `HKCU\\\
  Control Panel\\Desktop` 键下的 Windows 桌面壁纸和屏幕保护程序值，并在更改完成后注销用户。\n\n### 初始化部分\n\n与书中开发的所有\
  \ VBScript 一样，此 VBScript 被分为三个部分。初始化部分负责定义脚本使用的变量。它还实例化了 `WshShell` 对象和 `FileSystemObject`\
  \ 对象，如下所示。\n\n```\n Option Explicit\n\nDim WshShl, ChangeSettings, shellApp, FsoObject\n\
  Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nSet FsoObject = CreateObject(\"\
  Scripting.FileSystemObject\")\n```\n\n必须建立 `WshShell` 对象，脚本才能使用其 `RegWrite()` 方法。需要\
  \ `FileSystemObject` 对象来访问相关方法，允许脚本在电脑的 D 盘上创建 Images 文件夹，并将 `CorpLogo.bmp` 壁纸文件的副本存储在该文件夹中。\n\
  \n### 主处理部分\n\n主处理部分控制脚本的整体执行，决定何时以及是否修改注册表。这是通过调用 `GetConfirmation()` 函数实现的，如果获得了运行脚本的权限，该函数将返回值\
  \ `6`。如果是如此，则将执行一系列子程序调用，这些子程序会将 `CorpLogo.bmp` 文件复制到电脑的磁盘驱动器上，修改背景壁纸和屏幕保护程序设置，然后启动注销过程。\n\
  \n```\n ChangeSettings = GetConfirmation()\n\nIf ChangeSettings = 6 Then\n  CopyCorpLogo()\n\
  \  SetBackground()\n  SetScreenSaver()\n  ForceLogoff()\nEnd If\n\nWScript.Quit()\n\
  ```\n\n一旦这些每个子程序执行完毕，控制将返回主处理部分，并调用 `WScript` 对象的 `Quit()` 方法以终止脚本执行。\n\n| | 提示\
  \ | | 在此情况下，不需要使用 `WScript` 对象的 `Quit()` 方法，因为按照目前的编写方式，脚本在此处就会停止执行。然而，通过在主处理部分的末尾添加此方法，你可以使脚本更易读，并防止意外放置在过程部分中子程序之外的任何代码被意外执行。\
  \ |\n\n## CopyCorpLogo() 子程序\n\n`CopyCorpLogo()` 子程序使用属于 `FileSystemObject` 对象的多个方法来查询和操作\
  \ Windows 文件系统。首先，该子程序使用 `FolderExists()` 方法确定 `D:\\Images` 文件夹是否已。如果不存在，则使用 `CreateFolder()`\
  \ 方法创建它。由于 Tom 正在处理所有新电脑，该文件夹不应该已经存在。然而，添加此检查为 Tom 以后可能需要重新配置已部署的电脑提供了扩展脚本的基础。脚本执行的最后一件事是将\
  \ `CorpLogo.bmp` 文件复制到 `D:\\Images` 文件夹。\n\n```\n Sub CopyCorpLogo()\n  If (FsoObject.FolderExists(\"\
  D:\\Images\") = false) Then\n    FsoObject.CreateFolder \"D:\\Images\\\"\n  End\
  \ If\n  FsoObject.CopyFile \"a:\\CorpLogo.bmp\", \"D:\\Images\\\"\nEnd Sub\n```\n\
  \n## GetConfirmation() 函数\n\n`GetConfirmation()` 函数使用内置的 VBScript `MsgBox()` 函数在弹出对话框中显示消息。此过程被写成函数而不是子程序，因为它需要向其调用语句返回结果。如果点击“是”按钮，返回值\
  \ `6`；如果点击“否”按钮，则返回值 `7`。\n\n```\n Function GetConfirmation()\n  GetConfirmation\
  \ = MsgBox(\"This script will perform the following \" & _\n    \"tasks:\" & _ vbCrLf\
  \ & vbCrLf & \"1\\. Configure the display of the \" & _\n    \"Corporate Logo the\
  \ Windows desktop\" & _ vbCrLf & _\n    \"2\\. Configure a password protected screen\
  \ saver\" & _ vbCrLf & _\n    \"3\\. Initiate a restart of the of the computer so\
  \ that \" _ _\n    \"changes may take effect\" & _ vbCrLf & vbCrLf & _\n    \"Do\
  \ you wish to continue?\", 36)\nEnd Function\n```\n\n## SetBackground() 子程序\n\n\
  `SetBackground()` 子程序使用 `WshShell` 对象的 `RegWrite()` 方法修改位于 `HKCU\\Control Panel\\\
  Desktop` 子键的三个注册表值。第一个修改的值是 `Wallpaper`，设置为 `D:\\Images\\CorpLogo.bmp`。第二个要修改的值是\
  \ `TileWallpaper`，设置为 `0`。最后，`Background` 值设置为 `255 255 255`。\n\n```\n Sub SetBackground()\n\
  \  'Set CorpLogo.bmp as the desktop\n  Wshl.RegWrite \"HKCU\\Control Panel\\Desktop\\\
  Wallpaper\", _\n    \"D:\\Images\\CorpLogo.bmp\"\n\n  'Make sure the Tile option\
  \ is disabled\n  Wshl.RegWrite \"HKCU\\Control Panel\\Desktop\\TileWallpaper\",\
  \ \"0\"\n\n  'Configure the background to be white\n  Wshl.RegWrite \"HKCU\\Control\
  \ Panel\\Desktop\\Background\", \"255 255 255\"\nEnd Sub\n```\n\n该脚本执行的注册表修改等同于打开桌面对话框（右键点击\
  \ Windows 并选择属性），然后在屏幕保护程序选项卡上修改设置，如图 11.7 所示。\n\n## SetScreenSaver() 子程序\n\n`SetScreenSaver()`\
  \ 子程序修改位于 `HKCU\\Control Panel\\Desktop` 子键的四个屏幕保护程序注册表值。第一个更改的值是 `ScreenSaveActive`，设置为\
  \ `1`。这启用了 Windows 屏幕保护程序。接下来将 `ScreenSaverSecure` 值设置为 `1`。这启用了屏幕保护密码保护。然后将 `ScreenSaveTimeout`\
  \ 值设置为 `900`。这配置了十五的延迟。最后，`SCRNSAVE.EXE` 值设置为 `(\"%SystemRoot%\") & \"System32\\\
  ssstars.scr\"`。这设置为星空模拟屏幕保护程序。\n\n| | 注意 | Windows XP 屏幕保护程序存储在 C:\\Windows\\System2\
  \ 并具有 .scr 扩展名。文件名相当晦涩，很难通过名称识别它们。然而，你可以双击它们来打开并查看。 |\n\n```\n Sub SetScreenSaver()\n\
  \    'Enable the screen saver\n    Wshl.RegWrite \"HKCU\\Control Panel\\Desktop\\\
  ScreenSaveActive\", 1\n    'Enable password protection\n    Wshl.RegWrite \"HKCU\\\
  Control Panel\\Desktop\\ScreenSaverIsSecure\", 1\n\n    'Set up a 15 minute delay\n\
  \    Wshl.RegWrite \"HKCU\\Control Panel\\Desktop\\ScreenSaveTimeOut\", 900\n\n\
  \    'Enable the Starfield screen saver\n    Wshl.RegWrite \"HKCU\\Control Panel\\\
  Desktop\\SCRNSAVE.EXE\", (\"%SystemRoot%\") &\n\"System32\\ssstars.scr\"\n\nEnd\
  \ Sub\n```\n\n该脚本执行的注册表修改等同于打开桌面属性对话框，然后在屏幕保护程序（Screen Saver）属性选项卡上修改设置，如图 11.8\
  \ 所示。\n\n\n\n\n桌面壁纸和屏幕保护程序的配置设置与单个用户关联，并存储在每个用户的配置文件中（例如，`HKCU`）。为了更改 `HKCU`，用户必须登录到计算机。\n\
  \n一旦脚本更改了影响桌面壁纸和屏幕保护程序的设置，用户必须注销更改才能生效。\n\nWindows XP 配备了一个名为 `logoff.exe` 的命令行实用工具，脚本可以调用该工具来自动注销用户。`WshShell`\
  \ 对象有一个名为 `Run()` 的方法，VBScript 可以用它来执行任何 Windows 命令或命令行实用工具。下所示的 `ForceLogoff()`\
  \ 子程序利用了 `Run()` 方法和 `logoff.exe`。当用户重新登录时，更改将会生效。\n\n```\n Sub ForceLogoff()\n\
  \  WshShl.Run(\"%SystemRoot%\") & \"\\System32\\logoff.exe\"\nEnd Sub\n```\n\n##\
  \ 完整的脚本\n\n整个 VBScript 脚本在下方组装。运行时，该 VBScript 将执行所需的 Windows 注册表更改并注销用户。\n\n```\n\
  \ '*************************************************************************\n'Script\
  \ Name: Script 11.2.vbs\n'Author: Jerry Ford\n'Created: 02/16/03\n'Description:\
  \ 此脚本配置 Windows 桌面背景和\n'屏幕保护程序。然后它启动系统重启。\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nDim WshShl, ChangeSettings, shellApp, FsoObject\n\
  Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nSet FsoObject = CreateObject(\"\
  Scripting.FileSystemObject\")\n\n'主处理部分\n'验证用户是否意图更改其屏幕保护程序设置\nChangeSettings =\
  \ GetConfirmation()\n\nIf ChangeSettings = 6 Then\n  CopyCorpLogo()\n  SetBackground()\n\
  \  SetScreenSaver()\n  ForceLogoff()\nEnd If\n\nWScript.Quit()\n\n'程序部分\n\n'此子程序将\
  \ CorpLogo.bmp 文件复制到 D:\\Images\nSub CopyCorpLogo()\n  If (FsoObject.FolderExists(\"\
  D:\\Images\") = false) Then\n    FsoObject.CreateFolder \"D:\\Images\\\"\n  End\
  \ If\n  FsoObject.CopyFile \"a:\\CorpLogo.bmp\", \"D:\\Images\\\"\nEnd Sub\n\n'此子程序提示是否继续执行\n\
  Function GetConfirmation()\n  GetConfirmation = MsgBox(\"此脚本将执行以下 \" & _\n    \"\
  任务:\" & vbCrLf & vbCrLf & \"1\\. 配置 Windows 桌面上的 \" & _\n    \"公司 显示\" & vbCrLf\
  \ & _\n    \"2\\. 配置受密码保护的屏幕保护程序\" & vbCrLf & _\n    \"3\\. 启动计算机重启以便更改 \" & _\n\
  \    \"生效\" & vbCrLf & vbCrLf & _\n\"您要继续吗?\", 36)\nEnd Function\n\n'此子程序配置桌面背景\n\
  Sub SetBackground()\n  '将 CorpLogo.bmp 设置为桌面壁纸\n  WshShl.RegWrite \"HKCU\\Control\
  \ Panel\\Desktop\\Wallpaper\", _\n  \"D:\\Images\\CorpLogo.bmp\"\n\n  '确保平铺（Tile）选项已禁用\n\
  \  WshShl.RegWrite \"HKCU\\Control Panel\\Desktop\\TileWallpaper\", \"0\"\n\n  '将背景颜色设置为白色\n\
  \  WshShl.RegWrite \"HKCU\\Control Panel\\Colors\\Background\", \"255 255 255\"\n\
  End Sub\n\n'此子程序配置屏幕保护程序\nSub SetScreenSaver()\n    '启用屏幕保护程序\n    WshShl.RegWrite\
  \ \"HKCU\\Control Panel\\Desktop\\ScreenSaveActive\", 1\n\n    '启用密码保护\n    WshShl.RegWrite\
  \ \"HKCU\\Control Panel\\Desktop\\ScreenSaverIsSecure\", 1\n\n    '设置 15 分钟延迟\n\
  \    WshShl.RegWrite \"HKCU\\Control Panel\\Desktop\\ScreenSaveTimeOut\", 900\n\n\
  \    '启用星空屏幕保护程序\n    WshShl.RegWrite \"HKCU\\Control Panel\\Desktop\\SCRNSAVE.EXE\"\
  , _\n      (\"%SystemRoot%\") & \"System32\\ssstars.scr\"\n\nEnd Sub\n\n'此子程序启动系统注销\n\
  Sub ForceLogoff()\n  WshShl.Run(\"%SystemRoot%\") & \"\\System32\\logoff.exe\"\n\
  End Sub\n```\n\n## 总结\n\n在本章中，你学习了如何通过程序化的与 Windows 注册表交互，以配置桌面壁纸和屏幕保护程序相关的设置。通过使用本章介绍的技术，你将能够编写\
  \ VBScript，来配置运行 Windows 操作系统的计算机的几乎任何方面。\n\n你还学习了如何创建桌面 URL 快捷方式，以及如何处理特殊文件夹。在下一章中，你将有机会扩展关于快捷方式的知识，并使用它们来配置开始菜单和快速启动工具栏。\n\
  \n# 第 12 章：自定义开始菜单和快速启动工具栏\n\n## 概述\n\nTom 在 ABC, Inc. 的桌面脚本项目之一，是使他部署的所有新计算机上的\
  \ Windows 桌面的外观和感受达到标准化。他计划实现这一目标的方法之一是创建一个名为“标准应用程序”的文件夹，并向其中添加许多快捷方式。这些快捷方式将包括：\n\
  \n* WinZip\n* Adobe Reader\n* Paint Shop\n* FTP 程序\n* Microsoft Word\n\n本章将详细解释快捷方式的工作原理，以及如何使用\
  \ `WshShortcut` 对象来实现这一目标。此外，本章将向你展示如何向开始菜单添加快捷方式，包括向快速启动工具栏添加快捷方式。\n\n## 快捷方式构造\n\
  \n快捷方式为组织应用程序、文件、驱动器、打印机以及许多 Windows 资源的访问提供了工具。将快捷方式放置在 Windows 桌面上可以快速访问这些资源。然而，在\
  \ Windows 桌面上放置过多的快捷方式会导致混乱并分散注意力。\n\n| | 默认情况下，快速启动工具栏位于开始菜单的右侧。它为添加的任何快捷方式提供了单击访问。\
  \ |\n\n快捷方式代表指向另一个资源的链接。通过在每台新 Windows 计算机上一致地创建并在相同位置放置快捷方式，Tom 希望向 ABC, Inc. 的员工引入桌面标准化的概念。\n\
  \n图 12.1 显示了 Windows 记事本程序的快捷方式。\n\n```\n（图 12.1 记事本快捷方式）\n```\n\n你可以通过图标左下角的小弯箭头将快捷方式与与其代表的资源区分开。快捷方式具有许多控制其操作的属性。例如，`Target`\
  \ 属性指定快捷方式所代表资源的位置和文件名。要查看与快捷方式的所有属性，请右键点击快捷方式并从菜单中选择“属性”。这将打开快捷方式的属性对话框并显示其快捷属性页。例如，图\
  \ 12.2 显示了与记事本快捷方式相关的属性。\n\n```\n（图 12.2 检查记事本快捷方式的属性）\n```\n\n表 12.1 列出了并描述了与快捷方式相关的所有属性。\n\
  \n| 属性 | 描述 |\n| --- | ---\n| `Target` | 指定 Windows 对象的完整路径和文件名 |\n| `Start in`\
  \ | 指定应用程序的默认工作目录 |\n\n\n\n\n\n| `Hotkey` | 指定一个用于打开快捷方式的键盘按键序列 |\n| `Run` | 指定应用程序是在普通窗口中打开，还是在最大化或最小化的窗口中打开\
  \ |\n| `Comment` | 指定可选的快捷方式描述 |\n| `Icon filename` | 标识用于表示快捷方式的图标文件名 |\n\n## 使用\
  \ WshShortcut 对象\n\n要创建和管理快捷方式，你需要学习如何使用 `WshShortcut` 对象。此外，你还需要为想要保存每个快捷方式的位置建立一个引用。为了使用\
  \ `WshShortcut` 对象，你必须首先实例化它的父对象 `WshShell`，如下所示。\n\n```\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n```\n\n在继续实例化 `WshShortcut` 对象之前，你必须为保存快捷方式的位置设置一个引用。例如，要为 Windows\
  \ 桌面设置引用，你必须使用 Windows 桌面特殊有文件夹。\n\n```\n DesktopFolder = WshShl.SpecialFolders(\"\
  Desktop\")\n```\n\n现在，你就可以通过使用 `WshShell` 对象的 `CreateShortcut()` 方法来设置 `WshShortcut`\
  \ 对象的实例，如下所示。\n\n```\nSet NotepadShortcut = WshShl.CreateShortcut(DesktopFolder\
  \ & \"\\\\Notepad.lnk\")\n```\n\n如你所示，快捷方式是通过将其目标文件夹与其名称（`\\\\Notepad.lnk`）拼接来定义的。\n\
  \n> **注意**：在上一章中，你学习了如何使用 `WshUrlShortcut` 对象。URL 快捷方式的创建方法与标准快捷方式相同，区别在于你在快捷方式定义的末尾指定\
  \ `.url` 而不是 `.lnk`。指定 `.url` 会导致 `WshUrlShortcut` 对象的实例化，而指定 `.lnk` 则导致 `WshShortcut`\
  \ 对象的指定。\n\n设置快捷方式的下一步是指定快捷方式要表示的 Windows 资源。这是使用 `WshShortcut` 对象的 `TargetPath`\
  \ 属性实现的，如下所示。\n\n```\nNotepadShortcut.TargetPath = \"%windir%\\Notepad.exe\"\n```\n\
  \n创建快捷方式的最后一步是保存快捷方式。这是使用 `WshShortcut` 对象的 `Save()` 方法完成的：\n\n```\nNotepadShortcut.Save()\n\
  ```\n\n> **注意**：记事本应用程序默认位于运行 Windows 98、Me 和 XP 的计算机上的 `C:\\Windows` 文件夹。然而，在 Windows\
  \ 2000 上，它默认位于 `C:\\Winnt`。此外，在安装操作系统期间，可以修改 Windows 系统文件存储文件夹的位置，在这种情况下，记事本应用程序可能位于完全不同的文件夹中。避免任何混淆并便于开发可在任何此类\
  \ Microsoft 操作系统上运行的单一脚本的一种方法，是利用 `%windir%` 环境变量。该变量由操作系统自动创建。它指定了 Windows 系统文件夹的位置，无论它位于何处。\n\
  \n### 桌面快捷方式示例\n\n通过使用上述语句作为模板，可以很容易组装出一个创建记事本应用程序快捷方式的 VBScript。\n\n```\n '*************************************************************************\n\
  'Script Name: Script 12.1.vbs\n'Author: Jerry Ford\n'Created: 02/22/03\n'Description:\
  \ 此脚本为 Windows 记事本应用程序创建一个桌面\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nDim WshShl, DesktopFolder, NotepadShortcut\n\
  \nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\n\n'Main Processing Section\n\
  \nCreateShortcut()\n\nWScript.Quit()\n\n'Procedure Section\n\n'创建桌面快捷方式\nSub CreateShortcut()\n\
  \  DesktopFolder = WshShl.SpecialFolders(\"Desktop\")\n  Set NotepadShortcut = WshShl.CreateShortcut(DesktopFolder\
  \ & _\n    \"\\\\Notepad.lnk\")\n  NotepadShortcut.TargetPath = \"%windir%\\Notepad.exe\"\
  \n  NotepadShortcut.Save()\nEnd Sub\n```\n\n> **注意**：你也可以使用 VBScript 删除快捷方式。要这样做，你需要像下所示使用\
  \ `WshShortcut` 对象的 `Delete()` 方法。\n\n```\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n    DesktopFolder = WshShl.SpecialFolders(\"Desktop\")\n    Set\
  \ FsoObject = CreateObject(\"Scripting.FileSystemObject\")\n    Set NotepadShortcut\
  \ = FsoObject.GetFile(DesktopFolder & \"\\\\notepad.lnk\")\n    NotepadShortcut.Delete\n\
  ```\n\n### 修改快捷方式属性\n\n之前的 VBScript 定义的快捷方式使用单个 `WshShortcut` 对象属性 `TargetPath`\
  \ 属性定义的。因此，快捷方式的其他属性要么未定义，要么使用默认值设置的，如图 12.3 所示。\n\n![点击展开](img/fig12-3_0.jpg)\n\
  \n图 12.3：检查分配给记事本应用程序快捷方式的属性\n\n如表 12.2 所示，`WshShortcut` 对象提供了对与快捷方式相关的所有属性的访问。\n\
  \n表 12.2：WshShortcut 属性\n\n| 属性 | 说明 |\n| --- | --- |\n| `Arguments` | 传递给应用程序的参数\
  \ |\n| `Comment` | 注释 |\n| `Hotkey` | 用于打开快捷方式的键盘序列 |\n| `IconLocation` | 用于显示的图标\
  \ |\n| `TargetPath` | 快捷方式表示的对象完整路径和文件名 |\n| `WindowStyle` | 快捷方式启动时使用的窗口样式（普通、最小化、最大化）\
  \ |\n| `WorkingDirectory` | 快捷方式保存位置的默认目录 |\n\n大部分这些属性都是指定特定信息的字符串。然而，其中三个属性需要进一步解释。\n\
  \n`WshShortcut` 对象的 `Hotkey` 必须包含一个修饰键和一个按键标识。修饰键可以是以下任何一种：\n\n* `CTRL`: Ctrl 键\n\
  * `ALT`: Alt 键\n* `SHIFT`: Shift 键\n* `EXT`: Windows Key\n\n按键标识可以是以下任何一种：\n\n*\
  \ 字母 A–Z\n* 数字 0–9\n* F1–F12\n* 退格键 (Backspace)\n* 删除键 (Delete)\n* 退出键 (Esc)\n*\
  \ 结束 (End)\n* 空格键 (Spacebar)\n* 清除键 (Clear)\n* Tab 键\n* Home 键 (Home)\n* 回车键 (Enter)\n\
  \n`WshShortcut` 对象的 `IconLocation` 用于指定表示快捷方式的图标索引位置。许多 Windows 对象（例如应用程序的可执行文件）包含索引图标列表，可以表示该应用程序。例如，图\
  \ 12.4 显示了 Windows WordPad 应用程序可用的图标。可以通过右键点击 WordPad 应用程序的可执行文件图标、选择“属性”，然后在快捷方式属性表上点击“更改图标”来查看这些图标。\n\
  \n![点击展开](img/fig12-4_0.jpg)\n\n图 12.4：许多 Windows 应用程序提供了可选的索引图标列表\n\n`WshShortcut`\
  \ 对象的 `WindowStyle` 用于指定快捷方式应使用的窗口类型。表 12.3 列出了 `WshShortcut` 对象支持的三种 Windows 样式类型。\n\
  \n表 12.3：快捷方式属性\n\n| WindowStyle |  |\n| --- | --- |\n| 1 | 通过恢复位置和大小来显示窗口 |\n|\
  \ 2 | 显示最大化窗口 |\n| 7 | 最小化窗口 |\n\n\n\n\n\n通过设置额外的快捷方式属性，你可以进一步细化快捷方式的定义。例如，以下 VBScript\
  \ 是上一个示例的修改版本。除了创建记事本快捷方式外，新脚本还设置或修改了若干额外属性。例如，`Arguments` 属性的值被设置为 `\"D:\\DskTpError.log\"\
  `。该属性指定了当使用快捷方式打开它时，记事本应用程序将打开的一个文件。此外，`Description` 属性被设置为 `Desktop Error Log`。因此，每当用户将指针悬在快捷方式上时，都会显示此注释。最后，`Hotkey`\
  \ 属性被设置为 `Ctrl+Alt+D`。这允许通过同时按下 Ctrl、Alt 和 D 键来打开该快捷方式。\n\n```vb\n '*************************************************************************\n\
  'Script Name: Script 12.2.vbs\n'Author: Jerry Ford\n'Created: 02/22/03\n'Description:\
  \ 此脚本为 Windows 记事本应用程序创建一个桌面快捷\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nDim WshShl, DesktopFolder, NotepadShortcut\n\
  \nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\n\n'Main Processing Section\n\
  \nCreateShortcut()\n\nWScript.Quit()\n\n'Procedure Section\n\n'创建桌面快捷方式\nSub CreateShortcut()\n\
  \  DesktopFolder = WshShl.SpecialFolders(\"Desktop\")\n  Set NotepadShortcut = WshShl.CreateShortcut(DesktopFolder\
  \ & \"\\\\Notepad.lnk\")\n  NotepadShortcut.TargetPath = \"%windir%\\Notepad.exe\"\
  \n  NotepadShortcut.Description = \"Desktop Error Log\"\n  NotepadShortcut.Arguments\
  \ = \"D:\\DskTpError.log\"\n  NotepadShortcut.Hotkey = \"CTRL+Alt+D\"\n  NotepadShortcut.Save()\n\
  End Sub\n```\n\n图 12.5 显示了如何为上一个脚本创建的快捷方式设置属性。\n\n![点击展开](img/fig12-5_0.jpg)\n\n\
  图 12.5：验证新快捷方式的属性设置\n\n## 创建标准应用程序文件夹\n\nTom 的脚本项目之一是开发一个“标准应用程序”文件夹。Tom 计划创建此文件夹，并在其中填充若干应用程序快捷方式，以便快速访问公司内所有人使用的系列应用程序。\n\
  \n编写执行此任务的脚本的第一步是创建标准应用程序文件夹。这可以使用与 VBScript 运行时 `FileSystemObject` 对象相关的属性和方法来实现。\n\
  \n### 脚本创建文件夹\n\n使用 `FileSystemObject` 的第一步是将其实例化，如下所示。\n\n```vb\n Set FsoObject\
  \ = CreateObject(\"Scripting.FileSystemObject\")\n```\n\n一旦完成此操作，你就可以访问它所有的属性和方法。然后，你可以使用\
  \ `FileSystemObject` 对象的 `CreateFolder()` 方法来创建标准应用程序文件夹。然而，在此之前，先验证文件夹是否已经存在是一个好习惯。你可以使用\
  \ `FileSystemObject` 对象的 `FolderExists()` 方法来实现这一点。以下 VBScript 语句演示了如何测试标准应用程序文件夹是否存在，以及在它不存在时如何创建。\n\
  \n```vb\n Set FsoObject = CreateObject(\"Scripting.FileSystemObject\")\nIf (fsoObject.FolderExists(\"\
  D:\\Standard Applications\") = false) Then\n  Set StndAppsFolder = fsoObject.CreateFolder(\"\
  D:\\Standard Applications\")\nEnd If\n```\n\n### 向 Windows 文件夹保存快捷方式\n\n一旦创建了标准应用程序文件夹，你就可以为其添加快捷方式。可以将以下\
  \ VBScript 语句添加到上一个示例的末尾，为标准应用程序文件夹添加一个记事本应用程序的快捷方式。\n\n```vb\n Set WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\nSet NotepadShortcut = WshShl.CreateShortcut(StndAppsFolder & \"\
  \\\\Notepad.lnk\")\nNotepadShortcut.TargetPath = \"%windir%\\notepad.exe\"\nNotepadShortcut.Save()\n\
  ```\n\n### 创建并填充标准应用程序文件夹\n\n本章现在涵盖了创建为 ABC, Inc. 创建并填充标准应用程序文件夹的 VBScript 所需的所有构建块，如下。\n\
  \n```vb\n '*************************************************************************\n\
  'Script Name: Script 12.3.vbs\n'Author: Jerry Ford\n'Created: 02/22/03\n'Description:\
  \ 此脚本创建一个标准应用程序文件夹并\n'向其中填充系列应用程序快捷方式\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nDim FsoObject, WshShl, StndAppsFolder,\
  \ ModelShortcut\n\nSet FsoObject = CreateObject(\"Scripting.FileSystemObject\")\n\
  \nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\n\n'Main Processing Section\n\
  \nCreateStndAppsFolder()\nPopulateWinZipShortcut()\nPopulatePaintShopProShortcut()\n\
  PopulateAdobeAcrobatReaderShortcut()\nPopulateWS_FTPShortcut()\nPopulateMSWordShortcut()\n\
  WScript.Quit()\n\n'Procedure Section\n\n'查找并在必要时创建标准应用程序文件夹\n  Sub CreateStndAppsFolder()\n\
  \    If (fsoObject.FolderExists(\"C:\\Standard Applications\") = false) Then\n \
  \    Set StndAppsFolder = fsoObject.CreateFolder(\"C:\\Standard Applications\")\n\
  \    Else\n     fsoObject.DeleteFolder(\"C:\\Standard Applications\")\n     Set\
  \ StndAppsFolder = fsoObject.CreateFolder(\"C:\\Standard Applications\")\n    End\
  \ If\n  End Sub\n\n  '创建并添加 WinZip 快捷方式\n  Sub PopulateWinZipShortcut()\n    Set\
  \ ModelShortcut = WshShl.CreateShortcut(StndAppsFolder & _\n      \"\\\\WinZip.lnk\"\
  )\n    ModelShortcut.TargetPath = \"C:\\Program Files\\WinZip\\WinZip32.exe\"\n\
  \    ModelShortcut.Save()\n  End Sub\n\n  '创建并添加 Paint Shop Pro 快捷方式\n  Sub PopulatePaintShopProShortcut()\n\
  \    Set ModelShortcut = WshShl.CreateShortcut(StndAppsFolder & _\n      \"\\\\\
  Paint Shop Pro.lnk\")\n    ModelShortcut.TargetPath = \"C:\\Program Files\\Paint\
  \ Shop Pro\\PSP.exe\"\n    ModelShortcut.Save()\n  End Sub\n\n  '创建并添加 Adobe Acrobat\
  \ Reader 快捷方式\n  Sub PopulateAdobeAcrobatReaderShortcut()\n    Set ModelShortcut\
  \ = WshShl.CreateShortcut(StndAppsFolder & _\n      \"\\\\Adobe Acrobat Reader.lnk\"\
  )\n    ModelShortcut.TargetPath = _\n      \"C:\\Program Files\\Adobe\\Acrobat 5.0\\\
  Reader\\AcroRd32.exe\"\n    ModelShortcut.Save()\n  End Sub\n\n  '创建并添加 WS_FTP 快捷方式\n\
  \  Sub PopulateWS_FTPShortcut()\n    Set ModelShortcut = WshShl.CreateShortcut(StndAppsFolder\
  \ & _\n      \"\\\\WS_FTP LE.lnk\")\n    ModelShortcut.TargetPath = \"C:\\Program\
  \ Files\\WS_FTP\\WS_FTP95.exe\"\n    ModelShortcut.Save()\n  End Sub\n\n  '创建并添加\
  \ MS Word 快捷方式\n  Sub PopulateMSWordShortcut()\n    Set ModelShortcut = WshShl.CreateShortcut(StndAppsFolder\
  \ & _\n      \"\\\\Microsoft Word.lnk\")\n    ModelShortcut.TargetPath = _\n   \
  \   \"C:\\Program Files\\Microsoft Office\\Office\\Winword.exe\"\n    ModelShortcut.Save()\n\
  \  End Sub\n```\n\n脚本的 `Initialization Section` 定义了它将使用的变量和对象。`Main Processing Section`\
  \ 执行了一系列过程调用，最后使用 `WScript` 对象的 `Quit()` 方法终止脚本执行。\n\n## 配置开始菜单和快速启动工具栏\n\n\n\n\n\
  开始菜单被组织为一系列文件夹，开始菜单位于菜单层级结构的顶端。在其下方是“所有程序”菜单，它默认包含 `Programs` 文件夹和指向若干 Windows 应用程序的快捷方式，如图\
  \ 12.6 所示。\n\n![点击展开展开](img/fig12-6_0.jpg)\n\n图 12.6：检查存储在 `Programs` 特殊文件夹中的文件夹和快捷方式\n\
  \n位于 `Programs` 文件夹下的每个文件夹在从开始菜单查看时都充当菜单，而存储在这些文件夹中的每个快捷方式都充当一个菜单选项。通过从“所有程序”菜单向“标准应用程序”文件夹添加快捷方式，你可以让用户方便地访问他们最常用的应用程序。\n\
  \n### 向 Programs 文件夹添加链接（注：此处应为快捷方式）\n\n为了通过程序方式向开始菜单的“所有程序”菜单中添加菜单和菜单项，你首先需要知道如何访问它。以下\
  \ VBScript 语句演示了如何在开始菜单的“所有程序”菜单中为`记事本`应用程序添加一个菜单项。\n\n```\n Set WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\nStartMenuFolder = WshShl.SpecialFolders(\"StartMenu\")\nSet NotepadShortcut\
  \ = WshShl.CreateShortcut(StartMenuFolder & _\n  \"\\\\notepad.lnk\")\nNotepadShortcut.TargetPath\
  \ = \"%windir%\\notepad.exe\"\nNotepadShortcut.Save\n```\n\n同样地，以下 VBScript 语句演示了如何创建一个`标准应用程序`文件夹，将其作为子菜单添加到“所有程序”菜单中，然后为其添加一个`记事本`快捷方式。\n\
  \n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nStartMenuFolder =\
  \ WshShl.SpecialFolders(\"StartMenu\")\nSet FsoObject = CreateObject(\"Scripting.FileSystemObject\"\
  )\nSet StndAppsFolder = fsoObject.CreateFolder(StartMenuFolder & _\n  \"\\Standard\
  \ Applications\")\nSet NotepadShortcut = WshShl.CreateShortcut(StartMenuFolder &\
  \ _\n  \"\\Standard Applications\\Notepad.lnk\")\nNotepadShortcut.TargetPath = \"\
  %windir%\\notepad.exe\"\nNotepadShortcut.Save\n```\n\n使用本章介绍的信息和示例，你现在已经拥有为 ABC,\
  \ Inc. 开发 VBScript 所需的所有内容。此 VBScript 采用了本章早些开发的`标准应用程序`文件夹，并将其添加到开始菜单下的“所有程序”菜单中，如下所示。\n\
  \n```\n '*************************************************************************\n\
  'Script Name: Script 12.4.vbs\n'Author: Jerry Ford\n'Created: 02/23/03\n'Description:\
  \ 此脚本向 Windows XP 所有程序菜单上的\n'标准应用程序文件夹添加快捷方式\n'*************************************************************************\n\
  \n'初始化部分'\n\nOption Explicit\n\nDim FsoObject, WshShl, StartMenuFolder, StndAppsFolder,\
  \ StdAppsShortcut\n\nSet FsoObject = CreateObject(\"Scripting.FileSystemObject\"\
  )\n\nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\n\n'主处理部分'\n\nModifyAllProgramsMenu()\n\
  \nWScript.Quit()\n\n'过程部分'\n\n'将标准应用程序文件夹添加到“所有程序”菜单\nSub ModifyAllProgramsMenu()\n\
  \  If (FsoObject.FolderExists(\"C:\\Standard Applications\") = false) Then\n   \
  \ MsgBox \"无法修改“所有程序”菜单 - 未找到标准\" & _\n      \"应用程序文件夹\"\n  Else\n    StartMenuFolder\
  \ = WshShl.SpecialFolders(\"StartMenu\")\n    Set StdAppsShortcut = WshShl.CreateShortcut(StartMenuFolder\
  \ & _\n      \"\\\\Standard Applications.lnk\")\n    StdAppsShortcut.TargetPath\
  \ = \"C:\\Standard Applications\"\n    StdAppsShortcut.Save\n  End If\nEnd Sub\n\
  ```\n\n此脚本的核心逻辑位于 `ModifyAllProgramsMenu()` 子过程中。它使用 `FileSystemObject` 对象的 `Exists()`\
  \ 方法来验证`标准应用程序`文件夹是否存在。如果不存在，则显示错误消息。否则，会将快捷方式添加到开始菜单文件夹，使其出现在开始菜单中。图 12.7 演示了在添加到开始菜单后，`标准应用程序`文件夹的状态。\n\
  \n![点击展开展开](img/fig12-7_0.jpg)\n\n图 12.7：使用标准应用程序文件夹位于所有程序菜单\n\n### 向快速启动栏添加快捷方式\n\
  \n另一种为用户提供应用程序快速访问的方法是向快速启动工具添加快捷方式。快速启动工具位于任务栏上。Windows XP 默认启用了快速启动工具。为了通过程序方式管理快速启动工具，你需要处理\
  \ `AppData` 特殊文件夹。向快速启动工具添加快捷方式的方法与向开始菜单添加快捷的方式略有不同。以下 VBScript 语句演示了如何向快速启动工具添加`记事本`应用程序的快捷方式。\n\
  \n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nQuickLaunchToolbar\
  \ = WshShl.SpecialFolders(\"AppData\")\nSet Shortcut = .CreateShortcut(QuickLaunchToolbar\
  \ + \"\\notepad.lnk\")\nShortcut.TargetPath = \"%windir%\\notepad.exe\"\n```\n\n\
  \n\n通过扩展之前的示例，你可以创建为 ABC, Inc. 的计算机填充快速启动工具所需的 VBScript。\n\n```\n '*************************************************************************\n\
  'Script Name: Script 12.5.vbs\n'Author: Jerry Ford\n'Created: 02/23/03\n'Description:\
  \ 此脚本向快速启动工具添加快捷方式\n'*************************************************************************\n\
  \n'初始化部分'\n\nOption Explicit\n\nDim WshShl, QuickLaunchToolbar, ApplicationPath,\
  \ QuickLaunchShortcut\n\nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\n\n\
  '主处理部分'\n\nModifyQuickLaunchToolbar()\n\nWScript.Quit()\n\n'过程部分'\n\n'向快速启动工具添加应用程序快捷方式\n\
  Sub ModifyQuickLaunchToolbar()\n\n  QuickLaunchToolbar = WshShl.SpecialFolders(\"\
  AppData\")\n  ApplicationPath = _\n    QuickLaunchToolbar + \"\\Microsoft\\Explorer\\\
  Quick Launch\"\n\n  Set QuickLaunchShortcut = WshShl.CreateShortcut(ApplicationPath\
  \ + \"\\WinZip.lnk\")\n  QuickLaunchShortcut.TargetPath = \"d:\\Program Files\\\
  WinZip\\Winzip32.exe \"\n  QuickLaunchShortcut.Save\n\n  Set QuickLaunchShortcut\
  \ = _\n    WshShl.CreateShortcut(ApplicationPath + \"\\Calculator.lnk\")\n  QuickLaunchShortcut.TargetPath\
  \ = \"%SystemRoot%\\System32\\calc.exe\"\n  QuickLaunchShortcut.Save\n\nEnd Sub\n\
  ```\n\n图 12.8 显示了在添加两个快捷方式后快速启动栏的样子。\n\n![](img/fig12-8.jpg)\n\n图 12.8：向快速启动栏添加快捷方式\n\
  \n## 总结\n\n本章向你展示了如何使用 `WshShortcut` 对象和 VBScript 运行时 `FileSystemObject` 修改开始菜单上的菜单和菜单选项。你学习了如何配置各种快捷方式属性。本章还向你展示了如何管理快速启动栏的配置。Tom\
  \ 可以利用本章介绍的信息编写 VBScript，用于自定义正在 ABC, Inc. 部署的新 Windows XP 计算机。\n\n\n\n\n本章将解决 Tom\
  \ 的需求，即开发脚本来计划计划执行两种不同的磁盘维护任务：磁盘清理和磁盘碎片整理。在本章中，你将学习如何开发执行这两个任务的脚本。你还将学习如何编写一个设置脚本，为这两个磁盘维护脚本设置执行计划。\n\
  \n## 与 Windows 命令提示符一起工作\n\nWSH 提供了使用 `WshShell` 对象的 `Run()` 方法执行任何 Windows 命令或命令行工具的能力。该方法将指定的命令或命令行工具作为新进程运行。`Run()`\
  \ 方法具有以下语法结构：\n\n```\n WshShell.Run(Command, [WindowStyle], [WaitState])\n```\n\n\
  `Command` 标识要执行的命令或命令行工具，并可能包含任何需要传递给命令或命令行工具的参数。`WindowStyle` 是一个可选参数，用于指定处理命令或命令行工具的窗口的外观。`WindowStyle`\
  \ 的值指定为整数。表 13.1 提供了 `Run()` 方法支持的 Windows 样式选项列表。`WaitState` 是可选的布尔参数，用于指定脚本在继续运行之前是否等待命令或命令行工具执行完毕。将\
  \ `WaitState` 设置为 `True` 会暂停脚本执行。默认值为 `False`。\n\n表 13.1：Run() 方法 Windows 样式选项\n\
  \n| Windows 样式 | 描述 |\n\n| --- | --- |\n| 0 | 隐藏并禁用窗口 |\n| 1 | 激活并显示窗口，将其恢复到原始位置和大小\
  \ |\n| 2 | 激活窗口并最小化 |\n| 3 | 激活窗口并将其最大化 |\n| 4 | 使用之前的位置和大小显示窗口，而不影响当前活动窗口 |\n|\
  \ 5 | 激活窗口，使用其当前位置和大小显示它 |\n| 6 | 最小化窗口并禁用其焦点 |\n| 7 | 显示最小化窗口，而不影响当前活动窗口 |\n| 8\
  \ | 使用其当前位置和大小显示窗口，而不影响当前活动窗口 |\n| 9 | 激活并显示窗口，将其恢复到原始位置和大小 |\n| 10 | 使用调用程序的显示状态来显示窗口\
  \ |\n\n以下示例演示了如何在 VBScript 中使用 `Run()` 方法启动 Windows 记事本应用程序。\n\n```\n Set WshShl\
  \ = WScript.CreateObject(\"WScript.Shell\")\nWshShl.Run \"%windir%\\notepad\"\n\
  ```\n\n下一个示例演示了如何启动记事本并传递要打开的文件名。\n\n```\n Set WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\nWshShl.Run \"%windir%\\notepad c:\\docs\\Activity.doc\"\n```\n\
  \n最后一个示例演示了如何启动记事本并让其显示打开它的脚本副本。为了实现这一技巧，脚本使用了 `WScript` 对象的 `ScriptFullName` 属性，该属性标识当前正在执行的脚本名称。\n\
  \n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\n WshShl.Run \"%windir%\\\
  notepad \" & WScript.ScriptFullName\n```\n\n## 磁盘管理工具和命令行工具\n\n近年来，硬盘容量大幅增加。与此同时，硬盘的成本不断下降。磁盘容量增长的同时，新应用程序的存储需求也在快速增长。因此，对于许多担心支持的用户持续抱怨的桌面管理员来说，仔细的磁盘管理是一项重要的考虑因素。\n\
  \nABC, Inc. 的政策是要求所有员工在每月初运行两个 Windows 磁盘管理工具，帮助管理其桌面计算机的磁盘存储。这些工具是“磁盘清理”和“磁盘碎片整理”。磁盘清理工具通过删除不必要的文件来释放磁盘空间。碎片整理工具重新组织以碎片形式存储在硬盘上的文件。\n\
  \n幸运的是，像许多 Windows 工具一样，磁盘清理和磁盘碎片整理工具提供了命令行界面，开放了它们的功能并使其适用于 Windows 命令行。使用 `WshShell`\
  \ 对象的 `Run()` 方法，你可以在 VBScript 内部执行这两个工具之一。\n\n### 检查手动磁盘清理过程\n\nWindows 应用程序在执行时通常会创建临时文件。通常会在关闭时清理这些文件。然而，系统崩溃或程序挂起等事件经常留下这些文件，不必要地占用磁盘空间。\n\
  \n计算机性能与其硬盘上的可用空空间直接相关。随着驱动开始充满，性能会出现明显的变慢。通常，删除不必要的文件将释放足够的磁盘空间来提高性能并延长硬盘的存储寿命。\n\
  \n回收丢失空间的方法之一是手动搜索并删除不必要的文件。这不仅耗时，而且可能在此过程中意外删除关键的系统或应用程序文件。幸运的是，Windows XP 提供了磁盘清理工具。该工具为用户提供了一个手动查找和删除计算机中许多类型不必要文件的工具。磁盘清理工具可删除以下任何类型的文件：\n\
  \n* 下载的程序文件\n* 临时 Internet 文件\n* 回收站中的文件\n* 临时文件\n* WebClient/发布者临时文件\n* 内容索引器的目录文件\n\
  \nABC, Inc. 的员工已被指示在每月初运行磁盘清理工具。遗憾的是，当磁盘清理运行时，在计算机上工作是一个痛苦的过程。大多数用户已经习惯了不运行它，或者将其作为去咖啡休息的机会。\n\
  \n为了理解磁盘清理是如何工作的，至少运行一次是有帮助的。以下步骤概述了该过程的基本步骤。\n\n1. 点击“开始/所有程序/附件/系统工具”，然后选择“磁盘清理”。如果安装了多个硬盘，将出现“选择驱动器”对话框，如图\
  \ 13.1 (#LiB0067.html_ch13fig01) 所示。\n2. 选择一个驱动器并点击“确定”。如图 13.2 (#LiB0067.html_ch13fig02)\
  \ 所示的对话框出现。显示的选项将根据所选驱动器而异。\n3. 选择要删除的文件类型并点击“确定”。\n4. 在提示确认时点击“是”。\n\n**注意：** 也可以通过\
  \ Windows 命令提示符调用其可执行文件来运行磁盘清理工具。要以此方式启动执行，点击“开始/运行”，然后输入 `cleanmgr` 并点击“确定”。\n\n\
  ### 配置磁盘清理\n\n在互联网上进行了一些研究后，Tom 了解到磁盘清理工具提供了命令行界面。因此，它的执行可以通过 VBScript 启动。一旦编写脚本，Tom\
  \ 计划为该脚本设置自动执行计划。这样，就可以将其安排在用户不使用计算机的下班时间运行。\n\n\n\n\n\n在自动化执行磁盘清理实用程序之前，必须先对其进行配置。遗憾的是，这是一个手动过程。但好消息是，这只需要操作一次。以下步骤概述了配置磁盘清理实用程序的涉及步骤。\n\
  \n1.  点击“开始”，然后点击“运行”。出现“运行”对话框。\n2.  输入`cleanmgr /sageset:1`，如图 13.3 所示，然后点击“确定”。\n\
  \    ![点击展开](img/fig13-3_0.jpg)\n    图 13.3：配置磁盘清理实用程序的命令行执行\n3.  出现“磁盘清理”对话框。选择要删除的文件类型，然后点击“确定”。\n\
  \n|  | 注意事项 | 你可以通过指定不同的数字来创建额外的 `sageset` 配置文件。磁盘清理实用程序最多支持 65,536 个不同的配置。通过创建两个或多个不同的配置，你可以将清理过程分解成块，并更改每个配置的计划执行时间。\
  \ |\n\n#### 创建清理脚本\n\n一旦配置了磁盘清理实用程序以支持命令行执行，就可以对其执行进行脚本化，如下例所示。\n\n```\n '*************************************************************************\n\
  'Script Name: Script 13.3.vbs\n'Author: Jerry Ford\n'Created: 02/24/03\n'Description:\
  \ 此脚本安排在每月第一天 20:00 执行清理实用程序。\n'此实用程序从本地磁盘驱动器删除不必要的文件。\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nDim WshShl, FsoObject, LogFile\n\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n\nSet FsoObject = WScript.CreateObject(\"Scripting.FileSystemObject\"\
  )\n\n'主处理部分\n\nCheckForCleanupLog()\n\nPerformCleanup()\n\nWScript.Quit()\n\n'程序部分\n\
  \n'此过程确保 cleanup.log 文件的存在\nSub CheckForCleanupLog()\n  If (FsoObject.FileExists(\"\
  D:\\cleanup.log\")) Then\n    Set LogFile = FsoObject.OpenTextFile(\"D:\\cleanup.log\"\
  , 8)\n    LogFile.WriteLine \"Cleanup process Started on \" & Date & \" at \" &\
  \ Time\n  Else\n    Set LogFile = FsoObject.OpenTextfile(\"D:\\cleanup.log\", 2,\
  \ \"True\")\n    LogFile.WriteLine \"Cleanup process Started on \" & Date & \" at\
  \ \" & Time\n  End If\nEnd Sub\n\n'此过程执行清理实用程序\nSub PerformCleanup()\n  WshShl.Run\
  \ \"C:\\WINDOWS\\SYSTEM32\\cleanmgr /sagerun:1\"\nEnd Sub\n```\n\n`主处理部分`执行名为 `CheckForCleanupLog()`\
  \ 的子程序，该子程序首先向计算机 `D:\\drive` 上的名为 `cleanup.log` 的文件写入消息。此日志用于记录脚本的执行情况，便于稍后检查并查看脚本上次运行的时间。如果\
  \ `cleanup.log` 不存在（脚本首次运行时将如此），则将由下所示的语句创建。\n\n```\n Set LogFile = FsoObject.OpenTextFile(\"\
  D:\\cleanup.log\", 8)\n```\n\n此语句使用 `FileSystemObject` 对象的 `OpenTextFile()` 方法打开指定的文件以便进行写入。该方法传递两个参数。第一个参数是文件的名称和位置，第二个参数是指定文件打开方式的整数。可用选项如下：\n\
  \n*   `ForReading`。由值为 1 指定。\n*   `ForWriting`。由值为 2 指定。\n*   `ForAppending`。由值为\
  \ 8 指定。\n\n一旦文件被打开，子程序将执行以下语句：\n\n```\n LogFile.WriteLine \"Cleanup process Started\
  \ on \" & Date & \" at \" & Time\n```\n\n此语句使用 `FileSystemObject` 对象的 `WriteLine()`\
  \ 方法向文件写入整行文本，然后执行换行符和回车符。\n\n一旦记录了执行情况，脚本将处理 `PerformCleanup()` 子程序。该子程序按所示运行磁盘清理实用程序。请注意，此时\
  \ `sagerun` 参数被传递给 `cleanmgr` 命令行工具，并提供了之前配置的配置编号。\n\n```\n WshShl.Run \"C:\\WINDOWS\\\
  SYSTEM32\\cleanmgr /sagerun:1\"\n```\n\n现在脚本已经写好，Tom 可以按照本章稍后描述的内容设置其计划执行。\n\n###\
  \ 检查手动磁盘碎片过程\n\n随着时间的推移，所有磁盘驱动器都会填满。随着可用空间变得稀缺，Windows 被迫将文件拆分成更小的碎片，然后存储在磁盘驱动器上允许的任何位置。由于文件没有存储在连续的磁盘空间中，读取和写入它们需要更的时间，从而减慢了计算机的整体性能。\n\
  \n为了限制碎片量并保持计算机高效运行，Tom 计划编写 VBScript 来自动执行碎片整理过程。到目前为止，ABC 公司的员工一直负责使用 Windows\
  \ XP 的磁盘碎片整理工具对自己的硬盘驱动器进行碎片整理。磁盘碎片整理工具以名为 `defrag.exe` 的可执行文件形式提供了命令行界面，从而能够命令行执行。\n\
  \n#### 运行碎片整理实用程序\n\n为了理解碎片整理的工作原理，手动运行一次是有帮助的。以下步骤概述了基本操作。\n\n1.  点击“开始”，“所有程序”，“附件工具”，然后选择“磁盘碎片整理”。\n\
  2.  选择一个硬盘驱动器并点击“分析”以查看碎片状态，如图 13.4 所示。\n    ![点击展开](img/fig13-4_0.jpg)\n    图 13.4：分析计算机碎片状态\n\
  3.  点击“碎片整理”启动碎片整理过程。\n4.  将弹出一个对话框，宣布碎片整理已完成。点击“关闭”。\n\n#### 运行 defrag.exe\n\n\
  使用 `defrag.exe` 命令，你可以从 Windows 命令行碎片整理硬盘。`defrag.exe` 命令的语法如下：\n\n```\n defrag\
  \ <volume:> [/a] [/f] [/v]\n```\n\n`<volume>` 指定要碎片整理的卷。其余参数均为可选。`/a` 参数显示指定驱动器的当前碎片状态分析。默认情况下，`defrag.exe`\
  \ 需要磁盘驱动器 15% 的可用空间才能执行。`/f` 参数提供了在可用空间少于 15% 时强制执行 `defrag.exe`的能力。`/v` 参数提供详细输出。\n\
  \n|  | 注意事项 | 在运行 `defrag.exe` 之前安排磁盘清理，以确保尽可能获得可用空间。 |\n\n以下步骤演示了如何从 Windows 命令行运行\
  \ `defrag.exe`。\n\n1.  点击“开始”，“所有程序”，“附件”，然后点击“命令提示符”。一个 Windows 控制台打开并显示 Windows\
  \ 命令行提示符。\n2.  输入 `defrag` *`volume:`* `/a` 并按回车查看指定驱动器的分析。\n3.  输入 `defrag` *`volume:`*\
  \ `/f` 并按回车对指定的驱动器进行碎片整理。\n\n\n\n\n\n```\n '*************************************************************************\n\
  'Script Name: Script 13.2.vbs\n'Author: Jerry Ford\n'Created: 02/24/03\n'Description:\
  \ 此脚本安排在每月第一天的 22:00 执行 Windows defrag.exe。\n'此实用程序对磁盘驱动器进行碎片整理。\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nDim WshShl, FsoObject, LogFile\n\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n\nSet FsoObject = WScript.CreateObject(\"Scripting.FileSystemObject\"\
  )\n\n'主处理部分\n\nCheckForDefragLog()\n\nPerformDefrag()\n\nWScript.Quit()\n\n'过程部分\n\
  \n'此过程确保 defrag.log 文件存在\nSub CheckForDefragLog()\n  If (FsoObject.FileExists(\"\
  D:\\defrag.log\")) Then\n    Set LogFile = FsoObject.OpenTextFile(\"D:\\defrag.log\"\
  , 8)\n    LogFile.WriteLine \"Defrag.exe Started on \" & Date & \" at \" & Time\n\
  \  Else\n    Set LogFile = FsoObject.OpenTextfile(\"D:\\defrag.log\", 2, \"True\"\
  )\n    LogFile.WriteLine \"Defrag.exe Started on \" & Date & \" at \" & Time\n \
  \ End If\nEnd Sub\n\n'此过程执行 defrage.exe 命令行实用\nSub PerformDefrag()\n  WshShl.Run\
  \ \"c:\\Windows\\System32\\defrag C: /f\"\nEnd Sub\n```\n\n`主处理部分` 通过执行一个名为 `CheckForDefragLog()`\
  \ 的子过程开始运行。该子过程的工作原理与之前清理脚本中同名的子过程完全相同：如果日志文件不存在，则创建一个日志文件并写入一条记录脚本执行情况的消息。\n\n\
  接下来执行 `PerformDefrag()` 子过程。该子过程执行以下语句：\n\n```\n WshShl.Run \"c:\\Windows\\System32\\\
  defrag C: /f\"\n```\n\n如你所见，使用 `WshShell` 对象的 `Run()` 方法来运行 `defrag.exe` 命令，并向其传递\
  \ `/f` 参数，以确保在硬盘空间开始不足时能够执行。\n\n# 计划脚本执行\n\nWindows XP 提供了一项名为“任务计划器”的后台服务，作为设置应用程序、实用程序、命令和脚本计划执行的工具。通过利用该服务的功能，你可以在更合适方便的时间安排脚本执行。\n\
  \nWindows XP 提供了两种与任务计划器交互的方法，如下所示。\n\n*   `at` 命令。一种命令行界面，可从 Windows 命令提示符创建和管理计划任务。\n\
  \n*   **计划任务文件夹。** 一个可以查看、删除和配置计划任务的特殊文件夹。该文件夹还提供了对“计划任务向导”的访问，向导会引导你完成手动设置新计划任务的过程。\n\
  \n|  | 注意事项 | 当你手动运行 VBScript 时，它将使用分配给用户账户的安全权限和权限执行。这允许 VBScript 执行任何你有有权完成的任务。然而，由任务计划器服务执行的脚本将使用另一组安全权限和权限运行。默认情况下，任务计划器服务被配置为使用“本地系统”（Local\
  \ System）账户运行。该账户的安全访问权限有限，可能无法运行你所有的 VBScript。解决这一困境的一种方法是在调度任务时将用户账户与特定脚本关联，从而允许脚本使用该账户的安全权限和权限运行。\
  \ |\n\n|  | 提示 | 任务计划器服务运行的脚本面临的另一个问题是，它们无法访问你运行时可用的相同执行环境。例如，如果你编写了一个依赖于你设置的映射网络驱动器存在的脚本，那么该脚本在由任务计划器服务运行时将失败。映射网络连接等资源与个人配置文件相关联，只有在由登录用户运行时运行时，这些资源才对脚本可用。解决此类情况的一种方法是提供脚本设置自己的临时网络驱动器连接的能力，如\
  \ `WshNetwork` 对象的 `MapNetworkDrive()` 方法提供的那样。 |\n\n为了了解如何使用计划任务向导或 `at` 命令调度你的\
  \ VBScript 的执行，手动操作一遍每个工具的过程将非常有帮助。接下来的两个部分简要概述了使用这两种选项手动调度 VBScript 执行的涉及步骤。\n\n\
  ## 使用计划任务向导\n\n在计划任务文件夹中找到的资源之一是指向“计划任务向导”的链接。该向导将引导你完成创建新计划任务的过程，如下过程所示。\n\n1.\
  \  点击“开始/所有程序/附件工具/系统工具”，然后点击“计划任务”。打开计划任务文件夹。\n2.  双击“创建计划任务”图标。出现计划任务向导。\n3. \
  \ 点击“下一步”。\n4.  显示 Windows XP 应用程序列表。点击“浏览”，找到你的脚本，并点击“打开”。\n5.  为计划任务输入一个描述性名称，选择其执行的时间范围，如图\
  \ 13.5 所示，并点击“下一步”。\n    ![点击展开](img/fig13-5_0.jpg)\n\n    图 13.5：指定执行计划\n6.  指定额外的时间范围选项，如图\
  \ 13.6 所示，并点击“下一步”。具体的选项将根据之前选择的类型而异。\n    ![点击展开](img/fig13-6.jpg)\n\n    图 13.6：微调脚本执行计划\n\
  7.  接下来，系统提示指定运行计划任务的可选用户名和密码，如图 13.7 所示。点击“下一步”。\n    ![点击展开](img/fig13-7.jpg)\n\
  \n    图 13.7：为脚本指定用户名和密码\n\n    |  | 注意事项 | 你可能希望创建一个具有管理员权限且密码不过期的用户账户，以支持执行比本地系统权限更高的脚本。\
  \ |\n8.  点击“完成”。你创建的任务将显示在计划任务中。\n\n## 使用 Windows at 命令\n\n`at` 命令是用于操作任务计划服务的命令行界面。其语法所示。\n\
  \n```\n at [\\\\ComputerName] [[id] [/delete] | /delete [/yes]]\nat [\\\\ComputerName]\
  \ time [/interactive] [/every:date[,...] | /next:date[,...]] command\n```\n\n`ComputerName`\
  \ 是执行任务的计算机名称。如果省略，任务将在定义的计算机上执行。`at` 命令支持的参数概述如下。\n\n*   `id`。指定给现有计划任务的 ID 号。\n\
  *   `/delete`。终止指定的计划任务。\n*   `/yes`。在执行指定操作之前需要确认。\n*   `time`。使用 24 小时制（hh:mm）指定任务执行时间。\n\
  *   `/interactive`。允许与登录用户交互。\n*   `/every:date[,...]`。根据指定的星期或月份指定任务的执行计划；有效日期包括\
  \ M, T, W, Th, F, S, Su 或 1–31，并用逗号隔开。\n*   `/next:date[,...]`。将任务设置为在指定日期下次出现时执行。\n\
  *   `command`。标识要调度的任务、应用程序或脚本。\n\n你在 Windows 命令提示符中使用 `at` 命令。要查看所有当前已计划的任务，请输入\
  \ `at` 命令并按回车键，如下所示。\n\n\n\n\n\n```\n C:\\>at\nStatus ID    Day                \
  \         Time         Command Line\n-------------------------------------------------------------------------\n\
  \        1     Each 1                      8:00 PM     c:\\Cleanup.vbs\n       \
  \ 2     Each 1                     10:00 PM     c:\\Defrag.vbs\n```\n\n如你所示，目前有两个计划任务。第一个任务被分配的\
  \ ID 为 `1`，第二个任务的 ID 为 `2`。这两个任务都安排在每月的第一天运行，第一个在晚上 8 点，第二个在晚上 10 点。\n\n接下来的命令演示了如何设置第三个计划任务，该任务将在每周一、周三和周五的晚上\
  \ 11 点执行。\n\n```\n at 23:00 /every:M, W, F cmd /c \"Script 13.1.vbs\"\n```\n\n如果你重新执行\
  \ `at` 命令，你将会看到任务计划程序现在管理三个任务，如下所示。\n\n```\n C:\\>at\nStatus ID    Day         \
  \                Time         Command Line\n-------------------------------------------------------------------------\n\
  \        1     Each 1                      8:00 PM     c:\\Cleanup.vbs\n       \
  \ 2     Each 1                     10:00 PM     c:\\Defrag.vbs\n        3     Each\
  \ M W F                 11:00 PM     cmd /c \"Script 13.1.vbs\"\n```\n\n以下语句演示了如何在不同的网络计算机上安排任务的执行。\n\
  \n```\n \\\\Desktop10 23:00 /every:M, W, F cmd /c \"Script 13.1.vbs\"\n```\n\n`at`\
  \ 命令还提供了通过指定任务 ID 分配来删除计划任务的能力，如下所示。\n\n```\n at 3 /delete\n```\n\n## 创建调度脚本\n\n\
  一旦你理解了任务调度的基本元素，就可以开发可以与任务执行进行交互并管理的 VBScript。为了实现这一点，你需要使用 `WshShell` 对象的 `Run()`\
  \ 方法和 Windows `at` 命令。\n\n下面的示例显示了 Tom 开发的脚本，用于调度清理和碎片整理 VBScript 的执行。\n\n```\n\
  \ '*************************************************************************\n'Script\
  \ Name: Script 13.1.vbs\n'Author: Jerry Ford\n'Created: 02/24/03\n'Description:\
  \ This script schedules the execution of the Windows\n'Cleanup.exe utility.\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nDim WshShl\n\n'Instantiate WshShell\
  \ 对象\nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\n\n'Main Processing Section\n\
  \nScheduleScripts()\n\nWScript.Quit()\n\n'Procedure Section\n\n'此过程调度其他 VBScript\
  \ 的执行\nSub ScheduleScripts()\n  '使用 WshShell 对象的 Run() 方法来运行 at 命令'\n  WshShl.Run\
  \ \"at 20:00 /every:1 c:\\Cleanup.vbs\"\n  WshShl.Run \"at 22:00 /every:1 c:\\Defrag.vbs\"\
  \nEnd Sub\n```\n\n如你所示，`ScheduleScripts()` 子程序负责调度两个脚本的执行。\n\n### 配置任务计划程序服务\n\n\
  此时，Tom 已编写了三个 VBScript。其中一个是为了自动化磁盘清理工具的执行。另一个是运行 `defrag.exe`，第三个脚本用于调度前两个脚本。此外，Tom\
  \ 知道为了运行磁盘清理脚本，他必须在每台计算机上先为其配置 `sageset` 配置文件。\n\n最后有一对任务仍然存在。任务计划程序服务使用的默认本地系统账户缺乏足够的访问权限和许可来运行磁盘清理或磁盘碎片整理脚本。为了运行磁盘碎片整理\
  \ VBScript，Tom 必须配置运行该脚本的任务，使用具有足够安全权限和许可的用户帐户。该账户将命名为 `MaintTasks`。它的创建将在第 15 章\
  \ 中的“创建管理员帐户”中自动化。\n\n磁盘清理脚本的要求略有不同。虽然运行不需要管理员权限，但它必须与特定的用户账户关联，以便执行某些任务，例如清空用户的回收站。\n\
  \n下面的步骤概述了将用户账户与现有计划任务关联所需的步骤。\n\n1. 点击“开始/所有程序/附件/系统工具”，然后点击“计划任务”。出现“计划任务”文件夹。\n\
  2. 双击计划以打开其属性对话框。\n3. 在“以以下身份运行”字段中输入与任务关联的帐户名称，如图 13.8 所示。\n   ![点击以展开](img/fig13-8_0.jpg)\n\
  \   图 13.8：输入具有足够权限运行脚本的用户帐户名称\n4. 点击“设置密码”，指定与用户帐户关联的密码，然后点击“确定”。\n5. 点击“确定”关闭“计划任务属性”对话框。\n\
  \n|  | 注意 | Tom 在设置计算机桌面时，将能够配置并设置磁盘碎片整理和磁盘清理任务。 |\n\n## 总结\n\n在本章中，你学习了更多关于 `WshShell`\
  \ 对象的 `Run()` 方法。你学习了如何使用它创建磁盘清理和碎片整理的脚本，以及任务计划程序服务。你还学习了如何配置单个计划任务，使其使用本地系统账户以外的用户权限和许可运行。\n\
  \n# 第 14 章：映射网络打印机和磁盘\n\n现在是 Tom 开始处理自动化到打印服务器和文件服务器的桌面连接。这需要 Tom 学习如何处理与 `WshNetwork`\
  \ 对象相关的属性和方法。此外，Tom 必须确定部署和执行其 VBScript 的方法。\n\n## 计划变更\n\nTom 原定的计划是开发两个独立的脚本，并在每台计算机的\
  \ 登录过程中通过本地组策略执行它们。当在本地实施时，组策略使用 `GPEDIT.MSC` 管理。\n\n为了以这种方式实现这些脚本，Tom 通过点击“开始”、“运行”、输入\
  \ `GPEDIT.MSC` 并点击“确定”来打开它。这将打开组策略文件夹，如图 14.1 所示。\n\n![点击以展开](img/fig14-1_0.jpg)\n\
  图 14.1：使用 GPEDIT.MSC 本地设置组策略\n\n脚本策略是组策略的一个组件。Windows 2000 和 XP 支持根据以下四个事件自动执行脚本：\n\
  \n*   **启动**：脚本在系统启动期间、允许用户登录之前使用本地系统帐户的权限执行。\n*   **登录**：脚本在用户登录计算机时使用分配给用户的访问权限和许可执行。\n\
  *   **注销**：脚本在注销过程中使用分配给用户的访问权限和许可执行。\n*   **关机**：脚本作为计算机关机过程中使用本地系统帐户的权限执行。\n\n\
  \n\n\n\n组策略可以针对用户和计算机进行配置。启动和关闭脚本适用于计算机。登录和注销脚本适用于用户。磁盘和打印机网络连接与单个用户关联。通过展开 `User\
  \ Configuration\\Windows Settings\\Script`，你可以显示登录和注销策略。要向登录策略中添加脚本，请双击 `Logon`。这将打开“Logon\
  \ 属性”对话框，如图图 14.2 所示。然后点击 `Add`，输入登录脚本名称，并点击 `OK`。\n\n![Click To expand](img/fig14-2_0.jpg)\n\
  \n图 14.2：在组策略中添加新的登录脚本\n\n在与 Rick 和 Sue 分享了该计划后，ABC 公司的两位 IT 分析师 Tom 改变了主意。Rick\
  \ 和 Sue 解释说，他们可以轻松获取 Tom 的脚本，并使用 AD（活动目录）组策略来实现其执行。这将消除在每台单独服务器上配置脚本执行的需要，并允许从单一位置管理脚本。此外，Tom\
  \ 决定将两个脚本的逻辑合并到一个脚本中，以便在将其交给 Rick 和 Sue 在 AD 组策略中实现时简化交接工作。\n\n| | 注意 | AD 组策略提供了在以下任一级别实施策略的能力：\
  \ |\n|---|---|---|\n| | | OU（组织单位） |\n| | | 站点（Site） |\n\n在 AD 级别，组策略可以通过两个位置之一进行设置：\n\
  \n* **活动目录站点和服务 (Active Directory Sites and Services MMC)**。在站点级别设置组策略时使用。\n* **活动目录用户\
  \ (Active Directory Users and Computers MMC)**。在域或 OU 级别设置组策略时使用。\n\n## 使用 WshNetwork\
  \ 对象\n\n使用 VBScript 和 WSH 查询和管理网络资源的关键是 `WshNetwork` 对象。`WshNetwork` 对象提供的属性使 VBScript\
  \ 能够访问计算机连接的网络信息。`WshNetwork` 对象的属性列如下。\n\n* `UserName`。返回一个包含当前登录用户名称的字符串\n* `ComputerName`。返回一个包含执行脚本的计算机分配名称的字符串\n\
  * `UserDomain`。返回一个包含用户已登录的 Windows 域名的字符串\n\n`WshNetwork` 对象还提供了方法，使 VBScript 能够枚举打印机和网络驱动器，建立打印机和驱动器连接，并断开现有的打印机和驱动器连接。`WshNetwork`\
  \ 对象的方法列如下。\n\n* `EnumNetworkDrives()`。检索所有已建立的映射网络驱动器连接的信息\n* `MapNetworkDrive()`。提供使用本地驱动器映射连接到网络驱动器的能力\n\
  * `RemoveNetworkDrive()`。断开或删除指定的映射驱动器连接\n* `EnumPrinterConnections()`。检索所有已建立的打印机连接的信息\n\
  * `AddPrinterConnection()`。提供建立 MS-DOS 打印机连接的能力\n* `AddWindowsPrinterConnection()`。提供建立\
  \ Windows 打印机连接的能力\n* `RemovePrinterConnection()`。断开或删除指定的网络打印机连接\n* `SetDefaultPrinter()`。指定默认打印作业机\n\
  \n### 访问 WshNetwork 属性\n\n`WshNetwork` 对象的属性是只读的，这意味着它们不能通过 VBScript 修改。一旦设置了 `WshNetwork`\
  \ 对象的实例，就可以轻松访问这些属性。使用 `WScript` 对象的 `CreateObject()` 方法实例化 `WshNetwork` 对象，如下。\n\
  \n```\n Set WshNet = WScript.CreateObject(\"WScript.Network\")\n```\n\n以下示例演示了如何引用\
  \ `WshNetwork` 对象的每个属性并在弹出的对话框中显示它们。\n\n```\n Set WshNet = WScript.CreateObject(\"\
  WScript.Network\")\nMsgBox \"UserName:\" & vbTab & WshNet.UserName & vbCrLf & _\n\
  \  \"UserDomain:\" & vbTab & WshNet.UserDomain & vbCrLf & _\n  \"ComputerName:\"\
  \ & vbTab & WshNet.ComputerName, ,\"Examining WshNetwork Properties\"\n```\n\n图\
  \ 14.3 显示了此示例在名为 Desktop10 的计算机上运行时产生的输出。\n\n![Click To expand](img/fig14-3_0.jpg)\n\
  \n图 14.3：检查 WshNetwork 属性\n\n## 使用网络驱动器\n\n`WshNetwork` 对象提供了多个方法，允许你枚举当前映射网络驱动器的信息，并创建和断开到网络驱动器的网络连接。这些每个方法将在随后的章节中进行演示。\n\
  \n### 枚举网络驱动器\n\n`WshNetwork` 对象的 `EnumNetworkDrives` 方法可用于检索所有已建立的映射网络驱动器连接的信息。`EnumNetworkDrives`\
  \ 方法的语法所示。\n\n```\n objDriveList = WshNetwork.EnumNetworkDrives\n```\n\n`ObjDriveList`\
  \ 是一个变量，将存储 `EnumNetworkDrives` 方法返回的信息。\n\n以下示例了如何使用 `EnumNetworkDrives` 方法在弹出的对话框中显示当前映射的网络驱动器列表。\n\
  \n```\n Set WshNet = WScript.CreateObject(\"WScript.Network\")\nSetMappedDrives\
  \ = WshNet.EnumNetworkDrives\n\nstrDisplayString = \"Currently mapped drives:\"\
  \ & vbCrLf & vbCrLf\nstrDisplayString = strDisplayString + \"Drive Letter:\" & vbTab\
  \ & \"Address\" & _\n   vbCrLf\n\nFor i = 0 to objMappedDrives.Count - 1 Step 2\n\
  \  strDisplayString = strDisplayString & \"Drive \" & objMappedDrives.Item(i) &\
  \ _\n  vbTab & vbTab & objMappedDrives.Item(i+1) & vbCrLf\nNext\n\nMsgBox strDisplayString\n\
  ```\n\n`EnumNetworkDrives` 方法返回一个集合，脚本将其赋值给 `objMappedDrives`。该集合是一个简单的零索引数组。数组元素成对添加。每对中的第一个元素存储与驱动器关联的盘号，第二个元素存储其网络地址。为了处理数组的所有内容，设置了\
  \ For...Next 循环。设置 `Step = 2` 以便成对引用处理数组元素（通过 `i` 和 `i + 1`）。\n\n图 14.4 显示了执行此示例产生的输出。\n\
  \n![Click To expand](img/fig14-4_0.jpg)\n\n图 14.4：枚举用户当前映射的网络驱动器列表\n\n### 映射网络驱动器\n\
  \n网络驱动器是一种特殊的 Windows 文件共享服务，允许远程计算机通过网络访问硬盘器或驱动器内目录的内容。映射网络驱动器是到网络驱动器的网络连接。通过映射连接到网络驱动器，你可以让网络驱动器看起来和用起来就像本地驱动器。一旦以这种方式连接，只要你有适当的安全访问权限，你的脚本就可以对网络驱动器进行读取和写入。\n\
  \n`WshNetwork` 对象的 `MapNetworkDrive` 方法提供了使用本地驱动器映射连接到网络驱动器的能力。`MapNetworkDrive`\
  \ 方法的语法所示。\n\n```\n WshNetwork.MapNetworkDrive(LocalName, NetworkName, [ChangeProfile],\n\
  \n[UserName], [UserPassword])\n```\n\n\n\n\n\n`LocalName` 指定分配给驱动器连接的驱动器号。`NetworkName`\
  \ 指定驱动器的网络名称。`ChangeProfile` 是可选的布尔参数。当设置为 `True` 时，映射的驱动器连接将存储在用户的配置文件中。其默认设置为\
  \ `False`。`UserName` 是一个可选的字符串，用于指定在设置映射驱动器连接时使用的用户帐户。`UserPassword` 也是可选的，与 `UserName`\
  \ 参数配合使用，指定与特定用户帐户关联的密码。\n\n下面的示例演示了如何使用此方法建立到名为 `ABCFileSvr` 的服务器上的共享驱动器的连接。\n\n\
  ```\n Set WshNet = WScript.CreateObject(\"WScript.Network\")\nWshNet.MapNetworkDrive\
  \ \"Z:\", \"\\\\ABCFileServer\\D\"\n```\n\n共享驱动器的名称为 `D`，分配的本地驱动器号为 `Z:`。图 14.5\
  \ 显示了该示例创建的映射驱动器。如你所见，映射驱动器的图标通过在其下方显示网络电缆连接来表示。\n\n![点击展开](img/fig14-5_0.jpg)\n\
  \n图 14.5: 检查上一个示例创建的网络驱动器\n\n### 断开网络驱动器\n\n`WshNetwork` 对象的 `RemoveNetworkDrive`\
  \ 方法用于断开或删除到网络驱动器的映射连接。`RemoveNetworkDrive` 方法的语法所示。\n\n```\n WshNetwork.RemoveNetworkDrive(Name,\
  \ [Force], [ChangeProfile])\n```\n\n`Name` 指定要断开连接的映射驱动器的驱动器号。`Force` 是可选的布尔参数。使用时，`Force`\
  \ 指定是否强制断开连接（在连接当前正在使用的情况下）。`ChangeProfile` 是一个可选参数，指定是否从用户的配置文件中删除该映射驱动器。该选项的默认值为\
  \ `False`。\n\n下面的示例演示了如何使用此方法断开上一个示例中设置的映射驱动器。\n\n```\n Set WshNet = WScript.CreateObject(\"\
  WScript.Network\")\nWshNet.RemoveNetworkDrive \"Z:\"\n```\n\n## 使用网络打印机\n\n`WshNetwork`\
  \ 对象提供了几种方法，能够枚举或发现打印机，并创建和断开打印机连接。这些方法中的每一个将在后续章节中演示。\n\n### 枚举网络打印机\n\n`WshNetwork`\
  \ 对象的 `EnumPrinterConnections` 方法可检索有关所有当前打印机连接的信息。`EnumPrinterConnections` 方法的语法所示。\n\
  \n```\n objPrinterList = WshNetwork.EnumPrinterConnections\n```\n\n`ObjPrinterList`\
  \ 是存储 `EnumPrinterConnections` 方法返回信息的变量。\n\n与 `EnumNetworkDrives` 方法类似，`EnumPrinterConnections`\
  \ 方法返回一个脚本赋值给 `objNtwkPrinters` 的集合。该集合是一个从 0 开始索引的索引数组。元素成对添加到数组中。每对中的第一个元素存储本地打印机名称，第二个元素存储其分配的端口。\n\
  \n下面的示例演示了如何编写一个枚举用户打印机连接的脚本。\n\n```\n Set WshNet = WScript.CreateObject(\"WScript.Network\"\
  )\nSet objNtwkPrinters = WshNet.EnumPrinterConnections\n\nstrDisplayString = \"\
  当前建立的网络打印机连接：\" & _\n  vbCrLf & vbCrLf\n\nstrDisplayString = strDisplayString +\
  \ \"网络打印机名称\" & vbTab & _\n  vbTab & \"端口:\" & vbCrLf\n\nFor i = 0 to objNtwkPrinters.Count\
  \ - 1 Step 2\n  strDisplayString = strDisplayString & objNtwkPrinters.Item(i+1)\
  \ & vbTab & _\n  vbTab & objNtwkPrinters.Item(i) & vbCrLf\nNext\n\nMsgBox strDisplayString\n\
  ```\n\n设置了一个 `For`…`Next` 循环来处理集合的内容。与之前的网络驱动器枚举示例一样，此示例使用步长 `Step` `2` 来处理集合的内容（即数组），并将每对相关元素引用为\
  \ `i` 和 `i + 1`。\n\n图 14.6 显示了此示例产生的输出。\n\n![点击展开](img/fig14-6_0.jpg)\n\n图 14.6:\
  \ 遍历用户当前已连接的打印机列表进行枚举\n\n### 设置网络打印机连接\n\n`WshNetwork` 对象提供了两种方法来建立打印机连接。`AddPrinterConnection`\
  \ 方法用于设置到非 Windows 打印机的连接。`AddWindowsPrinterConnection` 方法应用于设置对 Windows 打印机连接的访问，ABC\
  \ 公司的情况如此。\n\n#### 使用 `AddPrinterConnection()` 方法\n\n`WshNetwork` 对象的 `AddPrinterConnection`\
  \ 方法提供了建立 MS-DOS 打印机连接的能力。`AddPrinterConnection` 方法的语法所示。\n\n```\n WshNetwork.AddPrinterConnection(LocalName,\
  \ NetworkName [,ChangeProfile] [, UserName]\n[,\nUserPassword])\n```\n\n`LocalName`\
  \ 指定分配给打印机连接的名称。`NetworkName` 指定打印机的网络名称。`ChangeProfile` 是可选的布尔参数。当设置为 `True` 时，打印机连接将存储在用户的配置文件中。其默认设置为\
  \ `False`。`UserName` 是可选的字符串，用于指定在设置打印机连接时使用的帐户。`UserPassword` 也是可选的，与 `UserName`\
  \ 参数配合使用，指定与特定用户帐户关联的密码。\n\n| | 提示 | `AddPrinterConnection` 方法应仅用于建立非 Windows 打印机的连接。要设置到\
  \ Windows 打印机的连接，请使用 `AddWindowsPrinterConnection` 方法。 |\n\n下面的示例演示了如何使用 `AddPrinterConnection`\
  \ 方法设置网络打印机连接。\n\n```\n Set WshNet = WScript.CreateObject(\"WScript.Network\")\n\
  WshNet.AddPrinterConnection \"LPT1\", \"\\\\ABCFileServer\\LaserPrinter\"\n```\n\
  \n#### 使用 `AddWindowsPrinterConnection()` 方法\n\n`WshNetwork` 对象的 `AddWindowsPrinterConnection`\
  \ 方法提供了建立 Windows 打印机连接的能力。该方法不需要指定设置打印机连接所需的端口。`AddWindowsPrinterConnection` 方法有两种不同的语法，一种适用于在\
  \ Windows 98 和 Me 上运行的脚本，另一种仅适用于 Windows 2000 和 XP。\n\n适用于 Windows 98 和 Me 脚本的 `AddWindowsPrinterConnection`\
  \ 方法所示：\n\n```\n WshNetwork.AddWindowsPrinterConnection(PrinterPath, DriverName\
  \ [,Port])\n```\n\n适用于 Windows 2000 和 XP 脚本的 `AddWindowsPrinterConnection` 方法所示：\n\
  \n```\n WshNetwork.AddWindowsPrinterConnection(PrinterPath)\n```\n\n`PrinterPath`\
  \ 指定打印机的路径。`DriverName` 标识打印机软件驱动程序的名称。`Port` 是可选参数，指定建立打印机连接时使用的端口。\n\n| | 注意 |\
  \ 为了让 `AddWindowsPrinterConnection` 方法在运行 Windows 98 或 Me 的计算机上工作，必须预先安装打印机软件驱动程序，否则将发生错误。\
  \ |\n\n下面的示例演示了如何使用 `AddWindowsPrinterConnection` 方法在运行 Windows 98 或 Me 的计算机上设置打印机连接。\n\
  \n```\n Set WshNet = WScript.CreateObject(\"WScript.Network\")\nWshNet.AddWindowsPrinterConnection\
  \ _\n\n \"\\\\ABCFileServer\\LaserPrinter\", \"HP DeskJet 710C\"\n```\n\n下面的示例演示了如何使用\
  \ `AddWindowsPrinterConnection` 方法在运行 Windows 2000 或 XP 的计算机上设置打印机连接。\n\n\n\n\n\n\
  ```\n Set WshNet = WScript.CreateObject(\"WScript.Network\")\nWshNet.AddWindowsPrinterConnection\
  \ \"\\\\ABCPrintServer\\LaserPrinter\"\n```\n\n## 删除网络打印机连接\n\n`WshNetwork` 对象的\
  \ `RemovePrinterConnection` 方法提供了断开现有网络打印机连接。`RemovePrinterConnection` 方法的语法所示。\n\
  \n```\n WshNetwork.RemovePrinterConnection(PrinterName, [Force], [ChangeProfile])\n\
  ```\n\n`PrinterName` 是一个字符串，用于指定要删除的打印机连接名称。`PrinterName` 可以使用以下格式之一指定。\n\n- UNC\
  \ 名称（`\\\\ComputerName\\PrinterName`）\n- 端口（LPT1、LPT2 等）\n\n`Force` 是一个可选的布尔值，用于指定是否应强制删除打印机连接（在连接当前正被使用的情况下）。默认值设置为\
  \ `False`。\n\n`ChangeProfile` 是一个可选的布尔值，用于指定是否应将更改应用于用户配置文件（例如，跨登录会话进行保存）。默认值设置为\
  \ `False`。\n\n以下示例演示了如何使用 `RemovePrinterConnection` 方法断开上一个示例中设置的打印机连接。\n\n```\n\
  \ Set WshNet = WScript.CreateObject(\"WScript.Network\")\n WshNet.RemovePrinterConnection\
  \ \"\\\\ABCPrintServer\\LaserPrinter\"\n```\n\n## 建立默认打印机\n\n`WshNetwork` 对象的 `SetDefaultPrinter`\
  \ 方法可用于指定所有打印作业默认提交的打印机。`SetDefaultPrinter` 方法的语法所示。\n\n```\n WshNetwork.SetDefaultPrinter(PrinterName)\n\
  ```\n\n`PrinterName` 是要设置为默认打印机的打印机名称。其值使用其 UNC 名称指定。\n\n以下示例演示了如何修改之前的示例以便将新的网络打印机设置为默认打印机。\n\
  \n```\n Set WshNet = WScript.CreateObject(\"WScript.Network\")\n WshNet.AddWindowsPrinterConnection\
  \ \"\\\\ABCPrintServer\\LaserPrinter\"\n WshNet.SetDefaultPrinter \"\\\\ABCPrintServer\\\
  LaserPrinter\"\n```\n\n## 创建登录脚本\n\n如本章开头所述，Tom 决定将设置网络驱动器和打印机连接的任务合并到单个脚本中。一旦脚本完成，他将把它交给\
  \ Rick 和 Sue，使用 AD 组策略进行实现。然后 Rick 和 Sue 将把 Tom 的 VBScript 设置为登录脚本，从而确保它作为每个用户登录过程的一部分执行。\n\
  \n### 初始化部分\n\n该脚本从定义脚本执行所需的变量和对象开始。除了使用 `Option Explicit` 之外，还添加了 `On Error Resume\
  \ Next` 语句。这允许脚本在网络资源临时不可的情况下继续处理。脚本将编写创建其映射的网络驱动器连接，然后再创建打印机连接。`On Error Resume\
  \ Next` 语句将允许脚本在网络驱动器不可用时继续运行。它还通过防止在登录期间显示错误消息来减少用户的困惑。\n\n```\n Option Explicit\n\
  On Error Resume Next\n\nDim WshNet, strDriveLetter, strNetworkDrive, strNetworkPrinter,\
  \ FsoObject\nDim strUserName\n\nSet WshNet = WScript.CreateObject(\"WScript.Network\"\
  )\n\nSet FsoObject = CreateObject(\"Scripting.FileSystemObject\")\n\nstrDriveLetter\
  \ = \"Z:\"\nstrNetworkDrive = \"\\\\ABCFileSvr\\D\"\nstrCopyRoomPrinter = \"\\\\\
  ABCPrintSvr\\HPLaserPrinter\"\nstrMgmtPrinter = \"\\\\ABCPrintSvr\\CanonColorPrinter\"\
  \n```\n\n除了定义 `WshNetwork` 和 `FileSystemObject` 对象的实例外，“初始化部分”还为四个变量赋值，指定了驱动器号、网络驱动器地址以及公司两个网络打印机的网络地址。分配给\
  \ `str CopyRoomPrinter` 变量的网络打印机将设置为所有非管理人员使用的计算机上的网络打印机连接，而 `strMgmtPrinter` 变量将用于在所有公司管理人员使用的计算机上设置网络打印机连接。\n\
  \n### 主处理部分\n\nVBScript “主处理部分”由系列子程序调用组成，如下。\n\n```\n DisplayNetworkData()\n\n\
  MapNetworkDrive strDriveLetter, strNetworkDrive\n\nstrUserName = WshNet.UserName\n\
  \nIf Left(strUserName, 1) = \"A\" Then\n  SetupPrinterConnection strCopyRoomPrinter\n\
  \  SetDefaultPrinter strCopyRoomPrinter\n  MsgBox \"Copy Room Printer connected!\"\
  \nElse\n  SetupPrinterConnection strMgmtPrinter\n  SetDefaultPrinter strMgmtPrinter\n\
  \  MsgBox \"Mgmt Printer connected!\"\nEnd If\n\nWScript.Quit()\n```\n\n当此脚本运行时，用户将看到桌面上出现一个控制台。`DisplayNetworkData()`\
  \ 子程序显示有关用户网络连接的信息。接下来，执行 `MapNetworkDrive()` 子程序。它负责将连接到公司的文件服务器。网络文件服务器的 UNC 地址被传递给子程序进行处理。\n\
  \n然后，为 `strUserName` 变量分配登录计算机的人员的用户名。ABC, Inc. 的每个用户都分配了一个根据以下指南创建的用户名：\n\n- 用户名的第一个字符是\
  \ `M`（管理人员）或 `A`（其他关联人员）。\n- 用户名的接下来的三个字母是用户名、中间名和姓名的首字母。\n- 用户名的最后两个字符是一个用于区分不同用户的数字。\n\
  \n如果用户名的第一个字符是 `A`，则为 `strCopyRoomPrinter` 代表的打印机设置连接，并将该打印机设置为用户的默认打印机。否则，将为 `strMgmtPrinter`\
  \ 代表的打印机设置连接，并将此打印机设置为默认打印机。\n\n一旦建立了网络驱动器和打印机连接，脚本将执行 `WScript` 对象的 `Quit()` 方法以安全终止脚本执行。\n\
  \n### DisplayNetworkData() 子程序\n\n`DisplayNetworkData()` 子程序显示有关用户网络连接的信息，所示。在控制台中显示的信息在脚本执行期间会短暂显示在用户的桌面上。\n\
  \n```\n Sub DisplayNetworkData()\n  WScript.Echo \"Now configuring network drive\
  \ and printer connections for:\"\n  WScript.Echo \"Computer name: \" & WshNet.ComputerName\n\
  \  WScript.Echo \"Domain name: \" & WshNet.UserDomain\n  WScript.Echo \"User name:\
  \ \" & WshNet.UserName\nEnd Sub\n```\n\n### MapNetworkDrive() 子程序\n\n`MapNetworkDrive()`\
  \ 子程序处理两个输入参数：设置映射时使用的驱动器号和网络驱动器的 UNC。它首先确定网络驱动器是否可用。如果不可，则显示相应信息。如果可用，则检查用于设置网络驱动器连接的驱动器号是否已在占用。如果是，则删除其连接。建立新的网络连接。\n\
  \n```\n Sub MapNetworkDrive(strLetter, strDrive)\n  If FsoObject.DriveExists(strDrive)\
  \ Then\n    If FsoObject.DriveExists(strLetter) Then\n      WshNet.RemoveNetworkDrive\
  \ strLetter\n    End If\n    WScript.Echo \"Mapping drive to \" & strDrive & \"\
  \ as drive letter \" & _\n      strLetter\n    WshNet.MapNetworkDrive strLetter,\
  \ strDrive\n  Else\n    WScript.Echo \"Unable to map to network drive \" & strDrive\
  \ & _\n      \". Resource not available\"\n  End If\nEnd Sub\n```\n\n### SetupPrinterConnection()\
  \ 子程序\n\n\n\n\n\n`SetupPrinterConnection()` 子程序会显示一条记录其执行情况的消息，然后将传递给它的打印机 UNC 路径作为参数，建立与网络打印机的连接。\n\
  \n```\n Sub SetupPrinterConnection(strPrinter)\n  WScript.Echo \"Connecting to network\
  \ printer \" & strPrinter\n  WshNet.AddWindowsPrinterConnection strPrinter\nEnd\
  \ Sub\n```\n\n### `SetDefaultPrinter()` 子程序\n\n`SetDefaultPrinter()` 子程序会显示一条记录其执行情况的消息，然后将传递给它的打印机\
  \ UNC 路径作为参数，将网络打印机设置为用户的默认打印机。\n\n```\n Sub SetDefaultPrinter(strPrinter)\n  WScript.Echo\
  \ \"Setting connection to network printer \" & strPrinter & _\n    \" as default\"\
  \n  WshNet.SetDefaultPrinter strPrinter\nEnd Sub\n```\n\n## 完整的脚本\n\n整个 VBScript\
  \ 脚本组装所示。它将在用户登录时作为活动目录（Active Directory）下的脚本策略运行。它将建立一组标准化的网络连接，从而确保所有用户都拥有相同的基础网络连接集。图\
  \ 14.7 显示了脚本执行时在用户桌面上短暂出现的 Windows 控制台。\n\n![Click To expand](img/fig14-7_0.jpg)\n\
  \n图 14.7: 登录脚本作为网络连接配置过程的一部分显示有关用户网络连接的信息\n\n```\n '*************************************************************************\n\
  'Script Name: Script 14.1.vbs\n'Author: Jerry Ford\n'Created: 02/23/03\n'Description:\
  \ 此脚本将作为 ABC Inc 的登录脚本\n'用于配置网络打印机和网络驱动器访问\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nOn Error Resume Next\n\nDim WshNet, strDriveLetter,\
  \ strNetworkDrive, strNetworkPrinter, FsoObject\nDim strUserName\n\nSet WshNet =\
  \ WScript.CreateObject(\"WScript.Network\")\n\nSet FsoObject = CreateObject(\"Scripting.FileSystemObject\"\
  )\nstrDriveLetter = \"Z:\"\n\nstrNetworkDrive = \"\\\\ABCFileSvr\\D\"\nstrCopyRoomPrinter\
  \ = \"\\\\ABCPrintSvr\\HPLaserPrinter\"\nstrMgmtPrinter = \"\\\\ABCPrintSvr\\CanonColorPrinter\"\
  \n\n'主处理部分\n\nDisplayNetworkData()\n\nMapNetworkDrive strDriveLetter, strNetworkDrive\n\
  \nstrUserName = WshNet.UserName\n\nIf Left(strUserName, 1) = \"A\" Then\n  SetupPrinterConnection\
  \ strCopyRoomPrinter\n  SetDefaultPrinter strCopyRoomPrinter\nElse\n  SetupPrinterConnection\
  \ strMgmtPrinter\n  SetDefaultPrinter strMgmtPrinter\nEnd If\nWScript.Quit()\n\n\
  '程序部分\n\n'显示网络信息\nSub DisplayNetworkData()\n  WScript.Echo \"Now configuring network\
  \ drive and printer connections for:\"\n  WScript.Echo \"Computer name: \" & WshNet.ComputerName\n\
  \  WScript.Echo \"Domain name:   \" & WshNet.UserDomain\n  WScript.Echo \"User name:\
  \     \" & WshNet.UserName\nEnd Sub\n\n'将驱动器映射到公司网络驱动器\nSub MapNetworkDrive(strLetter,\
  \ strDrive)\n  If FsoObject.DriveExists(strDrive) Then\n    If FsoObject.DriveExists(strLetter)\
  \ Then\n      WshNet.RemoveNetworkDrive strLetter\n    End If\n    WScript.Echo\
  \ \"Mapping drive to \" & strDrive & \" as drive letter \" & _\n      strLetter\n\
  \    WshNet.MapNetworkDrive strLetter, strDrive\n  Else\n    WScript.Echo \"Unable\
  \ to map to network drive \" & strDrive & _\n      \". Resource not available\"\n\
  \  End If\nEnd Sub\n\n'建立到公司网络打印机的连接\nSub SetupPrinterConnection(strPrinter)\n \
  \ WScript.Echo \"Connecting to network printer \" & strPrinter\n  WshNet.AddWindowsPrinterConnection\
  \ strPrinter\nEnd Sub\n\n'将网络打印机连接设置为用户的默认打印机\nSub SetDefaultPrinter(strPrinter)\n\
  \  WScript.Echo \"Setting connection to network printer \" & strPrinter & _\n  \
  \  \" as default\"\n  WshNet.SetDefaultPrinter strPrinter\nEnd Sub\n```\n\n## 总结\n\
  \n在本章中，你学习了如何使用 `WshNetwork` 对象。这包括学习如何编写一个登录脚本，用于设置到网络驱动器和打印机的连接。你还学习了如何在运行 Windows\
  \ XP Professional 的计算机上在本地应用组策略。此外，你还了解了 AD 组策略的基本概述。\n\n# 第 15 章：创建管理员账户\n\nTom\
  \ 想要处理的最后一个桌面设置任务是自动创建两个用户账户。其中一个账户将用作应急账户，在发生问题时为 Tom 提供本地登录到用户计算机的能力。另一个账户将用于配置计划任务（例如执行磁盘碎片整理脚本），这些任务需要管理员级权限才能执行。\n\
  \n## 创建本地管理员账户\n\nTom 的最后一个脚本作业是开发一个将用于创建以下用户账户的脚本：\n\n*   `ADMA01`。一个本地桌面管理账户，是本地管理员组的成员。Tom\
  \ 仅在需要本地登录计算机以解决问题或进行紧急维护时才会使用此账户。\n*   `ASAT01`。一个本地调度账户，是本地管理员组的成员，使该账户具有足够的安全权限来运行任何设置为计划任务的脚本。\n\
  \n| 注意 | 为了管理用户账户，Tom 必须在所工作的环境中具有管理员权限。换句话说，Tom 必须是该计算机上本地管理员组的成员。同样，为了管理域用户账户，Tom\
  \ 必须是域管理员组的成员。由于这些是开箱即用的新计算机，Tom 将使用内置的管理员账户来设置一切并运行桌面脚本。 |\n\n### 手动创建用户账户的选项\n\
  \nWindows XP Professional 为 Tom 提供了两种不同的工具用于创建本地账户。这些工具如下：\n\n*   用户账户文件夹\n*   本地用户和组组件\n\
  \n用户账户文件夹位于 Windows 控制面板中。它对创建新账户的控制有限。它可以用于创建、修改和删除用户账户，但对账户功能（如组分配）的控制有限。本地用户和组组件可以在计算机管理控制台中找到。计算机控制台是一个内置的\
  \ MMC（微软管理控制台），可执行许多计算机管理任务，包括用户账户的创建和管理。\n\n### 使用本地用户和组组件\n\n通常情况下，Tom 会使用本地用户和组组件手动创建桌面管理和调度管理员账户。以下程序概述了\
  \ Tom 使用此组件手动创建本地 `ADMA01` 桌面管理账户时经历的步骤。相同的程序也可用于创建本地 `ASAT01` 调度账户。\n\n1.  点击“开始”，右键点击“此计算机”，选择“管理”。打开计算机控制台，如图\
  \ 15.1 所示。\n\n    ![Click To expand](img/fig15-1_0.jpg)\n\n    图 15.1: 使用计算机控制台手动管理用户账户\n\
  \n2.  如有需要，展开控制台树中的“系统工具”节点。\n\n3.  展开“本地用户和组”节点。\n\n\n\n\n\n## 4. 选择 `Users` 节点。计算机本地安全数据库中定义的用户账户列表显示在计算机管理控制台的右侧格中，如图\
  \ 15.2 所示。\n\n    ![点击展开](img/fig15-2_0.jpg)\n\n图 15.2：检查 Windows XP 计算机上当前定义的用户账户\n\
  \n## 5. 右键点击 `Users` 并选择 `New User`。打开 `New User` 对话框，如图 15.3 所示。\n\n    ![点击展开](img/fig15-3_0.jpg)\n\
  \n图 15.3：为新用户账户分配用户名和密码\n\n## 6. 在 `User name` 字段中输入 `ADMT01`。在 `Full name` 字段中输入\
  \ `Desktop Management Acct`，在 `Description` 字段中输入 `Emergency Backdoor Desktop Management\
  \ Acct`，并在 `Password` 和 `Confirm password` 字段中输入密码。\n\n| | 注意 | Tom 为每个账户分配了不同的密码，并且再也不在其他计算机上使用相同的密码。为了确保创建的是强密码，他总是将密码长度为\
  \ 10 个字符，从不使用单词或短语，并且始终包含数字、特殊字符以及大小写字母的组合。 |\n\n## 7. 选择 `Password never expires`\
  \ 以防止账户密码过期并防止在更改密码之前锁定账户。\n\n## 8. 点击 `Create` 然后点击 `Close`。\n\n## 9. 新账户将出现在计算机管理控制台的右侧格中。右键点击该账户并选择\
  \ `Properties`。出现账户的属性对话框。\n\n## 10. 选择 `Member of` 属性页，如图 15.4 所示。默认情况下，新账户被设为本地\
  \ `Users` 组的成员。\n\n    ![点击展开](img/fig15-4_0.jpg)\n\n图 15.4：检查新账户的组组成\n\n## 11.\
  \ 点击 `Add`。出现 `Select Groups` 对话框。\n\n## 12. 点击 `Advanced`。`Select Groups` 对话框展开以显示更多选项。\n\
  \n## 13. 点击 `Find Now`。将显示本地组账户列表，如图 15.5 所示。表 15.1 列出并描述了在图 15.5 中列出的内置本地组。\n\n\
  \    ![点击展开](img/fig15-5_0.jpg)\n\n图 15.5：定位可能添加用户账户的本地组账户\n\n表 15.1：Windows XP\
  \ 专业版的内置本地组账户\n\n| 本地组账户 | 描述 |\n| --- | --- |\n| Administrators | 为其成员提供对所有计算机资源的控制权以及执行任何\
  \ Windows 管理任务的能力。 |\n| Backup Operators | 为其成员提供备份和恢复存储在计算机上的所有文件的能力。 |\n| Guests\
  \ | 包含来账户，该账户对计算机资源的访问非常有限。 |\n| Network Configuration Operators | 为成员提供配置 TCP/IP\
  \ 和其他网络相关配置设置的能力。 |\n| Power Users | 为此组成提供 Users 组的所有功能，外修改某些系统设置和安装应用程序的能力。 |\n\
  | Remote Desktop Users | 为此组成提供使用远程协助工具远程连接到计算机的能力。 |\n| Replicator | 此组不用于管理用户账户。相反，它被操作系统用于支持域复制。\
  \ |\n| Users | 为此组成提供运行应用程序、处理文件、提交打印作业、关闭计算机以及执行各种非管理任务的能力。 |\n| HelpServicesGroup\
  \ | 此组不用于管理用户账户。相反，它被操作系统用于支持帮助支持中心服务。 |\n\n## 14. 选择 `Administrators` 组并双击 `OK`。\n\
  \n## 15. 本地 `Administrators` 组现在显示为该账户已添加的组之一。点击 `OK`。\n\n## 16. 关闭计算机管理控制台。\n\n\
  表 15.1 提供了 Windows XP 专业版内置本地组账户的完整列表。\n\n### Net 命令\n\n在研究在运行 Windows XP 专业版的计算机上脚本创建本地用户账户的方案时，Tom\
  \ 确定他想使用 Windows XP `Net User` 命令或 Windows XP 资源包的 `Addusers` 命令行工具。\n\n`Addusers`\
  \ 命令行工具提供了创建新账户并将账户密码配置为永不过期的能力。遗憾的是，当 Tom 请求资金购买 Windows XP 资源包时，他被告知公司已经投入资金升级桌面基础设施，目前没有额外的资金。\n\
  \n### Net 命令\n\n### Net User\n\nTom 的计划是使用 `WshShell` 对象的 `Run()` 方法来执行 Windows\
  \ XP `Net User` 命令。`Net User` 的语法概述如下：\n\n```\n net user [username [password *]]\
  \ [options [/domain]\nnet user [username] [/delete] [/domain]\nnet user\n```\n\n\
  当不带参数执行 `Net User` 时，它将显示用户账户列表。`Username` 指定要添加、删除、修改或查看的账户。星号 `*` 会提示密码。`/domain`\
  \ 参数导致在域上创建账户。表 15.2 定义了 `Net User` 可用的参数。\n\n表 15.2：Net User \n\n| 参数 | 描述 |\n\
  | --- | --- |\n| `/active:{no; yes}` | 启用或禁用账户 |\n| `/comment:\"text\"` | 为账户添加注释\
  \ |\n| `/countrycode:nnn` | 指定用于帮助和错误的国家/区域代码 |\n| `/expires:{date; never}` | 指定账户过期状态\
  \ |\n| `/fullname:\"name\"` | 设置用户的全名而非用户名 |\n| `/homedir:path` | 建立用户的家目录 |\n|\
  \ `/passwordchg:{yes; no}` | 决定用户是否可以更改密码 |\n| `/passwordreq:{yes; no}` | 指定密码要求\
  \ |\n| `/profilepath:[path]` | 建立用户的登录配置文件 |\n| `/scriptpath:path` | 建立用户的登录脚本路径\
  \ |\n| `/times:{times; all}` | 定义允许使用计算机的时间段，例如：W,8AM-5PM; F,8AM |\n| `/usercomment:\"\
  text\"` | 决定管理员是否可以更改或添加用户注释 |\n| `/workstations: {computername[,…]; *}` | 指定允许用户登录的最多工作站\
  \ |\n\n以下 VBScript 语句演示了如何使用 `Net User` 命令创建名为 `TestAcct` 的用户账户并分配初始密码 `Wql#5?yi`。\n\
  \n```vbscript\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nWshShl.Run\
  \ \"net user TestAcct Wql#5?yi /add\", 0\n```\n\n同样，通过添加 `/domain` 参数可以在 Windows\
  \ 域级别定义相同的账户，如下所示。\n\n\n\n\n\n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\"\
  )\nWshShl.Run \"net user TestAcct Wql#5?yi /add /domain\", 0\n```\n\n遗憾的是，`Net User`\
  \ 命令有一个缺点。你无法使用它来创建或配置密码永不过期的账户。这会给 Tom 带来麻烦，因为分配给 `ADMA01` 和 `ASAT01` 账户的这些密码将会过期，导致账户在\
  \ Tom 更改密码之前被禁用。虽然这不会影响桌面管理账户的用途，但它会影响调度器账户，并导致碎片整理脚本在执行时失败。为了解决这个问题，Tom 必须在脚本创建账户后手动修改用户账户，将其密码设置为永不过期。\n\
  \n## Net Localgroup（本地组管理）\n\n除了提供创建、修改和删除本地及域用户帐户能力的 `Net User` 命令外，Tom 还需要一种方法来自动将用户账户添加到本地管理员组。在找一番后，他发现可以使用另一个\
  \ Windows 命令来完成此任务。该命令是 `Net Localgroup` 命令，它提供了向本地计算机和 Windows 域上的本地组添加用户帐户的能力。\n\
  \n| | Note | | 组账户提供了一种轻松管理大量用户帐户的方法。当账户成为组账户的成员时，它将继承分配给该组的所有安全权限和权利。 |\n\n`Net\
  \ Localgroup` 命令有多种用法。下面列出了这些不同形式的 `Net Localgroup` 命令的语法。\n\n```\n net localgroup\
  \ [groupname [/comment:\"text\"]] [/domain]\nnet localgroup groupname {/add [/comment:\"\
  text\"] | /delete} [/domain]\nnet localgroup groupname name [...] {/add | /delete}\
  \ [/domain]\n```\n\n当不带参数执行 `Net Localgroup` 时，它会显示计算机名称以及该计算机上定义的本地组。`Groupname`\
  \ 指定要管理的本地组名称。`/comment:\"text\"` 参数为新组或现有组添加或修改注释。指定 `/domain` 会导致操作在域级别进行，而不是在本地计算机上。`name\
  \ […]` 参数用于列出要从本地组添加或删除的一个多个用户名或组名。`/add` 参数指定添加操作，`/delete` 指定删除操作。\n\n| | Note\
  \ | | 另一个可以用于配置组成员身份的 Windows XP 命令是 `Net Group` 命令。该命令提供了添加、显示和修改位于本地计算机或计算机连接的域上的全局组中的用户帐户的能力。该命令支持的各种语法形式概述如下。\
  \ | \n\n```\n net group [groupname [/comment:\"text\"]] [/domain]\n    net group\
  \ groupname {/add [/comment:\"text\"] | /delete} [/domain]\n    net group groupname\
  \ username[ ...] {/add | /delete} [/domain]\n```\n\n不带任何参数执行时，`Net Group` 命令会显示服务器上的组列表。`groupname`\
  \ 参数指定要添加、扩展或删除的组名。`/comment:\"text\"` 参数用于为新组或现有组添加注释。指定后，`/domain` 参数在域级别执行操作，而不是在本地计算机上。`username[...]`\
  \ 参数用于指定要从指定组中添加或删除的一个多个用户名。`/all` 参数指定添加操作，`/delete` 参数指定删除操作。 |\n\n## 创建登录脚本\n\
  \n此时，Tom 已经审查了手动创建账户的过程，并确定了他在开发用于自动创建账户的 VBScript 时需要的 Windows 命令。他现在准备好编写脚本了。与之前的脚本一样，Tom\
  \ 将以模块化的方式开发它。首先，他将定义组成“初始化部分”（Initialization Section）和“主处理部分”（Main Processing Section）的语句，然后将开发脚本的每个函数和子程序。\n\
  \n### 初始化部分\n\n与他的所有其他脚本一样，Tom 从指定 `Option Explicit` 和 `On Error Resume Next` 语句开始，如下所示。\n\
  \n```\n 'Initialization Section\n\nOption Explicit\n\nOn Error Resume Next\n```\n\
  \n添加 `On Error Resume Next` 语句是为了防止脚本在发生错误时终止，并提供在命令执行后查询其返回状态的能力。这样，如果脚本由于某种原因在尝试创建第一个用户账户时遇到错误，它可以继续运行并尝试创建第二个账户。\n\
  \n接下来，定义了一个常量，用于在脚本生成的所有弹出对话框中显示标题栏消息。这将提供一致且专业的呈现效果。\n\n```\n Const cTitlebarMsg\
  \ = \"Administrative Account Creator\"\n```\n\n接下来的四条语句（如下所示）定义了脚本使用的多个变量。第一个变量代表\
  \ `WshShell` 对象，其余定义的变量在脚本的“主处理部分”中使用。\n\n| | Note | | 脚本还使用了其他变量。这些变量定义在使用它们的函数和子程序中。尽可能地将变量声明移动到程序级别有助于收紧变量作用范围，并确保变量在脚本的其他部分不会意外重用或不当修改。\
  \ |\n\n```\n Dim WshShl\nDim intRunStatus\nDim strDskMgtct\nDim strSchedct\n```\n\
  \n接下来，设置 `WshShell` 对象的实例，如下所示，以便后续使用 `Net User` 和 `Net Localgroup` 命令。\n\n```\n\
  \ 'Instantiate the WshShell object\nSet WshShl = WScript.CreateObject(\"WScript.Shell\"\
  )\n```\n\n“初始化部分”的最后两个语句为 `strDskMgtct` 和 `strSchedct` 变量赋值。这些值代表由脚本创建的账户名称。\n\n\
  ```\n strDskMgtct = \"ADMA01\"\nstrSchedct = \"ASAT01\"\n```\n\n### 主处理部分\n\n脚本的“主处理部分”从调用\
  \ `CallVerification()` 函数开始，如下所示。\n\n```\n 'Get permission to proceed\nintRunStatus\
  \ = CallRunVerification()\n```\n\n该函数会弹出一个对话框，请求许可继续执行脚本。如果授予许可，它返回值 `6`。函数返回的值赋值给\
  \ `intRunStatus` 变量，以便对其进行查询，如下。\n\n```\n If intRunStatus = 6 Then\n\n  'Call the\
  \ procedure that creates new accounts\n  CreateAdminAcct(strDskMgtct)\n  CreateAdminAcct(strSchedct)\n\
  \nEnd If\n```\n\n脚本的“主处理部分”像之前的脚本一样，通过执行 `WScript` 对象的 `Quit()` 方法结束，如下所示。\n\n```\n\
  \ 'Terminate script execution\nWScript.Quit()\n```\n\n\n\n\n\n`CallRunVerification()`\
  \ 函数旨在显示如图 15.6 所示的弹幅对话框，以确认其执行。\n\n![点击展开](img/fig15-6_0.jpg)\n\n图 15.6：使用 VBScript\
  \ 内置的 `MsgBox()` 函数创建确认提示\n\n如下所示的 `CallRunVerification()` 函数定义了一个名为 `strMsgText`\
  \ 的局部变量。然后，它将一个文本字符串赋值给该变量。为了使字符串更具可读性，使用了 VBScript 的 `vbTab` 和 `vbCrLf` 字符串格式常量来重构字符串在弹幅对话框中的呈现方式。随后执行\
  \ `MsgBox()` 函数并传递了三个参数。第一个参数是赋值给 `strMsgText` 变量的值。\n\n```\n Function CallRunVerification()\n\
  \n  Dim strMsgText\n\n  'Display the splash screen and ask the user if he or she\
  \ wants to play\n  strMsgText = \"This script will create the following Administrative\
  \ level\" & _\n    \" user accounts on the local computer:\" & vbTab & vbCrLf &\
  \ vbCrLf & _\n    strDskMgtAcct & \" - A Desktop Management Administrative Account\"\
  \ & vbCrLf & _\n    strSchedAcct & \" - A Admin level user account used to run scheduled\
  \ tasks\" & _\n    vbCrLf & vbCrLf & \"Do you wish to continue?\"\n\n  CallRunVerification\
  \ = MsgBox(strMsgText, 36, cTitlebarMsg)\n\nEnd Function\n```\n\n传递给 `MsgBox()`\
  \ 函数的第二个参数是 `36`。这个数字代表赋值给 `vbYesNo`（值为 4）和 `vbQuestion`（值为 32）常量的数值之和。该参数的净效果是显示一个弹幅对话框，其中包含“是”和“否”按钮以及一个图形问号图标。\n\
  \n| | 注意 | 请参阅第 6 章中的第 6.5 表“VBScript MsgBox() Function Buttons”以及数据收集、通知和错误报告”，获取\
  \ `MsgBox()` 函数可以显示的按钮列表。此外，请参阅第 6 章中的第 6.6 表“VBScript MsgBox() Function Icons”，以查看可以显示的图标列表。\
  \ |\n\n传递给 `MsgBox()` 函数的第三也是最后一个参数是 `cTitlebarMsg`。该参数代表脚本“初始化部分（Initialization\
  \ Section）”中定义的常量，用于指定脚本显示的所有弹幅对话框的标准标题栏消息。\n\n### The CreateAdminAcct() Subroutine\n\
  \n如下所示的 `CreateAdminAcct()` 子程序负责实际创建用户账户并将其添加到本地管理员组。它接受并处理一个名为 `strNewAcctName`\
  \ 的参数，该参数作为输入传递给它。此变量将包含子程序要创建的用户账户名称。它首先定义两个局部变量。第一个变量是 `strPasswd`，用于存储账户密码。第二个变量是\
  \ `intCmdResult`，用于存储由 `Net User` 和 `Net Localgroup` 命令生成的返回代码。然后将 `strCmdResult`\
  \ 值赋值为初始默认值 0。\n\n随后，子程序调用 `GetValidPassword()` 函数，该函数提示指定一个有效的密码。函数调用返回的值随后被赋值给\
  \ `strPasswd` 变量。\n\n```\n Sub CreateAdminAcct(strNewAcctName)\n\n  Dim strPasswd\n\
  \  Dim intCmdResult\n\n  intCmdResult = 0\n\n  strPasswd = GetValidPasswd()\n\n\
  \  'Create the new account\n\n  intCmdResult = WshShl.Run(\"net user \" & strNewAcctName\
  \ & \" \" & _\n    strPasswd & \" /add\", 0)\n\n  'Add the account to the local\
  \ administrators group\n  If intCmdResult = 0 then\n    intCmdResult= WshShl.Run(\"\
  net localgroup Administrators /add \" & _\n      strNewAcctName, 0)\n    If intCmdResult\
  \ <> 0 then\n      MsgBox \"Error Code 2: Account creation failed for \" & _\n \
  \       strNewAcctName, , cTitlebarMsg\n    Else\n      MsgBox \"Account creation\
  \ successful for \" & strNewAcctName, , cTitlebarMsg\n    End If\n  Else\n    If\
  \ intCmdResult <> 0 then\n      MsgBox \"Error Code 1: Account creation failed for\
  \ \" & _\n        strNewAcctName, , cTitlebarMsg\n    End If\n  End If\n\nEnd Sub\n\
  ```\n\n接下来，子程序执行 `WshShell` 对象的 `Run()` 方法，传递了 `Net User` 命令、`strNewAcctName` 变量、`strPasswd`\
  \ 变量、`/add` 选项以及 `0`（会导致命令在后台隐藏）。该命令的结果存储在 `intCmdResult` 变量中，并对其进行检查。如果结果不为，则执行\
  \ `Net Localgroup` 命令将账户添加到本地管理员组。如果该命令的结果不为零，则显示错误消息。如果结果为零，则显示成功消息。\n\n### The\
  \ GetValidPassword() Function\n\n脚本的最后一个过程如下所示，是一个名为 `GetValidPassword()` 的函数。它的任务是显示如图\
  \ 15.8 所示的弹幅对话框。它首先定义两个局部变量。`strPasswd` 变量用于存储 Tom 输入的密码，`strValidPassword` 变量将用于测试是否提供了有效密码。\n\
  \n![点击展开](img/fig15-8_0.jpg)\n\n图 15.8：脚本并非将密码嵌入脚本中，而是设计为手动收集\n\n```\n Function\
  \ GetValidPasswd()\n\n  Dim strPasswd\n  Dim strValidPassword\n\n  strValidPassword\
  \ = \"NO\"\n\n  Do Until strValidPassword = \"YES\"\n\n    'Prompt for a password\
  \ to assign to the account\n    strPasswd = InputBox(\"Type a password for the \"\
  \ & strDskMgtAcct & _\n    \" account and click on OK.\" , cTitleMsg)\n\n    If\
  \ strPasswd = \"\" Then\n      MsgBox \"Password Missing: You must enter a valid\
  \ 8 character \" _\n        \"Password to continue.\", , cTitleMsg\n    Else\n \
  \     If Len(strPasswd) < 8 Then\n        MsgBox \"Incorrect password length. Password\
  \ must be at least \" _\n          \"8 characters\", , cTitleMsg\n      Else\n \
  \       GetValidPasswd = strPasswd\n        strValidPassword = \"YES\"\n      End\
  \ If\n    End If\n\n  Loop\n\nEnd Function\n```\n\n## 完整的脚本\n\n\n\n\n\n整个管理员账户创建脚本汇编如下。执行时，它将创建两个管理员级别的管理账户。随后需要\
  \ Tom 记得将 `ASAT01` 账户的密码设置为永久有效，以防止账户被锁定，从而导致碎片整理脚本无法执行。Tom 还需要修改运行碎片整理脚本的计划任务，使其使用此账户运行。\n\
  \n```\n '*************************************************************************\n\
  'Script Name: Script 15.1.vbs\n'Author: Jerry Ford\n'Created: 03/15/03\n'Description:\
  \ 此脚本创建 2 个管理员级别的用户账户。\n'其中为桌面支持团队提供进入计算机的后门。\n'另一个提供运行计划性管理员\n'脚本的足够权限。\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nOn Error Resume Next\n\nConst cTitlebarMsg\
  \ = \"Administrative Account Creator\"\n\nDim WshShl\nDim intRunStatus\nDim strDskMgtAcct\n\
  Dim strSchedAcct\n\n'Instantiate the WshShell object\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n\nstrDskMgtAcct = \"ADMA01\"\nstrSchedAcct = \"ASAT01\"\n\n'Main\
  \ Processing Section\n\n'Get permission to proceed\nintRunStatus = CallRunVerification()\n\
  \nIf intRunStatus = 6 Then\n\n  'Call the procedure that creates new accounts\n\
  \  CreateAdminAcct(strDkMgtAcct)\n  CreateAdminAcct(strSchedAcct)\nEnd If\n\n'Terminate\
  \ script execution\nWScript.Quit()\n\n'Procedure Section\n\nFunction CallRunVerification()\n\
  \n  Dim strMsgText\n\n  'Display the splash screen and ask the user if he or she\
  \ wants to play\n  strMsgText = \"This script will create the following Administrative\
  \ level\" & _\n    \" user accounts on the local computer:\" & vbTab & vbCrLf &\
  \ vbCrLf &\n    strDkMgtAcct & \" - A Desktop Management Administrative Account\"\
  \ & vbCrLf &\n    strSchedAcct & \" - A Admin level user account used to run scheduled\
  \ tasks\" & _\n    vbCrLf & vbCrLf & \"Do you wish to continue?\"\n\n  CallRunVerification\
  \ = MsgBox(strMsgText, 36, cTitlebarMsg)\n\nEnd Function\n\nSub CreateAdminAcct(strNewAcctName)\n\
  \n  Dim strPasswd\n  Dim intCmdResult\n\n  intCmdResult = 0\n\n  strPasswd = GetValidPasswd()\n\
  \n  'Create the new account\n  intCmdResult = WshShl.Run(\"net user \" & strNewAcctName\
  \ & \" \" & _\n     strPasswd & \" /add\", 0)\n\n  'Add the account to the local\
  \ administrators group\n  If intCmdResult = 0 then\n    intCmdResult= WshShl.Run(\"\
  net localgroup Administrators /add \" & _\n      strNewAcctName, 0)\n    If intCmdResult\
  \ <> 0 then\n      MsgBox \"Error Code 2: Account creation failed for \" & _\n \
  \       strNewAcctName, , cTitlebarMsg\n    Else\n      MsgBox \"Account creation\
  \ successful for \" & strNewAcctName, , cTitlebarMsg\n    End If\n  Else\n    If\
  \ intCmdResult <> 0 then\n      MsgBox \"Error Code 1: Account creation failed for\
  \ \" & _\n        strNewAcctName, , cTitlebarMsg\n    End If\n  End If\n\nEnd Sub\n\
  \n'This procedure creates a backdoor account for the desktop management team\nFunction\
  \ GetValidPasswd()\n\n  Dim strPasswd\n  Dim strValidPassword\n\n  strValidPassword\
  \ = \"NO\"\n\n  Do Until strValidPassword = \"YES\"\n\n    'Prompt for a password\
  \ to assign to the account\n    strPasswd = InputBox(\"Type a password for the \"\
  \ & strDskMgtAcct & _\n    \" account and click on OK.\" , cTitleBarMsg)\n\n   \
  \ If strPasswd = \"\" Then\n      MsgBox \"Password Missing: You must enter a valid\
  \ 8 character \" & _\n      \"password to continue.\", , cTitlebarMsg\n    Else\n\
  \      If Len(strPasswd) < 8 Then\n        MsgBox \"Incorrect password length. Password\
  \ must be at\" & _\n          \"least 8 characters long\", , cTitleBarMsg\n    \
  \  Else\n          GetValidPasswd = strPasswd\n          strValidPassword = \"YES\"\
  \n        End If\n      End If\n\n   Loop\n\nEnd Function\n```\n\n## 总结\n\n在本章中，你复习了手动创建新用户账户并将其添加到组中所需的步骤。你还学习了如何编写脚本创建新用户账户，以及如何将这些账户添加到组。使用这里介绍的技术，你可以开始开发各种账户管理脚本，这些脚本可用于本地计算机和\
  \ Windows 域上创建或修改用户账户。\n\n# 第三部分：专业项目 2——分析应用程序日志\n\n## 章节列表\n\n- 第 16 章: 项目案例研究——分析应用程序日志\n\
  - 第 17 章: 使用配置文件控制脚本执行\n- 第 18 章: 开发脚本日志分析器\n- 第 19 章: 调度脚本执行\n- 第 20 章: 维护 30 天摘要存档\n\
  \n### 项目 2 概览\n\n在该项目中，Intuit Mechanical Tools 的一名程序员被分配改进一个内部开发系统的报告流程。通过使用 VBScript，你将学习如何创建一个汇总报告。\n\
  \n为了开发这些脚本，你将学习涉及文件输入的基本步骤。这包括在尝试处理文件之前验证文件是否存在、打开文件以及读取文件的各种技术。你还将学会在如何创建新文件、如何向这些文件写入数据，以及在脚本完成对文件的处理后关闭文件。\n\
  \n该项目还将向你展示如何执行文件管理操作，如移动和删除文件。在项目的开发过程中，你将学习许多技术，包括：\n\n- 处理存储在 INI 文件中的配置设置\n\
  - 读取并分析格式化的报告文件\n- 创建新的文本文件\n- 向现有文本文件追加信息\n- 程序化自动执行 VBScript 的执行\n- 向 Windows\
  \ 事件日志写入消息\n\n\n\n\n\n由于团队规模较小，Intuit Mechanical Tools 的程序员们一直非常忙碌。最近情况变得糟糕，以至于他们的工作已经开始出现滞后。管理层要求他们寻找简化日常活动的方法，以便为公司想要为一种计算机化冷却系统开发的新应用程序腾出时间。\n\
  \nMolly 被分配的日常任务之一是每天早上对订单/库存应用程序生成的四个应用程序文件进行人工审核和整合，并汇总成一份供管理层审阅的报告。虽然这项任务并不复杂，但\
  \ Molly 每天需要花费一个多小时的时间来完成。为了帮助简化她的工作量，她建议将这一过程自动化。\n\n起初，她考虑过修改内部应用程序，但决定使用 `C`\
  \ 和 `C++` 来实现她所需要的功能将花费过的时间、精力和测试工作。她想要一种快速简单的方法来开发一个插件程序，让她能够以最少的工作量创建它，并且团队中的其他成员容易支持。最终，她决定\
  \ `VBScript` 是这项工作的正确工具。和团队中的其他程序员一样，Molly 对 Visual Basic 已经比较熟悉。她认为学习 `VBScript`\
  \ 的曲线会很小。她还知道，作为一种脚本语言，`VBScript` 非常适合快速应用开发，并用于填充那些不值得投入大量开发时间（因此经常被忽略）的应用程序缺陷。\n\
  \n### 分析内部应用程序日志\n\n遗憾的是 Molly 的是，尽管管理层批准了她的新 `VBScript` 项目，但他们并没有减少她的任何工作来为她提供额外时间处理该项目。这意味着她必须快速开发出解决方案，以免让她当前的工作进一步积压。\n\
  \n作为开始，Molly 决定花一点时间记录她每天都要经历的现有手动流程。等她完成时，Molly 将分析和整合订单/库存系统报告的过程分解为以下步骤。\n\n\
  1. 订单/库存应用程序生成的报告每天晚上 20:00 之前创建。每天早上，她都会前往 `Windows 2000` 服务器，应用程序在那里存储报告和日志文件。\n\
  2. 随后，她将四份报告中的每一个拷贝到软磁盘上并注销。\n3. 接下来，她按照所示重命名这些报告中的每一个：\n    * `Error.log ER-MM-DD-YY.txt`\n\
  \    * `DailySales.txt DS-MM-DD-YY.txt`\n    * `DailyReturns.txt DR-MM-DD-YY.txt`\n\
  \    * `DailyProduction.txt DP-MM.DD.YY.txt`\n4. 回到自己的桌面后，她打开每份报告并检查其内容。\n5. 她开始将每份报告的部分剪切并粘贴到新报告中，并将其保存在计算机的硬盘上。\n\
  6. 最后，她打印一份报告副本，并将其放在公司运营经理 Hank 的收件箱里。\n\n此外，Molly 保留了至少一个月的日志和报告文件历史。她这样做的方法是在每个新月的第一个工作日登录到报告和日志文件所在的\
  \ `Windows 2000 Server`，并删除除当前月和上个月文件以外的所有文件。\n\n### 检查错误日志\n\n不幸的是，当订单/库存应用程序每天运行时，它会将遇到的任何硬件或软件相关错误报告到一个名为\
  \ `Error.log` 的日志文件中。该文件的示例如图 16.1 所示，它仅仅是一个纯文本文件。所有的错误消息都由几部分信息组成，如下文所示。\n\n![点击展开](img/fig16-1_0.jpg)\n\
  \n图 16.1：写入 `Error.log` 的错误消息带有日期时间戳，并包含错误代码和描述\n\n* `HH:MM:SS` 格式的时间戳\n* `MM/DD/YY`\
  \ 格式的日期时间戳\n* 范围在 `1–5` 之间的错误代码，其中 `1` 表示严重错误，`5` 表示信息性错误\n* 自由格式的消息文本，提供错误的详细说明\n\
  \n当 Molly 审核此报告时，她通常只寻找被分配为 `1`、`2` 或 `3` 级的错误。然后她将这些错误剪切并粘贴，作为她负责创建的新每日报告的首要条目。\n\
  \n### 检查每日销售报告\n\nMolly 通常检查的第一份报告是每日销售报告，名为 `DailySales.txt`。一个典型的 `DailySales.txt`\
  \ 报告示例如图 16.2 所示。\n\n![点击展开](img/fig16-2_0.jpg)\n\n图 16.2：每日销售报告包含详细信息和摘要信息\n\n\
  在审核此报告时，Molly 将位于报告底部“按零件分类销售摘要”部分的信息拷贝到她的新报告中。\n\n### 检查每日退货报告\n\n在审核每日退货报告时（其示例如图\
  \ 16.3 所示），Molly 关注报告底部提供的摘要信息。她将这些信息复制到她正在创建的摘要报告。\n\n![点击展开](img/fig16-3_0.jpg)\n\
  \n图 16.3：每日退货报告提供了项目详情和摘要\n\n### 检查每日生产报告\n\nMolly 每天早上检查的第四份报告是每日生产报告，称为 `DailyProduction.txt`。该报告将前一天的生产分为两个组：硬件和用品。Molly\
  \ 将这两个部分的信息复制到摘要报告中。\n\n![点击展开](img/fig16-4_0.jpg)\n\n图 16.4：每日生产报告将信息细分为多个\n\n\
  ### 需求分析\n\n为了确保管理层完全了解她要开始的项目范围，并确保获得他们的完全批准，Molly 决定列出她的项目将满足的需求列表。列表如下：\n\n*\
  \ 自动处理所有应用程序报告和日志文件\n* 创建单个 `INI` 文件，用于存储控制 `VBScript` 执行的配置信息\n* 创建单一摘要报告\n* 在生成报告的\
  \ `Windows 2000 Server` 上自动建立一个月的报告和日志存档\n* 在三周内完成此流程的开发和测试\n* 将摘要报告的提取职责从 `Windows\
  \ 2000 Server` 交给运营部门，以便完全将应用程序程序员从中移除\n\n完成此列表后，她将其发送给老板批准。老板随后将其转发给运营经理 Hank。Hank\
  \ 最初有些犹豫，但同意指派员工负责提取和打印摘要报告。Hank 随后将该电子邮件转发给夜班运营主管，通知几周后需要将此任务添加到服务器列表中。\n\n###\
  \ 执行概要设计\n\n在获得经理和 Hank 的正式批准，并在研究了每天为运营经理生成摘要销售报告的流程后，Molly 开始进行概要设计工作。她确定可以通过开发一系列微小的\
  \ `VBScript` 来完成任务，每个脚本负责执行一个特定的任务。Molly 然后列出一份需要执行的任务列表并将其分组在一起，如表 16.1 所示。\n\n\
  \n\n\n\n# 表 16.1: 日志分析器报告合并任务列表\n\n| 任务类型 | 描述 |\n| --- | --- |\n| 初始化文件 | 开发一个单一的\
  \ INI 文件，用于存储控制处理订单/库存系统每个报告和日志文件的脚本执行的配置信息。开发一个脚本化流程，用于读取和处理 INI 配置文件的设置。 |\n|\
  \ 日志分析器 | 开发一个 VBScript 日志分析器来读取并处理 `Error.log` 文件的内容。开发一个 VBScript 日志分析器来读取并处理\
  \ `DailySales.txt` 的内容。开发一个 VBScript 日志分析器来读取并处理 `DailyReturns.txt` 的内容。开发一个 VBScript\
  \ 日志分析器来读取并处理 `DailyProduction.txt` 的内容。 |\n| 脚本调度 | 调度处理报告和日志文件的执行脚本。调度每月运行一次的\
  \ VBScript，该脚本将维护为期一个月的报告和日志归档。 |\n| 归档管理 | 开发一个 VBScript，该脚本在执行时可确保在生成日志和报告文件的\
  \ Windows 2000 服务器上维持一个月的日志和报告文件。 |\n\n## 开发和处理 INI 配置文件\n\nMolly 不想将脚本执行设置嵌入到她将开发的每个\
  \ VBScript 中，而是想创建一个单一的 INI 文件并在其中存储尽可能设置。这样，如果运营人员将来某天要求对脚本进行某些更改，可以通过修改 INI 文件而不是修改脚本来实现。这将有助于更轻松地执行配置更改，并消除在原本必须手动编辑的脚本中可能意外引入错误的机会。\n\
  \nMolly 仍在确定 INI 文件的确切格式和内容。目前，她知道自己想在 INI 文件中为每个日志分析器脚本创建一个节（section），如 图 16.5\
  \ 所示。\n\n![点击展开](img/fig16-5_0.jpg)\n\n图 16.5：Molly 目前正在开发的 INI 文件的大概视图\n\n如你所见，Molly\
  \ 已经开始在 INI 文件的第一个节中添加设置。这些设置及其目的将在 第 17 章，“使用配置文件来控制脚本执行](#LiB0087_split_000.html_745)”中进行详细介绍。\n\
  \n为了开发处理 INI 文件的 VBScript 过程，Molly 必须学习如何使用 VBScript 运行时 `FileSystemObject`。特别是，她需要学习如何使用它的许多方法，包括：\n\
  \n*   `FileExists()`：在尝试打开 INI 文件之前验证该文件是否存在\n*   `OpenTextFile()`：处理 INI 文件的内容\n\
  *   `ReadLine()`：从 INI 文件中一次读取一行\n*   `Close()`：在完成处理后关闭 INI 文件\n\n## 创建日志和报告分析器\n\
  \n起初，Molly 曾考虑创建一个单一脚本来处理由订单/库存应用程序创建的每个报告和日志文件。然而，每个报告之间的显著差异将使这项开发工作成为一项繁琐的任务，因此她决定为每个文件开发一个日志分析器。这种方法的一个处是，她可以回来修改单个日志分析器脚本，而无需担心由于发生修改错误而导致所有日志分析器失效。如果以后报告和日志文件变得更加复杂并需要进一步修改，这种方法提供了最大的灵活性。\n\
  \n对于处理 `Error.log` 文件的日志分析器，Molly 希望能够读取报告并根据错误代码提取错误。她计划使用 INI 文件来指定要报告的告警级别。目前，她计划仅报告级别为\
  \ 1、2 或 3 的错误消息。\n\n用于 `DailySales.txt` 和 `DailyReturns.txt` 报告的报告分析器几乎完全相同。默认情况下，它们都将只提取存储在\
  \ INI 文件中的设置所指定的摘要报告信息。然而，这两个文件的报告分析器还被设计为在有必要时支持提取详细信息。\n\n默认情况下，处理 `DailyProduction.txt`\
  \ 文件的报告分析器将被设置为合并并报告位于硬件（Hardware）和物料（Supplies）部分的详细信息。但是，通过修改其在 INI 文件中对应节的设置，Molly\
  \ 可以将报告限制在硬件部分或物料部分，或者完全禁用该文件对这两个部分的报告。\n\n为了开发这些日志分析器脚本，Molly 必须学习如何使用 VBScript\
  \ 运行时 `FileSystemObject`。特别是，她需要学习如何使用它的许多方法，包括：\n\n*   `FileExists()`：在尝试打开日志或报告文件之前验证该文件是否存在\n\
  *   `OpenTextFile()`：处理日志或报告文件的内容\n*   `ReadLine()`：从日志文件中一次读取一行\n*   `SkipLines()`：在读取日志文件时跳过表头行\n\
  *   `Close()`：在完成处理后关闭日志或报告文件\n*   `WriteLine()`：向摘要报告文件写入一行输出\n*   `WriteBlankLines()`：在摘要报告文件中写入空行并格式化数据呈现\n\
  \nMolly 还计划为这些脚本提供向 Windows 事件日志写入其操作信息的能力。为了完成此任务，她将需要使用 `WshShell` 对象的 `LogEvent()`\
  \ 方法。\n\n图 16.6 显示了 Molly 手动创建的报告示例。如你所见，它由从四个文件手动复制粘贴的语句组成。\n\n![点击展开](img/fig16-6_0.jpg)\n\
  \n图 16.6：合并报告示例\n\n通过 VBScript 自动创建此报告，Molly 将消除一项一直在执行的日常工作。此外，她还将消除手动创建报告时偶尔发生的错误。\n\
  \n## 调度分析器脚本的执行\n\n将使用 Windows 任务调度服务来设置第一个分析文件的调度执行，该文件完成后将调用第二个分析器。通过这种单线程执行脚本的方法，Molly\
  \ 确保了每个脚本都能访问生成的摘要报告文件，而不必担心是否有其他日志分析器正在访问它。第一个日志分析器将创建一个摘要报告，其余分析器在执行时向其追加数据。\n\
  \n除了日志分析器之外，Molly 将创建一个在任务调度控制下每月运行一次的 VBScript，以清理旧的日志、报告和摘要文件。由于这些脚本的调度只需要在一个服务器上执行一次性任务，Molly\
  \ 将使用 Windows 2000 计划任务向导手动设置它们的调度执行。\n\n\n\n\n\n为了实现该任务的自动化执行，Molly 将与 VBScript\
  \ 运行时对象 `FileSystemObject` 一工作。具体来说，她需要学习如何使用它的许多方法，包括：\n\n*   `FileExists()`：在尝试打开日志或报告文件之前，验证该文件是否存在。\n\
  *   `MoveFile()`：将一个或多个文件移动到归档文件夹，至少保留一个月。\n*   `DeleteFile()`：在文件通过一个月的保留期后，删除存储在归档中的一个或多个文件。\n\
  \nMolly 还计划为脚本提供功能，能够向 Windows 应用程序事件日志写入其操作信息。为了完成这项任务，她将需要使用 `WshShell` 对象的 `LogEvent()`\
  \ 方法。\n\n## 总结\n\n在本章中，你了解了 Molly Masterson 以及她面临的挑战——即为 Intuit Mechanical Tools\
  \ 的订单/库存应用程序简化报表流程。在准备应对这项任务时，Molly 决定 VBScript 和 WSH 将为她提供快速开发新报告摘要生成和归档管理流程的最佳工具。\n\
  \n# 第 17 章：使用配置文件控制脚本执行\n\n在本章中，你将观察 Molly 如何学习使用 INI 文件（读作 \"eye 'n eye\"）并确定她将向\
  \ INI 文件中添加哪些信息。你还将学习如何使用属于 VBScript 运行时对象 `FileSystemObject` 的方法，以开发一个可以处理 INI\
  \ 文件内容的程序。这包括打开 INI 文件、定位相应的节、读取其设置，然后关闭 INI 文件。\n\n## 创建控制脚本执行的配置文件\n\nMolly 在开发报告和日志分析脚本时的设计目标之一是尽可能将脚本的配置外部化。Molly\
  \ 与许多应用程序一起工作，这些应用程序使用 INI 文件来存储配置设置和用户偏好。需要时，她必须编辑这些文件，通常是遵循应用程序开发者提供的指令，或者作为尝试调试应用程序或硬件设备问题努力的一部分。\n\
  \n在大多数情况下，她从并不关注这些文件。然而，在决定如何设计设计她的 VBScript 时，她决定像她看到其他应用程序使用的那样，将脚本的配置设置外部化。为此，她决定创建一个单一的\
  \ INI 文件，并为她计划开发的每份报告和日志分析脚本存储配置设置。\n\n在深入进入脚本开发过程之前，Molly 决定花一点时间在互联网上学习更多关于 INI\
  \ 文件及其结构的知识。INI 或初始化文件是带有 `.ini` 扩展名的纯 ASCII 文本文件。多年来它们一直用于存储 Windows 操作系统及其硬件软件应用程序的设置。\n\
  \nINI 文件提供了在不修改代码的情况下修改应用程序、实用程序或脚本行为的能力。INI 文件使得维护此类资源变得更容易，并防止在修改硬编码配置设置时引入错误的可能性。此外，INI\
  \ 文件为那些担心意外损坏注册表的缺乏经验的程序员提供了一个存储应用程序设置的替代位置。\n\nINI 文件确实有一些缺点。与 Windows 注册表（对许多人来说仍然完全是一个谜团）不同，INI\
  \ 文件很容易被发现和删除。INI 文件存储在计算机硬盘上，这意味着在处理它们时必须发生磁盘 I/O，这自然会减慢必须访问它们的应用程序或脚本。\n\n###\
  \ INI 文件的用途\n\nINI 文件用于存储定制化设置和偏好。因为它们只是纯 ASCII 文本文件，所以任何文本编辑器都可以创建和修改 INI 文件。自从\
  \ Windows 95 发布以来，微软强烈鼓励应用程序和硬件开发者开始将所有配置设置存储在注册表中。大多数应用程序开发者都朝着这个方向发展。然而，如果你在运行\
  \ Windows 2000 或 Windows XP 的计算机上搜索 `*.INI`（例如），你仍然会发现几十甚至上百个正在使用的 INI 文件。\n\n尽管微软继续推动应用程序和硬件供应商将所有设置移动到\
  \ Windows 注册表，但你会发现许多地方仍在使用 INI 文件。这对于旧的硬件和软件尤其是如此。为了兼容这些旧的程序和设备，微软保留了许多旧的 INI 文件。这样一来，在\
  \ Windows 注册表时代编写的旧应用程序仍然有地方存储和检索应用程序设置。你会在 Windows 系统目录中找到大量的 INI 文件。你还会在散落在硬盘各个文件夹中的中找到它们。\n\
  \n微软的操作系统也使用 INI 文件。例如，Windows 2000 和 XP 都会将启动信息存储在名为 `boot.ini` 的文件中。这个 INI 文件在计算机每次启动时都会引用，并用于显示启动选项列表。\n\
  \n微软还使用 INI 文件来存储其许多实用程序和应用程序的配置设置。例如，如果你玩纸牌游戏（Solitaire），你会发现应用程序的配置设置维护在一个名为 `Win.ini`\
  \ 的文件中。为了证明这一点，你可以打开 `Win.ini` 并查看纸牌游戏应用程序的设置。关闭 `Win.ini`，打开纸牌游戏应用程序并进行配置更改。当你重新打开\
  \ `Win.ini` 文件并检查 `[Solitaire]` 节中的设置时，你会发现它们已经发生了变化。\n\n| | 注意事项 |\n| :--- | :---\
  \ |\n| | 你也可以使用如 Microsoft Word 等应用程序来修改 INI 文件。然而，像 Microsoft Word 这样的文字处理程序会嵌入许多隐藏字符，这会对\
  \ INI 文件造成破坏性影响。如果你使用 Microsoft Word 等应用程序来修改你的 INI 文件，请确保将它们保存为纯文件。 |\n\n### INI\
  \ 文件结构\n\nINI 文件是一种可以被任何程序、实用程序或脚本读取或写入的文件。INI 文件具有特定的结构，并且通常按从到下的顺序处理。INI 文件由一个或多个节组成。节名称包含在一对括号中。节可以在\
  \ INI 文件中任意顺序排列。\n\n节包含零或多个 `key=value` 键，这些对也可以在节内任意顺序排列。如果在一个节内多次指定 `key=value`\
  \ 对，则后一个实例通常覆盖之前的实例。\n\nINI 文件还可以包含注释。注释使用分号（`;`）字符标记。你还可以向 INI 文件添加空行以提高其演示效果。然而，空行没有实际作用，在处理\
  \ INI 文件时会被忽略。\n\n以下陈述演示了一个小型 INI 文件的格式和结构。\n\n```\n;示例 INI 文件\n\n[Section1]\nkey1=value1\n\
  key2=value2\n```\n\n如你所见，这个 INI 文件示例以注释开始。它有一个名为 `[Section1]` 的节。节内存储了两个 key=value\
  \ 对。可以根据需要添加更多的节。通常，INI 文件的命名与其存储设置的应用程序可执行文件名相同。例如，对于名为 `WordDoc.exe` 的应用程序，其 ini\
  \ 文件可能是 `WordDoc.ini`。\n\n\n\n\n\n|  | 提示 | 建议将您的 INI 文件命名为与 VBScript 文件名相同。这将有助于识别和管理它们。如果您创建一个包含多个独立脚本的\
  \ VBScript 应用程序，且所有脚本都共享同一个 INI 文件，您可能希望根据访问该文件的主或第一个 VBScript 来命名 INI 文件。最重要的一点是在命名方案中保持一致性和可预测性。\
  \ |\n\n应用程序拥有一个 INI 文件是典型的，尽管应用程序确实可以有多个。有时一组相关的应用程序可能会共享同一个 INI 文件。在这种情况下，每个应用程序在\
  \ INI 文件中都有自己的节。在处理 INI 文件时，这些应用程序会搜索它们特定的节并解析其中的 `key=value` 对，以提取它们所需的配置设置。\n\n\
  ## 设计报告和日志分析器的 INI 文件\n\n在为报告和日志分析脚本创建 INI 文件的第一步，Molly 使用 Windows 记事本程序创建了一个名为\
  \ `RptLog.ini` 的空文件。然后，她为每个使用该 INI 文件的脚本添加了注释和节标题，如下所示。\n\n```\n ;报告和日志分析器 INI 文件\n\
  \n[ErrorRpt]\n\n[DailySales]\n\n[DailyReturns]\n\n[DailyProduction]\n```\n\n接下来，她开始处理\
  \ Error Report（错误报告）节。Molly 确定她想要外部化以下配置设置：\n\n*   `SourDir`：`Error.log` 报告的路径和文件名。\n\
  *   `ReportOn`：要报告的错误消息最小级别。\n*   `EventLog`：布尔值，指示脚本是否应在本地 Windows 应用程序日志中写入消息。\n\
  *   `DestFile`：摘要报告的路径和文件名。\n*   `Debug`：布尔值，指示脚本在处理时是否应以弹出对话框的形式显示中间结果。\n\n首先，Molly\
  \ 修改了 `[ErrorRpt]` 节，如下所示。\n\n```\n [ErrorRpt]\nSourDir=d:\\Order_Inventory\\Logs\\\
  Error.log\nReportOn=3\nEventLog=True\nDestFile=d:\\Order_Inventory\\Logs\\Summary.txt\n\
  Debug=False\n```\n\n当处理每日错误日志分析脚本的 VBScript 运行时，它将在 `d:\\Order_Inventory\\Logs\\\
  Error.log` 中查找报告文件。它将仅报告严重程度分配为 `3` 或更高的错误。脚本在运行时会将消息写入 Windows 应用程序事件日志。它将将其输出写入\
  \ `d:\\ApplicationName\\Summary.txt`。最后，它将不会显示任何调试信息。\n\n接下来，她修改了 `[DailySales]`\
  \ 节，如下所示。\n\n```\n [DailySales]\nSourDir=d:\\Order_Inventory\\Logs\\DailySales.txt\n\
  ReportOn=SummaryOnly\nEventLog=True\nDestFile=d:\\Order_Inventory\\Logs\\Summary.txt\n\
  Debug=False\n```\n\n该脚本设置中的唯一区别是修改了 `SourDir` 键和 `ReportOn` 键，后者被分配了 `SummaryOnly`\
  \ 的值。此值将用于限制每日销售报告日志分析脚本收集的数据，使其仅包含报告底部的摘要信息。\n\n|  | 备注 | 每个应用程序通常在 INI 文件中都有自己的节。在处理\
  \ INI 文件时，这些应用程序会搜索它们特定的节并解析其中的 `key=value` 对，以提取它们所需的配置设置。 |\n\n该脚本设置中的唯一区别是修改了\
  \ `SourDir` 键和 `ReportOn` 键，后者被分配了 `SummaryOnly` 的值。此值将用于限制每日销售报告日志分析脚本收集的数据，使其仅包含报告底部的摘要信息。\n\
  \n|  | 备注 | 每个应用程序通常在 INI 文件中都有自己的节。在处理 INI 文件时，这些应用程序会搜索它们特定的节并解析其中的 `key=value`\
