  \  strReportFile.WriteLine(\"</html>\")\nEnd Sub\n```\n\n### ParseProductionData()\
  \ 子程序\n\n下所示的 `ParseProductionData()` 子程序通过定义局部变量开始工作。接下来，它实例化 `RegExp` 对象。然后它通过给\
  \ `RegExp` 对象的 `Pattern` 属性赋值为 `\"+\"`，大致表示查找一个或多个空格。接下来，将 `RegExp` 对象的 `Global`\
  \ 属性设置为 `True`，使模式搜索应用于字符串内的所有出现处。\n\n使用 `Replace()` 方法将字符串中的任何一个或多个空格替换为空格。一旦删除了所有多余空格，使用\
  \ `Split()` 函数将字符串的内容加载到名为 `astrErrors` 的数组中。\n\n使用 `For Each` 循环遍历数组。在第一次迭代中，跳过所有处理，因为\
  \ `astrErrors` 的值不大于 1，且 `astrErrors(0)` 代表生产部分的的第一列数据。同样，循环的第二次迭代也不会产生任何结果。从第三次到倒数第二次迭代，循环创建一个字符串并将其赋值给变量\
  \ `string2`。该字符串代表该部分每行的描述信息。随后将 `string2` 的值赋值给 `astrErrors(2)`，并将数组最后一个元素的值（`astrErrors(UBound(astrErrors))`）赋值给\
  \ `astrErrors(3)`。\n\n当此子程序终止时，`astrErrors` 数组已完全加载并准备好作为条目写入 HTML 页面。\n\n```\n\
  \ Sub ParseProductionData(strQuote)\n  Dim regExpObj, strStrippedString, intCounter,\
  \ strString2, intArrayCounter\n  Set regExpObj = New RegExp\n  regExpObj.Pattern\
  \ = \" +\"\n  regExpObj.Global = True\n\n  strStrippedString = RegExpObj.Replace(strQuote,\
  \ \" \")\n\n  astrErrors = Split(strStrippedString, \" \")\n\n  intCounter = 0\n\
  \n  For Each intArrayCounter In astrErrors\n    If intCounter > 1 Then\n      If\
  \ intCounter <> UBound(astrErrors) Then\n        strString2 = strString2 & \" \"\
  \ & intArrayCounter\n      End If\n    End If\n    intCounter = intCounter + 1\n\
  \  Next\n\n  astrErrors(2) = strString2\n\n  astrErrors(3) = astrErrors(UBound(astrErrors))\n\
  \nEnd Sub\n```\n\n\n\n\n\n下文所示的 `WriteToEventLog()` 子程序将参数传递给它的信息性消息通过 `WshShell`\
  \ 对象的 `LogEvent()` 方法写入 Windows 应用程序事件日志。\n\n```\n Sub WriteToEventLog(strMessage)\n\
  \n  WshShl.LogEvent 4, strMessage\n\nEnd Sub\n```\n\n## TerminateScript() 子程序\n\n\
  下文所示的 `TerminateScript()` 子程序是你在最近脚本中看到的子程序的修改版本。该子程序使用 `WScript` 对象的 `Quit()` 方法来终止脚本的执行，并向调用它的脚本返回一个数值，用以指示\
  \ HTML 转换脚本是否运行成功。\n\n```\n Sub TerminateScript(intRC)\n\n  If strDebug = \"Enabled\"\
  \ Then\n    MsgBox \"Script execution terminated.\", , cTitleBarMsg\n  End If\n\n\
  \  WScript.Quit(intRC)\n\nEnd Sub\n```\n\n## 完整的脚本\n\n下文显示了组完整的 HTML 转换脚本。当它执行时，会自动确定当前当天汇总报告的名称，然后使用该文件作为输入来创建基于\
  \ Web 的版本的报告。\n\n\n\n\n\n```vbs\n '*************************************************************************\n\
  '脚本名称: Script 30.1.vbs\n'作者: Jerry Ford\n'创建日期: 05/03/03\n'描述: 此脚本将每日合并摘要报告的文本版本转换为\
  \ HTML 文件\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nDim intReturnCode, strOutputFile, strReportFile,\
  \ strSourceLine\nDim strSourceFile, strConsolTxtRpt, i, strFileNameString\nDim strEventLog,\
  \ strDebug\nDim WshShl, FsoObj\nDim astrErrors\n\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\nSet FsoObj = CreateObject(\"Scripting.FileSystemObject\")\n\n\
  Const cForReading = 1\nConst cForWriting = 2\nConst cForAppending = 8\nConst cTitleBarMsg\
  \ = \"HTML 报告转换脚本\"\n\nintReturnCode = 0\n\n'主处理部分\n\nGetRegistrySettings()\n\n\
  AssembleFileNames()()\n\nSet strSourceFile = FsoObj.OpenTextFile(strConsolTxtRpt,\
  \ cForReading)\nSet strReportFile = FsoObj.OpenTextFile(strOutputFile, cForWriting\
  \ , \"True\")\n\nIf strEventLog = \"Enabled\" Then\n  WriteToEventLog(\"HTML 报告转换脚本正在执行.\"\
  )\nEnd If\n\nIf strDebug = \"Enabled\" Then\n  MsgBox \"开始生成报告。\", , cTitleBarMsg\n\
  End If\n\nFor i = 0 to 8\n   strSourceFile.SkipLine\nNext\n\nWriteHeader()\n\nBeginTableDefinition()\n\
  \nWriteTableHeader(\"Errors:\")\n\nWriteErrorsColHeadings()\n\nDo Until strSourceFile.AtEndOfStream\n\
  \  strSourceLine = strSourceFile.ReadLine()\n  If Len(strSourceLine) = 0 Then\n\
  \    Exit Do\n  Else\n    astrErrors = Split(strSourceLine, \" \", 5)\n    WriteErrorsData()\n\
  \  End If\nLoop\n\nEndTableDefinition()\n\nBeginTableDefinition()\n\nWriteTableHeader(\"\
  Sales Summary:\")\nWriteTableSubHeader(\"Government:\")\nWriteSalesAndReturnsColHeadings()\n\
