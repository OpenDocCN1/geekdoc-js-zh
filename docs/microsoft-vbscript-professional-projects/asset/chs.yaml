  \ Set` | 定义属性过程的名字和参数 |\n| `Randomize` | 初始化随机数生成器 |\n| `ReDim` | 定义或重新定义动态数组变量\
  \ |\n| `Rem` | 用于在脚本中放置注释 |\n| `Set` | 将对象引用赋值给变量 |\n| `Sub` | 定义 `Sub` 名称及其参数 |\n\
  | `While...Wend` | 只要指定的条件保持 `True`，就执行一个或多个语句 |\n\n## VBScript 语句语法\n\n\n除了特定 VBScript\
  \ 语句的特定语法要求外，在编写 VBScript 时，你还必须遵循许多通用规则。这些规则列在下方。\n\n*   你可以通过在每个语句末尾添加冒号（`:`）字符，在单行内放置两个或多个语句。\n\
  *   你可以通过在每行末尾添加下划线（`_`）字符（称为续行符），将单个语句跨越多行。\n*   默认情况下，VBScript 不区分大小写，这意味着在常量、变量、子程序名和函数名的拼写中允许使用不同的大小写。\n\
  \n### 语法错误\n\n\n运行时错误可能难以追踪和发现，因为它们可能隐藏在脚本中较少使用的代码部分。另一方面，脚本中任何位置的语法错误都会阻止其执行。因此，语法错误应该在初始脚本开发和测试期间易于发现并修复。例如，以下语句在由\
