  \ 子程序\n\n下所示的 `CreateConsolidatedWordReport()` 子程序会创建一个汇总摘要报告的 Word 版本。为了简化该报告的创建，Molly\
  \ 决定不再从头重新创建报告，而是设置一个 `Do...Until` 循环，并用它将报告文本版本的内容复制到数组中。然后，该子程序将使用 `For Each...Next`\
  \ 循环以及 Word 对象模型的方法和属性对该数组进行处理。为了让汇总摘要报告的 Word 版本更易读，Molly 在子程序每次写入报告表头时，修改了 `Font`\
  \ 对象的 `Name`、`Size` 和 `Bold` 属性。她通过设置一系列 `If` 语句实现了这一点，这些语句使用 `Instr()` 函数，在 `For\
  \ Each...Next` 循环遍历汇总摘要报告文本版本的每一行时识别出表头。\n\n```\n Sub CreatConsolidatedWordReport()\n\
  \n  Dim objWordDoc, strSourFile, FileRef, strRptLine, intWordCounter\n  Dim strFileNameString\n\
  \n  ReDim astrWordVersionArray(0)\n\n  Set objWordDoc = WScript.CreateObject(\"\
  Word.Application\")\n\n  Set FileRef = FsoObj.OpenTextFile(strConSolRptName, cForReading)\n\
  \n  strFileNameString = Replace(Date(), \"/\", \"-\")\n\n  strConSolRptName = strConsolFolder\
  \ & \"\\\" & strFileNameString & _\n  \"_ConsolSumRpt.doc\"\n\n  intWordCounter\
  \ = 0\n\n  If strDebug = \"Enabled\" Then\n    MsgBox \"Writing the Word version\
  \ of the consolidated summary report.\"\n  End If\n\n  'Read the entire report into\
  \ an array\n  Do Until FileRef.AtEndOfStream\n\n    strRptLine = FileRef.ReadLine()\n\
  \n    ReDim Preserve astrWordVersionArray(intWordCounter)\n    astrWordVersionArray(intWordCounter)\
  \ = strRptLine\n\n    intWordCounter = intWordCounter + 1\n\n  Loop\n\n  FileRef.Close()\n\
  \n  'Start creating the Word document\n  objWordDoc.Documents.Add()\n\n  objWordDoc.Selection.Font.Name\
  \ = \"Courier\"\n  objWordDoc.Selection.Font.Size = 8\n  objWordDoc.Selection.Font.Bold\
  \ = False\n\n  'Spin through the array, format and write the Word version of the\
  \ report\n  For Each intWordCounter in astrWordVersionArray\n\n    'Change Font\
  \ properties for selected report headings\n    If Instr(1,intWordCounter, \"Master\
  \ Consolidated Summary\") Then\n\n      objWordDoc.Selection.Font.Name = \"Arial\"\
  \n      objWordDoc.Selection.Font.Size = 12\n      objWordDoc.Selection.Font.Bold\
  \ = True\n    End If\n\n    If Instr(1,intWordCounter, \"Errors:\") Then\n     \
  \ objWordDoc.Selection.Font.Name = \"Arial\"\n      objWordDoc.Selection.Font.Size\
  \ = 10\n      objWordDoc.Selection.Font.Bold = True\n    End If\n\n    If Instr(1,intWordCounter,\
  \ \"Sales summary:\") Then\n      objWordDoc.Selection.Font.Name = \"Arial\"\n \
  \     objWordDoc.Selection.Font.Size = 10\n      objWordDoc.Selection.Font.Bold\
  \ = True\n    End If\n\n    If Instr(1,intWordCounter, \"Returns summary:\") Then\n\
  \      objWordDoc.Selection.Font.Name = \"Arial\"\n      objWordDoc.Selection.Font.Size\
  \ = 10\n      objWordDoc.Selection.Font.Bold = True\n    End If\n\n    If Instr(1,intWordCounter,\
  \ \"Daily Production Summary\") Then\n      objWordDoc.Selection.Font.Name = \"\
  Arial\"\n      objWordDoc.Selection.Font.Size = 10\n      objWordDoc.Selection.Font.Bold\
  \ = True\n    End If\n\n    'Write a line of the report\n    objWordDoc.Selection.Typetext(intWordCounter)\n\
  \n    'Add a paragraph marker (.e.g. linefeed)\n    objWordDoc.Selection.TypeParagraph\n\
  \n    'Reset default Font properties\n    objWordDoc.Selection.Font.Name = \"Courier\"\
  \n    objWordDoc.Selection.Font.Size = 8\n    objWordDoc.Selection.Font.Bold = False\n\
  \n  Next\n\n  'Save the Word file\n  objWordDoc.ActiveDocument.SaveAs(strConSolRptName)\n\
  \n  'Close the document\n  objWordDoc.ActiveDocument.Close()\n\n  'Exit Word\n \
  \ objWordDoc.Quit()\n\nEnd Sub\n```\n\n# NotifyOperationsStaff() 子程序\n\n下所示的 `NotifyOperationsStaff()`\
  \ 子程序使用 VBScript 的 `Split()` 函数创建一个数组，该数组包含选定的运营人员姓名，将向他们发送网络消息，告知汇总摘要报告现可用。随后设置一个\
  \ `For Each...Next` 循环遍历数组，并使用 `Net Send` 命令向每个用户名发送消息。\n\n```\n Sub NotifyOperationsStaff()\n\
  \n  On Error Resume Next\n\n  Dim strUserName, strNtkNotifyList\n\n  Dim astrNotifyArray\n\
  \n  strNtkNotifyList = \"MJLF001 ASCK001\"\n\n  strNtkNotifyList = _\n    WshShl.RegRead(\"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\NtkNotifyList\")\n  If Err <> 0 Then\n\
  \    If strEventLog = \"Enabled\" Then\n      WriteToEventLog (\"Summary Report\
  \ Collection script - Using default \" & _\n        \"for strNtkNotifyList.\")\n\
  \      Err.Number = 0\n    End If\n\n  End If\n\n  astrNotifyArray = Split(strNtkNotifyList)\n\
  \n  For Each strUserName In astrNotifyArray\n    WshShl.Run \"Net Send \" & strUserName\
  \ & \" \" & \"Order\\Inventory \" & _\n      \"consolidated report now available.\"\
  \n  Next\n\nEnd Sub\n```\n\n### WriteToEventLog() 子程序\n\n与之前的脚本一样，`WriteToEventLog()`\
  \ 子程序使用传递它的字符串将信息写入 Windows 应用程序日志。\n\n```\n Sub WriteToEventLog(strMessage)\n\n\
  \  WshShl.LogEvent 4, strMessage\n\nEnd Sub\n```\n\n## TerminateScript() 子程序\n\n\
