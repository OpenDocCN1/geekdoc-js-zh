  \ 27.5，是由在 Windows 2000 工作站上运行的 VBScript 创建的。它使用 HTML 表格显示今日的报告。Alexander 将此 HTML\
  \ 页面保存为 `CurrentRpt.HTML`，用今日的摘要报告覆盖前一日的摘要报告。\n\n```\n今日摘要报告页面所示图 27.5，是由在 Windows\
  \ 2000 工作站上运行的 VBScript 创建的。它使用 HTML 表格显示今日的报告。Alexander 将此 HTML 页面保存为 `CurrentRpt.HTML`，用今日的摘要报告覆盖前一日的摘要报告。\n\
  ```\n\n\n\n\n\n*   **按钮**。用于触发表单上的操作，例如表单验证或执行 VBScript。\n\n![点击展开](img/fig27-7_0.jpg)\n\
  \n图 27.7：注册与配置设置页面收集每位访问者的姓名和个人偏好\n\n表单的文本字段将用于收集访问者的姓名。单选按钮的集合将允许每位访问者为网站指定默认页面。下拉列表将允许访问者从多个预定义的颜色方案中选择其中一种，这些方案将控制\
  \ `Links` 页面的背景颜色。最后，按钮将用于启动下文所概述的若干脚本任务。\n\n*   **创建 Cookie**。从客户端缓存中检索有关访问者及其偏好的信息。\n\
  \n*   **表单验证**。确定访问者正在使用的浏览器类型以及其版本号。\n\n*   **基于弹出框的确认**。根据浏览器类型或用户偏好自动加载不同的 HTML\
  \ 页面。\n\n*   **基于弹出框的帮助**。提供基于文本的帮助，解释页面上每个表单元素所需的信息。\n\n## 总结\n\n在本章中，你观察了 William\
  \ 如何概述构成订单/库存报告网站的每个 HTML 页面的内容和格式。这包括定义了 HTML 页面之间的关系和链接，并确定了 VBScript 在这些 HTML\
  \ 页面中的标识和位置。本章还解释了这些 VBScript 将如何增强网站的整体演示效果。\n\n# 第 28 章：构建网站主页\n\n在本章中，William\
  \ 开始创建订单/库存报告网站，首先从创建网站的主页（或默认页）开始。该页面将使用一个由两个框架组成的 HTML `frameset`，以便在浏览器窗口左侧显示链接菜单，并在右侧框架中显示所选链接的内容。William\
  \ 还将在 HTML 页面中嵌入了一个 VBScript，以为网站添加一系列图形效果。该脚本将执行诸许多任务，如将菜单链接转换为悬停链接、从客户端缓存中检索配置设置，以及管理加载到右侧框架的内容。\n\
  \n## 使用框架\n\n订单/库存报告网站的主页称为 `Default.html`。构成该页面的 HTML 语句所示如下。页面被分为两个框架。第一个框架称为\
  \ `left_frame`，它将自动加载名为 `Links.html` 的 HTML 页面。第二个框架称为 `right_frame`，它将自动加载名为 `Welcome.html`\
  \ 的 HTML 页面。\n\n```\n <HTML>\n\n  <HEAD>\n    <TITLE>Script 28.1 - Define a Frameset\
  \ for the main web site page</TITLE>\n  </HEAD>\n\n  <FRAMESET COLS=\"175,*\">\n\
  \    <FRAME SRC=\"Links.html\" NAME=\"left_frame\" SCROLLING=\"no\" FRAMEBORDER=\"\
  1\"\n      NORESIZE>\n    <FRAME SRC=\"Welcome.html\" NAME=\"right_frame\" SCROLLING=\"\
  auto\"\n      FRAMEBORDER=\"1\" NORESIZE>\n  </FRAMESET>\n\n</HTML>\n```\n\n框架是通过\
  \ HTML 的 `<FRAMESET>` 和 `<FRAME>` 标签创建的`<FRAMESET>` 标签替换了通常用于定义 HTML 页面的 `<BODY>`\
  \ 标签。第一个框架设置为宽度 175 像素，剩余空间留给右侧框架。\n\n## 构建 Links.html 页面\n\n`Links.html` 页面会自动加载到\
  \ `Default.html` 页面的 `left_frame` 框架中，提供了指向订单/库存报告网站上其他页面的链接列表。它由 HTML 语句和若干 VBScript\
  \ 子程序组成。这些子程序为 `Links.html` 页面提供了以下功能：\n\n*   设置页面背景颜色\n*   创建链接悬停效果\n*   在 Internet\
  \ Explorer 状态栏上发布消息\n*   将链接的 HTML 页面加载到 `right_frame` 框架中\n\n### Links.html 页面的\
  \ HTML\n\n创建 `Links.html` 页面所需的 HTML 所示如下。如你所见，它由一小部分 HTML 标签组成。需要关注的关键标签是 HTML\
  \ 页面底部定义的三个链接标签。它们定义了三个名为 `DailyRpt`、`Archive` 和 `Config` 的链接，并显示代表每个链接的文本消息。另请注意，起始\
  \ `<FONT>` 标签将代表每个链接的文本颜色设置为蓝色。\n\n```\n <HTML>\n  <HEAD>\n    <TITLE>Script 28.2\
  \ - This page provides links to subordinate HTML pages</TITLE>\n  </HEAD>\n\n  <BODY>\n\
  \    <BR>\n    <H3>Resource Links:</H3><P><BR>\n<DIV STYLE=\"color:blue;\">\n  \
  \    <A NAME=\"DailyRpt\"> Consolidated Summary Report for Today</A><P><BR>\n  \
  \    <A NAME=\"Archive\"> Consolidated Summary Report Archive</A><P><BR>\n     \
  \ <A NAME=\"Config\"> Personal Configuration Settings and Registration</A><P>\n\
  \    </DIV>\n  </BODY>\n</HTML>\n```\n\n### 向 HTML 页面添加 VBScript\n\n一旦定义了 HTML 页面，你就可以通过嵌入\
  \ VBScript 来增强它。要嵌入 VBScript，你需要在 HTML 页面的页部或主体部分添加以下语句。这些语句标识了 VBScript 的开始和结束。\n\
  \n```\n <SCRIPT LANGUAGE=\"VBScript\">\n    <!-- Start VBScript -->\n    .\n   \
  \ <!-- End VBScript -->\n</SCRIPT>\n```\n\n正如你会看到的，添加到此页面的 VBScript 由一组子程序组成。这些子程序为\
  \ HTML 页面提供了不同的功能。\n\n### 设置默认颜色\n\n嵌入 `Links.html` 页面的第一个子程序是 `SetBackgroundColor()`。它在\
  \ `Links.html` 页面加载时执行。这是通过修改 `<BODY>` 标签实现的，所示如下：\n\n```\n <BODY onLoad=\"SetBackgroundColor()\"\
  >\n```\n\n该语句使用浏览器的 `onLoad` 事件触发子程序的执行，所示如下：\n\n```\n Sub SetBackgroundColor()\n\
  \  If document.cookie <> \"\" Then\n    astrCookieArray = Split(document.cookie,\"\
  )\n    strColorScheme = astrCookieArray(2)\n    document.bgcolor = strColorScheme\n\
  \  Else\n    document.bgcolor = \"yellow\"\n  End If\nEnd Sub\n```\n\n子程序首先检查 `document`\
  \ 对象的 `cookie` 属性，以查看访问者的计算机上是否存在该网站的 Cookie。如果 `document.cookie` 的值为空，则使用 VBScript\
  \ `Split()` 函数将其内容解析为名为 `astrCookieArray` 的数组。\n\n订单/库存报告网站创建的 Cookie 包含三个部分：存储访问者的姓名、默认页面和偏好颜色方案。这些部分都被加载到\
  \ `astrCookieArray` 数组中。存储在 `astrCookieArray(2)` 中的值代表访问者的偏好颜色方案。将存储在 `astrCookieArray(2)`\
  \ 中的值赋值给 `document` 对象的 `bgcolor` 属性，从而更改 `Links.html` 页面的背景颜色。然而，如果在访问者的计算机上未找到订单/库存报告网站的\
  \ Cookie，则使用默认的黄色背景。\n\n### 创建链接悬停效果\n\n\n\n\n接下来，William 通过向页面的 VBScript 添加六个新的子程序来修改\
  \ HTML 页面。这些子程序所示。如你所见，它们是成对的。第一对子程序为 `DailyRpt` 链接创建悬停效果（rollover effect）。其余子程序则管理\
  \ `Links.html` 页面另外两个链接的悬停效果。\n\n```vb\n Sub DailyRpt_onMouseOver\n  DailyRpt.style.color=\"\
  red\"\nEnd Sub\nSub DailyRpt_onMouseOut\n  DailyRpt.style.color=\"blue\"\nEnd Sub\n\
  \nSub Archive_onMouseOver\n  Archive.style.color=\"red\"\nEnd Sub\nSub Archive_onMouseOut\n\
  \  Archive.style.color=\"blue\"\nEnd Sub\n\nSub Config_onMouseOver\n  Config.style.color=\"\
  red\"\nEnd Sub\nSub Config_onMouseOut\n  Config.style.color=\"blue\"\nEnd Sub\n\
  ```\n\n每对中的第一个子程序是通过将与子程序关联的链接名称附加到触发执行子程序的浏览器事件来命名的。在这种情况下，每对中的第一个子程序是 `onMouseOver`\
  \ 事件。每当访问者将指针移动到与子程序关联的链接上时，该子程序会将代表链接的文本颜色变为红色。\n\n每对中的第二个子程序在访问者将指针移离开关联的链接时，将链接颜色改回初始的蓝色。这六个子程序添加的动画结果是：`Links.html`\
  \ 页面上的链接动态改变颜色，以帮助访问者识别当前中的链接。\n\n### 在 Internet Explorer 状态栏上发布消息\n\n一旦 William\
  \ 正确运行了链接的悬停效果，他就通过修改控制这些效果的子程序，添加了逻辑：每当访问者将指针移动到 `Links.html` 页面任一链接上时，都在 Internet\
  \ Explorer 状态栏上发布并清除消息。这个技巧通过修改 `window` 对象的 `status` 属性来实现。例如，以下这对子程序显示了 William\
  \ 如何修改响应 `DailyRpt` 链接的 `onMouseOver` 和 `onMouseOut` 事件的子程序。\n\n```vb\n Sub DailyRpt_onMouseOver\n\
  \  DailyRpt.style.color=\"red\"\n  window.status = \"View today's consolidated summary\
  \ report\"\nEnd Sub\nSub DailyRpt_onMouseOut\n  DailyRpt.style.color=\"blue\"\n\
  \  window.status = \"\"\nEnd Sub\n```\n\n如你所见，当 `DailyRpt` 链接触发 `onMouseOver` 事件时，会显示描述性文本。同样，当链接的\
  \ `onMouseOut` 事件触发时，`window.status` 的值被为空。\n\n### 使用 VBScript 控制框架内容\n\nWilliam\
  \ 创建 `Links.html` 页面的最后一个任务是创建一个包含三个子程序的集合，当访问者点击 `Links.html` 页面的某个链接时，控制在 `Default.html`\
  \ 页面的 `right_frame` 框架中加载其他 HTML 页面。\n\n这些子程序第一个称为 `DailyRpt_onClick()`。当访问者将指针移动到\
  \ `DailyRpt` 链接上并点击时，它执行。该子程序使用名为 `strFileNameString` 的变量来存储当天汇总摘要报告的版本名称。在编写该子程序之前，William\
  \ 在 VBScript 的开头添加了以下语句来定义此变量：\n\n```vb\n Dim strFileNameString\n```\n\n接下来，他创建了如下所示的\
  \ `DailyRpt_onClick()` 子程序。该子程序的逻辑借自之前 WSH 执行的 VBScript，现在看起来应该很熟悉。首先，William 使用\
  \ `Date()` 函数收集当前系统日期，然后使用 `Replace()` 函数将所有的反斜杠（`/`）字符替换为破折号（`-`）。然后将字符串 `ConsolRpt.html`\
  \ 追加到 `strFileNameString` 的末尾。最后，该子程序通过将 `strFileNameString` 变量的值赋值给 `top.right_frame.location`，将当摘要报告\
  \ HTML 版本加载到 `right_frame` 框架中。在该 HTML 页面的上下文中，`top` 用于引用在 `Default.HTML` 中定义的父框架集，而\
  \ `right_frame` 标识要加载摘要报告 HTML 版本的框架，这由框架对象的 `location` 属性指定。\n\n```vb\n Sub DailyRpt_onClick\n\
  \  strFileNameString = Replace(Date(), \"/\", \"-\")\n  strFileNameString = strFileNameString\
  \ & \"_ConsolRpt.html\"\n  top.right_frame.location = \"..\\Rpts\\\" & strFileNameString\n\
  End Sub\n```\n\n| | Note |\n| :--- | :--- | 注意使用 `..\\Rpts` 来指定 `Rpts` 文件夹的位置。在翻译时，`..\\\
  ` 告诉脚本 `Rpts` 文件夹的位置可以通过退回到当前文件夹的父文件夹（从 `D:\\Intuit\\OrderInventory\\Reporting\\\
  HTML` 回到 `D:\\Intuit\\OrderInventory\\Reporting`）然后查找 `Rpts` 文件夹（`D:\\Intuit\\OrderInventory\\\
  Reporting\\Rpts`）。 |\n\n接下来的两个子程序比上一个子程序简单得多。所示的 `Archive_onClick()` 子程序使用 `location`\
  \ 属性加载 `archive.html` 页面，该页面包含指向公司 Web 服务器上 HTML 报告存档的链接列表。\n\n```vb\n Sub Archive_onClick\n\
  \  top.right_frame.location=\"..\\Rpts\\Archive.html\"\nEnd Sub\n```\n\n同样，所示的 `Config_onClick()`\
  \ 子程序加载 `Config.html` 页面，允许访问者指定个人的配置偏好。\n\n```vb\n Sub Config_onClick\n  top.right_frame.location=\"\
  Config.html\"\nEnd Sub\n```\n\n### 完整组装的 Links.html 页面\n\n完整组装的 `Links.html` 页面所示。当它加载到\
  \ `Default.html` 页面的 `left_frame` 框架时，它提供了一个链接菜单，允许访问者在订单/库存报告网站中进行导航。\n\n\n\n\n\
  \n## 构建 Welcome.html 页面\n\n`Welcome.html` 默认在 `Default.html` 页面的 `right_frame` 帧中显示。然而，每个访问者如果需要，可以选择配置不同的默认页面。此页面提供了有关订单/库存报告（Order/Inventory\
  \ Reporting）网站的基本信息。此外，它还包含一个嵌入的 VBScript，用于提供了大量的后台功能，包括：\n\n*   检测访问网站时使用的浏览器类型和版本\n\
  *   对使用 Internet Explorer 5.0 或更高版本浏览器的访问者进行重定向\n*   从客户端缓存（Cookie）中检索配置设置\n*  \
  \ 将首次访问者重定向到注册和配置设置页面\n\n### Welcome.html 页面的 HTML 代码\n\n下面是 `Welcome.html` 页面的\
  \ HTML 代码。它使用标准的 HTML 标签来组织和显示有关网站的信息内容。\n\n```\n <HTML>\n\n  <HEAD>\n    <TITLE>脚本\
  \ 28.1 - 订单/库存主欢迎页</TITLE>\n  </HEAD>\n\n  <BODY>\n    <HR>\n    <UL>\n      <LI>汇总摘要报告每天上午\
  \ 06:00 可供在线\n          查看。</LI><P>\n      <LI>您也可以查看为期 3 个月的归档汇总摘要报告集。</LI><P>\n\
  \      <LI>还可以下载汇总摘要报告的 Microsoft Word 副本。</LI><P>\n      <LI>如果您需要查看本网站未提供的汇总摘要报告，请联系计算机运行部门\n\
  \          （Computer Operations），要求他们为您提供纸质版。</LI><P>\n    </UL>\n      <HR>\n\n\
  \      <B><PRE>\n          命令中心帮助台：       分机 3737\n          订单/库存热线：       分机:\
  \ 4000\n          其他问题或疑虑：   分机: 3230\n      </PRE></B>\n  </BODY>\n</HTML>\n```\n\
  \n图 28.2 显示了 `Welcome.html`页面直接加载到 Internet Explorer 时的外观。\n\n![点击展开](img/fig28-2_0.jpg)\n\
  \n图 28.2：`Welcome.html` 页面通过姓名问候访问者，并提供有关订单/库存报告网站可用内容的信息\n\n### 针对不支持浏览器的重定向\n\n\
  年前，Intuit 将 Internet Explorer 定为公司的标准浏览器。Intuit 的 IT 员工已尽力确保公司的所有用户都已将浏览器升级到 Internet\
  \ Explorer 6.0。然而，偶尔似乎有人在使用旧版本的 Explorer。\n\nWilliam 开发订单/库存报告网站时，假设是所有用户都将使用 Internet\
  \ Explorer 5.0 或更高版本。然而，为了防止 Intuit 可能还有其他员工在使用旧版本的 Explorer 的可能性，William 在 `Welcome.html`\
  \ 页面中添加了一个名为 `BrowserCheck()` 的子过程。该子过程会将浏览器重定向到名为 `Browser.html` 的页面。\n\n设置 `BrowserCheck()`\
  \ 子过程的第一步是在页面的 BODY 部分中定义以下 VBScript。该脚本会在 `Welcome.html` 页面加载时自动执行 `BrowserCheck()`。\n\
  \n```\n <SCRIPT LANGUAGE=\"VBScript\">\n<!-- 开始隐藏 VBScript 语句\n  BrowserCheck()\n\
  <!-- 结束 VBScript 语句 -->\n</SCRIPT>\n```\n\n下一步是在页面的头部 部分定义第二个 VBScript，并添加以下子过程：\n\
  \n| | 注意 |\n| :--- | :--- |\n| 嵌入 `Welcome.html` 的 VBScript 可以嵌入在 body 部分。然而，通过在头部部分定义它，您可以确保在\
  \ body 部分的语句引用之前，所有过程已加载并可用。 |\n\n```\n Sub BrowserCheck()\n\n  browserName = navigator.appName\n\
  \n  If browserName = \"Microsoft Internet Explorer\" Then\n\n    '使用 navigator appVersion\
  \ 属性收集有关\n    '访问者的 Internet 器的信息\n\n    browserVersion = navigator.appVersion\n\
  \n    'Instr() 函数在字符串中搜索指定的字符集\n    findString = Instr(1, browserVersion, \"MSIE\"\
  )\n    findString = findString + 5\n    versionNumber = Mid(browserVersion, findString,\
  \ 1)\n\n    If versionNumber < 5\n      window.location = \"Browser.html\"\n   \
  \   End If\n  Else\n    window.location = \"Browser.html\"\n  End If\n\nEnd Sub\n\
  ```\n\n\n\n\n\n接下来使用 VBScript 的 `Instr()` 函数来确定字符串 `MSIE` 在 `browserVersion` 中的位置。一旦确定了该字符串的起始字符位置，就会在该基础上加\
  \ 5，以计算浏览器版本号在字符串中的位置。接着，使用 `MID()` 函数来解析出正在使用的主版本号。然后，使用 `If` 语句来判断主版本号是否小于 5（即\
  \ Internet Explorer 5.x 版本）。如果小于 5，则 `Default.html` 页的 `right_frame` 将被重定向以添加 `Browser.html`。否则，不采取任何重定向操作。\n\
  \n图 28.3 显示了当使用 Internet Explorer 5.0 或更高版本的浏览器进行访问时，订单/库存报告（Order/Inventory Reporting）网站将呈现的样子。\n\
  \n![点击展开](img/fig28-3_0.jpg)\n\n图 28.3：默认情况下，所有订单/库存报告网站的访问者都将看到 `Links.html` 和\
  \ `Welcome.html` 页面\n\n### 获取 VBScript Cookie\n\n创建 `Welcome.html` 页的最后一项任务是添加逻辑，从存储在访问者计算机上的\
  \ Cookie 中提取访问者的偏好。该 Cookie 是在访问者访问网站的“注册和配置设置”页面时构建并存储在他们的计算机上的。如果在访问者的计算机上发现了订单/库存报告网站的\
  \ Cookie，则检索并解析其内容。否则，`Default.html` 页上的 `right_frame` 框架将重定向到“注册和配置设置”页面，以便访问者可以选择配置设置。\n\
  \n此过程将作为一个名为 `Cookie_Check()` 的子程序来实现。设置此过程的第一步是修改位于页面体部分的 VBScript，通过插入对 `Cookie_Check()`\
  \ 子程序的调用，如下所示。\n\n```\n <SCRIPT LANGUAGE=\"VBScript\">\n<!-- Start hiding VBScript\
  \ statements\n  BrowserCheck()\n  Cookie_Check()\n' End hiding VBScript statements\
  \ -->\n</SCRIPT>\n```\n\n一旦完成此操作，你就可以将 `Cookie_Check()` 子程序的代码添加到 `Welcome.html`\
  \ 页头部部分定义的 VBScript 中。\n\n```\n Dim strFileNameString\nFunction Cookie_Check()\n\
  \n  If document.cookie <> \"\" Then\n    astrCookieArray = Split(document.cookie,\"\
  ,\")\n    strUserName = Mid(astrCookieArray(0), 8)\n    strDefaultView = astrCookieArray(1)\n\
  \    strColorScheme = astrCookieArray(2)\n\n    If strDefaultView = \"Archive\"\
  \ Then\n      window.location = \"Archive.html\"\n    End If\n    If strDefaultView\
  \ = \"Welcome\" Then\n      document.write(\"<H3>Order/Inventory Reporting Site</H3><P>\"\
  )\n      document.write(\"<B>Welcome \" & strUserName & \",</B><P>\")\n    End If\n\
  \    If strDefaultView = \"Daily\" Then\n      strFileNameString = Replace(Date(),\
  \ \"/\", \"-\")\n      strConsSolRptName = strConsolFolder & \"\\\" & strFileNameString\
  \ & _\n        \"_ConsolSumRpt.txt\"\n      strFileNameString = strFileNameString\
  \ & \"_ConsolRpt.html\"\n      window.location = strFileNameString\n    End If\n\
  \  Else\n    window.location = \"Config.html\"\n  End If\nEnd Function\n```\n\n\
  为了判断访问者的计算机是否拥有属于订单/库存报告网站的 Cookie，子程序首先检查 `document` 对象的 `cookie` 属性值。如果空白，则 `Default.html`\
  \ 页的 `right_frame` 框架将自动重定向到 `Config.html` 页面。如果 Cookie 不为空，则使用 VBScript `Split()`\
  \ 函数将 Cookie 内容分配给名为 `astrCookieArray` 的数组。\n\nCookie 的前七个字符指定了名称和等号。为了从 Cookie\
  \ 中提取访问者姓名，`Mid()` 函数将第一个数组元素从第 8 位开始的所有字符分配给名为 `strUserName` 的变量。接着，通过将 `astrCookieArray(1)`\
  \ 的值分配给 `strDefaultView` 来提取访问者偏好的默认页面。然后，提取访问者偏好的颜色方案并分配给 `strColorScheme`。\n\n\
  随后执行三个 `If` 语句。第一个 `If` 语句检查 `strDefaultView` 是否等于 `Archive`。如果是，则 `Default.html`\
  \ 页上的 `right_frame` 框架将重定向到 `..\\Reports\\Archive.html`。从访问者的角度来看，看起来就像 `Archive.html`\
  \ 页面是自动加载的（不显示 `Welcome.html` 页面）。\n\n第二个 `If` 语句检查 `strDefaultView` 是否等于 `Welcome`。如果是，则在\
  \ `Welcome.html` 页顶部写入一条标题消息，随后是一条使用 `strUserName` 变量存储的值对用户进行欢迎的消息。一旦完成此操作，`Welcome.html`\
  \ 页上显示的其余内容将按照其 HTML 标签中的指定写入。\n\n最后，最后一个 `If` 语句检查 `strDefaultView` 是否等于 `Daily`。如果是，`Config.html`\
  \ 页面将自动加载到 `Default.html` 页的 `right_frame` 框架中。\n\n### 完整装配的 Welcome.html \n\n完整装配的\
  \ `Welcome.html` 页面所示。当加载到 `Default.html` 页的 `right_frame` 框架时，`Welcome.html` 页面将问候访问者并显示有关订单/库存报告网站的信息。然而，如果这是访问者第一次访问该网站，嵌入\
  \ `Welcome.html` 页的 VBScript 将引导访问者重定向到 `Config.html` 页面。最后，如果访问者在访问网站时没有使用正确版本的\
  \ Internet Explorer，嵌入 `Welcome.html` 页的 VBScript 将访问者重定向到 `Browser.html` 页面，在该页面上将建议访问者在查看网站提供的内容时应使用哪个版本的\
  \ Internet Explorer。\n\n\n\n\n\n```html\n <HTML>\n  <HEAD>\n    <TITLE>脚本 28.1 -\
  \ 订单/库存主欢迎页</TITLE>\n\n    <SCRIPT LANGUAGE=\"VBScript\">\n    <!-- 开始隐藏 VBScript\
  \ 语句\n\n      Dim strFileNameString\n\n      '定义一个函数来检查 cookie，如果找到则将其用于\n     \
  \ '欢迎消息中\n      Function Cookie_Check()\n\n        If document.cookie <> \"\" Then\n\
  \          astrCookieArray = Split(document.cookie,\",\")\n          strUserName\
  \ = Mid(astrCookieArray(0), 8)\n          strDefaultView = astrCookieArray(1)\n\
  \          strColorScheme = astrCookieArray(2)\n\n          If strDefaultView =\
  \ \"Archive\" Then\n            window.location = \"..\\Rpts\\Archive.html\"\n \
  \         End If\n          If strDefaultView = \"Welcome\" Then\n            document.write(\"\
  <H3>订单/库存报告站点</H3><P>\")\n            document.write(\"<B>欢迎 \" & strUserName &\
  \ \",</B><P>\")\n          End If\n          If strDefaultView = \"Daily\" Then\n\
  \            strFileNameString = Replace(Date(), \"/\", \"-\")\n            strConolRptName\
  \ = strConsolFolder & \"\\\" & strFileNameString & _\n              \"_ConsolSumRpt.txt\"\
  \n            strFileNameString = strFileNameString & \"_ConsolRpt.html\"\n    \
  \        window.location = strFileNameString\n          End If\n        Else\n \
  \         window.location = \"Config.html\"\n          End If\n        End Function\n\
  \n        Sub BrowserCheck()\n\n          browserName = navigator.appName\n\n  \
  \        If browserName = \"Microsoft Internet Explorer\" Then\n\n            '使用\
  \ navigator appVersion 属性来收集关于\n            '访问者的 Internet 浏览器的信息\n\n          \
  \  browserVersion = navigator.appVersion\n\n            'Instr() 函数在字符串中搜索指定的字符集\n\
  \            findString = Instr(1, browserVersion, \"MSIE\")\n\n              findString\
  \ = findString + 5\n                versionNumber = Mid(browserVersion, findString,\
  \ 1)\n\n              If versionNumber < 5 Then\n                window.location\
  \ = \"Browser.html\"\n              End If\n            Else\n              window.location\
  \ = \"Browser.html\"\n            End If\n\n          End Sub\n\n        ' 结束隐藏\
  \ VBScript 语句 -->\n        </SCRIPT>\n      </HEAD>\n    <BODY>\n\n      <SCRIPT\
  \ LANGUAGE=\"VBScript\">\n      <!-- 开始隐藏 VBScript 语句\n      BrowserCheck()\n  \
  \    Cookie_Check()\n    ' 结束隐藏 VBScript 语句 -->\n    </SCRIPT>\n\n    <HR>\n   \
  \ <UL>\n      <LI>汇总摘要报告每天上午 06:00 可在线查看。</LI><P>\n      <LI>您还可以查看过去 3 个月的存档汇总摘要报告合集。</LI><P>\n\
  \      <LI>还提供汇总摘要报告的 Microsoft Word 副本供下载。</LI><P>\n      <LI>如果您需要查看本站点未提供的汇总摘要报告，请联系计算机运营部门要求他们为您提供纸质版。</LI><P>\n\
  \    </UL>\n    <HR>\n\n    <B><PRE>\n        控制中心帮助热线：       分机 3737\n        订单/库存热线：\
  \       分机: 4000\n        其他问题或疑虑：   分机: 3230\n    </PRE></B>\n\n  </BODY>\n</HTML>\n\
  ```\n```\n\n### 创建 Browser.html 页面\n\n如下页所示，组成 `browser.html` 页面的 HTML 代码非常简单。它只由\
  \ HTML 标签组成，不包含任何嵌入的 VBScript。其唯一目的是建议未使用 Internet Explorer 5 或以上版本的访问者返回使用适当浏览器，最好是\
  \ Internet Explorer 6.0。\n\n```html\n<HTML>\n\n  <HEAD>\n\n    <TITLE>对于未使用 Internet\
  \ Explorer 5 或以上版本的访问者，请使用适当浏览器，最好是 Internet Explorer 6.0。</TITLE>\n  </HEAD>\n\n\
  \  <BODY>\n\n    <div style=\"text-align:center;\">\n      <h3>对于未使用 Internet Explorer\
  \ 5 或以上版本的访问者，请使用适当浏览器，最好是 Internet Explorer 6.0。</h3>\n      <p>请使用 6.0 或更高版本的\
  \ Internet Explorer 访问站点。</p>\n    </div>\n\n  </BODY>\n</HTML>\n```\n\n### 创建 Browser.html\
  \ 页面\n\n如下页所示，组成 `browser.html` 页面的 HTML 代码非常简单。它只由 HTML 标签组成，不包含任何嵌入的 VBScript。其唯一目的是建议未使用\
  \ Internet Explorer 5 或以上版本的访问者返回使用适当浏览器，最好是 Internet Explorer 6.0。\n\n## 总结\n\n\
  在本章中，你观察到 William 如何使用 cookie 开始汇总站点的工作。具体而言，他开发了 HTML 框架并使用 VBScript 创建了菜单，还用于管理访问者的配置设置。\n\
  \n# 第 29 章：构建注册与配置页面\n\n在本章中，William 需要开发一个收集访问者信息的页面。为了完成此任务，他将定义一个 HTML 表单并使用\
  \ VBScript 验证其内容。最终，页面会将用户的姓名和偏好保存在 cookie 中。\n\n## Cookie 基础\n\n使用变量可以在脚本生命期间存储和引用值。然而，这些值在脚本结束时就会丢失，下次运行时必须重新创建。为了构建交互式站点并提供允许访问者指定设置的机制，你需要一种跨脚本或会话存储数据的方法。方法是使用\
  \ cookie。\n\nCookie 是你的站点可以存储的文本字符串。Cookie 从互联网早期一直存在，设计用于在访问者的计算机上存储少量数据。今天，带有后端数据库的\
  \ Web 服务器能够存储和检索有关访问者、其偏好和操作的海量信息。对于像报告站点这样的网站（信息仅供查看，不进行实际的数据收集或处理），使用后端数据库存储少数信息是大材小用。更简单的解决方案是使用\
  \ cookie。\n\nCookie 为存储各种信息提供了高效手段。例如，使用 cookie 可以：\n\n*   存储持久数据\n*   提供区分访问者的手段\n\
  *   提供个性化体验\n*   跟踪用户活动\n*   存储用户偏好\n\nCookie 是你存储在浏览器内存中的文本字符串。默认情况下，cookie 在访问关闭浏览器时过期。然而，通过在创建\
  \ cookie 时设置过期日期，你可以指示浏览器保留你的 cookie。浏览器通过在其计算机本地硬盘上保存 cookie 的文本副本来响应这一请求。\n\n\
  |  | 注意 | 现代浏览器为用户提供了阻止 cookie 的功能。然而，大多数用户认为这样做不方便或实际。重要的一是，你的脚本实际上无法在你 Web 站点的人硬盘上存储\
  \ cookie。相反，你将 cookie 存储在浏览器内存中，由浏览器根据所有者指定的浏览器配置设置决定是否将其存储在计算机的硬盘上。 |\n\n### Cookie\
  \ 存储\n\n\n\n\n\nCookie 在客户端计算机上的存储方式取决于用于存储 cookie 的浏览器类型和版本，以及运行浏览器的操作系统。例如，Netscape\
  \ Communicator 默认将其 cookie 作为文本字符串存储在位于 `C:\\Programs Files\\Netscape\\Users\\`Username`\\\
  cookies.txt` 路径下的一个大容量文本文件中。相比之下，Internet Explorer 将 cookie 存储为独立的文本文件。在运行 Windows\
  \ 95、98 或 Me 的计算机上，Internet Explorer 默认将 cookie 文件存储在 `C:\\Windows\\Cookies` 中。在运行\
  \ Windows 2000 或 XP 的计算机上，Internet Explorer 默认将 cookie 文本文件存储在 `C:\\Documents and\
  \ Settings\\`Username`\\Cookies` 中。\n\n|   | 备注 | 对 cookie 的真正详细讨论超出了本书的范围。如果你对学习超出本章介绍的基础知识的内容感兴趣，请访问\
  \ [`www.cookiecentral.com`](http://www.cookiecentral.com)。 |\n\nInternet Explorer\
  \ 是 Intuit 员工使用的浏览器。该浏览器将所有 cookie 存储为独立的文本文件，如图 29.1 所示。\n\n![点击展开](img/fig29-1_0.jpg)\n\
  \n图 29.1：Internet Explorer 将 cookie 存储为独立的文本文件，并将其与特定个人关联。\n\n如你在图 29.1 中所示，Internet\
  \ Explorer 在存储 cookie 时会将访问者的用户名与每个 cookie 关联。这样做是为了适应多个用户可能共享同一台计算机的情况。然而，用户名永远不会返回给创建\
  \ cookie 的网站；返回的只有 cookie 中存储的实际数据（不包括到期日期）。\n\nCookie 的大小可达 4KB。所有主流浏览器都支持 cookie，包括\
  \ Netscape Communicator 和 Internet Explorer。这两个浏览器都将计算机上可以存储的 cookie 数量限制为 300 个。一个网站在访问者计算机上可以存储的\
  \ cookie 最大值为 20 个。如果超过了这两个阈值之一，浏览器必须删除现有的 cookie 以为新 cookie 的到来留空间。由于这些限制，任何计算机上的\
  \ cookie 总上限被限制为 1.2MB（每个用户）。\n\n### Cookie 与安全\n\n默认情况下，cookie 只能从创建它的站点进行访问。这意味着其他网站将无法从访问过你网站的计算机读取你的\
  \ cookie。同样，你只能检索由你的网站负责创建的 cookie。因此，cookie 可以被认为具有一定的安全性。然而，由于 cookie 以明文文件形式存储在客户端计算机上，任何具有本地访问权限的人都可以自由地看到它们。这使得\
  \ cookie 不适合存储敏感信息，例如信用卡号和社保号码。cookie 的另一个限制是它们存储在计算机本地。如果访问者稍后使用另一台计算机返回该网站，则无法重新与访问者之前提供的数据建立关联。如果用户想要重新建立她的配置设置，则必须重新收集这些数据。\n\
  \n### Cookie 语法\n\n你的 VBScript 可以 `document` 对象的 `cookie` 属性创建并检索 cookie。cookie\
  \ 由一个或多个参数组成，每个参数之间用分号（`;`）分隔。创建 cookie 使用的语法所示。\n\n```\n name=value [;expires=ExpDate]\
  \ [;domain=DomName] [;path=PathName] [;secure]\n```\n\n`Name` 指定 cookie 的名称。`Value`\
  \ 标识由 cookie 存储的数据字符串。`ExpDate` 指定一个决定 cookie 有效期的日期。`DomName` 指定一个可以访问 cookie 的备用主机名。`Path`\
  \ 指定路径。`Secure` 是一个布尔值，只有在 HTTPS 连接时才有效。\n\n`Name` 指定 cookie 的名称。`Value` 标识由 cookie\
  \ 存储的数据字符串。`ExpDate` 指定一个决定 cookie 有效期的日期。`DomName` 指定一个可以访问 cookie 的备用主机名。`Path`\
  \ 指定路径。`Secure` 是一个布尔值，只有在 HTTPS 连接时才有效。\n\n#### 创建和检索简单的 Cookie\n\n以下示例演示了如何创建一个名为\
  \ `VisitorName` 的 cookie 并设置值：\n\n```\n document.cookie = \"VisitorName=Jerry\"\n\
  ```\n\n一旦创建，可以检索 cookie：\n\n```\nVisitorName = document.cookie\n```\n\n#### 创建持久性\
  \ Cookie\n\n除非显式指定过期日期，否则 cookie 将在关闭浏览器时被删除。要使 cookie 具有持久性，需将其过期日期设置为比当前会话更长。以下示例演示了如何创建一个持续一年的\
  \ cookie：\n\n```\n dtmExpDate = Weekdayname(DatePart(\"w\",Date())) + \", \"\n\n\
  dtmDayValue = DatePart(\"d\",Date())\n\nIf Len(dtmDayValue) = 1 Then\n  dtmDayValue\
  \ = \"0\" & dtmDayValue\nEnd If\n\ndtmExpDate = dtmExpDate & dtmDayValue & \"-\"\
  \n  & Monthname(DatePart(\"m\",Date(),1)) & \"-\" _\n  & DatePart(\"yyyy\",Date())\
  \ + 1 & \" 00:00:00 GMT\"\n\nstrCookie = \"VisitorName=Jerry; expires=\" + dtmExpDate\n\
  ```\n\n第一语句通过使用 `Date()` 函数检索当前日期创建一个变量 `dtmExpDate`。然后使用 `DatePart()` 函数提取表示星期几的数值。该值随后被输入\
  \ `Weekdayname()` 函数以确定当前星期几的名称（在本例中，当前星期几是周五）。在星期几名称后附加 `, ` 字符串。\n\n下一语句使用 `Date()`\
  \ 和 `DatePart()` 获取表示当前月份的数值。然后使用 `Len()` 函数确定该值是一位还是两位数字。如果只有一位（月份在 1 月到 9 月之间），则在该数字前面附加一个零以创建一个两位数。\n\
  \n接下来，通过将两位月份值附加到 `dtmExpDate` 后面，并加上 `-` 字符串，然后是当前月份的名称（`Monthname(DatePart(\"\
  m\",Date(),1))`）。再附加另一个 `-` 字符串和代表明年的数值（通过在当前年份上加 1），最后是 \"00:00:00 GMT\" 字符串。\n\
  \n最终结果是一个从创建之日起一年后的 cookie 字符串。例如，如果今天是 2003 年 5 月 2 日，该 cookie 字符串解析为：\n\n```\n\
  \ VisitorName=Jerry; expires=Friday, 02-May-2004 00:00:00 GMT\n```\n\n#### 指定有效的主机名\n\
  \n\n\n\n\n`domain` 参数允许你指定网站上的哪些主机名可以访问你的 cookie。默认情况下，会自动分配创建 cookie 的 Web 服务器的主机名。使用\
  \ `domain` 参数，你可以允许属于你的其他域名访问你的 cookie。例如，如果你在 [`www.intuitmechanical.com`](http://www.intuitmechanical.com)\
  \ 上的服务器上创建了 cookie，默认情况下，它将只能从该站点访问。然而，如果该公司有第二个站点，例如 [`sales.intuitmechanical.com`](http://sales.intuitmechanical.com)，则无法从该站点访问该\
  \ cookie。通过使用 `domain` 参数，你可以像下面所示，让该 cookie 在两个站点上都可用。请注意，开头的点（在`.intuitmechanical.com`\
  \ 中）是必须的。\n\n```\n document.cookie = \"string=\" & strCookieString & \";domain=.intuitmechanical.com\"\
  \n```\n\n| | 注意事项 |\n|---|由于 Intuit 只有一个 Web 服务器，William 在创建“订单/库存报告”网站站的 cookie\
  \ 时不需要包含此参数。 |\n\n## 确定哪些文件夹具有 Cookie 访问权限\n\n浏览器的默认行为允许与创建 cookie 的页面位于相同文件夹的页面访问\
  \ cookie。浏览器还允许任何位于该文件夹子文件夹中的页面访问该 cookie。然而，来自 Web 服务器上其他文件夹的访问将被自动阻止。\n\n例如，假设\
  \ Intuit Web 服务器上存在以下文件夹结构：\n\n* `\\Intuit\\OrderInventory\\Reporting\\HTML`\n*\
  \ `\\Intuit\\OrderInventory\\Reporting\\Rpts`\n* `\\Intuit\\OrderInventory\\Reporting\\\
  Rpts\\May`\n* `\\Intuit\\OrderInventory\\Reporting\\HTML\\June`\n\n如果你有一个位于 `\\\
  Intuit\\OrderInventory\\Reporting\\Rpts` 文件夹的 HTML 页面并由其创建了 cookie，那么该 cookie 将可以被该文件夹内的其他\
  \ HTML 页面访问，也可以被其两个子文件夹中的 HTML 页面访问。然而，该 cookie 将无法 `\\Intuit\\OrderInventory\\\
  Reporting\\HTML` 文件夹访问。\n\n使用 `path` 参数，你可以指定一个允许 cookie 被访问的更高层级的文件夹。例如，以下语句创建了一个\
  \ cookie，它可以从 Intuit Web 网站（或 Web 服务器）上任何文件夹中的任何 HTML 页面访问。\n\n```\n document.cookie\
  \ = \"string=\" & strCookieString & \";expires=\" & dtmExpDate &\n\";path=/\"\n\
  ```\n\n## 要求安全 Cookie 访问\n\n最后一个 cookie 参数是 `secure` 参数。`secure` 参数是一个布尔值，用于确定在未使用安全协议（如\
  \ `HTTPS`）时是否可以创建 cookie。当其设置为 `True` 时，只有在在使用 `HTTPS` 时才会保存 cookie。当设置为 `False`\
  \ 时，无论使用 `HTTP` 还是 `HTTPS` 连接到 Web 网站，都会保存 cookie。例如，以下语句仅在访问者已与网站建立 `HTTPS` 会话时才创建\
  \ cookie。\n\n```\n document.cookie = \"string=\" & strCookieString & \";expires=\"\
  \ & dtmExpDate & \"; True\"\n```\n\n## 删除 Cookie\n\n删除 cookie 是一个两步骤的过程。首先，你必须创建一个\
  \ cookie 字符串并将其值置为 null。接下来，在保存 cookie 之前，你必须为其分配一个过去的过期日期。如果你跳过第一步，仅使用过期的过期日期重新保存现有的\
  \ cookie，你的 cookie 将会被删除（当访问者关闭浏览器时）。然而，如果访问者离开了你的网站并在稍后返回，而在此期间没有关闭浏览器，那么你的 cookie\
  \ 将仍然存在。通过将其设置为 null 然后保存，你就可以确保如果访问者在没有先关闭浏览器的情况下返回，当你再次检索你的 cookie 时，它看起来就像已经被删除了一样（它将返回一个空字符串）。\n\
  \n## 验证你的 Cookie 是否创建\n\n有许多原因导致你的 cookie 可能无法在访问者的计算机上创建。例如，访问者可能配置了浏览器以拒绝 cookie，或者在存储\
  \ cookie 之前寻求许可。访问者可能在他们的计算机上运行个人防火墙等软件，这些软件会阻止收集 cookie。无论原因如何，你不能总是指望你的 cookie\
  \ 能如预期地创建，特别是当你的网站连接到互联网时。\n\n验证 cookie 是否已创建的一种方法是在创建它后立即尝试检索它。如果你能这样做，你就知道你成功创建了\
  \ cookie。然而，如果你发现 cookie 未被接受，你可能需要采取某种行动。例如，你可能会拒绝显示任何内容，而只显示一条信息，要求访问者在她的浏览器上启用接受\
  \ cookie。或者，你可以使用默认设置代替用户指定的设置，以便访问者访问你的网站，而无需向你提供任何信息。对于 William 来说，幸运的是，Intuit\
  \ 的所有员工浏览器都应该启用了 cookie 接受，这消除了测试他的 cookie 是否创建的需求。\n\n## 使用 HTML 表单收集信息\n\n为此项目创建\
  \ cookie 的第一步是确定你想从中存储什么信息。对于 Intuit 来说，William 决定创建一个 HTML 表单来从网站访问者处收集信息。一旦访问者提供了网站所需的配置设置，嵌入在\
  \ HTML 页面中的 VBScript 将验证该表单已正确填写，并将访问者的个人配置设置保存在 cookie 中。图 29.2 显示了 William 将创建的\
  \ HTML 表单。\n\n### Config.html 页面的 HTML\n\n构建此表单所需的 HTML 所示。注意每个表单元素都分配了显式的 `Name`\
  \ 值，以便 VBScript 访问元素的内容。\n\n```\n <HTML>\n  <HEAD>\n    <TITLE>脚本 27.1 - 订单/库存配置设置</TITLE>\n\
  \  </HEAD>\n\n  <BODY>\n    <H3>订单/库存配置设置</H3>\n\n    <BR>\n\n    <FORM NAME=\"\
  siteForm\">\n      <B>请告诉我们您的姓名：</B> <INPUT NAME=\"userName\" TYPE=\"text\" SIZE=\"\
  25\"\nMAXLENGTH=\"40\"><P><BR>\n      <B>默认视图：</B><P>\n      <INPUT NAME=\"siteRadio\"\
  \ TYPE=\"radio\" VALUE=\"Welcome\"> 欢迎页面<P>\n      <INPUT NAME=\"siteRadio\" TYPE=\"\
  radio\" VALUE=\"Archive\"> 存档页面<P>\n      <INPUT NAME=\"siteRadio\" TYPE=\"radio\"\
  \ VALUE=\"Daily\"> 日汇总汇总报告<P><BR>\n\n      <P><B>选择颜色方案：</B>\n      <SELECT NAME=\"\
  siteList\">\n        <OPTION SELECTED VALUE=\"Yellow\">黄色配白色</OPTION>\n        <OPTION\
  \ VALUE=\"LightBlue\">浅蓝色配白色</OPTION>\n        <OPTION VALUE=\"LightGreen\">浅绿色配白色</OPTION>\n\
  \        <OPTION VALUE=\"LightGrey\">浅灰色配白色</OPTION>\n        <OPTION VALUE=\"Pink\"\
  >粉色配白色</OPTION>\n      </SELECT></P><BR>\n\n      <INPUT NAME=\"SaveButton\" TYPE=\"\
  button\" VALUE=\" 保存 \">\n      <INPUT NAME=\"CancelButton\" TYPE=\"reset\" VALUE=\"\
  \ 取消 \">\n      <INPUT NAME=\"HelpButton\" TYPE=\"button\" VALUE=\" 帮助 \">\n   \
  \ </FORM>\n  </BODY>\n</HTML>\n```\n\nHTML 页面上的最后一个表单元素定义了一个下拉列表。图 29.3 显示了当访问者访问它们时，此列表提供的内容将如何显示。\n\
  \n\n\n\n一旦表单创建，你就可以开始编写嵌入其中的 VBScript 脚本。该脚本将执行两个主要任务：第一个任务是验证表单是否填写正确；第二个任务是将表单内容存储在\
  \ cookie 中。\n\n表单在 HTML 页面底部有一个名为 `SaveButton` 的按钮。点击时，该按钮应启动一个名为 `ProcessSettings()`\
  \ 的子程序，如下所示：\n\n```\n <INPUT NAME=\"SaveButton\" TYPE=\"button\" VALUE=\" Save \"\
  \ onClick=\"ProcessSettings()\">\n```\n\n`ProcessSettings()` 子程序将检查每个表单元素，确保访问者提供了所需的信息。\n\
  \n## 表单验证\n\n为了给 HTML 页面准备 VBScript 准备工作，William 首先在页面的头部部分嵌入了起始标签 `<SCRIPT>` 和结束标签\
  \ `</SCRIPT>`。接下，他定义了以下变量和常量：\n\n```\n Option Explicit\nDim strRadioSelected, intCounter,\
  \ strConfigSettings, strRadioSelection\nConst cTitleBarMsg = \"订单/库存配置设置帮助页\"\n\
  ```\n\n完成上述步骤后，William 创建了 `ProcessSettings()` 函数，如下所示：\n\n```\n Function ProcessSettings()\n\
  \n  If Len(document.siteForm.userName.value) < 1 Then\n    MsgBox \"您必须提供您的姓名以继续。\"\
  , , cTitleBarMsg\n    Exit Function\n  End If\n\n  strRadioSelected = \"False\"\n\
  \n  For intCounter = 0 To siteForm.siteRadio.length - 1\n    If siteForm.siteRadio(intCounter).Checked\
  \ = \"True\" Then\n      strRadioSelection = siteForm.siteRadio(intCounter).value\n\
  \      strRadioSelected = \"True\"\n    End If\n  Next\n\n    If strRadioSelected\
  \ = \"False\" Then\n      MsgBox \"您必须指定您偏好的默认页面。\", , cTitleBarMsg\n      Exit\
  \ Function\n    End If\n\n    strConfigSettings = document.siteForm.userName.value\
  \ & \",\" & _\n      strRadioSelection & \",\" & siteForm.siteList.value\n\n   \
  \ BakeTheCookie(strConfigSettings)\n\n    top.left_frame.document.bgcolor = siteForm.siteList.value\n\
  \    MsgBox \" 以下配置设置已保存：\" & _\n      vbCrLf & vbCrLf & _\n      \"Name = \" &\
  \ document.siteForm.userName.value & vbCrLf & _\n      \"Default View = \" & strRadioSelection\
  \ & vbCrLf & _\n      \"Color Scheme = \" & siteForm.siteList.value, ,cTitleBarMsg\n\
  \nEnd Function\n```\n\n该函数首先判断访问者是否在表单的文本字段（`document.siteForm.userName.value`）中输入了姓名。如果没有提供姓名，则显示图\
  \ 29.4 所示的弹出消息，并使用 `Exit Function` 语句终止函数的执行。\n\n![点击展开](img/fig29-4_0.jpg)\n\n\
  图 29.4：使用弹出对话框与访问者交互，以确保他们提供了必要信息\n\n如果访问者确实提供了姓名，函数接下来将通过检查 `siteForm.siteRadio(intCounter).value`\
  \ 的值，来检查是否选择了三个视图选项之一。如果选择了其中一个单选按钮，则将其值赋值给名为 `strRadioSelection` 的变量。否则，将显示图 29.5\
  \ 所示的弹出对话框，函数停止执行。\n\n![点击展开](img/fig29-5_0.jpg)\n\n图 29.5：如果未选择单选按钮，则会出现对话框\n\n\
  最后，将创建一个包含表单每个元素所指定值的字符串。该字符串随后被赋值给名为 `strConfigSettings` 的变量。接，调用 `BakeTheCookie()`\
  \ 函数并传递由 `ProcessSettings()` 函数创建的字符串。当从 `BakeTheCookie()` 函数返回控制权时，`top.left_frame.document.bgcolor`\
  \ 的值设置为 `siteForm.siteList.value` 指定的颜色。最终结果是 `Default.html` 页面 `left_frame` 框架中显示的背景颜色会立即更改，以反映访问者的偏好。最后，显示一个弹出对话框，告知访问者其配置设置已保存。图\
  \ 29.6 显示了当访问者的设置成功收集时显示的弹出对话框。\n\n![点击展开](img/fig29-6_0.jpg)\n\n图 29.6：显示访问者指定的配置设置\n\
  \n## 烘焙 Cookie\n\n`BakeTheCookie()` 函数格式化用于制作 cookie 测试字符串，然后使用 `document` 对象的 `cookie`\
  \ 属性保存 cookie。\n\n```\n Function BakeTheCookie(strCookieString)\n\n  Dim dtmExpDate,\
  \ strCookie\n\n  dtmExpDate = Weekdayname(DatePart(\"w\",Date())) & \", \" _\n \
  \   & FormatDate(DatePart(\"d\",Date())) & \"-\" _\n    & Monthname(DatePart(\"\
  m\",Date(),1) + 1) & \"-\" _\n    & DatePart(\"yyyy\",Date()) _\n    & \" 00:00:00\
  \ GMT\"\n  strCookie = \"=\" & strCookieString & \";expires=\" & dtmExpDate\n  document.cookie\
  \ = strCookie\nEnd Function\n```\n\n### Cookie 过期\n\n完成 HTML 的 VBScript 需要一个额外的函数，名为\
  \ `FormatDate()`。它的作用是如果 `dtmDate` 只有一个字符，则在其开头填充一个零。\n\n```\n Function FormatDate(dtmDate)\n\
  \  If Len(dtmDate) = 1 Then\n    dtmDate = \"0\" & dtmDate\n  End If\n  FormatDate\
  \ = dtmDate\nEnd Function\n```\n\n### 取消配置更改\n\nWilliam 预计访问者有时会在配置页面上进行更改，并在思考后决定不保存。为了方便这些访问者，他在\
  \ VBScript 中添加了 `CancelButton_onClick()` 子程序。\n\n```\n Sub CancelButton_onClick()\n\
  \  history.back()\n End Sub\n```\n\n该函数的名称是通过将 `onClick` 追加到按钮名称创建的。通过这种命名方式，William\
  \ 将其与 `CancelButton` 按钮关联，从而在 `onClick` 事件发生时自动执行。执行后，该子程序使用 `history` 对象的 `back()`\
  \ 方法将之前显示的 URL 重新加载到 `Default.html` 页面的 `right_frame` 框架中。\n\n## 显示帮助\n\n为了让注册和配置页面更容易使用，William\
  \ 选择为访问者提供帮助选项。其理念是在他们点击帮助按钮时提供如何正确填写表单的说明。为了实现此功能，William 计划使用 VBScript 的 `MsgBox()`\
  \ 函数。但首先，他必须修改与按钮关联的 `<INPUT>` 标签，如下所示：\n\n```\n <INPUT NAME=\"HelpButton\" TYPE=\"\
  button\" VALUE=\" Help \" onClick=\"DisplayHelpDialog()\">\n```\n\nWilliam 的修改导致标签的\
  \ `onClick` 事件触发 `DisplayHelpDialog()` 子程序的执行，如下所示：\n\n```\n Sub DisplayHelpDialog()\n\
