  \ | 11 | 除以零 |\n| 800A000D | 13 | 类型不匹配 |\n| 800A000E | 14 | 字符串空间不足 |\n| 800A0011\
  \ | 17 | 无法执行请求的操作 |\n| 800A001C | 28 | 栈空间不足 |\n| 800A0023 | 35 | 未定义子或函数 |\n|\
  \ 800A0030 | 48 | 加载 DLL 错误 |\n| 800A0033 | 51 | 内部错误 |\n| 800A005B | 91 | 对象变量未设置\
  \ |\n| 800A005C | 92 | For 循环未初始化 |\n| 800A005E | 94 | Null 的无效使用 |\n| 800A01A8\
  \ | 424 | 需要对象 |\n| 800A01AD | 429 | ActiveX 组件无法创建对象 |\n| 800A01AE | 430 | 类不支持\
  \ |\n| 800A01B0 | 432 | 自动化不支持 |\n| 800A01B6 | 438 | 对象不支持 |\n| 800A01BD | 445 |\
  \ 对象不支持 |\n| 800A01BF | 447 | 对象不支持 |\n| 800A01C0 | 448 | 变量未找到 |\n| 800A01C1 |\
  \ 449 | 参数不是可选 |\n| 800A01C2 | 450 | 参数个数错误 |\n| 800A01C3 | 451 | 对象不是集合 |\n| 800A01CA\
  \ | 452 | 远程服务器不支持 |\n| 800A01CE | 458 | 变量使用类型 |\n| 800A01E1 | 462 | 无效引用 |\n|\
  \ 800A01F4 | 481 | 类未定义 |\n| 800A01F6 | 500 | 发生异常 |\n| 800A01F7 | 503 | 非法赋值 |\n\
  | 800A01F8 | 504 | 语法错误 |\n| 800A01F9 | 505 | 意外的 |\n| 800A01FA | 506 | 意外的 |\n\
  | 800A01FB | 507 | 无效范围 |\n| 800A1390 | 5008 | 非法赋值 |\n| 800A1399 | 5017 | 语法错误\
  \ |\n| 800A139A | 5018 | 意外的量词 |\n| 800A139B | 5019 | 缺少 ] |\n| 800A139C | 5020\
  \ | 缺少 ) |\n| 800A139D | 5021 | 无效范围 |\n\n#### 清除错误\n\n`Err` 对象提供了两个非常有用的方法。第一个方法是\
  \ `Clear()` 方法。如果脚本发生错误并进行了处理，允许脚本继续，随后发生了新错误，新错误的信息将覆盖 `Err` 对象存储的旧错误信息。然而，如果你的脚本之后检查错误而没有发生新错误，旧错误将被再次报告。为了防止这种行为，请使用\
  \ `Clear()` 方法删除已处理错误的信息。要使用 `Clear()` 方法，请将其放在错误处理例程的末尾，如下示例所示：\n\n```\nIf Err\
  \ > 0 then\n  Err.Number = 9000\n  Err.Description = \"This script has attempted\
  \ to execute a \" _\n    \"procedure that has not been defined by the programmer.\"\
  \n  MsgBox \"Error: \" & Err.Number & \" - \" & Err.description\n  Err.Clear\nEnd\
  \ if\n```\n\n|  | 备注 | VBScript 在执行 `On Error Resume Next` 语句时会自动执行 `Clear()` 方法。它在执行\
  \ `Exit Sub` 和 `Exit Function` 语句时也会执行 `Clear()` 方法。 |\n\n#### 抛出错误\n\n`Err` 对象的\
  \ `Raise()` 方法提供了在测试错误处理程序时模拟错误的能力。要使用此方法，请将其放在错误处理程序之前的代码中，如下示例所示：\n\n```\nErr.Raise(92)\n\
  ```\n\n\n\n\n本章介绍了了使用 VBScript `InputBox()` 函数的方方面。这包括如何格式化在弹出的对话框中显示的文本，以及如何对 `InputBox()`收集的数据进行查询和验证。你还学习了\
  \ VBScript 的隐式变量类型转换以及如何手动执行显式变量类型转换。本章涵盖了如何使用 `MsgBox()` 函数，包括对如何指定按钮、图标、默认按钮和模态的审查。此外，你还学习了如何确定用户选择了哪个按钮。本章还向你展示了如何捕获并重新格式化错误消息，以使其对用户来说更具描述性且更易于理解。\n\
  \n# 第 7 章：VBScript 对象\n\n在本章中，你将研究 VBScript 如何通过操作对象与其环境交互。这包括对 VBScript 内置对象和运行时对象的检查，并完整列出与对象相关的属性和方法。此外，你将简要概述浏览器特定和\
  \ WSH（Windows 脚本主机）特定对象的重要性。你还将学习如何创建自己的具有完整 set 自定义属性和方法的自定义对象。\n\n## VBScript\
  \ 基于对象的编程\n\n为了完成任何实际工作，VBScript 依赖于对象的使用。`object`（对象）通过方法和属性访问系统资源和数据操作结构。`Methods`（方法）是内置在对象中的函数，执行时与对象所代表的资源进行交互或操作。`Properties`（属性）是对象代表资源的特征，以某种方式描述资源。某些属性是只读的，允许\
  \ VBScript 收集有关资源的信息。其他属性可以修改，从而提供了直接更改对象所代表资源的某些属性的能力。\n\nVBScript 本身的能力有限。它无法访问\
  \ HTML 页面元素、Windows 文件系统或其他系统资源。VBScript 仅提供了一小部分内置对象集合。这些对象为 VBScript 提供了响应错误以及从字符串中解析和提取数据的能力。VBScript\
  \ 的内置对象列在表 7.1 中。\n\n表 7.1：VBScript 内置对象\n\n| 对象 | 描述 |\n| --- | --- |\n| `Class`\
  \ | 提供创建自定义对象的能力属性：此对象不支持任何属性方法：此对象不支持任何方法事件：`Initialize`、`Terminate` |\n| `Err`\
  \ | 提供运行时错误的详细信息属性：`Description`、`HelpContext`、`HelpFile`、`Number`、`Source`方法：`Clear`、`Raise`事件：此对象不支持任何事件\
  \ |\n| `Match` | 访问正则表达式匹配的只读属性：`FirstIndex`、`Length`、`Value`方法：此对象不支持任何方法事件：此对象不支持任何事件\
  \ |\n| `Matches Collection` | 正则表达式 `Match` 对象的集合属性：此对象不支持任何属性方法：此对象不支持任何方法事件：此对象不支持任何事件\
  \ |\n| `RegExp` | 支持正则表达式属性：`Global`、`IgnoreCase`、`Pattern`方法：`Execute`、`Replace`、`Test`事件：此对象不支持任何事件\
  \ |\n| `SubMatches Collection` | 访问正则表达式子匹配字符串的只读值属性：此对象不支持任何属性方法：此对象不支持任何方法事件：此对象不支持任何事件\
  \ |\n| | 注意 | VBScript 的内置对象集合由 VBScript 解释器提供。无论在什么环境中执行，所有 VBScript 都可以使用这些对象。\
  \ |\n\n### 属于 VBScript 内置对象的属性\n\n如表 7.1 所示，VBScript 的内置对象集合提供了对许多不同属性的访问。表 7.2\
  \ 列出了这些属性每一个并描述了它们的用途。\n\n表 7.2：VBScript 对象属性\n\n| 属性 | 描述 |\n| --- | --- |\n| `Description`\
  \ | 获取错误消息 |\n| `FirstIndex` | 返回指定子字符串在字符串中的第一个位置 |\n| `Global` | 修改或检索 `Boolean`（布尔）值\
  \ |\n| `HelpContext` | 获取帮助文件主题的上下文 ID |\n| `HelpFile` | 返回帮助文件的路径 |\n| `IgnoreCase`\
  \ | 获取一个 `Boolean` 布尔值，指示模式搜索是否区分大小写 |\n| `Length` | 返回搜索字符串匹配的长度 |\n| `Number`\
  \ | 返回指定错误的错误号 |\n| `Pattern` | 获取搜索操作中的正则表达式模式 |\n| `Source` | 获取生成错误的对象的名称 |\n\
  | `Value` | 返回搜索字符串匹配的值 |\n\n### 属于 VBScript 内置对象的方法\n\nVBScript 内置的 `Err` 和 `RegExp`\
  \ 对象提供了少量方法的访问。表 7.3 列出了这些方法的每一个并描述了它们的用途。\n\n表 7.3：VBScript 对象方法\n\n| 对象 | 方法 |\
  \ 描述 |\n| --- | --- | --- |\n| `Err` | `Clear` | 清除 `Err` 对象存储的当前错误信息 |\n| `Err`\
  \ | `Raise` | 提供生成和测试运行时错误的能力 |\n| `RegExp` | `Execute` | 对字符串执行正则表达式搜索 |\n| `RegExp`\
  \ | `Replace` | 替换搜索中的文本 |\n| `RegExp` | `Test` | 对字符串执行正则表达式搜索 |\n\n## 使用 VBScript\
  \ 内置对象\n\n如表 7.1 所示，VBScript 提供了许多内置对象。这些对象提供了执行以下所有操作的能力：\n\n* 处理 VBScript 运行时错误\n\
  * 定义自定义对象并为其分配属性和方法\n* 执行字符和模式匹配\n\n接下来的章节将介绍其中的一些对象。\n\n### Err 对象\n\n你已经在第 6 章\"\
  数据收集、通知和错误报告中学习了如何使用内置的 `Err` 对象。该对象通过提供以下属性来访问运行时错误信息：\n\n* `Description`描述错误情况的字符串\
  \ |\n* `Error Number`与错误相关的 VBScript 错误号 |\n* `Source`报告错误的资源名称 |\n* `HelpContext`为指定的帮助文件主题设置上下文\
  \ ID |\n* `HelpFile`包含信息的外部文件的名称和位置 |\n\n此外，该对象提供了两个处理错误的方法：\n\n* `Clear()`。删除 `Err`\
  \ 对象存储的当前错误信息 |\n* `Raise()`。提供生成和测试运行时错误的能力 |\n\n### Class 对象\n\nVBScript 支持许多不同的数据子类型，包括字符串和日期。VBScript\
  \ 还支持更复杂的数组数据结构。VBScript 提供 `Class` 对象作为创建自定义复杂数据结构（自定义对象）的方法。通过创建自己的自定义对象，你可以封装数据函数来创建新对象，然后你的\
  \ VBScript 可以像访问其他对象一样访问它们。创建自定义对象为你的脚本提供了一个有助于确保数据一致性的工具，因为它允许你定义验证和强制执行对象属性以及控制对象操作的过程。\n\
  \n#### Class 对象语法\n\n\n\n\n自定义对象使用 `Class`...`End Class` 语句创建。因此，`Class` 对象为定义其他对象及其结构提供了一个模板。一旦定义，这些对象就可以像其他对象一样实例化。该语句的语法概述如下。\n\
  \n```\n Class ClassName\nStatements\nEnd Class\n```\n\n`ClassName` 代表分配给新对象的名称。`Statements`\
  \ 代表在对象内部定义的变量、属性和方法。方法通过定义 `Sub` 或 `Function` 过程建立。属性通过使用以下任何语句来操作 `Class`...`End\
  \ Class` 语句中定义的变量来定义：\n\n- `Property Get`: 提供检索分配给私有变量的值的能力\n- `Property Let`: 提供更改分配给私有变量的值的能力\n\
  - `Property Set`: 提供更改对象变量值的能力\n\n### 创建变量、属性和方法\n\n可以使用 `Public` 和 `Private` 关键字将变量、属性和方法定义为公共（在整个脚本中可访问）或私有（仅在\
  \ `Class` 内部可用）。除非另说明，否则始终假设为 `Public`。\n\n| 注意 | 注意 |\n| :--- | :--- |\n| 尽管你可以允许在\
  \ `Class`...`End Class` 语句中定义的变量具有公共范围，但不建议这样做。这会阻止你从对象内部验证分配给变量的值。相反，建议建议将所有变量设为私有，并使用\
  \ `Property Get` 和 `Property Let` 语句暴露它们。这样，你就可以在对象中构建数据验证逻辑并确保数据完整性。 |\n\n下面的示例演示了如何使用\
  \ `Class` 对象创建一个名为 `Customer` 的自定义对象。\n\n```\n Class Customer\n\n  Private strCustName\n\
  \n  Public Property Get CustomerName\n    CustomerName = strCustName\n  End Property\n\
  \n  Public Property Let CustomerName (strNameAssignment)\n    StrCustName = strnameAssignment\n\
  \  End property\n\n  Function DisplayName\n    MsgBox(strCustName)\n  End Function\n\
  End Class\n```\n\n第一语句定义了一个名为 `strCustName` 的私有变量。接下来的三个语句使用该变量创建一个属性并使其可读。随后的三个语句使该属性变为可写。最后，`Class`...`End\
  \ Class` 语句内的最后三个语句定义了一个将作为对象方法的函数。\n\n现在已经定义了一个新对象，你可以对其进行实例化，如下所示。\n\n```\n Dim\
  \ objCustName\nSet objCustName = New Customer\n```\n\n你可以将客户名称存储到对象中。\n\n```\n objCustName.CustomerName\
  \ = \"ABC Inc.\"\n```\n\n然后你可以执行对象的 `DisplayGreeting()` 方法。\n\n```\n objCustName.DisplayName()\n\
  ```\n\n| 注意 | 注意 |\n| :--- | :--- |\n| 存储在对象中的数据在脚本结束时会被删除。这对其价值产生了一定的限制。然而，有很多方法可以存储和检索对象数据。例如，在处理\
  \ WSH 时，你可以将对象数据写入文件或存储在系统变量中。同样，在 Web 页面开发中使用 VBScript 时，你可以使用 cookie 在客户端计算机本地存储非敏感对象数据。\
  \ |\n\n### 设置初始化和终止过程\n\n由 `Class`...`End Class` 语句创建的对象支持以下事件：\n\n- `Class_Initialize`:\
  \ 如果存在，每当对象的实例创建时，该方法就会执行，提供了一个执行初始化任务（如定义初始变量值）的机会。\n- `Class_Terminate`: 如果存在，每当对象的实例被销毁时，该方法就会执行，提供了一个执行任何所需的清理任务的机会。\n\
  \n下面的语句演示了如何根据 `Class_Initialize` 和 `Class_Terminate` 事件的发生触发语句执行。\n\n```\n Private\
  \ Sub Class_Initialize\n  MsgBox(\"The Class_Initialize Subroutine is executing!\"\
  )\nEnd Sub\n\nPrivate Sub Class_Terminate\n  MsgBox(\"The Class_Terminate Subroutine\
  \ is executing!\")\nEnd Sub\n```\n\n一旦添加到 `Class`...`End Class` 语句内部，这些事件会在关联对象的的新实例创建或销毁时自动执行。\n\
  \n| 注意 | 注意 |\n| :--- | :--- |\n| 你可以使用 `Set` 语句和 `New` 关键字创建自定义对象的新实例，如下所示。 |\n\
  \n```\n Set objCustName = New Customer\n```\n\n同样，可以使用 `Set` 语句销毁自定义对象。\n\n```\n\
  \ Set objCustName = Nothing\n```\n\n`Nothing` 是 VBScript 关键字，用于将对象变量与对象解关联。只要没有其他对象变量引用该对象，存储其数据的内存就会被释放。\
  \ |\n\n### RegExp 对象和其他相关对象\n\n除了 `Err` 对象和 `Class` 对象外，VBScript 的所有其他内置对象都设计为配合正则表达式工作。正则表达式是由字符和元字符组成的文本模式。正则表达式提供了识别模式以及执行复杂搜索和替换操作的能力。\n\
  \n`RegExp` 对象允许你在 VBScript 中处理正则表达式。要向你的 VBScript 添加 `RegExp` 对象，你必须首先定义一个变量来表示它，然后使用\
  \ `New` 关键字对其实例化，如下所示。\n\n```\n Dim regExpObj\nSet regExpObj = New RexExp\n```\n\
  \n`RegExp` 对象有三个属性：\n\n- `Pattern`: 指定要匹配的正则表达式模式\n- `IgnoreCase`: 一个布尔值，决定是否执行大小写敏感的搜索\n\
  - `Global`: 一个布尔值，决定是否应替换模式的所有出现处\n\n此外，`RegExp` 对象提供了许多方法，其中之一是 `Replace()` 方法。该方法替换搜索字符串中的匹配文本模式。其语法所示所示。\n\
  \n```\n RegExp.Replace(String1, String2)\n```\n\n`String1` 是发生替换的字符串，`String2` 是替换字符串。\n\
  \n例如，以下语句演示了如何使用 `RegExp` 对象搜索字符串变量 `strQuote` 并替换单词 `child` 的出现情况。\n\n```\n Dim\
  \ regExpObj, strQuote\nSet regExpObj = New RegExp\nregExpObj.Pattern = \"boy\"\n\
  strQuote = \"Once upon a time there was a little boy.\"\nMsgBox RegExpObj.Replace(strQuote,\
  \ \"child\")\n```\n\n此示例中的前两个语句定义并创建了一个名为 `regExpObj` 的 `RegExp` 对象实例。接下来的一行使用 `RegExp`\
  \ 项目的 `Pattern` 属性来设置搜索模式。随后的语句设置了要搜索的字符串。最后，示例中的最后一个语句将字符 `boy` 的第一次出现替换为字符 `child`。\n\
  \n之前的示例仅替换指定模式匹配的第一次出现。然而，你可以像下面所示修改搜索模式，以搜索并替换搜索字符串中的模式匹配。\n\n```\n Dim regExpObj,\
  \ strQuote\nSet regExpObj = New RegExp\nregExpObj.Pattern = \"boy\"\nregExpObj.Global\
  \ = True\nstrQuote = \"Once upon a time there was a little boy.\"\nMsgBox RegExpObj.Replace(strQuote,\
  \ \"child\")\n```\n\n如你所见，示例中添加了一条新语句，该语句使用 `RegExp` 属性的 `Global` 属性来替换搜索字符串中的所有匹配项。VBScript\
  \ 还提供了许多元字符，当与 `RegExp` 对象的 `Pattern` 属性工作时可以使用这些字符。例如，以下语句使用值范围执行模式替换：\n\n\n\n\n\
  \n```\n Dim regExpObj, strQuote\nSet regExpObj = New RegExp\nregExpObj.Pattern =\
  \ \"[\\d]\"\nregExpObj.Global = True\nstrQuote = \"Your customer number is 8.\"\n\
  MsgBox RegExpObj.Replace(strQuote, \"1008\")\n```\n\n元字符 `\\d` 指定将任何单个数字用作替换字符串。在本例中，数字\
  \ 8 被替换为数字 1008。。表 7.4 列出了 VBScript 正则表达式支持的元字符。\n\n### 表 7.4：VBScript 对象方法\n\n\
  | 字符 | 描述 |\n| --- | --- |\n| \\ | 将下一个字符指定为特殊字符、反向引用、字面量或八进制转义字符 |\n| ⁁ | 匹配输入字符串的开头\
  \ |\n| $ | 匹配输入字符串的结尾 |\n| * | 匹配前面的表达式（0 次或多次） |\n| + | 匹配前面的表达式（1 次或多次） |\n| ?\
  \ | 匹配前面的表达式（0 次或 1 次） |\n| {n*} | 恰好匹配 *n* 次 |\n| {n*,} | 至少匹配 *n* 次 |\n| {n*,\
  \ m*} | 最少 *n* 次，最多 *m* 次 |\n| . | 匹配除换行符以外的单个字符 |\n| (*pattern*) | 匹配模式并允许从 `Matches`\
  \ 集合中检索匹配的子字符串 |\n| x|y | 匹配 *x* 或 *y* |\n| [*xyz] | 匹配指定的任意字符 |\n| [⁁*xyz] | 匹配除指定字符外的任何字符\
  \ |\n| [*a-z*] | 匹配范围内的任何字符 |\n| [⁁*a-z] | 匹配范围指定字符外的任何字符 |\n| \\b | 匹配单词边界 |\n\
  | \\B | 匹配非单词边界 |\n| \\cx | 匹配指定为 *x* 的控制字符 |\n| \\d | 匹配单个数字 |\n| \\D | 匹配任何单个非数字字符\
  \ |\n| \\f | 匹配分页符 |\n| \\n | 匹配换行符 |\n| \\r | 匹配回车符 |\n| \\s | 匹配任何空白字符（例如空格、制表符、分页符）\
  \ |\n| \\S | 匹配任何非空白字符 |\n| \\t | 匹配制表符 |\n| \\v | 匹配垂直制表符 |\n| \\w | 匹配任何单词字符 |\n\
  | \\W | 匹配任何非单词字符 |\n| \\xn | 匹配 *n*，其中 *n* 是两位十六进制转义值 |\n| \\*num* | 匹配 *num*，其中\
  \ *num* 是用于匹配的反向引用正整数 |\n| \\n | 指定八进制转义值或反向引用 |\n| \\*nml | 匹配八进制转义值 *nml*，其中 *n*\
  \ 是 0–3 范围八进制数字，*m* 和 *l* 是 0–7 范围八进制数字 |\n| \\un | 匹配 *n*，其中 *n* 是四位十六进制 Unicode\
  \ 字符 |\n\n`RegExp` 对象提供了下面列出的两个额外方法。\n\n*   `Test()`: 搜索正则表达式并返回一个布尔值，指示是否找到了匹配模式\n\
  *   `Execute()`: 通过搜索正则表达式创建一个 `Matches` 集合\n\n#### Test() 方法\n\n`Test()` 方法允许你检查字符串是否包含模式匹配。其语法如下：\n\
  \n```\n RegExp. Test(string)\n```\n\n例如，以下语句演示了如何使用 `Text()` [此处应 Test] 方法报告模式匹配是否存在：\n\
  \n```\n Dim regExpObj, strQuote\nSet regExpObj = New RegExp\nregExpObj.Pattern =\
  \ \"boy\"\nstrQuote = \"Once upon a time there was a little boy.\"\nIf regExpObj.\
  \ Test(strQuote) = True Then\n  MsgBox \"Match Found\"\nElse\n  MsgBox \"No Match\
  \ Found\"\nEnd If\n```\n\n#### Execute() 方法\n\n`RegExp` 对象的 `Execute()` 方法通过搜索正则表达式创建一个\
  \ `Matches` 集合，其语法如下：\n\n```\n RegExp.Execute(string)\n```\n\n生成的 `Matches` 集合是只读的，构成集合的单个\
  \ `Match` 对象也是只读的。一旦创建，你就可以遍历 `Matches` 集合中的每个对象并进行处理，如下例所示。\n\n```\n '*************************************************************************\n\
  'Script Name: Script 7.1.vbs\n'Author: Jerry Ford\n'Created: 02/05/2003\n'Description:\
  \ 执行正则表达式模式替换\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nDim regExpObj, strQuote, colMatchStmts, strDisplayText,\
  \ intCount, Match\nSet regExpObj = New RegExp\n\nregExpObj.Pattern = \"File\" '指定要搜索的字符串\n\
  \nregExpObj.Global = True '执行全局模式匹配\n\n'指定要搜索的字符串\nstrQuote = \"Filename filename\
  \ logFile logfile File file\"\n\n'主处理部分\n\nCreateMatches()\nProcessMatches()\nDisplayResults()\n\
  \n'过程/过程部分\n\nSub CreateMatches()\n  '使用 RegExp 对象的 Execute() 创建匹配项集合\n  Set colMatchStmts\
  \ = regExpObj.Execute(strQuote)\nEnd Sub\n\nSub ProcessMatches()\n  '设置计数器统计匹配次数\n\
  \  intCount = 0\n  '遍历集合\n  For Each Match In colMatchStmts\n    '构建显示匹配位置的字符串\n\
  \    strDisplayText = strDisplayText & \"A match occurred at position \" & Match.Index\
  \ & vbLf\n    intCount = intCount + 1\n  Next\nEnd Sub\n\nSub DisplayResults()\n\
  \  '显示结果\n  MsgBox \"Total number of matches = \" & intCount & vbLf & vbLf &\n \
  \   strDisplayText\nEnd Sub\n```\n\n\n\n\n\n第二组对象被称为 VBScript 运行时对象（runtime objects）。这些对象由一个名为\
  \ `scrrun.dll` 的外部 DLL（动态链接库）提供。它们为 VBScript 提供了访问 Windows 文件系统的能力。此外，VBScript 运行时对象还包含一个名为\
  \ `Dictionary` 的对象。`Dictionary` 对象允许你在一个关联数组中存储数据，并使用键（keys）而不是像普通 VBScript 数组那样的索引来检索存储在数组中的数据。VBScript\
  \ 的运行时对象列在表 7.5 中。\n\n## 表 7.5：VBScript 运行时对象\n\n| 对象名称 | 说明 |\n| --- | --- |\n\
  | `Dictionary` | 存储数据键值对。属性：`Count`, `Item`, `Key` 方法：`Add`, `Exists`, `Items`,\
  \ `Keys`, `Remove`, `RemoveAll` |\n| `Drive` | 为脚本提供磁盘属性的访问。属性：`AvailableSpace`,\
  \ `DriveLetter`, `DriveType`, `FileSystem`, `FreeSpace`, `IsReady`, `Path`, `RootFolder`,\
  \ `SerialNumber`, `ShareName`, `TotalSize`, `VolumeName` 方法：此对象不支持任何方法 |\n| `Drives\
  \ Collection` | 为脚本提供驱动器位置信息的访问。属性：`Count`, `Item` 方法：此对象不支持任何方法 |\n| `File` | 为脚本提供文件属性的访问。属性：`Attributes`,\
  \ `DateCreated`, `DateLastAccessed`, `DateLastModified`, `Drive`, `Name`, `ParentFolder`,\
  \ `Path`, `ShortName`, `ShortPath`, `Size`, `Type` 方法：`Copy`, `Delete`, `Move`,\
  \ `OpenAsTextStream` |\n| `Files Collection` | 为脚本提供存储在指定文件夹中的文件的访问。属性：`Count`,\
  \ `Item` 方法：此对象不支持任何方法 |\n| `FileSystemObject` | 为脚本提供对文件系统的访问。属性：`Drives` 方法：`BuildPath`,\
  \ `CopyFile`, `CopyFolder`, `CreateFolder`, `CreateTextFile`, `DeleteFile`, `DeleteFolder`,\
  \ `DriveExists`, `FileExists`, `FolderExists`, `GetAbsolutePathName`, `GetBaseName`,\
  \ `GetDrive`, `GetDriveName`, `GetExtensionName`, `GetFile`, `GetFileName`, `GetFolder`,\
  \ `GetParentFolderName`, `GetSpecialFolder`, `GetTempName`, `MoveFile`, `MoveFolder`,\
  \ `OpenTextFile` |\n| `Folder` | 为脚本提供文件夹属性的访问。属性：`Attributes`, `DateCreated`, `DateLastAccessed`,\
  \ `DateLastModified`, `Drive`, `Files`, `IsRootFolder`, `Name`, `ParentFolder`,\
  \ `Path`, `ShortName`, `ShortPath`, `Size`, `SubFolders`, `Type` 方法：`Copy`, `Delete`,\
  \ `Move`, `OpenAsTextStream` |\n| `Folders Collection` | 为脚本提供位于另一个文件夹内的文件夹的访问。属性：`Count`,\
  \ `Item` 方法：`Add` |\n\n## 属于 VBScript 运行时对象的属性\n\nWSH 提供的 VBScript 运行时对象提供了一系列丰富的属性集合。这些属性提供了有关\
  \ Windows 文件系统以及 Windows 文件和文件夹的信息。表 7.6 包含了运行时属性的完整列表。\n\n## 表 7.6：VBScript 运行时属性\n\
  \n| 属性名称 |ing |\n| --- | --- |\n| `AtEndOfLine` | 根据文件指针是否已到达 `TextStream` 文件的行尾标记返回\
