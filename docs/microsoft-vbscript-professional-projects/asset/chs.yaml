  注释提供了使脚本自文档化的能力，使其更容易供他人支持。你可以使用 `Rem` 语句为 VBScript 添加注释。`Rem` 语句的语法如下所示。\n\n```\n\
  ```\n\n例如，`Rem` 语句可以如下面所示使用。\n```\n Rem The VBScript MsgBox() function displays\
  \ text messages\nMsgBox \"Greetings!\"\n\n或者，你可以像下面所示用单引号（`‘`）字符代替 `Rem` 关键字。\n\n\
  \ ' The VBScript MsgBox() function displays text messages\nMsgBox \"Greetings!\"\
  \n```\n注释也可以添加到 VBScript 语句的末尾。为了使用 `Rem` 语句将注释添加到 VBScript 语句的末尾，你必须先在它前面加一个冒号，如下所示。\n\
  \n```\n```\n\n然而，如果你使用 `‘` 字符代替 `Rem` 关键字，则可以省略冒号，如下面所示。\n```\n MsgBox \"Greetings!\"\
  \   ' The VBScript MsgBox() function displays text messages\n```\n注释的另一个良好用处是创建脚本模板，如下所示。\n\
  \n```\n'Script Name: ScriptName.vbs\n'Author: Author Name\n'Created: mm/dd/yyyy\n\
  '*************************************************************************\n\n'Initialization\
  \ Section\n'Main Processing Section\n\n'Procedure Section\n\n你将看到此模板用于记录书中项目章节出现的所有\
  \ WSH 脚本。模板的第一部分提供了一个记录脚本信息的地方。初始化部分（Initialization Section）将包含全局影响整个脚本的、或定义常量、变量、数组和对象的\
  \ VBScript 语句。主处理部分（Main Processing Section）将包含控制脚本整体执行的 VBScript 语句，过程部分（Procedure\
  \ Section）将用于存储组成脚本的所有过程。\n\n\n```\n <SCRIPT LANGUAGE=\"VBScript\">\n     MsgBox\
  \ \"Greetings!\"\n  ' End VBScript statements -->\n</SCRIPT>\n\n像任何编程语言一样，VBScript\
  \ 需要在执行时能够在内存中存储和检索数据。为了支持这一需求，VBScript 提供了三个定义常量、变量和数组的语句。这些语句见表 2.3 (#LiB0013.html_ch02table03)。\n\
  \n\n| 语句 |  |\n| --- | --- |\n| `Dim` | 定义 VBScript 变量或数组 |\n| `ReDim` | 定义动态 VBScript\
  \ 数组 |\n\n\n常量是指在脚本执行期间不会改变的值。如果脚本有一个在执行期间不需要更改的已知值，它可以存储为常量。π 值就是一个常量示例。常量在 VBScript\
  \ 中有两种不同的使用方式。首先，你可以定义自己的自定义常量。其次，你可以引用内置的 VBScript 运行时常量。\n\n\n\n一旦定义了常量，就无法更改分配给它的值。这可以保护常量并防止其被意外修改。任何更改常量值的尝试都会导致“Illegal\
  \ assignment xxxxxxxx”错误，其中 `xxxxxxxx` 是脚本尝试修改的常量名称。\n## 定义常量\n\n常量使用 `Const` 语句定义，其语法如下：\n\
  ```\n [Public | Private] Const cCONSTANT = expression\n```\n`Public` 和 `Private`\
  \ 是可选关键字。`Public` 使常量在整个脚本中可用。`Private` 将对常量的访问权限限制在定义它的过程中。`cCONSTANT` 是分配给常量的名称，`expression`\
  \ 是要分配的值。\n\n| | 提示 | 考虑对您所有的常量应用命名规范，使它们与代码的其他部分区分开来。在书中，常量使用以下命名规范创建： |\n* 常量名称描述了其内容。\n\
  * 常量名称的首字母以小写字母 `c` 开头。\n* 名称的其余部分全部大写拼写。\n\n以下示例演示了如何定义常量并为其分配一个数值。\n\n Const cTOTAL_VALUE\
  \ = 1000\n```\n\n\n```\n Const cCOMPANY_NAME = \"XYZ Inc.\"\n\n同样，要定义日期，请将值放在一对匹配的井号符号之间，如下所示。\n\
  \n Const cPROJECT_DEADLINE = #03-30-03#\n```\n\n\n```\n Const cTITLEBAR_MSG = \"\
  Data Collection Utility\"\nMsgBox \"Click on OK to post saved data.\", , cTITLEBAR_MSG\n\
  ```\n\n\n![点击展开](img/fig2-4_0.jpg)\n\n\n图 2.5：使用常量代替硬编码数据以使脚本更易维护\n\n\nVBScript\
  \ 为编程人员提供了大量的预定义常量。通过在脚本中对这些常量添加引用，您可以节省时间并简化代码。例如，以下语句使用 `vbOkCancel MsgBox()`\
  \ 常量来显示包含 `OK` 和 `Cancel` 按钮的弹出对话框。\n\n MsgBox \"Do you wish to continue?\", vbOkCancel\n\
  ```\n\n\nVBScript 还提供了大量引用日期和时间的常量集合。表 2.4 显示了这些常量的列表。\n\n\n| 常量 | 值 | 说明 |\n| ---\
  \ | --- | --- |\n| `vbMonday` | 2 | 周一 |\n| `vbTuesday` | 3 | 周二 |\n| `vbWednesday`\
  \ | 4 | 周三 |\n| `vbFriday` | 6 | 周五 |\n| `vbSaturday` | 7 | 周六 |\n| `vbFirstFourDays`\
  \ | 2 | 新年中至少四天的第一个完整周 |\n| `vbFirstJan1` | 1 | 包含 1 月 1 日的一周 |\n| `vbUseSystemDayOfWeek`\
  \ | 0 | 操作系统指定的星期 |\n\n\n```\n TodaysDate = Weekday(Date())\n```\n\n在此示例中，只有当脚本在周一执行时，才会显示弹出对话框。另一个内置常量的例子是\
  \ VBScript 的字符串常量集合，如 表 2.5 所示。\n表 2.5：VBScript 字符串常量\n\n| 常量 | 值 |  |\n| `vbCr`\
  \ | Chr(13) | 执行回车 |\n| `vbCrLf` | Chr(13) | 执行回车和换行符 |\n| `vbFeed` | Chr(10) |\
  \ 执行分页符 |\n| `vbNull` | Null | 设置为空值的变体 |\n| `vbString` | | 包含字符串的变体 |\n| `vbTab`\
  \ | Chr(9) | 执行水平制表符 |\n\n（注：表 2.5 的源文本存在严重损坏/合并行；我已根据标准的 VBScript 常量定义清理了逻辑，同时保持了提供的内容结构)。\n\
  \n\n\n变体（Variants）会识别分配给它们的数据类型并采取相应的行为。然而，你可以对 VBScript 查看待分配给变量的数据的方式进行某些控制。例如，你可以如下所示为变量定义一个数值：\n\
  ```\nintTotalCount = 100\n```\n要为变量分配字符串，请将其包含在匹配的引号内，如下两个示例所示：\n\n```\nAge = \"\
  4\"\n```\n\n\n```\ndtmDateOfBirth = #03/24/99#\n\n你可以使用内置的 VBScript 函数将数据从一种类型转换为另一种类型，如下所示：\n\
  \nvarDateOfBirth = #03/24/99#\nvarDateOfBirth = CStr(varDateOfBirth)\n```\n在此示例中，`varDateOfBirth`\
  \ 存储的值类型从日期转换为字符串。\n\n| | 备注 | VBScript 提供了许多转换函数，包括 `Asc()`、`Cbool()`、`Cbyte()`、`Cbur()`、`Cdate()`、`CDbl()`、`Chr()`、`Cint()`、`CLng()`、`CSng()`\
  \ 和 `CStr()`。有关这些函数的更多信息，请参考第 4 章 中的“过程”。 |\n### 变量命名规则\n\n在为变量命名时，必须遵循许多规则。这些规则包括：\n\
  * 变量在作用域内必须是唯一的。\n* 变量名长度必须小于 256 个字符。\n* 变量名必须以字母开头。\n* 变量名只能由字母、数字和字符 `_` 组成。\n\
  * 变量名不能由 VBScript 保留字。\n\n\n```\nstrUnitColor\nstrunitcolor\n```\n\n\n表 2.7：匈牙利前缀\n\
  \n| --- | --- |\n| `Boolean` | bln |\n| `Byte` | byt |\n| `Date` | dtm |\n| `Double`\
  \ | dbl |\n| `Error` | err |\n| `Long` | lng |\n| `Object` | obj |\n| `Single` |\
  \ sng |\n| `Variant` | var |\n\n以下示例演示了遵循上述约定的变量的使用。\n```\nstrUserName = \"Molly\
  \ Ford\"\nintUnitCount = 100\n\n### 定义变量\n\n\n```\nintTotalCount = intTotalCount\
  \ + 1\n\n动态创建变量被认为是不良的做法。强烈建议使用正式变量声明。正式变量声明使得脚本更易读和维护。VBScript 提供了 `Dim` 语句作为正式定义变量的手段。该语句的语法所示：\n\
  \nDim variablename\n```\n\n\n```\nDim intTotalCount\n```\n\n为了减少定义变量所需的代码行数，VBScript\
  \ 允许你使用单个 `Dim` 语句一次定义多个变量，如下所示：\n```\nDim intTotalCount, intAvgCount, intFinalCount\n\
  ```\n即使你正式定义了所有变量，也始终可能在脚本的某处写错变量名。当这种情况发生时，VBScript 会将写错的变量视为新变量。VBScript 会为其分配内存，为其分配一个空值，并继续运行。\n\
  \n例如，看以下脚本。\n```\nDim intUnitCount\nintUnitCount = 5\nMsgBox intUnitCount\n```\n\
  \n\n```\nOption Explicit\nintUnitCount = 5\nintUnitCount = intUnitCoun + 1\nMsgBox\
  \ intUnitCount\n\n| | 备注 | VBScript 提供了许多转换函数，包括 `Asc()`、`Cbool()`、`Cbyte()`、`Cbur()`、`Cdate()`、`CDbl()`、`Chr()`、`Cint()`、`CLng()`、`CSng()`\
  \ 和 `CStr()`。有关这些函数的更多信息，请参考第 4 章 中的“过程”。 |\n\n\n*变量作用域*指的是脚本中可以引用变量的位置。*生命周期*指的是变量存在的时间。脚本开头定义的任何变量都具有全局作用域，这意味着可以在脚本内的任何位置被访问。此外，它们在脚本执行期间一直存在。\n\
  \n\n### 其他数据来源\n\n\n* `InputBox()` 函数。该函数提供了显示弹出对话框的输入文本框的功能，用户可以使用它为脚本提供输入数据。该函数在第\
  \ 6 章中介绍。\n* 从输入文件读取的数据。第 17 章中的“使用配置文件控制脚本执行”演示了如何从文件收集脚本输入。\n* 作为参数传递给脚本的数据。第\
  \ 7 章中的“VBScript 对象”描述了设置脚本接收运行时参数的过程。\n\n\n\n# 使用运算符操作变量\n\n\n```\nintUnitCount\
  \ = 10\n\n将等号与表 2.8 中列出的 VBScript 算术运算符结合使用，可以用多种方式修改赋值给变量的值。例如，以下脚本定义了一个名为 `intUnitCount`\
  \ 的变量，为其分配了初始值 10，然后多次更改其赋值值。\n\n\n| 运算符 | 描述 |\n| --- | --- |\n| `-` | 减法 |\n|\
  \ `*` | 乘法 |\n| `/` | 除法 |\n| `Mod` | 取模 |\n| `-x` | 反转 x 的符号 |\n| `⁁` | 幂 |\n```\n\
  Dim intUnitCount\nintUnitCount = 9 'intUnitCount = 9\nintUnitCount = intUnitCount\
  \ * 10 'intUnitCount = 100\nintUnitCount = intUnitCount / 2 'intUnitCount = 50\n\
  intUnitCount = intUnitCount / 2 + 1 * 5 'intUnitCount = 30\n```\n\n执行此脚本时，它将显示图\
  \ 2.8 所示所示的结果。\n![](img/fig2-8.jpg)\n\n图 2.8：使用 VBScript 运算符操作赋值给变量的值\n当一个表达式包含多个计算时，VBScript\
  \ 会根据严格的优先级顺序执行计算来解析表达式的值。首先执行幂运算。然后取反，接着是乘法和除法，依此类推。表 2.9 概述了 VBScript 的优先级顺序。\n\
  \n表 2.9：VBScript 优先级顺序\n| 运算符 | 描述 |\n| --- | --- |\n| `-` | 取反 |\n| `*`, `/` |\
  \ 乘法和除法 |\n| `\\` | 整除 |\n| `Mod` | 取模 |\n| 注意：表格开头列出的运算符比表格后面出现的运算符先求值。 |\n\n你可以通过将表达式的部分放在括号内来改变\
  \ VBScript 在解析表达式时的计算顺序。例如，查看以下表达式：\n```\nintUnitCount = 10\nintUnitCount = intUnitCount\
  \ / 2 + 1 * 5\n\n在解析此表达式时，VBScript 首先将 10 除以 2，得到结果 5。接下来，它将 1 乘以 5，得到结果 5。最后，它将\
  \ 5 加 5，得到最终结果 10。现在现在看给表达式添加括号如何改变 VBScript 解析表达式值时产生的结果。\n\nintUnitCount = 10\n\
  intUnitCount = ((intUnitCount / 2) + 1) * 5\n```\n在本例中，VBScript 首先将 10 除以 2，得到 5。然后它在\
  \ 5 上加 1，得到 6。最后它将 5 乘以 6，得到最终结果 30。\n\n## VBScript 保留字\n与所有编程语言一样，VBScript 保留了一组单词，称为保留字，供自身使用。你不允许这些单词作为变量、过程、常量或其他类型或标识符名称。在使用这些单词时，必须按照其文档概述的\
  \ VBScript 预期方式进行应用。VBScript 保留字列表显示在表 2.10 中。\n\n表 2.10：VBScript 保留字\n| `And` |\
  \ `EndIf` | `LSet` | `RSet` |\n| `As` | `Enum` | `Me` | `Select` |\n| `Boolean`\
  \ | `Eqv` | `Mod` | `Set` |\n| `Byte` | `Exit` | `Next` | `Single` |\n| `ByVal`\
  \ | `False` | `Not` | `Static` |\n| `Call` | `For` | `Nothing` | `Stop` |\n| `Class`\
  \ | `Get` | `On` | `Then` |\n| `Const` | `GoTo` | `Option` | `To` |\n| `Currency`\
  \ | `If` | `Optional` | `True` |\n| `Dim` | `Implements` | `ParamArray` | `TypeOf`\
  \ |\n| `Do` | `In` | `Preserve` | `Until` |\n| `Double` | `Integer` | `Private`\
  \ | `Variant` |\n| `Empty` | `Let` | `Long` |\n| `If` | `Like` | `Dim` |\n| `End`\
  \ | `Raise` | `With` |\n| `Else` | `Loop` | |\n| `EndIf` | `While` | `ReDim` |\n\
  \n\n本章回顾了 VBScript 语法并提供了如何操作数据的示例。还讨论了如何识别常量。本章还介绍了使用 `If` 和 `Select Case` 语句设置条件测试。\n\
  \n\n\n\n\n### 表 3.1：VBScript 比较运算符\n\n| --- | --- |\n| `=` | 等于 |\n| `<>` | 不等于\
  \ |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n例如，使用之前的代码示例，你可以修改 `If` 语句来判断\
  \ `intUnitCount` 的值是否小于或等于 `100`，如下所示。\n\n```\n  MsgBox \"Time to place a new inventory\
  \ order\"\n  strOrderStatus = \"In Progress\"\nEnd If\n\n#### If 语句的替代形式\n\n\n```\n\
  \ If intUnitCount < 100 Then\n  strOrderStatus = \"In Progress\"\nElse\n  MsgBox\
  \ \"Current inventory levels are within specified limits\"\n```\n\n你可以修改上面的示例，以便在之前的比较证明为假时适应替代测试。这是通过添加\
  \ `ElseIf` 关键字实现的，如下：\n```\n If intUnitCount < 100 Then\n  MsgBox \"Time to place\
  \ a new inventory order\"\nElseIf intUnitCount < 150 Then\n  MsgBox \"Inventory\
  \ levels are within acceptable limits\"\n  strOrderStatus = \"Not in Process\"\n\
  \  MsgBox \"Current inventory levels are at maximum\"\n  strOrderStatus = \"Not\
  \ in process\"\nEnd If\n\n#### 嵌套多个 If 语句\n\n\n```\n If intUnitCount < 100 Then\n\
  \    MsgBox \"Wait until Monday to place a new inventory order\"\n  Else\n    MsgBox\
  \ \"Time to place a new inventory order\"\nElse\n  MsgBox \"Current inventory levels\
  \ are within specified limits\"\nEnd If\n\n嵌套 `If` 语句的层数没有限制。但从实际角度来看，深度超过几层对于大多数人来说会变得困惑。\n\
  \n\n`If` 语句提供了一种测试两个表达式值的有效机制。然而，在需要将单个表达式与多个可能的匹配表达式进行比较的情况下，VBScript 提供了使用 `Select\
  \ Case` 语句的选项。\n\n\n```\n Select Case testexpression\n    liststatements\n     \
  \ .\n      .\n  Case Else\n    elsestatements\n  End Select\n\n`testexpression`\
  \ 是将与一个或多个 `Case` 语句指定的其他表达式进行比较的表达式。`liststatements` 代表一个或多个 VBScript 语句，当 `Case`\
  \ 语句指定的表达式之一等于 `testexpression` 的值时，这些语句将被执行。`elsestatements` 是当 `Case` 语句指定的任何表达式都不等于\
  \ `testexpression` 时，将执行的 VBScript 语句。\n\n\n```\n Select Case Weekday(date())\n\
  \    MsgBox \"Today is Sunday\"\n  Case vbMonday\n    MsgBox \"Today is Monday\"\
  \n    MsgBox \"Today is Tuesday\"\n  Case vbWednesday\n    MsgBox \"Today is Wednesday\"\
  \n    MsgBox \"Today is Thursday\"\n  Case vbFriday\n    MsgBox \"Today is Friday\"\
  \n    MsgBox \"Today is Saturday\"\nEnd Select\n```\n在这个示例中，使用了 VBScript `Date()`\
  \ 函数来获取当前系统日期。然后将其传递给 VBScript `Weekday()` 函数，该函数返回一个代表星期几的值。然后将结果的值与 `Case` 语句指定的七个\
  \ VBScript 日期常量进行比较，每个常量代表不同的星期，以确定执行哪个 `MsgBox()` 语句。\n\n#### 使用循环\nVBScript 提供了许多语句，允许你在脚本中建立循环。循环提供了使用最少量的编程语句高效处理大量数据的能力。这些语句列举如下。\n\
  \n* `Do...While`: 设置一个只要指定条件保持为真就会迭代的循环\n* `For...Next`: 设置一个按指定次数迭代的循环\n* `While...Wend`:\
  \ 设置一个只要指定条件保持为真就会迭代的循环\n* `For Each...Next`: 设置一个遍历对象属性列表的循环\n#### Do...While\n\
  \n`Do...While` 语句在指定条件保持为真时重复执行一组语句。VBScript 提供了两种不同的 `Do...While` 语句形式。在第一种形式中，`Do...While`\
  \ 循环仅在测试条件初始为真时开始处理。其语法所示。\n```\n Do While condition\n  statements\n```\n\n`condition`\
  \ 是要测试的表达式，`statements` 代表循环每次迭代时执行的一个或多个 VBScript 语句。例如，以下语句创建了一个直到 `intCounter`\
  \ 等于 5 的循环。\n```\n strMessageString = \"Watch me count!\" & vbCrLf & vbCrLf\nintCounter\
  \ = 0\n  intCounter = intCounter + 1\n  strMessageString = strMessageString & intCounter\
  \ & \" \"\nLoop\n```\n\n在这个示例中，当 `intCounter`（初始值为 0）小于 10 时，循环执行。循环每次迭代，它会将 `intCounter`\
  \ 的值加 1，并将 `intCounter` 的值添加到字符串的末尾。当循环最终终止时，脚本显示如图 3.1 所示的消息字符串。\n图 3.1：使用 `Do...While`\
  \ 循环演示如何数到 10\n\n由于 `While` 关键字被放在循环的开头，循环仅在测试条件初始为真时才执行。`Do...While` 语句的第二形式将 `While`\
  \ 关键字移动到循环的末尾，强制循环处理一次，无论其测试的条件初始是否为真。这种形式的 `Do...While` 语句的语法列如下。\n```\n Do\n \
  \ statements\n```\n\n下面的示例显示了一个小型 VBScript，它使用 `Do...While` 循环的第二形式从用户收集收集。在本例中，脚本提示用户输入名称、部件编号以及要包含在补货报告中的产品数量。数据收集通过\
  \ VBScript `InputBox()` 函数实现。\n\n\n\n|  | 注意 | `InputBox()` 函数在弹出对话框中显示消息并收集用户输入，然后可以使用你的脚本对其进行验证和处理。关于\
  \ `InputBox()` 的更多信息，包括其语法和用法，请参阅第 6 章，“数据收集、通知和错误报告](#LiB0035_split_000.html_239)”。\
  \ |\n\n```vb\n'Script Name: Script 3.1.vbs\n'Author: Jerry Ford\n'Created: 01/04/2003\n\
  '*************************************************************************\n\n'初始化部分\n\
  Const cTITLEBARMSG = \"Inventory Order Report\"\n\nDim intCounter, strInventoryOrder,\
  \ intPartNumber, intQuantity, strInvReport\nintCounter = 0\n\n'主处理部分\nDo\n\n  intCounter\
  \ = intCounter + 1\n  strInventoryOrder = InputBox(\"Please type the name of the\
  \ product to be \" & _\n    \"ordered or type {Quit} when done.\", cTITLEBARMSG)\n\
  \n\n    MsgBox \"Either type a product to be ordered or type Quit\", ,cTITLEBARMSG\n\
  \  Else\n  If UCase(strInventoryOrder) <> \"QUIT\" Then\n      intPartNumber = InputBox(\"\
  Please type the part number for \" & _\n        strInventoryOrder, cTITLEBARMSG)\n\
  \        \" should be ordered?\", cTITLEBARMSG)\n      strInvReport= strInvReport\
  \ & intCounter & \". \" & \"Item: \" & _\n        strInventoryOrder &\n     End\
  \ If\n\n  End If\n\nIf Len(strInvReport) > 0 Then\n  MsgBox strInvReport, ,cTITLEBARMSG\n\
  ```\n\n每次循环时，名为 `intCounter` 的变量都会加 1。该变量用于跟踪循环迭代的次数。它在脚本后部分也被使用，通过为列表中的每个项目分配一个数字来帮助组织订购列表。\n\
  该脚本执行的第一件事是要求用户输入产品名称或输入 `Quit` 来退出脚本。它将用户的响应存储在名为 `strInventoryOrder` 的变量中。接下来，脚本检查\
  \ `strInventoryOrder` 的长度是否等于 0。如果是，说明用户点击了“取消”按钮或点击了“确定”按钮但没有输入产品名称。在这种情况下，脚本会在弹出对话框中显示说明，告知用户如何正确使用该脚本。\n\
  \n如果 `strInventoryOrder` 的长度不等于 0，脚本将检查用户是否输入了单词 `Quit`。脚本使用 VBScript 的 `Ucase()`\
  \ 函数将用户的输入转换为全大写，以消除大小写带来的混义，然后使用 `If` 语句检查用户是否输入了 `Quit`。如果用户输入了 `Quit`，则 `Do...While`\
  \ 循环终止。随后是另一个 `If` 语句，用于检查包含订购报告的显示字符串的长度。如果该字符串的长度为 0，则用户输入了 `Quit` 但从未输入过任何数据，因此没有可显示的内容。否则，用户输入的数据将在弹出对话框中显示。\n\
  如果用户没有输入 `Quit`，则通过另外两个 `Input-Box()` 语句（如图 3.2 所示。此脚本相对简单，只执行了有限的验证。然而，它展示了 `Do...While`\
  \ 循环提供的强大功能以及 VBScript 收集和处理用户输入的能力。\n\n![点击展开](img/fig3-2_0.jpg)\n图 3.2：使用 `Do...While`\
  \ 循环收集并处理用户输入\n\n![点击展开](img/fig3-3_0.jpg)\n图 3.3：脚本产生的输出示例\n\n### Do…Until\n与 `Do...While`\
  \ 语句（只要条件为真就执行）不同，`Do...Until` 语句直到条件变为真为止执行。与 `Do...While` 语句一样，`Do...Until` 语句支持两种形式。在第一种形式中，`Until`\
  \ 关键字放在循环的开头。此版本的 `Do...Until` 循环语法所示：\n\n```\n  statements\nLoop\n```\n`condition`\
  \ 代表要测试的表达式；`statements` 代表在每次迭代期间将执行的语句。接下来的示例展示了此版本 `Do...Until` 循环的运行情况。\n\n\
  ```vb\n\nintCounter = 0\nstrInvReport = \"\"\nDo Until intCounter = 5\n\n  strInventoryOrder\
  \ = InputBox(\"Please enter the name of a contact.\")\n  If Len(strInventoryOrder)\
  \ = 0 Then\n    Exit Do\n  End If\n  intCounter = intCounter + 1\n\n  strInvReport\
  \ = strInvReport & intCounter & \". \" & strInventoryOrder & vbCrLf\nLoop\n\nIf\
  \ Len(strInvReport) > 0 Then\nEnd If\n```\n\n\n`Do...Until` 语句的第二形式将 `Until` 关键字移到循环末尾。此形式的语法所示：\n\
  \n Do\n  statements\nLoop Until condition\n\n`condition` 代表要测试的表达式，`statements`\
  \ 代表每次迭代期间执行的语句。由于 `Until` 关键字现在位于循环末尾，程序员可以确保循环至少执行一次。\n\n\n`For...Next` 循环用于设置执行指定次数的循环。`For...Next`\
  \ 语句的语法所示：\n\n For counter = begin To end [StepValue]\n   statements\nNext [counter]\n\
  \n`counter` 是循环用于跟踪迭代次数的变量，`statements` 代表每次迭代期间执行的语句。`begin` 指定 `counter` 的起始值。`end`\
  \ 指定其结束值。`StepValue` 指定在每次迭代时 `counter` 递增的值。\n\n\n```vb\n Dim intCounter, strInvReport,\
  \ strInventoryOrder\nintCounter = 0\nstrInvReport = \"\"\n\n\n  strInventoryOrder\
  \ = InputBox(\"Please enter the name of a contact.\")\n\n    Exit For\n  End If\n\
  \nNext\n\nIf Len(strInvReport) > 0 Then\nEnd If\n```\n\n\n```vb\n For intCounter\
  \ = 1 To 20\n\n\n\n\n使用可选的 `Step` 关键字，你可以更改 `For`…Next` 循环在每次迭代时使用的递增值。例如，以下语句创建了一个起始值为\
  \ 1 结束值为 9 的 `For`…Next` 循环。\n\n Dim intCounter\nFor intCounter = 1 To 20 Step 3\n\
  \  WScript.Echo intCounter\n```\n\n当此脚本保存为具有 `.VBS` 扩展名的文件并使用 `Script.exe` 执行主机运行时，它将显示以下输出。\n\
  ```\n C:\\>cscript \"Script 3.2.vbs\"\nMicrosoft (R) Windows Script Host Version\
  \ 5.6\n\n1\n4\n10\n13\n16\n\nC:\\>\n```\n## While…Wend\n\n`While`…Wend` 语句用于创建一个只要条件保持为真就一直执行的循环。该语句的语法如下所示。\n\
  ```\n While condition\n  statements\n```\n\n`condition` 是正在被测试的表达式，`statements`\
  \ 代表在循环每次迭代期间执行的 VBScript 语句。`While`…Wend` 语句是为了兼容而提供的，不建议继续使用。它的功能被 `Do`…`While`\
  \ 和 `Do`…`Until` 语句重复，后者在应用上更加灵活。\n例如，以下 HTML 页面包含一个 VBScript，使用 `While`…Wend` 循环构建一个从\
  \ 1 计数到 10 的字符串，如图 3.4 所示。\n\n![点击展开](img/fig3-4_0.jpg)\n图 3.4：在 HTML 页面嵌入 VBScript\
  \ 使用 `While`…Wend` 循环\n\n```\n  <HEAD>\n    <TITLE>Script 3.3 - A While...Wend example</TITLE>\n\
  \  </HEAD>\n    <SCRIPT LANGUAGE=\"VBScript\">\n\n      Dim intCounter, strDisplayString\n\
  \      intCounter = 1\n\n      strDisplayString = \"Watch me count to 10\" & vbCrLf\
  \ & vbCrLf\n      While intCounter <= 10\n        strDisplayString = strDisplayString\
  \ & intCounter & vbCrLf\n        intCounter = intCounter + 1\n\n      alert strDisplayString\n\
  \n  </BODY>\n</HTML>\n```\n#### For Each…Next\n\n`For Each`…Next` 循环提供了程序化遍历属于对象的所有属性或存储在数组中的所有元素的能力。`For\
  \ Each`…Next` 循环的语法如下所示。\n```\n For Each element In collection\n  statements\n```\n\
  \n`element` 是代表对象属性或数组存储元素的变量。`collection` 是对象或数组的名称。`statements` 代表在循环每次迭代期间执行的\
  \ VBScript 语句。\n例如，使用 `For Each`…Next` 循环，你可以编写一个 WSH VBScript，它可以处理任何 Windows 文件夹的文件内容，如下文所示。\n\
  \n```\n'Script Name: Script 3.4.vbs\n'Author: Jerry Ford\n'Created: 01/04/2003\n\
  'loop to process all the files stored in a folder\n'*************************************************************************\n\
  \n\nOption Explicit\n\nDim strFileList, intCounter\n\nSet FsoObject = CreateObject(\"\
  Scripting.FileSystemObject\")\n\nintCounter = 0\n\n\nFor Each Member in FolderName.Files\n\
  \  intCounter = intCounter + 1\nNext\n\nMsgBox strFileList, ,\"List of files in\
  \ \" & FolderName\n\n为了完成此脚本，必须使用 VBScript `FileSystemObject`。该对象是一个 VBScript 运行时对象，直到书中第\
  \ 17 章“[使用配置文件控制脚本执行”中才会正式介绍。因此，这里仅提供最简要的解释。\n\n\n![点击展开](img/fig3-5_0.jpg)\n\n\
  ```\n\n\n\n在本章中，你将看到如何使用 VBScript 程序来提高脚本的整体组织结构和管理性。你将学习 VBScript 支持的两种过程：子程序（subroutines）和函数（functions）。本章将介绍如何使用过程通过定义局部变量和全局变量来控制变量范围。你还将学习如何创建响应浏览器事件的事件处理程序，并检查\
  \ VBScript 可以响应的浏览器事件类型。最后，你将查看 VBScript 完整的内置函数集合。\n\n\nVBScript 程序提供了 VBScript\
  \ 组织的基础构建模块。过程允许你创建模块化的脚本，将语句组织成逻辑组，并作为一个单元执行。VBScript 支持两种不同类型的过程：\n\n- `Subroutine`（子程序）：一种不向其调用语句返回结果的过程。\n\
  \n过程有两个主要优点：首先，它们提供了一种将 VBScript 组织成更易管理格式的方法。其次，过程允许你创建可复代码并减小脚本的整体体积。\n### 增强脚本维护\n\
  \n过程允许你通过将相关语句分组在一起并作为一个单元执行，从而创建更易维护的脚本。因此，作为一个通用规则，你应该将过程作为 VBScript 的主要组织结构。通过使用\
  \ VBScript 开发模块化代码，你可以使脚本更易读、更容易维护。例如，通过将相关语句分组到一个过程中，你使它们更容易被找到。你还使脚本更容易更新，允许对单个模块或过程进行更新，而无需对脚本的其他部分进行重大更改。\n\
  通过使脚本更易管理，过程允许你增加复杂性，而不一定会增加你工作或维护的难度。正如第 2 章中所示，“错误、常量和变量”，在开发使用 WSH 运行的脚本时，考虑开发一个类似于以下示例的\
  \ VBScript 模板。\n\n```\n'Script Name: ScriptName.vbs\n'Author: Author Name\n'Created:\
  \ mm/dd/yyyy\n'*************************************************************************\n\
  \n'初始化部分\n'主处理部分\n\n'过程部分\n\n使用此模板，你会将所有子程序和函数放在“过程部分”。这通过为存储和查找过程提供一个可预见的位置，为你的脚本提供了一致的组织结构。重要的一点是将你的过程放在一起，你可以在\
  \ VBScript 中轻松地找到它们。大多数 VBScript 程序员选择将子程序和过程存储在脚本的末尾。\n\n\n### 可复用代码\n\n\n过程还使脚本维护变得更容易，因为你只需要修改位于一个过程中的代码，而不需要对脚本中可能重复的代码反复进行相同的更改。\n\
  \n\n子程序和函数在 VBScript 中承担着几乎相同的角色。它们都提供了分组和执行相关语句集合的方法。它们都提供了限制变量范围的方法，这将在本章稍后部分讨论。它们甚至共享相似的语法。它们的不同在于将数据返回给调用它们的语句的能力。函数提供了这种能力，而子程序则不能向其调用语句返回结果。\n\
  \n\n子程序用于执行语句集合，而不向调用语句返回结果。一旦执行，子程序会将处理控制权返回给其调用语句之后的语句。\n\n\n```\n [Public | Private]\
  \ Sub name [(arglist)]\nEnd Sub\n```\n\n\n要调用子程序，你按以下格式输入其名称：\n\n SubroutineName()\n\
  ```\n\n\n```\n SubroutineName(arg1, arg2, arg3, ... argn)\n\n例如，以下 VBScript 语句定义了一个名为\
  \ `AboutRoutine()` 的子程序。\n\n Sub AboutRoutine()\n  MsgBox \"UserAcctMgr.vbs\" &\
  \ vbCrLf & vbCrLf & _\n         \"Copyright © Jerry Ford 2003\" & vbCrLf & vbCrLf\
  \ & _\n         \"jf04@yahoo.com\", ,\"About Script\"\nEnd Sub\n```\n该子程序可能作为大脚本的一部分提供关于脚本的信息。调用时，`AboutRoutine()`\
  \ 使用 `MsgBox()` 函数显示信息。该子程序没有设计为接受任何参数，可以使用以下语句从脚本的任何地方调用。\n\n```\n```\n\n执行时，该子程序将显示图\
  \ 4.1 所示的对话框。\n![点击展开](img/fig4-1_0.jpg)\n\n图 4.1：使用子程序显示脚本信息\n下面的示例演示了如何定义一个在执行时接收并处理一个参数的子程序。\n\
  \n```\n  MsgBox strMsgText, , \"VBS Sub Demo\"\n End Sub\n```\n该子程序可以添加到任何 VBScript\
  \ 中提供通用的消息显示过程。它接受单个参数，在本例中，该参数是调用语句传递给它的文本字符串。例如，可以使用以下语句执行 `DisplayMsg()` 子程序，结果显示图\
  \ 4.2 所示的对话框。\n\n![点击展开](img/fig4-2_0.jpg)\n图 4.2：使用通用消息显示过程查看消息\n\n```\n```\n\n\
  ### 函数\n函数与子程序相似，不同之处它们还提供了向其调用语句返回结果的能力。函数的语法概述如下。\n\n\n\n\n```\n  语句\nEnd Function\n\
  ```\n`Public` 和 `Private` 是可选关键字。`Public` 关键字指定该函数可以被脚本中的其他过程调用。`Private` 关键字指定该函数无法被脚本中的其他过程调用。`Name`\
  \ 是分配给函数的名称，且在脚本中必须是唯一的。`Arglist` 是一个由逗号分隔的参数列表，在调用函数时可以传递给函数。\n\n例如，下面的函数表示了对之前一个子程序的重写，该子程序在弹出对话框中显示关于脚本的信息。\n\
  ```\n Function AboutRoutine()\n  MsgBox \"UserAcctMgr.vbs\" & vbCrLf & vbCrLf &\
  \ _\n         \"For more information about UserAcctMgr.vbs please contact \" & _\n\
  \         \"jlf04@yahoo.com\", ,\"About Sample Script\"\nEnd Function\n\n在定义该脚本的任何地方，都可以以下语句调用此函数：\n\
  \n AboutRoutine()\n```\n\n\n```\n Function GetFileName()\nEnd Function\n```\n\n\n\
  ```\n strFileName = GetFileName()\n\n在此例中，函数返回的文件名被赋值给变量名 `strFileName`。调用该函数的另一种方法是在\
  \ VBScript 语句中包含它的引用，如下所示：\n\n MsgBox \"Click on OK to delete \" & GetFileName()\n\
  ```\n\n\n函数还可以接受运行时传递给它们的参数，如下文所示。\n\n Function DisplayMsg(strMsgText)\n  MsgBox\
  \ strMsgText, , \"VBScript Subroutine Demo\"\nEnd Function\n\n## 控制变量作用域\n\n\n通过将变量值局部化，你消除了意外修改创建过程之外变量的可能性。作为一种编程技术，通常倾向于尽可能地局部化变量。下面的示例演示了局部变量和全局变量之间的区别。\n\
  \n '*************************************************************************\n\
  'Script Name: Script 4.1.vbs\n'Author: Jerry Ford\n'Description: This script demonstrates\
  \ global and local variable scopes\n'*************************************************************************\n\
  \nOption Explicit\nDim X, Y\n\nX = 10\nGetNewNumber()\nMsgBox \"X = \" & X & \"\
  \ Y = \" & Y\n'Procedure Section\nFunction GetNewNumber()\n  Dim Y\nEnd Function\n\
  ```\n\n\n图 4.3 显示了当 WSH 执行此脚本时产生的输出。\n\n\n图 4.3：VBScript 过程内外的变量作用域演示。\n\n\n在客户端\
  \ Web 页面开发的背景下，VBScript 过程在构建响应浏览器事件的事件处理器方面起着特殊作用。这为 Web 页面增加了交互性，并允许在客户端计算机上执行前端处理*事件*是浏览器内动作的发生。例如，对图像、按钮或链接的鼠标点击代表点击事件。事件的其他示例包括双击\
  \ Web 页面对象、在表单元素中输入文本、在对象上移动指针。浏览器事件还发生在 页面加载或卸载时。\n\n\n通过定义函数和子程序并存储在 HTML 页面的头部，你可以创建一个与\
  \ Web 页面上任何对象的事件处理器库。\n\n\n表 4.1 提供了你可以定义事件处理器的浏览器事件列表。表 4.1 还提供了与每个事件关联的事件处理器名称以及事件和事件处理器的描述。你可以看到，事件处理器是通过在其关联的事件名称加上\
  \ *on* 来命名的。\n\n\n| 属性 | 事件处理器 | 描述 |\n| --- | --- | --- |\n| `Blur` | `onBlur`\
  \ | 当前对象失去焦点时执行 |\n| `Change` | `onChange` | 用户更改对象时执行 |\n| `Click` | `onClick`\
  \ | 用户点击对象时执行 |\n| `DragDrop` | `onDragDrop` | 用户将对象拖放到框架或窗口上时执行 |\n| `Error` |\
  \ `onError` | HTML 页面发生错误时执行 |\n| `Focus` | `onFocus` | 用户选择对象时执行 |\n| `KeyPress`\
  \ | `onKeyPress` | 用户按下并释放按键时执行 |\n| `KeyUp` | `onKeyUp` | 用户释放按键时执行 |\n| `Load`\
  \ | `onLoad` | HTML 页面或图像加载完成时执行 |\n| `MouseMove` | `onMouseMove` | 用户移动指针时执行 |\n\
  \n\n\n\n| `MouseOut` | `onMouseOut` | 当访问者将指针移出对象时执行 |\n| `MouseUp` | `onMouseUp`\
  \ | 当访问者释放鼠标按钮时执行 |\n| `MouseWheel` | `onMouseWheel` | 当滚动鼠标轮时执行 |\n| `Move` | `onMove`\
  \ | 当访问者移动框架或窗口时执行 |\n| `Resize` | `onResize` | 当访问者调整框架或窗口大时执行 |\n| `Select` |\
  \ `onSelect` | 当访问者选择表单选择菜单的内容时执行 |\n| `Submit` | `onSubmit` | 当访问者点击提交按钮时执行 |\n\
  \n### 设置事件处理器\n\n\n```\n <BODY onLoad=\"window.alert('Greetings')\">\n\n在例例中，当浏览器加载\
  \ HTML 页面时，`onLoad` 事件会自动触发，并显示弹出窗口消息。虽然这种方法对于执行需要极少代码的任务很方便，但它具有局限性。VBScript 提供的另一种选项是设置事件处理器，如下所示。\n\
  \n <SCRIPT FOR=\"SubmitButton\" EVENT=\"onClick\" LANGUAGE=\"VBScript\">\n  window.alert\
  \ \"Thank you for shopping with us today.\"\n</SCRIPT>\n\n第三种也是最常用的选项是定义事件处理器，这些处理器调用存储在\
  \ HTML 页面 HEAD 部分内 VBScript 中的过程，如下所示。\n\n Sub SubmitButton_onMouseOver\n  window.status\
  \ = \"Click here to submit your request.\"\nEnd Sub\n\n当与事件处理器配合使用，过程名称是通过组合对象名称和相应事件处理器的名称创建的。例如，当指针移动到\
  \ HTML 页面上名为 `SubmitButton` 的表单按钮时，之前的子程序会被自动触发。执行时，它会在位于浏览器底部的状态栏中显示文本消息。\n\n\n\
  ```\n <HTML>\n  <HEAD>\n    <TITLE>Script 4.2 - onLoad event handler example</TITLE>\n\
  \n    <!-- Start hiding VBScript statements\n      Function ShowGreetingMsg()\n\
  \        MsgBox(\"Greetings and thanks for visiting us today.\")\n    ' End hiding\
  \ VBScript statements -->\n    </SCRIPT>\n\n  <BODY onLoad=ShowGreetingMsg()>\n\
  \    onLoad event handler example\n  </BODY>\n</HTML>\n```\n\n\n![点击展开](img/fig4-4_0.jpg)\n\
  \n\n事件处理器的另一个流行用途是创建动画悬停效果，当指针移到对象或移出对象时，以某种方式更改链接、图像或对象的显示。悬停效果可以使用下方列出的 `onMouseOver`\
  \ 和 `onMouseOut` 事件创建。\n\n- `onMouseOut`: 每当指针移出对象时触发\n\n例如，下面的脚本演示了如何设置一个带有两个悬停链接的\
  \ HTML 页面。一个用于 Premier Press 网站，另一个用于微软（Microsoft）网站。\n```\n <HTML>\n  <HEAD>\n\n\
  \    <SCRIPT LANGUAGE=\"VBScript\">\n    <!-- Start hiding VBScript statements\n\
  \      Function Premier_onMouseOver\n        Premier.style.color=\"red\"\n     \
  \ End Function\n      Function Premier_onMouseOut\n        Premier.style.color=\"\
  blue\"\n      End Function\n      Function Microsoft_onMouseOver\n        Microsoft.style.color=\"\
  red\"\n      End Function\n      Function Microsoft_onMouseOut\n        Microsoft.style.color=\"\
  blue\"\n      End Function\n    ' End hiding VBScript statements -->\n    </SCRIPT>\n\
  \  </HEAD>\n  <BODY>\n    <A HREF=\"http://www.premierpressbooks.com\" NAME=\"Premier\"\
  > Premier</A><P>\n<A HREF=\"http://www.microsoft.com\" NAME=\"Microsoft\"> Microsoft</A><P>\n\
  </HTML>\n```\n\n\n![点击展开](img/fig4-5_0.jpg)\n\n\n### 内置函数\n\n\n表 4.2：VBScript 函数\n\
  \n| --- | --- |\n| `Abs` | 返回数的绝对值 |\n| `Array` | 根据提供的参数列表返回数组 |\n| `Atn` | 逆三角函数，返回参数的反正切值\
