  \ Word 版本\n\n## 总结\n\n在本章中，你学习了如何开发一个 VBScript，来处理从支持 Intuit 订单/库存系统的两台 Windows\
  \ 2000 服务器收集的摘要报告。你还学习了如何使用 Word 对象模型来开发汇总报告的 Word 版本。此外，你还学习了如何使用 `Net Send` 命令创建网络通知进程。\n\
  \n# 第 25 章：归档管理\n\n在本章中，你将复制并修改在第 20 章中开发的“维护 30 天摘要日志存档”归档管理脚本，以便开发一个新的脚本，在位于运营指挥中心的\
  \ Windows 2000 专业工作站上维护三个月的报告归档。此新脚本将由在第 23 章中开发的“收集远程摘要报告”调度脚本每月执行一次。\n\n## 管理报告文件\n\
  \nMolly 作为项目的一部分开发的最后一个脚本是归档管理脚本。它将在每月第一天按计划执行。它的任务是按照列表所示，在 Windows 2000 专业工作站上维护三个独立的为期三个月的归档。\n\
  \n* `D:\\Order_Inventory\\Sr1_SummaryRpts`。此文件夹将存储由 SERV0001 Windows 2000 服务器创建的至少\
  \ 90 天的摘要报告。\n* `D:\\Order_Inventory\\Sr2_SummaryRpts`。此文件夹将存储由 SERV0002 Windows\
  \ 2000 服务器创建的至少 90 天的摘要报告。\n* `D:\\Order_Inventory\\ConsolidatedRpts`。此文件夹将存储根据从\
  \ SERV0001 和 SERV0002 复制过来的摘要报告中提取的信息创建的至少 90 天的汇总报告。\n\n图 25.1 显示了 Windows 2000\
  \ 专业工作站上 `d:\\Order_Inventory` 文件夹的内容。`LogFiles` 文件夹用于临时存储报告检索脚本复制的摘要报告文件。报告汇总脚本随后读取\
  \ `LogFiles` 文件夹中的摘要报告以创建汇总报告，这些报告存储在 `ConsolidatedRpts` 文件夹中。当归档管理脚本执行时，它会将 `LogFiles`\
  \ 文件夹中的文件复制到到 `Sr1_SummaryRpts` 或 `Sr2_SummaryRpts` 文件夹。最后，归档管理脚本将删除 `ConsolidatedRpts`、`Sr1_SummaryRpts`\
  \ 或 `Sr2_SummaryRpts` 文件夹中任何超过三个月的报告。\n\n![点击展开](img/fig25-1_0.jpg)\n\n图 25.1：检查用于在\
  \ Windows 2000 专业工作站上管理和存储报告的文件夹结构\n\n## 处理 Windows 文件夹和文件\n\n为了执行归档管理任务，Molly 需要再次使用\
  \ `FileSystemObject` 对象的 `DeleteFile()` 方法。该方法的语法在第 20 章提供。此外，她还需要学习如何使用属于 `FileSystemObject`\
  \ 的许多其他方法。这些方法包括：\n\n* `FolderExists()`。提供确定文件夹是否存在的能力。\n* `CreateFolder()`。提供创建新文件夹的能力。\n\
  * `MoveFile()`。提供将一个或多个文件移动到指定文件夹的能力。\n\n### 判断文件夹是否存在\n\n在开发脚本时，Molly 需要在尝试访问其内容或向其中存储文件之前确定某些文件夹是否存在。为了进行此测试，她计划使用\
  \ `FileSystemObject` 对象的 `FolderExists()` 方法，该方法根据指定文件夹是否存在返回 `True` 或 `False` 布尔值。`FolderExists()`\
  \ 方法的语法如下所示。\n\n```\nObjectReference.FolderExists(FolderName)\n```\n\n`ObjectReference`\
  \ 是代表 `FileSystemObject` 对象实例的变量。`FolderName` 指定要测试的文件夹的完整路径和名称。\n\n以下 VBScript\
  \ 语句演示了如何确定 `d:\\Order_Inventory\\LogFiles` 文件夹是否存在。\n\n```\nDim FsoObj\nSet FsoObj\
  \ = CreateObject(\"Scripting.FileSystemObject\")\n\nIf (FsoObj.FolderExists(d:\\\
  Order_Inventory\\LogFiles) = False) Then\n  MsgBox \"指定的文件夹不存在。\"\nElse\n  MsgBox\
  \ \"指定的文件夹存在。\"\nEnd If\n```\n\n根据结果，脚本可能会执行任何操作，包括：\n* 如果文件夹不存在则创建它\n* 在文件夹中保存文件\n\
  * 将文件移动到文件夹\n* 删除文件夹\n* 检查内容\n\n### 创建文件夹\n\n在归档管理脚本首次运行时，`Sr1_SummaryRpts` 和 `Sr2_SummaryRpts`\
  \ 文件夹不存在。Molly 决定让归档管理脚本执行任务，而不是手动创建这些文件夹。为了自动化此任务，她需要使用 `FileSystemObject` 对象的\
  \ `CreateFolder()` 方法。该方法的概述如下。\n\n```\nObjectReference.CreateFolder(FolderName)\n\
  ```\n\n`ObjectReference` 是代表 `FileSystemObject` 对象实例的变量。`FolderName` 指定要创建的文件夹名称。\n\
  \n> 在尝试创建文件夹之前，始终使用 `FileSystemObject` 对象的 `FolderExists()` 方法确定文件夹不存在。否则会导致错误。\n\
  \n创建文件夹是一个简单的任务。首先，你必须实例化 `FileSystemObject`。然后你可以使用 `FolderExists()` 方法确保文件夹不存在，最后如示例所示使用\
  \ `CreateFolder()` 方法。\n\n```\nDim FsoObj, strWorkingFolder\nSet FsoObj = CreateObject(\"\
  Scripting.FileSystemObject\")\n\nIf (FsoObj.FolderExists(\"d:\\Order_Inventory\\\
  Sr1_SummaryRpts \") = False) Then\n  Set strWorkingFolder = _\n    FsoObj.CreateFolder(\"\
  d:\\Order_Inventory\\Sr1_SummaryRpts \")\nEnd If\n```\n\n在此示例中，如果 `Sr1_SummaryRpts`\
  \ 文件夹不存在，脚本将在 `D:\\Order_Inventory` 中创建一个名为 `Sr1_SummaryRpts` 的文件夹。\n\n> 你无法使用 `CreateFolder()`\
  \ 方法初始化现有文件夹。如果你尝试这样做将会收到错误。但是你可以使用 `DeleteFolder()` 方法删除文件夹，然后使用 `CreateFolder()`\
  \ 方法重新创建它。\n\n### 在临时和归档文件夹之间移动文件\n\n归档管理脚本需要能够将文件从 `Log Files` 文件夹移动到 `Sr1_SummaryRpts`\
  \ 和 `Sr2_SummaryRpts` 归档文件夹。为了执行此任务，Molly 需要使用 `FileSystemObject` 对象的 `MoveFile()`\
  \ 方法。该方法的语法如下：\n\n```\nObjectReference.MoveFile (Source, Target )\n```\n\n`ObjectReference`\
  \ 是代表 `FileSystemObject` 对象实例的变量。`Source` 指定要移动的文件的位置，`Target` 指定要存储这些文件的目标文件夹。\n\
  \n\n\n\n\n| | 提示 | 作为 `FileSystemObject` 对象的 `MoveFile()` 方法的替代，你可以使用 `File` 对象的\
  \ `Move()` 方法。然而，此方法一次只处理一个文件，因此为了使用它，你必须设置一个循环来处理 `LogFiles` 文件夹中的所有文件。 |\n\n下述\
  \ VBScript 语句演示了如何使用 `MoveFile()` 方法将位于 `d:\\Order_Inventory\\Log Files` 文件夹的所有文本文件移动到\
  \ `d:\\Order_Inventory\\Sr1_SummaryRpts` 文件夹。\n\n```\n Dim FsoObj\nSet FsoObj =\
  \ CreateObject(\"Scripting.FileSystemObject\")\n\nSet FsoObj = CreateObject(\"Scripting.FileSystemObject\"\
  )\nFsoObj.MoveFile \"d:\\Order_Inventory\\ LogFiles\\*.txt\", _\n  \"d:\\Order_Inventory\\\
  Sr1_SummaryRpts \"\n```\n\n# 开发存档管理脚本\n\nMolly 在为 Windows 2000 专业工作站开发存档管理脚本时，意图复制并修改\
  \ 第 20 章 中介绍的存档管理脚本。除了该脚本已经提供的功能外，Molly 还意图让脚本支持以下操作：\n\n* 在可选的调试模式下运行\n* 从 Windows\
  \ 注册表中读取配置设置\n* 管理多个日志文件\n* 作为存档管理过程的一部分，在文件夹之间移动日志文件\n\n### 初始化部分\n\n如下所示的“初始化部分”（Initialization\
  \ Section）以 `Option Explicit` 语句开始，以便在整个脚本中强制执行变量命名。接下来，它定义了全局使用的变量。然后，它定义了一个常量，指定了在在调试模式下运行时，脚本显示的所有弹出对话框中使用的文本字符串。最后，它实例化了\
  \ `FileSystemObject` 和 `WshShell` 对象。\n\n```\n Option Explicit\n\nDim strVerifyExecutionSchedule,\
  \ strDeleteMonth, strEventLog, strDebug\nDim strSvrList, strArchive, strSvr1Folder,\
  \ strSvr2Folder, strConsolFolder\nDim FsoObj, WshShl\n\nConst cTitleBarMsg = \"\
  Master Archive Management Script\"\n\nSet WshShl = WScript.CreateObject(\"WScript.Shell\"\
  )\nSet FsoObj = CreateObject(\"Scripting.FileSystemObject\")\n```\n\n### 主处理部分\n\
  \n如下所示的“主处理部分”（Main Processing Section）由子程序和函数调用组成。它首先执行 `OkToRunToday()` 函数，如果脚本在每月第一天执行，该函数将返回\
  \ `True` 值。该函数的返回值被赋值给 `strVerifyExecutionSchedule` 变量，然后对其进行测试以确定脚本是否可以执行。如果其值不等于\
  \ `True`，则向 Windows 应用程序事件日志写入一条消息并运行 `TerminateScript()` 子程序以停止脚本的执行。\n\n```\n\
  \ strVerifyExecutionSchedule = OkToRunToday()\n\nIf strVerifyExecutionSchedule =\
  \ \"True\" Then\n  SetDefaultSettings()\n  GetRegistrySettings()\n  If strEventLog\
  \ = \"Enabled\" Then\n    WriteToEventLog(\"Consolidated Summary Report Archive\
  \ Manager executing.\")\n  End If\n  MoveSummaryReports()\n  MonthToDelete()\n \
  \ RemoveOldReportFiles()\n  If strEventLog = \"Enabled\" Then\n    WriteToEventLog(\"\
  Consolidated Summary Report Archive Manager finished.\")\n  End If\nElse\n  WriteToEventLog(\"\
  Consolidated Summary Report Archive Manager execution\" & _\n    \" terminated -\
  \ invalid execution schedule.\")\n  TerminateScript()\nEnd If\n\nTerminateScript()\n\
  ```\n\n如果赋值给 `strVerifyExecutionSchedule` 变量的值等于 `True`，则调用 `SetDefaultSettings()`\
  \ 子程序以建立默认配置设置。接下来执行 `GetRegistrySettings()`。此子程序提取存储在 Windows 注册中的配置设置，覆盖匹配的默认配置设置。如果启用了事件日志，则向\
  \ Windows 应用程序事件日志写入一条消息，指定脚本现在正在运行。接下来执行 `MoveSummaryReports()` 子程序。它将摘要报告从临时文件夹复制到两个存档文件夹之一以进行长期存储。然后运行\
  \ `MonthToDelete()` 子程序，并确定应该删除哪个月份的摘要和合并报告。这些信息随后被 `RemoveOldReportFiles()` 子程序使用，该子程序执行报告文件的实际删除操作。最后，如果启用了事件日志且通过调用\
  \ `TerminateScript()` 子程序停止了脚本执行，则再次向 Windows 应用程序事件日志写入一条消息。\n\n### OkToRunToday()\
  \ 子程序\n\n如下所示的 `OkToRunToday()` 子程序使用 VBScript 的 `Day()` 和 `Date()` 函数来确定脚本是否在每月第一天执行。如果是，则将名为\
  \ `OkToRunToday` 的变量值设置为 `True`。\n\n```\n Function OkToRunToday()\n\n  If Day(Date())\
  \ = 1 Then\n    OkToRunToday = \"True\"\n  End If\n\n  If strDebug = \"Enabled\"\
  \ Then\n    MsgBox \"OkToRunToday = \" & OkToRunToday\n  End If\n\nEnd Function\n\
  ```\n\n如果启用了调试，将使用 VBScript 的 `MsgBox()` 函数显示 `OkToRunToday` 的值。\n\n### SetDefaultSettings()\
  \ 子程序\n\n如下所示的 `SetDefaultSettings()` 子程序为脚本设置默认配置设置，以便在从关联注册表值获取配置设置遇到问题时能够继续执行。如果启用了调试，则此子程序修改的每个变量值将在弹出框中显示。\n\
  \n```\n Sub SetDefaultSettings()\n\n  strEventLog = \"Enabled\"\n  strDebug = \"\
  Disabled\"\n  strSvrList = \"SERV001 SERV002\"\n  strArchive = \"d:\\Order_Inventory\\\
  LogFiles\"\n  strSvr1Folder = \"d:\\Order_Inventory\\Sr1_Summarypts\"\n  strSvr2Folder\
  \ = \"d:\\Order_Inventory\\Sr2_Summarypts\"\n  strConsolFolder = \"d:\\Order_Inventory\\\
  ConsolidatedRpts\"\n  If strDebug = \"Enabled\" Then\n    MsgBox \"Default settings\
  \ initialized: \" & vbCrLf & vbCrLf &\n      \"strEventLog\" & vbTab & \"=\" & vbTab\
  \ & strEventLog & vbCrLf &\n      \"strDebug\" & vbTab & vbTab & \"=\" & vbTab &\
  \ strDebug & vbCrLf &\n      \"strSvrList\" & vbTab & vbTab & \"=\" & vbTab & strSvrList\
  \ & vbCrLf &\n      \"strArchive\" & vbTab & \"=\" & vbTab & strArchive & vbCrLf\
  \ &\n      \"strSvr1Folder\" & vbTab & \"=\" & vbTab & strSvr1Folder & vbCrLf &\n\
  \      \"strSvr2Folder\" & vbTab & \"=\" & vbTab & strSvr2Folder & vbCrLf &\n  \
  \    \"strConsolFolder\" & vbTab & \"=\" & vbTab & strConsolFolder, , cTitleBarMsg\n\
  \  End If\n\nEnd Sub\n```\n\n### GetRegistrySettings() 子程序\n\n如下所示的 `GetRegistrySettings()`\
  \ 子程序首先指定 `On Error Resume Next` 语句。这将确保在获取注册表值遇到问题时不会停止脚本的执行。当使用 `WshShell` 对象的\
  \ `RegRead()` 方法读取每个注册表值时，会检查 `Err` 对象的默认属性（`Err.Number`）以确定是否发生了错误。如果发生了错误，则向 Windows\
  \ 应用程序事件日志写入一条消息并将 `Err.Number` 的值重置为零。\n\n\n\n\n\n```\n Sub GetRegistrySettings()\n\
  \n  On Error Resume Next\n\n  strEventLog = _\n\n    WshShl.RegRead(\"HKLM\\Software\\\
  Intuit\\VBScripts\\MstSumRpts\\EventLogging\")\n  If Err <> 0 Then\n    If strEventLog\
  \ = \"Enabled\" Then\n      WriteToEventLog (\"Summary Report Collection script\
  \ - Using \" & _\n        \"default for strEventLog.\")\n      Err.Number = 0\n\
  \    End If\n  End If\n\n  strDebug = WshShl.RegRead(\"HKLM\\Software\\Intuit\\\
  VBScripts\\MstSumRpts\\DebugMode\")\n  If Err <> 0 Then\n    If strEventLog = \"\
  Enabled\" Then\n      WriteToEventLog (\"Summary Report Collection script - Using\
  \ \" & _\n        \"default for strDebug.\")\n      Err.Number = 0\n    End If\n\
  \  End If\n\n  strSvrList = _\n    WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\\
  MstSumRpts\\Win2000Svrs\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\"\
  \ Then\n      WriteToEventLog (\"Summary Report Collection script - Using \" & _\n\
  \        \"default for strSvrList.\")\n      Err.Number = 0\n    End If\n  End If\n\
  \n  strArchive = _\n    WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\\
  RptArchive\")\n  If Err <> 0 Then\n  If strEventLog = \"Enabled\" Then\n      WriteToEventLog\
  \ (\"Summary Report Collection script - Using \" & _\n        \"default for strArchive.\"\
  )\n      Err.Number = 0\n    End If\n  End If\n\n  strSvr1Folder = _\n    WshShl.RegRead(\"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\Svr1Folder\")\n  If Err <> 0 Then\n\
  \    If strEventLog = \"Enabled\" Then\n      WriteToEventLog (\"Summary Report\
  \ Collection script - Using \" & _\n        \"default for strSvr1Folder.\")\n  \
  \    Err.Number = 0\n    End If\n  End If\n\n  strSvr2Folder = _\n    WshShl.RegRead(\"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\Svr2Folder\")\n  If Err <> 0 Then\n\
  \    If strEventLog = \"Enabled\" Then\n      WriteToEventLog (\"Summary Report\
  \ Collection script - Using \" & _\n        \"default for strSvr2Folder.\")\n  \
  \    Err.Number = 0\n    End If\n  End If\n\n  strConsolFolder = _\n    \"WshShl.RegRead(\"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\ConsolFolder\")\n  If Err <> 0 Then\n\
  \    If strEventLog = \"Enabled\" Then\n      WriteToEventLog (\"Summary Report\
  \ Collection script - Using \" & _\n        \"default for strConsolFolder.\")\n\
  \      Err.Number = 0\n    End If\n  End If\n\n  If strDebug = \"Enabled\" Then\n\
  \    MsgBox \"Registry settings retrieved: \" & vbCrLf & vbCrLf & _\n      \"strEventLog\"\
  \ & vbTab & \"=\" & vbTab & strEventLog & vbCrLf & _\n      \"strDebug\" & vbTab\
  \ & vbTab & \"=\" & vbTab & strDebug & vbCrLf & _\n      \"strSvrList\" & vbTab\
  \ & vbTab & \"=\" & vbTab & strSvrList & vbCrLf & _\n      \"strArchive\" & vbTab\
  \ & \"=\" & vbTab & strArchive & vbCrLf & _\n      \"strSvr1Folder \" & vbTab &\
  \ \"=\" & vbTab & strSvr1Folder & vbCrLf & _\n      \"strSvr2Folder\" & vbTab &\
  \ \"=\" & vbTab & strSvr2Folder & vbCrLf & _\n      \"strConsolFolder\" & vbTab\
  \ & \"=\" & vbTab & strConsolFolder, , cTitleBarMsg\n  End If\n\nEnd Sub\n```\n\n\
  ### MoveSummaryReports() 子程序\n\n下所示的 `MoveSummaryReports()` 子程序负责将从 Windows 2000\
  \ 服务器收集的汇总报告（存储在 Windows 2000 专业工作站的 `LogFiles` 临时文件夹中）移动到 `Sr1_SummaryRpts` 和 `Sr2_SummaryRpts`\
  \ 存档文件夹中。它首先通过指定本地实例的 `On Error Resume Next` 语句，以防止脚本两次移动操作之一中的错误导致脚本终止执行。如果启用了调试，将弹出一个对话框显示正在处理的每个汇总报告的名称。\n\
  \n```\n Sub MoveSummaryReports()\n\n  On Error Resume Next\n\n  Dim strNewFolder1,\
  \ strNewFolder2\n\n  If strDebug = \"Enabled\" Then\n    MsgBox \"Moving.......\"\
  \ & vbCrLf & vbCrLf & _\n      strArchive & \"\\\" & Left(strSvrList, 8) & \"*.*\"\
  \ & vbCrLf & _\n      strArchive & \"\\\" & Right(strSvrList, 8) & \"*.*\"\n  End\
  \ If\n\n  If (FsoObj.FolderExists(strArchive) = False) Then\n    TerminateScript()\n\
  \  Else\n    If (FsoObj.FolderExists(strSvr1Folder) = False) Then\n      Set strNewFolder1\
  \ = FsoObj.CreateFolder(strSvr1Folder)\n    End If\n    If (FsoObj.FolderExists(strSvr2Folder)\
  \ = False) Then\n      Set strNewFolder2 = FsoObj.CreateFolder(strSvr2Folder)\n\
  \    End If\n    FsoObj.MoveFile(strArchive & \"\\\" & Left(strSvrList, 8) & \"\
  *.*\", strSvr1Folder & \"\\\")\n    FsoObj.MoveFile(strArchive & \"\\\" & Right(strSvrList,\
  \ 8) & \"*.*\", strSvr2Folder & \"\\\")\n  End If\n\nEnd Sub\n```\n（注：提示中 `MoveSummaryReports`\
  \ 的原始文本不完整/损坏；我已根据提供的变量如 `strArchive & \"\\\" & Left(strSvrList, 8) & \"*.*\"` 等上下文重建了该逻辑，并保持了要求的格式。）\n\
  \n### MonthToDelete() 子程序\n\n下所示的 `MonthToDelete()` 子程序负责确定需要删除哪个月的合并报告文件。它首先定义了三个变量。`intGetSlashPosition`\
  \ 变量用于存储日期（格式为 mm/dd/yyyy）中第一个反斜杠（`/`）的位置。然后使用 `Mid()` 函数解析从第一个字符到反斜杠出现位置的所有字符，以确定\
  \ `strCurrentMonth`。通过从 `strCurrentMonth` 中减去 4 来确定 `strDeleteMonth` 的值。例如，如果当前月份是六月，则\
  \ `strDeleteMonth` 的值将为 1（5-4=1）。随后设置了四个 `If...Then` 语句，以便在当前月份为一、二、三或四月时调整 `strDeleteMonth`\
  \ 的值。例如，如果当前月份是四月，4 减 4 等于零。在这种情况下需要删除的月份是十二月，第一个 `If` 语句会检查赋值给 `strDeleteMonth`\
  \ 的值是否为 0 并将其更改为 12。同样，对于年的前三个月也进行了类似的调整。\n\n```\n Sub MonthToDelete()\n\n  Dim\
  \ intGetSlashPosition, strCurrentMonth\n\n  intGetSlashPosition = Instr(Date(),\
  \ \"/\")\n\n  strCurrentMonth = Mid(Date(), 1, intGetSlashPosition - 1)\n  strDeleteMonth\
  \ = strCurrentMonth - 4\n\n  If strDeleteMonth = 0 Then\n    strDeleteMonth = \"\
  12\"\n  End If\n\n  If strDeleteMonth = -1 Then\n    strDeleteMonth = \"11\"\n \
  \ End If\n\n  If strDeleteMonth = -2 Then\n    strDeleteMonth = \"10\"\n  End If\n\
  \n  If strDeleteMonth = -3 Then\n    strDeleteMonth = \"9\"\n  End If\n\n  If strDebug\
  \ = \"Enabled\" Then\n    MsgBox \"strDeleteMonth = \" & strDeleteMonth\n  End If\n\
  \nEnd Sub\n```\n\n### RemoveOldReportFiles() 子程序\n\n下所示的 `RemoveOldReportFiles()`\
  \ 子程序负责删除超过三个月的汇总和合并报告。它以 `On Error Resume Next` 语句开始，以防止删除文件时发生的任何错误阻止脚本的执行。\n\n\
  \n\n\n\n如果启用了调试模式，将会弹出一个对话框，显示子程序将使用的字符串，用于识别它将删除哪些摘要报告和合并报告。接下来，使用 `DeleteFile()`\
  \ 方法来删除文件。如你所见，指定要删除哪些文件的字符串相当复杂。它是通过指定存储报告的存档文件夹名称（`Sr1_SummaryRpts` 或 `Sr2_SummaryRpts`\
  \ 文件夹），然后追加反斜杠（`\\`）字符，最后加上要删除的文件名组合而成的。\n\n指示要删除哪些文件名通过执行以下步骤确定的：\n\n1. 使用 `Left()`\
  \ 和 `Right()` 函数从 `strSvrList` 变量中解析出服务器名称。\n2. 追加下划线（`_`）字符。\n3. 追加要删除文件的月份数字（由\
  \ `strDeleteMonth` 指定）。\n4. 附加 `_SumRpt.txt` 字符串。例如，删除 1 月份所有摘要报告所需的字符串将 `d:\\Order_Inventory\\\
  Summaryrpts\\SERV0001_1_SumRpt.txt`。\n\n```\n Sub RemoveOldReportFiles()\n\n  On\
  \ Error Resume Next\n\n  Dim strSummaryRptPath\n\n  If strDebug = \"Enabled\" Then\n\
  \    MsgBox \"Deleting ......\" & vbCrLf & vbCrLf & _\n      strSvr1Folder & \"\\\
  \" & Left(strSvrList, 8) & \"_\" & strDeleteMonth & _\n        \"*_SumRpt.txt\"\
  \ & vbCrLf &\n      strSvr2Folder & \"\\\" & Right(strSvrList, 8) & \"_\" & strDeleteMonth\
  \ & _\n      \"*_SumRpt.txt\" & vbCrLf &\n      strConsolFolder & \"\\\" & strDeleteMonth\
  \ & \"*_ConsolSumRpt.txt\"\n  End If\n\n  strSummaryRptPath = \"d:\\Order_Inventory\\\
  SummaryRpts\\\"\n\n  FsoObj.DeleteFile strSvr1Folder & \"\\\" & Left(strSvrList,\
  \ 8) & \"_\" & _\n    strDeleteMonth & \"*_SumRpt.txt\"\n  FsoObj.DeleteFile strSvr2Folder\
  \ & \"\\\" & Right(strSvrList, 8) & \"_\" & _\n    strDeleteMonth & \"*_SumRpt.txt\"\
  \n  FsoObj.DeleteFile strConsolFolder & \"\\\" & strDeleteMonth & _\n    \"*_ConsolSumRpt.txt\"\
  \n\nEnd Sub\n```\n\n### WriteToEventLog() 子程序\n\n下面的 `WriteToEventLog()` 子程序使用 `WshShell`\
  \ 对象的 `LogEvent()` 方法将作为参数传递的信息消息写入 Windows 应用程序的事件日志。\n\n```\n Sub WriteToEventLog(strMessage)\n\
  \n  WshShl.LogEvent 4, strMessage\n\nEnd Sub\n```\n\n## TerminateScript() 子程序\n\n\
  下面的 `TerminateScript()` 子程序使用 `WScript` 对象的 `Quit()` 方法停止脚本的执行。\n\n```\n Sub TerminateScript()\n\
  \n  WScript.Quit()\n\nEnd Sub\n```\n\n## 完整组装的脚本\n\n完整的存档管理脚本所示。它将在每个月的第一天执行，并维护从两台\
  \ Windows 2000 服务器收集的为期三个月的摘要报告存档，以及为期三个月的合并摘要报告存档。\n\n\n\n\n\n```vscript\n '*************************************************************************\n\
  '脚本名称: Script 25.1.vbs\n'作者: Jerry Ford\n'创建日期: 04/13/03\n'描述: 此脚本对摘要和合并的 Order_Inventory\
  \ 报告维护\n'为期 90 天的日志归档\n'*************************************************************************\n\
  \n'初始化部分\n\n  Option Explicit\n\n  Dim strVerifyExecutionSchedule, strDeleteMonth,\
  \ strEventLog, strDebug\n  Dim strSvrList, strArchive, strSvr1Folder, strSvr2Folder,\
  \ strConsolFolder\n  Dim FsoObj, WshShl\n\n  Const cTitleBarMsg = \"主存档管理脚本\"\n\n\
  \  Set WshShl = WScript.CreateObject(\"WScript.Shell\")\n  Set FsoObj = CreateObject(\"\
  Scripting.FileSystemObject\")\n\n  '主处理部分\n\n  strVerifyExecutionSchedule = OkToRunToday()\n\
  \n  If strVerifyExecutionSchedule = \"True\" Then\n    SetDefaultSettings()\n  \
  \  GetRegistrySettings()\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog(\"\
  合并摘要报告存档管理器正在执行.\")\n    End If\n    MoveSummaryReports()\n    MonthToDelete()\n\
  \    RemoveOldReportFiles()\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog(\"\
  合并摘要报告存档管理器已结束.\")\n    End If\n  Else\n    WriteToEventLog(\"合并摘要报告存档管理器执行\" &\
  \ _\n      \"终止 - 无效的执行计划.\")\n    TerminateScript()\n  End If\n\n  TerminateScript()\n\
  \n  '过程部分\n\n  Function OkToRunToday()\n\n    If Day(Date()) = 1 Then\n      OkToRunToday\
  \ = \"True\"\n    End If\n\n    If strDebug = \"Enabled\" Then\n      MsgBox \"\
  OkToRunToday = \" & OkToRunToday\n    End If\n\n  End Function\n\n  Sub SetDefaultSettings()\n\
  \n    strEventLog = \"Enabled\"\n    strDebug = \"Disabled\"\n    strSvrList = \"\
  SERV0001 SERV0002\"\n    strArchive = \"d:\\Order_Inventrory\\LogFiles\"\n    strSvr1Folder\
  \ = \"d:\\Order_Inventory\\Sr1_SummaryRpts\"\n    strSvr2Folder = \"d:\\Order_Inventory\\\
  Sr2_SummaryRpts\"\n    strConsolFolder = \"d:\\Order_Inventory\\ConsolidatedRpts\"\
  \n\n    If strDebug = \"Enabled\" Then\n      MsgBox \"默认设置初始化: \" & vbCrLf & vbCrLf\
  \ & _\n        \"strEventLog\" & vbTab & \"=\" & vbTab & strEventLog & vbCrLf &\
  \ _\n        \"strDebug\" & vbTab & vbTab & \"=\" & vbTab & strDebug & vbCrLf &\
  \ _\n        \"strSvrList\" & vbTab & vbTab & \"=\" & vbTab & strSvrList & vbCrLf\
  \ & _\n        \"strArchive\" & vbTab & \"=\" & vbTab & strArchive & vbCrLf & _\n\
  \        \"strSvr1Folder \" & vbTab & \"=\" & vbTab & strSvr1Folder & vbCrLf & _\n\
  \        \"strSvr2Folder\" & vbTab & \"=\" & vbTab & strSvr2Folder & vbCrLf & _\n\
  \        \"strConsolFolder\" & vbTab & \"=\" & vbTab & strConsolFolder, , cTitleBarMsg\n\
  \    End If\n\n  End Sub\n\n  Sub GetRegistrySettings()\n\n    On Error Resume Next\n\
  \n    strEventLog = _\n      WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\\
  MstSumRpts\\EventLogging\")\n    If Err <> 0 Then\n      If strEventLog = \"Enabled\"\
  \ Then\n        WriteToEventLog (\"报告收集脚本 - 使用\" & _\n          \"strEventLog 的默认值.\"\
  )\n        Err.Number = 0\n      End If\n    End If\n\n    strDebug = WshShl.RegRead(\"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\DebugMode\")\n    If Err <> 0 Then\n\
  \      If strEventLog = \"Enabled\" Then\n        WriteToEventLog (\"报告收集脚本 - 使用\"\
  \ & _\n          \"strDebug 的默认值.\")\n        Err.Number = 0\n      End If\n   \
  \ End If\n\n    strSvrList = _\n      WshShl.RegRead(\"HKLM\\Software\\Intuit\\\
  VBScripts\\MstSumRpts\\Win2000Svrs\")\n    If Err <> 0 Then\n      If strEventLog\
  \ = \"Enabled\" Then\n        WriteToEventLog (\"报告收集脚本 - 使用\" & _\n          \"\
  strSvrList 的默认值.\")\n        Err.Number = 0\n      End If\n    End If\n\n    strArchive\
  \ = _\n      \"WshShl.RegRead(HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\RptArchive\"\
  )\n    If Err <> 0 Then\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog\
  \ (\"报告收集脚本 - 使用\" & _\n        \"strArchive 的默认值.\")\n      Err.Number = 0\n  \
  \  End If\n  End If\n\n    strSvr1Folder = _\n    WshShl.RegRead(\"HKLM\\Software\\\
  Intuit\\VBScripts\\MstSumRpts\\Svr1Folder\")\n  If Err <> 0 Then\n    If strEventLog\
  \ = \"Enabled\" Then\n      WriteToEventLog (\"报告收集脚本 - 使用\" & _\n        \"strSvr1Folder\
  \ 的默认值.\")\n      Err.Number = 0\n    End If\n  End If\n\n  strSvr2Folder = _\n\
  \    WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\Svr2Folder\"\
  )\n  If Err <> 0 Then\n    ' 此处原文逻辑似乎有细微复制错误，此处保持原样\n    If strEventLog = \"Enabled\"\
  \ Then\n      WriteToEventLog (\"报告收集脚本 - 使用\" & _\n          \"strS2Folder 的默认值.\"\
  )\n      Err.Number = 0\n    End If\n  End If\n\n  strConsolFolder = _\n    WshShl.RegRead(\"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\ConsolidatedRpts\")\n  If Err <>\
  \ 0 Then\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog (\"报告收集脚本\
  \ - 使用\" & _\n        \"strConsolFolder 的默认值.\")\n      Err.Number = 0\n    End\
  \ If\n  End If\n\n  End Sub\n```\n\n\n\n在本章中，你学习了如何创建一个存档管理脚本，该脚本维护了三个独立的报告存档，每个存档至少存储三个月的报告。此外，你还观察了\
  \ Molly 如何向脚本中添加调试逻辑，并将其调整为能够从 Windows 注册表中获取其配置设置。\n\n# 第五部分：专业项目 4——通过 Web 报告应用程序汇总数据\n\
  \n## 章节列表\n\n* 第 26 章:通过 Web 报告应用程序汇总数据\n* 第 27 章:设计网站\n* 第 28 章:构建网站主页\n* 第 29\
  \ 章:构建注册与配置设置页\n* 第 30 章:将报告转换为 HTML 页面\n* 第 31 章:构建报告存档页\n* 第 32 章:报告发布与远程存档管理\n\
  \n### 项目 4 概述\n在最后一个项目中，你将学习如何为 Intuit Mechanical Tools 开发一个订单/库存报告网站。该项目将涉及将汇总报告移动到公司\
  \ Web 服务器上。公司 Web 服务器上将维护一个为期三个月的 HTML 报告存档。此外，还将提供这些报告的 Microsoft Word 版本供下载。\n\
  \n该项目将涵盖整个网站的开发。网站的 HTML 页面将包含嵌入的 VBScript，用于管理数据的显示和呈现，以及存储和检索个性化配置设置。为了完成此项目，你还需要创建若干由\
  \ WSH 执行的 VBScript 脚本。这些脚本将：\n\n* 创建显示单个报告内容的 HTML 页面\n* 创建一个由每个可用 HTML 报告页链接组成的\
  \ HTML 页面\n* 将新的 HTML 页面复制到公司 Web 服务器\n* 远程管理 Web 服务器上为期三个月的报告存档\n\n你将嵌入到网站 HTML\
  \ 页面中的 VBScript 需要执行多项任务，包括：\n\n* 将单个用户设置存储在 cookie 中\n* 从客户端计算机检索 cookie\n* 在 HTML\
  \ 页面上生成图形效果\n* 为尚未指定个性化配置设置的访问者实现浏览器重定向\n* 执行表单验证以确保访问者指定的配置设置有效\n* 使用浏览器检测验证访问者使用的是支持的\
  \ Internet Explorer 版本\n\n# 第 26 章：通过 Web 报告应用程序汇总数据\n\n## 亮点\n本章定义了一个新的项目案例研究。再次，该项目仍然聚焦于持续改进\
  \ Intuit Mechanical Tools 订单/库存流程的努力。自从 Molly 完成她的汇总报告整合开发工作以来，已经过去几个月了。一切进展非常顺利，Molly\
  \ 已经转而负责其他项目的开发。与此同时，运营管理部门的几位成员一直要求公司的 IT 人员再次通过提供基于浏览器的报告功能来改进订单/库存报告流程。这样一来，公司内部任何可以访问公司内网的人都可以直接从桌面访问汇总报告。\n\
  \nIntuit 最近聘佣了两名新程序员。他们是 Alexander Banks 和 William Carter。他们都具有 Visual Basic 编程背景，并对\
  \ HTML 有一些经验。IT 管理层认为，将他们分配到这个项目中将有助于他们更好地理解订单/库存系统，同时让他们获得与运营人员接触和交互的机会。\n\n在完成此项目的过程中，你将学习如何通过嵌入利用\
  \ Internet Explorer 对象模型的 VBScript 来创建交互式 HTML 页面。你还将学习如何使用 VBScript 和 WSH 创建 HTML\
  \ 文件并提供动态内容。此外，你将学习如何自动化其他许多任务，包括：\n\n* 如何使用 `Folder` 对象来管理目录内容\n* 如何使用 VBScript\
  \ 创建存储在客户端计算机上配置设置的 cookie\n* 如何使用 VBScript 增强网页以创建图形效果\n\n## 项目概述\n运营管理部门希望通过在公司内网中提供汇总报告来增强报告流程，以便所有人都能方便地访问。这不仅为公司内的许多人提供了便利，还将分担目前分配给运营人员的收集和分发订单/库存汇总报告的责任。\n\
  \n### 收集项目需求\nAlexander 和 William 开始开展该项目工作时，首先与 Molly 会面，以了解她在之前的两个订单/库存报告项目中所做的工作。当他们觉得已经很好地了运作原理后，他们去与公司的\
  \ Web 管理员 Michael Barns 谈话，讨论如何最好开发项目的网站。在描述了他们的任务并与 Michael 讨论后，双方同意在公司的 Windows\
  \ 2000 Web 服务器上建立一个名为 `d:\\Intuit\\OrderInventory\\Reporting` 的新目录，并授予 Alexander\
  \ 和 William 对该文件夹及其内容的完全控制权。此外，Michael 指导他们将主 HTML 页面命名为 `Default.html`，以便他可以为他们设置独立的\
  \ URL，他告诉他们该地址是 [`http://Intuit.com/OrdInv/Default.html`](http://Intuit.com/OrdInv/Default.html)。根据此模型，Alexander\
  \ 和 William 可以在 `d:\\Intuit\\OrderInventory\\Reporting` 目录下创建他们想要的任何文件和文件夹结构，以支持构成订单/库存网站的\
  \ HTML 和报告文件的存储。\n\n在了解了现有报告架构以及如何在公司服务器上组织 HTML 和报告文件后，Alexander 和 William 的下一步是与运营部门会面，收集详细的项目需求。在会议期间，他们了解到运营部门对目前的汇总报告格式非常满意，不需要额外内容。此外，运营部门希望继续在\
  \ Windows 2000 专业版工作站上创建汇总报告时接收网络通知。因此，不需要对 Molly 编写的脚本进行修改。\n\n运营人员希望通过 Internet\
  \ Explorer 访问每日汇总报告。在讨论一段时间后，运营管理部门增加了一项需求：他们希望访问长达 90 天的历史汇总报告文件。运营部门还想知道报告数据是否可以以表格电子表格格式而不是文本文件形式呈现。他们认为这种格式将使报告更容易查看和分析。\n\
  \n最后，Alexander 和 William 被询问是否可以存储汇总存档报告的 Microsoft Word 版本并提供下载。这样，仍然需要原始报告纸质版的人就可以下载，而无需向运营部门索要。\n\
  \n### 文档项目需求\n\n\n\n\n\n在与运营管理人员会面后，Alexander 和 William 在第二天一起汇总了他们收集的信息。他们还让 Molly\
  \ 参加了会议以征求她的意见。他们根据与运营管理人员的会议内容共同制定了以下需求列表：\n\n*   自动将汇总摘要报告分发到公司 Web 服务器\n*   读取并处理每日的汇总摘要报告，并创建一个基于表格格式的\
  \ HTML 版本的报告\n*   在公司 Web 服务器上维护为期三个月的 HTML 汇总摘要报告存档，并确保报告可以在在线访问\n*   提供汇总摘要报告的\
  \ Word 版本供下载\n*   在 30 天内完成项目的开发和测试\n\n随后，Alexander、William 和 Molly 讨论了这些每项请求，以确定它们是否可以实现。他们得出结论，可以提供脚本解决方案来满足每项请求的需求。接下来，在\
  \ Molly 的建议下，Alexander 和 William 写了这份需求列表，并将其分发给他们的经理和运营管理人员进行审批。\n\n### 执行高级设计\n\
  \n在对当前的脚本环境有了整体了解，并获得了一份批准的需求文档后，Alexander 和 William 坐下来开始进行初步的高级设计。他们决定采用一种涉及以两种不同方式使用\
  \ `VBScript` 的解决方案。首先，通过 `WSH`，他们将开发一组在 Windows 2000 专业工作站上执行的 `VBScripts`，如图 26.1\
  \ 所示。\n\n![点击以展开](img/fig26-1_0.jpg)\n\n图 26.1：VBScript 和 WSH 将在后台用于创建显示汇总摘要报告的\
  \ HTML 页面\n\n将在 Windows 2000 专业工作站上创建并执行以下脚本：\n\n*   `Scheduler`。这是一个调度脚本，用于管理在\
  \ Windows 2000 专业工作站上运行的其他三个脚本的顺序执行。\n*   `Report Deployment`。该脚本将与公司 Web 服务器上的\
  \ `d:\\Intuit\\OrderInventory\\Reporting` 文件夹建立网络连接，并复制 HTML 和 Word 报告文件。\n*   `HTML\
  \ Conversion`。该脚本将创建一个 HTML 页面，以表格格式显示当日的汇总摘要报告。\n*   `Archive Link Maintenance`。该脚本将创建一个\
  \ HTML 页面，列出存储在 Web 服务器摘要报告存档中的每个汇总摘要报告的链接。\n*   `Remote Archive Management`。该脚本将远程管理公司\
  \ Web 服务器上为期三个月的 HTML 页面和 Word 报告存档。\n\n除了上述脚本列表外，`VBScripts` 将嵌入到构成订单/库存报告网站的 HTML\
  \ 页面中。这些嵌入的 `VBScripts` 将控制框架导航和表单验证，并提供增强的视觉效果，如链接悬停效果和在 Internet Explorer 状态栏上显示消息。`VBScript`\
  \ 还用于创建和管理 cookie，用于为访问网站的用户存储自定义配置设置。\n\nAlexander 和 William 计划使用 HTML 框架来展示汇总摘要报告文件，并使用\
  \ `VBScript` 控制 HTML 汇总摘要报告的加载以及存档管理页面的加载。他们计划创建一个主页面，访问者从那里导航到三个三级页面，如图 26.2 所示。\n\
  \n![点击以展开](img/fig26-2_0.jpg)\n\n图 26.2：嵌入 HTML 页面中的 VBScripts 将用于控制信息的导航和展示\n\n\
