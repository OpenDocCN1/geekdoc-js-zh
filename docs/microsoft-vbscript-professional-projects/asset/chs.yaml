  \ & _\n    \"- 输入您的姓名。\" & vbCrLf & vbCrLf & _\n    vbTab & \"* 默认视图：- 选择您在访问此网站时默认加载的页面。\"\
  \ & vbCrLf & vbCrLf & _\n    vbTab & \"* 选择配色：- 选择您的背景和前景偏好。\" & vbCrLf & vbCrLf\
