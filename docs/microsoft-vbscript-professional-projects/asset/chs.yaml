  \ & astrErrors(0) & \"</td>\")\n  strReportFile.WriteLine(\"<td>\" & astrErrors(1)\
  \ & \"</td>\")\n  strReportFile.WriteLine(\"<td>\" & astrErrors(2) & \"</td>\")\n\
  \  strReportFile.WriteLine(\"<td>\" & astrErrors(3) & \"</td>\")\n  strReportFile.WriteLine(\"\
  <td>\" & astrErrors(4) & \"</td>\")\n  strReportFile.WriteLine(\"       </tr>\"\
  )\nEnd Sub\n\nSub WriteSalesAndReturnsColHeadings()\n  strReportFile.WriteLine(\"\
  \       <tr>\")\n  strReportFile.WriteLine(\"<th>Sales</th>\")\n  strReportFile.WriteLine(\"\
  <th>Returns</th>\")\n  strReportFile.WriteLine(\"<th>Svr</th>\")\n  strReportFile.WriteLine(\"\
  <th>Code</th>\")\n  strReportFile.WriteLine(\"       </tr>\")\nEnd Sub\n\nSub WriteSalesAndReturnsData()\n\
  \  strReportFile.WriteLine(\"       <tr>\")\n  strReportFile.WriteLine(\"<td>\"\
  \ & astrErrors(0) & \"</td>\")\n  strReportFile.WriteLine(\"<td>\" & astrErrors(1)\
  \ & \"</td>\")\n  strReportFile.WriteLine(\"<td>\" & astrErrors(2) & \"</td>\")\n\
  \  strReportFile.WriteLine(\"       </tr>\")\nEnd Sub\n\nSub WriteProductionColHeadings()\n\
  \  strReportFile.WriteLine(\"       <tr>\")\n  strReportFile.WriteLine(\"<th>Date</th>\"\
  )\n  strReportFile.WriteLine(\"<th>Time</th>\")\n  strReportFile.WriteLine(\"<th>Svr</th>\"\
  )\n  strReportFile.WriteLine(\"<th>Code</th>\")\n  strReportFile.WriteLine(\"<th>Description</th>\"\
  )\n  strReportFile.WriteLine(\"       </tr>\")\nEnd Sub\n\nSub WriteProductionData()\n\
  \  strReportFile.WriteLine(\"       <tr>\")\n  strReportFile.WriteLine(\"<td>\"\
  \ & astrErrors(0) & \"</td>\")\n  strReportFile.WriteLine(\"<td>\" & astrErrors(1)\
  \ & \"</td>\")\n  strReportFile.WriteLine(\"<td>\" & astrErrors(2) & \"</td>\")\n\
  \  strReportFile.WriteLine(\"<td>\" & astrErrors(3) & \"</td>\")\n  strReportFile.WriteLine(\"\
  <td>\" & astrErrors(4) & \"</td>\")\n  strReportFile.WriteLine(\"       </tr>\"\
  )\nEnd Sub\n\nSub WriteFooter()\n  strReportFile.WriteLine(\"     </table><p>\"\
  )\n  strReportFile.WriteLine(\"   </body></html>\")\nEnd Sub\n\nSub ParseProductionData(strSourceLine)\n\
  \  Dim regExpObj, strStrippedString, intCounter, strString2, intArrayCounter\n \
  \ Set regExpObj = New RegExp\n  regExpObj.Pattern = \" +\"\n  regExpObj.Global =\
  \ True\n\n  strStrippedString = RegExpObj.Replace(strSourceLine, \" \")\n\n  astrErrors\
  \ = Split(strStrippedString, \" \")\n\n  intCounter = 0\n\n  For Each intArrayCounter\
  \ In astrErrors\n\n    If intCounter > 1 Then\n      If intCounter <> UBound(astrErrors)\
  \ Then\n        strString2 = strString2 & \" \" & intArrayCounter\n      End If\n\
  \    End If\n    intCounter = intCounter + 1\n\n  Next\n\n  astrErrors(2) = strString2\n\
  \n  astrErrors(3) = astrErrors(UBound(astrErrors))\n\nEnd Sub\n```\n\n\n\n\n\n#\
  \ 第 31 章：构建报告存档页面\n\n## 摘要\n\n在本章中，你观察了 Alexander 如何创建一个从文本到 HTML 的报告转换脚本。在创建此脚本的过程中，你学习了如何在由\
  \ VBScript 生成的输出文件中嵌入 HTML 标签，以便在订单/库存网站上自动展示订单/库存数据。本章还为你提供了一个机会，让你使用 `RegExp`\
  \ 对象及其属性和方法。\n\n\n\n\n在本章中，Alexander 将创建一个由 WSH 执行的 VBScript，该脚本将创建一个 HTML 页面，页面包含指向\
  \ Intuit Web 服务器上报告归档文件夹中所有汇总摘要报告的链接。报告链接将按月份进行组织和显示。此页面还将显示第二组链接，允许访问者查看并下载 Microsoft\
  \ Word 版本的汇总摘要报告副本。\n\n## 使用 Folder 对象和 Files Collection\n\n为了开发生成“报告归档”页的 VBScript，Alexander\
  \ 需要学习如何同时操作 `Folder` 对象和 `Files Collection`。首先，他需要建立到 Web 服务器上共享文件夹的网络连接，该文件夹存储了汇总摘要报告的\
  \ HTML 版本。完成后，他可以使用 `FileSystem Object Object` 对象的 `GetFolder()` 方法来获取共享文件夹的引用。`GetFolder()`\
  \ 方法的语法所示：\n\n```\n ObjectReference.GetFolder(FolderName)\n```\n\n`ObjectReference`\
  \ 是代表 `FileSystem Object` 实例的变量。`FolderName` 指定目标文件夹的。\n\n| | 注意 |\n| :--- | :---\
  \ |\n| 如果指定的文件夹不存在，`GetFolder()` 方法将返回错误。考虑在尝试使用 `GetFolder()` 方法之前，先使用 `FolderExists()`\
  \ 方法检查文件夹是否存在。 |\n\n由 `GetFolder()` 方法建立的引用建立了一个 `Folder` 对象。一旦建立，你的脚本就可以访问属于 `Folder`\
  \ 对象的所有属性。例如，下面的 VBScript 语句演示了如何使用 `GetFolder()` 方法建立指向本地计算机 `C:\\Temp` 文件夹的引用。\n\
  \n```\n Set FsoObj = CreateObject(\"Scripting.FileSystemObject\")\nSet strTargetFile\
  \ = FsoObj.GetFolder(\"c:\\Temp\")\nMsgBox \"Folder \" & strTargetFile & \" was\
  \ last accessed on \" & _\n  strTargetFile.DateLastAccessed\n```\n\n一旦建立了引用（通过 `strTargetFile`），就会显示\
  \ `Folder` 对象的 `DateLastAccessed` 属性。图 31.1 显示了此示例的输出结果。\n\n![点击展开展开](img/fig31-1_o.jpg)\n\
  \n图 31.1：使用 `Folder` 对象的属性访问文件夹信息\n\n一旦建立了 `Folder` 对象，你就可以使用其 `Files` 属性检索一个 `Files\
  \ Collection`。该集合将由指定文件夹内的所有文件组成。例如，下面的 VBScript 语句演示了如何列出本地计算机 `C:\\Temp` 文件夹中的所有文件。\n\
  \n```\n Set FsoObj = CreateObject(\"Scripting.FileSystemObject\")\nSet strTargetFolder\
  \ = FsoObj.GetFolder(\"c:\\Temp\")\nSet strFileList = strTargetFolder.Files\n\n\
  For Each x in strFileList\n  strDisplayList = strDisplayList & x & vbCrLf\nNext\n\
  \nMsgBox strDisplayList\n```\n\n`Files Collection`（由 `strFileList` 代表）通过将 `Folder`\
  \ 对象 `Files` 属性（由 `strTargetFolder.Files` 代表）存储的值赋值给变量来建立。一旦建立，将设置 `For Each`…`Next`\
  \ 循环来遍历文件集合并构建显示字符串。图 31.2 演示了此示例产生的输出。\n\n![](img/fig31-2.jpg)\n\n图 31.2：通过遍历 `Files\
  \ Collection`，你可以程序化处理存储指定文件夹内的所有文件\n\nAlexander 计划使用 `GetFolder()` 方法建立指向 Web 服务器上存储汇总摘要报告\
  \ HTML 版本文件夹的引用。他将使用 `Folder` 对象的 `Files` 属性为该文件夹建立 `Files Collection`。一旦集合建立，他就可以创建一个循环并使用它处理文件夹中的每个文件（为集合中的每个文件添加指向报告归档页的链接）。\n\
  \n## 组装报告归档页面\n\nAlexander 现在准备好开始编写自动化创建报告归档页的脚本了。与他之前的脚本一样，他计划遵循 Molly 开发的组织模型。这将包括支持调试模式以及在\
  \ Windows 应用程序事件日志中记录消息。Alexander 还会添加提供脚本返回的逻辑。\n\n### 初始化部分\n\n所示脚本的“初始化部分”（Initialization\
  \ Section）从强制执行变量命名的严格解释开始。然后它定义了整个脚本和“主处理部分”中使用的全局变量，包括代表配置设置的变量（将从注册表中提取）以及代表\
  \ `FileSystemObject`、`WshNetwork` 和 `WshShell` 对象的变量。\n\n```\n Option Explicit\n\
  \nDim strSharedFolder, strSharedFiles, strWordList, strArchiveFile\nDim strWordFileName,\
  \ intMonth, strMonth, intMonthStore\nDim strEventLog, strDebug, strHTMLFolder, strSharedRptFolder,\
  \ strWebSvrName\n\nDim intReturnCode, intYearLoc, dtmYear\n\nConst cForReading =\
  \ 1\nConst cForWriting = 2\nConst cForAppending = 8\nConst cTitleBarMsg = \"Archive\
  \ Link Maintenance Script\"\n\nDim FsoObj, WshNtk, WshShl\n\nSet FsoObj = CreateObject(\"\
  Scripting.FileSystemObject\")\nSet WshNtk = WScript.CreateObject(\"WScript.Network\"\
  )\nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\n\nintReturnCode = 0\nintMonthStore\
  \ = 0\n```\n\n### 主处理部分\n\n下一页所示的脚本“主处理部分”（Main Processing Section）从调用 `GetRegistrySettings()`\
  \ 子程序开始。该子程序检索脚本的配置设置，并提供如查找汇总报告归档的位置以及保存创建的 HTML 文件的位置。对话框将使用 `MsgBox(` 函数显示中间结果，并在脚本以调试模式运行时识别关键活动的发生情况。同样，如果启用了事件日志，`WriteToEventLog`\
  \ 子程序会将信息消息记录在 Windows 应用程序事件日志中。\n\n\n\n\n```\n GetRegistrySettings()\n\nIf strEventLog\
  \ = \"Enabled\" Then\n  WriteToEventLog(\"Archive Link Maintenance Script now executing.\"\
  )\nEnd If\n\nIf strDebug = \"Enabled\" Then\n  MsgBox \"Beginning development of\
  \ the archive list.\", , cTitleBarMsg\nEnd If\n\nSet strArchiveFile = FsoObj.OpenTextFile(strHTMLFolder\
  \ & \"\\Archive.html\", _\n  cForWriting , \"True\")\n\nMapNetworkDrive \"V:\",\
  \ \"\\\\\" & strWebSvrName & \"\\\" & strSharedRptFolder\n\nSet strSharedFolder\
  \ = FsoObj.GetFolder(\"V:\")\n\nSet strSharedFiles = strSharedFolder.Files\n\nWriteHeader()\n\
  \nWriteH3Heading()\n\nFor Each strWordList In strSharedFiles\n\n  If Instr(1, strWordList.Name,\
  \ \".doc\") = 0 Then\n\n    int1stDash = InStr(1, strWordList.Name, \"-\")\n   \
  \ intLengthOfMonth = int1stDash - 1\n    intMonth = Left(strWordList.Name, intLengthOfMonth)\n\
  \n    If intMonth <> intMonthStore Then\n      intYearLoc = Instr(1, strWordList.Name,\
  \ \"_\")\n      dtmYear = Mid(strWordList.Name, intYearLoc - 4, 4)\n\n      intMonthStore\
  \ = intMonth\n      strMonth = MonthName(intMonth)\n      strArchiveFile.WriteLine(\"\
  <B><P>\" & strMonth & \" \" & dtmYear & \"</B><P>\")\n    End If\n    strWordFileName\
  \ = Replace(strWordList.Name, \"html\", \"doc\" )\n\n    strArchiveFile.WriteLine(\"\
  <A HREF=../\" & \"\\Rpts\\\" & strWordList.Name & _\n      \">\" & strWordList.Name\
  \ & \"</A>\" & \" - \" & \"<A HREF=../\" & \"\\Rpts\\\" & _\n      strWordFileName\
  \ & \">(Download Word Version) </A><BR>\")\n  End If\n\nNext\n\nDisconnectNetworkDrive(\"\
  V:\")\n\nWriteFooter()\n\nIf strDebug = \"Enabled\" Then\n  MsgBox \"Archive list\
  \ now completed.\", , cTitleBarMsg\nEnd If\n\nIf strEventLog = \"Enabled\" Then\n\
  \  WriteToEventLog (\"Archive Link Maintenance Script finished executing.\")\nEnd\
  \ If\n\nTerminateScript(intReturnCode)\n```\n\n在 `Main Processing Section` 中执行的下一个活动是实例化代表\
  \ `Archive.html` 文件的变量，该脚本正在创建此文件。接下来，调用 `MapNetworkDrive()` 函数来建立到共享文件夹的网络连接，该文件夹存储了汇总摘要报告的\
  \ HTML 版本（位于 Web 服务器上）。然后，使用 `GetFolder()` 方法设置指向共享文件夹的工作引用。完成后，将设置一个 `Files Collection`（文件集合）并将其关联到名为\
  \ `strSharedFiles` 的变量上。\n\n此时，可以开始写入新的 HTML 页面。首先，调用 `WriteHeader()` 子程序。该子程序写入\
  \ HTML 页面的起始的一组 HTML 标签。然后，调用 `WriteH3Heading()` 子程序写入页面的主标题。随后，使用 `For Each`…`Next`\
  \ 循环来处理之前创建的 `Files Collection` 中的文件。\n\n循环开始时过滤掉任何具有 `.doc` 扩展的文件，只留下 HTML 文件进行处理。接下来的三条语句确定与文件关联的月份。这些语句找到文件名中第一个连字符\
  \ `-` 出现的位置，减去 1，然后使用 `Left()` 函数将 `intMonth` 设置为一位或两位的月份值。然后将该变量的值与 `intMonthStore`\
  \ 的值进行比较（该值在脚本首次执行时被设置为 0）。如果值不同，则将月份和该月份发生的年份（**加粗**）写入 HTML 页面作为章节标题。此外，将 `intMonth`\
  \ 的值设置为 `intMonthStore` 的值，从而确保如果循环后处理的是在不同月份创建的 HTML 文件，将写入新的月份-年份标题。\n\n接下来，使用\
  \ `Replace()` 函数分配 HTML 页面对应的 Word 报告文件名的名称，并使用 `WriteLine()` 方法写入字符串。该字符串的第一部分代表与该链接关联的存档\
  \ HTML 文件的链接。其位置相对于脚本的位置指定。字符串的第二部分代表指向存档报告的关联 Word 版本的链接。\n\n`Main Processing Section`\
  \ 通过调用 `DisconnectNetworkDrive()` 子程序结束工作，该子程序会断开脚本为了获取 `Files Collection` 而建立的映射驱动器连接。接下来，调用\
  \ `WriteFooter()` 子程序以写入 HTML 页面的结束 HTML 标签，然后执行 `TerminateScript()` 过程。\n\n###\
  \ `GetRegistrySettings()` 子程序\n\n与 Alexander 之前的脚本一样，下面所示的 `GetRegistrySettings()`\
  \ 子程序从 Windows 注册表中检索脚本的配置设置。\n\n```\n Sub GetRegistrySettings()\n\n  On Error Resume\
  \ Next\n\n  strEventLog = _\n    WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\\
  WebRpting\\EventLogging\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\"\
  \ Then\n      WriteToEventLog (\"HTML Report Conversion Script - Using default \"\
  \ & _\n        \"for strEventLog. RC = 4\")\n      TerminateScript(12)\n    End\
  \ If\n  End If\n\n  strDebug = WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\\
  WebRpting\\Debug\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\" Then\n\
  \      WriteToEventLog (\"HTML Report Conversion Script - Using default \" & _\n\
  \        \"for strDebug. RC = 4\")\n      TerminateScript(12)\n    End If\n  End\
  \ If\n\n  strHTMLFolder = WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\WebRpting\\\
  HTMLFolder\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\" Then\n     \
  \ WriteToEventLog (\"HTML Report Conversion Script - Using default \" & _\n    \
  \    \"for strHTMLFolder. RC = 4\")\n      TerminateScript(12)\n    End If\n  End\
  \ If\n\n  strRptFolder = WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\WebRpting\\\
  SharedRptFolder\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\" Then\n\
  \      WriteToEventLog (\"HTML Report Conversion Script - Using default \" & _\n\
  \        \"for strRptFolder. RC = 4\")\n      TerminateScript(12)\n    End If\n\
  \  End If\n\n  strWebSvrName = WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\\
  WebRpting\\WebSvrName\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\" Then\n\
  \      WriteToEventLog (\"HTML Report Conversion Script - Using default \" & _\n\
  \        \"for strWebSvrName. RC = 4\")\n      TerminateScript(12)\n    End If\n\
  \  End If\n\n  MsgBox \"Registry settings initialized: \" & vbCrLf & vbCrLf &\n\
  \      \"strEventLog = \" & strEventLog & vbCrLf &\n      \"strDebug = \" & strDebug\
  \ & vbCrLf &\n      \"strHTMLFolder = \" & strHTMLFolder & vbCrLf &\n      \"strRptFolder\
  \ = \" & strRptFolder & vbCrLf &\n      \"strWebSvrName = \" & strWebSvrName, ,cTitleBarMsg\n\
  End If\n\nEnd Sub\n```\n\n### `WriteHeader()` 子程序\n\n下面所示的 `WriteHeader()` 子程序负责写入\
  \ HTML 页面的起始 HTML 标签并指定起始 `<FONT>` 标签。选择此字体是因为它使用一致的大小打印每个字符，有助于报告数据呈现的一致性。\n\n\
  ```\n Sub WriteHeader()\n  strArchiveFile.WriteLine(\"<HTML>\")\n  strArchiveFile.WriteLine(\"\
  \ <HEAD>\")\n  strArchiveFile.WriteLine(\"   <TITLE>Environment Variables</TITLE>\"\
  )\n  strArchiveFile.WriteLine(\"     </HEAD>\")\n  strArchiveFile.WriteLine(\" \
  \  </BODY>\")\n  strArchiveFile.WriteLine(\"     <FONT FACE='Courier'>\")\n End\
  \ Sub\n```\n\n### `WriteH3Heading()` 子程序\n\n下一页的 `WriteH3Heading()` 子程序向 HTML 页面写入\
  \ `<H3>`  HTML 标题，代表页面的标题。\n\n```\n Sub WriteH3Heading()\n  strArchiveFile.WriteLine(\"\
  <H3>Order/Inventory Reporting Archive</H3><P>\")\nEnd Sub\n```\n\n### `WriteFooter()`\
  \ 子程序\n\n下面所示的 `WriteFooter()` 子程序写入 HTML 页面的结束 HTML 标签，包括结束的 `</FONT>` 标签。\n\n\
  ```\n Sub WriteFooter()\n  strArchiveFile.WriteLine(\" </FONT>\")\n  strArchiveFile.WriteLine(\"\
  \ </BODY>\")\n  strArchiveFile.WriteLine(\"</HTML>\")\n End Sub\n```\n\n### `MapNetworkDrive()`\
  \ 函数\n\n\n\n\n\n下所示的 `MapNetworkDrive()` 函数负责建立到公司 Web 服务器上共享文件夹的网络连接，该文件夹存储了汇总报告\
  \ HTML 版本的归档副本。\n\n```v\n Function MapNetworkDrive(strLetter, strDrive)\n\n  If\
  \ strDebug = \"Enabled\" Then\n    MsgBox \"strLetter = \" & strLetter & vbCrLf\
  \ & \"strDrive = \" & _\n      strDrive, , cTitleBarMsg\n  End If\n\n  If FsoObj.DriveExists(strDrive)\
  \ Then\n\n    If strDebug = \"Enabled\" Then\n      MsgBox strDrive & \" exists\"\
  , , cTitleBarMsg\n    End If\n\n    If FsoObj.DriveExists(strLetter) Then\n\n  \
  \    If strDebug = \"Enabled\" Then\n        MsgBox \"Deleting drive letter \" &\
  \ strLetter, , cTitleBarMsg\n      End If\n\n      WshNtk.RemoveNetworkDrive strLetter\n\
  \n    End If\n\n    WshNtk.MapNetworkDrive strLetter, strDrive\n\n  Else\n\n   \
  \ If strDebug = \"Enabled\" Then\n      MsgBox strDrive & \" does not exist\", ,\
  \ cTitleBarMsg\n    End If\n\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog\
  \ \"Summary Report Collection script - Unable to map \" & _\n      \"to network\
  \ drive \" & strDrive\n    End If\n    TerminateScript(4)\n  End If\n\nEnd Function\n\
  ```\n\n用于设置网络连接的驱动器号和远程文件夹的路径作为参数传递给该函数。使用 `FileSystemObject` 对象的 `DriveExists()`\
  \ 方法来判断远程驱动器是否可用。如果不可用，则调用 `TerminateScript()` 子程序并传递值 `4`，这代表脚本的返回代码。如果网络驱动器可访问，函数接下来将检查指定的驱动器号是否已被占用。如果已占用，则使用\
  \ `RemoveNetworkDrive()` 方法断开其连接，并使用 `MapNetworkDrive()` 方法创建到 Web 服务器上共享文件夹的连接。\n\
  \n### DisconnectNetworkDrive() 子程序\n\n在下一页所示的 `DisconnectNetworkDrive()` 子程序使用 `WshNetwork`\
  \ 对象的 `RemoveNetworkDrive()` 方法断开网络驱动器连接。要终止的连接由名为 `strDriveLetter` 的变量指定，该变量作为参数传递给子程序。\n\
  \n```vbs\n Sub DisconnectNetworkDrive(strDriveLetter)\n\n  On Error Resume Next\n\
  \n  If strDebug = \"Enabled\" Then\n    MsgBox \"Disconnecting \" & strDriveLetter,\
  \ , cTitleBarMsg\n  End If\n\n  WshNtk.RemoveNetworkDrive strDriveLetter\n  If Err\
  \ <> 0 Then\n    If strDebug = \"Enabled\" Then\n      MsgBox \"Error occurred when\
  \ disconnecting \" & strDriveLetter, , _\n        cTitleBarMsg\n    End If\n  End\
  \ If\n\nEnd Sub\n```\n\n### WriteToEventLog() 子程序\n\n下所示的 `WriteToEventLog()` 子程序将作为参数传递给的消息写入\
  \ Windows 应用程序事件日志。\n\n```vbs\n Sub WriteToEventLog(strMessage)\n\n  WshShl.LogEvent\
  \ 4, strMessage\n\nEnd Sub\n```\n\n## TerminateScript() 子程序\n\n在后续页所示的 `TerminateScript()`\
  \ 子程序使用 `WScript` 对象的 `Quit()` 方法停止脚本执行。此外，它会将一个脚本返回代码（指示脚本是否运行成功）传回其调用脚本。该返回代码通过名为\
  \ `intRC` 的参数传递，该参数在脚本执行开始时最初被设置为零。\n\n```vbs\n Sub TerminateScript(intRC)\n\n \
  \ If strDebug = \"Enabled\" Then\n    MsgBox \"Script execution terminated.\", ,\
  \ cTitleBarMsg\n  End If\n\n  WScript.Quit(intRC)\n\nEnd Sub\n```\n\n### 完整汇的脚本\n\
  \n下所示的完整脚本通过连接到公司 Web 服务器来收集当前可用的 HTML 汇总报告文件列表，从而创建报告存档页面。然后它通过为找到的每个文件创建一个链接来构建\
