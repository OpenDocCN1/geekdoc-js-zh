  \ (\"HTML Report Conversion Script - Using default \" & _\n          \"for strWebSvrName.\
  \ RC = 4\")\n        TerminateScript(12)\n      End If\n    End If\n\n    If strDebug\
  \ = \"Enabled\" Then\n      MsgBox \"Registry settings initialized: \" & vbCrLf\
  \ & vbCrLf & _\n        \"strEventLog\" & vbTab & \"=\" & vbTab & strEventLog &\
  \ vbCrLf & _\n         \"strDebug\" & vbTab & vbTab & \"=\" & vbTab & strDebug &\
  \ vbCrLf & _\n         \"strHTMLFolder\" & vbTab & \"=\" & vbTab & strHTMLFolder\
  \ & vbCrLf & _\n         \"strConSolRptLoc\" & vbTab & \"=\" & vbTab & strConSolRptLoc\
  \ & vbCrLf & _\n         \"strSharedRptFolder\" & vbTab & \"=\" & vbTab & strSharedRptFolder\
  \ & _\n         \"strSharedHTMLFolder\" & vbTab & \"=\" & vbTab & strSharedHTMLFolder\
  \ & _\n      vbCrLf & \"strWebSvrName\" & vbTab & \"=\" & vbTab & strWebSvrName\
  \ & _\n      vbCrLf, ,cTitleBarMsg\n  End If\n\nEnd Sub\n```\n\n### MapNetworkDrive()\
  \ 函数\n\n所示的 `MapNetworkDrive()` 函数与上一章节 中的同名函数相同。它接受两个参数：驱动器号和共享网络驱动器或文件夹的位置，并创建一个网络驱动器连接。\n\
  \n```\n Function MapNetworkDrive(strLetter, strDrive)\n\n  If strDebug = \"Enabled\"\
  \ Then\n    MsgBox \"strLetter = \" & strLetter & vbCrLf & \"strDrive = \" & _\n\
  \      strDrive, , cTitleBarMsg\n  End If\n\n  If FsoObj.DriveExists(strDrive) Then\n\
  \n    If strDebug = \"Enabled\" Then\n      MsgBox strDrive & \" exists\", , cTitleBarMsg\n\
  \    End If\n\n  If FsoObj.DriveExists(strLetter) Then\n\n    If strDebug = \"Enabled\"\
  \ Then\n      MsgBox \"Deleting drive letter \" & strLetter, , cTitleBarMsg\n  \
  \  End If\n\n    WshNtk.RemoveNetworkDrive strLetter\n\n  End If\n\n  WshNtk.MapNetworkDrive\
  \ strLetter, strDrive\n\nElse\n\n    If strDebug = \"Enabled\" Then\n      MsgBox\
  \ strDrive & \" does not exist\", , cTitleBarMsg\n    End If\n\n    If strEventLog\
  \ = \"Enabled\" Then\n      WriteToEventLog \"Summary Report Collection script -\
  \ Unable to map \" & _\n      \"to network drive \" & strDrive\n    End If\n   \
  \ TerminateScript(4)\n  End If\n\nEnd Function\n```\n\n### GetFileNames() 子程序\n\n\
  所示的 `GetFileNames()` 子程序负责确定当天汇总摘要报告的 Word 版本和 HTML 版本的名称，正如之前的章节中所演示的。\n\n```\n\
  \ Sub GetFileNames()\n\n  strHTMLRpt = Replace(Date(), \"/\", \"-\")\n\n  strHTMLRpt\
  \ = strHTMLRpt & \"_ConsolSumRpt.html\"\n\n  strWordRpt = Replace(strHTMLRpt, \"\
  html\", \"doc\")\n\n  If strDebug = \"Enabled\" Then\n    MsgBox \"HTML Summary\
  \ Report File Name = \" & strHTMLRpt & vbCrLf & _\n      \"Word Summary Report File\
  \ Name = \" & strWordRpt, , cTitleBarMsg\n  End If\n\nEnd Sub\n```\n\n### CopyAndMoveFiles()\
  \ 子程序\n\n示例所示的 `CopyAndMoveFiles()` 子程序执行系列三个检查，使用 `FileSystemObject` 对象的 `File.Exists()`\
  \ 方法来验证其要复制或移动的三个文件是否存在。如果未找到任何文件，将调用 `TerminateScript()` 子程序并传递脚本返回代码值 4。如果三个了三个文件，则使用\
  \ `GetFile()` 方法建立对这三个文件的引用，然后使用 `File` 对象的 `Move()` 或 `Copy()` 方法将它们复制或移动到 Web\
  \ 服务器。在每次移动或复制操作后都会检查 `Err` 对象以确保操作成功。如果在这些操作中的任何一个发生错误，将调用 `TerminateScript()`\
  \ 子程序并传递脚本返回代码 8。\n\n\n\n\n\n```\n Sub CopyAndMoveFiles()\n\n  Dim strFileName\n\
  \n  If (FsoObj.FileExists(strConSolRptLoc & \"\\\" & strHTMLRpt)) = \"False\" Then\n\
  \    If strDebug = \"Enabled\" Then\n      MsgBox \"File \" & strHTMLRpt & \" not\
  \ 找到。正在停止 \" & _\n      \"script execution.\", , cTitleBarMsg\n    End If\n    If\
  \ strEventLog = \"Enabled\" Then\n      WriteToEventLog \"Remote Archive Management\
  \ Script failed. 无法 \" & _\n        \"find file: \" & strHTMLRpt\n    End If\n \
  \   TerminateScript(4)\n  End If\n  If (FsoObj.FileExists(strConSolRptLoc & \"\\\
  \" & strWordRpt)) = \"False\" Then\n    If strDebug = \"Enabled\" Then\n      MsgBox\
  \ \"File \" & strWordRpt & \" not 找到。正在停止 \" & _\n      \"script execution.\", ,\
  \ cTitleBarMsg\n    End If\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog\
  \ \"Remote Archive Management Script failed. 无法 \" & _\n        \"find file: \"\
  \ & strWordRpt\n    End If\n    TerminateScript(4)\n  End If\n  If (FsoObj.FileExists(strHTMLFolder\
  \ & \"\\\" & \"Archive.html\")) = \"False\" Then\n    If strDebug = \"Enabled\"\
  \ Then\n      MsgBox \"File Archive.html not 找到。正在停止 \" & _\n      \"script execution.\"\
  , , cTitleBarMsg\n    End If\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog\
  \ \"Remote Archive Management Script failed. 无法 \" & _\n        \"find file: Archive.html\"\
  \n    End If\n    TerminateScript(4)\n  End If\n\n  Set strFileName = FsoObj.GetFile(strConSolRptLoc\
  \ & \"\\\" & strHTMLRpt)\n  strFileName.Move \"W:\\\"\n  If Err <> 0 Then\n    If\
  \ strEventLog = \"Enabled\" Then\n      WriteToEventLog \"Remote Archive Management\
  \ Script failed moving \" & _\n        strHTMLRpt\n    End If\n    If strDebug =\
  \ \"Enabled\" Then\n      MsgBox \"Remote Archive Management Script failed moving\
  \ \" & _\n        strHTMLRpt, , cTitleBarMsg\n    End If\n    TerminateScript(8)\n\
  \  End If\n\n  Set strFileName = FsoObj.GetFile(strConSolRptLoc & \"\\\" & strWordRpt)\n\
  \  strFileName.Copy \"W:\\\"\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\"\
  \ Then\n      WriteToEventLog \"Remote Archive Management Script failed copying\
  \ \" & _\n        strWordRpt\n    End If\n    If strDebug = \"Enabled\" Then\n \
  \     MsgBox \"Remote Archive Management Script failed moving \" & _\n        strWordRpt,\
  \ , cTitleBarMsg\n    End If\n    TerminateScript(8)\n  End If\n\n  Set strFileName\
  \ = FsoObj.GetFile(\"X:\\Archive.html\")\n  strFileName.Delete\n\n  Set strFileName\
  \ = FsoObj.GetFile(strHTMLFolder & \"\\\" & \"Archive.html\")\n  strFileName.Move\
  \ \"X:\\\"\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog\
  \ \"Remote Archive Management Script failed moving \" & _\n        \"Archive.html\"\
  \n    End If\n    If strDebug = \"Enabled\" Then\n      MsgBox \"Remote Archive\
  \ Management Script failed moving \" & _\n        \"Archive.html\", , cTitleBarMsg\n\
  \    End If\n    TerminateScript(8)\n  End If\n```\n\n*(注：根据您的指令，“代码块不需要翻译”，因此上述代码块保持原样。如果您的意思是代码内部逻辑保持原样，但对非代码部分的描述性进行翻译。)*\n\
  \n\n\n\n\n```vb\n '*************************************************************************\n\
  '脚本名称: Script 32.1.vbs\n'作者: Jerry Ford\n'创建: 05/09/03\n'描述: 此脚本将 Archive.html 页面以及当天的\
  \ HTML 和 Word \n'汇总摘要报告移动到企业网络服务器\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nDim strEventLog, strDebug, strHTMLFolder, strSharedRptFolder,\
  \ strWebSvrName\nDim strConSolRptLoc, strSharedHTMLFolder, strWordRpt, strHTMLRpt,\
  \ intReturnCode\nDim strResults\n\nConst cTitleBarMsg = \"远程存档管理脚本\"\nConst strExecutionComplete\
  \ = 2\n\nDim FsoObj, WshNtk, WshShl\n\nSet FsoObj = CreateObject(\"Scripting.FileSystemObject\"\
  )\nSet WshNtk = WScript.CreateObject(\"WScript.Network\")\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n\nintReturnCode = 0\n\n'主处理部分\n\nGetRegistrySettings()\n\nIf strEventLog\
  \ = \"Enabled\" Then\n  WriteToEventLog(\"远程存档管理脚本正在执行.\")\nEnd If\n\nIf strDebug\
  \ = \"Enabled\" Then\n  MsgBox \"远程存档管理脚本正在执行。\", , cTitleBarMsg\nEnd If\n\nMapNetworkDrive\
  \ \"W:\", \"\\\\\" & strWebSvrName & \"\\\" & strSharedRptFolder\nMapNetworkDrive\
  \ \"X:\", \"\\\\\" & strWebSvrName & \"\\\" & strSharedHTMLFolder\n\nGetFileNames()\n\
  \nCopyAndMoveFiles()\n\nDisconnectNetworkDrive(\"W:\")\nDisconnectNetworkDrive(\"\
  X:\")\n\nIf strDebug = \"Enabled\" Then\n  MsgBox \"远程存档管理脚本已完成。\", , cTitleBarMsg\n\
  End If\n\nIf strEventLog = \"Enabled\" Then\n  WriteToEventLog (\"远程存档管理脚本执行完毕.\"\
  )\nEnd If\n\nstrResults = TimeToCleanArchive()\n\nIf strResults = \"Yes\" Then\n\
  \n  Set wshController = CreateObject(\"WshController\")\n  Set wshRemote = wshController.CreateScript(\"\
  RemoteArchiveMgr.vbs\", \"\\\\\" & _\n    strWebSvrName)\n  WScript.ConnectObject\
  \ wshRemote, \"RemoteScript_\"\n\n  wshRemote.Execute\n\n  Do Until wshRemote.Status\
  \ = strExecutionComplete\n              WScript.Sleep 2000\n  Loop\n\nEnd If\n\n\
  TerminateScript(intReturnCode)\n\n'过程部分\n\nSub GetRegistrySettings()\n\n  On Error\
