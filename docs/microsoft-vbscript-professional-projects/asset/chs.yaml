  \ Case strKeyName\n            Case \"SourDir\"\n              strSourDir = Mid(strInputLine,\
  \ intGetEqualsPosition + 1, _\n                Len(strInputLine))\n            Case\
  \ \"ReportOn\"\n              strReportOn = Mid(strInputLine, intGetEqualsPosition\
  \ + 1, _\n                Len(strInputLine))\n            Case \"EventLog\"\n  \
  \            strEventLog = Mid(strInputLine, intGetEqualsPosition + 1, _\n     \
  \           Len(strInputLine))\n            Case \"DestFile\"\n              strDestFile\
  \ = Mid(strInputLine, intGetEqualsPosition + 1, _\n                Len(strInputLine))\n\
  \            Case \"Debug\"\n              strDebug = Mid(strInputLine, intGetEqualsPosition\
  \ + 1, _\n                Len(strInputLine))\n          End Select\n        End\
  \ If\n\n      Loop\n\n    OpenFile.Close()\n\n  End If\n\n  If strKeyName\n    Select\
  \ strKeyName\n    Case \"SourDir\"\n    Case \"ReportOn\"\n    Case \"EventLog\"\
  \n    Case \"DestFile\"\n    Case \"Debug\"\n  End Select\n  End If\n\nEnd Sub\n\
  \nSub RecordSummaryData()\n\n  Dim intArrayCounter, OutPutFile, strMessage\n\n \
  \ intArrayCounter = 0\n\n  Set OutPutFile = FsoObject.OpenTextFile(strDestFile,\
  \ 8)\n  If strDebug = \"True\" Then\n    MsgBox \"Now writing to the Summary Report\"\
  \n  End If\n\n  OutPutFile.WriteBlankLines(1)\n  OutPutFile.WriteLine \"----------------------------\"\
  \ & _\n    \"-------------------\"\n  OutPutFile.WriteBlankLines(1)\n\n  OutPutFile.WriteLine\
  \ \"Daily Production Summary\"\n  OutPutFile.WriteBlankLines(1)\n  OutPutFile.WriteLine\
  \ \"Part # Qty Description                 In Stock\"\n  OutPutFile.WriteBlankLines(1)\n\
  \n  For Each intArrayCounter In astrReportArray\n\n    If Len(intArrayCounter) <>\
  \ 0 Then\n      OutPutFile.WriteLine intArrayCounter\n    End If\n  Next\n\n  OutPutFile.Close()\n\
  \n  If strDebug = \"True\" Then\n    MsgBox \"Done writing to the Summary Report\"\
  \n  End If\n\nEnd Sub\n\nSub WriteToEventLog()\n\n  Dim WshShl\n\n  Set WshShl =\
  \ WScript.CreateObject(\"WScript.Shell\")\n\n  '4 indicates an information message\n\
  \  WshShl.LogEvent 4, \"The Daily Production Report Analyzer Script is now running.\"\
  \n  If strDebug = \"True\" Then\n    MsgBox \"Event log message has been recorded\"\
  \n  End If\n\nEnd Sub\n```\n\n\n\n\n这四个报告和日志分析脚本最终将被设置为基于自动化的运行。脚本将按顺序执行，首先处理错误报告（Error\
  \ report），接着是每日销售报告和每日退货报告，最后是每日生产报告。接下来的摘要报告显示了在所有脚本运行后，典型的摘要报告样式。\n\n```\n *******************************************************************************\n\
  \n2003/3/23 汇总摘要报告\n\n*******************************************************************************\n\
  \nErrors:\n\nDate     Time    Code Description\n12:15:44 3/15/03 001  Unable to\
  \ access card reader on device wkstn442\n14:00:14 3/15/03 001  No inventory for\
  \ part # 58694 - unable to fill order 39312\n16:16:46 3/15/03 003  Unable to print\
  \ summary rpt on master printer (no paper)\n\n-------------------------------------------------------------------------------\n\
  \nSales summary:\n\nPart # Qty Description\n\n58694  19  Cordless temp reader\n\
  45643   3  200hp magnetic pump\n17443  15  20 lb box of pump clips\n10344  35  48\
  \ ounce solvent bottle\n19365   2  3 speed electric drill\n\n-------------------------------------------------------------------------------\n\
  \nReturn summary:\n\nPart # Qty Description\n\n58694  2   Cordless temp reader\n\
  17443  7   20 lb box of pump clips\n10344  4   48 ounce solvent bottle\n45643  1\
  \   200hp magnetic pump\n19365   1   3 speed electric drill\n\n-------------------------------------------------------------------------------\n\
  \nDaily Production Summary\n\nPart # Qty  Description               In Stock\n58694\
  \   10  Cordless temp reader       25\n45643    2  200hp magnetic pump        10\n\
  19365    5  3 speed electric drill     10\n17443   20  20 lb box of pump clips \
  \  100\n10344  100  48 ounce solvent bottle   250\n```\n\n## 总结\n\n在本章中，你学习了如何读取和处理报告及日志文件。你开发了一组脚本，根据存储在\
  \ `INI` 文件中的设置来处理这些报告和日志文件，然后创建一个摘要报告，汇总了从报告和日志文件中收集的信息。结果，你已经证明了了如何应用 `VBScript`\
  \ 来解决现实世界的问题，如果使用更传统的编程语言，解决这些问题将花费大量的精力。\n\n# 第 19 章：调度脚本执行\n\n在本章中，Molly 将编写一个新脚本，然后使用\
  \ Windows 任务计划程序每 24 小时执行一次。该脚本一旦执行，将负责按顺序运行每个报告和日志分析脚本。在学习本章内容的过程中，你将了解到为什么 Molly\
  \  choose 选择创建一个调度脚本，而不是简单地将每个报告和日志分析脚本设置为独立的计划任务。你还将学习如何使用计划任务向导。\n\n## 检查调度 VBScript\
  \ 选项\n\n现在 Molly 已经完成了每个报告和日志分析脚本的编写和测试，她需要设置它们的自动化执行。为了完成这项任务，她计划使用内置的任务计划程序服务。Molly\
  \ 决定使用计划任务向导来定义报告和日志文件的执行计划。\n\nMolly 了解到，为了让她的脚本在执行时具有适当的安全权限和权限，她需要设置一个特殊的用户账户（她将其称为\
  \ `service account*`），然后将该账户与她的计划任务关联。Molly 已经设置了一个新用户账户用于运行任何需要按时间计划执行的脚本。她将此账户命名为\
  \ `ScriptSchlr`，并将其设置为存放订单/库存系统的 Windows 2000 服务器上的本地管理员帐户。\n\n### 为每个脚本创建计划任务\n\
  \nMolly 发现，如果要单独设置每个脚本的计划执行，她必须反复运行计划任务向导，并将每个单独的脚本关联到 `ScriptSchlr` 账户。虽然这项任务并不困难，但\
  \ Molly 担心这些脚本以及 `ScriptSchlr` 账户的长期维护。\n\n尽管她在创建 `ScriptSchlr` 账户时使用了永不过期的密码，但\
  \ Molly 知道，为了符合公司的 IT 审计策略，她必须至少每六个月手动更改一次密码。这意味着每隔六个月，她不仅要记得更改 `ScriptSchlr` 账户的密码，还要进入计划任务文件夹并修改每个报告和日志脚本的计划任务。这引入了她在修改计划时可能犯错并输错一个或多个计划任务密码的可能性。\n\
  \n### 创建中间调度脚本\n\n为了简化操作，并在必须更改 `ScriptSchlr` 账户密码时尽可能减少可能发生的差错，Molly 决定创建一个名为 `MstrSched.vbs`\
  \ 的新脚本。该脚本将负责按顺序运行每个报告和日志分析脚本，如图 19.1 所示。\n\n![点击展开](img/fig19-1_0.jpg)\n\n图 19.1：通过单个\
  \ VBScript 自动执行多个脚本\n\n通过这种方式，Molly 只需要配置一个计划任务即可设置所有报告和日志脚本的自动执行，而且她每六个月只需要修改一次计划任务的密码。\n\
  \n#### 使用 Wsh 对象的 Run() 方法\n\n在花阅了一段时间 Windows 技术帮助文件后，Molly 发现了 `Run()` 方法。该方法属于\
  \ `WshShell` 对象，提供了作为新进程执行程序或脚本的能力。它还提供了等待使用 `Run()` 方法运行的子脚本完成后，再允许调用脚本继续执行的能力。\n\
  \n| | 注意 |\n| :--- | :--- |\n| Windows 技术帮助文件是可免费下载的 WSH（Windows Script Host）帮助文件。它提供了\
  \ WSH 对象模型的完整文档。此外，它包含了 `VBScript` 和 `JScript` 的完整文档。要下载 Windows 技术帮助文件，请访问 [`www.microsoft.com/scripting`](http://www.microsoft.com/scripting)\
  \ 并寻找名为**可下载脚本文档**的链接。 |\n\n确保每个报告和日志分析脚本按顺序执行对 Molly 来说是一个关键要求，因为这允许她创建一个脚本来顺序调度其他脚本的执行，以确保一次运行一个子脚本。通过强制报告和日志脚本顺序执行，Molly\
  \ 无需担心如果两个或多个报告和日志分析脚本同时访问并写入摘要报告可能会发生的任何错误。\n\n#### 测试她的假设\n\n为了确保 `Run()` 方法按她所想的那样工作，Molly\
  \ 决定进行一次快速测试并编写了以下脚本。\n\n\n\n\n\n```\n '*************************************************************************\n\
  'Script Name: Script 19.1.vbs\n'Author: Jerry Ford\n'Created: 03/22/03\n'Description:\
  \ This script demonstrates the ability of the WshShell object's\n'Run() method to\
  \ sequentially control the execution of multiple child\n'scripts.\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nOn Error Resume Next\n\nDim WshShl\n\
  \nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\n\n'Main Processing Section\n\
  \nWshShl.Run \"Notepad\", 1, True\n\nWshShl.Run \"Notepad\", 1, True\n\n'Terminate\
  \ script execution\nWScript.Quit()\n```\n\n该脚本旨在调用记事本（Notepad）应用程序，在其执行期间暂停，通过启动另一个记事本实例恢复执行，然后再次暂停直到记事本应用程序关闭。使此过程实现的\
  \ VBScript 语句如下：\n\n```\n WshShl.Run \"Notepad\", 1, True\n```\n\n除了将记事本应用程序名称作为参数传递给\
  \ `Run()` 方法外，还传递了另外两个参数。第一个参数是一个数值，指定打开记事本应用程序时应使用的 Windows 样式。通过将此值指定为 `1`，脚本将以从开始菜单启动完全的方式打开记事本。传递给脚本的第二个参数决定脚本是否应该在等待记事本应用程序运行结束之前恢复其自身的执行。通过将此值设置为\
  \ `True`，Molly 确保了两个记事本实例都按顺序执行。如果她将第二个参数的值设置为 `False`，则两个记事本实例将同时打开。\n\n## 监控后台进程\n\
  \n当 Molly 执行她的测试脚本时，她看到第一个记事本窗口出现。为了验证她的 VBScript 正在后台等待记事本应用程序关闭，她打开了 Windows 任务管理器实用程序并验证脚本仍在执行，如图\
  \ 19.2 所示。\n\n![点击展开](img/fig19-2_0.jpg)\n\n图 19.2：验证 VBScript 仍在作为后台任务执行\n\n由于她是从\
  \ Windows 桌面运行脚本的，因此它默认使用 `WScript.exe` 执行主机进行处理。尽管脚本本身没有出现在任务管理器实用程序显示的活动进程列表中，但当她知道当前没有其他脚本正在执行时，一个活跃的\
  \ `WScript.exe` 执行主机的存在就足以让她推断出她的测试脚本仍在后台运行。通过在关闭第一个和第二个记事本实例时让任务管理器实用程序保持可见，Molly\
  \ 能够见证测试 VBScript 的终止。\n\n## 设置中间调度脚本\n\n现在，Molly 已经确信她可以使用 `WshShell` 对象的 `Run()`\
  \ 方法来强制报告脚本和日志分析脚本按顺序执行，她开始开发 `MstrSched.vbs` 脚本。为了完成该脚本的开发，Molly 还必须学习如何使用许多新的内置\
  \ VBScript 函数，正如在接后的章节中讨论的那样。\n\n### 创建限制脚本执行时间的逻辑\n\nMolly 计划创建一个单一脚本，用于控制她的报告和日志文件分析脚本的执行，以及一个需要在每月第一天执行的存档管理脚本。Molly\
  \ 计划使用内置的 VBScript `Day()` 和 `Date()` 函数，以确保名为 `ArchiveManager.vbs` 的存档管理脚本只在每月第一天执行。这样，Molly\
  \ 就可以编写一个脚本，可以处理每天运行 `MstrSched.vbs` 以运行报告和日志分析脚本的调度，同时兼顾存档管理脚本的每月执行。\n\n`Date()`\
  \ 函数返回当前系统日期，其语法如下所示。\n\n```\n Date()\n```\n\n执行时，它会以 mm/dd/yyyy 的格式返回当前系统日期，如下所示。\n\
  \n```\n strTodaysDate = Date()\nMsgBox strTodaysDate\n```\n\n执行时，之前的 VBScript 语句将显示一个弹出对话框，如图\
  \ 19.3 所示。\n\n![](img/fig19-3.jpg)\n\n图 19.3：使用 `Date()` 函数显示当前系统日期\n\n使用 `Date()`\
  \ 函数返回的信息的一种方法是确定 VBScript 是否在每月第一天运行，即解析出日期字段的值并判断它是否等于 1。实现这一结果的更简单方法是将 `Date()`\
  \ 函数的值作为 `Day()` 函数的输入。`Day()` 函数返回一个表示月份几几的数值。`Day()` 函数的语法如下所示。\n\n```\n Day(Date)\n\
  ```\n\n`Date` 代表任何指定日期的表达式。因此，通过如下所示将 `Date()` 函数封装在 `Day()` 函数内部，你可以轻松确定当前是月份几几。\n\
  \n```\n strTodaysDate = Day(Date())\n```\n\n在每月第一天执行时，`strTodaysDate` 的值将被设置为 `1`。通过测试\
  \ `strTodaysDate` 的值，你可以将逻辑整合到脚本中，如果月份不是 `1`，则自动终止执行。\n\n### 编写 MstrSched.vbs 脚本\n\
  \n`MstrSched.vbs` 脚本的设计非常基础。考虑到脚本相对简单的作用以及紧凑的项目开发计划，Molly 选择不在它上面花费过多时间，也没有给它添加过多的功能。例如，她认为没有必要将其设置外部化，也没有为接收参数的子程序添加额外的逻辑来验证这些参数。\n\
  \n### 初始化部分\n\n脚本的初始化部分（如下所示）启用了对变量名的严格解释和错误检查。该部分还定义并实例化了 `WshShell` 对象。\n\n```\n\
  \ Option Explicit\nOn Error Resume Next\n\nDim WshShl\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n```\n\n### 主处理部分\n\n主处理部分（如下所示）从一系列对名为 `RunScript()` 过程的调用开始。该过程接受一个参数，即要执行的脚本名称。这四个语句中的每一个都为\
  \ `RunScript()` 子过程传递了不同的脚本名称。由于 `MstrSched.vbs` 脚本每天运行，这四个脚本始终会被处理并按顺序执行。主处理部分的后续几行设计用于每月执行\
  \ `ArchiveManager.vbs` 脚本。使用 `If` 语句执行 VBScript 函数 `Day()` 和 `Date()`，以确保 `Archive\
  \ Manager.vbs` 脚本只在每月第一天执行。最后，该部分的最后一个语句使用 `WScript` 对象的 `Quit()` 方法终止脚本的执行。\n\n\
  ```\n RunScript(\"ErrorAnalyzer.vbs\")\nRunScript(\"SalesAnalyzer.vbs\")\nRunScript(\"\
  ReturnsAnalyzer.vbs\")\nRunScript(\"ProductionAnalyzer.vbs\")\n\nIf Day(date())\
  \ = 1 Then\n  RunScript(\"ArchiveManager.vbs\")\nEnd If\n\n'Terminate script execution\n\
  WScript.Quit()\n```\n\n### RunScript() 子过程\n\n\n\n\n\n下所示的 `RunScript()` 子程序包含三条语句。第一条语句标识了子程序的名称并定义了程序的输入参数。该参数代表报告或日志分析脚本的名称，并由\
  \ `Run()` 方法用于指定要运行的脚本名称。此子程序运行的每个脚本都作为后台任务运行。此外，该脚本将在其调用的每个脚本完成之前，将处理控制权返回给调用它的语句。\n\
  \n```\n Sub RunScript(ScriptName)\n  WshShl.Run ScriptName, 1, True\nEnd Sub\n```\n\
  \n### WriteToEventLog() 子程序\n\n下所示的 `WriteToEventLog()` 子程序使用 `WshShell`对象的 `LogEvent()`\
  \ 方法将消息事件存储在 Windows 应用程序日志中。通过这种方式，Molly 可以通过检查系统日志来验证脚本的执行情况，她可以在她的 Windows XP\
  \ 专业版桌面上使用位于计算机管理控制台中的“事件查看器”挂程序进行远程操作。\n\n```\n Sub WriteToEventLog()\n  WshShl.LogEvent\
  \ 4, \"Report and Log Analyzer Scheduler Script executing.\"\nEnd Sub\n```\n\n|\
  \ 注意事项 |\n| :--- |\n| 在 Windows XP 专业版上，计算机管理控制台中的事件查看器挂程序是通过点击“开始”、右键点击“我的电脑”，然后从出现的右键菜单中选择“管理”启动的。这将打开计算机管理控制台。要查看具有适当安全权限和许可的\
  \ Windows 2000 服务器上的应用程序日志，右键点击控制台树顶部的“计算机（本地)”节点并选择“连接到其他计算机”。然后提供另一台计算机的名称或 IP\
  \ 地址并点击确定。你只需要展开“系统工具”节点，然后是“事件查看器”节点，最后选择“应用程序”节点即可查看存储在远程计算机应用程序日志中的事件。 |\n\n\
  ## 完整的脚本\n\n整个 VBScript 组装如下。当执行时，它将按顺序运行每个报告和日志分析脚本。此外，在每个月的第一个天，它将运行存档管理脚本。\n\n\
  ```\n '*************************************************************************\n\
  'Script Name: Script 19.1.vbs\n'Author: Jerry Ford\n'Created: 03/22/03\n'Description:\
  \ 此脚本运行报告和日志分析脚本，\n'一次运行一个，在运行下一个脚本之前等待每个脚本完成。\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\nOn Error Resume Next\n\nDim WshShl\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n\n'主处理部分\n\nRunScript(\"ErrorAnalyzer.vbs\")\nRunScript(\"SalesAnalyzer.vbs\"\
  )\nRunScript(\"ReturnsAnalyzer.vbs\")\nRunScript(\"ProductionAnalyzer.vbs\")\n\n\
  If Day(date()) = 1 Then\n  RunScript(\"ArchiveManager.vbs\")\nEnd If\n\n'终止脚本执行\n\
  WScript.Quit()\n'程序部分\n\nSub RunScript(ScriptName)\n  WshShl.Run ScriptName, 1,\
  \ True\nEnd Sub\n\nSub WriteToEventLog()\n  WshShl.LogEvent 4, \"Report and Log\
  \ Analyzer Scheduler Script executing.\"\nEnd Sub\n```\n\n### 设置每日自动脚本执行计划\n\n现在\
  \ Molly 已经写好了脚本，她需要创建一个计划任务来每天早上运行它，她决定在每天凌晨 4:00 运行。报告通常在每天午夜准备好进行处理，而服务器上接着运行的夜间备份作业通常在凌晨\
  \ 2:00 完成。Molly 认为，通过额外增加两个小时，她就可以运行她的脚本，而不必担心报告是否准备就绪或备份作业是否仍在处理。\n\nMolly 想过编写另一个\
  \ VBScript 来为 `MstrSched.vbs` 脚本设置计划任务。然而，考虑到这是一个次性设置任务，她认为没有必要专门为此任务又编写另一个脚本。相反，她将按照后续步骤概述使用“计划任务向导”。\n\
  \n1. 点击“开始”，然后点击“控制面板”。打开控制面板。\n2. 点击“性能和维护”。打开“性能和维护”文件夹。\n3. 点击“计划任务”。打开“计划任务”文件夹，如图\
  \ 19.4 所示。\n    ![点击展开展开](img/fig19-4_0.jpg)\n    图 19.4：计划任务文件夹为管理所有计划任务提供了中心点\n\
  4. 每一个当前已计划的任务都会显示一个图标。要设置新的计划任务，双击“添加计划任务”图标。计划任务向导启动。点击“下一步”。\n5. 向导提示你选择一个你想为其设置自动计划的程序，如图\
  \ 19.5 所示。\n    ![点击展开展开](img/fig19-5_0.jpg)\n    图 19.5：计划任务向导会自动列出可以自动执行的应用程序列表\n\
  6. 点击“浏览”。出现“选择要计划的程序”对话框。使用此对话框找到 `MstrSched.vbs` 脚本，如图 19.6 所示。\n7. 选择你的脚本并点击“打开”。\n\
  8. 向导提示你为计划任务提供名称并选择一种计划类型，如图 19.7 所示。选择“每天”并点击“下一步”。\n9. 提示你提供计划任务运行的特定时间，如图 19.8\
  \ 所示。在“开始时间”字段中输入 `4:00 A.M.`。在对话框的“执行此任务”部分选择“每天”选项并点击“下一步”。\n10. 接下来提示你指定用户账户的名称及其密码，如图\
  \ 19.9 所示。Molly 在用户名字段中输入 `ScriptSchlr`，并在对话框的两个密码字段中输入账户密码。\n11. 向导宣布它已成功创建了新的计划任务。点击“完成”。新的计划任务现在将显示在“计划任务”文件夹中。\n\
  \n\n\n\n\nMolly 需要编写的最后一个脚本将用于安排在每月第一天执行。它的任务是删除安装了订单/库存系统的 Windows 2000 服务器上，`D:\\\
  Order_Inventory\\SummaryRpts` 文件夹中存储的所有摘要报告文件，如图图 20.1 所示。\n\n![点击展开](img/fig20-1_0.jpg)\n\
  \n图 20.1：SummaryRpts 文件夹用于维护至少一个月摘要报告的存档集合\n\n当脚本执行时，它将确定当前月份，然后删除两个月之前的月份的所有摘要报告文件。换句话说，如果脚本在\
  \ 3 月 1 日运行，它将删除 1 月份的所有摘要报告文件，而保留 2 月的所有报告。\n\n除了删除旧存档文件外，该脚本每次执行时还会向 Windows 应用程序事件日志记录一条消息。它还包含逻辑，通过仅允许在每月的第一天执行来防止其意外执行。\n\
  \n### 使用 FileSystemObject\n\nVBScript 提供了两个具有可用于删除文件方法的不同对象。第一个是 `FileSystemObject`\
  \ 对象的 `DeleteFile()` 方法。该方法使你能够一次性删除一个或多个文件的能力。该方法的语法如下所示。\n\n```\n ObjectReference.DeleteFile\
  \ ( FileName[, Kill])\n```\n\n`ObjectReference` 是代表 `FileSystem Object` 实例的变量。`FileName`\
  \ 是要删除文件的完整名称和路径。可以使用通配符来指定删除多个文件。\n\n`Force` 是一个可选参数，当设置为 `True` 时，允许删除只读文件。\n\n\
  | | 备注 | `FileSystemObject` 对象还通过其 `CopyFile()` 和 `DeleteFile()` 方法提供了复制和移动文件的能力。\
  \ |\n\n以下 VBScript 语句演示了如何使用 `DeleteFile()` 方法删除位于 `D:\\Temp` 的名为 `TestFile.txt`\
  \ 的文件。\n\n```\n Set FsoObject = CreateObject(\"Scripting.FileSystemObject\")\nFsoObject.DeleteFile\
  \ \"d:\\Temp\\TestFile.txt\"\n```\n\n| | 备注 | 如果 `DeleteFile()` 方法没有找到至少符合 `DeleteFile()`\
  \ 语句指定标准的文件，则会发生错误。 |\n\n如果 `TextFile.txt` 是只读文件，那么前面的示例将失败。然而，通过如下所示修改示例，可以处理这种情况。\n\
  \n```\n Set FsoObject = CreateObject(\"Scripting.FileSystemObject\")\nFsoObject.DeleteFile\
  \ \"d:\\Temp\\TestFile.txt\", True\n```\n\n通过添加通配符，你可以一次性删除多个文件，如下所示。\n\n```\n Set\
  \ FsoObject = CreateObject(\"Scripting.FileSystemObject\")\nFsoObject.DeleteFile\
  \ \"d:\\Temp\\*.txt\", True\n```\n\n在此示例中，`D:\\Temp` 文件夹中所有具有 `.txt` 扩展的文件都将被删除。\n\
  \n### 使用 File 对象\n\n作为使用 `FileSystemObject` 对象方法的替代方案，你可以使用属于 `File` 对象的方法。使用 `File`\
  \ 对象方法，你可以直接管理单个文件。这些方法提供了复制、移动和删除文件的能力，如表 20.1 所示。\n\n表 20.1：File 对象方法\n\n| 方法\
  \ | 说明 |\n\n| --- | --- |\n\n| `Copy()` | 将单个文件或文件夹复制到指定位置 |\n| `Move()` | 将单个文件或文件夹移动到指定位置\
  \ |\n| `Delete()` | 删除指定的或或文件夹 |\n| | 备注 | `File` 对象的 `Copy()`、`Move()` 和 `Delete()`\
  \ 方法能够作用于文件和文件夹。因此，在使用这些方法时要非常小心，因为例如，如果文件和子文件夹具有相同名称，很容易不小心删除位于文件同一文件夹下的子文件夹。 |\n\
  \n你可以使用 `File` 对象的 `Delete()` 方法删除单个文件。然而，由于该方法支持支持一次删除一个文件，在指定要删除的文件名时不能使用通配符。`File`\
  \ 对象的 `Delete()` 方法的语法如下所示。\n\n```\n ObjectReference.Delete( Force )\n```\n\n`ObjectReference`\
  \ 是代表 `FileSystem Object` 实例的变量。`Force` 是一个可选布尔值，当设置为 `True` 时允许删除只读文件夹。\n\n| |\
  \ 备注 | 如果 `Delete()` 方法无法找到匹配的文件名（例如，如果指定的文件不存在），则会发生错误。 |\n\n要使用 `File` 对象的 `Delete()`\
  \ 方法，你必须首先实例化 `FileSystemObject`，如下所示。\n\n```\n Set FsoObject = CreateObject(\"\
  Scripting.FileSystemObject\")\n```\n\n接下来，你需要使用 `FileSystemObject` 对象的 `GetFile()`\
  \ 方法来获取你打算删除的文件引用。\n\n```\n Set TargetFile = FsoObject.GetFile(\"d:\\Temp\\TestFile.txt\"\
  )\n```\n\n最后，你可以删除该文件。\n\n```\n TargetFile.Delete()\n```\n\n| | 备注 | `FileSystemObject`\
  \ 对象的 `GetFile()` 方法具有以下语法：\n\n```\n ObjectReference.GetFile(FileName)\n```\n\n\
  `ObjectReference` 是代表 `FileSystem Object` 实例的变量。`FileName` 是要管理的文件的完整名称和路径。如果传递给\
  \ `GetFile()` 的文件不存在，将发生错误。\n\n### 构建脚本所需的所需的 VBScript\n\n在思考如何开发存档脚本时，Molly 决定使用\
  \ `FileSystemObject` 对象的 `DeleteFile()` 方法而不是 `File` 对象的 `Delete()` 方法。通过 `DeleteFile()`，她能够按月删除摘要报告。\n\
  \nMolly 还想在脚本运行时在事件日志中记录一条消息，以便有一个其执行记录。她将需要使用 `WshShell` 对象的 `LogEvent()` 方法。此外，在执行确定删除月份文件的子程序时，她需要学习使用内置的\
  \ VBScript `Instr()` 函数。\n\n### WshShell 对象的 LogEvent() 方法\n\n曾经，Molly 想过为她的应用程序创建一个自定义日志文件，脚本在执行时追加消息。她最终放弃了这个想法，认为这样做得不偿失，而是改为利用\
  \ Windows 应用程序事件日志。为了做到这一点，她将需要使用 `WshShell` 对象的 `LogEvent()` 方法，该方法的语法如下。\n\n```\n\
  \ ObjectReference.LogEvent(intEventType, strMsg [, strComputer])\n```\n\n`ObjectReference`\
  \ 是代表 `FileSystem Object` 实例的变量。`IntEventType` 是指定事件类型的数值值。表 20.2 提供了可用事件类型的列表。`StrMsg`\
  \ 代表要在应用程序事件日志中记录的消息，`strComputer` 是可选参数，指定发送事件的另一个计算机名称或 IP 地址。如果省略，事件将记录在本地。\n\
  \n表 20.2：Windows 事件类型\n\n| 数值 | 说明 |\n\n| --- | --- |\n\n| 0 | 指定成功事件 |\n| 1 | 指定错误事件\
  \ |\n| 2 | 指定警告事件 |\n| 4 | 指定信息事件 |\n| 8 | 指定成功审计事件 |\n| 16 | 指定失败审计事件 |\n\n\n\n\
  \n\nWindows NT、2000 和 XP 均维护应用程序事件日志。在 Windows 98 和 Me 上，应用程序事件存储在 `log` 中，该文件与\
  \ Windows 系统文件位于同一文件夹（通常为 `C:\\Windows`）。\n\n以下示例演示了如何使用 `LogEvent()` 方法向应用程序事件日志写入消息。\n\
  \n```\n Set Wsh = WScript.CreateObject(\"WScript.Shell\")\nWsh.LogEvent 1, \"Test\"\
  \n```\n\n如下例所示，`LogEvent()` 方法在成功向 Windows 事件日志写入消息时会返回布尔值 `True`，在写入消息失败时则返回 `False`\
  \ 值。\n\n```\n Set Wsh = WScript.CreateObject(\"WScript.Shell\")\nintAge = GetUserAge()\n\
  If intAge <= 18 Then\n  Wsh.LogEvent 1, \"Error - User not authorized to execute\"\
  \nElse\n  Wsh.LogEvent 0, \"Script executing\"\nEnd If\n\nFunction GetUserAge()\n\
  \  GetUserAge = InputBox(\"How old are you?\")\nEnd Function\n```\n\n在此示例中，程序将检查用户输入的数字以确定脚本是否应该执行。如果用户大于\
  \ 18 岁，则允许脚本执行，否则不允许。将根据用户的年龄在应用程序事件日志中记录不同的消息。\n\n### 内置 VBScript Instr() 函数\n\n\
  Molly 在归档管理脚本中需要执行的操作之一，是确定需要从系统中删除哪个月的摘要报告。为了完成这项任务，她将需要利用多个不同的 VBScript 函数，包括\
  \ `Instr()`、`Mid()` 和 `Date()`。`Mid()` 函数已在第 17 章中引入，`Date()` 函数在第 19 章中引入。`Instr()`\
  \ 函数提供了检索数值值的能力，表示一个字符串在另一个字符串中首次出现的位置。其语法概述如下。\n\n```\n InStr([StartPosition,]\
  \ String1[, CompType])\n```\n\n`StartPosition` 是一个可选参数，用于指定搜索在 `String1` 中开始的字符位置。`String1`\
  \ 代表要搜索的表达式。`String2` 代表要查找的字符串。`CompType` 是一个可选数值值，用于指定比较类型。值 `0` 表示二进制比较，值 `1`\
  \ 表示文本比较。`Instr()` 方法返回的值根据多个标准而异。\n\n#### 表 20.3: Instr() 返回值\n\n| 数值 | 条件 |\n\
  | --- | --- |\n| `0` | `String1` 长度为零 |\n| `Null` | `String1` 为空 |\n| `Null` | `String2`\
  \ 为空 |\n| `0` | `String2` 长度为零 |\n| `0` | 在 `String1` 中未找到 `String2` |\n| `0` |\
  \ `StartPosition` 大于 `String2` 的长度 |\n| 找到的位置 | 在 `String1` 中找到了 `String2` |\n\n\
  ## 编写归档管理脚本\n\nMolly 现在已经熟悉开始编写归档管理脚本所需的所有知识。和她的所有其他脚本一样，她计划遵循标准设计，将脚本分为三个主要部分，并尽可能将对象和变量值本地化。\n\
  \n### 初始化部分\n\n在所示的“初始化部分”（Initialization Section）中，Molly 定义了两个字符串变量。`strVerifyExecutionSchedule`\
  \ 变量将在“主处理部分”（Main Processing Section）中使用，用于存储指示脚本是否允许运行的值（例如，今天是否为每月的第一天）。`strDeleteMonth`\
  \ 变量将用于存储代表要删除的月份摘要报告文件的值。该变量被脚本中的多个过程使用。\n\n```\n Option Explicit\n\nDim strVerifyExecutionSchedule,\
  \ strDeleteMonth\n```\n\n### 主处理部分\n\n在下一页所示的“主处理部分”（Main Processing Section）中，Molly\
  \ 首先调用名为 `OkToRunToday()` 的子程序来确定今天是否是每月的第一天。如果是，返回值为 `Yes`。接下来设置一个 `If...Then...Else`\
  \ 语句来控制多个过程的执行。如果 `strVerifyExecutionSchedule` 表明今天是每月的第一天，则按照所示所示顺序调用以下过程：\n\n\
  * `MonthToDelete()` 确定应该删除哪个月的摘要报告文件。\n* `WriteToEventLog()` 将作为变量传递的文本字符串写入 Windows\
  \ 应用程序事件日志。\n* `RemoveOldSummaryFiles()` 执行旧摘要报告文件的实际删除。\n\n如果脚本不是在每月的第一天运行，则向 `WriteToEventLog()`\
  \ 子程序传递一条指示脚本无法执行的文本消息，并执行 `WScript` 对象的 `Quit()` 方法以执行受控的脚本终止。\n\n```\n strVerifyExecutionSchedule\
  \ = OkToRunToday()\n\nIf strVerifyExecutionSchedule = \"Yes\" Then\n  MonthToDelete()\n\
  \  WriteToEventLog(\"Summary Report executing.\")\n  RemoveOldSummaryFiles()\nElse\n\
  \  WriteToEventLog(\"Summary Report execution - invalid schedule.\")\n  WScript.Quit()\n\
  End If\n```\n\n### OkToRunToday 子程序\n\n所示的 `OkToRunToday()` 子程序使用内置的 VBScript `Day()`\
  \ 和 `Date()` 函数来确定脚本是否在每月的第一天执行。\n\n```\n Function OkToRunToday()\n  If Day(Date())\
  \ = 1 Then\n    OkToRunToday = \"Yes\"\n  Else\n    OkToRunToday = \"No\"\n  End\
  \ If\nEnd Function\n```\n\n### MonthToDelete() 子程序\n\n所示的 `MonthToDelete()` 子程序负责确定删除哪个月的摘要报告。它首先定义两个本地变量。`intGetSlashPosition`\
  \ 变量用于存储日期中第一个斜杠（`/`）字符的位置。`strCurrentMonth` 变量将存储表示当前月份的数值。\n\n赋值给 `intGetSlashPosition`\
  \ 的值是通过使用 `Instr()` 函数在 `Date()` 函数获取的日期中搜索斜杠（`/`）字符确定的。`strCurrentMonth` 的值是通过使用\
  \ `Mid()` 函数解析日期的月份部分（格式为 `mm/dd/yyyy`）得到的。月份值通过提取从第一个字符到第一个斜杠（`/`）字符的所有字符来解析（即\
  \ `intGetSlashPosition - 1`）。\n\n`strDeleteMonth` 的值通过从 `strCurrentMonth` 减 2 。例如，如果日期是\
  \ 3 月 1 日，`strDeleteMonth` 的值将为 1（3 – 2 = 1）。随后设置两个 `If...Then` 语句，在当前月份为二月或一月时调整\
  \ `strDeleteMonth` 的值。如果当前月份是二月，则 2 – 2 等零。在这种情况下应该删除的月份是十二月，第一个 `If` 语句将检查赋值给 `strDeleteMonth`\
  \ 的值是否为 0，如果是则将其改为 12。同样，如果当前月份是一月，`strDeleteMonth` 的值将调整为 11（11 月）。\n\n```\nFunction\
  \ MonthToDelete()\n  Dim intGetSlashPosition, strCurrentMonth, strDeleteMonth\n\
  \  intGetSlashPosition = Instr(Date(), \"/\")\n  strCurrentMonth = Mid(Date(), 1,\
  \ intGetSlashPosition - 1)\n  strDeleteMonth = CInt(strCurrentMonth) - 2\n  If strDeleteMonth\
  \ = 0 Then\n    strDeleteMonth = 12\n  ElseIf strDeleteMonth < 1 Then\n    strDeleteMonth\
  \ = 11\n  End If\n  ' 后续为删除文件的代码\nEnd Function\n```\n\n\n\n```\n Sub MonthToDelete()\n\
  \n  Dim intGetSlashPosition, strCurrentMonth\n\n  intGetSlashPosition = Instr(Date(),\
  \ \"/\")\n  strCurrentMonth = Mid(Date(), 1, intGetSlashPosition - 1)\n\n  strDeleteMonth\
  \ = strCurrentMonth - 2\n\n  If strDeleteMonth = 0 Then\n    strDeleteMonth = \"\
  12\"\n  End If\n\n  If strDeleteMonth = -1 Then\n    strDeleteMonth = \"11\"\n \
  \ End If\n\nEnd Sub\n```\n\n### RemoveOldSummaryFiles() 子程序\n\n下所示的 `RemoveOldSummaryFiles()`\
  \ 子程序负责从 `D:\\Order_Inventory\\SummaryRpts` 摘要报告存档文件夹中删除两个月之前的摘要报告。它首先设置一个 `FileSystemObject`\
  \ 实例，并定义一个名为 `strSummaryRptPath` 的变量，然后将其设为存储摘要报告的文件夹位置。\n\n该子程序的最后一条语句使用 `FileSystemObject`\
  \ 对象的 `DeleteFile()` 方法来删除两个月之前的摘要报告文件。这是通过拼接部分信息实现的。第一部分信息是 `SummaryRpts` 文件夹的路径。接着加上当前月份的数值，最后跟上\
  \ `*_SumRpt.txt`。例如，如果今天是 2003 年 3 月 1 日，那么传递给 `DeleteFile()` 方法的值将是 `D:\\Order_Inventory\\\
  SummaryRpts\\01_SumRpt.txt.`。\n\n```\n Sub RemoveOldSummaryFiles()\n\n  Dim FsoObject,\
  \ strSummaryRptPath\n  strSummaryRptPath = \"d:\\Order_Inventory\\SummaryRpts\\\"\
  \n\n  Set FsoObject = WScript.CreateObject(\"Scripting.FileSystemObject\")\n  FsoObject.DeleteFile\
  \ strSummaryRptPath & strDeleteMonth & \"*_SumRpt.txt\"\n\nEnd Sub\n```\n\n### WriteToEventLog()\
  \ 子程序\n\n下所示的 `WriteToEventLog()` 子程序设置了一个 `WshShell` 对象的实例，然后使用它的 `LogEvent()`\
  \ 方法向 Windows 应用程序事件日志写入写入信息消息。\n\n```\n Sub WriteToEventLog(strMessage)\n\n  Dim\
  \ WshShl\n\n  Set WshShl = WScript.CreateObject(\"WScript.Shell\")\n\n  WshShl.LogEvent\
  \ 4, strMessage\n\nEnd Sub\n```\n\n### 完整组合的脚本\n\n一旦完全组装所示存档管理脚本，Molly 就可以将其副本存放在存放订单/库存系统的\
  \ Windows 2000 服务器的 `D:\\VBScripts` 文件夹中，并允许上一章开发的 `MstrSched.vbs` 脚本每月自动执行它。\n\n\
  ```\n '*************************************************************************\n\
  'Script Name: Script 20.1.vbs\n'Author: Jerry Ford\n'Created: 03/22/03\n'Description:\
  \ 此脚本删除除了今天的摘要文件和上个月文件之外的所有\n'摘要报告文件。\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nDim strVerifyExecutionSchedule, strDeleteMonth\n\n\
  '主处理部分\n\nstrVerifyExecutionSchedule = OkToRunToday()\n\nIf strVerifyExecutionSchedule\
  \ = \"Yes\" Then\n  MonthToDelete()\n  WriteToEventLog(\"Summary Report Archive\
  \ Manager executing.\")\n  RemoveOldSummaryFiles()\nElse\n  WriteToEventLog(\"Summary\
  \ Report Archive Manager execution \" & _\n    \"terminated - invalid execution\
  \ schedule.\")\n  WScript.Quit()\nEnd If\n\n'终止脚本执行\nWScript.Quit()\n\n'过程部分\n\n\
  Function OkToRunToday()\n\n  If Day(Date()) = 1 Then\n    OkToRunToday = \"Yes\"\
  \n  End If\n\nEnd Function\n\nSub MonthToDelete()\n\n  Dim intGetSlashPosition,\
  \ strCurrentMonth\n\n  intGetSlashPosition = Instr(Date(), \"/\")\n\n  strCurrentMonth\
  \ = Mid(Date(), 1, intGetSlashPosition - 1)\n\n  strDeleteMonth = strCurrentMonth\
  \ - 2\n\n  If strDeleteMonth = 0 Then\n    strDeleteMonth = \"12\"\n  End If\n\n\
  \  If strDeleteMonth = -1 Then\n    strDeleteMonth = \"11\"\n  End If\n\nEnd Sub\n\
  \nSub RemoveOldSummaryFiles()\n\n  Dim FsoObject, strSummaryRptPath\n  strSummaryRptPath\
  \ = \"d:\\Order_Inventory\\SummaryRpts\\\"\n\n  Set FsoObject = WScript.CreateObject(\"\
  Scripting.FileSystemObject\")\n\n  FsoObject.DeleteFile strSummaryRptPath & strDeleteMonth\
  \ & \"*_SumRpt.txt\"\n\nEnd Sub\n\nSub WriteToEventLog(strMessage)\n\n  Dim WshShl\n\
  \n  Set WshShl = WScript.CreateObject(\"WScript.Shell\")\n\n  WshShl.LogEvent 4,\
  \ strMessage\n\nEnd Sub\n```\n\n## 总结\n\n在本章中，你学习了如何使用 VBScript 的 `Instr()` 函数在文本字符串中搜索匹配模式。通过将此函数与\
  \ `Mid()` 和 `Date()` 函数结合，你可以在创建存档管理脚本时确定删除哪组文件。你还学习了文件管理的各种细节，包括如何删除一个或多个文件。最后，你学习了\
  \ `WshShell` 对象的 `LogEvent()` 方法以及如何使用它在 Windows 应用程序事件日志中记录消息。\n\n# 第四部分：专业项目 3——创建报告管理站\n\
  \n## 章节列表\n\n- [第 21 章]: 项目案例研究——创建集中式报告管理\n- [第 22 章]:开发设置脚本\n- [第 23 章]:收集远程报告\n\
  - [第 24 章]:数据处理与合并\n- [第 25 章]:存档管理\n\n### 项目 3 概述\n\n本章开始了一个新的项目案例研究。在这个项目中，你将观察\
  \ Molly Masterson 如何为 Intuit Tools 的订单/库存系统开发一个新的集中报告管理站。通过完成这个项目，你将进一步获得在之前的项目中涵盖的许多任务的经验。此外，你还将学习如何自动化许多新任务，包括：\n\
  \n- 在 Windows 注册表中存储和检索配置数据\n- 对存储在网络驱动器上的文件进行远程管理\n- 创建纯文本文件和 Microsoft Word 文件\n\
  - 发送通知弹窗消息，在合并后的报告可用时提供通知\n\n\n\n\n自从 Molly 完成订单/库存报告和日志分析脚本的开发与部署以来已经一个月。从那时起，Intuit\
  \ Mechanical Tools 发生了一项令人兴奋的新进展。上周，该公司获得了与当地州政府的一份为期五年的合同，这将要求其产量几乎增加一倍。新合同的首批订单将于一周后开始交付。由于这份新合同在某种程度上是一个意外，Intuit\
  \ Mechanical Tools 的每个人都必须手忙脚措以做好准备。\n\n作为处理日益增长的 IT 处理工作负载的短期解决方案，公司购买了一台新的 Windows\
  \ 2000 服务器，并计划在其上安装订单/库存系统。该服务器将用于处理所有来自新政府合同的销售和退货。与此同时，现有的 Windows 2000 服务器将继续处理来自所有现有客户的销售和退货。在未来的日期（一旦招聘了更多程序员人员），公司将致力于修改订单/库存系统，并整合管理来自两台\
  \ Windows 2000 服务器的所有数据。这意味着 Intuit Mechanical Tools 内部的多个部门必须更加努力，以整合来自两个来源的销售、退货和生产信息。\n\
  \n由于上一个项目的成功完成，计算机运营部门要求 Molly 开发一个自动化流程，从两台 Windows 2000 服务器检索摘要报告的副本，并将其存储位于运营控制中心内的专用\
  \ Windows 2000 专业工作站上。此外，运营部门希望 Molly 自动处理来自两台服务器的摘要报告，并创建一个单一的合并报告，他们希望对该报告保留为期三个月的存档。\n\
