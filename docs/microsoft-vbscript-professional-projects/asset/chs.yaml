  \ 免费获取\n*   为了完成第三个项目，需要访问局域网上的一个或多台计算机\n为了能够将书中提供的信息用于 Web 页面开发，你需要访问以下工具：\n\n\
  *   一台运行 Windows 操作系统的计算机\n*   一个纯文本或脚本编辑器\n## 本书使用的规范\n本书包含了许多特殊元素，旨在方便你阅读和操作。这些特殊元素概述如下：\n\
