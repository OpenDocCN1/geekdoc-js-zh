  \ | 根据提供的筛选标准对过滤后的元素集返回一个数组 |\n| `FormatCurrency` | 返回已格式化为货币值的表达式 |\n| `FormatDateTime`\
  \ | 返回已格式化为日期或时间值的表达式 |\n| `FormatPercent` | 返回已格式化为百分比的表达式（包括随后的 `%`） |\n| `GetLocale`\
  \ | 返回本地化 ID |\n| `GetObject` | 返回自动化对象的引用 |\n| `Hex` | 返回表示数字的十六进制字符串 |\n| `Hour`\
  \ | 返回一天中某小时的整数（0 到 23） |\n| `InputBox` | 返回对话框中的用户输入 |\n| `InStrRev` | 返回字符串中子字符串最后一次位置的结束位置\
  \ |\n| `Int` | 返回指定数字的整数部分 |\n| `IsArray` | 根据变量是否为数组返回 `True` 或 `False` |\n| `IsEmpty`\
