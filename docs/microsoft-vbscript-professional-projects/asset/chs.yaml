  \ ANSI 代码返回字符 |\n| `CLng` | 将表达式转换为 `Long` 变体并返回结果 |\n\n\n\n\n| 函数 | 说明 |\n| `Cos`\
  \ | 返回参数余弦值的三角函数 |\n| `CreateObject` | 创建一个自动化对象并返回其引用 |\n| `CSng` | 将表达式转换为 `Single`\
  \ 类型的变体子类型并返回结果 |\n| `DateAdd` | 在当前日期上增加额外的时间间隔并返回结果 |\n| `DateDiff` | 比较两个日期并返回它们之间的间隔数\
