  \n*   `MapNetworkDrive()`：建立到网络驱动器的连接\n*   `RemoveNetworkDrive()`：断开与网络驱动器的连接\n\n\
  ### 创建报告合并脚本\n\n处理从两个 Windows 2000 服务器收集的报告的方式将与第 18 章，“开发分析器](#LiB0091_split_000.html_776)”中描述的报告和日志文件的处理方式非常相似。然而，存在一些不同之处。例如，Molly\
  \ 在写入汇总报告时必须添加一列新列，以识别错误发生在哪种服务器。\n\n汇总报告的另一个新要求是在报告末尾汇总生产库存总额。这种总额汇总需要 VBScript\
  \ 根据零件号匹配行项目，以便计算每个项目的现有库存。\n\n为了开发生成汇总报告的 VBScript，Molly 需要使用以下 `FileSystemObject`\
  \ 对象方法：\n\n*   `FileExists()`：在尝试打开之前验证日志或报告文件是否存在\n*   `OpenTextFile()`：能够处理日志或报告文件的内容\n\
  *   `ReadLine()`：能够从 `INI` 文件中逐行读取\n*   `SkipLines()`：在读取文件时能够跳过标题行\n*   `Close()`：在处理完成后关闭\
  \ `INI` 文件\n*   `WriteLine()`：能够向摘要文件写入一行输出\n*   `WriteBlankLines()`：能够写入空行并格式化摘要文件中数据的呈现形式\n\
  \n\n\n\n\n- `D:\\Order_Inventory\\ConsolidatedRpts`。该目录存储了至少 90 天的汇总摘要报告，这些报告是由从\
  \ Serv0001 和 Serv0002 获取的单独摘要报告创建的。\n\nMolly 将使用 Windows 任务计划程序服务来每月自动执行此脚本。由于此脚本的调度是一项一次性任务，只需要在\
  \ Windows 2000 专业版工作站上执行，因此 Molly 将使用“计划任务向导”手动设置其计划执行任务。\n\n为了自动执行归档管理脚本，Molly\
  \ 将需要使用以下 `FileSystemObject` 对象方法：\n\n- `FileExists()`。在尝试打开文件之前，验证日志文件或报告文件是否存在。\n\
  - `MoveFile()`。将一个或多个文件移动到归档文件夹中，并至少保留一个月月。\n- `DeleteFile()`。在存储于归档文件夹的文件过 30 天保留期后，删除其中一个或多个文件。\n\
  \nMolly 还计划为此脚本提供通知功能，在脚本执行完成且汇总摘要报告准备好打印时通知运维人员。此脚本实现的通知技术将包括向 Windows 2000 专业版应用程序事件日志发布消息，以及在\
  \ Windows 2000 专业版工作站上创建弹出消息。为了完成这两个任务，Molly 将不得不使用 `WshShell` 对象的 `LogEvent()`\
  \ 方法和 Windows `Net Send` 命令。\n\n## 总结\n\n在本章中，你接触了一个新的项目案例研究。你获得了 Molly 从运维部门收集的信息的概述，以及项目需求列表。该项目开发了初步的高层级设计，并简要概述和解释了开发构成该项目的每个\
  \ VBScript 需要的主要 VBScript 语言结构。在接下来的四个章节中，你将有机会参与开发所有的 VBScript。\n\n# 第 22 章：开发设置脚本\n\
  \n在本章中，你将学习如何读取、写入和修改存储在 Windows 注册表的数据。你将学习注册表的基本设计以及它用于存储数据的结构。然后，你将通过创建一个新注册键的\
  \ VBScript 来应用这些信息。新键将存储包含配置信息的值，用于供 Molly 开发的在 Windows 2000 专业版集中式管理工作站上执行的所有 VBScript。\n\
  \n## 使用 Windows 注册表\n\nWindows 注册表是所有 Microsoft 操作系统中配置信息的内置数据库仓库。自 Windows 95 以来一直可用。微软和第三方硬件软件供应商使用\
  \ Windows 注册表来存储关于计算机几乎每个方面的信息，包括操作系统本身。\n\n通过更改注册表的内容，你可以管理计算机运行的许多方面，以及硬件和软件的操作。人们经常操作注册表，通常甚至不知道。用户对桌面进行多数更改都存储在注册表中。例如，你可以从\
  \ Windows 显示对话框手动修改 Windows 屏幕保护程序设置，或通过直接修改注册表来实现。\n\n| | 注意 | 要了解更多有关通过注册表管理 Windows\
  \ 屏幕保护程序的注册键和值，请参阅第 11 章，“自定义桌面](#LiB0056_split_000.html_477)”。 |\n\n注册表非常可靠。因此，大多数硬件和软件开发者已将数据从它们的\
  \ INI 文件迁移到此处。同样，你可以利用注册表作为所有 VBScript 配置设置的中央存储库，利用它的强大和便利性。\n\n### 检查注册表根键\n\n\
  注册表按分级结构组织，该结构与文件系统非常相似。层次顶端有五个根键或父键，有时也称为单元（hives）。表 22.1 列出了这些根键，并对它们存储的信息类型提供了简要描述。\n\
  \n表 22.1：注册表根键\n\n| 键 | 简写 | 描述 |\n| --- | --- | --- |\n| `HKEY_CLASSES_ROOT` |\
  \ `HKCR` | 存储有关 Windows 文件关联的信息 |\n| `HKEY_CURRENT_USER` | `HKCU` | 存储与当前登录计算机的用户相关的信息\
  \ |\n| `HKEY_LOCAL_MACHINE` | `HKLM` | 存储有关全局计算机设置的信息 |\n| `HKEY_USERS` | — | 存储关于共享该计算机的所有个人的信息\
  \ |\n| `HKEY_CURRENT_CONFIG` | — | 存储关于计算机当前硬件配置的信息 |\n\n### 理解数据如何存储\n\n位于注册表中的数据以值的形式存储，值表示与数据关联元素名称。值在许多方面可以比比文件，文件在\
  \ Windows 文件系统上存储数据。值组织在键中，键充当某种文件夹或容器。注册键是一个存储值或其他注册键的容器。数据以以下格式存储在注册表中：\n\n```\n\
  \ Key : KeyType : Value\n```\n\n`Key` 代表注册键的完全限定名称。`KeyType` 指定该键存储的数据的类型。注册表存储了多种不同类型的数据，如表\
  \ 22.2 所示。`Value` 指定要存储的实际数据。\n\n表 22.2：注册表数据类型\n\n| 类型 | 描述 |\n| --- | --- |\n\
  | `REG_NONE` | 用于存储未定义类型 |\n| `REG_BINARY` | 用于存储二进制值 |\n| `REG_SZ` | 用于存储字符串 |\n\
  | `REG_EXPAND_SZ` | 用于存储扩展字符串，例如 `%COMPUTERNAME%` |\n| `REG_MULTI_SZ` | 用于存储多个字符串\
  \ |\n| `REG_LINK` | 微软保留使用的类型 |\n| `REG_DWORD` | 用于存储 32 位整数 |\n| `REG_DWORD_BIG_ENDIAN`\
  \ | 用于以大端格式存储 32 位整数 |\n| `REG_DWORD_LITTLE_ENDIAN` | 用于以小端格式存储 32 位整数 |\n| `REG_QWORD`\
  \ | 用于存储 64 位整数 |\n| `REG_QWORD_LITTLE_ENDIAN` | 用于以小端格式存储 64 位整数 |\n| `REG_RESOURCE_LIST`\
  \ | 用于存储设备驱动列表 |\n\n| | 注意 | 像 Windows NTFS 文件系统管理的每个文件和文件夹一样，每个 Windows 2000 注册键和值都使用安全权限保护。为了读取或修改注册键或值，你需要相应的安全权限。\
  \ |\n\n### 手动访问注册表数据\n\nWindows 注册表中存储的数据在计算机正常运行期间经常修改，大多数人完全不知道他们所做的更改实际上存储在注册表中。此外，许多用于配置各种\
  \ Windows 功能的 Windows 控制面板程序实际上只是用户友好的注册表界面。使用控制面板程序的优势在于，它们隐藏了注册表的复杂性并提供了数据验证，从而防止无效数据被添加到注册表中。\n\
  \n你也可以使用所有 Windows 操作系统提供的 Regedit 工具直接查看 Windows 注册表的内容，如图 22.1](#LiB0112_split_001.html_ch22fig01)\
  \ 所示。使用 `Regedit`，你可以查看、添加、修改和删除注册键和值。\n\n![点击展开](img/fig22-1_0.jpg)\n\n\n\n\n\n\
  图 22.1：使用 Regedit 工具查看存储在注册表中的 Windows 显示设置\n\n图 22.1 显示了注册表的五个高级根键。`HKEY_CURRENT_CONFIG`\
  \ 键已展开以显示当前的 Windows 显示设置，所有这些设置都存储为字符串值（数据类型 `REG_SZ`）。\n\n| | 注意 |\n| :--- | :---\
  \ |\n| | 如果您使用的是 Windows NT、2000 或 XP，那么您还可以使用 `Regedt32` 工具编辑注册表。 |\n| | 在使用 Regedit\
  \ 或 `Regedt32` 直接编辑 Windows 注册表时请务必极其小心。这两个工具都不提供“撤销”功能。在修改 Windows 注册表时不不小心出错可能会对计算机产生潜在的灾难性影响，甚至导致其无法运行。如果您不确定对注册表进行特定更改的影响，请勿进行操作。\
  \ |\n\n## 使用 VBScript 和 WSH 程序化修改注册表\n\nWSH 通过 `WshShell` 对象访问 Windows 注册表。使用属于该对象的方法，您可以创建\
  \ VBScript 脚本来创建、修改和删除注册表键及值。`WshShell` 对象提供的注册表操作方法如下：\n\n*   `RegWrite()`。创建新的注册表键和值，或修改现有的注册表键和值\n\
  *   `RegRead()`。检索存储在注册表键和值中的数据\n*   `RegDelete()`。删除存储在注册表键和值中的数据\n\n| | 注意 |\n\
  | :--- | :--- |\n| | 注意，与许多支持通过网络连接进行远程资源管理的 WSH 对象不同，与 `WshShell` 对象相关的注册表操作方法不提供管理远程计算机上\
  \ Windows 注册表的能力。 |\n\n### 使用 RegWrite() 方法\n\n为了使用 `WshShell` 对象的注册表操作方法，您必须首先在脚本中实例化\
  \ `WshShell` 对象。完成后，您就可以使用 `RegWrite()` 方法。该方法提供了向 Windows 注册表写入的能力。具体而言，它提供了以下功能：\n\
  \n*   创建新的注册表键\n*   向注册键添加值并为其分配数据\n*   修改现有的值赋值\n\n`RegWrite()` 方法具有以下语法：\n\n```\n\
  \ ObjectReference.RegWrite(Name, Value [, Type])\n```\n\n`ObjectReference` 是代表 `WshShell`\
  \ 对象实例的变量。`Name` 指定要创建或修改的键或值。`Value` 指定新键的名称、要添加到现有键的值的名称，或者要分配给现有值的数据。`Type` 是一个可选参数，用于指定与值关联的数据类型（字符串值）。\n\
  \n在指定注册表键时，`Name` 的值必须以反斜杠字符（`\\`）结尾。在指定注册表值时，则省略反斜杠字符。\n\n`RegWrite()` 方法会自动将 `Value`\
  \ 参数转换为字符串或整数。当指定时，`Type` 参数将标识用于存储数据的数据类型。尽管 Windows 注册表能够存储许多类型的数据，如表 22.2 所示，但\
  \ `RegWrite()` 方法仅支持这些方法的子集，列如下：\n\n*   `REG_SZ`\n*   `REG_EXPAND_SZ`\n*   `REG_DWORD`\n\
  *   `REG_BINARY`\n\n| | 注意 |\n| :--- | :--- |\n| | `RegWrite()` 方法不支持 `REG_MULTI_SZ`\
  \ 数据类型，但 `RegRead()` 方法支持。 |\n\n要使用 `RegWrite()` 方法，您只需要提供一个新注册表键或值的名称，并指定其在注册表五个根键之一下的完全限定位置。\n\
  \n| | 提示 |\n| :--- | :--- |\n| | 每个注册表键都包含一个默认值，其默认数据类型为 `REG_NONE`。如果您需要，可以更改默认值的数据类型和分配的数据。\
  \ |\n\n以下示例演示了如何创建一个注册表键和值。\n\n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\"\
  )\nWshShl.RegWrite \"HKCU\\TestKey\\EventLogging\", \"Enabled\"\n```\n\n执行该示例时，它会创建键\
  \ `HKCU\\TestKey\\` 并添加一个名为 `EventLogging` 的新值，然后为其分配字符串 `\"Enabled\"`，如图 22.2 所示。\n\
  \n![点击展开](img/fig22-2_0.jpg)\n\n图 22.2：查看新的注册表键和值\n\n您可以使用 `RegWrite()` 方法来修改现有的注册表键或值，如下所示。\n\
  \n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nWshShl.RegWrite \"\
  HKCU\\TestKey\\EventLogging\", \"Disabled\"\n```\n\n在此示例中，分配给 `EventLogging` 值的数据被设置为\
  \ `Disabled`。您也可以更改键的默认值，如下所示。\n\n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\"\
  )\nWshShl.RegWrite \"HKCU\\TestKey\\\", \"Author: Jerry\", \"REG_SZ\"\n```\n\n在此示例中，`Name`\
  \ 的值必须以反斜杠结尾。注意，在此示例中没有提供值名称，因此该方法分配了键的默认值。正如示例中显式指定了数据类型为 `REG_SZ` 所示。\n\n```\n\
  \ Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nWshShl.RegWrite \"HKCU\\\
  TestKey\\DebugMode\", \"Disabled\"\nWshShl.RegWrite \"HKCU\\TestKey\\NetworkNotification\"\
  , \"Enabled\"\n```\n\n图 22.3 显示了运行上述示例后 `TestKey` 键及其值的状态。\n\n![点击展开](img/fig22-3_0.jpg)\n\
  \n### 使用 RegRead() 方法\n\n一旦您添加了注册表键和值，就可以使用 `WshShell` 对象的 `RegRead()` 方法检索它们。该方法具有以下语法：\n\
  \n```\n ObjectReference.RegRead(Name)\n```\n\n`ObjectReference` 是代表 `WshShell` 对象实例的变量。`Name`\
  \ 指定要检索的键或值。`RegRead()` 方法可以从 Windows 注册表中检索任何任何数据类型：\n\n*   `REG_BINARY`\n*   `REG_DWORD`\n\
  *   `REG_EXPAND_SZ`\n*   `REG_MULTI_SZ`\n*   `REG_SZ`\n\n以下示例演示了如何检索并显示由示例创建的值之一。\n\
  \n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nstrResult = WshShl.RegRead(\"\
  HKCU\\TestKey\\EventLogging\")\nMsgBox strResult\n```\n\n图 22.4 显示了此示例的输出。\n\n![点击展开](img/fig22-4_0.jpg)\n\
  \n图 22.4：使用 `RegRead()` 从注册表中检索数据\n\n如果您执行 `RegRead()` 操作并指定注册表键而不是值，那么该方法将返回分配给注册表键的默认值，如下所示。\n\
  \n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nstrResult = WshShl.RegRead(\"\
  HKCU\\TestKey\\\")\nMsgBox strResult\n```\n\n### 使用 RegDelete() 方法\n\n要删除注册表键或值，您需要学习如何使用\
  \ `RegDelete()` 方法。该方法具有以下语法：\n\n```\n ObjectReference.RegDelete(Name)\n```\n\n\
  `ObjectReference` 是代表 `WshShell` 对象实例的变量。`Name` 指定要删除的键或值。如果您指定一个注册表值，则该值将被删除。但是，如果您指定一个键，则该键及其存储在其下的所有值或子键都将被删除。\n\
  \n以下示例演示了如何删除注册表值。\n\n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\"\
  )\nWshShl.RegDelete \"HKCU\\TestKey\\EventLogging\"\n```\n\n\n\n\n同样，你可以通过指定完全限定键名并在后面加上反斜字符\
  \ `\\` 来删除整个键（以及其所有的子键和值），如下所示。\n\n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\"\
  )\nWshShl.RegDelete \"HKCU\\TestKey\\\"\n```\n\n### 预防注册表错误\n\n在使用 `RegRead()` 方法时，如果你指定了一个不存在的注册表键或值，将会发生错误，如图\
  \ 22.5 所示。\n\n![Click To expand](img/fig22-5_0.jpg)\n\n图 22.5：VBScript 尝试读取不存在的值时生成的错误示例\n\
  \n为了防止错误终止脚本的执行，你可以使用 `On Error Resume Next` 语句，然后添加逻辑来从错误中恢复。\n\n例如，以下过程演示了如何使用\
  \ `Err` 对象来判断 `RegRead()` 方法的执行是否成功。\n\n```\n On Error Resume Next\n\nSet WshShl\
  \ = WScript.CreateObject(\"WScript.Shell\")\n\nstrResult = WshShl.RegRead(\"HKCU\\\
  TestKey\\EventLogging\")\n\nIf Err <> 0 Then\n  MsgBox \"Add logic to proceed with\
  \ a default setting and to log an event \" & _\n  \"log message.\"\nEnd If\n```\n\
  \n如果 `RegRead()` 方法执行成功，示例将静默结束。然而，如果发生错误（例如值不存在），则会显示错误消息。\n\n|  | 注意事项 | 有关如何使用\
  \ `On Error Resume Next` 语句和 `Err` 对象的更多信息，请参阅第 6 章，“数据收集、通知和错误报告](#LiB0035_split_000.html_239)”。\
  \ |\n\n下一个示例是对前一个示例的扩展。它演示了如何在 VBScript 中创建一个函数，该函数可以在脚本尝试访问其内容之前，验证注册表键或值是否存在。\n\
  \n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\n\nstrRegKey = \"HKCU\\\
  TestKey\\EventLogging\"\n\nIf RegKeyExists(strRegKey) = True Then\n  strEvtLogStatus\
  \ = WshShl.RegRead(strRegKey)\nElse\n  strEvtLogStatus = \"Disabled\"\n    WshShl.LogEvent\
  \ 4, \"HKCU\\TestKey\\EventLogging not found - proceeding with \" & _\n      \"\
  default setting.\"\nEnd If\n\nFunction RegKeyExists(RegKey)\n\n  Dim strKeyToTest\n\
  \  RegKeyExists = True\n\n  On Error Resume Next\n\n  strKeyToTest = WshShl.RegRead(RegKey)\n\
  \n  If Err <> 0 Then\n    RegKeyExists = False\n  End If\n\nEnd Function\n```\n\n\
  此示例从实例化 `WshShell` 对象开始。然后，将名为 `strRegKey` 的变量赋值为 `HKCU\\TestKey\\EventLogging`。接下来，一个\
  \ `If` 语句执行名为 `RegKeyExists()` 的函数，并将 `strRegKey` 的值传递给它。该函数确定注册表键是否存在。如果存在，函数返回一个\
  \ `True` 值，并通过执行 `RegRead()` 方法将名为 `strEvtLogStatus` 的变量的值设为注册表值。如果函数返回的不是 `True`，则将\
  \ `strEvtLogStatus` 的值设置为默认设置。这允许脚本继续执行。一条信息消息也会写入 应用程序事件日志，如图 22.6 所示。\n\n![Click\
  \ To expand](img/fig22-6_0.jpg)\n\n图 22.6：当脚本发生错误时，写入 应用程序事件日志的消息格式检查\n\n`RegKeyExist()`\
  \ 函数接受一个参数，即注册表键或值的名称。它首先定义一个名为 `strKeyToTest` 的变量。接下来，它将一个与函数同名的变量赋一个默认值 `True`。\n\
  \n|  | 注意事项 | 函数通过将要返回的值赋值给与函数同名的变量，来向其调用语句返回结果。 |\n\n接下来，执行 `On Error Resume Next`\
  \ 语句。通过将此语句放在函数内部，其作用域被限于函数。下一条语句获取 `strKeyToTest` 变量并将其赋值为 `RegRead()` 方法返回的值。然后检查\
  \ `Err` 对象属性的默认属性，以确定是否发生了错误（即键或值是否存在）。如果发生了错误，则将 `RegKeyExists` 的值设置为 `False`。如果没有发生错误，则\
  \ `RegKeyExists` 的值将保持为函数开始时设置的 `True`。\n\n## 创建设置脚本\n\nMolly 现在准备好为她的新项目编写第一个脚本了。这个\
  \ VBScript 设置脚本将负责对注册表项进行一次性设置，这些项将被她项目中的其他脚本使用。具体而言，此脚本将创建一个名为 `HKLM\\Software\\\
  Intuit\\VBScripts\\MstSum` 的新注册表键。\n\n### 初始化部分\n\n所示的脚本“初始化部分”由三条语句组成。第一条语句开启了变量命名的强制执行。第二条语句定义了一个\
  \ `WshShell` 对象的变量以及另一个用于主处理部分判断脚本是否有权限运行的变量。该部分的最后一条语句初始化了 `WshShell` 对象。\n\n```\n\
  \ Option Explicit\n\nDim WshShl, IntResponse\n\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n```\n\n### 主处理部分\n\n所示的“主处理部分”首先调用 `GetPermissionToRun()` 函数。然后它使用一个\
  \ `If` 语句查询该函数返回的值，以判断其是否等于 6（即 Molly 在提示允许脚本继续执行时点击了“是”）。\n\n如果允许执行，脚本接下来将调用八次\
  \ `CreateRegistryEntries()` 子程序，并传递注册表值的名称和分配给它的数据。由于 `HKLM\\Software\\Intuit\\\
  VBScripts\\MstSum\\` 键在第一次调用 `CreateRegistryEntries()` 子程序时不存在，该键和所述值将被创建。其余的函数调用将在该键下存储附加值。一旦所有键创建完成，脚本将使用\
  \ `WScript` 对象的 `Quit()` 方法终止执行。\n\n\n\n\n```\n intResponse = GetPermissionToRun()\n\
  \nIf intResponse = 6 Then\n  CreateRegistryEntries\n    \"HKLM\\Software\\Intuit\\\
  VBScripts\\MstSumRpts\\EventLogging\", \"Enabled\"\n  CreateRegistryEntries\n  \
  \  \"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\DebugMode\", \"Disabled\"\n\
  \  CreateRegistryEntries\n    \"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\\
  NetworkNotification\", \"Enabled\"\n  CreateRegistryEntries\n    \"HKLM\\Software\\\
  Intuit\\VBScripts\\MstSumRpts\\NtkNotifiyList\", \"MJLF001\n    ASCK001\"\n  CreateRegistryEntries\n\
  \    \"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\Win2000Svrs\",\n    \"SERV0001\
  \ SERV0002\"\n  CreateRegistryEntries\n    \"HKLM\\Software\\Intuit\\VBScripts\\\
  MstSumRpts\\SharedFolder\", \"SumReports\"\n  CreateRegistryEntries\n    \"HKLM\\\
  Software\\Intuit\\VBScripts\\MstSumRpts\\RptArchive\",\n    \"d:\\Order_Inventory\\\
  LogFiles\"\n  CreateRegistryEntries\n    \"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\\
  RptFormat\", \"Text\"\nEnd If\n\nWScript.Quit()\n```\n\n### `GetPermissionToRun()`\
  \ 函数\n\n`GetPermissionToRun()` 函数使用内置的 VBScript `MsgBox()` 函数来显示提示框，在允许脚本继续执行之前获取确认。如果点击“是”按钮，则会向调用语句返回值\
  \ `6`。如果点击“否”按钮，则返回值 `7`。\n\n```\n Function GetPermissionToRun()\n  GetPermissionToRun\
  \ = MsgBox(\"This script creates registry keys and \" &_ _\n    \"values for the\
  \ VBScripts that run on the Windows 2000 \" & _\n    \"Professional centralized\
  \ management workstation.\" & vbCrLf & vbCrLf & _\n    \"Do you wish to continue?\"\
  , 4)\n\nEnd Function\n```\n\n### `CreateRegistryEntries()` 子程序\n\n所示的 `CreateRegistryEntries()`\
  \ 子程序接受两个输入参数。`Key_Value` 存储要创建的注册表项或值的名称，`Data` 包含分配的实际数据。`On Error Resume Next`\
  \ 语句是子程序的第一语句。添加它的目的是为了在创建单个注册表项或值发生错误时允许子程序继续执行。接下来，使用 `WshShell` 对象的 `RegWrite()`\
  \ 方法创建新项或值。然后检查 `Err` 对象的默认属性（`Err.Number`）以判断写入操作是否成功。使用 `MsgBox()` 函数显示确认信息，说明已创建或发生了错误。\n\
  \n```\n Sub CreateRegistryEntries(Key_Value, Data)\n\n  On Error Resume Next\n\n\
  \  WshShl.RegWrite Key_Value, Data\n\n  If Err <> 0 Then\n    MsgBox \"Error occurred\
  \ writing \" & Key_Value\n  Else\n    MsgBox Key_Value & \" Created successfully.\"\
  \n  End If\n\nEnd Sub\n```\n\n## 完整的脚本\n\n下面显示了完整的 VBScript 脚本。执行后，它将为 Molly 为这个新项目开发的其他脚本创建注册表项。\n\
  \n```\n '*************************************************************************\n\
  'Script Name: Script 22.1.vbs\n'Author: Jerry Ford\n'Created: 04/05/03\n'Description:\
  \ 这是用于 Windows 2000 专业版集中管理\n'工作站的设置脚本。它创建一个注册表项并为其分配\n'若干值，这些值将在此计算机上运行的 VBScript\
  \ 使用。\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\n\nDim WshShl, IntResponse\n\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n\n'主处理部分\n\nintResponse = GetPermissionToRun()\n\nIf intResponse\
  \ = 6 Then\n  CreateRegistryEntries\n    \"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\\
  EventLogging\", \"Enabled\"\n  CreateRegistryEntries\n    \"HKLM\\Software\\Intuit\\\
  VBScripts\\MstSumRpts\\DebugMode\", \"Disabled\"\n  CreateRegistryEntries\n    \"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\NetworkNotification\", \"Enabled\"\
  \n  CreateRegistryEntries\n    \"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\\
  NtkNotifiyList\", \"MJLF001\n    ASCK001\"\n  CreateRegistryEntries\n    \"HKLM\\\
  Software\\Intuit\\VBScripts\\MstSumRpts\\Win2000Svrs\",\n    \"SERV0001 SERV0002\"\
  \n  CreateRegistryEntries\n    \"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\\
  SharedFolder\", \"SumReports\"\n  CreateRegistryEntries\n    \"HKLM\\Software\\\
  Intuit\\VBScripts\\MstSumRpts\\RptArchive\",\n    \"d:\\Order_Inventory\\LogFiles\"\
  \n  CreateRegistryEntries\n    \"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\\
  RptFormat\", \"Text\"\n  End If\n\nWScript.Quit()\n\n'过程部分\n\nFunction GetPermissionToRun()\n\
  \n  GetPermissionToRun = MsgBox(\"This script creates registry keys and \" &_ _\n\
  \    \"values for the VBScripts that run on the Windows 2000 \" & _\n    \"Professional\
  \ centralized management workstation.\" & vbCrLf & vbCrLf & _\n    \"Do you wish\
  \ to continue?\", 4)\n\nEnd Function\n\nSub CreateRegistryEntries(Key_Value, Data)\n\
  \n  On Error Resume Next\n\n  WshShl.RegWrite Key_Value, Data\n\n  If Err <> 0 Then\n\
  \    MsgBox \"Error occurred writing \" & Key_Value\n  Else\n    MsgBox Key_Value\
  \ & \" Created successfully.\"\n  End If\n\nEnd Sub\n```\n\n\n\n\nMolly 通过复制并修改她为上一个项目开发的调度脚本，创建了下面所示的新脚本。\n\
  \n```\n '*************************************************************************\n\
  'Script Name: Script 23.1.vbs\n'Author: Jerry Ford\n'Created: 04/10/03\n'Description:\
  \ 此脚本运行以下脚本列表：\n'     远程摘要报告收集脚本\n'     报告合并脚本\n'     存档管理脚本\n'*************************************************************************\n\
  \n'初始化部分\n\nOption Explicit\nOn Error Resume Next\n\nDim WshShl\nSet WshShl = WScript.CreateObject(\"\
  WScript.Shell\")\n\n'主处理部分\n\nRunScript(\"SumRptRetrieve.vbs\")\nRunScript(\"RptConsolidator.vbs\"\
  )\nRunScript(\"ArchiveMgr.vbs\")\n\nIf Day(date()) = 1 Then\n  RunScript(\"ArchiveMgr.vbs\"\
  )\nEnd If\n\n'终止脚本执行\nWScript.Quit()\n\n'程序部分\n\nSub RunScript(ScriptName)\n  WshShl.Run\
  \ ScriptName, 1, True\nEnd Sub\n\nSub WriteToEventLog()\n  WshShl.LogEvent 4, \"\
  Master Scheduler Script executing.\"\nEnd Sub\n```\n\n## 创建网络文件夹\n\n接下来，Molly 访问了这两台\
  \ Windows 2000 服务器，并将 `d:\\Order_Inventory\\SumReports` 文件夹设置为共享文件夹。按照下面的步骤，她授予了\
  \ `ScriptSchd` 账户访问此新网络文件夹的权限。\n\n1. 登录到 Windows 2000 服务器后，Molly 双击“我的计算机”图标。打开“我的计算机”对话框。\n\
  2. 接着，她双击 `D:` 器，然后进入 `Order_Inventory` 文件夹。`Order_Inventory` 文件夹打开并显示其内容。\n3. Molly\
  \ 右键点击 `SummaryRpts` 文件夹，并在弹出菜单中选择“共享”选项。这将打开文件夹的“属性”对话框。\n4. 然后她选择“共享此文件夹”选项，并在“共享名称”字段中输入\
  \ `SumRpts`，如图 23.1 所示。\n   ![点击展开](img/fig23-1_0.jpg)\n   图 23.1：为每台 Windows 2000\
  \ 服务器上的 `SummaryRpts` 文件夹创建网络共享\n5. 接下来，她点击“权限”按钮。这将显示“SummaryRpts 权限”对话框。从这里，她可以指定哪些用户具有对共享文件夹的远程访问权限。她首先逐个选择所有当前定义的账户，并点击“删除”。然后她点击“添加”，并从显示的域账户列表中选择\
  \ `ScriptSchd` 账户。\n6. Molly 随后点击三次“确定”以关闭所有已打开的对话框。\n\n此时，`SummaryRpts` 文件夹已设置为共享网络文件夹，只有\
  \ `ScriptSchd` 域账户具有对该文件夹的远程访问权限。\n\n| | 注意 | Molly 也可以通过配置 NTFS 文件权限（替代或增加共享权限）来限制对\
  \ `SummaryRpts` 文件夹的本地和远程访问。 |\n\n### 设置到网络驱动器和文件夹的连接\n\n报告检索脚本的基本目的是从两台 Windows\
  \ 2000 服务器检索摘要报告文件。为了完成此任务，脚本必须能够访问每台服务器上报告所在的文件夹。这意味着脚本必须从执行脚本的 Windows 2000 专业版工作站到这些文件夹建立网络连接。\n\
  \n遗憾的是，网络驱动器连接与单个用户配置文件相关，因此只有当定义了网络驱动器或文件夹连接的用户当前登录计算机时，连接才可用。由于 Molly 在没有用户登录计算机的情况下使用\
  \ Windows 任务计划服务执行摘要报告检索脚本，因此脚本必须负责建立到每台 Windows 2000 服务器上共享文件夹的网连接。\n\n### 手动设置连接\n\
  \n连接到远程网络驱动器或文件夹的传统方法是为其创建一个驱动器映射。*映射驱动器*是一种逻辑网络连接，它使共享驱动器或文件夹看起来和操作起来就像本地连接到建立映射连接的计算机上一样。\n\
  \n| | 注意 | 为了映射到网络驱动器或文件夹，你必须在存在共享驱动器或文件夹的计算机上被授予适当级别的访问权限和许可。 |\n\n可以按照相同的步骤手动设置到网络驱动器或文件夹的任何连接，并且可以在任何\
  \ Windows 文件夹（包括 Windows 资源管理器和“我的计算机”文件夹）中执行。例如，下面的步骤概述了在名为 `SERV0002` 的计算机上创建名为\
  \ `SumReports` 的远程文件夹映射的步骤。\n\n1. 点击“开始”，然后点击“我的计算机”。出现“我的计算机”文件夹。\n2. 点击“工具”并选择“映射网络驱动器”菜单选项。出现“映射网络驱动器”对话框。\n\
  3. 从“驱动器”下拉列表中选择一个可用的驱动器号。\n4. 在“文件夹”字段中输入 `\\\\SERV0002\\SumReports`，如图 23.2 所示。\n\
  5. 要设置在下次登录时将恢复的持久性驱动器映射，请确保选中了“登录时重新连接”选项。否则，请取消此选项。\n   ![点击展开](img/fig23-2_0.jpg)\n\
  \   图 23.2：手动为网络文件夹创建连接\n6. 点击“完成”。映射网络驱动器”对话框关闭，并被显示网络文件夹内容的窗口取代，如图 23.3 所示。\n\
  \   ![点击展开](img/fig23-3_0.jpg)\n   图 23.3：查看映射文件夹的内容\n\n一旦建立了映射驱动器，你就可以像操作本地磁盘一样操作它（前提是你拥有安全权限）。\n\
  \n#### 使用 WshNetwork\n\n由于报告收集脚本将由任务计划服务运行，Molly 需要让其具备建立到每台 Windows 2000 服务器连接的能力。为了实现这一目标，Molly\
  \ 需要使用与 `WshNetwork` 对象相关的方法。\n\n`WshNetwork` 对象暴露了 Microsoft 网络上的许多相关资源。它提供了可以用于收集信息的属性。这些属性列如下。\n\
  \n* `ComputerName`\n* `UserDomain`\n* `UserName`\n\n除了这些方法外，`WshNetwork` 对象还提供了许多用于处理网络磁盘和打印机资源的方法。这些方法包括：\n\
  \n* `EnumNetworkDrives()`\n* `EnumPrinterConnection()`\n* `AddPrinterConnection()`\n\
  * `RemovePrinterConnection()`\n* `SetDefaultPrinter()`\n* `MapNetworkDrive()`\n\
  * `RemoveNetworkDrive()`\n\n| | 注意 | 要了解更多与 `WshNetwork` 对象相关的属性和对象，请参阅第 14 章](#LiB0071_split_000.html_617)“映射网络打印机和磁盘”。\
  \ |\n\n##### 映射驱动器连接\n\n为了自动化到网络驱动器的映射，Molly 需要学习如何使用 `WshNetwork` 对象的 `MapNetworkDrive()`\
  \ 方法。该方法的语法概述在第 14 章](#LiB0071_split_000.html_617)中。执行后，`MapNetworkDrive()` 方法将设置网络驱动器连接，允许脚本对由连接表示的网络驱动器进行移动、复制、创建和删除文件及文件夹。\n\
  \n以下 VBScript 演示了如何建立到网络驱动器或文件夹的临时连接。\n\n```vbbs\n Dim WshNtk\nSet WshNtk = WScript.CreateObject(\"\
  WScript.Network\")\nWshNtk.MapNetworkDrive \"z:\", \"\\\\SERV0002\\D\"\n```\n\n\n\
  \n\n首先设置 `WshNetwork` 对象的实例。然后执行其 `MapNetworkDrive()` 方法，并传递一个驱动器号，用于创建映射以及网络驱动器或文件夹的\
  \ UNC 路径。\n\n### 断开驱动器连接\n\n为了规范，Molly 希望她的脚本能够显式断开其临时网络驱动器连接。为了实现，她需要使用 `WshNetwork`\
  \ 对象的 `RemoveNetworkDrive()` 方法。该方法的语法在第 14 章中概述。\n\n下一页显示了断开在上一个示例中设置的驱动器映射的示例。\n\
  \n```\n Dim WshNtk\nSet WshNtk = WScript.CreateObject(\"WScript.Network\")\nWshNtk.RemoveNetworkDrive\
  \ \"z:\"\n```\n\n可以看出，只需要代表网络连接驱动器号。\n\n## 文件管理\n\n在本地或通过网络管理文件涉及复制、移动和删除。WSH 为\
  \ VBScript 提供了使用 `FileSystemObject` 对象的方法来管理文件的能力。`FileSystemObject` 对象暴露了 Windows\
  \ 文件系统，允许您的脚本直接与其交互并进行管理。`FileSystemObject` 对象还提供了对 `File` 对象的访问，该对象提供了复制、移动和删除单个文件的额外方法。\n\
  \n### 使用 FileSystemObject 对象\n\n为了使用 `FileSystemObject` 对象进行工作，您必须首先实例化它，如下所示。\n\
  \n```\n Set FsoObj = New WScript.CreateObject (\"Scripting.FileSystemObject\")\n\
  ```\n\n`FileSystemObject` 对象提供了对可用于管理文件的方法的直接访问。下面列出了其中部分一些方法：\n\n* `CopyFile()`。提供将一个或多个文件复制到不同文件夹的能力。\n\
  * `MoveFile()`。提供将一个或多个文件移动到指定文件夹的能力。\n* `DeleteFile()`。提供删除指定文件或文件的能力\n\n这些方法中的每一个都允许您一次操作一个或多个文件。它们可以用于管理计算机连接的任何驱动器上的文件（前提是具有适当的访问访问权限）。有关这些方法的更多信息，请参阅第\
  \ 14 章。\n\n### 使用 File 对象\n\n除了 `FileSystemObject` 对象提供的方法外，在管理文件时，您可能还可以使用 `File`\
  \ 对象提供的若干方法，如下所示：\n\n* `Copy()`。提供复制单个文件或文件夹的能力。\n* `Move()`。提供移动单个文件或文件夹的能力。\n\
  * `Delete()`。提供删除指定文件或文件夹的能力。\n\n这三个方法与 `FileSystemObject` 对象提供的方法之间的主要区别是，`File`\
  \ 对象的方法一次只能处理一个文件。另一个区别是，`File` 对象的方法也可以用于管理文件夹，而 `FileSystemObject` 对象为处理文件夹提供了一套完全不同的方法。\n\
  \n为了使用 `File` 对象进行工作，您必须首先设置 `FileSystemObject` 对象的实例。一旦完成，您就可以使用 `FileSystemObject`\
  \ 对象的 `GetFile` 方法来设置 `File` 对象的实例，该实例将代表您想要管理的文件。然后您可以执行 `File` 对象的任何方法。\n\n在上述列出的三个\
  \ `File` 对象方法中，Molly 需要学习如何使用 `Copy()` 方法。使用该方法，她计划每天早上从两个运行订单/库存系统的 Windows 2000\
  \ 服务器复制摘要报告，以便在 Windows 2000 专业工作站上处理。该方法的语法如下：\n\n```\n ObjectReference.Copy(Target\
  \ [, Overwrite])\n```\n\n`ObjectReference` 是代表 `File` 对象实例的变量。`Target` 指定要复制的目标文件或文件夹。`Overwrite`\
  \ 是一个可选参数，当设置为 `True` 时，将强制覆盖现有文件或文件夹。\n\n以下 VBScript 语句演示了如何使用 `Copy()` 方法将位于 `D:\\\
  Temp` 文件夹中名为 `TestFile.txt` 的文件复制到映射的网络驱动器上的文件夹。\n\n```\n Set FsoObj = CreateObject(\"\
  Scripting.FileSystemObject\")\nSet FileName = FsoObj.GetFile(\"d:\\temp\\TestFile.txt\"\
  )\nFileName.Copy \"z:\\Temp\\TestFile.txt \"\n```\n\n## 开发报告收集脚本\n\nMolly 现在准备好编写摘要报告收集脚本。该脚本将负责检索和存储每天早上在位于订单/库存系统的\
  \ Windows 2000 服务器上生成的摘要报告本地副本。该脚本将由调度脚本执行，随后紧接着一个处理其检索到的报告的脚本。\n\n### 初始化部分\n\n\
  Molly 开始脚本，像她的所有其他脚本一样，使用 `Option Explicit` 语句来强制执行变量名的严格解释。接下来，定义贯穿整个脚本的变量，并实例化\
  \ `WshNetwork`、`FileSystemObject` 和 `WshShell` 对象。最后，定义一个常量，将用于脚本显示的所有弹出对话框中。\n\n\
  ```\n Option Explicit\n\nDim strEventLog, strDebug, strSvrList, strFolderList, strArchive\n\
  Dim WshNtk, FsoObj, WshShl, strRptFileName\n\nSet WshNtk = WScript.CreateObject(\"\
  WScript.Network\")\nSet FsoObj = CreateObject(\"Scripting.FileSystemObject\")\n\
  Set WshShl = WScript.CreateObject(\"WScript.Shell\")\n\nConst cBarMsg = \"Summary\
  \ Report Script\"\n```\n\n### 主处理部分\n\n在下一页所示`主处理部分`中，一系列子程序和函数调用控制着脚本的整体执行。`SetDefaultSettings()`\
  \ 子程序为脚本设置默认配置设置。然后，`GetRegistrySettings()` 子程序检索存储在 Windows 注册中的脚本设置，覆盖匹配的默认脚本设置。接下来，`If`\
  \ 语句确定是否启用了日志，并在适当的情况下向 Windows 事件日志写入消息。\n\n`MapNetworkDrive()` 函数被执行两次，每个 Windows2000\
  \ 服务器执行一次。每次向函数传递一个驱动器号和一个 UNC 路径。UNC 路径通过在一个 Windows 2000 服务器名称前加上 `\\\\` 字符创建，该名称通过\
  \ `Left()` 或 `Right()` 函数从变量 `strSvrList` 中提取、反斜杠（`\\`）以及 Windows 2000 服务器上共享网络文件夹的名称（`strFolder\
  \ List`）。\n\n```\n SetDefaultSettings()\n\nGetRegistrySettings()\n\nIf strEventLog\
  \ = \"Enabled\" Then\n  WriteToEventLog (\"Summary Report Collection script now\
  \ executing.\")\nEnd If\n\nMapNetworkDrive \"X:\", \"\\\\\" & Left(strSvrList, 8)\
  \ & \"\\\" & strFolderList\nMapNetworkDrive \"Y:\", \"\\\\\" & Right(strSvrList,\
  \ 8) & \"\\\" & strFolderList\n\nstrSumRptFileName = GetSummaryRptFileName()\n\n\
  CopyFolders \"X:\\\" & strRptFileName, Left(strSvrList, 8)\nCopyFolders \"Y:\\\"\
  \ & strRptFileName, Right(strSvrList, 8)\n\nDisconnectNetworkDrive(\"X:\")\nDisconnectNetworkDrive(\"\
  Y:\")\n\nIf strEventLog = \"Enabled\" Then\n  WriteToEventLog (\"Summary Report\
  \ Collection script finished executing.\")\nEnd If\n\nTerminateScript()\n```\n\n\
  `主处理部分`中的下一条语句调用 `GetSummary RptFileName()` 函数，该函数返回要检索的摘要报告名称。然后调用两次 `CopyFolders()`\
  \ 子程序，并传递要检索的文件名以及该文件所在的服务器名称。\n\n\n\n\n一旦检索到两个摘要报告文件，将执行两次 `DisconnectNetworkDrive()`\
  \ 子程序，以断开之前建立的到 Windows 2000 服务器共享文件夹的连接。如果适当，将向 Windows 应用程序事件日志写入另一个消息，并执行 `TerminateScript()`\
  \ 子程序以停止脚本执行。\n\n### SetDefaultSettings() 子程序\n\n如下所示的 `SetDefaultSettings()` 子程序定义了脚本的默认配置设置。当在访问相应的注册表值时出现问题，这些设置将用于控制脚本的操作。\n\
  \n```vbs\n Sub SetDefaultSettings()\n\n  strEventLog = \"Enabled\"\n  strDebug =\
  \ \"Disabled\"\n  strSvrList = \"SERV0001 SERV0002\"\n  strFolderList = \"SumReports\"\
  \n  strArchive = \"d:\\Order_Inventrory\\LogFiles\"\n\n  If strDebug = \"Enabled\"\
  \ Then\n    MsgBox \"Default settings initialized: \" & vbCrLf & vbCrLf & _\n  \
  \    \"strEventLog\" & vbTab & \"=\" & vbTab & strEventLog & vbCrLf & _\n      \"\
  strDebug\" & vbTab & vbTab & \"=\" & vbTab & strDebug & vbCrLf & _\n      \"strSvrList\"\
  \ & vbTab & vbTab & \"=\" & vbTab & strSvrList & vbCrLf & _\n      \"strFolderList\"\
  \ & vbTab & \"=\" & vbTab & strFolderList & vbCrLf & _\n      \"strArchive\" & vbTab\
  \ & \"=\" & vbTab & strArchive, , cTitleBarMsg\n  End If\n\nEnd Sub\n```\n\n如果脚本在调试模式下执行（即\
  \ `strDebug` 的值等于 `Enabled`），则使用 VBScript 的 `MsgBox()` 函数显示每个变量的值。\n\n### GetRegistrySettings()\
  \ 子程序\n\n下一页所示的 `GetRegistrySettings()` 子程序首先执行 `On Error Resume Next` 语句，以防止从 Windows\
  \ 注册表中检索配置设置时出现的问题导致脚本停止。这将允许脚本在需要时使用默认设置继续运行。\n\n接下来子程序尝试读取存储脚本配置设置之一的注册表值。检查 `Err.Number`（`Err`\
  \ 对象的默认属性）的值确定是否发生了错误。如果确实发生了错误并且启用了日志记录，将向 Windows 应用程序事件日志写入一条消息，并将 `Err.Number`\
  \ 的值重置为零，以便在读取下一个注册表值之前清除错误。上述过程将重复直到处理完脚本所有的注册表值。\n\n```vbs\n Sub GetRegistrySettings()\n\
  \n  On Error Resume Next\n\n  strEventLog = _\n    WshShl.RegRead(\"HKLM\\Software\\\
  Intuit\\VBScripts\\MstSumRpts\\EventLogging\")\n  If Err <> 0 Then\n    If strEventLog\
  \ = \"Enabled\" Then\n      WriteToEventLog (\"Summary Report Collection script\
  \ - Using \" & _\n        \"default for strEventLog.\")\n      Err.Number = 0\n\
  \    End If\n  End If\n\n  strDebug = WshShl.RegRead(\"HKLM\\Software\\Intuit\\\
  VBScripts\\MstSumRpts\\DebugMode\")\n  If Err <> 0 Then\n    If strEventLog = \"\
  Enabled\" Then\n      WriteToEventLog (\"Summary Report Collection script - Using\
  \ \" & _\n        \"default for strDebug.\")\n      Err.Number = 0\n    End If\n\
  \  End If\n\n  strSvrList = _\n    WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\\
  MstSumRpts\\Win2000Svrs\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\"\
  \ Then\n      WriteToEventLog (\"Summary Report Collection script - Using \" & _\n\
  \        \"default for strSvrList.\")\n      Err.Number = 0\n    End If\n  End If\n\
  \n  strFolderList = _\n    WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\\
  MstSumRpts\\SharedFolder\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\"\
  \ Then\n      WriteToEventLog (\"Summary Report Collection script - Using \" & _\n\
  \        \"default for strFolderList.\")\n      Err.Number = 0\n    End If\n  End\
  \ If\n\n  strArchive = _\n    WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\\
  MstSumRpts\\RptArchive\")\n  If Err <> 0 Then\n  If strEventLog = \"Enabled\" Then\n\
  \      WriteToEventLog (\"Summary Report Collection script - Using \" & _\n    \
  \    \"default for strArchive.\")\n      Err.Number = 0\n    End If\n  End If\n\n\
  \  If strDebug = \"Enabled\" Then\n    MsgBox \"Registry settings initialized: \"\
  \ & vbCrLf & vbCrLf & _\n      \"strEventLog\" & vbTab & \"=\" & vbTab & strEventLog\
  \ & vbCrLf & _\n      \"strDebug\" & vbTab & vbTab & \"=\" & vbTab & strDebug &\
  \ vbCrLf & _\n      \"strSvrList\" & vbTab & vbTab & \"=\" & vbTab & strSvrList\
  \ & vbCrLf & _\n      \"strFolderList\" & vbTab & \"=\" & vbTab & strFolderList\
  \ & vbCrLf & _\n      \"strArchive\" & vbTab & \"=\" & vbTab & strArchive, , cTitleBarMsg\n\
  \  End If\n\nEnd Sub\n```\n\n\n\n\n```\n Function GetSummaryRptFileName()\n\n  GetSummaryRptFileName\
  \ = Replace(Date(), \"/\", \"-\")\n\n  GetSummaryRptFileName = GetSummaryRptFileName\
  \ & \"_SumRpt.txt\"\n\n  If strDebug = \"Enabled\" Then\n    MsgBox \"Summary Report\
  \ Files Name = \" & GetSummaryRptFileName, , _\n      cTitleBarMsg\n  End If\n\n\
  End Function\n```\n\n### CopyFolders() 子程序\n\n所示的 `CopyFolders()` 子程序首先确定摘要报告是否可以访问。如果无法访问，将通过调用\
  \ `TerminateScript()` 子程序终止脚本的执行。如果可以访问，则使用 `FileSystemObject` 对象的 `GetFile()` 方法实例化一个\
  \ `File` 对象的实例，并与摘要报告建立关联（由 `strFileNameToCopy` 指定）。\n\n```\n Sub CopyFolders(strFileNameToCopy,\
  \ strServerName)\n\n  Dim strFileName\n\n  If (FsoObj.FileExists(strFileNameToCopy))\
  \ Then\n    If strDebug = \"Enabled\" Then\n      MsgBox \"File \" & strFileNameToCopy\
  \ & \" found. Now copying...\", , _\n      cTitleBarMsg\n    End If\n  Else\n  \
  \  If strDebug = \"Enabled\" Then\n      MsgBox \"File \" & strFileNameToCopy &\
  \ \" does not exist. Stopping \" & _\n      \"script execution.\", , cTitleBarMsg\n\
  \    End If\n    TerminateScript()\n  End If\n  Set strFileName = FsoObj.GetFile(strFileNameToCopy)\n\
  \n  strFileName.Copy (strArchive & \"\\\" & strServerName & \"_\" & _\n    Mid(strFileNameToCopy,4))\n\
  \  If Err <> 0 Then\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog\
  \ \"Summary Report Collection script - Unable to copy \" & _\n        strFileNameToCopy\n\
  \    End If\n    If strDebug = \"Enabled\" Then\n      MsgBox \"Summary Report Collection\
  \ script - Unable to copy \" & _\n        strFileNameToCopy, , cTitleBarMsg\n  \
  \  End If\n    TerminateScript()\n  End If\n\nEnd Sub\n```\n\n实例化后，使用 `File` 对象的\
  \ `Copy()` 方法将摘要报告复制并重命名到 Windows 2000 Professional 工作站的本地文件夹。`strArchive` 中存储的值指定了存储摘要报告的文件夹。摘要报告的名称通过附加反斜杠（`\\\
  `）字符、`strServerName` 的值、下划线（`_`）字符以及 `strFileNameToCopy` 的值（去掉 `strFileNameToCopy`\
  \ 前三个字符指定的驱动器号）来更改。\n\n### DisconnectNetworkDrive() 子程序\n\n两个摘要报告都复制到 Windows 2000\
  \ Professional 工作站后，将执行两次 `DisconnectNetworkDrive()` 子程序。该子程序通过执行 `On Error Resume\
  \ Next` 语句来防止断开驱动器连接时可能发生的任何问题导致脚本停止。每次调用该子程序时，都会传递一个不同的驱动器号给它，以指定要断开的网络连接。\n\n\
  ```\n Sub DisconnectNetworkDrive(strDriveLetter)\n\n  On Error Resume Next\n\n \
  \ If strDebug = \"Enabled\" Then\n    MsgBox \"Disconnecting \" & strDriveLetter,\
  \ , cTitleBarMsg\n  End If\n\n  WshNtk.RemoveNetworkDrive strDriveLetter\n  If Err\
  \ <> 0 Then\n    If strDebug = \"Enabled\" Then\n      MsgBox \"Error occurred when\
  \ disconnecting \" & strDriveLetter, , _\n        cTitleBarMsg\n    End If\n  End\
  \ If\n\nEnd Sub\n```\n\n### WriteToEventLog() 子程序\n\n`WriteToEventLog()` 子程序接受单个参数，代表要写入\
  \ Windows 2000 Professional 工作站应用程序事件日志的消息。然后它将此消息作为信息事件写入。\n\n```\n Sub WriteToEventLog(strMessage)\n\
  \n  WshShl.LogEvent 4, strMessage\n\nEnd Sub\n```\n\n## TerminateScript() 子程序\n\n\
  所示的 `TerminateScript()` 子程序在脚本以调试模式运行时，会在弹出对话框中显示终止消息。然后它执行 `WScript` 对象的 `Quit()`\
  \ 方法来停止脚本的执行。\n\n```\n Sub TerminateScript()\n\n  If strDebug = \"Enabled\" Then\n\
  \    MsgBox \"Script execution terminated.\", , cTitleBarMsg\n  End If\n  WScript.Quit()\n\
  \nEnd Sub\n```\n\n## 完整的脚本\n\n完整的脚本如下所示。执行时，它将从 Windows 注册表中检索配置设置，连接到位于每个 Windows\
  \ 2000 服务器上的共享网络文件夹，并将当天的摘要报告复制到 Windows 2000 Professional 工作站。\n\n\n\n\n```\n '*************************************************************************\n\
  'Script Name: Script 23.2.vbs\n'Author: Jerry Ford\n'Created: 04/11/03\n'Description:\
  \ 此脚本将文件从远程服务器复制到 Windows 2000 专业工作上的中央文件夹。\n'*************************************************************************\n\
  \n'Initialization Section\n\nOption Explicit\n\nDim strEventLog, strDebug, strSvrList,\
  \ strFolderList, strArchive\nDim WshNtk, FsoObj, WshShl, strSumRptFileName\n\nSet\
  \ WshNtk = WScript.CreateObject(\"WScript.Network\")\nSet FsoObj = CreateObject(\"\
  Scripting.FileSystemObject\")\nSet WshShl = WScript.CreateObject(\"WScript.Shell\"\
  )\n\nConst cTitleBarMsg = \"Summary Report Collection Script\"\n\n'Main Processing\
  \ Section\n\nSetDefaultSettings()\n\nGetRegistrySettings()\n\nIf strEventLog = \"\
  Enabled\" Then\n  WriteToEventLog (\"Summary Report Collection script now executing.\"\
  )\nEnd If\n\nMapNetworkDrive \"X:\", \"\\\\\" & Left(strSvrList, 8) & \"\\\" & strFolderList\n\
  MapNetworkDrive \"Y:\", \"\\\\\" & Right(strSvrList, 8) & \"\\\" & strFolderList\n\
  \nstrSumRptFileName = GetSummaryRptFileName()\n\nCopyFolders \"X:\\\" & strSumRptFileName,\
  \ Left(strSvrList, 8)\nCopyFolders \"Y:\\\" & strSumRptFileName, Right(strSvrList,\
  \ 8)\n\nDisconnectNetworkDrive(\"X:\")\nDisconnectNetworkDrive(\"Y:\")\n\nIf strEventLog\
  \ = \"Enabled\" Then\n  WriteToEventLog (\"Summary Report Collection script finished\
  \ executing.\")\nEnd If\n\nTerminateScript()\n\n'Procedure Section\n\nSub SetDefaultSettings()\n\
  \n  strEventLog = \"Enabled\"\n  strDebug = \"Disabled\"\n  strSvrList = \"SERV0001\
  \ SERV0002\"\n  strFolderList = \"SumReports\"\n  strArchive = \"d:\\Order_Inventrory\\\
  LogFiles\"\n\n  If strDebug = \"Enabled\" Then\n    MsgBox \"Default settings initialized:\
  \ \" & vbCrLf & vbCrLf & _\n      \"strEventLog\" & vbTab & \"=\" & vbTab & strEventLog\
  \ & vbCrLf & _\n      \"strDebug\" & vbTab & vbTab & \"=\" & vbTab & strDebug &\
  \ vbCrLf & _\n      \"strSvrList\" & vbTab & vbTab & \"=\" & vbTab & strSvrList\
  \ & vbCrLf & _\n      \"strFolderList\" & vbTab & \"=\" & vbTab & strFolderList\
  \ & vbCrLf & _\n      \"strArchive\" & vbTab & \"=\" & vbTab & strArchive, , cTitleBarMsg\n\
  \  End If\n\nEnd Sub\n\nSub GetRegistrySettings()\n\n  On Error Resume Next\n\n\
  \  strEventLog = _\n    WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\\
  EventLogging\")\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\" Then\n   \
  \   WriteToEventLog (\"Summary Report Collection script - Using \" & _\n       \
  \ \"default for strEventLog.\")\n      Err.Number = 0\n    End If\n  End If\n\n\
  \  strDebug = WshShl.RegRead(\"HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\DebugMode\"\
  )\n  If Err <> 0 Then\n    If strEventLog = \"Enabled\" Then\n      WriteToEventLog\
  \ (\"Summary Report Collection script - Using \" & _\n        \"default for strDebug.\"\
  )\n      Err.Number = 0\n    End If\n  End If\n\n  strSvrList = _\n    WshShl.RegRead(\"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\Win2000Svrs\")\n  If Err <> 0 Then\n\
  \    If strEventLog = \"Enabled\" Then\n      WriteToEventLog (\"Summary Report\
  \ Collection script - Using \" & _\n        \"default for strSvrList.\")\n     \
  \ Err.Number = 0\n    End If\n  End If\n\n  strFolderList = _\n    WshShl.RegRead(\"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\SharedFolder\")\n  If Err <> 0 Then\n\
  \    If strEventLog = \"Enabled\" Then\n      WriteToEventLog (\"Summary Report\
  \ Collection script - Using \" & _\n        \"default for strFolderList.\")\n  \
  \    Err.Number = 0\n    End If\n  End If\n\n  strArchive = _\n    WshShl.RegRead(\"\
  HKLM\\Software\\Intuit\\VBScripts\\MstSumRpts\\RptArchive\")\n  If Err <> 0 Then\n\
  \  If strEventLog = \"Enabled\" Then\n      WriteToEventLog (\"Summary Report Collection\
  \ script - Using \" & _\n        \"default for strArchive.\")\n      Err.Number\
  \ = 0\n    End If\n  End If\n\n  If strDebug = \"Enabled\" Then\n    MsgBox \"Registry\
  \ settings initialized: \" & vbCrLf & vbCrLf & _\n      \"strEventLog\" & vbTab\
  \ & \"=\" & vbTab & strEventLog & vbCrLf & _\n      \"strDebug\" & vbTab & vbTab\
  \ & \"=\" & vbTab & strDebug & vbCrLf & _\n      \"strSvrList\" & vbTab & vbTab\
  \ & \"=\" & vbTab & strSvrList & vbCrLf & _\n      \"strFolderList\" & vbTab & \"\
  =\" & vbTab & strFolderList & vbCrLf & _\n      \"strArchive\" & vbTab & \"=\" &\
  \ vbTab & strArchive, , cTitleBarMsg\n  End If\n\nEnd Sub\n```\n\n\n\n\n在本章中，你将学习如何开发一个\
  \ VBScript，用于读取并处理从 `SERV0001` 和 `SERV0002` Windows 2000 服务器收集的摘要报告文件。随后，你将学习如何以文本和\
  \ Microsoft Word 两种格式之一创建合并摘要报告。最后，你将学习如何开发一个进程，在合并报告生成可用时能够通知选定的操作人员。\n\n## 解析字符串内容\n\
  \n在本章开发的脚本将大量使用许多与解析和操纵字符串内容相关的 VBScript 函数。在读取和处理两份摘要报告时，将使用这些函数来识别和处理所要处理的数据。在脚本后期编写合并摘要报告时，你将再次使用这些函数。\n\
  \n### 字符串内容的索引\n\n用于开发本章脚本的 VBScript 函数之一是 `Split()` 函数。该函数接收一个字符串参数，并构建一个由从原始字符串提取的子字符串组成的一维数组。此函数将用于处理一个注册表值，其内容代表了要发送网络消息的用户名列表。通过将此名称列表拆分为数组，你随后可以使用\
  \ `For`...Next` 循环迭代处理数组中存储的每个用户名。`Split()` 函数具有以下语法：\n\n```\n Split(Expression\
  \ [, Delimiter [, Count [, Compare]]])\n```\n\n`Expression` 表示要处理的字符串。`Delimiter`\
  \ 指定一个可选的字符，用于标识子字符串的边界。如果省略，则假设为空格字符。`Count` 是一个可选参数，可限制检索的子字符串数量，而 `Compare` 是一个可选参数，用于指定要执行的比较类型（指定值\
  \ 0 执行二进制比较，指定值 1 执行文本比较）。\n\n例如，以下语句演示了如何使用 `Split()` 函数。首先，定义一个存储名称列表的字符串，每个名称之间用空格隔开。然后使用\
  \ `Split()` 函数创建一个名为 `astrList` 的一维数组，将这三个名称中的每一个作为数组元素存储。\n\n```\n strList = \"\
  Mike Nick Mark\"\nastrList = Split(strList)\n```\n\n### 删除前导和后尾空格\n\n在本章脚本中使用的另一个\
  \ VBScript 函数是 `Trim()` 函数。该函数获取一个没有前导或后尾空格的字符串副本，具有以下语法：\n\n```\n Trim(string)\n\
  ```\n\n`String` 指定要由函数处理的字符串。以下示例显示了一个构建带有若干空白空格字符串的语句。该语句之后是一个 `MsgBox()` 语句，它使用\
  \ `Trim()` 函数在显示字符串内容之前删除多余的空格。\n\n```\n strList = \" Mike Nick Mark   \"\nMsgBox\
  \ Trim(strList)\n```\n\n### 将字符串转换为整数\n\n在本章 VBScript 中另一个非常有用的 VBScript 函数是 `CInt()`\
  \ 函数。该函数获取一个转换为整数子类型的表达式。该函数的语法所示：\n\n```\n CInt(Expression)\n```\n\n`Expression`\
  \ 表示一个字符串表达式。此函数在从文本字符串中提取数值时非常有用，如下所示。\n\n```\n strList = \"There are 10 units\
  \ on hand\"\nintCount = Cint(Mid(strList, 11,2))\n```\n\n在此示例中，定义了一个字符串，然后使用 `Mid()`\
  \ 函数进行解析以提取库存单位数量。虽然 VBScript 通常能很好地将值从一种变体子类型转换为另一种子类型（例如当你指定数学操作时），但有时它无法正确调整子类型。通过使用上所示的\
  \ `Cint()` 函数，你可以显式地将值转换为整数子类型，以确保其被正确解释。\n\n### 确定字符串长度\n\n在本章 VBScript 中另一个非常有用的\
  \ VBScript 函数是 `Len()` 函数。该函数获取字符串或变量中的字符数。该函数的语法列如下：\n\n```\n Len(string | variable)\n\
  ```\n\n`String` 表示要计算长度的字符串。在本章的 VBScript 中，将反复使用 `Len()` 函数来判断报告文件中是否遇到了空行（即长度为零的字符串）。例如，以下\
  \ `If` 语句演示了如何确定变量是否分配了任何数据。如果没有分配数据，其长度将等于零。在此示例中，只有当有数据待处理时才会采取操作。\n\n```\n If\
  \ Len(strText) > 0 Then\n  ...\nEnd If\n```\n\n### 其他 VBScript 函数\n\n在处理摘要报告和创建合并摘要报告时，本章将利用许多其他\
  \ VBScript 函数。下列表函数已经在之前的章节中介绍过。\n\n* `Mid()`：从字符串中提取子集\n* `Instr()`：检索一个字符串在另一个字符串中首次出现的字符位置\n\
  * `Left()`：从字符串左侧提取子集\n* `Right()`：从字符串右侧提取子集\n\n## 使用 Word 对象模型\n\n本章的脚本将读取从 Intuit\
  \ 的 `SERV0001` 和 `SERV0002` Windows 2000 服务器收集的两个摘要报告。它将处理并合并这两个报告中的数据以创建一个新的摘要报告。该报告将以两种不同的格式提供：文本格式和可选的\
  \ Microsoft Word 格式。Word 版本的报告可以让 Intuit 的许多人更方便地查看，它可以使用不同的字体和选择性字符高亮，使其纯文本更具力。\n\
  \n为了编写合并报告的 Word 版本，你需要学习如何引用和使用 Word 对象模型。Word 对象模型的顶部是 `Application` 对象。当启动 Word\
  \ 时，会自动创建一个 `Application` 实例。你可以使用属于该对象的属性和方法访问 Word 对象模型中的低级对象和集合。然后你可以使用这些对象和集合提供的属性和方法来自动化创建报告。以下语句演示了如何在\
  \ VBScript 中实例化 Word：\n\n```\n Set objMsWord = WScript.CreateObject(\"Word.Application\"\
  )\n```\n\n该语句通过名为 `objMsWord` 的变量分配 Word `Application` 对象的引用。为了创建合并报告的 Word 版本，你需要学习如何处理以下对象：\n\
  \n* `Documents`：代表所有当前打开的 Word 文档的集合。该集合提供了创建、打开、保存和关闭文件所需的属性和方法。通过 `Application`\
  \ 对象的 `Documents` 属性访问该集合。\n* `Document`：单个 Word 文档的实例。`Document` 对象提供了创建、打开、保存和关闭文件所需的属性和方法。\n\
  * `Selection`：代表当前打开窗格的实例。通过 `Application` 对象的 `Selection` 属性访问该对象。`Selection` 对象用于在对\
  \ Word 文档上执行操作（如输入文本）时。\n\n\n\n\n\n- `Font`：提供用于格式化文档内文本外观的属性访问权限。`Font` 对象通过 `Selection`\
  \ 对象的 `Font` 属性访问。\n\n另一个实用的 `Application` 对象属性是 `ActiveDocument`，它检索当前活动 Word 文档的引用。下面的示例演示了如何使用这些对象及其属性和方法来创建、写入和保存\
  \ Word 文件。脚本中使用的每个语句的文档说明通过嵌入脚本本身的注释提供。\n\n```\n ' 定义一个变量用于存储对 Application 对象的引用\n\
  Dim objWordDoc\n' 实例化 Word 并定义 Application 对象的引用\nSet objWordDoc = WScript.CreateObject(\"\
  Word.Application\")\n\n' 使用 Documents 集合的 Add 方法打开一个新的空 Word 文档\nobjWordDoc.Documents.Add()\n\
  \n' 使用 Font 对象的 Name、Size 和 Bold 属性格式化文本输出\nobjWordDoc.Selection.Font.Name = \"\
  Arial\"\nobjWordDoc.Selection.Font.Size = 12\nobjWordDoc.Selection.Font.Bold = True\n\
  \n' 使用 Selection 对象的 Typetext() 方法写入一行文本\nobjWordDoc.Selection.Typetext(\"Report\
  \ Header\")\n\n' 使用 Selection 对象的 TypeParagraph() 方法插入两个换行符\nobjWordDoc.Selection.TypeParagraph\n\
  objWordDoc.Selection.TypeParagraph\n\n' 使用 Font 对象的 Size 和 Bold 属性格式化文本输出\nobjWordDoc.Selection.Font.Size\
  \ = 10\nobjWordDoc.Selection.Font.Bold = False\n\n' 使用 Selection 对象的 Typetext()\
  \ 和 TypeParagraph() 方法写入\n' 额外的文本\nobjWordDoc.Selection.Typetext(\"Line 1 of the\
  \ report.\")\nobjWordDoc.Selection.TypeParagraph\nobjWordDoc.Selection.Typetext(\"\
  Line 2 of the report.\")\n\n' 使用 Applications 对象的 ActiveDocument 属性引用当前\n' 文档，然后使用\
  \ Document 对象的 SaveAs() 方法保存 Word\n' 文件\nobjWordDoc.ActiveDocument.SaveAs(\"c:\\\
  Temp\\TextFile.doc\")\n\n' 使用 document 对象的 Close() 方法关闭 Word 文档\nobjWordDoc.ActiveDocument.Close()\n\
  \n' 终止当前活动的 Word 实例\nobjWordDoc.Quit()\n```\n\n| | 注意 | | 由于 Word 对象模型的大小和复杂性，书中没有足够的空间对其进行更深入的介绍。要要更多关于\
  \ Word 对象模型的信息，请参阅 [`msdn.Microsoft.com/office`](http://msdn.Microsoft.com/office)。\
  \ |\n\n## 开发网络消息过程\n\nMolly 对此脚本设的目标之一是使其具备这种能力：当合并摘要报告可用时，以弹出对话框消息的形式通知选定的操作人员。她考虑过尝试在执行该脚本的\
  \ Windows 2000 专业版工作站上使用 `MsgBox()` 函数显示弹出消息。她发现这是行不通的，因为创建合并报告的脚本是使用 `WScript.exe`\
  \ 执行宿主在后台运行的。因此，即使她尝试使用 `MsgBox()` 函数来显示一个交互式弹出对话框，该对话框也不会显示。相反，脚本将在等待用户响应弹出对话框时停止处理，而该对话框永远不会出现，因为其根本没有显示。\n\
  \n在进行了一些研究后，Molly 发现了 Windows 的 `Net Send` 命令。该命令提供了通过网络向指定的用户或计算机发送文本消息的能力。`Net\
  \ Send` 命令的语法所示。\n\n```\n net send (name | * | /domain[:name] | /users) message\n\
  ```\n\n`Name` 代表要发送消息的用户或计算机的名称。为了让接收的用户或计算机能够接收并显示弹出消息，其计算机必须运行 Windows 消息传递服务。此外，用户在发送消息时必须已登录其计算机。星号（`*`）字符可将消息发送给发送计算机所属的域或工作组内的所有用户。`/domain:name`\
  \ 参数可将消息发送到 Windows 域中定义的所有名称。`/users` 参数提供了将消息发送给与发送计算机具有活动网络连接的用户的能力。`Message`\
  \ 代表要在弹出对话框中显示的消息文本。\n\n为了在脚本内部使用 `Net Send` 命令，你需要使用 `WshShell` 对象的 `Run()` 方法，如下所示。\n\
  \n```\n Set WshShl = WScript.CreateObject(\"WScript.Shell\")\nstrUser = \"Jford\"\
  \nstrMsgTest = \"This is a test!\"\nWshShl.Run \"Net Send \" & strUser & \" \" &\
  \ strMsgTest\n```\n\n执行此示例时，它将在用户名为 `Jford` 的用户当前登录的计算机上显示图 24.1 所示的弹出对话框。\n\n![点击展开](img/fig24-1_0.jpg)\n\
  \n图 24.1：检查使用 `Net Send` 命令创建的网络消息内容\n\n## 创建合并报告脚本\n\n合并摘要报告的创建脚本执行了许多不同的任务。它读取并存储摘要报告的内容到两个独立的数组中。然后它遍历数组，解析数据以创建合并报告。该过程涉及大量的\
  \ VBScript 字符串函数。除了创建文本外，脚本还具有创建 Word 版本的能力。其他活动包括从注册表中获取设置、支持调试模式、记录应用程序事件以及网络通知。\n\
  \n### 初始化部分\n\n脚本的初始化部分如下所示，定义了整个脚本使用的变量。此外，它定义了三个动态数组，用于在处理期间存储内容。还定义了一组常量以及 `WshShell`\
  \ 和 `FileSystemObject` 实例。\n\n```\n Option Explicit\n\nDim strEventLog, strDebug,\
  \ strSvrList, strArchive, strConsolFolder\nDim strRpt1, strRpt2, strConsolptName,\
  \ strRptFormat, strNetworkNotification\n\nReDim astrServ0001Array(0)\nReDim astrServ0002Array(0)\n\
  ReDim astrProductionArray(0)\n\nDim FsoObj, WshShl\n\nConst cTitleMsg = \"Consolidated\
  \ Summary Report\"\nConst cForReading = 1\nConst cForWriting = 2\nConst cForAppending\
  \ = 8\n\nSet WshShl = WScript.CreateObject(\"WScript.Shell\")\nSet FsoObj = CreateObject(\"\
  Scripting.FileSystemObject\")\n```\n\n### 主处理部分\n\n脚本的主处理部分由一系列过程调用组成。调用 `SetDefaultSettings()`\
  \ 和 `GetRegistrySettings()` 子过程来设置脚本配置，正如之前的脚本所示。如果在脚本开始执行时启用了事件日志，将通过 `WriteToEventLog()`\
  \ 子过程向 Windows 应用程序日志写入消息。`IdentifyRptsToProcess()` 创建一个指定当天摘要报告名称的变量。然后调用两次 `ReadSummaryReport()`\
  \ 子过程并传递 Windows 2000 服务器的名称。该子过程读取并将每个报告的内容存储在数组中。\n\n随后调用 `CreateConsolidatedTextReport()`\
  \ 子过程以写入合并报告的文本版本。如果适用，随后执行 `CreateConsolidatedWordReport()` 子过程以创建报告的 Word 版本。如果启用了网络通知，接下来执行\
  \ `NotifyOperationsStaff()` 子过程。最后，如果启用了事件日志且通过调用 `TerminateScript()` 子过程终止脚本执行，则写入一条可选消息。\n\
  \n\n\n\n\n```\n SetDefaultSettings()\nGetRegistrySettings()\n\nIf strEventLog =\
  \ \"Enabled\" Then\n  WriteToEventLog(\"Consolidated Summary Report Creator executing.\"\
  )\nEnd If\n\nIdentifyRptsToProcess()\n\nReadSummaryReport(Left(strSvrList, 8))\n\
  ReadSummaryReport(Right(strSvrList, 8))\n\nCreateConsolidatedTextReport()\n\nIf\
  \ strRptFormat = \"Word\" Then\n  CreatConsolidatedWordReport()\nEnd If\n\nIf strNetworkNotification\
  \ = \"Enabled\" Then\n  NotifyOperationsStaff()\nEnd If\n\nIf strEventLog = \"Enabled\"\
  \ Then\n  WriteToEventLog(\"Consolidated Summary Report Creator finished.\")\nEnd\
  \ If\n\nTerminateScript()\n```\n\n### `SetDefaultSettings()` 子程序\n\n正如之前的脚本所示，下所示的\
  \ `SetDefaultSettings()` 子程序为脚本建立了了默认配置设置。\n\n```\n Sub SetDefaultSettings()\n\n\
  \  strEventLog = \"Enabled\"\n  strDebug = \"Disabled\"\n  strSvrList = \"SERV0001\
  \ SERV0002\"\n  strArchive = \"d:\\Order_Inventrory\\LogFiles\"\n  strRptFormat\
  \ = \"Text\"\n  strNetworkNotification = \"Enabled\"\n  strConsolFolder = \"d:\\\
  Order_Inventory\\ConsolidatedRpts\"\n\n  If strDebug = \"Enabled\" Then\n    MsgBox\
  \ \"Registry settings retrieved: \" & vbCrLf & vbCrLf & _\n      \"strEventLog\"\
  \ & vbTab & \"=\" & vbTab & strEventLog & vbCrLf & _\n      \"strDebug\" & vbTab\
  \ & vbTab & \"=\" & vbTab & strDebug & vbCrLf & _\n      \"strSvrList\" & vbTab\
  \ & vbTab & \"=\" & vbTab & strSvrList & vbCrLf & _\n      \"strArchive\" & vbTab\
  \ & \"=\" & vbTab & strArchive & vbCrLf & _\n      \"strRptFormat\" & vbTab & \"\
  =\" & vbTab & strRptFormat & vbCrLf & _\n      \"strNetworkNotification\" & vbTab\
  \ & \"=\" & vbTab & strNetworkNotification & _\n        vbCrLf & _\n      \"strConsolFolder\"\
  \ & vbTab & \"=\" & vbTab & strConsolFolder, , cTitleBarMsg\n  End If\n\nEnd Sub\n\
  ```\n\n### `GetRegistrySettings()` 子程序\n\n下所示的 `GetRegistrySettings()` 子程序从 Windows\
