  \ 了解更多关于 `VBA`。 |\n### VBScript 执行环境\n\n尽管 `VBScript` 起步平平，但微软对 `VBScript` 保持了强大的承诺，不断对其改进。自诞生以来，微软将\
  \ `VBScript` 移植到许多不同的环境中，展示了 `VBScript` 的灵活性和适应性。因此，`VBScript` 多年来日益流行，为程序员提供了利用其\
  \ VBScript 技能的多种途径。\n以下列表列出了当前支持 `VBScript` 的主要执行环境：\n*   **Internet Explorer**。`VBScript`\
  \ 为 Web 页面开发提供强大的客户端脚本语言。\n*   **WSH**。`VBScript` 为自动化日常或复杂的系统和网络任务提供脚本语言。\n*  \
  \ **IIS 和 ASP**。嵌入 `ASPs` 中的 `VBScript` 提供动态 Web 内容以及访问本地服务器端数据库的数据。\n*   **Microsoft\
  \ Windows Script Console**。这是一项新技术，允许将 `VBScript` 纳入第三方应用程序中，从而将其扩展到许多新环境中。\n\n\
  ## VBScript Web 页面开发\n`VBScript` 最初被开发为客户端 Web 脚本语言，多年来微软一直致力于这项技术。当用于客户端 Web 页面开发时，`VBScripts`\
  \ 通常嵌入 HTML 页面中并作为 Web 页面的一部分下载到客户端浏览器中。\n\n\n\n\n与包含它们的 HTML 页面一样，VBScript 可以使用任何可以纯文本保存文件的编辑器来创建。例如，微软记事本程序就是一个合格的编辑器。然而，如今有许多优秀的\
  \ HTML 编辑器，它们也包含了对 VBScript 开发的支持。\n| **提示** | HTML 和脚本编辑器的一个极佳示例是 HomeSite。HomeSite\
  \ 提供了许多功能，包括：\n\n* HTML 和 VBScript 语句的颜色编码\n* 代码验证\n* 模板和向导\n\n\n\nVBScript 受 Microsoft\
  \ Internet Explorer 浏览支持，但不受 Netscape Communicator 支持。VBScript 还受到更多第三方浏览器的支持，这些浏览器至少在部分程度上基于\
  \ Internet Explorer。这使得 VBScript 在互联网上的支持基础比通常人们认为的要广泛得多。\n\n\n* AOL\n* CompuServe\n\
  * EarthLink LiteOL\n* Fast Browser Pro\n* NeoPlanet\n* ExplorerRapidBrowser\n* SmartExplorer\n\
  * Oligo\n\n\n## 在 Web 页面中添加 VBScript\n\n\n使用 `<SCRIPT>` 和 `</SCRIPT>` 标签，您可以通过以下概述的三种不同方式向\
  \ HTML 页面添加 VBScript：\n\n* 响应事件运行 VBScript，例如访问点击图像、按钮或链接\n* 运行存储在包含 `<SCRIPT>`\
  \ 和 `</SCRIPT>` 标签引用的 HTML 页面之外的脚本\n\n\n将 VBScript 嵌入 HTML 页面以便其在页面加载时自动运行所需的所需的语法概述如下。\n\
  \n <SCRIPT LANGUAGE=\"ScriptingLanguage\" TYPE=\"TEXT/Language\" SRC=\"url\"> </SCRIPT>\n\
  ```\n\n\n```\n LANGUAGE=\"VBScript\"\n\n或者\n\n LANGUAGE=\"VBS\"\n```\n\n\n```\n\
  \ TYPE=\"TEXT/VBScript\"\n\n或者\n\n TYPE=\"TEXT/VBS\"\n```\n\n\n`</SCRIPT>` 标签标记\
  \ VBScript 的结束。在起始 `<SCRIPT>` 和结束 `</SCRIPT>` 标签之间，您可以包含任意数量的 VBScript 语句。例如，下面的\
  \ HTML 页面包含两个嵌入的 VBScript，一个在 BODY 部分，另一个在 HEAD 部分。\n\n <HTML>\n  <HEAD>\n\n   \
  \ <SCRIPT LANGUAGE=\"VBScript\">\n      Sub DisplayPopup\n        MsgBox \"This\
  \ message was displayed by a second VBScript.\"\n    </SCRIPT>\n  </HEAD>\n  <BODY>\n\
  \    <SCRIPT LANGUAGE=\"VBScript\">\n      MsgBox \"Greetings. Click on OK to run\
  \ the second VBScript.\"\n      DisplayPopup\n  </BODY>\n</HTML>\n```\n\n当浏览器加载\
  \ HTML 页面时，BODY 部分中的 VBScript 会自动执行。并在弹出框中显示消息，如图 1.1 所示。第二个 VBScript 在 HEAD 部分被定义为子程序，并在被位于\
  \ BODY 部分的 VBScript 调用时执行，显示如图 1.2 所示的弹出对话框。\n\n![点击展开](img/fig1-1_0.jpg)\n图 1.1：当定义它的\
  \ HTML 页面被 Internet Explorer 加载时显示的弹出对话框示例\n\n![点击展开](img/fig1-2_0.jpg)\n图 1.2：由另一个\
  \ VBScript 用的 VBScript 子程序生成的弹出对话框\n\n| **注意** | 上一个示例以及所有的 |\n### 响应事件\n\n嵌入 HTML\
  \ 页面中的 VBScript 也可以设置为根据事件执行。浏览器事件的示例包括访问点击按钮、链接或图形。通过创建响应事件的 VBScript，您可以为 Web\
  \ 页面添加大量的交互性。例如，您可以要求访问者确认表单是否填写正确。\n为了设置此类引用，您必须在定义 `<SCRIPT>` 和 `</SCRIPT>` 标签时使用以下语法。\n\
  \n```\nSCRIPT FOR=\"Object\" EVENT=\"EventType\" LANGUAGE=\"ScriptingLanguage\"\
  \ > </SCRIPT>\n```\n\n\n表 1.1：文档对象模型属性\n\n| --- | --- | --- |\n| `Abort` | `onAbort`\
  \ | 当访问者中止图像加载时执行 |\n| `Blur` | `onBlur` | 当当前对象失去焦点时执行 |\n| `Click` | `onClick`\
  \ | 当访问者点击对象时执行 |\n| `DblClick` | `onDblClick` | 当访问者双击对象时执行 |\n| `DragDrop` | `onDragDrop`\
  \ | 当访问者将对象拖放到框架或窗口时执行 |\n| `Focus` | `onFocus` | 当访问者选择对象时执行 |\n| `KeyDown` | `onKeyDown`\
  \ | 当访问者按下按键时执行 |\n| `KeyPress` | `onKeyPress` | 当访问者按下并释放按键时执行 |\n| `Load` | `onLoad`\
  \ | 当 HTML 页面或图像加载完成时执行 |\n| `MouseDown` | `onMouseDown` | 当访问者按下鼠标按钮时执行 |\n\n\n\
  \n\n| `MouseOut` | `onMouseOut` | 当访问者将指针移出对象时执行 |\n| `MouseOver` | `onMouseOver`\
  \ | 当访问者将指针移动到对象上执行 |\n| `MouseUp` | `onMouseUp` | 当访问者释放鼠标按钮时执行 |\n| `Move` | `onMove`\
  \ | 当访问者移动帧或窗口时执行 |\n| `Reset` | `onReset` | 当访问者点击重置按钮时执行 |\n| `Resize` | `onResize`\
  \ | 当访问者调整帧或窗口大小时执行 |\n| `Submit` | `onSubmit` | 当访问者点击提交按钮时执行 |\n| `Unload` | `onUnload`\
  \ | 当访问者关闭浏览器窗口、帧或加载不同的 URL 时执行 |\n\n\n```html\n <HTML>\n    <TITLE>Script 1.2 -\
  \ 由浏览器事件触发的 VBScript 示例</TITLE>\n  </HEAD>\n  <BODY>\n      <INPUT TYPE=button NAME=\"\
  TestButton\" VALUE=\"Click on Me\">\n      <SCRIPT FOR=\"TestButton\" EVENT=\"onClick\"\
  \ LANGUAGE=\"VBScript\">\n      MsgBox \"Greetings. Thanks for visiting!\"\n   \
  \ </FORM>\n  </BODY>\n</HTML>\n\n在此示例中，定义了一个名为 `TestForm` 的表单，它包含一个单表单元素——一个显示 `Click\
  \ on Me` 信息的 `TestButton` 按钮。HTML 页面添加了一个 VBScript。它被设置为仅在 `TestButton` 发生 `click`\
  \ 事件时才执行，如示例所示。当发生这种情况时，将显示图 1.3 所示的弹出对话框。\n\n\n图 1.3: 由 VBScript `onClick` 事件处理器触发的弹出对话框演示\n\
  \n### 引用外部脚本\n\nVBScript 还提供了一种功能，允许通过将 VBScript 存储为具有 `.vbs` 扩展名的外部文件并对其提供引用，将其从\
  \ HTML 中分离离。此选项使你的 HTML 和 VBScript 代码分离，可能使两者都更易读且易于管理。此选项还允许你创建可以被任意 HTML 页面调用和共享的\
  \ VBScript。\n\n\n```html\n <HTML>\n    <TITLE>Script 1.3 - 执行外部 VBScript 的示例</TITLE>\n\
  \  </HEAD>\n  <BODY>\n  </BODY>\n</HTML>\n```\n如你所见，`SRC=\"Script 1.4.vbs\"` 参数标识了外部\
  \ VBScript 文件的名称。外部 VBScript 文件可以包含任意数量的 VBScript 语句。它必须保存为纯文本文件，且不能包含任何 HTML 内容。例如，如果将以下\
  \ VBScript 语句保存为 `Script 1.4.vbs`，当它被 HTML 示例执行时，将显示图 1.4 所示的弹出对话框。\n\n![点击展开](img/fig1-4_0.jpg)\n\
  图 1.4: 由外部引用的 VBScript 显示的弹出对话框\n\n```vbscript\n```\n\n## WSH\nWSH 是一个编程环境，支持直接从\
  \ Windows 桌面或命令提示符执行脚本。默认情况下，WSH 支持 VBScript 和 JScript 脚本语言，尽管也可以对其他脚本语言的第三方支持。WSH\
  \ 为脚本提供了一个可以执行的环境。此外，WSH 为脚本提供了直接访问许多 Windows 资源的权限，包括：\n\n* Windows 文件系统\n* Windows\
  \ 注册表\n* Windows 服务\n* 打印机和磁盘驱动器\n* Windows 快速启动工具\n* 其他 Windows \n\n\n表 1.2: 微软操作系统对\
  \ WSH 的支持\n\n| --- | --- | --- |\n| Windows 95 | 是 | 否 |\n| Windows 98 | 是 | 1.0\
  \ |\n| Windows NT | 是 | 否 |\n| Windows 2000 | 是 | 2.0 |\n| Windows XP | 是 | 5.6\
  \ |\n虽然 Windows 95 和 NT 4.0 未随附带它，但你可以将 WSH 升级到 `5.6` 版本。要下载最新的 WSH，请访问 [`msdn.microsoft.com/scripting`](http://msdn.microsoft.com/scripting)。\n\
  \n## WSH 架构\nWSH 是一个 32 位应用程序，它由三个主要组件组成：\n\n* 脚本引擎\n* 核心对象模型\n\n脚本引擎为 WSH 提供了将特定脚本语言编写的语句转换为执行主机可执行格式的能力。WSH\
  \ 提供了不同的执行主机。这些主机提供了从桌面或命令提示符运行脚本的能力。最后，核心对象模型为脚本提供了访问 Windows 资源的权限。图 1.5 描述了这三个组件之间的关系。\n\
  ![点击展开](img/fig1-5_0.jpg)\n\n图 1.5: 组成 WSH 的组件\n#### 脚本引擎\n\n脚本引擎为 WSH 提供了解释特定脚本语言并转换为格式的能力。默认情况下，微软为\
  \ WSH 提供以下脚本引擎：\n* VBScript\n* JScript\n\n\n表 1.3: 第三方 WSH 兼容脚本引擎\n\n| --- | ---\
  \ | --- |\n| Perl | ActivePerl | [`www.activestate.com`](http://www.activestate.com)\
  \ |\n| Python | ActivePython | [`www.activestate.com`](http://www.activestate.com)\
  \ |\n\n#### 执行主机\n\n\n* `CScript.exe`: 提供从 Windows 命令提示符执行脚本，并赋予脚本在 Windows 命令控制台中显示文本消息的能力\n\
  * `WScript.exe`: 提供从 Windows 桌面执行脚本，并提供在图形弹出对话框中显示文本消息的能力\n\n\n\n两种脚本执行主机之间的唯一区别在于\
  \ `WScript.exe` 执行主机具有以图形方式显示输出的能力。除此之外，两种脚本执行主机提供的功能是相同的。要从 Windows 桌面使用 `WScript.exe`\
  \ 执行主机运行脚本，只需找到它并双击其图标即可。与 `Cscript.exe` 执行主机一样，`WScript.exe` 执行主机也可以用于从 Windows\
  \ 命令行提示符运行脚本。如下所示，你可以在 Windows 命令行提示符中使用 `WScript.exe` 执行主机运行脚本。\n\n```\n```\n\n\
  同样，你可以使用 `CScript.exe` 执行主机从 Windows 命令行提示符运行脚本，如下所示。\n```\n CScript scriptname\n\
  ```\n如果你有任何需要传递给脚本的参数，请在脚本名称后用空格隔开输入它们，如下所示。\n\n```\n```\n\n作为一个一般原则，当脚本从 Windows\
  \ 命令行提示符运行或由 Windows 调度服务运行且不需要与用户进行交互时，通常会使用 `CScript.exe` 执行主机。当需要与用户交互时，最好使用弹出对话框而不是\
  \ Windows 命令行提示符，使得 `WScript.exe` 执行主机成为更好的选择。\n## 核心对象模型\n\nWSH 的核心对象模型提供了脚本以编程方式交互和操作\
  \ Windows 资源的能力，对象模型将这些资源暴露或表征为对象。WSH 核心对象模型实现为名为 `WSH.OCX` 的 ActiveX 。WSH 对象模型暴露的对象的示例包括驱动器、打印机、文件和快捷方式。WSH\
  \ 对象模型暴露的每个对象都有一组属性和方法。VBScript 可以使用这些属性和方法来交互并控制这些资源。\n`Properties`（属性）是对象的特定属性，用于描述或修改对象的特定功能或组件。例如，桌面快捷方式有一个文件名和一个文件扩展名。属性的值可以被查看和更改，从而对快捷方式产生直接影响。`method`（方法）是内置的\
  \ WSH 函数。方法可以用于对对象执行操作。例如，存在允许脚本创建和删除快捷方式的方法。\n\n通过使用 WSH 核心对象模型暴露的对象的方法和属性，可以开发出\
  \ VBScript，在任何运行 Windows 95 或更高版本且已安装 WSH 的计算机上实现任务自动化。\n## 编写 WSH VBScript\n\n\
  由 WSH 执行的 VBScript 保存为具有 `.vbs` 扩展名的纯文本文件。与 Visual Basic 或 VBA 不同，VBScript 不提供内置的\
  \ IDE。你可以使用任何编辑器来创建 VBScript 文件，只要该编辑器可以以纯文本格式保存文件。例如，所有版本 Windows 自带的记事本程序都适用于此目的。\n\
  | | 注意 |\n|---|有许多第三方 VBScript 编辑器你可能想要研究，它们将会在与 WSH 工作时让 VBScript 开发变得更简单。这些编辑器提供了诸如行号、彩色语句着色以及在不退出编辑器的情况下测试脚本的功能。其中一个示例是\
  \ VbsEdit，你可以在 [`www.adersoft.com`](http://www.adersoft.com) 找到它。 |\n\n\n```\nUserName\
  \ = InputBox(\"What is your name?\")\n```\n\n第一语句收集用户的用户名，第二语句接着使用用户名显示自定义问候语。一旦保存并执行，该\
  \ VBScript 将与用户进行交互，如 图 1.6 和 1.7 所示。\n![点击以展开](img/fig1-6_0.jpg)\n\n图 1.6：使用 WSH\
