  \ 还需要设置它们的计划执行。此任务的完成还包括在 Windows 2000 专业版工作站上一次性创建一个特殊的服务账户，以便于计划任务的执行。\n\n###\
  \ 创建注册表设置脚本\n\n与其将脚本设置嵌入每个 VBScript 中或将它们存储在一个或多个 `INI` 文件中，Molly 决定学习如何将它们存储在 Windows\
  \ 注册表中。这样，她的脚本运行得会更快，因为它们不需要为了检索设置而执行任何文件 I/O，而且她不需要手动编辑脚本，从而了在修改脚本设置时出现意外拼写错误的风险。事实上，使用\
  \ Windows 2000 或 Windows XP 提供的 `Regedt32` 工具，她能够从自己的桌面上远程地修改脚本的注册表设置，如图 21.2 所示。\n\
