  \ 对象字符串键的比较模式 |\n| `Count` | 返回一个表示集合或 `Dictionary` 对象中项数的值 |\n| `DateCreated` |\
  \ 获取文件或文件夹的创建日期 |\n| `DateLastAccessed` | 获取文件或文件夹上次访问的日期时间 |\n| `DateLastModified`\
  \ | 获取文件或文件夹上次修改的日期时间 |\n| `Drive` | 获取存储文件或文件夹的驱动器号 |\n| `DriveLetter` | 获取指定驱动器的驱动器号\
