- "# Microsoft VBScript 专业项目指南\n\n\n\n![](img/cover.jpeg)\n\n\n\n这本强大的指南是 VBA 和 Visual\
  \ Basic 程序员的理想之书，它为高级用户提供了一种基于项目的方法，并涵盖了 VBScript 在 Web 和 WSH 脚本中的适用性。\n\n\n\n\n\
  \n使用 VBScript 完成真实世界中的专业任务。《微软 VBScript 专业项目》(Microsoft VBScript Professional Projects)\
  \ 包含了四个实战项目，是你开启 VBScript 力量的钥匙。每个项目都关注一个特定的概念，并基于现实场景。你将能够利用书中学的技能来修改项目，以满足你的专业需求。\n\
  \n使用 VBScript 和 `WSH` 进行桌面管理：在开发可以与操作系统及其环境交互的 VBScript 的同时，学习如何自动化桌面计算机的管理。开发建立远程网络驱动器连接、配置\
  \ `Start Menu`（开始菜单）以及自动化创建新账户的 VBScript。在完成项目 1 的过程中，你将学习如何从 VBScript 内部直接执行 Windows\
  \ 命令、自动化执行 Windows 实用程序以及直接访问 Windows 文件夹的内容。\n\n开发日志分析器：在学习如何开发一组脚本来读取和处理单份报告以创建一个汇总总结报告时，掌握文件输入处理涉及的基本步骤。在整个完成项目\
  \ 2 的过程中，你将开发各种编程技术，包括读取和处理格式化日志和报告文件的内容、创建新的文本文件以及通过程序自动地执行 VBScript。\n\n创建报告管理站：在项目\
  \ 2 的基础上，你将学习如何开发一个中央报告管理系统来存储报告。项目 3 将为你介绍许多解析报告中存储的信息所需的 VBScript 字符串函数。你还将学习如何自动化执行若干任务，包括远程管理存储在网络驱动器上的文件、发送弹出网络消息通知以及从\
  \ `Windows registry`（Windows 注册表）中检索数据。\n\n通过 Web 报告摘要：在最后一个项目中，你将开发一个包含 HTML 页面的网站，这些页面嵌入了\
  \ VBScript，用于生成图形效果、对配置设置进行验证并将单个用户设置存储在 cookie 中。在完成此项目时，你将创建由 `WSH` 执行的 VBScript，创建显示报告内容的\
  \ HTML 页面、将其复制到 Web 服务器并远程管理 Web 服务器上的报告存档。\n\n**关于作者**\nJerry Lee Ford, Jr. 是一位作家、教育工作者\
  \ IT 专业人士，在信息技术领域拥有 15 年经验，曾担任自动化分析师、技术经理、技术支持分析师、自动化工程师和安全分析师。Jerry 是 MCSE，还获得了微软的\
  \ `MCP` 和 `MCP + Internet` 认证。此外，他拥有弗吉尼亚联邦大学（位于纽约州 Richmond）的工商管理硕士学位。Jerry 还是其他\
  \ 11 本书的作者，包括《周末学 JavaScript》(Learn JavaScript in a Weekend)、《周末学 VBScript》(Learn\
  \ VBScript in a Weekend)、《微软 Windows 脚本和 WSH 管理员指南》(Microsoft Windows Shell Scripting\
  \ and WSH Administrator's Guide)、《初学者微软 WSH 和 VBScript》(Microsoft WSH and VBScript\
  \ for the Absolute Beginner) 以及《Windows XP 专业版管理员指南》(Microsoft Windows XP Professional\
  \ Administrator's Guide)。作为兼任教师，教授信息技术网络课程已有五年经验。\n\n# 微软 VBScript 专业项目\n\nJerry\
