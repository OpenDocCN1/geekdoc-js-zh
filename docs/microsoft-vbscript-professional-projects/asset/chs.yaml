  \ CScript 执行主机查看结果\n完成命令行操作后，你可以像关闭其他 Windows 程序一样关闭控制台。这可以通过点击对话框右上角的关闭图标来实现，也可以右键点击左上角的命令提示符图标并选择“关闭”。你也可以通过在\
