    \ so far = \" + total)\n}\nwhile (total < 100)\n</SCRIPT>\n</HTML>\n```\n\n# Branching\
    \ with if\n\nBranches make programs flexible, allowing them to vary their actions\
    \ in response to incoming data. The simplest form of branch uses the if structure.\
    \ This is the basic syntax:\n\n```\nif (test)\n  { statement(s) if true }\n```\n\
    \nThe test checks the value held by a variable. If the test proves true, the program\
    \ performs the statement(s), otherwise they are ignored. For example:\n\n```\n\
    if (balance < 0)\n  alert(\"You are overdrawn\")\n```"
