  md: "Look at any character set (use the Character Map in Windows Accessories), and\
    \ you will see that there are punctuation and other symbols scattered between\
    \ the blocks of letters and digits. A test for these would look like this:\n\n\
    ```\nif ((letter > \" \\) && (letter < \"0\") || (letter >= \"9\") && (letter\
    \ < \"A\") || (letter > \"Z\") && (letter <= \"a\") || (letter >= \"z\"))\n```\n\
    \nThis is not an elegant solution! And it's not just that it doesn't look nice.\
    \ Complicated code is more likely to contain errors. This expression took some\
    \ time to work out and test – and I'm still not 100% sure about it!\n\nHere's\
    \ a much better solution. If ... else structure gives two branches from the same\
    \ test – one to follow if it is true, and one if it is false. This can be extended\
    \ to handle multiple branching.\n\n+   - if (test1)\n  {statement(s) if test1\
    \ is true}\n- else if (test2)\n  {statement(s) if test2 is true}\n- else\n  {statement(s)\
    \ if no tests are true}\n\nIf test1 is false, the program tries test2, and failing\
    \ that, tries the next. If all the tests prove false, the program performs the\
    \ statements after the final else. Here's the revised routine.\n\n```\n<HTML>\n\
    <HEAD>\n<TITLE>Character tester</TITLE>\n</HEAD>\n<body>\n<SCRIPT>\nletter = prompt(\"\
    Enter a character,\")\nwhile (letter != \"q\")\n{\n  if (letter < \" \\)\n   \
    \ alert(\"Non-printing character entered\")\n  else if (letter >= \"a\" && letter\
    \ <= \"z\")\n    alert(\"Lower case letter entered\")\n  else if (letter >= \"\
    A\" && letter <= \"Z\")\n    alert(\"Upper case letter entered\")\n```"
