  md: '```

    <HTML>

    <HEAD>

    <TITLE>The Status bar</TITLE>

    </HEAD>

    <BODY>

    <SCRIPT>self.status = ''Hello and welcome''</SCRIPT>

    <FORM NAME = form1>

    <INPUT TYPE="button" VALUE="Click Me

    onClick="self.status = ''Thank you for clicking''">

    </FORM>

    <A href="www.theplace.com onMouseOver="window.status = ''Click and visit''; return
    true" onMouseOut="window.status = ''Go back and click me!"">This is a link</A>

    </BODY>

    </HTML>

    ```


    Type in the code, save it and view the page in your browser.

    What happens to the Status bar when the page opens, when the button is clicked,
    when you pause over the link and when you move off the link? Now, change the first
    line of JavaScript code to read:


    self.defaultStatus = ''Hello and welcome''


    The Status method sets the Status bar until it is changed by something else. defaultStatus
    has a more permanent effect. It defines what is unless it is being actively changed.
    Edit the line and test the page again. You will find that the Status bar reverts
    to ''Hello and welcome'' after you click the button and when you move off the
    link.


    # Escaping characters


    This is not about jailbreaks! Characters such as " and '' have a special purpose
    in JavaScript. But what if you want to show them on the screen? The answer is
    to write a backslash (also known as *escape*) in front of them. JavaScript then
    treats them as normal printing characters. e.g. this line:


    ```

    document.write("He said, "You\ve got to visit http:\:www.tybooks.com\''")

    ```'
