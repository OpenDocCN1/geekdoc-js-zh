- img_proc: true
  md: "# Look at the start of the factorial sequence:\n\n1! = 1\n2! = $2 \\times 1$\
    \ or $2 \\times 1!\\n3! = 3 \\times 2 \\times 1$ or $3 \\times 2!n4! = 4 \\times\
    \ 3 \\times 2 \\times 1$ or $4 \\times 3!$\n\nYou can find the factorial of any\
    \ number by multiplying that number by the one factorial of the next lower number.\
    \ This works all the way down to 1!, which is equal to 1. We can turn this into\
    \ pseudo-code (i.e. written in English, but structured like code).\n\n```\nif\
    \ the number is 1\n  the factorial is 1\nelse\n  the factorial is the number times\
    \ the factorial of the\n  next lower number\n```\n\nWhich translates directly\
    \ to this function:\n\n```\nfunction factorial(num)\n{\n  if (num==1)\n    return\
    \ num\n  else\n    return num * factorial(num-1)\n}\n```\n\nSo, if you first call\
    \ the function with the expression factorial(3), it will produce the expression\
    \ $3 * factorial(2)$ – calling itself. On the next time round, it generates $2\
    \ * factorial(1)$ and calls itself again. This time it gets the answer 1, and\
    \ returns this value to the previous call, which uses it to calculate the value\
    \ 2, returning that to the top level. At this point the function does $3 * 2$\
    \ and gets the answer 6, which it passes back to the calling script.\n\nType it\
    \ in and test it. The script opens with a prompt so that you can enter any value\
    \ you like. For the initial testing, use numbers that are small enough for you\
    \ to be able to work out the answer yourself, then find out what 100! looks like!"
