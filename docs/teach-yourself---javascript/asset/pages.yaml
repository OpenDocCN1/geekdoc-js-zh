    things look nice later.


    # label


    A label does not actually do anything. Its purpose is to identify a place in the
    code so that program flow is redirected to it by a *switch*, *break* or *continue*
    statement. The basic shape is:


    ```

    label : statement(s)

    ```


    label can be any word, following the same rules as for variable names, except
    for the JavaScript reserved words (see page 155). Note that they must be followed
    by a colon:


    ```

    restart:

    document.write("Picking up again")

    ```


    # break


    We saw *break* used with *switch* (page 65). It also provides a way of escaping
    from *for* or *while* loops. It is essential if there is a possibility that the
    exit condition will *never* be met, but it can also be useful where you just need
    an alternative exit.


    In the example, the loop allows users three chances to work out the answer to
    a sum.'
