    # Image objects


    Images can be created in two ways – with the <IMG> tag and with the Image() constructor.


    # <IMG> images


    <IMG> images are, of course, placed on the form and have a whole set of properties,
    including height, width, hspace and vspace that can be used to format their position,
    size and appearance. JavaScript can set these, but cannot change them once the
    page has been loaded. The SCR, however, can be changed.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'The images are automatically formed into the array images[], and numbered in
    the order of their position in the document. So the first image can be referred
    to as document.images[0].

    <IMG> images have three event handlers: onLoad is triggered by successful loading,
    onAbort and onError are triggered when loading is cancelled or fails. You will
    notice that they do not respond to mouse clicks or movements. There is a way round
    this, as you will see.


    # Image()


    Image() images are a type of variable and are stored in memory. They allow you
    to preload images for later display and are especially useful in animation and
    other situations where you want to be able to drop in a new image quickly without
    the downloading delay.


    ```

    storedImage = new Image()

    storedImage.src = "newpic.gif"

    ```


    This sets up the Image() objects, storedImage and assigns it to the image newpic.gif.
    Note the src property is used here in exactly the same way as SRC in an IMG tag.


    ```

    tinyImage = new Image(50,25)

    tinyImage.src = "newpic.gif"

    ```


    These lines set up a second Image() objects, tinyImage, but in this the optional
    width and height parameters were given. Though the same image, newpic.gif, is
    loaded, it will be held in a reduced form, 50 pixels wide and 25 pixels high.


    An Image() object has the same properties as an <IMG> plus a couple more. The
    most important of these is complete, which is set to true when the image has been
    fully downloaded.


    # Image formats


    Web browsers – and therefore JavaScript – can only handle graphics in two formats
    – GIF and JPEG (with a .JPEG or .JPG extension). If you want to create your own
    images, you will need a suitable graphics application, such as Paint Shop Pro.
    With this you can draw new images or convert images from another application into
    GIF or JPEG format.'
