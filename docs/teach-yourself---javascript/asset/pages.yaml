  md: '# The Date methods


    Date and time are measured in milliseconds – there are 86,400,000 in a day – counting
    +/- 100 million days from 1st January 1970, UTC (universal) or GMT (Greenwich
    Mean Time). Date values can be given in milliseconds, or as a string, and JavaScript
    recognizes all the standard formats.


    getDate() gives the day of the month from the specified date.


    getDay() gives the number of the day of the week, 0 = Sunday.


    getFullYear() gives the year as a 4-digit number.


    getHours() gives the hour.


    getMilliseconds() gives the millisecond component of the date.


    getMinutes() gives the minutes component of the date.


    getMonth() gives the number of the month, 0 = January.


    getSeconds() gives the seconds component of the date.


    getTimezoneOffset() gives the difference between local time and UTC.


    getFullYear() gives the year as a 2-digit number.


    All get... methods are used in the form:


    ```

    component = date.getComponent()

    ```


    All get... methods have UTC equivalents, e.g. getUTCDay() gives the day number
    by UTC time, rather than local time.


    All get... methods have set...() equivalents, e.g.Day() which set the component
    of the date variable.


    parse() converts a date string into milliseconds since 1/1/1970.


    toGMTString() converts a local date/time to a GMT date/time.


    toLocaleString() converts a GMT date to a local date.


    toString() converts a date value to a text string.


    UTC() the UTC equivalent of parse().'
