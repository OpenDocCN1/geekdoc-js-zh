    # Trigonometry


    JavaScript has the standard trigonometry functions: cos(), sin() and tan() which
    give the sine, cosine and tangent of angles, and also has acos(), asin(), atan()
    and atan2() which convert sines, cosines and tangents back into angles.


    The main thing to note here is that like most programming languages, JavaScript
    measures angles in radians, not in the degrees which are more familiar to most
    people.


    A radian is the angle where the arc on the circumference is equal to the radius
    of the circle.


    ![](img/abd8c35820179838d3f97b872561195a_97_0.png)


    You should remember from your school maths that there are 2Pi radians in a circle
    (circumference = 2*Pi*radius). We can use this to work out the value of 1 radian:


    +   1 radian = 360 / 2 * Pi degrees

    = 180 / 3.14

    = 57.3 degrees (approximately)'
