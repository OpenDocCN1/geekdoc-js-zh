    # # Simple animation


    Unlike<IMG>s, image objects are not automatically put into an array, which is
    a bit of shame because you often need them in one. If you want to display a sequence
    of images, the simplest way to do it is to store them in an array, then run the
    array through a loop.


    To set up an array, first load the images into separate objects, then create a
    new array, giving it the names of the objects. In the example, there are six image
    files.


    ```

    pic0 = new Image()

    pic0.src = "pic0.gif"

    pic1 = new Image()

    pic1.src = "pic1.gif"

    ...

    ```


    ```

    pictures = new Array(pic0,pic1,pic2,pic3,pic4, pic5)

    ```


    You have a simple means to assign a new image. Here''s the line at the top of
    the *animate()* function:


    ```

    pagePic.src = pictures[current++].src

    ```


    This assigns the selected image to the pagePic <IMG>. current is then incremented
    ready for next time.'
