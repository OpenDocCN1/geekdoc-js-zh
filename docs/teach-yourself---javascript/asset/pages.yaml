  md: "Here is what happens when the buttons are clicked:\n\n+   * Numbers decimal\
    \ point – pass the button value to `doNum()` to add the display box\n* Operators\
    \ – pass the operator to `doOp()` which stores in `n1` the current value in the\
    \ display box and stores the operator in op. It clears the box for the next number.\n\
    * Equals sign – runs `calculate()` which takes `n1` and the current value in the\
    \ display and combines them according to the current value of `op`.\n* Root, Sine,\
    \ Cosine and Tangent – these call `doFunc()` which uses the Math methods to work\
    \ out the values. Note how it converts angle values from degrees to radians using\
    \ `toRad()`\n\n```\n<HTML>\n<HEAD>\n<TITLE>JavaScript calculator</TITLE>\n<SCRIPT>\n\
    function doNum(x) {\n  f1.display.value = f1.display.value + x\n}\nfunction doOp(operation)\
    \ {\n  n1 = eval(f1.display.value)\n  op = operation\n  f1.display.value = \"\"\
    \n}\nfunction toRad(deg) {\n  return deg / 360 * 2 * Math.PI\n}\nfunction doFunc(fn)\
    \ {\n  n1 = eval(f1.display.value)\n  angle = toRad(n1)\n  if (fn == \"r\")\n\
    \    f1.display.value = Math.sqrt(n1)\n  } else if (fn == \"s\")\n    f1.display.value\
    \ = Math.sin(angle)\n  } else if (fn == \"c\")\n    f1.display.value = Math.cos(angle)\n\
    \  } else if (fn == \"t\")\n    f1.display.value = Math.tan(angle)\n}\n```"
