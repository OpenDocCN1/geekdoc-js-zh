    # Checking entries


    If a form is to be completed properly, some items of data may be essential – you
    must have the visitor’s address if you are to send them something. Other entries
    may have to fall into a certain range of values – dates and order numbers must
    be valid.


    # Is there anything there?


    You can easily check whether or not data has been entered into a text box, and
    with relatively little code, you can send your visitor back to enter something.
    Attach this to any text box or text area if you don’t want your visitors to leave
    it blank:


    ```

    onBlur = "if(this.value==""){alert(''Data please'');this.focus()}\}"

    ```


    this refers to whichever object it is attached to. If it is empty (value=""),
    the following commands, held in {curly brackets}, will be executed.


    The focus() method places the cursor in a text box. (It also activates pages,
    highlights buttons and selects other objects.)


    this.focus() puts the cursor into the current box. It works reliably when run
    from code within the event handler, though it can get confused if used in code
    in functions. Somewhere in the process of transferring from page to function it
    can lose track of which element this refers to.


    I like to keep event handling code as simple as possible, so in the next example,
    this of checking is managed by the function checkData(). The elements[] array
    number of the text box is passed to it, e.g.'
