    3. Use the write() method to create a page with <H1> and <H2> headings and at
    least two separate lines of text.


    # Summary


    +   - JavaScript objects have properties, methods and event handlers.

    - The name of an object depends partly on its place in the window/document/form
    hierarchy.

    - Different objects have different sets of properties

    - To identify a property of an object, give its full name with the property name
    appended.

    - You can read and change the properties of objects from within JavaScript.

    - A method is a ready-made function. All methods belong to, and normally act upon,
    objects.

    - Event handlers respond to the events that occur to objects. They can be used
    to trigger JavaScript code.'
