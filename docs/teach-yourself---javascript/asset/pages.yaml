    # Buttons


    The <BUTTON> tag is a flexible alternative to <INPUT TYPE = Reset/Submit>. If
    all you want is a standard ‘Submit’, then it takes a little more work to do it
    this way, with no advantage. Compare these two lines. They produce identical results:


    ```

    <BUTTON TYPE="submit"> Send me </BUTTON>

    <INPUT TYPE = "submit" VALUE = "Send me">

    ```


    A <BUTTON> gives you more control over what appears on the button. You can format
    the text:


    ```

    <BUTTON TYPE="submit"><FONT SIZE = 5 COLOR = red>

    <B> Send me </B></FONT></BUTTON>

    ```


    This gives you large, bold, red characters on the button.'
