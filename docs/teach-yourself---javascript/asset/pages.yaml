  md: "The switch structure can be used to replace a whole set of if statements, where\
    \ these all test the same simple variable for different values. A typical use\
    \ would be with a menu, where the switch directs the flow to the chosen option's\
    \ routine. The basic shape of the switch structure is:\n\n```\nswitch (expression)\n\
    {\n  case value:\n    statement(s)\n    break\n  case value: statement(s); break\n\
    \  ...\n  default : statement(s)\n}\",\n```\n\n# Alternative layouts\n\n+   *\
    \ The switch does a simple match, comparing each of the values with the expression\
    \ – you cannot use the relational operators here.\n* The values must be enclosed\
    \ in quotes and followed by a colon.\n* You need a break at the end of each of\
    \ the case statements to jump out of the switch block.\n* The statements can be\
    \ written on a series of lines or on a single line. In the latter case they must\
    \ be separated by semicolons.\n* The statements on the (optional) default line\
    \ are performed if there are no matching cases.\n* You can only test one value\
    \ with each case. If several values lead to the same actions, write them on successive\
    \ lines. e.g.:\",\n\n```\ncase \"purple\": :\n  case \"pink\": :\n    document.write(\"\
    Wazzup? You colour blind?\")\",\n```\n\nThe following program shows switch at\
    \ work. Notice this line:\ncolour =colour.toLowerCase()"
