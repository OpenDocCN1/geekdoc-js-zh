  md: '# The Math methods


    abs(num) strips off any minus sign, so abs(-4) = abs(4) = 4


    acos(num) gives the arc cosine (i.e. the angle for which num is the cosine), measured
    in radians.


    asin(num) gives the arc sine (i.e. the angle for which num is the sine) measured
    in radians.


    atan(num) gives the arc tangent (i.e. the angle for which num is the tangent)
    measured in radians.


    atan2(x,y) gives the angle, in radians between the X axis and a line drawn from
    0,0 to x,y.


    ceil(num) rounds a decimal value up to the next integer, e.g. ceil(4.6) = 5.


    cos(angle) gives the cosine of angle, given in radians


    eval() returns a number from a string or calculation.


    exp(log) converts a logarithm back into a number.


    floor(num) rounds a decimal value down to the next integer, e.g. floor(4.6) =
    4.


    log(num) gives the logarithm of a number


    max(num1,num2) compares two values and returns the highest.


    min(num1,num2) compares two values and returns the lowest.


    pow(n,p) raises n to the power of p ; e.g. pow(2,3) = 2^3 = 8


    random() generates a random number in the range 0.0 to 1.0.


    round(num) converts a number with a decimal fraction up or down to the nearest
    integer.


    sin(angle) gives the sine of angle, given in radians


