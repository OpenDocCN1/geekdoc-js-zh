  md: '# Time


    If you want to display the time, the technique is much the same as used for the
    date, though there are a couple of wrinkles that need to be iron out.


    Here''s the basic routine. It uses the getHours(), getMinutes(), and getSeconds()
    methods to extract the hour, minutes and seconds values from the date, then combines
    them into a string with ":" between the parts.


    ```

    <HTML>

    <HEAD>

    <TITLE>Time - version 1</TITLE>

    </HEAD>

    <BODY>

    <SCRIPT>

    d = new Date()

    hour = d.getHours()

    mins = d.getMinutes()

    secs = d.getSeconds()


    document.write(hour + ":" + mins + ":" + secs)

    </SCRIPT>

    </BODY>

    </HTML>

    ```


    # Improving the display


    At first sight, you may not see any problem with the display. Here, for example,
    is what the routine has just given me:


    14:56:12


    But when I reloaded the page a few moments later, I got this:


    15:0:4


    Single digit values do not look good! They need a leading ''0''. The neatest solution
    here is to use the conditional operator ? : that we looked at in Chapter 4. The
    expression:


    (mins<10) ? ":0" : ":"


    will produce ":0" when the minutes are in single digits, and "::" otherwise. We
    can use this instead of a plain ":" when creating'
