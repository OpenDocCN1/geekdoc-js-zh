    In practice, you would not use a separate file for something as trivial as this.
    A file makes sense where you have functions you want to use in several pages.
    By writing them into a file, you only have to type them in and test them once,
    but you can use them as often as needed.


    # Programming languages


    The only language that a computer can understand is machine code. This consists
    of numbers that the chip translates directly into commands, values and memory
    addresses. The commands are extremely simple; e.g. ''move this value into this
    memory address'', ''add 1 to this value''. Every type of computer has its own
    version of machine code.


    In the early days, when computers were much simpler, people wrote programs in
    machine code. No one does nowadays – it''s very hard work and there are better
    ways to write software.


    Programming languages use words and structures that are (more or less) comprehensible
    to humans. The programmer writes instructions as a text file – known as the source
    code – which is then converted into machine code for the computer. There are basically
    two ways of doing this.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Compiled languages


    Some programming languages are *compiled*. The source code is passed to a *compiler*
    program, which first checks the text for errors, and stops if it finds any. The
    programmer must sort them out before the compiler will go to the next stage and
    turn the text into the machine code of an executable program.


    The program will only run on the same type of computer which it was compiled,
    because different types have different hardware and use different machine code.
    If you want to run the same program on different types, such as Windows and Linux
    PCs and Macintoches, you can — in theory take the source code across and recompile
    it. In practice, the code will normally need some rewriting because each machine
    tends to do some things in its own special ways.


    # Interpreted languages


    Source code can also be *interpreted*. An *interpreter* takes each line in turn,
    checks it for errors, then — if it''s error-free — converts it to machine code
    and executes it. As with the compiled languages, you normally have to rewrite
    the source code to transfer a program to a different platform.


    JavaScript is an interpreted language. Unusually — and happily for us — the same
    code will work on any type of computer, as long as it is running a reasonably
    modern version of Internet Explorer or Netscape Navigator (anything from 4.0 onwards).
    The interpreter is built into the browsers, and it''s the browsers that handle
    the differences between hardware platforms.


    # Starting JavaScript


    Any piece of JavaScript code normally has all or most of these elements:


    +   - one or more objects on the page, and an event relating to an object

    - some stored data

    - statements which create its structure

    - calculations or other processing of data.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Objects


    JavaScript sees a web page as a collection of objects. Images and the buttons,
    text boxes and other components of forms are all objects, as is the page itself
    and the browser window that it is in.


    +   - All objects have properties, such as colour, position or the text that they
    hold.

    - Most objects have methods – ready-made routines which are used for manipulating
    the object.

    - Most objects have event handlers – routines which are triggered when the object
    is clicked or changed in some way. These can be used for activating JavaScript
    code.


    The next chapter introduces browser objects, their properties, methods and event
    handlers. Once you have got to grips with those you can start to write code that
    will interact with the browser and visitors to the page.


    > JavaScript objects

    There are other JavaScript ''objects'' – Array, Date, Math and String – which
    are really just collections of methods. We will leave these until Chapters 3 and
    5.


    # Stored data


    If you want to carry data from one part of a program to another, or keep it safe
    while other things are happening, it can be stored in variables – named memory
    locations. They are not needed if your code does no more than simple interaction
    with the browser page, but to go beyond this you need to be able to handle stored
    data.


    Chapter 3 will introduce variables.


    # Program structure


    A program consists of one or more statements – lines of code. At the simplest,
    the statements will be executed once, one after the other. But there can be lots
    more to it than this, which is'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'where the fun comes in programming. You can get the code to loop back, so that
    a set of statements are repeated many times – to process a mass of information
    or to create some kind of cumulative effect. You can write code which checks values
    and runs in different directions, depending upon the result.


    We shall be looking at ways to control the flow of a program in Chapter 4.


    # Calculations and methods


    You can do a wide range of data processing with JavaScript. As well as simple
    arithmetic, it can handle a wide range of mathematical functions, manipulate text
    in many and varied ways, calculate time and dates, and sort or otherwise process
    blocks of data.


    Arithmetic calculations are covered in Chapter 5. The methods used in processing
    maths, text and dates are introduced in Chapter 5.


    # Putting it together


    In the second half of the book, we will draw all these elements together to explore
    some of the ways in which we can use JavaScript to create active and interactive
    pages.


    # Learn by doing


    The best way to get to grips with any programming language is to play with it.
    Try all the sample code given in this book. First type it in exactly as given,
    then explore the concepts and techniques by varying the text, values, sizes or
    other aspects. When you are clear about how each new element works, combine it
    with what you learned previously and write your own pages.


    You do not need any special software for JavaScript – just a browser and a text
    editor. I use Internet Explorer and Notepad. I use Notepad for three reasons –
    it has all the editing facilities I need; it’s a small program and is so fast
    to load; and it’s what is used by the View > Source command in Internet Explorer
    to display the page – which is very handy.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Test procedures


    You will find your own way of working after a while, but here''s how I test code
    – you may like to do the same.


    +   1 Write the first program page in your text editor and save it as test.htm
    (or something similar).


    +   2 At the start of later working sessions, open your test page in your browser.


    +   3 Use View > Source to open the page in your text editor.


    +   4 Edit and rewrite the code to test the next idea.


    +   5 Save the edited file – use File > Save or click the Save button.


    +   6 Go back into Internet Explorer.


    +   7 Click the Refresh button to reload the page.


    +   8 When you produce something that you want to keep for future use, simply
    save it with a new name, go back to test.htm for the next test.


    Using the same file and flickering between the text editor and the browser in
    this way is quicker and simpler than opening and closing different files.


    # Comments


    Try to make your JavaScript code readable. When you come back to a page after
    a few days, weeks or months, you shouldn''t struggle to make sense of it. Giving
    meaningful names to your variables, functions and objects will help, and may be
    enough with short pieces of code. If your code is longer or more complex, you
    should add comments to remind yourself what is stored in variables and how routines
    work.


    There are two ways to write comments.


    +   * For a short note at the end of a line or on a line by itself start with
    a double slash:


    ```

    // num holds 5 at this point

    num1++; // num now holds 6

    ```'
  merge: -1
  pgno: 22
