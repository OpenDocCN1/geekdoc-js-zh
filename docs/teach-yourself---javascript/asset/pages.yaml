  md: 'Where the date is written as text the whole expression must be enclosed in
    quotes. The last three figures – hours, minutes, seconds – optional in both forms.


    If you write the Date value or copy it to a text box, without processing it in
    any way, it will be displayed in the standard form. These lines:


    ```

    today = new Date()

    document.write(today)

    ```


    produce output like this:


    Thu Apr 10 10:28:06 UTC+0100 2003


    This tells us the date and time, and the variation from the universal time clock
    (UTC), but it is not a display that you would normally want to use.


    To improve the display, we first need to break the date information down into
    its components. The methods getYear(), getMonth(), getDay(), getDate(), getHours(),
    getMinutes() and getSeconds() will do this.


    ```

    thisDay = today.getDay()

    ```


    getDay() returns the number of the day of the week, counting from 0 on Sunday.
    If you want to display the day in words, you will have to set up an array, then
    draw the day out of it.


    ```

    days = new Array("Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday",
    "Saturday")

    weekday = days[thisDay]

    ```


    As I write this, thisDay is 4, and weekday is ‘Thursday’.


    The getMonth() method similarly gives you month number, starting with January
    at 0. This gives you a simple translation if you set up an array of month names,
    but watch out for if you want to display the month as a number – you must add
    1.


    This line – and notice the +1 after getMonth()...


    ```

    document.write(today.getDate() + "/" + (today.getMonth() + 1) + "/" + today.getFullYear())

    ```


    ...displayed on this the April:


    10/4/2003'
