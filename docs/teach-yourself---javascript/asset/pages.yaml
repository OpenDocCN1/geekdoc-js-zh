  md: '# Variables


    Variables are named places in memory where you can store the data for use in programs.
    You can have as many variables as you need, and call them what you like – within
    the rules for names (see next page). When you run the script, the system will
    allocate space for the variables, and convert the names into the memory addresses
    that the computer uses.


    Here Sum holds 145, -99 and visitor holds ''Jo Bloggs''. These values can be changed
    at any point either by the script or by the user entering data.


    | Variable name | Memory |

    |---|-|

    | Sum | 145 |

    | x | -99 |

    | visitor | Jo Bloggs |


    Unlike most programming languages, JavaScript does not mind what type of data
    you store in a variable – the same can be used, at different points in the code,
    to store numbers, text or other values.


    There are essentially three types of data:


    numbers JavaScript does not distinguish between integers (whole numbers) and those
    with decimal fractions – you can mix and match them as much as you like. Numbers
    are normally handled in the denary (base 10) format, though JavaScript can read
    values in octal, hexadecimal and other bases.


    strings Any text written in quotes in the code, or typed by a user is a string.
    It can consist of any number of characters from 1 upwards – if there is a maximum,
    I have never run up against it.


    Boolean These are either true or false. They are mainly used for carrying the
    results of a test from one part of the code to another.


    A variable can also hold null. This is used to refer to empty strings and missing
    objects.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Creating variables


    Variables should be set up, or declared, using the keyword var.

    var visitor

    var max = 500


    The first line creates the variable visitor, but without giving it a value; the
    second creates max, and assigns 500 to it.


    You can also set a variable at any point in a script by simply assigning a value
    to it:


    ```

    x = -99

    message = "Thank you for calling"

    ```


    These lines set up a variable x with a value of -99, and one called message holding
    the string "Thank you for calling".


    Where variables are used to hold important data, or to transfer data from one
    part of a program to another, it is good practice to declare them at the start
    of the program or the block of code in which they are used. When you come back
    to your code after a few weeks, it will be easier to understand if you can see
    at a glance what variables are used in the program and what their initial values
    are.


    # Variable names


    The rules for variable names are the same as those for object names. Names must
    start with a letter or underscore (_) and may contain any combination of letters
    and digits. Spaces cannot be used and symbols should be avoided. You may not use
    any of the reserved words (see page 155). Keeping names short and simple will
    reduce typing errors, but the most important rule is that names must mean something
    to you!


    You can either upper or lower case letters in a name, but mix them with care as
    JavaScript is case-sensitive. myName, myname, MyName and MY are four different
    things. The convention is to use capitals only at the start of following words
    in a multi-word name.


    ```

    ageLimit = 18

    sex = "M"

    var VATue

    ```'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Assigning values


    To assign a value to a variable, use code of this pattern:


    variable = value


    The value can be:


    +   * a literal – some text, or a number, or the words true, false

    (with Boolean variables) or null;


    +   * another variable;


    +   * a calculation or other expression;


    +   * a function or method that produces a value.


    # Displaying variables


    Variables can be used wherever you can use text or numbers.

    You can write them on screen, or display them in text boxes on

    forms or in dialog boxes (see page 56).


    ```

    document.write(sum)

    ```


    This will write the value of sum on the page. If you want to

    display the variable with some accompanying text, they can be

    joined together by the + sign.


    ```

    document.write("The total is " + sum)

    ```


    Notice that there is a space inside the quote at the end of the

    text. This is needed to separate the text and the variable when

    they are written to the screen. Miss it out and you will get:


    The total is999


    # The scope of variables


    The scope of a variable means those parts of the code which

    can read or change its value. A variable’s scope depends upon

    how and where it was created.


    # Global variables


    Variables declared by assignment in the <BODY > of a docu-

    ment have global scope. They can be accessed by any JavaScript

    anywhere else in the document – in another <SCRIPT> block,'
  merge: -1
