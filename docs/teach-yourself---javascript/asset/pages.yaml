  md: "# RegExp\n\nA RegExp object holds a regular expression. It can be used for\
    \ finding and replacing text in strings. An object can be created by:\n\n```\n\
    RegExpVar = /pattern/flags\n```\n\nOr\n\n```\nRegExpVar = new RegExp(\"pattern\"\
    ,\"flags\")\n```\n\nNotice that /slashes/ are used around the pattern in a simple\
    \ assignment, but “quotes” are used when an object is created with new.\n\nThe\
    \ pattern is made up of literals and special characters – there are many of these,\
    \ of which a few are covered below.\n\nThe flags are optional and can be set to\
    \ control the matching. There are three:\n\n+   g global match\n i ignore case\n\
    \ m match over multiple lines.\n\nFor example, both set up a variable regtext\
    \ which can be used to look for “abc” in any combination of upper and lower case\
    \ letters.\n\n```\nRegtext = /ab+c/i\nregtext = new RegExp(\"ab+c\",\"i\")\n```\n\
    \nSome characters have special meanings in regular expressions. There are lots\
    \ of these. Here are some of the most useful ones:\n\n+   \\ Indicates that the\
    \ next character is special, e.g. /\\b/ or \"\\b\" matches a word boundary.\n\
    * (dot) matches any single character, e.g. /g.n/ matches \"gin\" and \"gun\".\n\
    * Matches the preceding character 0 or more times, e.g. /Smith\\*/ matches \"\
    Smith\" and \"Smithee\", and /\\b.*/ matches anything beginning with “\\b”.\n\n\
    [abcd] or [a-d] Matches any one of the enclosed characters.\nYou can give the\
    \ characters individually or specify a range by using a hyphen, e.g. [m-o] match\
    \ the “m” in “game” and either of the “n”s in “tennis”."
  merge: -1
  pgno: 173
- img_proc: true
  md: 'Look for a match at the beginning of the line of text, e.g. /^M/ matches the
    first "M" in "My name is Michael" but does not match the "M" in "my name is Michael".


    $ Matches at the end of the line, e.g. /c$/ matches the "c" in "comic", but does
    not match it in "coding".


    (regex) Matches "regex" and stores the matching strings in the predefined array
    [], as $1, $2, etc.


    \d Matches a digit, e.g. /\d/ matches "2" in "This pencil may be a 2B - or not".


    # The RegExp methods


    exec() executes the search and if successful, returns a array and updates the
    regexp object. If the match fails, exec() returns null. It is similar to String.match().


    ```

    regexp.exec([str])

    ```


    test() simply searches for a match and returns true or false. This is virtually
    the same as String.search().


    ```

    regexp.test([str])

    ```'
