  md: '# Window control


    JavaScript. You can open a new window – specifying its size if you like – and
    load in an existing page file, or write new HTML code for the page from within
    JavaScript. When you have more than one open window, you can switch the focus
    from one to another, and run code in one window which reads the data from and
    writes into any other window.


    > > Code with care

    The window control methods are not tolerant of errors! A space in the wrong place
    results, or missing quotes can produce unpredictable results. If a line of code
    doesn''t do what you expect, go over it character by character and compare it
    with the syntax for the method.


    # window.open()


    The open() method lets you specify the size of the window and which frame components
    (scrollbars, title bar, menu bar, etc.) to include. The basic syntax is:


    ```

    varname = window.open("URL","winName","components")

    ```


    Virtually every bit of this method is optional!


    +   * *varname* is needed if you want to run any methods or access any properties
    of the window.

    * *URL* is used to load in an existing page, if required.

    * *winName* is only needed if the window will be used as a TARGET from code in
    another window.

    * The components are toolbar, location, directories, status, menubar, scrollbars,
    resizable – all of which are made to appear by setting them to yes. Any not listed
    are turned off by default. **width** and **height** can also be set, and are measured
    in pixels. All of the settings are done in one string, separated by commas.


    You must put quotes around the URL, winName and one pair around the whole components
    string. If you are not loading a page, type empty double quotes (""). If you do
    not want to'
