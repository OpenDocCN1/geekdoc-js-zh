  md: '# Event handlers


    Web pages are active and interactive. Files and images load in, the visitor moves
    between frames and windows, enters text, makes selections and clicks buttons.
    These events can all be picked up by event handlers and used to start JavaScript
    code.


    There are 13 event handlers:


    +   - onAbort applies only to images, and indicates that the image file has stopped
    loading.

    - onBlur applies to all screen objects – window, frame, checkbox, password, radio,
    reset, submit, text, textarea and fileUpload – and is activated when the object
    goes out of focus.

    - onChange applies to text, textarea, select and fileUpload picking up each keystroke
    or change of status.

    - onClick applies to the form elements button, checkbox, radio, reset and submit,
    and to link and area (linked area on an image map).

    - onError applies to window and image and is activated by an error during downloading.

    - onFocus applies to all screen objects – window, frame, button, password, radio,
    reset, submit, text, textarea and fileUpload – and is activated when it comes
    into focus; for a window this means when it initially means the topmost one, then
    the one that the user moves into with a mouse click or by pressing [Tab].

    - onLoad applies to window and image. For a window, onload is activated when download
    is complete. For an image, onLoad occurs when the SRC property is set in an <IMG>
    tag – this is not the same as downloading. Images can be downloaded and stored
    in memory, then allocated to <IMG> tags later. With animated GIFs, onload occurs
    every time the animation starts. See Chapter 7 for more images.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'onMouseOut applies to link and area (on an image map).


    onMouseOver applies to link and area.


    onReset applies only to form, and is activated by a click on the reset button.


    onSelect applies to text and textarea, and is activated when the user selects
    part or all of the text


    onSubmit applies only to form, and is activated by a click on the submit button.


    onUnload applies only to window, and occurs when the window is closed or the user
    moves to another window.


    # Writing in the Status bar


    The next example shows two of these event handlers at work. It also introduces
    a new object and a new method. Let''s look at those first:


    ```

    self.status = ''Hello and welcome''

    ```


    This line sets the Status bar to read ''Hello and welcome''. self is a window
    object, and refers to the current window. This could have been written as exactly
    the same way as window.status and would have worked in exactly that way. Where
    there are several windows, self simply makes it clearer which one is being used.


    status() is a method which sets the contents of the Status bar. For reasons which
    I have not yet fathomed, if you use this with mouseOver, you must add the statement
    ''return true'' at the end to make it work. When a function or method ends, it
    can pass data to the code which called it through its return value (see page 79).
    We are not using the return value here, and you do not need this if you start
    status() in any other way. So, you need it here:


    ```

    onMouseOver = "self.status = ''Click and visit''; return true"

    ```


    but not here:


    ```

    onMouseOut = "self.status = ''Go back and click me!!!"

    ```


    Notice that mouseOver and onMouseOut are in the same tag. You can have any number
    of event handlers in a tag.'
