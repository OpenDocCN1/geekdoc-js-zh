  md: '# What JavaScript?


    programming language. Its code is written directly into the HTML of Web pages
    and is interpreted and executed in response to some activity on the page – such
    as loading is complete or a button is clicked.


    JavaScript interacts with the browser. It can read information off the Web page,
    for example, data entered into the fields of a form. It is aware of the objects
    on the page and knows when things happen to them – it doesn''t just pick up the
    obvious things like mouse-clicks, but it also notices when a browser window is
    active and when the focus moves to a different window. And it is these events
    that trigger the execution of code – in programming jargon, JavaScript is an object-based,
    event-driven language. It can write onto the current browser window or a newly-opened
    one – it can write standard HTML code, so that you can use JavaScript to generate
    Web pages in response to activites in a Web page.


    is not a particularly complicated language and there are limits to what you can
    do with. At the simplest, a piece of JavaScript code may do more than display
    a message box to acknowledge that a button has been clicked. At the other end
    of the scale you can use JavaScript to write interactive games (though not fast
    shoot-emups) or to check an on-line order, calculate the costs and produce a confirmation
    form. Its limitations arise mainly from the fact that all its inputs and outputs
    must go through the browser and the other store data in files.


    # Client-side and server-side JavaScript


    This book only covers client-side JavaScript – that version of the language which
    is written in Web pages and which runs within the browser when the page is viewed.
    There is also a server-side version of the language – one which runs on the computer
    where the Web page is hosted. That requires the co-operation of your ISP. For
    client-side JavaScript you need nothing but a browser, a word processor and some
    effort and imagination.'
  merge: -1
  pgno: 13
