    We will look at some of the other form element methods in Chapter 6.


    # write() and writeln()


    These two document methods are used for displaying text (and other material) on
    the page. They are both used in exactly the same way and have virtually the same
    effect. writeln() puts a newline character – an [Enter] keypress – after the text,
    but HTML usually ignores it.


    The basic shape of the write() method is:


    ```

    document.write(expression, expression,... )

    ```


    You must specify a document. If you are writing to the current page, then use
    a simple ‘document’. If the output is going to a different page, you must also
    include the name of the frame or window.'
