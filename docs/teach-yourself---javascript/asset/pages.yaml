  md: '# Rules for names


    Names must be single words, must start with a letter and may contain any combination
    of letters, digits and the under_.


    +   - JavaScript is case-sensitive – upper and lower case characters are not the
    same. ''Button1'', ''BUTTON1'' and ''but-ton1'' are three different names.


    You will make life easier for yourself if you keep names simple. Stick to lower-case
    letters, using capitals only where you have compound names, where capitals mark
    the start of each word, e.g. ''surname'', ''address1'', ''totalCost'', ''mailToMe''.


    With short scripts, you can get away with numbered names – ''button1'', ''button2'',
    etc. With longer ones, you should make your names more meaningful – ''startButton'',
    ''stopButton'' and the like.


    ![](img/abd8c35820179838d3f97b872561195a_27_0.png)


    Figure 2.2 Naming objects.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Names and the hierarchy


    An object''s name is created from its place in the hierarchy - the structure of
    the web page. Look at the page in Figure 2.2. It has two frames, and the document
    in the bottom frame has two forms.


    If your code was in a document in window1:


    +   * to refer to the document in the top frame you would use frame1.topDocument.

    * to refer to the realName text box, you need the rather longer frame2.mainDocument.form1.realName.


    Note the full stops used to separate the parts of the name.

    If the code was in a document in another window, you would need to add window1
    to the start of the name, hence:


    +   * window1.frame1.topDocument

    * window1.frame2.mainDocument.form1.realName


    Names can get a bit long-wind, but that''s JavaScript.


    # Assigning names


    We''ve seen how JavaScript refers to objects on Web pages, but how do they get
    their names in the first place? The answer lies in the HTML coding. The tags that
    create these objects all have a NAME option, and it is there that names are assigned.


    Try this example. The HTML here creates a form containing a button and a text
    box. The form is produced and assigned the name ''MyForm'' by this line:


    ```

    <FORM NAME = form1>

    ```


    The text box is created by this line:


    ```

    <INPUT TYPE = text NAME = output>

    ```


    As this is inside form1, which is inside the document, it will be referred to
    by JavaScript as document.form1.output. This is the relevant line, in the <SCRIPT>.
    It writes the text box by setting its value property (see below). The property
    is tacked to the end of the name:


    ```

    document.form1.output.value = "This is JavaScript"

    ```'
