  md: "# Remote control\n\nThe scroll() method will move a document in a window or\
    \ frame, just as if you were using the standard Windows scrollbars. There is little\
    \ advantage in implementing this on a simple page – it is easier to use the scrollbars.\
    \ With a framed system there is an advantage – if you put your scroll controls\
    \ in the navigation frame, along with the links, your visitor can control the\
    \ whole display from one place.\n\nThe method is used in the form:\n\n```\ndocument.scroll(newX,\
    \ newY)\n```\n\nWith the newX and newY values measured in pixels, counting from\
    \ the top left of the page, e.g.\n\n```\ndocument.scroll(0,500)\n```\n\nThis would\
    \ scroll the page up by roughly one screenful on an 800 × 640 display. The following\
    \ example uses a variable, frametop and adjusts this by 200 in the scrollup()\
    \ and scrolldown() functions.\n\nTo implement this example, type in and save the\
    \ two documents, but replacing the links to existing pages of your own. At least\
    \ one of these should be long enough to test out the scrolling routines!\n\ntest.htm\n\
