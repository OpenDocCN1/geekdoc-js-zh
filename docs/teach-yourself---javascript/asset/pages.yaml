  md: '# 2+3*4-(9-3)/2


    This first has its bracketed operation solved to give:


    2+3*4-6/2


    then its multiplication and division:


    2-12-3


    and finally the addition and subtraction to produce 11.


    Where you have a sequence of multiplication and division (or addition and subtraction),
    it does not matter which you do first, e.g.:


    +   * 4*6/3 = 24/3=8

    * or 4*2=8


    > Bitwise operators

    JavaScript also has bitwise operators. These see a number as a set of bits, e.g.
    42 would be seen as 00101010, and can change the values of individual bits within
    a byte. they are mainly used for manipulating memory and input/output streams,
    and we don''t have room for them in this book.


    # Arrays


    Arrays let you store and manipulate information in bulk. Use them wherever you
    have a lot of related data, such as lists of names or URLs, sets of co-ordinates
    and the like.


    The basic concepts of arrays are simple. Instead of having 10, 100, 1000 or more
    variables each with a unique name, you have one name which refers to the whole
    set, with each element identified by its subscript – position in the set. the
    subscript is written in [square brackets] after the array name.


    | Array | Memory |

    |---|---|

    | nickname[0] | Doc |

    | nickname[1] | Sneeezy |

    | nickname[2] | Happy |'
