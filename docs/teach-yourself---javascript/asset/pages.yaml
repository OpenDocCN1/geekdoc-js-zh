  md: '# Functions


    A function is a self-contained block of code, identified by a name. It may carry
    out some kind of calculation and return a value, or it may simply perform a task.


    In most programming languages, functions are used to break a program down into
    manageable chunks – it is hard to read and debug a block of code larger than a
    page. In JavaScript, functions have another purpose. As they can be written into
    the <HEAD> area of a page, you can be sure that they are loaded and ready to run
    before the page begins to load. Where scripts are in the <BODY>, there is a danger
    that the browser will attempt to run them while they are still loading.


    A function is called (activated) by giving its name in another line of code. After
    it has been executed, the program flow returns to the point in the code immediately
    after the call. The process can be taken further, with one function calling another,
    which calls another, and so on. When the program flow reaches the end of its current
    function, it returns to the function from which it was called, and so on back
    up to the main script.


    Let''s look at a simple example. First, let''s take the program as one block of
    code. It works out the cube of a number, using a loop. To see how it works, ''dry
