  md: '# Summary


    +   * Program flow refers to the order in which instructions are carried out.
    It may be a simple sequence or flow through loops or branches.

    * The comparison and logical operators are used to test values.

    * A **for** loop counts its way round a block of code for a number of times, determined
    by the start value, end test and change.

    * **for** loops can be nested inside one another.

    * A **while** loop repeats a block of code until the exit condition is met.

    * Dialog boxes offer a simple but effective way to interact with users.

    * With **if** and **switch** structures, program flow depends upon the value held
    in variables.

    * The conditional operator is a compact alternative to **if...else** for setting
    values.

    * A **label** can be used to create a jump point in a program.

    * You can force an early exit from a loop with **break** or **continue**.'
