  md: '# Dialog boxes


    Before we go any further on ways to control program flow, let''s have a look at
    dialog boxes. They offer a simple way to get values into a program, and that can
    be very useful for testing branching structures.


    JavaScript has three ready-made dialog boxes that you can use to interact with
    your visitors. All three display a (fixed) title and a message, and halt the script
    until the user responds. The message can be text, or any expression that produces
    text.


    +   * alert(message) carries only an OK button. Use it to let your visitors know
    that something has happened or is about to take place.


    ```

