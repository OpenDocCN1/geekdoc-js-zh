  md: '# taking it further


    This book was never intended to be a complete course in JavaScript, but it has,
    I hope, given you a good grounding in the language and the confidence to go on
    further.


    So where do you go from here? There are two main routes of development. The first
    comes from within. Master what you have learnt and bring your creativity to bear.
    Play with the components of JavaScript and see what you can construct with them.
    What do you want to say, and how can you say it with what what you know? The second
    route looks beyond. What other tools, techniques and languages are available to
    the JavaScript programmer? What are other people doing? What can you learn from
    more experienced page builders?


    The Web offers lots of information, samples and services for JavaScript programmers.
    Here are just a few selected sites.


    DevEdge


    ```

    http://devedge.netscape.com/

    ```


    The main Netscape-based site for Web developers, and as Netscape was behind JavaScript,
    it is also the main site for all JavaScript users. At some point, download the
    Core JavaScript Guide – run a search for it or type in this path:


    ```

    ...library/manuals/2000/javascript/1.5/guide

    ```


    You should also get the Core JavaScript Reference from:


    ```

    ...library/manuals/2000/javascript/1.5/reference

    ```'
