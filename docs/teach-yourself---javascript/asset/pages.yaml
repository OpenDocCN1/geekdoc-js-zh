  md: 'You can even use an image instead of text...

    <BUTTON TYPE="submit"> <IMG SRC="sendme.gif" /> </BUTTON>

    ...or well as text:

    <BUTTON TYPE="submit"> <FONT SIZE = 6> Send me please</FONT> <img src="smiley.gif"></BUTTON>


    ![](img/abd8c35820179838d3f97b872561195a_117_0.png)


    # Submit image buttons


    There is a special <INPUT TYPE = ...> option that is worth knowing about.


    <INPUT TYPE = "image" SRC = "sendme.gif">

    This displays the image, but makes it work as a submit button. The advantage of
    this is that it does not have the standard grey, rectangular background, Send
    Me! which you get with <BUTTON>, but it can only be used for submitting forms.


    # The elements array


    The text boxes, options, buttons and other elements that you place on a form are
    automatically made into an array. When each element is a totally separate item,
    and is treated individually, this array is irrelevant, but at other times it can
    be very useful. If you need to access or change the values in a set of items,
    for example, treating them as an array can be the simplest way to do it.


    The array is always called elements[]. The elements are numbered in the order
    in which they appear on the form, starting in the top left with elements[0].


    In this example, an array-based routine is used to clear the entries from some
    of the text boxes on a form. This allows visitors to erase the choices they have
    made, without also clearing their name and e-mail address. Compare this with the
    effect of the Reset button, which would wipe all the boxes clear.'
