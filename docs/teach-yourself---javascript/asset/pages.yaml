    # ## Scrolling text


    If you have spent any time browsing the Web, you must have come across scrolling
    messages in the Status line – many, many times! Here''s how it''s done.


    To get the text to scroll, we use the substring() method to chop off the first
    character and move it to the end of the string. This is best done in four stages.


    First find the length of the string:


    ```

    len = phrase.length

    ```


    Now cut it into two parts: first holds the first character (0); rest takes the
    remainder of the string (1 to len)


    ```

    first = phrase.substring(0,1)

    rest = phrase.substring(1,len)

    ```


    Finally, join the substrings, back to front.


    ```

    phrase = rest + first

    ```'
  merge: -1
  pgno: 141
- img_proc: true
  md: "If you like complicated lines, this will do the same job:\n\n```\nphrase =\
    \ phrase.substring(1,phrase.length) + \nphrase.substring(0,1)\n```\n\nThis code,\
    \ as it stands, will only scroll one character. If you put it into a loop, it\
    \ whistle through so fast that you won't see anything happening. The solution\
    \ is to use a timeout, so that there is a delay between each repetition of the\
    \ code. Here, the delay is set to 100 which produces a pause of 1/10th of a second.\
    \ If your message is shorter, you may find that a longer delay produces a better\
    \ result.\n\nThe stopscroll() function is optional. As the whole point of scrolling\
    \ is to catch the visitors' attention, letting them turn off the scroll is a bit\
    \ counter-productive – except that they may stay longer on the page once the use\
    \ of the variable phrase has been removed!\n\nNotice the use of the variable phrase.\
    \ It is set up and assigned a value in the body SCRIPT, but because a variable\
    \ created here has global scope, it can be read and altered in the function.\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>Scroller</TITLE>\n<SCRIPT>\nfunction setstatus()\n\
    {\nlen = phrase.length\nfirst = phrase.substring(0,1)\nrest = phrase.substring(1,len)\n\
    phrase = rest + first\nself.status = phrase\ntimerID = setTimeout(\"setstatus()\"\
    ,100)\n}\nfunction stopscroll()\n{\nclearTimeout(timerID)\nself.status = 'Teach\
    \ Yourself JavaScript'\n}\n</SCRIPT>\n</HEAD>\n```"
