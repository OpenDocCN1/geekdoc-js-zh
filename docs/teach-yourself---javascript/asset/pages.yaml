- img_proc: true
  md: "# Computer animation\n\nThe basis of computer animation is the timed succession\
    \ of changing images (or text) on screen. For effective animation therefore you\
    \ need to be able to control timing, the images and the screen display.\n\nAnimation\
    \ in JavaScript is limited by the fact that you only have real control over two\
    \ of these – the timing and the images. The screen display is largely set when\
    \ the page is first loaded. You cannot write or draw on the screen in ‘real time’,\
    \ nor can you move objects around it. However, you can change the contents of\
    \ the Status bar, text boxes and text areas, and you can change the SRC of the\
    \ image that is displayed in an <IMG> tag. These give us some possibilities that\
    \ are worth exploiting. But first, you need to know how to control timing.\n\n\
    # Timing and timeouts\n\nIf you want things to happen after a set period, there\
    \ are two ways to achieve it. The first, and apparently simplest, uses a loop\
    \ like this:\n\n```\nfor (delay = 0; delay < 10000; delay++)\n{\n  // do nothing\n\
    }\n```\n\nThat just makes the computer twiddle its bits while time passes. Unfortunately,\
    \ it is virtually useless for animation in JavaScript as JavaScript executes the\
    \ whole of a function before passing control of the system back to update the\
    \ screen.\n\nThe second approach uses timeouts. A timeout allows you to set a\
    \ delay before a command is executed. At the simplest, you just give the setTimeout()\
    \ method the job to do and the number of milliseconds to wait before doing it.\
    \ For example\n\n```\nsetTimeout(\"alert(\\You have been here 5 seconds\")\"),5000)\n\
    ```\n\nFive seconds after the page has loaded, an alert will pop up. Notice those\
    \ quotes around the command – they are crucial. If you miss them out, the command\
    \ will be executed, but the delay will be ignored."
  merge: -1
  pgno: 138
- img_proc: true
  md: "If you want action repeated at regular intervals, the Timeout must be written\
    \ into the action, setting it up for the next time.\n\n```\nfunction irritate()\
    \ {\n  reply = confirm(\"Enjoying your visit?\")\n  if (reply == true)\n    setTimeout(\"\
    irritate()\",5000)\n}\n```\n\nOnce this has been started, by an everate() somewhere\
    \ in the main script, it will run every five seconds until the visitor clicks\
    \ 'Cancel'. This might look like a recursive function (see page 80) but it isn't.\
    \ The last line does not call the function, but sets up a timeout that will run\
    \ again in five seconds.\n\nIf you want to be able to stop the repetition, either\
    \ make the call dependent on a test, as above, or use the clearTimeout method.\
    \ This needs to know which timeout to clear – there can be any number running\
    \ at once – so the setTimeout must be created in a slightly different form, giving\
    \ it a name.\n\n```\ntimer1 = setTimeout(\"irritate()\",10000)\n...\nclearTimeout(timer1)\n\
    ```\n\nThe next example puts a mock visitor counter on the page, updating it constantly\
    \ – set a suitable delay to reflect your page’s popularity!\n\n```\n<HTML>\n<HEAD>\n\
    <TITLE>Timed visits</TITLE>\n<SCRIPT>\nfunction addvisitor() {\n  counter++\n\
