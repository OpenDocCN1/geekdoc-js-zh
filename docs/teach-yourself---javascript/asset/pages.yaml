  md: '# Assignment operators


    These combine an arithmetic operator with assignment (=), producing a shortcut
    for changing the value of a variable. But note that you can only use them where
    the same variable would appear on both sides. They look like this:


    ```

    += -= *= /= %=

    ```


    and are used like this:


    ```

    total += vat

    num *= 2

    ```


    These are the same as:


    ```

    total = total + vat

    num = num * 2

    ```


    The += operator also works with text. For example:


    ```

    username = "Jo"

    username += " Bloggs"

    ```


    username now holds "Jo Bloggs".


    # Increment and decrement


    There are two other arithmetic operators. ++ (increment) and -- (decrement) will
    increase or decrease the value of a variable by 1. They are used like this:


    ```

    num++

    ```


    is quicker to type but has the same effect as:


    ```

    num = num + 1

    ```


    The operators can be used written before (prefix) or after (postfix) the variable
    name. If all you are doing is changing the value of that variable, it doesn''t
    matter which form you use. These are identical:


    ```

    num++

    ++num

    ```'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'If you are assigning the value to another variable or are displaying the value
    at the same time, the position of the operator is crucial.


    ```

    num2 = num1++

    ```


    assigns the initial value of num1 to num2, then increments num1.


    ```

    num2 = ++num1

    ```


    increments num1 before assigning its value to num2.


    You can see this at work in the next example.


    ```

    <HTML>

    <BODY>

    <SCRIPT>

    var count = 0

    document.write(count + "<P>")

    count++

    document.write("Incremented " + count + "<P>")

    document.write("Increment after " + count++ + "<P>")

    document.write("Increment before " + ++count + "<P>")

    </SCRIPT>

    </BODY>

    </HTML>

    ```


    Type it in and view the output. See what happens if you swap over the Increment
    before... and Increment after... lines. Try replacing the initial count++ with
    count.


    # Operator precedence


    The calculations so far have been simple ones, with only one operator. You can
    have Java expressions with several operators and values – just as you can on paper.
    The rules of precedence apply here, much as as in ordinary arithmetic.


    Where there are several operators, multiplication and division are done first,
    then addition and subtraction, and finally the assignment operators (though these
    are normally used only in simple calculations).


    If part of the expression is enclosed in brackets, that part is evaluated before
    the rest, e.g.:'
