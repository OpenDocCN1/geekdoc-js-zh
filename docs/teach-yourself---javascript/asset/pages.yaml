    ![](img/abd8c35820179838d3f97b872561195a_15_0.png)


    **Figure 1.1** The display when the button is clicked.


    Focus on the last phrase in the <INPUT...> tag:

    onClick = "alert(''Ouch!'')")


    This follows the standard shape for in-line JavaScript:

    event = "JavaScript statement(s)"


    The event in this case is **onclick**. This activates the statement:

    alert(''Ouch!'')


    Notice that the script is written in double quotes, and that the text within it
    – ‘Ouch!’ – is written in single quotes.


    There can be any number of statements in the same script. They should be separated
    by semicolons and the whole set must be enclosed in double quotes. This will display
    two alert boxes, one after the other:'
