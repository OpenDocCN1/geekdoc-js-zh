  md: "# Varying loop values\n\nThe number of times that a for loop is repeated determined\
    \ by the start and end values and the rate of change, but these do not have to\
    \ be fixed at design time. If any of these values are held in variables, they\
    \ can be assigned by the program's user or calculated during its run.\n\nIn the\
    \ next example, you decide the values by typing them into a form. The loop will\
    \ then run to your specifications. *Make sure that the loop can end!* If you set\
    \ the change to 0, or the end value to less than the start (unless you want to\
    \ count backwards-), the browser will get stuck in an endless loop. The only way\
    \ out of that will be use [Ctrl]+[Alt]+[Delete] and end the program.\n\nNotice\
    \ how values are extracted from the text boxes:\n\nstart = eval(form1.startval.value)\n\
    \nstartval is the name of the text box on *form1*. Its value - whatever is written\
    \ in the box - is in fact text. To convert this to a number value, we use the\
    \ eval() function. We will have a closer look at this on page 85. For the moment\
    \ it is enough to know that it is necessary.\n\n```\n<HTML>\n<HEAD>\n<TITLE>For\
    \ loops</TITLE>\n<SCRIPT>\nfunction doloop() {\n  start = eval(form1.startval.value)\n\
    \  end = eval(form1.endval.value)\n  change = eval(form1.changeval.value)\n  for\
    \ (num = start; num <= end ; num += change)\n    document.write(num + \" \")\n\
    \  document.write(\"<P>Click the Back button to repeat\")\n}\n</SCRIPT>\n</HEAD>\n\
    <BODY>\n<FORM NAME = form1>\nStart value: <INPUT TYPE = text NAME = startval VALUE\
    \ = 1>\n```"
