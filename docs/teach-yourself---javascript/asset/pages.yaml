  md: "# do...while\n\nThis variation on the while loop performs its test after the\
    \ enclosed statements. The basic shape is:\n\n```\ndo\n{\n  statement(s)\n} while\
    \ (test)\n```\n\nThe statements will always be executed at least once before the\
    \ test is performed, and will be repeated until the test proves false. A typical\
