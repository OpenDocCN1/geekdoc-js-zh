  md: '# Controlling programs


    Program flow refers to the order in which instructions are carried out. So far,
    most of the example programs have run straight through a sequence, stopped. There
    is a limit to what you can achieve with such simple programs. The use of loops
    and branches makes programs far more powerful.


    +   - Loops repeat a set of instructions a fixed number of times or until a condition
    is met.


    +   - Branches take the flow off down different routes, depending upon the values
    held by variables.


    Before you can do much with either loops or branches, you need to know how to
    test the values in variables.


    # Comparison operators


    These are used to compare the contents of variables with values or the contents
    of other variables. There are six comparison operators:


    | == equal to | != not equal to |

    | < less than | <= less than or equal to |

    | > greater than | >= greater than or equal to |


    Notice that the equality test uses a double equals sign ''=''. The single sign
    ''='' is used for assigning values.


    Tests are enclosed in brackets, and typically look like this:


    ```

    (x < 99)

    (newNum != oldNum)

    ```


    A test produces a Boolean value – true or false. Most of the time you do not need
    to worry about this – just use the test – but sometimes it is useful to store
    the result of the test in a variable, for reference later in the program, e.g.


    ```

    result = (newNum > oldNum)

    // store the test result

    ...

    if (result == true)

    // the same as using "if (newNum > oldNum)"

    ```'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'When testing to see if a Boolean value is true, you can miss out the ''== true''
    part of the test, and it still works.


    ```

    if (result)

    ```


    is the same as


    ```

    if (result == true)

    ```


    Including ''== true'' can make the test a little more readable, but the shortest
    does make for neater expressions where you are testing several values at once
    – see below.


    # Logical operators


    The comparison operators only test variables against one value at a time. Sometimes
    you want to check if a variable falls into a range of values, or is one of several
    possibilities. This is where the logical operators come into play.


    # AND


    The && (AND) operator compares the results from two tests, with the expression
    being true if both tests are true.


    ```

    ( x >= 20) && (x <= 30 )

    ```


    This expression is true for all values of x from 20 to 30.


    # OR


    With an || (OR) operator, the expression is true if either both of the tests are
    true.


    ```

    ( x > 100) || (y > 200 )

    ```


    This expression is true if x is greater than 100 or y is greater than 200, or
    if both are over their limits.


    A logical expression can have more than two tests and can include both && and
    ||.


    In mixed expressions, && is evaluated first, unless you use brackets – as in arithmetic,
    anything in brackets is evaluated first.


    ```

    ( x >= 20) && (x <= 30) || (y > 200))

    ```'
