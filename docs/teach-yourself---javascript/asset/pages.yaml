  md: "# while loops\n\nA for loop is normally repeated for a set number of times.\
    \ A while loop gives you greater flexibility in two ways:\n\n+   - the exit test\
    \ is at the start of the loop – it is performed on entry and before each repetition.\
    \ If the condition is met at the start, the loop's statements are not executed\
    \ at all.\n- the exit test can check the status of *any* variable, not just a\
    \ loop counter.\n\nThe basic **while** loop takes this shape:\n\n```\nwhile (test)\n\
    \  { statement(s) }\n```\n\nBut there is actually more to it that. The variable\
    \ that is being tested must be given a value, somehow, sometime earlier, and it\
    \ must be changed by some activity inside the loop. Here a counter is used to\
    \ determine the number of repetitions.\n\n```\n<HTML>\n<BODY>\n<SCRIPT>\n  count\
    \ = 0\n  while (count < 10)\n  {\n    count++\n    document.write(\"<BR>Count\
    \ = \" + count)\n  }\n</SCRIPT>\n</HTML>\n```\n\nOne of the things to notice here\
    \ is that this displays 1 to 10, even though the text is `count < 10`. That's\
    \ because count is incremented *after* the test and before it is printed. Change\
    \ the order of the increment and print lines to this...\n\n```\nwhile (count <\
    \ 10)\n  {\n    document.write(\"<BR>Count = \" + count)\n    count++\n  }\n```\n\
    \n... and you will get a 0 to 9 display. Watch out for this."
