  - "[PAGE 159]\n\n# The javascript URL\n\nUp to this point, all JavaScript code has\
    \ been run from event handlers or directly from a <SCRIPT>. There is another way.\
    \ I have been ignoring it because it tends to produce untidy – and hard to read\
    \ – code. This approach revolves around the word ‘javascript:' used in a link.\n\
    \n```\n<A HREF = \"javascript:command\">\n```\n\nThe javascript:... fits into\
    \ the place where you would normally see an http://... expression. The command\
    \ doesn't have to be one that opens windows and loads pages, but as visitors expect\
    \ links to do that, it may be as well to use it mainly – or only – for that purpose.\n\
    \nIn the example, the javascript: calls up the function openWin(), passing it\
    \ to the URL of a page.\n\n```\n<A HREF = \"javascript:openWin('www.amazon.com')\"\
    >\n```\n\nThe URL is picked up by the parameter windowfile and passed to the window.open\
    \ method – the only line in this function.\n\n```\nwindow.open(windowfile, \"\"\
    , \"scrollbars=no, width=280, height=370\")\n```\n\nIt would have been possible\
    \ to open directly from the javascript: starter, but would have led to this rather\
    \ lengthy expression:\n\n```\n<A HREF = \"javascript:window.open ('www.amazon.com',\
    \ ', scrollbars=no, width=280,height=370\")\n```\n\nAs the link also needs its\
    \ display text and/or an image, plus the closing </A>, it would give you some\
    \ very nasty code!\n\n```\n<HTML>\n<HEAD>\n<SCRIPT>\nfunction openWin(windowfile)\n\
    {\n  window.open(windowfile, \"\", \"scrollbars=no, width=280, height=370\")\n\
    }\n</SCRIPT>\n</HEAD>\n```"
