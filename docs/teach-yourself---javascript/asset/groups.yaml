  - '[PAGE 154]


    # Exercises


    1 Create a form with two text inputs and a button. Display a random number in
    one input and ask the user to copy it into the other. When the button is clicked,
    the code should check that the number has been copied correctly and show the time
    taken.


    2 Create a set of three or more images, of the same size but varying in colour
    or shape. Place them in a line across or down the screen and store them in an
    array. Rotate the image files through the <IMG> tags to give the impression of
    movement.


    # Summary


    +   * With timeouts you can measure and control when code is executed. If timeouts
    are repeated regularly, you can create animation effects.


    +   * Text can be animated by rearranging the characters within a string.


    +   * Images can be animated by storing the files in arrays, then cycling the
    elements through <IMG> tags.


    +   * You should clear a repeated timeout before restarting it. If you do not,
    a second cycle of repeats will be started, creating faster animation.


    +   * Images are not naturally ‘clickable’, but can be made to respond to the
    mouse by enclosing them in a link or an anchor tag.'
- md: "\n## 08 windows and frames\n\nIn this chapter you will learn\n\n- how to control\
    \ windows\n- about the javascript URL\n- about working in frames\n\n## Window\
    \ control\n\nJavaScript. You can open a new window – specifying its size if you\
    \ like – and load in an existing page file, or write new HTML code for the page\
    \ from within JavaScript. When you have more than one open window, you can switch\
    \ the focus from one to another, and run code in one window which reads the data\
    \ from and writes into any other window.\n\n> Code with care\n> The window control\
    \ methods are not tolerant of errors! A space in the wrong place results, or missing\
    \ quotes can produce unpredictable results. If a line of code doesn't do what\
    \ you expect, go over it character by character and compare it with the syntax\
    \ for the method.\n\n## window.open()\n\nThe open() method lets you specify the\
    \ size of the window and which frame components (scrollbars, title bar, menu bar,\
    \ etc.) to include. The basic syntax is:\n\n```\nvarname = window.open(\"URL\"\
    ,\"winName\",\"components\")\n```\n\nVirtually every bit of this method is optional!\n\
    \n- *varname* is needed if you want to run any methods or access any properties\
    \ of the window.\n- *URL* is used to load in an existing page, if required.\n\
    - *winName* is only needed if the window will be used as a TARGET from code in\
    \ another window.\n- The components are toolbar, location, directories, status,\
    \ menubar, scrollbars, resizable – all of which are made to appear by setting\
    \ them to yes. Any not listed are turned off by default. **width** and **height**\
    \ can also be set, and are measured in pixels. All of the settings are done in\
    \ one string, separated by commas.\n\nYou must put quotes around the URL, winName\
    \ and one pair around the whole components string. If you are not loading a page,\
    \ type empty double quotes (\"\"). If you do not want to give the window name,\
    \ but do want to specify components, you must likewise type empty quotes where\
    \ the name would have gone.\n\nSome examples of its use:\n\n```\nwindow.open(\"\
    http://www.yahoo.com\")\n```\n\nSimply opens a standard browser window and loads\
    \ in the page.\n\n```\nwin2 = window.open(\"\", \"NewWin\", \"width=300, height=400\"\
    )\n```\n\nOpens an empty window, giving it a target name of NewWin, and a variable\
    \ name of win2. The window will have no toolbar, status bar or other components,\
    \ and will be 300 by 400 pixels.\n\n```\nwin2 = window.open(\"mini.htm\", \"\"\
    , \"toolbar=yes, width=300, height=500\")\n```\n\nOpens a window, with a toolbar\
    \ only, 300 by 500 pixels, and displays the mini.htm page.\n\n## Filling the window\n\
    \nWhen opened, the window can display an existing page file, or you can use the\
    \ write() method to define the contents at the time, varying them in response\
    \ to some previous feedback from the visitor. It is possible – though hard work\
    \ – to construct large and complex pages, entirely through write().\n\nIn this\
    \ first example, a window is opened, not to display a page, but as a ‘pop-up’\
    \ which tells the visitor more about a link on the page. As you can see here,\
    \ pointing at a link and pointing at Close opens the window – in the pop-up window,\
    \ closes.\n\nThe opening code is all in the function popup(), which is called\
    \ by the onMouseOver event of the links. This is the basic shape:\n\n```\n<A HREF\
    \ = \"http://www...page ref...\" onMouseOver = \"popup(text to display)\">Link\
    \ text...</</A>\n```\n\nWhen the mouse passes over the link, the event handler\
    \ calls popup(), passing it a string of text.\n\npopup() opens a small window\
    \ then uses write() to create the display. There are two lines. The first writes\
    \ the text, embedded in <H4> tags.\n\n```\nwin2.document.write(\"<H4>\" + words\
    \ + \"</H4>\")\n```\n\nThe second creates an anchor with the onMouseOver code.\n\
    \n```\nwin2.document.write(\"<A onMouseOver = 'self.close()'></A>\")\n```\n\n\
    Notice that close() shuts a window - self.close() shuts the window that holds\
    \ the expression.\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Popups!</TITLE>\n<SCRIPT>\n\
    function popup(words) {\n  win2 = window.open(\"\", \"\", \"width=250,height=100\"\
    )\n  win2.document.write(\"<H4>\" + words + \"</H4>\")\n  win2.document.write(\"\
    <A onMouseOver = 'self.close()'> Close</A>\")\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n\
    <H3>Useful Links</H3>\n<A HREF=\"http://homepages.tcp.co.uk/~macbridge\" onMouseOver=\"\
    popup('Come up and see me sometime')\">Mac's place</A>\n<P>\n<A HREF=\"http://www.teachyourself.co.uk\"\
    \ onMouseOver=\"popup('Be where you want to be with Teach Yourself')\">Teach Yourself</A>\n\
    <P>\n<A HREF=\"http://www.amazon.com\" onMouseOver=\"popup('The leading on-line\
    \ store')\">Amazon</A>\n</BODY>\n</HTML>\n```\n\n## The javascript URL\n\nUp to\
    \ this point, all JavaScript code has been run from event handlers or directly\
    \ from a <SCRIPT>. There is another way. I have been ignoring it because it tends\
    \ to produce untidy – and hard to read – code. This approach revolves around the\
    \ word ‘javascript:' used in a link.\n\n```\n<A HREF = \"javascript:command\"\
    >\n```\n\nThe javascript:... fits into the place where you would normally see\
    \ an http://... expression. The command doesn't have to be one that opens windows\
    \ and loads pages, but as visitors expect links to do that, it may be as well\
    \ to use it mainly – or only – for that purpose.\n\nIn the example, the javascript:\
    \ calls up the function openWin(), passing it to the URL of a page.\n\n```\n<A\
    \ HREF = \"javascript:openWin('www.amazon.com')\">\n```\n\nThe URL is picked up\
    \ by the parameter windowfile and passed to the window.open method – the only\
    \ line in this function.\n\n```\nwindow.open(windowfile, \"\", \"scrollbars=no,\
    \ width=280, height=370\")\n```\n\nIt would have been possible to open directly\
    \ from the javascript: starter, but would have led to this rather lengthy expression:\n\
    \n```\n<A HREF = \"javascript:window.open ('www.amazon.com', ', scrollbars=no,\
    \ width=280,height=370\")\n```\n\nAs the link also needs its display text and/or\
    \ an image, plus the closing </A>, it would give you some very nasty code!\n\n\
    ```html\n<HTML>\n<HEAD>\n<SCRIPT>\nfunction openWin(windowfile)\n{\n  window.open(windowfile,\
    \ \"\", \"scrollbars=no, width=280, height=370\")\n}\n</SCRIPT>\n</HEAD>\n```\n\
    \n```html\n<BODY><H3>Useful Links</H3><A HREF = \"javascript:openWin('hompages.tcp.co.uk/~macbridge')\"\
    > Mac's place</A><P><A HREF = \"javascript:openWin('www.teachyourself.co.uk')\"\
    > Teach Yourself</A></P><P><A HREF = \"javascript:openWin('www.amazon.com')\"\
    > Amazon</A></BODY></HTML>\n```\n\n## Working in frames\n\nFor the most part,\
    \ in framed pages is exactly the same as unframed ones, but there are a few nice\
    \ touches you can add to a framed system. Here are a couple.\n\n## Following the\
    \ focus\n\nThe onSuccess and onBlur events occur when visitor enters and leaves\
    \ a page. With simple pages, these are of little use. With a framed system, where\
    \ your visitor can move between pages, it is worth reacting to these events.\n\
    \nThe next example uses a two-frame layout, with a navigation bar down the left,\
    \ and the main display to the right. Code in the navigation bar toggles the colours\
    \ of the two areas so that the one in focus is white and the other is blue.\n\n\
    ```\nonBlur=\"document.backgroundColor= 'blue';\nparent.display.backgroundColor\
    \ = 'white'\"\n\nonFocus=\"document.backgroundColor= 'white';\nparent.display.backgroundColor\
    \ = 'blue'\"\n```\n\nparent refers to the enclosing <FRAMSET> document, where\
    \ display is defined as the second frame. Because there are only two frames here,\
    \ it is sufficient to have the colour-setting code in just frame — if this one\
    \ isn't in focus, the other must be.\n\n## Remote control\n\nThe scroll() method\
    \ will move a document in a window or frame, just as you were using the standard\
    \ scrollbars. There is little advantage in implementing this on a simple page\
    \ – it is easier to use the scrollbars. With a framed system there is an advantage\
    \ – if you put your scroll controls in the navigation frame, along with the links,\
    \ your visitor can control the whole display from one place.\n\nThe method is\
    \ used in the form:\n\n```\ndocument.scroll(newX, newY)\n```\n\nWith the newX\
    \ and newY values measured in pixels, counting from the top left of the page,\
    \ e.g.\n\n```\ndocument.scroll(0,500)\n```\n\nThis would scroll the page up by\
    \ roughly one screenful on an 800 × 640 display. The following example uses a\
    \ variable, frametop and adjusts this by 200 in the scrollup() and scrolldown()\
    \ functions.\n\nTo implement this example, type in and save the two documents,\
    \ but replacing the links to existing pages of your own. At least one of these\
