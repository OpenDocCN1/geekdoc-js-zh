    \n**Figure 4.6** A typical output – the computer never takes more than seven goes.\
    \ Why not?\n\n# if ... else\n\nThis variation on the if structure uses the else\
    \ keyword, which handles the actions to perform if the test does not prove true.\
    \ The syntax is:\n\n```javascript\nif (test)\n    { statement(s) if true }\nelse\n\
    \    { statement(s) if false }\n```\n\nFor example:\n\n```javascript\nif (total\
    \ > 100)\n    carriage = 2.00\nelse\n    carriage = 5.00\n```\n\nThe carriage\
    \ charge is £2.00 if you spend over £100, otherwise it is £5.00.\n\nThe basic\
    \ if structure has the beauty of simplicity – it shows clearly the relationship\
    \ between the test and the outcome. But it is not always the best solution. You\
    \ want to analyse a character to see if it is an upper or lower letter, digit\
    \ or a symbol. Here’s the first draft of a program to do the job.\n\n```html\n\
    <HTML>\n<HEAD>\n<TITLE>Character tester</TITLE>\n</HEAD>\n<BODY>\n<SCRIPT>\nletter\
    \ = prompt(\"Enter a character,\", \"\")\nwhile (letter != \"q\")\n{\n    if (letter\
    \ < \" \")\n        alert(\"Non-printing character entered\")\n    if (letter\
    \ >= \"a\" && letter <= \"z\")\n        alert(\"Lower case letter entered\")\n\
    \    if (letter >= \"A\" && letter <= \"Z\")\n        alert(\"Upper case letter\
    \ entered\")\n    if (letter >= \"0\" && letter <= \"9\")\n        alert(\"Digit\
    \ entered\")\n    letter = prompt(\"Enter a character - q to quit,\", \"\")\n\
    }\n</SCRIPT>\n</HTML>\n```\n\nSo far, so good. The first test spots the non-printing\
    \ characters (tab, carriage return, movement, etc. which are clustered at the\
    \ start of the character set, ending at space). The next three tests handle the\
