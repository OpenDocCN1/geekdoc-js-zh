  mdcn: "\n\n## 08 窗口与框架\n\n在本章中，你将学习：\n\n- 如何控制窗口\n- 关于 javascript URL\n- 关于在框架（frames）中工作\n\
    \n## 窗口控制\n\nJavaScript。你可以打开一个新窗口——如果愿意可以指定其大小——并加载现有的页面文件，或者从 JavaScript 内部为页面编写新的\
    \ HTML 代码。当你打开了多个窗口时，你可以在窗口之间切换焦点，并在其中一个窗口中运行代码，从任何其他窗口读取数据并将其写入该窗口。\n\n> 小心编写代码\n\
    > 窗口控制方法是不容错的！错误位置的空格会导致问题，或者缺少引号可能会产生不可预知的结果。如果某行代码没有按照你的预期执行，请逐字符地检查它，并将其与该方法的语法进行对比。\n\
    \n## window.open()\n\nopen() 方法允许你指定窗口的大小以及要包含哪些框架组件（滚动条、标题栏、菜单栏等）。基本语法为：\n\n\
    ```\nvarname = window.open(\"URL\",\"winName\",\"components\")\n```\n\n该方法的几乎每一个部分都是可选的！\n\
    \n- 如果你想运行窗口的任何方法或访问其任何属性，则需要 *varname*。\n- *URL* 用于在需要时加载现有页面。\n- 只有当窗口将作为另一个窗口中代码的\
    \ TARGET（目标）时，才需要 *winName*。\n- 组件包括 toolbar（工具栏）、location（位置）、directories（目录）、status（状态）、menubar（菜单栏）、scrollbars（滚动条）、resizable（可调整大小）——所有通过设置为\
    \ yes 来显示。任何未列出的默认都关闭。还可以设置 **width** 和 **height**，以像素为单位。所有设置都在一个字符串中完成，用逗号分隔。\n\
    \n你必须为 URL、winName 加上引号，并对整个 components 字符串加上一对引号。如果不加载页面，请输入空双引号（\"\"）。如果你不想给窗口命名，但想指定组件，你同样需要在名称所在的位置输入空引号。\n\
    \n一些该方法的用例示例：\n\n```\nwindow.open(\"http://www.yahoo.com\")\n```\n\n简单打开一个标准的浏览器窗口并加载页面。\n\
    \n```\nwin2 = window.open(\"\", \"NewWin\", \"width=300, height=400\")\n```\n\n\
    打开一个空窗口，给它一个目标名称 NewWin 和一个变量名 win2。该窗口将没有工具栏、状态栏或其他组件，大小为 300 x 400 像素。\n\n```\n\
    win2 = window.open(\"mini.htm\", \"\", \"toolbar=yes, width=300, height=500\"\
    )\n```\n\n打开一个仅带工具栏的窗口，大小为 300 x 500 像素，并显示 mini.htm 页面。\n\n## 填充窗口\n\n窗口打开后，可以显示现有页面文件，或者你可以使用\
    \ write() 方法在此时定义内容，并根据访问者的之前的反馈来更改它们。虽然很困难，但完全通过 write() 构建大型且复杂的页面是可能的。\n\n\
    在第一个示例中，打开一个窗口不是为了显示页面，而是作为一个“弹出窗口”，告诉访问者更多关于页面上链接的信息。正如你在这里看到的，指向一个链接并指向 Close\
    \ 会打开窗口——在弹出窗口中，点击 Close 会关闭窗口。\n\n打开的代码都在 popup() 函数中，该函数由链接的 onMouseOver 事件调用。基本结构如下：\n\
    \n```\n<A HREF = \"http://www...page ref...\" onMouseOver = \"popup(text to display)\"\
    >Link text...</</A>\n```\n\n当鼠标悬过链接时，事件处理器调用 popup() 并向其传递一个文本字符串。\n\npopup()\
    \ 打开一个小窗口，然后使用 write() 创建显示。有两代码。第一行写入嵌入 <H4> 标签中的文本。\n\n```\nwin2.document.write(\"\
    <H4>\" + words + \"</H4>\")\n```\n\n第二行创建一个带有 onMouseOver 代码的锚点。\n\n```\nwin2.document.write(\"\
    <A onMouseOver = 'self.close()'></A>\")\n```\n\n注意，close() 关闭一个窗口——self.close()\
    \ 关闭的是包含该表达式的窗口。\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Popups!</TITLE>\n<SCRIPT>\n\
    function popup(words) {\n  win2 = window.open(\"\", \"\", \"width=250,height=100\"\
    )\n  win2.document.write(\"<H4>\" + words + \"</H4>\")\n  win2.document.write(\"\
    <A onMouseOver = 'self.close()'> Close</A>\")\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n\
    <H3>Useful Links</H3>\n<A HREF=\"http://homepages.tcp.co.uk/~macbridge\" onMouseOver=\"\
    popup('Come up and see me sometime')\">Mac's place</A>\n<P>\n<A HREF=\"http://www.teachyourself.co.uk\"\
    \ onMouseOver=\"popup('Be where you want to be with Teach Yourself')\">Teach Yourself</A>\n\
    <P>\n<A HREF=\"http://www.amazon.com\" onMouseOver=\"popup('The leading on-line\
    \ store')\">Amazon</A>\n</BODY>\n</HTML>\n```\n\n## The javascript URL\n\n到为止，所有的\
    \ JavaScript 代码都是从事件处理器或直接从 <SCRIPT> 运行的。还有另一种方法。我一直忽略它，因为它往往会产生不整洁且难以阅读的代码。这种方法围绕链接中使用的“javascript:”单词。\n\
    \n```\n<A HREF = \"javascript:command\">\n```\n\njavascript:... 填充在通常看到 http://...\
    \ 表达式的地方。该命令不需要是打开窗口并加载页面的，但由于访问者期望链接具有此功能，因此可能主要——或仅——为此目的使用。\n\n在示例中，javascript:\
    \ 调用了函数 openWin()，并将其传递给页面的 URL。\n\n```\n<A HREF = \"javascript:openWin('www.amazon.com')\"\
    >\n```\n\nURL 被参数 windowfile 选取并传递给 window.open 方法——这是该函数中的唯一行。\n\n```\nwindow.open(windowfile,\
    \ \"\", \"scrollbars=no, width=280, height=370\")\n```\n\n可以直接从 javascript: 启动器打开，但会导致这个相当冗长的表达式：\n\
    \n```\n<A HREF = \"javascript:window.open ('www.amazon.com', ', scrollbars=no,\
    \ width=280,height=370\")\n```\n（注：此处原文似乎存在引号缺失错误，翻译已保留原意）\n\n## 在框架中工作\n\n大多数情况下，在框架中工作与无框架完全相同，但你可以为框架系统添加一些精彩的技巧。\n\
    \n## 焦点\n\nonSuccess 和 onBlur 事件发生在进入或离开页面时。对于简单页面，这些事件用处不大。在框架系统中，如果访问者可以在页面间移动，这些事件是值得的。\n\
    \n下一个示例使用双框架布局，左侧是导航栏，右侧是主显示。导航栏的代码切换两个区域的颜色，使得获得焦点的区域是白色，另一个是蓝色。\n\n```\nonBlur=\"\
    document.backgroundColor= 'blue';\nparent.display.backgroundColor = 'white'\"\n\
    \nonFocus=\"document.backgroundColor= 'white';\nparent.display.backgroundColor\
    \ = 'blue'\"\n```\n\nparent 指向包含 display 的文档，其中 display 定义为第二个框架。\n\n## 远程控制\n\
    \nscroll() 方法移动窗口或框架中的文档，就像你使用标准滚动条一样。在简单页面上实现这一点没有优势——使用滚动条更简单。在框架系统中有一个优势——如果你将滚动控件放在导航框架中并结合链接，访问者就可以在一个地方控制整个显示。\n\
    \n该方法使用的形式为：\n\n```\ndocument.scroll(newX, newY)\n```\n\nnewX 和 newY 的值以像素为单位，从页面左上角开始，例如：\n\
    \n```\ndocument.scroll(0,500)\n```\n\n这在 800 x 640 的显示器上会将页面向上滚动大约一屏幕。以下示例使用了一个变量\
    \ frametop，并在 scrollup() 和 scrolldown() 函数中调整 200。\n\n要实现此示例，请输入并保存两个文档，但将链接替换为你自己的现有页面。至少一个页面应该足够长以测试滚动程序！\n\
    \ntest.htm\n\n```html\n<HTML>\n<FRAMES COLS = 30%,*>\n<FRAME SRC = navigate.htm\
    \ NAME = navbar>\n<FRAME SRC = contents.htm NAME = display>\n</FRAMES>\n\n</HTML>\n\
    ```\n\nnavigate.htm\n\n```html\n<HTML>\n<HEAD>\n<SCRIPT>\nframetop = 0\nfunction\
    \ scrollup() {\n  frametop = (frametop >= 200) ? frametop - 200 : 0\n  parent.display.scroll(0,frametop)\n\
    }\n</SCRIPT>\n```\n\n"
