    \ should be `*20`.\nAnd `nelelse` is `else`.\nAnd `n n =` is `n =`.\n\nI will\
    \ output the final cleaned text now.<channel|>[content]\n## 68 program flow\n\
    04\n\n![](img/abd8c35820179838d3f97b872561195a_79_0.png)\n\n**Figure 4.7** The\
    \ display is not very tidy, and sometimes the discount value can run to 15 decimal\
    \ places (try 267.67, for example). We'll think about making things look nice\
    \ later.\n\n## label\n\nA label does not actually do anything. Its purpose is\
    \ to identify a place in the code so that program flow is redirected to it by\
    \ a *switch*, *break* or *continue* statement. The basic shape is:\n\n```\nlabel\
    \ : statement(s)\n```\n\nlabel can be any word, following the same rules as for\
    \ variable names, except for the JavaScript reserved words (see page 155). Note\
    \ that they must be followed by a colon:\n\n```\nrestart:\ndocument.write(\"Picking\
    \ up again\")\n```\n\n## break\n\nWe saw *break* used with *switch* (page 65).\
    \ It also provides a way of escaping from *for* or *while* loops. It is essential\
    \ if there is a possibility that the exit condition will *never* be met, but it\
    \ can also be useful where you just need an alternative exit.\n\nIn the example,\
    \ the loop allows users three chances to work out the answer to a sum.\n\nIf they\
    \ give the correct answer, the break forces an early exit from the loop. By checking\
    \ the loop variable, count, after the end of the loop, the program can tell whether\
    \ the user failed (count == 3) or got it right (early exit).\n\nThe values for\
    \ num1 and num2 are random numbers generated by the Math methods, round() and\
    \ random(). In this case, the values will be in the range 1 to 20.\n\n```\n<HTML>\n\
    <HEAD>\n<TITLE>Breaking out of loops</TITLE>\n</HEAD>\n<BODY>\n<SCRIPT>\nnum1\
    \ = Math.round(Math.random()*20)\nnum2 = Math.round(Math.random()*20)\nfor(count\
    \ = 0; count < 3; count++) {\n  answer = prompt(\"What is \" + num1 + \" times\
    \ \" + num2 + \" \")\n  if (answer == num1 * num2)\n    break\n}\nif (count ==\
    \ 3)\nalert(\"The answer was \" + (num1 * num2))\nelse\nalert(\"Well done\")\n\
    </SCRIPT>\n</HTML>\n```\n\n## break to a label\n\nIf you have nested loops, they\
    \ can be labelled, and the labels used to control the breaks. In the example below,\
    \ there are two loops outer and inner and controlled by variables n and m. The\
    \ loops are both set up to count from 0 to 4, but are tested inside the inner\
    \ loop. The crucial lines are:\n\n```\nif (m==3) break inner\nif (n == 2) break\
    \ outer\n```\n\nWhen n reaches 3, the program breaks out of the inner loop; when\
    \ n reaches 2, the program breaks out of the outer loop.\n\n```\n<HTML>\n<BODY>\n\
    <SCRIPT>\nout:\nfor(n = 0; n < 5; n++)\ninner:\nfor(m = 0; m < 5; m++)\n{\nif\
    \ (m==3) break inner\nif (n == 2) break outer\ndocument.write(\"n = \" + n + \"\
    \ m = \" + m + \"<BR>\");\n}\n</SCRIPT>\n</HTML>\n```\n\nThe output should be:\n\
    \n```\nn = 0 m = 0\nn = 0 m = 1\nn = 0 m = 2\nn = 1 m = 0\nn = 1 m = 1\nn = 1\
    \ m = 2\n```\n\nWhat happens if you remove the labels from the breaks?\n\n## continue\n\
    \ncontinue is similar to break, but where break takes the flow right out of the\
    \ loop, continue just skips any remaining lines and loops around again. Use it\
    \ where the lines in the lower part of the loop should only be performed if a\
    \ condition is met.\n\nIn this example, the user is asked for two numbers, and\
    \ the program divides the first by the second. As division by 0 cannot be done,\
    \ the code uses continue to restart the loop if a 0 is entered.\n\n```\n<HTML>\n\
    <BODY>\n<SCRIPT>\nalert(\"Welcome to the divider\")\nnum1 = 99\n\nwhile (num1\
    \ != 0)\n{\n    num1 = prompt(\"Enter first number or 0 to exit,\", \")\n    if\
    \ (num1 == 0)\n        break\n    num2 = prompt(\"Enter second number\", \")\n\
    \    if (num2 == 0)\n    {\n        alert(\"Division by 0! Restart sum\")\n  \
    \      continue\n    }\n    ans = num1 / num2\n    alert(num1 + \" divided by\
    \ \" + num2 + \" = \" + ans )\n}\n</SCRIPT>\n</HTML>\n```\n\nWe could have used\
    \ an if ... else structure to control the flow at the end of the loop:\n\n```\n\
    if (num2 != 0)\n{\n    ans = num1 / num2\n    alert(num1 + \" divided by \" +\
    \ num2 + \" = \" + ans)\n}\nelse\n    alert(\"Division by 0! Restart sum\")\n\
    ```\n\ncontinue is neater where there are a lot of lines to jump over.\n\n> Division\
    \ by 0\n> most programming languages, an attempt to divide by 0 will cause the\
    \ program to crash. JavaScript is more forgiving - it gives you 'infinity' as\
    \ the result.\n\n## continue with labels\n\nLabels can be used with continue in\
    \ much the same way as they can with break. Here are the same nested loops, but\
    \ this time the tests check whether the numbers are even or odd (% performs modulus\
    \ division, giving the remainder – if you can divide by 2 with no remainder, the\
    \ number is even):\n\n```\nif (m%2 == 1) continue inner\nif (n%2 == 0) continue\
    \ outer\n```\n\nIf the inner counter, m, is odd, the program will skip over the\
    \ write line and start the next inner loop. If the outer counter, n, is even,\
    \ the program will skip back to the start of the next outer loop. Here's the program.\
    \ Apart from the if... lines it is the same as the break with labels example.\n\
    \n```\n<HTML>\n<BODY>\n<SCRIPT>\nout:\nfor(n = 0; n < 5; n++)\ninner:\nfor(m =\
    \ 0; m < 5; m++)\n{\nif (m%2 == 1) continue inner\nif (n%2 == 0) continue outer\n\
    document.write(\"n = \" + n + \" m = \" + m + \"<BR>\");\n}\n</SCRIPT>\n</HTML>\n\
    ```\n"
