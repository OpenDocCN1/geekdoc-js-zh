    \ \" divided by \" + num2 + \" = \" + ans)\n}\nelse\n    alert(\"Division by 0!\
    \ Restart sum\")\n```\n\ncontinue is neater where there are a lot of lines to\
    \ jump over.\n\n> Division by 0\n most programming languages, an attempt to divide\
    \ by 0 will cause the program to crash. JavaScript is more forgiving - it gives\
    \ you 'infinity' as the result."
  - "[PAGE 83]\n\n# continue with labels\n\nLabels can be used with continue in much\
    \ the same way as they can with break. Here are the same nested loops, but this\
    \ time the tests check whether the numbers are even or odd (% performs modulus\
    \ division, giving the remainder – if you can divide by 2 with no remainder, the\
    \ number is even):\n\n```\nif (m%2 == 1) continue inner\nif (n%2 == 0) continue\
    \ outer\n```\n\nIf the inner counter, m, is odd, the program will skip over the\
    \ write line and start the next inner loop. If the outer counter, n, is even,\
    \ the program will skip back to the start of the next outer loop. Here's the program.\
    \ Apart from the if... lines it is the same as the break with labels example.\n\
    \n```\n<HTML>\n<BODY>\n<SCRIPT>\nouter:\nfor(n = 0; n < 5; n++)\ninner:\nfor(m\
    \ = 0; m < 5; m++)\n{\n  if (m%2 == 1) continue inner\n  if (n%2 == 0) continue\
    \ outer\n  document.write(\"n = \" + n + \" m = \" + m + \"<BR>\")\n}\n</SCRIPT>\n\
    </HTML>\n```\n\nYou should see this output:\n\n| n = 1 m = 0 |\n n = 1 m = 2 |\n\
    \ n = 1 m = 4 |\n n = 3 m = 0 |\n n = 3 m = 2 |\n n = 3 m = 4 |"
  - '[PAGE 84]


    # Error handling


    JavaScript is a tolerant language. Once you have got code working that can go
    wrong. As long as you avoid letting a program slip into an endless loop, the worst
    that happens is that nothing happens!


    If, when you have finished working through this introductory book you want to
    get deeper into JavaScript – and if you want to start using server-side JavaScript,
    look up the try...catch structure in the JavaScript Reference. This can capture
    errors before they crash your program.


    # Exercises


    +   1. Using nested for loops, produce a display like this.


    ![](img/abd8c35820179838d3f97b872561195a_84_0.png)


    +   2. Using a while loop, count from 10 down to 0 on screen, ending with a message
    announcing a successful launch.


    +   3. Rewrite the guessing program on page 60 to make it interactive. Use a prompt
    to collect guesses from the user.


    +   4. A club has four categories and rates of membership: Standard, £50; Junior
    (16 and under), £10; Senior (65 and over), £15; Concession (unemployed), £20.
    Use prompts to collect the necessary data and display the category and rate.'
  - '[PAGE 85]


    # Summary


    +   * Program flow refers to the order in which instructions are carried out.
    It may be a simple sequence or flow through loops or branches.

    * The comparison and logical operators are used to test values.

    * A **for** loop counts its way round a block of code for a number of times, determined
    by the start value, end test and change.

    * **for** loops can be nested inside one another.

    * A **while** loop repeats a block of code until the exit condition is met.

    * Dialog boxes offer a simple but effective way to interact with users.

    * With **if** and **switch** structures, program flow depends upon the value held
    in variables.

    * The conditional operator is a compact alternative to **if...else** for setting
    values.

    * A **label** can be used to create a jump point in a program.

    * You can force an early exit from a loop with **break** or **continue**.'
