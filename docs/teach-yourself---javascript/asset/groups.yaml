    # # Simple animation


    Unlike<IMG>s, image objects are not automatically put into an array, which is
    a bit of shame because you often need them in one. If you want to display a sequence
    of images, the simplest way to do it is to store them in an array, then run the
    array through a loop.


    To set up an array, first load the images into separate objects, then create a
    new array, giving it the names of the objects. In the example, there are six image
    files.


    ```

    pic0 = new Image()

    pic0.src = "pic0.gif"

    pic1 = new Image()

    pic1.src = "pic1.gif"

    ...

    ```


    ```

    pictures = new Array(pic0,pic1,pic2,pic3,pic4, pic5)

    ```


    You have a simple means to assign a new image. Here''s the line at the top of
    the *animate()* function:


    ```

    pagePic.src = pictures[current++].src

    ```


    This assigns the selected image to the pagePic <IMG>. current is then incremented
    ready for next time.'
- md: "\nNotice also the line at the end of the function which sets a timeout so that\
    \ *animate()* is constantly rerun.\n\nsetTimeout(\"animate()\",200)\n\nThe checkload()\
    \ function checks the complete property of the sixth image, and will not allow\
    \ the code to reach the *animate()* function until the files are fully loaded.\
    \ It won't appear to do anything while you are testing the page on your system\
    \ – as the files will be accessible almost instantly – but it will be useful when\
    \ the page is online and people view it over the Web.\n\n```\n<HTML>\n<HEAD>\n\
    <SCRIPT>\nfunction loadImages()\n{\n  pic0 = new Image()\n  pic0.src = \"pic0.gif\"\
    \n  pic1 = new Image()\n  pic1.src = \"pic1.gif\"\n  pic2 = new Image()\n  pic2.src\
    \ = \"pic2.gif\"\n  pic3 = new Image()\n  pic3.src = \"pic3.gif\"\n  pic4 = new\
    \ Image()\n  pic4.src = \"pic4.gif\"\n  pic5 = new Image()\n  pic5.src = \"pic5.gif\"\
    \n  pictures = new Array(pic0,pic1,pic2,pic3,pic4,pic5)\n}\nfunction animate()\n\
    {\n  pagePic.src = pictures[current++].src\n  if (current == 6)\n    current =\
    \ 0\n  setTimeout(\"animate()\",200)\n}\nfunction checkload()\n{\n  if (pic5.complete\
    \ == false)\n    setTimeout(\"checkload()\", 100)\n}\n```\n\n```\n</SCRIPT>\n\
    <HEAD>\n<BODY>\n<IMG SRC \"pic0.gif\" NAME = pagePic>\n<SCRIPT>\n  current = 1\n\
    loadImages()\ncheckload()\nanimate()\n</SCRIPT>\n</BODY>\n</HTML>\n```\n\n**Figure\
    \ 7.3** My perpetual motion and its image files. You can see it in action on the\
    \ JavaScript Sampler page of my site: http://homepages.tcp.co.uk/~macbride\n\n\
    ![](img/abd8c35820179838d3f97b872561195a_148_0.png)\n\n![](img/abd8c35820179838d3f97b872561195a_148_1.png)\n\
    \n![](img/abd8c35820179838d3f97b872561195a_148_2.png)\n\n![](img/abd8c35820179838d3f97b872561195a_148_3.png)\n\
    \n![](img/abd8c35820179838d3f97b872561195a_148_4.png)\n\n![](img/abd8c35820179838d3f97b872561195a_148_5.png)\n\
    \n![](img/abd8c35820179838d3f97b872561195a_148_6.png)\n\n# Controlled animation\n\
    \nThe next example builds on the last by adding a set of control buttons. These\
    \ allow the user to run the 'machine' at full speed or to step through the sequence,\
    \ either forward or in reverse. Though there are five new control buttons, there\
    \ are only two new functions. nextpic() changes the image to the next one or backward,\
    \ depending on the value of move (1 or -1).\n\n```\nfunction nextpic() {\n  current\
    \ += move\n  if (current < 0)\n    current = 5\n  if (current> 5)\n    current\
    \ = 0\n  pagePic.src =pictures[current].src\n}\n```\n\nThe Back and Next buttons\
    \ set the move direction and call nextpic().\n\n<INPUT TYPE = button VALUE = \"\
    \ Back \" onClick=\"move = -1; nextpic()\">\n\nThere is a new version of animate().\
    \ This is only concerned with keeping things moving, as the change of image is\
    \ now handled by nextpic(). Notice the use of the going variable. If this is true,\
    \ there is already a timeout to run animate(), this must be cleared before running\
    \ the function again and setting another timeout. Miss it out and watch what happens\
    \ if you click the Run or Reverse button more than once.\n\n```\nfunction animate()\
    \ {\n  if (going)\n    clearTimeout(timer)\n  nextpic()\n  timer = setTimeout(\"\
    animate()\",100)\n}\n```\n\nTo start it off, we just need to set going to true,\
    \ assign a value to move, and call animate() for the first time.\n\n<INPUT TYPE\
    \ = button VALUE = \" Run \" onClick=\"going = true; move = 1; animate()\">\n\n\
    Here's the full code. It's a bit on the long side, but the last example will serve\
    \ as a base and you can cut and paste when setting up the buttons.\n\n```\n<HTML>\n\
    <HEAD>\n<TITLE>Perpetual motion </TITLE>\n<SCRIPT>\nfunction loadImages() {\n\
    \  pic0 = new Image()\n  pic0.src = \"pic0.gif\"\n  pic1 = new Image()\n  pic1.src\
    \ = \"pic1.gif\"\n  pic2 = new Image()\n  pic2.src = \"pic2.gif\"\n  pic3 = new\
    \ Image()\n  pic3.src = \"pic3.gif\"\n  pic4 = new Image()\n  pic4.src = \"pic4.gif\"\
    \n  pic5 = new Image()\n  pic5.src = \"pic5.gif\"\n  pictures = new Array(pic0,pic1,pic2,pic3,pic4,pic5)\n\
    }\nfunction nextpic() {\n  current += move\n  if (current < 0)\n    current =\
    \ 5\n  if (current> 5)\n    current = 0\n  pagePic.src =pictures[current].src\n\
    }\nfunction animate() {\n  if (going) {\n    clearTimeout(timer)\n    nextpic()\n\
    \  }\n  timer = setTimeout(\"animate()\",100)\n}\n```\n\n```\nfunction checkload()\
    \ {\n  if (pic5.complete == false) {\n    setTimeout(\"checkload()\", 100)\n \
    \ }\n</SCRIPT>\n</HEAD>\n<body><H3>Perpetual motion?</H3>\n<IMG SRC = \"pic0.gif\"\
    \ NAME = pagePic>\n<SCRIPT>\n  current = 0\n  timer = null\n  going = false\n\
    \  move = 1\n  loadImages()\n  checkload()\n</SCRIPT>\n</FORM>\n<INPUT TYPE =\
    \ button VALUE = \" Reverse \" onclick=\"going = true; move = -1; animate()\"\
    >\n```\n\n| Perpetual motion - Microsoft Internet Explorer |\n| File | Edit |\
    \ View | Favorites | Tools | Help |\n|---|---|---|---|---|---|\n| Perpetual motion?\
    \ | | | | | | |\n| Reverse | Back | Stop | Next | Run | |\n| Done | My Computer\
    \ | | | | |\n\n**Figure 7.4** The machine with its added buttons.\n\n```\n<INPUT\
    \ TYPE = button VALUE = \" Back \" \nonclick=\"move = -1; nextpic()\"\n<INPUT\
    \ TYPE = button VALUE = \" Stop \" \nonclick=\"clearInterval(timer)\"\n<INPUT\
    \ TYPE = button VALUE = \" Next \" \nonclick=\"move = 1; nextpic()\"\n<INPUT TYPE\
    \ = button VALUE = \" Run \" \nonclick=\"going = true; move = 1; animate()\"\n\
    </BODY>\n</HTML>\n```\n\n# Clickable images\n\nImages do not naturally react to\
    \ the mouse, but they can be made to do so with very little effort. If you enclose\
    \ an image with a<A> tag, it takes on the properties of a link, which is clickable.\n\
    \nA little care is needed. If the <A> tag is an HREF link and you use the onClick\
    \ event, like this...\n\n```\n<A HREF = www.wherever.com onClick=\"dstuff()\"\
    \ \n<IMG SRC = \"image1.gif\" /> </A>\n```\n\n... you may have a problem. After\
    \ this code has executed the dstuff() function it will link to the wherever site.\n\
    \nIf you simply want to use the image to trigger some activity within the page,\
    \ there are two ways to round this. One is to use the onMouseEnter event:\n\n\
    ```\n<A HREF = www.wherever.com onMouseEnter=\"dstuff()\" \n<IMG SRC = \"image1.gif\"\
    \ />\n```\n\nThe second – better approach is to use the <A> tag in its simplest\
    \ form, as an anchor. This responds to the mouse.\n\n```\n<A onClick=\"dstuff()\"\
    \ <IMG SRC = \"image1.gif\" /> </A>\n```\n\nIn the next example, the anchored\
    \ image picks up three events. onClick produces an alert showing the time; and\
    \ onMouseEnter set messages in Status line.\n\n```\n<HTML>\n<HEAD>\n<TITLE>Clickable\
    \ image </TITLE>\n<SCRIPT>\nfunction showtime() {\n  d = new Date()\n  h = d.getHours()\n\
    \  m = d.getMinutes()\n  s = d.getSeconds()\n  alert(\"The time is now: \" + h\
    \ + ((m<10) ? \"0\" : \":\") + m + ((s<10) ? \"0\" : \":\") + s)\n}\n\nfunction\
    \ setStatus(n) {\n  if (n==1)\n    self.status = \"Click to see the time\"\n \
    \ else\n    self.status = \"Clickable image test page\"\n}\n</SCRIPT>\n</HEAD>\n\
    \n<BODY>\n<A onClick=\"showtime()\" onMouseOver = \"setStatus(1)\" onMouseOut\
    \ = \"setStatus(2)\"><IMG SRC = \"clock.gif\"></A>\n</BODY>\n</HTML>\n```\n\n\
    # JavaScript image maps\n\nIf you have image maps on your pages, remember that\
    \ the <AREA>s are clickable, and that you can attach code to their.\n\n# Exercises\n\
    \n1 Create a form with two text inputs and a button. Display a random number in\
    \ one input and ask the user to copy it into the other. When the button is clicked,\
    \ the code should check that the number has been copied correctly and show the\
    \ time taken.\n\n2 Create a set of three or more images, of same size but varying\
    \ in colour or shape. Place them in a line across or down the screen and Rotate\
    \ the image files through the <IMG tags to give the impression of movement.\n\n\
    # Summary\n\n* With timeouts you can measure and control when code is executed.\
    \ If timeouts are repeated regularly, you can create animation effects.\n\n* Text\
    \ can be animated by rearranging the characters within a string.\n\n* Images can\
    \ be animated by storing the files in arrays, then cycling the elements through\
    \ <IMG tags.\n\n* You should clear a repeated timeout before restarting it. If\
    \ you do not, a second cycle of repeats will be started, creating faster animation.\n\
    \n* Images are not naturally ‘clickable’, but can be made to respond to the mouse\
    \ by enclosing them in a link or an anchor tag.\n"
