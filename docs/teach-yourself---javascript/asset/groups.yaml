    #  Drop-down lists


    Drop-down lists are one of the neatest ways of offering a set of alternatives.
    In HTML they can be implemented with the tags <SELECT ...> and <OPTION = ...>


    <SELECT ...> provides the framework for the list. It takes the keyword NAME to
    define the variable where the selection is recorded. The matching tag </SELECT>
    closes the list.'
  - "[PAGE 115]\n\n<OPTION = ... defines an entry for the list. It must have a word\
    \ in the tag - this will be fed back to you in the SELECT <OPTION = ... tag for\
    \ every item.\n\nThe tags fit together like this:\n\n```\n<SELECT NAME = Level>\n\
    \  <OPTION = stand> Standard\n  <OPTION = prof> Professional\n</SELECT>\n```\n\
    \nThat gives us a drop-down list with two items.\n\n![](img/abd8c35820179838d3f97b872561195a_115_0.png)\n\
    \nIf the visitor selects Standard, the stand option will be passed to Level, and\
    \ the feedback mail will include this phrase:\n\nLevel = stand\n\nAn <OPTION =\
    \ ... tag can include the word SELECTED, to set that as the default.\n\nLook for\
    \ the line:\n\n```\n<OPTION = Win SELECTED> PC/Windows\n```\n\nin this example,\
    \ and notice how the item PC/Windows is displayed at the top of the list, in the\
    \ selection slot – though its natural place is further down.\n\n```\n<HTML>\n\
    <HEAD>\n<TITLE>Drop-down Lists</TITLE>\n</HEAD>\n<body>\n<H2> Order Form </H2>\n\
    <FORM METHOD=Post ACTION=mailto:sales@pcs.co.uk>\nOrder your software here: <P>\n\
    Platform: <SELECT NAME = Platform>\n  <OPTION = Pcdos > PC/Windows\n  <OPTION\
    \ = Mac> Mac\n  <OPTION = Unix> Unix\n  <OPTION = Win SELECTEDED> PC/Windows\n\
