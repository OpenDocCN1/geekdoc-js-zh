    confirm(message) carries an OK and a Cancel button, and returns the Boolean values
    true or false, depending upon which button was clicked (OK returns true). Use
    it where you are offering your visitor a simple Yes/No choice.


    The reply should be assigned to a variable.


    ```

    doit = confirm("Do you really want to unsubscribe?")

    ```


    ![](img/abd8c35820179838d3f97b872561195a_68_0.png)


    +   prompt(message, default) carries a text box and the OK and Cancel buttons.
    It returns whatever text was entered. Use it to get information on pages where
    there is no form. You can set a default value or use "" to clear the box. If you
    do not set a default, the text box displays "undefined".


    To capture the entered text, assign the prompt() to a variable:


    ```

    ccnum = prompt("Enter your Credit Card number", "")

    ```


    ![](img/abd8c35820179838d3f97b872561195a_68_1.png)


    You can now use cnum elsewhere in the code.


    The data from a prompt is always text. If you need it to be a number value, use
    the eval() function like this:


    ```

    num = eval(prompt("How many?", ""))

    ```


    We will return to eval() on page 85.


    Look out for dialog boxes in the later programs in this chapter.'
  - "[PAGE 69]\n\n# while loops\n\nA for loop is normally repeated for a set number\
    \ of times. A while loop gives you greater flexibility in two ways:\n\n+   - the\
    \ exit test is at the start of the loop – it is performed on entry and before\
    \ each repetition. If the condition is met at the start, the loop's statements\
    \ are not executed at all.\n- the exit test can check the status of *any* variable,\
    \ not just a loop counter.\n\nThe basic **while** loop takes this shape:\n\n```\n\
    while (test)\n  { statement(s) }\n```\n\nBut there is actually more to it that.\
    \ The variable that is being tested must be given a value, somehow, sometime earlier,\
    \ and it must be changed by some activity inside the loop. Here a counter is used\
    \ to determine the number of repetitions.\n\n```\n<HTML>\n<BODY>\n<SCRIPT>\n \
    \ count = 0\n  while (count < 10)\n  {\n    count++\n    document.write(\"<BR>Count\
    \ = \" + count)\n  }\n</SCRIPT>\n</HTML>\n```\n\nOne of the things to notice here\
    \ is that this displays 1 to 10, even though the text is `count < 10`. That's\
    \ because count is incremented *after* the test and before it is printed. Change\
    \ the order of the increment and print lines to this...\n\n```\nwhile (count <\
    \ 10)\n  {\n    document.write(\"<BR>Count = \" + count)\n    count++\n  }\n```\n\
    \n... and you will get a 0 to 9 display. Watch out for this."
  - "[PAGE 70]\n\n# do...while\n\nThis variation on the while loop performs its test\
    \ after the enclosed statements. The basic shape is:\n\n```\ndo\n{\n  statement(s)\n\
    } while (test)\n```\n\nThe statements will always be executed at least once before\
    \ the test is performed, and will be repeated until the test proves false. A typical\
    \ use would be where the repetition depends on user input or some other activity\
    \ within the loop.\n\n```\n<HTML>\n<BODY>\n<SCRIPT>\ntotal = 0\ndo\n{\n  num =\
    \ eval(prompt(\"How many?\",\"\"))\n  total += num\n  document.write(\"<BR>Total\
    \ so far = \" + total)\n}\nwhile (total < 100)\n</SCRIPT>\n</HTML>\n```\n\n# Branching\
    \ with if\n\nBranches make programs flexible, allowing them to vary their actions\
    \ in response to incoming data. The simplest form of branch uses the if structure.\
    \ This is the basic syntax:\n\n```\nif (test)\n  { statement(s) if true }\n```\n\
    \nThe test checks the value held by a variable. If the test proves true, the program\
    \ performs the statement(s), otherwise they are ignored. For example:\n\n```\n\
    if (balance < 0)\n  alert(\"You are overdrawn\")\n```"
  - "[PAGE 71]\n\nThe overdraft warning is only issued if the user has a balance below\
    \ 0. Notice that as there was just the one statement, curly brackets were not\
    \ needed.\n\nYou can see the if structure at work in the next example. First the\
    \ script generates a random number, with this line:\n\n```\nx = Math.round(Math.random()*100)\n\
    ```\n\nThis uses two Math methods, round() and random(). They are explained properly\
    \ in Chapter 5, pages 82 and 83 – for the moment, please just accept that the\
    \ line works and that it will produce a whole number in the range 0 to 99.\n\n\
    The code then gets the computer to work out the value of a random number, which\
    \ it does by splitting the difference between the highest and lowest possible\
    \ values. If its 'guess' is too high, or too low, a message is displayed and the\
    \ upper or lower limits.\n\nThe round() method is used again later in the line\
    \ which calculates guess. It rounds the result up to the next whole number.\n\n\
    ```\nguess = Math.round((max + min) / 2\n```\n\nThe program runs through a while\
    \ loop, which tests the guess against the random number. The initial guess is\
    \ 50. How does that relate to the line which calculates the next value of guess?\n\
    \n```\n<HTML>\n<BODY>\n<SCRIPT>\n  x = Math.round(Math.random()*100)\n  max =\
    \ 0\\  min = 0\\  count = 0\n  guess = 50\n  while (guess != x)\n  {\n    document.write(\"\
    <BR>Trying \" + guess)\n    count++\n    if (guess > x)\n    {\n      document.write(\"\
    \ Too high\")\n      max = guess\n    }\n  }\n```"
- md: "\n```javascript\nif (guess < x)\n{\n    document.write(\" Too low\")\n    min\
    \ = guess\n    guess = Math.round((max + min) / 2)\n}\ndocument.write(\"<P>It\
    \ was \" + guess);\ndocument.write(\"<BR> Found it in \" + count + \" goes.\"\
    );\n</SCRIPT>\n</HTML>\n```\n\n![](img/abd8c35820179838d3f97b872561195a_72_0.png)\n\
    \n**Figure 4.6** A typical output – the computer never takes more than seven goes.\
    \ Why not?\n\n# if ... else\n\nThis variation on the if structure uses the else\
    \ keyword, which handles the actions to perform if the test does not prove true.\
    \ The syntax is:\n\n```javascript\nif (test)\n    { statement(s) if true }\nelse\n\
    \    { statement(s) if false }\n```\n\nFor example:\n\n```javascript\nif (total\
    \ > 100)\n    carriage = 2.00\nelse\n    carriage = 5.00\n```\n\nThe carriage\
    \ charge is £2.00 if you spend over £100, otherwise it is £5.00.\n\nThe basic\
    \ if structure has the beauty of simplicity – it shows clearly the relationship\
    \ between the test and the outcome. But it is not always the best solution. You\
    \ want to analyse a character to see if it is an upper or lower letter, digit\
    \ or a symbol. Here’s the first draft of a program to do the job.\n\n```html\n\
    <HTML>\n<HEAD>\n<TITLE>Character tester</TITLE>\n</HEAD>\n<BODY>\n<SCRIPT>\nletter\
    \ = prompt(\"Enter a character,\", \"\")\nwhile (letter != \"q\")\n{\n    if (letter\
    \ < \" \")\n        alert(\"Non-printing character entered\")\n    if (letter\
    \ >= \"a\" && letter <= \"z\")\n        alert(\"Lower case letter entered\")\n\
    \    if (letter >= \"A\" && letter <= \"Z\")\n        alert(\"Upper case letter\
    \ entered\")\n    if (letter >= \"0\" && letter <= \"9\")\n        alert(\"Digit\
    \ entered\")\n    letter = prompt(\"Enter a character - q to quit,\", \"\")\n\
    }\n</SCRIPT>\n</HTML>\n```\n\nSo far, so good. The first test spots the non-printing\
    \ characters (tab, carriage return, movement, etc. which are clustered at the\
    \ start of the character set, ending at space). The next three tests handle the\
    \ sets, ‘a’ to ‘z’, ‘A’ to ‘Z’ and ‘0’ to ‘9’. What about the rest?\n\nLook at\
    \ any character set (use the Character Map in Windows Accessories), and you will\
    \ see that there are punctuation and other symbols scattered between the blocks\
    \ of letters and digits. A test for these would look like this:\n\n```javascript\n\
    if ((letter > \" \") && (letter < \"0\") || (letter >= \"9\") && (letter < \"\
    A\") || (letter > \"Z\") && (letter <= \"a\") || (letter >= \"z\"))\n```\n\nThis\
    \ is not an elegant solution! And it's not just that it doesn't look nice. Complicated\
    \ code is more likely to contain errors. This expression took some time to work\
    \ out and test – and I'm still not 100% sure about it!\n\nHere's a much better\
    \ solution. If ... else structure gives two branches from the same test – one\
    \ to follow if it is true, and one if it is false. This can be extended to handle\
    \ multiple branching.\n\n- if (test1) \n  {statement(s) if test1 is true}\n- else\
    \ if (test2)\n  {statement(s) if test2 is true}\n- else\n  {statement(s) if no\
    \ tests are true}\n\nIf test1 is false, the program tries test2, and failing that,\
    \ tries the next. If all the tests prove false, the program performs the statements\
    \ after the final else. Here's the revised routine.\n\n```html\n<HTML>\n<HEAD>\n\
    <TITLE>Character tester</TITLE>\n</HEAD>\n<body\n<SCRIPT>\nletter = prompt(\"\
    Enter a character,\")\nwhile (letter != \"q\")\n{\n  if (letter < \" \")\n   \
    \ alert(\"Non-printing character entered\")\n  else if (letter >= \"a\" && letter\
    \ <= \"z\")\n    alert(\"Lower case letter entered\")\n  else if (letter >= \"\
    A\" && letter <= \"Z\")\n    alert(\"Upper case letter entered\")\nelse if (letter\
    \ >= \"0\" && letter <= \"9\")\n  alert(\"Digit entered\")\nelse\n  alert(\"Symbol\
    \ entered\")\nletter = prompt(\"Enter a character - q to quit,\")\n}\n</SCRIPT>\n\
    </HTML>\n```\n\nIf a character is not picked up by any of the tests, the else\
    \ statement is performed, and the \"Symbol entered\" message displayed.\n\nThree\
    \ minor points to note here.\n\n- This shows the use of a prompt dialog box to\
    \ get input, and an alert to display messages.\n\n![](img/abd8c35820179838d3f97b872561195a_75_0.png)\n\
    \n- There are lines prompting the user for a character before the while line and\
    \ again at the end of the loop. The while line needs something to test when it\
    \ starts.\n\n- Where you have a series of separate if statements, the program\
    \ will check each one, even after it has had a true result. With a compound ...\
    \ else if ... else structure like this, the program flow will jump to the end\
    \ once it it has found a match. If the testing was being done repeatedly while\
    \ processing a mass of data there could be an appreciable improvement in running\
    \ speed.\n\nThe switch structure can be used to replace a whole set of if statements,\
    \ where these all test the same simple variable for different values. A typical\
    \ use would be with a menu, where the switch directs the flow to the chosen option's\
    \ routine. The basic shape of the switch structure is:\n\n```javascript\nswitch\
    \ (expression)\n{\n  case value:\n    statement(s)\n    break\n  case value: statement(s);\
    \ break\n  ...\n  default : statement(s)\n},\n```\n\n# Alternative layouts\n\n\
    - The switch does a simple match, comparing each of the values with the expression\
    \ – you cannot use the relational operators here.\n- The values must be enclosed\
    \ in quotes and followed by a colon.\n- You need a break at the end of each of\
    \ the case statements to jump out of the switch block.\n- The statements can be\
    \ written on a series of lines or on a single line.\n\nThe switch structure can\
