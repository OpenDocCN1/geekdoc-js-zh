    ```\n\n通过这些设置，表单提交时，输入表单的数据将通过电子邮件发送给你。一些旧浏览器无法处理 `mailto` 选项。如果你想获得所有读者的反馈，你需要使用\
    \ CGI 脚本（你需要与你的 ISP 讨论这件事）。\n\n## 按钮和文本输入\n\n数据主要在 `<INPUT...>` 标签中收集。它们有多种类型，其性质由\
