    the language is quite small – it contains a limited number of objects and methods.
    While this does restrict what your programs can do, it also means that you can
    soon learn it all. Second, JavaScript is embedded in HTML, so that you can start
    by adding small routines to tags to create special effects, and gradually increase
    the size and complexity of your code. Third, JavaScript requires no special software
    – all browsers can handle it, so you need nothing extra to develop or run programs.


    This book is aimed at people who understand HTML, but have little or no programming
    experience. Teach Yourself JavaScript is not intended to give a full, in-depth
    coverage of the language, but to introduce the main concepts and techniques. It
    concentrates on the practical uses of the language and largely ignores the theoretical
    basis and the details of the syntax.


    If you do not know how to use HTML, could I ask you to spend a weekend working
    through my Teach Yourself HTML (or a similar introductory book by another author,
    if you must!) before starting on this book.


    Enjoy your programming!


    Mac Bride

    macbride@tcp.co.uk

    Summer 2003'
