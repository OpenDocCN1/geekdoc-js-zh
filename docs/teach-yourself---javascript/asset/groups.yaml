    # 序言

    JavaScript 是 Web 的核心编程语言之一——是最容易上手的语言。是什么让它如此简单呢？有几点。首先，这种语言非常小——它包含的对象和方法有限。虽然这限制了你的程序的功能，但也意味着你很快就能学会所有。其次，JavaScript
    嵌入在 HTML 中，因此你可以从向标签添加小型程序开始创建特殊效果，并逐渐增加代码的大小和复杂度。第三，JavaScript 不需要特殊的软件——所有的浏览器都可以处理它，因此你不需要额外的工具来开发或运行程序。


    本书适用于理解 HTML 但几乎没有编程经验的人。《自学 JavaScript》并不是为了对语言进行全面深入的介绍，而是介绍主要的概念和技术。它侧重于语言的实际用途，并在很大程度上忽略了理论基础和语法细节。


    如果你不知道如何使用 HTML，能否请你在开始这本书之前，花一个周末学习一下我的《自学 HTML》（如果非如此，也可以读其他作者的类似入门书籍！）？


    祝你编程愉快！


    Mac Bride

    macbride@tcp.co.uk

    2003年夏季


