    marktime()\",1000)\n}\nfunction check() {\n  clearTimeout(timer)\n  if (form1.input.value\
    \ == form1.display.value)\n    alert(\"Correct in \" + counter + \" seconds\"\
    )\n    else alert(\"Mistyped in \" + counter + \" seconds\")\n}\n</SCRIPT>\n<HEAD>\n\
    <BODY NAME = form1>\nType: this box:INPUT TYPE = text NAME = display\n<P>In this\
    \ box:INPUT TYPE = text NAME = input\n<P><INPUT TYPE = button VALUE = Done onClick\
    \ = \"check()\")\n</FORM>\n<SCRIPT>\ncounter = 0\nform1.display.value = Math.round(Math.random()\
    \ * 1000000)\nmarktime()\n</SCRIPT>\n</BODY>\n</html>\n```\n\nHere is one possible\
    \ solution. The central part of this is the animate() function which rotates the\
    \ images through the <img> tags. Notice the line:\nindex = (index < 2) ? ++index\
    \ : 0\n\nThis switches index between 0, 1 and 2 – if index is less than 2, it\
    \ is incremented, otherwise it is set to 0. The line is repeated for every image,\
    \ so that each accesses a different element of the array. index-- at the end ensures\
    \ that index has a different start value the next time round.\n\n```\n<HTML>\n\
    <HEAD>\n<SCRIPT>\n```"
