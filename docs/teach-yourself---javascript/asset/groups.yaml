    Some examples of its use:


    ```

    window.open("http://www.yahoo.com")

    ```


    Simply opens a standard browser window and loads in the page.


    ```

    win2 = window.open("", "NewWin", "width=300,

    height=400")

    ```


    Opens an empty window, giving it a target name of NewWin, and a variable name
    of win2. The window will have no toolbar, status bar or other components, and
    will be 300 by 400 pixels.


    ```

    win2 = window.open("mini.htm", "", "toolbar=yes,

    width=300, height=500")

    ```


    Opens a window, with a toolbar only, 300 by 500 pixels, and displays the mini.htm
    page.


    # Filling the window


    When opened, the window can display an existing page file, or you can use the
    write() method to define the contents at the time, varying them in response to
    some previous feedback from the visitor. It is possible – though hard work – to
    construct large and complex pages, entirely through write().


    In this first example, a window is opened, not to display a page, but as a ‘pop-up’
    which tells the visitor more about a link on the page. As you can see here, pointing
    at a link and pointing at Close opens the window – in the pop-up window, closes.


    The opening code is all in the function popup(), which is called by the onMouseOver
    event of the links. This is the basic shape:


    ```

    <A HREF = "http://www...page ref..."\nonMouseOver = "popup(text to display)">>Link
    text...</</A>

    ```


    When the mouse passes over the link, the event handler calls popup(), passing
    it a string of text.


