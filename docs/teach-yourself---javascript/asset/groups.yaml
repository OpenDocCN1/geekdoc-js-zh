    \ break\n  ...\n  default : statement(s)\n},\n```\n\n# conditional operator\n\n\
    The conditional operator ? : is a shorthand of if else. It can be used for assigning\
    \ alternative values based on a test, not for redirecting flow. It can be convenient,\
    \ though what you gain in compactness you lose in readability.\n\nThe basic shape\
    \ is:\n\n```javascript\nvariable = (test ? value_if_true : value_if_false)\n```\n\
    \nHere's a simple example of its use. This gives 10% discount if the total is\
    \ more than 250:\n\n```javascript\ndiscount = (total > 250 ? 0.10 : 0)\n```\n\n\
    The equivalent if else would be:\n\n```javascript\nif (total > 250)\n    discount\
    \ = 0.1\nelse\n    discount = 0\n```\n\nIt is often used within a larger expression.\
    \ For example, this firm charges £10 for delivery for orders under £100, and £5\
    \ where the total is more. The line to calculate the cost is:\n\n```javascript\n\
    cost = total + (total < 100 ? 5 : 10)\n```\n\nUsing if else, the code would be:\n\
    \n```javascript\nif (total < 100)\n    cost = total + 5\nelse\n    cost = total\n\
    ```\n\nYou can see the conditional operator at work in this example. When you\
    \ run it, enter values below 100, between 100 and 250 and above 250, to check\
    \ that both operators work properly. (Reload the page after each run to restart\
    \ the program.)\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Conditional operator</TITLE>\n\
    </HEAD>\n<BODY>\n<SCRIPT>\ntotal = prompt(\"Enter total spent,\")\ndiscount =\
    \ (total > 250 ? total * 0.1 : 0)\ncarriage = (total > 100 ? 5 : 10)\ndue = total\
