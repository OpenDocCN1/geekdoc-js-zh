    dotime())\n</SCRIPT>\n</BODY>\n</HTML>\n```\n\n## Scrolling text\n\nIf you have\
    \ spent any time browsing the Web, you must have come across scrolling messages\
    \ in the Status line – many, many times! Here's how it's done.\n\nTo get the text\
    \ to scroll, we use the substring() method to chop off the first character and\
    \ move it to the end of the string. This is best done in four stages.\n\nFirst\
    \ find the length of the string:\n\n```javascript\nlen = phrase.length\n```\n\n\
    Now cut it into two parts: first holds the first character (0); rest takes the\
    \ remainder of the string (1 to len)\n\n```javascript\nfirst = phrase.substring(0,1)\n\
    rest = phrase.substring(1,len)\n```\n\nFinally, join the substrings, back to front.\n\
    \n```javascript\nphrase = rest + first\n```\n\nIf you like complicated lines,\
    \ this will do the same job:\n\n```javascript\nphrase = phrase.substring(1,phrase.length)\
    \ + \nphrase.substring(0,1)\n```\n\nThis code, as it stands, will only scroll\
    \ one character. If you put it into a loop, it will whistle through so fast that\
    \ you won't see anything happening. The solution is to use a timeout, so that\
    \ there is a delay between each repetition of the code. Here, the delay is set\
    \ to 100 which produces a pause of 1/10th of a second. If your message is shorter,\
    \ you may find that a longer delay produces a better result.\n\nThe stopscroll()\
    \ function is optional. As the whole point of scrolling is to catch the visitors'\
    \ attention, letting them turn off the scroll is a bit counter-productive – except\
