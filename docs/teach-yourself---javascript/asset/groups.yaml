    As the subscript can be a variable, you have a simple way of accessing any or
    all the elements in the array. We will look at this properly in the next chapter
    when we get on to ways of repeating actions, but here''s a simple example to show
    what is possible. Suppose you had an array of 1000 numbers (num) and a variable
    (count). If you run count through the full range of subscripts, while repeating
    this single line:


    ```

    document.write(num(count));

    ```


    it would display all the numbers had been stored in individual variables, you
    would have needed 1000 writes to display them! You can see this in the next example.
    With only 8 elements, the effect is less dramatic, but the convenience of arrays
    is clearly visible.


    # Initializing arrays


    An array is not a type of variable, as it is in other languages, but an object.
    To create an array, you use a line like this:


    ```

    product = new Array(10)

    ```


    This sets up an array, called product. The new constructor (the method that creates
    objects) allocates memory space for the array''s elements.


    Numbering starts from 0, so the subscripts for the elements in this array will
    run from product[0] to product[9]. Remember –square brackets] around the subscripts,
    and subscripts can be literal values or variables.


    The data stored in any single array must be of the same type, but it can be numbers,
    strings, images, buttons or other-elements on forms.


    Values are assigned to array elements in exactly the same way as they are to ordinary
    variables:


    ```

    product[0] = "Widget, small"

    product[1] = "Widget, medium",

    ```


    And array elements are used in the same way in expressions and methods.


    ```

    document.write("You have chosen " + product[choice])

    ```'
