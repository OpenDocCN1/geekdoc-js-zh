    here is to use the conditional operator ? : that we looked at in Chapter 4. The
    expression:


    (mins<10) ? ":0" : ":"


    will produce ":0" when the minutes are in single digits, and "::" otherwise. We
    can use this instead of a plain ":" when creating'
