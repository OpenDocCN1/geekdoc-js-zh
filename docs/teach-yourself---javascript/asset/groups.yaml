    # Escaping characters


    This is not about jailbreaks! Characters such as " and '' have a special purpose
    in JavaScript. But what if you want to show them on the screen? The answer is
    to write a backslash (also known as *escape*) in front of them. JavaScript then
    treats them as normal printing characters. e.g. this line:


    ```

    document.write("He said, "You\ve got to visit http:\:www.tybooks.com\''")

