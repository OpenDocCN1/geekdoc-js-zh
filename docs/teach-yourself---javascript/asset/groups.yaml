    \nData is collected mainly in <INPUT...> tags. These come in several varieties,\
    \ and their nature is defined by the TYPE=...\n\n<INPUT TYPE = text creates a\
    \ single line slot for text entry. Text INPUTs need a second option NAME=... to\
