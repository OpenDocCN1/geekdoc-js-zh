    # Multiple selections


    If you write the MULTIPLE keyword into a <SELECT> tag, your visitors will be able
    to select more than one option (in the usual way – by holding down [Control] while
    clicking).

    SELECT MULTIPLE NAME = os


    The startIndex of the whole <SELECT> set is then no longer of use. We now need
    to use the selected property (a true or false value) of the individual <OPTION>s.
    These form an array, the name of which comes from the <SELECT> tag, and can be
    conveniently tested in a loop:


    ```

    for(loop = 0; loop document.form1.os.length; loop++)

    if (document.form1.os[loop].selected)

    ```


    +   - document.form1.os.length tells you the number of <OPTION>s in the set.

    - document.form1.os[loop].selected returns the state of the <OPTION> identified
    by the index – it is true if selected.'
