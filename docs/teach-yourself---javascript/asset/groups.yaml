- md: "\nThe next example shows these approaches in use. Notice that the Submit button\
    \ has been replaced by one labelled ‘Action’, which calls the process() function.\
    \ If you want the feedback e-mailed to you, it is simpler to stick to standard\
    \ HTML. Use JavaScript if you want to find out information so that you can respond\
    \ to your visitors while they are on-line. Here, all that happens is alert boxes\
    \ the settings. In practice, you might use the selections to determine which page\
    \ to play next, or what to write on that page.\n\n```html\n<HTML>\n<HEAD>\n<SCRIPT>\n\
    function process()\n{\nif (searcheng == true)\n  alert(\"Search selected\")\n\
    if (software)\n  alert(\"Software sites selected\")\nif (document.form1.resources.checked)\n\
    \  alert(\"JavaScript resources selected\")\nif (document.form1.mlist[0].checked)\n\
    \  alert(\"Include on mailing list\")\nelse\n  alert(\"Leave off the list\")\n\
    }\n</SCRIPT>\n</HEAD>\n<BODY>\n<SCRIPT>\nsearcheng = false\nsoftware = false\n\
    </SCRIPT>\n<FORM NAME = form1>\nWhich types of links would you like\n<P>Style:\n\
    <BR><INPUT TYPE = Checkbox NAME = search onClick = \"searcheng = this.checked\"\
    > Search engines\n<BR><INPUT TYPE = Checkbox NAME = sitesites onClick = \"software\
    \ = ((this.checked)?true:false)\"> Software sites\n<BR><INPUT TYPE = Checkbox\
    \ NAME = resources>\nJavaScript resources\n<P> Join our mailing list?\n<BR><INPUT\
    \ TYPE = Radio NAME = mlist> Yes please\n<BR><INPUT TYPE = Radio NAME = mlist\
    \ CHECKED> No thanks\n<P><INPUT TYPE = Submit VALUE = \"Action\" onclick=\"process()\"\
    \n</FORM>\n</BODY\n</HTML>\n```\n\n![](img/abd8c35820179838d3f97b872561195a_125_0.png)\n\
    \n**Figure 6.4** Using an alert to check the status of variables.\n\n## Single\
    \ selection lists\n\nDrop-down lists created by the <SELECT> and <OPTION> tags\
    \ have two forms. One allows only one selection at a time; the other accepts multiple\
    \ selections. They need to be handled in different ways.\n\nA <SELECT> list has\
    \ a selectedIndex property which is the key to reading the list. If you have set\
    \ up a list in form1 with:\n<SELECT NAME = choice>\nthen this will give you the\
    \ index:\nchosen = document.form1.choice.selectedIndex\n\nYou can then use the\
    \ index value in a set of if tests, to react to the selection, or - as in the\
    \ example use it to pick out an element from an array. Here, the array holds prices\
    \ and the function setPrice() displays the price of the selected item.\n\n```javascript\n\
    function setPrice() {\n  chosen = document.form1.choice.selectedIndex\n  document.form1.price.value\
    \ = prices[chosen]\n}\n```\n\nHere's the code. Feel free to substitute your own\
    \ data!\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Single selections</TITLE>\n<SCRIPT>\n\
    prices = new Array(5)\nprices[0] = 19.99\nprices[1] = 24.99\nprices[2] = 29.99\n\
    prices[3] = 39.49\nprices[4] = 9.95\nfunction setPrice() {\n  chosen = document.form1.choice.selectedIndex\n\
    \  document.form1.price.value = prices[chosen]\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n\
    <H3>Witherspoon clogs</H3>\n<FORM NAME = form1>\nStyle <SELECT NAME = choice>\n\
    <OPTION value = trad>Traditional</OPTION>\n<OPTION value = slipon>Slip on</OPTION>\n\
    <OPTION value = cloth>Fine worsted</OPTION>\n<OPTION value = gold>Gold lame</OPTION>\n\
    <OPTION value = kids>Child</OPTION>\n</SELECT>\n<P><P><P>\nPrice: <INPUT TYPE\
    \ = text NAME = price VALUE = \"\"\n<P>\n<INPUT TYPE button VALUE = \"Show price\"\
    \ onclick = setPrice()>\n</FORM>\n</BODY>\n</HTML>\n```\n\n![](img/abd8c35820179838d3f97b872561195a_127_0.png)\n\
    \n**Figure 6.5** Using an alert to check the status of variables.\n\n## Multiple\
    \ selections\n\nIf you write the MULTIPLE keyword into a <SELECT> tag, your visitors\
    \ will be able to select more than one option (in the usual way – by holding down\
    \ [Control] while clicking).\n<SELECT MULTIPLE NAME = os\n\nThe startIndex of\
    \ the whole <SELECT> set is then no longer of use. We now need to use the selected\
    \ property (a true or false value) of the individual <OPTION>s. These form an\
    \ array, the name of which comes from the <SELECT> tag, and can be conveniently\
    \ tested in a loop:\n\n```javascript\nfor(loop = 0; loop < document.form1.os.length;\
    \ loop++)\n  if (document.form1.os[loop].selected)\n```\n\n- document.form1.os.length\
    \ tells you the number of <OPTION>s in the set.\n- document.form1.os[loop].selected\
    \ returns the state of the <OPTION> identified by the index – it is true if selected.\n\
    \n<OPTION>s have a text property which is the text displayed in the drop-down\
    \ list. You might want to include this in feedback to yourself, or to display\
    \ it on screen that your visitors can confirm their selections.\n\nIn the next\
    \ example, visitors are asked to select the IT courses that interest them. When\
    \ they click the 'Show selection' button, the show() function will check through\
    \ the array and add the text of selected options to the temp string, then copy\
    \ the finished string into the TEXTAREA for display.\n\n```html\n<HTML>\n<HEAD>\n\
    <TITLE>Multiple Selections</TITLE>\n<SCRIPT>\nfunction show() {\n  temp = \"\"\
    \n  for(loop = 0; loop < document.form1.it.length; loop++) {\n    if (document.form1.it[loop].selected)\
    \ {\n      temp = temp + document.form1.it[loop].text + \" \"\n      document.form1.showit.value\
    \ = temp\n    }\n  }\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n<H3>Tel me more about courses\
    \ on ...</H3>\n<FORM NAME = form1>\n<SELECT MULTIPLE NAME = it>\n<OPTION value\
    \ = windows>Windows</OPTION>\n<OPTION value = word>Word</OPTION>\n<OPTION value\
    \ = excel>Excel</OPTION>\n<OPTION value = access>Access</OPTION>\n<OPTION value\
    \ = web>World Wide Web</OPTION>\n<OPTION value = email>E-mail</OPTION>\n</SELECT>\n\
    <INPUT TYPE = button VALUE = \"Show selection\" onclick=\"show()\">\n<P><TEXTAREA\
    \ NAME = showit ROWS = 2 COLS = 40</TEXTAREA>\n</FORM>\n</BODY>\n</HTML>\n```\n\
    \n![](img/abd8c35820179838d3f97b872561195a_129_0.png)\n\n**Figure 6.6** Use the\
    \ MULTIPLE setting when several options can be selected.\n\n## Feedback on-line\n\
    \nThe next example pulls together some aspects of using FORM options in JavaScript,\
    \ gives immediate feedback to the user and also generates e-mail feedback to the\
    \ page's author.\n\nAt Wheeler Dealers you can insure your cycle on-line. The\
    \ cost of the insurance is based on the value of the cycle, but varies with the\
    \ region and with the level of cover. This information is entered into or selected\
    \ from options in the form: region is a drop-down list; cover is a set of Radio\
    \ buttons. Both could have been done either way, as in both cases only one item\
    \ is being selected from a set.\n\nThe basic formula is:\n\n£10 + (value of cycle/100)\
    \ * regional rate * cover level\n\nThe premium is worked out in the function calculate().\
    \ Here are the crucial lines:\n\n```javascript\nhowmuch = eval(document.form1.InsVal.value)\n\
    eval() is necessary to convert the text into a numeric value.\nfor(loop = 0; loop\
    \ < document.form1.cover.length; loop++)\n  if (document.form1.cover[loop].checked)\n\
    ```\n\nRadio button sets do not have a selectedIndex property. To find out which\
    \ one was selected, we have to test the checked property of each button in the\
    \ array.\n\nlevel = loop + 1\n\nThis gives cover levels of 1, 2 or 3 – a crude\
    \ multiplier. If you were doing this properly, you would probably want to select\
    \ the level from an array of values. This has been done with the regional rates.\n\
    \n```javascript\nwhere = document.form1.region.selectedIndex\ncost = eval(10 +\
    \ howmuch / 100 * rate[where] * level)\n```\n\nNote the ‘Purchase’ button. This\
    \ calls up the confirmPurchase() function which runs a confirm dialog before sending\
    \ the e-mail with the command:\n\n```javascript\ndocument.form1.submit()\n```\n\
    \nsubmit() is equivalent to the tag <INPUT = Submit>.\n\n```html\n<HTML>\n<HEAD>\n\
    <TITLE>Feedback</TITLE>\n<SCRIPT>\nrate = new Array(4)\nrate[0] = 10\nrate[1]\
    \ = 8\nrate[2] = 6\nrate[3] = 7\nrate[4] = 12\nfunction calculate() {\nhowmuch\
    \ = eval(document.form1.InsVal.value)\n  for(loop = 0; loop < document.form1.cover.length;\
    \ loop++)\n  if (document.form1.cover[loop].checked)\n    level = loop + 1\n \
    \ where = document.form1.region.selectedIndex\ncost = eval(10 + howmuch / 100\
    \ * rate[where] * level)\n  document.form1.quote.value = cost\n}\n\nfunction confirmPurchase()\
    \ {\n  if (confirm(\"I want to take up this offer\"))\n    document.form1.submit()\n\
    }\n</SCRIPT>\n</HEAD>\n<BODY ALIGN=CENTER><h1>Wheeler Dealers</h1>\n<FORM NAME\
    \ = form1 METHOD = post ACTION = \"mailto:sales@wdeals.co.uk\">\n<P>Value of cycle:</P>\n\
    <INPUT TYPE = text NAME = InsVal SIZE = 10>\n<P>Region\n<SELECT NAME = region>\n\
    <OPTION value = london>London</OPTION>\n<OPTION value = southeast>South East</OPTION>\n\
    <OPTION value = southwest>South West</OPTION>\n<OPTION value = rest>Rest of England</OPTION>\n\
    <OPTION value = wales>Wales</OPTION>\n</SELECT>\n<P>Type of cover\n<BR><INPUT\
    \ TYPE = Radio NAME = cover>Third Party\n<BR><INPUT TYPE = Radio NAME = cover>Third\
    \ Party Fire\n</FORM>\n</BODY>\n```\n"
  mdcn: "\n下一个示例展示了这些方法的用法。注意，“提交”按钮已被替换为标记为“Action”按钮，它调用了 `process()` 函数。如果你希望将反馈通过电子邮件发送给你，坚持使用标准的\
