  - '[PAGE 25]


    # JavaScript objects


    An object is a bundle of routines and values that define its appearance (if it
    is visible) and its interaction with other objects and the rest of the program.


    Most JavaScript objects are visible parts of the HTML system – buttons and text
    areas, forms, frames, windows, the page itself. Some objects are abstract, and
    are are there to provide extra facilities to JavaScript. These include String
    (for holding text), Date (for finding and setting the time and date) and array
    (for managing groups of objects). There is also a Math object, which is essentially
    a collection of trigonometry and other mathematical functions and constants.


    Whatever the type, all JavaScript objects have properties, most also have methods
    and event handlers.


    +   - Properties define the object. Typical properties are width, height, colour
    and status. All can be read and some of them changed by JavaScript code. For example,
    this would turn the page (document) background red:


    `document.bgColor = red`


    +   - Methods are built-in routines which work on that object to which they belong.
    For example, the document object has a write which you use to write on the page:


    `document.write("Hello from me")`


    +   - Event handlers are routines that pick up actions that affect the object.
    Buttons, for instance, have an onClick event handler that knows when the reader
    has clicked it. Much of the JavaScript code that you will write will start from
    one of these event handlers.


    # Object names


    If you need to read or set the properties or value of an element, or move to another
    frame or window, you must be able to identify an object in JavaScript – where
    the object fits into the scheme of things, and its given name, if any.'
