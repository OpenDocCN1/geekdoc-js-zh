    # # Single selection lists


    Drop-down lists created by the <SELECT> and <OPTION> tags have two forms. One
    allows only one selection at a time; the other accepts multiple selections. They
    need to be handled in different ways.


    A <SELECT> list has a selectedIndex property which is the key to reading the list.
    If you have set up a list in form1 with:

    <SELECT NAME = choice>

    then this will give you the index:

    chosen = document.form1.choice.selectedIndex'
