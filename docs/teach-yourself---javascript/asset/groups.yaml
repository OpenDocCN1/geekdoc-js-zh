- md: "\n# Time\n\nIf you want to display the time, the technique is much the same\
    \ as used for the date, though there are a couple of wrinkles that need to be\
    \ iron out.\n\nHere's the basic routine. It uses the getHours(), getMinutes(),\
    \ and getSeconds() methods to extract the hour, minutes and seconds values from\
    \ the date, then combines them into a string with \":\" between the parts.\n\n\
    ```html\n<HTML>\n<HEAD>\n<TITLE>Time - version 1</TITLE>\n</HEAD>\n<BODY>\n<SCRIPT>\n\
    d = new Date()\nhour = d.getHours()\nmins = d.getMinutes()\nsecs = d.getSeconds()\n\
    \ndocument.write(hour + \":\" + mins + \":\" + secs)\n</SCRIPT>\n</BODY>\n</HTML>\n\
    ```\n\n# Improving the display\n\nAt first sight, you may not see any problem\
    \ with the display. Here, for example, is what the routine has just given me:\n\
    \n14:56:12\n\nBut when I reloaded the page a few moments later, I got this:\n\n\
    15:0:4\n\nSingle digit values do not look good! They need a leading '0'. The neatest\
    \ solution here is to use the conditional operator ? : that we looked at in Chapter\
    \ 4. The expression:\n\n(mins<10) ? \":0\" : \":\"\n\nwill produce \":0\" when\
    \ the minutes are in single digits, and \"::\" otherwise. We can use this instead\
    \ of a plain \":\" when creating the output string – though note that the whole\
    \ expression must be enclosed in brackets. Change the output line to read:\n\n\
    ```\ndocument.write(hour + ((mins<10) ? \":0\" : \":\") + mins + (secs<10) ? \"\
    :0\" : \":\") + secs)\n```\n\nIt is not a very readable line, and you must make\
    \ sure that all the opening and closing brackets are in the right places, but\
    \ the resulting display is far better:\n\n15:05:02\n\n# When is now?\n\nThe other\
    \ problem with this time display is that it will only be right when the page is\
    \ first opened. Your clock's not going! If you want to show the right time all\
    \ the time, it must be updated constantly – and for that we need Timeouts. We\
    \ will come back to this in Chapter 7.\n\n# String methods\n\nIn JavaScript, strings\
    \ are objects, not variables as they are in earlier languages. Much of the time\
    \ this doesn't make a lot of difference – you can treat them as if they were variables\
    \ – but the String object has properties and methods which can be applied to any\
    \ strings in your code. You may find some of them useful.\n\nStrictly speaking,\
    \ a string should be created with a line like this:\n\n```\nmyString = new String(\"\
    This is a string\")\n```\n\nIn practice, simply assigning a value will work as\
    \ well:\n\n```\nmyString = \"This is a string\"\n```\n\nAny text entered at a\
    \ prompt, in TextBox or TextArea is also a string. There are two dozen String\
    \ methods. Many of them simply allow you to do the same kind of formatting in\
    \ JavaScript as you in HTML. For example, take the bold() method. This emboldens\
    \ text, exactly the same way as a <B> tag. In this example, the lines in <SCRIPT>\
    \ and in the main body produce the same effect:\n\n```html\n<HTML>\n<BODY>\n<SCRIPT>\n\
    myString = new String(\"This is a string\")\ndocument.write(\"<P>\" + myString.bold())\n\
    document.write(\"<B>\" + myString + \"</B>\")\n</SCRIPT>\n<P><B>This is a string</B>\n\
    </BODY>\n</HTML>\n```\n\nThese are all listed in the String methods on page 160.\
    \ It is useful to know that they exist, as sometimes it may be simpler to use\
    \ a method than tag. For the rest of this chapter, however, I intend to concentrate\
    \ on those methods which allow us to do something with strings.\n\n# String slicing\n\
    \nThere are several methods that allow you to analyse, divide or otherwise manipulate\
    \ a string. charAt(placeNumber) returns the character at placeNumber, and in strings,\
    \ as in arrays, you start counting from 0. Try this – it also shows use of length\
    \ property.\n\n```html\n<HTML>\n<BODY>\n<SCRIPT>\nmyString = new String(\"The\
    \ cat sat on the mat\")\nlen = myString.length\nfor (n = 0; n < len; n++) {\n\
    \  c = myString.charAt(n)\n  document.write(\"Character \" + n + \" is \" + c\
    \ + \"<BR>\")\n}\n</SCRIPT>\n</BODY>\n</HTML>\n```\n\nindexOf(text) gives you\
    \ another way of analysing string. It gives you the first position at which it\
    \ finds text within the string, and text may be a character, word or phrase. If\
    \ text is not present, the method returns -1. For example, for e-mail address:\n\
    \n```html\nmyString = new String(\"The cat sat on the mat\")\nplace = myString.indexOf(\"\
    @\")\nif (place == -1) {\n  document.write(\"Invalid e-mail address\")\n}\n```\n\
    \nlastIndexOf(text) does the same as indexOf(), but starts from the end of the\
    \ string and picks up the last occurrence of text. Here are the two in use:\n\n\
    ```html\n<HTML>\n<BODY>\n<SCRIPT>\nmyString = new String(\"The cat sat on the\
    \ mat\")\nplace = myString.indexOf(\"at\")\ndocument.write(\"cat starts at character\
    \ \" + place)\nlastplace = myString.lastIndexOf(\"at\")\ndocument.write(\"The\
    \ last starts at character \" + lastplace)\n</SCRIPT>\n</BODY>\n</HTML>\n```\n\
    \nsplit(separator) chops a string into an array of smaller strings, splitting\
    \ it where it finds a separator. You could use it for picking individual fields\
    \ out of CSV (comma separated values) data, or for splitting a sentence into words.\
    \ The method is used in lines like this:\n\n```javascript\nmyString = new String(\"\
    The cat sat on the mat\")\nwordArray = myString.split(\" \")\nspaces = 0\nfor\
    \ (n = 0; n < wordArray.length; n++) {\n  if (wordArray[n].charAt(0) == \" \"\
    )\n    spaces += 1\n  document.write(wordArray[n] + \"<BR>\")\n}\n```\n\nsubstring(start,\
    \ end) or substr(start, end) – the two are all but identical – copies from a string\
    \ the set of characters from start to the one before end, counting the first character\
    \ as 0.\n\n```\nmyString = new String(\"The cat sat on the mat\")\nnewString =\
    \ myString.substring(4,10)\n```\n\nThis would make newString hold \"cat sat\"\
    .\n\nslice(start, end) is a variation of substring(). Here the size of the new\
    \ string is determined by end – the position of the last character to be copied.\n\
    \n```\nmyString = new String(\"The cat sat on the mat\")\nnewString = myString.slice(4,10)\n\
    ```\n\nThis makes newString hold \"cat sat on\".\n\n# Joining strings\n\nstr1.concat(str2,\
    \ str3, ...) adds the series of strings – variables or literal text – to the base\
    \ str1 to make a new one.\n\n```\nsurname = \"Bloggs\"\nfirstname = \"Jo\"\ntitle\
    \ = \"Mr\"\nusername = title.concat(\"\", firstName, \" \", surname)\n```\n\n\
    Remember that you can also join strings with the '+' sign. You can ‘add’ text\
    \ and strings to make new strings exactly the same way as you can add them in\
    \ write() expressions. For example, if visitorName held “Jo”, after this line:\n\
    \n```\ngreeting = \"Hello \" + visitorName\n```\n\ngreeting would hold \"Hello\
    \ Jo\".\n\n# Slice and join\n\nHere's a final example of the string slicing methods\
    \ at work. This uses substring() alongside the indexOf methods to slice the title\
    \ and surname out of a full name.\n\n```html\n<HTML>\n<BODY>\n<SCRIPT>\nfullName\
    \ = prompt(\"Please enter title and name, e.g. John Smith\", \"\")\nfirstSpace\
    \ = fullName.indexOf(\" \")\n```\n\n# Case\n\nThere are two methods for changing\
    \ the case of text.\ntoLowerCase() converts any capitals in a string to lower\
    \ case\ntoUpperCase() converts any lower case to upper case.\n\nUse one or other\
    \ when comparing strings if you want the comparison to ignore case. Try this simple\
    \ search routine:\n\n```html\n<HTML>\n<BODY>\n<SCRIPT>\nbaseString = \"Be where\
    \ you want to be with TEACH YOURSELF\"\ndocument.write(baseString + \"<BR>\")\n\
    search = prompt(\"Enter text to find\",\"\")\nlowercase = baseString.toLowerCase()\n\
    lowersearch = search.toLowerCase()\nfoundAt = lowercase.indexOf(lowersearch)\n\
    if (foundAt > -1) {\n  document.write(\"There was a match at character \" + foundAt)\n\
    }\n</SCRIPT>\n</BODY>\n</HTML>\n```\n\n# Search and replace\n\nThere are three\
    \ String methods, match(), search() and replace() that work on text using regular\
    \ expressions. These are composed of literal characters, wildcards and special\
    \ characters that can be used to find inexact matches or to locate text in particular\
    \ places within strings. They could prove useful in server-side JavaScript when\
    \ searching databases held on a server. As (a) I cannot conceive of any realistic\
    \ use for them in client-side JavaScript and (b) they are fiddly and complex,\
    \ I am not covering them here. You will find a brief summary of these methods\
    \ on page 161.\n\n# Exercises\n\nExtend the cube() function on page 79 so that\
    \ it can raise a number to any (integer) power.\n- Write a function dice() which\
    \ generates a random number in the range 1 to 6.\n- A palindrome is a phrase which\
    \ reads the same backwards as it does forwards, e.g. “rats live on no evil star”.\
    \ Write a function that will test a phrase and return true if it is a palindrome.\
    \ e.g. ‘madam, I’m adam’. This allows more phrases to count as palindromes, but\
    \ requires more programming.\n\n# Summary\n\n- A function is a self-contained\
    \ block of code, identified by a name.\n- Data can be passed to functions through\
    \ parameters, and passed back through return values.\n"
  mdcn: "\n\n# 时间\n\n如果你想显示时间，这种技术与显示日期的方法非常相似，尽管有几个细节需要处理。\n\n这里是基本的例程。它使用 `getHours()`、`getMinutes()`\
    \ 和 `getSeconds()` 方法从日期中提取小时、分钟和秒的值，然后用 `:` 将这些部分隔开并组合成一个字符串。\n\n```html\n<HTML>\n\
    <HEAD>\n<TITLE>Time - version 1</TITLE>\n</HEAD>\n<BODY>\n<SCRIPT>\nd = new Date()\n\
    hour = d.getHours()\nmins = d.getMinutes()\nsecs = d.getSeconds()\n\ndocument.write(hour\
    \ + \":\" + mins + \":\" + secs)\n</SCRIPT>\n</BODY>\n</HTML>\n```\n\n# 改进显示\n\
    \n初看之下，你可能觉得显示没有问题。例如，这里是例程刚刚给我的结果：\n\n14:56:12\n\n但当我几分钟后刷新页面时，我得到了这个：\n\n15:0:4\n\
    \n单数字数值看起来并不好！它们需要在前面加一个 '0'。这里最简洁的解决方案是使用我们在第 4 章中看过的条件运算符 `? :`。该表达式：\n\n`(mins<10)\
    \ ? \":0\" : \":\"`\n\n当分钟为单数字时，它会产生 `\":0\"`，否则产生 `\"::\"`。在创建输出字符串时，可以用这个来代替简单的\
    \ ` `:` —— 但注意整个表达式必须包含在括号内。将输出行更改为：\n\n```\ndocument.write(hour + ((mins<10)\
    \ ? \":0\" : \":\") + mins + (secs<10) ? \":0\" : \":\") + secs)\n```\n\n这一行的可读性不高，你必须确保所有的左括号和右括号都在正确的位置，但结果显示要好得多：\n\
    \n15:05:02\n\n# 现在是几？\n\n这种时间显示的另一个问题是，它只会在页面第一次打开时正确。你的时钟不会运行！如果你想一直显示正确的时间，就必须不断更新——为此我们需要超时（`Timeouts`）。我们将在第\
    \ 7 章回到这个问题。\n\n# 字符串方法\n\n在 JavaScript 中，字符串是对象，而不是像早期语言中的变量。很多时候这并没有太大区别——你可以像对待变量一样对待它们——但\
    \ `String` 对象拥有属性和方法，可以应用于你代码中的任何字符串。你可能会发现其中一些非常有用。\n\n严格来说，应该用像这样的行创建字符串：\n\n\
    ```\nmyString = new String(\"This is a string\")\n```\n\n在实践中，简单地赋值同样有效：\n\n```\n\
    myString = \"This is a string\"\n```\n\n在 `prompt`、`TextBox` 或 `TextArea` 中输入的任何文本也是字符串。有二十四种\
    \ `String` 方法。其中许多方法只是允许你在 JavaScript 中进行与在 HTML 中相同的格式化操作。例如，以 `bold()` 方法为止。它将文本加粗，方式与\
    \ `<B>` 标签完全相同。在这个示例中，`<SCRIPT>` 中和正文中的行产生了相同的效果：\n\n```html\n<HTML>\n<BODY>\n\
    <SCRIPT>\nmyString = new String(\"This is a string\")\ndocument.write(\"<P>\"\
    \ + myString.bold())\ndocument.write(\"<B>\" + myString + \"</B>\")\n</SCRIPT>\n\
    <P><B>This is a string</B>\n</BODY>\n</HTML>\n```\n\n这些都列在第 160 页的 `String` 方法中。知道它们的存在是有用的，因为有时使用方法比使用标签更简单。然而，在本章的剩余部分中，我打算专注于那些允许我们对字符串进行某些操作的方法。\n\
    \n# 字符串切片\n\n有几种方法允许你分析、分割或操纵字符串。`charAt(placeNumber)` 返回 `placeNumber` 处的字符，在字符串中，就像数组一样，你从\
    \ 0 开始计数。试一下这个——它也展示了 `length` 属性的使用。\n\n```html\n<HTML>\n<BODY>\n<SCRIPT>\nmyString\
    \ = new String(\"The cat sat on the mat\")\nlen = myString.length\nfor (n = 0;\
    \ n < len; n++) {\n  c = myString.charAt(n)\n  document.write(\"Character \" +\
    \ n + \" is \" + c + \"<BR>\")\n}\n</SCRIPT>\n</BODY>\n</HTML>\n```\n\n`indexOf(text)`\
    \ 提供了另一种分析字符串的方法。它返回在字符串中找到 `text` 的第一个位置，`text` 可以可以是字符、单词或短语。如果不存在 `text`，该方法返回\
    \ -1。例如，对于电子邮箱地址：\n\n```html\nmyString = new String(\"The cat sat on the mat\"\
    )\nplace = myString.indexOf(\"@\")\nif (place == -1) {\n  document.write(\"Invalid\
    \ e-mail address\")\n}\n```\n\n`lastIndexOf(text)` 的功能与 `indexOf()` 相同，但它从字符串末尾开始寻找\
    \ `text` 的最后一次出现。这里是两种用法：\n\n```html\n<HTML>\n<BODY>\n<SCRIPT>\nmyString = new\
    \ String(\"The cat sat on the mat\")\nplace = myString.indexOf(\"at\")\ndocument.write(\"\
    cat starts at character \" + place)\nlastplace = myString.lastIndexOf(\"at\")\n\
    document.write(\"The last starts at character \" + lastplace)\n</SCRIPT>\n</BODY>\n\
    </HTML>\n```\n\n（省略后续重复翻译内容，注：由于提供的 [content] 文本在后半部分存在逻辑混乱和重复的英文描述，如 \"Your clock's\
