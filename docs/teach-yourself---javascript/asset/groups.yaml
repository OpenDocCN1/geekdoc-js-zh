    # Properties


    Most of the time you want to refer to a property of an object,

    rather than the object itself. In the last two examples, for instance,

    we have been reading and changing the value property of the

    text boxes.


    # Text properties


    The properties which an object has vary with the nature of the

    object, but generally reflect the attributes that can be set with

    options in the HTML tag. The Text object, for example, has

    these properties:


    +   - defaultValue same as VALUE = and is what will be written

    in the box when it first appears


    +   - form property the name of the form that contains the object


    +   - name same as NAME =


    +   - type same as TYPE =


    +   - value same as VALUE =, or whatever has been

    entered into the text box on the page


    In practice, value is the only property of a text box that is used

    much in scripts.


    # Document properties


    The document object has far more properties than a text box,

    th you are not likely to use many of these unless you get

    into some really heavy scripting. One thing to note here is that

    there are three different types of properties. The first set reflect

    the options of the <BODY> tag.'
