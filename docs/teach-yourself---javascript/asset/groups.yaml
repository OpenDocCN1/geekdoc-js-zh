    \ stop the repetition, either make the call dependent on a test, as above, or\
    \ use the clearTimeout method. This needs to know which timeout to clear – there\
    \ can be any number running at once – so the setTimeout must be created in a slightly\
    \ different form, giving it a name.\n\n```\ntimer1 = setTimeout(\"irritate()\"\
