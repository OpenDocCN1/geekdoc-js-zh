  - "[PAGE 17]\n\nNotice the shape of the function. All functions have the same general\
    \ pattern:\n\n```\nfunction function_name() {\n  statements\n  statements\n}\n\
    ```\n\nThe keyword function is followed by the function name, which has () brackets\
    \ after it. These brackets may contain data which is being passed between the\
    \ function and other parts of the code. The statements are held together by {curly\
    \ brackets}. The convention is to write the opening bracket directly after the\
    \ function name(), and the closing one on a line by itself at the end. The statements\
    \ are normally indented by one or more tabs.\n\nIn practice, it doesn't make any\
    \ difference how you lay out your code – except for readability. These layouts\
    \ would work just as well. I prefer the first layout. If the opening and closing\
    \ brackets are both by themselves at the starts of lines, it is very simple to\
    \ glance down the code and make sure that each opening bracket has its matching\
    \ closing bracket.\n\n```\nfunction function_name() {\n  statements\n  statements\n\
    }\n```\n\n```\nfunction function_name() {\n  statements }\\}\n```\n\n# Files of\
    \ code\n\nHere's the same code again, but this time handled as a separate file.\
    \ The file consists of the same code that is written in the function, but without\
    \ the <SCRIPT> tags. It is saved in plain text format, with the extension .js.\n\
