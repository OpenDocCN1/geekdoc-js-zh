    \ `going` 变量的使用。如果它为 `true`，则已经有一个运行 `animate()` 的超时设置，在再次运行该函数并设置另一个超时之前，必须清除它。如果漏掉这一点，看看如果你多次点击“运行”或“反向”按钮会发生什么。\n\
    \n```\nfunction animate() {\n  if (going)\n    clearTimeout(timer)\n  nextpic()\n\
    \  timer = setTimeout(\"animate()\",100)\n}\n```\n\n要启动它，我们只需要将 `going` 设置为 `true`，给\
    \ `move` 赋值，并第一次调用 `animate()`。\n\n<INPUT TYPE = button VALUE = \" Run \" onClick=\"\
    going = true; move = 1; animate()\">\n\n这里是完整的代码。它稍微有点长，但最后一个示例将作为基础，在设置按钮时可以进行复制粘贴。\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>Perpetual motion </TITLE>\n<SCRIPT>\nfunction loadImages()\
    \ {\n  pic0 = new Image()\n  pic0.src = \"pic0.gif\"\n  pic1 = new Image()\n \
    \ pic1.src = \"pic1.gif\"\n  pic2 = new Image()\n  pic2.src = \"pic2.gif\"\n \
    \ pic3 = new Image()\n  pic3.src = \"pic3.gif\"\n  pic4 = new Image()\n  pic4.src\
    \ = \"pic4.gif\"\n  pic5 = new Image()\n  pic5.src = \"pic5.gif\"\n  pictures\
    \ = new Array(pic0,pic1,pic2,pic3,pic4,pic5)\n}\nfunction nextpic() {\n  current\
    \ += move\n  if (current < 0)\n    current = 5\n  if (current> 5)\n    current\
    \ = 0\n  pagePic.src =pictures[current].src\n}\nfunction animate() {\n  if (going)\
    \ {\n    clearTimeout(timer)\n    nextpic()\n  }\n  timer = setTimeout(\"animate()\"\
    ,100)\n}\n```\n\n```\nfunction checkload() {\n  if (pic5.complete == false) {\n\
    \    setTimeout(\"checkload()\", 100)\n  }\n</SCRIPT>\n</HEAD>\n<body><H3>Perpetual\
    \ motion?</H3>\n<IMG SRC = \"pic0.gif\" NAME = pagePic>\n<SCRIPT>\n  current =\
    \ 0\n  timer = null\n  going = false\n  move = 1\n  loadImages()\n  checkload()\n\
    </SCRIPT>\n</FORM>\n<INPUT TYPE = button VALUE = \" Reverse \" onclick=\"going\
    \ = true; move = -1; animate()\">\n```\n\n| 永动装置 - Microsoft Internet Explorer\
    \ |\n| 文件 | 编辑 | 查看 | 收藏 | 工具 | 帮助 |\n|---|---|---|---|---|---|\n| 永动装置？ | | |\
    \ | | |\n| 上一个 | 停止 | 下一个 | 运行 | | |\n**图 7.4** 带有按钮的永动装置。 |\n\n<INPUT TYPE =\
    \ button VALUE = \" Back \" onclick=\"move = -1; nextpic()\"\n<INPUT TYPE = button\
    \ VALUE = \" Stop \" onclick=\"clearInterval(timer)\"\n<INPUT TYPE = button VALUE\
    \ = \" Next \" onclick=\"move = 1; nextpic()\"\n<INPUT TYPE = button VALUE = \"\
    \ Run \" onclick=\"going = true; move = 1; animate()\"\n</BODY>\n</HTML>\n```\n\
    \n# 可点击图像\n\n图像本身对鼠标没有反应，但通过在 `<A>` 标签中包含它们，可以做到这一点。只需要一点精力。如果你只是想使用图像来触发页面上的某些活动，有两种方法。一种是使用\
    \ `onclick` 事件：\n\n```\n<a onclick=\"dstuff()\"><img src=\"image1.gif\"></a>\n\
    ```\n\n...\n\n第二种——更好的方法是使用 `<A>` 标签，以最简单的形式作为锚点。它对鼠标有反应。\n\n```\n<A onclick=\"\
    dstuff()\"><img src=\"image1.gif\"></A>\n```\n\n在下一个示例中，锚定图像可以接收三种事件。`onClick`\
    \ 显示时间警告；`onMouseEnter` 设置状态栏消息。\n\n```\n<HTML>\n<HEAD>\n<TITLE>可点击图像</TITLE>\n\
    <SCRIPT>\nfunction showtime() {\n  d = new Date()\n  h = d.getHours()\n  m = d.getMinutes()\n\
    \  s = d.getSeconds()\n  alert(\"现在的时间是: \" + h + ((m<10) ? \"0\" : \":\") + m\
    \ + ((s<10) ? \"0\" : \":\") + s)\n}\n\nfunction setStatus(n) {\n  if (n==1)\n\
    \    self.status = \"点击查看时间\"\n  else\n    self.status = \"可点击图像测试页面\"\n}\n</SCRIPT>\n\
    </HEAD>\n\n<BODY>\n<A onclick=\"showtime()\" onMouseOver=\"setStatus(1)\" onMouseOut=\"\
    setStatus(2)\"><IMG SRC=\"clock.gif\"></A>\n</BODY>\n</HTML>\n```\n\n# JavaScript\
    \ 图像映射\n\n如果你的页面上有图像映射，请记住 `<AREA>`是可以点击的，你可以为它们附加代码。\n\n# 练习\n\n1 创建包含两个文本输入和一个按钮的表单。在一个输入框中显示随机数字，并让用户复制到另一个。点击按钮时，代码应检查数字是否复制正确并显示花费的时间。\n\
    \n2 创建三个或多个大小相同但颜色或形状不同的图像。将它们在屏幕上横水平或垂直排列，并通过 `<IMG>` 标签循环图像文件，以产生运动的感觉。\n\n"
