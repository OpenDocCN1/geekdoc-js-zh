    {\n  if (a > b) return 1\n  else if (a < b) return -1\n  else return 0\n}\n```\n\
    \n# Recursion\n\nNot only can a function call another function, it can also call\
    \ itself. This is known as recursion. (Hence the famous computer dictionary definition\
    \ 'recursion: see recursion'). It is similar to running code through a loop, and\
    \ is useful when you need to analyze something into its components. But use with\
    \ care. If you do not leave an escape route, the program will lock into an endless\
    \ cycle.\n\nHere's a simple example of a recursive function. This calculates factorial\
    \ values. A factorial is a whole number that is multiplied by every number below\
    \ it, down to 1. It is indicated by a shriek (!) after the number, e.g. 5!\n\n\
    # Look at the start of the factorial sequence:\n\n1! = 1\n2! = 2 × 1 or 2 × 1!\n\
    3! = 3 × 2 × 1 or 3 × 2!\n4! = 4 × 3 × 2 × 1 or 4 × 3!\n\nYou can find the factorial\
    \ of any number by multiplying that number by the one factorial of the next lower\
    \ number. This works all the way down to 1!, which is equal to 1. We can turn\
    \ this into pseudo-code (i.e. written in English, but structured like code).\n\
    \n```\nif the number is 1\n  the factorial is 1\nelse\n  the factorial is the\
    \ number times the factorial of the\n  next lower number\n```\n\nWhich translates\
    \ directly to this function:\n\n```\nfunction factorial(num)\n{\n  if (num==1)\n\
    \    return num\n  else\n    return num * factorial(num-1)\n}\n```\n\nSo, if you\
    \ first call the function with the expression factorial(3), it will produce the\
    \ expression 3 * factorial(2) – calling itself. On the next time round, it generates\
    \ 2 * factorial(1) and calls itself again. This time it gets the answer 1, and\
    \ returns this value to the previous call, which uses it to calculate the value\
    \ 2, returning that to the top level. At this point the function does 3 * 2 and\
    \ gets the answer 6, which it passes back to the calling script.\n\nType it in\
    \ and test it. The script opens with a prompt so that you can enter any value\
    \ you like. For the initial testing, use numbers that are small enough for you\
    \ to be able to work out the answer yourself, then find out what 100! looks like!\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>Factorial</TITLE>\n<SCRIPT>\nfunction factorial(num)\n\
    {\n  if (num==1)\n    return num\n  else\n    return num * factorial(num-1)\n\
    }\n</SCRIPT>\n</HEAD>\n<BODY>\n<SCRIPT>\nn = prompt(\"Enter a number\")\ndocument.write(n\
    \ + \" ! = \" + factorial(n))\n</SCRIPT>\n</HTML>\n```\n\n# The Math methods\n\
    \nJavaScript has 20 mathematical methods. They all belong to the Math object,\
    \ and the only reason you need to know that is because it is part of the name\
    \ of the methods. We used two of these Math.round() and Math.random() in Chapter\
    \ 4 to produce random numbers. Let's have a closer look at them, and at the other\
    \ methods.\n\n# Random numbers\n\nMath.random() generates a random number in the\
    \ range 0 to 1. Used at its simplest, e.g.\n\n```\nx = Math.random()\n```\n\n\
    this will give you a value between 0.0 and 1.0. If you want a decent sized number,\
    \ this must be multiplied. Multiply by 10 to get a number in the range of 0 to\
    \ 10 – but it will have a decimal fraction. This gives you a number between 0\
    \ and 1000.\n\n```\nx = Math.random() * 1000\n```\n\nThe numbers produced by random()\
    \ are not, strictly speaking random, but are created by a complex mathematical\
    \ process. However, they can be treated as random if the numbers are unpredictable\
    \ and each number in the range is as likely to come up as any other. This next\
    \ example will test the random number generator. It produces 1000 random numbers,\
    \ and checks each to see if it is above or below 0.5, keeping a count of the high\
    \ and low values in the variables over and under. You should get around 500 of\
    \ each.\n\n# 05 functions and methods\n\n```\n<HTML>\n<BODY>\n<SCRIPT>\nover =\
    \ 0\nunder = 0\nfor(count = 0; count < 1000; count++)\n{\n  x = Math.random()\n\
    \  if (x<0.5)\n    over = over + 1\n  else\n    under = under + 1\n}\ndocument.write(\"\
    0 to 0.5 \" + over + \" over 0.5 \" + under + \"<BR>\")\n</SCRIPT>\n</HTML>\n\
    ```\n\n# Rounding\n\nround() converts a decimal value up or down to the nearest\
    \ integer, e.g.\n\nMath.round(5.67) = 6\nMath.round(5.43) = 5\n\nThere are two\
    \ other methods for converting decimals to integers:\n\nceil(num) rounds up to\
    \ the next integer\n\nMath.ceil(5.5) = 6\n\nfloor(num) rounds down to the next\
    \ integer.\n\nMath.floor(5.5) = 5\n"
  mdcn: "\n这里是相同的计算，但是通过函数执行的。在这个版本中，计算和输出行都已转移到函数中。\n\n```\n<HTML>\n<HEAD>\n<TITLE>作为函数的立方</TITLE>\n\
    <SCRIPT>\nfunction cube(num)\n{\nans = 1\nfor (count = 1; count <= 3; count++)\n\
    ans = ans * num;\ndocument.write(num + \" ^ 3 = \" + ans + \"<BR>\");\n}\n// 表示“...次方”\n\
    </SCRIPT>\n</HEAD>\n<BODY>\n<SCRIPT>\nn=5\ncube(n)\n</SCRIPT>\n</HTML>\n```\n\n\
    注意 BODY 脚本中的调用行...\ncube(n)\n... 以及函数的定义行：\nfunction cube(num)\n\n变量 `n` 在 BODY\
