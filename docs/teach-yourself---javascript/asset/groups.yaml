    # Working in frames


    For the most part, in framed pages is exactly the same as in unframed ones, but
    there are a few nice little touches you can add to a framed system with JavaScript.
    Here are a couple.


    # Following the focus


    The onSuccess and onBlur events occur when a visitor enters and leaves a page.
    With simple pages, these are of little use. With a framed system, where your visitor
    can move between pages in the different frames, it is worth reacting to these
    events.


    The next example uses a two-frame layout, with a navigation bar down the left,
    and the main display area to the right. Code in the navigation bar toggles the
    colours of the two areas so that the one in focus is white and the other is blue.


    ```

    onBlur= "document.backgroundColor= ''blue'';

    parent.display.document.backgroundColor = ''white '' "

    onFocus="document.backgroundColor= ''white'';

    parent.display.document.backgroundColor = ''blue'' "

    ```


    parent refers to the enclosing <FRAMSET> document, where display is defined as
    the second frame.


    Because there are only two frames here, it is sufficient to have the colour-setting
    code in just one frame — if this one isn''t in focus, the other one must be. With
    three or more frames, the simplest approach is to write code into each document
    that changes its own colour only.'
