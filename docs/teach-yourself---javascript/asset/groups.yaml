    # Properties of other objects


    We will look at the properties of the other form elements when we cover forms
    in Chapter 6. Of the other major objects, we will deal with images in Chapter
    7, and windows and frames in Chapter 8.


    # Properties and the hierarchy


    The links between objects in the hierarchy are properties: button2 is a property
    of form2, which is itself a property of mainDocument. This also works up the hierarchy:
    form2 is a property (parent of) button2. This can be useful as you will see once
    once we start getting into some real code.


    # Methods


    A method is a ready-made function that belongs to an object. Most of the methods
    are found in the special ''objects'', Date, Math and String (see Chapter 5), but
    the browser objects also have some. All form elements, for example, have these
    two methods:


    focus() moves the cursor into a text box or highlights a button, checkbox or other
    option


    blur() is the opposite of focus()


    This example shows the focus() method in action on buttons. When click one of
    the buttons, another one gets the focus. It''s all done with in-line scripts in
    lines like this:


    ```

    <INPUT TYPE="button" NAME= button1 VALUE="Button 1" onclick="button2.focus()">

    ```


    Two things to notice here:


    +   The method has empty brackets after the name. In other methods, the brackets
    are used for passing data to the method or getting information from it. Here there
    is no data to transfer but the brackets are still essential as they indicate to
    JavaScript that focus() is a method.


    +   The button''s full name is the document.form1.button2 but we can get away
    with the short form as the script is'
