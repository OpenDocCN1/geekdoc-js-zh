    \n![](img/abd8c35820179838d3f97b872561195a_64_1.png)\n\n**Figure 4.3** The form\
    \ and the page produced by the script. The Change value can be negative, but if\
    \ you want to count backwards, the end value must obviously be less than the start.\n\
    \n## Nested loops\n\nLoops can be 'nested' inside one another, with the inner\
    \ loop running its full course each time the program flow passes through the outer\
    \ loop. It's a technique that you might use to read an array, or to create a table\
    \ of two (or more) dimensions.\n\nThe next example displays a 10 x 10 block of\
    \ numbers, running 1 to 10 across the top and 1 to 10 down the left, with their\
    \ multiples where the rows and columns meet. When you think that each of the loops\
    \ could have a far higher end value, you realize just how much work you can get\
    \ out of two or three lines of code, thanks to loops!\n\n```html\n<HTML>\n<body>\n\
    <SCRIPT>\nfor (row = 1; row <= 10; row++)\n{\n  for (col = 1; col <= 10; col++)\n\
    \    document.write((row * col) + \" ... \");\n    // end of col loop\n  document.write(\"\
    <BR>\");\n}\n</SCRIPT>\n</HTML>\n```\n\n![](img/abd8c35820179838d3f97b872561195a_65_0.png)\n\
    \nFigure 4.4 A times table produced from two nested loops.\n\nThe display could\
    \ be neater! The problem is the output from write() is HTML code, and HTML does\
    \ not support tabs or display more than one space between items. Using dots for\
    \ spacing is a crude solution, but we can have a nicely laid out table with a\
    \ little effort – as you are about to see.\n\n## Tables from loops\n\nRemember\
    \ that you can write any HTML tags. If we want a neat table in HTML, we use <TABLE>\
    \ tags. The key ones are the row <TR> and column <TD> tags, which will fit nicely\
    \ into an inner and outer loop pattern.\n\nWe write a <TR> at the start of each\
    \ row:\n\n```javascript\nfor (row = 1; row <= 10 ; row++) {\ndocument.write(\"\
    <TR>\")\n```\n\nand wrap each column entry in <TD> </TD> tags:\n\n```javascript\n\
    for (col = 1; col <= 10 ; col++)\ndocument.write(\"<TD>\" + (row * col) + \"</TD>\"\
    )\n```\n\nThe amount of space between items, the border size and other options\
    \ can be set as usual in the <TABLE> tag, written at the start, before the loops.\n\
    \n```html\n<HTML>\n<BODY>\n<SCRIPT>\ndocument.write(\"<TABLE BORDER = 2 CELLACING\
    \ =5 ALIGN = CENTER>\")\nfor (row = 1; row <= 10 ; row++) {\n  document.write(\"\
    <TR>\")\n  for (col = 1; col <= 10 ; col++)\n    document.write(\"<TD>\" + (row\
    \ * col) + \"</TD>\")\n  // end of inner (col) loop\n  document.write(\"</TR>\"\
    )\n}\ndocument.write(\"</TABLE>\")\n</SCRIPT>\n</HTML>\n```\n\n## Dialog boxes\n\
    \nBefore we go any further on ways to control program flow, let's have a look\
    \ at dialog boxes. They offer a simple way to get values into a program, and that\
    \ can be very useful for testing branching structures.\n\nJavaScript has three\
    \ ready-made dialog boxes that you can use to interact with your visitors. All\
    \ three display a (fixed) title and a message, and halt the script until the user\
    \ responds. The message can be text, or any expression that produces text.\n\n\
    - alert(message) carries only an OK button. Use it to let your visitors know that\
    \ something has happened or is about to take place.\n\n```javascript\nalert(\"\
    Your order has been processed\")\n```\n\n![](img/abd835820179838d3f97b872561195a_67_0.png)\n\
    \nFigure 4.5 The improved display.\n\n![](img/abd8c35820179838d3f97b872561195a_67_1.png)\n\
    \n- confirm(message) carries an OK and Cancel button, and returns the Boolean\
    \ values true or false depending upon which button was clicked (OK returns true).\
    \ Use it where you are offering your visitor a Yes/No choice. The reply should\
    \ be assigned to a variable.\n\n```javascript\nit = confirm(\"Do you really want\
    \ to unsubscribe?\")\n```\n\n![](img/abd8c35820179838d3f97b872561195a_68_0.png)\n\
    \n- prompt(message, default) carries a text box and the OK and Cancel buttons.\
    \ It returns whatever was entered. Use it to get information where there is no\
    \ form. You can set a default value or use \"\" to clear the box. If you do not\
    \ set a default, the text box displays \"undefined\".\n\n```javascript\nnum =\
    \ prompt(\"Enter your number\", \"\")\n```\n\n![](img/abd8c35820179838d3f97b872561195a_68_1.png)\n\
    \nThe data from a prompt is always text. If you need it to be a number use the\
    \ eval() function like this:\n\n```javascript\nnum = eval(prompt(\"How many?\"\
    , \"\"))\n```\n\n## while loops\n\nA for loop is normally repeated for a set of\
    \ times. A while loop gives you greater flexibility in two ways:\n\n- the exit\
    \ test is at the start of the loop – it is performed before each repetition. If\
    \ the condition is met at the start, the loop's statements are not executed at\
    \ all.\n- the exit test can check the status of *any* variable, not just a loop\
    \ counter.\n\nThe basic **while** loop takes this shape:\n\n```javascript\nwhile\
    \ (test)\n  { statement(s) }\n```\n\nBut there is actually more to it. The variable\
    \ that is being tested must be given a value somehow earlier and must be changed\
    \ by some activity inside the loop. Here a counter is used to determine the number\
    \ of repetitions.\n\n```html\n<HTML>\n<BODY>\n<SCRIPT>\n  count = 0\n  while (count\
    \ < 10)\n  {\n    count++\n    document.write(\"<BR>Count = \" + count)\n  }\n\
    </SCRIPT>\n</HTML>\n```\n\nOne of the things to notice here is that this displays\
    \ 1 to 10 even though the text is `count < 10`. That's because count is incremented\
    \ *after* the test and before it is printed. Change the order of the increment\
    \ and print lines to this...\n\n```javascript\nwhile (count < 10)\n  {\n    document.write(\"\
    <BR>Count = \" + count)\n    count++\n  }\n```\n\nand you will get 0 to 9 display.\
    \ Watch out for this.\n\n## do...while\n\nThis variation on the while loop performs\
    \ its test after the enclosed statements. The basic shape is:\n\n```javascript\n\
    do\n{\n  statement(s)\n} while (test)\n```\n\nThe statements will always be executed\
    \ at least once before the test is performed, and will be repeated until the test\
    \ proves false. A typical use is where the repetition depends on user input or\
    \ some other activity within the loop.\n\n```html\n<HTML>\n<BODY>\n<SCRIPT>\n\
    total = 0\ndo\n{\n  num = eval(prompt(\"How many?\", \"\"))\n  total += num\n\
    \  document.write(\"<BR>Total so far = \" + total)\n}\nwhile (total < 100)\n</SCRIPT>\n\
    </HTML>\n```\n\n## Branching with if\n\nBranches make programs flexible, allowing\
    \ them to vary their actions in response to incoming data. The simplest form of\
    \ branch uses the if structure. This is the basic syntax:\n\n```javascript\nif\
    \ (test)\n  { statement(s) }\n```\n\nThe test checks the value held by a variable.\
    \ If the test proves true, the program performs the statement(s), otherwise are\
    \ ignored. For example:\n\n```javascript\nif (balance < 0)\n  alert(\"You are\
    \ overdrawn\")\n```\n\nThe overdraft warning is only issued if the user has a\
    \ balance below 0. Notice that as there was just the one statement curly brackets\
    \ were not needed.\n\nYou can see the if structure at work in the next example.\
    \ First the script generates a random number with this line:\n\n```javascript\n\
    x = Math.round(Math.random()*100)\n```\n\nThis uses two Math methods, round()\
    \ and random(). They are explained properly in Chapter 5, pages 82 and 83 – for\
    \ the moment, please just accept that the line works and that it will produce\
    \ a whole number in the range 0 to 99.\n\nThe code then gets the computer to work\
    \ out the value of a random number, which it does by splitting the difference\
    \ between the highest and lowest possible values. If its 'guess' is too high,\
    \ or too low, a message is displayed and the upper or lower limits.\n\nThe round()\
    \ method is used again later in the line which calculates guess. It rounds the\
    \ result up to the next whole number.\n\n```javascript\nguess = Math.round((max\
    \ + min) / 2)\n```\n\nThe program runs through a while loop, which tests the guess\
    \ against the random number. The initial guess is 50. How does that relate to\
    \ the line which calculates the next value of guess?\n\n```html\n<HTML>\n<BODY>\n\
    <SCRIPT>\n  x = Math.round(Math.random()*100)\n  max = 0  min = 0  count = 0\n\
    \  guess = 50\n  while (guess != x)\n  {\n    document.write(\"<BR>Trying \" +\
    \ guess)\n    count++\n    if (guess > x)\n    {\n      document.write(\" Too\
    \ high\")\n      max = guess\n    }\n  }\n</SCRIPT>\n</HTML>\n```\n"
