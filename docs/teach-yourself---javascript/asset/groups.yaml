  - '[PAGE 111]


    # The basic form


    Forms are the interactive part of HTML, and the link between your readers and
    your JavaScript code. They are so important to JavaScript that it is worth spending
    a little time on the relevant HTML tags.


    The form itself is not much more than a container, but it can contain buttons,
    that can be used for controlling code, and text areas and other elements where
    your reader can enter data or make choices. If you want to give instant feedback
    to your reader, the simplest way to do it is through an element on a form. If
    you want your reader to contact you, again, a form offers the simplest solution.


    The start and end of the form are marked by the tags <FORM> and </FORM>. The form
    can be given a NAME – and this is essential if there is more than one form on
    the page.


    ```

    <FORM NAME = dataentry>

    ```


    If you want the form data to be sent to you for processing, you must specify how
    and where through the two keywords METHOD and ACTION. These can take several options,
    of which the simplest is:


    ```

    <FORM METHOD = Post ACTION = mailto:your_address>

    ```


    With these settings, the data entered into the form is e-mailed to you when the
    form is submitted. Some older browsers cannot handle the mailto option. If you
    want feedback from all your readers, you need to use a CGI script (and you will
    need to talk to your ISP about this).


    # Buttons and text inputs


    Data is collected mainly in <INPUT...> tags. These come in several varietys, and
    their nature is defined by the TYPE=...


    <INPUT TYPE = text creates a single line slot for text entry. Text INPUTs need
    a second option NAME=... to identify the variable where the data will be stored.


    ```

    <INPUT TYPE = text NAME = email>

    ```'
  - '[PAGE 112]


    This creates the variable email. It will be displayed on screen a blank data entry
    slot, 20 characters wide. For a different size slot, add the option SIZE = giving
    the number of characters.

    Put some text nearby, so your visitors know what it is for:


    E-mail address:<INPUT NAME = email SIZE = 30>


    <INPUT TYPE = button creates a clickable button. The simplest way to run a JavaScript
    program is from one of these.


    <INPUT TYPE = button VALUE = "Done" onclick = ...>


    The VALUE= "Done" option defines the label for the button. onClick is followed
    by the JavaScript code.


    If the form data is to be e-mailed to you, somewhere in it you will have a Submit
    button.


    <INPUT TYPE = Submit VALUE = "Send Now">


    The phrase: TYPE = Submit defines it as a button that submits feedback. The similar
    phrase:


    TYPE = Reset defines a button to clear the form’s contents.


    VALUE = "Send Now">


    defines the button’s caption. You can use any text you like, but you must enclose
    it in quotes or only the first word will be displayed.


    If you want to collect some text that runs over several lines, such as a snail
    mail address, use a <TEXTAREA...> tag.


    <TEXTAREA NAME = Address>


    This displays as a very small box with scroll bars to the right and bottom. You
    can make it into a decent size by adding the options ROWS and COLS to define the
    size of the display.


    <TEXTAREA NAME = Address ROWS = 4 COLS = 40>


    The ROWS and COLS settings only affect the display size. If your visitors want
    to write more lines, or longer ones, they can – that’s what the scroll bars are
    for.


    Note that <TEXTAREA> needs a closing </TEXTAREA> tag.'
  - '[PAGE 113]


    # Checkboxes and radios


    If you want your form-fillers to be able to choose from a set of alternatives,
    you should use the TYPE options:


    +   - Checkbox where several alternatives can be chosen,

    - Radio, where only one of the set can be selected.


    They are used in very similar ways, with one significant exception. With checkboxes,
    each INPUT should have its own NAME variable, to store the response.


    ```

    I am interested in: <BR>

    <INPUT TYPE = Checkbox NAME = hard Hardware <BR>

    <INPUT TYPE = Checkbox NAME = soft Software <BR>

    <INPUT TYPE = Checkbox NAME = books Books <P>

    ```


    If the visitor selects the Hardware checkbox, the variable will have the value
    on.


    With radio buttons, the same NAME should be used for all the radios in the set,
    as you only want to allow one of the alternatives to be chosen:


    ```

    Sex: <BR>

    <INPUT TYPE = Radio NAME = sex VALUE = m CHECKED> Male <BR>

    <INPUT TYPE = Radio NAME = sex VALUE = f> Female

    ```


    We need to add the VALUE clause. This sets the value to be returned, so that the
    feedback will be in the form of sex = dk (if you have an indecisive visitor).
    If you omit the VALUE =, the feedback would read sex = on, whatever was selected.


    Notice the keyword CHECKED in the first <INPUT...> above. This sets the default.
    Miss it out if you want to start with all the radios clear.


    Compare this HTML code with the following screen display.


    ```

    <HTML>

    <HEAD>

    <TITLE>Checkboxes and Radios</TITLE>

    </HEAD>

    <BODY>

    <FORM METHOD=Post ACTION=mailto://sales@clogs.com>

    Tell me more about these wonderful Witherspoon clogs <P>

    ```'
