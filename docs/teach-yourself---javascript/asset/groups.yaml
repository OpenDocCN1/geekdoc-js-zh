    # Number values sees digits


    When JavaScript sees a number, it can treat either as a digit – i.e. as text –
    or as a value. If it is in quotes, it is definitely treated as text. If it is
    a number by itself, it is also treated as text. If it is in a calculation, JavaScript
    will usually recognize it as such, but may get it wrong. Look at this line:


    ```

    document.write("42 + 5 = " + 42 + 5 \)

    ```


    This will display:


    42 + 5 = 425


    Why? Because the + operator has two meanings – it can also be used to combine
    strings of text or mixed text and numbers. JavaScript treats the numbers in that
    line as if they were in quotes, like this:


    ```

    document.write("42 + 5 = " + "42" + "5" )

    ```


    And so joins them together instead of adding them up. Minus signs can also throw
    JavaScript.


    ```

    document.write("42 + 5 = " + 42 - 5 \)

    ```


    This will display NaN, which means Not a Number. The solution is to put brackets
    around the calculations. This forces JavaScript to work out the calculation –
    so that you have a single number – before writing anything on screen.


    Remove the brackets in the example on page 37 and see the effect.


    ![](img/abd8c35820179838d3f97b872561195a_49_0.png)


    **Figure 3.3** The same expressions, but without brackets.'
