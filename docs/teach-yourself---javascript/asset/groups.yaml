    \n如果他们提供了正确答案，break 将强制提前退出循环。通过在循环结束后检查循环变量 `count`，程序可以判断用户是失败了（count == 3）还是答对了（提前退出）。\n\
    \nnum1 和 num2 的值是由 Math 方法 `round()` 和 `random()` 生成的随机数。在这种情况下，这些值将在 1 到 20 之间。\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>Breaking out of loops</TITLE>\n</HEAD>\n<BODY>\n\
    <SCRIPT>\nnum1 = Math.round(Math.random()*20)\nnum2 = Math.round(Math.random()*20)\n\
    for(count = 0; count < 3; count++) {\n  answer = prompt(\"What is \" + num1 +\
    \ \" times \" + num2 + \" \")\n  if (answer == num1 * num2)\n    break\n}\nif\
    \ (count == 3)\nalert(\"The answer was \" + (num1 * num2))\nelse\nalert(\"Well\
    \ done\")\n</SCRIPT>\n</HTML>\n```\n\n## break to a label（跳转到标签）\n\n如果你有嵌套循环，可以给它们标记标签，并使用标签来控制\
    \ break。在下面的示例中，有两个循环：外层和内层，由变量 `n` 和 `m` 控制。这两个循环都设置为从 0 计数到 4，但在内层循环内部进行。关键行是：\n\
    \n```\nif (m==3) break inner\nif (n == 2) break outer\n```\n\n当 n 达到 3 时，程序跳出内层循环；当\
    \ n 达到 2 时，程序跳出外层循环。\n\n```\n<HTML>\n<BODY>\n<SCRIPT>\nout:\nfor(n = 0; n < 5;\
    \ n++)\ninner:\nfor(m = 0; m < 5; m++)\n{\nif (m==3) break inner\nif (n == 2)\
    \ break outer\ndocument.write(\"n n = \" + n + \" m = \" + m + \"<BR>\");\n}\n\
    </SCRIPT>\n</HTML>\n```\n\n输出应该是：\n\n```\nn = 0 m = 0\nn = 0 m = 1\nn = 0 m =\
    \ 2\nn = 1 m = 0\nn = 1 m = 1\nn = 1 m = 2\n```\n\n如果从 break 中移除标签会发生什么？\n\n##\
    \ continue（继续）\n\ncontinue 与 break 类似，但 break 是直接将程序流带出循环，而 continue 只是跳过任何剩余行并再次循环。当循环底部的行只有在满足条件时才执行时，请使用它。\n\
    \n在示例中，用户被要求输入两个数字，程序用第一个除以第二个。由于不能除以 0，因此如果输入了 0，代码将使用 continue 重新循环。\n\n```\n\
    <HTML>\n<BODY>\n<SCRIPT>\nalert(\"Welcome to the divider\")\nnum1 = 99\n\nwhile\
    \ (num1 != 0)\n{\n    num1 = prompt(\"Enter first number or 0 to exit,\", \")\n\
    \    if (num1 == 0)\n        break\n    num2 = prompt(\"Enter second number\"\
    , \")\n    if (num2 == 0)\n    {\n        alert(\"Division by 0! Restart sum\"\
    )\n        continue\n    }\n    ans = num1 / num2\n    alert(num1 + \" divided\
    \ by \" + num2 + \" = \" + ans )\n}\n</SCRIPT>\n</HTML>\n```\n\n我们可以使用 if ...\
    \ else 结构来控制循环结束处的程序流：\n\n```\nif (num2 != 0)\n{\n    ans = num1 / num2\n    alert(num1\
    \ + \" divided by \" + num2 + \" = \" + ans)\n}\nelse\n    alert(\"Division by\
    \ 0! Restart sum\")\n```\n\n当有很多行需要跳过时，continue 更加整洁。\n\n> 除以 0\n> 在大多数编程语言中，尝试除以\
    \ 0 会导致程序崩溃。JavaScript 则更加宽容——它给你 'infinity'（无穷大）作为结果。\n\n## continue with labels（带标签的\
    \ continue）\n\n标签配合 continue 的与 break 非常相似。这里是相同的嵌套循环，但这次测试检查的是数字是偶数还是奇数（% 执行取模除，给出余数——如果你能除以\
