    # What does JavaScript look like?


    JavaScript can be incorporated in a Web page in four ways:


    +   - Written into the body of a page in <SCRIPT> tags;

    - As attached code, written into an HTML tag;

    - As a set of functions (named blocks of code) written in the <HEAD> area;

    - As a set of functions written into a separate text file, and brought into the
    page through a link.


    You can have any combination of the four in a page. You can also use JavaScript
    variables as values in tags.


    # <SCRIPT>


    Code can be written enclosed in <SCRIPT> tags. This is the simplest way to get
    code onto a page, but it has two major limitations. The code is executed just
    once, when the page is loaded, and it can only refer to those objects that are
    already on the screen – if it tries to access something on a part of the page
    that has not yet been downloaded, the code will crash.


    ```

    <SCRIPT>

    alert("Hello from JavaScript")

    </SCRIPT>

    ```


    This script produces a message in an alert box – the standard box used in Windows
    applications to prompt the user.


    # Attached code


    JavaScript commands can be written directly into those HTML tags, such as those
    that produce buttons or other objects on a form, that can have suitable events
    – it’s the event that sets the JavaScript going.


    Here’s a simple example. This creates a button, and when it is clicked, a message
    is displayed in an alert box.


    ```

    <HTML>

    <HEAD>

    <TITLE>Code in a tag</TITLE>

    </HEAD>

    ```'
