    bold() equivalent to <B>

    charAt(place) returns character at *place*, counting from 0 at the start of the
    string.

    charCodeAt(place) returns the Unicode number of the character at place.

    s1.concat(s2,s3,...) joins the strings *s2, s3,* etc. to *s1.*

    fixed() equivalent to <TTY> – sets a monospaced font.

    fontcolor() equivalent to <FONT COLOR ...>

    fontsize() equivalent to <FONT SIZE ...>

    fromCharCode(code, code,...) forms a text string from the series of character
    codes.

    indexOf(searchtext) looks for *searchtext* and returns the place number of the
    first match.

    italics() equivalent to <I>

    lastIndexOf(searchtext) looks for *searchtext* and returns the place number of
    the last match.

    link() equivalent to creating a link in HTML, e.g.

    showText = "My place"

    url = "www.myplace.com"

    document.write("Click to visit me at " + showText.link(url))

    has the same effect as:

    Click to visit me at <A HREF="www.myplace.com">My place</A>

