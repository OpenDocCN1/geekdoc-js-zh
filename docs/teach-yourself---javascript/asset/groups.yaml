    # Array methods


    The Array object has several predefined methods which you can use on your new
    arrays.


    join() combines all the elements of an array into one string. This can then be
    output by giving the array name:


    ```

    document.write("We sell: " + products)

    ```


    reverse() turns the array on its head, so that it starts with its last element
    and finishes with its first


    sort() sorts the array into order. This is normally ascending alphabetical order
    though you can set it to sort descending, or numerically up or down.


    To use one of these methods, simply tack its name to the name of the array. So,
    to sort the products array, you would use:


    ```

    products.sort()

    ```


    This next example creates an array of seven elements and stores it in some names.
    It outputs them in their original order, and again as a sorted list. Feel free
    to replace my data with something of your own!


    ```

    <HTML>

    <BODY>

    <SCRIPT>

    nickname = new Array(7)

    nickname[0] = "Doc"

    nickname[1] = "Sneezy"

    nickname[2] = "Happy"

    nickname[3] = "Sleepy"

    nickname[4] = "Dopey"

    nickname[5] = "Grumpy"

    nickname[6] = "Bashful"

    document.write(nickname("The names in the array:<BR>")

    for (dwarf = 0 ; dwarf < 7; dwarf++)

    document.write(nickname[dwarf] + "<BR>")

    nickname.sort()

    document.write("<P>The sorted list: <BR>")

    for (dwarf = 0; dwarf < 7; dwarf++)

    document.write(nickname[dwarf] + "<BR>")

    nickname.reverse()

    ```'
