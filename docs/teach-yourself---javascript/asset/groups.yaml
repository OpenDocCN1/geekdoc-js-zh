  mdcn: "\n\n* 递归函数是指调用它自身的函数——它必须有一个出口！\n* JavaScript 拥有一组 Math 方法，用于处理随机数、整数、三角函数以及其他关键数学函数。\n\
    * Date 方法允许你获取或设置日期或时间。\n* String 方法为你提供了一系列分析和处理文本的方法。\n\n## 06 表单\n\n在本章中，你将学习：\n\
