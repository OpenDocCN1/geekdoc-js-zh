    \n![](img/abd8c35820179838d3f97b872561195a_148_6.png)\n\n# 受控制动画\n\n下一个示例在最后一个示例的基础上添加了一组控制按钮。这些按钮允许用户以全速运行“机器”，或者逐帧通过序列，既可以正向也可以是反向。尽管有五个新的控制按钮，但只有两个新函数。`nextpic()`\
