    \ expression and the end_test is performed. This will normally compare var with\
    \ a value, e.g. counter < 100. If the end_test is not met, the statements are\
    \ performed again, and the flow continues to loop back until it is met.\n\nThe\
    \ simplest type of for line has this shape:\n\n```\nfor (counter = 0; counter<10;\
    \ counter++)\n```\n\nThis sets up a loop that will repeat its statements a total\
    \ of 10 times, as counter is incremented through the values 0 to 9.\n\nYou can\
    \ count in either direction. Try this:\n\n```\n<HTML>\n<BODY>\n<SCRIPT>\nfor (count\
    \ = 10; count>=0; count--)\n  document.write(count + \"<BR>\")\ndocument.write(\"\
    Blast off!\")\n</SCRIPT>\n</BODY>\n</HTML>\n```"
