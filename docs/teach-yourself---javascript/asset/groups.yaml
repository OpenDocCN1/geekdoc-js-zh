    </HTML>\n```\n\nWe will look at some of the other form element methods in Chapter\
    \ 6.\n\n## write() and writeln()\n\nThese two document methods are used for displaying\
    \ text (and other material) on the page. They are both used in exactly the same\
    \ way and have virtually the same effect. writeln() puts a newline character –\
    \ an [Enter] keypress – after the text, but HTML usually ignores it.\n\nThe basic\
    \ shape of the write() method is:\n\n```\ndocument.write(expression, expression,...\
    \ )\n```\n\nYou must specify a document. If you are writing to the current page,\
    \ then use a simple ‘document’. If the output is going to a different page, you\
    \ must also include the name of the frame or window.\n\n```\nMainFrame.document.write(...)\n\
    MessageWindows.document.write(...)\n```\n\nAn expression can be a string of text,\
    \ a number, variable or the value returned by a function. A single write() can\
    \ have any number of expressions – separate them with commas.\n\nThe text that\
    \ you can write include HTML tags, and these are interpreted as normal by the\
    \ browser before displaying. Which means that you can use the method to produce\
    \ formatted text, <HR> lines, links, images or any other Web page material.\n\n\
    Note these next points carefully!\n\n- If the write() is written into a script\
    \ in the <BODY>, it is performed as the page is loaded, and its output appears\
    \ on that page.\n- If the write() is in attached code or a function and is activated\
    \ by a click or other event, the page display will be complete before it runs.\
    \ When it is performed, the output will replace the current page, unless it is\
    \ directed into another frame or window.\n\nYou can see both of these in the next\
    \ example. Look for the <SCRIPT> at the start of the body, and see how its document.write\
    \ puts text on the screen. (Though in practice you would never use it in this\
    \ way as it is much simpler to use the normal tag.)\n\nThe output() function will\
    \ pick the name written in the text box (form1.visitor.value) and say 'Hello'\
    \ to it. Notice the tags in the second write() that push the text onto a new line\
    \ and bold 'interactive'.\n\nWhen it is working, experiment with other text and\
    \ tags.\n\n```\n<HTML>\n<HEAD>\n<TITLE>The write() method</TITLE>\n<SCRIPT>\n\
    function output() {\n  document.write(\"Hello \",form1.visitor.value)\n  document.write(\"\
    <BR>Welcome to my <B>interactive</B> page\")\n```\n}\n</SCRIPT>\n</HEAD>\n\n<BODY>\n\
    <SCRIPT>document.write(\"<H2>Using write() to write HTML</H2>\")</SCRIPT>\n<FORM\
    \ NAME = form1>\n<INPUT TYPE = text NAME = visitor>\n<P>\n<INPUT TYPE = \"button\"\
    \ VALUE = \"Click Me\" onclick=\"output()\"\n</FORM>\n</BODY>\n</HTML>\n```\n\n\
    ![](img/abd8c35820179838d3f97b872561195a_37_0.png)\n\n**Figure 2.6** write() creates\
    \ a new page for its output. Click the browser's Back button to return to your\
    \ test page.\n\n## Event handlers\n\nWeb pages are active and interactive. Files\
    \ and images load in, the visitor moves between frames and windows, enters text,\
    \ makes selections and clicks buttons. These events can all be picked up by event\
    \ handlers and used to start JavaScript code.\n\nThere are 13 event handlers:\n\
    \n- onAbort applies only to images, and indicates that the image file has stopped\
    \ loading.\n- onBlur applies to all screen objects – window, frame, checkbox,\
    \ password, radio, reset, submit, text, textarea and fileUpload – and is activated\
    \ when the object goes out of focus.\n- onChange applies to text, textarea, select\
    \ and fileUpload picking up each keystroke or change of status.\n- onClick applies\
    \ to the form elements button, checkbox, radio, reset and submit, and to link\
    \ and area (linked area on an image map).\n- onError applies to window and image\
    \ and is activated by an error during downloading.\n- onFocus applies to all screen\
    \ objects – window, frame, button, password, radio, reset, submit, text, textarea\
    \ and fileUpload – and is activated when it comes into focus; for a window this\
    \ means when it initially means the topmost one, then the one that the user moves\
    \ into with a mouse click or by pressing [Tab].\n- onLoad applies to window and\
    \ image. For a window, onload is activated when download is complete. For an image,\
    \ onLoad occurs when the SRC property is set in an <IMG> tag – this is not the\
    \ same as downloading. Images can be downloaded and stored in memory, then allocated\
    \ to <IMG> tags later. With animated GIFs, onload occurs every time the animation\
    \ starts. See Chapter 7 for more images.\n- onMouseOut applies to link and area\
    \ (on an image map).\n- onMouseOver applies to link and area.\n- onReset applies\
    \ only to form, and is activated by a click on the reset button.\n- onSelect applies\
    \ to text and textarea, and is activated when the user selects part or all of\
    \ the text\n- onSubmit applies only to form, and is activated by a click on the\
    \ submit button.\n- onUnload applies only to window, and occurs when the window\
    \ is closed or the user moves to another window.\n\n## Writing in the Status bar\n\
    \nThe next example shows two of these event handlers at work. It also introduces\
    \ a new object and a new method. Let's look at those first:\n\n```\nself.status\
    \ = 'Hello and welcome'\n```\n\nThis line sets the Status bar to read 'Hello and\
    \ welcome'. self is a window object, and refers to the current window. This could\
    \ have been written as exactly the same way as window.status and would have worked\
    \ in exactly that way. Where there are several windows, self simply makes it clearer\
    \ which one is being used.\n\nstatus() is a method which sets the contents of\
    \ the Status bar. For reasons which I have not yet fathomed, if you use this with\
    \ mouseOver, you must add the statement 'return true' at the end to make it work.\
    \ When a function or method ends, it can pass data to the code through its return\
    \ value (see page 79). We are not using the return value here, and you do not\
    \ need this if you start status() in any other way. So, you need it here:\n\n\
    ```\nonMouseOver = \"self.status = 'Click and visit'; return true\"\n```\n\nbut\
    \ not here:\n\n```\nonMouseOut = \"self.status = 'Go back and click me!\"\n```\n\
    \nNotice that mouseOver and onOut are in the same tag. You can have any number\
    \ of event handlers in a tag.\n\n```\n<HTML>\n<HEAD>\n<TITLE>The Status bar</TITLE>\n\
    </HEAD>\n<BODY>\n<SCRIPT>self.status = 'Hello and welcome'</SCRIPT>\n<FORM NAME\
    \ = form1>\n<INPUT TYPE=\"button\" VALUE=\"Click Me\nonClick=\"self.status = 'Thank\
    \ you for clicking'\">\n</FORM>\n<A href=\"www.theplace.com onMouseOver=\"window.status\
    \ = 'Click and visit'; return true\" onMouseOut=\"window.status = 'Go back and\
    \ click me!\"\">This is a link</A>\n</BODY>\n</HTML>\n```\n\nType in the code,\
    \ save it and view the page in your browser.\nWhat happens to the Status bar when\
    \ the page opens, when the button is clicked, when you pause over the link and\
    \ when you move off the link? Now, change the first line of JavaScript code to\
    \ read:\n\nself.defaultStatus = 'Hello and welcome'\n\nThe Status method sets\
    \ the Status bar until it is changed by something else. defaultStatus has a more\
    \ permanent effect. It defines what is unless it is actively changed. Edit the\
    \ line and test the page again. You will find that the Status bar reverts to 'Hello\
    \ and welcome' after you click the button and when you move off the link.\n\n\
    ## Escaping characters\n\nThis is not about jailbreaks! Characters such as \"\
    \ and ' have a special purpose in JavaScript. But what if you want to show them\
    \ on the screen? The answer is to write a backslash (also known as *escape*) in\
    \ front of them. JavaScript then treats them as normal printing characters. e.g.\
    \ this line:\n\n```\ndocument.write(\"He said, \\\"You\\ve got to visit http:\\\
    :www.tybooks.com\\'\")\n```\n"
