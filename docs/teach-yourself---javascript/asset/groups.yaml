  - "[PAGE 65]\n\n# Nested loops\n\nLoops can be 'nested' inside one another, with\
    \ the inner loop running its full course each time the program flow passes through\
    \ the outer loop. It's a technique that you might use to read an array, or to\
    \ create a table of two (or more) dimensions.\n\nThe next example displays a 10\
    \ x 10 block of numbers, running 1 to 10 across the top and 1 to 10 down the left,\
    \ with their multiples where the rows and columns meet. When you think that each\
    \ of the loops could have a far higher end value, you realize just how much work\
    \ you can get out of two or three lines of code, thanks to loops!\n\n```\n<HTML>\n\
    <body>\n<SCRIPT>\nfor (row = 1; row <= 10; row++)\n{\n  for (col = 1; col <= 10;\
    \ col++)\n    document.write((row * col) + \" ... \");\n    // end of col loop\n\
    \  document.write(\"<BR>\");\n}\n</SCRIPT>\n</HTML>\n```\n\n![](img/abd8c35820179838d3f97b872561195a_65_0.png)\n\
    \nFigure 4.4 A times table produced from two nested loops."
