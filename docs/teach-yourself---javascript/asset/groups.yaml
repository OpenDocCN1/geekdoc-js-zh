    In practice, you would not use a separate file for something as trivial as this.
    A file makes sense where you have functions you want to use in several pages.
    By writing them into a file, you only have to type them in and test them once,
    but you can use them as often as needed.


    # Programming languages


    The only language that a computer can understand is machine code. This consists
    of numbers that the chip translates directly into commands, values and memory
    addresses. The commands are extremely simple; e.g. ''move this value into this
    memory address'', ''add 1 to this value''. Every type of computer has its own
    version of machine code.


    In the early days, when computers were much simpler, people wrote programs in
    machine code. No one does nowadays – it''s very hard work and there are better
    ways to write software.


    Programming languages use words and structures that are (more or less) comprehensible
    to humans. The programmer writes instructions as a text file – known as the source
    code – which is then converted into machine code for the computer. There are basically
    two ways of doing this.'
  - '[PAGE 19]


    # Compiled languages


    Some programming languages are *compiled*. The source code is passed to a *compiler*
    program, which first checks the text for errors, and stops if it finds any. The
    programmer must sort them out before the compiler will go to the next stage and
    turn the text into the machine code of an executable program.


    The program will only run on the same type of computer which it was compiled,
    because different types have different hardware and use different machine code.
    If you want to run the same program on different types, such as Windows and Linux
    PCs and Macintoches, you can — in theory take the source code across and recompile
    it. In practice, the code will normally need some rewriting because each machine
    tends to do some things in its own special ways.


    # Interpreted languages


    Source code can also be *interpreted*. An *interpreter* takes each line in turn,
    checks it for errors, then — if it''s error-free — converts it to machine code
    and executes it. As with the compiled languages, you normally have to rewrite
    the source code to transfer a program to a different platform.


    JavaScript is an interpreted language. Unusually — and happily for us — the same
    code will work on any type of computer, as long as it is running a reasonably
    modern version of Internet Explorer or Netscape Navigator (anything from 4.0 onwards).
    The interpreter is built into the browsers, and it''s the browsers that handle
    the differences between hardware platforms.


    # Starting JavaScript


    Any piece of JavaScript code normally has all or most of these elements:


    +   - one or more objects on the page, and an event relating to an object

    - some stored data

    - statements which create its structure

    - calculations or other processing of data.'
- md: "\n# Objects\n\nJavaScript sees a web page as a collection of objects. Images\
    \ and the buttons, text boxes and other components of forms are all objects, as\
    \ is the page itself and the browser window that it is in.\n\n- All objects have\
    \ properties, such as colour, position or the text that they hold.\n- Most objects\
    \ have methods – ready-made routines which are used for manipulating the object.\n\
    - Most objects have event handlers – routines which are triggered when the object\
    \ is clicked or changed in some way. These can be used for activating JavaScript\
    \ code.\n\nThe next chapter introduces browser objects, their properties, methods\
    \ and event handlers. Once you have got to grips with those you can start to write\
    \ code that will interact with the browser and visitors to the page.\n\n> JavaScript\
    \ objects\n> There are other JavaScript 'objects' – Array, Date, Math and String\
    \ – which are really just collections of methods. We will leave these until Chapters\
    \ 3 and 5.\n\n# Stored data\n\nIf you want to carry data from one part of a program\
    \ to another, or keep it safe while other things are happening, it can be stored\
    \ in variables – named memory locations. They are not needed if your code does\
    \ no more than simple interaction with the browser page, but to go beyond this\
    \ you need to be able to handle stored data.\n\nChapter 3 will introduce variables.\n\
    \n# Program structure\n\nA program consists of one or more statements – lines\
    \ of code. At the simplest, the statements will be executed once, one after the\
    \ other. But there can be lots more to it than this, which is where the fun comes\
    \ in programming. You can get the code to loop back, so that a set of statements\
    \ are repeated many times – to process a mass of information or to create some\
    \ kind of cumulative effect. You can write code which checks values and runs in\
    \ different directions, depending upon the result.\n\nWe shall be looking at ways\
    \ to control the flow of a program in Chapter 4.\n\n# Calculations and methods\n\
    \nYou can do a wide range of data processing with JavaScript. As well as simple\
    \ arithmetic, it can handle a wide range of mathematical functions, manipulate\
    \ text in many and varied ways, calculate time and dates, and sort or otherwise\
    \ process blocks of data.\n\nArithmetic calculations are covered in Chapter 5.\
    \ The methods used in processing maths, text and dates are introduced in Chapter\
    \ 5.\n\n# Putting it together\n\nIn the second half of the book, we will draw\
    \ all these elements together to explore some of the ways in which we can use\
    \ JavaScript to create active and interactive pages.\n\n# Learn by doing\n\nThe\
    \ best way to get to grips with any programming language is to play with it. Try\
    \ all the sample code given in this book. First type it in exactly as given, then\
    \ explore the concepts and techniques by varying the text, values, sizes or other\
    \ aspects. When you are clear about how each new element works, combine it with\
    \ what you learned previously and write your own pages.\n\nYou do not need any\
    \ special software for JavaScript – just a browser and a text editor. I use Internet\
    \ Explorer and Notepad. I use Notepad for three reasons – it has all the editing\
    \ facilities I need; it’s a small program and is so fast to load; and it’s what\
    \ is used by the View > Source command in Internet Explorer to display the page\
    \ – which is very handy.\n\n# Test procedures\n\nYou will find your own way of\
    \ working after a while, but here's how I test code – you may like to do the same.\n\
    \n1. Write the first program page in your text editor and save it as test.htm\
    \ (or something similar).\n2. At the start of later working sessions, open your\
    \ test page in your browser.\n3. Use View > Source to open the page in your text\
    \ editor.\n4. Edit and rewrite the code to test the next idea.\n5. Save the edited\
    \ file – use File > Save or click the Save button.\n6. Go back into Internet Explorer.\n\
    7. Click the Refresh button to reload the page.\n8. When you produce something\
    \ that you want to keep for future use, simply save it with a new name, go back\
    \ to test.htm for the next test.\n\nUsing the same file and flickering between\
    \ the text editor and the browser in this way is quicker and simpler than opening\
    \ and closing different files.\n\n# Comments\n\nTry to make your JavaScript code\
    \ readable. When you come back to a page after a few days, weeks or months, you\
    \ shouldn't struggle to make sense of it. Giving meaningful names to your variables,\
    \ functions and objects will help, and may be enough with short pieces of code.\
    \ If your code is longer or more complex, you should add comments to remind yourself\
    \ what is stored in variables and how routines work.\n\nTo write a comment in\
    \ JavaScript, there are two ways:\n\n- // // For a single-line comment, use double\
    \ slash:\n```javascript\n// This is a single-line comment\n```\n\n- /* */ // For\
    \ multi-line comments, start with /* and end with */:\n```javascript\n/* This\
    \ is a multi-line\n   comment */\n```\n\n# Summary\n\n- JavaScript is a browser-based\
    \ language.\n- JavaScript objects have properties, methods, and event handlers.\n\
    - Properties define the object.\n- Methods are built-in routines which work on\
    \ the object.\n- Event handlers pick up actions that affect the object.\n- Adding\
    \ comments makes code more readable.\n\n> Netscape and other browsers\n> Internet\
    \ Explorer is not the only browser, though it is far away the most popular – which\
    \ is why I have used it to test the examples. If you use Netscape or any other\
    \ browser, you may find minor differences in the way JavaScript is interpreted.\n"
  mdcn: "\n\n# 对象\n\nJavaScript 将网页视为对象的集合。图像、按钮、文本框以及表单的其它组件都是对象，页面本身以及它所在的浏览器窗口也是。\n\
    \n- 所有对象都有属性（properties），例如颜色、位置或它们所包含的文本。\n- 大多数对象都有方法（methods）——用于操作对象的现成程序。\n\
    - 大多数对象都有事件处理器（event handlers）——当对象被点击或以某种方式改变时触发的程序。这些处理器可以用于激活 JavaScript 代码。\n\
    \n下一章将介绍浏览器对象、它们的属性、方法和事件处理器。一旦你掌握了这些内容，就可以开始编写与浏览器以及页面访问者进行交互的代码了。\n\n> JavaScript\
    \ 对象\n> 还有其他 JavaScript“对象”——Array、Date、Math 和 String——它们实际上只是方法的集合。我们将这些内容留到第\
    \ 3 章和第 5 章介绍。\n\n# 存储数据\n\n如果你想将数据从程序的一个部分传递到另一个部分，或者在发生其他事情时保持数据安全，可以将其存储在变量中——即命名的内存位置。如果你的代码仅仅仅仅是与浏览器页面进行简单的交互，则不需要变量；但要更进一步，你需要能够处理已存储的数据。\n\
    \n第 3 章将介绍变量。\n\n# 程序结构\n\n程序由一个或多个语句（statements）——即代码行组成。在简单的情况下，语句将按顺序执行一次。但情况可能比这复杂得多，这正是编程的乐趣所在。你可以让代码循环返回，以便一组语句重复多次——以处理大量信息或创建某种累积效果。你可以编写检查值并根据结果在不同方向上运行的代码。\n\
    \n我们将在第 4 章中介绍控制程序流的方法。\n\n# 计算与方法\n\n你可以使用 JavaScript 进行广泛的数据处理。除了简单的算术运算，它还能处理各种数学函数，以多种多样的方式处理文本，计算时间和日期，并对数据块进行排序或其他处理。\n\
    \n算术计算将在第 5 章介绍。处理数学、文本和日期时使用的方法将在第 5 章介绍。\n\n# 整合\n\n在书的后半部分，我们将所有这些元素结合起来，探索使用\
    \ JavaScript 创建动态和交互页面的某些方法。\n\n# 在做中学学习\n\n掌握任何编程语言的最佳方法就是玩玩它。尝试书中提供的所有示例代码。首先按照给出的完全输入，然后通过更改文本、值、大小或其他方面来探索概念和技术。当你清楚了每个新元素的工作原理后，将其与你之前学到的结合起来，编写你自己的页面。\n\
    \nJavaScript 不需要任何特殊软件——只需要一个浏览器和一个文本编辑器。我使用 Internet Explorer 和记事本（Notepad）。我使用记事本三个原因：它具有我需要的所有功能；它是一个很小的程序且加载非常快；它是\
    \ Internet Explorer 中“查看 > 源代码”命令显示页面时使用的工具——这非常方便。\n\n# 测试步骤\n\n一段时间后，你会找到自己的工作方法，但以下是我如何测试代码的——你可能也会这样做。\n\
    \n1. 在你的文本编辑器中编写第一个程序页面，并将其保存为 `test.htm`（或类似的名称）。\n2. 在后续的工作阶段开始时，在浏览器中打开你的测试页面。\n\
    3. 使用“查看 > 源代码”在文本编辑器中打开该页面。\n4. 编辑并重写代码以测试下一个想法。\n5. 保存编辑后的文件——使用“文件 > 保存”或点击“保存”按钮。\n\
    6 回到 Internet Explorer。\n7. 点击“刷新”按钮重新加载页面。\n8. 当你产出想要留作以后的内容时，只需将其另存为新名称，回到 `test.htm`\
    \ 进行下一次测试。\n\n这样使用同一个文件并在文本编辑器和浏览器之间切换，比打开和关闭不同的文件要快速简单得多。\n\n# 注释\n\n尝试让你的 JavaScript\
    \ 代码具有可读性。当你几天、几周或几个月后回到某个页面时，你不应该费力去理解它。为你的变量、函数和对象赋予有意义的名称会有帮助，对于短代码来说，这可能足够了。如果你的代码更长或更复杂，你应该添加注释来提醒自己变量中存储了什么以及程序是如何运行的。\n\
    \n在 JavaScript 中编写注释有两种方法：\n\n- // // 单行注释，使用双斜杠：\n```javascript\n// 这是一个单行注释\n\
    ```\n\n- /* */ // 多行注释，以 /* 开头，以 */ 结束：\n```javascript\n/* 这是一个多行\n   注释 */\n\
    ```\n\n# 总结\n\n- JavaScript 是一种基于浏览器的语言。\n- JavaScript 对象具有属性、方法和事件处理程序。\n- 属性定义了对象。\n\
    - 方法是在对象上运行的内置程序。\n- 事件处理器捕获影响对象的操作。\n- 添加注释使代码更具读性。\n\n> Netscape 和其他浏览器\n> Internet\
    \ Explorer 不是唯一的浏览器，尽管它是最受欢迎的——这就是我用它来测试示例的原因。如果你使用 Netscape 或任何其他浏览器，可能会发现 JavaScript\
    \ 解释方式上存在细微差异。\n\n"
