  - '[PAGE 13]


    # What JavaScript?


    programming language. Its code is written directly into the HTML of Web pages
    and is interpreted and executed in response to some activity on the page – such
    as loading is complete or a button is clicked.


    JavaScript interacts with the browser. It can read information off the Web page,
    for example, data entered into the fields of a form. It is aware of the objects
    on the page and knows when things happen to them – it doesn''t just pick up the
    obvious things like mouse-clicks, but it also notices when a browser window is
    active and when the focus moves to a different window. And it is these events
    that trigger the execution of code – in programming jargon, JavaScript is an object-based,
    event-driven language. It can write onto the current browser window or a newly-opened
    one – it can write standard HTML code, so that you can use JavaScript to generate
    Web pages in response to activites in a Web page.


    is not a particularly complicated language and there are limits to what you can
    do with. At the simplest, a piece of JavaScript code may do more than display
    a message box to acknowledge that a button has been clicked. At the other end
    of the scale you can use JavaScript to write interactive games (though not fast
    shoot-emups) or to check an on-line order, calculate the costs and produce a confirmation
    form. Its limitations arise mainly from the fact that all its inputs and outputs
    must go through the browser and the other store data in files.


    # Client-side and server-side JavaScript


    This book only covers client-side JavaScript – that version of the language which
    is written in Web pages and which runs within the browser when the page is viewed.
    There is also a server-side version of the language – one which runs on the computer
    where the Web page is hosted. That requires the co-operation of your ISP. For
    client-side JavaScript you need nothing but a browser, a word processor and some
    effort and imagination.'
- md: "\n## What does JavaScript look like?\n\nJavaScript can be incorporated in a\
    \ Web page in four ways:\n\n- Written into the body of a page in `<SCRIPT>` tags;\n\
    - As attached code, written into an HTML tag;\n- As a set of functions (named\
    \ blocks of code) written in the `<HEAD>` area;\n- As a set of functions written\
    \ into a separate text file, and brought into the page through a link.\n\nYou\
    \ can have any combination of the four in a page. You can also use JavaScript\
    \ variables as values in tags.\n\n## <SCRIPT>\n\nCode can be written enclosed\
    \ in `<SCRIPT>` tags. This is the simplest way to get code onto a page, but it\
    \ has two major limitations. The code is executed just once, when the page is\
    \ loaded, and it can only refer to those objects that are already on the screen\
    \ – if it tries to access something on a part of the page that has not yet been\
    \ downloaded, the code will crash.\n\n```html\n<SCRIPT>\nalert(\"Hello from JavaScript\"\
    )\n</SCRIPT>\n```\n\nThis script produces a message in an alert box – the standard\
    \ box used in Windows applications to prompt the user.\n\n## Attached code\n\n\
    JavaScript commands can be written directly into those HTML tags, such as those\
    \ that produce buttons or other objects on a form, that can have suitable events\
    \ – it’s the event that sets the JavaScript going.\n\nHere’s a simple example.\
    \ This creates a button, and when it is clicked, a message is displayed in an\
    \ alert box.\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Code in a tag</TITLE>\n</HEAD>\n\
    <BODY>\n<FORM>\n<INPUT TYPE=button VALUE=\"Click Me\" onclick=\"alert('Ouch!')\"\
    >\n</FORM>\n</BODY>\n</HTML>\n```\n\n![](img/abd8c35820179838d3f97b872561195a_15_0.png)\n\
    \n**Figure 1.1** The display when the button is clicked.\n\nFocus on the last\
    \ phrase in the `<INPUT...>` tag:\n`onclick = \"alert('Ouch!')\"`\n\nThis follows\
    \ the standard shape for in-line JavaScript:\n`event = \"JavaScript statement(s)\"\
    `\n\nThe event in this case is **onclick**. This activates the statement:\n`alert('Ouch!')`\n\
    \nNotice that the script is written in double quotes, and that the text within\
    \ it – ‘Ouch!’ – is written in single quotes.\n\nThere can be any number of statements\
    \ in the same script. They should be separated by semicolons and the whole set\
    \ must be enclosed in double quotes. This will display two alert boxes, one after\
    \ the other:\n\n```html\n<INPUT TYPE=button VALUE=\"Click Me\" onClick=\"alert('Ouch!');\
    \ alert('Please stop!!')\">\n```\n\nIf you want to test this, type the HTML code\
    \ into your word processor or text editor, save it as a text file, calling it\
    \ test.htm or something similar, then open it in your browser.\n\n## Functions\n\
    \nThough these in-line blocks can be as big as you like, anything more than two\
    \ or three statements is hard to read and prone to error. In-line code is best\
    \ short and simple. There is a better way to handle more complex code.\n\nA function\
    \ is a named block of code, which you can call into action from another piece\
    \ of code.\n\n```html\n<HTML>\n<HEAD>\n<SCRIPT>\nfunction showmessage()\n{\n \
    \ alert(\"Ouch\")\n}\n</SCRIPT>\n</HEAD>\n```\n"
  mdcn: "\n\n## JavaScript 看起来是什么样的？\n\nJavaScript 可以通过四种方式整合到 Web 页面中：\n\n-   写入\
    \ `<SCRIPT>` 标签的页面主体中；\n-   作为附加代码，写入 HTML 标签中；\n-   作为一组写入 `<HEAD>` 区域的函数（命名的代码块）；\n\
    -   作为一组写入单独文本文件中的函数，并通过链接引入页面。\n\n你可以在一个页面中任用这四种方式的任何组合。你还可以将 JavaScript 变量作为标签中的值。\n\
    \n## <SCRIPT>\n\n代码可以写在包含在 `<SCRIPT>` 标签中。这是将代码获取到页面上最简单的方法，但它有两个主要的局限性。代码会在页面加载时执行一次，并且它只能引用屏幕上已经存在的对象——如果它尝试访问页面上尚未下载的部分的内容，代码将会崩溃。\n\
    \n```html\n<SCRIPT>\nalert(\"Hello from JavaScript\")\n</SCRIPT>\n```\n\n此脚本会在警告框中产生消息——这种框是\
    \ Windows 应用程序中用于提示用户的标准框。\n\n## 附加代码\n\nJavaScript 命令可以直接写入那些 HTML 标签中，例如那些产生表单中按钮或其他对象的标签，这些标签可以拥有相应的事件——正是事件触发了\
    \ JavaScript 的运行。\n\n这是一个简单的示例。它创建了一个按钮，当它被点击时，会在警告框中显示一条消息。\n\n```html\n<HTML>\n\
    <HEAD>\n<TITLE>Code in a tag</TITLE>\n</HEAD>\n<BODY>\n<FORM>\n<INPUT TYPE=button\
    \ VALUE=\"Click Me\" onclick=\"alert('Ouch!')\">\n</FORM>\n</BODY>\n</HTML>\n\
    ```\n\n![](img/abd8c35820179838d3f97b872561195a_15_0.png)\n\n**图 1.1** 点击按钮时的显示。\n\
    \n关注 `<INPUT...>` 标签中的最后一个短语：\n`onclick = \"alert('Ouch!')\"`\n\n这遵循内联 JavaScript\
    \ 的标准格式：\n`event = \"JavaScript statement(s)\"`\n\n在此情况下，事件是 **onclick**。它激活了语句：\n\
    `alert('Ouch!')`\n\n注意脚本是用双引号括起来的，而其中的文本——‘Ouch!’——是用单引号编写的。\n\n同一个脚本中可以是任意数量的语句。它们应该用分号隔开，整个集合必须包含在双引号中。这将显示两个警告框，相继出现：\n\
    \n```html\n<INPUT TYPE=button VALUE=\"Click Me\" onClick=\"alert('Ouch!'); alert('Please\
    \ stop!!')\">\n```\n\n如果你想测试这个，将 HTML 代码输入到你的文字处理器或文本编辑器中，保存为文本文件（命名为 test.htm\
    \ 或类似名称），然后在浏览器中打开它。\n\n## 函数\n\n尽管这些内联块可以随你意愿增大，但超过两个或三个语句的内容就很难阅读且容易出错。内联代码越短简单越好。处理复杂代码有更好的方法。\n\
    \n函数是一个命名的代码块，你可以从另一段代码调用它。\n\n```html\n<HTML>\n<HEAD>\n<SCRIPT>\nfunction showmessage()\n\
    {\n  alert(\"Ouch\")\n}\n</SCRIPT>\n</HEAD>\n```\n\n"
