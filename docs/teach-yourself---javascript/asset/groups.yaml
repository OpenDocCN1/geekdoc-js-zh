    # Search and replace


    There are three String methods, match(), search() and replace() that work on text
    using regular expressions. These are composed of literal characters, wildcards
    and special characters that can be used to find inexact matches or to locate text
    in particular places within strings. They could prove useful in server-side JavaScript
    when searching databases held on a server. As (a) I cannot conceive of any realistic
    use for them in client-side JavaScript and (b) they are fiddly and complex, I
    am not covering them here. You will find a brief summary of these methods on page
    161. And if you find a possible use for them and want to know more, look them
    up in the Core JavaScript Reference.


