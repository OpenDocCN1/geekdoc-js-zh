    # Buttons


    The <BUTTON> tag is a flexible alternative to <INPUT TYPE = Reset/Submit>. If
    all you want is a standard ‘Submit’, then it takes a little more work to do it
    this way, with no advantage. Compare these two lines. They produce identical results:


    ```

    <BUTTON TYPE="submit"> Send me </BUTTON>

    <INPUT TYPE = "submit" VALUE = "Send me">

    ```


    A <BUTTON> gives you more control over what appears on the button. You can format
    the text:


    ```

    <BUTTON TYPE="submit"><FONT SIZE = 5 COLOR = red>

    <B> Send me </B></FONT></BUTTON>

    ```


    This gives you large, bold, red characters on the button.'
- md: "\nYou can even use an image instead of text...\n<BUTTON TYPE=\"submit\"> <IMG\
    \ SRC=\"sendme.gif\" /> </BUTTON>\n...or well as text:\n<BUTTON TYPE=\"submit\"\
    > <FONT SIZE = 6> Send me please</FONT> <img src=\"smiley.gif\"></BUTTON>\n\n\
    ![](img/abd8c35820179838d3f97b872561195a_117_0.png)\n\n# Submit image buttons\n\
    \nThere is a special <INPUT TYPE = ...> option that is worth knowing about.\n\n\
    <INPUT TYPE = \"image\" SRC = \"sendme.gif\">\nThis displays the image, but makes\
    \ it work as a submit button. The advantage of this is that it does not have the\
    \ standard grey, rectangular background, Send Me! which you get with <BUTTON>,\
    \ but it can only be used for submitting forms.\n\n# The elements array\n\nThe\
    \ text boxes, options, buttons and other elements that you place on a form are\
    \ automatically made into an array. When each element is a totally separate item,\
    \ and is treated individually, this array is irrelevant, but at other times it\
    \ can be very useful. If you need to access or change the values in a set of items,\
    \ for example, treating them as an array can be the simplest way to do it.\n\n\
    The array is always called elements[]. The elements are numbered in the order\
    \ in which they appear on the form, starting in the top left with elements[0].\n\
    \nIn this example, an array-based routine is used to clear the entries from some\
    \ of the text boxes on a form. This allows visitors to erase the choices they\
    \ have made, without also clearing their name and e-mail address. Compare this\
    \ with the effect of the Reset button, which would wipe all the boxes clear.\n\
    \nNote that the loop runs from 2 to 4, picking up the 'Order...' text boxes only.\
    \ After you have got this working, change the end value to read 'loop < 7' and\
    \ see what happens when you let it run onto the buttons.\n\n```html\n<HTML>\n\
    <HEAD>\n<TITLE>Arrays of elements</TITLE>\n<SCRIPT>\nfunction clearform()\n{\n\
    for(loop = 2; loop < 5; loop++)\ndocument.form1.elements[loop].value = \"\"\n\
    }\n</SCRIPT>\n</HEAD>\n<BODY>\n<H2>Order form</H2>\n<FORM NAME = form1>\nContact\
    \ name<INPUT TYPE = text NAME = username VALUE = \"=\"\"><BR>\nE-mail address<INPUT\
    \ TYPE = text NAME = email VALUE = \"=\"\"><BR>\n```\n\n![](img/abd8c35820179838d3f97b872561195a_118_0.png)\n\
    \n**Figure 6.3 Clear orders** just wipes the Order... text boxes\n\nOrder 1 <INPUT\
    \ TYPE = text NAME = order1 VALUE = \"\" <BR>Order 2 <INPUT TYPE = text NAME =\
    \ order2 VALUE = \"\" <BR>Order 3 <INPUT TYPE = text NAME = order3 VALUE = \"\"\
    \ <BR><P><INPUT TYPE = button VALUE = \"Clear orders\" onclick=\"clearform()\"\
    ><P><INPUT TYPE = Reset VALUE = \"Clear whole form\"></FORM></BODY>\n\n# Checking\
    \ entries\n\nIf a form is to be completed properly, some items of data may be\
    \ essential – you must have the visitor’s address if you are to send them something.\
    \ Other entries may have to fall into a certain range of values – dates and order\
    \ numbers must be valid.\n\n# Is there anything there?\n\nYou can easily check\
    \ whether or not data has been entered into a text box, and with relatively little\
    \ code, you can send your visitor back to enter something. Attach this to any\
    \ text box or text area if you don’t want your visitors to leave it blank:\n\n\
    ```javascript\nonBlur = \"if(this.value==''){alert('Data please');this.focus()}\"\
    \n```\n\nthis refers to whichever object it is attached to. If it is empty (value=\"\
    \"), the following commands, held in {curly brackets}, will be executed.\n\nThe\
    \ focus() method places the cursor in a text box. (It also activates pages, highlights\
    \ buttons and selects other objects.)\n\nthis.focus() puts the cursor into the\
    \ current box. It works reliably when run from code within the event handler,\
    \ though it can get confused if used in code in functions. Somewhere in the process\
    \ of transferring from page to function it can lose track of which element this\
    \ refers to.\n\nI like to keep event handling code as simple as possible, so in\
    \ the next example, this of checking is managed by the function checkData(). The\
    \ elements[] array number of the text box is passed to it, e.g.\n\n```javascript\n\
    onBlur = checkData(2)\n```\n\nThe function then checks and responds as above.\n\
    function checkData(box)\n{\n    if(document.form1.elements[box].value == \"\"\
    ) {\n        alert(\"Please complete this box\")\n        document.form1.elements[box].focus();\n\
    \    }\n}\n```\n\nIf you have several essential text boxes, this is a neater solution\
    \ than attaching code directly to each.\n\n# Is it right?\n\nValidation is another\
    \ matter. Some things can be checked without too much trouble.\nIs a number value\
    \ in the right range?\n\n```javascript\nchecknum = eval(document.form.element[n].value)\n\
    if (checknum < 0 || checknum > 999)\nerror routine...\n```\n\nDoes the text box\
    \ contain (unwanted) digits?\n\n```javascript\ndigits = false\ntext = document.form.elements[n].value\n\
    for (loop = 0; loop < text.length; loop++)\n{\n    c = text.value.charAt(loop)\n\
    \    if (c >= \"0\" && c <= \"9\")\n        digits = true\n}\nif (digits)\nerror\
    \ routine...\n```\n\nThe validate( ) function in the example checks an ISBN (book\
    \ number). If you were doing this by hand, you would take each digit in turn,\
    \ multiply the first by 1, the second by 2, and so on to the last but one. The\
    \ results are then added together and the total divided by 11. The remainder should\
    \ be the same as the last digit.\n\nFor example, the ISBN of this book is 0 340\
    \ 81129 3. Do the sum:\n\n```text\n1*0+2*3+3*4+4*0+5*8+6*1+7*1+8*2+9*9 = 168/11\n\
    = 15 remainder 3\n```\n\nThe routine works through the ISBN, copying the numbers\
    \ into an array. The modulus operator (%) used to find the remainder.\n\n(Note:\
    \ The OCR text provided for the later pages contained significant repetitive/garbled\
    \ sections towards the end. I have cleaned it based on the logical flow of the\
    \ technical content provided in the first half of the document to ensure a coherent\
    \ professional output.)\n\n"
  mdcn: "\n\n你甚至可以使用图像来代替文本...\n<BUTTON TYPE=\"submit\"> <IMG SRC=\"sendme.gif\" />\
    \ </BUTTON>\n...或者以文本形式：\n<BUTTON TYPE=\"submit\"> <FONT SIZE = 6> 请给我发我</FONT>\
    \ <img src=\"smiley.gif\"></BUTTON>\n\n![](img/abd8c35820179838d3f97b872561195a_117_0.png)\n\
    \n# 提交按钮\n\n有一个值得的特殊的 `<INPUT TYPE = ...>` 选项。\n\n<INPUT TYPE = \"image\" SRC\
    \ = \"sendme.gif\">\n这会显示图像，但使其作为提交按钮工作。这种方法的优点是它不会有使用 `<BUTTON>` 时那种标准的灰色矩形背景（“Send\
    \ Me!”），但它只能用于提交表单。\n\n# elements 数组\n\n你放置在表单上的文本框、选项、按钮和其他元素会自动变成一个数组。当每个元素都是一个完全独立的项目并被单独处理时，这个数组是无关紧要的，但在其他情况下它可以非常有用。如果你需要访问或更改一组项目的值，例如，将它们视为数组可能是此最简单的方法。\n\
    \n该数组始终被调用为 `elements[]`。元素按照它们在表单上出现的顺序进行编号，从左上角的 `elements[0]` 开始。\n\n在这个示例中，使用了一个基于数组的程序来清除表单上某些文本框中的输入。这允许访问者删除他们所做的选择，而不会清除他们的姓名和电子邮件。将其与重置（Reset）按钮的效果相比，重置会清空所有框。\n\
    \n注意，循环从 2 运行到 4，只选取“Order...”文本框。在你成功让它工作后，将结束值更改为 `loop < 7`，看看让它运行到按钮上会发生什么。\n\
    \n```html\n<HTML>\n<HEAD>\n<TITLE>元素的数组</TITLE>\n<SCRIPT>\nfunction clearform()\n\
    {\nfor(loop = 2; loop < 5; loop++)\ndocument.form1.elements[loop].value = \"\"\
    \n}\n</SCRIPT>\n</HEAD>\n<BODY>\n<H2>订单表单</H2>\n<FORM NAME = form1>\n联系人<INPUT\
    \ TYPE = text NAME = username VALUE ==\"\"><BR>\n电子邮件地址<INPUT TYPE = text NAME\
    \ = email VALUE = \"=\"\"><BR>\n```\n\n![](img/abd8c35820179838d3f97b872561195a_118_0.png)\n\
    \n**图 6.3 清除订单** 仅清空了“Order...”文本框\n\n订单 1 <INPUT TYPE = text NAME = order1 VALUE\
    \ = \"\" <BR>订单 2 <INPUT TYPE = text NAME = order2 VALUE = \"\" <BR>订单 3 <INPUT\
    \ TYPE = text NAME = order3 VALUE = \"\" <BR><P><INPUT TYPE = button VALUE = \"\
    清除订单\" onclick=\"clearform()\"><P><INPUT TYPE = Reset VALUE = \"清空整个表单\"></FORM></BODY>\n\
    \n# 检查输入\n\n如果表单需要被正确填写，某些数据项可能是必不可少的——如果你要给他们发送东西，就必须拥有访问者的地址。其他条目可能落在特定的值范围内——日期和订单号必须是有效的。\n\
    \n# 是否内容？\n\n你可以轻松地检查文本框中是否输入了数据，并且只需较少的代码，你就可以让访问者返回输入内容。如果你不希望访问者留空，请将其附加到任何文本框或文本区域：\n\
    \n```javascript\nonBlur = \"if(this.value==''){alert('请填写数据');this.focus()}\"\n\
    ```\n\nthis 指的是它附加的任何对象。如果它是空的（value=\"\"），将执行包含在 `{大大括号}` 中的后续命令。\n\n`focus()`\
    \ 方法将光标置于文本框中。（它还会激活页面、高亮按钮并选择其他对象。）\n\n`this.focus()` 将光标放入当前框中。当从事件处理程序内部的代码运行时，它运行得很可靠，但如果在函数代码中使用，可能会产生混淆。在从页面到函数的传输过程中，它可能会丢失\
    \ `this` 指向哪个元素。\n\n我喜欢将事件处理代码保持尽可能简单，因此在下一个示例中，这种检查由函数 `checkData()` 管理。文本框的数组编号被传递给它，例如：\n\
    \n```javascript\nonBlur = checkData(2)\n```\n\n然后按上述方式进行检查和响应。\n```javascript\n\
    function checkData(box)\n{\n    if(document.form1.elements[box].value == \"\"\
    ) {\n        alert(\"请填写此框\")\n        document.form1.elements[box].focus();\n\
    \    }\n}\n```\n\n如果你有多个必要的文本框，这比直接在每个框上附加代码是一个整洁的解决方案。\n\n# 是否正确？\n\n验证是另一回事。有些事情可以在不需要太大麻烦的情况下进行检查。\n\
    数值是否在正确的范围内？\n\n```javascript\nchecknum = eval(document.form.element[n].value)\n\
    if (checknum < 0 || checknum > 999)\n错误程序...\n```\n\n文本框中是否包含（不想要的）数字？\n\n```javascript\n\
    digits = false\ntext = document.form.elements[n].value\nfor (loop = 0; loop <\
    \ text.length; loop++)\n{\n    c = text.value.charAt(loop)\n    if (c >= \"0\"\
    \ && c <= \"9\")\n        digits = true\n}\nif (digits)\n错误程序...\n```\n\n示例中的\
    \ `validate( )` 函数检查 ISBN（书号）。如果你是手动进行操作，你会逐个取出数字，第一个乘以 1，第二个乘以 2，依此类推，直到倒数第二个数字。然后将结果相加，并将总和除以\
    \ 11。余数应该与最后一位相同。\n\n例如，这本书的 ISBN 是 0 340 81129 3。进行求和：\n\n```text\n1*0+2*3+3*4+4*0+5*8+6*1+7*1+8*2+9*9\
    \ = 168/11\n= 15 余数 3\n```\n\n该程序会遍历 ISBN，将数字复制到数组中。使用模运算符 (`%`) 来寻找余数。\n\n（注：提供的后续页面\
    \ OCR 文本在结尾处包含大量的重复/乱码部分。我已根据文档前半部分提供的技术内容逻辑对其进行了清理，以确保输出内容的连贯和专业。）\n\n"
