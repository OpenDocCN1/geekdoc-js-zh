    ## A JavaScript calculator\n\nIn the last example in this chapter, a form is used\
    \ to create a calculator. Numbers are entered and operations selected by clicking\
    \ buttons, and the results are displayed in a text box.\n\nThe code is rather\
    \ long, but can be produced in less time than you might think. Cut, paste and\
    \ edit is the trick! The lines that create the buttons are all virtually the same,\
    \ and there are some very similar lines in the doFunc() and calculate() functions.\n\
    \nFigure 6.8 Here the form simply acts as the container for the buttons and text\
    \ box.\n\n![](img/abd8c35820179838d3f97b872561195a_132_0.png)\n\nHere is what\
    \ happens when the buttons are clicked:\n\n- Numbers decimal point – pass the\
    \ button value to `doNum()` to add the display box\n- Operators – pass the operator\
    \ to `doOp()` which stores in `n1` the current value in the display box and stores\
    \ the operator in op. It clears the box for the next number.\n- Equals sign –\
    \ runs `calculate()` which takes `n1` and the current value in the display and\
    \ combines them according to the current value of `op`.\n- Root, Sine, Cosine\
    \ and Tangent – these call `doFunc()` which uses the Math methods to work out\
    \ the values. Note how it converts angle values from degrees to radians using\
    \ `toRad()`\n\n```javascript\n<HTML>\n<head>\n<title>JavaScript calculator</title>\n\
    <script>\nfunction doNum(x) {\n  f1.display.value = f1.display.value + x\n}\n\
    function doOp(operation) {\n  n1 = eval(f1.display.value)\n  op = operation\n\
    \  f1.display.value = \"\"\n}\nfunction toRad(deg) {\n  return deg / 360 * 2 *\
    \ Math.PI\n}\nfunction doFunc(fn) {\n  n1 = eval(f1.display.value)\n  angle =\
    \ toRad(n1)\n  if (fn == \"r\")\n    f1.display.value = Math.sqrt(n1)\n  } else\
    \ if (fn == \"s\")\n    f1.display.value = Math.sin(angle)\n  } else if (fn ==\
    \ \"c\")\n    f1.display.value = Math.cos(angle)\n  } else if (fn == \"t\")\n\
    \    f1.display.value = Math.tan(angle)\n}\nfunction calculate() {\n  n2 = eval(f1.display.value)\n\
    \  if (op == \"+\") {\n    f1.display.value = n1 + n2\n  } else if (op == \"-\"\
    ) {\n    f1.display.value = n1 - n2\n  } else if (op == \"*\") {\n    f1.display.value\
    \ = n1 * n2\n  } else if (op == \"/\") {\n    f1.display.value = n1 / n2\n  }\
    \ else if (op == \"p\") {\n    f1.display.value = Math.pow(n1, n2)\n  }\n}\nfunction\
    \ clear() {\n  f1.display.value = \"\"\n}\n</script>\n</head>\n<body>\n<script>\n\
    var n1 = 0\nvar op = \"+\"\nvar n2 = 0\n</script>\n<form name=\"f1\">\n  <input\
    \ type=\"text\" name=\"display\">\n  <p>\n  <input type=\"button\" value=\" 7\
    \ \" onclick=doNum(\"7\")\n  <input type=\"button\" value=\" 8 \" onclick=doNum(\"\
    8\")\n  <input type=\"button\" value=\" 9 \" onclick=doNum(\"9\")\n  <br>\n  <input\
    \ type=\"button\" value=\" 4 \" onclick=doNum(\"4\")\n  <input type=\"button\"\
    \ value=\" 5 \" onclick=doNum(\"5\")\n  <input type=\"button\" value=\" 6 \" onclick=doNum(\"\
    6\")\n  <br>\n  <input type=\"button\" value=\" 1 \" onclick=doNum(\"1\")\n  <input\
    \ type=\"button\" value=\" 2 \" onclick=doNum(\"2\")\n  <input type=\"button\"\
    \ value=\" 3 \" onclick=doNum(\"3\")\n  <br>\n  <input type=\"button\" value=\"\
    \ 0 \" onclick=doNum(\"0\")\n  <input type=\"button\" value=\" . \" onclick=doNum(\"\
    .\")\n  <input type=\"button\" value=\" + \" onclick=doOp(\"+\")\n  <br>\n  <input\
    \ type=\"button\" value=\" \" onclick=doOp(\"\")\n</form>\n</body>\n</html>\n\
    ```\n\n## Exercises\n\n- 1 Starting from the validate example (page 110), add\
