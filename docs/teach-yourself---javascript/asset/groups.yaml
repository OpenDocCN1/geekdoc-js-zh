    <SCRIPT>\nn = 5\nresult = cube(n)\ndocument.write(n + \" ^ 3 = \" + result)\n\
    </SCRIPT>\n</HTML>\n```\n\nNotice the line that calls the function:\n\n```\nresult\
    \ = cube(n)\n```\n\nA simple cube(n) would not get the answer. Bearing in mind\
    \ that a function that returns a value is treated as any other value, you could\
    \ equally well call it from within the write() line:\n\n```\ndocument.write(n\
    \ + \" ^ 3 = \" + cube(n))\n```\n\nA function can have several return lines. Here\
    \ is a function, compare(), which tests two values and returns 1 if the first\
