    ![](img/abd8c35820179838d3f97b872561195a_125_0.png)\n\n**图 6.4** 使用 alert 检查变量的状态。\n\
    \n## 单选列表\n\n通过 ` <SELECT>` 和 `<OPTION>` 标签创建的下拉列表有两种形式。一种允许一次只选择一个；另一种则接受多个选择。它们需要以不同的方式进行处理。\n\
    \n`<SELECT>` 列表有一个 `selectedIndex` 属性，它是读取列表的关键。如果你在 `form1` 中设置了列表：\n`<SELECT\
    \ NAME = choice>`\n那么这将给你提供索引：\n`chosen = document.form1.choice.selectedIndex`\n\
    \n然后你可以在一组 `if` 测试中中使用该索引值来对选择做出反应，或者像示例中那样用它从数组中提取一个元素。在这里，数组存储价格，`setPrice()`\
    \ 函数显示所选项目的价格。\n\n```javascript\nfunction setPrice() {\n  chosen = document.form1.choice.selectedIndex\n\
    \  document.form1.price.value = prices[chosen]\n}\n```\n\n这里是代码。请随意替换你自己的数据！\n\
    \n```html\n<HTML>\n<HEAD>\n<TITLE>Single selections</TITLE>\n<SCRIPT>\nprices\
    \ = new Array(5)\nprices[0] = 19.99\nprices[1] = 24.99\nprices[2] = 29.99\nprices[3]\
    \ = 39.44\nprices[4] = 9.95\nfunction setPrice() {\n  chosen = document.form1.choice.selectedIndex\n\
    \  document.form1.price.value = prices[chosen]\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n\
    <H3>Witherspoon clogs</H3>\n<FORM NAME = form1>\nStyle <SELECT NAME = choice>\n\
    <OPTION value = trad>Traditional</OPTION>\n<OPTION value = slipon>Slip on</OPTION>\n\
    <OPTION value = cloth>Fine worsted</OPTION>\n<OPTION value = gold>Gold lame</OPTION>\n\
    <OPTION value = kids>Child</OPTION>\n</SELECT>\n<P><P>Price: <: TYPE = text =\
    \ = price = \"\"\n<P>\n<INPUT TYPE = button VALUE = \"Show price\" onclick = setPrice()>\n\
    </FORM>\n</BODY\n\nHTML>\n```\n\nimg/abd8c35582017983dd3f77872261195a_177.png)\n\
    \n**图 6.5**** alert 检查变量。\n\n## 多选\n\n如果你在 `<SELECT>` 标签中写入 `MULTIPLE` 关键字，你的访问者将能够选择多个选项（通过通常的方法——按住\
    \ Control 键点击）。`<SELECT MULTIPLE NAME = os`\n\n整个 `<SELECT>` 集的 `selectedIndex`\
    \ 不再使用。我们现在需要使用单个 `<OPTION>` 的 `selected` 属性（true 或 false 值）。它们形成一个数组，名称来自 `<SELECT>`\
    \ 标签，并在循环中方便地测试：\n\n```javascript\nfor(loop = 0; loop < document.form1.os.length;\
