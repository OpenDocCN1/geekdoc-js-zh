    \ after the final else. Here's the revised routine.\n\n```html\n<HTML>\n<HEAD>\n\
    <TITLE>Character tester</TITLE>\n</HEAD>\n<body\n<SCRIPT>\nletter = prompt(\"\
    Enter a character,\")\nwhile (letter != \"q\")\n{\n  if (letter < \" \")\n   \
    \ alert(\"Non-printing character entered\")\n  else if (letter >= \"a\" && letter\
    \ <= \"z\")\n    alert(\"Lower case letter entered\")\n  else if (letter >= \"\
    A\" && letter <= \"Z\")\n    alert(\"Upper case letter entered\")\nelse if (letter\
    \ >= \"0\" && letter <= \"9\")\n  alert(\"Digit entered\")\nelse\n  alert(\"Symbol\
    \ entered\")\nletter = prompt(\"Enter a character - q to quit,\")\n}\n</SCRIPT>\n\
    </HTML>\n```\n\nIf a character is not picked up by any of the tests, the else\
    \ statement is performed, and the \"Symbol entered\" message displayed.\n\nThree\
    \ minor points to note here.\n\n- This shows the use of a prompt dialog box to\
    \ get input, and an alert to display messages.\n\n![](img/abd8c35820179838d3f97b872561195a_75_0.png)\n\
    \n- There are lines prompting the user for a character before the while line and\
    \ again at the end of the loop. The while line needs something to test when it\
    \ starts.\n\n- Where you have a series of separate if statements, the program\
    \ will check each one, even after it has had a true result. With a compound ...\
    \ else if ... else structure like this, the program flow will jump to the end\
