    名称的选择是有意意的——参数名称可以与传递给它们的变量名称相同，也可以不同。`cube()` 中的参数和变量与 BODY 脚本中的是完全分离的。这些行同样有效：\n\
    n=5\ncube(n) \nn=5\ncube(n)\n\n# 参数\n\n在传递数据时，虽然必须传递正确类型的数据，但它可以作为变量，也可以作为字面量值。对\
    \ `cube()` 的这种调用同样有效：\n\n```\ncube(5)\n```\n\n将该行添加到 BODY 脚本中并再次运行程序。这次的输出应该是：\n\
    \n- 5 ^ 3 = 125\n- 4 ^ 3 = 64\n\n函数可以接受任意数量的参数，这些参数可以携带文本或数字。下一个示例包含此函数：\n\n```\n\
    function greeting(text, times)\n```\n\n它写入文本，根据需要重复次数。在下一个脚本中，你可以看到数据作为变量传递的示例...\n\
    \n```\ngreeting(words, repeat)\n```\n\n以及作为字面量传递的示例：\n\n```\ngreeting(\"Bye \"\
    , 2)\n```\n\n```\n<HTML>\n<HEAD>\n<TITLE>参数</TITLE>\n<SCRIPT>\nfunction greeting(text,\
    \ times)\n{\n  for (count = 1; count <= times; count++)\n  document.write(text)\n\
    }\n</SCRIPT>\n</HEAD>\n<BODY>\n<SCRIPT>\nwords = \"Hello \"\nrepeat = 3\ngreeting(words,\
    \ repeat)\n<SCRIPT>\n```\n\n```\ndocument.write(\"<BR>\")\ngreeting(\"Bye \",\
    \ 2)\n</SCRIPT>\n</HTML>\n```\n\n你必须传递相同数量的值——并且顺序正确。这样做行不通的：\n\ngreeting(3, \"\
    Hello\")\n\n# 返回值\n\n你可能还从学校数学中记得过使用余弦和其他函数。这些函数的返回值可以在任何你使用普通值的地方使用，例如：\n\n```\n\
    x = cos(y)\n```\n\n或者\nadjacent = cos(angle) * hypotenuse\n\nJavaScript 函数也可以返回一个值。要做到这一点，请使用关键字\
    \ `return` 并在后跟该值。`return` 行通常是函数的最后一行。例如，你可以这样定义一个 `cube` 函数：\n\n```\nfunction\
    \ cube(x)\n{\n  return x * x * x\n}\n```\n\n这里是立方立方程序，这次重写了，使得 `cube()` 函数将结果返回给调用代码。\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>作为函数的立方 - 2</TITLE>\n<SCRIPT>\nfunction cube(num)\n\
    {\n  ans = 1\n  for (count = 1; count <= 3; count++)\n    ans = ans * num;\n \
    \ return ans\n}\n```\n\n```\n</SCRIPT>\n</HEAD>\n<BODY>\n<SCRIPT>\nn = 5\nresult\
    \ = cube(n)\ndocument.write(n + \" ^ 3 = \" + result)\n</SCRIPT>\n</HTML>\n```\n\
    \n注意调用函数的行：\n\n```\nresult = cube(n)\n```\n\n简单的 `cube(n)` 是无法获得答案的。考虑到返回值的函数被处理为任何其他值，你同样可以很好地在\
    \ `write()` 行内部调用它：\n\n```\ndocument.write(n + \" ^ 3 = \" + cube(n))\n```\n\n\
    函数可以有几行 `return` 代码。这里有一个函数 `compare()`，它测试两个值，如果第一个较大则返回 1，如果较小则返回 -1，如果相同则返回\
    \ 0：\n\n```\nfunction compare(a,b)\n{\n  if (a > b) return 1\n  else if (a < b)\
    \ return -1\n  else return 0\n}\n```\n\n# 递归\n\n函数不仅可以调用另一个函数，它还可以调用自己。这被称为递归。（因此，有了著名的计算机字典定义“递归：参见递归”）。它类似于通过循环运行代码，并且当你需要将某些内容分解为它的组成部分时非常有用。但要小心使用。如果你不留出逃出口，程序将陷入死循环。\n\
    \n这是一个递归函数的简单示例。它计算阶乘值。阶乘是一个整数，它乘以它下方的每一个数字，直到 1。它通过在数字后加一个感叹号 `!` 表示，例如 `5!`。\n\
    \n# 查看阶乘的开始\n\n阶乘序列：\n\n1! = 1\n2! = 2\n3! = 6\n4! = 24\n5! = 120\n6! = 720\n\
    7! = 5040\n8! = 40320\n9! = 362880\n10! = 3628800\n\n递归函数的示例：\n\n```javascript\n\
    function factorial(n)\n{\n  if (n <= 1)\n    return 1\n  else\n    return n *\
    \ factorial(n - 1)\n}\n```\n"
