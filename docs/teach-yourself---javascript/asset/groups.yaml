  - "[PAGE 73]\n\nFor example:\n\n```\nif (total > 100)\n    carriage = 2.00\nelse\n\
    \    carriage = 5.00\n```\n\nThe carriage charge is £2.00 if you spend over £100,\
    \ otherwise it is £5.00.\n\nThe basic if structure has the beauty of simplicity\
    \ – it shows clearly the relationship between the test and the outcome. But it\
    \ is not always the best solution. You want to analyse a character to see if it\
    \ is an upper or lower letter, digit or a symbol. Here’s the first draft of a\
    \ program to do the job.\n\n```\n<HTML>\n<HEAD>\n<TITLE>Character tester</TITLE>\n\
    </HEAD>\n<BODY>\n<SCRIPT>\nletter = prompt(\"Enter a character,\", \")\nwhile\
    \ (letter != \"q\")\n{\n    if (letter < \" \")\n        alert(\"Non-printing\
    \ character entered\")\n    if (letter >= \"a\" && letter <= \"z\")\n        alert(\"\
    Lower case letter entered\")\n    if (letter >= \"A\" && letter <= \"Z\")\n  \
    \      alert(\"Upper case letter entered\")\n    if (letter >= \"0\" && letter\
    \ <= \"9\")\n        alert(\"Digit entered\")\nletter = prompt(\"Enter a character\
    \ - q to quit,\", \")\n}\n</SCRIPT>\n</HTML>\n```\n\nSo far, so good. The first\
    \ test spots the non-printing characters (tab, carriage return, movement, etc.\
    \ which are clustered at the start of the character set, ending at space). The\
    \ next three tests handle the sets, ‘a’ to ‘z’, ‘A’ to ‘Z’ and ‘0’ to ‘9’. What\
    \ about the rest?"
  - "[PAGE 74]\n\nLook at any character set (use the Character Map in Windows Accessories),\
    \ and you will see that there are punctuation and other symbols scattered between\
    \ the blocks of letters and digits. A test for these would look like this:\n\n\
    ```\nif ((letter > \" \\) && (letter < \"0\") || (letter >= \"9\") && (letter\
    \ < \"A\") || (letter > \"Z\") && (letter <= \"a\") || (letter >= \"z\"))\n```\n\
    \nThis is not an elegant solution! And it's not just that it doesn't look nice.\
    \ Complicated code is more likely to contain errors. This expression took some\
    \ time to work out and test – and I'm still not 100% sure about it!\n\nHere's\
    \ a much better solution. If ... else structure gives two branches from the same\
    \ test – one to follow if it is true, and one if it is false. This can be extended\
    \ to handle multiple branching.\n\n+   - if (test1)\n  {statement(s) if test1\
    \ is true}\n- else if (test2)\n  {statement(s) if test2 is true}\n- else\n  {statement(s)\
    \ if no tests are true}\n\nIf test1 is false, the program tries test2, and failing\
    \ that, tries the next. If all the tests prove false, the program performs the\
    \ statements after the final else. Here's the revised routine.\n\n```\n<HTML>\n\
    <HEAD>\n<TITLE>Character tester</TITLE>\n</HEAD>\n<body>\n<SCRIPT>\nletter = prompt(\"\
    Enter a character,\")\nwhile (letter != \"q\")\n{\n  if (letter < \" \\)\n   \
    \ alert(\"Non-printing character entered\")\n  else if (letter >= \"a\" && letter\
    \ <= \"z\")\n    alert(\"Lower case letter entered\")\n  else if (letter >= \"\
    A\" && letter <= \"Z\")\n    alert(\"Upper case letter entered\")\n```"
  - "[PAGE 75]\n\n```\nelse if (letter >= \"0\" && letter <= \"9\")\n  alert(\"Digit\
    \ entered\")\nelse\n  alert(\"Symbol entered\")\nletter = prompt(\"Enter a character\
    \ - q to quit,\"\")\n}\n<SCRIPT>\n</HTML>\n```\n\nIf a character is not picked\
    \ up by any of the tests, the else statement is performed, and the \"Symbol entered\"\
    \ message displayed.\n\nThree minor points to note here.\n\n+   This shows the\
    \ use of a prompt dialog box to get input, and an alert to display messages.\n\
    \n![](img/abd8c35820179838d3f97b872561195a_75_0.png)\n\n+   There are lines prompting\
    \ the user for a character before the while line and again at the end of the loop.\
    \ The while line needs something to test when it starts.\n\n+   Where you have\
    \ a series of separate if statements, the program will check each one, even after\
    \ it has had a true result. With a compound ... else if ... else structure like\
    \ this, the program flow will jump to the end once it it has found a match. If\
    \ the testing was being done repeatedly while processing a mass of data there\
    \ could be an appreciable improvement in running speed."
  - "[PAGE 76]\n\nThe switch structure can be used to replace a whole set of if statements,\
    \ where these all test the same simple variable for different values. A typical\
    \ use would be with a menu, where the switch directs the flow to the chosen option's\
    \ routine. The basic shape of the switch structure is:\n\n```\nswitch (expression)\n\
    {\n  case value:\n    statement(s)\n    break\n  case value: statement(s); break\n\
    \  ...\n  default : statement(s)\n}\",\n```\n\n# Alternative layouts\n\n+   *\
    \ The switch does a simple match, comparing each of the values with the expression\
    \ – you cannot use the relational operators here.\n* The values must be enclosed\
    \ in quotes and followed by a colon.\n* You need a break at the end of each of\
    \ the case statements to jump out of the switch block.\n* The statements can be\
    \ written on a series of lines or on a single line. In the latter case they must\
    \ be separated by semicolons.\n* The statements on the (optional) default line\
    \ are performed if there are no matching cases.\n* You can only test one value\
    \ with each case. If several values lead to the same actions, write them on successive\
    \ lines. e.g.:\",\n\n```\ncase \"purple\": :\n  case \"pink\": :\n    document.write(\"\
    Wazzup? You colour blind?\")\",\n```\n\nThe following program shows switch at\
    \ work. Notice this line:\ncolour =colour.toLowerCase()"
  - "[PAGE 77]\n\nThis uses the String function toLowerCase() to convert whatever\
    \ the user enters into lower case, making it simpler to check.\n\n```\n<HTML>\n\
    <BODY>\n<SCRIPT>\ncolour = prompt(\"What is your favourite colour?\",\"\")\ncolour\
    \ = colour.toLowerCase();\nswitch (\n case \"red\": :\n  document.write(\"You\
    \ have a passionate nature\")\n  break\n case \"blue\" :\n  document.write(\"\
    You tend to be cool and calm\")\n  break\n case \"green\" :\n  document.write(\"\
    You are at one with nature\")\n  break\n case \"purple\" :\n case \"pink\" :\n\
    \  document.write(\"Wazzup? You colour blind?\")\n  break\n default : document.write(\"\
    That's a very nice colour\")\n}\n</SCRIPT>\n</HTML>\n```\n\n# conditional operator\n\
    \nThe conditional operator ? : is a shorthand of if ... else. It can be used for\
    \ assigning alternative values based on a test, though not for redirecting program\
    \ flow. It can be convenient, though what you gain in compactness you lose in\
    \ readability.\n\nThe basic shape is:\n\n```\nvariable = (test ? value_if_true\
    \ : value_if_false)\n```\n\nHere's a simple example of its use. This gives a 10%\
    \ discount if the total is more than £250:\n\n```\ndiscount = ( total > 250 ?\
    \ 0.10 : 0)\n```"
