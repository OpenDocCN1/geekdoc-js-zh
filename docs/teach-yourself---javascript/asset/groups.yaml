  - "[PAGE 63]\n\n# Varying loop values\n\nThe number of times that a for loop is\
    \ repeated determined by the start and end values and the rate of change, but\
    \ these do not have to be fixed at design time. If any of these values are held\
    \ in variables, they can be assigned by the program's user or calculated during\
    \ its run.\n\nIn the next example, you decide the values by typing them into a\
