  - "[PAGE 152]\n\n```\n<INPUT TYPE = button VALUE = \" Back \" \nonclick=\"move =\
    \ -1; nextpic()\"\n<INPUT TYPE = button VALUE = \" Stop \" \nonclick=\"clearInterval(timer)\"\
    \n<INPUT TYPE = button VALUE = \" Next \" \nonclick=\"move = 1; nextpic()\"\n\
    <INPUT TYPE = button VALUE = \" Run \" \nonclick=\"going = true; move = 1; animate()\"\
    \n</BODY>\n</HTML>\n```\n\n# # Clickable images\n\nImages do not naturally react\
    \ to the mouse, but they can be made to do so with very little effort. If you\
    \ enclose an image with a<A> tag, it takes on the properties of a link, which\
    \ is clickable.\n\nA little care is needed. If the <A> tag is an HREF link and\
    \ you use the onClick event, like this...\n\n```\n<A HREF = www.wherever.com onClick=\"\
    dstuff()\" \n<IMG SRC = \"image1.gif\" /> </A>\n```\n\n... you may have a problem.\
    \ After this code has executed the dstuff() function it will link to the wherever\
    \ site.\n\nIf you simply want to use the image to trigger some activity within\
    \ the page, there are two ways to round this. One is to use the onMouseEnter event:\n\
    \n```\n<A HREF = www.wherever.com onMouseEnter=\"dstuff()\" \n<IMG SRC = \"image1.gif\"\
    \ /> </A>\n```\n\nThis allows dstuff() to be activated without linking to the\
    \ site, but the image will still link when clicked.\n\nThe second – better – approach\
    \ is to use the <A> tag in its simplest form, as an anchor. This responds to the\
    \ mouse just as a proper link.\n\n```\n<A onClick=\"dstuff()\" <IMG SRC = \"image1.gif\"\
