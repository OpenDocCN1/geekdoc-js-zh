    will come back to this in Chapter 7.


    # String methods


    In JavaScript, strings are objects, not variables as they are in earlier languages.
    Much of the time this doesn''t make a lot of difference – you can treat them as
    if they were variables – but the String object has properties and methods which
    can be applied to any strings in your code. You may find some of them useful.


    Strictly speaking, a string should be created with a line like this:


    ```

    myString = new String("This is a string of text")

    ```


    In practice, simply assigning a value will work just as well:


    ```

    myString = "This is a string of text"

    ```


    Any text entered at a prompt, in a TextBox or TextArea is also a string.


    There are two dozen String methods. Many of them simply allow you to do the same
    kind of formatting in JavaScript as you can in HTML. For example, take the bold()
    method. This emboldens text, in exactly the same way as a <B> tag.'
