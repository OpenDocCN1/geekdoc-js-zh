  \n## 3. 数组\n\n我们通过研究数组来开始深入探索数据结构。很快我们就会发现，数组是最流行的数据结构之一，许多其他数据结构都将其作为自身功能的一部分。在接下来的章节中，我们将了解数组是什么、为什么如此流行、它们擅长（以及不擅长！）的场景、如何使用它们等等。\n\
  \n开始吧！\n\n### 什么是数组？\n\n假设我们在纸上记下一份清单。我们把这张纸称为**购物清单**。现在，在这张纸上，我们写下一个从零开始的编号列表，列出所有需要从商店采购的物品（图\
  \ 3-1）。\n\n![描述：一张包含文本、截图、字体、手写文字的图片，自动生成](img/03fig01.jpg)\n\n**图 3-1** *购物清单*\n\
  \n这份购物清单存在于现实世界中。如果我们要用数字方式表示它，那么用来存储所有购物物品的数据结构就是**数组！**原因如下：**数组是一种设计用于按顺序存储数据集合的数据结构。**\
  \ 如果我们将购物清单转换为数组，结果将如图 3-2 所示。\n\n![描述：一张包含文本、截图、字体、图形的图片，自动生成](img/03fig02.jpg)\n\
  \n**图 3-2** *作为数组的购物清单*\n\n购物清单中的每一项都表示为数组中的一个元素。这些元素彼此相邻，并且**从零开始按顺序编号。** 让我们对数组执行一些常见的数据操作，以更好地理解其工作原理。\n\
  \n#### 添加元素\n\n对于数组，我们经常要做的事情之一就是向其中添加元素。具体在数组的哪个位置添加元素很重要，位置决定了需要多少工作量。在数组末尾添加元素轻而易举（图\
  \ 3-3）。\n\n![描述：一张包含文本、截图、字体的图片，自动生成](img/03fig03.jpg)\n\n**图 3-3** *向数组添加元素*\n\n\
  我们将新元素追加到末尾。这个新元素会获得下一个索引值。生活简单而美好。\n\n当我们在数组中间或开头添加元素时，首先需要为新内容腾出空间（图 3-4）。\n\n\
  ![描述：一张计算机截图，自动生成，置信度较低](img/03fig04.jpg)\n\n**图 3-4** *为新内容腾出空间*\n\n由于数组是按顺序排列的，*腾出空间*实际上意味着将一堆数组元素移动并重新计算它们的索引位置。需要移动的元素越多，操作就越慢。最坏的情况是在开头插入元素，因为这意味着每个元素都需要移动并更新其索引位置。这可是大量的移动！\n\
  \n#### 删除元素\n\n从数组中删除元素时，之前添加元素时遇到的相同挑战同样适用。如果删除末尾的元素，影响最小（图 3-5）。\n\n![描述：一张包含截图、文本的图片，自动生成](img/03fig05.jpg)\n\
  \n**图 3-5** *从末尾删除元素*\n\n\n\n\n没有其他数组元素受到影响。如果我们要从其他位置删除元素，则需要确保被删除元素之后的所有数组元素都正确定位并编号（图\
  \ 3-6）。\n\n![描述：一张计算机截图，自动生成的低置信度描述](img/03fig06.jpg)\n\n**图 3-6** *我们需要确保被删除元素之后的所有数组元素都正确定位并编号。*\n\
  \n例如，我们从数组中删除了第一个元素。现在数组中的其他每个元素都必须移动并重新计数以适应这一变化。呼！\n\n#### 搜索元素\n\n除了添加和删除元素，我们还会花大量时间搜索元素。最常见的方法是线性搜索，即从数组开头开始，逐个元素查找，直到找到目标（图\
  \ 3-7）。\n\n![描述：一张视频游戏截图，自动生成的低置信度描述](img/03fig07.jpg)\n\n**图 3-7** *线性搜索*\n\n根据数据的具体形态，我们可能可以进行一些优化。例如，如果我们知道数组的数据以某种方式排序（按字母顺序、数字顺序等），我们可以采用二分搜索来加快搜索速度（图\
  \ 3-8）。\n\n![描述：一张进度条截图，自动生成的低置信度描述](img/03fig08.jpg)\n\n**图 3-8** *二分搜索速度更快。*\n\
  \n我们稍后会详细介绍二分搜索、线性搜索以及其他搜索算法。\n\n#### 访问元素\n\n到目前为止，我们已经多次提到索引位置，现在是时候深入探讨一下了。索引位置充当标识符。如果我们要访问特定的数组元素（通过搜索或其他方式），我们通过其索引位置以\
  \ `array[index_position]` 的形式引用它，如图 3-9 所示。\n\n![描述：一张包含文本、截图、线条的图片，自动生成](img/03fig09.jpg)\n\
  \n**图 3-9** *数组索引位置*\n\n需要记住的几个技巧是：第一个元素的索引位置始终为 0。最后一个元素的索引位置始终比数组元素总数少 1。如果我们尝试提供一个无效的索引位置，将会出现错误！\n\
  \n### 数组实现/使用场景\n\n数组是一种基本的数据结构，几乎所有编程语言（如 JavaScript！）都内置提供。以下是一些常见示例，展示如何使用数组执行我们在购物清单示例中提到的操作：\n\
  \n```\n// 创建数组！\nlet groceries = [\"Milk\", \"Eggs\", \"Cereal\", \"Salami\", \"\
  Juice\"];\n// 访问第一个元素\nlet first = groceries[0];\n\n// 访问最后一个元素\nlet last = groceries[groceries.length\
  \ - 1];\n\n// 访问第三个元素\nlet cereal = groceries[2];\n\n// 在末尾插入元素\ngroceries.push(\"\
  Potatoes\");\n\n// 在开头插入元素\ngroceries.unshift(\"Ice Cream\");\n\n// 在第三个元素之后插入元素\n\
  groceries.splice(3, 0, \"Cheese\");\n\n// 删除最后一个元素\ngroceries.pop();\n\n// 删除第一个元素\n\
  groceries.shift();\n\n// 删除第三个元素\ngroceries.splice(2, 1);\n\n// 查找特定元素\nlet foundIndex\
  \ = groceries.indexOf(\"Eggs\"); // 1\nlet itemToFind = -1;\n// 遍历每个元素\nfor (let\
  \ i = 0; i < groceries.length; i++) {\nlet currentItem = groceries[i];\n// 返回找到的元素的索引\n\
  if (currentItem == \"Salami\") {\nitemToFind = i;\n  }\n}\n```\n\n如需深入了解数组的所有细节，请参阅我在\
  \ [www.kirupa.com/javascript/learn_arrays.htm](http://www.kirupa.com/javascript/learn_arrays.htm)\
  \ 上的全面数组指南。如果你对数组还不够熟练，请花点时间真正熟悉它们。我们后续将要学习的许多数据结构和算法在底层都大量使用了数组。\n\n### 数组与内存\n\
  \n在使用像 JavaScript 这样的现代高级编程语言时，我们无需主动考虑内存管理。所有的内存处理都由系统自动完成。接下来我们要探讨的内容会稍微深入到计算机的内部工作原理，了解这些原理将极大地提升我们对事物（这里指数组）运作方式的理解。\n\
  \n当我们考虑内存时，可以将其简化为一系列可以存储数据的区域（图 3-10）。\n\n![描述：一张游戏截图，自动生成的中等置信度描述](img/03fig10.jpg)\n\
  \n**图 3-10** *内存视为一系列区域*\n\n实际上，我们的内存永远不会像图中那样整洁。计算机同时处理着许多其他占用空间的事情（图 3-11）。\n\n\
  ![描述：一张游戏截图，自动生成的中等置信度描述](img/03fig11.jpg)\n\n**图 3-11** *工作中的内存*\n\n任何添加到内存中的新元素都需要放入可用的***空闲***区域。这让我们回到数组的话题。当我们创建数组时，首先需要在内存中分配一些空间供其存放。数组的特点是它们必须将元素存储在相邻（即连续）的内存区域中。它们不能分散在*空闲*和*已用*区域之间。\n\
  \n当我们初始化数组时，会在内存中分配一个固定大小的空间，并随着数组的增长不断增大这个固定大小。假设我们创建一个空数组。即使现在数组是空的，我们也会分配额外的内存区域（图\
  \ 3-12）。\n\n![描述：一张游戏截图，自动生成](img/03fig12.jpg)\n\n**图 3-12** *为数组分配内存*\n\n在我们的示例中，分配了七个内存区域。随着我们向数组添加元素，它们逐渐填满已分配的内存（图\
  \ 3-13）。\n\n![描述：一张游戏截图，自动生成的中等置信度描述](img/03fig13.jpg)\n\n**图 3-13** *用数据填充数组*\n\
  \n我们不断向数组添加数据，直到填满所有已分配的空间（图 3-14）。\n\n![描述：一张游戏截图，自动生成](img/03fig14.jpg)\n\n**图\
  \ 3-14** *数组已填满数据*\n\n如果添加一个额外的元素，接下来会发生什么？没有相邻的内存可以扩展数组。接下来，操作系统（或虚拟机）会找到一段连续的内存区域，将不断增长的数组移动到那里（图\
  \ 3-15）。\n\n![描述：一张游戏截图，自动生成](img/03fig15.jpg)\n\n**图 3-15** *寻找一段连续的内存区域*\n\n一旦找到这段内存区域，就需要将整个数组移动到新位置（图\
  \ 3-16）。\n\n![描述：一张游戏截图，自动生成的低置信度描述](img/03fig16.jpg)\n\n**图 3-16** *数组数据被移动到新的内存位置*\n\
  \n在数组完全移动之后（这绝不是廉价的操作，因为每个元素都需要移动到新位置），我们可以添加更多数组元素，而数组原来的内存位置则变成空闲空间，供其他数据使用（图\
  \ 3-17）。\n\n![描述：一张游戏截图，自动生成的中等置信度描述](img/03fig17.jpg)\n\n**图 3-17** *新数据现在可以进入移动后释放的内存位置。*\n\
  \n\n\n\n更传统的编程语言严格要求我们仔细思考内存以及如何确保不超出内存限制。像 JavaScript 这样的现代语言为我们处理了这一切，但超出分配内存大小并需要将数组移动到更大区域所带来的性能影响仍然存在。我们接下来会讨论这一点。\n\
  \n### 性能考量\n\n在前面的章节中，我们初步了解了数组擅长（以及不擅长）的操作类型。表 3-1 总结了性能和空间方面的考量。\n\n**表 3-1**\
  \ *数组性能与空间考量*\n\n![Images](img/03tab01.jpg)\n\n让我们通过查看每一类主要操作，更详细地探讨为什么我们的表格会有这些数值！\n\
  \n#### 访问\n\n数组访问效率极高，具有常数时间复杂度（O(1)）。这意味着，无论数组大小如何，访问数组中特定索引的元素所需的时间都是相同的。数组通过将元素存储在连续的内存位置来实现这种性能，从而允许使用索引直接访问。\n\
  \n#### 插入\n\n![Images](img/sq.jpg) 在数组开头插入一个元素效率低下，因为需要移动*所有*现有元素来为新元素腾出空间。此操作的时间复杂度为\
  \ O(`n`)，其中 `n` 是数组中的元素数量。\n\n![Images](img/sq.jpg) 在数组末尾插入一个元素效率更高，特别是**当数组有足够的相邻内存容量时**。这可以在常数时间（O(1)）内完成。\n\
  \n![Images](img/sq.jpg) 在数组中的特定索引处插入一个元素也需要移动所有后续元素来腾出空间。因此，其时间复杂度为 O(`n`)，其中 `n`\
  \ 是数组中的元素数量。\n\n![Images](img/sq.jpg) 正如我们之前所见，有时数组没有足够的相邻内存容量来添加新项。在这种情况下，时间总是会上升到\
  \ O(`n`)，因为我们的数组需要将其所有内容移动到一个更新、更大的内存区域。\n\n#### 删除\n\n![Images](img/sq.jpg) 从数组开头删除一个元素需要移动所有后续元素来填补空缺，导致时间复杂度为\
  \ O(`n`)，其中 `n` 是数组中的元素数量。\n\n![Images](img/sq.jpg) 从数组末尾删除一个元素效率很高，可以在常数时间（O(1)）内完成。\n\
  \n![Images](img/sq.jpg) 从数组中的特定索引处删除一个元素需要移动所有后续元素来填补空缺，导致时间复杂度为 O(`n`)，其中 `n` 是数组中的元素数量。\n\
  \n#### 搜索\n\n我们可以采用两类搜索方法：\n\n![Images](img/sq.jpg) **线性搜索：** 在未排序的数组中搜索一个元素需要遍历每个元素，直到找到匹配项或到达数组末尾。在最坏情况下，此操作的时间复杂度为\
  \ O(`n`)，其中 `n` 是数组中的元素数量。\n\n![Images](img/sq.jpg) **二分搜索：** 在**已排序的数组**中搜索一个元素可以使用二分搜索，它反复将搜索空间对半分割。此操作的时间复杂度为\
  \ O(log `n`)，其中 `n` 是数组中的元素数量。然而，二分搜索要求数组已排序，因此如果数组未排序，可能需要额外的排序操作，从而导致更高的时间复杂度。\n\
  \n我们将在后面介绍算法时更详细地讨论线性搜索和二分搜索，所以在此之前请记住这些信息。\n\n### 结论\n\n数组是我们将使用的最基本的数据结构之一。几乎所有编程语言，无论其层次多低，都提供了对数组的内置支持。这有几个原因。在编程中，我们经常处理数据集合。如果每个项目都要重新创建数组，那会很奇怪。另一个原因与数组的工作方式有关。它们紧密映射连续的内存区域，而我们（尤其是高级语言）很难从头重新创建数组数据结构并保持原生实现所提供的性能。这就是为什么，正如我们很快会看到的，数组实际上是我们将要研究的其他数据结构的一部分。\n\
  \n一些额外资源：\n\n![Images](img/sq1.jpg) 提问： [`forum.kirupa.com`](https://forum.kirupa.com)\n\
  \n![Images](img/sq1.jpg) 错误/已知问题： [`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\
  \n![Images](img/sq1.jpg) 源代码仓库： [`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\
  \n## 4. 链表\n\n链表非常棒。它们为处理大量不断变化的数据提供了一种优雅的解决方案，并且有一些巧妙的方法可以快速高效地完成所有这些处理。在本章中，我们将探讨链表的方方面面，例如其基本结构、性能特征、代码实现等等！这会很有趣。\n\
  \n开始吧！\n\n### 认识链表\n\n链表和数组一样，都是为了帮助我们存储数据集合。在图 4-1 中，我们有一个链表的示例，用于存储字母 A 到 E。\n\
  \n![Description: A picture containing text, screenshot, font, graphics Description\
  \ automatically generated](img/04fig01.jpg)\n\n**图 4-1** *一个链表*\n\n链表通过依赖相互连接的单个节点来工作。每个节点负责两件事：\n\
  \n![Images](img/sq.jpg) 它存储的任何数据，例如一个字母\n\n![Images](img/sq.jpg) 一个指向列表中下一个节点的 next\
  \ 指针（也称为引用）\n\n不言而喻，节点非常重要。我们可以放大一个节点并将其可视化，如图 4-2 所示。\n\n![Description: A picture\
  \ containing text, screenshot, graphics, font Description automatically generated](img/04fig02.jpg)\n\
  \n**图 4-2** *一个节点由一个值/数据和指向下一个节点的指针或引用组成。*\n\n链表的简要描述是：当我们获取一堆数据，将它们与节点匹配，并通过 next\
  \ 指针将节点连接在一起时，我们就得到了一个链表。链表是如何成为链表的？它如何帮助我们处理数据？让我们深入了解一些细节并回答这些问题！\n\n#### 查找值\n\
  \n我们有一个包含大量数据的链表，想要查找某个值。这是我们将执行的最常见操作之一。我们通过从*第一个*节点（也称为 `head` 节点）开始，并遍历由 next\
  \ 指针引用的每个节点来查找值（图 4-3）。\n\n![Description: A diagram of a bird Description automatically\
  \ generated with low confidence](img/04fig03.jpg)\n\n**图 4-3** *遍历节点*\n\n我们不断从一个节点跳到下一个节点，直到我们要么\n\
  \n![Images](img/sq.jpg) 找到我们正在寻找其值的节点\n\n![Images](img/sq.jpg) 到达标记列表末尾的最后一个节点（也称为\
  \ `tail` 节点），并且无处可去\n\n如果你觉得这听起来很像线性搜索，那你是对的。它确实是……并且包含了它所暗示的所有好坏性能特征。如果你不这么认为，也没关系。我们将在第\
  \ 17 章中更详细地研究线性搜索。\n\n#### 添加节点\n\n\n\n\n现在，让我们看看如何向链表中添加节点。添加节点的核心思想与其说是*添加*，不如说是*创建*一个新节点并*更新*几个\
  \ next 指针。我们将通过几个示例来了解这一点。假设我们想在末尾添加一个节点 F（图 4-4）。\n\n![Description: A picture containing\
  \ screenshot, hot air balloon Description automatically generated](img/04fig04.jpg)\n\
  \n**图 4-4** *我们想添加一个新节点 F。*\n\n我们需要做的是将*尾节点*或*最后一个* E 节点的 next 指针更新为我们正在添加的新节点 F（图\
  \ 4-5）。\n\n![Description: A picture containing screenshot, colorfulness, yellow\
  \ Description automatically generated](img/04fig05.jpg)\n\n**图 4-5** *更新 E 的指针*\n\
  \n无论我们在链表的哪个位置添加新节点，行为基本一致。假设我们想在现有节点 C 和 D *之间*添加一个新节点 Q（图 4-6）。\n\n![Description:\
  \ A picture containing screenshot, colorfulness, line Description automatically\
  \ generated](img/04fig06.jpg)\n\n**图 4-6** *我们想在 C 和 D 之间添加一个新节点 Q。*\n\n要实现这一点，我们需要执行的步骤如下：\n\
  \n1. 将 C 的 next 指针替换为指向 Q。\n2. 将 Q 的 next 指针替换为指向 D。\n\n这将得到 图 4-7 所示的排列，这正是我们想要的。\n\
  \n![Description: A picture containing screenshot, colorfulness Description automatically\
  \ generated](img/04fig07.jpg)\n\n**图 4-7** *Q 已被添加。*\n\n需要记住的一个重要细节是，无论我们在链表的哪个位置添加节点，链表的主要任务都是确保更新\
  \ next 指针以容纳新添加的节点。虽然听起来复杂，但工作量很小。如果我们在链表的开头或末尾添加节点，只需进行一次指针相关的更新。如果我们在链表开头或末尾以外的任何位置添加节点，则需要进行两次指针相关的更新。这相当高效！\n\
  \n#### 删除节点\n\n当我们要删除节点时，步骤与添加节点类似。假设我们要删除链表中的节点 D（图 4-8）。\n\n![Description: A picture\
  \ containing screenshot, graphic design, graphics Description automatically generated](img/04fig08.jpg)\n\
  \n**图 4-8** *我们想删除节点 D。*\n\n我们要做的是更新节点 C 上的 next 指针，使其直接引用节点 E，绕过节点 D（图 4-9）。\n\n\
  ![Description: A screenshot of a game Description automatically generated with low\
  \ confidence](img/04fig09.jpg)\n\n**图 4-9** *更新 C 上的指针以引用 E，绕过 D*\n\n我们还会清除 D 节点上的\
  \ next 指针。所有这些操作使得节点 D 在遍历中不可达，并移除了该节点与链表中其他节点的所有连接。不过，*不可达*并不意味着*已删除*。节点 D 究竟何时被真正删除？具体时机因情况而异，但它是作为**垃圾回收**的一部分自动发生的——当计算机通过清除不需要的东西来回收内存时。\n\
  \n### 链表：时间与空间复杂度\n\n是时候来点更有趣的内容了！我们一开始讨论链表时，就提到了它们的速度和效率。对于最常见的操作，表 4-1 总结了链表的性能。\n\
  \n**表 4-1** *链表性能*\n\n![Images](img/04tab01.jpg)\n\n需要记住的一个重要细节是，链表的具体实现方式对某些操作的速度有重要影响。我们将采用的一种实现选择是，链表会直接引用第一个（头）节点和最后一个（尾）节点。\n\
  \n#### 运行时间深入分析\n\n该表忽略了一些细微但非常重要的细节，因此我们指出相关要点：\n\n![Images](img/sq.jpg) **搜索**\n\
  \n![Images](img/sq.jpg) 在单向链表中搜索一个元素需要 O(*n*) 时间，因为我们必须从头开始遍历链表才能找到该元素。\n\n![Images](img/sq.jpg)\
  \ 如果我们要找的恰好是第一个元素，那么我们在 O(1) 时间内就能返回找到的节点。\n\n![Images](img/sq.jpg) **添加/插入**\n\n\
  ![Images](img/sq.jpg) 在单向链表的开头或末尾插入一个元素需要 O(1) 时间，因为我们只需更新新节点的引用，使其指向链表的当前头节点或尾节点。\n\
  \n![Images](img/sq.jpg) 在链表中的特定位置插入一个元素，平均和最坏情况下需要 O(*n*) 时间，因为我们必须遍历链表才能找到该位置。\n\
  \n![Images](img/sq.jpg) **删除**\n\n![Images](img/sq.jpg) 与添加情况类似，从单向链表的开头或末尾删除一个元素需要\
  \ O(1) 时间，因为我们只需更新第一个或最后一个节点的引用。\n\n![Images](img/sq.jpg) 从链表中的特定位置删除一个元素，平均和最坏情况下需要\
  \ O(*n*) 时间，因为我们必须遍历链表才能找到该元素，然后将其删除。\n\n#### 空间复杂度\n\n从内存/空间角度来看，链表需要 O(*n*) 空间。对于链表要存储的每一条数据，我们将其包装成一个节点。节点本身是一个非常轻量级的结构：它只包含一个用于存储数据的薄包装器和一个指向下一个节点的引用。\n\
  \n### 链表的变体\n\n事实证明，链表并非一种通用的解决方案。我们需要了解几种流行的变体，并讨论它们为何有用。\n\n#### 单向链表\n\n剧透警告：单向链表正是我们到目前为止深入探讨的链表类型（图\
  \ 4-10）。\n\n![Description: A picture containing screenshot, text, font, graphics\
  \ Description automatically generated](img/04fig10.jpg)\n\n**图 4-10** *我们的单向链表*\n\
  \n在单向链表中，每个节点只有一个指向下一个节点的指针。对于许多情况，这种单向行为已经足够。\n\n#### 双向链表\n\n在双向链表中，每个节点有两个指针，一个指向前一个节点，一个指向下一个节点（图\
  \ 4-11）。\n\n![Description: A screenshot of a computer Description automatically\
  \ generated with low confidence](img/04fig11.jpg)\n\n**图 4-11** *双向链表*\n\n使用双向链接可以更方便地在两个方向上进行遍历，类似于从单车道变为双车道。我们通常会在关联数组和其他复杂数据结构的实现中看到双向链表。\n\
  \n#### 循环链表\n\n在循环链表中，最后一个节点的 next 指针指向第一个节点，形成一个循环结构（图 4-12）。\n\n![Description:\
  \ A diagram of a circular linked list Description automatically generated with low\
  \ confidence](img/04fig12.jpg)\n\n**图 4-12** *循环链表*\n\n这种链表可用于需要以循环方式访问项目的场景，例如调度算法、在扑克游戏中选取下一名玩家等。说到扑克，请看\
  \ 图 4-13。\n\n![Description: A painting of dogs playing cards Description automatically\
  \ generated with medium confidence](img/04fig13.jpg)\n\n**图 4-13** *扑克是一种循环活动。*\n\
  \n抱歉，我忍不住。如果你提到扑克，我就有义务分享这张图片。\n\n#### 跳跃表\n\n\n\n我们之前看到链表的速度很快。而跳表则让速度更上一层楼。跳表是一种包含额外“跳跃”链接的链表，这些链接就像快捷方式，可以更快地跳转到链表中的特定位置（图\
  \ 4-14）。\n\n![描述：一张计算机截图，自动生成的低置信度描述](img/04fig14.jpg)\n\n**图 4-14** *跳表*\n\n请注意，跳表的每一层都让我们能更快地访问某些元素。根据我们要查找的数据，我们会在每一层中水平遍历，同时上下移动，以尽量减少需要检查的节点数量。\n\
  \n跳表通常用于需要对大型数据集进行频繁查找或搜索的场景。通过向链表添加跳跃链接，我们可以在保持链表优势（如常数时间的插入和删除）的同时，减少查找特定元素所需的时间。\n\
  \n### 实现\n\n对于我们的链表，需要支持以下几个关键操作：\n\n![图片](img/sq.jpg) 创建一个新链表\n\n![图片](img/sq.jpg)\
  \ 在开头添加元素\n\n![图片](img/sq.jpg) 在末尾添加元素\n\n![图片](img/sq.jpg) 在某个现有元素之前添加元素\n\n![图片](img/sq.jpg)\
  \ 在某个现有元素之后添加元素\n\n![图片](img/sq.jpg) 检查链表中是否包含特定元素\n\n![图片](img/sq.jpg) 移除第一个元素\n\
  \n![图片](img/sq.jpg) 移除最后一个元素\n\n![图片](img/sq.jpg) 移除特定元素\n\n![图片](img/sq.jpg) 将链表元素转换为数组\n\
  \n![图片](img/sq.jpg) 获取链表的长度\n\n以下是支持所有这些操作的实现代码：\n\n```\nclass LinkedListNode {\n\
  \  constructor(data, next = null) {\n    this.data = data;\n    this.next = next;\n\
  \  }\n}\n\nclass LinkedList {\n  constructor() {\n    this.head = null;\n    this.tail\
  \ = null;\n    this.size = 0;\n  }\n\n  addFirst(data) {\n    const newNode = new\
  \ LinkedListNode(data, this.head);\n\n    this.head = newNode;\n\n    if (!this.tail)\
  \ {\n      this.tail = newNode;\n    }\n\n    this.size++;\n  }\n\n  addLast(data)\
  \ {\n    const newNode = new LinkedListNode(data);\n\n    if (!this.head) {\n  \
  \    this.head = newNode;\n      this.tail = newNode;\n    } else {\n      this.tail.next\
  \ = newNode;\n      this.tail = newNode;\n    }\n\n    this.size++;\n  }\n\n  addBefore(beforeData,\
  \ data) {\n    const newNode = new LinkedListNode(data);\n\n    if (this.size ===\
  \ 0) {\n      this.head = newNode;\n      this.size++;\n      return;\n    }\n\n\
  \    if (this.head.data === beforeData) {\n      newNode.next = this.head;\n   \
  \   this.head = newNode;\n      this.size++;\n      return;\n    }\n\n    let current\
  \ = this.head.next;\n    let prev = this.head;\n\n    while (current) {\n      if\
  \ (current.data === beforeData) {\n        newNode.next = current;\n        prev.next\
  \ = newNode;\n        this.size++;\n        return;\n      }\n\n      prev = current;\n\
  \      current = current.next;\n    }\n\n    throw new Error(`Node with data '${beforeData}'\
  \ not found in list`);\n  }\n\n  addAfter(afterData, data) {\n    const newNode\
  \ = new LinkedListNode(data);\n\n    if (this.size === 0) {\n      this.head = newNode;\n\
  \      this.size++;\n      return;\n    }\n\n    let current = this.head;\n\n  \
  \  while (current) {\n      if (current.data === afterData) {\n        newNode.next\
  \ = current.next;\n        current.next = newNode;\n        this.size++;\n     \
  \   return;\n      }\n\n      current = current.next;\n    }\n\n    throw new Error(`Node\
  \ with data '${afterData}' not found in list!`);\n  }\n\n  contains(data) {\n  \
  \  let current = this.head;\n\n    while (current) {\n      if (current.data ===\
  \ data) {\n        return true;\n      }\n\n      current = current.next;\n    }\n\
  \n    return false;\n  }\n\n  removeFirst() {\n    if (!this.head) {\n      throw\
  \ new Error('List is empty');\n    }\n\n    this.head = this.head.next;\n    if\
  \ (!this.head) {\n      this.tail = null;\n    }\n    this.size--;\n  }\n\n  removeLast()\
  \ {\n    if (!this.tail) {\n      throw new Error('List is empty');\n    }\n\n \
  \   if (this.head === this.tail) {\n      this.head = null;\n      this.tail = null;\n\
  \      this.size--;\n      return;\n    }\n\n    let current = this.head;\n    let\
  \ prev = null;\n\n    while (current.next) {\n      prev = current;\n      current\
  \ = current.next;\n    }\n\n    prev.next = null;\n    this.tail = prev;\n    this.size--;\n\
  \  }\n\n  remove(data) {\n    if (this.size === 0) {\n      throw new Error(\"List\
  \ is empty\");\n    }\n\n    if (this.head.data === data) {\n      this.head = this.head.next;\n\
  \      this.size--;\n      return;\n    }\n\n    let current = this.head;\n\n  \
  \  while (current.next) {\n      if (current.next.data === data) {\n        current.next\
  \ = current.next.next;\n        this.size--;\n        return;\n      }\n\n     \
  \ current = current.next;\n    }\n\n    throw new Error(`Node with data '${data}'\
  \ not found in list!`);\n  }\n\n  toArray() {\n    const arr = [];\n\n    let current\
  \ = this.head;\n\n    while (current) {\n      arr.push(current.data);\n      current\
  \ = current.next;\n    }\n\n    return arr;\n  }\n\n  get length() {\n    return\
  \ this.size;\n  }\n}\n```\n\n以下是演示这段代码运行效果的一些示例：\n\n```\nlet letters = new LinkedList();\n\
  letters.addLast(\"A\");\nletters.addLast(\"B\");\nletters.addLast(\"C\");\nletters.addLast(\"\
  D\");\nletters.addLast(\"E\");\n\nconsole.log(letters.toArray()); // ['A', 'B',\
  \ 'C', 'D', 'E']\n\nletters.addFirst(\"AA\");\nletters.addLast(\"Z\");\n\nconsole.log(letters.toArray());\
  \ // ['AA', 'A', 'B', 'C', 'D', 'E', 'Z']\n\nletters.remove(\"C\");\nletters.removeFirst();\n\
  letters.removeLast();\n\nconsole.log(letters.toArray()); // ['A', 'B', 'D', 'E']\n\
  \nletters.addAfter(\"D\", \"Q\");\n\nconsole.log(letters.toArray()); // ['A', 'B',\
  \ 'Q', 'D', 'E']\n\nletters.addAfter(\"Q\", \"H\");\nletters.addBefore(\"A\", \"\
  5\");\n\nconsole.log(letters.toArray()); // ['5', 'A', 'B', 'Q', 'H' 'D', 'E']\n\
  \nconsole.log(letters.length); // 7\n```\n\n要查看上述所有代码的在线演示，请访问这个 Codepen 演示：[`bit.ly/kirupa_linkedlist`](https://bit.ly/kirupa_linkedlist)。将来如果需要在代码中使用这个\
  \ `LinkedList`，我们可以直接复制粘贴所有代码，或者通过添加以下脚本标签直接引用它：\n\n```\n<script src=\"https://www.kirupa.com/js/linkedlist_v1.js\"\
  ></script>\n```\n\n稍后我们会看到，链表在多种其他数据结构和算法的实现中扮演着关键角色。\n\n### 结论\n\n呼！通过前面大量的文字和图示，我们看到链表提供了一种高效存储和操作数据的方式。它们支持常数时间的插入和删除，并且可以轻松遍历以执行搜索等操作。虽然它们并非最高效的数据结构，但在简洁性方面绝对可以稳居榜首。正如我们将在下一章中看到的，用\
  \ JavaScript 构建链表的过程与我们对其工作原理的解释一样优雅。\n\n一些额外资源：\n\n![图片](img/sq1.jpg) 提问：[`forum.kirupa.com`](https://forum.kirupa.com)\n\
  \n![图片](img/sq1.jpg) 错误/已知问题：[`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\
  \n![图片](img/sq1.jpg) 源代码仓库：[`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\
  \n## 5. 栈\n\n你是否曾在处理某些操作时使用过撤销或重做（图 5-1）？\n\n![描述：一张计算机截图，自动生成的描述](img/05fig01.jpg)\n\
  \n**图 5-1** *撤销/重做*\n\n你是否曾好奇过，你最喜欢的编程语言是如何将你编写的内容转化为一系列顺序步骤，从而让计算机知道该做什么的？你是否曾在浏览器中前进或后退？你喜欢吃煎饼吗？\n\
  \n\n\n如果你对以上任何一个问题的回答是肯定的，那么你可能已经遇到了本教程的主角——`stack`（栈）数据结构。在接下来的章节中，我们将进一步了解栈以及如何在\
  \ JavaScript 中使用它。\n\n开始吧！\n\n### 认识栈\n\n在生活中的某个时刻，我们几乎都见过一堆东西叠放在一起……比如煎饼，如图 5-2\
  \ 所示。\n\n![描述：黑色盘子上的煎饼堆，中等置信度自动生成的描述](img/05fig02.jpg)\n\n**图 5-2** *一堆东西*\n\n关于堆叠的东西，我们总是把新物品添加到顶部，也从顶部移除物品（图\
  \ 5-3）。\n\n![描述：包含截图、光线、设计、艺术的图片，中等置信度自动生成的描述](img/05fig03.jpg)\n\n**图 5-3** *从栈顶添加和移除*\n\
  \n这个概念同样适用于计算机世界中的事物。栈是一种常见的数据结构，我们会经常遇到它。就像我们的煎饼一样，我们按顺序不断添加数据（图 5-4）。\n\n![描述：包含截图、文本、设计的图片，自动生成](img/05fig04.jpg)\n\
  \n**图 5-4** *数据按顺序添加到栈中*\n\n我们按照添加的顺序从栈的末尾移除数据（图 5-5）。\n\n![描述：包含截图、文本、设计的图片，自动生成](img/05fig05.jpg)\n\
  \n**图 5-5** *数据按添加顺序从栈的末尾移除*\n\n用计算机术语来说，这被称为“后进先出”系统——通常缩写为 `LIFO`。你最终访问（即移除）的数据是最后添加的那个。关于栈，这就是你需要了解的全部内容，至少在概念上是这样。\n\
  \n### JavaScript 实现\n\n现在我们已经了解了栈是什么以及它们如何工作，让我们再深入一层。下面是用 JavaScript 实现的一个 `Stack`：\n\
  \n```\nclass Stack {\n  constructor(...items) {\n    this.items = items;\n  }\n\
  \  clear() {\n    this.items.length = 0;\n  }\n  clone() {\n    return new Stack(...this.items);\n\
  \  }\n  contains(item) {\n    return this.items.includes(item);\n  }\n  peek() {\n\
  \    let itemsLength = this.items.length;\n    let item = this.items[itemsLength\
  \ - 1];\n\n    return item;\n  }\n  pop() {\n    let removedItem = this.items.pop();\n\
  \    return removedItem;\n  }\n  push(item) {\n    this.items.push(item);\n    return\
  \ item;\n  }\n}\n```\n\n这段代码定义了我们的 `Stack` 对象以及我们可以用来添加、移除、查看最后一个元素等的各种方法。要使用它，我们可以执行如下操作：\n\
  \n```\nlet myStack = new Stack();\n\n// 添加元素\nmyStack.push(\"One\");\nmyStack.push(\"\
  Two\");\nmyStack.push(\"Three!\");\n\n// 预览最后一个元素\nmyStack.peek(); // Three\n\n\
  // 移除元素\nlet lastItem = myStack.pop();\nconsole.log(lastItem) // Three\n\nmyStack.peek();\
  \ // Two\n\n// 创建栈的副本\nlet newStack = myStack.clone();\n\n// 检查元素是否在栈中\nnewStack.contains(\"\
  Three\")  // false\n```\n\n首先我们需要创建一个新的 `Stack` 对象。我们可以创建一个空栈（如上所示），或者预先填充一些元素，如下所示：\n\
  \n```\nlet stuffStack = new Stack(\"One\", \"Two\", \"Three\");\n```\n\n要向栈中添加元素，使用\
  \ `push` 方法并传入你想要添加的内容。要移除元素，使用 `pop` 方法。如果你想预览最后一个元素而不移除它，`peek` 方法可以帮到你。`clone`\
  \ 方法返回栈的副本，`contains` 方法允许你检查某个元素是否存在于栈中。\n\n栈数据结构在本书后续章节中遇到的其他数据结构和算法中会经常用到。我们可以每次复制/粘贴这段代码，或者通过\
  \ [`www.kirupa.com/js/stack_v1.js`](http://www.kirupa.com/js/stack_v1.js) 引用相同的实现。\n\
  \n### 栈：时间与空间复杂度\n\n栈的运行时和内存性能相当不错。对于最常见的操作（例如我们在实现中支持的那些），下表总结了我们的链表表现如何：\n\n![图片](img/05tab00.jpg)\n\
  \n栈可以用数组或链表来实现，但这两种实现方式在性能上的差异很小。让我们更深入地探讨一下为什么我们的栈性能数据是这样的。\n\n#### 运行时性能\n\n•\
  \ **Push 操作：** 向栈顶添加元素（push 操作）的时间复杂度为常数 O(1)。无论栈有多大，push 操作所需的时间总是相同的。\n\n• **Pop\
  \ 操作：** 从栈顶移除元素（pop 操作）的时间复杂度也是常数 O(1)。与 push 操作类似，它不依赖于栈的大小。\n\n• **Peek 操作：**\
  \ 查看栈顶元素（peek 操作）同样是常数时间操作 O(1)。\n\n• **Search/Contains 操作：** 在栈中搜索元素（例如检查元素是否存在于栈中）需要线性时间\
  \ O(*n*)。在最坏情况下，该操作需要遍历整个栈及其所有元素。\n\n#### 内存性能\n\nJavaScript 中栈的内存性能相当高效，增长为 O(*n*)，并且无论栈是使用数组还是链表实现，这一点都不会改变。正如我们之前所见，JavaScript\
  \ 中的数组是动态大小的，因此它们可以随着元素的添加或移除而增长或收缩。然而，这种动态调整大小可能会导致偶尔的内存重新分配，从而引发一些性能波动。\n\n当使用链表实现栈时，内存分配是增量进行的。不会出现像数组那样的大规模重新分配，因此在处理大型栈时，链表方法有其优势。\n\
  \n### 结论\n\n如果你看一下代码，我们的栈实现只是对 `Array` 对象的一个包装（关于 JavaScript 中数组的更多信息，请访问 [`https://bit.ly/kirupaArrays`](https://bit.ly/kirupaArrays)）。由于元素是从末尾添加和移除的，因此使用数组的\
  \ `push` 和 `pop` 方法无需任何额外修改。从数组末尾添加和移除元素的性能非常好——如果你留意的话，是常数时间，即 O(1)。\n\n一些额外资源：\n\
