  ### 2. 归并排序：算法细节\n### 3. 查看代码\n### 4. 结论\n\n## 26. 作者简介\n\n## 1. 数据结构简介\n\n编程的核心就是获取数据并以各种有趣的方式对其进行操作。根据我们所做的事情，数据需要以一种便于实际使用的形式来表示。这种形式就是我们常说的**数据结构**。稍后我们将看到，数据结构为我们处理的数据提供了高度的组织和支撑。这使得操作数据更加容易且（通常）更高效。在接下来的章节中，我们将了解这是如何实现的！\n\
  \n继续前进！\n\n### 合适的工具用于合适的工作\n\n为了更好地理解数据结构的重要性，让我们看一个例子。场景如下：我们有一堆工具和相关的小物件（图 1-1）。\n\
  \n![描述：一张包含截图、圆形、时钟、仪表盘的图片，自动生成的描述](img/01fig01.jpg)\n\n**图 1-1** *工具，工具，还是工具*\n\
  \n我们要做的是存储这些工具，以便日后轻松取用。一种解决方案是简单地将所有工具扔进一个大纸箱里，然后收工（图 1-2）。\n\n![描述：一张包含截图、设计的图片，自动生成的描述](img/01fig02.jpg)\n\
  \n**图 1-2** *工具，遇见纸箱！*\n\n如果我们想找某个特定的工具，可以在箱子里翻找。如果我们要找的工具恰好埋在箱子底部，那也没关系。只要翻找足够久（图\
  \ 1-3）——可能再摇晃箱子几次——我们最终会找到的。\n\n![描述：一只浣熊带着对话气泡，中等置信度自动生成的描述](img/01fig03.jpg)\n\
  \n**图 1-3** *一个翻找者！*\n\n现在，我们可以采用另一种方法。与其把东西扔进箱子，不如把它们存放在一个便于整理的地方。我们可以把所有工具存放在一个工具箱里（图\
  \ 1-4）。\n\n![描述：一张包含截图的图片，自动生成的描述](img/01fig04.jpg)\n\n**图 1-4** *我们的隐喻工具箱*\n\n\
  工具箱通常有许多隔层，帮助我们整理工具。虽然最初存放物品需要多花一点功夫，但这种整理使得日后取用工具更加容易。我们不再需要像毛茸茸的蒙面强盗一样在一堆东西里翻找，而是可以直接去存放所需工具的合适口袋或隔层。\n\
  \n我们刚刚看到了解决工具存储问题的两种方法。如果要对这两种方法进行总结，结果如下：\n\n![图片](img/sq.jpg) **将工具存放在纸箱中**\n\n\
  ![图片](img/sq.jpg) 添加物品非常快。我们只需扔进去就行。生活很美好。\n\n![图片](img/sq.jpg) 查找物品很慢。如果我们要找的东西恰好在顶部，可以轻松拿到。如果恰好在底部，我们得翻遍几乎所有物品。\n\
  \n![图片](img/sq.jpg) 移除物品也很慢。它面临与查找物品相同的挑战。顶部的物品可以轻松移除。底部的物品可能需要额外摇晃和整理才能安全取出。\n\n\
  ![图片](img/sq.jpg) **将工具存放在工具箱中**\n\n![图片](img/sq.jpg) 向工具箱添加物品较慢。不同工具对应不同隔层，因此需要确保正确的工具放入正确的位置。\n\
  \n![图片](img/sq.jpg) 查找物品很快。我们前往合适的隔层，从中取出工具。\n\n![图片](img/sq.jpg) 移除物品也很快。由于工具被整齐地放置在合适的位置，我们可以毫不费力地取出它们。\n\
  \n我们可以看到，纸箱和工具箱各有其适用和不适用的情况。没有放之四海而皆准的正确答案。如果我们只关心存放工具而不再查看它们，那么把工具塞进纸箱是正确的选择。如果我们经常需要取用工具，那么将工具存放在工具箱中更为合适。\n\
  \n### 回到数据结构\n\n在编程和计算机领域，决定使用哪种数据结构类似于决定将工具存放在纸箱还是工具箱中。我们遇到的每一种数据结构都有其适用和不适用的情况（图\
  \ 1-5）。\n\n![描述：一张包含图形设计、截图、图形、文字的图片，自动生成的描述](img/01fig05.jpg)\n\n**图 1-5** *在这种情况下很合适*\n\
  \n了解使用哪种数据结构以及何时使用，是成为一名高效开发者的重要组成部分。我们需要深入熟悉的数据结构包括：\n\n![图片](img/sq.jpg) 数组\n\n\
  ![图片](img/sq.jpg) 链表\n\n![图片](img/sq.jpg) 栈\n\n![图片](img/sq.jpg) 队列\n\n![图片](img/sq.jpg)\
  \ 树简介\n\n![图片](img/sq.jpg) 二叉树\n\n![图片](img/sq.jpg) 二叉搜索树\n\n![图片](img/sq.jpg) 堆数据结构\n\
  \n![图片](img/sq.jpg) 哈希表（又称哈希映射或字典）\n\n![图片](img/sq.jpg) 字典树（又称前缀树）\n\n### 结论\n\n\
  在接下来的许多章节中，我们将进一步了解每种数据结构擅长什么，更重要的是，不擅长哪些类型的操作。到结束时，你和我将建立起一个心理地图，将正确的数据结构与我们要解决的正确编程场景联系起来。\n\
