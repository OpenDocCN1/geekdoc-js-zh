  \n![图片](img/sq1.jpg) 错误/已知问题： [`https://bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\
  \n![图片](img/sq1.jpg) 源代码仓库： [`https://bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\
  \n## 6. 队列\n\n在第 5 章中，我们看到栈是一种后进先出（LIFO）的数据结构，元素从末尾添加和移除。与之相对，我们有另一种流行的数据结构——`queue`（队列）。这是一个有趣的结构，我们将在接下来的章节中进一步了解它。\n\
  \n开始吧！\n\n### 认识队列\n\n顾名思义，队列非常类似于排队等候某物（图 6-1）。\n\n![描述：包含截图、文本、色彩、图形的图片，自动生成](img/06fig01.jpg)\n\
  \n**图 6-1** *人们排队*\n\n排在队伍最前面的人是最先到达的，也是最先离开的。新来的人站在队伍的末尾，他们只有等前面的人到达队伍开头并离开后，才能离开（图\
  \ 6-2）。\n\n\n\n\n\n![描述：自动生成的包含截图、图形、色彩丰富度、艺术的图片](img/06fig02.jpg)\n\n**图 6-2**\
  \ *人们从队列开头离开，并在末尾加入。*\n\n基于这种行为，队列遵循**先进先出**原则，通常简称为 **FIFO**。除了关于哪些元素先被移除这一重要细节外，队列和栈在其他方面非常相似。\n\
  \n添加元素时，栈的行为与队列相同（图 6-3）。\n\n![描述：自动生成的包含截图、文本、设计的图片](img/06fig03.jpg)\n\n**图 6-3**\
  \ *元素被添加到顶部。*\n\n元素被添加到队列的末尾。移除元素时，它们按顺序被移除，从队列结构中第一个进入的数据元素开始（图 6-4）。\n\n![描述：自动生成的包含文本、截图、设计的图片](img/06fig04.jpg)\n\
  \n**图 6-4** *元素从底部被移除。*\n\n现在，你可能会好奇什么时候会用到队列。除了帮助你理解排队之外，队列在数字世界中有很多实际用途。几乎任何需要维护某种顺序的场景都依赖于类似队列的数据结构。高流量场景，如旅行预订、等待购买热门演唱会门票、电子邮件服务器对邮件进行优先级排序等，都是使用队列的情况。你还会看到各种搜索算法大量使用队列，所以队列会一直存在！请与它们友好相处。\n\
  \n### JavaScript 实现\n\n为了将所有这些文字和图像转化为可工作的代码，请看下面的 `Queue` 实现：\n\n```\nclass Queue\
  \ {\n  constructor() {\n    this.items = new LinkedList();\n  }\n  clear() {\n \
  \   this.items = new LinkedList();\n  }\n  contains(item) {\n    return this.items.contains(item);\n\
  \  }\n  peek() {\n    return this.items.head.data;\n  }\n  dequeue() {\n    let\
  \ removedItem = this.items.head.data;\n\n    this.items.removeFirst();\n    return\
  \ removedItem;\n  }\n  enqueue(item) {\n    this.items.addLast(item);\n  }\n  get\
  \ length() {\n    return this.items.length;\n  }\n}\n```\n\n我们的实现依赖于链表，以使某些数据操作更快（而不是仅仅使用数组），因此我们需要通过复制粘贴添加完整的\
  \ `LinkedList` 类，或者从 [`www.kirupa.com/js/linkedlist_v1.js`](https://www.kirupa.com/js/linkedlist_v1.js)\
  \ 引用它。\n\n使用队列的方式是创建一个 `Queue` 对象，使用 `enqueue` 方法向队列添加元素，使用 `dequeue` 方法从队列移除元素：\n\
  \n```\n// 创建新的 Queue 对象\nlet myQ = new Queue();\n\n// 添加两个元素\nmyQ.enqueue(\"Item\
  \ 1\");\nmyQ.enqueue(\"Item 2\");\n\n// 移除元素\nlet removedItem = my.dequeue();  //\
  \ 返回 Item 1\n```\n\n我们可以通过 `clone` 方法轻松创建队列的副本，使用 `contains` 检查元素是否存在，以及使用……嗯……`peek`\
  \ 来查看可能被移除的元素（而不实际移除它）！该实现与栈的实现非常相似，但重要的细节是我们同时使用了链表及其实现。\n\n### 队列：时间与空间复杂度\n\n\
  对于最常见的队列操作，下表总结了我们的队列在各种常见操作中的性能表现：\n\n![图片](img/06tab00.jpg)\n\n这些性能数据的一个关键细节在于我们使用链表作为底层数据结构。如果我们使用数组之类的结构，涉及修改列表前端的操作将花费\
  \ O(`n`) 时间，而链表则为 O(1) 时间。我们可不想这样！让我们更深入地探讨一下为什么队列的性能数据是这样的。\n\n#### 运行时性能\n\n-\
  \ **入队（插入）：** 基于链表的队列的入队操作具有常数时间复杂度 O(1)，因为元素被添加到链表的尾部，无需移动或调整现有元素。\n- **出队（删除）：**\
  \ 基于链表的队列的出队操作同样具有常数时间复杂度 O(1)。元素从链表头部被移除，与入队操作一样，无需移动元素。\n- **查看队首：** 查看队首操作允许我们访问前端元素而不移除它，也是\
  \ O(1) 操作。它直接从链表头部获取值。\n- **搜索：** 在基于链表的队列中搜索元素比插入或删除操作效率低。搜索操作需要从链表前端遍历到后端，导致线性时间复杂度\
  \ O(`n`)，其中 `n` 是队列中的元素数量。\n\n#### 内存性能\n\n队列的整体内存使用量为 O(`n`)，其中队列中的每个元素由一个节点表示，该节点包含数据以及指向下一个节点的指针/引用。因此，所需空间随队列中元素数量线性增长。话虽如此，还有一些额外的细节需要注意：\n\
  \n- **动态内存分配：** 链表是动态分配的，这意味着随着元素添加到队列，会为每个节点分配内存。这使得队列能够动态调整大小，并有效处理不同数量的元素。\n\
  - **内存开销：** 链表需要额外内存来维护节点之间的指针。我们已经知道这一点！与基于数组的实现相比，这种开销在处理大量小元素时可能是一个劣势。\n- **缓存性能：**\
  \ 链表可能会遇到缓存性能问题，因为元素不存储在连续的内存位置。这可能导致更多的缓存未命中，影响某些操作的整体性能。\n\n还不错，对吧？使用链表实现的队列提供了高效的插入和删除操作，时间复杂度为常数\
  \ O(1)。在队列中搜索元素较慢，时间复杂度为线性 O(`n`)。在内存方面，情况相当一致，随着队列存储的元素数量线性增长 O(`n`)。\n\n### 结论\n\
  \n结合我们之前看到的栈和刚刚看到的队列，我们涵盖了两种最流行的数据结构，它们模拟了数据进入和离开的方式。队列被称为 FIFO 数据结构，元素添加到末尾，但从开头移除。这个“从开头移除”的部分正是我们依赖链表数据结构的原因。正如我们多次看到的，数组在移除或添加前端元素时效率不高。\n\
  \n一些额外资源：\n\n![图片](img/sq1.jpg) 提问： [`forum.kirupa.com`](https://forum.kirupa.com)\n\
  \n![图片](img/sq1.jpg) 错误/已知问题： [`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\
  \n![图片](img/sq1.jpg) 源代码仓库： [`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\
  \n## 7. 树\n\n当我们环顾四周时，我们处理的大量数据都是层次化的，父子关系清晰。常见的例子包括家谱、组织结构图、流程图等。图 7-1 是一个由 xkcd\
  \ 推广的著名例子（[`xkcd.com/518/`](https://xkcd.com/518/)）。\n\n![描述：自动生成的流程图图表，置信度较低](img/07fig01.jpg)\n\
  \n**图 7-1** *很好地可视化了我们编程生活的古怪之处！*\n\n\n\n\n虽然我们*确实*可以使用数组或链表等线性数据结构来表示层次数据，就像*确实*可以用盘子和叉子喝汤一样，但这并非最优选择。有更好的方法。其中之一就是**树**数据结构。\n\
  \n在接下来的章节中，我们将深入学习树的相关知识，为将来深入探讨流行的树相关主题打下良好基础。\n\n开始吧！\n\n### 树入门\n\n回顾一下，树数据结构是一种以层次方式组织数据的方法。就像自然界中的树一样，计算机世界中的树也有多种形状和大小。为了便于理解，让我们想象一棵如图\
  \ 7-2 所示的树。\n\n![描述：包含圆形、截图、色彩、卡通自动生成的图片](img/07fig02.jpg)\n\n**图 7-2** *树的示例*\n\
  \n我们看到许多圆圈和连接每个圆圈的线。树中的每个圆圈称为一个**节点**。节点在树中扮演重要角色。它负责存储数据，也负责链接到其他节点。节点之间的链接（可视化为线）称为**边**（图\
  \ 7-3）。\n\n![描述：包含圆形、截图、图形自动生成的图片](img/07fig03.jpg)\n\n**图 7-3** *边连接节点*\n\n仅仅说我们的树由边连接的一堆节点组成，这并不太有启发性。为了更清晰地理解树，我们给节点添加额外的标签，例如**子节点、父节点、兄弟节点、根节点**和**叶子节点**。\n\
  \n最容易分类的节点是子节点。子节点有很多，因为子节点是另一个节点的直接延伸。除了最顶端的第一个节点外，我们在图 7-4 中看到的所有节点都符合这个描述，被认为是子节点。\n\
  \n![描述：游戏截图，自动生成，中等置信度](img/07fig04.jpg)\n\n**图 7-4** *子节点*\n\n有了子节点，我们也就有了父节点。父节点是任何拥有子节点的节点（图\
  \ 7-5）。\n\n![描述：计算机截图，自动生成，中等置信度](img/07fig05.jpg)\n\n**图 7-5** *父节点*\n\n需要指出的是，*父节点*或*子节点*的含义是相对的，取决于我们观察树的哪一部分。一个节点可以同时是子节点、父节点、祖父节点、孙节点等（图\
  \ 7-6）。\n\n![描述：包含圆形、截图、色彩、光线自动生成的图片](img/07fig06.jpg)\n\n**图 7-6** *节点可以具有多种家庭角色。*\n\
  \n不过，通常我们不会将节点称为超出*子节点*或*父节点*的范围。添加额外的家庭层次会增加复杂性，尤其是因为我们有不同方式来指定节点在层次结构中的确切层级。\n\
  \n话虽如此，还有一种我们经常遇到的家庭关系，那就是*兄弟节点*，即同一父节点的所有子节点（图 7-7）。\n\n![描述：包含截图、圆形、色彩、设计自动生成的图片](img/07fig07.jpg)\n\
  \n**图 7-7** *兄弟节点*\n\n我们快讲完了。之前我们说过，除了最顶端没有父节点的第一个节点外，所有节点都是子节点。这个节点在朋友、家人和计算机科学家们中更常被称为*根节点*（图\
  \ 7-8）。\n\n![描述：包含圆形、艺术、光线、星星自动生成的图片](img/07fig08.jpg)\n\n**图 7-8** *万能的根节点*\n\n\
  根节点是没有父节点的节点，而另一端则是没有任何子节点的节点，这些节点通常称为*叶子节点*（图 7-9）。\n\n![描述：手机截图，自动生成，中等置信度](img/07fig09.jpg)\n\
  \n**图 7-9** *叶子节点*\n\n好了。至此，我们介绍了树的基本属性以及根据观察角度不同给每个节点赋予的多种名称。还有一些树属性和节点分组有特殊名称，我们将在后面遇到时再介绍。\n\
  \n### 高度和深度\n\n当我们观察树中的每个节点时，**高度**和**深度**是用来描述节点在树中相对位置的小细节。如果我们要定义两者：\n\n![图片](img/sq.jpg)\
  \ 节点的高度是从当前节点向下到达最远叶子节点所需经过的最大边数。\n\n![图片](img/sq.jpg) 节点的深度是从当前节点向上到达根节点所需经过的边数。\n\
  \n这些定义并不容易完全理解。理解这一切最简单的方法是拿我们的示例树，看看每个节点的高度和深度是多少。请仔细看图 7-10。\n\n![描述：包含文本、截图、圆形、字体自动生成的图片](img/07fig10.jpg)\n\
  \n**图 7-10** *树的高度和深度解释*\n\n需要注意：高度的值是*相对于每个节点*的，完全取决于最远叶子节点的距离。深度的值是*全局的*，与树的形状无关。树的根节点深度为\
  \ 0，下一层子节点深度为 1，依此类推。\n\n### 结论\n\n好了，热爱叶子的朋友们，我们终于结束了这次对树数据结构的奇妙深入探索。虽然一开始思考数据如何适应这种树形结构可能有些令人生畏，但我们将在后续章节中进一步深入，确保我们都成为拥抱树的专家！所以，下次当你感到有点困惑时，记得用一杯好咖啡款待自己，戴上思考帽，然后分支出去……好了，我现在要*叶子*了。\n\
  \n一些额外资源：\n\n![图片](img/sq1.jpg) 提问：[`forum.kirupa.com`](https://forum.kirupa.com)\n\
