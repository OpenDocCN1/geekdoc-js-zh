  \n## 16. 汉诺塔\n\n在谜题方面，没有人比发明了我们即将学习的**汉诺塔**的僧侣们做得更好。除了是一个非常酷的谜题之外，它在我们学习递归时还具有很多实际（和历史！）意义。\n\
  \n开始吧！\n\n### 汉诺塔的玩法\n\n在我们进入编程方面之前，首先让我们很好地理解僧侣们试图做什么。这个谜题的目标非常简单。你有一系列圆盘和三个柱子（图\
  \ 16-1）。\n\n![Description: A screenshot of a video game Description automatically\
  \ generated with medium confidence](img/16fig01.jpg)\n\n**图 16-1** *谜题的起始状态*\n\n\
  开始时，所有圆盘都堆叠在一起，并位于第一个柱子上。结束时，圆盘堆被移动到最后一个柱子上（图 16-2）。\n\n![Description: A screen\
  \ shot of a game Description automatically generated with low confidence](img/16fig02.jpg)\n\
  \n**图 16-2** *谜题的结束状态*\n\n这看起来很简单，但有几个条件使得事情变得令人沮丧地复杂：\n\n![Images](img/sq.jpg)\
  \ 一次只能移动一个圆盘。\n\n![Images](img/sq.jpg) 每次移动时，你从任意一堆的顶部取下一个圆盘，并将其放在另一个柱子上。\n\n![Images](img/sq.jpg)\
  \ 你只能将较小的圆盘放在较大的圆盘上面。\n\n![Images](img/sq.jpg) 当所有起始圆盘以相同的起始顺序排列在目标柱子上时，即获得胜利。你可以使用除起始柱子之外的任何柱子作为目标。我们将使用柱子\
  \ 3。\n\n这些条件可能不太容易理解。为了解决这个问题，让我们通过几个示例来了解在这种条件下如何玩一个典型的游戏。\n\n### 单个圆盘的情况\n\n玩这个游戏最简单的方法是使用单个圆盘（图\
  \ 16-3）。\n\n![Description: A picture containing screenshot, line, design Description\
  \ automatically generated](img/16fig03.jpg)\n\n**图 16-3** *从单个圆盘开始*\n\n开始时我们有一个圆盘。因为没有其他圆盘需要担心，我们只需一步就能获胜（图\
  \ 16-4）。\n\n![Description: A picture containing screenshot, design, illustration\
  \ Description automatically generated](img/16fig04.jpg)\n\n**图 16-4** *我们只需一步就能获胜。*\n\
  \n\n\n\n我们可以直接将单个圆盘移动到目标位置，无需任何额外操作。只有一个圆盘时，这个谜题毫无挑战性。要了解真正的情况，我们需要更多的圆盘。\n\n###\
  \ 现在是两个圆盘\n\n这次，我们从两个圆盘开始（图 16-5）。\n\n![描述：一张包含截图、图表、图形、线条的图片，自动生成](img/16fig05.jpg)\n\
  \n**图 16-5** *我们现在从两个圆盘开始。*\n\n我们的目标仍然相同。我们希望将这些圆盘移动到目标位置——第三座塔，同时保持相同的堆叠顺序，*并且*确保在每一步移动中，较小的圆盘始终放在较大的圆盘之上。\n\
  \n我们需要做的第一件事是为较大的圆盘清除通往目标的路径。我们首先将最上面的圆盘移动到临时的第二座塔（图 16-6）。\n\n![描述：一张包含截图、图表、图形、平面设计的图片，自动生成](img/16fig06.jpg)\n\
  \n**图 16-6** *进行我们的谜题*\n\n完成这一步后，较大的圆盘就有了直达目标的路径。下一步，我们将该圆盘移动到塔 3（图 16-7）。\n\n![描述：一张包含截图、图表、图形、平面设计的图片，自动生成](img/16fig07.jpg)\n\
  \n**图 16-7** *我们的较大圆盘到达目标位置。*\n\n最后一步，将较小的圆盘也从临时塔移动到目标位置（图 16-8）。\n\n![描述：一张视频游戏截图，自动生成，中等置信度](img/16fig08.jpg)\n\
  \n**图 16-8** *游戏结束。*\n\n至此，我们成功地将所有圆盘从起点移动到了目标位置，同时遵守了各项条件。现在，通过两个圆盘，我们稍微更清楚地看到了这个谜题的挑战所在。为了了解汉诺塔的挑战性有多大，我们再详细看一个例子。我们将再增加一个圆盘！\n\
  \n### 三个圆盘\n\n好了。有了三个圆盘，训练轮就卸下了，我们真正看到了启发这个谜题的僧侣们所面临的挑战。我们从所有圆盘都在起点开始（图 16-9）。\n\
  \n![描述：一张包含图表、截图、设计、插图的图片，自动生成](img/16fig09.jpg)\n\n**图 16-9** *用三个圆盘重复谜题*\n\n我们首先将最大的圆盘移动到目标位置。为此，我们必须先将最小的圆盘移开（图\
  \ 16-10）。\n\n![描述：一张视频游戏截图，自动生成，低置信度](img/16fig10.jpg)\n\n**图 16-10** *将最上面的物品移动到末端*\n\
  \n等等，为什么我们的最小圆盘在目标位置而不是临时塔？这有一个技术原因。现在，我们只需说明：如果开始时**圆盘数量为偶数**，那么最小圆盘会先移动到临时塔。如果开始时**圆盘数量为奇数**，那么最小圆盘会先移动到目标塔。\n\
  \n接下来，将第二个圆盘移动到临时塔的空位上（图 16-11）。\n\n![描述：一张包含截图、图表、图形、平面设计的图片，自动生成](img/16fig11.jpg)\n\
  \n**图 16-11** *我们的中间圆盘移动到中间塔。*\n\n这样，第三个也是最大的圆盘就几乎可以移动到目标塔了。目前最小的圆盘挡在路上，但我们可以将它移动到临时塔（图\
  \ 16-12）。\n\n![描述：一张包含截图、图表、图形、平面设计的图片，自动生成](img/16fig12.jpg)\n\n**图 16-12** *为最大的圆盘清除路径*\n\
  \n清空路径后，我们将第三个圆盘移动到目标位置（图 16-13）。\n\n![描述：一张包含截图、图表、图形、平面设计的图片，自动生成](img/16fig13.jpg)\n\
  \n**图 16-13** *我们的最大圆盘到达目标位置。*\n\n此时，只剩下两个圆盘需要移动。它们都在临时塔中。我们现在要做的与之前开始做的并无不同。我们需要将最大的圆盘移动到目标塔。这次，那个圆盘是第二个，因为第三个圆盘已经安全地待在目标塔了。你可能开始看到一种模式出现了。\n\
  \n为了推进，让我们将最上面的（也是第一个……最小的！）圆盘从临时塔移动到起始塔（图 16-14）。\n\n![描述：一张包含截图、图表、图形、线条的图片，自动生成](img/16fig14.jpg)\n\
  \n**图 16-14** *每个圆盘现在都在自己的塔中。*\n\n接下来，将第二个圆盘移动到目标塔（图 16-15）。\n\n![描述：一张包含截图、图表、图形、设计的图片，自动生成](img/16fig15.jpg)\n\
  \n**图 16-15** *谜题接近尾声*\n\n剩下的步骤很简单。我们的第一个圆盘正在起始塔耐心等待。让我们将它移动到目标位置（图 16-16）。\n\n\
  ![描述：一张包含截图、图表、设计的图片，自动生成](img/16fig16.jpg)\n\n**图 16-16** *所有圆盘都已移动完毕！*\n\n现在，我们已经完成了将三个圆盘从起始塔移动到目标塔。对于更多的圆盘，我们可以重复所有这些步骤，但至此我们已经看到了这个谜题所有值得注意的有趣细节。现在，让我们更正式地审视这个谜题的所有内容，并找出如何让计算机解决它。\n\
  \n### 算法\n\n作为人类，大声说出并直观地解决问题对我们来说完全可行。但我们的计算机远没有那么进化。对于它们，我们需要用它们能理解的方式简化我们的解决方案。我们可以通过重新表述我们已知的解决这个问题的方法来做到这一点：\n\
  \n![图片](img/sq.jpg) 目标是将最大的、最底部的圆盘移动到目标塔。\n\n![图片](img/sq.jpg) 我们通过将所有圆盘（除了最大的）从起始塔移动到临时塔来实现这一点。\n\
  \n![图片](img/sq.jpg) 完成这一步后，我们将最大的圆盘移动到目标塔。\n\n![图片](img/sq.jpg) 然后，我们将所有圆盘（除了新的最大的）从临时塔移动到目标塔。\n\
  \n更正式地表述，如下所示：\n\n1. 将顶部 N-1 个圆盘从起始塔移动到临时塔。\n\n2. 将最底部（即第 N 个）圆盘从起始塔移动到目标塔。\n\n\
  3. 将剩余的 N-1 个圆盘从临时塔移动到目标塔。\n\n还有一个细微但重要的细节需要指出。在解决这个谜题的过程中，我们的塔所扮演的角色是动态变化的。虽然我们给塔起了严格的名称，如*起始塔*、*临时塔*和*目标塔*，但这些名称实际上只是为了帮助我们理解发生了什么。在移动圆盘的过程中，每个塔都会扮演临时位置、目标位置或起始位置的*临时*角色。例如，假设有一个圆盘从临时塔移动到目标塔（图\
  \ 16-17）。\n\n![描述：一张包含截图、图表、线条、色彩的图片，自动生成](img/16fig17.jpg)\n\n**图 16-17** *算法说明*\n\
  \n\n\n\n在这种情况下，仅针对这一步，我们的起始塔实际上就是临时塔。目标塔保持不变，但你可以想象，在某些中间步骤中，目标塔可能会变成我们的起始塔。正是这种塔角色的流动性，让我们在脑海中理解这个谜题变得困难！但也正是这种流动性，使得用代码解决它变得容易得多。\n\
  \n### 代码解决方案\n\n如果我们必须按照之前概述的三个正式步骤来解决，那么一个解决方案如下所示：\n\n```\nvar numberOfDisks =\
  \ 3;\n\nvar hanoi = function(n, a, b, c) {\n  if (n > 0) {\n    hanoi(n - 1, a,\
  \ c, b);\n    console.log(\"Move disk \" + n + \" from \" + a + \" to \" + c + \"\
  !\");\n    hanoi(n - 1, b, a, c);\n  }\n}\nhanoi(numberOfDisks,\"starting\", \"\
  temporary\", \"destination\");\n```\n\n如果你针对三个圆盘运行这段代码，你的控制台将显示为图 16-18。\n\n![描述：计算机屏幕截图，描述自动生成](img/16fig18.jpg)\n\
  \n**图 16-18** *三个圆盘的输出示例*\n\n如果你按照输出显示的路径走，你会看到我们的代码最终是如何解决三个圆盘的谜题的。如果你将`numberOfDisks`的值从\
  \ 3 改为另一个（更大的）数字，你会看到控制台打印出更多内容。如果你绘制控制台中显示的路径，你又会看到解决方案的样子以及每个圆盘到达那里的路径。我们刚刚做的是查看了解决僧侣汉诺塔谜题所需的完整代码。不过，我们还没有完成。让我们花点时间更详细地看看这个解决方案。\n\
  \n### 看看递归性！\n\n如果你快速浏览一下代码，你会发现我们的解决方案是递归的：\n\n```\nvar numberOfDisks = 3;\n\n\
  var hanoi = function(n, a, b, c) {\n  if (n > 0) {\n    hanoi(n - 1, a, c, b);\n\
  \    console.log(\"Move disk \" + n + \" from \" + a + \" to \" + c + \"!\");\n\
  \    hanoi(n - 1, b, a, c);\n  }\n}\nhanoi(numberOfDisks,\"starting\", \"temporary\"\
  , \"destination\");\n```\n\n我们的`hanoi`函数实际上是在解决将 N-1 个圆盘从一个位置移动到另一个位置的子问题。这个函数会一直被调用，直到你处理最后一个圆盘（即`n\
  \ > 0`）。\n\n如果我们必须画出三个圆盘的完整递归调用，它将如下所示：\n\n```\nhanoi(3, starting, temporary, destination)\n\
  \    hanoi(2, starting, destination, temporary)\n        hanoi(1, starting, temporary,\
  \ destination)\n            hanoi(0, starting, destination, temporary)\n       \
  \     // Move disk 1 from starting to destination!\n            hanoi(0, temporary,\
  \ starting, destination)\n\n        // Move disk 2 from starting to temporary!\n\
  \n        hanoi(1, destination, starting, temporary)\n            hanoi(0, destination,\
  \ temporary, starting)\n            // Move disk 1 from destination to temporary!\n\
  \            hanoi(0, starting, destination, temporary)\n\n    // Move disk 3 from\
  \ starting to destination!\n\n    hanoi(2, temporary, starting, destination)\n \
  \       hanoi(1, temporary, destination, starting)\n            hanoi(0, temporary,\
  \ starting, destination)\n            // Move disk 1 from temporary to starting!\n\
  \            hanoi(0, destination, temporary, starting)\n\n        // Move disk\
  \ 2 from temporary to destination!\n\n        hanoi(1, starting, temporary, destination)\n\
  \            hanoi(0, starting, destination, temporary)\n            // Move disk\
  \ 1 from starting to destination!\n            hanoi(0, temporary, starting, destination)\n\
  ```\n\n我知道这看起来不太美观，但请花点时间跟随一下发生了什么。特别注意我们是如何通过在起始塔、临时塔和目标塔之间跳转来交换圆盘最终位置的值的。所有这些的最终结果仍然相同：我们的圆盘从起点移动到终点，而没有违反那些烦人的规则。\n\
  \n### 数学时间\n\n根据传说，僧侣们移动的不是几个圆盘。他们移动了 64 个，并且每移动一次需要一秒钟。我猜那些僧侣相当强壮。现在，让我们算算，一队现代（且有点书呆子气）的僧侣移动所有\
  \ 64 个圆盘需要多少步。要弄清楚这一点，我们必须加入一些数学计算。\n\n对于一个圆盘，完成谜题所需的步数是 1。对于两个圆盘，步数是 3。对于三个圆盘，步数是\
  \ 7。对于零个圆盘，答案当然是 0。如果你用四个圆盘测试，完成所有圆盘移动所需的步数（也许你可以数一下控制台输出）是 15。\n\n你应该开始看到给定圆盘数量下完成谜题所需步数的模式：\n\
  \n0 个圆盘：0 步\n\n1 个圆盘：1 步\n\n2 个圆盘：3 步\n\n3 个圆盘：7 步\n\n4 个圆盘：15 步\n\n要找出任意数量圆盘的步数，经过几次猜测实验后，公式将是`2n\
  \ - 1`。如果你不喜欢通过寻找输出中的模式来得出公式，我们可以在分析中更详细地讨论。\n\n从我们的代码（以及我们的规则）中，我们知道有三个不同的步骤：\n\
  \n1. 将顶部的`N-1`个圆盘从起始塔移动到临时塔。\n2. 将最底部的（即第`N`个）圆盘从起始塔移动到目标塔。\n3. 将剩余的`N-1`个圆盘从临时塔移动到目标塔。\n\
  \n步骤 1 和 3 各需要`T[n-1]`步。步骤 2 只需要 1 步。我们可以将其表述为：\n\n`T[n] = 2T[n-1] + 1`\n\n这是解决谜题所需的总步数，其中`n`代表圆盘数量。对于`T[0]`，我们知道步数是\
  \ 0。对于`T[1]`，我们知道步数是 1。将其扩展到我们的公式，我们可以做如下操作：\n\n```\nT[0] = 0\nT[1] = 2T[0] + 1\
  \ = 2(0) + 1 = 1\nT[2] = 2T[1] + 1 = 2(1) + 1 = 3\nT[3] = 2T[2] + 1 = 2(3) + 1 =\
  \ 7\n```\n\n这似乎没问题，那么让我们证明这种形式映射到之前得出的`T[n] = 2^n - 1`方程。假设这个公式对`n - 1`成立。这意味着我们的方程可以重写为`T[n-1]\
  \ = 2^(n-1) - 1`。\n\n让我们将其与我们之前看到的内容结合起来：\n\n```\nT[n] = 2T[n-1] + 1\nT[n] = 2(2^(n-1)\
  \ - 1) + 1\nT[n] = 2(2^(n-1)) - 2 + 1\nT[n] = 2(2^(n-1)) - 2 + 1\nT[n] = 2^(n-1+1)\
  \ - 1\nT[n] = 2^n - 1\n```\n\n这证明了我们之前得出的答案对所有`n`（其中`n`大于等于 1）都成立。这是一种不太严谨的归纳证明形式，没有做到滴水不漏，所以如果你被要求正式证明它，请不要将其用作证明。\n\
  \n### 结论\n\n你知道僧侣们最初为什么要移动 64 个圆盘吗？他们相信，一旦最后一个圆盘被放到正确的位置，世界就会终结。如果这是真的，我们还有多长时间？使用我们已有的步数公式，并且根据传说每次移动需要一秒钟，我们的僧侣们需要多长时间才能完成谜题？对他们来说不幸的是，使用`264\
  \ - 1`公式，他们所需的时间大约为 5850 亿年。不过这对我们来说是好事！要了解更多关于这个谜题的历史以及实际将其介绍给所有人的法国数学家爱德华·卢卡斯的信息，请访问[`en.wikipedia.org/wiki/Tower_of_Hanoi`](https://en.wikipedia.org/wiki/Tower_of_Hanoi)。\n\
  \n一些额外资源：\n\n![图片](img/sq1.jpg) 提问：[`forum.kirupa.com`](https://forum.kirupa.com)\n\
