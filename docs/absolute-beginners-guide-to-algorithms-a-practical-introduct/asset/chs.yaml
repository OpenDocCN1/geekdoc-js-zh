  \n## 17. 搜索算法与线性搜索\n\n\n\n\n在现实世界中，当我们谈论搜索或查找时，我们是在试图找到某样东西。我们可能在一堆衣服里找袜子、在干草堆里找针、找与刀配套的叉子、找沃尔多（可能还有他的狗伙伴伍夫）、找车钥匙、找太阳系中的某颗恒星，或者找其他无数种东西（图\
  \ 17-1）。\n\n![Description: A dog looking at a telescope Description automatically\
  \ generated with medium confidence](img/17fig01.jpg)\n\n**图 17-1** *也许它们是真的！*\n\n\
  在我们算法化的数字世界中，当我们谈论**搜索**或**查找**时，我们仍然是在试图找到某样东西。关键区别在于，我们要找的东西存在于一个数据集合中，比如数组、列表或树。根据我们要找什么以及数据集合的样子，我们会采用多种方法来高效地找到东西。这些*多种方法*有一个更正式的名称：**搜索算法**。\n\
  \n我们将一起研究一些非常流行的搜索算法，每种算法都有其独特的特色。在本章中，我们从最易于理解的搜索算法之一——**线性搜索**（有时也称为**顺序搜索**）开始我们的旅程。\n\
  \n出发！\n\n### 线性搜索\n\n在搜索算法中，线性搜索很容易解释。它的工作原理是遍历数据集合中的每一项，并检查当前项是否与你要找的项匹配。这种搜索会一直进行，直到我们找到该项，或者到达集合末尾仍未找到。让我们看一个例子。\n\
  \n#### 线性搜索实战\n\n这是我们的设置。我们有一个存储在数组中的项目集合（图 17-2）。\n\n![Description: A screenshot\
  \ of a game Description automatically generated with medium confidence](img/17fig02.jpg)\n\
  \n**图 17-2** *我们的初始数据*\n\n我们要做的是找到值为 3 的项（图 17-3）。\n\n![Description: A screenshot\
  \ of a number Description automatically generated with low confidence](img/17fig03.jpg)\n\
  \n**图 17-3** *我们要找的是 3。*\n\n使用线性搜索，我们从第一个项（即数组索引位置 0）开始，问自己一个问题：**这个位置的值是否与我要找的值相同？**\
  \ 在我们的例子中，我们检查第一个项 5 是否等于 3——显然不是（图 17-4）。\n\n![Description: A screenshot of a computer\
  \ Description automatically generated with low confidence](img/17fig04.jpg)\n\n\
  **图 17-4** *让我们从开头开始搜索。*\n\n因为没有匹配，我们移动到数组中的下一个项并重复相同的过程。我们问：**这个位置的值是否与我们要找的值相同？**\
  \ 我们知道第二个项的值是 8，8 也不等于 3（图 17-5）。\n\n![Description: A screenshot of a computer Description\
  \ automatically generated with low confidence](img/17fig05.jpg)\n\n**图 17-5** *我们继续向下遍历列表。*\n\
  \n这种模式不断重复。我们继续遍历数组中的每一项，直到最终到达存储值 3 的项（图 17-6）。\n\n![Description: A screenshot\
  \ of a number Description automatically generated with low confidence](img/17fig06.jpg)\n\
  \n**图 17-6** *我们找到了结果。*\n\n此时，我们找到了匹配。我们找到了要找的东西，它位于数组索引位置 6。\n\n如果我们的数组从未包含我们要找的项，那么我们会检查数组中的每一项，并在到达最后一项时返回相当于“未找到”的结果。\n\
  \n#### JavaScript 实现\n\n如果我们将所有的文字和图表转换成代码，以下是线性搜索算法的一种实现方式：\n\n```\nfunction linear_search(collection,\
  \ item) {\n  for (let i = 0; i < collection.length; i++) {\n    if (collection[i]\
  \ === item) {\n      // 返回找到项的索引位置\n      return i;\n    }\n  }\n  // 未找到项\n  return\
  \ -1;\n}\n```\n\n我们有一个名为 `linear_search` 的函数，它接受两个参数。第一个参数是我们的数组，第二个参数是我们正在寻找的项。如果找到了我们要找的项，代码会返回该找到项的索引位置：\n\
  \n```\nlet data = [5, 8, 6, 9, 1, 7, 3, 2, 4];\n\nlet result = linear_search(data,\
  \ 3);\nconsole.log(result) // 6\n```\n\n如果没有找到我们要找的项，代码会返回 `-1`：\n\n```\nlet data\
  \ = [5, 8, 6, 9, 1, 7, 3, 2, 4];\n\nlet result = linear_search(data, \"koala\");\n\
  console.log(result) // -1\n```\n\n`-1` 是 JavaScript 和其他编程语言中表示找不到某物的常见约定。如果你更喜欢，当然也可以将其改为诸如字符串“Not\
  \ found”之类的值。\n\n#### 运行时特性\n\n我们的线性搜索算法运行时间为 O(*n*) 线性时间。最佳情况是我们要找的项恰好是数据集合中的第一项。在这种情况下，我们可以在到达第一项后立即停止。最坏情况发生在以下两种情况之一：\n\
  \n![Images](img/sq.jpg) 我们要找的项恰好位于数据集合中的最后一个位置。\n\n![Images](img/sq.jpg) 我们要找的项根本不存在于数据集合中。\n\
  \n在这两种情况下，我们都必须检查数组中的每一项直到末尾。所需的操作次数与集合中的项数直接相关。这里没有捷径。如果我们有很多项，线性搜索将从开头开始，逐个遍历每一项以找到我们要找的东西。\n\
  \n> **注意**\n\n##### 全局线性搜索\n\n有一种线性搜索算法的变体值得我们注意，那就是**全局线性搜索**。在普通线性搜索中，一旦找到匹配项，我们就停止所有操作并返回找到项的位置。如果集合中其他地方还有另一个匹配项，我们永远不会找到它，因为我们在找到第一个匹配项后就停止了搜索。\n\
  \n而在全局线性搜索中，会返回数据集合中*所有匹配的项*。这意味着我们返回的不是单个位置值。不，我们返回的是一个位置值数组，其中包含每个匹配项的位置。全局线性搜索的代码如下：\n\
  \n```\nfunction global_linear_search(collection, item) {\n  let foundPositions =\
  \ [];\n\n  for (let i = 0; i < collection.length; i++) {\n    if (collection[i]\
  \ === item) {\n      // 存储找到项的位置\n      foundPositions.push(i);\n    }\n  }\n\n\
  \  if (foundPositions.length > 0) {\n    return foundPositions;\n  } else {\n  \
  \  // 未找到任何项\n    return -1;\n  }\n}\n```\n\n使用 `global_linear_search` 函数的方式与之前的\
  \ `linear_search` 函数相同：\n\n```\nlet data = [5, 8, 3, 9, 1, 7, 3, 2, 4, 3, 6];\n\n\
  let result = global_linear_search(data, 3);\nconsole.log(result) // [2, 6, 9];\n\
  ```\n\n主要区别在于，当找到项时，我们的结果是一个索引位置数组，而不是作为数字返回的单个索引位置。\n\n### 结论\n\n\n\n\n线性搜索算法是一种简单直接的方法，用于在数据集合中查找某个项目。由于我们需要遍历集合中的每个项目，线性搜索并不被认为是一种快速的算法。对于大型数据集来说，它的效率相当低下。但这并不意味着它永远没有实际用途。当我们的数据集较小、数据未排序，或者我们要查找的项目位于集合开头附近时，线性搜索就很有用。\n\
  \n一些额外资源：\n\n![图片](img/sq1.jpg) 提问：[`forum.kirupa.com`](https://forum.kirupa.com)\n\
  \n![图片](img/sq1.jpg) 错误/已知问题：[`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\
  \n![图片](img/sq1.jpg) 源代码仓库：[`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\
  \n## 18. 使用二分查找实现更快的搜索\n\n在第 17 章中，我们学习了线性搜索，这是一种简单的算法，通过扫描集合中的每个项目直到找到目标。虽然简单是好事，但线性方法速度较慢。项目越多，查找所需的时间就越长。它的运行时间是\
  \ O(*n*)。有一种更快的搜索方法，那就是本章的主角：**二分查找**。\n\n在接下来的章节中，我们将全面了解二分查找，包括它的实现方式、性能特点以及更多内容。\n\
  \n开始吧！\n\n### 二分查找的实际应用\n\n二分查找的起点与许多优秀的搜索算法相同：从一个项目集合开始（图 18-1）。\n\n![描述：一张视频游戏截图，置信度较低](img/18fig01.jpg)\n\
  \n**图 18-1** *我们的项目集合*\n\n在这个集合中，我们要找到数字 60 并返回其索引位置。接下来的步骤将展示如何使用二分查找来实现这一目标。\n\
  \n#### 仅限已排序的项目\n\n在迈出第一步之前，有一个重要的前提条件需要满足。我们的项目集合必须已经排序，所以让我们先完成这一步（图 18-2）。\n\n\
  ![描述：一张包含文本、卡通、截图、狗的图片，自动生成描述](img/18fig02.jpg)\n\n**图 18-2** *一个已排序的项目列表*\n\n稍后，我们将探讨如何将未排序的集合正确排序的各种方法。现在，我们保持简单，确保输入二分查找算法的项目已经排序。\n\
  \n#### 处理中间元素\n\n在完成这些准备工作后，我们要做的第一件事是找到整个集合的**中间元素**，并检查它的值是否是我们正在寻找的目标。对于我们的集合，中间元素是\
  \ 32（图 18-3）。\n\n![描述：一张游戏截图，置信度中等](img/18fig03.jpg)\n\n**图 18-3** *找到中间元素*\n\n\
  我们是如何得到 32 的？当项目数量为偶数时，这一点尤其令人困惑，就像本例中的情况。让我们简要讨论一下。\n\n当处理*奇数*个元素的集合时，我们可以清楚地选择一个中间元素（图\
  \ 18-4）。\n\n![描述：一张包含文本、截图、字体、时钟的图片，自动生成描述](img/18fig04.jpg)\n\n**图 18-4** *当项目数量为奇数时，中间元素很容易找到。*\n\
  \n如图所示，我们有五个元素。第三个元素就是中间元素。\n\n对于*偶数*个元素的数组，我们需要使用一个小技巧。中间元素将是理想中点的*左侧*那个元素。这可以如图\
  \ 18-5 所示。\n\n![描述：一张包含文本、截图、时钟、数字时钟的图片，自动生成描述](img/18fig05.jpg)\n\n**图 18-5** *对于偶数个元素，保持在中点左侧。*\n\
  \n我们必须这样做，因为当有六个元素时（如本例），没有明确的中间元素。要么左侧偏重，要么右侧偏重。这是无法避免的，因此普遍共识是，在需要打破平局时，我们倾向于偏向集合的左侧。当我们将这个技巧应用到我们更大的偶数个项目的例子中时，我们可以看到我们是如何选择数字\
  \ 32 的（图 18-6）。\n\n![描述：一张包含文本、截图、字体、线条的图片，自动生成描述](img/18fig06.jpg)\n\n**图 18-6**\
  \ *对于偶数个项目，中间元素位于中点的左侧。*\n\n稍后，我们将用一种更正式的方法来找到中间元素，将我们模糊的解释转化为更具体的内容。现在，这样就可以了！\n\
  \n好的，我们刚才说到哪了？对了！我们需要检查中间元素是否包含我们正在寻找的目标值 60。我们可以看出 32 不等于 60。接下来要做的就是二分查找著名的分割操作。\n\
  \n#### 分割制胜！\n\n由于中间元素与目标值不匹配，下一步是确定继续搜索的方向。我们将手指放在中间元素上，并在脑海中将列表*分成左半部分和右半部分*（图\
  \ 18-7）。\n\n![描述：一张游戏截图，置信度中等](img/18fig07.jpg)\n\n**图 18-7** *为分割操作做准备*\n\n在下一步中，我们问自己：我们要查找的值（60）是大于还是小于当前中间元素的值（32）：\n\
  \n![图片](img/sq.jpg) 如果我们要查找的值大于中间元素的值，那么目标值一定在右半部分。\n\n![图片](img/sq.jpg) 如果我们要查找的值小于中间元素的值，那么目标值一定在左半部分。\n\
  \n在我们的例子中，60 大于 32，这意味着我们需要继续在右半部分进行搜索（图 18-8）。\n\n![描述：一张游戏截图，置信度中等](img/18fig08.jpg)\n\
  \n**图 18-8** *查看右半部分*\n\n此时，我们只关心集合右半部分的内容。我们可以安全地忽略所有其他项目。具体来说，这意味着我们之前的中间点及其左侧的所有项目在后续搜索中不再相关（图\
  \ 18-9）。\n\n![描述：一张电脑截图，置信度较低](img/18fig09.jpg)\n\n**图 18-9** *我们忽略左半部分。*\n\n只考虑集合的右半部分后，我们重复之前的步骤。找到中间元素，检查中间元素的值是否与目标值匹配，如果不匹配，则进行分割并决定是继续深入剩余的左半部分还是右半部分。\n\
  \n如果我们将这些步骤应用于右半部分，首先要做的就是找到中间元素（图 18-10）。\n\n![描述：一张电脑截图，置信度较低](img/18fig10.jpg)\n\
  \n**图 18-10** *我们在数组的右半部分寻找中间元素。*\n\n中间元素的值是 71，它不是我们要找的 60。接下来，我们检查 71 是大于还是小于我们的目标值\
  \ 60。由于 71 大于 60，这意味着我们要关注的集合半部分是左半部分（图 18-11）。\n\n\n\n\n\n![描述：计算机屏幕截图，自动生成，置信度低](img/18fig11.jpg)\n\
  \n**图 18-11** *让我们重复步骤。*\n\n当我们查看左半部分时，只有两个元素。无论有多少元素，我们都必须逐步遵循二分查找算法。我们必须反复执行已经做过几次的操作。中间元素的值将是\
  \ 40（图 18-12）。\n\n![描述：游戏截图，自动生成，置信度低](img/18fig12.jpg)\n\n**图 18-12** *我们继续处理更小的数字区域。*\n\
  \n40 不等于 60。由于当前中间点值 40 小于 60，我们关注右半部分（图 18-13）。\n\n![描述：包含文本、截图、字体、线条的图片，自动生成](img/18fig13.jpg)\n\
  \n**图 18-13** *我们快结束了。*\n\n此时只剩下一个元素，这个元素也将是下一步的中间元素（图 18-14）。\n\n![描述：游戏截图，自动生成，置信度低](img/18fig14.jpg)\n\
  \n**图 18-14** *我们找到了答案！*\n\n中间元素的值将是 60。当我们问自己中间元素值 60 是否就是我们要找的值时，答案是响亮的“是”。这正是我们一直在寻找的，我们将返回\
  \ 60 所在位置的索引。\n\n### JavaScript 实现\n\n如果我们把上一节中所有的文字和图示简化成二分查找的工作原理，可以归结为以下步骤：\n\
  \n1. 查看已排序集合中的中间值。\n   a. 如果中间值就是我们要找的目标值，停止搜索并返回其索引位置。\n   b. 如果中间值大于目标值，忽略集合的右半部分，在左半部分重复步骤\
  \ 1。\n   c. 如果中间值小于目标值，忽略集合的左半部分，在右半部分重复步骤 1。\n2. 重复步骤 1 到 4，直到找到目标数字或确定它不在集合中。\n\
  \n剩下的就是将这些步骤转化为代码。\n\n#### 迭代方法\n\n高效的迭代方法如下：\n\n```\n// Iterative Approach\nfunction\
  \ binarySearch(arr, val) {\n  let start = 0;\n  let end = arr.length - 1;\n\n  while\
  \ (start <= right) {\n    let middleIndex = Math.floor((start + end) / 2);\n\n \
  \   if (arr[middleIndex] === val) {\n      return middleIndex;\n    } else if (arr[middleIndex]\
  \ < val) {\n      start = middleIndex + 1;\n    } else {\n      end = middleIndex\
  \ - 1;\n    }\n  }\n\n  return -1;\n}\n```\n\n出于我们在第 15 章中看到的原因，这种方法不会膨胀函数调用栈。我们将大部分繁重的工作局限在循环本身。\n\
  \n#### 递归方法\n\n为完整起见，这里也提供一种效率较低的递归方法：\n\n```\n// Recursive Approach\nfunction binarySearch(arr,\
  \ val, start = 0, end = arr.length - 1) {\n  const middleIndex = Math.floor((start\
  \ + end) / 2);\n\n  if (val === arr[middleIndex]) {\n    return middleIndex;\n \
  \ }\n\n  if (start >= end) {\n    return -1;\n  }\n\n  if (val < arr[middleIndex])\
  \ {\n    binarySearch(arr, val, start, middleIndex - 1);\n  } else {\n    binarySearch(arr,\
  \ val, middleIndex + 1, end);\n  }\n}\n```\n\n使用这种方法，当我们要进行分割时，会递归调用 `binarySearch`。调用\
  \ `binarySearch` 的次数以及调用栈的膨胀程度直接取决于我们需要搜索的深度。这正是迭代方法效率高的原因。\n\n#### 代码运行示例\n\n使用\
  \ `binarySearch` 函数的方式是传入两个参数：\n\n![图片](img/sq.jpg) 我们预先排序的数组\n\n![图片](img/sq.jpg)\
  \ 我们要查找的目标值\n\n以下是如何调用 `binarySearch` 的示例：\n\n```\nlet numbers = [1, 3, 5, 10, 32,\
  \ 40, 60, 71, 80, 99];\n\nlet foundIndex = binarySearch(numbers, 60);\nconsole.log(foundIndex)\
  \ // 6\n```\n\n在我们的示例中，`numbers` 数组就是本章大部分时间在分解的同一个集合，因此应该看起来很熟悉。`binarySearch`\
  \ 函数返回的值是找到元素的索引位置，如果未找到则返回 `-1`。在我们的例子中，60 存在且位于索引位置 6。此外，除了我们简要讨论过的运行时行为外，迭代和递归二分查找实现返回的值是相同的。\n\
  \n##### 查找中间元素\n\n之前，我们讨论了一种非常粗略的查找中间元素的方法。关于完整内容，[www.kirupa.com/javascript/finding_middle_element_array.htm](http://www.kirupa.com/javascript/finding_middle_element_array.htm)\
  \ 上的文章对此进行了详细讨论。我们简要总结那篇文章，并阐明我们的代码如何查找中间元素，尤其是在数组子集的情况下。\n\n计算中间元素索引位置的表达式如下：\n\
  \n```\nlet middleIndex = Math.floor((left + right) / 2);\n```\n\n我们取起始和结束索引位置的平均值，然后向下取整（通过\
  \ `Math.floor`）以确保结果始终为整数。如果要用图示表示，图 18-15 展示了如何计算之前演练中某个中间步骤的高亮区域的中间点。\n\n![描述：计算机屏幕截图，自动生成，置信度低](img/18fig15.jpg)\n\
  \n**图 18-15** *聚焦于一个区域*\n\n`left` 和 `right` 的值对应数组中的索引位置 **5** 和 **9**，因此代入这些值并计算中间点后，之前的表达式将如图\
  \ 18-16 所示。\n\n![描述：计算机屏幕截图，自动生成，置信度低](img/18fig16.jpg)\n\n**图 18-16** *查找中间元素*\n\
  \n该区域的中间索引位置是 7，对应的值是 71。一个有趣的点是，即使我们只检查集合的一个子集，索引位置仍然是相对于整个集合的。\n\n### 运行时性能\n\n\
  我们一开始就讨论了二分查找的速度有多快，尤其是与较慢的线性查找相比。二分查找的运行时间复杂度为 O(log `n`)，它之所以能做到这一点，是因为它遵循**分而弃之**的方法。正如我们在演练中看到的，在逐步逼近目标值的每个阶段，二分查找算法都会忽略剩余元素的一半。\n\
  \n如果泛泛地讨论，假设我们从包含 `n` 个元素的已排序集合开始（图 18-17）。\n\n![描述：游戏截图，自动生成，置信度低](img/18fig17.jpg)\n\
  \n**图 18-17** *我们的数组有 `n` 个元素。*\n\n第一步，我们处理全部 `n` 个元素。下一步，我们处理 `n`/2 个元素（图 18-18）。\n\
  \n![描述：包含截图、矩形、线条、色彩的图片，自动生成](img/18fig18.jpg)\n\n**图 18-18** *处理 `n`/2 个元素*\n\n\
  假设我们从未找到目标值（或者目标值是最后一个元素），这种模式将持续下去，每一步都会丢弃上一步中另一半的元素（图 18-19）。\n\n\n\n\n\n![描述：低置信度自动生成的进度条截图](img/18fig19.jpg)\n\
  \n**图 18-19** *我们不断缩小问题空间。*\n\n我们一直进行，直到最后一步，此时只剩下一个元素。这里存在一种模式。通过观察每一步中涉及的元素数量，我们可以看到这种模式（图\
  \ 18-20）。\n\n![描述：低置信度自动生成的游戏截图](img/18fig20.jpg)\n\n**图 18-20** *每一步的元素数量*\n\n\
  如果二分查找中的每一步*划分*用 *k* 表示，那么总步数可以用 *n*/2*k 表示。这一切如何得出二分查找运行时间为 log(*n*) 的结论？经过 k 次迭代后，当我们到达集合中的最后一个元素时，剩余的元素数量……嗯，只有\
  \ 1。这意味着我们可以像图 18-21 所示那样求解 k。\n\n![描述：低置信度自动生成的黑色背景屏幕截图](img/18fig21.jpg)\n\n**图\
  \ 18-21** *如何求解 k 并得到运行时间*\n\n在二分查找的上下文中，这样理解：如果有 *n* 个元素，在最坏情况下，我们需要运行算法的各个阶段 log(*n*)\
  \ 次才能到达终点！\n\n### 结论\n\n我们刚刚涵盖了很多内容。我们学习了二分查找的工作原理、如何在代码中使用它、它的运行时行为是什么样的，以及更多内容。二分查找之所以有趣，是因为其核心方法——将问题空间划分为更小的部分——是一种常见的模式，我们将在后续反复看到，尤其是在那些自称为分治法的算法中。我们很快就会讲到这些算法，但现在你可以放松一下。这是你应得的！\n\
  \n一些额外资源：\n\n![图片](img/sq1.jpg) 提问： [`forum.kirupa.com`](https://forum.kirupa.com)\n\
  \n![图片](img/sq1.jpg) 错误/已知问题： [`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\
  \n![图片](img/sq1.jpg) 源代码仓库： [`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\
  \n## 19. 二叉树遍历\n\n对于像数组或链表这样的线性数据结构，遍历所有元素相当直接。我们从开头开始，一直移动到下一个元素，直到到达末尾，没有更多元素为止（图\
  \ 19-1）。\n\n![描述：中等置信度自动生成的游戏截图](img/19fig01.jpg)\n\n**图 19-1** *处理线性数据结构很愉快*\n\n\
  这种简单易行的方法不适用于树（图 19-2）。\n\n![描述：中等置信度自动生成的游戏截图](img/19fig02.jpg)\n\n**图 19-2** *处理像树这样的非线性数据结构可能会很有压力。*\n\
  \n树是层次化数据结构，因此遍历它们的方式必须不同。我们可以使用两种遍历方法。一种是**广度优先**，另一种是**深度优先**。在接下来的章节中，我们将更广泛和更深入地（哈！）探讨这一切的含义。\n\
  \n前进！\n\n### 广度优先遍历\n\n回顾我们第一次看树时的一个细节，我们的树有一个**深度**或**层级**，表示它们离根有多远（图 19-3）。\n\
  \n![描述：自动生成的包含截图、圆形、图表、天文学的图片](img/19fig03.jpg)\n\n**图 19-3** *树的层级*\n\n第 0 层（或深度\
  \ 0）始终是根。从那里开始的所有子节点将根据它们离根的距离位于各自的层级上。\n\n在广度优先方法中，这些层级在我们遍历树时起着重要作用。我们*逐层*遍历树，从根节点开始，在进入下一层之前访问当前层的所有节点。\n\
  \n通过一个例子，这个过程会更清晰。所以，我们从根节点 A 开始（图 19-4）。\n\n![描述：自动生成的包含截图、图形、徽标、字体的图片](img/19fig04.jpg)\n\
  \n**图 19-4** *我们的根节点*\n\n此时，我们对树知之甚少，也不知道它长什么样。我们只知道有一个根节点，所以我们探索它。我们发现根节点有两个子节点\
  \ B 和 C（图 19-5）。\n\n![描述：中等置信度自动生成的带有白色字母的红色圆形](img/19fig05.jpg)\n\n**图 19-5** *探索我们的根节点*\n\
  \n这里有一个微妙但重要的细节：**发现不等于探索。** 当我们发现节点时，我们知道它们存在。当我们探索它们时，我们主动检查它们并查看它们是否有子节点。在接下来的图中，当一个节点刚被发现时，它用虚线轮廓显示。一旦节点被探索过，它就用实线轮廓显示。\n\
  \n从我们发现的节点 B 和 C 开始，我们先探索 B。它有两个子节点（图 19-6）。\n\n![描述：自动生成的包含圆形、时钟、截图、艺术的图片](img/19fig06.jpg)\n\
  \n**图 19-6** *我们继续探索。*\n\n我们暂时忽略这些新发现的子节点。相反，我们继续探索 C，发现它也有两个子节点（图 19-7）。\n\n![描述：自动生成的包含圆形、时尚配饰、艺术的图片](img/19fig07.jpg)\n\
  \n**图 19-7** *接下来我们探索 C。*\n\n我们完成了由 B 和 C 节点组成的当前行，现在对下一行节点重复该过程。我们从左侧的 D 节点开始，探索它是否有子节点。D\
  \ 节点确实有两个子节点（图 19-8）。\n\n![描述：低置信度自动生成的图表、图表、图表、图表、图表、图表、图表、图表、图表、图表、图表、图表、图表](img/19fig08.jpg)\n\
  \n**图 19-8** *我们首先逐行探索。*\n\n然后我们移动到 E 节点、F 节点和 G 节点，探索它们是否有子节点。它们没有子节点（图 19-9）。\n\
  \n![描述：自动生成的包含圆形、艺术的图片](img/19fig09.jpg)\n\n**图 19-9** *节点 E、F 和 G 没有子节点。*\n\n此时，我们又完成了一行的探索。现在，是时候进入下一行，看看\
  \ H 和 I 节点的情况了。我们发现 H 和 I 都没有子节点。没有更多节点需要发现和探索，因此我们到达了终点，并完全探索了我们的树（图 19-10）。\n\n\
  ![描述：自动生成的包含圆形、艺术的图片](img/19fig10.jpg)\n\n**图 19-10** *我们的树现在已被完全探索。*\n\n我们探索节点的顺序由图\
  \ 19-11 可视化中的数字突出显示。\n\n![描述：自动生成的包含截图、圆形、时钟的图片](img/19fig11.jpg)\n\n**图 19-11**\
  \ *我们探索树的顺序*\n\n我们探索节点的顺序是 A-B-C-D-E-F-G-H-I。广度优先遍历方法有点像以一种非常有组织、有条理的方式探索树。这与我们的下一种遍历方法有很大不同。\n\
  \n\n\n\n\n### 深度优先遍历\n\n另一种流行的树遍历方式是深度优先方法。与广度优先方法逐层探索树不同，在深度优先中，我们会沿着最左侧路径尽可能深地探索，然后回溯并探索另一条路径。\n\
  \n让我们看看具体过程。顶部是我们的根节点（图 19-12）。\n\n![描述：一张包含截图、图形、圆形、标志的图片。自动生成的描述](img/19fig12.jpg)\n\
  \n**图 19-12** *再次从根节点开始*\n\n我们探索它，看看它有多少个子节点，发现它有两个子节点：B 和 C（图 19-13）。\n\n![描述：一个带有白色字母的红色圆形。自动生成的描述，置信度中等](img/19fig13.jpg)\n\
  \n**图 19-13** *我们发现两个子节点*\n\n接下来，我们探索 B 节点，看看它是否有子节点。结果发现它有两个子节点（图 19-14）。\n\n![描述：一张包含圆形、时钟、截图、艺术的图片。自动生成的描述](img/19fig14.jpg)\n\
  \n**图 19-14** *我们继续探索*\n\n到目前为止，我们所看到的与之前广度优先方法的前几步一致。现在，情况开始不同了。接下来我们不探索 C 节点，而是深入探索\
  \ B 的子节点，从最左侧的第一个节点开始。那就是 D 节点，所以我们接下来探索它（图 19-15）。\n\n![描述：一张包含圆形、艺术的图片。自动生成的描述](img/19fig15.jpg)\n\
  \n**图 19-15** *我们先深入探索*\n\nD 的子节点是 H 和 I，但（根据深度优先规则）我们接下来探索 H，因为它是最左侧的第一个子节点（图 19-16）。\n\
  \n![描述：一张包含圆形、艺术的图片。自动生成的描述](img/19fig16.jpg)\n\n**图 19-16** *我们完全探索了左分支*\n\nH 没有子节点，于是我们回溯到最近的未探索节点。如图\
  \ 19-17 所示，那就是 I 节点。\n\n![描述：一张包含圆形、时钟、艺术的图片。自动生成的描述](img/19fig17.jpg)\n\n**图 19-17**\
  \ *回溯*\n\nI 节点也没有子节点，所以我们进一步回溯到下一个有未探索子节点的位置：E 节点（图 19-18）。\n\n![描述：一张包含圆形、艺术的图片。自动生成的描述](img/19fig18.jpg)\n\
  \n**图 19-18** *继续回溯到下一个有未探索子节点的节点*\n\n结果发现 E 没有子节点，于是我们继续前往下一个最近的、有未探索子节点的目的地。那就是靠近顶部的\
  \ C 节点。当我们探索 C 节点时，发现它有两个子节点：F 和 G（图 19-19）。\n\n![描述：一张包含圆形、截图、艺术的图片。自动生成的描述](img/19fig19.jpg)\n\
  \n**图 19-19** *我们几乎完全探索了这棵树*\n\n按照经典的深度优先方式，我们首先探索 F 子节点。它没有子节点。然后我们回溯到下一个最近的未探索节点，即\
  \ G 节点。它也没有子节点，至此我们完成了对树的探索（图 19-20）。\n\n![描述：一张包含圆形、艺术的图片。自动生成的描述](img/19fig20.jpg)\n\
  \n**图 19-20** *我们的树已完全探索*\n\n如果追踪我们的步骤，会发现我们在这里做了很多跳跃。我们探索节点的顺序是 A-B-D-H-I-E-C-F-G。我们可以像图\
  \ 19-21 那样可视化这个顺序。\n\n![描述：一张包含截图、圆形、时钟的图片。自动生成的描述](img/19fig21.jpg)\n\n**图 19-21**\
  \ *使用 DFS 探索树的顺序*\n\n总结我们在深度优先方法中经历的行为，我们探索了：\n\n1. 首先探索根节点\n2. 完全探索左子树\n3. 完全探索右子树\n\
  \n深度优先有几种变体，我们这里看到的三个步骤统称为**前序遍历**。这是一种流行的变体，我们稍后会用它来搜索树，但其他变体还包括**后序遍历**和**中序遍历**。我们将在更后面讨论它们。\n\
  \n### 实现我们的遍历方法\n\n在之前的几节中，我们学习了广度优先和深度优先遍历的工作原理。现在是将所有知识转化为可运行代码的时候了。稍后我们会看到，广度优先和深度优先遍历的代码看起来非常相似。这是有充分理由的！\n\
  \n回顾一下，探索一个节点有两个步骤：\n\n1. **发现节点**。这一步我们只是识别出某个节点存在。\n2. **探索节点**。这一步我们检查该节点，并发现任何需要……嗯……发现的子节点。\n\
  \n我们的两种遍历方法的不同之处在于节点被发现、探索和插入的具体方式。这值得深入探讨，我们接下来就做。\n\n#### 广度优先方法中的节点探索\n\n假设我们有一棵部分探索过的树，如图\
  \ 19-22 所示。\n\n![描述：一张计算机截图。自动生成的描述，置信度低](img/19fig22.jpg)\n\n**图 19-22** *形式化我们的探索过程*\n\
  \n如果我们明确列出已探索和已发现的节点，会发现已探索的节点是 A 和 B。已发现的节点是 C、D 和 E。是时候去探索了！在广度优先方法中，我们接下来要探索的节点将是已发现节点集合中的*第一个*项。那就是\
  \ C 节点，所以我们接下来探索它（图 19-23）。\n\n![描述：一张包含圆形、艺术的图片。自动生成的描述](img/19fig23.jpg)\n\n**图\
  \ 19-23** *按行探索，BFS 风格！*\n\n注意当我们决定探索 C 节点时发生了什么。我们将 C 从*已发现*集合中移除，并将其添加到*已探索*集合的末尾。C\
  \ 节点有两个子节点 F 和 G，所以我们把它们添加到已发现集合的*末尾*，以便后续处理。接下来的过程都遵循这个模式。下一步，我们从已发现集合的开头取出 D 节点，并将其添加到已探索集合的末尾。如果\
  \ D 有子节点被发现，我们就把它们添加到已发现集合的末尾。以此类推。\n\n如果要用一句话概括我们在广度优先遍历方法中所做的一切，那就是：将新发现的节点添加到已发现集合的末尾。接下来要探索的节点则从已发现节点集合的开头取出。**我们刚才描述的行为本质上就是一个队列。**\
  \ 元素从前面移除，从后面添加。\n\n#### 深度优先方法中的节点探索\n\n为了了解深度优先遍历方法中的情况，让我们看另一个部分探索过的树的例子（图 19-24）。\n\
  \n![描述：一张计算机截图。自动生成的描述，置信度低](img/19fig24.jpg)\n\n**图 19-24** *部分探索过的树*\n\n注意已发现节点集合中的顺序。它们并不是从左到右，就像节点在树中视觉上出现的那样。而是相反的。它们是从右到左。这是有原因的。我们接下来要探索的节点取自**已发现节点的末尾**。那就是\
  \ D 节点（图 19-25）。\n\n\n\n\n\n![描述：包含圆形的图片，自动生成的艺术描述](img/19fig25.jpg)\n**图 19-25**\
  \ *使用 DFS 时，我们探索的顺序不同，这反映在我们的总体方法中。*\n\n我们的 D 节点最后进入已探索集合，我们发现它有两个子节点：H 和 I。由于我们从右向左添加子节点，我们先将\
  \ I 节点添加到已发现集合的末尾。接着我们将 H 节点添加到已发现集合的末尾，这结束了遍历的这一步。下一步是继续探索，我们（你猜对了）选择已发现集合中的最后一个项。这个过程不断重复，直到没有更多节点需要发现。\n\
  \n如果要总结深度优先方法的行为，我们会将新发现的节点添加到已发现集合的*末尾*。我们探索的下一个节点也将来自已发现集合的*末尾*。**这就是栈的行为。** 项从后端移除。项也从后端添加。\n\
  \n#### 查看代码\n\n现在我们已经更深入地了解了广度优先和深度优先方法的区别，我们可以开始查看代码了。\n\n##### 构建我们的树\n\n我们首先要构建一个示例树，其节点排列与本章中一直看到的示例完全相同：\n\
  \n```\nclass Node {\n  constructor(data) {\n    this.data = data;\n    this.left\
  \ = null;\n    this.right = null;\n  }\n}\n\nconst rootNodeA = new Node(\"A\");\n\
  const nodeB = new Node(\"B\");\nconst nodeC = new Node(\"C\");\nconst nodeD = new\
  \ Node(\"D\");\nconst nodeE = new Node(\"E\");\nconst nodeF = new Node(\"F\");\n\
  const nodeG = new Node(\"G\");\nconst nodeH = new Node(\"H\");\nconst nodeI = new\
  \ Node(\"I\");\n\nrootNodeA.left = nodeB;\nrootNodeA.right = nodeC;\n\nnodeB.left\
  \ = nodeD;\nnodeB.right = nodeE;\n\nnodeC.left = nodeF;\nnodeC.right = nodeG;\n\n\
  nodeD.left = nodeH;\nnodeD.right = nodeI;\n```\n\n我们在测试广度优先和深度优先遍历实现时，都使用这棵树作为示例。最重要的一点是，树的根节点由变量\
  \ `rootNodeA` 引用。所有子节点都将从那里开始。\n\n##### 广度优先遍历实现\n\n广度优先实现的代码如下：\n\n```\nfunction\
  \ breadthFirstTraversal(root) {\n  if (!root) {\n    return;\n  }\n\n  let explored\
  \ = [];\n\n  // Create a queue and add the root to it\n  const discovered = new\
  \ Queue();\n  observed.enqueue(root);\n\n  while (discovered.length > 0) {\n   \
  \ // Remove (dequeue) the first item from our\n    // queue of observed nodes\n\
  \    const current = discovered.dequeue();\n\n    // Process the current node\n\
  \    explored.push(current);\n\n    // Store all unvisited children of the current\
  \ node\n    if (current.left) {\n      discovered.enqueue(current.left);\n    }\n\
  \n    if (current.right) {\n      discovered.enqueue(current.right);\n    }\n  }\n\
  \n  return explored;\n}\n```\n\n这段代码使用了来自第 6 章的队列实现。你可以从该章复制/粘贴实现，或者通过以下 `script`\
  \ 标签直接引用：\n\n```\n<script src=\"https://www.kirupa.com/js/queue_v1.js\"></script>\n\
  ```\n\n我们可以通过让 `breadthFirstTraversal` 函数对我们刚才创建的树运行来查看其效果：\n\n```\nlet fullTree\
  \ = breadthFirstTraversal(rootNodeA);\nconsole.log(fullTree);\n```\n\n你能猜到当我们检查这段代码的输出时会看到什么吗？它将是我们树的所有节点，按照使用广度优先遍历时探索的顺序列出（图\
  \ 19-26）。\n\n![描述：计算机截图，自动生成的描述](img/19fig26.jpg)\n**图 19-26** *我们的代码输出*\n\n输出将是节点\
  \ A、B、C、D、E、F、G、H 和 I。这与我们之前几节通过视觉和文字演示这个示例时看到的一致。\n\n现在，你可能想知道为什么我们使用队列来处理已观察节点。原因与性能有关。重复我们之前关于广度优先遍历如何工作的内容，在每个阶段，我们**探索并移除已发现节点集合中的第一个项**。移除第一个项对于数组来说是一个昂贵的操作，但对于我们的队列来说是一个快速的操作，因为队列内部基于链表构建。\n\
  \n##### 深度优先遍历实现\n\n深度优先实现的代码如下：\n\n```\nfunction depthFirstTraversal(root) {\n\
  \  if (!root) {\n    return;\n  }\n\n  let explored = [];\n\n  // Create a stack\
  \ and add the root to it\n  const discovered = new Stack();\n  discovered.push(root);\n\
  \n  while (discovered.length > 0) {\n    // Remove the last item from our list of\
  \ observed nodes\n    const current = discovered.pop();\n\n    // Process the current\
  \ node\n    explored.push(current);\n\n    // Store all unvisited children of the\
  \ current\n    // node in reverse order\n    if (current.right) {\n      discovered.push(current.right);\n\
  \    }\n\n    if (current.left) {\n      discovered.push(current.left);\n    }\n\
  \  }\n\n  return explored;\n}\n```\n\n我们的深度优先遍历使用了来自第 5 章的栈实现。你可以从该章复制/粘贴实现，或者通过以下\
  \ `script` 标签直接引用：\n\n```\n<script src=\"https://www.kirupa.com/js/stack_v1.js\"\
  ></script>\n```\n\n为了查看 `depthFirstTraversal` 函数的实际效果，让我们传入我们创建的同一棵树——由 `rootNodeA`\
  \ 表示：\n\n```\nlet fullTreeTwo = depthFirstTraversal(rootNodeA);\nconsole.log(fullTreeTwo);\n\
  ```\n\n运行此示例时，我们在控制台中看到的输出如图 19-27 所示。\n\n![描述：计算机截图，自动生成的描述](img/19fig27.jpg)\n\
  **图 19-27** *我们的 DFS 输出*\n\n这完全符合预期，与我们之前通过树的视觉表示看到的输出一致。\n\n我们的深度优先遍历实现使用栈来处理已发现节点。原因是，正如我们之前看到的，对于深度优先遍历，**我们检查并移除已发现节点集合中的最后一个节点**。从栈中移除最后一个项是一个快速操作，这就是我们使用栈的原因。当然，如果你愿意，也可以使用数组代替栈，但我们的栈实现底层实际上也使用了数组。\n\
  \n### 遍历方法的性能\n\n在我们即将结束对广度优先和深度优先遍历的讨论之际，让我们谈谈运行时间和内存消耗。我们的遍历方法的目标是提供树中每个节点的表示。运行时性能为\
  \ O(*n*)，其中 *n* 是树中节点的总数。内存/空间消耗也是 O(*n*)。通过查看最佳情况、平均情况和最坏情况，我们无法区分太多。结果是一样的。全部都是\
  \ O(*n*)。\n\n### 结论\n\n好了，就这些。我们在使用广度优先和深度优先方法遍历树方面已经涵盖了很多内容。这里还有很多需要介绍，但我们将在后续研究搜索时再讨论这些要点。现在，需要记住的主要事项如下：\n\
  \n1. 使用广度优先遍历时，我们在进入下一层之前访问树中每一层的所有节点。\n2. 使用深度优先遍历时，我们沿着一个分支访问节点，直到到达叶节点，然后回溯访问其他分支。\n\
