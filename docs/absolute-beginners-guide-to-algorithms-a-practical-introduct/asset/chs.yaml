  \n## 21. 快速排序\n\n在排序领域，最流行的算法之一就是**快速排序**。它之所以流行，是因为它很快——真的很快——与同类工作负载的其他算法相比。其速度的关键在于快速排序是一种**分治算法**。之所以这样称呼，是因为它分解任务的方式。快速排序不会像蟒蛇那样一口吞下大块数据并长时间咀嚼，而是将数据分解成较小的部分，然后快速处理每个小部分。\n\
  \n在本章中，我们将更精确地深入理解快速排序的工作原理。到本章结束时，你将能够（最好是在晚餐时）向朋友和家人讲述快速排序的所有酷炫之处。你甚至可能利用这些知识改进你的代码。\n\
  \n开始吧！\n\n### 快速排序的工作原理\n\n快速排序通过将输入分成几个较小的部分来工作。在这些较小的部分上，它通过进一步划分输入和排序剩余部分的组合来施展魔法。一次性解释清楚相当复杂，因此我们先从快速排序的简单概述开始，然后再深入一个更详细、完全可工作的快速排序实现，该实现将你即将看到的所有文字和图表转化为代码。\n\
  \n#### 简单概述\n\n首先，想象一下 图 21-1 中的方格网格代表我们要排序的数字。\n\n![](img/21fig01.jpg)\n\n**图 21-1**\
  \ *未排序的数字列表*\n\n我们想用快速排序对这些数字进行排序，快速排序的做法如下：\n\n1. 选择一个称为*枢轴*的中间值\n2. 根据元素相对于枢轴的大小重新排序：\n\
  \   a. 小于枢轴的元素移到枢轴左侧\n   b. 大于枢轴的元素移到枢轴右侧\n3. 对部分排序的值重复步骤 1 和 2\n\n乍一看，这三个步骤如何帮助我们排序数据可能显得奇怪，但稍后我们将看到这一切是如何联系起来的。\n\
  \n从顶部开始，因为这是第一步，我们要排序的值区域是整个范围。我们首先要做的是选择枢轴，即中间位置的值，如 图 21-2 所示。\n\n![Description:\
  \ A screenshot of a game Description automatically generated](img/21fig02.jpg)\n\
  \n**图 21-2** *选择枢轴*\n\n我们可以从任何位置选择枢轴，但所有高手（出于各种充分理由）都会选择中点作为枢轴。既然我们也想成为高手，那就这么做吧。快速排序使用枢轴值以一种非常粗略和基本的方式对元素进行排序。从快速排序的角度来看，枢轴值左侧的所有元素都应该更小，右侧的所有元素都应该更大，如\
  \ 图 21-3 所示。\n\n![Description: A screenshot of a game Description automatically\
  \ generated](img/21fig03.jpg)\n\n**图 21-3** *查看枢轴划分的两个半区*\n\n这相当于把东西扔到栅栏的另一边，而枢轴值就是栅栏。当我们进行这种重新排列时，图\
  \ 21-4 显示了我们将看到的结果。\n\n![Description: A screenshot of a game Description automatically\
  \ generated](img/21fig04.jpg)\n\n**图 21-4** *小于枢轴的元素和大于枢轴的元素*\n\n这里需要注意几点。首先，枢轴左侧的所有元素都小于枢轴。枢轴右侧的所有元素都大于枢轴。其次，这些元素也没有排序。它们只是相对于枢轴值更小或更大，但并没有按任何有序方式排列。一旦枢轴左右两侧的所有值都正确放置，我们的枢轴值就被视为已排序。我们刚才所做的是确定一个枢轴，并将值重新排列到它的左侧或右侧。最终结果是我们得到了一个已排序的值。还有更多的值需要排序，因此我们在未排序的区域重复刚才的步骤。\n\
  \n此时，我们在初始枢轴值的两侧有了两个数据部分，它们根据是否小于或大于枢轴值进行了部分排序。接下来我们要做的是在这两个未排序的部分上重复选择枢轴和重新排列的过程，如\
  \ 图 21-5 所示。\n\n![Description: A screenshot of a game Description automatically\
  \ generated](img/21fig05.jpg)\n\n**图 21-5** *两个枢轴！*\n\n在每个未排序的部分中，我们首先选择枢轴值。这将是该部分值的中点处的值。选择枢轴后，就该进行一些重新排列了，如\
  \ 图 21-6 所示。\n\n![Description: A screenshot of a game Description automatically\
  \ generated](img/21fig06.jpg)\n\n**图 21-6** *重新排列值*\n\n注意，我们将小于枢轴值的元素移到了左侧。大于枢轴值的元素被扔到了右侧。现在我们又有了一些处于最终排序位置的枢轴值，还有一些未排序的区域需要应用经典的快速排序处理。如果我们加快一点速度，图\
  \ 21-7 展示了每一步最终将如何展开。\n\n![Description: A screenshot of a game Description automatically\
  \ generated](img/21fig07.jpg)\n\n**图 21-7** *排序过程的每一步*\n\n\n\n\n我们不断重复在每个部分进行枢轴选择和排序，直到没有足够的值来选取枢轴并进行划分。一旦达到无法再划分的地步，猜猜怎么着？我们就完成了！最初无序的数据集合现在已从小到大排序完毕，如果我们从左到右读取枢轴项，就会看到如图\
  \ 21-8 所示的结果。\n\n![Description: A screenshot of a cell phone Description automatically\
  \ generated](img/21fig08.jpg)\n\n**图 21-8** *完全排序后的列表*\n\n如果退后一步看，我们在这里所做的是选取一个枢轴，然后根据项是小于还是大于当前枢轴值来围绕它排列项。我们对出现的每个未排序部分重复这个过程，直到没有项需要处理为止。\n\
  \n### 另一个简单示例\n\n在深入代码和相关实现细节之前，让我们再看一个例子，从不同角度解释快速排序的工作原理。与之前处理数字集合不同，这里的主要变化是我们将使用条形高度来表示要排序的值的大小（图\
  \ 21-9）。\n\n![Description: new example](img/21fig09.jpg)\n\n**图 21-9** *另一个示例*\n\
  \n值的大小（或幅度）由条形的高度表示。较高的条形表示较大的值，较矮的条形表示较小的值。让我们运用上一节学到的知识，看看快速排序如何帮助我们对其进行排序。希望这部分内容大多是复习。\n\
  \n一如既往，第一步是选取一个枢轴值，我们选择中间的一个（图 21-10）。\n\n![Description: pivot for example](img/21fig10.jpg)\n\
  \n**图 21-10** *选取枢轴*\n\n选取枢轴后，下一步是将较小的项移到枢轴左侧，较大的项移到右侧（图 21-11）。\n\n![Description:\
  \ ordering around pivot](img/21fig11.jpg)\n\n**图 21-11** *在枢轴划分的两半之间重新排列*\n\n此时，枢轴值被认为已排序并处于正确位置。毕竟，它正好位于所有将出现在其前或后的项中间。下一步是对新排列的项的左半部分进行排序（图\
  \ 21-12）。\n\n![Description: the left side](img/21fig12.jpg)\n\n**图 21-12** *聚焦较小的项*\n\
  \n这是通过对左半部分递归调用快速排序来完成的。之前看到的所有步骤，如选取枢轴和交换值，都会再次发生（图 21-13）。\n\n![Description: arranged\
  \ the items again](img/21fig13.jpg)\n\n**图 21-13** *重复操作*\n\n最终结果是左半部分现在部分有序，并且剩下一个较小的值范围需要排列。让我们跳到第一轮重排后留下的右半部分，去处理它（图\
  \ 21-14）。\n\n![Description: the values to the right](img/21fig14.jpg)\n\n**图 21-14**\
  \ *现在对右侧重复操作*\n\n让我们在输入的这一侧重复枢轴选取和重排步骤（图 21-15）。\n\n![Description: the right side\
  \ is done](img/21fig15.jpg)\n\n**图 21-15** *继续重排项*\n\n至此，我们应该能更清晰地看到模式。为了节省时间（和墨水！），让我们快速完成剩余步骤，使整个输入正确排序（图\
  \ 21-16）。\n\n![Description: fully ordered list](img/21fig16.jpg)\n\n**图 21-16**\
  \ *完全排序我们的条形*\n\n再次强调，各种枢轴选取和重排的最终结果是得到一个完全有序的数字集合。现在让我们看另一个例子……不，开个玩笑！目前例子已经够了。接下来，是时候看看代码实现了。\n\
  \n### 实现时间\n\n所有这些文字和图表只对像你我这样的人有帮助。我们的计算机不知道如何处理这些，因此我们需要将我们所知的一切转换成计算机能理解的形式。在全力投入之前，让我们先看一些伪代码（既不是真正的代码，也不是真正的英语）来折中一下。\n\
  \n快速排序的伪代码如图 21-17 所示。\n\n![Description: pseudocode](img/21fig17.jpg)\n\n**图 21-17**\
  \ *代码的高层概览*\n\n每个彩色区域代表快速排序中的一个重要步骤。不过，这里有一个超级快速的指南，说明每段代码的作用（图 21-18）。\n\n![Description:\
  \ pseudocode with labels](img/21fig18.jpg)\n\n**图 21-18** *代码中的有趣部分*\n\n花点时间思考这段代码如何工作，以及它如何帮助你排序一个未排序的数据列表。将所有这些伪代码转换为真实代码，我们得到以下内容：\n\
  \n```\nfunction quickSortHelper(arrayInput, left, right) {\n  let i = left;\n  let\
  \ j = right;\n  let pivotPoint = arrayInput[Math.round((left + right) * .5)];\n\n\
  \  // 循环\n  while (i <= j) {\n\n    while (arrayInput[i] < pivotPoint) {\n     \
  \ i++;\n    }\n\n    while (arrayInput[j] > pivotPoint) {\n      j--;\n    }\n\n\
  \    if (i <= j) {\n      let tempStore = arrayInput[i];\n\n      arrayInput[i]\
  \ = arrayInput[j];\n      i++;\n\n      arrayInput[j] = tempStore;\n      j--;\n\
  \    }\n\n  }\n\n  // 交换\n  if (left < j) {\n    quickSortHelper(arrayInput, left,\
  \ j);\n  }\n\n  if (i < right) {\n    quickSortHelper(arrayInput, i, right);\n \
  \ }\n\n  return arrayInput;\n}\n\nfunction quickSort(input) {\n    return quickSortHelper(input,\
  \ 0, input.length - 1);\n}\n```\n\n我们在这里看到的代码与之前看到的伪代码基本相同。最大的变化是我们有一个 `quickSortHelper`\
  \ 函数来处理指定数组、`left` 和 `right` 值。这使得对 `quickSort` 函数的调用非常简洁，只需指定数组即可。\n\n以下是使用此代码的示例：\n\
  \n```\nlet myData = [24, 10, 17, 9, 5, 9, 1, 23, 300];\nquickSort(myData);\n\nalert(myData);\n\
  ```\n\n如果一切设置正确（为什么不会呢？!!），你会看到一个显示已排序数字列表的对话框。\n\n### 性能特征\n\n我们已经多次提到快速排序在快速排序数字方面非常出色——因此得名。它是一种分治排序算法，通过反复将数组划分为两个较小的子数组，然后递归地对每个子数组进行排序。快速排序的性能通常是\
  \ O(`n` log `n`)，这是排序算法的最佳可能时间复杂度。目前还没有发明或发现更快的算法。然而，快速排序的最坏情况时间复杂度是 O(`n`²)，当数组已经排序或接近排序时可能发生。\n\
  \n表 21-1 突出了快速排序的性能特征。\n\n**表 21-1** *快速排序的性能特征*\n\n![Images](img/21tab01.jpg)\n\
  \n为了进一步扩展性能特征，以下部分提供了一些额外的讨论点。\n\n#### 时间复杂度\n\n![Images](img/sq.jpg) **最佳情况：**\
  \ 在最佳情况下，选取的枢轴将数组大致分成两个相等的半部分。每次递归调用将数组分成两半，递归深度为 log(`n`) 层，其中 `n` 是输入数组中的元素数量。在每一层递归中，所有\
  \ `n` 个元素都被比较一次。因此，最佳情况时间复杂度为 O(`n` log `n`)。\n\n\n\n\n\n![Images](img/sq.jpg) **平均情况：**\
  \ 快速排序的平均性能也是 O(*n* log *n*)。当枢轴选择是随机的，或者以避免持续不平衡分区的方式进行时，就会出现这种情况。\n\n![Images](img/sq.jpg)\
  \ **最坏情况：** 当选择的枢轴始终是最小或最大元素时，就会发生最坏情况，导致高度不平衡的分区。在这种情况下，递归深度达到最大值，算法表现出较差的性能。最坏情况下的时间复杂度为\
  \ O(*n*²)。\n\n#### 空间复杂度\n\n快速排序通常是一种原地排序算法，意味着它不需要与输入大小成比例的额外内存。空间复杂度为 O(log *n*)，这是由于排序过程中维护调用栈所需的递归栈空间。\n\
  \n#### 稳定性\n\n快速排序不是一种稳定的排序算法，这意味着相等元素的相对顺序在排序后可能不会保持不变。\n\n### 结论\n\n好了，你已经完成了对最快排序算法之一的深入探讨。所有这些知识在现实（非学术）生活中能帮到你吗？我非常怀疑。几乎所有流行的编程语言都有自己内置的排序机制可供使用。许多已经基于快速排序（或其高度优化和特化的版本），因此使用你自己的快速排序版本与使用内置排序方法相比，性能提升为零。\n\
  \n既然如此，我们为什么还要花这么多时间在这上面呢？除了用你新获得的知识来娱乐他人的明显原因外，另一个原因是内置排序机制在某个时候可能会失效。你可能会发现自己需要对一组更复杂的数据进行排序，而这超出了内置排序支持的范围。在那种情况下，你可能需要实现自己的排序算法。你实现的算法可能基于快速排序，也可能完全无关。说到无关，表\
  \ 21-2 比较了各种流行排序算法的性能和内存特性。\n\n**表 21-2** *排序算法及其性能和内存特性*\n\n![Images](img/21tab02.jpg)\n\
  \n有了这些，你可以自由地去用你新获得的知识，非常、非常快速地排序各种东西。\n\n一些额外资源：\n\n![Images](img/sq1.jpg) 提问：\
  \ [`forum.kirupa.com`](https://forum.kirupa.com)\n\n![Images](img/sq1.jpg) 错误/已知问题：\
  \ [`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\n![Images](img/sq1.jpg)\
  \ 源代码仓库： [`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\n## 22.\
  \ 冒泡排序\n\n在排序方面，你能用到的最糟糕的算法之一被亲切地称为**冒泡排序**。它太糟糕了，以至于人们都不再用它来给孩子命名了。尽管它很糟糕，但学习冒泡排序的工作原理对你来说仍然很重要。主要原因是要理解它做了什么，并避免在你的代码中做任何哪怕稍微类似的事情。另一个原因纯粹是为了消遣。你永远不知道哪一天它会不会成为《危险边缘》的最终答案。\n\
  \n开始吧！\n\n### 冒泡排序的工作原理\n\n假设你有一组未排序的数字（图 22-1）。\n\n![Description: unsorted numbers](img/22fig01.jpg)\n\
  \n**图 22-1** *我们未排序的数字列表*\n\n冒泡排序的工作方式有点不起眼，就像那些慢得可怕的排序算法一样。它从开头开始，缓慢地遍历每个数字，直到到达末尾。在每个数字处，它会比较当前数字与紧邻的下一个数字的大小。这可能不太容易理解，所以请看\
  \ 图 22-2 中的示意图。\n\n![Description: adjacent numbers](img/22fig02.jpg)\n\n**图 22-2**\
  \ *比较！*\n\n前两个数字被比较。然后比较接下来的两个数字。再然后比较接下来的两个，依此类推。你明白了吧。它执行的比较是检查第一个数字是否小于第二个数字。如果第一个数字恰好更大，那么第一个和第二个数字就会交换。让我们简要地走一遍这个过程。\n\
  \n在我们的例子中，第一次比较将在 6 和 2 之间进行（图 22-3）。\n\n![Description: comparison of numbers](img/22fig03.jpg)\n\
  \n**图 22-3** *第一次比较*\n\n第一个数字并不小于第二个数字——也就是说，6 不小于 2。在这种情况下，你要做的是交换这两个数字，使得第一个数字总是小于第二个数字（图\
  \ 22-4）。\n\n![Description: numbers swapped](img/22fig04.jpg)\n\n**图 22-4** *对前两个数字进行排序*\n\
  \n耶！你刚刚完成了一步，扮演冒泡排序的人类角色。接下来，你向右移动一个数字，比较你面前的新两个数字（图 22-5）。\n\n![Description: more\
  \ swapping](img/22fig05.jpg)\n\n**图 22-5** *比较接下来的两个数字*\n\n6 不小于 0，所以再次发生交换（图 22-6）。\n\
  \n![Description: it's swappin' time!](img/22fig06.jpg)\n\n**图 22-6** *交换以确保正确顺序*\n\
  \n你重复这个过程：向右滑动一个位置，比较面前的两个数字，如果需要就交换它们，直到没有更多数字为止（图 22-7）。\n\n![Description: numbers\
  \ swapped](img/22fig07.jpg)\n\n**图 22-7** *检查每一对数字的过程*\n\n当你到达最后一个数字时，你回到开头，再次重复整个过程。这是因为，正如你所看到的，你的数字仍然没有完全排序。你一遍又一遍地重复这个极其耗时的过程，直到所有数字都完美排序（图\
  \ 22-8）。\n\n![Description: the sorted numbers](img/22fig08.jpg)\n\n**图 22-8** *数字终于排序完成。*\n\
  \n从冒泡排序的角度来看，当你遍历一遍数字而没有进行任何交换时，你的数字就被认为是完全排序的。换句话说，这意味着你看到的每一对连续数字都正确地从小到大排列。\n\
  \n### 逐步演示\n\n在上一节中，你了解了冒泡排序的一些工作原理。在本节中，让我们通过一个完整的逐步演示来澄清你到目前为止看到的所有内容。为了避免让你感到无聊，我将把我们的例子缩减到只有四个数字（图\
  \ 22-9）。\n\n![Description: trimmed list of numbers](img/22fig09.jpg)\n\n**图 22-9**\
  \ *简化我们的例子*\n\n别担心。因为我们处理的是冒泡排序，这四个数字将确保你需要大量滚动（或翻页或手势）才能到达完全排序的版本。你已经大致（哈！）看到了前几个数字，但为了完整起见，我们将更详细地再走一遍。\n\
  \n冒泡排序对四个数字的第一轮运行如 图 22-10 所示。\n\n![Description: the first run](img/22fig10.jpg)\n\
  \n**图 22-10** *第一轮排序*\n\n现在，我们从头开始，再次进行我们的老一套（图 22-11）。\n\n![Description: second\
  \ round](img/22fig11.jpg)\n\n**图 22-11** *第二轮排序*\n\n\n\n\n此时，如果你查看上一步的结果，我们的数字已经完全排序好了。对我们人类来说，我们会收工休息。但冒泡排序还不知道数字已经排好序了。它需要再遍历一次数字，当没有发生交换时，它才意识到任务完成了（图\
  \ 22-12）。\n\n![描述：最后一次遍历](img/22fig12.jpg)\n\n**图 22-12** *遍历剩余数字*\n\n当没有发生交换时，意味着每个数字都排列正确。这向冒泡排序发出信号，让它别再打扰这些可怜的数字，可以回家了。\n\
  \n### 代码\n\n现在你已经了解了冒泡排序的工作原理，让我们看看它的一个实现：\n\n```\nfunction bubbleSort(input) {\n\
  \  let swapSignal = true;\n\n  while (swapSignal) {\n    swapSignal = false;\n\n\
  \    for (let i = 0; i < input.length - 1; i++) {\n\n      if (input[i] > input[i\
  \ + 1]) {\n\n        let temp = input[i];\n        input[i] = input[i + 1];\n  \
  \      input[i + 1] = temp;\n\n        swapSignal = true;\n      }\n    }\n  }\n\
  }\n\nlet myData = [6, 2, 0, 9, 1, 7, 4, 4, 8, 5, 3];\nbubbleSort(myData);\n\nconsole.log(myData);\n\
  ```\n\n如果你仔细阅读这段代码，你会发现所有内容都与我们之前讨论的对应。主要需要指出的是 `swapSignal` 变量，它用于指示冒泡排序是否在遍历数字时没有交换任何值。除了这一点，其他都是简单的数组和\
  \ `for` 循环的把戏。\n\n### 结论\n\n从刚才的演示中可以看出，冒泡排序的效率并不高。对于排序四个数字，如果将移位和比较视为两个独立操作，大约需要\
  \ 18 步。尽管其中几个数字已经不需要进一步排序。\n\n当你要排序的列表已经是完全有序时，冒泡排序最快。它遍历一次数字，发现没有数字被交换，然后就去当地的迪斯科舞厅，和其他酷孩子们一起……跳迪斯科。如果你要排序的列表是逆序的，冒泡排序耗时最长。每个数字都需要被交换并移动到末尾。我为那些要处理逆序情况的计算机设备感到难过。\n\
  \n在我们收工（并和冒泡排序一起去当地迪斯科舞厅）之前，表 22-1（为方便起见，从第 21 章重复列出）比较了各种流行的排序算法及其性能和内存特性。\n\n\
  **表 22-1** *排序算法及性能与内存特性*\n\n![图片](img/22tab01.jpg)\n\n有了这些，你可以自由地去用你新学到的知识，以非常非常慢的速度对各种东西进行排序。如果你想了解一种让冒泡排序望尘莫及的快速排序算法，你应该和快速排序交朋友。\n\
  \n一些额外资源：\n\n![图片](img/sq1.jpg) 提问： [`forum.kirupa.com`](https://forum.kirupa.com)\n\
  \n![图片](img/sq1.jpg) 错误/已知问题： [`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\
  \n![图片](img/sq1.jpg) 源代码仓库： [`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\
  \n## 23. 插入排序\n\n一种有趣的排序算法是插入排序。你曾经玩过纸牌并需要对手中的牌进行排序吗（图 23-1）？\n\n![](img/23fig01.jpg)\n\
  \n**图 23-1** *排序纸牌……经典的犬类传统！*\n\n你（或你的狗狗朋友）用来将一张牌从手牌的一部分移动到另一部分的方法，与插入排序的工作原理几乎相同。实际上，这比听起来要稍微激动人心一些，所以让我们来看看插入排序是如何工作的。\n\
  \n开始吧！\n\n### 插入排序的工作原理\n\n插入排序的工作方式有点酷。理解它的最好方法是通过一个例子来演练。我们稍后会正式描述算法的行为。在我们的例子中，如图\
  \ 23-2 所示，我们的目标是将这些条形（也就是我们的值）从最短到最高排序。\n\n![](img/23fig02.jpg)\n\n**图 23-2** *我们的例子*\n\
  \n在一切开始之前，我们现在拥有的是一组未排序的值（图 23-3）。\n\n![描述：黑色背景上的蓝色线条 自动生成的描述](img/23fig03.jpg)\n\
  \n**图 23-3** *一组未排序的值*\n\n我们的目标是将这些未排序的值变成已排序的。我们从第一个元素开始，如果把这些条形看作数组（或类似集合）中的值，我们从最左边开始。我们选择第一个元素进行处理。当我们选择一个元素时，它被称为**活动元素**或**活动值**（图\
  \ 23-4）。\n\n![描述：蓝色和红色条形的图表 自动生成的描述](img/23fig04.jpg)\n\n**图 23-4** *从第一个元素开始*\n\
  \n当我们有了活动值后，我们问自己以下问题：**当我查看已排序的元素时，我是否在正确的位置？**\n\n对于集合中的第一个元素，这个问题不适用。还没有已经排序的元素，所以我们直接认为第一个元素已经排好序了（图\
  \ 23-5）。\n\n![描述：带有笑脸的图表 中等置信度自动生成](img/23fig05.jpg)\n\n**图 23-5** *我们的第一个元素被假定为已排序……暂时如此！*\n\
  \n现在该处理下一个元素了，所以向右移动一个元素，并将其标记为活动（图 23-6）。这恰好也是我们未排序区域中的第一个元素，所以这也是另一种称呼方式。\n\n\
  ![描述：带有笑脸的图表 自动生成的描述](img/23fig06.jpg)\n\n**图 23-6** *移动到下一个元素*\n\n我们重复之前问过的问题：**当我查看已排序的元素时，我是否在正确的位置？**\
  \ 当我们查看已排序区域时，只有一个元素。将其大小与我们的活动值比较，活动值更大。这符合我们从短到高排序的目标，所以我们可以回答“是”，并将活动值标记为已排序（图\
  \ 23-7）。\n\n![描述：蓝色和绿色条形的图表 自动生成的描述](img/23fig07.jpg)\n\n**图 23-7** *我们有两个（临时）已排序的元素。*\n\
  \n我们继续处理下一个元素，并重复到目前为止遵循的步骤。我们将第三个元素（或当前第一个未排序元素）标记为活动（图 23-8）。\n\n![描述：不同颜色条形的图表\
  \ 中等置信度自动生成](img/23fig08.jpg)\n\n**图 23-8** *继续处理第三个元素*\n\n当我们查看已排序的元素时，这个活动元素应该放在哪里？这需要我们遍历每个已排序元素，比较高度，并继续前进直到找到正确的位置（图\
  \ 23-9）。\n\n![描述：带有笑脸的图表 中等置信度自动生成](img/23fig09.jpg)\n\n**图 23-9** *将其移动到正确的位置*\n\
  \n对于这个活动元素，我们将其一直移动到已排序区域的开头（图 23-10）。\n\n![描述：带有笑脸的图表 中等置信度自动生成](img/23fig10.jpg)\n\
  \n**图 23-10** *我们有了三个大致排好序的元素。*\n\n到现在为止，我们应该看到一种模式开始出现，即我们：\n\n1. 从未排序区域中选取第一个元素。\n\
  2. 将此元素标记为活动。\n3. 将其值与已排序区域中的元素进行比较，以确定将其放置在哪里。\n\n\n\n\n4. 将我们的活动项放置在已排序区域中的正确位置。\n\
  \n继续这一趋势并加快速度，图 23-11 展示了我们下一个活动项以及按身高排序时它应处的位置。\n\n![描述：一个条形图图表，自动生成的中等置信度描述](img/23fig11.jpg)\n\
  \n**图 23-11** *确保我们的第四项被放置到正确位置*\n\n已排序区域中的项数正在逐渐增加（图 23-12）。\n\n![描述：一个带有笑脸的图表，自动生成的中等置信度描述](img/23fig12.jpg)\n\
  \n**图 23-12** *我们的已排序区域正在变大*\n\n继续处理下一个活动项并跳过几个步骤，这是一个直接的比较：由于该活动项现在是已排序项中最大的，它已经处于正确位置（图\
  \ 23-13）。\n\n![描述：一个带有笑脸的图表，自动生成的描述](img/23fig13.jpg)\n\n**图 23-13** *我们的下一个项恰好已经排好序*\n\
  \n在结束这个例子之前，我们还要再看一个项。下一个活动项如图 23-14 所示。\n\n![描述：一个不同颜色条形图的图表，自动生成的描述](img/23fig14.jpg)\n\
  \n**图 23-14** *将下一个项移动到合适的顺序*\n\n当我们将其与其他已排序项进行比较时，正如上一张图也强调的那样，我们需要将其向左移动两个位置，以确保它处于合适的已排序位置（图\
  \ 23-15）。\n\n![描述：一个带有笑脸的图表，自动生成的描述](img/23fig15.jpg)\n\n**图 23-15** *我们的已排序区域开始成形*\n\
  \n至此，我们不再继续这个例子。对剩余项进行排序的步骤与我们之前所做的完全相同。最后，我们将得到一个完美排序的数组，如图 23-16 所示。\n\n![描述：一个带有鸟类和黑色背景的图表，自动生成的描述](img/23fig16.jpg)\n\
  \n**图 23-16** *现在所有数据都已排序*\n\n我们在这里看到的**已排序区域、未排序区域**和**活动数字**的方法都是插入排序工作的核心。现在我们已经了解了这些，让我们再看一个例子，更详细地展示插入排序的工作原理。\n\
  \n### 另一个例子\n\n在现实生活中，我们可能不会对条形图进行排序。我们会对数字等值进行排序，因此让我们利用目前所学知识，使用插入排序对一组数字进行完整排序（图\
  \ 23-17）。\n\n![描述：数字](img/23fig17.jpg)\n\n**图 23-17** *另一个例子*\n\n由于你对插入排序的工作原理有了很好的理解，我们将快速浏览这个例子。首先，我们跳过第一个数字（默认认为它已排序），专注于第二个数字。这个**活动数字**（我们当前试图排序的数字）是数字\
  \ 3（图 23-18）。\n\n![描述：活动数字](img/23fig18.jpg)\n\n**图 23-18** *从我们的活动数字开始*\n\n一旦我们有了活动数字，我们就遵循插入排序的“向左看”方法。在这种方法中，它将活动数字与其左侧的每个数字进行比较，直到遇到一个比它小的数字。\n\
  \n我们左边只有一个数字，所以让我们将 3 与 5 进行比较。活动数字（3）是否大于 5？答案是否定的，所以我们向左移动。由于左边没有其他数字，活动数字被插入到开头的新位置（图\
  \ 23-19）。\n\n![描述：新位置](img/23fig19.jpg)\n\n**图 23-19** *交换以确保顺序保持*\n\n接下来，我们向右移动并选择一个新的活动数字（图\
  \ 23-20）。\n\n![描述：新的活动数字](img/23fig20.jpg)\n\n**图 23-20** *移动到下一个项*\n\n这个新的活动数字是\
  \ 1。重复之前的过程，让我们向左看。1 不大于 5。1 不大于 3。左边没有其他数字，所以 1 现在被插入为列表中的第一个项（图 23-21）。\n\n![描述：新的排列](img/23fig21.jpg)\n\
  \n**图 23-21** *我们正确地对活动项进行了排序*\n\n到目前为止，一切顺利，对吧？让我们进一步加快速度，跳过大量解释，只展示活动数字到达新目的地的结果，用于剩余的数字（图\
  \ 23-22）。\n\n![描述：其余的数字](img/23fig22.jpg)\n\n**图 23-22** *遍历并排序剩余项*\n\n然后……我们完成了！现在剩下的就是分析插入排序的工作原理，提供一个\
  \ JavaScript 实现，并查看插入排序的性能特征。\n\n### 算法概述与实现\n\n如果我们必须用文字而不是图表来正式描述插入排序，描述如下：\n\n\
  1. 从开头开始，假设第一个数字已经排好序。我们将要关注的数字（即活动数字）是第二个项。\n2. 掌握活动数字后，检查它是否小于或大于它前面的数字：\n   a.\
  \ 如果活动数字大于它左边的数字，则不做任何操作。目前顺序正确。跳转到步骤 3。\n   b. 如果活动数字小于它左边的数字，则继续向左移动。一直移动，直到活动数字遇到另一个值比它小的数字。当那个令人高兴的时刻到来时，停在原地，将活动数字紧挨着那个数字插入。\n\
  3. 是时候用一个新的活动数字重复整个过程了。选择下一个未排序的数字，并从步骤 2 重新开始。\n\n如果我们将这个算法转化为代码，将会看到如下内容：\n\n\
  ```\nfunction insertionSort(input) {\n   // 用于存储当前正在比较的元素的变量\n  let activeNumber;\n\
  \n   // 从第二个元素（索引 1）开始遍历数组\n  for (let i = 1; i < input.length; i++) {\n     //\
  \ 将当前元素存储在 activeNumber 变量中\n    activeNumber = input[i];\n\n     // 内层循环，将 activeNumber\
  \ 与它前面的元素进行比较\n    for (let j = i - 1; j >= 0; j--) {\n      if (input[j] > activeNumber)\
  \ {\n         // 将较大的元素向前移动一个位置，为 activeNumber 腾出空间\n        input[j + 1] = input[j];\n\
  \      } else {\n         // 如果找到一个小于或等于 activeNumber 的元素，则退出内层循环\n        break;\n\
  \      }\n    }\n     // 将 activeNumber 放置到其正确的排序位置\n    input[j + 1] = activeNumber;\n\
  \  }\n}\n\nlet myinput = [24, 10, 17, 9, 5, 9, 1, 23, 300];\ninsertionSort(myinput);\n\
  \nalert(myinput);\n```\n\n这个实现几乎是我们之前看到的英文解释和图表直接翻译的结果。主要需要注意的是，我们有两个循环并行工作。首先，外层循环负责遍历整个数据。其次，内层循环负责获取每个活动数字，向左查看已排序的数据，并指定活动数字将被插入的位置。\n\
  \n### 性能分析\n\n插入排序的性能特征并不值得大书特书。它对于大型数据集来说效率不高，表 23-1 突出了其性能特征。\n\n**表 23-1** *插入排序的性能特征*\n\
  \n![图片](img/23tab01.jpg)\n\n\n\n\n深入探讨，至少需要 `n` 次操作才能从数据的一端走到另一端（图 23-23）。\n\n![描述：黑色背景上的蓝色条形图\
  \ 自动生成的描述](img/23fig23.jpg)\n\n**图 23-23** *共有 n 个元素*\n\n当我们从左向右移动时，取出当前活动数字，并尝试在已排序区域中找到正确的位置将其插入。平均而言，这也需要大约\
  \ `n` 次操作（图 23-24）。\n\n![描述：带有不同颜色条形图的图表 自动生成的描述](img/23fig24.jpg)\n\n**图 23-24**\
  \ *每一步我们几乎都要进行 n 次比较。*\n\n综合起来，平均运行时间为 `n`²，其中遍历数字的线性时间与每一步向左插入的线性查找相结合，使得该算法相当缓慢。如果我们在一个已经排序的列表上运行插入排序，运行时间为\
  \ O(`n`)，因为我们的内层循环（平均运行约 `n` 次）将只运行一次。它比较的第一个元素就会表明当前活动元素已经处于正确位置，因此大部分工作只是从左向右移动。这就是为什么插入排序在对部分排序的元素进行排序时并非糟糕的选择，在处理小规模数值列表时也并非糟糕的选择。\n\
  \n不过，对于所有插入排序爱好者来说，也并非全是坏消息！它完全不占用大量内存。插入排序只占用常量内存，因此如果你需要排序数字（速度较慢）但内存受限，请将插入排序放在首位。\n\
  \n### 结论\n\n从速度角度来看，插入排序效率不高。然而，从内存角度来看，它非常高效。要了解插入排序与其他排序算法的对比，请查看表 23-2。\n\n**表\
  \ 23-2** *插入排序与其他排序算法在速度和内存特性上的对比*\n\n![图片](img/23tab02.jpg)\n\n总体而言，有更好的排序算法可供使用。除非你要排序少量数字，或者确实需要利用其出色的常量内存占用，否则最好尽可能远离插入排序。\n\
  \n一些额外资源：\n\n![图片](img/sq1.jpg) 提问： [`forum.kirupa.com`](https://forum.kirupa.com)\n\
  \n![图片](img/sq1.jpg) 错误/已知问题： [`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\
  \n![图片](img/sq1.jpg) 源代码仓库： [`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\
  \n## 24. 选择排序\n\n一种缓慢但非常易于理解的排序算法是**选择排序**。它的方法非常简单。假设我们有一个需要排序的值列表（图 24-1）。\n\n\
  ![描述：我们的初始输入](img/24fig01.jpg)\n\n**图 24-1** *我们起始的未排序值*\n\n选择排序的工作原理是找到（即选择）整个列表中最小的元素。一旦找到最小的元素，它就会对其倍加关爱和赞美，并将其作为第一个已排序元素放入一个称为**已排序区域**的区域中。然后，选择排序会继续寻找列表中下一个最小的元素。找到该元素后，将其放置在已排序区域中前一个最小元素的后面。整个寻找下一个最小元素并将其塞入已排序区域的过程不断重复，直到没有未排序的元素剩余。\n\
  \n这一切可能听起来不太容易理解。而且也很无聊，所以让我们在下一节中用一些图片和内容来改善一下。\n\n继续！\n\n### 选择排序详解\n\n由于我非常懒惰，我们就继续使用之前看到的条形图输入。我们的目标是使用选择排序将条形图从最短到最高排序。在此过程中，我们也会学到一些关于选择排序实际工作原理的知识。希望如此。\n\
  \n首先，戴上选择排序的面具，我们假设第一个元素是列表中最小的元素（图 24-2）。\n\n![描述：你的第一个元素是最小的……暂时](img/24fig02.jpg)\n\
  \n**图 24-2** *让我们从第一个元素开始。*\n\n在你开始为这种荒谬性而跳脚之前，先等一下。下一步是检查第一个元素是否确实是列表中最小的元素。为了回答这个问题，选择排序会遍历整个列表，并将每个元素的大小与我们当前最小的（也是第一个）元素进行比较（图\
  \ 24-3）。\n\n![描述：你更小吗？](img/24fig03.jpg)\n\n**图 24-3** *检查下一个值*\n\n通常，第一个元素很少能长时间保持最小。当选择排序遇到一个更小的元素时，**这个新元素就成为新的最小元素。**\
  \ 正如你所见，在我们的例子中，这立即发生了，因为下一个元素比第一个元素小（图 24-4）。\n\n![描述：最新的最小元素](img/24fig04.jpg)\n\
  \n**图 24-4** *当前我们的最小元素*\n\n此时，我们有了一个新的最小元素。但和之前一样，现在宣布结束还为时过早，因为我们只检查了两个值。寻找最小数字的任务需要继续，因此我们将最新的最小值与列表中剩余的元素进行比较，看看是否有其他元素会夺走最小元素的桂冠。\n\
  \n在此过程中，我们会经常遇到比当前最小值大的数字（图 24-5）。\n\n![描述：找到了一个更大的元素](img/24fig05.jpg)\n\n**图 24-5**\
  \ *继续向下遍历列表以找到最小元素*\n\n当这种情况发生时，我们只需跳过它，继续下一个元素并重复比较（图 24-6）。\n\n![描述：下一个元素](img/24fig06.jpg)\n\
  \n**图 24-6** *出现了一个新的最小元素。*\n\n选择排序会遍历整个列表，直到选出最小的元素。对于这个例子，那就是图 24-7 中所示的条形图。\n\
  \n![描述：找到了最小的元素](img/24fig07.jpg)\n\n**图 24-7** *我们找到了最小的元素。*\n\n剩下的就是将这个数字移动到之前提到的神秘已排序区域，我们假设将从列表的开头划分已排序区域。为此，下一步是将我们的最小元素与起始的第一个元素（即未排序区域的第一个元素）交换（图\
  \ 24-8）。\n\n![描述：交换元素](img/24fig08.jpg)\n\n**图 24-8** *将最小元素交换到第一位。*\n\n一旦完成，**我们的列表就部分排序了，最小的元素排在最前面。**\
  \ 不过，列表的其余部分仍然未排序（图 24-9）。\n\n![描述：元素已交换](img/24fig09.jpg)\n\n**图 24-9** *我们有了一个已排序区域和一个未排序区域。*\n\
  \n已排序区域包含一个元素。未排序区域包含其余所有元素。现在，事情开始变得重复且痛苦……对你的计算机而言。我们对未排序部分中新的第一个元素重复所有这些步骤。\n\
  \n在未排序的世界里，现在出现了一个新的最小数字（图 24-10）。\n\n![描述：新的第一个数字](img/24fig10.jpg)\n\n**图 24-10**\
  \ *与下一个数字进行比较*\n\n和之前一样，新的最小数字就是第一个元素。当选择排序遍历未排序元素以找到最小元素时，这个情况会发生变化。更准确且带有预示地说，在检查完所有未排序元素后，它会变成图\
  \ 24-11 中所示的条形图。\n\n![描述：新的最小数字](img/24fig11.jpg)\n\n\n\n\n\n**图 24-11** *寻找下一个最小元素*\n\
  \n下一步是将该元素与第一个未排序元素交换，这样列表的已排序区域就增加了一个条目（图 24-12）。\n\n![描述：你交换一些东西，然后做其他事情](img/24fig12.jpg)\n\
  \n**图 24-12** *交换，使第二小的元素处于正确位置*\n\n这种寻找新最小数字并将其交换到已排序区域的过程会重复进行，直到没有未排序的元素为止（图\
  \ 24-13）。\n\n![描述：为什么所有内容都应该排序](img/24fig13.jpg)\n\n**图 24-13** *完全排序的列表*\n\n接下来，我通常会使用实际数字而不是不同高度的条形图进行详细讲解。鉴于这个算法非常直观，我们直接跳过这些，进入枯燥的部分。\n\
  \n### 算法深度剖析\n\n选择排序的运行非常可预测。它会遍历数据列表，找到最小的数字、第二小的数字，依此类推。一旦找到最小的数字，就将其放入已排序区域。在实现这个已排序区域时，我们有很大的灵活性。\n\
  \n已排序区域可以像我们之前看到的示例那样放在开头（图 24-14）。\n\n![描述：是的，我复用了之前的教程！](img/24fig14.jpg)\n\n\
  **图 24-14** *两个区域*\n\n也可以放在末尾（图 24-15）。\n\n![描述：末尾的内容](img/24fig15.jpg)\n\n**图 24-15**\
  \ *组织列表没有绝对正确或错误的方式。*\n\n如果我们想与众不同，还可以使用一个全新的列表来存储已排序的元素（图 24-16）。\n\n![描述：新列表](img/24fig16.jpg)\n\
  \n**图 24-16** *维护两个列表也很常见。*\n\n大多数情况下，考虑到许多语言中列表类数据类型的常见工作方式，将已排序元素放在开头实现起来很简单。将它们放在末尾或创建一个全新的已排序列表则需要你多花一点功夫。选择让你更轻松的方式即可。这三种方法的性能和内存特性非常相似，因此你不必将其作为决策因素。\n\
  \n说到性能和内存，选择排序并不是一种快速的数据排序算法。因为我们选择一个未排序元素，并将其与所有其他未排序元素进行比较，所以会进行大量的比较。基本上，它的运行时间是\
  \ *n*²。从内存角度来看，选择排序非常出色。除了存储输入所需的额外对象外，它不会占用太多内存。这并不令人意外，因为几乎所有与排序相关的操作都是在输入本身原地进行的。\n\
  \n### JavaScript 实现\n\n我们快完成了。最后一步是看一个选择排序的 JavaScript 实现示例：\n\n```\nfunction selectionSort(input)\
  \ {\n  for (let i = 0; i < input.length; i++) {\n\n    // 假设第一个位置的元素是最小的\n    let\
  \ smallestPosition = i;\n\n    // 遍历未排序区域\n    for (let j = i + 1; j < input.length;\
  \ j++) {\n\n      if (input[j] < input[smallestPosition]) {\n        // 找到了新的最小数字\n\
  \        smallestPosition = j\n      }\n    }\n\n    // 如果最小值发生了变化，则交换\n    if (smallestPosition\
  \ != i) {\n       let temp = input[smallestPosition];\n      input[smallestPosition]\
  \ = input[i];\n      input[i] = temp;\n    }\n  }\n}\n\nlet myinput = [24, 10, 17,\
  \ 9, 5, 9, 1, 23, 300];\nselectionSort(myinput);\n\nalert(myinput);\n```\n\n这段 JavaScript\
  \ 代码与你之前看到的英文描述相差不远。由 `i` 变量表示的外层循环负责遍历列表中的每个元素，其位置标记了输入中已排序区域和未排序区域的分界线（图 24-17）。\n\
  \n![描述：i 的位置](img/24fig17.jpg)\n\n**图 24-17** *`i` 变量划分了输入中已排序和未排序的区域。*\n\n由才华横溢的\
  \ `j` 变量表示的内层循环负责将外层循环位置的元素与列表中剩余的所有元素进行比较。图 24-18 展示了选择排序著名的耗时且缓慢的部分。\n\n![描述：j\
  \ 的位置](img/24fig18.jpg)\n\n**图 24-18** *查看两个循环*\n\n至于代码中其他值得注意的地方，`smallestPosition`\
  \ 变量存储了最小元素的位置。它初始化为未排序区域的第一个元素，然后（可能）在内层循环对列表中未排序部分的所有剩余元素进行检查时发生变化。\n\n一旦找到最小元素，该元素就会与\
  \ `i` 位置的元素交换。相关代码如下：\n\n```\nif (smallestPosition != i) {\n  var temp = input[smallestPosition];\n\
  \  input[smallestPosition] = input[i];\n  input[i] = temp;\n}\n```\n\n因为我喜欢优化一些小的细节来轻松获得收益，所以我会检查一下，只有当最小元素确实与我们最初开始的元素不同时才进行交换。虽然这种情况不常发生，但添加这个检查以避免一些不必要的操作是值得的。如果你没有这个\
  \ `if` 语句也能安然入睡，那么可以安全地跳过它。\n\n### 结论\n\n选择排序属于那种容易理解但速度不快的排序算法。要了解选择排序与其他排序算法的比较，请查看表\
  \ 24-1。\n\n**表 24-1** *选择排序与其他类型排序算法在速度和内存特性上的比较*\n\n![图片](img/24tab01.jpg)\n\n\
  如果我是你，正在寻找一种易于实现但速度较慢的排序算法，我可能会在任何一天都选择插入排序而不是选择排序。\n\n一些额外资源：\n\n![图片](img/sq1.jpg)\
  \ 提问： [`forum.kirupa.com`](https://forum.kirupa.com)\n\n![图片](img/sq1.jpg) 错误/已知问题：\
  \ [`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\n![图片](img/sq1.jpg)\
  \ 源代码仓库： [`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\n## 25.\
  \ 归并排序\n\n你会遇到的最流行的排序算法之一是归并排序。它设计于 20 世纪 40 年代，那时恐龙还在丛林中漫步（图 25-1）。\n\n![描述：一张包含绘画、素描、插图、儿童艺术的图片，自动生成的描述](img/25fig01.jpg)\n\
  \n**图 25-1** *恐龙在做恐龙的事情。（来源：Winsor McCay，《恐龙葛蒂》，动画短片，1914 年。 [`en.wikipedia.org/wiki/Gertie_the_Dinosaur#`](https://en.wikipedia.org/wiki/Gertie_the_Dinosaur#)。）*\n\
  \n从那时起，归并排序（及其变体）就随处可见——从 Perl、Python 和 Java 语言中的排序实现，到磁带驱动器上的数据排序。好吧，磁带驱动器这一点今天可能不再相关，但归并排序因其高效性而在许多地方出现。\n\
  \n在本章中，我们将详细探讨归并排序的工作原理，并通过一个简单的 JavaScript 实现来让它活起来。\n\n开始吧！\n\n### 归并排序的工作原理\n\
  \n试图理解归并排序的工作原理起初可能让人不知所措，但让我们通过一个示例来轻松学习。在我们的示例中，有九个数字需要排序（图 25-2）。\n\n![描述：一张包含字体、文本、线条、数字的图片，自动生成的描述](img/25fig02.jpg)\n\
  \n**图 25-2** *另一个未排序的数字列表*\n\n\n\n\n\n先插一句题外话。我要提一下，归并排序是一种**分治算法**……而且它对此毫不掩饰。这仅仅意味着归并排序通过先将数字不断分割成更小的部分来施展其魔法。现在，我们有九个数字交给归并排序。归并排序做的第一件事就是将它们分成两半（图\
  \ 25-3）。\n\n![描述：一张游戏截图，自动生成的低置信度描述](img/25fig03.jpg)\n\n**图 25-3** *将我们的列表分成两半。*\n\
  \n我们最初的输入现在被分成了两个部分。接下来，我们继续分割，将两个部分分成四个部分（图 25-4）。\n\n![描述：一张游戏截图，自动生成的低置信度描述](img/25fig04.jpg)\n\
  \n**图 25-4** *继续分割我们的输入*\n\n我们不断分割这些部分，直到每个部分只剩下一个数字，无法再进一步分割为止（图 25-5）。\n\n![描述：一张电脑游戏截图，自动生成的低置信度描述](img/25fig05.jpg)\n\
  \n**图 25-5** *我们一直分割到不能再分割为止。*\n\n此时，我们得到了一堆单独的值，看起来和开始时一模一样。这并非我们最初的目标，但这是归并排序运作方式的重要部分。**在这个阶段，我们完成了分割。**\
  \ 接下来我们将看到大量的合并与排序——也就是所谓的“征服”部分。\n\n让我们从最前面的两个部分开始（图 25-6）。\n\n![描述：一组带有黑色数字的黄色方块，自动生成的低置信度描述](img/25fig06.jpg)\n\
  \n**图 25-6** *我们将开始排序。*\n\n我们要将这些数字合并在一起。在合并的同时，我们还会进行排序，确保合并后的部分中的数字从小到大排列。因为只涉及两个数字，所以对于\
  \ 5 和 12 来说相当简单（图 25-7）。\n\n![描述：一张包含截图、线条、字体、矩形的图片，自动生成](img/25fig07.jpg)\n\n**图\
  \ 25-7** *每个片段都被排序并合并。*\n\n现在我们对由数字 4 和 1 组成的下两个部分重复这个过程（图 25-8）。\n\n![描述：一张包含截图、线条、矩形、字体的图片，自动生成](img/25fig08.jpg)\n\
  \n**图 25-8** *对每个分割的部分重复此过程。*\n\n和之前一样，我们将两个部分合并成一个部分。这次排序更加明显，因为原始排列并非有序。我们从 4\
  \ 和 1 开始，合并后的排列是 1 和 4。到目前为止很简单，对吧？\n\n现在，我们继续对每一对部分重复合并和排序操作，直到所有部分都用完（图 25-9）。\n\
  \n![描述：一张包含文本、截图、字体、矩形的图片，自动生成](img/25fig09.jpg)\n\n**图 25-9** *我们的第一轮合并和排序完成了。*\n\
  \n如果有一个数字是落单的，无法参与合并和排序……比如这里的数字 10，那也没关系。别取笑它了。我们只是把它带到下一轮合并和排序中，希望它的运气能好转！\n\n\
  之前，我们合并的是由单个数字组成的成对部分。那很简单。这一次，我们将继续合并成对的部分，但每个部分将包含两个数字。请看（图 25-10）。\n\n![描述：一张包含文本、截图、字体、线条的图片，自动生成](img/25fig10.jpg)\n\
  \n**图 25-10** *我们继续合并（并排序）各部分。*\n\n合并后的部分不再包含两个数字，而是包含四个数字，全部完美有序。我们对剩余的部分也重复这个过程（图\
  \ 25-11）。\n\n![](img/25fig11.jpg)\n\n**图 25-11** *我们的部分不断被合并。*\n\n数字 10 仍然没有处于合适的位置以便排序和合并，所以我们把它拖到下一轮（图\
  \ 25-12）。\n\n![描述：一张包含文本、截图、矩形、字体的图片，自动生成](img/25fig12.jpg)\n\n**图 25-12** *10 这个数字很特殊。*\n\
  \n到现在，你应该开始看到一种模式出现了。我们接近尾声了，所以让我们继续下一行的合并和排序（图 25-13）。\n\n![](img/25fig13.jpg)\n\
  \n**图 25-13** *更多的合并正在进行。*\n\n这看起来几乎完全有序了！我们只剩最后一轮了，对于那些深深担心数字 10 的人……这次它终于入选了（图\
  \ 25-14）。\n\n![描述：一张电脑截图，自动生成的低置信度描述](img/25fig14.jpg)\n\n**图 25-14** *我们最终排序后的列表*\n\
  \n呜呼！我们现在有了一个排序好的数字列表。没有更多的部分需要合并和排序了，所以我们完成了。作为快速回顾（并回味我们度过的美好时光），请看我们对初始数字集合进行排序所执行的全部步骤列表（图\
  \ 25-15）。\n\n![描述：一张电脑游戏截图，自动生成的低置信度描述](img/25fig15.jpg)\n\n**图 25-15** *归并排序对数字进行排序的路径*\n\
  \n这个巨大的步骤列表是归并排序的可视化表示——包含了它所有的分治之美！\n\n### 归并排序：算法细节\n\n难点在于真正理解归并排序是如何工作的。如果你对上一节的内容都理解了，那么对于接下来需要了解的额外枯燥（但重要）的细节，你已经做好了充分准备。忽略所有图表和花哨的解释，归并排序只做两件事：\n\
  \n1. 将输入分割（再分割，再分割，再……）成子部分，直到每个部分只剩下一个元素。\n2. 将所有子部分合并（并排序）回一个大的、现在已排序的部分。\n\n\
  这一切都在 *n* log *n* 时间内完成，下面的树形图突出了原因（图 25-16）。\n\n![描述：一张包含截图、文本、图表、字体的图片，自动生成](img/25fig16.jpg)\n\
  \n**图 25-16** *操作次数与树深度的可视化*\n\n用通俗的话说，对于一个排序算法来说，这相当快速且高效。典型的归并排序实现的深度是 log *n*，每一层的操作次数是\
  \ *n*。\n\n至于它占用多少空间，情况就不那么乐观了。常见的归并排序实现在最坏情况下占用 **2*n* 空间**——这不算糟糕，但如果你在固定且有限的内存区域内进行排序，就需要留意这一点。\n\
  \n最后一个细节是：**归并排序是一种稳定排序。** 这意味着原始输入和排序后输入中元素的相对顺序保持不变。如果你关心这类事情，这是个好消息。\n\n### 查看代码\n\
  \n现在你已经了解了归并排序的工作原理，并了解了一些关于其复杂度的枯燥细节，是时候看看这一切如何转化为 JavaScript 代码了。以下是我个人版本的 JavaScript\
  \ 实现：\n\n\n\n\n```\nfunction mergeSort(input) {\n  // 只有一个孤独的元素\n  if (input.length\
  \ < 2) {\n    return input;\n  }\n\n  // 分解\n  let mid = Math.ceil(input.length\
  \ / 2);\n  let left = mergeSort(input.slice(0, mid));\n  let right = mergeSort(input.slice(mid));\n\
  \n  // 递归排序并合并\n  return merge(left, right);\n}\n\nfunction merge(left, right) {\n\
  \  let result = [];\n\n  // 在合并过程中对子列表进行排序\n  while (left.length > 0 && right.length\
  \ > 0) {\n    if (left[0] <= right[0]) {\n      result.push(left.shift());\n   \
  \ } else {\n      result.push(right.shift());\n    }\n  }\n\n  // 将剩余元素添加到结果中\n\
  \  while (left.length > 0) {\n    result.push(left.shift());\n  }\n\n  while (right.length\
  \ > 0) {\n    result.push(right.shift());\n  }\n\n  // 返回排序后的子列表\n  return result;\n\
  }\n```\n\n如果你想看到这段代码的实际运行效果，只需用一个数字数组作为参数调用 `mergeSort` 函数：\n\n```\nlet example\
  \ = [4, 10, 11, 20, 5, 3, 4, 1, -20];\nconsole.log(example);\nalert(example);\n\
  ```\n\n当你通读代码时，请注意这里绝对没有任何有趣的事情发生。只是一大堆循环和数组操作，构成了分治与合并/排序的征服操作。\n\n### 结论\n\n如果你要对一个大型值列表进行排序，使用归并排序不会出错。它速度快，占用内存合理，并且（与快速排序不同）是稳定的。现在，在我们结束今晚的讨论、去彩弹射击场用归并排序狂欢之前，表\
  \ 25-1 将归并排序与其他各种流行的排序算法及其性能和内存特性进行了比较：\n\n**表 25-1** *归并排序与其他排序算法在速度和内存特性上的对比。*\n\
