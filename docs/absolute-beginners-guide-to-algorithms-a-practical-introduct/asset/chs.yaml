  \n## 11. 哈希表（又称哈希映射或字典）\n\n在数据结构中，哈希表在我们心中占据着特殊的位置。它将快速存储和检索值的能力提升到了一个全新的水平。因此，我们会在许多需要缓存数据以便后续快速访问的场景中看到哈希表的身影。我们还会看到其他数据结构和算法利用哈希表来实现其功能。在本章中，我们将深入探讨哈希表（通常也称为*哈希映射*或*字典*）为何如此出色。\n\
  \n开始吧！\n\n### 一个非常高效的机器人\n\n下面这个设定将帮助我们解释哈希表的工作原理。我们有一堆食物需要存储（图 11-1）。\n\n![描述：一张自动生成的包含圆形、截图、色彩、儿童艺术的图片](img/11fig01.jpg)\n\
  \n**图 11-1** *我们来谈谈食物！*\n\n我们还有一堆盒子来存放这些食物（图 11-2）。\n\n![描述：一张自动生成的截图](img/11fig02.jpg)\n\
  \n**图 11-2** *盒子*\n\n我们的目标是将一些食物放入这些盒子中妥善保管。为此，我们将依赖一个值得信赖的机器人助手（图 11-3）。\n\n![描述：一个带有对话气泡的卡通机器人，置信度较低](img/11fig03.jpg)\n\
  \n**图 11-3** *一个乐于助人（且值得信赖）的机器人*\n\n作为我们的第一个动作，我们决定存放西瓜。我们的机器人走到西瓜前并对其进行分析（图 11-4）。\n\
  \n![描述：一个卡通角色拿着西瓜和放大镜，置信度中等](img/11fig04.jpg)\n\n**图 11-4** *我们的机器人正在分析西瓜*\n\n这次分析告诉机器人应该把西瓜放进哪个盒子。机器人使用的具体逻辑目前不是我们关注的重点。重要的是，分析结束后，机器人清楚地知道该把西瓜存放在哪里（图\
  \ 11-5）。\n\n![描述：一张自动生成的游戏截图，置信度较低](img/11fig05.jpg)\n\n\n\n\n\n**图 11-5** *存储一个物品*\n\
  \n接下来，我们要存储汉堡。机器人重复相同的步骤：分析它，确定将其存入哪个箱子，然后将其存入合适的箱子（图 11-6）。\n\n![描述：游戏截图，自动生成的低置信度描述](img/11fig06.jpg)\n\
  \n**图 11-6** *存储另一个物品*\n\n我们对要存储的不同类型食物再重复几次这个过程，机器人会分析并将食物存入合适的箱子（图 11-7）。\n\n\
  ![描述：包含截图、圆形、色彩、线条的图片，自动生成的描述](img/11fig07.jpg)\n\n**图 11-7** *现在所有物品都已存储完毕。*\n\n\
  现在，我们要稍微转换一下思路。我们想要取回之前存储的一个食物。我们想吃鱼，于是告诉机器人去取鱼。我们有一个它的精确副本（可能是一张图片！），机器人做的第一件事就是分析这个副本。这个分析帮助机器人确定我们实际可食用的鱼存储在哪个箱子里（图\
  \ 11-8）。\n\n![描述：视频游戏截图，自动生成的中等置信度描述](img/11fig08.jpg)\n\n**图 11-8** *是时候取回一个物品了*\n\
  \n一旦它确定了鱼的位置，就会直接走到正确的箱子前，把鱼带回来给我们（图 11-9）。\n\n![描述：游戏截图，自动生成的中等置信度描述](img/11fig09.jpg)\n\
  \n**图 11-9** *我们的机器人确切知道物品在哪里。*\n\n需要重点注意的是，正如我们之前看到机器人存储物品时那样，机器人会直接走向正确的箱子。它不会扫描其他箱子寻找鱼，也不会猜测。基于对鱼副本的分析，它知道该去哪里，并且毫不犹豫地直接前往。\n\
  \n### 从机器人到哈希函数\n\n我们之前看到的机器人高效存储和检索物品的例子，为我们接下来探讨下一个中间站——**哈希函数**——做好了铺垫。让我们最后一次请回我们的机器人（图\
  \ 11-10）。\n\n![描述：手机截图，自动生成的低置信度描述](img/11fig10.jpg)\n\n**图 11-10** *我们的机器人回来了！*\n\
  \n机器人到底做了什么？它分析我们要存储的物品，并将其映射到一个存储位置。让我们稍微调整一下可视化方式（图 11-11）。\n\n![描述：包含截图、卡通、设计的图片，自动生成的描述](img/11fig11.jpg)\n\
  \n**图 11-11** *一个哈希函数*\n\n我们的机器人被一个称为**哈希函数**的东西取代了。我们用于存储的通用箱子现在被一个更正式的结构所取代，该结构带有索引位置，看起来有点像数组。\n\
  \n那么，哈希函数到底是什么？哈希函数不过是一段代码。这段代码将一个值作为输入，并返回一个唯一的值（称为**哈希码**）作为输出。需要注意的细节是，对于相同的输入，输出*永远不会改变*。例如，我们将一盘煎饼扔给哈希函数，输出可能是存储位置\
  \ #5（图 11-12）。\n\n![描述：计算机截图，自动生成的中等置信度描述](img/11fig12.jpg)\n\n**图 11-12** *我们的煎饼将被存储的位置*\n\
  \n每次哈希函数遇到这盘特定的煎饼时，它总是会返回位置 #5，而且速度非常快。我们可以将输入、哈希函数和输出之间的关系概括为图 11-13 所示。\n\n![描述：包含截图、快餐、食物的图片，自动生成的描述](img/11fig13.jpg)\n\
  \n**图 11-13** *哈希函数返回的结果*\n\n这里的输出表示从 0 到 5 的数字，但也可以是任何值。这完全取决于我们的哈希函数是如何实现的，稍后我们将看一个哈希函数的示例。\n\
  \n### 从哈希函数到哈希表\n\n是时候了！现在我们终于可以讨论那个建立在之前所有内容之上的明星——**哈希表**（又称**散列表、哈希映射**或**字典**）。从一开始，哈希表就是一种数据结构，能够以闪电般的速度存储和检索键值对。它使用哈希函数将键映射到底层数组数据结构中特定位置的值（图\
  \ 11-14）。\n\n![描述：计算机截图，自动生成的低置信度描述](img/11fig14.jpg)\n\n**图 11-14** *不知怎的，我们总是以数组收尾，不是吗？*\n\
  \n这意味着我们的哈希表可以实现常数时间（即 O(1)）的查找和插入操作。这种高速能力使其非常适合我们经常进行的许多数据缓存和索引相关活动。我们将通过查看一些常见操作来了解它们的工作原理。\n\
  \n#### 向哈希表添加元素\n\n要向哈希表添加元素，我们需要指定两样东西：\n\n1. **键：** 作为标识符，我们以后可以用它来引用数据\n2. **值：**\
  \ 指定我们要存储的数据\n\n假设我们要以 **[键, 值]** 对的形式添加以下数据，其中键是人的名字，值是他们的电话号码：\n\n![Images](img/sq.jpg)\
  \ 林克，(555) 123-4567\n\n![Images](img/sq.jpg) 塞尔达，(555) 987-6543\n\n![Images](img/sq.jpg)\
  \ 马里奥，(555) 555-1212\n\n![Images](img/sq.jpg) 洛克人，(555) 867-5309\n\n![Images](img/sq.jpg)\
  \ 隆，(555) 246-8135\n\n![Images](img/sq.jpg) 科沃，(555) 369-1472\n\n如果我们将这些数据可视化为存在于哈希表中，它看起来就像图\
  \ 11-15。\n\n![描述：计算机截图，自动生成的中等置信度描述](img/11fig15.jpg)\n\n**图 11-15** *哈希工作原理的另一种视角*\n\
  \n输入是我们的键和值。键被发送到哈希函数以确定存储位置。一旦确定了存储位置，值就被放置在那里。\n\n#### 从哈希表读取元素\n\n继续我们之前的例子，假设我们要从哈希表中读取一个值。我们想获取洛克人的电话号码。我们要做的是向哈希表提供键“洛克人”。哈希函数会快速计算出电话号码所在的存储位置，并将正确的值返回给我们（图\
  \ 11-16）。\n\n![描述：计算机截图，自动生成的低置信度描述](img/11fig16.jpg)\n\n**图 11-16** *高效检索电话号码*\n\
  \n如果我们提供一个不存在的键（例如“蝙蝠侠”），哈希表会返回一条消息，比如 `undefined`，因为哈希函数会指向一个不存在的存储位置。\n\n### JavaScript\
  \ 实现/用法\n\n几乎所有现代编程语言都提供了哈希表的实现，因此我们不会在这里尝试重新创建一个。在 JavaScript 中，我们有 `Map` 对象，它支持添加、检索和删除元素等常见操作。我们可以像下面这样使用\
  \ `Map`：\n\n\n\n\n\n```\nlet characterInfo = new Map();\n\n// set values\ncharacterInfo.set(\"\
  Link\", \"(555) 123-4567\");\ncharacterInfo.set(\"Zelda\", \"(555) 987-6543\");\n\
  characterInfo.set(\"Mario\", \"(555) 555-1212\");\ncharacterInfo.set(\"Mega Man\"\
  , \"(555) 867-5309\");\ncharacterInfo.set(\"Ryu\", \"(555) 246-8135\");\ncharacterInfo.set(\"\
  Corvo\", \"(555) 369-1472\");\n\n// get values\nconsole.log(characterInfo.get(\"\
  Ryu\")); // (555) 246-8135\nconsole.log(characterInfo.get(\"Batman\")); // undefined\n\
  \n// get size\nconsole.log(characterInfo.size()); // 6\n\n// delete item\nconsole.log(characterInfo.delete(\"\
  Corvo\")); // true\nconsole.log(characterInfo.size()); // 5\n\n// delete all items\n\
  characterInfo.clear();\nconsole.log(characterInfo.size()); // 0\n```\n\n在幕后，哈希函数用于确保当我们提供关联的键时，能够快速访问对应的值。我们可以假设这个哈希函数质量良好。如果你好奇一个基本的哈希函数长什么样，请看下面的例子：\n\
  \n```\nfunction hash(key, arraySize) {\n  let hashValue = 0;\n\n  for (let i = 0;\
  \ i < key.length; i++) {\n    // 将键中每个字符的 Unicode 值相加\n    hashValue += key.charCodeAt(i);\n\
  \  }\n\n  // 取模运算，确保哈希值在数组大小范围内\n  return hashValue % arraySize;\n}\n\n// 创建一个分配了\
  \ 100 个元素的新数组\nlet myArray = new Array(100);\n\nlet myHash = hash(\"Ryu\", myArray.length);\n\
  console.log(myHash) // 20\n```\n\n对于任何基于字符的输入，这个哈希函数都会返回一个安全落在 100 个元素的 `myArray`\
  \ 数组范围内的数字。这里有一个有趣的问题：如果我们想存储 101 个元素呢？或者 1000 个元素呢？假设在这些情况下，我们使用的是 JavaScript 以外的语言，超出数组固定大小会抛出错误。\n\
  \n如果发生以下情况呢？\n\n```\nlet newHash = hash(\"Yur\", myArray.length);\nconsole.log(myHash)\
  \ // 20\n```\n\n注意，Yur 返回的哈希值与 Ryu 相同，都是 20。这似乎不太理想，所以我们接下来讨论这个问题！\n\n### 处理冲突\n\
  \n在理想世界中，我们的哈希函数会为每个要存储的唯一键（和值）返回一个唯一的存储位置。这个理想世界需要满足两个条件：\n\n1.  我们的哈希函数设计得能够为每个唯一输入生成唯一键。\n\
  2.  我们有足够的存储空间，使得每个值都有自己的位置。\n\n在现实世界中，这两点都不成立。虽然我们的哈希函数擅长生成唯一键，但它们并不完美。有时，对于某些类型的输入，哈希函数会返回相同的哈希码，指向相同的存储位置。当我们存储大量元素时，可能会耗尽实际的存储位置来放置唯一的元素。\n\
  \n这两种情况都会导致所谓的**冲突**，结果就是我们的存储位置会保存多个值，如图 11-17 中的示例所示。\n\n![描述：计算机屏幕截图，置信度中等](img/11fig17.jpg)\n\
  \n**图 11-17** *冲突示例*\n\n当一个存储位置现在存储了多个值时会发生什么？大多数情况下，这对我们的哈希表*功能*影响不大。我们的哈希表实现会优雅地处理这种情况。\n\
  \n### 性能与内存\n\n虽然冲突不影响功能，但它们可能会影响*性能*。当一个存储位置只存储一个元素时，我们拥有最佳的常数时间 O(1) 性能。当一个存储位置存储多个元素，或者在最坏情况下，存储了哈希表中的所有元素时，性能会下降到\
  \ O(*n*)，如图 11-18 所示。\n\n![描述：计算机屏幕截图，置信度低](img/11fig18.jpg)\n\n**图 11-18** *最坏情况：所有元素都存储在一个盒子中*\n\
  \n这种行为使得这个特定的哈希表并不比采用线性搜索的数组或链表好多少。所有元素（或接近所有元素）都位于同一个存储位置的情况很少见。这通常表明哈希函数定义不佳，而现代哈希表实现使用了许多技术来避免陷入这种困境。\n\
  \n至于哈希表占用的空间，它是线性的。我们存储的每个元素都需要在哈希表中表示。如果单个存储位置有多个值，会有一些额外的开销来处理哈希函数并提供扫描能力，但这不会改变线性增长的特性。\n\
  \n如果我们要用一张漂亮的表格来总结，就会看到表 11-1 所示的内容。\n\n**表 11-1** *哈希表性能与内存*\n\n![图片](img/11tab01.jpg)\n\
  \n这些结果很不错！抛开所有警告和最坏情况不谈，没有比哈希表更高效的数据结构来快速存储和检索值了，我们将在其他数据结构和算法中使用哈希表时看到这一点。\n\n\
  注意\n\n哈希表是字典吗？\n\n我们多次提到哈希表有时被称为*哈希映射*或*字典*。不同的编程语言使用这些名称或类似名称来提供哈希表功能。这里存在争议的是字典。如果严格解释，字典不是哈希表。它是一种允许我们存储键值对的数据结构，但通常不实现哈希函数。\n\
  \n更复杂的是，某些字典实现可以在底层使用哈希表。例如，Python 中的 `dict` 对象就是一个字典，但它底层使用了哈希表，从而获得了我们了解的所有效率优势。\n\
  \n**直接回答我们的问题：哈希表也是字典吗？这取决于具体情况！**\n\n### 结论\n\n哈希表的美妙之处在于它们能够为基于键的操作（如插入、检索和删除）提供常数时间性能。通过使用哈希函数计算每个元素的索引，哈希表消除了线性搜索的需要，实现了对数据的直接访问，使操作极其快速。即使对于大量信息，这一点仍然成立。\n\
  \n这种性能优势使得哈希表在需要快速访问数据的场景中特别有用，例如实现缓存、符号表或字典。此外，哈希表内置了处理冲突的机制，即两个键输入产生相同哈希码的情况。哈希表就像是数据结构世界中的独角兽！\n\
  \n一些额外资源：\n\n![图片](img/sq1.jpg) 提问：<https://forum.kirupa.com>\n\n![图片](img/sq1.jpg)\
  \ 错误/已知问题：<https://bit.ly/algorithms_errata>\n\n![图片](img/sq1.jpg) 源代码仓库：<https://bit.ly/algorithms_source>\n\
  \n## 12. 字典树（又称前缀树）\n\n我们在某个网页上，遇到一个输入框，开始输入。随着我们输入，基于已经输入的几个字符，我们会看到部分结果（如图 12-1\
  \ 所示）。\n\n![描述：计算机屏幕截图，置信度低](img/12fig01.jpg)\n\n**图 12-1** *自动补全示例*\n\n\n\n\n随着我们不断输入，部分结果会不断优化，直到几乎能完整预测我们想要输入的单词或短语。这种类似自动补全的交互方式如今已被我们视为理所当然。几乎所有的用户界面都具备某种形式的自动补全功能。为什么此刻这对我们来说很有趣呢？\n\
  \n在幕后，支撑这种自动补全能力的数据结构很可能就是本章的主角——**字典树**（有时也称为**前缀树**）。在接下来的章节中，我们将进一步了解它。\n\n继续前进！\n\
  \n### 什么是字典树？\n\n我们先抛开枯燥的教科书定义：\n\n字典树（发音为“try”）是一种基于树的数据结构，非常适合涉及添加、删除或查找字符串或字符序列的场景。\n\
  \n嗯……这个定义对于解释字典树是什么或做什么并没有太大帮助（图 12-2）。\n\n![描述：一只狗坐着思考骨头，自动生成的描述置信度较低](img/12fig02.jpg)\n\
  \n**图 12-2** *什么是字典树？*\n\n这就需要通过一个示例和可视化讲解来审视我们将在字典树上执行的最常见操作。\n\n#### 插入单词\n\n\
  我们要做的是将单词 *apple* 存储到字典树中。首先，我们将单词拆分为单个字符：*a, p, p, l,* 和 *e*。接下来，开始构建我们的字典树结构。\n\
  \n字典树的起点是一个空根节点（图 12-3）。\n\n![描述：黑色背景上的红色文本，自动生成的描述置信度较低](img/12fig03.jpg)\n\n**图\
  \ 12-3** *根节点*\n\n下一步，我们从要存储的单词（*apple*）中取出第一个字母（*a*），并将其作为根节点的子节点添加到字典树中（图 12-4）。\n\
  \n![描述：包含圆形、截图的图片，自动生成描述](img/12fig04.jpg)\n\n**图 12-4** *我们的子节点*\n\n我们对下一个字母（*p*）重复此步骤，并将其添加为\
  \ *a* 节点的子节点（图 12-5）。\n\n![描述：包含圆形、时钟、截图、艺术的图片，自动生成描述](img/12fig05.jpg)\n\n**图 12-5**\
  \ *单词的字母继续作为子节点添加。*\n\n我们继续取出单词的每个字母，并将其添加为前一个字母的子节点。对于 *apple*，最终的字典树结构如图图 12-6\
  \ 所示。\n\n![描述：包含圆形、灯光、艺术的图片，自动生成描述置信度中等](img/12fig06.jpg)\n\n**图 12-6** *单词 apple\
  \ 存储在字典树中*\n\n当整个单词在树中表示完成后，我们还需要做一件事：标记输入单词的最后一个字母，以表示该单词已完整（图 12-7）。\n\n![描述：包含圆形、截图、艺术的图片，自动生成描述](img/12fig07.jpg)\n\
  \n**图 12-7** *标记单词的结尾*\n\n我们稍后会看到为什么标记结尾很重要。现在，让我们继续向字典树中添加更多单词。我们将添加 *cat*、*dog*、*duck*\
  \ 和 *monkey*。添加 *cat* 和 *dog* 后，字典树将如图图 12-8 所示。\n\n![描述：包含圆形、艺术的图片，自动生成描述](img/12fig08.jpg)\n\
  \n**图 12-8** *字典树中存储了更多单词*\n\n接下来要添加的单词是 *duck*。注意，该单词的第一个字母是 *d*，而我们已经有一个 *d* 节点作为根节点的子节点。因此，我们从现有的\
  \ *d* 节点开始，而不是创建一个新的 *d* 节点。下一个字母是 *u*，但 *d* 节点下没有值为 *u* 的子节点。于是，我们创建一个值为 *u* 的新子节点，并继续处理单词中剩余的字母。\n\
  \n这里需要强调的是，字母 *d* 现在成为了 *dog* 和 *duck* 这两个单词的公共前缀（图 12-9）。\n\n![描述：包含截图、圆形、艺术的图片，自动生成描述](img/12fig09.jpg)\n\
  \n**图 12-9** *字母 d 有两个单词以它开头。*\n\n接下来要添加的单词是 *monkey*，将其添加到树中后，表示如下（图 12-10）。\n\n\
  ![描述：计算机截图，自动生成描述置信度较低](img/12fig10.jpg)\n\n**图 12-10** *我们的字典树变得相当大了！*\n\n由于起始字母\
  \ *m* 还不是根节点的子节点，我们为 *m* 创建一个新节点。*monkey* 中的每个后续字母都从它开始延伸。我们快完成了，所以加快速度。\n\n下一个要表示的单词是\
  \ *dune*。我们知道字母 *d* 和 *u* 已经在字典树中，因此我们添加字母 *n* 和 *e*，它们建立在公共前缀 *du* 之上（图 12-11）。\n\
  \n![描述：计算机截图，自动生成描述置信度较低](img/12fig11.jpg)\n\n**图 12-11** *我们在公共前缀的基础上构建。*\n\n接下来要添加的两个单词是\
  \ *app* 和 *monk*。这两个单词分别包含在更大的单词 *apple* 和 *monkey* 中，因此我们只需将 *app* 和 *monk* 的最后一个字母标记为单词的结尾即可（图\
  \ 12-12）。\n\n![描述：计算机截图，自动生成描述置信度较低](img/12fig12.jpg)\n\n**图 12-12** *单词中的单词*\n\n\
  好了。至此，我们的字典树包含了 *apple*、*app*、*cat*、*dog*、*duck*、*dune*、*monkey* 和 *monk*。字典树中的元素已经足够多了。让我们看看其他操作。\n\
  \n#### 查找项目\n\n一旦字典树中填充了数据，最常见的操作之一就是搜索字典树，查看某个值或某些值是否存在。继续使用之前的字典树，假设我们要查看单词 *eagle*\
  \ 是否存在。我们将输入单词拆分为单个字符：*e, a, g, l, e*。\n\n我们检查第一个字母是否作为根节点的子节点存在（图 12-13）。\n\n![描述：包含圆形、截图、图形、平面设计的图片，自动生成描述](img/12fig13.jpg)\n\
  \n**图 12-13** *搜索的开始*\n\n根节点的起始字母有 *a*、*c*、*d* 和 *m*。字母 *e* 不存在，因此我们可以在此处停止搜索。如果第一个字母不存在，我们可以安全地断言后续所有字母也不会存在。\n\
  \n下一个任务是查看单词 *monk* 是否存在于字典树中。过程相同。我们检查要查找的单词的第一个字母（*m*）是否作为字典树的第一个字母存在。答案是肯定的（图\
  \ 12-14）。\n\n![描述：包含圆形、截图、时钟、艺术的图片，自动生成描述](img/12fig14.jpg)\n\n**图 12-14** *我们在字典树中找到了\
  \ monk 的 m。*\n\n然后，我们沿着 *m* 节点的路径继续，检查第二个字母（*o*）是否是其直接子节点（图 12-15）。\n\n![描述：包含截图、圆形、艺术的图片，自动生成描述](img/12fig15.jpg)\n\
  \n**图 12-15** *我们逐字母检查。*\n\n在我们的例子中，*o* 是 *m* 的直接子节点。注意，我们的搜索非常狭窄地集中在 *m* 节点的分支上，不关心其他节点的情况。继续，现在前两个字母匹配，我们重复相同的步骤，检查第三和第四个字母是否也匹配（图\
  \ 12-16）。\n\n![描述：包含圆形、艺术、灯光的图片，自动生成描述](img/12fig16.jpg)\n\n\n\n**图 12-16** *我们停留在同一分支上。*\n\
  \n*僧侣*中剩余的字母与我们字典树中的内容匹配。根据我们正在执行的操作，可能还有一步：\n\n1. 如果我们要检查**完整单词**是否存在于字典树中，那么我们需要确保最后一个字母被标记为单词的结尾。在我们的例子中，*僧侣*作为完整单词被添加到字典树中，字母*k*已被标记为其结尾。这方面没有问题。\n\
  2. 如果我们要检查**前缀**是否存在于字典树中，那么无需检查最后一个字符是否也被标记为单词结尾。我们的单词*僧侣*仍然会通过测试，但其他到达此处的前缀，如*m*、*mo*和*mon*，也会通过测试。\n\
  \n在搜索字典树时，完整单词和前缀之间的这种区别在各种情况下都很重要。如果我们想检查*僧侣*是否曾作为完整单词被添加到字典树中，那么完整单词搜索就很重要。如果我们想找到所有以*僧侣*开头的单词，那么前缀搜索就是我们使用的方法。在后续深入实现时，我们会看到这两种方法的一些示例。\n\
  \n#### 删除项目\n\n我们最后要研究的是如何从字典树中删除一个项目。由于我们已经详细讨论了如何添加和查找项目，删除项目就更加直接了。但我们需要记住一些额外的技巧。假设在字典树中，我们想要删除单词*鸭子*（图\
  \ 12-17）。\n\n![Description: A picture containing screenshot, circle, light, art\
  \ Description automatically generated](img/12fig17.jpg)\n\n**图 12-17** *删除项目稍微复杂一些。*\n\
  \n我们不能仅仅遍历这棵树并删除所有字符，因为：\n\n- ![Images](img/sq.jpg) 首先，我们需要确保要删除的单词确实存在于树中。\n- ![Images](img/sq.jpg)\
  \ 其次，我们需要确保如果某个字母被其他单词共享，我们不会删除它。以*鸭子*为例，字母*d*与*狗*和*沙丘*共享，字母*u*与*沙丘*共享。\n- ![Images](img/sq.jpg)\
  \ 最后，我们需要确保要删除的字母不是另一个单词的一部分。\n\n那么，我们该怎么做呢？我们需要执行三项检查。首先，检查要删除的单词是否存在于树中，并通过确认最后一个节点被标记为单词结尾来检查它。如果一切正常，此时我们位于要删除单词的最后一个字符处（图\
  \ 12-18）。\n\n![Description: A picture containing circle, screenshot, light, art\
  \ Description automatically generated](img/12fig18.jpg)\n\n**图 12-18** *删除从最后一个字母开始。*\n\
  \n接下来，我们以相反的顺序向上遍历树。对于遇到的每个字母，我们检查当前节点是否没有其他子节点，并且不是另一个单词的结尾。如果遇到的节点通过了这些检查，我们就删除该节点，并继续向上移动。这个过程一直持续到我们遇到一个有其他子节点或作为另一个单词结尾的节点。此时，删除过程停止。\n\
  \n在我们的示例中，要从字典树中删除*鸭子*，我们从末尾的字母*k*开始。这个节点可以安全删除，所以我们删除它。然后我们向上移动到字母*c*。这个节点也可以安全删除，所以现在的字典树如图图\
  \ 12-19 所示。\n\n![Description: A screenshot of a game Description automatically generated\
  \ with medium confidence](img/12fig19.jpg)\n\n**图 12-19** *鸭子值已不在字典树中。*\n\n我们遇到的下一个字母是*u*，而*u*有其他子节点。它是一个共享前缀，位于通往字母*n*的路径上，而*n*是单词*沙丘*的一部分。此时，我们可以停止删除操作。此后的情况无关紧要，因为其他单词依赖于前面的字母*d*和*u*的存在。\n\
  \n### 深入探讨字典树\n\n在上一节开始研究字典树时，我们有以下定义：\n\n字典树是一种基于树的数据结构，非常适合检索字符串或字符序列。\n\n让我们从显而易见的一点开始。我们的字典树是一种基于树的数据结构。我们可以看到确实如此（图\
  \ 12-20）。\n\n![Description: A picture containing christmas tree, christmas, tree\
  \ Description automatically generated](img/12fig20.jpg)\n\n**图 12-20** *字典树是基于树的数据结构。*\n\
  \n当我们检查数据的结构时，树的相似性仍然成立。我们有一系列节点，每个节点的值都是更大数据片段中的单个部分。在我们的示例中，单个部分是字母，更大的片段是单词。\n\
  \n现在，让我们谈谈房间里的大象：是什么让字典树在检索字符串或字符序列时如此高效？答案与我们试图做的事情有很大关系。字典树在非常特定的用例中很有帮助。**这些用例涉及根据不完整的输入搜索单词。**\
  \ 回到我们的示例，我们提供字符*d*，字典树可以快速返回*狗*、*鸭子*和*沙丘*作为可能的目标（图 12-21）。\n\n![Description: A\
  \ picture containing circle, screenshot, art, light Description automatically generated](img/12fig21.jpg)\n\
  \n**图 12-21** *所有以字母 d 开头的值都会很快返回。*\n\n相反，如果我们正在检查输入字符（即*d-o-g*）是否是一个单词，那么字典树就是错误的数据结构。我们可能需要像哈希表这样的东西，它可以快速告诉我们*完整*输入是否在一组存储的值中。\n\
  \n那么，在哪些情况下我们可能有不完整的输入，但仍然有足够的细节来快速找到最终值呢？让我们看看其中几个：\n\n- ![Images](img/sq.jpg)\
  \ **自动补全和预测文本**：重申我们在研究字典树时一开始就提到的观点，当我们在搜索引擎、电子邮件客户端或消息应用中开始输入单词或短语时，我们经常看到补全我们输入的提示（图\
  \ 12-22）。\n\n  ![Description: A screenshot of a computer Description automatically\
  \ generated with low confidence](img/12fig22.jpg)\n\n  **图 12-22** *自动补全的另一个示例*\n\
  \n  字典树可以非常高效地实现自动补全功能。字典树中的每个节点代表一个字符，从该节点出发的每个分支代表可能的下一个字符。通过根据用户输入遍历字典树，我们可以快速找到并建议最可能的补全，例如当输入为*m*时，建议*猴子*和*僧侣*。\n\
  \n- ![Images](img/sq.jpg) **拼写检查和纠正**：拼写检查器依赖词典来识别和纠正拼写错误的单词。字典树可以高效地存储词典，实现快速查找和建议替代单词（图\
  \ 12-23）。\n\n  ![Description: A screenshot of a computer Description automatically\
  \ generated with medium confidence](img/12fig23.jpg)\n\n  **图 12-23** *拼写检查进行中*\n\
  \n  正如我们已经多次看到的，每个节点代表一个字符，单词作为从根节点到叶节点的路径存储。当输入了错误（即拼写错误）的字符时，我们可以后退几步，看看哪条路径更有可能到达一个完整单词。\n\
  \n- ![Images](img/sq.jpg) **IP 路由和网络路由表**：在计算机网络中，IP 地址用于标识设备。字典树可以高效地存储和检索 IP 地址的路由信息（图\
  \ 12-24）。\n\n\n\n\n![描述：计算机屏幕截图，自动生成的描述](img/12fig24.jpg)\n\n**图 12-24** *路由表*\n\
  \n`trie` 中的每个节点代表 IP 地址的一部分，边则对应那部分可能的值。通过基于 IP 地址遍历 `trie`，路由器可以高效地确定网络中数据包路由的下一跳。\n\
  \n![图片](img/sq.jpg) **文字游戏与谜题：** `trie` 在 Scrabble 或 Wordle 这类文字游戏中非常实用，玩家需要根据给定的字母快速找出有效单词（图\
  \ 12-25）。\n\n![描述：游戏截图，中等置信度自动生成的描述](img/12fig25.jpg)\n\n**图 12-25** *文字游戏底层通常使用\
  \ trie。*\n\n通过构建一个表示字典的 `trie`，玩家可以高效地检查给定字母序列是否构成有效单词——只需遍历 `trie` 即可。\n\n### 更多示例不胜枚举！\n\
  \n以上只是 `trie` 能发挥巨大作用的众多用例中的几个例子。核心思想在于，`trie` 允许我们高效地存储、检索和操作单词或字符序列，使其非常适合涉及基于前缀的匹配、搜索或建议的任务。\n\
  \n注意\n\n为什么 Trie 有时被称为前缀树？\n\n`trie` 有时被称为前缀树，因为其全部功能都围绕前缀展开！`trie` 以树状结构存储单词，强调共同字母（即前缀）。`trie`\
  \ 中的每个节点代表一个字符，从根到某个节点的路径构成一个前缀。我们甚至可以更进一步，将一个完整单词视为一个前缀，只是其最后一个字符带有一个标记，表明它是一个单词。基于这些原因以及其他更多原因，我们经常会在其他书籍和在线资源中看到\
  \ `trie` 被称为前缀树。\n\n### 实现时刻\n\n现在我们已经能用语言描述 `trie` 的工作原理，接下来将文字和图示转化为代码。我们的 `trie`\
  \ 实现将支持以下操作：\n\n![图片](img/sq.jpg) 插入单词\n\n![图片](img/sq.jpg) 搜索单词是否存在\n\n![图片](img/sq.jpg)\
  \ 检查是否存在匹配给定前缀的单词\n\n![图片](img/sq.jpg) 返回所有匹配给定前缀的单词\n\n那么……不再赘述，以下是我们的代码：\n\n```\n\
  class TrieNode {\n  constructor() {\n    // Each TrieNode has a map of children\
  \ nodes,\n    // where the key is the character and the value is the\n    // child\
  \ TrieNode\n    this.children = new Map();\n\n    // Flag to indicate if the current\
  \ TrieNode represents the\n    // end of a word\n    this.isEndOfWord = false;\n\
  \  }\n}\n\nclass Trie {\n  constructor() {\n    // The root of the Trie is an empty\
  \ TrieNode\n    this.root = new TrieNode();\n  }\n\n  // Adds the word to trie\n\
  \  insert(word) {\n    let current = this.root;\n\n    for (let i = 0; i < word.length;\
  \ i++) {\n      const char = word[i];\n\n      // If the character doesn't exist\
  \ as a child node,\n      // create a new TrieNode for it\n      if (!current.children.get(char))\
  \ {\n        current.children.set(char, new TrieNode());\n      }\n\n      // Move\
  \ to the next TrieNode.\n      current = current.children.get(char);\n    }\n\n\
  \    // Mark the end of the word by setting isEndOfWord to true\n    current.isEndOfWord\
  \ = true;\n  }\n\n  // Returns true if the word exists in the trie\n  search(word)\
  \ {\n    let current = this.root;\n\n    for (let i = 0; i < word.length; i++) {\n\
  \      const char = word[i];\n\n      // If the character doesn't exist as a child\
  \ node,\n      // the word doesn't exist in the Trie\n      if (!current.children.get(char))\
  \ {\n        return false;\n      }\n\n      // Move to the next TrieNode.\n   \
  \   current = current.children.get(char);\n    }\n\n    // Return true if the last\
  \ TrieNode represents the end of a word\n    return current.isEndOfWord;\n  }\n\n\
  \  // Returns a true if the prefix exists in the trie\n  startsWith(prefix) {\n\
  \    let current = this.root;\n\n    for (let i = 0; i < prefix.length; i++) {\n\
  \      const char = prefix[i];\n\n      // If the character doesn't exist as a child\
  \ node,\n      // the prefix doesn't exist in the Trie\n      if (!current.children.get(char))\
  \ {\n        return false;\n      }\n\n      // Move to the next TrieNode.\n   \
  \   current = current.children.get(char);\n    }\n\n    // The prefix exists in\
  \ the Trie.\n    return true;\n  }\n\n  // Returns all words in the trie that match\
  \ a prefix\n  getAllWords(prefix = '') {\n    const words = [];\n\n    // Find the\
  \ node corresponding to the given prefix\n    const current = this.#findNode(prefix);\n\
  \n    if (current) {\n      // If the node exists, traverse the Trie starting from\
  \ that node\n      // to find all words and add them to the `words` array\n    \
  \  this.#traverse(current, prefix, words);\n    }\n\n    return words;\n  }\n\n\
  \  delete(word) {\n    let current = this.root;\n\n    const stack = [];\n\n   \
  \ let index = 0;\n\n    // Find the last node of the word in the Trie\n    while\
  \ (index < word.length) {\n      const char = word[index];\n\n      if (!current.children.get(char))\
  \ {\n        // Word doesn't exist in the Trie, nothing to delete\n        return;\n\
  \      }\n\n      stack.push({ node: current, char });\n\n      current = current.children.get(char);\n\
  \      index++;\n    }\n\n    if (!current.isEndOfWord) {\n      // Word doesn't\
  \ exist in the Trie, nothing to delete\n      return;\n    }\n\n    // Mark the\
  \ last node as not representing the end of a word\n    current.isEndOfWord = false;\n\
  \n    // Remove nodes in reverse order until reaching a node\n    // that has other\
  \ children or is the end of another word\n    while (stack.length > 0) {\n     \
  \ const { node, char } = stack.pop();\n\n      if (current.children.size === 0 &&\
  \ !current.isEndOfWord) {\n        node.children.delete(char);\n        current\
  \ = node;\n      } else {\n        break;\n      }\n    }\n  }\n\n  #findNode(prefix)\
  \ {\n    let current = this.root;\n    for (let i = 0; i < prefix.length; i++) {\n\
  \      const char = prefix[i];\n\n      // If the character doesn't exist as a child\
  \ node, the\n      // prefix doesn't exist in the Trie\n      if (!current.children.get(char))\
  \ {\n        return null;\n      }\n\n      // Move to the next TrieNode\n     \
  \ current = current.children.get(char);\n    }\n\n    // Return the node corresponding\
  \ to the given prefix\n    return current;\n  }\n\n  #traverse(node, prefix, words)\
  \ {\n    const stack = [];\n\n    stack.push({ node, prefix });\n\n    while (stack.length\
  \ > 0) {\n      const { node, prefix } = stack.pop();\n\n      // If the current\
  \ node represents the end of a word,\n      // add the word to the `words` array\n\
  \      if (node.isEndOfWord) {\n        words.push(prefix);\n      }\n\n      //\
  \ Push all child nodes to the stack to continue traversal\n      for (const char\
  \ of node.children.keys()) {\n        const childNode = node.children.get(char);\n\
  \        stack.push({ node: childNode, prefix: prefix + char });\n      }\n    }\n\
  \  }\n}\n```\n\n要查看我们的 `trie` 代码的实际运行效果，请添加以下代码：\n\n```\nconst trie = new Trie();\n\
  \ntrie.insert(\"apple\");\ntrie.insert(\"app\");\ntrie.insert(\"monkey\");\ntrie.insert(\"\
  monk\");\ntrie.insert(\"cat\");\ntrie.insert(\"dog\");\ntrie.insert(\"duck\");\n\
  trie.insert(\"dune\");\n\nconsole.log(trie.search(\"apple\")); // true\nconsole.log(trie.search(\"\
  app\")); // true\nconsole.log(trie.search(\"monk\")); // true\nconsole.log(trie.search(\"\
  elephant\")); // false\n\nconsole.log(trie.getAllWords(\"ap\")); // ['apple', 'app']\n\
  console.log(trie.getAllWords(\"b\")); // []\nconsole.log(trie.getAllWords(\"c\"\
  )); // ['cat']\nconsole.log(trie.getAllWords(\"m\")); // ['monk', 'monkey']\n\n\
  trie.delete(\"monkey\");\n\nconsole.log(trie.getAllWords(\"m\")); // ['monk']\n\
  ```\n\n我们的 `trie` 实现执行了之前详细讨论的所有操作，并且它使用 `hashmap` 作为底层数据结构，以高效地将每个节点上的字符映射到其子节点。许多\
  \ `trie` 实现也可能使用数组，这也是一个不错的数据结构。\n\n\n\n\n\n在我们结束本节之前，请花点时间通读代码，想象每一行是如何为我们的整体字典树设计做出贡献的。\n\
  \n### 性能\n\n我们快完成了。接下来讨论一下字典树的性能，重点关注底层使用哈希映射的字典树实现。从高层次来看，我们所有的字典树操作都受两个因素影响：\n\
  \n1.  我们处理的单词或前缀的长度\n2.  给定字母的子节点数量\n\n字典树中的插入、搜索和删除操作通常具有线性时间复杂度 O(`k`)，其中 `k`\
  \ 是输入单词的字符数。例如，如果我们将单词 duck 添加到字典树中，我们会分别处理 *d*、*u*、*c* 和 *k*（图 12-26）。\n\n![描述：一张包含圆形、色彩、光线的图片，自动生成的描述](img/12fig26.jpg)\n\
  \n**图 12-26** *深入观察插入行为*\n\n对于涉及大量字符的较长输入，需要做更多的工作。较短的输入所需的工作量较少。不过，工作量与输入的大小成正比。这使得这种情况成为完美的线性关系。\n\
  \n还有一点需要记住。我们的字典树实现使用哈希表（参见 [www.kirupa.com/data_structures_algorithms/hashtable_hashmap_dictionary.htm](http://www.kirupa.com/data_structures_algorithms/hashtable_hashmap_dictionary.htm)），我们之前刚刚学过，来跟踪字符和节点的映射。检查一个字符是否作为子节点存在，平均时间复杂度为\
  \ O(1)。在最坏的情况下，如果某个特定节点有异常多的子节点，时间复杂度可能达到 O(`N`)。我们的哈希实现使用了 JavaScript 内置的 `Map`\
  \ 对象，因此性能得到了很好的保障。如果你使用自己的哈希实现或使用像数组这样的替代数据结构，性能可能会下降。\n\n注意\n\n为什么是 O(`k`) 而不是\
  \ O(`n`)？\n\n为什么我们不直接用 O(`n`) 来描述时间复杂度？这并没有很强的理由。参数 `N` 通常指我们处理的总项目数以及与之相关的操作次数。对于我们的插入、搜索和删除操作，字典树中\
  \ `N` 个项目的总大小并不重要。唯一重要的是我们的输入大小，因此使用不同的符号似乎是合理的。\n\n最后，我们来谈谈内存。字典树的内存使用通常是 O(`N`)。我们占用的内存量与字典树中的条目数有关。使用哈希映射来跟踪子节点也会增加一些开销，但不足以让我们偏离\
  \ O(`N`) 的上限。\n\n简而言之，电梯演讲是这样的：字典树是非常高效的数据结构。这一点你可以放心！\n\n### 结论\n\n字典树数据结构，也称为前缀树，为处理单词及其前缀提供了高效的解决方案。字典树就像特殊的树，允许我们根据单词的共同开头来存储和搜索单词。通过将单词表示为从根节点到特定节点的路径，字典树以一种易于查找具有给定前缀的所有单词的方式组织信息。\n\
  \n字典树的真正魅力在于它们的高效性。正如我们在前面的一些例子中强调的那样，在很多情况下我们都需要处理单词。在这些情况下，字典树将成为你最好的朋友。\n\n一些额外资源：\n\
  \n![图片](img/sq1.jpg) 提问：[`forum.kirupa.com`](https://forum.kirupa.com)\n\n![图片](img/sq1.jpg)\
  \ 错误/已知问题：[`bit.ly/algorithms_errata`](https://bit.ly/algorithms_errata)\n\n![图片](img/sq1.jpg)\
  \ 源代码仓库：[`bit.ly/algorithms_source`](https://bit.ly/algorithms_source)\n\n## 13.\
  \ 图\n\n是时候学习图数据结构了。这种特殊的数据结构在众多应用中都有使用，并且具有如此多的优点，以至于存在一个名为图论的完整研究领域。每年都有聪明的人获得该领域的高级学位。有整面墙的书籍专门讨论这个主题。著名歌手还为此创作歌曲……好吧，也许没有。\n\
  \n需要强调的是，关于图有很多东西要学。我们当然不会在有限的时间内涵盖所有内容，但会涵盖我们在日常编程生活中最常遇到的主要主题。\n\n开始吧！\n\n###\
  \ 什么是图？\n\n图是一种组织信息并理解不同事物之间如何相互连接的方式。这种“相互连接”的部分很重要。图帮助我们找到并分析事物之间的关系。让我们从一个例子开始。\n\
  \n认识一下杰瑞，一位相当成功的喜剧演员，住在纽约市（图 13-1）。\n\n![描述：一张带有白色文本的黑色屏幕，自动生成的描述](img/13fig01.jpg)\n\
  \n**图 13-1** *我们图中的第一个元素*\n\n他有几个朋友，名叫伊莱恩、克莱默和乔治。我们可以像图 13-2 所示那样对杰瑞的友谊关系进行建模。\n\
  \n![描述：黑色背景上的一组名字，自动生成的描述](img/13fig02.jpg)\n\n**图 13-2** *我们图中的连接*\n\n我们这里得到的就是一个图。**节点**（也称为**顶点**或**点**）是杰瑞、伊莱恩、克莱默和乔治。节点之间的连接称为边（图\
  \ 13-3）。\n\n![描述：一个名字的图表，自动生成的描述](img/13fig03.jpg)\n\n**图 13-3** *节点和边*\n\n目前，这些边没有任何方向。它们被认为是**双向的**，即连接节点之间的关系是相互的。仅由双向边组成的图称为**无向图**（图\
  \ 13-4）。\n\n![描述：一个人名的图表，自动生成的描述](img/13fig04.jpg)\n\n**图 13-4** *我们的无向图*\n\n我们也可以像图\
  \ 13-5 那样可视化无向图，其中边的双向属性更加清晰，而我们模糊的单一路径被分离为专用路径。\n\n![描述：一个人名的图表，自动生成的描述](img/13fig05.jpg)\n\
  \n**图 13-5** *可视化无向图的另一种方式*\n\n在许多现实情况下，我们的图很少是无向的。它们的关系会有特定的顺序，某些连接可能是单向的。继续我们的例子，杰瑞有一个熟人叫纽曼。纽曼认为杰瑞是朋友（图\
  \ 13-6）。\n\n![描述：一组人的图表，自动生成的描述](img/13fig06.jpg)\n\n**图 13-6** *纽曼！*\n\n这种考虑不是相互的。杰瑞不认为纽曼是朋友，所以不会有从杰瑞指向纽曼的返回边。某些边具有方向的图，就像我们现在这样，称为**有向图**，或简称为**digraph**。\n\
  \n让我们继续详细说明杰瑞、伊莱恩、克莱默、乔治和纽曼之间的关系（图 13-7）。\n\n![描述：一个家庭的图表，自动生成的描述](img/13fig07.jpg)\n\
  \n**图 13-7** *我们的图建模的各种关系*\n\n我们现在可以看到，杰瑞、伊莱恩、克莱默和乔治彼此之间是相互的朋友。纽曼是克莱默的相互朋友，并且他与杰瑞之间是单向友谊。\n\
  \n\n\n\n图论中还有一个与**环**相关的细节。当存在一条起点和终点在同一节点的路径时，就形成了环。例如，我们之前展示杰瑞朋友关系的图就包含许多环，这些环的路径起点和终点都是同一个节点。如果只列出杰瑞相关的所有环，可以识别出以下路径：\n\
  \n![Images](img/sq.jpg) 杰瑞 → 乔治 → 伊莱恩 → 杰瑞\n\n![Images](img/sq.jpg) 杰瑞 → 乔治 → 伊莱恩\
  \ → 克莱默 → 杰瑞\n\n![Images](img/sq.jpg) 杰瑞 → 乔治 → 伊莱恩 → 克莱默 → 纽曼 → 杰瑞\n\n![Images](img/sq.jpg)\
  \ 杰瑞 → 乔治 → 克莱默 → 杰瑞\n\n![Images](img/sq.jpg) 杰瑞 → 伊莱恩 → 乔治 → 杰瑞\n\n![Images](img/sq.jpg)\
  \ 杰瑞 → 伊莱恩 → 克莱默 → 乔治 → 杰瑞\n\n![Images](img/sq.jpg) 杰瑞 → 伊莱恩 → 克莱默 → 纽曼 → 杰瑞\n\n\
  ![Images](img/sq.jpg) 杰瑞 → 克莱默 → 伊莱恩 → 杰瑞\n\n![Images](img/sq.jpg) 杰瑞 → 克莱默 → 伊莱恩\
  \ → 乔治 → 杰瑞\n\n![Images](img/sq.jpg) 杰瑞 → 克莱默 → 纽曼 → 杰瑞\n\n包含环的图通常被称为**环图**。我们也会遇到完全不包含环的图（图\
  \ 13-8）。\n\n![Description: A diagram of a network Description automatically generated](img/13fig08.jpg)\n\
  \n**图 13-8** *一个环图*\n\n这些图被称为**无环图**，而图中展示的是一种更具体的变体，称为**有向无环图**（简称**dag**），因为边具有方向性。此外，也存在无向的无环图。你能猜出这类图更常见的名称是什么吗？剧透警告！请看图\
  \ 13-9。\n\n![Description: A colorful circles and lines with dots Description automatically\
  \ generated](img/13fig09.jpg)\n\n**图 13-9** *我看到的是一棵树吗？*\n\n它们被称为**树**，这是我们之前花了不少时间研究的一种数据结构。没错，树是一种非常特殊的图。它们是无环的，因为不存在多条起点和终点相同的路径；它们是无向的，因为边是双向的。还有一点：表示树的图是**连通**的。连通意味着每对节点之间都存在一条路径。\n\
  \n理解连通图的最佳方式是观察一个**不连通**的图（图 13-10）。\n\n![Description: A screenshot of a computer\
  \ Description automatically generated](img/13fig10.jpg)\n\n**图 13-10** *一个不太连通的图*\n\
  \n注意，节点 B 和 C 漂浮在一个孤岛上，无法从其他任何节点到达 B 或 C。例如，从 F 到 B 或 C 有路径吗？没有。连通图则不会有这个问题（图 13-11）。\n\
  \n![Description: A diagram of a person riding a bike and a turtle Description automatically\
  \ generated](img/13fig11.jpg)\n\n**图 13-11** *一个完全连通的图*\n\n由 A 和 B 创建的路径将 B 和 C\
  \ 重新连接起来。现在，图中的每对节点都可以通过某条路径到达。\n\n### 图的实现\n\n现在我们已经对图是什么以及它的各种变体有了很好的了解，是时候转换思路，看看如何实际实现一个图了。如果退一步思考，我们对图最常见的操作包括：\n\
  \n![Images](img/sq.jpg) 添加节点\n\n![Images](img/sq.jpg) 定义节点之间的边\n\n![Images](img/sq.jpg)\
  \ 识别邻居：\n\n![Images](img/sq.jpg) 如果图是有向的，确保尊重边的方向\n\n![Images](img/sq.jpg) 如果图是无向的，所有与特定节点直接相连的节点都算作邻居\n\
  \n![Images](img/sq.jpg) 删除节点\n\n#### 表示节点\n\n在深入实现之前，有一个有趣的细节：我们究竟如何表示节点及其与邻居的关系？假设我们有一个图，其中节点\
  \ A 的连接如图 13-12 所示。\n\n![Description: A diagram of a network Description automatically\
  \ generated](img/13fig12.jpg)\n\n**图 13-12** *另一个图的示例*\n\n节点为 A、B、C、D。存在连接 A-B、A-C、A-D\
  \ 的边。由于图是无向的，边的方向是双向的，因此也存在连接 B-A、C-A、D-A 的边。\n\n回到节点 A，它的邻居是节点 B、C、D。有些节点邻居较少，有些则可能非常多。这完全取决于图所表示的数据类型和数据量。那么，我们该如何表示一个节点的邻居呢？一种非常流行的方法是使用**邻接表**。\n\
  \n使用邻接表时，每个节点都与一个相邻节点列表相关联。用当前示例粗略可视化如下：\n\n```\nA: [B, C, D]\nB: [A]\nC: [A]\n\
  D: [A]\n```\n\n这个列表在图的实现中可以采取多种形式。我们的列表可以是数组、映射、哈希表或其他数据结构。由于前面提到节点可能有大量邻居，我们需要选择一种能快速查找节点的数据结构。这就是为什么稍后你会看到我们用映射（即哈希表）数据结构来表示邻接表（参见[www.kirupa.com/data_structures_algorithms/hashtable_hashmap_dictionary.htm](http://www.kirupa.com/data_structures_algorithms/hashtable_hashmap_dictionary.htm)）。\n\
  \n通过使用映射，我们可以将*键*设为节点。*值*则是一个集合数据结构，其内容为所有邻居节点。集合非常适合，因为它不允许重复值。这确保了我们避免陷入循环重复添加同一节点的情况。\n\
  \n#### 代码\n\n在背景知识介绍完毕后，让我们直接进入正题，看看图数据结构的实现代码：\n\n\n\n\n```\nclass Graph {\n  constructor()\
  \ {\n    // Map to store nodes and their adjacent nodes\n    this.nodes = new Map();\n\
  \n    // Flag to indicate if the graph is directed or undirected\n    this.isDirected\
  \ = false;\n  }\n\n  // Add a new node to the graph\n  addNode(node) {\n    if (!this.nodes.has(node))\
  \ {\n      this.nodes.set(node, new Set());\n    }\n  }\n\n  // Add an edge between\
  \ two nodes\n  addEdge(node1, node2) {\n    // Check if the nodes exist\n    if\
  \ (!this.nodes.has(node1) || !this.nodes.has(node2)) {\n      throw new Error('Nodes\
  \ do not exist in the graph.');\n    }\n\n    // Add edge between node1 and node2\n\
  \    this.nodes.get(node1).add(node2);\n\n    // If the graph is undirected, add\
  \ edge in\n    // the opposite direction as well\n    if (!this.isDirected) {\n\
  \      this.nodes.get(node2).add(node1);\n    }\n  }\n\n  // Remove a node and all\
  \ its incident edges from the graph\n  removeNode(node) {\n    if (this.nodes.has(node))\
  \ {\n      // Remove the node and its edges from the graph\n      this.nodes.delete(node);\n\
  \n      // Remove any incident edges in other nodes\n      for (const [node, adjacentNodes]\
  \ of this.nodes) {\n        adjacentNodes.delete(node);\n      }\n    }\n  }\n\n\
  \  // Remove an edge between two nodes\n  removeEdge(node1, node2) {\n    if (this.nodes.has(node1)\
  \ && this.nodes.has(node2)) {\n      // Remove edge between node1 and node2\n  \
  \    this.nodes.get(node1).delete(node2);\n\n      // If the graph is undirected,\
  \ remove edge\n      // in the opposite direction as well\n      if (!this.isDirected)\
  \ {\n        this.nodes.get(node2).delete(node1);\n      }\n    }\n  }\n\n  // Check\
  \ if an edge exists between two nodes\n  hasEdge(node1, node2) {\n    if (this.nodes.has(node1)\
  \ && this.nodes.has(node2)) {\n      return this.nodes.get(node1).has(node2);\n\
  \    }\n    return false;\n  }\n\n  // Get the adjacent nodes of a given node\n\
  \  getNeighbors(node) {\n    if (this.nodes.has(node)) {\n      return Array.from(this.nodes.get(node));\n\
  \    }\n    return [];\n  }\n\n  // Get all nodes in the graph\n  getAllNodes()\
  \ {\n    return Array.from(this.nodes.keys());\n  }\n\n  // Set the graph as directed\n\
  \  setDirected() {\n    this.isDirected = true;\n  }\n\n  // Set the graph as undirected\n\
  \  setUndirected() {\n    this.isDirected = false;\n  }\n\n  // Check if the graph\
  \ is directed\n  isGraphDirected() {\n    return this.isDirected;\n  }\n}\n```\n\
  \n以下是一个示例，展示如何使用上述图实现来执行常见的图操作：\n\n```\n// Create a new graph\nconst characters\
  \ = new Graph();\ncharacters.setDirected();\n\n// Add nodes\ncharacters.addNode('Jerry');\n\
  characters.addNode('Elaine');\ncharacters.addNode('Kramer');\ncharacters.addNode('George');\n\
  characters.addNode('Newman');\n\n// Add edges\ncharacters.addEdge('Jerry', 'Elaine');\n\
  characters.addEdge('Jerry', 'George');\ncharacters.addEdge('Jerry', 'Kramer');\n\
  characters.addEdge('Elaine', 'Jerry');\ncharacters.addEdge('Elaine', 'George');\n\
  characters.addEdge('Elaine', 'Kramer');\ncharacters.addEdge('George', 'Elaine');\n\
  characters.addEdge('George', 'Jerry');\ncharacters.addEdge('George', 'Kramer');\n\
  characters.addEdge('Kramer', 'Elaine');\ncharacters.addEdge('Kramer', 'George');\n\
  characters.addEdge('Kramer', 'Jerry');\ncharacters.addEdge('Kramer', 'Newman');\n\
  characters.addEdge('Newman', 'Kramer');\ncharacters.addEdge('Newman', 'Jerry');\n\
  \n// Get the adjacent nodes of a node\nconsole.log(\"Jerry's neighbors: \");\nconsole.log(characters.getNeighbors('Jerry'));\n\
  \      // ['Elaine', 'George', 'Kramer']\n\nconsole.log(\"Newman's neighbors: \"\
  );\nconsole.log(characters.getNeighbors('Newman')); // ['Kramer', 'Jerry']\n\n//\
  \ Check if an edge exists between two nodes\nconsole.log(\"Does edge exist between\
  \ Jerry to Newman? \");\nconsole.log(characters.hasEdge('Jerry', 'Newman')); //\
  \ false\n\nconsole.log(\"Does edge exist between Newman to Jerry? \");\nconsole.log(characters.hasEdge('Jerry',\
  \ 'Newman')); // true\n\nconsole.log(\"Does edge exist between Elaine to George?\
  \ \");\nconsole.log(characters.hasEdge('Elaine', 'George')); // true\n\n// Get all\
  \ nodes in the graph\nconsole.log(\"All the nodes: \");\nconsole.log(characters.getAllNodes());\n\
  \     // ['Jerry', 'Elaine', 'Kramer', 'George', 'Newman']\n\n// Remove a node\n\
  console.log(\"Remove the node, Newman: \")\ncharacters.removeNode(\"Newman\");\n\
  console.log(characters.getAllNodes());\n    // ['Jerry', 'Elaine', 'Kramer', 'George']\n\
  \nconsole.log(\"Does edge exist between Kramer to Newman: \");\nconsole.log(characters.hasEdge('Kramer',\
  \ 'Newman')); // false\n```\n\n花点时间通读代码，尤其是注释。正如我们所见，这个图数据结构的实现与我们一直在描述的图类型非常吻合。这既好又不好。好是因为我们的代码中不应该有意外。不好是因为一个更完整的图实现会包含一些额外的功能……而我们的实现没有。请放心，在后续教程中深入探讨图时，我们会涉及那些缺失的部分。\n\
  \n### 结论\n\n图数据结构是计算机科学中那些你我都无法回避的基本概念之一。因为图提供了建模事物之间关系的强大方式，它们的实用性极高。我们习以为常的许多活动，例如使用在线地图导航、加入多人游戏、分析数据、在互联网上任意浏览，以及无数其他活动，都依赖于图数据结构提供的核心能力。我们仅仅触及了图能力的皮毛，因此本书将涵盖更多与图相关的内容。\n\
