  \n## 20. 深度优先搜索（DFS）与广度优先搜索（BFS）\n\n当我们观察图（或树）时，常常会看到一组排列整齐的节点，整个结构被完整地描绘出来（图 20-1）。\n\
  \n![描述：一个人骑自行车和一只乌龟的示意图，自动生成的描述](img/20fig01.jpg)\n\n**图 20-1** *我们的示例图*\n\n在现实场景中，这种完整描绘的视图是我们代码完全探索图之后的最终结果。当我们第一次遇到一个图时，图\
  \ 20-2 展示的是计算机所看到的内容。\n\n![描述：一个带有白色虚线的黑色矩形，自动生成的描述](img/20fig02.jpg)\n\n**图 20-2**\
  \ *探索初始阶段的图*\n\n这是一张空白未知的画布。我们必须主动地逐个节点探索图，才能最终绘制出所有节点和边的全貌。如何执行这种探索既是一门艺术，也是一门科学。这正是本章的主角——深度优先搜索（DFS）和广度优先搜索（BFS）——登场的地方。在接下来的章节中，我们将了解它们如何帮助我们全面探索一个图。\n\
  \n出发！\n\n### 两种探索方法的故事\n\nDFS 和 BFS 是用于探索图的两种方法。我们将深入探讨它们的具体工作原理，但先保持高层次的概述。假设我们有一张地图，上面有不同地点，如图\
  \ 20-3 所示。\n\n![描述：一张地图的截图，自动生成的描述](img/20fig03.jpg)\n\n**图 20-3** *我们的地图*\n\n我们的目标是从起点出发，探索图中所有地点。我们将分别使用\
  \ DFS 方法和 BFS 方法进行探索。完成后，我们将清楚地看到这两种方法的区别！\n\n#### 深度优先搜索概述\n\nDFS 就像探索地图时，先选择一个地点，沿着一条路径尽可能远地前进，然后回溯并尝试另一条路径（图\
  \ 20-4）。\n\n![描述：一张带有蓝色线条和红色 X 的地图，自动生成的描述](img/20fig04.jpg)\n\n**图 20-4** *DFS\
  \ 如何探索地图*\n\n这就像沿着一条路走，直到无法继续，然后返回并尝试另一条不同的路。我们一直这样做，直到探索完所有可能的路径。\n\n#### 广度优先搜索概述\n\
  \n相比之下，BFS 就像从某个地点开始，逐渐向外扩展（图 20-5）。\n\n![描述：一张城镇地图，自动生成的描述](img/20fig05.jpg)\n\n\
  **图 20-5** *BFS 如何探索地图*\n\n这类似于我们寻找某物时，先检查附近所有地方，然后再将搜索范围扩大到其他地方。\n\n#### 是的，它们不同！\n\
  \n如你所见，使用 DFS 或 BFS 的最终结果都是探索所有有趣的地标。巨大的差异在于我们如何进行这种探索。DFS 和 BFS 在这方面截然不同，我们将在下一节中超越一般性描述，更具体地了解它们的工作原理。\n\
  \n### 示例时间\n\n为了更深入地理解 DFS 和 BFS 的工作原理，让我们使用一个更真实的图示例。我们的示例图如图 20-6 所示。\n\n![描述：一个网络图，自动生成的描述](img/20fig06.jpg)\n\
  \n**图 20-6** *一个更真实的图*\n\n这个图相当简单。它是无向的、有环的，并且包含一组节点。在接下来的章节中，我们将逐步讲解如何探索其中包含的所有节点。\n\
  \n#### 使用 DFS 进行探索\n\nDFS 的工作原理是：从选定的节点开始，沿着每个分支尽可能远地探索，直到遇到死胡同，然后回溯（即*回溯*），再尝试下一个未探索的节点。示例时间到了。\n\
  \n对于图，我们可以从任意节点开始探索。为简单起见，我们从节点 A 开始（图 20-7）。\n\n![描述：一个视频游戏的截图，自动生成的描述](img/20fig07.jpg)\n\
  \n**图 20-7** *从节点 A 开始*\n\n让我们暂停一下，指出两点：\n\n![图片](img/sq.jpg) *探索*到底是什么意思？这是一种花哨的说法，表示我们正在发现从当前节点可以到达的任何直接相邻节点。\n\
  \n![图片](img/sq.jpg) 当我们开始探索时，我们的代码对图的其余部分一无所知。我们使用 DFS 和 BFS 来帮助我们绘制完整的图景。这就是为什么如图\
  \ 20-7 所示，我们只看到节点 A，而其他节点都是隐藏的。\n\n回到正题，我们位于节点 A，并准备探索它。这次探索让我们发现了节点 B、C 和 D（图 20-8）。\n\
  \n![描述：一个游戏的截图，自动生成的描述](img/20fig08.jpg)\n\n**图 20-8** *我们发现了未探索的子节点。*\n\n我们可以使用之前遍历二叉树时用过的相同术语——*已探索*和*已发现*——来记录我们的发现（图\
  \ 20-9）。\n\n![描述：一个视频游戏的截图，自动生成的描述](img/20fig09.jpg)\n\n**图 20-9** *记录我们探索的内容*\n\
  \n目前，我们的已探索列表只包含节点 A。已发现列表包含节点 B、C 和 D。\n\n接下来，我们探索已发现列表中的第一个节点——节点 B。当我们探索节点 B\
  \ 时，发现它的邻居是节点 A。由于我们已经探索过节点 A，**我们不认为这是一个新发现的节点。**\n\n因此，节点 B 没有新的邻居。我们将节点 B 从已发现列表中移除，并移到已探索列表中（图\
  \ 20-10）。\n\n![描述：一个视频游戏的截图，自动生成的描述](img/20fig10.jpg)\n\n**图 20-10** *继续我们的探索*\n\
  \n由于我们在 B 处遇到了死胡同，我们通过回溯步骤来*回溯*，并探索下一个最近的未探索节点，即已发现列表中的节点 C。当我们探索节点 C 时，发现它的邻居是节点\
  \ A 和 E。由于节点 A 已经被探索过，唯一新加入已发现列表的是节点 E。我们将节点 C 从已发现列表移到已探索列表，并将节点 E 添加到已发现列表的*前端*（图\
  \ 20-11）。\n\n![描述：一个带有彩色圆圈和线条的黑色背景，自动生成的描述](img/20fig11.jpg)\n\n**图 20-11** *更多要探索的节点！*\n\
  \n注意，我们没有将节点 E 添加到已发现列表的末尾，而是添加到了前端。这确保了它是我们接下来要探索的节点。这是 DFS 方法的一个重要实现细节，我们应该牢记。\n\
  \n当我们探索节点 E 时，发现邻居是节点 D 和 C。节点 C 我们已经探索过，而节点 D 已经在我们的待探索列表中。这使我们处于图 20-12 所示的状态。\n\
  \n![描述：一个电脑游戏的截图，自动生成的描述](img/20fig12.jpg)\n\n**图 20-12** *我们完成了对节点 E 的探索。*\n\n\
  由于没有新节点需要发现，我们接下来继续探索节点 D。当我们探索节点 D 时，发现节点 F 和 G 是未来要探索的新节点。节点 E 由于已经被探索过，被愉快地忽略了（图\
  \ 20-13）。\n\n![描述：一个游戏的截图，自动生成的描述](img/20fig13.jpg)\n\n\n\n\n\n**图 20-13** *探索节点\
  \ D，看看它隐藏了哪些细节！*\n\n如果我们加快一点速度，继续沿用目前的逻辑，接下来我们将探索节点 F。节点 F 有一个未探索的节点：节点 H（图 20-14）。\n\
  \n![描述：游戏截图，自动生成描述](img/20fig14.jpg)\n\n**图 20-14** *我们还有一些尚未探索的节点。*\n\n将节点 F 移入已探索列表后，我们将节点\
  \ H 添加到已发现列表的开头，并继续探索它（图 20-15）。\n\n![描述：电脑游戏截图，自动生成描述](img/20fig15.jpg)\n\n**图\
  \ 20-15** *只剩下节点 G 了。*\n\n节点 H 没有邻居，因此我们回溯到下一个未探索的节点，也就是……幸运的节点 G（图 20-16）。\n\n\
  ![描述：网络截图，自动生成描述](img/20fig16.jpg)\n\n**图 20-16** *完全探索的图！*\n\n节点 G 没有邻居。此时，我们再也没有需要进一步探索的节点了。我们的已发现列表为空。遇到这种情况时，我们可以肯定地说，我们已经完全探索了图中所有可达的部分。我们的\
  \ DFS 方法发现所有节点所经过的路径记录在已探索列表中：A-B-C-E-D-F-H-G。\n\n#### 使用 BFS 进行探索\n\n在 BFS 方法中，我们从给定节点开始，探索该节点的所有邻居，然后进入下一层节点。这与我们看到的\
  \ DFS 非常不同，这些差异将在我们逐步分析示例时变得清晰。\n\n我们从节点 A 开始探索（图 20-17）。\n\n![描述：一只鸟透过望远镜看，自动生成描述](img/20fig17.jpg)\n\
  \n**图 20-17** *再次从节点 A 开始*\n\n我们首先要做的是发现节点 A 是否有邻居。结果发现，它确实有（图 20-18）。\n\n![描述：视频游戏截图，自动生成描述](img/20fig18.jpg)\n\
  \n**图 20-18** *探索邻居*\n\n节点 A 有三个邻居，我们将它们记录在已发现列表中，以便稍后探索。接下来要探索的节点是已发现列表中的第一个节点：节点\
  \ B。节点 B 没有邻居，因此我们将其从已发现列表移至已探索列表（图 20-19）。\n\n![描述：视频游戏截图，自动生成描述](img/20fig19.jpg)\n\
  \n**图 20-19** *探索节点 B*\n\n到目前为止，我们早期的探索与之前 DFS 的探索非常相似。但这种情况很快就会改变。\n\n接下来要探索的节点是节点\
  \ C。节点 C 有一个邻居：节点 E（图 20-20）。\n\n![描述：黑色背景上彩色圆圈和线条，自动生成描述](img/20fig20.jpg)\n\n\
  **图 20-20** *探索节点 C*\n\n由于我们已经探索了节点 C，因此将其从已发现列表移至已探索列表。然后，我们将新发现的节点 E 添加到已发现列表中。注意我们添加的位置。我们不像\
  \ DFS 那样将其添加到列表的前面。不。**我们将其添加到已发现列表的末尾。** 在 BFS 方法中，任何新发现的节点总是追加到末尾。这确保了之前发现的节点在后续探索中保持更高的优先级。\n\
  \n这引出了我们即将探索的下一个节点：节点 D。节点 D 有两个邻居，节点 F 和 G（图 20-21）。\n\n![描述：游戏截图，自动生成描述](img/20fig21.jpg)\n\
  \n**图 20-21** *我们在这里走了一条与之前 DFS 不同的路径。*\n\n此时，节点 D 移入已探索列表，而我们的已发现列表现在包含节点 E、F 和\
  \ G。\n\n接下来要探索的节点是节点 E（图 20-22）。\n\n![描述：游戏截图，自动生成描述](img/20fig22.jpg)\n\n**图 20-22**\
  \ *是时候探索节点 E 了*\n\n节点 E 没有新的未探索邻居，因此我们只需将其移入已探索列表并继续。让我们加快一点速度。\n\n下一个要探索的节点是节点\
  \ F，它的邻居是节点 D 和 H（图 20-23）。\n\n![描述：电脑游戏截图，自动生成描述](img/20fig23.jpg)\n\n**图 20-23**\
  \ *接下来探索节点 F*\n\n节点 D 已经被探索过，但节点 H 是新的。我们将其添加到已发现列表的末尾，然后继续到节点 G（图 20-24）。\n\n![描述：电脑游戏截图，自动生成描述](img/20fig24.jpg)\n\
  \n**图 20-24** *我们的图即将被完全探索！*\n\n节点 G 没有未探索的邻居，因此我们将其标记为已探索，然后继续到节点 H（图 20-25）。\n\
  \n![描述：网络截图，自动生成描述](img/20fig25.jpg)\n\n**图 20-25** *我们最后探索节点 H。*\n\n节点 H 没有新的未探索邻居，因此我们将其移入已探索列表。此时，我们的已发现列表为空，没有更多节点需要发现。已探索列表记录了\
  \ BFS 方法探索所有节点的顺序：A-B-C-D-E-F-G-H。\n\n### 何时使用 DFS？何时使用 BFS？\n\n我们已经看到了两种探索图中所有连通节点的方法。我们首先研究了\
  \ DFS 及其探索节点的方式，即沿着每个分支尽可能深入，然后回溯（图 20-26）。\n\n![描述：网络图，自动生成描述](img/20fig26.jpg)\n\
  \n**图 20-26** *DFS 所走的路径*\n\n第二种方法 BFS 逐层探索节点，从初始节点开始向外扩展，在进入下一层之前访问所有邻居（图 20-27）。\n\
  \n![描述：网络图，自动生成描述](img/20fig27.jpg)\n\n**图 20-27** *BFS 所走的路径*\n\n这两种探索节点的方法导致了以下状态：\n\
  \n![图片](img/sq.jpg) BFS 以其谨慎检查直接邻居的方式，保证能找到两个节点之间的最短路径，或帮助逐层高效地探索图。\n\n![图片](img/sq.jpg)\
  \ DFS 更适合于查找两个节点之间的路径、检测环或搜索图中的特定条件等任务，因为它可能在回溯前穷举地探索单个分支，从而可能深入并探索更多节点。\n\n根据我们探索图的目的，我们将使用\
  \ DFS 或 BFS。如果我们只是想找到一种探索图中所有节点的方法，那么可以在 DFS 和 BFS 之间随机选择。两者都不会出错。\n\n### JavaScript\
  \ 实现\n\n现在我们已经详细了解了 DFS 和 BFS 如何探索图中的节点，让我们换个角度，看看这两种探索方法是如何实现的。我们将基于之前在图数据结构中看到的`Graph`类进行构建，因此很多代码都是熟悉的。一些新代码（已高亮显示）实现了\
  \ DFS 和 BFS 所需的功能：\n\n\n\n\n```\nclass Graph {\n  constructor() {\n    // Map to\
  \ store nodes and their adjacent nodes\n    this.nodes = new Map();\n\n    // Flag\
  \ to indicate if the graph is directed or undirected\n    this.isDirected = false;\n\
  \  }\n\n  // Add a new node to the graph\n  addNode(node) {\n    if (!this.nodes.has(node))\
  \ {\n      this.nodes.set(node, new Set());\n    }\n  }\n\n  // Add an edge between\
  \ two nodes\n  addEdge(node1, node2) {\n    // Check if the nodes exist\n    if\
  \ (!this.nodes.has(node1) || !this.nodes.has(node2)) {\n      throw new Error('Nodes\
  \ do not exist in the graph.');\n    }\n\n    // Add edge between node1 and node2\n\
  \    this.nodes.get(node1).add(node2);\n\n    // If the graph is undirected, add\
  \ edge in the opposite\n    // direction as well\n    if (!this.isDirected) {\n\
  \      this.nodes.get(node2).add(node1);\n    }\n  }\n\n  // Remove a node and all\
  \ its incident edges from the graph\n  removeNode(node) {\n    if (this.nodes.has(node))\
  \ {\n      // Remove the node and its edges from the graph\n      this.nodes.delete(node);\n\
  \n      // Remove any incident edges in other nodes\n      for (const [node, adjacentNodes]\
  \ of this.nodes) {\n        adjacentNodes.delete(node);\n      }\n    }\n  }\n\n\
  \  // Remove an edge between two nodes\n  removeEdge(node1, node2) {\n    if (this.nodes.has(node1)\
  \ && this.nodes.has(node2)) {\n      // Remove edge between node1 and node2\n  \
  \    this.nodes.get(node1).delete(node2);\n\n      // If the graph is undirected,\
  \ remove edge in the opposite\n      // direction as well\n      if (!this.isDirected)\
  \ {\n        this.nodes.get(node2).delete(node1);\n      }\n    }\n  }\n\n  // Check\
  \ if an edge exists between two nodes\n  hasEdge(node1, node2) {\n    if (this.nodes.has(node1)\
  \ && this.nodes.has(node2)) {\n      return this.nodes.get(node1).has(node2);\n\
  \    }\n    return false;\n  }\n\n  // Get the adjacent nodes of a given node\n\
  \  getNeighbors(node) {\n    if (this.nodes.has(node)) {\n      return Array.from(this.nodes.get(node));\n\
  \    }\n    return [];\n  }\n\n  // Get all nodes in the graph\n  getAllNodes()\
  \ {\n    return Array.from(this.nodes.keys());\n  }\n\n  // Set the graph as directed\n\
  \  setDirected() {\n    this.isDirected = true;\n  }\n\n  // Set the graph as undirected\n\
  \  setUndirected() {\n    this.isDirected = false;\n  }\n\n  // Check if the graph\
  \ is directed\n  isGraphDirected() {\n    return this.isDirected;\n  }\n\n  // Class\
  \ variable for storing explored nodes\n  #explored = new Set();\n\n  getExploredNodes()\
  \ {\n    return this.#explored;\n  }\n\n  //\n  // Depth First Search (DFS)\n  //\n\
  \  dfs(startingNode) {\n    // Reset to keep track of explored nodes\n    this.#explored\
  \ = new Set();\n\n    // Call the recursive helper function to start DFS\n    this.#dfsHelper(startingNode);\n\
  \  }\n\n  #dfsHelper(node) {\n    // Mark the current node as explored\n    this.#explored.add(node);\n\
  \n    // Get neighbors to explore in the future\n    const neighbors = this.getNeighbors(node);\n\
  \n    for (const neighbor of neighbors) {\n      if (!this.#explored.has(neighbor))\
  \ {\n        // Recursively call the helper function for unexplored neighbors\n\
  \        this.#dfsHelper(neighbor);\n      }\n    }\n  }\n\n  //\n  // Breadth First\
  \ Search (BFS)\n  //\n  bfs(startingNode) {\n    // Reset to keep track of explored\
  \ nodes\n    this.#explored = new Set();\n\n    // Queue to store nodes to be explored\n\
  \    const queue = new Queue();\n\n    // Mark the starting node as explored\n \
  \   this.#explored.add(startingNode);\n\n    // Enqueue the starting node\n    queue.enqueue(startingNode);\n\
  \n    while (queue.length > 0) {\n      // Dequeue a node from the queue\n     \
  \ const node = queue.dequeue();\n\n      const neighbors = this.getNeighbors(node);\n\
  \n      for (const neighbor of neighbors) {\n        if (!this.#explored.has(neighbor))\
  \ {\n          // Mark the neighbor as explored\n          this.#explored.add(neighbor);\n\
  \n          // Enqueue the neighbor to be explored\n          queue.enqueue(neighbor);\n\
  \        }\n      }\n    }\n  }\n}\n```\n\n这段代码使用了第 6 章中的队列实现。你可以直接复制该章节的实现，或者通过以下`script`标签直接引用：\n\
  \n```\n<script src=\"https://www.kirupa.com/js/queue_v1.js\"></script>\n```\n\n\
  我们当然可以修改这段代码，避免使用队列而直接使用数组，但性能开销可能会相当大——尤其是在处理大量节点时。\n\n#### 使用代码\n\n我们之前`Graph`实现的新增部分是`dfs`、`#dfsHelper`、`getExploredNodes`和`bfs`方法，以及一些私有变量。要执行探索，我们需要调用相应的`dfs`或`bfs`方法，并将起始节点作为参数传入。请看以下代码，我们重新创建了前面章节中看到的图，并对其执行了\
  \ DFS 和 BFS 操作：\n\n```\n// Our graph from earlier!\nconst graph = new Graph();\n\
  \ngraph.addNode(\"A\");\ngraph.addNode(\"B\");\ngraph.addNode(\"C\");\ngraph.addNode(\"\
  D\");\ngraph.addNode(\"E\");\ngraph.addNode(\"F\");\ngraph.addNode(\"G\");\ngraph.addNode(\"\
  H\");\n\ngraph.addEdge(\"A\", \"B\");\ngraph.addEdge(\"A\", \"C\");\ngraph.addEdge(\"\
  A\", \"D\");\ngraph.addEdge(\"C\", \"E\");\ngraph.addEdge(\"D\", \"E\");\ngraph.addEdge(\"\
  D\", \"F\");\ngraph.addEdge(\"D\", \"G\");\ngraph.addEdge(\"F\", \"H\");\n\nconsole.log(\"\
  DFS:\");\ngraph.dfs(\"A\"); // Perform DFS starting from node \"A\"\nconsole.log(graph.getExploredNodes());\n\
  \nconsole.log(\"BFS:\");\ngraph.bfs(\"A\"); // Perform BFS starting from node \"\
  A\"\nconsole.log(graph.getExploredNodes());\n```\n\n运行这段代码时，请注意控制台输出，我们打印了 DFS 和\
  \ BFS 两种方法最终探索到的节点。注意输出与我们之前手动遍历的结果一致。\n\n#### 实现细节\n\nDFS 和 BFS 的一个关键区别在于新发现的节点被添加到已发现列表的位置。\n\
  \n对于 DFS，新发现的项被添加到已发现列表的开头。这确保了 DFS 保持其深入探索一条路径的行为。对于 BFS，新发现的项被添加到已发现列表的末尾。这种行为确保了\
  \ BFS 在进入下一层之前，会先完全探索其直接邻居。\n\n我们的 DFS 和 BFS 实现反映了已发现项添加到已发现列表方式的差异。对于 DFS，我们对新发现的节点进行递归调用：\n\
  \n```\nfor (const neighbor of neighbors) {\n  if (!explored.has(neighbor)) {\n \
  \   // Recursively call the helper function for unexplored neighbors\n    this.#dfsHelper(neighbor,\
  \ explored);\n  }\n}\n```\n\n这使我们能够通过依赖底层运行时的调用栈来模拟栈的行为，从而保留待探索节点的顺序。\n\n对于 BFS，我们实现了一个队列来跟踪已发现的节点：\n\
  \n```\nfor (const neighbor of neighbors) {\n  if (!explored.has(neighbor)) {\n \
  \   // Mark the neighbor as explored\n    explored.add(neighbor);\n\n    // Enqueue\
  \ the neighbor to be explored\n    queue.enqueue(neighbor);\n  }\n}\n```\n\n这使我们能够高效地将项添加到末尾，并从开头移除项，以便进行更深入的探索。\n\
  \n### 性能细节\n\n在结束之前还有一点，那就是 DFS 和 BFS 在探索图时的效率问题。\n\n![图片](img/sq.jpg) DFS：\n\n\
  ![图片](img/sq.jpg) 运行时复杂度：DFS 的运行时复杂度取决于图的表示方式和实现。在最坏情况下，每个节点和边都被访问，DFS 的时间复杂度为`O(|N|\
  \ + |E|)`，其中|N|表示图中的节点数，|E|表示图中的边数。\n\n![图片](img/sq.jpg) 内存复杂度：DFS 的内存复杂度由递归的最大深度决定，这也是我们此处实现所采用的方法。在最坏情况下，当图形成一条长路径时，DFS\
  \ 可能需要`O(|N|)`的调用栈空间。\n\n![图片](img/sq.jpg) BFS：\n\n\n\n\n![Images](img/sq.jpg) **运行时复杂度：**\
  \ BFS 的运行时复杂度与 DFS 一样，也受图表示和实现方式的影响。在最坏情况下，当每个节点和边都被探索时，BFS 的时间复杂度为 **O(|N| + |E|)**。\n\
  \n![Images](img/sq.jpg) **内存复杂度：** BFS 的内存复杂度主要取决于存储已访问节点和用于遍历的队列所需的空间。在最坏情况下，当需要探索整个图时，BFS\
  \ 可能需要 **O(|N|)** 的空间。\n\n总体而言，如果我们要总结性能，可以稳妥地说 DFS 和 BFS 都以线性时间运行，并占用线性空间。这已经很不错了。\n\
  \n### 结论\n\n嗯，这真是太棒了！在前面的许多章节中，我们学习了如何使用 DFS 和 BFS 探索图中的所有节点！从表面上看，DFS 和 BFS 很相似。你向它们抛出一个起始节点和一个待探索的图，两种方法都会探索它们遇到的所有节点。它们的区别在于探索的方式。DFS\
  \ 沿着找到的第一条路径深入，直到遇到死胡同，然后回溯到最后一个未探索的节点，继续深入。BFS 则采用广度优先的方式。它首先探索所有直接相邻的节点，然后进入下一层，再探索该层的所有节点。这是一种逐步向外扩展的方法。\n\
  \n最终，通过学习 DFS 和 BFS，我们获得了处理各种图问题的宝贵工具。稍后我们会发现，DFS 和 BFS 是路径查找算法以及其他更有趣的图操作的基础构件。祝探索愉快！\n\
