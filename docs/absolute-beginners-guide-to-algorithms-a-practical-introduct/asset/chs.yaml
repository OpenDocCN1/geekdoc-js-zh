  \n## 8. 二叉树\n\n之前，我们学习了树数据结构，了解了各种节点和边的含义。现在是时候分支出去（哈！）并深入了。我们将在此基础上，研究树数据结构的一种具体实现——**二叉树**。\n\
  \n开始吧！\n\n### 认识二叉树\n\n从表面上看，二叉树看起来就像一棵普通的树，允许我们以层次方式存储数据。图 8-1 是一个二叉树的示例。\n\n![描述：包含圆形、艺术自动生成的图片](img/08fig01.jpg)\n\
  \n**图 8-1** *二叉树的示例*\n\n二叉树的不同之处在于，与普通树不同（普通树没有严格限制），二叉树必须遵守三条严格规则才能被归类为二叉树：\n\n\
  1. 每个节点只能有零个、一个或两个子节点。\n\n2. 树只能有一个根节点。\n\n3. 从根节点到任意节点只能有一条路径。\n\n\n\n让我们更深入地探讨这些规则，因为它们对于理解二叉树至关重要。它们有助于解释二叉树为何以这种方式运作，并为我们学习其他树变体（如二叉搜索树）奠定基础。\n\
  \n#### 规则详解\n\n第一条规则是，二叉树中的每个节点只能有零个、一个或两个子节点。如果某个节点恰好有两个以上的子节点，那就有问题了（图 8-2）。\n\
  \n![描述：包含圆形、截图、艺术描述自动生成的图片](img/08fig02.jpg)\n\n**图 8-2** *最多允许两个子节点*\n\n第二条规则是，二叉树必须只有一个根节点（图\
  \ 8-3）。\n\n![描述：包含圆形、截图、时钟、艺术描述自动生成的图片](img/08fig03.jpg)\n\n**图 8-3** *不能有多个根节点*\n\
  \n在这个例子中，A 节点和 AA 节点都在争夺成为主根节点。虽然在某些其他基于树的数据结构中允许多个根节点，但二叉树不允许。\n\n现在，我们来看最后一条规则。最后一条规则是，从根节点到树中任意节点只能有一条路径（图\
  \ 8-4）。\n\n![描述：包含圆形、截图、艺术描述自动生成的图片](img/08fig04.jpg)\n\n**图 8-4** *根节点与节点之间不能有多条路径*\n\
  \n正如这个例子所示，以节点 D 为目标，我们可以从根节点通过两种方式到达。一种方式是 A - B - D。另一种方式是 A - B - E - D。我们不能允许这种情况，否则就不能称之为二叉树。\n\
  \n#### 二叉树的变体\n\n即使有更严格的规则，二叉树仍然以几种流行的变体形式出现。这些变体对我们友好的二叉树在常见数据操作中的性能、占用空间等方面起着重要作用。现在，我们暂时避开数学，专注于高层次细节。\n\
  \n##### 满二叉树\n\n满二叉树，有时也称为**严格二叉树**或**真二叉树**，是一种所有非叶子节点都有两个子节点的树（图 8-5）。\n\n![描述：包含圆形、时钟、截图描述自动生成的图片](img/08fig05.jpg)\n\
  \n**图 8-5** *满二叉树示例*\n\n在这个例子中，我们可以看到非叶子节点 A、B 和 E 各有两个子节点。\n\n##### 完全二叉树\n\n完全二叉树是一种除了最后一层节点外，所有层的节点都被填满（每个父节点都有两个子节点）的树（图\
  \ 8-6）。\n\n![描述：包含圆形、截图、艺术描述自动生成的图片](img/08fig06.jpg)\n\n**图 8-6** *每个父节点都有两个子节点*\n\
  \n对于最后一层，节点的排列有一些规则。**如果最后一层有节点，这些节点必须从左到右连续填充，不能有空缺。** 例如，图 8-7 中的情况是不可接受的。\n\n\
  ![描述：包含圆形、截图、艺术描述自动生成的图片](img/08fig07.jpg)\n\n**图 8-7** *一棵不完全二叉树*\n\n这里有一个空缺：D\
  \ 节点缺少其右子节点，而 I 节点却作为 E 节点的子节点存在。这意味着我们没有从左到右连续填充最后一层的节点。如果 I 节点被插入为 D 节点的右子节点，那就没问题了。\n\
  \n##### 完美二叉树\n\n完美二叉树是一种每一层都完全填满节点的树（图 8-8）。\n\n![描述：包含圆形、截图、艺术描述自动生成的图片](img/08fig08.jpg)\n\
  \n**图 8-8** *完美的样子！*\n\n由于这一要求，所有叶子节点也都在同一层。\n\n##### 平衡二叉树\n\n平衡二叉树是一种每个节点的左右子树高度差不超过一的二叉树。图\
  \ 8-9 是一个平衡二叉树的例子。\n\n![描述：包含圆形、艺术描述自动生成的图片](img/08fig09.jpg)\n\n**图 8-9** *一棵平衡二叉树*\n\
  \n换句话说，这意味着树不会倾斜。所有节点都可以高效访问。\n\n##### 退化二叉树\n\n在退化二叉树中，每个父节点只有一个子节点（图 8-10）。\n\n\
  ![描述：包含时钟、圆形、截图描述自动生成的图片](img/08fig10.jpg)\n\n**图 8-10** *一棵退化二叉树*\n\n这棵树本质上是一个线性数据结构，类似于数组，所有节点通过单一路径连接。树状结构提供的任何优势在这里都丧失了；因此有了*退化*这个分类。\n\
  \n#### 添加、删除和查找节点呢？\n\n与任何数据结构一样，我们常见的操作是添加节点、删除节点以及查找我们需要的特定节点。重申我之前提到的一点，通用状态下的二叉树并不是非常高效的数据结构。学习如何对它们执行常见操作可能有助于积累一般知识，但这些操作在实际场景中不会太有用。与其介绍一些你很少受益的内容，我打算先搁置这个话题，在后续讨论更高效的二叉树实现——**二叉搜索树**——时再详细展开。\n\
  \n### 一个简单的二叉树实现\n\n在结束之前，让我们看一个简单的二叉树实现。我们实现的核心是节点，以下是在 JavaScript 中表示它的方式：\n\n\
  ```\nclass Node {\n  constructor(data) {\n    this.data = data;\n    this.left =\
  \ null;\n    this.right = null;\n  }\n}\n```\n\n我们有一个 `Node` 类，它接受一个 `data` 值作为参数，并将其存储为自身的\
  \ `data` 属性。我们的节点还存储了 `left` 和 `right` 两个附加属性。\n\n让我们用现有的代码重新创建以下二叉树（图 8-11）。\n\n\
  ![描述：包含圆形、时钟、截图描述自动生成的图片](img/08fig11.jpg)\n\n**图 8-11** *我们将要重新创建的二叉树示例*\n\n使用我们的\
  \ `Node` 类重新创建这棵二叉树的完整代码如下：\n\n```\nclass Node {\n  constructor(data) {\n    this.data\
  \ = data;\n    this.left = null;\n    this.right = null;\n  }\n}\n\nconst rootNodeA\
  \ = new Node(\"A\");\nconst nodeB = new Node(\"B\");\nconst nodeC = new Node(\"\
  C\");\nconst nodeD = new Node(\"D\");\nconst nodeE = new Node(\"E\");\nconst nodeF\
  \ = new Node(\"F\");\nconst nodeG = new Node(\"G\");\n\nrootNodeA.left = nodeB;\n\
  rootNodeA.right = nodeC;\n\nnodeB.left = nodeD;\nnodeB.right = nodeE;\n\nnodeE.left\
  \ = nodeF;\nnodeE.right = nodeG;\n```\n\n注意，我们为树中的每个节点创建了一个新的 `Node` 对象，传递给构造函数的参数是每个节点的字母值：\n\
  \n```\nconst rootNodeA = new Node(\"A\");\nconst nodeB = new Node(\"B\");\nconst\
  \ nodeC = new Node(\"C\");\nconst nodeD = new Node(\"D\");\nconst nodeE = new Node(\"\
  E\");\nconst nodeF = new Node(\"F\");\nconst nodeG = new Node(\"G\");\n```\n\n我们对\
  \ `Node` 对象的实现支持从简单（如字母）到非常复杂的数据。在某些情况下，我们的节点由数字组成。在其他情况下，我们的节点由复杂对象组成。我们将在后续章节中看到一些更复杂的例子。\n\
  \n一旦创建了节点，我们就将每个节点的 `left` 和 `right` 属性设置为相应的子节点：\n\n\n\n\n```\nrootNodeA.left =\
  \ nodeB;\nrootNodeA.right = nodeC;\n\nnodeB.left = nodeD;\nnodeB.right = nodeE;\n\
  \nnodeE.left = nodeF;\nnodeE.right = nodeG;\n```\n\n如果一个节点恰好是叶子节点，我们不需要做任何额外操作。可以安全地说，如果一个节点的\
  \ `left` 或 `right` 属性没有设置任何值，那么它就是叶子节点，没有子节点。\n\n### 结论\n\n在本章中，通过大量的文字和无数图表，我们学习了二叉树！核心要点是：二叉树是一种由节点组成的数据结构，并带有一个重要约束：**每个节点最多只能有两个子节点。**\
  \ 二叉树的这一独特约束使我们能够高效地搜索、排序和存储数据。不过，我们在这里并没有涉及这些内容，原因是二叉树本身过于通用。二叉树更有用的变体是**二叉搜索树**，我们将在第\
  \ 9 章中学习它。\n\n一些额外资源：\n\n![图片](img/sq1.jpg) 提问：<https://forum.kirupa.com>\n\n![图片](img/sq1.jpg)\
  \ 错误/已知问题：<https://bit.ly/algorithms_errata>\n\n![图片](img/sq1.jpg) 源代码仓库：<https://bit.ly/algorithms_source>\n\
  \n## 9. 二叉搜索树\n\n现在我们来学习另一种很棒的数据结构——**二叉搜索树**。如果我们从远处眯着眼看一棵二叉搜索树，它看起来和二叉树非常相似（图\
  \ 9-1）。\n\n![描述：一张包含截图、色彩、自动生成的描述的图片](img/09fig01.jpg)\n\n**图 9-1** *这可以是任何东西！*\n\
  \n这是有意为之。二叉树以其节点/边规则和理想的分支行为奠定了坚实的基础。二叉搜索树在普通二叉树的基础上进行了改进，增加了关于如何存储数据的额外逻辑，正是这个额外逻辑使得它在处理我们可能抛出的各种数据操作时非常高效。\n\
  \n从高层来看，二叉搜索树的设计使得每个节点的位置由其存储值的大小决定。值较小的节点放在左边，值较大的节点放在右边。请看图 9-2 中的二叉搜索树。\n\n![描述：一张包含圆形、截图、艺术、自动生成的描述的图片](img/09fig02.jpg)\n\
  \n**图 9-2** *二叉搜索树示例*\n\n从根节点开始，在每个节点处，请密切关注节点值及其子节点的值（如果有的话）。在每一层：\n\n![图片](img/sq.jpg)\
  \ 左侧子节点的值小于父节点的值。\n\n![图片](img/sq.jpg) 右侧子节点的值大于父节点的值。\n\n这两个额外规则建立在普通二叉树的三个规则之上，为我们提供了思考二叉搜索树的蓝图。接下来，我们将通过研究如何执行常见的添加和删除操作，更深入地了解二叉搜索树的工作原理。\n\
  \n继续前进！\n\n### 它只是一种数据结构\n\n在观察树的独特属性时，很容易陷入细节。如果我们退后几步，树就像数组、栈、队列、链表等一样，只是一种数据结构。它的存在是为了帮助我们操作或理解数据。在接下来的章节中，让我们看看二叉搜索树，以及如何向其中添加数据、删除数据等。\n\
  \n为了帮助理解，让我们从一张白纸开始（图 9-3）。\n\n![描述：一张包含文本、截图、圆形、自动生成的描述的图片](img/09fig03.jpg)\n\n\
  **图 9-3** *二叉搜索树的未来家园*\n\n没错！我们将从一个空的二叉搜索树开始，并逐步建立如何操作它的知识。\n\n#### 添加节点\n\n我们将让二叉搜索树存储一些数字。我们要存储的第一个数字是\
  \ 42，图 9-4 展示了添加后的二叉搜索树。\n\n![描述：一张包含图形、字体、符号、徽标、自动生成的描述的图片](img/09fig04.jpg)\n\n\
  **图 9-4** *二叉树的起点*\n\n它看起来不太像一棵树，这是因为我们的二叉搜索树原本是空的。我们只有一个单独的节点（恰好也是根节点！），值为 42。\n\
  \n接下来，让我们添加数字 24（图 9-5）。从现在开始，我们添加的每个新节点都必须是另一个节点的子节点。在我们的例子中，我们只有根节点 42，所以 24 节点将是它的子节点。问题是，它会放在左边还是右边？\n\
  \n![描述：一张包含截图、圆形、卡通、图形、自动生成的描述的图片](img/09fig05.jpg)\n\n**图 9-5** *我们的第一个节点会去哪里？*\n\
  \n这个问题的答案正是二叉搜索树的核心。重申我们之前提到的：\n\n![图片](img/sq.jpg) 如果要添加的值小于父节点，则放在左边。\n\n![图片](img/sq.jpg)\
  \ 如果要添加的值大于父节点，则放在右边。\n\n我们从根节点开始查找。在我们的树中，只有一个节点，即根节点 42。我们要添加的数字是 24。因为 24 小于\
  \ 42，所以我们将节点添加为左子节点（图 9-6）。\n\n![描述：一张带有白色文本的绿色和红色圆形，自动生成，置信度较低](img/09fig06.jpg)\n\
  \n**图 9-6** *相对于父节点较小的节点放在左边。*\n\n让我们再添加一个数字。这次要添加的数字是 99。我们按照相同的步骤操作。从根节点 42 开始。要添加的值是\
  \ 99，它大于根节点，所以放在右边（图 9-7）。\n\n![描述：一张带有白色文本的红色圆形，自动生成，置信度中等](img/09fig07.jpg)\n\n\
  **图 9-7** *99 节点放在右边。*\n\n我们还没有完成向树中添加更多数字。现在除了根节点外，我们还有几个额外的节点，事情变得更有趣了。下一个要添加的数字是\
  \ 15。我们从根节点开始。根节点值是 42，因为 15 小于 42，所以我们向左看。42 的左边是 24 节点。现在检查 15 是否小于 24。是的，所以再次向左看。24\
  \ 的左边没有更多节点，因此我们可以安全地将 15 放在那里（图 9-8）。\n\n![描述：一张包含时钟、圆形、截图、自动生成的描述的图片](img/09fig08.jpg)\n\
  \n**图 9-8** *我们新添加的节点*\n\n你应该开始看到一种模式了。添加新节点时，我们从根节点开始，在每个遇到的节点处询问：**该值大于还是小于当前节点？**\
  \ 如果遇到叶子节点，则该节点成为我们的父节点。我们是放在左边还是右边，同样取决于要添加的节点值小于还是大于新的父节点。\n\n现在我们将加快速度。下一个要添加的值是\
  \ 50。从根节点 42 开始。50 大于 42，所以向右看。右边有 99 节点。99 大于 50，所以向左看。99 节点的左边没有节点，因此我们将 50 值放在那里（图\
  \ 9-9）。\n\n![描述：一张包含圆形、截图、艺术、自动生成的描述的图片](img/09fig09.jpg)\n\n**图 9-9** *该节点放在根节点的右分支上。*\n\
  \n\n\n\n\n我们要添加的下一个值是 120。按照我们已经多次看到的相同步骤，这个值会出现在 99 节点的右侧（图 9-10）。\n\n![描述：一张包含时钟、圆形、截图的图片，自动生成的描述](img/09fig10.jpg)\n\
  \n**图 9-10** *120 的最终位置*\n\n我们要添加的最后一个数字是 64。花点时间看看它会落在哪里。如果一切顺利，它会成为 50 节点的右子节点（图\
  \ 9-11）。\n\n![描述：一张包含圆形、时钟、截图、艺术的图片，自动生成的描述](img/09fig11.jpg)\n\n**图 9-11** *我们的树越来越受欢迎了！*\n\
  \n按照步骤走，我们知道 64 大于根节点 42。它小于 99 节点，所以我们向左看，那里有 50 节点。64 大于 50，所以它向右……就这样！\n\n到目前为止，我们已经看了很多关于如何向二叉搜索树添加节点的例子。最需要注意的是，我们添加的每个节点最终都会成为树中的某个**叶子**节点。它最终的确切位置完全取决于它的值以及从根节点开始它需要经过的各个节点的值。\n\
  \n#### 删除节点\n\n有时我们会添加节点，有时也会删除节点。从二叉搜索树中删除节点比添加节点稍微复杂一些，因为行为取决于我们删除的是哪个节点。接下来我们逐一讨论这些情况。\n\
  \n##### 删除叶子节点\n\n如果我们要删除的节点是叶子节点，这个操作很简单。继续我们之前的二叉搜索树例子，假设我们要删除值为 64 的叶子节点（图 9-12）。\n\
  \n![描述：一张包含圆形、截图、艺术的图片，自动生成的描述](img/09fig12.jpg)\n\n**图 9-12** *我们要删除 64 节点。*\n\n\
  当我们删除它时，嗯……它就被删除了（图 9-13）。就这样。\n\n![描述：一张包含时钟、圆形、截图的图片，自动生成的描述](img/09fig13.jpg)\n\
  \n**图 9-13** *64 节点已被删除。*\n\n我们不需要做其他任何事情。因为它是叶子节点，树中的其他部分不受影响。但接下来要看到的情况就不一样了。\n\
  \n##### 删除只有一个子节点的节点\n\n删除叶子节点很简单，直接删除即可。但如果我们删除的不是叶子节点，而是一个只有一个子节点的节点呢？例如，假设我们要删除值为\
  \ 24 的节点（图 9-14）。\n\n![描述：一张包含圆形、时钟、截图、艺术的图片，自动生成的描述](img/09fig14.jpg)\n\n**图 9-14**\
  \ *删除 24 节点*\n\n当我们删除一个只有一个子节点的节点时，该子节点会取代被删除节点的位置。在我们的例子中，删除 24 节点后，15 节点会取代它的位置（图\
  \ 9-15）。\n\n![描述：一张包含时钟、圆形、截图的图片，自动生成的描述](img/09fig15.jpg)\n\n**图 9-15** *子节点取代了父节点的位置。*\n\
  \n由于我们最初向二叉搜索树添加节点的方式，将子节点提升到其父节点的位置不会破坏树的整体完整性，即每个节点左侧的值都小于右侧的值。\n\n还有一点需要澄清。当我们讨论删除只有一个子节点的节点时，我们指的是只有一个**直接**子节点。这个直接子节点本身可以有更多的子节点。请看图\
  \ 9-16。\n\n![描述：一张包含圆形、截图、艺术的图片，自动生成的描述](img/09fig16.jpg)\n\n**图 9-16** *删除 24 节点时会发生什么？*\n\
  \n我们要删除 24 节点，它有一个子节点 15。15 节点本身有两个子节点，但这个细节并不改变我们描述的行为。只要被删除的父节点只有一个直接子节点，这个直接子节点就会取代父节点的位置，并带上它可能拥有的任何子节点（图\
  \ 9-17）。\n\n![描述：一张包含圆形、时钟、截图、艺术的图片，自动生成的描述](img/09fig17.jpg)\n\n**图 9-17** *呼！24\
  \ 节点已被删除。*\n\n如果我们遍历这次调整后的树中所有节点，会再次发现树的完整性仍然保持。没有节点错位。\n\n##### 删除有两个子节点的节点\n\n\
  现在我们来看最后一种情况。当我们删除一个恰好有两个子节点的节点时会发生什么？请看图 9-18 中的例子，我们要删除 99 节点。\n\n![描述：一张计算机游戏的截图，自动生成的描述，置信度较低](img/09fig18.jpg)\n\
  \n**图 9-18** *删除一个包含两个子节点的节点*\n\n当删除一个有两个子节点的节点时，我们不能简单地选择其中一个子节点并认为操作成功。如果那样做，可能会发现树不再有效。有些节点可能会出现在错误的位置。\n\
  \n在这种情况下，我们要在右子树中寻找下一个最大值的节点，也称为**中序后继**。对于我们要删除值为 99 的节点的情况，右子树如（图 9-19）所示。\n\n\
  ![描述：一张包含圆形、截图、艺术的图片，自动生成的描述](img/09fig19.jpg)\n\n**图 9-19** *右子树*\n\n我们子树中哪个节点的值比\
  \ 99 大且是*下一个最大值*？换一种说法，当我们查看 99 节点*右侧*的所有子节点时，哪个节点的值最小？这两个问题的答案都是值为 104 的节点。接下来我们要删除\
  \ 99 节点，并用 104 节点替换它（图 9-20）。\n\n![描述：一张包含圆形、截图、艺术的图片，自动生成的描述](img/09fig20.jpg)\n\
  \n**图 9-20** *这次删除需要交换节点值。*\n\n当我们查看这次删除和交换后的二叉搜索树时，所有节点的完整性都得到了保持。当然，这并非偶然。中序后继节点的值总能确保它可以安全地放入被删除节点的位置。我们的\
  \ 104 节点取代 99 节点就是这种情况。对于其他要删除的节点也是如此。\n\n### 实现二叉搜索树\n\n如果我们要把所有的文字和图示总结成几条添加和删除节点的简单规则，那就是：\n\
  \n**添加节点时，执行以下操作：**\n\n1. 如果树为空，创建一个新节点并将其设为根节点。\n2. 将新节点的值与根节点的值进行比较。\n3. 如果新节点的值小于根节点的值，则对根节点的*左子树*重复步骤\
  \ 2 和 3。\n4. 如果新节点的值大于根节点的值，则对根节点的*右子树*重复步骤 2 和 3。\n5. 如果新节点的值与树中现有节点的值相等，则返回一条消息，指示该节点未被添加。\n\
  6. 创建一个新节点，并将其添加为应插入新节点的父节点的左子节点或右子节点。\n7. 如有必要，重新平衡树以保持二叉搜索树的性质。\n\n**删除节点时，执行以下操作：**\n\
  \n\n\n\n1. 找到要删除的节点。如果在树中找不到该节点，则返回一条消息，指示无法删除该节点。\n2. 如果要删除的节点没有子节点，则直接将其从树中移除。\n\
  3. 如果要删除的节点有一个子节点，则用该子节点替换它。\n4. 如果要删除的节点有两个子节点，则找到它的中序后继节点：\n    a. 要找到中序后继节点，先向右走一次，然后尽可能向左走。\n\
  \    b. 用中序后继节点替换要删除的节点。\n5. 如有必要，重新平衡树以保持二叉搜索树的性质。\n\n仔细阅读上述步骤，确保没有令人意外的地方。它们几乎就是我们在前面章节中看到的内容的\
  \ TL;DR 版本。我们的代码主要会模仿前面的步骤。事实上，现在让我们看看代码！\n\n我们的二叉搜索树实现由我们熟悉的 `Node` 类和 `BinarySearchTree`\
  \ 类组成：\n\n```\nclass Node {\n  constructor(data) {\n    this.data = data;\n    this.left\
  \ = null;\n    this.right = null;\n  }\n}\n\nclass BinarySearchTree {\n  constructor()\
  \ {\n    this.root = null;\n  }\n\n  insert(value) {\n    // Create a new node with\
  \ the given value\n    const newNode = new Node(value);\n\n    // If the tree is\
  \ empty, the new node becomes the root\n    if (this.root === null) {\n      this.root\
  \ = newNode;\n      return this;\n    }\n\n    // Traverse the tree to find the\
  \ correct position for the new node\n    let currentNode = this.root;\n\n    while\
  \ (true) {\n      if (value === currentNode.data) {\n        // If the value already\
  \ exists in the tree, return undefined\n        return undefined;\n      } else\
  \ if (value < currentNode.data) {\n        // If the value is less than the current\
  \ node's value, go left\n        if (currentNode.left === null) {\n          //\
  \ If the left child is null, the new node becomes\n          // the left child\n\
  \          currentNode.left = newNode;\n          return this;\n        }\n    \
  \    currentNode = currentNode.left;\n      } else {\n        // If the value is\
  \ greater than the current node's value,\n        // go right\n        if (currentNode.right\
  \ === null) {\n          // If the right child is null, the new node becomes\n \
  \         // the right child\n          currentNode.right = newNode;\n         \
  \ return this;\n        }\n        currentNode = currentNode.right;\n      }\n \
  \   }\n  }\n\n  remove(value) {\n    // Start at the root of the tree\n    let currentNode\
  \ = this.root;\n    let parentNode = null;\n\n    // Traverse down the tree to find\
  \ the node to remove\n    while (currentNode !== null) {\n      if (value === currentNode.data)\
  \ {\n        // If we found the node to remove, proceed with removal process\n \
  \       if (currentNode.left === null && currentNode.right === null) {\n       \
  \   // Case 1: Node has no children\n          if (parentNode === null) {\n    \
  \        // If the node is the root of the tree\n            this.root = null;\n\
  \          } else {\n            // If the node is not the root of the tree\n  \
  \          if (parentNode.left === currentNode) {\n              parentNode.left\
  \ = null;\n            } else {\n              parentNode.right = null;\n      \
  \      }\n          }\n          return true;\n        } else if (currentNode.left\
  \ !== null &&\n                   currentNode.right === null) {\n          // Case\
  \ 2: Node has one child (left child only)\n          if (parentNode === null) {\n\
  \            // If the node is the root of the tree\n            this.root = currentNode.left;\n\
  \          } else {\n            // If the node is not the root of the tree\n  \
  \          if (parentNode.left === currentNode) {\n              parentNode.left\
  \ = currentNode.left;\n            } else {\n              parentNode.right = currentNode.left;\n\
  \            }\n          }\n          return true;\n        } else if (currentNode.left\
  \ === null &&\n                   currentNode.right !== null) {\n          // Case\
  \ 2: Node has one child (right child only)\n          if (parentNode === null) {\n\
  \            // If the node is the root of the tree\n            this.root = currentNode.right;\n\
  \          } else {\n            // If the node is not the root of the tree\n  \
  \          if (parentNode.left === currentNode) {\n              parentNode.left\
  \ = currentNode.right;\n            } else {\n              parentNode.right = currentNode.right;\n\
  \            }\n          }\n          return true;\n        } else {\n        \
  \  // Case 3: Node has two children\n          // Find the inorder successor of\
  \ the node to remove\n          let successor = currentNode.right;\n          let\
  \ successorParent = currentNode;\n\n          while (successor.left !== null) {\n\
  \            successorParent = successor;\n            successor = successor.left;\n\
  \          }\n\n          // Replace the node to remove with the inorder successor\n\
  \          if (successorParent.left === successor) {\n            successorParent.left\
  \ = successor.right;\n          } else {\n            successorParent.right = successor.right;\n\
  \          }\n\n          currentNode.data = successor.data;\n          return true;\n\
  \        }\n      } else if (value < currentNode.data) {\n        // If the value\
  \ we're looking for is less than\n        // the current node's value, go left\n\
  \        parentNode = currentNode;\n        currentNode = currentNode.left;\n  \
  \    } else {\n        // If the value we're looking for is greater than\n     \
  \   // the current node's value, go right\n        parentNode = currentNode;\n \
  \       currentNode = currentNode.right;\n      }\n    }\n\n    // If we reach this\
  \ point, the value was not found in the tree\n    return false;\n  }\n}\n```\n\n\
  快速浏览一下上面的代码。注释标出了重要的里程碑，特别是与我们一直在研究的二叉搜索树行为相关的内容。要查看这段代码的实际运行效果，这里有一个示例：\n\n```\n\
  let myBST = new BinarySearchTree();\n\nmyBST.insert(10);\nmyBST.insert(5);\nmyBST.insert(15);\n\
  myBST.insert(3);\nmyBST.insert(7);\nmyBST.insert(13);\nmyBST.insert(18);\nmyBST.insert(20);\n\
  myBST.insert(12);\nmyBST.insert(14);\nmyBST.insert(19);\nmyBST.insert(30);\n```\n\
  \n我们正在创建一个新的二叉搜索树，并向其中添加一些节点。这棵树将如图 图 9-21 所示。\n\n![描述：一张包含圆形、截图、艺术描述的图片，自动生成](img/09fig21.jpg)\n\
  \n**图 9-21** *我们的新二叉树*\n\n假设我们要删除节点 15：\n\n```\nmyBST.remove(15);\n```\n\n我们的树将重新排列，如图\
  \ 图 9-22 所示。\n\n![描述：一张包含圆形、截图、艺术描述的图片，自动生成](img/09fig22.jpg)\n\n**图 9-22** *删除节点\
  \ 15 后的二叉树*\n\n节点 15 消失了，但节点 18 作为合法的中序后继节点取代了它的位置。你可以随意添加和删除更多节点，看看树会变成什么样子。要轻松查看所有节点之间的关联，最简单的方法是在控制台中检查你的二叉搜索树，并展开每个左节点和右节点，直到你对树的结构有了清晰的认识（图\
  \ 9-23）。\n\n![描述：一张计算机截图，中等置信度自动生成](img/09fig23.jpg)\n\n**图 9-23** *运行代码的输出*\n\n\
  如果你想更进一步，可以创建一个方法，在控制台中打印出树的 ASCII 艺术表示，如果你已经做过类似的事情，请告诉我。\n\n### 性能与内存特性\n\n二叉搜索树的性能与树的平衡程度有关。在完全平衡的树中，常见的操作如搜索、插入和删除节点将花费\
  \ `O(log n)` 时间（图 9-24）。\n\n![描述：一张包含圆形、截图、艺术描述的图片，自动生成](img/09fig24.jpg)\n\n**图\
  \ 9-24** *一棵完全平衡的树*\n\n\n\n这是因为我们可以避免为了找到某个节点而走非常独特的超长路径。最坏的情况是当我们的树严重不平衡时（图 9-25）。\n\
  \n![描述：一张包含圆形、艺术图案的图片，自动生成](img/09fig25.jpg)\n\n**图 9-25** *我们最终的二叉搜索树*\n\n在这棵树中，如果我们的节点恰好位于右子树的深处，那么相对于树中节点的总数，我们将探索大量节点。这会使运行时间接近\
  \ O(`n`)，也就是最坏情况。\n\n至于二叉搜索树占用的内存量，这并不取决于树是平衡还是不平衡。它始终是 O(`n`)，其中每个节点占用固定大小的内存。\n\
  \n### 结论\n\n二叉搜索树相当不错。它们是一种带有额外约束的二叉树，使其更适合繁重的数据处理。这些约束确保左子节点始终小于父节点，右子节点始终大于父节点。此外，还有一些关于节点在添加或删除时如何排列和重新排列的规则。\n\
  \n这种结构使我们能够以 O(log `n`) 的时间复杂度高效地执行搜索、插入和删除操作，这使得二叉搜索树成为一种流行的数据结构。然而，正如我们刚才看到的，二叉搜索树的性能会受到其平衡性的影响。对于严重不平衡的树，这可能导致时间复杂度为\
  \ O(`n`) 的最坏情况。\n\n一些额外资源：\n\n![图片](img/sq1.jpg) 提问：[`forum.kirupa.com`](https://forum.kirupa.com)\n\
