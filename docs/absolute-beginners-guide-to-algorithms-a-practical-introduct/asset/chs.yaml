  \n## 2. 大 O 符号与复杂度分析\n\n在分析代码执行情况时，我们关注两个要点：时间复杂度和空间复杂度。时间复杂度指代码运行所需的时间，空间复杂度指代码运行所需的额外内存。\n\
  \n理想情况下，我们希望代码运行得尽可能快，同时占用尽可能少的内存。但现实情况更为复杂，因此我们需要一种统一的方式来描述代码的运行方式、运行时间以及占用空间。我们需要一种方法来比较解决某个问题的不同方案哪个更高效。这就是大\
  \ O 符号（读作“Big Oh”），接下来我们将全面学习它。\n\n开始吧！\n\n### 示例时间\n\n为了更好地理解大 O 符号，我们来看一个例子。有一段代码，它接收一个数字作为输入，并告诉我们这个数字有多少位。如果输入数字是\
  \ 3415，那么位数就是 4（图 2-1）。\n\n![描述：黑色背景上的红色和黄色文字，低置信度自动生成的描述](img/02fig01.jpg)\n\n\
  **图 2-1** *数字的位数*\n\n如果输入数字是 241,539，那么位数就是 6（图 2-2）。\n\n![描述：包含文字、字体、时钟、截图的图片，自动生成](img/02fig02.jpg)\n\
  \n**图 2-2** *对于更大的数字，位数也会更多。*\n\n如果我们要简化行为，计算位数所需的工作量与输入数字的大小呈**线性**关系（图 2-3）。\n\
  \n![描述：包含文字、截图、字体、图形的图片，自动生成](img/02fig03.jpg)\n\n**图 2-3** *步骤数量呈线性增长。*\n\n我们提供的输入数字越大，需要计数的位数就越多，才能得到最终答案。关键在于，每增加一位数字，计算步骤不会异常地变大（或变小）。我们可以通过绘制*输入大小*与*所需步骤数*的关系图来直观地看到这一点（图\
  \ 2-4）。\n\n![描述：黑色背景上的蓝色线条，中等置信度自动生成的描述](img/02fig04.jpg)\n\n**图 2-4** *工作量与输入大小呈线性关系。*\n\
  \n这里我们看到的是线性增长的可视化！线性增长只是我们将遇到的众多增长率之一。\n\n假设我们还有一段代码，用来判断输入数字是**奇数**还是**偶数**。判断一个数字奇偶性的方法很简单，只需看最后一位数字，然后快速计算（图\
  \ 2-5）。\n\n![描述：计算器截图，自动生成](img/02fig05.jpg)\n\n**图 2-5** *只需看最后一位数字就能判断奇偶性。*\n\n\
  在这种情况下，输入数字的大小并不重要。我们的工作量始终不变。我们总是检查最后一位数字，然后快速判断整个数字是奇数还是偶数。我们可以简化地说，这里的计算工作量是**恒定**的（图\
  \ 2-6）。\n\n![描述：黑色背景上的蓝色线条，中等置信度自动生成的描述](img/02fig06.jpg)\n\n**图 2-6** *工作量是恒定的。*\n\
  \n注意，在这张步骤数与输入大小的关系图中，工作量不会随输入大小而改变。它保持不变……恒定不变！\n\n### 大 O 符号时间！\n\n你可能在某个时候听过一句老话：\n\
  \n**别为小事烦恼，关注大事！**\n\n在分析代码性能时，我们很容易纠结于各种细节。重要的是代码的工作量与输入大小之间的关系。这就是大 O 符号的用武之地。\n\
  \n大 O 符号是一种数学表达方式，用于描述代码在不同输入大小下运行的**上界**或**最坏情况**。它关注的是随着输入规模增大，影响算法性能的最主要因素。我们在实际中遇到的大\
  \ O 符号需要一点时间来适应。如果我们要描述之前的线性情况，大 O 符号会像图 2-7 这样。\n\n![描述：包含截图、线条、图表、图形的图片，自动生成](img/02fig07.jpg)\n\
  \n**图 2-7** *线性关系的大 O 符号*\n\n大 O 符号看起来有点像函数调用，但我们不应这样理解。如果我们要分解这个符号的每个部分，如下所示：\n\
  \n![图片](img/sq.jpg) 大 O 中的*O*，以及 O(…)，代表“阶”。它表示算法的增长率。重申一下，增长率可以从时间（运行时间）或空间（内存使用）的角度来衡量。\n\
  \n![图片](img/sq.jpg) *n*，即 O 的参数，代表在最坏情况下代码执行的操作次数。\n\n例如，如果我们的代码的大 O 符号是 O(*n*)，意味着代码的运行时间或空间需求与输入大小呈线性增长。如果输入大小翻倍，时间或空间需求也会翻倍。另一方面，如果代码的大\
  \ O 符号是 O(*n*²)，意味着算法的运行时间或空间需求与输入大小呈二次增长。如果输入大小翻倍，时间或空间需求将增加四倍。可怕的是，二次增长还不是最糟糕的，我们稍后会介绍其他情况。\n\
  \n现在，大 O 符号不会关注无关的修饰符。以线性情况为例，无论*n*的*真实*值是 O(2*n*)、O(*n* + 5)还是 O(4*n* − *n*/2)等，都没有关系。我们只关注最主要因素。这意味着我们忽略修饰符，将代码的时间或空间复杂度简化为\
  \ O(*n*)。从 O(*n*)到 O(2*n*)似乎会导致更多的工作（图 2-8）。\n\n![描述：包含截图、线条、色彩、图形的图片，自动生成](img/02fig08.jpg)\n\
  \n**图 2-8** *O(2n) 与 O(n) 的对比*\n\n当我们放眼全局，讨论非常大的输入大小时，这种差异微不足道。尤其是当我们看到*n*的其他各种取值类别时更是如此！理解这一切的最佳方式是查看*n*的每个主要取值及其输入与复杂度关系图（图\
  \ 2-9）。\n\n![描述：包含截图的图片，自动生成](img/02fig09.jpg)\n\n**图 2-9** *输入与复杂度关系图*\n\n让我们为前面的图片添加一些文字和额外细节，以便更好地解释复杂度：\n\
  \n\n\n\n\n![Images](img/sq.jpg) **O(1)—常数复杂度**：这种表示法代表代码的运行时间或空间增长是恒定的，与输入规模无关。这意味着无论数据集变得多大，执行复杂度都保持不变。例如，通过索引访问数组中的元素，或执行简单的数学运算（如判断一个值是偶数还是奇数）。\n\
  \n![Images](img/sq.jpg) **O(log `n`)—对数复杂度**：具有对数时间或空间复杂度的代码，其增长随输入规模增大而缓慢增加。这类编码方法通常将输入反复分割成更小的部分，例如二分查找。当输入规模翻倍时，所需步骤数仅增加一个很小的因子，而非成比例增加。\n\
  \n![Images](img/sq.jpg) **O(`n`)—线性复杂度**：线性时间复杂度意味着代码的运行时间或空间随输入规模线性增长。随着输入规模增大，所需的时间或空间也成比例增加。例如，遍历数组或链表并对每个元素执行操作。\n\
  \n![Images](img/sq.jpg) **O(`n` log `n`)—线性对数复杂度**：具有线性对数复杂度的算法，其运行值是线性增长速率与对数增长速率的乘积。这类算法常见于高效的排序算法中，如归并排序和快速排序。\n\
  \n![Images](img/sq.jpg) **O(`n`²)—平方复杂度**：平方时间复杂度意味着代码的运行时间或空间增长随输入规模呈平方级增加。这类编码方法通常涉及嵌套迭代，其中操作次数与输入规模的平方成正比。例如，冒泡排序和选择排序。\n\
  \n![Images](img/sq.jpg) **O(2^`n`)—指数复杂度**：指数时间复杂度代表代码的运行时间（或占用空间）随输入规模呈指数级增长。这类编码方法效率极低，对于较大的输入规模变得不切实际。当我们使用暴力或穷举搜索策略解决问题时，就会得到指数时间复杂度。\n\
  \n![Images](img/sq.jpg) **O(`n`!)—阶乘复杂度**：阶乘时间复杂度是给代码贴上的最严重、最低效的标签。它代表运行时间与输入规模的阶乘成正比的编码方法。随着输入规模增大，所需操作数量以天文数字的速度增长。当我们尝试使用暴力方法探索问题的所有可能排列或组合时，就会遇到阶乘时间和空间复杂度。\n\
  \n在我们一起研究数据结构和算法时，会频繁使用大 O 表示法来描述某些操作的效率（或低效）。因此，广泛理解大 O 的各种值代表什么，以及遇到这种表示法时如何解读，对我们来说非常重要。\n\
  \n注意\n\n大 O、大Θ和大Ω\n\n在某些情况下，我们可能会遇到其他表示法来描述代码行为的时间或空间复杂度。我们在这里看到，大 O 代表最坏情况。大Θ（Θ）表示法代表平均情况，而大Ω（Ω）表示法代表最佳情况。当我们看到这些非大\
  \ O 表示法出现时，现在我们知道如何解读它们了。\n\n### 结论\n\n好了！是时候总结一下了。大 O 表示法是一种数学表示法，用于描述代码时间或空间复杂度的上界或最坏情况。从数学角度来说，它为代码的增长率提供了一个渐近上限。通过使用大\
  \ O 表示法，我们可以用一种普遍理解和一致的方式来讨论代码复杂度。它使我们能够分析和比较不同编码方法的效率，帮助我们在代码运行环境的背景下决定哪些权衡是值得的。\n\
