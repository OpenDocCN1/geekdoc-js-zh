  \n## 14. 递归简介\n\n递归是一种强大的编程技术，它允许我们将庞大而复杂的问题分解成更小、更易于管理的部分。它不仅是我们编码工具箱中的宝贵工具，理解递归还将帮助我们提高逻辑思维和解决问题的能力。那么还等什么？在本章中，我们将全面了解什么是递归，以及为什么深入了解它能让我们的编码技能更上一层楼！\n\
  \n开始吧！\n\n### 我们的巨型饼干问题\n\n思考递归的一种方式如下：我们从一个大问题开始，然后将这个大问题分解成越来越小的部分，直到达到一个可以直接解决的简单问题。用一个例子来说明会更清楚，所以让我们想象一下，我们的任务是吃掉一块巨大的饼干（图\
  \ 14-1）。\n\n![描述：一块饼干的卡通图，中等置信度自动生成](img/14fig01.jpg)\n\n**图 14-1** *一块巨型饼干！*\n\n\
  由于它的大小，大多数人无法一口吃掉整块饼干。我们可以做的是把它掰成更小的块（图 14-2）。\n\n![描述：包含圆形、卡通、艺术的图片，自动生成描述](img/14fig02.jpg)\n\
  \n**图 14-2** *把饼干掰成更小的块*\n\n正如我们所见，这些小块仍然太大，无法一口吃掉。我们需要继续把块掰成更小的块。最终，我们会把饼干分解成一口就能轻松吃掉的小块（图\
  \ 14-3）。\n\n![描述：包含圆形、艺术的图片，自动生成描述](img/14fig03.jpg)\n\n**图 14-3** *进一步把饼干分解成更小的块*\n\
  \n\n\n需要注意的一点是，现在我们有许多*小份*的饼干需要吃掉。我们既不是只有一块大饼干，也不是只有一块小饼干。我们吃掉的饼干总量保持不变，唯一的区别是总量现在分散在许多饼干上。这种将大块东西分解成越来越小块的过程，与递归在编程问题中的工作方式非常相似。\n\
  \n### 编程中的递归\n\n虽然以饼干的形式思考递归既美好又美味，但当我们用递归解决棘手的编程问题时，才会发现它最大的威力。呼应我们一开始提到的，递归的教科书定义包含两个部分：一个反复调用自身的函数，以及一个阻止函数无限调用自身的条件。我们来详细看看这两个部分的作用。\n\
  \n#### 递归函数调用\n\n第一部分涉及所谓的**递归函数调用**，即函数反复调用自身。从字面上看，它看起来有点像这样：\n\n```\nfunction\
  \ hello() {\n  console.log(\"我是一个小函数，短小精悍！\");\n\n  hello();\n}\n```\n\n我们有一个名为\
  \ `hello` 的函数，在函数体内，我们又调用了 `hello`。现在，如果我们尝试运行这段代码，它实际上不会运行。它会引发无限循环，因为代码永远不会停止运行。更具体地说，我们的代码会导致栈溢出错误（图\
  \ 14-4）。\n\n![描述：一张计算机屏幕截图，自动生成的中等置信度描述](img/14fig04.jpg)\n\n**图 14-4** *栈溢出可能的样子示例*\n\
  \n避免这个问题的方法引出了我们讨论的第二部分。\n\n#### 终止条件\n\n第二部分是一个条件，用于阻止函数永远调用自身，这个听起来有点吓人的条件叫做**终止条件**。借用我们饼干的例子，我们不断将饼干分成更小的块，直到它变成一口大小。终止条件就是检查饼干的大小是否是一口大小。如果是一口大小，就吃掉饼干；如果不是，就进一步将饼干分成更小的块。\n\
  \n把这些话转换成代码，假设我们希望 `hello` 函数作为一个累加器，我们传入一个数字，它返回从 1 到该数字的所有数字之和。例如，如果传入数字 5，我们的代码将累加所有直到\
  \ 5 的数字，即计算 5 + 4 + 3 + 2 + 1，并返回最终值 15。如果我们这样做，修改后的 `hello` 函数如下所示：\n\n```\nfunction\
  \ hello(num) {\n  if (num <= 1) {\n    // 终止条件\n    return num;\n  } else {\n  \
  \  // 递归函数调用\n    return num + hello(num - 1);\n  }\n}\n\nconsole.log(hello(5));\
  \ // 15\n```\n\n花点时间看看我们的代码在做什么。如果我们要可视化这段代码的运行过程，它会像图 14-5 那样，顶部是我们最初的 `hello(5)`\
  \ 调用，后面跟着 `return` 语句的结果。\n\n![描述：一张包含截图、文本、字体、线条的图片，自动生成](img/14fig05.jpg)\n\n\
  **图 14-5** *可视化我们的代码*\n\n在每一行中，当我们的 `num` 参数大于 1 时，我们展示 `num + hello(num - 1)` 的结果（图\
  \ 14-6）。\n\n![描述：一张包含截图、文本、图表、线条的图片，自动生成](img/14fig06.jpg)\n\n**图 14-6** *突出显示的递归调用*\n\
  \n我们不断重复这个过程，直到 `num` 值达到 1。当这种情况发生时，我们触发了终止条件（`num <= 1`），并返回 `num` 本身的值，在我们的例子中就是\
  \ 1（图 14-7）。\n\n![描述：一张包含截图、文本、图表、线条的图片，自动生成](img/14fig07.jpg)\n\n**图 14-7** *代码停止运行时*\n\
  \n退一步，再来看一次，我们可以看到我们是如何从一个大的问题开始，通过每次递归调用，将问题分解成更小的步骤。我们一直持续到触发终止条件，最终得到一个易于消化的小块，一个普通的数字。真的很酷，对吧？\n\
  \n### 结论\n\n正如我们所见，递归是一份不断给予的礼物……不断给予……不断给予！开个玩笑，虽然我们的 `hello` 累加器函数有点刻意，但它确实很好地突出了使用递归解决问题所需的两个基本要素：\n\
  \n![图片](img/sq.jpg) 递归函数调用\n\n![图片](img/sq.jpg) 终止条件\n\n在后续章节中，我们将更深入地探讨如何应用递归技术来解决更现实、更复杂的问题。此外，与任何解决问题的工具一样，递归只适用于某些情况。有些情况（事实证明有很多）我们需要超越递归，以更高效的方式解决问题，我们很快也会遇到这种情况。\n\
  \n一些额外资源：\n\n![图片](img/sq1.jpg) 提问： [`forum.kirupa.com`](https://forum.kirupa.com)\n\
