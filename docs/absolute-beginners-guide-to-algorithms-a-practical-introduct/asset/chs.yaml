  \n## 10. 堆\n\n如果你和我一样，你可能有很多想法，但时间太少，无法付诸行动。为了帮助理清头绪，我们可以借助一种旨在帮助我们确定任务优先级的工具（图\
  \ 10-1）。\n\n![描述：一张计算机截图，自动生成](img/10fig01.jpg)\n\n**图 10-1** *任务看板示例*\n\n市面上有无数用于管理项目的工具，它们都做了以下几件事的变体：\n\
  \n![图片](img/sq.jpg) 允许我们列出所有想要处理的项目\n\n![图片](img/sq.jpg) 赋予我们确定优先级的能力\n\n![图片](img/sq.jpg)\
  \ 提供一种帮助我们轻松查看最高优先级项目的方法\n\n![图片](img/sq.jpg) 允许我们在保持优先级顺序的同时添加和删除项目\n\n自己构建一个能完成所有这些功能的工具听起来很有趣，但我们将专注于数据结构方面。有一种非常高效的数据结构可以用来表示我们想要做的所有事情，那就是**堆**。我们将在接下来的章节中全面了解它。\n\
  \n继续！\n\n### 认识堆\n\n这个听起来有趣的堆数据结构允许我们在常数时间 O(`n`) 内检索最高优先级的项目，并在对数时间 O(log `n`)\
  \ 内快速插入和删除项目。这使得堆非常棒。在我们深入探讨其工作原理之前，图 8-2 展示了一个典型的堆的样子。\n\n![描述：一张漫画书的特写，自动生成，置信度较低](img/10fig02.jpg)\n\
  \n**图 10-2** *一个脉动、颤抖的堆。来源：哈维·库兹曼（作者），威尔·埃尔德（插画师），“外部圣殿！”，《疯狂》杂志第 5 期，1953 年 6/7\
  \ 月，第 5 页。*\n\n哎呀！放错图了。图 10-3 才是堆更合适的表示。\n\n![描述：一张包含圆形、截图、色彩、艺术图案的图片，自动生成](img/10fig03.jpg)\n\
  \n**图 10-3** *堆的示例*\n\n这种特定的堆变体更正式地称为**最大堆**，其中优先级基于我们处理的数字的大小。优先级最高的项目将是数字最大的那个，并且这个项目始终位于树的根节点。树的其余部分由其他较小的数字组成——所有这些数字都根据其值适当地分层。\n\
  \n堆的另一种变体是**最小堆**，其中较小的数字具有更高的优先级（图 10-4）。\n\n![描述：一张包含截图、时钟、圆形、艺术图案的图片，自动生成](img/10fig04.jpg)\n\
  \n**图 10-4** *认识最小堆*\n\n今天我们不会讨论最小堆。当我们谈论堆时，默认指的是最大堆变体，因为最小堆只是最大堆决定项目优先级方式的反面。这种默认堆为最大堆的偏向与广泛讨论堆的方式一致，但为了避免混淆，我们可能会在一些书籍和在线资源中看到堆被明确称为*最大堆*或*最小堆*。\n\
  \n回到观察我们的堆，有两个细节很快就能注意到：\n\n![图片](img/sq.jpg) 我们的堆是一棵二叉树，每个节点最多有两个子节点。\n\n![图片](img/sq.jpg)\
  \ 每个节点的值都大于或等于其子节点的值。\n\n当我们谈论**堆属性**时，意思是我们的堆完美体现了这两个细节。稍后会详细介绍。\n\n现在，关键点来了，这让堆变得非常棒。我们处理的不仅仅是任何二叉树。它是一棵**完全二叉树**，其中所有行的节点从左到右填满，没有空隙。这导致了一棵看起来非常平衡的树（图\
  \ 10-5）。\n\n![描述：一张包含圆形、截图、艺术图案的图片，自动生成](img/10fig05.jpg)\n\n**图 10-5** *平衡树的示例*\n\
  \n这是一个我们稍后讨论性能时会强调的细节，因为平衡二叉树避免了出现长链节点导致性能不佳的问题。在平衡二叉树中，树的高度是 O(log `n`)，这对于许多类型的数据操作来说是理想的。\n\
  \n#### 常见堆操作\n\n我们的堆的目标，除了看起来很酷之外，是允许我们快速移除优先级最高的项目。为了实现这一点，我们还需要能够向堆中添加项目。这是我们需要堆支持的两个主要操作，因此我们将在接下来的几节中详细描述这两个操作的样子。\n\
  \n##### 插入节点\n\n让我们从插入节点开始，这也是当我们从零开始构建堆时的起点。我们要添加的第一个项目是值为 13 的项目（图 10-6）。\n\n\
  ![描述：一张包含截图、图形、字体、徽标的图片，自动生成](img/10fig06.jpg)\n\n**图 10-6** *我们的第一个节点*\n\n这是我们的第一个项目，它默认成为根节点。这是简单的情况。对于所有后续要添加的项目，我们需要遵循以下规则：\n\
  \n1. 我们将新节点添加到堆的底层，最左边的可用位置，不留空隙。这确保了树保持完全。\n\n2. 我们将新节点的值与其父节点的值进行比较。如果新节点的值大于其父节点的值，我们将新节点与其父节点交换。我们重复这个过程，直到新节点的值不大于其父节点的值，或者我们到达了根节点。\n\
  \n3. 交换后，我们重复步骤 2，将新的父节点与其父节点进行比较，直到堆属性恢复。\n\n\n\n需要注意的重要细节是，我们在父节点和子节点之间检查的仅仅是父节点的值是否大于子节点。与二叉搜索树相比，这种方法的约束要少得多，二叉搜索树有更多的限制条件。当我们继续插入更多节点时，这一切会变得更加清晰。\n\
  \n现在我们想要插入节点 10。我们将其添加到堆的最底层，第一个最左边的可用位置（图 10-7）。\n\n![描述：一个绿色和一个红色的圆圈，带有白色数字，描述自动生成，置信度较低](img/10fig07.jpg)\n\
  \n**图 10-7** *添加节点 10*\n\n我们的值 10 小于父节点值 13，因此这是一个有效的堆结构，保持了堆属性。下一个要添加的数字是 5。我们将其添加到堆底部最左边的可用位置（图\
  \ 10-8）。\n\n![描述：一个红色圆圈，带有白色数字，描述自动生成，置信度中等](img/10fig08.jpg)\n\n**图 10-8** *添加节点\
  \ 5*\n\n新插入的值 5 小于父节点值 13，因此堆属性仍然保持。下一个要添加的数字是 24。我们将其插入到底行最左边的位置（图 10-9）。\n\n![描述：一张包含时钟、圆圈、截图、艺术的图片，描述自动生成](img/10fig09.jpg)\n\
  \n**图 10-9** *新节点被添加到树的最左边部分*\n\n现在，24 是否小于父节点值 10？不是。因此，我们交换父节点和子节点，以确保子节点始终小于父节点的值（图\
  \ 10-10）。\n\n![描述：一张包含时钟、圆圈、截图的图片，描述自动生成](img/10fig10.jpg)\n\n**图 10-10** *交换节点值*\n\
  \n我们再次对新交换的 24 节点及其新父节点进行父子检查。24 是否小于 13？答案仍然是否定的，因此我们再次交换节点（图 10-11）。\n\n![描述：一张包含圆圈、截图、时钟、艺术的图片，描述自动生成](img/10fig11.jpg)\n\
  \n**图 10-11** *再次交换节点值*\n\n此时，我们的 24 节点到达了根节点。它没有父节点可以比较，因此堆现在又处于良好状态。我们刚才的操作有一个名称，叫做`bubbling\
  \ up`，即我们将节点插入到底部，然后不断检查（并在必要时交换）父节点，以确保堆属性得以维持。\n\n现在我们将加快速度。下一个要添加的节点是 1。我们将其添加到最底层最左边的位置（图\
  \ 10-12）。\n\n![描述：一张包含时钟、圆圈、截图的图片，描述自动生成](img/10fig12.jpg)\n\n**图 10-12** *重复之前的步骤添加节点\
  \ 1*\n\n这是有效的，无需进一步调整。下一个要添加的值是 15。我们将其插入为 5 节点的左子节点（图 10-13）。\n\n![描述：一张包含圆圈、截图、时钟的图片，描述自动生成](img/10fig13.jpg)\n\
  \n**图 10-13** *看看添加节点 15 时会发生什么*\n\n父节点（5）小于新添加的子节点（15），因此我们交换 15 和 5（图 10-14）。\n\
  \n![描述：一张包含圆圈、截图、时钟、艺术的图片，描述自动生成](img/10fig14.jpg)\n\n**图 10-14** *交换节点值*\n\n新交换的\
  \ 15 节点正确地小于其父节点（值为 24），因此我们重新保持了堆属性。\n\n下一个要添加的数字是 36。我们的 36 最初是 15 节点的右子节点。这个位置只是临时的！为了保持堆属性，36\
  \ 节点将与 15 节点交换，然后与 24 节点交换（图 10-15）。\n\n![描述：一张游戏截图，描述自动生成，置信度中等](img/10fig15.jpg)\n\
  \n**图 10-15** *通过进一步交换保持堆属性*\n\n包含新添加的 36 的节点现在是堆中最大的数字，位于根节点。干得好，36！让我们添加最后一个元素——数字\
  \ 3（图 10-16）。\n\n![描述：一张包含圆圈、截图、艺术的图片，描述自动生成](img/10fig16.jpg)\n\n**图 10-16** *将数字\
  \ 3 添加到堆中*\n\n我们将其添加到底层最左边的位置，包含值 3 的节点是 10 节点的子节点。这保持了堆属性，因此我们不需要做任何额外操作。我们的堆处于良好状态，我们刚刚看到了向堆中插入节点的过程，以及`bubbling\
  \ up`在确保节点正确定位中的作用。\n\n##### 移除根节点\n\n接下来我们要看的堆操作是如何移除根节点，也就是堆中最大且最重要的值。稍后我们会看到，移除根节点有一些有趣的行为，与我们之前向堆中添加元素时看到的非常不同。让我们开始吧，继续使用我们之前的堆示例。\n\
  \n我们要做的是移除值为 36 的根节点（图 10-17）。\n\n![描述：一张电脑游戏截图，描述自动生成，置信度较低](img/10fig17.jpg)\n\
  \n**图 10-17** *移除根节点*\n\n从堆中移除根节点时，我们仍然需要确保堆属性得以维持。这意味着新的根节点应该是堆中最大的值，并且二叉树应该被重新构建，使其保持完全二叉树。\n\
  \n以下是从堆中移除根节点的步骤：\n\n1. 我们从堆中移除根节点，并用堆中的最后一个节点替换它。\n2. 我们将新根节点的值与其子节点的值进行比较。如果新根节点的值小于其任一子节点的值，则将新根节点与其较大的子节点交换。重复此过程，直到新根节点的值大于或等于其子节点的值，或者它没有子节点。这个过程称为`bubbling\
  \ down`。\n3. 交换后，我们重复步骤 2，将新的子节点与其子节点进行比较，直到堆属性恢复。\n\n让我们通过实际移除根节点 36 的过程来将这些步骤付诸实践。我们首先要做的是移除\
  \ 36 根节点，并将其与堆中的最后一个节点交换，这个节点始终是堆最底层最右边的节点（图 10-18）。\n\n![描述：一张视频游戏截图，描述自动生成](img/10fig18.jpg)\n\
  \n**图 10-18** *移除根节点后重新平衡树*\n\n当我们移除 36 节点并将其与 3 节点交换后，堆将如图图 10-19 所示。\n\n![描述：一张包含截图、圆圈、色彩丰富的图片，描述自动生成](img/10fig19.jpg)\n\
  \n**图 10-19** *根节点已被最后一个节点替换*\n\n接下来，我们开始`bubbling down`操作，将新指定的根节点与其子节点进行比较，看它是否小于任一子节点。如果它小于任一子节点，则将其与最大的子节点交换。在我们的例子中，根节点值\
  \ 3 小于其两个子节点值 13 和 24。我们将其与最大的子节点（即 24）交换（图 10-20）。\n\n![描述：一张包含圆圈、截图、艺术的图片，描述自动生成](img/10fig20.jpg)\n\
  \n**图 10-20** *是时候重新平衡了*\n\n\n\n\n我们还没有完成。现在，我们在 3 号节点所在的新位置重复父子检查。在这种情况下，我们的 3\
  \ 号节点小于其两个子节点（5 和 15）的值。因此，我们将 3 号节点与其较大的子节点（15 号节点）交换（图 10-21）。\n\n![描述：一张包含圆形、截图、艺术品的图片，自动生成描述](img/10fig21.jpg)\n\
  \n**图 10-21** *再进行一次交换*\n\n此时，我们的 3 号节点是一个叶子节点，没有子节点可以比较其值。这意味着它现在位于预期位置，我们的堆属性已恢复。\n\
  \n让我们再走一遍移除步骤，确保所有细节都准确无误。我们的新根节点值为 24，我们要移除它（图 10-22）。\n\n![描述：一张视频游戏截图，自动生成描述，置信度中等](img/10fig22.jpg)\n\
  \n**图 10-22** *让我们移除节点 24*\n\n我们首先要做的是移除它，并用最后一个节点（再次是我们的 3 号节点）替换它（图 10-23）。\n\n\
  ![描述：一张包含圆形、截图、艺术品的图片，自动生成描述](img/10fig23.jpg)\n\n**图 10-23** *最后一个节点取代了被移除的根节点*\n\
  \n完成此操作后，我们将 3 号节点与其子节点的值进行比较。它小于两者，因此我们将其与较大的子节点（15 号节点）交换（图 10-24）。\n\n![描述：一张包含圆形、截图、艺术品的图片，自动生成描述](img/10fig24.jpg)\n\
  \n**图 10-24** *是时候维护堆属性了*\n\n这次交换后，我们还没有完成。现在检查我们的 3 号节点是否小于其任何子节点。它唯一的子节点是 5 号节点，而\
  \ 3 不小于 5。我们再进行一次交换（图 10-25）。\n\n![描述：一张包含圆形、时钟、截图、艺术品的图片，自动生成描述](img/10fig25.jpg)\n\
  \n**图 10-25** *堆一切正常*\n\n此时，我们的 3 号节点回到了它应该在的位置，根节点包含堆中最大的值，所有子节点都安全地位于各自的位置。世界又恢复了正常。\n\
  \n### 堆的实现\n\n现在我们已经对堆在添加元素或移除根节点时的工作原理有了很好的了解，是时候看看我们究竟如何构建它了。\n\n#### 堆作为数组\n\n\
  一个有趣且重要的细节是堆在底层是如何表示的。是的，我们一直把它当作二叉树来讨论。但在实现中，我们不会将其表示为二叉树。我们将把它表示为一个数组，其中每个元素代表堆中的一个节点。\n\
  \n我们先看一个可视化图（图 10-26），然后讨论这种映射具体是如何工作的。\n\n![描述：一张游戏截图，自动生成描述，置信度低](img/10fig26.jpg)\n\
  \n**图 10-26** *堆与数组之间的关系*\n\n注意每个数组元素如何表示树中每个节点的父子关系。我们可以使用一系列计算来映射树中的节点与数组中的扁平列表元素：\n\
  \n![图片](img/sq.jpg) 要查找索引为`i`的节点的父节点，可以使用公式`Math.floor(i-1)/2`计算其父节点索引。请注意，此公式仅适用于根节点以外的节点，因为根节点没有父节点。\n\
  \n![图片](img/sq.jpg) 要查找索引为`i`的节点的左子节点，可以使用公式`2i+1`计算其左子节点索引。请注意，此公式仅在左子节点索引在数组范围内时适用。\n\
  \n![图片](img/sq.jpg) 要查找索引为`i`的节点的右子节点，可以使用公式`2i+2`计算其右子节点索引。请注意，此公式仅在右子节点索引在数组范围内时适用。\n\
  \n当我们查看数组中的元素（及其子节点和父节点）时，这些计算应该能很好地对应。\n\n#### 代码\n\n以下 JavaScript 代码将我们迄今为止看到的所有文字和图表转化为可工作的代码：\n\
  \n```\nclass Heap {\n  constructor() {\n    // The heap is stored as an array\n\
  \    this.heap = [];\n  }\n\n  // Add a new element to the heap\n  insert(value)\
  \ {\n    // Add the new element to the end of the array\n    this.heap.push(value);\n\
  \    // Restore the heap property by bubbling up the new element\n    this.#bubbleUp(this.heap.length\
  \ - 1);\n  }\n\n  // Remove the maximum element from the heap\n  extractMax() {\n\
  \    // If the heap is empty, return null\n    if (this.heap.length === 0) {\n \
  \     return null;\n    }\n    // If the heap has only one element, remove and return\
  \ it\n    if (this.heap.length === 1) {\n      return this.heap.pop();\n    }\n\
  \    // Otherwise, remove the root element (maximum value) and replace it\n    //\
  \ with the last element in the array\n    const max = this.heap[0];\n    const end\
  \ = this.heap.pop();\n    this.heap[0] = end;\n    // Restore the heap property\
  \ by bubbling down the new root element\n    this.#bubbleDown(0);\n    return max;\n\
  \  }\n\n  // Restore the heap property by bubbling up the element\n  // at the given\
  \ index\n  #bubbleUp(index) {\n    // If the element is already at the root, return\n\
  \    if (index === 0) {\n      return;\n    }\n    // Find the index of the parent\
  \ element\n    const parentIndex = Math.floor((index - 1) / 2);\n    // If the element\
  \ is greater than its parent, swap them\n    if (this.heap[index] > this.heap[parentIndex])\
  \ {\n      [this.heap[index], this.heap[parentIndex]] = [this.heap[parentIndex],\
  \ this.heap[index]];\n      // Continue bubbling up the element from its new index\n\
  \      this.#bubbleUp(parentIndex);\n    }\n  }\n\n  // Restore the heap property\
  \ by bubbling down the element\n  // at the given index\n  #bubbleDown(index) {\n\
  \    // Find the indices of the left and right child elements\n    const leftChildIndex\
  \ = 2 * index + 1;\n    const rightChildIndex = 2 * index + 2;\n    // Initialize\
  \ the index of the largest element to be\n    // the current index\n    let largestIndex\
  \ = index;\n    // If the left child element is larger than the current element,\n\
  \    // update the largest index\n    if (leftChildIndex < this.heap.length &&\n\
  \        this.heap[leftChildIndex] > this.heap[largestIndex]) {\n      largestIndex\
  \ = leftChildIndex;\n    }\n    // If the right child element is larger than the\
  \ current element,\n    // update the largest index\n    if (rightChildIndex < this.heap.length\
  \ &&\n        this.heap[rightChildIndex] > this.heap[largestIndex]) {\n      largestIndex\
  \ = rightChildIndex;\n    }\n    // If the largest element is not the current element,\
  \ swap them and\n    // continue bubbling down the element from its new index\n\
  \    if (largestIndex !== index) {\n      [this.heap[index], this.heap[largestIndex]]\
  \ =\n                [this.heap[largestIndex], this.heap[index]];\n      this.#bubbleDown(largestIndex);\n\
  \    }\n  }\n\n  // Return the maximum element in the heap without removing it\n\
  \  getMax() {\n    return this.heap[0];\n  }\n\n  // Return the size of the heap\n\
  \  size() {\n    return this.heap.length;\n  }\n\n  // Check whether the heap is\
  \ empty\n  isEmpty() {\n    return this.heap.length === 0;\n  }\n}\n```\n\n我们的堆实现支持以下操作：\n\
  \n![图片](img/sq.jpg) `insert`：向堆中添加新元素\n\n![图片](img/sq.jpg) `extractMax`：从堆中移除包含最高优先级（即最大值）的根节点并返回它\n\
  \n![图片](img/sq.jpg) `getMax`：返回根节点中具有最高优先级（即最大值）的值，但不将其从堆中移除\n\n![图片](img/sq.jpg)\
  \ `size`：返回堆中节点的数量\n\n![图片](img/sq.jpg) `isEmpty`：判断堆是否为空\n\n\n\n我们使用这段代码以及许多前述操作的方式如下：\n\
  \n```\nlet myHeap = new Heap();\nmyHeap.insert(14);\nmyHeap.insert(18);\nmyHeap.insert(50);\n\
  myHeap.insert(1);\nmyHeap.insert(3);\nmyHeap.insert(15);\nmyHeap.insert(2);\nmyHeap.insert(2);\n\
  myHeap.insert(0);\nmyHeap.insert(13);\n\nconsole.log(\"Size of heap: \" + myHeap.size());\
  \ // 10\n\nconsole.log(myHeap.getMax()); // 50\n\nconsole.log(\"Size of heap: \"\
  \ + myHeap.size()); // 10\n\nconsole.log(myHeap.extractMax()); // 50\n\nconsole.log(\"\
  Size of heap: \" + myHeap.size()); // 9\n\nconsole.log(myHeap.extractMax()); //\
  \ 18\nconsole.log(myHeap.extractMax()); // 15\nconsole.log(myHeap.extractMax());\
  \ // 14\n\nconsole.log(\"Size of heap: \" + myHeap.size()); // 6\n```\n\n我们正在重新创建之前看到的示例堆，并将我们提到的许多操作付诸实践。\n\
  \n### 性能特征\n\n在堆中，我们之前提到，移除根节点和向堆中插入元素是我们关心的两个基本操作。让我们从性能角度看看它们表现如何。\n\n##### 移除根节点\n\
  \n与移除根节点相关的两个概念：\n\n![图片](img/sq.jpg) 时间复杂度：O(log *n*)，其中 *n* 是堆中的元素数量\n\n![图片](img/sq.jpg)\
  \ 空间复杂度：O(1)\n\n在堆中移除根节点涉及两个主要步骤：将根节点与堆中的最后一个叶节点交换，然后通过将新根节点向下筛选（通过代码中的 `#bubbleDown`\
  \ 方法）重新堆化，直到堆属性恢复。\n\n第一步交换根节点和最后一个叶节点需要常数时间，因为我们只是更新两个数组元素。例如，图 10-27 展示了这一过程。\n\
  \n![描述：一张自动生成的视频游戏截图](img/10fig27.jpg)\n\n**图 10-27** *我们之前移除根节点时的示例*\n\n第二步重新堆化需要对数时间，因为我们必须将新根节点与其子节点比较，并与较大的子节点交换，直到堆属性恢复。由于完全二叉树的高度为\
  \ O(log *n*)，其中 *n* 是树中的节点数，因此从堆中移除根节点的最坏时间复杂度为 O(log *n*)。\n\n#### 插入元素\n\n与向堆中插入元素相关的两个概念：\n\
  \n![图片](img/sq.jpg) 时间复杂度：O(log *n*)，其中 *n* 是堆中的元素数量\n\n![图片](img/sq.jpg) 空间复杂度：O(1)\n\
  \n向堆中插入元素涉及两个主要步骤：将新元素插入到堆的末尾，然后通过将新元素向上筛选（通过代码中的 `#bubbleUp` 方法）重新堆化，直到堆属性恢复。\n\
  \n第一步将新元素插入到堆末尾需要常数时间，因为我们只是将一个新元素追加到数组末尾，就像我们向堆中添加的 15 一样（图 10-28）。\n\n![描述：一张自动生成的计算机截图，置信度较低](img/10fig28.jpg)\n\
  \n**图 10-28** *添加元素*\n\n由于我们使用数组来实现堆，向末尾添加元素也非常快。这正是数组非常、非常高效的地方。\n\n第二步重新堆化需要对数时间，因为我们必须将新元素与其父节点比较，如果它更大则与父节点交换。我们重复此过程直到堆属性恢复。与之前的根节点移除情况类似，由于完全二叉树的高度为\
  \ O(log *n*)，其中 *n* 是树中的节点数，因此向堆中插入元素的最坏时间复杂度也是 O(log *n*)。\n\n#### 性能总结\n\n综合来看，移除根节点和向堆中插入元素的最坏时间复杂度均为\
  \ O(log *n*)，其中 *n* 是堆中的元素数量。这些操作的空间复杂度为 O(1)，因为在重新堆化过程中我们只需要存储临时变量。\n\n### 结论\n\
  \n总而言之，堆是一种极其有用的数据结构，它极大地简化了各种算法和问题。通过以满足堆属性的二叉树结构组织元素，堆实现了两件事：\n\n![图片](img/sq.jpg)\
  \ 在常数时间内高效获取最大元素\n\n![图片](img/sq.jpg) 在对数时间内快速插入和移除元素\n\n由于其高效性，堆被广泛应用于各种场景，例如堆排序、优先队列以及用于寻找图中最短路径的\
  \ Dijkstra 算法。是的，它们也能让我们的任务管理器构建目标变得非常迅速（图 10-29）。\n\n![描述：一张自动生成的包含文本、截图、软件、网页的图片](img/10fig29.jpg)\n\
  \n**图 10-29** *任务管理器的另一个示例*\n\n此外，堆可以轻松地使用数组实现，这使得它们在内存使用方面特别高效。堆有什么不让人喜欢的呢？\n\n\
