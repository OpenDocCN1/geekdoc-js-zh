  md: '# CHAPTER 7 AOL.com 223


    David and I did a quick spin around the Web looking for comparable portals and
    did some checks to see how they were doing with their markup and what percentage
    of the whole it was. From that unscientific assessment, we concluded that if we
    could hit 1:5 ratio to markup (that''s 20%), we''d be OK.


    It starts with content. Early on, our design team produced wireframes with example
    content provided by the editorial group. We took those, copied all the text out
    into a blank file, took the size of it, and then multiplied it by five to get
    what we thought the markup size be. That gave us our initial load time estimate.
    We know that we couldn''t be faster than that initial number.


    Once we left the markup, we had to guess about images, CSS, and JavaScript. There
    were some scripts we had to include for reporting and advertising, but we also
    knew that we''d need a certain amount of JavaScript for actual functionality.
    We assumed that the site would have half much JavaScript as it had markup, and
    the CSS would be one-third the size of the markup. These were just guesses. We
    ignored most of the art (because we assumed it would be pulled through CSS after
    the page loaded) except the photos. We found photos that were roughly the same
    dimensions, optimized them, and added their size to the total.


    Once we had all those numbers, we could come up with an estimate for how large
    the page would be when it was built, based solely on the design mockup. We did
    this for each of the designs, presented them to the designers and product owners,
    and made our suggestions.


    Having numbers is always good—even if they''re only for comparison—and helped
    us back up our opinions about each feature''s piece of the overall performance
    picture.


    To illustrate, here''s an example ''worksheet'' for figuring it out:


    +   1. Enter the number of characters in the document: \_\_\_\_\_\_\_\_2. Markup
    size = line 1 X 5: \_\_\_\_\_\_\_3. List required JavaScript and CSS files and
    their sizes: \_\_\_\_\_\_\_\_4. Application JavaScript = line 2 X 5: \_\_\_\_\_\_\_\_5.
    Application CSS = line 2 X .33: \_\_\_\_\_\_\_\_6. Combined size of photos: \_\_\_\_\_\_\_\_


    Just fill in the data as you get it, and you can get a pretty good estimate of
    how long it''s going to take for a user to load your page.'
