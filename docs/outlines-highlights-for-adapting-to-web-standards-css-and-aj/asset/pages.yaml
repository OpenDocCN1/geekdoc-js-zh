- img_proc: true
  md: "# CHAPTER 6 EverythingTori.com 181\n\nbackground image, so the design crops\
    \ it to the height of the block. Fortunately, it works naturally for the site\
    \ with its use of textures and randomness to give it a scrapbook look and feel.\n\
    \nBut the designer worried about making the background images seamless while overlapping\
    \ or tiled vertically or horizontally. Beyond that, it was better for the design\
    \ to look random.\n\nIn dealing with browser issues, Fierlinger relied on \"build,\
    \ test, build, test, repeat\" until the design behaved way it should. He aimed\
    \ to ensure the site worked with Internet Explorer 5.5 and Firefox 1.5 (remember,\
    \ this was 2004). When he couldn't find a solution for a situation, he resorted\
    \ to the magic bullet: the underscore hack. The underscore isn't valid CSS, but\
    \ he did the trick:\n\n```\nhr {\n  height:3px;\n  height:4px;\n}\n```\n\nThe\
    \ three-pixel positioning looked right in every browser except Internet Explorer,\
    \ four pixels worked better for IE. The underscore acts like a comment, and browsers\
    \ ignore anything with the underscore in the CSS. Internet Explorer is an exception,\
    \ though it dutifully follows the style of the underscore. (To make it, the underscore\
    \ attribute must come after the original attribute so IE obeys the \"last command\"\
    \ it receives.)\n\nWhile some designers believe using the hack is a sin, Fierlinger\
    \ feels the hack was, at least, more elegant than other hacks. What if the site\
    \ didn' validate? The site would survive, and serve its purpose.\n\nAnother interesting\
    \ aspect of the site comes in the sharing of the same HTML structure while giving\
    \ each site a distinctive look through the different background-textures. The\
    \ textures frame the page and the custom imagery to define each section. Each\
    \ section also features different field and button styles. The underlying HTML\
    \ all comes from the template, demonstrating the beauty and ease of using CSS\
    \ to structure and presentation. 6.16 shows an overview.\n\nMost sites use a `<div>`\
    \ to frame the header, usually something like `#header`. In the case of the Tori\
    \ site, using a header `<div>` would have restricted the background to a limited\
    \ size. To get the textures to extend and flow into the overall page, Fierlinger\
    \ uses `#body` to define the background imagery. Notice that the page includes\
    \ a drop shadow, adding depth and effect and enhancing its tactile feel. He added\
    \ a `#page-shadow <div>` with a `margin-left` of 780px"
