    # POSH, or Plain Old Semantic HTML


    The usage of clean, intelligent, semantic (XHTML) code has been called POSH, or
    Plain Old Semantic HTML (http://microformats.org/wiki/posh) and is fundamental
    building block of modern markup. The essential goal is clean, meaningful markup
    without presentation elements or attributes. The elements used information about
    the structure of the content.


    Contrast the code in the previous examples with the following (**Figure 1.12**),
    and note that superbly it looks visually the same as the first.


    ![](img/8df3ac083e82f7f766ae1a4a89406407_49_0.png)


    But also note that it conveys more information in the markup itself:


    ```

    <div class="article">

    <h1>My Online Article Title</h1>

    <h2>May, 2007</h2>

    <p>

    ```'
