  md: '# ADAPTING TO WEB STANDARDS


    padding around the top, right, bottom, and left; borders around the same areas;
    followed by margins around the object as well.


    The width of an object is technically defined by the content area alone; however,
    these older versions of IE defined the width incorrectly, so any CSS object set
    with a width is actually measured incorrectly. This can wreak havoc on layouts,
    since the measurements for the dimensions of objects on pages are all wrong. IE
    6.0 in "standards" mode fixed this. However, it is different from Internet Explorer
    4 and 5, so Web authors have to deal with more than one measurement while laying
    out pages using CSS (FIGURE 1.5).


    FIGURE 1.5. In Explorer versions 4, 5.5, and version 6 in "quirks" mode, the width
    of a box is calculated to include the size of its content plus its border and
    padding. The CSS layout on the other hand, measures the box and padding separately
    from the content.


    # CSS Layout Box Model


    CSS Width is


    Content Only


    ![](img/8df3ac083e82f7f766ae1a4a89406407_36_0.png)


    What Microsoft did define the width as including the content, padding, and borders.
    help correct this problem, Microsoft introduced DOCTYPE switch and "standards"
    and "quirks" modes that measure differently. However, their box model was different
    previously, so the "standards" and "quirks" differences are greater than many
    other Web browsers'' differences in these two modes. Other browsers have smaller
    nuances that happen in "quirks" mode, but they need to be watched for.


    Web authors new to building Web standards-based layouts, which may have built
    pages using Internet Explorer 5.x''s CSS box model, are for a surprise that other
    browsers render the pages differently. Often, the belief is that browsers were
    getting it wrong, or something broke was fixed, and the other guys had it right.'
