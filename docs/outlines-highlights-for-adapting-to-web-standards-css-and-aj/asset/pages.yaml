    # The Boxes Were Measured Wrong


    When IE 4 came out in 1997, and IE 5 for the Macintosh came out in 2000, Microsoft
    seemed to be doing fairly well with its Web browsers. Not that great, but in CSS
    support and user adoption, they were simply doing much better than Netscape 4
    had fared. Netscape 6 was poorly received, and Microsoft had won the so-called
    "Browser War." With Internet Explorer 5 and 5.5 (the only games in front for many
    Web authors), it was assumed by most developers that the CSS support they were
    getting used to in fact correct. But just because something''s better or more
