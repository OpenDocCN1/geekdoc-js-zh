  md: '# 3


    # Integrating the Behavior Layer


    Capturing, reacting to, and performing actions based on users'' interactions with
    Web pages is the realm of the "behavior layer." While HTML and Web browsers have
    basic responses to "behaviors" such as clicking a link or submitting a form, today
    these responses can be enhanced radically through the use of scripts sitting on
    top of the markup. The scripts respond to logical decisions made by users, thereby
    creating a responsive user interface (UI) and controlling what and when (or even
    if) anything is actually sent to the server. Modern scripts can even control a
    UI by receiving data from the server and modifying an existing page without a
    full page refresh.'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'In a Standards world, scripts and the behavior layer involve the careful application
    of JavaScript to enable both the event layer and the appropriate reactions to
    users'' actions. JavaScript needs to be consistent, well organized, and respectful
    of the front-end presentation and structure layers.


    In the past, JavaScript served a simple purpose: providing "stupid Web tricks"
    with varying degrees of usefulness. With full Document Object Model (DOM) support,
    Asynchronous JavaScript and XML (Ajax), and richer experiences, JavaScript is
    getting more attention. It is moving beyond its past as a cut-and-paste language
    and is being adopted by large frameworks with object-oriented structures and mature
    design patterns.


    In large organizations or complex environments, JavaScript is frequently applied
    as part of a front-end solution as well as the backend applications, yet it is
    frequently implemented by an altogether different team.


    In most cases, for complex Rich Internet Applications (RIAs), modern scripts should
    be enhancements to existing pages and be laid over the top in a way that is not
    browser-specific and will allow the page to operate even if the scripts disabled
    or some other issue prevents them from executing.


    While the percentage of users using the Web without scripts is small, one of modern
    users should have access to content, including users who have scripts disabled.
    This ten also applies to the edge case where the script is developed for a specific
    browser and not built with open standards. Pages that rely on scripts for fundamental
    features and functionality, even items as mundane as links, go against this and
    can cause problems and potentially irritate users who don''t understand why might
    not be working.


    # Modern Ajax Methods


    In 2005, James Garrett of Adaptive Path published an article discussing new techniques
    in Web scripting that had largely been operating under the radar. (His article
    is located at adaptivepath.com/publications/essays/archives/000385.php).


    Garrett''s article, "Ajax: A New Approach to Web Applications," defined Ajax (short
    for Asynchronous JavaScript and XML) as a new platform for Web technologies using
    JavaScript features to send XML communications from a Web page in the background,
    without interruption, without refreshing the browser window. There had been hacks
    and other workarounds for effects like for years involving things such as hidden
    <iframe> elements.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# CHAPTER 3 Integrating the Behavior Layer


    While the core technologies we discussed have been around since the late 1990s,
    Garrett''s article, combined with modern browser support, suddenly set off a virtual
    scripting revolution in Web development. When application developers realized
    JavaScript could function in ways desktop software, with data interchange in the
    background without users waiting for a form to be posted and, JavaScript suddenly
    got tons of attention—and more respect.


    The term Ajax (also seen as AJAX) is defined in many different ways these does:
    from the strict XML data interchange to a broad modern user experience featuring
    page updates, drag-and-drop, fades, animations, and other more desktop-software-like
    effects (an example of which is shown in FIGURE 3.1). In this sense, it describes
    the use of modern browsers with robust JavaScript support on faster and more advanced
    computers, combined with more prominent broadband access and traditional Ajax
    techniques.


    Whatever the definition it is clear that Ajax has brought specific attention to
    the techniques supported by JavaScript in modern browsers. Combined with Web-standards
    approaches, it is quite a powerful "experience delivery" tool.


    ![](img/8df3ac083e82f7f766ae1a4a89406407_85_0.png)


    FIGURE 3.1 Apple''s Web Gallery, a feature of its .Mac service, makes extensive
    use of Ajax. (Image courtesy of Apple.)'
