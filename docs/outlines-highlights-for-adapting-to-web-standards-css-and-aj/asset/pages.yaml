    # Designing for Performance


    The design goal for AOL.com was to create something that looked and felt like
    AOL, but was cutting-edge and differentiated the site from its competitors. To
    that end, before there were even any specific requirements set for this project,
    and just to get an idea of what the product team was looking for, the design team
    came up with dozens initial concepts for the goal and feel of the site—extremely
    creative and beautiful designs. Unfortunately, most of them contained elements
    that couldn''t be implemented in modern Web browsers, or would cause major performance
    problems.


    And therein lay the rub: performance. The site needed to load and be usable over
    a dial-up connection in less than 10 seconds. This meant that everyone had to
    compromise: Designers had to let go of some visual flair, and development had
    to come with some new ways of doing things.


    Fortunately for AOL.com, they were able to do all of that. Development was involved
    from the very beginning of the design process, and worked with the designers to
    make sure that what was designed could be faithfully created in "real life."'
