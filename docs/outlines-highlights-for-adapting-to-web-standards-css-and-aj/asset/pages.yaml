- img_proc: true
  md: '# BC-4 ADAPTING TO WEB STANDARDS


    evidence for a case to a senior executives to say, “This is why we want to make
    a drastic change to the home page.” That was the general process.


    Once we got the buy-in from senior executives, we developed it and eventually
    did external bucket tests. It was a very small percentage of the traffic, about
    0.4%, but that''s a lot of people with the home-page traffic.


    MT: You said that the previous iterations were an iterative process. In making
    changes over time, was there a lot of A-B testing involved? How did the team make
    those decisions?


    JB: What''s what we did most of the time in between finishing the first redesign
    we worked on and starting the new page. Sometimes we would conduct to ten different
    tests, and run them for about four weeks. We''d simultaneously run up to 10 tests
    and then review all of the data. Yahoo had a data analysis group working on the
    charts, the graphs, and the numbers.


    MT: You said that falls comes to the campus to do testing, but were we testing
    out in the field?


    JB: There was the new home page. They did some testing that the user people—obviously
    invited—went to people''s homes, to see how they used it and looked what they
    did on the page.


    They often travelled to different parts of the country, or different parts of
    the world. It was interesting just to see the results that they got. They made
    up different types of people who used the front page and how they used it and
    why they used it. That was just another revelation of how much work went into
    just one page.


    MT: How did the team make decisions? How much would the site comply with Web standards
    and validating code? Was that a big discussion or taken as a given?


    JB: From the coding perspective, things like that were mostly in my court, in
    cases where I was the lead-front engineer. I told them that I believe in standards
    and writing accessible code. Yahoo, as a whole, was very much into that. Sat with
    a blind guy, our lead accessibility guy, and we browsed the page together. He
    would tell me what worked and what didn''t work. I made many accessibility decisions
    by just sitting with someone using a screen reader.


    I made the decision to do it and it worked into my time estimates. I told the
    products people and everyone else why.'
