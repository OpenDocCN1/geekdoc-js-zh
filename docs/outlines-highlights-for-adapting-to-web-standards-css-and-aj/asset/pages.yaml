  md: '# Appendix A


    # Targeting Web Browsers


    Every Web site has different types of visitors. A Web standards-based approach
    is by its nature more forgiving of the differences in Web browsers because standards-compliant
    sites are based on open standards, not proprietary technology. Web standards professionals
    make fewer assumptions about the types of visitors who come to their sites and
    don''t assume that all of them will be using the same browser.


    That said, every organization is going to have a different type of audience, be
    it a business-to-business audience, business-to-consumer segment, students, government,
    or just a cross-section of society at large. It can be very useful for a Web team
    to know what Web browsers to "target" while working.


    Just about every Web server keeps logs of the visitors it serves, and this information
    includes data on what Web browsers and operating system (OS) platforms those visitors
    are using. This is done by inspecting the HTTP_USER_AGENT header of every HTTP
    request


    Web experts agree on at least one important rule: Never assume a single browser
    is the only audience of the site. Attempt to cater to all, using the open standards
    instead of proprietary technologies.


    # Web Log Analysis


    Most Web sites and companies have made some form of commitment to a software package
    that can help analyze their server logs. This is critical information for any
    professional Web team. Every project and every business is going to have different
    needs. If there has been no commitment to a software package, there are volumes
    of free, commercial, and open-source tools that can analyze logs from a variety
    of Web servers.'
  merge: -1
