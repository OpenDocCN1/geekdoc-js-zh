  md: 'After completing his research, Fierlinger believed he could build a site that
    complemented fan sites while offering higher design standards and unique content.
    Although he wouldn''t control or maintain the content, he believed he could encourage
    the application of good content practices by building the site with the right
    content management system system (CMS), including a blog that listed events, and
    providing RSS feeds.


    Furthermore, he gave the team suggestions and ideas for content, even when it
    didn''t make the concept stages. One idea proposed that band members, Tori, fans,
    and other artists record their impressions and stories on audio and video streaming
    DVDs. Another involved creating e-cards with interactive music that played audio
    and animation, like little digital vignettes. Neither made the cut because of
    the time and effort involved, and because providing the fundamentals had a higher
    priority.


    # Putting the Design Process to Work


    The project took five months, from July through November 2004. Fierlinger used
    the basic Web design process:


    +   * Gather requirements

    * Develop concepts

    * Create information architecture

    * Design comps

    * Provide time and budget estimates

    * Receive feedback, iterate, and resolve the overall design direction

    * Design and build

    * Iterate, iterate, iterate


    Applying Web standards best practices also played an important part in the project,
    says Fierlinger, because Web standards provided better usability and accessibility,
    helped with search engine optimization, encouraged smart and flexible engineering
    as well as visual design flexibility, and afforded him the opportunity to stretch
    his design skills. At the time of the project, many designers hadn''t adopted
    Web standards.


    # Building the Wireframes


    Not surprisingly, as in so many Web projects, creating content for the site was
    slow and difficult process. Fierlinger, knowing that this process is usually underestimated,
    started requesting content early on in the project. The client submitted'
