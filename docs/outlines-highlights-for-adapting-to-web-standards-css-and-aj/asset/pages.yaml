  md: '# CHAPTER 6 EverythingTori.com 177


    # Designing the Site


    During the design phase, the designer searched for a CMS for the site. While he
    could''ve built the whole site from scratch in Dreamweaver, he opted not to go
    in that direction, as this approach would make it difficult for the client to
    update the content. He investigated blog engines and open-source CMS solutions.
    He considered Movable Type, but stayed away due to concerns about the application''s
    complexity and limited PHP support.


    The PHP-based ExpressionEngine had potential, with its design flexibility and
    powerful features. He decided to use it, though first he had to learn how to use
    it himself. Conceptually, Expression worked like other blog engines, but in practice
    it more resembled a CMS system or Dreamweaver due to its use of object-oriented
    templates and templates. The object-oriented and modular application used a different
    approach for site modeling and content creation. Adopting ExpressionEngine changed
    the way of thinking about and building a Web that runs on a CMS.


    FIGURE 6.12 ExpressionEngine''s control panel, which gives only a small taste
    of the application''s power. It lets designers hack in interesting ways, and blend
    with custom PHP code as needed. In a typical project, Fierling generally avoided
    adding much customized PHP panel. However, for this project, the gallery structure
    needed heavy-duty PHP. The nature of the content required a gallery format, so
    the designer needed to figure out the best way to design and build the gallery.


    It would be seem to build the gallery as a blog sequence sequentially with a preview
    and links to the next and previous entries. However, the designer wanted more
    by setting the gallery


    ![](img/8df3ac083e82f7f766ae1a4a89406407_185_0.png)


    * Weibou'
