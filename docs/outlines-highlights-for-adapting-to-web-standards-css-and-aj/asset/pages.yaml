  md: 'MT: So, did the management allow the goals to stay constant through the whole
    thing and be somewhat broad, overarching goals? What were they, and did they change
    over the course of the redesign?


    JB: There were obviously goals to increase number of searches. Generally, I would
    say the goals were to make the page better for the users, to make a cool page
    that people would actually enjoy using. Something that''s not just a Web page,
    but more interactive and gives you reasons to come back to it.


    I would say that largely those goals stayed constant and what we argued the most
    about how we were best going to achieve those goals. Some people worried about
