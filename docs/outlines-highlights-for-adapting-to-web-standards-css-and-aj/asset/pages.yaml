  md: '# End Song


    These sites undoubtedly influenced Fierlinger''s works, as of some of their elements
    appeared on his designs. And as an innovative designer, his work most likely influenced
    many other designers. Concerning the Tori Amos project, Fierlinger said he was
    happy with the project and its results. He had fun designing and building it,
    since it gave him the opportunity to design something visually expressive with
    a solid and smart structure. Furthermore, he had creative freedom and the client
    listened to his ideas and direction. In turn, the client provided him with great
    guidance, feedback, and support for managing the content.


    Looking back at a project, most designers, including Fierlinger, cringe at all
    the glaring imperfections taunting them. They dwell on the things they didn''t
    have time to fix, or discover that the client mucked things. For EverythingTori.com,
    Fierlinger was completely satisfied with, well, everything. He didn''t see anything
    he wished he could''ve done differently. The fast-changing world of Web design
    and development can quickly outdate a Web site, but not with EverythingTori.com.
    He can look back on this project with complete satisfaction.'
