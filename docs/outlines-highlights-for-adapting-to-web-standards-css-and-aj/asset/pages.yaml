  md: '# Battling the Waterfall: Getting Involved Early


    When the project started, AOL still operated in the “waterfall” method of development.
    Each group involved in a project did its bit pretty much in isolation:


    +   - Business owners created requirements and produced a Product Requirements
    Document (PRD).


    +   - Designers produced user interface and visual designs, and went through a
    lengthy review process through several layers of management, and then produced
    a Design Requirements Document (DRD).


    +   - Development didn’t usually start development until at least the PRD was
    signed off on. When the PRD was signed off, the development lead produced a Technical
    Requirements Document (TRD) and a System Design Document (SDD).


    This model is great if you want to produce a lot of documentation, are working
    on huge projects with lots of integration, and have both a long development cycle
    and a known end date in the future; it was developed AOL producing software that
    had maybe two releases a year. It’s not great if you have to produce a final product
    very quickly, like like most Web applications. Most teams at AOL are switching
    to the more agile and collaborative Scrum model of development by AOL.com is a
    good example of a team working around a cumbersome process to get things done
    the right way, and to get them done more quickly than working within the usual
    system would have allowed.


    During the requirements-gathering phase, while the PRD was still being created,
    Kevin Luman and Michael Richard would find requirements that felt very close to
    start and working on them. This might be as small a thing as is looking for services
    within the company that provide that feature, or building infrastructure to feed
    the user interface. “Cheating ahead” allowed them to make progress while the rest
    of the organization made up its collective mind, and get some time back for the
    inevitable last-minute changes and additional requirements.


    David Artz and Kevin Lawyer were involved in the design process from the beginning,
    weighing in on both potential performance problems and technical feasibility.
    They worked with designers and executives to lay out the pros and cons of each
    and give guidance where needed. Their success proves the point that it is essential
    to have the developers get involved early on. We’ll talk more about this in detail
    in the next section.'
