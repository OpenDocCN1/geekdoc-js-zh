  md: '# APPENDIX D CSS Selectors Reference


    E > F Child selector Matches any F element that is a direct child of an E. White
    space around > is optional.


    ```

    li > p { color: red; }

    <ul>

    <li><p>This text is red.</p></li>

    </ul>

    <p>This text is not.</p>

    ```


    E + F Adacent selector Matches any F element immediately preceded by an E


    ```

    h1 + p { color: red; }

    <h1>Header</h1>

    <p>Paragraph is red.</p>

    <p>But this is not!</p>

    ```


    E:first-child The first-child pseudo-class Matches elements E when E is the first
    child of its parent


    ```

    li:first-child { color:red; }

    <ul>

    <li>this will be red</</li>

    <li>this will not be</</li>

    </ul>

    ```


    E:link :pseudo-class Matches elements E that are links, typically a anchor links
    in (X)HTML


    ```

    a:link {color:black;}

    a {color:blue;}

    <p>

    <a href="link">This is black.</a>

    <a id="link">This is blue.</a>

    </p>

    ```


    E[foo] Attribute selector Matches any E element with the foo attribute set (whatever
    the value)


    ```

    a[href] {color:green;}

    <p>

    <a href="#link">this, is a green link</a>

    <a id="link">this, is not</a>

    </p>

    ```'
  merge: -1
