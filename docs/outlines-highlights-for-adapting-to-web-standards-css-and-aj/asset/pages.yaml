    your server-side code. This section will introduce the basics of standards-based

    development, and some best practices you can use to wipe your markup and CSS

    into shape.


    # Making Your Markup Sing with DOCTYPE


    Early on in the process of designing and developing AOL, the team met often

    to discuss markup best practices, performance, and to make sure that all of them

    were on the same page. Prior to this, my work on improving performance for AOL

    Search taught me that one of the best ways to improve performance was to use

    semantic markup, and a DOCTYPE that put modern Web browsers into "stan-

    dards mode." We chose that same approach for AOL.


    But before we get into that, let''s take a step back. Some of the words in the
    previ-\ous may be English but might not make any sense unless you''re already

    of the Web standards "club."


    # What Came Before


    In the old days, everyone used HTML tables to determine the layout of their

    pages. This worked, but created bloated, hard to maintain documents that took
    a

    long time for browsers to download and then render.


    This model was OK. It mostly worked, and allowed people to build complex

    layouts on the Web. Unfortunately, it wasn''t flexible or maintainable, and

    it punished users because their browsers had to figure out how to draw

    gigantic masses of nested tables (according to several people who work on browser

    endering engines, rendering tables is one of the hardest things they have to do).


    The lingua franca of the Web, HTML, was also a problem. HTML 4 didn''t enforce

    it rules. To valid HTML 4, you could leave tags unclosed, have both

    unquoted and quoted attributes, use upper- and lower-case tags, and there

    was no need to provide a DOCTYPE, telling the software consuming the

    what specification the document conformed to. This means browsers

    had to guess where a particular tag ended, which led to a gigantic set

    tests the browser had to do before even considering rendering the document.


    Thankfully, no one has to live with that any more.


    # DOCTYPE Switching


    The advent of XHTML 1.0 and CSS 2.0 gave browsers a chance to break from the

    old rendering model of HTML 4 (now called "quirks mode."). HTML took some

    of the rules of XML and applied them to HTML''s vocabulary. The rules are simple'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# CHAPTER 7 AOL.com 237


    allow (or any other parser) to quickly decipher the document''s structure and
    move on rendering. For a document to meet the standards of valid XHTML, it has
    to


    +   * Use a DOCTYPE as the first content of the document. The DOCTYPE for XHTML
    1.0 transitional:

    ```html

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    ```

    * Have an opening and closing <title> element as the root element of the document.

    * Have an opening and closing <head> element as a child of <html>.

    * Have an opening and closing <body> element as a child of <html> and as a sibling
    of <head>.

    * Have an opening and closing <title> element as a child of <head>.

    * Set all tags in lowercase.

    * Have closed tags. For example, if you create a paragraph tag, it should look
    like this: <p> instead of <P>.

    * Set all attribute names in lowercase.

    * Enclose all attribute values in quotes.


    These rules are fairly easy for browsers to enforce, and equally good news, there
    aren''t many of them, which browsers can render content faster.


    Browsers were able to introduce a feature DOCTYPE switching, which allowed them
    to quickly decide what kind of document they were dealing with and change the
    rendering mode properly. The two modes are called quirks mode and standards mode.(Firefox
    has a third mode, but it is not enough to talk about.) Quirks mode is the old
    model, where the browser goes through all of the different tests in the "old days"
    to create something to render. Standards mode does away with most of those tests
    and gets to remarkable faster. In many cases, just changing from quirks to standards
    can provide a 10x improvement in rendering speed.


    How do you tell the browser to render a document in standards mode? By using a
    DOCTYPE! It''s highly recommended that you use XHTML 1.0 Transitional (see the
    rules list above for the exact text). This provides the same vocabulary of available
    tags while giving you the benefit of standards mode. XHTML 1.0 Strict removes
    several elements (most importantly, iframe) that limits its usefulness.'
