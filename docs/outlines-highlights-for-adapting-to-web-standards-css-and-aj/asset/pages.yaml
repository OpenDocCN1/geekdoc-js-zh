  md: "# 238 ADAPTING TO WEB STANDARDS\n\nOnce your document is rendered in standards\
    \ mode, you're not done. You need to make sure it's valid, using either a built-in\
    \ validator (most good text editors WYSIWYG editors have them built in now) or\
    \ by using the W3C validator at http://validator.w3.org. Having a valid XHTML\
    \ document is just the first step to producing a good product, but it's an important\
    \ test of quality. If the document validates, it means you can reasonably sure\
    \ that the CSS you will find the right elements and do what you expect it to.\n\
    \n# Semantic Markup\n\nEven with a valid XHTML document, it's still possible to\
    \ use HTML tables for layout and continue creating bloated, unmaintainable pages.\
    \ But part of the benefit of having your document rendered in standards mode is\
    \ that you need less markup to handle your layout, because of the instructions\
    \ for how the browser should display your document is in an associated CSS file\
    \ (which we'll get to in a little bit).\n\nInstead of relying on tables, it's\
    \ possible to use the entire HTML vocabulary to express so much more than a document\
    \ is supposed to look. It's possible to express what the content of a document\
    \ means. If there's a list of items, it should be marked up with list items. For\
    \ example, in the old days, lists might be marked up like this:\n\n```\n&#0149;Oranges<br/>\n\
    &#0149;Apples<br/>\n&#0149;Grapes<br/>\n&#0149;Pears<br/>\n```\n\nBut, today you\
    \ should use HTML lists:\n\n+   <ul>\n  <li>Oranges</li>\n  <li>Apples</li>\n\
    \  <li>Grapes</li>\n  <li>Pears</li>\n</ul>\n\nBy default, this gives you the\
    \ default styling of a list, but it also opens up a lot of possibilities. If you\
    \ want to take that list and turn it into a navigation bar, or just be a comma-separated\
    \ list on a single line, you could accomplish it with CSS. Compare that to the\
    \ fate of the previous, old-time example—what you see is all it's ever going to\
    \ be, and no amount of CSS is going to save you.\n\nThis new way, HTML lists,\
    \ will also result in less markup (not in that example, but there will be a better\
    \ one in a minute). Because you're now able to use the entire"
