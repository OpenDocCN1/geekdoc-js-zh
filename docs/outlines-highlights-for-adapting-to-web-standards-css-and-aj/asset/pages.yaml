    Optimizing Page Load Time www.drie.net/musings/page_load_time/


    # A Performance Experiment


    How do some of these techniques fare in the real world? Where can the savings
    actually happen? It''s important to remember that different types of sites will
    fare differently based on their makeup and what techniques are employed on them.
    For example, large news or e-commerce sites and the Web Designer''s blog are different
    types of sites altogether, with diverse server needs and volumes of traffic. A
    number of other variable factors also affect performance, from the quality and
    type of Internet connection to the speed of the computer being used.


    To get real-world examples, metrics must be pulled from large sites with hundreds
    of assets and thousands of users. These sites can be literally hundreds kilobytes
    of file size. You can extrapolate large-site performance benefits from small-scale
    examples, such as blog pages, which are often 100KB or smaller. That''s the test
    we''re going to try.


    # The Basic Setup


    Using a dial-up connection and the excellent Mozilla extension Firefox (www.firefox.com),
    you can inspect the download requests of a given Web page using its networking
    tools. These tools display a graph of each object, its file size, and the time
    to download it in comparison to other objects on the page.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# 264 ADAPTING TO WEB STANDARDS


    Firebug is free, open source, and a highly recommended tool for debugging everything
    from CSS to JavaScript and Ajax.


    Starting with a small-scale blog that that features 112KB of files, Firebug shows
    that these files are broken down into 22 unique requests that take roughly 20.44
    seconds to download over a dial-up connection.


    Consider also the JavaScript, when building advanced page effects, typically is
    loading a number of scripts onload—when the document has finished loading—and
    will not happen until 20 seconds after the page is initially loaded.


    The features


    +   - Four CSS files: a 47kb file, a 13KB file, a 5KB file, and a 738-byte style
    sheet


    +   - Three JavaScript files in the document''s <head>: one 18KB file, one 22KB
    file, and a 20KB file from an external site for statistics tracking


    +   - Three other 20KB JavaScript files from external sources for small advertising
    promotions


    Examine the initial, out-of-the-box graph from Firefox. The graph and list of
    files would be almost exponentially larger on an enterprise-scale site, and so
    would the download times and numbers of files (Figure 1).


    Looking at the graph, you can add the times and see the point at which the CSS
    and JavaScript in the document''s <head> are loaded, the document itself, and
    also the point at which all other files are loaded:


    +   - The HTML document takes 2.5 seconds to load.


    +   - The CSS files are loaded with some overlap to the document, but with a little
    extra time to compare to the HTML document.


    +   - As expected, the three JavaScript files in the <head> are loaded one file
    at a time, in sequence, while nothing else is loaded however, this process does
    not start until after 2.5 seconds or so.


    +   - By the time these JavaScript files are loaded, almost six additional seconds
    have passed.


    +   - Roughly eight seconds pass before the first graph is loaded, due to waiting
    on these requests.


    +   - It can be safely assumed that at a certain point, the document is rendered
    in the user''s window, and colors and layout are applied from the CSS, at least
    2.5 seconds for the CSS to load, although no artwork is displayed in those first
    eight seconds.'
