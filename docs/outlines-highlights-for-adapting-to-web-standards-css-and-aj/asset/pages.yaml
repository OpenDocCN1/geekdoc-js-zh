  md: '# ADAPTING TO WEB STANDARDS


    One of the most intensely debated subjects within the realm of standards the myth
    that all code must be validated. Validation is seen as a critical aspect of Web
    standards-based development, with its noble purpose of ensuring compliance and
    compatibility, and providing help with debugging. Although no one would ever suggest
    that the creation of invalid documents is a good thing, realities need to mitigate
    this practice, and be tempered with priorities as necessary. Both the advantages
    of easier maintenance and the realities of external factors that impact validation
    may occur (and therefore conflict) in any development environment.


    Separation can coexist with legacy content and applications that are migrating
    to a more standards-based approach, preventing pure validation.


    While this perhaps should be true in an idealistic sense, in reality Web standards
    need not be all or nothing. Web teams can easing into these standards and have
    them coexist with legacy content and applications. It is all really about improving
    your code. If legacy content exists or is full of markup that contains attributes,
    it doesn''t mean new code needs to be the same way. What can be fixed and move
    forward in a methodical way. Some environments may not be able to validate right
    away; that''s fine, and is be expected during any transition. Transitional specifications
    exist for those very reasons.


    Other myths or exaggerations are that Web standards-based development means not
    using tables and that design can be only "DIV-based." This is a gross simplification.
    Tables can be perfectly valid, and a bunch of DIVs in a document can likewise
    perfectly invalid and just used wrongly. Web standards-based markup using elements
    and attributes for what they were intended to be for: Tables for tabular data,
    not for layout; headers are content headers; paragraphs are paragraphs; and presentation
    of all elements should be controlled with CSS. The truth of standards is using
    code as it was intended to be. The project''s success depends on being realistic.


    There is no on-off switch for a Web team. Technique is everything, and that discussion
    starts now. Looking deeper, there actually is standards on-off switch: It is built
    into the Web browser. To learn about that, keep reading.


    # Where To Start


    A Web standards strategy needs to start at the markup level, since that there''s
    the offense of mixing HTML markup with presentation details is usually committed.
    Allowing a team to evaluate existing code and look at Web standards for direction
    will shed light on what the ultimate standards strategy should be. The'
