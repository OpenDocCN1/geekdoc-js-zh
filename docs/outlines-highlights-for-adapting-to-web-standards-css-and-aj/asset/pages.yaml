  md: '# CHAPTER 7 AOL.com 199


    In 2005, Jon Miller, AOL’s then-CEO, started a project to change all of that.
    He wanted AOL to open up, to get all of our content onto the Web and out-side
    of the traditional desktop client. The first step to this was to open up the company''s
    home page. As most high-profile projects with a lot of executive involvement,
    the timeline was short, the list of requirements long, and expectations high.


    A small group of folks did the development work on AOL.com, integrated all the
    different Web services, wrote all the code, and worked with our internal experts
    in design, optimization, and accessibility to make it work in many browsers possible,
    as quickly as possible, and available to as many people as possible.


    This chapter shares, directly and indirectly, some of the processes, techniques,
    and lessons they learned while building and maintaining one of the largest and
    most highly trafficked sites on the Web.


    # Setting Your Team Up for Success and Avoiding Failure


    Launching a complete redesign of your company’s site, knowing that you’re facing
    dozens of integration points and an army of stakeholders, all under a tight deadline
    that the entire company knows about, is daunting. That AOL.com launched on time
    (or at all) was due to the efforts of the team setting themselves up for success
    at the very beginning of the project than to any other factor.


    The key to speeding things up during the process of defining the requirements
    and design for AOL.com was getting the developers involved in the early process.
    We’ll discuss what went wrong with the project, and how the development team compensated
    and handled these setbacks by “cheating ahead” and being flexible.


    # What Went Wrong


