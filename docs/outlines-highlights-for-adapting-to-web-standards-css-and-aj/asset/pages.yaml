  md: 'Web applications such as Google''s Gmail (www.gmail.com, Figure 3.2) and Mee-bo''s
    Web-based chat clients (www.meebo.com, Figure 3.3) are helping to popularize Ajax-based
    techniques. They feature real-time, no-page-refresh applications in many ways
    mimic desktop software behaviors. One example in Gmail is a background auto-save
    feature as you draft your email message. Likewise, Meebo features a chat window
    where the conversation is updated in the screen withoutit can also be dragged
    from the screen just as the desktop. These basic, well-known features are powered
    by Ajax, and technically, under the hood by JavaScript.


    # Modern, Progressive, and Unobtrusive Scripting


    Most experts agree that modern JavaScript needs to move far beyond its early history
    of browser-specific techniques and inline code mixed within the HTML markup of
    the Web site.


    Some modern scriptwriters have been doing this include


    +   - Adopting a new progressive pattern and philosophy in which all scripts are
    ''unobtrusive''


    +   - Keeping scripts'' code separate from the content and presentation layers
    of the Web site, in external files where possible. If scripts were not separated,
    then the strict separation of content and presentation would lose its effectiveness.
    Unobtrusive scripts do not ''introduce'' into the other layers.


    +   - Creating mature, scalable, reusable, object-oriented code


    +   - Using cross-browser feature sets rather than visiting pages where the scripts
    do not work for some reason, making the Web pages still work and degrade gracefully


    JavaScript has really entered a time and a state of organization, discipline,
    and responsibility. This is a far cry from the outmoded description given in Wikipedia:
    "a clumsy, harsh language unsuitable for application development" (http://wikipedia.org/wiki/Unobtrusive_JavaScript).
    Much of this bad reputation is due to its history and the coders writing JavaScript,
    but that is changing. Doug Crockford, a frequent speaker on JavaScript, years
    ago wrote JavaScript was "the world''s most misunderstood programming language"
    (www.crockford.com/javascript/javascript.html).


    JavaScript has earned the world''s respect for sure.'
