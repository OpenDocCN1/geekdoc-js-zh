  md: '# CHAPTER 4 Developing Web Software Applications 143


    +   The editor should support basic XHTML semantic tags as the built-in headers
    (1–6), paragraph formatting, at least two types of lists, blockquote, preformatted
    text, and addresses.


    +   A good editor will also strip garbage and invalid tags from content pasted
    from the clipboard, or have multiple options for cleaning pasted content. Often,
    content copied from word Web Pages retains its formatting when pasted into WYSIWYG
    editors. This information, when introduced into valid code, invalidates it, and
    can modify styles that should be applied only from outside the content via the
    CSS.


    +   You may want to tell content authors that if their editing application won''t
    strip invalid tags from incoming content, they should strip the formatting by
    pasting that into a plain text editor before pasting into the WYSIWYG editor.


    +   Ideally, locate a browser-based editor that can support many browsers as possible
    and achieve the above features set. It is not uncommon to find WYSIWYG editors
    configured only for IE; however, today editors are available for Windows and macOS
    in just about every browser.


    Following the above rules and evaluation criteria can mean the difference between
    creating a reliable, standards-complaint site and having a content editor destroy
    a lot of hard work. The quality and performance of any editor program you''ve
    already got in production should be evaluated against these standards and modified
    to produce code that is as close to valid as possible.


    # Third Parties


    Large sites often need to propagate a certain look and feel to third-party sites
    or business applications hosted elsewhere, such as an Investor Relations site
    or perhaps a job board. These sites can be branded to look like the main site,
    and users are intended to not know that they have navigated to another site altogether.


    Standard-based approaches are ideal for such scenarios because not only can the
    artwork and scripts be hosted on the main corporate servers, but so can all the
    CSS files, or at least the CSS that controls the look, feel, and corporate brand
    standards. In these cases, a company can have third-party link to or all of the
    CSS files, and tweak them as necessary over time, with the changes showing up
    without hosting the third-party applications.


    In such cases, you will probably need to provide the third parties with documentation
    of the correct style classes and image headers for certain design touches.'
