  md: "The bottom line is, mixing legacy and modern code, be aware that the unexpected\
    \ can happen, and you may have to do debugging to get around the oddities that\
    \ spring upon you.\n\n# To Validate or Not To Validate Markup\n\nCorrect code\
    \ syntax is extremely important, particularly where XML, accessibility, or alternative\
    \ browsing devices are concerned. For a Web developer just starting to use Web\
    \ standards, a validation service is a great way to debug the code and achieve\
    \ validation. Plus, it will help ensure the code will display consistently in\
