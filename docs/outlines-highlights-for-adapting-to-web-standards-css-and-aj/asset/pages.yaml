    # Naming Conventions for IDs and Layout Blocks


    Continuing to the next step, one of the obvious first decisions that must be made
    when planning to break up artwork into markup and CSS is the structure of the
    HTML documents. The old way of laying out Web page involved complex nested tables
    and bloated code, which was difficult to run through and understand at a glance.


    In a standards-based solution, the layout of the page is controlled with CSS,
    but the structure of the page becomes a simple series of HTML elements. Since
    the basic structure is typically a series of elements with ID attributes, creating
    a naming system for the IDs organizes the code. Mapping the naming system back
    to the template inventory will help the whole Web team.


    At some point, in a CMS phase for instance, developers may break the code up into
    separate files. In these cases, it is very useful to have logical naming'
