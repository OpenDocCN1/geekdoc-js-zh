  md: '# 6


    # EverythingTori.com


    Long after releasing her first single in 1980, singer-songwriter Tori Amos continues
    going strong. It isn''t often a singer stays in the public eye for over two decades,
    continually selling out concerts. The audience is bound to see a change in the
    musician and her music when a career lasts that long, and that certainly applies
    to Amos.


    For an artist, a Web site must reflect the artist''s persona and art. The release
    of her album American Doll Posse put Amos'' focus on the strong woman. The posse
    contains five different characters that together create a complete woman and her
    role today. The album and tour involve four other singers who each represent a
    “part” of Amos—accompanying Amos.'
