  md: '# JavaScript Requirements:

    File and Function Inventory


    Where the front end and the backend come together and present content and that—that’s
    where the scripting layer comes in. And in that place, it takes discipline to
    remove chaos, limit code bloat, and eliminate risk of inconsistent implementations.
    With more comes a bigger need for Web teams to bring consistency and agree on
    internal standards and requirements. A more disciplined approach means creating
    site-wide requirements; an inventory of scripts, what they''re for, how to get
    to them; even rules for writing new scripts.


    Many larger organizations with legacy code are faced with massive collections
    of scripts that are growing out of control. A common scenario is to see different
    pop-up window scripts, a massive but flawed browser-detection script, and nowadays
    even several new Ajax scripts that do the same thing but are repeated and all
    downloaded to the end user. Additionally, there may be dozens document.write stores
    or functions that work the UI with font sizes or colors. This is difficult to
    manage and violates the separation of the independent layers of a given design.


    With any software, an evaluation should be made of all the required functionality,
    a core set of functions created or agreed upon, and a standard way of interacting
    with UI elements created. Scripts should be stored in a central location and documented
    by a knowledgeable staff that is aware of what is possible and what is needed.


    A reference for a JavaScript function can be just like any other programming language.
    For, if there was a utility to combine two strings together (not that someone
