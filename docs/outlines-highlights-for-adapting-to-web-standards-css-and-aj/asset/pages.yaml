  md: "# HTML vs. XHTML Syntax Differences\n\nThere are a number of differences between\
    \ HTML and XHTML. The bottom line is that XHTML uses a stronger, XML-like syntax,\
    \ whereas HTML is more forgiving with optional elements. Assuming the document\
    \ is valid: \n\n+   - XHTML is XML, as well as XSLT and XML tool-compatible.\n\
    - XHTML elements are lowercase.\n- XHTML attribute names are lowercase.\n- XHTML\
    \ is case sensitive.\n- XHTML elements match CSS selectors on a case-sensitive\
    \ basis.\n- XHTML attribute values are quoted, including single or double quotes.\n\
    - XHTML elements are all closed, including single, empty (also known as \"replaced\"\
    ) tags with a trailing slash such as <br /> and <img />.\n- XHTML requires that\
    \ all non-empty tags, such as <td>, <li>, have corresponding closing tags </td>></p>,\
    \ </li>.\n- XHTML block-level elements generally do not appear inside elements.\n\
    - XHTML optional elements such as <tbody> are not represented in the DOM unless\
    \ they are active in the document.\n- XHTML features XML's \"well-formedness,\"\
    \ meaning that tags are correctly nested in a tree structure where starting and\
    \ ending tags do not overlap of order.\n- XHTML empty (single-tag or singleton)\
    \ elements are closed with a trailing slash preceded by a space for compatibility\
    \ reasons (e.g., <br />, <hr />, etc.).\n- XHTML attributes may not use attribute\
    \ minimization; however attributes must be fully specified and quoted like others\
    \ (e.g., selected=\"selected\").\n- XHTML elements are returned and specified\
    \ in DOM JavaScripts in their correct case, whereas in HTML they are always uppercase.\n\
    - XHTML 1.0 and HTML 4.01 Strict deprecate a number of tags and attributes that\
    \ are allowed in transitional varieties.\n- XHTML-embedded CSS and JavaScript\
    \ blocks are considered #PCDATA, and their content may need to be wrapped in XML\
    \ CDATA blocks; consider external scripts and stylesheets.\n- XHTML can, under\
    \ some circumstances, force JavaScript to behave differently than in HTML (e.g.,\
    \ document.write sometimes will not work, etc.).\n- XHTML name attributes are\
    \ deprecated; use id instead of, or in addition to, the name attribute, depending\
    \ on the need.\n\nFor more information, please see the W3C: www.w3.org/TR/xhtml1/#diffs."
