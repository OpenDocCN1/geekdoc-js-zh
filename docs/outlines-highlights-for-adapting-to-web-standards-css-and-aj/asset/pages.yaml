  md: "# CHAPTER 7 AOL.com 239\n\nvocabulary doesn't even have HTML to offer, you\
    \ can use the \"right\" element for content instead of using meaningless elements\
    \ like <div> or <span>. For example, many sites have a navigation bar at the top\
    \ of their sites that contains a list of links. Many sites have very close to\
    \ to the footer to represent that list of links:\n\n```\n<div id=\"navigation\"\
    >\n<div id=\"link-one\"><a href=\"/\">home</a></div>\n<div id=\"link-two\"><a\
    \ href=\"/about\">about</a></div>\n<div id=\"link-three\"><a href=\"/help\">help</a></div>\n\
    <div id=\"link-four\"><a href=\"/login\">login</a></div>\n</div>\n```\n\nMany\
    \ sites don't even use lists but use <span> with onclick events. Why they do the\
    \ goggles might, but it certainly exists out in the world. A better, smaller,\
    \ and more way to represent that list might:\n\n+   \n<li id=\"home-link\"><a\
    \ href=\"/\">home</a></li>\n<li id=\"about-link\"><a href=\"/about\">about</a></li>\n\
    <li id=\"help-link\"><a href=\"/help\">help</a></li>\n<li id=\"login-link\"><a\
    \ href=\"/login\">login</a></li>\n\nThe first snippet contains 272 characters.\
    \ The second contains 247 characters, a savings of almost 10%. Over an entire\
    \ document, especially when replacing tables with more semantic elements, savings\
    \ can grow to as much as 50%.\n\nUsing semantic markup instead of table-based\
    \ layouts or using <div> and <span> for everything can greatly reduce the amount\
    \ of markup in your document, which means your users have a better experience\
    \ with your products.\n\n# CSS Best Practices\n\nCascading Style Sheets were introduced\
    \ to the Web in 1996. With Netscape 4.7 and Internet Explorer 4, CSS was only\
    \ good for setting fonts and text color, because the browsers hadn't implemented\
    \ it fully.\n\nThankfully, today’s modern browsers have reasonably interoperable\
    \ implementations of CSS, which gives developers and designers a lot of freedom\
    \ when it comes to styling semantic content.\n\nAOL.com had very aggressive performance\
    \ targets for broadband and dial-up users, which meant the more style information\
    \ that could be pushed into cached CSS files, the better."
