    # Modern Web Browsers


    Professional Web designers and developers have been able to embrace Web standards
    because the vast majority of users are surfing the Web with a modern browser.
    These browsers support enough of the standard that Web teams can effectively code
    to it while keeping the content and critical features of the site usable and accessible
    by browsers that may be using a text-only version of it. For instance, Netscape
    Navigator 4 typically is usable, accessible text to its inability to support enough
    of the Web standards in use today.


    Modern Web standards-compliant browsers are typically considered to be greater
    than or equal to


    +   - Internet Explorer 5+ on Mac

    - Internet Explorer 5+ on the PC

    - Safari on Mac OS

    - Konqueror (uses WebCore/KHTML like Safari)

    - Netscape 6 (any Gecko-based browser, including Netscape 8)

    - Opera 6

    - Mozilla Firefox on PC/Mac


    Since the Web standards-aware browsers have been available for some time, there
    are sets of Web standards-based browsers that are considered to having trouble
    (or buggy), if not impossible to cope with, levels of Web standards support.


    +   - Konqueror using HTML code base (basically Safari)

    - Internet Explorer 5.x on both Windows and Mac OS

    - Safari 1.x

    - Netscape 6 and 7

    - Opera 6 through 8'
