    # Markup Wrap Up


    Once a team has determined its markup language and its DTD, established how many
    templates are needed, and begun to describe how the markup will be coded, the
    next step is to apply styles to the markup.


    The importance of this foundation of understanding and setting up valid markup
    cannot be overstated. The markup is interconnected to all Web software on a site;
    acts as a delivery mechanism for syndication; and is essential for accessibility,
    backwards compatibility, SEO, CMS template structure, and Web site performance.
    For any and all of these other technologies and JavaScript is keyed off the decisions
    in the markup. For any and all of components to work, valid markup needs to be
    in place.'
