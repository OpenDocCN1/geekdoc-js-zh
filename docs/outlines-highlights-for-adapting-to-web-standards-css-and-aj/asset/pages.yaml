  md: '# Transitional vs. Strict Flavors


    Both HTML and XHTML have two “flavors” called Transitional and Strict, with significant
    differences in syntax. The language and version flavor is specified at the start
    of the document by a Document Type Definition (DTD) that identifies which language
    the document is written in.


    Transitional language versions:


    +   - Include more presentation attributes and elements than the Strict, because
    the intention is that in strict mode the presentation information is fully pushed
    out to the CSS files.


    +   - Are considered to be a transitional bridge specification intended to move
    from the lax rules to the more specific ones in the strict variation.


    +   - May be used when there is legacy code that can''t be made fully


    A common issue in an organization is that content is marked with atrocious code
    in a CMS because it has been around for years. The important thing to note is
    that just because the legacy content stored in a CMS is a wreck, does not mean
    new code needs to be. This should apply even with a transitional DTD: Just because
    the presentation attributes and elements are valid, it does not mean developers
    should use these present attributes and elements. Any new code should use CSS.
    This begins a migration path where any new code is using the strict rules.


    The following outlines attributes and elements that are invalid in strict documents.


    Table 1.1 Strict vs. Transitional Attributes and Elements


    | Strict Elements Deprecated | Strict Attributes Deprecated |

    |---|---|n| applet | align (except tables) |

    | basefont | alink |

    | center | background |

    | dir | bgcolor |

    | font | border (except tables) |

    | index | color |

    | iframe | height |

    | noframes | hspace |'
