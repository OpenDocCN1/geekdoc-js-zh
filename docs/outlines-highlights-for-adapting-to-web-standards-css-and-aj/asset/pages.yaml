  md: "# CHAPTER 1 Coding the Front End 33\n\n+   - The Microsoft Internet Explorer\
    \ Developer Toolbar\n  - http://channel9.msdn.com/wiki/default.aspx/\n    Channel9.InternetExplorerDevToolbar\n\
    \nWith the benefits of validation in mind, it is important to note that validation\
    \ is a goal at one end of a spectrum running from transitional to strict code\
    \ and is much easier to achieve in smaller and controlled environments. The usual\
    \ practice with a Web-based approach is to strive for strict validation.\n\nIn\
    \ larger companies with a multitude of systems, staff, software, internal, external,\
    \ and other unknown kinds complete validation may simply have to wait. Probably\
    \ the most common scenario is to work from valid templates; then the errors that\
    \ crop up in the full site are likely to stem from external sources that may be\
    \ difficult to correct. In fact, in larger organizations validation be nearly\
    \ impossible to achieve due to all of the external factors that may impact what\
    \ is ultimately served up:\n\n+   - Advertising servers\n- Embedded third-party\
    \ software, such as Web statistic tracking tools\n- Content management tools\n\
    - Content management tools WYSIWYG editors\n- Application code for software frameworks\
    \ or development tools\n- Staff skill levels or lazy developers who may be difficult\
    \ to rein in\n- Application service provider (ASP) hosted software, which may\
    \ accept an organization's templates and but not generate validated code for their\
    \ portion of the software\n\nIn these cases, a Web team must determine what the\
    \ appropriate tradeoff level of validation is strict vs. transitional DTOs, external\
    \ vs. internal code, and so forth.\n\nPartially on an initial launch, there may\
    \ be pressures and scheduling issues that make tasks other than validation a higher\
    \ priority when the site renders correctly in all the major browsers. Validation\
    \ of a Web site's code, free errors, is something that authors should strive for\
    \ regardless of external realities, but typically to be weighed against project\
    \ realities.\n\nIn general, validation will be easier to get with a complete redesign\
    \ that has fewer external forces or small applications, but it matters when portions\
    \ of a site's content need to be reused or integrated with a service that expects\
    \ to get, for instance, valid code in an XML format. This can mean the individual\
    \ pieces, such as content in the CMS, are the most important aspects to make valid."
