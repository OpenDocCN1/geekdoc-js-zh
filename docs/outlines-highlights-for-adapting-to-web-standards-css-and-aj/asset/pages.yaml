  md: '# System Design AOL and Architecture


    +   Think about performance up front. The more work you can do during the design
    phase, the better you''ll be in the long run.


    Performance is a process. The last point in the list above is really important,
    so I repeat it: The more work you do up front, the better. The time you spend
    finding problems early in the process will save hours and hours of debugging and
    hair-pulling later when the design’s been agreed upon and you have to get it working.


    On large projects AOL, no one is working alone. There are Web services to integrate,
    databases and Web servers to set up, repositories to create, art to cut, and various
    other tasks that have to get done before you flip the switch and launch something.
    On a project, no person does all of these things. This section’s not going to
    discuss most of these in detail but will address how you can approach the monumental
    integration and technical design tasks associated with building this large.


    # The Buddy System


    When it comes to developing Web applications, the buddy system is definitely the
    way to go. Pairing up your backend/middleware developer with your front-end developer
    as a team to work closely together is a great way to get things done quickly.
    They should work together to design Web services and tools so you end with a seamlessly
    integrated product instead of a bunch of duct tape.


    There are some benefits to this way of working:


    +   The producer and consumer of Web services (JSON, XML) for the page are on
    the same page. This means the services and the code to interact with them will
    be efficient as possible.


    +   No one has to worry about everything. Dividing responsibilities between the
    front end and middleware is a nice clean. You can have some crossover, but you
    know who “owns” each piece.


    +   Although there’s an owner for each piece, there’s also back. Having someone
    close by to bounce ideas off and answer questions is always helpful.


    +   Two is a small number that there’s not a lot of communication overhead. Most
    problems can be solved over an an instant message or a quick phone call. There’s
    no need to schedule big conference calls with dozens of people juggle schedules.'
