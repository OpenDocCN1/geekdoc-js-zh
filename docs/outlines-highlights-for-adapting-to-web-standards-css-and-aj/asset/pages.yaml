  md: '# CHAPTER 7 AOL.com 229


    Last tip on reducing load time: Reduce the number of files you make the browser
    download. Your overall file size might be OK, but if that''s split up a couple
    hundred files, your page will feel a lot slower than it should. There are several
    reasons for this:


    +   - In Internet Explorer, only two files at a time will be downloaded from any
    one domain.


    +   - Every file you download has anywhere from one-half to several kilobytes
    of HTTP headers that come with it. This can greatly increase the total amount
    of data users have to download to see your page. HTTP headers aren''t compressed,
    so there''s very little you can do to reduce this size.


    +   - All the JavaScript and CSS files you put in the <head> of your document
    must be downloaded before the browser will try to render the page. Since all CSS,
    link, and style elements to be specified in the <head> anyway, it should be all
    file.


    +   - JavaScript "blocks" page rendering (meaning the browser won''t display any
    content below <script> tag until the script is downloading and running), even
    when the scripts are pulled inside the body of a document. This means that the
    browser will stop rendering when it gets to a <script> element and wait to download
    or execute before continuing.


    Performance is an ongoing process. For legacy projects, you''ll want to start
    small and make incremental improvements. If you''re starting with a clean slate,
    you''ll want to do as much as you can front to make sure your page is as fast
    as possible. Just because more users are on high-speed connections doesn''t mean
    they''re getting more patience. If anything, they''re less patient—expecting everything
    to load instantly. The more you can get to "instant," the more satisfied users
