  md: '# Launching the Site


    Many Web design projects tend to have project-management and designer/client communications
    challenges. Fierlinger worked closely with Chelsea Laird from The Bridge Entertainment
    Group, Tori Amos''s management company, during construction of the site. Chelsea
    handled the content loading, along with the day-to-day client coordination. As
    the project neared completion, the project involved many content and design changes.
    The team coordinated and managed all of the work online, including uploading the
    changes directly to the site. Communications relied on frequent emails and daily
    instant-messaging conversations.


    The team selected the go-live date to coincide with the launch of a new book and
    album. With most design projects, something else later in the game—suddenly, the
    client wanted a new section of the site dedicated to the book project. The team
    rushed to put together a blog section for the book and the launch site. The new
    section was easy because all of the elements for the frame worked in place.


    Upon launch, fans raved about the new site, to the great relief of the design
    team. Only one issue occurred after launch. The site contained full-length, high-quality
    MP3 files for every track from every album and single Tori Amos released. It was
    a great idea, but the challenge in preventing the ability to illegally download
    the tracks. Fierlinger monitored the Web site''s traffic and the forums for people
    discussing the site. More importantly, he wanted to watch for the possibility
    of someone copying the MP3 files.


    Within a couple of weeks after launch, someone figured out how to do it, and mentioned
    it in one of the forums. As a result, the client edited all of the tracks down
    to 30-second samples.


    The designer continued supporting the site until the management team went into
    the swing of updating and editing content, and they took control of it.


    The site has been successful for over three years. Fierlinger kept an eye on the
    site by subscribing to its RSS feed and receiving user feedback through emails.
    He concluded that the site continued to perform well and was doing exactly as
    expected. The client has successfully added new pages or sections, and frequently
    updated the content. Furthermore, the home page changed nicely to reflect the
    newest project. Thanks to the planning for growth and evolution, the original
    structure adapted well to continuous changes.'
