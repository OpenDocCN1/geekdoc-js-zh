  md: '# 18 ADAPTING TO WEB STANDARDS


    # CONTROVERSY AND THE HISTORY AND FUTURE OF XHTML


    The specification for XHTML states that XHTML is XML and it should be served over
    HTTP by Web servers as application/xhtml+xml. Now, the major browser on the market,
    Microsoft Internet Explorer, does not support XHTML served as XML and will only
    accept it served as text/html, like traditional HTML. For this reason advocates
    of XHTML promote something called "content negotiation", which means serving the
    content with the types the browser says it accepts. This is all fine, but others
    point out that there are XHTML/HTML compatibility guidelines in the XHTML specification
    that will allow XHTML to be served as HTML. It is important to note that in these
    cases the browser sees the XHTML content as nothing more than HTML with invalid
    attributes that are ignored, not as XHTML. A search for "XHTML considered harmful"
    will yield many results and debate on the matter.


    In the meantime, HTML was left years ago without much of a future at the W3C,
    XHTML was defined and embraced by standards advocates everywhere, and HTML 2 came
    along, breaking every imaginable rule of backwards compatibility. It was practically
    ignored.


    In 2004, at several browser companies, including Apple, the Mozilla Foundation,
    and Opera, formed the WHATWG (Web Hypertext Application Technology Working Group)
    when it seemed the W3C was no longer interested in a future for HTML. The WHATWG
    began to define a specification called HTML 5 (and XHTML 5, as extensions to the
    way Web and Applications might work in the future. The W3C did not really comment
    on the new working group for several years.


    Fast forward to 2006, when the W3C finally announced a new HTML working group
    of its own to help address the future of HTML and XHTML. The WHATWG has offered
    up its specification, which blurs the lines between HTML and XHTML considerably.
    The specification has been accepted by the W3C as a starting point, and the debate
    has begun on the future of both HTML and XHTML. Only time will tell.


    For more information on working groups:


    +   - www.w3.org/html/wg/

    - www.whatwg.org


    Anyone can participate in either of these groups.'
