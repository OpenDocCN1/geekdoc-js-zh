- img_proc: true
  md: '# An Interview with Jimmy Byrum


    Yahoo!''s status as a bellwether of the Web was apparent in its recent push for
    standards. Its implementation of Web standards and creation of tools to build
    standards-based Web applications has not only created a fresh, uniform look and
    feel, but Yahoo! has garnered a great deal of goodwill with the Web community
    by openly releasing its research—and the fruits of that research—on its developer
    site, yahoo.com.


    We chatted with Jimmy Byrum, a Web developer instrumental in building the new
    Yahoo! home page, to discuss the redesign process at Yahoo!


    **Mark Trammell:** Did your position change when you went out to London? Is it
    the same sort of position?


    **Jimmy Byrum:** It''s similar. Wanted to have less responsibility, so I could
    focus on traveling around Europe. So, moving to London was more of a personal
    thing than a work thing—I had been working 12+ hour days in Sunnyvale for a few
    years. Then, I thought, "Yeah, I could move to London, travel around Europe, work
    eight-days, and that''s fine."


    I still worked on the front pages for a while, the European front pages. It was
    interesting, because there''s a lot of talk in the States about how to make internationalizable
    code. For the most part, I take my code from the States and make that work for
    different countries. The interesting part was seeing where I succeeded and failed
    as far as internationalization went.


    That was probably one of the best things I learned to the move. Now I think that
    internationalizing code is extremely easy—ridiculously easy, from a front-end
    engineer''s perspective. I can see crazy issues on the break, especially multibyte
    characters. But from a front-end perspective, I''m amazed that we didn''t figure
    it sooner


    **MT:** How did the history of going through the Yahoo redesign help?


    **JB:** That we had a project on its own, plus I had the opportunity of seeing
    the way Yahoo approached it. I think the many U.S. companies approach internationalization
    they make a product and then they, "How do we make this ready for other countries?"
    Had I known more at the time, I could have done it so so the pages were immediately
    ready for other countries. It''s just a mindset change like any other practice.


    If you have a best practice for how to do things in CSS, then you can have a best
    practice for how to make code that''s internationalizable, and it''ll just work.
    Well,'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'I shouldn''t say, "It''ll just work"—any time you say that, something seems
    to go wrong. Rather, it''ll be on the way to working.


    **MT: Regarding redesign process at Yahoo, were you on board at Yahoo before this
    discussion of a redesign, or did they bring you on board for that?


    JB: I coded the home page as was, so I came in the mid-to-late redesign stage
    of the previous home page. I built that one. That was a completely different project
    than the latest home page. I also maintained and developed that home page and
    edited the entire prefix for the new one. So, yes, I was there.


    **MT: So did you choose the team? How did Yahoo build the team?


    JB: Yahoo wanted to redesign the new one, and all previous iterations of the Yahoo
    home page were more iterations than a complete redesign. Though the company would
    think the page looked different, it still had the same basic structure. It still
    even have the same widths of the columns, for instance.


    And so with the new one, we decided to do something different. We hired many new
    people, or brought people from other areas of Yahoo to the front-page team. Yahoo
    hired more engineers, kept a designer who was there for long as I was, a good
    senior product manager, and a program manager. I had never heard of a program
    manager before that project. He managed the overall project. Actually, there were
    a few product managers, and the program manager managed them.


    All of this came together in the team that consisted of the senior product manager,
    the senior designer, and everyone else to an extent. The main people designing
    were the senior product manager and the senior designer and I worked with both
    of them on how to make things, and what we could do. The senior designer would
    say, "We want to do this." I would respond, "Well, we can do this, but it''s going
    to cost us so much in code, this in speed," and we would talk through that.


    **MT: When you say, "We want to do this," who was "we"?


    JB: The senior product manager and the senior designer. What they would do is
    talk to all the senior people on the team asking, "Can we do this?" I would come
    in and help with them. Mainly the senior back-end engineer and I would say if
    it''s possible or not. Then the senior product manager and senior designer would
    get buy-ins from the top exec.


    Many times we mocked up things or we put them into usability testing, where people
    came in the lab on Yahoo''s campus. It''s like presenting all the'
  merge: -1
