  md: '# Rowing Through the Swirl


    The number of stakeholders in AOL.com was daunting. Every decision was up for
    debate at several levels of management, from directors all the way up to the CEO
    of the company. This created a lot of uncertainty, misinformation, and a constantly
    moving target. This made it very difficult for design and development to move
    forward on anything other the most preliminary of explorations.


    How would you guys swirl?


    **Kevin:** For me, the experience is generally comes from a lack of defined leadership
    in that it creates a vacuum, and swirl is kind of an appropriate metaphor in people
    who just kind of move around and there''s no real goal or aim. They tend to debate
    and go to these meetings upon meeting something. And it''s somewhat aimless. I
    think an example right now that I''m working with the Mexico and Puerto Rico portal.
    They want to start but they''re not sure how. It''s not in the official channels
    even. It''s not on the Plan of Record [a list of priorities for a particular business
    unit within AOL].


    And they''re asking me about the level of effort. Well, you guys, first let step
    back, because they''re starting to swirl. And if you let it continue on that path,
    the worst possible scenario is people actually start doing work on this thing
    that''s not quite defined. And who knows if it has executive sign-off to even
    launch if it got code ready.


    I see two types of swirl: *Vertical*, which is where a product manager makes a
    decision, people start moving on it, their boss remakes the decision, it goes
    up, like how it starts as a raindrop but it gets kicked up and down the management
    chain until it becomes this gigantic bill of ice and crashes your.


    And then there horizontal swirl, where it''s just peers, and you can''t decide
    on what the priorities are, and therefore you get into a stalemate and end up
    not accomplishing anything. I think AOL.com had both because everything had to
    go way up the management chain. And even when it went up all the way, sometimes
    came down totally different.


    **Kevin:** It comes down filtered or reinterpreted. I see a lot of it, and it
    looks like it arises from an offhand comment that an executive makes that is interpreted
    as a mandate.


    **Michael:** I would only add that swirl is largely marked by a series of unproductive
    and circling meetings.'
