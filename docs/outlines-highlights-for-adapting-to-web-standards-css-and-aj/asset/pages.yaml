    10. The rest of the right column renders.


    11. The scripts that call the ads are run. Once the ads render, they''re moved
    into the correct spots in the right column.


    Among those familiar with progressive enhancement, that list may raise an eyebrow
    or two. That''s fine, because AOL.com is also accessible—since all important content
    is on the page, screen readers easily handle it. All of JavaScript has accessible
    alternatives. We''ll talk more about accessibility later on.


    AOL.com is a site that people come back to— check mail, read the news, hear the
    latest albums, or get quotes. To improve your experience with the site, files
    are cached, meaning users don''t have to download the files every time they request
    the page. Now, because the content of the page changes so frequently, the HTML
    is never cached. But all JavaScript, CSS, and images are cached, for varying amounts
    of time. For example


    +   - HTML: never cached


    +   - Images: 24 hours


    +   - JavaScript: 30 days


    +   - CSS: 30 days


    This is great, because as long as someone uses the same browser and doesn''t empty
    his cache, he''ll never need to go back to the server to download those files—great
    reducing the amount of time it takes to load the page.


    All of this caching introduces a problem: What if you need to make a change to
    the CSS or JavaScript? There''s a chance that users won''t see that change for
    a moment. AOL.com solves this by versioning all JavaScript and CSS files in the
    URL. When you look at the page, you''ll see a URL that looks like:


    ```

    http://aolcdn.com/_media/aolp_v21/main.css

    ```


    The "v21" piece is the version. There is a configuration option to tell what version
    the page should load. This gets around the caching problem easily; since it''s
    a new file, all users should see the changes as soon as the file''s published.'
