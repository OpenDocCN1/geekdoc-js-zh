- img_proc: true
  md: '# 168 ADAPTING TO WEB STANDARDS


    What did this mean for the Web site? Amos'' management wanted to create, own,
    and manage a site separate from the record label''s site, ToriAm.com. The idea
    was to make it the authoritative site providing information about Amos'' career
    and not just her latest work. They used the domain ToriAm.com and posted a placeholder
    on the Web site—and hired Philip Fierlinger to create harmony between Tori''s
    music and her Web site (Figure 6.1).


    Fierlinger launched the project because he knew someone who had worked with Tori
    Amos. During initial discussions with Tori Amos'' team, Fierlinger found them
    eager to build the site, but he discovered fans sites already doing a great job
    regularly updated and high-quality content. Fierlinger delved deeper to find the
    motivation for building the site, while considering his concerns that the management
    team would have limited access to content for logistical and legal reasons. He
    nearly talked himself out of a job during this discovery phase.


    # Backstage


    A passionate designer, Fierlinger wouldn''t design a Web site without meaningful
    and compelling reasons. He wanted to provide fans a place where they could get
    content and an experience that they couldn''t find on any other site. He continued
    to review the official record label site and fan sites, and discovered these sites
    were missing the components of good design from the audience''s perspective, such
    as usability and a well-thought out information architecture.


    He began the project by exploring Amos-related Web sites to see what was out and
    where the gaps were. As soon as the project received direction, Fierlinger proceeded
    with the project using the standard Web design process, building the wireframes
    and getting feedback on the initial comps to build the site''s structure and taking
    advantage of the power of CSS.


    # Digging into the World of Tori Amos


    The record label''s site looked slick, but had flashy issues and content based
    on what the record labels believed important, not what fans wanted. On the other
    hand, fan sites like The Dent (www.thedent.com) obtained obsess detailed and relevant
    content, providing a stunning experience. While the content more than satisfied
    fans'' thirst for Tori Amos-related information, My Head (www.hereinmyhead.com),
    another fan site, succeeded in the area of design and created up-to-date content.'
