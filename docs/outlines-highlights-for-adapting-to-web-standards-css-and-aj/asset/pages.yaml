    # Get the Stubs Out


    The days of Web pages are over. For the most part, no one writes HTML

    and publishes it as a single document, at least not large sites like AOL.com.

    Means Web services, scripting languages, and integration with other systems.


    When it comes to designing Web services, there is no such thing as a vacuum. A

    Web service should never be designed without thinking about how a developer

    would about consuming that. That means in terms of simp-\plicity, that someone
    will have to interact with your service, and

    making those steps as simple as possible. The easiest way to do this is to create

    stubs—example responses or processes that require a request and return a canned

    (fake) response. This gives the consumers of your Web service chance to play

    around with it and give you feedback before you go through the trouble of actu-

    hook it up with any backend systems. This is a good way to make sure your

    "buddy" (the one we paired up with in the last section) will be able to work

    quickly and with confidence when the "real" service is ready.


    Things to think about creating stubs:


    +   - Do not just think about what happens when things work—think about when

    things aren''t going so well. What does an error response look like? How can

    tell you consumer of your service whether to try again or give up?

    - What kinds of data can be returned? Can you get more than a set number of

    items back? For example, if your returns search results, what does it

    look like when you get two results back? Three? Ten? None?

    - Do you need to provide more than one "flavor" How do you provide both

    XML and JSON responses?

    - Can any programming language consume your services? Validate your assum-\ptions
    and make sure you''re not tying yourself to a single way to consume

    the service.


    Stubs allow for integration to happen before all the pieces are ready. This means

    each party responsible for a piece of infrastructure or any front-end developer

    could be finished with their work before you''re ready to integrate with them.'
