    # The Problem


    The benefit of technologies such as PHP or ever Classic ASP is that the Web program
    has full control over the UI code being produced—an advantage that shouldn''t
    be undervalued. Upkeep and maintenance of an application’s user interface can
    get difficult in a team environment, where the UI code was not written by the
    programmer. In these cases, communication and simple iterations of review are
    critical. Obviously, these are business procedures opposed to a coding technique,
    but these critical processes often do not happen.


    The problem is, in today''s world there are many newer products and technologies
    gaining wide acceptance, which makes reviews and UI development in the backend
    phases harder than ever. For complex business applications, scripting languages
    like those discussed so far have out of favor in circles because the framework
    itself doesn''t impose layered architecture structures. The onus is on programmers
    to follow structured design patterns that enforce good programming practices.
    Older tools such as PHP and ColdFusion were often more accessible to UI designers
    or developers than some of the newer technologies.


    The fundamental problem remains, or has even worse, in new serverside coding environments.
    It can apply whether it is inline server-side coding such as PHP or ASP.NET, which
    has a layered layered approach that attempts to separate business logic and backend
    code. It can also come up where XSLT is being used to generate XHTML or HTML from
    XML.


    So, what is this fundamental problem? While the software engineers were built
    with more mature and tiered backend to front-end environments such as Java, ASP.NET,
    or XML/XSLT, the front-end designers and developers don''t know the front-end
    portions of these software environments—and frequently never will.


    Typically the front-end portions of these software platforms just output the bad
    nonstandard code for the front end that they always have. The challenge is in
    pushing Web standards into the front end of these applications.'
