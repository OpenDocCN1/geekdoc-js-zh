  md: '# THE HIERARCHY OF RULES


    CSS selectors carry with them the notion of "specificity," which means how detailed
    and specific the rules are drives which take precedence when conflicting show
    up. For instance, ID selectors are more specific than elements, and so forth.
    Specificity and other aspects of the "cascade" in CSS are described in the CSS
    recommendation at https://www.w3.org/TR/CSS21/cascade.html.


    # CSS File Content Structure


    Some Web authors argue over the structure of the CSS files'' content. There are
    no absolute rules.


    ```

    #single { border: 1px solid red; padding: 12px; display: inline; }

    ```


    Some CSS authors prefer single-line rules, while others prefer rules that span
    multiple lines: CSS authors prefer single-line rules, while others prefer rules
    that span multiple lines:


    ```

    #multiLine { border: 1px solid red; padding: 12px; display: inline; }

    ```


    There aren''t a lot of compelling reasons to use one over the other, except possibly
    for file size considerations where white space might be a factor. Whatever a team
    does, it''s best to be consistent.


    > TIP

    As of their publishing procedure, larger sites will employ a build process that
    strips out white space to help optimize the CSS files to a smaller size.


    A basic guideline for what order or how to group selectors in a CSS file might
    be


    +   - Define rules that are basic elements that don''t depend on context.

    - Define classes that are reused regardless of context.

    - Define ID selectors roughly in their order, matching their usage in the markup.

    - Define children of ID selectors based on rules set via context.'
