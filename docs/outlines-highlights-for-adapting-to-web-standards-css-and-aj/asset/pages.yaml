  md: 'JavaScript was also a hack, with embedded event handling and code forks based
    on proprietary browser techniques. Finally, to control any output on your Web
    site or application required intertwining your content, presentation, and application
    logic all together in layers, which introduced business risk and management hassles.


    # # Web Site Planning Today


    The vast majority of effort and project planning on large-scale Web projects today
    trivialize the UI layer and treats it as an afterthought, when in fact it can
    deeply impact content management, Web applications, search engine optimization
    (SEO), bandwidth costs, site performance, and maintenance efforts. Plans typically
    start with the back-end software and only touch on the UI in terms of design.


    Fortunately, there are ways to manage the long-term risks and remove the constraints
    of traditional Web coding. Embracing modern techniques starts with the W3C and
    its recommendations, often called Web standards.


    The issue should be considered not only in terms of your design, but also where
    the content management, applications, and other systems are concerned. If a Web
    site is to reap the benefits of a Web standards-based UI, it needs to be considered
    at all levels, and plans should be introduced that will allow the site to grow
    intelligently.


    # # Keys to Web Standards


    What exactly, changes when you''re planning a site with a Web standards-based
    approach?


    First, on the UI layer, conforming to Web standards means 100% separation of presentation
    from content and structure, as well the scripting behavior of UI elements. Second,
    on the back end, this means limiting the mixing of UI code in the Web applications
    and CMS code that may need periodic updates, and applying the same strict separation
    as to any other static screen.


    The distinct areas to concentrate on


    +   - Content and structure—the markup layer, usually made up of HTML (Hyper-Text
    Markup Language) or XHTML (eXtensible hypertext Markup Language)

    - The presentation layer—consisting of CSS (Cascading Style Sheets), which is
    referenced from the markup and the sites scripts

    - The behavior layer—the JavaScript elements that enable user events and interactions'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# ADAPTING WEB STANDARDS


    +   The software and CMS layers—these have a UI of their own and often produce
    the above UI layers


    +   The teams and processes that help to build all of the above


    It is not difficult to attain UI layer separation in a static setting devoid of
    software or large teams. The key is that the software needs to respect these distinctions
    as well, and the project plans need to consider the UI layer as a first-class
    citizen that needs to interact with systems in an intelligent and thoughtful way,
    not as a second-class citizen that is simply an afterthought.


    # Software Architecture Patterns


    Layers code serving different purposes are not a new concept for the software
    industry. In fact, there are numerous examples of architectural design patterns
    that software students have been studying for years. A good list with links to
    examples of architectural design patterns can be found on Wikipedia at http://en.wikipedia.org/wiki/Architectural_pattern_%28computer_science%29.


    An example of a popular pattern called "model-view-controller" is in simple terms,
    like the following:


    +   **Model**: Logical means of raw data used for various business purposes. Think
    of the model as an application interface (API) for other parts of a program to
    connect with it. This layer is responsible for the computational framework we
    rely on comes for us, like adding up the cost of items in a shopping cart or determining
    if today is our wedding anniversary.


    +   **View**: This is the eye candy one sees when the model is rendered in a UI
    layer or part of the UI layer. Think of an HTML+CSS web page from a Web application
    as the view.


    +   **Controller**: Frequently event, interprets and responds to user actions
    and may drive changes to the model. Think of this as the layer responsible for
    handling user actions which include, but are not limited to, mouse clicks or Web-based
    submissions.


    To extend this model to Web software and Web standards, some have labeled the
    UI layer separation of content, presentation, and behavior as a parallel to this
    pattern, using the model (content and structure), the view (presentation), and
    the controller (behavior). Experienced software architects are often quite eager
    to embrace a layered front whether they are familiar with Web design or not.'
