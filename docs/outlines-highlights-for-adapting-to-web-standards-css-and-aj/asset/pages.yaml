  md: '# 4


    # Developing Web Software Applications


    Professional Web teams build Web sites not only to serve static content but also
    to serve dynamic applications and sites from Content Management Systems (CMS).
    These should employ user interface (UI)-layer code, further subdivided into markup,
    CSS, and JavaScript. The importance of this is magnified the larger Web site or
    the longer duration between major site overhauls. Why not reduce dependence on
    back backend programmers or CMS experts, when the UI coders could largely manage
    UI changes themselves?


    Add the challenge of integration with third parties and older and newer Web properties
    from across a Web enterprise, and you''ll see there endless aspects that can benefit
    from Web standards. In fact, anything within end-user interface has code that
    should be implemented using Web standards-based techniques.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Web Apps Stuck in the Past


    Many Web developers learned HTML in the 1990s and haven''t updated their coding
    techniques to incorporate lessons learned then. It can be an interesting experience
    to share new levels of separation and strict adherence to a standard or specification
    with an application developer who’s grown tired of the tag soup of yesterday.
    Modern standards-based approaches are much cleaner, more efficient and logical,
    and tend to appeal to engineers'' sense of "either it works or it doesn''t”—often
    reviving their interest in front-end development.


    By definition, standards-compliant Web sites strive for strict adherence possible.
    When Web-based software intersects with or even produces UI layer code, the same
    levels of discipline should be expected. This benefits the site and the application
    in the long run by reducing the risks that come with a number of software modifications.
    Web standards-based approaches increase compatibility and accessibility, and reduce
    resources and efforts required to change the UI of the application or the static
    portions of a site alike.


    The problem is there is a huge amount of archaic, undisciplined, or just downright
    old-school code being implemented where Web software is concerned We need to take
    a comprehensive look at custom-developed, in-house software and commercial product
    implementations to evaluate how when sites’ software can benefit from Web standards.


    # Software Quality and Inventory Analysis


    In order to determine the nature of the situation, each and every piece of Web
    software employed in a project should be inventoried, cataloged, and evaluated
    for compliance (noncompliance) with Web standards.


    # Web Application Development Problems


    From Web standards perspective, the trouble usually surfaces where the application
    developers need to create their UI layer—in the areas of maintenance, redesigns,
    subtle tweaks, and of course accessibility and browser compatibility.


    Typically, a Web programmer is either dropping code into templates provided by
    a design team or attempting to make a look and feel demonstrated in static representations
    of their application. There are also software packages that generate UI code with
    different levels of customization available. And, of course, programmers writing
    their own front-end code will achieve varying degrees of standards compliance—some
    are quite successful and adept; others are not.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# CHAPTER 4 Developing Web Software Applications 111


    A multifaceted problem of course, but the point is that application frameworks,
    education materials, generated code, and tools are seriously lacking in best-practice
    demonstrations. Many developers rely on some form of integrated development environment
    (IDE), code libraries, or copied code that may or not follow any sort of best
    practices.


    The results back code that produce ugly with inline presentation, table-based
    layouts, extra unnecessary markup, and front-end scripts that conflict, are browser
    specific, or don''t take into account other front-end scripts. Design changes
    become a real problem—and they don''t need to be.


    The UI layer is either generated by human effort or it''s generated by software
    (with little effort) and accepted by humans.


    But much more today''s application engineers, server platforms, and tools don''t
    typically create standards-based front-end code by default, the quality is all
    over the board. It takes a certain amount of effort to achieve standards-compliance
    on the front of applications and content management. By establishing a set of
    best practices for the UI code in server-side software applications, we have something
    which software can be evaluated for improvement.


    It''s important to acknowledge that there is real tradeoff between solving a problem
    that will eliminate issues and later trying to get the product out the door. Striving
    for Web standards-based UI will, in the long run, reduce risk by pulling apart
    the layers of application code, presentation, and UI. However, it takes times
    to get them.


    # Evaluation Criteria


    For each document within an application, a series of questions or evaluation criteria
    should be considered:


    +   * Where does the UI layer come from?


    +   * How is the front-end code structured?


    +   * Does it use valid HTML or XHTML?


    +   * Is there a DOYPE declaration and is the document rendered in standards or
    quirks mode?


    +   * How are presentation aspects declared?


    +   * Do the application developers understand the UI code?


    +   * How many staff members understand how the UI and the backend are integrated?'
  merge: -1
