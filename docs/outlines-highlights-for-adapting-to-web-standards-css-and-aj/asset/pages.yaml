  md: 'CHAPTER 4 Developing Web Software Applications 113


    # Rules To Code By


    These are coding-quality and consistency standards much like those frequently
    placed on application devices; however, they extend to their front-end code, which
    may be a new thing.


    +   - Any UI code should be built following basic Web standards-based best practices
    involving the use of POSH, CSS, and unobtrusive JavaScript (as described in Chapters
    1, 2, and 3 respectively).

    - Browser independence, accessibility, and graceful degradation are key.

    - Programs should reference CSS classes and IDs by pulling them from deep within
    application logic to reachable points in the code, so that making changes to the
    presentation involves minimal risk to the application. These CSS classes and IDs
    may be superficial properties of object classes, stored in configuration files,
    or application-level variables, so they can easily be changed.

    - Avoid inline presentation styles or attributes at all costs.

    - Collaborate in JavaScript applications with front-end coders to share scripts
    as much possible and avoid conflicts.

    - Distill the applications to the most simple and semantic markup possible.

    - Create basic, standard CSS rules for forms so that when new ones are added,
    they can have CSS applied without effort.


    By following these guidelines and adopting clean, separated, Web standards-based
    code, you will ensure that applications and business-critical software won''t
    need significant or risky modifications when a redesign is required.


    Unfortunately, these sorts of guidelines can only go so far with software packages,
    tools, and code generated by IDEs or WYSIWYG editors. These tools let authors
    only so far to remove inline presentation settings, push the settings into CSS
    classes, and so on. It may take some effort to examine alternative settings or
    experiment with one feature over another to get the tools to do what needs to
    be done. However, there are often simple steps to decouple application logic from
    backend code.


