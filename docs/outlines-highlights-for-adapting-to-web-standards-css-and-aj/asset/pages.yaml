  md: '# Frameworks in a Nutshell


    The bottom line is that the decision to use a framework should be a reasoned and
    thought-out decision, just like any other software choice. Frameworks are written
    by people, and despite the large numbers of testers and contributors, bugs do
    surface and are difficult to troubleshoot due to the complex nature of the code
    bases. There are frequently workarounds, however, due to the vast number of ways
    the same tasks can be accomplished with these powerful tools. There are pros and
    cons, and sometimes the con of a large code base for a few simple effects is just
    not worth the extra bandwidth and downloads. Again, it is best to make a reasoned
    decision.


    It''s obvious that modern JavaScript programming has come a long way from the
    simple tricks and copy-paste scripts of the 1990s. Today''s Web sites are being
    built with a keen attention to separation of content from presentation, and this
    separation is hobbbled if the behavior layer of JavaScript is intermingled with
    the other front-end code. Scripts are becoming more mature, including Ajax and
    W3C DOM-based code as opposed to proprietary browser-specific code. Code can be
    isolated and reused in external files and even cleaned up using an independently
    tested and constantly evolving JavaScript framework.


    In the end, however, a Web team should weigh the advantages of a scripting framework
    against its own site’s and team’s needs. This will determine the best approach—the
    one the team should stick with to avoid the inconsistencies of days past.'
