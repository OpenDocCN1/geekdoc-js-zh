  md: '# CHAPTER 3 Integrating the Behavior Layer 85


    # Better Scripts


    Today''s best practices recommend a number of techniques to help improve the quality
    of JavaScript and how it interacts with the UI layer. Previously indicated, these
    techniques are often referred to as "unobtrusive" JavaScript. Some guidelines
    for unobtrusive JavaScript include


    +   * Use W3 DOM techniques, as opposed to proprietary DOM methods, in order to
    target Web standards-supporting browsers.

    * Avoid targeting scripts at specific browsers unless absolutely necessary.

    * Use external files where possible, so as to avoid inline code for XHTML.

    * Avoid inline event handlers.

    * Avoid javascript: pseudo-link protocol usage.

    * Use object detection, as opposed to browser detection, if possible.

    * Create representations to elements through classes and IDs or distinctly separated,
    easy-to-modify code, if possible.

    * Pages should work without scripts, if possible, and in older browsers.

    * Dynamic elements, which are meaningless to users without scripts, should be
    added by the scripts.


    Consider these guidelines in terms of the functionality that is required for your
    site. Modern browsers allow a pure separation of other layers, which can also
    improve the quality of the code. Additionally, scripts for links and other major
    functionality should never be tied to specific browsers unless there is a compelling
    reason, and must be fallbacks in case users have scripts disabled or are using
    a different browser than expected. These days there are too many browsers to target
    specific vendors (except in extreme compatibility conditions). Using Web standards
    allows a single approach to maximize compatibility, because new browsers will
    use these standards as their starting point.


    # Unobtrusive Improvements


    +   * Convert pseudo-links to actual links.

    * Remove scripts to an external file.

    * Convert invalid HTML to semantic and valid code.

    * Add dynamic elements via scripts.

    * Hook up event handlers dynamically.'
  merge: -1
