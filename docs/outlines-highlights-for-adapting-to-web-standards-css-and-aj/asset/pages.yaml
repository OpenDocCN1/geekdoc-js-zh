    HTML controls offer ASP.NET a lot of power, but for various reasons ASP.NET tutorials
    deny their use. From a Web standards perspective, however, these are very powerful
    tools and often preferable to Web controls.


    # ASP.NET REQUIRED READING FOR WEB STANDARDS


    When developing ASP.NET code; it is not too difficult to get closer to a degree
    of professional standards. It is an exercise in making informed and intelligent
    decisions about the code style.


    Microsoft has posted on its MSDN (Microsoft Developers Network) Web site article
    to help authors convert using ASP.NET Web standards and accessibility features.
    This article should be required reading for all ASP.NET technologists; unfortunately,
    it is buried on the site and the techniques are not used in most of the ASP.NET
    examples online. The article can be found here:


    ```

    http://msdn2.microsoft.com/en-us/library/aa479043.aspx

    ```


    Finally, Microsoft has released some open-source code that builds on the extensible
    nature of ASPNET, which allows authors to change the XHTML output from a number
    of the ASP.NET tags built into ASP.NET. The code is called the "ASP.NET 2.0 CSS
    Friendly Control Adapters" and can be found here:


    ```

    www.asp.net/cssadadapters/

    ```


    With a little effort, the server-side code generated by ASP.NET can come fairly
    to generating valid and accessible code.


    # Server-Side Collaboration with UI Designers


    The bottom line is that programmers, developers, and designers should collaborate
    as closely as possible when programming server-side applications, to make sure
    the UI markup follows Web standards-based best practices. This means picking the
    right tool on the server. Keep the UI out of the application and use'
