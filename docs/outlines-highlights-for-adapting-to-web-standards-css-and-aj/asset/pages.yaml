  md: '# 64 ADAPTING TO WEB STANDARDS


    Here''s another style sheet example:


    ```

    .error { color: red; }

    .errorExtreme { font-weight: bold; }

    .aExtError { font-weight: bold; color: red; }

    ```


    Note there are three classes defined: one making text red, the second making text
    bold, and the third combining both. Here is usage of these classes in some XML
    code, where both sets are bold and red, but the author added an extra <span> to
    combine classes, and they also had to create the last selector, which does the
    same as the other two combined:


    ```

    <p class="error"><span class="errorExtreme">This is an extreme error.</span></p>

    ```


    ```

    <p class="aExtError">This is also an EXTREME error.</p>

    ```


    Now, consider the same style code without the last selector (which is not actually
    necessary):


    ```

    .error { color: red; }

    .errorExtreme { font-weight: bold; }

    ```


    Finally, an author who exploits the features of standards-aware Web browsers combines
    the classes using space-delimited lists inside the class attribute of elements,
    like this:


    ```

    <p class="error errorExtreme">This is an EXTREME error.</</p>

    ```


    Again, the result is simply less code, and fewer classes. Advanced usage of CSS
    selectors takes Web standards-based techniques to the next level and can help
    style sheets scale without too much complexity.


    > TIP W3C CSS recommendations reference all manner of fantastic selectors that
    can be used to enhance the elegance and maintainability of CSS. When browser support
    is inconsistent, newer more modern browsers such as Mozilla Firefox, Safari, Opera,
    and even Microsoft Internet Explorer 7 (and) support most of the CSS 2 selectors
    module and in some cases some items from the CSS 3 module.

    The CSS 2 selectors can be found at www.w3.org/TR/REC-CSS2/selector.html.

    The CSS 3 selectors can be found at www.w3.org/TR/css3-selectors.'
