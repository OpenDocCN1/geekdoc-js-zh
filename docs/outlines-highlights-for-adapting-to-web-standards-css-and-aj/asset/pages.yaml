  md: '# DOCTYPE Presence


    DOCTYPE presence, commonly called the "DOCTYPE switch" or "DOCTYPE sniffing,"
    is the ability to assess and change the browser mode. In order to snap a browser
    out of its old methods of rendering Web documents and into standards-compliant
    rendering mode, the placement of valid DOCTYPE within a Web document becomes exceptionally
    important.


    Starting back in 2000 with Internet Explorer 5 for the Macintosh, the rendering
    engines of most browsers toggle between what is commonly referred to as "quirks
    mode" and "standards mode." Netscape, Mozilla, Safari, Conqueror, and Internet
    Explorer (for the PC above version 6.0) all have this feature built into their
    rendering engines.


    Any of the following will cause standards rendering in most browsers today.


    ```

    <DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0//EN"

    "http://www.w3.org/TR/html4/strict.dtd">

    ```


    ```

    <DOCTYPE HTML PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/xhtml1-transitional.dtd">

    ```


    ```

    <DOCTYPE HTML PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"

    "http://www.w3.org/TR/xhtml1/xhtml1-strict.dtd">

    ```


    Quirks mode is intended to use the less parsing rules and to be more forgiving
    of code mistakes that were common in the 1990s. The authors have more to know
    and expect certain quirks (the name that) that are actually invalid behaviors.


    Standards mode, on the other hand, introduces more rigid understandings of the
    specifications. Based on further research of the standards, browser manufacturers
    have attempted to get closer to the exactitude of the specifications. This has
    had the effect of changing what Web authors had to expect in many cases.


    The typical practice in a Web standards-based approach is to strive to keep the
    browser in standards mode at all times for more consistent behavior across browsers
    and platforms.


