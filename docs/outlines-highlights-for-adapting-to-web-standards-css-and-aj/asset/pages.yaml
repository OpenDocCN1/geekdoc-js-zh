  md: '# Introduction


    Building Web sites has changed, and someone forgot to tell the architects.

    Web browsers'' support for modern techniques allowed a new degree of discipline
    and control in coding the front end of a Web site. These new best practices are
    those dictated in what is commonly referred to as "Web standards-based" design
    or development.


    A Web standards-based approach has countless benefits. The larger or more complex
    a Web presence, the more critical Web standards become. This is particularly true
    for an enterprise with many different properties, channels, or brand considerations.
    Add to this the prospect of critical Web-based applications and content management,
    and it becomes a mandate to ensure a high level of quality at every tier of an
    online presence.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# 6 ADAPTING TO WEB STANDARDS


    To embrace standards is only the start. Some planning must occur to create a standards
    strategy that will endure over time, be applied gracefully, and scale within an
    organization, team, or enterprise. A solid foundation should be created by getting
    back to the basics and building with deliberate choices instead of accidental
    decisions.


    This book will help Web team reexamine why we are creating standards-based Web
    sites and how to do it. It will help evaluate what is in place now well as the
    impact of Web standards on a team or a Web site as a whole. It will assist with
    staying organized over time and in finding ways to improve stability and reduce
    risk in Web applications. It will help create techniques that leverage the unique
    strengths of Web standards in a CMS (Content Management System). Finally, this
    book will finish by examining some process and staffing considerations of Web
    standards.


    # What Are Web Standards?


    Web standards is a term used to mean Web pages built using the open and compatible
    recommendations from the World Web Consortium (W3C) and other standards bodies
    as opposed to closed, proprietary, corporate features. These recommendations,
    combined with modern best practices, exploit the standardized power of modern
    Web browsers that dominate the market today, as opposed to out-of-date browsers
    that are feature-rich but inconsistent and often incomparable. Placing a graphic
    that reads "This designed for Netscape Navigator" on the main page of a Web site
    would be a thing of the past.


    Web standards fail gracefully when encountered by out-of-date browsers. The standards
    are also intended to provide greater benefit for accessibility and for other types
    of media. These techniques are built with intentional side effects that can benefit
    users, the company, and the team responsible for creating the sites. Whole books
    have been written on the subject.


    # Basic Benefits of Web Standards


    Sites built with Web standards have many benefits, right out of the box, virtually
    without robust technique or experience. These include


    +   - Style and script reuse consistency

    - Reduced bandwidth using and caching of style and script files

    - Faster rendering of pages

    - Cleaner, easier-to-maintain code'
  merge: -1
  pgno: 14
- img_proc: true
  md: '+   * Easier to make accessible for assistive technologies

    * Easier to make search engine-optimized

    * Increased compatibility between browser vendors

    * Improved changes of document legibility for the next generation of browsers

    * Increased readability for your site!


    # # Web User Interfaces


    In simple software, the front end of a Web site can be referred to as its user
    interface (UI) layer. The UI layer of a Web site includes all the artwork, text,
    formatting-commands, interaction instructions, and controls sent from a Web server
    over the Internet to be viewed by a user inside a Web browser. A user may interact
    or "interface" with the resulting Web page UI by clicking objects or typing, thus
    providing input for a new request, which is then sent back over the Internet to
    the Web server to start the cycle again (FIGURE IN.1).


    Contrast this front end to server-side programming, which includes business logic
    and direct interactions with databases or other data stores. Oftentimes the serverside
    program must render a UI layer. By the same token, the UI layer can send


    # User Interface (UI) Layer


    ![](img/8df3ac083e82f7f766ae1a4a89406407_15_0.png)


    **FIGURE IN.1** The user interface of a Web page is composed of several layers
    of technologies.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'directives or input to a server-side program and may contain some business
    logic.

    This demonstrates how pervasive a UI is and how it touches every aspect of Web\sites,
    from the simplest static marketing page to intricate business logic.


    When Web authors build a modern UI layer, they may include instructions or share
    code between pages and server-side programs to be more efficient.

    Therefore, a redesign, or modifications to the UI, can get complicated or far-reaching.
    Or both.


    How can this be managed in an effective manner, shared among large teams, and
    remain efficient from a productivity standpoint over?


    # User Interface Planning


    The 1990s dot-com boom introduced horrible practices that led to bloated, unstructured,
    risky, and inefficient construction of Web sites. The structure of a simple Web
    page became an ugly mess referred to as "tag soup”—a virtual train wreck of nested
    HTML tables and single-pixel transparent spacer GIFs that were to be designed
    before work could begin on the page''s content or an application (FIGURE.2).


    Massive HTML documents were the norm, weighing down the user experience and making
    the slightest modifications difficult. To enable user interaction via


