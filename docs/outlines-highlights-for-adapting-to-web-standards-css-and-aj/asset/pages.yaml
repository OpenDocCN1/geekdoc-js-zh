- img_proc: true
  md: "# CSS Goes First\n\nBefore a browser renders any part of the page, it will\
    \ download all CSS and JavaScript files in the `<head>`. Once those files are\
    \ downloaded and parsed, the browser will try to render as much of the HTML document\
    \ as it has.\n\nIt's a good idea to put the link to your CSS file as the first\
    \ in the `<head>` after the `<title>` element. This gives your browser a head\
    \ start (no pun intended) on downloading it and building out the CSS DOM. The\
    \ fewer CSS files the browser has to deal with, the simpler that CSS DOM, and\
    \ the faster the browser can render the page.\n\n# One Style to Rule Them All\n\
    \nOne of the things learned during performance testing, especially for broadband\
    \ users, as bandwidth goes up, the browser's CPU and connections-per-host become\
    \ the bottlenecks for performance. According to the HTTP 1.1 specification, a\
    \ browser is only allowed to open two connections for each domain. That means\
    \ if you have two style sheets on the same domain, your browser can't download\
    \ anything while it's working on two files. The fewer you you make your users\
    \ download, the faster your page will load, no matter how bandwidth the user has\
    \ available.\n\nWhat means for your site, as it did for AOL.com, is you should\
    \ put all your CSS into one large style sheet. It may seem like a pain, but there\
    \ are several tricks you can use to keep yourself sane while working with one\
    \ large file that contains all your styles.\n\nThe best place to start is to have\
    \ good markup, which we talked about the previous section. This will help you\
    \ write less CSS, and CSS that is easier to keep organized. By giving yourself\
    \ logical hooks to style by, and semantic classes and IDs, you'll be able to navigate\
    \ the different sections of your CSS much like you navigate through the HTML that\
    \ makes up the document.\n\nYou should pick a selector for your CSS document that\
    \ works for you. You can use the one below, or pick one of your own, but keep\
    \ it consistent. The closer you keep your selectors to the order they appear in\
    \ the document, and the more specific your selectors are, the easier it will be\
    \ to find things when you need to change something.\n\nHere's a sample:\n\n```\n\
    body {\n  width:80%;\nmargin:0;\n```"
  merge: -1
  pgno: 248
