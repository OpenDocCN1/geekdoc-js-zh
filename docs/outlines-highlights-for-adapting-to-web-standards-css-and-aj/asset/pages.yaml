    # NOTE


    In the table above, the ideal solution would also include a row with <th> element
    table headers to label the columns. This is an accessibility benefit, as well
    as more semantic. If the design does not call for the headers to be displayed,
    they can be hidden with some creative CSS, while still making them available to
