    \ (Figure 1.9):\n  http://validator.w3.org/\n* CSS Validation Service\n  http://jigsaw.w3.org/css-validator/\n\
    \nFIGURE 1.9 The Web-based validation services offered by the W3C are excellent\
    \ resources.\n\n![](img/8df3ac083e82f7f766ae1a4a89406407_40_0.png)\n\nThis validator\
    \ checks the validity of Web-documents in HTML, XML, SVG, MML, etc. If you wish\
    \ to validate specific content like XML/CSS stylesheets to find broken links,\
    \ there are other validators and tools available.\n\nAdditionally, several tools\
    \ exist to help Web authors validate their code right from their browser:\n\n\
    +   * The Firefox browser Web Developer Extension from Chris Pederick\n  http://chrispederick.com/work/webdeveloper/\"\
    ,"
