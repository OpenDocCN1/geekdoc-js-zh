  md: '# 7


    # AOL.com


    AOL has a long and conflicted history with the Web. AOL started its “life” as
    an Internet Service Provider (ISP), and all the content viewed by our members—before
    the Web was born—was experienced in a series of proprietary screens we called
    “forms.” As a company, it took a while for us to “get” the Web and understand
    the value of moving our content out of the AOL client and onto the open Web. The
    company’s main portal, AOL.com, had already been around for years (see FIGURE
    7.1), more of a marketing site than a content portal.


    This first-person perspective is provided by Kevin Lawver, a 12-year veteran of
    AOL’s development teams.'
