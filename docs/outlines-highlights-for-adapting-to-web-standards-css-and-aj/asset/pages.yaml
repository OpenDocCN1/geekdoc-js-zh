  md: '# Site Section and Directory-Based CSS Files


    A more conservative approach that scales well over a large Web presence is well-thought,
    directory-based setup for linking style sheets. A typical large-scale Web site
    has global presentation-layer nodes, and style, also often, site-section and even
    page-level needs. From these needs you can create a CSS directory structure that
    will scale and be easy to manage. The directory structure could include:


    +   - Global CSS folder/files

    - Site-section or channel CSS folder/files

    - Page-level CSS folder/files (includes home page)

    - Media CSS folder/files (print, mobile, etc.)


    +   Internationalization CSS files (folders for en_US/, es_ES/, fr_FR/, etc. Note
    each of these items consists of a language code followed by an underscore, followed
    by the region.


    Most pages will only require the global and possibly site-section CSS files (**Figure
    2.3**). Based on unique needs, authors can link page-specific CSS files and so
    far. The biggest downside is that the site templates will require additional `<link>`
    elements in the document''s `<head>` element depending on what the site is being
    styled.


    > Figure 2.3 Using a directory-based structure rather than a modular structure
    provides a more robust and scalable CSS linking structure.


    # Site section and Directory-based CSS


    ![](img/8df3ac083e82f7f766ae1a4a89406407_60_0.png)


    Using this approach and routine evaluations of page-level files, authors can push
    the rules up to site sections and then ultimately to the global files. This approach
    will be examined more thoroughly in the upcoming section.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# CHAPTER 2 Presenting Cascading Style Sheets 53


    This structure scales well and is easy for Web teams to manage. There are also
    fewer questions on the maintenance side as where to put, as well as where to find,
    rules. Finally, there will be fewer HTTP requests with multiple layers of linked
    CSS files.


    # Merging Multiple CSS files


    Another technique worth consideration is merging CSS files. This can be done during
    a build, deployment, or publishing process, or in real time as the files are served
    to the browser. Merging has the added benefit of allowing multiple files to be
    managed by different teams, yet reducing the performance drag when a single request
    is made. This technique has to be carefully planned and executed, keeping all
    sites that reference the CSS files in mind.


    A quick example, imagine a site that includes these files in the documents'' `<head>`.


    ```

    <link rel="stylesheet" href="main.css" type="text/css" />

    <link rel="stylesheet" href="page.css" type="text/css" />

    ```


    Assume main.css contained the following:


    ```

    body { font: 1.2em Sans-serif; }

    .special { color: red; }

    #content { font-size: 1em; }

    ```


    Then, page.css had the following:


    ```

    .other { color: green; }

    #content { font-size: 1.2em; }

    #h1 { font-size: 1.5em; }

    ```


    Obviously these are simple files for demonstration purposes. Different teams or
    members could easily manage main.css and page.css separately, and it would be
    easier to locate rules as needed files. However, before production, a process
    might create all styles.css and link it to the document:


    ```

    <link rel="stylesheet" href="main.css" type="text/css" />

    ```


    During deployment or even upon dynamic generation of the CSS, the files would
    be merged. Keep in mind, if there are rules that depend on the cascade so they
    should be in a certain order, then they should be merged in appropriate.


    ```

    /* main.css */

    body { font: 1.2em sans-serif; }

    .special { color: red; }

    #content { font-size: 1em; }

    ```'
