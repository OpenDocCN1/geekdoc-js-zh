  md: '# ADAPTING TO WEB STANDARDS


    solutions in achieving a more “optimized” experience. We also consult and provide
    real-time feedback and analysis on high priority products such as AOL. com throughout
    the entire design process.


    # What’s the difference between “perceived” and “real” performance?


    When you start digging into performance, you quickly realize there’s a blurry
    line when it comes to deciding when a page is “loaded.” Do you count the stuff
    loading below the fold? What about objects and scripts engineered to load last?


    Perceived performance is the user’s perception of the speed of the page, and when
    it’s ready enough for them to start using. This can vary for different users,
    I generally say it’s when all graphics, text, and essential functionality above
    the fold (browser window without scrolling) is ready to use.


    Real performance is much easier to measure, which is why it serves as our benchmark
    when managing performance-improvement efforts. It’s when all objects on a page
    are loaded, no matter where they load in the document or if the user needs them.


    Our team places emphasis on perceived performance, and uses techniques such as
    moving scripts from the `heads` element to the bottom of the body, system text
    and CSS for design elements, load status messages, strategically ordering HTML
    content, and loading only when the user scrolls to see it.


    # What tools do you use?


    We use HTTPWatch and a homegrown named “PAT” (Performance Analysis Tool) that
    generates charts and reports based on data from HTTPWatch. We parse HTTPWatch’s
    logs, and give us the opportunity to classify objects as advertisements, code,
    graphics, etc., so we have a good idea of how our KB and requests are going, and
    then estimate load time based on that data for various connection speeds.


    We also have a tool that is with our execs called Webometer, which quickly loads
    a site and its competitors in a Web browser, giving instant data on comparative
    performance.


    # What should developers do first when designing a design for performance?


    If you want to truly estimate, you have to imagine the outcome of the resulting
    build, which may be tough on new projects or if you’re new to Web development.
    Also, a more experienced developer (especially one who’s'
