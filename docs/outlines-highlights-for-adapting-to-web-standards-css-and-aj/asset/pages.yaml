  md: 'more complex a site, the more barriers to an absolute standards approach may
    exist. This may lead to compromises and a phased approach that moves to standards
    over time. Such compromises are not ideal but sometimes they are unavoidable.


    # Document Structure:

    Markup Language Choices


    Back in the day, building Web sites meant only one thing: using HTML. Over time,
    some who you notice might have included features from HTML 3.2, 4.0, or even 4.01.


    Creative techniques were invented using HTML to design high-end sites involving
    single-pixel GIFs and massive amounts of nested tables, which resulted in bloated
    and inefficient front-code. These techniques worked well but failed to maintain,
    because the technology was being used for things it was never intended to do.
    Basic layouts and design treatments were effectively code hacks. These hacks have
    been worked into marketing Web sites, Web applications, and content management
    alike. Web browsers today support a more modern and disciplined approach that
    can simplify all of these environments through the adoption of Standards-based
    code.


    A Standards-based approach means creating markup that conforms to the spec as
    easily can be accomplished. This typically means well-formed, correctly nested
    tags; accurate quoting of attributes; and properly structured code. At first,
    these parameters put off Web authors who are caught off guard by them, but oftentimes
    they find that the guidelines actually sets them free.


    Choosing a markup language can be a tough decision, because there are multiple
    options and some aspects are subjective at best, but in the end it is still technique
    that matters.


    # HTML vs. XHTML


    Today, the two basic choices are HTML 4.01 or XHTML 1.0. Both specifications have
    gone a long way to improve the structure of Web markup and move presentation information
    out of the markup and into separate files. Both languages are recommended by the
    W3C and fully acceptable for producing Web sites. In fact, the two languages are
    not that different, with the exception of some attributes, deprecation of presentational
    elements, and XHTML''s adherence to XML syntax.'
