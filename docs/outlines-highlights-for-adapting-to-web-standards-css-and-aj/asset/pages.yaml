    \n```\n.article h2 {\n  font: bold 16px Arial, Helvetica, Sans-Serif; margin-top:\
    \ 0;\n}\n```\n\n+   Paragraph tags surround (and therefore identify) actual paragraphs\
    \ of text, rather than show up at the end of the lines of text.\n\n+   The list\
    \ is marked up as a proper XHTML list, accurately identifying the list of elements\
    \ as such.\n\n+   The final sentence following the list is set off as a real paragraph,\
    \ separate from the list that precedes it.\n\n+   By identifying certain text\
    \ as headers, on which many search engines place importance, the case of search\
    \ engine optimization (SEO) is aided.\n\n+   Because each element is marked up\
