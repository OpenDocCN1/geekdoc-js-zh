  md: "# Simple Steps to Better Server-Side Scripts\n\nAll frameworks or templating\
    \ systems aside, some simple steps can be taken to limit the potential damage\
    \ even with a barebones PHP or similar environment. In the most basic sense, any\
    \ application data output or UI code being generated would be subject to the same\
    \ rules that pertain to UI code that has nothing to do with databases. The only\
    \ difference is that such code is simply generated, as opposed to coded by hand.\n\
    \nIt should be noted that the challenges involved in producing clean separation\
    \ of server-side business logic and presentation layers are not unique to PHP,\
    \ as server-side languages depend on good programming practices and discipline.\
    \ PHP \"Classic ASP\" and ColdFusion in particular share the characteristics of\
    \ the application logic frequently embedded into the same files as the front end.\n\
    \n```\n<php\n// Printing results out\necho \"<table border=\\1\\ width=\\400>\"\
    ;\nwhile ($row = mysql_fetch_assoc($result)) {\n    echo \"<td valign=\"top\"\
    >\";\n    echo \"<td bgcolor=\"#ffffff\">\\$row['username']</td>\";\n    echo\
    \ \"<td>\\$row['firstname']</td>\";\n    echo \"<td>\\$row['lastname']</td>\"\
    ;\n    echo \"<td><font color=\"grey\">\\$row['notes']</font></td>\";\n    echo\
    \ \"</tr>\";\n}\necho \"</table>\";\n?>\n```\n\nThe preceding code does a simple\
    \ thing in PHP: It iterates through rows in a data set returned from a database\
    \ query. Most scripting languages have this similar techniques for outputting\
    \ database results with looping structures. Obviously this is a small and simple\
    \ example, but it could be buried inside other looping structures or complex business\
    \ logic.\n\nThere are drawbacks to the above PHP (and to other similar server-side\
    \ code):\n\n+   * Inline elements are buried inside the looping iteration.\n*\
    \ Design changes require changes to the application. A programmer may need to\
    \ be involved, instead of having it a CSS change external to the application.\n\
    * Any time there needs to be a change to the table looks, a programmer must locate\
    \ the presentation code and modify the modification inline inside the application\
    \ logic."
