  md: '# REINVENTING YAHOO! BC-5


    MT: With the home-page redesign, the team probably had to somehow push it to other
    areas in Yahoo. How did that happen?


    JB: Nate Koechlich drove the front-end engineering at Yahoo for the GUI and accessible
    code. I think Nate was the first person, back in 2004, who brought LSMs (layered
    semantic markup), which is the precursor to keeping HTML, CSS, and JavaScript
    separated.


    Developers coded thus they worked without the JavaScript and things like Nate.
    Nate was the first person who pushed it, back in 2004, and then I and others brought
    into it. Eventually, web-dev/front-end engineering agreed that this is what we
    need to do. If anyone at Yahoo pushed it, it was those of us in front-end engineering.


    MT: Was a training program put in place, or was it more of "Point to these references
    and go learn?"


    JB: At the time I joined, I was WebDev #24 at Yahoo. Front-end engineering contained
    only 24 people. Back then, we gathered in a conference room and just talk about
    it. We relied on email discussion lists and mockups. We didn''t have any accessibility
    experts at the time. In fact, we took our best guess on screen readers worked
    at the time.


    Around 2004 and 2005, we operated in terms of "Well, we think this works and this
    is good," and tried to get contacts with the JAWS people to see if they could
    help us. They advised us to an extent, but we started learning about it once we
    had someone at Yahoo who used it as their only Web browser.


    Web standards and accessibility started with holding discussions and using email
    lists. Now there are over 200 WebDevs in Sunnyvale, so we have classes, best practices
    Web pages, documentation, and standardization. Standardization is weird if you
    standardize too many things, you take some of the thinking out of the job''s daily
    routine.


    MT: But to an extent, isn''t that a good thing?


    JB: Yes, YUI (Yahoo user interface) is great, the JavaScript portions of YUI because
    it''s all these things drag-and-drop that I would bang my head against a while
    to build a good implementation, and now I can just do the thinking out and it
    works.


    The reason that I don''t like to take all the thinking out of the job is that
    you can take something that''s prepackaged, but you don''t know why it''s done
    the way. And I think knowing why it''s done that way is important, because you'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'understand that code better and you''re going to incorporate that into everything
    else you write.


    **MT: So what tools do Yahoo use to make sure people understand the decisions
    that were made?


    **JB: Understanding that comes from just communicating with each other through
    discussions, email lists, wiki pages, or talking to each other. We can also audit
    sites and do reviews, but you can''t do a code review with 200 people.


    I''d say the best way that I''ve seen it is, let''s say you have a person at Yahoo
    who absolutely believes in standards and wants to enforce them. You make sure
    all your team leads believe in those standards, and those team leads can make
    sure their team follows through them. That''s what I did.


    Honestly, working on the front page, you get the best developers. However, if
    any one wrote code that I thought was not as accessible or too a shortcut, I''d
    request changes or say we''re not ready to push the code until this gets fixed.
    I keep the code until works, because no one else will do it for Nate me and the
    minority community of Web developers who pay attention to standards. The people
    using Web and developing for the Web looked at it and pay attention.


    **MT: With the redesign, was it nice to work on the code from the beginning. How
    possible do you think it is to take an existing site and bring it up to the standards
    that everyone wants?


    Because I was working on the home page from the beginning, I could make the decision
    to make it standards compliant, and I could do without worrying buy-ins. With
    an existing site, you need buy-ins, because they''re thinking that we need to
    keep adding features while that you''re thinking about making the code good. Making
    good code, aside from the benefits that we know about, many people don''t see
    the benefit of it.


    **MT: And discussions become ecommerce, like whether you should try to style for
    Netscape 4.


    JB: I will say that one thing Yahoo had to face with this redesign—and actually
    had a bit of discussion about it—is the old page to separate HTML, styling, and
    behaviors; it could had more, but it was a good step in the right direction. We
    also had a tables-based page, so that it looked good on NS4.


    We also had a blacklist in Apache that would route NS4 and IE3 to the tables-based
    page. It was important for business to ensure this page looks good everywhere.
    We finally have a true semantic page built with a base of HTML, adding styles
    and then adding behaviors in the newest page. If so you go to the page in'
