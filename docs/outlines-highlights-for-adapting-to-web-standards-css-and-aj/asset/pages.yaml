    Some Web browsers are more forgiving than others, for cross-browser compatibility
    is best at all times to remain true to CSS names being sensitive.


    # CLASS CONVENTIONS


    Remember that IDs and CSS classes should honor the rules of proper separation
    of content from presentation; they should describe what an object does or the
    purpose serves, not what it looks like. If the presentation attributes change,
    the names might become disconnected or mismatched from the actual attributes—not
    a pretty sight.


    See Chapter 1 for CSS class naming-convention guidelines.


    # Microformats for Conventions,

    Meaning, and Utility


    Good news for authors who might be trying to decide what to call a CSS class:
    There are protocols being established in the industry. A group of Web technologies
    have begun to collaborate and define best practices for defining, in a consistent
    way, certain types of information that might be classified in CSS. These nascent
    protocols for classifying objects and collections of information support programming
    interfaces (APIs) and data-mining activities, but also establish simple models
    for those looking for naming conventions. Some of these protocols have been called
    *microformats*.


    Microformats, at microformats.org (**FIGURE 2.4)**, are defined as:


    > "Simple conventions for embedding semantic markup ... that normalize existing
    content using patterns like brief, descriptive class names based on interoperable
    standards to enable decentralized development of resources, tools, and services."


    +   —www.microformats.org/wiki/what-are-microformats


    Most expert Web standards-aware designers and developers today consider microformats
    to be an excellent protocol to use for coming up with meaningful naming conventions
    for some types of information on a Web site.'
