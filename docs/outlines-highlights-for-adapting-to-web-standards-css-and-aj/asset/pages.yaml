    # # Performance in the Real World


    One of the biggest challenges in any site is performance. We talked at the beginning
    of this section about what you can do up to give yourself the best opportunity
    to have a well-performing site. Now it''s time to talk about what you can do with
    the live product to make sure your users have the best possible experience. The
    three most important things you can do to maximize performance for your users,
    no matter their connection speed, are caching, compression, and reducing the number
    of objects users have to download. We''ll discuss best practices and pitfalls
    around each.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Caching


    We''ve talked about caching before, but it''s important enough to repeat when
    it comes to real-world performance.


    There are few things that users need to download every time they visit your site.
    Usually, the large majority of content users have to download every time they
    view the page. To give your users the best possible performance, it''s a good
    id to cache the content that doesn''t change frequently. Usually includes CSS,
    JavaScript, and images. Since the HTML for dynamic sites is just that—dynamic—there''s
    no good way to cache.


    The easiest way to tell a browser to cache a file is to set the "Expires" HTTP
    header to some far-distant date. Setting this depends on your Web server and programming
    language. Let''s look at a couple examples from AOL.com. All of the CSS and JavaScript
    have an Expires date 30 days in the future. So, for a month, users will use the
    cached version of the CSS. All of the images have an Expires time of only 24 hours
    in the future, since those change frequently—potentially several times a day.
    If you use Apache as your Web server, you can use the following in .htaccess


    ```

    ExpiresActive on

    ExpiresByType "text/css" "now plus 1 month"

    ExpiresByType "image/jpeg" "now plus 1 year"

    ExpiresByType "image/png" "now plus 1 year"

    ExpiresByType "image/gif" "now plus 1 year"

    ExpiresByType "text/javascript" "now plus 1 month"

    ```


    This does raise one problem: What if you have to make a change? AOL.com will publish
    a file with a new URL and change the HTML to point to it. This gets around having
    the file cached and makes sure they get the updates.


    There are many different ways to handle caching and updating content, but this
    approach has worked well for AOL.com.


    # Compression


    One of the things you can do to improve performance is to compress all your non-binary
    files. There are several points where you can do this compression: by hand on
    the file system, the Web server, or in your router. AOL.com currently uses the
    router to do the compression, but most modern Web servers have compression either
    built in or provided by a plug-in.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# ADAPTING TO WEB STANDARDS


    Compressing text content (HTML, CSS, and JavaScript) can provide a savings of
    up to 50% in the amount of data sent over the Internet. There''s a little overhead
    on the user''s machine when the content is decompressed, but 90% of the time it
    is much faster to decompress the file than download it, even over a high-speed
    connection. Compressing binary files as images, though, usually provides no benefit,
    and creates files larger than the original.


    # Reducing Objects


    As connections increase, the bottleneck for users displaying your page moves from
    downloading the content to parsing and rendering. There is also a hard limit on
    the number of files that browsers will download at time. Internet Explorer (all
    versions) will only download two files per host at a time. This means that if
    all your files are on the same domain (like www.aol.com), IE will only download
    two of those files at a time, no matter how the connection is. The default for
    Firefox is four files per domain (although this is easily tweaked by using the
    preferences or the FasterFox). Also, the more complicated your CSS and JavaScript,
    the more files they''re split across, the more the user''s browser has to create
    the initial Document Object Model and the CSS Object Model, and to decide what
    the Cascade and Inheritance for all styles.


    The more you combine CSS and JavaScript into single files, the better. Currently,
    AOL.com has one main JavaScript and CSS file. There are a couple of other files,
    but they''re for external advertising and reporting systems. All of the JavaScript,
    Flash, and CSS files downloaded by ads aren''t loaded until after the browser''s
    "onload" event has been fired.


    # Conclusion


    The team behind AOL.com is a first-rate group of developers and designers working
    in a very closely watched fishbowl under a lot of internal pressure. AOL is the
    front page not only of that domain but all AOL products. That means everyone wants
    a piece of them and their every move is scrutinized. Under this pressure, this
    world-class group turned out a world-class portal—not in how it looks and works
    but in accessibility, performance, and in ease of adding new features. I am proud
    of the small part I could play in the process of developing AOL.com, and to have
    worked with such amazing group of professionals.


    AOL.com isn''t perfect—no site is—but the things it does does well. Those are
    the parts I felt important to share: the team we work together, Web standards,
    accessibility, and performance. Hopefully, you can take the lessons we learned
    on this project and apply them to your own.'
  merge: -1
