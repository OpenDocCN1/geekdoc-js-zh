  md: '# CHAPTER 4  Developing Web Software Applications    135


    classes and clean code; this keeps the design in the hands of the UI team, reducing
    risk and the potential need to involve a programmer just for a UI change. When
    applications are complex or based on older code bases, compromises may be necessary,
    but ultimate goals, standards, and guidelines should be set toward the goal of
    bringing consistency in the long run.


    # Content Management


    When a Web site needs to be updated by nontechnical users, gets larger, or includes
    content that needs to be reused, cataloged, searched, or shared, the typical solution
    is content management software. Content management software is one of the most
    common Web applications that any Web team will encounter. This is because it is
    a common solution to business users'' request for more control over a site.


    Unfortunately, content management applications often insist on producing their
    own markup or require a fair amount of effort to shoehorn into a Web standards-based
    format. Fortunately, this is not as hard as it seems initially, at least with
    a decent content application. Honestly, the hard part is often determining where
    to look for the right pieces of code that actually generate output.


    There are countless content management systems (CMS) of varying degrees of flexibility
    and Web standards compliance. The flexibility, from a standards perspective, depends
    on the nuances of the software''s capabilities as well as the implementation,
    which is the responsibility of the Web team.


    # Baseline Content Management


    The better CMS solutions allow a team to generate the content they want—as opposed
    to what the tools want. There are a number of ways Web standards assist with a
    content management solution:


    +   * Abstracting content’s presentation away from the content source


    +   * Employing fewer CMS templates through effective use of CSS


    +   * Reusing content, because its markup will not be presentation-specific


    +   * Simplifying content authors'' jobs, through fewer presentation aspects being
    required of them


    +   * Expanding the ability of redesigns with less CMS team involvement'
