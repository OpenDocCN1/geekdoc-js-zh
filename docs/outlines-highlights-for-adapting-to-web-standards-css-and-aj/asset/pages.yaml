  md: 'However, when it''s compressed, you''ll see that it''s actually only


    +   * 12 kilobytes of markup

    * 24 kilobytes of JavaScript

    * 9 kilobytes of CSS.


    That means the browser will render the content a *faster*, because it spends less
    waiting for text content to download.


    Compression is great for text content. As you can see, you can greatly reduce
    the size of markup, JavaScript, and CSS. The same can''t be said for compress-images
    or other binary files; you''ll get some benefit there but the big win is for text.


    > NOTE

    Please see Appendix C for more information on compression.


    Let''s go through AOL.com has maximized performance by looking at what has to
    download in order for the most important content on the page to be usable before
    all of the art has downloaded and before the onload event has fired. We''ll walk
    through the pieces of content downloaded and when things happen in the browser.
    FIGURE 7.4 illustrates the process outlined below.


    +   1. Markup is downloaded, decompressed, and turned into a DOM.

    2. JavaScript and CSS files in the `<head>` of the document are downloaded, decompressed,
    and parsed.

    3. The browser starts rendering, stopping as it hits `<script>` elements in the
    document to either run or download scripts. The first script outside the `<head>`
    the browser finds on AOL.com is for reporting; it shows up right after the `<body>`
    tag, so no content is rendered until that file is downloaded, and run.

    4. The browser renders the header, which contains the logo and the search box.
    It encounters another script element. This one puts focus on the search box, so
    users can search right away without needing to click in the field.

    5. Minor scripts write out the Sign In/Sign Out links.

    6. The Dynamic Lead is loaded—first all the markup, and then the three script
    elements that start the rotation.

    7. The rest of the content in the left column is loaded.'
