    HTML, and XHTML has no optional closing tags or attributes.


    +   - XHTML syntax is close to the XHTML-MP (Mobile Profile) and XHTML Basic used
    by many mobile or handheld devices.


    +   - Most authoring tools support creation of valid XHTML.


    And finally, some cons of XHTML might be:


