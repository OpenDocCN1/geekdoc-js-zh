- img_proc: true
  md: 'You should also supply sample code, with example templates that represent the
    pages and designs should be built.


    Just like any organization or software platform, however, third parties are going
    to have varying degrees of ability to accommodate a Web standards approach. For
    example, their platform may not be compatible with a corporate style sheet. In
    these cases, compromise may be necessary. Again, this may mean simple extracts
    of CSS files or creating markup templates for the exceptions. In the long run,
    however, a transition plan should be considered and discussed with thirdparty
    vendors who can''t keep up with the rest of the industry.


    # How To Approach Web Apps


    A Web standards-based approach means a strict separation of content from presentation,
    so it follows that it also means the separation of business logic from presentation.
    Web teams building Web-based applications and software can benefit greatly from
    building their user interfaces with modern approaches that reference CSS as opposed
    to inline presentational attributes.


    Less inline presentation means less to risk to business logic when design changes
    are pushed into software. Additionally, in a potentially complicated software
    environment it can mean that the expert front-end developers can help make these
    UI changes without having to update backend code or even involve backend programmers.


    A challenge going forward is to know where to start to update Web applications
    and exploit the features of the technologies that are available. New features
    of Web standards-based techniques can be a powerful ally for a Web team in Web
    applications built from the ground up and in commercial off-the-shelf content
    management tools.'
