  md: "# CASCADE AND INHERITANCE\n\nCSS Inheritance\nFor some CSS properties, the\
    \ child elements inherit the properties of their parents. A paragraph element,\
    \ for example, is the child of the body element (i.e., the paragraph is \"contained\"\
    \ inside the body). As such, it inherits certain CSS rules that we might define\
    \ for the body. For example, consider the following-style sheet:\n\n```\nbody\
    \ {\n  font: 13px sans-serif;\n  color: #555;\n}\np {\n  color: red;\n}\n```\n\
    \nBy default, the paragraph element inherits both the font and color settings\
    \ of its parent: the body element. Any text within a paragraph tag is also a 13-pixel\
    \ sans-serif font—we need not duplicate that rule by putting it inside the paragraph\
    \ selector. If we want to style the text inside of our paragraphs differently\
    \ than the parent element, we can override the inherited values.\n\nSo, here,\
    \ while we colored the text of the body element gray, we've overridden the color\
    \ in the paragraph element by specifying that its text should be red.\n\n# The\
    \ Cascade\n\nA wonderful benefit of CSS is the Cascade. Think of a large site\
    \ that has different sets of content, just as a large company would have different\
    \ departments, each with its own unique issues and jargon. Think of how much work\
    \ would get done if Human Resources department employees could only talk with\
    \ Product Marketing employees.\n\nTo accommodate the presentation of this large\
    \ site's different content, we can write two or more style sheets for each department's\
    \ section, and import them into a master style sheet—in essence, layering the\
    \ styles rather than maintaining one large style sheet that would encompass the\
    \ entire site. This gives developers the freedom to create and adapt the presentation\
    \ layer as they see fit."
  merge: -1
