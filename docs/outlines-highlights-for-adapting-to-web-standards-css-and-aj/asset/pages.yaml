    \n+   The meaningless table has been replaced by a `<div>` with a class of credit,\
    \ which has CSS applied to create a border and the width and padding.\n\nPlain\
    \ old semantic HTML (POSH) markup is a fundamental principle of Web standards-based\
    \ markup and will aid an organization in fully reaping the benefits of modern\
    \ best practices. It is \"plain old\" not because of its age, rather because it\
    \ is devoid of presentation aspects—which, again, are (or should) be handled by\
    \ the CSS.\n\nPOSH codes meaning to content. Where authors can do it, they should\
    \ begin to introduce meaning to markup in order to convey as much information\
    \ about the content as possible. By its nature, it also means that any presentation\
    \ information is outside the document.\n\nThe wonderful thing about it is that\
    \ with POSH you or a Web development team can clarify, identify, or isolate the\
    \ meaning of the content. This can also be used with other technologies and techniques,\
    \ such as microformats (discussed in the next section), which are built on top\
    \ of POSH."
