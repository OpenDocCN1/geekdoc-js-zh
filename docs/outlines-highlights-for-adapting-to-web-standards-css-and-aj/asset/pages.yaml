  md: '# Content and Structure: Design to Execution


    You never want to plan last. Knowing what needs to be built will help inform your
    decisions while planning a site build. This means the teams responsible for the
    design and building the site. CMS, and applications need to begin to collaborate
    as early as possible in order to plan ahead.


    # Taking Inventory and Templates


    Most design teams will have a series of graphics files that visually describe
    the look and feel of the site based on all project requirements. An inventory
    of the designs, their similarities, and differences is a great place to start
    and quickly reveal the sheer volume of what needs to be built. Frankly, with a
    Web-based approach this will be easier to manage in the past, and organizations
    will likely need fewer templates before.


    Each unique design represents a grid and potentially a UI template that can be
    applied as needed. Grouping similar derivatives of designs can create a hierarchy
    and determine how many templates need to be built to get an understanding of the
    level of effort involved.


    In a CSS and XHTML world, templates that are derivatives may have the same exact
    underlying markup structure but CSS provides slight tweaks. When putting templates
    into groups, Web authors concentrate on layout. Color changes can be addressed
    with CSS tricks, and the underlying structure should be addressed in the CMS templates—just
    concentrate on the layout! Each set of templates will have corresponding specifications
    from the UI design and any application or CMS rules that may have been created.
    It may involve parts of the grid and coming, or possibly accomplishing an element
    is not present. When dealing with potentially dozens or even dozens of designs
    on a massive Web site, passing to collect and organize what needs to be built
    is immensely helpful (FIGURE 1.10). This will also help as new pages are added.


    A UI template inventory is simply an exercise in grouping similar designs so Web
    authors will know what needs to be built. Some organizations find it valuable
    to print out the designs and tape them to a wall in groups, labeling them by number
    (or name) for easy reference. The subtle changes that don''t necessarily require
    a new template might engender variants labeled, "template 3" and "template 3a."


    Once again, this is a simple exercise in helping determine the complexity and
    level of effort required, and to literally see the "big picture." This is frequently
    a "big picture" on a big wall can actually help. It sometimes be helpful to formally
    document these groupings. In some cases, the inventory can be leveraged when creating
    a style guide later.'
