  md: '# 180 ADAPTING TO WEB STANDARDS


    With the CMS decided, the project moved forward using the following build process:


    +   * Design the layouts in Photoshop.

    * Use Dreamweaver for designing the HTML and CSS structure.

    * Carve the design file for background images.

    * Build the initial templates so they work on the local machine to test and ensure
    all code before migrating.

    * Migrate everything into ExpressionEngine.

    * Add dynamic elements in ExpressionEngine—the biggest job.

    * Tweak the design, HTML, and CSS in ExpressionEngine.


    In working on the design approach, Frierling wanted to ensure the layouts were
    scalable. This scalability would allow the site to accommodate content, large
    and small, so the content could grow along with the site. To build a flexible
    structure for scalable layout, he used grid patterns with CSS, which play well
    together, CSS provides the freedom to work with an underlying grid without the
    restrictions that come with hard, formal, and obvious boundaries.


    The flexible and scalable structure Frierling wanted to backgrounds to loosen
    the grid, to extend and overlap the edges, and to create a highly textured scrapbook
    feel. Though he designed the site with content scalability in mind, nothing scale
    easily in situations where the copy, being either too or too long for a given
    space, does not synchronize with the design.


    # Behind the CSS Scenes


    Since ExpressionEngine relied on PHP, the site loaded CSS using PHP with import
    to separate the code from style. This allowed the site to import section-specific
    tags for each of the site. In spite of these advantages, the site contained many
    `<div>` tags, leading to a case of "Divitis," a common Web site ailment. The main
    role of `<div>` is to group the page into sections, such as the navigation, header,
    footer, and body. For EverythingTor.com, no other solution accomplished what the
    site needed. Though having many `<div>` elements and classes adds as much weight
    to a page as tables, CSS still has advantages over tables. For instance, using
    screen readers experience fewer problems with CSS than with tables. After all,
    it was 2004—a time when CSS was not widely adopted by designers and supporting
    browsers.


    The site''s subtle background images led to unforeseen issues cropping up in the
    design. For example, the home page''s "Musings & News" height is shorter than
    the'
  merge: -1
