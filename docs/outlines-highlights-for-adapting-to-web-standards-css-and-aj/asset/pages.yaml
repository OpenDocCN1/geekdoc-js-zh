  md: 'CHAPTER 3 Integrating the Behavior Layer 91


    # TIP


    A great place to start on cross-browser event handlers is Scott Andrew Lapera’s
    now classic "addEvent()" and "remove()" functions posted all the way back in 2001
    (www.scottandrew.com/weblog/articles/cbs-events)


    # Dynamic Elements and innerHTML


    The remaining step in improving the sample page is to add dynamic elements after
    the page has loaded. Unless the elements of the document can serve purpose when
    scripts are disabled, it may be best to add the elements after the page has loaded.


    The W3C DOM includes a series of functions for inserting content and markup into
    a document. These are highly effective; however, for expediency, Microsoft introduced
    a proprietary DOM extension innerHTML that inserts snippets of code. As fate would
    have it, this method is not only faster to code, but performs faster in the browser
    as well. The benefits were difficult to deny, so every major browser vendor supports
    W3C DOM standards-based code has implemented this feature. That makes it exceptionally
    safe and convenient to use. Although some purists bark at its use because it is
    considered unnecessary, for our purposes here it is convenient not to use.


    # NOTE


    Like getElementsByClassName(), innerHTML is part of the WHATWG offered by the
    W3C HTML Working Group. As with all its recommendations, only time will tell if
    it is standardized.


    In the case of our sample page, there is an object (a link in the original) that
    on mouseover shows a box that can be resized (for whatever reason), and the box
    changes its border color when clicked. This object will be inserted dynamically,
    and it is meaningless without scripts.


    # TIP


    Because content is being inserted into the DOM of the document, this code needs
    to be placed before the code that was discussed above in the window. onload for
    the pop-up. This is because DOM modifications happen, event handlers can be lost!
    There are ways around this; searching online for "javascript-event delegation"
    for some helpful links.'
