  md: '# CHAPTER 1 Coding the Front End


    Unfortunately for the industry as a whole, the majority browser is Internet Explorer,
    and so everyone suffers from different measurements, leading many to believe that
    CSS support is hopelessly broken. There are ways to cope with these differences,
    sending different style sheets to IE 4 and 5 to creating special selector "hacks"
    to be read only by specified browsers.


    > TIP

    There are many, references for quirks and standards modes in browsers, but this
    is a good one:


    www.cs.tut.fi/~jkorpela/quirks-mode.html

    A Web search for "CSS box model hack" will yield many techniques for providing
    different measurements to different browsers.

    A preferred method today for serving different styles to IE is using Conditional
    Comments, described in the next chapter.

    MSDN published an excellent document on the CSS changes in Internet Explorer 6.0,
    which were significant and introduced the correct box model: http://msdn2.microsoft.com/en-us/library/bb250395.aspx


    # The Table Gap


    Another area where the change to standards-based layout can cause significant
    confusion is in the old, expected manner. CSS TABLES are used for layout—they
    no longer behave in the way CSS guru Eric Meyer explained some TABLE and image
    scenarios in an article called "Images, Tables, and Mysterious Gaps" (http://developer.mozilla.org/en/docs/Images_Tables_and_Mysterious_Gaps).


    In particular, he describes the trouble that can happen when a Web author takes
    a site that used tables and converts it to strict mode with XHTML or HTML. This
    usually results in some of the tables and images having gaps they used to be flush
    against one.


    The reason is that the correct default bottom alignment for images is on the baseline
    of the text, leaving room beneath for the descenders (such as the letter "y")
    that hang below the line of text. When it was common to build Web sites with images
    sliced and set flush in tables against one another, Web browsers were actually
    interpreting the specification and images behavior incorrectly by leaving out
    this space. By default, images are inline elements intended to align with text.'
