  md: '# Content Management and Clean Content


    The simple process of storing content in a central content repository, with clean
    markup, is in of itself a good way to facilitate content reuse, because the markup
    will be simple and be styled with CSS on different partitions of pages based on
    context. Beyond that, here are some common best practices and scenarios involved
    in professional content management and design with CSS:


    +   - Design with CSS based on context. For example, an article description can
    be rendered as an <h1> level header in a large maroon font on the article page,
    but a smaller black font on the archive page, because the CSS can control that
    difference.


    +   - Store content in a plain format as possible. Use few CSS classes as you
    can, and minimal if any presentation-specific element attributes.


    +   - Stick to semantic markup alone, leaving the content up in a meaningful and
    portable format that can be styled and reused. Recall that CSS coders can apply
    different styles based on contextual position in the site template via an ID or
    class.


    +   - Teach authors only basic HTML structure tags. Ideally, content authors will
    need to learn few if any CSS classes. They just need to know that the first-level
    header in the content area is an <h1>. Or, making a bulleted list will result
    in little icons for bullets, and the header in the related region is on the right
    blue. Design can be applied via CSS and not stored in the CMS content repository.
    Content authors can concentrate on content, design.


    +   - Context on a given page is a useful tool, but context within a site can
    be equally important. A common scenario these different sections of a site having
    different color themes extended from the primary brand. Content itself, stored
    in a database, does not need to know these things, and should be portable between
    site sections. CSS can be driven from a <body> tag class or ID by set section,
    which can toggle different themes through all semantic tags for the portion of
    the site.


    # Content Management Output and Modules


    Content management tools can pose a challenge when it comes to figuring how to
    control the output and produce standards-based code. The hard part is determining
    where to start and whether the output can be controlled. Typically, a CMS outputs
    pages formatted with code sourced from one of several:


    +   - Built-in modules that produce output based on proprietary features or out-of-box
    functionality'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# CHAPTER 4 Developing Web Software Applications 137


    +   * Page-level templates used to display different types of pages

    * Browser-based word processor-type editors (used by content authors)


    The most challenging portions of a CMS application in terms of outputting valid
    standards-based code are often the built-in features over which a team has little
    to no control. The features to watch out for include someone claimed to be the
    great thing about a tool since supposedly the tool can be installed and you have
    a Web site out of the box.


    Risky portions can include


    +   * Administrative modules embedded on public pages

    * Traffic-tracking code or built-in scripts

    * Advertising modules

    * Anything that generates menus

    * Special controls that might produce lists of content (like a News or product
    archive)

    * Search results


    > TIP

    "out of the box" is suspect unless the tool has already been brought up to modern
    standards.


    A powerful tool will let a Web team have access to the code that produces this
    output or insert custom modules that can replace or extend built-in functionality.
    Ideally, there are built-in templates and snippets of code that can be updated.
    Be especially wary of tools that claim to allow customization of the look and
    feel through some sort of control panel, unless it actually exposes code that
    can be modified.


    # Content Management Templates


    Most CMS tools associate pages with templates, each of which is a reusable layout.
    Authors pick the correct template for the section or type of page. The more templates,
    the more the authors need to keep track of—and the more confusing maintenance
    becomes. Intelligent use of CSS and Web standards can mean fewer templates.


    Templates are typically driven by the grid of the page, and this typically means
    different markup. In the Web standards and CSS world, this isn''t necessarily
    the case.'
