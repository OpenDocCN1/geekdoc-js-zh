  md: '# Pop-Up Windows


    Most experts recommend against opening links in external windows. There are a
    variety of opinions on the matter, but with modern browsers that support tabs,
    a huge volume of third-party add-ons that enable pop-up blocking, and a general
    desire to cater to users who find multiple confusing windows, pop-up windows are
    losing favor. Additionally, from a technical standpoint, the old browser-based
    (nonscripted) method of opening windows with the target=`_blank` is not valid.
    The target attribute is deprecated in XHTML transitional and removed altogether
    from XHTML script.


    However, the bottom line is that in many massive corporate environments these
    arguments are still difficult to win; management typically users who are leaving
    the corporate site to be directed to a new window in an attempt to keep the main
    site in the background. Compelling content might get a user there, but that''s
    another discussion. There are many techniques to get pop-up windows, which will
    be used as an example of adding dynamic event handlers to elements on a page that
    need actions hooked to them—and can degrade gracefully.


    # Adding Event Handlers and Scripting with Class


    The first step in setting up event-handling was moving the links'' addresses out
    of the JavaScript and into the href attribute to create real links as a part of
    the conversion to more "POSH" HTML. JavaScript developers should always use real
    links when possible, because of usability and accessibility issues. Dynamic behaviors
    should be an enhancement to a page rather than a necessity. The conditions where
    dynamic behaviors might be considered a necessity is when there are alternatives,
    there is a controlled environment, or the functionality is not required.


    One way of adding dynamic functionality to a page with an effective separation
    of structure and behavior is to assign a CSS class to elements that require scripting
    to be attached to them. Think of the elements with specific class value as a defined
    type of object on a page, and methods, events, and behaviors are assigned to them
    with JavaScript. This "class" notion is in keeping with the object-oriented term
    class, which programmers use and defines a type of object collection with properties
    and methods. The CSS class may or may not have presentation referenced in the
    CSS. If there is no presentation information, it is safely ignored by the CSS,
    but can still be used by JavaScript.


    To use classes effectively, JavaScript authors often use a script function called
    getElementsByClassName() which, like getElementsByTagName(), returns a collection
    or array of elements. In this case, those returned a given class'
