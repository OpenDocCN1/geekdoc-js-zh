  md: '# CHAPTER 1 Coding the Front End


    Taking very same document without any modifications and slapping a strict DOCTYPE
    declaration on the top of the file switches the document to be rendered in standards
    mode today''s browsers:


    ```

    <DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4-strict.dtd">

    <html>

    <head><title>...

    ```


    Opening up the file in a standards-compliant browser yields some surprising results
    that include extra gaps around the graphics in each row, drawing over the carefully
    crafted and beautiful black square boxes (FIGURE 1.7).


    ![](img/8df3ac083e82f7f766ae1a4a89406407_39_0.png)


    FIGURE 1.7 A browser in standards mode can create gaps between artwork in table
    cells.


    The quick and dirty lesson here is that a few simple rules in the CSS can address
    these problems:


    ```

    td img { vertical-align: bottom; }

    ```


    Or even:


    ```

    td img { display: block; }

    ```


    Which solution appropriate depends on the circumstances, and sometimes it''s easiest
    to simply use both. In the end, however, these treatments are quite a common scenario
    in a standards migration, which is exceptionally tricky to debug unless the developer
    is intimately familiar box model and alignment characteristics from the specifications.
    Fortunately for everyone, except Eric Meyer are around. With the corrections applied
    by Meyer''s technique, the table and layout is fixed (FIGURE 1.8).


    ![](img/8df3ac083e82f7f766ae1a4a89406407_39_1.png)


    FIGURE 1.8 Table artwork gaps are easily fixed with a little CSS.'
