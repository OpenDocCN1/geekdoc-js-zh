    site. They are a fact of life in large organizations, and many are full-featured
    development platforms that can be leveraged to allow standards-based output, which
    can only make a site more accessible or compliant. Whether the tool features raw
    output or content being transformed from XML with XSLT (Extensible Stylesheet
    Transformations), the output should be clean and thought through. As a complement,
    effective use of Web standards can also reduce the number of CMS templates and
    make it easier to author content.


    # WYSIWYG for Content Authors


    When working in content environments, nontechnical content authors use some form
    of lower-order WYSIWYG software to help facilitate content entry. These tools
    can range from browser-based editors to tools like Adobe Contribute for the bowtie
    they are not development platforms such as Adobe Dreamweaver or Microsoft Expression
    Web, and have fewer features. Just like any other software, these tools have configuration
    options and varying degrees of Web standards compliance.


    As a general rule, the strongest editor setup for content authors is one where
    many formatting features as possible are disabled, because the features rely on
    code that a Web team won''t be able to control. Effective support for CSS is the
    key.


    # Browser-Based Editing


    Browser-based editors have been around for a while. Microsoft first introduced
    an ActiveX-based editor in Internet Explorer 4. Since then, native JavaScript
    has been added and editors are usually script-based, Java-based, Flash-based,
    or ActiveX. Script-components for browser-based editing are showing up with support
    in most modern Web browsers, including Safari and Opera. For widest compatibility,
    one of these should be chosen.


    Unfortunately, out of the box these browser-based editors are not robust. Internet
    Explorer outputs <font> tags and generates inline styles. They render exactly
    what the browser can render, but the editor features must largely'
