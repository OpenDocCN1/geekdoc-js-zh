  md: '# CHAPTER 1 Coding the Front End 37


    # NOTE


    Where it can be done, the usage of meaningful elements is preferable as with the
    usage of the <ul> elements above. This is because a <div> may be unnecessary,
    as the styles can be applied to the <ul> element just as easily.


    When naming the IDs and classes in a document, keep in mind that the goal at all
    times is to separate content and structure from presentation. This means that
    for classes and IDs it is best to call out what the item is or does, as opposed
    to what it looks like Note that in the example, the content IDs were not named
    left-rail, middle-column, or right-rail, as that would merely reflected their
    location on the page, rather than their function.


    The W3C has an excellent note on its Web site discussing meaningful classes (https://www.w3.org/QA/Tips/goodclassnames).
    This discussion also introduces the concept of semantics or meaning in markup.


    Consider the following:


    ```

    <style type="text/css">

    p.rederror {color: red; }

    p.bolderuser { font-weight: bold; }

    </style>

    ```


    ```

    <p class="rederror">Warning: Username not found!</p>

    <p class="bolderuser">label for="username">Username:</label>

    <input type="text" id="username" name="username" /></p>

    ```


    There are two things wrong with this from a practices standpoint. Both have to
    do with the naming of the classes on the <p> elements: rederror and bolderuser
    both convey presentation information that implies what those elements look like.
    The standard practice is to avoid basing a name on a description of a "physical"
    or visual characteristic.


    A better solution might be:


    ```

    <style type="text/css">

    p.errormessage {color: red; }

    p.userfield { font-weight: bold; }

    </style>

    ```


    ```

    <p class="errormessage">Warning: Username not found!</p>

    <p class="userfield">label for="username">Username:</label>

    <input type="text" id="username" name="username" /></p>

    ```'
