  md: '# CHAPTER 2 Presenting Cascading Style Sheets 57


    # MICROFORMATS


    The specifications are being created at microformats.org are not only an excellent
    source of inspiration for class names, but they pave the way to a more semantic
    Web. By marking up content of certain types in POSH and standardized ways, the
    content is given in Web browsers today (there are extensions for Mozilla Firefox
    already) can call out that information and enable users to do useful things with
    it, such as adding appointments to their calendar software or adding users'' contact
    information to their addresses.


    Future tools may do even more. Search aggregators mine for data such as reviews
    of products, resumes, or even syndication of articles are a distinct possibility.


    There are a of microformats already standardized, and in more development. Some
    of these include


    +   * hCalendar format for date and time (appointment) type information

    * hCard format for contact information

    * XOXO format for outlines

    * hAtom format for syndication of blog articles

    * hResume format for resumés

    * hReview format for reviews


    ```

    <p>

    NavigationArts, LLC<br>

    7901 Jones Branch Road<br>

    McLean, VA, 22102 United States of America<br>

    703.584.8920

    </p>

    </div>

    ```


    Concentrating on the credit position, this bit of POSH code can be enhanced with
    even greater meaning by overlaying a microformat. For instance, one way to assign
    classes and pieces of information to the credit information bit might be:


    ```

    <div id="hcard-Robert-M-Cherny" class="vcard">

    <h3>About the author:</h3>

    <h4><a class="url fn" href="://navigationarts.com">

    <span class="given-name">Rob</span></span>

    <span class="family-name">Cherny</span></a><br>

    ```'
