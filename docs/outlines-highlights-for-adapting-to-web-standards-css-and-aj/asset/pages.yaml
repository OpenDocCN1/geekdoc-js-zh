  md: '# Acknowledgements


    Adapting to Web Standards tackles the very real problems of reaching out and teaching
    people about Web standards, but also how to incorporate those technologies into
    everyday workflows when swift and frequent deadlines crush progress.


    Written to empower the individual designer and the large organizations to start
    working in the correct direction, Adapting to Web Standards required the involvement
    of the hands of a great number of professionals.


    If you know Bob Cheney, you know a true Web specialist. He seems to cover every
    aspect of the DOM. His presence is felt in the core of this book from the introduction
    through the fourth chapter.


    I''m not sure how Kimberly Blessing came into the book project. I believe it was
    one of those mad, late night pushes to get edits and reviews out the proverbial
    deal she made in offer to write about managing Web standards. That turned into
    Chapter 5 of the current book. I''m grateful for her time and support for this
    project.


    Special thanks to Meryl K. Evans, the content maven. She stepped in at the right
    moment to help tackle the Tori Amos chapter.


    I was honored when I talked to Kevin Lawyer building off his panel idea and turning
    into a book, he not only supported it, but also wanted to be a part of the process.
    He did an amazing job in capturing a small part of the Web standards process at
    AOL.


    Thanks to the illustrator Rebecca Gunter for the illustrations for Kimberly''s
    chapter. You can find more of her work at http://soap-committee.deviantart.com.


    Many thanks to Molly E. Holzschlag for doing the technical editing chores of the
    book. Not sure how she had the time to do this among her other activities, but
    I''m sure who has written thirty-plus books on Web development like she could
    find the way. See http://molly.com.


    Wendy Katz and Doug Adrian helped the creation of the book with their timely questions
    and editing skills.


    Thanks to Victor Gavanda and Michael Nolan from Peach Press/New Riders for guiding
    the book from concept to reality.


    As anyone who has ever written a chapter for a book, it''s not easy. It''s a commitment
    demanding time and focus that keeps people away from weekend getaways or get-togethers
    with friends and loved ones. I want to let the ones closest to me know that I''m
    looking forward to our seeing all and not boring you with talk about Web standards.


    For a while, at least.


    Christopher Schmitt


    christopherschmitt.com


    Lead Author'
