    # Presentation Set Free


    CSS is critical to a Web standards-based approach, since in a standards world—where
    HTML is virtually plain text—all presentation information is controlled from the
    CSS. This has numerous advantages, all the more so the larger the site, because
    all presentation information can be controlled from a manageable set of files.


    It is true, however, that the larger and more complex the site, the more of a
    challenge managing effective CSS becomes, due to sheer volume. Having a clean
    base of markup and using effective linking strategies, combined with intelligent
    creation of selectors, will get a Web team halfway there already, providing them
    with a newfound sense of freedom and flexibility. Each environment will be different,
    of course, and it is important to make intelligent decisions on how to best manage
    the volume of design information that CSS needs to handle.


    Once a base of markup and design is in place, adding interaction is another critical
    component to a modern Web site. Front-end markup design, and both of these technologies
    interact with the scripting layer as well.'
