  md: '# CHAPTER 1 Coding the Front End


    # NOTE


    XHTML 1.1 has been defined; however, by the specification it must conform closely
    to XML that the majority-share Web browser today has significant trouble with
    it. This is, of course, Microsoft Internet Explorer, which has incomplete support
    for XML. That leaves HTML 4.01 and XHTML 1.0 as the most realistic options.


    For many years, Web standards advocates insisted that XHTML was the next logical
    step for the Web and that it should be used for markup. Some still feel strongly
    that this is the case. Exceptions among exist, and in fact many of the creators
    of browser software today favor HTML and consider most of the XHTML as being served
    from Web servers in an incorrect manner (see sidebar "Controversy and the History
    and Future of XHTML"). Everyone has an opinion, and a developer should always
    weigh the pros and cons against the goals of his or her particular project.


    Whatever option is subscribed to, HTML is here to stay, and it will be a very
    long time before any Web browsers drop support for. In the end, though, what matters
    is how a developer codes her or his language of choice, and in particular how
    it relates to presentation and behavior.


    # Pros and Cons of HTML vs. XHTML


    Here are a few of many opinions about HTML and XHTML, starting with some pros
    of HTML:


    +   * XHTML has an establishing author with a smaller learning curve than other
    markup languages. Most content authors understand the basics of HTML syntax and
    need to learn the subtle nuances of using CSS as opposed to presentational HTML.
    They need to learn a few bad habits and stop thinking that elements and tags look
    a certain way because this will be controlled by CSS. They will also need to learn
    to code the markup in a semantic style, which will be explained later.


    +   * HTML is easier to integrate with legacy systems'' markup. This is a compelling
    case in a large-scale enterprise environment that has lots of legacy code. Some
    software will simply not produce valid XHTML and in situations like this, HTML
    may be the only way to go.'
