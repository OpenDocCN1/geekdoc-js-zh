  md: '# # 2

    # Presenting Cascading Style Sheets


    The presentation layer in Web standards-based Web sites is controlled by Cascading
    Style Sheets (hereafter referred to as CSS). When an author starts to build CSS
    files for a site, a number of factors should be considered. These can run the
    gamut from how many style sheets to the organization of the files’ content, and
    even determining what it means to write efficient, scalable CSS.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# How Many CSS Files?


    One of the hardest questions is how many CSS files a project will need. This depends
    entirely on the needs and size of a Web site. The answer, frankly, is: as many
    as needed (and this may evolve as the site is built). Some sites may need a single
    style sheet, while others may many. In larger sites, it may not make sense to
    load all the CSS rules that are required on every page. One of the major strengths
    of CSS is the rule cascade and multiple files and sets of rules can be merged
    by applying multiple sources of CSS to a single document. The challenge is to
    structure the files in an intelligent way that scales.


    Designers and developers are commonly tempted to break CSS files into function
    based on the types of rules. An example breakup is as follows:


    +   - typography.css


    +   - theme.css (or colors.css)


    +   - layout.css


    At our company, we''ve tried this approach and found it to be fundamentally not
    worth the effort, with the negatives far outweighing the positives. With this
    technique, a Web team could easily switch out the colors or the type styles by
    using alternate style sheets. Sounds good, but in the reality maintenance issues,
    particularly over time, skyrocket with this approach and are simply not worth
    it in most cases. There needs to be a good reason to do this.


    The issues that come with broken-up CSS files include


    +   - Debugging becomes difficult and time-consuming because each selector is
    spread out among many files.


    +   - Hidden dependencies between files may violate the breakup of rules, resulting
    in inconsistent distinctions between files.


    +   - Debugging by editing multiple files becomes a hassle or debugging begins
    in a single file and then solutions need to be broken up between files; sometimes
    this last step does not happen, either on purpose or by accident.


    +   - The CSS cascade and specificity is more difficult to manage.


    +   - Increased overall size of the CSS for a site; each selector is repeated
    in each file.


    +   - Web authors can be confused as to the nature of different rules and what
    files rules belong to. For instance, some rules, such as borders, provide both
    layout and color.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# CHAPTER 2 Presenting Cascading Style Sheets 49


    +   - Broken-up CSS files require additional HTTP requests for a full set of style
    sheets—an unnecessary burden on the Web browser and server.


    The only time that this is a good idea is when there is in a solid requirement
    for this approach, and even then alternatives might exist.


    For instance, a site may feature a JavaScript text-resizing widget. In this case,
    a different style for a different set of typography-related style rules may be
    a good idea. However, it is important to note that even in this case a different
    approach could be taken, and the extra file may not be required. Instead of using
    a alternative style sheet, consider applying a new class to a parent element such
    as the `<body>` element or a content area. Resetting the base `<body>` text size
    can be highly effective if developers are using relative font sizes and percentage-based
    units. Additionally, a single extra class on a parent element can affect the font
    of any `<div>` element or the entire document.


    A JavaScript file may include the following:


    ```

    var x = document.getElementsByTagName("body")[0];

    x.className = "alttext";

    ```


    Where the style sheet contains rules such as:


    ```

    body {font-size: 1em};

    body.altText {font-size: 1.3em};

    ```


    The bottom line is, Web authors should be selective as to what rules are pulled
    into different files, and consider the reasons for doing so as well as any alternatives.
    Also, don''t create additional files for the sake of it when other techniques—such
    as using a script, like above, rather than switching style sheets—may create savings
    or keeping the code cohesive.


    # CSS File and Linking Strategies


    There are different ways to construct a flexible and scalable CSS structure. In
    all cases, there are tradeoffs between performance, modularity, and ease of maintenance.


    Linking a single CSS file will place all rules in a single location that is easy
    to manage, and you can use search strings to find appropriate rules and easily
    edit the files. At the same time, a single CSS file can be enormous and difficult
    to manage across an enterprise with a multitude of business channels, requirements
    of branding or functionality, or a growing team.'
  merge: -1
  pgno: 57
