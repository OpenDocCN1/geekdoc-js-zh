  md: 'There is a lot to look at here, to illustrate a number of different points:


    +   * The whole thing must be a <form> element with `runat=\`server\` in order
    to use the <asp:LinkButton /> control. This control should be avoided if possible,
    as well in a moment when the resulting XHTMLML is examined.


    +   * Note the first ASP.NET server tag in the unordered list is of <asp:HyperLink
    />. This is a Web Server Control that generates an HTML link and provides program
    access to all the attributes and text of the tag, as demonstrated in the <script>
    block where the myLink references are located.


    +   * The second link has no attribute and is also programmatically controlled
    from the <script> block. This is a server-side HTML control (the runat=\`server\`
    attribute) that also allows programmatic access to the item''s attributes. This
    grants more control over the output but fewer server-side features.


    Adding an ID and code runat=server to any HTML tag provides access to the tags,
    which is exceptionally powerful because programmers can control the tag''s visibility,
    content, and attributes with a few lines of code, located at the programming layer.


    Both controls do virtually the same thing, and the Web controls provide added
    features over and above the HTML controls, the Web control is less predictable
    and features presentation attributes frequently used by programmers after the
    quick fix. When using Web controls, programmers should try to stick to the CssClass
    attribute, avoid presentation attributes, and use HTML controls for greater predictability
    in the code output, unless it is necessary for the specific case.


