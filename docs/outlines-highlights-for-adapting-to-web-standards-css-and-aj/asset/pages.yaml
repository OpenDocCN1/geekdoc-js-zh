  md: "An exceptionally flexible approach is using modular sets of CSS files that\
    \ serve different purposes. Using a series of linking CSS files, developers can\
    \ easily mix and match sets of @import rules of CSS files that serve different\
    \ purposes.\n\nTake a moment to consider the following structure. If XHTML template\
    \ #1 contains the following CSS link element:\n\n```\n<link href=\"css/global.css\"\
    \ rel=\"stylesheet\" type=\"text/css\" />\n```\n\nThen, in the global.css file,\
    \ the file contains no rules, but rather uses the @import command to bring in\
    \ external CSS files (FIGURE 2.1) for global pages on the site:\n\n+   - @import\
    \ url(styles.css);\n- @import url(nav-bar.css);\n- @import url(Content.css);\n\
    \nFIGURE 2.1 A modular CSS linking structure for sharing CSS files.\n\n| Modular\
    \ CSS—page 1 |\n|---| \n| <link> global.css | |\n| @import | styles.css |\n| @import\
    \ | nav-bar.css |\n| @import | content.css |\n\nElsewhere on this, XHTML template\
    \ #2, which contains some applications and forms, contains the following:\n\n\
    ```\n<link href=\"css/global-apps.css\" rel=\"stylesheet\" type=\"text/css\" />\n\
    ```\n\nThen, the global-apps.css file contains import statements for the following:\n\
    \n+   - @import url(styles.css);\n- @import url(forms-brand.css);\n- @import url(forms.css);\n\
    \nNote that this link allows for a modular inclusion of different CSS files based\
    \ on need (FIGURE 2.2). Both files styles.css as the core CSS. The styles for\
    \ forms in forms-brand.css and forms.css are not needed in the global pages,"
  merge: -1
  pgno: 58
