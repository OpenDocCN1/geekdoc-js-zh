  md: '# HTTP Compression


    HTTP 1.1 file compression has been supported by most Web browsers for years. Unfortunately,
    for years common Web browsers as Netscape 4 had exceptionally buggy implementations.
    With that said, Web servers have shaken the bugs out and server-side technology
    has caught up to server to some degree. With Apache there is mod_deflate, mod_zip,
    and even PHP has some built-in real-time compression options. Microsoft''s Internet
    Information Server (IIS) also supports compression, although it is complicated
    to set up and third-party add-ons assist or even its features.


    For demonstration purposes, the last step is to enable HTTP compression on the
    server side for the JavaScript and CSS files. Note that in this demonstration,
    the HTML document has not been compressed, although document compression is almost
    more common and can yield spectacular results as well, on the order of a 60% savings.
    These are all text-based files, which are easy to compress and produce wonderful
    savings that really pay off.


    How compression can be enabled and beyond the scope of this discussion; however,
    many resources are available and should be read carefully.


    Loading the test page and tracking the Firefox graph shows some impressive results
    (FIGURE 3):


    +   - On a dial-up connection, the page now loads in 16 seconds (a three-second
    gain for a user is exceptional).


    +   - 20KB in JS has been reduced to 5KB.


    +   - 20KB in JS has been reduced to 10KB.


    ![](img/8df3ac083e82f7f766ae1a4a89406407_276_0.png)


    FIGURE 3.3 The page with HTTP compression enabled.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'This is a benefit in terms of server-side bandwidth costs and downloads for
    users, and the impact on page document weight is obvious. Note that one of the
    JS files could not be merged or compressed because it was hosted on an outside
    server.


    Remember that these experiments were performed on a small-scale site with low
    traffic. The results on enterprise sites—with high bandwidth costs, a greater
    quantity of assets, larger file sizes, and more users—can provide an exceptional
    payoff.


    # TIP


    > Compression can be tricky for many reasons, in particular due to its sordid
    history and inconsistent support by browsers. Attempts to configure or implement
    HTTP compression should be performed carefully and with ample research, experiments,
    and lots and lots of testing. The tests should be tested. And then tested again.
    Search online for help with regard to PHP compression, Apache mod_deflate, mod_gzip,
    or IIS utilities.'
