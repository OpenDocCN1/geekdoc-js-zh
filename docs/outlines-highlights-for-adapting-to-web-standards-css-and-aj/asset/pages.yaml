    \ to the code will be further explained as the parts are improved one by one in\
    \ the following sections.\n\n# No Proprietary Code\n\nOne of the biggest issues\
    \ in older scripts (and in this example) relies on proprietary vendor techniques\
    \ such as document.all, which has limited browser support beyond Internet Explorer.\
    \ Web standards support nonpropri technologies that work across browsers, and\
    \ there are certain alternatives defined by the W3C in its Document Object Model.\
    \ Two of these alternatives are\n\n+   * document.getElementById(id)\n\nReturns\
    \ an element when passed an id that is the ID attribute of the element; the ID\
    \ needs to be unique in the document.\n\n+   * element.getElementsByTagName(tag)\n\
    \nReturns a nodeList (JavaScript array) of the matching elements by tag.\n\nThere\
    \ are several examples where document.all can be seamlessly swapped out with document.getElementById.\
    \ Replace the following:\n\n```\nvar x = document.all(\"myHTML\")\n```\n\nwith\
