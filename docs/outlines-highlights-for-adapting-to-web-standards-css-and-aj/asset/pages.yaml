  md: '# CHAPTER 4 Developing Web Software Applications 121


    # Beware Server-Generated Code


    Some more modern application environments have features designed to help remove
    "burden" of generating HTML or other UI code from the application developers''
    plate. The concept is that HTML (or XHTML) can be easily abstracted and then dynamically
    generated by commands passed into the programming language of the tool kit. These
    are usually properties assigned to data sets returned from database queries, or
    other structures that control the dynamic output.


    The problem with this is that both the design and the ultimate code that is output
    are largely at the mercy of the writers of the software framework that abstracts
    and generates the code. Success also depends on the level of effort put in the
    programmer to exploit whatever UI are available. Different frameworks have need
    to "view-source" and actually observe how the markup is structured when it is
    output as opposed to just how it looks, the markup is dynamically generated.


    Nothing can replace the human element in most cases. It just takes extra step
    of seeing what the code is doing and figuring out how to mold it. Sometimes there
    are things that can be done; sometimes there aren''t. Having made it far into
    this book, it should be obvious that getting the front end standards-compliant
    be a significant benefit.


    # Microsoft ASP.NET Framework


    One that has gained massive adoption, particularly in large enterprises, is Microsoft''s
    critically acclaimed ASP.NET framework (the successor to "Classic" ASP). The .NET
    framework classes, objects, and APIs are powerful.


    ASP.NET enters, by its model, layers of code that abstract database and program
    logic to a degree from "front end" files with the ASPX extension. These files
    are HTML and custom ASP.NET tags, which will be discussed later. In UI coders
    learn these tags to control the front end with hooks for the programmers to use.
    This is certainly a possibility, but in reality is rarely done. The Web team would
    need to make a conscious decision to evaluate the UI team and collaborate on these
    efforts, and the UI team would be willing to learn. It could happen.


    Typically, ASP.NET Web applications are created in an IDE called Microsoft Studio.NET.
    This IDE has a WYSIWYG window that complements the programming and allows programmers
    to rapidly drag objects onto pages and set properties, including presentation
    attributes, without writing a line of code. These settings generate HTML.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# NOT THAT WE''RE PICKING ON ASP.NET


    In fact, the contrary. The following examples demonstrate the power and versatility
    of ASP.NET and similar application platforms in the hands of someone who knows
    how to nudge the software to produce Web standards-based code. Many such frameworks
    exist and many offer ways to tweak the front-end output, but it takes extra effort
    to get there and locate the features that help generate high-quality front-end
    code.


    Platform to platform, the concepts are very much the same. The point is, a little
    extra effort, taking the time to understand what is being output other than "does
    it look right superficially," allows users, your business, and everyone to win.
    Application developers get pretty wound up in making their software work and often
    don''t take those last steps. Of course, exceptions exist, but this section isn''t
    targeted at those individuals.


    From a Web standards standpoint, there are several issues that can be of concern
    with Visual Studio.NET, particularly versions earlier than 2005, and ASP.NET''s
    server-generated code:


    +   * ASP.NET examples, which everyone learns from, feature bad code.

    * Visual Studio.NET 2003 and earlier was notorious for (when a programmer entered
    this design mode) rewriting and reformatting the HTML of the page in question,
    if it was created and carefully crafted in another application or plain text editor
    by a UI coder.

    * Form inputs and controls can be ASP.NET "tags," which frequently have attributes
    applied to them. The code output is often not valid XHTML or HTML code, although
    in 2005 this situation improved. These tags output a massive amount of insensitive
    attributes that the author does not make the extra effort to control the output.

    * In versions 2003 and earlier, when an author uses the built-in tools to create
    a page, it creates HTML pages in quirks mode, because the DOCTYPE declaration
    applied to the document does not include a URI.

    * ASP.NET features "adaptive rendering," which means the server makes decisions
    about what type of UI code to send to the Web browser based on server-side settings
    that "guess" the level of support a browser has for certain technologies.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# CHAPTER 4 Developing Web Software Applications 123


    +   - ASP.NET''s server-side code makes great use of ID attributes on the controls
    embedded in the page code. Frequently, depending on the context, these IDs are
    dynamically renamed based on their location in the document, so CSS and JavaScript
    authors may difficulty referencing page objects by their IDs even though that
    is the open, internationally recognized, standards-based way of doing things.
    In some cases a class might be more appropriate, or trying to apply the ID to
    a parent element and referencing the object by context. Ideally, front-end designers
    and backend programmers collaborate on using IDs in the best way to leverage the
    strengths of both front-end and backend code—but this is not always the case.


    It is interesting to note, however, that even these concerns can be mitigated
    with some extra effort, time, and attention to the front-end aspects of the code.


    > TIP\One way to cope with "adaptive rendering" is to set the ClientTarget settings
    to "Uplevel", so ASP.NET will stop using the only browser with any advanced features
    is Internet Explorer and will send advanced code to everyone. However, this can
    open up true with regard to some features, particularly ASP.NET 1.1 JavaScript
    features, which might only be supported by IE because Microsoft browser-specific
    code in some places. Be aware, and carefully test before deploying ASP.NET solutions.
    Further, these features changed slightly in ASP.NET 2.0—another reason to test
    early and often.


    > BIG IMPROVEMENTS IN ASP.NET 2.0

    In ASP.NET 2.0 and Visual Studio.NET 2005, Microsoft have strong commitments to
    make the generated code both more standards-compliant and more accessible. Another
    improvement is that the new version of the IDE rewrites much less code when in
    design view.

    The controls and code generated automatically by Visual Studio.NET and the ASP.NET
    framework are generally Transitional-compliant by the strict nature of the specification.
    However, the programmer must still go to the extra effort of avoiding inline presentation
    attributes and making code more accessible. In some cases there are better controls
    to use others, offering more flexibility in the code being output. The options
    to this improved in ASP.NET 2.0.'
