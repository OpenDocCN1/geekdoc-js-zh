  md: 'All are skills that can be developed, even if you don''t have an innate talent
    for them. When you start thinking of your code as art, something should fundamentally
    change how you do your job. Code is created to get something from one point to
    another. Art creates pleasure. When you get true pleasure from creating artful
    code, you''ve successfully joined the guild of Web craftsmen. The skills learned
    along the way help even the most troublesome projects easier to manage, and all
    you need is to find at least something in one to get excited about.


    Hopefully, you became a developer because you''re passionate about the Web and
    building things (sites, applications, widgets, Web services, or whatever). Sometimes,
    times pass you moves, and that''s OK. But, if you''re passionate, you''re more
    likely to explore and spend your time looking for the most elegant, simplest solution
    to every problem. As you develop your problem-solving skills, you move beyond
    problems just in code, and start thinking about solving problems for the entire
    project, even if it''s not in your discipline or your responsibility. The willingness
    to look outside of your own domain is a good indication that you''ve crossed the
    line from “assembly-line worker” to craftsman.


    A large part of problem-solving is the ability to take previous experience and
    apply it to current problems. Being able to think about past problems and how
    they apply to the current problem is a key skill.people rarely make the same mistake
    twice, and develop the intuition necessary to know which direction to head. Part
    of passing experience is introspection and being honest about assessing well you''ve
    accomplished something. Without that, you won''t be able to apply those lessons
    to future problems, because you won''t understand what you learned from a problem.


    There is a challenge here for managers to give their people opportunities for
    development, and empower them to develop the skills of a craftsman. It helps a
    great deal if encouragement encourages developers to feel ownership over their
    small piece of the project. They may be given a fairly limited task but they in
    their own way. Depending on the experience level of the developer, there may need
    to be more mentoring or validation of code, giving developers freedom to explore
    possibilities and choose the best one for themselves can help them develop that
    sense of ownership. Also, the more developers know about where their tasks fit
    into the big picture, the more likely they are to feel like what they''re doing
    matters and the more likely they are to develop that sense of ownership.'
