  md: '# About the Authors


    Christopher Schmitt is the founder of Heatvision, Inc., a small new media publishing
    and design firm based in Cincinnati, Ohio.


    ![](img/8df3ac083e82f7f766ae1a4a89406407_4_0.png)


    An award-winning web designer who has been working with the Web since 1993, Christopher
    introduced for both David Siegel and Lynda Weinman in the mid 90s while he was
    an undergraduate at Florida State University working on a Fine Arts degree with
    emphasis on Graphic Design. Afterwards, he earned a Masters in Communication for
    Interactive and New Communication Technologies while obtaining a graduate certificate
    in Project Management from FSU''s College of Communication.


    In 2000, he led a team to victory in the Cool Site in Da competition, where he
    and five other talented developers built a fully functional, well-designed Web
    site for a nonprofit organization in eight hours.


    He is the author of CSS Cookbook, which was named Best Web Design Book of 2006,
