  md: '# Appendix C


    # Web Site

    Performance Tips


    When Web teams consider performance, they usually think of server-side issues
    such as server hardware performance, application software performance, and bandwidth
    considerations. The main thing that they associate with performance as it relates
    to client-side considerations is...a few graphics, and that''s about it.


    The truth is, there are a number of client-side performance issues, many of which
    are quite effective in affecting the user-perceived speed of a Web site. The "time
    to display" in the browser and the time for the page to be ready for the user
    to interact with it is possibly the most important aspect of performance from
    a user perspective. User perspective is everything.


    UI codes have to Take into account when creating the UI layer of a site, and they
    are fortunate that they have opted for a Web standards-based approach, because
    it is more efficient than the older methods. Modern pages are lighter weight,
    and there is some evidence they are rendered faster in the browser. Certainly,
    leveraging the browser''s cache for presentation and scripts can be beneficial
    that information does not have to be downloaded every time.


    The usual design rules apply about keeping file sizes to a minimum. But this applies
    to graphics, CSS files, JavaScript, Flash files, and anything else that a Web
    page has to load. However, the actual structure of the page, the way it puts together,
    when it is requesting the files, and the artwork is cut can all have tremendous
    impact on the load time in a Web browser.


    A number of industry experts, including the Yahoo! UI team (www.yuiblog.com) in
    particular, have published research on page-loading and the web browsers make
    requests to the server (see the links at the end of this section for more of the'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# ADAPTING TO WEB STANDARDS


    research). Their and others'' research is of immense value to front-end development
    looking for optimizations. Of particular interest is how Web browsers request
    files, in what order, and what they can and cannot do in parallel.


    Some interesting performance tips from Yahoo! and UI include


    +   - Fewer files mean faster load times, if some of those files are larger than
    smaller sets of smaller-sized files. This is because each HTTP request the browser
    makes and the server responds to is exceptionally time-intensive.


    +   - Combining images and using CSS to position and clip the graphics to show
    parts of them at a time can speed load times, because fewer HTTP requests. These
    images are frequently referred to as "CSS Sprites."


    +   - Consider, as part of a build process when deploying a Web site or in real
    time, merging numerous CSS and JS files into their own single file to reduce HTTP
    requests. Another way to dynamically merge files is to use server-side scripts.


    +   - A browser can load CSS files simultaneously; however, once it hits a <script>
    tag, the browser suspends other load operations and loads each <script> individually.
    Once the scripts are completed, the browser proceeds with loading the page. This
    can seriously skew load.


    +   - To mitigate multiple <script> tag load impacts, considering placing <script>
    tags just before the closing <body> tag to allow the page to load before the scripts.


    +   - Execute-building JavaScript when the document has completed loading, as
    opposed to the whole page loads (also known as window.onload). For more information,
    see the performance experiment section following this, and the sidebar "Execute
    on Page Load, or Event on DOM Document Load" in Chapter 3.


    +   - Spread images or scripts over multiple DNS names so the browser can request
    more files simultaneously. These can be simple DNS NAMES, as the IP address doesn''t
    matter. There is a limit to this benefit, so the research on this technique is
    recommended (see notes below).


    +   - Enable gzip or compression of HTTP served content. Almost all Web servers
    today and browsing clients can serve and accept compressed content; this can have
    a lot of size off the downloaded files.


    +   - Where there are large numbers of scripts required but selectively used,
    authors should consider investigating a technique called "Lazy Loading" or "On-Demand"
    script loading, which allows only basic scripts to be loaded until extra libraries
    are needed, which are then loaded dynamically without a page refresh.'
