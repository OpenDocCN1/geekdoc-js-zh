- img_proc: true
  md: '# Practice Doesn’t Make Perfect


    The concept that practice leads to perfection is flawed. There is no perfect practice—merely
    perfect academic exercises such as school assignments that can be done for instructors
    or proof of concepts created as examples for clients.


    Technology, scope, client relationships and implementations could always be done
    better when viewed in hindsight.


    This doesn’t mean we shouldn’t try for perfection.'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'Only by going through real-world development with clients and attempting—successfully
    or not—launch internal projects (often with punishing deadlines) do we know our
    skills, learn our lessons, and, importantly, become strong enough and flexible
    enough to apply those "the next time." That’s striving for excellence, also known
    as professionalism.


    Learning specific skills and techniques and standards is critical to becoming
    better developers, there are key areas that can be imparted only by working on
    actual Web development projects: communication, adaptation, and persistence.


    # Communication


    The Internet is about communication. The list of technologies that facilitate
    human contact goes on and on: instant messaging, email, VoIP when the-phone gets
    dated. Those meetings colleagues decide are too long and point-less could instead
    be finding consensus, focused on agreeing on the best solutions, if everyone has
    already discussed the problems before they reached the room.


    # Adaptation


    Beginning Web developers test—and sometimes break—the rules for good devel-op
    as they learn what works and what doesn’t. Of course it’s important to pick up
    what’s right and wrong, black and white, but it’s equally important to see the
    grey, ambiguous area and know that the "best" solution isn’t always, well, the
    best.


    For example, sometimes loading a page with the appropriate DOCTYPE-Section 508-compliant
    tags hangs Google too much for it to deliver a fast exper-ience for its users,
    and you have to ditch the DOCTYPE tags. Even the best tech-n and technologies
    can be thrown out of the window as long as you know how that will affect your
    audience. Adaptation is about knowing when to break the rules for the right reasons.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Persistence


    Life happens. Vendors overstate their competencies. Clients change the scope of
    their projects. Web developers get sick or, worse, or go on honeymoons.


    A professional takes on the project or part of the project he or she has been
    given and doesn''t let. Circumstances change, but a true professional makes sure
    a project doesn''t get out of hand, persisting with the help of communication
    and adaptation. It''s not easy—but then, nothing of value ever is.


    # Trials and Tribulations


    The following case studies showcase how developers tackled their projects. They
    used the skills and Web standards to the best of their abilities to create some
    of the most highly profiled sites on the Web. Frankly, their mistakes and failures
    can be shared to allow us to better make the next generation of sites.'
