  md: '# Meet the Designer, Philip Fierlinger


    Philip Fierlinger''s parents ran an animation studio out of the family''s home,
    surrounding him with the whole design and production process. He took interest
    in computers as a child and learned BASIC by playing around with Beagle Brothers,
    the first "open source" code he used. Eventually, he expanded his knowledge to
    databases, and created a contact database for his mom. He studied design in college,
    completing his final semester in an internship with a top-secret startup called
    General Magic in Silicon Valley. Though he received an internship from Sony in
    New Jersey, he couldn''t pass up the opportunity to work with the original Macintosh
    team on a new handheld computer platform.


    How did you get started in Web design?


    In 1994, I started Turntable with my brother, Peter. We believed could create
    interactive designs and development better than any of the companies we knew.
    With no money and nothing to lose, we applied our powerful ideas and passion to
    build a prototype of an online music store. This came at when Mosaic (of the earliest
    Web browsers) didn''t exist; people considered CD-ROMs an expensive and unattainable
    technology; and 14.4 bps methods were state-of-the-art technology, only known
    to uber geeks. The store focused on the ability to browse an online music catalog,
    listen to samples, to watch music videos, and buy music online. This idea was
    also 10 years ahead of its time.


    We pitched our to several major record labels. They were baffled and perplexed.
    They had no idea what to do with us. Although they were impressed, we weren that
    what they said was relevant to their business. I met Rogers, a kid in Indiana
    who did a fan site for the Beastie Boys I told Rogers about an idea for a Beastie
    Boys CD-ROM that connected and integrated with his fan site. It turned out the
    Beastie Boys hired Rogers, who pitched me to the band. Within a few weeks, I went
    to L.A. to do QuickTime VR [experimental technology then still in development
    at Apple] shoot the Beastie Boys'' studio. Those of us involved in this project
    were among the first to use QuickTime VR. We also worked out a deal with Microsoft
    to include Internet Explorer 1.0 on the CD because of the difficulties in dealing
    with Netscape. This tie-in was one of the first browser bundle deals.


    The Beastie Boys project established our company as a leading digital design and
    development company. We had no trouble landing projects from big like Apple, Palm,
    and Macromedia. We continued to take on projects for'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# 192 ADAPTING TO WEB STANDARDS


    underground bands we loved, including Dr. Octagon, the Invisible Scratch, Piklz,
    Money Mark, and Mo''Wax.


    Thanks to our relationship with Macromedia, we developed the first Shock-wave
    audio player soon after Shockwave came out. Later, I started working on Flash
    4, when Flash came with programming capabilities. Unexpectedly, we stayed busy
    during the dot-com days by designing and developing sites for many crazy startups.


    By 2001, I moved to New Zealand with my wife and son, where I went to work for
    the country''s top Web agency, Shift (shift.co.nz). The company gave me the incredible
    opportunity to work with a team of young designers some of the best design work
    in the world. With Shift, I put my Flash to work in building powerful cultural
    Web sites—a stark and refresh from the dot-com and rock-web sites.


    During my time with Shift, I learned about designing for large-scale online publishing,
    giving me the skills to design for scalability and develop flexible templates
    using dynamic grid systems. Obviously, the experience with Shift prepared me for
    the Tori Amos project.


    While I worked on the Tori Amos site, I worked on a redesign for New Zealand.
    The redesigned site won a Webby Award for best tourism site and a nomination for
    best home page design, and another Webby the following year. I moonlighted on
    projects for U.S. clients while working full-time for Shift in New Zealand. I
    worked with U.S. clients, including DreamWorks, Comcast, Warner Brothers, and
    Capitol, and many others from New—the geographical separation didn''t cause any
    issues.


    Not one to stay away from things and innovation, I helped a startup in New Zealand,
    which created an online accounting system. As lead interaction designer, I enjoyed
    the challenge of turning the boring and painful world of accounting into a sexy,
    simple, and fun experience. It was an appreciated chance to focus on a product
    and continuously refine it, rather than switching between projects and clients.


    # How did you take an interest in Web standards?


    I started moving away from designing and building static sites into creating dynamic,
    data-driven sites. In the process, the limitations of visual design in HTML became
    painfully obvious. Building database-driven sites freed up the content into an
    abstract object that you can manipulate independently of the code and the visual
    presentation. If you use HTML for structure'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# CHAPTER 6 EverythingTori.com 193


    style, then you are very limited in what you can do with your content. Any changes
    you want to make editing code across every page and template in your site. Everything
    is hard-coded. Changes are painful and extremely prone to errors. Plus, your design
    options are very restricted.


    Ideally you to write and edit your code in one place and have referenced in many
    places across your entire site. CSS is designed to do exactly that: you can make
    one simple change in one class and it instantly changes your design wherever use
    that class reference within your entire site. That makes buildings very efficient.
    It also gives you a lot of design flexibility and freedom.


    Of course, massive credit is due to Jeffrey Zelman for his crusade to make people
    aware of CSS and Web standards, plus David Shea for putting the CSS Zen Garden,
    making the path to better design and development quite obvious.


    For these reasons, I applied Web to EverythingTori.com.


    # What are the more common issues you run into CSS? How do you deal with them?


    Browser issues and general quirks working with CSS tedious. It''s amazing how
    quickly you can get 90% of your design build in CSS. Finishing that last 10%,
    getting things pixel perfect, can be excruciating. The problems exponential when
    you''re targeting a wider range of browsers, especially older ones. Therefore
    I try to limit the number of target browsers and keep it to the most current.
    Of course, IE is always the biggest nightmare, and there''s no avoiding it.


    Also, it''s very annoying that tables handle layout and grid structures exactly
    how you want, much easier and more predictably using CSS floats, but then they
    don''t play well with CSS and they have their own drawbacks. Being able to use
    the table attributes of CSS would be great, if browsers supported properly. CSS
    still not ideally suited as a complete publishing solution. It was never really
    designed to handle grid layouts with multi-column flow, so the solutions people
    use are all hacks. It would be wonderful if CSS 3 became mainstream, but it seems
    like that, sadly, is far off.


    # Who or what influenced you?


    My biggest influence is wife Hadley (www.shecrafty.com). It''s extremely hard
    to pass the wife test, and it''s a great feeling when it happens. Over the years,
    I''ve collected screenshots of any Web site that catches my eye. I''ve been'
  merge: -1
