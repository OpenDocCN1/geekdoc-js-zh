  md: "+   * Remove browser detection, since there is no reason to have it.\n\n+ \
    \  * Remove proprietary techniques and replace them with DOM standards.\n\n# External\
    \ Files and Dynamic Hooks\n\nA big issue is the inline `script` tags. In some\
    \ cases they may be difficult to avoid, particularly in more complex environments\
    \ where third-party code is being inserted, but where it can be done, such as\
    \ the scripts at the top of the example document above, scripts should be external\
    \ files—for the reasons that CSS files are better kept separate. Benefits include\
    \ cleaner code, increased modularity, sharing and, and when with other unobtrusive\
    \ techniques, to change the code in one location instead of having to plow through\
    \ the content's entire markup. A compelling reason is that it enforces the policy\
    \ of the separation of the documents layers.\n\nA external `script` tag like this:\n\
    \n```\n<script src=\"unobtrusive.js\" type=\"text/javascript\"></script>\n```\n\
    \nHaving moved the code outside of the content, what about all the references\
    \ to that code? To obtain pure separation of content from behavior, all the inline\
    \ event handlers need to go. Additionally, because the `javascript:` pseudo-protocol\
    \ is notstandard, will be removed and replaced with their actual links (they are\
    \ pop-ups); Also, the links that were in the `javascript:` function get pushed\
    \ back down to the HTML for compatibility's sake. Finally, the HTML aspects of\
    \ the page, which are fairly meaningless if the user does not use JavaScript,\
    \ are to be added dynamically.\n\nWith some cleaner, \"POSH\" HTML as the code,\
    \ which would look like this:\n\n```\n<body>\n  <p>What would you like to do now?</</p>\n\
    \  <ul id=\"myUL\">\n    <li><a href=\"http://cherny.com\">Go to this site</a></li>\n\
    \    <li><a href=\"http://google.com\">0r, maybe here instead</a></li>\n  </ul>\n\
    </body>\n```\n\nNotice that all the event handlers removed, the code has achieved\
    \ a separation of behavior from content and structure. So how is the code actually\
    \ executed? In most cases, modern Web developers attach events and behaviors to\
    \ a page on load, not just with a `onload` attribute."
