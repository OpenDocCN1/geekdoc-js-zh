  md: '# 112 ADAPTING TO WEB STANDARDS


    +   - How is markup generated?

    - Does the software reference any current presentation code, such as CSS files?
    If so, which files? Are those files changing in a redesign?

    - How tied to the backend business logic, if at all, the front-end code?

    - Is there any way to abstract the UI code from application code?

    - If the application generates front-end code, is there any way to control how?

    - If users have the ability to generate content or code, is there a way to lock
    what they can do?

    - What is the level of effort involved in UI layer modifications?

    - What is the risk to the application of UI layer modifications?

    - What are the potential hazards or drawbacks of not redesigning the application?

    - What are the limitations of how third-party software may need to be customized?


    Clearly, there is an enormous amount of information to be collected, evaluated,
    and weighed.


    # Can Applications Be Updated?


    In the end, aspects of some software may be beyond help. There may simply be no
    way to bring them up to date with the latest Web standards front-end code, either
    due to architectural issues or unacceptable risk. In these cases, the effort become
    an exercise in compromise. Either there needs to be a long-term plan to resolve
    the issues or both the users and the business will just to suffer through painful
    update processes.


    This is essentially a tradeoff between short-term effort and risk, and long-term
    effort and risk. Some partial solutions could either an an implementation of styles
    (even extracts from specific CSS files) or a superficial re-creation of the look
    and feel for a given application. In the long run, the organization suffers because
    it will become more difficult to apply changes to applications that become special
    cases need to be evaluated every time a change is made. The critical turning point
    varies by organization.


    # Guidelines, Rules, and Web Standards


    An organization''s Web applications can benefit from establishing standards, coding
    guidelines, and interaction points and references for the way the UI code should
