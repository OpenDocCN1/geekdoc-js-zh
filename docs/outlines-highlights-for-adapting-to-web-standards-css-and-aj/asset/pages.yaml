  md: '# 38 ADAPTING TO WEB STANDARDS


    Note that removes from the markup any indication that the element looks like,
    so that when the site is redesigned the classes are still relevant and the markup
    does not need to be updated. These also identify what the objects are, as opposed
    to what they look like. This is especially important on a large-scale site and
    where CSS is used for layout—when changes happen in a redesign, the CSS class
    names are of vital importance to an easy transition, and their meaning should
    not be lost or confused by a poor naming system that contradicts what each object
    actually is.


    # ID Names Are Unique in a Document


    A common mistake made by newcomers to CSS and modern markup is some- like the
    following:


    ```

    <div id="content">This is my content on the right side.</div>

    <div id="main">This is my content.</div>

    <div id="content">This is also my content.</div>

    ```


    That''s invalid code, because it calls the same ID multiple times in the same
    document. It is important to note that IDs are always unique in an HTML or XHTML
    document. This means that there is only one instance of an ID page. An ID can
    exist once and only once in a document, despite what Web browsers might allow.
    The preceding example will have unpredictable results, particularly when scripting
    is attached to the document.


