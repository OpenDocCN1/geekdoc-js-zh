  md: '# Appendix B


    # Accessibility


    The W3C has created a number of best-practice recommendations with regards to
    Web standards-based approaches to accessibility. Traditionally, terms like Section
    508 (government regulations around accessibility) have left many a designer with
    feelings of dread, believing that they will have to seriously hold back their
    designs.


    Happily, with the little effort it takes to follow professional best practices,
    Web designers or developers can get their code to purely accessible than ever.
    A team needs only to make reasoned decisions and produce thoughtful markup, CSS,
    and in particular scripting (which would not be 100% required for a site to work)
    in order to come fairly clear. Accessibility should always be in the back of a
    designer''s mind when creating the UI and when a developer is programming software.
    The main areas of concern—the ones in which it is most challenging to attain accessibility
    successes—are the one-off scenarios,with third parties, potential CMS or other
    software issues, and multimedia.


    In addition to the W3C, governments worldwide are also defining standardsfor levels
    of accessibility. Some of the accessibility guidelines include:


    +   United States Federal Government Section 508, www.section508.gov/


    +   W3C Web Accessibility Initiative (WAI) Web Content Accessibility Guidelines
    1.0 (WCAG), www.w3.org/TR/WAI-WEB-CONTENT/


    +   W3C WCAG 2.0, www.w3.org/TR/WCAG20/


    +   W3C Accessible Internet Applications (WAI-ARIA) Suite, www.w3.org/WAI/intro/aria


    Each set of guidelines defines different levels of accessibility. Typically, an
    organization should decide which of these levels to shoot for and begin plans
    to test and evaluate based on that target as part of its QA process.'
