  md: '# CHAPTER 4 Developing Web Software Applications


    Looking at the new XHTML standards-based approach reveals several fundamental
    enhancements over forms created without a semantic approach:


    +   - There is no longer a meaningless HTML table required for the markup of the
    form.


    +   - The form now features <label> elements that associate the text label with
    the actual form control—a great accessibility and, in general, user-centric feature
    supported by most browsers.


    +   - A tabindex is applied, to facilitate a tabbing order and increased keyboard
    accessibility.


    +   - The form is grouped into a <fieldset> and labeled with a <legend>, which
    groups and expands the form for greater accessibility.


    +   - Because it is a much cleaner piece of code, the form itself, which is bound
    to be tweaked by the application developers, it is much easier to read and modify.


    # Server-Side Frameworks and Template Tools


    Several Web scripting technologies have been around for some time, including PHP
    (PHP: Hypertext Preprocessor), Classic ASP (Active Server Pages), and Adobe (formerly
    Macromedia) ColdFusion, to a few popular ones. These language platforms for server-side
    tasks have models that put front-end alongside backend code in the same files.
    On one lines, authors will see programming logic inside technologies delimiters
    (examples include <...> and the like), and then the following line will have standard
    HTML. Additionally, the server-side code will use print statements to output HTML,
    oftentimes with line information.


    There are also frameworks and coding techniques—such as the ColdFusion Fusebox
    (fusebox.org) framework and the PHP Smarty templating system (http://smarty.php.net)
    that modularize these layers, attempting to pull the logic and front end apart,
    creating templates that include front-end code while the backend is in different
    sets of files. In reality, the results are often mixed, because the bottom line
    is that server-side code still must output UI.


    The question in the end is this: What is the quality of the markup for the UI
    when with it separated from business logic? All the application software tiers
    in the world will if the basic HTML code violates best practices or resides in
    the UI developers cannot control or wade through.'
  merge: -1
  pgno: 125
