    # Pulling Information from a Page with Microformats


    Using the hcard example and an extension-addon for the Mozilla Firefox browser,
    it is possible to demonstrate a simple example of how microformats can be. Michael
    Kapbym has created an extension called Operator, which you can download and install
    from the Mozilla Add-ons sites: https://addons.mozilla.org/en-US/firefox/addon/4106


    Once the extension is installed, users have a new toolbar or a status bar icon
    that becomes active when visiting a Web page with data embedded in a microformat.
    The toolbar allows a multitude of ways to interact with a variety of microformats
    (FIGURE 2.5).


    Since this example is an hcard, the Operator extension allows the user to export
    the embedded contact information to a vCard file, which can be imported into any
    software package that accepts that format, such as Microsoft Outlook. It is an
    incredibly easy and powerful way to add to an address directly from a Web page,
    particularly in a business environment (FIGURE 2.6).


    For a breakdown of CSS selectors, see Appendix D.'
