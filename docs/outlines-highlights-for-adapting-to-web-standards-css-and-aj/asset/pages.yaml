  md: '# A New Approach: UI Architecture Plans


    A traditional plan starts with back-end requirements and then builds on a UI layer
    code as an afterthought. Today, using a modern Web Standards-based approach, teams
    should ask themselves the following:


    +   * Is the UI layer built and structured for easy maintenance?

    * How does the UI layer impact SEO?

    * How does the UI layer interact with the site’s content management system (CMS)?

    * Is it possible to redress or make simple design changes without CMS impact or
    the need for CMS staff?

    * What happens when it comes to modify or enhance the UI?

    * How do you integrate a UI with a Web application?

    * What happens when the application logic changes?

    * How risky is a design change to an application?

    * Should mission-critical applications buckle under the pressure of needlessly
    risky design, simple content, or script changes?


    A well-planned Web standards approach will mitigate these risks at two levels:
    first, the front-end code; and second, where the back end meets the front end.


    Over time, for any site, these questions could become big issues. Larger enterprises
    often have a Web presence in place, and mass change will not be possible or will
    be difficult to achieve overnight. Incremental change may be required. Where the
    line is drawn will be different in almost every case.


    When planning for change, first figure out what needs to be designed, whether
    it’s marketing content or an application, and how it needs to be rendered in the
    browser. Second, make reasoned decisions based on the pros and cons of each option.
    Finally, figure out how to get a site to its standards-compliance goals and how
    to keep it that way.'
  merge: -1
