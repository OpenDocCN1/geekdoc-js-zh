  md: '# Company Policy


    Whatever degree of browser support an organization chooses, it should be an educated
    decision that is regularly evaluated, at the very least once a year. It should
    be documented and integrated in the Web team''s Quality Assurance (QA) process.
    This requires software and hardware configurations being made available to test.
    With not having access to testing software or hardware can mean lost customers,
    opportunities, and revenue—and even, in some cases, open up the potential for
    legal action.


    At the same time, unless you are working in a controlled environment where the
    users’ software can be guessed or controlled (such as a corporate intranet), even
    browsers that are “not supported” should be given something that can be accessed
    or information about what software is supported.'
