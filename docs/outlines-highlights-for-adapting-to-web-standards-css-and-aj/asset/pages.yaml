    # Too Much Class


    Web standards purists coined the term classitis, which means putting many classes
    in a Web site''s markup and CSS. The term is a funny word for a valid concern.
    Having dozens and dozens of classes to remember, document, and reference is difficult
    for Web authors and users alike.


    In the long run, a more practical, graceful and scalable solution is to use descendant
    selectors. These selectors automatically apply styles to XHTML elements without
    having to apply classes to every item.'
