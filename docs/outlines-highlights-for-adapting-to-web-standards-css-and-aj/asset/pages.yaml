    Fewer lies are downloaded and linked. In this case, the effect would not be worth
    it; with large sizes for many properties, separate teams, sections, or micro-sites,
    the benefit can help simplify the code in the actual pages when deployed.


    # Conditional Comments for CSS and Internet Explorer


    Microsoft Internet Explorer (IE) features some proprietary extensions that can
    be helpful when dealing with oddities in its CSS features. In particular, IE''s
    "conditional comments" are useful when linking CSS files for IE. Check out the
    following:


    ```

    <!--[if IE 5.5]>

    <link rel="stylesheet" href="patches/ie5.css" type="text/css" />

    <![endif]-->

    ```


    Basically, this code is ignored by most browsers because the code wrapping the
    <link> element looks like a standard XHTML. However, the expression in the square
    brackets [if IE 5.5] means "less than or to IE 5.5," and IE''s parser knows to
    include this code, but only if the version number of the browser is 5.5 or below.
    This can be useful when dealing with issues such as the different box model measurements
    between IE 5.x and 6.x.


    There is some controversy around code such as conditional comments, because code
    being introduced is meaningless to anything but Internet Explorer. Ideally, we
    should avoid targeting a specific browser whenever possible, even IE, since this
    can lead to problems when new versions come out. Sometimes finding alternative
    ways to code something might eliminate the altogether.


    # Conventions for Files and Selector Case


    Naming rules for CSS files themselves can be just anything, so long as an organization
    can agree to a system and keep it consistent. What matters more is that the usage
    is consistent and makes sense.


    Moving deeper into the CSS files'' content, an important aspect worth mentioning
    is that CSS class names and IDs are case sensitive. Consider the following:


    ```

    <style type="css">

    .myRules { font-size: 1em; }

    </style>

    ```'
