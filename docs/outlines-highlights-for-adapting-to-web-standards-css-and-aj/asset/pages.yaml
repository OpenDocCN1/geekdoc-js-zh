  md: '# 98 ADAPTING TO WEB STANDARDS


    ![](img/8df3ac083e82f7f766ae1a4a89406407_106_0.png)


    # EXECUTE ON PAGE LOAD, OR EVENT ON DOM DOCUMENT LOAD


    When a page has enough content and artwork combined with scripts, a traditional
    onload event handler handles the attaching of all scripts until the full document
    and all its assets, graphics, have all loaded—which can introduce performance
    delays when it may appear to the user that nothing is happening, because the scripts
    have not fired yet.


    A better idea is to attach all the dynamic behavior once the XHTML is loaded,
    the document''s DOM is what is needed, not all the graphics. Some industrious
    developers have figured out ways to attach scripts once the DOM has loaded (just
    the HTML, which is much quicker than loading the full page). Try searching online
    ''domcontentloaded'' or ''dom-loaded'' for more information.


    This can be a major performance win, and is discussed in Appendix C.


    # Custom Scripts vs. Frameworks


    Depending on the experience of the team, resources, and requirements of a Web
    project, many different JavaScript options exist. Sometimes only basic scripts
    are needed and these can be found easily online and extended; however, the team
    should be exceptionally careful with these, because there are mountains of poorly'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# CHAPTER 3 Integrating the Behavior Layer 99


    written JavaScript code online. Additionally, grabbing large volumes of code from
    varied sources can be risky and result in


    +   * Inconsistent quality and browser-compatibility issues


    +   * “Frankenstein”-like sets of functions that use different techniques and
    styles or repeat core functions unnecessarily


    +   * Maintenance problems


    +   * Conflicts in variable and function names


    Based on the requirements of a project, there are also “frameworks” and “libraries”
    of packaged code and modules, which include utility functions and objects that
    can be used to save time. Most are free and supported by communities, such as
    the Prototype framework (www.prototypejs.org) or the jQuery library (http://jquery.com).
    Some, as Dojo (http://dojototoolkit.org), have sponsorships from many big companies,
    however, are still free to use.


    A popular framework can be of value because it''s very likely to have a higher
    level of quality due to the number of users who have contributed and have been
    debugging. However, there are issues to consider:


    +   * Does the framework include code and features you don''t need? Is using a
    framework like using a sledgehammer on a thumbtack?


    +   * Is downloading a large library of code to the browser on every page a worth-while
    expense, performance-wise?


    +   * Is the development path of the framework active and evolving?


    +   * Is there an active community that can help troubleshoot problems?


    +   * Does the framework make any unexpected modifications to the core JavaScript
    objects that may conflict with other code?


    +   * Does the framework adhere to best practices?


    +   * Will the team be to agree or set policy on a framework, and not have some
    members using one framework and others going off on their own? That is a cost
    associated with inconsistency.


    Whatever decision is made, particularly in a diverse organization with a large
    presence, the choice should be weighed carefully and implemented in a controlled
    and consistent manner. The whole issue is essentially a vs. buy (or, in this case,
    use someone else''s) consideration, just like any other software components to
    be included in a project.'
