  md: '# # Appendix D


    # # CSS Selectors Reference


    Obviously, browser support for CSS selectors varies, so testing is critical. What
    follows is an overview of just of the available CSS selectors. These and more
    can be found in the CSS specifications, as described at www.w3.org/TR/REC-CSS2/selector.html.


    # Selectors


    | Type or Element selector | Matches any E element |

    |---|--|

    | p {color:red;}

    <p>This text is red</p> | |


    | Class selector | Matches E with class of warn |

    |---|--|

    | div.warn {color:red;}

    <div class="warn">This is red</</div> | |


    Classes can be used by themselves to apply to any element:


    ```

    .warn {color:red;}

    <div class="warn">This is red</</div>

    <p class="warn">So this is this</p>

    ```


    | ID selector | Matches any E element equal to myid |

    |---|--|

