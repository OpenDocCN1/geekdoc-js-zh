- img_proc: true
  md: '# ADAPTING TO WEB STANDARDS


    E[foo=val] Attribute selector Matches any E element with the foo attribute set
    exactly to “val”


    ```

    a[rel=external] { color: green; }

    <p>

    <a rel=external>this matches, and is green</p>

    <a rel=internal>this is not green</a>

    </p>

    ```


    E[foo~val] Attribute selector Matches any element E an attribute matching foo
    in a space-separated list


    ```

    a[rel~example] { color: green; }

    <p>

    <a rel="copyright example">this is green</p>

    <a rel="copyright">this is not</a>

    </p>

    ```


    E[foo|val] Attribute selector Matches any element E the foo attribute set where
    the first part of a hyphenated value is “val”. This is typically for language
    attribute matching.


    ```

    a[lang|en] {color:green; }

    <p>

    <a lang="en-US">this matches, and is green</a>

    <a lang="fr-FR">this is not green</a>

    </p>

    ```


    +   * Universal selector Matches any element, any rule applied here applies to
    any and all tags, including forms, etc.


    +   * {color: red;}

    Everything will be red. Typically avoided.


    A better use of the universal selector is inside of something; however, the same
    caveats apply:


    ```

    #box {margin: 0;}

    <div id="box">

    <p>Everything in this div will have no margin.</p>

    <ul><li>Everything!</li></ul>

    </div>

    ```'
