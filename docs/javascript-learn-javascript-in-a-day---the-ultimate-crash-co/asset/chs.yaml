  \ name=\"address\" />\n  </p>\n  <p>\n    <label for=\"city\">城市</label><br/>\n\
  \    <input id=\"city\" name=\"city\" />\n  </p>\n  <p>\n    <input type=\"submit\"\
  \ />\n  </p>\n</form>\n```\n\n这目前还非常简单，现在我们需要创建多个用户并将它们存储为数组。首先，让我们创建一个代表一个用户的对象：\n\
