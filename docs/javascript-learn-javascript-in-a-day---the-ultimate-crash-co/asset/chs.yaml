  \ this.list[index];\n  }\n}\n```\n\n## 复杂的日期\n\n到目前为止我们的表单只是获取姓名，但我们有了其他字段。日期字段有点棘手。我们将循环填充天：\n\
  \n```javascript\nday = document.getElementById('dob_day');\nfor(i=1; i<=31; i++){\n\
  \  op = document.createElement('option');\n  op.value = i;\n  op.innerHTML = i;\n\
  \  day.appendChild(op);\n}\n```\n\n接下来，按照循环填充月份：\n\n```javascript\nmonth = document.getElementById('dob_month');\n\
  for(i=0; i<=11; i++){\n  op = document.createElement('option');\n  op.value = i;\n\
  \  op.innerHTML = i;\n  month.appendChild(op);\n}\n```\n\n最后，循环填充年份：\n\n```javascript\n\
  var d = new Date();\nvar current_year = d.getFullYear();\nyear = document.getElementById('dob_year');\n\
  for(i=current_year; i>=(current_year - 100); i--){\n  op = document.createElement('option');\n\
  \  op.value = i;\n  op.innerHTML = i;\n  year.appendChild(op);\n}\n```\n\n运行良好，对于年份我们想要列出当前年份之前的\
  \ 100 年。我们将使用 `Date` 对象。\n\n太棒了，现在你填充了所需的字段，让我们重写一下 `user` 对象，以便有几个设置属性的方法：\n\n\
  ```javascript\nfunction user(name) {\n  this.name = name;\n  this.dob = '';\n  this.address\
  \ = '';\n  this.city = '';\n  this.getName = function(){\n    return this.name;\n\
  \  }\n  this.getCity = function(){\n    return this.city;\n  }\n  this.getAddress\
  \ = function(){\n    return this.address;\n  }\n  this.getDob = function(){\n  \
  \  return this.dob;\n  }\n  this.setName = function(name){\n    this.name = name;\n\
  \  }\n  this.setCity = function(city){\n    this.city = city;\n  }\n  this.setAddress\
  \ = function(address){\n    this.address = address;\n  }\n  this.setDob = function(day,\
  \ month, year){\n    this.dob = new Date(day, month, year);\n  }\n  this.getHTML\
  \ = function(){\n    var node = document.createElement('p');\n    node.setAttribute('style',\
  \ 'padding:5px; border:1px solid #ccc;');\n    var span = document.createElement('span');\n\
  \    span.innerHTML = 'Name : ' + this.getName() + '<br/>';\n    span.innerHTML\
  \ += 'Date of Birth : ' + this.getDob().toString() + '<br/>';\n    span.innerHTML\
  \ += 'Address : ' + this.getAddress() + '<br/>';\n    span.innerHTML += 'City :\
  \ ' + this.getCity();\n    node.appendChild(span);\n    return node;\n  }\n}\n```\n\
  \n上面是 `user` 声明的重写，现在我们有一组 getter 和 setter 方法。它看起来像很多代码，但仔细看，它只是每个属性对应的一个 getter\
  \ 和 setter 方法。注意 `setDob` 方法创建了一个日期对象并将其赋值给 `dob` 属性。\n\n```javascript\nvar frm\
  \ = document.getElementById('theForm');\nvar theList = new list();\nvar ul = document.getElementById('ourList');\n\
  \nfrm.onsubmit = function(){\n  var usr = new user(document.getElementById('name').value);\n\
  \  // ... (从选项获取值的逻辑)\n  theList.add(usr, ul);\n  return false;\n}\n```\n\n## 验证并再次验证\n\
  \n你刚刚构建了一个非常有实用的应用程序。但它很容易出错，我们需要确保输入的信息是有效的。首先，我们需要确保姓名、城市和地址字段不是空的。我们可以把所有的验证逻辑放在表单的处理器函数中，但这违背了面向对象编程的思想。难道不应该\
  \ `user` 对象来告诉我们提供它的信息是否有效吗？现在想起来很有道理，让我们在 `user` 声明中添加一个简单的函数，检查上述三个字段是否都不为空。它返回一个布尔值，表示创建的用户对象是否有效。如果对象是有效的，我们就将其添加到列表中；如果不是，我们将弹出错误消息。\n\
  \n在你的 `user` 对象中添加以下：\n\n```javascript\nthis.isValid = function(){\n  var errors\
  \ = [];\n  if(this.name.trim() == ''){\n    errors.push('Name is required');\n \
  \ }\n  if(this.city.trim() == ''){\n    errors.push('City is required');\n  }\n\
  \  if(this.address.trim() == ''){\n    errors.push('Address is required');\n  }\n\
  \  if(errors.length > 0){\n    alert(errors.join(','));\n    return false;\n  }else{\n\
  \    return true;\n  }\n}\n```\n\n这是一个简单的函数，检查列出的属性是否为空。无效的元素将导致布尔值 false 和一个糟糕的警告消息。对你的表单处理器进行以下调整：\n\
  \n```javascript\nfrm.onsubmit = function(){\n  var usr = new user(document.getElementById('name').value);\n\
  \  ul = document.getElementById('ourList');\n  // ... (设置其他字段)\n  if(usr.isValid()){\n\
  \    theList.add(usr, ul);\n  }\n  return false;\n}\n```\n\n## 移除用户\n\n我们有一个可以添加和显示用户的完全功能表单。然而，我们需要移除现有用户的能力。考虑为每个添加的元素添加一个显示“移除”的链接。点击此链接将从列表中删除元素。这意味着我们需要创建一个元素并附加一个\
  \ `onclick` 处理器，以便从列表中删除元素。让我们重做一下 `getHTML` 函数：\n\n```javascript\nthis.getHTML\
  \ = function(elem, index){\n  var node = document.createElement('p');\n  node.setAttribute('style',\
  \ 'padding:5px; border:1px solid #ccc;');\n  var span = document.createElement('span');\n\
  \  span.innerHTML = 'Name : ' + this.getName() + '<br/>';\n  span.innerHTML += 'Date\
  \ of Birth : ' + this.getDob().toString() + '<br/>';\n  span.innerHTML += 'Address\
  \ : ' + this.getAddress() + '<br/>';\n  span.innerHTML += 'City : ' + this.getCity();\n\
  \  node.appendChild(span);\n  var rm = document.createElement('a');\n  rm.innerHTML\
  \ = '(remove)';\n  rm.setAttribute('href', '#');\n  rm.onclick = function(){\n \
  \   node.parentNode.removeChild(node);\n    this.remove(index);\n  };\n  node.appendChild(rm);\n\
  \  return node;\n}\n```\n\n等等，提供的文本有点碎片化了。让我们根据描述的逻辑重建最后的版本：\n\n```javascript\n\
  function list(){\n  this.list = [];\n  this.html = '';\n  this.add = function(elem,\
  \ ul){\n    this.list.push(elem);\n    ul.appendChild(this.getHTML(elem, this.list.length-1));\n\
  \  }\n  this.buildHTML = function(elem){\n  }\n  this.getHTML = function(elem, index){\n\
  \    var usr = elem.getHTML();\n    var li = document.createElement('li');\n   \
  \ li.appendChild(usr);\n    var rm = document.createElement('a');\n    rm.innerHTML\
  \ = '(remove)';\n    rm.setAttribute('href', '#');\n    rm.onclick = function(){\n\
  \      li.parentNode.removeChild(li);\n      this.remove(index);\n    };\n    li.appendChild(rm);\n\
  \    return li;\n  }\n  this.remove = function(index){\n    this.list.splice(index,\
  \ 1);\n  }\n  this.get = function(index){\n    return this.list[index];\n  }\n}\n\
  ```\n\n## 总结\n\n*   我们学会了 `navigator` 对象用于返回浏览器特定信息。\n*   我们理解了 `geolocation` 如何工作以及如何显示当前用户的坐标。\n\
  *   我们还理解了 `location` 对象以及如何跳转用户以及如何解析浏览器中的 URL。\n*   我们接触了 cookies 并理解了它们如何工作，以及如何设置、检索和销毁。\n\
  \n## 作业\n\n### 练习 1\n创建一个使用 `prompt` 询问用户姓名的脚本。脚本应该设置 cookie 并存储它。当用户返回同一页面时，脚本必须检查\
  \ cookie 是否存在，如果存在，输出友好的 `Hello` 并称呼用户。\n\n### 练习 2\n在上面的脚本中创建一个点击时会删除 cookie 的链接。\n\
  \n### 练习 3\n创建一个脚本获取用户的位置并将其存储在 cookie 中。编写代码，当用户再次访问页面时，不允许泄露其位置，让脚本检查 cookie 中的位置并输出。同时，当用户允许脚本访问其位置时覆盖\
  \ cookie。\n\n"
