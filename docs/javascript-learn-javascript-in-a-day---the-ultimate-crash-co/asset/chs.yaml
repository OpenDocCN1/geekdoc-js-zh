  \ DOM 提供的不同函数，我们将利用它们。\n\n（实际上，输入文本是循环的。我将提供请求内容的干净版本。）\n\n我们将在本章剩余部分中使用这个 HTML\
  \ 页面，并进行小的变化。为了理解 DOM 提供的不同函数，我们将利用它们。\n\n（自纠：提示要求重新格式化给定的文本。我将格式化文本，即使它重复。）\n\n\
  HTML DOM 或文档对象模型（Document Object Model）是一种 W3 标准，用于定义和访问网页内容，即 `document`。HTML DOM\
  \ 是标准约定接口，将所有元素定义为对象，并定义了每个元素的固有属性以及每个元素可用的方法和事件。\n\n网页中的每个元素（包括网页本身）都被称为 `node`（节点）。这些节点以树形结构排列，以\
  \ `document` 节点为根节点，其他节点随其后，例如：\n\n```html\n<html>\n  <head></head>\n  <body></body>\n\
  </html>\n```\n\n`document` 节点中的第一个节点是 `html` 节点，它分别分支为 `head` 元素节点和 `body` 元素节点，以此此类推。\n\
  \n当网页被渲染时，会创建一个该页面的文档对象模型，每一个元素都加载为树上的一个节点。这是理解 DOM 的非常重要的一种，以便能够对其进行交互和操作，而我们可以通过\
  \ DOM 提供的许多方法来实现。\n\n\n\n正如 `document` 对象拥有方法和属性一样，所有的节点也拥有自己的属性。我们已经检查了上述示例中元素的\
  \ `innerHTML` 属性。\n\n注意——`getElementById` 只返回单个元素，而不是数组。如果你在页面上有多个相同 ID 的元素，那将很糟糕！\n\
  \n## 重复一切\n\n另一个有趣的是，正如 `document` 对象拥有方法和属性，页面上的元素也是如此。由于所有元素都继承自 `Node` 对象，它们在同一时间共享许多方法和属性。\n\
  \n例如，一个 `a` 元素会有 `href` 属性，而 `p` 元素则不会。同样，有些元素显示为 `block`，而有些默认是 `inline` 的。这在学习\
  \ HTML 和 CSS 时，了解这些可用方法和属性会更好。\n\n让我们向页面中添加以下 HTML：\n\n```html\n<div id=\"parent1\"\
  \ class=\"one\">\n  <p class=\"pink\"></p>\n  <p class=\"pink\" name=\"para\"></p>\n\
  \  <div id=\"red\"></div>\n<p class=\"pink\"></p>\n```\n\n在上面的 HTML 中，你有一些 `p` 元素，我们可以通过\
  \ `div` 元素来获取带有类 `one` 的 `div` 元素。嵌套元素是父元素的子元素。使用下方的 `document` 函数：\n\n```javascript\n\
  var pink_els = document.getElementsByClassName('pink');\n```\n\n顺便，我们也可以通过父元素检索它们：\n\
  \n```javascript\nvar p = document.getElementById('parent1');\np.getElementsByClassName('pink');\n\
  ```\n\n上面的示例返回一个元素数组，但如果你在控制台中输出它，你会发现之前的示例返回了三个元素，而这个示例只返回了两个。这是因为这些检索元素是在调用它们时工作的。`document`\
  \ 对象包含了每一个 HTML 元素，因此 `getElementsByClassName` 或 `getElementsByTagName` 在与单个元素配合使用时，会搜索所有的子节点或元素。\n\
  \n你可以像在循环中使用一样使用这个元素数组：\n\n```javascript\nvar p = document.getElementById('parent1');\n\
  var a = p.getElementsByClassName('pink');\n\nfor(var i = 0; i< a.length; i++){\n\
  \  console.log(a[i]); // 一次输出一个元素\n  a[i].innerHTML = i; // 用相应的索引替换 `pink` 类元素的内容\n\
  }\n```\n\n## 让我们操作\n\n现在你已经知道了 DOM 实际上是如何工作的，以及如何从 `document` 或元素内部检索单个或一组元素，让我们继续学习允许我们进行一些操作的方法和属性。\n\
  \n在在此之前，让我们为我们的 HTML 添加一些 CSS。你可以通过创建一个外部 CSS 文件、在 `link` 标签中链接它，或者在文档的 style 标签块中添加。让我们在这里制作几个样式：\n\
  \n```css\n.pink{ color:DeepPink; }\n.red{ color:Red; }\n.blue{ color:Blue; }\n.one{\
  \ padding:10px; }\n```\n\n我们将从更改一些基本属性开始。最初我们使用 `innerHTML` 属性完全更改被选中节点的 HTML。所有元素都有一个\
  \ `getAttribute` 方法，返回传递给它的属性。因此，如果我有一个元素，可以使用它来查找它的单个属性：\n\n```javascript\nvar\
  \ el = document.getElementById('parent1');\nel.getAttribute('class'); // 返回 one\n\
  ```\n\n还不错，但如果我们不知道元素是什么，并且需要检查一个不存在的属性怎么办？例如只有链接有 `href` 属性。我们有另一个恰当命名为 `hasAttribute`\
  \ 的方法允许我们检查元素是否具有某个属性：\n\n```javascript\nvar el = document.getElementById('parent1');\n\
  el.hasAttribute('href'); // 返回 false\n```\n\n话虽说完，让我们结合这两个函数在这里进行一些操作。让我们在这里更改 `parent1`\
  \ 元素的类，为此请向 `setAttribute` 问好：\n\n```javascript\nvar el = document.getElementById('parent1');\n\
  if(el.hasAttribute('class')){\n  el.setAttribute('class', 'blue');\n}\n```\n\n哇，那确实改变了颜色。但等等——我们似乎丢失了原始类的内边距（padding）。这是因为我们覆盖了属性。如果我们只想追加类名，就会在做出更改之前使用\
  \ `getAttribute` 函数来检索现有的类。\n\n```javascript\nvar el = document.getElementById('parent1');\n\
  if(el.hasAttribute('class')){\n  cls = el.getAttribute('class'); // 现在 cls 是 one\n\
  \  el.setAttribute('class', 'blue ' + cls);\n}\n```\n\n我们将类设置为包含 `blue` 和 `one`\
  \ 类的追加字符串。这是一个非常多功能的函数集，允许我们对任何元素执行任何操作。\n\n## 遍历 遍历 / 添加和删除！\n\n我们可以选择元素，现在可以操作它们——我们基本上获得了对页面的控制权。然而，到为止我们一直在相对于类名、ID\
  \ 和标签名进行操作。经常你需要根据元素相对于页面与其他元素的位置来访问元素。例如，你无法为页面上的每个元素都设置 ID，这在页面复杂且充满了大量 HTML 时是非常不实际的。如果你想选择并更改特定\
  \ ID 元素相邻元素的颜色，或者你想更改无序列表中第 n 个列表项的类名呢？通过循环可以做的事情有限，遍历页面上的每一个元素是非常不实际的，并且会减慢并崩溃你的页面。\n\
  \n\n\n我们本应该得到一个包含三个元素的数组，但等一下，在这里我们得到了一个比这更多的数组？你可能会纳闷是怎么回事。`childNodes` 属性返回所有的\
  \ `childNodes`，甚至会将空白文本和空格视为节点 - 所以缩进的空格也会被视为独立的节点。你可以重写不带空格的 HTML，但那样的话读起来会变得非常糟糕。\n\
  \n```html\n<ul name=\"list\"><li>Element 1</li><li>Element2</li><li>Element 3</li></ul>\n\
  ```\n\n这是合法的 HTML，但对于我们这些原始人类来说并不易读。坦率，我们还有另一个属性的功能完全相同，但它非常完美地忽略了空元素和空格。让我们听听 `children`\
  \ 元素吧。\n\n```javascript\nvar el = document.getElementsByName('list')[0];\nvar ch\
  \ = el.children;\nconsole.log(ch); // 以数组形式获取所有子元素\n```\n\n这太棒了，但我们仍然想访问第二个元素。我们可以通过引用元素数组的第二个索引来实现。\n\
  \n```javascript\nvar el = document.getElementsByName('list')[0];\nvar ch = el.children;\n\
  ch[1];\n```\n\n然而，有一种更简单的方法可以做到，我们在这里使用 `firstChild` 属性。它返回第一个子元素。\n\n```javascript\n\
  var ch = document.getElementsByName('list')[0].firstChild;\nconsole.log(ch); //\
  \ ????\n```\n\n等一下，第一个子元素竟然是一个空字符串？因为和 `childNodes` 属性一样，这个属性也将空格视为独立的元素。从技术上讲，清除所有空格可以使页面加载更快。所以在一个不带空格的\
  \ HTML 上运行相同的代码，你应该就能得到第一个元素。\n\n或者，我们在这里可以使用 `firstElementChild` 属性，因为它方便地忽略了空格和注释。所以保留你易于阅读的\
  \ HTML 代码，并使用以下 JavaScript：\n\n```javascript\nvar ch = document.getElementsByName('list')[0].firstElementChild;\n\
  console.log(ch); // ????\n```\n\n但等等，我们如何获取第二个元素呢？在这种情况下，我们想要获取在当前选中的 `firstChild`\
  \ 之后的元素。请注意，同一层级的所有元素被称为兄弟元素（siblings），包含其他元素的元素被称为包含元素的父元素，而被包含的元素被称为父元素的子元素（child\
  \ elements）。JavaScript 提供了两个有趣的函数，可以在兄弟元素之间移动，就像我们使用 `firstChild` 属性移动到子元素一样。\n\n\
  ```javascript\n// 注意：在无空格的 HTML 中使用\nvar ch = document.getElementsByName('list')[0].firstChild;\n\
  ch2 = ch.nextSibling\nch == ch2.previousSibling\n\n// 注意：在普通 HTML 中使用\nvar ch =\
  \ document.getElementsByName('list')[0].firstElementChild;\nch2 = ch.nextElementSibling\n\
  ch == ch2.previousElementSibling\n```\n\n这两个函数及其变体 `previousSibling`、`nextSibling`\
  \ 通过访问同一层级上的相邻元素在 DOM 中进行移动。我们首先获取了第一个元素，然后遍历并移动到与第一个元素相邻的第二个元素。\n\n让我们把这些事情推得进一步\
  \ - 如果我们想删除第二个元素怎么办？或者在这里再添加另一个元素。我们可以用 JavaScript 实现这一点。\n\n```javascript\n// 注意：在无空格的\
  \ HTML 中使用\nvar list = document.getElementsByName('list')[0];\nvar ch = list.firstChild;\n\
  list.removeChild(ch); // 我们移除了第一个子元素\n```\n\n`removeChild` 方法接收要从父元素中移除的实际节点。是由父元素执行移除操作。同样，我们可以类似地使用\
  \ `appendChild` 和 `insertBefore` 函数来添加子元素。\n\n在插入元素之前，你需要先创建它或使用现有的元素。让我们创建一个新的列表元素并将其添加到我们的列表中。\n\
  \n```javascript\n// 注意：在无空格的 HTML 中使用\nvar list = document.getElementsByName('list')[0];\n\
  var li = document.createElement(\"li\");\nli.innerHTML = 'This was added';\nlist.appendChild(li);\n\
  list.lastChild; // 返回 li\n```\n\ndocument 模型的 `createElement` 函数根据传递的标签创建元素。一旦你创建了元素，你就会获得所有元素都拥有的属性和方法。在上面，我们设置了新新创建的列表项的\
  \ `innerHTML` 属性，并使用列表元素的 `appendChild` 方法将其添加到列表中。该方法由所有元素拥有。`appendChild` 方法将传递的元素作为父元素的最后一个子元素，正如我们在\
  \ `lastChild` 属性看到的那样。你也可以使用 `insertBefore` 方法将元素插入到你喜欢的任何地方。它接收要插入的节点以及它应该被添加之前的节点。因此，你可以在文档的任何位置添加节点。\n\
  \n```javascript\n// 注意：在无空格的 HTML 中使用\nvar list = document.getElementsByName('list')[0];\n\
  var li = document.createElement(\"li\");\nli.innerHTML = 'This was added';\nlist.insertBefore(li,\
  \ list.lastChild); // 添加在最后一个子元素之前\nlist.insertBefore(li, list.firstChild); // 添加在第一个子元素之前\n\
  ```\n\n就像 `firstChild`、`nextSibling`、`previousSibling`、`lastChild` 一样，它们也有相应的包含文本节点的版本，以及忽略文本作为节点的版本，分别为\
  \ `nextElementSibling`、`previousElementSibling` 和 `lastElementChild`。\n\n使用这些方法和属性，你可以真正地操纵\
  \ DOM 并大肆破坏（开玩笑的，千万别真的这样做）。这让你了解到在使用 JavaScript 语言时拥有多大的威力。\n\n## 总结\n\n- DOM 模型是\
  \ HTML 元素的规范。\n- DOM 将所有 HTML 元素建模为具有父节点和子节点的树。\n- 对象可以通过 ID、标签、名称和类名等属性获取。\n- 元素可以通过相应的方法进行遍历。\n\
  - 父元素包含子元素，而兄弟元素是同一层级的元素\n\n# 第 11 章：事件 - 发生了什么？\n\n操纵 DOM、遍历和玩 HTML 页面看起来很有趣。但如果终端用户无法进行大量交互，那就毫无乐趣。到目前为止，我们尝试的示例都是通过代码完成的，没有任何来自外部世界（即用户）的输入。这在很大程度上违背了使用\
  \ JavaScript 的目的。\n\n## 概述\n\n在本章中，我们将查看 JavaScript 事件模型、事件是什么以及我们如何编写它们的代码。我们将理解事件处理器的概念以及\
  \ DOM 提供的各种事件。\n\n\n\n事件发生在元素上，并由用户以无数种方式执行。\n\n在继续进行之前，我们需要查看 JavaScript 中拥有的各种不同事件以及它们是如何分组的。\n\
  \n### 事件 - 不要到处乱点鼠标！\n\nHTML 中最基本的交互形式是 `a` 标签。它是指向不同页面或资源的简单链接。然而，所有的 DOM 元素都能响应几乎类型的事件。预期的事件大多数肯定通过鼠标或光标。因此，所有与\
  \ DOM 元素相关的事件都是基于用户的鼠标操作。\n\n让我们在 HTML 内部创建一个简单的事件处理程序示例：\n\n```html\n<a href=\"\
  http://www.yahoo.com\" onclick=\"return false;\">Click</a>\n```\n\n将该内容放入你的 HTML\
  \ 文件中并尝试点击链接。出于某种原因，它不起作用。如果你查看代码，你会发现我们给元素添加了 `onclick` 属性。`onclick` 实际上对应于用户的点击动作，而该属性的内容是纯\
  \ JavaScript。这段代码仅仅返回布尔值 `false`。向点击处理程序返回 `false` 基本上意味着什么都不做。这正是我们所做的。让我们稍微修改一下：\n\
  \n```html\n<a href=\"http://www.yahoo.com\" onclick=\"return confirm('Are you sure?');\"\
  >Click</a>\n```\n\n运行它并现在点击，你会得到一个确认框，如果你回答肯定，它会重定向，因为你传递了一个 `true` 值；如果你选择否定，它就不会重定向，因为你传递了\
  \ `false`。这是在事件处理程序中编写代码的一种简单方法。但如果我们我们需要对多个链接执行此操作呢？\n\n```html\n<a href=\"http://www.yahoo.com\"\
  \ onclick=\"return confirm('Are you sure?');\">Click</a>\n<a href=\"http://www.google.com\"\
  \ onclick=\"return confirm('Are you sure?');\">Click</a>\n<a href=\"http://www.bing.com\"\
  \ onclick=\"return confirm('Are you sure?');\">Click</a>\n```\n\n这非常单调。我们可以做的是将\
  \ JavaScript 放入一个函数并调用该函数。\n\n```javascript\nfunction doConfirm(){\n  return confirm('Are\
  \ you sure?');\n}\n```\n\n```html\n<a href=\"http://www.yahoo.com\" onclick=\"doConfirm()\"\
  >Click</a>\n<a href=\"http://www.google.com\" onclick=\"doConfirm()\">Click</a>\n\
  <a href=\"http://www.bing.com\" onclick=\"doConfirm()\">Click</a>\n```\n\n好多了，但我们仍然需要对每个函数进行调用——让我们在\
  \ JavaScript 中处理处理事件的所有代码。\n\n```javascript\nvar a = document.getElementsByTagName('a');\n\
  \nfor(var i = 0; i< a.length; i++){\n  a[i].onclick = function(){\n    return confirm('Are\
  \ you sure?');\n  }\n}\n```\n\n```html\n<a href=\"http://www.yahoo.com\">Click</a>\n\
  <a href=\"http://www.google.com\">Click</a>\n<a href=\"http://www.bing.com\">Click</a>\n\
  ```\n\n显然要好得多，正如你看到的，我们选择了所有的 `a` 元素并为单独的 `onclick` 事件分配了一个函数。HTML 是整洁的，我们没有任何 JavaScript\
  \ 和 HTML 的混杂。\n\n**注意：** 保持你的 HTML 和 JavaScript 分离\n\n这是一个使用 `onclick` 事件的示例。还要理解，不仅仅是\
  \ `a` 链接标签响应 `onclick` 事件。你拥有的任何元素都可以响应 `onclick` 事件。让我们用段落尝试一下，并使用一些 CSS 给段落一个背景颜色，以便我们知道在点击什么。\n\
  \n```html\n<p id=\"clickable\" style=\"background-color:yellow\">\n  You can click\
  \ on me\n</p>\n```\n\n```javascript\ndocument.getElementById('clickable').onclick\
  \ = function(){\n  return alert('Hi!');\n}\n```\n\n只需点击段落，哇，你就得到了一个弹窗警告。这很好且有趣，然而请考虑以下具有相同\
  \ HTML 的 JavaScript 示例：\n\n```javascript\ndocument.getElementById('clickable').onclick\
  \ = function(){\n  this.style.backgroundColor = 'red';\n}\n```\n\n点击段落，你会看到颜色发生了变化。发生了什么？是如何实现的？在上面的\
  \ JavaScript 中，我们引入了 `this` 关键字。我们在处理类时使用它来声明类属性和方法，它指的是对象本身。在这种情况下，它是对 `clickable`\
  \ 段落对象的引用，并引用了它的样式。事件处理程序只是在点击时更改了对象的背景颜色。你已经可以看到 JavaScript 事件的可能性了。\n\n让我们看看另一个事件，即\
  \ `dblclick` 事件。它捕获鼠标的双击。让我们修改上面的 JavaScript，以便在点击时背景颜色变为红色，在双击时颜色变为黄色。\n\n```javascript\n\
  var el = document.getElementById('clickable');\n\nel.onclick = function(){\n  this.style.backgroundColor\
  \ = 'red';\n}\n\nel.ondblclick = function(){\n  this.style.backgroundColor = 'yellow';\n\
  }\n```\n\n你现在可以疯狂点击并看到颜色变化。正如我们有点击和双击事件一样，我们还有许多其他鼠标事件可以使用，例如：\n\n| 事件 | 描述 |\n\
  | --- | --- |\n| `onmousedown` | 当你按下鼠标键时 |\n| `onmouseenter` | 当鼠标指针进入元素时 |\n|\
  \ `onmouseleave` | 当鼠标指针离开元素时 |\n| `onmousemove` | 当鼠标指针在元素上移动时 |\n| `onmouseup`\
  \ | 当你释放鼠标键时 |\n| `onmouseout` | 当鼠标移出元素时 |\n\n```html\n<div id=\"counter\">0</div>\n\
  <div id=\"moveover\" style=\"background-color:yellow\">\n  MOVE OVER\n  <p style=\"\
  background-color:black\">A paragraph</p>\n</div>\n<div id=\"moveenter\" style=\"\
  background-color:yellow\">\n  MOVE ENTER\n  <p style=\"background-color:black\"\
  >A paragraph</p>\n</div>\n```\n\n```javascript\nvar el = document.getElementById('moveover');\n\
  var a = 0;\nvar b = 0;\nvar counter = document.getElementById('counter');\n\nel.onmouseover\
  \ = function(){\n  counter.innerHTML = a+1;\n}\n\nvar el1 = document.getElementById('moveenter');\n\
  \nel1.onmouseenter = function(){\n  counter.innerHTML+=a+1;\n}\n```\n\n在上面的示例中，你会注意到，如果你移动到\
  \ MOVE ENTER div，它只在你移动时增加一次计数器；然而，如果你进入 MOVE OVER div，每次移动过元素时都会增加计数器。这是这两个事件之间的细微差别，你需要小心处理正确的事件以避免错误。\n\
  \n与这些相似的是 `onmouseleave` 和 `onmouseout` 事件，`onmouseleave` 在鼠标离开元素本身时触发，而 `onmouseout`\
  \ 事件在鼠标移出元素或子元素时触发。我们可以重写上面的 JavaScript 来演示这一点：\n\n```javascript\nvar el = document.getElementById('moveover');\n\
  var a = 0;\nvar b = 0;\nvar counter = document.getElementById('counter');\n\nel.onmouseover\
  \ = function(){\n  counter.innerHTML = a+1;\n}\n\nel.onmouseleave = function(){\n\
  \  counter.innerHTML = a-1;\n}\n\nvar el1 = document.getElementById('moveenter');\n\
  \nel1.onmouseenter = function(){\n  counter.innerHTML+=a+1;\n}\n\nel1.onmouseout\
  \ = function(){\n  counter.innerHTML = a-1;\n}\n```\n\n运行代码你可以看到，如果你离开 MOVE OVER\
  \ div，它只在你移动时减少一次计数器；然而，如果你移出 MOVE ENTER div，它会减少你进入该 div 及其子元素段落的次数。\n\n### 每个按键都会触发！\n\
  \n不仅仅是鼠标的事件被捕获，键盘也是一样。你在键盘上按的任何键都可以注册特定的事件处理程序。与键盘相关的三个事件分别是是：\n\n1.  `onkeydown`\n\
  2.  `onkeypress`\n3.  `onkeyup`\n\n\n\n每当你按下键盘上的任意键时，这三个事件就会发生，且发生的顺序与上述完全相同。当你按下按键时，首先触发的是\
  \ `keydown` 事件；按键按下后，会触发 `keypress` 事件；当你松开按键时，会触发 `keyup` 事件。\n\n按照惯例，请使用 `keydown`\
  \ 事件，因为它在所有浏览器中对所有键都有效。\n\n显然，为了方便使用，键盘的功能不像鼠标事件那样可以与任何元素交互，因为除了表单元素外，你无法仅通过键盘进行页面操作。因此，我们将通过一个示例表单元素来实现。请分别设置以下\
  \ HTML 和 JavaScript。\n\n```html\n<input id=\"foo\" />\n<div id=\"counter\"></</div>\n\
  ```\n\n```javascript\nvar el = document.getElementById('foo');\n\nel.onkeydown =\
  \ function(){\n  counter = document.getElementById('counter');\n  counter.innerHTML\
  \ = this.value.length\n}\n```\n\n运行这段代码，你会得到一个文本框。在其中输入内容，你应该看到计数器随着你的输入增加或减少。所有表单元素都有一个名为\
  \ `value` 的属性，它返回输入到元素中的值。每当你按下按键时，事件就会触发并调用处理程序，进而将计数器填充为文本框中输入内容的字符串长度。\n\n如果你需要对输入的按键进行特定处理怎么办？假设你只想在按下空格键时才触发计数器，必须有一种方法来追踪按下的是哪个键。幸运的是，在\
  \ JavaScript 中使用事件处理器，这只需向你的处理程序传递一个参数即可。到目前为止，我们还没有显式地传递任何参数，但对于每个事件处理器，所有事件都会传递一个事件对象。让我们为传递给事件处理器的第一个参数声明变量。\n\
  \n```javascript\nvar el = document.getElementById('foo');\n\nel.onkeydown = function(e){\n\
  \  counter = document.getElementById('counter');\n  if(e.keyCode==32){\n    counter.innerHTML\
  \ = this.value.length\n  }\n}\n```\n\n运行该代码并输入，我们发现只有当按下空格键时，事件处理器才会采取行动。上面的代码似乎有很多操作。我们使用变量\
  \ `e` 来引用自动传递给事件处理器的事件对象。这个事件对象包含了刚刚发生的事件的信息，而事件的属性之一就是 `keyCode` 属性。它包含了被按下按键的键码值。这些是代表键盘上每个键的\
  \ Unicode 值。你可以使用简单的 JavaScript 写一个简单的脚本来查看每个键的 Unicode 值。让我们修改上面的示例：\n\n```javascript\n\
  var el = document.getElementById('foo');\n\nel.onkeydown = function(e){\n  counter\
  \ = document.getElementById('counter');\n  counter.innerHTML = e.keyCode;\n}\n```\n\
  \n现在在输入框中输入，会显示你点击的每个按键的代码。这太棒了，但如果我们想知道该代码代表哪个键该呢？幸运的是，`String` 对象带有一个名为 `String.fromCharCode`\
  \ 的方法，它可以将 Unicode 值转换为对应的键。让我们再次修改上面的示例：\n\n```javascript\nvar el = document.getElementById('foo');\n\
  \nel.onkeydown = function(e){\n  counter = document.getElementById('counter');\n\
  \  code = e.keyCode;\n  counter.innerHTML = String.fromCharCode(code);\n}\n```\n\
  \n尽管尝试一下吧——计数器现在显示了你一定按下的键。你可能会发现，它对于基础字母数字运行良好，但对于其他键（如回车键、退出键和某些特殊字符）则无效。\n\n\
  这是因为 Unicode 规范并不是仅仅为了键盘设计的。如果你想对比已输入的字符，最好的办法是在代码中使用原始字符编码。\n\n## 如果表单符合要求\n\n\
  在 JavaScript 中，你最沉浸于事件处理的常见领域之一可能是在表单上。我们在书的开头提到过，没有使用客户端脚本来检查表单验证是一个陷阱。在这里，我们来看一下表单元素特有的的事件，以及如何使用它们来创建引人入胜的事件处理器。\n\
  \n表单是用户与网站之间交互最基本、最重要的形式之一。它是从用户处接收数据并在服务器使用的主要方法。\n\n我们将首先熟悉表单的四个基本事件，即 `onblur`、`onfocus`、`onchange`\
  \ 和 `onsubmit`。\n\n`onfocus` 事件实际上在你聚焦某个表单元素时触发。聚焦意味着你选择了该元素，或者你的键盘/鼠标“聚焦”在该元素上。`onblur`\
  \ 事件在焦点转移时触发，例如如果你使用 Tab 键从一个元素移动到另一个元素，当你“离开”元素时，该元素的 `onblur` 事件会被触发，而你“落到”的下一个元素的\
  \ `onfocus` 事件也会触发。\n\n让我们在这里创建一个简单的表单来操作：\n\n```html\n<form id=\"theForm\" method=\"\
  post\">\n  <p>\n    <label>Name</label><br/>\n    <input type=\"text\" id=\"name\"\
  \ name=\"name\" />\n  </p>\n  <p>\n    <label>Age</label><br/>\n    <input type=\"\
  text\" id=\"age\" name=\"age\" />\n  </p>\n  <p>\n    <label>Gender</label><br/>\n\
  \    <select id=\"gender\" name=\"gender\">\n      <option>Please choose</option>\n\
  \      <option value=\"male\">Male</option>\n      <option value=\"female\">Female</option>\n\
  \    </select>\n  </p>\n  <p>\n    <label>About</label><br/>\n    <textarea id=\"\
  about\" name=\"about\"></textarea>\n  </p>\n  <p>\n    <input type=\"submit\" value=\"\
  Save\"/>\n  </p>\n</form>\n```\n\n```css\n.error{\n  border:1px solid red;\n}\n\
  .busy{\n  border:1px solid green;\n}\n```\n\n表单接收了一些基础信息。我们需要为此表单添加一些验证。让我们从确保用户不留空姓名字段开始。这可以通过许多方式实现，但为了演示\
  \ `onblur` 字段，当焦点离开姓名字段时如果为空，姓名字段将获得红色边框。\n\n```javascript\nvar el = document.getElementById('name');\n\
  \nel.onblur = function(){\n  if(this.value == ''){\n    this.className = 'error';\n\
  \  }else{\n    this.className = '';\n  }\n}\n```\n\n在浏览器中运行该代码，只需聚焦姓名字段，不输入任何内容就点击其他地方或使用\
  \ Tab 键切换焦点。你会发现文本框现在应用了边框。这是给用户的一个错误的视觉提示。回到文本框并输入一个值，然后离开字段，你会发现边框消失了。这本身就很棒。上面的代码非常简单，每当焦点离开\
  \ `name` 字段元素时它就会运行。\n\n让我们稍微整理一下，你会看到当你离开字段且其为空时，字段周围会应用红色边框。当你切回时，边框仍然在那里，除非你输入文本并再次离开。让我们添加另一个事件处理器，以便当你聚焦姓名字段时，它移除任何多余的边框。\n\
  \n```javascript\nvar el = document.getElementById('name');\n\nel.onblur = function(){\n\
  \  if(this.value == ''){\n    this.className = 'error';\n  }else{\n    this.className\
  \ = '';\n  }\n}\n\nel.onfocus = function(){\n  this.className = '';\n}\n```\n\n\
  运行代码，你可以看到细微的差异。在离开空字段后重新聚焦姓名字段，error 类会被移除。这演示了 `onfocus` 和 `onblur` 是如何工作的。\n\n\
  `onchange` 事件主要用于 select 元素，并在元素值更改时触发。它也可以用于其他表单元素，但用于 select 元素时最有效。让我们在性别字段发生变化时弹出一个烦人的弹窗并输出一条愚蠢的消息。\n\
  \n注意 - 请避免使用过多的弹窗，否则你的用户会讨厌你的。\n\n在上方代码添加以下 JavaScript：\n\n\n\n\n\n```javascript\n\
  var gender = document.getElementById('gender');\n\ngender.onchange = function(){\n\
  \  alert('You are '+this.value);\n}\n```\n运行这段代码并尝试更改选择框中的值，你将看到一个傻傻的弹出窗口，告诉你输出了什么。`onchange`\
  \ 事件仅在元素的值发生改变时才会触发。\n\n现在我们已经理解了这些是如何工作的，关于表单，我们还有一个尚未涵盖的主要的事件。那就是 `onsubmit` 事件。表单像所有元素一样也是一个节点，同样，它们有自己特定的方法和属性，以及各自的事件。当表单被提交时，`onsubmit`\
  \ 事件会被触发。通常情况下，你会在这里添加一个事件处理器，用来检查表单提交的详细信息是否有效。使用上面的代码，你确实给用户提供了视觉提示，但表单仍然会提交。让我们对表单进行一些处理，确保在至少输入了名称的情况下表单不会提交。为此，我们将处理\
  \ `onsubmit` 处理程序。\n\n```javascript\nvar frm = document.getElementById('theForm');\n\
  \nfrm.onsubmit = function(){\n  if(document.getElementById('name').value == ''){\n\
  \    alert('The form is not valid, name cannot be empty!');\n  }\n}\n```\n在不输入名称的情况下运行这段代码，搞定！你在弹出窗口中收到了一条错误消息。但等一下，你点击弹出窗口上的确定，表单仍然提交了——你可能在想这是为什么呢？那是因为为了停止默认操作，你需要在事件处理器中返回一个布尔值\
  \ `false`。这确保了表单不会被提交。因此请进行以下调整：\n\n```javascript\nvar frm = document.getElementById('theForm');\n\
  \nfrm.onsubmit = function(){\n  if(document.getElementById('name').value == ''){\n\
  \    alert('The form is not valid, name cannot be empty!');\n    return false;\n\
  \  }else{\n    return true;\n  }\n}\n```\n现在你就可以正常使用了，如果名称字段为空，表单就不会提交。注意，上面示例中的\
  \ `else` 语句并不是真的需要的，没有它也可以同样正常工作。\n\n## 总结\n\n- 我们学习了 JavaScript 事件是如何工作的。\n- 事件可以被捕获，代码可以分配到所谓的事件处理程序中。\n\
  - 事件处理器默认会接收一个事件对象，该对象代表发生的事件并包含有关该事件的数据。\n- 键盘事件在事件 `Object` 中注册了相应的 keycode 值，每个\
  \ keycode 都是所按按键的 Unicode 值表示。\n- 表单有它们自己的一套事件。\n- `OnBlur` 和 `OnFocus` 分别指的是失去/获得焦点的事件。\n\
  - 表单的 `onsubmit` 事件允许我们在提交表单之前运行代码，例如：验证代码。\n\n## 作业\n\n### 练习 1\n在上面的表单示例中，为年龄字段编写一组\
  \ `onblur` 和 `onfocus` 事件处理器，检查输入的年龄是否为正整数。\n\n### 练习 2\n重构上面的函数，将它们全部放在一个专门用于验证的\
  \ `Object`（对象）中以便复用。使用该对象来验证 `on blur`/`onfocus` 处理程序以及在 `onsubmit` 处理程序中使用。这样你就不需要在提交处理程序中重复你在其他单个字段事件处理器中所编写的相同代码了。\n\
  \n# 第 12 章：超越 HTML - 访问浏览器？\n\n到目前为止，我们已经理解了关于节点的许多核心概念。我们已经了详细的示例，解释了所有节点都是具有自己的方法和属性的对象。我们还理解了\
  \ DOM 结构，即构建网页的基础的树形结构。每个节点都会分支出进一步的节点，类似于 HTML 标签嵌套其他 HTML 标签，以此此类推。除此之外，我们还理解文档模型虽然位于页面的根部，但也由\
  \ `window` `Object`（对象）包含，即在本例中为浏览器。浏览器本身也可以像 DOM 一样被引用，让我们对用户体验拥有前所未有的控制，这种控制超越了页面上的\
  \ HTML。\n\n## 概述\n\n我们将学习 BOM，即浏览器对象模型（Browser Object Model），重点将放在 `window` 对象以及其方法的实际影响上。我们将学习如何重定向用户，并理解如何设置\
  \ cookie 来存储用户特定信息以便以后访问。此外，我们将介绍几个示例，说明 `window` 对象的许多不同方法和功能。\n\n## Window 对象\
  \ - 是的，你的浏览器在我们的控制之下！\n\nBOM，浏览器对象模型基本上就像是浏览器版本的 DOM。然而，与由万维网联盟（W3C）定义的 DOM 不同，不同的浏览器在定义“BOM”时会有一些差异。因此，到目前为止还没有标准的\
  \ BOM。然而，我们将涵盖通过 `window` `Object` 可用的所有常用方法，这允许我们访问、控制、操纵并在技术上对浏览器进行“勒索”（删掉关于勒索浏览器的那部分）。\n\
  \n`Window` 对象像所有其他对象一样作为一个节点运行，尽管它在这里实际上是真正的根，但它包含了代表页面的 `document`。由于我们非常清楚文档模型能提供什么，让我们来看看浏览器通过\
  \ `Window` `object` 为我们提供的基本方法。\n\n首先，文档本身就是 `window` `Object` 的一个属性。如果我们看这段代码：\n\
  \n```javascript\ndocument.write('Hello there!'); // 这是一样的\nwindow.document.write('Hello\
  \ there!'); // 这\n```\n我们可以看到 `window.document` 和 `document` 是一样的。由于 `document`\
  \ 是全局变量，可以假设所有的全局变量都可以通过 `window` 访问。\n\n```javascript\ng = 10; // 这是全局声明的\nwindow.g\
  \ == g; // g 可以从 window 访问\n```\n很显然，`window` 可以访问全局作用域内的变量和函数。这允许我们完全根据代码来控制浏览器。\n\
  \n## 我可以获取窗口尺寸吗？\n\n`window` 对象可以用于获取浏览器的实际像素大小。\n\n`window.innerHeight;` // 返回窗口的高度\n\
  `window.innerWidth;` // 返回窗口的宽度\n\n正如我们提到的，由于 BOM 没有标准，早期版本的 Internet Explorer 有它们自己的不同方法来实现相同的结果。尝试这个小练习，写下以下代码：\n\
  \n```javascript\ndocument.write('Height is ' + window.innerHeight + 'px<br/>');\n\
  document.write('Width is ' + window.innerWidth + 'px<br/>');\n```\n运行代码，它应该返回一组值，现在调整你的浏览器并刷新，你应该看到对应于浏览器屏幕新大小的不同数值值。这对于可能需要根据浏览器屏幕的大小隐藏或显示某些元素的情况特别有用。早期的网站使用\
  \ JavaScript 调整移动屏幕的内容，但这种做法随着 HTML5 和 CSS3 的出现而被取代。\n\n## 使用 JavaScript 打开/引用浏览器窗口\n\
  \n这可能是 `window` 对象最烦人但也常用的用途之一。你可能在很多网站上看到打开弹出窗口的功能。这是通过 `window` 对象的 `window.open`\
  \ 方法实现的。\n\n虽然弹出窗口不受欢迎，大多数用户倾向于阻止弹出窗口，但在某些情况下你可能需要弹出窗口。银行直到今天仍使用基于 JavaScript 的弹出窗口来显示在线虚拟键盘，你不需要使用键盘输入，而是点击屏幕上的虚拟键盘来输入凭据。此外，窗口使用\
  \ JavaScript 打开，也可以在之后的代码中被引用。\n\n\n\n\n让我们在这里做一个简单的例子。输入以下 HTML 和 JavaScript 代码。按照良好的习惯，我们将像一直以来所样，将\
  \ JavaScript 和 HTML 保持分离。\n\n```html\n<a href=\"#\" id=\"open-window\">Open a Window</a><br/>\n\
  <a href=\"#\" id=\"close-window\">Close the Window</a>\n```\n\n我们将把“打开窗口”的链接设置为在弹出窗口中打开\
  \ yahoo 网站。\n\n```javascript\nvar op = document.getElementById('open-window');\n\
  \nop.onclick = function(){\n  window.open('http://www.yahoo.com');\n}\n```\n\n运行代码并点击“打开窗口”链接。它应该会在弹窗中打开\
  \ yahoo 站点。这些是非常基础的内容，你可能会奇怪，如果通过链接中添加一个简单的 `target` 属性就能实现这个功能，为什么要大费周呢？`window.open`\
  \ 方法接受多个参数，允许你实际操作打开的窗口。`window.open` 方法接受以下参数：\n\n```\nwindow.open(url, name, option,\
  \ replace);\n```\n\n让我们来看这些参数，`url` 被理解为要在窗口中打开的 URL。然而，如果传递了 `name` 属性，它指向以下值之一：\n\
  \n- `'_blank'`：如果传递此值，URL 将在一个新窗口中加载，这是默认操作\n- `'_parent'`：如果你以前接触过框架（frames），你就会理解这里的父框架指的是包含当前页面的所有框架；在我们的示例中没有框架，所以这实际上并不适用。\n\
  - `'_self'`：这意味着将 URL 加载到当前页面，在这种情况下它不是弹出窗口。URL 将在当前窗口中加载\n- `any name`：这是一个我们可以在稍后的任何代码中使用它来引用该窗口的名称\n\
  \n让我们在这里再添加另一个链接，它将在打开的同一个窗口中打开 google 页面。\n\n```html\n<a href=\"#\" id=\"open-window\"\
  >Open a Window</a><br/>\n<a href=\"#\" id=\"open-google\">Open Google</a><br/>\n\
  <a href=\"#\" id=\"close-window\">Close the Window</a>\n```\n\n### 让我们对 JavaScript\
  \ 进行一些修改\n\n\n\n\n\n```JavaScript\nvar op = document.getElementById('open-window');\n\
  \nop.onclick = function(){\n  window.open('http://www.yahoo.com', 'basic');\n}\n\
  \nvar op = document.getElementById('open-google');\n\nop.onclick = function(){\n\
  \  window.open('http://www.google.com', 'basic');\n}\n```\n\n运行这段代码并点击第一个链接，它会像以前一样打开一个窗口，现在点击“打开谷歌”的链接。惊讶的是，我们并没有得到另一个窗口，而是谷歌网站在原来的原始窗口中打开了。如果你查看上面的代码，你会发现我们在打开窗口时为它分配了一个名称\
  \ `''basic'`。你可以将其设置为你想要的任何名称，但通过这种方式，我们现在可以在代码中引用同一个窗口对象。这允许我们从另一个页面操作窗口对象，前提是这些对象是由同一个页面的代码创建的。\n\
  \n另一种，`window.open()` 方法也会返回一个窗口对象，我们可以像使用另一个对象一样使用它，并将其赋值给变量。让我们修改一下上面的代码，稍微改变链接的名称。\n\
  \n```javascript\nvar op = document.getElementById('open-window');\n\nop.onclick\
  \ = function(){\n  wn = window.open('', 'basic');\n}\n\nvar opg = document.getElementById('open-google');\n\
  \nopg.onclick = function(){\n  wn.open('http://www.google.com', 'basic');\n}\n```\n\
  \n在上面的代码中，我们让第一个链接打开了一个空白窗口，并将返回的窗口对象赋值给变量 `wn`。然后我们使用该对象的 `open` 属性在同一个窗口中打开了谷歌站点。有了对新创建窗口的引用，我们可以做的不仅仅是在它中打开一个网站，让我们在页面上添加另一个链接和一些\
  \ JavaScript：\n\n```html\n<a href=\"#\" id=\"open-window\">打开一个窗口</a><br/>\n<a href=\"\
  #\" id=\"open-google\">打开谷歌</a><br/>\n<a href=\"#\" id=\"write-stuff\">写入内容</a><br/>\n\
  <a href=\"#\" id=\"close-window\">关闭窗口</a>\n```\n\n```javascript\nvar op = document.getElementById('open-window');\n\
  \nop.onclick = function(){\n  wn = window.open('', 'basic');\n}\n\nvar opw = document.getElementById('write-stuff');\n\
  \nopw.onclick = function(){\n  wn.document.write('Hello there', 'basic');\n}\n\n\
  var opg = document.getElementById('open-google');\n\nopg.onclick = function(){\n\
  \  wn.open('http://www.google.com', 'basic');\n}\n```\n\n运行代码，打开空白窗口，然后点击“写入”链接，惊讶的是，你可以从原始窗口中的代码在新创建的窗口中写入文本。\n\
  \n注意，这个示例还说明了 `document` 对象是 `window` 对象的一个节点。\n\n关闭已打开的窗口同样简单。只需调用 `window.close()`\
  \ 即可。\n\n```javascript\nvar opc = document.getElementById('close-window');\n\nopg.onclick\
  \ = function(){\n  wn.close();\n}\n```\n\n添加上面的代码，关闭按钮链接将关闭新创建的窗口。`window.open()`\
  \ 函数还提供了多种修改已打开窗口的方法。你可以设置它的 own、显示和隐藏浏览器的工具栏和按钮等。对于这些修改，我们将查看传递给 `window.open()`\
  \ 函数的第三个参数。该参数接收一个由逗号分隔的设置字符串，定义了对新打开窗口所需的修改。\n\n以下是列出不同设置的示例列表：\n\n`window.open('',\
  \ '', 'height=300');` // 空白窗口以 300 像素的高度打开\n`window.open('', '', 'left=100');` //\
  \ 空白窗口在屏幕左侧 100 像素处打开\n`window.open('', '', 'location=no');` // 隐藏地址栏，设置为 yes 显示\
  \ - 并非所有浏览器支持\n`window.open('', '', 'menubar=no');` // 隐藏菜单栏，设置为 yes 显示 - 并非所有浏览器支持\n\
  `window.open('', '', 'resizable=no');` // 允许/禁止窗口调整大小 - 并非所有浏览器支持\n`window.open('',\
  \ '', 'scrollbars=no');` // 隐藏滚动条，设置为 yes 显示 - 并非所有浏览器支持\n`window.open('', '', 'status=no');`\
  \ // 隐藏状态栏，设置为 yes 显示\n`window.open('', '', 'width=300');` // 空白窗口以 300 像素的宽度打开\n\
  `window.open('', '', 'width=300, height:400, left=150, location=no');` // 空白窗口以\
  \ 300 像素宽、400 像素高、左侧 150 像素且无地址栏打开\n\n如你所见，使用 `window.open()` 函数，你可以做的不仅仅是在不同的窗口中打开\
  \ URL，甚至可以自定义窗口的性质甚至位置。\n\n**注意：** 尽管这些都很酷且有趣，但在现实设置中，弹出窗口是不受欢迎的，应该只谨慎使用。\n\n##\
  \ 浏览器特定函数 - 让我们来导航\n\n所有现代浏览器都提供了另一个对象，即 `navigator` 对象。这是一个基础对象，技术上直接指代浏览器。虽然 `window`\
  \ 对象指的是打开的浏览器窗口的实际实例，而 `navigator` 对象则指代浏览器本身。`window` 对象和 `navigator` 对象配合使用，为用户创建一个丰富的交互体验。\n\
  \n这里是 `navigator` 对象的一个基本示例：\n\n`navigator.language` // 返回浏览器的语言\n`document.write('This\
  \ speaks ' + navigator.language);`\n\n假设你的浏览器设置了 `English`，你应该得到类似 `This speaks\
  \ en`。此外，`navigator` 对象还允许你获取有关浏览器的信息，例如浏览器类型 `userAgent` 以及运行的操作系统：\n\n`document.write('User\
  \ agent is ' + navigator.userAgent);`\n`document.write('<br/>This browser is ' +\
  \ navigator.appName);`\n\n运行上面的代码，你应该看到两行独特的信息——类似于 `user agent is Mozilla/5.0 (Ubuntu;\
  \ Linux x86_64; rv:34.0) Netscape`。这是 `.userAgent` 和 `.appName` 的值。\n\n## 你在哪里！Geolocation\n\
  \n这可能是 `navigator` 对象常用且有趣的用途之一。`geolocation` 属性提供了返回用户实际位置的功能。这实际上需要用户先给予许可。这些信息可以用于填充地图或存储。让我们在这里尝试一个简单的例子：\n\
  \n```javascript\nfunction writePos(position){\n  document.write(\"Latitude: \" +\
  \ position.coords.latitude + '<br/>');\n  document.write(\"Longitude: \" + position.coords.longitude);\n\
  }\nnavigator.geolocation.getCurrentPosition(writePos);\n```\n\n运行上面的代码，浏览器应该询问你是否想共享位置。允许后，你应该会在\
  \ `writePos` 函数中看到写入的内容。现在这里是 `navigator.geolocation` 属性，它提供了一个 `getCurrentPosition`\
  \ 函数，该函数接收一个 `position` 对象作为参数，该对象包含一组属性，其中我们使用了 `coords`。利用这些信息，你可以定制应用程序来获取特定的细节。让我们使用\
  \ Maps API 在地图上显示位置——这真的非常快速。\n\n```javascript\nfunction writePos(position){\n \
  \ var map_url = \"http://maps.googleapis.com/maps/staticmap?center=\"+position.coords.latitude\
  \ + \",\" + position.coords.longitude+\"&zoom=12&size=550x400&sensor=false\";\n\
  \  document.write(\"Latitude: \" + position.coords.latitude + '<br/>');\n  document.write(\"\
  Longitude: \" + position.coords.longitude);\n  document.write('<br/><img src=\"\
  ' + map_url + '\" />');\n}\nnavigator.geolocation.getCurrentPosition(writePos);\n\
  ```\n\n你应该看到一个显示你位置的地图，至少足够让你感到惊讶！\n\n## 随意跳转用户\n\n`window` 对象提供的另一个常用属性是 `location`。这不是\
  \ geolocation，只是指代浏览器中的 web url。`location` 对象本身提供了一系列可以设置或检索的属性。我们将回顾其中几个：\n\n//\
  \ 假设我们处于 `http://www.somesite.com/page/1?v=12`\n\n`window.location.hostname;` //\
  \ 返回主机名 - 根据上面的示例 `www.somesite.com`\n`window.location.href` // 返回或设置整个 url\n`window.location.pathname;`\
  \ // 返回或设置路径，如上面的 `/page/1`\n`window.location.search;` // 返回或设置查询字符串，例如 `?v=12`\n\
  \nlocation 对象允许你解析并访问/修改浏览器中 url 的许多部分。让我们用 `href` 属性做一个简单的例子，它是最常用于从网页跳转用户的。\n\n\
  编写以下代码：\n\n```html\n<a href=\"#\" id=\"link-to-yahoo\">前往 Yahoo</a>\n```\n\n```javascript\n\
  var a = document.getElementById('link-to-yahoo');\n\na.onclick = function(){\n \
  \ window.location.href = 'http://www.yahoo.com';\n}\n```\n\n运行代码并点击链接，你会发现现在可以跳转到雅虎了。想一种情况，例如你想跳转到用户输入的地址，或者跳转到一个实时构建的链接。此外，有时你可能想根据用户的输入跳转，例如跳转到错误页面，或者假设用户不允许你跳转到你网站上的错误页面。\n\
  \n## 回到过去 - 或历史\n\n浏览器的另一个有用功能是返回历史的能力。当然，你始终可以使用浏览器上的后退按钮。但这违背了让你的网页用户友好的初衷。有时你可能需要用户最后所在页面的引用，或者你可能想检查用户从哪里来。我们将利用\
  \ `window.history` 对象。让我们创建一个发送我们回到历史中页面的链接：\n\n```html\n<a href=\"#\" id=\"link-to-back\"\
  >返回</a>\n```\n\n```javascript\nvar a = document.getElementById('link-to-back');\n\
  \na.onclick = function(){\n  window.history.back();\n}\n```\n\n打开几个页面，然后导航到这段代码。运行它并点击链接，你会发现自己被送回到了之前的页面。或者，`history`\
  \ 对象还提供了一个 `forward()` 方法，可以让你前进一页。有时你可能想在你的网页上有一个返回链接。\n\n## 你想要 cookie 吗？\n\n\
  我们不是在讨论牛奶和奶油，cookie 是网站在浏览器上创建的文件，它持有数据。每当你使用网站时，你都在向服务器发送请求，它会返回 html。网站没有方法可以实际识别你。Cookies\
  \ 通过存储关于用户的信息来帮助识别用户。例如，如果不使用 cookies，你每次访问网站都必须输入你的名字。然而，当名字存储在 cookie 时，它会识别你并知道你的名字。Cookies\
  \ 以值对的形式存储，例如：`'name=Bob; Age=32;'`。Cookies 还可以附带日期，这允许浏览器在日期之前清理旧 cookies。默认情况下，浏览器关闭时\
  \ cookies 会被删除。使用 `document.cookie` 创建 cookie 是简单的：\n\n```javascript\ndocument.cookie\
  \ = 'name=Bob; Age=32; expires=Thu, 1 Feb 2015 12:00:00 UTC';\n```\n\ncookie 也可以被更改，只需要更改传递的属性：\n\
  \n```javascript\ndocument.cookie = 'name=Jimmy; Age=16; expires=Fri, 2 Feb 2015\
  \ 12:00:00 UTC';\n```\n\n删除 cookies 是简单的，只需传递过期日期即可：\n\n```javascript\ndocument.cookie\
  \ = 'name=; expires=Thu, 01 Jan 1970 00:00:00 UTC';\n```\n\n要访问 cookie，你可以使用 `document.cookie`\
  \ 属性来检索所有存储的 cookies。注意，检索 cookie 会返回上面的字符串，你需要使用一些字符串操作来从 cookie 中检索单个值。注意，如果你在网站使用\
  \ cookies，让用户知道你的网站使用了 cookies 是重要的。\n\n# 第十三章：JS 实战 - 表单验证\n\n自本章开始以来我们已经走了很远了，现在是时候将我们的技能投入实际应用了。我们将尝试将学到的所有内容实现在完整的基础表单中，这将展示我们在本书过程中学到的所有内容。这个应用程序旨在作为一个起点，让你对在真实情况下如何编程有一个概念。\n\
  \n## 概述\n\n我们将构建一个基础前端应用程序，接收用户信息并将其存储在对象数组中。我们将制定存储对象和数组的方案。通过此应用程序，我们还将允许用户添加和删除元素。为此我们还将使用验证技术来测试并确保输入使用\
  \ JavaScript 验证。错误将显示在表单上。\n\n## 我们的基础表单\n\n我们将制作一个简单的表单，接收关于用户的基本输入，如姓名、出生日期、地址和电子邮件。我们想要确保用户正确输入所有内容。对于出生日期，我们将使用\
  \ `select` 输入而不是让用户在文本框中手动输入日期，以便使用。让我们创建目前为止的表单：\n\n```html\n<form id=\"theForm\"\
  >\n  <p>\n    <label for=\"name\">全名</label><br/>\n    <input id=\"name\" name=\"\
  name\" />\n  </p>\n  <p>\n    <label for=\"dob\">出生日期</label><br/>\n    <select\
