- fmt: '

    This book won''t make you a JavaScript ninja overnight, not even if you read through
    the book ten times over and complete all the exercises in it, and we don''t even
    aim to do so. The boundaries of programming which define the gurus and ninjas
    from newbies are redefined on a daily basis. This book will definitely avail you
    of the core concepts required to use JavaScript after which learning advanced
    concepts would become second nature. You will learn the best practices for coding
    in JavaScript as well as core programming concepts that are mandatory to becoming
    a better coder.


    Once through the book you would have an indepth understanding of how to program
    in JavaScript as well as have completed a series of exercises that would walk
    you from basic introductory concepts to a full fledged real world situation. At
    the end of the book, you''ll work on a practical application making use of all
    the skills you''ve learnt during the course of the book.


    # What is JavaScript?


    Let’s start from the top, what exactly is JavaScript to begin with. JavaScript
    is a client-side scripting language. In the domain of web development you have
    client side languages and server side languages. Server side languages are languages
    that are used to code pages that are parsed and executed on the server and include
    languages such as `Php`, `ASP`, `ASP.NET` and `Ruby` to name a few.


    Client sided languages are executed or run in the browser - hence the name client.
    The ''client'' in this case the browser makes a request to the server which in
    turn ''serves'' the HTML which is displayed to you. Every time you enter a web
    url in the url box of your browser, you''re sending a request to a server which
    in turns send back a mesh of HTML which is displayed to you in your browser. Your
    browser parses the HTML and displays it to you.


    # What can JavaScript do?


    As stated JavaScript is coded to run in the client side, so it runs in your browser.
    It is because of JavaScript that web pages do not have to be static any more.
    JavaScript enables web pages to show a lot more interaction than merely clicking
    on a link to open a new page. And this is something you''ve obviously noticed
    in almost every website you''ve visited. Like for example:


    * Those annoying pop ups that ask you for your phone number and email

    * The time on pages which seems to tick in sync with your clock

    * Those form fields lighting up in red when you enter something wrong

    * Those awesome fade in and slide through animations

    * Those websites which apparently seems to remember your preferences from a recent
    visit

    * Those lists that seem to update on their own without refreshing the page when
    you click the submit button


    All that and more is on account of JavaScript. One more key aspect of client side
    scripting with JavaScript is also to reduce the number or volume of requests that
    would be made to a server. For example consider the following situation:


    You need to take in visitors name, email and message into a guestbook form on
    a website. To make sure that users enter the correct details you''ve coded into
    your server side script - lets assume its `php` - a basic validation module that
    checks to make sure every guestbook entry submitted is correctly filled out i.e.
    emails are a valid email and the name is a real name. If someone enters a wrong
    entry your server has to run the validation and then send back the same page with
    an error message asking him to enter it again. If along with the server sided
    code, you also code using JavaScript on the page itself a similar validation script
    that checks the entries BEFORE the form is submitted - you not only reduce the
    number of `HTTP` requests made to the server but you also save the end user from
    having to wait until after a form is filled and submitted to find out he''s made
    a mistake.


    This was a very simple example - think how mad you would make an end user if the
    form was exceptionally large and he was on a slow connection.


    # Why should I learn JavaScript?


    To put it bluntly, JavaScript is perhaps the first programming language any developer
    must learn. To put it even more bluntly its integral for anyone who''s even partially
    serious about being in web development to know JavaScript before even considering
    any other scripting language be it client side scripting or back end server sided
    scripting. Here is a few reasons why:


    ### Easy to Learn & work with


    Seriously, JavaScript is dead simple to learn and is a pleasure to work with.
    You don''t need a lot to get started with JavaScript and as you code you can instantaneously
    see the results of your work. This is totally unlike coding using server sided
    scripts such as `Php` & `ASP` where you definitely need a server to execute your
    script on. With JavaScript all you need is a browser and you''re ready to go.


    # JavaScript can do anything that HTML can''t


    JavaScript give you the power and flexibility to allow the end user to manipulate
    the content on your webpage. With JavaScript you can validate content entered
    in a form, allow the end user to change content on the page and even interact
    with elements on the page itself. You can also set code to be executed on different
    events such as what happens if someone clicks a button or hovers over a picture
    or moves away from the page or even tries to close the page. In short you have
    a lot of control over how and what the user can interact with giving a whole new
    dimension to your web pages.


    ### User Experience Depends on it


    Getting back to our example with the huge form, imagine a user on a really slow
    connection, who’s really depressed. He finds this counsellor''s website where
    he has to enter a message as well as a valid phone number. The poor guy types
    out all his life woes, on how his girlfriend left him for his best friend, how
    he defaulted on his car payments, the foreclosure notice he''s received as well
    as the leaky faucet that''s given him sleepless nights - but in all that he forgets
    to enter a valid phone number and submits the form hoping for a reply. And for
    some reason some one forgot to add server sided validation so there is now no
    way to get back to him. Your user sits back waits a few days wondering why no
    one has called and ultimately drinks himself half dead assured that no one gives
    a toss for him in the world.


    Ok that was pretty melodramatic but you can see where this is coming from. Websites
    shouldn''t be cumbersome and there isn''t much interaction possible with static
    HTML.


    ### High Demand


    JavaScript is high in demand and almost every web developer is expected to know
    a certain degree of JavaScript. Web development to be well acquainted with all
    the tools and technologies that you would ultimately be required to work with.
    You only have to take a look at Job requirements on Job Boards to see the openings
    available for people who know JavaScript or are acquainted with one of the many
    JavaScript libraries that are out there - like `jQuery` and `BackboneJS` (More
    about these bad boys later in the book)


    ### You''ll need it anyway


    If you''re going to be coding websites and web applications, you will ultimately
    need to code front end and that is we you just cannot do without JavaScript. As
    mentioned earlier knowing JavaScript is mandatory for being an effective web developer.
    You can run away from it, avoid it as much as you can but ultimately you will
    definitely have to stop running and accept the fact that you cannot do without
    JavaScript.


    ## How long have people been using JavaScript?


    JavaScript has been around for quite a while now. It was originally developed
    by Brendan Eich at Netscape in the early 90s for the Netscape Communicator Browser.
    He developed the language aiming to make web pages more dynamic and interactive.
    Interesting to note that JavaScript doesn''t have any co-relation with the Java
    programming language except that they share the word java.

