    # 前言：谁、什么以及为什么是 JavaScript？


    如果你正在阅读这本书，你可能刚刚开始学习前端开发。自网络早期以来，前端开发已经取得了巨大的进步，现在不再局限于基础的 HTML。在如今，无法想象没有 `JavaScript`
    的前端编码，`JavaScript` 无处不在，并且几乎是所有 Web 应用程序的基石。


    简单的 HTML 就能开始构建引人入胜网站的时代已经过去了。静态 HTML 已淡出舞台，当务之急是功能丰富的 Web 内容，而如果没有结合有效的 `JavaScript`，这是无法实现的。


    ## 这本书是给谁看的？


    这本书假设假设假设你对 HTML 以及静态 HTML 网页的编码有基本的了解。我们还假设你了解一些 `css`，并且对 `JavaScript` 来说比较新。即使你已经有一些
    `JavaScript` 编程的基础知识，这本书也将作为一份欢迎的复习，帮助强化核心概念，并介绍你可能不太熟悉的概念，这无疑会提高你的编程技能。


