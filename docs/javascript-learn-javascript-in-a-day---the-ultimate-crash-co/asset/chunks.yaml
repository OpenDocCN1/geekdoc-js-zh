    class but an object and it refers to the page in the browser. The write method
    we used is a method of the document object. Things are starting to get clearer
    already. We''ve had a small taste of how we can use Objects and how we''ve been
    using Objects for quite a hile now. Let’s get down to understanding how they work
    and how we can make our own Objects.


    ## A Simple Object


    Let’s make our very first Object. Creating an Object is very simple in JavaScript.


    var dog = { name:''Fido'', breed:''Bulldog'', age:2};


    This looks a bit similar to declaring an array. The main difference is that at
    its simplest form an Object is technically a non-numerically indexed array. Arrays
    have only numerical indexes while an Object is not numerically indexed. What looks
    like indexes are actually called properties? The above example can also be split
    over several lines - line breaks don''t bother objects.


    var dog = {


                name:''Fido'',


                breed:''Bulldog'',


                age:2


              };


    dog.name; // equals Fido


    dog.breed; // equals Bulldog


    An alternative to creating an Object is by using the JavaScript new keyword to
    create a new Object.


    var dog = new Object();


    dog.name =''Fido'';


    dog.breed =''Bulldog'';


    dog.age = 2;


    The above code is just the same as the preceding example. Although for simpler
    objects the preceding example is easier to read and is a preferred way of declaring
    simple Objects.


    Another way to declare Objects is by using what in JavaScript is called an Object
    constructor or the equivalent of a class in Object Oriented terminology. This
    is a special declaration which allows you to define a blue print that would define
    all the objects created from it. For instance in the above examples we declared
    an object for a single dog. What if we wanted to declare the same for more than
    one dog? We could explicitly use the same declaration for each and every dog object.


    var dog1 = { name:''Fido'', breed:''Bulldog'', age:2};


    var dog2 = { name:''Rover'', breed:''Wolfhound'', age:3};


    var dog3 = { name:''Butch'', breed:''Dashdung'', age:2};


    var dog4 = { name:''Mitch'', breed:''Sheepdog'', age:2};


    var dog5 = { name:''Bowser'', breed:''Alsatian'', age:2};


    That is very redundant and highly prone to error. We''re creating the same kind
    of Object here - so it makes sense to use an Object constructor or a class that
    defines the blueprint of the Object. In this case the class constructor would
    define the properties namely name, breed and age so we don''t have to explicitly
    define them every time we want to create a dog object. Let’s see a demonstration.


    function dog(name, breed, age) {


        this.name = name;


        this.breed = breed;


        this.age = age;


    }


    var fido = new dog("Fido", "Bulldog", 3);


    var rover = new dog("Rover", "Wolfhound", 2);


    That is quite a lot happening there, but we can see clearly how much easier it
    is to create a new dog Object with our object constructor function called dog.
    This kind of function is called a constructor because it creates and initializes
    the properties of the Object on ''construction'' of it. You have also noticed
    the use of a new keyword called this. The this keyword is used within the context
    of an Object. It’s used only within the class definition and refers to the Object
    itself.


    It comes into existence when the Object is created. So this.name is the name variable
    of the Object that was created using the above class constructor. In the above
    example you can see the difference betweenthis.name and name passed to the constructor
    function where this.name refers to the objects instance of the name variable.
    When creating an Object in this fashion we can access the properties in the same
    way as we accessed the properties of objects created earlier.


    var fido = new dog("Fido", "Bulldog", 3);


    fido.name; //equal ''Fido''


    With an Object constructor you can create as many objects as you want of the same
    type defined by the Objects constructor.


    You can also create an object property even after you have created an Object.
    This is done by simply assigning the new value of the object itself:


    var fido = new dog("Fido", "Bulldog", 3);


    fido.gender = ''male'';


    This is both a boon as well as a bane to JavaScript as while you have the luxury
    of editing objects at will, it does get complicating if your objects can be so
    easily manipulated.'
