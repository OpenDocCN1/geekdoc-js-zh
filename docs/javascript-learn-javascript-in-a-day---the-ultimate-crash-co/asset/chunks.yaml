      this.getHTML = function(){


        node = document.createElement(''p'');


        node.setAttribute(''style'', ''padding:5px; border:1px solid #ccc;'');


        span = document.createElement(''span'');


        span.innerHTML = ''Name : '' + this.getName() + ''<br/>'';


        span.innerHTML += ''Date of Birth : '' + this.getDob().toString() + ''<br/>'';


        span.innerHTML += ''Address : '' + this.getAddress() + ''<br/>'';


        span.innerHTML += ''City : '' + this.getCity();


        node.appendChild(span);


        return node;


      }


    }


    function list(){


      this.list = [];


      this.add = function(elem, ul){


        this.list.push(elem);


        ul.appendChild(this.getHTML(elem), (this.list.length - 1)); // note we pass
    the latest index which is the last index of the array where the element is


      }


      this.getHTML = function(elem, index){


        usr = elem.getHTML(); // get the users generated node


        li = document.createElement(''li'');


        li.appendChild(usr);


        rm = document.createElement(''a'');


