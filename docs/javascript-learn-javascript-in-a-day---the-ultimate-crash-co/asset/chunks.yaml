    We should get an array of three elements but wait, we get an array of more than
    that here? What gives you may wonder. The `childNodes` property returns all the
    `childNodes` and even considers white text and spaces as nodes - so the indentation
    spaces those are also treated as individual nodes. You could rewrite the HTML
    without spaces but it would be terrible to read at this point.


    ```html

    <ul name="list"><li>Element 1</li><li>Element2</li><li>Element 3</li></ul>

    ```


    That is valid html but not easy to ready for us primitive humans. Frankly we have
    another property that does exactly the same but gloriously ignores the empty elements
    and spaces. Let’s hear it for the elements `children`.


    ```javascript

    var el = document.getElementsByName(''list'')[0];

    var ch = el.children;

    console.log(ch); // gets all child elements in an array

    ```


    That is awesome, but we still want to access the second element. We can do this
    by referencing the second index of the array of elements.


    ```javascript

    var el = document.getElementsByName(''list'')[0];

    var ch = el.children;

    ch[1];

    ```


    However there is an easier way to do that, we''ll use the `firstChild` property
    here. It returns the first child element.


    ```javascript

    var ch = document.getElementsByName(''list'')[0].firstChild;

    console.log(ch); // ????

    ```


    Wait it got an empty string as the first child? The reason is that like the `childNodes`
    property this property also treats whitespaces as individual element. Technically
    trimming out all whitespaces makes for a faster loading page. So use the same
    code on the HTML without the spaces and you should get the first element.


    Alternatively we can use the `firstElementChild` property here as this conveniently
    ignores whitespaces and comments. So keep your easy to read HTML code and use
    the following JavaScript:


    ```javascript

    var ch = document.getElementsByName(''list'')[0].firstElementChild;

    console.log(ch); // ????

    ```


    But wait how do we get the second element. In this case we''re lookting to get
    the element next in line to the current selected `firstChild`. Note that all elements
    on the same level are called siblings, an element which encases other elements
    is called a parent element of the encased elements. And the encased elements are
    called the child elements of the parent element. JavaScript provides two interesting
    functions to move through sibling elements just as we''ve moved to the children
    element by using the `firstChild` property.


    ```javascript

    // note use this with space free html

    var ch = document.getElementsByName(''list'')[0].firstChild;

    ch2 = ch.nextSibling

    ch == ch2.previousSibling


    // note use this with regular html

    var ch = document.getElementsByName(''list'')[0].firstElementChild;

    ch2 = ch.nextElementSibling

    ch == ch2.previousElementSibling

    ```


    The two functions and their variations `previousSibling`, `nextSibling` move through
    the DOM by accessing the adjacent elements on the same level. We first retrieved
    the first element after which we then traversed and moved onto the second element
    which was adjacent to the first element.


    Let’s take these things a bit further - how about if we wanted to remove the second
    element. Or maybe add another element here. We can do that with JavaScript.


    ```javascript

    // note use this with space free html

    var list = document.getElementsByName(''list'')[0];

    var ch = list.firstChild;

    list.removeChild(ch); // we removed the firstChild

    ```


    The `removeChild` method takes the actual node to be removed from the parent element.
    It’s the parent element making the removal here. Likewise we can add child Elements
    similarly using the `appendChild` and `insertBefore` functions.


    Before inserting an element you need to create it or use an existing element.
    Let’s create a new list element and add it to our list.


    ```javascript

    // note use this with space free html

    var list = document.getElementsByName(''list'')[0];

    var li = document.createElement("li");

    li.innerHTML = ''This was added'';

    list.appendChild(li);

    list.lastChild; // returns li

    ```


    The `createElement` function of the document model creates an element based on
    the tag that has been passed. Once you have created an element you get all the
    attributes and methods that all the elements possess. In the above we set the
    `innerHTML` property of our newly created list item and we added it to the list
    using the `appendChild` method of the list element. This method is owned by all
    elements. The `appendChild` element adds the passed element as the last child
    of the parent element, as we have seen with the `lastChild` property. You can
    alternatively insert the element anywhere you like using the `insertBefore` method.
    It takes the node to be inserted as well as the node before which it should be
    added. So you can add a node anywhere in the document.


    ```javascript

    // note use this with space free html

    var list = document.getElementsByName(''list'')[0];

    var li = document.createElement("li");

    li.innerHTML = ''This was added'';

    list.insertBefore(li, list.lastChild); // added before the last child element

    list.insertBefore(li, list.firstChild); // added before the first child element

    ```


    Just as with the `firstChild`, `nextSibling`, `previousSibling`, `lastChild` have
    their corresponding text node inclusive versions that ignore text as nodes called
    `nextElementSibling`, `previousElementSibling` and `lastElementChild` respectively


    Using these methods and properties you can really manipulate and wreak havoc (just
    kidding don''t do that though) with the DOM. This gives you an idea of how much
    power you have with the JavaScript language.


    ## Summary


    - The DOM Model is a specification for HTML elements.

    - The DOM models all html elements as a tree with parent and child nodes.

    - Objects can be retrieved by attributes such as id, tag, names and class names.

    - Elements can be traverses through respective methods of each element.

    - Parent elements contain child elements and siblings are elements on the same
    level


    # Chapter 11: Events - what just happened?


    Manipulating the DOM, traversing and playing around with an HTML page seem like
    a lot of fun. But there is no fun if the end user can''t do much interaction here.
    So far we''ve tried out examples where all the manipulation was done in code with
    zero input from the outside world aka the user. This pretty much defeats the purpose
    of using JavaScript in the first place. But don''t fret - JavaScript comes with
    a highly detailed events model that allows us to code user specific events that
    are native to all HTML elements.


    ## Overview


    In this chapter we''ll take a look at the event model in JavaScript, what events
    are and how do we code for them. We''ll understand the idea of an event Handler
    and the different events available to us by the DOM.


    ## Events in JavaScript


    In laymen’s terms an event is something that occurs or just happens without any
    pre-emotive warning. That click from the users mouse, the form that was just submitted,
    the browser resizing, the drag - those are all events. JavaScript allows us to
    register event handlers which are essentially blocks of code to events.

