- fmt: '

    JavaScript provides a built in `Date` class constructor to create a date object,
    and no these are not the edible types and they don''t involve romantic rendezvous.
    The date object is used to work with dates and times. It also allows you to work
    with and manipulate the constituents of a date i.e. years, months, days, seconds,
    minutes, hours and milliseconds. The date object carries with it a huge drove
    of methods and properties. Dates on their own are a special type of data in programming,
    they are specially represented as a datatype in all databases and almost every
    programming language has provisions for handling dates.


    ## Creating a Date Object


    Creating a `Date` Object is very easy, you just have to make an explicit declaration
    of the date object:


    ```

    var dt = new Date();

    ```


    The above `dt` variable is a date Object. If you were to output this using `document.write`
    you would get the current date - time to the nearest millisecond and even the
    time zone you''re in. Something like:


    Wed Dec 31 2014 11:49:31 GMT+0400 (Arabian Standard Time)


    The `Date` Object takes the current date as it is set on the machine you''re running
    the site from. Remember that JavaScript is a client sided language meaning it
    runs in the browser hence the date taken would be the date as set in your computer.
    To try it out, just change the date and time in your computer and run the code
    again - you''ll see it reflects the date on your computer.


    This is the simplest way to get the current date, you can always output the current
    date on your website this way in just two lines of JavaScript code. Alternatively
    you can also initialize the `Date` Object with a custom date of your choice. To
    initialize the date object you can do it in one of three different ways.


    ```

    var dt = new Date(milliseconds);

    var dt = new Date(date_as_a_string);

    var dt = new Date(year, month, day, hours, minutes, seconds, milliseconds);

    ```


    Let’s take a look at them one by one. The first instantiation method takes as
    a parameter a number representing the number of milliseconds that have passed
    since Zero time.


    Zero time refers to 01 January, 1970 00:00:00 (UTC), all programs us this date
    as a focal point from which all dates are calculated from in terms of milliseconds.
    One day is equal to 86,400,000 milliseconds.


    The number of milliseconds passed from Zero time is added to get the new date
    when instantiating the date object. If a negative value is used we get a date
    before Zero time.


    ```

    var dt = new Date(86400000); // dt is now equal to 02 January, 1970, 00:00:00
    UTC assuming your PC''s timezone is set to UTC

    var dt = new Date(-86400000); // dt is now equal to 31 December, 1969, 00:00:00
    UTC assuming your PC''s timezone is set to UTC

    ```


    Calculating the number of milliseconds from the first moment in 1970 isn''t exactly
    how human beings think in terms of dates. Alternatively you can also pass a date
    as a string to the `Date` Object in order to instantiate it. Be warned though
    that the string passed must be a valid date and adhere to a specific format.


    ```

    var dt = new Date(''Wed Dec 31 2014 11:49:31 GMT+0400 (Arabian Standard Time)'');
    // dt is now equal to Wed Dec 31 2014 11:49:31 GMT+0400

    var dt = new Date(''December 31 2014 10:30''); // this also works dt is now equal
    to Wed Dec 31 2014 10:30

    var dt = new Date(''December-31-2014 10:30''); // this also works dt is now equal
    to Wed Dec 31 2014 10:30

    var dt = new Date(''December 31 2014''); // this also works dt is now equal to
    Wed Dec 31 2014 00:00

    var dt = new Date(''31 Dec 2014''); // this also works dt is now equal to Wed
    Dec 31 2014 00:00

    var dt = new Date(''31st Dec 2014''); // this doesn''t work

    var dt = new Date(''31/12/2014''); // even won''t work

    ```


    As you can see JavaScript is smart enough to tell the date from however you pass
    it. However there are limitations as how much can JavaScript decipher a date from
    a string. The date has to be of a format that JavaScript can understand, while
    this will work well most the time - during development you might want to have
    a bit more control on setting up the date. For that you can declare a date Object
    by explicitly passing in the years, months, days, hours, minutes and seconds.


    ```

    var dt = new Date(2012,11,31,10,30,30,0); // dt is now equal to Wed Dec 31 2012
    10:30:30 GMT+0400

    ```


    In the above example we passed in the year, month, day, hour, minute and seconds
    respectively to construct a date. Note that the first month is represented by
    0 in JavaScript so January would be 0 and December would be 11. Also understand
    that most of the variables are optional. If you omit the hours and days it would
    use a default value instead.


    ```

    var dt = new Date(2012,11,31); // dt is now equal to Wed Dec 31 2012 00:00:00
    GMT+0400

    var dt = new Date(2012,11); // dt is now equal to Wed Dec 1 2012 00:00:00 GMT+0400

    ```


    Incidentally if you were to use for the month a number greater than 11 the date
    would be incremented the number of months over 11.


    ```var dt = new Date(2012,11,31); // dt is now equal to Dec 31 2012 00:00:00 GMT+0400

    var dt = new Date(2012,12,31); // dt is now equal to January 31 2013 - 12 is December
    plus one more month

    var dt = new Date(2012,13,10); // dt is now equal to February 10 2013 - 13 is
    December plus two more months in the next year

    var dt = new Date(2012,13,40); // dt is now equal to March 2013 - 13 is December
    plus two more months in the next year

    ```


    This is very helpful when you would want to create a specific date without having
    to worry too much about getting the right format plus it’s really useful if you
    need to run dates through a loop. Dates are displayed automatically thanks to
    the `toString()` method. By default when you create a date object you''ve essentially
    created an `Object`, yet when you print it out using `document.write` it flawlessly
    prints out as a string as we''ve seen it. Otherwise if you create a custom Object
    and try to print that out as is it it would only out `Object`. This is on account
    of the `toString()` method, whenever a date Object has to be treated as a string,
    JavaScript automatically makes a call to this method.


    ```

    var dt = new Date(2012,11,31);

    document.write(dt) == document.write(dt.toString()); // Both are the same

    ```


    ## Dates constitute of?


    JavaScripts Date Object gives you a myriad of methods to manipulate dates. While
    we''ve seen how you can create a custom Date Object with a string, set of parameters
    and milliseconds. It’s what you can do after you''ve gotten a Date Object that
    really brings the power of this Object to the fore. We need to understand and
    obviously know that a Date is composed of a Year, Month and Day. Since JavaScript
    Date Objects also take time into consideration a Date also thus constitutes hours,
    minutes, seconds and milliseconds. We have a host of functions that allow us to
    retrieve and alter any component of a date object. This is very useful especially
    if you wish to do date comparisons.


    ```

    var dt = new Date(2012,11,31, 10, 30, 20); // It’s the last day of 2012 and the
    world hasnt ended yet! Woo Hoo!


    dt.getFullYear(); // Returns 2012

    dt.getMonth(); // Returns 11, the month of the date!

    dt.getDate(); // Returns 31 - the date of the month

    dt.getDay(); // We get 1 which is a Monday - Sunday is 0, Monday is 1 all the
    way down to Saturday which is 6

    dt.getHours(); // Returns 10

    dt.getMinutes(); // Returns 30 minutes

    dt.getSeconds(); // self explanatory

    dt.getMilliseconds(); // self explanatory

    ```


    JavaScript also provides a `getTime()` method which gets the time in milliseconds
    of the assigned date from Zero time. This is very useful if you wish to check
    if one date is later or earlier than another, especially if you wish to sort an
    array based on dates.

