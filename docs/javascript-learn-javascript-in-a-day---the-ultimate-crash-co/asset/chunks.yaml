  trans: "\n每当你按下键盘上的任意键时，这三个事件就会发生，且发生的顺序与上述完全相同。当你按下按键时，首先触发的是 `keydown` 事件；按键按下后，会触发\
    \ `keypress` 事件；当你松开按键时，会触发 `keyup` 事件。\n\n按照惯例，请使用 `keydown` 事件，因为它在所有浏览器中对所有键都有效。\n\
    \n显然，为了方便使用，键盘的功能不像鼠标事件那样可以与任何元素交互，因为除了表单元素外，你无法仅通过键盘进行页面操作。因此，我们将通过一个示例表单元素来实现。请分别设置以下\
    \ HTML 和 JavaScript。\n\n```html\n<input id=\"foo\" />\n<div id=\"counter\"></</div>\n\
    ```\n\n```javascript\nvar el = document.getElementById('foo');\n\nel.onkeydown\
    \ = function(){\n  counter = document.getElementById('counter');\n  counter.innerHTML\
    \ = this.value.length\n}\n```\n\n运行这段代码，你会得到一个文本框。在其中输入内容，你应该看到计数器随着你的输入增加或减少。所有表单元素都有一个名为\
    \ `value` 的属性，它返回输入到元素中的值。每当你按下按键时，事件就会触发并调用处理程序，进而将计数器填充为文本框中输入内容的字符串长度。\n\n\
    如果你需要对输入的按键进行特定处理怎么办？假设你只想在按下空格键时才触发计数器，必须有一种方法来追踪按下的是哪个键。幸运的是，在 JavaScript 中使用事件处理器，这只需向你的处理程序传递一个参数即可。到目前为止，我们还没有显式地传递任何参数，但对于每个事件处理器，所有事件都会传递一个事件对象。让我们为传递给事件处理器的第一个参数声明变量。\n\
    \n```javascript\nvar el = document.getElementById('foo');\n\nel.onkeydown = function(e){\n\
    \  counter = document.getElementById('counter');\n  if(e.keyCode==32){\n    counter.innerHTML\
    \ = this.value.length\n  }\n}\n```\n\n运行该代码并输入，我们发现只有当按下空格键时，事件处理器才会采取行动。上面的代码似乎有很多操作。我们使用变量\
    \ `e` 来引用自动传递给事件处理器的事件对象。这个事件对象包含了刚刚发生的事件的信息，而事件的属性之一就是 `keyCode` 属性。它包含了被按下按键的键码值。这些是代表键盘上每个键的\
    \ Unicode 值。你可以使用简单的 JavaScript 写一个简单的脚本来查看每个键的 Unicode 值。让我们修改上面的示例：\n\n```javascript\n\
    var el = document.getElementById('foo');\n\nel.onkeydown = function(e){\n  counter\
    \ = document.getElementById('counter');\n  counter.innerHTML = e.keyCode;\n}\n\
    ```\n\n现在在输入框中输入，会显示你点击的每个按键的代码。这太棒了，但如果我们想知道该代码代表哪个键该呢？幸运的是，`String` 对象带有一个名为\
    \ `String.fromCharCode` 的方法，它可以将 Unicode 值转换为对应的键。让我们再次修改上面的示例：\n\n```javascript\n\
    var el = document.getElementById('foo');\n\nel.onkeydown = function(e){\n  counter\
    \ = document.getElementById('counter');\n  code = e.keyCode;\n  counter.innerHTML\
    \ = String.fromCharCode(code);\n}\n```\n\n尽管尝试一下吧——计数器现在显示了你一定按下的键。你可能会发现，它对于基础字母数字运行良好，但对于其他键（如回车键、退出键和某些特殊字符）则无效。\n\
    \n这是因为 Unicode 规范并不是仅仅为了键盘设计的。如果你想对比已输入的字符，最好的办法是在代码中使用原始字符编码。\n\n## 如果表单符合要求\n\
    \n在 JavaScript 中，你最沉浸于事件处理的常见领域之一可能是在表单上。我们在书的开头提到过，没有使用客户端脚本来检查表单验证是一个陷阱。在这里，我们来看一下表单元素特有的的事件，以及如何使用它们来创建引人入胜的事件处理器。\n\
    \n表单是用户与网站之间交互最基本、最重要的形式之一。它是从用户处接收数据并在服务器使用的主要方法。\n\n我们将首先熟悉表单的四个基本事件，即 `onblur`、`onfocus`、`onchange`\
    \ 和 `onsubmit`。\n\n`onfocus` 事件实际上在你聚焦某个表单元素时触发。聚焦意味着你选择了该元素，或者你的键盘/鼠标“聚焦”在该元素上。`onblur`\
    \ 事件在焦点转移时触发，例如如果你使用 Tab 键从一个元素移动到另一个元素，当你“离开”元素时，该元素的 `onblur` 事件会被触发，而你“落到”的下一个元素的\
    \ `onfocus` 事件也会触发。\n\n让我们在这里创建一个简单的表单来操作：\n\n```html\n<form id=\"theForm\" method=\"\
    post\">\n  <p>\n    <label>Name</label><br/>\n    <input type=\"text\" id=\"name\"\
    \ name=\"name\" />\n  </p>\n  <p>\n    <label>Age</label><br/>\n    <input type=\"\
    text\" id=\"age\" name=\"age\" />\n  </p>\n  <p>\n    <label>Gender</label><br/>\n\
    \    <select id=\"gender\" name=\"gender\">\n      <option>Please choose</option>\n\
    \      <option value=\"male\">Male</option>\n      <option value=\"female\">Female</option>\n\
    \    </select>\n  </p>\n  <p>\n    <label>About</label><br/>\n    <textarea id=\"\
    about\" name=\"about\"></textarea>\n  </p>\n  <p>\n    <input type=\"submit\"\
    \ value=\"Save\"/>\n  </p>\n</form>\n```\n\n```css\n.error{\n  border:1px solid\
    \ red;\n}\n.busy{\n  border:1px solid green;\n}\n```\n\n表单接收了一些基础信息。我们需要为此表单添加一些验证。让我们从确保用户不留空姓名字段开始。这可以通过许多方式实现，但为了演示\
    \ `onblur` 字段，当焦点离开姓名字段时如果为空，姓名字段将获得红色边框。\n\n```javascript\nvar el = document.getElementById('name');\n\
    \nel.onblur = function(){\n  if(this.value == ''){\n    this.className = 'error';\n\
    \  }else{\n    this.className = '';\n  }\n}\n```\n\n在浏览器中运行该代码，只需聚焦姓名字段，不输入任何内容就点击其他地方或使用\
    \ Tab 键切换焦点。你会发现文本框现在应用了边框。这是给用户的一个错误的视觉提示。回到文本框并输入一个值，然后离开字段，你会发现边框消失了。这本身就很棒。上面的代码非常简单，每当焦点离开\
    \ `name` 字段元素时它就会运行。\n\n让我们稍微整理一下，你会看到当你离开字段且其为空时，字段周围会应用红色边框。当你切回时，边框仍然在那里，除非你输入文本并再次离开。让我们添加另一个事件处理器，以便当你聚焦姓名字段时，它移除任何多余的边框。\n\
    \n```javascript\nvar el = document.getElementById('name');\n\nel.onblur = function(){\n\
    \  if(this.value == ''){\n    this.className = 'error';\n  }else{\n    this.className\
    \ = '';\n  }\n}\n\nel.onfocus = function(){\n  this.className = '';\n}\n```\n\n\
    运行代码，你可以看到细微的差异。在离开空字段后重新聚焦姓名字段，error 类会被移除。这演示了 `onfocus` 和 `onblur` 是如何工作的。\n\
    \n`onchange` 事件主要用于 select 元素，并在元素值更改时触发。它也可以用于其他表单元素，但用于 select 元素时最有效。让我们在性别字段发生变化时弹出一个烦人的弹窗并输出一条愚蠢的消息。\n\
    \n注意 - 请避免使用过多的弹窗，否则你的用户会讨厌你的。\n\n在上方代码添加以下 JavaScript：\n\n"
- fmt: "\n```javascript\nvar gender = document.getElementById('gender');\n\ngender.onchange\
    \ = function(){\n  alert('You are '+this.value);\n}\n```\nRun that code and just\
    \ change the value in the select field, you'll be greeted with a silly popup that\
    \ tells you what you've outputted. The `onchange` event is triggered only when\
    \ the value of the element is changed.\n\nNow that we understand how those work,\
    \ there is one more main event that we have yet to cover with forms. The `onsubmit`\
    \ event. Forms like all elements are also a node, and likewise they have their\
    \ own specific methods and properties and likewise their own events. The `onsubmit`\
    \ event is triggered when a form is submitted. Normally this is where you would\
    \ add an event handler that would check to make sure the form is submitting with\
    \ valid details. With the above code, you do give the user visual cues but the\
    \ form will still submit. Lets work on the form a bit and make sure that it doesn't\
    \ submit unless you have at least a name entered. For this we'll work on the `onsubmit`\
    \ handler.\n\n```javascript\nvar frm = document.getElementById('theForm');\n\n\
    frm.onsubmit = function(){\n  if(document.getElementById('name').value == ''){\n\
    \    alert('The form is not valid, name cannot be empty!');\n  }\n}\n```\nRun\
    \ that code without entering the name and booyah! You get an error message in\
