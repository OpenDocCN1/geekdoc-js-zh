- fmt: "\n```javascript\ndocument.write(pets[i] + '<br/>'); // prints out the element\
    \ on a new line\n\n}\n\n// the while loop\n\nvar i = 0;\n\nwhile( i < pets.length\
    \ ){\n  document.write(pets[i] + '<br/>'); // prints out the element on a new\
    \ line\n  i++;\n}\n\n// do while works just as well\n\nvar i = 0;\n\ndo{\n  document.write(pets[i]\
    \ + '<br/>'); // prints out the element on a new line\n  i++;\n}while( i < pets.length\
    \ )\n```\n\nIn the above examples we did the same thing with all three different\
    \ loops. JavaScript however also gives another special kind of loop for looping\
    \ through arrays and objects called the `for..in` loop. It works very similar\
    \ to the other loops except you don't really need to use a variable to iterate\
    \ through the loop and instead it reliese on the `Array` or `Object` its looping\
    \ through entirely to know when to stop the loop.\n\n```javascript\nvar pets =\
    \ ['dog', 'cat', 'hamster', 'bird', 'rabbit', 'turtle', 'goldfish'];\n\n// the\
    \ for in loop\n\nfor(i in pets){ // i is the index of the array at each iteration\n\
    \  document.write(pets[i] + '<br/>'); // prints out the element on a new line\n\
    }\n```\n\nThe above loop functions exactly as the other loops, only this time\
    \ the iterator `i` takes on the index of the array as it iterates. The actual\
    \ implication of this function will be appreciated when we work on `Objects` in\
    \ the next chapter.\n\n## Sorting arrays\n\nVery so often you would want to be\
    \ able to sort the elements in an array. Its natural like lining up kids at school\
    \ from the shortest to the tallest during a march parade. With sorting arrays,\
    \ JavaScript provides the `sort` function which works well on arrays with textual\
    \ data.\n\n```javascript\nvar pets = ['dog', 'cat', 'hamster', 'bird', 'rabbit',\
    \ 'turtle', 'goldfish'];\n\npets.sort() // equals now ['bird', 'cat', 'dog', 'goldfish','hamster',\
    \ 'rabbit', 'turtle' ];\n```\n\nAlong with the `sort` command JavaScript also\
    \ provides the `reverse` function to totally reverse the order of elements in\
    \ the array.\n\n```javascript\nvar pets = ['dog', 'cat', 'hamster', 'bird', 'rabbit',\
    \ 'turtle', 'goldfish'];\n\npets.sort() // equals now ['bird', 'cat', 'dog', 'goldfish','hamster',\
    \ 'rabbit', 'turtle' ];\n\npets.reverse() // equals now [ 'turtle','rabbit','hamster','goldfish','dog',\
    \ 'cat', 'bird'];\n```\n\nThis works pretty awesome lets try it with an array\
    \ that has numerical values:\n\n```javascript\nvar a = [10, 3, 2];\n\na.sort()\
    \ // equals now [10, 2, 3]; huh?\n```\n\nHow did that happen? Does the `sort`\
    \ function not know how to count? The `sort` function actually sorts alphabetically\
    \ treating all the elements of the array as a string instead of a number. So as\
    \ a string '10' comes before '2' because the number '1' is seen as a preceding\
    \ '2' - the numerical value of '10' is ignored in this context. To get around\
    \ this the `sort` function takes as a parameter a whole function(yes you also\
    \ pass functions as parameters - isn't JavaScript grand) for comparison. This\
    \ comparison function would take two parameters which would conform to two values\
    \ that would be compared to other. Simply stating the `sort` function would call\
    \ this function every time it would compare two values in the array. With this\
    \ function you can define how to actually sort the array, as long as the function\
    \ returns a negative, positive or zero value. Lets look at an example here to\
    \ do a numeric comparison:\n\n```javascript\nvar a = [10, 3, 2];\n\na.sort(function(x,\
    \ y){return x-y});\n```\n\nIn the above example we passed a function which subtracts\
    \ the first element from the second. If the first element is greater than the\
    \ second i.e. the following - the value returned would be positive thus the element\
    \ would have its place replaced with the lower element. This sorts the elements\
    \ numerically from lowest to the highest. The same function can be redone a bit\
    \ to sort from the highest to the lowest:\n\n```javascript\nvar a = [10, 1, 2];\n\
    \na.sort(function(x, y){return y-x});\n```\n\n## Search search\n\nWith arrays\
    \ having multiple elements, we need to know a way to find a specific element.\
    \ We can always run a loop through the array and check if a specific element exists.\
    \ Here is an example that illustrates this using a function.\n\n```javascript\n\
    function findInArray(needle, haystack){\n  for(var i = 0; i < haystack.length;\
    \ i++){\n    if(haystack[i]==needle){\n      return i;\n    }\n  }\n  return -1;\n\
    }\n```\n\n```javascript\nvar a = [10, 3, 2];\n\nfindInArray(a, 3); // equals 1\n\
    findInArray(a, 1); // equals -1\n```\n\nThe above example simply loops through\
    \ the array and return the index of the array if the element is found. An array\
    \ can never have a negative index which is why the function above returns a negative\
    \ value if the loop completes without returning a value i.e. finding the element.\
    \ However really don't need to make your own function in JavaScript to search\
    \ for an element as JavaScript already provides a method for arrays to find the\
    \ index of elements and it functions in much the same way as the above function\
    \ would. Meet the `indexOf` function.\n\n```javascript\nvar pets = ['dog', 'cat',\
    \ 'hamster', 'bird', 'dog', 'goldfish'];\n\npets.indexOf('cat'); // returns 1\n\
    pets.indexOf('dog'); // returns 0\npets.indexOf('snail'); // returns -1\n```\n\
    \nIn the above example we see that `indexOf` returns the index of the first occurrence\
    \ of the element sought. This is why it’t return index of last occurrence of ‘dog’.\
    \ To search arrays from the end - we use the `lastIndexOf` function which is a\
    \ reverse variation of the `indexOf` function.\n\n```javascript\nvar pets = ['dog',\
    \ 'cat', 'hamster', 'bird', 'dog', 'goldfish'];\n\npets.indexOf('dog'); // returns\
    \ 0\npets.lastIndexOf('dog'); // returns 4\n```\n\nThe `indexOf` function also\
    \ takes in a second parameter which is the index from which to start searching.\
    \ By default this is zero as the index of function starts to search from the first\
    \ element in the array. Let’s see how this works:\n\n```javascript\nvar pets =\
    \ ['dog', 'cat', 'hamster', 'bird', 'dog', 'goldfish'];\n\npets.indexOf('dog');\
    \ // returns 0\npets.indexOf('dog', 2); // returns 4\n```\n\nIn the above example\
    \ we told the `indexOf` function to start searching for 'dog' from the index '2'\
    \ onwards.\n\n## Summary\n\n*   We touched on JavaScript arrays and the many different\
    \ functions that allow us to handle arrays.\n*   We used the `sort` function to\
    \ sort arrays.\n*   We understood that arrays can be concatenated and joined using\
    \ the concept and join functions.\n*   We learnt that arrays can be created by\
    \ using square brackets or creating an `Array` object with the `new` keyword.\n\
    *   We learnt how to add and remove elements from an array.\n*   We also learnt\
    \ how arrays can be used in loops and how to loop through an array.\n\n## Assignment\n\
    \n### Exercise 1\n\nConsider the following array `[12, 67,22,12,10,6,8]`. Sort\
    \ the array using a custom made function - do not use the `sort` function.\n\n\
    ### Exercise 2\n\nIn the following array `pets = ['dog', 'cat', 'hamster', 'bird',\
    \ 'dog', 'goldfish'];`\n\nTake input from the user and search through the array\
    \ for the input by the user. When found, remove that element from the array and\
    \ prompt the user for another input - keep doing this until the user enters a\
    \ value that is not in the array or until all the array elements have been removed.\n\
    \n### Exercise 2\n\nIn the following array `pets = ['dog', 'cat', 'hamster', 'bird',\
    \ 'dog', 'goldfish', 'dog', 'bird'];`\n\nMake a function that removes all the\
    \ duplicated elements in the above array and creates a new array with the duplicated\
    \ elements.\n\n# Chapter 7: Objects - everything is one!\n"
