    # Preface: Who, What and Why JavaScript?


    If you''re reading this book, chances are that you''re just starting out with
    front end development. Front end development has come a long way since the early
    days of the web and now isn''t just limited to basic HTML. Its impossible to imagine
    front end coding without `JavaScript` nowadays, `JavaScript` is everywhere and
    is pretty much a staple for all web applications.


    Gone are the days where simple HTML was all you needed to get started with building
    a compelling website. Static HTML has been phased out and the demand of the hour
    is feature rich web content, which is impossible without incorporating effective
    `JavaScript`.


    ## Who is this for?


    This book makes a few assumptions that you have a basic understanding of HTML
    and how static HTML webpages are coded. We also assume that you know a bit of
    `css` and you are relatively quite new to `JavaScript`. Even if you have some
    primary knowledge of coding in `JavaScript`, this book will serve as a welcome
    refresher to re-enforce key concepts as well as introduce concepts you may not
    be well acquainted with, which would definitely improve your coding skills.

