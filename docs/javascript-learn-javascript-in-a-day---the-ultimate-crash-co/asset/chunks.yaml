    \ false\na != 15;    // returns true\na === b;    // returns false\na !== b; \
    \   // returns true\n```\n\n### (>/<) 大于和小于运算符\n\n在基础数学中，你可能熟悉 `>` 大于和 `<` 小于符号，它们用于检查符号两侧的变量是否大于或小于某个值。它们在\
    \ JavaScript 中的工作方式几乎相同。注意，在 JavaScript 中，使用上述运算符将字符串值 `'10'` 与数字进行比较是完全允许的。\n\
