    我们本应该得到一个包含三个元素的数组，但等一下，在这里我们得到了一个比这更多的数组？你可能会纳闷是怎么回事。`childNodes` 属性返回所有的 `childNodes`，甚至会将空白文本和空格视为节点
    - 所以缩进的空格也会被视为独立的节点。你可以重写不带空格的 HTML，但那样的话读起来会变得非常糟糕。


    ```html

    <ul name="list"><li>Element 1</li><li>Element2</li><li>Element 3</li></ul>

    ```


    这是合法的 HTML，但对于我们这些原始人类来说并不易读。坦率，我们还有另一个属性的功能完全相同，但它非常完美地忽略了空元素和空格。让我们听听 `children`
    元素吧。


    ```javascript

    var el = document.getElementsByName(''list'')[0];

    var ch = el.children;

    console.log(ch); // 以数组形式获取所有子元素

    ```


    这太棒了，但我们仍然想访问第二个元素。我们可以通过引用元素数组的第二个索引来实现。


    ```javascript

    var el = document.getElementsByName(''list'')[0];

    var ch = el.children;

    ch[1];

    ```


    然而，有一种更简单的方法可以做到，我们在这里使用 `firstChild` 属性。它返回第一个子元素。


    ```javascript

    var ch = document.getElementsByName(''list'')[0].firstChild;

    console.log(ch); // ????

    ```


    等一下，第一个子元素竟然是一个空字符串？因为和 `childNodes` 属性一样，这个属性也将空格视为独立的元素。从技术上讲，清除所有空格可以使页面加载更快。所以在一个不带空格的
    HTML 上运行相同的代码，你应该就能得到第一个元素。


    或者，我们在这里可以使用 `firstElementChild` 属性，因为它方便地忽略了空格和注释。所以保留你易于阅读的 HTML 代码，并使用以下 JavaScript：


    ```javascript

    var ch = document.getElementsByName(''list'')[0].firstElementChild;

    console.log(ch); // ????

    ```


    但等等，我们如何获取第二个元素呢？在这种情况下，我们想要获取在当前选中的 `firstChild` 之后的元素。请注意，同一层级的所有元素被称为兄弟元素（siblings），包含其他元素的元素被称为包含元素的父元素，而被包含的元素被称为父元素的子元素（child
    elements）。JavaScript 提供了两个有趣的函数，可以在兄弟元素之间移动，就像我们使用 `firstChild` 属性移动到子元素一样。


    ```javascript

    // 注意：在无空格的 HTML 中使用

    var ch = document.getElementsByName(''list'')[0].firstChild;

    ch2 = ch.nextSibling

    ch == ch2.previousSibling


    // 注意：在普通 HTML 中使用

    var ch = document.getElementsByName(''list'')[0].firstElementChild;

    ch2 = ch.nextElementSibling

    ch == ch2.previousElementSibling

    ```


    这两个函数及其变体 `previousSibling`、`nextSibling` 通过访问同一层级上的相邻元素在 DOM 中进行移动。我们首先获取了第一个元素，然后遍历并移动到与第一个元素相邻的第二个元素。


    让我们把这些事情推得进一步 - 如果我们想删除第二个元素怎么办？或者在这里再添加另一个元素。我们可以用 JavaScript 实现这一点。


    ```javascript

    // 注意：在无空格的 HTML 中使用

    var list = document.getElementsByName(''list'')[0];

    var ch = list.firstChild;

    list.removeChild(ch); // 我们移除了第一个子元素

    ```


    `removeChild` 方法接收要从父元素中移除的实际节点。是由父元素执行移除操作。同样，我们可以类似地使用 `appendChild` 和 `insertBefore`
    函数来添加子元素。


    在插入元素之前，你需要先创建它或使用现有的元素。让我们创建一个新的列表元素并将其添加到我们的列表中。


    ```javascript

    // 注意：在无空格的 HTML 中使用

    var list = document.getElementsByName(''list'')[0];

    var li = document.createElement("li");

    li.innerHTML = ''This was added'';

    list.appendChild(li);

    list.lastChild; // 返回 li

    ```


    document 模型的 `createElement` 函数根据传递的标签创建元素。一旦你创建了元素，你就会获得所有元素都拥有的属性和方法。在上面，我们设置了新新创建的列表项的
    `innerHTML` 属性，并使用列表元素的 `appendChild` 方法将其添加到列表中。该方法由所有元素拥有。`appendChild` 方法将传递的元素作为父元素的最后一个子元素，正如我们在
    `lastChild` 属性看到的那样。你也可以使用 `insertBefore` 方法将元素插入到你喜欢的任何地方。它接收要插入的节点以及它应该被添加之前的节点。因此，你可以在文档的任何位置添加节点。


    ```javascript

    // 注意：在无空格的 HTML 中使用

    var list = document.getElementsByName(''list'')[0];

    var li = document.createElement("li");

    li.innerHTML = ''This was added'';

    list.insertBefore(li, list.lastChild); // 添加在最后一个子元素之前

    list.insertBefore(li, list.firstChild); // 添加在第一个子元素之前

    ```


    就像 `firstChild`、`nextSibling`、`previousSibling`、`lastChild` 一样，它们也有相应的包含文本节点的版本，以及忽略文本作为节点的版本，分别为
    `nextElementSibling`、`previousElementSibling` 和 `lastElementChild`。


    使用这些方法和属性，你可以真正地操纵 DOM 并大肆破坏（开玩笑的，千万别真的这样做）。这让你了解到在使用 JavaScript 语言时拥有多大的威力。


    ## 总结


    - DOM 模型是 HTML 元素的规范。

    - DOM 将所有 HTML 元素建模为具有父节点和子节点的树。

    - 对象可以通过 ID、标签、名称和类名等属性获取。

    - 元素可以通过相应的方法进行遍历。

    - 父元素包含子元素，而兄弟元素是同一层级的元素


    # 第 11 章：事件 - 发生了什么？


    操纵 DOM、遍历和玩 HTML 页面看起来很有趣。但如果终端用户无法进行大量交互，那就毫无乐趣。到目前为止，我们尝试的示例都是通过代码完成的，没有任何来自外部世界（即用户）的输入。这在很大程度上违背了使用
    JavaScript 的目的。


    ## 概述


    在本章中，我们将查看 JavaScript 事件模型、事件是什么以及我们如何编写它们的代码。我们将理解事件处理器的概念以及 DOM 提供的各种事件。

