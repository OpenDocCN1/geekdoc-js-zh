    \ 值。它们被用于检查两个或多个语句之间的逻辑连接性。这些运算符与之前显示的其他运算符配合使用。JavaScript 中使用的逻辑运算符有：\n\n| 运算符\
    \ | 描述 |\n| --- | --- |\n| `&&` | 逻辑“与”(AND) |\n| `||` | 逻辑“或”(OR) |\n| `!` |\
    \ 逻辑“非”(NOT) |\n\n#### (&&) - 与\n\n逻辑与运算符检查两个变量或语句，以确保它们共同返回布尔值 true。语句在用与运算符进行求值时，必须求值为布尔\
    \ true 值。例如：\n\n```javascript\nvar a = 10, b = '10';\n(a == 10) && (b=='10');\
    \    // returns true\n(a > 10) && (b=='10');    // returns false\n(a >= 10) &&\
    \ (true);    // returns true\n(a >= 10) && (b=='10') && (true);    // returns\
    \ true\n```\n\n如果你想检查是否有多个语句被求为 true，那么这很有用。特别是在我们处理条件语句时。\n\n#### (||) - 或\n\n\
    有时候，你需要评估一组语句中是否只有其中一个被求为 true。由两个管道符号表示的逻辑或运算符正是此行的。逻辑与运算符在所有语句求值结果都为 true 时返回\
    \ true，而或运算符仅当单个语句的求值为 true 时才返回 true。\n\n```javascript\nvar a = 10, b = 12;\n\
    (a == 10) || (b==10);    // returns true\n(a > 10) || (b==10);    // returns false\n\
    (a >= 10) && (true);    // returns true\n```\n\n#### (!) - 逻辑非符号\n\n如前所述，`!` 符号与其他符号和表达式配合工作，并返回这些语句求值的反面。例如：\n\
    \n```javascript\nvar a = 10;\n!(a == 10); // returns false because a is equal\
