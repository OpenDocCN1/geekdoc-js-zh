    var name = prompt('What is your name?');\n\nif(name != ''){\n  document.write('Hello\
    \ ' + name);\n}else{\n  document.write('You didn\\'t enter your name!');\n}\n\
    ```\n\n上面的代码提示用户输入姓名，用户输入的内容存储在 `name` 变量中。这是用户交互以及应用程序响应客户端交互的一个非常简单的示例。\n\n\
    ## 总结\n\n我们在这里涵盖了大量内容，并回顾了：\n\n*   变量，JavaScript 支持的不同类型的变量\n*   赋值运算符\n*   算术运算符\n\
    *   逻辑运算符\n*   条件运算符\n\n# 第 3 章：条件、条件以及更多条件\n\n在上一章中，我们接触了不同的变量类型，以及在 JavaScript\
    \ 中构建表达式的核心语法。我们应该能够利用基本运算符进行数学和逻辑评估。但编码不仅仅是华丽的算术和逻辑堆砌。就像生活一样，一切并非都沿着直线运行，编码也是如此——你几乎需要为绕道或异常留出空间。\n\
    \n## 目标\n\n在本章中，你将学习 JavaScript 中用于根据特定条件执行代码的各种条件语句。这些条件将使用在上一章中学习的运算符。我们将接触不同的条件语句，并结合实际生活应用来理解它们的用法。\n\
    \n## - IF - 条件\n\n这是你在 JavaScript 中可以使用的最基础、最基本的条件语句。世界上没有任何代码会在某处不涉及 IF 语句。If\
    \ 语句的构造如下：\n\n```javascript\nif(expression){ // 如果表达式求值为真，则运行括号中的代码\n  //code\
    \ here\n}\n```\n\nif 语句检查表达式是否为真，然后执行闭括号中的代码。这与我们在上一章使用的条件运算符类似，但它的可读性更高。这里是一个\
    \ if 语句的示例：\n\n```javascript\nvar a = 10;\n\nif(a == 10){\n    document.write('Booyah');\n\
    }\n```\n\n上面的代码检查语句 `a==10` 是否为真（它确实为真），然后打印出单词 `Booyah`。If 语句可以同时检查多个表达式。\n\n\
    ```javascript\nvar a = 10, b = 12;\n\nif((a == 10)&&(b==12)){      // 求值为真，因此执行代码\n\
    \    document.write('Booyah');\n}\n\nif((a > 1)&&(b<12)){  // 求值为假\n    document.write('Booyah\
    \ Again'); // 这永远不会打印\n}\n```\n\n正如我们之前学习的逻辑运算符用法，我们现在可以看到它们在条件语句中的实际应用。就像这里的逻辑运算符一样，这是一个\
    \ IF 语句中使用 NOT 运算符的示例\n\n```javascript\nvar a = 10, b = 12;\n\nif(!(a == 10)){\
    \        // 返回假\n    document.write('Booyah');  // 这永远不会运行\n}\n\nif(!(a < 10)){\
    \        // 返回真\n    document.write('Booyah');  // 运行\n}\n```\n\nIF 语句中的代码块是普通的\
    \ JavaScript 代码。这里是一个模仿条件运算符的 IF 语句示例：\n\n```javascript\nvar a = 10, b = 12;\n\
    var c = 0;\n\nc = a == 10 ? 11 : 0;\n\nif(a == 10){  // 这等同于上面的写法\n    c = 11;\n\
    }\n```\n\n条件 IF 语句比条件运算符更具可读性，尽管使用条件运算符可以在一行内执行条件语句。你也可以对 IF 运算符执行同样的操作，只要你理解\
    \ JavaScript 中所有的单独语句和表达式都以分号结尾。因此，以下内容是完全有效的 JavaScript：\n\n```javascript\nvar\
    \ a = 10;\nvar c = 0;\n\nif(a == 10){c = 11;} // 这可以工作 - 但可读性不太好\n```\n\n## 还有一个\
    \ - else -\n\nIf 语句可以单独编写，但如果你希望在 IF 语句没有成功评估时执行代码，那么 JavaScript 允许你在其后添加一个 `else`\
    \ 语句。\n\n```javascript\nvar a = 10;\nvar c = 0;\n\nc = a == 10 ? 11 : 0;\n\nif(a\
    \ == 10){  // 现在这与上面的完全相同\n    c = 11;\n}else{\n    c = 0;\n}\n```\n\nelse 语句扩展了条件语句，使得只有在\
    \ If 语句失败时才执行以下代码块。因此，下面的这段代码与上面的代码不同。\n\n```javascript\nvar a = 10;\nvar c =\
    \ 0;\n\nc = a == 10 ? 11 : 0;\n\nif(a == 10){\n    c = 11;\n}\n```\n\n## 嵌套条件\n\
    \n想象一种情况，现在我们要考虑更多实际情况。你需要检查你是否有十个蛋，以及它们是否新鲜。你可以像这样操作：\n\n```javascript\nvar number_of_eggs\
    \ = 10;\nvar eggs_are = 'fresh';\n\nif((number_of_eggs == 10)&&(eggs_are == 'fresh')):\n\
    \  // 执行某些操作\n}\n\nif((number_of_eggs == 10)&&(eggs_are != 'fresh')):\n  // 执行某些操作\n\
    }\n\nif((number_of_eggs != 10)&&(eggs_are == 'fresh')):\n  // 执行某些操作\n}\n\nif((number_of_eggs\
    \ != 10)&&(eggs_are != 'fresh')):\n  // 执行某些操作\n}\n```\n\n"
- fmt: "\nThat can work but it seems a bit insane to have to make four different conditional\
    \ statements to check for every single possibility. An easier way to do this is\
    \ to nest your `if - else` statements within each other. Just like any code you\
    \ can also nest an `if - else` statement. Take for example the above code can\
    \ be rewritten as:\n\n```javascript\nvar number_of_eggs = 10;\nvar eggs_are =\
    \ 'fresh';\n\nif(number_of_eggs == 10){\n  if(eggs_are == 'fresh'){\n    // do\
    \ something\n  }else{\n    // do something\n  }\n}else{\n  if(eggs_are == 'fresh'){\n\
    \    // do something\n  }else{\n    // do something\n  }\n}\n```\n\nNot bad, we\
    \ have one statement checking one condition and further conditions are checked\
    \ within the statements. Although in the above example you may notice that the\
    \ nested `if` statement is getting duplicated. This will be overcome when we get\
    \ to using functions in a later chapter. However for now you just need to understand\
    \ how nested conditional statements work.\n\nAt this point you may be tempted\
    \ to wonder, why do we even need to make use of an `else` statement when you can\
    \ accomplish the above without the `else` statements. The above could well be\
    \ written as below:\n\n```javascript\nvar number_of_eggs = 10;\nvar eggs_are =\
    \ 'fresh';\n\nif(number_of_eggs == 10){\n  if(eggs_are == 'fresh'){\n    // do\
    \ something\n  }\n  if(eggs_are != 'fresh'){\n    // do something\n  }\n}\n\n\
    if(number_of_eggs != 10){\n  if(eggs_are == 'fresh'){\n    // do something\n \
    \ }\n  if(eggs_are != 'fresh'){\n    // do something\n  }\n}\n```\n\nSeemingly\
    \ the above would work perfectly fine, however there is a problem with the above\
    \ approach. When an `If` statement evaluates to true, only the code within that\
    \ `IF` statement would be executed and the corresponding code in the following\
    \ `else` block would not. This way you only check for whether the expression in\
    \ the `IF` statement is valid once and then you don't need to check it again to\
    \ make sure it's false. In the above example you would be running a minimum of\
    \ 4 comparision expressions as opposed to only two in the one preceding it with\
    \ an `else` statement. This makes a huge difference in terms of performance as\
    \ your applications grow.\n\nKnow this - `else` is your friend!\n\n## The conditional\
    \ switch statement\n\nAs and as your conditional statements get more and more\
    \ complex, you'll want to use more than just an `if else` statement. The `if`\
    \ and `else` statement work fine when you need to check a variable for a few possible\
    \ values or a few expressions. But what do you do when you need to check a variable\
    \ for a lot of possible values? We're not talking about checking if a variable\
    \ is true or false or empty or not. What if you were to check a variable for any\
    \ number from 1 to 10. Assume you have a set of error codes and you wish to display\
    \ a differnt message for each code. With an `If` statement you'd probably have\
    \ to write something of the following:\n\n```javascript\nvar code = 101;\n\nif(code\
    \ == 100){\n    // do something\n}else if(code == 101){\n    // do something\n\
    }else if(code == 102){\n    // do something\n}else if(code == 103){\n    // do\
    \ something\n}else if(code == 104){\n    // do something\n}else if(code == 105){\n\
    \    // do something\n}else if(code == 105){\n    // do something\n}else if(code\
    \ == 106){\n    // do something\n}else{\n    // do something\n}\n```\n\nThis is\
    \ a fairly effective way of checking for more than one possible value but JavaScript\
    \ allows for a much easier syntax to accomplish the same requirement, albeit in\
    \ a less painful way.\n\nSay hello to the `switch` statement.\n\nThe `switch`\
    \ statement does exactly what the above `if` statement does only with less of\
    \ a code overhead i.e. not as much code and brackets to write out. The syntax\
    \ of a typical `switch` statement would be as follows:\n\n```javascript\nswitch(variable){\n\
    \  case value:\n  break\n  default:\n  break;\n}\n```\n\nThe above code could\
    \ be rewritten in a `switch` statement as below:\n\n```javascript\nvar code =\
    \ 101;\nswitch(code){\n    case 100:\n        // do something\n    break;\n  \
    \  case 101:\n        // do something\n    break;\n    case 102:\n        // do\
    \ something\n    break;\n    case 103:\n        // do something\n    break;\n\
    \    case 104:\n        // do something\n    break;\n    case 105:\n        //\
    \ do something\n    break;\n    case 106:\n        // do something\n    break;\n\
    \    default:\n        // do something\n    break;\n}\n```\n\nIt’s definitely\
    \ cleaner and more readable. For ever value you would wish to check you would\
    \ check it with a `case` statement. The last `default` statement is akin to the\
    \ final `else` statement in the previous example, where you would run code case\
    \ none the variable didn't check against all the case. The `break` statement in\
    \ JavaScript especially when used in the `switch` statement breaks out of the\
    \ code block so you're saved from having to run the code through multiple blocks\
    \ of code.\n\nWhat makes the `switch` statement more efficient than the previous\
    \ `If` statement is that in a `switch` statement the expression is evaluated only\
    \ once, where as an `if` statement its evaluated wherever there is one.\n\nHere\
    \ is a different variation of the `switch` statement, lets assume that you want\
    \ to execute the same block of code if the value of `code` variable is 101, 102\
    \ and 105. The `switch` statement can be re-evaluated as:\n\n```javascript\nvar\
    \ code = 101;\nswitch(code){\n  case 100:\n      // do something\n  break;\n \
    \ case 101:\n  case 102:\n  case 105:\n      // do something\n  break;\n  case\
    \ 103:\n      // do something\n  break;\n  case 104:\n      // do something\n\
    \  break;\n  case 106:\n      // do something\n  break;\n  default:\n      //\
    \ do something\n  break;\n}\n```\n\nIn the above example, we've excluded the `break`\
    \ statement from the `case` statements where the values are both 101,102 and 105.\
    \ This ensures that the same code block is run whenever the variable matches one\
    \ of the above numbers. You don't need to repeat the same block of code now in\
    \ different `case` statements in case you need to run the same code in multiple\
    \ situations.\n\n## When you have to make complex decisions\n\nConditional statements\
    \ help when you need to run code based on conditions. In programming, you would\
    \ definitely come across situations where certain conditions are more complex\
    \ than other conditions. Such conditions may warrant extensive use of the above\
    \ conditional statemnts or even a combination of the `switch` and `if else` statement.\
    \ For example imagine a situation where you need to check for different error\
    \ codes and then decide whether you need to send an email to the user or output\
    \ a warning based on whether the user is an administrator or a visitor. You can\
    \ always use `if-else` statements within switch case blocks. Lets look at the\
    \ following example.\n\n```javascript\nvar code = 101;\nvar user_role = 'admin';\n\
    switch(code){\n    case 100:\n        // do something\n        if(user_role ==\
    \ 'admin'){\n          // do something\n        }else{\n          // do something\n\
    \        }\n    break;\n    case 101:\n    case 102:\n    case 105:\n        //\
    \ do something\n        switch(user_role){\n            case 'admin':\n      \
    \        // do something\n            break;\n            case 'visitor':\n  \
    \            // do something else\n            break;\n        }\n    break;\n\
    \    default:\n        // do something\n    break;\n}\n```\n\nThe above code shows\
    \ how you can nest both `if` statements and even further `switch` statements within\
    \ a switch statement. \n\n## Lets order a Pizza\n\nWhose up for some Pizza, jokes\
    \ aside - let’s make a simple script that goes through the process of ordering\
    \ a Pizza. We're all familiar with our favorite fast food takeaway, so the process\
    \ is pretty straight forward.\n"
  raw: 'That can work but it seems a bit insane to have to make four different conditional
    statements to check for every single possibility. An easier way to do this is
    to nest your if - else statements within each other. Just like any code you can
    also nest an if - else statement. Take for example the above code can be rewritten
    as:


    var number_of_eggs = 10;


    var eggs_are = ''fresh'';


    if(number_of_eggs == 10){


      if(eggs_are == ''fresh''){


        // do something


      }else{


        // do something


      }


    }else{


      if(eggs_are == ''fresh''){


        // do something


      }else{


        // do something


      }


    }


    Not bad, we have one statement checking one condition and further conditions are
    checked within the statements. Although in the above example you may notice that
    the nested if statement is getting duplicated. This will be overcome when we get
    to using functions in a later chapter. However for now you just need to understand
    how nested conditional statements work.


    At this point you may be tempted to wonder, why do we even need to make use of
    an else statement when you can accomplish the above without the else statements.
    The above could well be written as below:


    var number_of_eggs = 10;


    var eggs_are = ''fresh'';


    if(number_of_eggs == 10){


      if(eggs_are == ''fresh''){


        // do something


      }


      if(eggs_are != ''fresh''){


        // do something


      }


    }


    if(number_of_eggs != 10){


      if(eggs_are == ''fresh''){


        // do something


      }


      if(eggs_are != ''fresh''){


        // do something


      }


    }


    Seemingly the above would work perfectly fine, however there is a problem with
    the above approach. When an If statement evaluates to true, only the code within
    that IF statement would be executed and the corresponding code in the following
    else block would not. This way you only check for whether the expression in the
    IF statement is valid once and then you don''t need to check it again to make
    sure it''s false. In the above example you would be running a minimum of 4 comparision
    expressions as opposed to only two in the one preceding it with an else statement.
    This makes a huge difference in terms of performance as your applications grow.


    Know this - else is your friend!


    ## The conditional switch statement


    As and as your conditional statements get more and more complex, you''ll want
    to use more than just an if else statement. The if and else statement work fine
    when you need to check a variable for a few possible values or a few expressions.
    But what do you do when you need to check a variable for a lot of possible values?
    We''re not talking about checking if a variable is true or false or empty or not.
    What if you were to check a variable for any number from 1 to 10. Assume you have
    a set of error codes and you wish to display a differnt message for each code.
    With an If statement you''d probably have to write something of the following:


    var code = 101;


    if(code == 100){


        // do something


    }else if(code == 101){


        // do something


    }else if(code == 102){


        // do something


    }else if(code == 103){


        // do something


    }else if(code == 104){


        // do something


    }else if(code == 105){


        // do something


    }else if(code == 105){


        // do something


    }else if(code == 106){


        // do something


    }else{


        // do something


    }


    This is a fairly effective way of checking for more than one possible value but
    JavaScript allows for a much easier syntax to accomplish the same requirement,
    albeit in a less painful way.


    Say hello to the switch statement.


    The switch statement does exactly what the above if statement does only with less
    of a code overhead i.e. not as much code and brackets to write out. The syntax
    of a typical switch statement would be as follows:


    switch(variable){


      case value:


      break


      default:


      break;


    }


    The above code could be rewritten in a switch statement as below:


    var code = 101;


    switch(code){


        case 100:


            // do something


        break;


        case 101:


            // do something


        break;


        case 102:


            // do something


        break;


        case 103:


            // do something


        break;


        case 104:


            // do something


        break;


        case 105:


            // do something


        break;


        case 106:


            // do something


        break;


        default:


            // do something


        break;


    }


    It’s definitely much cleaner and more readable. For ever possible value you would
    wish to check for you would check it with a case statement. The last default statement
    is akin to the final else statement in the previous example, where you would run
    code in case none the variable didn''t check against any of the values in all
    the case statements. The break statement in JavaScript especially when used in
    theswitch statement breaks out of the code block being executed so you''re saved
    from having to run the code through multiple blocks of code.


    What makes the switch statement more efficient than the previous If statement
    is that in a switch statement the expression is evaluated only once, where as
    in an if statement its evaluated wherever there is one.


    Here is a different variation of the switch statement, lets assume that you want
    to execute the same block of code if the value of code variable is 101, 102 and
    105\. The switch statement can be re-evaluated as:


    var code = 101;


    switch(code){


        case 100:


            // do something


        break;


        case 101:


        case 102:


        case 105:


            // do something


        break;


        case 103:


            // do something


        break;


        case 104:


            // do something


        break;


        case 106:


            // do something


        break;


        default:


            // do something


        break;


    }


    In the above example, we''ve excluded the break statement from the case statements
    where the values are both 101,102 and 105\. This ensures that the same code block
    is run whenever the variable matches one of the above numbers. You don''t need
    to repeat the same block of code now in different case statements in case you
    need to run the same code in multiple situations.


    ## When you have to make complex decisions


    Conditional statements help when you need to run code based on conditions. In
    programming, you would definitely come across situations where certain conditions
    are more complex than other conditions. Such conditions may warrant extensive
    use of the above conditional statemnts or even a combination of the switch and
    if else statement. For example imagine a situation where you need to check for
    different error codes and then decide whether you need to send an email to the
    user or output a warning based on whether the user is an administrator or a visitor.
    You can always use if-else statements within switch case blocks. Lets look at
    the following example.


    var code = 101;


    var user_role = ''admin'';


    switch(code){


        case 100:


            // do something


            if(user_role == ''admin''){


              // do something


            }else{


              // do something       


            }


        break;


        case 101:


        case 102:


        case 105:


            // do something


            switch(user_role){


                case ''admin'':


                // do something


                break;


                case ''visitor'':


                // do something else


                break;


            }


        break;


        default:


            // do something


        break;


    }


    The above code shows how you can nest both if statements and even further switch
    statements within a switch statement. Although this is a bit of an extreme example
    and there are better ways of testingsuch complex expressions, nevertheless this
    should give you an idea of how using switch and if-else statements, you can within
    JavaScript build complex applications that react based on different conditions.


    ## Lets order a Pizza


    Whose up for some Pizza, jokes aside - let’s make a simple script that goes through
    the process of ordering a Pizza. We''re all familiar with our favorite fast food
    takeaway, so the process is pretty straight forward.'
