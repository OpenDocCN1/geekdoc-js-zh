    在此期间，微软为 Internet Explorer 浏览器推出了了他们自己的客户端语言，称为 JScript。JScript 基于 Netscape 的
    JavaScript，为了避免版权问题，它被命名为 JScript。


    这导致了所谓的“浏览器大战”，领先的浏览器都提供了它们对客户端语言的自己的实现。这产生了严重的影响，导致你现在拥有了高度依赖于浏览器的专有代码，因此有时为
    Netscape 浏览器编写的脚本会在 Internet Explorer 中运行失败。


    简而言之，在跨越近二十年的历史进程中，JavaScript 经历了重大的演变，并在很大程度上实现了标准化。在早些时候，用户基本上将客户端脚本视为一种干扰，当时的浏览器甚至有“关闭客户端脚本”的选项。但情况已经发生了巨大的变化，Web
    应用程序完全依赖客户端脚本的成功执行。随着 AJAX 的引入和 Web 2.0 革命的复兴，JavaScript 实现了巨大的回归，并一直留了了下来。


    # 它是魔法吗？危险吗？


    这取决于你如何使用它。诚然 JavaScript 允许你对 HTML 页面以及用户的浏览器拥有极大的控制权，但它不会导致电脑 崩溃，所以使用它非常安全。


    然而，自 JavaScript 诞生以来，一直存在许多安全漏洞，例如跨站脚本（Cross site Scripting），它允许黑客向用户返回恶意脚本，这些脚本会在用户的浏览器中执行。就像你曾被多次警告不要点击的那些横幅广告一样，此类脚本能做的最坏就是访问存储在你浏览器中的信息，包括存储在
    cookie 中的身份验证详细以及其他类型你不希望别人窥探的数据。


    在这方面，保护的责任在于用户，我们作为体面的人，所能做的最大事情就是永远不要利用 JavaScript 的力量去作邪恶之事——就像任何超级能力一样，在错误的人的手中，它可能会导致灾难！


