  raw: 'While working with functions we know for a fact that we can access variables
    that have been passed to the function. And we can also access variables within
    the function which have been explicitly declared. So in the following example:


    function foo(name){


        var i = 0;


        // do something


    }


    The variable name and the variable i is accessible by code within the function.
    This is defined as Local scope - we say that the variables defined within a function
    have local scope as they are accessible only by code within the function. So in
    the below example:


    function foo(name){


        var i = 12;


        // do something


        document.write(i); // prints the value of i


    }


    document.write(i); // prints nothing


    The local variable is only accessible within the function and not by code outside
    the function. Local variables exist when a function is invoked and are destroyed
    when the function is done with.


    However let’s consider the following example:


    var stuff = 12;


    function foo(name){


        var i = 0;


        // do something


        document.write(stuff); // prints the value of stuff


    }


    How could the function access the variable stuff which was declared outside the
    function? Variables declared out side functions on the page have what is called
    the Global scope. Such variables can be accessed in any function. The variable
    can not only be accessed but also modified by functions as well without having
    to even explictly pass it.


    var stuff = 12;


    function foo(){


        // do something


        stuff = 15;


    }


    foo();


    document.write(stuff); // prints 15


    At the same time you can also declare a global variable from within a function.
    To do so you just have to assign a value toa variable without explicitly declaring
    it using the var command. For example:


    function foo(){


        // do something


        stuff = 15;


    }


    foo();


    document.write(stuff); // prints 15


    In the above example declaring the stuff variable without the var command automatically
    makes it a global variable which is accessible anywhere in the script. One drawback
    of this is that you can pretty much end up modifying a variable without even knowing
    it. So try to make sure that any variables you use are initialized and that your
    variables have descriptive names.


    ## Summary


    *   Functions are blocks of reusable code that can be invoked at will instead
    of having to write the same code again and again.


    *   Functions can accept parameters


    *   By default all parameters of a function can be accepted using the arguments
    array which is automatically passed to every function.


    *   Functions can also return values based on the code executed.


    *   A recursive function is one which calls itself, with recursive functions the
    function invokes itself until a certain condition is evaluated.


    ## Assignment


    #### Exercise 1


    How much do you earn in a day if you work 8 hours? Create a function that takes
    an hourly rate and outputs the amount you would make in a month if you work 8
    hours everyday.


    #### Exercise 2


    In the previous chapter you ran a conditional statement to check if a number entered
    was larger than or greater than 100\. Recreate the functionality with a function.


    # Chapter 6: Arrays - nicely lined up!


    At times you need to work on more than just a single variable. The idea of a single
    variable holding a single value cannot hold true in many rel life examples. A
    carton of eggs may be regarded as a single unit but then again - so is each and
    every egg in the carton. A block of houses might seem like a single unit, but
    each and every single house on that block is also a unit accessible in its own
    right. Very soon you''ll understand that there has to be a better way to collate
    values than assigning them to an individual variable.


    ## Overview


    In this chapter we will touch upon the concept of Arrays and how arrays are implemented
    in JavaScript. We will look at array declarations, the benefits of using arrays
    as well as the various traversal techniques used to go through arrays. During
    this chapter you will be acquainted to the Array object. Through usage of the
    Array Object you will also be introduced to the concept of using Objects in JavaScript.


    ## The concept of arrays


    So far we''ve used variables that would hold a single value. This might have worked
    well for all the examples and situations we''ve come across but practically there
    would be many instances where you would need to access multiple values through
    a single declared variable. Much like the concept of houses - you can consider
    each house on a street accessible by the individual address of the house on that
    street. However you cannot ignore the fact that the street itself provides an
    access to each individual house on it. So your house might have a specific address
    but when you talk about it in reference to the street its on you would say its
    the ''nth'' house on the street.


    This is pretty much how arrays work in programming language. An array is simply
    a variable which contains more than one value. Arrays help i programming when
    you need to collect multiple values that are associated to each other in some
    way and store them for access in a single variable.


    ## Creating Arrays


    Arrays are declared many like variables are and the same restrictions apply to
    declaring arrays as you would apply to variables.


    var gender = [''male'', ''female''];


    In the above example we''ve declared an array called gender using square brackets
    and within the array we''ve stored two values namely ''male'' and ''female''.
    If we didn''t have any arrays we''d have to use variables like this:


    var male_gender = ''male'';


    var female_gender = ''female'';


    It would have gotten very complicated if we''d require more complex examples.
    Like if we had to list down different pets:


    var pet1 = ''dog'';


    var pet2 = ''cat'';


    var pet3 = ''rabbit'';


    var pet4 = ''hamster'';


    var pet5 = ''bird'';


    Pretty messy and using that in code would have been nightmarish to say the least.
    If you had to loop through all the types of pets would you create a variable for
    each pet? Plus what if you had to store not four or five but hundreds of values.
    What if you''re taking values from an external source - you can''t put them all
    in individual variables that is programming suicide! Hurrah for arrays, they allow
    you to store as many values as you wish under a single variable name.


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    When declaring arrays it doesn''t need to be all on one line, line breaks are
    perfectly allowed in declaring arrays so the following is also perfectly fine:


    var pets = [''dog'',


                ''cat'',


                ''rabbit'',


                ''hamster'',


                ''bird''];        // now that is easy to read


    That is awesome but how can we access the values in the array? In an array you
    can access the individual values by referring to an index. The index of the array
    starts from zero meaning the first element in any array in JavaScript is always
    at the index of zero. So keep the above example in mind.


    pets[0]; // equals ''dog''


    pets[1]; // equals ''cat''


    This also means that in an array the last index would equal one less than the
    total number of elements in the array - so in the above example the last element
    of the array which has a total of five elements would be.


    pets[4]; //equals ''bird''


    ## The Array object


    We can declare an array using the square brackets as above listing all of the
    individual elements.


    Alternatively we can also declare an array making use of the new Array syntax.


    var pets = new Array();


    The above code creates an array in the same way as the previous example did. The
    only differance is that we''ve used the keyword new to create a a new array Object
    from the JavaScript Array Class. We''ll talk more about classes and Objects in
    the next chapter. To understand this a bit we must know that a class in programming
    is code that defines an Object. An Object is an instance of code that has defined
    a class. Objects have functions and variables called methods and properties respectively.'
