    JavaScript provides one conditional operator which makes an assignment based upon
    a simple decision. This is the ?: operator. To understand check the following
    example:


    var a = 10;


    var b = (a == 10 ? 12 : 0); // b is assigned 12


    The above statement reads if a is equal to 10 then return the value 12 else the
    value 0\. Since a is equal to 10 then the variable b is assigned the value of
    12\. This is a very handy shortcut for making assignments based upon a single
    statement. You can make the statements as complex as you wish for example:


