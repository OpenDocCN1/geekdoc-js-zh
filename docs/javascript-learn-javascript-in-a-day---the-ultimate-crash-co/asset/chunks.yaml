    Along with the sort command JavaScript also provides the reverse function to totally
    reverse the order of elements in the array.


    var pets = [''dog'', ''cat'', ''hamster'', ''bird'', ''rabbit'', ''turtle'', ''goldfish''];


    pets.sort() // equals now [''bird'', ''cat'', ''dog'', ''goldfish'',''hamster'',
    ''rabbit'', ''turtle'' ];


    pets.reverse() // equals now [ ''turtle'',''rabbit'',''hamster'',''goldfish'',''dog'',
    ''cat'', ''bird''];


    This works pretty awesome lets try it with an array that has numerical values:


    var a = [10, 3, 2];


    a.sort() // equals now [10, 2, 3]; huh?


    How did that happen? Does the sort function not know how to count? The sort function
    actually sorts alphabetically treating all the elements of the array as a string
