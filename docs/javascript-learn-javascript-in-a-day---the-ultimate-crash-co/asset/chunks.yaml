  trans: "\n这种方法可行，但非要编写四个不同的条件语句来检查每一种可能性似乎有点疯狂。实现这一点的更简单的方法是将你的 `if - else` 语句嵌套彼此内部。就像任何代码一样，你也可以嵌套\
    \ `if - else` 语句。例如，上面的代码可以重写为：\n\n```javascript\nvar number_of_eggs = 10;\nvar\
    \ eggs_are = 'fresh';\n\nif(number_of_eggs == 10){\n  if(eggs_are == 'fresh'){\n\
    \    // do something\n  }else{\n    // do something\n  }\n}else{\n  if(eggs_are\
    \ == 'fresh'){\n    // do something\n  }else{\n    // do something\n  }\n}\n```\n\
    \n还不错，我们有一个语句检查一个条件，进一步的条件在语句内部进行检查。虽然在上面的示例中，你可能会注意到嵌套的 `if` 语句出现了重复。当我们稍后的章节中学习函数时，这个问题将会得到解决。但目前，你只需要理解嵌套条件语句是如何工作的。\n\
    \n此时此时，你可能会好奇，既然可以在不使用 `else` 语句的情况下完成上述操作，为什么我们还需要使用 `else` 语句呢？上面的代码完全可以写如下：\n\
    \n```javascript\nvar number_of_eggs = 10;\nvar eggs_are = 'fresh';\n\nif(number_of_eggs\
    \ == 10){\n  if(eggs_are == 'fresh'){\n    // do something\n  }\n  if(eggs_are\
    \ != 'fresh'){\n    // do something\n  }\n}\n\nif(number_of_eggs != 10){\n  if(eggs_are\
    \ == 'fresh'){\n    // do something\n  }\n  if(eggs_are != 'fresh'){\n    // do\
    \ something\n  }\n}\n```\n\n表面上上面的方法运行完美良好，但这种方法存在一个问题。当一个 `If` 语句评估为真时，只有该 `IF`\
    \ 语句中的代码会被执行，而后续 `else` 块中的相应代码将不会执行。这样一来，你只需要检查一次 `IF` 语句中的表达式是否有效，而不需要再次检查它以确保它为假。在上面的示例中，你将至少运行\
    \ 4 个比较表达式，而与前一个带有 `else` 语句的只有 2 个相比。随着你的应用程序增长，这在性能方面会产生巨大的差异。\n\n记住 - `else`\
    \ 是你的朋友！\n\n## 条件 switch 语句\n\n随着你的条件语句变得越来越复杂，你将想要不仅仅是 `if else` 语句。当你需要检查变量的几个可能值或几个表达式时，`if`\
    \ 和 `else` 语句运行良好。但当你需要检查一个变量的许多可能值时该怎么办？我们讨论的不是检查变量是否为真、假或为空。如果你要检查变量是否为 1 到\
    \ 10 之间的任何数字呢？假设你有一组错误代码，并希望为每个代码显示不同的消息。使用 `If` 语句，你可能需要编写如下内容：\n\n```javascript\n\
    var code = 101;\n\nif(code == 100){\n    // do something\n}else if(code == 101){\n\
    \    // do something\n}else if(code == 102){\n    // do something\n}else if(code\
    \ == 103){\n    // do something\n}else if(code == 104){\n    // do something\n\
    }else if(code == 105){\n    // do something\n}else if(code == 105){\n    // do\
    \ something\n}else if(code == 106){\n    // do something\n}else{\n    // do something\n\
    }\n```\n\n这是检查多一个可能值的一种相当有效的方法，但 JavaScript 允许使用更简单的语法来实现相同的需求，尽管这种方式没那么痛苦。\n\n\
    向 `switch` 语句打个招呼吧。\n\n`switch` 语句的作用与上述 `if` 语句完全相同，只是代码开销更小，即：不需要写那么多的代码和括号。典型的\
    \ `switch` 语句的语法如下：\n\n```javascript\nswitch(variable){\n  case value:\n  break\n\
    \  default:\n  break;\n}\n```\n\n上面的代码可以重写为 `switch` 语句，如下：\n\n```javascript\n\
    var code = 101;\nswitch(code){\n    case 100:\n        // do something\n    break;\n\
    \    case 101:\n        // do something\n    break;\n    case 102:\n        //\
    \ do something\n    break;\n    case 103:\n        // do something\n    break;\n\
    \    case 104:\n        // do something\n    break;\n    case 105:\n        //\
    \ do something\n    break;\n    case 106:\n        // do something\n    break;\n\
    \    default:\n        // do something\n    break;\n}\n```\n\n这绝对更清晰、更易读。对于你想要检查的每个值，你都用\
    \ `case` 语句进行检查。最后的 `default` 语句类似于上一个示例中最后的 `else` 语句，当变量没有匹配所有 `case` 时，就会运行该代码。JavaScript\
    \ 中的 `break` 语句（特别是当用于 `switch` 语句时）可以跳出代码块。`switch` 语句比之前的 `if` 语句高效的地方在于，在 `switch`\
    \ 语句中表达式只评估一次，而在 `if` 语句中它在任何情况下都会评估。\n\n这里是 `switch` 语句的一种变体，假设当 `code` 值为 101、102\
    \ 和 105 时，你想执行相同的代码。`switch` 语句可以重写为：\n\n```javascript\nvar code = 101;\nswitch(code){\n\
    \  case 100:\n      // do something\n  break;\n  case 101:\n  case 102:\n  case\
    \ 105:\n      // do something\n  break;\n  case 103:\n      // do something\n\
    \  break;\n  case 104:\n      // do something\n  break;\n  case 106:\n      //\
    \ do something\n  break;\n  default:\n      // do something\n  break;\n}\n```\n\
    \n在上面的示例中，我们从 101、102 和 105 语句中排除了 `break` 语句，这确保了当变量匹配其中任何一个值时都会运行代码块。当你需要在多种情况下运行相同的代码时，你就不需要在不同的\
    \ `case` 语句中重复。\n\n## 当你必须做出复杂的决策时\n\n条件语句对于根据条件运行代码非常有帮助。在编程中，你经常遇到某些条件比其他条件更复杂的情况。此类情况可能需要大量使用条件语句，甚至结合\
    \ `switch` 和 `if else` 语句。例如，想象一种你需要检查不同的错误代码，并根据用户是管理员还是访问者来决定是否向用户发送电子邮件或输出警告。你可以在\
    \ switch case 块中使用 `if-else` 语句。看看下面的示例。\n\n```javascript\nvar code = 101;\nvar\
    \ user_role = 'admin';\nswitch(code){\n    case 100:\n        // do something\n\
    \        if(user_role == 'admin'){\n          // do something\n        }else{\n\
    \          // do something\n        }\n    break;\n    case 101:\n    case 102:\n\
    \    case 105:\n        // do something\n        switch(user_role){\n        \
    \    case 'admin':\n              // do something\n            break;\n      \
    \      case 'visitor':\n              // do something else\n            break;\n\
    \        }\n    break;\n    default:\n        // do something\n    break;\n}\n\
    ```\n\n## 让我们来点披萨\n\n谁想吃披萨？开开玩笑的——让我们写一个简单的脚本，来模拟点披萨的过程。我们都熟悉最喜欢的快餐外卖，所以过程非常直接。\n"
- fmt: "\nFirst lets decide what kind of crust do we want. We'll ask the user for\
    \ the kind of crust he wants.\n\n```\nvar crust = prompt('What kind of crust do\
    \ you want - thin or regular?');\n```\n\nThe user gets to enter the kind of crust\
    \ he wants - but wait what if he enters something we don't have? We need to check\
    \ the crust entered.\n\n```javascript\nvar crust = prompt('What kind of crust\
    \ do you want - thin or regular?');\n\nif((crust == 'thin') || (crust=='regular')){\n\
    \    var cheese = prompt('Choose your cheese?');\n    switch(cheese){\n      \
    \  case 'mozarella':\n        case 'feta':\n        case 'parmesan':\n       \
    \ case 'cheddar':\n        break;\n        default:\n            alert('Sorry\
    \ we do not have that kind of cheese.');\n        break;\n    }\n}else{\n    alert('Sorry\
    \ we do not serve that kind of crust here.');\n}\n```\n\nPretty sweet, now lets\
    \ assume that if he wants cheddar cheese, he can have a tomatoe sauce based Pizza,\
    \ else if chooses any other cheese he would have a white parmesan sauce based\
    \ Pizza.\n\n```javascript\nvar crust = prompt('What kind of crust do you want\
    \ - thin or regular?');\nvar sauce; // we initialized a sauce variable\n\nif((crust\
    \ == 'thin') || (crust=='regular')){\n    var cheese = prompt('Choose your cheese?');\n\
    \    switch(cheese){\n        case 'mozarella':\n        case 'feta':\n      \
    \  case 'parmesan':\n            sauce = 'tomato';\n        break;\n        case\
    \ 'cheddar':\n            sauce = 'white';\n        break;\n        default:\n\
    \            alert('Sorry we do not have that kind of cheese.');\n        break;\n\
    \    }\n}else{\n    alert('Sorry we do not serve that kind of crust here.');\n\
    }\n```\n\nNow that is done - lets output the details of the Pizza he ordered.\n\
    \n```javascript\nvar crust = prompt('What kind of crust do you want - thin or\
    \ regular?');\nvar sauce; // we initialized a sauce variable\n\nif((crust == 'thin')\
    \ || (crust=='regular')){\n    var cheese = prompt('Choose your cheese?');\n \
    \   switch(cheese){\n        case 'mozarella':\n        case 'feta':\n       \
    \ case 'parmesan':\n            sauce = 'tomato';\n        break;\n        case\
    \ 'cheddar':\n            sauce = 'white';\n        break;\n        default:\n\
    \            alert('Sorry we do not have that kind of cheese.');\n        break;\n\
    \    }\n    alert('You ordered a Pizza with '+crust+' crust, '+ cheese + ' cheese\
    \ and '+sauce+' sauce');\n}else{\n    alert('Sorry we do not serve that kind of\
    \ crust here.');\n}\n```\n\nRun the code and it seems fine, but wait something\
    \ is wrong. If you enter the wrong kind of cheese you still get an alert that\
    \ tells you what kind of Pizza you ordered without the sauce. We need to put a\
    \ check here to make sure that only to output the details of the ordered pizza\
    \ if the sauce is entered with a valid entry. For this let’s change the code a\
    \ bit and assign the sauce variable a value when the wrong sauce has been entered\
    \ and run a check before we output the correct entries.\n\n```javascript\nvar\
    \ crust = prompt('What kind of crust do you want - thin or regular?');\nvar sauce\
    \ = -1; // we initialized a sauce variable with a default value to check against\n\
    if((crust == 'thin') || (crust=='regular')){\n    var cheese = prompt('Choose\
    \ your cheese?');\n    switch(cheese){\n        case 'mozarella':\n        case\
    \ 'feta':\n        case 'parmesan':\n            sauce = 'tomato';\n        break;\n\
    \        case 'cheddar':\n            sauce = 'white';\n        break;\n     \
    \   default:\n            alert('Sorry we do not have that kind of cheese.');\n\
    \        break;\n    }\n    if(sauce!=-1){as long as the sauce variable isn't\
    \ -1 we can assume all correct values were entered\n        alert('You ordered\
    \ a Pizza with '+crust+' crust, '+ cheese + ' cheese and '+sauce+' sauce');\n\
    \    }\n}else{\n    alert('Sorry we do not serve that kind of crust here.');\n\
    }\n```\n\nNow that is better, you can now see how in a real example with a few\
    \ simple conditional statements how we were able to control the flow of a script\
    \ based upon input. As we proceed, we'll work with more complex problems and work\
    \ out them.\n\n## Summary\n\n- We learnt the concept of conditional statements\
    \ as well as how JavaScript evaluates them.\n- We understood that an expression\
    \ has to evaluate to true in order for a conditional statement to be evaluated.\n\
    - We learnt about `if` and `else` statement as well as how conditional statements\
    \ can be nested.\n- An alternative to complex `if` statements are the `switch`\
    \ and `case` statement which allows checking a single variable for multiple values.\n\
    \n## Assignment\n\n### Exercise 1\nWrite a script that checks if an integer variable\
    \ is bigger or less than 100. It should output the result. So if the number 60\
    \ is checked, the output should say '60 is less than 100'. Take the variable from\
    \ the user using the `prompt` command.\n\n### Exercise 2\nExpand on the Pizza\
    \ example above. Have the user also input their choice of sauce using a `prompt`\
    \ command. User first chooses his choice of crust, then his choice of cheese,\
    \ and then he should enter his choice of sauce. Check against the sauces 'white\
    \ pesto', 'Signature tomato', 'cheesy garlic', 'caeser dressing' and 'pasta sauce'.\
    \ Use a `switch` statement.\n\n# Chapter 4: Do it once then repeat - loops\n\n\
    During development, many a time you would come across situations where you'll\
    \ need to repeat the same block of code or at least have to make references to\
    \ the same bit of code over and again. For example you might want to initialize\
    \ 10 variables with the same number or in a sequence however having to type out\
    \ 10 different declarations and assignments is repetitive and it defeats the purpose\
    \ of having to use a programming language in the first place.\n\nAll programming\
    \ languages come with innate facility to repeat blocks of code that you would\
    \ otherwise have to manually write out the number of times you would want to have\
    \ them repeated. JavaScript is no different and it also comes with its own set\
    \ of 'loop' statements as they are called to make repeated occurrences of code\
    \ blocks as you would require.\n\n## Overview\n\nIn this chapter we would introduce\
    \ you to the concept of looping in JavaScript. You would be acquainted with the\
    \ different loop statements such as the `for` loop, `while` loop as well as the\
    \ `do...while` loop. You would understand the differences in these loop statements\
    \ as well as the practical implications of their differences and touch upon some\
    \ examples.\n\n## A world without loop statements\n\nThink a world without photocopy\
    \ machines, or cupcake holders - no two cupcakes would ever look the same. It\
    \ would be catastrophic in a way. When it comes to programming, imagine a situation\
    \ where you need to output some text 100 times. Lets assume you've been punished\
    \ for driving in a no driving zone(whatever that is) and you have to write out\
    \ 1000 times 'I will not drive in a no driving zone'. You've been allowed the\
    \ use of JavaScript during the course of your punishment (don't ask just assume)\
    \ and you can't copy paste anything. You could do it the insanely wrong and mindless\
    \ way of having to write out a `document.write` statement 1000 times as so...\n\
    \n```\ndocument.write('I will not drive in a no driving zone.<br/>');\ndocument.write('I\
    \ will not drive in a no driving zone.<br/>');\ndocument.write('I will not drive\
    \ in a no driving zone.<br/>');\ndocument.write('I will not drive in a no driving\
    \ zone.<br/>');\ndocument.write('I will not drive in a no driving zone.<br/>');\n\
    document.write('I will not drive in a no driving zone.<br/>');\ndocument.write('I\
    \ will not drive in a no driving zone.<br/>');\n\n// this will take forever\n\
    ```\n\nOr better yet you could have the programming language do it for you. Loops\
    \ are an integral part of all programming languages such that they allow you to\
    \ execute a block of code repeatedly for a set number of times or until a specific\
    \ condition is met.\n"
