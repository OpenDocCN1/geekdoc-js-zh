    # Chapter 4: Do it once then repeat - loops


    During development, many a time you would come across situations where you''ll
    need to repeat the same block of code or at least have to make refernces to the
    same bit of code over an over again. For example you might want to initialise
    10 variables with the same number or in a sequence however having to type out
    10 different declarations and assignments is repetitive and it defeats the purpose
    of having to use a programming language in the first place.


    All programming languages come with the inate facility to repeat blocks of code
    that you would otherwise have to manually write out the number of times you would
    want to have them repeated. JavaScript is no different and it also comes with
    its own set of ''loop'' statements as they are called to make repeated recurrances
    of code blocks as you would require.


    ## Overview


    In this chapter we would introduce you to the concept of looping in JavaScript.
    You would be acquainted with the different loop statements such as the for loop,
    while loop as well as the do, while loop. You would understand the differences
    in these loop statements as well as the practical implications of their differences
    and touch upon some examples.


    ## A world without loop statements


    Think a world without photocopy machines, or cupcake holders - no two cupcakes
    would ever look the same. It would be catastrophic in a way. When it comes to
    programming, imagine a situation where you need to output some text a 100 times.
    Lets assume you''ve been punished for driving in a no driving zone(whatever that
    is) and you have to write out 1000 times ''I will not drive in a no driving zone''.
    You''ve been allowed the use of JavaScript during the course of your punishment
    (don''t ask just assume) and you can''t copy paste anything. You could do it the
    insanely wrong and mindless way of having to write out a document.write statement
    1000 times as so...


    document.write(''I will not drive in a no driving zone.<br/>'');


    document.write(''I will not drive in a no driving zone.<br/>'');


    document.write(''I will not drive in a no driving zone.<br/>'');


    document.write(''I will not drive in a no driving zone.<br/>'');


    document.write(''I will not drive in a no driving zone.<br/>'');


    document.write(''I will not drive in a no driving zone.<br/>'');


    document.write(''I will not drive in a no driving zone.<br/>'');


    // this will take forever


    Or better yet you could have the programming language do it for you. Meet the
    loop statement! Loops are an integral part of all programming languages such that
    they allow you to execute a block of code repeatedly for a set number of times
    or until a specific condition is met.'
