    \ JavaScript 原生的，取决于你如何使用，它们非常有用或非常烦人。\n\n#### Alert - 每个人都讨厌\n\n这是一个非常简单的函数，会弹出一个你可以传递消息的警告框。语法非常简单：\n\
    \n```javascript\nalert('Hello there!');\n```\n\n这应该弹出一个带有 'Hello there!' 消息的警告框和一个关闭按钮。虽然这是一个\
    \ JavaScript 原生函数，但我们将在后续示例中多次使用。但在实际环境中，你最好避免过多使用它，因为它对用户来说是一种困扰。\n\n#### Confirm\
    \ - 今天你想做什么？\n\n更有用的函数之一——`confirm` 命令实际上会弹出一个确认框，让用户选择点击是或 否。这对于快速获取用户的确认很有用。这里有一个简单的示例：\n\
    \n```javascript\nif(confirm('我可以说是吗?')== true){\n  document.write('Yes');\n}else{\n\
    \  document.write('No');\n}\n```\n\n运行此将弹出一个带有传递消息的确认框。点击 `OK` 将运行 If 语句中的代码块并输出\
    \ Yes，而点击 `cancel` 则相反。确认函数在用户确认时返回 true，否则返回 false。\n\n"
- fmt: "\nThis command is used to actually get some user input from the user. Running\
    \ this opens up a prompt box where the user is 'prompted' to enter some information.\
    \ For example:\n\n```javascript\nvar name = prompt('What is your name?');\n\n\
    if(name != ''){\n  document.write('Hello ' + name);\n}else{\n  document.write('You\
    \ didn\\'t enter your name!');\n}\n```\n\nThe above code prompts the user to enter\
    \ his name, the entry from the user is taken in the `name` variable. This is a\
    \ very simple example of interaction from the user and the application responding\
    \ to client interaction.\n\n## Summary\n\nWe've covered a lot of ground here and\
    \ have gone over:\n\n* Variables, the different types of variables that JavaScript\
    \ supports\n* Assignment operators\n* Arithmetic operators\n* Logical Operators\n\
    * Conditional Operators\n\n# Chapter 3: Conditions conditions and more conditions\n\
    \nIn the last chapter we touched upon the different variable types as well as\
    \ the core syntax for constructing an expression in JavaScript. We should be able\
    \ to make use of the basic operators to conduct mathematical and logical evaluations.\
    \ But coding is more than just fancy arithmetic and logical dribble. Just like\
    \ in life, everything doesn't move in a straight line, the same applies to coding\
    \ - you need to almost make make room for a detour or exception.\n\n## Objectives\n\
    \nIn this chapter you will learn about the various conditional statements used\
    \ in JavaScript to execute code based on specific conditions. The conditions would\
    \ make use of operators learnt in the previous chapter. We'll touch upon the different\
    \ conditional statements and make use of a real life practical application to\
    \ understand their usage.\n\n## The - IF - condition\n\nThe most basic and fundamental\
    \ conditional statement you can use in JavaScript. There is no piece of code on\
    \ earth that doesn't involve an IF statement at some point. The If statement is\
    \ construed as follows:\n\n```javascript\nif(expression){ // if expression evaluates\
    \ to true run the code in brackets\n  //code here\n}\n```\n\nThe if statement\
    \ checks if an expression is true and then executes the code in the enclosed brackets.\
    \ This is similar to the conditional operator that we used in the previous chapter\
    \ only its a bit more readable. Here is an example of an if statement\n\n```javascript\n\
    var a = 10;\n\nif(a == 10){\n    document.write('Booyah');\n}\n```\n\nThe above\
    \ code checks if the statement `a==10` evaluates to true, which it does and then\
    \ prints out the word `Booyah`. The If statement can check more than one expression\
    \ at the same time.\n\n```javascript\nvar a = 10, b = 12;\n\nif((a == 10)&&(b==12)){\
    \      // evaluates true so the code is executed\n    document.write('Booyah');\n\
    }\n\nif((a > 1)&&(b<12)){  // evaluates as false\n    document.write('Booyah Again');\
    \ // this is never printed\n}\n```\n\nAs we learnt earlier on the usage of logical\
    \ operators, we can now see their practical applications in the conditional statement.\
