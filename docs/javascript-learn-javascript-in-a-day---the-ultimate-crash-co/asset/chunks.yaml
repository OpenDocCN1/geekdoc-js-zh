  trans: "\n我们将涉及面向对象编程（Object Oriented Programming）的基本概念、对象的构成以及面向对象方法的好处。我们还将理解\
    \ JavaScript 如何处理对象（Objects），并意识到我们在此之前一直在使用的对象。在本章中，我们将构建一个简单的对象来阐明面向对象编程的概念。请注意，本章并不旨在成为一门完整的面向对象开发课程，因为面向对象开发的范围非常广泛，本书无法进行全面涵盖。因此，我们将局限于基础的用法和对核心概念的理解。\n\
    \n# 什么是对象？\n\n从字面上说，存在的所有几乎一切都是对象。让我们先不要考虑编程，而是从周围的一切来思考。汽车是一个对象，它有特定的属性和某些功能。同样，你的计算机是一个对象，它具有某些属性并可以执行特定的功能。同样的你的手机、烤面包机、三明治机、电视等等。通俗地说，这些都是对象（Objects）。\n\
    \n这如何转化为编程逻辑呢？到目前为止，我们一直使用函数和变量进行开发。然而，正如现实生活中一样，所有对象执行的功能都与其直接相关。汽车有发动机并能移动，它不是用来烤三明治的。同样，你不会通过和烤面包机聊天来预测天气。在编程术语中，将对象看作一个特殊的代码块，它具有属性和方法，或者在这种情况下，是变量和函数。\n\
    \n在使用对象之前，你需要先创建一个。要创建一个对象，我们需要定义所谓的“类”（class）。\n\n# 类和对象。它们有什么区别？\n\n简单直白地说，对象是类的实例（instance）。类可以被看作制造对象的蓝图。它是一个带有函数和属性的代码块。当你定义一个类，然后从该类创建一个对象时，该对象就获得了它自己的一套属性和方法。把它想象成一个生产汽车的工厂。制造汽车的蓝图可以认为是类，而生产出来的每一辆汽车都是该类的实例。不要担心，创建对象不需要你去建造一个工厂，但你需要一个蓝图，即类。\n\
    \n有趣的是，我们一直以来使用了许多对象和类，甚至完全不知道。回想上一章关于数组的章节，我们使用以下语句创建了一个数组：\n\n```\nvar a = new\
    \ Array();\n```\n\n在上面的示例中，`Array` 是一个定义了数组对象的 JavaScript 类。`new` 关键字创建了 `Array`\
    \ 类的实例。因此，在上面的示例中，变量 `a` 是类 `Array` 的对象，因此它拥有 `Array` 类的所有方法和属性。就像按照蓝图建造的每辆汽车都有自己的一套四个轮子和引擎一样。\n\
    \n我们在上一章中也使用了数组对象的方法。我们使用的一些方法包括：\n\n```javascriptvar a = new Array();\na.sort();\n\
    a.join(',');\na.shift();\n```\n\n不仅如此，我们还利用了数组对象的属性，即：\n\n```javascript\nvar a\
    \ = new Array();\na.length // length 属性\n```\n\n方法和属性定义在类内部，并可以从类的对象进行访问。这正是我们在前面的章节中所做的。甚至在此之前，我们已经使用了一个从第一章起就可用的对象。`document`\
    \ 对象：\n\n```javascript\ndocument.write('hi');\n```\n\n注意，`document` 对象是 JavaScript\
    \ 中提供的一个对象，它不是一个类而是一个对象，它指的是浏览器中的页面。我们使用的 `write` 方法是 `document` 对象的方法。事情开始变得清晰了。我们已经略微体验了如何使用对象，以及我们已经使用对象很长时间了。让我们开始理解它们是如何工作的，以及我们如何创建自己的对象。\n\
    \n# 一个简单的对象\n\n让我们创建我们的第一个对象。在 JavaScript 中创建对象非常简单。\n\n```javascript\nvar dog\
    \ = { name:'Fido', breed:'Bulldog', age:2};\n```\n\n这看起来有点像声明数组。主要的区别在于，在最简单的形式，对象技术上是一个非数字索引的数组。数组只有数字索引，而对象不是数字索引的。看起来像索引的东西实际上被称为“属性”（properties）？上面的示例也可以分成几行——换行不会影响对象。\n\
    \n```javascript\nvar dog = {\n    name:'Fido',\n    breed:'Bulldog',\n    age:2\n\
    };\ndog.name; // 等于 Fido\ndog.breed; // 等于 Bulldog\n```\n\n创建对象的另一种方法是使用 JavaScript\
    \ 的 `new` 关键字创建一个新的 `Object`。\n\n```javascript\nvar dog = new Object();\ndog.name\
    \ ='Fido';\ndog.breed ='Bulldog';\ndog.age = 2;\n```\n\n上面的代码与之前的示例相同。尽管对于简单的对象，之前的示例更容易读，并且是声明简单对象的首选方法。\n\
    \n声明对象的另一种方法是使用 JavaScript 中称为“对象构造函数”（Object constructor）或在面向对象术语中等类的类。这是一种特殊的声明，允许你定义一个蓝图，用于定义从它创建的所有对象。例如，在上面的示例中，我们为单只狗声明了一个对象。如果我们想为多只狗声明相同的内容呢？我们可以显式地为每一个狗对象使用相同的声明。\n\
    \n```javascript\nvar dog1 = { name:'Fido', breed:'Bulldog', age:2};\nvar dog2\
    \ = { name:'Rover', breed:'Wolfhound', age:2};\nvar dog3 = { name:'Butch', breed:'Dash',\
    \ age:2};\nvar dog4 = { name:'Mitch', breed:'Sheepdog', age:2};\nvar dog5 = {\
    \ name:'Bowser', breed:'Alsatian', age:2};\n```\n\n那样是非常冗余且容易出错的。我们在这里创建相同类型的对象——因此使用对象构造函数或定义对象蓝图的类是有意义的。在这种情况下，类构造函数会定义好\
    \ name、breed 和 age 属性，这样我们每次创建狗对象时不需要显式地定义它们。让我们看一个演示。\n\n```javascript\nfunction\
    \ dog(name, breed, age) {\n    this.name = name;\n    this.breed = breed;\n  \
    \  this.age = age;\n}\n\nvar fido = new dog(\"Fido\", \"Bulldog\", 3);\nvar rover\
    \ = new dog(\"Rover\", \"Wolfhound\", 2);\n```\n\n那里发生了很多，但我们可以清楚地看到使用我们的对象构造函数\
    \ `dog` 创建新对象要容易得多。这种函数被称为构造函数，因为它在对象的“构造”时创建并初始化了属性。你还注意到名为 `this` 的关键字。`this`\
    \ 关键字在对象的上下文中使用。它只在类定义内部使用，并引用对象本身。\n\n它在对象创建时产生。因此，`this.name` 是使用上述类构造函数创建对象的\
    \ name 变量。在上面的示例中，你可以看到 `this.name` 和传递给构造函数的 `name` 之间的区别，`this.name` 指向对象的 name\
    \ 实例。以这种方式创建对象时，我们可以像访问之前创建的对象属性的方式一样访问属性。\n\n```javascript\nvar fido = new dog(\"\
    Fido\", \"Bulldog\", 3);\nfido.name; // 等于 'Fido'\n```\n\n使用对象构造函数，你可以根据对象构造函数定义的类型创建任意数量的对象。\n\
    \n你也可以在创建对象后创建对象属性。这是通过简单地为对象本身分配新值来实现：\n\n```javascript\nvar fido = new dog(\"\
    Fido\", \"Bulldog\", 3);\nfido.gender = 'male';\n```\n\n这对 JavaScript 既是幸运也是不幸，因为你有随心所欲编辑对象的权力，但如果你的对象可以被轻易操控，确实会变得复杂。\n"
- fmt: "\nWith Objects as above you can also loop through the properties using the\
    \ `for..in` loop as discussed earlier in arrays. Note that Objects are very much\
    \ like complex arrays except that they aren't indexed by numerical values:\n\n\
    ```javascript\nfor(i in fido){\n    document.write(i + ':' + fido[i] + '<br />');\n\
    }\n```\n\nThe above example loops through all the properties of the object and\
    \ prints out the property name and the value of the property.\n\nJust as with\
    \ arrays you can also delete a property from an Object using the `delete` function.\
    \ However unlike arrays where using the `delete` function leaves a hole in the\
    \ array, with objects the `delete` function removes the property in its entirety\
    \ from the object itself - no holes here. After deleting a property you cannot\
    \ refer to it without creating it again.\n\n```javascript\nvar fido = new dog(\"\
    Fido\", \"Bulldog\", 3);\n\ndelete(fido.name); // now fido has no name\n\nfido.name\
    \ = 'Butch'; // Fido is now named butch\n```\n\n### Object do this - adding methods\n\
    \nIt’s not just properties but you can also assign functions known as methods\
    \ to objects. A method is declared in the same way for an object as is a property.\
    \ Let’s look at a simple example below:\n\n```javascript\nfunction dog(name, breed,\
    \ age) {\n    this.name = name;\n    this.breed = breed;\n    this.age = age;\n\
    \    this.feed = function(food){\n        document.write(this.name + ' likes '\
    \ + food);\n    }\n}\n\nvar fido = new dog(\"Fido\", \"Bulldog\", 3);\n\nfido.feed('kibbles');\
    \ // prints out 'Fido likes kibbles'\n```\n\nIn the above example we declared\
    \ a method `feed`, passed it a variable and even invoked it from the Object that\
    \ was created. The above example also shows how in a function you can refer to\
    \ the properties of the object using the `this` keyword. At the same time we can\
    \ also make reference to external objects within the function itself like how\
    \ we called the `document.write` method of the `document` object. Using methods\
    \ we can also edit the underlying properties of the object as well. Here is an\
    \ example:\n\n```javascript\nfunction dog(name, breed, age) {\n    this.name =\
    \ name;\n    this.breed = breed;\n    this.age = age;\n    this.addAge = function(years){\n\
    \        this.age+=years;\n    }\n}\n\nvar fido = new dog(\"Fido\", \"Bulldog\"\
    , 3);\nvar rover = new dog(\"Rover\", \"Sheepdog\", 4);\n\nfido.addAge(3);\nrover.addAge(5);\n\
    \nfido.age; // equals 6\nrover.age; // equals 9\n```\n\nWe created two objects\
    \ and made a method that incremented the age property of the individual objects.\
    \ You can see that both objects have their own distinct properties and methods.\
    \ Properties and methods are unique to each object created from the same constructor\
    \ class. Already you can see the versatility we have with regards to using Objects\
    \ and how Object Oriented development actually works. All associated code and\
    \ properties are collated within the same Object. Without Objects your code would\
    \ be a mess of variables and functions and you'd be struggling to try and keep\
    \ values that were associated with each other together or associated in some way.\
    \ Consider the following nightmare if we had to do the above without Objects:\n\
    \n```javascript\nvar fido_name    = 'Fido';\nvar fido_breed   = 'Bulldog';\nvar\
    \ fido_age     = 3;\nvar rover_name   = 'Rover';\nvar rover_breed = 'Sheepdog';\n\
    var rover_age   = 5;\n// Please no more\n```\n\nObjects make programming meaningful\
    \ again\n\n## Everything is an object\n\nWith JavaScript almost everything is\
    \ an `Object`. JavaScript provides a host of default `Object` types which we use\
    \ in our day to day programming. When we say everything we mean practically everything.\
    \ The variables you've been creating, the functions and arrays - everything is\
    \ an `Object` and is treated like one. When we say treated like one we mean that\
    \ all such Objects have their own properties and methods. We didn't define them\
    \ - because JavaScript has already predefined most of them for us(Isn't that so\
    \ nice of JavaScript to do that).\n\n## Objects native to JavaScript\n\nJust like\
    \ the `Array` Object as well as the `Object` object JavaScript has defined constructors\
    \ for numerous Objects. Most of which we've been using all this time such as:\n\
    \n*   Numbers\n*   Strings\n*   Dates\n*   Objects\n*   Arrays\n*   Functions\n\
    *   Dates\n\nSome of these objects map to primitive datatypes which we have been\
    \ using this time. For example let’s look at numbers. What does the below code\
    \ do:\n\n```javascript\nvar a = 10;\n```\n\nIf you said it assigns the variable\
    \ `a` with the number `10` you're absolutely right. However you can also declare\
    \ it as a number Object using the JavaScript `Number` constructor:\n\n```javascript\n\
    var a = new Number(10);\n```\n\nHow this is different from declaring a primitive\
    \ variable is that when you declare a variable you just declare a variable but\
    \ when you declare it as an Object of the `Number` constructor as-this is-different-from-declaring-a-primitive-variable-because-when-you-declare-it-as-an-Object-of-the-Number-constructor...\
    \ (Wait, I'll stick to the text flow). \n\nHow this is different from declaring\
    \ a primitive variable is that when you declare a variable you just declare a\
    \ variable but when you declare it as an Object of the `Number` constructor as-this-is-different...\
