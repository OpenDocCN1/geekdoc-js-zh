    \ variables are of the same value and type. For example in JavaScript the values\
    \ `10` and the values `'10'` might be of a similar value but are definitely not\
    \ the same type as the latter is a string type because it is enclosed in quotes\
    \ and the former is an integer.\n\n```javascript\nvar a = 10; // a is now assigned\
    \ the numerical value 10\nvar b = '10'; // b is now assigned the a string value\
    \ '10'\na == b;    // returns true\na === b;    // returns false\nvar a = '10';\
    \ // a is now assigned the a string value '10'\nb === c; // returns true\n```\n\
    \n### (!=) Not Equal to, (!==) Not Equal to in type and value\n\nWhen it comes\
    \ to the comparison operators when the first `=` sign is replaced with a the Exclamation\
    \ mark `!` symbol, it denotes the opposite of what the original operator was intended\
    \ for. So `==` when it becomes `!=` now compares for variables that are not equal\
    \ to each other while `!==` checks for variables that are not equal to each other\
    \ in terms of value as well as type, because sometimes equality is not what you're\
    \ looking for.\n\n```javascript\nvar a = 10; // a is now assigned the numerical\
    \ value 10\nvar b = '10'; // b is now assigned the a string value '10'\na != 10;\
    \    // returns false\na != 15;    // returns true\na === b;    // returns false\n\
    a !== b;    // returns true\n```\n\n### (>/<) The greater than and less than Operators\n\
    \nIn basic mathematics you're probably aware of the `>` greater than and the `<`\
    \ less than symbols, which check if variables on either side of the symbol are\
    \ of greater or lesser values. They work pretty much the same way in JavaScript.\
    \ Note that in JavaScript comparing a string with a numeric value such as `'10'`\
    \ with a number using the above operators is perfectly allowed.\n\n```javascript\n\
    var a = 10, b = '10';\na > 5;    // returns true\na < 5;    // returns false\n\
    a > '5';    // returns true\na < b;    // returns false\n```\n\n### (>=/<=) -\
    \ Greater than or equal to / Less than or equal to\n\nFollowing on from primary\
    \ arithmetic, the `>=` greater than and equal to operator as well as the `<=`\
    \ less than or equal to operator does exactly as their name sake.\n\n```javascript\n\
    var a = 10, b = '10';\na >= 5;    // returns true\na >= 10;    // returns true\n\
    a <= 10;    // returns true\na <= 11;    // returns true\na >= b;    // returns\
    \ true\na <= b;    // returns true\n```\n\n### Logical Operators\n\nLogical operators\
    \ always return a Boolean `true` or `false` value. They are used to check between\
    \ two or more statements for logical connectivity. These operators are used in\
    \ tandem with other operators as displayed earlier on. The logical operators used\
    \ in JavaScript are:\n\n| Operator | Description |\n| --- | --- |\n| `&&` | logical\
    \ 'AND' |\n| `||` | logical 'OR' |\n| `!` | logical 'NOT' |\n\n#### (&&) - AND\n\
    \nThe logical AND operator checks between two variables or statements to make\
    \ sure both collectively return a Boolean true. The statement when evaluated with\
    \ an AND operator much evaluate to a Boolean true value. For example:\n\n```javascript\n\
    var a = 10, b = '10';\n(a == 10) && (b=='10');    // returns true\n(a > 10) &&\
    \ (b=='10');    // returns false\n(a >= 10) && (true);    // returns true\n(a\
    \ >= 10) && (b=='10') && (true);    // returns true\n```\n\nThis is useful if\
    \ you wish to check if more than one statement are evaluated as true. This would\
    \ be highly used especially when we would be working with conditional statements.\n\
    \n#### (||) - OR\n\nSometimes you need to evaluate if just one out of a set of\
    \ statements evaluated as true. The Logical Or operator denoted by two pipe symbols\
    \ does exactly that. Were a logical AND operator will return true if all the statements\
    \ evaluated returned true, the OR operator returns true only if one out of a single\
    \ statement would evaluate as true.\n\n```javascript\nvar a = 10, b = 12;\n(a\
    \ == 10) || (b==10);    // returns true\n(a > 10) || (b==10);    // returns false\n\
    (a >= 10) && (true);    // returns true\n```\n\n#### (!) - The logical NOT symbol\n\
    \nAs explained earlier the `!` symbol works in tandem with other symbols and expressions\
    \ and returns the opposite of what those statements would evaluate to. For example:\n\
    \n```javascript\nvar a = 10;\n(a == 10);    // returns true because a is equal\
    \ to 10\n!(a == 10);    // returns false negating the statement a equals 10\n\
    (a == 11);    // returns false because a is not equal to 11\n!(a == 11);    //\
    \ returns true negating that a is not equal to 11..\n```\n\n### Conditional Operators\n\
    \nJavaScript provides one conditional operator which makes assignments based upon\
    \ a decision. This is the `?:`:\n\n```javascript\nvar a = 10;\n(a == 10) ? 12\
    \ : 0;\n```\n\nThe above statement reads if `a` is 10 then 12 else 0. This is\
    \ a very handy shortcut for making assignments upon a single statement.\n\n```javascript\n\
    var a = 10;\n(a == 10) ? 12 : 0\n```\n\n### Built in JavaScript functions - good\
    \ to know\n\nBefore we proceed further it’s important that we get acquainted with\
    \ a few handy built functions that JavaScript provides us. These functions are\
    \ native to JavaScript and are very useful or terribly annoying depending on how\
    \ you use them.\n\n#### Alert - everyone loves/hates the alert\n\nThis is a very\
    \ simple function that opens a rather alert box with a message you can pass to\
    \ it. The syntax is very simple:\n\n```javascript\nalert('Hello there!');\n```\n\
    \nThis should open up an alert box with the message 'Hello there!' and an OK button\
    \ to close it. While this is a native JavaScript function, we'll be using it a\
    \ bit throughout further examples. But in a real time setting you would do best\
    \ to refrain from using it too much as it is more of an annoyance to users.\n\n\
    #### Confirm - what do you want to do today?\n\nOne of the more useful functions\
    \ - the `confirm` command actually opens a confirm box with the choice to click\
    \ on a Yes or No button. This is useful to quickly get confirmation from the user.\
    \ Here is a quick example:\n\n```javascript\nif(confirm('Can I say yes?')== true){\n\
    \  document.write('Yes');\n}else{\n  document.write('No');\n}\n```\n\nRunning\
    \ this will open a confirm box with the message passed. Clicking on `OK` will\
    \ run the code block in the If statement printing out Yes while clicking `cancel`\
    \ will do other wise. The confirm function returns true if the user confirms and\
    \ false if the user doesn't.\n\n### String Operators - work on strings\n\nWhen\
    \ working with strings, you'll need to do more than just check if two strings\
    \ are the same. While you can use `==`, `===` operators to check if two strings\
    \ are equal, working with strings is obviously a lot different than working with\
    \ numbers. Which is why JavaScript provides a few native string operators you\
    \ would definitely find use of in your day to day. We'll touch more on string\
    \ operators when we cover strings in a later chapter.\n"
