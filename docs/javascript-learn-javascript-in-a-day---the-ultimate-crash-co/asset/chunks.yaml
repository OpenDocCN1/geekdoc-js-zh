    During this time Microsoft had rolled out their own client sided language called
    JScript for the Internet Explorer browser. JScript was based on Netscapes JavaScript
    and was named JScript to avoid copyright issues.


    This led to what was known as the browser wars where the leading browsers provided
    their own implementations of the client side language. This had serious repercussions
    that you now had proprietary code that was heavily browser based so at times scripts
    coded to run in a Netscape browser would fail in a Internet Explorer.


    To cut a long story short JavaScript has been through major evolutions and has
    more of less standardized over the history that spans almost two decades. Earlier
    on users pretty much viewed client sided scripts as an annoyance and browsers
    at the time even had the option to ''turn client scripts'' off. But things have
    dramatically changed and web applications are wholly dependant on client side
    scripts for successful execution. With the introduction of AJAX and the resurgence
    of the Web 2 revolution JavaScript has made a tremendous comeback and is here
    to stay.


    # Is it magic? Dangerous?


    Depends on what you can use it for, granted that JavaScript allows you a great
    deal of control over not only the HTML page but also to the users browser, it
    won''t cause a PC melt down so its pretty safe to use.


    However there have been a number of security vulnerabilities with Javascript ever
    since its inception such as Cross site Scripting which enables hackers to return
    malicious scripts to users which are executed in the users browser. Pretty much
    like those banner ads that you were warned so many times not to click on, the
    worst that such scripts can do is access information stored on your browser and
    that includes authentication details stored in cookies as well as other kinds
    of data you wouldn''t want people to get their grubby hands on.


    The onus of protection is on the user in this regards and the most we all can
    do as decent people is never use the power of JavaScript for evil dastardly deeds
    - like any super power, in the wrong hands it can spell catastrophe!


