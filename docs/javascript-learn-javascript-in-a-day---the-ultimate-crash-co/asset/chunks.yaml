  raw: 'var gender = document.getElementById(''gender'');


    gender.onchange = function(){


      alert(''You are ''+this.value);


    }


    Run that code and just change the value in the select field, you''ll be greeted
    with a silly popup that tells you what you''ve outputted. The onchange event is
    triggered only when the value of the element is changed.


    Now that we understand how those work, there is one more main event that we have
    yet to cover with forms. The onsubmit event. Forms like all elements are also
    a node, and likewise they have their own specific methods and properties and likewise
    their own events. The onsubmit event is triggered when a form is submitted. Normally
    this is where you would add an event handler that would check to make sure the
    form is submitting with valid details. With the above code, you do give the user
    visual cues but the form will still submit. Lets work on the form a bit and make
    sure that it doesn''t submit unless you have at least a name entered. For this
    we''ll work on the onsubmit handler.


    var frm = document.getElementById(''theForm'');


    frm.onsubmit = function(){


      if(document.getElementById(''name'').value == ''''){


        alert(''The form is not valid, name cannot be empty!'');


      }


    }


    Run that code without entering the name and booyah! You get an error message in
    a popup. But wait a second, you click ok on the pop up and the form still submitted
    - why is that you may wonder? That is because in order to halt the normal action,
    you need to return a boolean false in the event handler. This ensures that the
    form is not submitted. So make the following adjustment:


    var frm = document.getElementById(''theForm'');


    frm.onsubmit = function(){


      if(document.getElementById(''name'').value == ''''){


        alert(''The form is not valid, name cannot be empty!'');


        return false;


      }else{


        return true;


      }


    }


    And you''re good to go, now the form doesn''t submit if there is an empty name
    field.


    Note the else statement in the above example is not really needed and it can function
    just as well without it.


    ## Summary


    *   We''ve learnt how JavaScript events work


    *   Events can be captured and code can be assigned to events in what are called
    event handlers.


    *   Event handlers are passed an event object by default which represents the
    event that has occurred and contains data about the event.


    *   Keyboard events register a corresponding keycode value in the event Object
    where each keycode is a Unicode value representation the key that was pressed.


    *   Forms have their own set of events.


    *   OnBlur and OnFocus refer to the events of losing/getting focus respectively.


    *   The form''s onsubmit even allows us to run code prior to submitting the form
    eg: validation code.


    ## Assignments


    #### Exercise 1


    In the above form example, write a set of onblur and onfocus event handlers for
    the age field that checks if the age entered is a positive integer.


    #### Exercise 2


    Refactor the functions above, put them all in a dedicated Object for validation
    which can be reused. use the object for validating on blur/onfocus handlers as
    well as in the onsubmit handler. This is so you do not repeat the same code in
    the submit handler as you would have written in the other individual fields event
    handlers.


    # Chapter 12: Beyond the HTML - accessing the Browser?


    So far we''ve understood a number of key concepts regarding nodes. We''ve seen
    detailed examples that explain how all nodes are objects with their own methods
    and properties. We also understood the DOM structure, the tree like structure
    on the basis of which web pages were constructed. That every node would branch
    out into further nodes akin to HTML tags nesting other HTML tags and so forth.
    Aside this we also understood that the document model although it is at the root
    of the page is also container by the window Object i.e. in this case the browser.
    The browser itself can also be referenced just like the DOM, giving us unprecedented
    control on the user experience that goes beyond the HTML on the page.


    ## Overview


    We will learn about the BOM i.e. the Browser Object Model, and our focus will
    be on the window object as well as the practical implications of its methods.
    We''ll learn how to redirect users as well as understand how to set cookies to
    store user specific information for later access. Plus we''ll go over a few examples
    that illustrate the many different methods and features of the window object.


    ## The Window Object - yes your browser is in our control!


    The BOM, of Browser Object Model is pretty much like the browsers version of the
    DOM. However different browsers tend to define the ''BOM'' with a few variations
    unlike the DOM which is defined by the worldwide web consortium. So there really
    isn''t a standardized BOM as of yet. However we would be covering all the common
    methods available through the window Object which allows us to access, control,
    manipulate and technically hold the browser for ransom (scratch that part on holding
    the browser for ransom).


    The Window object just like all other objects functions as a node, although it
    is pretty much the actual root here, it contains the document which represents
    the page. Since we''re pretty clear on what the document model has to offer let’s
    take a look at the basic methods that the browser provides us through the Window object.


    To start with the document itself is a property of the window Object to begin
    with. If we were to look at the following bit of code:


    document.write(''Hello there!'');       // this is the same..


    window.document.write(''Hello there!''); // ..as this


    We can see that window.document is just the same as writing document. Since document is
    a global variable, it’s safe to assume that all global variables are accessible
    by the window Object and so are global functions.


    g = 10; // This is globally declared


    window.g == g; // g can be accessed from window as its a global variable


    It’s clear that the window Object has access to variables and functions in the
    global scope. This allows us to control the browser based solely on code.


    ## Can I get curtains for my window?


    The window object can be used to get the actual size of the browser in pixels.


    window.innerHeight; // returns the height of the browser window


    window.innerWidth;  // returns the width of the browser window


    As we stated that because the BOM is not standardized, eaelier versions of Internet
    Explorer had their own different methods to attain the same result here. Try this
    little exercise out, write down the following code.


    document.write(''Height is '' + window.innerHeight + ''px<br/>'');


    document.write(''Width is '' + window.innerWidth + ''px<br/>'');


    Run the code and it should return a set of values, now resize your browser and
    refresh it, You should see a different set of values corresponding to the new
    size fo your browser screen. This is exceptionally useful in cases where you might
    want to hide or show certain elements based upon the size of your browser screen.
    Earlier websites would use JavaScript to adjust content for mobile sized screens,
    however this practice has been replaced with the advent of HTML5 and CSS3\. Nevertheless
    this is still a useful feature.


    ## Opening/Referencing Browser windows with JavaScript


    This is probably one of the most irritating yet common uses of the window object.
    You''ve probably seen the ability to open popups on many websites. This is made
    possible using the window.open method of thewindow object.


    While pop ups are frowned upon and most users would prefer to block pop ups, there
    are a number of situations where you might require a pop up window. Banks even
    today make use of JavaScript based window popups to show virtual keyboards online
    where instead of typing out using your keyboard you click on a virtual keyboard
    on the screen to enter your credentials. Plus a window once it has been opened
    using JavaScript can also be referenced later on in code.'
