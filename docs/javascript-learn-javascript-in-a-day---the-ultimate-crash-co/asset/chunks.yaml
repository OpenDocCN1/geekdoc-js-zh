  trans: "\n\n在上述所有方法中，检索到的详情是相对于你计算机的时区的。除了上述方法外，JavaScript 还提供了类似的方法，这些方法仅相对于 UTC\
    \ 获取相同的详情，并考虑了你 PC 的时区。它们的命名如下：\n\n```\nvar dt = new Date(2012,11,31, 10, 30,\
    \ 20); // 几分钟到几小时就可以完全改变日期\n\ndt.getUTCFullYear(); // 返回经过 UTC 调整的年份\n\ndt.getUTCMonth();\
    \ // 返回经过 UTC 调整的月份\n\ndt.getUTCDate(); // 返回经过 UTC 调整的日期\n\ndt.getUTCDay(); //\
    \ 返回经过 UTC 调整的星期几\n\ndt.getUTCHours(); // 返回经过 UTC 调整的小时\n\ndt.getUTCMinutes();\
    \ // 返回经过 UTC 调整的分钟\n\ndt.getUTCSeconds(); // 再次不言自明\n\ndt.getUTCMilliseconds();\
    \ // 不言自明\n\ndt.getUTCDate(); // 返回经过 UTC 调整的完整日期 - getDate() 的 UTC 调整等效值\n```\n\
    \n在处理日期时，考虑时区差异是非常重要的。你必须意识到用户的时区以及他们可能进行交易的时间。通常，日期是根据世界标准时间（UTC）存储的，然后转换为匹配用户的时区以便在网页上显示。\n\
    \n你可能已经上述所有方法中的一个共同模式，即它们都以前缀 `get` 开始。对象拥有属性，与其直接访问属性，面向对象编程的常用做法是编写简单的函数来获取这些单独属性的值。它们被称为获取函数（getter\
    \ functions），通常以 `get` 前缀加上它们返回的属性名来命名。就像你有获取函数一样，你也有设置函数（setter functions），用于设置对象的单个属性。它们遵循类似的命名约定，因此以单词\
    \ `set` 为前缀。所以上述所有函数都有其对应的设置替代方案，它们接收一个变量并调整相应的属性。\n\n```\ndt.setFullYear(2013);\
    \ // 接收年份并设置它\n\ndt.setMonth(2); // 接收一个 0 到 11 之间的数字，对应月份\n\ndt.setDate(23);\
    \ // 接收一个 1 到 31 之间的数字并设置月的日期\n\ndt.setHours(12); // 接收一个 0 到 23 之间的数字并设置小时 \n\
    \ndt.setMinutes(54); // 0 到 59 之间的任何数字\n\ndt.setSeconds(45); // 再次不言自明\n\ndt.setMilliseconds();\
    \ // 不言自明\n```\n\n此外，完全相同的函数还提供了对应的 UTC 版本，这些版本会设置经过 UTC 调整的相应日期部分。\n\n```\ndt.setUTCFullYear(2013);\
    \ // 接收年份并进行 UTC 调整后设置\n\ndt.setUTCMonth(2); // 接收一个 0 到 11 之间的数字对应月份并进行 UTC 调整\n\
    \ndt.setUTCDate(23); // 接收一个 1 到 31 之间的数字并设置月的日期并进行 UTC 调整\n\ndt.setUTCHours(12);\
    \ // 接收一个 0 到 23 之间的数字并设置小时并进行 UTC 调整\n\ndt.setUTCMinutes(54); // 0 到 59 之间的任何数字并进行\
    \ UTC 调整\n\ndt.setUTCSeconds(45); // 再次不言自明\n\ndt.setUTCMilliseconds(); // 不言自明\n\
    ```\n\n就像我们有一个日期函数 `getTime` 可以返回从当前时间和日期到零时间的毫秒数，我们也有相应的 `setTime` 函数，它接受一个对应于自零时间以来毫秒数的数值参数，并据此设置日期。这就像在创建日期对象时传递毫秒数来对其初始化一样。\n\
    \n```\ndt.setTime(86400000); // dt 现在等于 1970 年 1 月 02 日 00:00:00 UTC（假设你的 PC 时区已设置为\
    \ UTC）\n\ndt.setTime(-86400000); // dt 现在等于 1969 年 12 月 31 日 00:00:00 UTC（假设你的\
    \ PC 时区已设置为 UTC）\n```\n\n虽然这些看起来似乎有很多函数需要记忆，但它们非常容易记忆，而且每个函数只作用于日期元素的一个组成部分。\n\
    \n## 深入了解日期\n\n除了上述函数外，JavaScript 还提供了一组处理 `Date` 对象单一单一组件的函数。\n\n我们已经看到了用于获取当前系统时间以及相对于当前系统时间的\
    \ UTC 时间日期和时间组成部分的不同函数。此外，你还可以通过使用 `getTimezoneOffset` 函数获取当前系统时间的 UTC 偏移量。这将返回本地时间与\
    \ UTC 时间之间的差，以分钟为单位的正整数或负整数，取决于你所在的时区。\n\n```\nvar dt = new Date(); // 初始化日期对象\n\
    \ndt.getTimezoneOffset(); // 返回 240，因为本地时间是 UTC +4 小时，所以 4 乘以 60 是 240\n```\n\n\
    这在尝试用 JavaScript 构建时区转换器时非常有用。\n\n提到转换时，我们必须知道 JavaScript 高度依赖“零时间”作为时间比较的占位符。JavaScript\
    \ 中的 `parse` 函数接收字符串日期，并返回解析日期与零时间之间的差（单位为毫秒）。这个函数与使用字符串实例化日期对象然后调用 `getTime`\
    \ 函数几乎相同。\n\n```\nvar dt = new Date('31 March, 2014');\n\ndt.getTime() == Date.parse('31\
    \ March, 2014');\n```\n"
- fmt: "\nThe HTML DOM or Document Object Model is a w3 standard for defining and\
    \ accessing content of a webpage i.e. `document`. The HTML DOM is a standard conventional\
    \ interface which defines all elements as objects as well as the properties inherent\
    \ to each element as well as the methods and events available for each element.\n\
    \nEvery element in a webpage including the webpage itself is referred to as a\
    \ `node`. The nodes are arranged in a tree like structure with the `document`\
    \ node as the root node with the other nodes following in for example:\n\n```html\n\
    <html>\n  <head></head>\n  <body></body>\n</html>\n```\n\nThe first node in the\
    \ document node is the `html` node which branches out into the `head` element\
    \ node and the `body` element node respectively and so forth.\n\nWhen a web page\
    \ is rendered, a Document Object Model of the page is created with each and every\
    \ element loading as a node on the tree. This is a very important way to understand\
    \ the DOM in order to be able to interact and manipulate it which we would do\
    \ so using the many methods available to us from the DOM.\n\nEvery element on\
    \ the page including the page itself is an object of the class `node`. The `node`\
    \ is the base class which defines every element in the page as well as the page\
    \ itself. And on account of this almost all the objects have similar methods and\
    \ properties as well as their own specialized properties.\n\nLet’s start off by\
    \ creating a basic HTML page which we would use for the rest of this exercise.\
    \ You can put all the JavaScript code either in a `script` tag in the head of\
    \ the page or in an external `.js` file and link to that file as an external script.\n\
    \n```html\n<html>\n  <head>\n    <title>Hello World</title>\n  </head>\n  <body>\n\
    \    <h1 id=\"heading\">The Page</h1>\n    <p id=\"sub\" class=\"base\">This is\
    \ some text on the page</p>\n    <table class=\"base\">\n      <tr>\n        <td>Item</td>\n\
    \        <td>A</td>\n      </tr>\n      <tr>\n        <td>Item</td>\n        <td>B</td>\n\
    \      </tr>\n    </table>\n    <ul name=\"list\">\n      <li>Element 1</li>\n\
    \      <li>Element 2</li>\n      <li>Element 3</li>\n    </ul>\n  </body>\n</html>\n\
