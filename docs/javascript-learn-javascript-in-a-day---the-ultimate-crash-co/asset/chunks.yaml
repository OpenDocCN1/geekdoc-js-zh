    ## Assignment


    #### Exercise 1


    Create an array of person objects that have the properties - name, age, description
    and email. Using the methods learnt in this chapter, using only JavaScript create
    a table of all the person objects in each row.


    #### Exercise 2


    In addition to the above exercise, add another property to the persons called active which
    takes a value of true or false. Set some persons to be active and some not active.
    Using JavaScript, mark the background colors of table rows with active persons
    with a green color and inactive persons with a gray color.


    # Chapter 11: Events - what just happened?


    Manipulating the DOM, traversing and playing around with an HTML page seem like
    a lot of fun. But there is no fun if the end user can''t do much interaction here.
    So far we''ve tried out examples where all the manipulation was done in code with
    zero input from the outside world aka the user. This pretty much defeats the purpose
    of using JavaScript in the first place. But don''t fret - JavaScript comes with
    a highly detailed events model that allows us to code user specific events that
    are native to all HTML elements. Users do stuff with the mouse and the keyboard
    and we need to be able to capture all those details and give the user the interactive
    experience that they so rightly deserve.


    ## Overview


    In this chapter we''ll take a look at the event model in JavaScript, what events
    are and how do we code for them. We''ll understand the idea of an event Handler
    and the different events available to us by the DOM and the different types of
    events.


    ## Events in JavaScript


    In laymen’s terms an event is something that occurs or just happens without any
    pre-emotive warning. That click from the users mouse, the form that was just submitted,
    the browser resizing, the drag - those are all events. JavaScript allows us to
    register event handlers which are essentially blocks of code to events. This means
    that an event handler is a block of code that has been registered to be executed
    whenever an event occurs.'
