    # Chapter 1: Hello JavaScript


    To get started with JavaScript we''ll build a traditional Hello world application
    using JavaScript. During the course of this book, we''ll be focusing on learning
    JavaScript through realtime coding and walking you through the code explaining
    what it does and how does it work. To get started lets set up your workspace.


    ## Setting up your workspace


    As we said, there isn''t much required with getting started with JavaScript. To
    start with fire up your preferred text editor of choice and open your browser.


    At this point you might want to consider installing a web server if you wish to
    do some server sided programming. However for the sake of learning just JavaScript
    this won''t be required. The scope of this book doesn''t include the process for
    installing a web server as there are ample resources to set up a webserver available
    online.


    You might wish to install an apache or an IIS server. For users running windows
    you can get apache based installables such as WAMP and XAMP which install and
    configure apache plus php and mysql for you. Alternatively if you have IIS installed
    on your windows machine that is good enough.


    The webserver on your system acts just like any regular server online only to
    a smaller scale.


    On your webserver you would have a folder to store your website(s). On Apache
    this folder is normally the:


    `/path/to/apache/www`


    Or `/path/to/apache/htdocs`


    On IIS the path to this folder would be


    `C:/InetPub/wwwroot`


    ..Assuming you have IIS set up in your C drive.


    This is referred to as the root folder of your webserver and during the course
    of this book, any references to the root folder would be to this specific folder
    irrespective of whether you''re running IIS or Apache.


    ## Some Code


    In the root folder, create a new directory, lets call it lessons. We''ll be storing
    all our lessons in individual folders within this directory. In that folder create
    a new directory and give it a name - let’s call `lesson-1`. Once you''ve done
    that fire up your favorite browser of choice and navigate to that directory. Make
    sure that your server is running and type in the navigation bar of your browser
    assuming you''ve:


    `http://localhost/lessons/lesson-1`


    And voila - nothing shows up. This is obvious because we haven’t made a default
    index page yet. Create a new file in your lesson-1 folder and call it `index.html`.


    Add some basic HTML:


    ```html

    <html>

    <head>

    <title>Learning JavaScript</title>

    </head>

    <body>


    </body>

    </html>

    ```


    This is a barebones HTML page with just the opening and closing body tags. Now
    let’s start off with a basic script.


    ## The script tag


    Since we''re familiar with HTML, its time to take a look at the `script` tag.
    Let’s write a basic piece of:


    ```html

    <html>

    <head>

    <title>Learning JavaScript</title>

    </head>

    <body>


    <script language="JavaScript">

    // code here

    </script>


    </body>

    </html>

    ```


    Refresh your page in the browser and you should see Hello World.


    ## What just happened?


    Lets take a look at our code to begin with. All JavaScript code is enclosed within
    the `script` tags. At the moment there is just one piece of code which says:


    ```javascript

    document.write(''Hello World'');

    ```


    The `document.write` is a function that simply outputs whatever is passed to it.
    For now a just understand that a function is a piece of code that accepts a parameter
    and does something. We''ll go into indepth detail on functions later on. But for
    now we should be clear that passing anything to `document.write` would be outputted
    to the browser.


    Also note at the end of the line there is a semi-colon `;`. When writing code
    in JavaScript all lines of code must end with a semi-colon before the next line
    of code. This is a syntax requirement and if you''ve worked with C or C plus plus
    you might find this very familiar already.


    So what happened was that when the page loaded, the script was interpreted by
    the browser. Lets try this with a few variations.


    ## Document.writing stuff


    As noted anything passed to the `document.write` function will be outputted to
    the browser. Let’s output a few lines of text and see what happens. Enter the
    following code:


    ```html

    <script language="JavaScript">

    ```

