    ''1'' is seen as a preceding ''2'' - the numerical value of ''10'' is ignored
    in this context. To get around this the sort function takes as a parameter a whole
    function(yes you can also pass functions as parameters - isn''t JavaScript grand)
    for comparison.


    This comparison function would take two parameters which would conform to two
    values that would be compared to each other. Simply stating the sort function
    would call this function every time it would compare two values in the array.
    With this function you can define how to actually sort the array, as long as the
    function returns a negative, positive or zero value. Lets look at an example here
    to do a numeric comparison:


    var a = [10, 3, 2];


    a.sort(function(x, y){return x-y});


    In the above example we passed a function which subtracts the first element passed
    from the second. If the first element is greater than the second i.e. the following
    - the value returned would be positive and thus the element would have its place
    replaced with the lower element. This sorts the elements numerically from lowest
    to the highest. The same function can be redone a bit to sort from the highest
    to the lowest:


    var a = [10, 1, 2];


    a.sort(function(x, y){return y-x});


    ## Search search


    With arrays having multiple elements, we need to know a way to find a specific
    element. We can always run a loop through the array and check if a specific element
    exists. Here is an example that illustrates this using a function.


    function findInArray(needle, haystack){


        for(var i = 0; i < haystack.length; i++){


            if(haystack[i]==needle){


                return i;


            }


        }


        return -1;


    }


    var a = [10, 3, 2];


    findInArray(a, 3); // equals 1


    findInArray(a, 13); // equals -1


    The above example simply loops through the array and return the index of the array
    if the element is found. An array can never have a negative index which is why
    the function above returns a negative value if the loop completes without returning
    a value i.e. finding the element. However you really don''t need to make your
    own function in JavaScript to search for an element as JavaScript already provides
    a method for arrays to find the index of elements and it functions in pretty much
    the same way as the above function would. Meet the indexOf function.


    var pets = [''dog'', ''cat'', ''hamster'', ''bird'', ''dog'', ''goldfish''];


    pets.indexOf(''cat''); // returns 1


    pets.indexOf(''dog''); // returns 0


    pets.indexOf(''snail''); // returns -1


    In the above example we see that indexOf returns the index of the first occurrence
    of the element sought. This is why it didn’t return index of the last occurrence
    of ‘dog’. To search arrays from the end - we use the lastIndexOf function which
    is a reverse variation of the indexOf function.


    var pets = [''dog'', ''cat'', ''hamster'', ''bird'', ''dog'', ''goldfish''];


    pets.indexOf(''dog''); // returns 0


    pets.lastIndexOf(''dog''); // returns 4


    The indexOf function also takes in a second parameter which is the index from
    which to start searching from. By default this is zero as the index of function
    starts to search from the first element in the array. Let’s see how this works:


    var pets = [''dog'', ''cat'', ''hamster'', ''bird'', ''dog'', ''goldfish''];


    pets.indexOf(''dog''); // returns 0


    pets.indexOf(''dog'', 2); // returns 4


    In the above example we told the indexOf function to start searching for ''dog''
    from the index ''2'' onwards.


    ## Summary


    *   We touched on JavaScript arrays and the many different functions that allow
    us to handle arrays.


    *   We used the sort function to sort arrays.


    *   We understood that arrays can be concatenated and joined using the concept
    and join functions.


    *   We learnt that arrays can be created by using square brackets or creating
    an Array object with the new keyword.


    *   We learnt how to add and remove elements from an array.


    *   We also learnt how arrays can be used in loops and how to loop through an
    array.


    ## Assignment


    ##### Exercise 1


    Consider the following array [12, 67,22,12,10,6,8]. Sort the array using a custom
    made function - do not use the sort function.


    ##### Exercise 2


    In the following array


    pets = [''dog'', ''cat'', ''hamster'', ''bird'', ''dog'', ''goldfish''];


    Take input from the user and search through the array for the input by the user.
    When found, remove that element from the array and prompt the user for another
    input - keep doing this until the user enters a value that is not in the array
    or until all the array elements have been removed.


    ##### Exercise 2


    In the following array


    pets = [''dog'', ''cat'', ''hamster'', ''bird'', ''dog'', ''goldfish'', ''dog'',
    ''bird''];


    Make a function that removes all the duplicated elements in the above array and
    creates a new array with the duplicated elements.


    # Chapter 7: Objects - everything is one!


    When talking about Object Oriented development, this is more of a whole new perspective
    on development than a programmatic approach. While until a decade ago it was seen
    as an alternative form of development, Object Oriented programming has replaced
    the age old form of structured development and is now the defect model when it
    comes to programming. You cannot even lay claim to being a programmer if you don''t
    have a solid foundation in Object oriented Programming techniques and principles.


    ## Overview'
