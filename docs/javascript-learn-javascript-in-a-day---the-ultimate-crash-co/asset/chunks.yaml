    ```\n\n在上面的代码中，我们让第一个链接打开了一个空白窗口，并将返回的窗口对象赋值给变量 `wn`。然后我们使用该对象的 `open` 属性在同一个窗口中打开了谷歌站点。有了对新创建窗口的引用，我们可以做的不仅仅是在它中打开一个网站，让我们在页面上添加另一个链接和一些\
    \ JavaScript：\n\n```html\n<a href=\"#\" id=\"open-window\">打开一个窗口</a><br/>\n<a\
    \ href=\"#\" id=\"open-google\">打开谷歌</a><br/>\n<a href=\"#\" id=\"write-stuff\"\
    >写入内容</a><br/>\n<a href=\"#\" id=\"close-window\">关闭窗口</a>\n```\n\n```javascript\n\
    var op = document.getElementById('open-window');\n\nop.onclick = function(){\n\
    \  wn = window.open('', 'basic');\n}\n\nvar opw = document.getElementById('write-stuff');\n\
    \nopw.onclick = function(){\n  wn.document.write('Hello there', 'basic');\n}\n\
    \nvar opg = document.getElementById('open-google');\n\nopg.onclick = function(){\n\
    \  wn.open('http://www.google.com', 'basic');\n}\n```\n\n运行代码，打开空白窗口，然后点击“写入”链接，惊讶的是，你可以从原始窗口中的代码在新创建的窗口中写入文本。\n\
    \n注意，这个示例还说明了 `document` 对象是 `window` 对象的一个节点。\n\n关闭已打开的窗口同样简单。只需调用 `window.close()`\
    \ 即可。\n\n```javascript\nvar opc = document.getElementById('close-window');\n\n\
    opg.onclick = function(){\n  wn.close();\n}\n```\n\n添加上面的代码，关闭按钮链接将关闭新创建的窗口。`window.open()`\
    \ 函数还提供了多种修改已打开窗口的方法。你可以设置它的 own、显示和隐藏浏览器的工具栏和按钮等。对于这些修改，我们将查看传递给 `window.open()`\
    \ 函数的第三个参数。该参数接收一个由逗号分隔的设置字符串，定义了对新打开窗口所需的修改。\n\n以下是列出不同设置的示例列表：\n\n`window.open('',\
    \ '', 'height=300');` // 空白窗口以 300 像素的高度打开\n`window.open('', '', 'left=100');`\
    \ // 空白窗口在屏幕左侧 100 像素处打开\n`window.open('', '', 'location=no');` // 隐藏地址栏，设置为 yes\
    \ 显示 - 并非所有浏览器支持\n`window.open('', '', 'menubar=no');` // 隐藏菜单栏，设置为 yes 显示 - 并非所有浏览器支持\n\
    `window.open('', '', 'resizable=no');` // 允许/禁止窗口调整大小 - 并非所有浏览器支持\n`window.open('',\
    \ '', 'scrollbars=no');` // 隐藏滚动条，设置为 yes 显示 - 并非所有浏览器支持\n`window.open('', '',\
    \ 'status=no');` // 隐藏状态栏，设置为 yes 显示\n`window.open('', '', 'width=300');` // 空白窗口以\
    \ 300 像素的宽度打开\n`window.open('', '', 'width=300, height:400, left=150, location=no');`\
    \ // 空白窗口以 300 像素宽、400 像素高、左侧 150 像素且无地址栏打开\n\n如你所见，使用 `window.open()` 函数，你可以做的不仅仅是在不同的窗口中打开\
    \ URL，甚至可以自定义窗口的性质甚至位置。\n\n**注意：** 尽管这些都很酷且有趣，但在现实设置中，弹出窗口是不受欢迎的，应该只谨慎使用。\n\n\
    ## 浏览器特定函数 - 让我们来导航\n\n所有现代浏览器都提供了另一个对象，即 `navigator` 对象。这是一个基础对象，技术上直接指代浏览器。虽然\
    \ `window` 对象指的是打开的浏览器窗口的实际实例，而 `navigator` 对象则指代浏览器本身。`window` 对象和 `navigator`\
    \ 对象配合使用，为用户创建一个丰富的交互体验。\n\n这里是 `navigator` 对象的一个基本示例：\n\n`navigator.language`\
    \ // 返回浏览器的语言\n`document.write('This speaks ' + navigator.language);`\n\n假设你的浏览器设置了\
    \ `English`，你应该得到类似 `This speaks en`。此外，`navigator` 对象还允许你获取有关浏览器的信息，例如浏览器类型 `userAgent`\
    \ 以及运行的操作系统：\n\n`document.write('User agent is ' + navigator.userAgent);`\n`document.write('<br/>This\
    \ browser is ' + navigator.appName);`\n\n运行上面的代码，你应该看到两行独特的信息——类似于 `user agent\
    \ is Mozilla/5.0 (Ubuntu; Linux x86_64; rv:34.0) Netscape`。这是 `.userAgent` 和 `.appName`\
    \ 的值。\n\n## 你在哪里！Geolocation\n\n这可能是 `navigator` 对象常用且有趣的用途之一。`geolocation` 属性提供了返回用户实际位置的功能。这实际上需要用户先给予许可。这些信息可以用于填充地图或存储。让我们在这里尝试一个简单的例子：\n\
    \n```javascript\nfunction writePos(position){\n  document.write(\"Latitude: \"\
    \ + position.coords.latitude + '<br/>');\n  document.write(\"Longitude: \" + position.coords.longitude);\n\
    }\nnavigator.geolocation.getCurrentPosition(writePos);\n```\n\n运行上面的代码，浏览器应该询问你是否想共享位置。允许后，你应该会在\
    \ `writePos` 函数中看到写入的内容。现在这里是 `navigator.geolocation` 属性，它提供了一个 `getCurrentPosition`\
    \ 函数，该函数接收一个 `position` 对象作为参数，该对象包含一组属性，其中我们使用了 `coords`。利用这些信息，你可以定制应用程序来获取特定的细节。让我们使用\
    \ Maps API 在地图上显示位置——这真的非常快速。\n\n```javascript\nfunction writePos(position){\n\
    \  var map_url = \"http://maps.googleapis.com/maps/staticmap?center=\"+position.coords.latitude\
    \ + \",\" + position.coords.longitude+\"&zoom=12&size=550x400&sensor=false\";\n\
    \  document.write(\"Latitude: \" + position.coords.latitude + '<br/>');\n  document.write(\"\
    Longitude: \" + position.coords.longitude);\n  document.write('<br/><img src=\"\
    ' + map_url + '\" />');\n}\nnavigator.geolocation.getCurrentPosition(writePos);\n\
    ```\n\n你应该看到一个显示你位置的地图，至少足够让你感到惊讶！\n\n## 随意跳转用户\n\n`window` 对象提供的另一个常用属性是 `location`。这不是\
    \ geolocation，只是指代浏览器中的 web url。`location` 对象本身提供了一系列可以设置或检索的属性。我们将回顾其中几个：\n\n\
    // 假设我们处于 `http://www.somesite.com/page/1?v=12`\n\n`window.location.hostname;`\
    \ // 返回主机名 - 根据上面的示例 `www.somesite.com`\n`window.location.href` // 返回或设置整个 url\n\
    `window.location.pathname;` // 返回或设置路径，如上面的 `/page/1`\n`window.location.search;`\
    \ // 返回或设置查询字符串，例如 `?v=12`\n\nlocation 对象允许你解析并访问/修改浏览器中 url 的许多部分。让我们用 `href`\
    \ 属性做一个简单的例子，它是最常用于从网页跳转用户的。\n\n编写以下代码：\n\n```html\n<a href=\"#\" id=\"link-to-yahoo\"\
    >前往 Yahoo</a>\n```\n\n```javascript\nvar a = document.getElementById('link-to-yahoo');\n\
    \na.onclick = function(){\n  window.location.href = 'http://www.yahoo.com';\n\
    }\n```\n\n运行代码并点击链接，你会发现现在可以跳转到雅虎了。想一种情况，例如你想跳转到用户输入的地址，或者跳转到一个实时构建的链接。此外，有时你可能想根据用户的输入跳转，例如跳转到错误页面，或者假设用户不允许你跳转到你网站上的错误页面。\n\
    \n## 回到过去 - 或历史\n\n浏览器的另一个有用功能是返回历史的能力。当然，你始终可以使用浏览器上的后退按钮。但这违背了让你的网页用户友好的初衷。有时你可能需要用户最后所在页面的引用，或者你可能想检查用户从哪里来。我们将利用\
    \ `window.history` 对象。让我们创建一个发送我们回到历史中页面的链接：\n\n```html\n<a href=\"#\" id=\"link-to-back\"\
    >返回</a>\n```\n\n```javascript\nvar a = document.getElementById('link-to-back');\n\
    \na.onclick = function(){\n  window.history.back();\n}\n```\n\n打开几个页面，然后导航到这段代码。运行它并点击链接，你会发现自己被送回到了之前的页面。或者，`history`\
    \ 对象还提供了一个 `forward()` 方法，可以让你前进一页。有时你可能想在你的网页上有一个返回链接。\n\n## 你想要 cookie 吗？\n\n\
    我们不是在讨论牛奶和奶油，cookie 是网站在浏览器上创建的文件，它持有数据。每当你使用网站时，你都在向服务器发送请求，它会返回 html。网站没有方法可以实际识别你。Cookies\
    \ 通过存储关于用户的信息来帮助识别用户。例如，如果不使用 cookies，你每次访问网站都必须输入你的名字。然而，当名字存储在 cookie 时，它会识别你并知道你的名字。Cookies\
    \ 以值对的形式存储，例如：`'name=Bob; Age=32;'`。Cookies 还可以附带日期，这允许浏览器在日期之前清理旧 cookies。默认情况下，浏览器关闭时\
    \ cookies 会被删除。使用 `document.cookie` 创建 cookie 是简单的：\n\n```javascript\ndocument.cookie\
    \ = 'name=Bob; Age=32; expires=Thu, 1 Feb 2015 12:00:00 UTC';\n```\n\ncookie 也可以被更改，只需要更改传递的属性：\n\
    \n```javascript\ndocument.cookie = 'name=Jimmy; Age=16; expires=Fri, 2 Feb 2015\
    \ 12:00:00 UTC';\n```\n\n删除 cookies 是简单的，只需传递过期日期即可：\n\n```javascript\ndocument.cookie\
    \ = 'name=; expires=Thu, 01 Jan 1970 00:00:00 UTC';\n```\n\n要访问 cookie，你可以使用 `document.cookie`\
    \ 属性来检索所有存储的 cookies。注意，检索 cookie 会返回上面的字符串，你需要使用一些字符串操作来从 cookie 中检索单个值。注意，如果你在网站使用\
    \ cookies，让用户知道你的网站使用了 cookies 是重要的。\n\n# 第十三章：JS 实战 - 表单验证\n\n自本章开始以来我们已经走了很远了，现在是时候将我们的技能投入实际应用了。我们将尝试将学到的所有内容实现在完整的基础表单中，这将展示我们在本书过程中学到的所有内容。这个应用程序旨在作为一个起点，让你对在真实情况下如何编程有一个概念。\n\
    \n### 概述\n\n我们将构建一个基础前端应用程序，接收用户信息并将其存储在对象数组中。我们将制定存储对象和数组的方案。通过此应用程序，我们还将允许用户添加和删除元素。为此我们还将使用验证技术来测试并确保输入使用\
    \ JavaScript 验证。错误将显示在表单上。\n\n## 我们的基础表单\n\n我们将制作一个简单的表单，接收关于用户的基本输入，如姓名、出生日期、地址和电子邮件。我们想要确保用户正确输入所有内容。对于出生日期，我们将使用\
    \ `select` 输入而不是让用户在文本框中手动输入日期，以便使用。让我们创建目前为止的表单：\n\n```html\n<form id=\"theForm\"\
    >\n  <p>\n    <label for=\"name\">全名</label><br/>\n    <input id=\"name\" name=\"\
    name\" />\n  </p>\n  <p>\n    <label for=\"dob\">出生日期</label><br/>\n    <select\
    \ id=\"dob_day\" name=\"dob[day]\"></select>\n    <select id=\"dob_month\" name=\"\
    dob[month]\"></select>\n    <select id=\"dob_year\" name=\"dob[year]\"></select>\n\
    \  </p>\n  <p>\n    <label for=\"address\">地址</label><br/>\n    <input id=\"address\"\
    \ name=\"address\" />\n  </p>\n  <p>\n    <label for=\"city\">城市</label><br/>\n\
    \    <input id=\"city\" name=\"city\" />\n  </p>\n  <p>\n    <input type=\"submit\"\
    \ />\n  </p>\n</form>\n```\n\n这目前还非常简单，现在我们需要创建多个用户并将它们存储为数组。首先，让我们创建一个代表一个用户的对象：\n\
    \n```javascript\nfunction user(name) {\n  this.name = name;\n  this.dob = '';\n\
    \  this.address = '';\n  this.city = '';\n}\n```\n\n上面的代码是 user 对象的声明。它只是接收一个名字。现在这是标准做法。让我们在表单提交时创建一个\
    \ user 对象：\n\n```javascript\nvar frm = document.getElementById('theForm');\n\n\
    frm.onsubmit = function(){\n  user1 = new user(document.getElementById('name').value);\n\
    \  return false;\n}\n```\n\n这不错，但似乎没有发生什么。我们需要创建一个用户数组。你可以直接在全局作用域声明变量，但最佳实践是使用对象而不是操作变量：\n\
    \n```javascript\nfunction list(){\n  this.list = [];\n}\nvar theList = new list();\n\
    ```\n\n这很棒，但我们如何向列表中添加用户呢？让我们创建一组函数来帮助我们。这些函数应该根据索引向列表添加用户、从列表中删除用户并获取用户：\n\n\
    ```javascript\nfunction list(){\n  this.list = [];\n  this.add = function(elem){\n\
    \    this.list.push(elem);\n  }\n  this.remove = function(index){\n    this.list.splice(index,\
    \ 1);\n  }\n  this.get = function(index){\n    return this.list[index];\n  }\n\
    }\n```\n\n现在我们有一个可以添加、删除和从数组获取元素的列表。`add` 函数使用了我们之前学过的 `push` 方法，而 `remove` 方法使用了\
    \ `splice` 方法来删除元素。这更全面了，现在我们有一个可以添加、删除和获取元素的列表对象：\n\n```javascript\nfunction\
    \ list(){\n  this.list = [];\n  this.html = '';\n  this.add = function(elem, ul){\n\
    \    this.list.push(elem);\n    ul.appendChild(this.getHTML(elem));\n  }\n  this.buildHTML\
    \ = function(elem){\n  }\n  this.getHTML = function(elem){\n    var usr = elem.getHTML();\n\
    \    var li = document.createElement('li');\n    li.appendChild(usr);\n    var\
    \ rm = document.createElement('a');\n    rm.innerHTML = '(remove)';\n    rm.setAttribute('href',\
    \ '#');\n    rm.onclick = function(){\n      alert('delete me');\n    }\n    li.appendChild(rm);\n\
    \    return li;\n  }\n  this.remove = function(index){\n    this.list.splice(index,\
    \ 1);\n  }\n  this.get = function(index){\n    return this.list[index];\n  }\n\
    }\n```\n\n等等，提供的文本有点碎片化。让我们根据描述的逻辑重建干净的版本：\n\n```javascript\nfunction user(name)\
    \ {\n  this.name = name;\n  this.dob = '';\n  this.address = '';\n  this.city\
    \ = '';\n  this.getHTML = function(){\n    return this.name;\n  }\n}\n\nfunction\
    \ list(){\n  this.list = [];\n  this.html = '';\n  this.add = function(elem, ul){\n\
    \    this.list.push(elem);\n    ul.appendChild(this.getHTML(elem));\n  }\n}\n\
    ```\n\n等等，这里是 ` ` 。。。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n，代码代码单表表添加添加我们的用户：\n\
    \n```javascript\nvar frm = document.getElementById('theForm');\nvar theList =\
    \ new list();\n\nfrm.onsubmit = function(){\n  theList.add(new user(document.getElementById('name').value));\n\
    \  return false;\n}\n```\n\n运行你的代码，你应该有一个表单，继续输入名字并提交表单。这似乎没有发生什么。我们需要显示在列表中创建的所有用户。让我们调整一下\
    \ HTML，让我们有一个已经输入的用户的无序列表。在你的表单下添加以下：\n\n```html\n<ul id=\"ourList\">\n</ul>\n\
    ```\n\n现在我们需要为每个添加的用户添加一个 `li` 元素。我们可以在提交表单时这样做，但让逻辑来处理如何显示列表元素更合理。为此，我们将添加几个函数：\n\
    \n```javascript\nfunction user(name) {\n  this.name = name;\n  this.dob = '';\n\
    \  this.address = '';\n  this.city = '';\n  this.getHTML = function(){\n    return\
    \ this.name;\n  }\n}\n\nfunction list(){\n  this.list = [];\n  this.html = '';\n\
    \  this.add = function(elem){\n    this.list.push(elem);\n    this.buildHTML(elem);\n\
    \  }\n  this.buildHTML = function(elem){\n  }\n  this.getHTML = function(elem){\n\
    \    var usr = elem.getHTML();\n    var li = document.createElement('li');\n \
    \   li.appendChild(usr);\n    var rm = document.createElement('a');\n    rm.innerHTML\
    \ = '(remove)';\n    rm.setAttribute('href', '#');\n    rm.onclick = function(){\n\
    \      alert('delete me');\n    }\n    li.appendChild(rm);\n    return li;\n \
    \ }\n  this.remove = function(index){\n    this.list.splice(index, 1);\n  }\n\
    \  this.get = function(index){\n    return this.list[index];\n  }\n}\n```\n\n\
    ## 复杂的日期\n\n到目前为止我们的表单只是获取姓名，但我们有了其他字段。日期字段有点棘手。我们将循环填充天：\n\n```javascript\nday\
    \ = document.getElementById('dob_day');\nfor(i=1; i<=31; i++){\n  op = document.createElement('option');\n\
    \  op.value = i;\n  op.innerHTML = i;\n  day.appendChild(op);\n}\n```\n\n接下来，按照循环填充月份：\n\
    \n```javascript\nmonth = document.getElementById('dob_month');\nfor(i=0; i<=11;\
    \ i++){\n  op = document.createElement('option');\n  op.value = i;\n  op.innerHTML\
    \ = i;\n  month.appendChild(op);\n}\n```\n\n最后，循环填充年份：\n\n```javascript\nvar d\
    \ = new Date();\nvar current_year = d.getFullYear();\nyear = document.getElementById('dob_year');\n\
    for(i=current_year; i>=(current_year - 100); i--){\n  op = document.createElement('option');\n\
    \  op.value = i;\n  op.innerHTML = i;\n  year.appendChild(op);\n}\n```\n\n运行良好，对于年份我们想要列出当前年份之前的\
    \ 100 年。我们将使用 `Date` 对象。\n\n太棒了，现在你填充了所需的字段，让我们重写一下 `user` 对象，以便有几个设置属性的方法：\n\n\
    ```javascript\nfunction user(name) {\n  this.name = name;\n  this.dob = '';\n\
    \  this.address = '';\n  this.city = '';\n  this.getName = function(){\n    return\
    \ this.name;\n  }\n  this.getCity = function(){\n    return this.city;\n  }\n\
    \  this.getAddress = function(){\n    return this.address;\n  }\n  this.getDob\
    \ = function(){\n    return this.dob;\n  }\n  this.setName = function(name){\n\
    \    this.name = name;\n  }\n  this.setCity = function(city){\n    this.city =\
    \ city;\n  }\n  this.setAddress = function(address){\n    this.address = address;\n\
    \  }\n  this.setDob = function(day, month, year){\n    this.dob = new Date(day,\
    \ month, year);\n  }\n  this.getHTML = function(){\n    var node = document.createElement('p');\n\
    \    node.setAttribute('style', 'padding:5px; border:1px solid #ccc;');\n    var\
    \ span = document.createElement('span');\n    span.innerHTML = 'Name : ' + this.getName()\
    \ + '<br/>';\n    span.innerHTML += 'Date of Birth : ' + this.getDob().toString()\
    \ + '<br/>';\n    span.innerHTML += 'Address : ' + this.getAddress() + '<br/>';\n\
    \    span.innerHTML += 'City : ' + this.getCity();\n    node.appendChild(span);\n\
    \    return node;\n  }\n}\n```\n\n上面是 `user` 声明的重写，现在我们有一组 getter 和 setter 方法。它看起来像很多代码，但仔细看，它只是每个属性对应的一个\
    \ getter 和 setter 方法。注意 `setDob` 方法创建了一个日期对象并将其赋值给 `dob` 属性。\n\n```javascript\n\
    var frm = document.getElementById('theForm');\nvar theList = new list();\nvar\
    \ ul = document.getElementById('ourList');\n\nfrm.onsubmit = function(){\n  var\
    \ usr = new user(document.getElementById('name').value);\n  // ... (从选项获取值的逻辑)\n\
    \  theList.add(usr, ul);\n  return false;\n}\n```\n\n## 验证并再次验证\n\n你刚刚构建了一个非常有实用的应用程序。但它很容易出错，我们需要确保输入的信息是有效的。首先，我们需要确保姓名、城市和地址字段不是空的。我们可以把所有的验证逻辑放在表单的处理器函数中，但这违背了面向对象编程的思想。难道不应该\
    \ `user` 对象来告诉我们提供它的信息是否有效吗？现在想起来很有道理，让我们在 `user` 声明中添加一个简单的函数，检查上述三个字段是否都不为空。它返回一个布尔值，表示创建的用户对象是否有效。如果对象是有效的，我们就将其添加到列表中；如果不是，我们将弹出错误消息。\n\
    \n在你的 `user` 对象中添加以下：\n\n```javascript\nthis.isValid = function(){\n  var errors\
    \ = [];\n  if(this.name.trim() == ''){\n    errors.push('Name is required');\n\
    \  }\n  if(this.city.trim() == ''){\n    errors.push('City is required');\n  }\n\
    \  if(this.address.trim() == ''){\n    errors.push('Address is required');\n \
    \ }\n  if(errors.length > 0){\n    alert(errors.join(','));\n    return false;\n\
    \  }else{\n    return true;\n  }\n}\n```\n\n这是一个简单的函数，检查列出的属性是否为空。无效的元素将导致布尔值\
    \ false 和一个糟糕的警告消息。对你的表单处理器进行以下调整：\n\n```javascript\nfrm.onsubmit = function(){\n\
    \  var usr = new user(document.getElementById('name').value);\n  ul = document.getElementById('ourList');\n\
    \  // ... (设置其他字段)\n  if(usr.isValid()){\n    theList.add(usr, ul);\n  }\n  return\
    \ false;\n}\n```\n\n## 移除用户\n\n我们有一个可以添加和显示用户的完全功能表单。然而，我们需要移除现有用户的能力。考虑为每个添加的元素添加一个显示“移除”的链接。点击此链接将从列表中删除元素。这意味着我们需要创建一个元素并附加一个\
    \ `onclick` 处理器，以便从列表中删除元素。让我们重做一下 `getHTML` 函数：\n\n```javascript\nthis.getHTML\
    \ = function(elem, index){\n  var node = document.createElement('p');\n  node.setAttribute('style',\
    \ 'padding:5px; border:1px solid #ccc;');\n  var span = document.createElement('span');\n\
    \  span.innerHTML = 'Name : ' + this.getName() + '<br/>';\n  span.innerHTML +=\
    \ 'Date of Birth : ' + this.getDob().toString() + '<br/>';\n  span.innerHTML +=\
    \ 'Address : ' + this.getAddress() + '<br/>';\n  span.innerHTML += 'City : ' +\
    \ this.getCity();\n  node.appendChild(span);\n  var rm = document.createElement('a');\n\
    \  rm.innerHTML = '(remove)';\n  rm.setAttribute('href', '#');\n  rm.onclick =\
    \ function(){\n    node.parentNode.removeChild(node);\n    this.remove(index);\n\
    \  };\n  node.appendChild(rm);\n  return node;\n}\n```\n\n等等，提供的文本有点碎片化了。让我们根据描述的逻辑重建最后的版本：\n\
    \n```javascript\nfunction list(){\n  this.list = [];\n  this.html = '';\n  this.add\
    \ = function(elem, ul){\n    this.list.push(elem);\n    ul.appendChild(this.getHTML(elem,\
    \ this.list.length-1));\n  }\n  this.buildHTML = function(elem){\n  }\n  this.getHTML\
    \ = function(elem, index){\n    var usr = elem.getHTML();\n    var li = document.createElement('li');\n\
    \    li.appendChild(usr);\n    var rm = document.createElement('a');\n    rm.innerHTML\
    \ = '(remove)';\n    rm.setAttribute('href', '#');\n    rm.onclick = function(){\n\
    \      li.parentNode.removeChild(li);\n      this.remove(index);\n    };\n   \
    \ li.appendChild(rm);\n    return li;\n  }\n  this.remove = function(index){\n\
    \    this.list.splice(index, 1);\n  }\n  this.get = function(index){\n    return\
    \ this.list[index];\n  }\n}\n```\n\n## 总结\n\n*   我们学会了 `navigator` 对象用于返回浏览器特定信息。\n\
    *   我们理解了 `geolocation` 如何工作以及如何显示当前用户的坐标。\n*   我们还理解了 `location` 对象以及如何跳转用户以及如何解析浏览器中的\
    \ URL。\n*   我们接触了 cookies 并理解了它们如何工作，以及如何设置、检索和销毁。\n\n## 作业\n\n### 练习 1\n创建一个使用\
    \ `prompt` 询问用户姓名的脚本。脚本应该设置 cookie 并存储它。当用户返回同一页面时，脚本必须检查 cookie 是否存在，如果存在，输出友好的\
    \ `Hello` 并称呼用户。\n\n### 练习 2\n在上面的脚本中创建一个点击时会删除 cookie 的链接。\n\n### 练习 3\n创建一个脚本获取用户的位置并将其存储在\
