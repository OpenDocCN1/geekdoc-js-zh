    # 我需要什么来开始？


    这就是使用 JavaScript 的魅力所在，你可以立即开始。你只需要你最喜欢的文本编辑器和一个浏览器。强烈推荐使用 SublimeText、Textmate
    和 Notepad++ 等文本编辑器。你也可以使用像 Dreamweaver 这样的 IDE，尽管那有点大材小用了。如果你真的很冒险，你一直可以使用老旧的记事本。


    对于浏览器，我们强烈建议使用 Firefox 或 Chrome，因为这两个浏览器都提供了调试和检查你代码的功能。对于本书来说，练习是在 firefox 浏览器上运行的，但任何浏览器都可以用来测试你的代码。


    虽然在系统上安装如 apache 或 IIS 等 Web 服务器非常有益，但并不是必要的，因为我们不会进行任何服务器端编码，而是主要关注使用 JavaScript
    进行前端脚本编写。


    # 快速回顾


    到目前，我们已经涵盖了关于 JavaScript 的很多，例如：


    * JavaScript 是一种客户端语言，因此它在浏览器中运行

    * JavaScript 是前端开发的必备技能

    * 它可以让静态网页更具交互性和动态性

    * Web 相关职业中对 JavaScript 有巨大的需求。

    * 客户端脚本可以减少服务器的负载

    * JavaScript 简直太棒且易于学习


    在下一章中，我们将开始编写 JavaScript 代码，并向你介绍该语言的基础构建模块，同时让你开始编写传统的 JavaScript Hello World
    应用程序。


    # 第 1 章：Hello JavaScript


    为了开始学习 JavaScript，我们将使用 JavaScript 构建一个传统的 Hello world 应用程序。在本书过程中，我们将专注于通过实时编码来学习
    JavaScript，并带你阅读代码，解释它的作用以及它是如何工作的。让我们先设置你的工作区。


    ## 设置你的工作区


    正如我们所说，开始学习 JavaScript 并不需要很多要求。首先，启动你首选的文本编辑器并打开你的浏览器。


    此时，如果你想做一些服务器端编程，可能想要考虑安装一个 Web 服务器。但是，为了学习 JavaScript 本身，这并不是必要的。本书的范围不包括安装 Web
    服务器的过程，因为网上有大量的资源可以用来设置 Web 服务器。


    你可能希望安装一个 apache 或 IIS 服务器。对于运行 windows 的用户，可以获取基于 apache 的安装包，如 WAMP 和 XAMP，它们会为你安装并配置
    apache 加上 php 和 mysql。或者，如果你的 windows 机器上安装了 IIS，那就足够了。


    你系统上的 Web 服务器作用就像在线上的任何普通服务器一样，只是规模较小一些。


    在你的 Web 服务器上，你有一个文件夹来存储你的网站。在 Apache 上，这个文件夹通常是：


    `/path/to/apache/www`


    或 `/path/to/apache/htdocs`


    在 IIS 上，该文件夹的路径将是


    `C:/InetPub/wwwroot`


    ..假设你在 C 盘设置了 IIS。


    这被称为你 Web 服务器的根目录，在本书过程中，对根目录的任何引用都指向这个特定文件夹，无论你运行的是 IIS 还是 Apache。


    ## 代码


    在根目录中，创建一个新目录，我们称之为 lessons。我们将把所有的课程都存储在该目录下的独立文件夹中。在该文件夹中创建一个新目录并给它命名——我们叫它
    `lesson-1`。完成后，启动你最喜欢的浏览器并导航到该目录。确保你的服务器正在运行，并在浏览器的地址栏中输入（假设你已经）：


    `http://localhost/lessons/lesson-1`


    然后什么都没有显示。这是显而易见的，因为我们还没有创建一个默认的索引页。在你的 lesson-1 文件夹中创建一个新文件并将其命名为 `index.html`。


    添加一些基础 HTML：


    ```html

    <html>

    <head>

    <title>Learning JavaScript</title>

    </head>

    <body>


    </body>

    </html>

    ```


    这是一个只有 body 标签闭合标签的空白 HTML 页面。现在让我们开始编写基础脚本。


    ## script 标签


    由于我们熟悉 HTML，现在是时候看看 `script` 标签了。让我们写一段基础的：


    ```html

    <html>

    <head>

    <title>Learning JavaScript</title>

    </head>

    <body>


    <script language="JavaScript">

    // 代码写在这里

    </script>


    </body>

    </html>

    ```


    刷新浏览器中的页面，你应该看到 Hello World。


    ## 发生了什么？


    让我们先看看我们的代码。所有的 JavaScript 代码都封装在 `script` 标签中。


    ```javascript

    document.write(''Hello World'');

    ```


    `document.write` 是一个简单输出传递给它的内容的函数。现在只需要理解函数是一段接受参数并执行操作的代码。稍后我们将详细介绍函数。但目前我们应该明确传递给
    `document.write` 的任何内容都会输出到浏览器。


    另外注意行尾有一个分号 `;`。在 JavaScript 中编写代码时，所有代码行都必须以分号结束。这是一个语法要求，如果你用过 C 或 C++，你可能已经觉得这非常熟悉。


