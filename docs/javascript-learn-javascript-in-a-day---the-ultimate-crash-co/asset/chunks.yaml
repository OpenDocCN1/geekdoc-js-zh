    this opens up a prompt box where the user is ''prompted'' to enter some information.
    For example:


    var name = prompt(''What is your name?'');


    if(name != ''''){


      document.write(''Hello '' + name);


    }else{


      document.write(''You didn\''t enter your name!'');


    }


    The above code prompts the user to enter his name, the entry from the user is
    taken in the name variable. This is a very simple example of interaction from
    the user and the application responding to client interaction.


    ## Summary


    We''ve covered a lot of ground here and have gone over:


    *   Variables, the different types of variables that JavaScript supports


    *   Assignment operators


    *   Arithmetic operators


    *   Logical Operators


    *   Conditional Operators


    # Chapter 3: Conditions conditions and more conditions


    In the last chapter we touched upon the different variable types as well as the
    core syntax for constructing an expression in JavaScript. We should be able to
    make use of the basic operators to conduct mathematical and logical evaluations.
    But coding is more than just fancy arithmetic and logical dribble. Just like in
    life, everything doesn''t move in a straight line, the same applies to coding
    - you need to to almost make make room for a detour or exception.


    ## Objectives


    In this chapter you will learn about the various conditional statements used in
    JavaScript to execute code based on specific conditions. The conditions would
    make use of operators learnt in the previous chapter. We''ll touch upon the different
    conditional statements and make use of a real life practical application to understand
    their usage.


    ## The - IF - condition


    The most basic and fundamental conditional statement you can use in JavaScript.
    There is no piece of code on earth that doesn''t involve an IF statement at some
    point. The If statement is construed as follows:


    if(expression){ // if expression evaluates to true run the code in brackets


      //code here


    }


    The if statement checks if an expression is true and then executes the code in
    the enclosed brackets. This is similar to the conditional operator that we used
    in the previous chapter only its a bit more readable. Here is an example of an
    if statement


    var a = 10;


    if(a == 10){


        document.write(''Booyah'');


    }


    The above code checks if the statement a==10 evaluates to true, which it does
    and then prints out the word Booyah. The If statement can check more than one
    expression at the same time.


    var a = 10, b = 12;


    if((a == 10)&&(b==12)){        // evaluates true so the code is executed


        document.write(''Booyah'');


    }


    if((a > 1)&&(b<12)){  // evaluates as false


        document.write(''Booyah Again''); // this is never printed


    }


    As we learnt earlier on the usage of logical operators, we can now see their practical
    applications in the conditional statement. Just like the logical operators here
    is an example of the NOT operator used in an IF statement


    var a = 10, b = 12;


    if(!(a == 10)){        // returns false


        document.write(''Booyah'');  // this is never run


    }


    if(!(a < 10)){        // returns true


        document.write(''Booyah'');  // this runs


    }


    The code block within the IF statement is regular JavaScript code. Here is an
    example of the IF statement mimicking the conditional operator.


    var a = 10, b = 12;


    var c = 0;


    c = a == 10 ? 11 : 0;


    if(a == 10){  // this is the same as writing the above


        c = 11;


    }


    The conditional IF statement makes for better reading than the conditional operator
    although with the conditional operator you can execute a conditional statement
    on one line. You can also do the same with the conditional IF operator provided
    you understand that all individual statements and expressions in JavaScript end
    with a semicolon. So the following is perfectly valid JavaScript:


    var a = 10;


    var c = 0;


    if(a == 10){c = 11;} // this works - but doesn''t read too well


    ## There''s also an - else - to that


    The If statement can be written on its own, however in case you wish to evaluate
    code should the IF statement not be successfully evaluated then that is where
    JavaScript allows you add an else statement to that.


    var a = 10;


    var c = 0;


    c = a == 10 ? 11 : 0;


    if(a == 10){  // now this is completely the same as writing the above


        c = 11;


    }else{


        c = 0;


    }


    The else statement extends on the conditional statement enabling the following
    block of code to be executed only if the If statement fails. So the following
    bit of code is not the same as the code above.


    var a = 10;


    var c = 0;


    c = a == 10 ? 11 : 0;


    if(a == 10){


        c = 11;


    }


    c = 0; // this will always run as it is not in an enclosed if - else statement


    The above code is not a complete if - else statement. The expression at the bottom c
    = 0; is not bound to any logical statement i.e. it will run whether or not a equals 10 or
    not. Any code that needs to be executed when the expression in the IF statement
    doesn''t evaluate put it in the corresponding else statement.


    Here is a more practical example:


    var name = '''';


    if(name == ''''){


      document.write(''Name cannot be blank!'');


    }else{


      document.write(''Your name is '' + name);


    }


    The statement checks if the name variable is empty, in which case it outputs an
    error message. The same logic can be rewritten in the following way:


    var name = '''';


    if(name != ''''){


      document.write(''Your name is '' + name);


    }else{


      document.write(''Name cannot be blank!'');


    }


    Here the If statement checks if the name variable isn''t empty -its all up to
    how you wish to implement the logic in your system. At the same time it’s also
    possible for you to write this statement with out the IF-Else statement and using
    just the conditional operator we spoke of earlier.


    var name = '''';


    document.write((name != '''')?''Your name is '' + name : ''Name cannot be blank!'');


    You can see how malleable and versatile the JavaScript language is, we can achieve
    the same logic using a conditional operator - although it makes for difficult
    reading and is not a good practice. Try and ensure that you don''t have too much
    going on per line of code. It will save you many endless hours of debugging woes
    as your code gets more complex.


    You can also attach another if condition to your - else statement further on extending
    the conditional statement. The Else - clause is run if the expression in the IF
    statement doesn''t evaluate to true. However you can add a further if and else
    statement if you wish to be more specific. For example:


    var name = '''';


    if(name == ''''){


        document.write(''Name cannot be blank!'');


    }else if(name == ''Bob''){            // the name isn''t empty check if it is
    Bob


        document.write(''Your name is Mr. Bob'');


    }else{        // the name is neither empty nor is it Bob


      document.write(''Your name is not Bob but '' + name);


    }


    The above statement runs a second if statement when the first one fails. You can
    daisy chain if statements this way one after the other to check for for specific
    conditions as per your requirements.


    Note the space between the else and the following if statement, not leaving a
    space would be an error and your code would not run.


    ## Nesting Conditions


    Imagine a situation, now we''re going to consider more practical situations here
    on. You need to check if you have ten eggs and further more if they''re fresh
    or not. You could work out something like this:


    var number_of_eggs = 10;


    var eggs_are = ''fresh'';


    if((number_of_eggs == 10)&&(eggs_are == ''fresh'')){


      // do something


    }


    if((number_of_eggs == 10)&&(eggs_are != ''fresh'')){


