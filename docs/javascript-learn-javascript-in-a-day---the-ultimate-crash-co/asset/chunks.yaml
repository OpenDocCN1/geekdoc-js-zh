  trans: "\n`do while` 循环是 `while` 循环的一种变体。在 `while` 循环甚至 `for` 循环中，条件是在循环运行之前测试的；而在\
    \ `do while` 循环中，执行循环的条件是在迭代之后测试的。这意味着即使循环条件被求值为假，`do while` 循环也会至少运行一次。\n\n`do\
    \ while` 循环的基本语法如下：\n\n```javascript\ndo{\n// code to be executed\n}while(expression)\n\
    ```\n\n就像 `while` 循环一样，你需要在循环本身之前初始化条件中使用的变量，并在代码块中放入迭代变量的代码。否则，你最终将导致：在变量未初始化的情况下代码无法运行，或者在没有定义迭代器的情况下代码永远不会停止，直到崩溃你的浏览器。上面的示例可以重写为\
    \ `do while` 循环，如下：\n\n```javascript\nvar i = 0;\n\ndo{\n  document.write('I will\
    \ not drive in a no driving zone.<br/>');\n  i++;\n}while(i < 10 )\n```\n\n`do\
    \ while` 语句与 `while` 语句之间的区别可以通过以下示例看到。\n\n```javascript\nvar i = 0;\n\nwhile(i\
    \ != 0 ){\n  document.write('While loop runs.<br/>');\n  i++;\n}\n\nvar i = 0;\n\
    \ndo{\n  document.write('Do while runs.<br/>');\n  i++;\n}while(i !=0 )\n```\n\
    \n我们为两个循环设置的条件都是当变量 `i` 等于零时停止递增——在这种情况下，变量已经初始化为零，因此在循环运行之前条件已经满足了。然而，对于 `while`\
    \ 循环来说确实如此，但在 `do while` 循环的情况下——显而易见，代码块在测试条件之前就已经执行了。因此，结果是 `while` 循环完全不会运行，但\
    \ `do while` 循环在测试条件之前至少运行一次。\n\n## 嵌套循环\n\n就像嵌套条件语句一样，我们也可以在 JavaScript 中嵌套循环。嵌套循环是指在一个循环内部包含另一个循环。为了演示这一点，我们将使用\
    \ JavaScript 通过两个循环语句创建一个具有特定数量行和单元格的表格。为了让它更有趣，我们顺便打印出一个乘法计算表。让我们来看以下代码：\n\n\
    ```javascript\nvar tbl = '';\n\ntbl = '<table>';\n\ntbl = tbl + '</</table>>';\n\
    \ndocument.write(tbl);\n```\n\n这并没有做什么，但让我们看看上面的代码，我们引入了一种更简单的方法来输出大量文本。与其一直使用\
    \ `document.write` 语句来处理我们需要写入屏幕的所有内容，我们不如将字符串数据赋值给变量。请注意，对于字符串，`+` 运算符起着连接符的作用，因此会拼接字符串以形成新字符串。在上面的代码中，我们只是创建了一个没有行和单元格的简单\
    \ `<table>` 元素。让我们用循环为我们的表格添加 10 行。\n\n```javascript\nvar tbl = '';\n\ntbl = '<table>';\n\
    \nfor( i = 1; i <= 10; i++ ){\n  tbl = tbl + '<tr>';\n  tbl = tbl + '</tr>';\n\
    }\n\ntbl = tbl + '</</table>>';\n\ndocument.write(tbl);\n```\n\n还不错，现在让我们创建一些单元格。记得我们需要为每一行创建十单元格。这可以通过在创建行的循环内部嵌套另一个循环来实现。\n\
    \n```javascript\nvar tbl = '';\n\ntbl = '<table>';\n\nfor( i = 1; i <= 10; i++\
    \ ){\n  tbl = tbl + '<tr>';\n  for( j = 1; j <= 10; j++ ){\n    tbl = tbl + '<td>';\n\
    \    tbl = tbl + ( i * j );\n    tbl = tbl + '</td>';\n  }\n  tbl = tbl + '</tr>';\n\
    }\n\ntbl = tbl + '</</table>>';\n\ndocument.write(tbl);\n```\n\n注意，在嵌套循环中，我们使用了不同的变量\
    \ `j` 进行迭代，这样就不会混淆两个循环之间的迭代变量了。让我们分析一下代码，看看它是如何工作的。\n\n我们有第一个 `for` 循环，我们称之为外层循环，因为它包含了另一个循环。当外层循环运行时，它会在内部运行内循环十次，外层循环每运行一次就会创建一个行，所以我们得到了十行。同时，每当外层循环运行时，每次迭代都会运行内循环。内循环在外层循环的每次迭代中运行十次，也就是说内循环有它自己的迭代，这就是我们每行都有十个单元格的原因。乘法简单地通过外层循环的迭代变量乘以内层循环的迭代变量来完成。\n\
    \n相同的循环可以使用 `while` 循环重新创建。\n\n```javascript\nvar tbl = '';\n\ntbl = '<table>';\n\
    var i = 1;\n\nwhile(i <= 10){\n  tbl = tbl + '<tr>';\n  var j = 1;\n  for( j <=\
    \ 10){\n    tbl = tbl + '<td>';\n    tbl = tbl + ( i * j );\n    tbl = tbl + '</td>';\n\
    \    j++ ;\n  }\n  tbl = tbl + '</tr>';\n  i++ ;\n}\n\ntbl = tbl + '</</table>>';\n\
    \ndocument.write(tbl);\n```\n"
- fmt: "\nFunctions are declared by using the `function` keyword followed by the name\
    \ of the function - circle brackets and the code in enclosed curly brackets. A\
    \ function can be named in pretty much the same way as a variable is named i.e.\
    \ they consist of only alphanumerics and underscores and cannot start with a number.\
    \ The example below is an example of a function that returns a message.\n\n```javascript\n\
    function greet(name){\n    return 'Hello ' + name;\n}\n```\n\nFunctions can accept\
    \ parameters and can return values. In the above example the function called `greet`\
    \ accepts a parameter called `name`. The `return` keyword does two things, first\
    \ it breaks out of the function and secondly returns a value whenever the function\
    \ is invoked. The above function can be invoked as below:\n\n```javascript\ngreet('Bob');\n\
    ```\n\nRunning this code doesn't appear to do anything, because the function has\
    \ returned a value and we havent done anything with it. Let’s capture the value\
    \ returned by the function in a variable.\n\n```javascript\nvar greeting = greet('Bob');\n\
    document.write(greeting);\n```\n\nIn the above example the `greeting` variable\
    \ is assigned the value retunred by the `greet()` function in this case, we passed\
    \ the string 'bob' to the function. The function returned 'Hello Bob' and since\
    \ we've printed that to the screen using `document.write` - you would see it on\
    \ the page. This is roughly how functions work. Prior to this we've actually made\
    \ use of a few native JavaScript functions which act the same way as the function\
    \ defined above.\n\n## A few native JavaScript functions\n\nIn our previous chapters\
    \ we were introduced to some core native JavaScript functions such as the `alert`,\
    \ `confirm` and `prompt` functions. All these functions take in parameters and\
    \ return values similar to our simple example. For example when making a call\
    \ to `confirm`:\n\n```javascript\nvar a = confirm('Are you sure?');\n```\n\nWe\
    \ pass in a parameter namely the message to be displayed in the `confirm` popup\
    \ box, and the function in return shows the box, captures the users selection\
    \ and returns either a true or false value based on the users selection. This\
    \ is also the same with the `prompt` function.\n\n## Assigning a function to a\
    \ variable\n\nIn JavaScript there is more than one way to declare a function.\
    \ A function can also be assigned to a variable - technically it would still be\
    \ a function declaration. For example the above function could very well be rewritten\
    \ as below:\n\n```javascript\nvar greet = function(name){ return 'Hello '+name;};\n\
    ```\n\nKeep in mind that when invoking a function that it is always invoked with\
    \ `()` following it. If you try to invoke a function without the following brackets\
    \ - it returns the entire definition of the function. So in the above example:\n\
    \n```javascript\nvar greet = function(name){ return 'Hello '+name;};\ndocument.write(greet('Bob'));\
    \ // prints 'Hello Bob';\ndocument.write(greet); // prints function(name){ return\
    \ 'Hello '+name;};\n```\n\nOnce a function has been declared it can be further\
    \ assigned to another variable. For example:\n\n```javascript\nvar greet = function(name){\
    \ return 'Hello '+name;};\nvar g = greet;\ng('Bob'); // is the same as greet('Bob');\n\
    ```\n\nThis is a subtle yet huge difference that the `()` brackets can make when\
    \ working with functions. Functions allow you to reuse the same code with different\
    \ variables. If you have a bit of code that would obviously be used again or completes\
    \ a set of functionality on its own - it’s a good idea to put it into a function\
    \ and make a function call.\n\n## Passing parameters to functions\n\nFunctions\
    \ would not be of much use if you couldn't get customized results from them. Parameters\
    \ passed to functions are accessible within the function by the parameter name\
    \ given to the parameter during the declaration. In JavaScript you have the choice\
    \ to declare the parameters to be passed or not to declare. In the above example\
    \ we explicitly mentioned the name of the first parameter to be used during the\
    \ scope of the function i.e. in this case `name`. So you could pass any variable\
    \ to the function, but within the function it would be referred to by the name\
    \ the function was declared with.\n\nYou can pass as many parameters as declared\
    \ to the function. For example:\n\n```javascript\nfunction add(num1, num2){\n\
    \    return num1 + num2;\n}\nadd(2,3); // returns 5\n```\n\nAny parameter you've\
    \ declared in the function declaration can be referred to by the name it was declared\
    \ with like in the above example the two parameters passed to the function are\
    \ `num1` and `num2` respectively. If for some reason not all of the function parameters\
    \ are passed:\n\n```javascript\nfunction add(num1, num2){\n    return num1 + num2;\n\
    }\nadd(10) //\n```\n\nThe above would yield an error because `num2` has not been\
    \ passed a value and is hence `undefined`. Alternatively you can also pass more\
    \ than the declared number of parameters such as:\n\n```javascript\nfunction add(num1,\
    \ num2){\n    return num1 + num2;\n}\nadd(10, 12, 34, 5, 33) //\n```\n\nIn the\
    \ above example we've passed more than the declared parameters but they cannot\
    \ be referenced in the function because we haven't declared for them any name\
    \ in the function definition. However this won't cause an error. To access such\
    \ parameters we would make use of a built in JavaScript Object which is accessible\
    \ to all functions called the `arguments` object. We'll talk in detail about Objects\
    \ in a later chapter but for now just understand that an Object is a special piece\
    \ of code that has variables and defined functions. The `arguments` Object is\
    \ actually an array which corresponds to all the parameters that have been passed\
    \ to a function. Lets rewrite our `add` function to take in an unlimited number\
    \ of parameters.\n\n```javascript\nfunction add() {\n    var total = 0;\n    for\
    \ (var i = 0; i < arguments.length; i++) {\n        total+= arguments[i];\n  \
    \  }\n    return total;\n}\nadd(2, 55, 88, 90, 17);\n```\n\nIn the above example\
    \ we looped through the arguments array - know that an array is a sequential list\
    \ of values each accessible through a numeric index. The `arguments.length` tells\
    \ us how many parameters have been passed so we can loop through the entire array.\
    \ Each element in the arguments is accessed by the index it is at so `[0]` returns\
    \ the first element and so forth. We'll talk in detail about arrays in the next\
    \ chapter but for now you can see how versatile functions can be.\n\n## The recursive\
    \ function\n\nRecursion is an important concept in programming, this is where\
    \ a function invokes itself. A number of mathematical expressions would warrant\
    \ a situation where simply making a function call with a loop is just not possible.\
    \ Forexample if you were to create a function that would calculate the factorial\
    \ of a number, the factorial of a number is calculated by multiplying all the\
    \ numbers from 1 to the number in question. You could calculate the factorial\
    \ with a loop as:\n\n```javascript\nfunction factorial(num){\n    var result =\
    \ num;\n    while (num-- > 2) {\n        result *= num;\n    }\n    return result;\n\
    }\nfactorial(10);\n```\n\nThe above function perfectly calculates the factorial\
    \ of a number greater than 2. If we were to do away with the while loop and code\
    \ a recursive function we would have the following code:\n\n```javascript\nfunction\
    \ factorial(num){\n    if (num == 0) { // The factorial of zero is always one\n\
    \        return 1;\n    }else {\n        return (num * factorial(num - 1));\n\
    \    }\n}\nfactorial(10);\n```\n\nA recursive function needs a conditional statement\
    \ that would break the cycle of recursion - in this case once the `num` value\
    \ passed to `factorial` becomes 0 the factorial function is no longer called and\
    \ thus the function returns the final result. Recursion can be a bit daunting\
    \ at first, and it’s easy to accidentally code a recursive function that doesn't\
    \ know when to stop calling itself resulting in an infinite loop. Recursion is\
    \ normally favoured over loop statements as it tends to simplify code.\n"
  raw: 'Functions are declared by using the function keyword followed by the name
    of the function - circle brackets and the code in enclosed curly brackets. A function
    can be named in pretty much the same way as a variable is named i.e. they consist
    of only alphanumerics and underscores and cannot start with a number. The example
    below is an example of a function that returns a message.


    function greet(name){


        return ''Hello '' + name;


    }


    Functions can accept parameters and can return values. In the above example the
    function called greet accepts a parameter called name. The return keyword does
    two things, first it breaks out of the function and secondly returns a value whenever
    the function is invoked. The above function can be invoked as below:


    greet(''Bob'');


    Running this code doesn''t appear to do anything, because the function has returned
    a value and we havent done anything with it. Let’s capture the value returned
    by the function in a variable.


    var greeting = greet(''Bob'');


    document.write(greeting);


    In the above example the greeting variable is assigned the value retunred by the greet() function
    in this case, we passed the string ''bob'' to the function. The function returned
    ''Hello Bob'' and since we''ve printed that to the screen using document.write
    - you would see it on the page. This is roughly how functions work. Prior to this
    we''ve actually made use of a few native JavaScript functions which act the same
    way as the function defined above.


    ## A few native JavaScript functions


    In our previous chapters we were introduced to some core native JavaScript functions
    such as the alert, confirm and prompt functions. All these functions take in parameters
    and return values similar to our simple example. For example when making a call
    to confirm:


    var a = confirm(''Are you sure?'');


    We pass in a parameter namely the message to be displayed in the confirm popup
    box, and the function in return shows the box, captures the users selection and
    returns either a true or false value based on the users selection. This is also
    the same with the prompt function.


    ## Assigning a function to a variable


    In JavaScript there is more than one way to declare a function. A function can
    also be assigned to a variable - technically it would still be a function declaration.
    For example the above function could very well be rewritten as below:


    var greet = function(name){ return ''Hello ''+name;};


    Keep in mind that when invoking a function that it is always invoked with () following
    it. If you try to invoke a function without the following brackets - it returns
    the entire definition of the function. So in the above example:


    var greet = function(name){ return ''Hello ''+name;};


    document.write(greet(''Bob'')); // prints ''Hello Bob'';


    document.write(greet); // prints function(name){ return ''Hello ''+name;};


    Once a function has been declared it can be further assigned to another variable.
    For example:


    var greet = function(name){ return ''Hello ''+name;};


    var g = greet;


    g(''Bob''); // is the same as greet(''Bob'');


    This is a subtle yet huge difference that the () brackets can make when working
    with functions. Functions allow you to reuse the same code with different variables.
    If you have a bit of code that would obviously be used again or completes a set
    of functionality on its own - it’s a good idea to put it into a function and make
    a function call.


    ## Passing parameters to functions


    Functions would not be of much use if you couldn''t get customized results from
    them. Parameters passed to functions are accessible within the function by the
    parameter name given to the parameter during the declaration. In JavaScript you
    have the choice to declare the parameters to be passed or not to declare. In the
    above example we explicitly mentioned the name of the first parameter to be used
    during the scope of the function i.e. in this case name. So you could pass any
    variable to the function, but within the function it would be referred to by the
    name the function was declared with.


    You can pass as many parameters as declared to the function. For example:


    function add(num1, num2){


        return num1 + num2;


    }


    add(2,3); // returns 5


    Any parameter you''ve declared in the function declaration can be referred to
    by the name it was declared with like in the above example the two parameters
    passed to the function are num1 and num2 respectively. If for some reason not
    all of the function parameters are passed:


    function add(num1, num2){


        return num1 + num2;


    }


    add(10) //


    The above would yield an error because num2 has not been passed a value and is
    hence undefined. Alternatively you can also pass more than the declared number
    of parameters such as:


    function add(num1, num2){


        return num1 + num2;


    }


    add(10, 12, 34, 5, 33) //


    In the above example we''ve passed more than the declared parameters but they
    cannot be referenced in the function because we haven''t declared for them any
    name in the function definition. However this won''t cause an error. To access
    such parameters we would make use of a built in JavaScript Object which is accessible
    to all functions called the arguments object. We''ll talk in detail about Objects
    in a later chapter but for now just understand that an Object is a special piece
    of code that has variables and defined functions. The arguments Object is actually
    an array which corresponds to all the parameters that have been passed to a function.
    Lets rewrite our add function to take in an unlimited number of parameters using
    the newly discovered arguments object.


    function add() {


        var total = 0;


        for (var i = 0; i < arguments.length; i++) {


            total+= arguments[i];


        }


        return total;


    }


    add(2, 55, 88, 90, 17, 100, 23);


    In the above example we looped through the arguments array - know that an array
    is a sequential list of values each accessible through a numeric index. The arguments.length
    tells us how many parameters have been passed so we can loop through the entire
    arguments array. Each element in the array of arguments is accessed by the index
    it is at so argument [0] returns the first element in the array and so forth.
    We''ll talk in detail about arrays in the next chapter but for now you can see
    how versatile functions in JavaScript can be.


    ## The recursive function


    Recursion is an important concept in programming, this is where a function invokes
    itself. A number of mathematical expressions would warrant a situation where simply
    making a function call with a loop is just not possible. Forexample if you were
    to create a function that would calculate the factorial of a number, the factorial
    of a number is calculated by multiplying all the numbers from 1 to the number
    in question. You could calculate the factorial with a loop as below:


    function factorial(num){


        var result = num;


        while (num-- > 2) {


            result *= num;


        }


        return result;


    }


    factorial(10);


    The above function perfectly calculates the factorial of a number greater than
    2\. If we were to do away with the while loop and code a recursive function we
    would have the following code:


    function factorial(num){


        if (num == 0) {    // The factorial of zero is always one


            return 1;


        }else {


            return (num * factorial(num - 1));


        }


    }


    factorial(10);


    A recursive function needs a conditional statement that would break the cycle
    of recursion - in this case once the num value passed to factorial becomes 0,
    the factorial function is no longer called and thus the function returns the final
    result. Recursion can be a bit daunting at first, and it’s easy to accidentally
    code a recursive function that doesn''t know when to stop calling itself resulting
    in an infinite loop. Recursion is normally favoured over loop statements as it
    tends to simplify code.


    ## Scoping?'
