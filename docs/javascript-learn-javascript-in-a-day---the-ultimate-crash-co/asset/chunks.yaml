    这本书并不会让你一夜之间成为 JavaScript 忍者，即使你把整本书读了十遍并完成了其中所有的练习，而且我们甚至并不打算这样做。定义大师、忍者与新手之间区别的编程边界每天都在被重新定义。这本书绝对能让你掌握使用
    JavaScript 所需的核心概念，在此之后，学习高级概念将成为你的事性本能。你将学习 JavaScript 编码的最佳实践，以及成为更优秀程序员的必经的核心编程概念。


    读完此书后，你将对如何使用 JavaScript 编程有深入的理解，并完成一系列练习，这些练习将引导你从基础的介绍概念走向完整的实世界场景。在书的最后，你将着手开发一个实际应用，利用你在整个课程过程中所学到的所有技能。


    # 什么是 JavaScript？


    让我们从顶端开始，JavaScript 到底是什么。JavaScript 是一种客户端脚本语言。在 Web 开发领域，你会有客户端语言和服务器端语言。服务器端语言是用于编写在服务器上解析和执行的页面的语言，包括
    `Php`、`ASP`、`ASP.NET` 和 `Ruby` 等语言。


    客户端语言在浏览器中执行或运行——因此得名“客户端”。在这种情况下，“客户端”即浏览器向服务器发送请求，服务器反过来“提供”显示给你的 HTML。每当你向浏览器的
    URL 框输入一个 Web URL 时，你都在向服务器发送请求，服务器随后回传一个 HTML 网格并显示在你的浏览器中。你的浏览器解析这些 HTML 并将其展示给你。


    # JavaScript 能做什么？


    正如所述，JavaScript 的代码被设计为在客户端运行，因此它运行在你的浏览器中。正是因为有了 JavaScript，网页才不再仅仅是静态的。JavaScript
    让网页能够展现出比仅仅点击链接打开新页面多得多的交互。这显然在你访问过的几乎每个网站上都注意到了。例如：


    *   那些要求你提供手机号码和邮箱的烦人弹窗

    *   页面上的时间似乎与你的时钟同步跳动

    *   当你输入错误内容时，那些会亮起红色的表单字段

    *   那些酷炫的淡入和滑动动画

    *   那些似乎记得你上次访问时的偏好的网站

    *   当你点击提交按钮时，那些似乎无需刷新页面就能自动更新的列表


    所有这些以及更多都归功于 JavaScript。JavaScript 客户端脚本的另一个关键方面也是减少向服务器发送的请求数量或容量。例如，考虑以下情况：


    你需要在网站的访客簿表单中输入访问者的姓名、邮箱和留言。为了确保用户输入正确的详细信息，你在服务器端脚本（让我们假设它是 `php`）中编写了一个基础验证模块，以检查提交的每个访客簿条目是否填写正确，即邮箱是有效的邮箱，姓名是真实的姓名。如果有人输入了错误内容，你的服务器必须运行验证，然后返回相同的页面并附带错误消息，要求他重新输入。如果你在服务器端代码的同时，也在页面本身使用
    JavaScript 编写了一个类似的验证脚本，在表单提交 **之前** 检查条目——你不仅减少了向服务器发出的 `HTTP` 请求次数，还让终端用户无需等到在填写并提交表单后才发现自己犯了错。


    这是一个非常简单的例子——想象一下，如果表单异常巨大，而用户正处于慢速连接，这会让终端用户有多抓狂。


    # 我为什么应该学习 JavaScript？


    直率地说，JavaScript 可能是任何开发者必须学习的第一种编程语言。更直白地说，对于任何对 Web 开发有一点点认真的人来说，在考虑任何其他脚本语言（无论是客户端脚本还是后端服务器脚本）之前，了解
    JavaScript 是至关重要的。以下是几个原因：


    ### 易于学习和使用


    说认真的，JavaScript 学习起来非常简单，而且用起来很愉快。你不需要很多东西就可以开始学习 JavaScript，随着代码的编写，你可以即时看到工作的成果。这与使用如
    `Php` 和 `ASP` 等服务器端脚本进行编码完全不同，在后者中你绝对需要一个服务器来执行你的脚本。有了 JavaScript，你只需要一个浏览器就可以大显身手。


    # JavaScript 可以做到 HTML 做不到的任何事情


    JavaScript 赋予你权力和灵活性，允许终端用户操纵你网页上的内容。通过 JavaScript，你可以验证表单中输入的内容，允许终端用户更改页面内容，甚至与页面上的元素本身进行交互。你还可以设置代码在不同事件上执行，例如有人点击按钮、鼠标悬停在图片上、离开页面甚至尝试关闭页面时会发生什么。简而言之，你对用户如何以及与什么拥有大量的控制权，为你的网页赋予了全新的维度。


    ### 用户体验取决于它


    回到我们那个巨大表单的例子，想象一个处于非常慢的连接上的、心情非常沮丧的用户。他发现了这个咨询师网站，必须输入一条留言和一个有效的电话号码。这个可怜的人写下了所有的生活烦恼：他的女友如何离开他去找了他的好朋友，他如何欠了车贷贷款，他收到的止收通知，以及那个导致他彻夜难眠的漏水龙头——但在这一切中，他忘记了输入有效的电话号码，并提交了表单等待回复。由于某种原因，有人忘记添加服务器端验证，因此现在没有办法与他取得联系了。你的用户坐回那里等了几天，疑惑为什么没有人打电话，最终半死不活地认定世界根本不在乎他。


    好了，刚才那有点戏剧化了，但你可以理解这是何故。网站不应该是笨肿的，而且静态 HTML 无法实现多少交互。


    ### 高需求量


    JavaScript 的需求很大，几乎每个 Web 开发者都被要求掌握某种程度的 JavaScript。Web 开发需要熟悉你最终会被要求使用的所有工具和技术。你只需要看看招聘公告板上的职位要求，就能看到针对熟悉
    JavaScript 或熟悉许多 JavaScript 库之一的人员——例如 `jQuery` 和 `BackboneJS`（关于这些厉害家伙的内容将在书后部分介绍）——的空缺职位。


    ## 人们使用 JavaScript 多久了？


    JavaScript 已经存在很久了。它最初由 Brendan Eich 在 90 年代初在 Netscape 开发，旨在用于 Netscape Communicator
    浏览器。他开发这种语言的目标是让网页更动态、更有交互性。有趣的是，JavaScript 和 Java 编程语言之间除了共享 "java" 这个词外，没有任何关联。

