  raw: 'These three events occur every time you tap a key on the keyboard and the
    occur in the exact same order as above. When you press a key the first event to
    be fired is the keydown event, once the key has been pressed the keypress event
    is fired at the end when you release the key - the keyup event has been fired.


    As a matter of convention use the keydown event as it fires for all keys in all
    browsers


    The keyboard functions obviously for sake of ease of usage aren''t like the mouse
    events where you can just interact with anything as you can''t really maneuver
    the page much with just a keyboard except for form elements. So we''ll try this
    with an example form element. Set up the following html and JavaScript respectively.


    <input id="foo" />


    <div id="counter"></div>


    var el = document.getElementById(''foo'');


    el.onkeydown = function(){


      counter = document.getElementById(''counter'');


      counter.innerHTML = this.value.length


    }


    Run that and you have a text box. Type in it and you should see a counter increment
    and decrement as you type. All form elements have a property called value which
    returns the value that has been entered into the element. Every time you make
    a keypress the event is fired which triggers the handler, which in turn fills
    the counter with the string length of the text entered in the text field.


    What if you needed to be specific with respect to the keys that are entered? Let’s
    assume you want the counter to only fire if the spacebar is passed, there has
    to be a way to track which key is pressed. Luckily in JavaScript using the event
    handlers, this is as simple as passing a parameter to your handler. So far we
    haven''t passed any parameters explicitly to our parameters, but for every event
    handler an event object is passed to all our events. Let’s declare a variable
    for the first parameter passed to our event handler.


    var el = document.getElementById(''foo'');


    el.onkeydown = function(e){


      counter = document.getElementById(''counter'');


      if(e.keyCode==32){


        counter.innerHTML = this.value.length


      }


    }


    Run that code and type, we see that only when the space bar is pressed does the
    even handler take action. There is a lot that seems to be going on in the above
    code. We''re using the variable e to refer to the event object which is automatically
    passed to the event handler. This event Object carries information about the event
    that has just occurred and one of the properties of the event is the keyCode property.
    This contains the key code value for the key that was pressed. These are unicode
    values that represent each key on the keyboard. You can make a simple script to
    see what the unicode values of each key can be using simple JavaScript. Let’s
    modify the above example here:


    var el = document.getElementById(''foo'');


    el.onkeydown = function(e){


      counter = document.getElementById(''counter'');


      counter.innerHTML = e.keyCode;


    }


    Typing in the input box now shows the code for every key you clicked in. This
    is awesome but what if we want to tell what key the code represents. Luckily the
    String Object comes with it a method calledString.fromCharCode that can convert
    the unicode value to its corresponding key. Let’s modify the above example again:


    var el = document.getElementById(''foo'');


    el.onkeydown = function(e){


      counter = document.getElementById(''counter'');


      code = e.keyCode;


      counter.innerHTML = String.fromCharCode(code);


    }


    Go ahead and try it out - the counter is now populated with the key you must have
    pressed. You might notice that it works fine for basic alphanumerical characters
    but not for other keys such as the enter key, escape and some characters.


    This is because unicode as a specification isn''t meant for just keyboards. Your
    best bet would be to use the original character codes in your code if you want
    to compare for a character that has been entered.


    ## If the form fits


    One of the most common areas in JavaScript where you would be inundated with event
    handling is perhaps on forms. We mentioned at the start of the book one of the
    pitfalls with having no client sided scripting to check for validations on your
    forms. Here we take a look at the events that are exclusive to form elements and
    how they can be used to create compelling event handlers.


    Forms are one of the most basic and main forms of interaction with the user and
    websites. It’s the primary way to receive data from the user to be used on the
    server.


    We''ll start off by getting acquainted with four basic events of forms namely onblur, onfocus, onchange and onsubmit.


    The onfocus event actually fires when you''ve focused on a form element. Focus
    means when you''ve selected or your keyboard/mouse is ''focused'' on that element.
    The onblur event fires is the focus shifts, like if you use the tab key to move
    from an element to another, as you ''leave'' the element, the elements onblur event
    is triggered and the next element where you ''land'' on its onfocus event is triggered.


    Let’s make a simple form here to work with:


    <form id="theForm" method="post">


    <p>


      <label>Name</label><br/>


      <input type="text" id="name" name="name" />


    </p>


    <p>


      <label>Age</label><br/>


      <input type="text" id="age" name="age" />


    </p>


    <p>


      <label>Gender</label><br/>


      <select id="gender" name="gender">


        <option>Please choose Gender</option>


        <option value="male">Male</option>


        <option value="female">Female</option>


      </select>


    </p>


    <p>


      <label>About</label><br/>


      <textarea id="about" name="about"></textarea>


    </p>


    <p>


      <input type="submit" value="Save"/>


    </p>


    </form>


    Plus lets add some css rules that we can use:


    .error{


      border:1px solid red;


    }


    .busy{


      border:1px solid green;


    }


    The form takes in some basic information. We need to add some validation to this
    form. Let’s start with making sure that the user doesn''t leave the name field
    blank to begin with. This can be done a number of ways but for the sake of demonstrating
    the onblur field we''ll do this so whenever he tries to shift away from the name
    field if its empty, the name field gets a red border around it to showcase that
    something is wrong.


    var el = document.getElementById(''name'');


    el.onblur = function(){


      if(this.value == ''''){


        this.className = ''error'';


      }else{


        this.className = '''';


      }


    }


    Run the code in the browser, just focus on the name field and without entering
    anything just shift focus by clicking somewhere else or using the tab key. You''ll
    see that the text field now has a border applied to it. This is a visual cue to
    the user that something is wrong. Go back to the text field and enter a value
    and then move away from the field, you''ll see the border is now gone. This is
    pretty awesome in itself. The above code is very simple, it runs whenever focus
    is shifted away from the name field element.


    Let’s tidy this up a bit, you see that when you shift away from the field and
    it’s empty, a red border is applied to the field. When you shift back, the border
    is still there and stays there unless you add in text and shift away again. Let’s
    add another event handler so when you focus on the name field, it removes any
    excess border.


    var el = document.getElementById(''name'');


    el.onblur = function(){


      if(this.value == ''''){


        this.className = ''error'';


      }else{


        this.className = '''';


      }


    }


    el.onfocus = function(){


      this.className = '''';


    }


    Run the code and you can see the subtle difference. focus back to the name field
    after you leave it whilst its empty and error class is removed. This demonstrates
    how onfocus and onblur work.


    The onchange event is mostly used with select elements and is triggered when the
    value of the element has changed. It can be used also with other form elements
    but its most effectively used with the select element. Let’s put an annoying popup
    whenever the gender field is changed and outputs a silly message.


    Note - please avoid using too many popups else your users will hate you for it


