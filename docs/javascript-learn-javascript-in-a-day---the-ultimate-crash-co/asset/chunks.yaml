  trans: "\nJavaScript 字符串不仅仅是文本数据。当你在 JavaScript 中创建一个字符串时，你会获得一系列属性和方法，通过它们你可以与字符串交互并对其进行处理。深入了解\
    \ JavaScript 中字符串对象包含的内容，将帮助你完成最基础的编程任务，并节省编写函数的时间，而这些任务可以通过 JavaScript 字符串对象提供的可用方法直接处理。\n\
    \n## 概述\n\n我们将讨论 JavaScript 字符串对象，并介绍字符串对象可用的各种属性和方法。我们还将理解字符串对象方法的影响，并通过几个真实世界的示例来展示它们的用法。\n\
    \n## 所有字符串都是对象\n\n如你所知的，字符串是文本数据。它们可以包含字母、数字、运算符、重音字符等。字符串始终由双引号或单引号包围。当字符串包含单引号或双引号时，通常使用反斜杠\
    \ `\\` 进行转义，以防止 JavaScript 认为字符串内的引号是结束引号。在 JavaScript 中创建字符串就像创建任何其他对象一样。\n\n\
    ```\nvar str = 'This is a String';\n\nvar str = new String('This is also a string');\n\
    ```\n\n在上面的示例中，我们通过两种方式之一创建了字符串：隐式声明一个带有字符串值的变量，以及创建一个 `String` 对象的实例。这两种方式都会得到一个具有许多方法和属性的字符串对象。让我们来看字符串对象的一些属性和方法。\n\
    \n## 我的字符串有多长，以及其他事实\n\n字符串对象提供了几个属性供我们使用。最常用的属性是 `length` 属性。正如其名称所示，它返回字符串的长度。`length`\
    \ 属性的工作方式与数组的 `length` 属性相同，即在数组中，它指的是数组中元素的数量。\n\n```\nvar str = 'This is a String';\n\
    \nstr.length; // 等于 16 - 注意空格也被视为字符串\n\nvar str = ' ';\n\nstr.length; // 等于 1\
    \ - 空格也被计入\n\nvar str = '';\n\nstr.length; // 等于 0 - 空字符串确实是空的..\n```\n\n`length`\
    \ 属性本身可以判断字符串是否为空，但它最常用的是与 `for` 循环或其他用于搜索或提取字符串内容的方法配合使用。字符串在某些方面与数组具有相似的特征。例如，字符串中的单个字符可以通过索引引用，就像引用数组中的单个元素一样。\n\
    \n```\nvar str = 'This is a String';\n\nstr[0]; // 等于 'T'\n\nstr[1]; // 等于 'h'\n\
    ```\n\n如上面的示例所示，字符串可以几乎像数组一样被拆分。让我们在简单的循环中使用 `length` 属性：\n\n```\nvar str = 'This\
    \ is a String';\n\nfor(var i = 0; i< str.length; i++){\n    document.write(str[i]\
    \ + '<br/>');\n}\n```\n\n我们刚刚在不同的行上打印了字符串中所有的字母。和数组一样，字符串的起始索引也是零，这就是为什么对字符串进行循环与对数组进行循环是一样的。\n\
    \n## 搜索/切片 - 你能对字符串做什么\n\n与其他对象一样，字符串也拥有许多方法，允许你根据需要对字符串进行处理和操作。如果你需要验证任何类型的字符串输入、检查特定关键词的出现情况等，这特别有用。虽然以后你会接触到一些让这一过程变得更简单的库，但熟悉\
    \ JavaScript 提供的基础原生函数是非常重要的。这是因为通过使用原生的 JavaScript 函数，你的代码将高效得多，从而提供更好的用户体验。\n\
    \n### 只要是 JavaScript 原生的，就是你的最佳选择\n\n字符串与数组共享许多相似的功能。例如，我们在数组章节中查看过 `indexOf`\
    \ 函数。对于数组，该函数会返回传递给它的元素在数组中首次出现的位置索引。对于字符串，我们有相同的函数，其执行的操作几乎完全相同。\n\n```\nvar\
    \ s = \"Macaroni and Cheese\";\n\ns.indexOf('Cheese');//返回 13\n```\n\n你可以搜索一个字符串内是否存在另一个字符串的出现情况，它将返回被搜索字符串首次出现的数字索引。将此视为一种基础的搜索功能。如果没有找到该字符串，它将返回一个负值。\n\
    \n注意：此函数是区分大小写的。\n\n```\nvar s = \"Macaroni and Cheese\";\n\ns.indexOf('Cheese');//返回\
    \ 13\n\ns.indexOf('CHEESE');//返回 -1\n```\n\n它的对应函数是 `lastIndexOf` 函数，其功能与 `indexOf`\
    \ 几乎相反，返回传递给它的搜索字符串的最后出现的位置。这与搜索数组时使用的函数完全相同，就像 `indexOf` 方法一样。此函数也是区分大小写的。\n\n\
    ```\nvar s = \"Cheddar Cheese and Gouda Cheese\";\n\ns.indexOf('Cheese');//返回\
    \ 8\n\ns.indexOf('CHEESE');//返回 -1\n\ns.lastIndexOf('Cheese');//返回 24\n\ns.lastIndexOf('CHEESE');//返回\
    \ -1\n```\n\n另一个常用的功能是组合字符串。我们在较早的示例中已经使用了加号 `+` 来连接字符串。\n\n```\nvar s = \"Cheddar\
    \ Cheese\";\n\nvar b = \"Fried Onions\";\n\nvar d = s + ' and ' + b;\n\nd; //\
    \ 现在等于 'Cheddar Cheese and Fried Onions'\n```\n\n或者，你也可以使用字符串的 `concat` 方法来追加多个字符串。这与数组的\
    \ `concat` 方法完全一样。所以上面的代码可以重写为：\n\n```\nvar s = \"Cheddar Cheese\";\n\nvar b =\
    \ \"Fried Onions\";\n\nvar d = '';\n\nd.concat(s, ' and ' + b);\n\nd; // 现在等于\
    \ 'Cheddar Cheese and Fried Onions'\n```\n\n注意，即使是数组，也需要声明变量为字符串才能使用其方法。字符串还允许你操作其内容。你可以使用两个手手的函数\
    \ `toLowerCase` 和 `toUpperCase` 来更改字符串中所有字母的大小。\n\n```javascript\nvar s = \"Cheddar\
    \ Cheese\";\n\ns.toUpperCase(); // s 现在是 'CHEDDAR CHEESE'\n\ns.toLowerCase();\
    \ // s 现在是 'cheddar cheese'\n```\n\n在某些情况下，特别是从用户那里获取输入时，你可能希望确保输入没有结尾空格。这很难看，并且在你提取字符串数据时可能会导致问题。此外，假设你正在接收密码，如果有人意外多输入几个空格（这确实会发生！），可能会导致用户沮丧，因为他不记得自己输入过空格。（反正空格并不是好密码）。JavaScript\
    \ 提供了 `trim` 函数，它可以去除开头或结尾的空格。\n\n```\nvar name = \" George Glass \";\n\nname.trim();\
    \ // name 现在是 'George Glass'\n```\n\n### 字符串拆分\n\n记得在数组中有一个 `join` 函数，它技术上通过分隔符将数组中的所有元素连接起来形成一个字符串。字符串则提供了该函数的对立面，即\
    \ `split` 函数。`split` 函数不是连接，而是根据分隔符将字符串拆分为子字符串数组，从而拆分字符串。这与数组的 `join` 函数完全相反。\n\
    \n```\nvar s = \"Cheese,Onions,Pickles,Tomatos\";\n\ns.split(',');\n\ns;//等于 ['Cheese','Onions','Pickles','Tomatos']\n\
    \nvar s = \"Dogs and Cats and Mice\";\n\ns.split(' and ');\n\ns;//等于 ['Dogs','Cats','Mice']\n\
    ```\n\n请注意，即使在使用 `split` 函数时，搜索的分隔符也是区分大小写的。默认情况下，所有的字符串函数都是区分大小写的。\n\n```\nvar\
    \ s = \"Cheese and Onions and Tomatos\";\n\ns.split(' And ');\n```\n"
