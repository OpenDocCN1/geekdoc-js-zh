    ### The length of an array


    The length property of an array returns the number of elements in the array. A
    very useful property which can help especially if you would want to loop through
    the array.


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    pets.length; // equals 5


    ### Adding/appending/prepending stuff to an array


    Once you create an array you''re not stuck with the same array for the length
    of your code. There are a few ways of adding elements onto an array. Remember
    that you can always access an array through its index - the same way you can add
    more elements onto an array using the array''s length property itself so in the
    above example.


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    //pets.length was 5 and the last index before this was 4 hence we just added a
    new element onto the end of the array


    pets[pets.length] = ''turtle'';


    But that is not all, you can also modify elements within the array itself by accessing
    elements through the index. They work just like regular variables only this time
    with an index.


    pets[0]; // equals dog


    pets[0] = ''Iguana'';


    pets[0]; // equals Iguana


    pets[3]; // equals hamster


    pets[3] = ''Goldfish'';


    pets[3]; // equals Goldfish


    Alternatively the array object itself provides a few methods that allow us to
    add elements onto the array itself.


    #### Pushing/Popping Oh My


    When dealing with arrays we know that arrays are variables where values are stored
    in a sequential manner. Adding elements and removing elements from arrays are
    referred to as Pushing and popping respectively. The array object gives us two
    methods aptly named push and pop respectively to carry out these functions.


    The push method pushes or adds a new element to the end of the array. So in the
    above example where we added an element to the end of the array we could rewrite
    it as:


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    pets.push(''turtle''); // returns 5


    pets[5]; // equals ''turtle''


    The same way if we need to remove the last element from the Array we would use
    the pop method.


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    pets.pop(); // returns ''bird''


    pets; // equals [''dog'', ''cat'', ''rabbit'', ''hamster''];


    As with functions the push method returns the new length of the array while the pop method
    returns the element of the array that was ''popped'' out.


    #### Shift/Unshift - and these are not gears


    Similar to the push and pop methods we also have the shift and unshift methods
    which pretty much do the same thing in JavaScript so the above two examples can
    be rewritten using shift and unshift as:


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    pets.unshift(''turtle''); // returns 5


    pets[5]; // equals ''turtle''


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    pets.shift(); // removes the last element ''bird'' and returns it


    pets; // equals [''dog'', ''cat'', ''rabbit'', ''hamster''];


    #### Removing elements from an array


    When it comes to removing elements from an array, we''re already now aware of
    the shift and pop functions, however these functions only work by removing elements
    off the end of the array. You would need to remove elements that obviously aren''t
    always at the further extreme of the arrays you work with.


    Removing elements from arrays is pretty similar to modifying and reading them
    i.e. you would refer them with the index the element is at. To remove an element
    from an array we use the delete command:


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    delete(pets[1]);


    pets; // equals  [''dog'', undefined, ''rabbit'', ''hamster'', ''bird'']


    While delete does delete the value in the array, you''re then left with an an
    undefined value in the same array. Using delete leaves holes in your arrays which
    isn''t exactly the same as how you''d want to remove an element from an array
    thus shortening it. To do so we have a multifunctional function called splice.
    Splice is a functional method all arrays have that can be used to both delete
    and well as add elements to an array. Let’s take a look at it removing elements:


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    pets.splice(1,1);


    pets; //equals [''dog'', ''rabbit'', ''hamster'', ''bird''];


    What just happened here? you''re probably wondering. In the above example splice
    takes in two parameters. The first parameter is the position in the array where
    you want to add or remove an element. The second parameter is the number of elements
    to be removed. In the above example we removed one element from the arrays index
    of one thus shortening the array by one element. The splice function can also
    delete more than one element using the same parameters.


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    pets.splice(2,2);


    pets; //equals [''dog'', ''cat'', ''bird''];


    That is all handy dandy but how does splice add elements to array at the same
    time as well as delete elements? To add elements we can pass in a few more parameters
    to splice.


    var pets = [''dog'', ''cat'', ''rabbit'', ''hamster'', ''bird''];


    pets.splice(2,0, ''turtle'', ''goldfish'');


    pets; //equals [''dog'', ''cat'', ''rabbit'', ''turtle'', ''goldfish'', ''hamster'',
    ''bird''];


    The splice method is an example of how JavaScript functions can take in multiple
    parameters without having to explicitly declare them. In the above example, the
    first parameter states where to add the element, the second parameter is how many
    elements to remove and the rest of the parameters are the elements to be added
    to the array. You can pass in just about any set of parameters as you wish, you
    can even pass in arrays and objects. An array can pretty much carry any type of
    information. At the same time you can also remove and add elements from the array
    using a single splice function:


    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];


    pets.splice(2,1, ''turtle'', ''goldfish'');


    pets; //equals [''dog'', ''cat'', ''turtle'', ''goldfish'', ''hamster'', ''bird''];


    ## It works like glue!


    JavaScript provides a very useful function in cases when you would want to concatenate
    all the elements of an array into a string with a delimiter. So if you want a
    comma separated string of all the names of pets in the pets array as above:


    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];


    var names = pets.join('',''); // equals ''dog,cat,hamster,bird''


    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];


    var names = pets.join('' or ''); // equals ''dog or cat or hamster or bird''


    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];


    var names = pets.join('' and ''); // equals ''dog and cat and hamster and bird''


    The join function takes one parameter - the delimiter with which to ''glue'' all
    the elements of the array together. This is very useful for printing out contents
    of arrays as a string - if you try to print out an array using document.write it''ll
    only print out the word ''Array''. Try it out with a few simple arrays.


    ## Combining arrays


    How about concatenation more than one array? You have two or more different arrays
    and would want to join them like a centipede to have a bigger mega-array. Arrays
    in JavaScript provide the concatmethod which does exactly that. It takes as a
    parameter any number of arrays and ''daisy chains'' them to the original array.


    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];


    var more_pets = [''iguana'', ''turtle'', ''goldfish''];


    var even_more_pets = [''rabbit'', ''gerbil''];


    pets.concat(more_pets, even_more_pets); // equals var pets = [''dog'', ''cat'',
    ''hamster'', ''bird'', ''iguana'', ''turtle'', ''goldfish'', ''rabbit'', ''gerbil''];


    ## Looping through arrays


    Since we know that arrays have numerical indexes we can traverse through an array
    using a loop using the iterator to check for the index. Here are a few examples
    of iterating through the above array using the different loops that JavaScript
    has to provide.


    var pets = [''dog'', ''cat'', ''hamster'', ''bird'', ''rabbit'', ''turtle'', ''goldfish''];


    // the for loop


    for(var i = 0; i < pets.length; i++){'
