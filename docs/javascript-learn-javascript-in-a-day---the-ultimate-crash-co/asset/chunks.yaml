  trans: "\n首先，让我们决定想要什么种饼萨底。我们将询问用户他想要的饼底种类。\n\n```javascript\nvar crust = prompt('What\
    \ kind of crust do you want - thin or regular?');\n```\n\n用户可以输入他想要的饼底种类——等一下，如果他输入了我们没有的内容怎么办？我们需要检查输入的饼底类型。\n\
    \n```javascript\nvar crust = prompt('What kind of crust do you want - thin or\
    \ regular?');\n\nif((crust == 'thin') || (crust=='regular')){\n    var cheese\
    \ = prompt('Choose your cheese?');\n    switch(cheese){\n        case 'mozarella':\n\
    \        case 'feta':\n        case 'parmesan':\n        case 'cheddar':\n   \
    \     break;\n        default:\n            alert('Sorry we do not have that kind\
    \ of cheese.');\n        break;\n    }\n}else{\n    alert('Sorry we do not serve\
    \ that kind of crust here.');\n}\n```\n\n很棒，现在让我们假设如果他想要切达奶酪，他就可以获得番茄酱底披萨，否则如果选择了其他任何奶酪，他将获得白色帕玛森酱底披萨。\n\
    \n```javascript\nvar crust = prompt('What kind of crust do you want - thin or\
    \ regular?');\nvar sauce; // 我们初始化了一个酱变量\n\nif((crust == 'thin') || (crust=='regular')){\n\
    \    var cheese = prompt('Choose your cheese?');\n    switch(cheese){\n      \
    \  case 'mozarella':\n        case 'feta':\n        case 'parmesan':\n       \
    \     sauce = 'tomato';\n        break;\n        case 'cheddar':\n           \
    \ sauce = 'white';\n        break;\n        default:\n            alert('Sorry\
    \ we do not have that kind of cheese.');\n        break;\n    }\n}else{\n    alert('Sorry\
    \ we do not serve that kind of crust here.');\n}\n```\n\n现在已经完成了——让我们输出他订单的披萨详情。\n\
    \n```javascript\nvar crust = prompt('What kind of crust do you want - thin or\
    \ regular?');\nvar sauce; // 我们初始化了一个酱变量\n\nif((crust == 'thin') || (crust=='regular')){\n\
    \    var cheese = prompt('Choose your cheese?');\n    switch(cheese){\n      \
    \  case 'mozarella':\n        case 'feta':\n        case 'parmesan':\n       \
    \     sauce = 'tomato';\n        break;\n        case 'cheddar':\n           \
    \ sauce = 'white';\n        break;\n        default:\n            alert('Sorry\
    \ we do not have that kind of cheese.');\n        break;\n    }\n    alert('You\
    \ ordered a Pizza with '+crust+' crust, '+ cheese + ' cheese and '+sauce+' sauce');\n\
    }else{\n    alert('Sorry we do not serve that kind of crust here.');\n}\n```\n\
    \n运行代码，看起来没问题，但等一下，有些不对。如果你输入了错误的奶酪种类，你仍然收到一个提示告诉你你订了什么种披萨，但没有酱。我们需要在这里进行一个检查，确保只有在输入了有效的酱料时，才输出订单披萨的详情。为了这一点，让我们稍微修改代码，在输入错误的酱时给酱变量赋值一个值，并在输出正确条目之前进行检查。\n\
    \n```javascript\nvar crust = prompt('What kind of crust do you want - thin or\
    \ regular?');\nvar sauce = -1; // 我们初始化了一个带有默认值的酱变量用于检查\nif((crust == 'thin')\
    \ || (crust=='regular')){\n    var cheese = prompt('Choose your cheese?');\n \
    \   switch(cheese){\n        case 'mozarella':\n        case 'feta':\n       \
    \ case 'parmesan':\n            sauce = 'tomato';\n        break;\n        case\
    \ 'cheddar':\n            sauce = 'white';\n        break;\n        default:\n\
    \            alert('Sorry we do not have that kind of cheese.');\n        break;\n\
    \    }\n    if(sauce!=-1){只要酱的变量不是 -1，我们就可以假设所有正确的值都已输入\n        alert('You ordered\
    \ a Pizza with '+crust+' crust, '+ cheese + ' cheese and '+sauce+' sauce');\n\
    \    }\n}else{\n    alert('Sorry we do not serve that kind of crust here.');\n\
    }\n```\n\n现在好多了，你现在可以看到在一个真实的示例中，通过几个简单的条件语句，我们如何根据输入控制脚本的流程。随着我们的进行，我们将处理更复杂的问题并解决它们。\n\
    \n## 总结\n\n- 我们学习了条件语句的概念以及 JavaScript 是如何评估它们的。\n- 我们理解了表达式必须求值为真，条件语句才能被求值。\n\
    - 我们学习了 `if` 和 `else` 语句，以及条件语句如何嵌套。\n- 复杂的 `if` 语句的替代方案是 `switch` 和 `case` 语句，它允许对单个变量进行多个值的检查。\n\
    \n## 作业\n\n### 练习 1\n编写一个脚本检查一个整数变量大于还是小于 100。它应该输出结果。所以，如果检查的是数字 60，输出应该是“60\
    \ is less than 100”。使用 `prompt` 命令从用户获取变量。\n\n### 练习 2\n扩展上面的披萨示例。让用户也使用 `prompt`\
    \ 命令输入他们对酱料的选择。用户首先选择饼底，然后选择奶酪，然后他应该输入他的酱料选择。检查酱料 'white pesto' 'Signature tomato'\
    \ 'cheesy garlic' 'caesar dressing' 和 'pasta sauce'。使用 `switch` 语句。\n\n# 第 4 章：重复\
    \ - 循环\n\n在开发过程中，你经常会遇到需要重复某些代码块，或者至少需要多次引用同一段代码。例如，你可能需要初始化 10 个相同的变量或按顺序操作，然而手动写出\
    \ 10 次是重复的，这违背了使用编程语言的初衷。\n\n所有编程语言都有重复代码块的固有功能，JavaScript 例外，它也有自己的一套“循环”语句，用于实现你所需的重复出现。\n\
    \n## 概述\n\n在本章中，我们将介绍 JavaScript 中循环的概念。你将熟悉不同的循环语句，例如 `for` 循环、`while` 循环以及 `do...while`\
    \ 循环。你将理解这些循环之间的区别以及它们的实际影响，并接触一些示例。\n\n## 没有循环的世界\n\n想象一个没有复印机或蛋糕盒的世界——没有两个蛋糕看起来看起来是一样的。这在某种程度上是灾难性的。在编程方面，想象一种你需要输出某些文本\
    \ 100 次的情况。假设你因为在禁区行驶（无论那是什么）而受到惩罚，并且必须写 1000 次“I will not drive in a no zone”。你被允许在惩罚期间使用\
    \ JavaScript（别问为什么），而且你不能复制粘贴。你可以采用那种疯狂且无脑的方法，手动编写 1000 次 `document.write` 语句，如下：\n\
    \n```javascript\ndocument.write('I will not drive in a no driving zone.<br/>');\n\
    document.write('I will not drive in a no driving zone.<br/>');\ndocument.write('I\
    \ will not drive in a no driving zone.<br/>');\ndocument.write('I will not drive\
    \ in a no driving zone.<br/>');\ndocument.write('I will not drive in a no driving\
    \ zone.<br/>');\ndocument.write('I will not drive in a no driving zone.<br/>');\n\
    document.write('I will not drive in a no driving zone.<br/>');\n\n// 这将花费永远\n\
    ```\n\n或者更好，你可以让编程语言为你执行。循环是所有编程语言不可或缺的一部分，它们允许你根据指定的次数重复执行代码块，或者直到满足特定条件。\n"
- fmt: "\nLoops are extremely useful, especially in cases more practical than the\
    \ example quoted above. We'll go over the basic loop statments in JavaScript and\
    \ apply some real life examples as well as some not so real life examples(such\
    \ as the one above) and see how loops work.\n\n## The for loop\n\nThe most basic\
    \ and versatile loop statement in JavaScript is the `for` loop. The syntax of\
    \ the `for` loop is as below:\n\n```\nfor (statement 1; statement 2; statement\
    \ 3) {\n    //Code to be run\n}\n```\n\n`Statement 1` is an expression that is\
    \ executed before the loop actually starts. This is normally an initialization\
    \ expression that would initialize a variable to be used as a counter.\n\n`Statement\
    \ 2` is an expression that defines the condition under which the code would run\
    \ i.e the code would keep on running as long as the expression in `statement 2`\
    \ evaluates to true.\n\n`Statement three` is an expression that runs over each\
    \ iteration of the loop.\n\nThese three statements in the `for` loop define how\
    \ many iterations are there going to be which means how many times the code in\
    \ the `for` loop block would run. So if we were to output the above example lets\
    \ say 10 times we would write our `for` loop as so:\n\n```\nfor( i = 0 ; i < 10;\
    \ i++){\n  document.write('I will not drive in a no driving zone.<br/>');\n}\n\
    ```\n\nThe result is that the statement 'I will not drive in a no driving zone'\
    \ is printed out 10 times. Lets deconstruct the `for` loop a bit. We can see that\
    \ `statement 1` is `i = 0`, we've initialized the variable `i` with zero. The\
    \ variable `i` would serve as a counter during the loop. `Statement 2` outlines\
    \ a condition which is `i < 10` which means keep iterating while the variable\
    \ `i` is less than 10. So we know that the variable `i` has been initialized with\
    \ a starting value of zero and the loop would run until the variable `i` is no\
    \ longer less than 10 i.e. equals to or is greater than 10. The third statement\
    \ `i++` is run whenever the loop iterates and at each iteration of the loop we're\
    \ incrementing the variable `i` by one.\n\nYou might be wondering why we initialized\
    \ `I` with zero and not the number 1. We could do that but then we would have\
    \ to adjust `statement 2` to be `i<=10` otherwise the statement would be executed\
    \ only 9 times. This is because the `i++` statement increments the value of `i`\
    \ after an iteration.\n\nSo if we were to repeat the code block within the `for`\
    \ statement 2 20 times we would just change the `statement 2` to `i < 20`. Since\
    \ the `for` loop is very versatile, you can use just about any set of statement\
    \ provided that they effectively work as a loop. For example the following `for`\
    \ loop would not run at all:\n\n```\nfor( i=0 ; i==0; i++){\n    //do something\n\
    }\n```\n\nThis is because the second statement's condition has already been fulfilled\
    \ before the loop has even begun. And the following loop would just never end:\n\
    \n```\nfor( i=0 ; i<0; i++){\n    //never ending loop\n}\n```\n\nBecause in the\
    \ above loop, the iterative statement of `i++` would never at any point assign\
    \ `i` a value that would be less than zero as `i++` increases the value of `i`\
    \ by one in every iteration. So you need to be very careful when working with\
    \ loops. One of the cardinal sins of working in JavaScript is putting an `alert`\
    \ command within an finite or infinite loop, doing the latter would nevertheless\
    \ earn you the scorn of web users the world over so please never use any of the\
    \ commands that warrant bringing up a pop up in a loop.\n\nLets loop at a few\
    \ variations on the `for` loop.\n\nAt this point it’s interesting to note that\
    \ all the three statements in a JavaScript `for` loop are completely optional.\n\
    \nYou can easily omit the first statement provided you have already initialized\
    \ the variable used in the `for` loop before the `for` loop itself. So the following\
    \ code is perfectly valid:\n\n```\nvar i = 0;\nfor( ; i < 10; i++){\n  document.write('I\
    \ will not drive in a no driving zone.<br/>');\n}\n```\n\nJust remember that even\
    \ if you omit a statement in the `for` loop, make sure you still have the corresponding\
    \ semi-colon. That tells JavaScript which statement has been omitted.\n\nLikewise\
    \ the second statement i.e. the condition under which the loop runs can also be\
    \ omitted. However if you omit the second statement you must provide a way to\
    \ break out of the loop within the loop itself. This can be done by using the\
    \ `break` statement as used in the `switch` case statement in the previous chapter\
    \ together with a conditional `if` statement. So the above code can be rewritten\
    \ as below:\n\n```\nfor( i = 0 ; ; i++){\n  if(i < 10){\n    break;\n  }\n  document.write('I\
    \ will not drive in a no driving zone.<br/>');\n}\n```\n\nIf you fail to add a\
    \ `break` within the code somewhere after omitting the second statement you'll\
    \ end up with a loop that will never end. This is one situation you'll definitely\
    \ want to avoid.\n\nSimilarly the third statement i.e. which is run in every iteration\
    \ can also be omitted - provided you make a provision within your code to iterate\
    \ the variable used as a counter in the `for` loop. So the same code can be rewritten\
    \ as\n\n``````\nfor( i = 0 ; i < 10 ;){\n  i = i + 1;\n  document.write('I will\
    \ not drive in a no driving zone.<br/>');\n}\n```\n\n### Continue - not just break!\n\
    \nWhile we know that the `break` statement does as its namesake i.e. breaks completely\
    \ out of the loop or block of code its' in, at times you would want to skip an\
    \ iteration but not necessarily stop the loop or break out of the block of code.\
    \ Like lets assume you would want to run the above code but when the variable\
    \ `i` would equal 5 you would not want to print for some reason. One way is that\
    \ you use a large `if` statement:\n\n```\nfor( i = 0 ; i < 10 ;i++){\n    if(i\
    \ != 5){\n      document.write('I will not drive in a no driving zone.<br/>');\n\
    \    }\n}\n```\n\nThis is one way of doing it but there is a better way of doing\
    \ this that won't have you enclose large blocks of code in brackets. Enter the\
    \ `continue` statement. The `continue` statement skips the current iteration such\
    \ that any code following the `continue` statement is not executed for that iteration.\
    \ So the above can be easily rewritten as:\n\n```\nfor( i = 0 ; i < 10 ;i++){\n\
    \    if(i == 5){\n      continue;\n    }\n    document.write('I will not drive\
    \ in a no driving zone.<br/>');\n}\n```\n\n## While - you were looping\n\nThe\
    \ `while` loop is another loop native to JavaScript. Unlike the `for` loop the\
    \ `while` loop takes only one statement i.e. a condition under which the loop\
    \ runs. A typical `while` statements syntax is as below:\n\n```\nwhile(expression){\n\
    }\n```\n\nThere are no initialization statements and neither are any incremental\
    \ statements in the `while` loop. All of that has to be handled within the block\
    \ block it self. If we were to write a `while` loop with the condition to keep\
    \ iterating while `i` is less than 10 as below:\n\n```\nwhile(i < 10 ){\n  document.write('I\
    \ will not drive in a no driving zone.<br/>');\n}\n```\n\nYou'll notice that we\
    \ get an error - it seems that the variable `i` hasn't been initialized. in JavaScript\
    \ you need to initialize a variable prior to using it. So lets make the following\
    \ amendment.\n\n```\nvar i = 0;\nwhile(i < 10 ){\n  document.write('I will not\
    \ drive in a no driving zone.<br/>');\n}\n```\n\nRunning the code we see that\
    \ its running and running and it just won't stop! Why's that you may wonder? The\
    \ fact is that we've defined a condition but made no provision that the condition\
    \ can even be met. The value of `i` stays the same i.e. zero through the code.\
    \ So where do we put our iterator? Within the block of code to be iterated.\n\n\
    ```\nvar i = 0;\nwhile(i < 10 ){\n  document.write('I will not drive in a no driving\
    \ zone.<br/>');\n  i++;\n}\n```\n\nThe above code works exactly as the early `for`\
    \ loop. Its a matter of preference what loop you may use from the two. It’s obvious\
    \ to see that with the `for` loop, initialization, running condition and the iteration\
    \ code is encouraged to be part of the `for` loop itself while in the `while`\
    \ loop it can be spread out and not necessarily be intrinsic to the `while` loops\
    \ declaration.\n\n## do -- while - one more loop for you\n"
  raw: 'Loops are extremely useful, especially in cases more practical than the example
    quoted above. We''ll go over the basic loop statments in JavaScript and apply
    some real life examples as well as some not so real life examples(such as the
    one above) and see how loops work.


    ## The for loop


    The most basic and versatile loop statement in JavaScript is the for loop. The
    syntax of the for loop is as below:


    for (statement 1; statement 2; statement 3) {


        //Code to be run


    }


    Statement 1 is an expression that is executed before the loop actually starts.
    This is normally an initialization expression that would initialize a variable
    to be used as a counter.


    Statement 2 is an expression that defines the condition under which the code would
    run i.e. the code would keep on running as long as the expression in statement
    2 evaluates to true.


    Statement three is an expression that runs over each iteration of the loop.


    These three statements in the for loop define how many iterations are there going
    to be which means how many times the code in the for loop block would run. So
    if we were to output the above example lets say 10 times we would write our for
    loop as so:


    for( i = 0 ; i < 10;  i++){


      document.write(''I will not drive in a no driving zone.<br/>'');


    }


    The result is that the statement ''I will not drive in a no driving zone'' is
    printed out 10 times. Lets deconstruct the for loop a bit. We can see that statement
    1 is i = 0, we''ve initialized the variable i with zero. The variable i would
    serve as a counter during the loop. Statement 2 outlines a condition which is i
    < 10 which means keep iterating while the variable i is less than 10\. So we know
    that the variable i has been initialized with a starting value of zero and the
    loop would run until the variable i is no longer less than 10 i.e. equals to or
    is greater than 10\. The third statement i++ is run whenever the loop iterates
    and at each iteration of the loop we''re incrementing the variable i by one.


    You might be wondering why we initialized I with zero and not the number 1\. We
    could do that but then we would have to adjust statement 2 to be i<=10 otherwise
    the statement would be executed only 9 times. This is because the i++ statement
    increments the value of i after an iteration.


    So if we were to repeat the code block within the for statement 20 times we would
    just change the statement 2 to i < 20. Since the for loop is very versatile, you
    can use just about any set of statement provided that they effectively work as
    a loop. For example the following for loop would not run at all:


    for( i=0 ; i==0; i++){


        //do something


    }


    This is because the second statement''s condition has already been fulfilled before
    the loop has even begun. And the following loop would just never end:


    for( i=0 ; i<0; i++){


        //never ending loop


    }


    Because in the above loop, the iterative statement of i++ would never at any point
    assign i a value that would be less than zero as i++ increases the value of i by
    one in every iteration. So you need to be very careful when working with loops.
    One of the cardinal sins of working in JavaScript is putting an alert command
    within an finite or infinite loop, doing the latter would nevertheless earn you
    the scorn of web users the world over so please never use any of the commands
    that warrant bringing up a pop up in a loop.


    Lets loop at a few variations on the for loop.


    At this point it’s interesting to note that all the three statements in a JavaScript
    for loop are completely optional.


    You can easily omit the first statement provided you have already initialized
    the variable used in the for loop before the for loop itself. So the following
    code is perfectly valid:


    var i = 0;


    for( ; i < 10;  i++){


      document.write(''I will not drive in a no driving zone.<br/>'');


    }


    Just remember that even if you omit a statement in the for loop, make sure you
    still have the corresponding semi-colon. That tells JavaScript which statement
    has been omitted.


    Likewise the second statement i.e. the condition under which the loop runs can
    also be omitted. However if you omit the second statement you must provide a way
    to break out of the loop within the loop itself. This can be done by using the break statement
    as used in the switch case statement in the previous chapter together with a conditional
    if statement. So the above code can be rewritten as below:


    for( i = 0 ; ;  i++){


      if(i < 10){


        break;


      }


      document.write(''I will not drive in a no driving zone.<br/>'');


    }


    If you fail to add a break within the code somewhere after omitting the second
    statement you''ll end up with a loop that will never end. This is one situation
    you''ll definitely want to avoid.


    Similarly the third statement i.e. which is run in every iteration can also be
    omitted - provided you make a provision within your code to iterate the variable
    used as a counter in the for loop. So the same code can be rewritten as:


    for( i = 0 ; i < 10 ;){


      i = i + 1;


      document.write(''I will not drive in a no driving zone.<br/>'');


    }


    #### Continue - not just break!


    While we know that the break statement does as its namesake i.e. breaks completely
    out of the loop or block of code its in, at times you would want to skip an iteration
    but not necessarily stop the loop or break out of the block of code. Like lets
    assume you would want to run the above code but when the variable i would equal
    5 you would not want to print for some reason. One way is that you use a large
    if statement:


    for( i = 0 ; i < 10 ;i++){


        if(i != 5){


          document.write(''I will not drive in a no driving zone.<br/>'');


        }


    }


    This is one way of doing it but there is a better way of doing this that won''t
    have you enclose large blocks of code in brackets. Enter the continue statement.
    The continue statement skips the current iteration such that any code following
    the continue statement is not executed for that iteration when the continue statement
    is run. So the above can be easily rewritten as:


    for( i = 0 ; i < 10 ;i++){


        if(i == 5){


            continue;


        }


        document.write(''I will not drive in a no driving zone.<br/>'');   


    }


    ## While - you were looping


    The while loop is another loop native to JavaScript. Unlike the for loop the while
    loop takes only one statement i.e. a condition under which the loop runs. A typical
    while statements syntax is as below:


    while(expression){


    }


    There are no initialization statements and neither are there any incremental statements
    in the while loop. All of that has to be handled within the code block it self.
    If we were to write a while loop with the condition to keep iterating while i is
    less than 10 as below:


    while(i < 10 ){


      document.write(''I will not drive in a no driving zone.<br/>'');


    }


    You''ll notice that we get an error - it seems that the variable i hasn''t been
    initialized. in JavaScript you need to initialize a variable prior to using it.
    So lets make the following amendment.


    var i = 0;


    while(i < 10 ){


      document.write(''I will not drive in a no driving zone.<br/>'');


    }


    Running the code we see that its running and running and it just won''t stop!
    Why''s that you may wonder? The fact is that we''ve defined a condition but made
    no provision that the condition can even be met. The value of i stays the same
    i.e. zero through out the code. So where do we put our iterator? Within the block
    of code to be iterated.


    var i = 0;


    while(i < 10 ){


      document.write(''I will not drive in a no driving zone.<br/>'');


      i++;


    }


    The above code works exactly as the early for loop. Its a matter of preference
    what loop you may use from the two. It’s obvious to see that with the for loop,
    initialization, running condition and the iteration code is encouraged to be part
    of the for loop itself while in the while loop it can be spread out and not necessarily
    be intrinsic to the while loops declaration.


    ## do -- while - one more loop for you'
