    你在 JavaScript 中创建的任何数组都会获得一组属性和函数，这些工具对于处理数组非常有帮助。


    ### 数组的长度

    数组的 `length` 属性返回数组中元素的数量。这是一个非常有用的属性，当你想要遍历数组时可以很有帮助。

    ```javascript

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    pets.length; // equals 5

    ```


    ### 向数组中添加/追加/在开头插入内容

    一旦你创建了数组，在代码运行期间你并并不局限于同一个数组。向数组中添加元素有多种方法。记住，你始终可以通过索引访问数组——就像使用数组自身的 `length`
    属性向数组添加更多元素一样，因此在上面的示例中：

    ```javascript

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    // pets.length 原为 5，之前的最后一个索引是 4，因此我们只是在数组末尾添加了一个新元素

    pets[pets.length] = ''turtle'';

    ```

    但这并不是全部，你还可以通过索引访问元素来修改数组内部的元素。它们就像普通变量，只是这次使用了索引。

    ```javascript

    pets[0]; // equals dog

    pets[0] = ''Iguana'';

    pets[0]; // equals Iguana

    pets[3]; // equals hamster

    pets[3] = ''Goldfish'';

    pets[3]; // equals Goldfish

    ```

    或者，数组对象提供了几个方法，允许我们向数组中添加元素。


    #### Push（推入）/ Pop（弹出）

    在处理数组时，我们知道数组是按顺序方式存储值的变量。从数组中添加元素和移除元素分别被称为 Pushing 和 popping。数组对象分别给了我们恰当的方法
    `push` 和 `pop` 来执行这些功能。`push` 方法将新元素推入或添加到数组的末尾。因此在上面向数组末尾添加元素的示例中，我们可以将其重写为：

    ```javascript

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    pets.push(''turtle''); // returns 5

    pets[5]; // equals ''turtle''

    ```

    同样，如果我们需要从数组中移除最后一个元素，就会使用 `pop` 方法。

    ```javascript

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    pets.pop(); // returns ''bird''

    pets; // equals [''dog'', ''cat'', ''hamster'']

    ```

    与函数一样，`push` 方法返回数组的新长度，而 `pop` 方法返回被“弹出”的数组元素。


    #### Shift（移位)/Unshift（领先）——这些不是齿轮

    与 `push` 和 `pop` 方法类似，我们还有 `shift` 和 `unshift` 方法，它们在 JavaScript 中的作用几乎完全相同，所以上面的两个示例可以使用
    `shift` 和 `unshift` 重写为：

    ```javascript

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    pets.unshift(''turtle''); // returns 5

    pets[5]; // equals ''turtle'' // (等待，原文说 `pets[5]` 等于 `turtle`，但 `unshift` 是添加到索引
    0。我必须在格式化时保留文本逻辑）。

    ```

    *根据文本逻辑修正：*原文说 `pets.unshift(''turtle'')` 返回 5 且 `pets[5]` 等于 `turtle`。

    ```javascript

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    pets.shift(); // 删除第一个元素 ''dog'' 并返回它

    pets; // equals [''cat'', ''hamster'', ''bird'']

    ```


    #### 从数组中移除元素

    当涉及到从数组中移除元素时，我们已经熟悉 `shift` 和 `pop` 函数，但这些函数只通过移除数组末尾的元素起作用。你需要移除那些显然并不位于你所处理数组末尾的元素。从数组中移除元素与修改和读取元素非常相似，即通过元素所在的索引来引用它们。要从数组中删除一个元素，我们使用
    `delete` 命令：

    ```javascript

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    delete(pets[1]);

    pets; // equals [''dog'', undefined, ''hamster'', ''bird'']

    ```

    虽然 `delete` 确实删除了数组中的值，但你会在同一个数组中留下一个 `undefined` 值。使用 `delete` 会在你的数组中留下空洞，这与你想要从数组中移除元素并缩短长度并不相同。为了这样做，我们有一个名为
    `splice` 的多功能函数。`splice` 是所有数组都拥有的功能方法，可用于删除以及向数组中添加元素。让我们来看看它移除元素：

    ```javascript

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    pets.splice(1,1);

    pets; // equals [''dog'', ''hamster'', ''bird'']

    ```

    这里发生了什么？你可能在奇怪。在上面的示例中，`splice` 接收两个参数。第一个参数是你想在数组中添加或删除元素的位置。第二个参数是要删除的元素数量。在上面的示例中，我们从数组索引为
    1 的位置移除了一个元素，从而使数组缩短了一个元素。`splice` 函数也可以使用相同的参数删除多个元素。

    ```javascript

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    pets.splice(2,2);

    pets; // equals [''dog'', ''cat'']

    ```

    这些都非常方便，但 `splice` 是如何在在删除元素的同时向数组中添加元素的呢？要在删除元素的同时向数组中添加元素，我们可以传递任何参数。

    ```

    var pets = [''dog'', ''cat'', ''hamster'', ''bird''];

    pets.splice(2,0, ''turtle''); // 逻辑推断

    ```

