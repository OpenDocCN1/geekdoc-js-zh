    against the value stored. Alternatively you can use the global function isNaN
    to check if a variable has a numerical value or not.


    var a = 10;


    a.NaN(); // returns undefined


    isNaN(a); // returns false as it is a number


    Likewise the .toString() function converts the value of the number object to a
    string value. So we know ''10'' is not the same as 10 because the latter is a
    number and the former is a string.


    Moving on let’s look at the string object. We''ve used strings in most of our
    examples and are familiar with the fact that strings are textual data. We''ve
