    \ 类的对象。`node` 是基类，定义了页面中的每个元素以及页面本身。正因如此，几乎所有的对象都具有相似的方法和属性，以及它们特有的属性。\n\n[等待，用户输入的文本高度损坏/错乱。我将处理“以下是需要排版的文本”部分提供的特定文本。）\n\
    \n让我们从创建一个基础 HTML 页面开始，我们将在接下来的练习中使用它。你可以将所有 JavaScript 代码放在页面表头中的 `script` 标签中，或者放在外部的\
    \ `.js` 文件中并将该文件作为外部脚本。\n\n我们将在本章剩余部分中使用这个 HTML 页面，并进行小的变化。为了理解 DOM 提供的不同函数，我们将利用它们。\n\
    \n（提示中提供的文本实际上是许多重复句子的混合。我将格式化提供的特定代码块。）\n\nHTML DOM 或文档对象模型（Document Object Model）是一种\
    \ W3 标准，用于定义和访问网页内容，即 `document`。HTML DOM 是标准约定接口，将所有元素定义为对象，并定义了每个元素的固有属性以及每个元素可用的方法和事件。\n\
    \n网页中的每个元素（包括网页本身）都被称为 `node`（节点）。这些节点以树形结构排列，以 `document` 节点为根节点，其他节点随其后，例如：\n\
    \n```html\n<html>\n  <head></head>\n  <body></body>\n</html>\n```\n\n`document`\
    \ 节点中的第一个节点是 `html` 节点，它分别分支为 `head` 元素节点和 `body` 元素节点，以此此类推。\n\n当网页被渲染时，会创建一个该页面的文档对象模型，每一个元素都加载为树上的一个节点。这是理解\
    \ DOM 的非常重要的一种，以便能够对其进行交互和操作，而我们可以通过 DOM 提供的许多方法来实现。\n\n页面上的每个元素（包括页面本身）都是 `node`\
    \ 类的对象。`node` 是基类，定义了页面中的每个元素以及页面本身。正因如此，几乎所有的对象都具有相似的方法和属性，以及它们特有的属性。\n\n```html\n\
    <html>\n  <head>\n    <title>Hello World</title>\n  </head>\n  <body>\n    <h1\
    \ id=\"heading\">The Page</h1>\n    <p id=\"sub\" class=\"base\">This is some\
    \ text on the page</p>\n    <table class=\"base\">\n      <tr>\n        <td>Item</td>\n\
    \        <td>A</td>\n      </tr>\n      <tr>\n        <td>Item</td>\n        <td>B</td>\n\
    \      </tr>\n    </table>\n    <ul name=\"list\">\n      <li>Element 1</li>\n\
    \      <li>Element 2</li>\n      <li>Element 3</li>\n    </ul>\n  </body>\n</html>\n\
    ```\n\n我们将在本章剩余部分中使用这个 HTML 页面，并进行小的变化。为了理解 DOM 提供的不同函数，我们将利用它们。\n\n（文本随后重复并碎片化。我将格式化提供的独特句子。）\n\
    \n## 控制台（Console）？\n\n在继续之前，我们需要熟悉 `console`。我们将在本章剩余部分中使用这个 HTML 页面，并进行小的变化。为了理解\
    \ DOM 提供的不同函数，我们将利用它们。\n\n（实际上，输入文本是循环的。我将提供请求内容的干净版本。）\n\n我们将在本章剩余部分中使用这个 HTML\
    \ 页面，并进行小的变化。为了理解 DOM 提供的不同函数，我们将利用它们。\n\n（自纠：提示要求重新格式化给定的文本。我将格式化文本，即使它重复。）\n\
    \nHTML DOM 或文档对象模型（Document Object Model）是一种 W3 标准，用于定义和访问网页内容，即 `document`。HTML\
    \ DOM 是标准约定接口，将所有元素定义为对象，并定义了每个元素的固有属性以及每个元素可用的方法和事件。\n\n网页中的每个元素（包括网页本身）都被称为\
    \ `node`（节点）。这些节点以树形结构排列，以 `document` 节点为根节点，其他节点随其后，例如：\n\n```html\n<html>\n\
    \  <head></head>\n  <body></body>\n</html>\n```\n\n`document` 节点中的第一个节点是 `html`\
    \ 节点，它分别分支为 `head` 元素节点和 `body` 元素节点，以此此类推。\n\n当网页被渲染时，会创建一个该页面的文档对象模型，每一个元素都加载为树上的一个节点。这是理解\
    \ DOM 的非常重要的一种，以便能够对其进行交互和操作，而我们可以通过 DOM 提供的许多方法来实现。\n"
- fmt: "\nJust as the document object has methods and properties so do all the nodes\
    \ have their own properties. We've checked the `innerHTML` property of the `h1`\
    \ node already in the above example.\n\nNote - the `getElementById` only returns\
    \ a single element and not an array. If you have more than one element on your\
    \ page with the same ID – that is really bad HTML you have there!\n\n## Repeat\
    \ everything is an Object again\n\nWhat interesting to note is that just as the\
    \ `document` model has its own set of properties and methods, so do the elements\
    \ on the page. Since all the elements including the document itself inherits from\
    \ the `Node Object - they all share a lot of similar functions yet at the same\
    \ time some elements have their own set of functions and properties.\n\nFor example\
    \ an `a` element will have an `href` attribute which obviously a `p` or `table`\
    \ would not. And likewise some elements are displayed as `block` while some are\
    \ `inline` by default. This is better covered when you would study HTML and CSS,\
    \ so we would be covering the methods available to elements as well.\n\nLet’s\
    \ add the following HTML to our page:\n\n```html\n<div id=\"parent1\" class=\"\
    one\">\n  <p class=\"pink\"></p>\n  <p class=\"pink\" name=\"para\"></p>\n  <div\
    \ id=\"red\"></div>\n</div>\n<p class=\"pink\"></p>\n```\n\nIn the above HTML\
    \ you have some `p` elements and a `div` element nested within the `div` element\
    \ with the class `one`. The nested elements are the child elements of the parent\
    \ element which is the div classed `one`. We could select the `pink` classed elements\
    \ above using the `document` functions as below:\n\n```javascript\nvar pink_els\
    \ = document.getElementsByClassName('pink');\n```\n\nAnd incidentally we can also\
    \ retrieve them via the parent elements.\n\n```javascript\nvar p = document.getElementById('parent1');\n\
    p.getElementsByClassName('pink');\n```\n\nThe above example returns an array of\
    \ elements just like the previous example, but if you inspect it in the console\
    \ by outputting it, you'll notice that the previous example returned three elements\
    \ in the array while this example returned only two. The reason being is that\
    \ these retrieval elements work in relation to the object invoking them. The `document`\
    \ object contains every HTML element hence, the `getElementsByClassName` or `getElementsByTagName`\
    \ search through all the contained elements. When used with an element, it searches\
    \ through all the child nodes or elements of that single parent element.\n\nYou\
    \ can use this array of elements as any other array like using it in a loop:\n\
    \n```javascript\nvar p = document.getElementById('parent1');\nvar a = p.getElementsByClassName('pink');\n\
    \nfor(var i = 0; i< a.length; i++){\n  console.log(a[i]); // outputs one element\
    \ at a time\n  a[i].innerHTML = i; // replaces the contents of the class `pink`\
    \ elements with the respective index\n}\n```\n\n## Let’s manipulate\n\nNow that\
    \ you know how the DOM actually works, how you can retrieve individual or groups\
    \ of elements from the document or from within elements itself lets move on to\
    \ some methods and properties that will allow us to do a bit of manipulation.\n\
    \nBefore we do this lets add some css to our HTML. You can do this by either creating\
    \ an external css file or linking to it in a `link` tag or by adding css in a\
    \ style tag block in the head of the document. Let’s make a few styles here:\n\
    \n```css\n.pink{ color:DeepPink; }\n.red{ color:Red; }\n.blue{ color:Blue; }\n\
    .one{ padding:10px; }\n```\n\nWe'll start by changing some basic attributes. Initially\
    \ we used the `innerHTML` property to completely change the contained HTML of\
    \ any node that could be selected. All elements have a `getAttribute` method that\
    \ returns the attribute passed to it. So if I have an element I can always use\
    \ this to find out about its individual attributes:\n\n```javascript\nvar el =\
    \ document.getElementById('parent1');\nel.getAttribute('class'); //returns one\n\
    ```\n\nNot bad but what if we don't know what the element is and need to check\
    \ for an attribute that doesn't even exist. Like only links have `href` attributes.\
    \ We have another method that allows us to check if an element has an attribute\
    \ aptly named `hasAttribute`:\n\n```javascript\nvar el = document.getElementById('parent1');\n\
    el.hasAttribute('href'); //returns false\n```\n\nThat is all said and done let’s\
    \ combine the two functions and do a bit of manipulation here. Let’s change the\
    \ class of the `parent1` element here, for this say hello to the `setAttribute`.\n\
    \n```javascript\nvar el = document.getElementById('parent1');\nif(el.hasAttribute('class')){\n\
    \  el.setAttribute('class', 'blue');\n}\n```\n\nWhoa that really changed some\
    \ color there. But wait - we seemed to have lost the padding that was with the\
    \ original class. That is because we've overwritten the attribute. If we want\
    \ to simply append the classname we would use the `getAttribute` function to retrieve\
    \ the existing class before making the change.\n\n```javascript\nvar el = document.getElementById('parent1');\n\
    if(el.hasAttribute('class')){\n  cls = el.getAttribute('class'); // cls is now\
    \ one\n  el.setAttribute('class', 'blue ' + cls);\n}\n```\n\nWe set the class\
    \ to have both the `blue` and the `one` class as an appended string. This is a\
    \ very versatile set of functions that allow us to do anything with any element.\n\
    \n## Traversal Traversal / Add and Remove!\n\nWe can select elements, we can manipulate\
    \ them now - weve pretty much gained control over the page. However so far we\
    \ have been manipulating with respect to class names, ids and tag names. Very\
    \ often you would need to access elements with reference to their positioning\
    \ with other elements in the page. For example you can't have an id for just about\
    \ every element on the page that seems impractical especially if your page is\
    \ complex and filled with a lot of HTML. What if you wanted to select and change\
    \ the color of elements next to elements of a specific id, or what if you wanted\
    \ to change the class names of the nth list item in an unordered list? You can\
    \ only do so much with loops and looping through every single element on the page\
    \ is highly impractical and will definitely slow down and crash your page.\n\n\
    Here we look at a few methods that allow us to easily traverse the DOM. These\
    \ methods take full advantage of the tree structure on which the DOM is based\
    \ that elements can have parent and child elements. For this example well be using\
    \ the following HTML snippet.\n\n```html\n<table class=\"base\">\n  <tr>\n   \
    \ <td>Item</td>\n    <td>A</td>\n  </tr>\n  <tr>\n    <td>Item</td>\n    <td>B</td>\n\
    \  </tr>\n</table>\n\n<ul name=\"list\">\n  <li>Element 1</li>\n  <li>Element\
    \ 2</li>\n  <li>Element 3</li>\n</ul>\n```\n\nLet’s say we want to access the\
    \ first element in the unordered list. Let’s use the `childNodes` property which\
    \ returns all the child nodes of the element.\n\n```javascript\nvar el = document.getElementsByName('list')[0];\n\
    var ch = el.childNodes;\nconsole.log(ch);\n```\n"
  raw: 'Just as the document object has methods and properties so do all the nodes
    have their own properties. We''ve checked the innerHTML property of the h1 node
    already in the above example.


    Note - the getElementById only returns a single element and not an array. If you
    have more than one element on your page with the same ID – that is really bad
    HTML you have there!


    ## Repeat everything is an Object again


    What interesting to note is that just as the document model has its own set of
    properties and methods, so do the elements on the page. Since all the elements
    including the document itself inherits from the Node Object - they all share a
    lot of similar functions yet at the same time some elements have their own set
    of functions and properties.


    For example an a element will have an href attribute which obviously a p or table would
    not. And likewise some elements are displayed as block while some are inline by
    default. This is better covered when you would study HTML and CSS, so we would
    be covering the methods available to elements as well.


    Let’s add the following HTML to our page


    <div id="parent1" class="one">


      <p class="pink"></p>


      <p class="pink" name="para"></p>


      <div id="red"></div>


    </div>


    <p class="pink"></p>


    In the above HTML you have some p elements and a div element nested within the div element
    with the class one. The nested elements are the child elements of the parent element
    which is the div classedone. We could select the pink classed elements above using
    the document functions as below:


    var pink_els = document.getElementsByClassName(''pink'');


    And incidentally we can also retrieve them via the parent elements.


    var p = document.getElementById(''parent1'');


    p.getElementsByClassName(''pink'');


    The above example returns an array of elements just like the previous example,
    but if you inspect it in the console by outputting it, you''ll notice that the
    previous example returned three elements in the array while this example returned
    only two. The reason being is that these retrieval elements work in relation to
    the object invoking them. The document object contains every HTML element hence,
    thegetElementsByClassName or getElementsByTagName search through all the contained
    elements. When used with an element, it searches through all the child nodes or
    elements of that single parent element.


    You can use this array of elements as any other array like using it in a loop:


    var p = document.getElementById(''parent1'');


    var a = p.getElementsByClassName(''pink'');


    for(var i = 0; i< a.length; i++){


      console.log(a[i]); // outputs one element at a time


      a[i].innerHTML = i; // replaces the contents of the class `pink` elements with
    the respective index


    }


    ## Let’s manipulate


    Now that you know how the DOM actually works, how you can retrieve individual
    or groups of elements from the document or from within elements itself lets move
    on to some methods and properties that will allow us to do a bit of manipulation.


    Before we do this lets add some css to our HTML. You can do this by either creating
    an external css file or linking to it in a link tag or by adding css in a style
    tag block in the head of the document. Let’s make a few styles here:


    .pink{


      color:DeepPink;


    }


    .red{


      color:Red;


    }


    .blue{


      color:Blue;


    }


    .one{


      padding:10px;


    }


    We''ll start by changing some basic attributes. Initially we used the innerHTML
    property to completely change the contained HTML of any node that could be selected.
    All elements have a getAttribute, method that returns the attribute passed to
    it. So if I have an element I can always use this to find out about its individual
    attributes:


    var el = document.getElementById(''parent1'');


    el.getAttribute(''class''); //returns one


    Not bad but what if we don''t know what the element is and need to check for an
    attribute that doesn''t even exist. Like only links have href attributes. We have
    another method that allows us to check if an element has an attribute aptly named hasAttribute:


    var el = document.getElementById(''parent1'');


    el.hasAttribute(''href''); //returns false


    That is all said and done let’s combine the two functions and do a bit of manipulation
    here. Let’s change the class of the parent1 element here, for this say hello to
    the setAttribute.


    var el = document.getElementById(''parent1'');


    if(el.hasAttribute(''class'')){


      el.setAttribute(''class'', ''blue'');


    }


    Whoa that really changed some color there. But wait - we seemed to have lost the
    padding that was with the original class. That is because we''ve overwritten the
    attribute. If we want to simply append the classname we would use the getAttribute function
    to retrieve the existing class before making the change.


    var el = document.getElementById(''parent1'');


    if(el.hasAttribute(''class'')){


      cls = el.getAttribute(''class''); // cls is now one


      el.setAttribute(''class'', ''blue '' + cls);


    }


    We set the class to have both the blue and the one class as an appended string.
    This is a very versatile set of functions that allow us to do pretty much anything
    with any attribute of any element.


    Aside that you don''t really need to use the above get and set functions and can
    directly edit the class by accessing the elements className property.


    var el = document.getElementById(''parent1'');


    if(el.hasAttribute(''class'')){


      cls = el.className; // cls is now one


      el.className = ''blue '' + cls;


    }


    The above code works exactly as the code above it. A number of attributes can
    be accessed in this manner which is common to all elements such as:


    node.title  // sets or returns the title


    node.title = ''This is title'';


    node.title; // returns ''This is title''


    node.id


    node.id = ''parent2'';


    node.id; //returns parent2


    The style property works a bit differently in that in the style property refers
    to an Object which holds all the css declarations as individual properties. So
    for example:


    <div id="text" style="border-top:1px solid #CCC; color:red"></div>


    var el = document.getElementById(''text'')''''


    el.style.borderTop;// returns 1px solid #CCC


    el.style.color = ''blue''; // changes the color style to blue


    It’s best to use the style property to edit inline styles instead of the setAttribute function
    as it will overwrite the entire style attribute.


    ## Traversal Traversal / Add and Remove!


    We can select elements, we can manipulate them now - we''ve pretty much gained
    control over the page here. However so far we have been manipulating with respect
    to class names, ids and tag names. Very often you would need to access elements
    with reference to their positioning with other elements in the page. For example
    you can''t have an id for just about every single element on the page that seems
    impractical especially if your page is complex and filled with a lot of HTML.
    What if you wanted to select and change the color of elements next to elements
    of a specific id, or what if you wanted to change the class names of the nth list
    item in an unordered list? You can only do so much with loops and looping through
    every single element on the page is highly impractical and will definitely slow
    down and crash your page.


    Here we look at a few methods that allow us to easily traverse the DOM. These
    methods take full advantage of the tree structure on which the DOM is based that
    elements can have parent and child elements.


    For this example we''ll be using the following HTML snippet.


    <table class="base">


      <tr>


        <td>Item</td>


        <td>A</td>


      </tr>


      <tr>


        <td>Item</td>


        <td>B</td>


      </tr>


    </table>


    <ul name="list">


      <li>Element 1</li>


      <li>Element 2</li>


      <li>Element 3</li>


    </ul>


    Let’s say we want to access the first element in the unordered list. Let’s use
    the childNodes property which returns all the child nodes of the element.


    var el = document.getElementsByName(''list'')[0];


    var ch = el.childNodes;


    console.log(ch);'
