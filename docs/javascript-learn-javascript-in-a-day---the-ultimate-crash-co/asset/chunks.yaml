    When declaring a string in JavaScript you can do it in one of two ways:


    var str = ''Hello'';


    var str = new String(''Hello'');


    Both are pretty much the same, however the first method is more faster and efficient.
    Once you''ve created a string you get with it a host of methods and properties.
    For example here is a sampling for some of the properties and methods you get
    when you use a string.


    var str = ''Hello'';


    str.length; // returns 5 the length of the string


    str.trim(); // removes trailing whitespaces from both ends of a string


    str.concat('' there''); // concatenates the passed in string to the string - just
    like how arrays concat works


    We''ll discuss more on the various string methods and properties in the following
    chapter.


    ## Summary


    *   We touched upon the basics of Object oriented programming.


    *   Everything in JavaScript is an Object.


    *   Objects differ from arrays such that they do not have numerical indexes.


    *   Objects are created from an Object Constructor function.


    *   Objects can have methods and properties.


    *   Primitive Data Types in JavaScript are infact Objects.


    ## Assignment


    #### Exercise 1


    Create a Person Class with the following attributes:


    *   First Name


    *   Last Name


    *   Age


    *   Address


    *   City


    Create 10 different unique Person objects and store them in an array. Make another
    class call it Detective. This class would have at least one function called find_person_by_name.
    This function should take as parameter the first name of a person and return from
    the array of persons the person object with the name.


    Once done make another function that takes a number as parameter and checks for
    persons who are of a younger age than the number passed and returns the person
    object.


    # Chapter 8: The String Object'
