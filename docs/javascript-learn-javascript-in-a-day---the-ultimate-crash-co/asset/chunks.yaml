  trans: "\nHTML DOM 或文档对象模型（Document Object Model）是一种 W3 标准，用于定义和访问网页内容，即 `document`。HTML\
    \ DOM 是一个标准的约定接口，它将所有元素定义为对象，并定义了每个元素的固有属性以及每个元素可用的方法和事件。\n\n网页中的每个元素（包括网页本身）都被称为\
    \ `node`（节点）。这些节点以树形结构排列，以 `document` 节点为根节点，其他节点随其后，例如：\n\n```html\n<html>\n\
    \  <head></head>\n  <body></body>\n</html>\n```\n\n`document` 节点中的第一个节点是 `html`\
    \ 节点，它分别分支为 `head` 元素节点和 `body` 元素节点，以此此类推。\n\n当网页被渲染时，会创建一个该页面的文档对象模型，每一个元素都加载为树上的一个节点。这是理解\
    \ DOM 的非常重要的一种，以便能够对其进行交互和操作，而我们可以通过 DOM 提供的许多方法来实现。\n\n页面上的每个元素（包括页面本身）都是 `node`\
    \ 类的对象。`node` 是基类，定义了页面中的每个元素以及页面本身。正因如此，几乎所有的对象都具有相似的方法和属性，以及它们特有的属性。\n\n让我们从创建一个基础\
    \ HTML 页面开始，我们将在接下来的练习中使用它。你可以将所有 JavaScript 代码放在页面表头中的 `script` 标签中，或者放在外部的 `.js`\
    \ 文件中并将该文件作为外部脚本链接。。\n\n```html\n<html>\n  <head>\n    <title>Hello World</title>\n\
    \  </head>\n  <body>\n    <h1 id=\"heading\">The Page</h1>\n    <p id=\"sub\"\
    \ class=\"base\">This is some text on the page</p>\n    <table class=\"base\"\
    >\n      <tr>\n        <td>Item</td>\n        <td>A</td>\n      </tr>\n      <tr>\n\
    \        <td>Item</td>\n        <td>B</td>\n      </tr>\n    </table>\n    <ul\
    \ name=\"list\">\n      <li>Element 1</li>\n      <li>Element 2</li>\n      <li>Element\
    \ 3</li>\n    </ul>\n  </body>\n</html>\n```\n\n我们将在本章剩余部分中使用这个 HTML 页面，并进行小的变化。为了理解\
    \ DOM 提供的不同函数，我们将利用它们。\n\n## 控制台（Console）？\n\n在继续之前，我们需要熟悉 `console`。我们将在本章剩余部分中使用这个\
