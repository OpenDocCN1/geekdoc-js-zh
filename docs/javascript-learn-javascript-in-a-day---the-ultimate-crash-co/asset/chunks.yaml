    a variable you just declare a variable but when you declare it as an Object of
    the Number constructor as in the above example you get with it a host of properties
    and methods. In JavaScript you can treat primitive variables and values as though
    they were Objects.


    Tip: Use primitive variables, they''re faster - use JavaScript Constructors only
    if you really have to.


    Let’s look at a few methods and properties you get with a Number Object.


    var a = new Number(10);


    a.NaN(); // Checks if a is a number return true or false


