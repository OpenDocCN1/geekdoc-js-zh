    # Chapter 2: The Basics


    Now that you''re all set up and have had your first taste of an actual JavaScript
    application, we move on to understanding the basic syntax of JavaScript.


    JavaScript is unique in respect that it is an interpreted language as opposed
    to a compiled language. In programming you have interpreted languages and compiled
    languages. In an interpreted language the program is executed statement by statement
    whereas in a compiled language - the entire program is first compiled into a format
    that can be executed and then is run. A main characteristic of interpreted languages
    is that if there is an erroneous statement in the program, the statements prior
    to the erroneous statement would still be run and executed however the program
    would halt on encountered the erroneous code.


    You''ll understand why this is important to know later on in the book.


    ## Objective


    In this chapter you will learn about JavaScript variables and the different types
    of variables used in JavaScript code. You will also understand the different operators
    used such for performing arithmetic and logical functions. At the end of the chapter
    you will be well versed with the construction of basic expressions using variables
    and operators.


    ## Core JavaScript Syntax


    Think about syntax as grammar and vocabulary for computers. You can''t talk much
    if you didn''t have much of a vocabulary and you would definitely make no sense
    if you had no sense of grammar. The same also applies to computer programming.
    Like all computer programming languages JavaScript has its own syntax, a set of
    rules which you must abide by when writing valid code.


    JavaScripts syntax is comprised of:


    *   Variables


    *   Operators


    *   Operands


    *   Comments


    *   Expressions


    *   Keywords


    *   Rules


    In our previous code we were introduced to one basic rule of JavaScript and that
    was:


    Every statement must end with a semi-colon


    Note that when we say statement, it doesn''t necessarily mean a statement is all
    code on one line. Whenever you write a statement in JavaScript it has to end with
    a semi-colon. Even if you write multiple statements on the same line, each statement
    ends with a semi-colon. For example:


    var t = 1;var x = 1;


    This is just as good as writing


    var t = 1;


    var x = 1;


    Another useful feature in JavaScript code is the ability to add comments to code.
    Comments are added to give brief explanations of what code actually does. They
    are only for the programmers reference and are not run as JavaScript code. Comments
    are added in JavaScript by prepending the comment with two backslashes. This would
    mark everything on that single line as a comment eg:


    // This is a comment - it doesn''t do anything


    var t;    //Everything beyond this is a comment


    Alternatively comments can be encloses between the characters /* and */ respectively.
    This way of commenting only excludes the content within the characters as comments.
    Eg:


    // This entire line has been commented


    /* This bit of text is all commented */


    var t = 1; /* This is commented out */ var x = 2;


    Commenting code is a very good practice and helps to make sense of what complex
    code does especially if you have to come back to it or if someone else has to
    work on your code. Keep comments short but comprehensive enough for someone to
    understand what the code block below is supposed to do.


    ## Variables in JavaScript


    The variable is a building block for any program. Variables are used to store
    data during the program. In JavaScript a variable is defined using the var keyword.
    So to declare a variable in JavaScript you would write:


    var i;


    In the above code i has been declared as a variable. Its not really doing much
    now, you can assign values to a variable for use in your code using the = sign.
    The equals = sign is referred to as the assignment operator:


    var i = 10;


    The above code declares a variable called i and assigns the number 10 as a value
    to it. The above bit of code can also be rewritten as this:


    var i;


    i = 10;


    Now this value can be used in any bit of JavaScript code. Let’s go back to our
    first example to see this in action. Type out in your JavaScript file:


    var i = 10;


    document.write(i);


    The page now should display the contents of i which is the number 10.


    Also you can declare multiple variables on the same line in JavaScript eg:


    var i, j;


    Plus you can also assign them values on one line as well so the following is also
    perfectly valid JavaScript:


    var i = 10, j = 12;'
