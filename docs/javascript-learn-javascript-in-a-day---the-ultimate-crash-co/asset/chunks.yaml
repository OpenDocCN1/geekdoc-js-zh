  trans: "\n函数通过使用 `function` 关键字后跟函数名、圆括号以及在大括号内包围的代码来声明。函数的命名方式与变量的命名方式几乎相同，即它们仅由字母、数字和下划线组成，且不能以数字开头。下面的示例是一个返回消息的函数示例。\n\
    \n```javascript\nfunction greet(name){\n    return 'Hello ' + name;\n}\n```\n\n\
    函数可以接受参数并返回结果。在上面的示例中，名为 `greet` 的函数接受一个名为 `name` 的参数。`return` 关键字起着两个作用：首先它会跳出函数，其次每当函数被调用时返回一个值。上面的函数可以像下面这样调用：\n\
    \n```javascript\ngreet('Bob');\n```\n\n运行这段代码似乎没有产生任何结果，因为函数返回了一个值而我们没有对其进行任何处理。让我们用一个变量来捕捉函数返回的值。\n\
    \n```javascript\nvar greeting = greet('Bob');\ndocument.write(greeting);\n```\n\
    \n在上面的示例中，变量 `greeting` 被赋值为 `greet()` 函数返回的值，在这种情况下，我们将字符串 'bob' 传递给了函数。函数返回了\
    \ 'Hello Bob'，由于我们使用 `document.write` 将其打印到屏幕上——你会在页面上看到它。这就是函数大致的工作原理。在此之前，我们实际上使用了一些原生\
    \ JavaScript 函数，它们的工作方式与上面定义的函数相同。\n\n## 一些原生 JavaScript 函数\n\n在之前的章节中，我们介绍了一些核心原生\
    \ JavaScript 函数，例如 `alert`、`confirm` 和 `prompt` 函数。所有这些函数都接收参数并返回结果，与我们的简单示例相似。例如，在调用\
    \ `confirm` 时：\n\n```javascript\nvar a = confirm('Are you sure?');\n```\n\n我们传入一个参数，即要在\
    \ `confirm` 弹出框中显示的消息，而函数作为回报将显示框，捕捉用户的选择，并根据用户的选择返回 true 或 false 值。`prompt` 函数也是如此。\n\
    \n## 将函数赋值给变量\n\n在 JavaScript 中，声明函数的方法不止一种。函数也可以被赋值给变量——从技术上讲说，它仍然是一个函数声明。例如，上面的函数可以完全重写为如下：\n\
    \n```javascript\nvar greet = function(name){ return 'Hello '+name;};\n```\n\n\
    请记住，在调用函数时，后面总是要跟上 `()`。如果你尝试在不带后续括号的情况下调用函数——它会返回整个函数的定义。在上面的示例中：\n\n```javascript\n\
    var greet = function(name){ return 'Hello '+name;};\ndocument.write(greet('Bob'));\
    \ // 打印 'Hello Bob';\ndocument.write(greet); // 打印 function(name){ return 'Hello\
    \ '+name;};\n```\n\n一旦声明了函数，就可以进一步赋值给另一个变量。例如：\n\n```javascript\nvar greet = function(name){\
    \ return 'Hello '+name;};\nvar g = greet;\ng('Bob'); // 等于 greet('Bob');\n```\n\
    \n这是在处理函数时 `()` 括号可以产生的一个细微但巨大的区别。函数允许你使用不同的变量重用相同的代码。如果你有一段代码显然会被再次使用或能够独立完成一组功能——那么将其放入函数并进行函数调用是一个好主意。\n\
    \n## 向函数传递参数\n\n如果不能从函数中获取自定义结果，那么函数将没有太大用处。传递给函数的参数可以通过声明参数时给定的参数名称在函数内部访问。在\
    \ JavaScript 中，你可以选择声明要传递的参数，也可以不声明。在上面的示例中，我们明确提到了在函数作用范围内使用的第一个参数的名称，即在此情况下为\
    \ `name`。所以你可以向函数传递任何变量，但在函数内部，它将通过函数声明时的名称进行引用。\n\n你可以向函数传递尽可能数量的声明参数。例如：\n\n\
    ```javascript\nfunction add(num1, num2){\n    return num1 + num2;\n}\nadd(2,3);\
    \ // 返回 5\n```\n\n你在函数声明中声明的任何参数都可以通过其被声明时的名称进行引用，如上面的示例所示，传递给函数的两个参数分别是 `num1`\
    \ 和 `num2`。如果由于某些原因没有所有的函数参数都已传递：\n\n```javascript\nfunction add(num1, num2){\n\
    \    return num1 + num2;\n}\nadd(10) //\n```\n\n上述代码将产生错误，因为 `num2` 没有传递值，因此是\
    \ `undefined`。或者，你也可以传递比声明数量数量的参数，例如：\n\n```javascript\nfunction add(num1, num2){\n\
    \    return num1 + num2;\n}\nadd(10, 12, 34, 5, 33) //\n```\n\n在上面的示例中，我们传递了比声明更多的参数，但在函数内部无法引用它们，因为我们没有在函数定义中为它们声明任何名称。然而，这不会导致错误。要访问此类参数，我们将使用一个所有函数均可访问的内置\
    \ JavaScript 对象，称为 `arguments` 对象。我们将在后面的章节中详细讨论对象，但现在只需要理解对象是一段包含变量和定义函数的特殊代码即可。`arguments`\
    \ 对象实际上是一个数组，对应于所有传递给函数的参数。\n\n```javascript\nfunction add() {\n    var total\
    \ = 0;\n    for (var i = 0; i < arguments.length; i++) {\n        total+= arguments[i];\n\
    \    }\n    return total;\n}\nadd(2, 55, 90, 17);\n```\n\n在上面的示例中，我们遍历了参数数组——要知道数组是通过数字索引访问的顺序列表。`arguments.length`\
    \ 告诉我们传递了多少参数，因此我们可以遍历整个数组。数组中的每个元素通过索引访问，所以 `[0]` 返回第一个元素，依此类推。我们将在下一章节中详细讨论数组，但现在你可以看到函数是多多功能的。\n\
    \n## 递归函数\n\n递归是编程中的一个重要概念，这是函数调用自身的情况。许多数学表达式会导致无法简单通过循环调用函数的情况。例如，如果你创建一个计算数字阶乘的函数，数字的阶乘是通过乘以从\
    \ 1 到该数字的所有数来计算的。你可以使用循环计算阶乘：\n\n```javascript\nfunction factorial(num){\n   \
    \ var result = num;\n    while (num-- > 2) {\n        result *= num;\n    }\n\
    \    return result;\n}\nfactorial(10);\n```\n\n上面的函数完美地计算了大于 2 数字的阶乘。如果我们放弃 while\
    \ 循环并编写递归函数，我们将得到如下代码：\n\n```javascript\nfunction factorial(num){\n    if (num\
    \ == 0) { // 0 的阶乘总是 1\n        return 1;\n    }else {\n        return (num *\
    \ factorial(num - 1));\n    }\n}\nfactorial(10);\n```\n\n递归函数需要一个条件语句来打破递归循环——在这种情况下，一旦传递给\
    \ `factorial` 的 `num` 值变为 0，factorial 函数就不再被调用，从而函数返回最终结果。递归起初可能有点令人畏畏，很容易不小心地编写一个不知道何时停止调用自身的递归函数，从而导致无限循环。递归通常优于循环语句，因为它倾向于简化代码。\n"
- fmt: "\nWhile working with functions we know for a fact that we can access variables\
    \ that have been passed to the function. And we can also access variables within\
    \ the function which have been explicitly declared. So in the following example:\n\
    \n```javascript\nfunction foo(name){\n    var i = 0;\n    // do something\n}\n\
    ```\n\nThe variable `name` and the variable `i` is accessible by code within the\
    \ function. This is defined as Local scope - we say that the variables defined\
    \ within a function have local scope as they are accessible only by code within\
    \ the function. So in the below example:\n\n```javascript\nfunction foo(name){\n\
    \    var i = 12;\n    // do something\n    document.write(i); // prints the value\
    \ of i\n}\n\ndocument.write(i); // prints nothing\n```\n\nThe local variable is\
    \ only accessible within the function and not by code outside the function. Local\
    \ variables exist when a function is invoked and are destroyed when the function\
    \ is done with.\n\nHowever let’s consider the following example:\n\n```javascript\n\
    var stuff = 12;\n\nfunction foo(name){\n    var i = 0;\n    // do something\n\
    \    document.write(stuff); // prints the value of stuff\n}\n```\n\nHow could\
    \ the function access the variable `stuff` which was declared outside the function?\
    \ Variables declared out side functions on the page have what is called the Global\
    \ scope. Such variables can be accessed in any function. The variable can not\
    \ only be accessed but also modified by functions as well without having to even\
    \ explict pass it.\n\n```javascript\nvar stuff = 12;\n\nfunction foo(){\n    //\
    \ do something\n    stuff = 15;\n}\n\nfoo();\n\ndocument.write(stuff); // prints\
    \ 15\n```\n\nAt the same time you can also declare a global variable from within\
    \ a function. To do so you just have to assign a value toa a variable without\
    \ explicitly declaring it using the `var` command. For example:\n\n```javascript\n\
    function foo(){\n    // do something\n    stuff = 15;\n}\n\nfoo();\n\ndocument.write(stuff);\
    \ // prints 15\n```\n\nIn the above example declaring the `stuff` variable without\
    \ the `var` command automatically makes it a global variable which is accessible\
    \ anywhere in the script. One drawback of this is that you can pretty much end\
    \ up modifying a variable without even knowing it. So try to make sure that any\
    \ variables you use are initialized and that your variables have descriptive names.\n\
    \n## Summary\n\n- Functions are blocks of reusable code that can be invoked at\
    \ will instead of having to write the same code again and again.\n- Functions\
    \ can accept parameters.\n- By default all parameters of a function can be accepted\
    \ using the `arguments` array which is automatically passed to every function.\n\
    - Functions can also return values based on the code executed.\n- A recursive\
    \ function is one which calls itself, with recursive functions the function invokes\
    \ itself until a certain condition is evaluated.\n\n## Assignment\n\n### Exercise\
    \ 1\n\nHow much do you earn in a day if you work 8 hours? Create a function that\
    \ takes an hourly rate and outputs the amount you would make in a month if you\
    \ work 8 hours everyday.\n\n### Exercise 2\n\nIn the previous chapter you ran\
    \ a conditional statement to check if a number entered was larger than or greater\
    \ than 100. Recreate the functionality with a function.\n\n# Chapter 6: Arrays\
    \ - nicely lined up!\n\nAt times you need to work on more than just a single variable.\
    \ The idea of a single variable holding a single value cannot hold true in many\
    \ rel life examples. A carton of eggs may be regarded as a single unit but then\
    \ again - so is each and every egg in the carton. A block of houses might seem\
    \ like a single unit, but each and every single house on that block is also a\
    \ unit accessible in its own right. Very soon you'll understand that there has\
    \ to be a better way to collate values than assigning them to an individual variable.\n\
    \n## Overview\n\nIn this chapter we will touch upon the concept of Arrays and\
    \ how arrays are implemented in JavaScript. We will look at array declarations,\
    \ the benefits of using arrays as well as the various traversal techniques used\
    \ to go through arrays. During this chapter you will be acquainted to the `Array`\
    \ object. Through usage of the `Array` Object you will also be introduced to the\
    \ concept of using Objects in JavaScript.\n\n## The concept of arrays\n\nSo far\
    \ we've used variables that would hold a single value. This might have worked\
    \ well for all the examples and situations we've come across but practically there\
    \ would be many instances where you would need to access multiple values through\
    \ a single declared variable. Much like the concept of houses - you can consider\
    \ each house on a street accessible by the individual address of the house on\
