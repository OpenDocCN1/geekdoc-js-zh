    ## Browser specific functions -lets navigate


    All modern browsers provide another object namely called the navigator object.
    This is a basic object which technically refers directly to the browser. While
    the window object referred to the actual instance of an open browser window, the
    navigator object instead refers to the browser itself. Both the window and navigator
    object are used hand in hand to create a rich fulfilling interactive experience
    for the user.


    Here is a basic example of one of the navigator objects functions:


    navigator.language;// This returns the language of the browser


    document.write(''This browser speaks '' + navigator.language);


    Assuming you have Us English as the default language set on your browser you should
    get something like:


    This browser speaks en-US


    Aside that the navigator object also allows you to retrieve information about
    the browser such as what browser it is, the user agent which is more details about
    the browser and what operating system its running on etc.


    document.write(''This browsers user agent is '' + navigator.userAgent);


    document.write(''<br/>This browser is '' + navigator.appName);


    If you run the above code you should see two lines with distinctive information
    - something like:


    This browsers user agent is Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:34.0) Gecko/20100101
    Firefox/34.0


    This browser is Netscape


    This should show you the difference in values that .useAgent and .appName return.
    While you may find it hard to understand where these functions can even be used,
    during the course of development you may run into situations where you might require
    to know beforehand the kind of browser as well as the operating system run by
    your users example for an online survey, or if you wish to allow/disallow a download
    link if it supports the users operating system.


    ## Where are you man! GeoLocationing


    This is perhaps one of the more common and fascinating uses of the navigator object.
    The navigators’ geolocation property provides functions that return the actual
    geolocation of the user. This actually requires the user to give approval prior
    to getting the users position. Using this you can pin point to a very fair degree
    of accuracy the location of the user. This information can be used to populate
    a map or store coordinates. Let’s try a simple example here.


    function writePos(position){


      document.write("Latitude: " + position.coords.latitude + ''<br/>'');


      document.write("Longitude: " + position.coords.longitude);


    }


    navigator.geolocation.getCurrentPosition(writePos);


    Run the above code, your browser should ask you whether or not you want to share
    your location. Allow the browser and you should see written above the coordinates
    as noted in the writePos function. Now what is going on here, we''ll have to deconstruct
    the code a bit.


    The navigator.geolocation property is a geolocation object which provides a function getCurrentPosition,
    this function takes as a parameter a function to which it passes a position object
    which contains its own set of properties, one of which we''ve sued is the coords property.
    This in turn holds the respective latitude and longitude values of the user browser.


    These latitude and longitude values can be used to show the users location on
    a map.


    Using such information you can tailor an application to get location specific
    details which could be of interest to the user.


    Let’s use Google Maps api to show the location on a map - this is really quick
    stuff here. Let’s rewrite the above code so we not only read the coordinates but
    also see a small map.


    function writePos(position){


      var map_url = "http://maps.googleapis.com/maps/api/staticmap?center="+position.coords.latitude
    + "," + position.coords.longitude+"&zoom=12&size=550x400&sensor=false";


      document.write("Latitude: " + position.coords.latitude + ''<br/>'');


      document.write("Longitude: " + position.coords.longitude);


      document.write(''<br/><img src="'' + map_url + ''" />'');


    }


    navigator.geolocation.getCurrentPosition(writePos);


    Run that code, in the above we''ve used google maps api which returns an image
    based upon the coordinates passed to it. You should now see a map that shows you
    your location, well at least close enough to freak you out!


    ## Redirect users at will


    Another oft used property provided by the window document object is location.
    This isn''t geolocation, just refers to the web url in your browser. The location object
    on its own provides a series of functions and attributes that can be set or retrieved.
    We''ll go over a few of them.


    // assuming we''re on http://www.somesite.com/page/1?v=12


    window.location.hostname; // returns the hostname - based on the above example
    www.somesite.com


    window.location.href // returns or sets the entire url


    window.location.pathname; // returns or sets the pathname or as above /page/1


    window.location.search; // returns or sets the querystring i.e. ?v=12


    The location object allows you to deconstruct and access/modify many parts of
    the url in the browser. Let’s use for a simple example the href property which
    is the most commonly used to redirect users from a webpage. Write up the following
    code:


    <a href="#" id="link-to-yahoo">Go To Yahoo</a>


    var a = document.getElementById(''link-to-yahoo'');


    a.onclick = function(){


      window.location.href = ''http://www.yahoo.com'';


    }


    Run the code and click on the link, you''ll see we can now redirect to yahoo.
    Think of a situation where you want to redirect to a location inputted by the
    user for an example, or to a link that is constructed in real-time. Plus at times
    you would want to redirect based upon the users input i.e. to an error page, or
    let’s say the user doesn''t permit you to access his location, you could use the
    above to redirect to an error page on your site.


    ## Go back in time - or History


    One more very useful function of the browser is the ability to go back in history,
    the browsers history that is. Sure you can say that you can always use the back
    button on your browser. But that defeats the whole purpose of making your web
    page user friendly in the first place. At times you might want a reference to
    the last page the user has been on, or you might want to check where the user
    has come to your page from. We''ll make use of the window.history object. Let’s
    make a link that sends us back to a page in our history.


    <a href="#" id="link-to-back">Go Back</a>


    var a = document.getElementById(''link-to-back'');


    a.onclick = function(){


      window.location.href = window.history.back();


    }


    Open a few pages and then navigate to your code page. Run it and click on the
    link, you''ll see that you''ve been sent back to the previous page you were on.
    Alternatively the historyobject also provides aforward method which moves you
    one page ahead if you came to the current page by clicking back. At times you
    would want to have a go back link on your web pages, it’s much better than having
    the user figure out that the only way out is to use the back button on his browser,
    in which case its highly unlikely that he''d ever want to come back again!


    ## Do you want a cookie?


    We''re not talking about what goes well with milk and cream, a cookie is a file
    created by a website on your browser which holds data. Whenever you use a website
    you''re making a request to a server which sends back html. However there is no
    way for the website to actually identify you as a unique user. Cookies help in
    identifying the user by storing information about the user on the users browser.
    For example a website where you enter your name on entry, if we didn''t use cookies
    you would have to enter your name every time you''d visit the site during a session,
    however when the name is stored by the website in a cookie, it identifies you
    and knows your name.


    Cookies are stored as pairs of values and attributes separated by semicolons eg:


    ''name=Bob; Age=32;''


    Cookies can also have an expiry date attached to them, this allows the browser
    to clear out old cookies as well as keep cookies with data stored for a copious
    amount of time. Example:


    ''name=Bob; Age=32; expires=Thu, 1 Feb 2015 12:00:00 UTC''


    By default cookies are deleted when the browser is closed, only cookies that have
    an expiry date remain until the date.


    Creating a cookie is simple just using document.cookie.


    document.cookie = ''name=Bob; Age=32; expires=Thu, 1 Feb 2015 12:00:00 UTC'';


    A cookie can also be changed, you just need to change the properties that were
    passed to the original cookie:


    document.cookie = ''name=Jimmy; Age=16; expires=Fri, 2 Feb 2015 12:00:00 UTC'';


    Deleting cookies is simple, just pass in a passed expiry date and the cookie would
    be deleted.


    document.cookie = ''name=; Age=; expires=Thu, 01 Jan 1970 00:00:00 UTC'';


    To access a cookie, you can use the document.cookie property to retrieve all cookies
    that have been stored. Note retrieving a cookie will return the above string as
    a string, you would need to use a bit of string manipulation to retrieve individual
    values from a cookie here.


    Note that it is important that if you use cookies on your website, that you make
    it known to the user that your website uses cookies.


    ## Summary


    *   We learnt that the navigator object is used to return browser specific information

    *   We understood how geolocation works and how to display coordinates of the
    current user.

    *   We also understood the location object and how to redirect users as well as
    deconstruct the url in the browser.

    *   We were introduced to cookies and understood how cookies work as well as how
    to set, retrieve and destroy - cookies.


