  trans: "\n事件发生在元素上，并由用户以无数种方式执行。\n\n在继续进行之前，我们需要查看 JavaScript 中拥有的各种不同事件以及它们是如何分组的。\n\
    \n### 事件 - 不要到处乱点鼠标！\n\nHTML 中最基本的交互形式是 `a` 标签。它是指向不同页面或资源的简单链接。然而，所有的 DOM 元素都能响应几乎类型的事件。预期的事件大多数肯定通过鼠标或光标。因此，所有与\
    \ DOM 元素相关的事件都是基于用户的鼠标操作。\n\n让我们在 HTML 内部创建一个简单的事件处理程序示例：\n\n```html\n<a href=\"\
    http://www.yahoo.com\" onclick=\"return false;\">Click</a>\n```\n\n将该内容放入你的 HTML\
    \ 文件中并尝试点击链接。出于某种原因，它不起作用。如果你查看代码，你会发现我们给元素添加了 `onclick` 属性。`onclick` 实际上对应于用户的点击动作，而该属性的内容是纯\
    \ JavaScript。这段代码仅仅返回布尔值 `false`。向点击处理程序返回 `false` 基本上意味着什么都不做。这正是我们所做的。让我们稍微修改一下：\n\
    \n```html\n<a href=\"http://www.yahoo.com\" onclick=\"return confirm('Are you\
    \ sure?');\">Click</a>\n```\n\n运行它并现在点击，你会得到一个确认框，如果你回答肯定，它会重定向，因为你传递了一个 `true`\
    \ 值；如果你选择否定，它就不会重定向，因为你传递了 `false`。这是在事件处理程序中编写代码的一种简单方法。但如果我们我们需要对多个链接执行此操作呢？\n\
    \n```html\n<a href=\"http://www.yahoo.com\" onclick=\"return confirm('Are you\
    \ sure?');\">Click</a>\n<a href=\"http://www.google.com\" onclick=\"return confirm('Are\
    \ you sure?');\">Click</a>\n<a href=\"http://www.bing.com\" onclick=\"return confirm('Are\
    \ you sure?');\">Click</a>\n```\n\n这非常单调。我们可以做的是将 JavaScript 放入一个函数并调用该函数。\n\n\
    ```javascript\nfunction doConfirm(){\n  return confirm('Are you sure?');\n}\n\
    ```\n\n```html\n<a href=\"http://www.yahoo.com\" onclick=\"doConfirm()\">Click</a>\n\
    <a href=\"http://www.google.com\" onclick=\"doConfirm()\">Click</a>\n<a href=\"\
    http://www.bing.com\" onclick=\"doConfirm()\">Click</a>\n```\n\n好多了，但我们仍然需要对每个函数进行调用——让我们在\
    \ JavaScript 中处理处理事件的所有代码。\n\n```javascript\nvar a = document.getElementsByTagName('a');\n\
    \nfor(var i = 0; i< a.length; i++){\n  a[i].onclick = function(){\n    return\
    \ confirm('Are you sure?');\n  }\n}\n```\n\n```html\n<a href=\"http://www.yahoo.com\"\
    >Click</a>\n<a href=\"http://www.google.com\">Click</a>\n<a href=\"http://www.bing.com\"\
    >Click</a>\n```\n\n显然要好得多，正如你看到的，我们选择了所有的 `a` 元素并为单独的 `onclick` 事件分配了一个函数。HTML\
    \ 是整洁的，我们没有任何 JavaScript 和 HTML 的混杂。\n\n**注意：** 保持你的 HTML 和 JavaScript 分离\n\n\
    这是一个使用 `onclick` 事件的示例。还要理解，不仅仅是 `a` 链接标签响应 `onclick` 事件。你拥有的任何元素都可以响应 `onclick`\
    \ 事件。让我们用段落尝试一下，并使用一些 CSS 给段落一个背景颜色，以便我们知道在点击什么。\n\n```html\n<p id=\"clickable\"\
    \ style=\"background-color:yellow\">\n  You can click on me\n</p>\n```\n\n```javascript\n\
    document.getElementById('clickable').onclick = function(){\n  return alert('Hi!');\n\
    }\n```\n\n只需点击段落，哇，你就得到了一个弹窗警告。这很好且有趣，然而请考虑以下具有相同 HTML 的 JavaScript 示例：\n\n```javascript\n\
    document.getElementById('clickable').onclick = function(){\n  this.style.backgroundColor\
    \ = 'red';\n}\n```\n\n点击段落，你会看到颜色发生了变化。发生了什么？是如何实现的？在上面的 JavaScript 中，我们引入了 `this`\
    \ 关键字。我们在处理类时使用它来声明类属性和方法，它指的是对象本身。在这种情况下，它是对 `clickable` 段落对象的引用，并引用了它的样式。事件处理程序只是在点击时更改了对象的背景颜色。你已经可以看到\
    \ JavaScript 事件的可能性了。\n\n让我们看看另一个事件，即 `dblclick` 事件。它捕获鼠标的双击。让我们修改上面的 JavaScript，以便在点击时背景颜色变为红色，在双击时颜色变为黄色。\n\
    \n```javascript\nvar el = document.getElementById('clickable');\n\nel.onclick\
    \ = function(){\n  this.style.backgroundColor = 'red';\n}\n\nel.ondblclick = function(){\n\
    \  this.style.backgroundColor = 'yellow';\n}\n```\n\n你现在可以疯狂点击并看到颜色变化。正如我们有点击和双击事件一样，我们还有许多其他鼠标事件可以使用，例如：\n\
    \n| 事件 | 描述 |\n| --- | --- |\n| `onmousedown` | 当你按下鼠标键时 |\n| `onmouseenter` |\
    \ 当鼠标指针进入元素时 |\n| `onmouseleave` | 当鼠标指针离开元素时 |\n| `onmousemove` | 当鼠标指针在元素上移动时\
    \ |\n| `onmouseup` | 当你释放鼠标键时 |\n| `onmouseout` | 当鼠标移出元素时 |\n\n```html\n<div\
    \ id=\"counter\">0</div>\n<div id=\"moveover\" style=\"background-color:yellow\"\
    >\n  MOVE OVER\n  <p style=\"background-color:black\">A paragraph</p>\n</div>\n\
    <div id=\"moveenter\" style=\"background-color:yellow\">\n  MOVE ENTER\n  <p style=\"\
    background-color:black\">A paragraph</p>\n</div>\n```\n\n```javascript\nvar el\
    \ = document.getElementById('moveover');\nvar a = 0;\nvar b = 0;\nvar counter\
    \ = document.getElementById('counter');\n\nel.onmouseover = function(){\n  counter.innerHTML\
    \ = a+1;\n}\n\nvar el1 = document.getElementById('moveenter');\n\nel1.onmouseenter\
    \ = function(){\n  counter.innerHTML+=a+1;\n}\n```\n\n在上面的示例中，你会注意到，如果你移动到 MOVE\
    \ ENTER div，它只在你移动时增加一次计数器；然而，如果你进入 MOVE OVER div，每次移动过元素时都会增加计数器。这是这两个事件之间的细微差别，你需要小心处理正确的事件以避免错误。\n\
    \n与这些相似的是 `onmouseleave` 和 `onmouseout` 事件，`onmouseleave` 在鼠标离开元素本身时触发，而 `onmouseout`\
    \ 事件在鼠标移出元素或子元素时触发。我们可以重写上面的 JavaScript 来演示这一点：\n\n```javascript\nvar el = document.getElementById('moveover');\n\
    var a = 0;\nvar b = 0;\nvar counter = document.getElementById('counter');\n\n\
    el.onmouseover = function(){\n  counter.innerHTML = a+1;\n}\n\nel.onmouseleave\
    \ = function(){\n  counter.innerHTML = a-1;\n}\n\nvar el1 = document.getElementById('moveenter');\n\
    \nel1.onmouseenter = function(){\n  counter.innerHTML+=a+1;\n}\n\nel1.onmouseout\
    \ = function(){\n  counter.innerHTML = a-1;\n}\n```\n\n运行代码你可以看到，如果你离开 MOVE OVER\
    \ div，它只在你移动时减少一次计数器；然而，如果你移出 MOVE ENTER div，它会减少你进入该 div 及其子元素段落的次数。\n\n### 每个按键都会触发！\n\
    \n不仅仅是鼠标的事件被捕获，键盘也是一样。你在键盘上按的任何键都可以注册特定的事件处理程序。与键盘相关的三个事件分别是是：\n\n1.  `onkeydown`\n\
    2.  `onkeypress`\n3.  `onkeyup`\n"
- fmt: "\nThese three events occur every time you tap a key on the keyboard and the\
    \ occur in the exact same order as above. When you press a key the first event\
    \ to be fired is the `keydown` event, once the key has been pressed the `keypress`\
    \ event is fired at the end when you release the key - the `keyup` event has been\
    \ fired.\n\nAs a matter of convention use the `keydown` event as it fires for\
    \ all keys in all browsers\n\nThe keyboard functions obviously for sake of ease\
    \ of usage aren't like the mouse events where you can just interact with anything\
    \ as you can't really maneuver the page much with just a keyboard except for form\
    \ elements. So we'll try this with an example form element. Set up the following\
    \ html and JavaScript respectively.\n\n```html\n<input id=\"foo\" />\n<div id=\"\
    counter\"></div>\n```\n\n```javascript\nvar el = document.getElementById('foo');\n\
    \nel.onkeydown = function(){\n  counter = document.getElementById('counter');\n\
    \  counter.innerHTML = this.value.length\n}\n```\n\nRun that and you have a text\
    \ box. Type in it and you should see a counter increment and decrement as you\
    \ type. All form elements have a property called `value` which returns the value\
    \ that has been entered into the element. Every time you make a keypress the event\
    \ is fired which triggers the handler, which in turn fills the counter with the\
    \ string length of the text entered in the text field.\n\nWhat if you needed to\
    \ be specific with respect to the keys that are entered? Let’s assume you want\
    \ the counter to only fire if the spacebar is passed, there has to be a way to\
    \ track which key is pressed. Luckily in JavaScript using the event handlers,\
    \ this is as simple as passing a parameter to your handler. So far we haven't\
    \ passed any parameters explicitly to our parameters, but for every event handler\
    \ an event object is passed to all our events. Let’s declare a variable for the\
    \ first parameter passed to our event handler.\n\n```javascript\nvar el = document.getElementById('foo');\n\
    \nel.onkeydown = function(e){\n  counter = document.getElementById('counter');\n\
    \  if(e.keyCode==32){\n    counter.innerHTML = this.value.length\n  }\n}\n```\n\
