  trans: "\n让我们在这里做一个简单的例子。输入以下 HTML 和 JavaScript 代码。按照良好的习惯，我们将像一直以来所样，将 JavaScript\
    \ 和 HTML 保持分离。\n\n```html\n<a href=\"#\" id=\"open-window\">Open a Window</a><br/>\n\
    <a href=\"#\" id=\"close-window\">Close the Window</a>\n```\n\n我们将把“打开窗口”的链接设置为在弹出窗口中打开\
    \ yahoo 网站。\n\n```javascript\nvar op = document.getElementById('open-window');\n\
    \nop.onclick = function(){\n  window.open('http://www.yahoo.com');\n}\n```\n\n\
    运行代码并点击“打开窗口”链接。它应该会在弹窗中打开 yahoo 站点。这些是非常基础的内容，你可能会奇怪，如果通过链接中添加一个简单的 `target`\
    \ 属性就能实现这个功能，为什么要大费周呢？`window.open` 方法接受多个参数，允许你实际操作打开的窗口。`window.open` 方法接受以下参数：\n\
    \n```\nwindow.open(url, name, option, replace);\n```\n\n让我们来看这些参数，`url` 被理解为要在窗口中打开的\
    \ URL。然而，如果传递了 `name` 属性，它指向以下值之一：\n\n- `'_blank'`：如果传递此值，URL 将在一个新窗口中加载，这是默认操作\n\
    - `'_parent'`：如果你以前接触过框架（frames），你就会理解这里的父框架指的是包含当前页面的所有框架；在我们的示例中没有框架，所以这实际上并不适用。\n\
    - `'_self'`：这意味着将 URL 加载到当前页面，在这种情况下它不是弹出窗口。URL 将在当前窗口中加载\n- `any name`：这是一个我们可以在稍后的任何代码中使用它来引用该窗口的名称\n\
    \n让我们在这里再添加另一个链接，它将在打开的同一个窗口中打开 google 页面。\n\n```html\n<a href=\"#\" id=\"open-window\"\
    >Open a Window</a><br/>\n<a href=\"#\" id=\"open-google\">Open Google</a><br/>\n\
    <a href=\"#\" id=\"close-window\">Close the Window</a>\n```\n\n### 让我们对 JavaScript\
    \ 进行一些修改\n\n"
- fmt: "\n```JavaScript\nvar op = document.getElementById('open-window');\n\nop.onclick\
    \ = function(){\n  window.open('http://www.yahoo.com', 'basic');\n}\n\nvar op\
    \ = document.getElementById('open-google');\n\nop.onclick = function(){\n  window.open('http://www.google.com',\
    \ 'basic');\n}\n```\n\nRun that code and click on the first link, it open a window\
    \ just like it did before, now click on the open google link. Suprisingly, we\
    \ don't get another window instead the google website opens up in the same original\
    \ window. If you look at the code above we assigned a name, `'basic'` to the window\
    \ when we opened it up. This can be any name you want it be, however by doing\
    \ so we can now reference the same window object in our code. This allows us to\
    \ manipulate a window object from another page, provided those object was created\
    \ from the same page code though.\n\nAlternatively, the `window.open()` method\
    \ also returns a window object that we can use just like it was another object,\
    \ and assign it to a variable. Let’s modify the code above, change the names of\
    \ the links a bit.\n\n```javascript\nvar op = document.getElementById('open-window');\n\
    \nop.onclick = function(){\n  wn = window.open('', 'basic');\n}\n\nvar opg = document.getElementById('open-google');\n\
    \nopg.onclick = function(){\n  wn.open('http://www.google.com', 'basic');\n}\n\
    ```\n\nIn the above code, we made the first link open a blank window, and assigned\
    \ the returned window object to a variable `wn`. Then we opened the google site\
    \ the same window using that objects `open` property. With a reference to the\
    \ newly created window, we can do more than just open a site in it, let’s add\
    \ another link on the page and some more JavaScript:\n\n```html\n<a href=\"#\"\
    \ id=\"open-window\">Open a Window</a><br/>\n<a href=\"#\" id=\"open-google\"\
    >Open Google</a><br/>\n<a href=\"#\" id=\"write-stuff\">Write Stuff</a><br/>\n\
    <a href=\"#\" id=\"close-window\">Close the Window</a>\n```\n\n```javascript\n\
    var op = document.getElementById('open-window');\n\nop.onclick = function(){\n\
    \  wn = window.open('', 'basic');\n}\n\nvar opw = document.getElementById('write-stuff');\n\
    \nopw.onclick = function(){\n  wn.document.write('Hello there', 'basic');\n}\n\
    \nvar opg = document.getElementById('open-google');\n\nopg.onclick = function(){\n\
    \  wn.open('http://www.google.com', 'basic');\n}\n```\n\nRun the code, open the\
    \ blank window, then click on the write link, amazingly you can write text in\
    \ your newly created window from code in the original window.\n\nNote this example\
    \ also illustrates that the `document` object is a node of the `window` object.\n\
    \nClosing an opened window is just as simple. Just make a call to `window.close()`.\n\
    \n```javascript\nvar opc = document.getElementById('close-window');\n\nopg.onclick\
    \ = function(){\n  wn.close();\n}\n```\n\nAdd the above code and the close button\
    \ link closes the newly created window. The `window.open()` function also provides\
    \ a number of ways to modify the window that has been opened up. You can set its\
    \ size, show and hide toolbars and buttons on the browser etc. For these modifications\
    \ we'll look at the third parameter passed to the `window.open()` function. This\
    \ parameter takes a string of comma separated settings that define the required\
    \ modifications to the newly opened window.\n\nThe following is a list of examples\
    \ that outline the different settings:\n\n`window.open('', '', 'height=300');`\
    \ //blank window opens with a height of 300 pixels\n`window.open('', '', 'left=100');`\
    \ //blank window opens 100 pixels to the left of the screen\n`window.open('',\
    \ '', 'location=no');` //Hide the location bar, take yes to show it - not supported\
    \ by all browsers\n`window.open('', '', 'menubar=no');` //Hide the menubar , take\
    \ yes to show it - not supported by all browsers\n`window.open('', '', 'resizable=no');`\
    \ //Allows/ disallows window from being resizable - not supported by all browsers\n\
    `window.open('', '', 'scrollbars=no');` //Hide the scollbars, take yes to show\
    \ it - not supported by all browsers\n`window.open('', '', 'status=no');` //Hide\
    \ the status bar, take yes to show it\n`window.open('', '', 'width=300');` //blank\
    \ window opens with a width of 300 pixels\n`window.open('', '', 'width=300, height:400,\
    \ left=150, location=no');` //blank window opens with a width of 300 pixels, 400\
    \ pixels height, 150 pixels to the left and no location bar\n\nAs you can see\
    \ that using the `window.open()` function you can do more than just open urls\
    \ in a different window, going as far as to customize the nature and even positioning\
    \ of the window.\n\n**Note:** Even though this is all cool and fun, in real life\
    \ settings, window pop ups are frowned upon and should be used only sparingly.\n\
    \n## Browser specific functions - lets navigate\n\nAll modern browsers provide\
    \ another object namely called the `navigator` object. This is a basic object\
    \ which technically refers directly to the browser. While the `window` object\
    \ referred to the actual instance of an open browser window, the `navigator` object\
    \ instead refers to the browser itself. Both the `window` and `navigator` object\
    \ are used hand in hand to create a rich fulfilling interactive experience for\
    \ the user.\n\nHere is a basic example of one of the `navigator` objects:\n\n\
    `navigator.language` // This returns the language of the browser\n`document.write('This\
    \ speaks ' + navigator.language);`\n\nAssuming you have `English` as the default\
    \ language set on your browser you should get something like: `This speaks en-US`.\n\
    \nAside that the `navigator` object also allows you to retrieve information about\
    \ the browser such as what browser is, `userAgent` which is more details about\
    \ the browser and what operating system its on:\n\n`document.write('This user\
    \ agent is ' + navigator.userAgent);`\n`document.write('<br/>This browser is '\
    \ + navigator.appName);`\n\nIf you run the above code you should see two lines\
    \ with distinctive information - something like: `user agent is Mozilla/5.0 (Ubuntu;\
    \ Linux x86_64; rv:34.0) Netscape`. This should show you the difference in values\
    \ that `.userAgent` and `.appName`.\n\n## Where are you! GeoLocation\n\nThis is\
    \ perhaps one of the more common and fascinating uses of the `navigator` object.\
    \ The `geolocation` property provides functions that return the actual geolocation\
    \ of the user. This actually requires the user to give approval prior to getting\
    \ the position. This information can be used to populate a map or store coordinates.\
    \ Let’s try a simple example here:\n\n```javascript\nfunction writePos(position){\n\
    \  document.write(\"Latitude: \" + position.coords.latitude + '<br/>');\n  document.write(\"\
    Longitude: \" + position.coords.longitude);\n}\nnavigator.geolocation.getCurrentPosition(writePos);\n\
    ```\n\nRun the above code, your browser should ask you whether you want to share\
    \ your location. Allow the browser and you should see written above noted in the\
    \ `writePos` function. Now what is going here, we'll have to deconstruct the code\
    \ bit. The `navigator.geolocation` property is a geolocation object which provides\
    \ a function `getCurrentPosition`, this function takes as a parameter a function\
    \ to which it passes a `position` object which contains its set of properties,\
    \ one of which we've used is the `coords` property. This in turn holds the `latitude`\
    \ and `longitude` values of the user.\n\nUsing such information you can tailor\
    \ an application to get location specific details which could be of interest to\
    \ the user. Let’s use Google Maps API to show the location on a map - this is\
    \ really quick stuff.\n\n```javascript\nfunction writePos(position){\n  var map_url\
    \ = \"http://maps.googleapis.com/maps/staticmap?center=\"+position.coords.latitude\
    \ + \",\" + position.coords.longitude+\"&zoom=12&size=550x400&sensor=false\";\n\
    \  document.write(\"Latitude: \" + position.coords.latitude + '<br/>');\n  document.write(\"\
    Longitude: \" + position.coords.longitude);\n  document.write('<br/><img src=\"\
    ' + map_url + '\" />');\n}\nnavigator.geolocation.getCurrentPosition(writePos);\n\
    ```\n\nRun that code, in the above we've used maps API which returns an image\
    \ based upon the coordinates passed to it. You should now see a map that shows\
    \ you your location, well at least close enough to freak you out!\n\n## Redirect\
    \ users at will\n\nAnother oft used property provided by the `window` object is\
    \ `location`. This isn't geolocation, just refers to the web url in your browser.\
    \ The `location` object on its own provides a series of functions and attributes\
    \ that can be set or retrieved. We'll go over a few of them:\n\n// assuming we're\
    \ on `http://www.somesite.com/page/1?v=12`\n\n`window.location.hostname;` // returns\
    \ the hostname - based on the above example `www.somesite.com`\n`window.location.href`\
    \ // returns or sets the entire url\n`window.location.pathname;` // returns or\
    \ sets the pathname or as above `/page/1`\n`window.location.search;` // returns\
    \ or sets the querystring i.e. `?v=12`\n\nThe location object allows you to deconstruct\
    \ and access/modify many parts of the url in the browser. Let’s use for a simple\
    \ example the `href` property which is the most commonly used to redirect users\
    \ from a webpage.\n\nWrite up the following code:\n\n```html\n<a href=\"#\" id=\"\
    link-to-yahoo\">Go To Yahoo</a>\n```\n\n```javascript\nvar a = document.getElementById('link-to-yahoo');\n\
    \na.onclick = function(){\n  window.location.href = 'http://www.yahoo.com';\n\
    }\n```\n\nRun the code and click on the link, you'll see we can now redirect to\
    \ yahoo. Think of a situation where you want to redirect to a location inputted\
    \ by the user for an example, or to a link that is constructed in real-time. Plus\
    \ at times you would want to redirect based upon the users input i.e. to an error\
    \ page, or let’s say the user doesn't permit you to redirect to an error page\
    \ on your site.\n\n## Go back in time - or History\n\nOne more useful function\
    \ of the browser is the ability to go back in history. Sure you can always use\
    \ the back button on your browser. But defeats the whole purpose of making your\
    \ web page user friendly. At times you might want a reference to the last page\
    \ the user has on, or you might want to check where the user came from. We'll\
    \ make use of the `window.history` object. Let’s make a link that sends us back\
    \ to a page in our history:\n\n```html\n<a href=\"#\" id=\"link-to-back\">Go Back</a>\n\
    ```\n\n```javascript\nvar a = document.getElementById('link-to-back');\n\na.onclick\
    \ = function(){\n  window.location.href = window.history.back();\n}\n```\n\nOpen\
    \ a few pages and then navigate to your code. Run it and click on the link, you'll\
    \ see that've been sent back to the previous page you were on. Alternatively the\
    \ `history` object also provides a `forward()` method which moves you one page\
    \ ahead if you came to the current page. At times you would want to have a back\
    \ link on your web pages.\n\n## Do you want a cookie?\n\nWe're not talking about\
    \ what goes with milk and cream, a cookie is a file created by a website on your\
    \ browser which holds data. Whenever you use a website you're making a request\
    \ to a server which sends back html. There is no way for the website to actually\
    \ identify you as a unique user. Cookies help in identifying the user by storing\
    \ information about the user on browser. For example a website where you enter\
    \ your name on entry, if we didn't use cookies you would have to enter your name\
    \ every time visit the site, however when the name is stored by a cookie, it identifies\
    \ you and knows your name.\n\nCookies are stored as pairs of values and attributes\
    \ separated by semicolons, eg: `'name=Bob; Age=32;'`. Cookies can also have an\
    \ expiry date attached to them, this allows the browser to clear out old cookies\
    \ as well as keep cookies with data for a copious amount of time. Example: `'name=Bob;\
    \ Age=32; expires=Thu, 1 Feb 2015 12:00:00 UTC'`. By default cookies are deleted\
    \ when the browser is closed, only cookies that have an expiry date remain until\
    \ the date. Creating a cookie is simple using `document.cookie`.\n\n```javascript\n\
    document.cookie = 'name=Bob; Age=32; expires=Thu, 1 Feb 2015 12:00:00 UTC';\n\
    ```\n\nA cookie can also be changed, you just need to change the properties that\
    \ were passed to the original cookie:\n\n```javascript\ndocument.cookie = 'name=Jimmy;\
    \ Age=16; expires=Fri, 2 Feb 2015 12:00:00 UTC';\n```\n\nDeleting cookies is simple,\
    \ just pass in an expiry date and the cookie would be deleted.\n\n```javascript\n\
    document.cookie = 'name=; Age=; expires=Thu, 01 Jan 1970 00:00:00 UTC';\n```\n\
    \nTo access a cookie, you can use the `document.cookie` property to retrieve all\
    \ cookies that have been stored. Note retrieving a cookie will return the above\
    \ string as a string, you would need to use a bit of string manipulation to retrieve\
    \ individual values from a cookie here. Note that it is important that if you\
    \ use cookies on your website, that you make it known to the user that your website\
    \ uses cookies.\n\n## Summary\n\n* We learnt that the `navigator` object is used\
    \ to return browser specific information\n* We understood how geolocation works\
    \ and how to display coordinates of the current user.\n* We also understood the\
    \ `location` object and how to redirect users as well as deconstruct the url in\
    \ the browser.\n* We were introduced to cookies and understood how cookies work\
    \ as well as how to set, retrieve and destroy cookies.\n\n## Assignment\n\n###\
    \ Exercise 1\nCreate a script that asks for the users name using a prompt. The\
    \ script should set a cookie and store it. When the user comes back to the same\
    \ page, the script must check the cookie to make sure it exists, if it does, output\
    \ a friendly `Hello` and address the name of the user.\n\n### Exercise 2\nIn the\
    \ above script create a link that when clicked deletes the cookie.\n\n### Exercise\
    \ 3\nCreate a script that takes the location of the user and stores it in a cookie.\
    \ Code it so when the user visits the page again, and does not allow divulging\
    \ his location, making the script check for the location in the cookie and output\
    \ it. At the same time allow whenever the user allows the script to access his\
    \ location to overwrite the cookie.\n\n# Chapter 13: JS in action - Form validation\n\
    \nWe've come a long way since the start of this chapter, now it’s time to actually\
    \ put our skills to some practical usage here. We'll try to implement whatever\
    \ we've learnt in a full-fledged basic form which will illustrate whatever we've\
    \ learnt throughout the course of this book. This application is meant to be a\
    \ starting point which would give you an idea of how to program in a real live\
    \ situation.\n\n Overview\n\nWe will construct a basic front end application that\
    \ takes in user information and stores them in an array of objects. We'll work\
    \ out a scheme to store objects and arrays. Using this application we'll also\
    \ allow the user to add and delete elements. For this we will also use of validation\
    \ techniques to test and make sure that input is validated using JavaScript. Errors\
    \ would be displayed on the form.\n\n## Our basic form\n\nWe'll make a simple\
    \ form that takes basic input about the user such as name, date of birth, address\
    \ and email. We want to make sure the user enters all of this correctly. For the\
    \ date of birth we'll use select inputs instead of having the user enter the date\
    \ manually in a text box for ease of usage. Let’s create our form so far:\n\n\
    ```html\n<form id=\"theForm\">\n  <p>\n    <label for=\"name\">Full Name</label><br/>\n\
    \    <input id=\"name\" name=\"name\" />\n  </p>\n  <p>\n    <label for=\"dob\"\
    >Date of Birth</label><br/>\n    <select id=\"dob_day\" name=\"dob[day]\"></select>\n\
    \    <select id=\"dob_month\" name=\"dob[month]\"></select>\n    <select id=\"\
    dob_year\" name=\"dob[year]\"></select>\n  </p>\n  <p>\n    <label for=\"address\"\
    >Address</label><br/>\n    <input id=\"address\" name=\"address\" />\n  </p>\n\
    \  <p>\n    <label for=\"city\">City</label><br/>\n    <input id=\"city\" name=\"\
    city\" />\n  </p>\n  <p>\n    <input type=\"submit\" />\n  </p>\n</form>\n```\n\
    \nThis is pretty simple so far, now remember we need to create more than one user\
    \ and store them as an array. To start let’s create a user object that would represent\
    \ one user:\n\n```javascript\nfunction user(name) {\n  this.name = name;\n  this.dob\
    \ = '';\n  this.address = '';\n  this.city = '';\n}\n```\n\nThe above piece of\
    \ code is a basic user object declaration. It just takes and assigns a name. For\
    \ now this is standard fare. Let’s code it so on submission of the form we create\
    \ a user object:\n\n```javascript\nvar frm = document.getElementById('theForm');\n\
    \nfrm.onsubmit = function(){\n  user1 = new user(document.getElementById('name').value);\n\
    }\n```\n\nNot bad but this doesn't seem to do much, remember we need to create\
    \ an array of users here - so let’s create another object to represent the array.\
    \ We can use an array directly as you can declare a variable in the global scope\
    \ however it is best practice to make use an object and restrict yourselves to\
    \ using that object instead of manipulating variables at will.\n\n```javascript\n\
    function list(){\n  this.list = [];\n}\nvar theList = new list();\n```\n\nThis\
    \ is pretty swell but how do we add users to the list? Let’s create a set of functions\
    \ that will help us here. These functions should add a user to the list, remove\
    \ a user from the list based on the index, and get a user from the list based\
    \ upon index. Let’s add some functions here:\n\n```javascript\nfunction list(){\n\
    \  this.list = [];\n  this.add = function(elem){\n    this.list.push(elem);\n\
    \  }\n  this.remove = function(index){\n    this.list.splice(index, 1);\n  }\n\
    \  this.get = function(index){\n    return this.list[index];\n  }\n}\n```\n\n\
    This is more comprehensive, now we have a list object that can add, remove and\
    \ get an element from an array. The `add` function makes use of the `push` method\
    \ we learnt of earlier, while the `remove` method makes use of the `splice` method\
    \ to remove an element. Now that we have that set up let’s code so our form now\
    \ adds our entered user (at least with his name) to the user list array.\n\n```javascript\n\
    var frm = document.getElementById('theForm');\nvar theList = new list();\n\nfrm.onsubmit\
    \ = function(){\n  theList.add(new user(document.getElementById('name').value));\n\
    \  return false;\n}\n```\n\nRun your code and you should have a form, keep on\
    \ entering names and submit the form. It doesn't seem like anything is happening.\
    \ We need to show all the users that are being created in the list should we?\
    \ Let’s adjust the html a bit so we have an unordered list of users that have\
    \ been inputted. This list will be appended with a new entry every time we submit\
    \ the form. Add the following under your form:\n\n```html\n<ul id=\"ourList\"\
    >\n</ul>\n```\n\nNow we need to add an `li` element for every user that is added.\
    \ We can do this on submitting the form but it makes more sense to let the logic\
    \ for handling how to show the listed elements to the list. For this we'll add\
    \ a few functions:\n\n```javascript\nfunction user(name) {\n  this.name = name;\n\
    \  this.dob = '';\n  this.address = '';\n  this.city = '';\n  this.getHTML = function(){\n\
    \    return this.name;\n  }\n}\n\nfunction list(){\n  this.list = [];\n  this.html\
    \ = '';\n  this.add = function(elem){\n    this.list.push(elem);\n    this.buildHTML(elem);\n\
    \  }\n  this.buildHTML = function(elem){\n  }\n  this.getHTML = function(elem){\n\
    \    var usr = elem.getHTML();\n    var li = document.createElement('li');\n \
    \   li.appendChild(usr);\n    var rm = document.createElement('a');\n    rm.innerHTML\
    \ = '(remove)';\n    rm.setAttribute('href', '#');\n    rm.onclick = function(){\n\
    \      alert('delete me');\n    }\n    li.appendChild(rm);\n    return li;\n \
    \ }\n  this.remove = function(index){\n    this.list.splice(index, 1);\n  }\n\
    \  this.get = function(index){\n    return this.list[index];\n  }\n}\n```\n\n\
    Wait, the provided text was a bit fragmented. Let's reconstruct the clean version\
    \ based on the logic described:\n\n```javascript\nfunction user(name) {\n  this.name\
    \ = name;\n  this.dob = '';\n  this.address = '';\n  this.city = '';\n  this.getHTML\
    \ = function(){\n    return this.name;\n  }\n}\n\nfunction list(){\n  this.list\
    \ = [];\n  this.html = '';\n  this.add = function(elem, ul){\n    this.list.push(elem);\n\
    \    ul.appendChild(this.getHTML(elem));\n  }\n  this.getHTML = function(elem){\n\
    \    var usr = elem.getHTML();\n    var li = document.createElement('li');\n \
    \   li.appendChild(usr);\n    var rm = document.createElement('a');\n    rm.innerHTML\
    \ = '(remove)';\n    rm.setAttribute('href', '#');\n    rm.onclick = function(){\n\
    \      this.parentNode.parentNode.removeChild(this.parentNode);\n      this.remove(index);\
    \ // Note: index is missing in the original snippet but implied\n    };\n    li.appendChild(rm);\n\
    \    return li;\n  }\n  // ... rest of methods\n}\n```\n\nActually, following\
    \ the `getHTML = function(elem, index)` logic in the text's later section:\n\n\
    ```javascript\nthis.getHTML = function(elem, index){\n  var usr = elem.getHTML();\n\
    \  var li = document.createElement('li');\n  li.appendChild(usr);\n  var rm =\
    \ document.createElement('a');\n  rm.innerHTML = '(remove)';\n  rm.setAttribute('href',\
