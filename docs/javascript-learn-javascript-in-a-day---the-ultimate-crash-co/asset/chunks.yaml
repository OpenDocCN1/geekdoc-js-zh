  trans: "\n\n```javascript\nvar gender = document.getElementById('gender');\n\ngender.onchange\
    \ = function(){\n  alert('You are '+this.value);\n}\n```\n运行这段代码并尝试更改选择框中的值，你将看到一个傻傻的弹出窗口，告诉你输出了什么。`onchange`\
    \ 事件仅在元素的值发生改变时才会触发。\n\n现在我们已经理解了这些是如何工作的，关于表单，我们还有一个尚未涵盖的主要的事件。那就是 `onsubmit`\
    \ 事件。表单像所有元素一样也是一个节点，同样，它们有自己特定的方法和属性，以及各自的事件。当表单被提交时，`onsubmit` 事件会被触发。通常情况下，你会在这里添加一个事件处理器，用来检查表单提交的详细信息是否有效。使用上面的代码，你确实给用户提供了视觉提示，但表单仍然会提交。让我们对表单进行一些处理，确保在至少输入了名称的情况下表单不会提交。为此，我们将处理\
    \ `onsubmit` 处理程序。\n\n```javascript\nvar frm = document.getElementById('theForm');\n\
    \nfrm.onsubmit = function(){\n  if(document.getElementById('name').value == ''){\n\
    \    alert('The form is not valid, name cannot be empty!');\n  }\n}\n```\n在不输入名称的情况下运行这段代码，搞定！你在弹出窗口中收到了一条错误消息。但等一下，你点击弹出窗口上的确定，表单仍然提交了——你可能在想这是为什么呢？那是因为为了停止默认操作，你需要在事件处理器中返回一个布尔值\
    \ `false`。这确保了表单不会被提交。因此请进行以下调整：\n\n```javascript\nvar frm = document.getElementById('theForm');\n\
    \nfrm.onsubmit = function(){\n  if(document.getElementById('name').value == ''){\n\
    \    alert('The form is not valid, name cannot be empty!');\n    return false;\n\
    \  }else{\n    return true;\n  }\n}\n```\n现在你就可以正常使用了，如果名称字段为空，表单就不会提交。注意，上面示例中的\
    \ `else` 语句并不是真的需要的，没有它也可以同样正常工作。\n\n## 总结\n\n- 我们学习了 JavaScript 事件是如何工作的。\n-\
    \ 事件可以被捕获，代码可以分配到所谓的事件处理程序中。\n- 事件处理器默认会接收一个事件对象，该对象代表发生的事件并包含有关该事件的数据。\n- 键盘事件在事件\
    \ `Object` 中注册了相应的 keycode 值，每个 keycode 都是所按按键的 Unicode 值表示。\n- 表单有它们自己的一套事件。\n\
    - `OnBlur` 和 `OnFocus` 分别指的是失去/获得焦点的事件。\n- 表单的 `onsubmit` 事件允许我们在提交表单之前运行代码，例如：验证代码。\n\
    \n## 作业\n\n### 练习 1\n在上面的表单示例中，为年龄字段编写一组 `onblur` 和 `onfocus` 事件处理器，检查输入的年龄是否为正整数。\n\
    \n### 练习 2\n重构上面的函数，将它们全部放在一个专门用于验证的 `Object`（对象）中以便复用。使用该对象来验证 `on blur`/`onfocus`\
    \ 处理程序以及在 `onsubmit` 处理程序中使用。这样你就不需要在提交处理程序中重复你在其他单个字段事件处理器中所编写的相同代码了。\n\n# 第\
    \ 12 章：超越 HTML - 访问浏览器？\n\n到目前为止，我们已经理解了关于节点的许多核心概念。我们已经了详细的示例，解释了所有节点都是具有自己的方法和属性的对象。我们还理解了\
    \ DOM 结构，即构建网页的基础的树形结构。每个节点都会分支出进一步的节点，类似于 HTML 标签嵌套其他 HTML 标签，以此此类推。除此之外，我们还理解文档模型虽然位于页面的根部，但也由\
    \ `window` `Object`（对象）包含，即在本例中为浏览器。浏览器本身也可以像 DOM 一样被引用，让我们对用户体验拥有前所未有的控制，这种控制超越了页面上的\
    \ HTML。\n\n## 概述\n\n我们将学习 BOM，即浏览器对象模型（Browser Object Model），重点将放在 `window` 对象以及其方法的实际影响上。我们将学习如何重定向用户，并理解如何设置\
    \ cookie 来存储用户特定信息以便以后访问。此外，我们将介绍几个示例，说明 `window` 对象的许多不同方法和功能。\n\n## Window 对象\
    \ - 是的，你的浏览器在我们的控制之下！\n\nBOM，浏览器对象模型基本上就像是浏览器版本的 DOM。然而，与由万维网联盟（W3C）定义的 DOM 不同，不同的浏览器在定义“BOM”时会有一些差异。因此，到目前为止还没有标准的\
    \ BOM。然而，我们将涵盖通过 `window` `Object` 可用的所有常用方法，这允许我们访问、控制、操纵并在技术上对浏览器进行“勒索”（删掉关于勒索浏览器的那部分）。\n\
    \n`Window` 对象像所有其他对象一样作为一个节点运行，尽管它在这里实际上是真正的根，但它包含了代表页面的 `document`。由于我们非常清楚文档模型能提供什么，让我们来看看浏览器通过\
    \ `Window` `object` 为我们提供的基本方法。\n\n首先，文档本身就是 `window` `Object` 的一个属性。如果我们看这段代码：\n\
    \n```javascript\ndocument.write('Hello there!'); // 这是一样的\nwindow.document.write('Hello\
    \ there!'); // 这\n```\n我们可以看到 `window.document` 和 `document` 是一样的。由于 `document`\
    \ 是全局变量，可以假设所有的全局变量都可以通过 `window` 访问。\n\n```javascript\ng = 10; // 这是全局声明的\nwindow.g\
    \ == g; // g 可以从 window 访问\n```\n很显然，`window` 可以访问全局作用域内的变量和函数。这允许我们完全根据代码来控制浏览器。\n\
    \n## 我可以获取窗口尺寸吗？\n\n`window` 对象可以用于获取浏览器的实际像素大小。\n\n`window.innerHeight;` // 返回窗口的高度\n\
    `window.innerWidth;` // 返回窗口的宽度\n\n正如我们提到的，由于 BOM 没有标准，早期版本的 Internet Explorer\
    \ 有它们自己的不同方法来实现相同的结果。尝试这个小练习，写下以下代码：\n\n```javascript\ndocument.write('Height\
    \ is ' + window.innerHeight + 'px<br/>');\ndocument.write('Width is ' + window.innerWidth\
    \ + 'px<br/>');\n```\n运行代码，它应该返回一组值，现在调整你的浏览器并刷新，你应该看到对应于浏览器屏幕新大小的不同数值值。这对于可能需要根据浏览器屏幕的大小隐藏或显示某些元素的情况特别有用。早期的网站使用\
    \ JavaScript 调整移动屏幕的内容，但这种做法随着 HTML5 和 CSS3 的出现而被取代。\n\n## 使用 JavaScript 打开/引用浏览器窗口\n\
    \n这可能是 `window` 对象最烦人但也常用的用途之一。你可能在很多网站上看到打开弹出窗口的功能。这是通过 `window` 对象的 `window.open`\
    \ 方法实现的。\n\n虽然弹出窗口不受欢迎，大多数用户倾向于阻止弹出窗口，但在某些情况下你可能需要弹出窗口。银行直到今天仍使用基于 JavaScript\
    \ 的弹出窗口来显示在线虚拟键盘，你不需要使用键盘输入，而是点击屏幕上的虚拟键盘来输入凭据。此外，窗口使用 JavaScript 打开，也可以在之后的代码中被引用。\n\
    \n"
- fmt: "\nLet’s make a simple example here. Type out the following html and JavaScript.\
    \ As good convention we'll keep the JavaScript and html separate as we've been\
    \ doing all this time now.\n\n```html\n<a href=\"#\" id=\"open-window\">Open a\
    \ Window</a><br/>\n<a href=\"#\" id=\"close-window\">Close the Window</a>\n```\n\
    \nWe'll set the open a window link to open the yahoo website in a popup window.\n\
    \n```javascript\nvar op = document.getElementById('open-window');\n\nop.onclick\
    \ = function(){\n  window.open('http://www.yahoo.com');\n}\n```\n\nRun the code\
    \ and click the Open a window link. It should open the yahoo site in a popup window.\
    \ This is pretty basic stuff and you might be wondering why bother if this can\
    \ be replicated witha simple target attribute in the link. The `window.open` method\
    \ takes a number of parameters that allow you to actually manipulate the window\
    \ opened. The `window.open` method takes the following parameters:\n\n```\nwindow.open(url,\
    \ name, option, replace);\n```\n\nLet’s go over the parameters, the `url` is understood\
    \ as the url to open in the window. However the `name` attribute refers to one\
    \ of the following values if passed:\n\n- `'_blank'` if this is passed the URL\
    \ is loaded in a new window, this is the default action\n- `'_parent'`, if you've\
    \ worked with frames before you'll understand that the parent frame here refers\
    \ to the owning frame which contains the current page, in our example we don't\
    \ have frame so this shouldn't really apply.\n- `'_self'` - this means to load\
    \ the url into the current page, in which case this isn't a popup. The url would\
    \ be loaded in this very same window\n- `any name`, this would be a name that\
    \ we can use to reference the window in any later bit of code\n\nLet’s add another\
    \ link here that opens the google page in the same window that would open.\n\n\
    ```html\n<a href=\"#\" id=\"open-window\">Open a Window</a><br/>\n<a href=\"#\"\
    \ id=\"open-google\">Open Google</a><br/>\n<a href=\"#\" id=\"close-window\">Close\
    \ the Window</a>\n```\n\n### Let’s make some modifications to the JavaScript\n"
