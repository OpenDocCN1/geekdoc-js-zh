    # Chapter 13: JS in action - Form validation


    We''ve come a long way since the start of this chapter, now it’s time to actually
    put our skills to some practical usage here. We''ll try to implement whatever
    we''ve learnt in a full-fledged basic form which will illustrate whatever we''ve
    learnt throughout the course of this book. This application is meant to be a starting
    point which would give you an idea of how to program in a real live situation.


    ## Overview


    We will construct a basic front end application that takes in user information
    and stores them in an array of objects. We''ll work out a scheme to store objects
    and arrays. Using this application we''ll also allow the user to add and delete
    elements. For this we will also make use of validation techniques to test and
    make sure that input is validated using JavaScript. Errors would be displayed
    on the form illustrating the ability to manipulate the DOM and individual elements.


    ## Our basic form


    We''ll make a simple form that takes basic input about the user such as his name,
    date of birth, address and email address. We want to make sure that the user enters
    all of this information correctly. For the date of birth we''ll use three select
    inputs instead of having the user enter the date manually in a text box for ease
    of usage. Let’s create our form so far:


    <form id="theForm">


      <p>


        <label for="name">Full Name</label><br />


        <input id="name" name="name" />


      </p>


      <p>


        <label for="dob">Date of Birth</label><br />


        <select id="dob_day" name="dob[day]"></select>


        <select id="dob_month" name="dob[month]"></select>


        <select id="dob_year" name="dob[year]"></select>


      </p>


      <p>


        <label for="address">Address</label><br />


        <input id="address" name="address" />


      </p>


      <p>


        <label for="city">City</label><br />


        <input id="city" name="city" />


      </p>


      <p>


        <input type="submit" />


      </p>


    </form>


    This is pretty simple stuff so far, now remember we need to create more than one
    user and store them as an array of users. To start with let’s create a user object
    in JavaScript that would represent one user.


    function user(name) {


      this.name = name;


      this.dob = '''';


      this.address = '''';


      this.city = '''';


    }


    The above piece of code is a very basic user object declaration. It just takes
    and assigns a name value. For now this is standard fare. Let’s code it so on submission
    of the form we create a user object:


    function user(name) {


      this.name = name;


      this.dob = '''';


      this.address = '''';


      this.city = '''';


    }


    var frm = document.getElementById(''theForm'');


    frm.onsubmit = function(){


      user1 = new user(document.getElementById(''name'').value); 


    }


    Not bad but this doesn''t seem to do much, remember we need to create an array
    of users here - so let’s create another object to represent the array. We can
    use an array directly as you can declare a variable in the global scope however
    it is best practice to make use of an object and restrict yourselves to using
    that object instead of manipulating variables at will.


    Our user list object will hold an array, we''ll have just one user list here and
    that will hold an array that stores all the created objects.


    function list(){


      this.list = [];


    }


    var theList = new list();


    This is pretty swell, but how do we add users to the list? Let’s create a set
    of functions that will help us here. These functions should add a user to the
    list, remove a user from the list based on the index, and get a user from the
    list based upon his index. Let’s add some functions here:


    function list(){


      this.list = [];


      this.add = function(elem){


        this.list.push(elem);


      }


      this.remove = function(index){


        this.list.splice(index, 1);


      }


      this.get = function(index){


        this.list[index];


      }


    }


    This is more comprehensive, now we have a list object that can add, remove and
    get an element from an array. The add functions makes use of the push method we
    learnt of earlier, while the remove method makes use of the splice method to remove
    an element.


    Now that we have that set up let’s code so our form now adds our entered user
    (at least with his name) to the user list array.


    var frm = document.getElementById(''theForm'');


    var theList = new list();


    frm.onsubmit = function(){


      theList.add(new user(document.getElementById(''name'').value)); 


      return false;


    }


    Run your code and you should have a form, keep on entering names and submit the
    form. It doesn''t seem like anything is happening. We need to show all the users
    that are being created in the list should we? Let’s adjust the html a bit so we
    have an unordered list of users that have been inputted. This list will be appended
    with a new entry every time we submit the form. Add the following under your form


    <ul id="ourList">


    </ul>


    Now we need to add an li element for every user that is added. We can do this
    on submitting the form but it makes more sense to let the logic for handling how
    to show the listed elements to the list. For this we''ll add a few functions:


    function user(name) {


      this.name = name;


      this.dob = '''';


      this.address = '''';


      this.city = '''';


      this.getHTML = function(){


        html = this.name;


        return html;


      }


    }


    function list(){


      this.list = [];


      this.html = ''''


      this.add = function(elem){


        this.list.push(elem);


        this.buildHTML(elem);


      }


      this.buildHTML = function(elem){


        html = ''<li>'';


        html = html + elem.getHTML();


        html = html + ''</li>'';


        this.html += html;


      }


      this.getHTML = function(){


        return this.html;


      }


      this.remove = function(index){


        this.list.splice(index, 1);


      }


      this.get = function(index){


        this.list[index];


      }


    }


    In the user object we added a function that returns an HTML representation of
    the object in this case just the name. In the list object we have added an HTML
    property that stores html that would represent the entire list. In this we have
    also added a function that adds to the html property a list item whenever a list
    item is added to the list. Plus a function that returns the entire list in html
    format. Let’s adjust our submit handler so we also alter the unordered list with
    the list of added users.


    var frm = document.getElementById(''theForm'');


    var theList = new list();


    var ul =  document.getElementById(''ourList'');


    frm.onsubmit = function(){


      theList.add(new user(document.getElementById(''name'').value)); 


      ul.innerHTML = theList.getHTML();


      return false;


    }


    Run the code and you can see that with all awesomeness, the list is updated as
    and as you type and submit the form.


    ## Complex Dates


    So far our form is just taking in the name, but we have with it on the form a
    number of other fields that belong to the user object. While the city and address
    fields are no issues at all, the date field is a little tricky here. We''re taking
    for the date three fields i.e. day, month and year but need to store a valid date
    object for every user. This is where that date manipulation will come in handy
    here. Let’s start off by populating the select inputs with some options. Now for
    the options we can do this by typing in some HTML but we''ll do it using JavaScript.
    To start with, let’s use a loop to populate the day variable with days from 1
    to 31\. Add the following code to your JavaScript.


    day = document.getElementById(''dob_day'');


    for(i=1; i<=31; i++){


      op = document.createElement(''option'');


      op.setAttribute(''value'', i);


      op.innerHTML = i;


      day.appendChild(op);


    }


    Run the code and very cleverly you''ll see that the day select has been populated
    with options. Let’s also add the months to the month field. We''ll loop through
    the value 0 to 11 - remember months start with a zero index in JavaScript, because
    we need to store the date as a date object. Add the following JavaScript:


    month = document.getElementById(''dob_month'');


    for(i=0; i<=11; i++){


      op = document.createElement(''option'');


      op.setAttribute(''value'', i);


      var d = new Date('''', (i+1));


      month.appendChild(op);


    }


    That works pretty fine, now for the year, we want to list out at least 100 years
    before the current year. For this we''ll run a loop and loop through numbers from
    the current year upto 100 years earlier. We''ll get the current year using the
    Date Object.


    var d = new Date();


    var current_year = d.getFullYear();


    year = document.getElementById(''dob_year'');


    for(i=current_year; i>=(current_year - 100); i--){


      op = document.createElement(''option'');


      op.setAttribute(''value'', i);


      op.innerHTML = i;


      year.appendChild(op);


    }


    Awesome, now you have populated the required fields, let’s rewrite the user object
    a bit so we have a few methods that set the properties:


    function user(name) {


      this.name = name;


      this.dob = '''';


      this.address = '''';


      this.city = '''';


      this.getName = function(){


        return this.name;


      }


      this.getCity = function(){


        return this.city;


      }


      this.getAddress = function(){


        return this.address;


      }


      this.getDob = function(){


        return this.dob;


      }


      this.setName = function(name){


        this.name = name;


      }


      this.setCity = function(city){


        this.city = city;


      }


      this.setAddress = function(address){


        this.address = address;


      }


      this.setDob = function(day, month, year){


        this.dob = new Date(day, month, year);


      }


      this.getHTML = function(){


        html = ''<p style="padding:5px; border:1px solid #ccc;">''


        html += ''Name : '' + this.getName() + ''<br/>'';


        html += ''Date of Birth : '' + this.getDob().toString() + ''<br/>'';


        html += ''Address : '' + this.getAddress() + ''<br/>'';


        html += ''City : '' + this.getCity();


        html += ''</p>''


        return html;


      }


    }


    The above is a rewrite of the user object declaration, now we have a set of getter
    and setter methods. It might look like a lot of code but on close scrutiny it’s
    just a lot of getter and setter methods, i.e. one method for each property. Note
    that the getDob method actually creates a date object and assigns it to the dob
    property. Plus we also changed the getHTML function of the user object so it returns
    a more comprehensive description of the user.


    Let’s fix the form so it now takes in all the fields.


    frm.onsubmit = function(){


      var usr = new user(document.getElementById(''name'').value);


      usr.setDob(day.options[day.selectedIndex].value, month.options[month.selectedIndex].value,
    year.options[year.selectedIndex].value);


      usr.setAddress(document.getElementById(''address'').value);


      usr.setCity(document.getElementById(''city'').value);


      theList.add(usr);


      ul.innerHTML = theList.getHTML();


      return false;


    }


    Run the above code, add in the details and you can now see that all of the details
    are being displayed. This in its own is a very comprehensive application. However
    lets take it a little bit further.


    ## Removing users.


    We have a fully functional form here that adds and displays added users at will.
    However we need to add the ability to remove an existing user. Think about adding
    a link to each element added that says remove. Clicking this link would remove
    the element from the list. This means that we need to create an a element and
    attach an onclick event handler to it that would remove the element from the array.
    For this let’s redo the users getHTML function a bit. Currently it returns a chunk
    of html, let’s fix it so it returns a node.


      this.getHTML = function(){


        node = document.createElement(''p'');


        node.setAttribute(''style'', ''padding:5px; border:1px solid #ccc;'');


        span = document.createElement(''span'');


        span.innerHTML = ''Name : '' + this.getName() + ''<br/>'';


        span.innerHTML += ''Date of Birth : '' + this.getDob().toString() + ''<br/>'';


        span.innerHTML += ''Address : '' + this.getAddress() + ''<br/>'';


        span.innerHTML += ''City : '' + this.getCity();


        node.appendChild(span);


        return node;


      }


    As you can see we created a few elements using the document.createElement function.
    Then we treated each individual element as a node. By doing this we can assign
    event handlers and code which you couldn''t do with just passing in raw HTML.
    Now we also have to adjust our list object. Currently the html property takes
    a string of HTML. Let’s fix it so we don''t have to store a bunch of html or nodes
    consistently and instead rewrite the lists objects getHTML function so it returns
    the node for a single element which is passed to it. We''ll also rewrite the add
    function of the list to pass to it both the element to add as well as the dom
    unordered list element to append to.


    We will also need to adjust the code in the form handler so that the list is populated
    with nodes instead of plain html:


    function list(){


      this.list = [];


      this.html = '''' // we won’t be using this now


      this.add = function(elem, ul){


        this.list.push(elem);


        ul.appendChild(this.getHTML(elem))


        // this.buildHTML(elem); // delete this line


      }


      this.buildHTML = function(elem){ // get rid of this for now


      }


      this.getHTML = function(elem){


        usr = elem.getHTML(); // get the users generated node


        li = document.createElement(''li'');


        li.appendChild(usr);


        rm = document.createElement(''a'');


        rm.innerHTML = ''(remove)'';


        rm.setAttribute(''href'', ''#'');


        rm.onclick = function(){


          alert(''delete me'');


        }


        li.appendChild(rm);


        return li;


      }


      this.remove = function(index){


        this.list.splice(index, 1);


      }


      this.get = function(index){


        this.list[index];


      }


    }


    // in the form handler


    frm.onsubmit = function(){


      var usr = new user(document.getElementById(''name'').value);


      usr.setDob(day.options[day.selectedIndex].value, month.options[month.selectedIndex].value,
    year.options[year.selectedIndex].value);


      usr.setAddress(document.getElementById(''address'').value);


      usr.setCity(document.getElementById(''city'').value);


      theList.add(usr, ul);


      return false;


    }


    This may seem like a lot of code, but in fact if you break it all down you can
    clearly see that we''ve made every element into a node. You could not do that
    with raw html. Run the code and you should see as you add entries the list is
    populated. Click on the remove link against an element. It seems like we have
    yet to code for the remove link. Let’s go back to our list object and work on
    the remove link handler in the getHTML method.


      this.getHTML = function(elem){


        usr = elem.getHTML(); // get the users generated node


        li = document.createElement(''li'');


        li.appendChild(usr);


        rm = document.createElement(''a'');


        rm.innerHTML = ''(remove)'';


        rm.setAttribute(''href'', ''#'');


        rm.onclick = function(){


          this.parentNode.parentNode.removeChild(this.parentNode);


        }


        li.appendChild(rm);


        return li;


      }


    Run the code above, and click on the remove links now. The element is removed
    from the unordered list in this example. If you notice in the remove links handler
    we''ve used the removeChild method of the parent node of the list element. In
    this case the parent of the remove link was the list element, and the parent of
    the li element was the ul element. Parent elements can remove child elements.


    This is all very well but we have a problem here. We''ve only deleted the element
    from the html''s unordered list, it still exists in the list objects list property.
    To remove it from there, we need to know the index of the corresponding element
    in the list. We can do this by passing in the index of the element in the getHTML
    method. Remember we are calling the getHTML method when adding a node so it’s
    easy to get the latest index to pass to the function.


      this.getHTML = function(elem, index){


        usr = elem.getHTML(); // get the users generated node


        li = document.createElement(''li'');


        li.appendChild(usr);


        rm = document.createElement(''a'');


        rm.innerHTML = ''(remove)'';


        rm.setAttribute(''href'', ''#'');


        rm.onclick = function(){


          this.parentNode.parentNode.removeChild(this.parentNode);


          this.remove(index);


        }


        li.appendChild(rm);


        return li;


      }


    Your entire JavaScript code should look like this:


    function user(name) {


      this.name = name;


      this.dob = '''';


      this.address = '''';


      this.city = '''';


