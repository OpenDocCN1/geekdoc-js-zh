    \ the time zone on your computer. In addition to the above methods, JavaScript\
    \ also provides similar methods which get the same details only with respect to\
    \ UTC, taking into account the time zone on your PC. They're aptly named as below:\n\
    \n```\nvar dt = new Date(2012,11,31, 10, 30, 20); // A few minutes to a few hours\
    \ can totally change a date\n\ndt.getUTCFullYear(); // Returns the year adjusted\
    \ for UTC\n\ndt.getUTCMonth(); // Returns the month adjusted for UTC\n\ndt.getUTCDate();\
    \ //Returns the day adjusted for UTC\n\ndt.getUTCDay(); // Returns the day of\
    \ the week adjusted for UTC\n\ndt.getUTCHours(); // Returns the hours adjusted\
    \ for UTC\n\ndt.getUTCMinutes(); // Returns minutes adjusted for UTC\n\ndt.getUTCSeconds();\
    \ // self explanatory again\n\ndt.getUTCMilliseconds(); // self explanatory\n\n\
    dt.getUTCDate(); // Returns the whole date adjusted for UTC - the UTC adjusted\
    \ equivalent of getDate()\n```\n\nIt’s important to take the time zone difference\
    \ into consideration when working with dates. You have to be aware of the users’\
    \ time zone and when he may have made a transaction. Normally dates are stored\
    \ based on Universal Standard Time and then converted to match the time zone of\
    \ the user for viewing in a web page.\n\nYou may have noticed a common pattern\
    \ in all the above methods is that they all start with the prefix `get`. Objects\
    \ have properties and rather than access properties directly, it is common Object\
    \ Oriented Programming practice to have simple functions which get the values\
    \ of these individual properties. They are called getter functions and are normally\
    \ named as such with `get` prefixed to the name of the property they return. Just\
    \ like you have getter functions you also have setter functions which set individual\
    \ properties of an object. They follow a similar naming convention and thus are\
    \ prefixed with the word `set`. So all of the above functions have their setter\
    \ alternatives which take one variable and adjust the corresponding property.\n\
    \n```\ndt.setFullYear(2013); // Takes the year and sets it\n\ndt.setMonth(2);\
    \ // Takes a number 0 to 11 corresponding to the month\n\ndt.setDate(23); // Take\
    \ a number between 1 to 31 and sets the date of the month\n\ndt.setHours(12);\
    \ // Takes a number between 0 to 23 and sets the hour \n\ndt.setMinutes(54); //\
    \ Any number between 0 to 59\n\ndt.setSeconds(45); // self explanatory again\n\
    \ndt.setMilliseconds(); // self explanatory\n```\n\nPlus the very same functions\
    \ also come with their UTC counterparts which set the corresponding date component\
    \ adjusted for UTC.\n\n```\ndt.setUTCFullYear(2013); // Takes the year and sets\
    \ it adjusting for UTC\n\ndt.setUTCMonth(2); // Takes a number 0 to 11 corresponding\
    \ to the month adjusting for UTC\n\ndt.setUTCDate(23); // Take a number between\
    \ 1 to 31 and sets the date of the month adjusting for UTC\n\ndt.setUTCHours(12);\
    \ // Takes a number between 0 to 23 and sets the hour adjusting for UTC\n\ndt.setUTCMinutes(54);\
    \ // Any number between 0 to 59 adjusting for UTC\n\ndt.setUTCSeconds(45); //\
    \ self explanatory again\n\ndt.setUTCMilliseconds(); // self explanatory\n```\n\
    \nJust like we have the date function `getTime` which returns the number of milliseconds\
    \ from the current time and date till zero time, we also have the corresponding\
    \ `setTime` function which takes a numeric parameter corresponding to the number\
    \ of milliseconds since the zero time and sets the date accordingly. This is just\
    \ like passing the number of milliseconds to a date Object when creating it to\
    \ initialize it.\n\n```\ndt.setTime(86400000); // dt is now equal to 02 January,\
    \ 1970 00:00:00 UTC assuming your PC's timezone is set to UTC\n\ndt.setTime(-86400000);\
    \ // dt is now equal to 31 December, 1969 00:00:00 UTC assuming your PC's timezone\
    \ is set to UTC\n```\n\nWhile these may seem like an awful lot of functions to\
    \ remember, they're quite easy to remember and each function acts upon one component\
    \ of the date element.\n\n## Getting down and personal with dates\n\nIn addition\
    \ to the above functions JavaScript also provides a set of functions that deal\
    \ with more than just a single component of the `Date` Object.\n\nWe've seen the\
    \ different functions for getting dates and time constituents for both the current\
    \ systems time and also for UTC time in relation to the current systems time.\
    \ In addition to this you can also find out the UTC offset from the current systems\
    \ time by usage of the `getTimezoneOffset` function. This would return the time\
    \ difference from the local time and UTC time in minutes as a positive or negative\
    \ integer depending on what timezone you are in.\n\n```\nvar dt = new Date();\
    \ // initialize a date object\n\ndt.getTimezoneOffset(); // returns 240 since\
    \ local time is UTC +4 hours hence 4 times 60 is 240\n```\n\nThis can be very\
    \ useful when trying to build a time zone convertor in JavaScript.\n\nWhile speaking\
    \ of conversions, we must know that JavaScript relies heavily on the zero time\
    \ as a placeholder around which time comparisons are done. The `parse` function\
    \ in JavaScript takes a string date and returns in milliseconds the difference\
    \ between the parsed date and Zero Time. This function is pretty much the same\
    \ as instantiating a date Object with a string and then calling the `getTime`\
    \ function.\n\nOnly this is instantiating a date Object with a string and then\
    \ calling the `getTime` function.\n\n```\nvar dt = new Date('31 March, 2014');\n\
    \ndt.getTime() == Date.parse('31 March, 2014');\n```\n"
  raw: 'Note in all the above methods, the details retrieved are with respect to the
    time zone on your computer. In addition to the above methods, JavaScript also
    provides similar methods which get the same details only with respect to UTC,
    taking into account the time zone on your PC. They''re aptly named as below:


    var dt = new Date(2012,11,31, 10, 30, 20); // A few minutes to a few hours can
    totally change a date


    dt.getUTCFullYear(); // Returns the year adjusted for UTC


    dt.getUTCMonth(); // Returns the month adjusted for UTC


    dt.getUTCDate(); //  Returns the day adjusted for UTC


    dt.getUTCDay(); // Returns the day of the week adjusted for UTC


    dt.getUTCHours(); // Returns the hours adjusted for UTC


    dt.getUTCMinutes(); // Returns minutes adjusted for UTC


    dt.getUTCSeconds(); // self explanatory again


    dt.getUTCMilliseconds(); // self explanatory


    dt.getUTCDate(); // Returns the whole date adjusted for UTC - the UTC adjusted
    equivalent of getDate()


    It’s important to take the time zone difference into consideration when working
    with dates. You have to be aware of the users’ time zone and when he may have
    made a transaction. Normally dates are stored based on Universal Standard Time
    and then converted to match the time zone of the user for viewing in a web page.


    You may have noticed a common pattern in all the above methods is that they all
    start with the prefix get. Objects have properties and rather than access properties
    directly, it is common Object Oriented Programming practice to have simple functions
    which get the values of these individual properties. They are called getter functions
    and are normally named as such with get prefixed to the name of the property they
    return. Just like you have getter functions you also have setter functions which
    set individual properties of an object. They follow a similar naming convention
    and thus are prefixed with the word set. So all of the above functions have their
    setter alternatives which take one variable and adjust the corresponding property.


    dt.setFullYear(2013); // Takes the year and sets it


    dt.setMonth(2); // Takes a number 0 to 11 corresponding to the month


    dt.setDate(23); //  Take a number between 1 to 31 and sets the date of the month


    dt.setHours(12); // Takes a number between 0 to 23 and sets the hour 


    dt.setMinutes(54); // Any number between 0 to 59


    dt.setSeconds(45); // self explanatory again


    dt.setMilliseconds(); // self explanatory


    Plus the very same functions also come with their UTC counterparts which set the
    corresponding date component adjusted for UTC.


    dt.setUTCFullYear(2013); // Takes the year and sets it adjusting for UTC


    dt.setUTCMonth(2); // Takes a number 0 to 11 corresponding to the month adjusting
    for UTC


    dt.setUTCDate(23); //  Take a number between 1 to 31 and sets the date of the
    month adjusting for UTC


    dt.setUTCHours(12); // Takes a number between 0 to 23 and sets the hour adjusting
    for UTC


    dt.setUTCMinutes(54); // Any number between 0 to 59 adjusting for UTC


    dt.setUTCSeconds(45); // self explanatory again


    dt.setUTCMilliseconds(); // self explanatory


    Just like we have the date function getTime which returns the number of milliseconds
    from the current time and date till zero time, we also have the corresponding
    setTime function which takes a numeric parameter corresponding to the number of
    milliseconds since the zero time and sets the date accordingly. This is just like
    passing the number of milliseconds to a date Object when creating it to initialize
    it.


    dt.setTime(86400000); // dt is now equal to 02 January, 1970 00:00:00 UTC assuming
    your PC''s timezone is set to UTC


    dt.setTime(-86400000); // dt is now equal to 31 December, 1969 00:00:00 UTC assuming
    your PC''s timezone is set to UTC


    While these may seem like an awful lot of functions to remember, they''re quite
    easy to remember and each function acts upon one component of the date element.


    ## Getting down and personal with dates


    In addition to the above functions JavaScript also provides a set of functions
    that deal with more than just a single component of the Date Object.


    We''ve seen the different functions for getting dates and time constituents for
    both the current systems time and also for UTC time in relation to the current
    systems time. In addition to this you can also find out the UTC offset from the
    current systems time by usage of the getTimezoneOffset function. This would return
    the time difference from the local time and UTC time in minutes as a positive
    or negative integer depending on what timezone you are in.


    var dt = new Date(); // initialize a date object


    dt.getTimezoneOffset(); // returns 240 since local time is UTC +4 hours hence
    4 times 60 is 240


    This can be very useful when trying to build a time zone convertor in JavaScript.


    While speaking of conversions, we must know that JavaScript relies heavily on
    the zero time as a placeholder around which time comparisons are done. The parse function
    in JavaScript takes a string date and returns in milliseconds the difference between
    the parsed date and Zero Time. This function is pretty much the same as instantiating
    a date Object with a string and then calling the getTime function.


    Only this is a class function i.e. you don''t create an Object to use this function,
    it’s called directly from the Date class.


    var dt = new Date(''31 March, 2014'');


    dt.getTime() == Date.parse(''31 March, 2014'');


    So far we''ve played around with dates and their constituent elements as well
    as converted strings to dates. We know that to output a date we can simply out
    put the date Object. The Date object provides a few more functions that are helpful
    when it comes to outputting the date besides the toString function.


    var dt = new Date();


    dt.toString(); // Thu Jan 01 2015 17:07:17 GMT+0400 (GST)


    dt.toDateString(); // Thu Jan 01 2015


    dt.toUTCString(); // Thu, 01 Jan 2015 13:05:59 GMT


    dt.toTimeString(); // 17:05:56 GMT+0400 (GST)


    Along with the toString function you can also output the date partially using
    the toDateString or just the time portion of the date using the toTimeString function.
    And don''t forget there''s also a UTC equivalent of these functions to print the
    UTC equivalent.


    ## Summary


    We know that JavaScript provides a complex date object for manipulating dates.
    Dates can be instantiated in four different ways. Zero time refers to January
    1st 1970 midnight. Dates in JavaScript are stored as milliseconds in reference
    to zero time. The individual components of a date can be retrieved and set using
    native Date objects getter and setter functions


    ## Assignment


    #### Exercise 1


    Make a function that takes as a parameter an array of dates and sorts them.


    #### Exercise 2


    Write a class with a method that takes as parameter a string of the format d/m/y where d refers
    to the day, m refers to the month and y the year. The method should return the
    current date formatted as the string passed so if the following string is passed m,d
    Y the date should be January,10 2015.


    # Chapter 10: The Document is an Object


    While we''re on the subject of Object oriented programming, lets also know that
    with working on web pages - object orientation goes a very long way. Its not just
    variables and dates that are considered or referred to as objects but also just
    about everything on the HTML page including the page itself is regarded as an
    object and like all objects have their own methods and properties which can be
    accessed and manipulated.


    ## Overview


    In this chapter we''ll learn about the Document Object Model which defines the
    different elements that make up a webpage and how each element is an object. We''ll
    also learn that every element on the page is a node including the page itself
    as well as the different attributes and methods available for interacting with
    them.


    ## Everything is an Object'
