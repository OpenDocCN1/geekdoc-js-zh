    # Naming Variables


    When declaring a variable you do have a few constraints with regards to how you
    can declare a variable. Variable name can be made of letters, underscores and
    numbers but they cannot start with a number and cannot contain a space or special
    characters. For example the following variable declarations are valid:


    ```javascript

    var i;

    var Image;

    var module_01;

    var M1;

    var iM1;

    ```


    However the following variable declarations are invalid and would cause a program
    error:


    ```javascript

    var 1a;

    var module 01;

    var module-01;

    var i@m1;

    ```


    JavaScript variable names can be as long as you want and can be as small as a
    single character eg:


    ```javascript

    var this_is_a_very_long_and_humongous_variable_name = 1;

    var t = 1;

    ```


    Although when coding it would make more sense to make sure your variable names
    it inself make sense and aren''t too long.


    # Types of Variables


    JavaScript has support for many types of variables. So far we''ve seen examples
    where we''ve only assigned numbers to JavaScript. JavaScript provides support
    to the following variables:


    ## Numbers


    A variable can be assigned a numerical value. JavaScript has support for integers
    and floats. For example the following is an example of assigning a number to a
    variable:


    ```javascript

    var num1 = 100; // This is a valid integer number

    var num2 = 100.00 // This is a decimal number

    ```


    ## Strings


    Strings are blocks of text. They can be as long as needed and can even be as small
    as a single character. You can also have an empty value as a string. Strings are
    always enquoted in single or double quotes whenever it is to be assigned. So the
    following is valid:


    ```javascript

    var s1 = "This is some text!"; //Assigned a string

    var s2 = ''This is also some text''; // Single quotes work well too

    var n = ''''; // This is a valid empty string

    ```


    While the following is invalid and would not:


    ```javascript

    var t = This is text; // This will not run - JavaScript can''t tell where the
    string starts and ends

    ```


    When assigning text that has quotes within, make use of the backslash operator
    to ensure that the quotes in the string do not cause any issues in assignment
    eg:


    ```javascript

    var t = ''This work''/s well.'';

    ```


    The backslash escapes characters that would otherwise be interpreted differently
    by JavaScript.


    ## Booleans


    A boolean variable contains either a true or false value. Booleans are the most
    basic types of variables in use. Booleans are useful when working with conditional
    statements, which we''ll touch upon later in the book.


    A boolean variable can be assigned as below:


    ```javascript

    var x = true; //Outputting x will give true

    var y = false; //Outputting y will give false

    ```


    ## Arrays


    Arrays are how multiple values can be stored in a single variable. Think of them
    as a list of variables all accessible by an index. Arrays are declared in JavaScript
    using the square brackets with individual values separated by commas within. Eg:


    ```javascript

    var a = [''oranges'', 123, false, ''lemons''];

    ```


    In the above `a[0]` would return `oranges` and `a[1]` would return `123`.


    We''ll touch upon arrays in a later chapter of the book, for now you just need
    to know that arrays can also be assigned to variables.


    ## Objects


    Objects are a grouping of different values and functions. Think of objects as
    arrays, the only difference is that arrays are indexed by numbers while objects
    can have custom indexes.


    Please note that this is a very basic and somewhat crude definition of objects
    but should be enough to understand the example of assigning an object to a variable
    for now. Objects will be covered later on in the book.


    ```javascript

    var o = {name:''Bob Jones'', age:87, active:true};

    ```


    # Operators operator


    Operators are what get things done between variables. JavaScript provides a number
    of operators. We''ll be covering the most commonly used operators which you would
    need to know for day to day development activities. The operators in JavaScript
    are categorized as below:


    ## Assignment Operators


    We''ve already used the most common assignment operator used i.e. the `=` sign.
    This simply assigns a value to a variable. However there are a number of different
    assignment operators each with their own specifics.


    - `=` The `=` operator simply assigns a value to a variable without making any
    change in the value itself.


    ```javascript

    i = 10;

    document.write(i); // Outputs 10

    ```


    - `+=` The `+=` operator functions differently when used with a string and a number.
    When used with a string it merely concatenates the value onto the string. When
    used with a number it adds the value to the number:


    ```javascript

    var i = ''Hello '';

    i+=''Bob''; // i now equals to ''Hello Bob''

    var t = 10;

    t+=5; // t is now 15 - this is just likes writing t = t + 5

    ```


    - `-=` The `-=` operator subtracts the value from the variable and stores the
    resulting value in the variable. This is a shorthand method of writing a subtraction
    equation. This is used only with numerical values:


    ```javascript

    var t = 10;

    t-=2; // t is now 8

    ```


    - `*=` The `*=` operator multiplies the value into the variable and stores the
    resulting value in the variable. This is a shorthand method of writing a multiplication
    equation.


    ```javascript

    var t = 10;

    t*=2; // t is now 8

    ```


    - `/=` The `/=` operator divides the variable by the value and stores the resulting
    value in the variable. This is a shorthand method of writing a division equation.


    ```javascript

    var t = 10;

    t/=2; // t is now 5

    ```


    ## Arithmetic Operators


    Arithmetic operators are used to conduct mathematical operations. The common operators
    used in JavaScript are:


    | Operator | Function |

    | --- | --- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |

    | ++ | Increment |

    | -- | Decrement |


    ### Addition (+)


    Addition adds a value to a variable.


    ```javascript

    var a = 10;

    var b = 20;

    var c = a + b; // c = 30

    ```


    ### Subtraction (-)


    As the name suggests the value is subtracted from the variable. Note that subtracting
    a larger value from a smaller one would result in a negative value.


    ```javascript

    var a = 10;

    var b = 20;

    var c = b - a; // c = 10

    var a = 10;

    var b = 20;

    var c = a - b; // c = -10

    ```


    ### Multiplication (*)


    The multiplication operator multiplies the value into the variable.


    ```javascript

    var a = 10;

    var b = 2;

    var c = a * b; // c = 20

    ```


    ### Division (/)


    This divides the variable by the value. Results can also yield decimal values.


    ```javascript

    var a = 10;

    var b = 2;

    var c = a / b; // c = 5

    var a = 5;

    var b = 10;

    var c = a / b; // c = 0.5

    ```


    ### Modulus (%)


    the modulus returns the remainder of the variable when divided by the value. So
    `10%3` would return the number 1. When you use the modulus with an even number
    and two you would always get zero.


    ### Incrementing (++) & Decrementing--)


    The increment operator simply increments the variable by one. Likewise the decrement
    operator does the opposite and decrements the variable by one.


    ```javascript

    var a = 10;

    a++; // a is now 11

    a--; // a is now 10

    ```


    This is a short hand for the assignment operator `+=1` and `-=1` respectively.


    # Comparison Operators


    Probably the most commonly used operators you would be using are the comparison
    operators. Whenever you would need to make a decision based on the value of a
    specific variable you would make use of comparison operators.


    JavaScript currently provides the following comparison operators:


    | Operator | Description |

    | --- | --- |

    | == | equal to |

    | === | equal value & type |

    | != | not equal |

    | !== | not equal value or not equal type |

    | > | greater than |

    | < | less than |

    | >= | greater than or equal to |

    | <= | less than or equal to |


    ## How do they work?


    #### ==== Equals to


    The equals to operator does as its namesake. It compares two variables and returns
    a Boolean value `true` if both variables have an equal value and return s `false`
    if not. Keep in mind that `==` is not the same as `=` where `=` is an assignment
    operator.

