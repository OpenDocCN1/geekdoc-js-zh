  trans: "\n使用上述对象（Objects），你也可以像之前在数组中讨论过的那样，使用 `for..in` 循环来遍历属性。注意，对象非常像复杂的数组，区别在于它们不是通过数值值进行索引的：\n\
    \n```javascript\nfor(i in fido){\n    document.write(i + ':' + fido[i] + '<br\
    \ />');\n}\n```\n\n上面的示例遍历了对象的所有属性，并打印属性名和属性值。\n\n就像数组一样，你也可以使用 `delete` 函数从对象中删除属性。然而，与数组使用\
    \ `delete` 函数会在数组中留下一个空隙不同，在对象中，`delete` 函数会从对象本身完全移除该属性——这里没有空隙。在删除属性后，除非重新创建它，否则你无法引用它。\n\
    \n```javascript\nvar fido = new dog(\"Fido\", \"Bulldog\", 3);\n\ndelete(fido.name);\
    \ // 现在 fido 没有 name 了\n\nfido.name = 'Butch'; // Fido 现在的名字是 butch\n```\n\n###\
    \ 对象可以这些这些 - 添加方法\n\n不仅是属性，你还可以给对象分配名为方法（methods）的函数。对象中方法的声明方式与属性相同。让我们来看下面这个简单的示例：\n\
    \n```javascript\nfunction dog(name, breed, age) {\n    this.name = name;\n   \
    \ this.breed = breed;\n    this.age = age;\n    this.feed = function(food){\n\
    \        document.write(this.name + ' likes ' + food);\n    }\n}\n\nvar fido =\
    \ new dog(\"Fido\", \"Bulldog\", 3);\n\nfido.feed('kibbles'); // 打印 'Fido likes\
    \ kibbles'\n```\n\n在上面的示例中，我们声明了一个方法 `feed`，向它传递了一个变量，甚至从创建的对象中调用了它。上面的示例还展示了如何在函数内部如何使用\
    \ `this` 关键字引用对象的属性。同时，我们还可以在函数内部引用外部对象，就像我们调用 `document` 对象的 `document.write`\
    \ 方法一样。通过方法，我们还可以编辑对象的底层属性。这是一个示例：\n\n```javascript\nfunction dog(name, breed,\
    \ age) {\n    this.name = name;\n    this.breed = breed;\n    this.age = age;\n\
    \    this.addAge = function(years){\n        this.age+=years;\n    }\n}\n\nvar\
    \ fido = new dog(\"Fido\", \"Bulldog\", 3);\nvar rover = new dog(\"Rover\", \"\
    Sheepdog\", 4);\n\nfido.addAge(3);\nrover.addAge(5);\n\nfido.age; // 等于 6\nrover.age;\
    \ // 等于 9\n```\n\n我们创建了两个对象，并创建了一个增加各个对象 `age` 属性的方法。你可以看到两个对象都有自己独特的属性和方法。属性和方法对于从同一个构造类创建的每个对象都是唯一的。你已经可以看到使用对象的灵活性以及面向对象的开发实际上是如何运作的。所有相关的代码和属性都汇总在同一个对象中。如果没有对象，你的代码将是变量和函数的混乱堆，你将苦于将相互关联的值或以某种方式关联在一起。考虑一下如果没有对象要完成上述操作，将会是怎样的噩梦：\n\
    \n```javascript\nvar fido_name    = 'Fido';\nvar fido_breed   = 'Bulldog';\nvar\
    \ fido_age     = 3;\nvar rover_name   = 'Rover';\nvar rover_breed = 'Sheepdog';\n\
    var rover_age   = 5;\n// 请不要再了\n```\n\n对象让编程再次变得意义\n\n## 一切皆是对象\n\n在 JavaScript\
    \ 中，几乎一切都是一个 `Object`。JavaScript 提供了一系列默认的 `Object` 类型，我们在日常编程中使用它们。当我们说“一切”时，我们指的是实际上的所有内容。你一直在创建的变量、函数和数组——一切都是一个\
    \ `Object` 并且被像对象一样对待。当我们说被像对象一样对待时，我们的意思是所有此类对象都有自己的属性和方法。我们没有定义它们——因为 JavaScript\
    \ 已经为我们预定义了它们大部分（JavaScript 这样做真是太好了，不是吗）。\n\n## JavaScript 原生对象\n\n就像 `Array`\
    \ 对象以及 `Object` 对象一样，JavaScript 为许多对象定义了构造函数。我们一直以来都在使用其中大部分，例如：\n\n*   Numbers（数字）\n\
    *   Strings（字符串）\n*   Dates（日期）\n*   Objects（对象）\n*   Arrays（数组）\n*   Functions（函数）\n\
    *   Dates（日期）\n\n其中一些对象映射到我们这段时间一直在使用的原始数据类型。例如，让我们看看数字。下面的代码做什么的：\n\n```javascript\n\
    var a = 10;\n```\n\n如果你说它为变量 `a` 分配了数字 `10`，你是完全正确的。然而，你也可以使用 JavaScript 的 `Number`\
    \ 构造函数将其声明为数字对象：\n\n```javascript\nvar a = new Number(10);\n```\n\n这与声明原始变量的区别在于，当你声明一个变量时，你只是声明了一个变量，但当你将其声明为\
    \ `Number` 构造函数的对象时——这与声明原始变量不同——因为（等等，我还是遵循文本流程）。\n\n"
- fmt: "\nJavaScript strings are more than just textual data. When you create a string\
    \ in JavaScript you get a host of properties and methods through which to interact\
    \ with the string and manipulate it. A thorough knowledge of what the string object\
    \ holds in JavaScript would help you through the most fundamental programming\
    \ tasks saving you the time in coding functions that would otherwise be already\
    \ handled with available methods from the JavaScript string Object.\n\n## Overview\n\
    \nWe'll discuss the JavaScript string object and go over the various properties\
    \ and methods available for use by the string object. We'll also understand the\
    \ implications of the string Objects methods and go over a few real world examples\
    \ that would illustrate their usage.\n\n## All strings are objects\n\nStrings\
    \ are as you already know, textual data. They can contain alphabets, numbers,\
    \ operators, accented characters etc. Strings are always enclosed in double or\
    \ single quotes. When a string contains a single or double quote it is normally\
    \ escaped with a backslash to prevent JavaScript from assuming that the quote\
    \ within the string is the enclosing quote. Strings are created in JavaScript\
    \ just like any other object.\n\n```\nvar str = 'This is a String';\n\nvar str\
    \ = new String('This is also a string');\n```\n\nIn the above example we've created\
    \ strings in one of two ways, by implicitly declaring a variable with a string\
    \ value and by creating an instance of the `String` Object. Both ways result in\
    \ getting a string Object with a number of methods and properties. Let’s look\
    \ at some of the properties and methods that come with the string Object.\n\n\
    ## How long, and other facts about my string\n\nThe string object gives us a few\
    \ properties to work with. The most commonly used property will be the `length`\
    \ property. This as its name infers, returns the length of the string. The `length`\
    \ property works just like how the `length` property works for arrays i.e. with\
    \ arrays it refers to the number of elements in the array.\n\n```\nvar str = 'This\
    \ is a String';\n\nstr.length; // equals 16 - note that empty spaces are also\
    \ regarded as a string\n\nvar str = ' ';\n\nstr.length; // equals 1 - empty spaces\
    \ are also counted\n\nvar str = '';\n\nstr.length; // equals zero - an empty string\
    \ is well empty..\n```\n\nOn its own the `length` property can be used to tell\
    \ if a string is empty or not, but its most commonly used in tandem with either\
    \ a for loop or other methods used to search or extract from a string. Strings\
    \ exhibit similar characteristics to arrays in some ways. For example the individual\
    \ characters in a string can be referred to by an index in the same way as the\
    \ individual elements of an array would be referred to.\n\n```\nvar str = 'This\
    \ is a String';\n\nstr[0]; // equals 'T'\n\nstr[1]; // equals 'h'\n```\n\nAs in\
    \ the above example a string can be taken apart pretty much like an array. Let’s\
    \ use the `length` property in a simple loop here:\n\n```\nvar str = 'This is\
    \ a String';\n\nfor(var i = 0; i< str.length; i++){\n    document.write(str[i]\
    \ + '<br/>');\n}\n```\n\nWe've just printed out all the letters in the string\
    \ on different lines. Just like arrays, the starting index for strings is also\
    \ zero and this is why running a string through a loop is the same as running\
    \ an array through a loop.\n\n## Searching/slicing - what can you do with a string\n\
    \nJust like other objects strings also have a host of methods that allow you to\
    \ manipulate and work with the string as you require. This is particularly useful\
    \ if you would require validating any kind of string input, checking for occurrence\
    \ of any specific keywords etc. While down the line you'll be introduced to libraries\
    \ that make the process alot simpler to use its important to be acquainted with\
    \ the basic native functions that JavaScript offers you with regards to objects.\
    \ This is because by making use of native JavaScript functions your code will\
    \ be much more efficient which makes for a better user experience.\n\n### If its\
    \ native to JavaScript it’s your best bet\n\nStrings share a lot of similar functions\
    \ with Arrays. For example we had a look at the `indexOf` function in the chapter\
    \ of arrays. With arrays this function would return the index of first occurrence\
    \ of the element passed to it in the array. With strings we have the same function\
    \ that does pretty much exactly the same thing.\n\n```\nvar s = \"Macaroni and\
    \ Cheese\";\n\ns.indexOf('Cheese');// returns 13\n```\n\nYou can search for the\
    \ occurrence of a string within a string and it would return the numeric index\
    \ of the first occurrence of the string being searched. Think of this as a fundamental\
    \ search feature. In case the string is not found it returns a negative value.\n\
    \nNote: this function is case sensitive\n\n```\nvar s = \"Macaroni and Cheese\"\
    ;\n\ns.indexOf('Cheese');// returns 13\n\ns.indexOf('CHEESE');// returns -1\n\
    ```\n\nIts sister counterpart is the `lastIndexOf` function which does pretty\
    \ much the opposite of `indexOf` and returns the last occurence of the search\
    \ string passed to it. This is similar to the exact same function used when searching\
    \ arrays. Just like the `indexOf` method. This function is also case sensitive.\n\
    \n```\nvar s = \"Cheddar Cheese and Gouda Cheese\";\n\ns.indexOf('Cheese');//\
    \ returns 8\n\ns.indexOf('CHEESE');// returns -1\n\ns.lastIndexOf('Cheese');//\
    \ returns 24\n\ns.lastIndexOf('CHEESE');// returns -1\n```\n\nAnother commonly\
    \ used feature is the ability to combine strings. We've already used the plus\
    \ sign `+` to concatenate strings in earlier examples.\n\n```\nvar s = \"Cheddar\
    \ Cheese\";\n\nvar b = \"Fried Onions\";\n\nvar d = s + ' and ' + b;\n\nd; //\
    \ equals now 'Cheddar Cheese and Fried Onions'\n```\n\nAlternatively you can also\
    \ use the `concat` method of a string to append as many other strings to it. This\
    \ is exactly like the `concat` function for arrays. So the above code can be rewritten\
    \ as:\n\n```\nvar s = \"Cheddar Cheese\";\n\nvar b = \"Fried Onions\";\n\nvar\
    \ d = '';\n\nd.concat(s, ' and ' + b);\n\nd; // equals now 'Cheddar Cheese and\
    \ Fried Onions'\n```\n\nNote even with arrays you need to declare a variable as\
    \ a string to use its functions\n\nStrings also allow you to manipulate the contents\
    \ within. You can change case of all the letters in a string using the two handy\
    \ functions `toLowerCase` and `toUpperCase` respectively. One function you'll\
    \ be using quite often.\n\n```\nvar s = \"Cheddar Cheese\";\n\ns.toUpperCase();\
    \ // s is now 'CHEDDAR CHEESE'\n\ns.toLowerCase(); // s is now 'cheddar cheese'\n\
    ```\n\nAt times, especially during taking input from users, you'll want to make\
    \ sure any input doesn't have any trailing empty spaces with it. It’s ugly to\
    \ look at and can cause issues when you wish to sort out string data. Also if\
    \ let’s assume you're taking in a password and someone accidentally adds in a\
    \ few extra spaces too many(it can happen!), you might end up with a user frustrated\
    \ that his password doesn't work because he doesn't recall having entered any\
    \ spaces. (Spaces don't make for good passwords anyway). JavaScript provides the\
    \ `trim` function which trims out any trailing or preceding white spaces.\n\n\
    ```\nvar name = \" George Glass \";\n\nname.trim(); // s is now 'George Glass'\n\
    ```\n\n### Strings in Splits\n\nRemember with arrays we have a `join` function\
    \ that would technically glue all the elements of the array with a delimiter giving\
    \ you a string. Strings on the other hand provide an antithesis to that function\
    \ i.e. the `split` function. Instead of joining thing, the `split` function breaks\
    \ up a string into an array of sub strings based upon a delimiter to break the\
    \ string apart. Works like the `join` function for arrays only in reverse.\n\n\
    ```\nvar s = \"Cheese,Onions,Pickles,Tomatos\";\n\ns.split(',');\n\ns;// equals\
    \ ['Cheese','Onions','Pickles','Tomatos']\n\nvar s = \"Dogs and Cats and Mice\"\
    ;\n\ns.split(' and ');\n\ns;// equals ['Dogs','Cats','Mice']\n```\n\nPlease note\
    \ that even with the `split` function, the delimiter searched for is case sensitive.\
    \ By default all string functions are case sensitive.\n\n```\nvar s = \"Cheese\
    \ and Onions and Tomatos\";\n\ns.split(' And ');\n```\n"
  raw: 'JavaScript strings are more than just textual data. When you create a string
    in JavaScript you get a host of properties and methods through which to interact
    with the string and manipulate it. A thorough knowledge of what the string object
    holds in JavaScript would help you through the most fundamental programming tasks
    saving you the time in coding functions that would otherwise be already handled
    with available methods from the JavaScript string Object.


    ## Overview


    We''ll discuss the JavaScript string object and go over the various properties
    and methods available for use by the string object. We''ll also understand the
    implications of the string Objects methods and go over a few real world examples
    that would illustrate their usage.


    ## All strings are objects


    Strings are as you already know, textual data. They can contain alphabets, numbers,
    operators, accented characters etc. Strings are always enclosed in double or single
    quotes. When a string contains a single or double quote it is normally escaped
    with a backslash to prevent JavaScript from assuming that the quote within the
    string is the enclosing quote. Strings are created in JavaScript just like any
    other object.


    var str = ''This is a String'';


    var str = new String(''This is also a string'');


    In the above example we''ve created strings in one of two ways, by implicitly
    declaring a variable with a string value and by creating an instance of the String
    Object. Both ways result in getting a string Object with a number of methods and
    properties. Let’s look at some of the properties and methods that come with the
    string Object.


    ## How long, and other facts about my string


    The string object gives us a few properties to work with. The most commonly used
    property will be the length property. This as its name infers, returns the length
    of the string. The length property works just like how the length property works
    for arrays i.e. with arrays it refers to the number of elements in the array.


    var str = ''This is a String'';


    str.length; // equals 16 - note that empty spaces are also regarded as a string


    var str = '' '';


    str.length; // equals 1 - empty spaces are also counted


    var str = '''';


    str.length; // equals zero - an empty string is well empty..


    On its own the length property can be used to tell if a string is empty or not,
    but its most commonly used in tandem with either a for loop or other methods used
    to search or extract from a string. Strings exhibit similar characteristics to
    arrays in some ways. For example the individual characters in a string can be
    referred to by an index in the same way as the individual elements of an array
    would be referred to.


    var str = ''This is a String'';


    str[0]; // equals ''T''


    str[1]; // equals ''h''


    As in the above example a string can be taken apart pretty much like an array.
    Let’s use the length property in a simple loop here:


    var str = ''This is a String'';


    for(var i = 0; i< str.length; i++){


        document.write(str[i] + ''<br/>'');


    }


    We''ve just printed out all the letters in the string on different lines. Just
    like arrays, the starting index for strings is also zero and this is why running
    a string through a loop is the same as running an array through a loop.


    ## Searching/slicing - what can you do with a string


    Just like other objects strings also have a host of methods that allow you to
    manipulate and work with the string as you require. This is particularly useful
    if you would require validating any kind of string input, checking for occurrence
    of any specific keywords etc. While down the line you''ll be introduced to libraries
    that make the process alot simpler to use its important to be acquainted with
    the basic native functions that JavaScript offers you with regards to objects.
    This is because by making use of native JavaScript functions your code will be
    much more efficient which makes for a better user experience.


    If its native to JavaScript it’s your best bet


    Strings share a lot of similar functions with Arrays. For example we had a look
    at theindexOf function in the chapter of arrays. With arrays this function would
    return the index of first occurrence of the element passed to it in the array.
    With strings we have the same function that does pretty much exactly the same
    thing.


    var s = "Macaroni and Cheese";


    s.indexOf(''Cheese'');// returns 13


    You can search for the occurrence of a string within a string and it would return
    the numeric index of the first occurrence of the string being searched. Think
    of this as a fundamental search feature. In case the string is not found it returns
    a negative value.


    Note: This function is case sensitive


    var s = "Macaroni and Cheese";


    s.indexOf(''Cheese'');// returns 13


    s.indexOf(''CHEESE'');// returns -1


    Its sister counterpart is the lastIndexOf function which does pretty much the
    opposite of indexOf and returns the last occurence of the search string passed
    to it. This is similar to the exact same function used when searching arrays.
    Just like the indexOf method. This function is also case sensitive.


    var s = "Cheddar Cheese and Gouda Cheese";


    s.indexOf(''Cheese'');// returns 8


    s.indexOf(''CHEESE'');// returns -1


    s.lastIndexOf(''Cheese'');// returns 24


    s.lastIndexOf(''CHEESE'');// returns -1


    Another commonly used feature is the ability to combine strings. We''ve already
    used the plus sign + to concatenate strings in earlier examples.


    var s = "Cheddar Cheese";


    var b = "Fried Onions";


    var d = s + '' and '' + b;


    d; // equals now ''Cheddar Cheese and Fried Onions''


    Alternatively you can also use the concat method of a string to append as many
    other strings to it. This is exactly like the concat function for arrays. So the
    above code can be rewritten as below:


    var s = "Cheddar Cheese";


    var b = "Fried Onions";


    var d = '''';


    d.concat(s, '' and '', b);


    d; // equals now ''Cheddar Cheese and Fried Onions''


    Note even with arrays you need to declare a variable as a string in order to use
    its functions


    var s = "Cheddar Cheese";


    var b = "Fried Onions";


    d.concat(s, '' and '', b); // this will not work because we haven''t declared
    d yet


    Strings also allow you to manipulate the contents within. You can change case
    of all the letters in a string using the two handy functions toLowerCase and toUpperCase respectively.
    One function you''ll definitely be using quite often.


    var s = "Cheddar Cheese";


    s.toUpperCase(); // s is now ''CHEDDAR CHEESE''


    s.toLowerCase(); // s is now ''cheddar cheese''


    At times, especially during taking input from users, you''ll want to make sure
    any data inputted doesn''t have any trailing empty spaces with it. It’s ugly to
    look at and can cause issues when you wish to sort out string data. Also if let’s
    assume you''re taking in a password and someone accidentally adds in a few extra
    spaces too many(it can happen!), you might end up with a user frustrated that
    his password doesn''t work because he doesn''t recall having entered any spaces.
    (Spaces don''t make for good passwords anyway). JavaScript provides the trim function
    which trims out any extra trailing or preceding white spaces.


    var name = " George Glass  ";


    s.trim(); // s is now ''George Glass''


    ### Strings in Splits


    Remember with arrays we have a join function that would technically glue all the
    elements of the array with a delimiter giving you a string. Strings on the other
    hand provide an antithesis to that function i.e. the split function. Instead of
    joining thing, the split function breaks up a string into an array of sub strings
    based upon a delimiter to break the string apart. Works like the join function
    for arrays only in reverse.


    var s = "Cheese,Onions,Pickles,Tomatos";


    s.split('','');


    s;// equals [''Cheese'',''Onions'',''Pickles'',''Tomatos'']


    var s = "Dogs and Cats and Mice";


    s.split('' and '');


    s;// equals [''Dogs'',''Cats'',''Mice'']


    Please note that even with the split function, the delimiter searched for is case
    sensitive. By default all string functions are case sensitive.


    var s = "Cheese and Onions and Tomatos";


    s.split('' And '');'
