  raw: 'The HTML DOM or Document Object Model is a w3 standard for defining and accessing
    content of a webpage i.e. document. The HTML DOM is standard conventional interface
    which defines all elements as objects as well as the properties inherent to each
    element as well as the methods and events available for each element.


    Every element in a webpage including the webpage itself is referred to as a node.
    The nodes are arranged in a tree like structure with the document node as the
    root node with the other nodes following in for example:


    <html>


      <head></head>


      <body></body>


    </html>


    The first node in the document node is the html node which branches out into the head element
    node and the body element node respectively and so forth.


    When a web page is rendered, a Document Object Model of the page is created with
    each and every element loading as a node on the tree. This is a very important
    way to understand the DOM in order to be able to interact and manipulate it which
    we would do so using the many methods available to us from the DOM.


    Every element on the page including the page itself is an object of the class
    node. The node is the base class which defines every element in the page as well
    as the page itself. And on account of this almost all the objects have similar
    methods and properties as well as their own specialized properties.


    Let’s start off by creating a basic HTML page which we would use for the rest
    of this exercise. You can put all the JavaScript code either in a script tag in
    the head of the page or in an external .js file and link to that file as an external
    script.


    <html>


      <head>


        <title>Hello World</title>


      </head>


      <body>


        <h1 id="heading">The Page</h1>


        <p id="sub" class="base">This is some text on the page</p>


        <table class="base">


          <tr>


            <td>Item</td>


            <td>A</td>


          </tr>


          <tr>


            <td>Item</td>


            <td>B</td>


          </tr>


        </table>


        <ul name="list">


          <li>Element 1</li>


          <li>Element 2</li>


          <li>Element 3</li>


        </ul>


      </body>


    </html>


    We''ll use this html page for the rest of this chapter with small variations.
    To understand the different functions available for the DOM, we''ll make use of
    them and see their practical implications.


    ## Console console?


    Before we proceed we need to be acquainted with a small tool that you will definitely
    be using a lot when you start real development. In browsers firefox and Chrome
    as well as Opera you have the option of inspecting elements. Right click on any
    part of the screen and you should have a menu option to inspect the element. This
    actually opens up a panel to the bottom or side of the browser which shows the
    entire current page as it is with the element inspected highlighted.


    Give it a try and you''ll understand how it works.


    While this alone is very useful, you''ll notice that the panel which has opened
    has a number of useful tabs. We won''t be looking at all of the tabs but you''ll
    definitely have a script tab, an HTML tab and a console tab as well. We''ll be
    interested in the console tab. The panels on modern browsers allow a simple function
    called console.log that allows you to output an element or just about anything
    to this console tab. If you were to output an HTML element using document. Write
    you would only output HTML and it would be rendered on screen, however using console.log
    you can output just about anything to the console tab and really refine development
    in the process.


    Try the console.log function - let’s output a simple bit of text:


    console.log(''This is some text'');


    Run the page and you''ll see while nothing appears on the page, in the inspect
    > console tab the text has been displayed. Let’s try and pass an array to the
    console.log function.


    console.log([1,2,3,4,5]);


    You see that the output in the console tab, you can click on it and actually view
    the contents of the array. To the side you can also view in the DOM panel a list
    of all the methods and properties native to the array. Some of those methods and
    properties would look very familiar as we''ve covered them. Already you can see
    the usefulness of this tool. We would be using this extensively during the course
    of this chapter.


    Note that this feature is a development tool when your site is production ready
    you would not want to have console.log functions lying around in your deployed
    code.


    Let’s get back to our page. By default we already have a document object to work
    with. The document object refers to the page that has been loaded. Incidentally
    the document object is a child object of another object namely the window object
    which refers to your browser. The browser can also be controlled via JavaScript
    and is also referred as an object. We''ll look at what devious schemes we can
    do with the browser in a later chapter.


    Since the document is the core node of any web page all of the methods we would
    be using would be inherent to the document object.


    The first function we''ll be using is getElementById. This function does as its
    name sake and selects the element based on the id of the element. It takes in
    a string which is the id of the element. Let’s pick the h1 element in the above
    page.


    var el = document.getElementById(''heading'');


    console.log(el);


    We assigned the node retrieved by the getElementById function to a variable and
    outputted it in the console. You should be able to see the element in your console
    panel - click on it and you''ll even see the content of the node itself.


    Now that you know how to capture an element let’s see what you can do with it.
    We''ll manipulate the elements properties in the next example. How about changing
    the content of the h1 node? All nodes carry with them an innerHTML property which
    refers to the entire HTML contained within the node. Let’s use this to change
    the heading using JavaScript.


    var el = document.getElementById(''heading'');


    el.innerHTML = ''New Heading'';


    document.getElementById(''heading'').innerHTML = ''Another heading''; // this
    works as well


    You''ve now manipulated your first element. What if you try to get an element
    with a wrong id?


    var el = document.getElementById(''head_ing'');


    el; // this equals undefined


    el.innerHTML = ''New Heading''; // throws an error


    document.getElementById(''head_ing'').innerHTML = ''Another heading''; // will
    throw an error


    As a good practice it’s important to check to make sure if an element actually
    exists prior to manipulating it. This is because since JavaScript is an interpreted
    language, the minute an error is encountered the script would halt and won''t
    proceed beyond the point of error. Checking for an undefined object is simple:


    var el = document.getElementById(''head_ing'');


    if(el){


      el.innerHTML = ''New Heading''; 


    }


    The if statement is very versatile, if the element would be null or false it would
    be evaluated as false, and if the variable has any kind of value that isn''t null
    or undefined or false the condition would evaluate to true.


    Note in order to check a variable for a true or false value you must have declared
    the variable beforehand.


    There are a number of methods available in native JavaScript to retrieve elements
    on the page. We''ve learnt how to retrieve an element by searching for an element
    with a specific id, how about searching for an element based on another set of
    parameters:


    var a = document.getElementsByClassName(''base'');


    var a = document.getElementsByTagName(''li'');


    var a = document.getElementsByName(''list'');


    The above methods of the document object retrieve elements based upon the class, tag and name respectively.
    All the above functions return an array of possible elements. So the getElementsByTagNamefunction
    returns an array of all the li tags in the entire document. You can output using
    the console function whatever has been retrieved using this manner.'
