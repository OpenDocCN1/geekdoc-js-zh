    ## Search - Regular Expressions Oh My


    At this point we would like to introduce a very powerful feature of JavaScript
    with regards to search for strings. At times when you need to make a search, your
    queries would be more complex than just looking for a case sensitive occurrence
    of a substring in a string. What you wish to make sure that an email is a valid
    email? You could search for the occurrence of the @ symbol - but how can you be
    sure there aren''t any other wrong symbols, and how can you check to make sure
    it’s in the correct format? You''ll need to use a lot of nested if statements
    to pull this one off. And what if you need to check if a phone number entered
    is valid, or a social security number. Obviously looking for the first and last
    occurrences wouldn''t work here.


    Enter the regular expression. Regular expressions are a special sequence of characters
    that are used to form a search pattern. They can be pretty confusing at first
    but are very powerful if done right. With regular expressions you define a pattern
    to search for using a mix of characters. In regular expressions different characters
    and operators have different implications in forming the pattern.


    Regular expressions are declared by either creating an explicit RegExp Object
    in JavaScript or by declaring the pattern itself between two backslashes / /.


    Here is a simple example of a regular expression that does a very simple search.


    var s = ''Cheese and Onions'';


    var r = /cheese/i;    // our regular expression


    We''ve declared a simple regular expression. On its own it doesn''t do much but
    when we use it with a method that takes in a regular expression i.e. the search method
    for strings.


    var s = ''Some Cheese and Onions'';


    var r = /cheese/i;    // our regular expression


    s.search(r); // returns 5


    The regular expression above is composed of two elements - within the backslashes
    is the string to be searched. At the end the letter i  is used as a ''modifier''.
    The letter i when used after the backslash stand for case insensitive search so
    the regular expression when used in a search would return occurrences irrespective
    of the case they were in. Much more effective than using a mess of if statements!


    Also it’s not just text that we use between the backslashes for search. Remember
    we can also write up patterns using special characters to create a search pattern.
    Let’s look at a few simple patterns we can make with regular expressions.


    The square brackets [] when used within the backslashes, means to search for any
    character within the brackets.


    var r = /[ce]/i;    // our regular expression


    The above regular expression would match all the occurrences of c and e upper
    or lower case when used in a search operation. Let’s use the regular expressions
    in another useful function that you''ll be using a lot namely the replace function.
    The replace function takes two parameters the first is a string or a regular expression
    to search for and the second parameter is a string to replace the matched value
    with.


    var s = ''Cheese and Onions'';


    var r = /cheese/i;    // our regular expression


    s.replace(r, ''Thyme''); // r is now ''Thyme and Onions''


    var s = ''Cheese and Onions'';


    var r = /[ce]/i;    // our regular expression


    s.replace(r, ''x''); // s is now `xheese and Onions`


    This should make sense but in the above example with the square brackets only
    the first occurrence of c was replaced. This is because by default the regular
    expression only matched the first occurrence. If we want to match all occurrences
    we''ll have to make use of a new modifier i.e. the g modifier. g is the global
    modifier and matches the pattern to all possible occurences in the string applied.


    Note modifiers can work together


    var s = ''Cheese and Onions'';


    var r = /[ce]/g;    // our regular expression


    s.replace(r, ''x''); // s is now `Chxxsx and Onions`


    var s = ''Cheese and Onions'';


    var r = /[ce]/ig;    // our regular expression


    s.replace(r, ''x''); // s is now `Xhxxsx and Onions`


    var s = ''Cheese and Onions'';


    var r = /[ce]/gi;    // our regular expression


    s.replace(r, ''x''); // s is now `Xhxxsx and Onions`


    Regular expressions are a very complex topic in their own right and covering even
    the basic would warrant the use of an entire book to say the least. We’ve touched
    very sparingly on regular expressions but already you can see the possibilities
    and how versatile a search can be made with the help of regular expressions.


    Another interesting function that can be considered for making searches is the match function.
    The function as its name states searches the string and returns the possible match(s)
    if any. This function differs from search that the search function only returns
    the index of the first occurrence.


    var s = ''Some Cheese, cheeses and Onions'';


    var r = /cheese/i;    // our regular expression


    s.match(r); // returns ["Cheese"]


    var s = ''Some Cheese, cheeses and Onions'';


    var r = /cheese/gi;    // our regular expression


    s.match(r); // returns ["Cheese", "cheese"]


    ## How about slicing and dicing some strings?


    We''ve used a few native functions of strings to search through them and make
    replacements based upon search strings as well as regular expressions. Aside that
    you can also splice and slice strings like a professional sushi chef.


    JavaScript provides the substring and the substr function. Both function the same
    way with a few subtle differences. They take two parameters, first the index of
    the string where to start the extraction, the second parameter is optional. With substr it
    takes in the length of the string to extract. With substring it takes in the next
    index till where to extract. If the second parameter is omitted the entire length
    of the string from the index is extracted.


    var s = "Cheese and onions pizza";


    s.substring(0, 1); // returns C


    s.substr(0, 1); // returns C


    s.substring(2, 4); // returns ees


    s.substr(2, 4); // returns eese


    With the substring function if the second value passed in is less than the first
    value the values are switched as you cannot have the second index to extract to
    less than the index to extract from.


    var s = "Cheese and onions pizza";


    s.substring(7, 5) == s.substring(5, 7);


    These functions when used in conjunction with the search functions as well as
    regular expressions can help in developing complex string manipulation based applications.


    ## Summary


    *   We know that strings can be created explicitly or by assigning a string value
    to a variable


    *   Strings are similar to arrays as they have indexes and share similar functions.


    *   Strings can also be searched using regular expressions.


    *   Regular expressions are sequential characters which help to define a search
    pattern for use with string functions.


    *   The substring and subrt functions are used to extract parts of a string based
    upon starting indexes and length / ending indexes.


    ## Assignment


    #### Exercise 1


    Create a function that searches and filters a string for a set of nasty words
    namely the words - stupid, mean, revolting. Have the words replaced with asterisks
    leaving only the first letter.


    #### Exercise 2


    Create a function that validates an email address and doesn''t accept any address
    from ''gmail.com'' and ''yahoo.com''.


