  trans: "\n正如 `document` 对象拥有方法和属性一样，所有的节点也拥有自己的属性。我们已经检查了上述示例中元素的 `innerHTML` 属性。\n\
    \n注意——`getElementById` 只返回单个元素，而不是数组。如果你在页面上有多个相同 ID 的元素，那将很糟糕！\n\n## 重复一切\n\n\
    另一个有趣的是，正如 `document` 对象拥有方法和属性，页面上的元素也是如此。由于所有元素都继承自 `Node` 对象，它们在同一时间共享许多方法和属性。\n\
    \n例如，一个 `a` 元素会有 `href` 属性，而 `p` 元素则不会。同样，有些元素显示为 `block`，而有些默认是 `inline` 的。这在学习\
    \ HTML 和 CSS 时，了解这些可用方法和属性会更好。\n\n让我们向页面中添加以下 HTML：\n\n```html\n<div id=\"parent1\"\
    \ class=\"one\">\n  <p class=\"pink\"></p>\n  <p class=\"pink\" name=\"para\"\
    ></p>\n  <div id=\"red\"></div>\n<p class=\"pink\"></p>\n```\n\n在上面的 HTML 中，你有一些\
    \ `p` 元素，我们可以通过 `div` 元素来获取带有类 `one` 的 `div` 元素。嵌套元素是父元素的子元素。使用下方的 `document`\
    \ 函数：\n\n```javascript\nvar pink_els = document.getElementsByClassName('pink');\n\
    ```\n\n顺便，我们也可以通过父元素检索它们：\n\n```javascript\nvar p = document.getElementById('parent1');\n\
    p.getElementsByClassName('pink');\n```\n\n上面的示例返回一个元素数组，但如果你在控制台中输出它，你会发现之前的示例返回了三个元素，而这个示例只返回了两个。这是因为这些检索元素是在调用它们时工作的。`document`\
    \ 对象包含了每一个 HTML 元素，因此 `getElementsByClassName` 或 `getElementsByTagName` 在与单个元素配合使用时，会搜索所有的子节点或元素。\n\
    \n你可以像在循环中使用一样使用这个元素数组：\n\n```javascript\nvar p = document.getElementById('parent1');\n\
    var a = p.getElementsByClassName('pink');\n\nfor(var i = 0; i< a.length; i++){\n\
    \  console.log(a[i]); // 一次输出一个元素\n  a[i].innerHTML = i; // 用相应的索引替换 `pink` 类元素的内容\n\
    }\n```\n\n## 让我们操作\n\n现在你已经知道了 DOM 实际上是如何工作的，以及如何从 `document` 或元素内部检索单个或一组元素，让我们继续学习允许我们进行一些操作的方法和属性。\n\
    \n在在此之前，让我们为我们的 HTML 添加一些 CSS。你可以通过创建一个外部 CSS 文件、在 `link` 标签中链接它，或者在文档的 style\
    \ 标签块中添加。让我们在这里制作几个样式：\n\n```css\n.pink{ color:DeepPink; }\n.red{ color:Red; }\n\
    .blue{ color:Blue; }\n.one{ padding:10px; }\n```\n\n我们将从更改一些基本属性开始。最初我们使用 `innerHTML`\
    \ 属性完全更改被选中节点的 HTML。所有元素都有一个 `getAttribute` 方法，返回传递给它的属性。因此，如果我有一个元素，可以使用它来查找它的单个属性：\n\
    \n```javascript\nvar el = document.getElementById('parent1');\nel.getAttribute('class');\
    \ // 返回 one\n```\n\n还不错，但如果我们不知道元素是什么，并且需要检查一个不存在的属性怎么办？例如只有链接有 `href` 属性。我们有另一个恰当命名为\
    \ `hasAttribute` 的方法允许我们检查元素是否具有某个属性：\n\n```javascript\nvar el = document.getElementById('parent1');\n\
    el.hasAttribute('href'); // 返回 false\n```\n\n话虽说完，让我们结合这两个函数在这里进行一些操作。让我们在这里更改\
    \ `parent1` 元素的类，为此请向 `setAttribute` 问好：\n\n```javascript\nvar el = document.getElementById('parent1');\n\
    if(el.hasAttribute('class')){\n  el.setAttribute('class', 'blue');\n}\n```\n\n\
    哇，那确实改变了颜色。但等等——我们似乎丢失了原始类的内边距（padding）。这是因为我们覆盖了属性。如果我们只想追加类名，就会在做出更改之前使用 `getAttribute`\
    \ 函数来检索现有的类。\n\n```javascript\nvar el = document.getElementById('parent1');\n\
    if(el.hasAttribute('class')){\n  cls = el.getAttribute('class'); // 现在 cls 是 one\n\
    \  el.setAttribute('class', 'blue ' + cls);\n}\n```\n\n我们将类设置为包含 `blue` 和 `one`\
    \ 类的追加字符串。这是一个非常多功能的函数集，允许我们对任何元素执行任何操作。\n\n## 遍历 遍历 / 添加和删除！\n\n我们可以选择元素，现在可以操作它们——我们基本上获得了对页面的控制权。然而，到为止我们一直在相对于类名、ID\
    \ 和标签名进行操作。经常你需要根据元素相对于页面与其他元素的位置来访问元素。例如，你无法为页面上的每个元素都设置 ID，这在页面复杂且充满了大量 HTML\
    \ 时是非常不实际的。如果你想选择并更改特定 ID 元素相邻元素的颜色，或者你想更改无序列表中第 n 个列表项的类名呢？通过循环可以做的事情有限，遍历页面上的每一个元素是非常不实际的，并且会减慢并崩溃你的页面。\n"
