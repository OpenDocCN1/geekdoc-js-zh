    the parent frame here refers to the owning frame which contains the current page,
    in our example we don''t have frame so this shouldn''t really apply.


    *   ''_self'' - this means to load the url into the current page, in which case
    this isn''t a popup. The url would be loaded in this very same window


    *   any name, this would be a name that we can use to reference the window in
    any later bit of code


    Let’s add another link here that opens the google page in the same window that
    would open.


    <a href="#" id="open-window">Open a Window</a><br/>


    <a href="#" id="open-google">Open Google</a><br/>


    <a href="#" id="close-window">Close the Window</a>


    ``


