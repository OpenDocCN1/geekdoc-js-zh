- fmt: "\nEvents take place on elements, and are executed by the user in a myriad\
    \ of ways.\n\nBefore we go further we need to look at the various different events\
    \ we have in JavaScript and how they are grouped.\n\n### Events - Don't Mouse\
    \ around!\n\nThe most basic form of interaction in HTML is the `a` tag. It’s a\
    \ simple link to a different page or resource. However all DOM elements are able\
    \ to respond to just about any kind of event. The majority of all events expected\
    \ would definitely be via the mouse or cursor. Hence all events relative to DOM\
    \ elements are based on user actions with the mouse.\n\nLet’s make a simple example\
    \ of an event handler here within HTML itself:\n\n```html\n<a href=\"http://www.yahoo.com\"\
    \ onclick=\"return false;\">Click</</a>\n```\n\nPut that in your HTML file and\
    \ try to click on the link. For some reason it won't work. If you look at the\
    \ code you'll realize that we've added an `onclick` attribute to the element.\
    \ `onclick` actually corresponds to the users click action, and the contents of\
    \ this attribute is pure JavaScript. This bit of code merely returns the boolean\
    \ value `false`. Returning false to a click handler basically means don't do anything.\
    \ And that is what we've done here. Let’s modify that a bit:\n\n```html\n<a href=\"\
    http://www.yahoo.com\" onclick=\"return confirm('Are you sure?');\">Click</</a>\n\
    ```\n\nRun that and now click, you'll get a confirmation, if you respond with\
    \ affirmative it redirects because you passed it a `true` value, and if you choose\
    \ the otherwise it doesn't redirect because you've passed to it `false`. This\
    \ is a very simple way of coding in an event handler. But what if we needed to\
    \ do this for more than one link?\n\n```html\n<a href=\"http://www.yahoo.com\"\
    \ onclick=\"return confirm('Are you sure?');\">Click</</a>\n<a href=\"http://www.google.com\"\
    \ onclick=\"return confirm('Are you sure?');\">Click</</a>\n<a href=\"http://www.bing.com\"\
    \ onclick=\"return confirm('Are you sure?');\">Click</</a>\n```\n\nThis is pretty\
    \ monotonous. What we can do is put our JavaScript into a function and call that\
    \ function.\n\n```javascript\nfunction doConfirm(){\n  return confirm('Are you\
    \ sure?');\n}\n```\n\n```html\n<a href=\"http://www.yahoo.com\" onclick=\"doConfirm()\"\
    >Click</</a>\n<a href=\"http://www.google.com\" onclick=\"doConfirm()\">Click</</a>\n\
    <a href=\"http://www.bing.com\" onclick=\"doConfirm()\">Click</</a>\n```\n\nMuch\
    \ better but again we need to make a call to each function - let’s put all the\
    \ code to handle the even in JavaScript here.\n\n```javascript\nvar a = document.getElementsByTagName('a');\n\
    \nfor(var i = 0; i< a.length; i++){\n  a[i].onclick = function(){\n    return\
    \ confirm('Are you sure?');\n  }\n}\n```\n\n```html\n<a href=\"http://www.yahoo.com\"\
    >Click</</a>\n<a href=\"http://www.google.com\">Click</</a>\n<a href=\"http://www.bing.com\"\
    >Click</</a>\n```\n\nDefinitely much better, as you can see we've selected all\
    \ the `a` elements and assigned the individual `onclick` events a function. The\
    \ HTML is clean and we don't have any intermixing of JavaScript and HTML.\n\n\
    **Note:** Keep you HTML and JavaScript separate\n\nThis is one example using the\
    \ `onclick` event. Also understand that it’s not just the `a` link tag that responds\
    \ to an `onclick` event. Any element you have can respond to an `onclick` event.\
    \ Let’s try this with a paragraph and use some css to give the paragraph a background\
    \ color so we know what we're clicking on.\n\n```html\n<p id=\"clickable\" style=\"\
    background-color:yellow\">\n  You can click on me\n</p>\n```\n\n```javascript\n\
    document.getElementById('clickable').onclick = function(){\n  return alert('Hi!');\n\
    }\n```\n\nJust click on the paragraph and voila you get an alert pop up. This\
    \ is all well and interesting, however consider the following example JavaScript\
    \ with the same html:\n\n```javascript\ndocument.getElementById('clickable').onclick\
    \ = function(){\n  this.style.backgroundColor = 'red';\n}\n```\n\nClick the paragraph\
    \ and you see the color changes. What just happened and how? In the above JavaScript\
    \ we've introduced the `this` keyword. We used it when working with classes to\
    \ declare class properties and methods and it refers to the current object itself.\
    \ In this case it was a reference to the `clickable` paragraph object and made\
    \ reference to its style. The event handler merely changed the color of the objects\
    \ background on click. Already you can see the possibilities with the events in\
    \ JavaScript.\n\nLet’s take a look at another event namely the `dblclick` event.\
    \ This captures a double click from the mouse. Let’s modify the above JavaScript\
    \ so on click the background color changes to red and on double click it changes\
    \ to yellow.\n\n```javascript\nvar el = document.getElementById('clickable');\n\
    \nel.onclick = function(){\n  this.style.backgroundColor = 'red';\n}\n\nel.ondblclick\
    \ = function(){\n  this.style.backgroundColor = 'yellow';\n}\n```\n\nYou can click\
    \ like crazy now and see the colors change. Just as we have the click and double\
    \ click events we also have a host of other mouse events that can be used such\
    \ as:\n\n| Event | description |\n| --- | --- |\n| `element.onmousedown` | The\
    \ moment you press a mouse button over an element |\n| `element.onmouseenter`\
    \ | Just when the mouse cursor enters an element |\n| `element.onmouseleave` |\
    \ Just when the mouse cursor enters an element |\n| `element.onmousemove` | When\
    \ the mouse moves over an element |\n| `element.onmouseup` | The moment you release\
    \ a mouse button over an element |\n| `element.onmouseout` | When the mouse cursor\
    \ leaves an element |\n\n```html\n<div id=\"counter\">0</div>\n<div id=\"moveover\"\
    \ style=\"background-color:yellow\">\n  MOVE OVER\n  <p style=\"background-color:black\"\
    >A paragraph</p>\n</div>\n<div id=\"moveenter\" style=\"background-color:yellow\"\
    >\n  MOVE ENTER\n  <p style=\"background-color:black\">A paragraph</p>\n</div>\n\
    ```\n\n```javascript\nvar el = document.getElementById('moveover');\nvar a = 0;\n\
    var b = 0;\nvar counter = document.getElementById('counter');\n\nel.onmouseover\
    \ = function(){\n  counter.innerHTML = a+1;\n}\n\nvar el1 = document.getElementById('moveenter');\n\
    \nel1.onmouseenter = function(){\n  counter.innerHTML+=a+1;\n}\n```\n\nIn the\
    \ above example you'll notice that if you move over the MOVE ENTER div it only\
    \ increments the counter once you've moved, however if you move into the MOVE\
    \ OVER div every time you move over the counter element. This is a subtle difference\
    \ between the two events and you'll need to be careful in handling the right event\
    \ to avoid any mistakes.\n\nSimilar to these are the `onmouseleave` and the `onmouseout`\
    \ event except that `onmouseleave` is fired when the mouse leaves the element\
    \ itself, while the `onmouseout` event is fired when the mouse moves out of the\
    \ element or child element. We can rewrite the above JavaScript to demonstrate\
    \ this:\n\n```javascript\nvar el = document.getElementById('moveover');\nvar a\
    \ = 0;\nvar b = 0;\nvar counter = document.getElementById('counter');\n\nel.onmouseover\
    \ = function(){\n  counter.innerHTML = a+1;\n}\n\nel.onmouseleave = function(){\n\
    \  counter.innerHTML = a-1;\n}\n\nvar el1 = document.getElementById('moveenter');\n\
    \nel1.onmouseenter = function(){\n  counter.innerHTML+=a+1;\n}\n\nel1.onmouseout\
    \ = function(){\n  counter.innerHTML = a-1;\n}\n```\n\nRun the code and you can\
    \ see that if you leave the MOVE OVER div it decrements the counter just once\
    \ you've moved, however if you move out of the MOVE ENTER div it decrements the\
    \ number of times you move in and out of the div and its child element the paragraph.\n\
    \n### Every button fires!\n\nIt’s not just the mouse whose events are captured\
    \ but also the keyboard. Any of the keys you press on your keyboard can have a\
    \ specific event handler registered to it. There are three events associated with\
    \ the keyboard namely:\n\n1.  `onkeydown`\n2.  `onkeypress`\n3.  `onkeyup`\n"
  raw: 'Events take place on elements, and are executed by the user in a myriad of
    ways.


    Before we go further we need to look at the various different events we have in
    JavaScript and how they are grouped.


    ## Events - Don''t Mouse around!


    The most basic form of interaction in HTML is the a tag. It’s a simple link to
    a different page or resource. However all DOM elements are able to respond to
    just about any kind of event. The majority of all events expected would definitely
    be via the mouse or cursor. Hence all events relative to DOM elements are based
    on user actions with the mouse.


    Let’s make a simple example of an event handler here within HTML itself


    <a href="http://www.yahoo.com" onclick="return false;">Click</a>


    Put that in your HTML file and try to click on the link. For some reason it won''t
    work. If you look at the code you''ll realize that we''ve added an onclick attribute
    to the element. onclick actually corresponds to the users click action, and the
    contents of this attribute is pure JavaScript. This bit of code merely returns
    the boolean value false. Returning false to a click handler basically means don''t
    do anything. And that is what we''ve done here. Let’s modify that a bit


    <a href="http://www.yahoo.com" onclick="return confirm(''Are you sure?'');">Click</a>


    Run that and now click, you''ll get a confirmation, if you respond with affirmative
    it redirects because you passed it a true value, and if you choose the otherwise
    it doesn''t redirect because you''ve passed to it false. This is a very simple
    way of coding in an event handler. But what if we needed to do this for more than
    one link?


    <a href="http://www.yahoo.com" onclick="return confirm(''Are you sure?'');">Click</a>


    <a href="http://www.google.com" onclick="return confirm(''Are you sure?'');">Click</a>


    <a href="http://www.bing.com" onclick="return confirm(''Are you sure?'');">Click</a>


    This is pretty monotonous. What we can do is put our JavaScript into a function
    and call that function.


    function doConfirm(){


      return confirm(''Are you sure?'');


    }


    <a href="http://www.yahoo.com" onclick="doConfirm()">Click</a>


    <a href="http://www.google.com" onclick="doConfirm()">Click</a>


    <a href="http://www.bing.com" onclick="doConfirm()">Click</a>


    Much better but again we need to make a call to each function - let’s put all
    the code to handle the even in JavaScript here.


    var a = document.getElementsByTagName(''a'');


    for(var i = 0; i< a.length; i++){


      a[i].onclick = function(){


        return confirm(''Are you sure?'');


      }


    }


    <a href="http://www.yahoo.com">Click</a>


    <a href="http://www.google.com">Click</a>


    <a href="http://www.bing.com">Click</a>


    Definitely much better, as you can see we''ve selected all the a elements and
    assigned the individual onclick events a function. The HTML is clean and we don''t
    have any intermixing of JavaScript and HTML.


    Note: Keep you HTML and JavaScript separate


    This is one example using the onclick event. Also understand that it’s not just
    the a link tag that responds to an onclick event. Any element you have can respond
    to an onclick event. Let’s try this with a paragraph and use some css to give
    the paragraph a background color so we know what we''re clicking on.


    <p id="clickable" style="background-color:yellow">


    You can click on me


    </p>


    document.getElementById(''clickable'').onclick = function(){


      return alert(''Hi!'');


    }


    Just click on the paragraph and voila you get an alert pop up. This is all well
    and interesting, however consider the following example JavaScript with the same
    html:


    document.getElementById(''clickable'').onclick = function(){


      this.style.backgroundColor = ''red'';


    }


    Click the paragraph and you see the color changes. What just happened and how?
    In the above JavaScript we''ve introduced the this keyword. We used it when working
    with classes to declare class properties and methods and it refers to the current
    object itself. In this case it was a reference to the clickable paragraph object
    and made reference to its style. The event handler merely changed the color of
    the objects background on click. Already you can see the possibilities with the
    events in JavaScript.


    Let’s take a look at another event namely the dblclick event. This captures a
    double click from the mouse. Let’s modify the above JavaScript so on click the
    background color changes to red and on double click it changes to yellow.


    var el = document.getElementById(''clickable'');


    el.onclick = function(){


      this.style.backgroundColor = ''red'';


    }


    el.ondblclick = function(){


      this.style.backgroundColor = ''yellow'';


    }


    You can click like crazy now and see the colors change. Just as we have the click
    and double click events we also have a host of other mouse events that can be
    used such as:


    | Event | description |


    | --- | --- |


    | element.onmousedown | The moment you press a mouse button over an element |


    | element.onmouseenter | Just when the mouse cursor enters an element |


    | element.onmouseleave | Just as the cursor moves out of an element |


    | element.onmousemove | When the mouse moves while it is over an element |


    | element.onmouseover | Like the mouseenter event but also occurs if you move
    the mouse over any child elements of the element |


    | element.onmouseout | Like mouseleave - only it also works if you move out of
    any child element of the element |


    | element.onmouseup | After you click just as you leave the mouse button on an
    element |


    The onmouseenter and the onmouseover seem pretty much the same but have subtle
    differences. We''ll demonstrate it with a demo here. Chalk up the following HTML.


    <div id="counter">0</div>


    <div id="moveover" style="background-color:red;">


    MOVE OVER


    <p style="background-color:black;"> A paragraph </p>


    </div>


    <div id="moveenter" style="background-color:red;">


    MOVE ENTER


    <p style="background-color:black;"> A paragraph</p>


    </div>


    var el = document.getElementById(''moveover'');


    var a = 0;


    var b = 0;


    el.onmouseover = function(){


    document.getElementById(''counter'').innerHTML=a+1;


    }


    var el1 = document.getElementById(''moveenter'');


    el1.onmouseenter = function(){


    document.getElementById(''counter'').innerHTML+=a+1;


    }


    In the above example you''ll notice that if you move your cursor over the MOVE
    ENTER div it only increments the counter once, however if you move into the MOVE
    OVER div every time you move over the div as well as the contained black paragraph
    you''ll notice the counter is incremented i.e the event is fired. This is a subtle
    difference between the two events and you''ll need to be careful in handling the
    right event here to avoid any possible mistakes.


    Similar to these are the onmouseleave and the onmouseout event except that onmouseleave is
    fired when the mouse leaves the element itself, while the onmouseout event is
    fired when the mouse moves out of the element or any child element. We can rewrite
    the above JavaScript to demonstrate this:


    var el = document.getElementById(''moveover'');


    var a = 0;


    var b = 0;


    var counter = document.getElementById(''counter'');


    el.onmouseover = function(){


      counter.innerHTML = a+1;


    }


    el.onmouseleave = function(){


      counter.innerHTML = a-1;


    }


    var el1 = document.getElementById(''moveenter'');


    el1.onmouseenter = function(){


      counter.innerHTML+=a+1;


    }


    el.onmouseout = function(){


      counter.innerHTML = a-1;


    }


    Run the code and you can see that if you leave the MOVE OVER div it decrements
    the counter just once you''ve moved, however if you move out of the MOVE ENTER
    div it decrements the number of times you move in and out of the div and its child
    element the paragraph.


    This is a very simple example to demonstrate the differences between the mouse
    events and how they are fired.


    ## Every button fires!


    It’s not just the mouse whose events are captured but also the keyboard. Any of
    the keys you press on your keyboard can have a specific event handler registered
    to it. There are three events associated with the keyboard namely:


    1.  onkeydown


    2.  onkeypress


    3.  onkeyup'
