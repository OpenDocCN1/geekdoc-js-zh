    ## Validate Validate and Validate again


    This is a pretty useful application you''ve just built. But its very error prone,
    we need to make sure that the information entered is valid to begin with. To start
    with we need to make sure that the name, city and address fields are not empty.
    We could put all this validation logic in the form''s handler, but that goes against
    the idea of object oriented programming. Shouldn''t the user object be the one
    to tell us whether the information provided to it was valid or not? Makes a lot
    of sense now that you think of it, let’s then add a simple function to the user
    object declaration that checks if all the above three fields are not empty. It
    returns a boolean value indicating whether the user object created is valid or
    not. If the object is valid then we''ll append it to the list, if not, we''ll
    alert with an error message.


    Add the following in your user object:


      this.isValid = function(){


        errors = [];


        if(this.name.trim() == ''''){


          errors.push(''Name is required'');


        }


        if(this.city.trim() == ''''){


          errors.push(''City is required'');


        }


        if(this.address.trim() == ''''){


          errors.push(''Address is required'');


        }


        if(errors.length > 0){


          alert(errors.join('',''));


          return false;


        }else{


          return true;


        }


      }


    This is a simple function that checks if the listed properties are not empty.
    An invalid element would result in a boolean false and a nasty alert message.
    Make the following adjustment to your form handler:


    frm.onsubmit = function(){


      var usr = new user(document.getElementById(''name'').value);


      ul =  document.getElementById(''ourList'');


      usr.setDob(day.options[day.selectedIndex].value, month.options[month.selectedIndex].value,
    year.options[year.selectedIndex].value);


      usr.setAddress(document.getElementById(''address'').value);


      usr.setCity(document.getElementById(''city'').value);


      if(usr.isValid()){  // if usr.isValid returns true then add it to the list


        theList.add(usr, ul);


      }


      return false;


    }


    Run the code again, try to add some incomplete entries. You should be greeted
    with an error message. Now you''ve implemented some sort of validation in your
    form. And all of this is handled straight in the browser using nothing but good
    old JavaScript and plain HTML.


    ## Conclusion


    This exercise in itself is a powerful example of what you can do with JavaScript.
    There is a whole lot more than can be covered, a lot of possibilities with JavaScript
    that we''ve hardly even scratched the surface of. But hopefully after going through
    this book, at this stage you''re at a level where you now can confidently code
    using native JavaScript. The concepts you have learnt in this book cover the basic
    foundation upon which advanced concepts are based.


    As you start programming you''ll come across numerous libraries that really speed
    up the work and can accomplish a lot more in a single line of code than could
    have been done with the native JavaScript that we''ve studied. Point being is
    that once you know how to use the basics, you''ll definitely have a greater appreciation
    for how new JavaScript libraries make even basic JavaScripting a whole lot easier.


    The exercises in this book aren''t a one off, there is lots of practice involved
    in becoming a good programmer. You''ve outgrown your training wheels and now you''re
    more than ready to take on actual projects and learn as you work.


    This book has found you because you are at the brink of everything fantastic!


    Thanks for reading!


