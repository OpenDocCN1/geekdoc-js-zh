  trans: "\n\n```javascript\ndocument.write(pets[i] + '<br/>'); // 在新行打印元素\n\n}\n\n\
    // while 循环\n\nvar i = 0;\n\nwhile( i < pets.length ){\n  document.write(pets[i]\
    \ + '<br/>'); // 在新行打印元素\n  i++;\n}\n\n// do while 同样好用\n\nvar i = 0;\n\ndo{\n\
    \  document.write(pets[i] + '<br/>'); // 在新行打印元素\n  i++;\n}while( i < pets.length\
    \ )\n```\n\n在上面的示例中，我们使用三种不同的循环执行了相同的操作。然而，JavaScript 还提供了另一种用于遍历数组和对象（objects）的特殊循环，称为\
    \ `for..in` 循环。它的工作方式与其他循环非常相似，不同之处你并不真的需要使用变量来迭代循环，而是完全依赖于它正在遍历的 `Array` 或 `Object`\
    \ 来决定何时停止循环。\n\n```javascript\nvar pets = ['dog', 'cat', 'hamster', 'bird', 'rabbit',\
    \ 'turtle', 'goldfish'];\n\n// for in 循环\n\nfor(i in pets){ // i 是每次迭代时数组的索引\n\
    \  document.write(pets[i] + '<br/>'); // 在新行打印元素\n}\n```\n\n上面的循环功能与其他循环完全相同，只是这次迭代器\
    \ `i` 在迭代迭代时获取的是数组的索引。当我们在下一节处理 `Objects` 时，就会体会此函数的实际意义。\n\n## 数组排序 (Sorting\
    \ arrays)\n\n你经常会希望能够对数组中的元素进行排序。这就像在学校游行中让孩子们按从矮到高排队一样自然。对于数组排序，JavaScript 提供了\
    \ `sort` 函数，它对带有文本数据的数组效果良好。\n\n```javascript\nvar pets = ['dog', 'cat', 'hamster',\
    \ 'bird', 'rabbit', 'turtle', 'goldfish'];\n\npets.sort() // 现在等于 ['bird', 'cat',\
    \ 'dog', 'goldfish','hamster', 'rabbit', 'turtle' ];\n```\n\n除了 `sort` 命令外，JavaScript\
    \ 还提供了 `reverse` 函数来完全反转数组中元素的顺序。\n\n```javascript\nvar pets = ['dog', 'cat',\
    \ 'hamster', 'bird', 'rabbit', 'turtle', 'goldfish'];\n\npets.sort() // 现在等于 ['bird',\
    \ 'cat', 'dog', 'goldfish','hamster', 'rabbit', 'turtle' ];\n\npets.reverse()\
    \ // 现在等于 [ 'turtle','rabbit','hamster','goldfish','dog', 'cat', 'bird'];\n```\n\
    \n这运行起来非常棒，让我们尝试用一个带有数值的数组：\n\n```javascript\nvar a = [10, 3, 2];\n\na.sort()\
    \ // 现在等于 [10, 2, 3]; 咦？\n```\n\n这是怎么发生的？`sort` 函数不知道怎么计数吗？`sort` 函数实际上是按字母顺序排序的，它将数组中的所有元素视为字符串而不是数字。因此，作为字符串，'10'\
    \ 在 '2' 之前，因为数字 '1' 被认为在 '2' 之前——在这种语境下，'10' 的数值被忽略了。为了解决这个问题，`sort` 函数接受一个整个函数作为参数进行比较（是的，你也可以将函数作为参数传递\
    \ - JavaScript 不是很奇妙吗）。这个比较函数将接受两个参数，这两个参数符合要与其他值进行比较的值。只需声明 `sort` 函数就会在每次比较数组中的两个值时调用此函数。通过此函数，你可以定义如何实际排序数组，只要该函数返回负值、正值或零即可。让我们来看一个数值比较的示例：\n\
    \n```javascript\nvar a = [10, 3, 2];\n\na.sort(function(x, y){return x-y});\n\
    ```\n\n在上面的示例中，我们传递了一个从第二个元素减去第一个元素的函数。如果第一个元素大于第二个元素，如下所示——返回的值将是正数，因此该元素的位置会被较低的元素替换。这会将元素按数值从低到高进行排序。相同的函数可以稍微修改以实现从高到低的排序：\n\
    \n```javascript\nvar a = [10, 1, 2];\n\na.sort(function(x, y){return y-x});\n\
    ```\n\n## 搜索 (Search search)\n\n数组有多个元素，我们需要一种找到特定元素的方法。我们可以始终遍历数组并检查特定元素是否存在。这是一个使用函数说明此点的示例。\n\
    \n```javascript\nfunction findInArray(needle, haystack){\n  for(var i = 0; i <\
    \ haystack.length; i++){\n    if(haystack[i]==needle){\n      return i;\n    }\n\
    \  }\n  return -1;\n}\n```\n\n```javascript\nvar a = [10, 3, 2];\n\nfindInArray(a,\
    \ 3); // 等于 1\nfindInArray(a, 1); // 等于 -1\n```\n\n上面的示例只是遍历数组，如果找到了元素则返回数组索引。数组永远没有负索引，这就是为什么上面的函数在循环完成且未返回（即未找到元素）时返回负值。然而，你真的不需要在\
    \ JavaScript 中自己编写搜索函数，因为 JavaScript 已经提供了数组方法来查找元素的索引，它的工作方式与上面的函数非常相似。这就是 `indexOf`\
    \ 函数。\n\n```javascript\nvar pets = ['dog', 'cat', 'hamster', 'bird', 'dog', 'goldfish'];\n\
    \npets.indexOf('cat'); // 返回 1\npets.indexOf('dog'); // 返回 0\npets.indexOf('snail');\
    \ // 返回 -1\n```\n\n在上面的示例中，我们看到 `indexOf` 返回目标元素第一次出现的索引。这就是为什么它不返回 'dog' 最后一次出现的索引的原因。要从末尾搜索数组——我们使用\
    \ `lastIndexOf` 函数，它是 `indexOf` 函数的反向变体。\n\n```javascript\nvar pets = ['dog',\
    \ 'cat', 'hamster', 'bird', 'dog', 'goldfish'];\n\npets.indexOf('dog'); // 返回\
    \ 0\npets.lastIndexOf('dog'); // 返回 4\n```\n\n`indexOf` 函数还接受第二个参数，即开始搜索的索引。默认情况下是零，因为函数从数组中的第一个元素开始搜索。让我们看看它是如何工作的：\n\
    \n```javascript\nvar pets = ['dog', 'cat', 'hamster', 'bird', 'dog', 'goldfish'];\n\
    \npets.indexOf('dog'); // 返回 0\npets.indexOf('dog', 2); // 返回 4\n```\n\n在上面的示例中，我们告诉\
    \ `indexOf` 函数从索引 '2' 开始搜索 'dog'。\n\n## 总结 (Summary)\n\n*   我们接触了 JavaScript 数组以及允许我们处理数组的许多不同函数。\n\
    *   我们使用了 `sort` 函数对数组排序。\n*   我们理解了可以使用概念和 join 函数来连接和合并数组。\n*   我们学习了可以使用方括号创建数组，或者使用\
    \ `new` 关键字创建一个 `Array` 对象。\n*   我们学习了如何从数组中添加和删除元素。\n*   我们还学习了如何在循环中使用数组以及如何遍历数组。\n\
    \n## 作业 (Assignment)\n\n### 练习 1\n\n考虑以下数组 `[12, 67,22,12,10,6,8]`。使用自定义函数对数组进行排序——不要使用\
    \ `sort` 函数。\n\n### 练习 2\n\n在以下数组 `pets = ['dog', 'cat', 'hamster', 'bird', 'dog',\
    \ 'goldfish'];` 中\n\n从用户获取输入并在数组中搜索用户的输入。找到后，从数组中删除该元素并提示用户输入另一个值——继续此操作，直到用户输入一个不在数组中的值，或者所有数组元素都被删除完毕。\n\
    \n### 练习 2\n\n在以下数组 `pets = ['dog', 'cat', 'hamster', 'bird', 'dog', 'goldfish',\
    \ 'dog', 'bird'];` 中\n\n编写一个函数移除上述数组中的所有重复元素，并创建一个包含重复元素的新数组。\n\n# 第 7 章：对象 -\
    \ 一切都是对象！\n\n"
- fmt: "\nWe'll touch upon the basic concepts of Object Oriented Programming, what\
    \ constitutes an object and the benefits of the Object Oriented approach. We will\
    \ also understand how JavaScript treats Objects and be made aware of the objects\
    \ we have been using until this time. During this chapter we'll construct a simple\
    \ Object that illustrates the concepts of Object Oriented programming, note this\
    \ chapter doesn't aim to be a full-fledged course in Object Oriented Development\
    \ as the scope of Objected Oriented Development is very vast and cannot be covered\
    \ in this book. Hence we would be limiting to basic usage and understanding of\
    \ key concepts.\n\n# What’s an object?\n\nLiterally speaking just about everything\
    \ in existence is an object. Let’s not think programming here, let’s think in\
    \ terms of everything around us. A car is an object, it has specific properties\
    \ and it has certain functions. Similarly your computer is an object it has certain\
    \ properties and can perform specific functions. Likewise your cell phone, toaster,\
    \ sandwich maker, television - etc. In vanilla plain terms, these are all Objects.\n\
    \nHow does that translate to programming logic? So far we've been developing using\
    \ functions and variables. However as in real life it’s a fact that all objects\
    \ perform functions that are directly associated to them. A car has a motor and\
    \ moves, it isn't used for toasting a sandwich. Likewise you don't tell the weather\
    \ by talking to a toaster. In programming terms think of an Object as a special\
    \ block of code that has properties and methods or in this case Variables and\
    \ functions.\n\nBefore you use an Object you need to create one. To create an\
    \ Object we need to define what is known as a class.\n\n# Classes and Objects.\
    \ What’s the difference?\n\nIn really blunt terms an Object is an instance of\
    \ a class. A class can be looked upon as the blueprint upon which an object is\
    \ made. It is a block of code with functions and properties. When you define a\
    \ class and then create an Object from that class the Object gets its own set\
    \ of properties and methods. Think of it like a manufacturing plant where cars\
    \ are manufactured. The blueprints to build a car can be assumed to be the class\
    \ and every individual car that comes out of production is an instance of that\
    \ class. Don't worry creating Objects won't require you to build a manufacturing\
    \ plant, but you will need a blueprint i.e. class.\n\nInterestingly we've used\
    \ a number of Objects and classes all this time without even knowing it. Recall\
    \ in the last chapter on arrays where we created an array with the following statement:\n\
    \n```\nvar a = new Array();\n```\n\nIn the above example `Array` is a JavaScript\
    \ class that defines an array Object. The `new` keyword creates an instance of\
    \ the `Array` class. So in the above example the variable `a` is an object of\
    \ the class `Array` and thus has all the methods and properties of the `Array`\
    \ class. Just like every car that is built as per a blueprint has its own set\
    \ of four wheels and engine.\n\nWe have also used methods of the array object\
    \ in our previous chapter. Some methods we used were:\n\n```javascriptvar a =\
    \ new Array();\na.sort();\na.join(',');\na.shift();\n```\n\nAnd not only that\
    \ but we also made use of a property of the array object namely:\n\n```javascript\n\
    var a = new Array();\na.length // length property\n```\n\nMethods and properties\
    \ are defined within the class and can be accessed from the object of the class.\
    \ And that is what we did in the earlier chapters. Even prior to that we made\
    \ use of an Object that was already available to us from the very first chapter.\
    \ The `document` Object:\n\n```javascript\ndocument.write('hi');\n```\n\nNote\
    \ the document object is an object made available in JavaScript, it’s not a class\
    \ but an object and it refers to the page in the browser. The `write` method we\
    \ used is a method of the document object. Things are starting to get clearer\
    \ already. We've had a small taste of how we can use Objects and how we've been\
    \ using Objects for quite a hile now. Let’s get down to understanding how they\
    \ work and how we can make our own Objects.\n\n# A Simple Object\n\nLet’s make\
    \ our very first Object. Creating an Object is very simple in JavaScript.\n\n\
    ```javascript\nvar dog = { name:'Fido', breed:'Bulldog', age:2};\n```\n\nThis\
    \ looks a bit similar to declaring an array. The main difference is that at its\
    \ simplest form an Object is technically a non-numerically indexed array. Arrays\
    \ have only numerical indexes while an Object is not numerically indexed. What\
    \ looks like indexes are actually called properties? The above example can also\
    \ be split over several lines - line breaks don't bother objects.\n\n```javascript\n\
    var dog = {\n    name:'Fido',\n    breed:'Bulldog',\n    age:2\n};\ndog.name;\
    \ // equals Fido\ndog.breed; // equals Bulldog\n```\n\nAn alternative to creating\
    \ an Object is by using the JavaScript `new` keyword to create a new `Object`.\n\
    \n```javascript\nvar dog = new Object();\ndog.name ='Fido';\ndog.breed ='Bulldog';\n\
    dog.age = 2;\n```\n\nThe above code is just the same as the preceding example.\
    \ Although for simpler objects the preceding example is easier to read and is\
    \ a preferred way of declaring simple Objects.\n\nAnother way to declare Objects\
    \ is by using what in JavaScript is called an Object constructor or the equivalent\
    \ of a class in Object Oriented terminology. This is a special declaration which\
    \ allows you to define a blue print that would define all the objects created\
    \ from it. For instance in the above examples we declared an object for a single\
    \ dog. What if we wanted to declare the same for more than one dog? We could explicitly\
    \ use the same declaration for each and every dog object.\n\n```javascript\nvar\
    \ dog1 = { name:'Fido', breed:'Bulldog', age:2};\nvar dog2 = { name:'Rover', breed:'Wolfhound',\
    \ age:3};\nvar dog3 = { name:'Butch', breed:'Dashdung', age:2};\nvar dog4 = {\
    \ name:'Mitch', breed:'Sheepdog', age:2};\nvar dog5 = { name:'Bowser', breed:'Alsatian',\
    \ age:2};\n```\n\nThat is very redundant and highly prone to error. We're creating\
    \ the same kind of Object here - so it makes sense to use an Object constructor\
    \ or a class that defines the blueprint of the Object. In this case the class\
    \ constructor would define the properties namely name, breed and age so we don't\
    \ have to explicitly define them every time we want to create a dog object. Let’s\
    \ see a demonstration.\n\n```javascript\nfunction dog(name, breed, age) {\n  \
    \  this.name = name;\n    this.breed = breed;\n    this.age = age;\n}\n\nvar fido\
    \ = new dog(\"Fido\", \"Bulldog\", 3);\nvar rover = new dog(\"Rover\", \"Wolfhound\"\
    , 2);\n```\n\nThat is quite a lot happening there, but we can see clearly how\
    \ much easier it is to create new dog Object with our object constructor function\
    \ `dog`. This kind of function is called a constructor because it creates and\
    \ initializes the properties of the Object on 'construction' of it. You have also\
    \ noticed the use of a new keyword called `this`. The `this` keyword is used within\
    \ the context of an Object. It’s used only within the class definition and refers\
    \ to the Object itself.\n\nIt comes into existence when the Object is created.\
    \ So `this.name` is the name variable of the Object that was created using the\
    \ above class constructor. In the above example you can see the difference between\
    \ `this.name` and `name` passed to the constructor function where `this.name`\
    \ refers to the objects instance of the name variable. When creating an Object\
    \ in this fashion we can access the properties in the same way as we accessed\
    \ the properties of objects created earlier.\n\n```javascript\nvar fido = new\
    \ dog(\"Fido\", \"Bulldog\", 3);\nfido.name; //equal 'Fido'\n```\n\nWith an Object\
    \ constructor you can create as many objects as you want of the same type defined\
    \ by the Objects constructor.\n\nYou can also create an object property even after\
    \ you have created an Object. This is done by simply assigning the new value of\
    \ the object itself:\n\n```javascript\nvar fido = new dog(\"Fido\", \"Bulldog\"\
    , 3);\nfido.gender = 'male';\n```\n\nThis is both a boon as well as a bane to\
    \ JavaScript as while you have the luxury of editing objects at will, it does\
    \ get complicating if your objects can be so easily manipulated.\n"
