  md: '# 74 .NET for Visual FoxPro Developers


    Enumerations are a convenience feature of C# that allow you to group related integer-based
    constants together. You can think of them as an array of constants. There is no
    Visual FoxPro equivalent to enumerations, but it''s easy to see how they can be
    very useful.


    The following code lists a group of constant definitions found in the FoxPro.h
    include file (located in the Visual FoxPro home directory). These constants define
    all the possible values for a VFP cursor''s "Buffering" setting:


    ```

    #DEFINE DB_BUFFOFF 1

    #DEFINE DB_BUFLOCKRECORD 2

    #DEFINE DB_BUFFOPTRECORD 3

    #DEFINE DB_BUFFLOCKTABLE 4

    #DEFINE DB_BUFFOPTABLE 5

    ```


    When you use one of these constants in a command, such as CursorProp(), you often
    have to open up the FoxPro.h file to see what the possible values are. Here''s
    where enumerations can help.


    In C#, you can define an enumeration that groups together all the possible values
    for the Buffering setting:


    ```

    public enum Buffering{

    BuffOff = 1,

    BuffLockRecord = 2,

    BufOptRecord = 3,

    BufLockTable = 4,

    BufOptTable = 5

    }

    ```


    You access an enumeration by referring to its name and specifying the desired
    member. The compiler converts it to its associated integer value:


    Buffering.BufOptRecord


    As shown in Figure 3, enumerations hook into VS.NET IntelliSense. When you type
    the name of the enumeration and a period, IntelliSense shows you a list of all
    possible values in the enumeration.


    ```

    public class EnumerationTest

    {

    Buffering.

    }

    ```


    ![](bbox=[0.335, 0.805, 0.515, 0.905])


    Figure 3. Enumerations hook into VS.NET IntelliSense, making it easy to select
    the proper value from a qualified list.'
