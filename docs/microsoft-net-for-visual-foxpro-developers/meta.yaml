    # Setting a Filter


    When you view the Online Community, Headlines, and Downloads panes, you can set
    a filter to limit how much information is shown (**Figure 2**). This filter is
    persisted between .NET sessions. If you set the filter on a language, I recommend
    that you select the language “and related” filter (for example, “Visual C# and
