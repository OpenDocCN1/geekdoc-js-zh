    **Figure 3.** Unmanaged code runs outside of the .NET common language runtime


    +   - Unsafe code is different than unsafe code. For information about unsafe
    code, see Chapter 3, “Introduction to C#”.


    # # Assemblies


    In Visual FoxPro, depending on the type of project you compile, the resulting
    code is stored in an APP, EXE, or DLL file. In .NET, Windows Forms and Console
    projects are compiled into EXE files that contain MSIL; Web Forms, Web Services
    and Class Library projects (including Windows Control libraries) are compiled
    into DLLs that contain MSIL. The resulting EXE and DLL files are referred to as
    *assemblies*.


    An assembly is the primary building block of a .NET application. The term assembly
    is a logical rather than physical designation, although an assembly is usually
    comprised of a single file, it can also be comprised of one or more files (**Figure
    4**).


    Multi-file assemblies allow you to break up an assembly into smaller units that
    are easier to maintain and are a smaller size for downloading. It also allows
    you to create a single assembly that is comprised of components built in multiple
    languages.


    # # Assembly


    ![](bbox=[0.095, 0.725, 0.805, 0.883])


    **Figure 4.** A single assembly can be comprised of one or more physical files.'
