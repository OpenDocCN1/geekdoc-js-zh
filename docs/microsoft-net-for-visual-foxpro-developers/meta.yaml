  md: "# Chapter 5: Object Orientation in C# and Visual Basic.NET 131\n\nHere's scenario\
    \ in C#:\n\n```\nHideMethodBase HideBase = new HideMethodMessage();\nHideBase.DisplayMessage();\n\
    ```\n\nAnd in Visual Basic .NET:\n\n```\nDim HideBase As HideMethodBase = New\
    \ HideMethodDemo()\nHideBase.DisplayMessage()\n```\n\nWhen you run this code,\
    \ rather than calling the DisplayMessage method belonging to the HideBase class\
    \ instead, it calls the DisplayMessage method belonging to the HideMethodDemo\
    \ class instead! This is the opposite of the behavior you might expect, so you\
    \ need to write code with this in mind.\n\nAnother good example of a scenario\
    \ where you can have an inherited method involves third-party .NET components.\
    \ When you purchase a third-party component, subclass it, and add a custom method\
    \ called PrintMessage. What happens if the company who created the component releases\
    \ a new version and adds their own PrintMessage method? This leaves you with two\
    \ choices. You can rename your custom method, but you may have countless lines\
    \ of code in your applications calling the PrintMessage method and they all need\
    \ to change.\n\nAnother option is to hide the newly inherited method causing the\
    \ problem. You can then add a custom method to your subclass that calls it in\
    \ the base class. Here's solution shown in C#:\n\n```\npublic class MyBaseClass\n\
    {\n    public virtual void PrintMessage()\n    {\n        MessageBox.Show(\"Printing\
    \ message!\", \"Hide method demo\");\n    }\n}\n```\n\n```\npublic class HideMethodDemo\
    \ : MyBaseClass\n{\n    // Hide the PrintMessage method in the base class\n  \
    \  public new void PrintMessage()\n    {\n        MessageBox.Show(\"Hiding the\
    \ inherited method!\", \"Hide method demo\");\n    }\n\n    // Create a custom\
    \ method that calls the base class method\n    public void PrintMsg()\n    {\n\
    \        base.PrintMessage();\n    }\n}\n```"
