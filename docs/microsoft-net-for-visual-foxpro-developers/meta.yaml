    # Weak Typing vs. Strong Typing


    While VB .NET is a strongly typed language, C# is a more strongly typed language.
    The difference is in C# you must declare all variables and their types before
    using them. In VB .NET, this is optional.


    # Option Explicit and Option Strict


    VB .NET has two settings that specify how the compiler treats variables—Option
    Explicit and Option Strict.


    The Option Explicit setting specifies whether you can use undeclared variables—not
    just undeclared variables, but the variable itself. By default, the Option Explicit
    is “Off”, which allows you to use variables without declaring them. When Option
    Explicit is “On”, VB .NET acts like C# by forcing you to declare all variables
    before using them.


    > Having the flexibility of being able to turn off variable declaration checking
    may seem like a “plus”, it’s actually not. You should always turn Option Explicit
    “On” so the compiler will catch the use of undeclared variables. If Option Explicit
    is “Off”, the compiler won’t catch variable names with typos resulting in unpredictable
    behavior at runtime.


    Even when Option Strict is “On”, Basic .NET differs from C# when it comes to using
    variables. In C#, you must initialize a variable''s value before using it. (VB
    .NET sets all variables to a default value when you declare). Depending on whether
    you’re an advocate of compiler enforcement or flexibility you can argue this is
    a good or a bad thing!


    The Option Strict setting specifies whether the compiler enforces strict typing.
    If Option Strict is “Off” (the default), the compiler does not require you to
    specify a type when you declare a variable. If Option Strict is “On”, VB .NET
    acts like C#, forcing you to declare the type of all variables. Option Strict
    also checks how much the compiler performs when converting between different variable
    types. If Option Strict is “Off”, no type conversion warnings are you of any that
    may result in a loss of data. For example, if Option Strict is “On” when you copy
    the value of a Long into an Integer, the compiler complains because a Long variable
    holds larger values than can fit in an Integer. However, if you do the opposite
    (copy the value of an Integer into a Long), the compiler does not complain.


    ![](bbox=[0.088, 0.945, 0.135, 0.97])'
