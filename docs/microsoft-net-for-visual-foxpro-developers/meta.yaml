    In this code, the value passed in the constructor is used to initialize the value
    of a private field. If you don''t explicitly declare a constructor, a default
    constructor is automatically provided.


    Here is an example of passing a value to the constructor of a class when it is
    instantiated. In C#:


    ```

    ConstructorDemo ConstructorDemo = new

    ConstructorDemo("server=local);uid=pwd;database=NorthWind;");

    ```


    And in Visual Basic:


    ```

    New ConstructorDemo("server=local);uid=pwd;database=NorthWind;")

    ```


    With other methods, you can also create overloaded constructor methods. Based
    on the parameters you pass when instantiating a class, the appropriate constructor
    is called.


    # Destructor methods


    Visual FoxPro classes have a Destroy method that executes when an object is released.
    Typically you place code in this method to perform cleanup of the object. This
    works well because you have control over when an object is destroyed in Visual
    FoxPro.


    In contrast, .NET has something called non-deterministic finalization. This means
    you don''t have control over when an object is destroyed. When the last reference
    to a .NET object is released, the object itself is not released from memory. The
    object is not released until the next time the common language runtime''s garbage
    collector runs (see the "Garbage collection" section in this chapter for details).


    In both C# and Visual Basic, .NET classes can add a Finalize method that executes
    when the object is destroyed. Just remember you can determine when this method
    is executed.


    # Class inheritance


    One key feature of object-orientation is class inheritance, also known as implementation
    inheritance. In C# and Visual Basic, both have single inheritance, meaning a class
    can only have one parent class. In .NET, the term base class is used in place
    of Visual FoxPro''s "parent class". Personally, I prefer the term "parent class"
    because it''s more descriptive and more readily understood.


    # Specifying a base class


    When you define a class in C# or VB.NET, if you don''t specify otherwise, its
    default class is the .NET Framework''s System.Object class. Here is an example
    showing how to specify a base class.'
