    of the first instance, and assigns the first structure variable to the second
    variable. When the last line is executed, it displays a message showing the second
    structure now has the same property values as the first.


    In C#:


    ```

    StructDemo StructDemo1 = new StructureDemo();

    StructDemo StructDemo2 = new StructureDemo();


    StructDemo1.FirstName = "Alexander";

    StructDemo1.MiddleName = "James";

    StructDemo1.LastName = "McNeish";


