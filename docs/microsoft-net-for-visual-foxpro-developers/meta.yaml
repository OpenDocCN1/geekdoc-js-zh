  md: '# The Common Language Runtime


    The Common Language Runtime performs a similar function as Visual Fox’s runtime
    with a few key differences. VisualFoxPro is an interpreted language; executables
    are stored in pseudo-code (p-code) format. When it is executed, p-code is translated
    into machine code by the VisualFox runtime (Figure 1).


    ![](bbox=[0.101, 0.233, 0.506, 0.513])


    Figure 1. The VisualFoxPro runtime translates p-code into machine code at runtime.


    In .NET, code is compiled twice—first into MS Intermediate Language (MSIL) by
    the compiler on your development machine and again at runtime when the code is
    executed by the CLR. As shown in Figure 2, regardless of the language in which
    the source code is written, whether it''s C#, Visual Basic .NET or C++, it''s
    compiled into the same intermediate language. Typically, it''s this intermediate
    language that is distributed to your end users.'
  merge: -1
