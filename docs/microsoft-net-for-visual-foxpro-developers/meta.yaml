    # Creating and installing shared assemblies


    As mentioned in Chapter 1, "Introducing .NET", you can create both private and
    shared assemblies. The main difference between a private and shared assembly is
    where they are physically located. Shared assemblies are stored in the Global
    Assembly Cache, which by default is your <windows directory>assembly folder.


    # Creating a strong name for a shared assembly


    Because a shared assembly is stored in a common Global Assembly Cache, it runs
    the risk of having name collisions with other assemblies. To avoid this, shared
    assemblies are given a unique strong name based on private key cryptography.


    > The details of private key cryptography are beyond the scope of this book. Details
    on this subject, see the .NET help topic "Cryptography Overview".


    There are a few ways you can create a strong name for a shared assembly. The easiest
    method involves three steps.


    First, you need to generate a new public-private key pair and store it in a strong
    key file. The .NET Framework has a Strong Name command-line tool (Sn.exe) that
    can do this for you. To access it, run the following command at the command prompt:


    ```

    sn -k <outfile>

    ```


    Next, to generate the new key pair and store it in a file named keyPair.snk (the
    snk extension for "strong name key"), run the following command:


    ```

    sn -k keyPair.snk

    ```


    Next, you need to reference the strong name key file from the assembly. To do
    this, open up the solution from which the assembly is created in Visual Studio
    .NET. In the Solution Explorer, double-click on the AssemblyInfo.cs or AssemblyInfo.vb
    file to open it for editing.'
  merge: -1
