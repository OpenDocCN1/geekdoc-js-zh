    \ the return value's type and the parameter's types must be explicitly specified.\n\
    This is in keeping with C#'s strongly typed nature. Methods that return nothing\
    \ have a return\ntype of void.\n\n# Declaring variables\n\nVariables declared\
    \ within methods are local variables (there is no other kind). This means they\n\
