  md: "missspelling and typo, nor is it possible to test the source code on every\
    \ permutation of development environment and operating system—and still price\
    \ the book affordably.\n\nOnce printed, bindings break, ink gets smeared, signatures\
    \ get missed during binding. On the delivery side, Web sites go down, packages\
    \ get lost in the mail.\n\nNonetheless, we will make our best effort to correct\
    \ these problems—once you let us know about them.\n\nIn return, when you have\
    \ a question or run into a problem, as you may first consult the errata and/or\
    \ FAQs for your book on our Web site. If you don't find the answer, please e-mail\
    \ us at books@hentzenwerke.com with as much information and detail as possible,\
    \ including 1) the steps to reproduce the problem, 2) what happened, and 3) what\
    \ you expected to happen, together with 4) any other relevant information.\n\n\
    I'd like to stress that we need you to communicate problems and concerns clearly.\
    \ For example...\n\n+   * \"Your downloads don't work\" isn't enough information\
    \ for us to help you.\n get a 404 error when I click on the Download Source Code\
    \ link on www.hentzenwerke.com/book/downloads.html\" is something we can help\
    \ you with.\n* \"The code in Chapter 10 caused an error\" again isn't enough information.\n\
    I performed the following steps to run the source code program DisplayTest.PRG\
    \ in Chapter 10, and I received an answer that said \"Variable m.liCounter not\
    \ found\" is something we can help you with.\n\nWe'll do our best to get back\
    \ to you within a couple of days, either with an answer or at least an acknowledgment\
    \ that we've received your inquiry and we're working on it.\n\nOn behalf of the\
    \ authors, technical editors, copy editors, layout artists, graphical artists,\
    \ indexers, and all the folks who have worked to put this book in your hands,\
    \ I'd like to thank you for purchasing this book, and I hope that it will prove\
    \ to be a valuable addition to your technical library. Please let us know what\
    \ you think about this book—we're looking forward to hearing from you.\n\n> As\
    \ Groucho Marx once observed, “Outside of a dog, a book is a man's best friend.\
    \ Inside of a dog, it's too dark to read\"\n\nWhil Hentzen\nHentzenwerke Publishing\n\
    September 2002"
