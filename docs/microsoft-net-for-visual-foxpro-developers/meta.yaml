  md: 'tremendous amount of resources on a data server and bogs down your application''s
    performance. Freeing up a connection as soon as a transaction completes allows
    your database to serve many more users.


    The architecture of the Internet is inherently disconnected. As you surf the Internet,
    each request you make from your browser (navigating to a different site, requesting
    data, sending data, and so on) makes a brand new connection to the web server,
    rather than maintaining a continuous connection. Although ADO can work in a disconnected
    architecture, ADO is primarily designed for connected data access.


    # Introducing ADO.NET


    Based on the needs of more modern n-tier and Internet architectures, Microsoft
    completely reworked ADO for its .NET initiative, and introduced ADO.NET.


    > When accessing data from Visual FoxPro, you should still use either ODBC or
    ADO, because VFP is not a .NET language. When accessing data from a .NET application,
    you can still use ADO, but it''s far better to use ADO.NET. If you are using C++,
    you can bypass the overhead of both ADO and ADO.NET and use O DB directly.


    Conceptually, ADO and ADO.NET are similar. They both provide universal access
    to relational and non-relational data, however ADO.NET does have a better job!
    ADO.NET is ADO supercharged—in short, it allows you to work with any software
    component on any platform that understands XML.


    # .NET data providers


    .NET data providers are not a single class—they are comprised of a set of classes
    in the .NET Framework optimized for connecting to specific types of data. As of
    this writing, there are four main data providers in .NET:


    +   - SQL Server Managed Data Provider– designed for accessing SQL Server 7.0
    or later. The classes in this provider are all located in the System.Data.SqlClient
    namespace.

    - Oracle Managed Data Provider– designed for accessing Oracle data. The classes
    in this provider are all located in the System.Data.OracleClient namespace.

    - OLE DB Managed Data Provider– designed for accessing any data source available
    by a classic OLE DB provider. The classes in this provider are all located in
    the System.Data.OleDbClient namespace.

    - ODBC Managed Data Provider– designed for accessing native ODBC drivers. The
    classes in this provider are all located in the System.Data.Odbc namespace.


    The SQL Server Managed data provider delivers fast performance because it bypasses
    the overhead imposed by both ADO.NET and OLE DB (See Figure 4). It does this using
    the native protocol of SQL Server—Tabular Data Stream (TDS). If your application
    uses data'
