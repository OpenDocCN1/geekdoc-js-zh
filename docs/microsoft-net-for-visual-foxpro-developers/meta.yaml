    a much fuller list of options linking to check for Visual Studio .NET service
    packs, Windows security and Platform SDK updates, as well as a variety of links
    to web pages (Microsoft) containing information about .NET. You also see a Training
    and Events tab containing links to upcoming .NET training events. Also another
    cool feature is the Tips and Walkthroughs tab that contains links to web-based
    presentations that explain both basic and more advanced .NET concepts.'
