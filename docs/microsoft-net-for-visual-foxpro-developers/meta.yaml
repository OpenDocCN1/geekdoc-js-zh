    # # Do loop


    The Visual Basic .NET Do repeats a block of statements while a condition is true
    or until a condition becomes true. If you use the Do construct, the loop executes
    while a condition is true. If you use the Do Until construct, the loop executes
    until the condition becomes true.

    The While and Until keywords can be used at either the top or bottom of the loop.
    If they are used at the top of the loop, the condition is checked before the loop
    is executed. If they are placed at the bottom of the loop as shown in the following
    example, this means the loop always executes at least once. It is different from
    Visual FoxPro’s DO loop, which only evaluates the condition at the top of the
    loop.


    ```

    Dim Condition As Boolean = False

    Do

    Dim i As Integer = 1

    MessageBox.Show("While loop count " + i.ToString(), _n"...While loop"

    i += 1

    Loop While Condition

    ```


    You exit out of a Do loop at any point by using the Exit Do statement.


    # # For Each loop


    The Visual Basic .NET For Each loop executes a group of statements for each element
    in an array or in a collection. It is equivalent to Visual FoxPro’s FOR command.


    ```

    Dim VersionList, Version As String

    Dim VSNetVersions() As String = {"Standard", "Professional", _n"Enterprise Developer",
    _n"Enterprise Architect"}

    For Each Version In VSNetVersions

    VersionList += "VS .NET " + Version + NewLine

    Next

    MessageBox.Show(VersionList, "ForEach loop")

    ```


    You exit out of a For Each loop at any point by using the Exit For statement.'
