    # Polymorphism and virtual methods


    VisualFoxPro is a weakly typed language, so you do not specify the types of variables.
    You simply declare a variable and instantiate an object. For example:


    ```

    x = CREATEOBJECT("MyClass")

    ```


    As you''ve already seen, when instantiating an object in C# and in Visual Basic
    .NET, you always declare the type of the variable that holds a reference to the
    object (assuming VB.NET''s Option Strict is "On\ For example, the following code
    declares a variable named "ClientObj" of the type Client, and then stores a new
    instance of the Client class into the variable.


    In C#:


    ```

    ClientObj;

    ClientObj = new Client();

    ```


    And in Visual Basic .NET:


    ```

    Dim Client As ClientObj

    ClientObj = New Client()

    ```


    In this example, the code declares a variable of a specific type, and then instantiates
    an object from that type—no surprises here.


    However, in both C# and VB .NET, when you declare a variable of a particular type
    it can also hold a reference to any subclass of that type. Take for example the
    class hierarchy shown in **Figure 5**, which shows Client and Invoice classes
    derived from the ABusiness class.


    ![](bbox=[0.1, 0.715, 0.345, 0.853])


    Figure 5. When you declare a variable of a particular type it can also hold a
    reference to any subclass of that type.'
