  md: "# Concrete methods in abstract classes\n\nC# and VB .NET allow you to have\
    \ both abstract and concrete methods in an abstract class. Why would you declare\
    \ a concrete method in an abstract class? If there is common or default behavior\
    \ you want all classes to inherit, you can create concrete methods containing\
    \ code inherited by all subclasses. A subclass can choose to override a concrete\
    \ method inherited from an abstract class if the default behavior does not suit\
    \ that particular class.\n\n# When to create abstract classes\n\nSo, in what situations\
    \ would you create an abstract base class? You should create an abstract class\
    \ when there are multiple ways to implement application functionality. The application\
    \ settings class just discussed is a good example of this. There are multiple\
    \ ways to implement an application settings class—by storing settings in the Windows\
    \ Registry, an XML file, an INI file, and so on. You can create a concrete class\
    \ for each of these implementations.\n\n# Instantiating concrete subclasses\n\n\
    To make the best of polymorphism with abstract and concrete classes, you should\
    \ write generic code when working with concrete subclasses.\nFor example during\
    \ startup, you might instantiate a concrete AppSettingsRegistry class. For the\
    \ most flexibility, you should declare a field of the type AppSettingsBase and\
    \ an instance of the concrete subclass in this field.\nIn C#:\n\n```\npublic class\
    \ MyApp {\n    public AppSettingsBase AppSettingsObj;\n\n    public MyApp() {\n\
    \        this.CreateAppSettingsObj();\n    }\n```\n\n```\npublic virtual void\
    \ CreateAppSettingsObj() {\n    this.AppSettingsObj = new AppSettingsRegistry();\n\
    }\n```\n\nIn Visual Basic .NET:\n\nPublic Class MyApp\n\n```\nPublic AppSettingsObj\
    \ As AppSettingsBase\n    Public Sub New()\n        Me.CreateAppSettingsObj()\n\
    \    End Sub 'New'\n```"
  merge: -1
