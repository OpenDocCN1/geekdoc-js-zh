  md: '# About the Authors


    # Kevin McNeill


    Kevin is President of Oak Leaf Enterprises - a company that specializes in object-oriented

    custom software, training, and developer tools. He uses Visual FoxPro and the
    new C#.NET

    language as his primary development tools. He is co-author of the book “What’s
    New in Visual

    FoxPro 7”. He has also written articles for CoDe, FoxPro Advisor, and FoxTalk
    magazines.

    Kevin is the creator of The Mere Mortals Framework for .NET and for Visual FoxPro,
    which

    won the Universal Thread’s Members Choice award for “Best Framework”. He has spoken
    at

    many software developer conferences and user groups throughout North America and
    Europe.


    Kevin mentors and trains software companies in building flexible, component-based

    applications that scale from the desktop to the Internet. He has developed a “.NET
    for Visual

    FoxPro Developers” training class specifically designed to help developers leverage
    what

    know about Visual FoxPro when learning about .NET. He is a Microsoft-Certified
    Developer

    and has created many enterprise-wide applications for a wide variety of vertical
    markets.

    Kevin resides in Charlottesville, VA with his wife, Nicole, and three sons.

    e-mail: kevin@oakleafsd.com. Web: www.oakleafsd.com.


    # Cathi Gero


    Cathi Gero, C.P.A., is founder and development director of Prenia Consulting and

    Software Development Corporation. She is a custom software applications developer
    and

    consultant who has worked on database applications since 1986. Cathi is a Microsoft
    Visual

    FoxPro MVP and is an active member of the .NET community. Currently, she is working
    with the

    FoxPro Team at Microsoft as a contractor, working on Visual FoxPro 8. She speaks
    at VFP

