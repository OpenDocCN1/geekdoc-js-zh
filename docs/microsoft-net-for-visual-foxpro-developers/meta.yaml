  md: 'language. On December 13, 2001, the ECMA ratified C# and the Common Language
    Infrastructure (CLI) as international standards. (The CLI is similar to Java''s
    virtual machine—it includes libraries and components that allow C# to run on non-Windows
    operating systems).


    What does this mean for Microsoft and the C# developer? First of all, it means
    that C# and the CLI official standards administered by ECMA, although Microsoft
    retains the right to decide who gets to license the technology. In addition, although
    there are a number of theories stating that Microsoft has done this "just for
    show" (Sun Microsystems submitted their Java programming language to the ECMA,
    pulled it back again), ultimately, it means that you may be able to write programs
    in C# that run on non-Windows operating systems such as Linux, Unix and the Palm—something
    that has been a key feature of Java since its inception. This is similar to the
    capabilities you have today for creating a C++ application for multiple platforms.


