    # Implementing interfaces


    After you have defined an interface, you can specify that one or more classes
    implement the interface. When a class implements an interface, it is agreeing
    to a contract. This contract specifies the class will implement all the properties
    and methods in the interface. For example, there are few classes in the .NET Framework
    library that implement the IDbConnection including SqlConnection, OracleConnection,
    and OleDbConnection. If you look at the help file for these classes, you see each
    of them implement all the properties and methods in the IDbConnection interface.


    What if you want to create a .NET class that connects to Visual FoxPro data? You
    can declare a class and specify that it implements the IDbConnection interface
    in C#:


    ```

    public class VfpConnection : IDbConnection

    {}

    ```


    In Visual Basic


    ```

    Public Class VfpConnection

    Implements IDbConnection

    End Class ''VfpConnection''

    ```


    In C#, you specify a class implements an interface by placing a colon (: IDbConnection)
    at the end of the first line of the class definition. This is similar to the syntax
    for declaring a base class. In Visual Basic .NET, you add the Implements keyword
    and the name of the Interface on a line following the initial line of the class
    definition.


    If you compile this class "as is", the compiler displays ten errors, for each
    member of the IDbConnection interface. The error messages inform you that you
    are not living up to your contract, but you have not declared an implementation
    for each of these members in the VfpConnection class.


    To satisfy the compiler, you must declare a property and method for each of the
    properties and methods in the IDbConnection interface. The following code provides
    a bare bones implementation of each interface member. If you were really creating
    this Visual FoxPro connection class, you would place implementation code in each
    property and method.'
