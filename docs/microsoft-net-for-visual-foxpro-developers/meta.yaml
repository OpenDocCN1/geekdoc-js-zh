  md: 'Chapter 1: Introducing .NET 1


    # # Chapter 1

    Introducing .NET


    Every six or seven years Microsoft makes a quantum leap in technology. In February
    of 2002 that quantum leap was was.NET. What is .NET and what does it mean for
    Visual FoxPro developers? This chapter provides an overview of .NET, the .NET
    Framework and languages, and explains why you should investigate .NET for your
    software development projects.


    .NET burst on the software development scene with lots of fanfare and plenty of
    marketing from Microsoft. In many ways .NET language, C#, a completely revamped
    Visual Basic .NET, and dozens of .NET ports of other languages is a departure
    from previous Microsoft technologies; in other areas the change is more evolution
    than revolution.


    Although there is a new .NET language, ports of other languages including COBOL,
    Visual FoxPro is not a .NET language and Microsoft has told us that it will never
    be for you, as a Visual FoxPro developer? Why, when, and where should you use
    .NET technologies? This chapter helps you to answer these questions.


    # ## What is .NET?


    Originally, Microsoft pitched .NET as, "a platform for building, deploying, running,
    integrating, and consuming Web services". The result was most people thought they
    could only use .NET to build Web applications. In addition, Web services were
    slow to catch on, caused a number of developers to take a wait-and-see approach.
    You can compare this to marketing Visual FoxPro only for its Web services capabilities—although
    you can build Web services with VFP, it is certainly not its primary function.


    After several months Microsoft recognized its marketing error and in August of
    2002, Bill Gates provided an updated definition of .NET: ".NET is software to
    connect information, people, systems, and devices." I think this message is better,
    but I''m not sure it''s clear or specific enough. I think a better explanation—at
    least from a developer''s perspective—is that .NET is Microsoft''s new programming
    model for building desktop, mobile, and Web-based applications.


    # ## What is the .NET Framework?


    When most people refer to “.NET", they''re usually referring to the .NET Framework.
    The .NET Framework is really three things:


    +   - A library of unified core classes that provide the plumbing for applications.

    - Presentation classes for developing ASP.NET and Windows Forms applications

    - The Common Language Runtime (CLR), an environment in which your .NET programs
    are executed.'
