- img_proc: false
  md: 'Although these classes will be discussed later in this chapter, for now all
    you need to know is the classic OLE DB data providers return data as COM objects,
    which can be translated into the higher level ADO Recordset. .NET managed data
    providers return data as an XML server, which provides many benefits over COM.


    # Disconnected DataSets


    In ADO.NET, the *DataSet* is analogous to the ADO Recordset. Unlike the ADO Recordset,
    the ADO.NET DataSet is designed for disconnected data access (no active connection
    to a database), which is optimal for distributed, Internet applications.


    # ADO.NET and XML


    In contrast to ADO that had some basic XML functionality, ADO.NET was built from
    the ground up with advanced XML capabilities.

    As mentioned previously, XML is a great data format for passing data between layers
    of an n-tier application—especially when a web server and firewall are involved—and
    ADO.NET does this with ease. In addition to passing XML over tiers, the ADO.NET
    DataSet allows you to read XML data from a variety of data sources as easily as
    you can read data from a database.


    ADO.NET''s XML integration also improves its ability to work with non-relational
    data. While ADO touted the capability to work with relational and non-relational
    data, in reality it was not very straightforward. In contrast, ADO.NET allows
    you to read XML as easily as reading data from a database, making it easier to
    work with non-relational data. You can think of it this way—ADO is designed to
    be database-centric, working best with best data stored in databases. ADO.NET
    is data-centric, designed to work well with data regardless of where it is stored.


    # ADO.NET performance


    Another improvement ADO.NET gives you greater performance. ADO is based on COM,
    which incurs an inherent performance hit. This is because your application communicates
    with ADO in a non-native way through COM interfaces, adding extra overhead. In
    addition, because COM objects are not native to the language you''re using, performance
    suffers when converting data types in your programming language of choice to COM''s
    data types.

    .NET managed data providers are written on top of the Common Language System Runtime
    and (see Chapter 1 "Introducing .NET" for details), the need for conversion between
    data types disappears, providing a great improvement in speed. This is the case
    with the SQL Server managed data provider (which was also tuned to work specifically
    offering even greater performance). However, in scenarios that use the classic
    OLE DB Provider, as with the OLE DB Managed Data Provider, this conversion between
    data types must still occur.


