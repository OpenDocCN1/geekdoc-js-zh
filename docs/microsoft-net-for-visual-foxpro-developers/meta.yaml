    # Assigning one string to another


    The .NET runtime treats strings differently than other reference types. At first,
    when you assign the value of one string to another string:


    ```

    string State1 = "California";

    string State2 = State1;

    ```


    it acts as expected. This code creates two variables on the stack, State1 and
    State2, and it points both variables to the same "California" string located on
    the heap.

    However, if you change the string:


    ```

    string State1 = "Sunny California";

    ```


    the .NET runtime creates a new string object on the heap and stores a reference
    to the data in the State1 variable located on the stack while State2 still points
    to the old data on the heap. Armed with this information, you can make better
    choices about how you manipulate strings so not to create excess string data on
    the heap. For example, if you need to concatenate a number of strings in a loop,
    it''s best to use the .NET StringBuilder class. The StringBuilder class has an
    Append method to concatenate strings together:


    ```

    StringBuilder StrBuilder = new StringBuilder();

    StrBuilder.Append("Texas", ");

    StrBuilder.Append("New Mexico", ");

    StrBuilder.Append("Colorado", ");

    MessageBox.Show(StrBuilder.ToString());

    ```


