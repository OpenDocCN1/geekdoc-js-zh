    "Days in month for Oct ''60: " + DateTime.DaysInMonth(1960, 10).ToString() + ControlChars.Lf
    + +

    "Is 2002 a leap year: " + DateTime.IsLeapYear(2002).ToString();

    ```


    You can also instantiate an instance of the DateTime structure, passing a date
    and time that you want to work with. The following code passes my birth date and
