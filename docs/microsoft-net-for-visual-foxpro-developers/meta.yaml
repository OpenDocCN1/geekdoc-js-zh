  md: '# The .NET Framework class library


    Before the arrival of .NET, the Windows API was the primary way you accessed services
    of the Windows operating system. The Windows API was developed over a number of
    years and can be a confusing morass of functions that are difficult to learn and
    use. In contrast, the .NET Framework provides a set of classes with properties,
    events, and methods you can use to access these services in a far more logical,
    intuitive manner.


    For example, the .NET Framework has an Environment class you can use to get and
    set information for the environment and platform on which your application is
    running. The following properties found in the Environment class are intuitive
    and self-descriptive:


    +   - CurrentDirectory

    - MachineName

    - OSVersion

    - SystemDirectory

    - UserDomainName


    You don''t have to be a rocket scientist to figure out what the following methods
    of the Environment class do for you:


    +   - GetCommandLineArgs

    - GetEnvironmentVariables

    - GetLogicalDrives


    This is easier than trying to find and learn how to use Windows API functions
    that give you the same information.


    That said, the biggest learning curve for .NET is the .NET Framework classes.
    Here''s a comparison for you—Visual FoxPro has 35 different base classes you can
    use in your applications, including text boxes, combo boxes, grids, counters,
    custom classes, sessions, and so on. In contrast, the .NET Framework has over
    200 base classes! Figuring out what classes are available to you and to which
    in a particular situation is where most of your learning curve will be.


    However, to make a fair comparison between Visual FoxPro and the .NET classes,
    you need to remember that there are over 500 functions, approximately 430 commands,
    and over 75 variables that the VFP language can. In comparison, the organization
    of the .NET Framework classes makes it easier to find the functionality you need.
    For example, in Visual FoxPro, there are a few dozen commands you can use for
    string manipulation. When you were first learning Visual FoxPro, it probably took
    you a while to discover all of these commands (and maybe you haven''t found them
    all!).


    In contrast, .NET implements all these string manipulation capabilities as individual
    methods of the String class. Once you discover the String class, you have all
    of this string manipulation functionality at your fingertips. You will find this
    true for all different types of functionality in the .NET Framework classes.'
