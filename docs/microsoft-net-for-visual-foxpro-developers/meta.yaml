  md: 'For example, to convert an Integer to Byte you use the CByte keyword:


    ```

    Dim x As Integer = 20

    Dim y As Byte = CByte(x)

    ```


    You can also use the System.Convert class to perform conversions instead. The
    Convert class has a number of different conversion methods to use for converting
    values (Table 5). For example, to perform the same conversion in the previous
    example using the Convert class, you can do it this way:


    ```

    Dim x As Integer = 20

    Dim y As Byte = Convert.ToByte(x)

    ```


    > You will experience better performance using the System.Convert class rather
    than the conversion functions. This is because the Convert class has overloaded
    methods specifically designed to convert each type. However, the type conversion
    functions as CStr and CDate take into consideration the locale settings of your
    system, so if this functionality is important to you, it may be worth the performance
    hit.


    **Table 5.** The Convert class contains a number of methods to use for converting
    values from one type to another. This is a partial list.


    | Keyword | Description |

    | ToBoolean | Converts a value to Boolean |

    | ToByte | Converts a value to an 8-bit unsigned integer |

    | ToChar | Converts a value to a Unicode character |

    | ToDateTime | Converts a value to DateTime |

    | ToDecimal | Converts a value to Decimal |

    | ToDouble | Converts a value to Double |

    | ToInt16 | Converts a value to a 16-bit signed Integer |

    | ToInt32 | Converts a value to a 32-bit signed Integer |

    | ToInt64 | Converts a value to a 64-bit signed integer |

    | ToByte | Converts a value to an 8-bit signed integer |

    | ToSingle | Converts a value to a single-precision floating point number |

    | ToUInt16 | Converts a value to a 16-bit unsigned integer |

    | ToUInt32 | Converts a value to a 32-bit unsigned integer |

    | ToUInt64 | Converts a value to a 64-bit unsigned integer |


    # The CType function


    The conversion keywords and System.Convert class discussed in the previous section
    are great for converting basic value types, but you need something else if you
    want to convert more complex objects. That something else is the CType function.'
