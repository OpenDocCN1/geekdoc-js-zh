    # Value and reference types


    .NET makes a strong distinction between value types and reference types. Value
    type variables store their data directly and reference type variables store the
    address where their associated data can be found. Reference variables are actually
    pointers dressed up in an object—but you cannot access the pointer directly. To
    understand this concept more clearly, you need to learn how C# allocates memory
    behind the scenes.


    # Understanding the stack and the heap


    There are two places where the .NET runtime allocates memory for your data types—the
    stack and the heap. The stack is an area of memory used to store value types that
    have a fixed length. This includes basic data types such as integers, boolean,
    float, double, and character. Figure 1 provides a conceptual view of how this
    works. When you declare the integer variable "x", the runtime allocates space
    for the variable on the stack. When you assign a value to the variable, the .NET
    runtime stores the value into the space already allocated on the stack.


    ![](bbox=[0.115, 0.443, 0.788, 0.793])


    **Figure 1.** When you declare a value-type variable, the .NET runtime allocates
    space for the variable on the stack. When you assign a value to the variable,
    the value is stored in the space already allocated on the stack.


    What happens when you copy one value variable to another value variable as shown
    here?'
