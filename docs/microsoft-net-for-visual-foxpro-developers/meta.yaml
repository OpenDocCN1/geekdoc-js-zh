  md: '# Chapter 4 Introduction to Visual Basic .NET


    Many Visual FoxPro developers have an aversion to anything that bears the name
    "Visual Basic". This chapter aims to help you look past this prejudice and take
    a fresh look at the new incarnation of Visual Basic—Visual Basic .NET. As you
    read this side-by-side comparison of Visual FoxPro and Visual Basic .NET, you''ll
    see that Visual Basic has grown up and is a first-class citizen alongside C# and
    C++.


    Visual Basic has been around for many years. It was the first language offered
    by Microsoft that brought Windows programming to the masses. The relationship
    between Visual FoxPro and Visual Basic communities has been often combative and
    characterized by religious fervor on both sides of the fence.


    One of the biggest bones of contention has been the claim by VB developers that
    Visual Basic 6 is object-oriented—which most VFP developers argue against! But
    things have changed. For all intents and purposes, Visual Basic .NET is a new
    language. Its syntax is similar to Visual Basic, but it was completely rewritten
    for it.


    In the next chapter, I''ll cover detailed information on both C# and VB .NET''s
    object-oriented features. In this chapter, I focus on the syntax of VB .NET compared
    to VFP. So, hopefully you can put aside any preconceived notions and take a good
    look at what VB .NET has to offer.


    > For a side-by-side comparison of Visual Basic .NET, C#, and Visual FoxPro''s
    operators and keywords, check out "Appendix A – Language Comparison Tables". For
    a comparison of each language''s data types, see "Appendix B – Data Type Comparison".


    # Changes for Visual Basic 6 backward compatibility


    As you learn Visual Basic .NET, you''ll come across a few things that are a little
    different from the .NET norm. After Visual Studio .NET Beta 1 was released, Microsoft
    restored its Visual Basic 6 functionality to VB .NET based on feedback from the
    Visual Basic community. The changes provide an easier upgrade path from Visual
    Basic 6 to Visual Basic .NET. These are the three main changes:


    +   * The value of True – In almost every programming language, a boolean True
    is coerced to an integer, its value is one (1). In Visual Basic, it''s always
    a minus I (-1). Originally, Microsoft was going to change this so VB .NET was
    in line with other .NET languages, but for backward compatibility reasons VB .NET''s
    True still evaluates to -1.'
