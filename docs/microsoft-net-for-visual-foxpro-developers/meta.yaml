  md: "# Array parameters\n\nYou can pass a variable number of parameters to a C#\
    \ or VB.NET method by declaring an array parameter. Within the method, you can\
    \ use a foreach loop to access all items in the passed array.\n\nIn C#\n\n```\n\
    public void ArrayParam(params int[] ages)\n{\n    string AgeMsg = \"\";\n\nforeach\
    \ (int i in ages)\n{\n    AgeMsg += i + \":\";\n}\n\nMessageBox.Show(\"Ages: \"\
    \ + AgeMsg, \"Array Parameter demo\");\n```\n\nIn Visual Basic.NET:\n\n```\nPublic\
    \ Sub ArrayParam(ByVal ParamArray ages() As Integer)\n    Dim AgeMsg As String\
    \ = \"\"\n    Dim i As Integer\n    For Each i in ages\n        AgeMsg += i.ToString()\
    \ & \":\"\n    Next i\n    MessageBox.Show(\"Ages: \" & AgeMsg, \"Array Parameter\
    \ demo\")\nEnd Sub ArrayParam\n```\n\n# Output parameters\n\nC# has output parameters—a\
    \ parameter type not available in Visual Basic .NET. An output parameter is similar\
    \ to a reference parameter, but it allows you to pass a variable to a method without\
    \ first specifying an initial value. If you remember Chapter 3, \"Introduction\
    \ to C#\", in an effort to encourage good programming practices, C# requires you\
    \ to specify a value for all variables before using them. Output parameters are\
    \ the one exception to the rule. To demonstrate, here's a C# method that declares\
    \ a single output parameter:\n\n```\npublic void OutParam(out int age)\n{\n  \
    \  age = 39;\n}\n```\n\nHere's an example of code calling this method:\n\n```\n\
    int JackTennysAge;\nPtDemo.OutParam(out JackTennysAge);\n```"
