  md: '# Introduction


    Why should VisualFPro developers be interested in .NET?


    I asked myself this question when early releases of .NET first arrived on the
    scene. Visual FPro allowed me to do pretty much anything I wanted, from building
    single-tier applications with a VFP back end, all by the way distributing Internet
    applications accessing client-server data.


    Then, I started to dive into the .NET Framework to see what it had to offer, and
    I was amazed. First of all, .NET wasn''t just for building Web applications—it
    was also a great tool for building desktop applications. I discovered a number
    of things I had to spend writing custom code to get working in Visual FPro were
    simple property settings! I also found Visual Studio .NET was a pleasure to work
    with. Although there were a few hints here and, by large, the VS .NET team did
    a great job creating tools that would save me months of development time.


    After spending a few weeks with Visual Studio .NET, I moved on to the .NET class
    library. There I found over 2000 classes providing the blocks for creating. .NET
    applications. Personally, I learn by documenting, so I fired up Radford Rose and
    spent a few months documenting all the classes in the .NET Framework, building
    class diagrams, showing the relationships between classes in each .NET namespace.
    I found the .NET Framework to be well designed, and, huge. This is where you''ll
    find the biggest curve in .NET.


    Next, I began studying the C# and Basic .NET languages. Both of these languages
    are top-notched, object-oriented languages that allow you to take advantage of
    the .NET Framework base classes. Of the two languages, I personally favor C#,
    for its advanced language, compact syntax, and enforcement of good programming
    practices. Fortunately, my technical editor helped me keep honest in providing
    a balanced view of both languages throughout this book.


    Another benefit I''ve found with .NET is a single learning curve for building
    all types of applications. Once you learn how to create a .NET Windows Forms application,
    you''re about 90% up the learning curve for ASP.NET applications, Web Services,
    and so on. Now you don''t need two teams of developers—to create desktop applications
    and the other to create Web applications. You can divide your team in more logical
    units—developers who perform design and analysis, developers who create business
    components, developers who create user interfaces, and developers who know how
    to crunch data. Or, if you''re a single developer on your own, you can do all
    of these things with a much shorter curve.


    Don''t be afraid of .NET. In all honesty, you''re in a great position to learn
    .NET. Its object-oriented model is similar to Visual FPro''s, and I find VFP developers
    are able to learn .NET quickly and by using it to create software applications.
    More often than not, you may be using .NET to access your existing Visual FPro
    code. In recognition of that, Chapter 15, "Interoperability with Visual FPro"
    shows how easy this is.


    I hope this book answers all your questions about .NET and helps you get to speed
    quickly. Personally, I''m having a blast working with these technologies, and
    I think you will too.'
