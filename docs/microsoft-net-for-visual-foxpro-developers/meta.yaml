  md: "# Code placement\n\nIn Visual FoxPro, you place code in classes or in standalone\
    \ functions, procedures, and\nprograms. This allows you to do a mix of both procedural\
    \ and object-oriented programming.\nIn C#, all code must be contained within classes\
    \ or structures which are similar to classes.\nStructures are discussed in detail\
    \ in Chapter 5, \"Object-Orientation in C# and Visual Basic\nNET.\" Given a choice\
    \ between the two approaches, I think C#'s approach is better. VFP's\napproach\
    \ may be more flexible, but it can, and often does, promote object-oriented\n\
    programming practices.\n\n# Grouping statements together\n\nThe convention in\
    \ Visual FoxPro for grouping statements together is to use a beginning and\nending\
    \ keyword. For example, you group all the members of a class together within DEFINE\n\
    CLASS and ENDDEFINE keywords. You group code contained in class methods within\n\
    PROCEDURE and FUNCTION or ENDFUNC:\n\n```\nDEFINE CLASS MyClass AS Session\n\n\
    PROCEDURE MyProcedure\nENDPROC\n\nFUNCTION MyFunction\nENDFUNC\n\nENDDEFINE\n\
    ```\n\nC# uses curly braces to group code together. Here's a code sample that\n\
    defines a class CodeGroupingDemo and it contains two methods named MyMethod1\\\
    and MyMethod2:\n\n```\npublic class CodeGroupingDemo\n{\n    public void MyMethod1()\n\
    \    {\n    }\n    public void MyMethod2()\n    {\n    }\n}\n```\n\nAlthough at\
    \ first you may find this style of coding difficult to read, it is less verbose\
    \ than\nVisual FoxPro (and VB .NET for that matter), it means less typing, and\
    \ it's consistent\nthroughout the language.\n\n# Comments\n\nIn Visual FoxPro,\
    \ you use the familiar asterisk (*) to indicate a comment at the beginning of\
    \ a\nline. You can also use a double ampersand (&&) to add a comment at the end\
    \ of a line."
