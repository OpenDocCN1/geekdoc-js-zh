    # Events and delegates


    Events happen raise events and other objects respond to them. Visual FoxPro has

    titionally been well in the area of events. Although you can write code that responds
    to

    events in VFP, you can''t raise your own events as in Visual Basic 6. Although
    Visual

    FoxPro''s event model is limited, it is simple and straightforward. All you have
    to do is place

    code in an event, and it executes when the event fires.


    In contrast, C# and .NET both have full support for raising and responding to
    events.

    The .NET event model is more robust and flexible than Visual FoxPro''s, but with
    this

    flexibility can come a small learning curve in understanding and implementing
    events.


    The .NET event model is based on the object-oriented Observer design pattern.
    This

    model involves three main entities:


    +   - An event transmitter

    - An event receiver

    - A delegate'
