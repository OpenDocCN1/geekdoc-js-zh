  md: '# Choosing DataSets


    In a number of ways, DataSets are more capable than DataReaders. DataSets range
    from

    containing data from a single table to representing an in-memory database containing
    multiple

    tables, relationships, and constraints.


    Figure 5 shows a conceptual model of the DataSet. As you can see, a DataSet contains

    tables that in turn contain DataRows and DataColumns. The DataRow is equivalent
    to a Visual

    FoxPro record and a DataColumn is equivalent to a Visual FoxPro field. The DataSet
    also

    allows you to create relationships between the DataTables and constraints on the

    DataColumns.


    ![](bbox=[0.085, 0.273, 0.894, 0.718])


    Figure 5. A DataSet can represent an in-memory database that includes multiple
    tables, relations, and even constraints.


    DataSets are colorless by default—an initial connection is opened, all requested

    data is retrieved from the data source, and then the connection is automatically
    closed. When

    are ready to save changes, you reconnect the DataSet, update the data source with
    changes

    you have made, and the DataSet gets updated with changes made by others. Exception
    (error)

    handing is an important consideration when creating connections to the data source.
    For

    more information on handling exceptions see Chapter 13, "Error Handling and Debugging

    in .NET".'
