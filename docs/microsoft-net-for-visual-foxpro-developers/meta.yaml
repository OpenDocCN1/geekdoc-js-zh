    The first line of code uses the static Type.GetType method to retrieve a object
    that contains information about the HW.NetBook.Samples.Message class. You can
    use Type.GetType because the message class is contained in an assembly already
    loaded.

    The second line of code uses the object''s GetMethod requesting information on
