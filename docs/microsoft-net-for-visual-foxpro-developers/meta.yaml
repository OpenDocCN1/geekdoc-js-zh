    It builds a string that contains the date, day-of-week, day-of-year, month, time-of-day,
    and year of my birthday. The second section of this code uses the DateTime structure''s
    AddYears method to return a new DateTime object that represents my 64th birthday
    (for You Beatles).

    Here''s the code in C#:


    ```

    DateTime DateTimeObj = new DateTime(1960, 10, 9, 1, 10, 0, 0);

    DateTimeMsg = "October 9, 1960, 1:10am\n\n"

    "Date: " + DateTimeObj.Date + "\n" +

    "Day: " + DateTimeObj.Day + "\n" +

