    # Strings as reference types


    .NET runtime strings treats a bit differently than other reference types. From
    a practical perspective, this only occurs when you are concatenating a number
    of strings together (as in a loop), because the runtime can proliferate an excess
    amount of string data on the heap. In situations like this, you should use the
    .NET StringBuilder class instead using Strings.


    The StringBuilder class has an Append method you to concatenate strings together:


    ```

    Dim StringBuilder As New StringBuilder()

    StringBuilder.Append("Texas, ")

    StringBuilder.Append("New Mexico, ")

    StringBuilder.Append("Colorado")

    MessageBox.Show(StringBuilder.ToString(), "StringBuilder")

    ```


    # Enumerations


    Visual Basic .NET allows you to define your own complex value types. One of these
    values is enumerations and the other is structures (covered in Chapter 5, "Object
    Orientation in C# and VB .NET")


    Enumerations are a convenience feature of Visual Basic .NET that allows you to
    group related constants together. For more information on the beauty of enumerations,
    check out related "Enumerations" in Chapter 3, "Introduction to C#".


    Here is an example of declaring an enumeration in Visual Basic .NET:


    ```

    Public Enum Months As Integer

    January = 1

    February = 2

    March = 3

    April = 4

    May = 5

    June = 6

    July = 7

    ```'
