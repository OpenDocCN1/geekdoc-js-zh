    \ to specify the type of library generated by RegSvcs.\n\n# Configuring a class\
    \ for object pooling\n\nTo indicate that you want an object to be pooled, there\
    \ are three main steps you need to take. The first step is to derive your class\
    \ from the .NET ServicedComponent class that belongs to the System.EnterpriseServices\
    \ namespace. All classes that use COM+ services must be derived from this class.\n\
    \nThe second step is to specify an ObjectPool attribute for the class you want\
    \ to pool. The following example specifies that object pooling is enabled, the\
    \ minimum pool size is 1, and the creation timeout is 45 seconds (if you don't\
    \ specify values for these parameters, they are set to the COM+ defaults—minimum\
    \ pool size of 0, a maximum pool size of 1,048,576, and a creation timeout of\
    \ 60 seconds). Here’s the code in C#:\n\n```\n[ObjectPooling(Enabled=true, MinPoolSize=1,\
    \ MaxPoolSize=75,\nCreationTimeout=45)]\\public class Executant : ServicedComponent\n\
    {\n}\n```\n\nAnd here’s the code in Visual Basic .NET:\n\n```\n<ObjectPooling(Enabled:=true,\
