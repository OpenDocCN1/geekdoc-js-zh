    use to invoke the ShowMessage method.

    The third line of code uses the static Activator.CreateInstance to create an instance
    of the Message class. An array of Object is created to pass a parameter to the
    Message.ShowMessage method when it is invoked. Even if the method you are calling
    does not have any parameters, you still need to declare an empty Object array
    as follows.

    In C:

    Object[] args = new Object[1];


    And in Visual Basic .NET:

    Dim args(0) As Object


    Finally, the last line of code invokes the Message.ShowMessage method.

    If you need to get type information for a class not in a loaded assembly, you
    use the static Assembly.Load. For example, the following code loads the MyOtherAssembly
    file and retrieves the HW.NetBook.Samples.MyClass type from the assembly.

    In C#:

    Assembly assem = Assembly.Load("MyOtherAssembly");

