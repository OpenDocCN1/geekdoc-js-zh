    # Unsafe Code


    C# has an advanced feature that is not available in Visual Basic .NET—the ability
    to create unsafe code.


    Unsafe code is often misunderstood as being unmanaged code. As mentioned in Chapter
    1, “Introduction to .NET”, unmanaged code is code that executes outside of the
    CLR and not to take direct advantage of .NET services as garbage collection. An
    example of running unmanaged code is calling a method on an object in a Visual
    FoxPro COM server.


    In contrast, unsafe code is still managed, but it allows you to access memory
    directly by means of pointers. The term unsafe does necessarily mean your code
    is a danger to itself and to you. It means the runtime cannot verify that it is
    safe. There are a few reasons. The most common reason is to improve performance.
    When you are able to access memory addresses using pointers rather than reference
    values, you are going through one less layer, which provides a performance advantage.
    If you have time-critical portions of your application where you want to write
    out the highest possible speed, you may consider creating unsafe code.


    Another reason you may want to create unsafe code is to access a legacy DLL, such
    as a Windows API call or a legacy DLL calls for a pointer to be passed as a parameter.
    For more information on creating unsafe code in C#, check out the MSDN article
    Unsafe at the Limit by Eric Gunn of Microsoft:


    ```

    http://msdn.microsoft.com/library/default.asp?url=/library/en-us/dnscol/html/csharp1082001.asp

    ```


