  md: '# # Acknowledgements


    Thanks to Wil for having me write this book, and for his guidance throughout the
    project. Working with Cathi was great—she provided significant feedback, which
    helped make this a far better book! Thanks to Nicole, for her copy editing skills,
    which helped me get my points across far more clearly than I could have done.


    A special note of thanks also goes to the many students who have come through
    my “.NET for Visual FoxPro Developer” classes, helping me know the kind of questions
    that should be answered in this book.


    On a personal note, thanks to my sons, Jordan, Timothy, and Alexander, who gave
    up some time with Dad so I could write. Also, thanks to Nicole for her non-technical
    role as an encourager, supporter, and sounding board!


    Thanks also to Markus Egger for keeping ABBA songs alive in the 21st century!


    —Kevin


    My thanks to Kevin who was a pleasure to work with and made the experience even
    more enjoyable than I had hoped it would be. Whil, thanks for giving me the opportunity
    to be a part of this wonderful book. Thanks to my friends in the FoxPro and .NET
    Community for their continued source of support and assistance. Many thanks to
    my husband Alan, who took care of everything else in our lives so that I could
    have the time to concentrate on this book. And finally, thanks to my daughter
    Stephanie, for understanding that Mommy needed to hide away in the den to work
    on the book, missing out on some of the quality family time that we enjoy so much
    together.


    —Cathi'
