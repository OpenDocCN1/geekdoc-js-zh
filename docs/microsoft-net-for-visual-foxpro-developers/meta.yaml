    **Figure 9.** Namespaces allow you to categorize your classes in a similar way
    as things are categorized in taxonomies.


    Microsoft has suggested that you declare your namespaces as follows: the first
    part of a namespace should be your company name, the second part should be product,
    the third part should specify a category of classes, and so on. For example, I
    have declared a namespace to which all of my company business objects belong as
    "OakLeaf.MM.Business". Oak Leaf is my company name, MM is the product name (Mere
    Mortals Framework), and Business specifies business objects.


    For information on assigning classes to a namespace, see Chapter 3, "Introduction
    to C#" and Chapter 4, "Introduction to Visual Basic .NET".


    # .NET Programming Languages


    As of this writing, there are three main .NET languages from you can choose: Basic
    .NET, Visual C .NET, and Visual C++. Since the vast majority of Visual FoxPro
    developers using .NET will either choose Visual .NET or C# as their software development
    language, this book concentrates on these two languages, providing examples each
    and information that can help you decide which language is right for you.


    # Visual C# .NET


    Although Visual C# .NET is the "official" name of the language, you most always
    see it referred to as "C#" (pronounced C sharp), and this is the convention I
    use in this book. C# is a brand new computer language written specifically for
    .NET and it has generated a lot of excitement. In fact, Microsoft used it to create
    the .NET Framework base classes. As of the writing of this book, many Visual FoxPro
    developers learning .NET have chosen C# as their programming language of choice.


    Because C# is in the "C++" family of languages, its syntax is similar to C++,
    but it is most similar to Java. C# can also be used to create Windows Forms applications,
    Web Form applications, XML Web services, console applications, class libraries,
    and more. C# is designed to combine the power and control of C and C++ with the
    ease of use often associated with Visual Basic for high productivity. For details
    on C#, see Chapter 3, "Introducing C#".'
  merge: -1
  pgno: 41
- img_proc: false
  md: '# Visual Basic .NET


    Visual Basic .NET is the newest version of Microsoft''s Visual Basic programming
    language. The difference between VB .NET and Visual Basic 6 is as big as the difference
    between FoxPro 2.6 and Visual FoxPro—and then some.


    Unlike its predecessor, Visual Basic 6, VB .NET is a fully object-oriented language
    that was completely rewritten for the .NET Framework. You can use VB .NET to create
    Windows Forms applications, Web applications, XML Web services, console applications,
    libraries and more. In its new iteration VB .NET also continues to be the “glue”
    that fills the gaps and binds applications together. You can use Visual Basic
    .NET to create macros for your Visual Studio .NET IDE.


    As you might expect, VB .NET has no nice convenience features and you will probably
    continue to get more of these in subsequent versions of .NET.


    For details on Visual Basic .NET, see Chapter 4, “Introducing Visual Basic .NET".


    # Naming Guidelines


    Microsoft has come on board with this list of naming guidelines for .NET languages.
    Their hope is to have most developers jump on with these conventions so everyone
    can read each other''s code more easily. One guideline that has surprised many
    developers is the recommendation to discontinue the use of Hungarian notation.


    The official naming guidelines can be found on the Web:


    http://msdn.microsoft.com/library/en-us/cpgenref/html/cpconnamingguidelines.as


    # Overview of the development process


    It''s appropriate in this chapter to give you a high level overview of the development
    process when creating a .NET application. Seeing the big picture can hopefully
    place each chapter in this book in the context of the development process.


    # Requirements gathering


    Before you write one line of code, you should gather requirements for the application.
    Most software development shops use the Unified Modeling Language (UML) and the
    Rational Unified Process (RUP) for this purpose. Microsoft has recognized the
    importance of analysis and design by adding UML diagrams to your Visio diagramming
    tool and integrating Visio with Visual Studio .NET.


    > In this section I''m using UML terminology that may not be familiar to you.
    To learn more about the Unified Modeling Language, check out books such as The
    Unified Modeling Language User Guide from Addison-Wesley.


    The first step in gathering requirements involves documenting how the end user
    will use the software system. This is primarily achieved by means of UML use case
    diagrams.'
  merge: -1
  pgno: 42
- img_proc: false
  md: '# Building a plan for construction


    After gathering your requirements, you should build a plan for construction. This
    includes determining how long the entire project will take to complete and choosing
    which parts of the application to build first, second, and so on. When using the
    UML, you select case to be further analyzed, designed, and implemented.


    # Designing and building business objects


    During construction you further analyze your cases and design business objects
    that carry out the logic of each case. This means adding methods to business object
    classes that will contain the majority of your application logic. This approach
    is very different from the way most Visual FoxPro developers create applications
    today—they place the majority of application logic in the user interface. However,
    using business objects makes your applications more flexible, scalable, and maintainable.


    Typically, you should create a Class Library in C# or .NET to contain your business
    objects. This project can be compiled into an assembly that can be referenced
    from a variety of applications (Windows Forms, Web Forms, Web Services, and so
    on).


    For more information on designing and implementing business objects, see Chapter
    8, “NET Business Objects”.


    # Data modeling


    As you design your business objects, you should also start thinking about modeling
    your application data. If I''m designing an application with client server data,
    I often find creating prototype tables in Visual FoxPro is a great “proof-of-concept”
    technique. Because FoxPro developers tend to see the world in terms of data, placing
    data in tables can help work out any kinks in the model that might otherwise go
    undetected.


    Ultimately, before you actually create business object classes in your language
    of choice, you should finish modeling the associated data.


    For more information on accessing data from within a .NET application, see Chapter
    7, “Data Access with ADO.NET”.


    # Building the user interface


    If you''re creating a Windows Forms or Web Forms application, you need to design
    and build a user interface. You can create a new Windows Forms or Web Forms application
    using Visual Studio .NET and add a reference to your business object library to
    the project so these classes are accessible from your user interface.


    As mentioned previously, you should not place your application logic in your user
    interface. Think of your user interface as the “skin” of your application, which
    can easily be replaced with an alternate skin.


    You can place code in your user interface that instantiates business object classes
    and calls their methods to perform services such as retrieving data, manipulating
    and saving data, performing calculations, and so on.


    For more information on building your application’s user interface, see Chapter
    9, “Building WinForm Applications”, and Chapter 10, “Building Web Applications
    with ASP.NET”.'
  merge: -1
  pgno: 43
- img_proc: false
  md: '# Building an XML Web service


    If you are creating an XML Web service, you can create a new Web services project
    in Visual Studio .NET. Afterwards, you can add a reference to your business object
    library to the Web services project so these classes are accessible from the Web
    service.


    For more information on building an XML Web Service, see Chapter 12, “XML Web
    Services".


    # Conclusion


    Microsoft is betting the farm on .NET. They''ve thrown a tremendous amount of
    resources at .NET and have come up with some very impressive technologies. It
    is a huge shift in technology that has evoked the full spectrum of emotions from
    a wide variety of people—including Visual FoxPro developers. The rest of this
    book will help you make informed decisions about .NET—why, when, and where you
    should implement it in your software development.'
  merge: -1
