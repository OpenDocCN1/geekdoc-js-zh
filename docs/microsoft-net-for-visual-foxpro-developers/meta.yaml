  md: "# Late binding with reflection\n\nWhen the type of an object is determined\
    \ at run time rather than compile time, this is known as late binding. The type\
    \ of binding is used with Visual FoxPro's CREATEOBJECT command. Following is some\
    \ code that simulates CREATEOBJECT.\n\nThe code declares a class you instantiate\
    \ using late binding.\nC#\n\n```\npublic class Message {\n    public void ShowMessage(string\
    \ msg)\n    {\n        MessageBox.Show(msg, \"Message class\");\n    }\n}\n```\n\
    \nAnd in Visual Basic .NET:\n\nPublic Class Message\n\n```\nPublic Sub ShowMessage(ByVal\
    \ msg As String)\n    MessageBox.Show(msg, \"Message class\")\nEnd Sub  'ShowMessage'\n\
    End Class 'Message'\n```\n\nThe following code instantiates the Message class\
    \ and calls its ShowMessage method.\nC#\n\n```\n// Get the type to use from the\
    \ assembly.\nType MessageType = Type.GetType(\"HW.Netbook.Samples.Message\");\n\
    \n// Get the method to call from the type.\nMethodInfo ShowMessageMethod = MessageType.GetMethod(\"\
    ShowMessage\")\n\n// Create an instance of the Message class.\nObject MessageObj\
    \ = Activator.CreateInstance(MessageType)\n\n// Create the arguments array.\n\
    Object[] args = new Object[1];\n\n// Set the arguments\nargs[0] = \"I'm using\
    \ late binding!!!\"\n\n// Invoke the PrintHello method.\nShowMessageMethod.Invoke(MessageObj,\
    \ args);\n```\n\nIn Visual Basic .NET:\n\n```\n// Get the type to use from the\
    \ assembly.\nDim MessageType As Type = Type.GetType(\"HW.Netbook.Samples.Message\"\
    )\n\n// Get the method to call from the type.\nDim ShowMessageMethod As MethodInfo\
    \ = MessageType.GetMethod(\"ShowMessage\")\n```"
