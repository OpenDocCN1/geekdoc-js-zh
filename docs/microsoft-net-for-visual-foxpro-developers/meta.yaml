  md: "In contrast, \"programming to an interface\" is desirable. In this particular\
    \ case, it means creating an abstract base class to define an interface for a\
    \ family of classes and writing code to talk to the interface.\n\n# Interface\
    \ inheritance\n\nWhen Visual Pro 3 was released, it introduced implementation\
    \ inheritance to FoxPro. With implementation inheritance, subclasses inherit the\
    \ the properties, events, and methods of their base class, as well as any associated\
    \ code. Visual Pro 7 introduced interface inheritance, (which was unfortunately\
    \ limited to COM components). In contrast, C# and Visual Basic .NET have full\
    \ support for both implementation and interface inheritance.\n\nInterfaces are\
    \ similar to classes in defining properties and methods that other classes can\
    \ inherit. However, an interface only defines methods. It does not contain any\
    \ implementation code that can be inherited. For example, the following code defines\
    \ an interface named IDConnection with four properties and six methods.\n\n+ \
    \  * All interface names should be Pascal-cased and prefixed with an uppercase\
    \ \"I\". This means the first two letters of an interface name are always in upper\
    \ case (for example, IDConnection). This is a naming convention used by Microsoft\
    \ that easily differentiate between classes and interfaces.\n\nIf you're familiar\
    \ with ADO.NET, the IDbConnection interface should look familiar to you. It is\
    \ one of the interfaces defined in the .NET Framework's System.Data namespace.\
    \ In C#:\n\n```\npublic interface IDbConnection\n{\n  // Properties\n  string\
    \ ConnectionString();\n  string ConnectionTimeout();\n  string Database();\n \
    \ ConnectionState();\n\n  // Methods\n  IDbTransaction BeginTransaction();\n \
    \ IDbTransaction BeginTransaction(IsolationLevel level);\n  void Database(string\
    \ databaseName);\n  void Close();\n  IDbCommand CreateCommand();\n  void Open();\n\
    }\n```\n\nIn Visual Basic .NET:\n\n```\nPublic Interface IDbConnection\n  ' Properties\n\
    \  Function ConnectionString() As String\n  Function ConnectionTimeout() As String\n\
    \  Function Database() As String\n  Function State() As ConnectionState\n```"
