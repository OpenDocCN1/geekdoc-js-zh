    \ class hides the PrintMessage method in the base class. It then declares a method\
    \ named PrintMsg that calls PrintMessage method in the base class.\n\n# Preventing\
    \ inheritance\n\nAs mentioned in the section \"Virtual (Overridable) Methods\"\
    , C# and VB .NET methods are non-virtual by default, meaning they cannot be overridden\
    \ in subclasses. In contrast, methods marked as \"virtual\" can be overridden.\n\
    \nThere may be cases where you order to override a virtual method in a base class,\
    \ but you don't want other subclasses to override your method in your class. You\
    \ can prevent someone from overriding your method by marking it as sealed (C#)\
    \ or NotOverridable (VB .NET).\n\nFor example, the following code declares a base\
    \ class named \"PreventInheritanceBase\" containing a single virtual method named\
    \ \"DisplayName\". It also declares a subclass of PreventInheritanceSubclass named\
    \ \"PreventInheritanceSubclass\" that marks the DisplayMessage method as sealed.\
    \ This prevents subclasses of PreventInheritanceSubclass from further overriding\
    \ this method.\n\n```\nIn C#:\npublic class PreventInheritanceBase\n{\n    public\
    \ virtual void DisplayMessage()\n    {\n        MessageBox.Show(\"This is a virtual\
    \ method!\", \"Prevent inheritance demo\")\n    }\n}\n```"
