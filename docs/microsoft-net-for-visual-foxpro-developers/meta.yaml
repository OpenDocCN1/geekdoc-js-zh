  md: '# 8 .NET Visual FoxPro Developers


    An assembly is self-describing—it does not have to be registered in the Windows
    Registry because it possesses a manifest that contains metadata about the assembly.


    # Manifests


    An assembly’s manifest contains information such as the assembly’s identity (name,
    version, and culture), a list of all the files in the assembly, information about
    all referenced assemblies, and details of all classes and their members.


    A great way to examine an assembly is to use the .NET IL Disassembler. The IL
    Disassembler (ildasm.exe) is found in the SDK\Bin folder below the directory on
    your machine that contains the .NET Framework. To launch this program you can
    simply double-click it in Windows Explorer. To open an assembly for viewing, select
    File | Open from the menu, and select a .NET assembly. The Disassembler displays
    the assembly manifest as well as any namespaces declared within the assembly (**Figure
    5**). For more information, see the "Namespaces" section later in this chapter.


    ![](bbox=[0.085, 0.383, 0.914, 0.673])


    > **Figure 5.** The IL Disassembler allows you to examine the contents of an assembly,
    including any MSIL code.


    If you expand a namespace node, it displays all of the classes in the assembly
    that belong to the namespace. **Figure 6** shows a different list of icons used
    within the disassembler and a description of how they are used. You can find this
    list in the help for the disassembler tool.


    A detailed description of each of these elements (such as class, interface, method,
    static method, and so on) see Chapter 5, "Object Orientation in C# and Visual
    Basic .NET".'
