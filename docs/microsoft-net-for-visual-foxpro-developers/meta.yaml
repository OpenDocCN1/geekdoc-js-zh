  md: '# Chapter 2

    Visual Studio .NET


    Visual Studio .NET is the latest incarnation of Microsoft''s suite of software
    development tools. The VS .NET team has done a great job of providing a top-notch
    experience for the developer regardless of the .NET language you use. This chapter
    takes you on a tour of VS .NET, familiarizing you with its features so you can
    get up and running quickly.


    Before .NET, tools in Visual Studio were loosely related products packaged in
    one box—Visual Studio changes all that. Teams of developers working with different
    languages such as C#, Visual Basic .NET, and C++ now have a common, familiar Integrated
    Development Environment (IDE) that''s pleasure to work in.


    # The Start Page


    One of the biggest challenges in learning .NET is finding information. The Visual
    Studio .NET Start Page is all about helping you find information that you can
    get up and running quickly. Most developers don''t take the time to explore the
    Start Page, so I''ll take you on a quick tour.


    When you launch VS .NET, the Start Page appears with the Get Started pane selected
    (Figure 1). This page is displayed in a Web browser (a tab refers to a docked
    window in the VS .NET IDE), complete with a browser toolbar containing navigation
    buttons and a combo box, which allows you to enter any valid URL.


