    catch any conversions that may result in a loss of data, rather than catching
    them at runtime. In addition, explicitly specifying type conversions sets advantages
    over allowing them to occur implicitly (automatically). This is because implicit
    conversions require extra work at runtime to determine the types involved in a
    conversion.


