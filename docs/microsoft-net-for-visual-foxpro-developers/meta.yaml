  md: '# Chapter 4: Introduction to Visual Basic .NET 101


    **Table 2.** VB.NET has enumerated values you can concatenate to your strings.
    This table contains a partial list.


    | Enumeration | Description |

    |---|---|

    | CrLf | Carriage return / linefeed |

    | Cr | Carriage return |

