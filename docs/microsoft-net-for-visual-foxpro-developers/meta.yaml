  md: '# # Chapter 6

    Tour of the .NET Base Classes


    Although a lot of heat is generated over which .NET programming language is easier
    to use and learn, ultimately THE biggest learning curve is not C# or Visual Basic.
    .NET—it''s the .NET Framework. This chapter takes you on a tour of some of the
    more interesting and useful classes and shows you how to use them in your applications.


    There are over 2000 classes in the .NET Framework (compared to Visual FoxPro''s
    35 base classes), making for a fairly steep learning curve when you are first
    learning about .NET. Many of the most important .NET classes are covered in detail
    in other chapters of this book. However, in this chapter, you will learn some
    details about classes that are also very important, but are not covered in detail
    elsewhere.


    This chapter will cover the classes by namespace so you get a feel for the organization
    of classes in .NET, but it will not cover every namespace in the framework. First
    of all, there''s only so much I can cover in a chapter within the scope of this
    book, and secondly, a number of namespaces contains classes you will not normally
    use on a regular basis (for example the .NET classes you can use to write your
    own compiler).


    > As mentioned in Chapter 1, “Introducing .NET”, before you can use a class in
    your code, first you need to make sure you reference its associated namespace
    (by means of the “using” directive in C# and the “Imports” directive in Visual
    Basic .NET).


    # ## The System namespace


    The System namespace contains a few classes that you use frequently and have already
    been introduced in previous chapters, such as the base value types—Boolean, Byte,
    Char, Decimal, Integer, and so on (Figure 1). The following sections shows a few
    other classes belonging to the System namespace that are also of interest.'
