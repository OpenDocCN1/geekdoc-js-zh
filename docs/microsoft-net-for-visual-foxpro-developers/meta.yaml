  md: '# # Chapter 7

    Data Access with ADO.NET


    To a Visual FoxPro developer, one of the most important aspects of software development
    is data access. This chapter shows you how to use Microsoft''s new universal data
    access technology, ADO.NET, to access and manipulate a wide variety of data—including
    VFP data. Because there are a number of different ways to access data from ADO.NET,
    this chapter offers information on the best practices for data access.


    If there is one thing that a Visual FoxPro developer is proud of, it''s VFP''s
    data access capabilities. From accessing FoxPro data, to client-server data, and
    XML, VFP is a great tool for building data-centric applications. Based on this,
    I''m sure VFP developers are very interested in .NET.


    This chapter does not attempt to cover all the idiosyncrasies of data access with
    ADO.NET—there are already plenty of books on the market that does. Rather, to
    help you get up and running quickly, this chapter provides an overview of ADO.NET''s
    capabilities.


    However, before diving directly into ADO.NET, the following section gives a brief
    history of data access from the perspective of FoxPro, because it''s easier to
    see where you''re going if you know where you''ve been. If you are already familiar
    with this information, I recommend you skip ahead to the “Introducing ADO.NET”
    section.


    # ## A brief history of data access


    Unlike most other software development tools, FoxPro is both a language and a
    database—you do not need any external technology to access FoxPro data. This differs
    from other tools such as Visual Basic where you must use external data access
    technology to retrieve and manipulate data. However, when you need to access non-FoxPro
    data (such as SQL Server or Oracle) from within FoxPro, you *do* need external
    technology to connect to, access, and manipulate that data.


    > In FoxPro terminology, FoxPro data accessed natively is referred to as “local
    data”. Data accessed in any other way is known as “remote data”.


    Initially, the technology used to access remote data was Microsoft''s Open Database
    Connection (ODBC).


    # ## ODBC—A first attempt at universal data access


    ODBC was one of Microsoft''s first attempts at creating a uniform way to access
    data from FoxPro and other programming tools. To access a particular type of data
    within FoxPro (such as SQL Server, Oracle, or Sybase), you had to use an ODBC
    driver specifically designed to access that type of data. As long as the driver
    was installed on your computer, you could easily access remote data using remote
    views or SQL pass through. ODBC was a great tool for accessing just any type of
    relational data.'
  merge: -1
  pgno: 230
- img_proc: false
  md: '# OLE DB and ADO—The successors to ODBC


    A few years back, Microsoft introduced OLE DB as its new-improved allowed solution
    to universal data access and the successor to ODBC. While ODBC allowed you to
    access most types of relational data, OLE DB went a step further and provided
    a way to access relational and non-relational data in a standard way using a COM
    (Component Object Model) programming interface.


    COM defines a software interface that specifies, at the binary level, how software
    components interact. COM acts as a common layer through which all COM-capable
    tools can communicate.


    In OLE DB, the equivalent to ODBC drivers is OLE DB data providers. Again, you
    need to use an OLE DB provider designed to access a particular type of data. Visual
    FoxPro 7 supplied an OLE DB provider that allows non-Fox clients to access Visual
    FoxPro.


    Microsoft designed OLE DB with C++ in mind, however, in order to make OLE DB accessible
    to the masses, Microsoft created ActiveX Objects (ADO). ADO supplied a high-level
    COM interface, built on top of OLE DB, and easily used by languages such as Visual
    FoxPro and Visual Basic.


    Rather than using cursors (as in Visual FoxPro) ADO provided data access through
    a set of COM objects—the object most frequently used being the Recordset. A number
    of VFP developers tried their hand at data access using ADO. Although it was relatively
    easy to retrieve data using ADO, in addition, it was difficult to integrate an
    ADO Recordset into a Recordset (a performance hit when you tried to "scan" the
    records in a Recordset) into a Visual FoxPro application with Visual FoxPro''s
    data model and user interface based on cursors, rather than data objects. In order
    to make an ADO Recordset available to the user for viewing and manipulating in
    a VF application, you either had to convert it to a VFP cursor, or bind the Recordset
    to an ActiveX grid.


    All of this said, ADO was a big step in the right direction—to both relational
    and non-relational data. However, it also had its limitations—especially with
    n-tier architectures.


    # Data access and the n-tier architecture model


    So, what is n-tier architecture and what impact does it have on data access?


    Before answering this question, you should first understand single tier system
    architecture. In a single tier architecture, all of the application processing
    takes place on a single computer—this includes user interface, business logic,
    and data processing. For example, when you have a Visual FoxPro desktop application
    access FoxPro data (see Figure 1), whether the data is located on your local machine
    or a machine across your network, all of the processing takes place on your workstation.
    This is because the VFP engine resides on your workstation.'
