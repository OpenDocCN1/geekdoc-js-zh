    # Defining classes


    In Chapter 3, “Introduction to C#”, and Chapter 4, “Introduction to Visual Basic
    .NET”, you learned the basics of defining classes. In this chapter I''ll review
    some of that information and expand on it.


    Here''s an example of the most simple class definition in C#:


    ```

    public class SimpleClass

    {

    }

    ```


    And in VB .NET:


    ```

    Public Class SimpleClass

    End Class

    ```


    In both cases, this code defines a class named “Simple”. The public keyword is
    an access modifier specifying the visibility of the class. If you don''t specify
    an access modifier, the visibility defaults to “internal” for C# and the equivalent
    “friend” for VB .NET. Table 1 lists the access modifiers that apply to classes.


    Table 1. C# and VB .NET class access modifiers


    | C# Access modifier | VB .NET Access modifier | Description |

    | --- | --- | --- |

    | public | public | Indicates no restrictions for accessing the class. |

    | internal | friend | Indicates the class is only accessible from code within
    the same assembly where the class is defined. |


    # Defining fields (member variables)


    As discussed in Chapter 3, “Introduction to C#”, variables declared at the class
    level are known as fields, and as discussed in Chapter 4, “Introduction to Visual
    Basic .NET”, they are known as member variables in VB .NET. I don''t want to skip
    mentioning this here, but check out the corresponding chapter for each of these.


