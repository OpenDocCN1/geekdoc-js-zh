  md: '# # Chapter 5

    # Object Orientation in C# and Visual Basic .NET


    With the release of Visual FoxPro 3.0, FoxPro became object-oriented. For those
    of you who have already made the leap to object-oriented programming, you know
    how difficult the transition can be. Fortunately, once you''ve learned OOP in
    VFP, it''s easy to learn the basics of OOP in .NET. This chapter shows how different
    object-oriented features are implemented in C# and Visual Basic .NET, while providing
    a comparison to Visual FoxPro''s object-orientation.


    By its very nature, this chapter is one of the most controversial in this book.
    The two previous chapters were devoted to the basics of C# and Visual Basic syntax,
    but this chapter moves into the meatier topic of object-orientation, providing
    a side-by-side comparison of the two languages. Many of you may use the information
    in these chapters to decide which .NET language to choose—and choice of language
    is often a religious issue!


    As in the previous chapters, I''ll point out the differences in C# and VB .NET
    and offer some editorial comments on the approach I think is best. Although both
    languages compile down to the same intermediate language (MSIL), they implement
    .NET''s object-oriented features a little differently—and in some cases, one language
    has object-oriented features not available in the other language. Throughout this
    chapter, I''ll draw comparisons to Visual FoxPro''s object-oriented features so
    you can leverage your existing knowledge of OOP.


    # ## Where do you put your code?


    FoxPro allows you to place code in classes, functions or procedures stored in
    PRG files, or as procedural code in PRG files.


    In contrast, all code in C# must be placed in classes. This is similar to other
    object-oriented programming languages, such as Java and SmallTalk that impose
    more discipline on developers.


    Visual Basic .NET takes an approach less like Visual FoxPro, allowing you to place
    code and variables in either classes or modules. Similar to a class, a module
    is derived from the System.Object class and can encapsulate items contained within
    it. The main differences between a class and a module are that both can be instantiated
    and implement interfaces, but a module cannot.


    Another difference is in referencing members of a class, you must specify the
    name of the class followed by the member (for example, Customer.GetLimit). In
    contrast, members declared in a module are like global variables and functions
    accessed from anywhere within your application. By default, members of a module
    are shared (For details, the “Instance and static (Shared) members” section later
    in this chapter). You can compare placing code in modules to create global variables,
    functions, and procedures in a Visual FoxPro PRG.


    Modules are a “good thing” or a “bad thing?” I think the answer to this is subjective.
    Personally, I tend to prefer a “pure” object-oriented approach, because I believe
    it'
