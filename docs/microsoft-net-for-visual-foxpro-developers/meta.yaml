    # # The System.Timers namespace


    The System.Timers namespace contains only three classes—the main class is the
    Timer class, which functions similarly to timers in Visual FoxPro.


    > There is a Timer class in each class of the System.Timers, System.Threading,
    and System.Windows.Forms namespaces, so you need to qualify the Timer class name
    with the namespace if you have referenced more than one of these in your code.
    The System.Timers Timer class is used to generate recurring events in your application.
    The System.Threading Timer class is used to call methods at specified intervals.
    The System.Windows.Forms Timer should be used in Windows Forms applications. See
    the .NET Help for information on each of these classes.


    In the following code, the Start method sets the Interval of the timer to 2000ms
    (2 seconds), registers an event handler named OnElapsed with the timer''s Elapsed
    event, and sets the timer''s Enabled property to true. After two seconds, the
    Elapsed event fires, calling the OnElapsed event handler which shuts off the timer
    by setting its Enabled property to false, and then displays a message to the user.


    Here''s the code in C#:


    ```

    public class TimerDemo

    { System.Timers.Timer MyTimer = new System.Timers.Timer();

