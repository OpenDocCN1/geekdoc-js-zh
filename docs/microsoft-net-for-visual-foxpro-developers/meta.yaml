    Specify the name of the strong name key file from the double quotes as follows:


    ```

    [assembly: AssemblyKeyFile("keyPair.snk")]

    ```


    If the file is located in a directory other than the project''s output directory
    you need to specify a relative path so VS .NET can find the file. The path is
    relative to the project''s output directory, so if you have the strong name key
    file in the project''s root directory, and the project''s output directory <Project
    Directory>bin\debug, you would specify the following:


    ```

    [assembly: AssemblyKeyFile("..\..\keyPair.snk")]

    ```


    In Visual .NET, this assembly attribute does not already exist, so you need to
    add it manually. This is how it''s done in VB .NET—notice that I have specified
    a fully qualified path. Although the .NET Help says I can specify a relative path
    for the key file, this doesn''t work in VB .NET, so for now, I have specified
    a fully qualified path:


    ```

    <Assembly:AssemblyKeyFile("MySharedAssemblyVB\bin\keyPair.snk")>",

    ```


    The final step is to compile the project. This "signs" the assembly with the strong
    name located in the strong name key file.


    # Installing an assembly into the Global Assembly Cache

    Unlike assemblies, you can''t just copy assemblies into the Global Assembly Cache—you
    must install them. There are three main ways you can do this:


    +   - The Microsoft Windows Installer 2.0 (recommended for production machines)

    - The .NET command line utility GacUtil.exe (recommended for development machines
    only)

    - The Assembly Cache Viewer (development machines only)


    GacUtil is easy to use. Simply by running the following command at the command
    prompt:


    ```

    gacutil -I <assembly name>

    ```


    For example, if you want to install an assembly named MySharedAssembly in the
    Global Assembly Cache, you run the following command:


    ```

    gacutil -I MySharedAssembly.dll

    ```


    If you have the .NET Framework SDK installed on a developed machine, the Assembly
    Cache Viewer (described in the section "Viewing assemblies in the Global Assembly
    Cache") in Chapter 1, "Introducing .NET") is the easiest way to install a shared
    assembly into the'
