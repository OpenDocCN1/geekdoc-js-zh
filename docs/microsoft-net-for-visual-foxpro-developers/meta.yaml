  md: "# Select...case statement\n\nThe Visual Basic .NET Select...Case statement\
    \ is equivalent to Visual FoxPro's DO CASE statement. Based on the value of the\
    \ expression, one of the case statements is selected for execution. You can specify\
    \ a Case Else, which is the same as VFP's OTHERWISE clause. If the switch expression\
    \ does not match any of the cases, control is passed to the Case Else. If no Case\
    \ Else is present, control passes to the first command following the End Select.\n\
    \n```\nDim TestValue As Integer = 3\nSelect Case TestValue\nCase 1\n  MessageBox.Show(\"\
    TestValue = 1\", \"Select...Case\")\nCase 2\n  MessageBox.Show(\"TestValue = 2\"\
    , \"Select...Case\")\nCase 3, 4\n  MessageBox.Show(\"TestValue = 3 or 4\", \"\
    Select...Case\")\nCase Else\n  MessageBox.Show(\"TestValue is not 1, 2, 3, or\
    \ 4\", \"Select...Case\")\nEnd Select\n```\n\nUnlike C#, you don't have to add\
    \ break statement at the end of each case, which is a nice feature!\n\n# For...Next\
    \ loop\n\nVisual Basic .NET's loops are equivalent to Visual FoxPro's FOR...ENDF\
    \ command. It iterates through a loop while a particular condition is true.\n\n\
    > In the For...Next loop, the loop executes for as long as the counter variable\
    \ between the specified values. The Next statement is typically used to increment\
    \ or decrement the counter value.\n\n```\nDim i As Integer\nDim Message As String\n\
    \nFor i = 0 To 3\n  Message += \"Message \" + i.ToString() + NewLine\nNext i\n\
    ```\n\nYou exit out of a For...Next loop at any point using the Exit For statement.\n\
    \n# While loop\n\nThe While loop is equivalent to Visual FoxPro's DO...WHILE loop.\
    \ It is a pre-test loop meaning if the condition evaluates to false, the loop\
    \ is not executed at all. While loops are often used to repeat a block of code\
    \ for an undetermined number of times.\n\n```\nPublic Sub WhileLoopDemo()\n  Dim\
    \ Condition As Boolean = True\n  While Condition\n    Dim i As Integer = 1\n```"
