    # Namespaces


    In .NET, the primary way you avoid duplicate class names is by means of *namespaces*.
    A namespace is a naming mechanism that allows you to declare logical categories
    for your classes. For example, in the .NET Framework, there are namespaces such
    as:


    +   * System.Drawing

    * System.Data.SqlClient

    * System.Windows.Forms

    * System.Web.Services.Protocols


    At first, many Visual FoxPro developers equate namespaces with class libraries,
    but they''re really quite different. A VFP class library is a physical container
    that holds one or more classes. A .NET namespace has nothing to do with the physical
    location of a class—it is purely a logical name to categorize a class.


    The parts of a namespace typically go (from left to right) general to more specific.
    This is similar in concept to the taxonomies of living things. For example, **Figure
    9** shows the taxonomic hierarchy of the red fox. From kingdom, to phylum to subphylum
    until this convention allows all living things to be categorized.'
