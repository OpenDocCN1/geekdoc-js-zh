  md: '# # DateTime structure


    The DateTime structure is used to represent a date and time-of-day. DateTime has
    a number of static properties and methods you can use to get and time-related
    information. For example, the following code uses the DateTime structure to get
    the current date, current time, number of days in October 1960 (by birth month/year),
    and to determine if 2002 is a leap year.

    in C#:


    ```

    string DateTimeMsg;

    DateTimeMsg = "Current Date: " + DateTime.Today + "\n" +

    "Current Date: " + DateTime.Now + "\n" +

    "Days in month for Oct ''60: " + DateTime.DaysInMonth(1960, 10) + "\n" +

    "Is 2002 a leap year: " + DateTime.IsLeapYear(2002);

