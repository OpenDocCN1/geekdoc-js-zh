  md: '# Language interoperability


    In many large software shops, multiple languages are used by different teams of
    developers. .NET offers language interoperability at a whole new level. You can
    create classes in one .NET language and subclass them in another .NET language.
    You can also work with different languages within the same Visual Studio .NET
    IDE.


    Interestingly, other vendors (besides Microsoft) are creating .NET versions of
    older programming languages such as COBOL, PERL, Eiffel, and Smalltalk among others.


    # Abstracting operating system services


    As mentioned previously, the .NET Framework class library provides object-oriented
    access to services of the underlying operating system. This is far superior to
    making calls to the Windows API, because calls to the Windows API assume that
    you are running on the Window operating system!


    Making calls to the .NET Framework adds a layer of abstraction that can eventually
    allow your code to be moved to non-Windows machines running on different hardware
    platforms such as wireless and handheld devices.


    # Multithreading


    One of the limitations in Visual FoxPro is the inability to create multi-threaded
    applications. If this capability is important to you, then .NET makes it easy
    to create multiple threads of execution, allowing your applications to perform
    background tasks, such as printing, performing calculations, and sending or retrieving
    e-mail.


    # You''re in a great position to learn .NET


    If you''ve already climbed the Visual FoxPro learning curve, you''re in a great
    position to learn .NET—much more than Visual Basic developers. This is because
    the biggest learning curve for VB developers moving to .NET is object-orientation.
    Although VB 6 was object-based, it did not have true implementation inheritance
    (see Chapter 5, "Object-Orientation in C# and Visual Basic .NET" for details).
    In comparison, it''s a much shorter learning curve for Visual FoxPro developers
    to learn the syntax of C# or VB .NET.


    # Managed Code


    From the perspective of .NET there are two kinds of code in the world, managed
    and unmanaged code.


    Managed code is executed and managed by the common language runtime. Managed code
    contains metadata that allows the runtime to provide services such as memory management,
    security, and garbage collection. All MSIL code is managed code. For more information
    on metadata, see the "Manifests" section later in this chapter. For more information
    on garbage collection, see the section "Garbage collection" in Chapter 5, "Object
    Orientation in C# and Visual Basic .NET".


    Unmanaged code is any code that runs outside of .NET. This includes Visual FoxPro
    located in COM servers (Figure 3).'
