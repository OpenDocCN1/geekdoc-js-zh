    # Arrays


    There are many similarities between arrays in Visual FoxPro and in C#. One of
    the big differences is arrays in C are treated as objects with methods and properties.
    Another difference is Visual FoxPro allows you to mix different types of data
    in an array (integers, strings, dates, etc), but in C# all array elements must
    be of the same type.


    > You can get around the limitation of array elements having to be of the same
    type by declaring the array contains items of the type "Object", which is the
    base type of all classes in the .NET Framework.


    A third difference is that C# arrays are zero-based, meaning the first array element
    is zero (0). In Visual FoxPro, the first array element is one (1).


    # Declaring arrays


    In C#, arrays are declared the same way as other variables, except you use square
    brackets [] between the variable type and the variable name. For example, the
    following statement declares an integer array named "KidsAges":


    ```

    int [] KidsAges;

    ```


    You can also declare an array and size it in one step:


    ```

    string [] KidsNames = new string[3];

    ```'
