    # Solutions and Projects


    One of the first concepts you should grasp is Visual Studio .NET''s approach to
    managing and organizing your .NET applications. At its highest level of organization,
    VS .NET uses solutions and below solutions solutions are projects.


    A solution is a container that can hold one or more related projects. Solutions
    allow you to work on multiple projects in the same instance of VS .NET, as well
    as set options and work on items that are common to a group of projects. When
    you create a new project, VS .NET automatically creates a solution that contains
    the new project.


    A project in VS .NET is very similar to a project in Visual FoxPro. It is a container
    that holds related files such as source code, forms, user interface controls,
    text files, images, and so on. You can compile a project into an EXE, DLL or a
    module, among other things. When you compile a solution, a separate output file
    is generated for each project in the solution.'
