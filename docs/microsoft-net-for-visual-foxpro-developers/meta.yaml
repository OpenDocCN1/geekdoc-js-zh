  md: "# 134 .NET for Visual FoxPro Developers\n\nIn contrast, an abstract class is\
    \ not intended to be instantiated. Its main purpose is to\ndefine an interface\
    \ for a family of classes. It is abstract in the sense that it is conceptual as\n\
    oposed to concrete. For example, you may conceive the need to create a class to\
    \ access\napplication settings. This class needs a method to retrieve settings\
    \ and another method to\nsave settings.\n\nThe following code shows how to declare\
    \ an abstract class named \"AppSettingsBase\" that\nrepresents this concept.\n\
    \nIn C#:\n\n```\npublic abstract class AppSettingsBase\n{\n    public abstract\
    \ string GetSetting(string key);\n    public abstract void SetSetting(string key,\
    \ string value);\n}\n```\n\nAnd in Visual Basic .NET:\n\n```\nPublic MustInherit\
    \ Class AppSettingsBase\n    Public MustOverride Function GetSetting(ByVal key\
    \ As String) As String\n    Public MustOverride Sub SetSetting(ByVal key As String,\
    \ \\nByVal value As String)\nEnd Class 'AppSettingsBase\n```\n\nTo mark a class\
    \ as abstract, use the modifier abstract (C#) or MustInherit (VB\nNET) in the\
    \ class definition. In the AppSettingsBase class there two abstract methods.\n\
    These methods represent the concept of retrieving and saving settings. An\nabstract\
    \ method does not contain implementation code. It simply defines a method signature\n\
    including the method name, parameters and their types, and a return value and\
    \ its type. To\nmark a method as abstract, use the modifier abstract (C#) or MustOverride\
    \ (VB .NET).\n\nYou now have a class that defines an interface for retrieving\
    \ and saving application\nsettings. You can create concrete implementations of\
    \ this abstract class to do the real\nwork. For example, Figure 6 shows the AppSettingsBase\
    \ class with two subclasses.\nAppSettingsRegistry accesses settings stored in\
    \ the Windows Registry and AppSettingsXml\naccesses settings stored in an XML\
    \ file.\n\n> UML syntax dictates abstract class names are shown in italics and\
    \ concrete\nclasses are shown in regular font. It also dictates abstract methods\
    \ are shown\nin italics, but the tool I used to create the diagram (Rational Rose)\
    \ doesn't allow\nyou to mark a method as abstract!\n\n![](bbox=[0.075, 0.733,\
    \ 0.143, 0.773])"
