  md: "# Chapter 5: Object Orientation in C# and Visual Basic.NET 135\n\n![](bbox=[0.105,\
    \ 0.093, 0.693, 0.269])\n\n**Figure 6.** You can define an abstract class that\
    \ defines an interface for a family of related classes.\n\nThe following code\
    \ defines the AppSettingsRegistry class in C#:\n\n```\npublic class AppSettingsRegistry\
    \ : AppSettingsBase\n{\n    public override string GetSetting(string key)\n  \
    \  {\n        string setting = \"\";\n        // Code that reads a setting from\
    \ the Windows Registry\n        return setting;\n    }\n    public override void\
    \ SetSetting(string key, string value)\n    {\n        // Code that stores a setting\
    \ to the Windows Registry\n    }\n}\n```\n\nAnd in Visual BasicNET:\n\n```\nPublic\
    \ Class AppSettingsRegistry\n    Inherits AppSettingsBase\n    Public Overrides\
    \ Function GetSetting(ByVal key As String) As String\n        Dim setting As String\
    \ = \"\"\n        ' Code that reads a setting from the Windows Registry\n    \
    \    Return setting\n    End Function 'GetSetting'\n    Public Overrides Sub SetSetting(ByVal\
    \ key As String, \\\n        ByVal value As String)\n        ' Code that stores\
    \ a setting to the Windows Registry\n    End Sub\nEnd Class 'AppSettingsRegistry'\n\
    ```\n\nObviously, these classes don't mock \"as is\" because there are comments\
    \ in the methods where provide an implementation for both the GetSetting and SetSetting\
    \ methods. When you create a class derived from an abstract class, both C# and\
    \ .NET require you to provide an implementation for all abstract methods. If you\
    \ don't, the compiler displays a warning accordingly."
