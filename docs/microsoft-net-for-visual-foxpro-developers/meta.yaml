  md: "# Chapter 5: Object Orientation in C# and Visual Basic.NET 119\n\n# Value parameters\n\
    \nJust as Visual FoxPro, the default parameter type in both C# and Visual Basic\
    \ .NET is a value parameter. In practical terms, the method you call changes the\
    \ value of the parameter, the value is not changed in the calling method. Here’s\
    \ an example of a method with a value parameter in C#:\n\n```\npublic void ValueParam(int\
    \ age)\n{\n    age++;\n}\n```\n\nAnd in Visual Basic .NET:\n\n```\nPublic Sub\
    \ ValueParam(ByVal age As Integer)\n    age = age + 1\nEnd Sub\n```\n\nIn C#,\
    \ if you don’t specify otherwise, the parameter is passed by value. In VB .NET,\
    \ if you don’t specify the kind of parameter, Visual Studio .NET automatically\
    \ inserts the ByVal keyword for you.\n\n# Reference parameters\n\nWhen you pass\
    \ a parameter by reference, if the method changes its value, the value is also\
    \ changed in the calling method. Here’s an example using a reference parameter\
    \ in C#:\n\n```\npublic void ReferenceParam(ref int age)\n{\n    age++;\n}\n```\n\
    \nAnd in Visual Basic .NET:\n\n```\nPublic Sub ReferenceParam(ByRef age As Integer)\n\
    \    age += 1\nEnd Sub\n```\n\nIn C#, if a method accepts a reference parameter,\
    \ you must specify in the method call that you’re passing the value by reference:\n\
    \nPtDemo.ReferenceParam(ref age);\n\nIn Visual Basic .NET, you don’t have to specify\
    \ you’re passing the value by reference:\n\nPtDemo.ReferenceParam(Age);"
