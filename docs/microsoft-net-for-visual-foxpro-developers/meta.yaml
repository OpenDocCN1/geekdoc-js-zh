  md: 'It''s usually best to specify that a member variable is private. To promote
    practice, if you don''t declare an accessibility modifier, Visual Basic .NET considers
    it private by default. If you want other classes to have access to this field,
    rather than changing the accessibility modifier, you should create a protected
    or public property (for details, see the “Properties” section in Chapter 5, “Object-Orientation
    in C# and Visual Basic .NET”).


    # Value and reference types


    In Chapter 3, “Introduction to C#”, the “Value and reference types” section discussed
    the difference between value and reference types in the .NET Framework. The distinction
    between these two types is the same for all .NET languages—including Visual Basic
    .NET. Refer to this section in 3 for more.


    # The string type


    Although commands used to manipulate a string make it seem like a value type,
    a string is actually a reference type.


    You assign a value to a string variable using a string literal enclosed in double
    quotes:


    ```

    Dim Caption As String = ".NET for VFP Developers"

    ```


    Unlike FoxPro, you can''t use a single quote or square brackets to delimit strings
    (the single quote is reserved for comments in VB .NET). You concatenate strings
    in Visual Basic .NET by using an ampersand (&) or a plus (+) sign (as in VFP):


    ```

    MessageBox.Show(str & " " & str2, "Concatenate with &")

    MessageBox.Show(str + " " + str2, "Concatenate with +")

    ```


    Again, the next logical question is, “How do I create a string literal that contains
    double quotes such as Louis "Satchmo" Armstrong?” You can do this easily by using
    double quote marks consecutively:


    ```

    Dim ManlyMen As String = "Louis"Satchmo" Armstrong"

    ```


    Visual Basic .NET does not recognize any other special character escapes within
    a string (such as "\n" for a new line in C#). For details, see the “String type”
    section in Chapter 3, “Introduction to C#”.


    Rather than character escapes, VB .NET provides enumerated values instead (Table
    2). For details, see the “Enumerations” section later in this chapter.'
