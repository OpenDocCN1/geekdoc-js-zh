  md: "# Chapter 5: Object Orientation in C# and Visual Basic.NET 121\n\nThis code\
    \ declares the variable JackTennysAge, but never stores an initial value. So why\
    \ aren’t output parameters available in VB .NET? Because VB .NET does not require\
    \ you to initialize variables (although it’s a good idea to specify initial values\
    \ anyway!).\n\n# Optional parameters\n\nVisual Basic .NET has a type of parameter\
    \ not available in C#—optional parameters. Optional parameters provide a way to\
    \ specify a particular parameter that is not mandatory. When declaring an optional\
    \ parameter, you must specify a default value in case the caller doesn’t pass\
    \ a value for the optional parameter. For example, here’s a VB .NET method that\
    \ declares a single optional parameter with a default value of 50:\n\n```\nPublic\
    \ Sub OptionalParam(ByVal age As Integer = 50)\n```\n\nAt first, optional parameters\
    \ might seem like a great feature. However, you should probably avoid using them!\
    \ One reason is C# does not recognize optional parameters—it sees them as mandatory,\
    \ just like every other parameter. This is an important consideration if you anticipate\
    \ C clients may be accessing your code. Optional parameters can also introduce\
    \ problems if you ever decide to change the default value of the optional parameter.\
    \ For details, see the MSDN article “Exploiting New Language Features of Visual\
    \ Basic .NET, Part 2” (http://msdn.microsoft.com/msdnag/issues/01/08/instincts0108.asp).\n\
    \nIn reality, avoiding optional parameters is not a real loss. You can actually\
    \ accomplish the same by using overloaded methods.\n\n# Overloaded methods\n\n\
    In Visual FoxPro, all class methods must have unique names. You may be surprised\
    \ to learn this is not true in C# or Visual Basic .NET. Both languages allow you\
    \ to create multiple methods with the same name—as long as the length and type\
    \ of parameters is different. For example, the following code defines a class\
    \ with two methods, both named “DisplayMessage”. In C#:\n\n```\npublic class OverloadedMethodsDemo{\n\
    \    public void DisplayMessage(string message, string caption)\n    {\n     \
    \   MessageBox.Show(message, caption);\n    }\n\n    public void DisplayMessage(string\
    \ message)\n    {\n        this.DisplayMessage(message, \"Application Message\"\
    );\n    }\n}\n```\n\nAnd in Visual Basic .NET:\n\n```\nPublic Class OverloadedMethodsDemo\n\
    ```\n\n```\nPublic Overloads Sub DisplayMessage(ByVal message As String, \nByVal\
    \ caption As String)\n```"
