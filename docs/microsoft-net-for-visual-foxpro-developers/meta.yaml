  md: '# # Chapter 3 Introduction to C#


    Some developers are "afraid" of C# because C-based languages have a reputation
    for being advanced, and therefore difficult to learn and use. This chapter aims
    to dispel any misgivings you might have by providing a side-by-side comparison
    of C# and Visual FoxPro—you will be amazed at their similarities. It will also
    help you leverage your knowledge of Visual FoxPro learning the basics of C#.


    There has been a lot of excitement generated about C#, Microsoft’s newest programming
    .NET language. It is a very clean and elegant implementation of an object-oriented.
    However, new doesn’t mean it’s untested or "went behind the ears". Microsoft put
    C to the test and used it in .NET Framework’s base classes (for the record, the
    .NET Framework could have been written in Visual Basic. C# was chosen because
    most developers working on the .NET Framework were C++ developers and the C# compiler
    was completed before the VB .NET compiler)


