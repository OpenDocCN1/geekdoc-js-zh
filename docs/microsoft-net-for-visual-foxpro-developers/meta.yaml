    While this is incredibly flexible, it has its downside. First of all, from a readability
    perspective, it''s far better to create three different variables to hold each
    of these values, rather than reusing the same variable. Second, and more importantly,
    weak typing allows bugs to sneak through. For example, if you store an integer
    value in MyVariable, and then attempt to run the following code, you''ll get an
    "Operator/operand mismatch" error at runtime:


    ```

    REPLACE CustomerName WITH "Customer " + MyVariable IN Customer

    ```


    You would probably notice this bug quickly when you run the code—but that''s the
    problem—"when you run the code". What if the code never gets run until it''s in
    the end-user''s hands?


    In contrast, C# is a strongly typed language (VB .NET is also a strongly typed
    language). In the world of variables, strong typing means you must declare the
    type of all variables. For example, the following code creates a date variable
    named MyDate, a string named MyString, and an integer variable named MyInteger:


    ```

    DateTime MyDate;

    string MyString;

    int MyInteger;

    ```


    If you do not declare the type of a variable, the C# compiler gives you an error
    and exits without finishing the compilation of your application.


    Another common error in Visual FoxPro coding that causes bugs is using a variable
    without declaring it first. For example, the following code doesn''t declare MyVariable
    before using it:


    ```

    MessageBox("Hello World " + MyVariable, 0+48, "Weak Typing Demo")

