  md: '# Reflection


    In VisualFoxPro, there is a certain freedom and flexibility that comes from specifying
    the class of an object is instantiated at run time. For example, I use an abstract
    factory in my VisualFoxPro applications allowing me to drive my class instantiation.
    I call the abstract factory''s GetClassName method, passing a token specifying
    the kind of class I want to instantiate. The abstract factory looks up this token
    in a table, returning the name of the class I should use. I then pass the class
    name to the CREATEOBJECT command, which instantiates an object from the specified
    class.


    ```

    lcClassName = goApp.factory.GetClassName("SecurityMgr")

    SecurityMgr = CREATEOBJECT(lcClassName)

    ```


    If you are using the new command in C# or in Visual Basic .NET (assuming Option
    Strict is "On"), you are required to specify the type of the class you will instantiate
    at compile time. In C:


    ```

    Customer CustomerObj = new Customer();

    ```


    In Visual Basic .NET:


    ```

    Dim CustomerObj As New Customer()

    ```


    Fortunately, there is a way to achieve VisualFoxPro''s creation flexibility in
    C# and VB .NET by using reflection. .NET reflection supplies objects that encapsulate
    assemblies, modules, and classes, allowing you to dynamically create an instance
    of a class. Some other things you can do with reflection:


    +   * Load assemblies and modules.

    * Retrieve information about class constructors.

    * Retrieve information about class methods and invoke them.

    * Retrieve information about class fields and get/set their values.

    * Retrieve information about class events and add/remove event handlers.

    * Retrieve information about class properties and get/set their values.

    * Retrieve information about method parameters.

    * Generate MSIL code on the fly.


    # Accessing type (class) information


    You get the type information from assemblies already loaded in memory by calling
    the static Type.GetType method. This and other reflection methods return a System.Type
    object you use to derive information about classes.",'
