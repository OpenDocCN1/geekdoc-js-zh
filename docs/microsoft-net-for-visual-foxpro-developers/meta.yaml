    StructDemo1.LastName = "McNeish"

    ```


    ```

    StructDemo2 = New StructDemo

    MessageBox.Show("Structure2 Name: " & StructDemo2.GetName(), "Structure demo");

    ```


    # Deciding between classes and structures


    Structures are value types, so their data is stored on the stack rather than the
    heap. This means you should use a structure only if the object you create has
    a small instance size. Objects large in size should be classes.


    A common use for structure is as a device for passing parameters. If you have
    several parameters you need to pass to a method, you can create a structure with
    a different property to hold each parameter value.


    > Behind the scenes, all value data types such as Boolean, Byte, Int32, and Decimal
    are actually structures!


    # Attributes


    .Attributes allow you to place extra descriptive information in your code that
    the compiler turns into metadata within your project''s assembly. Attributes are
    useful at a variety of levels, such as an assembly, a class, or a class member.
    They can also be applied for a variety of reasons, as you''ll see in this section.'
