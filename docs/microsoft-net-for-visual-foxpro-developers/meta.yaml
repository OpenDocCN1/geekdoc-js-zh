  md: '# .NET for Visual FoxPro Developers


    | C# Source | VB.NET Source | C++ Source |

    |--- | --- | --- |

    | IL | | |

    | .NET CLR | | |

    | Operating System | | |


    **Figure 2.** .NET code is compiled twice; first into MS Intermediate Language
    and again at runtime when the code is executed by the Common Language Runtime


    When MSIL is executed on the end user''s machine, it is compiled again into machine
    code by .NET Just-In-Time (JIT) compiler. The benefit of this approach is that
    CPU-specific JIT compilers can be used to compile the MSIL code into machine code
    that takes advantage of the specific processor on your end-user''s machine. So,
    if the MSIL code is compiled on a machine with a newer processor and more advanced
    capabilities, the JIT compiler can take advantage of these.


    The JIT compiler only compiles code that is to be executed. The resulting executable
    code is cached until the application is exited, so it does not need to be recompiled
    when the same code is executed again. This is different than Visual FoxPro where
    p-code is *interpreted* to machine code when it runs (and does not produce machine
    code that is cached as in .NET).


    # Why .NET for VFP developers?


    Visual FoxPro is a great development tool for building desktop applications, Web
    applications, and Web services. So, why should VFP developers be interested in
    learning and using .NET? This section provides a number of reasons I find most
    compelling.


    # Marketability


    You are probably aware that the number of new Visual FoxPro projects comprises
    a relatively small percentage of the total number of software systems being created.
    In contrast, the need for .NET developers is on the rise and will continue to
    increase over time. Having both Visual FoxPro and .NET skill set can only improve
    your marketability as an employee or consultant.'
