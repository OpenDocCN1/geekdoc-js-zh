    # The FileSystemWatcher class


    Many applications have to perform a particular action when something changes in
    the file system. Often, this takes the form of waiting for a particular file to
    appear in a specified directory. The FileSystemWatcher class is a great class
    for this and other scenarios. Not only can you watch the file system of a local
    computer, but you can also watch files on a network drive or a remote computer.


    You set the Filter property of the FileSystemWatcher class to the name of the
    file you want to watch. If you set the Filter property to an empty string, it
    watches for all files. You set the Filter to watch for a specific type of file
    by specifying an asterisk and a file extension, for example "*.xml".


    The FileSystemWatcher class can watch for a variety of changes, including the
    attributes of a file or folder, the name of a file or directory, the last date/time
    a folder was written to, the size of a file or folder, and so on (**Figure 8**).


    ```

    Watcher.NotifyFilter = NotifyFilters.

    ```


    ![](bbox=[0.095, 0.756, 0.905, 0.893])


    **Figure 8.** The FileSystemWatcher class can watch for a variety of changes including
    in attributes, the last write date and time, the size of a file or directory,
    and the name of a file.'
