  md: '```

    int x;

    int x = 5;

    int y = x;

    ```


    This creates two copies of the same data on the stack. When you declare variable
    x it allocates space for the variable on the stack. When you assign variable x
    a value of 5, it stores a 5 in the allocated space for variable x on the stack.
    When you assign x to y, it allocates space for variable y on the stack and copies
    the value 5 from variable x into the space allocated for variable y. This gives
    you two copies of the same data on the stack.


    The heap is an area of memory used to store reference type data such as classes,
    arrays, and strings. When you declare a reference variable, the runtime allocates
    space for the reference variable on the stack—the same as it does for a value
    type variable. However, when you instantiate the reference type object (see Figure
    2), rather than storing the object''s data on the stack, it is stored on the heap,
    and a pointer to the address of the object''s data is stored in the reference
    variable located on the stack.


    ![](bbox=[0.116, 0.403, 0.801, 0.835])


    Invoice Inv;


    Inv = new Invoice();


    **Figure 2.** When you declare a reference variable, the .NET runtime allocates
    space for the variable itself on the stack. However, when you instantiate the
    object, it stores the object''s data on the heap and stores a pointer to the heap
    data in the reference variable on the stack.'
