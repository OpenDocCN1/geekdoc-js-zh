  md: "# Structures\n\nStructures are similar to classes, but rather being reference\
    \ types, they are value types\n(For more information, see the \"Value and reference\
    \ types\" section in Chapter 3, \"Introduction to C#). Because they are value\
    \ types, they have a slight speed advantage over classes.\nStructures are defined\
    \ in C# as shown in this sample:\n\n```\npublic struct StructureDemo\n{\n    public\
    \ string FirstName;\n    public string MiddleName;\n    public string LastName;\n\
    \n    public string GetName()\n    {\n        return FirstName + \" \" + MiddleName\
    \ + \" \" + LastName;\n    }\n}\n```\n\nAnd in Visual Basic .NET:\n\n```\nPublic\
    \ Structure StructureDemo\n    Public FirstName As String\n    Public MiddleName\
    \ As String\n    Public LastName As String\n\nPublic Function GetName() As String\n\
    \    Return FirstName & \" \" & MiddleName & \" \" & LastName\nEnd Function 'StructureDemo'\n\
    ```\n\nStructures can:\n\n+   - Have properties and methods.\n- Raise and handle\
    \ events.\n- Implement interfaces.\n\nStructures cannot:\n\n+   - Have subclasses.\n\
    - Have protected members (this makes sense because they can't have subclasses).\n\
    \n# Copying structures\n\nBecause structures are value types, you can copy values\
    \ from one structure to another by simply assigning one structure variable to\
    \ another. For example, the following code"
