    # Case insensitivity


    Visual Basic .NET is like Visual FoxPro in that it is case insensitive. Although
    the convention in VB .NET is proper to case keywords, you can make them upper
    case, lower case, or anything in between and the compiler treats them all the
    same. In C#, keywords are in lower case. If you use upper case or mixed case,
    the compiler flags it as an error.


    To demonstrate case insensitivity, in the code I have declared a variable, "MyString",
    and assigned it a value. In the next line, I refer that variable, but I refer
    to it as "mystring" (all lowercase). In VB .NET and Visual FoxPro, these two names
    refer to the same variable:


    ```

    Dim MyString As String = "Visual Basic .NET is case-insensitive"

    Console.WriteLine("mystring")

    ```


