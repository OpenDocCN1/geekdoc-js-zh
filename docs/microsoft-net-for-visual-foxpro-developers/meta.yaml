- img_proc: false
  md: 'As discussed in the .NET Help file, DataSets are good for situations where
    you are working with multiple tables, multiple data sources, moving data between
    application tiers, exchanging data with other applications, and binding to user
    interface controls.


    # Accessing data with a DataReader


    As mentioned earlier, when you use a DataReader object, you first work with a
    data command object that returns a DataReader to you.


    Depending on the type of data you''re working with, there are three main .NET
    data command classes to choose from—the SqlCommand class (for accessing SQL Server),
    the OracleCommand class (for accessing Oracle data), and the OleDbCommand class
    (for accessing OLE DB data sources).


    The basic steps for accessing data using this DataReader and Command object are:


    +   1. Create a connection to the data source.

    2. Configure a data command object with a SQL statement or the name of a stored
    procedure to be executed.

    3. Execute the data command.

    4. If the command returns a DataReader, use it to retrieve the result set.

    5. Close the DataReader and the connection.


    The following sections provide details for each of these steps. Rather than giving
    samples using SQL Server, Oracle, and OLE DB data sources, the sample code in
    the following sections demonstrates accessing SQL Server. To translate the samples
    into code that works with OLE DB, you simply replace the “Sql" prefix of all class
    names with “OleDb" instead. To translate the samples into code that works with
    Oracle, substitute the "Sql" prefix with "Oracle"


    > If you haven''t learned about error handling yet (and to make the samples easier
    to read), I haven''t included any error handling code—which you should definitely
    include in your real-world data access code. For details on error handling, see
    Chapter 13, “Error Handling and Debugging in .NET".


    In all of the sample code throughout this chapter, you need to specify you are
    using classes from the following namespaces:

    In C#:


    ```

    using System;

    using System.Data;

    using System.Data.SqlClient;

    using System.Data.SqlTypes;

    using System.Windows.Forms;

    ```'
