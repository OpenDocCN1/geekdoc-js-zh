    # Declaring variables


    Variables declared within methods are known as local variables (there are no other
    kind). They are only visible within the method where they are declared. This is
    different from Visual FoxPro, which allows you to declare variables within a method
    that are local, private, or global.


    > Having only local variables at your disposal in both Visual Basic .NET and C#
    is not restrictive. Good programming practice dictates that you should always
    declare method variables as local. In Visual FoxPro, rather than using private
    "mystery" variables, if you want a sub method to see a variable, you should pass
    it explicitly as a parameter.


    To declare a local variable, use the Dim statement followed by the variable name,
    the As keyword, and the type of the variable:


    ```

    Dim Count As Integer Declare an integer variable named Count

    Count = 5 Assign Count the value of 5

    ```


    You can also declare a variable and assign it a value in a single command:


    ```

    Dim Height As Integer = 6 '' Declare an int variable and assign it a value of
    6

    ```


    If you want to declare multiple variables of the same type in a single statement,
    simply separate them with commas:


    ```

    Dim Top, Left As Integer

    ```'
