  md: "# 196 .NET for Visual FoxPro Developers\n\nThe events you can watch are for\
    \ change, create, delete, and rename. In order to respond to these events, you\
    \ must add event handlers to the FileSystemWatcher, Created, Deleted, and Renamed\
    \ events. For example, in the following code, the WatchFile method configures\
    \ a FileWatcher to watch for any .xml files created in the c:\\ directory. It\
    \ adds an event handler named OnCreated to the FileWatcher's Created event. Also\
    \ notice the watcher's EnableRaisingEvents property must be set to true before\
    \ it begins watching. Here's the code in C#:\n\n```\npublic class FileSystemWatcherDemo\n\
    {\n    public void WatchForFile()\n    {\n        // Configure the FileSystemWatcher\n\
    \        FileSystemWatcher Watcher = new FileSystemWatcher();\n        Watcher.Path\
    \ = \"c:\\\";\n        Watcher.Filter = \"*.xml\";\n        Watcher.NotifyFilter\
    \ = NotifyFilters.FileName\n\n        // Add an event handler to the Created event\n\
    \        Watcher.Created += new EventHandler(OnCreated);\n\n        // Start watching!\n\
    \        Watcher.EnableRaisingEvents = true;\n    }\n\n    public static void\
    \ OnCreated(object source, FileSystemEventArgs e)\n    {\n        MessageBox.Show(\"\
    New file created: \" + e.Name);\n    }\n}\n```\n\nHere's the code in Visual Basic.NET:\n\
    \n```\nPublic Sub WatchForFile()\n    ' Configure the FileSystemWatcher\n    Dim\
