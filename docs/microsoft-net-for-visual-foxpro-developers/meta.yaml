  md: "Given this hierarchy, you can declare a variable of type ABusinessObject and\
    \ store a reference to either the Client or Invoice object in this variable.\n\
    In C#:\n\n```\nABusinessObject BizObj;\nBizObj = new Client();\nBizObj = new Invoice();\n\
    ```\n\nAnd in Visual Basic .NET:\n\n```\nDim BizObj As ABusinessObject\nBizObj\
    \ = New Client()\nBizObj = New Invoice()\n```\n\nThis technique allows you to\
    \ write more generic code that works with families of objects, making use of object-oriented\
    \ polymorphism rather than coding to a specific class.\n\n# Hiding inherited methods\n\
    \nSo far, you've learned about overiding and extending inherited methods. However,\
    \ there are other situations where you may want to completely hide an inherited\
    \ method and redeclare it.\nTo hide an inherited method in C#, use the new keyword\
    \ in the method declaration:\n\n```\npublic class HideMethodDemo : MyBaseClass\n\
    {\n    public new void DisplayMessage()\n    {\n        MessageBox.Show(\"Subclass\
    \ method!\",\"Hide method demo\");\n    }\n}\n```\n\nTo hide an inherited member\
    \ in Visual Basic .NFT, use the shadows keyword in the method declaration:\n\n\
    ```\nPublic Class HideMethodDemo\nInherits MyBaseClass\n    Public Shadows Sub\
    \ DisplayMessage()\n        MessageBox.Show(\"Subclass method!\",\"Hide method\
    \ demo\")\n        MyBase.DisplayMessage()\nEnd Sub\n```\n\nIn what situations\
    \ might you choose to completely hide an inherited method? First of all, you can\
    \ use it to override a method not marked as virtual (or Overridable). Although\
    \ I said earlier only virtual methods can be overridden, you can get around this\
    \ rule by redeclaring a method with the new or shadows keyword."
