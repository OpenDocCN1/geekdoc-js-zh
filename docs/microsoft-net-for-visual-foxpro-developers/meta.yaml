  md: '# The System.IO namespace


    The System.IO namespace contains classes that allow you to read and write to files
    and data streams, as well as classes for working with directories and paths (Figure
    6).


    ![](bbox=[0.085, 0.165, 0.895, 0.535])


    Figure 6. System.IO namespace contains classes that allow you to read and write
    files and data streams.


    # The Directory and DirectoryInfo classes


    If you need to create, manipulate, or retrieve directory information, the Directory
    class provides this capability. The Directory class has static methods that allow
    you to:


    +   - Create directories

    - Get and set the current working directory

    - Delete a directory and its contents

    - Determine whether a directory exists

    - Retrieve a list of subdirectories

    - Retrieve a list of files in a specified directory

    - Move a file or directory and its contents to a new location


    For example, the following code retrieves and displays the current working directory,
    sets the current directory to "c:\" and displays it, and then restores the original
    directory.'
