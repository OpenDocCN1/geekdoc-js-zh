  md: "```\nPublic Sub CreateAppSettingsObj()\n    Me.AppSettingsObj = New AppSettingsRegistry()\n\
    End Sub 'CreateAppSettingsObj'\nEnd Class 'MyApp'\n```\n\nThis code declares a\
    \ class named \"MyApp\" with a field named \"AppSettingsObj\" of the type AppSettingsBase—the\
    \ abstract class defined in the previous section. This field holds a reference\
    \ to the application settings object. In the constructor of this class, a call\
    \ is made to the CreateAppSettingsObj method containing that creates an instance\
    \ of AppSettingsRegistry and stores it in AppSettingsObj field. This is the only\
    \ method in your application that needs to know the specific concrete class that\
    \ was instantiated. All other code in your application references the application\
    \ settings object as if it were of the type AppSettingsBase.\n\nIf you add new\
    \ members to concrete subclasses, you can't access those members when referencing\
    \ an object by the abstract base class type. To keep your code as generic as possible,\
    \ try to add methods at the abstract level rather than the concrete level.\n\n\
    The real beauty of this design is its extensibility. Imagine you later decide\
    \ to save application settings to a DB, rather than the Registry. All you have\
    \ to do is create a new concrete subclass of AppSettingsBase (for example, AppSettingsDbf)\
    \ to access settings stored in a DB and change the code in the CreateAppSettingsObj\
    \ to instantiate the new class.\nIn C#\n\n```\npublic virtual void CreateAppSettingsObj()\n\
    {\n    this.AppSettingsObj = new AppSettingsDbf();\n}\n```\n\nAnd in Visual Basic\
    \ .NET:\n\n```\nPublic Overridable Sub CreateAppSettingsObj()\n    Me.AppSettingsObj\
    \ = New AppSettingsDbf()\nEnd Sub 'CreateAppSettingsObj'\n```\n\nThis makes your\
    \ application far more extensible, and maintainable.\n\n# Programming to an interface\
    \ rather than an implementation\n\nWhat you have just seen is an example of “programming\
    \ to an interface rather than an implementation”. This concept is commonly discussed\
    \ in object-oriented books, but I find many developers have difficulty understanding\
    \ this concept.\n\n“Programming to an implementation,” is undesirable. It means\
    \ writing software hard-coded to a specific concrete functionality. For example,\
    \ you might hard-code reading and writing application settings to an XML file."
  merge: -1
