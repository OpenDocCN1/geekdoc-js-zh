    # Comparer and CaseInsensitiveComparer classes


    The Comparer class performs a case-sensitive comparison of two objects of the
    same type. The CaseInsensitiveComparer performs a case-insensitive comparison
    of two objects of the same type. Each class has a Compare method which allows
    you to pass two objects to be compared. It returns a -1 if the first value is
    less than the second value, a zero if the two objects are equal, and a 1 if the
    first value is greater than the second value.


    The following example shows the comparison of the same two strings using each
    class. In C#:


    ```

    int CompValue1 = Comparer.Default.Compare("new york", "New York");

