  md: "# Chapter 5: Object Orientation in C# and Visual Basic.NET 125\n\nIn C#:\n\n\
    ```\npublic class BaseClassDemo : Component\n{\n}\n```\n\nIn Visual Basic .NET:\n\
    \n```\nPublic Class BaseClassDemo\nInherits Component\nEnd Class\n```\n\nThis\
    \ code defines a class named BaseClassDemo derived from the .NET Framework's Component\
    \ class (System.ComponentModel.Component). In C#, you declare a base class by\
    \ placing a colon followed by the base name (: Component) as in the first line\
    \ of the class declaration. In Visual Basic .NET, you use the keyword Inherits\
    \ followed by the base name on the second line of the class declaration.\n\nInheritance\
    \ works the same way in .NET as it does in Visual FoxPro. A subclass inherits\
    \ all members (properties, events, methods, and fields) from its base class, including\
    \ implementation code.\n\n# Overriding inherited methods\n\nAt times, you may\
    \ want a class to override an inherited method. In Visual FoxPro, the simple act\
    \ of placing a colon space in a method causes the method to be overridden. Unfortunately,\
    \ in VFP it takes a single space character to unintentionally override a parent\
    \ method.\n\nYou can “accidentally” override a method in C# and Visual Basic .NET\
    \ by creating a method in a class with the same name and signature as an inherited\
    \ method. For example, the following code declares a class named MyBaseClass with\
    \ a single method named DisplayMessage. It also declares a subclass of MyBaseClass\
    \ named OverrideMethodDemo that contains a duplicate DisplayMessage method.\n\n\
    In C#:\n\n```\npublic class MyBaseClass\n{\n    public void DisplayMessage()\n\
    \    {\n        MessageBox.Show(\"Base class method!\", \"Override demo\");\n\
    \    }\n}\npublic class OverrideMethodDemo : MyBaseClass\n{\n    public void DisplayMessage()\n\
    \    {\n        MessageBox.Show(\"Subclass method!\", \"Override demo\");\n  \
    \  }\n}\n```"
  merge: -1
  pgno: 154
- img_proc: false
  md: "# 126 .NET for Visual Pro Developers\n\nIn Visual Basic .NET:\n\n```\nPublic\
    \ Class MyBaseClass\n    Public Sub DisplayMessage()\n        MessageBox.Show(\"\
    Base class method!\", \"Override Demo\")\n    End Sub\nEnd Class\n\nPublic Class\
    \ OverrideMethodDemo\n    Public Sub DisplayMessage()\n        MessageBox.Show(\"\
    Subclass method!\", \"Override Demo\")\n    End Sub\nEnd Class\n```\n\nWhen you\
    \ run this code, the OverrideMethodDemo.DisplayMessage method is executed, but\
    \ the base class method is not. In reality, this is not a legal way to override\
    \ a method in either C# or Visual Basic .NET. In both languages, the compiler\
    \ catches this error and displays it as a warning (**Figure 4**).\n\ncannot override\
    \ inherited member 'DisplayMessage()' because it is not virtual, abstract, or\
    \ override (C#) 'DisplayMessage' overrides a sub in the base class 'MyBaseClass'\
    \ that is not declared 'Overridable'. (VB .NET)\n\n**Figure 4** The C# and VB\
    \ .NET compilers display a warning if you create a method in a class with the\
    \ same name and signature as an inherited method.\n\nThe following code demonstrates\
    \ the proper syntax for overriding methods using the `override` keyword (C#) or\
    \ the `Overrides` keyword (VB .NET) in the method declaration. In C#:\n\n```\n\
    public class MyBaseClass\n{\n    public virtual void DisplayMessage()\n    {\n\
    \        MessageBox.Show(\"Base class method!\", \"Override demo\")\n    }\n}\n\
    public class OverrideMethodDemo : MyBaseClass\n{\n    public override void DisplayMessage()\n\
    \    {\n        MessageBox.Show(\"Subclass method!\", \"Override demo\")\n   \
    \ }\n}\n```\n\nAnd in Visual Basic .NET:\n\n```\nPublic Class MyBaseClass\n  \
    \  Public Overridable Sub DisplayMessage()\n        MessageBox.Show(\"Base class\
    \ method!\", \"Override Demo\")\n    End Sub\nEnd Class\n```"
  merge: -1
  pgno: 155
- img_proc: false
  md: "# Chapter 5: Object Orientation in C# and Visual Basic.NET 127\n\n```\nPublic\
    \ Class OverrideMethodDemo\nInherits MyBaseClass\n  Public Overrides Sub DisplayMessage()\n\
    \    MessageBox.Show(\"Subclass method!\",\"Override Demo\")\n  End Sub\nEnd Class\n\
    ```\n\nWhen you instantiate the OverrideMethodDemo class and run its DisplayMessage\
    \ method, the code in the OverrideMethod subclass is executed, but the DisplayMessage\
    \ method in the parent is not executed.\n\n# Virtual (Overridable) methods\n\n\
    Virtual methods can be overridden by a subclass. In Visual FoxPro, all methods\
    \ are virtual because you can inherit any public or protected method by placing\
    \ code in the method of the subclass. There is no such as a \"non-virtual\" method\
    \ in Visual FoxPro.\nin contrast, methods are non-virtual in C# and VB .NET and\
    \ cannot be overridden. To override a method, it must be specifically marked as\
    \ virtual (C#) or Overridable (VB .NET) in the base class. If you look closely\
    \ at the code in the previous section, you will see the DisplayMessage method\
    \ in MyBaseClass was marked virtual (Overridable for VB .NET).\n\n> If you override\
    \ a virtual method, the method in the subclass marked \"override\" is automatically\
    \ virtual too.\n\n# Extending inherited methods\n\nMore than that, you extend\
    \ rather than completely override an inherited method. In Visual FoxPro you accomplish\
    \ this by placing code in the method, issuing a DOFAULT command. You can run DOFAULT\
    \ first, before executing your subclass code, or you can run your code first,\
    \ and then issue a DOFAULT.\n\nTo call a base class method in C#, you use the\
    \ base keyword:\n\n```\npublic class CallBaseMethodDemo : MyBaseClass\n{\n  public\
    \ override void DisplayMessage()\n  {\n    MessageBox.Show(\"Subclass method!\"\
    ,\"Call base method demo\")\n    base.DisplayMessage();\n  }\n}\n```\n\nTo call\
    \ a base class method in VB .NET, you use the MyBase keyword:\n\n```\nPublic Class\
