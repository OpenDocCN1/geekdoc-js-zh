  md: "Be judicious when deciding to hide an inherited method. If a base class method\
    \ has not been marked as \"virtual\", the developer may have a good reason for\
    \ not allowing you to override the method. Test your code well!\n\nFor example,\
    \ the following code declares a class named BaseClass with a single non-virtual\
    \ method named \"DisplayMessage\". It then declares a subclass of HideMethodBase\
    \ named \"HideMethodDemo\" that redeclare the DisplayMessage method. This method\
    \ even contains a call to the base class DisplayMessage method! In C#:\n\n```\n\
    public class HideMethodBase{\npublic void DisplayMessage(){\n  MessageBox.Show(\"\
    Base class method!\", \"Override demo\");\n}\nublic class HideMethodDemo : HideMethodBase{\n\
    \  new void DisplayMessage(){\n  MessageBox.Show(\"My new method\", \"Hide method\
    \ demo\");\n  base.DisplayMessage();\n}}\n```\n\nIn Visual Basic .NET:\n\n```\n\
    Public Class HideMethodBase\n  Public Sub DisplayMessage()\n    MessageBox.Show(\"\
    Base class method!\", \"Override demo\")\n  End Sub\nEnd Class\nPublic Class HideMethodDemo\n\
    \  Inherits HideMethodBase\n  ' Hide the DisplayMessage method in the base class\n\
    \  Public Shadows Sub DisplayMessage()\n    MessageBox.Show(\"My new method\"\
    , \"Hide method demo\")\n    MyBase.DisplayMessage()\n  End Sub\nEnd Class\n```\n\
    \nThere’s one \"gotcha\" when hiding an inherited method in this way. If you use\
    \ the polymorphic trick of declaring a variable of the type HideMethodBase, but\
    \ you actually instantiate an instance of the HideMethodDemo subclass instead,\
    \ you get unexpected behavior when calling the DisplayMessage method."
