    # Boxing and unboxing values


    Boxing describes the process of converting a value type to a reference type. Unboxing
    describes converting the value of a reference type back to a value type. Boxing
    occurs implicitly when you store an integer type into an object:


    ```

    int i = 10;

    object o = i;

    ```


    Figure 4 demonstrates what happens when this code is executed. In the first line,
    space for int "i" and a value of 10 is assigned to the variable. In the second
    line, a reference variable for object "o" is allocated on the stack, and the value
    of 10 is copied from integer "i" to the space allocated on the heap for object
    "o"s data.


    ![](bbox=[0.131, 0.433, 0.884, 0.725])


    **Figure 4.** Value types can be implicitly boxed when you store the value of
    an integer (or other value type) into an object.


    Unboxing only occurs explicitly. You can only unbox a variable that has been previously
    boxed. For example:


    ```

    // Boxing

    int MyInteger = 10;

    object MyObject = MyInteger;


    // Unboxing

    int MyUnboxedInt = (int)MyObject;

    ```'
