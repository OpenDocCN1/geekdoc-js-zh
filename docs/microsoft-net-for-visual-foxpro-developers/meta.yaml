  md: 'Chapter 4: Introduction to Visual Basic .NET 107


    CType is a Visual Basic .NET function that allows you to convert an expression
    to a data type, an object, structure, class, or interface. The CType function
    accepts two parameters. the first parameter is an expression to be converted.
    This first parameter contains an object reference. the second parameter is the
    destination type you want the expression converted. For example, the following
    code converts integer to decimal:


    ```

    Dim x As Integer = 100

    Dim y As Decimal = CType(x, Decimal)

    ```


    # Converting to string


    If you need to convert a value to a string, the Object class has a ToString method
    that is inherited by all classes in the .NET Framework. This method returns the
    string representation of the object. So, for example, do the following to get
    a string representation of an integer:


    ```

    Dim i As Integer = 10

    Dim s As String = i.ToString()

    ```


    # Converting strings with Val


    If you need to convert strings to value types, you can use one of the conversion
    keywords listed in the "Explicit type conversion" section earlier in this chapter.
    In addition, you can use the Val function, which is a little more forgiving when
    it comes to converting strings to numeric values—it lets you convert strings that
    contain both numeric and character values.


    Val() stops converting a string when it hits a character that it can''t recognize
    as part of a number. In the following example, the string containing the value
    "567 Test" is converted by the Val() function. The resulting value is 567:


    ```

    Dim i As Double

    Dim z As String = "567 Test"

    i = Val(z)      Returns 567

    ```


    # Boxing and unboxing in Visual Basic .NET


    As described previously, boxing is the process of converting a value type to a
    reference type. Unboxing is the process of converting the value of a reference
    back to a value type.

    For example, Boxing occurs implicitly when you store an integer into an object:


    ```

    Dim x As Integer

    Dim y As Object = x

    ```


    For a diagram showing what happens in memory when a value is boxed, check out
    "Boxing and unboxing values" in Chapter 3, "Introduction to C#"

    In Visual Basic .NET, you cannot explicitly unbox values the same way as you can
    in C#.'
