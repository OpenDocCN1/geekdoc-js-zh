  md: 'When you create a new project in Visual Studio .NET, a file named Assembly.cs
    (or Assembly.vb) is automatically added to your project. This file contains attributes
    that apply to the entire assembly.


    Here is an excerpt from a C# Assembly.cs file:


    ```

    [assembly: AssemblyTitle("")]

    [assembly: AssemblyDescription("")]

    [assembly: AssemblyCompany("")]

    [assembly: AssemblyProduct("")]

    [assembly: AssemblyCopyright("")]

    [assembly: AssemblyTrademark("")]

    ```


    And from a Visual Basic .NET Assembly.vb file:


    ```

    <Assembly:AssemblyTitle("") />

    <Assembly:AssemblyDescription("") />

    <Assembly:AssemblyCompany("") />

    <Assembly:AssemblyProduct("") />

    <Assembly:AssemblyCopyright("") />

    <Assembly:AssemblyTrademark("") />

    ```


    The keyword `assembly` indicates these attributes are applied at the assembly
    level. If you want to enter a description within the double quotes for each attribute,
    the compiler turns the description into metadata within your project''s assembly.
    If you want a quick way to view this information, you can use the Intermediate
    Language Disassembler (IL DASM) discussed in Chapter 1, "NET." This tool is located
    in the FrameworkSDK\ folder the directory on your machine containing the .NET
    Framework.

    To launch the disassembler, just double-click the ildasm.exe file. To open an
    assembly, select File | Open from the menu. ... double-click the MANIFEST node
    (**Figure 16**).


    ![](bbox=[0.095, 0.623, 0.904, 0.748])


    **Figure 16.** You can view assembly-level attributes using the Intermediate Language
    Disassembler.


    This opens a window containing IL code, along with comments displaying the attribute
    text. Although this is interesting, the most practical way to examine attributes
    is at runtime by means of *reflection*. For more information, see the "Reflection"
    section later in this chapter.


    Believe it or not, attributes are actually classes. The .NET Framework class library
    contains a few hundred attribute classes for all occasions! All attribute classes
    are derived from the System.Attribute class.'
