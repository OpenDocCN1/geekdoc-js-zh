  md: '# Sorting arrays


    You easily sort the elements of an array by calling the Array class'' Sort method:


    ```

    Array.Sort (KidsNames)

    ```


    You reverse the sort order by calling the Array class'' Reverse method:


    ```

    Array.Reverse (KidsNames)

    ```


    # Multidimensional arrays


    In Visual FoxPro, you can create one and two-dimensional arrays. Visual Basic
    .NET allows you to create multidimensional arrays—arrays with three or more dimensions.


    Multidimensional arrays are rectangular (every row has the same number of columns)
    or jagged (each row can have a different number of columns).


    # Defining multidimensional rectangular arrays


    In .NET, you declare a multidimensional, rectangular array by adding one or more
    commas in the parentheses of the array declaration. Each comma you add specifies
    an additional array dimension. Here is the definition of a two-dimensional, rectangular
    array:


    ```

    Dim Kids() As String = {{\Jordan", "McNeish"}, \n  {"Timothy", "McNeish"}, \n  {"Alexander",
    "McNeish"}}

    ```


    # Defining jagged arrays


    A jagged array is an "array of arrays". They are also multidimensional arrays,
    but each row can have a different number of columns. You define a jagged array
    by adding an extra set of parentheses for each dimension. In the following example,
    the jagged array has three elements in its first dimension. Its second dimension
    has a different size for each row. The first row has three columns, the second
    row has two columns, and the third row has one column:


    ```

    Dim Musicians() As String = {{"Stevie", "Ray", "Vaughn"}, \nNew String({"Jimi",
    "Hendrix"}, \nNew String({"Bono"})

    ```


    ```

    '' Show all three names of the first musician

    MessageBox.Show(Musicians(0)(0) + " " + & \nMusicians(0)(2), "Jagged Arrays")

    ```


    # Type conversions


    When working with strongly typed languages, converting between different data
    types is an important consideration. VB .NET provides both implicit and explicit
    type conversion.'
