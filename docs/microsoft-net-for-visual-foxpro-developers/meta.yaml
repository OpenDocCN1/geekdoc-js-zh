  md: '# Chapter 1: Introducing .NET 5


    # ASP.NET


    If you do nothing else with NET, you may be interested in creating Web applications
    using ASP.NET. Microsoft has a lot of energy into ASP.NET making it much better
    than its predecessor, ASP. Rather than using scripting languages to create Web
    applications, you can use a fully object-oriented .NET language such as C# or
    VB .NET.


    If you learn how to create .NET Windows Forms applications using Visual Studio
    .NET, you can use the same set of skills and familiar IDE to create Web Forms
    applications and XML Web services, which regularly learning your curve.


    # Building middle-tier components


    Visual FoxPro is a great tool for building middle-tier components based on its
    data access and string manipulation speed (which is great for XML). However, Visual
    FoxPro components are COM (Component Object Model) based. After several years
    of working with COM components, I can tell you they are a real pain in the neck!
    Here are my “three strikes” against VFP COM components:


    +   1. They’re a pain to debug. To figure out what’s going inside of a COM component,
    you typically have to use STRTOFILE to output the value of variables to a text
    file in order to determine why a COM component isn’t working. This is enough to
    make a man cry.


    +   2. They take you to DLL hell and back again. First of all, COM DLLs must be
    registered in the Windows Registry, and sometimes (for reasons unknown) the registration
    process doesn’t work. It also means that if you have multiple versions of the
    same DLL on a single machine you can run into versioning problems.


    +   3. You can’t take advantage of COM+ object pooling because Visual FoxPro’s
    threading model—this is also true of Visual Basic 6. Object pooling allows COM+
    to recycle or reuse middle-tier components. When a middle-tier object releases
    itself, COM+ places it in an object pool so other clients can use it. Note that
    COM+ is still the technology used to host middle-tier components—even .NET components!


    .NET addresses of these issues:


    +   1. You can easily debug .NET components with Visual Studio .NET. In fact,
    the debugger allows you to step through code written in any .NET language. For
    example, you can step through client code in VB .NET that calls a method in a
    C# component.


    +   2. .NET component DLLs are self-describing and do not need to be registered
    in the Windows Registry. Typically, you will only need to copy a .NET DLL to a
    machine and it just works!


    +   3. .NET components can be hosted in the COM+ environment and can be pooled.'
