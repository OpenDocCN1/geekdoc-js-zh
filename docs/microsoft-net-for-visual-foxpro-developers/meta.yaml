    # The HashTable class


    So far, the collections you have examined allow only to store the equivalent of
    a single array column. This can be somewhat limiting when you have multiple elements
    of the same value you want to distinguish in a unique way. This is where the HashTable
    comes to the rescue.


    The HashTable allows you to create a collection of key-and-value pairs organized
    based on the hash of the key. The following example creates a HashTable and adds
    three key-value pairs to it. Afterwards, it retrieves the "Oranges" using the
    key "A2".


    Here''s the code in C#:


    ```

    // Create the Hash Table and add three key-value pairs

    HashTable HTable = new HashTable();

    HTable.Add("a1", "Apples");

    HTable.Add("a2", "Oranges");

    HTable.Add("a3", "Pears");

    ```


    ```

    // Get a value based on a key

    string Item = (string)HTable["a2"];

    ```


    And here it is in Visual Basic .NET:


    ```

    '' Create the Hash Table and add three key-value pairs

    Dim HTable As New HashTable()

    HTable.Add("a1", "Apples")

    HTable.Add("a2", "Oranges")

    HTable.Add("a3", "Pears")

    ```


    ```

    '' Get a value based on a key

    Dim Item As String = CStr(HTable("a2"))

    ```


    Notice when the string value is retrieved from the HashTable in the last line
    of code, it must be cast to a string. This is necessary because it was added to
    the HashTable as a string? Because each key-value pair comprises a single element
    of a HashTable and the element is of type DictionaryEntry.


