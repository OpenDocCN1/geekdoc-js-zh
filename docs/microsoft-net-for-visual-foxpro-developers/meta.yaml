    \ = \"*.xml\"\n    Watcher.NotifyFilter = NotifyFilters.FileName\n\n    ' Add\
    \ an event handler to the Created event\n    AddHandler Watcher.Created, AddressOf\
    \ OnCreated\n\n    ' Start watching!\n    Watcher.EnableRaisingEvents = True\n\
    End Sub ''WatchForFile\n```\n\n```\n' Event handler for FileSystemWatcher Created\
