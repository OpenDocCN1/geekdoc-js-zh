  md: '# Chapter 4: Introduction to Visual Basic .NET 103


    You can also declare an array and size it in one step:


    ```

    Dim KidsNames(2) As String

    ```


    If you compare this line of VB .NET code to the C# code, you''ll notice a difference
    in the declared size of the array. In C#, I would set the size of the array to
    3 (elements). Here, it looks like I''ve sized the array to only contain only two—however,
    this is not the case. In order to maintain backward compatibility with Visual
    Basic 6, the way you declare arrays in Visual Basic is slightly different from
    other .NET languages.


    When you declare the size of an array in VB .NET, you declare the upper limit
    of the array rather than the total number of elements. For example, in the KidsNames
    array declared here, I want three elements. Since arrays are zero-based, the first
    element is zero, the second element is one, and the last element is two. In VB
    .NET, I use this upper element value to specify the size of the array.


    Although this is non-standard, this concession was made by Microsoft''s VB .NET
    engineers to allow backward compatibility with Visual Basic 6.


    # Redimensioning arrays


    Unlike C#, you can change the size of any array dimension using VB .NET''s ReDim
    statement. The following code shows how to dimension and redimension an array:


    ```

    Dim ScaryAnimals() As String = "Lions", "Tigers"

    ReDim Preserve ScaryAnimals(2)

    ```


    The first line of this code dimensions the array size to two implicitly, since
    I have specified two string elements (Lions and Tigers). The second line redimens
    the array to hold three elements (remember, VB .NET''s idiosyncyncy—you specify
    the highest element number rather than the total number of elements). Notice the
    use of the keyword Preserve. If you do not add this keyword, VB .NET clears the
    other array elements when you redimension the array. Note that ReDim can only
    be used on an existing array—you can''t initialize a new array by using ReDim.
    Also, you can only change the size of an array dimension using ReDim; you can''t
    change the number of dimensions.


    # Storing values to arrays


    You set initial values of array elements when you declare an array:


    ```

    Dim KidsNames(2) As String = "Christopher", "Mark", "James"

    ```


    Or, you can store values in the array elements after declaring the array:


    ```

    Dim KidsNames(2) As String

    KidsNames(0) = "Jordan"

    KidsNames(1) = "Timothy"

    KidsNames(2) = "Alexander"

    ```'
