    # C# syntax


    In this section, I''ll give you an overview of C#''s syntax compared to Visual
    FoxPro''s. I''ll start by showing you the two things that take the most getting
    used to in C#.


    # Case sensitivity


    Visual FoxPro is a case-insensitive language. The following code declares a variable
    "CString" and assigns it a value. In the line, which you use, but I refer to it
    as "mystring" (all lowercase). In Visual FoxPro, the two names refer to the same
    variable.


    ```

    CString = VisualFoxPro is case-insensitive

    MESSAGEBOX(mystring, 0,48, "Case insensitive")

    ```


    C# is a case-sensitive language. "CString" and "mystring" refer to two different
    variables. In all, keywords are in lower case. If you enter a keyword with mixed
    case, the compiler flags it as an error. Some developers have a hard time getting
    used to C#''s case sensitivity. However, if you already use case-sensitive code
    in Visual FoxPro, it''s not as big an issue.


    # Semicolons and multi-line statements


    In Visual FoxPro, you don''t need to put an ending character after each statement.
    However, if a single statement continues over multiple lines, you need to add
    a semi-colon, which is Visual FoxPro''s continuation character:


    ```

    MESSAGEBOX("This command continues " + ;

    "to another line", 0,48, "Continuation Character")

