    the Inv variable to the Inv2 variable, it first allocates space for the Inv2 variable
    on the stack. Afterwards, it adds a pointer to the same data pointed to by the
    Inv variable.


    # Value and reference type performance


    Primitive base types such as integers, bool, decimal, and char are value types
    and provide better performance because you don''t have the overhead of creating
    an object on the stack every time you use one of these types.


    # The string type


    The string class is a reference type; although from all outward appearances, the
    commands you use to manipulate strings make them seem like value types.


    You can assign a value to a string variable using a string literal enclosed in
    double quotes:


    ```

    string Caption = ".NET for VFP Developers";

    ```


    Unlike Visual FoxPro, you can''t use single quotes or square brackets to delimit
    strings. You concatenate strings in C# the same way as in VFP—by using a plus
    (+) sign:


    ```

    string Title = "Sir"

    string Name = Title + "Laurence Olivier";

    ```


    The next logical question is "How do I create a string literal that contains double
    quotes as Louis "Satchmo Armstrong"? This requires the use of character escapes.

    Table 2 shows a list of special characters called escape characters that you can
    add to a string. For example to add a line break to a string, use the \n character
    escape. The following code adds a new line between the city/state and the zip
    code:


    ```

    string CityStateZip = "Charlottesville, VA \n22903";

    ```


    To answer the original question, you can display double quotes contained within
    a string by using the double escaped character \":


    ```

    string ManlyMen = "Louis \"Satchmo\" Armstrong";

    ```'
