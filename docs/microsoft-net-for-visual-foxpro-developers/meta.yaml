  md: "parameters that can be passed to the method. This is much cleaner than having\
    \ a single method checking which parameters have been passed.\n\n# Constructor\
    \ methods\n\nAll Visual FoxPro classes possess an Init method that automatically\
    \ executes when a class is instantiated. C# and VB .NET also have constructor\
    \ methods that perform a similar function. In C#, you declare a constructor method\
    \ by adding a method with the same name as the containing class:\n\n```\npublic\
    \ class ConstructorDemo\n{\n    public ConstructorDemo()\n}\n```\n\nIn Visual\
    \ Basic .NET, you declare a constructor by adding a New method to the class definition:\n\
    \n```\nPublic Class ConstructorDemo\n    Public Sub New()\nEnd Class\n```\n\n\
    I actually prefer the VB .NET convention, because it's easier to quickly identify\
    \ a constructor that's consistently named the same. Notice in both code samples\
    \ neither constructor specifies a return value. This is because .NET constructors\
    \ are not allowed to return values unlike Visual FoxPro where you can return a\
    \ boolean False to prevent a class from instantiating.\n\n# Constructors with\
    \ parameters\n\nAs Visual FoxPro, you can specify parameters for constructor methods\
    \ in .NET. This allows you to pass values to a class when it is first instantiated.\
    \ Here's an example in C#:\n\n```\npublic class ConstructorDemo\n{\n    private\
    \ string connectString;\n    public ConstructorDemo(string connect)\n    {\n \
    \       this.connectString = connect;\n    }\n}\n```\n\nAnd in Visual Basic .NET:\n\
    \n```\nPublic Class ConstructorDemo\n    Private connectString As String\n```"
