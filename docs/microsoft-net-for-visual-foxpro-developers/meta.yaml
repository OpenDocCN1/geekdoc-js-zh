  md: "# .NET for Visual FoxPro Developers\n\nC# uses two forward slashes consistently\
    \ to indicate a comment either at the beginning of a line or at the end of a line.\
    \ For multi-line comments, it uses a forward slash and asterisk (*) at the beginning\
    \ of the first comment line and an asterisk and forward slash (/) at the end of\
    \ the last comment line:\n\n```\npublic class CommentDemo\n    /* Multi-line comment\n\
    \       Here's the second line */\n\n    // Comment\n    public void MyCommentedMethod()\
    \ // Another comment\n    \n```\n\nC# has a very cool feature that allows you\
    \ to document your code using XML. See the \"XML Documentation\" section at the\
    \ end of this chapter for details.\n\n# Namespaces\n\nAll classes in .NET belong\
    \ to a namespace. Remember that namespaces are not a physical grouping of classes,\
    \ such as a project or a class library in Visual FoxPro. They are simply a naming\
    \ convention that logically groups classes together. For example, all of the source\
    \ code associated with this book belongs to the namespace HW.NetBook.Samples.\
    \ For more information on namespaces, see Chapter 1, \"Introduction to .NET\"\
    .\n\nTo assign a class to a namespace, all you have to do is place the class within\
    \ the curly braces of a namespace declaration:\n\n```\nnamespace HW.NetBook.Samples\n\
    {\n    public class MyDemoClass\n    {\n\n    public class MyOtherDemoClass\n\
    \    {\n```\n\nSince a namespace is not a physical designation, you can place\
    \ code in different physical source files or assemblies and assign them to the\
    \ same namespace. This is different from Visual FoxPro, where a class is designated\
    \ by its physical location—either a class library or a PRG file.\n\nIn Visual\
    \ FoxPro, before you instantiate a class, you have to SET CLASSLIB or SET PROCEDURE\
    \ to the class library or PRG file that contains your class definitions. Similarly,\
    \ in C#, you must specify that you are \"using\" the namespace to which a class\
    \ belongs. The following code specifies that it is using two different namespaces,\
    \ System and System.Windows.Forms."
