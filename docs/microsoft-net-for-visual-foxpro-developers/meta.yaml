    \n    Public NotOverridable Overrides Sub DisplayMessage()\n        MessageBox.Show(\"\
    This overrides a virtual method, then seals it!\", \n        \"Prevent inheritance\
    \ demo\")\n    End Sub 'DisplayMessage'\nEnd Class : 'PreventInheritanceSubclass'\n\
    ```\n\nIn addition to preventing inheritance at the method level, you can also\
    \ specify an entire class using the sealed keyword (C#) or the NotInheritable\
    \ keyword (VB.NET). For example, the following code declares the \"PreventClassInheritDemo\"\
    \ class cannot be subclassed.\n\nIn C#:\n\n```\npublic sealed class PreventClassInheritDemo\n\
    {}\n```\n\nIn Visual Basic .NET:\n\n```\nPublic NotInheritable Class PreventClassInheritDemo\n\
    End Class\n```\n\n# Abstract classes and methods\n\nThere are two types of classes\
    \ in object-oriented programming—concrete and abstract. All of the classes you\
    \ have seen so far are concrete; they have code in their methods that implements\
    \ specific functionality. For example, in the previous section, the DisplayMessage\
    \ method displays a message to the user. Concrete classes are meant to be instantiated\
    \ and their methods called by client code."
