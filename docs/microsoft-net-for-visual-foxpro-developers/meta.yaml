  md: "# XML Documentation\n\nC# has a very cool feature that allows you to document\
    \ your code using XML.\nIf you type three forward slashes in a row in the line\
    \ immediately preceding a user-defined type (such as a class, structure, delegate,\
    \ or interface) or preceding a member (such as a field, property or method), an\
    \ XML documentation template is automatically inserted where you can add your\
    \ comments. For example, suppose you have the following C# class:\n\n```\npublic\
    \ class CommentDemo2\n{\n    public string GetString(int value)\n    {\n     \
    \   return value.ToString();\n    }\n}\n```\n\nIf you enter three forward slashes\
    \ on the line before the start of the class definition and preceding the method\
    \ definition, the following XML documentation template is added to your code:\n\
    \n```\n/// <summary>\n///\n/// </summary>\npublic class CommentDemo2\n{\n    public\
    \ string GetString(int value)\n    {\n        /// <summary>\n        ///\n   \
    \     /// </summary>\n        /// <param name=\"value\"></param>\n        ///\
    \ <returns></returns>\n        return value.ToString();\n    }\n}\n```\n\nYou\
    \ enter a description of your class between the <summary> tag preceding the class\
    \ definition and a description of your method in the <summary> tag preceding the\
    \ method definition. Notice that C# is smart enough to create XML tags for parameters\
    \ and return values. You can also place descriptions in the <param> and <returns>\
    \ tags. For example:\n\n```\n/// <summary>\n/// Comment Demo class\n/// </summary>\n\
    public class CommentDemo2\n{\n    /// <summary>\n    /// Converts an integer value\
    \ to a string\n    /// </summary>\n    /// <param name=\"value\">Integer value\
    \ to be converted</param>\n    /// <returns>Converted string value</returns>\n\
    \    public string GetString(int value)\n```"
