    **Figure 1.** The System namespace contains many frequently used classes such
    as the base value type classes shown in the UML class diagram.


    # The String class—working with strings


    Chapter 3, “Introduction to C#” and Chapter 4, “Introduction to Visual Basic .NET”,
    provide some basic information regarding the string data type. This section further
    explores its capabilities.


    > The string alias in C# and the String alias in Visual Basic .NET are both shortcuts
    that refer to the System.String class.


    # Parsing strings


    The String class provides a number of methods that allow you to parse strings.
    This is different than Visual FoxPro, which has a variety of independent functions
    you use to parse strings. The String class brings all of this functionality together
    in a single class.


    To determine the starting position of one or more characters within a string,
    you use the String class’s IndexOf method, which finds the first occurrence or
    the LastIndex method, you can also specify the starting character position and
    number of characters searched.


    Here’s an example in C#:


    ```

    string MyString = "<GBAddress>Four score and seven years ago...<GBAddress>";

    int DotsIndex = MyString.IndexOf("..."); // returns 41

    int LastIndex = MyString.IndexOf(''<''); // returns 44

    ```'
