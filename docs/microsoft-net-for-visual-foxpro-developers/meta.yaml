  md: "Chapter 4: Introduction to Visual Basic .NET 111\n\n# With statement\n\nVisual\
    \ Basic .NET's With statement is equivalent to Visual FoxPro's WITH...ENDWITH\
    \ command. You specify an object reference at the top of the With statement, refer\
    \ to properties and methods of the object within the With statement by specifying\
    \ the name of the object. Any expression starting with a period in the With statement\
    \ is evaluated as if it is prefixed by the object name. For example:\n\n```\n\
    Dim ReturnDemo As New ReturnValuesDemo()\nDim ReturnValue As Integer\nWith ReturnDemo\n\
    \  ReturnValue = .ReturnValue1()\n  ReturnValue = .ReturnValue2()\nEnd With\n\
    ```\n\n# XML Documentation Tool\n\nAlthough XML documentation was not built into\
    \ Visual Studio .NET for VB .NET, several months after the release of VS .NET,\
    \ a stand-alone tool was released by Microsoft that allows you to create XML documentation\
    \ for VB .NET projects. To get this tool, download it from the VB .NET \"GotDotNet\"\
    \ Web site: http://www.goddotnet.com/team/vb.\n\nThis tool works a bit differently\
    \ than the Visual Studio XML documentation tool for C#. With C# XML documentation,\
    \ you enter your XML comments directly in your code. These comments are compiled\
    \ into the assembly and can be viewed in an Object Browser with IntelliSense.\
    \ In addition VS .NET automatically builds XML Comment Web pages for you from\
    \ these XML comments (see Chapter 3, \"Introduction to C#\" for details).\n\n\
    With the VB .NET XML Documentation Tool, your XML comments are not stored in the\
    \ source code, but in a separate XML file. Like C#, these XML comments can also\
    \ be viewed in an Object Browser and with IntelliSense. However, there is no facility\
    \ to create Comment Web pages from these VB .NET XML comments. In addition, since\
    \ the comments are not stored in the source code this means that:\n\n+   1. Either,\
    \ you don't put comments in your source code (not recommended).\n2. Or, you duplicate\
    \ your comments—one in your source code and one in the XML file.\n\nI see this\
    \ as a serious limitation of this tool. You really should place comments in your\
    \ source code for benefit and the benefit of developers who have to examine your\
    \ code. After downloading the VB .NET XML Documentation Tool, you run it by doubleclicking\
