  trans: "\n\n```html\n<textarea class=\"form-control\" id=\"exampleFormControlTextarea1\"\
    \ rows=\"3\"></textarea>\n</div>\n```\n\n上述 Bootstrap 代码的效果如下图所示。\n\n![](img/image00143.jpeg)\n\
    \n首先，要在你的网站中使用 Bootstrap，你需要在 `body` 标签中添加三个 JS 代码，如下所示，这些代码也可以在 Bootstrap 官方网站上找到。\n\
    \n```html\n<script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js\"\
    \ integrity=\"sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p\"\
    \ crossorigin=\"anonymous\"></script>\n<script src=\"https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js\"\
    \ integrity=\"sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB\"\
    \ crossorigin=\"anonymous\"></script>\n<script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js\"\
    \ integrity=\"sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13\"\
    \ crossorigin=\"anonymous\"></script>\n```\n\n## Bootstrap 网格系统\n\nBootstrap 的网格系统允许在页面上最多使用\
    \ 12 列。如果你不想单独使用全部 12 列，可以将列组合在一起以创建更宽的列。Bootstrap 的网格系统是响应式的，列会根据屏幕大小自动重新排列。\n\
    \nBootstrap 网格系统有四个类：\n\n* `Xs` 用于手机屏幕（小于 768px）。\n* `Sm` 用于平板屏幕（大于 768px）。\n\
    * `Md` 用于小型笔记本电脑屏幕（大于 992px）。\n* `Lg` 用于桌面显示器（大于 1200px）。\n\n## Bootstrap 基本表格\n\
    \n基本的 Bootstrap 表格具有浅内边距和仅水平分隔线。`table` 类为表格添加基本样式。\n\n![](img/image00144.jpeg)\n\
    \n* **条纹行** – `.table-striped` 类为表格添加斑马条纹。\n* **带边框表格** – `.table-bordered` 类为表格和单元格的所有边添加边框。\n\
    * **悬停行** – `.table-hover` 类为表格行添加悬停效果（灰色背景色）。\n* **紧凑表格** – `.table-condensed`\
    \ 类通过将单元格内边距减半使表格更紧凑。\n\n## Bootstrap 图片\n\n在 Bootstrap 中，使用某些类可以获得不同样式的图片。\n\n\
    ### 圆角\n\n`.img-rounded` 类为图片添加圆角（IE8 不支持圆角）。\n\n### 圆形图片\n\n`.img-circle` 类将图片裁剪为圆形。\n\
    \n### 响应式图片\n\n图片有各种尺寸，屏幕也是如此。响应式图片会自动调整以适应屏幕大小。使图片响应式的代码如下所示。\n\n```html\n<img\
    \ class=\"img-responsive\" src=\"img_chania.jpg\" alt=\"Chania\">\n```\n\n## 图片画廊\n\
    \n你还可以将 Bootstrap 的网格系统与 `.thumbnail` 类结合使用来创建图片画廊。创建一张卡片或画廊的代码如下所示。\n\n```html\n\
    <div class=\"row\">\n  <div class=\"col-md-4\">\n    <div class=\"thumbnail\"\
    >\n      <a href=\"/images/ gallary.jpg\">\n        <img src=\"/images/gallary.jpg\"\
    \ style=\"width:100%\">\n        <div class=\"caption\">\n          <p>Lorem ipsum...</p>\n\
    \        </div>\n      </a>\n    </div>\n  </div>\n```\n\n结果将如下图所示，包含一张图片和一些描述。\n\
    \n![](img/image00145.jpeg)\n\n## Bootstrap 按钮\n\nBootstrap 提供了不同样式的按钮。要实现上述按钮样式，Bootstrap\
    \ 有以下类：\n\n* `.btn`\n* `.btn-default`\n* `.btn-primary`\n* `.btn-success`\n* `.btn-info`\n\
    * `.btn-warning`\n* `.btn-danger`\n* `.btn-link`\n\n在你的文本编辑器中编写以下代码，了解更多信息。\n\n\
    ```html\n<button type=\"button\" class=\"btn\">Basic</button>\n<button type=\"\
    button\" class=\"btn btn-default\">Default</button>\n<button type=\"button\" class=\"\
    btn btn-primary\">Primary</button>\n<button type=\"button\" class=\"btn btn-success\"\
    >Success</button>\n<button type=\"button\" class=\"btn btn-info\">Info</button>\n\
    <button type=\"button\" class=\"btn btn-warning\">Warning</button>\n<button type=\"\
    button\" class=\"btn btn-danger\">Danger</button>\n<button type=\"button\" class=\"\
    btn btn-link\">Link</button>\n```\n\n代码的效果如下图所示。从下图中你可以了解更多关于 Bootstrap 中每个按钮类的信息。\n\
    \n![](img/image00146.jpeg)\n\n在 Bootstrap 按钮中，还有基于尺寸的更多类。\n\n* `.btn-lg`\n* `.btn-sm`\n\
    * `.btn-xs`\n\n## Bootstrap 进度条\n\n进度条可用于向用户显示其在某个过程中的进度。Bootstrap 提供了几种类型的进度条。\n\
    \n要创建默认进度条，请向 `<div>` 元素添加 `.progress` 类。Bootstrap 中进度条的最佳设计之一如下所示。\n\n![](img/image00147.jpeg)\n\
    \n上述进度条的代码可以在 Bootstrap 官方网站上找到。\n\n我们还可以创建带有标签的进度条，标签位于进度条中间，显示数据的精确百分比。其代码如下所示。\n\
    \n```html\n<div class=\"progress\">\n  <div class=\"progress-bar\" role=\"progressbar\"\
    \ aria-valuenow=\"70\"\n  aria-valuemin=\"0\" aria-valuemax=\"100\" style=\"width:70%\"\
    >\n    70%\n  </div>\n</div>\n```\n\n此进度条代码的结果如下所示。\n\n![](img/image00148.jpeg)\n\
    \n## Bootstrap 分页器\n\n分页器也是分页的一种形式。分页器提供“上一页”和“下一页”按钮（链接）。要创建“上一页/下一页”按钮，请向 `<ul>`\
    \ 元素添加 `.pager` 类。\n\n```html\n<ul class=\"pager\">\n  <li><a href=\"#\">Previous</a></li>\n\
    \  <li><a href=\"#\">Next</a></li>\n</ul>\n```\n\n![](img/image00149.jpeg)\n\n\
    ## Bootstrap 下拉菜单\n\n下拉菜单是一个可切换的菜单，允许用户从预定义列表中选择一个值。它使得在小型导航栏中添加更多导航链接变得非常容易。基本下拉菜单的代码如下所示。\n\
    \n```html\n<div class=\"dropdown\">\n  <button class=\"btn btn-primary dropdown-toggle\"\
    \ type=\"button\" data-toggle=\"dropdown\">Website <span class=\"caret\"></span></button>\n\
    \  <ul class=\"dropdown-menu\">\n    <li><a href=\"#\">HTML</a></li>\n    <li><a\
    \ href=\"#\">CSS</a></li>\n    <li><a href=\"#\">JavaScript</a></li>\n  </ul>\n\
    </div>\n```\n\n![](img/image00150.jpeg)结果如下所示。\n\n## Bootstrap 折叠\n\n### 基本折叠\n\
    \n当你想要隐藏和显示大量内容时，折叠非常有用。使用它，我们可以创建一个按钮，点击该按钮后会显示更多文本，这些文本可以是关于按钮或内容的任何信息。\n\n\
    ## Bootstrap 菜单\n\n在 Bootstrap 中，你可以使用菜单为导航栏等创建列表。因为创建垂直菜单很容易，但要创建水平菜单，你还需要编写许多其他代码。因此，你可以使用\
    \ `nav` 和 `nav-tabs` 等类。代码如下所示。\n\n```html\n<ul class=\"nav nav-tabs\">\n  <li\
    \ class=\"active\"><a href=\"#\">Home</a></li>\n  <li><a href=\"#\">Services</a></li>\n\
    \  <li><a href=\"#\">Products</a></li>\n  <li><a href=\"#\">About</a></li>\n</ul>\n\
    ```\n\n![](img/image00151.jpeg)\n\n## Bootstrap 导航栏\n\n借助 Bootstrap，我们可以创建外观精美的导航栏。Bootstrap\
    \ 中基本导航栏的代码在下一页中显示，但你可以在此处看到结果。\n\n![](img/image00152.jpeg)\n\n现在你可以清楚地看到，徽标和导航链接的展示是多么美观。这就是\
    \ Bootstrap 的真正力量。为了使你的网站更易于使用，你还可以使用下拉菜单。现在来看看这个导航栏的代码。\n\n```html\n<nav class=\"\
    navbar navbar-default\">\n  <div class=\"container-fluid\">\n    <div class=\"\
    navbar-header\">\n      <a class=\"navbar-brand\" href=\"#\">Brajesh Thakur</a>\n\
    \    </div>\n    <ul class=\"nav navbar-nav\">\n      <li class=\"active\"><a\
    \ href=\"#\">Home</a></li>\n      <li><a href=\"#\">Page 1</a></li>\n      <li><a\
    \ href=\"#\">Page 2</a></li>\n      <li><a href=\"#\">Page 3</a></li>\n    </ul>\n\
    \  </div>\n</nav>\n```\n\n"
- fmt: "\nWe can also create a fixed navbar by using class name `navbar-fixed-top`.\
    \ And the code of the nav tag will look like this. We can also fix the navbar\
    \ at bottom just change the class name from `navbar-fixed-top` to `navbar-fixed-bottom`.\n\
    \n```\n<nav class=\"navbar navbar-inverse navbar-fixed-top\">\n```\n\n## • Bootstrap\
    \ Forms\n\nForms pays and important role in a website or a business because it\
    \ helps us to contact with our visitors and getting reviews from them for sign\
    \ up information’s etc. So, from the help of bootstraps, we can make forms looking\
    \ clean and clear. A basic level code for a basic level form in Bootstrap is like\
    \ follows\n\n```\n<form action=\"/action_page.php\">\n  <div class=\"form-group\"\
    >\n    <label for=\"email\">Email address:</label>\n    <input type=\"email\"\
    \ class=\"form-control\" id=\"email\">\n  </div>\n  <div class=\"form-group\"\
    >\n    <label for=\"pwd\">Password:</label>\n    <input type=\"password\" class=\"\
    form-control\" id=\"pwd\">\n  </div>\n  <div class=\"checkbox\">\n    <label><input\
    \ type=\"checkbox\"> Remember me</label>\n  </div>\n  <button type=\"submit\"\
    \ class=\"btn btn-default\">Submit</button>\n</form>\n```\n\n![](Images/image00153.jpeg)\n\
    \nBootstrap supports and provide code related to all input methods. For adding\
    \ a checkbox input in a form, you have to use this code.\n\n```\n<label class=\"\
    checkbox-inline\"><input type=\"checkbox\" value=\"\">Option 3</label>\n```\n\n\
    ## • Bootstrap Carousel\n\nBootstrap is used by most of the users and web developers\
    \ because of its carousel plugin. It helps us to make very beautiful looking working\
    \ carousel. The code for making one these is given below.\n\n```\n<div id=\"carouselExampleControls\"\
    \ class=\"carousel slide\" data-bs-ride=\"carousel\">\n  <div class=\"carousel-inner\"\
    >\n    <div class=\"carousel-item active\">\n      <img src=\"...\" class=\"d-block\
    \ w-100\" alt=\"...\">\n    </div>\n    <div class=\"carousel-item\">\n      <img\
    \ src=\"...\" class=\"d-block w-100\" alt=\"...\">\n    </div>\n    <div class=\"\
    carousel-item\">\n      <img src=\"...\" class=\"d-block w-100\" alt=\"...\">\n\
    \    </div>\n  </div>\n  <button class=\"carousel-control-prev\" type=\"button\"\
    \ data-bs-target=\"#carouselExampleControls\" data-bs-slide=\"prev\">\n    <span\
    \ class=\"carousel-control-prev-icon\" aria-hidden=\"true\"></span>\n    <span\
    \ class=\"visually-hidden\">Previous</span>\n  </button>\n  <button class=\"carousel-control-next\"\
    \ type=\"button\" data-bs-target=\"#carouselExampleControls\" data-bs-slide=\"\
    next\">\n    <span class=\"carousel-control-next-icon\" aria-hidden=\"true\"></span>\n\
    \    <span class=\"visually-hidden\">Next</span>\n  </button>\n</div>\n```\n\n\
    Here we have coded a carousel using bootstrap classes. The images that are used\
    \ in the carousel can be changed accordingly. Because here we have used src attribute\
    \ to load the image. The result for the above written code for carousel Is shown\
    \ below.\n\n![](Images/image00154.jpeg)\n\n# Chapter 6: PUBLISHING WEBSITES\n\n\
    Now you have learned everything how to make website and how to make it more durable.\
    \ But the whole folder is just saved in your local computer but if anyone wants\
    \ to come to your website he can’t because it’s om local server not on the public\
    \ server. So, for uploading your website on the internet you would have to get\
    \ hosting but there are many other ways to do so and with free of cost.\n\nYou\
    \ can use GitHub or Netlify or many more cloud computing websites and software\
    \ for uploading your website. Here in this we will use Netlify for uploading our\
    \ website on the internet. I will not recommend a beginner for using Git Hub for\
    \ uploading their projects because it is very difficult and complicated. But using\
    \ Netlify you can easily do all the stuff and get an sub domain as well as domain\
    \ for your website.\n\n![A tutorial to host your Static Site on Netlify](Images/image00155.jpeg)\n\
    \nhttps://app.netlify.com/\n\nFirst of all, visit the official website of netlify\
    \ which is given above. Create a account there . Then you will see something like\
    \ as shown in the image in next page. There you will that there is a button for\
    \ uploading a new site. Just click on it. And three options will come in front\
    \ of you have to select the last one “Deploy Manually”. Now a new page will show\
    \ up in front of you either you can drag and drop the main folder or you can also.\
    \ Select it from your file Explorer.\n\n![](Images/image00156.jpeg)\n\nAfter doing\
    \ the whole process you will see something like this as shown below now click\
    \ on “Domain Setting”. And then click on option and then on “Edit Site Name”.\n\
    \n![](Images/image00157.jpeg)\n\nNow you will have to add the name of your website\
    \ which will be eventually displayed ON THE subdomain and the subdomain will also\
    \ be displayed under the input section. Now click on save.\n\n![](Images/image00158.jpeg)\n\
    \nNow when this website will be public it will have a subdomain as shown below\
    \ the input bar. But if you want to add a custom domain and you have purchased\
    \ it from any hosting website so you can also do this by going back and clicking\
    \ on the Second Icon as shown in the image below. You just have to enter the domain\
    \ that you have bought and then verify it by giving your detail.\n\n![](Images/image00159.jpeg)\n\
    \nNow when you come back you will see that your website has been published and\
    \ is being shown in the list of uploaded sites. You can add as many websites as\
    \ you want. It provides you 100 GB of Bandwidth for your all projects together.\n\
    \n## MY MESSAGE\n\n![Heart organ](Images/image00160.jpeg)\n\nTo all the readers\
    \ of this book, I am very grateful that you this book This book is just the thought\
