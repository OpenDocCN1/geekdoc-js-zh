    \ rows=\"3\"></textarea>\n</div>\n```\n\nThe result of the above used bootstrap\
    \ code looks something like this.\n\n![](Images/image00143.jpeg)\n\nFirst of all\
    \ to use bootstrap in your website you have to add three js codes in your body\
    \ tag which are like follows and are also available in the bootstraps official\
    \ website.\n\n```html\n<script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js\"\
    \ integrity=\"sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p\"\
    \ crossorigin=\"anonymous\"></script>\n<script src=\"https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js\"\
    \ integrity=\"sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB\"\
    \ crossorigin=\"anonymous\"></script>\n<script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js\"\
    \ integrity=\"sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13\"\
    \ crossorigin=\"anonymous\"></script>\n```\n\n## Bootstrap Grid System\n\nBootstrap's\
    \ grid system allows up to 12 columns across the page. If you do not want to use\
    \ all 12 columns individually, you can group the columns together to create wider\
    \ columns. Bootstrap's grid system is responsive, and the columns will re-arrange\
    \ automatically depending on the screen size.\n\nThe Bootstrap grid system has\
    \ four classes:\n\n* `Xs` for phone screens (less than 768px).\n* `Sm` for tablet\
    \ screens (greater than 768px).\n* `Md` for small laptop screens. (Greater than\
    \ 992px).\n* `Lg` for desktops (greater than 1200px).\n\n## Bootstrap Basic Table\n\
    \nA basic Bootstrap table has a light padding and only horizontal dividers. The\
    \ `table` class adds basic styling to a table.\n\n![](Images/image00144.jpeg)\n\
    \n* **Striped Rows** – The `.table-striped` class adds zebra-stripes to a table.\n\
    * **Bordered Table** – The `.table-bordered` class adds borders on all sides of\
    \ the table and cells.\n* **Hover Rows** – The `.table-hover` class adds a hover\
    \ effect (grey background color) on table rows.\n* **Condensed Table** – The `.table-condensed`\
    \ class makes a table more compact by cutting cell padding in half.\n\n## Bootstrap\
    \ Images\n\nIn bootstrap using certain classes we can get different styles of\
    \ images.\n\n### Rounded Corners\n\nThe `.img-rounded` class adds rounded corners\
    \ to an image (IE8 does not support rounded corners).\n\n### Circle Image\n\n\
    The `.img-circle` class shapes the image to a circle.\n\n### Responsive Images\n\
    \nImages come in all sizes. So do screens. Responsive images automatically adjust\
    \ to fit the size of the screen. The code for making an image responsive is shown\
    \ in the next page.\n\n```html\n<img class=\"img-responsive\" src=\"img_chania.jpg\"\
    \ alt=\"Chania\">\n```\n\n## Image Gallery\n\nYou can also use Bootstrap's grid\
    \ system in conjunction with the `.thumbnail` class to create an image gallery.\
    \ The code for creating one card or gallery is like as follows.\n\n```html\n<div\
    \ class=\"row\">\n  <div class=\"col-md-4\">\n    <div class=\"thumbnail\">\n\
    \      <a href=\"/images/ gallary.jpg\">\n        <img src=\"/images/gallary.jpg\"\
    \ style=\"width:100%\">\n        <div class=\"caption\">\n          <p>Lorem ipsum...</p>\n\
    \        </div>\n      </a>\n    </div>\n  </div>\n```\n\nThe result will look\
    \ like this with an image and some description.\n\n![](Images/image00145.jpeg)\n\
    \n## Bootstrap Buttons\n\nBootstrap provides different styles of buttons. To achieve\
    \ the button styles above, Bootstrap has the following classes:\n\n* `.btn`\n\
    * `.btn-default`\n* `.btn-primary`\n* `.btn-success`\n* `.btn-info`\n* `.btn-warning`\n\
    * `.btn-danger`\n* `.btn-link`\n\nWrite the following code in your text editor\
    \ and know more about it.\n\n```html\n<button type=\"button\" class=\"btn\">Basic</button>\n\
    <button type=\"button\" class=\"btn btn-default\">Default</button>\n<button type=\"\
    button\" class=\"btn btn-primary\">Primary</button>\n<button type=\"button\" class=\"\
    btn btn-success\">Success</button>\n<button type=\"button\" class=\"btn btn-info\"\
    >Info</button>\n<button type=\"button\" class=\"btn btn-warning\">Warning</button>\n\
    <button type=\"button\" class=\"btn btn-danger\">Danger</button>\n<button type=\"\
    button\" class=\"btn btn-link\">Link</button>\n```\n\nThe result of the code will\
    \ be like shown below. From the below image you can learn more about every single\
    \ class of buttons in bootstrap.\n\n![](Images/image00146.jpeg)\n\nUnder Bootstrap\
    \ buttons it also has more classes based on sizes.\n\n* `.btn-lg`\n* `.btn-sm`\n\
    * `.btn-xs`\n\n## Bootstrap Buttons\n\nA progress bar can be used to show a user\
    \ how far along he/she is in a process. Bootstrap provides several types of progress\
    \ bars.\n\nTo create a default progress bar, add a `.progress` class to a `<div>`\
    \ element. One of the best design for progress bars in bootstrap looks like this.\n\
    \n![](Images/image00147.jpeg)\n\nThe code for the above given progress bar is\
    \ clearly available the official website of bootstrap.\n\nWe can also make a progress\
    \ bar with labels in between them. Which will show the exact percentage of the\
    \ data of the bar. The code for it is shown in the next page.\n\n```html\n<div\
    \ class=\"progress\">\n  <div class=\"progress-bar\" role=\"progressbar\" aria-valuenow=\"\
    70\"\n  aria-valuemin=\"0\" aria-valuemax=\"100\" style=\"width:70%\">\n    70%\n\
    \  </div>\n</div>\n```\n\nThe result for this progress bar code will look like\
    \ this\n\n![](Images/image00148.jpeg)\n\n## Bootstrap Pager\n\nPager is also a\
    \ form of pagination. Pager provides previous and next buttons (links). To create\
    \ previous/next buttons, add the `.pager` class to an `<ul>` element.\n\n```html\n\
    <ul class=\"pager\">\n  <li><a href=\"#\">Previous</a></li>\n  <li><a href=\"\
    #\">Next</a></li>\n</ul>\n```\n\n![](Images/image00149.jpeg)\n\n## Bootstrap Dropdowns\n\
    \nA dropdown menu is a toggleable menu that allows the user to choose one value\
    \ from a predefined list. It makes it very easy to add more navigation link in\
    \ a small navigation bar. The code for a basic dropdown looks like\n\n```html\n\
    <div class=\"dropdown\">\n  <button class=\"btn btn-primary dropdown-toggle\"\
    \ type=\"button\" data-toggle=\"dropdown\">Website <span class=\"caret\"></span></button>\n\
    \  <ul class=\"dropdown-menu\">\n    <li><a href=\"#\">HTML</a></li>\n    <li><a\
    \ href=\"#\">CSS</a></li>\n    <li><a href=\"#\">JavaScript</a></li>\n  </ul>\n\
    </div>\n```\n\n![](Images/image00150.jpeg)The result looks something like this.\n\
    \n## Bootstrap Collapse\n\n### Basic Collapsible\n\nCollapsible are useful when\
    \ you want to hide and show large amount of content. Using it we creates a button\
    \ and on the click o that button it show up more text it can be about anything\
    \ about the button or the content.\n\n## Bootstrap Menus\n\nIn bootstrap you can\
    \ use Menus to make lists for navbar etc. Because making a vertical menu is easy\
    \ but to make an horizontal menu you have to code many other things also. So,\
    \ for it you can use classes like `nav` and `nav-tabs`. And the code looks like\
    \ this.\n\n```html\n<ul class=\"nav nav-tabs\">\n  <li class=\"active\"><a href=\"\
    #\">Home</a></li>\n  <li><a href=\"#\">Services</a></li>\n  <li><a href=\"#\"\
    >Products</a></li>\n  <li><a href=\"#\">About</a></li>\n</ul>\n```\n\n![](Images/image00151.jpeg)\n\
    \n## Bootstrap Navigation Bar\n\nWith the help of bootstrap, we can create amazing\
    \ looking navigation bars. So, for a basic nav bar in Bootstrap is shown in the\
    \ next page but you can see the result here down below.\n\n![](Images/image00152.jpeg)\n\
    \nNow here you can clearly see that how beautifully the logo and the navigation\
    \ links are shown. That’s the real power of Bootstrap. For making your website\
    \ easier to use you can use dropdown menus also. Now have a look to the code of\
    \ this nav bar.\n\n```html\n<nav class=\"navbar navbar-default\">\n  <div class=\"\
    container-fluid\">\n    <div class=\"navbar-header\">\n      <a class=\"navbar-brand\"\
    \ href=\"#\">Brajesh Thakur</a>\n    </div>\n    <ul class=\"nav navbar-nav\"\
    >\n      <li class=\"active\"><a href=\"#\">Home</a></li>\n      <li><a href=\"\
    #\">Page 1</a></li>\n      <li><a href=\"#\">Page 2</a></li>\n      <li><a href=\"\
    #\">Page 3</a></li>\n    </ul>\n  </div>\n</nav>\n```\n"
