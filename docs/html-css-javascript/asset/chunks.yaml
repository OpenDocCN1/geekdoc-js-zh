  trans: "\n\n```\n  text-align: center;\n}\np[[BT1]](#part0029.xhtml__cmnt1) {\n\
    \  font-family: verdana;\n  font-size: 20px;\n}\n```\n\n在上述代码中，我们为 `h1` 和段落元素赋予了两种属性。例如，对于标题标签，我们设置了颜色为黑色，文本居中对齐。对于段落标签，我们设置了字体族，即指定了名为“verdana”的字体，并将段落字体大小设为\
    \ `20px`。\n\n![](img/image00125.jpeg)\n\nCSS 的语法如下所示：\n\n在 CSS 中，你可以使用元素名、ID 名或类名作为选择器。若要将\
    \ ID 用作 CSS 选择器，需在 ID 名称前加上 `#`。若要将类名用作选择器，则需在类名前加上点号。你也可以为特定元素选择特定的类，如下所示：\n\n\
    ```\np. heading {\n  text-align: left;\n  color: black;\n}\n```\n\nCSS 中还有一种选择器称为通用选择器。它可以帮助我们选中整个文档并为其赋予属性。它可以用来为整个文档设置统一的字体。现在，你可以使用\
    \ `*` 符号来使用通用选择器。如果你希望为两个或多个不同的元素赋予相同的属性，可以将它们一起编辑，这称为 CSS 分组选择器。如下方代码所示，这里我们为两个不同的元素赋予了相同的属性。\n\
    \n```\nh1, h2, p {\n  text-align: left;\n  color: black;\n}\n```\n\n## 使用 CSS\
    \ 的方式\n\n在 HTML 文件中使用/插入 CSS 有三种方法。第一种是内联 CSS，我们在本书前面已经讨论过。第二种是内部 CSS。在这种方法中，我们使用\
    \ `<style>` 元素，并将所有要写入 CSS 文件的代码放在其中。最后一种是外部 CSS。在这种方式中，我们使用扩展名为 `.css` 的外部 CSS\
    \ 文件。为了将其与 HTML 文件链接，我们在 head 标签中编写链接代码。\n\n## CSS 中的注释\n\n正如我们之前所学，HTML 中有注释，CSS\
    \ 也是如此。因此，CSS 中的注释如下所示：\n\n```\n/*这是一条注释*/\n```\n\n## 背景颜色\n\n要为图像添加背景颜色，你需要遵循相同的语法，使用\
    \ `background-color` 属性，并为其赋予一个颜色名称作为值。你可以使用所有形式的颜色：HEX 代码、RGB 或 HSL。要增加或减少背景颜色的不透明度，你可以使用\
    \ RGBA 形式的背景颜色，通过控制 alpha 值来控制背景的不透明度。但不可忽视的是，查找颜色的 RGB 值比较困难，因此你可以直接写颜色名称，并通过添加\
    \ `opacity` 属性来控制不透明度。该属性的值介于 `0` 到 `1` 之间。\n\n## 背景图像\n\n有时背景颜色并不能让我们的网站看起来足够吸引人，因此我们可以利用\
    \ CSS 属性为 CSS 中的任何元素添加背景图像。我们只需使用 `url` 属性，代码如下所示：\n\n```\ndiv {\n  background-image:\
    \ url(\"bg.jpg\");\n}\n```\n\n有时元素的尺寸大于背景图像的尺寸，浏览器会自动重复显示图像。因此，我们使用名为 background-repeat\
    \ 的属性。如果你希望图像不重复，可以将值设为 `no-repeat`。如果你希望图像水平重复，可以将值设为 `repeat-x`。如果你希望图像仅垂直重复，可以将值设为\
    \ `repeat-y`。\n\n```\ndiv {\n background-image: url(\"bg.png\");\n  background-repeat:\
    \ repeat-x;\n}\n```\n\n## 边框属性\n\n你可以使用 CSS 属性为 HTML 元素添加边框。`border-style` 属性指定要显示的边框类型。该属性可以填充的值如下：\n\
    \n* `dotted` - 定义点状边框。\n* `dashed` - 定义虚线边框。\n* `solid` - 定义实线边框。\n* `double`\
    \ - 定义双线边框。\n* `groove` - 定义 3D 凹槽边框。效果取决于 `border-color` 的值。\n* `ridge` - 定义\
    \ 3D 脊状边框。效果取决于 `border-color` 的值。\n* `inset` - 定义 3D 内嵌边框。效果取决于 `border-color`\
    \ 的值。\n* `outset` - 定义 3D 外凸边框。效果取决于 `border-color` 的值。\n* `none` - 定义无边框。\n*\
    \ `hidden` - 定义隐藏边框。\n\n使用所有这些属性的代码如下所示：\n\n```\ndiv {border-style:\n dotted;\n\
    }\n```\n\n所有这些属性的效果将在下一页展示。\n\n![](img/image00126.jpeg)\n\n你还可以为应用于 HTML 元素的边框添加颜色。通过使用\
    \ `border-color` 属性。相关代码如下：\n\n```\ndiv {\n  border-style: solid;\n  border-color:\
    \ blue;\n}\n```\n\n在 CSS 中，你可以单独编辑元素每一边的边框。代码如下：\n\n```\np {\n  border-top-style:\
    \ solid;\n  border-right-style: dotted;\n  border-bottom-style: groove;\n  border-left-style:\
    \ ridge;\n}\n```\n\n你也可以将这四行代码合并为一行：\n\n```\np {\n  border-style: solid dotted\
    \ groove ridge;\n}\n```\n\n上述代码的效果如下所示：\n\n![](img/image00127.jpeg)\n\n## CSS\
    \ 外边距\n\n在 CSS 中，外边距指的是一个元素与另一个元素之间的空间。通过 CSS 属性，我们可以编辑元素的外边距值。外边距的值以像素为单位计算。一厘米大约等于三十七像素。可以通过以下代码控制四个方向的外边距：\n\
    \n```\np {\n  margin-top: 25px;\n  margin-bottom: 50px;\n  margin-right: 750px;\n\
    \  margin-left: 100px;\n}\n```\n\n整个代码可以简化为一行，如下所示：\n\n```\np {\n  margin: 25px\
    \ 50px 75px 100px;\n}\n```\n\n你也可以将外边距设置为 `auto`，这将使其在其 div 或容器中水平居中。\n\n## CSS\
    \ 内边距\n\n内边距可以定义为元素本身与其边框之间的间隙或空间。其余内容（如语法和值）与 CSS 外边距相同。其语法如下：\n\n```\np {\n\
    \  padding-top: 25px;\n  padding -bottom: 50px;\n  padding -right: 750px;\n  padding\
    \ -left: 100px;\n}\n```\n\n与外边距类似，你可以将这四行代码合并为一行：\n\n```\np {\n  padding: 25px\
    \ 50px 75px 100px;\n}\n```\n\n## CSS 高度和宽度\n\n每个元素都需要定义其尺寸。在 CSS 中，你可以为每个元素设置高度和宽度。CSS\
    \ 中高度和宽度由一些值控制，如下所述：\n\n* `Auto` - 默认值。浏览器自动计算高度和宽度。\n* `Length` - 以 px、cm 等单位定义高度/宽度。\n\
    * `Percentage` - 以包含块的百分比定义高度/宽度。\n* `Initial` - 将高度/宽度设置为其默认值。\n* `Inherit` -\
    \ 高度/宽度将从其父元素继承。\n\n添加高度和宽度相关属性的代码语法如下：\n\n```\ndiv {\n  height: 150px;\n  width:\
    \ 54%;\n  background-color: red;\n}\n```\n\n* `Max height`：将元素的高度设置为最大值。\n* `Max\
    \ width`：将元素的宽度设置为最大值。\n* `Min height`：将元素的高度设置为最小值。\n* `Min width`：将元素的宽度设置为最小值。\n\
    \n## CSS 盒模型\n\nCSS 盒模型指的是一个布局，它清晰地解释了元素与其外边距和内边距之间的关系。\n\n![WebD2: 理解 CSS 盒模型](img/image00128.jpeg)\n\
    \n## CSS 文本格式化\n\n在 CSS 中，文本格式化指的是为文本添加不同的属性，例如对齐文本、更改字体颜色或更改背景颜色。\n\n### 文本对齐\n\
    \n文本对齐在 Web 开发中意义重大，它帮助我们以吸引人的方式在网站中调整更多内容。在文本对齐中，你可以使用多种属性，例如：\n\n* `Text-align-last`\n\
    * `Direction`\n* `Vertical-align`\n\n### 最后一行文本对齐\n\n`text-align-last` 属性指定如何对齐文本的最后一行。其语法如下：\n\
    \n```\np{\n text-align-last: center;\n}\n```\n\n"
