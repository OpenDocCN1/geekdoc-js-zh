      color: green;


    }


    a: hover {


      color: blue;


    }


    a: active {


      color: yellow;


    }


    *   CSS POSITION


    The position property specifies the type of positioning method used for an element
    (static, relative, fixed, absolute or sticky). Elements are then positioned using
    the top, bottom, left, and right properties. However, these properties will not
    work unless the position property is set first. They also work differently depending
    on the position value.


    *   Position Static


    This is the default value for position property. The elements which are static
    in position are not affected by top, bottom, left, right properties. The code
    for static position is like this


    div{


      position: static;


      border: 1px #fff;


    }


    *   Position Relative


    In this position the element is in its relative position. Setting the top, right,
    bottom, and left properties of a relatively-positioned element will cause it to
    be adjusted away from its normal position. Other content will not be adjusted
    to fit into any gap left by the element.


    div{


      position: relative;


      border: 1px #fff;


    }


    *   Position Fixed


    In this position the element is fixed in its relative position. It means that
    weather you scroll till thje end it will never move from its place.


    div {


      position: fixed;


      bottom: 0;


      right: 0;


      width: 100%;


    }


    *   Position Absolute


    An element with position absolute is positioned relative to the nearest positioned
    ancestor. Absolute positioned elements are removed from the normal flow, and can
    overlap elements.


    div {


      position: absolute;


      top: 80px;


      right: 0;


      width: 200px;


      height: 100px;


    }


    *   Position Sticky


    If an element has given sticky as a value for the position property it will always
    be sticked there only it is used to make navigation bars in websites.


    div {


      position: -webkit-sticky; 


      position: sticky;


      top: 0;


      background-color: black;


      border: 1px solid #fff;


    }


    *   Z-INDEX


    The z-index property specifies the stack order of an element. Like using this
    property we chooses that which element should be on top and which should be one
    the bottom. The value of it is from infinity to infinity. The more the value of
    an element is the more on the top it is. Now in the following code you can see
    that we have given z-index -1 means that it the lowest and the image will be in
    the most bottom layer of the document.


    img {


      position: absolute;


      margin: auto;


      top: 0px;


      z-index: -1;


    }


    *   CSS FLOAT


    The float property is used for positioning and formatting content e.g. let an
    div or a image float left to a container. The float property can have one of the
    following values:


    left -         The element floats to the left of its container.


    right -       The element floats to the right of its container.


    none -       The element does not float.


    inherit -    The element inherits the float value of its parent.'
