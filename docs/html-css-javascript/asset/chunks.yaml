    }


    *   The:: first-letter Pseudo-element


    The ::first-letter pseudo-element is used to add a special style to the first
    letter of a text. The following example formats the first letter of the text in
    all <p> elements. The syntax is as follows in the next page. The:: first-letter pseudo-element
    can only be applied to block-level elements.


    p::first-letter {


      color: #ff0000;


      font-size: xx-large;


    }


    ## o The:: before Pseudo-element


    The:: before pseudo-element can be used to insert some content before the content
    of an element. The following example inserts an image before the content of each
    <h1> element. All the properties that we give to this before pseudo element is
    displayed in the HTML document. The syntax looks like this


    h1::before {


      content: url(book.png);


    }


    ## o CSS - The:: after Pseudo-element


    The ::after pseudo-element can be used to insert some content after the content
    of an element. The following example inserts an image after the content of each
    <h1> element: The syntax looks like this.


    h1::after {


      content: url(book.png);


    }


    ## o The:: selection Pseudo-element


    Have you seen that when we select something in a webpage it has an different properties.
    By default, it is with background set to blue. You can edit all this by using
    the simple syntax shown in the next page.


    ::selection {


      color: white;


      background: black;


    }


    *   NAVIGATION BAR


    A navigation bar needs standard HTML as a base. Having easy-to-use navigation
    is important for any web site. To make a basic navigation bar we used ul tag and
    li tag . So the HTML code looks like this.


    <ul>


      <li><a href="default.asp">Home</a></li>


      <li><a href="news.asp">News</a></li>


      <li><a href="contact.asp">Contact</a></li>


      <li><a href="about.asp">About</a></li>


    </ul>


    And to make it more attractive we will add some basic CSS code which looks like
    this. Here we are removing the bullet by setting list style type none. And by
    margin and padding zero we are giving it the top left position.


    ul {


      list-style-type: none;


      margin: 0;


      padding: 0;


    }


    In HTML every navigation bar we make is always vertical but how to make Horizontal
    Navigation bar. Mostly I uses the code given in the next page. In which I set
    display to flex which sets all them horizontally and then give some margin to
    it.


    ul {


          background-color: rgb(14, 13, 13);


          display: flex;


          list-style-type: none;


          margin: 0;


          padding: 0;


        }


        ul li {


          color: white;


          margin-left: 20px;


          margin-right: 20px;


        }


    The result of this code is something like this as shown below in the image.


    ![](Images/image00136.jpeg)


    Chapter 4


    JAVASCRIPT


    JavaScript, often abbreviated JS, is a programming language that is one of the
    core technologies of the World Wide Web, alongside HTML and CSS. Over 97% of websites
    use JavaScript on the client side for web page behaviour, often incorporating
    third-party libraries. JavaScript is also used for server-side programming for
    making databases. In this book we will only earn JavaScript for frontend development
    only. Now fust get an introduction to JavaScript by looking at the below code.


    <script>


        document. Write (“Introduction to JavaScript.”);


      </script>


    The result will same as if it is written using HTML.


    ![](Images/image00137.jpeg)


    *   USING JAVASCRIPT IN HTML


    To use JavaScript in HTML we have two options either we use internal JavaScript
    or we can also use External JavaScript. To use external CSS we will have to use
    script tag and them use src attribute to locate the js file. This below given
    code can be written in head tag or it can also be written in body tag. The syntax
    looks like this.


    <script src="myScript.js"></script>


    And to use internal CSS we will use script tag only and write all the code inside
    it.


    I will recommend you to use external JS file because first of all it helps to
    make your code look beautiful and easy to read and understand and separates HTML
    CSS and JS. It gives an positive impact of your code on others.


    *   JavaScript Display


    As we saw in the first ever example of the JS chapter, we printed a text using
    JS. There are many more ways to display data using JS in HTML document. We will
    discuss all of them one by one.


    *   innerHTML


    To access an HTML element, JavaScript can use the document.getElementById (id) method.
    The id attribute defines the HTML element. It can be <p> tag or any other text
    tag and the innerHTML property defines the HTML content. Here we will have to
    first add a <p> tag and give it an id which we can access through javascript.
    So the final code will look like.


    <!DOCTYPE html>


    <html>


    <body>


    <p id="web"></p>


    <script>


    document.getElementById("web").innerHTML = "Written using inner HTML";


    </script>


    </body>


    </html>


    The result will look same as is it is written using HTML. It is also shown in
    the next page.


    ![](Images/image00138.jpeg)


