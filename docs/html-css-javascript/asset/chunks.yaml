  trans: "\n\nHTML 引用用于在 HTML 中创建引用。对于短引用，我们使用 `<q>` 标签，此外还有许多其他类型。其中一些如下：\n\n*  \
    \ `<abbr>`：这是一个缩写标签，用于显示缩写或首字母缩略词。例如“Mr.”、“Mrs”。\n*   `<address>`：定义文档作者的联系信息。\n\
    *   `<bdo>`：`bdo` 代表双向覆盖。它有助于改变文本的方向。例如，从右到左的方向我们写 `rtl`，从左到右我们使用 `ltr` 作为 `dir`\
    \ 属性的值。用法如下：\n\n```\n<bdo dir=\"rtl\">这段文字将从右向左书写</bdo>\n```\n\n*   `<blockquote>`：用于定义从其他来源引用的部分。\n\
    *   `<cite>`：定义创意作品的标题。它使文本变为斜体。\n*   `<q>`：定义短的行内引用。\n\n## HTML 颜色及其使用\n\n在构建项目时，我们多次使用颜色。HTML\
    \ 中的颜色以三种形式使用。\n\n*   **RGB**：RGB 代表红、绿、蓝。在这种格式中，我们精确设置三种颜色的值，从而形成新的颜色。这三种颜色的值范围在\
    \ 0 到 255 之间。例如，黄色的 RGB 代码写作 `(255,255,0)`。这里第一个值代表红色的深浅，第二个值代表绿色的深浅，第三个值代表蓝色的深浅。\n\
    *   **HEX**：在这种格式中，颜色以十六进制形式表示。每种深浅对应不同的颜色。十六进制代码总是以 `#` 符号开头。例如，白色的十六进制代码是 `#ffffff`，黑色的是\
    \ `#000000`。在十六进制中，前两位控制红色深浅，中间两位控制绿色深浅，最后两位控制蓝色深浅。\n*   **HSL**：在这种格式中，颜色通过调整色相、饱和度和明度来生成。饱和度和明度的值以百分比表示，但色相的值以\
    \ 0 到 360 度的角度表示，色相是负责颜色变化的部分。\n\n## HTML 超链接和锚点标签\n\n每个网站都有超链接或按钮，帮助访问者重定向到另一个网页链接。HTML\
    \ 中有三种类型的链接。这三种链接的属性是默认的，但之后可以更改。\n\n*   未访问的链接带有下划线且为蓝色。\n*   已访问的链接带有下划线且为紫色。\n\
    *   活动链接带有下划线且为红色。\n\n你可以按如下方式编辑这三种链接的属性。这将借助 CSS 进行编辑。\n\n```css\n<style>\na:\
    \ link {\n  color: green;\n  background-color: transparent;\n  text-decoration:\
    \ none;\n}\na: visited {\n  color: pink;\n  background-color: transparent;\n \
    \ text-decoration: none;\n}\na: hover {\n  color: red;\n  background-color: transparent;\n\
    \  text-decoration: underline;\n}\na: active {\n  color: yellow;\n  background-color:\
    \ transparent;\n  text-decoration: underline;\n}\n</style>\n```\n\n与其他元素拥有自己的属性一样，锚点标签也有一个名为\
    \ `target` 的属性。该属性可以有以下值。\n\n*   `_self`：默认值。在点击时所在的同一窗口/标签页中打开文档。\n*   `_blank`：在新窗口或标签页中打开文档。\n\
    *   `_parent`：在父框架中打开文档。\n*   `_top`：在窗口的完整主体中打开文档。\n\n代码可以写成：\n\n```html\n<a\
    \ href=\"https://www.youtube.com/\" target=\"_blank\">访问 YouTube</a>\n```\n\n\
    如果我们使用 URL，应该知道有两种类型的 URL。第一种是绝对 URL，第二种是相对 URL。\n\n1.  **相对 URL**：相对 URL 是指位于你网站文件夹中的\
    \ URL。\n2.  **绝对 URL**：绝对 URL 是指来自其他网站的 URL。\n\n示例：\n\n```html\n<h1>绝对 URL</h1>\n\
    <p><a href=\"https://www.youtube.com/\">Youtube</a></p>\n<h1>相对 URL</h1>\n<p><a\
    \ href=\"/css/style.css\">CSS 文件</a></p>\n```\n\n## HTML 图像\n\n图像在技术上并非插入到网页中；图像是链接到网页的。我们可以通过\
    \ CSS 调整图像的宽度和高度。`<img>` 标签为引用的图像创建一个占位空间。图像可以通过以下代码链接。\n\n```html\n<img src=\"\
    URL\" alt=\"替代文本\">\n```\n\n在 URL 的位置，你必须插入图像的相对链接。并且我们需要在 `alt` 属性的值中填写图像的名称或上下文。有时由于网络连接缓慢，图像无法加载，因此这段文本将替代图像。\n\
    \n## HTML 网站图标\n\n请看下面给出的图像，其中网站的徽标显示在网页标题旁边。这个图像或徽标被称为网站图标（favicon）。这个网站图标为你的网页增添了新的亮点，同时也有助于访问者判断网站是否正在加载或已经加载完成。\n\
    \n![](img/image00114.jpeg)\n\n要将网站图标添加到你的网页，首先应将网站图标图像保存为 `.ico` 扩展名，并以任意名称存放在根目录中。这段代码应写在\
    \ `head` 标签内。如今，几乎所有浏览器都支持网站图标。在网站图标中，我们使用链接标签将文档与外部资源关联。\n\n```html\n<head>\n\
    \  <title>我的页面标题</title>\n  <link rel=\"icon\" type=\"image/x-icon\" href=\"/images/favicon.ico\"\
    >\n</head>\n```\n\n## HTML 表格\n\n我们也可以在 HTML 中添加表格，然后使用 CSS 对其进行样式设置。我们将数据按行和列排列在表格中。要制作表格中的单元格，我们使用\
    \ `<td>` 标签。基本表格的代码如下所示。\n\n```html\n<body>\n    <table style=\"width:100%\">\n\
    \        <tr>\n          <th>姓名</th>\n          <th>班级</th>\n          <th>组别</th>\n\
    \        </tr>\n        <tr>\n          <td>拉姆</td>\n          <td>7 年级 A 班</td>\n\
    \          <td>A</td>\n        </tr>\n        <tr>\n          <td>夏姆</td>\n  \
    \        <td>9 年级</td>\n          <td>B</td>\n        </tr>\n      </table>\n\
    </body>\n```\n\n对于样式设置，你可以像下面这样为表格的所有元素添加边框。\n\n```css\n<style>\ntable, th, td\
    \ {\n  border:1px solid black;\n}\n</style>\n```\n\n制作新表格时还会用到许多其他标签。\n\n*   `<table>`：此标签定义表格。\n\
    *   `<th>`：此标签定义表格的表头单元格。\n*   `<tr>`：此标签定义表格中的一行。\n*   `<td>`：此标签定义表格中的一个单元格。\n\
    *   `<caption>`：定义表格标题。\n*   `<colgroup>`：指定表格中的一组列。\n*   `<col>`：指代 `colgroup`\
    \ 中的一列。\n*   `<thead>`：对表格的所有表头内容进行分组。\n*   `<tbody>`：对表格的主体内容进行分组。\n*   `<tfoot>`：对表格的所有页脚内容进行分组。\n\
    \n## HTML 表格的 colspan 和 rowspan\n\n例如，你想让一个单元格变大，使其占据两个单元格的空间，那么你可以使用 `colspan`\
    \ 和 `rowspan`。这些也是用于 `<th>` 元素的属性。要跨列扩展，应使用 `colspan`；要跨行扩展，应使用 `rowspan`。你可以输入想要扩展该特定单元格所跨越的单元格数量。代码如下所示。\n\
    \n```html\n<table style=\"width: 100%\">\n        <tr>\n            <th colspan=\"\
    2\">姓名</th>\n            <th>年龄</th>\n        </tr>\n        <tr>\n          \
    \  <td>布拉杰什</td>\n            <td>塔库尔</td>\n            <td>13</td>\n        </tr>\n\
    \        <tr>\n            <td>纳雷什</td>\n            <td>库马尔</td>\n          \
    \  <td>42</td>\n        </tr>\n    </table>\n```\n\n结果将如下所示，你可以看到左上角的单元格，其宽度等于两个单元格的宽度。\n\
    \n![](img/image00115.jpeg)\n\n## HTML 列表\n\nHTML 允许网页开发者在制作网站时使用列表。这有助于他们将数据正确地添加到文档中。HTML\
    \ 中有两种类型的列表。第一种是有序列表，第二种是无序列表。\n\n"
- fmt: "\n* Ordered List: An ordered list starts with the `<ol>` tag. Each list item\
    \ starts with the `<li>` tag. The list items will be marked with numbers by default.\
    \ The code and result is shown below.\n\n![](Images/image00116.jpeg)\n\n```\n\
    <ol>\n  <li>Coffee</li>\n  <li>Tea</li>\n  <li>Milk</li>\n</ol>\n```\n\n* Unordered\
    \ List: An unordered list starts with the `<ul>` tag. Each list item starts with\
    \ the `<li>` tag. The list items will be marked with bullets (small black circles)\
    \ by default. The code and result are shown below.\n\n![](Images/image00117.jpeg)\n\
    \n```\n<ul>\n  <li>Coffee</li>\n  <li>Tea</li>\n  <li>Milk</li>\n</ul>\n```\n\n\
    There are many more types of lists in HTML. All of them are mentioned down below.\n\
    \n* `<dl>`: This defines a description list type.\n* `<dt>`: This defines a term\
    \ in description list.\n* `<dd>`: This describes a term in description list.\n\
    \n## BLOCKS AND INLINE ELEMENTS\n\nEvery HTML element has a default display value,\
    \ depending on what type of element it is. There are two display values: block\
    \ and inline.\n\n### BLOCK ELEMENTS\n\nA block-level element always starts on\
    \ a new line, and the browsers automatically add some space (a margin) before\
    \ and after the element. A block-level element always takes up the full width\
    \ available. There are two elements that are commonly used. `<p>`, `<div>`. The\
    \ `<p>` element defines a paragraph in an HTML document. The `<div>` element defines\
    \ a division or a section in an HTML document. All of the block elements are\n\
    \n[`<address>`](https://www.w3schools.com/tags/tag_address.asp) , [`<article>`](https://www.w3schools.com/tags/tag_article.asp)\
    \ , [`<aside>`](https://www.w3schools.com/tags/tag_aside.asp) , [`<blockquote>`](https://www.w3schools.com/tags/tag_blockquote.asp)\
    \ , [`<canvas>`](https://www.w3schools.com/tags/tag_canvas.asp) , [`<dd>`](https://www.w3schools.com/tags/tag_dd.asp)\
    \ , [`<div>`](https://www.w3schools.com/tags/tag_div.asp) , [`<dl>`](https://www.w3schools.com/tags/tag_dl.asp)\
    \ , [`<dt>`](https://www.w3schools.com/tags/tag_dt.asp) , [`<fieldset>`](https://www.w3schools.com/tags/tag_fieldset.asp)\
    \ , [`<figcaption>`](https://www.w3schools.com/tags/tag_figcaption.asp) , [`<figure>`](https://www.w3schools.com/tags/tag_figure.asp)\
    \ , [`<footer>`](https://www.w3schools.com/tags/tag_footer.asp) , [`<form>`](https://www.w3schools.com/tags/tag_form.asp)\
    \ , [`<h1>-<h6>`](https://www.w3schools.com/tags/tag_hn.asp) , [`<header>`](https://www.w3schools.com/tags/tag_header.asp)\
    \ , [`<hr>`](https://www.w3schools.com/tags/tag_hr.asp) , [`<li>`](https://www.w3schools.com/tags/tag_li.asp)\
    \ , [`<main>`](https://www.w3schools.com/tags/tag_main.asp) , [`<nav>`](https://www.w3schools.com/tags/tag_nav.asp)\
    \ , [`<noscript>`](https://www.w3schools.com/tags/tag_noscript.asp) , [`<ol>`](https://www.w3schools.com/tags/tag_ol.asp)\
    \ , [`<p>`](https://www.w3schools.com/tags/tag_p.asp) , [`<pre>`](https://www.w3schools.com/tags/tag_pre.asp)\
    \ , [`<section>`](https://www.w3schools.com/tags/tag_section.asp) , [`<table>`](https://www.w3schools.com/tags/tag_table.asp)\
    \ , [`<tfoot>`](https://www.w3schools.com/tags/tag_tfoot.asp) , [`<ul>`](https://www.w3schools.com/tags/tag_ul.asp)\
    \ , [`<video>`](https://www.w3schools.com/tags/tag_video.asp).\n\n### INLINE ELEMENTS\n\
    \nAn inline element does not start on a new line. An inline element only takes\
    \ up as much width as necessary. There is an element that we use in our daily\
    \ life which `<span>`. It doesn’t need a new line either it fits in that same\
    \ line in the provided dimensions. All of the inline elements are\n\n[`<a>`](https://www.w3schools.com/tags/tag_a.asp)\
    \ , [`<abbr>`](https://www.w3schools.com/tags/tag_abbr.asp) , [`<acronym>`](https://www.w3schools.com/tags/tag_acronym.asp)\
    \ , [`<b>`](https://www.w3schools.com/tags/tag_b.asp) , [`<bdo>`](https://www.w3schools.com/tags/tag_bdo.asp)\
    \ , [`<big>`](https://www.w3schools.com/tags/tag_big.asp) , [`<br>`](https://www.w3schools.com/tags/tag_br.asp)\
    \ , [`<button>`](https://www.w3schools.com/tags/tag_button.asp) , [`<cite>`](https://www.w3schools.com/tags/tag_cite.asp)\
    \ , [`<code>`](https://www.w3schools.com/tags/tag_code.asp) , [`<dfn>`](https://www.w3schools.com/tags/tag_dfn.asp)\
    \ , [`<em>`](https://www.w3schools.com/tags/tag_em.asp) , [`<i>`](https://www.w3schools.com/tags/tag_i.asp)\
    \ , [`<img>`](https://www.w3schools.com/tags/tag_img.asp) , [`<input>`](https://www.w3schools.com/tags/tag_input.asp)\
    \ , [`<kbd>`](https://www.w3schools.com/tags/tag_kbd.asp) , [`<label>`](https://www.w3schools.com/tags/tag_label.asp)\
    \ , [`<map>`](https://www.w3schools.com/tags/tag_map.asp) , [`<object>`](https://www.w3schools.com/tags/tag_object.asp)\
    \ , [`<output>`](https://www.w3schools.com/tags/tag_output.asp) , [`<q>`](https://www.w3schools.com/tags/tag_q.asp)\
    \ , [`<samp>`](https://www.w3schools.com/tags/tag_samp.asp) , [`<script>`](https://www.w3schools.com/tags/tag_script.asp)\
    \ , [`<select>`](https://www.w3schools.com/tags/tag_select.asp) , [`<small>`](https://www.w3schools.com/tags/tag_small.asp)\
    \ , [`<span>`](https://www.w3schools.com/tags/tag_span.asp) , [`<strong>`](https://www.w3schools.com/tags/tag_strong.asp)\
    \ , [`<sub>`](https://www.w3schools.com/tags/tag_sub.asp) , [`<sup>`](https://www.w3schools.com/tags/tag_sup.asp)\
    \ , [`<textarea>`](https://www.w3schools.com/tags/tag_textarea.asp) , [`<time>`](https://www.w3schools.com/tags/tag_time.asp)\
    \ , [`<tt>`](https://www.w3schools.com/tags/tag_tt.asp) , [`<var>`](https://www.w3schools.com/tags/tag_var.asp).\n\
    \n## HTML CLASSES\n\nHTML `class` attribute is used to specify a class to an element.\
    \ Because we use a same element thousands of times in a document. So, to style\
    \ a single element it would be impossible but because of `class` attribute you\
    \ can do it easily. By this attribute we can name an element and can access it\
    \ with that name in stylesheets and js files. We will briefly study it later in\
    \ this book.\n\nTo style it in CSS we use a dot before adding the name of the\
    \ class then we can edit the properties of that class. The name of the classes\
    \ is case sensitive, means that Imp and imp are two different classes. We can\
    \ give same class name to different elements If we want to give same properties\
    \ to two different elements, we can give one common class to them and them give\
    \ the properties to that class. An element can also have more than one classes\
    \ just write both of them with a white space in between.\n\nIn this below given\
    \ code the span has given class named imp.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<style>\n.note {\n  font-size: 120%;\n  color: red;\n}\n</style>\n</head>\n\
    <body>\n<h1>My <span class=\"imp\">Important</span> Heading</h1>\n<p>This is some\
    \ <span class=\"imp\">important</span> text. </p>\n</body>\n</html>\n```\n\n##\
    \ HTML ID\n\nThe HTML `id` attribute is used to specify a unique id for an HTML\
    \ element. You cannot have more than one element with the same id in an HTML document.\
    \ An `id` attribute is always denoted with # for accessing in stylesheet and js\
    \ files’ attribute is also case sensitive. Both class and Id are used for giving\
    \ a name to an element but one difference between Id and classes is that classes\
    \ can be common but Id should always be unique. Id also helps you to create a\
    \ new link of a position in the document and the user can jump to that position\
    \ by using anchor tag. See the code below to know how it works with anchor tag.\n\
    \n```html\n<a href=\"book.html#imp\">What’s important</a>\n```\n\n## HTML IFRAMES\n\
    \nHave you ever seen a website in a website or a video or pdf embedded in a webpage?\
    \ So how the developers do this so the developers use `iframe` element to do so.\
    \ The syntax for embedding documents is like given below.\n\n```html\n<iframe\
    \ src=\"URL of the document\" title=\"about the url \"></iframe>\n```\n\n## HTML\
    \ FILE PATH\n\nFile path is the name of the location of any file or folder to\
    \ access it in HTML we use `src` attribute. You can see the table below to know\
    \ about path and its usage. File paths are used to link other files with your\
    \ document. They can be images CSS files or Js files.\n\n![](Images/image00118.jpeg)\n\
    \n## HTML HEAD TAG\n\nThe HTML `<head>` element or `<head>` tag is a container\
    \ for the following elements: `<title>`, `<style>`, `<meta>`, `<link>`, `<script>`,\
    \ and `<base>`.\n"
