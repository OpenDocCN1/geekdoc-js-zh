    Chapter 1


    World Wide Web and Websites


    Word Wide Web is one of the most revolutionary ideas which has revolutionized
    the field of Computer Science. In 1990, Tim Berners-Lee developed the foundation
    for the World Wide Web. The whole web works on a basic system. This whole system
    has two sides. The first one is the Server Side which refers to the data centres
    and the servers of the websites that you are trying to reach. And secondly, the
    client-side refers to your local computer and its IP address.  And the work of
    connecting these two sides is done by browsers like Chrome, Firefox, Opera, etc.
    It can be demonstrated by the following diagram.


    ![Introduction to the server side - Learn web development | MDN](Images/image00111.gif)


    Now you know that every computer has an IP address same goes with websites every
    website has an IP address but because it’s very difficult for any human being
    to remember the addresses. So, to resolve this problem web addresses and URLs
    were introduced to the World Wide Web. For example, google.com. Here google.com
    is the web address and 8.8.8.8 is the IP for the google.com website. Every website
    has and web address and IP address.


    A website consists of two things the first one is known as Front – End and the
    second one is known as Back – End. The front–end refers to the material and the
    content which is visible on any website. For front-end development, we generally
    use HTML and CSS but for a high-level frontend with lots of animation and content,
    we also use JavaScript. And for the back-end, there are backend programming languages.
    Most websites use PHP because it is easy to program and is highly effective. We
    can use other programming languages also like we can use JavaScript, Python, etc.
    The time taken by a website to load is dependent on its server the more powerful
    the server-id the faster the website loads.


    When we enter any URL in the browser, we send the request to the server of that
    website to send the files of HTML CSS, and JavaScript so that the browser can
    access it and show the content to us. Not every website is made using HTML but
    whether a website is made in any programming language to make it display, it is
    converted to HTML and JavaScript. For example, google.com was mainly written in
    C, C++, and Python but when you see the page source of the website it shows you
    in form of HTML.


    The first website which was obviously made by Tim Berners-Lee was http://info.cern.ch/
    which looks like this


    ![](Images/image00112.jpeg)


    Chapter 2


    HTML


    HTML is an abbreviation for Hypertext Markup language because it is the standard
    markup language for Web sites. Now you will ask where to write this code. So,
    to make a website you can either write the code in any text editor or you can
    use notepad also. I will personally recommend you Visual Studio Code it is free
    and can be used as a text editor and console also to test your equations and codes
    in other programming languages.


    *   How to identify whether it is an HTML file or not


    So, to identify the type of file we use the help of the extension of any file.
    For example, the extension for HTML files is .html and .htm and for CSS it is
    .css and same for JavaScript it is .js. You have to add the extension while saving
    the file on your PC. Have a look at the basic code of HTML. 


    <!DOCTYPE html>


    <html lang="en">


    <head>


        <title>Brajesh Thakur</title>


    </head>


    <body>


        <! -- The content will be written here -->


    </body>


    </html>


    As you can see that the code is started with the word DOCTYPE which denotes that
    the document is an HTML document. In the second it mentioned that the language
    of the code is English. In HTML one of the most important things is tags like
    in the above example <head> is a tag.


    The starting tag is written between less than and greater than sign < here >.
    There are many tags in HTML Some of them are <div>, <p>,  <section>, <html> ,
    <footer>, <li> etc. Every tag has its own properties. In HTML all of the code
    that is to be to displayed is written in <body> tag


    *   HTML Headings.


    There are heading tags in HTML which is denoted but six tags <h1> to  <h6>. Here
    the greater the number is the smaller the text size will be of that heading for
    example <h1> is the heading with the largest font size and the <h6> tag has the
    smallest font – size. See the image below for the demonstration


    CODE


    <!DOCTYPE html>


    <html lang="en">


    <head>


        <title>Brajesh Thakur</title>


    </head>


    <body>


        <h1>This is H1 tag</h1>


        <h2>This is H2 tag</h2>


        <h3>This is H3 tag</h3>


        <h4>This is H4 tag</h4>


        <h5>This is H5 tag</h5>


        <h6>This is H6 tag</h6>


    </body>


    </html>


    RESULT


    ![](Images/image00113.jpeg)


    *   HTML paragraphs


    Because HTML has a heading so it also has paragraphs. For paragraphs we use the
    <p> tag. The code will same and the result will also be displayed the same as
    the previous one as headings.


    CODE


    <!DOCTYPE html>


    <html lang="en">


    <head>


        <title>Brajesh Thakur</title>


    </head>


    <body>


        <p>This the paragraph tag</p>


    </body>


    </html>


    *   HTML Comments.


    Sometimes while making a big project we feel a requirement to write something
    which should not be displayed while loading the web page. So here we use comments.
    Comments are started with <! –  and end with -->.


    *   HTML Attributes.


    In HTML all elements or tags have an attribute. All the attributes are written
    with the starting tag.


    *   The href attribute


    The href attribute is used for <a> tags also known as anchor tags which are used
    to create hyperlinks in the webpage. It defines where the URL is leading to. Below
    you can see how you can use it on your website.


    CODE


    <!DOCTYPE html>


    <html lang="en">


    <head>


        <title>Brajesh Thakur</title>


    </head>


    <body>


        <a href="youtube.com">This Link is leading to YOUTUBE</a>


    </body>


    </html>


    Here you can see that in the href attribute I have added a link to YouTube. So,
    whenever this anchor tag is clicked, it will lead to youtube.com. Mostly anchor
    tag is used as a button. You can add any type of link in this href attribute.
    There are many more attributes like src and alt which are used with <img> tags.


    *   <br> tags


    <br> tag is used in between paragraphs it helps to create a break at a point in
    a line.


    CODE


    <p> This is a demo text in this text I will add a break tag here <br> now this
    is going to start from a new line </p>


    *   HTML CSS


    Many times, while building our websites we have to style only two to three elements
    so here in place of building a new CSS file, we can use CSS in the HTML file itself.
    There are two methods of doing that.


    The first one is Inline CSS


    In inline CSS we use CSS attribute in HTML elements. The use of inline CSS is
    like the following.


     <h1 style="color: blue;">A Blue Heading</h1>


    The second one is Internal CSS


    In internal CSS we use one of the HTML elements <style> mostly it is used in the
    header part of the document. The use of internal CSS is like the following.


    <head>


    <style>


    h1 {color: blue;}


    </style>


    </head>


    Using CSS, you can edit all the properties of any elements in HTML. Like font
    size, font, color, breadth, fill, text alignment, and many more.


    *   HTML TEXT FORMATTING


    There are mainly ten text formatting elements in HTML. Which helps us to format
    the text. The name of those ten elements is given below.


    *   <b>                Makes text bold


    *   <strong>       Refers important words.


    *   <i> Italic text


    *   <em> Emphasized text


    *   <mark> Marked text


    *   <small>          Smaller text


    *   <del>              Deleted text


    *   <ins> Inserted text


    *   <sub> Subscript text


    *   <sup>             Superscript text


    *   HTML QUOTATION AND CITATION ELEMENTS'
