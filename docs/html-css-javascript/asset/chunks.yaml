    \ letters, numbers and an underscore and it doesn’t start with a number.\n\nAnd\
    \ we can also perform all the operations with variables. Because JavaScript is\
    \ a programming language so it shows it result in console. So we will have to\
    \ write all the code in the text editor and see all the result in the console\
    \ itself.\n\nSo lets do something basic Adding first name and last name to make\
    \ a full name. So the code is like this\n\n```\nvar fname = \"Brajesh\";\nvar\
    \ lname = \"Thakur\";\nvar fullname = fname + \" \" + lname;\n```\n\nAnd you can\
    \ open console in your browser by right clicking and there it will show nothing\
    \ but when you type\n\n`console.log(nameofvariable);`\n\nIt will print the value\
    \ of that variable in the console.\n\n### JavaScript Loops\n\nSometimes while\
    \ programming the code for our website, we run to a problem like we have to execute\
    \ a code several of time. The syntax for loops are almost same in all the programming\
    \ languages are same. Loop works with a simple formula first we assign a value\
    \ to a variable or string. Then we set a limit how many times we want to execute\
    \ that certain line of code. And then a last statement which increases the value\
    \ of that variable of that loop. And then the code that should be executed is\
    \ written. This type of loop is known as For Loop the syntax for this loop looks\
    \ like this.\n\n```\nfor (var i = 0; i < 10; i++) {\n  console.log(\"Loop is running\"\
    );\n}\n```\n\n### JavaScript Datatypes\n\nLike other programming languages JavaScript\
    \ also supports all the datatypes like Strings, Booleans, Numbers and more like\
    \ null and undefined. We will discuss in depth about all these datatypes.\n\n\
    #### JavaScript Strings\n\nStrings are useful for holding data that can be represented\
    \ in text form. Some of the most-used operations on strings are to check their\
    \ [length](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/length),\
    \ to build and concatenate them using the `+` and `+=` string operators, checking\
    \ for the existence or location of substrings, or extracting substrings method.\
    \ String is one of the most important datatypes of any programming language. Like\
    \ if you want to get data from the user etc.\n\n#### JavaScript Booleans\n\nVery\
    \ often, in programming, you will need a data type that can only have one of two\
    \ values, like. The syntax of a Boolean looks like as easy as it is. You just\
    \ have to write a yes or no calculation. Like by using comparing signs. Like `<`,\
    \ `>` or `=`. Booleans are used to compare two digits etc.\n\n* YES / NO\n* ON\
    \ / OFF\n* TRUE / FALSE\n\n`Boolean(4651 > 9465)`\n\nThe results will be shown\
    \ accordingly. If yes then true and if not then false.\n\n#### JavaScript Numbers\n\
    \nJavaScript has only one type of number. Numbers can be written with or without\
    \ decimals. Like it can be a normal number or a floating number also known as\
    \ decimals. You can also solve many mathematics problems. The syntax of JavaScript\
    \ numbers looks like this\n\n```\nlet x = 3.14;    // A number with decimals\n\
    let y = 3;       // A number without decimals\n```\n\nJavaScript Numbers are Always\
    \ 64-bit Floating Point\n\n#### JavaScript Null\n\nThe value `null` represents\
    \ the intentional absence of any object value. It is one of JavaScript's [primitive\
    \ values](https://developer.mozilla.org/en-US/docs/Glossary/Primitive) and is\
    \ treated as falsy for Boolean operations.\n\n#### JavaScript Undefined\n\nIt\
    \ refers to a variable which has been declared by us but we haven’t assigned them\
    \ any value.\n\n#### JavaScript Arrays\n\nIn every programming language array\
    \ is a group of datatypes. There are many ways of declaring arrays. The most easiest\
    \ way of declaring an array is this one as shown below in the code. By this method\
    \ you can easily declare arrays and can add more values to it while it’s declaration.\n\
    \n```\nvar list = [\"HTML\", \"CSS\", \"JavaScript\"];\n```\n\nNow you can also\
    \ know how many elements are there in an array by using `.length` property. The\
    \ syntax of this property looks like this.\n\n#### JavaScript Random\n\nUsing\
    \ `Math.random`, it returns a random number between inclusive and exclusive. Means\
    \ between 0 and 1.\n\n## JavaScript Arithmetic\n\nArithmetic operators perform\
    \ arithmetic on numbers (literals or variables). These are the operators of arithmetic\
    \ in JavaScript.\n\n![](Images/image00141.jpeg)\n\n`=`\n\n## JavaScript Reserved\
    \ words\n\nThere are couple of words which are reserved by JavaScript and cannot\
    \ be used as a name of class or variable etc. The whole list of those words are\
    \ as shown in the next page.\n\n`await`, `break`, `case`, `catch`, `class`, `const`,\
    \ `continue`, `debugger`, `default`, `delete`, `do`, `else`, `enum`, `export`,\
    \ `extends`, `false`, `finally`, `for`, `function`, `if`, `implements`, `import`,\
    \ `in`, `instanceof`, `interface`, `let`, `new`, `null`, `package`, `private`,\
    \ `protected`, `public`, `return`, `super`, `switch`, `static`, `this`, `throw`,\
    \ `try`, `True`, `typeof`, `var`, `void`, `while`, `with`, `yield`.\n\n## Chapter\
    \ 5 BOOTSTRAP\n\nBootstrap is a free front-end framework for faster and easier\
    \ web development. It includes HTML and CSS based design templates for typography,\
    \ forms, buttons, tables, navigation, modals, image carousels and many other,\
    \ as well as optional JavaScript plugins. It also gives you the ability to easily\
    \ create responsive designs. The URL of the official website of Bootstrap is\n\
    \nhttps://getbootstrap.com/\n\n![upload.wikimedia.org/wikipedia/commons/thumb/b/...](Images/image00142.jpeg)\n\
    \nThis is the basic code of used making form. Its not that complicated. Because\
    \ there are just some extra classes that are used in HTML and those classes are\
    \ powered by bootstrap and have certain properties.\n\n```\n<div class=\"mb-3\"\
    >\n  <label for=\"exampleFormControlInput1\" class=\"form-label\">Email address</label>\n\
    \  <input type=\"email\" class=\"form-control\" id=\"exampleFormControlInput1\"\
    \ placeholder=\"name@example.com\">\n</div>\n<div class=\"mb-3\">\n  <label for=\"\
    exampleFormControlTextarea1\" class=\"form-label\">Example textarea</label>\n\
    </div>\n```\n"
