  trans: "\n\n这种文本对齐方式的结果如下页所示。你可以看到整个段落左对齐，但最后一行居中对齐。而且这也是响应式的。比如，如果你在手机上打开那个网页，你会发现只有最后一行是居中对齐的。\n\
    \n![](img/image00129.jpeg)\n\n## 文本方向\n\n`direction` 和 `unicode-bidi` 属性可用于改变元素的文本方向：它们可用于书写像乌尔都语这样从右向左书写的显示语言。在其语法中，我们指定了从右到左的方向。语法如下所示：\n\
    \n```css\np {\n  direction: rtl;\n}\n```\n\n结果如下所示：\n\n![](img/image00130.jpeg)\n\
    \n## 垂直对齐\n\n`vertical-align` 属性设置元素的垂直对齐方式。例如，这里是一个在段落中使用的图片。这个垂直对齐属性有很多值。它们如下面的代码所示。\n\
    \n```css\nimg.a {\n  vertical-align: baseline;\n}\n\nimg.a {\n  vertical-align:\
    \ text-top;\n}\n\nimg.a {\n  vertical-align: text-bottom;\n}\n\nimg.a {\n  vertical-align:\
    \ sub;\n}\n\nimg.a {\n  vertical-align: super;\n}\n```\n\n上述代码的结果如下页所示，你可以看到图片相应地改变了位置，比如从上到下等。\n\
    \n![](img/image00131.jpeg)\n\n## CSS 文本转换\n\n`text-transform` 属性用于指定文本中的大写和小写字母。它可以将所有内容转换为大写或小写字母，或者将每个单词的首字母大写：如果你写了小写内容但希望它变成大写，这会非常有用。语法如下所示：\n\
    \n```css\np {\n  text-transform: uppercase;\n}\n```\n\n## 文本阴影\n\n`text-shadow`\
    \ 属性为文本添加阴影。在最简单的用法中，你只需指定水平阴影（2px）和垂直阴影（2px）。它能让你的文本看起来更吸引人。其代码如下所示：\n\n```css\n\
    h1 {\n  text-shadow: 2px 2px red;\n}\n```\n\n在上面的代码中，你可以看到我们设置了水平 2px 阴影和垂直 2px\
    \ 阴影，最后添加了阴影颜色为红色。上述代码的结果如下所示。\n\n![](img/image00132.jpeg)\n\n## CSS 字体\n\n在你的网站中，字体在吸引力方面起着重要作用。一个有力的字体可以为你的网站和品牌创造强大的识别度。字体应该易于阅读和理解，除此之外，你选择的任何字体都应该有吸引力。大多数网站使用\
    \ 'Arial' 字体，比如 Google、YouTube 等。\n\n在 CSS 中，主要有五种字体系列：\n\n*   Serif（衬线体）\n* \
    \  Sans-Serif（无衬线体）\n*   Monospace（等宽体）\n*   Cursive（手写体）\n*   Fantasy（装饰体）\n\n\
    ### 网络安全字体\n\n有些字体默认存在于每台计算机中，不需要互联网连接或服务器速度。因为大多数情况下，如果我们使用来自外部网站的字体，而浏览器无法访问你使用这些字体的网站，那么你网站上的所有字体都会消失，你的网站会变得很难看。因此，你应该使用网络安全字体。这样，无论发生什么，字体都能安全加载，并且不会以任何方式影响你的网站。我列出了一些网络安全字体。这些是最常用的网络安全字体。\n\
    \n1.  Arial (sans-serif)\n2.  Verdana (sans-serif)\n3.  Helvetica (sans-serif)\n\
    4.  Tahoma (sans-serif)\n5.  Trebuchet MS (sans-serif)\n6.  Times New Roman (serif)\n\
    7.  Georgia (serif)\n8.  Garamond (serif)\n9.  Courier New (monospace)\n10. Brush\
    \ Script MT (cursive)\n\n### 字体粗细\n\n字体粗细用于控制粗体。你可以添加像 normal 或 bold 这样的值。其代码和结果如下页所示。\n\
    \n```css\np {\n  font-weight: bold;\n}\n```\n\n![](img/image00133.jpeg)\n\n###\
    \ 字体大小\n\n与其他元素一样，你也可以设置属性来控制文本大小。你可以用 px 和 rem 来指定文本大小的值。1 rem 等于 16px。\n\n###\
    \ Google 字体\n\n现在，你的网站使用网络安全字体看起来可能不那么吸引人。所以你可以使用外部网站的字体。最好的选择是 Google Fonts。因为这个网站永远不会宕机，而且你在网站上使用的所有字体都是安全的。现在你会想，我们如何在网站中使用\
    \ Google 字体呢？\n\n首先，访问 fonts.google.com，选择一个合适的字体。然后选择该字体的所有变体。现在你会在右下角看到一些链接。复制底部的链接并将其粘贴到你的\
    \ head 标签中。这就是如何在 HTML 文件中添加字体系列的方法。\n\n![](img/image00134.jpeg)\n\n## CSS 链接\n\
    \n我们可以为锚标签的四个阶段添加属性。这四个阶段是：\n\n*   `a:link` - 一个普通的、未访问的链接。\n*   `a:visited` -\
    \ 用户已访问过的链接。\n*   `a:hover` - 用户鼠标悬停时的链接。\n*   `a:active` - 链接被点击的瞬间。\n\n为锚标签赋予所有这些属性的语法如下所示。\n\
    \n```css\na:link {\n  color: red;\n}\n\na:visited {\n  color: green;\n}\n\na:hover\
    \ {\n  color: blue;\n}\n\na:active {\n  color: yellow;\n}\n```\n\n## CSS 定位\n\n\
    `position` 属性指定用于元素的定位方法类型（static、relative、fixed、absolute 或 sticky）。然后使用 top、bottom、left\
    \ 和 right 属性对元素进行定位。但是，除非先设置了 `position` 属性，否则这些属性将不起作用。它们的工作方式也因 position 值而异。\n\
    \n### 静态定位\n\n这是 position 属性的默认值。静态定位的元素不受 top、bottom、left、right 属性的影响。静态定位的代码如下所示：\n\
    \n```css\ndiv {\n  position: static;\n  border: 1px #fff;\n}\n```\n\n### 相对定位\n\
    \n在这种定位中，元素处于其相对位置。设置相对定位元素的 top、right、bottom 和 left 属性将使其偏离其正常位置。其他内容不会调整以填补元素留下的任何间隙。\n\
    \n```css\ndiv {\n  position: relative;\n  border: 1px #fff;\n}\n```\n\n### 固定定位\n\
    \n在这种定位中，元素固定在其相对位置。这意味着无论你滚动到页面底部，它都不会移动。\n\n```css\ndiv {\n  position: fixed;\n\
    \  bottom: 0;\n  right: 0;\n  width: 100%;\n}\n```\n\n### 绝对定位\n\n具有 `position:\
    \ absolute` 的元素相对于最近的已定位祖先元素进行定位。绝对定位的元素会脱离正常文档流，并且可以重叠其他元素。\n\n```css\ndiv {\n\
    \  position: absolute;\n  top: 80px;\n  right: 0;\n  width: 200px;\n  height:\
    \ 100px;\n}\n```\n\n### 粘性定位\n\n如果一个元素的 position 属性值设置为 sticky，它将始终粘在那里，常用于制作网站导航栏。\n\
    \n```css\ndiv {\n  position: -webkit-sticky;\n  position: sticky;\n  top: 0;\n\
    \  background-color: black;\n  border: 1px solid #fff;\n}\n```\n\n## Z-INDEX\n\
    \n`z-index` 属性指定元素的堆叠顺序。使用此属性，我们可以选择哪个元素应该在上层，哪个应该在下层。其值范围从负无穷到正无穷。元素的值越大，它就越靠上。在下面的代码中，你可以看到我们设置了\
    \ `z-index: -1`，这意味着它是最低的，图像将位于文档的最底层。\n\n```css\nimg {\n  position: absolute;\n\
    \  margin: auto;\n  top: 0px;\n  z-index: -1;\n}\n```\n\n## CSS 浮动\n\n`float`\
    \ 属性用于定位和格式化内容，例如让一个 div 或图像浮动到容器的左侧。`float` 属性可以具有以下值之一：\n\n*   `left` - 元素浮动到其容器的左侧。\n\
    *   `right` - 元素浮动到其容器的右侧。\n*   `none` - 元素不浮动。\n*   `inherit` - 元素继承其父元素的 float\
    \ 值。\n\n"
- fmt: "\n# Chapter 4\n## JAVASCRIPT\n\nThe syntax and the result of the same looks\
    \ like this\n\n```css\nimg {\n  float: right;\n}\n```\n\n![](Images/image00135.jpeg)\n\
    \n## CSS DISPLAY - INLINE BLOCK\n\nThis property is used to display an element\
    \ as an inline-level block container. `inline-block` allows to set a width and\
    \ height on the element. Most of the developers uses `inline-block` to create\
    \ navigation bars.\n\n## CSS COMBINATOR\n\nA CSS selector can contain more than\
    \ one simple selector. Between the simple selectors, we can include a combinator.\
    \ Because sometimes to access an element of HTML we have to specify its location\
    \ in the document.\n\nThere are four different combinators in CSS:\n\n- descendant\
    \ selector (space)\n- child selector (>)\n\n### Descendant Selector\n\nThe descendant\
    \ selector matches all elements that are descendants of a specified element. The\
    \ following example accessing all `<p>` elements inside `<div>` elements\n\n```css\n\
    div p {\n  background-color: yellow;\n}\n```\n\n### Child Selector\n\nThe descendant\
    \ selector matches all elements that the child selector selects all elements that\
    \ are the children of a specified element. The following example selects all `<p>`\
    \ elements that are children of a `<div>` element:\n\n```css\ndiv > p {\n  background-color:\
    \ yellow;\n}\n```\n\n## CSS PSEUDO-CLASSES\n\nA pseudo-class is used to define\
    \ a special state of an element. Like we have seen in the case of anchor tag.\
    \ The syntax looks like given below.\n\nFor example, it can be used to:\n\n- Style\
    \ an element when a user mouses over it\n- Style visited and unvisited links differently\n\
    - Style an element when it gets focus.\n\n```css\nselector:pseudo-class {\n  property:\
    \ value;\n}\n```\n\nHere the `selector` refers to the element whose pseudo class\
    \ you are selecting. And `pseudo-class` refers to the pseudo class of the element.\n\
    \n### Anchor Pseudo-classes\n\nAs we learned earlier that anchor tag can be displayed\
    \ in different ways and the code is shown in the next place. And in that code\
    \ we are accessing every stage of an anchor tag. We can use pseudo classes like\
    \ `hover` on almost every element of HTML.\n\n```css\na:link {\n  color: white;\n\
    }\na:visited {\n  color: black;\n}\na:hover {\n  color: yellow;\n}\na:active {\n\
    \  color: green;\n}\n```\n\n### CSS - The: first-child Pseudo-class\n\nThis pseudo\
    \ class helps us to access the first use of that element in the HTML document.\
    \ So we can access it easily by using `first-child` property.\n\nIn the following\
    \ example that is shown in the next page, the selector matches any `<p>` element\
    \ that is the first child of it.\n\n```css\np:first-child {\n  color: blue;\n\
    }\n```\n\n## CSS PSEUDO-ELEMENTS\n\nA CSS pseudo-element is used to style specified\
    \ parts of an element. There are many pseudo elements. And the syntax of using\
    \ pseudo element looks like\n\n```css\nselector::pseudo-element {\n  property:\
    \ value;\n}\n```\n\n### The:: first-line Pseudo-element\n\nThe `::first-line`\
    \ pseudo-element is used to add a special style to the first line of a text. It\
    \ is applicable to all the text elements. Note: The `::first-line` pseudo-element\
    \ can only be applied to block-level elements. The syntax is as follows.\n\n```css\n\
    p::first-line {\n  color: #000;\n}\n```\n\n### The:: first-letter Pseudo-element\n\
    \nThe `::first-letter` pseudo-element is used to add a special style to the first\
    \ letter of a text. The following example formats the first letter of the text\
    \ in all `<p>` elements. The syntax is as follows in the next page. The `::first-letter`\
    \ pseudo-element can only be applied to block-level elements.\n\n```css\np::first-letter\
    \ {\n  color: #ff0000;\n  font-size: xx-large;\n}\n```\n\n### The:: before Pseudo-element\n\
    \nThe `::before` pseudo-element can be used to insert some content before the\
    \ content of an element. The following example inserts an image before the content\
    \ of each `<h1>` element. All the properties that we give to this `::before` pseudo\
    \ element is displayed in the HTML document. The syntax looks like this\n\n```css\n\
    h1::before {\n  content: url(book.png);\n}\n```\n\n### CSS - The:: after Pseudo-element\n\
    \nThe `::after` pseudo-element can be used to insert some content after the content\
    \ of an element. The following example inserts an image after the content of each\
    \ `<h1>` element: The syntax looks like this.\n\n```css\nh1::after {\n  content:\
    \ url(book.png);\n}\n```\n\n### The:: selection Pseudo-element\n\nHave you seen\
    \ that when we select something in a webpage it has a different properties. By\
    \ default, it is with background set to blue. You can edit all this by using the\
    \ simple syntax shown in the next page.\n\n```css\n::selection {\n  color: white;\n\
    \  background: black;\n}\n```\n\n## NAVIGATION BAR\n\nA navigation bar needs standard\
    \ HTML as a base. Having easy-to-use navigation is important for any web site.\
    \ To make a basic navigation bar we used `ul` tag and `li` tag. So the HTML code\
    \ looks like this.\n\n```html\n<ul>\n  <li><a href=\"default.asp\">Home</a></li>\n\
    \  <li><a href=\"news.asp\">News</a></li>\n  <li><a href=\"contact.asp\">Contact</a></li>\n\
    \  <li><a href=\"about.asp\">About</a></li>\n</ul>\n```\n\nAnd to make it more\
    \ attractive we will add some basic CSS code which looks like this. Here we are\
    \ removing the bullet by setting `list-style-type` to `none`. And by `margin`\
    \ and `padding` zero we are giving it the top left position.\n\n```css\nul {\n\
    \  list-style-type: none;\n  margin: 0;\n  padding: 0;\n}\n```\n\nIn HTML every\
    \ navigation bar we make is always vertical but how to make Horizontal Navigation\
    \ bar. Mostly I uses the code given in the next page. In which I set `display`\
    \ to `flex` which sets all them horizontally and then give some margin to it.\n\
    \n```css\nul {\n  background-color: rgb(14, 13, 13);\n  display: flex;\n  list-style-type:\
    \ none;\n  margin: 0;\n  padding: 0;\n}\nul li {\n  color: white;\n  margin-left:\
    \ 20px;\n  margin-right: 20px;\n}\n```\n\nThe result of this code is something\
    \ like this as shown below in the image.\n\n![](Images/image00136.jpeg)\n\n# Chapter\
    \ 4\n## JAVASCRIPT\n\nJavaScript, often abbreviated JS, is a programming language\
    \ that is one of the core technologies of the World Wide Web, alongside HTML and\
    \ CSS. Over 97% of websites use JavaScript on the client side for web page behaviour,\
    \ often incorporating third-party libraries. JavaScript is also used for server-side\
    \ programming for making databases. In this book we will only learn JavaScript\
    \ for frontend development only. Now just get an introduction to JavaScript by\
    \ looking at the below code.\n\n```html\n<script>\n  document.write(\"Introduction\
    \ to JavaScript.\");\n</script>\n```\n\nThe result will same as if it is written\
    \ using HTML.\n\n![](Images/image00137.jpeg)\n\n### USING JAVASCRIPT IN HTML\n\
    \nTo use JavaScript in HTML we have two options either we use internal JavaScript\
    \ or we can also use External JavaScript. To use external CSS we will have to\
    \ use `script` tag and then use `src` attribute to locate the js file. This below\
    \ given code can be written in `head` tag or it can also be written in `body`\
    \ tag. The syntax looks like this.\n\n```html\n<script src=\"myScript.js\"></script>\n\
    ```\n\nAnd to use internal CSS we will use `script` tag only and write all the\
    \ code inside it.\n\nI will recommend you to use external JS file because first\
    \ of all it helps to make your code look beautiful and easy to read and understand\
    \ and separates HTML CSS and JS. It gives a positive impact of your code on others.\n\
    \n### JavaScript Display\n\nAs we saw in the first ever example of the JS chapter,\
    \ we printed a text using JS. There are many more ways to display data using JS\
    \ in HTML document. We will discuss all of them one by one.\n\n#### innerHTML\n\
    \nTo access an HTML element, JavaScript can use the `document.getElementById(id)`\
    \ method. The `id` attribute defines the HTML element. It can be `<p>` tag or\
    \ any other text tag and the `innerHTML` property defines the HTML content. Here\
    \ we will have to first add a `<p>` tag and give it an `id` which we can access\
    \ through JavaScript. So the final code will look like.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<p id=\"web\"></p>\n<script>\ndocument.getElementById(\"\
    web\").innerHTML = \"Written using inner HTML\";\n</script>\n</body>\n</html>\n\
    ```\n\nThe result will look same as if it is written using HTML. It is also shown\
    \ in the next page.\n\n![](Images/image00138.jpeg)\n\n#### document.write()\n"
