  trans: "\n\n* 有序列表：有序列表以 `<ol>` 标签开头。每个列表项以 `<li>` 标签开头。默认情况下，列表项会用数字标记。代码和效果如下所示。\n\
    \n![](img/image00116.jpeg)\n\n```\n<ol>\n  <li>Coffee</li>\n  <li>Tea</li>\n \
    \ <li>Milk</li>\n</ol>\n```\n\n* 无序列表：无序列表以 `<ul>` 标签开头。每个列表项以 `<li>` 标签开头。默认情况下，列表项会用项目符号（小黑圆点）标记。代码和效果如下所示。\n\
    \n![](img/image00117.jpeg)\n\n```\n<ul>\n  <li>Coffee</li>\n  <li>Tea</li>\n \
    \ <li>Milk</li>\n</ul>\n```\n\nHTML 中还有更多类型的列表。下面列出了所有类型。\n\n* `<dl>`：定义描述列表类型。\n\
    * `<dt>`：定义描述列表中的术语。\n* `<dd>`：描述描述列表中的术语。\n\n## 块级元素与内联元素\n\n每个 HTML 元素都有一个默认的显示值，具体取决于元素的类型。显示值有两种：块级和内联。\n\
    \n### 块级元素\n\n块级元素总是从新行开始，浏览器会自动在元素前后添加一些空间（外边距）。块级元素总是占据可用的全部宽度。有两个常用的元素：`<p>`\
    \ 和 `<div>`。`<p>` 元素在 HTML 文档中定义段落。`<div>` 元素在 HTML 文档中定义分区或节。所有块级元素如下：\n\n[`<address>`](https://www.w3schools.com/tags/tag_address.asp)\
    \ , [`<article>`](https://www.w3schools.com/tags/tag_article.asp) , [`<aside>`](https://www.w3schools.com/tags/tag_aside.asp)\
    \ , [`<blockquote>`](https://www.w3schools.com/tags/tag_blockquote.asp) , [`<canvas>`](https://www.w3schools.com/tags/tag_canvas.asp)\
    \ , [`<dd>`](https://www.w3schools.com/tags/tag_dd.asp) , [`<div>`](https://www.w3schools.com/tags/tag_div.asp)\
    \ , [`<dl>`](https://www.w3schools.com/tags/tag_dl.asp) , [`<dt>`](https://www.w3schools.com/tags/tag_dt.asp)\
    \ , [`<fieldset>`](https://www.w3schools.com/tags/tag_fieldset.asp) , [`<figcaption>`](https://www.w3schools.com/tags/tag_figcaption.asp)\
    \ , [`<figure>`](https://www.w3schools.com/tags/tag_figure.asp) , [`<footer>`](https://www.w3schools.com/tags/tag_footer.asp)\
    \ , [`<form>`](https://www.w3schools.com/tags/tag_form.asp) , [`<h1>-<h6>`](https://www.w3schools.com/tags/tag_hn.asp)\
    \ , [`<header>`](https://www.w3schools.com/tags/tag_header.asp) , [`<hr>`](https://www.w3schools.com/tags/tag_hr.asp)\
    \ , [`<li>`](https://www.w3schools.com/tags/tag_li.asp) , [`<main>`](https://www.w3schools.com/tags/tag_main.asp)\
    \ , [`<nav>`](https://www.w3schools.com/tags/tag_nav.asp) , [`<noscript>`](https://www.w3schools.com/tags/tag_noscript.asp)\
    \ , [`<ol>`](https://www.w3schools.com/tags/tag_ol.asp) , [`<p>`](https://www.w3schools.com/tags/tag_p.asp)\
    \ , [`<pre>`](https://www.w3schools.com/tags/tag_pre.asp) , [`<section>`](https://www.w3schools.com/tags/tag_section.asp)\
    \ , [`<table>`](https://www.w3schools.com/tags/tag_table.asp) , [`<tfoot>`](https://www.w3schools.com/tags/tag_tfoot.asp)\
    \ , [`<ul>`](https://www.w3schools.com/tags/tag_ul.asp) , [`<video>`](https://www.w3schools.com/tags/tag_video.asp).\n\
    \n### 内联元素\n\n内联元素不会从新行开始。内联元素只占据必要的宽度。我们日常使用的一个元素是 `<span>`。它也不需要新行，而是在同一行内适应给定的尺寸。所有内联元素如下：\n\
    \n[`<a>`](https://www.w3schools.com/tags/tag_a.asp) , [`<abbr>`](https://www.w3schools.com/tags/tag_abbr.asp)\
    \ , [`<acronym>`](https://www.w3schools.com/tags/tag_acronym.asp) , [`<b>`](https://www.w3schools.com/tags/tag_b.asp)\
    \ , [`<bdo>`](https://www.w3schools.com/tags/tag_bdo.asp) , [`<big>`](https://www.w3schools.com/tags/tag_big.asp)\
    \ , [`<br>`](https://www.w3schools.com/tags/tag_br.asp) , [`<button>`](https://www.w3schools.com/tags/tag_button.asp)\
    \ , [`<cite>`](https://www.w3schools.com/tags/tag_cite.asp) , [`<code>`](https://www.w3schools.com/tags/tag_code.asp)\
    \ , [`<dfn>`](https://www.w3schools.com/tags/tag_dfn.asp) , [`<em>`](https://www.w3schools.com/tags/tag_em.asp)\
    \ , [`<i>`](https://www.w3schools.com/tags/tag_i.asp) , [`<img>`](https://www.w3schools.com/tags/tag_img.asp)\
    \ , [`<input>`](https://www.w3schools.com/tags/tag_input.asp) , [`<kbd>`](https://www.w3schools.com/tags/tag_kbd.asp)\
    \ , [`<label>`](https://www.w3schools.com/tags/tag_label.asp) , [`<map>`](https://www.w3schools.com/tags/tag_map.asp)\
    \ , [`<object>`](https://www.w3schools.com/tags/tag_object.asp) , [`<output>`](https://www.w3schools.com/tags/tag_output.asp)\
    \ , [`<q>`](https://www.w3schools.com/tags/tag_q.asp) , [`<samp>`](https://www.w3schools.com/tags/tag_samp.asp)\
    \ , [`<script>`](https://www.w3schools.com/tags/tag_script.asp) , [`<select>`](https://www.w3schools.com/tags/tag_select.asp)\
    \ , [`<small>`](https://www.w3schools.com/tags/tag_small.asp) , [`<span>`](https://www.w3schools.com/tags/tag_span.asp)\
    \ , [`<strong>`](https://www.w3schools.com/tags/tag_strong.asp) , [`<sub>`](https://www.w3schools.com/tags/tag_sub.asp)\
    \ , [`<sup>`](https://www.w3schools.com/tags/tag_sup.asp) , [`<textarea>`](https://www.w3schools.com/tags/tag_textarea.asp)\
    \ , [`<time>`](https://www.w3schools.com/tags/tag_time.asp) , [`<tt>`](https://www.w3schools.com/tags/tag_tt.asp)\
    \ , [`<var>`](https://www.w3schools.com/tags/tag_var.asp).\n\n## HTML 类\n\nHTML\
    \ 的 `class` 属性用于为元素指定一个类。因为我们在文档中会多次使用同一个元素，所以如果要对单个元素进行样式设置，几乎是不可能的，但有了 `class`\
    \ 属性，就可以轻松实现。通过这个属性，我们可以为元素命名，并在样式表和 JS 文件中通过该名称访问它。我们将在本书后面简要学习它。\n\n要在 CSS 中设置样式，我们在类名前面加一个点，然后就可以编辑该类的属性。类名是区分大小写的，这意味着\
    \ `Imp` 和 `imp` 是两个不同的类。我们可以为不同的元素指定相同的类名。如果我们想为两个不同的元素赋予相同的属性，可以给它们一个共同的类，然后为该类设置属性。一个元素也可以有多个类，只需在它们之间用空格隔开即可。\n\
    \n在下面的代码中，`span` 被赋予了名为 `imp` 的类。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <style>\n.note {\n  font-size: 120%;\n  color: red;\n}\n</style>\n</head>\n<body>\n\
    <h1>My <span class=\"imp\">Important</span> Heading</h1>\n<p>This is some <span\
    \ class=\"imp\">important</span> text. </p>\n</body>\n</html>\n```\n\n## HTML\
    \ ID\n\nHTML 的 `id` 属性用于为 HTML 元素指定唯一的 ID。在 HTML 文档中，不能有多个元素使用相同的 ID。`id` 属性在样式表和\
    \ JS 文件中访问时，总是用 `#` 表示。该属性也是区分大小写的。类和 ID 都用于为元素命名，但 ID 和类的一个区别是：类可以是共用的，而 ID 必须始终唯一。ID\
    \ 还可以帮助你在文档中创建一个位置链接，用户可以通过锚点标签跳转到该位置。请查看下面的代码，了解它如何与锚点标签配合使用。\n\n```html\n<a\
    \ href=\"book.html#imp\">What’s important</a>\n```\n\n## HTML iframe\n\n你是否见过网站中的网站，或者网页中嵌入的视频或\
    \ PDF？那么开发者是如何做到的呢？他们使用 `iframe` 元素来实现。嵌入文档的语法如下所示。\n\n```html\n<iframe src=\"\
    URL of the document\" title=\"about the url \"></iframe>\n```\n\n## HTML 文件路径\n\
    \n文件路径是任何文件或文件夹的位置名称。在 HTML 中，我们使用 `src` 属性来访问它。你可以查看下面的表格，了解路径及其用法。文件路径用于将其他文件与你的文档链接起来。它们可以是图片、CSS\
    \ 文件或 JS 文件。\n\n![](img/image00118.jpeg)\n\n## HTML head 标签\n\nHTML 的 `<head>`\
    \ 元素或 `<head>` 标签是以下元素的容器：`<title>`、`<style>`、`<meta>`、`<link>`、`<script>` 和 `<base>`。\n\
    \n"
- fmt: "\nThe `<head>` element is a container for metadata (data about data) and is\
    \ placed between the `<html>` tag and the `<body>` tag. HTML metadata is data\
    \ about the HTML document. Metadata is not displayed. Metadata typically define\
    \ the document title, character set, styles, scripts, and other meta information.\
    \ Metadata helps us to make a website responsive as well. Style elements is also\
    \ present in `<head>` tag only. One example of metadata that you have seen in\
    \ html files is given below. It makes our website beautiful and spreads in the\
    \ width of the device.\n\n`<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">`\n\n## HTML RESPONSIVE DESIGNS\n\nResponsive web design\
    \ is about creating web pages that look good on all devices! A responsive web\
    \ design will automatically adjust for different screen sizes and viewports. Either\
    \ it will automatically adjust to the screen size or we will have to do it manually.\
    \ It helps us to get more and more visitor from any screen size. Mainly there\
    \ are three screen sizes first one is pc second one is tablet and third one is\
    \ smartphone.\n\n![Responsive website design - adapt, respond and overcome](Images/image00119.jpeg)\n\
    \nResponsive Web Design is about using HTML and CSS to automatically resize, hide,\
    \ shrink, or enlarge, a website, to make it look good on all devices (desktops,\
    \ tablets, and phones).\n\nTo make website responsive you should first setup the\
    \ view port by adding meta tag in the head tag. We always want that our website\
    \ should responsive so whenever you add an image you should make a habit to give\
    \ it 100% width. This will decrease your effort while making your websites responsive.\
    \ The code will be like this\n\n`<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">`\n\nThis all is very stressful and it needs a lot of hard\
    \ work you there is one CSS framework which reduces our effort but I will not\
    \ recommend to use bootstrap till you are fully expert in web development and\
    \ now wants to make more website to serve your clients in less time. We will cover\
    \ bootstrap later on in this book.\n\n## HTML CHARACTER ENTITIES\n\nAs you might\
    \ know that we can not add more than one white space in HTML so you can use different\
    \ characters to create more than one white – space. So if you want to add character\
    \ to your html file you will have to add a meta tag defining charset Some of the\
    \ character entities are.\n\n* `&nbsp;` creates white space.\n* `&lt;` is used\
    \ for “<” less than sign.\n* `&gt;` is used for “>” greater than sign.\n* `&copy;`\
    \ is used for creating ©.\n\nThe meta code for charset looks like this.\n\n`<meta\
    \ charset=\"UTF-8\">`\n\n## HTML FORMS\n\nYou must have seen that most of the\
    \ websites contains forms it can be for any reasons whether for revie for comment\
    \ or for complaint etc. You can create forms in HTML using `<form>` element. This\
    \ is the basic code for a form in HTML.\n\n```\n<form>\n  <label for=\"fname\"\
    >First name:</label><br>\n  <input type=\"text\" id=\"fname\" name=\"fname\"><br>\n\
    \  <label for=\"lname\">Last name:</label><br>\n  <input type=\"text\" id=\"lname\"\
    \ name=\"lname\">\n</form>\n```\n\n## HTML FORMS ATTRIBUTES AND ELEMENTS\n\nIn\
    \ HTML same as other elements form element also have some attributes in it that\
    \ are used for making it easy for styling it in css and for working of the form.\
    \ As you can see here, we have used a new element named `label` it is used to\
    \ add a label to the input as you can see it below in the result. And in the `type`\
    \ attribute we can add different values to it like for checkboxes we can add `checkbox`\
    \ in the value for the attribute type. Same for radio buttons you can add `radio`\
    \ as the value for `type` attribute.\n\n![](Images/image00120.jpeg)\n\nDon’t you\
    \ see one thing missing in it. Yes, that’s the submit button. You can add submit\
    \ button to any form by simply writing the following code.\n\n`<input type=\"\
    submit\" value=\"Submit\">`\n\n## HTML FORMS ACTION AND METHOD ATTRIBUTE\n\nNow\
    \ this form will be filled by the user but how will we get all this information\
    \ that the user has filled. So we have to link an file which will connect our\
    \ website to our database. So we can do it from many languages like python, PHP\
    \ etc. Mostly in web development we use PHP so in `action` attribute we have to\
    \ fill the name of the PHP file as the value for it.\n\nNow the second attribute\
    \ in HTML forms is `method` attribute now this attribute also has many values.\
    \ First, we should know about it. So, it’s the method by which the data will transferred\
    \ from your client’s browser to your data base. So, all the values for this method\
    \ attribute are\n\n* `GET`\n* `POST`\n* `PUT`\n* `HEAD`\n* `DELETE`\n* `PATCH`\n\
    * `OPTIONS`\n* `CONNECT`\n* `TRACE`\n\nMost of the backend developers prefers\
    \ `POST` because post is more secure than `GET` and `GET` method can be easily\
    \ hacked or accessed by anyone. The information entered in the `GET` method form\
    \ is stored in the browser. So, while making your website and its form always\
    \ try to use `POST` method.\n\n## HTML MEDIA\n\nWe can add many types of videos\
    \ with any extension in HTML. Mostly our videos are in MP4 and MPEG format so\
    \ we can add videos with these extension in our webpage. Same with audio files.\
    \ Audio files extensions like MP4, MP3 and `.ogg` are also supported by HTML.\
    \ You can add videos to your webpage with `video` element and audio with `audio`\
    \ element. You can use `autopay` attribute to make the file play automatically\
    \ when someone opens that page. The basic code for adding a video is like given\
    \ below.\n\n```\n<video width=\"320\" height=\"240\" controls>\n  <source src=\"\
    video.mp4\" type=\"video/mp4\">\n</video>\n```\n\nNow in the above code you can\
    \ see that we have used `video` element and given width and height using both\
    \ attributes. And the other attribute named `controls` doesn’t need any value\
    \ and it gives all the control to the videos like play, timeline, options etc.\
    \ At last, the `track` element. The `track` element is used for adding subtitles\
    \ to the video the extension for the subtitle its `.vtt` the result will look\
    \ like this\n\n![](Images/image00121.jpeg)\n\n## HTML YOUTUBE VIDEO EMBEDING\n\
    \nYou must be wondering that how most of the websites uses YouTube videos and\
    \ embed them in their websites. You can do this with the help of `iframe` element.\
    \ It’s very difficult to write the embed link for the YouTube video. That’s why\
