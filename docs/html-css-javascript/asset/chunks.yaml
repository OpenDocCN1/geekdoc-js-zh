  trans: "\n\n这是在 HTML 中打印内容的第二种方法。对于初学者来说，它也非常有用，因为其语法易于阅读和理解，只需看一下语法即可。结果将与之前相同。但是，如果在整个文档加载完成后添加或执行\
    \ `document.write`，它将擦除所有内容，只有 JS 中填充的文本才会可见。例如，在按钮中使用 `document.write` 可能会给你的网页带来问题。\n\
    \n```\n<p id=\"web\"></p>\n\n<script>\ndocument.getElementById(\"web\").innerHTML\
    \ = \"This is written using document.write\";\n</script>\n```\n\n## window.alert()\n\
    \n你一定见过许多网站中出现的各种形式的弹窗。比如在提交任何表单之前等等。那么如何实现这些呢？请看下面给出的代码。\n\n```\n<script>\nwindow.alert(4189);\n\
    </script>\n```\n\n弹窗的结果如下图所示。\n\n![](img/image00139.jpeg)\n\n## JavaScript 打印\n\
    \n是的，你可以使用 JavaScript 一键直接打印网页。你只需使用一个按钮和下面编写的代码即可。\n\n```\n<button onclick=\"\
    window.print()\">Print this page</button>\n```\n\n![](img/image00140.jpeg)\n\n\
    结果将如下所示。当有人点击按钮后，会弹出一个窗口，为访问者提供打印选项，然后保存该网页。\n\n## JavaScript 运算\n\n与其他任何编程语言一样，你可以使用\
    \ JavaScript 进行所有数学运算。例如，对单词或数字进行加法，或者进行减法、乘法和除法等其他计算。要开始学习运算，首先让我们了解变量。\n\n###\
    \ JavaScript 变量\n\n到目前为止，我们只是直接在网页上打印内容。但通过使用变量，我们可以创建变量并为其赋值。使用变量的语法如下所示。\n\n\
    `var name = \"value\"`\n\n在上面的代码行中，你可以看到，首先我们需要编写 `var` 来创建一个变量，然后为其分配一个唯一的名称，接着使用\
    \ `=` 符号为其赋值。之后我们可以仅通过名称来访问该值。但在命名变量时，应确保它只包含字母、数字和下划线，并且不能以数字开头。\n\n我们还可以对变量执行所有运算。因为\
    \ JavaScript 是一种编程语言，所以它的结果显示在控制台中。因此，我们需要在文本编辑器中编写所有代码，并在控制台中查看所有结果。\n\n那么，让我们做一些基础操作：将名字和姓氏相加组成全名。代码如下：\n\
    \n```\nvar fname = \"Brajesh\";\nvar lname = \"Thakur\";\nvar fullname = fname\
    \ + \" \" + lname;\n```\n\n你可以通过右键单击在浏览器中打开控制台，那里不会显示任何内容，但当你输入\n\n`console.log(nameofvariable);`\n\
    \n它将在控制台中打印该变量的值。\n\n### JavaScript 循环\n\n有时在为我们的网站编写代码时，我们会遇到一个问题，比如需要多次执行某段代码。循环的语法在所有编程语言中几乎相同。循环遵循一个简单的公式：首先，我们为变量或字符串赋值。然后，我们设置一个限制，即我们希望执行该特定代码行的次数。最后是一个递增语句，用于增加该循环变量的值。然后编写要执行的代码。这种类型的循环称为\
    \ for 循环，其语法如下所示。\n\n```\nfor (var i = 0; i < 10; i++) {\n  console.log(\"Loop\
    \ is running\");\n}\n```\n\n### JavaScript 数据类型\n\n与其他编程语言一样，JavaScript 也支持所有数据类型，例如字符串、布尔值、数字，以及\
    \ null 和 undefined 等。我们将深入讨论所有这些数据类型。\n\n#### JavaScript 字符串\n\n字符串用于保存可以文本形式表示的数据。字符串最常用的一些操作包括检查其\
    \ [长度](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/length)、使用\
    \ `+` 和 `+=` 字符串运算符构建和连接字符串、检查子字符串是否存在或定位子字符串，或者提取子字符串的方法。字符串是任何编程语言中最重要的数据类型之一。例如，当你需要从用户那里获取数据时。\n\
    \n#### JavaScript 布尔值\n\n在编程中，你经常需要一种只能取两个值之一的数据类型，例如。布尔值的语法看起来非常简单。你只需编写一个“是”或“否”的计算。例如，使用比较符号，如\
    \ `<`、`>` 或 `=`。布尔值用于比较两个数字等。\n\n* 是 / 否\n* 开 / 关\n* 真 / 假\n\n`Boolean(4651 >\
    \ 9465)`\n\n结果将相应显示。如果是，则为 true；如果不是，则为 false。\n\n#### JavaScript 数字\n\nJavaScript\
    \ 只有一种数字类型。数字可以带小数点或不带小数点。它可以是普通数字，也可以是浮点数（也称为小数）。你还可以解决许多数学问题。JavaScript 数字的语法如下所示：\n\
    \n```\nlet x = 3.14;    // 带小数的数字\nlet y = 3;       // 不带小数的数字\n```\n\nJavaScript\
    \ 数字始终是 64 位浮点数。\n\n#### JavaScript Null\n\n值 `null` 表示有意缺少任何对象值。它是 JavaScript\
    \ 的 [原始值](https://developer.mozilla.org/en-US/docs/Glossary/Primitive) 之一，并且在布尔运算中被视为假值。\n\
    \n#### JavaScript Undefined\n\n它指的是我们已声明但尚未赋值的变量。\n\n#### JavaScript 数组\n\n在每种编程语言中，数组都是一组数据类型。声明数组的方法有很多种。声明数组最简单的方法如下面的代码所示。通过这种方法，你可以轻松声明数组，并在声明时向其中添加更多值。\n\
    \n```\nvar list = [\"HTML\", \"CSS\", \"JavaScript\"];\n```\n\n现在，你还可以通过使用 `.length`\
    \ 属性来了解数组中有多少个元素。该属性的语法如下所示。\n\n#### JavaScript 随机数\n\n使用 `Math.random`，它会返回一个介于包含与排除之间的随机数。即介于\
    \ 0 和 1 之间。\n\n## JavaScript 算术\n\n算术运算符对数字（字面量或变量）执行算术运算。这些是 JavaScript 中的算术运算符。\n\
    \n![](img/image00141.jpeg)\n\n`=`\n\n## JavaScript 保留字\n\n有一些单词被 JavaScript 保留，不能用作类名或变量名等。这些单词的完整列表如下所示。\n\
    \n`await`、`break`、`case`、`catch`、`class`、`const`、`continue`、`debugger`、`default`、`delete`、`do`、`else`、`enum`、`export`、`extends`、`false`、`finally`、`for`、`function`、`if`、`implements`、`import`、`in`、`instanceof`、`interface`、`let`、`new`、`null`、`package`、`private`、`protected`、`public`、`return`、`super`、`switch`、`static`、`this`、`throw`、`try`、`True`、`typeof`、`var`、`void`、`while`、`with`、`yield`。\n\
    \n## 第 5 章 BOOTSTRAP\n\nBootstrap 是一个免费的前端框架，用于更快、更轻松地进行 Web 开发。它包含基于 HTML 和 CSS\
    \ 的设计模板，用于排版、表单、按钮、表格、导航、模态框、图片轮播等，以及可选的 JavaScript 插件。它还使你能够轻松创建响应式设计。Bootstrap\
    \ 官方网站的 URL 是\n\nhttps://getbootstrap.com/\n\n![upload.wikimedia.org/wikipedia/commons/thumb/b/...](img/image00142.jpeg)\n\
    \n这是用于制作表单的基本代码。它并不复杂。因为只是在 HTML 中使用了一些额外的类，这些类由 Bootstrap 提供支持并具有特定属性。\n\n```\n\
    <div class=\"mb-3\">\n  <label for=\"exampleFormControlInput1\" class=\"form-label\"\
    >Email address</label>\n  <input type=\"email\" class=\"form-control\" id=\"exampleFormControlInput1\"\
    \ placeholder=\"name@example.com\">\n</div>\n<div class=\"mb-3\">\n  <label for=\"\
    exampleFormControlTextarea1\" class=\"form-label\">Example textarea</label>\n\
    </div>\n```\n\n"
