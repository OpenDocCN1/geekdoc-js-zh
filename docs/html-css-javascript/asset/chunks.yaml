      height: 150px;


      width: 54%;


      background-color: red;


    }


    *   Max height:  It sets the height of the element to the max.


    *   Max width: It sets the width of the element to the max   


    *   Min height:  It sets the height of the element to the min.


    *   Min width: It sets the width of the element to the min.  


    *   THE CSS BOX MODEL


    The CSS box model refers to the layout which clearly explains the relation between
    an element and its margin and padding.


    ![WebD2: Understanding the Box Model in CSS](Images/image00128.jpeg)


    *   CSS TEXT FORMATTING


    In CSS text formatting means that to add different properties to text like aligning
    the text, changing the font-color or changing the background colour.


    *   TEXT ALIGN


    Aligning text means a lot in web development it helps us to adjust more and more
    content in your website attractively. In text align you can many properties like


    *   Text-align-last


    *   Direction


    *   Vertical-align


    *   TEXT ALIGN LAST


    The text-align-last property specifies how to align the last line of a text. The
    syntax of the same looks like


    p{


      text-align-last: center;


