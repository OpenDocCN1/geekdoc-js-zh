    \ is that both CSS and HTML files should be saved in same folder.\n\n`<link rel=\"\
    stylesheet\" href=\"styles.css\">`\n\nThe basic CSS code looks like this\n\n```\n\
    h1 {\n  color: black;\n```\n"
