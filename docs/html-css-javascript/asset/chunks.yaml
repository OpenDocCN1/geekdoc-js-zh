  trans: "\n\n`<head>` 元素是元数据（关于数据的数据）的容器，位于 `<html>` 标签和 `<body>` 标签之间。HTML 元数据是关于\
    \ HTML 文档的数据。元数据不会显示。元数据通常定义文档标题、字符集、样式、脚本和其他元信息。元数据也有助于使网站具有响应性。样式元素也只存在于 `<head>`\
    \ 标签中。下面是一个你在 HTML 文件中见过的元数据示例。它能让我们的网站更美观，并铺满设备的宽度。\n\n`<meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">`\n\n## HTML 响应式设计\n\n响应式网页设计旨在创建在所有设备上都能良好显示的网页！响应式网页设计会自动适应不同的屏幕尺寸和视口。它要么自动适应屏幕大小，要么需要我们手动调整。这有助于我们从任何屏幕尺寸吸引更多访客。主要有三种屏幕尺寸：第一种是\
    \ PC，第二种是平板，第三种是智能手机。\n\n![响应式网站设计——适应、响应并克服](img/image00119.jpeg)\n\n响应式网页设计就是使用\
    \ HTML 和 CSS 自动调整、隐藏、缩小或放大网站，使其在所有设备（台式机、平板和手机）上都能良好显示。\n\n要使网站具有响应性，首先应在 head\
    \ 标签中添加 meta 标签来设置视口。我们总是希望网站具有响应性，因此每当添加图片时，应养成将其宽度设为 100% 的习惯。这能减少你在制作响应式网站时的工作量。代码如下：\n\
    \n`<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">`\n\
    \n这一切非常繁琐，需要大量努力。不过有一个 CSS 框架可以减少我们的工作量，但我不建议你在完全精通网页开发并希望更快地为客户制作更多网站之前使用 Bootstrap。我们将在本书后面介绍\
    \ Bootstrap。\n\n## HTML 字符实体\n\n你可能知道，在 HTML 中不能添加多个空格，因此你可以使用不同的字符来创建多个空格。如果你想在\
    \ HTML 文件中添加字符，则需要添加一个定义字符集的 meta 标签。以下是一些字符实体：\n\n* `&nbsp;` 创建空格。\n* `&lt;`\
    \ 用于表示“<”小于号。\n* `&gt;` 用于表示“>”大于号。\n* `&copy;` 用于创建 ©。\n\n字符集的 meta 代码如下：\n\n\
    `<meta charset=\"UTF-8\">`\n\n## HTML 表单\n\n你一定见过大多数网站都包含表单，无论是用于评论、反馈还是投诉等。你可以使用\
    \ `<form>` 元素在 HTML 中创建表单。以下是 HTML 表单的基本代码：\n\n```\n<form>\n  <label for=\"fname\"\
    >First name:</label><br>\n  <input type=\"text\" id=\"fname\" name=\"fname\"><br>\n\
    \  <label for=\"lname\">Last name:</label><br>\n  <input type=\"text\" id=\"lname\"\
    \ name=\"lname\">\n</form>\n```\n\n## HTML 表单属性和元素\n\n与其他元素一样，表单元素也有一些属性，用于方便在\
    \ CSS 中设置样式以及实现表单功能。如你所见，这里我们使用了一个名为 `label` 的新元素，它用于为输入添加标签，你可以在下面的结果中看到。在 `type`\
    \ 属性中，我们可以添加不同的值，例如对于复选框，可以在 type 属性值中添加 `checkbox`。对于单选按钮，同样可以在 `type` 属性值中添加\
    \ `radio`。\n\n![](img/image00120.jpeg)\n\n你是否注意到少了什么？是的，就是提交按钮。你可以通过编写以下代码为任何表单添加提交按钮：\n\
    \n`<input type=\"submit\" value=\"Submit\">`\n\n## HTML 表单的 action 和 method 属性\n\
    \n现在，用户会填写这个表单，但我们如何获取用户填写的信息呢？因此，我们需要链接一个文件，将我们的网站连接到数据库。我们可以通过多种语言来实现，比如 Python、PHP\
    \ 等。在网页开发中，我们通常使用 PHP，因此在 `action` 属性中，我们需要填写 PHP 文件的名称作为其值。\n\nHTML 表单的第二个属性是\
    \ `method` 属性。这个属性也有多个值。首先，我们需要了解它。它指的是数据从客户端浏览器传输到数据库的方法。该 method 属性的所有值如下：\n\
    \n* `GET`\n* `POST`\n* `PUT`\n* `HEAD`\n* `DELETE`\n* `PATCH`\n* `OPTIONS`\n*\
    \ `CONNECT`\n* `TRACE`\n\n大多数后端开发者更喜欢 `POST`，因为 `POST` 比 `GET` 更安全，而 `GET` 方法容易被黑客攻击或被人轻易访问。在\
    \ `GET` 方法表单中输入的信息会存储在浏览器中。因此，在制作网站及其表单时，尽量使用 `POST` 方法。\n\n## HTML 媒体\n\n我们可以在\
    \ HTML 中添加多种格式的视频。大多数视频是 MP4 和 MPEG 格式，因此我们可以在网页中添加这些扩展名的视频。音频文件也是如此。HTML 也支持\
    \ MP4、MP3 和 `.ogg` 等音频文件扩展名。你可以使用 `video` 元素向网页添加视频，使用 `audio` 元素添加音频。你可以使用 `autopay`\
    \ 属性让文件在有人打开页面时自动播放。添加视频的基本代码如下：\n\n```\n<video width=\"320\" height=\"240\" controls>\n\
    \  <source src=\"video.mp4\" type=\"video/mp4\">\n</video>\n```\n\n在上面的代码中，我们使用了\
    \ `video` 元素，并通过两个属性设置了宽度和高度。另一个名为 `controls` 的属性不需要任何值，它赋予视频所有控制功能，如播放、时间线、选项等。最后是\
    \ `track` 元素。`track` 元素用于为视频添加字幕，字幕文件的扩展名为 `.vtt`。结果如下所示：\n\n![](img/image00121.jpeg)\n\
    \n## HTML YouTube 视频嵌入\n\n你一定好奇大多数网站是如何使用 YouTube 视频并将其嵌入到自己的网站中的。你可以借助 `iframe`\
    \ 元素来实现。编写 YouTube 视频的嵌入链接非常困难。因此，Google 在 YouTube 中添加了一个功能，你可以从中获取用于将 YouTube\
    \ 视频嵌入到网页中的 iframe 代码。\n\n![](img/image00122.jpeg)\n\n只需点击 YouTube 网站上的分享图标。会出现上述界面，然后点击嵌入图标，会出现一个链接，复制该链接并粘贴到你的网站中。这样，访客就可以直接从你的网站播放视频，或者通过此链接跳转到\
    \ YouTube。他们还可以订阅你所嵌入视频的频道。结果如下页所示：\n\n![](img/image00123.jpeg)\n\n## HTML Google\
    \ 地图嵌入\n\n![](img/image00124.jpeg)与嵌入 YouTube 视频类似，你也可以在网页中嵌入 Google 地图。在提供企业位置和其他联系方式时可以使用地图。操作方法与\
    \ YouTube 相同。只需输入你的位置，右侧会打开一个面板，你会找到分享图标，点击它，然后点击“嵌入地图”。如下图所示。结果也类似。通过 Ctrl +\
    \ 加号缩放并查看完整地图。\n\n# CSS\n\nCSS 是层叠样式表（Cascading Stylesheet）的缩写。它是一种样式表编程语言，帮助网页开发者设计\
    \ HTML 文档，使其更具吸引力，从而吸引更多访客访问网站。CSS 文件或文档的扩展名为 `.css`。该文件需要先通过以下代码链接到 HTML 文档，该代码使用\
    \ `link` 元素将这两个文件链接起来。需要注意的是，CSS 和 HTML 文件应保存在同一文件夹中。\n\n`<link rel=\"stylesheet\"\
    \ href=\"styles.css\">`\n\n基本的 CSS 代码如下：\n\n```\nh1 {\n  color: black;\n```\n\n"
- fmt: "\n```\n  text-align: center;\n}\np[[BT1]](#part0029.xhtml__cmnt1) {\n  font-family:\
    \ verdana;\n  font-size: 20px;\n}\n```\n\nHere in the above code, we have given\
    \ two properties to `h1` and paragraph element. Like for heading tag we have giver\
    \ color black and text align center. And for paragraph tag we have set a font-\
    \ family it means we have set a font named ‘verdana’. And we have set a font size\
    \ of `20px` to the paragraph.\n\n![](Images/image00125.jpeg)\n\nThe syntax of\
    \ CSS looks like this\n\nYou can use element name, id name or class name as a\
    \ selector in CSS. For using ID as a selector in CSS we use `#` before the name\
    \ of the id. And for using class name as a selector, we use a dot before the name\
    \ of the class. You can select a specific class for a specific element like given\
    \ below.\n\n```\np. heading {\n  text-align: left;\n  color: black;\n}\n```\n\n\
    There is one more selector in CSS named universal selector. It helps us to select\
    \ the whole document and give it the properties. It can be used to give a common\
    \ font to the whole document. Now you can use the universal selector by using\
    \ `*` symbol. Now if you want to give same properties to two or many different\
    \ elements. You can edit them together it is called CSS group selector. Like shown\
    \ below in the code. Here we are giving same properties to two different properties.\n\
    \n```\nh1, h2, p {\n  text-align: left;\n  color: black;\n}\n```\n\n## WAYS TO\
    \ USE CSS\n\nThere are three methods of using/ inserting CSS in your HTML file.\
    \ First one in inline CSS that we have discussed earlier in this book. Second\
    \ one is Internal CSS. In this method we use `<style>` element and write all the\
    \ code that we want to enter in the css file. And the last one is external CSS.\
    \ In this css we use external css file with an extension `.css`. And to link it\
    \ with the HTML file we write the link code in the head tag.\n\n## COMMENTS IN\
    \ CSS\n\nAs we learned earlier that in HTML there are comments same goes with\
    \ CSS. So, the comments in CSS looks like this.\n\n```\n/*This is a comment */\n\
    ```\n\n## BACKGROUND COLOR\n\nTo add background color to a image you have to follow\
    \ he same syntax and use attribute `background-color` and as an value to it write\
    \ a colour name. You can add the color in all the forms HEX code or RGB or HSL.\
    \ To increase or decrease the opacity of the background colour either you can\
    \ use background color in the form of RGBA through it by controlling the alpha\
    \ value you can control the opacity of the background. But without ignoring the\
    \ fact that finding RGB of a colour is difficult so you can write the colour name\
    \ and to control the opacity you can add `opacity` attribute. The value of this\
    \ attribute lies between `0` to `1`.\n\n## BACKGROUND IMAGE\n\nNow sometimes background\
    \ colour doesn’t make our websites look attractive so using CSS properties we\
    \ can add a background image to any element in CSS. We just have to use `url`\
    \ attribute and the code will look like this.\n\n```\ndiv {\n  background-image:\
    \ url(\"bg.jpg\");\n}\n```\n\nNow sometimes the dimension of the element is more\
    \ than the dimension of the background image. So browser automatically starts\
    \ repeating the image. So we uses property named background repeat. Now if you\
    \ want that the imager should not repeat you can add the value as `no-repeat`.\
    \ If you want that the image should repeat horizontally you can add the value\
    \ as `repeat-x`. If you want that the image should only repeat vertically you\
    \ can add a value as `repeat-y`.\n\n```\ndiv {\n background-image: url(\"bg.png\"\
    );\n  background-repeat: repeat-x;\n}\n```\n\n## BORDER PROPERTIES\n\nYou can\
    \ add borders to elements of HTML using CSS properties. The `border-style` property\
    \ specifies what kind of border to display. The values that can be filled to this\
    \ property are as follows.\n\n* `dotted` - Defines a dotted border.\n* `dashed`\
    \ - Defines a dashed border.\n* `solid` - Defines a solid border.\n* `double`\
    \ - Defines a double border.\n* `groove` - Defines a 3D grooved border. The effect\
    \ depends on the `border-color` value.\n* `ridge` - Defines a 3D ridged border.\
    \ The effect depends on the `border-color` value.\n* `inset` - Defines a 3D inset\
    \ border. The effect depends on the `border-color` value.\n* `outset` - Defines\
    \ a 3D outset border. The effect depends on the `border-color` value.\n* `none`\
    \ - Defines no border.\n* `hidden` - Defines a hidden border.\n\nThe code of using\
    \ all these properties is like below.\n\n```\ndiv {border-style:\n dotted;\n}\n\
    ```\n\nAll the result of these properties are shown in the next page.\n\n![](Images/image00126.jpeg)\n\
    \nYou can also add color to the borders that we have applied to the HTML elements.\
    \ By using `border-color` property. The code for the same is given below.\n\n\
    ```\ndiv {\n  border-style: solid;\n  border-color: blue;\n}\n```\n\nIn CSS you\
    \ can edit every single side’s border of an element. The for it will be as follows.\n\
    \n```\np {\n  border-top-style: solid;\n  border-right-style: dotted;\n  border-bottom-style:\
    \ groove;\n  border-left-style: ridge;\n}\n```\n\nYou can also write all these\
    \ four lines of code in one line as\n\n```\np {\n  border-style: solid dotted\
    \ groove ridge;\n}\n```\n\nThe result for the above code will look like this\n\
    \n![](Images/image00127.jpeg)\n\n## CSS MARGINS\n\nIn css margin refers to the\
    \ space between and element to another element. And using CSS properties we can\
    \ edit the value of margin of an element. The value for margin is calculated in\
    \ pixels. One centimetre is around thirty-seven pixels. The margin can be controlled\
    \ from all four sides by using the following code.\n\n```\np {\n  margin-top:\
    \ 25px;\n  margin-bottom: 50px;\n  margin-right: 750px;\n  margin-left: 100px;\n\
    }\n```\n\nThe whole code can be written in a nutshell in a single line of code.\
    \ Which is like as follows.\n\n```\np {\n  margin: 25px 50px 75px 100px;\n}\n\
    ```\n\nYou can also set margin to `auto` which will horizontally center it in\
    \ its div or container.\n\n## CSS PADDING\n\nPadding can be defined as the gap\
    \ or space between the element itself and its border. And the remaining things\
    \ like syntax and values are same as CSS Margin. Its syntax looks like this\n\n\
    ```\np {\n  padding-top: 25px;\n  padding -bottom: 50px;\n  padding -right: 750px;\n\
    \  padding -left: 100px;\n}\n```\n\nSame like Margin you can write all these four\
    \ lines of code in one line.\n\n```\np {\n  padding: 25px 50px 75px 100px;\n}\n\
    ```\n\n## CSS HEIGHT AND WIDTH\n\nEvery element requires its dimension. In CSS\
    \ you can give every element its height and width. In CSS height and width is\
    \ controlled by some values which I have described below.\n\n* `Auto` - This is\
    \ default. The browser calculates the height and width\n* `Length` - Defines the\
    \ height/width in px, cm etc.\n* `Percentage` - Defines the height/width in percent\
    \ of the containing block\n* `Initial` - Sets the height/width to its default\
    \ value\n* `Inherit` - The height/width will be inherited from its parent value\n\
    \nThe syntax of the code for adding properties related to height and width looks\
    \ like below.\n\n```\ndiv {\n  height: 150px;\n  width: 54%;\n  background-color:\
    \ red;\n}\n```\n\n* `Max height`: It sets the height of the element to the max.\n\
    * `Max width`: It sets the width of the element to the max\n* `Min height`: It\
    \ sets the height of the element to the min.\n* `Min width`: It sets the width\
    \ of the element to the min.\n\n## THE CSS BOX MODEL\n\nThe CSS box model refers\
    \ to the layout which clearly explains the relation between an element and its\
    \ margin and padding.\n\n![WebD2: Understanding the Box Model in CSS](Images/image00128.jpeg)\n\
    \n## CSS TEXT FORMATTING\n\nIn CSS text formatting means that to add different\
    \ properties to text like aligning the text, changing the font-color or changing\
    \ the background colour.\n\n### TEXT ALIGN\n\nAligning text means a lot in web\
    \ development it helps us to adjust more and more content in your website attractively.\
    \ In text align you can many properties like\n\n* `Text-align-last`\n* `Direction`\n\
    * `Vertical-align`\n\n### TEXT ALIGN LAST\n\nThe `text-align-last` property specifies\
    \ how to align the last line of a text. The syntax of the same looks like\n\n\
    ```\np{\n text-align-last: center;\n}\n```\n"
