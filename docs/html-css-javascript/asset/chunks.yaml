  trans: "\n\n# 第 4 章\n## JavaScript\n\n其语法和结果如下所示：\n\n```css\nimg {\n  float: right;\n\
    }\n```\n\n![](img/image00135.jpeg)\n\n## CSS 显示 - 内联块\n\n该属性用于将元素显示为内联级别的块容器。`inline-block`\
    \ 允许在元素上设置宽度和高度。大多数开发者使用 `inline-block` 来创建导航栏。\n\n## CSS 组合器\n\nCSS 选择器可以包含多个简单选择器。在简单选择器之间，我们可以包含一个组合器。因为有时要访问\
    \ HTML 中的某个元素，我们必须指定它在文档中的位置。\n\nCSS 中有四种不同的组合器：\n\n- 后代选择器（空格）\n- 子选择器（>）\n\n\
    ### 后代选择器\n\n后代选择器匹配指定元素的所有后代元素。以下示例访问 `<div>` 元素内的所有 `<p>` 元素：\n\n```css\ndiv\
    \ p {\n  background-color: yellow;\n}\n```\n\n### 子选择器\n\n子选择器匹配指定元素的所有直接子元素。以下示例选择所有作为\
    \ `<div>` 元素子元素的 `<p>` 元素：\n\n```css\ndiv > p {\n  background-color: yellow;\n\
    }\n```\n\n## CSS 伪类\n\n伪类用于定义元素的特殊状态。就像我们在锚点标签中看到的那样。语法如下所示。\n\n例如，它可以用于：\n\n\
    - 当用户将鼠标悬停在元素上时设置样式\n- 区分已访问和未访问的链接样式\n- 当元素获得焦点时设置样式\n\n```css\nselector:pseudo-class\
    \ {\n  property: value;\n}\n```\n\n这里的 `selector` 指的是你要选择其伪类的元素。而 `pseudo-class`\
    \ 指的是该元素的伪类。\n\n### 锚点伪类\n\n正如我们之前所学，锚点标签可以以不同方式显示，代码将在下一处展示。在该代码中，我们访问了锚点标签的每个阶段。我们可以对几乎所有的\
    \ HTML 元素使用像 `hover` 这样的伪类。\n\n```css\na:link {\n  color: white;\n}\na:visited\
    \ {\n  color: black;\n}\na:hover {\n  color: yellow;\n}\na:active {\n  color:\
    \ green;\n}\n```\n\n### CSS - :first-child 伪类\n\n这个伪类帮助我们访问 HTML 文档中该元素的第一次出现。因此，我们可以通过使用\
    \ `first-child` 属性轻松访问它。\n\n在下一页所示的以下示例中，选择器匹配任何作为其父元素第一个子元素的 `<p>` 元素。\n\n```css\n\
    p:first-child {\n  color: blue;\n}\n```\n\n## CSS 伪元素\n\nCSS 伪元素用于设置元素的指定部分的样式。有许多伪元素。使用伪元素的语法如下所示：\n\
    \n```css\nselector::pseudo-element {\n  property: value;\n}\n```\n\n### ::first-line\
    \ 伪元素\n\n`::first-line` 伪元素用于为文本的第一行添加特殊样式。它适用于所有文本元素。注意：`::first-line` 伪元素只能应用于块级元素。语法如下：\n\
    \n```css\np::first-line {\n  color: #000;\n}\n```\n\n### ::first-letter 伪元素\n\n\
    `::first-letter` 伪元素用于为文本的第一个字母添加特殊样式。以下示例格式化所有 `<p>` 元素中文本的第一个字母。语法如下（见下一页）。`::first-letter`\
    \ 伪元素只能应用于块级元素。\n\n```css\np::first-letter {\n  color: #ff0000;\n  font-size:\
    \ xx-large;\n}\n```\n\n### ::before 伪元素\n\n`::before` 伪元素可用于在元素内容之前插入一些内容。以下示例在每个\
    \ `<h1>` 元素的内容之前插入一张图片。我们赋予 `::before` 伪元素的所有属性都会在 HTML 文档中显示。语法如下：\n\n```css\n\
    h1::before {\n  content: url(book.png);\n}\n```\n\n### CSS - ::after 伪元素\n\n`::after`\
    \ 伪元素可用于在元素内容之后插入一些内容。以下示例在每个 `<h1>` 元素的内容之后插入一张图片。语法如下：\n\n```css\nh1::after\
    \ {\n  content: url(book.png);\n}\n```\n\n### ::selection 伪元素\n\n你是否注意到，当我们在网页中选择某些内容时，它会有不同的属性？默认情况下，其背景设置为蓝色。你可以使用下一页所示的简单语法来编辑所有这些。\n\
    \n```css\n::selection {\n  color: white;\n  background: black;\n}\n```\n\n## 导航栏\n\
    \n导航栏需要标准的 HTML 作为基础。对于任何网站来说，拥有易于使用的导航都很重要。为了制作一个基本的导航栏，我们使用了 `ul` 标签和 `li` 标签。因此，HTML\
    \ 代码如下所示：\n\n```html\n<ul>\n  <li><a href=\"default.asp\">Home</a></li>\n  <li><a\
    \ href=\"news.asp\">News</a></li>\n  <li><a href=\"contact.asp\">Contact</a></li>\n\
    \  <li><a href=\"about.asp\">About</a></li>\n</ul>\n```\n\n为了使其更具吸引力，我们将添加一些基本的\
    \ CSS 代码，如下所示。这里我们通过将 `list-style-type` 设置为 `none` 来移除项目符号。并通过将 `margin` 和 `padding`\
    \ 设置为零，将其置于左上角位置。\n\n```css\nul {\n  list-style-type: none;\n  margin: 0;\n  padding:\
    \ 0;\n}\n```\n\n在 HTML 中，我们制作的每个导航栏默认都是垂直的，但如何制作水平导航栏呢？我通常使用下一页给出的代码。其中我将 `display`\
    \ 设置为 `flex`，使它们全部水平排列，然后添加一些外边距。\n\n```css\nul {\n  background-color: rgb(14,\
    \ 13, 13);\n  display: flex;\n  list-style-type: none;\n  margin: 0;\n  padding:\
    \ 0;\n}\nul li {\n  color: white;\n  margin-left: 20px;\n  margin-right: 20px;\n\
    }\n```\n\n这段代码的结果如下图所示：\n\n![](img/image00136.jpeg)\n\n# 第 4 章\n## JavaScript\n\
    \nJavaScript（通常缩写为 JS）是一种编程语言，与 HTML 和 CSS 一样，是万维网的核心技术之一。超过 97% 的网站使用 JavaScript\
    \ 来实现客户端网页行为，通常还会集成第三方库。JavaScript 也用于服务器端编程以操作数据库。在本书中，我们只学习用于前端开发的 JavaScript。现在，通过查看以下代码来初步了解\
    \ JavaScript。\n\n```html\n<script>\n  document.write(\"Introduction to JavaScript.\"\
    );\n</script>\n```\n\n其结果与使用 HTML 编写时相同。\n\n![](img/image00137.jpeg)\n\n### 在\
    \ HTML 中使用 JavaScript\n\n要在 HTML 中使用 JavaScript，我们有两种选择：使用内部 JavaScript 或外部 JavaScript。要使用外部\
    \ CSS，我们需要使用 `script` 标签，然后使用 `src` 属性定位 js 文件。以下代码可以写在 `head` 标签中，也可以写在 `body`\
    \ 标签中。语法如下：\n\n```html\n<script src=\"myScript.js\"></script>\n```\n\n而要使用内部 CSS，我们只需使用\
    \ `script` 标签，并将所有代码写在其中。\n\n我建议你使用外部 JS 文件，因为首先它有助于使代码看起来更美观、易于阅读和理解，并且将 HTML、CSS\
    \ 和 JS 分离。这会给他人留下良好的代码印象。\n\n### JavaScript 显示\n\n正如我们在 JS 章节的第一个示例中看到的，我们使用 JS\
    \ 打印了一段文本。在 HTML 文档中，还有更多使用 JS 显示数据的方法。我们将逐一讨论它们。\n\n#### innerHTML\n\n要访问 HTML\
    \ 元素，JavaScript 可以使用 `document.getElementById(id)` 方法。`id` 属性定义了 HTML 元素。它可以是\
    \ `<p>` 标签或任何其他文本标签，而 `innerHTML` 属性定义了 HTML 内容。这里我们首先需要添加一个 `<p>` 标签，并为其指定一个可以通过\
    \ JavaScript 访问的 `id`。最终代码如下所示：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <p id=\"web\"></p>\n<script>\ndocument.getElementById(\"web\").innerHTML = \"\
    Written using inner HTML\";\n</script>\n</body>\n</html>\n```\n\n其结果与使用 HTML 编写时相同，如下图所示（见下一页）。\n\
    \n![](img/image00138.jpeg)\n\n#### document.write()\n\n"
