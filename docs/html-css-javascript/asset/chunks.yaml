  trans: "\n\n# 第一章：万维网与网站\n\n万维网是最具革命性的理念之一，它彻底改变了计算机科学领域。1990 年，蒂姆·伯纳斯-李为万维网奠定了基础。整个网络基于一个基本系统运行，该系统包含两个部分。第一部分是服务器端，指的是你试图访问的网站的数据中心和服务器。第二部分是客户端，指的是你的本地计算机及其\
    \ IP 地址。而连接这两部分的工作则由浏览器（如 Chrome、Firefox、Opera 等）完成。如下图所示：\n\n![Introduction to\
    \ the server side - Learn web development | MDN](img/image00111.gif)\n\n现在你知道每台计算机都有一个\
    \ IP 地址，网站也是如此——每个网站都有一个 IP 地址，但由于人类很难记住这些地址，因此为了解决这个问题，万维网引入了网址和 URL。例如，`google.com`。这里的`google.com`是网址，而`8.8.8.8`是`google.com`网站的\
    \ IP 地址。每个网站都有网址和 IP 地址。\n\n一个网站由两部分组成：第一部分称为前端，第二部分称为后端。前端指的是任何网站上可见的材料和内容。对于前端开发，我们通常使用\
    \ HTML 和 CSS，但对于包含大量动画和内容的高级前端，我们还会使用 JavaScript。至于后端，则有后端编程语言。大多数网站使用 PHP，因为它易于编程且效率很高。我们也可以使用其他编程语言，比如\
    \ JavaScript、Python 等。网站加载所需的时间取决于其服务器，服务器越强大，网站加载越快。\n\n当我们在浏览器中输入任何 URL 时，我们会向该网站的服务器发送请求，要求发送\
    \ HTML、CSS 和 JavaScript 文件，以便浏览器能够访问并向我们展示内容。并非所有网站都是用 HTML 构建的，但无论网站使用哪种编程语言，为了使其显示，它都会被转换为\
    \ HTML 和 JavaScript。例如，`google.com`主要用 C、C++和 Python 编写，但当你查看该网站的页面源代码时，它会以 HTML\
    \ 的形式呈现。\n\n第一个网站（显然是由蒂姆·伯纳斯-李创建的）是`http://info.cern.ch/`，它看起来像这样：\n\n![](img/image00112.jpeg)\n\
    \n# 第二章：HTML\n\nHTML 是超文本标记语言（Hypertext Markup Language）的缩写，因为它是网站的标准标记语言。现在你可能会问在哪里编写这些代码。要制作一个网站，你可以在任何文本编辑器中编写代码，也可以使用记事本。我个人推荐使用\
    \ Visual Studio Code，它是免费的，既可以作为文本编辑器，也可以作为控制台来测试其他编程语言的方程和代码。\n\n## 如何识别是否为 HTML\
    \ 文件\n\n要识别文件类型，我们借助文件的扩展名。例如，HTML 文件的扩展名是`.html`和`.htm`，CSS 文件的扩展名是`.css`，JavaScript\
    \ 文件的扩展名是`.js`。在将文件保存到电脑时，你必须添加扩展名。请看 HTML 的基本代码：\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n    <title>Brajesh Thakur</title>\n</head>\n<body>\n\
    \    <!-- The content will be written here -->\n</body>\n</html>\n```\n\n如你所见，代码以`DOCTYPE`开头，表示该文档是一个\
    \ HTML 文档。第二行指定了代码的语言是英语。在 HTML 中，最重要的东西之一是标签，比如上面的例子中`<head>`就是一个标签。\n\n起始标签写在小于号和大于号`<`\
    \ `>`之间。HTML 中有许多标签，例如`<div>`、`<p>`、`<section>`、`<html>`、`<footer>`、`<li>`等。每个标签都有自己的属性。在\
    \ HTML 中，所有要显示的内容都写在`<body>`标签内。\n\n## HTML 标题\n\nHTML 中有标题标签，用六个标签`<h1>`到`<h6>`表示。数字越大，标题的文本字号越小。例如，`<h1>`是字号最大的标题，而`<h6>`标签的字号最小。请看下图演示：\n\
    \n**代码**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <title>Brajesh\
    \ Thakur</title>\n</head>\n<body>\n    <h1>This is H1 tag</h1>\n    <h2>This is\
    \ H2 tag</h2>\n    <h3>This is H3 tag</h3>\n    <h4>This is H4 tag</h4>\n    <h5>This\
    \ is H5 tag</h5>\n    <h6>This is H6 tag</h6>\n</body>\n</html>\n```\n\n**结果**\n\
    \n![](img/image00113.jpeg)\n\n## HTML 段落\n\n既然 HTML 有标题，那么它也有段落。对于段落，我们使用`<p>`标签。代码与之前标题的代码类似，结果也会以相同方式显示。\n\
    \n**代码**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <title>Brajesh\
    \ Thakur</title>\n</head>\n<body>\n    <p>This the paragraph tag</p>\n</body>\n\
    </html>\n```\n\n## HTML 注释\n\n有时在制作大型项目时，我们觉得需要写一些在加载网页时不应显示的内容。这时我们使用注释。注释以`<!--`开头，以`-->`结束。\n\
    \n## HTML 属性\n\n在 HTML 中，所有元素或标签都有属性。所有属性都写在起始标签中。\n\n### `href`属性\n\n`href`属性用于`<a>`标签（也称为锚标签），用于在网页中创建超链接。它定义了\
    \ URL 指向的位置。下面你可以看到如何在你的网站上使用它。\n\n**代码**\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <title>Brajesh Thakur</title>\n</head>\n<body>\n    <a href=\"\
    youtube.com\">This Link is leading to YOUTUBE</a>\n</body>\n</html>\n```\n\n这里你可以看到，在`href`属性中我添加了一个指向\
    \ YouTube 的链接。因此，每当点击这个锚标签时，它就会跳转到`youtube.com`。锚标签通常用作按钮。你可以在`href`属性中添加任何类型的链接。还有更多属性，比如与`<img>`标签一起使用的`src`和`alt`。\n\
    \n### `<br>`标签\n\n`<br>`标签用于段落之间，它有助于在行中的某个点创建换行。\n\n**代码**\n\n```html\n<p> This\
    \ is a demo text in this text I will add a break tag here <br> now this is going\
    \ to start from a new line </p>\n```\n\n## HTML CSS\n\n很多时候，在构建网站时，我们只需要对两三个元素进行样式设置，因此在这种情况下，我们可以直接在\
    \ HTML 文件中使用 CSS，而无需创建新的 CSS 文件。有两种方法可以实现这一点。\n\n### 第一种：内联 CSS\n\n在内联 CSS 中，我们在\
    \ HTML 元素中使用 CSS 属性。内联 CSS 的使用方式如下：\n\n```html\n<h1 style=\"color: blue;\">A Blue\
    \ Heading</h1>\n```\n\n### 第二种：内部 CSS\n\n在内部 CSS 中，我们使用 HTML 元素`<style>`，它通常放在文档的头部。内部\
    \ CSS 的使用方式如下：\n\n```html\n<head>\n<style>\nh1 {color: blue;}\n</style>\n</head>\n\
    ```\n\n使用 CSS，你可以编辑 HTML 中任何元素的所有属性，例如字体大小、字体、颜色、宽度、填充、文本对齐等等。\n\n## HTML 文本格式化\n\
    \nHTML 中主要有十个文本格式化元素，它们帮助我们格式化文本。这十个元素的名称如下：\n\n- `<b>` – 加粗文本\n- `<strong>` –\
    \ 表示重要词语\n- `<i>` – 斜体文本\n- `<em>` – 强调文本\n- `<mark>` – 标记文本\n- `<small>` – 更小的文本\n\
    - `<del>` – 删除文本\n- `<ins>` – 插入文本\n- `<sub>` – 下标文本\n- `<sup>` – 上标文本\n\n## HTML\
    \ 引用和引文元素\n\n"
- fmt: "\nThe HTML Quotations are used to create a quotation in HTML. There are many\
    \ types of quotations for a small quote we use the `<q>` tag and many more. Some\
    \ of them are:\n\n*   `<abbr>`: This is an abbreviation tag that is used to show\
    \ an abbreviation or acronym. Like “Mr.”, “Mrs”.\n*   `<address>`: This defines\
    \ the address information of the author of that document.\n*   `<bdo>`: `bdo`\
    \ stands for Bi-Directional Override. It helps in changing the direction of the\
    \ text. For example, for the right to the left direction we write `rtl`, and for\
    \ the left to right we use `ltr` as a value for the `dir` attribute. It is used\
    \ as follows:\n\n```\n<bdo dir=\"rtl\">This text will be written from right to\
    \ left</bdo>\n```\n\n*   `<blockquote>`: It is used to define a section that is\
    \ quoted from another source.\n*   `<cite>`: This defines the title of creative\
    \ work. It changes the text to italic.\n*   `<q>`: This defines a short inline\
    \ quotation.\n\n## HTML COLOR AND ITS USE\n\nWhile building projects we use color\
    \ several times. The colours in HTML are used in three forms.\n\n*   **RGB**:\
    \ RGB stands for red green and blue. In this, we set the value of all three colors\
    \ in an exact amount so that a new color can be formed. The values for all these\
    \ three colours lie between 0 to 255. For example in RGB code for yellow is written\
    \ as `(255,255,0)`. Here first value stands for the shade of red color, second\
    \ one for green shade, and third one for blue shade.\n*   **HEX**: In this format,\
    \ colors are in hexadecimal form. Every shade has a different color. The hexa\
    \ code is always written with `#` this sign. For example, the hexa code for white\
    \ is `#ffffff` and for black is `#000000`. In Hexa, the first two digits control\
    \ the red shade, the middle two digits control the green shade, and the last two\
    \ control the blue shade.\n*   **HSL**: In this format, the colors are made by\
    \ adjusting the hue saturation and lightness. The values for saturation and lightness\
    \ are in percentage but the value of hue is in degrees from 0 to 360 and hue is\
    \ the one that is responsible for the color change.\n\n## HTML Hyperlink and anchor\
    \ tag\n\nEvery website has a hyperlink or a button that helps the visitors to\
    \ be redirected to another web page link. In HTML there are three types of links.\
    \ The properties of these three types of links are default but can be changed\
    \ later.\n\n*   An unvisited link is underlined and blue.\n*   A visited link\
    \ is underlined and purple.\n*   An active link is underlined and red.\n\nYou\
    \ can edit the properties of these three types of links as follows. This will\
    \ be edited with the help of CSS.\n\n```css\n<style>\na: link {\n  color: green;\n\
    \  background-color: transparent;\n  text-decoration: none;\n}\na: visited {\n\
    \  color: pink;\n  background-color: transparent;\n  text-decoration: none;\n\
    }\na: hover {\n  color: red;\n  background-color: transparent;\n  text-decoration:\
    \ underline;\n}\na: active {\n  color: yellow;\n  background-color: transparent;\n\
    \  text-decoration: underline;\n}\n</style>\n```\n\nAs other elements have their\
    \ attributes, same goes with anchor tag it also has an attribute named `target`.\
    \ This attribute can have the following values.\n\n*   `_self`: Default. Opens\
    \ the document in the same window/tab as it was clicked.\n*   `_blank`: Opens\
    \ the document in a new window or tab.\n*   `_parent`: Opens the document in the\
    \ parent frame.\n*   `_top`: Opens the document in the full body of the window.\n\
    \nThe code can be written as:\n\n```html\n<a href=\"https://www.youtube.com/\"\
    \ target=\"_blank\">Visit YouTube</a>\n```\n\nIf we are using a URL, we should\
    \ know that there are two types of URLs. The first one is Absolute URL and the\
    \ second one is Relative URLs.\n\n1.  **Relative URL**: Relative URLs are those\
    \ which are present in the folders of your website.\n2.  **Absolute URL**: Absolute\
    \ URLs are those which are from some other website.\n\nExamples:\n\n```html\n\
    <h1>Absolute URLs</h1>\n<p><a href=\"https://www.youtube.com/\">Youtube</a></p>\n\
    <h1>Relative URLs</h1>\n<p><a href=\"/css/style.css\">CSS FILE</a></p>\n```\n\n\
    ## HTML IMAGES\n\nImages are not technically inserted into a web page; images\
    \ are linked to web pages. We can adjust the width and height of the image by\
    \ using CSS. The `<img>` tag creates a holding space for the referenced image.\
    \ Image can be linked by the following code.\n\n```html\n<img src=\"URL\" alt=\"\
    alternate text\">\n```\n\nIn the place of the URL, you have to insert the relative\
    \ link of the image. And we have to fill in the name or context of the image in\
    \ the value for the `alt` attribute. Sometimes because of a slow internet connection\
    \ the images don’t load so this text will replace the image.\n\n## HTML FAVICON\n\
    \nHave a look at the image given below where the logo of the website is visible\
    \ against the title of the Webpage. This image or logo is known as a favicon.\
    \ This favicon adds a new touch to your webpage as well as it helps the visitor\
    \ to find out whether the website is loading or it has been loaded.\n\n![](Images/image00114.jpeg)\n\
    \nTo add the favicon to your webpage you should first save the favicon image with\
    \ the extension of `.ico` at a file with any name at the root repository. This\
    \ code should be written in the `head` tag. In today’s world almost all the browsers\
    \ support favicon. In favicon, we use a link tag to link a document with an external\
    \ source.\n\n```html\n<head>\n  <title>My Page Title</title>\n  <link rel=\"icon\"\
    \ type=\"image/x-icon\" href=\"/images/favicon.ico\">\n</head>\n```\n\n## HTML\
    \ TABLE\n\nWe can also add tables in HTML and then style them by using CSS. We\
    \ arrange the data in the table in rows and columns. For making a cell in the\
    \ table we use the `<td>` tag. The code for a basic table is given on the next\
    \ page.\n\n```html\n<body>\n    <table style=\"width:100%\">\n        <tr>\n \
    \         <th>Name</th>\n          <th>Class</th>\n          <th>Section</th>\n\
    \        </tr>\n        <tr>\n          <td>Ram</td>\n          <td>7th A</td>\n\
    \          <td>A</td>\n        </tr>\n        <tr>\n          <td>Shyam</td>\n\
    \          <td>9th</td>\n          <td>B</td>\n        </tr>\n      </table>\n\
    </body>\n```\n\nFor styling, you can add a border to all the elements of table\
    \ like given below.\n\n```css\n<style>\ntable, th, td {\n  border:1px solid black;\n\
    }\n</style>\n```\n\nThere are many more tags used for making a new table.\n\n\
    *   `<table>`: This tag defines a table.\n*   `<th>`: This tag defines the header\
    \ cell of the table.\n*   `<tr>`: This tag defines a row in the table.\n*   `<td>`:\
    \ This tag defines a cell in the table.\n*   `<caption>`: This defines a table\
    \ caption.\n*   `<colgroup>`: This specifies a group of columns in the table.\n\
    *   `<col>`: It refers to a column that is present in `colgroup`.\n*   `<thead>`:\
    \ It groups all the header content of the table.\n*   `<tbody>`: It groups the\
    \ content of the body in a table.\n*   `<tfoot>`: It groups all the footer content\
    \ of the table.\n\n## HTML TABLE COLSPAN AND ROWSPAN\n\nFor example, you want\
    \ to make a cell bigger so that it captures the space of two cells so you can\
    \ use `colspan` and `rowspan`. These are also attributes that are used for `<th>`\
    \ element. For expanding towards columns, you should use `colspan` and for expanding\
    \ to rows you should use `rowspan`. You can enter the number of cells in which\
    \ you want to expand that specific share. And the code will be as given below.\n\
    \n```html\n<table style=\"width: 100%\">\n        <tr>\n            <th colspan=\"\
    2\">Name</th>\n            <th>Age</th>\n        </tr>\n        <tr>\n       \
    \     <td>Brajesh</td>\n            <td>Thakur</td>\n            <td>13</td>\n\
    \        </tr>\n        <tr>\n            <td>Naresh</td>\n            <td>Kumar</td>\n\
    \            <td>42</td>\n        </tr>\n    </table>\n```\n\nThe result will\
    \ be like this here you can see that the cell on the top left corner, its width\
    \ is equal to the width of 2 cells.\n\n![](Images/image00115.jpeg)\n\n## HTML\
    \ LISTS\n\nHTML allows web developers to use lists while making their websites.\
    \ It helps them to add data properly to the document. There are two types of lists\
    \ in HTML. The first one is an ordered list and the second one is an unordered\
    \ list.\n"
