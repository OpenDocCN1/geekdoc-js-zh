    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
    integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
    crossorigin="anonymous"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
    integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
    crossorigin="anonymous"></script>


    *   Bootstrap Grid System


    Bootstrap''s grid system allows up to 12 columns across the page. If you do not
    want to use all 12 columns individually, you can group the columns together to
    create wider columns. Bootstrap''s grid system is responsive, and the columns
    will re-arrange automatically depending on the screen size.


    The Bootstrap grid system has four classes:


    *   Xs  for phone screens (less than 768px).


    *   Sm  for tablet screens (greater than 768px).


    *   Md  for small laptop screens. (Greater than 992px).


    *   Lg  for desktops (greater than 1200px).


    *   Bootstrap Basic Table


    A basic Bootstrap table has a light padding and only horizontal dividers. The
    table class adds basic styling to a table.


    ![](Images/image00144.jpeg)


    *   Striped Rows


    The .table-striped class adds zebra-stripes to a table


    *   Bordered Table


    The. table-bordered class adds borders on all sides of the table and cells.


    *   Hover Rows


    The. table-hover class adds a hover effect (grey background color) on table rows.


    *   Condensed Table


    The. table-condensed class makes a table more compact by cutting cell padding
    in half.


    *   Bootstrap Images


    In bootstrap using certain classes we can get different styles of images.


    ## o Rounded Corners


    The .img-rounded class adds rounded corners to an image (IE8 does not support
    rounded corners).


    ## o Circle Image


    The .img-circle class shapes the image to a circle .


    ## o Responsive Images


    Images come in all sizes. So do screens. Responsive images automatically adjust
    to fit the size of the screen. The code for making an image responsive is shown
    in the next page.


    <img class="img-responsive" src="img_chania.jpg" alt="Chania">


    *   Image Gallery


    You can also use Bootstrap''s grid system in conjunction with the. thumbnail class
    to create an image gallery. The code for creating one card or gallery is like
    as follows.


    <div class="row">


      <div class="col-md-4">


        <div class="thumbnail">


          <a href="/images/ gallary.jpg">


            <img src="/images/gallary.jpg" style="width:100%">


            <div class="caption">


              <p>Lorem ipsum...</p>


            </div>


          </a>


        </div>


      </div>


    The result will look like this with an image and some description.


    ![](Images/image00145.jpeg)


    *   Bootstrap Buttons


    Bootstrap provides different styles of buttons. To achieve the button styles above,
    Bootstrap has the following classes:


    *   . btn


    *   . btn-default


    *   . btn-primary


    *   . btn-success


    *   . btn-info


    *   . btn-warning


    *   . btn-danger


    *   . btn-link


    Write the following code in your text editor and know more about it.


    <button type="button" class="btn">Basic</button>


    <button type="button" class="btn btn-default">Default</button>


    <button type="button" class="btn btn-primary">Primary</button>


    <button type="button" class="btn btn-success">Success</button>


    <button type="button" class="btn btn-info">Info</button>


    <button type="button" class="btn btn-warning">Warning</button>


    <button type="button" class="btn btn-danger">Danger</button>


    <button type="button" class="btn btn-link">Link</button>  


    The result of the code will be like shown below. From the below image you can
    learn more about every single class of buttons in bootstrap.


    ![](Images/image00146.jpeg)


    Under Bootstrap buttons it also has more classes based on sizes.


    *   . btn-lg


    *   . btn-sm


    *   . btn-xs


    *   Bootstrap Buttons


    A progress bar can be used to show a user how far along he/she is in a process.
    Bootstrap provides several types of progress bars.


    To create a default progress bar, add a. progress class to a <div> element. One
    of the best design for progress bars in bootstrap looks like this.


    ![](Images/image00147.jpeg)


    The code for the above given progress bar is clearly available the official website
    of bootstrap.


    We can also make a progress bar with labels in between them. Which will show the
    exact percentage of the data of the bar. The code for it is shown in the next
    page.


    <div class="progress">


      <div class="progress-bar" role="progressbar" aria-valuenow="70"


      aria-valuemin="0" aria-valuemax="100" style="width:70%">


        70%


      </div>


    </div>


    The result for this progress bar code will look like this


    ![](Images/image00148.jpeg)


    *   Bootstrap Pager


    Pager is also a form of pagination Pager provides previous and next buttons (links).
    To create previous/next buttons, add the. pager class to an <ul> element.


    <ul class="pager">


      <li><a href="#">Previous</a></li>


      <li><a href="#">Next</a></li>


    </ul>


    ![](Images/image00149.jpeg)


    # • Bootstrap Dropdowns


    A dropdown menu is a toggleable menu that allows the user to choose one value
    from a predefined list. It makes it very easy to add more navigation link in a
    small navigation bar. The code for a basic dropdown looks like


    <div class="dropdown">


      <button class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown">Website
    <span class="caret"></span></button>


      <ul class="dropdown-menu">


        <li><a href="#">HTML</a></li>


        <li><a href="#">CSS</a></li>


        <li><a href="#">JavaScript</a></li>


      </ul>


    </div>


    ![](Images/image00150.jpeg)The result looks something like this.


    # • Bootstrap Collapse


    *   Basic Collapsible


    Collapsible are useful when you want to hide and show large amount of content.
    Using it we creates a button and on the click o that button it show up more text
    it can be about anything about the button or the content.


    ## • Bootstrap Menus


    In bootstrap you can use Menus to make lists for navbar etc. Because making a
    vertical menu is easy but to make an horizontal menu you have to code many other
    things also . So, for it you can use classes like nav and nav-tabs. And the code
    looks like this.


    <ul class="nav nav-tabs">


      <li class="active"><a href="#">Home</a></li>


      <li><a href="#">Services</a></li>


      <li><a href="#">Products</a></li>


      <li><a href="#">About</a></li>


    </ul>


    ![](Images/image00151.jpeg)


    ## • Bootstrap Navigation Bar


    ## With the help of bootstrap, we can create amazing looking navigation bars.
    So, for a basic nav bar in Bootstrap is shown in the next [page but you can see
    the result here down below.


    ## ![](Images/image00152.jpeg)


    ## Now here you can clearly see that how beautifully the logo and the navigation
    links are shown. That’s the real power of Bootstrap. For making your website easier
    to use you can use dropdown menus also. Now have a look to the code of this nav
    bar.


    <nav class="navbar navbar-default">


      <div class="container-fluid">


        <div class="navbar-header">


          <a class="navbar-brand" href="#">Brajesh Thakur</a>


        </div>


        <ul class="nav navbar-nav">


          <li class="active"><a href="#">Home</a></li>


          <li><a href="#">Page 1</a></li>


          <li><a href="#">Page 2</a></li>


          <li><a href="#">Page 3</a></li>


        </ul>


      </div>


    </nav>'
