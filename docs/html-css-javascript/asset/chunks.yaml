  raw: 'We can also create a fixed navbar by using class name “navbar-fixed-top”.  And
    the code of the nav tag will look like this. We can also fix the navbar at bottom
    just change the class name from name “navbar-fixed-top” to  name “navbar-fixed-bottom”.


    <nav class="navbar navbar-inverse navbar-fixed-top">


    ## • Bootstrap Forms


    Forms pays and important role in a website or a business because it helps us to
    contact with our visitors and getting reviews from them for sign up information’s
    etc. So, from the help of bootstraps, we can make forms looking clean and clear. 
    A basic level code for a basic level form in Bootstrap is like follows


    <form action="/action_page.php">


      <div class="form-group">


        <label for="email">Email address:</label>


        <input type="email" class="form-control" id="email">


      </div>


      <div class="form-group">


        <label for="pwd">Password:</label>


        <input type="password" class="form-control" id="pwd">


      </div>


      <div class="checkbox">


        <label><input type="checkbox"> Remember me</label>


      </div>


      <button type="submit" class="btn btn-default">Submit</button>


    </form>


    ![](Images/image00153.jpeg)


    Bootstrap supports and provide code related to all input methods. For adding a
    checkbox input in a form, you have to use this code.


    <label class="checkbox-inline"><input type="checkbox" value="">Option 3</label>


    ## • Bootstrap Carousel


    Bootstrap is used by most of the users and web developers because of its carousel
    plugin. It helps us to make very beautiful looking working carousel. The code
    for making one these is given below.


    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">


      <div class="carousel-inner">


        <div class="carousel-item active">


          <img src="..." class="d-block w-100" alt="...">


        </div>


        <div class="carousel-item">


          <img src="..." class="d-block w-100" alt="...">


        </div>


        <div class="carousel-item">


          <img src="..." class="d-block w-100" alt="...">


        </div>


      </div>


      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls"
    data-bs-slide="prev">


        <span class="carousel-control-prev-icon" aria-hidden="true"></span>


        <span class="visually-hidden">Previous</span>


      </button>


      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls"
    data-bs-slide="next">


        <span class="carousel-control-next-icon" aria-hidden="true"></span>


        <span class="visually-hidden">Next</span>


      </button>


    </div>


    Here we have coded a carousel using bootstrap classes. The images that are used
    in the carousel can be changed accordingly. Because here we have used src attribute
    to load the image. The result for the above written code for carousel Is shown
    below.


    ![](Images/image00154.jpeg)


    Chapter 6


    PUBLISHING WEBSITES


    Now you have learned everything how to make website and how to make it more durable.
    But the whole folder is just saved in your local computer but if anyone wants
    to come to your website he can’t because it’s om local server not on the public
    server. So, for uploading your website on the internet you would have to get hosting
    but there are many other ways to do so and with free of cost.


    You can use GitHub or Netlify or many more cloud computing websites and software
    for uploading your website. Here in this we will use Netlify for uploading our
    website on the internet.  I will not recommend a beginner for using Git Hub for
    uploading their projects because it is very difficult and complicated. But using
    Netlify you can easily do all the stuff and get an sub domain as well as domain
    for your website.


    ![A tutorial to host your Static Site on Netlify](Images/image00155.jpeg)


    https://app.netlify.com/


    First of all, visit the official website of netlify which is given above. Create
    a account there . Then you will see something like as shown in the image in next
    page. There you will that there is a button for uploading a new site. Just click
    on it. And three options will come in front of you have to select the last one
    “Deploy Manually”. Now a new page will show up in front of you either you can
    drag and drop the main folder or you can also. Select it from your file Explorer.


    ![](Images/image00156.jpeg)


    After doing the whole process you will see something like this as shown below
    now click on “Domain Setting”. And then click on option and then on “Edit Site
    Name”.


    ![](Images/image00157.jpeg)


    Now you will have to add the name of your website which will be eventually displayed
    ON THE subdomain and the subdomain will also be displayed under the input section.
    Now click on save.


    ![](Images/image00158.jpeg)


    Now when this website will be public it will have a subdomain as shown below the
    input bar. But if you want to add a custom domain and you have purchased it from
    any hosting website so you can also do this by going back and clicking on the
    Second Icon as shown in the image below. You just have to enter the domain that
    you have bought and then verify it by giving your detail.


    ![](Images/image00159.jpeg)


    Now when you come back you will see that your website has been published and is
    being shown in the list of uploaded sites. You can add as many websites as you
    want. It provides you 100 GB of Bandwidth for your all projects together.


