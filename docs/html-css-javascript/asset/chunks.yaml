    \ page. There you can see that the whole paragraph is aligned left but the last\
    \ line is aligned in center. And this is responsive too. Like if you open that\
    \ webpage in mobile also you will find out that just the last line is aligned\
    \ center.\n\n![](Images/image00129.jpeg)\n\n## TEXT DIRECTION\n\nThe `direction`\
    \ and `unicode-bidi` properties can be used to change the text direction of an\
    \ element: It can be used to write display languages like Urdu which written right\
    \ to left. In its syntax we have given a direction from right to left. The syntax\
    \ looks like this\n\n```css\np {\n  direction: rtl;\n}\n```\n\nThe result looks\
    \ like this\n\n![](Images/image00130.jpeg)\n\n## Vertical Alignment\n\nThe `vertical-align`\
    \ property sets the vertical alignment of an element. Like in this case it's an\
    \ image used with in the paragraph. There are many values for this vertical alignment\
    \ property. They are shown in the code below.\n\n```css\nimg.a {\n  vertical-align:\
    \ baseline;\n}\n\nimg.a {\n  vertical-align: text-top;\n}\n\nimg.a {\n  vertical-align:\
    \ text-bottom;\n}\n\nimg.a {\n  vertical-align: sub;\n}\n\nimg.a {\n  vertical-align:\
    \ super;\n}\n```\n\nThe results of the above shown code is shown in the next page\
    \ there you can see that the image changes its place accordingly as from top to\
    \ bottom etc.\n\n![](Images/image00131.jpeg)\n\n## CSS TEXT TRANSFORMATION\n\n\
    The `text-transform` property is used to specify uppercase and lowercase letters\
    \ in a text. It can be used to turn everything into uppercase or lowercase letters,\
    \ or capitalize the first letter of each word: It becomes very helpful if you\
    \ wrote anything in lowercase but you want that it should be in uppercase. The\
    \ syntax looks like this\n\n```css\np {\n  text-transform: uppercase;\n}\n```\n\
    \n## TEXT SHADOW\n\nThe `text-shadow` property adds shadow to text. In its simplest\
    \ use, you only specify the horizontal shadow (2px) and the vertical shadow (2px)\
    \ It makes your text look more attractive. The code for it looks like this\n\n\
    ```css\nh1 {\n  text-shadow: 2px 2px red;\n}\n```\n\nIn the above code you can\
    \ see that we have given 2px shadow horizontally and 2px vertically and at last\
    \ we have added shadow colour as red. The result of the above written code is\
    \ shown below.\n\n![](Images/image00132.jpeg)\n\n## CSS FONTS\n\nIn your website\
    \ font plays an important role of attraction. A strong font can create a strong\
    \ identity for your website and brand. A font should be easy to read and understand\
    \ and in addition to all this whichever font you choose should be attractive.\
    \ Most of the websites uses 'Arial' font I their websites like Google, YouTube\
    \ etc.\n\nIn CSS there are mainly five types of font-families.\n\n* Serif.\n*\
    \ Sans-Serif\n* Monoscope\n* Cursive\n* Fantasy\n\n### Web Safe Fonts\n\nThere\
    \ are some fonts which are present in every computer by default and doesn't need\
    \ internet connection or server speed. Because most of time if we use fonts from\
    \ external website and the browser is unable to reach that website from where\
    \ you have used those fonts. All the fonts of your websites will be gone and your\
    \ website will look ugly. So that's why you should use web safe fonts. So, whatever\
    \ happens in the world the fonts will load safely, and it will not affect your\
    \ website in any way. I have mentioned the list of some Web safe fonts. These\
    \ are the most used Web-Safe Fonts.\n\n1. Arial (sans-serif).\n2. Verdana (sans-serif).\n\
    3. Helvetica (sans-serif).\n4. Tahoma (sans-serif).\n5. Trebuchet MS (sans-serif).\n\
    6. Times New Roman (serif).\n7. Georgia (serif).\n8. Garamond (serif).\n9. Courier\
    \ New (monospace).\n10. Brush Script MT (cursive).\n\n### Font Weight\n\nFont\
    \ weight is used to control boldness. You can add values like normal or bold.\
    \ The code and the result for the same is shown in the next page.\n\n```css\n\
    p {\n  font-weight: bold;\n}\n```\n\n![](Images/image00133.jpeg)\n\n### Font Size\n\
    \nSame as other elements you can give properties to control text size also. You\
    \ can give the value for the text size in px, and rem. One rem is equal to 16px.\n\
    \n### Google Fonts\n\nNow your website doesn't look that much attractive with\
    \ web safe fonts. So you can use external website's fonts. The best choice for\
    \ this is Google Fonts. Because this website will never go down and all the fonts\
    \ that you have used in your website will be safe. Now you will think that how\
    \ will we use Google fonts in our websites.\n\nFirst go to fonts.google.com select\
    \ a suitable font. Now just select all the variants of the font. Now you will\
    \ see some links in bottom right corner. Now copy the bottom link and paste it\
    \ in your head tag. This was a method that how will you add a font family in your\
    \ HTML file .\n\n![](Images/image00134.jpeg)\n\n## CSS LINKS\n\nWe can add properties\
    \ to all the four stages of the anchor tag. The four stages are.\n\n* `a:link`\
    \ - a normal, unvisited link.\n* `a:visited` - a link the user has visited.\n\
    * `a:hover` - a link when the user mouses over it.\n* `a:active` - a link the\
    \ moment it is clicked.\n\nThe syntax for giving all these properties to an anchor\
    \ tag is given below.\n\n```css\na:link {\n  color: red;\n}\n\na:visited {\n \
    \ color: green;\n}\n\na:hover {\n  color: blue;\n}\n\na:active {\n  color: yellow;\n\
    }\n```\n\n## CSS POSITION\n\nThe `position` property specifies the type of positioning\
    \ method used for an element (static, relative, fixed, absolute or sticky). Elements\
    \ are then positioned using the top, bottom, left, and right properties. However,\
    \ these properties will not work unless the `position` property is set first.\
    \ They also work differently depending on the position value.\n\n### Position\
    \ Static\n\nThis is the default value for position property. The elements which\
    \ are static in position are not affected by top, bottom, left, right properties.\
    \ The code for static position is like this\n\n```css\ndiv {\n  position: static;\n\
    \  border: 1px #fff;\n}\n```\n\n### Position Relative\n\nIn this position the\
    \ element is in its relative position. Setting the top, right, bottom, and left\
    \ properties of a relatively-positioned element will cause it to be adjusted away\
    \ from its normal position. Other content will not be adjusted to fit into any\
    \ gap left by the element.\n\n```css\ndiv {\n  position: relative;\n  border:\
    \ 1px #fff;\n}\n```\n\n### Position Fixed\n\nIn this position the element is fixed\
    \ in its relative position. It means that weather you scroll till thje end it\
    \ will never move from its place.\n\n```css\ndiv {\n  position: fixed;\n  bottom:\
    \ 0;\n  right: 0;\n  width: 100%;\n}\n```\n\n### Position Absolute\n\nAn element\
    \ with `position absolute` is positioned relative to the nearest positioned ancestor.\
    \ Absolute positioned elements are removed from the normal flow, and can overlap\
    \ elements.\n\n```css\ndiv {\n  position: absolute;\n  top: 80px;\n  right: 0;\n\
    \  width: 200px;\n  height: 100px;\n}\n```\n\n### Position Sticky\n\nIf an element\
    \ has given sticky as a value for the position property it will always be sticked\
    \ there only it is used to make navigation bars in websites.\n\n```css\ndiv {\n\
    \  position: -webkit-sticky;\n  position: sticky;\n  top: 0;\n  background-color:\
    \ black;\n  border: 1px solid #fff;\n}\n```\n\n## Z-INDEX\n\nThe `z-index` property\
    \ specifies the stack order of an element. Like using this property we chooses\
    \ that which element should be on top and which should be one the bottom. The\
    \ value of it is from infinity to infinity. The more the value of an element is\
    \ the more on the top it is. Now in the following code you can see that we have\
    \ given `z-index: -1` means that it the lowest and the image will be in the most\
    \ bottom layer of the document.\n\n```css\nimg {\n  position: absolute;\n  margin:\
    \ auto;\n  top: 0px;\n  z-index: -1;\n}\n```\n\n## CSS FLOAT\n\nThe `float` property\
    \ is used for positioning and formatting content e.g. let an div or a image float\
    \ left to a container. The `float` property can have one of the following values:\n\
    \n* `left` - The element floats to the left of its container.\n* `right` - The\
    \ element floats to the right of its container.\n* `none` - The element does not\
    \ float.\n* `inherit` - The element inherits the float value of its parent.\n"
