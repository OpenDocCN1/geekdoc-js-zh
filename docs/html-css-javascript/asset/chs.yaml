  \nBootstrap 支持并提供所有输入方法的相关代码。要在表单中添加复选框输入，需要使用以下代码：\n\n```\n<label class=\"checkbox-inline\"\
  ><input type=\"checkbox\" value=\"\">选项 3</label>\n```\n\n## • Bootstrap 轮播\n\n\
  Bootstrap 因其轮播插件而被大多数用户和 Web 开发者使用。它帮助我们制作出非常美观且可用的轮播。制作轮播的代码如下所示：\n\n```\n<div\
  \ id=\"carouselExampleControls\" class=\"carousel slide\" data-bs-ride=\"carousel\"\
  >\n  <div class=\"carousel-inner\">\n    <div class=\"carousel-item active\">\n\
  \      <img src=\"...\" class=\"d-block w-100\" alt=\"...\">\n    </div>\n    <div\
  \ class=\"carousel-item\">\n      <img src=\"...\" class=\"d-block w-100\" alt=\"\
  ...\">\n    </div>\n    <div class=\"carousel-item\">\n      <img src=\"...\" class=\"\
  d-block w-100\" alt=\"...\">\n    </div>\n  </div>\n  <button class=\"carousel-control-prev\"\
  \ type=\"button\" data-bs-target=\"#carouselExampleControls\" data-bs-slide=\"prev\"\
  >\n    <span class=\"carousel-control-prev-icon\" aria-hidden=\"true\"></span>\n\
  \    <span class=\"visually-hidden\">上一页</span>\n  </button>\n  <button class=\"\
  carousel-control-next\" type=\"button\" data-bs-target=\"#carouselExampleControls\"\
  \ data-bs-slide=\"next\">\n    <span class=\"carousel-control-next-icon\" aria-hidden=\"\
  true\"></span>\n    <span class=\"visually-hidden\">下一页</span>\n  </button>\n</div>\n\
  ```\n\n这里我们使用 Bootstrap 类编写了一个轮播。轮播中使用的图片可以根据需要更改，因为我们使用了 `src` 属性来加载图片。上述轮播代码的效果如下所示：\n\
  \n![](img/image00154.jpeg)\n\n# 第 6 章：发布网站\n\n现在你已经学会了如何制作网站以及如何使其更持久。但整个文件夹只保存在你的本地计算机上，如果有人想访问你的网站，他们无法做到，因为它位于本地服务器上，而不是公共服务器上。因此，要将你的网站上传到互联网上，你需要获得托管服务，但还有许多其他方法可以免费做到这一点。\n\
  \n你可以使用 GitHub、Netlify 或更多云计算网站和软件来上传你的网站。在这里，我们将使用 Netlify 将我们的网站上传到互联网上。我不建议初学者使用\
  \ GitHub 上传项目，因为它非常困难和复杂。但使用 Netlify，你可以轻松完成所有操作，并为你的网站获得一个子域名甚至自定义域名。\n\n![在 Netlify\
  \ 上托管静态网站的教程](img/image00155.jpeg)\n\nhttps://app.netlify.com/\n\n首先，访问上面给出的 Netlify\
  \ 官方网站。在那里创建一个账户。然后你会看到类似下一页图片所示的内容。你会看到一个用于上传新网站的按钮。只需点击它。然后会出现三个选项，你需要选择最后一个“手动部署”。现在，一个新页面会出现在你面前，你可以拖放主文件夹，也可以从文件资源管理器中选择它。\n\
  \n![](img/image00156.jpeg)\n\n完成整个过程后，你会看到类似下图所示的内容，现在点击“域名设置”。然后点击选项，再点击“编辑站点名称”。\n\
  \n![](img/image00157.jpeg)\n\n现在你需要添加你的网站名称，该名称最终会显示在子域名中，子域名也会显示在输入部分下方。现在点击保存。\n\
  \n![](img/image00158.jpeg)\n\n现在，当这个网站公开时，它将有一个子域名，如下方输入栏所示。但如果你想添加一个自定义域名，并且你已经从某个托管网站购买了它，你也可以通过返回并点击下图所示的第二个图标来实现。你只需输入你购买的域名，然后通过提供你的详细信息进行验证。\n\
  \n![](img/image00159.jpeg)\n\n现在当你返回时，你会看到你的网站已经发布，并显示在上传站点列表中。你可以添加任意数量的网站。它为你的所有项目总共提供\
  \ 100 GB 的带宽。\n\n## 我的寄语\n\n![心形图标](img/image00160.jpeg)\n\n致本书的所有读者，我非常感激你们阅读这本书。这本书只是一个\
  \ 13 岁孩子 Brajesh Thakur 的想法。我想在这本书中加入更多我的想法，但我的年龄不允许我这样做。我知道，如果你购买了这本书，要么是我推荐你阅读的，要么是我非常成功。这是我在\
  \ Web 开发领域的全部知识。如果你想分享你对这本书的评论，可以发送邮件至 workforbiju@gmail.com。特别感谢 Amazon Kindle\
  \ 出版公司出版本书的电子版，以及 Pothi 图书出版公司出版平装版。如果你认真阅读了整本书，你一定会学会 Web 开发，至少是前端开发。最后一点，你练习和构建网站的次数越多，你学到的就越多。\n\
  \n## 关于作者\n\n![心形图标](img/image00160.jpeg)\n\n本书的作者 Brajesh Thakur 先生是一个小孩子。在目前 13\
  \ 岁的年纪，他已经是 Web 开发者、Logo 设计师、平面设计师、程序员、内容写手、自由职业者、股票市场顾问、UI 开发者、UX 开发者等等。在这本书中，他分享了他关于\
  \ Web 开发的知识。我们希望这本书能帮助你在 Web 开发领域获得更多技能，并进而进入计算机科学领域。Web 开发只是一个开始，你可以在计算机科学领域做更多的事情。如果你购买了这本书，你肯定有一些抱负，我们的团队希望你实现生活中的所有梦想。\n\
