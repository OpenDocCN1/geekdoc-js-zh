  - "[PAGE 74]\n\n(b) If you enter an initial value which is greater than the final\
    \ value, then the condition will evaluate to `false` the first time it is tested,\
    \ so the body of the loop will never be evaluated and the value of `count` will\
    \ never be displayed.\n\n(c) This demonstrates that loop counters needn't necessarily\
    \ be incremented in steps of 1; `count` starts at the initial value and then goes\
    \ up in steps of 2. The condition evaluates to `false` when the value of `count`\
    \ reaches its greatest possible value which is less than or equal to the stopping\
    \ value.\n\nFor initial and stopping values of 3 and 10 the loop will be executed\
    \ four times (with `count` taking the values 3, 5, 7, 9)\n\nFor initial and stopping\
    \ values of 4 and 10 the loop will be executed four times (with `count` taking\
