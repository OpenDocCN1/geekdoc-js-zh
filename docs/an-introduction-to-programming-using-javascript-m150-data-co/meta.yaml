    \ a 为假；如果 a 为假，则 NOT a 为真。\n- OR 是二元布尔运算符，具有以下效果：\n    如果 a 或 b 中有一个为真，或者两者都为真，则\
    \ a OR b 为真；\n    否则（如果 a 和 b 都不为真）a OR b 为假。\n- AND 是二元布尔运算符，具有以下效果：\n    如果\
    \ a 和 b 都为真，则 a AND b 为真；\n    否则（如果 a 或 b 中有一个为假），a AND b 为假。\n\nJavaScript 中逻辑运算符\
    \ NOT 的符号是 `!`；OR 的符号是 `||`；AND 的符号是 `&&`。\n\n> 符号 | 在你的键盘上可能看起来像是两条垂直的半条线。\n\n\
