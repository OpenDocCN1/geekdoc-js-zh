    # Unit 7 An introduction to programming using JavaScript


    (b) You might have guessed from our use of the numbers 0 and 4 to output the first
    and fifth characters in the string that myString.charAt(n) will return the character
    in the position after n in the string myString. The characters in a JavaScript
    string are numbered (we say indexed) from 0 to one less than the number of characters.
    So myString.charAt(0) returns the character that is the first in the string assigned
    to the variable myString (starting from the left); myString.charAt(4) returns
    the character in the fifth position from the left.


