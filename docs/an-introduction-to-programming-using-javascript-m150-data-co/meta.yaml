    # (b) Now use Notepad to read the source code of Program_7.2.1 (i.e. the instructions
    that produced the output above).


    **You should see the following.**


    ```

    <HTML>

    <HEAD>

    <TITLE> Program_7.2.1 First Program

    </TITLE>

    <SCRIPT LANGUAGE = "JavaScript">

    document.write(''Welcome to programming!'')

    </SCRIPT>

    </HEAD>

    <BODY>

    </BODY>

    </HTML>

    ```


    # Discussion


    You might recognise most of these lines as HTML code, telling the browser to open
    a new window, with ''Program_7.2.1 First Program'' appearing in the title bar.


    The lines


    <SCRIPT LANGUAGE = "JavaScript">


    and


    </SCRIPT>


    inform the HTML system that the lines of code between them are not HTML instructions
    but are written in a scripting language, in this case JavaScript. In fact, if
    no specific language is specified HTML will assume that the code is JavaScript,
    so the first of the HTML lines above could be replaced by

    <SCRIPT>.


    There is only one line of JavaScript in this program, the line which reads:


    ```

    document.write(''Welcome to programming!'')

    ```


    You were introduced to HTML in Unit 4.


    All the other lines – those in angle brackets (< and >) – are HTML. We do not
    intend to teach you any HTML in this unit, other than the lines necessary to display
    the results of your JavaScript in a browser window.


    The line of JavaScript code in Program_7.2.1 is the instruction to display the
    text


    ```

    Welcome to programming!

    ```


    Let us examine it in more detail.


    +   - `document` is a kind of program structure called an **object**. Each type
    of object in a programming language is associated with particular behaviour (the
    things it can do). You may think of a `document` object as consisting of the contents
    of the current page, which are displayed in a window opened by the browser. Each
    aspect of an object''s behaviour is implemented by program code called a **method**.
    You will learn more about objects in Unit 9.'
