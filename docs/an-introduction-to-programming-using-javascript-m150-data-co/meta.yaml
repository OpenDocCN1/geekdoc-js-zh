  md: '# Naming variables


    In the above examples we have used `sum`, `myVar`, and `yourVar` as variable names.
    The name `sum` might indicate to a reader that the value of the variable holds
    the sum (total) of some other values; the names `myVar` and `yourVar` give no
    clue as to the role played by these variables (they were actually used to make
    teaching points, rather than to carry out a specific task). We recommend that
    you name variables in such a way as to indicate the role that the variable has
    in carrying out your particular programming task. We mentioned earlier in this
    subsection that names for variables are sometimes referred to as identifiers.
    The distinction between the two is rather subtle. An **identifier** in a program
    is a name that must follow particular rules (which vary between programming languages).
    All names allocated by the programmer, such as those for variables, methods and
    so on, must be valid identifiers. You will find that name and identifier are often
    used interchangeably in books about programming. In JavaScript identifiers must
    conform to the following format.


    The first character must be one of the following:

    - an upper- or lower-case letter (that is, A...Z, a...z);

    - an underscore character (_);

    - a dollar sign ($).


    Subsequent characters may be any of the above or a digit (0, 1, 2, ..., 9).


    You may not use a reserved word which is already part of JavaScript''s vocabulary.
    (You have already seen `var` as a reserved word signalling a variable declaration;
    you will later see other reserved words, such as `while`, `if`, `for`.)


    The above rules governing identifiers are mandatory. However, in M150 we encourage
    you to respect the following style guidelines when choosing identifiers for your
    variables. Sticking to these guidelines will make your programs easier to read
    and (if necessary) debug.


    +   - Although there is no lower or upper limit on the number of characters that
    can be used in an identifier, we would urge you to avoid very short identifiers,
    such as `a`, `b`, `x`, `ch`, because they are not very informative.

    - As far as possible, avoid the use of $ and _ in identifiers. Identifiers composed
    entirely of letters are usually the most meaningful to human readers, though it
    might sometimes be appropriate to use digits in identifiers for a number of similar
    values, e.g. `sum1`, `sum2`, `sum3`.

    - Choose meaningful names, i.e. names which give some indication of the role played
    by the variable.

    - Start your identifiers with lower-case letters. Where an identifier is composed
    of two or more English words, then we suggest the use of a single upper-case letter
    to mark the start of each word after the first. We have used this style of identifier
    (known as camel-backed identifiers) for `myVar` and `yourVar`. Here are a few
    more examples: `totalCost`, `dateToday`, `myFamilyName`.'
