    \n如果不是，则跳过显示**通过**的指令，而执行显示**未通过**的指令。\n\n## 3.1 布尔值和比较运算符\n\n你会回忆起第 6 单元，无论布尔条件中涉及哪种值，条件总是被评估为真或假。例如，你看到了涉及数字、形状和颜色比较的条件。在\
