    \ statement?\n- What do you need to do if it evaluates to true?\n- What do you\
    \ need to do afterwards?\n\n### Further hints\n\n- Before the if statement, you\
    \ need to prompt the user to enter a password, and then re-enter it.\n- You will\
    \ need to declare two variables, one for the original password entry and one for\
    \ the retyped password.\n- If the values of the two variables don't match, you\
    \ should display Your password is unchanged. You may have to look at the table\
    \ of operators (Table 3.1) to remind yourself of the JavaScript symbol for 'not\
    \ equal to'.\n- You need to finish off the program with a further line of output.\n\
    \n## Unit 7 An introduction to programming using JavaScript\n\n(a) Here is our\
    \ code (yours might differ in details).\n\n```\nvar password, repeatPassword;\n\
    \npassword = window.prompt('Please enter your password', '');\nrepeatPassword\
    \ = window.prompt('Please re-enter your password', '');\nif (password != repeatPassword)\n\
    {\n  document.write('Your password is unchanged' + '<BR>');\n};\ndocument.write('Thank\
    \ you')\n```\n\nYou will find a working solution in Solution_7.3.4.\n\n(b) In\
    \ order to test your code, you would need to run the program at least twice, once\
    \ when the original password and the retyped password don't match, so (password\
    \ != repeatPassword) is true, and once when they do, so that the condition is\
    \ false.\n\n## SAQ 3.3\n\n**Why wasn't the function needed in the above program?**\n\
    \nAnswer to SAQ 3.3 ✓ Because the program is concerned with matching strings,\
    \ and not numbers.\n\n## The if...else statement\n\nOften, you want the computer\
    \ to do one thing if a condition is true and something else if the condition is\
    \ false (before carrying on with the rest of the program).\n\n## ACTIVITY 3.5\n\
    \nThe following is the JavaScript code from Program_7.3.5, with line numbers added\
    \ for reference.\n\n```\n(1) var bankBalance, withdrawalAmount;\n(2) bankBalance\
    \ = 100;\n(3) withdrawalAmount = window.prompt('How much do you want to withdraw?','');\n\
    (4) withdrawalAmount = parseFloat(withdrawalAmount);\n(5) if (withdrawalAmount\
    \ > bankBalance)\n(6) {\n(7) document.write('You cannot do that!' + '<BR>')\n\
    (8) }\n(9) else\n(10) {\n(11) bankBalance = bankBalance - withdrawalAmount\n(12)\
    \ };\n(13) document.write('Your bank balance is now £'+ bankBalance + '<BR>');\n\
    (14) document.write('Goodbye')\n```\n\n(a) Run the program three times, with inputs\
    \ of 50, 100 and 150, and note down your outputs.\n\n(b) What does the code on\
    \ lines (5) to (12) do?\n\n### Discussion\n\n(a) An input of 50 gives the following\
    \ output:\n\nYour bank balance is now £50\n\nGoodbye\n\nAn input of 100 gives:\n\
    \nYour bank balance is now £0\n\nGoodbye\n\nAn input of 150 gives:\n\nYou cannot\
    \ do that!\n\nYour bank balance is now £100\n\nGoodbye\n\n(b) If the expression\
    \ on line (5) evaluates to true, then the statement on line (7) (sometimes known\
    \ as the if clause or if part), is executed, and the execution skips the statement\
    \ in the else clause (line (11)).\n\nIf the expression evaluates to false, then\
    \ the if clause is skipped, and the else clause is executed, so that the value\
    \ of bankBalance becomes 100 minus the amount input.\n\nIn both cases, lines (13)\
    \ and (14) are then executed.\n\n## The syntax of an if...else statement\n\nThe\
    \ syntax is\n\n```\nif (Boolean expression)\n{\n    statement(s)\n}\nelse\n{\n\
    \    different statement(s)\n}\n```\n\nNote that in JavaScript this is considered\
    \ to be a single language statement (an if...else statement), so the semicolon\
    \ separating it from the next statement (if there is one) comes only at the end.\
    \ In particular, there is no semicolon before the else.\n\nFigure 3.2 provides\
    \ a diagrammatic illustration of an if...else statement.\n\nFigure 3.2 How an\
    \ if...else statement works\n\n## ACTIVITY 3.6\n\nThe file Activity_7.3.6 contains\
    \ a copy of the correct code for Activity_7.3.4 (the password program). Open the\
    \ file in Notepad and modify the JavaScript source code so that if the condition\
    \ (password != repeatPassword) evaluates to true, the program displays Your password\
    \ is unchanged (as in the original program), but if it evaluates to false, the\
    \ program displays Password successfully changed. Test your program by entering\
    \ two matching passwords and then two passwords which do not match.\n\nHere is\
    \ our code.\n\n```\nvar password, repeatPassword;\n\npassword = window.prompt('Please\
    \ enter your password', '');\nrepeatPassword = window.prompt('Please re-enter\
    \ your password', '');\nif (password != repeatPassword) {\n  document.write('Your\
    \ password is unchanged' + '<BR>');\n} else {\n  document.write ('Password successfully\
    \ changed' + '<BR>');\n}\ndocument.write('Thank you')\n```\n\nNote that the semicolon\
    \ which followed the first closing brace has been removed, and one added after\
    \ the second closing brace.\n\nYou will find a working solution in Solution_7.3.6.\n\
    \n## ACTIVITY 3.7\n\nThe file Activity_7.3.7 contains an HTML template for a JavaScript\
    \ program.\n\n(a) Open the file in Notepad and write a program which asks the\
    \ user whether they are having a good day today. If they enter yes, it displays\
    \ the message Glad to hear it; otherwise, it displays Maybe tomorrow will be better.\
    \ In either case, it finishes by saying Thank you for replying.\n\n### Hints\n\
    \nFigure 3.2 may be helpful to you when thinking of your program.\n\n- What do\
    \ you want to do before you evaluate the Boolean expression?\n- What is the Boolean\
    \ expression?\n- What do you want to do if it is true, and if it is false?\n-\
    \ What do you want to do afterwards?\n\n### Further hints\n\nBefore you evaluate\
    \ the Boolean expression, you need to ask whether the user is having a good day,\
    \ and get some response. So you need to declare a variable to hold the value of\
    \ the response and you need to invoke a prompt dialogue box."
