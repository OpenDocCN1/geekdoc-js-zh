    (c) It is not true that (x > 10)。[(x > 10) 不成立。]\n\n### 讨论\n\n```\n(a) ((x > 3)\
    \ || (x <= 1))\n```\n\n```\n(b) ((x > 3) && (x <= 5))\n```\n\n```\n(c) !(x > 10)（(x\
    \ <= 10) 也是可接受的替代方案。）\n```\n\n### 练习 3.4\n\n当 `x` 为 21 时，以下布尔表达式（以 JavaScript\
