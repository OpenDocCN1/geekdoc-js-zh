    \ and stopping values of 4 and 11 the loop will be executed four times (with `count`\
    \ taking the values 4, 6, 8, 10)\n\n# ACTIVITY 5.3\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_74_0.png)\n\
    \n**Program_7.5.3** is the same as **Program_7.5.2** except that the lines:\n\n\
    ```\nfor(var count = initialValue; count <= endValue;\n    count = count + stepValue)\n\
    ```\n\n**have been replaced by the lines:**\n\n```\nfor(var count = initialValue;\
    \ count >= endValue;\n    count = count - stepValue)\n```\n\n**(the comparison\
    \ operator has been changed from <= to >= and the counter is decremented rather\
    \ than incremented).**\n\n**Run Program_7.5.3** with a variety of initial, stopping\
    \ and step values.\n\n(a) **How many times is the body of the for loop executed\
    \ with initial and stopping values of 2 and 5, and a step value of 1?**\n\n(b)\
    \ **How many times is the body of the for loop executed with initial and stopping\
    \ values of 10 and 1, and a step value of 1?**\n\n# Discussion\n\nThis activity\
    \ demonstrates that for loops can be written with decreasing as well as increasing\
    \ counters.\n\n(a) In this case (a descending count with an initial value less\
    \ than the final value) the condition in the for loop will evaluate to `false`\
    \ the first time it is tested, so the body of the for loop will not be executed\
    \ at all.\n\n(b) The loop body will be executed 10 times."
