  md: 'After writing or modifying a program, you should always test it to see whether
    it (still!) works. Even when making very small changes it''s easy to accidentally
    introduce errors into code that was working! You can''t possibly run a program
    for every possible input value (there are, for example, infinitely many numbers),
    so it''s important to choose a set of test inputs that are likely to find any
    errors. For `if` statements, you should test with at least two values, one which
    makes the condition true, and one which makes it false. This will ensure that
    you test both possible routes through the program: the route by which the statement(s)
    within the braces are executed, and the route by which they are ignored.


    # EXERCISE 3.1


    One common error when writing Boolean expressions is to use the wrong comparison
    operator, e.g. `>=` instead of `>`. What input value would reveal whether or not
    you had made this error in line (5) of the code discussed in Activity 3.3?


    # Discussion


    The required value is 100. If you had used `>=` rather than `>`, then an input
    of 100 would have caused the Boolean expression on line (5) to evaluate to `true`,
    and the statement on line (7) to be executed. As discussed in Activity 3.3(b),
    the use of `>` with an input of 100 caused line (7) to be correctly skipped.


    When using the comparison operators `<`, `<=`, `>` and `>=` it is advisable to
    test your code with the value which determines the choice of behaviour (100 in
    this case) and also the two closest possible values (99 and 101 in this case,
    assuming you are restricting yourself to whole numbers). These values at and around
    the value which determines the behaviour are called **boundary values**.


