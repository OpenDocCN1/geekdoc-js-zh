- md: "## 5.2 Strings and for loops\n\nIn Section 4, you met the concept of a string\
    \ as an object and the string method `charAt()` which returns the character at\
    \ the specified position in the string (starting at index 0).\n\nIn addition to\
    \ being associated with methods, which define their behaviour, objects are associated\
    \ with **properties**, which hold information related to their structure and state\
    \ (value). String objects have one such property called `length` which, as you\
    \ might guess, holds the number of characters in the string. The existence of\
    \ the `length` property, coupled with the fact that we can access characters at\
    \ particular positions in the string using `charAt()`, means that `for` loops\
    \ are ideally suited for processing the characters in a string. You will see some\
    \ examples of this later in this section. First we explain how to use the `length`\
    \ property.\n\n### ACTIVITY 5.8\n\n![image](img/563dcadf5ae68219c0c3dfb03c7cc823_80_0.png)\n\
    \n**The following code is from Program_7.5.8. It repeatedly prompts the user to\
    \ enter a string, and displays its length until the user enters a terminating\
    \ string, end.**\n\n```\nvar myString; // string entered by user\n\n// initialise\
    \ myString to an empty string\nmyString = '';\nwhile (myString != 'end')\n{\n\
    \    myString =\n        window.prompt('Please input a string; enter end to finish','');\n\
    \    document.write('The length of ' + myString + ' is ' +\n                 \
    \ myString.length + '<BR>')\n};\ndocument.write('Thank you')\n```\n\n**Note that\
    \ the ‘dot’ notation (`myString.length`) is used to indicate a property associated\
    \ with an object.**\n\n**Think of some strings of different lengths and kinds,\
    \ including the empty string and some strings that contain spaces. Write down\
    \ what you think the output of Program_7.5.8 would be for each of these strings.\
    \ Run the program to check your answers.**\n\n### Discussion\n\nYou should have\
    \ found that in all cases the `length` property gave the exact number of characters\
    \ in the string, regardless of the type of character. Here are some example strings\
    \ and their lengths.\n\n| String | Length |\n|---|---|\n| 'hello' | 5 |\n| \"\"\
    \ (empty string) | 0 |\n| '******' | 6 |\n| 'hello world' | 11 |\n| '123456789'\
    \ | 9 |\n| 'length of myString' | 18 |\n| 'end' | 3 |\n\n### SAQ 5.2\n\n(a) What\
    \ is the value of the number n for which `myString.charAt(n)` returns the first\
    \ character of `myString`?\n\n(b) Write a line of JavaScript code which obtains\
    \ the index of the last character in the string `myString` and assigns it to the\
    \ variable `lastIndex`. (Hint: You will need to use the length property of the\
    \ string to find out how many characters it has.)\n\n### Answer to SAQ 5.2 ✓\n\
    \n(a) The value of n is 0. Remember that in JavaScript the indexing of characters\
    \ in a string begins with index 0.\n\n(b)\nBecause the first character in the\
    \ string is indexed 0, the last character is indexed to the value of the length\
    \ minus 1. For example, a string of length 3 will have characters indexed 0, 1\
    \ and 2.\n\nAs mentioned earlier, we can use a for loop, the length property and\
    \ the charAt() method to iterate through a string, character by character, as\
    \ illustrated in Figure 5.3 (opposite).\n\n![image](img/563dcadf5ae68219c0c3dfb03c7cc823_81_0.png)\n\
    \n### ACTIVITY 5.9\n\nIn this activity we want you to write a program which reads\
    \ in a string from the user and outputs the characters, each followed by an asterisk.\
    \ So, for example, if the user inputs the string hello, the output will be:\n\n\
    h*e*l*l*o*\n\nWe have provided you with the template for a program called Activity_7.5.9.\
    \ Open this file in Notepad and insert your code where we have indicated. Test\
    \ your program by running it with a number of different strings.\n\n![image](img/563dcadf5ae68219c0c3dfb03c7cc823_82_0.png)\n\
    \n**Figure 5.3** Using a **for** loop to process a string, character by character.\n\
    \n### Discussion\n\nHere is our code:\n\n```\nvar myString;\nmyString = window.prompt('Please\
    \ enter a string','');\n//Remember - the arguments to charAt() start at 0, not\
    \ 1\nfor (var count = 0; count < myString.length; count = count + 1)\n{\n    document.write(myString.charAt(count)\
    \ + '*')\n}\n```\n\nDid you remember to use the dot notation with both `length`\
    \ and `charAt()`?\n\nYou will find a working solution in Solution_7.5.9.\n\n![image](img/563dcadf5ae68219c0c3dfb03c7cc823_83_0.png)\n\
    \n### ACTIVITY 5.10\n\nHere is the code from Program_7.5.10.\n\n```\nvar word,\
    \ letter;\nword = window.prompt('Please enter a word','');\nfor (var count = 0;\
    \ count < word.length; count = count + 1)\n{\n    letter = word.charAt(count);\n\
    \    if (letter == 'e')\n    {\n        document.write('*')\n    }\n    else\n\
    \    {\n        document.write(letter)\n    };\n}\n```\n\nNote the use of the\
    \ if statement inside the for loop. Note also our indentation to show the structure\
    \ of the code.\n\n(a) Think of a few words of different lengths and write down\
    \ what you think the output of Program_7.5.10 will be when each of these words\
    \ is input. Run Program_7.5.10 and check whether you are right.\n\n(b) Activity_7.5.10\
    \ contains a copy of Program_7.5.10. Open this file in Notepad and amend the program\
    \ so that instead of doing what it did in part (a), it displays the number of\
    \ occurrences of the letter e in the input word.\n\n### Discussion\n\n(a) Program_7.5.10\
    \ reads in a word from the user, and displays it with any occurrences of the letter\
    \ e replaced by asterisks.\n\n(b) Here is our code.\n\n```\nvar word, total;\n\
    word = window.prompt('please enter a word','');\ntotal = 0;\nfor (var count =\
    \ 0; count < word.length; count = count + 1)\n{\n    if (word.charAt(count) ==\
    \ 'e')\n    {\n        total = total + 1\n    }\n};\ndocument.write('The number\
    \ of occurrences of e in the word ' + word + ' is ' + total)\n```\n\nNote the\
    \ way we have used `word.charAt(count)` directly in the `if` statement to avoid\
    \ the need for the variable `letter`.\n\nYou will find a working solution in Solution_7.5.10.\n\
    \n### SAQ 5.3\n\n(a) What factor would you consider when deciding whether to use\
    \ a while loop or a for loop in a program?\n\n(b) What are the three parts of\
    \ the loop control statement in a for loop?\n\n(c) What happens when the condition\
    \ controlling a while loop evaluates to false?\n\n(d) What must you always include\
    \ in the body of a while loop?\n\n### Answer to SAQ 5.3\n\n(a) If you knew in\
    \ advance how many repetitions would be needed, you would probably use a for loop,\
    \ but if you did not know, you would need to use a while loop.\n\n(b) The three\
    \ parts are:\n- declaration and initialisation of a counter variable;\n- a condition\
    \ specifying the finishing value of the counter;\n- a statement to increment or\
    \ decrement the counter.\n\n(c) The program jumps to the statement (if any) directly\
    \ following the body of the while loop.\n\n(d) A statement or statements which\
    \ will eventually cause the controlling condition to evaluate to false.\n\nConditional\
    \ statements (such as the if statement), while statements and for statements are\
    \ all kinds of **control structures**, so called because they control the flow\
    \ of execution of the program, i.e. the order in which statements are executed.\
    \ This flow of execution, which is dependent on the evaluation of Boolean conditions,\
    \ is often called the **flow of control**.\n\n## 5.3 Summary\n\nIn this section,\
    \ we have discussed the use of the for statement, which uses a counter to control\
    \ the number of executions of a sequence of statements.\n\nWe revised the charAt()\
    \ method of string objects and introduced you to the string property length.\n\
    \n## 6 Unit summary\n\nIn this unit, we introduced you to programming in JavaScript.\n\
    \nIn Section 2, we considered sequential execution, simple input and output, and\
    \ introduced the important concepts of variables and assignment. We discussed\
    \ some data types and their associated operators. Section 3 looked at the `if...else`\
    \ statement, a program construct for selection. In Sections 4 and 5, we considered\
    \ two constructs for repetition: the condition-controlled `while` statement in\
    \ Section 4, and the counter-controlled `for` statement in Section 5.\n\nIn Unit\
    \ 8, we examine more complex data types and discuss how we begin to decompose\
    \ programming tasks into subtasks.\n\n### 6.1 Learning outcomes\n\nHaving studied\
    \ this unit, you should have achieved the following learning outcomes.\n\n- Run\
    \ a given program. (Activity 2.1 onwards)\n- Read and modify source code. (Activity\
    \ 2.2 onwards)\n- Use `document.write()` to display output. (Activity 2.2 onwards)\n\
    - Declare variables, and assign values to them. (Section 2.2; SAQ 2.6; Activity\
    \ 2.7, Activity 3.1 onwards)\n- Understand the need to make program code comprehensible\
    \ to a human reader. (Exercise 2.4)\n- Obtain input to a program from a user using\
    \ `window.prompt()`. (Activity 2.6 onwards)\n- Use `parseFloat()` to convert a\
    \ numeric string into a number. (SAQ 2.13; Activity 2.9 onwards)\n- Understand\
    \ and use Booleans and comparison operators. (SAQs 3.1, 3.2; Activities 3.1, 3.2)\n\
    - Understand and use an `if` statement. (Activities 3.3, 3.4)\n- Understand and\
    \ use an `if...else` statement. (SAQ 3.5; Exercise 3.2; Activities 3.5, 3.6, 3.7,\
    \ 3.8)\n- Insert appropriate comments into your programs. (Activity 3.8)\n- Use\
    \ Boolean operators. (SAQs 3.6, 3.7; Exercises 3.3, 3.4)"
  mdcn: "\n## 5.2 字符串和 for 循环\n\n在第 4 节中，你了解了字符串作为一个对象的概念，以及字符串方法 `charAt()`，它返回字符串中指定位置处的字符（索引从\
    \ 0 开始）。\n\n除了与定义其行为的方法相关联外，对象还与**属性**相关联，属性保存与其结构和状态（值）相关的信息。字符串对象有一个这样的属性，称为\
    \ `length`，正如你可能猜到的那样，它保存字符串中字符的数量。`length` 属性的存在，加上我们可以使用 `charAt()` 访问字符串中特定位置的字符这一事实，意味着\
    \ `for` 循环非常适合用于处理字符串中的字符。在本节稍后你将看到一些这方面的例子。首先我们要解释如何使用 `length` 属性。\n\n### 活动\
    \ 5.8\n\n![image](img/563dcadf5ae68219c0c3dfb03c7cc823_80_0.png)\n\n**以下代码来自 Program_7.5.8。它会反复提示用户输入一个字符串，并在用户输入终止字符串\
    \ end 之前，显示其长度。**\n\n```\nvar myString; // string entered by user\n\n// initialise\
    \ myString to an empty string\nmyString = '';\nwhile (myString != 'end')\n{\n\
    \    myString =\n        window.prompt('Please input a string; enter end to finish','');\n\
    \    document.write('The length of ' + myString + ' is ' +\n                 \
    \ myString.length + '<BR>')\n};\ndocument.write('Thank you')\n```\n\n**请注意，“点”表示法（`myString.length`）用于指示与对象关联的属性。**\n\
    \n**想想一些长度和类型不同的字符串，包括空字符串和一些包含空格的字符串。写下你认为 Program_7.5.8 对于这些字符串的输出结果是什么。运行程序以检查你的答案。**\n\
    \n### 讨论\n\n你应该发现，在所有情况下，`length` 属性都给出了字符串中字符的确切数量，无论字符类型如何。以下是一些示例字符串及其长度。\n\
    \n| String | Length |\n|---|---|\n| 'hello' | 5 |\n| \"\" (empty string) | 0 |\n\
    | '******' | 6 |\n| 'hello world' | 11 |\n| '123456789' | 9 |\n| 'length of myString'\
    \ | 18 |\n| 'end' | 3 |\n\n### 自我评估题 5.2\n\n(a) `myString.charAt(n)` 返回 `myString`\
    \ 的第一个字符时，数字 n 的值是多少？\n\n(b) 写一行 JavaScript 代码，获取字符串 `myString` 中最后一个字符的索引，并将其赋值给变量\
    \ `lastIndex`。（提示：你需要使用字符串的长度属性来找出它有多少个字符。）\n\n### 自我评估题 5.2 的答案 ✓\n\n(a) n 的值是\
    \ 0。请记住，在 JavaScript 中，字符串中字符的索引从索引 0 开始。\n\n(b)\n由于字符串中的第一个字符索引为 0，因此最后一个字符的索引是长度值减\
    \ 1。例如，长度为 3 的字符串将具有索引 0、1 和 2 的字符。\n\n如前所述，我们可以使用 for 循环、length 属性和 charAt()\
    \ 方法逐字符地遍历字符串，如图 5.3（对面）所示。\n\n![image](img/563dcadf5ae68219c0c3dfb03c7cc823_81_0.png)\n\
    \n### 活动 5.9\n\n在这个活动中，我们要你编写一个程序，从用户读取一个字符串并输出字符，每个字符后面跟一个星号。例如，如果用户输入字符串 hello，输出将是：\n\
    \nh*e*l*l*o*\n\n我们已经为你提供了一个名为 Activity_7.5.9 的程序模板。在 Notepad 中打开此文件，并在我们指示的位置插入你的代码。通过使用几个不同的字符串运行程序来测试你的程序。\n\
    \n![image](img/563dcadf5ae68219c0c3dfb03c7cc823_82_0.png)\n\n**图 5.3** 使用 **for**\
    \ 循环逐字符处理字符串。\n\n### 讨论\n\n这是我们的代码：\n\n```\nvar myString;\nmyString = window.prompt('Please\
    \ enter a string','');\n//Remember - the arguments to charAt() start at 0, not\
    \ 1\nfor (var count = 0; count < myString.length; count = count + 1)\n{\n    document.write(myString.charAt(count)\
    \ + '*')\n}\n```\n\n你是否记得同时使用点表示法与 `length` 和 `charAt()`？\n\n你会在 Solution_7.5.9\
    \ 中找到一个可用的解决方案。\n\n![image](img/563dcadf5ae68219c0c3dfb03c7cc823_83_0.png)\n\n\
    ### 活动 5.10\n\n这是来自 Program_7.5.10 的代码。\n\n```\nvar word, letter;\nword = window.prompt('Please\
    \ enter a word','');\nfor (var count = 0; count < word.length; count = count +\
    \ 1)\n{\n    letter = word.charAt(count);\n    if (letter == 'e')\n    {\n   \
    \     document.write('*')\n    }\n    else\n    {\n        document.write(letter)\n\
    \    };\n}\n```\n\n注意在 for 循环中使用了 if 语句。还要注意我们的缩进，以显示代码的结构。\n\n(a) 想想几个长度不同的单词，写下你认为当输入这些单词时\
    \ Program_7.5.10 的输出结果是什么。运行 Program_7.5.10 并检查你是否正确。\n\n(b) Activity_7.5.10 包含\
    \ Program_7.5.10 的副本。在 Notepad 中打开此文件，并修改程序，使其不执行 (a) 部分的操作，而是显示输入单词中字母 e 出现的次数。\n\
    \n### 讨论\n\n(a) Program_7.5.10 从用户读取一个单词，并显示该单词，任何出现的字母 e 被替换为星号。\n\n(b) 这是我们的代码。\n\
    \n```\nvar word, total;\nword = window.prompt('please enter a word','');\ntotal\
    \ = 0;\nfor (var count = 0; count < word.length; count = count + 1)\n{\n    if\
    \ (word.charAt(count) == 'e')\n    {\n        total = total + 1\n    }\n};\ndocument.write('The\
    \ number of occurrences of e in the word ' + word + ' is ' + total)\n```\n\n注意我们在\
    \ `if` 语句中直接使用 `word.charAt(count)` 以避免需要变量 `letter`。\n\n你会在 Solution_7.5.10 中找到一个可用的解决方案。\n\
    \n### 自我评估题 5.3\n\n(a) 决定在程序中使用 while 循环还是 for 循环时，你会考虑什么因素？\n\n(b) for 循环中的循环控制语句的三个部分是什么？\n\
    \n(c) 当控制 while 循环的条件评估为 false 时，会发生什么？\n\n(d) 你必须在 while 循环的正文中始终包含什么？\n\n###\
    \ 自我评估题 5.3 的答案\n\n(a) 如果你事先知道需要多少重复次数，你可能会使用 for 循环，但如果不知道，你就需要使用 while 循环。\n\
    \n(b) 三个部分是：\n- 计数器变量的声明和初始化；\n- 指定计数器结束值的条件；\n- 递增或递减计数器的语句。\n\n(c) 程序跳转到 while\
    \ 循环正文之后的语句（如果有的话）。\n\n(d) 一条或多条语句，最终会导致控制条件评估为 false。\n\n条件语句（如 if 语句）、while\
    \ 语句和 for 语句都是**控制结构**的一种，之所以称为控制结构，是因为它们控制程序的执行流程，即语句执行的顺序。这种依赖于布尔条件评估的执行流程，通常称为**控制流**。\n\
    \n## 5.3 小结\n\n在本节中，我们讨论了 for 语句的使用，它使用计数器来控制一系列语句的执行次数。\n\n我们复习了字符串对象的 charAt()\
    \ 方法，并向你介绍了字符串属性 length。\n\n## 6 单元总结\n\n在本单元中，我们向你介绍了 JavaScript 编程。\n\n在第 2\
    \ 节中，我们考虑了顺序执行、简单输入和输出，并介绍了变量和赋值的重要概念。我们讨论了一些数据类型及其相关的运算符。第 3 节研究了 `if...else`\
    \ 语句，这是一种用于选择程序结构的语句。在第 4 和第 5 节中，我们考虑了两种用于重复的结构：第 4 节中的条件控制 `while` 语句，以及第 5\
    \ 节中的计数器控制 `for` 语句。\n\n在第 8 单元中，我们将探讨更复杂的数据类型，并讨论如何开始将编程任务分解为子任务。\n\n### 6.1\
    \ 学习目标\n\n在学习完本单元后，你应该能够实现以下学习目标。\n\n- 运行给定的程序。（从活动 2.1 开始）\n- 读取和修改源代码。（从活动 2.2\
    \ 开始）\n- 使用 `document.write()` 显示输出。（从活动 2.2 开始）\n- 声明变量，并为其赋值。（第 2.2 节；自我评估题\
    \ 2.6；活动 2.7，从活动 3.1 开始）\n- 理解使程序代码对人类读者易读的重要性。（练习 2.4）\n- 使用 `window.prompt()`\
    \ 从用户获取程序输入。（从活动 2.6 开始）\n- 使用 `parseFloat()` 将数字字符串转换为数字。（自我评估题 2.13；从活动 2.9\
    \ 开始）\n- 理解和使用布尔值和比较运算符。（自我评估题 3.1、3.2；活动 3.1、3.2）\n- 理解和使用 `if` 语句。（活动 3.3、3.4）\n\
    - 理解和使用 `if...else` 语句。（自我评估题 3.5；练习 3.2；活动 3.5、3.6、3.7、3.8）\n- 在程序中输入适当的注释。（活动\
    \ 3.8）\n- 使用布尔运算符。（自我评估题 3.6、3.7；练习 3.3、3.4）\n"
