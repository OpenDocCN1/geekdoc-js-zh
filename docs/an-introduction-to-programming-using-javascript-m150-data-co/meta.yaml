    \ www.ouw.co.uk，或联系开放大学全球部，Michael Young Building, Walton Hall, Milton Keynes\
    \ MK7 6AA, United Kingdom索取手册。电话：+44 (0)1908 858785；传真：+44 (0)1908 858787；电子邮箱：ouwenq@open.ac.uk\n\
    \n开放大学，Walton Hall，米尔顿凯恩斯，MK7 6AA\n\n首次出版于2004年。2004年重印，附有更正\n\n版权所有 © 2004 开放大学\n\
    \n保留所有权利。未经出版商书面许可或版权许可机构有限公司的许可，不得以任何形式或任何方式（电子、机械、影印、录制或其他方式）复制、存储于检索系统中、传输或利用本出版物的任何部分。此类许可（用于影印复制）的详细信息可从版权许可机构有限公司获取，地址：90\
    \ Tottenham Court Road, London W1T 4LP。\n\n由开放大学编辑、设计和排版。\n\n由Alden Group，牛津，在英国印刷。\n\
    \nISBN 0 7492 5764 4\n\n1.2\n\n182350B/m150b2u7i.2\n\n## 目录\n\n1.  导论 **5**\n\
    \    - 关于学习第7-10单元的重要信息 **6**\n2.  入门 **7**\n    - 2.1 第一个程序 **7**\n    - 2.2\
    \ 变量和顺序执行 **11**\n        - 分号和顺序执行 **13**\n        - 变量命名 **16**\n    - 2.3 一些有用的数据类型\
    \ **18**\n    - 2.4 运算符 **19**\n        - 数字上的运算符 **19**\n        - 优先级 **19**\n\
    \        - 字符串上的二元运算符 **20**\n    - 2.5 从用户获取数据并显示结果 **21**\n        - 获取数字作为输入\
    \ **24**\n        - 输出数字 **25**\n    - 2.6 一些复习题 **28**\n    - 2.7 总结 **29**\n\
    3.  用于选择的编程：if语句 **30**\n    - 3.1 布尔值和比较运算符 **30**\n    - 3.2 简单条件语句 **34**\n\
    \        - if语句 **34**\n        - 测试程序 **37**\n        - if...else语句 **39**\n\
    \        - if...else语句的语法 **40**\n    - 3.3 条件语句和复合语句 **43**\n        - 通过使用注释提高可读性\
    \ **45**\n        - 编写具有选择结构的程序的提示 **45**\n    - 3.4 更复杂条件语句简介 **47**\n      \
    \  - 复合布尔表达式 **47**\n        - 嵌套条件语句 **49**\n    - 3.5 总结 **53**\n4.  用于重复的编程：while语句\n\
    \    - 4.1 while语句（循环）简介\n        - while语句的语法\n    - 4.2 while循环的进一步示例\n    \
    \    - 编写带有while循环的程序的提示\n    - 4.3 关于字符串的更多内容\n    - 4.4 总结\n5.  用于重复的编程：for语句\n\
    \    - 5.1 for语句（循环）简介\n        - for循环的语法\n        - 编写带有for循环的程序的提示\n    - 5.2\
    \ 字符串和for循环\n    - 5.3 总结\n6.  单元总结\n    - 6.1 学习成果\n        - 关键术语\n\n本单元由Judith\
    \ Segal为课程团队编写。\n\n## 1 导论\n\n本单元旨在向您介绍编写自己的计算机程序。具体来说，我们的目标是向您介绍：\n\n- 编写代码以从用户读取数据，执行一些简单处理并显示结果；\n\
    \n- 在高级语言中进行顺序、选择和重复编程，具体包括：\n    - 如何通过评估某个条件来实现程序代码片段的条件执行；\n    - 如何实现程序代码片段的重复执行，要么在特定条件为真时执行，要么执行指定次数。\n\
    \n您将使用一种广泛可用的高级编程语言，称为JavaScript。我们为您提供了一小组程序供您运行、修改和实验，您也将从头开始编写自己的小程序。\n\nJavaScript与Java不同。尽管JavaScript代码看起来有点像Java，并且这两种语言经常一起使用以生成基于网络的应用程序，但除此之外它们并无关联。\n\
    \n您应该已经从第6单元知道，在编程中，我们使用一种形式语言与机器通信。如果不严格遵守该语言的规则，即其**语法**，您的程序将无法运行或无法按预期运行。不得不寻找错误——通常称为“bug”——可能是一次非常令人沮丧的经历。\n\
    \n> 您可以将语言的语法视为其语法结构。\n\n编程语言也有词汇和意义——就像自然（口头）语言一样。\n\n我们已经为本单元的所有活动提供了可运行的代码，作为最后的手段，您可以查看并自行运行它们。然而，学习编程有点像学习骑自行车：如果您只是观察别人所做的，您的学习将极其有限。为了真正理解如何编程，您必须编写自己的程序（尽管我们会提供一点帮助）。\n\
    \n请不要因为犯错而气馁。许多人发现，犯错、找出错误原因并纠正错误的过程，构成了一个非常有价值——甚至令人愉快的——学习经历。您可能会发现，记录下您犯的任何错误以及如何纠正它，对您将来参考会有所帮助。\n\
    \n除了语法，编程语言还有保留字，有时称为**关键字**，即在特定编程语言中具有特殊含义的词（您可以将保留字视为该语言词汇或字典的一部分）。许多编程语言使用的保留字看起来像英语（例如\
    \ while, for 和 if）。但要注意：这些词在编程语言中的含义可能与其英文对应词并不完全匹配。我们将在遇到这些词时解释它们在编程语言中的含义（**语义**）。\n\
    \n我们需要在此指出，JavaScript区分大小写。这意味着，例如，JavaScript解释器将 If, IF 和 if 视为不同的。JavaScript中的所有保留字都是小写的，即它们没有大写字母。\n\
    \n编写一个行为完全符合您期望的程序，可以是一种极其令人满足、有益且富有创造性的体验。现在是向您介绍这种体验的时候了。\n\n### 关于学习第7-10单元的重要信息\n\
    \n在学习本单元时，您需要经常使用计算机，因为它包含大量实践活动。在进行活动时，您需要手边备有《第2单元软件指南》以供参考。\n\n《第2单元软件指南》不仅告诉您如何查找和运行我们提供的程序，还告诉您如何查看并可能修改程序**源代码**，即构成程序的JavaScript语句集。它还包含JavaScript语法的摘要，您可能会觉得这很有帮助。\n\
    \n在进一步学习之前，您应该阅读《第2单元软件指南》中题为“使用JavaScript程序”的部分。\n"
