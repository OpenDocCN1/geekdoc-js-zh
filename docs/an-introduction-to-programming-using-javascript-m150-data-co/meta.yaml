  - "[PAGE 80]\n\n# 5.2 Strings and for loops\n\nIn Section 4, you met the concept\
    \ of a string as an object and the string method `charAt()` which returns the\
    \ character at the specified position in the string (starting at index 0).\n\n\
    In addition to being associated with methods, which define their behaviour, objects\
    \ are associated with **properties**, which hold information related to their\
    \ structure and state (value). String objects have one such property called `length`\
    \ which, as you might guess, holds the number of characters in the string. The\
    \ existence of the `length` property, coupled with the fact that we can access\
    \ characters at particular positions in the string using `charAt()`, means that\
    \ `for` loops are ideally suited for processing the characters in a string. You\
    \ will see some examples of this later in this section. First we explain how to\
    \ use the `length` property.\n\n# ACTIVITY 5.8\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_80_0.png)\n\
    \n**The following code is from Program_7.5.8. It repeatedly prompts the user to\
    \ enter a string, and displays its length until the user enters a terminating\
    \ string, end.**\n\n```\nvar myString; // string entered by user\n\n// initialise\
    \ myString to an empty string\nmyString = '';\nwhile (myString != 'end')\n{\n\
    \    myString =\n        window.prompt('Please input a string; enter end to finish','');\n\
    \    document.write('The length of ' + myString + ' is ' +\n                 \
    \ myString.length + '<BR>')\n};\ndocument.write('Thank you')\n```\n\n**Note that\
    \ the ‘dot’ notation (`myString.length`) is used to indicate a property associated\
    \ with an object.**\n\n**Think of some strings of different lengths and kinds,\
    \ including the empty string and some strings that contain spaces. Write down\
