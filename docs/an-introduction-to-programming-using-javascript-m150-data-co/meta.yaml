    \ extensions but we have omitted them in the text.\n\n## Discussion \n\nRemember\
    \ that JavaScript has to be run from within a browser. So the JavaScript code\
    \ must be contained in a file with suitable HTML code to tell the browser to open\
    \ a window, as in the example above. Such a file must have `.html` at the end\
    \ of its name (have the **file extension** .html, to use the jargon), so that\
