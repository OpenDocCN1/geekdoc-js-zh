- md: "## The syntax of a for loop\n\n```\nfor (declare and initialise counter;\n\
    \     test value of counter;\n     change value of counter)\n{\n    statement(s)\n\
    }\n```\n\nPoints to note:\n\n- The use of the semicolons as separators.\n- It\
    \ is not mandatory to declare the loop counter within the for statement - it could\
    \ be declared along with other variables at the start of the program. However,\
    \ in M150 we follow the convention in the syntax above, as this makes clear the\
    \ special purpose of the variable.\n- The body of the for loop can consist of\
    \ several statements separated by semicolons, and wrapped together into a single\
    \ compound statement by means of curly braces.\n\nThe effect of a for loop is\
    \ shown in Figure 5.2.\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_75_0.png)\n\
    \n## SAQ 5.1\n\nSuppose that a for statement is used for a programming task that\
    \ involves six iterations.\n\n(a) How many times will the initialisation part\
    \ of the for loop be executed?\n\n(b) How many times will the Boolean condition\
    \ be evaluated?\n\n(c) How many times will the statement changing the value of\
    \ the counter be executed?\n\n## Answer to SAQ 5.1\n\n(a) Once. The counter is\
    \ only initialised once regardless of the number of iterations.\n\n(b) Seven times.\
    \ The condition will need to evaluate to `true` six times, once for each iteration\
    \ of the code in the body of the `for` loop; on the seventh attempt it will evaluate\
    \ to `false`.\n\n(c) Six times. The statement to increment or decrement the value\
    \ of the counter is executed at the end of each iteration.\n\n## ACTIVITY 5.4\n\
    \n**Here is the code from Program_7.5.4.**\n\n```\nfor (var line = 1; line <=\
    \ 6; line = line + 1)\n{\n    document.write('I must pay attention in class' +\
    \ '<BR>');\n};\ndocument.write('\\'I\\\\'ve finished!\\'')\n```\n\n**What do you\
    \ think the output will be?** Run Program_7.5.4 to find out.\n\n## Discussion\n\
    \nThe program will display six times, on separate lines:\n\n```\nI must pay attention\
    \ in class\n```\n\nand then `I've finished!` on a new line.\n\nNote that in this\
    \ example the value of the counter variable `line` is needed simply to keep track\
    \ of the number of iterations. In our earlier examples the value of the counter\
    \ was used by the code in the body of the loop as well.\n\n## ACTIVITY 5.5\n\n\
    **The following code is from Program_7.5.5.**\n\n```\nfor (var count = 1; count\
