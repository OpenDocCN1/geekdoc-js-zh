    \ 并记录你的结果：**\n\n- (a) 第一个值为 3，第二个值为 5。\n- (b) 第一个值为 117，第二个值为 32。\n- (c) 两个值都为\
    \ 2。\n- (d) 你认为符号 `<` 和 `<=` 表示什么？\n\n## 讨论\n\n(a) 输出应为：\n\n```\nIt is true that\
    \ 3 < 5\nIt is true that 3 <= 5\n```\n\n布尔表达式 `(a < b)` 在数字 `a` 小于数字 `b` 时被评估为真；否则，它被评估为假。\n\
    \n布尔表达式 `(a <= b)` 在数字 `a` 小于数字 `b` 或数字 `a` 等于数字 `b` 时被评估为真；否则，`(a <= b)` 的值被评估为假。\n\
