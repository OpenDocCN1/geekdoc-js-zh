- md: "- What condition do you want to control the repetition of the loop body?\n\
    - What do you want to happen for each execution of the loop body? Does the body\
    \ contain a statement or statements which will eventually cause the condition\
    \ to evaluate to false? (If not, your program will go into an infinite loop.)\n\
    - Do you want any statements to be executed after the loop?\n\n## 4.3 More about\
    \ strings\n\nIn the examples above, you have seen the repeated processing, using\
    \ a while loop, of a succession of strings and of a succession of numbers. We\
    \ now consider the repeated processing of a succession of characters within a\
    \ string.\n\nFirst, you need to find out a bit more about strings. In JavaScript,\
    \ strings are object types and, as with other JavaScript objects, they have a\
    \ number of methods associated with them. We start by discussing one such method,\
    \ charAt().\n\n> You have already met the object types Document and Window with\
    \ associated methods write() and prompt(), respectively.\n\n### ACTIVITY 4.6\n\
    \nThe aim of this activity is to introduce you to the method charAt() associated\
    \ with string objects.\n\nThe following code is from Program_7.4.6.\n\n```\nvar\
    \ myString;\n\nmyString = window.prompt('Please enter a string with exactly 5\
    \ characters','');\ndocument.write('You have chosen the following word '\n   \
    \            + myString + '<BR>');\ndocument.write('The character in the first\
    \ position is '\n               + myString.charAt(0) + '<BR>');\ndocument.write('The\
    \ character in the fifth position is '\n               + myString.charAt(4) +\
    \ '<BR>')\n```\n\n- (a) Think of a string with exactly five characters. Can you\
    \ guess what the output from the program would be if you entered this string?\
    \ Run the program and find out whether you were right.\n\n(b) What do you think\
    \ myString.charAt(n) does, where n is some number?\n\n### Discussion\n\n- (a)\
    \ The output will be the specified output strings in the last two lines of the\
    \ code, together with the first and last characters from the input string. For\
    \ example, if the word input had been hello, the output would have been:\n\nYou\
    \ have chosen the following word hello\nThe character in the first position is\
    \ h\nThe character in the fifth position is o\n\n(b) You might have guessed from\
    \ our use of the numbers 0 and 4 to output the first and fifth characters in the\
    \ string that myString.charAt(n) will return the character in the position after\
    \ n in the string myString. The characters in a JavaScript string are numbered\
    \ (we say indexed) from 0 to one less than the number of characters. So myString.charAt(0)\
    \ returns the character that is the first in the string assigned to the variable\
    \ myString (starting from the left); myString.charAt(4) returns the character\
    \ in the fifth position from the left.\n\nYou may recall from Unit 6 that locations\
    \ in a computer's main memory are also numbered from 0 rather than 1. Numbering\
    \ from zero is something commonly found in the world of computers.\n\n### SAQ\
    \ 4.4\n\nWrite a JavaScript statement, similar to the ones above, which will output\
    \ the third character from the left in a string assigned to the variable myString.\n\
    \n### Answer to SAQ 4.4\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_67_0.png)\n\
    \n### ACTIVITY 4.7\n\nActivity_7.4.7 contains a copy of Program_7.4.6. Open the\
    \ file in Notepad and add the following line at the end of the JavaScript code.\n\
    \n```\ndocument.write('The character in the last position is ' + myString.charAt(5)\
    \ + '<BR>')\n```\n\nRun the program, inputting a string of five characters as\
    \ before. What happens, and why?\n\n### Discussion\n\nThe last line of output\
    \ will be `The character in the last position is ` (with a blank). This is because\
    \ myString.charAt(5) returns the character in the sixth position - and you have\
    \ only entered five characters.\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_67_1.png)\n\
    \n### ACTIVITY 4.8\n\nIn this activity you are going to write a program which\
    \ searches a word for a particular letter, in this case e, and writes out its\
    \ position in the string. So, for example, if you input the word 'tea', the following\
    \ would be displayed.\n\n```\nThe first occurrence of letter e is in position\
    \ 2 in the word tea\n```\n\nYou may assume that there is at least one occurrence\
    \ of e in the string. The file Activity_7.4.8 contains an HTML template for a\
    \ JavaScript program. Open the file with Notepad and include your JavaScript code,\
    \ then test it with some words which contain e.\n\nWarning If you test your code\
    \ with a word that does not contain an e, the program will go into an infinite\
    \ loop, as described in Exercise 4.1. If this happens you will need to press <Ctrl><Q>\
    \ or use the Windows task manager to stop your browser running.\n\nThinking about\
    \ the program\n\nBefore you start writing your code, it might help to ask yourself\
    \ the following questions.\n\n- (a) You need to go from letter to letter, testing\
    \ each one. Which JavaScript construct allows you to repeat processing for a number\
    \ of different values?\n(b) Which method allows you to consider individual letters\
    \ in a string?\n(c) How many variables will you need?\n(d) How will you initialise\
    \ the variable(s)?\n(e) How are you going to test whether a letter at a particular\
    \ location, indexed by a variable called, say, index, is not the letter e?\n(f)\
    \ If the letter in a particular location is not the letter e, what should happen\
    \ to the value of index?\n(g) If a letter in a particular location is the letter\
    \ e, what do you need to display?\n\nHaving answered these questions, write the\
    \ program.\n\n### Discussion\n\n- (a) The construct you need is a while loop.\n\
    (b) charAt() returns the character in the location specified by the number in\
    \ the argument, i.e. the number enclosed within parentheses. Remember that the\
    \ numbering starts with 0, rather than 1.\n(c) You need a variable to hold the\
    \ string, called for example myWord, and also a variable to hold the current value\
    \ of the location called index.\n(d) The value of myWord is initialised using\
    \ window.prompt(); index is initialised to be in the first position, which is\
    \ indexed 0 (not 1!).\n(e) The test is (myWord.charAt(index) != 'e').\n(f) If\
    \ the test succeeds, i.e. a letter in the current location is not e, you want\
    \ to consider the letter in the next location and advance index by 1, using index\
    \ = index + 1.\n(g) Because JavaScript considers the position of a character in\
    \ a string to be one less than the usual convention for humans, we need to add\
    \ 1 to index to give a more meaningful position in the output.\n\nHere is our\
    \ code.\n\n```\nvar myWord, index;\n\nmyWord = window.prompt('Please enter a word\
    \ which has an e in it','');\nindex = 0;\n/***************************************************/\n\
    /* The loop goes from letter to letter stopping when it reaches   */\n/* the letter\
    \ e                                           */\n/***************************************************/\n\
    while (myWord.charAt(index) != 'e')\n{\n    index = index + 1\n};\n/***************************************************/\n\
    /* Once an e has been located, the program skips to the          */\n/* instruction\
    \ following the body of the loop, which adds one    */\n/* to index to compensate\
    \ for the fact that the first character  */\n/* is at position 0 rather than 1\
    \                                */\n/***************************************************/\n\
    document.write('The first occurrence of letter e is in position '\n          \
    \   + (index + 1) + ' in ' + myWord)\n```\n\nYou will find a working solution\
    \ in Solution_7.4.8.\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_69_0.png)\n\n\
    ### ACTIVITY 4.9\n\nThe aim of this activity is to extend the program from Activity\
    \ 4.8 so that it works with any letter, not just the letter e. The program should\
    \ prompt the user to enter first their chosen letter, then a word with that letter\
    \ in it. The position of the first occurrence of that letter in the given word\
    \ is then displayed, as in Activity_7.4.8.\n\nThe file Activity_7.4.9 contains\
    \ a copy of the correct code for Activity 4.8, which you should modify so that\
    \ the program works as specified.\n\n### Discussion\n\nHere is our code.\n\n```\n\
    var letter, myWord, index;\n\nletter = window.prompt('Please enter your chosen\
    \ letter','');\nmyWord = window.prompt('Please enter a word which has a(n) ' +\
    \ letter + ' in it','');\nindex = 0;\nwhile (myWord.charAt(index) != letter)\n\
    {\n    index = index + 1\n};\ndocument.write('The first occurrence of letter '\
    \ + letter\n             + ' is in position ' + (index + 1) + ' in ' + myWord)\n\
    ```\n\nYou will find a working solution in Solution_7.4.9."
  mdcn: "\n- 你想要控制循环体重复的条件是什么？\n- 对于循环体的每一次执行，你想要发生什么？循环体是否包含某个语句或语句组，最终会导致条件评估为假？（如果不是，你的程序将陷入无限循环。）\n\
    - 你是否希望在循环之后执行任何语句？\n\n## 4.3 关于字符串的更多内容\n\n在上文中，您已经看到了对一系列字符串和一系列数字的重复处理，使用了\
    \ while 循环。我们现在考虑对字符串内部的一系列字符进行重复处理。\n\n首先，你需要了解更多关于字符串的知识。在 JavaScript 中，字符串是对象类型，与其他\
