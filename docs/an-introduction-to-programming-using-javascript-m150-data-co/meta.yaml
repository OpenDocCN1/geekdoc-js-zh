  md: 'There is nothing special about the name `myVar`; we could have chosen some
    other name.


    In the first line, **var** is a reserved word (also known as a keyword). The line
    `var myVar` is the **declaration** of a variable with name `myVar`, i.e. the program
    is told to use `myVar` as the name for a location in the computer''s memory where
    some data will be stored, as illustrated in Figure 2.2. The question mark indicates
    that `myVar` doesn''t yet have a value.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_13_0.png)


    **Figure 2.2** Declaring a variable with name `myVar`


    The second line assigns a value of 3 to `myVar`, i.e. puts the value 3 in the
    memory location labelled `myVar`.

    The **symbol =** in JavaScript is called the **assignment operator**: any value
    on the right of the = symbol, 3 in this case, is assigned to the variable named
    on the left, as in Figure 2.3.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_13_1.png)


    **Figure 2.3** Assigning the value 3 to `myVar`


    The third line writes the current value of `myVar` into the browser''s current
    page. Notice that `myVar` is not enclosed in quotes, as we want to display the
    *value* of the variable called `myVar`, not the text `myVar`, as shown in Figure
    2.4.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_13_2.png)


    **Figure 2.4** The effect of `document.write(myVar)`'
