    \ as a positive number is input.\n\n```\nvar myVar;\n\nmyVar = window.prompt('Enter\
    \ a positive number','');\nwhile (myVar <=0)\n{\n    myVar = window.prompt('Please\
    \ enter a POSITIVE number','')\n};\ndocument.write('The positive number is ' +\
    \ myVar)\n```\n\n## 4.2 Further examples of while loops\n\nIn the examples above,\
    \ the while loops acted as input guards, i.e. they required you to repeatedly\
    \ input data values until an acceptable value was input. Another common use for\
    \ while loops is in programs where some sort of repeated processing on a succession\
    \ of data values is required, e.g. adding up the cost of all the items on a shopping\
    \ list. In this sort of scenario, you don't generally know in advance how many\
    \ data items there will be, so there needs to be some terminating value, which\
    \ indicates to the program that there are no more items, as in Figure 4.4. This\
    \ special terminating value is sometimes called a **sentinel**.\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_61_0.png)\n\
    \n## ACTIVITY 4.3\n\nThe purpose of this activity is for you to write a program\
    \ where the user inputs strings one at a time, and the computer displays the strings\
    \ on a single line separated by spaces. The processing continues until the user\
    \ enters halt. The computer then displays **Thank you** on a new line.\n\n**For\
    \ example, suppose the following seven strings were input:**\n\n**Hello!, nice,\
    \ to, interact, with, you, halt**\n\n**The display would be as follows.**\n\n\
    ```\nHello! nice to interact with you\nThank you\n```\n\nThe file Activity_7.4.3\
    \ contains an HTML template for a JavaScript program. Open the file in Notepad\
    \ and add your program code. Test the program using some sequences of strings.\n\
    \n### Thinking about the program\n\nThe program reads in each word and processes\
    \ it, until it comes to the sentinel (stopping value), which is the string 'halt'.\
    \ The processing consists of displaying each string followed by a space, and then\
    \ reading in the next string. When the sentinel is reached, **Thank you** is displayed\
    \ on a new line.\n\nProgramming for repetition: the while statement\n\n### Writing\
    \ the program\n\n- How many variables do you need to hold the input data? Declare\
    \ it/them.\n- Write a JavaScript statement to read in the first data value.\n\
    - What is the sentinel (stopping value) of the while loop?\n- What test has to\
    \ be carried out on each data value to determine whether it is the sentinel? Write\
    \ the condition for the while loop.\n- What processing has to be done on each\
    \ non-sentinel value? Write the body of the while loop.\n- What processing has\
    \ to be done after the sentinel is reached? Finish writing the program.\n- Run\
    \ and test the program.\n\n### Discussion\n\n## SAQ 4.3\n\nHow would you change\
    \ the code from Activity 4.3 so that the sentinel is the word stop rather than\
    \ the word halt?\n\n## Answer to SAQ 4.3 ✓\n\nChange the condition of the while\
    \ loop as follows:\nwhile … != \"stop\" …\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_63_0.png)\n\
    \n## ACTIVITY 4.4\n\nThe following code is from Program_7.4.4 (with line numbers\
    \ for reference).\n\n```\n(1) var total, nextNumber;\n(2) total = 0;\n(3) document.write('The\
    \ current value of the total is ' + total + '<BR>');\n(4) nextNumber = window.prompt('Please\
    \ enter a positive number, any negative number to stop','');\n(5) nextNumber =\
    \ parseFloat(nextNumber);\n(6) while (nextNumber >= 0)\n(7) {\n(8) document.write('Adding\
    \ the new value of ' + nextNumber + '<BR>');\n(9) total = total + nextNumber;\n\
    (10) document.write('The current value of the total is ' + total + '<BR>');\n\
    (11) nextNumber = window.prompt('Please enter a positive number, any negative\
    \ number to stop','');\n(12) nextNumber = parseFloat(nextNumber)\n(13) };\n(14)\
    \ document.write('The total sum of your numbers is ' + total)\n```\n\n**Note that\
    \ the output statements in lines (3), (8) and (10) are designed to show you the\
    \ values of the variable total as the program executes. Including additional output\
    \ statements is a useful way of tracing through your programs (like an automated\
    \ version of the trace tables introduced in Unit 6).**\n\n**(a) Write down what\
    \ you think the outputs will be when you input the numbers 3, 6, 4, -5 successively\
    \ into the program. Run Program_7.4.4 and see whether you were correct. Briefly\
    \ explain what Program_7.4.4 does.**\n\n**(b) Activity_7.4.4 contains a copy of\
    \ Program_7.4.4. Open it in Notepad and insert // at the start of the lines which\
    \ we’ve labelled (4) and (5) above. (This has the effect of telling JavaScript\
    \ to treat these lines as comments, so that they will not be evaluated and is\
    \ equivalent to deleting the lines.) Now save the file. What do you expect will\
    \ happen when you run Activity_7.4.4? Run the program with the same inputs as\
    \ in part (a) to check whether you were correct.**\n\n(c) Again, open Activity_7.4.4\
    \ in Notepad. This time delete // from the start of lines (4) and (5), but comment\
    \ out line (2) by inserting // at the beginning of the line. Save the file. What\
    \ do you expect to happen when you run Activity_7.4.4 this time? Run it with inputs\
    \ of 3, 6 and -5, and find out.\n\n### Discussion\n\n(a) The output should be\
    \ as follows.\n\n```\nThe current value of the total is 0\nAdding the new value\
    \ of 3\nThe current value of the total is 3\nAdding the new value of 6\nThe current\
    \ value of the total is 9\nAdding the new value of 4\nThe current value of the\
    \ total is 13\nThe total sum of your numbers is 13\n```\n\nThe program adds up\
    \ a succession of positive numbers entered by the user. It displays the total\
    \ when a negative number is entered.\n\nThe first line is the output from line\
    \ (3) of the code.\n\nYou input 3 in response to line (4).\n\nThe test in line\
    \ (6) evaluates to `true`, so the body of the loop is executed. The values of\
    \ the new number entered and the new total are displayed, and you are asked to\
    \ input another number.\n\nIn response to line (11), you input 6.\n\nExecution\
    \ returns to line (6). The condition still evaluates to `true`, so the body is\
    \ executed again, resulting in the display of the next number input and the total;\
    \ then you are asked to input another number.\n\nIn response to the input of 4,\
    \ the loop body is executed once more and you input -5.\n\nExecution returns to\
    \ line (6). Now the test evaluates to `false` (as -5 is not greater than or equal\
    \ to 0), so execution skips the body of the `while` loop and continues with line\
    \ (14), giving the final display.\n\n(b) You should get the following output.\n\
    \n```\nThe current value of the total is 0\nThe total sum of your numbers is 0\n\
    ```\n\nIf lines (4) and (5) are deleted, no value is assigned to `nextNumber`\
    \ and so, when the condition is tested at line 6, JavaScript cannot compare it\
    \ with 0, as required. In this situation JavaScript simply returns `false`. Hence\
    \ the body of the `while` loop is skipped, and line (14) executed (with total\
    \ having the value assigned to it in line (2), i.e. 0).\n\n(c) With inputs of\
    \ 3, 6 and -5, you should get the following output.\n\n```\nThe current value\
    \ of the total is undefined\nAdding the new value of 3\nThe current value of the\
    \ total is NaN\nAdding the new value of 6\nThe current value of the total is NaN\n\
    The total sum of your numbers is NaN\n```\n\nIf line (2), which initialises the\
    \ variable total, is deleted, the value of total is still undefined when line\
    \ (3) is executed; hence the first line of output. When, in line (9), JavaScript\
    \ tries to add a new value to this undefined variable, the current value of total\
    \ is displayed as above.\n\nRemember that NaN is JavaScript's abbreviation for\
    \ 'Not a Number'!\n\n## ACTIVITY 4.5\n\nActivity_7.4.5 contains a copy of Program_7.4.4.\
    \ Open it in Notepad and modify it so that it multiplies together all the positive\
    \ numbers you input, stopping when the sentinel 0 is input.\n\nHint Take care\
    \ with your initialisation.\n\n### Discussion\n\nHere is our solution. (You may\
    \ remember from studying mathematics at school or elsewhere that the result of\
    \ multiplying two or more numbers together is called their product.)\n\n```\n\
    var product, nextNumber;\n\nproduct = 1;\ndocument.write('The current value of\
    \ the product is '\n    + product + '<BR>');\n\nnextNumber = \n    window.prompt('Please\
    \ enter a positive number, 0 to stop','');\nnextNumber = parseFloat(nextNumber);\n\
    while (nextNumber != 0)\n{\n    document.write('Multiplying by ' + nextNumber\
    \ + '<BR>');\n    product = product * nextNumber;\n    document.write('The current\
    \ value of the product is ' + product\n                   + '<BR>');\n    nextNumber\
    \ = \n        window.prompt('Please enter a positive number, 0 to stop','');\n\
    \    nextNumber = parseFloat(nextNumber)\n};\ndocument.write('The product of your\
    \ numbers is ' + product)\n```\n\nNote that initialising product to 0 wouldn't\
    \ work as 0 multiplied by any other number will always give 0. You will find a\
    \ working solution in Solution_7.4.5.\n\n### Hints for writing programs with while\
    \ loops\n\n- Do you need any variables outside the loop to hold any data? If so,\
    \ declare it/them. (You will probably need at least one variable for use in the\
    \ condition which controls the loop.)\n- Do you want any statements to be executed\
    \ before the loop? (At the least, you may need to initialise the variable used\
    \ in the condition.)"
