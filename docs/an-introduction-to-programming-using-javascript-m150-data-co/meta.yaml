    \ 字符串中的字符是从 0 开始编号（我们称为索引），直到少于字符数量的前一个数字。所以 myString.charAt(0) 返回的是分配给变量 myString\
    \ 的字符串中第一个的字符（从左开始）；myString.charAt(4) 返回的是从左起第五个位置的字符。\n\n您可能还记得在第 6 单元中提到，计算机主存储器中的位置也是从\
    \ 0 开始编号而不是从 1 开始。从零开始计数在计算机世界中很常见。\n\n### 自评问题 4.4\n\n编写一个类似于上述的 JavaScript 语句，用于输出分配给变量\
    \ myString 的字符串中从左起的第三个字符。\n\n### 自评问题 4.4 的答案\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_67_0.png)\n\
    \n### 活动 4.7\n\n文件 Activity_7.4.7 包含 Program_7.4.6 的副本。在记事本中打开该文件，并在 JavaScript\
    \ 代码末尾添加以下行。\n\n```\ndocument.write('The character in the last position is ' +\
    \ myString.charAt(5) + '<BR>')\n```\n\n运行程序，像以前一样输入五个字符的字符串。发生了什么，为什么？\n\n###\
