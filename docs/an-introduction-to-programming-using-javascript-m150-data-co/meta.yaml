  md: '# # 4.4 Summary


    In this section, we discussed the while statement, often called a while loop,
    which enables you to repeat the execution of a sequence of statements, constituting
    the body of the loop, until some Boolean expression at the start of the loop evaluates
    to false. You saw how while loops can be used to guard against incorrect input
    by prompting the user to re-enter input until it is in the correct form, and also
    how they can be used to repeat execution until some stopping value (sentinel)
    is reached.


    We introduced the idea of a string as an object consisting of a number of characters,
    and you met the method charAt(), which returns the character at a particular location
    in the string determined by the argument to the method. We noted that the positions
    of characters in a string are numbered (indexed) from left to right, with the
    leftmost character having the index 0.'
