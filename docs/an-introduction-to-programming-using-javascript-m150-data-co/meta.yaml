  md: 'If you are unfamiliar with the ''greater than'' or ''less than'' symbols, it
    may help you to remember which way round they go if you bear in mind that the
    larger value goes at the open end of the <, the smaller value at the pinched end,
    i.e. (smaller < larger) is true.


    You should also recall from Unit 6 that if (c < d) is true, then (d > c) is true,
    and if (c <= d) is true, then (d >= c) is true.


    # SAQ 3.1


    Which of the comparison operators are binary operators?


    # Answer to SAQ 3.1


    They are all binary operators, as all of them operate on two values.


    # SAQ 3.2


    Determine whether the following comparisons (in JavaScript notation) evaluate
    to true or false.


    +   (a) (8 <= 2)

    (b) ((16 != (4*4)))

    (c) (16 != 8)

    (d) (8 == 8)

    (e) (16 == (4*4))


    # Answer to SAQ 3.2


    +   (a) false

    (b) true

    (c) true

    (d) true

    (e) true


    The above examples considered only numerical values, but we can use the comparison
    operators on any values which are ordered, i.e. when we can clearly decide which
    one comes before the other. For example, the letter a comes before the letter
    c in the alphabet, so (''a'' < ''c'') is true. (Remember that we need the quotes
    in JavaScript when dealing with strings, albeit strings with only a single character
    in this case.)


    Comparisons on strings consisting of all lower-case or all upper-case letters
    work by comparing the first letter in each string, then, if they are the same,
    the second letter in each string, and so on. This results in the same order as
    you would find in a dictionary. For example, (''aardvark'' < ''cat'') and (''cat''
    < ''cave'') are true, but (''cat'' < ''camel'') is false, because the first two
    letters match, but the third letter of ''cat'' comes after the third letter of
    ''camel''.


    We only consider the ordering of strings consisting of letters (both lower- and
    upper-case).


    For numeric strings a string beginning with ''1'' is considered to be ''less than''
    a string beginning with ''2'', which is ''less than'' a string beginning with
    ''3'', and so on.'
