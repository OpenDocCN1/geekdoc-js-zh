    # ## Discussion


    +   (a) You might have expected to get the output:


    The sum of 32 and 45 is 77


    (b) In fact, what you got was:


    The sum of 32 and 45 is 3245


    JavaScript will assume that both your inputs were strings, i.e. ''32'' and ''45'',
    and will therefore have understood + to be the concatenation operator.


    So if we want to read in and add two numbers, how do we do it? We use a **function**
    called `parseFloat()`, which takes a string as argument and provides as a result
    the number corresponding to the numeric part of the string. In programming, the
    result provided by the function is known as its **return value**. We say that
    the function returns some value.


    > A function is similar to a method but isn''t attached to any particular object.
    You will find out more about functions in Unit 8.


    You may think of `parseFloat()` as converting a suitable string into a number.
    For example,


    ```

    parseFloat(''3'') returns 3


    parseFloat(''10.25'') returns 10.25

    ```


    If we have two lines of code as follows:


    ```

    (1) myVar = window.prompt(''Enter a number'','''');

    (2) myVar = parseFloat(myVar)

    ```


    the digits entered will first be assigned as a string to `myVar` (in line (1))
    and then converted to a number and reassigned to `myVar` (in line (2)).


    # ### SAQ 2.13


    Suppose that the two lines of code above are executed and that, in response to
    the prompt, the user enters 77.


    +   (a) What is the value of `myVar` after execution of line (1)?

    (b) What is the value of `myVar` after execution of line (2)?


    # ### Answer to SAQ 2.13 ✓


    +   (a) ''77''; the input is initially read in as a string.

    (b) 77; in line (2) the function `parseFloat()` converts the string into a number.


    # ## Outputting numbers


    We said above that the argument to `document.write()` must be a string (which
    may be formed from the concatenation of several strings). So what happens when
    you want to output a number? There is no problem here: the method `write()` takes
    a number, 183 say, and automatically converts it to the string of numeric characters,
    ''183''.'
