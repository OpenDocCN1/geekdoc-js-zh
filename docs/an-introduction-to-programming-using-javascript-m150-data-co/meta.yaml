    - discuss how to transform input data into numbers, where appropriate.\n\n###\
    \ 2.1 First program\n\nJavaScript, as its name suggests, is a **scripting language**.\
    \ This means that programs written in JavaScript cannot be run on their own, but\
    \ have to be run within some application, such as a web browser. (Most high-level\
    \ programming languages are not scripting languages, and do not require an additional\
    \ application in which to run; they are simply compiled or interpreted as explained\
    \ in Unit 6.)\n\nYou will recall from Unit 6 that JavaScript is an interpreted\
    \ language. A browser such as Netscape, which has an embedded JavaScript interpreter,\
    \ takes your JavaScript statements and interprets them, i.e. it translates them\
    \ into machine code instructions and executes them instruction by instruction.\n\
    \n**ACTIVITY 2.1**\n\n**In this activity, you will run a program and study its\
    \ source code.**\n\n**(a) Run Program_7.2.1.**\n\n**You should see a browser window\
    \ opening on your screen with the following message:**\n\n`Welcome to programming!`\n\
    \n![563dcadf5ae68219c0c3dfb03c7cc823 8](img/563dcadf5ae68219c0c3dfb03c7cc823_8_0.png)\n\
    \n**M150 CD-ROM**\n\nThe Block 2 Software Guide tells you how to find, read and\
    \ run programs which we have supplied.\n\nIn this text, we use a different font\
    \ to distinguish JavaScript code from the remainder of the text.\n\n**(b) Now\
    \ use Notepad to read the source code of Program_7.2.1 (i.e. the instructions\
    \ that produced the output above).**\n\n**You should see the following.**\n\n\
    ```html\n<HTML>\n<HEAD>\n<TITLE> Program_7.2.1 First Program\n</TITLE>\n<SCRIPT\
    \ LANGUAGE = \"JavaScript\">\ndocument.write('Welcome to programming!')\n</SCRIPT>\n\
    </HEAD>\n<BODY>\n</BODY>\n</HTML>\n```\n\n## Discussion\n\nYou might recognise\
    \ most of these lines as HTML code, telling the browser to open a new window,\
    \ with 'Program_7.2.1 First Program' appearing in the title bar.\n\nThe lines:\n\
    \n`<SCRIPT LANGUAGE = \"JavaScript\">`\n\nand \n\n`</SCRIPT>`\n\ninform the HTML\
    \ system that the lines of code between them are not HTML instructions but are\
    \ written in a scripting language, in this case JavaScript. In fact, if no specific\
    \ language is specified HTML will assume that the code is JavaScript, so the first\
    \ of the HTML lines above could be replaced by\n`<SCRIPT>`.\n\nThere is only one\
    \ line of JavaScript in this program, the line which reads:\n\n```javascript\n\
    document.write('Welcome to programming!')\n```\n\nYou were introduced to HTML\
    \ in Unit 4.\n\nAll the other lines – those in angle brackets (< and >) – are\
    \ HTML. We do not intend to teach you any HTML in this unit, other than the lines\
    \ necessary to display the results of your JavaScript in a browser window.\n\n\
    The line of JavaScript code in Program_7.2.1 is the instruction to display the\
    \ text:\n\n`Welcome to programming!`\n\nLet us examine it in more detail.\n\n\
    - `document` is a kind of program structure called an **object**. Each type of\
    \ object in a programming language is associated with particular behaviour (the\
    \ things it can do). You may think of a `document` object as consisting of the\
    \ contents of the current page, which are displayed in a window opened by the\
    \ browser.\n- write() is a method associated with the document object, which enables\
    \ JavaScript to add text to the page which your browser will display. The 'dot\
    \ notation' (as in `document.write()`) tells the document object to execute the\
    \ code of its **write**()method.\n- The parentheses () enclose what is called\
    \ the **argument** of the method. It provides information that the method needs\
    \ to do its job, which, in this case, is the text to be displayed.\n\n### SAQ\
    \ 2.1. \n\n**What is the argument of the method ... in the program above?**\n\n\
    ### Answer to SAQ 2.1 ✓\n\nThe argument is 'Welcome to programming!' Note that\
    \ the text in the program statement must be enclosed in quotation marks. JavaScript\
    \ will accept either single or double quotes, but in M150 we will be using single\
    \ quotes.\n\nAll the JavaScript programs that you write in this unit will be preceded\
    \ and followed by similar lines of HTML. The only variation will be in the title\
    \ to be displayed on the title bar of your browser's current page when the program\
    \ is run, as in:\n\n`<TITLE> Whateveramental monitor display calibration document\
    \ image processing artifact correction display technology visual perception compensation\
    \ ` \n\n*(Note: This line appears to contain an error or placeholder text from\
