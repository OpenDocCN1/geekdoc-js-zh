    \ for the length of a line of asterisks to be displayed, such that, for example,\
    \ an input of 3 results in an output of `***`. Save your changes and run the program.\n\
    \n(c) Further amend Activity_7.5.5 so that as well as being prompted for the length\
    \ of the line, the user is also prompted for the character to be output (so that\
    \ it need not be *). Save your changes and run your program.\n\n(d) Further amend\
    \ Activity_7.5.5 so that, instead of a horizontal line of characters the program\
    \ outputs a vertical line. For example, an input of + for the character and 3\
    \ for the length will give the following output:\n```\n+\n+\n+\n```\nSave your\
    \ changes and run your program.\n\n## Discussion\n\n(a) The program displays six\
    \ asterisks in a line, i.e. `******`.\n\n(b) Here is our solution.\n\n```\nvar\
    \ length;\n\nlength = window.prompt('Please enter the length of your line','');\n\
    length = parseFloat(length);\nfor (var count = 1; count <= length; count = count\
    \ + 1)\n{\n    document.write('*')\n}\n```\n\nYou will find a working solution\
    \ in Solution_7.5.5(b).\n\n(c) The following amendments to the code are required:\n\
    \n- declare a variable to hold the chosen character, say `character`;\n- add the\
    \ following line before the for loop:\n  ```\n  character = window.prompt('Please\
    \ enter your chosen character','');\n  ```\n- change the body of the for loop\
    \ to:\n  ```\n  document.write(character)\n  ```\n\nYou will find a working solution\
    \ in Solution_7.5.5(c).\n\n(d) The body of the for loop above needs modifying\
    \ to include a line break after each character, as follows:\n```\ndocument.write(character\
    \ + '<BR>')\n```\n\nYou might also have replaced the variable length by one with\
    \ a name such as number, and modified the prompt to the user.\n\nYou will find\
    \ a working solution in Solution_7.5.5(d).\n\n## ACTIVITY 5.6\n\nThe file Activity_7.5.6\
    \ contains a partially completed program to calculate the average exam score for\
    \ a group of five students. For each student, the user is prompted to enter a\
    \ score and this score is added to the total so far. Once the scores for the five\
    \ students have been entered and totalled, the average score is calculated and\
    \ output. We have provided you with the code to calculate the average and display\
    \ it. You should add the code to prompt for and read in the scores, convert them\
    \ to numbers and add them to the total. Open Activity_7.5.6 and add your code\
    \ in the spaces indicated. Test your program by running it with several sets of\
    \ five scores.\n\n**If you have difficulty you might find the hints which follow\
    \ this activity helpful.**\n\n## Discussion\n\nHere is our completed code.\n\n\
    ```\nvar total;     // total of scores so far\nvar score;     // score for a single\
    \ student\nvar average;   // average score\n\n/* Insert code to initialise total\
    \ */\ntotal = 0;\n/* insert code for a for loop to read in and add the 5 student\
    \ scores to total */\n\nfor (var count = 1; count <= 5; count = count + 1)\n{\n\
    \    score = window.prompt('please enter next score','');\n    score = parseFloat(score);\n\
    \    total = total + score\n};\naverage = total / 5;\ndocument.write('average\
    \ score is ' + average + '<BR>')\n```\n\nDid you get your loop condition correct?\n\
    \nDid you remember to use `parseFloat()` to convert your input string into a number?\n\
    \nYou will find a working solution in Solution_7.5.6.\n\n## Hints for writing\
    \ programs with for loops\n\n- Do you need any variables outside the loop to hold\
    \ any data? If so, declare it/them.\n- Do you need any statements to be executed\
    \ before the loop?\n- In order to write the loop control statement (the top of\
    \ the for loop), you need to consider where you want the counter to start, where\
    \ you want it to end, and how you want it to change at each execution of the body\
    \ of the loop.\n- In order to write the body of the for loop, you need to work\
    \ out what should happen during each execution of the loop body.\n- Do you want\
    \ any statements to be executed after the loop?\n\n## ACTIVITY 5.7\n\nHere is\
    \ a copy of the code for Program_7.5.1, which you studied in Activity 5.1.\n\n\
    ```\nfor (var count = 1; count <= 10; count = count + 1)\n{\n    document.write('Count\
    \ is ' + count + '<BR>');\n};\ndocument.write('Thank you' + '<BR>')\n```\n\nWe\
    \ have made a copy of this code in the file Activity_7.5.7. Open the file in Notepad\
    \ and see if you can replace the code for the for loop by code for a while loop\
    \ which does exactly the same thing. Run Program_7.5.1 and Activity_7.5.7 to check\
    \ that they both do the same thing.\n\n## Discussion\n\nHere is our solution.\n\
    \n```\nvar count;\n\ncount = 1\nwhile (count <= 10)\n{\n    document.write('Count\
    \ is ' + count + '<BR>');\n    count = count + 1\n};\ndocument.write('Thank you'\
    \ + '<BR>')\n```\n\nAs you can see, the way the code works is very similar in\
    \ both cases:\n\n- the counter variable is initialised to the same value;\n- the\
    \ same condition is tested before each iteration of the loop;\n- the counter is\
    \ updated at the end of each iteration (though in the case of the while loop this\
    \ is done within the body of the loop).\n\nYou will find a working solution in\
    \ Solution_7.5.7.\n\nWhere you have a for loop, it is always possible to write\
    \ an equivalent while loop, but we recommend that when you know how many iterations\
    \ are required you use a for loop, which makes the number of repetitions much\
    \ clearer.\n\nWhere you have a while loop, it is not usually possible to write\
    \ an equivalent for loop because while loops are normally used where you don't\
    \ know in advance how many iterations will be required."
