  md: '# Answer to SAQ 4.1 ✓


    The body consists of the following statements.


    ```

    document.write(''You must enter a year of birth between 1900 and 2003 (inclusive)''
    + ''<BR>'');

    yearOfBirth = window.prompt(''Please enter your year of birth'','''');

    yearOfBirth = parseFloat(yearOfBirth);

    ```


    If the Boolean expression controlling a **while** loop evaluates to `true`, the
    *whole* of the body is executed. Then execution returns to the top of the **while**
    statement and the condition is tested again to see if it is still true. If it
    is, the body is executed again, and so on until the condition evaluates to `false`.
    The body of the **while** statement is then skipped over and execution of the
    rest of the program continues, as illustrated in Figure 4.2.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_58_0.png)


    **Figure 4.2** How a **while** loop works


