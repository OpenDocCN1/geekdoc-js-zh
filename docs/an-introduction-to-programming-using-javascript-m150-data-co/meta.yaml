  md: '# # 5 Programming for repetition: the for statement


    This section aims to:


    +   - introduce you to the for statement (often called a for loop) which enables
    you to repeat the execution of a block of statements a predetermined number of
    times;

    - revise the use of the charAt() string method and introduce the length property.


    In the examples of repetition studied in Section 4, we didn''t know in advance
    how many times the code in the body of the loop would be executed. The number
    of iterations was controlled by the while condition and depended, for example,
    on how many times the user entered invalid data, or how many values were input
    before the terminating sentinel. The for statement is controlled by a counter,
    and can be used only when the number of repetitions is known before execution
    of the statement. For example, if you wanted to calculate the average exam mark
    for a class of 20 students, you know that you would need to add a mark to the
    total exactly 20 times before dividing the total number of marks by 20.


    ''Iteration'' is the technical term for repetition.


    # ## 5.1 Introducing the for statement (loop)


    In order to control the number of repetitions, for loops use a variable as a counter.
    To use a JavaScript for loop, you need to know:


    +   - the starting value of the counter;

    - the final value of the counter for which the loop body is executed;

    - the fixed number by which the counter is increased or decreased after each repetition;

    - the statement(s) which make up the body of the loop (as for a while loop).


    We illustrate this in Activity 5.1.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_71_0.png)


    **ACTIVITY 5.1**

    In this activity, you will study a very simple example of a for loop.

    Figure 5.1 shows the annotated source code of Program_7.5.1.


    70'
  merge: -1
  pgno: 71
- img_proc: true
  md: "# Programming for repetition: the for statement\n\n```\nfor (var count = 1;\
    \ count <= 10; count = count + 1)\n{\n    document.write('Count is ' + count +\
    \ '<BR>'\n};\ndocument.write('Thank you' + '<BR>'\n```\n\nthe starting value\n\
    \nthe condition that tests whether the finishing value has been passed\n\nthe\
    \ amount the counter is increased by each repetition\n\nbody of loop\n\nNote that\
    \ there is nothing special about the variable name count. We could have used any\
    \ valid identifier.\n\n# Figure 5.1 The code of Program _7.5.1, annotated\n\n\
    +   (a) What do you think the for loop does? Run Program_7.5.1 and find out.\n\
    \n+   (b) What is the value of count once the required number of iterations has\
    \ been executed?\n\n# Discussion\n\n+   (a) For each iteration of the loop, the\
    \ program writes out the value of count, and then increases it by 1. It does this\
    \ 10 times, as follows.\n\nFirst of all, the assignment in the first part of the\
    \ for statement (count = 1) is executed, thus initialising the counter.\n\nThen\
    \ the condition in the second part of the for loop (count <= 10) is tested.\n\n\
    If it evaluates to true,\n\nthe statement in the body of the loop (which displays\
    \ the value of count) is executed,\n\nthe assignment statement in the third part\
    \ of the for statement (count = count + 1) is executed,\n\nthe condition is tested\
    \ again (and so on).\n\nIf it evaluates to false,\n\nthe body of the loop is skipped\
    \ and control passes to the statement following the loop (which in this case is\
    \ the statement to output Thank you).\n\n+   (b) The final value of count is 11.\n\
    \nNote that this is one more than the 'final' value specified in the condition,\
    \ because it is only when count reaches 11 that the condition in the for statement\
    \ evaluates to false.\n\nIn the examples that follow, we sometimes refer to the\
    \ 'final' value assigned to the counter variable in the loop control statement.\
    \ In this context we are talking about the final value for which the loop body\
    \ is executed, not its value once all the required iterations have taken place."
