- md: "M150 DATA, **COMPUTING** and **INFORMATION**\n\n## 7 An introduction to programming\
    \ using JavaScript\n\nThis publication forms part of an Open University course\
    \ M150 *Data, Computing and Information*. Details of this and other Open University\
    \ courses can be obtained from the Course Information and Advice Centre, PO Box\
    \ 724, The Open University, Milton Keynes MK7 6ZS, United Kingdom: tel. +44 (0)1908\
    \ 653231, e-mail general-enquiries@open.ac.uk\n\nAlternatively, you may visit\
    \ the Open University website at http://www.open.ac.uk where you can learn more\
    \ about the wide range of courses and packs offered at all levels by The Open\
    \ University.\n\nTo purchase a selection of Open University course materials visit\
    \ the webshop at www.ouw.co.uk, or contact Open University Worldwide, Michael\
    \ Young Building, Walton Hall, Milton Keynes MK7 6AA, United Kingdom for a brochure.\
    \ tel. +44 (0)1908 858785; fax +44 (0)1908 858787; e-mail ouwenq@open.ac.uk\n\n\
    The Open University, Walton Hall, Milton Keynes, MK7 6AA\n\nFirst published 2004.\
    \ Reprinted with corrections 2004\n\nCopyright © 2004 The Open University\n\n\
    All rights reserved. No part of this publication may be reproduced, stored in\
    \ a retrieval system, transmitted or utilized in any form or by any means, electronic,\
    \ mechanical, photocopying, recording or otherwise, without written permission\
    \ from the publisher or a licence from the Copyright Licensing Agency Ltd. Details\
    \ of such licences (for reprographic reproduction) may be obtained from the Copyright\
    \ Licensing Agency Ltd of 90 Tottenham Court Road, London W1T 4LP.\n\nEdited,\
    \ designed and typeset by The Open University.\n\nPrinted in the United Kingdom\
    \ by The Alden Group, Oxford.\n\nISBN 0 7492 5764 4\n\n1.2\n\n182350B/m150b2u7i.2\n\
    \n## CONTENTS\n\n1.  Introduction **5**\n    - Important information on studying\
    \ Units 7-10 **6**\n2.  Getting started **7**\n    - 2.1 First program **7**\n\
    \    - 2.2 Variables and sequential execution **11**\n        - The semicolon\
    \ and sequential execution **13**\n        - Naming variables **16**\n    - 2.3\
    \ Some useful data types **18**\n    - 2.4 Operators **19**\n        - Operators\
    \ on numbers **19**\n        - Precedence **19**\n        - A binary operator\
    \ on strings **20**\n    - 2.5 Getting data from a user and displaying results\
    \ **21**\n        - Getting numbers as input **24**\n        - Outputting numbers\
    \ **25**\n    - 2.6 Some review questions **28**\n    - 2.7 Summary **29**\n3.\
    \  Programming for selection: the if statement **30**\n    - 3.1 Booleans and\
    \ the comparison operators **30**\n    - 3.2 Simple conditional statements **34**\n\
    \        - The if statement **34**\n        - Testing programs **37**\n      \
    \  - The if...else statement **39**\n        - The syntax of an if...else statement\
    \ **40**\n    - 3.3 Conditionals and compound statements **43**\n        - Improving\
    \ readability by using comments **45**\n        - Hints for writing programs with\
    \ selection structures **45**\n    - 3.4 An introduction to more complex conditionals\
    \ **47**\n        - Compound Boolean expressions **47**\n        - Nested conditionals\
    \ **49**\n    - 3.5 Summary **53**\n4.  Programming for repetition: the while\
    \ statement\n    - 4.1 Introducing the while statement (loop)\n        - The syntax\
    \ of the while statement\n    - 4.2 Further examples of while loops\n        -\
    \ Hints for writing programs with while loops\n    - 4.3 More about strings\n\
    \    - 4.4 Summary\n5.  Programming for repetition: the for statement\n    - 5.1\
    \ Introducing the for statement (loop)\n        - The syntax of a for loop\n \
    \       - Hints for writing programs with for loops\n    - 5.2 Strings and for\
    \ loops\n    - 5.3 Summary\n6.  Unit summary\n    - 6.1 Learning outcomes\n  \
    \      - Key terms\n\nThis unit was prepared for the course team by Judith Segal.\n\
    \n## 1 Introduction\n\nThe aim of this unit is to introduce you to writing your\
    \ own computer programs. In particular, we aim to introduce you to:\n\n- writing\
    \ code to read in data from a user, perform some simple processing and display\
    \ the result;\n\n- programming for sequence, selection and repetition in a high-level\
    \ language, specifically:\n    - how to achieve selective execution of sections\
    \ of program code as a result of the evaluation of some condition;\n    - how\
    \ to achieve repeated execution of a section of program code, either while a particular\
    \ condition is true or for a specified number of times.\n\nYou will be using a\
    \ widely available high-level programming language called JavaScript. We provide\
    \ you with a small set of programs to run, alter and experiment with, and you\
    \ will also be writing your own small programs from scratch.\n\nJavaScript is\
    \ not the same as Java. Although JavaScript code looks a bit like Java, and the\
    \ two languages are often used together to produce web-based applications, they\
    \ are otherwise unrelated.\n\nYou should already be aware from Unit 6 that, in\
    \ programming, we use a formal language to communicate with a machine. If you\
    \ don't follow the rules of the language, known as its **syntax**, exactly, your\
    \ program will not run or will not run as you expect. It can be a very frustrating\
    \ experience to have to look for mistakes - usually called 'bugs'.\n\n> You can\
    \ think of the syntax of a language as its grammar.\n\nProgramming languages also\
    \ have vocabulary and meaning - just like natural (spoken) languages.\n\nWe have\
    \ provided working code for all the activities in this unit, which, as a last\
    \ resort, you may look at and run yourself. However, learning to program is a\
    \ bit like learning to ride a bicycle: your learning will be extremely limited\
    \ if you simply observe what other people have done. In order to really understand\
    \ how to program, you have to write your own programs (albeit with a little help\
    \ from us).\n\nPlease don't be put off if you do make mistakes. Many people find\
    \ that the process of making mistakes, and then working out why they are mistakes\
    \ and correcting them, forms a very valuable - and even enjoyable - learning experience.\
    \ You might find it helpful to keep a record of any mistake you make, and how\
    \ it is corrected, for your future reference.\n\nAs well as syntax, programming\
    \ languages have reserved words, sometimes called **keywords**, i.e. words which\
    \ have a special meaning in the particular programming language (you can think\
    \ of the reserved words as constituting part of the vocabulary, or dictionary,\
    \ for that language). Many programming languages use reserved words which look\
    \ like English (such as while, for and if). But beware: the meaning of these words\
    \ in the programming language might not exactly match their English equivalents.\
    \ We shall explain the meaning (**semantics**) of these words in the programming\
    \ language as we meet them.\n\nWe should note at this point that JavaScript is\
    \ case sensitive. This means that, for example, the JavaScript interpreter treats\
    \ If, IF and if as being different. All the reserved words in JavaScript are lower\
    \ case, i.e. they have no capital letters.\n\nIt can be an intensely satisfying,\
    \ rewarding and creative experience to write a program which behaves in exactly\
    \ the way you wish it to. It is now time to introduce you to this experience.\n\
    \n### Important information on studying Units 7–10\n\nWhile studying this block\
    \ you will need regular access to your computer, as it contains a large number\
    \ of practical activities. When working on the activities, you will need to have\
    \ the Block 2 Software Guide to hand for reference.\n\nThe Block 2 Software Guide\
    \ tells you not only how to find and run the programs that we have provided, but\
    \ also how to look at and possibly change the program **source code**, i.e. the\
    \ set of JavaScript statements which make up the program. It also contains a summary\
    \ of JavaScript syntax, which you will probably find helpful.\n\nBefore going\
    \ any further, you should read the section in the Block 2 Software Guide entitled\
    \ 'Working with JavaScript programs'."
  mdcn: "\nM150 数据、**计算**与**信息**\n\n## 7 使用JavaScript的编程导论\n\n本出版物是开放大学课程M150 *数据、计算与信息*的一部分。关于本课程及其他开放大学课程的详细信息，可从以下地址获取：开放大学课程信息与咨询中心，邮箱724，开放大学，米尔顿凯恩斯\
    \ MK7 6ZS，英国：电话 +44 (0)1908 653231，电子邮箱 general-enquiries@open.ac.uk\n\n或者，您也可以访问开放大学网站\
