  md: '# # The syntax of a for loop

    for (declare and initialise counter;

    test value of counter;

    change value of counter)

    {

    statement(s)

    }

    Points to note


    +   - The use of the semicolons as separators.

    - It is not mandatory to declare the loop counter within the for statement - it
    could be declared along with other variables at the start of the program. However,
    in M150 we follow the convention in the syntax above, as this makes clear the
    special purpose of the variable.

    - The body of the for loop can consist of several statements separated by semicolons,
    and wrapped together into a single compound statement by means of curly braces.


    The effect of a for loop is shown in Figure 5.2.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_75_0.png)


