- md: '# Section 4.4 Summary


    In this section, we discussed the while statement, often called a while loop,
    which enables you to repeat the execution of a sequence of statements, constituting
    the body of the loop, until some Boolean expression at the start of the loop evaluates
    to false. You saw how while loops can be used to guard against incorrect input
    by prompting the user to re-enter input until it is in the correct form, and also
    how they can be used to repeat execution until some stopping value (sentinel)
    is reached.


    We introduced the idea of a string as an object consisting of a number of characters,
    and you met the method charAt(), which returns the character at a particular location
    in the string determined by the argument to the method. We noted that the positions
    of characters in a string are numbered (indexed) from left to right, with the
    leftmost character having the index 0.


    # Section 5 Programming for repetition: the for statement


    This section aims to:


    - introduce you to the for statement (often called a for loop) which enables you
    to repeat the execution of a block of statements a predetermined number of times;

    - revise the use of the charAt() string method and introduce the length property.


    In the examples of repetition studied in Section 4, we didn''t know in advance
    how many times the code in the body of the loop would be executed. The number
    of iterations was controlled by the while condition and depended, for example,
    on how many times the user entered invalid data, or how many values were input
    before the terminating sentinel. The for statement is controlled by a counter,
    and can be used only when the number of repetitions is known before execution
    of the statement. For example, if you wanted to calculate the average exam mark
    for a class of 20 students, you know that you would need to add a mark to the
    total exactly 20 times before dividing the total number of marks by 20.


    ''Iteration'' is the technical term for repetition.


    # Section 5.1 Introducing the for statement (loop)


    In order to control the number of repetitions, for loops use a variable as a counter.
    To use a JavaScript for loop, you need to know:


    - the starting value of the counter;

    - the final value of the counter for which the loop body is executed;

    - the fixed number by which the counter is increased or decreased after each repetition;

    - the statement(s) which make up the body of the loop (as for a while loop).


    We illustrate this in Activity 5.1.


    ### Figure 5.1 The code of Program_7.5.1, annotated


    + (a) What do you think the for loop does? Run Program_7.5.1 and find out.

    + (b) What is the value of count once the required number of iterations has been
    executed?


    # Discussion


    + (a) For each iteration of the loop, the program writes out the value of count,
    and then increases it by 1. It does this 10 times, as follows.


    First of all, the assignment in the first part of the for statement (count = 1)
    is executed, thus initialising the counter.


    Then the condition in the second part of the for loop (count <= 10) is tested.


    If it evaluates to true,


    the statement in the body of the loop (which displays the value of count) is executed,


    the assignment statement in the third part of the for statement (count = count
    + 1) is executed,


    the condition is tested again (and so on).


    If it evaluates to false,


    the body of the loop is skipped and control passes to the statement following
    the loop (which in this case is the statement to output Thank you).


    + (b) The final value of count is 11.


    Note that this is one more than the ''final'' value specified in the condition,
    because it is only when count reaches 11 that the condition in the for statement
    evaluates to false.


    In the examples that follow, we sometimes refer to the ''final'' value assigned
    to the counter variable in the loop control statement. In this context we are
    talking about the final value for which the loop body is executed, not its value
    once all the required iterations have taken place.


