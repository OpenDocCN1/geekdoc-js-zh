    # ACTIVITY 2.7


    The file Activity_7.2.7 contains a copy of Program_7.2.6.


    (a) Open the file in Notepad and amend the source code so that the default input
    string is ''Type your name here'', as in SAQ 2.11. Save your changes. Run your
    amended program, but just click OK in the prompt dialogue box without modifying
    the default text. What happens?


    (b) Amend the source code of Activity_7.2.7 so that the program also displays
    a second dialogue box asking you for the day today and displays output similar
    to the following:

    Hello Charles Dickens!

    Have a nice Thursday!

    (substituting, of course, the name and day that you have entered instead of Charles
    Dickens and Thursday). Save the amended code and run the program.


    Hint How many variables will you need?


    # Discussion


    (a) The output is:

    Hello Type your name here!

    Have a good day

    In the absence of the user inputting any value, the default string value, ''Type
    your name here'', is assigned to the variable name.


    (b) Here is our solution.


    ```

    var name;

    var day;

    name = window.prompt(''Enter your name'',''Type your name here'');

    day = window.prompt(''Enter the day'','''');

    document.write(''Hello '' + name + ''!'');

    document.write(''<BR>'' + ''Have a nice '' + day)

    ```


    Note that you could have entered any old rubbish in response to the prompts. JavaScript
    doesn''t automatically know what your name is, nor what day it is today, nor what
    is a sensible value for a name or a day. Note also that you don''t need quotation
    marks around name and day in the document.write() statements, as it is the values
    of these variables that we want to display and not their identifiers.


    You will find a working solution to part (b) in Solution_7.2.7.


    You wouldn''t always want to include a non-empty default input string, as it is
    very irritating for the user to have to delete it before typing their input, but
    it can be useful in situations such as the following.


    +   - Where the programmer has good reason to expect a particular response from
    the user, e.g. if you were writing a program to ask M150 students whether they
    had already studied any OU courses at level 2, you would expect the most likely
    answer to be no, so you might use this as the default.'
