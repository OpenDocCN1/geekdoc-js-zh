    # SAQ 5.3


    +   (a) What factor would you consider when deciding whether to use a while loop
    or a for loop in a program?


    (b) What are the three parts of the loop control statement in a for loop?


    (c) What happens when the condition controlling a while loop evaluates to false?


    (d) What must you always include in the body of a while loop?


    # Answer to SAQ 5.3


    +   (a) If you knew in advance how many repetitions would be needed, you would
    probably use a for loop, but if you did not know, you would need to use a while
    loop.


    (b) The three parts are:

    - declaration and initialisation of a counter variable;

    - a condition specifying the finishing value of the counter;

    - a statement to increment or decrement the counter.


    (c) The program jumps to the statement (if any) directly following the body of
    the while loop.


    (d) A statement or statements which will eventually cause the controlling condition
    to evaluate to false.


    Conditional statements (such as the if statement), while statements and for statements
    are all kinds of **control structures**, so called because they control the flow
    of execution of the program, i.e. the order in which statements are executed.
    This flow of execution, which is dependent on the evaluation of Boolean conditions,
    is often called the **flow of control**.


    # 5.3 Summary


    In this section, we have discussed the use of the for statement, which uses a
    counter to control the number of executions of a sequence of statements.


    We revised the charAt() method of string objects and introduced you to the string
    property length.'
