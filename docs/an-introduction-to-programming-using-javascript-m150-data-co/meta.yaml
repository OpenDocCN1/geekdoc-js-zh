  md: "# ACTIVITY 5.6\n\nThe file Activity_7.5.6 contains a partially completed program\
    \ to calculate the average exam score for a group of five students. For each student,\
    \ the user is prompted to enter a score and this score is added to the total so\
    \ far. Once the scores for the five students have been entered and totalled, the\
    \ average score is calculated and output. We have provided you with the code to\
    \ calculate the average and display it. You should add the code to prompt for\
    \ and read in the scores, convert them to numbers and add them to the total. Open\
    \ Activity_7.5.6 and add your code in the spaces indicated. Test your program\
    \ by running it with several sets of five scores.\n\n**If you have difficulty\
    \ you might find the hints which follow this activity helpful.**\n\n# Discussion\n\
    \nHere is our completed code.\n\n```\nvar total;     // total of scores so far\n\
    var score;     // score for a single student\nvar average;   // average score\n\
    \n/* Insert code to initialise total */\ntotal = 0;\n/* insert code for a for\
    \ loop to read in and add the 5 student scores to total */\n\nfor (var count =\
    \ 1; count <= 5; count = count + 1)\n{\n    score = window.prompt('please enter\
    \ next score','');\n    score = parseFloat(score);\n    total = total + score\n\
    };\naverage = total / 5;\ndocument.write('average score is ' + average + '<BR>')\n\
    ```\n\nDid you get your loop condition correct?\n\nDid you remember to use `parseFloat()`\
    \ to convert your input string into a number?\n\nYou will find a working solution\
    \ in Solution_7.5.6.\n\n# Hints for writing programs with for loops\n\n+   - Do\
    \ you need any variables outside the loop to hold any data? If so, declare it/them.\n\
    - Do you need any statements to be executed before the loop?\n- In order to write\
    \ the loop control statement (the top of the for loop), you need to consider where\
