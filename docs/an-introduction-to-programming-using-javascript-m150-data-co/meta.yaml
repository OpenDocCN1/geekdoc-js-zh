  - '[PAGE 23]


    # SAQ 2.10


    Which other object and method have you met in this unit?


    Answer to SAQ 2.10 ✓


    The document object with its associated method write().


    The method prompt() can be used with two arguments, separated by a comma. The
    first of these specifies the string that the programmer wants to appear in the
    box (''Enter your name'' in this case); the second specifies a default response
    string, which appears in the text entry box before the user has entered any value.


    If the user fails to enter any text but clicks on the OK button without entering
    any text, this default value is the value assigned to the variable. In Program_7.2.6,
    the default string is the empty string '''', consisting of no characters. Note
    that an empty string is written as two single quotes with nothing in between ('''').
    It is not the same as '' '', which is two single quotes with a single space between
    them (i.e. a string consisting of a single space character) or ", which is double
    quotes.


    Although we need to include the quotes when specifying strings in program code,
    they are not necessary when entering text into a prompt box; nor are strings displayed
    with quotes by the browser. JavaScript treats all input and output in these cases
    as strings, so does not need the quotes to distinguish them from other data types.


    # SAQ 2.11


    How would you change the second line of the program code, so that the default
    string became ''Type your name here''?


    Answer to SAQ 2.11 ✓


    The line of code would become:


    ```

    var name = prompt(''Enter your name'', ''Type your name here'');

    ```


    We now return to lines (3) and (4) of the code for Program_7.2.6 which are repeated
    below.


    ```

    (3) document.write(''Hello '' + name + ''!'');

    (4) document.write(''<BR>'' + ''Have a good day'')

    ```


    In line (3) we use the string concatenation operator + to make the three strings
    (''Hello'', the value of the variable name and ''!'') into a single string.


    In line (4), we use the HTML tag <BR>, which creates a line break, i.e. it causes
    the text which comes after it to be displayed on a new line in the browser''s
    current page. <BR> may be thought of as a string consisting of a single character,
    the new line character. We concatenate this with the string ''Have a good day''
    to form a single string as the argument to write().'
