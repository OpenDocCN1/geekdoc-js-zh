    ## EXERCISE 2.4


    Given that programming languages were designed primarily as a way for people to
    communicate with computers, why should programs be easy for people to read, as
    well as to write?


    ### Discussion


    One reason is for ease of debugging: if your program doesn''t run at all, or if
    it doesn''t run as you expect, you need to be able to find your mistake. This
    involves reading the program code and understanding what it does. Another reason
    is that you may wish to modify an existing program, rather than write one from
    scratch, in order to solve a particular problem or to carry out a particular task.
    Again, it is important that you understand what the existing program does. You
    may have thought of other reasons.


    ## ACTIVITY 2.4


    Activity_7.2.4 contains a copy of Program_7.2.3. Open the file in Notepad and
    delete the line:


    ```

    myVar = 3

    ```


    so that the JavaScript code now reads:


    ```

    var myVar;

    document.write(myVar)

    ```


    Save your changes and run the program. What happens, and why?


    ### Discussion


    You will get the word undefined displayed in your browser''s current page. This
    is because the variable myVar has not had any value assigned to it.


    The process of assigning an initial value to a variable is called **initialisation**.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_18_0.png)


    ## SAQ 2.6


    Write down the JavaScript code to declare a variable called `myNumber`; initialise
    it with the number 5; add 5 to its value; and finally display the new value.


    > (We do not expect you to try out this code on your computer, but if you do,
    remember that you will need to include the HTML lines and save it in a file with
    a .html extension.)


    ### Answer to SAQ 2.6 ✓


    ```

    var myNumber = 5;

    myNumber = myNumber + 5;

    document.write(myNumber);

    ```


    ## 2.3 Some useful data types


    Some of the data values that we have seen so far are recognisably of the same
    kind, or **type**. For example, the values 3, 7, and 21 are all of the **number
    type**, as indeed are 3.24, –6 and –2.5.


    Similarly, ''hello'', ''welcome'' and ''have a good day!'' are all recognisably
    sequences (or strings) of characters. In JavaScript, as in many other programming
    languages, character sequences are represented by the **string type**. As you
    have already seen, strings in JavaScript code must be enclosed in quotation marks
    to distinguish them from variables and reserved words; the quotes are not actually
    part of the string. Strings can include spaces, punctuation marks, indeed any
    character you would find on a typewriter keyboard, as well as letters.


    It isn''t always obvious to which type a value belongs. Take 6123456, for example:
    is this a number, or is it a string, i.e. a sequence of (numeric) characters such
    as those found on a keyboard? The answer depends on the role of 6123456 in the
    context of the program. It might be the number of people watching the first episode
    of a series on television. In this case, it is clearly a number. You can imagine
    using it in calculations, such as adding the number of people who watched subsequent
    episodes, or finding the difference between this and the number of people who
    watched a film on another channel at the same time. On the other hand, 6123456
    might be a telephone number, in which case it seems unlikely that you would want
    to use it in calculations, and so you could think of it as the character string
    ''6123456''. To indicate to JavaScript that a sequence of numbers in a program
    is to be treated as a string, we must include the quotes.


    Many programming languages treat whole numbers differently from real numbers (numbers
    with decimal parts), but JavaScript does not.


    ## SAQ 2.7


    Where have you seen strings before in this unit?


    ### Answer to SAQ 2.7 ✓


    Strings were used in the arguments to the `write()` method in Activities 2.1 and
    2.2.


    ## 2.4 Operators


    ### Operators on numbers


    In earlier examples you have seen instructions such as `yourVar = myVar + 3`.

    You already know that `yourVar` and `myVar` are variable names, `=` is the assignment
    operator and `3` is a value. What about the `+`? This is also an operator, in
    this case the addition operator. In general, operators manipulate values.


    JavaScript can carry out various arithmetic operations, including addition, subtraction,
    multiplication and division. For addition and subtraction it uses the usual operators
    + and -. The symbols for multiplication and division are * and / respectively.
    All four of these operators are **binary operators**. (You will recall from Unit
    6 that binary operators operate on two values, known as their operands.)


    > If you use a calculator, you may already be familiar with the symbols * for
    multiplication and / for division.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_20_0.png)


    How good is your arithmetic? What are the answers to `3 + 4 * 2` and `4 / 2 +
    6`?


    ### Discussion


    Run Program_7.2.5 to check your answers.


    > Don''t worry if you don''t understand the code for Program_7.2.5 at this stage.


    ### Precedence


    The point of Activity 2.5 was to consider the **precedence** of arithmetic operators
    in JavaScript, i.e. the order in which they are applied in an expression containing
    more than one operator. For example, if you were to evaluate the expression `3
    + 4 * 2` from left to right, you would add 3 and 4 first, getting 7, and then
    multiply by 2, giving 14. In fact, the answer given by Program_7.2.5 is 11: the
    multiplication of 4 and 2 is carried out first, and then the 3 is added. This
    is because JavaScript applies the usual mathematical precedence rules - in the
    absence of parentheses (round brackets), multiplication and division are carried
    out first, followed by addition and subtraction.


    > The standard mathematical precedence rules are not followed by all programming
    languages. In the absence of parentheses some languages will evaluate arithmetic
    expressions strictly from left to right


    If you want to avoid memorising the precedence of different operators or if you
    want to override the fixed precedence (for example, in the second example above,
    you might really want to add the 2 and 6 first), then you should use parentheses.
    The program will always evaluate the expression(s) in parentheses first, and where
    there is more than one set, the expression in the innermost pair will be evaluated
    first.


    ### SAQ 2.8


    Work out `(2 * (3 + (6 / (1 + 2)) - 1))`.


    ## Answer to SAQ 2.8 ✓


    The order of evaluation is shown in Figure 2.8.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_21_0.png)


    **Figure 2.8** Order of evaluation of the expression in SAQ 2.8


    Figure 2.9 shows the evaluation step by step. On each line the part that will
    be evaluated next is shaded.


    ```

    (1)   (2 * (3 + (6 / (1 + 2))) - 1))

    (2)   (2 * (3 + (6 / 3) - 1))

    (3)   (2 * (3 + 2 - 1))

    (4)   (2 * (5 - 1))

    (5)   (2 * 4)

    (6)   8

    ```


    **Figure 2.9** The evaluation shown step by step


    The answer is 8.


    ## A binary operator on strings


    The symbol + is also used as a string operator: in this context + is the operator
    for concatenation (appending the second string to the first). For example, ''Hello''
    + ''there'' will give ''Hellothere''.


    ## SAQ 2.9


    What changes would you need to make to the two strings in the example above so
    as to obtain the result ''Hello there''?


    ### Answer to SAQ 2.9 ✓


    Remember that a string can contain spaces. So there are two possible solutions:

    ''Hello '' + ''there''

    (where the first string consists of the letters h, e, l, l, o followed by a space
    character, and the second string is as above), or

    ''Hello'' + '' there''

    (where the first string is as above and the second string consists of a space
    character followed by the letters t, h, e, r, e).


    ## 2.5 Getting data from a user and displaying results


    So far, variables have been assigned values in the source code. But this is very
    inflexible. You can easily imagine that you might want to run a program with different
    values, e.g. a program which adds any two numbers. Providing a program with data
    which isn''t written into the source code is known as getting **input** data for
    the program. There are various ways in which this can be done: the following activity
    shows one way.


    ## ACTIVITY 2.6


    Run Program_7.2.6. You will see a box similar to Figure 2.10 open on top of the
    browser''s current page.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_22_0.png)


    Figure 2.10 A prompt dialogue box


    **Type in your name as instructed, and click OK. You will then get a personalised
    greeting in the browser''s current page.**


    **Open the file Program_7.2.6 in Notepad, and try to figure out how the source
    code works.**


    ### Discussion


    The JavaScript code is as follows (with line numbers included for reference).


    ```

    (1)  var name;

    (2)  name = window.prompt(''Enter your name'','''');

    (3)  document.write(''Hello '' + name + ''!'');

    (4)  document.write(''<BR>'' + ''Have a good day'')

    ```


    The first line just declares a variable called `name`.


    The second line instructs JavaScript to display a prompt dialogue box with some
    specified text. This box lets you enter a value, your name in this case, which
    is then assigned to the variable called `name`.


    The third and fourth lines specify the program''s output.


    We shall now look at the code of Activity 2.6 in more detail. In the second line,
    `window` refers to the browser''s window in which `document` (the current page)
    is displayed. The method `prompt()` is associated with the `window` object, which
    will cause the prompt dialogue box to appear on top of the window.'
