    This table can also be found in the syntax summary in the Block 2 Software Guide.


    The full set of comparison operators in JavaScript is given in Table 3.1.


    # Table 3.1 Comparison operators in JavaScript


    | Operator symbol | Informal description | Discussion | Examples | |

    | --- | --- | --- | --- | --- |

    | < | less than | (a < b) is true if the value of a is less than the value of
    b, otherwise it is false | (3 < 5) | true |

    | | | | | (7 < 2) | false |

    | | | | | (3 < 3) | false |

    | <= | less than or equal to | (a <= b) is true if the value of a is less than
    the value of b, or is equal to the value of b, otherwise it is false | (2 <= 5)
    | true |

    | | | | | (2 <= 1) | false |

    | | | | | (2 <= 2) | true |

    | > | greater than | (a > b) is true if the value of a is greater than the value
    of b, otherwise it is false | (2 > 3) | false |

    | | | | | (2 > 1) | true |

    | | | | | (2 > 2) | false |

    | >= | greater than or equal to | (a >= b) is true if the value of a is greater
    than the value of b, or is equal to the value of b, otherwise it is false | (3
    >= 2) | true |

    | | | | | (3 >= 5) | false |

    | | | | | (3 >= 3) | true |

    | == | equal to | (a == b) is true if the value of a is equal to the value of
    b, otherwise it is false | (2 == 3) | false |

    | | | | | (2 == 2) | true |

    | != | not equal to | (a != b) is true if the value of a is not equal to the value
    of b, otherwise it is false | (3 != 2) | true |

    | | | | | (2 != 3) | true |

    | | | scrollbar thumb | | (2 != 2) | false |


    # Notes on the symbols used


    All the JavaScript symbols in the left-hand column represent single operators,
    so where there are two characters, e.g. <= and !=, leaving a space between them
    will cause a syntax error.


    Note the use of a ''double equals'' (==) symbol for the equality operator. This
    distinguishes it from the assignment operator =.'
