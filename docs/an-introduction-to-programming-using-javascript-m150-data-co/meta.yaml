    ## The semicolon and sequential execution


    Here again are the three lines of JavaScript code from Program_7.2.3:


    ```

    var myVar;

    myVar = 3;

    document.write(myVar)

    ```


    You may have noticed that there are semicolons at the end of each of the first
    two lines. We did not explain these semicolons when we discussed the meaning of
    the code earlier in this subsection because each of the three instructions is
    complete without the semicolon. However the semicolon can be used as a separator
    between instructions, so that JavaScript clearly ''knows'' where one instruction
    ends and another begins. Where each instruction is on a separate line the semicolons
    are not mandatory, but we think they make the code clearer and will be using them
    throughout this block.


    Of course, JavaScript is not capable of ''knowing'' in the human sense, but you
    will find that ascribing human characteristics to things - known as anthropomorphism
    - is common in discussions of computer hardware and software.


