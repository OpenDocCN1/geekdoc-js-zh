- md: "\n\n## Unit 7 An introduction to programming using JavaScript\n\n### 4 Programming\
    \ for repetition: the while statement\n\nThis section aims to:\n\n- introduce\
    \ you to the while statement (often called a while loop), which has the effect\
    \ of repeating execution of one or more program statements while a certain condition\
    \ remains true;\n- increase your knowledge of the behaviour of strings.\n\nYou\
    \ will recall that in the last section we discussed a program for calculating\
    \ a user's age from their year of birth and the current year. If the current year\
    \ entered was before the year of birth, the program gave the user a second chance\
    \ of inputting the two years. But if invalid data was entered again, the program\
    \ simply returned a nonsensical answer – a negative age. Ideally, we would have\
    \ wanted the program to repeatedly prompt the user for the two dates until they\
    \ had provided valid input. This is the sort of thing that can be done using a\
    \ while loop.\n\n### 4.1 Introducing the while statement\n\n![](img/563dcadf5ae68219c0c3dfb03c7cc823_55_0.png)\n\
    \n**ACTIVITY 4.1**\nProgram_7.4.1 does something similar to the scenario described\
    \ above. Using the current year (2003 at the time of writing) and the user's year\
    \ of birth, it works out whether the person is entitled to receive a concessionary\
    \ rail fare for a particular journey (which we will assume is available to people\
    \ aged 60 and over), and displays the relevant fare. Only years of birth between\
    \ 1900 and 2003 (inclusive) are accepted as valid, and the user is repeatedly\
    \ prompted until he or she enters a valid year.\n\nHere is the JavaScript code,\
    \ numbered for reference.\n\n```javascript\n/* Program to display the appropriate\
    \ fare for a rail journey */\n/* Assumptions:                                \
    \          */\n/*   The current year is 2003.                           */\n/*\
    \   Only years of birth in the range 1900 to 2003 are   */\n/*   accepted as valid.\
    \                                 */\n/*   Passengers of 60 or more are eligible\
    \ for a        */\n/*   concessionary fare of £18.                          */\n\
    /*   Other passengers pay £25.                           */\n/*              \
    \                                       */\n\nvar currentYear, yearOfBirth;\n\
    var age;          // age this year\n\ncurrentYear = 2003;\nyearOfBirth = window.prompt('Please\
    \ enter your year of birth','');\nyearOfBirth = parseFloat(yearOfBirth);\n\n//\
    \ loop while valid input has not been received\nwhile (yearOfBirth < 1900 || yearOfBirth\
    \ > 2003)\n{\n    document.write('You must enter a year of birth between 1900\
