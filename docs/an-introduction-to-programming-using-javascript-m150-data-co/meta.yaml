    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_14_0.png)


    # Discussion


    (a) You will see that the output is the current value of the variable, myVar,
    which is 3.


    (b) Changing myVar = 3 to myVar = 145 will achieve the required change.


    You will find a working solution in Solution_7.2.3.'
