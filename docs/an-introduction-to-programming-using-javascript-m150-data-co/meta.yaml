    \ section were rather simple: the computer carried out the JavaScript instructions\
    \ sequentially.\n\nIn this section, we consider how to instruct the computer to\
    \ act differently according to certain conditions; i.e. either to execute a sequence\
    \ of one or more instructions in a program or to 'jump over' them (miss them out).\n\
    \nFor example, we may wish to input a number representing an exam mark, and display\
    \ **Pass** if it is 40 or above, or **Fail** if it is below 40. In this case the\
    \ condition that needs to be checked is whether the number is greater than or\
    \ equal to 40. If it is, the instruction to display the word **Pass** is executed\
    \ and the instruction to display **Fail** is skipped over.\n\nIf it is not, the\
    \ instruction to display **Pass** is skipped and the instruction to display **Fail**\
    \ is executed.\n\n## 3.1 Booleans and the comparison operators\n\nYou will recall\
    \ from Unit 6 that regardless of the kinds of value involved in our Boolean conditions,\
    \ the conditions always evaluated to true or false. For example, you saw conditions\
    \ which involved comparisons of numbers, shapes and colours. When writing conditions\
    \ in JavaScript, we make use of a number of operators called **comparison operators**.\
    \ These act on (compare) two values of the same type, such as two numbers or two\
    \ strings, but they always return a Boolean value, either true or false, depending\
    \ on whether the condition is true or false.\n\n## ACTIVITY 3.1\n\n**The code\
    \ which follows is the JavaScript code from Program_7.3.1.**\n\n```javascript\n\
    var firstValue, secondValue;\nvar firstBool, secondBool;\n\nfirstValue = window.prompt('Please\
    \ enter your first value','');\nfirstValue = parseFloat(firstValue);\nsecondValue\
    \ = window.prompt('Please enter your second value','');\nsecondValue = parseFloat(secondValue);\n\
    firstBool = (firstValue < secondValue);\nsecondBool = (firstValue <= secondValue);\n\
    document.write('It is ' + firstBool + ' that ' + firstValue + ' < '\n        \
    \    + secondValue);\ndocument.write('<BR>' + 'It is ' + secondBool + ' that '\
    \ + firstValue\n            + ' <= ' + secondValue)\n```\n\n**Note that when you\
    \ want to declare several variables, you can put them all on the same line consisting\
    \ of the reserved word var followed by the names of each of the variables, separated\
    \ by commas. However, we recommend that you put variables of different kinds on\
    \ different lines, as we have done above.**\n\n**Run Program_7.3.1 with the following\
    \ inputs and note your results:**\n\n- (a) 3 for the first value and 5 for the\
    \ second.\n- (b) 117 for the first value and 32 for the second.\n- (c) 2 for both\
    \ values.\n- (d) What do you think is meant by the symbols `<` and `<=`?\n\n##\
    \ Discussion\n\n(a) The output should be:\n\n```\nIt is true that 3 < 5\nIt is\
    \ true that 3 <= 5\n```\n\nThe Boolean expression `(a < b)` evaluates to true\
    \ if the number `a` is less than the number `b`; otherwise, it evaluates to false.\n\
    \nThe Boolean expression `(a <= b)` evaluates to true if the number `a` is less\
    \ than the number `b` or the number `a` equals the number `b`; otherwise, the\
    \ value of `(a <= b)` evaluates to false.\n\n(b) The output should be:\n\n```\n\
    It is false that 117 < 32\nIt is false that 117 <= 32\n```"
