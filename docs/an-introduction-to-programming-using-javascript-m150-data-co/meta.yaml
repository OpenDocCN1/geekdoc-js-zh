    \ code in the file for Activity_7.2.2 so that the program, when run, will display\n\
    \n`Welcome to JavaScript programming!`\n\nThe Block 2 Software Guide tells you\
    \ how to run JavaScript programs.\n\nSave the file and run the program `Activity_7.2.2`\
