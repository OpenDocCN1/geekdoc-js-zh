  md: '# 2.2 Variables and sequential execution


    You will recall from Unit 6 that **sequential execution** means carrying out one
    instruction, and the next, and then the next, and so on until all the instructions
    have been executed. All the programs in the remainder of Section 2 execute in
    this way.


    Writing programs which simply display words that you have already written as part
    of the program (source) code isn''t terribly interesting. We want you to be able
    to write programs which will take data, manipulate it in some way and then display
    the results. Before you do that, you need to have some idea of how a JavaScript
    program can access data stored in the computer''s memory. You will recall from
    Unit 6 that locations in the computer''s memory have unique addresses. When using
    a high-level programming language such as JavaScript, we don''t need to know anything
    about exact memory locations; we can simply declare to JavaScript that we require
    some memory, and give it a name, sometimes referred to as an **identifier**. The
    JavaScript interpreter and the operating system will then identify a suitable
    memory location and manage it for us.


    A **variable** can be thought of as a named location in the computer''s memory
    where a value is stored. You can think of the name (or identifier) as a sort of
    label for the memory location. For example, a variable with a number value stored
    in it, say 3, might have the name `sum`, as illustrated in Figure 2.1. We say
    that the variable named `sum` has the value 3, or is assigned the value 3.


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_12_0.png)


    **Figure 2.1**

    A variable named `sum`, with the value 3


    As its name implies, the value in a variable can change (vary) as the program
    executes (i.e. carries out the instructions in the program). When a program accesses
    a variable, such as `sum`, it will use whatever is its current value. You will
    see later that you can choose any name for a variable, provided it is consistent
    with certain rules.


    > Remember from Section 1 that JavaScript is case sensitive and that all reserved
    words must be in lower-case characters. Where we include program code in the course
    text, we use bold font for reserved words.


    The following three lines are the JavaScript code from Program_7.2.3 (which you
    may look at using Notepad if you wish).


    ```

    var myVar;

    myVar = 3;

    document.write(myVar)

    ```'
