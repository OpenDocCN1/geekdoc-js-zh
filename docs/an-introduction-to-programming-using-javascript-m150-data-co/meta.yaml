    # ### Improving readability by using comments


    You have now got to the stage of writing rather complex programs, which are becoming
    increasingly difficult to read and understand. You have already seen how readability
    can be improved by the use of meaningful variable names and by using indentation
    and spacing to show the structure of your code. The purpose of programs and the
    way in which they work can be made even clearer if human include explanatory comments.
    These are intended solely for human readers and we want them to be ignored by
    the JavaScript interpreter. JavaScript provides two ways of doing this.


    +   - The symbol `//` (two forward slashes) tells JavaScript to ignore anything
    on the remainder of that line. This style of commenting is generally used for
    short comments.

    - The pair of symbols `/*` and `*/` tells JavaScript to ignore anything between
    them. This commenting style is used for longer comments and is also used for drawing
    attention to important comments, as you will see later in the unit.


    It is good practice for you to include comments in all your programs, and you
    should do so from now on. At the very least you should include a comment at the
    top of the program, stating what the program is for.


    # ### Hints for writing programs with selection structures


    +   - Start by thinking what variables you will need to hold the data being input,
    processed and output and give them meaningful identifiers.

    - Then decide what the condition is that you want to test, i.e. the expression
    you want to be either true or false.

    - What do you want to do if the expression evaluates to `true`? If you want to
    execute more than one statement, it is essential that you form a single compound
    statement using `{}` (but we advise you to include braces anyway).

    - Is there anything particular you want to do if the expression evaluates to `false`
    (do you need an `else` part)? Again, remember to include braces.

    - How do you want to end the program?'
