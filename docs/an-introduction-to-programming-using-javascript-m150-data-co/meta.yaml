    for (var count = 1; count <= 5; count = count + 1)\n{\n    score = window.prompt('please\
    \ enter next score','');\n    score = parseFloat(score);\n    total = total +\
    \ score\n};\naverage = total / 5;\ndocument.write('average score is ' + average\
    \ + '<BR>')\n```\n\nDid you get your loop condition correct?\n\nDid you remember\
    \ to use `parseFloat()` to convert your input string into a number?\n\nYou will\
    \ find a working solution in Solution_7.5.6.\n\n# Hints for writing programs with\
    \ for loops\n\n+   - Do you need any variables outside the loop to hold any data?\
    \ If so, declare it/them.\n- Do you need any statements to be executed before\
    \ the loop?\n- In order to write the loop control statement (the top of the for\
    \ loop), you need to consider where you want the counter to start, where you\n\
    \n![](img/563dcadf5ae68219c0c3dfb03c7cc823_78_0.png)"
  - "[PAGE 79]\n\nwant it to end, and how you want it to change at each execution\
    \ of the body of the loop.\n\n+   - In order to write the body of the for loop,\
    \ you need to work out what should happen during each execution of the loop body.\n\
    - Do you want any statements to be executed after the loop?\n\n# ACTIVITY 5.7\n\
    \nHere is a copy of the code for Program_7.5.1, which you studied in Activity\
    \ 5.1.\n\n```\nfor (var count = 1; count <= 10; count = count + 1)\n{\n    document.write('Count\
    \ is ' + count + '<BR>');\n};\ndocument.write('Thank you' + '<BR>')\n```\n\nWe\
    \ have made a copy of this code in the file Activity_7.5.7. Open the file in Notepad\
    \ and see if you can replace the code for the for loop by code for a while loop\
    \ which does exactly the same thing. Run Program_7.5.1 and Activity_7.5.7 to check\
    \ that they both do the same thing.\n\n# Discussion\n\nHere is our solution.\n\
    \n```\nvar count;\n\ncount = 1\nwhile (count <= 10)\n{\n    document.write('Count\
    \ is ' + count + '<BR>');\n    count = count + 1\n};\ndocument.write('Thank you'\
    \ + '<BR>')\n```\n\nAs you can see, the way the code works is very similar in\
    \ both cases:\n\n+   - the counter variable is initialised to the same value;\n\
    - the same condition is tested before each iteration of the loop;\n- the counter\
    \ is updated at the end of each iteration (though in the case of the while loop\
    \ this is done within the body of the loop).\n\nYou will find a working solution\
    \ in Solution_7.5.7.\n\nWhere you have a for loop, it is always possible to write\
    \ an equivalent while loop, but we recommend that when you know how many iterations\
    \ are required you use a for loop, which makes the number of repetitions much\
    \ clearer.\n\nWhere you have a while loop, it is not usually possible to write\
