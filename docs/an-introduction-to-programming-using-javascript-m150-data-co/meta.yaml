    \ Activity_7.4.8 所示。\n\n文件 Activity_7.4.9 包含活动 4.8 正确代码的副本，你应该修改它以使程序按指定工作。\n\n\
    ### 讨论\n\n这是我们的代码。\n\n```\nvar letter, myWord, index;\n\nletter = window.prompt('Please\
