  md: '# ## 6 Unit summary


    In this unit, we introduced you to programming in JavaScript.


    In Section 2, we considered sequential execution, simple input and output, and
    introduced the important concepts of variables and assignment. We discussed some
    data types and their associated operators. Section 3 looked at the `if...else`
    statement, a program construct for selection. In Sections 4 and 5, we considered
    two constructs for repetition: the condition-controlled `while` statement in Section
    4, and the counter-controlled `for` statement in Section 5.


    In Unit 8, we examine more complex data types and discuss how we begin to decompose
    programming tasks into subtasks.


    # ### 6.1 Learning outcomes


    Having studied this unit, you should have achieved the following learning outcomes.


    +   - Run a given program. (Activity 2.1 onwards)

    - Read and modify source code. (Activity 2.2 onwards)

    - Use `document.write()` to display output. (Activity 2.2 onwards)

    - Declare variables, and assign values to them. (Section 2.2; SAQ 2.6; Activity
    2.7, Activity 3.1 onwards)

    - Understand the need to make program code comprehensible to a human reader. (Exercise
    2.4)

    - Obtain input to a program from a user using `window.prompt()`. (Activity 2.6
    onwards)

    - Use `parseFloat()` to convert a numeric string into a number. (SAQ 2.13; Activity
    2.9 onwards)

    - Understand and use Booleans and comparison operators. (SAQs 3.1, 3.2; Activitiesies
    3.1, 3.2)

    - Understand and use an `if` statement. (Activities 3.3, 3.4)

    - Understand and use an `if...else` statement. (SAQ 3.5; Exercise 3.2; Activitiesies
    3.5, 3.6, 3.7, 3.8)

    - Insert appropriate comments into your programs. (Activity 3.8)

    - Use Boolean operators. (SAQs 3.6, 3.7; Exercises 3.3, 3.4)'
