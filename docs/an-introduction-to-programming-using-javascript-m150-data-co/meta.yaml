  md: '# SAQ 2.5


    Which of the following are valid identifiers in JavaScript?


    ```

    123

    $sum

    PriceAsked

    ```


    # Answer to SAQ 2.5 ✓


    123 is invalid – an identifier must start with a letter, _ or $


    $sum and PriceAsked are both valid, though they don''t conform to our style guidelines!


    # EXERCISE 2.4


    Given that programming languages were designed primarily as a way for people to
    communicate with computers, why should programs be easy for people to read, as
    well as to write?


    # Discussion


    One reason is for ease of debugging: if your program doesn''t run at all, or if
    it doesn''t run as you expect, you need to be able to find your mistake. This
    involves reading the program code and understanding what it does. Another reason
    is that you may wish to modify an existing program, rather than write one from
    scratch, in order to solve a particular problem or to carry out a particular task.
