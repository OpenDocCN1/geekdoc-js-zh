    \ balance is now £0\nGoodbye\n\n与 (b) 部分一样，布尔表达式求值为 `false`，因此 `else` 子句中的语句将被执行，计算并显示余额，然后显示\
    \ `Goodbye`。\n\n## ### 通过使用注释提高可读性\n\n你现在已经开始编写相当复杂的程序，这些程序变得越来越难以阅读和理解。你已经看到，通过使用有意义的变量名以及使用缩进和间距来展示代码结构，可以提高可读性。如果包含解释性注释，程序的目的及其工作方式将会变得更加清晰。这些注释仅供人类读者阅读，我们希望\
    \ JavaScript 解释器忽略它们。JavaScript 提供了两种实现方式。\n\n+   - 符号 `//`（两个正斜杠）告诉 JavaScript\
