    \n图 4.2 **while** 循环的工作原理\n\n### 活动 4.2\n\n**Activity_7.4.2** 包含你在活动 3.4 中被要求编写的密码更改程序的副本。修改该程序，使其反复提示你输入新密码，然后重新输入，直到两次输入匹配为止。随后显示一条消息，告知你密码已更改。\n\
