    \ code, coming between the lines\n\n`<SCRIPT LANGUAGE = \"JavaScript\"> and </SCRIPT>.`\n\
    \nBecause we do not want you to have to repeatedly type the same lines of HTML,\
    \ we have provided you with template files containing the necessary HTML code\
    \ for each of the programming activities in the course text. If you want to experiment\
    \ with your own programs, we suggest that you copy and paste the required HTML\
    \ code into your new program files.\n\n### ACTIVITY 2.2 \n\n![563dcadf5ae68219c0c3dfb03c7cc823\
    \ 10](img/563dcadf5ae68219c0c3dfb03c7cc823_10_0.png)\n\nIn this activity, we want\
