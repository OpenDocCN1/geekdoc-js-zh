    # # 2 Getting started


    In this section, you will be writing some simple programs, which will enable you
    (or some other user) to input data via the mouse and keyboard, perform some simple
    processing on the data and then display the results of the processing.


    Specifically, this section aims to:


    +   - describe how to write a program to display information;

    - discuss the concept of a programming variable;

    - discuss the concept of data types, with reference to numbers and strings, together
    with some operations on them (arithmetical operations on numbers; concatenation
    of strings);

    - describe how to use a dialogue box to obtain input into a program;

    - discuss how to transform input data into numbers, where appropriate.


    # # 2.1 First program


    JavaScript, as its name suggests, is a **scripting language**. This means that
    programs written in JavaScript cannot be run on their own, but have to be run
    within some application, such as a web browser. (Most high-level programming languages
    are not scripting languages, and do not require an additional application in which
    to run; they are simply compiled or interpreted as explained in Unit 6.)


    You will recall from Unit 6 that JavaScript is an interpreted language. A browser
    such as Netscape, which has an embedded JavaScript interpreter, takes your JavaScript
    statements and interprets them, i.e. it translates them into machine code instructions
    and executes them instruction by instruction.


    **ACTIVITY 2.1**


    **In this activity, you will run a program and study its source code.**


    **(a) Run Program_7.2.1.**


    **You should see a browser window opening on your screen with the following message:**


    `Welcome to programming!`


    ![](img/563dcadf5ae68219c0c3dfb03c7cc823_8_0.png)


    **M150 CD-ROM**


    The Block 2 Software Guide tells you how to find, read and run programs which
    we have supplied.'
