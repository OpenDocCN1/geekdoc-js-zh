    \ 中不是有效的操作符（它在一些其他编程语言中使用，有时在数学中使用）。在 JavaScript 中，\"不等于\"的符号是 !=。\n-   (d) 应该是\n\
    \    `if (mark == 100) ....`\n    在 JavaScript 中，= 是赋值操作符；用于相等比较的操作符是 ==。\n- \
    \  (e) 应该是\n    `if ((mark1 < 50) && (mark2 < mark1)) ....`\n    在 JavaScript\
    \ 中 `and` 不是有效的操作符。JavaScript 中逻辑运算符 AND 的符号是 &&。\n\n### 3.5 小结\n\n在本节中，我们讨论了如何编写一种程序结构，有时称为条件语句，它使程序根据以布尔表达式表示的条件的值在不同的操作路径之间进行选择。在\
    \ JavaScript 中，这样一种结构是 `if` 语句。我们使用了比较运算符（`<`、`<=`、`>`、`>=`、`==`、`!=`）和布尔运算符 NOT、OR、AND（在\
    \ JavaScript 中分别用 `!`、`||` 和 `&&` 表示）来构造布尔表达式。\n\n你学习了 JavaScript 中的复合语句（使用大括号将多条语句组合成一条语句）和嵌套条件语句。我们还讨论了注释的使用以使代码更易读，以及测试程序的重要性。\n"
