    `map` 函数是 JavaScript 中最有用、最强大的函数之一，广泛应用于函数式编程中，用于转换数据。


    ## 过滤


    `filter` 函数用于创建一个新数组，其中包含原数组中所有通过回调函数指定测试的元素。新数组仅包含满足回调函数中指定条件的元素。


    以下是一个简单示例：


    ![](img/image_rsrcM1.jpg)


    在此示例中，`filter` 函数用于创建一个新数组 `evenNumbers`，该数组仅包含 `numbers` 数组中的偶数。


    `filter` 函数接受一个回调函数作为参数。该函数会为数组中的每个元素调用，并应返回一个布尔值，指示该元素是否应包含在新数组中。回调函数最多可接受三个参数：当前元素、元素索引和数组本身。例如：


    ![](img/image_rsrcM2.jpg)


    在此示例中，`filter` 函数用于创建一个新数组 `fruitsWithE`，该数组仅包含 `fruits` 数组中包含字母 "e" 的水果。回调函数在测试水果是否包含字母
    "e" 并返回布尔值之前，会打印每个水果及其索引。


    `filter` 函数是 JavaScript 中最有用、最强大的函数之一，广泛应用于函数式编程中，用于过滤数据。


    ## 归约


    `reduce` 函数用于将数组的所有元素归约为单个值。它对数组的每个元素执行一个回调函数，将累加器和当前元素作为参数传递，并返回一个累加值，该值是对每个元素执行回调函数的结果。


    以下是一个简单示例：


    ![](img/image_rsrcM3.jpg)


    在此示例中，`reduce` 函数用于对 `numbers` 数组中的所有数字求和。回调函数接受两个参数：累加器和当前元素。在第一次迭代中，累加器是作为第二个参数传递的初始值（零），当前元素是数组的第一个元素（1）。在第二次迭代中，累加器是初始值与第一个元素之和（1+2=3），当前元素是数组的第二个元素（2），依此类推。最终结果是数组中所有元素的总和。


    `reduce` 函数还可以接受一个可选的第三个参数，即累加器的初始值。如果未提供此参数，则数组的第一个元素将用作初始值。


    ![](img/image_rsrcM4.jpg)


    在此示例中，`reduce` 函数用于计算 `numbers` 数组中所有数字的乘积。由于未提供初始值，数组的第一个元素（1）被用作累加器的初始值。


    `reduce` 函数是 JavaScript 中最强大、最灵活的函数之一，广泛应用于函数式编程中，用于转换数据并对数组执行复杂操作。


    # 短路求值


    短路求值是 JavaScript（以及其他编程语言）中的一种技术，它允许在确定结果后立即停止计算逻辑表达式，而无需计算整个表达式。这是因为 JavaScript
    中的逻辑运算符 AND（`&&`）和 OR（`||`）正是以这种方式实现的。


    逻辑运算符 AND 仅在两个表达式都为 `true` 时返回 `true`。如果第一个表达式为 `false`，则结果为 `false`，并且不会计算第二个表达式。例如：


    ![](img/image_rsrcM5.jpg)


    在这种情况下，如果第一个表达式为 `false`（如果 `x` 不大于 0），则不会计算第二个表达式。


    逻辑运算符 OR 在至少一个表达式为 `true` 时返回 `true`。如果第一个表达式为 `true`，则结果为 `true`，并且不会计算第二个表达式。例如：


    ![](img/image_rsrcM6.jpg)


    在这种情况下，不会计算第二个表达式，因为第一个表达式（`y`）为 `false`（`null`）。


    短路求值技术可用于提高代码性能，并在某些情况下使代码更易读。然而，务必谨慎使用，并确保程序逻辑正确。


    ## 函数中的短路求值


    短路求值也可以与 JavaScript 中的函数一起使用。在某些情况下，可以使用此技术来提高代码性能或避免错误。


    例如，假设你有一个函数，它接收一个对象作为参数，并且需要在访问某个属性之前检查该属性是否存在于对象中。你可以编写以下代码：


    ![](img/image_rsrcM7.jpg)


    在这种情况下，逻辑表达式 `object && object.property` 使用短路求值来确保仅当 `object` 存在且 `property` 也存在时，才执行
    `if` 语句内的代码。


    短路求值有用的另一个示例是，当你需要为变量或函数参数设置默认值时。你可以使用逻辑 OR 运算符来设置默认值，而不是使用 `if`/`else` 语句检查变量或参数是否为
    `undefined`：


    ![](img/image_rsrcM8.jpg)


    在这种情况下，如果 `options.defaultValue` 的值为 `undefined`，则将使用默认值。


