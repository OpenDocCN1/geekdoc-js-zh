    The `map` function is one of the most useful and powerful functions in JavaScript,
    and is widely used in functional programming to transform data.


    ## Filter


    The `filter` function is used to create a new array with all elements of the original
    array that pass a test specified by a callback function. The new array will only
    contain elements that satisfy the condition specified in the callback function.


    Here''s a simple example:


    ![](image_rsrcM1.jpg)


    In this example, the `filter` function is used to create a new array `evenNumbers`
    that contains only the even numbers from the `numbers` array.


    The `filter` function takes a callback function as an argument. This function
    is called for each element in the array and should return a boolean value that
    indicates whether the element should be included in the new array. The callback
    function can have up to three arguments: the current element, the index of the
    element, and the array itself. For example:


    ![](image_rsrcM2.jpg)


    In this example, the `filter` function is used to create a new array `fruitsWithE`
    that contains only the fruits from the `fruits` array that contain the letter
    "e". The callback function prints each fruit and its index before testing whether
    the fruit contains the letter "e" and returning a boolean value.


    The `filter` function is one of the most useful and powerful functions in JavaScript
    and is widely used in functional programming to filter data.


    ## Reduce


    The `reduce` function is used to reduce all the elements of an array to a single
    value. It executes a callback function for each element of the array, passing
    an accumulator and the current element as arguments, and returns an accumulated
    value that results from the execution of the callback function on each element.


    Here''s a simple example:


    ![](image_rsrcM3.jpg)


    In this example, the `reduce` function is used to sum all the numbers in the `numbers`
    array. The callback function takes two arguments: the accumulator and the current
    element. In the first iteration, the accumulator is the initial value passed as
    the second argument (zero) and the current element is the first element of the
    array (1). In the second iteration, the accumulator is the sum of the initial
    value and the first element (1+2=3) and the current element is the second element
    of the array (2), and so on. The final result is the sum of all the elements in
    the array.


    The `reduce` function can also take an optional third argument, which is the initial
    value of the accumulator. If this argument is not provided, the first element
    of the array will be used as the initial value.


    ![](image_rsrcM4.jpg)


    In this example, the `reduce` function is used to calculate the product of all
    the numbers in the `numbers` array. Since no initial value is provided, the first
    element of the array (1) is used as the initial value of the accumulator.


    The `reduce` function is one of the most powerful and flexible functions in JavaScript,
    and it is widely used in functional programming to transform data and perform
    complex operations on arrays.


    # Short-circuit Evaluation


    Short-circuit evaluation is a technique in JavaScript (and other programming languages)
    that allows for evaluating a logical expression by stopping as soon as the result
    can be determined, without the need to evaluate the entire expression. This is
    possible because the logical operators AND (`&&`) and OR (`||`) are implemented
    this way in JavaScript.


    The logical operator AND returns `true` only if both expressions are `true`. If
    the first expression is `false`, the result is `false` and the second expression
    is not evaluated. For example:


    ![](image_rsrcM5.jpg)


    In this case, the second expression is not evaluated if the first expression is
    `false` (if `x` is not greater than 0).


    The logical operator OR returns `true` if at least one of the expressions is `true`.
    If the first expression is `true`, the result is `true` and the second expression
    is not evaluated. For example:


    ![](image_rsrcM6.jpg)


    In this case, the second expression is not evaluated because the first expression
    (`y`) is `false` (`null`).


    The short-circuit evaluation technique can be useful for improving code performance
    and making it more readable in certain situations. However, it is important to
    use it with care and ensure that the program logic is correct.


    ## Short-circuit Evaluation em Funções


    Short-circuit evaluation can also be used with functions in JavaScript. In some
    cases, it is possible to use this technique to improve code performance or avoid
    errors.


    For example, imagine you have a function that receives an object as a parameter
    and needs to check if a certain property exists in the object before accessing
    it. You could write the following code:


    ![](image_rsrcM7.jpg)


    In this case, the logical expression `object && object.property` uses short-circuit
    evaluation to ensure that the code inside the `if` statement is only executed
    if the `object` exists and the `property` also exists.


    Another example where short-circuit evaluation can be useful is when you need
    to set a default value for a variable or function parameter. Instead of using
    an `if`/`else` statement to check if the variable or parameter is `undefined`,
    you can use the logical OR operator to set a default value:


    ![](image_rsrcM8.jpg)


    In this case, if the value of `options.defaultValue` is `undefined`, the default
    value will be used instead.


    # About the Author


    Ruhan Conceição graduated in Computer Engineering (2015) from the Federal University
    of Pelotas and has a Master''s degree in Computing (2016) from the same university.
    Since 2018, he has been a professor at the Federal Institute of Education, Science
    and Technology of Rio Grande do Sul in the field of Informatics, where he teaches,
    among other subjects, Object Oriented Programming, Visual Programming, and Mobile
    Devices Programming.


    In 2014, while still an undergraduate student, Ruhan received the title of Gaúcho
    Researcher in the Young Innovator category due to his academic and scientific
    trajectory during his years at the university. His research topic has always been
    related to the algorithmic development of efficient solutions for real-time video
    coding. Regarding scientific research, Ruhan has accumulated dozens of papers
    published in national and international conferences, as well as articles in highly
    relevant scientific journals, and two computer programs registered in the National
    Institute of Intellectual Property.


    Among his hobbies, Ruhan Conceição has a podcast called R-Cast (@rcasttv on social
    media), where he invites guests to talk about various topics, including technology,
    politics, education, health, culture, music, etc.

