    # A brief history of JavaScript


    JavaScript is a high-level programming language that was created in 1995 by Brendan
    Eich, then an engineer at Netscape. The initial idea was to create a programming
    language that could be executed in the browser and allow developers to add interactivity
    and dynamism to web pages.


    The first version of JavaScript was released along with the Netscape Navigator
    2.0 browser in September 1995. The language was quickly adopted by other browsers,
    such as Microsoft''s Internet Explorer, and became one of the main technologies
    used in creating dynamic web pages.


    Over the years, JavaScript has evolved and become an increasingly powerful language
    capable of performing complex tasks both in the browser and on the server. In
    2009, Ryan Dahl created Node.js, a platform that allows developers to run JavaScript
    code on the server, opening up a host of new possibilities for the language.


    Currently, JavaScript is one of the most popular programming languages in the
    world, widely used in web applications, mobile apps, games, and other areas. The
    language continues to evolve, with new features and functionalities being regularly
    added to its specifications.


    # Preparing the Programming Setup


    ## Installing Node.js


    To install Node.js, first go to the website https://nodejs.org/ and download the
    LTS (Long Time Support) version.


    The image below shows a screenshot of the Node.js page, and the arrow indicates
    the option to be selected to download the LTS version.


    After downloading, the installation process of Node.js is very similar to any
    other application, without any major mysteries (:


    ![](image_rsrcJK.jpg)


    ## Installing Visual Studio Code


    As a source code editor, I suggest Visual Studio Code (VS Code) because it is
    cross-platform, free, and extensible.


    To download this editor, go to https://code.visualstudio.com/ and click on the
    button as indicated in the figure below.


    Like Node.js, the installation process of VS Code does not require any knowledge
    beyond the conventional to install the new program on your computer.


    ![](image_rsrcJM.jpg)


    # Modules in JavaScript


    In Node.js, modules are files that contain JavaScript code that can be reused
    in different parts of a program. Each module is an independent unit of code that
    can be imported or exported to other parts of the program, making the code more
    modular and easy to maintain.


    Modules in Node.js are organized in a CommonJS module system, which defines how
    modules can be defined, loaded, and exported. Each module has its own scope, meaning
    the variables and functions defined in a module are not visible outside of it
    unless they are explicitly exported.


    To use a module in a Node.js program, it is necessary to import it using the `require()`
    function. For example, to use the `fs` module, which is used to perform file read
    and write operations, simply use the following code:


    ![](image_rsrcJN.jpg)


    The `require()` function is a synchronous function that loads the specified module
    and returns the object exported by it. It is possible to export values from a
    module using the `module.exports` variable, which is a special property of the
    module object. For example, to export a function in a module, simply do the following:


    ![](image_rsrcJP.jpg)


    To import the `sayHello()` function in another file, just use the `require()`
    and access the `sayHello` property of the imported object:


    ![](image_rsrcJR.jpg)


    This way, modules in Node.js allow developers to organize and reuse code more
    efficiently, making it easier to maintain and develop more complex applications.


    # NPM e NPX


    The Node.js package manager is NPM (Node Package Manager), which is used to install,
    manage, and share software packages and modules written in JavaScript. It comes
    included with Node.js and is used by developers around the world to manage their
    project dependencies.


    NPM allows you to install packages globally or locally to a specific project.
    To install a package locally, simply navigate to the root directory of your project
    and run the following command in the terminal:


    ![](image_rsrcJS.jpg)


    This will install the package in the `node_modules` directory of your project
    and add an entry in the `package.json` file to track your project''s dependencies.


    On the other hand, `npx` is a utility that was introduced in NPM from version
    5.2.0. It allows you to run packages directly without having to install them globally
    on your system or locally in the project.


    `npx` downloads the requested package and runs it immediately, instead of installing
    it permanently in your system or project. This is useful when you need to run
    a package only once or when you want to test a package without installing it permanently.


    For example, if you want to run a script in the `create-react-app` package using
    `npx`, simply type the following command:


    ![](image_rsrcJT.jpg)


    This will download and execute the `create-react-app` package with the argument
    `my-app`, creating a new React application in the `my-app` directory.


    In summary, NPM is used to manage the dependencies of your project, while `npx`
    is used to execute packages without installing them globally or locally. Both
    are useful tools for JavaScript development.


    # First Steps in JavaScript


    First, create a folder to develop your Node.js project and then launch VS Code.
    In the editor, click on File > Open Folder and open the folder you just created.
    In the example, the folder I created is called `ProjetoNode`.


    On the left, click New File and then name it `helloworld.js`. In this file, add
    the following code:


    ```

    console.log("Hello World")

    ```


    Then, click Terminal > New Terminal to open a new terminal instance within VS
    Code, and enter the following command:


    ```

    node helloworld.js

    ```


    If everything goes well, the following sentence will appear in the terminal: Hello
    World.


    # Advantages of Node.js


    One of the major advantages of Node.js is the ease of developing server-side applications.
    To see this in action, create a new file in VS Code called `server.js` and insert
    the following code lines:


    ![](image_rsrcJU.jpg)


    So, in the terminal, run the following command:


    ```

    node server.js

    ```


    You are now running an HTTP server in Node.js that will listen for requests on
    port 8080. To access the local server, simply go to the following link http://localhost:8080
    in your browser.


