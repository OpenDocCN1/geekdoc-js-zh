    and needs to check if a certain property exists in the object before accessing
    it. You could write the following code:


    ![](image_rsrcM7.jpg)


    In this case, the logical expression object && object.property uses short-circuit
    evaluation to ensure that the code inside the if statement is only executed if
    the object exists and the property also exists.


    Another example where short-circuit evaluation can be useful is when you need
    to set a default value for a variable or function parameter. Instead of using
    an if/else statement to check if the variable or parameter is undefined, you can
    use the logical OR operator to set a default value:


    ![](image_rsrcM8.jpg)


    In this case, if the value of options.defaultValue is undefined, the default value
    will be used instead.


