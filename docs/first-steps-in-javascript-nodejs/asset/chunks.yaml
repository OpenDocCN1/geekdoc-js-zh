    The `var` keyword was the old way of declaring variables in JavaScript, but it
    is still supported in newer versions of the language. Variables declared with
    `var` have function or global scope.


    The `let` keyword is used to declare variables with block scope, which means they
    can only be accessed within the block they were declared in.


    The `const` keyword is used to declare constants, which are values that cannot
    be changed after they are assigned.


    It is important to remember that in JavaScript, variables are dynamically typed,
    which means you do not need to declare the variable type beforehand. The variable
    type is automatically defined during program execution, based on the value assigned
    to the variable.


    # Data Types in JavaScript


    In JavaScript, there are six primitive data types:


    number: represents numbers, including integers and floating point numbers. For
    example, 10, 3.14, -5.


    string: represents a sequence of characters. It can be delimited by single or
    double quotes. For example, `"Hello, world!"`, `''JavaScript''`.


    boolean: represents a logical value `true` or `false`.


    `null`: represents a null value, i.e., absence of value.


    `undefined`: represents a variable that has been declared but not yet assigned
    a value.


    symbol: represents a unique and immutable value that can be used as an identifier
    for object properties.


    In addition to these six primitive types, in JavaScript, there are also two complex
    data types:


    object: represents a collection of key-value pairs. Objects in JavaScript can
    contain properties and methods. For example, `{ name: ''John'', age: 25 }`.


    function: is a special type of object that can be called and can have properties
    and methods associated with it. Functions in JavaScript are used to define blocks
    of code that can be called anywhere in the program.


    It is important to remember that in JavaScript, variables are dynamically typed,
    which means that the type of the variable is automatically defined during program
    execution, based on the value assigned to the variable. Additionally, variables
    can change type during program execution. For example, a variable that contains
    a number can be later assigned with a string.


    # Mathematics in JavaScript


    JavaScript supports a wide variety of mathematical operations, including basic
    arithmetic operations such as addition, subtraction, multiplication, and division.
    Additionally, it is also possible to perform more complex operations such as trigonometric,
    exponential, and logarithmic calculations.


    Here are some examples of mathematical operations in JavaScript:


    ![](image_rsrcJW.jpg)


    In addition, JavaScript also provides a variety of predefined mathematical functions
    in the `Math` object. These functions include, among others, `Math.floor()` for
    rounding down, `Math.ceil()` for rounding up, and `Math.random()` for generating
    a random number between 0 and 1.


    ![](image_rsrcJX.jpg)


    These are just a few examples of the many mathematical operations that can be
    performed in JavaScript.


    # Strings in JavaScript


    In JavaScript, a string is a sequence of characters, such as `"Hello, world!"`.
    Strings are one of the primitive data types in JavaScript and are created using
    single or double quotes.


    Here''s an example of a string in JavaScript:


    ![](image_rsrcJY.jpg)


    ## Representation of Strings


    In JavaScript, there are two main ways to represent strings: with double quotes
    and with single quotes. Both forms are equivalent and you can choose which one
    to use according to your personal preferences or the conventions adopted by the
    project or team.


    For example, the following lines of code create a string with double quotes and
    a string with single quotes:


