  md: '# Addressing browser incompatibilities with CSS fixes


    The majority of the problems facing web designers and Internet Explorer 6 are
    the rendering problems this (and to a certain degree, Internet Explorer 7) introduces.
    The source of these inconsistencies stem from a few places: a CSS box model than
    other applications, with floated elements, and lack of support for transparent
    PNGs and some CSS properties.


    In Lesson 8, you were introduced to conditional comments. Remember that a conditional
    comment is a unique style sheet that targets Explorer browsers (the style sheet
    is called iefixes.css in the exercise from Lesson 8). Using this method, you would
    first develop your layout in a browser such as Internet Explorer 8 or 9 (PC),
    Mozilla Firefox (Mac/PC), Apple Safari (Mac/PC), or Google Chrome (Mac/PC). After
    you finish your layout, you could test it in Internet Explorer 6 and 7 using any
    of the methods listed in the subsections above.


    After identifying any issues that appear in IE 6 (or 7), you would first find
    a solution and add a modified CSS to the iefixes.css style sheet. Although the
    majority of issues are IE 6 related, you might also find that IE7 has rendering
    problems (to a lesser degree). You can also add conditional comments to IE7. You
    will do a hands-on exercise with this later in,, but first you should review the
    structure of conditional comments. The conditional comment you added in the last
    one was:


    ```

    <!--[if IE>

    <link href="iefixes.css" rel="stylesheet" type="text/css">

    <![endif]-->

    ```


    In this conditional, you instruct all versions of Internet Explorer to use the
    style sheet iefixes.css. However, this comment doesn''t distinguish between the
    different versions of the browser, and what that resolves a problem in Internet
    Explorer 6 could create a problem in the newer version of browser. In this case,
    you could use a more specific conditional comment:


    ```

    <!--[if IE 6]>

    <link href="iefixes.css" rel="stylesheet" type="text/css">

    <![endif]-->

    ```


    In this conditional you are targeting only Internet Explorer 6, but none of the
    other IE browsers. There are several conditional comment operators that let you
    be specific regarding the browsers with your style sheet. For example, you could
    have CSS fixes that only apply to Internet Explorer 7 and below (6, 5, 3, etc.).
    Such a conditional comment would appear as shown below:


    ```

    <!--[if lte IE7]>

    <link href="iefixes.css" rel="stylesheet" type="text/css">

    <![endif]-->

    ```


    This example uses the lte operator, which means less than or equal to. This is
    a style sheet that you would use for browser versions 7 below.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Conditional Comment Operators


    Conditional Comment operators can be complicated, but you are only likely to use
    them when you have a high priority need to target specific versions of Internet
    Explorer.


    Operator Description


    | IE | Description |

    | --- | --- |

    | IE | represents Internet Explorer; if a number value is also specified, it represents
    the browser version |

    | lt | less than |

