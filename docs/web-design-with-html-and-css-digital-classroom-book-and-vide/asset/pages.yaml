  md: "# Working with a CSS reset file\n\nBefore you start your page layout, you will\
    \ learn to use a CSS reset file. In Lesson 4, you learned that virtually HTML\
    \ elements (such as paragraphs and headings) have default styles rendered by the\
    \ browser. For example, the 1 default style has top and bottom margins of 10 pixels.\
    \ If you want to style a heading so there is no margin, you must explicitly set\
    \ the style rules to zero.\n\n![](img/89ff5fabf61426c3441d5d5c6a41600b_157_0.png)\n\
    \n![](img/89ff5fabf61426c3441d5d5c6a41600b_157_1.png)\n\nOn the left is a heading\
    \ 1 with default margins of 10 pixels. On the right is a heading 1 with the margins\
    \ set to zero.\n\nThe CSS rule for setting the margins to zero is as follows:\n\
    \n```\nh1 {\n  margin-top: 0px;\n  margin-bottom: 0px;\n}\n```\n\nAll HTML elements\
    \ have default margins; unfortunately, browsers use their own rules for rendering\
    \ content, and interpret the appearance of these margins differently. For example,\
    \ the 10-pixel margin in browser A might be 15 pixels in browser B. These differences\
    \ can introduce inconsistencies in your page layouts. Fortunately, you can use\
    \ the CSS reset file to remove the default styles from the most commonly used\
    \ HTML elements. With the CSS reset, you have a reliable and consistent foundation\
    \ on which to base your styles. To get a better sense of how style works, open\
    \ a page that contains a number of default styles and link the CSS reset style\
    \ to this page.\n\n+   1. In your text editor, choose File > Open. In the dialog\
    \ that appears, navigate to the web0lessons folder, choose the 07_reset.html file,\
    \ and click Open.\nThis file has a number of generic HTML elements, such as headings,\
    \ paragraphs, lists, and forms; it has no CSS styles.\n2. Preview the page in\
    \ your web browser and notice the space between the headings as well as the appearance\
    \ of the lists and for. Add a link to your CSS reset style to see how this affects\
    \ the appearance of these elements. Close your web browser and return to your\
    \ text editor."
