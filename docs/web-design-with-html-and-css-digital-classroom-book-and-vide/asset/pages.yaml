    # CSS3 features


    The radius property covered in the last exercise is one of many new features available
    for use. Other CSS3 features that are always depending on the browser you are
    using are drop shadows (currently designated as text-shadow), multiple background
    images, the RGBA color standard (which allows you to use the opacity of colors),
    web fonts (the ability to embed custom fonts into a page), multi-column layout,
    animation, and much more.


    # CSS3 Resources


    +   * www.whatuse.com/litmus/

    * A useful site that identifies the browsers you are using and its support for
    CSS3 properties, provides you with a chart listing more than a dozen current and
    old browsers and their support for CSS3 properties.

    * www.css3.info

    * This site has a CSS Preview section demonstrating CSS3 features available in
    browsers today as well as a blog that tracks developments, books and articles
    related to CSS3.

    * www.alistapart.com/articles/understanding-css-3-transitions/

    * An introductory tutorial to CSS3 transitions which provide the fundamental basis
    for animation using CSS instead of Flash or JavaScript.


    With the number of current browsers in use today that do not support CSS3 features,
    you should consider adding these features to your site. You will also need to
    learn the vendor-specific properties (such as the -moz border-radius used in the
    previous exercise) so you can use them in your sites. Lesson 11 examines the use
    of CSS3 with mobile design and CSS3 media queries.'
