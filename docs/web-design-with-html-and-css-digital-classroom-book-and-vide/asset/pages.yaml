  md: '# Working with absolute positioning


    You need to place a large splash image in the main column and place it below your

    heading 1 (currently labeled SmoothieWorld is your #1 destination for smoothie
    recipes). You can

    create this layered effect of text on an image in several ways, but nothing you
    have learned

    uo this point would be ideal. The following paragraphs describe the methods you
    have

    learned, and explain why they would not work.


    # Method 1


    Open Photoshop, add a text layer to your splash image, and save it as an optimized
    web

    graphic. The problems with this method are:


    +   * Text in a graphic becomes invisible to search engines.

    * You lose accessibility for other devices, such as screen readers.

    * The method is inefficient when updating text, since it requires access to the
    original

    Photoshop file.


    # Method 2


    Place the splash image as a background image in the maincolumn and position the

    heading 1 over it. The problems with this method are:


    +   * CSS background images are to be used as decoration, not as replacement for
    content.

    * You can only use one background image for any given div; multiple background

    images are not possible in CSS.


    The method you will learn in this subsection takes advantage of relative and absolute

    positioning in CSS. Following this method, you will first insert your splash image
    as a

    standard image in HTML and add a new div container for the text. You will then

    position this new center as needed.


    Start by adding the image into the maincontent div, as explained below:


    +   1 Type the code (highlighted in red) between the heading 1 and heading 2 in

    the maincontent div:


    ```

    <h1>SmoothieWorld is your #1 destination for smoothie recipes.</h1>

    <img src="frontpage_splash.png" width="551" height="270"

    alalt="frontpage_splash" />

    ```


    ```

    <h2>Our mission statement</h2>

    ```


    Save the page and preview it in your browser. The image is located between the
    two

    headings.

    Superimpose the <h1> text on the image (similar to a layer in Photoshop) by wrapping
    a

    new div container around it with the name splash, as indicated below.'
  merge: -1
