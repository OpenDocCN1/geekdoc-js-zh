    # ## How do websites know what browser you are using?


    Whether you are browsing the web on your desktop or a mobile device, there are
    hidden communications taking place between your browser and the server where the
    website is hosted. All browsers identify themselves with a user agent. A user
    agent identifies the visiting browser as Internet Explorer 6, Firefox 3.5, iPhone
    OS 30, and so on. In most cases, information is never used by the website. However,
    you can add user agents to detect your visitors. A detector is a small piece of
    JavaScript code that identifies the user (in this case, visiting browser), and
    then changes the behavior of the website in some way. In some cases, the behavior
    could be drastic as preventing the visiting browser from accessing the website.
    In other cases, code might be used to send the visiting browser a different style
    or redirect the browser to a specific page.


    The user agent can be accessed in JavaScript using the Navigator Object. To learn
    more about the Navigator Object and user agent strings, see www.w3schools.com/jsref/obj_navigator.asp.


    # ## The trouble with style sheets


    A common problem in web design is this discrepancy between how should work and
    how it really works. You saw this in Lesson 9 with issues of browser compatibility.
    Different browsers render the same page differently depending on various factors.
    It is especially the case with mobile browsers. A solution to this problem was
    proposed in 1999 when the original specifications for CSS were developed. Using
    this solution, the browser defaults to the style type when there is no other designation
    for the type of style sheet to use. In other words, code:


    ```

    <link rel="stylesheet" href="base.css" type="text/css" />

    ```


    is the same as code:


    ```

    <link rel="stylesheet" media="all" href="base.css" type="text/css" />

    ```'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'Other media types are available for use: screen, which is the standard for
    desktop monitors; projection; print; handheld;etc.You can use the handheld media
    type by adding the following link to target handheld devices:


    ```

    <link rel="stylesheet" media="handheld" href="smallscreen.css"

    type="text/css" />

    ```


    In some cases, you can create a separate style sheet and attach it to your pages
    so that certain handheld devices use this style sheet alone. However, mobile web
    browsers have not traditionally done a good job with these style sheets, and in
    some cases, they will ignore or interpret them in different ways. An even greater
    issue is that some of the most popular and high-profile mobile web browsers do
    not announce themselves as handheld devices at all, so a line of code like the
    one indicated above would not work.


    # Using CSS3 media queries


    When media types don''t work, you can use media queries in CSS3 to recognize devices
    that are visiting your website. Instead of looking for a device that announces
    itself as handheld, a media query looks at the capability of the device, and then
    allows you to send it styles based on certain values. For example, the media query
    might look for the width and height of the browser window, the device width and
    height, the device orientation (landscape or portrait), and the resolution, among
    other things.


    When the user has a mobile browser that supports media queries, you can write
    CSS specifically for certain situations, for example, to detect whether the user
    has a small device such as a smartphone. To understand how this works, you will
    create styles for the mobile-optimized version of the Smoothie World site.'
  merge: -1
