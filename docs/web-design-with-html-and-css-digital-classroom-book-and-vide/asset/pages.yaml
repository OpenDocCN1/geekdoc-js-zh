  md: '# Tools to identify browser problems


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_223_0.png)


    To this issue, the first solution would be to replace this image with another
    file format. The GIF format also supports transparency to a degree, but not as
    well as PNG files.


    > PNG supports a form of transparency called alpha transparency. This means that
    areas that have less than 50% opacity remain transparent. The GIF format only
    renders anything that is less than 50% opacity as a solid color.


    Modifying your images to address the PNG transparency issue is possible, but it
    can be inefficient. You would need to identify all graphics that use transparency
    and then change them, and it sacrifices the use of interesting visual effects
    in modern browsers not available in Internet Explorer 6. However, given that Internet
    Explorer 6 is approaching its 10-year anniversary, designers and developers have
    adopted solutions to this problem. A few JavaScript solutions exist that forces
    Internet Explorer 6 to render transparent PNGs as they were used in a newer browser.
    You could add a reference to this javascript file to IE6 to show all images that
    use PNG as intended.


    > The solution we recommend for the transparent PNG is named DD_belatedPNG. The
    explanation on how it works is beyond the scope of this book. For details and
    instructions on its use, go to: http://www.dillerdesign.com/experiment/DD_belatedPNG/.


    # Browser incompatibilities in the future


