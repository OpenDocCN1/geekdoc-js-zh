  md: 'As you can see, jQuery allows different options for your designs.The ability
    to show and hide animated elements is just one thing you can do with this library.The
    best way to learn about jQuery is to go online to the source at jquery.com or
    to explore other resources.


    # Taking jQuery further


    jQuery and other similar JavaScript libraries are now used with increasing frequency
    on modern websites. User interface elements as drop-down or accordion menus are
    examples of these effects. However, you will also find jQuery used in slide shows,
    forms, multimedia, and much more.


    As you explore jQuery, you will find that it supports plug-ins, which are sets
    of additional code that rely on some functionality in jQuery and then build upon
    it. For example, in the previous exercise, the ability to control the speed of
    the box was limited.You could choose to start expanding the box slowly and then
    speed the expansion as it reached the end. In animation, this is referred to as
    easing, and jQuery plugins have been created that give designers access to these
    effects.


    Adding plug-ins involves adding another external JavaScript file to your site
    and linking to it. This adds new functions that you can refer to in your HTML.
    For more information on plugins as well as documentation and examples, go to http://plugins.jquery.com.


    # Adobe Flash overview


    Adobe Flash was developed in the 1990s as a web technology that could perform
    tasks HTML and JavaScript could not, especially animated movies. Design elements
    as layout, text, animation, and sound were relatively easy to add to Flash projects.
    In addition, the interactive aspects of Flash gave designers another way to engage
    web users, and Flash was used for online presentations, games, and advertisements.
    Flash is still used for these purposes, but it has become a true platform with
    the addition of more complex features. Today, Flash delivers video, connects to
    databases for web-based applications, and is making an entry into the mobile device
    world.'
  merge: -1
