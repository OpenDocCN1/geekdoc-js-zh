  md: '# Understanding Dithering


    Dithering is the attempt to approximate a color from a mixture of other colors
    when the required color is not available. Dithering produces a pattern or grainy
    appearance in images, and should only be used to define tonal values.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_113_0.png)


    Original image (left), and with dithering applied (right).


    +   5 Keep this window open for the next part of this lesson.'
