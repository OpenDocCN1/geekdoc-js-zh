  md: '# The details of XHTML syntax


    There is little fundamental difference between HTML 4.0 and XHTML 1.0—the two
    standards previously released by the W3C (World Wide Web Consortium). As XHTML
    defined, it was created so that pages written in XHTML also work in browsers that
    render current HTML. The tags and attributes of HTML and XHTML remained the same,
    but the syntax of XHTML code is more strict.The most significant differences between
    XHTML and HTML are as follows:


    +   - In XHTML, all tags are lowercase.

    - XHTML requires all tags to be closed—meaning there must be a tag at the start
    and end of the element being tagged—such as a headline, paragraph, or image.


    All tags in XHTML must close, even special tags that technically don''t require
    an open and close tag. For example the <br> tag creates a line break, uses a special
    self-closing syntax. A tag that self-closes looks like this (with a space and
    a forward slash):


    ```

    <br />

    ```


    +   - XHTML requires proper nesting of tags. In the following example, the <em>
    tag to emphasize text options within the <h1> headline tag. As such, it must be
    closed before the <h1> is closed.

    ```html

    <html>Smoothies are &lt;great!&lt;/em&gt;</html>

    ```


    We use XHTML-compliant code throughout this book as we provide HTML5 examples,
    which helps make your designs compatible with modern browsers and mobile devices.


    # Doctype lets the web browser know what to expect


    The start of every webpage should include a Doctype declaration, telling the Doctype
    tells the web browser a little bit of information about what it is going to see
    on the page. Because there are different specifications for XHTML and HTML the
    web browser knows which language it is to see and render. Because a browser renders
    the page starting at the top of line and then moves down, placing your doctype
    on the first line makes a lot of sense. When it''s not required, it''s good form
    to always use Doctype at the start of HTML pages. The doctype for HTML 4.0.1 likes
    like this:


    ```

    <!DOCTYPE PUBLIC "//W3C//DTD HTML 4.0 Transitional//EN"

    n"http://www.w3.org/TR/html4/loose.dtd">

    ```


    When a web browser sees a doctype declaration, the browser expects that everything
    on the page follows that language. If the page adheres to the specifications perfectly,
    it is considered valid.'
  merge: -1
