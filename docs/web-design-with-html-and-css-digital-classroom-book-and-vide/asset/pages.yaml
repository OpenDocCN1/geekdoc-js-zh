    Definition lists are used less often than ordered and unordered lists. One way
    to think of them is to visualize a list in a dictionary. A dictionary is just
    a big list of words; for any given word there may be many different definitions.
    A definition list has two types of lists: the definition term <dt> and the definition
    description <dd>.


    Add the following code (highlighted in red) to separate this list into terms and
    descriptions:


    ```

    <dt>Preparation time</dt>

    <dd>10 Minutes</dd>

    <dt>Number of servings (12 oz)</dt>

    <dd></dd>

    <dt>Calories per serving</dt>

    <dd>295 if 1 tbs sugar added</dd>

    <dd>315 if 1 tbs honey added</dd>

    </dl>

    ```


    Save the file and preview it in your browser. The definition terms act as a type
    of heading with the definition description indented below. Note that you may have
    multiple descriptions, as you can see in the last definition term for Calories.


    # Styling HTML lists


    You can easily modify the styling for lists with CSS. The indentation and spacing
    of a list (as well as the list items) are controlled by margins and padding. There
    are also few CSS properties that are unique to lists; for example, later in this
    exercise, you will learn how to customize the bullet appearance in the unordered
    list. First, however, it''s important to understand the default styles of both
    the list and the list items. A specific goal of this exercise is to make you aware
    of the differences between margins and padding; these properties are often confused
    by beginners and your future as a web designer will be much happier if you avoid
    this confusion!


    One thing you may have noticed is all your lists are bigger than your paragraphs
    and they also have a different family. This is because you have not set any rules
    for them yet, so they are inheriting their style from the body. As you go through
    styling each list, you will add font-size and other properties as needed.'
