  md: 'If you have multiple floated elements within the same element, they align beside
    each other. This behavior is often used for common web page features such as horizontal
    menus or image galleries.


    Understanding how floated elements interact with each other is crucial to use
    them effectively. Consider the following example: there are six images inside
    a div that is 360 pixels wide. Each image is 50 pixels wide, and has 10 pixels
    of margin space (5 on the left and 5 on the right). By adding the values, you
    can see that 6×50 is 300 pixels for the images and 6 ×10 is 60 pixels of margin.
    Consequently, the images plus the margin fit inside the div, with a total width
    of 360 pixels.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_169_0.png)


    If you have defined an explicit width for the container, adding another image
    causes the new image to break to the next row.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_169_1.png)


    This behavior might work well for a thumbnail image gallery, but not for navigation.


    | Home | About Us | Recipes | Submit a Recipe |

