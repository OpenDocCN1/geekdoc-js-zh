  md: '# The importance of typography on the web


    Typography is two-dimensional architecture; based on experience and imagination,
    and guided by rules and readability. And this is the purpose of typography: The
    arrangement of design elements within a given structure should allow the reader
    to easily focus on the message, without slowing down the speed of his reading.


    > Hermann Zapf


    Typography has a starring role in graphic design, including web design. Most user
    interaction spend a great deal of time on the web scanning, navigating, and reading
    text. As a result, it is extremely important that the web designer understands
    how to control the placement, appearance, and style of text.


    For purposes of clarity, it is worth pointing out that the words typeface and
    font are mistakenly used interchangeably. A typeface is a more abstract term for
    the character design of an alphabet; it is a term that precedes the invention
    of computers and digital typesetting. An example of a common typeface is Helvetica,
    which also includes different styles including Bold, Condensed, and Light, among
    others. A font is the digital system file that resides on a computer and is used
    in print design to set text. In web design, web browsers use a font to display
    text on the screen (as well as when printing).


    # The challenges of fonts on the web


    When designing for the web, you can format text in a way that is similar to desktop
    publishing and word processing applications, but there are important differences
    to keep in mind. When you specify that a specific font be used, font needs to
    be installed on the user''s computer when the web page is rendered on the viewer''s
    computer or device. If the user does not have this font, the browser replaces
    it with another font.


    Because you don''t know what fonts are installed on viewers'' computers, and because
    the web browser of a viewer might substitute fonts, your design intentions might
    not be faithfully reproduced. One option is to use fonts that you are sure will
    be found on most computers. Unfortunately, only a handful of fonts can reliably
    be found on virtually all computers around the world.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Web-safe fonts


    Following is a list of the most reliable fonts for web use:


    +   - Arial

    - Verdana

    - Georgia

    - Times New Roman

    - Courier

    - Trebuchet

    - Lucida

    - Impact


    The list is small because it takes into account both Mac and Windows platforms
    and assumes that there may still be older computer systems that are active and
    accessing the web. These older systems had a more limited font selection than
    today''s systems, and so a designer needs to consider this when choosing fonts.


    The above list is also limited for stylistic reasons. Both Courier and Impact,
    for example, are used frequently although they are widely available, their distinctive
    styles limit their everyday use.


    One of the solutions to the lack of fonts on the web is to use a *font stack*.
    In CSS, a font stack is a list of multiple fonts that the web browser uses to
    display text onscreen. The following CSS code shows an example of a font stack:


    ```

    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;

    ```


    In this example, the browser looks for the Helvetica Neue font on the user''s
    system. Notice the quotation marks in this example. In most cases when specifying
    a font, quotation marks are unnecessary, but in some cases, the quotation marks
    are needed to help the user choose the right version of the font. If the user
    does not Helvetica Neue, then the browser looks for the more generic version of
    Helvetica. If Helvetica is absent, the browser uses Arial, which is a font that
    is extremely similar to Helvetica. If for some reason Arial is not on the system,
    the last choice is sans-serif, which allows the system to use any sans-serif font
    it can find on the system. Sans-serif is the generic definition for all fonts
    that do not have small strokes (called serifs) at the end of each character. Examples
    of serif fonts are Times New Roman and Georgia.'
  merge: -1
