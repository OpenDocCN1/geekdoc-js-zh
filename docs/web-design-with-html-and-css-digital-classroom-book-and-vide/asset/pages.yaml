  md: "# The <video>, and <canvas> elements\n\nThe reasons for these incompatibilities\
    \ are complex and are related to licensing issues for the video and audio codecs\
    \ (the compression techniques used to reduce file size). To use these new tags,\
    \ you should provide multiple versions of your video and audio, thereby allowing\
    \ the browser to choose the first supported format it can find; so a more reliable\
    \ method of providing video might look like this:\n\n```\n<video width=\"400\"\
    \ height=\"300\">\n  <source src=\"catz.mp4\" type=\"video/mp4\" codecs=\"avc1.42E01E,mp40.40\"\
    >\n  <source src=\"catz.ogv\" type=\"video/ogg\" codecs=\"theora, vorbis\">\n\
    </video>\n```\n\nNote that older browsers that do not support the video and audio\
    \ tags will need an alternative way of playing video;currently, the best way to\
    \ provide this capability is to add the option to use Flash video, which is widely\
    \ supported in current and older browsers.\n\n> The documentation for HTML5 is\
    \ updated constantly; however, one of the best online resources is Mark Pilgrim’s\
    \ “Dive into HTML5” resource, located at http://diveintohtml5.org/video.html.\n\
    \n# Provide drawing and animation features using the <canvas> element\n\nThe <canvas>\
    \ element works as a drawing surface on your page. Within this drawing surface,\
    \ you can create shapes, colors, gradients, and pattern fills.\n\n![](img/89ff5fabf61426c3441d5d5c6a41600b_277_0.png)\n\
    \nThis example might be visually unremarkable, but the addition of a native drawing\
    \ format in HTML is notable."
