    on in Lesson 6. Until now, you have added your styles to an internal style sheet
    instead of an external one. When building a layout, using an internal style sheet
    is a matter of convenience: creating and modifying styles is easier to do by scrolling
    up the page than using an external style sheet. Eventually, you will merge the
    layout you have created into an external style sheet. For now, you will attach
    a style sheet that sets the base for elements such as your headings, lists, and
    paragraphs.


    +   1 At the top of your HTML, use the <link> tag for your style sheet. To add
    another style sheet, select this line and press Ctrl + C (Windows) or Command
    + C (Mac OS) to copy it. On the next line, press Ctrl + V (Windows) or Command
    + V (Mac OS) to paste the line. Now replace the value "reset.css" (in highlighted
    in red)


    ```

    <link href="reset.css" rel="stylesheet" type="text/css" />

    <link href="base.css" rel="stylesheet" type="text/css" />

