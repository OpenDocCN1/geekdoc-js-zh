    \n+   Click inside the h1 style and press Ctrl + V (PC) or Command + V (Mac) to\
    \ paste the code. Repeat this step for the h2 style.\n\n+   Save your file and\
    \ refresh in your browser. With the red borders, you can now see the space between\
    \ the elements more clearly.\n\n| SmoothieWorld is your #1 destination for smoothie\
    \ recipes. |\nOur mission statement:We here at SmoothieWorld are devoted to making\
    \ the smoothie beverage a daily part of your life. Whether it be for breakfast,\
