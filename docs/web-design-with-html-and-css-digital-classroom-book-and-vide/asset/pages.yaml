    # Mobile Design


    For the web designer, the World Wide Web is no longer just accessible through
    a desktop web browser. In this lesson, you will learn how to design for the small
    screen sizes and limited bandwidth capabilities of mobile devices.


    # Starting up


    You will work with several files from the web11 lessons folder in this lesson.
    Make sure you have loaded the weblessons folder onto your hard-drive from www.digitalclassroombooks.com/webdesign.
    See "Loading lesson files" in the Starting Up section of this book.


