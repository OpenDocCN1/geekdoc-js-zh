- img_proc: true
  md: '# The many wonders of the background image


    You can find CSS background images everywhere in web design, so you need to understand
    how they work. Following are some of the properties associated with background
    images.


    To tile an image horizontally within the parent container, use the following value:


    ```

    background-repeat:repeat-x;

    ```


    To tile an image vertically, use only this value:


    ```

    background-repeat:repeat-y;

    ```


    To add a single instance of the graphic (in other words, with no tiling), use
    this value:


    ```

    background-repeat:no-repeat;

    ```


    # Background-position


    Another useful property is background-position. The default position for background
    images is the top-left corner of the containing element, as shown in the following
    figure:


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_196_0.png)


    > A background image with the "no-repeat" value.


    You can position this image in the bottom-right corner by adding this property:


    ```

    background-position:right bottom;

    ```


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_196_1.png)


    You can use the keywords left, right, and center to position an image horizontally;
    by combining it with the keywords top, bottom, and center, you can also position
    the image vertically.


    You can position background images even more precisely by using either unit or
    percentage values. The most common unit values are pixels, but you can also use
    other units, such as ems. When using unit values, the first value is the horizontal
    position and the second value is the vertical position, as the following example
    shows:


    ```

    background-position:10px 40px;

    ```


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_196_2.png)


    The background image is positioned 10 pixels horizontally and 40 pixels vertically
    from the top-left corner of the box (box itself is 100 pixels high by 300 pixels
    wide).


    (continues)'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# The many wonders of the background image (continued)


    You can use percentages for background images, particularly if the parent container
    has a flexible width. When using percentage values, the top-left corner is 0%
    and the bottom-right corner is 100% 100%. The following example uses percentages:


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_197_0.png)


    The image above, as indicated by the following code, is positioned 20 percent
    away from the top and 40 percent away from the left:


    ```

    background-position 20% 40%;

    ```


    # Using hacks to solve layout problems


    CSS layouts that rely on floated boxes have unexpected results because various
    browsers render the same content differently. When an elegant solution does not
    exist, you need to resort to *hacks*. A hack is a solution where you use elements
    or properties within HTML or CSS for a purpose other than their intended application.
    You''ll use a hack in the following exercise to properly apply the background
    image that spans across your two columns.


    In the previous exercise, you applied a background image to the `innerwrap` div
    and you defined a height of 450 pixels. The problem with this method is that the
    two columns inside `innerwrap` div are longer than 450 pixels and it''s against
    best practices to have a containing element smaller than its content. To address
    this problem, you will remove the height value and then add new code to make the
    innerwrap work well in any situation.'
