  md: '# Lesson 9


    # What you''ll learn in this lesson:

    * Testing your browser

    * Using different browser testing tools

    * Using conditional comments with Internet Explorer

    * Dealing with future browser compatibility problems


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_212_0.png)


    # Browser Compatibility


    Browser testing is necessary because different web browsers render HTML and CSS
    code differently. In this lesson, learn to determine how much testing is necessary
    for any given project, as well as techniques for fixing browser issues or incompatibilities.


    # Starting up


    You will work with several files from the web09lessons folder in this lesson.
    Make sure you have loaded the weblessons folder onto your hard-drive from www.digitalclassroombooks.com/webdesign.
    See “Loading files” in the Starting Up section of this book.


    > See Lesson 9 in action!

    Use the accompanying video to get a better understanding of how to use some of
    the features shown in this lesson. You can find the video tutorial for this lesson
    at www.digitalclassroombooks.com using the URL provided when you registered your
    book.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Why browser testing is important


    A browser is a program that renders HTML, CSS, and JavaScript files according
    to a set of rules built into the application. Although web browsers use the recommended
    guidelines of the Word Wide Consortium''s specifications for HTML and CSS, they
    can interpret these rules for their own purposes. Browser manufacturers can also
    add their rules to the specifications to add features to their browsers that are
    not available in others.


    # Are web pages required to look the same in all browsers?


    You can divide the answer to this question into two categories: 1) Technical considerations
    and 2) Time/budget considerations.


    In the case of technical considerations, you must determine whether you could
    achieve your goal of making a web page look like. For example, the earliest browsers,
    as Internet Explorer 3 or Netscape 3, do not support cascading style sheets.


    For these browsers, you couldn''t apply the CSS layout techniques you learned
    in the previous lesson. In the case of time/budget considerations, you might find
    techniques to make your pages look the same, but if it takes you more than you
    have allotted to identify and fix the problem you should determine whether the
    solution is worth it.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_213_0.png)


    Your SmoothieWorld in a modern browser (left) versus Net Navigator (right).


    Attempting to make web pages look the same in multiple browsers is not as important
    as you might believe, due to several reasons:


    +   - People browse the way different ways.

    - Monitor resolution. A website on a 17-inch monitor never looks the same as on
    a 27-inch monitor.

    - Text resizing. Users can override the page layout by increasing or decreasing
    text size.

    - Mobile devices, which represent a growing proportion of web browsers.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'Who demands pages look the same or is it something else when there are inherent
    differences? Sometimes, it''s designers with previous experience in the world
    of print design, because they are used to a single version of their work and attempt
    to duplicate it experience with their site. Client expectations are often a factor
    as well, because clients are often technically oriented than the designer, so
    it becomes important for the designer to communicate exactly what will be delivered
    as well as the options.


    # Choose the level of browser support you want


    The level of browser use partly anchors your decision to support it. For example,
    you might find that only 0.5 percent of all browsers are Netscape Navigator 3,
    so you would decide not to spend much time designing for it.


    The choice of which browsers to support becomes more difficult with recent browsers.
    A good example is Internet Explorer 6.This browser was released in 2001, making
    it approximately 10 years old upon publication of this book, yet it still remains
    a relatively popular browser. There are a number of reasons for this: Internet
    Explorer 6 was at one point many websites were designed with IE6 as the standard;
    in some cases, features found in the most popular browser in the world; some estimates
    it a market share of 80-90%. Many were tied directly to the functionality of the
    site.


    > Examples of Microsoft-specific features include DHTML extensions, ActiveX controls,
    and proprietary JavaScript.


    As a designer, this could have an impact on your work. Recent estimates put the
    worldwide market share of Internet Explorer 6 between 15 and 20%; however, this
    number is hard to verify, and the existence of IE6 among your target audience
    could be significantly higher. This scenario is not unusual, many corporate environments
    still use a combination of Windows XP and Internet Explorer 6. If your job is
    to redesign or add to a company''s intranet (an internal website not accessible
    to the public), you would be targeting an audience that mostly uses IE6.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# The special case of IE6


    As noted, Internet Explorer 6 is a 10-year-old browser, Internet Explorer 7 and
    Internet Explorer 8 have been released, and by the time this is published, Internet
    Explorer 9 will likely be on the market. The reasons mentioned in the previous
    paragraph, you should be prepared to support IE6 if required. However, there is
    a trend in web design to stop optimizing for Internet Explorer 6. Companies such
    as Google have publicly stated they will no longer support IE6. For large companies,
    this can free up resources to improve their websites, rather than spend resources
    to solve the layout and other problems that can take time to the development of
    a site.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_215_0.png)


    A visitor to Youtube (owned by Google) will find a targeted message stating that
    Internet Explorer is not supported.


    Additionally, the capabilities of web browsers have improved since 2001, when
    Internet Explorer 6 was released. Modern browsers are faster and support new features
    that users of Internet Explorer 6 will not see. Still, for many websites, it is
    often a business decision. If a client asks for a site that works well in Internet
    Explorer 6, you will need to deliver.


    > Even Microsoft itself has gotten into the business of phasing out their own
    browser. www.ie6countdown.com is a site launched by the company to help designers
    and developers track the decline of the browser.'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'Given an unlimited budget, many clients might choose to support the IE6 audience,
    but if budget and time is limited, you should clearly explain the available options
    and trade-offs to your client. For example, to support IE6 or spend the same time
    and money on optimizing your site to take advantage of modern browsers and the
    growing mobile device market. As you will see in Lessons 11 and 12, we will help
    you frame that argument in our discussions of designing for mobile devices and
    using modern techniques, such as HTML5 and CSS3.


    # Browser Statistics


    Locating an accurate number of the web browsers currently in use today is difficult.
    Individual websites can gather accurate information on their user''s browser version
    (we discuss Lesson 1 in the “Web Analytics” callout). However, websites necessarily
    release this data; therefore, the estimates that you might find online are guesses
    based on available data.Visit one of the sites listed below for an accurate estimate;
    remember that the figures may not apply to your target audience.


    # Resources


    www.stat own.com


    This is a useful site because it tells you the operating system and browser version
    you are currently using.


    http://gs.statcounter.com/


    Includes interactive graphs to help you understand browser trends over time.


    http://www.w3counter.com/globalistats.php


    W3counter offers simple to read and up-to-date browser statistics.


    www.w3schools.com/browsers/browsers_stats.asp


    The statistics from the w3schools.com site are not necessarily representative
    of the “average” web user, but they have been collecting data for years. Their
    site also offers information on how to interpret statistics.'
  merge: -1
