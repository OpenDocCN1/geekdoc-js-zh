  md: 'Soon designers discovered,”they could not rely on the same HTML code for all
    browsers. Designers added "hacks," extra code, to pages, making certain that layouts
    worked in different browsers. Some designers would go so far as create two versions
    of a site, and the appropriate version would be displayed using the browser being
    used by the viewer. Other designers would add badges to their sites, letting viewers
    know that the site performs best with a particular browser. To day you can see
    some sites with notices as “This site is optimized for Internet Explorer” or some
    other browser.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_46_0.png)


    Web pages that were designed to work only in a single browser were taking the
    web in the wrong direction.


    Designers, businesses, and the companies developing browsers eventually discovered
    that inconsistency and proprietary tags that worked only with their browser were
    hurting the user experience and harmful to the vitality and growth of the web.The
    various browser manufacturers have started to recognize the importance of consistency,
    and most are working with the World Web Consortium (W3C) and independent testing
    bodies to validate the compliance of their browser with accepted standards. Browser
    developers now promote their compliance with standards and speed at displaying
    standards-based pages.


    Now that you understand some of the history and concepts behind the web, you''ll
    start to examine some of the HTML code that provide web pages.'
