  md: '# The goals of web design


    they wanted. Drivers can see well-designed road signs from a distance and the
    message of the sign can be immediately understood, even at a high rate of speed
    while driving. A well-designed chair is comfortable to sit in and also fits with
    the style of the room.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_25_0.png)


    A store, a sign, and a chair are all designed with a specific intent.


    In all these cases, the designer took time to plan the outcome using their skill
    and experience, as well as resources such as materials and available budget. Different
    disciplines require different tools. The web designer is often required to organize
    information, give it meaning, and assemble it in a way that is visually attractive
    using available tools.


    When designing for the web, there are some unique challenges compared to other
    disciplines arising from the fact that web design is still in its infancy and
    is evolving rapidly. Even the definition of web design is evolving and difficult
    to define. Originally, web design meant designing pages for a web browser. While
    this is still true, you now need to consider the rapidly evolving nature of mobile
    devices, tablets, smartphones, and consumer electronics that access the web. Some
    people make the distinction between mobile design and web design, but this distinction
    is evaporating as mobile devices are evolving. For many web professionals, this
    rapid evolution of the medium is part of what makes it such an exciting field.


    Although the design of websites is an evolving field, designers do not need to
    reinvent the wheel. Web design''s closest relative is print design, and although
    the two are distinctly it is worthwhile to compare and contrast them.


    # The difference between print design and web design


    Print involves seeing; the web involves doing. Books, magazines, posters, newspapers,
    brochures, and advertisements all contain information, usually text and images,
    whose intent is to deliver some sort of message or content to a reader. More importantly,
    designers often try to build a call to action into their work that makes a customer
    believe there is some action they should be taking as a result of the design.'
