- img_proc: true
  md: '# The need for mobile-optimized websites


    This lesson uses the TextWrangler text editor to create the markup text, but you
    can use any of the text editors covered in Lesson 3.


    # The need for mobile-optimized websites


    Until recently, the way a website displayed on a mobile phone''s browser was only
    a peripheral concern for most web designers. Browsing on mobile devices still
    represents a small percentage of all browsing; however, mobile browsing is growing
    at an astonishing rate. Some estimates put the growth rate at 25 to 30 percent
    each year.


    For estimates of web browsing statistics, see www.marketshare.com.


    To illustrate the growing importance of a site for mobile devices, consider that
    50 percent of mobile users start their activity with a search. If your site appears
    in a mobile search results, you have a unique opportunity to reach them.


    # How is the mobile experience of the web different than the desktop?


    The most obvious answer to this question is screen size. The two most common screen
    resolutions in today for desktop browsing are 1024×768 pixels and 1280×800 pixels.
    Mobile phone resolutions can range from 240×320 (for a non-smartphone) to 640×960
    (for a smartphone). Screen resolution numbers change when you include mobile devices
    such as the first-generation iPad, which has a screen resolution of 1024×768.
    In most cases, a page of content that seems reasonable on the desktop may seem
    too long for a mobile device.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_257_0.png)


    Comparing the screen resolution of a typical desktop screen (left) to a mobile
    screen (right). (This diagram is not to actual size.)'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# The need for mobile-optimized websites


    You also need to take into account screen orientation: for computer monitors,
    the default orientation is horizontal; for mobile phones, it’s vertical. In addition,
    older mobile phones can only display web pages vertically, while newer smartphones
    can rotate the screen from portrait to landscape. There are a number of limitations
    for mobile users, particularly with older devices:


    +   - Most devices are designed to be used with a mouse and keyboard. Modern smartphones
    address this with touch screens and QWERTY keyboards, for many users, navigation
    on a cell phone is limited to arrow keys and numerical keypads.

    - Older mobile web browsers have limited ability to render CSS. For example, they
    might ignore CSS layout as floated divs, but maintain the text styles.

    - Multimedia such as audio, video, and Flash have limited or no support on many
    mobile devices. JavaScript might not be supported.

    - The speed of the mobile phone’s Internet connection is a major factor in the
    user’s experience. In addition to multimedia files, large images can slow down
    the performance of a page.

    - Many mobile devices have limited processing power and memory, which may result
    in incomplete or delayed page rendering. Features such as copy and paste may either
    be missing or limited.


    # Deciding which type of mobile device to target


    Before deciding whether to spend time optimizing your website for mobile devices,
    you should determine the size of your target audience and address their needs
    based on your time and budget. For example, if only two percent of your visitors
    use legacy browsers or 15 percent use smartphones, you would optimize for the
    smartphone first.


    The following figures show the Smoothie-World site as displayed on a desktop computer,
    a legacy mobile browser, and the WebKit-based browser of the iPhone. The layout
    for this figure includes a fixed-width container of 960 pixels, which is centered
    horizontally within the page. This page structure will have some implications
    in all formats.'
  merge: -1
