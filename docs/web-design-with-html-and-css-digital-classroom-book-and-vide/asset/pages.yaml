    \n+   Save and close your file.\n\n# Working with HTML lists\n\nLists are found\
    \ on many web pages and it is important that you learn how to control their appearance.\
    \ Examples of where you might find lists include recipes, frequently asked questions,\
    \ and navigation menus. In this exercise you will learn the three categories of\
    \ lists and how to control their styles. The three categories are unordered lists,\
    \ ordered lists, and definition lists.\n\nUnordered lists are also called bulleted\
    \ lists because the default style adds a bullet to the left of each item in the\
    \ list. Ordered lists are also called numbered lists because the default style\
    \ adds a number to the left of each item in the list. Definition lists have two\
    \ default styles: a bold style for a definition term and an indented style for\
    \ the definition description.\n\n+   In your text editor, choose File > Open and\
