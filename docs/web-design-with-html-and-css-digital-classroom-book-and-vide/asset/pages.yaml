  md: '# Identifying figures and captions


    The <figure> element identifies diagrams, illustrations, and photos used within
    an article, and the <figcaption> element identifies the captions that are often
    paired with these figures.

    <figure><img src="blue_strawberry_smoothie.jpg" alt="Blueberry & Strawberry Smoothie">

    <figcaption>A fresh blueberry and strawberry smoothie</figcaption>

    </figure>


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_279_0.png)


    The figure element in HTML5 provides semantic tags to help identify images and
    their captions.


    # Web forms


    The new form elements in HTML, when implemented, will make working with forms
    quite easily. For example, a common goal of web designers is to create forms that
    require validation before the data is submitted. For example, a user must enter
    a value in the email field for a form submission to be successful. Currently,
    most solutions to this problem require JavaScript or another scripting language.
    HTML5 simply adds the required attribute to the list of form types, as shown below:


    ```

    <input type="email" required>

    ```


    There are many new form inputs, such as (specifically designed for e-mail addresses),
    search (to design form fields with search terms), and url (to specify a form field
    that uses a web address). These new web form elements will take some time to become
    part of the official specification, but they are designed to fall back to generic
    input forms. In other words, you can use these new input types today, and if a
    browser doesn''t support them, the new form element will use a generic (supported)
    element.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# The rest of the HTML5 family


    There are other developing web technologies that are not part of the HTML5 specification
    that deal with markup. However, these technologies are often grouped with HTML5,
    and they let you perform tasks in web browsers and supported mobile devices that
    were not previously possible. The following is an overview of these features.


    # Geolocation


    Geolocation is a feature that allows the web browser''s geographic location to
    be pinpointed. This information is then used to send relevant data based on your
    position. Version 3.5 of Firefox was one of the first browsers to use geolocation
    features. One example of how this could be useful is connect web searches with
    map data; for example, in an unfamiliar city you might search for a restaurant
    within walking distance of your hotel. Rather than entering your address manually,
    a geolocation-enabled browser could deliver your results immediately


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_280_0.png)


    With a browser as Firefox 3.5, you can see geolocation working at www.flickr.com/map.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Web Workers


    The Web Workers framework addresses the issue of browser performance. When you
    access advanced web applications, such as mapping or applications that generate
    charts and graphs instantly, there are a number of processor-intensive computations
    that can slow down the performance of your application. Much of the slideshow
    can be attributed to the competition between the user interaction (clicking, dragging,
    and so on) and the need for the application to access resources (graphics, data,
    and so on).


    Web Workers are scripts that run in a separate thread. This separation means that
    processes such as pulling data from a database can take place independently of
    user behavior and create a more seamless environment for the user.


    # Web Storage


    Web Storage is an upgrade to the current use of browser cookies. This is the process
    that allows a web site to store small pieces of data on your system the site can
    save information for a later date. For example, sites recognize your login information
    before you return are most likely using cookies.


    Cookies are a limited technology and not particularly easy for designers to use;
    Web Storage aims to update the model for greater storage space for modern web
    applications, as well as to make the addition of storage features more accessible.


    HTML5 provides two ways to store data: localStorage and sessionStorage. Data saved
    as localStorage is available to the browser at any point, even if it closes or
    the browser restarts her system. Data saved as sessionStorage is lost as soon
    as the user closes the window.


    Web Storage is an HTML5 featured used in Apple iPhones. The iPhone has a default
    storage of 5MB for data used in web applications, and as this space fills up,
    you receive a prompt asking to expand your storage.


    # CSS3 integration with HTML5


    Many of the examples that exist as HTML5 are a combination of the HTML5 technologies
    described above, JavaScript, and CSS. Most of the CSS techniques you have learned
    in this book are part of the CSS2 specification. These fundamentals will continue
    to be used, the new and evolving features of CSS3 provide powerful new features
    that work well with HTML5. It goes beyond the scope of this book to cover your
    features in depth the following is a brief description of some of these elements.


    +   - CSS Animations

    The ability to animate objects in the browser has traditionally been the role
    of technologies such as Flash; however, some of the same functionality can now
    be created using CSS rules and properties. The partnership of the HTML5 Canvas
    element and CSS transitions will potentially change the way designers create interactive
    and animated elements on the page.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# CSS3 integration with HTML


    +   - CSS Transitions


    CSS transitions are closely related to animation, but are fundamentally different.
    A transition allows property changes in CSS values to occur smoothly over a specified
    duration. imagine a button that has a background color of green; when the user
    rolls over the button, it smoothly animates to a different background color. This
    is a very simple example, and you can currently do this with JavaScript or Flash,
    but transitions in CSS3 give designers a tool without having to become a scripting
    expert.


    +   - CSS 2D and 3D Transformations


    The CSS transform property allows you to rotate, scale, or skew an element on
    your page. A simple transform might be the ability to rotate an image on the page
    slightly to one side for aesthetic effect.Transforms can also be animated, animating
    the scale property might allow you to create an enlarging or minimizing effect
    on an image or other element. You can also use the perspective property to simulate
    an object being positioned or animated in 3D space.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_282_0.png)


    +   - CSS3 Backgrounds, Borders, RGBA Colors, Gradients, Drop Shadows, and Rounded
    Corners


    There are several enhancements to the visual style of web pages that are now possible
    with CSS3.You border-radius property briefly at the end of Lesson 9 are many new
    effects you can create, as native gradients and drop shadows. Traditional effects,
    such as the background-image and border properties are upgraded in CSS3. For the
    border-image property you will be able to apply images to style border and you
    will also be able to add multiple background images to a single container; this
    removes the current limitation of only being able to use a single background image.


    Lesson 12, HTML5 Essentials 265'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# How to begin using HTML5/CSS3


    +   - @font-face Web Fonts The ability to use a wide range of fonts in your designs
    has been extremely limited for many years. There is increasing support for the
    ability to add custom fonts to your page designs using the @font-face property,
    which allows the designer to specify a particular font and provide a source link
    for the font; in turn, allows a user''s browser to download the necessary font
    for use. This feature has the potential to dramatically transform the appearance
    of web pages worldwide, although it comes with many of the same browser support
    issues as the various HTML5 features.


    These are just a few of the highlights of what is to come in CSS3. Remember that
    HTML and CSS3 features are not supported by all browsers and it will be some time
    before they become part of a web standard toolbox. While it is exciting to contemplate
    what the future of web design will look like, it needs to be tempered by the reality
    of what you can use.


    How and when using HTML5 features has a lot to do with browser support. For example
    CSS animations are well-supported in WebKit-based browsers, which include Apple
    Safari and Google Chrome. CSS animation is not supported in the versions of Firefox
    or Internet Explorer available at the time of publication of this book, but we
    expect it to be supported in the next major versions of these browsers.


    Using web services to determine browser support


    Given the shifting and evolving nature of the web browser and mobile landscape,
    a number of web sites have to help designers and developers determine which HTML5
    and CSS3 features are currently supported.


    caniuse.com

    This site provides a series of tables that illustrate the past, current, and future
    browser support for the various HTML5 and CSS3 properties. The site also has useful
    information as the user statistics for any particular feature, which can help
    you decide whether to use that feature.


    www.modernizr.com

    This site automatically detects the browser you are using and displays the support
    for the various features of HTML5 and CSS3 on the home page. However, the site
    does not allow you to compare feature support of other browsers on the market.


    www.htmltest.com

    This site is similar to the Modernizr in that that it automatically detects the
    browser you are using, but it creates a score based on whether your browser supports
    different features.'
  merge: -1
