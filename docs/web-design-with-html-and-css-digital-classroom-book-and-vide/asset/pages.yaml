    # Three ways to use styles


    In this exercise, your styles were located within the head section of the page.
    This type of style is called an internal style sheet. In addition to internal
    (or embedded) styles, there are external style sheets and inline styles.


    An external style sheet is a separate document with the file extension .css. When
    using an external style sheet, all styles reside inside the style document and
    you link it to your HTML pages. While internal style sheets affect only the page
    you are on, external styles can be applied to multiple pages.


    Inline styles are used frequently.With inline styles, the style rules are nested
    inside the HTML tags. An example of an inline style that colors a heading would
    look like this:


    ```

    <h1 style="color:purple">Smoothies</h1>

    ```


    Inline styles are powerful because they override both internal and external styles,
    although they only apply to a single tag at a time. This embedded nature of inline
    styles means they are not easily re-used. In the simple example above you can
    see the style for the color purple is nested inside the <h1> elements throughout
    your website and using inline styles, if you had 50</h1> elements you would add
    this style 50 times. If you wanted to change the color to green, you would need
    to locate and modify all 50 of the style. Inline styles are useful for single
    overrides or when an internal or external style sheet may not be available; a
    good example of this is HTML-based e-mail.'
