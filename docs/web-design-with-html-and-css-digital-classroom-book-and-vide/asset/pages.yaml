  md: "# Placing images in HTML\n\nTo add images to an HTML document, use the `&lt;img&gt;`\
    \ tag. Like the anchor tag, the image tag does nothing by itself. The image relies\
    \ on attributes and values that specify the image to display. Here you insert\
    \ an image into the HTML code.\n\n+   Click once after the closing paragraph line\
    \ `&lt;/p&gt;` that follows the text indicating the site content is copyrighted.\
    \ Press Return to the next line. Type `&lt;img&gt;`.\nThe image is in a special\
    \ category of HTML tags that are self-closing. You do not need a pair of tags\
    \ with the image tag; one is sufficient. However, it is important that you type\
    \ this tag correctly. There is a space between the `img` and the `/`. This satisfies\
    \ the requirements of XHTML syntax, and you will specify the exact image to use\
    \ in the space between the `img` and `/`.\n\n```\n<body>\n  &lt;SmoothieWorld&lt;/\n\
    \  &lt;p&gt;Smoothies are the stuff of life, they get going in the morning, refresh\
    \ when you're feeling\n  &lt;p&gt;All content on this site is the\ncopyright of\
    \ &lt;a href=\"http://www.digitalclassroom.com/smoothieworld\"&gt;SmoothieWorld&lt;/a&gt;&lt;/p&gt;\n\
    \  &lt;img /&gt;\n</body>\n```\n\nAdding an image to your page with the `&lt;img&gt;`\
    \ tag.\n\n+   Click once to the right of the text `img`, press the space, and\
    \ type `src=\"`. `src` is the source attribute, and you will specify a value,\
    \ which is the location (URL) of an image which will display on the page.\n\n\
    +   Click between the quotation marks that follow the `src=` code and type `images/blueberry_smoothie.jpg`.\n\
    Your img code should look like this:\n`&lt;img src=\"images/blueberry_smoothie.jpg\"\
    &gt;`\nThis code tells a browser to look inside the folders and display the blueberry_smoothie.jpg.\
    \ In the next steps, be sure to maintain the extra space between the last quotation\
    \ mark and the closing tag. You will be adding an `alt` tag. This attribute represents\
    \ the text equivalent for the image and is required if you want your page to be\
    \ valid. `alt` attributes help those who use screen readers to navigate the web.\
    \ They also appear in browsers if the image is broken or missing for some reason.\n\
    \n+   Click to the right of the last quotation that follows the blueberry_smoothie.jpg\
    \ file name and press the space. Type `alt=\"`.\n\n+   Click on the quotation\
    \ you added in step 4 and type **Blueberry smoothie**.\nBoth the `src` attribute\
