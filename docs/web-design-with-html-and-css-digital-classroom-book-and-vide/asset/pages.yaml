    \ em are not tied to the monitor resolution while pixels are related to the monitor\
    \ resolution. Em may not be intuitive at first, but understanding how to use them\
    \ will pay off in the future.\n\n+   10 Save your file and preview the file in\
    \ your browser. Depending on which browser you are using, you will probably not\
