    # Optimizing graphics for the web


    Optimizing refers to the preparation of images for use on the web.The goal of
    optimization is to reduce the file size of the image for faster downloading, without
    compromising the quality of the image. Ultimately, you may have to reduce the
    quality of your images so they are small enough to be downloaded and viewed quickly;
    in many cases, it is more important to have a speedy download than to make the
    user wait for beautiful (but large) image files.


    Before you start adjusting the file size of your images, you should have a general
    idea of how you will use them, and how big they will be.


    # Resizing the image


    Many web designers mistakenly believe that if an image has a resolution of 72
    dpi (dots per inch), it’s ready for the web. However, the total pixel dimensions
    of the image is much more important.


    This example uses Adobe Photoshop, and the image is ready to be resized. In your
    workflow, all retouching, adjustments, and other editing must be completed before
    you begin optimizing an image for the web.'
