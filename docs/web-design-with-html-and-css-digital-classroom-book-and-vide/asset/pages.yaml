  md: "5 In your text editor, choose File > Open. Navigate to your web0lessons folder,\
    \ select the base.css file, and then click Open.\n\nRemember that your page is\
    \ currently using three sources for the styles: the internal styles, which you\
    \ have already modified; an external style sheet named reset.css, which applies\
    \ margins and a padding of 0 to most of your HTML elements; the base.css style\
    \ sheet, which contains common styles, such as font family and font size.\n\n\
    # Style sheet management\n\nLearning to manage multiple style sheets is increasingly\
    \ important in modern web design. Placing all your styles in a single style sheet\
    \ can cause confusion and inefficiency, especially as the number of rules increases.\
    \ Modern websites use multiple external style sheets: one for reset, one for layout,\
    \ one for older browsers, one for mobile devices, and so on.\n\nIt is important\
    \ to know when to use internal and external style sheets. On most completed websites,\
    \ internal styles are used to style a unique page; the majority of the styles\
    \ are in the external style sheets. However, during development, it is more convenient\
    \ to experiment and refine the layout using internal styles; all the designer\
    \ needs is to scroll the page and add or modify a rule of preference. However,\
    \ the point at which internal styles are moved over to an external style sheet\
    \ is a matter of preference. However, designers do this when the design is approved\
    \ and they are beginning to build new pages.\n\n6 In your base.css file, locate\
    \ the body rule and add the following property (highlighted in red):\n\n```\n\
    body {\n  font-family:Trebuchet MS, Tahoma, Arial, sans-serif;\n  font-size:100%;\n\
    \  background-color:#B3BBCA;\n}\n```\n\nThis adds a light-blue background color\
    \ to the page. Save the file and preview it in your browser. You can see that\
    \ with no background colors applied, your columns are transparent and the body\
    \ background is visible. You'll fix that by applying a white background to the\
    \ wrap div."
