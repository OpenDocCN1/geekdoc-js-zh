  md: 'Save your box and preview it in your browser. The CalorieBox is still hidden
    when the page loads.When you click it, it expands, and when you click again, it
    collapses. Close your browser and return to your text editor.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_244_0.png)


    Using the toggle effect, the user can now open and close the box.


    To make the show-and-hide effect more interesting, you will use the animation
    capabilities of jQuery.


    In the lines of code you have already written, you can add control for the speed
    of the show-and-hide effect. Add the following code (highlighted in red):


    ```

    $(''#CalorieBox'').toggle(''slow'');

    ```


    Save your page and preview it in your browser. Clicking the link results in a
    slow expansion of the box. jQuery allows you to control the speed using millisecond
    number values.


    Return to your text editor and replace the ''slow'' value with a millisecond value
    (be sure to remove the quotation marks, which are used for keys such as ''slow''
    or ''fast''):


    ```

    $(''#CalorieBox'').toggle(1200);

    ```


    The 1200 milliseconds value is equal to 1.2 seconds. Save your page and then preview
    it in your browser. Clicking the link results in a much slower expansion of the
    box.You''ll now increase the speed of this effect.


    Return to your text editor and replace the 1200 value with 500, the equivalent
    of one-half second:


    ```

    $(''#CalorieBox'').toggle(500);

    ```


    You also have options to change the behavior of the box: in addition to .show,
    .hide, and .toggle, there are effects such as .slideDown, .fadeIn, and .fadeOut.You''ll
    change your toggle effect to the .slideToggle effect.


    Add the following code (highlighted in red):


    ```

    $(''#CalorieBox'').slideToggle(500);

    ```


    Save your page and preview it in your browser. When satisfied, clear your browser
    and your file since you will be working with a new document in the exercise.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_244_1.png)


    The slideToggle effect changes the behavior of the animation.'
