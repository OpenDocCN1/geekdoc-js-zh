  md: 'In the HTML file, select the word purple and type the following for the color
    value: #800080. This hexadecimal color is the equivalent of purple.You can use
    named colors or hexadecimal codes when defining colors using CSS.


    Save your file and preview it in the browser. The color remains the same. Hexadecimal
    colors are a more common method for describing colors.


    # Hexadecimal colors


    Color in both HTML and CSS is referred to as a six-character code preceded by
    a pound sign. This is called hexadecimal code, and the system is used to identify
    apply color to elements.You can reproduce any color using a unique hexadecimal
    code. For example, the following color is dark-red:acc0000.


    The first, middle, and last digits of the hexadecimal code correspond to values
    in the RGB spectrum. For instance, white, which is represented in RGB as R:255
    G:255 B:255, is represented in HTML as #FFFFFF (255|255|255). A program like Photoshop
    will allow you to choose a specific RGB color in the Color Editor and give you
    the equivalent hexadecimal color for your use.


    There are also online references you can use to locate or "mix" hexadecimal colors
    such as: www.w3schools.com/html_colorvalues.asp


    The rule you just created is officially known as a "type selector" since it targets
    every instance of the h1 element type in your document. Type selectors assign
    CSS properties to an existing HTML tag. In this case the <h1> tag All tags on
    this page will be displayed as purple. Type selectors are commonly known as selectors.
    It is rare that you will actually hear someone use the phrase "type selector"
    but that is the official name for it, so we mention it here.


    You will now get an introduction to another category of CSS styles known as a
    class.You will also work with the <span> element which separates and controls
    inline content, such as a sentence within a paragraph, or an individual word within
    a sentence.'
