    the maincontent div.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_209_0.png)


    By setting a position:relative property on the maincontent div, your heading is
    using this div as a reference.


    Setting this div to position:relative instructs the absolutely positioned splash
    div to use the top-left corner of the maincontent div, not the top-left corner
