    # Setting paragraph line-height\n\nTo improve readability of your text, you can\
    \ change line-height, which is the amount of space between lines. In the world\
    \ of print design this is called leading, but the concept here is the same: changing\
    \ the amount of space between sentences can affect the readability of your text.\
    \ A line-height that is too small results in cramped text, while a line-height\
    \ that is too high risks losing the reader's focus. However, you can't set a universal\
    \ line-height value and be done with; line-height is connected to a number of\
    \ factors including the amount of text and the width of the text block, as well\
    \ as the color, size, and choice of font. In this exercise you will set the line-height\
    \ of your current paragraphs.\n\n1 Add the following code (highlighted in red)\
    \ to your p element:\n\n```\np {\n  font-family:Georgia, \"Times New Roman\",\
