    # Review


    # Questions


    +   1 What is the difference between a wireframe, mockup, and prototype?


    +   2 Define information architecture.


    +   3 What is usability testing and how does it relate to web design?


    # Answers


    +   1 A wireframe is a diagram or sketch of a web page that focuses on structure
    and layout, not visual elements such as color or graphics. A mockup is a visual
    representation of a page that includes font choices, colors, layout, and images.
    A prototype may contain elements of wireframes or mockups but is primarily concerned
    with demonstrating the interaction between a user and the site.


    +   2 Information architecture is the process of organizing a website’s content
    and defining the navigation of the site.


    +   3 Usability testing is the procedure in which a user is given a task or series
    of tasks relating to a website, such as purchasing an item, and asked to determine
    where any confusion or difficulty in navigating appears. A web designer would
    take this feedback and improve the site design as needed.'
