- img_proc: true
  md: '# Starting with an HTML5 foundation


    When deciding whether to use HTML5, you are faced with the issue of whether you
    should use features that customers and users want to use in the future, but may
    not work with older browsers.


    There are solutions currently available that bridge the gap in browser support.
    The best way to understand this is to consider the core HTML5 syntax in the first
    half of this lesson. If you build a web page that uses the new tags, as `<header>`,
    `<nav>`, or `<article>`, it displays well on many current browsers, including
    Internet Explorer 9.


    Older versions of Internet Explorer are not able to display most HTML5 content,
    and different versions of Internet Explorer are used by approximately 60 percent
    of users around the world. You can still use HTML5 and help users with older versions
    of Internet Explorer to view your site through the use of JavaScript.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_284_0.png)


    Sites such as HTML5boilerplate.com provides templates to help start building HTML5
    sites.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Supporting HTML5 in older browsers


    The solutions let HTML5 elements be styled by Internet Explorer 6 or other browsers
    using some form of feature detection. In other words, when a browser doesn''t
    support HTML5 elements accesses your site, JavaScript solutions allow you to use
    CSS that will work with the older browser.


    **modernizr.com**


    Modernizr.com provides a service that detects the support of any visiting browser
    and access to a downloadable JavaScript file that you can link to your HTML5 pages.
    After linking to this JavaScript file, you can have better control over the styles
    used for different browsers.


    **html5boilerplate.com**


    This offers an entire set of files, including HTML, CSS, and JavaScript, to provide
    designers a template for generic HTML5 element that has been tested by professionals.
    This is a great resource, but you should spend some time understanding the code.


    **html5shiv**


    This code is similar to the Modernizr code in that it allows Internet Explorer
    to recognize and style HTML5 elements. You can find it at http://code.google.com/html5shiv/.


    # Words of encouragement


    When learning web design, remember that it is easier to learn something new than
    it is to replace a concept you already learned with new skills. This was the case
    for the first generation of web designers who created page layouts with tables.
    In many cases, when CSS layout became standard, it was not always easy to change
    habits and practices learned over the years.


    The benefit of the rapidly evolving web technologies is that opportunities exist
    for entry designers. HTML5 and CSS3, for example, are still evolving languages
    and many working professionals don''t have the time to keep up with these developments.
    This book has focused mainly on the technical skills and best practices that are
    the foundation of a good twenty-first-century web designer. It has not focused
    as much on the aesthetics of web design, mainly because this is a function of
    experience, study, and a certain degree of subjectivity. Web design is a craft,
    and with most crafts, you will develop your own style through experience and feedback.'
  merge: -1
  pgno: 285
