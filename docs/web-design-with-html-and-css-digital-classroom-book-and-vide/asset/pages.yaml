    # ### Omniture


    Omniture was recently purchased by Adobe, and provides enterprise-level analytics
    tools for large businesses.


    # ### HaveaMint.com


    This service has a simple powerful interface that makes working with server logs
    enjoyable and interesting.


    # ### Chartbeat.com


    Chartbeat combines standard charts and graphs with alert systems to help busy
    sites stay on top of their server traffic.


    For more information on analytics tools and services, see the book *Web Analytics:
    An Hour a Day* by Avinash Kashik.'
