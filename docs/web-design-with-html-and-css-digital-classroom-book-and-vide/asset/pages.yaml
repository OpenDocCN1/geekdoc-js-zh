  md: "# Working with the clear property\n\nWhen you add the CSS clear property to\
    \ an object, you add a rule that says,“No floated elements are allowed to your\
    \ sides.” You can specify whether to clear floated elements on the left side,\
    \ the right side, or both. In the case of the footer, you will choose.\n\n+  \
    \ Add a new selector and style rules (highlighted in red) below your #main div:\n\
    \n```css\n#footer {\n  clear:right;\n  background-color:#BA2B22;\n}\n```\nSave\
    \ the file and preview it in your browser.Your footer is now placed at the bottom\
    \ of the main div. This is because the clear:right rule does not allow any floated\
    \ elements to the right of the footer. The main div was floated, so the footer\
    \ moves to the next available spot on the page. Close your browser and return\
    \ to your editor.\nIn the earlier chapters, the amount of content in your div\
    \ can affect your floated and cleared elements. For example, if the amount of\
    \ text in the sidebar extends to the point of reaching the footer, you will have\
    \ a problem as the sidebar extends outside. For this reason, elements are set\
    \ to clear on both.\nChange the value of your clear property as follows (highlighted\
    \ in red):\n\n```css\nclear:both;\n```\nThis code ensures that no floated elements\
    \ are allowed on either side of the footer.\n\n# Creating a list-based navigation\
    \ using floats\n\nNow that you have the basics of floating and clearing, you will\
    \ return to your navigation section and add a simple navigation bar using an unordered\
    \ list.The list items inside your navigation should be floated to override the\
    \ default vertical appearance of a list. CSS navigation menus are generated in\
    \ standards-based design which can be easily updated and modified, because they\
    \ are text-based (not images), which improves accessibility in devices such as\
    \ readers and can even help a website's search engine rankings.\n\n+   In your\
    \ HTML, replace the placeholder content inside your mainnav and replace it with\
    \ the following unordered list and list items (highlighted in red):\n\n```html\n\
    <div id=\"mainnav\">\n<ul>\n  <li><a href=\"index.html\">Home</a></li>\n  <li><a\
    \ href=\"about.html\">About Us</a></li>\n  <li><a href=\"recipes.html\">Recipes</a></li>\n\
    \  <li><a href=\"submitrecipe.html\">Submit a Recipe</a></li>\n  <li><a href=\"\
    forum.html\">Forum</a></li>\n  <li><a href=\"contact.html\">Contact Us</a></li>\n\
    </ul>\n</div>\n```"
