  md: 'The examples throughout this lesson use Adobe Photoshop, but there are other
    applications you can use for cropping, scaling, saving, and retouching images.The
    following links contain free software and resources that can help you do most
    tasks in this lesson:


    # GIMP


    www.gimp.org


