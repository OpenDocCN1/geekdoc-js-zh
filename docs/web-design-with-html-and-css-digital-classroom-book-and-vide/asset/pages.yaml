  md: '# Web languages


    In HTML documents, some of the content is displayed to the viewer in their browser,
    but there is also other code on the page that is hidden from view, useful for
    the browser, search engine, or site developer. Examples of this hidden code include
    scripts to add interactivity, to help search engines categorize the document,
    and the styles that define the appearance of the page. This is often found inside
    the <head> element, and the <head> element is nested within the <html> tags. An
    example of this is:


    ```

    <html>

    <head>

    </head>

    <body>

    Nobody knows who invented smoothies, but the world wouldn’t be the same without
    them!

    </body>

    </html>

    ```


    In the example above, there is no content in the <head> element just yet. Notice
    that the <head> element is nested within <html> but is nested within <body>. The
    <head> element opens and closes before the <body> starts.


    The <body> element contains text but is lacking context so that you nor a search
    engine can determine if it is a heading, list, quotation, or some other type of
    content. To define the text as a paragraph the <p> tag is used:


    ```

    <html>

    <head>

    </head>

    <body>

    <p>Nobody knows who invented smoothies, but the world wouldn’t be the same without
    them!</p>

    </body>

    </html>

    ```


    The paragraph element is now nested within the <body> element, which, in turn,
    is nested within the <html> element. You will now open this document in a text
    editor and add to the file:


