    # The Document Object Model


    JavaScript has access to objects within a browser; this is how the pop-up window
    from your previous exercise appeared on screen. This access takes advantage of
    the Document Object Model (DOM), which is a convention for accessing data within
    HTML pages. This model describes how all elements in an HTML page, as forms and
    images, are related to the topmost structure, known as the document.


    JavaScript has access to the document and the related elements on your page in
    a way that HTML does not. This access allows JavaScript to:


    +   * Validate form fields

    * Detect the browser as user

    * Respond to user events

    * Store and retrieve information on a user''s computer'
