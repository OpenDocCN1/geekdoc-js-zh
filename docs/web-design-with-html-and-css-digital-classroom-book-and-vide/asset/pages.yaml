  md: '# Information architecture


    Design is not just about visuals.The word design comes from the Latin word designare,
    which means to mark out, devise, or choose. This is a good reminder that you should
    choose or plan the structure of a website before you consider the visuals. The
    term used to describe the planing of a website''s structure is information architecture.
    Information architecture is concerned with providing optimal navigation paths
    for the user and helping them get point A to B. The user may need to go from the
    home page to the best recipe for a mango/banana smoothie.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_32_0.png)


    A site map is often used in the discipline of information architecture.


    In more formal terms, information architecture is the process of organizing the
    site’s content and defining the hierarchy and navigation of the site. Since most
    sites have a “client” of some sort, information architecture is also where you
    discuss the scope of the site. Sope relates to the number of pages in a site as
    well as the features and functionality the site includes. A single-page website
    with some text and a few images would be a site with a small scope, while a 200-page
    website that includes a video library, database integration, and sends alerts
    to a user’s mobile phone would be a site with a large scope.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# The goals of web design


    # The business of web design


    There is an interlocking relationship between the budget of a site and its scope
    and timeline. A change in one element will affect at least one of the others.


    If you are freelance web designer, you may be dealing with a client directly;
    if you are working in an organization, the “client” might be a manager or a different
    division or department. In both situations the results are similar: if the budget,
    scope, or deadline shifts, it will affect all the other aspects of the project.
    After you complete the information architecture phase, it is quite likely that
    the client will ask for new features. As the designer, you need to communicate
    how this will affect either the budget or the timeline for delivery. In a similar
    way, if the timeline for delivery changes and the site needs to be delivered sooner
    than anticipated, then you need to either exclude features or change the budget
    to reflect this.


    Ideally, the client will be able to tell you which of these factors is the most
    important. For example, if there is a fixed budget for a site and there is absolutely
    no way the client can exceed, you will need to ensure that these features can
    be completed within the budget.


    # Resources


    Issues as managing projects, legal contracts, and other aspects of web design
    require attention. Here are some resources to get you started:


    # AIGA


    AIGA is an association dedicated to supporting designers. Although it offers memberships,
    it provides non-members access to free resources such as tips on how to create
    contracts as well as forms you can use.


    www.aiga.org/content.cfm/design-and-business


    # Graphic Artists Guild


    The Guild has chapters in many cities. They publish the Graphic Artists Guild''s
    Handbook of Pricing & Ethical Guidelines, which can help you determine the appropriate
    fees for your services and also provide simple legal forms and tips on how to
    market yourself.


    www.graphicartistguild.org


    # A List Apart


    An invaluable online resource for all things related to web design, this site
    has articles about business practices, client management, information architecture,
    and much more. Each year, the site also conducts surveys of web designers, which
    provides useful data about salary ranges, job titles, and more. Type survey in
    the search field on their home page to find the most recent one.


    www.alistapart.com


    # The navigation design of the SmoothieWorld site


    The nature and content of your layout depends on how you define a site''s organizational
    and navigational structure. One of the benefits of creating wireframes, prototypes,
    and mockups is to allow you to build your site more rapidly. Popular method for
    exploring possible navigation in the design phase is to use a pencil, sticky notes,
    and a blank wall. This lets you rapidly “reorganize” a site, also for collaboration
    and doesn''t require any special skills.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Let''s consider two types of site structures that will eventually translate
    to the navigation menus: wide and deep. First you have a wide navigation structure
    in which the main pages are listed horizontally:


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_34_0.png)


    A wide site navigation has primary links always accessible.


    In a wide navigation system, the main pages are all visible together and for small
    sites, this is often a logical choice. With the navigation bar on every page the
    user can easily jump to any of the main pages with a single click. The disadvantage
    of a wide navigation structure is that there may be limits to how much information
    can easily be displayed if there are too many categories. You are limited by the
    width of the structure and must also remember that if you present too many options,
    the site may overwhelm or confuse the user.


    An alternative method for organizing content is deep navigation, which simplifies
    the main navigation and then groups pages into categories.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_34_1.png)


    A deep site navigation has fewer primary links and more secondary and tertiary
    links.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# The goal of web design


    Deep navigation provides simplified entry-points for the user; however, the designer
    must decide how to organize the pages inside these main links. Common solutions
    to this problem include drop-down menus and secondary navigation menus.


    # Rethinking site navigation


    The concept of the "home page" may not be as crucial as it once was due to the
    power of search engines, which now have influenced users, along with social media
    such as Twitter and Facebook which it more likely that a user will enter your
    site in unique ways. The first time a user experiences their site may not be through
    the home page, but from a search engine result or a link to an internal page on
    your site from another website or from a Twitter feed or a Facebook post. Every
    page on site now becomes a home, needing to welcome users into your site.


    Although this shifts the role of the home page, it also shows the importance of
    understanding why users are coming to your sites and why you need to provide them
    clear navigational structure and content that helps them find what they need.


    # The role of usability testing


    Usability testing is related to, but distinct from, the field of design. Usability
    testing is the process of evaluating how users interact with a website. It often
    involves giving a user a task to complete on a site and then observing how they
    perform the task, whether they can complete it. If a user encounters difficulty
    or is confused by the process, the problems are noticed and integrated into the
    site


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_35_0.png)


    Such as Cantasia Morac facilitates usability testing by recording a user''s interaction
    with a website, including video of users'' reactions.


    # Web Design with HTML and CSS Digital Classroom'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'A common problem with usability testing is that it often occurs too late in
    the design process. If you test the site after you have built it completely, the
    feedback may be useful but you need to discard work that you have already completed.
    For example, if you have completely built a site using a wide navigation, and
    testing shows you need to revise it using deep navigation, this will be much difficult
    if you have already built all your pages and created the graphics.


    # A usability exercise relating to navigation design


    Usability testing must be done correctly or you will receive invalid feedback,
    or feedback that isn''t useful. For example, it''s important to conduct testing
    with subjects who truly represent the target audience, not those who may already
    be familiar with the site.


    To understand how usability testing works, try the exercise with another person,
    putting them in the role of the user and yourself in the role of the tester. Most
    usability tests ask users to speak their thoughts out loud and they are recorded
    in capture the information. While you won''t be recording the user, you will ask
    them to respond out loud to some questions. Find a suitable website to use as
    an example, and then ask the other person the following list of questions:


    +   * What are your first impressions of the layout of the page immediately upon
    viewing it?

    * What section of the page does the most important element on the page?

    * Is that section does your eye go to focus?

    * What associations do the colors and images evoke? These could be emotions, feelings,
    memories, places, or anything else the colors bring to your mind.

    * Without clicking on anything on the site, describe the navigation choices you
    see on the home page and indicate what you think they do. Feel free to move around
    the page by scrolling, but do not click on anything right.

    * Without clicking on anything yet, if you were exploring, what would you click
    on first and why?


    These questions give a sense of how usability testing works. The next step would
    be to give the user specific tasks, and pay attention to how they perform them.
    As you can see, observing users, their reactions, the decisions they make, and
    any obstacles they encounter is vital to usability testing. We''ve only scratched
    the surface in discussing usability testing. For a greater understanding, review
    the resources below:


