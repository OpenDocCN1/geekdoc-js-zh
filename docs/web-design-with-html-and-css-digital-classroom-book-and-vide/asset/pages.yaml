  md: '# A brief history of layout techniques on the web


    You will not change this style sheet, but will attach it to your pages. Remember
    that reset style sheets are optional.They help standardize your layout across
    browsers, and some designers also add their most frequently used styles to reset
    their style sheets.


    # Extending the reset style sheet


    Eric Meyer was the first designer to develop reset style sheets, which were then
    released into the public domain. You will use his styles in this exercise. For
    more information on the reset technique, visit http://meyer.com/eric/thoughts/2007/04/reset-reasoning/.


    Many customers use this reset style sheet to fit their needs. For example, if
    the most common-family font is Verdana, you can add this to your body style. If
    you have more space between the lines in your paragraphs, you can set a standard
    line-height value that works best for you. The point is to have a consistent set
    of rules that you can quickly start up a project.


    Using CSS reset style sheets has potential disadvantages, especially for beginners:
    you must constantly remember that the reset style is there and be aware of how
    it affects the appearance of elements in your site. If you are using the reset
    style sheet across the entire site, you might be surprised by its effects, especially
    when using elements you are not familiar with. For example, a CSS reset file strips
    out margins and padding for most form elements, and when you start working with
    forms for the first time, you might be confused as to why your buttons, form fields,
    and other elements appear the way they do.


    # A brief history of layout techniques on the web


    Although you will learning how to build your page layout using CSS styles, you
    should note that this was not always a standard practice. As web design developed
    in the mid-1990s, the only method available for sophisticated page layout, such
    as adding multiple columns to a page, was to use the HTML <table> tag. The HTML
    table was originally designed to present data in a logical format using rows,
    columns, and cells.


    Designers adopted this element and used it as the foundation for your page structure.
    At the time, this technique made perfect sense: tables were the only tool available
    to create the sort of designs required at the time.


    Designers often used techniques such as nesting tables. For example, the code
    for a standard two-column page might start with a table consisting of three rows
    and two columns.


    | | |

    |---||

    | | |

    | | |

    | | |


    A three-row and two-column table.'
