  md: "# Other benefits of standards-based design\n\nW3C page validation is the most\
    \ tangible aspect of standards-based web design, but there are also benefits to\
    \ creating well-structured pages, including:\n\n**Less code**: Using HTML and\
    \ CSS allows to create similar pages with fewer lines of code—less work for you\
    \ and faster download for the viewer.\n\n**Ease of maintenance**: Less code means\
    \ a website is easier to maintain. This helps you, the author of a page, as well\
    \ as members of a team working on maintaining or revising a website.\n\n**Accessibility**:\
    \ Web documents marked semantically, meaning that they use the best HTML for the\
    \ tag, can be easier to navigate by users with visual impairments and the content\
    \ they contain are more likely to be found by a visitor to the site.\n\n**Search\
    \ engine optimization**: Web pages with clear and logically named sections, both\
    \ within the code and also within content, are easier for search engines to index\
    \ and categorize content because that is organized and well-labeled is easier\
    \ for search engines to evaluate content and relevance of content on the page.\n\
    \n**Device compatibility**: Websites that separate the structure from the style\
    \ are more easily repurposed for mobile devices and other browsers. CSS also allows\
    \ for alternative style sheets that optimize the appearance based on the device\
    \ being used to view the page.\n\n# HTML structure\n\nOne of the most important\
    \ concepts to understand when designing web content is the nested structure of\
    \ HTML documents. Elements are often nested within each other. You will start\
    \ with the HTML structure first and then begin to style it with CSS.\n\nAs an\
    \ example, let's look at the basic elements that are in virtually every page:\n\
    \n```\n<html>\n  <body>\n  </body>\n</html>\n```\n\nIn this example, the `<body>`\
    \ element is nested within the `<html>` element. In other words, the `<body>`\
    \ is placed between the opening `<html>` tag and the closing `</html>` tag, so\
    \ nested tags are those that are placed between other opening and closing tags.\
    \ These two elements `<body>` and `<html>` form the structure of all web pages;\
    \ when a browser opens an HTML document, it looks for this structure.\n\nContent\
    \ within the body tag is visible on the page as it is displayed within the web\
    \ browser.\n\n```\n<html>\n  <body>\n  Nobody knows who invented smoothies, but\
    \ the world wouldn't\n  the same without them!\n  </body>\n</html>\n```"
  merge: -1
