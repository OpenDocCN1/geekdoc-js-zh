  md: '# Testing your designs on mobile devices


    The best way to test your page designs is to have access to the mobile device
    in question. There is a category of software programs called emulators that allow
    you to test your designs in software versions of different mobile devices. The
    most reliable source for emulators is the manufacturer. For example, Apple provides
    an iPhone emulator with its iPhone development tools;Android and Windows Phone
    7 also include emulators with their development tools. Using these emulators in
    an accurate preview of your designs without placing your sample files online.
    However, emulators are often not cross-platform compatible. For example, the iPhone
    emulator (at the time of this writing) is only available for the Mac. Additionally,
    these emulators are installed with the assumption that you are using them for
    application design, not web page design; as such, the installation process might
    seem a bit overwhelming and unnecessary.

    There are also a few online web services that claim to emulate your designs in
    the mobile format. However, these services are not as reliable and often require
    a hyperlink to your page, rather than locally on your desktop. In this case, you
