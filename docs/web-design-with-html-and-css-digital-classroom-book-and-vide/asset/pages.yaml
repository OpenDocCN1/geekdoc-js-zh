  md: '# Applying the Unsharp Mask filter to an image


    We strongly recommend that you sharpen an image after you resize it in Photoshop
    because it can become blurry. The Unsharp Mask filter is a great tool for sharpening
    images. The following figure shows the image before and after you apply the filter.
    The Unsharp Mask feature sharpens the image based on levels of contrast, while
    keeping the areas that don''t have contrasting pixels smooth.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_101_0.png)


    The image before (left) and after (right) you apply unsharp masking


    Follow these steps to apply the Unsharp Mask filter:


    +   1 Choose View > Actual Pixels or double-click the Zoom tool (Q).


    When you''re using a filter, you should view your image at its actual size to
    see the results more clearly.


    +   2 Choose Filter > Sharpen > Unsharp Mask.

    The Unsharp Mask dialog box displays three options:


    +   * Amount: The Amount value ranges from 0 to 500. The amount you choose depends
    upon the subject matter. For example, you can sharpen a car or appliance at 300
    or 400, with a portrait, every wrinkle, mole or hair will become more defined.
    If you are unsure about the value to use, start with 150 and gradually increase
    the amount until you find a value that looks good.


    +   * Radius: The Unsharp Mask filter creates a halo around the areas that have
    enough contrast to be an edge. For print images, you can use a value between 1
    and 2, but if you''re creating a billboard or poster, increase the size.


    +   * Threshold: The Threshold value is the most important one in the Unsharp
    Mask dialog box because it determines the parts of the image that should be sharpened.
    The value can range from 0 to 255. Apply too much, too little, and the image becomes
    grainy. For example, if you leave it at zero, noise appears throughout the image,
    like the grain you see in high-speed film. A value of 10 causes the filter to
    apply when the pixels are ten shades or more away from each other. Start with
    a value of 10, and gradually increase it until you find a value that works.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '3 For this exercise, set the Amount to 250, Radius to 1, and Threshold to 10.


    > You can compare the original image with the resulting image in the Preview pane
    of Unsharp Mask box by clicking and holding the image in the Preview pane; this
    shows the original state of the image. When you release the mouse, you prevent
    the Unsharp Mask filter again.


    4 Click OK to apply the filter. The image is sharpened.


    5 Choose File > Save; keep the file for the next part of this lesson.


    In some images, stray colored pixels may appear after you apply the Unsharp Mask
    filter. If this occurs in your image, choose Edit > Fade Unsharp Mask immediately
    after applying the Unsharp Mask filter. In the Fade dialog box, select the Luminosity
    blend mode from the Mode drop-down list and then click OK. This step applies the
    Unsharp Mask filter to the grays in the image only, eliminating sharpening of
    colored pixels.


    > You can also choose Filter > Convert for Smart Filters before you apply the
    Unsharp Mask filter. Smart filters allow you to undo all or some of any filter,
    including sharpening filters that you apply to a layer.


    # Selecting the best image format


    When saving an image that you will use on the web, you need to consider two factors:
    the quality and size of the image file. When you are saving a file, you must find
    a balance between the quality you want and the download speed your viewers demand.


    In this section, you will look at different file formats and decide format for
    the picture you just resized; the following example uses the Save for web & Devices
    feature in Adobe Photoshop.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Choosing the right file format


    The most popular formats for web images are JPEG, PNG, and GIF. Each one of these
    formats has benefits and drawbacks, as shown in the following table.


    | FILE FORMAT | LOSSY | SUPPORTS ANTI-ALIASING | SUPPORTS TRANSPARENCY | SUPPORTS
    ANIMATIONS | SUPPORTS VARYING AMOUNTS OF TRANSPARENCY | HAS LIMITED COLORS | IS
    BEST FOR PHOTOS | IS BEST FOR SOLID COLORS |

    | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |

    | JPEG | ● | | | | | | | ● | |

    | PNG-8 | ● | | ● | | | ● | ● | |

    | PNG-24 | ● | | ● | ● | | | ● | ● | ● |

    | GIF | | | | ● | ● | | | | |


    # Choosing the best file format for your image


    Throughout this lesson, you will have the opportunity to save images in each of
    the major file formats:JPEG, PNG, and GIF. You will also see the differences between
    the formats and when to use each.


    # Saving images as JPEGs


    The JPEG file format helps you keep the file size down, but some loss in image
    quality occurs when you save the image file. Since the JPEG format supports anti-aliasing,
    we recommend it for photographic images and illustrations with a lot of gradients;
    anti-aliasing is a technique used in computer graphics that helps smooth out the
    naturally jagged edges of objects such as text or any area where a transition
    in tonal values is needed. When saving an image as a JPEG, you can also choose
    varying levels of quality.'
  merge: -1
  pgno: 103
