    # Designing for the web


    The best websites are those that meet the expectations of a user, are easy to
    use, and meet the objective of the publisher—whether a business, organization,
    or individual. There are several considerations that should always be a part of
    your decision-making process when starting to create a design.


    # Know your audience


    A bank site provides a sense of safety, stability, and professionalism. The kind
    of image you want from someone that will hold on your money: It also provides
    easy to log-in to your account if you are a user, and has-easy access links to
    parts of the site offering various services. Design and navigation is easy to
    follow, regardless of the age or technical skill of the user.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_48_0.png)


    A banking site and an entertainment site will be designed with their target audiences
    in mind.


    An entertainment site that targets a teenage audience a more visual approach,
    updated news, and links to social networking sites that might be used by the audience.
    Information about shows and personalities is front-and-center. The site manages
    to be trendy and still provides easy access to information that viewers are likely
    seeking.'
