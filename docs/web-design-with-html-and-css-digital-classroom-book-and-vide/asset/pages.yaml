  md: '# The goals of web design


    Now let examine the web designer who is largely responsible for leading the prospective
    customer through the entire process. If an interested customer comes to the shoe
    store''s website, perhaps there is a button that the user clicks to see the shoes
    that are on sale. The customer needs to gather more data on the shoes; perhaps
    there is a table listing the available shoe sizes, colors, and brands. If the
    customer takes le and puts a shoe into the site''s shopping cart, this shopping
    process needs to be designed as well.


    In both of these examples, the end result is firstly the same for the shoe store''s
    owner: the customer buys the shoes. In both cases information is transferred from
    the store to the customer; however, in the case of the website, the designer is
    involved in all stages of the sale process. This is a crucial concept to understand:
    the web is an active medium and the term to describe this design process is user
    design.


    # The web demands user interaction


    The experience of a website is defined by the interaction the user has with it.
    For example, a user clicks on navigation or scrolls down to a page.


    Even the act of reading a book can be defined as user interaction. In the Western
    world, people read from left to right down a page, they turn pages, and scan page
    numbers and tables of contents in order to find a chapter or topic.


    Coming back to the web, you don''t just have readers — you use them. The verbs
    that describe what we do: search website, watch the weather report, transfer money
    between accounts, book airline flights, and many other things. The designer needs
    to think in these terms when designing pages, anticipating the user''s motivation
    for coming to the site.


