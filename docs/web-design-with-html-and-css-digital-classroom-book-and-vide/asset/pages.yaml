  md: '# A brief history of layout techniques on the web


    Flexible layouts are so named because they are designed to adapt to the width
    of the browser window. This style of layout is useful when users have different
    monitor resolutions, making it impossible to build a fixed-width layout that looks
    on every screen. A properly designed flexible layout can automatically adjust
    to fit the user''s browser window.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_163_0.png)


    Flexible layouts readjust as the browser window changes size.


    You could argue that flexible layouts are more appropriate for the web. It is,
    after all, not print: both text and images on a web page can reflow. Now that
    mobile devices make up a substantial proportion of web browsers, a flexible layout
    might be better suited to these new interfaces than a fixed-width layout.


    Fixed-width layouts are much more difficult to build. There are more decisions
    for the designer to make and more options to consider. For this reason, you will
    learn how to create a fixed-width layout in this lesson.'
