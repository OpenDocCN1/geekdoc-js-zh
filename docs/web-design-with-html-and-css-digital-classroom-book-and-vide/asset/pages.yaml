    # # HTML5 Essentials


    In this lesson, you will get an understanding of the different technologies related
    to HTML5. You''ll discover the new elements that are available to help build HTML5
    pages, and you will also learn about modern browser support.


    # ### Starting up


    This lesson does not use any lesson files, so you do not need to load any files
