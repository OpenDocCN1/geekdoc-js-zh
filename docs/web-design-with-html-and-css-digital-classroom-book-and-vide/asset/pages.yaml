  md: '# Saving images as GIFs


    GIF is a popular web format that has some limitations in terms of color and appearance.
    This file format lossless, so the clarity of the image is not compromised by GIF
    compression. You can compress the file size of a GIF by reducing the pixel dimensions
    and the number of indexed colors it uses, which makes GIF the best format for
    images with a lot of solid colors, such as logos and illustrations. The compression
    algorithms for GIF files work best on large spans of color, however, a photographic
    image or an illustration with a lot of tonal values will result in a much larger
    file size than a same-sized image with solid colors.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_110_0.png)


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_110_1.png)


    The GIF format works best with images that have large spans of solid color. In
    this example, an image with a lot of tonal values are saved as a GIF with 32 colors.


    When saving as a GIF, your image file can contain up to 256 indexed colors, but
    you should reduce the number of colors to the minimum. You can reduce an image
    to four colors, but requires testing to find the best-looking file with the smallest
    file size.


    You can animate GIF files and include transparent pixels to blend the image with
    different-colored backgrounds. The pixels in a GIF image must be fully transparent
    or fully opaque, so you cannot fade the transparency as a PNG image, which is
    discussed in this lesson.


    In the following steps, you will open an image that contains multiple shades of
    solid color, and you will save it with a transparent background. You will then
    animate the image.


    > You should use animations conservatively because many viewers do not like the
    distraction.'
