  md: '# Defining goals and strategy


    When designing a website, an important question is to ask, “Why does this website
    need to exist?” It seems strange a client might not be able to tell you exactly
    why they want a website. The answer, “Because everyone has one,” is not a good
    answer.


    Imagine a carpenter who is hired to build a “structure” in their backyard, with
    little information provided about the final project. The carpenter needs to know
    the purpose of the structure. Do they want a shed? A bandstand? A garage? Just
    as structures have different purposes, so websites. As a designer you should be
    able to define, or have the client define, the goals of the website in a simple
    sentence. For example, in this book, you will be designing a site called SmoothieWorld,
    which has the following goal:


    To be the first step on the web for people looking for Smoothie recipes.


    Although the designer may not have defined this objective, she can certainly continue
    to the conversation. Here are some of the questions that might arise in discussing
    the functionality and design of such a site:


    +   - Will the site be free? If yes, will there be advertising and is it something
    the designer needs to include in the layout?


    +   - Has the client considered how they want to organize the recipes on the site?
    For example, could a user submit ingredients they have on hand and receive a recipe
    in turn?


    +   - What, if any, user interactions might be on site. For example, can users
    submit recipes or simply browse existing ones?


    In larger organizations, these conversations might also involve web developers,
    who would be responsible for any database functionality, along with the marketing
    department, the sales department, and other interested stakeholders. Even if these
    discussions take place before you, the designer, are brought into the project,
    you will want to have a good understanding of the goals of a website before you
    start any design work.


    # Research


    A designer who is practicing user-centered design needs to have some background
    on what visitors to a site might be expecting.


    Competitive research is one way to find this information. In the SmoothieWorld
    example, there may not be competing smoothie sites; however, there are certainly
    a number of popular recipe and cooking sites. You should understand how these
    sites are designed and what makes them attractive to users.


    In some cases, research can be objective. Perhaps the SmoothieWorld site has existed
    for some time and is being redesigned. This is an ideal situation because there
    should be some data from the history of the site you can access. You could request
    the server logs from the client. A server log is a record of information that
    most servers collect by default and is often accessible from the hosting company
    or Internet service provider (ISP) for the site. The raw data from'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'server logs is not particularly useful until it has been organized. This organization
    of server log data is done with analytic software.Analytic software takes information
    such as the type of browser the user is visiting, monitor resolution, and which
    pages are most popular, and it formats this data to provide a useful profile of
    site’s user base. Often analytical tools are installed on a site and available
    as the site is running, so you can gather information about the site’s effectiveness
    on a regular basis.


    # Scenarios and characters


    It can be helpful to envision some fictitious users of your site. You can create
    several characters and think about how they were introduced to your site, what
    they hope to achieve while using the site, and what are their priorities. By envisioning
    the experience through others'' eyes, you can gain a more user-focused experience.


    # Web analytics


    You can obtain analytics in two ways: through the hosting company, and through
    third-party analytic software such as Google Analytics or Omniture.Although many
    companies provide free services, the depth of information might be limited and
    the data may not be easy to interpret.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_30_0.png)


    A simple graph of how many pages were viewed over a week.


    More companies are using advanced analytic software to maintain and improve their
    website. Third-party analytic software often requires you to debug every page
    on your website, which allows the software to begin collecting more specific data
    such as how long, on, users might be spending on a certain page. In addition to
    the additional data gathered, another benefit of third-party analytics is the
    way they present charts and graphs in a more user-friendly way.


    (continues)'
