  md: '# The evolving field of interactive prototypes


    Traditional wireframes, mockups, and prototypes cannot fully account for the interactive
    nature of the web. For example, page mockups created in Photoshop are static so
    they cannot demonstrate how text on the page flows or how a navigation menu expands
    and collapses. Wireframes have similar problems because they are not interactive.


    Wireframing and prototyping software has evolved over the years, and a new breed
    of software and web applications are making the interactive prototyping possible.
    These elements such as roller buttons, working elements, the ability to update
    common page elements quickly, and simple animation.


    # Interactive prototyping resources


    Following are some prototyping and wireframe software resources. Most of these
    programs are available in trial versions, so you can compare and evaluate them
    based on your needs.


    # Microsoft SketchFlow


    SketchFlow is an application designed specifically for prototyping. In addition
    to a built-in library of interactive controls, it also allows you to animated
    components and data-driven user-interface elements. SketchFlow also features a
    feedback system that allows team members and clients to add comments to a prototype
    and then deliver feedback to the creator. SketchFlow is currently included with
    the Expression Blend software. If you are a full time student, you can obtain
    a free copy of the Expression software at www.microsoft.com/expression/products/SketchFlow_Overview.aspx.


    # Adobe Fireworks


    Adobe Fireworks is a vector-and-bitmap image editor that also includes features
    for creating wireframes and prototypes. For example, it includes a Pages feature
    that builds multi-page documents and generates multi-page HTML elements that are
    specifically for the web. It also includes templates for wireframes, mobile devices,
    and grid systems, among others. www.adobe.com/products/fireworks/


    # EightShapes Unify


    For designers who have a print background and are using Adobe InDesign, EightShapes
    offers a free set of components and templates. This is a complete system that
    allows you to build wireframes and prototypes using standard print layout techniques.
    http://unify.eightshapes.com/'
