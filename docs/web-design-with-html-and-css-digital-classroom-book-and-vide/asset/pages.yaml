    +   2 HTML provides the structure of the page. The style is provided by CSS and
    the interactivity is often provided by JavaScript, Flash, or Silverlight.


    +   3 Designers need to be sensitive to the fact that there are users who have
    different size monitors and will view content at various display resolutions.'
