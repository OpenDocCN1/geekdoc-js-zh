  md: '# Tools to identify browser problems


    The first step in testing your page design is to view it in the desired browser;
    however, it''s not always easy, for various reasons. For example:


    +   - You might not have access to the browser, which is a common problem when
    testing for cross-browser compatibility.

    - Different Operating systems might not allow multiple versions of Internet Explorer
    to be installed on the same system.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_217_0.png)


    Running multiple versions of Internet Explorer on a single instance of Windows
    is unsupported

    View products that this article applies to:

    Expand all | Collapse


    > Running multiple versions of Windows Internet Explorer, or portions of Windows
    Internet Explorer, on a single instance of Windows is an unlicensed and unsupported
    solution. Microsoft strongly discourages the use of any solution (whether or on-premises)
    that repackages the executable components of Internet Explorer, or portions of
    those components. Any attempt to repackage Windows to execute multiple versions
    of Internet Explorer will fail.


    Microsoft provides guidance on their website for users who need multiple browsers
    on a single machine.


    A common solution is to have access to a separate computer. Many web designers
    invest in an inexpensive computer mainly used for testing. However, this option
    might not be practical for several reasons:


    +   - Inefficiency.There might be a time lagged in continuously changing computers.

    - The debugging process involves making many small changes. It could become tedious
    to change computers after every change.


    # Virtualization solutions for the Mac OS


    One way to avoid the time and investment of a separate computer for browser testing
    is to install software on your primary computer that allows you to switch operating
    systems. This ability is known as software virtualization and refers to the ability
    to add secondary operating systems to your computer. For example, recent Mac OS
    X versions have this capacity built in with Apple Bootcamp.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Apple Bootcamp


    Recent versions of Apple Bootcamp allow you to install a Windows operating system
    (XP, Vista, or 7) on your computer, but you still need to purchase the Windows
    license independently. Although this option is useful, it has its drawbacks. To
    switch from one operating system to another, you must restart the computer. This
    introduces a time lag similar moving to a second machine that is not necessarily
    efficient.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_218_0.png)


    Built for compatibility.

    Mac always said, "Play with others." Your computer should, too. With Mac OS, you
    can use Microsoft Office, connect to most printers and cameras, join PC networks,
    and even run Windows.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_218_1.png)


    Learn more about Apple''s Bootcamp at www.apple.com/support/bootcamp.


    # Parallels and Vmw Fusion


    Parallels and Vmware software virtualization programs for the Mac that allow you
    to run Windows operating systems without the need to restart your computer. The
    benefit is the ability to quickly switch operating systems, which is much more
    efficient in the browser testing process.


    # Virtualization solutions for Windows


    As noted earlier, there is no equivalent on the Windows operating system to Apple
    Bootcamp or Parallels/Vmw Fusion, so if a Windows computer is your primary device
    and you need to test your designs on a Mac, you will need a separate computer,
    or explore some of the alternative options discussed later. However, there are
    Virtual Machine options that allow you to install separate versions of the Windows
    system on the same computer. For example, you could have Windows 7 with a modern
    browser as your primary system, and a virtual machine that runs Windows XP with
    Internet Explorer 6.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Windows Virtual PC


    Windows Virtual PC is Microsoft''s native virtualization tool that allows you
    to install one or more virtual machines on your system. The process is fairly
    straightforward; however, you need system resources, such as hard-drive space
    and memory, to make this a viable option.


    # Browser compatibility applications


    Software virtualization programs have many benefits, but they are better utilized
    for more than just testing web browser. An alternative is to use a browser testing
    or service whose only job is to test web pages. Although the details differ, the
    basic concept is the same: to provide “snapshots” of your web pages in different
    browsers.


    # Adobe BrowserLab


    Adobe BrowserLab is an online service that you can use as a stand-alone product
    or in conjunction with Adobe applications, such as Dreamweaver CS5 lets your page
    in a number of different browsers and platforms, so you are not limited to Mac
    or PC. The basic steps are to enter the URL of the page you would like to preview
    to generate a screenshot of the page. Once the screenshot is generated, you can
    compare the screenshots if you define multiple browsers.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_219_0.png)


    Adobe BrowserLab with a split view of Internet Explorer 6 on Windows XP (left)
    and Safari 3.0 on OS X (right).'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Microsoft SuperPreview


    SuperPreview is a standalone software application connected to Expression Web,
    Microsoft''s web editor. SuperPreview works the same way as BrowserLab, but it
    can preview your web pages locally. SuperPreview can define different browsers
    for comparison. There are significant benefits if you want to test your pages
    for problems with Internet Explorer 6, since SuperPreview has the code for the
    IE6 browser built into the program. SuperPreview is a Windows application that
    uses only the browsers installed on a local system, but it also has a feature
    similar to BrowserLab to view your pages using Safari on OS X.


    SuperPreview also features measuring tools and different modes that highlight
    suspected elements on the page that are likely to be the source of problem. SuperPreview
    will not solve the layout issues, but it helps you to identify them.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_220_0.png)


    SuperPreview with a split view of Internet Explorer 6 on Windows XP (left) and
    Safari 3.0 on OS X (right).


    Note that the full version of SuperPreview is not a free product, but Microsoft
    provides Microsoft Expression Web SuperPreview for Windows Internet Explorer for
    free. This is a stripped-down version of SuperPreview that you can use to test
    your pages with a destination of Internet (only IE6; there is no comparison feature).'
