  md: '# The role of the CSS


    You will not be using inline styles very often in this book, which is a reflection
    of the current state of web design. Working with a combination of internal and
    external styles is the most common practice of web designers today.


    # Internal versus external style sheets


    Internal styles are CSS rules contained directly within a document, using the
    <style> tag. The entire style sheet is contained within the opening and closing
    <style> tags.


    External style sheets are CSS rules saved in a separate document with the file
    extension .css. With internal style sheets, CSS rules apply only to the HTML in
    the current document. For, if you had a 20 page website using internal style sheets,
    you would need to create a separate style sheet in each of the pages. A change
    to the style would require you to update the internal styles in each of the 20
    pages.


    External style sheets place all the CSS rules for a site in this single document.
    You can attach the .css file to an unlimited number of HTML pages. This provides
    more flexibility. If a style is changed in the external style sheet, all paragraphs
    across the site are modified with a single step. You will make an external style
    sheet and attach it to a new HTML page.


    # Creating an external style sheet


    An HTML page does not have to be limited to just one style sheet, and many large
    websites break up their styles into separate pages, making them easier to organize
    and maintain. You can even use style sheets for functions such as printing a page
    or displaying a site on mobile devices. In Lesson 9, you will see that specific
    style sheets can even be used to make sites compatible with old web browsers when
    they are used to visit sites you create.


    In this exercise, you will create a new external style sheet, move the rules from
    your current document to the external style sheet, and then attach the style sheet
    to a new HTML page.


    +   1 Choose > New Text Document.


    > The editor you are using may have a different menu command. You may need to
    choose the equivalent command.


    +   2 Choose > Save. Save the document styles.css and save the styles.css file
    into the same folder as the HTML document you worked on in the previous exercise.
    An external cascading style sheet has a specific .css file extension but it provides
    a simple text.


    +   3 Switch to the HTML document from the last exercise, and keep the style sheet
    open as well.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_89_0.png)'
