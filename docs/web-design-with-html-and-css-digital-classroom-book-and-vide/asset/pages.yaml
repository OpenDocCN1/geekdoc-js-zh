  md: '# Lesson 3


    # What you''ll learn in this lesson:


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_52_0.png)


    +   - Creating and editing HTML using a text editor


    +   - Introduction to using Dreamweaver and Expression Web for site design and
    management


    +   - Using web browsers for testing and troubleshooting


    # Web Design Tools


    Web design tools range from simple utilities to complex and robust software packages.
    Your choice of tools may be based upon personal preference, the scope of the project,
    or the tools purchased by your employer. This lesson provides an overview of some
    of the most common web design tools.


    # Starting up


    You will work with several files from the web03lessons folder in this lesson.
    Make sure you have loaded the webfolders onto your hard-drive from www.digitalclassroombooks.com/webdesign.
    See "Loading lesson files" in the Starting Up section of this book.


    > See Lesson 3 in action!

    Use the accompanying video to gain a better understanding of how to use some of
    the features shown in this lesson. You can find the video tutorial for this lesson
    at www.digitalclassroombooks.com using the URL provided when you registered your
    book.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Web editors versus WYSIWYG tools


    This lesson provides a general overview of web design tools and also includes
    step-by-step exercises. The web editors used in this lesson are all functional
    trials at no cost. If you haven''t decided which tools to use, you''ll need to
    download and install the software tools used in this lesson. You''ll need a text
    editor, as TextWrangler (Mac) available at www.harebones.com/products/textrangler
    or Visual Developer Express available at www.microsoft.com/express/ You''ll also
    need a program with a web design surface such as Dreamweaver, available at www.adobe.com/fusion/td/index.cfm?product=dreamweaver,
    or Expression Web available at www.microsoft.com/expression/try-it.


    # Web editors versus WYSIWYG tools


    HTML and CSS use text as their foundation. Because of this, even the most simple
    text editor, such as EditText on the Mac or Notepad on the PC, is capable of creating
    web pages. These basic text editing tools, however, lack features that help with
    web design and development such as checking code syntax, organizing your site
    folders, and uploading files to web servers. In addition to text editors, there
    are also fully featured web editors and design tools, such as Adobe Dreamweaver
    and Microsoft Expression Web. These are WYSIWYG tools (“What You See Is What You
    Get”) that provide a visual layout environment, code editing, along with website
    management tools. Robust text editors and coding tools that handle web markup
    and programming languages such as HTML, CSS, JavaScript, and PHP provide another
    set of tools for creating websites. In this overview you''ll look at the advantages
    and disadvantages of each category of web design tools.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Plain text editors


    Plain text editors such as Notepad and TextEdit are included with the Mac OS or
    Windows operating systems, you likely already have one installed on computer.
    While they are widely available and free, they are not optimized for web design.Working
    with plain text editors requires excellent knowledge of the language you are coding,
    because they provide no guidance when writing code. The basic text editors also
    lack functionality for previewing your pages in a web browser, or the ability
    to check for correct syntax or broken links.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_54_0.png)


    Writing HTML and CSS in a plain text editor provides little guidance.


    These default text editors for the Mac OS and Windows can be used if you have
    no other choice, but it is unlikely you will want to use them as your primary
    web design tool.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Using Notepad or TextEdit as a web editor


    Notepad can be found on any Windows system in the Accessories panel. You can create
    an HTML document by following these steps:


    +   1 Choose Start > Programs > Accessories > Notepad, and when the Notepad window
    appears, Choose File > New.


    By default, the file is saved in the text (.txt) format and so any HTML tags that
    the file contains cannot be interpreted by a web browser.


    +   2 In Notepad, select File > Save As. Change the file extension from .txt to
    .html instead of Files;


    +   3 Specify "All Files" in the Save as field. Change the Encoding value to UTF-8
    instead of ANSI; this is the necessary encoding for HTML pages.


    +   4 Click the Save button.


    If you work on a Mac OS computer, you can use the TextEdit application to create
    or modify HTML and CSS files.


    +   1 On your Mac, open the Applications folder and locate the TextEdit application.


    By default, TextEdit is designed to open and save documents as .rtf (rich text
    format) in. To use it successfully for HTML, you must change the application preferences.


    +   2 Choose TextEdit > Preferences. The Preferences dialog opens.


    +   3 In the New Document tab, click to select the Plain text radio button. With
    this option selected, TextEdit creates only plain text without any formatting
    to the text.


    +   4 Click the Open and Save tab select the radio buttons for both Ignore rich
    text commands in HTML files and Ignore text commands in RTF files. With these
    options selected, TextEdit will open and create HTML files. You will also need
    to deselect the Add "txt" extension to plain files option as you will select the
    .html extension when you save.


    +   5 In the HTML Saving Options, set the document type to XHTML 1.0 Transitional,
    make the Styling menu to Embedded CSS, and make sure the Encoding menu is set
    to Unicode (UTF-8).


    | HTML Saving Options |

    |---|---|n| Document type | XHTML 1.0 Transitional |

    | Styling: | Embedded CSS |

    | Encoding: | Unicode (UTF-8) |


    +   6 Close the Preferences dialog box and exit TextEdit by selecting TextEdit
    > Quit EditText. Then restart TextEdit by double-clicking the icon in the Applications
    folder. When you restart the program, the new preferences will be used.'
  merge: -1
