- img_proc: true
  md: '# Finding and replacing code


    Most text editors for coding also have robust tools for searching and replacing
    code. Although this could be helpful on a single page, it is indispensable on
    larger projects where you need to make changes on a large number of pages across
    a site.


    # Much more!


    Advanced text editors are designed to scale, and accommodate advanced users. Developers
    and programmers who regularly code in more sophisticated languages as PHP (originally
    an acronym for ''Personal Home Page''), ASP (Active Server Pages), and Ruby on
    Rails (a framework for web applications) often use the advanced features of text
    editors to help build their sites. In many ways, the line between text editors
    and WYSIWYG editors is becoming blurry. Text editors have built-in functionality
    that allows you to build local sites that keep track of site elements such as
    hyperlinks between documents, and media as images and videos.They may also have
    an internal page preview feature or some form of FTP client that allows users
    to publish their pages to the web.


    # An overview of text editors


    The following is a brief list of popular text editors for Mac OS and Windows computers.
    These editors offer capabilities such as automatic code completion, code coloring,
    and code checking.


    **BBedit and TextWrangler (Mac)** These text editors are similar and are developed
    by the same company.TextWrangler is free and has fewer features than BBedit. www.barebones.com


    **Coda (Mac)** is a text editor that also provides site management, browser preview,
    and built-in web publishing. www.panic.com/coda/


    **TextMate (Mac)** Along with being a text editor, its functionality can be extended
    by bundles that extend the capabilities ofTextMate; for example, there are bundles
    that making JavaScript to your pages much easier. http://macromates.com


    **E Text Editor (Windows)** E Editor is a Windows-based text editor that supports
    many of the features ofTextMate as bundles and snippets. www.e-texteditor.com


    **Microsoft Visual Developer Express (Windows)** provides a full featured text
    editor for web coding that supports HTML, CSS, and functionality for .NET programming.
    It also provides a basic layout environment for website design and development.
    www.microsoft.com/express/'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# WYSIWYG editors


    The concept behind WYSIWYG web editors is that you create web pages in design
    view and the program writes the HTML and CSS code behind-the-scenes. These tools
    claim to provide a visual way to create web pages without needing to understand
    HTML or CSS code. To effectively use any web design tool, you still need an understanding
    of HTML and CSS, and these design tools all include methods for working with code.
    Editing is often required when using WYSIWYG editors, despite their layout capabilities
    and marketing claims. If you are just starting out as a web designer, it is useful
    to know that many professionals perceive WYSIWYG tools as inappropriate for professional
    use. While this sentiment is not universal, there is a large population of web
    designers and developers who dislike WYSIWYG editors because they do not always
    produce the best code for a situation.

    WYSIWYG applications generally cost more than text editors, and the time required
    to learn many WYSIWYG applications can be as much as learning HTML and CSS code.
    Despite the high cost and time to learn, the use of WYSIWYG editors is widespread.
    Additionally, they can speed up your design work with some projects.


    Most popular WYSIWYG editors also include features to help you code your pages
    when entering code. These include capabilities similar to text editors, such as
    code completion, code coloring, and automation. Two of the most popular WYSIWYG
    editors are Adobe Dreamweaver and Microsoft Expression Web. Both applications
    have similar capabilities. Expression Web is available on Mac and Windows platforms
    while Expression Web is only available for Windows computers. Expression Web is
    available at no cost if you are a student, see the note about the Microsoft Dreamspark
    program, and has a suggested retail price of $150 for business users. Adobe Dreamweaver
    is $150 if you are a student, and $300 if you are a business user. You can obtain
    fully functioning trial of these products to evaluate them for your own use at
    www.microsoft.com/expression or www.adobe.com/dreamweaver.


    > Microsoft Dreamspark provides no-cost software from Microsoft to full-time students.
    If you are enrolled as a student, you can obtain Microsoft Expression Web as part
    of the complete Microsoft Expression Studio package by enrolling at www.Dreamspark.com.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Design and layout tools


    Both Dreamweaver and Expression Web use icon-based menus and panels to format
    text, insert images, and add media such as video files, Flash movies, or Silverlight
    objects. Adding elements such as hyperlinks, div tags, and form elements dragging
    them onto a page.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_60_0.png)


    The Dreamweaver Insert panel features objects in several categories that let you
    easily add images, web forms, and media to your page.


    Expression Web makes it easy to add page elements with the Toolbox panel.


    # Site management and file transfer protocol


    Both Expression Web and Dreamweaver include site management tools, including file
    transfer protocol (FTP) capabilities allow you to upload files to a web server
    from your local machine. They also support reusable objects, as such page templates
    and library items, and can check links to make sure they go to valid pages or
    objects. The site management tools are helpful, as they make certain that links
    that are created while working on your computer function correctly when the site
    is moved to a web server.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Coding environment and text editor


    Dreamweaver and Expression Web offer a code-only view of web pages which can be
    used for modifying HTML or CSS code, or a design view to work on pages visually,
    or a split view that displays the code and the visual layout at the same time.


    Both programs support popular coding and scripting languages, such as JavaScript,
    and several server-side languages, including ColdFusion, PHP, and ASP Specialized
    menus and code panels help you build pages and applications in the language of
    your choice. Expression Web offers particular strong capabilities for designers
    working on sites that use Microsoft’s ASP scripting language.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_61_0.png)


    Code view in Dreamweaver and Expression Web provides features compatible to a
    stand-alone text editor.


    Scripting languages, such as those used to build interactive web pages or e-commerce
    sites, fall into two categories: client-side and server-side. Client-side languages,
    such as JavaScript, run in the web browser, while server-side languages, such
    as ColdFusion or ASP require special software to be installed on the web server.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Templates and reusable elements


    Dreamweaver and Expression Web provide templates that are essentially parent master
    pages. A master page controls the structure and appearance of multiple attached
    pages, so any change to a master page is automatically applied to the child pages.
    This provides a consistent appearance across websites and ensures that sites are
    applied quickly and globally across any site. Templates also allow you to make
    certain sections of a web page non-editable so that users don''t maintain certain
    content or design elements. For example, the content of a News page could be designated
    as fully editable, but the navigation bar could be marked as off-limits.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_62_0.png)


    > Both Dreamweaver and Expression Web support the same template format, which
    uses the dwt extension. Expression Web also has an alternative template system
    called ASP.NET Master Pages. The ASP.NET template system is designed for .asp
    websites, whereas the .d template can be used for any HTML-based site.


    # Defining sites in Dreamweaver or Expression Web


    Both applications use site folders for the local and remote storage locations
    a website resides. When you define a site folder, the program keeps track of the
    files being used.When you add, remove, rename, or reorganize your asset files,
    Dreamweaver and Expression Web update any related hyperlinks.The files on your
    local drive can also be synchronized with the files on your remote server using
    integrated FTP capabilities.


    In the following two exercises, you will walk through the initial steps of creating
    a new site in Dreamweaver and Expression Web.These exercises are designed to get
    you up and running in either (or both) of these popular web design applications.
    If you will only be working in a text editor, you used the "Using design tools
    in the browser" exercise, or if you already plan to use only one visual editor
    or the other, you need to only complete the section relating to that WYSIWYG editor.


    # Obtaining Expression Web or Dreamweaver


    Remember that Expression Web is available at no cost for students at www.dreamspark.com
    or for other users at www.microsoft.com/expression/try-it and you can download
    a trial version of Dreamweaver from Adobe''s website at www.adobe.com/products/dreamweaver.'
