  md: '# Resizing the image


    In this case, you have a mock-up that helps to determine the size of the final
    images. Even if you do not have a mock-up prepared, before optimizing your images,
    you should know the approximate size of your final images based on the final size
    of the web page.


    # Images and Browser Window Size?


    According to the Weather.com, over 50 percent of users have monitors with a resolution
    of 1024 × 768 pixels. Twenty percent have 1280 × 1024-pixel monitors. This does
    not mean their browser window opens to that size; in fact, their browser window
    usually varies from 800 × 600 pixels to 960 × 600 pixels.


    To determine how wide a web image should be, separate the total number of screen
    pixels and, specify the section you want the image to occupy. For example, if
    you want the image to occupy half the screen (remember, browser windows are typically
    about 900 pixels across), type 480 into the Width text field in the Pixel Dimensions
    section of the Image Size dialog box; for one-quarter of the screen, type 240,
    and so on. You should also remember that the pixel size will not change, regardless
    of what the Resolution of your image is. So, 200 pixels in a 300-ppi image occupy
    as much window space as 200 pixels in a 72-ppi image.


    At this point, you can determine the approximate size of the optimized images.
    In this example you will use the grid feature, separated into percentages, to
    help you determine the size of the images.


