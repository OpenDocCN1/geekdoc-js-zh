  md: '# Moving your internal styles to the external style sheet


    Currently, the majority of the layout styles for this page is internal. However,
    these styles will not automatically apply to new HTML pages that you might want
    to add.To cut the styles from this page and paste them into your base.css external
    style sheet.


    +   1 In your 08_layout.html document, select all the rules from your opening
    <style> tags. Press Ctrl + X (Windows) or Command + X (Mac OS) to cut the rules.

    2 Choose File > Open, navigate to your web08lessons folder, and select the base.css
    style sheet. This style currently contains the rules for your style. At the bottom
    of the style sheet, after the <ol> rule, press Return a few times to add space,
    and press Ctrl + V (Windows) or Command + V (Mac OS) to paste your rules. Choose
    File > Save to save your changes.

    3 Keep this file open because any future additions or modifications that you make
    to your pages will be made. Switch to your 08_layout.html page and choose File
    > Save. Preview it in your browser to ensure the styles show correctly. There
    should be no change in the page.Your styles are now contained in the base.css
    page, not the 08_layout.html page.


    # Creating a style for the active page


    Now that you have saved your styles in an external style sheet, you will create
    two new pages that will use these styles: The Contact page and the About Us page.You''ll
    create additional pages at the end of this lesson.


    +   1 In your 08_layout.html page, choose File > Save and rename it 08_about.html.
    Scroll to the heading 1 SmoothieWorld is your #1 destination for smoothie recipes.
    You''ll identify this heading to help you identify this page, and later you''ll
    add more content to this page. Type the following (highlighted in red):

    ```html

    <h1>About Us</h1>

    ```


    +   2 Add an ID to the About Us page as you did with the home page adding the
    following code (highlighted in red) to the body tag:

    ```html

    <body id="about">

    ```

    Choose File > Save. Now you''ll add a rule to your style sheet to target the nav-about
    class attached to your About Us link, as instructed in the next step.'
