  md: '# Styling a heading


    To get a sense of how CSS works, you''ll create a simple CSS rule that changes
    the style of a heading. In your index.html page, you already have the content
    "SmoothieWorld" nested inside an <h1> tag. Perhaps one of the best ways to begin
    thinking about how CSS works is to know how default style of this heading is rendered
    in the browser.


    +   Examine the heading of the file you viewed in the last step of the previous
    exercise.The style and formatting instructions are provided by the browser. The
    size, color, and font are provided by the browser because exact formatting instructions
    are not specified.The browser only knows that this is a headline. You will redefine
    this style with a CSS rule.


    +   In your code, the <title> tag on line 5, click at the end of the line; following
    the closing tag, then press return to add a new line of code.Type the following:
    <style type="css">


    +   Press Return and then type <style>.This is a style element you will use to
    place your rule for the style of the <h1> element.


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

