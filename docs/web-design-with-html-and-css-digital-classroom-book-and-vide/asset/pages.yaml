  md: "# Using margins to modify the space between your text\n\nIn this exercise,\
    \ you will work with the CSS margin property in order to change the amount of\
    \ space between your text elements. Understanding how the margin property works\
    \ and how to control it is key to understanding CSS, and in the first step toward\
    \ CSS layout. In order to understand all the effects of margins for text, you\
    \ will add the margin property to your body style.\n\n+   In the body style, add\
    \ the following line (highlighted in red):\n```css\nbody {\n  font-family:Trebuchet\
    \ MS\", Tahoma, Arial, sans-serif;\n  font-size:100%;\n  margin: 20%;\n}\n```\n\
    \nThis margin property sets the margins of the page in shortcut form. The 0 value\
    \ is for the top and bottom margins. The 20% value is for the left and right margins.\n\
    \n+   Save your page and preview it in your browser. You will see that your text\
    \ is centered in your browser window. Change the width of your browser window\
    \ and you see the text reflow.\n\n![](img/89ff5fabf61426c3441d5d5c6a41600b_141_0.png)\n\
