  md: '# Be creative during the planning process


    The planning stage can be a fun part of the site creation process, because this
    is where you can propose crazy ideas that may never make it onto the final site.You
    want to avoid limiting yourself, as there will time for a reality check once the
    designing and coding begins! Whether it involves user testing or receiving feedback
    from a wireframe, if you learn how to collaborate and incorporate good ideas into
    your design, your final product will benefit.


    +   * Early sketches should be drawn quickly

    It''s OK for the early sketches of your web pages to be loose, lacking in detail,
    and incomplete. It''s more important to capture your initial ideas in some form.
    Sketches are cheap and disposable, so don''t focus on the quality of a sketch;
    focus on the ideas behind it.


    +   * Failure is an option!

    You are unlikely to get concepts right the first time. In fact, you may not be
    trying hard enough if you aren''t discarding ideas for Layout, imagery, or themes
    for your site.


    +   * Accept criticism

    Web design can be a tough field, and your designs and ideas will at some point
    be questioned or knocked-down.Try not to take it personally when this happens.That
    mockup you worked on all day really may not be a good fit for the project. If
    you can keep an open mind, and collaborate with others, your design will ultimately
    be stronger. You may even find that ideas rejected from one project might be a
    good fit for some future site.'
  merge: -1
