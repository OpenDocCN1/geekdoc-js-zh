    # Review


    # Questions


    +   1 What is an event as it relates to JavaScript and HTML?


    +   2 What is a JavaScript library, and what are the advantages of using one?


    +   3 What are some of the advantages and disadvantages of using interactive media,
    such as Flash and Silverlight?


    # Answers


    +   1 An event on an HTML page originates from a user interaction, such as clicking
    a button or loading a page.These events can then trigger specific JavaScript code
    that runs in the user''s browser.


    +   2 A JavaScript library, such as jQuery, is a collection of JavaScript code
    that lives inside an external JavaScript file. You can easily reference a library
    to add functionality such as animated menus or interface elements. Using a library
    is advantageous for designers because they can add relatively sophisticated behavior
    without writing complex JavaScript code.


    +   3 Flash and Silverlight allow for the creation of content that goes beyond
    the capability of HTML, CSS, and JavaScript.This content might include animation
    and integration of video as a broader range of creative choices beyond layout
    and fonts. The disadvantages include the need for separate authoring programs
    and the need for users to have the plugin installed. In addition, due to technical
    limitations, important content within Flash and Silverlight files might not be
    indexed in search engines or be visible in mobile devices.'
