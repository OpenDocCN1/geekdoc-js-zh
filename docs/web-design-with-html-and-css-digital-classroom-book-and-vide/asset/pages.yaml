  md: '# A brief history of layout techniques on the web


    # Understanding <div>: creating a two-column fixed-width CSS layout


    In this exercise, you will build a fixed-width two-column layout. Then, you will
    work with a basic page that has been set up for you. This page uses a series of
    HTML elements as the basic structure.Think of the <div> as a container in which
    you''ll place logically elements on a page. Opening and closing <div> tags are
    often placed around other elements on a page, nesting the related elements inside
    the container. You may have multiple <div> elements on a page and they are often
    used to create the layout structure of a page. A <div> element often has a CSS
    class or ID attribute, which are used to style the manner. By using <div> elements
    you can make it easier for others to identify the sections of your page, and it
    can make it easier to control and style a section of a page. Here you will combine
    the <div> element with CSS IDs.


    In your text editor, choose File > Open. In the dialog box that appears, navigate
    to the web7lessons folder. Select the 07_layoutstart.html file and click OK.


