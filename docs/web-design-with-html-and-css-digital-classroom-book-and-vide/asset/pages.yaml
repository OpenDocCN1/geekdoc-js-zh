  md: '# About the Authors


    Jeremy Osborn is the Content Director at American Graphics Institute. He has more
    than 15 years of experience in web, graphic design, filmmaking, and publication
    development for both print and digital media. He is the author of the Dreamweaver
    CSS Digital Classroom and has contributed to many of the titles in the Digital
    Classroom series. Jeremy holds a MS in Management from the Marlborough College
    Graduate Center and a BFA in Film/TV from the Tish School of the Arts at the NYU.


    Jennifer Smith is a founding member of American Graphics Institute (AGI) and serves
    as its Vice President. Prior to founding AGI, she worked in advertising as an
    art director and served as a principal in a Pennsylvania-based design firm. She
    is the author of more than 20 books on electronic publishing. Jennifer''s 20 years
    of design experience bridge the gap between technical and creative, and frequently
    works with both developers and designers. A Renaissance artist with technology,
    you''ll find Jennifer integrating her design skills with web, interactive, and
    application projects.


    The AGI Creative Team is composed of web design experts and instructors from American
    Graphics Institute (AGI). They work with many of the world''s most prominent companies,
    helping them use creative software to communicate more effectively and creatively.
    They work with design, development, creative, and marketing teams around the world,
    delivering consulting, private customized training programs, and teach regularly
    scheduled development sessions at AGI''s locations. The Digital Classroom authors
    are available for professional development sessions at companies, schools and
    universities. More information is available at agraitraining.com and digitalclassroom.com.'
