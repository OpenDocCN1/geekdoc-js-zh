  md: '# Wireframes, prototypes, and mockups


    After you have defined the goals and decided on the information architecture of
    a website, there are important stages in the design process you should complete
    before writing a single line of HTML or CSS. If you begin designing visuals or
    building pages before you are prepared, you may end up discarding your work. By
    using wireframes, mockups, and prototypes, you can quickly create to explore different
    options and functionality for the site. Making changes before writing code and
    creating graphics allows you to make changes more quickly and less costly and
    more efficient. Whether or not you use all three models depends on the size of
    the project. Larger projects that incorporate complicated elements, such as a
    connection to a database, or use multiple features, will benefit from using all
    three.


    # Wireframes


    Wireframes are typically created in black and white or shades of gray, using placeholders
    for images. Wireframes avoid the visual design of the site and are more concerned
    with the organization of the content and features. You can create a wireframe
    in a program like Adobe Illustrator, Adobe Firework, MicrosoftVisio, or OmniGra,
    or even by using a sketch on paper or a whiteboard. A wireframe does not need
    to be interactive, and is a fast way to start a conversation between designers,
    clients, and other members who are involved in a project.


