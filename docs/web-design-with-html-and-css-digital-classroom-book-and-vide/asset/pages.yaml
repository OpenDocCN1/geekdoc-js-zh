  md: '# The motivation behind HTML5


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_273_0.png)


    # HTML5 and web standards.


    Every new Apple mobile device, and new Mac—along with the latest version of Apple''s
    Safari browser—supports web standards including HTML5, CSS3, and JavaScript. These
    web standards are open, reliable, highly secure, and efficient. They allow designers
    and developers to create amazing graphics, typography, animations, and transitions.
    Standards aren''t add-ons to the web. And you can start using them today.


    HTML5 Showcase


    HTML5 is marked as a significant evolution in web design; however, it is more
    than just a new set of HTML tags.


    There is a difference between the HTML5 core and the HTML family.You can define
    the HTML5 core as new markup elements used to build web pages. Many of these elements
    include traditional HTML tags, such as `<p>`, `<ul>`, and `<div>`.The HTML5 family
    includes the HTML5 core and technologies such as CSS3, geolocation, Web Storage,
    Web Workers, and Web Socks.


    As pages and web applications have become increasingly sophisticated, there is
    a limit to what the current languages can do. HTML5 represents an evolution in
    the capabilities of browsers.


    # The motivation behind HTML5


    The version of HTML currently in use is HTML4.1. XHTML1.0 is largely the same
    as HTML4, but with stricter rules, such as requiring lowercase tags and for all
    opening tags to have a closing tag.The original specification for HTML5 was called
    Web Applications 1.0, and this name hints at some of what the new language is
    trying to accomplish: to provide a method of making HTML capable of doing more
    than its current format.


    For example, HTML cannot currently play multimedia such as audio and video; it
    requires a browser plugin such as Flash or QuickTime. HTML also has no capacity
    to store data. There is no native drawing format in HTML; graphics and animations
    are currently supplied as image files or through browser plugins like Flash, Java,
    and Silverlight. Many of these limitations are addressed in the HTML5 family.
    The next section describes the changes in HTML5 markup.


    Web Design with HTML5 Digital Classroom


    256'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# HTML5 markup


    HTML5 markup introduces a number of new tags designed to make the structure of
    a web page more logical and functional. Recall the lessons on basic and advanced
    layout: you relied heavily on the <div> tag and often paired this with a CSS class
    or ID. For example, the code for your header was:


    ```

    <div id="header">This is my header </div>

    ```


    The ID "header" is arbitrary. Some designers might use the name masthead, topsection,
    or rectangle_on_top. To add logic and consistency, HTML5 uses a unique tag named
    <header>,so you could use the following code:


    ```

    <header>This is my header </header>

    ```


    HTML5 has new tags based on this concept, such as <footer>, <nav>, <section>,
    <aside>, and <article>. The goal is to reduce the current reliance on <div> and
    replace them with a more consistent and readable page structure. HTML5 doesn''t
    replace anything you have learned in this book. The <div> tag has not disappeared,
    but it longer has to support the load of a page layout. The new HTML5 element
    names come from the combination of HTML and CSS that most designers adopted: <div
    id="nav"> <div id="footer">, and so on.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_274_0.png)


    The structure of your SmoothWorld site with HTML5 elements

    A. Header. B. Nav. C. Section. D. Article. E. Aside.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Section and Article


    Most of the new HTML elements designed for layout are logical, but some are not
    as intuitive as <nav>, for <section> and <article>.A section is a distinct and
    often self-contained block of content. It is similar to the process of defining
    a div as main or content:


    ```

    <section id="smoothies">

    <h1>Banana Smoothie Recipes</h1>

    <p>The following list of banana smoothie recipes were collected from our readers
    </p>

    <h1>Facts about bananas</h1>

    <p>Bananas contains lots of potassium and their peels are often used for practical
    jokes </p>

    </section>

    ```


    An article is also a self-contained block of related content, but used when the
    content could exist independently of the web site:


    ```

    <article>

    <h1>Reviewing the Fruit-o-matic 10 speed blender</h1>

    <p>We put the Fruit-o-matic through its paces in various blending, ice-crushing,
    and puréeing tasks.</p>

    </article>

    ```


    The <article>element is useful because of its independent nature and the people
    currently access content on the Web. You can publish an article on your web site,
    but using technologies as newspapers and mobile devices, a user might have your
    latest articles delivered to their device without visiting your web site.


    # The <video>, <audio>, and <canvas> elements


    One of the most publicized features of the HTML specification is the inclusion
    of native tags that allow you to add multimedia without the need for browser plugins.
    The <video> and <audio> allow you to embed video and audio into your pages the
    same way you would with the <img> tag. The <canvas> tag is designed to supply
    HTML with a native drawing and animation format. This could provide an alternative
    platform for displaying the type of graphics and animation often found in Flash
    movies. As innovative the development of these new tags might be, there are significant
    issues that must be addressed.


    # Embed media files using <video> and <audio> elements


    The structure for embedding video and audio is simple. For example, the code for
    adding video to your page is simple as this:


    ```

    <video src="catz.mp4" width="400" height="300"></video>

    ```'
  merge: -1
