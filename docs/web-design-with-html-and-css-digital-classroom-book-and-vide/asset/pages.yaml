    # Addressing Internet Explorer 6 issues with JavaScript


    Addressing the newest layout to appear in your page designs is impossible and
    it is beyond the scope of this, but there are a few recurring issues that we can
    address in regards to Internet Explorer 6. Conditional comments are not the only
    solution. For example, there is a well-known bug in Internet Explorer 6 with transparency
    files in the PNG format.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_222_0.png)


    This image was saved in the PNG file format and has transparent areas (the area
    to the left and of rounded corners in the bottom half of the gradient).This effect
    allows you to change the background color of any page element the button is placed
    on to let the background color show.


    Internet Explorer 6 does not support the transparency, so you would see a solid
    color in the transparent areas.'
