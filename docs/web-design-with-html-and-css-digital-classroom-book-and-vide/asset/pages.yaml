    \ experts. Other smoothie sites might have more or feature exotic fruits than\
    \ you'll find here, but we feel that quality beats quantity and nearly any day.\
    \ We also believe the best recipes come from the reader, that's why we encourage\
    \ you to join the smoothie community. Read more |\n\nApplying borders to your\
    \ elements helps you get the layout as defined by your browser. As we learned\
