    2. In the last paragraph that “All content on this side is the copyright of SmoothieWorld,"
    click once before the word SmoothieWorld and then type the following code: <a>.This
    <a> is the opening for the anchor element, which you use to link to other pages
    in your site or elsewhere on the Internet.


