  md: "Add the following code (highlighted in red) around the heading 1:\n\n```\n\
    <div id=\"splash\">\n<h1>SmoothieWorld is your #1 destination for smoothie recipes.</h1>\n\
    </div>\n```\n\nAdd a new style rule for this ID, below.\n\nOpen the base.css external\
