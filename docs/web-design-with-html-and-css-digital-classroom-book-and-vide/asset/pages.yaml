    ![](img/89ff5fabf61426c3441d5d5c6a41600b_44_1.png)


    Although not technically the first web browser, the Mosaic browser released in
    1993 triggered the popularity of websites worldwide.


    # Domain names and hosts


    Domain names help users find where they are on the Internet. Domain names are
    commonly surrounded by www on the front and .com on the end. Domain names can
    include various endings such as .org, .edu, and .gov.


    Domain names exist because it is not very convenient for you to use or remember
    IP addresses. Domain Name Servers (DNS) translate easy-to-understand domain names
    to IP addresses. A DNS converts a family of letters, the "domain name," to the
    numbered IP address. Instead of typing the IP address 72.32.147.166 into a web
    browser, you can type the domain name, such as www.digitalclassroomrooms.com.
    A DNS on the Internet connects your request to the appropriate server.


