  md: "# A brief history of layout techniques on the web\n\nThis review of web layout\
    \ is relevant because a vast number of websites were built and continue to be\
    \ built using the table method. CSS has been replacing the use of tables for layout,\
    \ but the process is a slow, gradual one. Table layouts have an advantage of being\
    \ reverse-compatible with older browsers; however, this advantage has decreased\
    \ as people update to newer browsers.\n\nCSS layouts were also not well supported\
    \ (if at all) by web browsers, and for web designers, there was no real incentive\
