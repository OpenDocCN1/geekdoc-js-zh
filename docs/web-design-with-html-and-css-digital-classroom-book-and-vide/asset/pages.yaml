- img_proc: true
  md: 'You can interactively manipulate pixels onscreen, render text, and export these
    contents to a static image, such as a PNG file. With the addition of JavaScript
    and the new CSS3 animation features, you can also make the objects you create
    move, fade, scale, and so on.\Adding a canvas element is simple:


    ```

    <canvas id="myCanvas"></canvas>

    ```


    The work behind the scene is performed by JavaScript, which provides a context
    for any objects you create:


    ```

    var canvas = document.getElementById("myCanvas");

    context = canvas.getContext("2d");

    // x = 10, y = 20, width = 200, height = 100

    context.fillRect(10, 20, 200, 100);

    ```


    This code creates a simple rectangle with the color black. This code might seem
    too complicated for some use, but for the first time, HTML has its own drawing
    format. The current drawback is you must draw your objects using code similar
    to the example above; there are no true equivalents to the drawing tools found
    in applications such as Flash. However, this might change quickly with the advent
    of third-party plugins such as Ai->Canvas (available at http://vistmisc.com/labs/ai2canvas/),
    which allows you to export vector graphics in Adobe Illustrator to the canvas
    element.


    # HTML5 markup is still evolving


    HTML markup will take a time to become part of your standard toolbox. Many modern
    browsers currently support the new tags, but the final specification will not
    be delivered for years (current estimates around the year 2022). This means that
    tags as <header> and <section> might change or be renamed. For the major elements,
    it is unlikely to happen because all modern browsers support them today; you can
    use a number of additional elements as you are careful.


    # Grouping headings and images


    The <group> element is designed to act as a container for one or more related
    headings. It can only contain a group of <h1> to <h6> element(s):


    ```

    <group>

    <h1>Today''s News</h1>

    <h2>Recent Developments in Blending</h2>

    <h3>Dancer Chris Leavey explains his new style of smooth making</h3>

    </group>

    ```'
  merge: -1
