  md: "# The role of CSS\n\nCascading Style Sheets (CSS) use a separate language from\
    \ HTML. CSS allows you to apply consistent styling of elements across all pages\
    \ on your site, so that all headings, lists, and paragraphs look and act the same\
    \ on every page of a site.\n\n# How we refer to CSS syntax in this book\n\nBefore\
    \ we begin to work with CSS, we need to explain how we refer to the various parts\
    \ of CSS syntax throughout this book. This is not as easy as it sounds there is\
    \ a gap between the official specification of the CSS language and the way designers\
    \ often refer to CSS in the \"real world.\" Nevertheless, here are the fundamentals:\
    \ the following code is what we refer to as a rule:\n\n```\nh1 {\n  color:blue;\n\
    \  margin-top:lem;\n}\n```\n\nThere are various components to this rule, as follows:\n\
    \n![](img/89ff5fabf61426c3441d5d5c6a41600b_83_0.png)\n\nWe will refer to each\
    \ of the various components time to time throughout the book, so if we ask you\
    \ to change the value \"blue\" to \"red\" you should know what to do. Or if we\
    \ ask you to locate and change the h1 selector to a h2 selector, it should make\
    \ sense.\n\nOn a day-to-day basis, designers aren't as specific as however. For\
    \ example the rule above might be referred to as a \"style,\"the rule,\"the h1\
    \ rule,\"the CSS rule for h1.\"Also, as you can see above, the official name for\
    \ the pair of the property and the value is called a declaration.Again, in everyday\
    \ use, the use of the term \"declaration\" is not common and most designers will\
    \ use the term property or properties interchangeably."
  merge: -1
