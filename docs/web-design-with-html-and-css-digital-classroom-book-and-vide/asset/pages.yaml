  md: '# How web pages work


    request a page, which would then display on the user''s computer. Berners-Lee
    dubbed the World Wide Web, and his program was a simple version of the first web
    browser. Browsers and the information available have evolved greatly, but the
    technical concepts have not changed. One computer with TCP/IP address is able
    to request information, as a web page, from a computer located at TCP/IP address.


    Researchers such as Berners-Lee had the instant access to documents, and the World
    Web was used at first primarily by academics for research purposes. Commercial
    uses of a web browser displaying text and graphics quickly evolved. In 1994 there
    were mere a handful of websites in existence, and five years later, there were
