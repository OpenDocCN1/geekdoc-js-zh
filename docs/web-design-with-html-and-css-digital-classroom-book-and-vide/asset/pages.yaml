  md: '# Self study


    +   1 Evaluate the different browser-testing options outlined in the lesson. Depending
    on your platform (Mac/PC), begin testing sample websites or files that you have
    worked on.


    +   2 For the CSS3 portion of this lesson, experiment with some of the more supported
    features, such as text-shadow and RGBA properties. Perform a research online for
    recently published articles on the web.


    # Review


    # Questions


    +   1 What are three ways you can test your web page will appear on browsers that
    are not on your platform?


    +   2 What are conditional comments and when would you use one?


    +   3 What are the strengths and weaknesses of using a feature as border-radius
    that is currently part of the CSS3 specification and therefore not supported in
    older browsers?


    # Answers


    +   1 Three ways you can test your web design on other browsers and platforms
    are: a) Using a separate computer with an alternative operating system installed.
    b) Using a “virtual machine” that allows you to install an operating system on
    your current computer and c) Using a web service or a standalone application such
    as Adobe Labrador or Expression SuperPreview to test pages.


    +   2 Conditional comments are comments that target only specific versions of
    Internet Explorer web browsers. Conditional comment allows you to create external
    style sheets commonly used to create styles that fix problems with older browsers,
    such as Internet Explorer 6.


    +   3 CSS3 properties allow designers to adding effects, such as border-radius
    or drop shadows. However, they often require special vendor-specific code that
    will only work in certain browsers. Additionally, web browsers that don’t support
    the CSS3 features will not display them. This requires the designer to be careful
    when using these properties as central design elements.'
