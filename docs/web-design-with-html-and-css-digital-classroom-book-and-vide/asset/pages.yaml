  md: "# Enhancing your CSS navigation bar\n\nNow you'll make your navigation bar\
    \ more aesthetically pleasing. Currently, it uses the positioning and colors you\
    \ added in Lesson 7 to understand how floats work. Now you will use CSS to add\
    \ styling and interactivity. To review how the menu works, modify some of the\
    \ properties to create a navigation menu suited for the style of your page, as\
    \ indicated in the following steps.\n\n+   In your 08_layout.html inline sheet,\
    \ locate the #mainnav rule. This rule sets the height of the div to 40 pixels\
    \ and gives it a pale-green background color. Below this rule is the #mainnav\
    \ li rule, which is floating the list items to the left as well as setting styles\
    \ as width, height, background color, and more.\n\nPreview the page in your browser\
    \ to see how the navigation bar is currently styled. List items (with a background\
    \ color of grey) are not the same as the #mainnav div, which is why there is a\
    \ gap. You' fix this now:\n\n![](img/89ff5fabf61426c3441d5d5c6a41600b_200_0.png)\n\
    \nYour lists are not the same as the surrounding navigation section; this accounts\
    \ for the visual gap.\n\n+   Return to your text editor. To make the list fit\
    \ into the mainnav, both elements need to be the same height. Make the following\
    \ changes to your rules (highlighted in red).\n\n```\n#mainnav {\n  background-color:\
    \ #60668B;\n  height:35px;\n}\n\n#mainnav li {\n  float:left;\n  width:120px;\n\
    \  height:35px;\n  background-color: #7D83A4;\n  text-align:center;\n  border-left:1px\
    \ black solid;\n  border-right:1px black solid;\n  line-height:35px;\n}\n```"
  merge: -1
  pgno: 200
- img_proc: true
  md: "# Working with CSS background images\n\nSave the page and then preview it in\
    \ your browser. By making the heights same value, you now have a narrower navbar.\
    \ By changing the background colors to shades of blue, you now have colors that\
    \ are more compatible with the background color of the page. Unfortunately, the\
    \ default hyperlink color is also blue, and the rule below is not very attractive.You\
    \ will change the link color and remove the underline next.\n\n+   Below your\
    \ #mainnav ul li rule, add the following rule:\n\n```\n#mainnav ul li a {\n  color:\
    \ #ffffff;\n  text-decoration: none;\n}\n```\n\nThis rule is necessary because\
    \ you are targeting hyperlinks inside the mainnav div. The color and text-decoration\
    \ properties set the style of these links to white and also remove the underline.\
    \ Save the page and preview it in your browser.\n\n![](img/89ff5fabf61426c3441d5d5c6a41600b_201_0.png)\n\
    \nStyling the appearance of the hyperlinks by removing the underline and setting\
    \ the color to white.\n\nThis navbar is aesthetically pleasing. You can improve\
    \ its usability by making the navbar items color when the user moves the cursor\
    \ over them and providing a visual indicator of which page the user has seen.\
    \ See the next step for instructions.\n\n+   In your editor, add the following\
    \ rule below your #mainnav ul li rule:\n\n```\n#mainnav ul li:hover {\n  background-color:\
    \ #29336B;\n  color: #F8F068;\n}\n```\n\nThe a:hover property is an example of\
    \ a pseudoclass, which are special properties of elements (links, in this case)\
    \ based on user interaction. The a:link property defines the default appearance\
    \ of a hyperlink before it is clicked by a user. The a:hover property defines\
    \ the appearance of a link when a user hovers the mouse cursor over it (this action\
    \ is sometimes known as a rollover). The a:visited property defines the appearance\
    \ of a link on the page after it has been visited. This helps the user identify\
    \ the links they already clicked. The last pseudo-class is :active, which defines\
    \ the appearance of a link when it is being clicked (when the user is pressing\
    \ down but not releasing the mouse).\n\nYou do not have to create styles for all\
    \ these properties, but you will often see them in groups of four. To see the\
    \ a:hover property in action, save your page and preview it in your browser.\n\
    \nWeb Design with HTML and CSS Digital Classroom"
