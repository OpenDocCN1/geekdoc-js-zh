  md: "# Self study\n\nTo practise styling lists, create new style rules for the definition\
    \ list. Here are some ideas to help you get started:\n\n+   1 Make the entire\
    \ definition list smaller than the other lists and create an italic style for\
    \ the definitions <lt;dd&gt;.\n\n+   2 Experiment with the other properties you\
    \ learned in this lesson, such as text-transform, letter-spacing, and so on.\n\
    \n+   3 Remember that definition lists you have an extra item to work with (the\
    \ &lt;dt&gt; element).\n\n# Review\n\n# Questions\n\n+   1 What is the em measurement\
    \ when referring to font-size? What are its advantages?\n\n+   2 Jennifer has\
    \ the paragraph rule in her CSS the following way:\n```css\np {\n  font-family:Baskerville;\n\
    }\n```nIs this the best way for her to define her paragraph style? Explain your\
    \ answer.\n\n+   3 What is the best way to increase or decrease space between\
    \ two text blocks (for example, the space between a heading and a paragraph)?\n\
    \n# Answers\n\n+   1 The em as it applies to font-size in CSS is a relative unit\
    \ of measurement. A unit of 1 em is equivalent to the default font-size of the\
    \ web browser (traditionally 16 pixels). Because em units are relative, they scale\
    \ well when resized in a browser. They also allow the designer to link elements\
    \ such as paragraphs and headings to a specific value in the body. This allows\
    \ for easy resizing of text.\n\n+   2 This is not the best way for Jennifer to\
    \ define her paragraph style. Because fonts defined in a style only appear on\
    \ the user's page if they have the fonts installed on their system, it is best\
    \ to use a font-stack. A font-stack lists two or more fonts in the preferred order\
    \ of display (based on their availability on the user's system). Furthermore,\
    \ this font-stack should include fonts that are generally accepted as most on\
    \ systems.\n\n+   3 The best way to increase or decrease space between two text\
    \ blocks is to use margins, padding, or some combination of the two. All CSS elements\
    \ are based on a box model, and the space outside the element is controlled by\
    \ an invisible margin on all four sides. The space inside the element is controlled\
    \ by invisible padding. In the case of a paragraph that is below a heading, you\
    \ would only need to set the top or bottom values, not the right or left values."
