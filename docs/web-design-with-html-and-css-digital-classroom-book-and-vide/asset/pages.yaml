    particularly the issue of older browsers that do not render correctly compared
    to the current browser. However web browsers are constantly evolving, as are the
    languages of HTML and CSS. This means that there are new issues to resolve. In
    the race to include increasingly sophisticated features and to address the growing
    importance of mobile devices, designers are able to use new CSS3 styles that add
    useful effects, such as rounded corners, transparent colors, and animation. However,
    some of these features are supported in modern browsers, but not in others. In
    the next two lessons you will learn more about this situation, but here is an
    overview.


