  md: '# How web pages work


    You''ll benefit from understanding the structure and function of systems that
    deliver the work you design across the Internet. This lesson focuses on understanding
    the structure and function of the Internet and the World Wide Web. Understanding
    these systems will help you deliver your web design projects more effectively.
    You will now take a quick look at how websites are hosted and how the pages you
    create end up on visitor''s computer screens and mobile devices around the world.


    # The Internet and World Wide Web domain names


    The Internet is based on the fundamental concept that all computers should be
    able to reach each other using an address. Like your home, apartment, or has a
    street where the post office or Fed Ex can reach you, or you have a phone number
    where someone can call you, all Internet connected computers have an address known
    as a TCP/IP address. The TCP/IP stands for Transmission Control Protocol/Internet
    Protocol, but that''s not critically important. What you need to know is that
    TCP/IP allows packets of digital information, such as your website, to be sent
    across networks and reassembled once it reaches its destination. TCP/IP addresses
    are commonly referred to as IP addresses.


    # Sending


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_43_0.png)


    # Receiving


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_43_1.png)


    Packets are re-assembled at the second computer. The protocol ''TCP'' makes sure
    of the information sent has been received


    A simplified diagram of how files are sent over the Internet.


    In the early 1990s, Sir Tim Berners-Lee took advantage of the Internet''s linked
    nature and created a method for his colleagues to remotely access data that he
    stored on his computer. A user anywhere in the world who had access to the Internet
    could connect to a server and'
