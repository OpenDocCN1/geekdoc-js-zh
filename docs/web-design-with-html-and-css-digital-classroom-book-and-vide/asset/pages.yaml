    # Understanding the CSS float property


    The float property in CSS allows text to wrap around an image. This style was
    borrowed from print design, where the effect is called text wrap or runaround.
    CSS achieves this effect by allowing elements following a floated element in the
    HTML markup to surround the element, effectively changing their position. This
    behavior also makes it possible to create columns on a page.


    In the left image, below is an inline graphic nested inside a paragraph. This
    is the default behavior of the graphic, as there is no float property. In the
    right image, nothing changes except the rule float:right has been applied to the
    graphic. The graphics as far as the right possible and wrap the texts left automatically.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_168_0.png)


