  md: '# Starting up


    # About Web Design with HTML and CSS Digital Classroom


    Creating effective websites requires an understanding of design principles, as
    well as the underlying technology that is used to deliver and display content
    to your audience.The Web Design with HTML and CSS Digital Classroom provides the
    information you need to design, develop, publish, and maintain websites. Whether
    you are just out in the field of web design, or experienced with design tools
    like Dreamweaver or Expression Web, you will find this book helpful explaining
    the underlying concepts for organizing, creating, and delivering web content using
    best practices.


    The Web Design with HTML and CSS Digital Classroom helps you to get up-and-running
    quickly. Although you can work through the lessons in this book in any sequence,
    we recommend that you start in the first lesson and progress through the book
    in the sequence in which they are presented. Each lesson includes detailed, step-by-step
    instructions, background information, video tutorials, and lesson files.


    The Web Design with HTML and CSS Digital Classroom is like having your own instructor
    guiding you through each lesson while you work at your own pace.This book includes
    12 self-paced lessons that you will discover essential skills, explore web design,
    and learn HTML, CSS and image editing techniques that will save you time and allow
    you to more easily create effective websites.You''ll become right away with real-world
    experiences and simple examples. Each lesson includes step-by-step instructions
    and lesson files available on the Digital Classroom website at www.digitalclassroombooks.com/webdesign.The
    Web Design with HTML Classroom lessons are developed by the same team of instructors
    and experts who have created many of the official training titles for companies
    as Adobe Systems and Microsoft. Now you can benefit from the expert instructors
    and clear, detailed instructions provided by the American Graphics Institute team.


    # Prerequisites


    Before you start the Web Design with HTML and CSS Digital Classroom lessons, you
    should have a working knowledge of your computer and its operating system.You
    should know how to use the directory system of your computer so that you can navigate
    through folders. You also need to understand how to locate, save, and open files,
    and you should also know how to use your mouse to access menus and commands. If
    you are just starting out with a computer, you should become familiar with its
    operation first, using resources such as the Windows 7 Digital Classroom or Mac
    OS Digital Classroom.


    We recommend that you use a text editor to when working with the HTML and CSS
    code. The specific editor is not important, but you should choose and install
    a text editor that you can easily open and work with the lesson files presented
    in this book. If you aren''t sure which to use, you can wait until you get to
    Lesson Three where we discuss working with code and using text editors. However,
    if you''re comfortable installing a text editor, we''ve listed some options below.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Some Mac OS text editors include BEdit and TextWrangler, both of which are
    available at http://www.barebones.com. You can use TextMate which is available
    for download at http://macromates.com. Another Mac OS text editor is Code which
    can be found at http://www.panic.com/coda/


    If you work on a Windows computer you may wish to use E Editor which is available
    at http://www.e-texteditor.com or Microsoft Visual Developer Express which can
    be found at http://www.microsoft.com/express/Web/


    If you already have a visual design tool like Adobe Dreamweaver or Microsoft Expression
    Web installed on your computer, you can use the coding tools instead of installing
    a dedicated text editor. Although both Adobe and Microsoft offer free trial versions
    of these software tools, if you don''t have either installed, we recommend skipping
    them for now and using any one of the text editors listed above while working
    with this book. By using a text editor, you can focus on the design and underlying
    code rather than learning the user interface and functions of a specific software
    package.


    # System requirements


    Before starting the lessons in the Web Design with HTML and CSS Classroom, make
    sure your computer is equipped for creating and managing websites. Because you
    will be using a variety of software tools, there is no formal minimum requirement
    for your computer, however we suggest that your computer meet or exceed the following
    guidelines:


    # Windows OS


    +   Intel® Pentium® 4, AMD Athlon® 64, or Multicore Intel® processor; Microsoft®
    Windows® with Service Pack 2; Windows® Home Premium, Business, Ultimate, or Enterprise
    with Service Pack 1; or Windows 7


    +   1GB RAM 1 GB of available hard-disk space for working with files


    +   1280×800 display with 16-bit video card


    +   Broadband Internet connection


    # Macintosh OS


    +   Multicore Intel® processor


    +   Mac OS X v10.4 or greater


