  md: '# A brief history of layout techniques on the web


    Remember that one of the main goals of CSS was to separate the style from the
    structure of HTML. In the table above, note that values for width and height,
    as well as the background color and a few other values, are embedded within the
    HTML. Although this practice was unavoidable before CSS, you can now set these
    values using CSS.


    The HTML table is slowly returning to its original function of presenting data,
    and not being used for layout. You might still find examples of these layouts
    on the web, but you will not learn to build them in this book. Instead, you will
    learn the basics of layout using CSS.


    # An overview of page layout options


    Before building a page layout, there are a few decisions you should make. The
    first is the width of the layout. There are two main categories of layout widths:
    fixed-width layouts and flexible layouts. Fixed-width layouts are more common:
    in a fixed-width layout, all page elements are nested within a container that
    has an explicit width (for example, you may use 960 pixels, where the unit of
    measurement is often in em as well). A fixed-width layout is useful for the designer
    because it has a really reliable position to place the various layout elements
    (such as headers, sidebars, and footers). It also provides a reliable structure
    for elements, as the width of a paragraph on a page or the placement of images.


    ![](img/89ff5fabf61426c3441d5d5c6a41600b_162_0.png)


    Fixed-width layouts have explicit widths and have a defined space on a web page.


