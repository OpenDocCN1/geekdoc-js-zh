    ![](img/89ff5fabf61426c3441d5d5c6a41600b_114_0.png)


    Use the color table to keep the most important colors in your image.


    You can delete, change, or lock the colors in this table to preserve the look
    of your image. In this section, you will learn to pick critical colors to make
    sure important colors are not deleted when you reduce the number of colors in
    the table.


