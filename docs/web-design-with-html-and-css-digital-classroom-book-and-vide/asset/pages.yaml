  md: "# Sizing text with CSS\n\nWhen using CSS to style text for the web, you have\
    \ a few options for the unit of measurement. The CSS property that controls the\
    \ size of your text is font-size.\n\nYou can control the font-size property in\
    \ a few different ways:\n\n+   - **Absolute-size**: A set of keywords that indicate\
    \ predefined font sizes scale according to the user's font setting preferences.\
    \ Possible values include xx-small, x-small, small, medium, large, x-large, and\
    \ xx-large.\n- **Length**: A number, followed by an absolute unit designator (cm,\
    \ mm, in, pt or pc) or a relative unit designator (em, ex, or px).\n- **Percentage**:\
    \ An integer, followed by a percent sign (%). The value is a percentage of the\
    \ font size of the parent object.\n- **Relative-size**: A set of keywords that\
    \ are interpreted relative to the font size of the parent object. Possible values\
    \ include larger and smaller.\n\nChoosing the measurement for the font-size in\
    \ a web page is an important decision and not as easy as it is in print design.\
    \ The main difficulty in selecting a size has to do with monitor resolution. Text\
    \ on smaller monitors looks different than text on larger monitors; however, with\
    \ a bit of foresight you can correct for this. In addition to the monitor resolution\
    \ issue, you must also consider how different browsers interpret how text is rendered.\
    \ For example, unlike print, the web allows users to resize their text manually.\
    \ Furthermore, there is a growing audience that browses the web with mobile devices,\
    \ making sizing your text even more important.\n\n# Pixels and points are not\
    \ the best choices\n\nSetting font points might come to you if you have worked\
    \ in print design or if you have created web graphics that would be comfortable\
    \ using pixels. The font-size property in CSS allows you to use both forms of\
    \ measurement. In the following example, the first CSS selector shows you a paragraph\
    \ rule for points, while the second one shows you a paragraph rule for pixels:\n\
    \n```\np {\n  font-size:12pt;\n}\nPoints\n```\n\n```\np {\n  font-size:12px;\n\
    }\nPixels\n```"
  merge: -1
  pgno: 135
- img_proc: true
  md: "Even points are supported, it is bad practice to use them and not advised for\
    \ web design. Points are a system of measurement designed for print, and although\
    \ available for use, they indicate an absolute unit of measurement and they do\
    \ not translate to the screen.\n\nPixels, on the other hand, are the unit of measurement\
    \ used for screen-based graphics. Monitor resolution sizes are measured in pixel\
    \ units. In an ideal world, designers could reliably use pixel sizes for their\
    \ fonts because they are relative units and designed to scale natively. Unfortunately\
    \ web browsers as Internet Explorer 6 and 7 do not resolve pixel-based text if\
    \ the user chooses to override the default settings.\n\nWeb browsers include a\
    \ text resize option. This option is found in the View menu. In some modern browsers,\
    \ the text-resize option is located in a submenu under Zoom. Many browsers also\
    \ use the keyboard shortcut Ctrl + (plus) and Ctrl - (minus) to increase and decrease\
    \ the text size, respectively. On the Mac OS, these shortcuts are Command + +\
    \ [plus] (and Command - [minus]).\n\n# Using a combination of percent and the\
    \ em measurement\n\nHere you will create reliable font sizing using a combination\
    \ of percent and ems. To get a sense of how these work, you will use CSS styling\
    \ to a page of text for the Smoothie World site.\n\n+   In your text editor, choose\
    \ File > Open and navigate to the web06lessons folder. Locate the 06_sizing.html\
    \ file and click OK. This file has four blocks of text: a heading <h1>,a heading\
    \ <h2>,and two paragraphs <p>.The font-family styles are included from the last\
    \ exercise as well.You will start by setting properties for the body to see their\
    \ effect.\n\n+   Before making any changes, you should know how the page looks\
    \ in its state. Preview the page in your default browser. Browsers need to set\
