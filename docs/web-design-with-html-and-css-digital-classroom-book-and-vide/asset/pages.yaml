  md: '# Web design and development tools in the browser


    Modern web browsers do more than display web pages; they also include tools for
    developing and troubleshooting web pages. Some browsers for testing and debugging
    sites include:


    # Internet Explorer developer tools


    Microsoft Internet Explorer includes built-in developer tools. You can access
    these tools by choosing Developer Tools or by using the keyboard shortcut F12.


    # Safari


    The Apple Safari browser includes built-in developer tools that are not enabled
    by default. To enable the developer tools choose Safari > Preferences. In the
    Preferences menu, select the Advanced menu and then check the box labeled *Developer
    menu* in menu bar.


    # The Firefox Debug extension


    The Firefox extension is an option for extending the Mozilla Firefox browser.
    You can download it at http://getfirefox.com.


    # Chrome


    The Google Chrome browser includes built-in developer tools. To access these tools,
    click the Page menu at the top-right corner of the browser, then choose Developer
    Tools. You can also right-click on any element and select Inspect Element.


    They include tools for inspecting your HTML and CSS as they exist inside the browser,
    instead of just viewing the original source code. This is particularly helpful
    with dynamic sites, complex sites, and sites that use frameworks such as ASP or
    PHP.


    # Inspecting HTML elements


    You can inspect HTML elements by clicking on them. The code for a selected element
    is highlighted in a content pane. Use this to quickly identify the exact information
    such as the width and height of an object on the page, such as an *image* or div
    element.


    # Inspecting CSS properties


    Quick access CSS styles that are associated with a selected element to see the
    exact CSS rules associated with your selection and examine the cascade of rules
    you understand whether a style is associated with an internal style or external
    stylesheet. This can make it easier to debug.


    (continues)'
