  md: "In your text editor, add a new rule for paragraphs inside the footer div:\n\
    \n```\n#footer {\n  margin:10px 0 0 20px;\n  width:280px;\n  font-family:Verdana,\
    \ Geneva, sans-serif;\n  font-size:0.689em;\n}\n```\n\nThis rule adds 10 pixels\
    \ to the top margin and 20 pixels to the left margin of each paragraph in your\
    \ footer. By defining the width for the paragraphs, you can force a break approximately\
    \ where you need it: inside the white space of the image. The font properties\
    \ define a different font family and a smaller font-size.\n\nSave the page and\
    \ preview it in your browser.\n\n![](img/89ff5fabf61426c3441d5d5c6a41600b_186_0.png)\n\
    \nYour footer paragraphs with new styles.\n\nIn the previous section, you learned\
    \ that applying padding and margins is a common technique. You could add more\
    \ space between the first paragraph and the top of the footer, increasing the\
    \ top margin of the #footer p rule allows the second paragraph. In this case,\
    \ add padding to the top of the footer as indicated in the next step.\n\nAdd the\
    \ following declaration (highlighted in red) to your #footer rule:\n\n```\n#footer\
    \ {\n  clear:both;\n  background-color:#BA2B22;\n  background-image:url(images/footer_background.jpg);\n\
    \  background-repeat:no-repeat;\n  width:960px;\n  height:128px;\n  padding-top:10px;\n\
    }\n```\n\nSave the file and preview it in your browser. Notice that the additional\
