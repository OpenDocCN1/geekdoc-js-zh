    \ Date()).getTime() + \"_\";\n  document.body.appendChild(form);\n\n  // Inject\
    \ it into the root element, check its status, remove it quickly\n  var root =\
    \ document.documentElement;\n  root.insertBefore(form, root.firstChild);\n\n \
    \ // The socalled was to do checks after getElementById\n// Which shows down for\
    \ other browsers (hence the branching)\n  if (document.getElementById(id)) {\n\
    \    var exp = Exp.find(id);\n    if (type context.getElementsByById !== \"undefined\"\
    \ && isXML) {\n      var m = context.getElementsByById(match)[0];\n      return\
