  md: '# Self study


    1 HTML5 is an evolving standard; however, you can read about the latest news and
    developments by visiting html5doctor.com.


    2 Visit html5boilerplate.com and download the commented version of the template
    files. Modify these templates and reproduce your SmoothieWorld site using your
    existing assets. The WebKit browser engine uses Apple Safari and Google Chrome
    has the most support for advanced HTML5 and CSS3 features at the time of this
    writing. Download both of these browsers, perform a search for HTML5 gallery or
    HTML5 canvas online, and explore the sites and experiments that designers and
    developers created that advantage of the new features.


    # Review


    Questions


    +   1 What is the difference between the HTML5 core and the HTML5 family?


    +   2 What is the intent of the new HTML5 <video> and <audio> tags and what are
    the obstacles involved with them using today?


    +   3 Name three advancements that are or will be possible in CSS3.


    Answers


    +   1 The HTML5 core represents the changes to HTML syntax, most notably the addition
    of new tags, such as &lt;header&gt;&lt;nav&gt;&lt;video&gt;&lt;audio&gt;, and
    many more. The HTML5 family represents the new syntax and supporting technologies,
    such as CSS3, Geolocation, and Canvas, among others.


    +   2 The new &lt;video&gt; and &lt;audio&gt; tags are designed to allow browsers
    to support them through embedded media within a web page without the need for
    a browser plugin-in such as Flash. The issues involved with these tags include
    the fact that older browsers will not recognize the tags; therefore you must provide
    a fallback. Additionally, among browsers that support the tags, the video and
    audio formats are not standardized, so designers must still fallbacks if they
    want to ensure all users can view or listen to their content.


    +   3 CSS3 is currently in various stages of support, but it will allow the following
    capabilities: CSS Animations,Transitions and Transforms, as well as rounded corner,
    gradient, dropshadow and other styles.'
