  md: "# A review of using margins and padding for layout\n\nIn this lesson, you have\
    \ learned two methods for adding space between the elements in a page. The first\
    \ method is to add padding to a div element. The advantage with this method is\
    \ that all the elements inside the div are affected simultaneously, making it\
    \ quick and efficient. A disadvantage to using padding for a container is that\
    \ increasing padding changes the width; to compensate, you must take into account\
    \ the extra width.\n\nThe second method is to add margins to the elements inside\
    \ the divs. The disadvantage of this method is that it requires more code and\
    \ attention to detail you will notice how individual elements are positioned.\
    \ The advantage is that column behavior is more predictable, since there is only\
    \ one width property to consider.\n\nThere is another, less obvious advantage\
    \ to the second method that has not been discussed. For reasons that will be covered\
    \ in more depth in Lesson 9, this method is more reliable for achieving similar\
    \ layouts across browsers and it solves a bug found in Internet Explorer 6.\n\n\
    Finally, you should note that a combination of methods (using margins and padding)\
    \ might be necessary for some situations. Consequently, you should understand\
    \ the cause and effect of each method you use.\n\n# Styling your footer with a\
    \ background image\n\nSo far, the structure of your page has been defined by the\
    \ background colors of your div elements. In this section, you will learn how\
    \ to add images. To do this, you will add a CSS background image to your footer.\n\
    \n+   1Locate the #footer div and replace the placeholder content inside the div\
    \ with the following code (highlighted in red):\n```html\n<div id=\"footer\">\n\
    \  &lt;Copyright Smoothie 2011 /&gt;\n  &lt;Registration on or use of this site\
    \ constitutes acceptance of our &lt;a href=\"useragreement.html\"&gt;user agreement\
    \ /a&gt; and &lt;a href=\"privacy.html\"&gt;Privacy Policy .a/a&gt;\n</div>\n\
    ```\n\n+   2Save the page and preview it in your browser. Each paragraph is styled\
    \ based on the current rules for paragraphs.You will adjust the rules for the\
    \ footer, but you must know the size of the footer, which will be based on the\
    \ dimensions of the background images you will add."
  merge: -1
  pgno: 184
- img_proc: true
  md: "# A brief history of layout techniques on the web\n\nIn your internal style\
    \ sheet, locate the current rule for the footer. Add a new rule (highlighted in\
    \ red) to add a background image from your folders:\n\n```\n#footer {\n  clear:both;\n\
    \  background-color:#BA2B22;\n  background-image:url(images/footer_background.jpg);\n\
    \  background-repeat:no-repeat;\n}\n```\n\nSave the page and preview it in your\
    \ browser.\n\n![](img/89ff5fabf61426c3441d5d5c6a41600b_185_0.png)\n\nYour image\
    \ is now applied to the footer. This allows the footer above to be visible above\
    \ it. Notice the background-repeat property in the CSS background images by default,\
    \ setting a value of no-repeat ensures that this image will never repeat. This\
    \ code might seem redundant when your background image is the same as your footer;\
    \ however, if the footer expands, the code will ensure the image does not tile.\n\
    \nSet the footer dimensions to match the background image as indicated in the\
    \ next step:\n\n```\n#footer {\n  clear:both;\n  background-color:#BA2B22;\n \
    \ background-image:url(images/footer_background.jpg);\n  background-repeat:no-repeat;\n\
    \  width:960px;\n  height:128px;\n}\n```\n\nSave the file and preview it in your\
    \ browser. Your footer is sized correctly and you can adjust your paragraphs.\
    \ Use another contextual selector in the next step."
  merge: -1
  pgno: 185
