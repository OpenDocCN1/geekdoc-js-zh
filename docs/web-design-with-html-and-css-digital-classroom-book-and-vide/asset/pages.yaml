  md: "# Text editors for web design\n\nThere are several text editors with more advanced\
    \ capabilities. These type of editors provide several benefits that make it easier\
    \ to work with. We'll look at some of the benefits here.\n\n# Code coloring\n\n\
    Whether you are writing a new HTML or CSS page from scratch or opening a pre-existing\
    \ page, code coloring visually separates your HTML and CSS syntax from the content\
    \ on your page. Tags that include attributes and values are assigned different\
    \ colors. This code coloring makes it easier for you to locate specific code,\
    \ and helps you spot and correct errors. Forgetting to add a closing bracket or\
    \ a quotation mark, for example, causes content to be colored differently if tags\
    \ were applied correctly. After you become accustomed to using code, you can use\
    \ the colors to spot errors in HTML. Most modern text editors also allow you to\
    \ customize the color of your syntax.\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
    \ HTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/html1/DTD/html1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/html\">\n<head>\n  <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\" />\n  <title>Untitled Document</title>\n\
    </head>\n<body>\n  <h1>Smoothies</h1>\n  <p>Smoothies are the stuff of life. they\
    \ get you going in the morning, refresh when you want! Smoothies we everyone want\
    \ to feel the power of Smoothies. We're called SmoothieWorld because Smoothies\
    \ change the world.</p>\n  <img src=\"images/blueberry_smoothie.jpg\" alt=\"Blue\
    \ Smoothie\" width=\"125\" height=\"200\">\n  <p>All content on this site is the\
    \ copyright of SmoothieWorld</p>\n</body>\n</html>\n```\n\nCode coloring visually\
    \ separates the tags from the content.\n\n# Line numbers, invisible characters,\
    \ and other visual aids\n\nMost text editors provide line numbers to orient yourself\
    \ within your code and also help when collaborating with other designers or developers.\
    \ These tools also make it easier to see invisible characters as line breaks or\
    \ carriage returns."
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Code completion


    Most editors can automate a number of certain tedious tasks, such as typing brackets
    or common tags. Although the methods and shortcuts for each program are different,
    full-featured text editors have this capability. Some text editors automatically
    trigger code completion as you begin to type, others require you to trigger the
    code completion and choose the code from a list of options. Code completion is
    useful, as it removes some of the burden of remember every detail of the syntax
    you use, whether HTML, CSS, or another language.


    ```

    <All content on this site is the copyright of Smoothie.com</p>

    <html

    <abbr

    acronym

    address

    applet

    area

    base

    basefont

    dbs

    bri

    blockquite

    ar

    button

    caption

    center>

    ```


    In TextMate (Mac OS), you can trigger code completion manually by pressing the
    Option + Esc keys. Similar capabilities exist in Windows text editors like Visual
    Studio from Microsoft.


    # Automation features


    Most editors have some capability for automating repetitive tasks. Whether they
    are called macros, snippets, or by some other name. These automation tools give
    you the ability to create reusable pieces of code and you can save a great deal
    of time.


    | Global | Site | |

    |---|---||

    | General | HTML 4.0.1 DOCTYPE

    | <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.0//EN"> |

    | HTML 1.0 DOCTYPE

    | <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 1.0//EN"> |

    | HTML 1.2 Transitional DOCTYPE

    | <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 1.2//EN"> |

    | HTML 1.0 Framework DOCTYPE

    | <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 1.0//EN"> |

    | HTML 1.1 DOCTYPE

    | <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 1.1//EN"> |

    | UTF-8 Encoding Meta

    | <meta http-equiv="UTF-8" content="text/html"> |

    | Basic Page Structure

    | <html> |


    In Code (Mac OS), the Clip provides a way to save and re-use code across projects.
    In this example, the basic HTML structure of a page is selected.'
  merge: -1
