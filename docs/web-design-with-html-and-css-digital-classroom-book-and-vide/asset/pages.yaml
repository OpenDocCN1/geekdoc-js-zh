  md: '# Considerations when using Flash


    Creating content is not covered in this book; however, you will learn to add Flash
    content to your page. Some details to keep in mind:


    +   - The Flash files you add have the extension .swf. Theing files that create
    the .swf are also called Flash files, but these authors have the extension .fla.

    - Flash requires a browser plugin called the Adobe Flash Player. If a user does
    not use this plugin, they cannot see your Flash content. The majority of web browsers
    have some version of the Flash plugin installed. You need to be sensitive to which
    version of your Flash content is targeted to. As of writing, the most recent version
    of the Flash Player is 10.1. If a user has version 9 of the Flash Player, any
    incompatible content designed for version 10 will not be displayed (You can find
    statistics on versions of Flash Player installed at www.adobe.com/products/player_census/flashplayer).

    - Flash has made progress over the years, but there some concerns about accessibility
    remain. Before choosing to deliver content in Flash, remember that search engines
    do not index the text in SWF files with the same reliability as standard HTML,
    so important information about your site might not appear on your web page. Also,
    Flash might not be supported or might have limited support on mobile devices;
    take this into consideration when deciding to use Flash on your site.


    # Generating code to add Flash movies to a page


    In this exercise, you will generate the code necessary to add Flash to a web page.
    Adding Flash to a web page is similar to adding an image. However, the supporting
    code for Flash files is more complex because: 1) over the years, different browsers
    have managed Flash in different ways and you need to account for these scenarios;
    2) a user who does not use the Flash plugin-in could visit your site, in case
    you need to provide alternative content; 3) a user who has an older version of
    the Flash plugin might visit your site, in which case you need to provide an upgrade.
    The only way to do this is by using code.


    For this exercise, you will use a JavaScript-based solution that allows you to
    embed Flash files while resolving these issues.


    1 In your text editor, choose File > Open and navigate to the swobject folder
    located in your web10lessons folder. Open the file SWObject_generator.html. This
    file is a stand-alone web that will generate the necessary object code for you.
    This generator is based on a project called SWObject, which is an open source
    project that provides designers and developers with a reliable way to add Flash
    files to their pages.


    > SWObject is an open source project free for anyone to use with minimal restrictions.
    As of this, the latest version of SWObject is version 2.2.You can learn more about
    the SWObject project and access more in-depth documentation by visiting http://code.google.com/p/swobject.'
