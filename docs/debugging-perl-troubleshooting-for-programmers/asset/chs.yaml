- "# 调试Perl：程序员的故障排除指南\n\n献给奥斯卡，在我需要安慰时给予我慰藉，在我需要分心时，又为兽医提供了有用的干扰。\n\n# 致谢\n\n再次，首要感谢\
  \ Wendy Rinaldi，她用“Bug Candy”和我专属的定制 bug 诱惑我，让我得以撰写一个我太过熟悉的主题。接下来，我要感谢 Ann Sellers，她对我非常耐心，同时让我保持警觉。同样感谢\
  \ Monika Faltiss，以及后来的 Timothy Madrid，他们确保所有文件井然有序；感谢 Pamela Woolf 以及编辑和制作团队的其他成员，他们完成了本书的编辑和制作，并设法处理了我犯下的所有错误。\n\
  \n\n\n\n安-玛丽·马伦（Ann-Marie Mallon）通读了整部手稿，并指出了我犯的技术错误，对此我深表感谢。特别感谢乔恩·皮尔斯（Jon Piers）以及\
  \ Cix 团队的其他成员，在我撰写本书期间，他们提供了灵感和技术帮助。\n\n我的经纪人尼尔·萨尔金德（Neil Salkind）凭借其谈判技巧值得被提及。他还因不断为我找到新任务而值得被称赞。与此同时，我还要感谢\
  \ StudioB 团队的其他成员：克里斯汀（Kristen）、塔拉（Tara）、斯泰西（Stacey）和雪莉（Sherry）。\n\n最后，衷心感谢 Perl\
  \ 的开发者们——这门语言既易于使用，又容易出错，同时也易于调试。没有这三个特点，这本书就不可能问世，写作过程也不会如此有趣！\n\n如果我有遗漏致谢的人，我在此提前毫无保留地道歉。我已尽力核实所有来源并联系所有相关方，但完全有可能出现疏漏。\n\
  \n### 引言\n\n你可能会感到惊讶，这本书完全围绕调试 Perl 脚本和应用程序展开。就像封面上的那只虫子一样，Perl 的 bug 可能令人烦恼且难以根除，在某些情况下，就像我们的小家伙一样，它们还会蜇你。本书将全面介绍如何通过更好的编程来避免\
  \ bug，如何捕获 bug，以及当其他方法都失败时如何调试程序。\n\n## 关于本书\n\n你在上一个应用程序上花了多少时间进行调试？占总开发时间的 10%？20%？40%？你可能会惊讶地发现，一般的经验法则是你应该花\
  \ 80%的时间进行测试和调试。显而易见的解决方案是首先不要引入 bug，但这里存在一个问题。\n\n你会经常听到我这么说：Perl 是一种非常灵活且自由的语言，它本身就容易滋生\
  \ bug。Perl 的强大之处在于，你只需几行代码就能编写出相当复杂的应用程序。即使是文本处理和数据库管理等复杂项目，在 Perl 中也能相对轻松地处理。然而，这种强大是有代价的。一个简单的输入错误就可能在\
  \ Perl 中引发一大堆难以追踪的问题。如果这变成了逻辑错误，问题就更大了。\n\n无论是简单的排版错误，还是代码逻辑中更严重的问题，它们本质上都是 bug，都需要解决。\n\
  \n本书涵盖的正是这个调试过程。事实上，我们还会更进一步。我坚信良好的软件设计，这意味着要更好地理解你用于脚本的文本是如何被语言翻译成可运行程序的。作为这个过程的一部分，了解在解析阶段可能出错的地方也很有价值。\n\
  \n当然，程序中有些问题可以在程序本身内部进行追踪和捕获——例如，当你打开一个文件时，应该测试返回值以确保操作成功。知道何时何地使用这些方法，是程序设计中调试过程的重要组成部分。你还可以使用警告和编译指示让\
  \ Perl 为你完成工作。如果程序完成后仍然存在 bug，你需要知道如何使用调试器来查找问题。\n\n一种常被遗忘的 bug 类型可以通过使用不同的优化技术来解决。有些问题你可以手动发现并解决，但其他问题则需要使用特殊工具来识别有问题的函数和程序区域。我们甚至可以利用\
  \ Perl 编译器做更多事情，而不仅仅是编译 Perl 程序。通过一些努力和创造性思维，我们可以使用编译器获取关于脚本的深入信息，并为我们提供隔离问题的有用起点。\n\
  \nXX 调试 Perl：程序员故障排除指南\n\n本书涵盖了所有这些领域以及更多内容，详细介绍了如何以最佳方式编写更少错误的 Perl 脚本，以及在脚本完成后如何解决和识别\
  \ bug。\n\n## 本书面向谁？\n\n本书并非针对特定 Perl 用户群体。如果你使用 Perl，就应该能够使用本书。它显然依赖于一些 Perl 编程知识，但即使是初学者也能从更好的程序设计和错误捕获技巧中受益。事实上，我推荐初学者阅读本书；它应该能帮助你编写出更少\
  \ bug 的应用程序！\n\n对于更高级的用户，或者那些希望在 Perl 编程中取得优势的人，关于优化 Perl 和测试代码的章节是必读内容。优化远不止减少子程序调用次数那么简单，而且你会惊讶于有多少外部因素会在你不注意时导致脚本出现问题。\n\
  \n## 如何使用本书\n\n《调试 Perl：程序员故障排除指南》不是一本参考手册，而是一本关于更好 Perl 编程以及可用于调试 Perl 的工具和功能的指南。这意味着对于大多数\
  \ Perl 程序员来说，最好的方法是阅读前三部分，其余部分作为参考。这些内容将为你打下良好的基础，让你了解如何编写更少 bug 的 Perl 程序，以及如何使用内置的捕获功能在潜在问题变成现实之前将其隔离。\n\
  \n最后两部分只应在你熟悉并掌握了 Perl 以及本书前面介绍的主题之后使用。特别是第四部分，它高度专注于脚本优化，对大多数程序员来说并非优先事项。\n\n附录\
  \ A 是主要的参考部分。它包含一个错误消息列表，附有会引发该错误的示例代码，以及适当情况下的解决方案。它还提供了与本书其他相关部分的交叉引用。\n\n## 章节划分\n\
  \n本书分为六个部分。第一部分是引言，探讨本书旨在解决的 bug 和问题的类型。第二部分是关于使用 Perl 时更好编程实践的指南。第三部分涵盖调试艺术，从简单的错误捕获到\
  \ Perl 提供的用于调试脚本的工具和功能。第四部分聚焦于 Perl 代码的优化。第五部分探讨测试和破坏代码，以确保程序在完成后没有 bug。第六部分包含附录\
  \ A。\n\n各章节具体内容如下：\n\n## 第一章——引言\n\n探讨 bug 的类型、bug 引入的机制，以及通过使用好的编辑器和版本管理系统（如 RCS\
  \ 和 CVS）来简化开发过程的一些方法。\n\n引言 xxi\n\n## 第二章——基本 Perl 解析规则与陷阱\n\n详细介绍了 Perl 如何将原始文本解析为构成\
  \ Perl 程序的语言语句。\n\n## 第三章——常见变量陷阱\n\n指南，介绍与使用变量相关的一些常见问题，这些问题经常出现在许多 Perl 程序中。\n\
  \n## 第四章——语句与函数陷阱\n\n延续上一章，转而探讨与使用函数和语句相关的问题。这包括一些可能潜入应用程序的特定函数 bug。\n\n## 第五章——程序设计\n\
  \n从抽象的基础知识到函数、模块、对象和类的更好设计，介绍更好的程序设计指南。\n\n## 第六章——语言/平台迁移指南\n\n探讨将 Perl 脚本从一个平台迁移到另一个平台时常见的问题，以及从其他语言迁移到\
  \ Perl 的程序员常犯的错误。\n\n## 第七章——基本错误捕获\n\n从根本上介绍如何在脚本中捕获和报告错误。\n\n\n\n\n## 第 8 章 —\
  \ 使用编译指示和警告\n介绍如何使用 Perl 内置系统来报告潜在问题。\n\n## 第 9 章 — 手动调试技术\n指导你使用一些比完整调试器更简单的替代方法，来追踪和报告信息，从而识别并定位特定错误。\n\
  \n## 第 10 章 — Perl 调试器\n介绍标准调试器和 ActivePerl 调试器，以及可选的嵌入 Perl 解释器中的调试系统。\n\n## 第\
  \ 11 章 — 手动优化\n探讨如何通过审视你编写的代码来提升性能或减少内存占用。\n\n## 第 12 章 — 自动优化\n详细介绍 Perl 性能分析器和编译器，以及如何利用它们提供的信息来识别可优化的代码区域。\n\
  \n## 第 13 章 — 测试方法\n指导你编写测试例程和脚本，以检查代码边界，并涵盖 Perl 开发工具包中提供的调试工具。\n\n## 第 14 章 —\
  \ 破坏你的代码\n深入探讨外部因素及其操控方法，以便你在极端条件下测试代码。这有助于你考虑修改代码，以应对开发过程中可能未曾考虑的情况。\n\n## 附录 A\
  \ — 错误消息快速参考\n完整指南，涵盖 Perl 产生的所有错误消息。\n\nxxii 调试 Perl：程序员故障排除指南\n\n## 本书使用的约定\n\n\
  所有 Perl 关键字以**粗体**突出显示，但函数列出时不带括号。这是因为 Perl 版本可能基于的 C 函数会以 `this()` 形式展示。\n\n示例和代码使用等宽字体显示。函数描述也使用相同的等宽字体格式化。\n\
  \n注意 |\n注意内容以这种格式呈现，包含关于特定主题的额外信息。\n\n这表示可能让你陷入困境的语句或过程。\n\n错误警示\n\n24x7\n\n24x7\
