  \ pragma 或修改`PERL5LIB`和`PERL50PT`环境变量。\n\n无法通过包\"%s\"找到对象方法\"%s\" 致命错误\n\n你调用了一个方法，该方法指明了定义所需类的包，但包本身不包含合适的方法定义。继承树可能在某个地方被破坏了。请检查你导入的包中的`@ISA`数组。\n\
  \n360 调试 Perl：程序员故障排除指南\n\n无法找到包%s 用于@%s::ISA 语法警告\n\n`@ISA`数组包含了一个无法找到的包名。如果你认为该名称有效，请检查`@INC`数组，或者检查`@ISA`数组中定义的值。\n\
