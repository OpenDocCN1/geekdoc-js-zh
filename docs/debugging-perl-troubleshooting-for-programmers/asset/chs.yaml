  \ `<=>` 或 `cmp` 对两个值进行了比较。\n\n### 排序子例程未返回单个值 致命错误\n\n当使用隐式或外部子例程进行 `sort` 时，子例程应只返回一个值——即应被提升到列表前面的那个值。请检查子例程，确保你进行了正确的比较并只返回一个可能的值。同时记住，排序例程应返回它所接收的两个值之间的比较结果；在排序过程中可能尝试构建的错误和/或附加信息应通过全局变量或使用单独的循环来处理。\n\
  \n### Split 循环 内部错误\n\n对 `split` 的调用迭代次数超过了原始源中的字符数。这可能表明你的正则表达式或也在其他地方更新的数据结构存在问题。\n\
