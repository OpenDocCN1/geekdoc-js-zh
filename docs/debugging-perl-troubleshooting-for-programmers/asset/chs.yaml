  \n在已关闭的套接字 `%s` 上调用 `send()` 警告（已关闭）\n\n你尝试向一个实际上已关闭的套接字发送数据，可能是因为它没有正确打开，或者套接字在此语句之前已经打开并关闭了。请在打开时或在此调用之前检查套接字的状态。\n\
