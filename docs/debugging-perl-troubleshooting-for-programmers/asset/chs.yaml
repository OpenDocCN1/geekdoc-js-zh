  \n附录 A：错误消息交叉引用 363\n\n无法在表达式中使用\\%c 表示$%c 语法警告\n\n从正则表达式中提取数据时，你只能在替换中使用`\\x`格式提取组元素。在替换之外，你应该使用`$x`格式。事实上，你应该在任何地方都使用这种格式，因为`\\\
