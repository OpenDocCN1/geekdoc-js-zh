  \ `or` 代替 `||` 来处理错误。\n\n脚本头过早结束 外部错误\n\n由 CGI 脚本生成，很可能是因为你的脚本产生了错误或警告，从而让服务器无法确定应返回给浏览器的信息。尝试从命令行运行你的脚本，以确定是否有错误被报告，如果有，请修复它们。如果脚本在命令行运行正常，尝试在脚本顶部添加\n\
  \n```\nBEGIN { print \"Content - type: text/html\"; }\n```\n\n以获取更多关于问题的信息。有关追踪\
  \ CGI 错误的更多示例，请参见第 7 章。\n\n在已关闭的文件句柄 `%s` 上调用 `print()` 警告（已关闭）\n\n你正在打印的文件句柄在之前某个时刻已被关闭。请检查文件是否正确打开。\n\
  \n在已关闭的文件句柄 `%s` 上调用 `printf()` 警告（已关闭）\n\n你正在写入的文件句柄在之前某个时刻已被关闭。请检查文件是否正确打开。\n\n\
  原型不匹配：`%s` 与 `%s` 严重警告（不安全）\n\n你可能先声明了一个带有给定原型的子程序，然后在实际定义子程序时使用了不同的原型。请检查前向声明和实际声明，确保它们匹配。\n\
