  \n数据： 字节 <~ 字\n\nJ\n\n图 9.1 一个 Perl 来源的事件错误\n\n## 第 10 章：Perl 调试器\n\n![picture16](img/picture16.jpg)\n\
  \n208 调试 Perl：程序员故障排除\n\n在上一章的开头，我们探讨了调试应用程序的不同可能方法。当然，真正的调试器的工作原理与上一章给出的方法不同，并且在某种程度上也与\
  \ Perl 调试器的工作原理不同。\n\n首先，大多数现代语言调试器以两种基本方式工作：事后调试或应用程序的实时调试。事后调试器研究在执行过程中生成的核心转储或其他可执行映像。利用该文件中的信息结合原始应用程序，可以确定应用程序本身的问题。\n\
  \n通常，事后调试仅在应用程序崩溃时有用，尽管有些系统会监控执行并事后处理细节。还有一些工具，如 Solaris 下的`truss`，可以监控系统调用。事后技术也可用于其他应用程序改进——例如，参见第\
  \ 12 章中的 Perl 分析器。\n\n实时调试利用一个单独的应用程序来监控应用程序的执行过程。与事后调试不同，通过实时调试，我们可以实时监控应用程序的执行，监控单行代码，甚至根据程序当前作用域内可用的函数和变量来监控和评估表达式。\n\
  \nPerl 不太适合事后调试。除了分析器和其他类似工具以及上一章中展示的技术之外，事件发生后我们对 Perl 脚本能做的并不多。首先，事后调试在崩溃后拥有核心文件时更有意义，而这在\
  \ Perl 中通常不会发生，除非解释器本身出现问题。\n\n然而，Perl 确实提供了一种机制来调试正在运行的脚本。实际上，调试器本身只是另一个 Perl 脚本，允许你交互式地监控自己脚本的执行。最有用的是，因为它是一个\
  \ Perl 脚本，并且 Perl 是一种解释型而非编译型语言，我们可以在调试过程中执行任何我们喜欢的 Perl 语句。\n\n在本章中，我们将介绍 Perl\
  \ 可用的两个主要调试器——内置调试器和 ActiveState 调试器（作为 Perl 开发工具包的一部分提供）。在介绍这两个调试器之前，我们先来看一下使用任何调试器的原则。\n\
  \n### 使用调试器\n\n\n\n\n\n使用调试器时，你可以利用三种基本工具：监视、单步执行和断点。我们将逐一介绍这些工具，并描述如何最好地利用它们来帮助你调试脚本。\n\
  \n### 监视\n\n监视是指你在执行脚本时想要监控的变量。你可以对某个变量设置监视，然后对于执行的每条语句，都会显示该变量对应的值。通过使用监视，你可以观察变量如何被更新，并隔离那些变量在你未察觉的情况下被修改的实例。\n\
  \n# 第 10 章：Perl 调试器 209\n\n### 单步执行\n\n单步执行是逐条或成组执行 Perl 语句的操作（例如，一次性执行整个函数调用）。通过单步执行，你可以逐行监控语句的执行以及受其影响和使用的变量。有三种基本的单步执行命令，尽管某些调试器可能会提供额外的选项：\n\
  \n* `Step Into` 执行当前语句，并跟踪该语句中任何函数或方法的执行。执行过程会调用函数或方法，跳过任何变量初始化，并在被调用函数内的第一条可执行语句处停止。\n\
  * `Step Over` 执行当前语句。任何被调用的函数或方法都会被执行，但调试器不会介入处理，因此执行会在当前文件中的下一条可执行语句处停止。\n* `Step\
  \ Out` 继续执行直到当前函数或方法结束。执行会在下一条可执行语句处停止，该语句可能是调用脚本中当前行的下一个函数调用，也可能是调用者的下一条语句。\n\n\
  单步执行相对于断点的优势在于，它允许你逐行监控每条语句。当你想要详细研究某个序列或循环的每次迭代时，这一功能尤其有用。\n\n### 断点\n\n断点提供了另一种方法。你无需费力地逐行执行脚本，而是可以在脚本中的未来某个位置设置一个断点，然后开始执行。调试器将执行直到该断点之前的所有行。此外，你还可以设置一个断点，使其仅在某个变量满足特定条件时触发。\n\
  \n例如，假设你在循环中遇到了问题，但只有当循环计数器达到 1000 时才出现；你可以设置一个断点，当计数器值大于或等于 1000 时触发。循环将解析并执行 1000\
  \ 次，然后调试器会暂停，以便你逐行处理，直到追踪到问题。\n\n## Perl 调试器\n\n“Perl 调试器”这个说法有点名不副实。实际上，调试器只是一组模块和一个脚本，它几乎同时位于你试图运行的脚本和将要执行它的\
  \ Perl 解释器之间。通过处于这个位置，调试器脚本可以提取源文件的每一行，并逐步执行每一行——这就是单步执行过程。\n\n此外，调试器允许我们设置监视和断点，并提供了一种直接执行\
  \ Perl 语句的方式，这些语句可以与底层脚本交互。例如，当到达一个断点时，你可能希望对脚本生成的某个值进行简单的计算。\n\n调试 Perl：程序员故障排除指南\n\
  \nPerl 与许多其他语言的主要区别在于，我们可以直接运行调试器——实际上可以直接从命令行启动。没有单独的应用程序来执行调试，也无需对代码进行任何修改。\n\n\
  ### 用户界面\n\n要启动调试器，你需要在命令行中向 Perl 解释器指定 `-d` 选项：\n\n```\nperl -d t.pl\n```\n\n或者，也可以使用一个虚拟的\
  \ `-e` 语句，直接进入一个虚拟的调试器环境：\n\n```\nperl -de 1\n```\n\n一旦调试器被调用，你会被置于所定义脚本中的第一条可执行语句处：\n\
  \n```\nLoading DB routines from perl5db.pl version 1.0401\nEmacs support available.\n\
  \nEnter h or \"h h' for help.\n\nmain::(-e:1): 1 DB<1>\n```\n\n尖括号中的值——本例中为 1——是调试器命令的编号。可以通过\
  \ `!` 调试器命令重新调用该编号。尖括号的数量表示调试器的当前深度。通过 `s`、`n` 或 `t` 命令调用新的子例程时，会引入一组新的括号，因为脚本中创建了新的执行路径。你可以使用\
  \ `\\` 字符指定多行命令，该字符的作用是转义通常会结束命令的换行符。\n\n令人困惑的是，提示符前显示的行是即将被执行的行，而不是已经执行的行。因此，在首次进入调试器时，实际上还没有执行任何行（除了编译器指令和包导入）。\n\
  \n通常的操作是，在你想要监控的行或语句上设置一个断点，然后使用 `T` 命令生成堆栈跟踪。例如，\n\n```\nDB<4> b 16\nDB<5> r\n\
  Top of the world, Ma!\n\nmain::callerlog(t.pi:16): print join(' ',@data),\":$reference\\\
  n\";\nDB<6> T\n. = main::callerlog('Printed Message') called from file 't.pl' line\
  \ 23\n. = main::top() called from file 't.pl' line 5\n. = main::bar() called from\
  \ file 't.pl' line 8\n```\n\n第 10 章：Perl 调试器 211\n\n脚本中每一行的实际执行过程如下：\n\n1. 检查断点。\n\
  2. 如果设置了 `AutoTrace` 选项，则使用跟踪打印该行。\n3. 执行任何已定义的动作。\n4. 如果有断点或单步执行，则提示用户。\n5. 评估该行。\n\
  6. 打印任何已修改的监视点。\n\n一旦执行暂停，你可以逐行单步执行脚本，使用 `s` 命令逐行执行，或使用 `n` 命令逐行执行并跳过子例程调用。\n\n\
  请注意，编译时语句不会被调试器捕获，这意味着那些包含在 `BEGIN` 块中的语句，或者像 `use` 这样的语句，不会被调试器中断。捕获它们的最佳方法是指定\
  \ `$DB::single` 变量的值，该变量是 Perl 调试器的一部分。虽然这需要修改代码，但如果调试器未运行，则不会影响任何内容。`$DB::single`\
  \ 变量的值为 1 相当于刚刚向调试器输入了 `s`。值为 2 表示应使用 `n`。或者，你也可以使用 `AutoTrace` 选项来监控命令的状态。\n\n\
  你可以设置监视点，如果变量在刚刚执行的语句中被修改，则会显示该变量的值。例如，在脚本中\n\n```\nwhile (<DATA>) {\nchomp;\n```\n\
  \n你可以为 `$_` 设置一个监视点，这样每次循环迭代时都会打印 `$_` 的值。\n\n### 调试器命令\n\n调试器支持多种命令，如下所述。一般来说，任何不能立即被识别为命令的输入行，或者以空格开头的输入行，都会被解释为通过\
  \ `eval` 函数执行的 Perl 语句。\n\n|jp | 任何调试器命令都可以通过管道符号传递给外部程序，就像在 Unix shell 提示符下一样。此功能主要用于通过分页器解析输出，但也可用于其他任何用途。\n\
  \n`h COMMAND h`\n\n调试 Perl：程序员故障排除指南\n\n打印 `COMMAND` 的帮助信息，如果未指定 `COMMAND`，则打印通用帮助。如果你使用特殊的\
  \ `h h` 命令，则会打印通用帮助的压缩版本——它应该能适应标准屏幕而无需滚动。有关如何更改默认分页程序的详细信息，请参见后面的 `O` 命令。\n\n`P`\n\
  \n`p expr`\n\n\n\n\n\n## 第 10 章：Perl 调试器\n\n使用标准的内置函数 `print` 打印 `expr` 的求值结果。`expr`\
  \ 的值可以包含当前正在调试的脚本中定义的变量和函数。\n\n`print` 函数的常规规则同样适用——嵌套结构和对象将无法正确打印。（关于更实用的版本，请参见\
  \ `x` 命令。）\n\n### `X`\n\n`x expr`\n\n在列表上下文中对其表达式求值，并以美观打印的方式输出结果。与 `print` 函数不同，嵌套数据结构会递归打印。参见表\
  \ 10-1 中的选项。\n\n### `V`\n\n`V PACKAGE VARS`  \n`V PACKAGE V`\n\n如果同时指定了 `PACKAGE`\
  \ 和 `VARS`，则显示包 `PACKAGE` 中由 `VARS` 指定的变量列表。如果省略 `VARS`，则打印 `PACKAGE` 的所有变量。如果未指定任何参数，则打印\
  \ `main` 包的所有变量。信息会智能打印，数组、哈希和嵌套结构的值会在输出前进行格式化。控制字符也会转换为可打印格式。\n\n如果指定了变量，则应省略变量类型字符（`$`、`@`\
  \ 或 `%`）。还可以使用 `-PATTERN` 和 `!PATTERN` 参数指定要匹配的模式，或要排除的模式。\n\n### `X`\n\n`X VARS\
  \ X`\n\n与当前包的 `V VARS` 相同。\n\n### `T`\n\n`T`\n\n打印堆栈回溯，由 `caller` 函数和当前堆栈帧数组的值决定。有关示例，请参见本章后面的“调试器接口”一节。\n\
  \n### `S`\n\n`S EXPR`  \n`s`\n\n仅执行下一条语句（单步执行），必要时会进入子例程调用。如果提供了 `EXPR`，则执行 `EXPR`\
  \ 一次，必要时会进入子例程调用。此过程可用于直接跳入正常执行流程之外的子例程。\n\n### `n`\n\n`n EXPR n`\n\n单步执行下一条语句，但跳过子例程（不进入）。如果指定了\
  \ `EXPR`，则会进入任何子例程。\n\n### 回车键\n\n重复上一个 `n` 或 `s` 命令。\n\n### `C`\n\n`C LINE c SUB`\
  \  \n`c`\n\n继续执行（所有语句），直到下一个配置的断点或脚本结束。如果指定了 `LINE` 或 `SUB`，则在 `LINE` 或子例程 `SUB`\
  \ 之前插入一个仅生效一次的断点。\n\n### `I`\n\n`1`  \n`1 MIN+INCR`  \n`1 MIN-MAX`  \n`1 LINE` \
  \ \n`1 SUB`\n\n列出当前脚本从当前行开始的下一页行。`1 MIN+INCR` 列出从 `MIN` 指定的行开始的 `INCR+1` 行。`1 MIN-MAX`\
  \ 列出上一页行。`1 LINE` 列出 `LINE` 行。`1 SUB` 列出子例程 `SUB` 的第一页行。\n\n### `W`\n\n`w LINE w`\n\
  \n列出当前行周围的一页行，如果指定了 `LINE`，则列出该行周围的行。将行指针返回到最后执行的行并打印出来。\n\n### `f`\n\n`f FILENAME`\n\
  \n将当前查看的文件更改为 `FILENAME`。`FILENAME` 的值应与主脚本或 `%INC` 变量中可识别的文件名匹配。如果仍未找到，则将其解释为正则表达式，该表达式应解析为文件名。\n\
  \n### `/PATTERN/`\n\n在当前文件中向前搜索正则表达式 `PATTERN`。\n\n### `?PATTERN?`\n\n在当前文件中向后搜索正则表达式\
  \ `PATTERN`。\n\n### `L`\n\n列出所有当前设置的断点和操作。\n\n### `s`\n\n`S PATTERN S !PATTERN S`\n\
  \n列出所有匹配正则表达式 `PATTERN` 的子例程。如果 `PATTERN` 前面有感叹号，则列出不匹配正则表达式 `PATTERN` 的子例程。\n\n\
  ### `t`\n\n`t EXPR t`\n\n切换跟踪模式。跟踪模式启用后，每条语句执行时都会打印。如果指定了 `EXPR`，则跟踪 `EXPR` 的执行。另请参见表\
  \ 10-1 中的 `AutoTrace` 选项。例如，脚本\n\n```\nsub one { 1 }; sub two { 2 }; print one()*two();\n\
  ```\n\n仅输出 `Two` 的最终值。启用跟踪模式后，还会输出语句\n\n```\nDB<1> r\nmain::one(t2.pi:1): sub one\
  \ { 1 };\nmain::two(t2.pi:2): sub two { 2 };\n2\n```\n\n### `b`\n\n`b LINE CONDITION`\
  \  \n`b LINE`  \n`b CONDITION`  \n`b`\n\n未指定参数时，在当前行设置断点。如果指定了 `LINE`，则在指定行设置断点。如果指定了\
  \ `CONDITION`，则每次到达断点时，仅当条件为真时才中断执行。`CONDITION` 不使用 `if` 语句，它纯粹是测试条件。如果使用 `/PATTERN/`，则仅当语句匹配正则表达式\
  \ `PATTERN` 时才中断。\n\n`b SUB CONDITION b SUB`\n\n在子例程 `SUB` 上设置断点，如果指定了 `CONDITION`\
  \ 则使用该条件。\n\n`b postpone SUB CONDITION b postpone SUB`\n\n仅在子例程 `SUB` 编译完成后才在其上设置断点。\n\
  \n`b compile SUB`\n\n在子例程 `SUB` 编译后的第一个可执行语句上设置断点。\n\n`b load FILENAME`\n\n在 `FILENAME`\
  \ 的第一条执行行设置断点。\n\n### `d`\n\n`d LINE d`\n\n删除指定 `LINE` 上的断点，如果省略 `LINE`，则删除即将执行的行上的断点。\n\
  \n### `D`\n\n删除所有当前设置的断点。\n\n### `a`\n\n`a LINE COMMAND a COMMAND`\n\n设置由 `COMMAND`\
  \ 指定的操作，该操作将在当前行或由 `LINE` 指定的行执行之前执行。例如，可用于在变量用于计算之前打印其值。\n\n### `A`\n\n删除所有当前安装的操作。\n\
  \n### `W`\n\n`W EXPR W`\n\n对 `EXPR` 指定的变量设置监视。对指定变量的更改将在打印下一条要执行的行之前打印出来。如果未指定 `EXPR`，则删除所有监视点。\n\
  \n### `O`\n\n`O OPT?`  \n`O OPT=VALUE`  \n`0`\n\n第一种形式 `O OPT?` 打印名为 `OPT` 的选项的值。第二种格式指定\
  \ `OPT` 的值；如果未指定值，则默认为 1。如果未给出参数，则打印所有当前选项的值。选项名称可以缩写为最小可识别名称；例如，`pager` 选项可以简化为\
  \ `p`。\n\n最常用选项的列表如表 10-1 所示。其他选项请参考 `perldebug` 手册页。\n\n**表 10.1 调试器的内部选项**\n\n\
  可以通过在新建的调试器进程中输入 `O` 来获取选项的默认值：\n\n```\nperl -de 1\nLoading DB routines from perl5db.pl\
  \ version 1.0401\nEmacs support available.\n\nEnter h or 'h h' for help.\n\nmain::(-e:1):\
  \ 1\nDB<1> O\n```\n\n### `<`\n\n`< EXPR`  \n`<`\n\n设置一个 Perl 命令，由 `EXPR` 指定，在每个调试器提示符之前执行。如果省略\
  \ `EXPR`，则重置语句列表。\n\n### `<<`\n\n`<< EXPR`\n\n设置一个 Perl 命令，由 `EXPR` 指定，在每个调试器提示符之前执行。\n\
  \n### `>`\n\n`> EXPR`  \n`>`\n\n设置 Perl 命令 `EXPR`，在每个调试器提示符之后以及提示符上的任何命令执行之后执行。如果未指定\
  \ `EXPR`，则重置命令列表。\n\n### `>>`\n\n`>> EXPR`\n\n设置 Perl 命令 `EXPR`，在每个调试器提示符之后以及提示符上的任何命令执行之后执行。\n\
  \n### `{`\n\n`{ EXPR {`\n\n设置一个调试器命令，由 `EXPR` 指定，在每个调试器提示符之前执行。如果省略 `EXPR`，则重置语句列表。\n\
  \n### `{{`\n\n`{{ EXPR`\n\n设置一个调试器命令，由 `EXPR` 指定，在每个调试器提示符之前执行。\n\n### `!`\n\n`!\
  \ EXPR`\n\n重做由数字 `EXPR` 指定的上一个命令（如调试器提示符所示），如果未指定 `EXPR`，则重做上一个命令。\n\n`! -EXPR`\n\
  \n重做从 `EXPR` 到最后一个命令。\n\n`! PATTERN`\n\n重做以 `PATTERN` 开头的上一个命令。\n\n### `!!`\n\n\
  `!! EXPR`\n\n在子进程中运行 `EXPR`。\n\n### `H`\n\n`H -EXPR`\n\n显示最后 `EXPR` 个命令——如果省略 `EXPR`，则列出历史记录中的所有命令。\n\
  \n### `q` 或 `A D`\n\n退出调试器。\n\n### `r`\n\n立即从当前子例程返回。忽略剩余的语句。\n\n### `R`\n\n重启调试器。\n\
  \n\n\n\n重启调试器。在此过程中，某些选项和历史记录可能会丢失，尽管当前规范允许保留历史记录、断点、操作和调试器选项。此外，通过 `-w`、`-I` 和\
  \ `-e` 指定的命令行选项也会被保留。\n\n`| EXPR`\n\n通过默认分页器运行命令 `EXPR`。`II`\n\n`||EXPR`\n\n通过默认分页器运行命令\
  \ `EXPR`，确保临时选择文件句柄 `DB::OUT`。\n\n`= ALIAS EXPR ALIAS`\n\n第 10 章：Perl 调试器 221\n\n\
  将 `EXPR` 的值赋给 `ALIAS`，从而有效地定义了一个名为 `ALIAS` 的新命令。如果未指定参数，则列出当前别名。请注意，别名不接受参数，但你可以通过将\
  \ `EXPR` 定义为一个正则表达式来模拟参数的效果：\n\n```\n$DB::alias{'strlen'} = 's/strlen(.*)/p length($1)/';\n\
  ```\n\n这实际上将原始的 `strlen` 命令重新执行为 `print length($l)`，其中 `$1` 是第一个匹配括号的值。\n\n`m`\n\
  \n`m EXPR`\n\n计算表达式并列出当前可应用于该表达式的有效方法。\n\n`m PACKAGE`\n\n列出在 `PACKAGE` 中定义的可用方法。\n\
  \n### 使用非交互模式\n\n如果你试图定位一个非常具体的错误或问题，交互式界面非常有用，但如果你只是想快速了解某个脚本的执行路径或概览，它可能就有些大材小用了。还有其他（可能更好的）工具（参见第\
  \ 12 章的“Perl 编译器”）。\n\n你可以通过使用“非交互”模式来绕过这个问题，这基本上是一种利用 `PERLDB_OPTS` 环境变量的技巧，让 Perl\
  \ 在启动调试器时执行一系列调试器命令。这并非官方认可的调试器执行方式，但当你想要打印堆栈跟踪或在执行期间监视变量，而又不想手动插入 print 语句或进入交互式调试器界面时，这是一种解决方案。\n\
  \n为此，你需要在运行调试器之前设置 `PERLDB_OPTS` 环境变量的值。以下示例假设你使用的是 bash shell，它会打开被调用子程序的完整帧信息，并在无需人工干预的情况下运行调试器，将完整跟踪输出到标准输出：\n\
  \n```\n$ export set PERLDB_OPTS=\"N f=31 AutoTrace\"\n$ perl -d t.pl\nPackage t.pl.\
  \ 8: bar () ;\nin .=main::bar() from t.pl:8\n5 : top() ;\nin .=main::top() from\
  \ t.pl:5\n22: print \"Top of the world, Ma!\\n\";\nTop of the world, Ma!\n23: callerlog(\"\
  Printed Message\");\nin .=main::callerlog('Printed Message') from t.pl:23\n```\n\
  \n调试 Perl：程序员故障排除\n\n12 13 14 15 16\n\n```\nmy $reference = shift;\nmy $1eve1=1;\n\
  while (((©data) = caller($level++)))\nmain t\n14\nprint join(' ',©data),\":$reference\\\
  n\";\npi 5 main::top 1 :Printed Message\nwhile (((©data) = caller($level++)))\n\
  15 16\nprint join(' ',©data),\":$reference\\n\";\npi 8 main::bar 1 :Printed Message\n\
  while (((©data) = caller($level++)))\nmain t\n14 :\n15 :\nout .=main::callerlog('Printed\
  \ Message') from t.pl:23\nout .=main::top() from t.pl:5\nout .=main::bar() from\
  \ t.pl:8\n```\n\n`PERLDB_OPTS` 环境变量实际上是调试器自定义系统的一部分，我们稍后会单独介绍。\n\n### 自定义\n\n有两种方法可以自定义\
  \ Perl 调试器。第一种方法是在 `PERLDB_OPTS` 环境变量的值中指定内部调试器选项，正如你已经看到的。另一种方法是通过将命令放入 `.perldb`\
  \ 文件中来指定调试器启动时要执行的选项、别名和命令，该文件会在执行时由调试器模块解析。\n\n该文件的通常用途是为调试器指定新的别名，通过指定 `%DB::alias`\
  \ 哈希的键和值来实现。键是别名的名称，值是要执行的命令。有关详细信息，请参见前面“调试命令”部分中的 `=` 命令。\n\n你可以通过调用 `parse_options`\
  \ 函数来更改调试器的选项，该函数接受一个参数——一个字符串，类似于在 `PERLDB_OPTS` 变量中指定的字符串。但请注意，`.perldb` 中的定义会在环境变量\
  \ `PERLDB_OPTS` 中定义的字符串之前被解析。\n\n### 替代界面\n\nemacs 编辑器为 Perl 调试器提供了一个界面，使你能够将 emacs\
  \ 编辑器用作完整的开发和调试环境。还有一种模式可以让 emacs 理解调试过程中可使用的至少部分调试器命令。\n\nCPAN 上还提供了一些模块，为 Perl\
  \ 调试器提供基于 Windows 的界面。我遇到过的最友好的界面是 `ptkdb` 界面。\n\n`ptkdb` 调试器界面使用 Tk 界面系统为 Perl\
  \ 调试器提供窗口化界面。所有常规界面元素都可用，并且最常用的项目都有按钮和入口点。你可以使用调试扩展命令行选项调用 `ptkdb` 界面（一旦安装）：\n\n\
  ```\n$ perl -d:ptkdb t.pl\n```\n\n第 10 章：Perl 调试器 223\n\n你可以在图 10-1 中看到本章示例调试脚本的示例窗口。窗口左侧显示原始\
  \ Perl 脚本的列表。右侧面板显示当前调试器调用的变量、表达式、子程序和断点。打印的信息与普通基于文本的调试器界面中产生的信息相同，只不过是在一个格式良好且窗口化的环境中。\n\
  \n### ActivePerl 调试器\n\n虽然基于文本的调试器本身并没有什么问题，但对于许多基于 Windows 的程序员来说，它可能感觉有些限制且使用复杂。ActiveState\
  \ Perl 调试器（APD）随 Perl 开发工具包一起提供，它为调试器提供了一个 GUI 界面，对于 Visual Studio 和其他集成开发环境的用户来说会很熟悉。\n\
  \n文件 控制 数据 堆栈 书签 单步进入\n\n转到 搜索 正则表达式\n\nlocal/bir\n\n运行到断点\n\n表达式 子程序 断点 输入表达式：\n\
  \nB9983 sub bar 00005 { top().\n\n00006 bn();\n\n00010 sub callerlog\n\n00012 my\
  \ $reference = shift;\n\n00013 my Slevel = 1,\n\n00014 while (((Qdata) = caller($level++)))\n\
  \n00015 print join(' ', edata), \": $ref erence\\n\"; 00010 }\n\n00020 sub top\n\
  \n100022 print \"Top of the world, Ma!\\n\";\n\n00023 callerlog(\"Printed Message\"\
  );\n\n![picture17](img/picture17.jpg)\n\n图 10.1 ptkdb 调试器界面\n\n224 调试 Perl：程序员故障排除\n\
  \n### 调试器界面\n\n一旦你安装了 Perl 开发工具包，APD 就会替换作为核心 Perl 发行版一部分安装的默认调试器。因此，要实际启动 APD，你使用相同的命令行选项：\n\
  \n```\nC:\\> perl -d script.pl\n```\n\n不幸的是，一旦安装了 ActiveState 版本，就无法再使用标准 Perl 调试器。默认的\
  \ ActivePerl 调试器窗口如图 10-2 所示。\n\n文件 编辑 查看 调试 工具 帮助\n\n邻近\n\nA\n\n寄存器：\n\n按 F1 获取帮助\n\
  \n行 163 就绪\n\n图 10.2 ActiveState Perl 调试器\n\n第 10 章：Perl 调试器 225\n\n启动后，调试器会自动打开你的脚本并执行任何\
  \ `use` 语句和 `BEGIN` 块。因此，脚本的起始位置是编译器在编译过程之后通常会执行的第一个语句。\n\n默认情况下，窗口分为四个区域：主源代码窗口（显示当前正在调试的源脚本），以及监视、邻近和寄存器面板，它们显示当前执行状态的信息。\n\
  \n请注意，你对 Perl 调试器配置所做的任何更改都是永久性的。下次使用调试器时，相同的监视、窗口和工具将仍然可用。\n\n### 源代码面板\n\n\n\n\
  \n`源`面板显示当前正在执行的语句的源代码。初始时，它会显示你正在调试的脚本，但如果你的脚本还导入了任何外部模块，调试器会跟踪到这些模块，并显示它们的源代码。你可以通过查看窗口标题来了解当前正在调试的文件——标题始终会显示文件的路径。\n\
  \n在源面板中，左侧显示被调试文件的行号。虽然行号看似微不足道，但在设置断点时非常方便——我们稍后会详细讨论。\n\n黄色箭头指示接下来将要执行的语句/行——而不是刚刚执行过的语句。蓝色箭头显示用于创建新断点和书签的当前“光标”位置。\n\
  \n我们稍后会介绍脚本的实际执行过程。\n\n### 语法着色\n\n为了在查看源代码时便于识别，代码会根据构成每条语句的各个组件进行着色。你可以通过`工具`菜单中的`选项`窗口的`颜色`面板来配置着色。图\
  \ 10-3 展示了一个示例。\n\n要启用语法着色，你需要勾选`启用语法着色`复选框。如果未勾选，所有文本将使用黑色前景和白色背景显示。\n\n为了方便使用，脚本的每个组件都可以单独着色，并且你可以为每个组件设置前景色和背景色。表\
  \ 10-2 列出了调试器识别的组件。\n\n表 10.2 语法着色\n\n226 调试 Perl：程序员故障排除\n\n表 10.2 语法着色（续）\n\n\
  选项\n\n常规 | 源 | 监视 颜色 |\n\nW 启用语法着色\n\n前景色：\n\n自动\n\n—I 背景色：\n\n□ 自动\n\n3 3\n\n确定\n\
  \n取消\n\n图 10.3 设置语法颜色\n\n第 10 章：Perl 调试器 227\n\n要实际更改颜色，请从左侧列表中选择组件，然后从右侧弹出菜单中选择前景色和背景色。随时单击`确定`按钮将接受所有更改，而单击`取消`将放弃更改。\n\
  \n着色代码仅更改显示内容的颜色——不进行其他修改。尽管这似乎显而易见，但有时如果情况相反会更方便。例如，我经常使用调试器，将注释组件的前景色和背景色都设置为白色。这实际上隐藏了程序中的注释，在调试自己的代码时很有用，因为注释不会增加我的理解。不幸的是，这也会导致调试器源窗口中出现空白区域。\n\
  \n### 源选项\n\n通过`工具`菜单中的`选项`项中的`源`面板，你可以配置主源面板的外观。有五个选项：你可以控制字体、制表符大小、监视和断点提示显示，以及行号的使用。\n\
  \n`设置字体`选项允许你设置用于显示源代码的字体样式和大小。`制表符大小`是用于替换代码中每个缩进制表符的空格数。默认值为 4（如本书所用）。\n\n`监视提示`和`断点提示`定义当光标指向被监视的变量或断点时，是否在工具提示中显示有关监视或断点的信息。\n\
  \n`显示行号`选项定义是否在左侧边距显示行号。请注意，此选项不影响当前语句箭头或断点的显示，仅影响行号。\n\n### 寄存器\n\n寄存器模拟了普通调试工具中寄存器面板的操作。Perl\
  \ 实际上并不使用内部寄存器，即使在 Perl 虚拟机内部也是如此，但有一些全局变量可能会影响脚本的整体执行。例如，`$_`变量在整个脚本中用作暂存器，如果你未提供任何参数，它通常是许多函数和运算符使用的默认变量。\n\
  \n因此，寄存器面板列出了 Perl 解释器使用的核心全局变量。显示的变量列表如表 10-3 所示。\n\n228 调试 Perl：程序员故障排除\n\n表 10-3\
  \ 中列出的条目是默认值：你可以通过在寄存器窗口中右键单击来添加自己的寄存器列表进行监视。菜单提供三个选项：你可以添加、修改或更新列表中的监视。所做的更改是永久性的——下次打开并使用调试器时，监视列表将与你上次使用时的状态一致。你可以通过配置调试选项时，在`工具`和`选项`下的`监视`面板中单击`重置`按钮，将寄存器监视列表重置为默认值。（监视是调试器的常见功能：有关向寄存器面板添加监视的详细信息，请参阅本章后面的`监视`面板部分。）\n\
  \n你可以通过右键单击`寄存器`面板时显示的弹出菜单中选择`隐藏`，或从`视图`菜单中选择`寄存器`选项来隐藏寄存器窗口。\n\n### 邻近面板\n\n邻近面板显示当前行周围变量的值。你无法配置显示的变量，也无法控制列出变量的显示方式。但是，你可以控制检查当前行上下多少行以确定要监视的变量。\n\
  \n要调整`邻近`属性，请从`工具`菜单中选择`选项`项。这将打开选项窗口。如果切换到`监视`选项卡（如图 10-4 所示），你可以看到可配置的选项。执行下一行上下的行数控制`邻近`面板监视的行数。\n\
  \n其他选项允许你重置`寄存器`面板中显示的监视列表，并设置所有三个`监视`面板使用的字体。此字体的设置不会影响主窗口的显示，仅影响面板。\n\n### 邻近面板\n\
  \n![picture18 常规 | 源 监视 | 颜色 |Courier 设置字体。指定邻近窗口应扫描变量的指令指针周围的行数：单击此处重置寄存器窗口中列出的变量：指令指针上方行数：![picture19](img/picture19.jpg)\n\
  \n指令指针下方行数：\n\n![picture20](img/picture20.jpg)\n\n重置\n\n确定\n\n取消\n\n图 10.4 选项对话框中的监视面板\n\
  \n第 10 章：Perl 调试器 229\n\n### 监视\n\n`监视`面板允许你设置始终监视的特定变量。这样做会绕过常规的`寄存器`显示和`邻近`显示。无论你在被调试脚本的执行过程中处于何处，`监视`面板中列出的信息都会保留。\n\
  \n要添加新的监视，你可以右键单击`邻近`面板中的变量并选择`复制到监视`，或者右键单击`监视`面板。\n\n监视（无论是在`监视`面板还是`寄存器`面板中）不仅仅是静态变量——创建新监视时使用的语句会像其他任何\
  \ Perl 语句一样被求值。因此，监视可以用于复杂表达式，或者你可以将表达式和函数嵌入到监视中，以更人性化的格式格式化你想要查看的变量。\n\n例如，在监视数组时，你可能想使用：\n\
  \n```\njoin( 1 , ', @array)\n```\n\n作为监视语句。如果你想更具创意，还可以输入多行或基于块的语句。下面是一个监视哈希的示例：\n\
  \n```\nforeach $key (sort keys %hash) { $string .= \"$key -> $hash{$key}\\n\" }\
  \ $string\n```\n\n\n\n\n\n所有手表唯一的问题是，由于手表的数据源显示在面板内，像上面那样长的监视语句可能无法正确显示。这个问题虽然不严重，但可能会带来持续的困扰！\n\
  \n监视始终使用当前上下文进行评估。这意味着，如果你切换到使用同名变量的块或函数，将显示局部变量。如果你使用标量来保存对另一种数据类型的引用，则需要特别小心，因为监视可能无法正确评估。\n\
  \n### 执行语句\n\n打开要调试的脚本后，你需要决定如何执行它。所有调试器都提供两种基本方法：单步执行和断点。\n\n### 单步执行\n\nActiveState\
  \ 调试器支持四个主要的单步命令。`Step Into`、`Step Over`、`Step Out` 和 `Run to Cursor` 命令的工作方式与本章前面所述完全一致，分别允许你执行并跟踪、执行并忽略、跳出函数以及运行到当前光标位置。每个操作的快捷键组合如表\
  \ 10-4 所示。\n\n表 10.4 脚本执行\n\n230 调试 Perl：程序员故障排除\n\n### 断点\n\n要在 ActivePerl 调试器中创建断点，请将光标移动到要设置断点的行，然后按\
  \ `F9`、右键单击并选择 `Toggle Breakpoint`，或者从 `Edit` 菜单中选择该选项。该选项是一个切换开关，因此你可以使用相同的过程来移除现有断点。\n\
  \n或者，你可以使用 `Insert Breakpoint` 选项在特定行插入断点。这样做允许你选择断点应出现的行（默认为当前光标行），并输入用于触发断点的条件。条件的格式应与\
  \ `if`、`while` 和其他控制语句中使用的条件相同，如果条件的结果是正整数，则视为成功，触发断点并暂停执行。\n\n要编辑所有已配置的断点，请选择 `Edit\
  \ Breakpoints` 选项。这将提供所有断点的列表，如图 10-5 所示。\n\n按 `F5` 将开始执行，只有当遇到断点时才会停止；否则整个脚本将执行完毕。对于大多数脚本，最好插入几个断点，以便能够中断脚本的处理，从而监控正在发生的事情。\n\
  \n### 调试工具\n\n除了使用监视、邻近列表和寄存器之外，你还可以通过调试菜单中的 `Quick Eval`、`Dump Variable` 和 `Call\
  \ Stack` 选项获取正在调试的脚本的即时信息。这些选项根据当前行的上下文提供有关变量和当前语句的堆栈跟踪信息。\n\n### 快速求值\n\n`Quick\
  \ Eval` 选项允许你在正在调试的脚本的上下文中执行任何 Perl 语句。你可以访问当前调试器位置在脚本中定义的所有变量。要更持久地查看输入的语句，可以单击\
  \ `Add Watch` 按钮。\n\n图 10.5 编辑所有断点\n\n第 10 章：Perl 调试器 231\n\n### 转储变量\n\n`Dump Variable`\
  \ 选项将变量的内容转储到一个可滚动的框中。对于非常大的变量，此功能至关重要，因为它允许你查看整个内容，而不受各个面板的限制。\n\n与其他监视不同，你不能提供要评估的语句，只能提供变量或变量组件（例如数组或哈希元素）。调试器会根据变量的类型和内容格式化显示变量。实际的转储由\
  \ `Data::Dumper` 模块处理。\n\n### 调用栈\n\n`Call Stack` 选项显示用于到达当前语句的函数调用跟踪，以及有关这些函数如何被调用的信息。实际输出由\
  \ `caller` 函数处理，该函数是 Perl 编译器内置的函数。`Call Stack` 选项使用下面描述的 `caller` 函数的扩展版本。\n\n\
  如果你想在自己的程序中使用 `caller` 函数，这里包含了使用该函数的信息。`caller` 函数返回的数据包括有关子程序（或 `eval` 或 `require`）语句的详细信息：\n\
  \n`caller EXPR caller`\n\n在标量上下文中，它只返回包名。在简单列表上下文中，该函数返回当前子程序、`eval` 或 `require`\
  \ 语句的调用者的包名、文件名和行号：\n\n```\n($package, $filename, $line) = caller;\n```\n\n如果指定了\
  \ `EXPR`，则 `caller` 返回扩展信息。`EXPR` 的值应该是堆栈上要回溯到当前帧之前的帧数。也就是说，如果你指定值为 1，将打印父级子程序信息；值为\
  \ 2 将打印祖父级子程序信息，依此类推。返回的信息为：\n\n```\n($package, $filename, $line, $subroutine,\n\
  $hasargs, $wantarray, $evaltext, $is_require) = caller($i);\n```\n\n`$evaltext`\
  \ 和 `$is_require` 值仅在所检查的子程序实际上是 `eval()` 语句的结果时才返回。例如，检查以下脚本：\n\n```\nsub bar\n\
  {\n    Top::top()?\n}\nbar();\npackage Top;\nsub top {\n    232 调试 Perl：程序员故障排除\n\
  \    my $level = 0;\n    print \"Top of the world, Ma!\\n\"; while ((($package,\
  \ $file, $line,\n    $subname, $hasargs, $wantarray)\n    {\n        caller($level++)))\n\
  \    $hasargs = $hasargs if (defined($wantarray))\n    Yes\n    $wantarray\n   \
  \ Stack\n    else {\n    }\n    print <<EOF;\n$wantarray = 'No';\nPackage File Line\
  \ Subroutine Has Arguments? Wants Array?\n$package\n$file\n$line\n$subname\n$hasargs\n\
  $wantarray\nEOF\n}\n```\n\n执行后，结果信息显示了 `top` 函数的堆栈跟踪，包括从 `main` 和 `bar` 函数的原始调用：\n\
  \n```\nTop of the world, Ma! Stack:\nPackage: main\nFile: ././t.pl\nLine: 5\nSubroutine:\
  \ Top::top\nHas Arguments?: Yes\nWants Array?: No\nStack:\nPackage: main\nFile:\
  \ ././t.pl\nLine: 8\nSubroutine: main::bar\nHas Arguments?: Yes\nWants Array?: No\n\
  ```\n\n提供的信息应能帮助你精确定位脚本中的位置。如果你想将信息记录到日志中，可以引入一个像这样的包装函数：\n\n```\nsub callerlog\
  \ {\n    my $reference = shift;\n    第 10 章：Perl 调试器 233\n    open(DATA,\">>caller.log\"\
  ) || return; print DATA join(' ',@_),\":$reference\\n\"; close(DATA);\n}\n```\n\n\
  然后调用该函数时，可以使用如下行：\n\n```\ncallerlog(\"Writing data\",caller () ) ;\n```\n\n来报告当前堆栈跟踪的信息。请注意，你不能直接使用\
  \ `callerlog` 中的信息，因为这样做会在堆栈的零位置引入其自身的帧信息。不过，你可以使用 `callerlog` 函数的修改形式，从第一帧开始返回堆栈跟踪：\n\
  \n```\nsub callerlog {\n    my preference = shift; my $level = 1;\n    while (((©data)\
  \ = caller($level++)))\n    {\n        print join(' ',©data),\":$reference\\n\"\
  ;\n    }\n}\n```\n\n### 书签\n\n你可以在任何代码中插入书签。书签的功能类似于互联网书签——它允许你随时直接跳转到脚本文件中的某个位置。当你想要跳转到某个经常被调用的特定函数并监控其状态时，此功能非常有用。\n\
  \n要设置新书签，请使用鼠标选择该行（由蓝色箭头标记），然后选择 `Toggle Bookmark`（`CTRL-F2`）。这是一个切换开关，因此你也可以使用它从单个行中移除书签。要查看书签，请使用\
  \ `Edit` 菜单中的 `Next`（`F2`）和 `Previous Bookmark`（`SHIFT-F2`）项。\n\n调试器执行完成后，书签也会保留。要清除所有书签，请从\
  \ `Edit` 菜单中选择 `Remove All Bookmarks`（`CTRL-SHIFT-F2`）。\n\n## 使用工具\n\n\n\n\n你可以配置多种工具，并直接从调试器中访问它们。这些工具可用于在编辑器中打开正在调试的脚本，或直接执行脚本，或通过其他工具（例如，如果你正在开发基于\
  \ Web 的界面，则可能是 Web 浏览器）来执行。\n\n要配置调试器中可用的工具，请从“工具”菜单中选择“自定义”选项。你将看到一个如图 10-6 所示的窗口。\n\
  \n![picture21](img/picture21.jpg)\n\n234 调试 Perl：程序员故障排除\n\nllfcElt'SQuroe\n\n在\
  \ ExDlorer 中查看\n\n名称： 命令： 参数： 初始目录：\n\n&编辑源代码\n\nCAProgram Files\\emacs-20.6\\bin\\\
  ernacs.exe\n\n$(SourcePath)\n\n关闭\n\n图 10.6 自定义工具\n\n要设置新工具，请单击窗口顶部最左侧的按钮，然后输入工具名称，该名称将显示在菜单中。如果在名称前加上与号（&），则该命令将使用正常的字母前缀获得菜单快捷键。前九个工具始终可以通过\
  \ ALT-#访问，其中#是 1-9 的数字。你可以通过选择工具项，然后使用上下箭头按钮调整其位置，来配置哪个工具出现在列表顶部——从而拥有 ALT-1 的快捷键。\n\
  \n“命令”框配置选择工具时将执行的程序。你可以使用浏览按钮通过常规文件对话框选择程序。“命令”框只能包含程序的路径；如果要添加参数，必须使用“参数”框。\n\n\
  “参数”框允许你引入在执行期间附加到命令行中的额外参数。你可以在此框中输入任何文本，但当你使用调试器工具提供的预定义参数之一时，该工具最为有用。你可以在表 10-5\
  \ 中查看参数列表及其描述。\n\n参数 描述\n\n表 10.5 自定义工具变量\n\n第 10 章：Perl 调试器 235\n\n请注意，“源扩展名”参数包含用于分隔基本名称及其扩展名的句点。例如，在调试\
  \ CGI 脚本时，你可以创建一个具有以下属性的工具：\n\n名称： 在资源管理器中查看\n\n命令： C:\\Program Files\\Internet\
  \ Explorer\\lexplore.exe 参数： incontinent/www/$(SourceName)$(SourceExtension)\n\n\
  最后一个条目允许你配置执行开始的目录。虽然对于编辑文件来说并不有用（或必要），但如果你想创建一个在调试器之外执行脚本的工具，它可能会很有用。\n\n### 命令行调试\n\
  \n当你编译 Perl 时，可以配置解释器以包含额外的调试功能。这些调试钩子提供了 Perl 解释器内部的接口，从而在比 Perl 调试器稍低的级别上调试脚本。要启用此功能，你需要从源代码重新构建\
  \ Perl，并通过再次运行 Configure 来启用调试选项：\n\n```\n$ sh Configure -Doptimize='-g'\n```\n\n\
  这样做会强制 C 编译器重新构建可执行文件，首先为应用程序本身添加调试信息，以便你可以通过 gdb 运行它。它还会打开`-DDEBUGGING`标志，从而启用解释器的调试功能。这些功能比\
  \ Perl 调试器的功能更技术性，因为它们报告的是内部信息而非脚本信息。\n\n可用的信息非常广泛，实际上更多地与 Perl 的内部工作方式相关，而不是与你的脚本相关。事实上，在某些情况下，这些信息作为脚本调试工具是无用的，因为这些信息直接与解释器的解释或解析过程相关。尽管如此，使用这些工具可以帮助你更好地理解\
  \ Perl 的工作原理以及不同操作成功或失败的原因。\n\n更有用的选项是那些可用于识别与内存使用、哈希或正则表达式相关的特定问题的选项。还有一些工具用于输出执行树和脚本使用的操作码信息，如果你正在为安全环境开发脚本，并且需要使用\
  \ Safe 或 Opcode 模块或 ops pragma，这些工具会有所帮助。\n\n236 调试 Perl：程序员故障排除\n\nNotG I ^ tese\
  \ too ^ s are not f or tne faint-hearted! 除非你正在尝试追踪一个无法在其他地方解决的特定错误，否则请远离这些选项。这些选项不能替代\
  \ Perl 调试器，也不能替代我们在第 10 章中看到的一些更简单的技术。\n\n可用选项列表如表 10-6 所示，我们将很快详细查看每个选项。要实际获得调试输出，可以通过字母组合或指定组合选项的十进制值来选择选项。例如，要打开污点检查和内存分配，你可以使用`-Dmu`或`-D2176`。\n\
  \n请记住，在每种情况下，这些选项实际输出的信息量可能非常巨大——即使是一个简单的脚本也可能输出数千行“调试”信息。我建议将输出重定向到文件，或者至少通过分页器进行管道输出。由于输出是到\
  \ STDERR，请使用\n\n```\n$ perl -Dmu t.pl 2>debug.out\n```\n\n进行重定向，或者\n\n```\n$ perl\
  \ -Dmu t.pl 2>&1 | more\n```\n\n进行分页。\n\n数字 字母 描述\n\n第 10 章：Perl 调试器 237\n\nEES\n\
  \n这些调试选项会产生大量信息，并且在你完成编程后，可以作为应用程序的有用交叉参考。如果你决定以这种方式使用它们，请考虑保存来自 tcmrx 选项的输出。如果你正在处理污点数据，请使用\
  \ u 选项；对于线程，请使用 S 选项。将这些信息与脚本文档一起保存。\n\n如果你真的想看看 Perl 在输出调试信息时在做什么，请在 Perl 源代码树中搜索字符串\
  \ DEBUG_#，其中#是表 10-6 中显示的调试字母。\n\n### 词法分析和解析\n\n第一个选项输出由 Perl 内置的 yacc 解析器处理的解析过程。要真正理解此选项的输出，你需要了解\
  \ yacc 解析器的工作原理，但这超出了本书的范围。不过，本质上，解析器通过将输入行的每个元素进行词法分析，并识别或解析每个标记来工作。解析过程遵循一系列状态来识别每个组件。一旦每个组件被识别，就可以根据识别的类型进行解析、执行或丢弃。\n\
  \n实际过程非常广泛，解析将经历许多不同的状态和规约，然后才能执行最终语句。例如，考虑以下行：\n\n```\n$ perl -Dp -e 'print $hello;'\n\
  yydebug: after reduction, shifting from state 0 to state 2\nyydebug: state 2, reducing\
  \ by rule 7 (lineseq :)\nyydebug: after reduction, shifting from state 2 to state\
  \ 3\n### Tokener expecting STATE at\nyydebug: state 3, reading 286 (LSTOP)\nyydebug:\
  \ state 3, reducing by rule 44 (label :)\nyydebug: after reduction, shifting from\
  \ state 3 to state 15\nyydebug: state 15, shifting to state 46\n### Tokener expecting\
  \ REF at $hello;\nyydebug: state 46, reading 36 ('$')\nyydebug: state 46, shifting\
  \ to state 65\nyydebug: state 65, reading 257 (WORD)\nyydebug: state 65, shifting\
  \ to state 92\nyydebug: state 92, reducing by rule 190 (indirob : WORD)\nyydebug:\
  \ after reduction, shifting from state 65 to state 147\nyydebug: state 147, reducing\
  \ by rule 185 (scalar : '$' indirob)\nyydebug: after reduction, shifting from state\
  \ 46 to state 116\n### Tokener expecting OPERATOR at ;\n238 调试 Perl：程序员故障排除\nyydebug:\
  \ after reduction, shifting from state 2 to state 3\n### Tokener expecting STATE\
  \ at\nyydebug: state 3, reading 0 (end-of-file)\nyydebug: state 3, reducing by rule\
  \ 2 (prog : $$1 lineseq)\nyydebug: after reduction, shifting from state 0 to state\
  \ 1\nEXECUTING...\n```\n\n\n\n\n实际上我已经裁剪了输出；对于一个相对简单的语句，完整输出有 59 行。你可以想象一个更大脚本的输出。\n\
  \n### 栈快照\n\n栈快照选项会生成一个简化的参数栈列表，该栈用于在子例程调用期间交换信息。例如，这个简单的脚本\n\n```\nsub add\n{\n\
  $_[0] +$_[1] ;\n}\nprint add(1,2);\n```\n\n会产生以下输出：\n\n```\nperl -D2 t.pl\nEXECUTING...\n\
  ```\n\n这非常清晰地展示了栈的状态——值 1 首先被放入栈中（作为整数值），然后是 2。全局值（`GV`）是对`add`函数的调用，随后这两个值被取出并替换为数值\
  \ 3。`SV_YES`是一个指示符，描述了`print`语句的返回上下文——一个标量值。\n\n### 上下文（循环）栈处理\n\n上下文栈处理输出实际上显示了每个语句在进入构成脚本的不同作用域和块时的进度。如果你想追踪进出特定块或循环的任何跳转，这个功能会很有用。此外，它还会显示负责执行该语句或片段的对应源文件，这对于识别特定操作码操作的位置以调试解释器很有帮助。例如，在之前相同的脚本中：\n\
  \n```\n$ perl -D4 t.pl\n(t.pl:4) ENTER scope 2 at op.C:63 93\n(t.pl:3) LEAVE scope\
  \ 2 at op.c:6722\n(t.pl:6) ENTER scope 2 at op.c:6393\n(t.pl:6) LEAVE scope 2 at\
  \ op.c:6722\n(t.pl:0) LEAVE scope 1 at perl.c:1278\n(t.pl:0) ENTER scope 1 at perl.c:1286\n\
  (t.pl:0) Setting up jumplevel 0xbffff9c8, was 0x81364c0\nEXECUTING...\n(t.pl:0)\
  \ ENTER scope 2 at pp_hot.c:14 6 5\nEntering block 0, type BLOCK\n(t.pl:6) ENTER\
  \ scope 3 at pp_hot.c:2 3 03\nEntering block 1, type SUB Leaving block 1, type SUB\n\
  (t.pl:6) LEAVE scope 3 at pp_hot.c:2 04 7\nLeaving block 0, type BLOCK\n(t.pl:0)\
  \ LEAVE scope 2 at pp_hot.c:1587\n(t.pl:0) LEAVE scope 1 at perl.c:388\n```\n\n\
  你可以看到，对`add`的调用（即作用域 3）实际上是从第 6 行进入的。作用域 2 是主包和执行路径。作用域 1 是初始解释/解析阶段，在此阶段提取命令行参数等内容并传递给脚本。\n\
  \n这个选项在调试循环时尤其有用，因为它能最清晰地指示循环的特定迭代何时跳转到不同的作用域（子例程或其他块）。例如，稍微修改后的脚本：\n\n```\nsub\
  \ add\n{\n$_[0]+$_[l] ;\n}\nforeach (1..100) {\nprint add($_,$_);\n}\n```\n\n会为\
  \ 100 次迭代中的每一次生成跳入/跳出报告。裁剪后的版本如下：\n\n```\nENTER scope 2 at op.c:6393 LEAVE scope\
  \ 2 at op.c:6722 ENTER scope 2 at op.C:6393 ENTER scope 3 at op.c:6393 LEAVE scope\
  \ 3 at op.c:6722 LEAVE scope 2 at op.c:6722 LEAVE scope 1 at perl.c:1278 ENTER scope\
  \ 1 at perl.c:1286\nSetting up jumplevel 0xbffff9c8, was 0x81364c0 EXECUTING...\n\
  (t2.pl:0) ENTER scope 2 at pp_hot.c:1465\nEntering block 0, type BLOCK\n(t2.pl:6)\
  \ ENTER scope 3 at pp_ctl.c:1658\n(t2.pl:6) ENTER scope 4 at pp_ctl.c:1688\nEntering\
  \ block 1, type LOOP\n(t2.pl:8) ENTER scope 5 at pp_hot.c:2303\nEntering block 2,\
  \ type SUB Leaving block 2, type SUB\n(t2.pl:8) LEAVE scope 5 at pp_hot.c:2047\n\
  (t2.pl:8) ENTER scope 5 at pp_hot.c:2303\nEntering block 2, type SUB Leaving block\
  \ 2, type SUB\n(t2.pl:8) LEAVE scope 5 at pp_hot.C:2047\nLeaving block 1, type LOOP\n\
  (t2.pl:6) LEAVE scope 4 at pp_ctl.c:1775\n(t2.pl:6) LEAVE scope 3 at pp_ctl.c:1776\n\
  Leaving block 0, type BLOCK\n(t2.pl:0) LEAVE scope 2 at pp_hot.c:1587\n(t2.pl:0)\
  \ LEAVE scope 1 at perl.c:388\n```\n\n这里应该很明显，块 1（作用域 4）是主循环，块 2（作用域 5）是`add`函数。\n\
  \n顺便提一下，你可能会认为作用域 1 也是处理`BEGIN`和`END`块的地方。那就错了。运行一个包含每种语句各一个的简单脚本会发现，它们像主脚本一样被赋予了自己的作用域。此外，它还表明这些块是通过调用`eval`来执行的。这本身可能并不令人惊讶，但它确实有助于我们理解这些块和`eval`函数的工作原理。\n\
  \n### 跟踪执行\n\n你可以使用跟踪执行选项非常简单地跟踪脚本或语句的内部执行。这样做实际上会在每个代码片段执行时输出操作码树的未格式化版本。再次使用我们的示例脚本，你可以看到值如何被压入栈，`add`子例程如何被调用，然后`print`子例程如何被调用来输出结果：\n\
  \n```\n$ perl -D8 t2.pl\n```\n\n在其中执行你的脚本。\n\n关于操作码的信息，请参见第 2 章或参考第 12 章——Perl 编译器有自己输出解析后的操作码树的方式，这可能更容易理解。\n\
  \n### 方法和重载解析\n\n当使用需要通过 Perl 的继承系统解析的对象和方法时，有时监控特定方法是从哪里继承来的会很有用。你可以使用`-Do`调试选项来实现这一点——它会打印\
  \ Perl 在查找给定方法时遵循的跟踪信息。例如，考虑简单的调用：\n\n```\nperl -D16 -e 'use Cwd;'\n(/usr/local/lib/perl5/5.6.0/Cwd.pm:71)\
  \ Looking for method import in package Carp\n(/usr/local/lib/perl5/5.6.0/Cwd.pm:71)\
  \ Looking for method import in package Exporter\n(/usr/local/lib/perl5/5.6.0/warnings.pm:67)\
  \ Looking for method import in package Carp\n(/usr/local/lib/perl5/5.6.0/warnings.pm:67)\
  \ Looking for method import in package Exporter\n(-e:l) Looking for method import\
  \ in package Cwd\n(-e:l) Looking for method import in package Exporter\nEXECUTING...\n\
  ```\n\n我们可以看到，当导入`Cwd`时，需要`import`方法。这是由`use`语句调用的方法，用于将`Cwd`导出的函数导入当前命名空间。首先我们在`Carp`中查找，它已被`Cwd`导入，然后查找`Exporter`，这是用于导出/导入函数的类。\n\
  \n当你调用一个重载函数或方法时，将遵循相同的基本规则和过程。\n\n### 字符串/数值转换\n\n此选项会生成一个列表，显示 Perl 在何处对字符串或数值的所需格式做出了假设并进行了转换。例如，以下代码：\n\
  \n```\n$string = \"The result is: \"; $string .= '45' + 99; print $string;\n```\n\
  \n在通过 Perl 的调试选项运行时，会产生：\n\n```\n0x813el90 num(99)\n0x813el90 lnv(99)\n0x813elc0\
  \ lnv(45)\n0x813elcc 2iv(144)\nEXECUTING...\n0x813elcc 2pv(144)\n```\n\n你可以看到它将\
  \ 99 识别为原始数字并赋值为数值，将 45 转换为数值，计算结果转换为整数，最后将结果设置为字符串（`PV`）值。\n\n你可以使用此选项来追踪数字似乎被错误解释的情况。例如，上述脚本的修改版本：\n\
  \n```\n$string = \"The result is: \"; $string .= '99/33' + 1; print $string;\n```\n\
  \n显然会返回 100——Perl 的字符串到数值转换只转换原始数字，因此除号充当了终止符。通过调试选项运行时，结果更清晰：\n\n```\n0x813el90\
  \ num(l)\n0x813el90 lnv(l)\n0x813elc0 lnv(99)\n0x813elcc 2iv(100)\nEXECUTING...\n\
  0x813elcc 2pv(100)\n```\n\n同样的选项也可用于识别应用于计算的优先级规则；例如，\n\n```\n$ perl -D32 -e '34\
  \ + 55 * 99'\n0x813e0ac num(99)\n0x813e0ac lnv(99)\n0x813e0a0 num(55)\n0x813e0a0\
  \ lnv(55)\n0x8136c50 2iv(5445)\n0x8136c50 num(5445)\n0x8136c50 lnv(5445)\n0x813e094\
  \ num(34)\n0x813e094 lnv(34)\n0x813e0ac 2iv(5479)\n```\n\n\n\n由此可见，`*` 运算符的优先级高于\
  \ `+` 运算符。使用 Perl 编译器附带的 `Deparse` 引擎可以获得一个更实用的示例（更多信息请参见第 12 章）。\n\n### 打印预处理器（针对\
  \ CPP）\n\n当在 Perl 脚本上使用 C 预处理器时（通过命令行中的 `-P` 选项启动），打印处理器会输出信息和执行调用。此外，它还会打印出给定脚本所调用的操作码数量列表。示例如下：\n\
  \n```\n$ perl -DP -P myext.pl\nEXECUTING...\nNot enough args at chl0/cron2nt.pi\
  \ line 8\\. 7 pushmark 17 const\n2 gvsv 5 gv\n19 nextstate\n3 unstack 2 enter\n\
  1 enteriter\n4 iter\n1 leaveloop 1 require 1 leaveeval 1 method named\n```\n\n###\
  \ 内存分配\n\n使用此选项，你可以获得 Perl 脚本执行期间分配的内存的详细列表。这些信息实际上并不是很有用——它可能不会告诉你所期望的内容。这些信息也可能具有误导性，因为许多分配实际上只是为了保存内置特殊变量以及\
  \ Perl 在执行任何脚本时使用的其他元数据。\n\n给出的信息按解释器为脚本分配的地址空间中的虚拟地址列出，并且每次调用 `malloc`/`free` 内存分配系统都会分配一个简单的顺序编号。除非你知道特定对象的大小，否则使用此工具很难跟踪——使用\
  \ `-DL` 选项可以获得更好的概览。\n\n### 格式处理\n\n当使用 Perl 的内部格式系统时，如果不手动生成并研究输出前的每一行，就无法追踪和识别问题。你可以通过使用\
  \ `-Df` 调试选项来解决这个问题。\n\n此选项在处理给定格式时输出格式化过程的进度。例如，这个简单的脚本：\n\n```\nformat STDOUT_TOP\
  \ = Variable Value\n\nformat STDOUT =\n@<<<<<<<<<<<<<<<<<< ^<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<\
  \ $key, $data{$key}\n\n%data = CMC => 'Martin C Brown', 'Dan' => 'Dan the Man');\n\
  foreach $key (%data) {\n    write;\n}\n```\n\n在通过调试器运行时输出以下内容：\n\n```\n$ perl -Df\
  \ fmtdebug.pl\nEXECUTING...\nLINEMARK\nFETCH 19\nCHECKNL\nITEM\nSPACE\nLITERAL 1\n\
  FETCH 4 7\nCHECKCHOP\nITEM\nCHOP\nNEWLINE\nEND\nleft=0, todo=l LINEMARK\nLITERAL\
  \ 2 5\nNEWLINE\nLINEMARK\nLITERAL 6 7\nNEWLINE\nEND\nleft=60, todo=2 Variable\n\
  Value\nleft=58, todo=l MC\nLINEMARK\nFETCH\nCHECKNL\nITEM\nSPACE\nLITERAL\nFETCH\n\
  1\n47\nL9\nMartin C Brown\nCHECKCHOP\nITEM\nCHOP\nNEWLINE\nEND\nleft=57, todo=l\
  \ LINEMARK\nFETCH 19\nCHECKNL\nITEM\nSPACE\nLITERAL 1\nFETCH 4 7\nCHECKCHOP\nITEM\n\
  CHOP\nNEWLINE\nEND\nleft=56, todo=l\nDan Dan the Man\nLINEMARK\nFETCH 19\nCHECKNL\n\
  ITEM\nSPACE\nLITERAL 1\nFETCH 4 7\nCHECKCHOP\nITEM\nCHOP\nNEWLINE\nEND\nleft=55,\
  \ todo=l\n```\n\n`left` 数值是当前页面剩余的行数，而 `todo` 是当前保存在 `$A` 累加器变量中的行数。其余输出用于确定正在输出的行和字段的确切格式。`FETCH`\
  \ 行表示当前字段的字符数。`LINEMARK` 表示新行的开始（包括续行），`CHECKNL` 表示源数据是否包含换行符，`CHECKCHOP` 表示文本是否需要被截断或拆分以构成多行条目。\n\
  \n### 正则表达式\n\n`-Dr` 命令行选项允许你调试正则表达式。你也可以通过使用 `use re 'debug'` 编译指示来实现相同的基本输出结果。结果是正则表达式引擎编译时输出的详细列表。例如：\n\
  \n```\n$ perl -Dr -e '\"top o the world\" =~ m/top [of]\\s+the (world)/;'\nCompiling\
  \ REx 'top [of]\\s+the (world)' size 23 first at 1 rarest char w at 4 rarest char\
  \ p at 2\nanchored 'top ' at 0 floating 'the world' at 6..2147483647 (checking floating)\
  \ minlen 15\nOmitting $' $& $' support.\nEXECUTING...\n```\n\n我们将逐一查看每个部分，从前言开始：\n\
  \n```\nCompiling REx 'top [of]\\s+the (world)' size 23 first at 1 rarest char w\
  \ at 4 rarest char p at 2\n```\n\n编号列表之前的前言显示了编译后表达式的大小以及表达式中出现频率最低的字符。这些信息在实际执行期间由内部正则表达式表使用。如果你想了解使用\
  \ `study` 函数的优势，这些信息可能非常宝贵。在这种情况下，源文本（`$_`，将为空）和正则表达式都不够复杂，不足以先调用 `study`。Perl 实际决定哪些字符最罕见是基于英语中已知的字母频率表。\n\
  \n```\n1: EXACT <top >(3)\n3: ANYOFfo\n12: PLUS(14) 13: SPACE(0)\n14: EXACT <the\
  \ >(16)\n16: OPEN1(18) 18: EXACT <world>(21)\n21: CL0SE1(23)\n2 3 : END(0)\n```\n\
  \n然后，编号列表指示给定规则的各个节点。每个节点表示正则表达式语言中的特定构造。我们稍后将返回具体的节点类型，但这个示例很容易理解：匹配精确字符串 `\"top\"\
  `，匹配方括号中的任意指定字符，后跟任意数量的空格，精确字符串 `\"the\"`，然后第一个分组（1）匹配精确字符串 `\"world\"`。你可以看到，对于分组和最小/最大匹配，其含义是嵌套的。\n\
  \n```\nanchored 'top' at 0 floating 'the world' at 6..2147483647 (checking floating)\
  \ minlen 15\n```\n\n摘要语句说明了初始搜索的锚定位置——在本例中，锚定在第一个精确字符串匹配处，而字符串 `\"the world\"` 可以位于字符串中的任何位置。匹配正则表达式所需的最小字符数为\
  \ 15，这是优化的一部分，实际上也反映了常识。任何长度小于 15 个字符的匹配字符串都可以被跳过（不匹配）。摘要语句的各个元素可以由此处看到的字段之外的许多不同字段组成。完整列表见表\
  \ 10-7。\n\n```\nOmitting $' $& $ 1 support.\n```\n\n表 10.7 调试正则表达式的摘要字段\n\n最后一行仅指示正则表达式系统可以填充的特殊变量是否已启用并填充。\n\
  \n### 节点类型\n\n正则表达式引擎通过将组件解析为节点来工作（参见本节的引言）。各个节点指示要执行的匹配类型，有些节点可以嵌套以生成复杂表达式，例如 `[a-z]+`。节点的完整列表见表\
  \ 10-8。\n\n表 10.8 用于描述正则表达式的节点\n\n表 10.8 用于描述正则表达式的节点（续）\n\n表 10.8 用于描述正则表达式的节点（续）\n\
  \n### 匹配过程\n\n如果你实际提供了一个要匹配的字符串，那么在标准的 `EXECUTING` 语句之后，你将看到实际的匹配过程。在我们的例子中，这会产生以下输出：\n\
  \n```\nEXECUTING...\nGuessing start of match, REx 'top [of]\\s+the (world) 1 against\
  \ 'top o the world'\nFound floating substr 'the world' at offset 6...\nFound anchored\
  \ substr 'top ' at offset 0...\nGuessed: match at offset 0\nMatching REx 'top [of]\\\
  s+the (world)' against 'top o the world'\nSetting an EVAL scope, savestack=3\n0\
  \ <> <top o the wo>\n4 <top > <o the wo>\n5 <top o> < the wo>\n| 1: EXACT <top >\
  \ | 3: ANYOF[fo] j 12: PLUS\nSPACE can match 1 times out of 32767 savestack=3\n\
  Setting an EVAL scope,\n6 <op o > <the wor> | 14: EXACT <the >\n10 < o the > <world>\
  \ | 16: OPEN1\n```\n\n\n\n\n## 第 10 章：Perl 调试器\n\n### 使用正则表达式调试器\n\n```\n10 < o\
  \ the > <world> j 18: EXACT <world;\n\n15 < o the world> <> j 21: CLOSE1\n\n15 <\
  \ o the world> <> j 23: END Match successful!\n\nFreeing REx: 'top [of]\\s+the (world)'\n\
  ```\n\n引擎首先验证编译后正则表达式摘要中高亮显示的初始信息——它已找到浮动字符串和表达式开头的锚定字符串。其余过程则用于将各个节点描述与提供的字符串进行匹配。\n\
  \n使用此调试器的最佳方式并非将其作为事后调试器来验证某个正则表达式是否在字符串上生效。相反，仅提供正则表达式，并确保给出的节点列表和描述与你对该正则表达式含义的理解一致。\n\
  \n匹配过程中提供的信息过多，除非你处理的是非常复杂的字符串和正则表达式组合，否则这些信息很难派上用场。即便如此，我们在第 4 章中看到的大多数技术可能对你更有用。\n\
  \n同样，这个特定调试选项的实用性更多体现在 Perl 语言的编写者和维护者身上，或者那些希望更深入了解 Perl 内部工作原理的人。\n\n### 语法树\n\
  \n语法树转储（`-Dx`）有点像 Perl 编译器支持的操作码引擎。它生成一个树状结构，包含用于执行特定语句的操作码。例如：\n\n```\n$ perl -Dx\
  \ -e 'print 1+2;' {\n6 TYPE = leave ===> DONE\nFLAGS = (VOID,KIDS,PARENS)\nREFCNT\
  \ = 0\n{\n1 TYPE = enter ===> 2 }\n{\n2 TYPE = nextstate ===> 3 FLAGS = (VOID)\n\
  LINE = 1\nPACKAGE = \"main\"\n} {\n5 TYPE = print ===> 6\nFLAGS = (VOID,KIDS) {\n\
  3 TYPE = pushmark ===> 4 FLAGS = (SCALAR)\n} {\n4 TYPE = const ===> 5 FLAGS = (SCALAR)\n\
  SV = IV(3)\n}\n}\n}\n```\n\n你可以通过跟踪操作码分支来了解实际执行过程。每个分支都有编号，并显示在输出的第一列。与编译器后端一样，生成的操作码树基于优化后的代码——因此你可以在这个示例中看到，计算\"\
  1+2\"已被优化为执行节点 4 中的一个简单常量值 3。\n\n如果你想找出某个特定语句被转发到给定操作码分支的位置或原因，这个调试选项会很有用。乍一看，序列很难识别，但通过练习，你甚至可以将这样一棵大树转化为大脑能够理解、操作并最终识别的东西。\n\
  \n### 污染检查\n\n在处理污染数据时，找出数据被污染的原因通常不是问题——污染引擎会明确指出错误发生的位置和内容。但有时了解污染验证失败的原因也很有用。通常，对于已修改以考虑污染数据的脚本，安全失败的原因在于\
  \ setuid 系统。要么是用户试图以他人身份执行代码，要么是 setuid 系统本身失败。\n\n虽然我们可以手动打印当前的污染设置、用户 ID（uid）和有效用户\
  \ ID（euid），但更好的方法是使用`-Du`调试选项。调用时，它会输出信息列表：污染值、uid 和 euid。例如：\n\n```\n$ perl -Du\
  \ -T -e 1 $path = $ENV{PATH}; system \"echo\"; 1\n\nEXECUTING...\n\n$ENV{PATH} 1\
  \ 1000 1000\n\nInsecure $ENV{PATH} while running with -T switch at -e line 1.\n\
  ```\n\n在这个示例中，我们当然强制触发了污染失败。在调试自己的脚本时，请确保 uid 和 euid 相同；如果这样做不能解决问题，那么你需要修改脚本，检查并验证来自污染源的所有数据。有关污染检查的更多信息，请参阅`perlsec`手册页。\n\
  \n### 内存泄漏\n\n我们已经看到了一个 Perl 如何分配内存的示例。这个示例并不是特别有用，因为它没有让我们感受到 Perl 总共使用了多少内存。`-DL`调试选项会输出给定\
  \ Perl 操作所分配的内存列表，包括不同的桶大小。我从 Perl 文档中摘取了以下示例：\n\n```\n!!! \"after\" at test.pl\
  \ line 3.\n\nId subtot 4 8 12 16 20 24 28 32 36 40 48 56 64 72 80 80+\n\n0 02 13752\
  \ .... 294 4\n\n0 54 5545 . 8 124 16 . .1 1 3\n\n6 02 7152\n\n7 02 3600 150\n\n\
  7 03 64 . -1 . 1 . . 2\n\n7 04 7056\n\n7 17 38404 1\n\n9 03 2078 17 249 32 . . .\
  \ . 2\n```\n\n`Id`是解释器中不同操作的唯一标识。你可以通过对 Perl 源代码使用`grep`来识别特定操作。例如，代码 903 表示创建了一个\
  \ glob。\n\n这里展示的信息除非你试图识别特定操作的内存泄漏，否则用处不大——最有用的时候是你正在嵌入或扩展 Perl 时。如果你只是想简单了解 Perl\
  \ 的内存使用情况，请参阅本章后面的“调试内存使用”部分。\n\n### 哈希转储\n\n`-DH`调试选项会强制覆盖`values`语句，使其不再打印给定哈希键的值，而是打印关于计算出的哈希值以及用于存储该信息的数组的信息。以一个简单脚本为例，该脚本向哈希中填充四个条目——a\
  \ => b, c => d，依此类推——然后打印每个值，你会得到以下输出：\n\n```\n104%8=0 106%8=2 100%8=4 102%8=6\n\
  ```\n\n哈希中每个值的输出格式如下：`computed_hash%array_max+l = array_index`\n\n要理解其工作原理和意义，你需要了解哈希的工作方式。Perl\
  \ 的哈希系统基于一个简单的原理，称为冲突链。在这里，字符串被转换为一个整数（上面的`computed_hash`）。这个计算出的值被用作动态数组`xhv_array`的数组索引，该数组是\
  \ Perl 内部使用的哈希对象的一个组件。然而，由于不同的字符串可能产生相同的计算值，`xhv_array`中的索引实际上用于指向一个链表，而这个链表才真正包含实际的哈希键。\n\
  \n通过这个过程，如果不同的哈希键产生相同的整数哈希值，从而指向`xhv_array`中的同一个元素，那么它们可能会存储在同一个链表中。当你访问哈希时，你提供的键字符串会被转换为其整数哈希值，这为\
  \ Perl 提供了`xhv_array`中链表的起始点，该链表包含真正的键值。这个过程解释了为什么哈希查找如此之快，即使是在大型复杂哈希上也是如此。当你查找特定键时，Perl\
  \ 不会遍历整个哈希键数组，而只会检查与你的键的哈希值相关的链表。\n\n为了使整个过程高效，Perl 还需要确保链表的分布相对均匀——如果我们有一个包含 1000\
  \ 个元素的哈希，其中 900 个存在于同一个链表中，那么查找将花费过多时间。Perl 通过将`xhv_array`的大小加倍，然后重新索引哈希条目以改善分布来解决这个问题。\n\
  \n当然，我们仍然需要将哈希值实际存储在一个数组中。为了将哈希值转换为真正的数组索引，Perl 使用以下计算将计算出的哈希值折叠到用于存储给定链表的数组的最大大小（上面的`array_max`）中：\n\
  \n```\narray_index = computed_hash & array_max;\n```\n\n因此，综合所有这些信息，我们可以使用调试选项`-DH`来概览哈希值以及对应的链表数组。回到我们的示例，值\
  \ 104%8=0 表示哈希值为 104，它存储在最大包含 8 个链表的`xhv_array`中，而该链表实际存储在`xhv_array`的索引 0 处。\n\n\
  \n\n\n\n对于更复杂的哈希，输出将是对哈希键和链表分布的更详细概述。这些信息可以帮助你调整所使用的键基，以改善分布，从而提高性能。\n\n254 调试 Perl：程序员故障排除指南\n\
  \n顺便提一下，如果你在标量上下文中打印一个哈希，它会输出 `xhv_array` 中实际存储链表的元素数量与 `xhv_array` 中元素总数的比率。这个数字让你无需借助调试就能快速了解数组的效率。这两个数字之间的比率越低，性能越快，因为较低的比率意味着链表较短。例如，脚本\n\
  \n```\nforeach ( 'aa' .. 'zz') { $hash{$_} =1; }\nprint scalar %hash, \"\\n\";\n\
  ```\n\n生成了一个包含 676 个元素的哈希，并输出 `676/1024`，表示在可能的 1024 个数组元素中，有 676 个元素带有链表。这将为我们提供最高性能，因为计算出的哈希会直接带我们找到值。另一方面，脚本\n\
  \n```\nforeach (1 .. 1000) { $hash{\"key-$_\"} = 1; } print scalar %hash, \"\\n\"\
  ;\n```\n\n创建了 1000 个条目，并输出 `509/1024`，表示对于给定的哈希值，每个链表中几乎有两个条目，这会使性能略微下降，因为每个哈希键需要与两个条目进行比对才能找到我们正在查找的值。\n\
  \n你可以通过为哈希的 `keys` 语句分配一个整数来调整 `xhv_array` 的最大大小，从而提高效率，如下所示：\n\n```\nkeys %hash\
  \ = 1000;\n```\n\nPerl 会将这个数字向上取整到最接近的 2 的幂，本例中为 1024。只有当你确定要向哈希中引入大量条目时，这样做才真正有用，因为它能阻止\
  \ Perl 在哈希大小增加时执行重新索引过程。这种差异很难精确计算，因为它完全取决于你使用的哈希键，并且在大多数情况下可能不太显著。\n\n### 临时变量分配\n\
  \nPerl 会创建许多临时变量，用于在标量值最终分配给标量变量、被优化或在操作码执行期间被清除之前存储这些值。例如，语句 `4 + 5` 实际上分配了三个临时变量，分别用于两个值以及加法操作码的结果。`-DX`\
  \ 选项显示了在脚本初始编译期间这些临时变量的分配情况：\n\n第 10 章：Perl 调试器 255\n\n```\nperl -DX -e '4 + 5;\
  \ 1'\nPad 0x813d3c0 alloc 1 for add\nPad 0x813d3c0 sv 1\nPad 0x813d3c0 sv 1\nPad\
  \ 0x813d3c0 swipe 1\nPad 0x813d3c0 free 1\nEXECUTING...\n```\n\n请注意，临时变量的分配实际上是临时变量数组内元素分配的结果。临时变量数组是为单个操作码创建的，初始大小只有一个元素。当使用递归子例程调用时，临时变量数组的大小会随着递归的每一层增加一个元素。显然，如果你的子例程包含多层递归，那么对于给定的操作码，最终可能会得到一个巨大的临时变量数组。\n\
  \n同样的规则和问题也适用于线程，线程也有可能为同一个子例程创建多个执行指针。在这两种情况下，`-DX` 命令行选项都能帮助你跟踪这些情况。\n\n### 清理\n\
  \n`-DD` 调试器显示 Perl 在何处选择清理对象引用、命名 glob 对象，或在对象引用内清理循环。此过程产生的信息量很大，因为被清理的对象会使用内部对象转储器进行转储。例如，以下是单个对象引用的转储信息：\n\
  \n```\nCleaning object ref: SV = RV(0x8140c40) at 0x8141534 REFCNT = 1 FLAGS = (ROK)\
  \ RV = 0x8136ba8\n```\n\n这显示了引用的内存位置和引用计数。对于命名 glob 对象，信息更加明确：\n\n```\nCleaning\
  \ named glob object: SV = PVGV(0x813e260) at 0x813del8 REFCNT = 1\nFLAGS = (GMG,SMG,MULTI)\
  \ IV = 0 NV = 0\nMAGIC = 0x813e2d0\nMG_VIRTUAL = &PL_vtbl_glob MG_TYPE = 1 * 1 MG_OBJ\
  \ = 0x813del8 MG_LEN = 5\nMG_PTR = 0x813e2f0 \"STDIN\" NAME = \"STDIN\" NAMELEN\
  \ = 5\nGvSTASH = 0x8136ad0 \"main\" GP = 0x813e298\nSV = 0x813de24\nREFCNT = 1\n\
  256 调试 Perl：程序员故障排除指南\n10 = 0x813de30\nFORM = 0x0\nAV = 0x0\nHV = 0x0\nCV = 0x0\n\
  CVGEN = 0x0\nGPFLAGS = 0x0\nLINE = 0\nFILE = \"tl2.pl\"\nFLAGS = 0x2\nEGV = 0x813del8\
  \ \"STDIN\"\n```\n\n这种检查在特定情况下很有用，比如你想确定某个特定对象或 glob 在何处被销毁。通常，你可以通过使用调试器甚至打印语句来监控给定对象或引用的状态，从而更容易地确定这些信息。\n\
  \n### 线程同步\n\n最后一个命令行调试选项列出了所有基于线程的操作，包括线程的创建、分离、连接和终止。它还会在父线程退出而子线程仍在执行时强制 Perl\
