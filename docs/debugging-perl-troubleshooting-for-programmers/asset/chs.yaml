  \ 函数。\n\n`-I _` 前面的 stat 不是 Istat 致命错误\n\n你试图检查 `_` stat 缓冲区的符号链接状态，但该 `_` 缓冲区并不指向一个符号链接。请尝试使用文件名而不是\
