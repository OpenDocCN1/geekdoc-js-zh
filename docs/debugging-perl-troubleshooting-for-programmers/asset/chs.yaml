  \n`Starting new thread now Segmentation fault`\n\n初始化过程展示了 Perl 如何识别不同的线程，并开始设置构成我们想要创建的线程的对象（实际上是代码值）。你甚至可以在执行过程中看到线程如何被复制以及新线程如何被创建——然而，当\
  \ Perl 真正尝试启动线程时，我们遇到了段错误！\n\n### 调试内存使用\n\nPerl 有一个独立的机制用于调试内存使用。这个检查仅在 Perl 使用自己的\
  \ `malloc` 内存分配函数构建时有效，它能提供一些关于 Perl 如何使用和分配内存的有用信息。\n\n258 调试 Perl：程序员故障排除指南\n\n\
  要使用它，你需要设置 `PERL_DEBUG_MSTATS` 环境变量的值。如果未设置或设置为零，则不输出任何统计信息。如果设置为 1，Perl 仅在执行后输出统计信息；如果设置为大于\
  \ 1 的值，则会在编译和执行后都输出内存统计信息。例如：\n\n```\nPERL_DEBUG_MSTATS=2 perl -e 'use Cwd 1\n```\n\
  \n编译后的内存分配统计信息：(buckets 4 (4)..16376 (16384) 93388 free: 255 106 447 59 16 3 0 3\
  \ 2003\n\n279 168 124 118 11 214376 used: 255 402 1191 406 16 13 8 65 0 12 0 232\
  \ 172 811 470 14 Total sbrkO : 322872/3 9:187\\. Odd ends: pad+heads+chain+tail:\
  \ 1336+3532+2048+8192\\. 执行后的内存分配统计信息：(buckets 4(4) . .16376 (16384) 93388 free:\
  \ 255 106 447 59 16 3 0 3 2003\n\n279 168 124 118 11 214376 used: 255 402 1191 406\
  \ 16 13 8 65 0 12 0\n\n232 172 811 470 14 Total sbrk(): 322872/39:187\\. Odd ends:\
  \ pad+heads+chain+tail: 1336+3532+2048+8192.\n\n我们将以执行统计信息为参考，分别查看每个组成部分。\n\n执行后的内存分配统计信息：(buckets\
  \ 4(4) .. 16376 (16384)\n\nPerl 以桶（bucket）的形式为变量、代码和其他对象分配内存。信息被放入这些桶中，上面的数字以最小桶大小（本例中为\
  \ 4 字节）到最大桶大小（16,384 字节）的形式给出。括号内的数字表示桶的总大小；括号外的数字表示可放入桶中的用户数据的最大大小。在本例中，最大桶大小有\
  \ 8 字节的开销，因为我们实际上只能在最大桶中存储 16,376 字节。\n\n93388 free: 255 106 447 59 16 3 0 3 2003\n\
  \n279 168 124 118 11\n\n空闲行显示了不同大小的桶中未被使用的数量。第一行的数字按顺序对应从最小桶大小（或更大一级）到最大桶大小的桶。第二行显示了介于上述两个数字之间大小的桶中未被使用的数量。如果重新写成以下形式，一切就清晰了：\n\
  \n```\n#Bckt size 8 16 32 64 128 256 512 1024 ...\n93388 free: 255 106 447 59 16\
  \ 3 0 3 2003\n#Bckt size 4 12 24 48 96 279 168 124 118 11\n```\n\n例如，这表明我们有 255\
  \ 个大小为 8 字节的桶已被分配但未被使用。而我们有 11 个大小为 96 字节的桶未被使用。\n\n已用行显示相同的信息，但针对的是已分配并使用的桶。在这两种情况下，free\
  \ 或 used 前面的数字表示已分配的总字节数。\n\nTotal sbrk(): 322872/39:187\\. Odd ends: pad+heads+chain+tail:\
  \ 1336+3532+2048+8192.\n\n第 10 章：Perl 调试器 259\n\n摘要 sbrk 行显示了为脚本分配的总字节数。`sbrk()`\
  \ 函数用于增加运行进程的内存分配，并与 `malloc()` 一起帮助在 Perl 解释器内部分配内存。对于 Perl 来说，这种内存分配是为了执行你的脚本。主要数字（本例中为\
  \ 322,872）表示 Perl 分配的总内存量，39 是 Perl 调用 `sbrk()` 函数的次数。最后一个数字 187 表示 Perl 认为连续的内存块数量。\n\
  \n“odd ends” 数字提供了关于内存如何分配的扩展信息。pad 数字表示保持各个桶对齐所需的内存量。\n\nheads 表示存储较小桶所需的开销。请记住，在我们的示例中，最小的桶大小是\
  \ 4 字节，但桶大小和可用区域大小相同：4 字节。开销存储在一个单独的块中，这就是 heads 数字所表示的。\n\nchain 数字表示在将较大的桶拆分为两个或多个较小的桶后剩余的内存量。各个碎片被单独记录并作为链表存储。\n\
  \n最后的 tail 数字表示由 `sbrk()` 请求但未被 `malloc()` 分配的内存量。\n\n### 实际含义\n\n忽略此报告中给出的所有细节，真正重要的数字是通过\
  \ `sbrk()` 调用分配的总字节数。在我们的示例中，脚本总共使用了 322,872 字节的内存。但值得记住的是，给出的数字包括 Perl 分配的所有内存，包括分配给内部变量、符号表和临时工作区的内存。即使是最简单的脚本也会使用相当多的内存：\n\
  \n```\n$ PERL_DEBUG_MSTATS=1 perl -e 'l; 1\n```\n\n执行后的内存分配统计信息：(buckets 4 (4) .\
  \ .8184 (8192) 19020 free: 199 80 53 23 11 3 0 2 10 0\n\n455 126 71 1 22\n\n39720\
  \ used: 56 47 10 39 5 5 0 16 0 1 1\n\n56 44 99 41 3\n\nTotal sbrk(): 60728/7:155\\\
  . Odd ends: pad+heads + chain+tail: 1336 + 652 + 0 + 0.\n\n这些细节相对琐碎，除非你想检查存储机制以及将数据存储在不同类型的内部结构中所带来的权衡。哈希显然比数组带来更大的开销，而数组又比简单标量开销更大。还要记住，Perl\
  \ 会创建许多内部结构，仅仅是为了以不同格式保存信息——将字符串 \"1\" 作为整数和字符串访问，几乎会使所需的存储分配翻倍。\n\n在这个级别上给出的信息粒度对于大多数普通程序员来说可能过于具体。如果你想快速了解如何识别可能的内存和资源问题，请参阅第\
  \ 11 章。\n\nIV\n\n优化你的代码\n\n## 第 11 章\n\n手动优化\n\n![picture22](img/picture22.jpg)\n\
  \n264 调试 Perl：程序员故障排除指南\n\n\n\n\n在第 1 章中，我们探讨了调试代码背后的不同过程。当然，代码本身存在一些普遍问题，即导致程序崩溃的缺陷和小陷阱，本书大部分篇幅都在讨论这些问题以及如何追踪、跟踪并希望解决它们。然而，还有另一种类型的缺陷，虽然不那么严重，但仍可能导致问题并造成代码中不必要的延迟。\n\
  \n我所说的这类问题是指那些可以被优化掉的部分——代码中本质上运行正常，但会拖慢执行速度或未能有效利用 Perl 能力的区域。\n\n追踪这些缺陷可能很困难。其中一些很容易发现，专家只需扫一眼脚本就能看出哪些地方可以更好地利用\
  \ Perl 来加速程序。对于经验较少的用户来说，这需要更多时间，而本章的目标就是让他们的任务更轻松——将提供一些指导原则和思路，用于在不影响操作的情况下提高应用程序的速度。与调试的其他领域一样，随着时间的推移，这些实践会变得自动化，但即使是经验丰富的程序员，有时也会为了确保算法可行而使用快速而非高效的方法。\n\
  \n实际上，优化过程有两个方面：提高速度和改善内存使用。速度方面最容易发现，因为它直接关系到程序的执行流程——例如，使用 `for` 循环遍历数组中的每个元素，而不是直接使用哈希。内存方面则更困难。虽然有工具可以跟踪内存使用情况（见第\
  \ 10 章），但这些工具只能提供整体内存使用情况的概念，无法指出脚本中可能内存使用不当的区域。\n\n本章不会涉及解决程序中低效算法的问题。这些问题很难提供指导，尽管唐纳德·克努斯的《计算机程序设计艺术》（三卷，分别关于基本算法、搜索与排序、半数值算法）会有所帮助。至于帮助您发现问题区域的工具，请参见第\
  \ 12 章“自动优化”。\n\n### 追踪执行\n\n手动优化，顾名思义，是一个手动过程。我们在第 12 章中介绍的工具只能帮助您识别脚本中导致问题的区域，它们不会为您进行优化。尽管\
  \ Perl 确实会进行某种程度的优化，但它高度集中于能够发现并优化掉的那些元素——它无法发现或修复糟糕的算法或方法。\n\n这种情况未来可能会改变——编译器和解释器正变得越来越智能，内置发现可能糟糕方法的能力可能不会太遥远。\n\
  \n在那之前，唯一的解决方案是手动遍历脚本，找到并修复问题。一种简单的方法是使用我们在第 9 章中介绍的一些手动调试技术——使用 `print` 语句来突出显示可能的问题区域是很有用的。例如，如果您正在调试一个使用多个循环和其他嵌套语句的程序，只需放置一个\
  \ `print` 语句来输出循环或函数的名称，就能很好地了解每个循环或函数被调用的次数。\n\n第 11 章：手动优化 265\n\n如果您担心实际的时间，可以考虑使用\
  \ `time` 来获取特定函数的开始和结束时间，或者更好的是，使用第 12 章中的 Perl 分析器。\n\n在实际检查代码时，您可能应该重点关注三个主要方面：\n\
  \n- **变量** – 高效使用变量意味着只创建需要的变量，尽可能使用局部作用域变量（使用 `my`），并避免创建大小超过几百字节或几百个元素的标量、列表或哈希。\n\
  - **函数** – 应避免向函数传递大型列表；当某个特定函数会在循环中被多次调用时，应优先使用小型、紧凑、自包含的函数。关于使用函数创建和优化程序的信息，请参见第\
  \ 5 章。\n- **程序控制** – 应避免使用涉及循环、嵌套函数调用和重复迭代的结构。始终考虑测试表达式中的选项——考虑使用预定义的默认值，并仅测试非默认条目。\n\
  \n接下来几页我们将探讨一些具体细节。\n\n### 发现资源消耗点\n\n我们将关注的两个方面是提高执行速度和减少内存使用的方法。与所有事物一样，这两方面通常需要权衡。提高速度是可能的，但往往伴随着增加内存使用的风险。例如，将大文件读入内存会减少向系统请求更多数据的次数——但另一方面，这也意味着需要分配一大块内存来保存文件内容。\n\
  \n对于如何选择，没有硬性规定。在现代世界中，速度比内存更重要，尤其是当磁盘和 RAM 存储如此便宜时。然而，请记住，大量内存使用会拖慢基于 Web 的解决方案的执行速度，因为多个脚本实例同时执行是现实存在的。\n\
  \n此外，还存在一定的交叉——一些被列为纯粹速度改进的技术实际上也有助于减少内存使用。我尽量在可能的地方标注出交叉和互补的技术。\n\n### 提高速度\n\n\
  提高执行速度首先依赖于您生成良好算法的能力，其次依赖于充分利用 Perl 的能力来辅助算法。简单的事情，比如关键字列表，用哈希处理比用数组好得多，因为内部的哈希算法已经过优化。我们可以直接访问哈希值，甚至使用哈希作为去重材料的方法仍然比使用数组和迭代更高效。\n\
  \n266 调试 Perl：程序员故障排除\n\n### 程序结构\n\n程序结构是指脚本的总体布局，以及您在应用程序各个部分都会用到的一些通用语句。\n\n\
  - 当函数或循环控制语句能达到相同效果时，避免使用 `goto`。任何对 `goto` 的调用都会导致解析器搜索指定的标签；Perl 不会维护内部表。\n- 当可以使用花括号内联展开信息（如变量名）时，不要使用\
  \ `eval`。您可以使用类似这样的方式：\n\n```\n${$prefix . $var} = \"String\";\n```\n\n- 另外，避免在循环内部使用\
  \ `eval`，因为这样做会导致 Perl 在每次迭代时都对 `eval` 语句进行解析。相反，将迭代放在 `eval` 内部，这样该块只需被解析一次。\n\
  - 在循环上下文中，始终尽早放置控制语句，以防止 Perl 执行那些最终不会被使用的语句。例如，以下代码是浪费的：\n\n```\nwhile (<DATA>)\
  \ {\nchomp;\nnext if / A #/ ;\ni\"\n```\n\n你不需要为了正则表达式匹配而移除字符串末尾的换行符。\n\n- 将用于从一系列单值中进行选择的\
  \ `if..else` 语句替换为逻辑或。你总是可以使用\n\n```\n$login = getlogin || (getpwuid($<))[0] ||\
  \ \"Anonymous\";\n```\n\n- 避免在大型循环中调用复杂的子程序，尤其是那些几乎没有其他步骤的循环。将参数复制到栈上再返回的开销会拖慢进程。如果可能，使用引用而不是静态列表；或者，如果这确实成为问题，用\
  \ C 重写该函数。\n\n\n\n\n\n• 使用列表来接受列表的函数，而不是拼接字符串。例如，使用 `print` 进行拼接时，每个值都会被复制到一个新字符串中，然后返回拼接后的版本，再继续处理下一个元素。使用列表可以显著加快这一过程。或者，尝试使用\
  \ `join` 并传入空分隔符，因为 `join` 会将每个字符串添加到新字符串中，而不是对每个元素执行多次复制。\n\n## 第 11 章：手动优化 267\n\
  \n### 变量与常量\n\n良好的变量设计应有助于减少大部分开销——例如，使用数组代替单个变量的列表。其他提示如下：\n\n• 避免使用变量的默认值。Perl\
  \ 总是会将变量初始化为 0 或空值。\n\n• 预先扩展数组或字符串可以节省时间，因为它会预分配内存，否则 Perl 会尝试在运行时动态分配。\n\n• 使用哈希而不是数组来存储诸如关键字之类的信息（否则你需要使用数组和搜索机制来查找）。另外，记住你可以使用哈希来去除列表中的重复项。\n\
  \n不要在静态表达式上浪费时间手动计算：\n\n```\n$day_seconds = 24*60*60;\n```\n\nPerl 会在编译时自动将其优化为单个值。更好的做法是，在需要的地方直接使用表达式，而不要浪费时间去引入另一个变量。\n\
  \n• 使用 `my` 而不是 `local`。\n\n• 不要对之后可能用于其他目的的变量执行 `undef`。更具体地说，当单个临时变量就能满足需求时，不要创建多个变量。如果可能，最好使用\
  \ `$_`。\n\n### 打印、插值与操作\n\n文本的显示和插值可能是一个相当耗时的过程，尤其是在大量使用文本输出的脚本中——例如解析器或 CGI 脚本。\n\
  \n• 避免对不需要插值的文本使用会进行插值的引号。虽然这样做不会节省太多时间，但它意味着 Perl 在插值数据时需要检查的字符串更少。\n\n• 除非绝对需要打印特定格式，否则使用\
  \ `print` 代替 `printf`。记住，变量可以直接插值到某些带引号的字符串中。\n\n• 如果正则表达式能更快地完成转换或提取，则避免对长字符串多次使用\
  \ `substr`。例如，要从格式为“19980326”的日期中提取元素，使用 `substr`：\n\n```\n$date = ' 19980326 1\
  \ ; $year = substr($date,0,4); $month = substr($date,4,2); $day = substr($date,6,2);\n\
  ```\n\n268 调试 Perl：程序员故障排除指南\n\n使用正则表达式几乎肯定更快：\n\n```\n$date = '19980326 ' ;\n($year,\
  \ $month, $day) = $date =~ 1 /(d{4})(\\d{2})(\\d{2})/ 1\n```\n\n更好的做法是，对字符串使用 `pack`\
  \ 和 `unpack`。你可以将上述示例重写为：\n\n```\n($year, $month, $day) = unpack(\"c4c2c2\",$date);\n\
  ```\n\n• 使用 `substr` 修改字符串，而不是提取元素再拼接新版本。更好的做法是使用正则表达式替换。\n\n• 使用 `trill` 而不是 `s///g`\
  \ 来删除字符串中的字符。\n\n• 当处理多个文件句柄时，尤其是网络套接字，使用 `select` 而不是轮询方法。更好的做法是考虑使用 `fork` 或新的\
  \ `Thread` 模块，以便异步处理请求。但请记住，`fork` 会带来进程复制的开销，而线程则意味着内存开销。\n\n### 正则表达式\n\n正则表达式可能是巨大的资源消耗者。用于匹配分组和重复元素的反向追踪过程意味着巨大的开销，因为它需要对同一段文本进行多次迭代。其他陷阱和解决方案如下：\n\
  \n• 通过减少单个表达式中的量词和断言数量来优化正则表达式。这在处理表达式分组时尤其有用，因为每次都会导致正则表达式引擎回溯并填充 `$#` 变量。\n\n\
  • 避免使用 `$&`、`$\\` 和 `$'` 变量。一旦使用，Perl 就会开始跟踪之后使用的每个正则表达式的信息。\n\n• 在正则表达式外部使用逻辑或\
  \ `||` 有时比在正则表达式内部使用替代项更快。因此，使用\n\n```\n$found = if /one/ || /two/;\n```\n\n而不是\n\
  \n```\n$found = if /one|two/;\n```\n\n• 当使用多个正则表达式多次测试一个字符串时，将所有 a 类、所有 b 类等分组。Perl\
  \ 这样处理会更快，因为内部表已经构建好了。\n\n• 如果字符串很大且正则表达式复杂，使用 `study` 函数来提高性能。\n\n### 文件与文件系统\n\
  \n由于文件或文件系统调用是外部的，许多人忽略了它们对整体性能的影响。虽然这样的调用不会影响 Perl 脚本的执行，但操作系统处理请求确实需要时间。减少调用次数或调用的大小将有助于提高性能和内存使用。\n\
  \n第 11 章：手动优化 269\n\n• 使用 `sysread` 按块获取信息，而不是 `getc`。\n\n• 使用 `grep` 和 `opendir`\
  \ 读取目录列表，以避免 `glob` 函数返回大型列表。\n\n• 在创建多个目录时，使用操作系统的 `mkdir` 命令（如果支持），而不是多次调用内置的\
  \ `mkdir`。\n\n• 当操作符和函数能自动检测 `eof` 时，不要使用 `eof`。\n\n### 调用外部应用程序\n\n你无法控制外部程序的执行时间和顺序，但可以通过使用内部函数或强制直接执行（而非通过\
  \ shell）来减少影响。\n\n• 避免调用操作系统函数，因为每个 Perl 脚本在执行时内置的预定义变量很可能包含你想要的信息。\n\n• 使用 `Cwd`\
  \ 模块，而不是外部调用 `pwd`。使用 `system` 会创建子进程，可能还会启动 shell，涉及大量额外的指令和处理器时间。\n\n• 使用列表与 `system`\
  \ 和 `exec` 配合，而不是使用一个需要引号和格式化才能获得正确信息的大字符串。\n\n### 减少内存\n\n当我们谈论减少 Perl 的内存占用时，实际上是指减少\
  \ RAM 占用，而不是磁盘空间。在内部，Perl 允许你做各种可能增加内存占用的事情，而你却可能没有意识到。明显的例子是将整个文件加载到内存中进行处理，但不太明显的问题可能由创建临时数组和列表引起。\n\
  \n能够减少内存占用的地方并不多。Perl 的实用性在于它能自动处理内存和变量分配，以及变量超出上下文时的垃圾回收。除了这里给出的提示外，没有其他方法可以控制\
  \ Perl 的内存使用，尽管未来版本计划提供这样的控制。\n\n#### 变量与数据\n\n很容易让 Perl 使用大量内存而不考虑后果。以下提示应有助于减少变量的内存占用：\n\
  \n• 使用 `vec` 函数将非常小的数字存储在一个变量中，而不是为每个数字使用单独的变量。\n\n• 使用 `pack` 和 `unpack` 高效地将信息存储在外部文件中。\n\
  \n• 使用 `substr` 将小的固定长度字符串存储在一个较大的字符串中。\n\n你也可以将这种方法应用于数组和哈希，如果内存空间确实紧张，可以将它们存储在文件中。必要时，使用临时文件存储非常大的数组。此外，考虑使用\
  \ DBM 文件将哈希和列表信息存储在内存之外。如果你想存储小的键值对\n\n270 调试 Perl：程序员故障排除指南\n\n\n\n\n在哈希中存储信息时，可以考虑使用\
  \ `Tie::SubstrHash` 模块，它能够比普通 IK（或更大）键/值对大小更紧凑地压缩哈希数据。\n\n### 迭代与程序控制\n\n某些 Perl\
  \ 语句会自动带来较大的内存开销；这里列出较为显著的一些：\n\n- 当顺序不重要时，使用 `each` 代替 `keys` 来遍历哈希。这能减少传递给循环控制语句的临时列表的大小。\n\
  - 尽量避免创建大型临时列表，例如：\n\n```\nforeach (0..$#array)\n{\n    #对 $array[$_] 执行某些操作\n}\n\
  ```\n\n尽管在较新版本的 Perl 中这已经得到了优化，但最好还是尽可能避免。使用带有简单变量和测试条件的 `while` 或 `for` 循环。\n-\
  \ 总的来说，尽量避开任何可以避免的列表操作；创建数组并频繁使用会占用大量临时存储空间，即使对于相对较小的数组也是如此。\n- 使用 `undef` 和 `delete`\
  \ 移除不再需要的变量或哈希元素。\n- 传递变量的引用，尤其是列表和哈希的引用，而不是每次都向函数提供列表。\n- 避免创建仅用于支持哈希顺序的临时列表，例如：\n\
  \n```\n@sort = keys %hash; foreach (@sorted)\n```\n\n应内联排序列表，即：\n\n```\nforeach\
  \ (sort keys %hash)\n```\n\n如果列表很复杂，并且需要按顺序处理每个元素才能排序，请记住你可以向 `sort` 提供自己的排序函数。这个过程甚至可用于复杂数据——例如，要对日期排序，你可以这样写：\n\
  \n```\nforeach (sort sortdate keys %errors)\n{\n    print \"$_\\n\";\n}\n```\n\n\
  ```\nsub sortdate {\n    my ($c,$d) = ($a,$b);\n    $c =~ s{(\\d+)/(\\d+)/(\\d+)}{sprintf(\"\
  %04d%02d%02d\",$3,$1,$2)}e;\n    $d =~ s{(\\d+)/(\\d+)/(\\d+)}{sprintf(\"%04d%02d%02d\"\
  ,$3,$1,$2)}e;\n    $c <=> $d;\n}\n```\n\n这里我们复制了传递给函数的 `$a` 和 `$b` 的值，然后比较修改后的值——这样做可以防止修改原始值，因为\
  \ `$a` 和 `$b` 实际上是对列表内容的引用。\n\n在这个例子中，空间优化意味着速度的下降！\n\n# 第 11 章：手动优化 271\n\n## 第\
  \ 12 章 自动优化\n\n![picture23](img/picture23.jpg)\n\n274 调试 Perl：程序员故障排除指南\n\n本章的标题可能有点误导，因为它暗示我们可以让\
  \ Perl 自行优化。当然，这在一定程度上是正确的——在第 2 章中，我们曾看过 Perl 脚本的执行过程，Perl 经历的阶段之一就是一种优化过程。这个过程的一个缺点是它相当简单，实际上它所做的只是尝试将多个语句折叠成单个操作码，以提高最终性能。\n\
  \n因此，这个过程的问题在于它并没有真正优化你的程序。它不会挑出并修复我们在上一章中看到的陷阱，比如无意义的循环、在应该使用哈希时使用数组（或反之），或者低效地使用\
  \ `eval`。\n\n要捕捉这些效率错误中的大部分，你需要像我们在第 11 章中那样手动遍历代码，或者使用一个工具来帮助你识别和优化程序中的部分，以便你自己进行修改。\n\
  \nPerl 提供了两个工具来帮助你发现可能优化的区域：Perl 分析器（Perl profiler）和 Perl 编译器（Perl compiler）。Perl\
  \ 分析器是调试后端的一个特殊扩展，它也支持我们在第 10 章中看到的调试器。分析器通过监控执行各个子例程所花费的时间来工作，然后根据这些信息生成报告。分析器不会为你优化子例程，但它会识别出哪些子例程需要进一步检查，看是否可以进行手动优化。\n\
  \nPerl 编译器是 Perl 的一个相对较新的特性。其主要目的是允许你将 Perl 脚本转换为独立的可执行文件，将脚本和解释器嵌入到单个应用程序中。然而，编译器附带的后端也可用于帮助你识别\
  \ Perl 已经优化的语句。或者，你可以生成脚本的预编译版本，然后直接执行，从而省去用于执行文本脚本的常规解析器/优化阶段。\n\n### Perl 分析器\n\
  \nPerl 分析器接收一个典型的脚本，并使用调试后端监控脚本中各个子例程的执行情况。分析器既监控脚本本身范围内定义的函数或方法，也监控从外部导入的任何子例程/方法——包括在\
  \ `use` 语句期间使用的 `import` 方法。实际过程分为两个阶段：\n\n- 使用 `DProf` 调试扩展运行脚本。这样做会生成一个名为 `tmon.out`\
  \ 的单独文件。\n- 运行 `dprofpp` 脚本，该脚本分析 `tmon.out` 中的信息，并基于该信息生成各种报告。\n\n第一阶段很简单，只需在执行脚本时将\
  \ `DProf` 扩展作为调试器名称提供即可。例如：\n\n```\n$ perl -d:DProf slow.pl\n```\n\n`tmon.out` 文件包含每个单独子例程调用的信息，包括执行所花费的时间以及调用它的子例程名称。通过这些信息，你可以相当清楚地了解究竟执行了什么、何时执行以及花费了多长时间。尽管你可以自己分析和处理这些信息，但\
  \ Perl 已经自带了 `dprofpp` 脚本。\n\n`dprofpp` 脚本在安装 Perl 时一同安装，并且应该存在于你的执行路径中，随时可用于后处理分析。它读取\
  \ `tmon.out` 文件，整理所有信息，然后以简单列表、嵌套树或其他多种格式输出时间信息的摘要。\n\n`dprofpp` 脚本的选项如表 12-1 所示。如果你经常使用特定的选项集，可以使用\
  \ `DPROFPP_OPTS` 环境变量来存储默认选项列表。默认值为 `-z -O 15 -E`。\n\n**表 12.1 dprofpp 分析系统的选项**\n\
  \n| 选项 | 描述 |\n|------|------|\n| (版本) | 打印 `dprofpp` 脚本的版本号，如果找到或指定了统计文件，则打印其中存储的\
  \ `Devel::Dprof` 版本号。 |\n| (平均值) | 按每次调用中子调用的平均耗时排序。 |\n| (用户+系统) | 按使用的用户和系统时间量对子例程列表排序。\
  \ |\n\n**表 12.1 dprofpp 分析系统的选项（续）**\n\n`dprofpp` 脚本的默认输出如下所示：\n\n```\nTotal Elapsed\
  \ Time = 40.28038 Seconds User+System Time = 40.18038 Seconds Exclusive Times\n\
  %Time ExclSec CumulS #Calls sec/call Csec/c Name\n100. 40.21 40.215 1001 0.0402\
  \ 0.0402 First::foo\n0.31 0.125 40.291 1 0.1254 40.290 Second::foo\n0.00 0.000 40.340\
  \ 1 0.0000 40.340 main::bar\n```\n\n默认情况下，输出的信息显示生成脚本所经过的总时间。请注意，这个数字可能略有偏高，因为它取决于机器上运行的其他进程。用户和系统时间是实际执行脚本所花费的总时间。用户时间是\
  \ Perl 实际处理所花费的时间，系统时间是系统为服务请求所花费的时间——例如，从文件读取数据或向屏幕输出信息。\n\n其余数据以列格式显示各个函数的信息，各列的描述总结如下。\n\
  \n- `%Time` 该函数相对于其他函数所花费的时间百分比。\n- `ExclSec` 执行该函数所花费的时间——此数字不包括该函数调用的其他函数所花费的时间。\n\
  - `CumulS` 执行该函数以及该函数调用的任何函数所花费的时间。\n\n\n\n\n\n- `#Calls` 该函数的调用次数。\n- `Sec/call`\
  \ 每次调用该函数所花费的平均秒数——此数值不包括该函数调用的其他函数所花费的时间。\n- `Csec/c` 每次调用该函数以及该函数调用的任何其他函数所花费的平均秒数。\n\
  \n从这个示例可以看出，调用最频繁且消耗时间最多的函数是 `First` 包中的 `foo` 函数。\n\n你还可以生成一份报告，显示各个函数的嵌套关系和相对执行时间，以及它们是如何被调用的。\n\
  \n# 第 12 章：自动优化 277\n\n```\nmain::bar x 1 40.34s = (0.00 + 40.34)s\nSecond::foo\
  \ x 1 40.29s = (0.13 + 40.17)s\nFirst::foo x 1000 40.17s First::fOO X 1 0.05s\n\
  ```\n\n其余的命令行选项基本上只是修改这两个基本报告，要么改变顺序、计算参数，要么改变树形显示。\n\n### 示例脚本性能分析\n\n我们的示例脚本将使用一个简化版的\
  \ HTTP 日志处理器。它提取单个字段（日期/时间字符串），然后生成一个唯一条目的列表。使用的日志文件大小约为 8MB——包含 90,300 行。实际上，这是一个\
  \ 180KB 的文件重复多次的结果——这是有意为之，既是为了对脚本进行压力测试，也是为了提供足够的样本，以便我们更好地了解相对执行时间。脚本的第一个版本如下：\n\
  \n```\n#!/usr/local/bin/perl -w\n\nuse strict; my @datetime; process();\n\nsub process\
  \ {\n\nopen(DATA,\"../access.log\") or die \"can't open log: $!\";\n\nwhile(<DATA>)\n\
  \n{\n\nchomp;\n\nmy @fields = split; process_fields(@fields);\n\n}\n\n}\n\nsub process_fields\
  \ {\n\nmy (@fields) = @_; add_to_datetime($fields[3]);\n\n}\n\nsub add_to_datetime\
  \ {\n\nmy ($datetime) = @_; foreach (@datetime) {\n\nreturn if ($datetime eq $_);\n\
  \n}\n\npush @datetime,$datetime;\n\n}\n```\n\n278 调试 Perl：程序员故障排除指南\n\n分析器不会捕获脚本的主部分，除了将其全部计入总执行时间；因此，我们将主处理循环拆分为自己的函数，以获得精确的时间值。那些遵循上一章技巧的人应该已经能够发现前面示例中两个明显的资源消耗点。\n\
  \n在此脚本上运行分析器，然后不带任何参数调用 `dprofpp`，会得到以下输出：\n\n```\nTotal Elapsed Time = 91.55104\
  \ Seconds User+System Time = 91.79165 Seconds Exclusive Times\n```\n\n最大的消耗点是 `add_to_datetime`\
  \ 函数，它负责向 `datetime` 数组添加唯一条目。这是一个耗时的过程，因为它意味着每次都要遍历数组（实际上，遍历了 90,300 次）。虽然只有大约\
  \ 405 个唯一项，但在找到需要的项或确定需要将当前条目添加到列表之前，仍然需要大量迭代。这个特定的资源消耗点很好地说明了使用数组是多么糟糕的主意——我们可以用哈希替换它并消除循环。\n\
  \n主 `process` 函数我们可以暂时忽略——对于加速解析从文件中读取的每一行，我们能做的并不多。实际上，我们调用了一个外部函数来处理。最后一个执行消耗点\
  \ `process_fields` 函数从 `process` 函数接收一个相对较大的数组，并依次调用 `add_to_datetime` 函数。\n\n同样，根据上一章，重复调用函数，尤其是当有多个不同参数时，是一个资源消耗点。这是因为\
  \ Perl 在调用函数之前必须将参数复制到堆栈上。我们可以尝试使用引用或全局变量，但结合另一个消耗点，可能有更好的解决方案。\n\n如果我们修复这两个问题，就可以生成一个新脚本，使用哈希而不是两个函数和一个数组。新版本的脚本如下：\n\
  \n```\n#!/usr/local/bin/perl -w\n\nuse strict; my %datetime;\n\nprocess();\n\nsub\
  \ process {\n\nopen(DATA,\"../access.log\") or die \"can't open log: $!\";\n\nwhile(<DATA>)\n\
  \n{\n\nchomp;\n\nmy @fields = split;\n\nChapter 12: Automatic Optimization 279\n\
  \n$datetime{$fields[3]} = 1,\n```\n\n启用分析器运行脚本，然后使用 `dprofpp` 报告结果，我们得到：\n\n```\n\
  Total Elapsed Time = 19.75992 Seconds\nUser+System Time = 19.68992 Seconds Exclusive\
  \ Times\n\n%Time ExclSec CumulS #Calls sec/call Csec/c\n99.6 19.62 19.620 1 19.620\
  \ 19.620\n0.00 0.000 -0.000 1 0.0000\n0.00 0.000 -0.000 1 0.0000\n0.00 0.000 -0.000\
  \ 1 0.0000\nName\nmain::process main::BEGIN strict::import strict::bits\n```\n\n\
  巨大的差异——我们仅通过使用哈希就将执行时间从 91 秒减少到了不到 20 秒。我们还消除了两个函数调用——因为不再需要它们——最终只剩下一个函数来完成所有工作。\n\
  \n这很好地证明了为什么哈希在这种汇总计算中更快。哈希算法为我们完成了所有繁琐的工作。关于哈希算法以及它为什么比普通的渐进式数组查找快得多的描述，请参见第 10\
  \ 章“命令行调试：哈希转储”。\n\n### 单次性能分析\n\n如果你只想对脚本进行一次性能分析，可以直接使用 `dprofpp` 脚本：\n\n```\n\
  $ dprofpp -S -p t.pl\n```\n\n然而，如果你希望持续探测原始结果以获取不同的组合和报告，可能每次针对不同的函数选择，那么你应该通过分析器运行脚本以创建\
  \ `tmon.out` 文件。然后，你可以基于原始数据编译报告，而无需再次运行脚本。比较脚本多次执行的结果通常是浪费时间，因为每次执行之间的微小差异可能会导致某些函数的数据出现巨大差异。\n\
  \n还要注意生成的原始数据文件的大小。对于这个小脚本，生成了一个 16KB 的数据文件。更大的脚本，具有更多函数，更重要的是更多函数调用，将生成显著更多的数据。我们上面的慢脚本示例生成了一个\
  \ 1.6MB 的数据文件用于处理。\n\n### 性能分析替代方案\n\n在最简单的层面上，只需在调用函数前后记录 `time` 给出的时间：\n\n```\n\
  $before = time();\nmyfunction();\n$after = time();\n$duration = $before-$after;\n\
  ```\n\n280 调试 Perl：程序员故障排除指南\n\n这种解决方案的唯一问题是，我们只能以秒为单位知道持续时间——当调用一个需要很长时间的函数时很有用，但如果想要分析对函数的单个调用，则粒度不够。\n\
  \n更好的解决方案是 `Benchmark` 模块，它是标准 Perl 发行版的一部分。它的工作方式与上面的 `time` 示例基本相同，只是我们获得了毫秒级的粒度（通过使用\
  \ `times` 函数）。例如，代码\n\n```\n$t = timeit(1000000, 'cos (3.141) 1 ) ;\nprint \"Calculation\
  \ time: \", timestr($t), \"\\n\";\n```\n\n会将一百万次迭代计算的时间信息放入 `$t` 中，`$t` 将是对 `Benchmark`\
  \ 对象的引用。然后 `timestr` 函数会打印出格式合适的消息：\n\n```\nCalculation time: 1 wallclock sees (\
  \ 1.70 usr + -0.07 sys = 1.63 CPU) @ 6134969.33/s (n=10000000)\n```\n\n或者，你可以计算任意一组语句的时间：\n\
  \n```\n$ta = new Benchmark; &render_object(); $tb = new Benchmark;\nprint \"Calculation\
  \ time: \", timestr(timediff($ta,$tb)), \"\\n\";\n```\n\n这两种解决方案的问题在于，它们要求你在获得任何有用数据之前修改脚本。虽然这不是一个大问题，但它增加了开发时间。分析器没有这个问题——你可以立即获取信息。\n\
  \n\n\n\n\n# 第 12 章：自动优化\n\n另一方面，这些技巧在你希望直接向用户提供信息，或者希望整体监控一系列语句时非常有用。性能分析器只处理函数，因此如果不将代码拆分成多个子程序（这当然会降低速度），就无法识别小段代码的时间信息。\n\
  \n### 使用编译器\n\n使用 Perl 编译器的明显解决方案是将脚本转换为独立的应用程序。理论上，这样做会使它们运行得更快，尽管并非总是如此。我们还可以使用与编译器相关的其他解决方案——实际上，编译器提供了一些工具，这些工具仅能提高开发速度，而不一定优化脚本本身的执行。\n\
  \nPerl 编译器是 Perl 发行版中相对较新的组成部分，并且仍被认为在很大程度上是实验性的。在 Perl 5.6 中，它得到了大量更新和改进，以至于编译器的大多数功能现在或多或少都能按预期工作。\n\
  \nPerl 编译器的工作原理是：获取 Perl 解析器/编译器生成的内部操作码树，然后将其以所需格式重新生成。此时，操作码树可以转换为多种不同格式，包括（如果需要）Perl\
  \ 源脚本的优化版本。\n\n在生成独立可执行文件时，操作码树会与一些基于 C 的包装代码一起嵌入到 C 源文件中。然后，可以使用标准 C 编译器（如 `gec`）编译该文件，以生成最终的可执行文件。由于源文件包含\
  \ Perl 源代码并链接到 Perl 解释器，因此我们得到了一个完全独立的应用程序。此外，由于 Perl 源代码是在正常的 Perl 解析和优化过程之后获取的，因此我们最终得到了原始脚本的已优化版本。\n\
  \n整个系统使用一系列后端模块工作，例如用于 C 源代码创建器的 `B::C`，或用于交叉引用后端的 `B::Xref`。在生成独立可执行文件时，你还可以使用\
  \ `perlec` 前端，它会为你完成转换和编译阶段。我们先来看看后端。\n\n### 后端\n\n编译器后端由两部分组成。`B` 模块实际上包含后端代码本身——这些模块将原始操作码树转换为多种不同格式。`O`\
  \ 模块则提供了一个友好的前端，使我们能够使用可用的后端。\n\n我们将从优化和调试的角度考察九个后端：`C`、`CC`、`Bytecode`、`Terse`、`Debug`、`Xref`、`Lint`、`Deparse`\
  \ 和 `ShowLex`。所有后端的工作方式基本相同。你在普通 Perl 解释器的命令行中调用 `O` 模块，然后指定后端以及你想要定义的任何选项：\n\n\
  ```\n$ perl -MO=Backend[,OPTIONS] foo.pl\n```\n\n大多数后端支持三个选项。`-v` 选项强制后端报告关于编译过程的详细信息。`-D`\
  \ 选项启用调试——不同的后端支持多种不同的调试选项，因此请查看各个后端以获取有关如何使用这些选项的更多信息。`-o` 选项（后跟文件名）将后端的输出重定向到另一个文件。前端的多个选项可以用逗号分隔。\n\
  \n### C 后端\n\nC 后端是将 Perl 脚本转换为其等效 C 操作码的基本部分。该后端基于 Perl 脚本在开始执行之前的状态生成代码；也就是说，解释器通常进行的编译、解析和优化过程已经完成。因此，编译后的程序可以或多或少地与原始解释版本相同地执行。不幸的是，这个过程也意味着执行速度是相同的。\n\
  \n与 CC 后端共享的基本选项如表 12-2 所示。还有多个特定于 C 后端的选项，如表 12-3 所示。\n\n**表 12.2 基本 C 后端选项**\n\
  \n| 选项 | 描述 |\n|------|------|\n| 选项结束。 | |\n| `-uPackname` | 包含在 `Packname` 中定义的函数，如果它们尚未被选中则进行编译。通常，只有被识别为正在使用的函数才会包含在操作码树中。未使用的函数会被忽略。使用此选项允许通过\
  \ `eval` 使用的函数与 Perl 脚本的其余部分一起编译。显然，这也会增加创建的源代码大小以及最终可执行文件的大小。 |\n\n例如，以下命令将 `foo.pl`\
  \ Perl 脚本的 C 源代码创建到文件 `foo.c`，并启用优化：\n\n```\n$ perl -MO=C,-01,-ofoo.c foo.pl\n```\n\
  \n然后，你可以使用任何 C 编译器编译 `foo.c` 程序，记得链接到 Perl 库以生成最终的可执行文件。使用 `perlcc` 前端处理整个过程更快更简单，它不仅会生成源代码，还会为你编译文件。\n\
  \n### CC 后端\n\nCC 后端生成与运行时执行树等效的 C 代码。这实际上就像编写脚本将要执行的方式一样。优化和缩减阶段已经完成，从而实现了更好的性能。有关编译和优化\
  \ Perl 脚本期间发生的优化类型的示例，请参见第 2 章。\n\n**表 12.3 专门用于 C 后端的选项**\n\n| 选项 | 描述 |\n|------|------|\n\
  | `-On` | 将优化级别设置为 `n` 的值。值为 1 或更高时设置 `-fcog`。 |\n\n目前，编译器仍然直接处理脚本的原始字节码。这仍然没有达到应有的效率——例如，在\
  \ Perl 脚本中使用整数时，我们实际上仍然处理 Perl 标量变量对象，而不是直接使用真正的 C 整数，这显然会影响性能。\n\nCC 后端支持与表 12-3\
  \ 中所示的 C 后端相同的基本选项。CC 特有的选项如表 12-4 所示。\n\n例如，要将 `foo.pl` Perl 脚本的 C 源代码创建到文件 `foo.c`：\n\
  \n```\n$ perl -MO=CC,-ofoo.c foo.pl\n```\n\n同样，最好使用 `perlcc` 前端（我们稍后将介绍）来生成并将你的脚本编译成可执行格式。\n\
  \n**表 12.4 专门用于 CC 后端的选项**\n\n| 选项 | 描述 |\n|------|------|\n| （无） | |\n\n### 字节码后端\n\
  \n我们可以通过存储正常解析和优化阶段生成的字节码，来生成 Perl 脚本的永久优化版本。这样，当我们执行生成的字节码时，我们已经完成了解析/优化过程，从而节省了一些时间。这是像\
  \ `mod_perl` 和 `PerlEx` 这样的 Web 加速器提供的解决方案；它们存储编译后的版本，并使用已加载的解释器执行它。\n\n生成脚本字节码版本的最简单接口是使用带有\
  \ `-b` 选项的 `perlcc`：\n\n```\n$ perlcc -b foo.pl\n```\n\n这将生成一个文件 `foo.plc`，它实际上是一个可运行的\
  \ Perl 脚本。它包含字节码和 `ByteLoader` 模块，该模块为你读取并执行字节码。生成的文件是平台无关的——它本质上仍然是一个 Perl 源文件，只是处于编译状态而非原始状态。要执行它，只需像平常一样运行脚本：\n\
  \n```\n$ perl foo.plc\n```\n\n或者，你可以直接使用后端生成字节码文件，而不包含 `ByteLoader` 前言：\n\n```\n\
  $ perl -MO=Bytecode,-ofoo.be foo.pl\n```\n\n请注意，默认情况下字节码文件会发送到 `STDOUT`，这很可能会扰乱你的终端。你应该始终使用\
  \ `-ofilename` 选项指定一个替代文件来存储编译后的程序。其他选项列在表 12-5 中。\n\n\n\n\n\n### 表 12.5 专用于字节码后端的选项\n\
  \n## 第 12 章：自动优化 285\n\n**选项** | **描述**\n--- | ---\n`-f-strip-syntax-tree` | 不生成构成语法树的内部指针。这不会影响执行，但生成的字节码无法反汇编。这会导致`goto\
  \ LABEL`语句失效。同时，这也是一种合适的安全措施，可防止对字节码编译的脚本进行逆向工程。可通过`-fno-strip-syntax-tree`关闭。\n\
  `-On` | 将优化级别设置为`n`。目前，`-Ol`隐含`-fcompress-nullops`和`-fomit-sequence numbers`。`-06`隐含`-fstrip-syntax-tree`。\n\
  \n### 表 12.5 专用于字节码后端的选项（续）\n\n### Terse 后端\n\n当你想要以操作码编译格式检查脚本的确切执行路径时，Terse 后端非常有用。顾名思义，输出的信息非常简洁，但它应该能让你对脚本执行时发生的过程有一个基本了解。默认情况下，信息会按语法顺序格式化并打印，例如：\n\
  \n```\n$ perl -MO=Terse -e '$a = $b + 2;' -e syntax OK\nLISTOP (0xl3c530) pp_leave\n\
  OP (0xl349a0) pp_enter\nCOP (0xl3c5f0) pp_nextstate\nBINOP (0xl435a0) pp_sassign\n\
  \    BINOP (0xl2eb40) pp_add [1]\n        UNOP (0xl2eb00) pp_null [15]\n       \
  \     GVOP (Oxl2eaeO) pp_gvsv GV (0xc9864) *b\n            SVOP (0xl435c0) pp_const\
  \ IV (0xbc9d8) 2\n        UNOP (0xbf6c0) pp_null [15]\n            GVOP (0xbf660)\
  \ pp_gvsv GV (0xc6ba0) *a\n```\n\n该后端只支持一个选项`exec`，它按执行顺序输出操作码。不幸的是，这会移除默认模式下的大部分格式：\n\
  \n```\n$ perl -MO=Terse,exec -e '$a = $b + 2;'\n-e syntax OK\nOP (0xl349a0) pp_enter\n\
  COP (0xl3c5f0) pp_nextstate\nGVOP (0xl2eae0) pp_gvsv GV (0xc9864) *b\nSVOP (0xl435c0)\
  \ pp_const IV (0xbc9d8) 2\nBINOP (0xl2eb4 0) pp_add [1]\nGVOP (0xbf660) pp_gvsv\
  \ GV (0xc6ba0) *a\nBINOP (0xl435a0) pp_sassign\n```\n\n### Debug 后端\n\n如果你需要比 Terse\
  \ 后端更详细的操作码执行视图，可以使用 Debug 后端。它的工作方式类似，但提供更详细的信息。默认情况下，信息按语法顺序输出：\n\n```\n$ perl\
  \ -MO=Debug -e '$a = $b + 2;'\n-e syntax OK\nLISTOP (0x133530)\n    OP (0x15\n \
  \   COP (Oxc\n```\n\n为简洁起见，上述输出已被截断。这个简单语句的完整列表长达 173 行！\n\n与 Terse 后端一样，Debug 也支持按执行顺序输出，但同样会丢失格式：\n\
  \n```\n$ perl -MO=Debug,exec -e '$a = $b + 2;' | more\n-e syntax OK\nOP (0xl51bf8)\n\
  \    COP (OxcfldO)\n        op_next         0xl2eae0\n        op_sibling      0xl41dc0\n\
  \        op_ppaddr       pp_nextstate\n        op_targ         0\n        op_type\
  \         173\n        op_seq          7059\n        op_flags        1\n       \
  \ op_private      0\n        cop_label       0xbc87c\n        cop_stash       0xbca5\n\
  \        cop_filegv      0\n        cop_seq         7059\n        cop_arybase  \
  \   0\n        cop_line        1\n```\n\n这里提供的信息可能只对研究脚本内部操作码的人有实际用处。\n\n### Xref\
  \ 后端\n\n在使用 Perl 开发项目时，有时会“只见树木不见森林”。寻找那个难以捉摸的函数定义，或者试图找到某个特定函数的使用位置，可能是一个耗时的过程。当然，我们可以使用调试器，甚至`grep`，但有一种更简单的方法，它还能生成一份有用的文档，我们可以将其与\
  \ Perl 源代码一起保存，供将来参考。\n\nXref 后端会生成一份报告，详细说明程序中所有变量、子程序和格式的使用情况。报告包含交叉引用（包括行号），指示变量在何处使用、哪个子程序使用了哪个变量，以及其他有价值的交叉引用细节。\n\
  \n详细程度不仅包括原始文件中的子程序和变量，还包括原始脚本所依赖的所有模块和文件。这意味着即使是一个相对较短的脚本也可能产生大量信息。报告的格式如下：\n\n\
  ```\n文件 文件名 1\n    子程序 子程序名 1\n        包 包名 1\n            对象 1 C<行号>\n        \
  \    对象 2 C<行号>\n```\n\n以下是一个五行的脚本示例，它打印一个 DBM 文件的内容：\n\n```\n文件 dbmdump.pl\n  \
  \  子程序 (定义)\n        包 UNIVERSAL\n            &VERSION sO\n            &can sO\n\
  \            &isa sO\n    子程序 (main)\n        包 main\n            $ ! 11\n     \
  \       $0 3, 11\n            $datafile 7\n            $df i5, 11, 11\n        \
  \    $key 15, 15\n            %db 11, 13, 15, 17\n            &0_RDONLY &11\n  \
  \          *key 13\n            @ARGV 3\n```\n\n为简洁起见，输出已被截断；完整报告长达 246 行。\n\n如果你试图优化原始源代码或找出哪些函数依赖于某些变量，这些信息可能非常宝贵。通常，这些信息可以通过使用内部调试器或使用第\
  \ 10 章中概述的调试方法之一获得。然而，在某些情况下，交叉引用报告更快，并且它提供了有助于追踪其他错误的辅助信息。\n\n该函数只支持两个选项：`-r`和`-D`。`-r`选项生成原始输出。与上面显示的格式化版本不同，每个函数、包或变量的定义或使用都会打印一行。以下是用于生成上述报告的同一脚本的一个片段：\n\
  \n```\n我已从前面的示例中剥离了完整路径名，并再次为节省篇幅进行了截断。除此之外，这与生成的输出完全相同。各列依次为：文件、完整包名（包括通过 AutoLoad\
  \ 引入的函数的引用）、行号、短包名、对象类型、对象名称以及它在指定行中的使用方式。生成的信息量相当大。使用合适的 Perl 脚本，应该可以将信息总结为更易读的形式，例如通过有选择地排除那些你不感兴趣的模块。我将把这个练习留给读者。\n\
  ```\n\n`-D`选项支持两个子调试标志，这两个标志最好与`-r`选项结合使用。使用`-Dt`，会在跟踪对象时打印对象栈顶的对象，从而允许你追踪对象在每个包中被解析的过程。`-DO`函数会在交叉引用过程中处理每个操作符时将其打印出来。\n\
  \n请记住，从提供的数据中获取的大部分信息也可以通过更传统的调试方法获得。同样，也有一部分信息只能通过此后端获得。\n\n### Lint 后端\n\n在许多\
  \ C 环境中，有一个名为`lint`的程序，它检查 C 源代码中的解析错误，包括那些 C 编译器通常可能不会捕获的错误。Lint 后端是 Perl 的一个类似模块。它可以捕获许多即使开启了警告，Perl\
  \ 解释器也可能无法识别的错误。\n\n从表 12-6 所示的选项中，你可以看到 Lint 试图识别的错误。\n\n### 表 12.6 Lint 后端的选项\n\
  \n使用此模块并非旨在替代`-w`命令行选项或`use strict`编译指示（更多信息请参见第 8 章）。它补充了可用于查找潜在性能和/或解析问题的选项。\n\
  \n### Deparse 后端\n\n我们已经看到了一些 Deparse 引擎的例子。它接收一个脚本，并以优化后的形式重新输出，但与字节码后端不同，重新输出的脚本是源代码格式。这意味着我们可以使用\
  \ Deparse 引擎以源代码格式了解 Perl 解释器认为它在执行什么，而不是你编写了什么。在调试和优化代码时，它可以挑出以下内容：\n\n- 可以被折叠或优化掉的语句和表达式\n\
  \n\n\n\n• 模棱两可的语句，以及 Perl 如何解释它们  \n• 未考虑优先级规则的错误表达式  \n\n`Deparse` 后端的具体选项如表 12-7\
  \ 所示。  \n\n![picture24](img/picture24.jpg)  \n\n| 选项 | 描述 |\n|------|------|\n|\
  \ `-p` | 打印那些本会被优化掉的额外括号。在源代码中，许多括号可以被忽略（或隐含）。例如，函数参数周围不一定需要括号。此选项确保所有隐含括号的位置都被实际打印出来。当你想要了解\
  \ Perl 如何解释语句中隐含的括号时，这会很有用。（更多信息请参见下面的示例。）Perl 会化简掉任何常量值，这些值在输出结果中会显示为 `???`。 |\n\
  | `-uPACKAGE` | 包含来自 `PACKAGE` 的、未被直接调用的子程序（即由 `AutoLoad` 加载的，或在运行时未解析为子程序的子程序）。通常这些子程序在解析输出中被忽略。\
  \ |\n| `-1` | 根据源代码行和文件位置，向输出中添加 `#line` 声明。 |\n| `-sC` | “紧贴” `elsif`、`else` 和\
  \ `continue` 块，例如 `if 0 { } else { }` 将打印为 `if 0 { } else { }`。 |\n\n表 12.7 Deparse\
  \ 后端的选项  \n\n第 12 章：自动优化 291  \n\n括号选项有助于揭示 Perl 使用的运算符优先级。例如，下面是一个 Deparse 后的计算：\
  \  \n\n```\n$ perl -MO=Deparse,-p --e syntax OK ($a + ( ( ($b * $c) / $d) % $e)\
  \ ) ;\n```\n\n有关运算符及其优先级的列表，请参见第 2 章。  \n\n## Showlex 后端  \n\n`Showlex` 后端显示子程序或文件使用的词法变量（由\
  \ `my` 而非 `local` 定义的变量）。后端的任何选项都被视为要汇总其词法变量列表的子程序名称。  \n\n例如，要汇总 `uplsite.pl` 脚本中的词法变量：\
  \  \n\n```\n$ perl -MO=Showlex uplsite.pl\nPad of lexical names for comppadlist\
  \ has 30 entries\n0: PV (0x810af00) \"@\"\n1: PVNV (0x83...) \"$debug\"\n2: PVNV\
  \ (0x83...) \"$remserver\"\n3: PVNV (0x83...) \"$remport\"\n4: PVNV (0x83...) \"\
  $user\"\n5: PVNV (0x83...) \"$password\"\n6: PVNV (0x83...) \"$dir\"\n7: PVNV (0x83...)\
  \ \"$localdir\"\n8: PVNV (0x83...) \"$curxfermode\"\n9: SPECIAL #1 &PL_sv_undef\n\
  10: SPECIAL #1 &PL_sv_undef\n11: SPECIAL #1 &PL_sv_undef\n12: SPECIAL #1 &PL_sv_undef\n\
  13: SPECIAL #1 &PL_sv_undef\n14: SPECIAL #1 &PL_sv_undef\n15: SPECIAL #1 &PL_sv_undef\n\
  16: SPECIAL #1 &PL_sv_undef\n17: SPECIAL #1 &PL_sv_undef\n18: SPECIAL #1 &PL_sv_undef\n\
  19: SPECIAL #1 &PL_sv_undef\n20: SPECIAL #1 &PL_sv_undef\n21: SPECIAL #1 &PL_sv_undef\n\
  22: SPECIAL #1 &PL_sv_undef\n23: SPECIAL #1 &PL_sv_undef\n24: SPECIAL #1 &PL_sv_undef\n\
  25: SPECIAL #1 &PL_sv_undef\n26: SPECIAL #1 &PL_sv_undef\n27: SPECIAL #1 &PL_sv_undef\n\
  28: SPECIAL #1 &PL_sv_undef\n29: PVNV (0x833al54) \"$currentdir\"\netc/mcslp/books/paa/ch07/uplsite.pi\
  \ syntax OK\n```\n\n## perlcc 前端  \n\n将 Perl 脚本编译为最终可执行文件的主要方法是 `perlcc` 脚本。它接受许多控制生成过程的命令行选项。它还自动化了从生成\
  \ C 源代码到编译和链接阶段的整个过程。在最简单的用法中，命令  \n\n```\n$ perlcc foo.pl\n```\n\n会将 `foo.pl` 脚本编译为可执行文件\
  \ `foo`。  \n\n将脚本转换为独立可执行文件时，该过程假定你已安装 Perl 并且系统上有 C 编译器。`perlcc` 脚本（用 Perl 编写）应考虑到\
  \ Perl 安装的具体文件位置以及构建所需的工具。  \n\n**注意：** 编译器目前不支持 Windows 或 MacOS。在 Windows 下，你可以使用\
  \ ActiveState 提供的 Perl 开发工具包中的 `PerlApp` 扩展，将应用程序转换为独立可执行文件。  \n\n`perlcc` 前端支持许多命令行参数。这些参数控制将\
  \ Perl 源脚本转换为可执行程序的编译、代码生成和链接过程。大多数选项实际上会传递给底层的后端模块。命令行选项还控制用于构建最终可执行文件的编译器和链接器的调用。某些选项简化了编译由多个\
  \ Perl 脚本和模块组成的大型程序的过程，以及将多个脚本编译为多个可执行文件的过程。  \n\n### 使用 perlcc  \n\n使用 `perlcc`\
  \ 的基本方法是在命令行上提供脚本名称：  \n\n```\n$ perlcc foo.pl\n```\n\n这样做会将 `foo.pl` 转换并编译为可直接运行的可执行文件\
  \ `foo`。请注意，由于它转换并编译了脚本的完整版本（包括任何导入的模块），我们不需要其他选项。它会确定任何所需的模块、扩展或库，并将扩展合并到可执行文件中，或提供必要的钩子以便加载动态库。\
  \  \n\n如果你提供一个 Perl 模块，它会被转换为一个共享库，你可以直接在 Perl 中使用 `use Module` 来使用它：  \n\n```\n\
  $ perlcc Bar.pm\n```\n\n这会生成库 `Bar.so`。  \n\n第 12 章：自动优化 293  \n\n最后，你可以使用 `-b`\
  \ 选项生成独立的字节码脚本：  \n\n```\n$ perlcc -b foo.pl\n```\n\n这会生成 `foo.plc`，可直接通过 Perl 运行。\
  \  \n\n### 命令行参数  \n\n前端还支持许多附加参数，用于控制编译过程的不同方面。下面列出以供参考。  \n\n- `-L DIRS`  \n \
  \ 将 `DIRS` 中指定的目录添加到 C/C++ 编译器。每个目录应用冒号分隔。  \n\n- `-I DIRS`  \n  将 `DIRS` 中指定的目录添加到\
  \ C/C++ 编译器。每个目录应用冒号分隔。  \n\n- `-C FILENAME`  \n  将生成的 C 代码命名为 `FILENAME` 指定的文件名。仅适用于编译单个源脚本。\
  \  \n\n- `-o FILENAME`  \n  将生成的可执行文件命名为 `FILENAME` 指定的文件名。仅适用于编译单个源脚本。  \n\n- `-e\
  \ LINE`  \n  与 Perl 的 `-e` 选项相同。将 `LINE` 编译为单行 Perl 脚本。默认操作是编译然后执行该单行脚本。如果你想保存生成的可执行文件，请使用\
  \ `-o` 标志。  \n\n- `-regex NAME`  \n  `NAME` 应指定一个正则表达式，用于将多个源文件编译为多个可执行文件。例如，命令\
  \  \n\n  ```\n  $ perlcc -regex 's/\\.pl/\\.bin/' foo.pl bar.pl\n  ```\n\n  会创建两个可执行文件：`foo.bin`\
  \ 和 `bar.bin`。  \n\n- `-verbose LEVEL`  \n  将编译过程的详细程度设置为 `LEVEL` 指定的级别。该级别应为数字或字母字符串形式。除非通过\
  \ `-log` 选项指定，否则信息会发送到 `STDERR`。可用的级别见表 12-8。  \n\n表 12.8 `perlcc` 命令的详细级别  \n\n\
  例如，要设置最大详细级别，你可以使用  \n\n```\n$ perlcc -v 63 -log foo.out foo.pl\n```\n\n请注意，某些选项需要通过\
  \ `-log` 选项提供合适的文件名（详见下文）。如果已给出 `-log` 标签但未指定具体详细级别，脚本会假定详细级别为 63。如果未指定详细级别或日志文件，则隐含级别为\
  \ 7。  \n\n- `-log NAME`  \n  将编译进度记录到文件 `NAME` 中。请注意，信息会追加到文件中；在添加更多信息之前不会截断文件内容。此选项的效果是使整个编译过程静默——所有输出都重定向到指定文件。\
  \  \n\n- `-argv ARGS`  \n\n\n\n\n\n必须与 `-run` 或 `-e` 选项一起使用。该选项会使 `@ARGV` 的值被填充为\
  \ `ARGS` 的内容。如果要指定多个参数，请使用单引号，并用空格分隔每个参数。\n\n`-sav`\n\n编译过程中生成的中间 C 源代码会保存到一个文件中，该文件名与源文件相同，并附加\
  \ `\".c\"`。\n\n`-gen`\n\n指示 `perlcc` 仅生成 C 源代码——该文件不会被编译成可执行文件。\n\n`-run`\n\n立即运行生成的可执行文件。`perlcc`\
  \ 的其余参数将作为命令行参数提供给可执行文件。\n\n`-prog`\n\n指定所有提供的文件都是程序。该选项会使 Perl 忽略通常的解释，即 `.pm`\
  \ 文件实际上是模块，而不是脚本。\n\n`-mod`\n\n指定文件应作为模块编译，而不是脚本。该选项会覆盖通常的解释，即 `.p`、`.pi` 和 `.bat`\
  \ 结尾的文件是 Perl 脚本。\n\n### 环境变量\n\n你可以使用环境变量更改 `perlcc` 进程的某些隐含逻辑。这些修改会影响所有编译，除非你使用命令行参数覆盖新的默认值。\n\
  \n`PERL_SCRIPT_EXT` 变量包含一个由冒号分隔的正则表达式列表。这些定义了 `perlcc` 自动识别为脚本的扩展名。例如，默认值为\n\n```\n\
  PERL_SCRIPT_EXT = '.p$:.pl$:.bat$•;\n```\n\n注意使用 `$` 来定义扩展名应位于文件名的末尾。\n\n`PERL_MODULE_EXT`\
  \ 以相同的方式工作，仅针对那些应被识别为模块的文件。默认值为 `.pm$`。\n\n在编译过程中，`perlcc` 模块会创建多个临时文件。所有这些文件的名称都基于\
  \ `$$` Perl 变量的值，该变量引用当前进程 ID。因此，`-e` 选项的临时文件是 `perlc$$.p`，临时 C 代码的文件是 `perlc$$.p.c`，临时可执行文件存储在\
  \ `perlc$$` 中。\n\n### 解释代码与编译代码之间的差异\n\n由于生成 Perl 脚本可执行版本所使用的方法，解释代码与编译代码之间存在细微差异。大多数情况下，这些错误与编译过程的行为有关，并且随着时间的推移，应该能够修改它们，使得同一脚本的编译版本和解释版本运行一致。不幸的是，其他错误直接与编译器的运行方式相关，并且这些错误不太可能被更改。目前已知的差异列表如下：\n\
  \n- 编译后的 Perl 脚本在编译时计算 `next`、`last` 和 `redo` 循环控制语句的目标。通常这些值由解释器在运行时确定。\n- Perl\
  \ 将 `..` 运算符解释为范围运算符还是翻转触发器运算符的决定通常是在运行时根据当前上下文做出的。在编译程序中，该决定在编译时做出，可能会产生意外结果。\n\
  - 编译后的 Perl 脚本使用原生 C 算术，而不是解释脚本中使用的基于操作码的常规算术。这不会造成太多问题（实际上，它使事情更快），但可能会影响大数的计算，尤其是在数值范围的边界处。\n\
  - 编译器未实现 Perl 的许多已弃用功能。\n\n### 比较脚本与可执行文件的速度\n\n许多因素会影响典型程序的执行速度。显然，你运行的平台会产生影响，包括程序运行时的内存、硬盘和其他应用程序需求。在考虑\
  \ Perl 脚本时，执行过程会有额外的开销。\n\n对于 C 程序，执行程序的时间可以分为三个部分：\n\n- 加载程序的时间，包括任何动态加载库的时间。\n\
  - 执行任何用户定义组件的时间。\n- 执行任何系统函数的时间。这些包括对操作系统本身的任何访问（例如文件和网络套接字）以及对内存系统的任何访问。根据实现，你还可以将库加载时间添加到该数字中。\n\
  \n对于解释执行的 Perl 脚本，列表更长，因此，即使是一个非常简单的语句，等效过程也应该花费更长的时间：\n\n- 加载 Perl 解释器的时间。\n- Perl\
  \ 加载 Perl 脚本的时间。\n- Perl 解释器解析脚本并将其转换为操作码树所花费的时间。\n- 执行 Perl 操作码树的时间。\n- 执行任何系统函数的时间。\n\
  \n显然，理论上 Perl 应该比用 C 编写的同一程序的编译版本慢得多。当 Perl 脚本被编译成二进制可执行文件时，可以移除上述两个元素。脚本已经是二进制可执行文件的格式；你只需要加载二进制文件并执行它。这就是速度优势变得明显的地方。\n\
  \n在比较时间时，你需要比较以下操作：\n\n- 编译 C 程序所需的时间。\n- 执行 C 程序所需的时间。\n- 执行解释型 Perl 脚本所需的时间。\n\
  - 将 Perl 脚本编译成二进制文件所需的时间。\n- 执行 Perl 二进制文件所需的时间。\n\n同时考虑以下总体时间也是值得的：\n\n- 编译 C 程序，然后执行它\
  \ 100 次。\n- 使用解释器执行 Perl 脚本 100 次。\n- 将 Perl 脚本编译成二进制文件，然后执行它 100 次。\n\n这些数字将显示\
  \ C 程序、解释型 Perl 和编译型 Perl 之间的总执行时间差异。请记住，当 Perl 脚本被解释时，它必须在执行之前进行编译，这需要一定的时间。\n\n\
  通常使用编译二进制文件的原因是为了提高执行速度。通过检查运行脚本 100 次的合计时间，你应该能大致了解可以预期的速度提升。显然，脚本很可能被运行超过 100\
  \ 次，但同样的计算可以应用于任何执行次数。\n\n### 测试\n\n我们将比较三个基本程序。第一个程序对特定迭代次数的递增数字执行重复计算。这测试了计算和循环的相对速度，我们已经知道这在\
  \ Perl 中比在编译的 C 程序中慢。以下是测试中使用的 C 版本：\n\n```c\n#include <math.h>\n\nint main() {\n\
  \    int i ;\n    for(i=0;i<10000;i++) {\n        sqrt(abs(sin(i)+cos (i))) ;\n\
  \    }\n}\n```\n\n下面的代码显示了 Perl 版本。请注意，它要简洁得多；这展示了用 Perl 编写程序的简洁性。你无需担心 C 等效版本所需的任何初始化。还要注意，除此之外，两个版本非常相似。\n\
  \n```perl\nfor(my $i=0;$i<10000;$i++) {\n    sqrt(abs(sin($i)+cos ($i))) ;\n}\n\
  ```\n\n下一个测试是一个简单的文本处理测试。我们将统计文档中的行数。该文档实际上是公共领域词典中所有以“a”开头的单词列表（原因将在下一个脚本中变得明显）。这测试了两种语言的基本\
  \ I/O。本质上，两者的性能应该大致相同，因为 Perl 会将过程优化为几乎相同的结构。\n\n```c\n#include <stdio.h>\n\nint\
  \ main() {\n    char *line; FILE *data ;\n    long count=0;\n    data = fopen(\"\
  wordlist\",\"rw\");\n    while(!feof(data)) {\n        fgets(line,255,data); count++;\n\
  \    }\n    printf(\"%d lines\\n\",count);\n}\n```\n\n\n\n\n\n下面展示了测试 2 的 Perl 版本。再次注意，整体结构基本相同，不过\
  \ Perl 的`<FH>`操作符使得读取信息更加容易。\n\n```\nopen(DATA,\"<wordlist\")\n\nwhile(<DATA>) {\n\
  \n$lines++;\n\n}\n\nclose(DATA);\n\nprint \"$lines lines\\n\";\n```\n\n最后一个测试是测试\
  \ 2 的进阶版。我们将从文件中读取单词，然后计算不重复行的数量。在 C 语言中，我们会使用一个存储在`words`数组中的简单关键字表。这个表将保存我们已经记录过的单词列表。为了判断单词是否已经出现过，我们只需将新单词与数组中的每个条目进行比较。这个过程缓慢且低效，但它是现有方法中代码行数最短的。我们本可以使用二叉树甚至哈希系统，但那样会为已经冗长的\
  \ C 程序增加大量代码行。\n\n## 第 12 章：自动优化 299\n\n```\n#include <stdio.h>\n\nchar words[32000]\
  \ [260]; long wordidx=0;\n\nvoid addtolist(char word[255]) {\n\nint i=0;\n\nfor(i=0;i<wordidx;i++)\
  \ {\n\nif (strcmp(word,words[i]) == 0) return;\n\n}\n\nstrcpy(words[++wordidx],word);\n\
  \n}\n\nint main()\n\n{\n\nchar line [255] ; FILE *data; long count=0;\n\ndata =\
  \ fopen(\"wordlist\",\"rw\");\n\nwhile(!feof(data) ) {\n\nfgets(line,255,data);\
  \ addtolist(line);\n\n}\n\nprintf(\"%ld unique lines\\n\",wordidx);\n\n}\n```\n\n\
  测试 3 的 Perl 脚本要短得多，但这仅仅是因为我们可以直接使用哈希，而不必使用单独的函数和循环来搜索数组。\n\n```\nopen(DATA,\"<wordlist\"\
  ) || die \"Can't open file\";\n\nmy %words;\n\nwhile(<DATA>) {\n\n$words{$_} = 1;\n\
  \n}\n\nClose(DATA);\n\nprint scalar keys %words,\" unique lines\\n\";\n```\n\n###\
  \ 结果总结\n\n每个测试运行三次，并使用 bash shell 标准的`times`命令来测试每个项目的执行情况。该命令计算每个命令的经过时间、用户时间和系统时间。显示的时间是程序加载、执行和退出所经过的时间。\n\
  \n测试显示，C 程序和 Perl 程序之间，以及 Perl 脚本的解释版本和编译版本之间，执行时间存在显著差异。时间如表 12-9 所示。\n\n### 表\
  \ 12.9 对比测试的汇总时间\n\n300 调试 Perl：程序员故障排除指南\n\n### 表 12.9 对比测试的汇总时间（续）\n\n这些数据说明了两个问题：第一，C\
  \ 程序与 Perl 脚本在执行时间上的差异；第二，Perl 脚本从解释执行到编译执行所带来的性能提升。为了进一步对比，表中还显示了执行 100 次 C 程序、解释型\
  \ Perl 和编译型 Perl 所需的时间。\n\n无论数值如何，都应该指出，这些是相当不成熟的基准测试，尽管它们确实展示了将 Perl 脚本编译为可执行文件的许多优势。同样值得记住的是，为什么将\
  \ Perl 脚本编译为二进制文件所需的时间非常长。创建 Perl 二进制文件不仅涉及将脚本编译为其原生 Perl 格式，还需要进行大量转换，使其成为可编译的\
  \ C 源代码。此外，它还需要链接到提供所有核心 Perl 函数和 Perl 解释器的 Perl 库。\n\n最明显的区别是从原始 C 程序到 Perl 版本的速度下降。对于脚本的解释版本，这种差异部分可以归因于将脚本编译为操作码、优化它以及执行操作码树所需的时间。然而，在第一个测试中，时间差异如此之大，以至于很明显问题在于\
  \ Perl 中的数学计算以及大循环。\n\nPerl 脚本的编译版本至少缩小了差距。这里的很大一部分开销可能与加载一个约 686K 的二进制文件有关，而 C\
  \ 版本只有 23K。Perl 二进制文件很大，因为我们使用了静态 Perl 库，而不是动态库。使用动态 Perl 库时，体积要小得多——大约 11K——但动态库中的许多函数也需要加载。\n\
  \n对于第二个测试，Perl 和 C 版本都非常快；程序非常简单，两个程序核心之间的差异可能非常小。最大的差异当然出现在最后一个测试中，Perl 版本明显比 C\
  \ 版本快。主要原因是我们在去重操作中“作弊”使用了哈希。在 C 源代码中，我们必须使用不同的方法来实现相同的结果。C 版本的源代码行数也长得多，而且这里使用的算法并不理想。如果我在\
  \ C 程序中编写了二叉树甚至哈希系统，那么两者在速度测试中的差异可能会更小。然而，在 C 程序中添加基于哈希的系统或二叉树系统会大大增加 C 程序的长度。\n\
  \n比较解释型 Perl 脚本执行 100 次与编译后再解释执行 100 次的数据更具说服力。你可以非常清楚地看到，执行编译后的 Perl 脚本比执行解释版本快得多。如果你打算将脚本安装到实时环境中（例如在网站上），并且该脚本可能被大量调用，那么这种差异就非常重要。\n\
  \n## 第 12 章：自动优化 301\n\n编译可执行文件的另一个好处是，你可以继续使用解释版本进行开发和测试，同时在实时环境中使用最终编译的生产版本。你可以保证解释版本和编译版本的工作方式完全相同，并且它们将保持相同的兼容性。它们甚至可以使用相同的配置和数据文件，无需任何修改。\n\
  \n这比使用 C 或其他每次测试功能或修复错误都需要单独编译的语言要高效得多。正如你在上一章中看到的，调试 Perl 程序时，你只需要更改源代码并重新运行解释器。而\
  \ C 程序在每次测试错误修复之间都需要重新编译和链接。\n\n作为进一步对比，假设测试 2 中的程序有 100 个错误，我们在每次修复之间重新编译程序。忽略编辑源代码的时间，C\
  \ 版本每次编译和执行需要 736 秒。Perl 版本需要 155.09 秒，包括最终编译为可执行二进制文件。这相当于效率提升了 475%！\n\n# 第五部分\n\
  \n测试你的代码\n\n![picture25](img/picture25.jpg)\n\n## 第 13 章\n\n测试方法\n\n![picture26](img/picture26.jpg)\n\
  \n306 调试 Perl：程序员故障排除指南\n\n如果专家们的话可信，那么在一个项目的总开发时间中，你应该只花 20%的时间来实际编写应用程序代码。另外 80%的时间应该用于在代码完成后测试代码，以确保其运行正常。但实际应该测试什么？测试应该进行到什么程度？\n\
  \n实际上，你应该对所有代码进行两个层次的测试：正常使用和压力使用。正常使用是指在正常条件下执行应用程序，即当提供应用程序通常预期接收的数据类型和数据量时。压力使用是指发生意外事件的情况，例如提供的数据量超出应用程序预期，或数据超出特定函数的限制。\n\
  \n\n\n\n\n在正常级别测试应用程序相当直接，应该能帮助你发现各种问题，你可以捕获这些问题（使用第 7 章中的技巧）或进行调整，使条件不会引发问题。对应用程序（或应用程序运行的系统）进行压力测试则更为困难，但它应该能让你的应用程序在你可能不愿意或无法处理的情况下更加稳定。它还有助于突出脚本中可能存在的安全问题。\n\
  \n以 CGI 脚本为例。最常见的安全入侵尝试之一是提供无效信息或提供过多信息，导致 CGI 脚本无法处理。如果你故意向脚本发送过多数据，你就能发现故障发生的位置和方式，并据此进行处理。仅用正常参数测试脚本是无法发现这个错误的。\n\
  \n本书大部分内容涉及捕获和调试代码的过程，但如果你正在开发商业产品，或者希望分发给客户或公众的代码，那么你需要以更彻底、更有条理的方式进行测试。\n\n在本章中，我们将重点讨论测试脚本不同元素的内容和方法。我们还将介绍\
  \ Perl 测试脚本的“标准”，以及帮助测试过程的`Test`和`Test::Harness`模块。\n\n### 测试工具的角色\n\n虽然我们将这部分内容放在了最后，但使用某种正式测试流程进行测试应该是任何项目持续进行的一部分。事实上，这正是调试的全部意义所在——追踪你在测试代码并发现问题时所遇到的故障。这里的大多数技术既适用于开发过程中，也适用于开发完成后，但也有一些理由需要构建一个独立于主要调试过程的独立测试套件。\n\
  \n尽管这可能不是最佳做法，但大多数程序员在开发应用程序时通常会经历以下典型流程：\n\n1. 编写代码功能。\n2. 测试功能的部分内容。\n3. 调试功能的部分内容（返回步骤\
  \ 1，直到应用程序完成）。\n4. 编写测试工具。\n\n第 13 章：测试方法 307\n\n实际情况是，大多数程序员并不遵循严格的开发结构，测试工具是应用程序最后的故障安全措施。在\
  \ Perl 开发中，对于模块和扩展，测试也是开发过程的最后阶段。\n\n因此，测试工具的角色是验证你的脚本/函数/模块是否按预期工作并符合你的宣传，而不是持续开发工作的一部分。这实际上非常实用——你可以将测试套件用于验证项目在迁移到不同平台或环境，或新版本\
  \ Perl 时是否正常。任何差异都可以在软件的下一个修订版中修复。\n\n### 测试策略\n\n我记得在大学时，导师告诉我们，大型商业系统的测试是通过在调用特定函数时提供所有可能的参数组合来进行的。这意味着所有可能性不仅被测试过，而且最终都被考虑到了。这种方法可能不切实际，即使对于一个简单的函数也是如此。考虑一个看似无害的函数：\n\
  \n```perl\nsub add {\n    return ($_[0] + $_[1]);\n}\n```\n\n如果我们想正确测试该函数，我们必须提供整数和浮点数范围内以及介于两者之间的每一个数值，以确保不会出现问题。而且我们必须对函数的两个参数都这样做——即使限制只有\
  \ 10,000，我们也必须进行 100,000,000 次计算才能确保它正常工作。\n\n当然，在实践中，我们不需要担心如此琐碎的事情。计算机并非万无一失，但可以相当肯定的是，两个数相加会正确工作，无需我们测试每一种组合。\n\
  \n然而，对于更复杂的函数，有一些操作和组合我们需要测试，并且有方法可以确定其极限。\n\n### 测试模块\n\n如果你使用`h2xs`工具构建模块模板，它会自动创建一个非常简单的测试脚本，你可以修改该脚本以包含针对模块的特定测试，以检查其是否正常工作。对于一个简单的\
  \ Perl 模块，你可能认为这有些过度，但请记住，如果你将代码发布给公众，该模块最终可能会在不同于你开发平台的平台上运行。对于实际使用 XS 扩展系统的模块，它还将提供一种方法来测试你的模块是否正确加载了必要的库，以及\
  \ Perl 到 C/C++代码接口是否正常工作。\n\n测试脚本还为你提供了一种让其他人在各种平台上测试模块的最佳方式。你应该能够利用该测试脚本的输出来帮助你将脚本迁移到新平台。\n\
  \n308 调试 Perl：程序员故障排除指南\n\n### 测试示例\n\n如果我们回头看看我们的`add`函数，我们应该能够发现一些在使用该函数时可能出现的问题。对于如此简单的东西，测试它似乎很愚蠢——但考虑以下调用：\n\
  \n```perl\nadd(1,2); 3\nadd(1000000000,300000000); 1300000000\nadd(-99,100); 1\n\
  add('Hello', 4); 4\nadd('Some', 'Numbers'); 0\nadd('4', '5'); 9\nadd(3,4,5,6,8);\
  \ 7\nadd(1); 1\nadd(); 0\n```\n\n这些函数调用中的每一个都可能存在问题，所以让我们逐一检查结果。我打开了警告，以突出执行过程中可能出现的一些问题：\n\
  \n`add(1,2); 3`\n\n这个工作正常，我们可以轻松测试此函数调用的返回值，以确保其正确运行。\n\n`add(1000000000,300000000);\
  \ 1300000000`\n\n这个也正常：\n\n`add(-99,100); 1`\n\n这个似乎也工作正常：`add('Hello',4);`\n\n\
  参数 \"Hello\" 在加法 (+) 中不是数字，位于 tl3.pl 第 3 行。 4\n\n这个显然不行，原因很明显：我们提供了一个字符串，而`+`运算符期望一个数字。警告告诉我们失败的原因，但返回值掩盖了函数实际失败的事实——因为我们看到了一个正值返回，简单的真/假测试会解析为真，检查值为\
  \ 4 也是如此。\n\n`add('Some', 'Numbers');`\n\n参数 \"Numbers\" 在加法 (+) 中不是数字，位于 tl3.pl\
  \ 第 3 行。 参数 \"Some\" 在加法 (+) 中不是数字，位于 tl3.pl 第 3 行。 0\n\n第 13 章：测试方法 309\n\n现在这个肯定会失败——我们提供了两个字符串参数，Perl\
  \ 无法将其转换为数值，因此函数返回了一个假（零）值。虽然这个会返回失败，但从返回值可以清楚地看出失败的原因。\n\n`add('4', '5'); 9`\n\n\
  这个工作正常，但仅仅因为我们提供了两个数字字符串，Perl 会自动为我们转换。\n\n`add(3,4,5,6,8); 7`\n\n这个也工作正常，因为前两个参数被正确相加了。然而，该函数完全忽略了其余参数。\n\
  \n`add(1);`\n\n在加法 (+) 中使用未初始化的值，位于 tl3.pl 第 3 行。 1\n\n这里缺少第二个参数引发了错误，但我们仍然得到了一个可能对我们没有帮助的返回值。\n\
  \n`add();`\n\n在加法 (+) 中使用未初始化的值，位于 tl3.pl 第 3 行。 在加法 (+) 中使用未初始化的值，位于 tl3.pl 第 3\
  \ 行。 0\n\n在最后一个例子中，我们没有向函数提供任何参数，这引发了两个错误和一个假结果，这可能会无意中指向一个实际上并不存在的问题。\n\n因此，在测试时，我们不仅需要考虑函数的预期操作，还需要考虑它返回的值。\n\
  \n### 编写合适的测试\n\n\n\n\n\n我们的第一个问题是编写一个合适的测试策略，以帮助突出这些问题。测试任何函数时实际上只有一条规则需要遵循：\n\n\
  - 检查返回值\n\n就是这么简单：你需要一个“对照物”，即一些预期的或手动计算的信息，用来与你将要测试的函数进行比较。\n\n我们上面进行的简单测试实际上已经揭示了函数本身的一些问题，我们需要意识到并准备好处理这些问题：\n\
  \n- 当提供文本参数时会发生什么？\n- 当提供超过两个参数时会发生什么？\n- 当提供少于两个参数时会发生什么？\n\n310 调试 Perl：程序员故障排除指南\n\
  \n对于第一种情况，我们只需添加一个过滤器，这样就不会添加文本参数。我们可以通过使用默认值零，并使用累加器将参数添加到最终返回值来解决第二和第三种参数的问题。如果没有提供任何参数，则返回零；如果提供了\
  \ 50 个参数，则函数返回所有 50 个参数的总和，当然前提是它们都是数字。最终函数如下所示：\n\n```perl\nsub add {\n\nmy $return\
  \ = 0; foreach my $value (@_) {\n\nnext unless ($value =~ m/^[-.\\d]+$/); $return\
  \ += $value;\n\n}\n\nreturn $return;\n\n}\n```\n\n这里重要的是要认识到，正是测试导致了函数的更改——如果我们没有提供这么多不同的参数组合，那么我们就永远不会发现最初导致函数设计更改的错误。\n\
  \n为了实际编写一套合适的测试，我们需要在测试函数调用中添加一些代码。Perl 使用“ok/not ok”文本来指示功能成功或失败，因此我们可以将测试序列更新为：\n\
  \n```perl\nprint ((add(1,2) == 3 ? '' : 'not '),\"ok\\n\");\nprint ((add(1000000000,300000000)\n\
  == 1300000000 ? '' : 'not '),\"ok\\n\") ;\nprint ((add(-99,100) == 1 ? '' : 'not\
  \ '),\"ok\\n\") ;\nprint ((add('Hello',4) == 4 ? '' : 'not '),\"ok\\n\") ;\nprint\
  \ ((add('Some','Numbers') == 0 ? '' : 'not '),\"ok\\n\");\nprint ((add('4','5')\
  \ == 9 ? '' : 'not '),\"ok\\n\") ;\nprint ((add(3,4,5,6,8) == 26 ? '' : 'not '),\"\
  ok\\n\") ;\nprint ((add(1) == 1 ? '' : 'not '),\"ok\\n\") ;\nprint ((add() == 0\
  \ ? '' : 'not '),\"ok\\n\") ;\n```\n\n如果我们结合对 `add` 子例程的更改来运行此代码，应该会得到：\n\nok ok\
  \ ok ok ok ok ok ok ok\n\n成功了！\n\n尽管这是一个非常简单的示例，但它确实演示了你计划引入的任何测试系统的基本原理。这应该突出表明，任何测试框架基本上都有两个要素：你测试的项和函数，以及测试时提供给函数的数据的限制和范围。\n\
  \n### 测试什么\n\n在我们之前的示例中，测试了三种不同的函数调用情况：\n\n- **正确的参数** 函数预期处理数值，因此我们提供了大小不同的值，以及从\
  \ 1 到 5 个不等的参数数量。\n- **错误的参数** 由于函数预期处理数值，我们还提供了一些错误的参数，以确保函数能够处理它们，要么通过提供警告或错误值，要么（如示例中）简单地忽略无效参数。\n\
  - **参数数量** 你不能总是保证函数会被提供正确数量的参数，你的脚本应该知道如何处理太少或太多的参数。\n\n你的测试脚本应遵循相同的规则；你需要向函数和脚本提供正确和错误的参数（参见本章后面的“限制和范围”），以及不同数量的参数。\n\
  \n### 正确的参数\n\n测试任何脚本或函数的最佳方法是向其提供它预期并能处理的数据，并将结果与你期望的值进行比较。例如，在我们的 `add` 函数中，我们知道\
  \ 1 加 1 应该等于 2。嗯，至少在这个宇宙中是如此。\n\n### 错误的参数\n\n你应该使用错误的参数——即函数或脚本不期望的参数——以便检查它是否能够优雅地从这种情况中恢复。例如，在编写解析文件的脚本时，提供一个你知道不存在的文件名。如果你要写入文件，则提供一个无法被覆盖的文件名。\n\
  \n### 参数数量\n\n你还应该测试你提供的参数数量，无论是针对整个脚本还是单个函数。这将让你知道涉及的脚本或函数是否具备正确处理情况的能力。你也可以使用此测试来检查已知的组合。这里很好的例子是切换不同选项的命令行参数——确保无论你只提供\
  \ 1 个还是 20 个参数，所有参数都能被解析。\n\n### 限制和范围\n\n尽管之前我暗示检查所有可能的组合被认为是测试的最佳方式，但在实践中这是不可能的。对于我们的示例子例程，我们需要运行该函数\
  \ 1.84E19 次——超过 100,000 万亿次迭代。即使在快速的机器上，这也需要数月才能完成。\n\n312 调试 Perl：程序员故障排除指南\n\n\
  当你开始考虑字符串，或者更糟糕的是列表和哈希时，情况会变得更加复杂。在这些情况下，即使考虑生成所有可能的组合也是不切实际的，更不用说实际测试一个使用这些信息以确保没有问题的函数了。\n\
  \n相反，你应该采用的方法是考虑测试你提供给函数的参数的限制和不同组合。例如，对于我们的测试函数，我们检查了一些小值、大值以及一些非数值。我们还提供了比最初可能处理的更多和更少的参数。在每种情况下，思路都是测试限制，而不是所有可能的排列。同样的通用规则应适用于所有函数。\n\
  \n#### 整数和浮点数据\n\n测试整数和浮点信息实际上只是提供一些简单值的情况。对于数值，你应该检查：\n\n- **下限** 大多数情况下，这将是零，但也要考虑检查负值，特别是对于只处理正值的函数（想想像内置\
  \ `split` 函数的第三个参数这样的实例）。检查接近甚至可能超出你认为函数能处理的限制的值。\n- **上限** 检查接近并超出函数应能处理的上限的值。尽量不要考虑\
  \ Perl 或你正在使用的平台的物理限制，而是考虑函数的潜在限制。例如，如果你正在测试一个处理 `/etc/passwd` 条目的函数，那么超过 70,000\
  \ 就没有什么意义——大多数系统只处理 65536 个值。\n- **中间值** 仅仅因为函数能处理上限和下限，并不意味着中间不会出现问题，因此检查一些看似无害的中间范围数字。\n\
  - **零** 很容易忘记零也是一个数字，你的脚本可能没有设置好来处理这样一个无害的值。\n\n#### 字符串和文本数据\n\n对于字符串，你面临更困难的决定。你不能测试限制，因为至少在理论上，Perl\
  \ 中的字符串没有限制。然而，你可以从脚本期望的角度来测试字符串。如果你编写了一个解析某些信息的脚本，那么在测试期间就提供这些信息。\n\n同样，值得提供一个你知道会成功的和一个你知道会失败的——你的脚本或函数应该能够相对优雅地处理这两种情况。\n\
  \n因此，我们可以将列表总结为：\n\n- 应该正确解析的数据\n\n\n\n\n\n- 不应正确解析的数据\n- 空字符串或文本\n- `undefined`\
  \ 值\n\n# 第 13 章：测试方法 313\n\n### 数组和哈希\n\n这里的规则与字符串相同——你提供的数组或哈希中包含的信息本质上与应用相关，因此没有硬性规定。但我们可以将应测试的类别总结为：\n\
  \n- 应正确解析的数据\n- 不应正确解析的数据\n- 空数组/列表/哈希\n\n请记住，你不仅要测试脚本是否按预期工作，还要测试它能否处理问题——而列表和哈希可能是许多不同问题的根源。\n\
  \n### 引用\n\n如果你使用引用来交换信息，那么首先应检查这些引用是否正确填充，其次检查它们是否为正确的类型。使用简单的 `ref` 调用可以告诉你返回的信息类型是否正确。\n\
  \n### 生成原始信息\n\n对于某些脚本和实例，你需要生成一些原始数据，作为脚本处理的数据源。这里没有硬性规定，但请确保生成的数据既足够多样化，又数量合理。使用重复\
  \ 10 个相同项的数据文件不是一个好的测试。同样，只有 10 条记录的文件也不太可能是一个好的测试。\n\n你应该根据源中的字段或元素数量来确定文件的大小。我倾向于生成记录数量为字段数量\
  \ 100 倍的文件。例如，如果你正在测试一个网络日志分析器，大约应有 700 条记录，并且我建议每个字段至少有 10 种变化。\n\n### 构建测试工具\n\
  \n到现在为止，你应该已经知道应该测试哪些内容，以及测试的限度和范围。现在你需要构建一个脚本或系统，以便测试应用程序的不同元素。这些脚本将构成程序的“测试工具”。该工具应测试并报告这些测试的状态。测试工具充当一个外部网络，捕获你的测试工具旨在突出的错误。\n\
  \n经过多年的开发，Perl 开发团队完善了一个测试系统，该系统不仅用于在编译期间测试 Perl 解释器本身，还用于测试 Perl 脚本和模块。Perl 的测试系统通过检查特定操作的结果，然后报告该操作是\
  \ `\"ok\"` 还是 `\"not ok\"` 来工作。\n\n314 调试 Perl：程序员故障排除指南\n\n这里的 `\"ok\"` 很重要——如果你运行\
  \ Perl 附带的测试脚本之一（这里我使用了 `base/cond.t`），你会得到：\n\n```\n1..4\nok 1\nok 2\nok 3\nok\
  \ 4\n```\n\n`1..4` 表示测试编号范围，每个 `\"ok\"` 表示成功完成的测试编号。如果发生错误，则会打印 `\"not ok\"`。\n\n\
  同样的基本原则也适用于开发新 Perl 模块时由 `h2xs` 生成的测试脚本，该脚本构建了一个包含以下可执行代码的模板测试脚本：\n\n```\nBEGIN\
  \ { $| = 1; print \"1..1\\n\"; }\nEND {print \"not ok 1\\n\" unless $loaded;}\n\
  use MyModule;\n$loaded = 1;\nprint \"ok 1\\n\" ;\n```\n\n这测试了模块是否成功加载——失败将触发 `END`\
  \ 块执行，进而打印 `\"not ok\"` 消息。\n\n这个过程听起来可能不是突破性的解决方案，但其简单性也是其力量所在。因为我们输出了测试数量以及成功完成的测试列表，所以很容易检测到哪个测试失败。也很容易对输出进行后处理（使用\
  \ Perl），以生成完成或失败的测试数量摘要。\n\n这就是 `Test` 模块的目的，它执行基本测试并输出 `\"ok\"` / `\"not ok\"`\
  \ 消息，而 `Test::Harness` 模块则监视 `Test`（或任何兼容的测试脚本）的输出。\n\n还有其他构建测试工具的方法，但你可能应该使用 Perl\
  \ 标准系统，因为它将帮助你理解 Perl 本身是如何测试的，以及你下载的模块和扩展中的测试是如何工作的。通过理解这些模块使用的测试系统，你应该能够追踪到除自己脚本之外的其他地方的问题。\n\
  \n当新版本的 Perl 发布时，测试工具也可以成为测试脚本/模块的有用方法。\n\n我们还将看看如何为 CGI 脚本构建一个测试工具，该工具可以独立于 Web\
  \ 服务器工作，并且允许你无需使用浏览器即可向脚本提供任意请求。\n\n`Test` 模块支持一个函数 `ok`，它根据你执行的测试结果打印 `\"ok\"`\
  \ 或 `\"not ok\"` 测试。使用该模块的主要方式是调用 `ok`，参数为 0 表示失败，1 表示成功。例如，\n\n![picture27](img/picture27.jpg)\n\
  \n### 使用 Test 模块\n\n第 13 章：测试方法 315\n\n```\n@unsorted = qw/wilma barney fred bambam/;\n\
  ok(1) if (join(' ', sort split //, $unsorted) eq 'abcdef');\n```\n\n如果你想运行多个测试，则使用\
  \ `BEGIN` 块指定要进行的测试参数。例如，\n\n```\nuse Test;\nBEGIN { plan tests => 2}\nok (1) ;\
  \ ok (0) ;\n```\n\n每次调用 `ok` 应指示成功或失败。生成的报告和输出与 Perl 自身测试系统（从原始发行版构建 Perl 时可用）的格式匹配。例如，上述脚本将输出\n\
  \n```\n1..2\nok 1\nnot ok 2\n# Failed test 2 in test.pl at line 5\n```\n\n请注意，每次调用\
  \ `ok` 都会遍历可用的测试编号，并相应地记录和报告失败。\n\n你也可以直接使用 `ok` 函数来检查脚本的返回值——例如，对于成功时返回 true 的函数或表达式：\n\
  \n```\nok(mytest ()) ;\n```\n\n返回值或解析后的表达式必须根据测试的成功与否返回 true 或 false。你还可以使用两个参数的版本，比较两个参数的值：\n\
  \n```\nok(mytest () ,mytest ()) ;\n```\n\n如果你想在错误中捕获额外信息，可以向 `ok` 函数附加额外参数：\n\n\
  ```\nBEGIN { plan tests => 1 }\nok(0,1,'Math Error');\n```\n\n当脚本退出时，会报告生成的错误和不匹配信息：\n\
  \n```\n1..1\nnot ok 1\n# Test 1 got: '0' (tl3.pl at line 3)\n# Expected: '1' (Math\
  \ Error)\n```\n\n你可以通过直接在测试套件中指定需要修复的测试编号，将测试标记为“待办”测试。这些测试预期会失败。你在 `BEGIN` 块中向\
  \ `plan` 函数指定这些信息\n\n316 调试 Perl：程序员故障排除指南\n\n。`todo` 参数应提供一个数组引用，列出预期失败的测试：\n\n\
  ```\nuse Test;\nBEGIN { plan tests => 4, todo => [2,4]}\nok (1) ; ok ( 0) ; Ok(l)\
  \ ; Ok ( 0 ) ;\n```\n\n生成的失败消息会注明存在预期失败：\n\n```\n1..4 todo 2 4; ok 1\nnot ok 2\n\
  # Failed test 2 in tl3.pl at line 5 *TODO* ok 3\nnot ok 4\n# Failed test 4 in tl3.pl\
  \ at line 7 *TODO*\n```\n\n并且当它看到预期失败的测试成功时，也会通知你：\n\n```\n1..2 todo 2; ok 1\nok\
  \ 2 # Wow! (test.pl at line 5)\n```\n\n你可以根据平台特定功能的可用性跳过测试，使用 `skip` 函数：\n\n```\n\
  skip(TEST, LIST)\n```\n\n`TEST` 是一个测试，仅在所需功能不可用时求值为 true。`LIST` 中的后续值的工作方式与 `ok`\
  \ 函数相同。例如，你可以用它来测试多平台脚本，其中某些函数或外部命令仅在某些平台上可用：\n\n```\nskip($platform eq 'hpux',\
  \ [3,5,9]);\nskip($platform eq 'Solaris', [2,4,8]);\n```\n\n\n\n\n你还可以提供一个子程序，在测试完成后处理额外的诊断信息。该函数接收一个哈希引用数组的引用，每个哈希描述一个测试失败。每个哈希的键是\
  \ `package`、`repetition` 和 `result`。要配置该函数，请在 `BEGIN` 块中调用 `plan` 时指定其引用：\n\n```\n\
  BEGIN { plan tests => 2, onfail => \\&errdiags }\n```\n\n生成的函数在 `END` 块内执行，可用于报告额外的诊断信息，或详细说明如何将错误报告回作者。\n\
  \n# 第 13 章：测试方法 317\n\n### 使用 Test::Harness\n\n`Test::Harness` 模块作为多个测试脚本的包装器。它监控每个脚本生成的输出，然后根据系统内测试的成功与否生成摘要。虽然你可以将该模块与输出适当“ok”消息的脚本结合使用，但最好与我们之前看到的\
  \ `Test` 模块结合使用。\n\n使用该模块的方法是调用 `runtests` 函数，并传入测试脚本文件名的列表：\n\n```\nuse Test::Harness;\
  \ runtests(LIST)\n```\n\n`LIST` 应是一个要执行的有效测试脚本列表。它解析典型 Perl 测试脚本生成的输出并进行分析。`Test`\
  \ 模块生成的输出适合正确解析。\n\n例如，一个包含九个测试且其中三个失败的脚本会输出以下内容：\n\n```\ntest.pi\n\n# Failed test\
  \ 2 in test.pl at line 5\n# Failed test 5 in test.pl at line 8\n# Failed test 9\
  \ in test.pl at line 12\nFAILED tests 2, 5, 9\n\nFailed 3/9 tests, 66.67% okay\n\
  Failed Test Status Wstat Total Fail Failed List of failed\ntest.pl 9 3 33.33% 2,\
  \ 5, 9\nFailed 1/1 test scripts, 0.00% okay. 3/9 subtests failed, 66.67% okay.\n\
  ```\n\n从中可以看出，它既提供了统计信息，也提供了关于失败测试的具体信息。\n\n### CGI 测试工具\n\n测试 CGI 脚本时，由于需要在脚本执行期间提供表单数据，你会遇到一系列不同的问题。如果你使用\
  \ `CGI` 模块，最简单的方法是用适当的信息填充环境，或者将数据作为输入提供给脚本。我使用以下脚本来测试我的 CGI 脚本。它作为 CGI 调用的包装器，相应地填充环境。在此示例中，它配置用于测试一个显示电视信息的脚本：\n\
  \n```\n#!/usr/local/bin/perl -w\n\nuse strict;\nuse URI::Escape;\n\n318 Debugging\
  \ Perl: Troubleshooting for Programmers\n\n%ENV = (REQUEST_METHOD => 'GET',\n  \
  \      QUERY_STRING => ' 1 , REQUEST_URI =>\n        PATH => '/bin:/sbin:/usr/bin*,\n\
  \nmy %request = (t => 'c' ;\n               c => 'BBC 1' ) ;\n\nmy $request;\nforeach\
  \ (sort keys %request) {\n    $request .= \"$_=uri_escape($request{$_})\";\n}\n\n\
  $ENV{QUERY_STRING} = $request;\n$ENV{QUERY_LENGTH} = length($ENV{QUERY_STRING});\n\
  $ENV{CONTENT_LENGTH} = length($ENV{QUERY_STRING});\n\nsystem('./index.cgi >testharness.out\
  \ 2>testharness.warn');\n```\n\n要使用该包装器，请更改 `%request` 哈希，用通常由表单提交的信息填充它。哈希的每个元素由\
  \ `URI::escape` 模块解析，以确保其格式适合发布到 CGI 脚本，然后执行脚本，并将 `STDOUT` 和 `STDERR` 重定向到合适的文件。\n\
  \nVTPPPTTPwj 注意脚本中 `%ENV` 数组已被新数据覆盖。 MK/MKmHUm 这是故意的，确保我们获得的是 Web 服务器类型的环境，而不是外层\
  \ shell 的环境。这里指定的环境相当典型（尽管缺少一些 Web 特定的条目），并且还会捕获脚本中使用了相对路径而非绝对路径引用外部命令的错误。它还能通过污点检查。\n\
  \n上述方法依赖于 `GET` 方法。如果你编写了一个仅支持 `PUT` 的自定义处理器（而不是使用 `CGI` 模块），则需要修改脚本，使其使用 `echo`\
  \ 提供请求字符串，然后通过管道将其输入到 CGI 脚本本身。例如：\n\n```\nsystem('echo $request|./index.cgi >test.out\
  \ 2>test.warn');\n```\n\n记得修改顶部的 `%ENV` 以反映 `PUT` 而非 `GET` 请求。\n\n## 第 14 章\n\n\
  ### 破坏你的代码\n\n![picture28](img/picture28.jpg)\n\n320 Debugging Perl: Troubleshooting\
  \ for Programmers\n\n构建测试工具是测试代码的好方法，但它仅在“理想”条件下测试代码。很少有人会在系统负载很高的情况下测试代码，或者测试脚本因执行环境的影响而非脚本本身问题而失败的情况。\n\
  \n我们在上一章中看到了内部测试过程。下一级测试是向脚本或模块提供一个故意从外部破坏代码的环境，而不是仅仅从内部测试脚本的极限或能力。在本章中，我们将重点讨论这些可能中断程序流程的外部影响，并建议一些方法，让你可以在项目进入最终开发阶段之前测试这些脚本并发现这些问题。\n\
  \n有许多不同的系统会影响脚本执行的环境。最明显的是其运行的物理环境：磁盘空间和 CPU 时间。环境变量及其内容也应被视为物理方面。最后，还应考虑你正在使用的文件和资源的安全性和权限。\n\
  \n另一种破坏代码的明显方法是使用 Perl 的污点机制。这样做可以帮助你追踪脚本中可能使用了来自可疑来源信息的区域。它还可以作为跟踪数据在脚本中流动的方法。\n\
  \n在 Web 服务器环境中运行脚本会引发其自身的问题。环境通常受到严格限制，并且根据你使用的平台，外部程序等设施以及不同文件和系统的可用性也可能受到限制。在\
  \ Web 服务器下工作时，提供给脚本的数据也需要进行一定程度的解释。假设提供给 CGI 脚本的信息具有正确的大小和格式是一个坏主意，而故意提供错误信息是测试脚本的好方法。\n\
  \n我们将讨论的最后一个影响是同时多次运行同一脚本。令人惊讶的是，许多人忘记了这种简单操作带来的影响和问题，尤其是在 CGI 或系统管理脚本等应用中——这两种应用都有很高的同时运行可能性。\n\
  \n在本章中，我们将讨论所有这些影响，并在适用的情况下，讨论通过减少或限制相关资源来故意破坏代码的方法。\n\n### 磁盘空间\n\n在开发使用文件系统进行任何类型存储的脚本时，限制机器上的磁盘空间应该是任何测试策略的重要组成部分。大多数情况下，你应该能够通过检查对\
  \ `open` 和 `print` 的调用来发现错误，但也要记得检查绑定哈希以及 `mkdir` 甚至 `chmod` 调用的操作。你可能本来就应该这样做，但值得特别关注的是，当错误是由于磁盘空间不足而非权限问题引起时，会发生什么情况。\n\
  \n第 14 章：破坏你的代码 321\n\n### 减少磁盘空间\n\n在 Unix 下，故意减少磁盘空间的最快方法是使用 `mkfile` 命令。该命令根据提供的大小和名称生成一个文件；例如：\n\
  \n```\n$ mkfile 16M bigfile\n```\n\n\n\n\n生成一个大小为 16Mb 的文件。在 Windows、MacOS 以及 Unix\
  \ 系统下，如果你不想使用或无法使用`mkfile`命令，可以使用以下脚本，其功能相同：\n\n```perl\n#!/usr/local/bin/perl -w\n\
  \nuse strict; use Fcntl;\n\nunless (@ARGV == 2) {\n\nprint \"$0 size name\\n\";\
  \ exit 0;\n\n}\n\nmy ($size,$modifier);\n\nif ($ARGV[0] =~ m/([0-9]+)([A-Za-z]*)/)\
  \ {\n\n($size,$modifier) = ($1,$2);\n\n}\n\nelse {\n\ndie \"Invalid size specification:\
  \ $ARGV[1]\";\n\n}\n\n$modifier = lc($modifier); my $block;\n\nif ($modifier eq\
  \ 'k') {\n\n$size *= 1024; $block = 'x' x 1024;\n\n}\n\nif ($modifier eq 'm') {\n\
  \n$size *= 1024*1024; $block = 'x' x 16384;\n\nDebugging Perl: Troubleshooting for\
  \ Programmers\n\n}\n\nif ($modifier eg 'g')\n\n$size * = 1024*1024*1024; $block\
  \ = 'x' x 16384;\n\nmy ($written,$blocksize) = (0,length($block));\n\nsysopen(FILE,$ARGV[l],0_CREAT|0_WRONLY)\
  \ or die \"Can't create $ARGV[1]: $\n\nwhile($written < $size) {\n\nsyswrite FILE,\
  \ $block, $blocksize\n\nor die \"Error writing to file: $!\"; $written += $blocksize;\n\
  \n}\n\nclose(FILE);\n```\n\n它的使用方式与`mkfile`命令完全相同；命令`mkfile.pl 1G bigfile`将创建一个\
  \ 1Gb 的文件。\n\n### CPU 时间\n\n并非所有脚本都能在重 CPU 负载下良好运行。特别是那些自身会带来高负载，或使用超时等待特定操作完成的脚本，可能会出现问题。例如，设想一个脚本使用`ALRM`信号处理程序来暂停并等待某个操作。无论\
  \ CPU 负载如何，传递给`alarm`函数的延迟时间都是以实际秒数指定的。\n\n如果 CPU 负载特别重，处理程序可能会在操作完成之前触发，尽管如果给予适当的时间（考虑负载），脚本最终本应成功完成。对于与文件系统通信或使用套接字与远程机器通信的脚本，这种操作可能会成为问题，尤其是当它导致套接字或文件不必要地保持打开状态时。\n\
  \n实际上，这种特定情况不太可能发生，因为即使在非常重的负载下，你的系统也应该正常响应。但这并不意味着 CPU 威胁不存在。对于时间关键型应用——包括 Web\
  \ 上的应用——这是一个你应该考虑并测试的因素。当然，如果你的系统响应速度不足以满足脚本需求，那么你面临的问题就不仅仅是有效运行 Perl 脚本了！\n\n第\
  \ 14 章：代码调试 323\n\n可以设想使用`uptime`（在 Unix 上）的输出来确定当前系统负载并相应调整超时时间，但在实践中，这样做可能涉及过于复杂的系统，难以在大多数脚本中使用。相反，你应该在不同负载下测试脚本，然后相应调整时间。\n\
  \n为了给系统施加高负载，最好的方法是运行一个或多个会给系统带来压力的脚本。不过，要确保你的脚本不仅仅是进行简单的计算。你需要编写一些复制数据的代码来帮助给系统施压，并考虑包含一个系统调用——像`glob`这样的调用就足够了。我使用以下脚本：\n\
  \n```perl\n#!/usr/local/bin/perl -w\n\nsub funca\n\nmy (@data) = @_;\n\nforeach\
  \ (©data) { $_ =~ tr/[a-z]/[A-Z]/; } return ©data\n\nsub funcb\n\nmy (©data) = @_;\n\
  \nforeach (©data) { $_ =~ tr/[A-Z]/ [a-z]/; } return ©data;\n\nwhile (1)\n\n©data\
  \ = glob (\"/etc/*\") ; funca(funcb(funca(©data)));\n```\n\n你可以根据需要多次运行此脚本以给系统施压——我曾用它来运行\
  \ 20-30 个进程，这些进程在最后一分钟内请求执行时间。\n\n我尽量遵循每个处理器大约 15 个并发进程的粗略指导，但具体数量取决于你的系统。记得使用`uptime`命令来帮助评估负载。在\
  \ Windows 机器上，你可以使用内置的资源监视器来检查系统负载。在 MacOS 下则更困难——要运行多个 Perl 脚本，你需要复制 Perl 应用程序。可能更容易的方法是运行其他处理器密集型任务——在\
  \ Adobe Photoshop 中对大文件运行高斯模糊（3.5 像素）是一种方法，但还有其他方法。\n\n一旦系统被适当施压，尝试运行脚本并观察效果。不要过于担心明显的效果，比如执行缓慢；相反，要关注在正常负载下能正常工作的应用出现的故障和数据丢失。\n\
  \n如果你使用与数据库（本地或远程）通信的 Perl 脚本，请编写一个给数据库施压的脚本（使用大型或重复的`SELECT...ORDER BY`查询），而不是给整个系统施压。这应该有助于在数据库连接阶段以及`SELECT`或类似查询期间突出显示脚本中的问题。\n\
  \n324 调试 Perl：程序员故障排除\n\n### 环境变量\n\n依赖外部变量获取信息是一个非常糟糕的主意，尤其是当这些信息通常可以在其他地方找到时。一些典型的例子包括用户名、用户\
  \ ID 和`PATH`，但还有很多其他变量。表 14-1 列出了一些 Unix 环境变量，你应该避免使用它们，或者自己定义它们以确保正常运行。表 14-2 列出了\
  \ Windows 变量，并包含了哪些平台将这些变量定义为标准的信息。\n\n在相关的地方，表格显示了你可以使用的可能默认值。表格还列出了替代位置，你可以在这些位置找到相同的信息，而无需依赖环境变量。MacOS\
  \ 和其他非交互式平台无论如何都不太依赖环境变量来执行脚本。\n\n表 14.1 Unix 机器上的环境变量\n\n第 14 章：代码调试 325\n\n表 14.2\
  \ Windows 的环境变量\n\n326 调试 Perl：程序员故障排除\n\n表 14.2 Windows 的环境变量（续）\n\n第 14 章：代码调试\
  \ 327\n\n表 14.2 Windows 的环境变量（续）\n\n### 安全与权限\n\n对于使用文件和其他基于文件的资源（命名管道或原始设备）与外部世界通信的脚本，需要特别注意脚本需要访问的文件。\n\
  \n328 调试 Perl：程序员故障排除\n\n不同的用户将根据其用户和组设置以及单个文件权限来访问不同的文件。\n\n测试脚本对不同文件可访问性的最简单方法是以不同用户身份运行脚本。如果可能，尝试以与最终环境具有相同能力的用户身份运行脚本，或者对于通用脚本，创建一个没有特殊权限的特殊用户。在\
  \ Unix 下，只需创建一个没有主组的用户；在 Windows 下，创建一个仅具有来宾权限的新用户。\n\n在脚本内部，确保测试所有文件操作，包括明显的`open`和`print`语句，以及`stat`和其他统计运算符。\n\
  \n### 污染数据\n\n提供无效数据是测试脚本处理意外情况能力的好方法。真正的威胁在于提供过多数据或错误类型的数据，而脚本没有检查其来源或有效性。最明显的例子是当\
  \ CGI 脚本用于返回文件内容时——允许用户提供系统文件（如`/etc/passwd`）显然是一个坏主意。\n\n这里简单的规则是：不要信任用户提供的任何数据，无论是来自标准输入还是环境变量。手动追踪和跟踪问题正是\
  \ Perl 污染机制的全部意义所在。\n\n### 使用污染模式\n\n\n\n\nPerl 提供了一种称为污点检查（taint checking）的功能。此选项强制\
  \ Perl 检查脚本中所用数据的来源。从外部世界获取的信息被视为被污染的（tainted），实际上标记为不安全。此外，由被污染数据派生出的变量也是被污染的。Perl\
  \ 会检查这些不安全变量的使用位置，以及它们是否会影响脚本外部的其他内容。例如，如果它们涉及运行命令或修改文件系统，则会引发错误。如果数据来自脚本外部，则会被标记为被污染，包括以下来源：\n\
  \n- 命令行参数\n- 环境变量\n- 区域设置信息\n- `readdir` 函数\n- `readlink` 函数\n- `shmread` 函数（仅数据变量）\n\
  - `msgrcv` 函数（仅消息）\n- `getpw*` 函数集（密码、gcos 和 shell 字段）\n- 任何文件输入\n\n第 14 章：破坏你的代码\
  \ 329\n\n被污染的数据不能用于以下操作：\n\n- 调用子 shell 的命令（包括 `system`、`open`、`exec` 以及 `qx//`\
  \ 运算符。`system` 和 `exec` 的多参数形式除外）。\n- 修改文件内容、权限或文件系统属性的命令——包括创建新文件。\n- 修改目录权限或名称的命令。\n\
  - 运行新进程或管理现有进程的命令。\n\n其中一些检查相对简单，例如验证给定路径中的目录是否不可被他人写入。另一些则更为复杂，依赖 Perl 的编译器和语法检查器来接受或拒绝该语句。\n\
  \n以下代码片段展示了在启用污点检查的情况下运行某些语句的结果：\n\n```\n$cmd = shift; # 被污染 - 其来源是命令行\n$run = \"\
  echo $cmd\"; # 也被污染 - 派生自 $cmd\n$alsoran = \"echo Hello\"; # 未被污染\nsystem \"echo\
  \ $cmd\"; # 不安全 - 使用 $cmd 的外部 shell\nsystem \"$alsoran\"; # 不安全 - 直到设置 $PATH\nsystem\
  \ \"/bin/echo\", $cmd; # 安全 - 不使用 shell 执行\n```\n\n如果你尝试在启用污点检查的情况下将此代码作为脚本执行，你会收到诸如“Insecure\
  \ dependency”或“Insecure $ENV{PATH}”之类的错误，分别对应第 4 行和第 5 行。\n\n另请注意，任何暗示使用外部命令或函数的内容也会使数据不安全。因此，任何访问环境（通过\
  \ `%ENV`）、调用文件通配例程（`glob` 或 `<*.c>`）以及某些 `open` 结构也会返回被污染的信息。最后，任何系统函数，如 `umask`、`unlink`、`link`\
  \ 等，当与被污染变量一起使用时，也被视为不安全。每种情况都有一些例外。\n\n如果你在访问环境之前从 Perl 内部修改了环境，那么该信息就不会被污染（Perl\
  \ 会“记住”你进行了修改）；因此以下代码\n\n```\n$ENV{'PATH'} = '/bin:/usr/bin'; $path = $ENV{ 1 PATH'\
  \ } ;\n```\n\n不会污染 `$path`，因为其来源最初是内部的。\n\n对于 `open` 命令，允许从被污染的文件名进行读取，因为读取是非破坏性的。但是，不允许写入被污染变量所引用的文件；因此以下代码\n\
  \n```\n$file = shift;\nopen(DATA,\">$file\");\n```\n\n会生成一个错误，因为 `$file` 变量来自外部源。\n\
  \n如果你与命令一起使用的命令或数据来自外部源，那么使用管道也是一种不安全的选择，例如\n\n```\n$file = shift;\nopen(FOO,\"\
  gunzip -c $file|\");\n```\n\n330 调试 Perl：程序员故障排除指南\n\n被认为是不安全的，因为必须调用 shell 来解释整个命令行。你可以通过使用替代的管道表示法来绕过这个问题：\n\
  \n```\n$file = shift;\nopen(FOO,\"-|\") or exec 'gunzip', '-c', $file;\n```\n\n\
  这被认为是安全的，因为你没有使用 shell 来执行命令。\n\n要启用污点检查，你必须在命令行中指定 `-T` 选项。这适用于 Unix 和 Windows\
  \ NT。MacPerl 也提供污点检查，但并非特别有用。即使启用污点检查，也不会有太大区别，因为 MacOS 无法执行外部程序。无论如何，它不像 Unix 或\
  \ NT 系统那样容易遭受相同的安全漏洞。\n\n如果你尝试运行一个脚本，该脚本的实际和有效用户及组 ID 不同，Perl 也会自动启用污点检查。如果在 Unix\
  \ 系统上设置了 setuid 或 setgid 位，这也会自动启用污点检查。一旦启用，污点检查将在脚本的剩余部分保持开启；在脚本结束之前，你无法将其关闭。\n\
  \n### 检查与解除数据污染\n\n要检测变量是否被污染，你可以使用 Perl 发行版标准库中提供的 `tainted.pl` 脚本中的 `is_tainted`\
  \ 函数。解除变量污染的唯一方法是引用子字符串正则表达式匹配。例如，对于电子邮件地址，你可以使用以下代码片段来提取未受污染的地址版本：\n\n```\nIf ($addr\
  \ =~ r ([-\\®\\w.]+)$/) {\n    $addr = $1;\n}\nelse {\n    die \"Bad email address\"\
  ;\n}\n```\n\n显然，对每个被污染的元素运行表达式匹配首先就违背了污点检查的目的。因此，你可以通过使用 `re` 编译指示在脚本中开启或关闭这种解除污染的行为：\n\
  \n```\nuse re 1 taint' ;\n```\n\n这意味着如果源数据已被污染，所有正则表达式都会污染数据。\n\n由于 CGI 脚本中的变量是被污染的（它们来自外部环境变量或标准输入），因此对\
  \ Perl CGI 脚本进行污点检查是一个好主意。\n\n### Web 服务器\n\nWeb 服务器为运行 CGI 脚本提供了一个受限的环境。例如，本章前面介绍的许多环境变量可能根本不存在，或者包含的信息严重减少——尤其是像\
  \ `PATH` 这样对安全敏感的变量。还需要考虑其他因素：通过套接字或命令与外部世界通信可能会出现问题。在此环境中用于执行脚本的用户也可能具有减少的能力集。最后，超时的使用可能会错误地指示脚本失败。\n\
  \n在这些条件下测试代码的最简单方法是实际在 Web 服务器下运行它，并观察结果。使用第 7 章和第 9 章中的技术来记录执行过程中的错误，而不是依赖服务器的错误日志文件（你可能无法访问该文件）。\n\
  \n### Web 环境\n\n在 Web 服务器下运行的任何脚本可用的环境变量都受到严格限制。大部分信息可能无法使用，或者可以在其他地方获得（参见本章前面的“环境变量”）。事实上，最好假设你通常可以访问的所有环境变量都将不存在，而不是可能不存在。你最可能遇到问题的变量是\
  \ `PATH` 变量，但考虑到我上面强调的其他问题，你应该自己定义路径。我在表 14-3 中列出了在两种最流行的 Web 浏览器 Apache 和 IIS 下执行\
  \ CGI 脚本时定义的环境变量，以供参考。\n\n表 14.3 执行 CGI 脚本时定义的环境变量\n\n332 调试 Perl：程序员故障排除指南\n\n\
  表 14.3 执行 CGI 脚本时定义的环境变量（续）\n\n### 网络通信\n\n当脚本在 Web 服务器下执行时，通过 Perl 在网络中与其他机器通信可能会出现问题。原因通常很简单，比如超时（见下文），但也可能与权限减少或所需资源缺乏有关。这里的一个很好的例子是，一个脚本从另一个站点下载页面，过滤后并将信息显示回浏览器。即使是\
  \ LWT 和 libnet 工具包在这种情况下也可能导致问题。\n\n\n\n测试并解决这个问题的唯一方法是尝试运行脚本——如果你遇到问题，可以试试本章后面“超时”部分列出的技巧。\n\
  \n### 外部程序\n\n依赖外部程序获取信息对于任何脚本来说都是一个坏主意，对于基于 Web 的脚本更是如此，因为它依赖于在脚本内部创建一个新进程，而该脚本可能没有权限或资源来这样做。除非你确实需要直接与外部命令通信，否则应不惜一切代价避免这样做。大多数情况下，已经有一个\
  \ Perl 模块可以与大多数系统通信。例如，当读写压缩文件和其他归档文件时，可以查看 CPAN 上提供的 Archive::*系列模块。如果你需要的扩展不存在，考虑编写一个！\n\
  \n第 14 章：破坏你的代码 333\n\n当使用 ISAPI 工具包（ActivePerl 发行版的一部分）通过 ASP 接口执行 Perl 脚本时，你会遇到一系列不同的问题。`PerlIS.dll`库会为它执行的每个脚本创建不同的线程。\n\
  \n由于 Perl for ISAPI 作为 Web 服务器进程内的一个线程运行，而不是作为一个拥有自己线程的独立进程，因此直接从 Perl for ISAPI\
  \ 脚本生成新应用程序可能存在潜在问题。原因是你试图在 Web 服务器内存空间的范围内加载一个程序（因为它将是 Perl 脚本的子进程，而 Perl 脚本又是\
  \ Web 服务器的一个线程）。由于你可以在 Perl 的范围内完成大多数事情，这并不总是问题，但如果你担心需要调用外部程序，那么直接使用 Perl 解释器而不是`PerlIS.dll`来执行该脚本。\n\
  \n### 用户安全\n\n大多数 Web 服务器要么使用“nobody”账户运行，要么使用一个特殊的命名账户，例如 www；对于微软的 IIS 服务器，将使用\
  \ IUSER_<nodename>用户。默认情况下，这些用户权限非常有限，除了访问 Web 服务器内的文件或执行缩减后的`PATH`中定义的基本文件外，几乎做不了什么。在这些\
  \ Web 服务器上使用的脚本应小心，确保文件和命令使用其完全限定名称引用，并且任何超出本地 Web 服务器范围的文件要么得到适当保护，要么被赋予适当权限，以便脚本能够访问它们。\n\
  \n如果你要连接数据库，应明确指定连接数据库引擎的登录名和密码信息，而不是依赖从环境继承的用户权限。这样做只会影响默认使用“当前”用户的数据库，例如 MySQL\
  \ 和 PostGreSql。\n\n在这些条件下测试（并可能破坏）代码的最简单方法是作为受限用户登录并尝试运行脚本。\n\n### 超时\n\n大多数服务器和浏览器在等待信息时会使用一系列超时，以确保它们不会无限期地等待数据。过于复杂或依赖外部命令输出的脚本应考虑这一点。脚本执行时间过长导致浏览器超时是很有可能的，即使脚本实际上可能正在正确运行。\n\
  \n你可以通过在等待操作成功时提供一些空白数据（一个简单的换行符即可）来解决这个问题。为此，请确保关闭正常的输出缓冲，\n\n```\n$| = 1;\n```\n\
  \n然后输出空文本。这将重置服务器和浏览器的超时，并阻止你的脚本触发失败消息。\n\n在正常条件下运行脚本可能不足以追踪这里的故障。相反，你需要在 CGI 环境中运行脚本。\n\
  \n334 调试 Perl：程序员故障排除\n\n### Web 数据\n\n对互联网站点的攻击数量正在增加。这是否是因为计算机破解者数量的急剧上升，还是因为不认真对待威胁的公司和主机数量增加，尚不清楚。事实是，如果你遵循一些简单的指导原则，确保脚本安全是极其容易的。然而，在查看解决方案之前，让我们先看看容易受到攻击的脚本类型：\n\
  \n- 任何将表单输入传递给邮件地址或邮件消息的脚本\n- 任何传递将在子 shell 中使用的信息的脚本\n- 任何在表单处理过程中盲目接受无限量信息的脚本\n\
  \n前两个危险区域应该相对明显：任何可能在命令行上执行的内容，如果攻击者提供了正确的信息，就容易受到滥用。例如，想象一个直接传递给 sendmail 的电子邮件地址，看起来像这样：\n\
  \n```\nmc@foo.bar;(mail mc@foo.bar </etc/passwd)\n```\n\n如果这作为 sendmail 命令行的一部分在命令行上执行，分号后的命令会将密码文件通过邮件发送给同一个用户——如果不检查，这是一个严重的安全隐患。通常可以通过使用污点检查来突出显示被认为不安全的数值来解决这个问题。由于脚本的输入要么来自标准输入，要么来自环境变量，数据将自动被污染。\n\
  \n使用 CGI 脚本时有一条简单的规则：不要信任所提供数据的大小、内容或组织。以下是编写安全 CGI 脚本时应注意的一些事项清单：\n\n- 在使用字段名称、值和关联之前，请仔细检查它们。例如，确保电子邮件地址看起来像电子邮件地址，并且它是你期望从表单中获得的正确字段的一部分。\n\
  - 不要未经检查就自动处理字段值。通常，列出你愿意接受的 ASCII 字符列表，并用简单的正则表达式过滤掉其他所有内容。\n- 检查变量或更好的是表单数据的输入大小。你可以使用`$ENV{CONTENT_LENGTH}`字段，该字段由\
  \ Web 服务器计算，用于检查 POST 方法接受的数据长度，一些 Web 服务器也在 GET 请求中提供此信息。\n- 不要在使用前假设字段数据存在或有效；空白字段可能和填充了错误数据的字段一样造成问题。\n\
  \n第 14 章：破坏你的代码 335\n\n- 除非你能确定文件的内容，否则永远不要返回文件的内容。当你期望用户请求 HTML 文件时，随意返回密码文件容易受到严重滥用。\n\
  - 不要认为发送到脚本的路径信息自动有效。选择一个你可以信任的替代`$ENV{PATH}`值，并将其硬编码到脚本的初始化中。同时，使用`delete`删除你知道不会使用的任何环境变量。\n\
  - 如果你要接受路径或文件名，请确保它们是相对路径而非绝对路径，并且不包含`..`（指向父目录）。攻击者可以轻松指定一个文件如`../../../../../../../../../etc/passwd`，即使从深层目录也能引用到密码文件。\n\
  - 始终验证与`open`、`system`、`fork`或`exec`一起使用的信息。至少确保传递给这些函数的任何变量不包含字符`;|()`。更好的是，考虑使用`fork`和管道`open`技巧，在外部应用程序和脚本之间提供安全接口。\n\
  - 确保你的 Web 服务器不以 root 身份运行，这会使你的机器面临各种攻击。以 nobody 身份运行 Web 服务器，或者为 Web 服务器创建一个新用户，确保脚本仅对\
  \ Web 服务器所有者可读可执行，并且任何人都不可写。\n\n\n\n\n• 尽可能使用 `Perl` 代替 `grep`。这样做可以避免为了搜索文件内容而进行系统调用。许多其他命令和函数也是如此，例如\
  \ `pwd` 甚至 `hostname`。有一些技巧可以在不调用外部命令的情况下获取所在机器的信息。你的 Web 服务器通过环境变量自动为你提供大量与脚本相关的信息，其中大部分可以从\
  \ `CGI` 模块中以未污染格式获取。请使用它。\n\n• 不要假设隐藏字段真的隐藏了——用户查看文件源码时仍然会看到它们。也不要依赖自己的加密算法来加密这些隐藏字段中提供的信息。请使用经过检查且无错误的现有系统，例如本地\
  \ CPAN 存档中的 `DES` 模块。\n\n• 使用污点检查，或者在真正安全的情况下，使用 `Safe` 或 `Opcode` 模块为执行 Perl 脚本提供受限的功能集。\n\
  \n如果你遵循这些指南，至少可以降低遭受攻击的风险，但无法完全保证安全。一个坚定的攻击者会使用多种不同的工具和技巧来实现其目标。\n\n应始终牢记基本规则：不要信任所提供数据的大小、内容或组织方式。\n\
  \n336 调试 Perl：程序员故障排除指南\n\n### 多次执行\n\n令人惊讶的是，许多在可能被多次并发执行的情况下使用的脚本，实际上从未在这些条件下进行过测试。任何依赖从资源读取和写入的脚本都有可能引发问题。需要注意和测试的情况包括：\n\
  \n• **网络服务器** 你可能正在使用 `select` 或 `fork` 来支持各个客户端，但要小心支持写入同一文件的命令。记得测试打开和关闭操作，并对其他操作（如绑定的数据库访问）使用\
  \ `flock` 或锁文件。\n\n• **数据库接口** 对于通过 `DBI` 工具包等模块与商业及其他 RDBMS 系统的接口，你不应该遇到问题，因为数据库会自行处理行、列和表锁定。确保测试所有操作以发现任何问题。对于\
  \ DBM 和基于文本的数据库，使用 `flock` 或自带锁定机制的 `GDBM` 或 `Berkeley` 工具包。如果这些方法都不可靠，则创建一个测试数据库操作的函数，在重试前等待一小段时间，而不是直接失败。即使像这样简单的东西：\n\
  \n```\nwhile(!(tie %metadata, 'GDBM_File' ,\"$dbfile\", &GDBM_WRCREAT, 0666)) {\n\
  sleep 5;\nlast if ($retry++ >6);\n}\n```\n\n也能达到预期效果。\n\n• **CGI 脚本** 与前面的示例相关，任何尝试与可能被锁定或不可用的资源通信的\
  \ CGI 脚本都应能够处理这种情况。同样，检查任何与外部数据存储（包括文件、数据库和文件系统）通信的操作。\n\n如果你打算使用某种锁定机制（包括简单的锁文件），请使用\
  \ `BEGIN` 和/或 `END` 块来确保锁文件在程序其余部分执行之前创建，并在脚本以任何方式退出时删除。在使用 `die` 的情况下，更进一步，使用带有适当处理程序的\
  \ `DIE` 信号来关闭任何锁文件。这样做\n\nChapter 14: Breaking Your Code 337\n\n将有助于防止永久锁定情况，即新脚本总是因为锁文件从未被移除而失败。\n\
  \n在测试多次执行时，最简单的方法是在脚本中某处放置\n\n```\n$input = <STDIN>;\n```\n\n或\n\n```\nsleep (60)\
  \ ;\n```\n\n然后在不同窗口（或同一窗口，如果你的 shell 支持作业控制）中执行同一脚本的一个或多个其他实例。始终对非关键数据进行测试，以防出现错误导致正在使用的数据文件被覆盖。\n\
  \n# 附录\n\n![picture29](img/picture29.jpg)\n\n## 附录 A\n\n### 错误消息交叉引用\n\n![picture30](img/picture30.jpg)\n\
  \n342 调试 Perl：程序员故障排除指南\n\n本附录包含 Perl v5.6.0 生成的所有错误列表。除了错误描述外，还给出了错误可能发生的原因，以及（如果相关）修复方法。\n\
  \n所有错误消息分为表 A-1 中所示的类别。请查看每条错误消息的参考资料，了解如何捕获或避免该错误的详细信息。\n\n某些警告可以使用 `warnings`\
  \ 编译指示进行控制。对于这些警告，警告类别会以方括号给出（有关使用 `warnings` 编译指示使用和控制警告的更多详细信息，请参见第 8 章）。请注意，严重警告始终显示，除非已使用\
  \ `warnings` 编译指示或 `-X` 选项明确禁用。对于可捕获的错误，请尝试将导致问题的语句嵌入 `eval` 中。\n\n请注意，错误消息包含其 `printf`\
  \ 格式——例如，`%s` 表示将在错误消息中插入一个字符串。有关将插入哪些信息，请参见错误描述。\n\n有关一些经常出现的陷阱的更多信息，请参见第 2 章至第\
  \ 4 章。\n\n`\"%s\" variable %s masks earlier declaration in same %s` 警告（杂项）\n\n你尝试在同一作用域内使用\
  \ `my` 或 `our` 关键字两次声明同一个变量；例如：\n\n```\nmy $string = 'Hello'; my $string = 'World';\n\
  ```\n\n通常这是拼写错误，或者你剪切粘贴了一段代码并忘记删除关键字。请注意，第二个定义会覆盖第一个。\n\n`\"my sub\" not yet implemented`\
  \ 致命错误\n\n你不能使用 `my` 或 `our` 关键字声明子程序——几乎肯定是拼写错误。\n\n警告类型 可捕获 何时报告\n\n表 A.1 Perl\
  \ 报告的错误类型\n\n`\"my\" variable %s can't be in a package` 致命错误\n\n使用 `my` 声明的变量是词法作用域的，因此实际上并不存在于包内，所以代码\n\
  \n```\nmy $MyModule::error = 'Not in here';\n```\n\n会引发上述错误。\n\n`\"no\" not allowed\
  \ in expression` 致命错误\n\n与 `use` 关键字一样，你不能在表达式中使用 `no`。以下代码肯定无法工作：\n\n```\nif (no\
  \ strict) {\nprint \"Strict disabled\\n\";\n}\n```\n\n`\"our\" variable %s redeclared`\
  \ 警告（杂项）\n\n你尝试在同一词法作用域内使用 `our` 重新声明一个变量；可能是你尝试了\n\n```\nour $string; our $string;\n\
  ```\n\n`\"use\" not allowed in expression` 致命错误\n\n你不能将 `use` 关键字放入任何表达式中。以下代码会失败：\n\
  \n```\nif (use strict) {\nprint \"Strict disabled\\n\";\n}\n```\n\n`! allowed only\
  \ after types %s` 致命错误\n\n你只能在 `pack` 格式中，在 `s`、`S`、`l` 和 `L` 格式之后使用 `!` 字符。\n\n\
  `/ cannot take a count` 致命错误\n\n你尝试在 `pack` 或 `unpack` 中使用 `/` 模板字符，该字符允许打包字符串或列表提供格式长度，但模板字符本身不接受重复值。例如，你可能输入了\n\
  \n```\nunpack 'a2/3a*', \"03Martin\";\n```\n\n而实际上应该输入\n\n```\nunpack 'a2/a*', \"\
  03Martin\";\n```\n\n344 调试 Perl：程序员故障排除指南\n\n`/ must be followed by a, A or Z` 致命错误\n\
  \n你可能尝试从打包字符串中 `unpack` 一个非字符串元素，但只能使用 `a`、`A` 和 `Z`。例如，以下代码无法工作：\n\n```\nunpack\
  \ 'a2/b8', $binary;\n```\n\n或者，你可能只是在 `unpack` 格式字符串中引入了一个空格：\n\n```\nunpack 'a2/\
  \ a*', $binary;\n```\n\n`/ must follow a numeric type` 致命错误\n\n你尝试 `unpack` 一个可变长度元素，但没有提供合适的格式来提取数值；例如：\n\
  \n```\nunpack 'x2/a*', \"Olbinary\";\n```\n\n`% may only be used in unpack` 致命错误\n\
