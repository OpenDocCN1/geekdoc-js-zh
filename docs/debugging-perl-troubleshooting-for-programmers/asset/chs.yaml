  \ X XXX\n\n表 4.1 Perl 内置函数的属性（续）\n\n下面列出了某些函数的更具体问题和错误。\n\n### `alarm`\n\n在任何时候只能有一个活动的`alarm`——对`alarm`的调用会覆盖或重置之前的调用。\n\
  \n- 小心同时使用`alarm`和`sleep`——某些系统使用`alarm`来实现`sleep`函数。\n- 不要将`alarm`用于精确的等待时间，因为实际延迟可能比你指定的多或少一秒。繁忙的系统也可能延迟`alarm`调用（有关影响的更多详细信息，请参见第\
  \ 14 章）。\n\n### `binmode`\n\n`binmode`函数在 Unix 或 Mac 上的 Perl 实现中没有效果，如果你希望支持跨平台脚本，使用它也是安全的。\n\
  \n86 调试 Perl：程序员故障排除\n\n小心使用那些在需要该函数的系统上以原始模式和`binmode`形式访问文件的脚本，特别是当你覆盖信息或存储`tell`返回的值以引用数据部分时。大小和解释的差异很可能会损坏数据。\n\
  \nItfRPPIff^fl // 可能更容易使用 open 处理文本文件，使用 sys*函数进行二进制访问，从而完全避免使用 binmode。\n\n###\
  \ `chdir`\n\n请记住，在 Windows 机器上使用`chdir`时，既有当前工作驱动器，也有当前工作目录。这意味着\n\n`chdir('D:\\\
  Demos'); chdir('C:\\Windows'); chdir('D:');`\n\n实际上会将你放回`D:\\Demos`——要么每次都显式指定目录，要么在继续之前确保跟踪并检查每台机器上的当前目录。\n\
  \n### `chomp`\n\n`chomp`函数是`chop`的较安全版本，但它在数组上的操作以及当`$/`未定义时的行为是不寻常的。\n\n- 请记住，如果最后一个字符与`$/`变量匹配，它会从变量末尾或列表的每个元素中删除最后一个字符。\n\
  - 如果`$/`为空，`chomp`会从字符串或列表的所有元素中删除所有尾随换行符。如果`$/`已被本地化，请小心使用`chomp`。\n- 该函数返回删除的字符数，而不是删除的字符。\n\
  \n### `chop`\n\n与`chomp`不同，`chop`只删除提供的字符串或列表所有元素的最后一个字符。它返回删除的最后一个字符（可能是一个空格）——确保使用`eq`或类似方法检查，而不是使用数值测试运算符。\n\
  \n### `chown`\n\n前两个参数必须是数字。使用`-1`表示该值不应更改。\n\n### `crypt`\n\n`crypt`函数不能（轻易地）解密，并且没有解密函数——它被设计为仅用于密码验证的单向方式。\n\
  \n第 4 章：语句和函数陷阱 87\n\n### `delete`\n\n`delete`函数从任何数组或哈希中删除哈希或数组元素，因此你必须牢记以下几点：\n\
  \n- 当删除（或修改）`%ENV`哈希时，请注意这只会修改当前 Perl 解释器及其子进程的环境。\n- 在迭代哈希时，小心删除哈希的值。\n- 当从绑定的数据库中删除哈希或数组条目时，你正在修改文件；`tie`不会创建数据库的内存副本供你使用。\n\
  \n### `each`\n\n`each`函数从哈希中返回键/值对。\n\n你不能在`foreach`块中使用`each`；请改用`while`：\n\n```\n\
  while( ($key, $value) = each %hash)\n```\n\n在大型哈希上优先使用`each`而不是`keys`或`values`，特别是那些绑定到外部数据库和文件的哈希。\n\
  \n- 不要在循环中对同一个哈希混合使用`each`和`keys`或`values`——当调用`keys`或`values`时，这些迭代器将被重置，这可能会打乱你的循环。\n\
  \n### `eval`\n\n`eval`关键字是一个函数，即使在使用代码块时也需要一个结束分号。以下片段\n\n```\neval {\n    local\
  \ $SIG{ALRM} = sub { die \"Timeout\" };\n    alarm 10;\n    chomp($answer = <STDIN>);\n\
  \    alarm 0;\n}\n```\n\n会因解析器错误而失败。对于接受内联块的函数也是如此——即`map`、`grep`和`sort`。它们必须有一个终止分号来定义语句的结束。\n\
  \n### `exec`\n\n`exec`函数通常永远不会返回——它会用你调用的程序替换当前解释器实例。它唯一会返回的情况是命令不存在并且命令是直接调用而不是通过\
  \ shell 调用的。\n\n88 调试 Perl：程序员故障排除\n\n如果命令未找到并且你结合 shell 使用了`exec`，通常 shell 会替换\
  \ Perl。\n\n### `exists`\n\n如果提供的元素存在于数组或哈希中，此函数返回真——元素的值无关紧要。这意味着`defined`和`exists`返回的值可能不同。\n\
  \n### `exit`\n\n使用`exit`退出脚本，而不是函数。你应该使用`return`从函数调用中立即返回。请记住，`exit`在最终退出解释器之前会调用所有`END`块。\n\
  \n### `fork`\n\n你应该将`SIG{CHLD}`设置为`IGNORE`，或者设置为指向一个调用`wait`的子处理程序，以确保你不会积累僵尸进程。\n\
  \n### `gmtime`/`localtime`\n\n比较不同时间时，请使用`gmtime`，而不是`localtime`。`localtime`函数总是根据当前区域设置返回时间。如果你比较两个时间值，该值将根据本地时区进行调整。例如，\n\
  \n```\n$newtime = timeO;\n$oldtime = $newtime-((180*24*3600)+98764);\n($secdiff,$mindiff,$hourdiff,$ydaydiff)\n\
  \    = (localtime($newtime - $oldtime)) [0..2,7] ;\nprint \"$ydaydiff days, $hourdiff:$mindiff:$secdiff\\\
  n\";\n($secdiff,$mindiff,$hourdiff,$ydaydiff)\n    = (gmtime($newtime - $oldtime))\
  \ [0..2,7] ;\nprint \"$ydaydiff days, $hourdiff:$mindiff:$secdiff\\n\";\n```\n\n\
  即使时间设置为 GMT，我们也会得到\n\n181 days, 3:26:4\n181 days, 2:26:4\n\n这是因为英国夏令时（执行时生效）的影响。在其他时区，差异会更显著。\n\
  \n### `join`\n\n`join`函数接受一个字符串作为第一个参数，而不是像`split`那样的正则表达式。\n\n第 4 章：语句和函数陷阱 89\n\
  \n\n\n第一个参数的内容会插入到数组元素对之间，例如：`$string = join(':', qw/a b c/);` 产生 `a:b:c`，而不是 `:a:b:c`\
  \ 或 `a:b:c:`。\n\n### keys/values\n\n`keys`/`values` 函数一次性返回哈希中所有键或值的列表，而 `each`\
  \ 每次调用只返回一个键值对。\n\n- 处理大型哈希时，优先使用 `each` 而非 `keys` 或 `values`。\n- 使用 `keys` 会重置迭代器（三个函数共用），以便重新遍历哈希。\n\
  - 理论上，如果哈希未发生变化，连续两次调用这三个函数中的任何一个，应返回相同顺序的键/值。但不要依赖此特性；应使用 `sort` 或预定义的数组来保存顺序。\n\
  \n### map\n\n`map` 遍历数组，执行提供的代码块，并返回修改后的列表——它不返回传递给函数的原始列表。\n\n默认情况下，该函数不会修改列表内容。例如，以下代码：\n\
  \n```\n@array = qw/a b c/; map { uc($_) } @array;\n```\n\n不会产生任何效果，而\n\n```\n@array\
  \ = map {uc ($_) } @array;\n```\n\n和\n\n```\nmap { $_ = uc($_) } @array;\n```\n\n\
  则会实际修改数组。\n\n不要在临时列表上使用 `$_` 赋值格式——这可能导致不可预测的结果。例如，`map { $_ = uc($_) } glob('*')`。\n\
  \n`$_` 变量用于保存列表的每个元素，因此不要将 `$_` 循环变量与 `map` 函数混用。\n\n调试 Perl：程序员故障排除指南\n\n### open\n\
  \n打开文件时要小心：确保使用正确的模式（快速指南请参见表 4-2）。\n\n尤其要注意 `+<FILE` 模式；虽然可以写入，但只能追加，不能覆盖已有信息。\n\
  \n### print\n\n`print` 最常见的错误是在文件句柄后加逗号：\n\n```\nprint FILE, \"Some data\\n\";\n\
  ```\n\n应写为：\n\n```\nprint FILE \"Some data\\n\";\n```\n\nPerl 会在编译时检测到这一点并报错。然而，在某些情况下，使用标量时可能会错误地将第一个参数识别为文件句柄（实际上不是），从而引发错误。如有疑问，应在参数列表周围加上括号：\n\
  \n```\nprint ($notfile, \": Some data\\n\"); print $notfile (\"Some data\\n\");\n\
  ```\n\nVjVnpnH / 我倾向于在所有函数调用周围加上括号，因为这样可以解决很多问题。虽然 Perl 允许省略括号，但解释过程可能存在问题。\n\n\
  ### sprintf\n\n`sprintf` 函数的格式为：\n\n```\nsprintf(FORMAT, LIST);\n```\n\n而不是：\n\n\
  ```\nsprintf(LIST);\n```\n\n表 4.2 open 的模式\n\n第 4 章：语句和函数陷阱 91\n\n因此，以下代码不会按预期使用\
  \ `sprintf`：\n\n```\n@args = (\"%0.2f:%s\\n\",3.141,'PI'); print sprintf(@args);\n\
  ```\n\n相反，`@args` 会被强制为标量上下文，你得到的是 `@args` 中元素的数量。而使用 `printf` 则能正确工作：\n\n```\n\
  3.14:PI\n```\n\n### ref\n\n`ref` 函数仅适用于数据结构的引用：你不能用 `ref` 来识别变量的类型（你应该已经知道它了！）。例如：\n\
  \n```\n%hash = ('Fred' => 'Flintstone', 'Barney' => 'Rubble'); print ref(%hash);\n\
  ```\n\n不会输出任何内容，因为 `%hash` 不是对任何东西的引用。记住，`ref` 返回一个与引用类型相关的字符串。\n\n### scalar\n\n\
  `scalar` 函数实际上是一个一元运算符，因此提供参数列表（例如 `print scalar($first,$second);`）会导致 `$first`\
  \ 在空上下文中被解释，而只有 `$second` 在标量上下文中被求值。\n\n### seek\n\n不要对使用 `open` 打开的文件句柄使用 `seek`：应使用\
  \ `sysseek` 以避免缓冲问题。\n\n### select (文件句柄)\n\n`select` 函数返回之前选中的文件句柄，而不是新的文件句柄。\n\
  \n### select (文件)\n\n不要将 `select` 与缓冲 I/O（`read` 或 `<FILEHANDLE>`）混用。请关闭缓冲或改用 `sysread`。\n\
  \n### 设计提示\n\n`IO::Select` 模块比 `select` 函数更易用，并且避免了对大型文件句柄列表调用 `vec`。\n\n92 调试 Perl：程序员故障排除指南\n\
  \n### shift 和 unshift/pop 和 push\n\n当未提供要操作的数组时，`shift`、`unshift`、`pop` 和 `push`\
  \ 在函数外部（即在 `main::` 包中）操作 `@ARGV`，在函数内部调用时则操作 `@_` 参数变量。一个常见的错误是：\n\n```\ndel_files();\n\
  \nsub del_files {\n\nwhile($_ = shift) {\n\nunlink($_) or warn \"Can't delete: $_,\
  \ $!\\n\";\n\n}\n\n}\n```\n\n这里的 `shift` 永远不会达到用户的预期——它会尝试从 `@_` 中取出参数，而 `@_` 是空的，因为\
  \ `del_files` 从未被传入任何参数。它也不会从 `@ARGV` 中取参数，因为它在函数内部被调用。我们可以改变函数的调用方式：\n\n```\ndel_files(@ARGV);\n\
  ```\n\n或者改变 `while` 循环的操作方式：\n\n```\nwhile ($_ = shift @ARGV)\n```\n\n如果不确定效果，请考虑显式提供要操作数组的名称。\n\
  \n`pop` 删除并返回数组的最后一个元素，`shift` 删除并返回数组的第一个元素。这些操作会修改数组，如果你使用这些函数遍历整个数组，循环结束后数组将为空。如果你想要非破坏性的效果，请使用\
  \ `for`/`foreach` 循环：\n\n```\nforeach my $element (@array)\n```\n\n第 4 章：语句和函数陷阱\
  \ 93\n\n类似地，`unshift` 在数组开头插入一个新元素，从而有效地重新编号其余现有元素。`push` 函数向数组添加一个新元素，而不修改现有编号。\n\
  \n如果你使用数组来处理不断变化的参数列表，请使用 `shift` 和 `push` 或 `pop` 和 `unshift`，以便从不同端放置和移除元素。\n\n\
  你不能在列表上使用这些函数；它们只操作数组。以下代码将无法工作：\n\n```\nwhile($_ = pop keys %hash)\n```\n\n请使用\
  \ `foreach` 遍历每个键：\n\n```\nforeach (keys %hash)\n```\n\n或使用 `each` 获取每个元素：\n\n```\n\
  while($_ = each %hash)\n```\n\n或创建一个临时数组来保存信息：\n\n```\n@array = keys %hash; while($_\
  \ = pop @array)\n```\n\n## 第 5 章：程序设计\n\n![picture6](img/picture6.jpg)\n\n96 调试\
  \ Perl：程序员故障排除指南\n\n虽然无法确保所有程序第一次就完全没有错误，但开发过程中的某些方面可以显著简化查找和修复错误的过程。像调试器和性能分析器这样的工具只能帮助你找到并追踪错误的来源——实际消除错误则是另一回事。\n\
  \n有许多方法可以使程序的设计和方法有助于调试过程。最明显的方法是将程序划分为多个独立的组件——函数——然后可以独立于程序的其他部分进行调试和优化。同样的过程也可以扩展到为支持所需功能集而创建的模块。生成一系列函数，调试它们，然后将它们放入一个“已调试”的模块中，这意味着任何问题都可能出在调用该模块的脚本中，而不是模块本身。\n\
  \n这种方法并不总是有效或提供完美的解决方案，但它确实使追踪更容易——调试脚本或模块中的单个子例程比调试一个巨大的多行脚本更容易。\n\nPerl 还提供了一些技巧，可以提高发现潜在问题的机会。这里我们讨论的不是\
  \ pragma 或警告（参见第 8 章），而是能够产生差异的算法语言特性。例如，定义函数原型意味着当函数被调用时，提供的参数会与函数期望的参数进行匹配——不匹配将引发错误。\n\
  \n\n\n\n培养良好的编程设计技能以帮助发现错误的最后一步是使用代码注释和文档。注释是程序开发中常被遗忘的部分，包括我在内的大多数程序员，甚至常常连最基本的注释都省略。代码文档化是另一个常被大多数程序员忽视的领域——但在\
  \ Perl 中，由于我们可以将文档直接嵌入源代码，因此实在没有借口不这样做。\n\n### 抽象\n\n抽象——将程序分解为多个组成部分的过程——是所有脚本的自然过程。总有一些脚本非常适合这一过程，当然也有一些脚本难以轻易分解。你可以将\
  \ Perl 程序抽象为三个基本层次。前两个层次显而易见：子程序（或函数）和模块，但最后一个层次是前两者的特殊形式：对象或类系统。你可以在图 5-1 中看到整个系统的简化示意图。\n\
  \n即使是在最简单的层次上，使用子程序也有助于提高脚本的可靠性。一旦将程序划分为子程序，你就可以单独调试每个子程序，并在子程序级别引入必要的错误检查和错误处理。一旦子程序经过测试和调试，你就不需要再修复它——唯一需要修改的时候是当你要改变其功能时。\n\
  \n在开发模块时，同样的规则适用——模块内的每个子程序都可以被调试。除了将文件转换为适当模块所需的额外包装外，模块本身也应该是无错误的。将一组函数（可能还有模块）转化为一系列类的过程更为复杂，但同样，如果操作正确，它应该有助于消除任何错误或潜在错误，从而使调试使用这些类的脚本变得更加容易。\n\
  \n在本节中，我们将探讨一些开发优秀子程序、模块和类的技术，这些技术应能突出并帮助预防你可能会遇到的至少部分问题。\n\n### 开发优秀的子程序\n\n如果你忽略子程序的内容及其功能，可以将子程序的操作分解为两个基本组成部分：解析提供的任何参数以及返回新信息。所有子程序都至少是这两者的组合；子程序可以接受并返回数据、接受数据但不返回值、或者返回值但不接受任何数据。\n\
  \n此外，还有一些子程序会执行这些操作的组合，但不太可能同时包含全部三种。例如，`rand` 函数，如果你不带参数调用它，它会返回一个介于 0 和 1 之间的数字；如果带参数，则返回介于\
  \ 0 和所提供数字之间的数字。在这种情况下，无法确定子程序何时不应返回任何值。\n\n我们将探讨子程序设计的这两个方面：如何解析提供的参数，以及向调用者返回信息的最佳方法。\n\
  \n### 解析参数\n\n在开发子程序时，关于传递给子程序的参数，需要考虑三件事：\n\n- 参数数量\n- 参数类型\n- 默认值\n\n我们将依次讨论每一项，并看看如何优化它们的定义以减少问题，而不是传播问题。我们还将讨论第四种情况，即提供的参数数量和顺序无关紧要。\n\
  \n**设计提示**\n\n关于减少交换数组和哈希时的负载，以及如何向函数提供多个数组和哈希而不丢失每个参数之间的区别，请参阅本章后面的“引用”部分。\n\n\
  你可能还想了解 Perl 子程序的原型系统，它允许你预先声明子程序支持的参数数量和类型。如果编译过程中存在不匹配，此过程会强制引发错误，而不是在执行期间。这可能并非适用于所有情况，并且可能最适合参数简单的子程序（更多信息请参阅本章后面的“原型”一节）。\n\
  \n#### 参数计数\n\n首先，你应该考虑将提供给子程序的参数数量。如果子程序期望特定数量的参数，那么你的函数应检查参数数量是否正确。最明显的方法是检查 `@_`\
  \ 数组的标量值：\n\n```\ncarp \"Not enough/too many arguments in mysub\" unless(@_ == 2);\n\
  ```\n\n注意这里使用 `carp` 来报告问题，而不是使用 `warn` 或 `die`——这是为了确保错误能够相对于调用者进行报告。（有关使用 `carp`\
  \ 和 `Carp` 模块其余部分的更多信息，请参阅第 7 章。）通过使用 `carp`，我们可以指出问题与子程序的调用方式有关，而不是子程序操作本身的问题。同样的技巧也可用于支持多个参数数量——详情请参阅侧边栏。\n\
  \n请记住，无论你如何从参数数组中提取各个参数，哈希和数组总是会消耗函数的剩余参数。还要记住，当将整个数组或哈希传递给函数时，就无法根据提供的参数数量来修改参数的提取方式。例如，子程序\n\
  \n```\nsub sum {\nmy ($first, $second, @rest) = @_;\n```\n\n可以轻松接受 300 个参数，就像接受三个参数一样——检查至少三个参数是有效的，但检查\
  \ 300 个参数则毫无意义。\n\n> **支持多种参数数量**\n>\n> 你也可以在支持多个参数数量的子程序中使用 `@_` 数组的标量值。例如，\n>\n\
  > ```\n> if (@_ == 2) {\n>     ($fname, $sname) = @_;\n> }\n> elsif (@_ == 3) {\n\
  >     ($fname, $sname, $title) = @_;\n> }\n> ```\n>\n> 或者，你可以使用 `shift` 逐步从堆栈中取出参数。如果你打算使用\
  \ `shift` 方法，那么最好为任何你认为可选的参数设置默认值。\n\n如果你要支持接受多个参数的函数，请记住在测试和赋值之前使用 `my` 声明变量；否则变量将在函数其余部分需要使用之前超出作用域。\n\
  \n#### 参数类型\n\n虽然原型有助于识别应提供的数据类型，但你仍然需要确定子程序内部各个参数将如何被解释。通常的做法是，要么根据已知类型（如果使用引用，则使用\
  \ `ref` 函数）验证每个参数，要么根据有效值进行验证。后者完全取决于脚本，一个很好的例子是期望数值参数的函数：\n\n```\nsub square {\n\
  \    carp \"Not a number\" unless ($_[0] =~ /^[0-9]+$/);\n    return ($_[0] * $_[0]);\n\
  }\n```\n\n同样，我们使用 `carp`（参见第 7 章）来报告问题。此时测试函数的好处在于，无论错误数据从何处引入，错误都会在扰乱脚本正常执行之前被捕获。在这种情况下检查变量类型毫无意义，我们需要验证提供的数据。仅检查\
  \ `ref` 函数返回的字符串仅在提供的数据是对另一个对象的引用时有用，但它仍然可能是有用的。\n\n\n\n\n此外，开发一个能够根据调用位置接受多种参数类型的子程序是个好主意。下面的子程序在为新登录组构建记录时，可以接受一个哈希或哈希引用。如果提供了哈希，则参数列表会在内部转换为哈希引用。如果提供了哈希引用，则直接使用该信息。\n\
  \n```\nsub db_new_group {\n\nmy $group = {\n\n'login' => 1 , 'password' => 11 ,\
  \ 'userlevel' => 0, 'emails' => 0, 'isbns' => 0,\n\n};\n\nmy $info;\n\nif (ref($_[0])\
  \ eq 'HASH') {\n\n($info) = @_;\n\nelse {\n\n$info = {@_};\n\n}\n\nforeach my $key\
  \ (sort keys %{$info}) {\n\n$group->{$key} = $info->{$key};\n\n}\n\nreturn $group;\n\
  \n}\n```\n\n当然，最终结果是一样的——我们返回一个包含组记录的哈希引用——但你已经明白了。\n\n### 默认值\n\n对于接受可变数量和/或类型参数的函数，应将子程序内部使用的变量设置为默认值。这有助于确保当未提供参数时，变量仍然包含有效数据，或者包含一个可以在使用时忽略或测试的值。例如，下面的幂函数将第一个参数提升到第二个参数的幂，如果没有第二个参数，则提升到\
  \ 2 的幂：\n\n```\nsub power {\n\nmy $base = shift;\n\nmy $power = shift || 2;\n\n\
  return $base**$power;\n\n}\n```\n\n第 5 章：程序设计 101\n\n这里我使用了`shift`来取出参数，然后使用`||`运算符在`shift`失败时将`$power`设置为默认值。如果只调用一个参数，函数将返回该值的平方；如果提供两个参数，则返回第一个参数的第二个参数次幂。\n\
  \n### 动态参数\n\n有时函数没有固定的参数顺序，但你仍然希望接受对函数变量的更改。实现方法是接受一个哈希，其中哈希的每个键是你希望接受的变量，值是该变量的数据。这种方法的优点是允许你传递各种标量、数组和哈希，而无需直接关心所提供引用的顺序。\n\
  \n例如，我们可以像这样重写之前看到的`power`函数：\n\n```\nsub power {\n\nmy (%args) = @_; my $base =\
  \ $args{base} || 2 ; my $power = $args{power} || 2; return $base**$power;\n\n}\n\
  ```\n\n这意味着我们现在可以用多种不同的方式调用该函数：\n\n```\nprint power(base => 16, power => 3); # 返回\
  \ 16384\nprint power(base => 16)              # 返回 256\nprint power(power => 8)\
  \              # 返回 256\nprint power();                       # 返回 4\n```\n\n参数顺序不再是问题，这使得在单个子程序中支持默认值和/或多个选项变得容易得多。\n\
  \n### 设计提示\n\n如果你想使用这个选项，考虑使用`'-argument'`作为参数字符串，这样你就不需要每次都引用哈希键——前面的连字符将裸字转换为字符串。\n\
  \n### 返回值\n\n子程序返回的值与子程序对提供的参数所做的操作同样重要。最好从子程序失败时的情况入手来处理返回值，然后再处理有效返回值。但要注意——不要试图返回零或空字符串，因为这些可能是实际的有效值。\n\
  \n例如，我们之前见过的简单加法函数，如果提供的值相加结果为零，它可能会合法地返回零。相反，使用`undef`来表示失败。这被普遍认为是失败的标志，并且在布尔测试中会被正确识别为失败。\n\
  \n102 调试 Perl：程序员故障排除指南\n\n### 开发良好的模块\n\n模块的质量完全取决于你为其提供的子程序——如果子程序不合格，那么无论它们是脚本、模块还是类的一部分，都无关紧要。你应该使用本节前面描述的技巧，以及本章后面“原型”部分中的技巧来开发子程序。\n\
  \n除了构成模块的各个子程序之外，你唯一需要担心的其他组件是用于提供`import`方法的`Exporter`模块的配置，`use`语句在导入模块时会使用该方法。配置模块时，你应该考虑：\n\
  \n- **版本号** 对于跟踪模块版本至关重要，特别是如果模块将要公开发布。\n- **要导出的函数** 对于非基于对象的模块，适当地导出函数或函数集。对于类，不要导出任何东西——类定义的方法应该足够了。\n\
  - **要导出或发布的变量** 对于不支持类的模块，用于调试变量或设置全局选项。\n- **可扩展性** 考虑将模块转换为类。这样做可以更容易地扩展功能，而无需修改其他元素或依赖混乱的“公共”模块变量。\n\
  - **使用`strict`编译指示** 记住`strict`是块作用域的，因此必须在模块以及父脚本中定义它，以启用严格检查。\n- **使用`warnings`编译指示**\
  \ 从 Perl 5.6 开始可用，它会在模块内强制执行警告，即使父脚本没有启用它们。\n\n### 版本号\n\n版本号是跟踪所用模块版本的重要方式，因此也是调试时的重要工具，因为它提供了一个参考点，用于确定实际使用的是哪个版本的模块。\n\
  \n引入版本号最简单的方法是：\n\n```\n$VERSION = 1.01;\n```\n\n如果你使用 RCS 或类似工具，或者想使用多点版本号，则需要以内联子程序的形式定义`$VERSION`——大多数文档推荐这样做：\n\
  \n![picture7](img/picture7.jpg)\n\n记住在版本号的小数点后至少使用两位数字。记住 1.9 大于 1.10，而 1.09 小于\
  \ 1.10。\n\n```\n$VERSION = do { my @r = (q$Revision: 2.21 $ =~ /\\d+/g);\nsprintf\
  \ \"%d.\".\"%02d\" x $#r, @r };\n```\n\n但请注意，这应该写在一行（而不是这里显示的两行），以便与`MakeMaker`模块兼容。\n\
  \n### 导出函数/变量\n\n在决定应该导出哪些对象时，要考虑命名空间——默认导出的对象会污染`main::*`命名空间，这可能会与全局对象和函数使用的名称冲突。你可以避免导出任何东西，然后强制用户显式导入他们需要的对象，或者使用完全限定名称——例如`MyModule::process`。如果你正在创建一个新类（参见本章后面的“开发良好的类”），那么你不需要导出任何东西——继承规则和对象将能够访问它们需要的方法。\n\
  \n`Exporter`模块将提供`use`语句所需的`import`函数来导入函数。在模块顶部所需的最低限度是：\n\n```\npackage ModuleName;\n\
  require Exporter;\n@ISA = qw(Exporter);\n```\n\n包名应反映模块的文件名——记住模块`MyGroup::MyModule`对应文件名`MyGroup/MyModule.pm`。其余语句导入`Exporter`模块，`@ISA`数组定义了继承关系——正是这种继承关系使得`Exporter`中的`import`模块能够被你创建的模块继承。\n\
  \n然后，`Exporter`模块使用`@EXPORT`、`@EXPORT_OK`、`@EXPORT_FAIL`和`%EXPORT_TAGS`中的值来确定哪些对象应该或不应该从模块中导出。\n\
  \n\n\n\n\n`@EXPORT` 数组应用于列出默认从模块导出的对象。`@EXPORT_OK` 数组应列出那些在明确请求时可以导出的对象。例如，\n\n\
  ```\nuse MyModule qw/process regurgitate/;\n```\n\n将导致 `MyModule` 仅导出 `process`\
  \ 和 `regurgitate` 子程序。\n\n`%EXPORT_TAGS` 是一个包含一系列导入集合的哈希；例如，定义\n\n```\n%EXPORT_TAGS\
  \ = ('standard' => [process, regurgitate], 'processing' => [process, parse]);\n\
  ```\n\n可以在调用方中使用\n\n```\nuse MyModule qw/:standard :processing/;\n```\n\n最后，如果你不希望导出任何特定对象，那么命名约定是使用前导下划线；然而这实际上并未强制执行——仍然可以导入带有该前缀的对象。你可以通过将这些对象定义在\
  \ `@EXPORT_FAIL` 数组中来禁用此功能——如果显式请求了该数组中出现的任何对象，`Exporter` 将会终止。\n\n104 调试 Perl：程序员故障排除\n\
  \n### 使用 strict 编译指示导出对象\n\n在使用 `strict` 编译指示时，定义 `@EXPORT`、`@ISA` 以及 `Exporter`\
  \ 模块使用的其他变量存在一个明显的问题——这些变量尚未被显式定义。使用 `my` 是行不通的，因为这会将这些变量对 `import` 方法隐藏，这不是我们想要的效果。解决此问题的最简单方法是使用\
  \ `vars` 编译指示预先声明这些变量，例如：\n\n```\nuse vars qw/@EXPORT @EXPORT_OK @ISA/;\n```\n\n\
  或者，如果你使用的是 Perl 5.6 或更高版本，可以使用 `our` 关键字，效果相同：\n\n```\nour (@EXPORT, @EXPORT_OK);\n\
  ```\n\n### 开发良好的类\n\n我们没有时间深入探讨如何将模块转化为类的具体细节。实际上，这并不复杂——你只需创建一个合适的 `new` 方法来创建新对象并返回一个被祝福到特定类的引用，然后将你的函数转换为接受对象引用作为第一个参数。此外，还有一些方法可以确保你的类被正确创建：\n\
  \n- 使用 `bless` 的双参数形式 这将有助于确保你的对象被显式祝福到正确的类。例如，使用\n\n```\nsub new\n{\n    my $class\
  \ = shift;\n    return bless {}, $class;\n}\n```\n\n或者，如果你想同时支持静态和动态对象创建，请使用以下代码：\n\
  \n```\nsub new {\n    my $self = shift;\n    my $class = ref($self) || $self;\n\
  \    return bless {}, $class;\n}\n```\n\n- 使用类继承 你可以将一个“巨型”类拆分为多个较小的独立类，然后使用继承。将包含多个常用方法的类与继承树结合使用效率更高。\n\
  \n- 使用 `@ISA` `@ISA` 数组是你的继承表；尽可能使用它来从其他模块继承方法，并避免混乱的 `$object->Class::method()`\
  \ 结构。\n\n第 5 章：程序设计 105\n\n- 鼓励方法调用而非函数调用 对于方法调用，你应该宣传（并使用）以下两种形式之一：\n\n```\n$result\
  \ = new Class $arga, $argb;\n```\n\n或\n\n```\n$result = Class->new($arga, $argb);\n\
  ```\n\n来创建新对象。但尽量避免这种形式：\n\n```\n$result = new Class ($arga, $argb);\n```\n\n这看起来太像函数调用，而不是对象构造函数。\n\
  \n- 在构造函数中引发异常 如果你的 `new` 或其他对象构造函数无法创建新对象，应调用 `die`（或 `croak`，如果你愿意），而不是仅仅返回未定义的值。这样可以避免每次测试每个新对象的构造。如果需要，可以使用\
  \ `eval` 捕获异常。\n\n- 使用 `strict` 编译指示 记住 `strict` 是块作用域的，因此它必须在你的模块以及父脚本中定义，以启用严格检查。\n\
  \n- 使用 `warnings` 编译指示 从 Perl 5.6 开始可用，它会在你的模块内强制执行警告，即使父脚本未启用它们。\n\n通过遵循这些指南，并结合本章前面提到的其他子程序和模块技巧，以及我们接下来将要介绍的时间节省技巧，你应该能够创建结构良好的模块和类层次结构。\n\
  \n### 时间节省技巧\n\n所有程序员都试图通过走捷径来节省时间，以便按时完成程序。有些人可能会使用未文档化的特性，但这可能不是一个好的解决方案，因为无法保证相同的技巧在未来的版本中仍然有效——或者就此而言，在之前的版本中也是如此。但有一些真正的编程技巧可以缩短开发时间，并加快调试过程。\n\
  \n抽象是一种节省时间的方法，我们已经在前面章节中介绍过。抽象过程使代码重用变得显著容易，因此意味着我们只需调试一次函数——之后，我们应该使用调试过的版本。这从两个方面节省了时间：开发时间和调试时间都减少了。\n\
  \n我想介绍的其他技巧是原型、调度表和引用。原型帮助 Perl 识别并强制执行你在调用函数时使用的参数。它们的使用至少消除了在向函数提供参数类型或数量时可能引入的一些歧义和错误。\n\
  \n调度表提供了一种快速简便的方法来支持多个选项，而无需重复的 `if...else` 结构。如果设计得当，它们还能确保在调用函数之前该函数存在，\n\n106\
  \ 调试 Perl：程序员故障排除\n\n从而有助于防止关于缺失函数的警告。即使某个特定函数或功能尚未开发，也可以使用调度表——如果没有匹配的函数，可以通知“不支持”的功能，而不会影响脚本其余部分的执行。\n\
  \n引用使函数之间的信息交换更加容易，并且通常可以消除对全局变量的需求。如果使用得当，数组和哈希引用还提供了一种在脚本中分发“记录”的简便方法，而不必使用多个单独的变量。最终，引用导向对象，而基于对象的库更易于使用且不易出错。\n\
  \n### 原型\n\n直到最近，原型一直是 Perl 语言中缺失的特性。Python、C、Pascal 和 Visual Basic 以及许多其他语言都有子程序和函数原型。\n\
  \n字典将原型定义为“一种原始类型、形式或实例，作为后续阶段基于或判断的模型。”在 Perl 中，与其他语言一样，对函数进行原型化告诉 Perl（或正在查看的程序员）该函数期望或需要哪些参数。例如，我们在本书其他地方见过的\
  \ `add` 函数，已经期望传递两个标量变量。在其标准声明格式中：\n\n```\nsub add {\n    return $_[0] + $_[1];\n\
  }\n```\n\n在编译阶段，Perl 无法识别子程序期望什么。它可以接受两个标量、一个两元素数组，甚至一个标量和一个数组——Perl 的自由格式意味着参数列表通常是合并在一起的。该函数可以接受一个包含\
  \ 10000 个元素的列表，即使它只需要前两个。另一方面，如果我们添加一个原型，\n\n```\nsub add($$) {\n    return $_[0]\
  \ + $_[1];\n}\n```\n\n那么如果对 `add` 函数的调用提供了错误的值，解释器将引发错误：\n\n```\nadd(3);\n```\n\n\
  main::add 的参数不足，位于 t5.pl 第 5 行，靠近 \"3)\" 由于编译错误，t5.pl 的执行被中止。\n\n这与 Perl 在向内置函数提供错误类型或数量的参数时生成的错误消息相同，它向程序员表明他们没有正确调用该函数。\n\
  \n第 5 章：程序设计 107\n\n### 使用原型\n\n\n\n\nPerl 使用原型来决定传递给函数的参数数量或类型。原型仅影响使用 `new` 形式（即不带前导\
  \ & 符号）调用的函数调用。如果它看起来像内置函数，Perl 就会将其视为内置函数。如果使用旧的 & 符号风格调用函数，则忽略原型。在所有情况下，Perl 仅在编译时进行检查，因此函数和调用必须在函数编译时可见。由于此规则，子程序原型声明必须在任何对函数的调用之前被解析。要么将函数放在脚本主体之前，\n\
  \n```\nsub add($$) {\nreturn $_[0] +$_[1] ;\n}\nadd(3);\n```\n\n要么必须为函数原型进行“前向”声明：\n\
  \n```\nsub add($ $);\nprint add(3);\nsub add($ $) {\nreturn $_[0]+$_[1];\n}\n```\n\
  \n请注意，前向声明和实际的子程序声明必须匹配，就像在 C 语言中一样。\n\n当使用 `use` 或 `require` 从模块导入子程序时，函数将在脚本主体执行之前被解析。但要注意，通过\
  \ `AUTOLOAD` 系统加载的函数，以及通过 `do` 和 `eval` 动态导入和生成的函数，需要特别小心。\n\n## 原型定义\n\n你可以使用与变量前导字符相同的字符来定义函数接受的参数类型。例如，美元符号表示期望标量值。`@`\
  \ 和 `%` 字符，如预期，指定数组和散列。然而，除了下面提到的情况外，未加反斜杠的 `@` 或 `%` 字符会消耗所有剩余参数，无论原型定义的其余部分如何。此外，`$`\
  \ 表示标量上下文，而 `@` 或 `%` 相应地表示列表上下文。\n\n& 符号要求一个匿名子程序，如果作为第一个参数指定，则可以省略 `sub` 关键字或尾随逗号。`*`\
  \ 字符指定一个类型团（typeglob），通常用于提供文件句柄。\n\n任何反斜杠引用的字符表示该参数必须以该字符开头——例如，`\\@` 要求函数调用将列表作为第一个参数。分号在原型中分隔必需参数（分号之前）和可选参数（分号之后）。表\
  \ 5-1 显示了取自 `perlsub` 手册页的一些示例。\n\n在表 5-1 的最后三个示例中，Perl 对声明的处理略有不同。`mygrep` 函数被解析为真正的列表运算符，第一个参数被解释为匿名子程序，其余参数被识别为原始\
  \ `mygrep` 函数的列表元素。例如，在函数\n\n```\nsub mygrep(&@) {\nmy ($func,@arg) = @_; @arg =\
  \ grep &$func @arg;\n}\n```\n\n中，`$func` 将被填充为对匿名子程序的引用，`@arg` 将包含剩余参数，并对函数施加列表上下文，因此对\
  \ `wantarray` 的调用将返回真。\n\n`myrand` 函数的行为类似于真正的单目运算符，而 `mytime` 函数被视为无参数函数。这意味着你可以使用如下语句：\n\
  \n```\nmytime +2\n```\n\n最终你会得到 `mytime` 的返回值加上静态值，而不是 Perl 用参数 `+2` 调用 `mytime`。\n\
  \n在指定原型时应小心，因为许多选项暗示了函数应返回的上下文，进而影响函数特定的工具，如 `wantarray`。因此，通常只在新函数上使用原型，而不是将它们改造到已编写的函数上。这样做可以避免对期望在列表上下文中返回的函数施加标量上下文的影响。例如，考虑一个带单个参数的函数：\n\
  \n```\nsub printmsg($) {\nprint \"Message: \", shift, \"\\n\";\n}\n```\n\n用返回单个元素列表的参数调用此函数不会产生相同的结果。调用\n\
  \n```\nprintmsg(©message);\n```\n\n实际上会打印值 `L`，因为标量原型强制将提供的列表参数解释为标量。\n\n对于列表，列表变量的标量值是列表中元素的数量。使用像\
  \ `split` 这样根据调用上下文决定结果存放位置的函数，会导致更严重的问题。如果在期望标量的地方用作参数，`split` 将在标量上下文中执行，从而打乱你的\
  \ `@_` 参数列表。\n\n### 调度表\n\n对于支持多种不同选项的脚本和应用程序，有时需要能够从预定义选项列表中选择一个函数或子程序。显而易见的解决方案是使用简单的\
  \ `if` 语句：\n\n```\nif ($command eq 'memory')\n{\n}\nelsif ($command eq 'diskspace')\
  \ {\n}\n```\n\n虽然这是一个完全可以接受的解决方案，但随着脚本和可能函数的规模和复杂性增加，它会变得难以操作和管理。使用 `if` 在执行角度和程序员角度都相对低效。必须“手动”添加每个选项会带来许多问题，并可能引入新错误。引用错误的子程序，或输错参数，之后你将不得不查找并修复问题。\n\
  \n有一种更简单的方法，那就是使用调度表。调度表就是散列，其中散列的键指向特定命令，对应的值指向要调用的函数名称。例如，我们可以将上面的示例改为\n\n```\n\
  Icommands = (memory => \\&memory_report,\ndiskspace => \\&diskspace_report load\
  \ => \\&load_report );\n```\n\n用户提供他们想要执行的命令——直接通过 UI 或 Web 界面，或通过命令行开关。然后你将命令名称与要调用的函数匹配。\n\
  \n为了使过程更安全，并防止用户提供不存在的函数名称，你只需检查散列：\n\n```\nif (exists($commands{$command}))\n```\n\
  \n为了双重确保你不会尝试执行尚未定义的函数，我们需要验证相应的函数确实存在。为此，我们需要将函数引用解析为代码引用，然后可以使用 `defined` 进行检查：\n\
  \n```\n*code = \\&{$commands{$command}}; die \"Function does not exist: $command\"\
  \ unless (defined(&code));\n```\n\n现在，如果用户提供的命令对应的函数尚未开发，用户将得到有用的“命令未实现”错误，而不是因为调用的函数不存在而导致脚本失败。当你添加新功能时，只需更新该表。\n\
  \n你也可以将此系统用于前瞻性规划。当我开发一个使用脚本访问信息的网站时，我总是使用调度表。这样，我可以在输出的 HTML 中引入命令，而无需担心开发支持该命令所需的函数。这样做减少了开发时间，因为我不必回头更新过去的\
  \ HTML 块以添加我一直计划包含的新功能。\n\n### 不使用表的调度表\n\n实际上，我们可以跳过用于保存调度表的散列，直接调用调度函数。以下是一个商业网站脚本的片段，它从浏览器接受\
  \ `action` 和 `subaction` 命令，然后构建函数名称并在调用前检查函数。此示例摘自一个账户管理脚本：\n\n```\nmy $func =\
  \ sprintf(\"%s_%s\",$action,$subaction);\n*code = \\&{$func}; if (defined(&code))\n\
  ```\n\n\n\n\n```\n&code($user,$group,$session);\nelse\ndisplay_account($user,$group,$session);\n\
  ```\n\n这里我们调用相应的函数，如果函数不存在，则直接显示账户信息。这样脚本不会失败，而是为用户提供一种继续执行的方式。\n\n## 第 5 章：程序设计\n\
  \n使用调度表的好处如下：\n\n- 允许根据用户输入进行多个函数调用，而无需使用多选项的`if`语句。\n- 允许你“开发”函数和功能并将其集成到脚本的其他部分，即使该函数可能尚未创建。你只需提供函数定义，脚本即可运行。\n\
  - 你可以扩展和扩充脚本，而无需管理复杂的`if`语句。\n\n据我所知，使用调度表只有一个缺点：你调用的函数必须接收相同的参数列表——你不能在不引入另一个`if`语句的情况下，根据函数/操作名称更改参数列表。在精心设计的脚本中，这不太可能引发问题，因为你在每种情况下可能都会提供相同的信息，只是进行不同的处理。可能还有其他缺点，但在我使用调度表的多年中，尚未遇到其他问题。\n\
  \n### 引用\n\n当在脚本中（尤其是在脚本和模块之间）使用和分发大量信息时，使用引用比直接使用变量要好得多。原因是，当你将引用传递给子程序时，实际上只是提供了指向信息的指针，而不是信息本身。这减少了\
  \ Perl 解释器在调用子程序前将值复制到参数数组，以及在进入子程序后将其复制回来所需的时间。\n\n使用引用，你还可以提供比通常支持更复杂的信息——例如，要提供一条包含静态信息和关键字列表的记录，你可以使用：\n\
  \n```\n$record = { Name => 'MCwords.com',\nAddress => 'http://www.mcwords.com',\
  \ Keywords => ['Perl', 'Python', 'iMac']\n};\nwrite_data($record) ;\n```\n\n这里，记录本身是对哈希的引用，使我们能够命名记录中的各个字段，而`Keywords`字段则指向一个关键字字符串数组。\n\
  \n此外，由于我们处理的是信息的引用，而不是直接处理变量，你可以向函数提供多个数组或哈希，而不会将所有参数合并成一个大的参数列表。例如，要合并多个哈希，你可以使用：\n\
  \n```\nsub merge {\nmy ($from,%hash);\nforeach $from (@_) {\nforeach my $key (keys\
  \ %{$from})\n{\n$hash{$key} = ${$from{$key}};\n}\n}\nreturn %hash;\n}\n%newhash\
  \ = merge(\\%hasha, \\%hashb);\n```\n\n这可能是引用最大的好处——因为使用单个标量来引用信息，它可以在函数之间轻松传递，并且你可以通过`ref`函数了解所提供结构的类型。这也为将一组函数转换为用于类的方法提供了便捷途径。\n\
  \n如果你打算使用引用，我建议你在脚本中对所有形式的复杂信息都使用引用。这样，整个系统就具有一致性，并且你在访问数组或哈希的单个元素时，始终知道应该使用哪种格式。\n\
  \n### 5 引用的引用\n\n实际上，我喜欢对大多数复杂数据结构使用引用，主要是因为我觉得这样更容易发现和提取单个元素，同时还能获得前面提到的其他优点。我还发现，使用花括号和解引用中缀运算符进行显式解引用，比使用简写和组合格式要清晰得多。例如，考虑以下代码：\n\
  \n```\nprint $$record{'A158'}{'Keywords 1 }[0] ;\n```\n\n与以下代码对比：\n\n```\nprint\
  \ $record->{'A158'}->{'Keywords 1 }->[0] ;\n```\n\n后者清楚地表明我们正在引用一个嵌套结构，首先是一个哈希，然后是另一个哈希，最后是一个数组。\n\
  \n而且，当引用整个嵌套结构时：\n\n```\nprint join( 1 ,',@$keywords);\n```\n\n比以下代码更像是一行噪音：\n\n\
  ```\nprint join( 1 , 1 ,@{$keywords});\n```\n\n后一种格式清楚地表明，我们实际访问的是嵌入在引用`$keywords`中的数组。\n\
  \n当然，这完全取决于个人偏好，但如果你编写的代码最终需要可读性（无论是你以后阅读还是其他人阅读），那么请考虑使用更长但更清晰的格式。\n\n### 注释与文档\n\
  \n你上一次回头查看一段代码并想“我当时在做什么？”或“我为什么选择这种方式？”是什么时候？使用注释是让你自己和他人能够读懂代码的好方法——尽管你可能认为自己永远不会忘记某段代码，但现实是，一个月或更长时间后，你需要某种提示来唤醒记忆。\n\
  \n显而易见的解决方案是使用注释来注释脚本的工作方式，以及脚本或模块中不同函数和方法处理的参数和返回值。编写好的注释是一门艺术，我们将看一些好的和不好的例子。\n\
  \n完成项目后，下一步应该是将注释转换为文档，以便其他人无需阅读注释就能理解如何使用你的代码。不过，如果你要正确地记录脚本，为什么还要先写注释再写文档呢？你可以边编写代码边写文档。\n\
  \n### 编写注释\n\n众所周知且不幸的是，大多数程序员要么不写注释，要么只在完成软件后才写注释。这是一个非常糟糕的习惯——不使用注释会使代码难以理解，而在程序完成后写注释会导致引入糟糕的注释，因为你可能无法准确记住某个特定部分设计背后的原因。相反，你应该在编程时编写注释，以确保不会写入错误的信息。\n\
  \n注释是一种在不影响脚本执行的情况下记录你所做工作的明显方式。正如我们已经知道的，你可以使用`#`字符引入注释，该字符之后的所有内容都会被解释器忽略（除非注释包含行指令——更多信息请参见第\
  \ 2 章的“注释”部分）。\n\n编写好的注释需要一定的技巧。例如，在脚本中包含：\n\n```\nprint $message if ($message)\
  \ # 如果存在则打印消息\n```\n\n对你或阅读代码的人不会有太大帮助。相反，你应该这样写：\n\n```\nprint $message if ($message)\
  \ # 打印来自 get_message() 函数的警告消息，\n# 假设返回了有效值。\n```\n\n编写注释时，请考虑注释以下元素：\n\n- 文件头：用于概述文件的用途和内容，并在适当时包含版权声明。\n\
  - 变量名：应注释以解释其用途以及期望包含的数据。\n- 子程序：应注释，至少解释函数期望的参数和返回值。\n- 类：应描述，以便读者理解类的整个范围，但不要描述对象字段或方法。\n\
  - 行内注释：应用于突出显示重要的特定行或部分，但不要标记每一行。\n\n最后，以下是编写注释时应避免的一些事项：\n\n\n\n\n- 不要逐行注释。这对读者可能没有帮助，反而会混淆他们的理解。\n\
  - 不要只是重复代码行。在打印语句旁写“打印消息”是没有用的。\n- 不要“美化”你的注释。添加大量装饰和空白往往会削弱注释的实际内容，而且如果用户需要滚动屏幕才能结合代码阅读注释，那肯定也不会让阅读变得更轻松。\n\
  \n# 编写文档\n\nPerl 文档以一种称为 POD（Plain Old Documentation，纯旧式文档）的简单格式提供。这是一种基于文本的格式，旨在通过\
  \ Perl 脚本简单处理成多种目标格式。与 HTML 类似，POD 格式使用标签来描述文档的各个特性；但 POD 文档具有更严格的结构，并且更专门针对生成目标文档格式的过程。\n\
  \n由于 POD 是一种非常简单的文本格式，因此可以轻松转换为其他更熟悉的格式。例如，POD 文档可以转换为 Unix 机器上易于使用的 man 手册页，以及适用于任何平台的\
  \ HTML。MacPerl 工具包包含一个名为 Shuck 的应用程序，可以直接读取和显示 POD 文档。Perl 发行版中附带了转换器，用于生成 HTML、man、TeX/LaTeX\
  \ 甚至纯文本文件。\n\nPOD 文档也可以嵌入到 Perl 文件（脚本、包等）中。Perl 解释器会忽略 POD 定义，而 POD 阅读器/转换器会忽略 Perl\
  \ 脚本元素。这提供了一种功能，可以提供一个既作为脚本又作为文档的文件，同时兼具两者的灵活性。\n\n# 文档组件\n\nPOD 文档由三种不同类型的段落组成：逐字段落、命令段落和普通文本段落。每种段落类型根据转换器的输出格式以不同方式翻译和处理。\n\
  \n除了这些段落类型之外，还有转义序列，允许你为单词或句子指定替代的打印格式。这包括粗体、下划线文本，以及指向文档其他部分的引用和链接。所有这些元素都由转换脚本转换为合适的目标格式。\n\
  \nPOD 文档没有标准格式或布局，但不同的转换器对源 POD 文件中的不同元素赋予不同的重要程度。我们将在本节后面介绍一个“标准”POD 文档，但请注意，我们在这里讨论的许多结构都可以像任何普通文字处理文档一样，用于创建非常简单的文档。\n\
  \n## 第 5 章：程序设计\n\n### 命令段落\n\n命令段落指定应对给定的单词、句子、段落或节应用某些特殊元素或格式。它通常用于在文档中插入标题、子标题和列表。所有命令段落都以等号（`=`）和一个指定要应用的格式的关键字开头。该段落可能包含一个额外的关键字或引用。例如，段落\n\
  \n`=head1 这是一个主标题`\n\n创建一个一级标题，其文本为“这是一个主标题”。可用命令段落的完整列表见表 5-2。\n\n### 普通文本段落\n\n\
  普通文本段落由转换程序根据目标格式转换为两端对齐和填充的段落。对齐方式完全取决于转换器及其创建的文件阅读器。例如，如果转换为 HTML，则由浏览器处理段落格式；因此普通文本段落将直接复制到目标文件中。\n\
  \n### 逐字段落\n\n逐字段落将在最终文档中完全原样重现；你不能使用格式转义，转换器也不会对段落内容做任何假设。逐字段落通过源文本中的缩进（使用空格或制表符）来标识。逐字段落的最佳用途可能是在文档中重现代码，以确保它在最终文档中显示为可工作的代码。如果没有此功能，代码就会像其他段落一样被两端对齐和填充。\n\
  \n表 5.2 POD 命令段落\n\n### 转义序列\n\n转义序列在普通文本段落和命令段落中都能被识别。转义序列允许你指定一段文本以斜体、粗体、下划线等方式显示。转义序列由一个字母和一对尖括号组成，尖括号内包含要修改的文本。例如，POD\
  \ 片段\n\n`B<Hello World!>`\n\n指定该字符串应显示为粗体，产生\n\nHello World!\n\n注意：最终格式必须支持这种文本格式！\n\
  \nPOD 标准支持的转义序列完整列表见表 5-3。这些序列并不总能正确转换到目标格式，在这种情况下，将由最终的文件查看机制自行解释。\n\n表 5.3 POD\
  \ 转义序列\n\n### 建议的元素\n\n不同的最终格式对 POD 源文档中可以包含和不能包含的内容有不同的要求和限制。乍一看，这似乎会影响 POD 格式的跨平台特性，但实际上它有助于标准化基础的\
  \ POD 文档。\n\n具有最严格规则的转换格式是 man 格式，因为 Unix 手册格式对手册页施加了某些限制和要求，以便信息能够以标准格式进行索引和显示。在\
  \ POD 文档的范围内，这种限制有助于几乎所有生成的文档的格式化和布局。\n\n手册页的格式由表 5-4 中列出的元素组成。元素标题通常以大写字母显示，尽管这不是强制要求，并且每个标题都应使用\
  \ `=head1` 元素引用。子标题可以包含在 `=head2` 元素中。\n\n### 在脚本和模块中嵌入文档\n\n你可以通过以 `=head1` 开始\
  \ POD 部分并以 `=cut` 结束，将文档嵌入到 Perl 脚本中。编译器会忽略两个命令段落之间的 POD 文档。POD 转换器会忽略命令段落之外的任何代码。这样，你\n\
  \n表 5.4 POD 手册页的元素\n\n可以将脚本和文档放在同一个文件中，让编译器和转换器分别解释相应的部分。例如，脚本\n\n```\n=head1 名称\
  \ HelloWorld.pl\n=cut\n\nprint \"Hello World!\";\n=head1 简介\n\n该程序在屏幕上打印 Hello World!。\n\
  =cut\n```\n\n当由编译器解析时，会输出 Hello World!\n\n当由 POD 查看器解析时，会生成文档。\n\n在开发任何脚本时都可以使用此过程，并且在大多数情况下，它可以作为注释的直接替代品，特别是当你用它来记录函数的参数和返回值时。\n\
  \n## 第 6 章：语言/平台迁移指南\n\n![图片 8](img/picture8.jpg)\n\n人们从许多不同的方向来到 Perl。多年在特定语言中根深蒂固的开发习惯，在迁移到新语言时可能会带来问题。大多数学习使用\
  \ Perl 的人都是在从其他语言迁移时开始使用它的。对我来说，多年的 C/C++、shell 脚本和 awk/gawk 编程经验让我感到非常得心应手。\n\n\
  \n\n\n\n这也意味着我犯了很多错误。一些简单的事情，比如要求所有变量都有合适的前缀字符，或者几乎每行末尾都要使用分号，这些无数次让我出错。事实上，有时直到今天它们仍然会让我犯错，尤其是当我刚刚用\
  \ Python 或 shell 脚本编程了一段时间后。\n\n大多数人是从 Python、Visual Basic 这样的语言，或者像 JavaScript\
  \ 甚至 PHP 这样的嵌入式脚本语言转到 Perl 的。本章的第一部分提供了有用的背景信息，针对那些从其他语言转到 Perl 时容易让人陷入的明显陷阱。\n\n\
  另一些人是现有的 Perl 程序员，他们迁移到了不同的平台，尽管仍然使用 Perl。虽然 Perl 试图向普通程序员隐藏大部分差异，但一些依赖于操作系统的内置函数和模块，例如\
  \ `getpwnam` 和 `fork`，可能会引发问题。针对某些主要平台（如 MacOS 和 Windows）有专门的指南，但本章的其余部分将讨论你可能遇到的更通用的问题。\n\
  \n### 语言迁移陷阱\n\n本节列出的大多数陷阱都是让大多数人容易犯错的常见问题。我已经尽力做到尽可能全面，但很难考虑到所有情况。这里涵盖的错误或陷阱可能会解决任何剩余的错误——像缺少引号和终止符这样的简单陷阱产生的错误比实际需要的更多。\n\
  \n### 与 awk/gawk 的差异\n\n- Perl 中的 English 模块允许你使用 awk 用于变量的完整变量名作为记录分隔符（awk 中的 `$RS`\
  \ 与 English 模块中的 `$RS` 相同）。\n- Perl 使用分号表示语句结束；awk 中使用的换行符是不够的。\n- 所有代码块都需要花括号，包括与\
  \ `if` 和 `while` 语句一起使用的块。\n- Perl 中的变量以前缀字符开头——$ 表示标量，@ 表示数组（数字索引），% 表示哈希（字符串索引）。数组和下标中的索引从零开始，字符串中特定字符的引用也是如此。\n\
  - Perl 中的数字比较和字符串比较是不同的。数字比较使用特殊字符，例如 `!=` 表示不等于。字符串比较使用字母；比较字符串时“不等于”的等价形式是 `ne`。\n\
  \n第 6 章：语言/平台迁移指南 121\n\n- 来自文件的输入行必须使用 `split` 函数手动分割。结果将进入你指定的数组，或者如果你没有指定目标，则进入全局\
  \ `@_`（这也会覆盖任何函数参数）。当前输入行（或默认模式空间）在 Perl 中是 `$_`；如果你想要去掉换行符，必须使用 `chop` 或 `chomp`（更好）。\n\
  - 一旦字段被分割，你不能使用变量 `$1`、`$2`（等等）来提取每个字段。这些变量仅在匹配或替换带有分组的正则表达式时才会被填充。要实际从输入行中提取字段，请使用\
  \ `split`。\n- Perl 中的模式绑定运算符是 `=~`，范围运算符是 `..` 而不是 `,`。指数运算符是 `**`。\n- 字段和记录分隔符不会自动添加到用\
  \ `print` 打印的数组中。使用 `$,`（或 `$OFS`）作为字段分隔符，`$\\`（`$ORS`）作为记录分隔符。如果你想连接变量，连接运算符是句点。\n\
  - 文件必须先打开才能打印到它们——使用 `open` 函数为打开的文件分配一个文件句柄，然后使用 `print FILEHANDLE`。\n- 在循环控制中，关键字\
  \ `next`、`exit` 和 `continue` 的工作方式不同。对于 `next`，Perl 总是进入封闭循环的下一次迭代，或者如果提供了名称，则进入命名循环的下一次迭代。Perl\
  \ 中的 `exit` 关键字终止整个脚本。`continue` 语句表示一个代码块，该代码块应在重新评估循环的条件测试之前执行。\n\nawk 中的变量与 Perl\
  \ 中的变量等价，如表 6-1 所示。\n\n表 6.1 awk/Perl 变量差异\n\n122 调试 Perl：程序员故障排除指南\n\n### C 陷阱\n\
  \n在 C 中，大多数陷阱与变量类型和转换有关。Perl 不支持数字和字符串的单独变量类型。Perl 只支持一种标量类型，它可以包含几乎任何数据：\n\n```\n\
  $value = 99; $value = \"String\";\n```\n\n此外，你不能使用下标访问字符串中的单个字符。以下代码将不起作用：\n\n```\n\
  $char = $value [0] ;\n```\n\n它尝试访问数组 `@value` 的第一个元素，而该数组很可能未定义。请使用 `substr` 函数访问单个字符或切片，例如：\n\
  \n```\n$char = substr($value,0,1);\n```\n\n或者，如果你需要遍历数组中的字符，请使用 `split`：\n\n```\n\
  foreach $char (split //,$string)\n```\n\n这也突显了一个性能问题。在处理数组元素时，不要使用索引。例如，你可能会使用以下方式遍历数组：\n\
  \n```\nfor($index=0;$index<scalar(@array);$index++)\n```\n\n相反，请使用 `foreach`：`foreach\
  \ $element (@array)`\n\n所有代码块都需要花括号 {}。语句 `if (1) print \"Hello\";` 在 Perl 中会失败。但是，如果你要执行的语句适合一行，你可以这样做：`print\
  \ \"Hello\" if (1);`\n\nC 中没有 `switch` 语句，尽管你可以在 Perl 中以多种方式模拟它。最明显的是使用混乱的 `if..elsif..else`\
  \ 条件块。注意，Perl 中的第二个测试是 `elsif`，而不是 `else if`。对于 `switch` 语句，一个更好的替代方案（看起来也很熟悉）是：\n\
  \n```\nSWITCH: {\n\n($date == $today) && do {\n\nprint \"Happy Birthday!\\n\";\n\
  \nlast SWITCH;\n\n($date != $today) && do {\n\nprint \"Happy last SWITCH;\n\nUnbirthday!\\\
  n\";\n\n($date\n\n= = $xmas) && do {\n\nprint \"Happy last SWITCH;\n\nChristmas!\\\
  n\";\n```\n\n从这个例子中注意，跳出语句的关键字是 `last`，而不是 `break`。`last` 和 `next` 关键字直接替代了 C 的\
  \ `break` 和 `continue` 关键字。但是，请注意 Perl 版本在 `do { } while` 循环中不起作用。\n\n以下是 C 和 Perl\
  \ 之间其他需要注意的差异：\n\n- Perl 使用特殊字符来标识变量（及其类型）。Perl 中的变量以 $、@ 和 % 开头，分别对应标量（普通变量）、数组和哈希。\n\
  - C 中的 & 符号获取对象的地址；Perl 不支持这一点，尽管你可以使用 \\ 来传递对象的引用而不是对象本身。\n- Perl 脚本的参数通过 `@ARGV`\
  \ 访问，从零开始。第一个（第零个）元素指的是脚本的第一个参数，而不是脚本的名称，脚本名称可以在特殊变量 `$0` 中找到。\n- Perl 的 `printf`\
  \ 函数不接受格式定义中的 * 字符来插入可变字段宽度。但是，由于 Perl 支持变量插值，你可以直接将变量插入格式中，让 Perl 将值插值到格式字符串中。\n\
  - Perl 中的注释以井号开头，一直持续到行尾。它们不需要像 C 的 `/*..*/` 结构那样终止。\n- Perl 内置的系统调用函数（实际上大多数函数）返回非零表示成功，返回零表示失败。在零是有效返回结果的情况下，函数返回\
  \ 0 但为真，当解释为数字时计算结果为零。\n- 使用信号处理程序时，Perl 允许你使用信号名称（不带前缀 SIG）而不是信号编号。\n\n\n\n\n\n\
  Perl 的大部分功能，包括正则表达式语法的主体部分，都继承自 `sed`。两者之间存在一些细微差异，主要与 `sed` 和 Perl 接收及处理数据的方式有关。\n\
  \n正则表达式元素的逻辑分组使用不带反斜杠的括号来指定。例如，在 `sed` 中，行\n\n### sed 陷阱\n\n`s/\\( [A-Z]+\\)/\\\
  l/;`\n\n应写成\n\n`s/( [A-Z]+)/$l/;`\n\n逻辑或运算符也是如此，它同样不带反斜杠。在正则表达式中，带反斜杠的括号或 `|` 运算符会被\
  \ Perl 解释为字面量。替换中的分组引用应使用 `$1` 而不是 `\\1`。另外请注意，在 Perl 中，`$l`..`$xx` 变量通常是全局填充的——它们的值在正则表达式之后即可获得。\n\
  \n最后，在 Perl 中指定值范围时，应使用 `...` 运算符而不是逗号。\n\n注意，有一个翻译器（`s2p`）可用于将 `sed` 程序转换为 Perl\
  \ 等价形式。\n\n### emacs 陷阱\n\n`emacs` 中的正则表达式语法与 `sed` 语法几乎相同。有关差异的详细信息，请参阅上面的“sed\
  \ 陷阱”部分。\n\n### Shell 脚本陷阱\n\n任何 shell 与 Perl 解释器之间最根本的区别在于：Perl 在执行前将程序编译成一系列操作码；而\
  \ shell 则是一次性解释行（有时是块），在遇到剩余代码之前会忽略它们。\n\n变量的插值方式不同。Perl 总是在反引号字符串、双引号字符串、尖括号和搜索模式中对变量进行插值，并且插值只进行一次（不递归）。\n\
  \nPerl 中的变量以 `$`、`@` 和 `%` 开头。在 Perl 中必须始终指定前缀字符。你不能像在 shell 脚本中那样写成\n\n`var = \"\
  Hello\"`\n\n更令人困惑的是，在 shell 脚本中也不能反过来做。例如\n\n`$var = \"Hello\"`\n\n在大多数 shell 中会失败。\n\
  \n还有三个差异值得注意：\n\n- Perl 中的所有语句都必须以分号结尾（除非最后一条语句位于块中）。\n- Perl 中的命令行参数通过 `@ARGV`\
  \ 数组获取，而不是 shell 使用的 `$1`、`$2`（等等）变量；Perl 将这些变量用于分组正则表达式匹配。\n- 特别针对 `csh`，Perl 中反引号的返回值不会以任何方式解析。\n\
  \n### Python 陷阱\n\nPython 和 Perl 是两种截然不同的语言，由于两者在相同的平台上均可使用，选择哪一种通常取决于个人偏好或客户要求。然而，需求决定一切，因此这里列出了一些差异，可能会让试图使用\
  \ Perl 的 Python 程序员感到困惑。这旨在作为你可能出错之处的快速检查清单，而非所有差异的完整列表（那恐怕要写一整本书了！）。\n\n- Perl\
  \ 中的所有语句都以分号结尾，而 Python 实际上没有语句终止符（除了换行符，而且换行符也只是隐含的语句终止符）。\n- Python 中的变量是自由形式的；创建标量、数组或哈希没有区别。你必须记住根据类型指定\
  \ Perl 变量，并使用 `$` 作为标量（字符串或数字）的前缀，`@` 用于数组，`%` 用于哈希（Perl 中对 Python 字典的称呼）。\n- 从数组或哈希中访问元素时，前缀字符会变为\
  \ `$`。例如，以下代码访问数组的第六个元素：\n\n  `print $array [5] ;`\n\n  注意，方括号仍然用于引用单个元素。对于哈希，则使用花括号：\n\
  \n  `print $hash{elem};`\n\n- 在 Perl 中拼接数组元素时，可以使用 `splice` 函数，或者在方括号中使用逗号和列表运算符来定义要拼接的元素（类似于\
  \ Python 中的下标运算符，且名称相同）。对于命名数组，首选 `splice` 函数；对于列表的返回值，应使用下标选项。\n- 在 Perl 中，必须用括号将列表括起来。Python\
  \ 语句 `a, b = 1, 2` 在 Perl 中无法工作，即使加上分号和 `$` 前缀变成 `$a, $b = 1, 2;` 也不行。实际发生的情况是，Perl\
  \ 将一个大语句中的三个独立表达式视为三个表达式；只有 `$b` 会被赋值。应重写为：\n\n  `($a, $b) = (1, 2) ;`\n\n- Perl\
  \ 中的变量是数据的实际存储容器。而在 Python 中，所有数据存储都是通过对象的引用进行的。如果你想将变量引用传递给函数，需要在变量前加上反斜杠，以向 Perl\
  \ 表明这是一个引用。解引用变量时，需要指定要解引用的变量类型。\n- Perl 支持许多内置函数，这些函数提供了 Python 需要外部模块才能实现的许多功能。这些函数包括读写文件、使用网络套接字、处理数组和哈希，以及许多其他功能。\n\
  - Perl 在主解释器中包含了大部分操作系统信息。你可以通过 `%ENV` 哈希访问环境变量，通过 `@ARGV` 数组访问命令行参数，而无需从外部模块导入它们。\n\
  - 外部模块通过 Perl 的 `use` 函数导入，这实际上等同于 Python 的 `import` 关键字。注意，当你 `use` 一个模块时，该函数会被导入到调用包中：\n\
  \n  ```\n  use Cwd;\n  print getcwd();\n  ```\n\n  Python 中用于导入特定函数的 `from` 结构，在\
  \ Perl 中通过在模块名称后附加函数、变量和其他对象的列表来支持。例如，\n\n  ```\n  use Cwd qw/getcwd/;\n  ```\n\n\
  \  等同于 Python 结构：\n\n  ```\n  from Cwd import getcwd\n  ```\n\n- 如果你在 Perl 中使用对象，则调用方法时使用\
  \ `->` 运算符：\n\n  `FILEHANDLE->autoflush(1);`\n\n- Perl 中使用单个句点连接字符串；Python 语句 `\"\
  Hello\" \"World\" \"\\n\";` 在 Perl 中应写成\n\n  `\"Hello\" . \"World\" . \"\\n\";`\n\
  \n  此外，Perl 仅在特定引号内对变量和转义序列（如上例中的换行符）进行插值，不幸的是，单引号不在此列；在 Perl 中，`'Nil'` 的值是由一个反斜杠和小写字母\
  \ \"n\" 组成的字符串。然而，这一特性确实使 `print` 语句更简单。你可以直接将变量放入双引号中，而无需指定打印格式。如果你想要字符串的格式化版本，请使用\
  \ `printf` 函数。\n\n- Perl 不会自动在 `print` 语句后追加换行符；你必须在 `print` 语句中的双引号内某处添加字符串 `\\\
  n`。\n- Perl 中的代码块必须用花括号括起来。`if` 语句如下所示：\n\n  ```\n  if ($test)\n  {\n\n  }\n  ```\n\
  \n  块从左花括号开始，到右花括号结束。\n\n### 平台迁移陷阱\n\n在多个不同平台上编写 Perl 程序时，你往往会认为某些事情是理所当然的。尽管 Perl\
  \ 具有相当好的平台独立性，但如果你不集中注意力，仍有一些差异会让你措手不及。大多数问题相对明显，但有些则晦涩难解。\n\n作为一般规则，不要假设 Perl 在所有平台上都支持所有函数，也不要使用未考虑其来源的数据。\n\
  \n### 函数支持\n\n\n\n\n\n平台之间最明显的差异在于对不同函数和运算符的支持。Perl 的维护者负责尽可能保持跨平台的灵活性。然而，Perl 的\
  \ Unix 根源时常显露出来，如果你在非 Unix 平台上遇到问题，应牢记以下几点：\n\n-   涉及在 `/etc` 目录下的 Unix 文件中查找细节的函数——通常这些函数以\
  \ set 或 get 开头。它们包括所有网络信息例程，以及与组和/或密码信息相关的例程。通常，在特定平台的模块中有对应的替代函数。\n-   调整文件系统元素的函数——虽然所有基本的文件接口选项都能工作，但其他函数，如\
  \ `-X`、`stat`，以及更多 Unix 核心函数如 `chmod` 和 `chgrp`，则不受支持。你还应记住，尽管 MacOS 和 Windows 分别通过别名和快捷方式支持链接的概念，但\
  \ `link` 和 `lstat` 函数通常无法正常工作。\n-   访问操作系统内部表的函数在许多其他平台上也不受支持，尤其是那些返回唯一进程 ID 和组\
  \ ID，或返回进程 ID 的父组和父所有者信息的函数。不过，大多数情况下，`$$` 变量能为你提供足够的信息。\n-   Unix 特有的实用函数通常也未实现，例如\
  \ IPC 系统的 `shm*`、`msg*` 和 `sem*`。\n-   依赖通过命令行式接口按名称运行应用程序能力的函数和运算符可能无法在所有平台上工作。特别是\
  \ MacOS，它没有命令行接口，原生不支持 `system` 函数、反引号或 `qx` 运算符。不过，你可以使用 MPW（Macintosh 程序员工作台）环境提供的\
  \ shell 以这种方式运行某些命令。\n\n你可以在 Perl 发行版附带的 perlport 手册页中找到更最新的列表。\n\n## 常量兼容性\n\n\
  如果你在使用通常需要常量的函数时遇到问题，请确保使用通用名称而非固定数值。虽然理论上用于设置 `fcntl` 和 `ioctl` 等函数选项的常量应该相同，但某些平台使用不同的值。请确保导入\
  \ `POSIX` 模块并使用其中定义的常量名称，而不是使用你自己的值。\n\n此外，在使用 `seek` 函数时，请确保使用 `POSIX` 模块；虽然该函数本身几乎在所有平台上都受支持，但用于向前搜索、向后搜索以及移动到文件开头和结尾的数值在不同平台上可能不同。\n\
  \n## 执行环境\n\nPerl 的执行环境可能对你的脚本产生显著影响。许多问题的出现是因为你依赖了 Perl 之外的信息或能力，而这些信息或能力可能直接在内部可用。下面列出了一些示例：\n\
  \n-   尽量不要依赖 Unix 环境变量或 Perl 的内置变量来获取某些信息。特别要避免使用 `$>` 和 `$<` 以及其他用户/组 ID 变量，这些变量并非在所有平台上都设置。如果你决定在唯一\
  \ ID 或其他标识字符串中使用这些变量之一，这条建议尤其重要。\n-   与上述相关，不要依赖主机名或用户名，尤其是当你打算用它们来存储唯一或标识信息时。\n\
  -   不要依赖你希望执行的命令在 `PATH` 环境变量中可用——请自行设置，或者更好的是，使用应用程序的完整路径。\n-   除非必要，否则不要依赖信号。某些平台支持信号和信号处理程序，其他平台则不支持，而支持的那些平台可能只支持有限的信号集。\n\
  -   使用共享文件、网络套接字或特定平台的模块（如 `Win32::Pipe`）来交换信息。`shm*`、`msg*` 和 `sem*` 函数并非在所有平台上都受支持。\n\
  \n## 错误\n\nPerl 使用 `$!` 变量报告大多数错误，但非 Unix 平台上的特定平台错误可能不包含在内。请记住在非 Unix 平台上报告 `$^E`\
  \ 的信息，或使用特定平台的错误函数，如 `Win32::GetLastError`。\n\n## 行终止符\n\n在多平台上使用 Perl 时，最基本的问题之一是读写文件时的行终止符。不同的操作系统使用不同的字符作为行终止符。具体来说，Unix\
  \ 使用换行符（`\\n` 或 `\\012` 字符）作为终止符，而 MacOS 使用回车符（`\\r` 或 `\\015` 字符）。更复杂的是，DOS/Windows\
  \ 使用回车符加换行符序列（`\\r\\n` 或 `\\015\\012`）。\n\n在大多数情况下，Perl 会自动处理这种差异，但如果你在平台之间传输数据以及脚本，请务必小心。Perl\
  \ 会自动将 `\\n` 解释为当前平台正确的字符或字符序列。在 MacOS 下，Perl 简单地将 `\\n` 解释为 `\\015`，但在 DOS/Windows\
  \ 下，当以文本模式访问文件时，它被解释为 `\\015\\012`。\n\n在非 Unix 平台上，你需要在打开的文件句柄上使用 `binmode` 函数来读取和写入原始数据，并防止\
  \ Perl 自动进行转换。此外，在使用 `seek`、`tell` 和类似函数时要小心——在计算 seek 值时，行终止符不会自动被考虑在内。\n\n当与网络套接字一起使用时，需要更直接的指定。在套接字之间的所有通信中，你应该使用数值而不是它们的字符版本，以确保\
  \ `\\012` 能被正确识别。否则，`\\n` 在两个平台上的解释可能不同。请参阅本节后面关于字符集的讨论。为了简化过程，标准 Perl 发行版中的 `Socket`\
  \ 模块可以为你提供这些值。\n\n```\nuse Socket qw(:DEFAULT :crlf);\nprint \"Message$CRLF\";\n\
  ```\n\n这提供了三个常量变量：`$CR`、`$LF` 和 `$CRLF`，它们分别映射到 `\\015`、`\\012` 和 `\\015\\012`，并且无论你在哪个平台上运行，它们都是相同的。\n\
  \n## 字符集\n\n另一个常见的误解是所有平台都使用相同的字符集。虽然大多数平台确实使用 ASCII 字符集，但你只能依赖前 128 个字符（值 0 到 127，或\
  \ `\\00` 到 `\\0177`）是相同的。即使考虑到这一点，你也不应完全依赖 `chr` 或 `ord` 在不同平台上返回的值。字符集的实际值可能包含各种字符，包括可能带有重音符号的字符，并且可能以任意顺序排列。\n\
  \n自 Perl 5.6 起，Perl 完全符合 Unicode 标准，因此你应该能够保证前 128 个字符与 ASCII 表匹配，每个字符由一个字节表示。更多字符由一个或多个字节表示，并包含许多带重音符号和特殊字符。请参阅\
  \ Perl 附带的 perlunicode 文档。\n\n## 数据差异\n\n不同的物理和操作系统组合使用不同的序列来存储数字。这一特性影响数字在系统之间以二进制格式存储和传输，无论是在文件中还是通过网络连接。解决该问题的方法是使用字符串（当然会以标准形式显示），或者使用\
  \ `pack` 和 `unpack` 函数中的 `n` 和 `N` 网络字节序（参见第 7 章）。\n\n\n\n\n\n### 文件与路径名\n\n三大主流平台使用不同的字符来分隔构成文件路径的目录和文件。在\
  \ Unix 下是 `/`，在 DOS/Windows 下是 `\\`，而在 Mac 上是 `:`。Windows 和 DOS 的实现也允许使用 Unix 的\
  \ `/` 来分隔元素。更复杂的是，只有 Unix 和少数其他操作系统采用单一根目录的概念。\n\n在 Windows 和 DOS 中，各个驱动器或其分区由单个字母加冒号标识。在\
  \ MacOS 下，每个卷都有一个名称，可以放在路径名之前，并使用标准的冒号分隔符。`File::Spec` 模块可以为你创建使用适当字符集和分隔符的路径。同时要注意，不同平台支持不同的文件名和长度。以下是一个粗略的指南：\n\
  \n- DOS 仅支持不超过八个字符的文件名和三个字符的扩展名，且忽略大小写。\n- 在 Windows 95/NT 下，定义稍复杂：完整路径名的最大长度为 256\
  \ 个字符，且区分大小写。\n- 在 MacOS 下，路径的任何元素最多可有 31 个字符，目录内的名称不区分大小写——你不能同时拥有名为 `File` 和 `file`\
  \ 的两个文件。\n- 旧版 Unix 仅支持 31 个字符，但较新版本（包括 Solaris、HP-UX 10.x 及以上版本以及 Linux）每个路径元素支持完整的\
  \ 256 个字符。\n\n你还应尽量将文件名限制为仅使用标准字母数字字符。\n\n### 模块\n\n使用包含平台特定元素或构建时需要 C 编译器的模块时要小心。你无法保证该模块在所有平台上都受支持，甚至无法保证在需要时会有\
  \ C 编译器可用。\n\n### 性能与资源\n\n并非所有平台都拥有 Unix 操作系统看似无限的资源。尽管 Windows 提供了类似的内存接口，但 Windows\
  \ 机器上的可用内存（物理/虚拟）实际上可能远低于典型 Unix 实现下的可用内存——不过随着 RAM 价格下降，这种情况正在改变。MacPerl 必须分配自己的内存块，一旦耗尽，即使有可用内存也无法自动获取新内存。因此，对于任意创建大型内部结构的语句要格外小心，例如：\n\
  \n```\nforeach (1..1000000)\n```\n\n会创建一个包含一百万个元素的列表，占用大量内存。这在 Perl 5.005 中已修复，但早期版本（包括当前基于\
  \ 5.004 的 MacPerl）仍会生成这个巨大的列表。\n\n还要记住，其他操作系统并不提供与 Unix 相同的受保护内存空间或多任务特性。\n\n###\
  \ 平台迁移技巧\n\n我们可以在脚本中做一些事情来识别脚本在哪里以及什么平台上执行。大部分信息对 Perl 解释器来说是标准可用的；其他信息则可通过使用提供的\
  \ Perl 模块获得。\n\n了解以下内容将帮助你提前识别并捕获一些问题：\n\n- 平台和操作系统\n- Perl 版本\n- 支持的函数列表\n\n你还可以使用\
  \ Perl 在构建过程中生成的信息来帮助识别支持的函数和能力。或者，我们可以在正式使用函数之前，使用 `eval` 函数来捕获并测试它们。\n\n作为最后一个技巧，我们将研究函数重载系统，它允许我们在本地实现当前\
  \ Perl 版本不支持的內建函数。\n\n### 确定你的平台\n\n`$ a O` 变量包含当前平台的名称。如果不了解返回名称的含义，提供的信息可能不够详细，但它至少能让你识别出主要平台。或者，你可以使用\
  \ `$Config{'archname'}` 变量的值（通过 `Config` 模块获取），该变量包含当前 Perl 解释器编译时所针对的架构名称。返回的架构字符串包括平台名称和构建二进制文件所用的硬件架构。\n\
  \n注意这里的区别：构建平台和当前平台本质上并不相同，尽管可以安全地假设它们兼容。例如，在 Solaris 2.4 上构建的 Perl 二进制文件也可以在 Solaris\
  \ 2.6 甚至 Solaris 7 上运行。然而，为 Intel 版 Solaris 构建的 Perl 二进制文件不能在 SPARC 版上运行。`$Config{'osname'}`\
  \ 的值会告诉你构建二进制文件所用的操作系统名称。\n\n表 6-2 展示了一些示例操作系统名称以及 `$ a O` 和 `$Config{ 4 archname'}`\
  \ 的值。\n\n在许多平台（尤其是源自 Unix 的平台）上，该值是从 `uname` 返回的结果中提取的。在所有情况下，对于编写跨平台脚本而言，`$ a O`\
  \ 的值可能比架构名称更有用。\n\n表 6.2 操作系统及其内部对应名称\n\n### 确定 Perl 版本\n\nPerl 版本与不同平台上的支持程度关系不大。然而，它有时可以作为某个平台是否存在官方发布版本的有用指标，也可以作为特定功能的有用参考点，无论你正在使用哪个平台。\n\
  \n如果你只想找出正在使用的 Perl 版本，最直接的方法是使用 `$]` 变量检查 Perl 版本。该值是 Perl 解释器的版本号加上补丁级别再除以一千。例如，v5.004\
  \ 表示 Perl 版本 5，补丁级别 4。补丁级别以下的子版本号用于 Perl 的维护版和开发版，表示为发布号除以 100,000；例如 5.00553 由\
  \ Perl 版本 5、补丁级别 5 和开发版 53 组成。维护版发布号从 1 增加到 49，开发版发布号从 50 增加到 99。\n\n自 Perl 5.6\
  \ 起，返回的信息更容易确定。实际上有三个组成部分：主版本号、次版本号和补丁级别。例如，Perl 5.6 的第一个版本实际上是 5.6.0。\n\n你可以使用\
  \ `perldelta` 主页的内容来确定每个 Perl 解释器版本中可用的函数和功能。下一节将介绍无需事先了解即可确定支持函数的具体方法。\n\n如果你想限制脚本仅在特定平台上运行，应使用\
  \ `require` 关键字并传入数值而非字母值。指定的数字被视为执行脚本所需的 Perl 版本。例如，语句\n\n```\nrequire 5.00553;\n\
  ```\n\n施加了一个简单限制：需要 Perl 5.6 才能继续。该值按字面意义处理，即比较传递给 `require` 语句的值与 `$]` 的值。如果 `$]`\
  \ 在数值上大于传递给 Perl 的值，则允许脚本继续执行。因此，要确保脚本仅在最新版本的 Perl 上运行，你可以尝试\n\n```\nrequire 5.6;\n\
  ```\n\n\n\n\n\n## 第 6 章：语言/平台迁移指南\n\n尽管当你读到这部分时，它可能已经过时了。如果指定的值与当前 Perl 解释器不匹配，将会产生运行时错误：\n\
  \n```\nperl -e 'require 6;'\nPerl 6 required - this is only version 5.00553, stopped\
  \ at -e line 1.\n```\n\n### 检查支持的函数\n\n我们之前用来确定构建当前 Perl 解释器的架构和操作系统名称的 `Config`\
  \ 模块，实际上包含了配置过程中发现的所有信息。你可以利用这些信息来确定当前 Perl 解释器支持的函数和扩展。数据以哈希 `%Config` 的形式存储；因此，要查看所有值，你可以使用：\n\
  \n```\nuse Config;\n\nforeach (sort keys %Config) {\n    print \"$_ : $Config{$_}\\\
  n\";\n}\n```\n\n输出的值并不晦涩，但也不直观。底层操作系统函数的键以 `d_` 开头，例如，可以通过以下方式判断 `chown` 是否存在：\n\
  \n```\nprint \"Have chown\\n\" if ($Config{'d_chown'} eq 'define');\n```\n\n其他特性，比如\
  \ Perl 的扩展模块（例如 NDBM、Socket），则位于同一个哈希的其他键中：\n\n```\nprint \"Extensions: $Config{extensions}\\\
  n\";\n```\n\n要检查某个特定函数，可以使用 `eval` 块在其自己的解释器中执行该函数。如果调用失败，`eval` 块会退出，并在过程中设置 `$@`。例如，再次检查\
  \ `chown` 函数，你可以使用：\n\n```\neval { chown() };\nwarn \"chown() $@\" if $@;\n```\n\
  \n由于 `eval` 块在运行时于自己的空间内执行，如果 `chown` 不存在，它会报告一个合适的错误。\n\n### 函数重载\n\n当你希望在一个脚本中支持某个特定操作，而该操作在多个平台上不被支持时，可以考虑开发一个特殊模块，为内置的\
  \ Perl 函数提供个人接口。另一种方法是提供你自己的一组“内置”函数，然后用你自己的版本重载真正的内置函数。你可以通过脚本中的 `BEGIN` 块和 `use\
  \ subs` 编译指令来实现这一点。\n\n下面的代码片段展示了判断哪些函数被支持所需的方法：\n\n```\nBEGIN {\n    eval { chown()\
  \ };\n    push @functions, 'chown' if $@;\n}\nuse subs @functions;\nuse MyBuiltin\
  \ @functions;\nchown();\n```\n\n注意，实际的测试必须在 `BEGIN` 块内完成，以便在编译时而非运行时执行；这样，当编译进行到\
  \ `use subs` 编译指令时，`@functions` 的内容已经填充了所需的信息。\n\n然后，`chown` 的定义被放入 `MyBuiltin`\
  \ 包中，该包的定义与其他包一样：\n\n```\npackage MyBuiltin;\nrequire Exporter; @ISA = qw/Exporter/;\
  \ @EXPORT = (); @EXPORT_OK = qw/chown/;\n\nsub chown {\n    print \"Changed mode!\"\
  ; return 1;\n}\n```\n\n`@EXPORT` 的内容应为空，因为你不想默认导入任何东西。`@EXPORT_OK` 的值包含了你希望支持并在必要时重载的内置函数列表。因此，当你使用一个不支持的内置函数列表调用\
  \ `use MyBuiltin` 时，你会导入你自己的替换列表。在这个例子中，使用了一个简单的 `print` 语句来显示重载正在工作。在实际情况下，你可能希望在你想要重载的函数中放入一些真正的功能。\n\
  \n如果你要测试很多函数，你需要使用循环和引用来测试你想要重载的函数：\n\n```\nBEGIN {\n    @subtest = qw/chown exec/;\n\
  \    foreach $function (@subtest) {\n        eval { &$function };\n        push\
  \ @functions, $function if $@;\n    }\n}\n```\n\n无法通过将 `foreach` 循环放在 `eval` 块内来优化这个循环，因为你使用每个\
  \ `eval` 调用来测试每个函数是否存在。这会影响性能，但整个过程提高了兼容性，这是本章开头讨论的权衡之一。\n\n### 错误捕获\n\n![picture9](img/picture9.jpg)\n\
  \n## 第 7 章：基本错误捕获\n\n![picture10](img/picture10.jpg)\n\n即使是最简单的程序也应该有一些基本的错误检查形式——以最简单的应用程序为例：\n\
  \n```\nprint \"Hello World\\n\";\n```\n\n我们可能会遇到什么问题？嗯，首先，我们不确定 `STDOUT` 文件句柄是否已打开并准备好写入。我们没有测试文件句柄是否打开，也没有测试\
  \ `print` 语句是否成功。如果我们想吹毛求疵，我们甚至没有检查 `print` 函数在当前平台的 Perl 中是否已实现。\n\n所有这些可能看起来有点过分——我们真的需要检查这么多东西，仅仅是为了在屏幕上打印一条简单的消息吗？简单的答案是：不需要；在这个例子中，我们可能确实过分了。事实上，即使我们只检查了我之前提到的一半内容，代码的大小也可能增加十倍。\n\
  \n存在一个我称之为错误捕获点的地方。这是你的脚本从不需要错误捕获转变为需要错误捕获的临界点。有些脚本非常短小或简单，不需要捕获错误，或者如果加入错误捕获会变得过于复杂。在前面的例子中，即使只检查\
  \ `print` 的返回值，也会将脚本增加到四行：\n\n```\nunless(print \"Hello World\\n\") {\n    die \"\
  Can't print!\";\n}\n```\n\n超过错误捕获点之后，你需要错误捕获来确保脚本正确运行，并覆盖可能发生的所有错误和问题的 90%（如果不是\
  \ 100% 的话）。当然，你能检查以及应该检查的内容也有一个上限。例如，在上面的脚本中，如果 `print` 函数无法显示我们的消息，我们会报告一个错误——但如果\
  \ `STDERR` 也被关闭了呢？\n\n在这种情况下，再检查它几乎肯定就过分了，但到底该在哪里划清界限？更重要的是，从哪里开始？你应该检查什么，在什么情况下可以安全地忽略？\n\
  \n本章旨在回答这些问题。为此，我们将研究 Perl 中错误检查和验证的基础知识和机制，以及可用于帮助这一过程的不同技巧和工具。\n\n### 为什么要检查错误？\n\
  \n如果你还不知道这个问题的答案，也许你应该重新考虑你作为程序员的角色！\n\n实际上，检查错误（更重要的是捕获错误）有两个基本原因：\n\n• 捕获错误可以确保你在用户意识到问题之前就发现它。例如，通过错误捕获，你可以避免尝试读取一个你一开始就无法打开的文件这种无意义的操作。\n\
  \n• 通过捕获错误，你可以让用户知道发生了什么，以及为什么程序没有按他们预期的方式运行。\n\n归根结底，这一切都与保护用户有关——要么防止他们做他们本不想做的事情，要么防止你的程序做它不应该做的事情。\n\
  \n### 为你的脚本添加错误检查\n\n你应该在编写脚本时就已经添加了错误检查过程。养成在输入时总是添加基本错误检查序列的习惯并不需要很长时间，但你需要知道哪些函数值得检查，以及如何检查和验证它们的操作。\n\
  \nPerl 中的大多数基本函数和关键字，以及许多标准的 CPAN 扩展模块，都遵循相同的基本格式——如果函数成功完成，则返回真值；如果出现错误，则返回假值。然后你可以通过多种不同的方式捕获错误。\n\
  \n\n\n\n\n### 使用 if\n\n当你需要检查语句的返回值时，`if` 语句是显而易见的选择；例如：\n\n```\nif (open(DATA,$file))\
  \ {\n\n}\n\nelse {\n\ndie \"Woah: Couldn't open the file $!\";\n\n}\n```\n\n当你希望处理两种可能的结果时，这种方法最为有用——如果语句成功，则继续执行这些语句；如果失败，则执行另外的语句。\n\
  \n或者，在合理的情况下，你可以将语句缩减为一行；例如：\n\n```\ndie \"Woah: Something went wrong\\n\" if (error());\n\
  ```\n\n关于何时以及是否使用这种格式的更多信息，请参阅本章后面的“错误检查指南”一节。\n\n### 使用 unless\n\n`unless` 函数是\
  \ `if` 的逻辑相反：语句可以完全绕过成功状态，仅当表达式返回 false 时才执行。例如：\n\n```\nunless(chdir(\"/etc\"))\
  \ {\n\ndie \"Can't change directory!: $!\";\n\n}\n```\n\n140 调试 Perl：程序员故障排除指南\n\
  \n`unless` 语句最适合在表达式失败时引发错误或执行替代操作。当用于单行语句时，它也同样合理：\n\n```\ndie \"Can't change directory!:\
  \ $!\" unless(chdir(\"/etc\"));\n```\n\n这里我们仅在 `chdir` 操作失败时终止，尽管这并不美观。\n\n### 使用条件运算符\n\
  \n对于非常简短的测试，你可以使用条件运算符：\n\n```\nprint(exists($hash{value}) ? 'There' : 'Missing',\"\
  \\n\");\n```\n\n这里不太清楚我们想要实现什么，但效果与使用 `if` 或 `unless` 语句相同。条件运算符最适合在表达式或语句中快速返回两个值之一。\n\
  \n它实际上并不是一个错误捕获语句，因为没有足够的空间来做任何事情，但它可以用来向用户传达状态信息。考虑以下示例：\n\n```\nchdir(\"/tmp\"\
  ) ? print \"Using /tmp\\n\" : warn \"Can't use /tmp: $!\";\n```\n\n这里，这是一种突出潜在问题的有用方式，而无需实际处理它。同样的基本原则可以在函数内部用于返回值：\n\
  \n```\nreturn (©results) ? ©results : undef;\n```\n\n### 使用短路逻辑\n\n在许多情况下，尤其是当你希望立即退出脚本而不实际处理错误时，`or`\
  \ 运算符的短路能力最为有效：\n\n```\nmkdir(\"./tmp\",0755) or die \"Can't make directory!: $!\"\
  ;\n```\n\n有关其工作原理及相关风险的更多详细信息，请参阅第 2 章“符号逻辑或”。\n\n`||` 符号逻辑或也可以用作当首选选项不起作用时提供替代方案的方式。例如，以下代码行：\n\
  \n```\n$host = param('host') || $user->{prihost} || 'azus';\n```\n\n将使用浏览器提供的值，然后是用户配置的值，最后如果其他选项失败，则使用默认值。\n\
  \n### 错误检查指南\n\n有一些通用的指南用于以这种方式测试错误。第一条指南是明确你正在测试什么以及你试图做什么。例如，语句：\n\n```\nif (!open(DATA,$file))\n\
  ```\n\n可以正常工作，但使用 `unless` 语句更有意义，如：\n\n第 7 章：基本错误捕获 141\n\n```\nunless(open(DATA,$file))\n\
  ```\n\n区别在于 `if` 语句读作“如果我没有打开”，而 `unless` 语句读作“除非我能打开”。这是一个微小的区别，但会使代码更易读，从而更易调试。以下是另一个难以阅读的示例：\n\
  \n```\ndie \"Couldn't change directory: $!\" unless(chdir(\"/etc\"));\n```\n\n应改为：\n\
  \n```\nchdir( \"/etc\" ) or die \"Couldn't change directory: $!\";\n```\n\n第二条指南是，你应该明确实际的问题是什么；仅仅报告存在错误是不够的，无论是为了你调试程序，还是为了让用户纠正错误。在相关情况下，还应包含系统错误消息的信息，如\
  \ `$!` 所提供的。同时记住 `$ A E` 变量，它包含非 Unix 平台上的扩展操作系统错误。例如，以下代码行：\n\n```\nopen(DATA,$file)\
  \ or die \"Can't open\";\n```\n\n与以下代码相比毫无用处：\n\n```\nopen(DATA,$file) or die \"\
  Can't open $file: $!, stopped\";\n```\n\n与此相关，你应该始终使用 `warn` 或 `die` 将错误报告给 STDERR。此规则的例外情况是当你使用\
  \ GUI 或基于 Web 的应用程序时，没有逻辑上的 STDERR 文件句柄。有关在没有终端接口的情况下报告错误的信息，请参阅本章末尾。\n\n### 错误检查演练\n\
  \n作为介绍，让我们看一个简单的脚本，它将行逐行从一个文件复制到另一个文件。下面的脚本没有使用任何类型的错误检查：\n\n```\n($filea, $fileb)\
  \ = @ARGV;\nopen(FILEA, $filea);\nopen(FILEB, \">$fileb\");\nwhile(<FILEA>)\n{\n\
  \    print FILEB $_;\n}\nclose(FILEA);\nclose(FILEB);\n```\n\n甚至在到达第一行之前，我们已经遇到了一些问题。首先，我们没有设置\
  \ Perl 发出警告，也没有强制使用 `strict` 编译指示来确保我们没有违反 Perl 提供的某些宽松规则。我们暂时忽略这些问题——实际上我们将在下一章中讨论这些选项的使用和效果。\n\
  \n142 调试 Perl：程序员故障排除指南\n\n### 检查命令行参数\n\n第一行做了几个假设。首先，它假设命令行上提供了信息；其次，它假设你有两条信息，并且它们将是文件名。\n\
  \n我们实际上应该将其改为：\n\n```\nif (@ARGV == 2) {\n    ($filea, $fileb) = @ARGV;\n}\nelse\
  \ {\n    print \"Usage: $0 filea fileb\\n\";\n    exit 1;\n}\n```\n\n我们在这里做了两件事：检查参数数量是否正确，并在不正确时向用户报告有用的消息。注意脚本的术语和内容——我们检查了命令行上恰好有两个参数。如果我们检查的是多于两个参数，那么用户可以提供三个参数，脚本仍然会执行。这个过程本身没有问题，但用户可能会期望其余参数得到处理，因此我们需要强调我们只想要两个参数，而不是我们只需要两个。\n\
  \n### 打开文件\n\n打开文件，或者任何涉及连接到外部数据源的过程，都是你应该始终检查的。如何检查并报告错误取决于具体情况——在这种情况下，如果打开文件失败，我们可能应该调用\
  \ `die`：\n\n```\nopen(FILEA, $filea) or die \"Can't open $filea: $!\";\n```\n\n\
  对于第二个文件，我们需要更复杂的处理。虽然：\n\n```\nopen(FILEB, \">$fileb\") or die \"Can't open $fileb:\
  \ $!\";\n```\n\n可以工作，但它会不加询问地覆盖任何名为 `$fileb` 的文件；如果用户输入了错误的名称，这样做可能有点不友好。相反，让我们先检查文件是否不存在，然后警告用户——由用户决定删除文件或更改要复制到的名称：\n\
  \n```\ndie \"$fileb already exists! Stopping.\\n\" if (-e $fileb);\nopen(FILEB,\
  \ \">$fileb\") or die \"Can't open $fileb: $!\";\n```\n\n注意 `die` 末尾的换行符——它将确保 Perl\
  \ 不会自动添加错误位置；相反，它只打印消息并退出。\n\n### 从文件读取\n\n`while` 循环是按记录逐条读取文件的最有效方法。它处理文件结束条件，并在到达文件末尾时成功退出循环。这里我们实际上没有太多可以改进的地方。\n\
  \n第 7 章：基本错误捕获 143\n\n### 写入文件\n\n将输入行打印到输出的代码行 `print FILEB $_;` 没有特别的陷阱，但稍微修改一下并检查信息是否已正确写入可能是个好主意。我们可以使用\
  \ `unless` 语句来实现：\n\n\n\n\n\n```\nunless(print FILEB $_) {\n    die \"Can't write\
  \ to $fileb ($!)\\n\";\n}\n```\n\n### 关闭文件\n\nPerl 在大多数平台上使用缓冲 I/O，因此在文件正式关闭之前，某些信息不会写入文件。因此，你需要确保文件已关闭且过程成功完成，所以需要检查\
  \ `close` 函数的返回值：\n\n`close(FILEA) or die \"Couldn't close $filea properly: $!\"\
  ; close(FILEB) or die \"Couldn't close $fileb properly: $!\";`\n\n有一种观点认为，仅用于读取的文件不需要检查——毕竟，如果我们没有修改文件，为什么还要检查它是否正确关闭呢？\n\
  \n原因是，我们需要确保已正确读取文件，并且在这种情况下，已到达文件末尾。虽然听起来不太可能，但 Perl 可能会尝试读取一个已被删除的文件——Perl 会将其视为文件结束条件。`close`\
  \ 函数确保我们确实成功关闭了最初打开的文件。\n\n### 最终结果\n\n脚本的大小增加了一倍多，尽管我们可以通过修改格式来减少源代码行数。我们还成功生成了一个脚本，该脚本现在检查了大部分执行过程，以确保我们不会做任何危险的事情，并且信息会反馈给用户，让用户知道发生了什么。\n\
  \n```\nif (OARGV == 2) {\n    ($filea, $fileb) = @ARGV;\n}\nelse {\n    print \"\
  Usage: $0 filea fileb\\n\"; exit 1;\n}\n\nopen(FILEA, $filea) or die \"Can't open\
  \ $filea: $!\";\ndie \"$fileb already exists! Stopping.\\n\" if (-e $fileb);\nopen(FILEB,\
  \ \">$fileb\") or die \"Can't open $fileb: $!\";\n\nwhile(<FILEA>)\n{\n    unless(print\
  \ FILEB $_)\n    {\n        die \"Can't write to $fileb ($!)\\n\";\n    }\n}\n\n\
  close(FILEA) or die \"Couldn't close $filea properly: $!\";\nclose(FILEB) or die\
  \ \"Couldn't close $fileb properly: $!\";\n```\n\n### 需要检查的内容\n\n偏执狂会说“所有内容”，而更放松、随和的人会说“什么都不用检查”。有些语句和操作是你应该始终检查的，无论你是否关心返回值，至少是为了防止脚本做出不该做的事情：\n\
  \n- `open`、`close` 以及相关语句，它们提供了与外部世界的连接（包括 `socket` 和 `tie`）以及外部数据库的连接\n- 从文件或套接字句柄（除了\
  \ `STDIN`、`STDOUT` 或 `STDERR`）读取或写入\n- 如果 `STDIN`、`STDOUT` 或 `STDERR` 在脚本中被重新分配或重定向，则从它们读取或写入\n\
  - 任何对操作系统或文件系统进行更改的操作，包括像 `unlink` 这样的调用\n- 任何改变操作环境（例如 `chdir` 和 `chroot`）或修改 `%ENV`\
  \ 哈希的操作\n- 上述未涵盖的任何系统调用——系统调用总是返回其状态，所以请使用它！\n- 任何依赖于用户输入或提供的信息的操作——不要自动假设用户知道他们在做什么！\n\
  - 任何对外部程序的调用，无论是通过 `open`、`qx` 运算符还是 `system`\n- 当指向内部对象的引用被动态生成时的对象类型——对于代码引用尤其重要\n\
  \n除了这个列表之外，最终取决于操作将如何影响脚本的执行。如果操作会影响后续语句，则需要跟踪并可能捕获它，以防止产生连锁反应。一个很好的例子是，使用零作为除数会引发错误，因此事先检查该值是个好主意。\n\
  \n### 不需要检查的内容\n\n这个列表显然是我们之前列表的反面。除了避免那些我们不需要担心的事情之外，脚本中还有一些不太明显的元素我们可以安全地忽略。大多数情况下，需要避免检查的是那些不会立即对我们试图实现的目标产生影响的内容。\n\
  \n#### 不要检查无关紧要的事情\n\n脚本中有一些事情不值得检查，要么是因为返回值没有意义，要么是因为它们对脚本的执行几乎没有影响。这听起来显而易见，但值得花时间思考这个过程。\n\
  \n这里有一个来自学生项目的例子。该脚本应该询问学生的姓名和出生日期，并计算用户的天数年龄，而不使用任何帮助解决该问题的 Perl 模块。在脚本的最顶部，他写了：\n\
  \n```\nunless (-d $ENV{HOME}) {\n    die \"You have no home!\\n\";\n}\n```\n\n该脚本不需要知道用户主目录的值，也不需要创建任何文件，那么为什么要检查文件系统的任何内容呢？\n\
  \n#### 用户输入\n\n接上一个例子，有时你需要验证用户的输入是否符合特定模式（例如数字），但你不一定需要以高精度检查用户输入：\n\n```\nprint\
  \ \"Enter your name: \"; $name = <STDIN>; chomp $name;\nif ($name =~ /[a-zA-ZO-9\
  \ ]+/) {\n    print \"Hello $name\\n\";\n}\nelse {\n    print \"I dont know who\
  \ you are\\n\";\n}\n```\n\n这里我们可能做得过火了。我们只需要检查用户是否提供了输入；如果他或她输入了错误的姓名或一串标点符号，这不会影响脚本——只是不会达到用户期望的结果。\n\
  \n#### 替换/音译\n\n当通过替换或音译运算符修改变量时，不必检查操作是否成功完成，除非你特别想匹配或识别正则表达式元素。例如，脚本：\n\n```\n\
  $string = 1 hello';\nif ($string =~ tr/a-z/A-Z/)\n{\n    print \"Changed text\\\
  n\";\n}\nelse {\n    print \"Raw\\n\";\n}\n```\n\n可能会给你一些有用的信息，但它实际上并没有检查任何有用的东西——如果音译中的字符没有找到，这并不表示错误，只是意味着没有发生任何更改。\n\
  \n#### 何时停止检查\n\n有时你会做得过火。例如，在我们修改的脚本中，我们检查了调用 `close` 时的结果，但我们从未检查从文件中读取的字节数是否与开始时文件中的字节数匹配。检查该信息毫无意义——要么我们从文件中读取所有内容，要么在某个时刻会引发错误（在这种情况下，可能是在尝试关闭文件时）。另一方面，在某些情况下，检查到这种粒度至关重要——例如，通过网络连接传输数据。\n\
  \n#### 不要重复检查同一件事\n\n用两种不同的方式检查同一件事是没有意义的。通常有一个更简单的、一次性的解决方案可以为我们识别错误。以下是一些程序员常犯的错误：\n\
  \n```\ndie \"$file doesn't exist!\" unless (-e $file);\nopen(FILE,$file) or die\
  \ \"Can't open $file: $!\";\n```\n\n除了第二行永远不会被执行之外，两行之间文件状态发生变化的可能性非常小。此外，如果文件存在，第一个测试可能会通过，即使它可能不可读。通过检查\
  \ `open` 的返回值，我们实际上验证了文件可以被 Perl 打开和读取，而不仅仅是文件的状态。\n\n另一个例子，基本上是在验证相同的信息，尽管每次的粒度不同：\n\
  \n```\nif ($name) {\n    if (length($name) > 0) {\n        if ($name =~ /[a-zA-ZO-9\
  \ ]+/) {\n            print \"Hello $name\\n\";\n        }\n    }\n}\n```\n\n\n\n\
  \n正则表达式会告诉我们提供的信息是否有效。如果表达式匹配失败，我们就会知道要么不匹配，要么提供的值长度不够。\n\n### 函数、返回值和嵌套\n\n如果你遵循了第\
  \ 5 章的指南，你已经知道可以通过分解和调试各个组件来改进脚本并减少错误的数量和影响。你也知道，函数理想情况下应该通过将错误返回给调用者来处理错误，而不是使用自己的错误处理语句来报告问题（有一些例外；参见本章后面的“在模块内报告错误”）。因此，在调用自己的函数时检查错误时，应避免出现如下情况：\n\
  \n```\nsub formatmessage {\n\nmy ($msg) = @_;\n\nif ($msg)\n\n{\n\nreturn \"Hello\
  \ $msg\\n\";\n\n}\n\nelse {\n\nwarn \"No message!\"; return undef;\n\n}\n\n}\n\n\
  $message = formatmessage(undef);\n\nif ($message)\n\n{\n\nprint $message;\n\n}\n\
  \nelse {\n\nwarn \"Invalid message!\";\n\n}\n```\n\n如果你运行这个脚本，会得到如下输出：\n\n```\n\
  No message! at t.pl line 10\\. Invalid message! at t.pl line 22.\n```\n\n我们在两个地方检查了同一件事：一次在函数内部，另一次在主脚本中对返回值进行了检查。完全可以通过让调用者处理错误条件并报告问题来避免这种重复。\n\
  \n这条规则也有例外。有时，在函数内部捕获并在必要时报告问题，同时仍然向调用者返回一个错误条件（必要时可被捕获）更有意义。例如，下面的代码中有一个函数从文件中读取信息并返回给调用者：\n\
  \n```\nsub template {\n\nmy $data = 1 ';\n\nif (open(DATA,\"template\"))\n\n{\n\n\
  $data .= $_ while (<DATA>); close(DATA); return $data;\n\n}\n\nelse {\n\nreturn\
  \ 1 ';\n\n}\n\n}\n\nprint template();\n```\n\n如果模板文件无法打开，则返回一个空字符串——错误仍然被报告，并且确实记录在发生错误的函数中，但我们在调用者中忽略了该错误。我们本可以捕获该信息并提供替代方案，但在这种情况下忽略错误是安全的。\n\
  \n### 错误消息和错误编号\n\n报告错误时，提供操作系统返回的错误信息有助于识别问题。例如，打开文件时，错误可能是由于文件不存在或用户权限不足导致的。Perl\
  \ 使用特殊的 `$!` 变量来保存上次系统错误发生的错误编号或错误字符串。例如，我们可以将打开文件的错误消息更新为：\n\n```\nopen FILE, 'myfile.txt'\
  \ or warn \"Didn't open the file: $!\\n\";\n```\n\n该变量返回数值还是字符串取决于使用它的上下文。如果 Perl\
  \ 期望一个数值，该变量返回数值错误代码。例如，修改后的语句：\n\n```\nopen FILE, 'myfile.txt' or warn \"Didn't\
  \ open the file: \", 0+$!, \"\\n\";\n```\n\n如果文件不存在，将返回错误代码 2。\n\n当在字符串上下文中调用时，该变量返回对应的错误代码字符串。错误代码的信息来自操作系统自身的头文件，消息内容和对应的编号在不同系统上会有所不同。\n\
  \n如果需要，你可以设置 `$!` 的值来确定某个平台的错误消息。如果你想为 `die` 设置错误消息和退出值，也可以使用同样的技巧；例如：\n\n```\n\
  unless(open(DATA,$file)) {\n\n$! = l;\n\ndie \"Couldn't open the file!\";\n\n}\n\
  ```\n\n当脚本终止时，将给出退出值 1。\n\n对于特定平台的错误消息或来自 Perl 正常执行空间之外扩展错误消息，你可以使用 `$ A E` 变量。该变量保存\
  \ Perl 外部或 Perl 用于与操作系统通信的函数引发的错误。例如，在 Windows 下，`$ A E` 变量通常保存通过以下语句返回的信息：\n\n\
  ```\nWin32::FormatMessage(Win32::GetLastError());\n```\n\n但是，不要依赖 `$ A E` 变量总是被填充——很可能该值始终未定义，无论前一个系统调用的结果如何。\n\
  \n### 在脚本内报告错误\n\n当你想报告错误时，最明显的解决方案是使用 `print` 函数，并将输出直接发送到 `STDOUT`，或重定向到 `STDERR`。与普通的\
  \ `warn` 和 `die` 函数相比，`print` 的一个优点是输出也可以重定向到另一个之前打开的文件，用于记录错误（有关基于日志的调试的更多详细信息，请参见第\
  \ 9 章）。\n\n然而，更常用的方法是使用 `warn` 和 `die` 函数直接将错误报告到 `STDERR`。这两个函数的基本格式是：\n\n```\n\
  warn LIST\ndie LIST\n```\n\n本质上，这两个函数是相同的，它们都遵循相同的基本规则：\n\n- 提供的 `LIST` 被连接起来，然后打印到\
  \ `STDERR`。\n- 如果 `LIST` 的最后一个值不以 `\\n` 字符结尾，则会附加当前脚本名称、行号和（来自打开文件的）输入源行号。\n- 如果\
  \ `LIST` 为空且 `$@` 已经包含一个值（来自之前的 `eval` 调用），则字符串 `\"\\t.. .propagated\"`（对于 `die`）或\
  \ `\"\\t.. .caught\"`（对于 `warn`）会被附加到 `$@` 之后，然后与当前脚本名称和行号一起打印。\n\n我们稍后会回到最后一项，因为它特别适用于\
  \ `warn` 和 `die` 与 `eval` 语句一起使用的情况。\n\n这两个函数的主要区别在于，`warn` 只引发一个错误，而 `die` 引发错误并调用\
  \ `exit`。另请参见第 9 章，了解 `warn` 和 `die` 函数引发的信号细节。\n\n### Warn 函数\n\n`warn` 函数只引发一个警告——消息被打印到\
  \ `STDERR`，但不采取进一步操作。除了已经给出的规则外，`warn` 函数还添加了：\n\n- 如果 `LIST` 为空且 `$@` 不包含值，则打印字符串\
  \ `\"Warning: something's wrong\"` 以及源文件和行号。\n\n否则，该函数相当简单：\n\n```\nchdir('/etc')\
  \ or warn \"Can't change directory\";\n```\n\n### Die 函数\n\n`die` 函数的工作方式与 `warn`\
  \ 类似，只是它还会调用 `exit`。在普通脚本中，该函数的效果是立即终止执行。调用 `die` 时脚本给出的返回代码取决于上下文。如果 `$!` 错误变量包含一个值，则将其用作错误代码。如果\
  \ `$!` 为零，则使用 `$!` 右移八位后的值（`$! » 8`）。这可以正确打印通过反引号执行外部程序时检索到的错误编号。如果该值仍然为零，则向 `exit`\
  \ 函数传递值 255。除了已给出的规则外，`die` 函数还添加了：\n\n- 如果 `LIST` 为空且 `$@` 未定义，则打印字符串 `\"Died\"\
  `。\n\n该函数的使用方式与 `warn` 相同：\n\n```\nchdir( 1 /etc') or die \"Can't change directory\"\
  ;\n```\n\n通常建议在 `die` 消息中添加 `\"stopped\"` 或类似内容，以确保脚本异常终止的事实显而易见。\n\n### 传播与 eval\n\
  \n`eval` 函数为等式添加了一些额外规则，尤其是在使用 `die` 时。最关键的区别是，在 `eval` 块内对 `die` 的任何调用都会导致 `$@`\
  \ 变量被填充错误消息（根据之前的规则），并且 `eval` 块立即终止。`warn` 函数对 `$@` 变量没有影响。你可以很容易地验证这一点：\n\n```\n\
  eval {\n\ndie \"Exiting eval\";\n\n}\n\nprint $@;\n```\n\n上述脚本输出：\n\n```\nExiting\
  \ eval at t.pl line 2.\n```\n\n\n\n\n## 第 7 章：基本错误捕获\n\n如果将那个打印语句改为不带参数的 `warn`\
  \ 语句，那么 `$@` 的值会被打印出来，并在末尾附加 `\"\\t...caught\"`，同时还会显示输入脚本和行号。例如：\n\n```\nExiting\
  \ eval at t.pl line 2.\n...caught at t.pl line 4.\n```\n\n另外请注意，`\"\\t...caught\"\
  ` 消息实际上是在打印之前附加到 `$@` 上的——这意味着 `$@` 的值已被更新。如果使用 `die` 而不是 `warn`，那么 `$@` 的值会被打印出来，并在末尾附加\
  \ `\"\\t...propagated\"`，同时还会显示输入脚本和行号：\n\n```\nExiting eval at t.pl line 2.\n...propagated\
  \ at t.pl line 4.\n```\n\n现在，如果你像这样依次调用 `warn` 和 `die`：\n\n```\neval {\n    die\
  \ \"Exiting eval\";\n};\nwarn; die;\n```\n\n你会得到：调用 `warn` 时打印原始的 `$@` 值，以及更新后的\
  \ `$@` 变量和 `die` 信息：\n\n```\nExiting eval at t.pl line 2.\n...caught at t.pl line\
  \ 4. Exiting eval at t.pl line 2.\n...caught ...propagated at t.pl line 5.\n```\n\
  \n这种传播机制在嵌套的 `eval` 块中同样有效，因此：\n\n```\neval {\n    eval {\n        die \"Exiting\
  \ eval\";\n    };\n    die;\n};\ndie;\n```\n\n会生成预期的输出：\n\n```\nExiting eval at\
  \ t.pl line 3.\n...propagated at t.pl line 5. ...propagated at t.pl line 7.\n```\n\
  \n### 指令与标记\n\n特殊标记 `FILE` 和 `LINE` 包含当前执行的行号和该行所在的文件。这些标记由 Perl 自动填充，并且当你提供的字符串不以换行符结尾时，`die`\
  \ 和 `warn` 函数实际使用的就是这些标记。例如：\n\n```\nchdir('/etc')\n    or die \"Can't change dir\
  \ in \", FILE, \" line \", LINE, \"\\n\";\n```\n\n如果切换目录失败，这将打印 `Can't change dir\
  \ in adduser.pl line 35`。\n\n你可以通过使用包含“行指令”的特殊注释来更改这些标记填充的值；例如：\n\n```\n# line 200\
  \ \"Parsing engine\"\ndie \"Fatal error\";\n```\n\n会产生以下输出：\n\n```\nFatal error\
  \ at Parsing engine line 200\n```\n\n需要注意的是，这里给出的行号只是重置了后续代码行的编号——往下三行，错误会被报告为发生在第\
  \ 202 行。行和文件信息是当前输入/源文件独有的，因此当使用 `die` 或类似函数时，信息会相应地被报告。\n\n另外，由于行指令会更新 `FILE` 和\
  \ `LINE` 标记，而这些标记本身又被 `die` 和类似函数使用，因此这些修改将适用于所有用于报告错误的函数和工具。\n\n有关行指令及其识别方式的更多信息，请参见第\
  \ 2 章。\n\n### 在模块内报告错误\n\n虽然我已经说过应该使用函数的返回值将错误信息传回给调用者，但有时你需要在模块内部引发错误。通过突出显示模块特定的错误，你可以更容易地追踪问题，并且可以在模块内引发那些过于严重以至于无法通过\
  \ `if` 语句安全捕获的错误。\n\n我们需要处理两种不同的情况：\n\n- 报告模块中的错误，并引用模块的文件名和行号——这在调试模块时，或者当你特别想引发与模块相关（而非脚本相关）的错误时非常有用。\n\
  - 报告模块中的错误，并引用调用者的信息，以便你可以调试脚本中导致错误的行。以这种方式引发的错误对最终用户很有用，因为它们会突出显示与调用脚本原始行相关的错误。\n\
  \n当从模块内部调用时，`warn` 和 `die` 函数的工作方式与你预期的略有不同——`LINE` 和 `FILE` 标记填充的是模块文件的信息，而不是调用脚本的信息。当你想要识别原始脚本中触发问题的行时，这就会带来问题。例如，简单的模块：\n\
  \n```\npackage T;\nrequire Exporter; @ISA = qw/Exporter/; @EXPORT = qw/function/;\n\
  use Carp;\nsub function {\n    warn \"Error in module!\";\n}\n1;\n```\n\n当从脚本中调用时：\n\
  \n```\nuse T;\nfunction();\n```\n\n会产生以下错误消息：`Error in module! at T.pm line 11.`\n\
  \n这或多或少符合你的预期，但未必是你想要的。从模块程序员的角度来看，这些信息很有用，因为它有助于指出模块本身的 bug。对于最终用户来说，提供的信息相当无用，而且除了经验丰富的程序员之外，完全毫无意义。\n\
  \n假设我们知道该模块仅从调用脚本中导入，我们可以使用 `caller` 函数来识别父级，然后报告错误（更多信息请参见第 9 章）。但这很混乱，而且还需要你知道模块被调用的层级。\n\
  \n解决方案是使用 `Carp` 模块，它提供了一种简化的方法来报告模块内的错误，并返回关于调用脚本（而非模块）的信息。`Carp` 模块提供了四个函数：`carp`、`cluck`、`croak`\
  \ 和 `confess`。每个函数都会根据调用该函数的脚本或包来指定错误的位置。对于深度超过一层的错误，除非使用 `cluck` 或 `confess` 函数来报告堆栈跟踪，否则不会返回调用脚本的信息。\n\
  \n### Carp 函数\n\n`carp` 函数是 `warn` 的基本等价物，它将消息打印到 `STDERR`，但不会实际退出脚本。该模块实际上使用了 `warn`，因此遵循相同的基本规则。因此，这个例子：\n\
  \n```\ncarp \"Error in module!\";\n```\n\n会报告以下内容：\n\n```\nError in module! at test.pl\
  \ line 3\n```\n\n请注意，该函数总是会返回引发错误的调用。如果脚本 `test.pl` 调用模块 `S`，而 `S` 又调用模块 `T`，并且\
  \ `carp` 是在 `T` 中调用的，那么 `carp` 将返回 `S` 中触发错误的调用。\n\n### Cluck 函数\n\n`cluck` 函数是一种增强版的\
  \ `carp`；它遵循相同的基本原理，但还会打印导致该函数被调用的所有模块的堆栈跟踪，包括原始脚本的信息。`cluck` 函数默认不会被模块导出，因此你需要显式导入它。沿用我们\
  \ `test.pl->S->T` 的例子，我们会得到：\n\n```\nError in module! at T.pm line 11\nT::function()\
  \ called at S.pm line 13\nS::raise() called at test.pl line 3\n```\n\n### Croak\
  \ 函数\n\n`croak` 函数是 `die` 的等价物，不同之处在于它报告上一级调用者的信息：\n\n```\ncroak \"Definitely didn't\
  \ work\";\n```\n\n与 `die` 一样，该函数在将错误报告给 `STDERR` 后也会退出脚本：\n\n```\nError in module!\
  \ at S.pm line 13\n```\n\n与 `carp` 一样，关于根据 `warn` 和 `die` 函数包含行和文件信息的基本规则同样适用。\n\
  \n### Confess 函数\n\n`confess` 函数类似于 `cluck`：它会一直打印堆栈跟踪直到原始脚本。\n\n```\nconfess \"\
  Failed around about there\";\n```\n\n例如：\n\n```\nError in module! at T.pm line 11\n\
  T::function() called at S.pm line 13\nS::raise() called at t2.pl line 3\n```\n\n\
  ### 在 GUI 和 Web 应用程序中报告错误\n\n在编写不使用传统命令行/终端界面的应用程序时，应弃用 `die` 和 `carp` 等函数，转而采用更友好的用户解决方案。首先，`STDERR`\
  \ 文件句柄不太可能向用户打印任何有用的信息。对于 Tk 应用程序，可能根本没有 `STDERR`；对于 Web 应用程序，`STDERR` 的输出会写入服务器的错误日志。\n\
  \n\n\n\n\n对于任何交互式应用程序，在脚本中调用 `die` 也会导致应用程序立即终止。在基于 Tk 的应用程序中，这可能会导致用户丢失信息，此外还会因应用程序突然崩溃而给用户带来压力！\n\
  \n对于 Web 应用程序，同样的规则也适用，尽管原因不同。立即终止一个可能尚未向用户传递任何信息、或正处于返回信息过程中的脚本，会导致返回的页面基本不可用。诸如“文档不包含数据”或表格无法显示等错误，就是典型错误处理系统失效的例证。\n\
  \n因此，解决方案是提供一种更合适的方式来报告错误状态（无论是致命错误还是其他错误），同时不中断或影响应用程序的其他流程。这正是脚本良好功能设计发挥作用的地方——你可以在错误发生后从函数返回，而不影响后续执行。\n\
  \n在 Tk 中，这意味着要捕获错误，提供一个对话框来警告用户，然后返回到用户可以重试或放弃的状态。对于 Web 应用程序，则更侧重于在提供错误消息的同时，仍然提供其他所需的页面元素。\n\
  \n### Tk 对话框\n\nTk 模块和库提供了一个 `Dialog` 控件，它向用户呈现一个模态对话框，等待用户按下其中一个按钮以继续。该模块的返回值是被按下按钮的文本。\n\
  \n```\n$response = $main->Dialog(\n    -text       => 'Overwrite File?',\n    -bitmap\
  \     => 'warning',\n    -title      => 'Warning',\n    -default_button => 'Cancel',\n\
  \    -buttons    => [qw/OK Cancel/]\n);\n```\n\n这个位图规范实际上选择了 Tk 库附带的预定义位图之一。`warning`\
  \ 位图是一个感叹号；其他可能的位图包括 `error`、`gray75`、`gray50`、`gray25`、`gray12`、`hourglass`、`info`、`questhead`\
  \ 和 `question`。\n\n或者，你也可以创建自己的对话框。以下脚本提供了一个简单的 `dialog` 函数，它模仿了 Tk `Dialog` 控件的基本功能：\n\
  \n```perl\n#! /usr/local/bin/perl -w\n\nuse Tk;\n\nsub dialog {\n    my ($master,\
  \ $title, $text, $bitmap, $default, @butdefs) = @_;\n\n    $w = MainWindow->new();\n\
  \    $w->title($title);\n    $w->iconname('Dialog');\n\n    $top = $w->Frame(relief\
  \ => 'raised', borderwidth => 1);\n    $top->pack(side => 'top', fill => 'both');\n\
  \    $bot = $w->Frame(relief => 'raised', borderwidth => 1);\n    $bot->pack(side\
  \ => 'bottom', fill => 'both');\n\n    $msg = $top->Message(\n        width => '3i',\n\
  \        text  => $text,\n        font  => '-Adobe-Times-Medium-R-Normal-*-180-*'\n\
  \    );\n    $msg->pack(\n        side   => 'right',\n        expand => 1,\n   \
  \     fill   => 'both',\n        padx   => '3m',\n        pady   => '3m'\n    );\n\
  \n    if (defined($bitmap)) {\n        $bm = $top->Label(bitmap => $bitmap);\n \
  \       $bm->pack(\n            side => 'left',\n            padx => '3m',\n   \
  \         pady => '3m'\n        );\n    }\n\n    my $i = 0;\n    my $retval = 0;\n\
  \    my %buttons;\n    my %revbutton;\n\n    foreach $but (@butdefs) {\n       \
  \ my $b = undef;\n        if ($i == $default) {\n            $bd = $bot->Frame(relief\
  \ => 'sunken', borderwidth => 1);\n            $bd->pack(\n                side\
  \   => 'left',\n                expand => 1,\n                padx   => '3m',\n\
  \                pady   => '2m'\n            );\n            $b = $bd->Button(text\
  \ => $but);\n            $b->configure(command => sub { $retval = $revbutton{$b}\
  \ });\n            $b->pack(\n                in     => $bd,\n                side\
  \   => 'left',\n                padx   => '2m',\n                pady   => '2m',\n\
  \                ipadx  => '2m',\n                ipady  => '1m'\n            );\n\
  \        } else {\n            $b = $bot->Button(text => $but);\n            $b->configure(command\
  \ => sub { $retval = $revbutton{$b} });\n            $b->pack(\n               \
  \ side   => 'left',\n                expand => 1,\n                padx   => '3m',\n\
  \                pady   => '3m',\n                ipadx  => '2m',\n            \
  \    ipady  => '1m'\n            );\n        }\n        $buttons{$i} = $b;\n   \
  \     $revbutton{$b} = $but;\n        $i++;\n    }\n\n    if ($default >= 0) {\n\
  \        $w->bind('<Return>', sub { $buttons{$default}->flash(); $retval = $default\
  \ });\n        $w->waitVariable(\\$retval);\n        $w->destroy();\n        return\
  \ $retval;\n    }\n}\n\n$ret = dialog(undef, \"Warning\", \"Overwrite file?\", 'warning',\
  \ 1, \"OK\", \"Cancel\");\nprint \"Button $ret was pressed\\n\";\n\nMainLoop();\n\
  ```\n\n你可以在脚本底部看到如何使用这个新对话框函数的示例。与标准的 `Dialog` 控件一样，你可以显示合适的位图，并设置一个默认选项，当用户按下回车键时会自动选择该选项。\n\
  \n如何处理这两个函数的返回值显然完全取决于你和你的脚本。在前面的示例中，我们检查用户是否想要覆盖文件，这通常是在文件保存对话框或保存命令的结果中触发的。请记住，你始终要防止脚本在未给用户任何警告的情况下突然退出。\n\
  \n### Web 错误报告\n\nWeb 错误报告更为复杂，因为错误可能在两个节点引发问题：在信息返回给用户之前，以及在响应过程中。\n\n前者的问题是，你需要定义一个函数，该函数不仅要报告错误消息，还要将必要的\
  \ HTTP 头信息发送回用户以显示消息。通常的格式是定义如下函数：\n\n```perl\nsub weberror {\n    my ($message)\
  \ = @_;\n    print \"Content-type: text/html\\n\\n\";\n    print $message;\n}\n\
  ```\n\n这很简单，但能完成任务。另一种避免将 HTTP 头嵌入错误报告函数的方法是尽早发送 HTTP 头，这样任何错误都会自动报告给用户。例如，经常可以看到以下代码：\n\
  \n```perl\nBEGIN {\n    print \"Content-type: text/html\\n\\n\";\n    close(STDERR);\n\
  \    open(STDERR, '>&STDOUT');\n}\n```\n\n这不仅在脚本一开始就返回了 HTTP 头信息，还重定向了 `STDERR`\
  \ 文件句柄，这样我们就可以使用 `warn` 向用户报告错误信息。但这种方法仅在你计划在所有情况下都返回 HTML 时才有效——如果你想返回非标准的 HTTP\
  \ 头或返回其他文件类型，则必须在运行时确定要报告的错误类型。\n\n关于执行过程中的错误报告，基本原则是确保错误报告不会影响其他元素。例如，假设我们有一个动态生成的\
  \ HTML 表格，使用之前从数据库中提取的信息：\n\n```perl\nprint \"<table>\\n\";\n%data = get_db_data();\n\
  foreach $key (sort keys %data) {\n    print \"<tr><td>$key</td>\";\n```\n\n此时引发错误会导致问题：我们会在表格行内但单元格外插入文本——这会导致信息显示在表格之外。相反，要么构建一个可以在表格完成后打印的错误消息，要么在开始输出表格的循环之前检查信息。\n\
  \n尽管这是一个 HTML 错误，但使用表格的网页突然提前终止通常表明缺少必要的 `</table>` 结束标签。你可以通过使用 `END` 块在 Perl 中输出任何必要的尾部代码来解决这个问题。\n\
  \n### 错误监控\n\n当处理使用表格进行布局的复杂 HTML 站点时，技巧是使用函数和抽象来将显示的不同组件与动态生成的元素分离开来。例如，以下片段来自一个显示用户账户信息的脚本：\n\
  \n```perl\nprint \"Content-type: text/html\\n\\n\";\n\nprint parse_template('topbar',\n\
  \    'login'     => $session->{user},\n    'sessionid' => $session->{sessionid},\n\
  );\n\nprint parse_template('sidebar',\n    'sessionid' => $session->{sessionid},\n\
  );\n\ndisplay_account($user, $group, $session);\n\nprint parse_template('closepage',\n\
  \    'sessionid' => $session->{sessionid},\n);\n```\n\n\n\n\n\n模板是在执行过程中动态读取的静态文件，而\
  \ `display_account` 函数负责完成所有工作。模板本身定义了一个复杂的表格，为布局提供了基础，当组合在一起时，前面的一系列表格将提供只能算作空白页的内容。\n\
  \n然后，`display_account` 函数可以自由地以任何方式显示信息或报告错误。任何错误都通过 `print` 显示，并成为整个页面的一部分，而不影响布局。任何致命错误都会导致\
  \ `return`，而不是调用 `die` 或 `warn`，以便页面的其余部分能够正常显示。\n\n## 第 8 章\n\n### 使用编译指示和警告\n\n\
  ![picture11](img/picture11.jpg)\n\n162 调试 Perl：程序员故障排除指南\n\n冒着重复的风险，Perl 是一种非常模糊的语言。DWIM（按我的意思做）哲学——实际上被\
  \ Perl 解析引擎的某些领域所使用——只是加剧了这种模糊性。这些歧义的问题在于，它们往往是错误和问题的根源，而你甚至没有意识到它们的影响。\n\n有办法绕过这些问题——遵循本书第一部分的指南会有所帮助。你也可以使用本节其余部分的调试技巧来追踪和解决问题。更好的解决方案是让\
  \ Perl 审视它所做的决定，并在解析和编译过程中突出代码中的歧义。\n\n有两种基本方法：第一种是启用警告，第二种是使用各种 Perl 编译指示来控制脚本的解析和执行。警告是突出显示那些歧义以及\
  \ Perl 认为你可能实际意思不同的代码点的好方法。编译指示则改变了 Perl 看待代码的方式。例如，`strict` 编译指示会对某些元素——变量定义和可能引发编译时致命错误的模糊引用——执行更严格的检查。\n\
  \n### 警告\n\n警告是让 Perl 检查你编写的代码质量的最基本方法之一。顾名思义，它们只是针对某个特定结构发出简单警告，Perl 认为该结构要么有潜在危险，要么足够模糊，以至于\
  \ Perl 可能对你试图做的事情做出了错误判断。\n\n实际上有两种类型的警告：强制性警告和可选警告：\n\n- 强制性警告突出显示词法分析阶段的问题。\n\
  - 可选警告突出显示 Perl 发现可能异常的情况。\n\n作为粗略指南，Perl 警告系统会在以下情况下发出警告：\n\n- 尝试写入以只读方式打开的文件句柄\n\
  - 尚未打开的文件句柄\n- 在关闭后尝试使用的文件句柄\n- 对未定义文件句柄的引用\n- 重新定义的子程序\n- 在标量变量被赋值之前访问其值\n- 递归嵌套超过\
  \ 100 层的子程序\n- 变量的无效使用——例如，将标量用作数组或哈希\n- 用作数值但实际无法解析为数字的字符串\n- 仅出现一次的变量\n- 已弃用的函数、运算符和变量\n\
  \n第 8 章：使用编译指示和警告 163\n\n24x7\n\n警告应在所有脚本中默认启用——你会发现比任何调试都能发现更多的错误和未来可能发生错误的区域。养成在执行脚本时添加\
  \ `-w` 命令行参数的习惯，从长远来看，这将为你节省大量时间。\n\n代码中的这些错误并不严重到完全停止执行，但你可以让 Perl 足够担心它们，从而在编译期间发出警告。例如，代码\n\
  \n```\n$string = \"Hello\";\n```\n\n如果关闭警告，将通过编译器检查，但如果你打开警告，你会得到一个关于仅使用一次的术语的错误：\n\
  \n```\nName \"main::string\" used only once: possible typo at -e line 1.\n```\n\n\
  启用警告的传统方法是在命令行中使用 `-w` 参数：\n\n```\nperl -w myscript.pl\n```\n\n你也可以在“shebang”行中提供该选项：`#/usr/local/bin/perl\
  \ -w`\n\n但要注意，在某些操作系统上，命令行选项可能会限制 shebang 行的长度或可提供的参数数量。\n\n你还可以使用 `$ A W` 特殊变量启用警告。较旧版本的\
  \ Perl 包含 `warnings` 编译指示，它可以在脚本内启用警告，而无需命令行选项。该编译指示在 Perl 5.6 中进行了更新，变得更加灵活——它甚至允许你确定显示哪种类型的警告。\n\
  \n### `$ A W` 变量\n\n`$ A W` 变量允许你在脚本内更改——或发现——当前的警告设置。如果设置为零，该变量会禁用警告；如果设置为 1，则启用警告。不过，通常不建议使用该变量——尽管它可以用于在词法基础上启用警告，但它存在太多潜在问题。例如，可能会在不知情的情况下意外重置警告设置。此外，很难区分编译时警告和运行时警告。\n\
  \n理想情况下，你应该使用命令行选项，或者使用此处概述的 `warnings` 编译指示。\n\n164 调试 Perl：程序员故障排除指南\n\n**表 8.1\
  \ warnings 编译指示的选项**\n\n| 选项 | 描述 |\n|------|------|\n\n### 旧的 `warnings` 编译指示\n\
  \n较旧版本的 Perl 也支持一个简单的编译指示，允许你在脚本内打开和关闭警告，而无需使用命令行。选项相当有限，实际上你只能选择三个选项：`all`、`deprecated`\
  \ 和 `unsafe`，如表 8-1 所示。你可以通过以下方式打开选项：\n\n```\nuse warnings 'all';\n```\n\n或者使用 `no`\
  \ 关闭警告：\n\n```\nno warnings 'deprecated';\n```\n\n### Perl 5.6 中的词法警告\n\nPerl 5.6（于\
  \ 2000 年 4 月初发布）略微改变了 `warnings` 编译指示处理警告的方式。这种新方法现在实际上是启用警告的首选方式，并且比传统的命令行开关或 `$\
  \ A W` 变量有一些优势：\n\n- 强制性警告成为默认警告，并且可以禁用。\n- 警告现在可以限制在与 `strict` 编译指示相同的范围内——也就是说，它们被限制在封闭块内，并传播到使用\
  \ `do`、`use` 和 `require` 导入的模块。\n- 你现在可以指定生成的警告级别。\n- 可以使用 `no` 关键字在单个代码块内关闭警告。\n\
  - 可以控制强制性警告和可选警告。\n\n24x7\n\n如果你使用的是 Perl 5.6，请使用 `warnings` 编译指示而不是 `-w` 命令行开关来启用警告。然而，与\
  \ `-w` 命令行选项一样，你应该始终使用它，而不仅仅是在你认为可能有问题的时候。事实上，养成在脚本顶部同时放置 `warnings` 和 `strict`\
  \ 编译指示的习惯。\n\n第 8 章：使用编译指示和警告 165\n\n例如，代码\n\n```\nuse warnings;\n\n$a;\n\n{\n \
  \   no warnings; $b;\n}\n\n$c;\n```\n\n产生以下输出：\n\n```\nUseless use of a variable\
  \ in void context at t2.pl line 2.\nUseless use of a variable in void context at\
  \ t2.pl line 7.\nName \"main::a\" used only once: possible typo at t2.pl line 2.\n\
  Name \"main::c\" used only once: possible typo at t2.pl line 7.\n```\n\n第 5 行中 `$b`\
  \ 的使用不会引发错误。要在块内启用警告，请使用以下之一：\n\n```\nuse warnings;\nuse warnings 'all';\n```\n\n\
  并在块内关闭警告：\n\n```\nno warnings;\nno warnings 'all';\n```\n\n更具体的警告控制将在本节剩余部分描述。\n\
  \n### 命令行警告\n\n传统的 `-w` 命令行选项现在已被替换为\n\n| 选项 | 描述 |\n|------|------|\n\n\n\n\n`-X`\
  \ 与 `-W` 完全相反，它会关闭所有警告，忽略 `$ A W` 变量或 `warnings` 编译指示的影响。\n\n这些开关与 `$ A W` 变量以及新的词法警告按照以下规则交互：\n\
  \n- 如果未提供任何命令行开关，且 `$ A W` 变量和 `warnings` 编译指示均未生效，则启用默认警告，禁用可选警告。\n- `-w` 会正常设置\
  \ `$ A W` 变量。\n- 如果某个代码块使用了 `warnings` 编译指示，则 `$ A W` 和 `-w` 标志都会被忽略。\n- 通过 `warnings`\
  \ 编译指示启用/禁用的词法警告只能被 `-W`/`-X` 命令行开关覆盖。\n\n**警告选项**\n\n除了对警告的正常控制外，现在还可以通过向编译指示提供警告名称作为参数来定义哪些警告会被触发。例如，你可以开启特定警告：\n\
  \n```\nuse warnings qw/void syntax/;\n```\n\n或者关闭特定警告：\n\n```\nno warnings qw/void\
  \ syntax/;\n```\n\n效果是累积的，而非显式的，因此你可以将上述代码重写为：\n\n```\nno warnings 'void'; # 禁用\
  \ 'void' 警告\nno warnings 'syntax'; # 在禁用 'void' 的基础上，再禁用 'syntax' 警告\n```\n\n`warnings`\
  \ 编译指示实际上支持一个可启用或禁用的分层选项列表；你可以在表 8-2 中看到这个层次结构。例如，`severe` 警告包含 `debugging`、`inplace`、`internal`\
  \ 和 `malloc` 警告选项。\n\n**使警告致命**\n\n通常，警告只会报告到 `STDERR`，而不会实际停止脚本的执行。你可以通过在导入编译指示模块时将选项标记为\
  \ `\"FATAL\"` 来改变这一行为：\n\n```\nuse warnings FATAL => qw/syntax/;\n```\n\n**在脚本中获取警告参数**\n\
  \n在编写模块时，你可以配置警告，使其注册到警告发生的模块中。这实际上在警告层次结构中创建了一个新类别。要将模块注册到警告系统中，你需要导入 `warnings::register`\
  \ 模块：\n\n```\npackage MyModule;\nuse warnings::register;\n```\n\n这会创建一个名为 `\"MyModule\"\
  ` 的新警告类别。当你将模块导入到脚本中时，可以指定是否启用该模块类别中的警告：\n\n```\nuse MyModule;\nuse warnings 'MyModule';\n\
  ```\n\n要实际判断模块中是否已启用警告，你需要使用 `warnings::enabled` 函数。如果不带参数调用，当警告已启用时返回真。例如：\n\n\
  ```\npackage MyModule;\nsub test {\n    if (warnings::enabled()) {\n        warnings::warn('deprecated',\
  \ 'test is deprecated, use the object io');\n    }\n}\n```\n\n`warnings::warn` 函数实际上会触发一个警告——注意，即使警告被禁用，它也会引发错误，因此请确保你测试了警告是否已启用。另外请注意，`warnings::warn`\
  \ 函数接受两个参数——第一个是用于描述警告的单词，第二个是与警告一起打印的附加文本消息。因此，这一行：\n\n```\nwarnings::warn('deprecated','test\
  \ is deprecated, use the object io');\n```\n\n实际上会产生：\n\n```\ntest is deprecated\
  \ use the object io at t2.pl line 5\n```\n\n函数名会首先被插入——如果是在全局作用域内，则插入包名或文件名——就像核心的\
  \ `warn` 函数一样。\n\n你也可以更具体地指定要测试的警告类型；如果你向 `warnings::enabled` 函数提供参数，它仅当指定的警告类型已启用时才返回真：\n\
  \n```\nif (warnings::enabled('deprecated'))\n```\n\n**`strict` 编译指示**\n\n`strict`\
  \ 编译指示限制了那些通常被认为不安全或模棱两可的结构和语句。与警告不同（警告会引发错误但不会导致脚本失败），`strict` 编译指示如果违反了它所强制执行的任何限制，将停止脚本的执行。尽管该编译指示施加的限制会导致脚本失败，但它通常鼓励（甚至强制）良好的编程实践。当然，对于一些临时脚本，它带来的问题可能比你试图解决的问题还要多。\n\
  \n该编译指示的基本形式是：\n\n```\nuse strict;\n```\n\n与警告一样，你应该始终启用 `strict` 编译指示。它将帮助你捕捉更多那些脚本可能在没有警告的情况下失败的模棱两可的情况。它不能替代完整的调试器，但会突出显示正常调试过程可能忽略的问题。\n\
  \n该编译指示是词法作用域的，因此它仅在当前代码块内生效。这意味着你必须在创建的所有包、模块和独立脚本中分别指定 `use strict`。如果一个使用了 `strict`\
  \ 编译指示的脚本导入了一个未使用它的模块，则只有脚本部分会被检查——编译指示的效果不会传播到其他模块。\n\n通过使用该编译指示，你应该能够识别 Perl 对你试图实现的目标所做的假设的影响。它通过限制变量、引用和裸字（否则会被解释为函数/子程序）的定义和使用来实现这一点。这些限制可以通过编译指示的\
  \ `vars`、`refs` 和 `subs` 选项单独开启或关闭。在导入相应模块时，你将选项作为参数提供给编译指示。例如，要仅启用 `refs` 和 `subs`\
  \ 选项，请使用以下代码：\n\n```\nuse strict qw/refs subs/;\n```\n\n效果是累积的，因此可以重写为：\n\n```\n\
  use strict 'refs';\nuse strict 'subs';\n```\n\n该编译指示还支持通过 `no` 关键字关闭它，因此你可以临时关闭严格检查：\n\
  \n```\nuse strict;\nno strict 'vars';\n$var = 1;\nuse strict 'vars';\n```\n\n除非你有非常特殊的理由不这样做，否则我建议使用基本的\
  \ `strict` 来启用所有三个级别的检查。\n\n**`vars` 选项**\n\n`vars` 选项要求所有变量在使用前必须预先声明，可以通过 `my`\
  \ 关键字、`use vars` 编译指示，或者通过包含要定义变量的封闭包名的完全限定名称来声明。\n\n使用该编译指示时，`local` 关键字是不够的，因为它的目的只是局部化一个变量，而不是声明它。因此，以下示例可以工作：\n\
  \n```\nuse strict 'vars';\n$Module::vara = 1;\nmy $vara = 1;\nuse vars qw/$varb/;\n\
  ```\n\n但以下示例会失败：\n\n```\nuse strict 'vars';\n$vars = 1;\nlocal $vars = 1;\n```\n\
  \n`vars` 选项最令人沮丧的一点是，你会得到一系列与变量使用相关的错误。例如，脚本：\n\n```\nuse strict;\n%hash = ('Martin'\
  \ => 'Brown',\n         'Sharon' => 'Penfold',\n         'Wendy' => 'Rinaldi',);\n\
  foreach $key (sort keys %hash) {\n    print \"$key -> $hash{$key}\\n\";\n}\n```\n\
  \n执行时会引发以下错误：\n\n```\n$ perl -w t2.pl\nGlobal symbol \"%hash\" requires explicit\
  \ package name at t2.pl line 3.\nGlobal symbol \"$key\" requires explicit package\
  \ name at t2.pl line 7.\nGlobal symbol \"%hash\" requires explicit package name\
  \ at t2.pl line 7.\nGlobal symbol \"$key\" requires explicit package name at t2.pl\
  \ line 9.\nGlobal symbol \"%hash\" requires explicit package name at t2.pl line\
  \ 9.\nGlobal symbol \"$key\" requires explicit package name at t2.pl line 9.\nExecution\
  \ of t2.pl aborted due to compilation errors.\n```\n\n解决该问题的明显方法是使用 `my` 声明变量：\n\
  \n```\nuse strict;\nmy %hash = ('Martin' => 'Brown',\n            'Sharon' => 'Penfold',\n\
  \            'Wendy' => 'Rinaldi',);\nforeach my $key (sort keys %hash) {\n    print\
  \ \"$key -> $hash{$key}\\n\";\n}\n```\n\n\n\n\n在开发模块时，对想要导出的变量使用 `my` 是行不通的，因为声明的变量会在包内进行词法作用域限定。解决方案是使用\
  \ `vars` 编译指示：\n\n```\npackage MyModule;\n\nuse vars qw/@ISA ©EXPORT/;\n\nrequire\
  \ Exporter; ©ISA = qw/Exporter/; ©EXPORT = qw/ open_db\n\n/;\n```\n\n作为一般规则，即使你忽略了使用其他\
  \ `strict` 编译指示选项，也应该始终使用 `vars` 选项。\n\n### refs 选项\n\n如果你使用符号（软）引用——即使用字符串来引用变量或函数，`refs`\
  \ 编译指示会生成一个错误。因此，以下代码可以正常工作：\n\n```\nuse strict 1 refs 1 ; $foo = \"Hello World\"\
  ; $ref = \\$foo; print $$ref;\n```\n\n但以下代码则不行：\n\n```\nuse strict 'refs 1 ; $foo\
  \ = \"Hello World\"; $ref = 11 f oo\" ; print $$ref;\n```\n\n如果你正在使用调度表，则需要小心，因为当\
  \ `strict` 编译指示生效时，传统的解决方案不起作用。以下代码会失败，因为你试图对要调用的函数使用软引用：\n\n```\nuse strict refs;\
  \ my %commandlist = (\n\n■DISK' 1 SWAP' 1 STORE 1 'GET' 'QUIT' ) ;\n\nmy ($function)\
  \ = $commandlist{$command}; die \"No $function()\" unless defined(&$function); &$function(*CHILDSOCKET,\
  \ $host, $type);\n\n=> 'disk_space_report',\n\n=> 1 swap_space_report 1 ,\n\n=>\
  \ 1 store_status_report 1 ,\n\n=> 1 get_status_report 1 ,\n\n=> 'quit_connection',\n\
  ```\n\n172 调试 Perl：程序员故障排除指南\n\n要解决这个问题，从符号表中找到子程序的引用，然后将其作为类型全局量访问，并作为函数调用。这意味着你可以将前面脚本中的最后三行改为：\n\
  \n```\nif (defined($main::{$commandlist{$command}})) {\n\n*code = \\$main::{$commandlist{$command}};\
  \ &code($user,$group,$session);\n\n}\n```\n\n你也可以使用 `exists` 函数来判断一个函数是否已被创建，但即使该函数仅通过\
  \ `subs` 编译指示进行了前向定义，或者设置了函数原型，它也会返回真值，而不仅仅是在函数实际定义时。\n\n### subs 选项\n\n最后一个选项控制\
  \ Perl 如何处理裸字（关于裸字的描述见第 2 章）。当此编译指示未生效时，你可以使用裸字来引用子程序或函数。当编译指示生效时，你必须对相关子程序进行引号引用或提供绝对引用。\n\
  \n通常，Perl 允许你对子程序使用裸字。此编译指示禁用了这一能力，这在信号处理程序中最为明显。以下示例：\n\n```\nuse strict 'subs';\
  \ $SIG{QUIT} = \"myexit\"; $SIG{QUIT} = \\&myexit;\n```\n\n可以正常工作，因为我们没有使用裸字，但：\n\
  \n```\nuse strict 'subs'; $SIG{QUIT} = myexit;\n```\n\n会在编译期间生成错误，因为 `myexit` 是一个裸字。\n\
  \n### 其他 Perl 编译指示\n\n除了 `warnings` 和 `strict` 编译指示之外，还有其他编译指示可以帮助控制和改变 Perl 处理脚本不同方面的方式。虽然在调试时并不总是有用，但如果你没有注意到编译指示生效，其效果可能会在脚本中引起意外问题。其他编译指示则帮助你绕过\
  \ `strict` 编译指示的影响，例如 `vars` 和 `subs` 编译指示。\n\n回顾编译指示的工作原理：所有编译指示都只是模块。你使用 `use`\
  \ 关键字启用它们，并在编译指示名称后以字符串或数组形式提供任何可选参数。例如：\n\n```\nuse vars qw/$var $string/;\n```\n\
  \n![picture12](img/picture12.jpg)\n\n第 8 章：使用编译指示和警告 173\n\n要关闭指定的编译指示，你需要使用 `no`\
  \ 关键字，它是 `use` 关键字的逻辑对立面。如果你在与之前 `use` 语句相同的层级指定 `no`，它会像一个开关一样，关闭之前的编译指示，直到遇到新的\
  \ `use` 语句或块结束。如果你在包含相应 `use` 语句的块内的封闭块（函数或循环）中使用 `no`，则编译指示仅在该封闭块期间被禁用。例如：\n\n\
  ```\nuse integer; function intdivide {\n\nprint \"67/3\",\"\\n\"; #使用整数运算\n\n}\n\
  \nfunction divide {\n\nno integer;\n\nprint \"67/3\",\"\\n\"; #使用浮点运算\n\n}\n\nprint\
  \ \"67/3\",\"\\n\"; #整数运算 no integer;\n\nprint \"67/3\",\"\\n\"; #浮点运算\n```\n\n\
  其他编译指示的工作方式类似，尽管某些效果依赖于其他编译指示或具体实现。\n\n### autouse\n\n`autouse` 编译指示将模块的加载推迟到实际使用\
  \ `funca` 或 `funcb` 之一时：\n\n```\nuse autouse 'Module' => qw(funca funcb);\n```\n\
  \n这在原理上类似于 `Autoload` 模块，但并不完全相同。请注意，你必须指定会触发 `autouse` 过程的函数；否则，Perl 解释器无法识别应导入的函数。因此，上面一行等价于导入选定函数的标准方法：\n\
  \n```\nuse Module qw(funca funcb);\n```\n\n你还可以向 `autouse` 编译指示提供函数原型，以便在编译阶段（而非执行阶段）捕获错误：\n\
  \n```\nuse Module qw(funca($$) funcb($@));\n```\n\n`autouse` 编译指示的效果是减少脚本的加载和编译时间，同时减少在特定执行路径中才使用外部函数的脚本在启动时加载的模块数量。不幸的是，该编译指示还会将模块的加载推迟到执行时，从而绕过了导入模块时通常进行的检查，并将报告任何错误的职责转移到执行阶段而非编译阶段。\n\
  \n当自动加载的模块中存在错误或拼写错误时，可能会出现问题，因为你的程序不会在模块导入时崩溃，而是在实际使用函数时崩溃。此外，任何依赖于早期初始化（例如在 `BEGIN\
  \ {}` 块内）的模块都可能失败，因为它期望初始化发生在整个脚本的初始编译期间。\n\n在开发阶段，你可以通过为自动加载的模块放置一个真正的 `use` 语句来绕过自动加载模块中的错误。例如：\n\
  \n```\nuse File::Basename\n\nuse autouse 'File::Basename' => qw(basename dirname);\n\
  ```\n\n第一行掩盖了第二行；当你准备向公众发布脚本和/或模块时，只需注释掉第一行，让 `autouse` 编译指示发挥作用即可。\n\n### base\n\
  \n`base` 编译指示在编译时（而非执行时）建立与基类的关系。实际上，此操作相当于在模块初始化期间将指定的类添加到 `@ISA` 数组中，例如：\n\n```\n\
  package Object;\n\nuse base qw(Foo Bar);\n```\n\n实际上等价于：\n\n```\nBEGIN\n\n{\n\n\
  require Foo; require Bar; push @ISA, qw(Foo Bar);\n\n}\n```\n\n这里可能遇到的主要问题是未能导入你想要继承的基类。有关使用对象相关的其他问题，请参见第\
  \ 3 章。\n\n### blib\n\n`blib` 编译指示强制 Perl 在 `blib` 目录结构中查找模块，该结构由 `MakeMaker` 模块创建。此功能在测试模块（在你打算发布并使其可供\
  \ Perl 社区使用之前）时特别有用。理想情况下，它应仅在命令行上使用 `-M` 选项：\n\n```\nperl -Mblib script perl -Mblib=dir\
  \ script\n```\n\n第 8 章：使用编译指示和警告 175\n\n如果指定了 `dir`，它会在该目录（及子目录）中查找 `blib` 结构。如果你未指定\
  \ `dir`，则假定你想要包含当前目录。你也可以使用：\n\n```\nuse blib;\n\nuse blib 'dir 1 ;\n```\n\n但这不是首选解决方案，因为它需要修改脚本才能禁用该行为。\n\
  \n### constant\n\n\n\n\n\n### constant\n\n尽管还有其他引入常量变量的技术，但最实用的解决方案是 `constant`\
  \ 编译指令。常量的优势显而易见：如果你在整个计算和程序中使用相同的常量值，就能保证计算出的值也保持恒定。\n\n即使常量在多个不同平台上使用，这一规则同样适用。例如，`7i`\
  \ 的值可以无限计算，并且存在多种方法和精度等级。你可以创建一个常量值，用于所有计算，如下所示：\n\n```\nuse constant PI => 3.141592654;\n\
  ```\n\n该值可以是任何普通的 Perl 表达式，包括计算和函数，因此以下写法同样有效：\n\n```\nuse constant PI => 22/7;\n\
  \nuse constant USER => scalar getpwuid($<);\n```\n\n一旦定义，你就可以直接使用常量；无需在前面添加字符来表示变量类型：\n\
  \n```\n$zero = (cos (PI/2) ) ;\n```\n\n提供的值在列表上下文中求值，因此你可以定义常量列表以及标量。注意常量是列表，因此必须使用下标符号，而不是数组符号。因此，以下语句\n\
  \n```\n$quota = USERDATA[5];\n```\n\n将无法工作；你必须使用 `$quota = (USERDATA)[5];`\n\n另外注意，常量可以直接插值，但必须使用间接表示法：`print\
  \ \"I want to eat some @{[PI]}\\n\";`\n\n同样值得注意的是，由于常量实际上只是子程序，你不能在自动将裸字引用的上下文中使用它们，例如哈希。相反，应在常量前使用空括号或\
  \ `+` 运算符，以强制 Perl 将其识别为函数：\n\n```\n$hash{PI()}; $hash{+Pl};\n```\n\n虽然并非必需，但常量名称应仅由大写字符组成，以帮助将其与普通变量区分开来。所有常量必须以字母开头。\n\
  \n常量定义是包作用域而非块作用域，因此你可以在不同包内拥有不同的常量值，也可以使用完全限定名称引用常量。\n\n### diagnostics\n\n`diagnostics`\
  \ 编译指令为 Perl 脚本添加了额外的诊断功能。尽管 Perl 在发现问题时通常会输出相当数量的错误和警告（无论是在编译时还是运行时），但这些消息通常是简短的单行描述。即使你知道错误消息的含义，问题的确切原因也可能难以确定。\n\
  \n`diagnostics` 编译指令不仅会输出简短的单行警告，还会输出你在 `perldiag` 主页面中找到的附加描述文本。虽然你仍然无法获得更深入的问题描述，但该描述通常能突出你忽略的内容。\n\
  \n要使用它，请在要检查问题的脚本顶部插入 `diagnostics` 编译指令，然后运行脚本（最好启用警告）并检查扩展输出。下面的程序会产生一些错误：\n\n\
  ```\nuse diagnostics;\n\nprint DUMMY 'Wont work 1 ;\n```\n\n运行时，你会得到以下输出：\n\n```\n\
  $ perl -w nodiag.pl\n```\n\nName \"main::DUMMY\" used only once: possible typo at\
  \ t.pl line 2 (#1)\n\n(W) 拼写错误通常表现为唯一的变量名。如果你有充分的理由使用唯一名称，那么只需再次提及它以抑制该消息。`use vars`\
  \ 编译指令正是为此目的而提供的。\n\nFilehandle main::DUMMY never opened at t.pl line 2 (#2)\n\n\
  ![picture13](img/picture13.jpg)\n\n使用常量时要小心；大写约定可能会与文件句柄冲突。\n\n(W) 尝试对从未初始化的文件句柄进行\
  \ I/O 操作。你需要执行 `open()` 或 `socket()` 调用，或者从 `FileHandle` 包调用构造函数。\n\n或者，保持脚本不变，将错误输出通过管道重定向到文件。然后可以使用\
  \ `splain` 程序（随 Perl 安装）分析错误，并为错误消息和警告生成完整描述：\n\n```\nperl -w nodiag.pl 2> nodiag.err\
  \ ./splain <nodiag.err\n```\n\n在 MacPerl 下，没有单独的 `splain` 应用程序，但如果在脚本中指定了该编译指令，它仍然有效。\n\
  \n如果在指定编译指令时指定了 `-verbose` 选项，则会在诊断警告和扩展信息之前打印出 `perldiag` 主页面的介绍：\n\n```\nuse diagnostics\
  \ -verbose;\n```\n\n一旦导入，你可以通过使用 `enable` 和 `disable` 函数来打开和关闭诊断消息，从而控制脚本中各个元素的行为：\n\
  \n```\nenable diagnostics; disable diagnostics;\n```\n\n这些更改仅影响任何运行时错误。在解析/编译阶段无法关闭诊断过程。\n\
  \n如果你的程序使用 `$SIG{_WARN_}` 和 `$SIG{_DIE_}` 处理程序来捕获错误，你仍然可以将它们与 `diagnostics` 模块结合使用。但是，`diagnostics::splainthis`\
  \ 函数会首先执行，因此你将在自己的扩展执行之前获得扩展警告信息。有关使用信号进行错误捕获的信息，请参阅第 9 章。\n\n如果你想确切了解 `diagnostics`\
  \ 模块正在做什么，可以通过定义以下内容来启用 `diagnostics` 模块的“调试”：\n\n```\nBEGIN { $diagnostics::DEBUG\
  \ =1 }\n```\n\n在脚本开始其余执行过程之前。\n\n有关调试非交互式脚本的更多信息，包括如何在这些情况下使用 `diagnostics` 编译指令，请参阅第\
  \ 9 章。\n\n### fields\n\n`fields` 编译指令影响对象的编译时错误检查。使用 `fields` 编译指令可以让你预定义类字段，这样如果未指定字段，对特定类方法的调用将在编译时失败。这是通过填充一个名为\
  \ `%FIELDS` 的哈希来实现的。当你使用持有对象引用的类型化变量访问哈希时，会在 `%FIELDS` 哈希中查找该类型，如果变量类型存在，则在编译阶段将整个操作转换为数组访问。例如，\n\
  \n```\n{\n    package Foo;\n\n    use fields qw(foo bar _private);\n}\n\nmy Foo\
  \ $var = new Foo; $var->{foo} = 42;\n```\n\n如果指定的字段（本例中为 `\"foo\"`）不存在，则会产生编译时错误。\n\
  \n为了实现这一点，`%FIELDS` 哈希在编译时被查询，而 `fields` 和 `base` 编译指令则促进了这一点。`base` 编译指令从基类定义中复制字段，而\
  \ `fields` 编译指令则向现有定义添加新字段。以下划线开头的字段名是类的私有字段；子类甚至无法访问它们。\n\n结果是，可以创建具有命名字段的对象，这些字段的访问与相应的哈希一样方便快捷。你必须通过正确类型化的变量访问对象，或者可以使用非类型化变量；前提是将对\
  \ `%FIELDS` 哈希的引用赋值给数组对象的第 0 个元素。你可以通过以下方式实现此初始化：\n\n```\nsub new\n{\n    my $class\
  \ = shift; no strict 'refs';\n    my $self = bless [\\%{\"$class\\::FIELDS\"], $class;\
  \ $self;\n}\n```\n\n### integer\n\n默认情况下，Perl 以浮点数进行所有计算。虽然通常可以使用 `int` 函数强制特定计算返回整数结果，但指定所有计算仅使用整数执行可能更有用。例如，\n\
  \n```\nuse integer; print 67/3,\"\\n\";\n```\n\n`use integer` 编译指令仅持续当前块，因此可以安全地在单个函数内使用，而不会影响脚本的其余部分。此外，你可以使用\
  \ `no` 关键字关闭 `integer` 编译指令：\n\n```\nuse integer; print 67/3,\"\\n\"; no integer;\
  \ print 67/3,\"\\n\";\n```\n\n\n\n\n\n# 第 8 章：使用编译指令与警告\n\n你也可以在封闭块内使用 `no` 来临时关闭整数运算，如“其他\
  \ Perl 编译指令”下的介绍性示例所示。\n\n### less\n\n`less` 编译指令目前尚未实现：\n\n`use less;`\n\n其意图是允许你指定对某些资源（如内存或处理器空间）的缩减。当你希望确保脚本的效果不会干扰系统其他部分时，此功能可能很有用。\n\
  \n同时，关于执行脚本时对系统进行压力测试的更多信息，请参阅第 14 章。\n\n### lib\n\n当使用 `use` 导入模块时，解释器会检查 `@INC`\
  \ 数组，以获取要搜索的目录列表，从而找到要导入的模块。由于 `use` 语句在编译过程中被求值，你无法在脚本主体部分插入额外的目录。当然，你可以使用 `BEGIN\
  \ {}` 块：\n\n`BEGIN { unshift @INC, LIST }`\n\n或者你可以使用 `lib` 编译指令。上述块的等效写法是 `use\
  \ lib LIST;`\n\n请注意，这些目录会在标准目录之前被添加（使用 `unshift`），以确保优先使用本地模块而非标准模块。对于所有以这种方式添加的目录，`lib`\
  \ 模块还会检查是否存在 `$dir/$archname/auto`，其中 `$archname` 是当前平台的架构名称。如果存在，则假定该目录是架构特定的目录，并会在原始目录规范之前被实际添加到\
  \ `@INC` 中。\n\n一旦添加，通常不需要移除目录。此外，你绝不应该从数组中移除标准目录。同样值得记住的是，如果你移除了包含某个模块所依赖的目录，可能会影响后续模块的未来操作。尽管你可以辩称，确保模块能够访问其所需模块是模块自身的责任，但出于良好协作的考虑，明智的做法是无论如何都不应移除目录。移除目录没有任何好处；解释器搜索所需内容并不会消耗大量额外内存或处理能力。\n\
  \n考虑到所有这些，你可以使用 `no lib` 编译指令来移除目录，该指令会从 `@INC` 中移除指定目录的第一个实例。如果要移除多个实例，你需要多次调用\
  \ `no lib`。你也可以通过指定 `\":ALL\"` 作为 `no lib` 的第一个参数来从 `@INC` 中移除所有指定的名称。例如：\n\n`no\
  \ lib qw(:ALL .);`\n\n对于每个目录，会执行与之前过程相反的操作。架构特定的目录也会在 `@INC` 数组中被搜索，然后被移除。\n\n尽管在实践中你不需要这样做，但如果你想恢复\
  \ `@INC` 中的原始（标准）目录列表，你需要使用：\n\n`@INC = ©lib::ORIG_INC;`\n\n### ops\n\n`ops` 编译指令在编译过程中关闭特定的操作码。其概要如下：\n\
  \n`perl -Mops=:default`\n\n这仅启用相对安全的操作。或者你可以指定从可用操作码中移除某些操作码，使用：\n\n`perl -M-ops=system`\n\
  \n请注意，使用此选项的最佳方式是通过命令行集成；否则，在编译过程开始之前，你可能会因使用 `BEGIN {}` 语句而面临滥用风险。或者，你可以使用 `Safe`\
  \ 和 `Opcode` 模块，它们提供了更全面的方法来使用受限的操作码集执行 Perl 代码。\n\n### re\n\n`re` 编译指令改变正则表达式的行为。该编译指令有三个选项：`taint`、`debug`\
  \ 和 `eval`。还有一个额外的编译指令实际上只是对前一个的修改，称为 `debugcolor`。唯一的区别在于输出的颜色。在所有情况下，`re` 编译指令都适用于整个文件（它不是词法作用域的），并且在编译和执行时都会产生影响。\n\
  \n`taint` 选项确保用正则表达式修改的变量在原本会被视为在正则表达式操作中已被清理的情况下被标记为污染：\n\n`use re 'taint';`\n\n\
  也就是说，在原本对污染变量进行匹配或替换会产生未污染结果的情况下，结果实际上被标记为污染。已经未污染的信息保持不变——使用 `taint` 选项并不会污染所有正则表达式数据。\n\
  \n`debug` 和 `debugcolor` 选项强制 Perl 在执行正则表达式时生成调试消息：\n\n`use re 'debug';`\n\n`use\
  \ re 'debugcolor';`\n\n这相当于在执行时使用 `-Dx` 开关（如果在构建过程中指定了 `-DDEBUGGING` 选项）。提供的信息可能非常庞大，即使对于相对较小的正则表达式也是如此。如果你的终端支持，`debugcolor`\
  \ 选项会输出彩色版本。有关 `-D` 开关效果的更多信息，请参阅第 10 章。\n\n`eval` 选项允许正则表达式包含 `(?{...})` 断言，即使正则表达式包含变量插值：\n\
  \n`use re 'eval';`\n\n通常情况下这是被禁用的，因为它被视为安全风险，并且如果 `use re 'taint'` 编译指令生效，则该编译指令会被忽略。\n\
  \n单个编译指令可以用 `no re` 关闭。\n\n### sigtrap\n\n`sigtrap` 编译指令实现了简单的信号处理，无需常规信号处理例程的复杂性：\n\
  \n`use sigtrap;`\n\n该编译指令支持三个处理程序：两个由模块本身提供（一个提供堆栈跟踪，另一个仅调用 `die`），第三个是你自己提供的。提供给模块的每个选项按顺序处理，因此一旦识别出信号名称，就会安装信号处理程序。\n\
  \n如果未指定任何选项，模块默认使用 `stack-trace` 和 `old-interface-signals` 选项。各个选项如下所示：\n\n`use\
  \ sigtrap qw/stack-trace HUP INT KILL/;`\n\n当脚本接收到指定的信号时，这会在 `STDERR` 上生成一个 Perl\
  \ 堆栈跟踪。生成跟踪后，模块会调用 `dump` 来转储核心。\n\n`use sigtrap qw/die HUP INT KILL/;`\n\n这会调用\
  \ `croak`（参见附录 D），报告捕获到的消息名称。\n\n`use sigtrap 'handler' => \\&my_handler, HUP, INT,\
  \ KILL;`\n\n这会为指定的信号安装处理程序 `my_handler`。\n\n该编译指令定义了一些标准信号列表。如果你的系统不支持某个指定的信号，该信号会被忽略，而不会产生错误。\n\
  \n### normal-signals\n\n这些是任何程序通常可能捕获的信号：`HUP`、`INT`、`PIPE`、`TERM`。\n\n### error-signals\n\
  \n这些是指示严重错误的信号：`ABRT`、`BUS`、`EMT`、`FPE`、`ILL`、`QUIT`、`SEGV`、`SYS`、`TRAP`。\n\n###\
  \ old-interface-signals\n\n旧的 `sigtrap` 编译指令默认捕获的信号列表。如果你未指定其他信号，则会使用此信号列表：`ABRT`、`BUS`、`EMT`、`FPE`、`ILL`、`PIPE`、`QUIT`、`SEGV`、`SYS`、`TERM`、`TRAP`。\n\
  \n### untrapped\n\n此特殊选项从后续列出的信号中选择，或者指定所有未被捕获或忽略的信号。\n\n### any\n\n将处理程序应用于所有后续列出的信号；这是默认行为。\n\
  \n有关使用信号作为调试脚本方法的更多信息，请参阅第 9 章。\n\n### subs\n\n`subs` 编译指令预声明一个函数，以便即使在 Perl 看到完整定义之前，也可以不带括号调用该函数。\n\
  \n`use subs qw(func);`\n\n此选项还可用于通过预定义要覆盖的子例程来覆盖内部函数：\n\n```\nuse subs qw(chdir);\n\
  chdir $message;\nsub chdir {\n}\n```\n\n\n\n\n\n# 第 8 章：使用编译指示和警告 1\n\n覆盖版本可以在本地文件中定义（如前面的示例所示），也可以从外部模块导入，尽管可以通过在导入过程中专门定义函数来覆盖外部模块中的函数，例如：\n\
  \n`use MyBuiltin 'chdir';`\n\n显然，你需要在模块初始化时，将 `chdir` 函数定义在 `@EXPORT_OK` 数组中。关于定义和使用子例程时可能遇到的问题，请参阅第\
  \ 4 章。\n\n`subs` 编译指示不是块作用域的，因此函数定义对整个执行过程是全局的——正如你所期望的那样。\n\n### vars\n\n`vars`\
  \ 编译指示预先声明列表中定义的变量，这可以防止对尚未创建的变量产生拼写警告。如果你不想使用 `local` 关键字，这也是声明要与其它模块共享变量的最佳方式。使用\
  \ `my` 变量是行不通的，因为这些变量会被严格限定在模块内部。由于变量是全局声明的，这也是声明全局变量的最简单方法，否则这些变量会触发 `use strict`\
  \ 编译指示。\n\n`use vars qw($scalar @array %hash);`\n\n注意，`vars` 不是块作用域的。这些变量在当前文件中是真正的全局变量。\n\
  \n## 第 9 章：手动调试技术\n\n![picture14](img/picture14.jpg)\n\n186 调试 Perl：程序员故障排除指南\n\n\
  到目前为止，我们一直专注于如何识别和解决脚本中的错误，但没有过多关注实际的调试过程。这样做的原因并不是调试器没有用，而是我相信通过更好地理解语言，并更深入地了解解释器的工作方式，你可以在大多数错误发生之前就消除它们。\n\
  \n同样，尽管 Perl 具有自由形式的特性，但它确实拥有一些工具，可以帮助从一开始就减少这些错误进入脚本的可能性。上一章中关于 Perl 警告和 `strict`\
  \ 等编译指示的内容应该已经很好地证明了这一点。关于更严格的编程、规划和文档编写，其重要性可能超出你的想象。\n\n尽管许多人将调试器视为解决错误的终极方案，但事实并非如此。调试器不会为你找到错误，也不会解释错误发生的原因或如何修复它们。它们提供的只是一个用于监控脚本执行的有用工具。\n\
  \n调试器还依赖于运行被调试代码的人理解正在发生的事情——如果你试图帮助最终用户识别代码中的错误或问题，这并不总是实用的。在这些情况下，你需要一些“内联”的东西——即对源代码进行修改，使你能够在任何时候跟踪执行过程和任何可能的问题，而无需使用单独的调试器。\n\
  \n在本章中，我们将探讨一些“手动”调试技术。所有这些方法都需要你修改代码，因此需要手动干预。它们还会产生输出，需要单独研究后才能将问题定位到应用程序的特定部分。\n\
  \n除了使用简单的 `print` 语句外，我们还将研究 `caller` 函数，它提供了导致当前语句的函数调用的有用背景信息；以及信号，它可以作为直接调试解决方案的有用替代方案。我们还将研究使用\
  \ `eval`，它允许我们在一个独立的 Perl 容器中执行语句。这个特性可以作为一个有效的调试工具。最后，我们将探讨如何创建一个单独的调试日志，以便在事后进行检查，而不会因故障影响用户体验。\n\
  \n### 使用 print\n\n对我来说，`print` 语句一直很简单，只要你小心谨慎，它们通常能提供足够的信息来追踪错误，而无需借助完整的调试器。事实上，使用简单的\
  \ `print` 语句最简单的方法是在脚本开发过程中——只需插入一个快速的“这个变量有这个值”的语句，就能很好地检查脚本是否按预期运行。\n\n我们还可以在脚本的最终发布版本中使用\
  \ `print` 语句来报告调试信息。通常，你会将此方法与一个全局变量结合使用（可能通过脚本的命令行设置），以启用或禁用一些简单的调试信息。以这种方式输出调试信息的脚本的好处是，它允许用户和程序员对脚本进行事后调试。`print`\
  \ 唯一经常无用的地方是在循环内部，因为它会产生大量信息，需要在执行完成后手动处理。有时，如果你想持续监控正在处理的单个变量，或者想监控文件句柄的输入或输出，循环机制可能会很有用。\n\
  \n用法非常简单。使用像 `print \"Got here!\\n\";` 这样的语句，你可以跟踪程序的执行路径。你可以对任何想要输出的有效数据使用相同的基本布局。因为你可以打印任何内容，所以你可以非常明确地输出信息：\n\
  \n`print \"Data before processing: $data\\n\";` #处理一些数据\n\n`print \"Fieldname: $field,\
  \ data: $data, leftovers: $leftover\\n\";`\n\n不过，更常见的是，你希望更明确地指出调试报告发生的位置。这里你可以使用\
  \ `LINE` 和 `FILE` 指令，它们分别插入打印消息的行号和当前文件名。例如，\n\n```\nprint FILE , 1 (', LINE ,\"\
  ): Data before processing $data\\n\";\n```\n\n可能会产生\n\n```\nprocess.pi(19): Data\
  \ before processing Name: Martin\n```\n\n注意，`FILE` 和 `LINE` 标记必须放在引号之外，才能被包含在打印行中。\n\
  \n### 引用信息\n\n使用 `print` 输出数据时，最好对输出的信息进行定界。这有助于明确实际数据是什么。例如，报告行\n\n```\nprocess.pi(19):\
  \ Data before processing Name: Martin\n```\n\n并没有告诉我们信息中是否有尾随的制表符或空格，这可能重要也可能不重要。在数据两侧加上一组简单的花括号可以突出显示完整的数据字符串：\n\
  \n```\nprocess.pi(19): Data before processing [Name: Martin ]\n```\n\n这里很明显，我们有一些尾随的空格或制表符。\n\
  \n### 设计提示\n\n不要使用尖括号 `<>` 来定界信息，尤其是在 CGI 或其他 HTML 脚本中显示调试数据时。HTML 解析器可能会将条目识别为正确的\
  \ HTML 标签，或者干脆完全忽略数据！\n\n你还可以更进一步，对特殊字符进行转义。下面的脚本定义了两个函数——整个接口是 `mapascii` 函数。它接受一个字符串，然后将特殊字符转换为其等效序列：\n\
  \n```\nsub mapasciichar {\n    my ($char) = @_;\n    @map = qw/\n        \\0 [SOH]\
  \ [STX] [ETX] [EOT] [ENQ] [ACK] \\a \\b \\t \\n \\v \\f \\r [SO] [SI] [DCE] [DC1]\
  \ [DC2] [DC3] [DC4] [SYN] [ETB] [CAN] [EM] [SUB] [ESC] [FS] [GS] [RS] [US]\n   \
  \ /;\n    return $map[ord($char)] if (exists($map[ord($char)]));\n    return $char;\n\
  }\n\nsub mapascii {\n    my ($string) = @_;\n    join('',map { $_ = mapasciichar($_)\
  \ } split //,$string);\n}\n\nprint mapascii(\"Hello\\nThis is a raw test\\t\\r\\\
  n\"),\"\\n\";\n```\n\n运行脚本时，你会得到\n\n```\nHello\\nThis is a raw test\\t\\r\\n\n```\n\
  \n其他控制字符也会以其 ASCII 名称或你通常在字符串中插值特殊字符时使用的格式打印出来。\n\n\n\n\n我们之前看到的行和文件指令提供了一种有用的方法，可以隔离引发特定错误的确切脚本位置。当然，包含更详细的报告更有意义，这样输出的内容尽可能详细，并准确描述脚本在出错时的操作。以下是一个处理文件的打印调试脚本的输出。输出中包含我们用于处理数据的变量的内容：\n\
  \n`$ foo.pl`\n\n已打开文件（`input.dat`）已读取数据（`hello`）已读取数据（`world`）已关闭文件\n\n请始终记住，以这种方式生成调试报告时，应该输出带注释的事件序列。这样做将帮助您和您的用户在不回溯脚本的情况下理解正在发生的事情。\n\
  \n### 跟踪执行\n\n![picture15](img/picture15.jpg)\n\n在输出这些信息时，关闭文件缓冲是个好主意，这样信息可以实时更新，而不是分块更新。最简单的方法是：\n\
  \n```\nuse 10::Handle;\n\nautoflush FILEHANDLE 1;\n```\n\n第 9 章：手动调试技术 189\n\n###\
  \ 使用调试选项\n\n使用 `print` 语句的最佳方式是通过一个简单的调试变量，该变量可以在脚本中通过简单修改或使用命令行参数随意开启或关闭。这样做使得开发者和最终用户在发现问题时都能获得扩展的调试信息。\n\
  \n第三方模块也经常使用调试选项；你可以在初始化时设置包中某个变量的值。例如，以下是使用 Graham Barr 的 `Net::FTP` 模块的脚本输出：\n\
  \n`grfile.pi ftp://martinb:foo@twinspark.mcslp.com/pub/filelist.txt`\n\n`Net::FTP=GLOB(0xb68ec)<<<\
  \ 220 twinspark FTP server (UNIX(r) System V Release 4.0) ready.`\n\n`Net::FTP=GLOB(0xb68ec)>>>\
  \ user martinb`\n\n`Net::FTP=GLOB(0xb68ec)<<< 331 Password required for martinb.`\n\
  \n`Net::FTP=GLOB(0xb68ec)>>> PASS ....`\n\n`Net::FTP=GLOB(0xb68ec)<<< 230 User martinb\
  \ logged in.`\n\n`Net::FTP=GLOB(0xb68ec)>>> CWD /pub`\n\n`Net::FTP=GLOB(0xb68ec)<<<\
  \ 250 CWD command successful.`\n\n`Net::FTP=GLOB(0xb68ec)>>> PORT 198,112,10,130,128,13`\n\
  \n`Net::FTP=GLOB(0xb68ec)<<< 200 PORT command successful.`\n\n`Net::FTP=GLOB(0xb68ec)>>>\
  \ RETR filelist.txt`\n\n`Net::FTP=GLOB(0xb68ec)<<< 150 ASCII data connection for\
  \ filelist.txt (198.112.10.130,32781) (1328 bytes).`\n\n`Net::FTP=GLOB(0xb68ec)<<<\
  \ 226 ASCII Transfer complete.`\n\n`Net::FTP=GLOB(0xb68ec)>>> QUIT`\n\nEES\n\n你可以在自己的脚本和模块中创建自己的调试设置变量。你所要做的就是使用\
  \ `use`、`vars` 或 `our`（针对 Perl 5.6）创建一个全局变量来保存调试设置，然后在每个调试语句后附加一个合适的 `if` 语句：\n\n\
  ```\nprint \"Got an error whilst parsing, probably ignorable\\n\" if ($debug);\n\
  ```\n\n你也可以使用相同的原则来提供不同级别的调试信息：\n\n```\nprint \"Read a line from $source\\n\" if\
  \ ($debug);\nprint \"Input: [$line]\\n\" if ($debug > 1);\n```\n\n190 调试 Perl：程序员故障排除指南\n\
  \n你也可以在模块中使用相同的方法来设置调试选项。例如：\n\n```\npackage MyModule;\n\nrequire Exporter;\n\n\
  @ISA = qw/Exporter/;\n\n@EXPORT = qw/setdebug readfile/;\n\nuse vars qw/$debug/;\n\
  $debug = 0;\n\nsub setdebug {\n    my ($deblevel) = @_;\n    $debug = $deblevel;\n\
  }\n```\n\n在调用脚本中，你有两种选择：直接设置值：\n\n```\n$MyModule::debug = 1;\n```\n\n或者使用 `setdebug`\
  \ 函数来设置调试级别。类似的方法也可以按函数逐个使用：\n\n```\nsub readfile\n{\n    my ($infile, %options)\
  \ = @_;\n    my $debug = $options{debug} if (exists($options{debug}));\n    ...\n\
  }\n```\n\n现在，只需在调用函数时提供调试级别即可；例如：\n\n```\n$source = readfile($infile, debug => 1);\n\
  ```\n\n尽量避免导出调试变量，这样你可以选择性地为单个模块和/或函数调用开启调试，而不影响其他模块。此外，不要将全局调试变量和函数特定的调试变量混合使用，以防无意中为整个脚本开启调试。\n\
  \n### 使用 `caller`\n\n如果你试图跟踪程序的执行路径，打印自己的调试信息需要大量手动输入。对于你在源代码中包含的每个 `print` 语句，你都需要包含该语句位置的引用，以便调试输出有意义。\n\
  \n为了简化这个过程，你可以使用 `caller` 函数，它返回子程序的当前上下文信息。这些信息包括子程序（或 `eval` 或 `require`）语句的详细信息：\n\
  \n第 9 章：手动调试技术 191\n\n```\ncaller EXPR\ncaller\n```\n\n在标量上下文中，该函数只返回包名。在列表上下文中（不带参数），该函数返回当前子程序或\
  \ `eval` 或 `require` 语句的调用者的包名、文件名和行号：\n\n```\n($package, $filename, $line) = caller;\n\
  ```\n\n如果指定了 `EXPR`，`caller` 会返回扩展信息。`EXPR` 的值应该是堆栈上要回溯到当前子程序之前的子程序调用次数。也就是说，如果你指定值为\
  \ 1，则会打印父级子程序信息；值为 2 会打印祖父级子程序，依此类推。返回的信息是：\n\n```\n($package, $filename, $line,\
  \ $subroutine,\n$hasargs, $wantarray, $evaltext, $is_require) = caller($i);\n```\n\
  \n`$evaltext` 和 `$is_require` 值仅在所检查的子程序实际上是 `eval()` 语句的结果时才返回。例如，检查以下脚本：\n\n```\n\
  sub bar\n{\n    Top::top();\n}\n\nbar();\n\npackage Top;\n\nsub top {\n    my $level\
  \ = 0;\n    print \"Top of the world, Ma!\\n\";\n    while ((($package, $file, $line,\n\
  \            $subname, $hasargs, $wantarray) = caller($level++)))\n    {\n     \
  \   $hasargs = $hasargs ? 'Yes' : 'No';\n        if (defined($wantarray))\n    \
  \    {\n            $wantarray = 'Yes';\n        }\n        else {\n           \
  \ $wantarray = 'No';\n        }\n        print <<EOF;\nStack:\nPackage: $package\
  \ File: $file Line: $line\n192 Debugging Perl: Troubleshooting for Programmers\n\
  Subroutine: Has Arguments?: Wants Array?:\n$subname $hasargs $wantarray\nEOF\n \
  \   }\n}\n```\n\n当代码执行时，结果信息显示了 `top` 函数的堆栈跟踪，包括从 `main` 和 `bar` 函数的原始调用：\n\n```\n\
  Top of the world, 1\nStack:\nPackage File Line Subroutine Has Arguments? Wants Array?\n\
  Stack:\nPackage File Line Subroutine Has Arguments? Wants Array?\nmain ././t.pl\
  \ 5\nTop::top\nYes\nNo\nmain ././t.pl\nmain:\nYes\nNo\nbar\n```\n\n提供的信息应该能让你精确定位脚本中的位置。如果你想将信息记录到日志中，可以引入一个像这样的包装函数：\n\
  \n```\nsub callerlog {\n    my $reference = shift;\n    open(DATA,\">>caller.log\"\
  ) || return;\n    print DATA join(' ',@_),\":$reference\\n\";\n    close(DATA);\n\
  }\n```\n\n然后调用该函数时，可以使用如下行：\n\n```\ncallerlog(\"Writing data\" , caller() );\n```\n\
  \n来报告当前堆栈跟踪的信息。注意，你不能直接使用 `callerlog` 中的信息，因为这样做会在堆栈的零位置引入它自己的帧信息。不过，你可以使用 `callerlog`\
  \ 函数的修改形式，从第一帧开始返回堆栈跟踪：\n\n```\nsub callerlog {\n    my $reference = shift;\n  \
  \  my $level = 1;\n    Chapter 9: Manual Debugging Techniques 193\n    while (((@data)\
  \ = caller($level++))) {\n        print join(' ', @data) , \" : $reference\\n\"\
  ;\n    }\n}\n```\n\n`caller` 提供的信息实际上被 Perl 调试器用于提供调试环境中的跟踪信息。\n\n### 使用 `eval`\n\
  \n\n\n\n\n## 第 9 章：手动调试技术\n\n`eval` 函数提供了一种非常简单的方法来检查某些事件，而不会影响脚本的整体执行。本质上，`eval`\
  \ 函数只是启动一个新的 Perl 解释器实例，以评估特定的字符串或代码块。它在 Perl 中的各个地方都有使用——包括在调试器中，它允许你执行那些任意语句——但它也可以作为调试工具使用。\n\
  \n由于 `eval` 在其自己的解释器中评估 Perl 语句或代码块，我们可以在可能导致 Perl 解释器失败的情况下使用它。这个过程之所以有效，是因为嵌入的\
  \ `eval` 块会通过 `$@` 变量报告由 `die` 调用引发的任何错误。实际上，任何意外退出都会通过 `eval` 报告给 `$@` 特殊变量。\n\n\
  我们可以用一个简单的 `eval` 块来演示这一点，用于测试特定模块是否存在：\n\n```\neval {\n    require Net::FTP;\n\
  }\nprint \"Error: Module failed to load ($@)\" if $@;\n```\n\n输出\n\n```\n$ perl\
  \ eval.pl\nFailed to load Net::FTP: Can't locate Net/FTP.pm in @INC (@INC contains:\
  \ /usr/local/lib/perl5/5.6.0/i686-linux /usr/local/1ib/perl5/5.6.0 /usr/local/lib/perl5/site_perl/5.6.0/i686-linux\n\
  /usr/local/lib/perl5/site_perl/5.6.0 /usr/local/lib/perl5/site_perl .) at eval.pl\
  \ line 1.\n```\n\n有了这些信息，我们现在可以检查任何可能引发错误并捕获和报告问题的内容（除了在编译时执行的语句，如 `use`）。\n\n同样的操作也可以用于更简单的语句，例如检查可能的除零错误。你可以这样做：\n\
  \n```\nif ($b == 0)\n{\n    print \"Can't divide by zero\\n\";\n}\nelse\n{\n   \
  \ print \"Result is \", $a/$b,\"\\n\";\n}\n```\n\n但更简便的做法是：\n\n```\neval { $a/$b\
  \ }; print $@ if $@;\n```\n\n下面是另一个例子，这次是一个使用 `eval` 执行其语句的函数，这样它就可以向调用者返回一个单一的错误，而不是简单地调用\
  \ `die` 并完全终止脚本：\n\n```\nif ($error = writedata(\"debug\", \"some error text\\n\"\
  )) {\n    print(\"Raised an error writing to the log: \\n\",$error, \"Continuing..\
  \ .\\n\") ;\n}\n\nsub writedata {\n    my ($file, $data) = @_;\n    eval {\n   \
  \     open (FILE, \">$file\") or die \"Can't open file ($file): $!\";\n        print\
  \ FILE $data or die \"Can't write to file ($file): $!\";\n        close(FILE) or\
  \ die \"Can't close file ($file): $!\";\n    };\n    return $@ if ($@);\n}\n```\n\
  \n这里我们实际上有三个可能使脚本退出的地方。通过将所有三个语句嵌入到一个 `eval` 块中，然后检查整个函数的返回值，我们成功地将原本可能是致命错误的情况转化为可以安全恢复的情况。当你需要在某个特定选项失败时继续工作，但又不想创建自己的异常和错误处理系统时，这种能力变得非常有用。\n\
  \n在这个例子中，运行脚本会产生：\n\n```\nRaised an error writing to the log:\nCan't open file (debug):\
  \ Permission denied at eval.pl line 15.\nContinuing...\n```\n\n在这个例子中，我们只是忽略了错误，但如果这是一个\
  \ CGI 脚本，你可以将序列和错误报告重定向到 Tk 小部件或另一个 HTML 页面。\n\n### 设计提示\n\n同样的技巧也提供了一种理想的方法，可以将现有脚本从命令行基础转换为\
  \ CGI 或 Tk 基础，而无需对代码进行重大更改。你可以将程序段放入 `eval` 中，而不是将各个单元改为 `die`，然后使用基于 CGI 或 Tk 的错误函数来报告问题。例如，对于标准的（非\
  \ `eval`）`writedata` 函数，我们可以将 `eval` 放在函数调用外部，然后使用 `dialog` 函数通过 Tk 报告错误。\n\n```\n\
  eval {\n    writedata(\"debug\", \"some error text\\n\")\n}\ndialog(\"Raised an\
  \ error writing to the log: \\n\",$error, \"Continuing ...\\n\") if $@;\n```\n\n\
  ### 信号\n\n大多数人都知道使用 `alarm` 函数时的技巧，当指定时间到期时，它会引发 `SIGALRM` 信号。例如，我们可以使用 `alarm`\
  \ 函数在输入信息时提供超时：\n\n```\nuse IO::Handle;\n$name = 'unknown';\neval {\n    local $SIG{ALRM}\
  \ = sub { die \"alarm\\n\" };\n    autoflush STDOUT 1;\n    print \"Hello $name\\\
  n\";\n};\n```\n\n我们还可以使用信号作为指示特定问题的方法，而无需依赖内置函数或自定义错误函数。Perl 还支持两个特殊信号，可用于捕获 `die`\
  \ 和 `warn` 调用。\n\n### 信号作为异常\n\n实际上，可以将信号用作一种异常形式——不是调用 `warn` 或 `die` 或其他函数来指示错误，而是引发一个可用的用户信号来捕获和指示错误。当你想要跳转到用户可配置的错误处理程序而不是依赖固定函数时，这个过程非常有用。为此，你只需要创建一个合适的信号处理程序，安装它，然后使用\
  \ `kill`。例如，\n\n```\nsub error_handler {\n    print STDERR \"Trapped an error!\\\
  n\";\n}\n$SIG{USR1} = \\&error_handler;\nopen(FILE, \"hhhdhd\") or kill USR1, $$;\n\
  ```\n\n这种方法唯一的问题是你不容易交换信息。信号处理程序唯一可用的数据是引发处理程序的信号名称。你可以使用全局变量，但如果决定在多模块脚本中使用该系统，操作就会变得棘手。更好的解决方案是使用\
  \ `WARN` 和 `DIE` 信号，然后继续使用 `warn` 和 `die` 函数。\n\n### WARN 和 DIE 信号\n\n特殊信号 `WARN`\
  \ 和 `DIE` 可用于在调用 `warn` 和 `die` 时执行语句。这种方法允许你更精确地控制这两个函数被调用时发生的情况。通常，`warn` 将提供的错误报告给\
  \ `STDERR` 然后继续，而 `die` 调用报告错误然后调用 `exit()`。如果你想安全地关闭文件，或者直接向用户报告问题，同时仍然使用“标准”错误捕获工具，这种自动操作就会造成问题。\n\
  \n当然，你可以使用我们上面看到的任何技巧——`eval` 和异常信号在大多数情况下都有效，但它们仍然需要对脚本进行微观管理，以便进程有效工作。通过使用这两个信号，你可以动态捕获错误，甚至决定如何报告错误，而无需对代码进行重大修改。\n\
  \n#### 使用 `$SIG{WARN}`\n\n每当调用 `warn` 函数时，就会调用 `warn` 处理程序。处理程序会接收到传递给 `warn` 函数的任何参数，但\
  \ `warn` 函数实际上不会执行——处理程序完全替代了函数的正常操作。例如，\n\n```\nsub warn_handler {\n    print STDERR\
  \ \"Woah - trapped a warning!\\n\\t\",@_;\n}\n$SIG{WARN} = \\&warn_handler;\nwarn\
  \ \"Something went awry\\n\";\nwarn \"Something went awry again\\n\";\n```\n\n运行此代码会产生以下输出：\n\
  \n```\nWoah - trapped a warning!\n    Something went awry Woah - trapped a warning!\n\
  \    Something went awry again\n```\n\n你可以看到消息只打印了一次——这里是由信号处理程序中的 `print` 调用打印的。\n\
  \n当你想要提供另一种报告或记录错误的方式时，最好使用 `WARN` 处理程序。你会在本章其他地方找到直接将信息报告到日志的示例；你只需要在脚本顶部安装一个处理程序，以另一种方式捕获和处理警告。例如，这里有一个使用\
  \ `writelog` 函数（参见下面的“使用日志函数”）将错误报告到日志而不是屏幕的处理程序：\n\n```\nsub warn_handler {\n```\n\
  \n\n\n\n\n`writelog(\"warning: (%s)\",join( 1 , ',©_));`\n\n```\n}\n$SIG{ WARN }\
  \ = \\&warn_handler ;\n```\n\n我们无需对代码做进一步修改（除了添加 `writelog` 函数定义）。从现在起，所有对 `warn`\
  \ 的调用都会触发此处理程序，并强制将输出写入文件而非 `STDERR`。类似的技巧允许我们通过 Tk 报告警告：\n\n```\nsub warn_handler\
  \ {\n    dialog(undef,\"Warning\", join(', ',@_), 1 warning 1 ,1,\"OK\") ;\n}\n\
  ```\n\n关于 `dialog` 函数的示例，请参见第 7 章。\n\n198 调试 Perl：程序员故障排除指南\n\n## 使用 `$SIG{ DIE\
  \ }`\n\n与 `WARN` 不同，`DIE` 处理程序仅作为进程中的介入者——处理程序被调用，但 `die` 函数继续正常执行，既打印错误信息又调用 `exit()`。考虑以下脚本：\n\
  \n```\nsub die_handler {\n    print \"哇哦 - 捕获到一个 die 调用\\n 尝试优雅退出...\\n\";\n}\n\
  $SIG{ DIE } = \\&die_handler;\ndie \"某些地方完全出错了\\n\";\n```\n\n注意，处理程序将接收到由 `die`\
  \ 格式化的文本——这意味着我们可以修改文本，然后再次调用 `die` 以实际输出更新后的版本。例如，行\n\n`die \"就是撑不下去了！\";` 生成\n\
  \n`就是撑不下去了！ at sigdiemod.pl line 7.`\n\n但添加一个处理程序：\n\n```\nsub die_handler {\n \
  \   my ($error) = @_;\n    die \"捕获到一个错误：$error\";\n}\n$SIG{ DIE } = \\&die_handler;\n\
  ```\n\n错误变为\n\n`捕获到一个错误：就是撑不下去了！ at sigdiemod.pl line 9.`\n\n`die_handler` 函数只会被调用一次，因为信号处理程序在第一次调用后被重置。\n\
  \n当你希望优雅地退出脚本时，最好使用 `DIE` 处理程序——也许在最终允许脚本终止之前，向用户提供一个简单的提示，并安全地关闭文件或网络连接。诚然，你可以使用\
  \ `END` 块来完成此过程，但这样做意味着关闭语句是在 `die` 实际被调用之后执行的。此外，它还依赖于在终止时 `END` 块能够访问函数、文件句柄和其他构件。\n\
  \n目前，即使在 `eval` 块内，也会调用 `DIE`（和 `WARN`）处理程序。这可能会引发问题，因为 `$@` 变量可能尚未填充，因此请考虑使用 `$^S`\
  \ 变量来检查调用处理程序时解释器的状态。如果语句是从 `eval` 字符串或块中调用的，则 `$^S` 变量为真。\n\n第 9 章：手动调试技术 199\n\
  \n### 编写日志\n\n有时你需要将调试信息写入标准输出和错误文件句柄之外的其他地方。在这种情况下，你可以将信息直接重定向到另一个文件——我们在本章前面已经通过\
  \ `caller` 函数看到了这样的示例。\n\n有多种方法可以实现这一点。在最简单的层面上，你可以直接使用 `print` 将输出发送到其他地方。对于更全面的解决方案，你应该考虑重定向。这种方法将确保\
  \ `warn` 和 `die` 也将信息输出到日志，而不是真正的 `STDERR`。最终的解决方案是将信息报告给 Unix 机器上的 `syslog` 守护进程，或\
  \ Windows 机器上的事件日志。此过程对于在管理环境中扮演重要角色的脚本非常有用，因为你需要将信息报告给中央日志，而不是特定于应用程序的日志。\n\n###\
  \ 重定向 STDOUT/STDERR\n\n创建日志而不严重影响脚本输出的最简单方法是简单地将默认的 `STDOUT` 和 `STDERR` 重定向到其他地方，你可以这样做：\n\
  \n```\nopen(SECOUT,\">&STDOUT\");\nopen(SECERR,\">&STDERR\");\nopen(STDOUT,\">stdlog.txt\"\
  );\nopen(STDERR,\">stderr.txt\");\n```\n\n现在，要打印到真正的标准输出，你需要将输出发送到 `SECOUT`。\n\n\
  **设计提示**\n\n如果你要重定向脚本的完整输出，请考虑将重定向语句放在 `BEGIN` 块中，这样即使导入的模块引发错误，所有内容也会被重定向到日志文件。\n\
  \n事实上，最好在这些语句之后加上 `select SECOUT;`，以确保标准的 `print` 和其他调用将输出发送到真正的标准输出，而不是重定向后的那个。\n\
  \n在向日志发送信息时，关闭文件缓冲是个好主意；这样做可以防止溢出，并确保即使脚本崩溃，数据也能被写入。\n\n**设计提示**\n\n由于你可以控制提供用户界面的文件句柄，但无法控制用于打印来自贡献模块的调试信息的文件句柄，因此仅重定向\
  \ `STDERR` 通常是更实用的解决方案。\n\n使用这种方法，还可以创建调试输出的日志文件。当使用间接访问的脚本（例如 Web 服务器上使用的脚本）时，此文件特别有用。在这里，\n\
  \n200 调试 Perl：程序员故障排除指南\n\n将调试信息打印到标准输出会导致该信息作为文档的一部分发送回用户的 Web 浏览器。相反，你可以将其重定向到文件。\n\
  \n### 使用日志记录函数\n\n如果你不想重定向 `STDOUT` 和 `STDERR` 文件句柄，另一种解决方案是创建一个函数，该函数打开文件并将你提供的信息直接写入日志文件。\n\
  \n```\nsub writelog {\n    my ($format,@rgs) = @_;\n    open(LOGFILE,\">>debug.log\"\
  )\n        or die \"无法打开调试日志！: $!\\n\";\n    printf LOGFILE ($format,@args);\n \
  \   close LOGFILE;\n}\n```\n\n现在你可以直接调用 `writelog` 函数：\n\n`writelog(\"在第 %s 行来自\
  \ %s 出现错误\", $line, $file);`\n\n更高效的解决方案是使用全局变量作为文件句柄，然后修改函数，使其仅在文件尚未打开时才打开：\n\n\
  ```\nmy $logfile = undef;\nsub writelog {\n    my ($format,@rgs) = @_;\n    unless(defined($logfile))\
  \ {\n        open($logfile,\">>debug.log\")\n            or die \"无法打开调试日志！: $!\\\
  n\";\n    }\n    printf $logfile ($format,@args);\n}\n```\n\n使用调试日志是在非交互式脚本中捕获调试信息的最佳方式。为了充分利用该函数，请确保同时记录错误报告的时间、进程\
  \ ID，以及（如果相关）机器和/或用户名。这样，当你检查日志时，应该能更清楚地了解错误发生的时间和原因。\n\n第 9 章：手动调试技术 201\n\n现在，文件将只打开一次——当第一次调用\
  \ `writelog` 时——然后每次后续调用都只是追加内容。注意，我们移除了对 `close` 的调用；我建议你将其放入 `END` 块中：\n\n```\n\
  END {\n    close($logfile) if (defined($logfile));\n}\n```\n\n这样做将确保脚本终止时文件被正确关闭。\n\
  \n如果你愿意，还可以在自己的 `writelog` 函数中调用 `warn` 函数，从而确保错误被记录到文件并在运行时报告给用户。\n\n### 报告到 syslog\n\
  \nPerl 附带了 `Sys::Syslog` 模块，它提供了一个非常简单的接口，用于将信息报告给 `syslog` 系统，而 `syslog` 系统又会将信息写入系统日志，通常保存在\
  \ `/var/log/syslog`（或类似位置）。如果你打算以这种方式记录信息，最好在脚本开头调用 `openlog` 函数：\n\n`openlog($myprog,\
  \ 'cons,pid', 'user')`\n\n第一个参数是程序的标识。该字符串会附加到日志中的每条消息之前。第二个参数定义了写入日志时使用的选项，以逗号分隔的单词列表形式给出。可用选项如表\
  \ 9-1 所示。最后一个参数定义了错误影响的设施。例如，你可以使用 `user` 选项记录用户脚本的错误，或者使用授权/安全设施记录授权问题。同样，请记住这些是系统相关的。表\
  \ 9-2 列出了一些可能的候选设施。\n\n\n\n\n选项描述\n\n表 9.1 Syslog 日志记录选项\n\n202 调试 Perl：程序员故障排除\n\
  \n表 9.3 Syslog 消息优先级\n\n## 第 9 章：手动调试技术\n\n完成日志写入后，使用`closelog`关闭连接。作为一个完整示例，以下代码片段\n\
  \n```\nuse Sys::Syslog;\n\nopenlog('perl', 'cons,pid', 'user'); syslog('warning'\
  \ ,'Something happened'); closelog () ;\n```\n\n在 Solaris 系统上生成以下条目：\n\nJul 19 11:13:57\
  \ twinspark perl [2686] : Something happened\n\n### 报告到 Windows NT/2000 事件日志\n\n\
  Windows NT 事件日志是一个集中式日志记录系统，原理上与 syslog 系统类似，但稍微更高级一些。事件日志主要用于记录错误和警告，但也可以用于存储简单的信息性消息以及审计事件——即由管理员配置为专门跟踪和记录的事件。\n\
  \n事件日志存储的信息也比 syslog 的标准格式多得多。例如，syslog 系统可以配置为报告计算机和用户信息，但这不是强制性的。而事件日志会自动记录这些信息。此外，还可以包含当时正在处理的任何数据；扩展消息字符串、类别和事件类型。\n\
  \n机器上的事件日志数量取决于配置；Windows NT 和 Windows 2000 的标准日志如表 9-4 所示。系统可以设置其他日志来记录特定的操作系统服务和应用程序。你最可能使用的是应用程序日志，但在某些特定情况下，系统日志或安全日志可能更合适。\n\
  \n日志\n\n应用程序\n\n平台\n\nNT, 2000\n\n描述\n\n用于存储各个应用程序引发的信息、警告和错误。\n\n安全\n\nNT, 2000\n\
  \n记录成功和不成功的网络登录尝试、安全漏洞（当识别到时）以及用户尝试访问受保护资源的行为。\n\n系统\n\nNT, 2000\n\n操作系统特定的错误和警告，例如无法启动服务或与设备通信。\n\
  \n表 9.4 Windows NT/2000 支持的事件日志\n\n204 调试 Perl：程序员故障排除\n\n日志\n\n平台\n\n描述\n\n目录服务\n\
  \n2000\n\nWindows 2000 Active Directory 系统引发的错误/警告/信息。\n\nDNS 服务器\n\n2000\n\nDNS\
  \ 服务器引发的错误/警告/信息，包括无法解析地址、联系命名服务器或与根服务器通信。\n\n文件复制服务\n\n2000\n\n用于在 Windows 2000\
  \ 网络上分发文件的文件复制服务引发的错误/警告/信息。\n\n表 9.4 Windows NT/2000 支持的事件日志（续）\n\n要向事件日志系统报告错误，需要创建一个新的`Win32::EventLog`对象，然后使用提供的方法实际向系统引入新报告。创建事件日志的一般格式为\n\
  \n```\nuse Win32::EventLog;\n\n$object = new Win32::EventLog(EVENTLOG [, SERVER])\n\
  ```\n\n`new`类方法返回一个事件日志对象，在`SERVER`上打开`EVENTLOG`。`EVENTLOG`参数应作为字符串提供，使用表 9-4 中列出的标准标识符之一。如果未指定`SERVER`或为空，则在本地机器上打开日志。例如，要在本地机器上打开应用程序日志：\n\
  \n```\n$eventlog = new Win32::EventLog('Application');\n```\n\n要实际引入日志条目，需要调用`Report`方法。该方法接受一个指向哈希的引用，该哈希包含要报告的信息。哈希的键如表\
  \ 9-5 所示，表 9-6 显示了模块导出的可与`EventType`键一起使用的常量。\n\n键 描述\n\n表 9.5 事件日志条目的哈希键\n\n第 9\
  \ 章：手动调试技术 205\n\n例如，以下代码片段\n\n```\nuse Win32::EventLog;\n\nmy $eventlog = new Win32::EventLog('Application');\n\
  \n%event = (Data => 'Some data', Source => 'Perl', EventID => 1,\n\nEventType =>\
  \ EVENTLOG_WARNING_TYPE,\n\nStrings => 'I failed to pick up some info I was expecting',\
  \ Category => 0);\n\n$eventlog->Report(\\%event);\n```\n\n将在事件日志中记录一个应用程序错误。请注意，这里我使用了哈希，然后调用`Report`方法，而不是直接嵌入信息——使用同一个哈希并在需要报告新错误时仅更新相关信息会更快捷、更简单。\n\
