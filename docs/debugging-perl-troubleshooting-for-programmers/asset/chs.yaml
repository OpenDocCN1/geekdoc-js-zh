  \ Perl 中。\n\n系统调用的参数太多 致命错误\n\nPerl 最多只支持 `syscall` 的 14 个参数。\n\n`%s` 的参数过多 致命错误\n\
  \n该函数需要的参数比你指定的少。\n\n正则表达式中结尾的 `\\` 致命错误\n\n正则表达式以反斜杠结尾——请尝试用另一个反斜杠转义该反斜杠。\n\n音译模式未终止\
  \ 致命错误\n\n词法分析器找不到 `tr` 或 `tr[][]` 或 `y` 或 `y[][]` 结构的内部定界符。省略变量 `$tr` 或 `$y` 前面的\
  \ `$` 可能导致此错误。\n\n音译替换未终止 致命错误\n\n词法分析器找不到 `tr` 或 `tr[][]` 结构的最终定界符。\n\n`truncate`\
  \ 未实现 致命错误\n\n你的操作系统不支持文件截断。请尝试先删除文件，然后重新创建。\n\n`%d` 类型的参数传递给 `%s` 必须是 `%s`（而不是\
  \ `%s`） 致命错误\n\n你向函数或运算符提供了错误类型的变量。对于内置函数，这可能意味着你向 `keys` 或类似函数提供了标量或数组值，或者你向 `push`\
  \ 或其他期望数组的函数提供了标量或哈希值。如果你使用了原型，你自己的子例程也会引发相同的错误消息。\n\n请记住，你可以使用块表示法解引用数组或哈希的引用：\n\
  \n```\n$hash = {hello => 'world'}; print keys %{$hash};\n```\n\n`umask`：参数缺少前导 0\
  \ 警告（umask）\n\n`umask` 函数应提供八进制值，而不是十进制值。你可能调用了\n\n`umask 222;`\n\n而本意是\n\n`umask\
  \ 0222;`\n\n`umask` 未实现 致命错误\n\n你的机器未实现 `umask` 函数。\n\n无法创建名为 `\"%s\"` 的子例程 致命错误\n\
  \n你试图创建或访问一个名称非法的子例程。\n\n上下文不平衡：PUSH 比 POP 多 `%d` 个 警告（内部）\n\n退出代码检测到进入和离开的执行上下文数量存在内部不一致。\n\
  \n保存不平衡：保存比恢复多 `%d` 个 警告（内部）\n\n退出代码检测到临时局部化的值数量存在内部不一致。\n\n作用域不平衡：ENTER 比 LEAVE\
  \ 多 `%d` 个 警告（内部）\n\n退出代码检测到进入和离开的块数量存在内部不一致。\n\n临时变量不平衡：分配比释放多 `%d` 个 警告（内部）\n\n\
  退出代码检测到分配和释放的临时标量数量存在内部不一致。\n\n调用了未定义的格式 `\"%s\"` 致命错误 所指示的格式似乎不存在。\n\n调用了未定义的排序子例程\
  \ `\"%s\"` 致命错误\n\n指定的排序比较例程似乎不存在。\n\n调用了未定义的子例程 `&%s` 致命错误\n\n所指示的子例程尚未定义，或者如果已定义，则后来被取消了定义。\n\
  \n调用了未定义的子例程 致命错误\n\n你试图调用的匿名子例程尚未定义，或者如果已定义，则后来被取消了定义。\n\n排序中使用了未定义的子例程 致命错误\n\n\
  指定的排序比较例程已声明，但似乎尚未定义。\n\n调用了未定义的顶层格式 `\"%s\"` 致命错误 所指示的格式似乎不存在。\n\n为类型团分配了未定义的值\
  \ 警告（杂项）\n\n为类型团分配了一个未定义的值。你可能尝试了\n\n`*foo = undef;`\n\n而本意是\n\n`undef *foo;`\n\n\
  `unexec` 将 `%s` 写入 `%s` 失败！ 致命错误 `unexec` 例程因某种原因失败。\n\n未知的 BYTEORDER 致命错误\n\n对于具有此字节顺序的机器，没有字节交换函数。\n\
  \n未知的 `open()` 模式 `'%s'` 致命错误\n\n三参数 `open` 的第二个参数不在有效模式列表中：`<`、`>`、`>>`、`+<`、`+\
  \ >`、`+>>`、`- |`、`| -`。\n\n未知进程 `%x` 向 `prime_env_iter` 发送消息：`%s` 内部错误，仅限 VMS\n\n\
  Perl 在迭代 `%ENV` 之前正在读取其值，而其他进程在 Perl 期望的数据流中插入了一条消息。\n\n正则表达式中不匹配的 `()` 致命错误\n\n\
  正则表达式中未转义的括号必须始终成对出现。\n\n不匹配的右 `%s` 括号 致命错误\n\n词法分析器统计到的右花括号或右方括号比左括号多，因此你可能缺少一个匹配的左括号。\n\
  \n正则表达式中不匹配的 `[]` 致命错误\n\n字符类周围的方括号必须匹配。如果要在字符类中包含右方括号，请使用反斜杠转义或将其放在首位。\n\n未引用的字符串\
  \ `\"%s\"` 可能与未来的保留字冲突 警告（保留）\n\n你使用了一个裸字，该字将来可能被声明为保留字。请更改名称——使其不是全小写或包含下划线字符——或者预定义一个子例程。\n\
  \n无法识别的字符 `%s` 致命错误\n\n\n\n\n\nPerl 解析器不知道如何处理你的 Perl 脚本（或 eval）中指定的字符。你可能尝试运行一个压缩脚本、二进制程序或一个目录作为\
  \ Perl 程序。\n\n`Unrecognized escape\\%c passed through Warning (misc)`\n\n你使用了 Perl\
  \ 无法识别的反斜杠-字符组合。\n\n`Unrecognized signal name \"%s\" Fatal Error`\n\n你向 `kill` 函数指定了一个无法识别的信号名称。请检查\
  \ `%SIG` 哈希以获取有效信号名称列表，或在你的 shell 中调用 `kill -1`。\n\n`Unrecognized switch: -%s {-h\
  \ will show valid options) Fatal Error`\n\n你向 Perl 提供了一个无效的命令行选项。\n\n`Unsuccessful\
  \ %s on filename containing newline Warning (newline)`\n\n对一个文件名尝试了文件操作，但该操作失败，因为文件名包含换行符——请检查你是否对使用的值应用了\
  \ `chop` 或 `chomp`。\n\n`Unsupported directory function \"%s\" called Fatal Error`\n\
  \n你的机器不支持 `opendir` 和 `readdir`。\n\n`Unsupported function fork Fatal Error`\n\n\
  你的操作系统或当前执行的 Perl 版本不支持 `fork` 函数。\n\n`Unsupported function %s Fatal Error`\n\n\
  这台机器显然没有实现所指示的函数。\n\n`Unsupported socket function \"%s\" called Fatal Error`\n\n\
  你的机器不支持 Berkeley 套接字机制。\n\n`Unterminated <> operator Fatal Error`\n\n词法分析器在期望一个项的位置看到了左尖括号，因此它正在寻找对应的右尖括号但未找到。请检查语句中的括号，确保你没有在简单的小于比较语句位置引入\
  \ `<>` 运算符。\n\n`Unterminated attribute parameter in attribute list Fatal Error`\n\
  \n词法分析器在解析属性列表时看到了一个左括号字符，但未找到匹配的右括号字符。你可能需要添加（或删除）一个反斜杠字符以使括号平衡。\n\n398 Debugging\
  \ Perl: Troubleshooting for Programmers\n\n`Unterminated attribute list Fatal Error`\n\
  \n词法分析器在属性开头发现了一个非简单标识符的内容，并且它不是分号也不是块的开始。请检查属性列表的终止。\n\n`Use of $# is deprecated\
  \ Deprecated Feature`\n\n你应该使用 `printf` 或 `sprintf` 来格式化数字，而不是使用 `$#` 变量。\n\n`Use\
  \ of $* is deprecated Deprecated Feature`\n\n应使用 `//m` 和 `//s` 修饰符逐个表达式地替换 `$*`\
  \ 变量的使用，该变量用于开启正则表达式中的多行模式匹配。\n\n`Use of %s in printf format not supported Fatal\
  \ Error`\n\n你尝试使用 `printf` 的一个特性，该特性仅能从 C 语言中访问。\n\n`Use of bare «to mean «\"\"\
  \ is deprecated Deprecated Feature`\n\n你应该向 \"here\" 文档运算符 `«` 提供一个真正的字符串，而不是在你想使用空行作为\
  \ \"here\" 文档终止符时使用隐含的空字符串。例如，将\n\n```\nprint << Hello\n```\n\n改为\n\n```\nprint\
  \ <<\"\" Hello\n```\n\n`Use of implicit split to @_ is deprecated Deprecated Feature`\n\
  \n从 `split` 函数隐式地将各个元素放入 `@_` 的做法已被弃用，尤其是在有自己 `@_` 数组要处理的独立子程序中。请将 `split` 的结果赋值给一个适当的数组或列表。\n\
  \n`Use of inherited AUTOLOAD for non-method %s() is deprecated Deprecated Feature`\n\
  \n作为一个（嗯）意外特性，`AUTOLOAD` 子程序会被作为方法查找（使用 `@ISA` 层次结构），即使要自动加载的子程序是作为普通函数（`Foo::bar()`）调用的，而不是作为方法（`Foo->bar()`\
  \ 或 `$obj->bar()`）。这个 bug 将在 Perl 5.005 中修复，届时将仅对方法 `AUTOLOAD` 使用方法查找。然而，有大量现有代码可能使用了旧行为。因此，作为过渡步骤，Perl\
  \ 5.004 在非方法使用继承的 `AUTOLOAD` 时会发出一个可选警告。\n\n简单的规则是：自动加载非方法时，继承将不起作用。对旧代码的简单修复是：在任何曾经依赖从名为\
  \ `BaseClass` 的基类继承非方法的 `AUTOLOAD` 的模块中，在启动期间执行\n\n```\n*AUTOLOAD = \\&BaseClass::AUTOLOAD\n\
  ```\n\nAppendix A: Error Message Cross Reference 399\n\n在目前使用以下代码的模块中：\n\n```\n\
  use AutoLoader;\n@ISA = qw( AutoLoader);\n```\n\n你应该从 `@ISA` 中移除 `AutoLoader`，并将\
  \ `use AutoLoader;` 改为\n\n```\nuse AutoLoader 'AUTOLOAD';\n```\n\n`Use of reserved\
  \ word \"%s\" is deprecated Deprecated Feature`\n\n所指示的裸字是一个保留字。未来版本的 Perl 可能会将其用作关键字，因此你最好根据使用上下文以适当方式显式引用该词，或者完全使用不同的名称。对于子程序名称，可以通过添加\
  \ `&` 前缀或使用包限定符来抑制该警告，例如 `&our()` 或 `Foo::our()`。\n\n`Use of %s is deprecated Deprecated\
  \ Feature`\n\n不再推荐使用所指示的结构。\n\n`Use of uninitialized value%s Warning (uninitialized)`\n\
  \n一个未定义的值被当作已定义的值使用。它被解释为空字符串或 0，但这可能是个错误。要抑制此警告，请为你的变量赋予已定义的值。\n\n`Useless use\
  \ of \"re\" pragma Warning`\n\n你执行了 `use re;` 但没有带任何参数。\n\n`Useless use of %s in\
  \ void context Warning (void)`\n\n你在一个不关心返回值的上下文中执行了没有副作用的操作，例如一个不返回值的语句（来自块）或标量逗号运算符的左侧。这通常不是你的愚蠢错误，而是\
  \ Perl 未能按你预期的方式解析你的程序。例如，如果你混淆了 C 的优先级和 Python 的优先级，写了\n\n```\n$one, $two = 1,\
  \ 2 ;\n```\n\n而本意是\n\n```\n($one, $two) = (1, 2);\n```\n\n另一个常见错误是使用普通括号来构造列表引用，而应该使用方括号或花括号；例如，如果你写了\n\
  \n```\n$array = (1,2);\n```\n\n而本应写成\n\n```\n$array = [1,2];\n```\n\n方括号显式地将列表值转换为标量值，而圆括号则不会。因此，当在标量上下文中计算带圆括号的列表时，逗号被视为\
  \ C 的逗号运算符，它会丢弃左参数——这不是你想要的。\n\n`untie attempted while %d inner references still\
  \ exist Warning (untie)`\n\n当调用 `untie` 时，从 `tie`（或 `tied`）返回的对象副本仍然有效。\n\n`Value\
  \ of %s can be \"0\"; test with defined!) Warning (misc)`\n\n在条件表达式中，你将 `<HANDLE>`、`<*>`（作为\
  \ glob）、`each` 或 `readdir` 用作布尔值。这些结构中的每一个都可能返回 \"0\" 值；这会使条件表达式为假，这可能不是你的本意。在条件表达式中使用这些结构时，请使用\
  \ `defined` 运算符测试它们的值。\n\n`Value of CLI symbol \"%s\" too long Warning (misc), VMS\
  \ only`\n\nPerl 尝试从 CLI 符号表中读取 `%ENV` 元素的值，发现结果字符串长度超过 1024 个字符。返回值已被截断为 1024 个字符。\n\
  \n`Variable \"%s\" is not imported%s Fatal Error`\n\n这里可能有两个问题。要么你尝试将变量用作函数调用——例如，\n\
  \n```\n$function();\n```\n\n你可能使用了错误的括号——或者你忘记将变量解引用为函数。或者，也可能只是一个拼写错误。\n\n当 `strict`\
  \ 编译指令生效时，这可能意味着你尝试使用一个你认为是从其他地方导入的全局变量。\n\n`Variable \"%s\" may be unavailable\
  \ Warning (closure)`\n\n\n\n\n一个内部（嵌套的）匿名子程序位于一个命名子程序内部，而该命名子程序外部还有另一个子程序；并且这个匿名（最内层）子程序引用了最外层子程序中定义的一个词法变量。例如：\n\
  \n```\nsub outermost {\n    my $ a ; sub middle\n    {\n        sub { $a }\n   \
  \ }\n}\n```\n\n如果该匿名子程序是从最外层子程序中被调用或引用（直接或间接），那么它将按预期共享该变量。但如果最外层子程序未处于活动状态时调用了该匿名子程序，那么它将看到该共享变量在第一次调用最外层子程序之前及期间的值，这很可能不是你想要的。在这种情况下，通常最好将中间子程序改为匿名，使用\
  \ `sub {}` 语法。Perl 对嵌套匿名子程序中的共享变量有专门支持；中间的一个命名子程序会干扰此特性。\n\n变量 \"%s\" 将不会保持共享 警告（闭包）\n\
  \n一个内部（嵌套的）命名子程序引用了外部子程序中定义的一个词法变量。当内部子程序被调用时，它很可能看到外部子程序的变量在第一次调用外部子程序之前及期间的值；在这种情况下，第一次调用外部子程序完成后，内部和外部子程序将不再共享该变量的共同值。换句话说，该变量将不再被共享。此外，如果外部子程序是匿名的，并且引用了自身外部的词法变量，那么外部和内部子程序将永远不会共享该给定变量。这很容易通过以下示例演示：\n\
  \n```\nsub outer {\n    ($num) = @_; my $var = 1 first 1 ; print \"Outer($num):\
  \ $var\\n\"; sub inner {\n        print \"Inner($num): $var\\n\"; $var = \"third\\\
  n\";\n    }\n    inner();\n    $var = 1 second 1 ;\n}\nouter (1); outer(2); outer(3);\n\
  ```\n\n这将生成：\n\n```\nOuter (1) : first Inner(1): first Outer (2) : first Inner(2):\
  \ second Outer(3): first Inner(3): third\n```\n\n现在内部和外部子程序中的 `$var` 是独立的变量，而不是共享的。\n\
  \n这个问题通常可以通过将内部子程序改为匿名来解决，使用 `sub {}` 语法。当引用外部子程序中变量的内部匿名子程序被调用或引用时，它们会自动重新绑定到这些变量的当前值。\n\
  \n402 调试 Perl：程序员故障排除\n\n变量语法 外部错误\n\n你意外地通过 `csh` 而不是 Perl 运行了你的脚本。请检查 shebang（`#!`）行，或者手动将你的脚本输入到\
  \ Perl 中。\n\n版本号必须是常量数字 内部错误\n\n尝试将 `use Module n.n LIST` 语句转换为其等效的 `BEGIN` 块时，发现版本号存在内部不一致。你可能试图为版本号提供一个变量而不是常量。\n\
  \nperl: 警告: 设置区域设置失败 严重警告\n\n整个警告消息看起来像这样：\n\n```\nperl: warning: Setting locale\
  \ failed.\nperl: warning: Please check that your locale settings: LC_ALL = \"En_US\"\
  , LANG = (unset)\nare supported and installed on your system.\nperl: warning: Falling\
  \ back to the standard locale (\"C\").\n```\n\n具体失败的区域设置各不相同。在上面的例子中，设置是 `LC_ALL`\
  \ 为 `\"En_US\"`，而 `LANG` 没有值。此错误意味着 Perl 检测到你或你的系统管理员设置了所谓的变量系统，但 Perl 无法使用这些设置。幸运的是，这并不致命：有一个名为\
  \ `\"C\"` 的“默认区域设置”，Perl 可以使用它——脚本仍会运行。然而，在你真正修复问题之前，每次运行 Perl 时都会收到相同的错误消息。如何真正修复问题在\
  \ `perllocale` 手册页的 `LOCALE PROBLEMS` 部分中有描述。\n\n警告: 出错了 警告\n\n你在 `$_` 为空时调用了 `warn`，并传入了空字符串或没有传入任何参数。\n\
  \n警告: 无法正确关闭文件句柄 %s 严重警告\n\n当在活动文件句柄上调用 `open` 时，会先关闭之前的文件。此情况下的关闭操作失败。这可能是由于磁盘空间问题，但也可能是其他进程在你的脚本使用完文件之前删除了该文件。\n\
  \n警告: 使用不带括号的 \"%s\" 有歧义 严重警告（歧义）\n\n你写了一个一元运算符，后面跟着一个看起来像二元运算符的东西，而该二元运算符也可能被解释为一个项或一元运算符。例如，如果你知道\
  \ `rand` 函数的默认参数是 1.0，并且你写了：\n\n```\nrand + 5;\n```\n\n你可能认为你写的是 `randO + 5;` 相同的东西，\n\
  \n附录 A：错误消息交叉引用 403\n\n但实际上，你得到的是 `rand(+5);`\n\n请加上括号以表达你的真实意图。\n\nwrite() 在已关闭的文件句柄\
  \ %s 上 警告（已关闭）\n\n你正在使用 `close` 关闭一个已经关闭的文件句柄。请检查逻辑，看是否调用了两次 `close`。你可能还想检查用于保存文件句柄的变量，以防它在尝试关闭之前超出了作用域。\n\
  \nX 超出字符串范围 致命错误\n\n你提供了一个 `pack` 模板，该模板给出了一个相对位置，该位置在你正在解包的字符串开始之前。如果你使用的是动态 `pack`\
  \ 模板，请考虑在编译模板之前检查字符串长度。如果你使用的是静态模板，请检查你正在导入的数据，以便在调用 `pack` 之前对 `pack` 模板进行更改或动态调整。\n\
  \nx 超出字符串范围 致命错误\n\n你提供了一个 `pack` 模板，该模板给出了一个相对位置，该位置超出了你正在解包的字符串的边界。如果你使用的是动态 `pack`\
  \ 模板，请考虑在编译模板之前检查字符串长度。如果你使用的是静态模板，请检查你正在导入的数据，以便在调用 `pack` 之前对 `pack` 模板进行更改或动态调整。\n\
  \nXsub \"%s\" 在排序中被调用 致命错误\n\n尚不支持将外部子程序用作排序比较。\n\nXsub 在排序中被调用 致命错误\n\n尚不支持将外部子程序用作排序比较。\n\
  \n你不能在文件句柄上使用 -I 致命错误\n\n你不能使用 `-1` 统计运算符从文件句柄获取链接信息，因为原始文件名已经被解析。请改用文件名。\n\n你还没有在内核中禁用\
  \ SET-ID 脚本！ 致命错误\n\n使用 `wrapsuid` 脚本为你想要以 setuid 方式执行的脚本添加包装。\n\n你需要引用 \"%s\" 语法警告\n\
  \n在分配信号处理程序时，你应该指定一个函数名的引用，而不是使用裸字。否则，Perl 将调用该函数并将赋值返回值作为信号处理程序。例如：\n\n```\n$SIG{ALRM}\
  \ = alarmcall;\n```\n\n应该写成：\n\n```\n$sig{alrm} = \\&alarmcall;\n```\n\n404 调试 Perl：程序员故障排除\n\
