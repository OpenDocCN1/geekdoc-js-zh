  \ 系统调用（或等效调用）。\n\n### `setpgrp` 不能接受参数 致命错误\n\n你的系统使用的是 BSD 4.2 版本的 `setpgrp()`，它不接受任何参数，这与\
  \ POSIX 的 `setpgid()` 不同，后者接受进程 ID 和进程组 ID。\n\n### `setrgid()` 未实现 致命错误\n\n你尝试给\
