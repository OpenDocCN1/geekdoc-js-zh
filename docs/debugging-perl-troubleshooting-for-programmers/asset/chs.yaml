  \n# 第一部分\n## Perl 调试简介\n\n## 第 1 章\n### 引言\n\n![picture0](img/picture0.jpg)\n\n\
  4 调试 Perl：程序员故障排除指南\n\nPerl 是一种极其实用且有用的语言。你可以选择结构化或非结构化的方式，仍然能获得相同的结果。然而，它最令人喜爱且最重要的成就或许是使用了相当简单的结构，使你只需几行实际代码就能解决各种问题。这种语言非常易于使用，尤其是在\
  \ Unix 程序中，以至于进入编辑器编写一个快速的 Perl 程序来解决问题已成为许多程序员的生活方式。\n\n不幸的是，Perl 自由随意的格式意味着你很容易在不知不觉中向程序引入错误。Perl\
  \ 并不强制进行错误检查——如果你决定不检查函数的返回值，Perl 不会抱怨。甚至有可能编写出本不应通过解释器的代码，却仍然让程序执行，尽管它很可能无法正常工作。\n\
  \n识别并消除错误是一门艺术。你需要知道自己在寻找什么，也需要知道问题发生在哪里。即使在一个简单的应用程序中，问题的根源也可能位于真正问题所在位置的一两个函数调用之外。当然，有不同的技术来查找错误。你可以使用\
  \ `print` 语句、内置调试函数或外部调试器。它们各有优缺点。\n\n无论你如何调试程序，调试过程实际上不仅仅是挑出那些导致程序显示错误结果、调用错误过程或完全崩溃的错误。认为调试只是在程序编写完成后解决问题是一种谬误：你需要首先思考程序是如何编写的。\n\
  \n在编写代码时遵循一些简单的实践，你可以在大多数错误发生之前就消除它们。从一开始，你就应该从整体上思考你的程序，并以这样的方式设计它：要么在用户意识到错误之前捕获它们，要么以不影响用户的方式处理它们。基本的错误捕获应该成为所有程序的一部分——即使是简单的程序。\n\
  \n你还可以使用抽象——将程序划分为函数和模块——来拆分你的程序。通过将应用程序划分为函数和模块，你可以提高其可靠性和可维护性，最重要的是，当错误发生时，更容易追踪和修复它们。\n\
  \nVJiP9inH 即使是像使用一个对程序员友好的编辑器这样简单的事情，也能带来不同。WtimJKKUm 一个好的编辑器可以帮助突出显示排版错误，并以一种更容易理解的方式显示你的程序，而无需用手指逐行追踪语句的每个组成部分。\n\
  \n无论你如何调试代码，以及使用什么工具和方法来简化这个过程，调试过程中的一个重要步骤是仔细审视你的代码及其行为。许多程序员编写的是能工作的代码，而不是工作良好的代码。90%\
  \ 的情况下执行不会造成问题，但正是那 10% 至关重要。如果你询问用户对程序的体验，他们更可能记住的是失败而非成功。\n\n第 1 章：引言 5\n\n\n\n\
  \n你可以使用各种技术来仔细审视你的代码。通过使用调试器，你可以极其详细地跟踪代码的执行过程。对于查找单个错误，这种方法非常完美，但当你想要改进代码的执行效率时，你需要使用性能分析器来监控代码每个部分所花费的时间。你还可以利用\
  \ Perl 编译器的一些意想不到的特性，为你的脚本提供一些有用的背景信息。识别所有这些不同的影响以及针对这些问题的解决方案，正是本书的主题。我们将探讨 Perl\
  \ 如何解析一条语句，以及仅仅通过典型的编程技术就多么容易引入一个错误。我们还将研究可用于跟踪和追踪错误的方法，包括代码中的错误以及代码逻辑和执行中的错误。本书的最后部分探讨了测试代码的方法，以确保你捕获所有可能出现的错误。\n\
  \n作为引言，让我们先看看基本的错误类型，并简要回顾一下调试代码时需要处理的一些常见问题。\n\n### 错误类型\n\n你可以将程序开发的过程视为一种层次树。顶部是输入值，底部是输出值，即程序的结果。遗憾的是，许多应用程序开发都是自底向上进行的，而不是自顶向下。自顶向下的方法迫使开发者思考达到结果所需的所有步骤。而自底向上的方法则意味着尝试不同的技术，直到你得到一个从顶部到底部都能工作的结果。\n\
  \n自底向上的方法较慢，但从程序员的角度来看往往更实用，因为它有助于在程序员脑海中凝聚想法，形成最终会体现在最终应用程序中的方法和过程。\n\n所选择的方法会对程序中可能引入的错误产生一定影响。采用自底向上的方法，你在开发新组件之前不会考虑所有因素，因此很可能比更务实的自顶向下方法引入更多的错误。\n\
  \n开发者常犯的一个错误是忽略错误的影响，或者未能对错误及其影响进行分类。虽然通常不认为这是一个大问题——错误就是错误——但它会影响错误问题的解决方式（可能会对其他错误产生“连锁”影响），还可能导致其他错误被完全忽略。\n\
  \n就我个人而言，我一直认为编程中基本上有三种类型的错误：排版错误、逻辑错误和执行错误。\n\n### 排版错误\n\n排版错误是由于打字错误或一时注意力不集中导致忘记语言语义而引入的错误。在\
  \ Perl 中，这可能简单到在引用变量时使用 `$` 而不是 `@`，或者忘记在语句周围加上括号以确保函数获得列表上下文而不是标量上下文。\n\n6 调试 Perl：程序员故障排除\n\
  \n当然，其中一些错误会在编译过程中被 Perl 解释器捕获，因为它们会破坏 Perl 解析引擎的基本规则。其他错误则能顺利编译，甚至可能通过常规的警告和严格编译指示而不引发任何问题迹象。一个典型的例子是，看看这段代码：\n\
  \n```\n$string = \"The cat sat on the mat\"; $animal = ($string =~ m/The (.*) sat/);\
  \ print $animal;\n```\n\n如果你知道这里面有一个错误，你会怎么做？阅读它可能不会立即凸显问题，即使对于经验丰富的程序员也是如此。让 Perl\
  \ 在启用警告的情况下通过解析器检查代码不会引发任何错误。但运行脚本后，错误就很明显了——我们得到的值是 1，而不是预期的 \"cat\" 响应。\n\n其他排版错误可能更加隐蔽。在最近的一个\
  \ Web 项目中，登录过程突然停止工作。登录系统通过检查数据库中的用户名和密码来工作，假设两者都通过验证，脚本会生成一个唯一的会话 ID，并将其也放入数据库中。问题是\
  \ ID 会被批准，会话 ID 也会创建，但用户无法使用新的会话 ID 进行连接。\n\n花了一点时间，但通过比较返回给用户的会话 ID 和数据库中的会话 ID，很明显，27\
  \ 位的会话 ID 超过了 26 位的字段宽度。有 50% 的时间会话 ID 系统正常工作，另外 50% 的时间会话 ID 会超出字段宽度而失败。这是另一种类型的排版错误：在数据库创建脚本中输入了错误的宽度。\n\
  \n通常，你可以通过仔细阅读代码并深入理解 Perl 如何解析语句来解决排版错误。我们将在第 2 章中详细探讨 Perl 如何处理单个语句的解析问题。\n\n\
  ### 逻辑错误\n\n逻辑错误发生在程序员未能发现程序逻辑流程中的缺陷时。与排版错误一样，这些错误可能非常明显——例如，未能识别函数可能的返回值之一，或者错误地指定了测试或其他操作。这些不是排版错误——程序员当时确实认为自己正在做正确的事情。\n\
  \n举个例子，作为前面排版错误的延伸，同一个登录系统在对登录代码进行一些优化后，突然开始返回错误的登录信息。登录函数在出错时返回负数，在会话或登录过期时返回零，在成功时返回正数。经过数小时的错误追踪，最终发现问题的原因是检查返回值的\
  \ `if` 语句将严格的零响应视为失败，而将任何其他响应视为有效。\n\n另一个例子是代码中引用的使用。使用引用时，必须先解引用变量，然后才能访问变量内容。例如，当访问一个哈希引用时，你不应该使用\n\
  \n`$hash{$key}`\n\n第 1 章：引言 7\n\n而应该使用\n\n`$hash->{$key}`\n\n这不是排版错误，而是逻辑错误；程序员完全忽略了访问的是哈希引用，而不是真正的哈希。\n\
  \n逻辑错误通常比排版错误更容易识别。对于排版错误，你通常可以将问题追踪到可能的位置，但如果没有 Perl 解析器的帮助，可能难以见木不见林。而对于逻辑错误，你可以跟踪和追踪逻辑和执行序列，直到找到导致问题的具体行。\n\
  \n逻辑错误可以从多个方向入手。最明显的是程序员要理解 Perl 解释器的逻辑，从变量的基础知识以及如何访问它们，到运算符、函数和正则表达式的使用。逻辑错误都与如何访问和使用脚本中存储的信息有关——如果你能理解并识别\
  \ Perl 如何处理问题，那么追踪问题应该很简单。第 3 章和第 4 章重点介绍如何识别程序中的逻辑错误。\n\n其他追踪逻辑错误的方法包括使用抽象——将程序的组件转化为子程序、模块、包，甚至对象。通过分离各个元素，你可以逐个部分地消除问题的根源。抽象还能使你的代码更具可移植性和可管理性。我们将在第\
  \ 5 章中讨论抽象，并在第 6 章中看到它如何提高代码的可移植性。\n\n### 执行错误\n\n\n\n\n# 8 调试 Perl：程序员故障排除指南\n\n\
  执行错误是最难发现的错误之一，而且很多人可能根本不认为它是错误。执行错误会影响程序的执行过程；其原因并非拼写错误或逻辑问题，而是应用程序的设计方式允许某种事件链减慢或停止应用程序的执行。\n\
  \n执行错误确实会拖慢应用程序，但可能不会实际产生错误结果，或以其他方式显现出来。例如，设想一个从数据库中提取记录的数据库应用程序。一次典型搜索返回 200 条记录，脚本在几秒内完成，这完全符合你从数据库提取信息时的预期范围。然而，当一次搜索返回\
  \ 1000 条记录时，脚本执行时间接近一分钟。\n\n问题不在于逻辑——脚本按预期正常工作——也不是拼写错误——信息格式正确，数据库中确实有 1000 条记录需要显示。那么为什么会花费这么长时间呢？\n\
  \n这里的问题是执行问题——要么程序员需要引入一个限制器来减少访问和显示这么多记录的影响，要么应用程序的某个部分花费了过多时间来解析信息。这就是执行错误——应用程序本身没有问题，只是执行水平未达到预期。\n\
  \n执行错误难以追踪，但一旦发现并解决，会带来一些好处。一个清除了执行错误的应用程序会比普通应用程序更健壮，并且在使用中更稳定。由于执行错误经常影响性能，消除这些错误有助于优化你的应用程序。\n\
  \n找到执行错误最简单的方法是执行你的程序，但要隔离错误的位置，你需要一些工具和技巧。本书的最后部分——从第 7 章到第 14 章——将讨论错误捕获、应用程序优化和测试。\n\
  \n## 基本 Perl 调试规则\n\n无论你使用什么技巧或方法来追踪和跟踪代码中的错误，都有一些相当基本的规则，无论采用何种方法，你都应始终遵循。\n\n\
  - 始终检查显而易见的问题——如果你给普通程序员一段代码去调试，他或她几乎肯定会从错误的地方开始查找。本章前面给出的一些例子应该能说明，往往是那些显而易见的事情造成了最大的困难。\n\
  \n- 始终从外向内检查——你应该始终从代码的外部向内部跟踪执行路径。除非你确切知道错误发生的位置，否则你应该先查看出现错误的函数，然后从该函数追踪到其他嵌套函数，直到找到根本原因。\n\
  \n从内向外追踪会导致问题，因为你不知道之前发生了哪些可能导致错误的其他过程。例如，一个返回错误值的函数可能被传入了错误的值——检查该函数却未发现任何问题，这是徒劳的。\n\
  \n- 处理拼写错误时始终从顶部开始——你应该从代码顶部开始向下查看；不要反向操作。拼写错误有一个讨厌的习惯，会产生连锁效应。为了演示这一点，尝试在脚本中额外添加一个左括号——Perl\
  \ 会返回各种与实际错误无关的错误信息。\n\n- 解决解析器错误时始终从底部开始——Perl 会输出问题可能所在的行号。如果你从顶部开始工作并打乱了行号，就需要重新解析脚本来识别新的行号。如果你从底部开始工作，你的行更改不会影响前面的行号，这样在需要重新解析脚本之前，你可以解决更多的错误。\n\
  \n- 始终启用警告——警告能提供比仅让解析器正常工作更多的信息，帮助你发现可能忽略的错误。警告会突出显示潜在问题，例如未使用的变量（提示拼写错误）、误用的变量类型（提示逻辑错误）以及可能永远不会执行到的代码。\n\
  \n第 1 章：引言 9\n\n- 始终使用 strict 编译指令——strict 编译指令将许多 Perl 解析规则强制执行到比正常标准高得多的程度。它使\
  \ Perl 以比正常情况更高的程度检查某些操作（变量、引用和子程序）的语法，并且像警告一样，可以在解析过程中突出显示问题。\n\n我们将在本指南的其他地方更详细地讨论这些问题。\n\
  \n### 错误预防\n\n显而易见，在错误发生之前尝试防止其引入是解决问题的最佳方法——预防总是胜于治疗。问题在于，预防有时比治疗更耗时，并且看起来会拖慢开发过程。实际上，通过预防错误而不是治疗错误，你更有可能按时完成任务，因为事后寻找错误的时间会更少。\n\
  \n但是，如何从一开始就防止错误发生呢？许多技术超出了本书的范围，因为它们依赖于编程目标的基本方法，而不是 Perl 语言本身，但值得一提。\n\n### 程序设计\n\
  \n在开发应用程序时，清楚地了解它将产生什么结果至关重要，而清楚地了解如何实现该目标是确保软件中不引入错误的好方法。即使只是快速列出一个函数清单及其预期功能，也比边做边想更好。\n\
  \n此外，提出一个系统或风格并坚持下去也是值得的。例如，在编程数据库时，你可以通过提供数组、哈希引用或对象来交换信息。同时使用这三种方式必然会导致问题：首先，当你试图记住某个特定函数的功能时；其次，当你试图在两种方法之间进行转换时。\n\
  \n在等式的另一端，有些程序从开始到结束都经过极度细致的设计和开发，最终产生的设计手册比实际编写的代码行数还要多。这种级别的程序设计有其用武之地——我希望核电站软件和大多数现代飞机内置的电传操纵计算机都采用这种方式。另一方面，为快速转换数据文件格式的脚本开发这种文档则完全没有必要。\n\
  \n10 调试 Perl：程序员故障排除指南\n\n### 编辑器\n\n一个好的编辑器应该是任何程序员武器库中的重要组成部分。大多数现代编辑器都能匹配括号，并帮助你缩进代码使其更易读。Emacs\
  \ 可能是最流行的程序员编辑器，它能自动完成这些操作，并且几乎强制要求对识别为 Perl 的脚本进行缩进。更高级的编辑器，如 BBEdit（Mac 版）、EditPlus（Windows\
  \ 版）和修改版的 xemacs（Unix 版），还可以根据不同的语言对代码进行着色。\n\n使用能够执行这些简单检查的编辑器，有助于消除许多导致错误和编译失败的简单拼写错误。它们还能提供视觉线索来识别问题。\n\
  \n### 格式化\n\n\n\n\n\n## 第 1 章：引言\n\n选择一种格式标准并坚持使用。你不需要看太多程序员写的代码就能发现，通常代码都是干净整洁且易于阅读的。Perl\
  \ 有助于这一过程，使用一个好的编辑器也会有所帮助，但在选择自己的风格时仍有一定的灵活性。不要混用不同的风格，因为当你回头阅读代码时，会更容易发现错误。\n\n\
  例如，在创建新的代码块时，有两种基本格式：\n\n```\nif ($condition) {\n\n} else {\n\n}\n```\n\n或\n\n```\n\
  if ($condition) {\n\n}\nelse\n{\n\n}\n```\n\n前者更短更紧凑，但当你引入 elsif 语句时可能会变得繁琐。第二种风格更长，但通常更容易理解，因为你可以在代码中垂直对齐花括号。\n\
  \nPerl 的创始人拉里·沃尔（Larry Wall）建议遵循以下准则：\n\n- 四个空格的缩进\n- 如果可能，左花括号与关键字在同一行；否则对齐\n-\
  \ 多行 BLOCK 的左花括号前加空格\n- 单行 BLOCK 可以放在一行上，包括花括号\n- 分号前不加空格\n- “短”单行 BLOCK 中省略分号\n\
  - 大多数运算符周围加空格\n- “复杂”下标（括号内）周围加空格\n- 不同功能块之间用空行分隔\n- else 不紧跟在右花括号后\n- 函数名与其左括号之间不加空格\n\
  - 每个逗号后加空格\n- 长行在运算符后换行（except 和 and 以及 or 除外）\n- 当前行最后一个匹配的右括号后加空格\n- 垂直对齐相应的项目\n\
  - 只要不影响清晰度，省略多余的标点符号\n\n还有其他风格问题你应该考虑；请查看 peristyle 手册页获取更多信息。\n\n### 注释\n\n你是否曾经在写完一段代码几周后阅读它，却完全想不起当时在做什么？\n\
  \n想象一下尝试调试同一段代码——它可能运行正常，但如果没有注释说明，程序员就无法确定该技术是否达到了预期效果。像 bug 跟踪系统和代码修订监控器这样的工具会有所帮助；我们将在本章后面快速了解这些工具。如果代码运行不正确，你可能仍然需要快速了解函数或代码片段的工作原理，以便在调试代码时能够跟踪执行过程。\n\
  \n编写注释时需要注意的其他问题：\n\n- 不要重复说明代码行的作用——在包含 while 关键字的行上写“while 循环”是没有帮助的。应该写“遍历源文件”或类似的内容。\n\
  - 不要列出参数——好的程序员能够看出正在提取哪些参数。\n- 要列出输入变量的类型（例如，区分数组或数组引用）。\n- 要指定返回值以及何时应返回它们。\n\
  - 要记录错误/失败条件和返回值。\n\n记住，注释是为了唤醒你的记忆并向其他程序员突出执行顺序，而不是提供英文的实时解说或发泄你的挫败感。我们将在第 5 章更详细地讨论注释和文档。\n\
  \n### 代码修订\n\n修订代码系统（RCS）和并发版本系统（CVS）都提供了跟踪代码版本之间差异的方法。通常的操作模式是编写一段代码并使其工作（但可能不一定经过调试），然后将修订版本“签入”到修订系统中。当你对代码进行修改后代码失败时，你可以随时回退到之前的版本。\n\
  \n### Vim Bug 跟踪\n\n发现 bug 是一回事，但记住它们都在哪里是另一回事。至少你应该以文本形式记录已经出现的 bug 以及它们是否已被修复。包括关于\
  \ bug 是什么以及如何修复的信息也是一个好主意，因为这可能有助于你识别和追踪后续的 bug。当你发现一个 bug 时，你应该记录：\n\n- 位置——如果已知，给出行号和文件名；至少给出可能出错的函数。\n\
  - 对出现的 bug 的描述，包括你期望发生什么以及实际发生了什么。\n- 发现 bug 的日期和时间，以及报告 bug 的用户名。\n- 任何其他相关信息，例如平台、环境变量以及可能导致\
  \ bug 的任何因素。\n\n如果你想更专业地进行 bug 跟踪，可以考虑使用像 BugZilla 这样的跟踪软件，它是 Mozilla 项目的一部分。该系统实际上是用\
  \ Perl 编写的，并作为底层 MySQL 数据库的 Web 界面提供。你可以从 http://bugzilla.mozilla.org 下载 BugZilla。\n\
  \nRCS（实际上被 CVS 使用）允许你在每个修订版本中存储注释，并自动跟踪你签入的每个文件的版本号。你应该利用这些机会提供状态报告，既说明你在新修订版本中实现了什么，也说明你处理了哪些\
  \ bug 或问题。版本号在跟踪 bug 以及接收最终用户的 bug 报告时都很有用——他们报告的 bug 很可能已经在新修订版本中被修复了。\n\nCVS 和\
  \ RCS 的区别在于，RCS 只允许单个用户在任何时候编辑一个源文件，而 CVS 允许多个程序员进行真正的并发开发。CVS 还包括其他功能，例如能够通过互联网导出其树结构，以及能够根据源文件的“当前”版本号自动创建新包，即使这些文件仍在生产中。\n\
  \n如果你是唯一的程序员，RCS 很可能就能满足你的需求。你可以从 http://www.gnu.org/software/rcs/rcs.html 获取更多信息并下载\
  \ RCS。如果你认为需要 CVS，请访问 http://www.loria.fr/~molli/cvs-index.html 查看 CVS Bubbles 页面。\n\
  \n# 第二部分\n\n## 第 2 章\n\n### 基本 Perl 解析规则\n\n#### 陷阱分析\n\n![picture1](img/picture1.jpg)\n\
  \n许多表现为 bug 的应用程序问题实际上只是用于解析语言的简单逻辑和语法中的错误。这些问题可能范围从打字错误引入的问题，到违反 Perl 使用的更晦涩解析规则的问题。不幸的是，Perl\
  \ 有许多基本规则，甚至在这些规则中也有例外，即使在解析引擎的基本层面上也是如此（参见本章后面的“术语和列表运算符”一节）。\n\n解决这个问题的明显方法是确保一开始就正确编写代码。在尝试执行代码之前，至少手动对代码进行“合理性检查”也是一个好主意——通常只需重新阅读你刚刚输入的内容就能发现错误。完全有可能花费数小时修复单个\
  \ bug 并重新尝试代码，而一次简单的通读就能在一次遍历中发现许多问题。\n\n我们将在本书后面讨论调试技术，我们将研究的许多技巧将帮助你隔离问题并确定其位置。预防总是胜于治疗。更好地理解\
  \ Perl 如何获取原始脚本、编译它然后执行每一行，应该有助于你减少错误并减少那些偶然的 bug。随着时间的推移，它还将帮助你自动编写更干净的代码，这样你就不必回头修复你引入的\
  \ bug。\n\n\n\n\n\n在本章中，我们将首先探讨 Perl 的基本语法规则、优先级规则、不同运算符和表达式的求值方式，以及 Perl 如何处理字符串和数值常量。这里的目的并非真正教你\
  \ Perl——你应该已经掌握了它！——而是让你更好地理解支配 Perl 语言的规则和逻辑。\n\n这些规则涵盖了 Perl 中的语句和行、命名约定、运算符、优先级以及将值求值为其逻辑等价形式的过程。本章还作为理解\
  \ Perl 如何以及为何将语句和序列标记为特定问题的基础，并将包含一些示例，说明一些更基本的错误如何在语句级别发生。我们将在后续章节中探讨变量、常量、复合语句和函数的具体问题。\n\
  \n## 执行过程\n\n理解 Perl 如何解析脚本的第一步是从顶层视角观察 Perl 如何获取源代码并执行。Perl 的工作方式与许多其他基于脚本的语言类似——它获取原始输入，解析每条语句，并将其转换为一系列操作码（Perl\
  \ 程序中最小的可执行组件）。接着，它构建一个合适的操作码树，然后在 Perl“虚拟机”中执行这些操作码。这种技术被 Perl、Python 和 Java 所使用，这也是\
  \ Perl 如此快速的最重要原因之一——代码被优化成非常小的可执行块，就像为特定标准硬件处理器编译的程序一样。总结起来，基本流程如下：\n\n1. 读取源代码并识别任何基本问题，例如无法打开所需的模块。\n\
  2. 将源代码编译成一系列操作码。这涉及使用一个解析器，将 Perl 源代码转换为操作码结构。实际上，大多数源代码错误都是在此处被识别并抛出的。\n3. 执行操作码树。\n\
  \n# 第 2 章：基本 Perl 解析规则与陷阱 19\n\n我想暂时偏离一下主题，实际看看 Perl 如何解析各个语句并将其转换为 Perl 虚拟机用于实际执行脚本的操作码。理解这一点并非至关重要，如果你想跳过这一节，请随意——我不会再回头引用它。如果你不确定是否应该阅读，还是读一下吧——它提供了一个有用的、尽管在此实例中基本是琐碎的、从内部观察\
  \ Perl 的视角。\n\n如果你真的想深入了解 Perl 的细节，显而易见的解决方案是开始阅读源代码。Perl 相比许多其他语言有一个优势，即源代码随时可供你阅读。然而，这并不适合心脏脆弱的人。Perl\
  \ 的核心解释器由超过 78,000 行代码组成。尽管它如此庞大且相对缺乏注释，但这不应阻止你至少瞥一眼。\n\n阅读代码的最佳方式是下载最新的源代码，并从检查不同变量类型的源代码开始。最重要的显然是\
  \ `SV`（标量值），它将告诉你 Perl 如何存储大多数类型信息的基础。`SV` 的定义在 `sv.c` 文件中。`av.c` 和 `hv.c` 文件分别包含数组和哈希值的信息。一旦你熟悉了这些概念，你应该继续查看\
  \ `op.c` 和 `doop.c` 文件，它们处理操作码定义（参见本章后面的“操作码”），最后检查 `run.c` 中的执行过程，最好使用调试器，例如 `gdb`（可从\
  \ GNU 获取，http://www.gnu.org）或 Microsoft 的 Developer Studio 产品附带的调试器。如果你想跳过技术细节，检查将编写的\
  \ Perl 脚本转换为内部结构和操作码的词法过程，请查看 `perly.y`。这是一个 yacc 定义文件，概述了 Perl 语言的主要组件和结构。正是这个文件包含了优先级规则并支配整个解析过程。也正是在这一点上，大多数警告和解析错误首先被发现并抛出。\n\
  \n一些更复杂的词法分析是在其他源文件中手工编码的，最值得注意的是 `toke.c`。对于正则表达式，Perl 使用了一个修改过的标准正则表达式库，尽管所有功能实际上都是从零开始重写的。正则表达式编译器和执行器分别位于\
  \ `regcomp.c` 和 `regexec.c` 文件中。\n\n如果你想避开源代码，或者可能无法理解它，CPAN 上有三个工具可以访问 Perl 的内部结构。`Devel::Peek`\
  \ 模块允许你转储与变量相关的内部信息，而 `Devel::Symdump` 将转储符号表。`Devel::RegExp` 模块可以检查和监控正则表达式。\n\n\
  ### 架构\n\n从图 2-1 中你可以看到整个 Perl 解释器的基本架构。阴影块显示了 Perl 解释器的内部组件，包括内部数据结构和执行组件。图中的非阴影块是编译后的\
  \ C 源代码。\n\n你们中的一些人会认出该图与常用于描述 Java 语言操作的虚拟机图有些相似。这两种语言之间存在一些相似之处：Perl 使用优化的操作码与执行器组件相结合来实际运行\
  \ Perl 脚本。我们将在检查执行过程时更仔细地研究这些相似之处。\n\n调试 Perl：程序员故障排除指南\n\n翻译器\n\n优化的操作码\n\n执行器\n\
  \n符号表\n\n栈\n\n应用程序数据（Perl 变量）\n\n数据\n\n操作码函数\n\nPerl 对象 API\n\n■► 文件、套接字\n\n自定义\
  \ C 代码\n\n图 2.1 Perl 架构\n\n### 内部对象\n\n图 2-1 中的 Perl 对象 API 代表了用于支持任何 Perl 程序的四个主要内部数据结构的函数和结构：变量、符号表、栈和外部数据流。\n\
  \nPerl 支持的数据格式是该语言的核心部分；它们当然使你能够用该语言编程，但也用于保存解释器使用的大量内部信息。例如，各个包的符号表存储在一个哈希变量中，其值是指向解释器内存储的真实变量的\
  \ glob 值的指针。每个变量由其两个字母的缩写表示，这些缩写列在表 2-1 中。\n\n标量值还可以进一步细分为 `IV`（整数值）、`PV`（字符串值）和\
  \ `DV`（双精度值或浮点值）。其他内部数据结构，如符号表和\n\n| 缩写 | 全称 |\n|------|------|\n| 表 2.1 内部 Perl\
  \ 数据类型缩写 |\n\n第 2 章：基本 Perl 解析规则与陷阱 21\n\n栈，也由这些核心值类型表示，这些类型通过高效的内存管理得到严格管理和控制。\n\
  \n\n\n\n传递给函数作为参数的临时信息、脚本中的当前位置以及用于存储临时数据的变量都保存在栈上。例如，当函数 `foo` 想要带参数调用函数 `bar`\
  \ 时，参数会被压入参数栈，然后调用 `bar`。`bar` 内部执行的第一项操作是将参数从栈中弹出，并填充函数的 `@_` 数组。其他独立的栈用于保存其他临时变量，例如局部变量、循环迭代器以及\
  \ Perl 解释器的控制信息。顺便提一下，外部数据流由独立的 I/O 抽象 API 处理。这个 API 是一组函数，为标准的 stdio 和 sfio 库提供了一个轻量级的移植层，并为解释器提供了必要的钩子，以允许\
  \ `print`、`<FILEHANDLE>` 以及类似的操作符和函数与外部世界连接。套接字也使用了类似的系统。\n\n### 翻译器\n\n翻译器将 Perl\
  \ 脚本转换为一系列操作码，我们稍后将详细研究这些操作码。操作码以树形格式列出，以便实现分支、参数传递以及原始脚本中的结构化逻辑推进。翻译器由基于 `yacc`\
  \ 的解析器文件、手工编写的词法分析器以及实际的操作码生成器组合而成。正则表达式也是在此处编译的（假设它们可以在编译时编译），使用的是自定义的正则表达式引擎。\n\
  \n### 操作码\n\n操作码是 Perl 程序中最小的可执行组件。Perl 语言中的所有内置函数和操作符都有对应的操作码。在执行阶段，Perl 解释器执行的是操作码及其所依赖的函数。正是在这一点上，Perl\
  \ 开始类似于 Java 风格的虚拟机。\n\n在 Java 中，所有操作都被解析为类似机器码的格式，这与 RISC（精简指令集计算机）处理器的汇编语言并无太大差异。RISC\
  \ 处理器使用少量指令，更复杂的操作则基于这些精简指令集的组合。当你执行 Java 程序时，实际上是在模拟一个 RISC 处理器及其附带的所有开销。这个过程有一些优势，因为构建基于硬件的\
  \ Java 处理器与构建任何其他处理器一样容易。然而，Java 和 Perl 的相似之处到此为止。\n\n在 Perl 中，抽象层次要高得多。你在脚本层面使用的许多\
  \ Perl 函数实际上就是完整的操作码。即使是像 `grep` 函数这样看似复杂的操作，也由单个操作码处理。Perl 5.6 包含 351 个操作码，比之前的版本略有增加。许多操作码的源代码完全是手工编写的，而非编译器优化的，这解释了为什么许多\
  \ Perl 代码执行得如此之快。当你“解释”一个 Perl 脚本时，你实际上是在运行近乎原生的 C 代码，只不过是从 Perl 编写（翻译）而来的。\n\n\
  使用如此高级的操作码抽象以及执行这些操作码的手工编写和手工优化的 C 源代码，解释了为什么构建一个能生成非常快速的独立可执行文件的 Perl 编译器如此容易。这也解释了为什么解释型\
  \ Perl 脚本与 Perl 编译器生成的基于 Perl 的可执行文件之间的速度差异通常很小。事实上，我甚至见过\n\n22 Debugging Perl:\
  \ Troubleshooting for Programmers\n\n某个应用程序的解释版本比编译版本运行得更快。这种出乎意料的相对速度可能是由于加载了包裹操作码以便使其运行的包装器所产生的影响，也可能纯粹是偶然。\n\
  \n操作码由 `op.h` 头文件中的 C 结构体 `op` 定义。任何操作码的重要字段定义如下：\n\n```\nOP* op_next;\nOP* (*op_ppaddr)();\n\
  OPCODE op_type;\n```\n\n`op_next` 字段是一个指针，指向当前操作码完成后要执行的下一个操作码。`op_type` 字段定义了将要执行的操作码的类型。不同的操作码需要不同的附加字段来定义其执行过程。操作码类型列表可以从\
  \ `opcodes.pl` 脚本中确定，该脚本本身在解释器编译期间执行。这个文件还方便地列出了所有操作码。\n\n`op_ppaddr` 字段包含指向实际要执行的函数的指针。这些函数定义在分发树中的\
  \ `pp.c`、`pp_ctl.c`、`pp_sys.c` 和 `pp_hot.c` 源文件中。前三个文件定义了一系列支持标准操作符和函数的操作码函数，而最后一个文件从速度角度来看是最重要的。\n\
  \n`pp_hot.c` 文件包含了所有手工优化且预期在典型 Perl 脚本中会被多次执行的操作码函数。该文件中定义的操作码包括与赋值、正则表达式、条件操作符以及处理和转换标量及列表值相关的函数。\n\
  \n同样值得注意的是，还有用于定义和获取不同变量及常量的操作码。即使是 Perl 脚本中静态值的定义，实际上也是由操作码处理的。Perl 这一方面的重要性很快就会显现出来。\n\
  \n还记得我将操作码序列描述为一棵树吗？我之所以做这个类比，是因为某些操作码函数需要调用额外的操作码来获取信息。考虑以下 Perl 脚本：\n\n`$a = $b\
  \ + 2;`\n\n这个语句中有四个操作码。有两个操作符——一个是将表达式赋值给标量 `$a`，另一个是将标量 `$b` 与常量相加。还有两个值——一个是标量\
  \ `$b`，另一个是常量值 2。这些项（操作符和值）中的每一个都是一个操作码。\n\n如果你的 Perl 版本是用 `-DDEBUGGING` 选项构建的，你可以查看该语句生成的操作码。当你使用\
  \ `-Dx` 命令行选项执行 Perl 程序时，操作码树会被打印出来。例如，命令\n\n`perl -Dx -e '$a = $b + 2;'`\n\n会输出\n\
  \n```\n{\n8 TYPE = leave ===> DONE\nFLAGS = (VOID,KIDS,PARENS) {\nChapter 2: Basic\
  \ Perl Parsing Rules and Traps 23\nTYPE\nTYPE = nextstate FLAGS = (VOID) LINE =\
  \ 1\nTYPE = sassign ===> 8 FLAGS = (VOID,KIDS,STACKED)\nTYPE = add ===> 6 TARG =\
  \ 1\nFLAGS = (SCALAR,KIDS) {\nTYPE = null ===> (4)\n(was rv2sv) FLAGS = (SCALAR,KIDS)\
  \ {\nTYPE = gvsv ===> 4 FLAGS = (SCALAR) GV = main::b\n}\nTYPE = const == FLAGS\
  \ = (SCALAR) SV = IV(2)\nTYPE = null ===> (7)\n(was rv2sv) FLAGS = (SCALAR,KIDS,REF,MOD,SPECIAL)\
  \ {\nTYPE = gvsv ===> 7 FLAGS = (SCALAR) GV = main::a\n}\n}\n}\n```\n\n你可以通过跟踪操作码编号（显示在第一列）来了解操作码树中的执行过程。每一对花括号定义了一个操作码的信息，嵌套的花括号显示了操作码之间的父子关系。执行从操作码编号\
  \ 1 开始，它启动了脚本的执行。然后移动到操作码编号 2，它定义了行号（这是行指令信息存储的地方）。操作码编号 2 将控制权交给第一个可执行的操作码，即编号\
  \ 3。这个第三个操作码获取标量变量 `main::b` 的标量值，并将其放入栈中。\n\n24 Debugging Perl: Troubleshooting\
  \ for Programmers\n\n\n\n接着，执行传递到操作码四，它将静态整数值 2 压入栈中，然后执行传递到操作码五，即“add”操作码。它从栈中取出两个参数并将它们相加，将结果放回栈中供操作码六使用，操作码六获取变量\
  \ `main::a` 的引用并将其放入栈中。然后操作码七将操作码五中放入栈的加法结果赋值给 `main::a`。脚本到此结束。\n\n从这一描述可以看出树形结构。赋值操作码有两个子节点：要赋值的变量和值。该值由加法结果计算得出，而加法作为二元运算符有两个子节点：它相加的两个值。你可以在图\
  \ 2-2 中更清晰地看到这种操作码结构。\n\n显然，语句越复杂，操作码树就越复杂。一旦你检查多行脚本的输出，你就会开始认识到 Perl 操作码系统是多么高效和复杂。我们将在第\
  \ 10 章和第 12 章中实际查看 `-D` 调试选项，并在第 12 章中了解如何使用 Perl 编译器来提高脚本的执行速度。\n\n### 编译\n\n实际的编译阶段是一个多遍过程，首先使用\
  \ yacc 解析器处理基本的 Perl 脚本。由 yacc 解析的语言实际上是自底向上处理的——单个语句中最复杂的表达式首先被处理。因此，执行树中最深节点（叶子）首先被填充，然后才最终生成更高层的操作码（细枝和分支）。语句处理完毕后，你可以通过检查操作码树的主干，逐行跟踪执行流程。\n\
  \n在所有操作码生成之后，编译器会进行若干优化过程。第一个称为常量折叠，它识别可以在编译时执行的条目。例如，语句\n\n```\n$a = 4 + 5;\n```\n\
  \n可以通过创建一个将值 9 赋给变量 `$a` 的父操作码，从四个操作码减少为三个：\n\n```\n$a = 9;\n```\n\n```\ngvsv($a)\n\
  \n子/父关系 执行顺序\n\nassign\n\ngvsv($b)\n\n图 2.2 操作码树结构\n\nconst(2)\n```\n\n第 2 章：基本\
  \ Perl 解析规则与陷阱 25\n\n你可以通过比较上面的操作码树（它将一个值加到一个变量上并赋给一个新变量）与这个更基本语句的操作码树（它本质上只是将常量\
  \ 9 赋给变量 `$a`）来看到这种效果：\n\n```\n{\n6 TYPE = leave ===> DONE\nFLAGS = (VOID,KIDS,PARENS)\
  \ {\n1 TYPE = enter ===> 2\nTYPE = nextstate FLAGS = (VOID) LINE = 1\nTYPE = sassign\
  \ ===> 6 FLAGS = (VOID,KIDS,STACKED)\nTYPE = const FLAGS = (SCALAR) SV = IV(9)\n\
  TYPE = null ===> (5)\n(was rv2sv) FLAGS = (SCALAR,KIDS,REF,MOD,SPECIAL)\nTYPE =\
  \ gvsv === FLAGS = (SCALAR) GV = main::a\n```\n\n下一个优化过程是上下文传播，即定义特定操作码及其子节点的上下文。你在创建和使用函数时已经熟悉了“标量”或“列表”上下文。在内部，Perl\
  \ 还支持 void、布尔和左值语句的上下文。上下文传播是自顶向下工作的——即首先检查父操作码，然后将上下文需求向下传播到子操作码。\n\n最后一个优化阶段是归约过程，由窥孔优化器处理。该过程实际上执行操作码树，但不做任何实际工作。其目的是向前查看树中未来的操作码，并尽可能减少它们。在当前版本的解释器中，向前查看仅限于两个语句，这意味着最多可以将三个语句归约为一个语句。\n\
  \n任何更大的数值都会减慢优化过程，以至于优化操作码树所获得的收益会在优化过程本身中丢失。请记住，Perl 本质上仍然是一个解释器，与 C 或 Java 不同，操作码树在每次执行脚本时都会重新生成。\n\
  \n26 调试 Perl：程序员故障排除指南\n\n脚本被执行时。当你执行一个 Perl 脚本时，Perl 不会简单地重新执行之前优化过的操作码树。Perl 假定源文件已经改变（这很可能是个好主意）。\n\
  \n一些学派认为每次调用时对 Perl 脚本进行优化和编译是一个糟糕的过程，因为所有脚本每次都必须被编译和解释。即使是标准库中的模块或从 CPAN 获得的模块，每次也会被编译，尽管它们每次执行时发生变化的可能性很小。\n\
  \nPerl 最大的竞争对手之一 Python 也是一种脚本化且运行时编译的语言，但它只编译一次模块，并在运行时合并编译后的版本，仅当模块源文件的修改日期晚于编译版本时才更新它们。Python\
  \ 语言本身更适合这一过程——它完全基于对象，提供了更大的范围来以稳固的块形式导入对象定义及其方法。在 Perl 当前的形式下这样做会很困难，因为 Perl 的模块化程度不足以支持这种块导入。未来这方面可能会有改进。\n\
  \n对于每次使用原始源代码而不是编译后的操作码的问题，有一些解决方案。Perl 允许你通过编译器扩展直接执行操作码树。还有一些工具遵循这一思路——脚本被编译后以操作码形式而非源代码状态保存在内存中，随时准备立即执行。用于\
  \ Microsoft Internet Information Server 产品的 `PerlEx` 扩展和用于 Apache 的 `mod_perl` 扩展都使用这种模型。\n\
  \n最终，每次调用都使用源代码脚本使得单次执行比可能的速度更慢。当前窥孔优化仅向前查看两个语句的限制也产生了影响，因为它没有完全优化代码。真正编译的语言如 C/C++\
  \ 会在需要时尽可能地进行优化和归约，并预先承担合理的编译开销。\n\n另一方面，Perl 的优化过程确保每次执行脚本时都优化到合理程度，即使你每次只更改原始脚本中的一个字符。不幸的是，无法控制窥孔过程。例如，你不能指定在创建独立可执行文件时窥孔向前查看的值大于\
  \ 2，尽管这将是一个好主意。\n\n### 执行\n\n在所有三个优化阶段完成后，就该执行代码了。实际的执行路径并不像之前看起来那样顺序执行。所有操作码都有编号，而\
  \ `op_next`（来自操作结构）的值定义了实际的执行路径。由于 Perl 支持像 `if` 这样的条件语句和像 `while` 这样的循环，某些操作码可能永远不会被执行，或者可能被执行多次。因此，Perl\
  \ 依赖每个操作码返回的 `pp_next` 值来决定接下来执行哪个操作码。\n\n对于每个操作码，Perl 调用相应的操作码函数。每个操作码只是嵌入到解释器中的一个\
  \ C 函数，操作码会获得所有合适的参数和信息，包括任何子操作码，这些也是调用程序员所识别的原始语句所必需的。一旦所需执行路径中的所有操作码都执行完毕，整个树被遍历后，Perl\
  \ 解释结束，Perl 退出。\n\n第 2 章：基本 Perl 解析规则与陷阱 27\n\n### 执行总结\n\n\n\n\n由此可见，如果你能跟上这个思路，就会发现\
  \ Perl 中有许多位置和机会来突出和指示特定错误。在执行的每个阶段，从最初的解析到执行阶段，Perl 都可能引发错误。Perl 如何处理这些错误，以及如何捕获、识别和纠正它们，正是本书要讲述的内容。实际上，你可以根据错误发生的位置和时间对它们进行分类。有关错误消息的完整列表以及它们是在执行过程的哪个阶段引发的信息，请参见附录\
  \ A。\n\n### 语法与解析规则\n\n当 Perl 解析器接收一个源脚本并尝试执行其中的语句时，它需要考虑许多不同的项。当然，其主要目的是将每一行中的不同元素识别为运算符、项和常量；然后解析器评估每个序列以产生特定结果——这可能包括调用函数（该函数本身也需要相同的语句检查）或执行计算。\n\
  \n然而，甚至在 Perl 处理这些元素之前，解析器必须检查各个源行以获取信息。需要识别并移除注释，并验证行的基本布局（是否有尾部分号？是否延续到下一行？等等）。\n\
  \n实际上，Perl 解析器在查看源行时会考虑以下所有内容：\n\n- **基本语法**：核心布局、行终止等。\n- **注释**：如果包含注释，则忽略它。\n\
  - **组件标识**：识别各个项（变量、函数以及数值和文本常量）。\n- **裸字**：未被识别为有效项的字符串。\n- **优先级**：一旦识别出各个项，解析器根据优先级规则处理语句，这些规则适用于所有运算符和项。\n\
  - **上下文**：语句的上下文是什么？我们期望的是列表还是标量，数字还是字符串，等等。这个过程实际上发生在对一行中各个元素的评估期间，这就是为什么我们可以将诸如\
  \ `sort`、`reverse` 和 `keys` 之类的函数嵌套到单个语句行中。\n- **逻辑语法**：对于逻辑运算，解析器必须将不同的值（无论是基于常量还是变量）视为真值或假值。\n\
  \n所有这些都呈现了 Perl 如何看待整个脚本的一些相当基本和基础的规则；从基本的 Hello World 到整个数据库应用程序，每一行都以相同的方式执行，使用相同的基本规则。\n\
  \n### 基本语法\n\n基本语法规则规定了行终止和空白字符的处理等内容。这些基本规则如下：\n\n- 行必须以不期望左操作数的标记开头——例如，\n\n`=\
  \ 99;`\n\n是无效的，因为 `=` 运算符期望在表达式左侧看到一个有效的左值。作为一般规则，函数、关键字或变量是行中的主要标记，但有一些例外。\n\n\
  - 行必须以分号终止，除非它是块的最后一行，此时可以省略分号。例如，\n\n`print \"Hello\\n\"`\n\n作为单行脚本是完全合法的；由于它是块的最后一行，不需要任何分号。另一方面，\n\
  \n`print \"Hello \" print \"World\\n\"`\n\n将导致错误。\n\n- 如果在带引号的字符串内拆分一行，则行终止符会成为字符串的一部分。\n\
  - 只有在标记之间可能引起混淆时才需要空白字符，因此空格、制表符、换行符和注释（Perl 将其视为空白字符）都会被忽略。行\n\n`sub menu{print\"\
  menu\"}`\n\n与更整齐地间隔开的效果相同。\n\n- 行可以在任何点拆分，只要拆分逻辑上位于两个标记之间。以下代码是完全合法的：\n\n```\n=\
  \ 99;\n\nprint \"hello\"\n\nworld\";\n```\n\n![picture2](img/picture2.jpg)\n\n这些是相当基本的规则，如果违反，将在初始解析阶段导致错误，并停止脚本的执行。\n\
  \n### 注释\n\nPerl 将注释视为空白字符——一旦 Perl 在引号块之外的行上看到井号，该行的其余部分就会被忽略。即使在多行语句和正则表达式（当使用\
  \ `/x` 修饰符时）中也是如此：\n\n```\nmatched = /(\\S+) #Host\n\\s+ #(space separator)\n(\\\
  S+) #Identifier\n\\s+ #(space separator)\n(\\S+) #Username\n\\s+ #(space separator)\n\
  \\[(.*)\\] #Time\n\\s+ # (space separator)\n\"(.*)\" #Request\n\\s+ # (space separator)\n\
  (\\S+) #Result\n\\s+ #(space separator)\n(\\S+) #Bytes sent /x;\n```\n\n当 Perl 看到正常的行终止符时，注释结束，因此以下代码是完全无效的：\n\
  \n`print(\"Hello world\"); # Greet the user`\n\nand let them know we're here\n\n\
  也没有办法向 Perl 指示你有一个多行注释要包含，除非在每个注释段之前放置井号符号。\n\n忽略规则的一个例外是，如果注释包含“行指令”；在这种情况下，信息会存储在操作码树中，并用于填充\
  \ `LINE` 和 `FILE` 特殊标记。这些标记可以直接使用，也用作 `die` 和 `warn` 在未提供尾随换行符时引发的错误消息的基础。\n\n为了引入指令，你必须使用单词“line”，后跟一个行号和一个可选的字符串。实际上，匹配是通过正则表达式进行的：\n\
  \n`/\"#\\s*line\\s+(\\d+)\\s*(?:\\s\" ( [*\"]+) ?\\s*$/`\n\n第一个组 `$1` 填充 `LINE`，`$2`\
  \ 填充 `FILE`。\n\n例如，\n\n`# line 200 \"Parsing engine\" die \"Fatal\";`\n\n产生\n\n\
  Fatal at Parsing engine line 200\n\n请注意，行指令实际上修改了 `LINE` 标记，该标记通常由 Perl 解释器根据脚本中的当前行自动解析和填充。因此脚本\n\
  \n```\n#line 200 \"Parsing engine\" print \"Busy\\n\"; print \"Doing\\n\"; print\
  \ \"Nothing\\n\"; die 1 Fatal';\n```\n\n实际上报告\n\nBusy\nDoing\nNothing\nFatal at\
  \ Parsing engine line 203.\n\n它被报告为第 203 行的错误，而不是实际的源行 4——之前的行指令已永久修改了行号计数器。你可以用任何数字更新行指令，例如\n\
  \n```\n#line 200 \"Parsing engine\" print \"Busy doing nothing\\n\"; warn \"Warning\"\
  ;\n#line 100 \"Post-process engine\"\nprint \"Working the whole day through\\n\"\
  ;\ndie \"Fatal\";\n```\n\n生成\n\nBusy doing nothing\nWarning at Parsing engine line\
  \ 201.\nWorking the whole day through\nFatal at Post-process engine line 101.\n\n\
  我们将在第 7 章更详细地讨论行指令的使用。\n\n### 组件标识\n\n当 Perl 无法将一个项识别为预定义的运算符之一时，它会将该字符序列视为一个项。项是\
  \ Perl 语言的核心部分，包括变量、函数和带引号的字符串。项识别系统使用以下规则：\n\n- 变量可以以字母、数字或下划线开头，前提是它们跟在合适的变量字符（如\
  \ `$`、`@` 或 `%`）之后。\n- 以字母或下划线开头的变量可以包含字母、数字和下划线字符的任意进一步组合。\n- 以数字开头的变量只能由更多数字组成——注意不要使用以数字开头的变量名。诸如\
  \ `$0` 到 `$9`（及更多）的变量用于正则表达式中的组匹配。\n- 子例程只能以下划线或字母开头，但之后可以包含字母、数字和下划线字符的任意组合。\n\
  - 大小写敏感；`$VAR`、`$Var` 和 `$var` 都是不同的变量。\n- 每种主要变量类型都有自己的命名空间；`$var`、`@var` 和 `%var`\
  \ 都是独立的变量。\n\n\n\n\n• 文件句柄应使用全大写字符——这只是一个约定，而非规则，但有助于识别。\n\n一旦使用这些规则提取了术语，就会将其与\
  \ Perl 的内部符号表以及当前包的符号表进行比较。引号和常量也会被识别，并在这一阶段被解析或标记为裸值。如果经过所有这些步骤后，该项仍未识别，则将其视为裸字——有关这些项如何解析的更多信息，请参阅本章后面的“裸字”部分。引号也是一个特例；由于它们的值可能被插值，实际上它们在这一阶段被解析——有关插值如何工作的详细信息，请参阅第\
  \ 3 章。\n\n### 优先级\n\n与大多数语言一样，Perl 的解析规则基于优先级——即一行中各个元素被求值然后处理的顺序。通常，Perl 从左到右解析语句，除非最右边的值可能影响左边项的求值。一个很好的例子是\
  \ `+=` 运算符，它执行加法并将值赋给变量。如果该运算符的右侧没有先被求值，Perl 将无法确定应该将什么值加到左侧的变量上。\n\n表 2-2 中的运算符列表给出了各个运算符的优先级以及所有运算符的整体优先级。\n\
  \n表 2-2 中的运算符也按整体优先级从上到下排列——表中的第一项（项和列表运算符）具有最高优先级，当它们在复合语句中使用时，Perl 总是首先对它们进行求值。例如，你可以看到\
  \ `*` 的优先级高于 `+`。这意味着语句\n\n`$a = 5*6+4;`\n\n被求值为\n\n`$a = (5*6)+4;`\n\n而不是\n\n`$a\
  \ = 5* (6+4) ;`\n\n并产生结果 34，而不是 50。\n\n表 2.2 按优先级顺序排列的运算符\n\n如果你想检查优先级规则，可以使用 Perl\
  \ 编译器 `Deparse` 后端。它接收一个 Perl 脚本，并在应用优先级规则和优化后重新输出。然后根据优先级规则重新格式化输出，使用括号突出显示优先级规则；例如\n\
  \n```\n$ perl -MO=Deparse,-p -e '$a + $b *$c / $d % $e 1 -e syntax OK\n($a + ( (\
  \ ($b * $c) / $d) % $e)) ;\n```\n\n你可以看到，该语句已根据优先级规则进行了分组。任何语句或脚本都可以通过该后端运行。但是，由于输出包含任何优化，传入包含常量值的语句将不会得到你想要的结果：\n\
  \n```\n$ perl -MO=Deparse,-p -e 1 $a = 5*6+4;' ($a = 34) ; -e syntax OK\n```\n\n\
  编译器和它的后端可以提供关于脚本的有用信息，将在第 12 章中更详细地讨论。\n\n### 项和列表运算符\n\n项在 Perl 中具有最高优先级，包括以下内容：\n\
  \n• 变量\n• 引号\n• 任何带括号的表达式\n• 带括号的函数调用\n• `do {}` 和 `eval {}` 结构\n• 子例程和方法调用\n• 数组\
  \ `[]` 和哈希 `{}` 的匿名构造函数\n\n基本效果可以通过一个简单的计算看出：`print 6* (5 + 4) ;` 输出 54；`5+4` 首先被求值，因为它位于括号内，尽管优先级规则规定\
  \ `*` 运算符具有更高的优先级。\n\n然而，如果你将一个项嵌入到列表中，该项会首先被求值，因为它是一个项，因此具有更高的优先级：\n\n`sub add\
  \ { print 'Result:' } print(2,3,add);`\n\n通常，项从左到右求值，因此\n\n`sub first { print 'First'\
  \ } sub second { print 'Second' } print(2,3,first,second);`\n\n生成\n\n`FirstSecond2311`\n\
  \n`first` 和 `second` 函数是项，因此首先从左到右求值，然后才将 2、3 和返回值提供给 `print` 函数。这个顺序也会影响接受更多列表运算符的嵌入项：\n\
  \n`print 2,3,sort 2+2, 1+1;`\n\n这里，`sort` 项右侧的参数立即被吞掉，然后从左到右求值，然后才求值 `sort` 之前的元素。\n\
  \n通常，这种从左到右的项求值会产生你在语句中嵌入对其他函数的调用时所期望的行为：\n\n`print \"Warning:\", sort ('A','B','C),\
  \ \"\\nContinuing\";`\n\n但它也会产生忽略后续参数或忽略前面参数的效果，如果脚本或函数返回的话：\n\n`print \"Warning:\"\
  , die(\"Error\"), \"Exiting\";` 输出 Error。\n\n文件 'Untitled'; 第 1 行或脚本：\n\n```\nsub\
  \ add\n{\nprint \"Sum: \",return($_[0]+$_[1]);\n}\nprint add(l, 2) ;\n```\n\n输出\
  \ \"3,\"，即函数的返回值，但没有前缀字符串。最后，语句\n\n`print(4+5) + 1, \"\\n\";`\n\n不会按你期望的方式工作；对 `print`\
  \ 的调用将被求值——外层括号强制将 `4+5` 作为单个元素提供给 `print`。然后 Perl 会尝试将该值（实际上是 void）加到 1 上，而换行符则被丢弃为一个无用的常量。如果启用警告，你会得到更多信息：\n\
  \n```\nUseless use of integer addition (+) in void context at t.pl line 1.\nUseless\
  \ use of a constant in void context at t.pl line 1.\n9\n```\n\n但 `Deparse` 后端更明确：\n\
  \n```\n((print (9) + 1), •???'); t.pl syntax OK\n```\n\n第一部分显示了 `print` 的结果与 1 相加，但换行符参数从未被正确求值或包含在语句中。注意，Perl\
  \ 仍然认为语法是正确的——就解析器而言，该语句没有任何无效之处；只是没有意义。\n\n### 箭头（解引用）运算符\n\n箭头或中缀解引用运算符用于访问对象的属性和方法，或哈希或数组引用中包含的数据。由于这与变量直接相关，我们将在下一章更详细地研究这个运算符。\n\
  \n### 自增和自减\n\n自增和自减运算符没有显著的优先级；它们在表中被列为非结合性，因为没有左或右参数——运算符直接作用于提供的变量或字符串。如果运算符放在变量之前，则在变量值被使用之前，变量的值会先被递增或递减。如果放在之后，则在变量被求值之后，变量才会被递增或递减。这意味着语句\n\
  \n`$a = 3;`\n`print $a++ * $a`\n\n实际上打印的是计算 `3*4` 的结果——递增在变量值被提取后立即执行。\n\n唯一可能引起问题的其他注意事项是自增运算符的特殊用法：\n\
  \n`print ++($foo = 'aa');`\n\n你不能对常量值使用自增，只能对变量使用；语句 `print ++ ( 'aa 1 ) ;` 会失败。\n\
  \n你也不能使用同样的技术对变量进行自减。\n\n### 幂运算\n\n幂运算符 `**` 先求值右侧表达式，再求值左侧表达式，因此\n\n`$a = 2;`\n\
  `print $a**++$a;`\n\n打印 27（即 3 的 3 次方）。应注意确保你没有执行表现出这种行为的嵌套幂运算语句——如果不确定，要么使用 `Deparse`\
  \ 检查整个语法和语句的含义，要么尝试将语句分解为多个单独的语句。\n\n### 符号一元运算符\n\n整体而言，符号一元运算符没有特殊的技巧或陷阱。但是，如果右侧参数是数值，一元减号（`-`）会执行算术取反：\n\
  \n对于字符串，效果略有不同：\n\n\n\n\n\n```\nprint -minus; # 输出 -minus，强制解释为字符串\nprint -'-minus'\
  \ # 输出 +minus\nprint -'+minus' # 输出 -minus\n```\n\n一元加号（`+`）没有实际效果，唯一作用是强制 Perl\
  \ 将后面括号内的元素解释为表达式，而不是参数列表。\n\n### 正则表达式绑定\n\n正则表达式是一个特例——我们将在第 4 章中讨论正则表达式相关的问题。\n\
  \n### 乘法\n\n`*`、`/` 和 `%` 运算符相当直接，对两个数字执行常规的数值乘法、除法和取模运算。当你想要重复一个字符串时，`x` 重复运算符非常有用：\n\
  \n```\nprint 'Ma' x 8; # 输出 MaMaMaMaMaMaMaMa\n```\n\n如果你在左侧提供一个数值，该数字会被转换为字符串：\n\
  \n```\nprint 123 x 2; # 输出 123123\n```\n\n然而，当与列表和数组一起使用时，你需要小心。如果运算符左侧是一个列表，整个列表会被重复：\n\
  \n```\nprint (join (',',(1,2,3) x 2)); # 输出 1,2,3,1,2,3\n```\n\n对于数组，你必须将它们括在括号中，以便它们被视为列表，而不是标量。以下代码片段：\n\
  \n```\n@abc = ('a','b','c'); @abc = @abc x 5; print join(',',@abc);\n```\n\n会生成\
  \ \"33333\"；`@abc` 数组被填充为一个包含一个元素的列表，该元素是 `@abc` 的标量值（其长度）重复五次。要解决这个问题，请在源数组周围加上括号：\n\
  \n```\n@abc = ( 'a', 'b', 'c') ; @abc = (@abc) x 5; print join(',',@abc);\n```\n\
  \n最后，如果你在右侧提供一个数组，左侧提供一个列表，结果将基于该数组的标量值进行重复，实际上是将非空数组的每个元素设置为你提供的列表。如果右侧的数组为空，则返回一个空列表。例如：\n\
  \n```\n@abc = ();\n\n@abc = (5) x @abc;\n\nprint \"First: \", join ( ' , ' , @abc)\
  \ , \"\\n\" ,-@abc = ('a','b','c');\n```\n\n```\n@abc = (5) x @abc;\n\nprint \"\
  Second: \",join(', 1 ,@abc),\"\\n\";\n```\n\n会生成：\n\n```\nFirst:\n\nSecond: 5,5,5\n\
  ```\n\n### 加法和减法\n\n没有显著的问题——与加法和减法相关的错误和 bug 通常是由语句中其他位置的问题，或者提供了错误的数值和/或变量引起的。参见第\
  \ 4 章中的一些示例。\n\n### 移位运算符\n\n移位运算符根据提供的位数将表达式的位向右或向左移动。例如：\n\n```\n2 << 8;\n```\n\
  \n结果是 512。请注意，如果提供了浮点数值，它会被转换为整数而不进行四舍五入（即总是向下取整），因此：\n\n```\n2.9 << 7.9;\n```\n\
  \n产生 256；2 向左移动 7 次。\n\n### 命名一元运算符\n\n某些 Perl 函数实际上是命名一元运算符；也就是说，这些函数接受单个参数并返回一个值。手动确定一元运算符的完整列表比较困难，但作为参考，Perl\
  \ 源代码将以下函数和操作定义为一元运算符：\n\n如果这些运算符后面跟着一个左括号，它们会自动具有最高优先级；然而，如果你不带括号使用它们，它们的优先级如这里所列，低于大多数计算，但高于大多数关系和逻辑操作。\n\
  \n例如，`rand` 函数的优先级低于乘法运算符，因此：\n\n```\nrand 10 * 20; # rand (10*20)\nrand(10) * 20;\
  \ # (rand 10)*20;\n```\n\n如有必要，你始终可以使用 `Deparse` 检查这些函数。\n\n还要记住，逗号会自动终止一个命名一元运算符，因此：\n\
  \n```\nprint rand 10, 2;\n```\n\n会打印一个不超过 10 的随机数，紧接着打印字符 2。\n\n### 关系和相等运算符\n\n\
  关系和相等运算符根据你要比较的内容而有所不同。要逻辑比较数值，你使用符号相等和关系运算符；例如：\n\n```\nif ($a > 0)\n```\n\n对于字符串比较，你必须使用文本运算符：`if\
  \ ($a gt 'a 1 )`\n\n一个常见的错误是在错误类型的值上使用了错误的运算符，并且没有注意到，因为在 99% 的情况下它仍然会解析为真。语句：\n\
  \n```\nif ($a == $b)\n```\n\n如果两个值都是数值，则工作正常。如果它们是文本，Perl 会比较两个字符串的逻辑值，这总是为真。这个过程可能看起来令人困惑，但即使是未定义的值，在数值比较时也会解析为真。例如，以下测试都返回真：\n\
  \n```\nundef == 'a'\nundef == undef\n'a 1 == 'a'\n■a' == 'b'\n```\n\n反过来，对数值使用字符串比较时则不成立。语句：\n\
  \n```\n0 eq 9\n```\n\n会返回假，而：\n\n```\n0 eq 0\n```\n\n会返回真，因为 Perl 会自动将数值转换为字符串（因为这是运算符所期望的），然后比较这些值。\n\
  \n这里有一个非常简单的规则：如果你在比较数字，使用符号运算符；如果你在比较字符串，使用文本运算符。\n\n有关不同常量表达式的逻辑值的详细信息，请参见本章末尾的“逻辑值”部分。\n\
  \n### 按位与、或和异或\n\n按位与（`&`）返回两个数字在比特级别上进行 AND 运算后的值。如果你提供两个字符串，则字符串的每个字符会进行 AND 运算。按位或（`|`）和异或（`A`）以相同方式工作。\n\
  \n这里最常见的错误通常是打字错误：当你想要比较时忘记使用双 `&&` 或 `||` 符号，或者当你想要按位运算时使用了双符号。\n\n### 符号逻辑与\n\n\
  Perl 的逻辑与（`&&`）基于短路机制工作。考虑以下语句：\n\n```\na || b;\n```\n\n如果 a 返回假值，b 永远不会被求值。\n\n\
  在标量和列表上下文中，返回结果都是右操作数，因此：\n\n```\n©list = ('a','b'); ©array = ( ' 1' , ' 2 ' ) ;\n\
  \nprint(©list && ©array);\n\n$a = 'a' && 'b';\n\nprint $a;\n```\n\n会输出 \"12b\"。\n\
  \n有关使用该运算符进行比较和测试的详细信息，请参见下面的“符号逻辑或”部分。\n\n### 符号逻辑或\n\nPerl 的逻辑或（`||`）基于短路机制工作。考虑以下语句：`a\
  \ | | b;`\n\n如果 a 返回真值，b 永远不会被求值。但是，要小心将该运算符用于只返回真值的函数；例如：\n\n```\nselect DATA ||\
  \ die;\n```\n\n永远不会调用 `die`，即使 `DATA` 尚未定义。\n\n另外，当与接受列表参数的函数和项一起使用时也要小心；语句：\n\n\
  ```\nprint DATA \"The answer is \", 0 || warn \"Can't write: $!\";\n```\n\n实际上是在参数\
  \ 0 和调用 `warn` 之间执行逻辑或。`warn` 函数会在 0 被求值并返回给 `print` 之前被调用：\n\n```\nCan't write:\
  \ at t.pl line 1. The answer is 1\n```\n\n解决方案是使用 `or` 运算符，它的优先级低得多：\n\n```\nprint\
  \ DATA \"The answer is \", 0 or warn \"Can't write: $!\";\n```\n\n或者将你的语句括在括号中以提高优先级：\n\
  \n```\nprint DATA (\"The answer is \", 0) || warn \"Can't write: $!\";\n```\n\n\
  ### 范围运算符\n\n范围运算符 `..` 和 `...` 允许你动态创建范围，并作为简单的“翻转-翻转”运算符工作。每个 `..` 运算符的值是唯一的，每个运算符维护自己的状态。只要左操作数为假，运算符返回假。当左操作数变为真时，运算符返回真，直到右操作数也为真，然后在下次执行时运算符再次变为假。\n\
  \n如果操作数是标量或常量表达式，则操作数与 `$.` 运算符（当前输入行号）进行比较。\n\n在列表上下文中，运算符返回指定范围之间的值列表：\n\n```\n\
  ©hundred = (0 .. 100) ;\n```\n\n当提供字符串值时，它的工作方式类似于递增运算符：\n\n```\n©characters = ('a'\
  \ .. 'z');\n```\n\n### 条件运算符\n\n\n\n\n\n# 第 2 章：Perl 基本解析规则与陷阱\n\n条件运算符类似于内嵌的`if...else`语句。其格式为\n\
  \n```\nEXPR ? IFTRUE : IFFALSE\n```\n\n如果`EXPR`为真，则计算并返回`IFTRUE`表达式；否则计算并返回`IFFALSE`。\n\
  \n标量和列表上下文会根据所选表达式进行传播。在基本层面上，这意味着，例如，以下表达式能按预期工作：\n\n```\n$value = $expr ? $true\
  \ : $false; ©list = $expr ? ©lista : ©listb,-\n```\n\n而以下表达式\n\n```\n$count = $expr\
  \ ? ©lista : ©listb;\n```\n\n会将`$count`填充为每个数组中的元素个数。另一方面，以下表达式：\n\n```\n$result\
  \ = $wantcount ? ©list : join( 1 , 1 ,©list);\n```\n\n会相应地返回数组大小或合并后的数组。当条件运算符在列表中使用时，它会被视为单个元素，因此不要插入未限定的额外列表运算符来混淆解释器。因此，如果你想根据条件运算返回多个项，就需要用括号将你要返回的表达式括起来。脚本\n\
  \n```\n$name = <STDIN>; chomp $natne ;\n\nprint \"Hello \",length($name) ? $name,',\
  \ how are you today?'\n\n'nobody',\"\\n\";\n```\n\n应写成\n\n```\n$name = <STDIN>;\
  \ chomp $name;\n\nprint \"Hello \",length($name) ? ($name, 1 , how are you today?')\n\
  \n: 'nobody',\"\\n\";\n```\n\n你也可以将条件运算符用于赋值，前提是两个选项都是有效的左值（参见下一节“赋值运算符”）。不过，你需要对整个表达式进行限定：\n\
  \n```\n($group ? $a : $b) = 'users';\n```\n\n要使用条件运算符来选择赋值值，应将条件运算符用作赋值值，而不是嵌入赋值表达式：\n\
  \n```\n$a = $group ? 1 is a group' : 'not a group';\n```\n\n### 赋值运算符\n\n赋值运算符将值赋给一个有效的左值表达式——通常是一个变量，但也可以是任何有效的左值。左值（或左侧值）是一个你可以为其赋新值的表达式。赋值通过`=`及相关运算符完成。有效的左值包括以下内容：\n\
  \n- 任何可识别的变量，包括对象属性\n- `vec`函数（用于设置整数值）\n- `substr`函数（用于替换字符串）\n- `keys`函数（用于设置桶大小）\n\
  - `pos`函数（用于设置搜索中的偏移量）\n- 任何左值定义的函数（仅限 Perl 5.6）\n- `? :`条件运算符\n- 任何赋值表达式\n\n除了基本的`=`运算符，还有组合表达式赋值，它们会转换为内嵌表达式。例如，\n\
  \n```\n$a += 10;\n```\n\n等价于\n\n```\n$a = $a + 10;\n```\n\n注意，对赋值表达式进行赋值时应从左到右读取，例如\n\
  \n```\n($a += 10) *= 5;\n```\n\n解读为\n\n```\n$a += 10; $a *= 5;\n```\n\n而\n\n```\n\
  ($match = $source) =~ tr/a-z/A-Z/;\n```\n\n解析为\n\n```\n$match = $source; $match\
  \ =~ tr/a-z/A-Z/;\n```\n\n最后，在赋值列表时，赋值根据上下文表现不同。在列表上下文中，列表赋值会将左值解析为一个要赋值的左值列表，因此\n\
  \n```\n($a, $b) = (1,2);\n```\n\n实际上相当于\n\n```\n$a = 1; $b = 2;\n```\n\n在第 3 章中，你将更详细地了解给变量赋值时的陷阱。\n\
  \n### 逗号运算符\n\n逗号是列表运算符，参数按从左到右的顺序求值。在标量上下文中，当用于隐含列表时，先求值左参数，然后丢弃，返回右参数。例如，\n\n\
  ```\n$a = (1,4);\n```\n\n会将值 4 赋给`$a`。在列表上下文中，它会使所有参数从左到右求值，然后以列表形式返回：\n\n```\n\
  @a = (1,2);\n```\n\n在标量上下文中使用列表运算符时，如果没有括号要小心，因为列表的第一个元素会比右侧参数绑定得更紧，因为列表运算符的优先级低于大多数其他语句形式。例如，\n\
  \n```\n$a = 1,2;\n```\n\n会将`$a`填充为值 1，因为它被解释为\n\n```\n($a = 1),2;\n```\n\n与具名一元运算符一起使用时情况类似；例如，`chdir\
  \ 1 tmp', 'etc 1 ;`会将当前目录更改为`tmp`，而不是`etc`。数组也是如此；这一行\n\n```\n(@a = 1),2;\n```\n\
  \n`=>`运算符只是`,`运算符的别名，最适合用于分隔哈希元素的键和值：\n\n```\n%hash = ('key 1 => 'value');\n```\n\
  \n自 Perl 起，`=>`会自动暗示左侧参数应被解释为字符串，使得\n\n```\n%hash = (key => 'value');\n```\n\n完全合法，即使启用了警告和`strict`编译指示。\n\
  \n### 列表运算符（向右）\n\n列表运算符的右侧优先级较低，只有`and`、`or`、`xor`和`not`的优先级更低。这种低优先级正是使用隐含列表和符号逻辑运算符时产生问题的原因：\n\
  \n```\ntie %oldhash, NDBM_File, $old, 0_RDONLY, 0444\n\n|| die \"$0: Error opening\
  \ source $old: $!\\n\";\n```\n\n这实际上被解释为最后一个列表参数与`die`语句进行逻辑比较。请使用优先级更低的具名逻辑运算符来解决这个问题。\n\
  \n### 具名逻辑非\n\n逻辑非对运算符右侧的项进行逻辑取反；左侧的任何项会立即引发错误，因此语句\n\n```\n$a = $b not $c;\n```\n\
  \n完全无意义。如果你想在两个值之间选择，请使用`||`。\n\n### 具名逻辑与\n\n该运算符与符号逻辑与的工作方式完全相同，包括短路执行。唯一的区别是它的优先级更低。\n\
  \n### 具名逻辑或与异或\n\n具名逻辑或与符号逻辑或的工作方式相同，包括短路执行。其主要优势在于它的优先级非常低——在所有语句中优先级最低——因此适用于控制语句。\n\
  \n在赋值语句中使用`or`时要小心；因为它具有最低优先级，赋值运算符会比`or`运算符绑定得更紧，因此\n\n```\n$a = $b or $c;\n```\n\
  \n被解释为\n\n```\n($a = $b) or $c;\n```\n\n最好写成\n\n```\n$a = $b || $c;\n```\n\n对于任何其他需要进行比较的语句也是如此——`or`运算符只有在你想检查函数的返回值而不影响返回值时才真正有用。\n\
  \n`xor`运算符返回两个表达式的异或结果。\n\n### 裸字\n\n脚本中的裸字本质上是个坏主意。首先，Perl 会尝试识别该裸字是否是一个合适的值——如果它能在符号表中解析为一个函数，则调用该函数，否则将其视为字符串。以下脚本很好地演示了这一过程：\n\
  \n```\nsub hello {\n\nreturn 'Hello user!';\n\n}\n\n$message = hello; print \"$message\\\
  n\";\n\n$message = goodbye; print \"$message\\n\";\n```\n\n输出为\n\n```\nHello user!\
  \ goodbye\n```\n\n如果启用了警告，当 Perl 看到一个全小写的裸字且无法将其识别为术语时，会发出警告：\n\n```\nUnquoted string\
  \ \"goodbye\" may clash with future reserved word at t.pl line 10.\n```\n\n在大多数情况下，混合大小写的裸字会被解释为字符串，并且在启用警告时应引发适当的错误。但有一个例外——当裸字用于需要文件句柄的场合时，该裸字会被用作文件句柄名称。例如，代码\n\
  \n```\nprint Tester;\n```\n\n会将`$_`的值打印到文件句柄`Tester`，假设它是打开且可写的。如果你尝试`print Tester,\
  \ \"Hello World\\n\";`，在启用警告时会得到一个错误，因为 Perl 假定`Tester`是文件句柄的名称。\n\n如果你启用了`strict`编译指示中的`subs`部分，执行会因为裸字而终止。\n\
  \n\n\n\n\n# 第 2 章：Perl 基本解析规则与陷阱\n\n在 `t.pl` 第 10 行，当启用 \"strict subs\" 时，不允许使用裸字\
  \ \"goodbye\"。\n\n如果同时启用了警告和 strict 编译指令，则编译指令优先。我们将在第 8 章更详细地介绍编译指令和警告。\n\n###\
  \ 上下文\n\nPerl 支持多种不同的上下文，这些上下文在解析过程中为每个运算符或术语标识。具体效果因涉及的运算符或术语而异。我们将在第 3 章和第 4 章更深入地研究与上下文问题相关的陷阱。现在，我们先了解每种上下文的基本前提。\n\
  \n### 标量和列表上下文\n\n所有程序员都知道两种基本上下文：标量和列表。这两种上下文通过暗示可接受的值或返回的值来影响函数或运算符的操作。例如：\n\n\
  ```\n$size = ©list;\n```\n\n这里，`$size` 变量是一个标量，因此对数组施加了标量上下文，导致它返回数组的大小而不是数组的值。相反，语句\n\
  \n```\nsort ©list;\n```\n\n在列表上下文中求值，因为 `sort` 函数期望一个值列表。\n\n46 调试 Perl：程序员故障排除指南\n\
  \n在函数内部，你可以使用 `wantarray` 函数来识别请求的上下文，如果调用者期望返回列表（或数组或哈希）而不是标量值，则该函数返回真。\n\n###\
  \ 数值和字符串上下文\n\n一些内部 Perl 函数还区分标量上下文中的数值和字符串上下文。一个典型的例子是 `$!` 特殊变量。在数值上下文中，该变量返回上次发生的错误的数值错误号，而在字符串上下文中，则返回相关的消息。解释器使用此上下文作为将值转换为内部整数、浮点数或字符串值的基础，这些值构成了\
  \ SV 标量值的划分。\n\n不幸的是，无法在脚本内部确定预期的数值或字符串上下文——你必须让 Perl 为你做决定，相应地转换值。\n\n### 布尔上下文\n\
  \n布尔上下文是指表达式仅用于识别真值或假值的情况。请参阅本章最后一节“逻辑值”，了解 Perl 如何在逻辑上下文中处理各个值和常量。\n\n### 空上下文\n\
  \n空上下文是一种特殊情况，是标量上下文的扩展。它标识代码中引入了常量但从未使用过的区域。最简单的例子，语句\n\n```\n99;\n```\n\n会被识别为空上下文，因为在此处引入常量没有任何作用。只有当你启用了警告时，才会收到此实例的通知。\n\
  \n其他更常见的空上下文应用场景包括：由于优先级规则导致语句的一部分被忽略的情况。例如，\n\n```\n$a = 1,2;\n```\n\n会导致 `2` 被识别为空上下文。请查看前面的优先级规则，了解为什么此语句及类似语句会引发空上下文警告。\n\
  \n### 插值上下文\n\nPerl 文档将变量插入到插值引号值中的过程标识为一种单独的上下文。这种描述很好地解释了为什么某些引号块会进行插值——它们被识别为插值上下文——但并未完全公正地描述该过程。我们将在第\
  \ 3 章更详细地研究插值过程。\n\n### 逻辑值\n\nPerl 的布尔逻辑依赖于它识别不同变量和常量类型具有真值或假值的能力。一般来说，任何未定义、空或零的值都被视为假值，而任何其他值都被视为真值。你可以在表\
  \ 2-3 中看到更明确的列表。\n\n第 2 章：Perl 基本解析规则与陷阱 47\n\n表 2.3 值及其逻辑等价物\n\n要检查未定义的值，你可以使用\
  \ `defined` 函数，如果变量包含有效值，则返回正整数（真），如果变量等于 `undef` 值，则返回零（假）。\n\n## 第 3 章\n\n###\
  \ 常见变量陷阱\n\n![picture3](img/picture3.jpg)\n\n50 调试 Perl：程序员故障排除指南\n\n理解语言是一回事，但适应特定的编程风格需要时间，而且很难避免打字错误和短暂记忆失误。当你发现问题时，显而易见的解决方案是使用调试器或我们将在本书后面介绍的一种调试技术。调试器不会告诉你问题发生的原因或如何修复它。\n\
  \n提供关于特定错误发生原因的具体信息是困难的，因为确切效果完全取决于你使用的脚本、其他模块和系统。我们能做的是研究一些可能出现并可能产生重大影响的问题和错误。这些问题从简单的使用问题（例如创建数组引用数组而不是简单数组）到更复杂的问题（例如在排序过程中更改\
  \ `$a` 和 `$b` 的值）。\n\n为了说明错误的个体性，考虑以下片段，它用于打印 SMTP 服务器返回的扩展电子邮件地址：\n\n```\n$realrecipient\
  \ = $smtp->expand($email);\nchomp $realrecipient;\nprint \"<BR>\\n expand for $email\
  \ -> [\" . $realrecipient . \"]\";\n```\n\n在命令行正常运行时，脚本工作正常，但作为 CGI 脚本运行时，似乎什么也没返回。电子邮件地址没有被扩展。问题非常简单：`$realrecipient`\
  \ 的值以 \"<mc@mcwords.com>\" 的形式返回。当浏览器解析时，电子邮件地址被解释为未知的 HTML 标签，因此被忽略！\n\n你可以轻松地花上一辈子时间来列举这类错误的例子，但这不会有成效。相反，作为调试过程的前奏，我们将研究更通用的错误，例如错误的变量使用以及复合语句和函数中的隐藏陷阱。\n\
  \n在本章中，我们将专注于任何脚本的核心：变量及其创建和使用方式。在下一章中，我们将继续讨论语句、函数和正则表达式的一些问题。\n\n如果你在执行过程中遇到 Perl\
  \ 报告的特定错误，请查看附录 A，其中列出了 Perl 报告的所有错误消息，并提供了如何产生错误以及如何解决错误的示例。\n\n### 创建/使用变量\n\n\
  最初创建变量（无论是否带有初始值）的过程并不像你想象的那么简单直接。\n\n在创建和使用变量时，可以遵循一些简单的规则，这些规则应该能消除一些常见问题：\n\n\
  - 所有标量都以 `$` 开头，包括从数组或哈希中访问的标量，例如 `$array[0]` 或 `$hash{key}`。\n- 所有数组都以 `@` 开头，包括以切片方式访问的数组或哈希，例如\
  \ `@array[3..5,7,9]` 或 `@hash{'bob\\ 'alice'}`。\n- 所有哈希都以 `%` 开头。\n\n记住这些简单的规则应该有助于消除许多常见问题。\n\
  \n第 3 章：常见变量陷阱 51\n\n#### 标量\n\n除了本章后面介绍的插值和引号问题之外，创建和使用标量时还有其他一些主要困难。\n\n- 创建和填充多个变量时必须小心；以下操作将不起作用：\n\
  \n```\n$first, $second = 1,2; $first, $second = (1,2); ($first, $second) = 1,2;\n\
  ```\n\n你必须在两边都使用列表运算符：`($first, $second) = (1,2);`\n\n- 请记住，赋值给标量会自动对赋值运算符右侧施加标量上下文，因此\n\
  \n```\n$size = ©array;\n```\n\n会将 `$size` 填充为数组的元素个数。\n\n### 数组\n\n\n\n\n数组只是标量的数组，但在创建数组时需要小心，确保不会创建只包含单个引用的数组，并且在访问信息时使用正确的符号来提取单个元素和切片。\n\
  \n### 数组\n\n### 创建\n\n数组变量以 `@` 符号为前缀，并使用圆括号或 `qw` 运算符来填充，例如：\n\n```\n©array = (1,\
  \ 2, 'Hello'); ©array = qw/This is an array/;\n```\n\n不要使用方括号来创建普通数组；`©array = [1,\
  \ 2, 'Hello'];` 这一行将 `@array` 初始化为仅包含一个元素，即方括号内数组的引用。\n\n### 提取单个索引\n\n提取单个组件时，只需记住以下几点：\n\
  \n- 正向操作时，数组索引从零开始，而不是一。\n- 反向操作时，最后一个元素的索引为 -1。\n\n![picture4](img/picture4.jpg)\n\
  \n使用 `$[` 来更改数组最低索引的做法已被强烈弃用，因此上述规则应始终适用。\n\n使用计算出的索引从数组中提取元素时要小心。如果你提供一个整数，那么将其解析为数组索引（只要该索引存在）应该没有问题。如果是一个浮点值，请注意\
  \ Perl 总是截断（向下取整）该值，就像该索引在 `int` 函数内被解释一样。如果你想向上取整，请使用 `sprintf`——这很容易演示；以下脚本：\n\
  \n```\n©array = qw/a b c/;\nprint(\"Array 8/5 (int) is: \", $array[8/5], \"\\n\"\
  );\nprint(\"Array 8/5 (float) is: \", $array[sprintf(\"%1.Of\", (8/5))] ,\"\\n\"\
  ) ;\n```\n\n生成\n\n```\nArray index 8/5 (int) is: b\nArray index 8/5 (float) is:\
  \ c\n```\n\n裸的 `8/5` 等于 1.6，在前一条语句中被解释为 1，但在后一条语句中被解释为 2。\n\n### 切片\n\n从数组中提取切片时，必须记住使用\
  \ `@array`：\n\n```\nprint joinC, ' , ©array [3 . . 5 , 7 , 9] ) ;\n```\n\n如果你尝试使用\
  \ `$array` 访问多个值，你将什么也得不到，但只有在启用警告时才会报告错误：\n\n```\n$ perl -ew \"print $ARGV[2,3];\"\
  \ Fred Bob Alice\nMultidimensional syntax $ARGV[2,3] not supported at -e line 1.\n\
  Useless use of a constant in void context at -e line 1.\nUse of uninitialized value\
  \ in print at -e line 1.\n```\n\n### 多维切片\n\n请注意，与哈希不同，你不能使用逗号语法来访问多维数组的单个组件。以下代码将无法工作：\n\
  \n```\n©tictactoe = ( [1, 2, 3] ,\n               [4, 5, 6],\n               [7,\
  \ 8, 9] ) ;\nprint $tictactoe [1,2] ;\n```\n\n启用警告后，你会得到一个错误。在任何情况下，你实际得到的是最后一个指定的元素，在本例中，是对数组\
  \ \"7, 8, 9\" 的引用。\n\n### 单元素切片\n\n使用单元素切片时要小心；语句 `print ©array[1];` 与 `print $array[1];`\
  \ 没有区别，但在赋值信息时的影响更为显著。以下代码片段\n\n```\n©array[1] = <DATA>;\n```\n\n实际上会从 `DATA` 文件句柄中读取所有剩余信息，但只将读取到的第一条记录分配给数组的第二个元素。\n\
  \n### 大小\n\n数组的大小可以通过在标量上下文中使用数组来确定——返回的值将是数组中元素的数量：\n\n```\n©array = (1,2,3);\n\
  print \"Size: \",scalar ©array,\"\\n\";\n```\n\n返回的值始终是数组的物理大小，而不是有效元素的数量。你可以使用以下代码片段来演示这一点，以及\
  \ `scalar ©array` 和 `$#array` 之间的区别：\n\n```\n©array = (1,2,3);\n$array[50] = 4;\n\
  print \"Size: \",scalar ©array,\"\\n\";\nprint \"Max Index: \", $#array,\"\\n\"\
  ;\n```\n\n这将返回\n\n```\nSize: 51\nMax Index: 5 0\n```\n\n数组中只有四个元素包含信息，但数组长度为 51\
  \ 个元素，最高索引为 50。\n\n### 列表上下文中的数组\n\n当访问整个数组或切片时，数组作为列表工作，即\n\n```\n©array = (1,2);\n\
  ($a, $b) = ©array;\n```\n\n等价于\n\n```\n($a, $b) = (1, 2) ;\n```\n\n赋值运算符左侧的数组和切片总是暗示列表上下文：\n\
  \n```\n©fields = split /:/;\n```\n\n### 哈希\n\n哈希容易出现问题，因为用于提取值的键字符串具有自由格式的特性。创建和使用哈希时的大多数问题都可以追溯到所使用的键字符串或\
  \ Perl 如何解释它。\n\n### 创建\n\n哈希是在列表上下文中创建的——通过从列表中取出成对的元素来转换列表：第一个用作键，第二个用作值。为了清晰起见，你应该使用\
  \ `=>` 作为 `,` 的别名来指示键/值对。例如，\n\n```\n%hash = ('Fred' , 'Flintstone', 'Barney', 'Rubble');\n\
  ```\n\n和\n\n```\n%hash = ('Fred' => 'Flintstone', 'Barney' => 'Rubble');\n```\n\n\
  被解释为相同，但后者在视觉上能更好地区分各对以及两个值之间的关系。\n\n- 只有偶数个元素的列表才能赋值给哈希；奇数个元素的列表会引发错误。\n- 初始化真正的哈希时不要使用花括号：\n\
  \n```\n%hash = {'Fred 1 => 'Flintstone', 'Barney' => 'Rubble'};\n```\n\n花括号返回一个匿名哈希的引用，因此上面的示例首先会失败，因为你试图用奇数个参数创建一个哈希。如果访问哈希键时得到类似\n\
  \n```\nHASH(0x99d33e8)\n```\n\n的值，这意味着你创建哈希的方式有误。\n\n- 创建哈希时，Perl 会自动将用作键的裸字解释为字符串，即使启用了\
  \ `strict` 编译指令：\n\n```\nuse strict;\nmy %hash = (Fred => 'Flintstone', Barney =>\
  \ 'Rubble');\n```\n\n但同样的规则不适用于值。\n\n- 你也可以在单词前使用 `-` 运算符，尽管这会使键包含前导的 `-` 符号作为键的一部分：\n\
  \n```\n%hash = (-Fred => 'Flintstone', -Barney => 'Rubble');\nprint $hash{-Fred};\n\
  ```\n\n然而，对于单字母字符串，这会引发警告；请使用单引号显式定义这些参数。\n\n### 提取单个元素\n\n你可以通过在大括号内提供字符串来从哈希中提取单个元素：\n\
  \n```\nprint $hash{Fred};\n```\n\n大括号内的字符串会被 Perl 自动引用并解释为字符串——即使启用了 `strict` 编译指令和警告。\n\
  \n- 在嵌入由多个组件组成的字符串和/或变量时需要小心。以下语句是相同的，尽管前一种方法在性能上略有折衷：\n\n```\nprint $hash{$fred\
  \ . $barney};\nprint $hash{\"$fred$barney\"};\n```\n\n- 当使用更复杂的哈希键时，请使用 `sprintf`：\n\
  \n```\nprint $hash{sprintf(\"%s-%s:%s\",$a,$b,$c)};\n```\n\n- 如果你使用数值数据来构建哈希键，那么请使用\
  \ `sprintf` 来强制数字采用固定格式，以防止微小差异导致问题。例如，在格式化时间值时，最好使用：\n\n```\n$hash{sprintf(\"%02d%02d\"\
  ,$hours,$min)};\n```\n\n而不是\n\n```\n$hash{$hours . $min};\n```\n\n使用前者，所有时间都将以 `'0505'`\
  \ 的形式显示，而不是 `'55'`。\n\n### 提取切片\n\n提取切片时，必须使用 `@` 前缀：\n\n```\n%hash = (-Fred =>\
  \ 'Flintstone', -Barney => 'Rubble');\nprint join(\"\\n\",@hash{-Fred,-Barney});\n\
  ```\n\n使用 `$hash{-Fred, -Barney}` 将什么也得不到。\n\n### 列表上下文中的哈希\n\n与哈希本质上使用列表填充的方式相同，如果你在列表上下文中求值一个哈希，那么你得到的是一个键/值对的列表。例如，\n\
  \n```\nmy %hash = (Fred => 'Flintstone', Barney => 'Rubble');\n©list = %hash;\n\
  print join(', ',@list);\n```\n\n产生\n\n```\nBarney, Rubble, Fred, Flintstone\n```\n\
  \n\n\n如果你直接将哈希作为参数传递给子程序，需要格外小心——你必须从 `@_` 中提取哈希。你可以在子程序调用中混合使用标量和单个哈希元素，但哈希应该放在最后，并且必须确保哈希参数之前的参数数量与预期一致，以避免出现“哈希赋值中元素数量为奇数”的错误。如果你想同时传递哈希和数组，或者多个哈希，那么应该使用引用。有关示例和解决方案，请参阅第\
  \ 5 章中关于良好函数设计的技巧。\n\n### 排序/顺序\n\n无法简单地保证键、值或键/值对列表的顺序始终一致。事实上，最好不要依赖两次连续求值之间的顺序：\n\
  \n```\nprint(join(', ',keys %hash),\"\\n\"); print(join(', ',keys %hash),\"\\n\"\
  );\n```\n\n如果你想保证顺序，请使用 `sort`，例如：\n\n```\nprint(join(', ',sort keys %hash),\"\\\
  n\");\n```\n\n如果你多次访问哈希并希望使用相同的顺序，可以考虑创建一个数组来保存排序后的序列，然后使用该数组（它将保持排序顺序）来遍历哈希。例如：\n\
  \n```\nmy @sortorder = sort keys %hash; foreach my $key (@sortorder)\n```\n\n这比不断调用\
  \ `sort` 并创建临时列表更高效，并且还允许你构建自己的自定义顺序序列，可以多次使用。\n\n### 大小\n\n要获取哈希的大小（即元素数量），可以在\
  \ `keys` 或 `values` 上使用标量上下文：\n\n```\nprint \"Hash size: \",scalar keys %hash,\"\
  \\n\";\n```\n\n不要使用 `each`；因为在标量上下文中，它返回哈希的第一个键，而不是你期望的键/值对计数。\n\n如果你在标量上下文中求值哈希，则返回的值是已使用的桶数与分配的桶数之比（有关哈希工作原理的详细说明，请参阅第\
  \ 10 章的“哈希转储”一节）。\n\n# 第 3 章：常见变量陷阱\n\n### 列表\n\n列表仅仅是函数被调用时返回的临时数组，通常是在列表上下文中。当从返回列表的函数中提取单个索引时，必须使用圆括号来暗示函数调用处于列表上下文。以下写法是错误的：\n\
  \n```\n$hours = localtime()[2] ;\n$hours, $minutes = localtime()[2.. 3];\n($hours,$minutes)\
  \ = localtime() [2 .. 3] ;\n```\n\n正确的写法是：\n\n```\n($hours,$minutes) = (localtime())\
  \ [2 .. 3] ;\n```\n\n注意，圆括号要括在返回列表的表达式外面。\n\n### 文件句柄\n\n文件句柄的名称是 `DATA` 或类似形式，而不是\
  \ `<DATA>`。使用\n\n```\nprint <DATA> \"Hello\\n\";\n```\n\n完全不会达到你的预期。`<DATA>` 结构实际上是尖括号运算符，它对句柄执行行输入操作。\n\
  \n### defined 的使用\n\n`defined` 函数只能用于检查特定变量是否存在，或者检查标量中是否有定义的值。所有标量都可以保存未定义值 `undef`，但不能将\
  \ `undef` 赋值给整个数组。以下代码片段\n\n```\n@array = undef;\nprint \"Defined\" if defined(@array);\n\
  ```\n\n将始终打印“Defined”，因为数组已被定义，即使它是空的。即使你用未定义值正确填充数组，结果也是一样：\n\n```\n@array = (undef);\n\
  print \"Defined\" if defined(@array);\n```\n\n原因同样是：数组保存了一个标量列表，在这种情况下数组大小为 1 个元素——该元素是一个用\
  \ `undef` 填充的标量，这一事实并不会改变 `defined` 的返回值。\n\n然而，如果我们在标量上尝试同样的过程：\n\n```\n$scalar\
  \ = undef;\nprint \"Defined\" if defined($scalar);\n```\n\n我们不会得到任何输出，因为 `$scalar`\
  \ 的值是 `undef`。\n\n注意，语句\n\n```\n%hash = undef;\n```\n\n总是会失败，因为我们向哈希赋值了奇数个元素。\n\n\
  ### 默认值\n\n在 Perl 中，没有必要用默认值初始化变量。Perl 会自动将所有标量创建为空（具有未定义值）。列表和哈希会自动创建为空。话虽如此，设置变量的初始值并没有错——对\
  \ Perl 来说没有任何区别——有时这样做是有意义的，哪怕只是为了清晰明了，尤其是当你使用 `my` 预先声明变量时。\n\n### 变量作用域\n\n如果使用不当，`my`、`local`\
  \ 和 `our` 声明可能会引发问题。如果你遇到变量值不正确的问题，请查看本节中的提示。\n\n### my 的效果\n\n`my` 关键字将变量声明为在当前块内作用域。在该块持续期间，新变量将优先于任何先前作用域的变量。当块结束时，变量超出作用域。你可以通过以下代码演示：\n\
  \n```\nmy $string = \"We are the world\"; print \"$string\\n\"; myfunction(); print\
  \ \"$string\\n\";\n\nsub myfunction {\n    my $string = \"We are the function\"\
  ; print \"$string\\n\"; mysub();\n}\n\nsub mysub {\n    print \"$string\\n\";\n\
  }\n```\n\n这将输出：\n\n```\nWe are the world\nWe are the function\nWe are the world\n\
  We are the world\n```\n\n最常见的问题是期望在子程序或块外部访问用 `my` 声明的变量——这是做不到的。注意，即使调用 `mysub`，它访问的也是全局的\
  \ `$string`。\n\n- 在模块内用 `my` 声明的变量在模块外部不可访问（因为模块是一个单独的块），即使使用 `$MyModule::string`\
  \ 或类似方式显式调用也不行。要么使用 `vars` 编译指令，要么在 Perl 5.6 或更高版本中使用 `our` 关键字声明全局变量，然后将完整名称放入\
  \ `@EXPORT` 或 `@EXPORT_OK` 中。\n- `my` 关键字是一个列表运算符，因此在使用 `my` 声明多个变量时必须包含圆括号，例如：\n\
  \n```\nmy ($var, @array);\n```\n\n### local 的效果\n\n当对全局变量使用 `local` 时，每次执行 `local`\
  \ 语句时该变量都会被赋予一个临时值。该临时值仅在该块持续期间有效。然而，使用 `local` 不会影响其可访问性——它仍然是全局变量；只是在块内使用时具有临时值。例如：\n\
  \n```\n{\n    local $var = 'newvalue'; myfunc();\n}\n```\n\n可以理解为：\n\n```\n{\n \
  \   $oldvalue = $var; $var = 'newvalue'; myfunc();\n}\ncontinue {\n    $var = $oldvalue;\n\
  }\n```\n\n不同之处在于，无论块如何退出（包括通过 `return`），`continue` 块都会执行。\n\n- 使用 `local` 修改的变量值，对于从该变量被局部化的块中调用的所有函数都是一致的。在我们的示例中，当从该块内调用\
  \ `myfunc` 函数时，它将访问 `$var` 的临时值，但在块外则访问正常值。\n- 不要对导出的模块变量使用 `local`——该变量的值永远不会改变。\n\
  \n### our 的效果\n\n`our` 关键字（在 Perl 5.6 中引入）将变量声明为全局变量，实际上使其与 `my` 完全相反。例如：\n\n```\n\
  our $string = \"We are the world\"; print \"$string\\n\"; myfunction(); print \"\
  $string\\n\";\n\nsub myfunction {\n    our $string = \"We are the function\"; print\
  \ \"$string\\n\";\n}\n```\n\n输出：\n\n```\nWe are the world\nWe are the function\n\
  We are the function\n```\n\n在函数内或任何形式的嵌套块中对同一变量使用 `our` 没有影响；你始终引用的是同一个全局变量。对用 `my`\
  \ 声明的变量使用 `our` 将不起作用。\n\n### 特殊变量\n\nPerl 中有许多变量具有特殊含义，并且在特定情况下使用时还会暗示特殊的操作或值。下面列出了一些常见的陷阱。\n\
  \n### @_ 数组\n\n`@_` 数组保存传递给函数的参数，并表现出与标准数组相同的问题。此外，\n\n\n\n\n- `@_` 数组仅在子例程调用中或当\
  \ `split` 在标量上下文中调用时才会被填充。现在已不推荐以这种方式使用 `split`。\n\n- `@_` 变量是一个数组，因此语句\n\n```\n\
  $value = @_;\n($value) =\n```\n\n只会导致 `$value` 被填充为 `@_` 中元素的数量，而不是 `@_` 数组中的第一个值。即使只有一个参数，也要在参数列表周围加上括号，以表示列表上下文。\n\
  \n- 变量 `$_` 和 `$_[0]` 并不相同——前者是用于保存某些临时值的标量，后者是 `@_` 数组的第一个元素。\n\n- 提供给函数的数组和哈希会被转换为列表；无法确定复合数组/哈希参数的起始和结束位置。调用\n\
  \n```\nmyfunc(Oarray,%hash)\n```\n\n会导致 `@_` 被填充为一个长列表，其中包含数组的值，后跟哈希的键值对。如果希望向函数传递多个数组和/或哈希，请使用引用。（更多细节请参见第\
  \ 5 章。）\n\n## $_ 标量\n\n`$_` 变量被各种函数和运算符用作默认存储空间。除非确实需要，否则应小心避免无意中修改或使用 `$_` 的值。\n\
  \n- `$_` 标量在所有包之间共享，这意味着在子例程调用之间更改该变量的值可能会产生意外后果。例如：\n\n```\n$_ = \"Hello World\\\
  n\";\n\nsub parse\n{\ntr/[a-z]/[A-Z]/;\n}\n```\n\n调用 `parse` 会将 `$_` 转换为大写。\n\n\
  - `$_` 变量被用作某些函数的默认源变量，包括 `print`、`unlink`、`ord`、`pos`、`split` 以及所有文件测试。例如，以下所有语句对都是等价的：\n\
  \n```\nwhile(<FILE>)\nwhile(defined($_ = <FILE>))\n\nchomp;\n```\n\n如果不确定可能的影响，请始终在这些函数中提供要使用的变量名。\n\
  \n- `$_` 变量是在没有使用 `=~` 运算符调用正则表达式时的默认变量，因此，\n\n```\ns/a/b/; 和\n$_ =~ s/a/b/;\n```\n\
  \n是等价的。\n\n- `$_` 变量被用作 `for` 或 `foreach` 循环中的默认迭代器，一个常见的错误是：\n\n```\nforeach (©array)\
  \ {\nforeach (split) {\n}\n}\n```\n\n内层循环的第一次迭代会覆盖外层循环的迭代器值。虽然在此例中不会影响操作，但你也无法使用这些值。\n\
  \n- `$_` 变量是 `map` 和 `grep` 中的隐式操作数，你不能指定替代变量。在使用这两个函数的循环中，避免使用 `$_`。\n\n- 当 `<FH>`\
  \ 运算符、`readline` 函数或 `glob` 运算符的结果本身作为 `while` 循环的一部分进行测试时，`$_` 变量是它们的默认目标。\n\n\
  ## $a 和 $b 标量\n\n`$a` 和 `$b` 标量仅在与 `sort` 函数结合使用的块和子例程中可用。\n\n- 避免使用同名变量以防止混淆。\n\
  \n- Perl 将这些变量视为各个包的全局变量，这意味着每个包都有自己的版本。实际上，`$a` 和 `$b` 属于编译 `sort` 运算符时所在的包。这不一定与\
  \ `sort` 调用的函数所在的包相同。\n\n- `$a` 和 `$b` 实际上是你正在排序的实际数组或哈希值的别名。因此，应避免更改这些变量，因为这样做会改变数组或哈希中的实际值。如果需要比较需要预处理更复杂的值，请使用函数并制作副本；例如，下面的代码片段将比较并排序美式日期（月/日/年）：\n\
  \n```\nsub sortdate {\nmy ($c,$d) = ($a,$b)?\n$c =~ s{(\\d+)/(\\d+)/(\\d+)}{sprintf(\"\
  %04d%02d%02d\",$3,$1,$2)}e;\n$d =~ s{(\\d+)/(\\d+)/(\\d+)}{sprintf(\"%04d%02d%02d\"\
  ,$3,$1,$2)}e; $c <=> $d;\n```\n\n## $1..$9 及其他正则变量\n\n`$1..$9` 变量（以及更多）仅在正则表达式匹配或替换期间被填充，并且无论是否使用分组，这些变量的值都会在每次正则表达式匹配或替换时被重置：\n\
  \n```\n$string = \"The cat sat on the mat\";\n$string =~ m/The (.*?) sat on the\
  \ (.*)/;\nmy ($animal, $where) = ($1,$2);\n$string =~ m/(.a.)/;\nprint \"Animal:\
  \ $animal, Where: $where\\n\";\nprint \"Animal: $1, Where: $2\\n\";\n```\n\n第二个\
  \ `print` 语句会失败，因为 `$2` 从未被初始化。同样的规则也适用于 `$'`、`$&` 和 `$'` 变量。解决方案是通过在列表上下文中评估匹配来立即赋值：\n\
  \n```\nmy ($animal, $where) = ($string =~ m/The (.*?) sat on the (.*)/);\n```\n\n\
  这完全消除了对 `$1` 和其他变量的需求。\n\n### 引用\n\n引用让许多程序员感到困惑，因为从变量中提取信息的方式发生了变化。\n\n### 标量\n\
  \n标量引用很少引起问题；只需记住必须使用 `print $$scalar;` 来解引用标量。\n\n注意，你可以使用以下任何语句创建对标量的引用：\n\n```\n\
  $ref = \\$scalar;\n$ref = \\'Hello world';\n$ref = \\134_569.99;\n```\n\n但是，要小心三位数字；`$ref\
  \ = \\012;` 这一行实际上将 `$ref` 设置为一个指向标量的引用，该标量保存十进制值 10——该序列必须被引号括起来才能被解释为换行符。\n\n\
  ### 数组\n\n数组最常见的问题是在创建或解引用它们时。数组引用使用方括号创建，而不是圆括号。可以使用方括号创建数组引用：\n\n```\n$array =\
  \ [1,2,3];\n```\n\n将现有数组转换为引用：\n\n```\n$array = \\@array;\n```\n\n或\n\n```\n$hash{\
  \ = [1,2,3];\n```\n\n解引用单个元素时：\n\n```\nprint $$array[0];\nprint $array->[0];\n```\n\
  \n访问整个数组：\n\n```\nprint join(', @$array);\nprint join(', ', @{$array});\n```\n\n\
  一旦解引用，数组意味着数组上下文，例如：\n\n```\n($first, $second) = @{$array}->[1,2];\n```\n\n### 哈希\n\
  \n哈希引用是你最常遇到的，并且有许多常见的陷阱。使用花括号创建对新哈希的引用：\n\n```\n$hash = { Fred => 'Flintstone',\
  \ Barney => 'Rubble'};\n```\n\n可以使用 `$hash = \\%hash;` 转换现有哈希。\n\n可以使用 `$hash{fields}\
  \ = { Fred => 'Flintstone', Barney => 'Rubble'};` 创建嵌套哈希。\n\n解引用哈希元素时，使用以下两种格式之一：\n\
  \n```\nprint $hash->{Fred};\nprint $$hash{Fred};\n```\n\n使用\n\n```\nprint $hash;\n\
  ```\n\n将输出对象类型及其内存地址，而不是打印内容。要访问整个哈希，请使用\n\n```\nprint keys %$hash;\nprint keys\
  \ %{$hash};\n```\n\n当你想使用 `keys`、`values` 或 `each` 时，必须解引用哈希引用。简单地尝试\n\n```\nprint\
  \ keys $hash;\n```\n\n将不起作用。\n\n一旦解引用，哈希意味着列表上下文，就像它是一个普通哈希一样。与普通哈希相比，解引用哈希返回的列表没有特殊处理。\n\
  \n使用花括号返回哈希引用时，要小心确保 Perl 将花括号视为哈希引用，而不是块。例如，\n\n```\nsub new_hash {\n{ @_ };\n\
  }\n```\n\n不起作用；它实际上将 `@_` 作为列表返回，因为这些花括号没有限定符来告诉 Perl 将它们解释为哈希引用。相反，请使用\n\n```\n\
  sub new_hash {\n+{ @_ };\n}\n```\n\n或\n\n```\nsub new_hash {\nreturn { @_ };\n}\n\
  ```\n\n### 函数\n\n应使用 `\\&function` 表示法创建对函数的引用，例如：`$coderef = \\&parse_text;`\n\n\
  以下操作不会达到预期效果，实际上不会使 `$coderef` 指向代码引用：\n\n```\n$coderef = \\parse_text();\n$coderef\
  \ = \\parse_text;\n$coderef = \\&parse_text();\n```\n\n当调用由代码引用引用的函数时，请使用：\n\n\n\
  \n\n`&$coderef(1,2,3) ; &{$coderef} (1,2,3);`\n\n请注意，在第二种形式中，函数的参数位于块之后，而不是块之内。（关于如何对函数使用软引用的详细信息，请参见第\
  \ 5 章的“调度表”一节。）你也可以使用匿名子例程创建代码引用：\n\n```\n$coderef = sub { print \"Hello world\\\
  n\" };\n```\n\n记得包含结尾的分号——你必须包含分号来终止表达式，因为我们不是在创建命名子例程。\n\n### 类型团\n\n类型团应如下引用：\n\
  \n```\n$globref = \\*STDOUT;\n```\n\n注意，类型团本身不需要解引用：\n\n```\n$globref = \\*STDOUT;\n\
  $globin = \\*STDIN;\n\n$var = <$globin>;\n\nprint $globref 'Hello world',$var,\"\
  \\n\";\n```\n\n### 嵌套结构\n\n当你创建嵌套引用时，父级的值是对新类型的引用。例如，在：\n\n```\n$hash{list}[0] =\
  \ 1;\n```\n\n中，`$hash{list}[0]` 是哈希 `%hash` 中键 `$hash{list}` 的值所持有的数组的第一个元素。\n\n\
  要访问整个数组，你必须解引用父级：`print join(', ', @{$hash{list}});`\n\n为了清晰起见，你可以使用块表示法来指定要解引用的值：`print\
  \ join(', ', @{$hash{list}});`\n\n对于嵌套结构，你可以省略中缀操作符，因此 `$hash{list}->{numbers}->[0]\
  \ = 'First';` 可以重写为：\n\n```\n$hash{list}{numbers}[0] = 'First';\n```\n\n但请记住，以下语句并不相同：\n\
  \n```\nprint $hash{list}[0];\nprint $hash->{list}->[0];\n```\n\n第一个访问的是 `%hash`\
  \ 的哈希元素中包含的数组的第一个元素，而第二个访问的是 `$hash` 所指向的哈希引用中包含的数组的第一个元素。\n\n你不需要为嵌套结构初始化一个值才能使其工作。以下片段中的第一行并非必要：\n\
  \n```\n$hash->{list} = 1;\n$hash->{list}->[0] = 1;\n```\n\n第二行会用对新数组的引用来填充 `$hash->{list}`。类似地，当你需要使用递增或递减操作符时，也不需要设置默认值。以下片段：\n\
  \n```\nunless(exists($hash->{list}->{$field})) {\n    $hash->{list}->{$field} =\
  \ 0;\n}\nelse {\n    $hash->{list}->{$field}++;\n}\n```\n\n可以简化为 `$hash->{list}->{$field}++;`\n\
  \n### 引用类型\n\n你无法猜测引用的类型，因此请确保使用 `ref` 函数来确定类型。记住，`ref` 返回一个与引用类型相关的字符串；它将是以下之一：\n\
  \n- `REF`\n- `SCALAR`\n- `ARRAY`\n- `HASH`\n- `CODE`\n- `GLOB`\n\n如果你不提供类型，`ref`\
  \ 函数默认使用 `$_`。\n\n将现有类型转换为引用，然后在整个段落或函数中使用该引用会更简单。例如，下面的代码允许你向函数提供哈希或哈希引用：\n\n```\n\
  sub db_new_user {\n    my ($info, $key);\n    if (ref($_[0]) eq 'HASH') {\n    \
  \    ($info) = @_;\n    }\n    else {\n        $info = {@_};\n    }\n    foreach\
  \ my $key (sort keys %{$info}) {\n        $user->{$key} = $info->{$key};\n    }\n\
  \    return $user;\n}\n```\n\n### 对象\n\n除了本章前面提到的关于引用（因此也是对象）的规则外，与对象相关的其他潜在问题涉及方法和/或继承的使用。请确保，如果你想依赖继承，当前包的\
  \ `@ISA` 数组，或者你正在创建的对象的父类，已被正确填充。有关其他提示，请参见第 5 章。当对 `classname` 类型的对象调用方法时，Perl\
  \ 按以下顺序进行：\n\n1. Perl 检查对象自身的类（包）中是否有名为 `class::method` 的例程。\n2. Perl 检查 `@class::ISA`\
  \ 中列出的父类，寻找 `parent::method`。\n3. Perl 查找名为 `UNIVERSAL::method` 的子例程。\n4. 然后继承转向自动加载的方法，首先查找\
  \ `class::AUTOLOAD` 子例程。\n5. Perl 搜索 `@class::ISA` 中列出的所有父类，寻找 `parent::AUTOLOAD`\
  \ 子例程。\n6. 最后，Perl 查找 `UNIVERSAL::AUTOLOAD` 子例程。\n\n如果序列失败，那么你将得到“无法定位对象方法”的错误。\n\
  \n### 常量、引号和插值\n\n当将原始数据引入 Perl 脚本时，Perl 会在编译阶段尽力解释和解析信息。以下行：\n\n```\n$var = 4 +\
  \ 5;\n```\n\n会立即将计算解析为其原始值。这也会影响 Perl 处理字符串的方式；以下内容：\n\n```\n$message = \"Hello\
  \ \" . 'user' . \", how are you today?\";\n```\n\n将在编译期间解析为：\n\n```\n$message =\
  \ \"Hello user, how are you today?\";\n```\n\n引入字符串常量有三种基本格式：单引号、双引号和“here”文档。单引号和双引号的工作方式相同，只是单引号不会进行插值。\n\
  \n### 引号操作符\n\n引号操作符列在表 3-1 中。请注意，只有部分操作符会进行插值，并且用作分隔符的单引号始终禁用插值，即使是在通常进行插值的形式中也是如此。\n\
  \n| 常规形式 | 通用形式 | 含义 | 是否插值 |\n|-----------|---------|---------|--------------|\n\
  |           |         |         |              |\n\n如果你使用通常成对匹配的字符作为分隔符（圆括号、花括号、方括号或尖括号），那么你必须使用匹配的形式。例如，以下片段：\n\
  \n```\n$_ = 'hello';\ns{hello{goodbye{;\nprint;\n```\n\n会引发错误；它应该这样写：\n\n```\n$_\
  \ = 'hello';\ns{hello}{goodbye};\nprint;\n```\n\n### “Here”文档\n\n使用“here”文档时，你必须在\
  \ `<<` 操作符后立即指定终止字符串，例如：\n\n```\nprint <<EOF;\nThis is a here document!\nEOF\n```\n\
  \n在 `<<` 操作符后使用空格将要求你在实际终止时也使用空格。\n\n你还必须使用分号来结束语句，并避免后续参数成为表达式的一部分。避免使用空终止字符串（允许使用空行作为终止），因为它容易引发小问题。\n\
  \n### 变量和字符串插值\n\n变量和字符串会根据下面概述的规则被求值并插入到字符串和其他插值序列（如正则表达式）中。\n\n#### 插值标量\n\n所有插值操作中最常见的错误是在需要使用插值时使用了单引号：`print\
  \ 'Hello World\\n';`\n\n当你尝试将多个变量插值到单个字符串中，或者将变量插值到包含有效变量名字符的字符串中时，也应小心。以下所有操作都不会生效：\n\
  \n```\n$prefix = 'file.';\n$suffix = 'ext';\nprint \"Filename is $prefixdoc\\n\"\
  ;\nprint \"Filename is $prefix_doc\\n\";\nprint \"Filename is $prefix_$suffix\\\
  n\";\n```\n\n插值不是嵌套的；你不能这样做：\n\n```\n$string = 'Hello world\\n';\nprint \"$string\"\
  ;\n```\n\n并期望输出以换行符结束——插值严格在字符串被引用的那一刻起作用。嵌入的变量不会被重新求值。\n\n#### 插值数组\n\n你可以直接将数组插值到合适的引用块中——只需将变量名放入引号中。数组的各个元素将由特殊变量\
  \ `$\"` 的值分隔，默认情况下是一个空格。因此，你可以显示一个逗号分隔的值列表：\n\n```\n@list = qw/Martin Wendy Sharon/;\n\
  $\" = ', ';\nprint \"@list\\n\";\n```\n\n通常，使用 `join` 比使用 `$\"` 更简单。\n\n例外情况是，如果\
  \ `@` 符号后的名称在符号表中无法解析为合适的变量，Perl 会引发错误。例如，以下内容：\n\n```\nprint \"mc@whoever.com\"\
  ;\n```\n\n会导致 Perl 尝试插值 `@whoever` 数组，而该数组不存在。Perl 会在编译期间引发错误以突出此问题。要解决此问题，要么转义\
  \ `@` 符号，要么使用非插值字符串：\n\n```\nprint \"mc\\@whoever.com\";\nprint 'mc@whoever.com';\n\
  ```\n\n\n\n\n### 插值哈希\n\nPerl 完全忽略嵌入到插值字符串中的整个哈希；没有任何技巧可以将哈希嵌入到字符串中。哈希元素和切片的工作方式与上述标量和数组相同。如果要输出整个哈希，必须使用循环：\n\
  \n```\nforeach (keys %hash) {\n    print \"$_ = $hash{$_}\\n\";\n}\n```\n\n或者，结合\
  \ `join` 函数使用 `keys` 或 `values` 来输出整个序列。\n\n### 字符插值\n\n表 3-2 中的字符仅在插值字符串中被解释。非插值引号将原样使用这些字符序列。\n\
  \n表 3.2 Perl 支持的字符插值\n\n## 第 4 章：语句和函数陷阱\n\n![picture5](img/picture5.jpg)\n\n在第\
  \ 3 章中，我们探讨了一些可能潜入 Perl 脚本中的特定变量陷阱和错误。在本章中，我们将研究通用语句、语句序列和函数，以及它们可能引发的问题。遗憾的是，我们没有足够的篇幅来逐一列举世界上所有可能引发问题和错误的脚本组合，但本章及上一章的信息或许能帮助你在识别出特定问题后，定位并解决一个错误。\n\
  \n### 测试与比较\n\n测试与比较中最常见的问题是对值类型使用了错误的比较运算符。必须对数值使用 `==`、`!=` 等，对文本使用 `eq`、`ne`\
  \ 及其他基于文本的比较。例如：\n\n```\nprint \"Same\\n\" if ('123.0' eq '123');\nprint \"Same\\\
  n\" if ('123.0' == '123');\n```\n\n前者为假，因为两个字符串并不相同；但后者中，字符串被 Perl 转换为数字，因此相等。\n\
  \n使用 `sort` 时，应当用 `<=>` 比较数值，用 `cmp` 比较字符串。\n\n`cmp` 运算符返回两个值的比较结果：如果它们相同，运算符返回零，而不是一。下面两行（逻辑上相反）：\n\
  \n```\nprint \"Same eq\\n\" if ('Martin' eq 'Martin');\nprint \"Same cmp\\n\" if\
  \ ('Martin' cmp 'Martin');\n```\n\n第一行按预期工作，第二行则不然。`cmp` 运算符最好用在 `sort` 块中。\n\n\
  类似地，`<=>` 运算符比较两个数值，但与 `==` 并不相同：\n\n```\nprint \"Same ==\\n\" if (1 == 1);\nprint\
  \ \"Same <=>\\n\" if (1 <=> 1);\n```\n\n`<=>` 运算符最好作为 `sort` 块的一部分使用。\n\n### 循环\n\
  \n大多数与循环相关的问题实际上都可以追溯到你在语句中使用的比较运算符。其余错误大多可归结为某些结构的特殊或非标准处理——例如，`while` 循环中 `<FILEHANDLE>`\
  \ 运算符的特殊处理。\n\n### 使用 `while`\n\n使用 `while` 时，请记住以下结构：\n\n```\nwhile(<FILE>)\n```\n\
  \n实际上被 Perl 视为：\n\n```\nwhile(defined($_ = <FILE>))\n```\n\n`<FILEHANDLE>` 运算符仅在\
  \ `while` 循环测试的范围内改变 `$_` 变量。以下代码片段：\n\n```\nwhile (1) {\n    <FILE>;\n    print\
  \ \"Line: $_\";\n    last unless(defined($_));\n}\n```\n\n将是一个无限循环，因为 `<FILE>` 语句并未更新\
  \ `$_`。\n\n### `do {} while` 循环\n\n`do {}` 循环实际上并不是真正的循环——`do` 在语句为真时执行语句。这意味着你不能在\
  \ `do` 循环中使用循环控制语句（`next`、`last` 等）。\n\n### `for` 和 `foreach` 循环\n\n使用三参数形式时，请使用\
  \ `for` 而非 `foreach`，就像 C 语言一样。例如，`for(my $i=0;$i<100;$i++)` 比以下写法更清晰：\n\n```\n\
  foreach(my $i=0;$i<100;$i++)\n```\n\n相反，语句 `foreach (@array)` 比 `for (@array)` 更清晰。\n\
  \n在数组上使用 `for` 时，请记住测试运算符的逻辑。以下写法正确：\n\n```\nfor(my $i=0;$i<@array;$i++)\nfor(my\
  \ $i=0;$i<=$#array;$i++)\n```\n\n但\n\n```\nfor(my $i=0;$i<=@array;$i++)\n```\n\n\
  会多读取一个元素，而\n\n```\nfor(my $i=0;$i<$#array;$i++)\n```\n\n则永远无法到达数组末尾。\n\n- 请记住，如果你没有提供替代变量名，`foreach`\
  \ 会使用 `$_` 变量。\n- `foreach` 语句接受动态生成的数组或列表，或者通过 `keys` 或 `values` 的返回结果。它也是非破坏性的——你遍历列表或数组的元素；元素不会被\
  \ `pop` 或 `shift` 移除。\n\n### 控制语句\n\n使用控制语句 `next`、`last` 和 `continue` 时，需要小心确保你正确跳转到下一个可执行块。以下指南应有所帮助。\n\
  \n`next` 运算符跳过代码块的剩余部分，强制循环重新评估下一次迭代。例如：\n\n```\nwhile (<DATA>) {\n    next if /^#/;\n\
  }\n```\n\n如果文件中的行以井号开头，则会跳过这些行。这是 Unix 下的标准注释风格。如果存在 `continue` 块，则在执行循环的下一次迭代之前会先执行它。\n\
  \n`last` 关键字完全结束循环，跳过代码块中的剩余语句并退出循环。当循环内达到了无法通过其他方式捕获的替代条件时，最好使用它来跳出循环。因此，`last`\
  \ 关键字与 C 和 shell 脚本中的 `break` 关键字相同。例如：\n\n```\nwhile (<DATA>) {\n    last if ($found);\n\
  }\n```\n\n如果 `$found` 的值为真，则退出循环，无论是否实际到达文件末尾。`continue` 块不会被执行。\n\n`redo` 关键字重新执行代码块，而不重新评估循环的条件语句。这会跳过代码块的剩余部分，并在主代码块重新执行之前跳过\
  \ `continue` 块。例如，以下代码会在当前行以反斜杠结尾时从文件中读取下一行：\n\n```\nwhile(<DATA>) {\n    if (s#\\\
  \\$#) {\n        $_ .= <DATA>;\n        redo;\n    }\n}\n```\n\n除非指定了循环名称，否则所有循环控制语句都影响当前（最内层）循环。例如：\n\
  \n```\nOUTER:\nwhile(<DATA>) {\n    chomp;\n    @linearray = split;\n    foreach\
  \ $word (@linearray) {\n        next OUTER if ($word =~ /next/i);\n    }\n}\n```\n\
  \n如果输入行中包含单词 \"next\"，则会跳过当前输入行，同时允许处理文件中的其余单词。如果我们使用了不带限定符的 `next` 语句，它只会跳转到 `foreach`\
  \ 循环中的下一个单词。\n\n### 正则表达式陷阱\n\n正则表达式本身很容易出现简单的逻辑问题。与其列出所有可能的组合，不如列出在语句中使用正则表达式时最常见的用法问题。\n\
  \n正则表达式的模式绑定运算符是 `=~`。以下两行并不执行相同的操作：\n\n```\n$string = /foo/;\n$string =~ /foo/;\n\
  ```\n\n第一行将 `$_` 与字符 \"foo\" 进行匹配，如果匹配成功，则向 `$string` 返回一个真值。第二行将 `$string` 与字符\
  \ \"foo\" 进行匹配。\n\n当你想要将多个变量与正则表达式中的分组进行匹配时，应该使用：\n\n```\n($first, $second) = ($var\
  \ =~ m/(.*):(.*)/);\n```\n\n注意匹配语句周围的括号；以下示例是错误的：`($first, $second) = $var =~ m/(.*):(.*)/;`\
  \ 并且应该引发错误，但语句\n\n```\n$first = ($var =~ m/(.*):(.*)/);\n```\n\n会静默失败，并将 `$first`\
  \ 设置为 1。\n\n注意不要在正则表达式中匹配过多内容。以下代码片段：\n\n```\n$string = 'The cat sat on the mat';\n\
  ($match) = ($string =~ /The (.*) /);\n```\n\n\n\n\n`$match`被设置为`\"cat sat on the,\"\
  `，而你可能只想要`\"cat\"`。这是因为你使用了最大匹配，从字符串末尾开始，匹配到最后一个空格之前的所有内容。通过在限定符后添加问号来使用最小匹配：\n\n\
  ```\n($match) = ($string =~ /The (.*?) /) ;\n```\n\n这会强制正则表达式引擎返回匹配到下一个正则表达式标记的文本，而不是最后一个标记。\n\
  \n### 函数陷阱\n\n由于大多数 Perl 函数的工作方式，很难给所有函数一个严格或连贯的含义。大多数函数和运算符根据它们使用的上下文具有自己的特殊含义和处理方式。也不可能根据函数返回的内容来对它们进行分类，因为不同的函数根据上下文返回不同的信息。例如，`localtime`函数在标量上下文中返回日期/时间字符串，但在列表上下文中返回各个组成部分。\n\
  \n有关 Perl 内置函数的一些常见问题和影响的快速参考，请参见表 4-1。该表列出了函数及其使用或修改的变量，或它们引发的异常类型。列描述如下：\n\n-\
  \ D 使用`$_`、`@_`或类似作为默认值\n- `$!` 在错误时设置`$!`\n- `$@` 引发异常——使用`$@`从`eval`获取错误消息\n-\
  \ `$?` 当子进程退出时设置`$?`\n- T 污染数据\n\n第 4 章：语句和函数陷阱 79\n\n- XA 当提供无效参数时引发异常\n- XR 如果修改只读参数则引发异常\n\
