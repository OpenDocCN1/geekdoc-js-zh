  \n在 `use filetest` 编译指示下，切换真实和有效用户 ID 或组 ID 失败。\n\nError converting file specification\
  \ `%s` 致命错误，仅限 VMS\n\n由于 Perl 可能需要处理 VMS 或 Unix 语法的文件规范，因此在直接操作它们时会将其转换为单一形式。要么你向\
