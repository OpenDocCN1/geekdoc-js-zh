  \ 仍然是一个引用。\n\n### 无法本地化词法变量 %s 致命错误\n\n你尝试对已使用 `my` 声明的变量使用 `local`。如果你试图本地化同名的包变量，则需要使用完全限定的变量名。\n\
  \n### 无法本地化伪哈希元素 致命错误\n\n你尝试使用类似以下代码本地化哈希引用的元素：\n\n```\nlocal $ar-{'key'}\n```\n\
