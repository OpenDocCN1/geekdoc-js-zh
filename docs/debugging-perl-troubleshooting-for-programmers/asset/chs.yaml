  \ `eval` 检查此函数的执行状态。参见第 6 章。\n\n### 无法执行 {n,m}，因为 n > m 致命错误\n\n你尝试引入一个重复匹配范围，其中较小值（`n`）大于较大值（`m`）。\n\
  \n### 无法模拟 #! 行上的 -%s 致命错误\n\n你在 shebang（`#!`）行上提供了一个在此处无意义的开关。请检查 shebang（`#!`）行是否有拼写错误。\n\
  \n### 无法执行 \"%s\"：%s 警告（执行）\n\n`system`、`exec` 或管道 `open` 调用无法执行指定的程序，原因如所述。可能是文件没有合适的权限允许你执行它；文件未在你的路径中找到（由\
  \ `$ENV{PATH}` 定义）；或者该可执行文件是为其他架构编译的。如果 shebang（`#!`）行中的值无效，或者你的系统根本不支持 shebang（`#!`）行，也会引发同样的错误。\n\
  \n### 无法执行 %s 致命错误\n\nPerl 正试图为你执行指定的程序，因为这是 shebang（`#!`）行所指示的。如果这不是你想要的，你可能需要在\
  \ shebang（`#!`）行的某处提及 `perl`。\n\n### 无法执行 %s 致命错误\n\n你使用了 `-S` 开关（用于在 `$ENV{PATH}`\
  \ 中查找脚本），但找到的脚本副本没有正确的权限。\n\n### 在 PATH 中找不到 %s，V 不在 PATH 中 致命错误\n\n你使用了 `-S` 开关，但在你的\
  \ `PATH` 中找不到要执行的脚本。脚本存在于当前目录，但 `PATH` 不包含 `'.'` 以允许使用当前目录。\n\n### 在 PATH 中找不到 %s\
  \ 致命错误\n\n你使用了 `-S` 开关，但在 `PATH` 中找不到要执行的脚本。\n\n### 找不到标签 %s 致命错误\n\n你使用了 `goto`\
  \ 到一个标签，但该标签在任何可能跳转的位置都未提及。\n\n### 在 EOF 之前找不到字符串终止符 %s 致命错误\n\n你在某处开始了一个字符串，但没有提供结束终止符——引号、括号或其他。这会导致\
  \ Perl 将脚本的其余部分用作字符串的源，但如果直到脚本结束仍未找到终止符，则会引发错误。\n\n358 调试 Perl：程序员故障排除\n\n检查你最后修改的字符串，或脚本中的最后一个字符串，并反向检查每个字符串是否正确终止。记住引号必须两端匹配；你不能这样做：\n\
  \n```\nprint 'Hello world! \\n\" ;\n```\n\n当使用“here”文档时。确保你正确提供了终止字符串——它不应有任何前导空白（检查缩进）。以下代码会引发错误：\n\
  \n```\nprint <<EOF Testing... EOF\n```\n\n还要记住不要在终止行添加分号。\n\n### 无法 fork 致命错误\n\n\
  在尝试打开管道时进行 fork 时发生了致命错误。\n\n### 无法获取文件规格 - 过时的 stat 缓冲区？严重警告，仅限 VMS\n\n这是由于 VMS\
  \ 下的访问检查与 Perl 假设的 Unix 模型之间的差异引起的。在 VMS 下，访问检查是通过文件名进行的，而不是通过 stat 缓冲区中的位，因此可以考虑到\
  \ ACL 和其他保护。不幸的是，Perl 假设 stat 缓冲区包含所有必要信息，并将其传递给访问检查例程，而不是文件规格。它将尝试使用 stat 缓冲区中的设备名称和\
  \ FID 来检索文件规格，但这仅在之后没有调用 CRTL `stat()` 例程时才有效，因为每次调用都会覆盖设备名称。如果出现此警告，则名称查找失败，访问检查例程放弃并返回\
  \ FALSE，以保持保守。（注意：访问检查例程知道 Perl 的 `stat` 运算符和文件测试，因此你不应该看到此警告作为 Perl 命令的响应；它仅在某些内部代码轻率地处理\
  \ stat 缓冲区时出现。）\n\n### 无法获取管道邮箱设备名称 内部错误，仅限 VMS\n\n在创建用作管道的邮箱后，Perl 无法检索其名称以供后续使用。\n\
  \n### 无法获取 MAXBUF 的 SYSGEN 参数值 内部错误，仅限 VMS\n\nPerl 向 `$GETSYI` 询问邮箱缓冲区的大小，但没有得到答案。\n\
  \n### 无法在子程序外部跳转到子程序 致命错误\n\n深度神奇的 `goto` 子程序调用只能用一个子程序调用替换另一个。它不能为你创建一个子程序调用。通常，你应该只在\
  \ `AUTOLOAD` 例程中调用它。\n\n### 无法从 eval 字符串跳转到子程序 致命错误\n\n`goto` 子程序调用不能用于跳出 `eval\
  \ \"string\"`。但它可以用于跳出 `eval {BLOCK}`。\n\n附录 A：错误消息交叉引用 359\n\n### 无法忽略信号 CHLD，强制恢复为默认值\
  \ 警告（信号）\n\nPerl 检测到它在 `SIGCHLD` 信号（有时称为 `SIGCLD`）被禁用的情况下运行。由于禁用此信号会干扰正确确定子进程的退出状态，Perl\
  \ 已将该信号重置为其默认值。这通常是由调用 Perl 的父程序未能正确管理其子进程引起的。\n\n### 无法通过引用进行本地化 77 致命错误\n\n你写了类似\
