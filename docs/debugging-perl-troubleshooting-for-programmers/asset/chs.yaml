  \n\\1 最好写成 $1 语法警告\n\n现在不推荐使用 `\\x` 来引用正则表达式中的匹配组——请改用 `$x` 形式。\n\nT 和 V 不能同时在命令行上指定\
  \ 致命错误，仅限 VMS\n\nPerl 执行自己的命令行重定向，它发现 STDIN 是一个管道，并且你还试图使用 `<` 重定向 STDIN。每个客户只能有一个\
  \ STDIN 流。\n\nT 和 V 不能同时在命令行上指定 致命错误，仅限 VMS\n\n\n\n\nPerl 会自行处理命令行重定向，它认为你试图同时将标准输出重定向到文件以及通过管道传递给另一个命令。你需要选择其中一种方式，不过你仍然可以将输出通过管道传递给一个能够将输出“分流”到两个流的程序或\
  \ Perl 脚本，例如：\n\n```\nopen(OUT,\">$ARGV[0]\") or die \"Can't write to $ARGV[0]:\
  \ $!\";\nwhile (<STDIN>) {\n    print;\n    print OUT;\n}\nclose OUT;\n```\n\n收到来自\
