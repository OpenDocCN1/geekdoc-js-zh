  ```\n\n`/%s/: 无法识别的转义 Woe 已通过警告（正则表达式）`\n\n你使用了 Perl 无法识别的反斜杠-字符组合。例如：\n\n```\n\
  s/\\q//g;\n```\n\n这也会在插值字符串中出现。\n\n`/%s/: 字符类中无法识别的转义 \\\\%c 已通过警告（正则表达式）`\n\n你在字符类中使用了\
  \ Perl 无法识别的反斜杠-字符组合。该字符被按字面意义理解。\n\n`/%s/ 应写为 \"%s\" 语法警告`\n\n你在 Perl 期望引号字符串的位置使用了正则表达式语法。这通常是由于在\
  \ `join` 上无意中使用了 `split` 格式。\n\n`%s (...) 被解释为函数 语法警告`\n\nPerl 将任何后跟括号的列表运算符解释为函数，而不是运算符。这通常表明使用了错误的函数，或者括号放在了错误的位置。对函数名使用软引用也是另一个潜在问题。\n\
  \n`%s() 调用过早，无法检查原型 原型警告`\n\n你定义了一个带有原型的函数，但在 Perl 有机会解释并验证原型之前就调用了该函数。例如：\n\n```\n\
  Appendix A: Error Message Cross Reference 345\n\nmessage () ;\n\nsub message($)\
  \ {\n\nprint \"Hello World\\n\";\n\n}\n```\n\n要么在脚本开头引入一个前向声明，这对所有函数调用都有效：`sub message($);`，要么将函数定义移到脚本开头。\n\
  \n`%s 参数不是 HASH 或 ARRAY 元素 致命错误`\n\n你向 `exists` 函数提供了哈希或数组元素以外的内容。传递整个哈希或数组，或任何其他类型的对象，都会引发此错误。可能是向函数传递了错误的引用——以下都是有效的：\n\
  \n```\nexists($hash{key}); exists($array[0]); exists($ref->{'key 1'});\n```\n\n\
  `%s 参数不是 HASH 或 ARRAY 元素或切片 致命错误`\n\n`delete` 函数只接受哈希或数组元素，或哈希或数组切片。传递其他任何内容都会引发上述错误。这可能是由于不正确或未定义的引用或对象导致的。\n\
  \n`%s 参数不是子程序名 致命错误`\n\n当使用 `exists` 验证函数时，只提供函数名，不要将其作为函数调用。例如：\n\n```\nexists(&function)\
  \ 是可行的，但\n\nexists(&function($text)); 会失败。\n```\n\n`%s 未返回真值 致命错误`\n\n你可能创建了一个正在被导入的文件或模块，但该文件在末尾没有返回真值。有两种可能：要么你忘了在文件末尾包含一个简单的\n\
  \n```\n1;\n```\n\n行，要么你正在使用一个系统来检查导出是否正常工作，而它刚刚失败了。\n\n```\n346 Debugging Perl:\
  \ Troubleshooting for Programmers\n```\n\n`%s 在期望运算符的位置找到 严重警告`\n\nPerl 在期望运算符的位置找到了一个项——你可能忘记了一个分隔符或运算符，或者这是该行未以分号结尾的早期迹象。\n\
  \n`%$ 存在编译错误 致命错误`\n\n使用 `-c` 命令行选项调用 Perl 时的最终失败消息。\n\n`%s 错误过多 致命错误`\n\nPerl 在放弃之前只列出\
  \ 10 个错误——如果你有超过这个数量，可能表明某种排版错误，例如缺少括号、引号或分号。\n\n请注意，`strict` 编译指示报告的错误数量没有限制。\n\
  \n`%s 多次匹配空字符串 警告（正则表达式）`\n\n你指定的模式如果正则表达式引擎没有专门检查，将会导致无限循环。\n\n`%s 从未引入 严重警告`\n\
  \n这表示解释器内部存在问题，而不是你的脚本。基本上，Perl 试图使用一个先前定义的对象，但当 Perl 想要使用它时，它已经超出了作用域。这可能是由 `eval`\
  \ 调用、动态生成的信号处理程序或基于线程的脚本引起的。\n\n`%s 包属性可能与未来的保留字冲突：%s 警告`\n\n你为对象属性或方法使用了小写名称，而该名称将来可能会被\
  \ Perl 内部使用。\n\n这几乎总是表明你打错了函数、方法或属性名，或者不小心省略了变量的数据类型字符。\n\n`%s 语法正确 致命错误`\n\n使用\
  \ `-c` 命令行选项调用 Perl 以检查脚本而不执行时的最终摘要消息。\n\n`%s: 命令未找到 外部错误`\n\n你可能设置了 Perl 脚本的执行权限，但没有修改或添加合适的\
  \ shebang（`#!`）行。这导致脚本通过 shell 运行，而不是 Perl。检查 shebang 行是否正确；它应该类似于以下之一：\n\n```\n\
  #!/usr/local/bin/perl\n#!/usr/bin/perl\n#!/bin/env perl\n```\n\n`%s: 表达式语法 外部错误`\n\
  \n你可能设置了 Perl 脚本的执行权限，但没有修改或添加合适的 shebang（`#!`）行。这导致脚本通过 shell 运行，而不是 Perl。\n\n\
  ```\nAppendix A: Error Message Cross Reference 347\n```\n\n`%s: 未定义变量 外部错误`\n\n\
  你可能设置了 Perl 脚本的执行权限，但没有修改或添加合适的 shebang（`#!`）行。这导致脚本通过 shell 运行，而不是 Perl。\n\n`%s:\
  \ 未找到 外部错误`\n\n你可能设置了 Perl 脚本的执行权限，但没有修改或添加合适的 shebang（`#!`）行。这导致脚本通过 shell 运行，而不是\
  \ Perl。\n\n`(在清理中) %s 警告（杂项）`\n\n这表示当解释器调用对象的 `DESTROY` 方法时发生了错误。对于每个导致问题的对象，只列出一个这样的错误。这也可能表示在\
  \ C 内部与 Perl 解释器通信时，函数回调失败。\n\n`(上一行缺少分号？) 严重警告`\n\nPerl 对之前的错误进行了有根据的猜测，并认为可能是由于缺少分号引起的。然而，也可能是由于缺少引号、项、列表元素或括号引起的。\n\
  \n`-P 不允许用于 setuid/setgid 脚本 致命错误`\n\n你不能对具有 setuid 或 setgid 权限的脚本运行 C 预处理器。\n\n\
  `-T 和 -B 未在文件句柄上实现 致命错误`\n\n你的操作系统无法通过检查文件句柄的缓冲区来确定文件类型。你需要提供你试图打开的文件的文件名。\n\n`-p\
  \ 目标: %s 致命错误`\n\n当使用 `-p` 命令行选项处理脚本时，Perl 在尝试输出结果文件时发现了一个错误。\n\n`?+* 在正则表达式中后面没有内容\
  \ 致命错误`\n\n你可能尝试了类似这样的操作：\n\n```\ns/*//g;\n```\n\n你本意是匹配表达式中的所有文本或字面量。`*`、`+` 和\
  \ `?` 修饰符必须跟在字符或表达式定义之后；例如：\n\n```\ns/.*//g;\n```\n\n要匹配字面字符，请用反斜杠转义：`s/\\*/g;`\n\
  \n```\n348 Debugging Perl: Troubleshooting for Programmers\n```\n\n`@ 在字符串外部 致命错误`\n\
  \n你向 `unpack` 提供了一个模板，该模板引用了超出字符串限制的字符位置。\n\n`<> 应为引号 致命错误`\n\n你尝试使用 C 格式来包含文件。语句\n\
  \n```\nrequire <file.pl>;\n```\n\n应写为\n\n```\nrequire 'file.pl';\n```\n\n`accept()\
  \ 在已关闭的套接字 %s 上 警告`\n\n你尝试在已关闭的套接字上调用 `accept` 函数。要么套接字从未打开，要么在 `accept` 到达之前已关闭。\n\
  \n`分配过大: %lx 致命错误`\n\nMS-DOS 对数据和代码有 64K 的限制，而你尝试加载的脚本超过了 64K 限制。\n\n`将 %s 应用于 %s\
  \ 将对 scalar(%s) 起作用 警告（杂项）`\n\n\n\n\n你向匹配、替换或音译调用提供了一个数组或哈希。其效果是数组或哈希被解释为标量（就像提供给标量函数一样）。如果你试图对数组或哈希的每个元素执行操作，请使用循环：\n\
  \n```\nforeach (keys %hash) {\n    $hash{$_} = tr/a-z/A-Z/;\n}\n```\n\n或者使用 `map`：\n\
  \n```\nmap { s/text/string/g } @array;\n```\n\nmsgsnd 的参数太短 致命错误\n\n你向 `msgsnd`\
  \ 提供了一个过短的字符串。该字符串至少应与当前平台上长数据类型的长度相同。大多数平台使用 32 位长整型，因此你可以使用 `sprintf` 将字符串填充至\
  \ 4 个字符：\n\n```\n$message = sprintf(\"%-4s\",$string);\n```\n\n除非你确定字符串可能短于 4 字节，否则不要轻易使用带有\
  \ 4 字节格式的 `pack`——`pack` 会将字符串修剪为你指定的确切字符数；而 `sprintf` 则不会。\n\n附录 A：错误信息交叉引用 349\n\
  \n%s 的歧义用法被解析为 %s 严重警告\n\n你提供了一个 Perl 假定为函数、方法或字符串的术语。通常指向拼写错误：缺少引号、运算符或括号。\n\n\
  歧义调用被解析为 CORE::%s()，请如此限定或使用 & 警告\n\n你创建了一个与 Perl 关键字同名的函数，但在调用时未限定名称。这会导致解释器假定你想要内置版本，而不是你本地定义的函数。例如，\n\
  \n```\nsub log {\n    print STDERR \"Log: @_\\n\";\n}\nlog \"Result is \" log 5;\n\
  ```\n\n要调用真正的内置 `log`，请使用 `CORE::log`。要调用你自己的函数，请使用 `main::` 或 `package::` 完全限定它，或者在函数调用前加上\
  \ & 以确保调用的是函数。或者，使用 `subs` 编译指令预先声明该函数，或从模块中导入它。\n\n参数必须与 #! 行匹配 致命错误\n\n在使用 setuid\
  \ 模拟器以 setuid 模式运行时，命令行上提供的参数必须与 `#!` shebang 行中设置的参数匹配。问题可能出在仅支持单个开关的操作系统上，将命令行上的各个开关拆分所致。尝试合并开关——例如，将\
  \ `-w -T` 合并为 `-wT`。\n\n参数 \"%s\" 不是数字 %s 警告\n\n你向期望数值的运算符提供了一个字符串。第二个参数应包含受影响的运算符名称。例如，\n\
  \n```\n$a = 3 * 'hello';\n```\n\n会引发\n\n```\nArgument \"hello\" isn't numeric in\
  \ addition (+) at - line 1.\n```\n\n数组 @%s 在 %s() 的参数 %d 中缺少 @ 已弃用\n\n你提供了数组名称但未提供\
  \ `@` 前缀。例如，\n\n```\n$ perl -e \"push nonchalant,'hello';\"\n```\n\n未加引号的字符串 \"\
  nonchalant\" 可能与未来的保留字冲突，位于 - 第 1 行。数组 @nonchalant 在 pushQ 的参数 1 中缺少 @，位于 - 第 1\
  \ 行。\n\n350 调试 Perl：程序员故障排除\n\n断言出错：%s 内部错误\n\nPerl 自带的 `malloc` 包发生内部故障。\n\n断言失败：文件\
  \ \"%s\" 内部错误\n\nPerl 源文件中的一般断言失败。请检查指定的文件，然后考虑向 Perl 维护者报告该错误。\n\n同时赋值给列表和标量 致命错误\n\
  \n如果你赋值给条件运算符，则第二和第三个参数必须同时是标量或列表。否则，Perl 将不知道为右侧提供哪种上下文。\n\n尝试释放非 arena SV：0x%lx\
  \ 内部错误\n\n解释器在正常的 SV 定义区域之外创建了一个标量值。通常，当解释器退出时，Perl 会自动清除该区域，但这表明解释器无法这样做。\n\n尝试释放不存在的共享字符串\
  \ 内部错误\n\nPerl 维护一个引用计数的内部字符串表，以优化哈希键和其他字符串的存储和访问。此消息表明有人试图递减一个在表中已找不到的字符串的引用计数。\n\
  \n尝试过早释放临时变量 内部错误\n\n临时变量（即应被删除的变量）应由 `free_tmps()` 例程释放。此消息表明在 `free_tmps()` 例程有机会之前，其他东西正在释放\
  \ SV，这意味着当 `free_tmps()` 例程尝试释放它时，将释放一个未引用的标量。\n\n尝试释放未引用的全局指针 内部错误\n\n全局变量在符号表中的引用计数器已损坏。\n\
  \n尝试释放未引用的标量 内部错误\n\n解释器试图释放一个已被释放的标量变量所使用的内存。\n\n尝试连接自身 致命错误\n\n你试图将一个线程连接到自身，这是不可能的。请检查\
  \ `join` 调用周围的逻辑，确保指定了正确的线程。\n\n尝试将指针打包到临时值 警告\n\n你试图使用临时变量（来自函数或表达式）作为 `pack` 的模板字符串。你必须使用字面字符串或真正的变量。\n\
  \n尝试在 substr 中将引用用作左值 警告\n\n你不能将引用用作 `substr` 的第一个参数，因为它实际上是一个左值。确保在使用前解引用该变量。\n\
  \n附录 A：错误信息交叉引用 351\n\n%s 的参数长度错误，为 %d，应为 %d 致命错误\n\n你向 `msgctl`、`semctl` 或 `shmctl`\
  \ 传递了错误大小的缓冲区。请检查 C 包含文件中定义的 `msqid_ds`、`semid_ds` 或 `shmid_ds` 结构的大小。\n\n错误的转义替换模式\
  \ 致命错误\n\n你在正则表达式的替换部分提供的表达式使用了提升语句，但由于语法错误，该表达式无效。请检查括号、花括号、逗号、引号以及参数类型和数量。\n\n\
  错误的文件句柄：%s 致命错误\n\n你向期望文件句柄的运算符或函数提供了一个符号，但该符号不是文件句柄。请检查你提供的名称以及你使用的变量是否已通过 `open`\
  \ 正确填充。\n\n忽略错误的 free() 严重警告\n\nPerl 解释器试图对某个从未通过 `malloc()` 分配内存的对象调用内部的 `free()`\
  \ 函数。如果你认为该警告是误报，可以将 `PERL_BADFREE` 环境变量设置为 1。\n\n错误的哈希 内部错误\n\n某个内部哈希例程被传递了一个空\
  \ HV 指针。\n\n将数组强制转换为哈希时索引错误 致命错误\n\n用于标识内部伪哈希表中条目的索引不合法。\n\n%s:: 后的名称错误 致命错误\n\n\
  你在包名之后提供了变量的完整名称，包括类型前缀；例如，\n\n```\nprint MyPackage::$variable;\n```\n\n使用软引用时要特别小心——记住名称只在引号内插值。例如，\n\
  \n```\npackage MyPackage; $var = 99;\npackage main;\nprint \"MyPackage::$var\\n\"\
  ;\nprint \"$MyPackage::var\\n\";\n```\n\n第一行仅打印 \"MyPackage::\"，并附加了 `$var`（在此作用域中不存在）的插值。\n\
  \n352 调试 Perl：程序员故障排除\n\n忽略错误的 realloc() 严重警告 (malloc())\n\n用于重新分配变量内存的内部 `realloc()`\
  \ 函数被调用在某个从未通过 `malloc()` 分配的对象上——可以通过将环境变量 `PERL_BADFREE` 设置为 1 来禁用。\n\n数组的错误符号\
  \ 内部错误\n\n内部请求试图向非符号表条目添加数组条目。\n\n文件句柄的错误符号 内部错误\n\n内部请求试图向非符号表条目添加文件句柄条目。\n\n哈希的错误符号\
  \ 内部错误\n\n内部请求试图向非符号表条目添加哈希条目。\n\n括号放置错误 外部错误\n\n\n\n\n\n## 附录 A：错误消息交叉引用 353\n\n\
  ### 在启用 \"strict subs\" 时不允许使用裸字 \"%s\" 致命错误\n\n当使用 `strict subs` 编译指示时，不能使用裸字，除非是在调用子程序或使用\
  \ `=>` 运算符指定哈希键时。这通常表示函数名拼写错误。\n\n### 裸字 \"%s\" 指向不存在的包 警告（裸字）\n\n你使用了一个裸字来引用尚未预先声明或导入的包。\n\
  \n### 在条件语句中发现裸字 警告（裸字）\n\n编译器在期望条件运算符的位置发现了一个裸字。这通常指向函数或运算符的最后一个参数与 `||` 或 `&&`\
  \ 结合使用时的问题，例如：\n\n```\nopen FOO || die;\n```\n\n也可能表示拼写错误的常量被解释为裸字：\n\n```\nuse\
  \ constant TYPO => 1; if (TYOP) { print \"foo\" }\n```\n\n`strict` 编译指示通常会识别这些问题。\n\
  \n### BEGIN 失败——编译中止 致命错误\n\n编译器在执行 `BEGIN` 块时失败——由于这些块在编译阶段而非执行阶段执行，失败会导致解释器退出。\n\
  \n### 错误后 BEGIN 不安全——编译中止 致命错误\n\n解释器识别到了一个 `BEGIN` 块，但已经发现了多个编译错误，可能导致该块失败。\n\n\
  ### 二进制数 > 0b1111111111111111111111111111111 不可移植 警告（可移植性）\n\n你指定的二进制数大于 32 位——即\
  \ `2**32-1`（4294967295）——因此在系统之间不可移植。\n\n### 在已关闭的套接字 %s 上执行 bind() 警告\n\n你试图在已关闭的套接字上执行\
  \ `bind`。请确保检查了 `socket` 函数的返回值。\n\n### 位向量大小 > 32 不可移植 警告（可移植性）\n\n你指定的位向量大于 32\
  \ 位，这是不可移植的。\n\n### 在 %s 中异常复制 %s 内部错误\n\nPerl 检测到试图复制一个无法复制的内部值。\n\n### prime_env_iter\
  \ 中缓冲区溢出：%s 警告（内部），仅限 VMS\n\n当 Perl 准备遍历 `%ENV` 时，遇到一个过长的逻辑名称或符号定义，因此被截断为显示的字符串。\n\
  \n### 回调调用了 exit 致命错误\n\n来自外部包的子程序调用了 `exit()`。\n\n### 无法从伪块中 \"goto\" 致命错误\n\n\
  你不能使用 `goto` 跳出伪块（如 `sort`、`grep` 和 `map` 所使用的块）。\n\n### 无法 \"goto\" 到 foreach 循环中间\
  \ 致命错误\n\n你不能使用 `goto` 跳入 `foreach` 循环的中间。\n\n### 无法在循环块外使用 \"last\" 致命错误\n\n`last`\
  \ 语句只能用于退出循环生成的块（如 `while` 或 `for`/`foreach`），不能用于条件块（如 `if`）或伪块（`sort`、`map` 和\
  \ `grep`）。如果需要在这样的块中使用 `last`，请创建一个新的无名块，Perl 会将其视为单次迭代循环。例如，将\n\n```\nif ($value)\
  \ {\n    last;\n}\n```\n\n改为\n\n```\nif ($value) {\n    { last; }\n}\n```\n\n###\
  \ 无法在循环块外使用 \"next\" 致命错误\n\n`next` 语句只能用于退出循环生成的块（如 `while` 或 `for`），不能用于条件块（如\
  \ `if`）或伪块（`sort`、`map` 和 `grep`）。考虑插入一个无名块（参见上一条目）。\n\n### 无法读取 CRTL 环境 严重警告，仅限\
  \ VMS\n\nPerl 试图从 CRTL 的内部环境数组中读取 `%ENV` 的元素，但发现该数组缺失。你需要找出 CRTL 将环境放到了哪里，或者定义 `PERL_ENV_TABLES`\
  \ 以便不搜索环境。\n\n### 无法在循环块外使用 \"redo\" 致命错误\n\n`redo` 语句只能用于退出循环生成的块（如 `while` 或 `for`/`foreach`），不能用于条件块（如\
  \ `if`）或伪块（`sort`、`map` 和 `grep`）。考虑插入一个无名块（参见 \"无法在循环块外使用 'last'\" 条目）。\n\n###\
  \ 无法祝福非引用值 致命错误\n\n你只能祝福硬引用为对象——软引用不能被祝福。\n\n### 无法在该行中断 严重警告（内部）\n\n仅在使用 Perl 调试器时才会打印的警告——表示指定的行号不是可停止执行的语句位置。\n\
  \n### 无法在空包 \"%s\" 中调用方法 \"%s\" 致命错误\n\n你从一个实际上没有定义任何方法或任何类的包中调用了方法。请检查你是否在正确的对象上调用了正确的方法。你可能还想检查\
  \ `@ISA` 数组，以确保你没有从其他为空的包中继承方法。\n\n### 无法在未祝福的引用上调用方法 \"%s\" 致命错误\n\n你不能在除了经过适当祝福的对象引用之外的任何东西上调用方法。请检查你提供的变量是否确实是对象而不是引用，并且它已被适当祝福。如果你在另一个方法内部调用方法，请确保你正确捕获了对象——它应该作为函数的第一个参数提供。\n\
  \n### 无法在没有包或对象引用的情况下调用方法 \"%s\" 致命错误\n\n你试图调用一个方法，但你提供的实体不是对象引用或包名。例如：\n\n```\n\
  $object = 1; $object->parse();\n```\n\n注意，在字符串变量上调用方法时会返回不同的消息。运行\n\n```\n$object\
  \ = 'hello'; $object->parse();\n```\n\n会产生\n\n```\n### 无法通过包 \"hello\" 定位对象方法 \"\
  parse\"。文件 'Untitled'；第 2 行\n```\n\n### 无法在未定义值上调用方法 \"%s\" 致命错误\n\n你在一个包含未定义值（而非真实对象）的变量上调用了方法。这很可能是因为你在创建对象时未能检查其值。要么对新生成的对象执行简单测试：\n\
  \n```\ndie \"无法创建对象\" unless ($object);\n```\n\n要么使用 `ref` 检查返回值是否为正确的引用而非真实变量。\n\
  \n### 无法 chdir 到 %s 致命错误\n\n你通过命令行 `-x` 选项提供给 Perl 的目录不存在。如果 Perl 无法在指定目录中执行，它将不会继续。\n\
  \n### 无法检查脚本 \"%s\" 的文件系统是否 nosuid 内部错误\n\n文件系统不允许 Perl 检查 `nosuid` 设置的状态，该设置用于确定是否可执行\
  \ setuid 脚本。\n\n### 无法在 %s 中将 %s 强制转换为整数 致命错误\n\n你不能将类型 glob 和其他一些标量值类型转换为整数；你可能尝试了类似这样的操作：\n\
  \n```\n*value += 1;\n```\n\n请检查你操作的值是否正确，或者将类型 glob 转移给标量并修改它：\n\n```\n$value =\
  \ *value; $value += 1;\n```\n\n记住 `$value` 将不再是类型 glob。\n\n### 无法在 %s 中将 %s 强制转换为数字\
  \ 致命错误\n\n你不能将类型 glob 和其他一些标量值类型转换为数字。\n\n### 无法在 %s 中将 %s 强制转换为字符串 致命错误\n\n你不能将类型\
  \ glob 和其他一些标量值类型转换为字符串。\n\n### 无法将数组强制转换为哈希 致命错误\n\n你提供了一个数组，但期望的是哈希，而该数组不包含任何关于如何将键映射到数组索引的信息。只有索引\
  \ 0 处包含哈希引用的数组才能进行这种转换。\n\n### 无法创建管道邮箱 内部错误，仅限 VMS\n\n进程配额耗尽或存在其他管道问题。\n\n### 无法在\
  \ \"%s\" 中为非标量 %s 声明类 严重警告\n\n你只能在 `my` 或 `our` 声明中声明带有特定类限定符和可选属性的标量变量。\n\n###\
  \ 无法在 \"%s\" 中声明 %s 致命错误\n\n\n\n\n你只能使用 `my` 或 `our` 来指定标量、数组和哈希变量。其他变量类型不受支持。\n\
  \n### 无法对 %s 进行原地编辑：%s 严重警告（原地编辑）\n\n在处理用于原地编辑的文件时（通过 `-i` 命令行选项），无法创建新的目标文件。请检查源文件（会被重命名并可选择删除）的权限以及所在文件夹的权限，确保你有合适的权限来创建新文件。\n\
  \n### 无法在没有备份的情况下进行原地编辑 致命错误\n\n某些操作系统不允许你读取已删除但仍在打开的文件，而这是在没有备份选项的情况下进行原地编辑所采用的技巧。你需要指定备份文件的扩展名，以便文件可以被重命名并从副本中读取，而不是被删除后从副本中读取。\n\
  \n### 无法进行原地编辑：%s 将不是唯一的 严重警告（原地编辑）\n\n你的文件系统不支持超过 14 个字符的文件名，并且 Perl 在使用 `-i` 开关进行原地编辑时无法创建唯一的文件名。该文件已被忽略。\n\
  \n### 无法进行原地编辑：%s 不是普通文件 严重警告（原地编辑）\n\n你尝试在特殊文件上使用 `-i` 开关，例如 `/dev` 中的文件或 FIFO。该文件已被忽略。\n\
  \n### 无法执行 setegid！内部错误\n\n在 `suidperl` 的 setuid 模拟器中，`setegid()` 调用因某种原因失败。\n\n\
  ### 无法执行 seteuid！内部错误\n\n`suidperl` 的 setuid 模拟器因某种原因失败。\n\n### 无法执行 setuid 致命错误\n\
  \n这通常意味着普通 Perl 尝试执行 `suidperl` 来进行 setuid 模拟，但无法执行必要的文件。请检查该文件是否存在（应命名为 `sperl#####.`，其中\
  \ `####` 是版本号）并且可读。此外，你可能需要确保有足够的交换空间和/或物理内存。\n\n附录 A：错误消息交叉引用 357\n\n### 无法使用标志执行\
