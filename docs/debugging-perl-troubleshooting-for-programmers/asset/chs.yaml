  \ %s 致命错误\n\n你指定的脚本因指定原因无法打开。\n\n无法重新定义活动的排序子程序%s 致命错误\n\n你试图在`sort`函数仍处于活动状态时重新定义与其一起使用的子程序。请尝试使用：\n\
