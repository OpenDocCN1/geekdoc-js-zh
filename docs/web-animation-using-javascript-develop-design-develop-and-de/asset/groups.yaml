    \ CSS PRIMER\n\nLet's begin the first of the two animation sections of the codebase\
    \ by focusing on the element that contains the circle elements. Before diving\
    \ into the code, however, here's a primer on how 3D animation works in the browser.\n\
    \nIn order for 3D transforms to work (for example, translateZ, rotateX, rotateY),\
    \ the CSS specification requires that the perspective CSS property be set on the\
    \ element's parent. In this case, that's what the $container element is for.\n\
    \nThe greater the perspective is set to, the less distance Z-axis translations\
    \ (via CSS's translateZ) appear to move relative to their origin. In other words,\
    \ if you wanted exaggerated depth in your 3D animations, set the parent element's\
    \ perspective property to something low, such as 50px, which is in fact the value\
    \ that the container element is set to in the demo's CSS. In contrast, a higher\
    \ perspective value, such as 250px, would result in less visible movement from\
    \ the origin point for every pixel that the element's translateZ property is incremented\
    \ by."
  - "[PAGE 172]\n\nA separate and complementary CSS property prospective-origin, which\
    \ defines the angle at which the virtual camera is positioned. The virtual camera\
    \ is the peephole through which the viewer sees 3d animation unfold in the browser.\
    \ This section's code block uses jQuery's .css() function to set a perspective-origin\
    \ value on the container element that results in the camera being positioned at\
    \ the center of the page, creating a perpendicular view of the 3d animation. This\
    \ perpendicular view results in the appearance of circles flying directly towards\
    \ and away from the viewer.\n\nSpecifically, this code section sets prospective-origin\
    \ to the point on the page that's at half the browser's height and half its width—the\
    \ center point of the page. This leverages the window dimensions queried in the\
    \ Animation setup section.\n\nWith this context out of the way, let's explore\
    \ this section's code.\n\n# PROPERTIES\n\nThis section's code, reproduced below\
    \ for easy reference, creates the demo's zooming in out effect:\n\n```\n$container\n\
    \n.css(\"perspective-origin\", screenWidth/2 + \"px \" +\n  screenHeight/2 + \"\
    px\")\n.velocity(\n{\n  perspective: [ 215, 50 ],\n  opacity: [ 0.90, 0.55 ]\n\
    },\nduration: 800,\nloop: 1,\ndelay: 3250\n}););\n```\n\nWhile the prospective-origin\
    \ property is set once on the container element and thereafter left alone, the\
    \ prospective property is being animated by Velocity. This is necessary because\
    \ the intended effect of the demo is to keep the vantage point into the scene\
    \ stationary (perpendicular), but to exaggerate the de-exaggerate the distance\
    \ of the elements from the virtual camera, which is where the perspective property's\
    \ animation comes in."
- md: "\nSpecifically, this section uses Velocity to animate the perspective CSS property\
    \ to a final value of 215px from a starting value of 50px.\n\nBy passing in an\
    \ array as an animation property's value, you're forcefully specifying the final\
    \ value to animate the property toward (215px, in the case above) as the initial\
    \ value to animate from (50px, in the case above). While you certainly could have\
    \ passed the property a single integer value as is typically expected by Velocity,\
    \ the force-feeding syntax provides increased control over the property's complete\
    \ animation path.\n\nYou might be wondering, is force-feeding unnecessary since\
    \ Velocity knows how to retrieve a CSS property's starting value on its own? While\
    \ that is Velocity's standard behavior when an integer is passed in as a value\
    \ instead of an array, this isn't always a desirable behavior due to the performance\
    \ drawbacks inherent in querying the DOM for a property's starting value. What\
    \ the force-feeding syntax allows you to do is to explicitly pass in a starting\
    \ value so that Velocity can avoid querying the DOM for a property whose starting\
    \ value you already know. In other words, the 50px starting value used in the\
    \ perspective code above is the same value you initially set the element's perspective\
    \ property to in the CSS stylesheet. You're simply repeating the value here. Notice\
    \ that this same force-feeding technique is used on the element's opacity property\
    \ as well; it's animated to a final value of 0.90 from a starting value of 0.55\
    \ since that's what the property was set to in the CSS.\n\nAs discussed thoroughly\
    \ in Chapter 7, \"Animation Performance,\" DOM queries are indeed the Achilles'\
    \ heel of performant animation: the browser performs resource-intensive calculations\
    \ to determine the visual state of an element. While it's not important to determine\
    \ the demo's performance that you include this element for this performance optimization,\
    \ since the associated Velocity animation isn't being triggered repeatedly inside\
    \ a loop, it's included nonetheless to contrast force-feeding's secondary use,\
    \ which you'll learn about in this chapter.\n\nThe net effect of animating the\
    \ perspective and opacity is that all of the container's circle elements appear\
    \ to zoom in closer to the virtual camera while animating to an increased brightness\
    \ (opacity goes from 0.55 to 0.90). The opacity boost mimics the way that light\
    \ behaves in the real world: the closer the viewer is to the objects, the brighter\
    \ they appear!\n\n## OPTIONS\n\nThe final section of Container animation code\
    \ includes the options being passed into Velocity: duration, which is self-explanatory;\
    \ delay, which inserts a time-out at the start of the animation, and loop, which\
    \ loops an animation back and forth between the values defined in the properties\
    \ map and the element's values prior to the animation occurring. Specifically,\
    \ by setting loop to 2, you're telling Velocity to animate the values in properties\
    \ map, back to where they were before, then to repeat this full loop iteration\
    \ once more after a 3000ms delay.\n\n> NOTE: When delay is set alongside loop,\
    \ the delay occurs between each of the loop's alternations. Using delay creates\
    \ a pleasant pause so that the zoom-in and zoom-out effect doesn't zigzag back\
    \ and forth abruptly.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_174_0.png)\n\
    \n# CODE SECTION: CIRCLE ANIMATION\n\nThis is where things start getting interesting.\
    \ Let's take a look at the circle animation, in which you're simultaneously animating\
    \ their X-, Y-, Z-axis translations individually.\nYou're also animating their\
    \ opacity.\n\n```javascript\n***********************************\nCircle animation\n\
    ************************************\n$circles\n.appendTo($container)\n.velocity({\n\
    \  opacity: [\n    function() { return Math.random() },\n    function() { return\
    \ Math.random() + 0.1 }\n  ],\n  translateX:\n    function() { return \"+=\" +\
    \ r(-screenWidth/2.5, screenWidth/2.5) },\n    function() { return r(0, screenWidth)\
    \ },\n  translateY:\n    function() { return \"+=\" + r(-screenHeight/2.75, imageHeight/2.75)\
    \ },\n    function() { return r(0, imageHeight) },\n  translateZ:\n    function()\
    \ { return \"+=\" + r(translateZMin, translateZMax) },\n    function() { return\
    \ r(translateZMin, translateZMax) }\n}, { duration: 6000 })\n.velocity(\"reverse\"\
    , { easing: \"easeOutQuad\" })\n.velocity({ opacity: 0 }, 2000);\n```\n\n## VALUE\
    \ FUNCTIONS\n\nUnlike the static animation property values used in the previous\
    \ section (for example, [ 215, 50 ]), this section uses functions for property\
    \ values: each property is force-fed an array of start and end values that are\
    \ dynamically produced by functions. Let's briefly explore these value functions,\
    \ which are a unique feature of Velocity.\n\n> NOTE: Read more about value functions\
    \ at VelocityJS.org/#valueFunctions.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_176_0.png)\n\
    \nValue functions let you pass in as animation property values. These functions\
    \ trigger at run-time, and are called individually for each element animated in\
    \ a set. In the demo, the set in question is the circle divs within the $circles\
    \ jQuery element object. Consequently, each circle element property will be assigned\
    \ its randomized value once the animation begins. The only other way to achieve\
    \ differentiation between animation properties in a set of elements is to animate\
    \ the elements separately by looping through them, which gets messy and performs\
    \ badly. This is the benefit of value functions—you keep dynamic animation code\
    \ terse and maintainable.\n\nNotice that, to produce the randomized values, this\
    \ section of code leverages our helper function that was defined in Animation\
    \ setup. (As a reminder, the r function returns a randomized integer value constrained\
    \ by its min and max arguments.) You'll learn more about this function momentarily.\n\
    \n## OPACITY ANIMATION\n\nThe opacity property animates from and toward randomized\
    \ values. In the case of the starting value, you're giving the randomized value\
    \ a slight boost to ensure that the elements are never too close to be invisible—after\
    \ all, you want the viewer to see what you're animating! The animation of opacity\
    \ results in a scattering of circles all over the page that have varying opacities\
    \ from the very first frame. Differentiated opacities create a nice gradient effect\
    \ that adds visual richness to the demo.\n\nThis code takes advantage of force-feeding\
    \ for performance optimization: value functions are being force-fed to dynamically\
    \ generate start values for the elements that have yet to be inserted into the\
    \ DOM, which means that you're avoiding writing an entirely new code.\n\nAs discussed\
    \ thoroughly in Chapter 7, \"Animation Performance,\" DOM queries are indeed the\
    \ Achilles' heel of performant animation: the browser performs resource-intensive\
    \ calculations to determine the visual state of an element. While it's not important\
    \ to determine the demo's performance that you include this element for this performance\
    \ optimization, since the associated Velocity animation isn't being triggered\
    \ repeatedly inside a loop, it's included nonetheless to contrast force-feeding's\
    \ secondary use, which you'll learn about in this chapter.\n\nThe net effect of\
    \ animating the perspective and opacity is that all of the container's circle\
    \ elements appear to zoom in closer to the virtual camera while animating to an\
    \ increased brightness (opacity goes from 0.55 to 0.90). The opacity boost mimics\
    \ the way that light behaves in the real world: the closer the viewer is to the\
    \ objects, the brighter they appear!\n\n## TRANSLATION ANIMATION\n\nIt's time\
    \ to examine the translate, individually the circle elements' positions within\
    \ 3D space. All three axes are animating from a randomized value toward a randomized\
    \ end value. The value operator, which consists of the plus sign followed by the\
    \ equals sign (=), tells the animation engine to animate incrementally from their\
    \ starting values. In other words, the += value operator instructs the animation\
    \ engine to treat the ending value as a relative value. For easy reference, here's:\n\
    \n```javascript\n***********************************\nCircle animation\n************************************\n\
    $circles\n.appendTo($container)\n.velocity({\n  opacity: [\n    function() { return\
    \ Math.random() },\n    function() { return Math.random() + 0.1 }\n  ],\n  translateX:\n\
    \    function() { return \"+=\" + r(-screenWidth/2.5, screenWidth/2.5) },\n  \
    \  function() { return r(0, screenWidth) },\n  translateY:\n    function() { return\
    \ \"+=\" + r(-screenHeight/2.75, imageHeight/2.75) },\n    function() { return\
    \ r(0, imageHeight) },\n  translateZ:\n    function() { return \"+=\" + r(translateZMin,\
    \ translateZMax) },\n    function() { return r(translateZMin, translateZMax) }\n\
    }, { duration: 6000 })\n.velocity(\"reverse\", { easing: \"easeOutQuad\" })\n\
    .velocity({ opacity: 0 }, 2000);\n```\n\nThis code takes advantage of force-feeding\
    \ for performance optimization: value functions are being force-fed to dynamically\
    \ generate start values for the elements that have yet to be inserted into the\
    \ DOM, which means that you're avoiding writing an entirely new code.\n\nNotice\
    \ that, to produce the randomized values, this section of code leverages our helper\
    \ function that was defined in Animation setup. (As a reminder, the r function\
    \ returns a randomized integer value constrained by its min and max arguments.)\
    \ You'll learn more about this function momentarily.\n\nThe opacity property animates\
    \ from and toward randomized values. In the case of the starting value, you're\
    \ giving the randomized value a slight boost to ensure that the elements are never\
    \ too close to be invisible—after all, you want the viewer to see what you're\
    \ animating! The animation of opacity results in a scattering of circles all over\
    \ the page that have varying opacities from the very first frame. Differentiated\
    \ opacities create a nice gradient effect that adds visual richness to the demo.\n\
    \nIn the case of the X and Y axes, there's an arbitrary fudge factor (notice the\
    \ division by 2.75) reduces how spread out the elements animate. This value is\
    \ simply a creative decision; tweak it to suit your aesthetic preference.\n\n\
    In particular, the circles' movement is constrained within ranges relative to\
    \ the screen dimensions for the X and Y axes, and relative to the predefined min\
    \ and max depth values for the Z-axis. these values were set in the Animation\
    \ setup\n\n## REVERSE COMMAND\n\nAfter the primary Velocity animation call, the\
    \ chain continues with a call to Velocity's reverse command. Reverse does exactly\
    \ what it sounds like: it animates the elements back to their initial values prior\
    \ to the previous Velocity call taking place. In this unique case, since start\
    \ values have been force-fed into the previous Velocity call, those are the start\
    \ values that reverse will animate back.\n\nOne of my reasons for including the\
    \ reverse command in this demo is to extend the demo's overall animation duration\
    \ with a single line of maintainable and expressive code. (While you could double\
    \ the duration of the animation from 600ms to 12000ms, this would result in slowing\
    \ down the movement of the circles.) The convenience of the reverse command is\
    \ avoiding having to respecify—by hand—all of the animation start values. It would\
    \ have a huge mess to accomplish this manually since you would have had to first\
    \ store all of the randomly generated start values into memory so you could animate\
    \ back to them. Hence, reverse is yet another great Velocity feature that allows\
    \ the demo to accomplish a lot with just a few lines of code.\n"
  mdcn: "\n具体而言，本节使用 Velocity 将 `perspective`（透视）CSS 属性从起始值 `50px` 动画到最终值 `215px`。\n\
    \n通过将数组作为动画属性的值传入，你强制指定了要向该属性动画的最终值（在上例中为 `215px`）以及从哪里动画的初始值（在上例中为 `50px`）。虽然你完全可以给属性传递一个\
    \ Velocity 通常预期的单个整数值，但这种“强制投喂”（force-feeding）语法对属性的完整动画路径提供了更精细的控制。\n\n你可能会疑惑，既然\
    \ Velocity 知道如何获取 CSS 属性的起始值，强制投喂是否不是必要的？虽然当传入的是整数值而不是数组时，这是 Velocity 的标准行为，但由于通过查询\
    \ DOM 获取属性的起始值存在固有的性能开销，这种行为并不总是如人意意的。强制投喂语法允许你做的是：通过显式地传递一个起始值，这样 Velocity 就可以避免查询你已经知道其起始值的属性。换句话说，上述\
    \ `perspective` 代码中使用的 `50px` 起始值与你在 CSS 样式最初为元素 `perspective` 属性设置的值是相同的。你只是在这里重复了该值。请注意，同样的强制投喂技术也用于元素的\
    \ `opacity`（透明度）属性；它从起始值 `0.55` 动画到最终值 `0.90`，因为那是该属性在 CSS 中设置的值。\n\n正如第 7 章“动画性能”中彻底讨论的那样，DOM\
    \ 查询确实是高性能动画的阿喀琉斯之踵：浏览器需要执行资源密集型计算来确定元素的视觉状态。虽然为了这种性能优化而包含此元素对于判断 Demo 的性能并不重要（因为相关的\
    \ Velocity 动画并没有在循环内部被反复触发），但仍然将其包含，用以对比强制投喂的次要用途，你将在本章中学习到。\n\n动画 `perspective`\
    \ 和 `opacity` 的最终效果是，容器中所有的圆元素看起来都在在向虚拟相机缩放，同时动画到亮度增加（透明度从 `0.55` 变到 `0.90`）。透明度的提升模拟了光在现实世界中的行为方式：观察者离物体越近，它们看起来就越亮！\n\
    \n## OPTIONS（选项）\n\n容器动画代码的最后一部分包含了传入 Velocity 的选项：`duration`（持续时间），自言自会；`delay`（延迟），它在动画开始时插入一个超时；以及\
    \ `loop`（循环），它让动画在属性映射中定义的值与动画发生前的元素值之间来回循环。具体来说，通过将 `loop` 设置为 `2`，你告诉 Velocity\
    \ 将 `properties map` 中的值动画回它们之前的状态，然后在 `3000ms` 延迟后再次重复这个完整的循环迭代一次。\n\n> 注意：当\
    \ `delay` 与 `loop` 同时被设置时，延迟发生在循环每次交替之间。使用 `delay` 可以创建一个愉悦的停顿，使得缩入和放出的效果不会突兀地来回波动。\n\
    \n![](img/66399f6bc0b186cf74d5dbe299211a7c_174_0.png)\n\n# CODE SECTION: CIRCLE\
    \ ANIMATION（代码部分：圆形动画）\n\n这里开始变得有趣了。让我们来看看圆形动画，在其中你正在同时地对它们的 X、Y、Z 轴平移进行单独动画。\n\
    你还在对它们的透明度进行动画。\n\n```javascript\n***********************************\nCircle\
    \ animation\n************************************\n$circles\n.appendTo($container)\n\
    .velocity({\n  opacity: [\n    function() { return Math.random() },\n    function()\
    \ { return Math.random() + 0.1 }\n  ],\n  translateX:\n    function() { return\
    \ \"+=\" + r(-screenWidth/2.5, screenWidth/2.5) },\n    function() { return r(0,\
    \ screenWidth) },\n  translateY:\n    function() { return \"+=\" + r(-screenHeight/2.75,\
    \ imageHeight/2.75) },\n    function() { return r(0, imageHeight) },\n  translateZ:\n\
    \    function() { return \"+=\" + r(translateZMin, translateZMax) },\n    function()\
    \ { return r(translateZMin, translateZMax) }\n}, { duration: 6000 })\n.velocity(\"\
    reverse\", { easing: \"easeOutQuad\" })\n.velocity({ opacity: 0 }, 2000);\n```\n\
    \n## VALUE FUNCTIONS（值函数）\n\n与上一节使用的静态动画属性值（例如，`[ 215, 50 ]`）不同，本节使用函数作为属性值：每个属性都被强制投喂了一个由函数动态生成的起始值和结束值的数组。让我们简要探索这些值函数，它们是\
    \ Velocity 的一个特性。\n\n> 注意：在 VelocityJS.org/#valueFunctions 阅读更多关于值函数的知识。\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_176_0.png)\n\
    \n值函数允许你传入函数作为动画属性值。这些函数在运行时触发，并为集合中动画的每个元素单独调用。在 Demo 中，涉及的集合是 `$circles` jQuery\
    \ 元素对象内的圆形 `div`。因此，一旦动画开始，每个圆元素的属性都将被分配其随机值。在元素集合中实现动画属性差异的唯一其他方法是通过遍历元素来单独对它们进行动画，但这会变得非常混乱且性能很差。这就是值函数的优势——你保持了动态动画代码的简洁且易维护。\n\
    \n注意，为了产生随机值，这部分代码利用了我们在 `Animation setup` 中定义的辅助函数。（作为提醒，`r` 函数返回一个受其 `min` 和\
    \ `max` 参数限制的随机整数值。）稍后你会学习更多关于这个函数。\n\n## OPACITY ANIMATION（透明度动画）\n\n透明度属性从随机值向随机值动画。在起始值的情况下，你给随机值了一个轻微的提升，以确保元素永远不会太近而不可见——毕竟，你希望观众看到你正在制作的内容！透明度的动画导致圆形散布在整个页面上，从第一帧开始就具有不同的透明度。差异化的透明度营造出了一种良好的渐变效果，为\
    \ Demo 增了视觉丰富性。\n\n这段代码利用了强制投喂来进行性能优化：值函数正被强制投喂，以为尚未插入 DOM 的元素动态生成起始值，这意味着你避免了编写完全全新的代码。\n\
    \n正如第 7 章“动画性能”中彻底讨论的那样，DOM 查询确实是高性能动画的阿喀琉斯之踵：浏览器需要执行资源密集型计算来确定元素的视觉状态。虽然为了这种性能优化而包含此元素对于判断\
    \ Demo 的性能并不重要（因为相关的 Velocity 动画并没有在循环内部被反复触发），但仍然将其包含，用以对比强制投喂的次要用途，你将在本章中学习到。\n\
    \n动画 `perspective` 和 `opacity` 的最终效果是，容器中所有的圆元素看起来都在向虚拟相机缩放，同时动画到亮度增加（透明度从 `0.55`\
    \ 变到 `0.90`）。透明度的提升模拟了光在现实世界中的行为方式：观察者离物体越近，它们看起来就越亮！\n\n## OPTIONS（选项）\n\n容器动画代码的最后部分包含了传入\
    \ Velocity 的选项：`duration`（持续时间），自言自会；`delay`（延迟），它在动画开始时插入一个超时；以及 `loop`（循环），它让动画在属性映射中定义的值与动画发生前的元素值之间来回循环。具体来说，通过将\
    \ `loop` 设置为 `2`，你告诉 Velocity 将 `properties map` 中的值动画回它们之前的状态，然后在 `3000ms` 延迟后再次重复这个完整的循环迭代一次。\n\
    \n> 注意：当 `delay` 与 `loop` 同时被设置时，延迟发生在循环每次交替之间。使用 `delay` 可以创建一个愉悦的停顿，使得缩入和放出的效果不会突兀地来回波动。\n\
