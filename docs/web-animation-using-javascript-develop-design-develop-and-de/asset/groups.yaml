    # # Web Animation

    using JavaScript


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_195_0.png)


    # DEVELOP AND DESIGN


    **WE''VE COME A LONG WAY** since the days of flashing banner ads and scrolling
    news tickers. Today, the stunning motion design of iOS and Android dramatically
    improves a user’s experience—instead of detracting from it. Now, the best sites
    apps leverage animation to improve the feel and intuitiveness of their interfaces.
    Sites without animation are starting to feel antiquated.


    Web developer author Julian Shapiro provides you with the technical foundation
    you need to implement animation in a way that’s visually stunning and programmatically
    maintainable. Throughout, he never loses sight of keeping the balance between
    enriching a page with motion design while avoiding unnecessary flourishes.


    > Web Animation using JavaScript will give you... the insights you need to use
    animation effectively to craft compelling user experiences.

    DeSandro

    Founder of Metafizzy


    JULIAN SHAPIRO is a startup founder and a developer. His first startup, NameLayer,
    was acquired by Techstars. His current focus is advancing motion design on the
    web, and to end that he created the JavaScript animation library Velocity.js,
    which is rapidly becoming one of the most popular animation libraries. It is one
    of the most starred projects on GitHub and is dependent on many top sites, including
    Tumblr and WhatsApp. He was also awarded Stripe’s Open Source Grant for development
    on Velocity. Follow him for tweets on San Francisco. @Shapiro. He currently lives


    # READERS WILL LEARN TO:


    +   - Design sequences that ensure users stay fully engaged in tuning out

    - Leverage simple physics principles to make apps respond naturally to input

    - Exploit CSS transforms to create rich depth in animations

    - Leverage the JavaScript animation library Velocity.js to streamline animation
    programming


