    \ the power to intricately control timing that would normally have to be orchestrated\
    \ through messy callback nesting. Refer to the inline comments for details:\n\n\
    ```\n.Velocity.RunSequence(\n{ elements: $element1, properties: { translateX:\
    \ 100 },\noptions: { duration: 1000 } },\n// The following call will start at\
    \ the same time as the first\ncall since it uses the 'sequenceQueue: false' option\n\
    { elements: $element2, properties: { translateX: 200 },\noptions: { duration:\
    \ 1000, sequenceQueue: false },\n// As normal, the call below will run once once\
    \ the second call has completed\n{ elements: $element3, properties: { translateX:\
    \ 300 },\noptions: { duration: 1000 } }\n});\n```\n\n## CODE TECHNIQUE: PACKAGE\
    \ YOUR EFFECTS\n\nOne of the most common uses of motion design is fading content\
    \ in and out of view. This type of animation often consists of a series of individual\
    \ animation calls that are chained together to deliver a nuanced, multistage effect.\n\
    \n### STANDARD APPROACH\n\nInstead of simply animating the opacity of an element\
    \ toward 1, you might simultaneously animate its scale property so that the element\
    \ appears to both fade in and grow into place. Once the element is full in view,\
    \ you might choose to animate its border thickness to 1rem as a finishing touch.\
    \ If this animation were to happen multiple times across a page, and on many different\
    \ elements, it would make sense to avoid code repetition by turning it into a\
    \ standalone function. Otherwise, you'd have to repeat this non-expressive code\
    \ throughout your script.js:\n\n```\n$element\n.velocity({ opacity: 1, scale:\
    \ 1 }, { duration: 500,\neasing: \"ease-in-out\" })\n.velocity({ border: \"1rem\"\
    \ }, { delay: 200,\neasing: \"spring\", duration: 400 });\n```\n\nUnlike the sequencing\
    \ technique discussed in the previous section, the code above consists of multiple\
    \ animations that all occur on the same element. Chained animations on a singular\
    \ element constitute an effect. If you were to improve this effect by implementing\
    \ the first technique in this chapter (turning CSS classes into JavaScript objects),\
    \ you'd have to go out of your way to uniquely name each argument object for each\
    \ stage in the overall animation. Not only is it possible that these objects wouldn't\
    \ be used by other portions of the animation code due to the uniqueness of this\
    \ particular sequence, but you'd have to deal with appending integers to each\
    \ animation call's respective objects to delineate them from one another. This\
    \ could get messy, and could neutralize the organizational benefit and brevity\
    \ of turning CSS classes into JavaScript objects.\n\nAnother problem with effects\
    \ such as the one above is that the code isn't very self-descriptive—its purpose\
    \ isn't immediately clear. Why are there two animation calls instead of one? What\
    \ is the reasoning behind the choice of properties and options for each of these\
    \ individual calls? The answers to these questions are irrelevant to the code\
    \ that triggers the animation, and should consequently be tucked away.\n\n###\
    \ OPTIMIZED APPROACH\n\nVelocity's UI pack lets you register effects that you\
    \ can subsequently reuse across a site. Once an effect is registered, you can\
    \ call it by passing its name into Velocity as its first parameter:\n\n```javascript\n\
    // Assume we registered our effect under the name \"growIn\"\nelement.velocity(\"\
    growIn\");\n```\n\nThat's a lot more expressive, isn't it? You quickly understand\
    \ the code's purpose: An element will grow into view. The code remains tense and\
    \ maintainable.\n\nWhat's more, a registered effect behaves identically to a standard\
    \ Velocity call; you can pass in an options object as normal and chain other Velocity\
    \ calls onto it:\n\n```javascript\n$element\n// Scroll the element into view\n\
    .velocity(\"scroll\")\n// Then trigger the \"growIn\" effect on it, with the following\
    \ settings\n.velocity(\"growIn\", { duration: 1000, delay: 200 })\n```\n\nIf the\
    \ UI pack is loaded onto your page, an effect such as this is registered using\
    \ the following syntax:\n\n```javascript\n.$Velocity.RegisterEffect(name, {\n\
    // Default duration value if one isn't passed into the call\ndefaultDuration:\
    \ duration,\n// The following Velocity calls occur one after another,\n// with\
    \ each taking up\n// a percentage of the effect's total duration\ncalls: [\n \
    \ [ propertiesObject, durationPercentage, optionsObject ] ,\n  [ propertiesObject,\
    \ durationPercentage, optionsObject ]\n],\nreset: resetButton\n});\n```\n\nLet's\
    \ break down this template by step:\n\n- 1. The first argument is the name of\
    \ the effect. If the effect is responsible for bringing an element into view (as\
    \ in, it fades an element's opacity from 0 to 1), suffix the effect name with\
    \ \"In\".\n- 2. The second argument is an object that defines the effect. The\
    \ first property in this object is defaultDuration, which is the duration to use\
    \ if one is not passed into the call.\n- 3. The next property is the calls array,\
    \ which consists of the items. Each item in the array is a properties object,\
    \ a duration percentage (a fraction of the total duration), and an options object.\
    \ These Velocity calls occur one after another.\n- 4. Finally, the reset property\
    \ is a function that is called when the animation is complete. This is useful\
    \ if you want to reset the element's properties, such as setting its opacity to\
    \ 0 after fading it out.\n"
  mdcn: "\n如果你将这种技术与之前的技术（将 CSS 类转换为 JavaScript 对象）结合起来，你的动画代码开始变得异常优雅：\n\n```\n.Velocity.RunSequence(\n\
    { e: $element1, p: { translateX: 100, opacity: 1 }, o: slideIn.o },\n{ e: $element2,\
    \ p: { translateX: 200, opacity: 1 }, o: slideIn.o },\n{ e: $element3, p: { translateX:\
    \ 300, opacity: 1 }, o: slideIn.o }\n});\n```\n\n序列执行的益处不仅仅是表达性和可维护性；你还拥有了使用特殊的\
    \ `sequenceQueue` 选项并行运行单个调的能力。当其设置为 `false` 时，它会强制相关的调用与上一个调用并行运行。这让你让多个元素同时动画进入视野，使得单个\
    \ Velocity 序列能够精细地控制计时，而这通常需要通过混乱的回调嵌套来协调。详细信息请参考行内注释：\n\n```\n.Velocity.RunSequence(\n\
    { elements: $element1, properties: { translateX: 100 },\noptions: { duration:\
    \ 1000 } },\n// 下一个调用将与第一个调用同时开始，\n// 因为它使用了 'sequenceQueue: false' 选项\n{ elements:\
    \ $element2, properties: { translateX: 200 },\noptions: { duration: 1000, sequenceQueue:\
    \ false },\n// 像往一样，下面的调用将在第二个调用完成后运行\n{ elements: $element3, properties: { translateX:\
    \ 300 },\noptions: { duration: 1000 } }\n});\n```\n\n## 代码技巧：封装你的特效 (PACKAGE YOUR\
    \ EFFECTS)\n\n动态设计最常见的用途之一是内容的淡入和淡出。这种动画通常由一系列链式的单个动画调用组成，以实现细微、多阶段的效果。\n\n###\
    \ 标准方法\n\n与其其简单地将元素的透明度（opacity）动画到 1，你可能会同时动画其缩放属性（scale），使元素看起来既在淡入又在放大到位。一旦元素完全显示在视野中，你可能会选择将其边框厚度动画到\
    \ 1rem 作为收尾工作。如果这种动画在页面上多次发生，并在许多不同的元素上发生，那么将其转换成一个独立的函数以避免代码重复是有意义的。否则，你必须在 `script.js`\
    \ 中重复这段缺乏表达力的代码：\n\n```\n$element\n.velocity({ opacity: 1, scale: 1 }, { duration:\
    \ 500,\neasing: \"ease-in-out\" })\n.velocity({ border: \"1rem\" }, { delay: 200,\n\
    easing: \"spring\", duration: 400 });\n```\n\n与上一节讨论的序列化技术不同，上面的代码由发生在发生在元素元素上的多个动画组成。单个元素上的链式动画构成了一个特效。如果你想通过本章的第一种技术（将\
    \ CSS 类转换为 JavaScript 对象）来改进这种特效，你必须费力为整个动画中每个阶段的每个参数对象命名唯一的名称。由于这个特定序列的唯一性，这些对象可能不会被动画代码的其他部分使用，而且你必须处理为每个动画调用的相应对象附加整数以将它们区分开。这可能会变得混乱，并抵消将\
    \ CSS 类转换为 JavaScript 对象带来的组织优势和简洁性。\n\n像上述特效的另一个问题是代码不具有自描述性——它的意图并不直观清晰。为什么有两个动画调用而不是一个？为这些单个调用选择属性和选项的背后的逻辑是什么？这些问题的答案与触发动画的代码无关，因此应该被隐藏起来。\n\
    \n### 优化方法\n\nVelocity 的 UI pack 允许你注册特效，随后你可以在整个站点复用这些特效。一旦注册了特效，你就可以通过将其名称作为第一个参数传递给\
    \ Velocity 来调用它：\n\n```javascript\n// 假设我们以 \"growIn\" 的名字注册了特效\nelement.velocity(\"\
    growIn\");\n```\n\n这表达力得多，不是吗？你就能迅速理解代码的目的：元素将放大进入视野。代码保持了简洁且易维护。\n\n此外，已注册的特效的行为与标准的\
    \ Velocity 调用相同；你可以像往常一样传递一个选项对象并在其上链接其他 Velocity 调用：\n\n```javascript\n$element\n\
    // 将元素滚动到视野\n.velocity(\"scroll\")\n// 然后在其上触发 \"growIn\" 特效，并带有以下设置\n.velocity(\"\
    growIn\", { duration: 1000, delay: 200 })\n```\n\n如果 UI pack 加载到你的页面，可以使用以下语法注册此类特效：\n\
    \n```javascript\n.$Velocity.RegisterEffect(name, {\n// 如果调用中没有传递时长，默认时长值\ndefaultDuration:\
    \ duration,\n// 以下 Velocity 调用将一个接一个地发生，\n// 每个调用占据\n// 特效总持续时间的百分比\ncalls: [\n\
    \  [ propertiesObject, durationPercentage, optionsObject ] ,\n  [ propertiesObject,\
    \ durationPercentage, optionsObject ]\n],\nreset: resetButton\n});\n```\n\n让我们逐步拆解这个模板：\n\
    \n- 1. 第一个参数是特效的名称。如果该特效负责将元素引入视野（例如，它将元素的透明度从 0 淡入到 1），请在特效名称后加上 \"In\"。\n- 2.\
    \ 第二个参数是一个定义特效的对象。该对象中的第一个属性是 `defaultDuration`，即在调用中没有传递时长时使用的时长。\n- 3. 下一个属性是\
    \ `calls` 数组，它由项组成。数组中的每个项都是一个属性对象、持续时间百分比（总持续时间的比例）和一个选项对象。这些 Velocity 调用一个接一个地发生。\n\
    - 4. 最后，`reset` 属性是一个在动画完成时调用的函数。如果你想重置元素的属性（例如在淡出后将透明度设为 0），这将会非常有用。\n\n"
