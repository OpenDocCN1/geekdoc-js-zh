    \ orange\" />\n</svg>\n```\n\nThis creates two overlapping circles with identical\
    \ radii. Next, you'd animate the circles outward from their origins so that they\
    \ overlap slightly when they're animating:\n\n```\n// Move one circle toward the\
    \ left\n$(\"circleLeft\").velocity({ cx: \"-15px\" }, { easing: \"spring\" });\n\
    // Move one circle toward the right\n$(\"circleRight\").velocity({ cx: \"+15px\"\
    \ }, { easing: \"spring\" });\n```\n\nHere, the left circle is animated 15 pixels\
    \ leftward using the \"-\" operator to instruct Velocity to decrement the circle's\
    \ current value and the right circle is animated 15 pixels right. The spring easing\
    \ provides added flair by making the circles bounce away from one another with\
    \ propulsive force.\n\nSince SVG elements can listen for mouse-based events (clicks,\
    \ hovers, and so on), you could improve this demo by turning it into an example\
    \ of SVG element interaction. With the aid of jQuery and Velocity, such an implementation\
    \ could look like this:\n\n```\n$(\"svg\").on(\"mouseover mouseout\", function()\
