  mdcn: "\n\n- 弹簧物理（Spring physics）：这种缓动类型模拟了弹簧被拉伸后突然释放时的弹性行为。与定义弹簧运动的经典物理方程一样，这种缓动类型允许你传入一个包含\
    \ [ 张力, 摩擦 ] 的二维数组。较高的张力（默认：500）会增加总速度和弹力。较低的摩擦（默认：20）会增加结束时的震动速度。\n\n```javascript\n\
    $element.velocity({ width: \"100px\" }, [ 250, 15 ] });\n```\n\n- \"spring\" 是弹簧物理缓动的预定义实现，当你不想对张力和摩擦值进行反复实验时，使用它非常方便。\n\
    \n```javascript\n$element.velocity({ width: \"100px\" }, \"spring\");\n```\n\n\
    请记住，你也可以将缓动选项作为选项对象参数中显式定义的属性传递进去：\n\n```javascript\n$element.velocity({ width:\
    \ 50, easing: \"spring\" });\n```\n\n不要被可用的缓动选项数量所淹没。大多数情况下你会依赖 CSS 缓动类型和 \"spring\"\
    \ 缓动，它们适用于绝大多数动画用例。最复杂的缓动类型贝塞尔曲线（Bézier curve）通常由那些心中有特定缓动风格且不畏惧动手实践的开发者采用。\n\n\
    > 注意：本节中其余 Velocity 选项必须显式传递到选项对象中。与之前描述的不同，这些额外选项无法通过简写逗号分隔语法提供给 Velocity。\n\n\
    # 开始与完成 (BEGIN AND COMPLETE)\n\nbegin 和 complete 选项允许你指定在动画的特定点触发的函数：向 `begin`\
    \ 选项传递一个在动画开始前调用的函数；相反，向 `complete` 选项传递一个在动画完成时调用的函数。\n\n使用这两个选项时，函数在每次动画调用中会被调用一次，即使有多个元素正在动画：\n\
    \n```javascript\nvar $divs = $($div);\n$divs.velocity(\n  { opacity: 0 },\n  //\
    \ 在动画开始之前打开一个警告框\n  {\n    begin: function () { console.log(\"Begin!\"); }\n \
    \   // 在动画完成后打开一次警告框\n    complete: function () { console.log(\"Complete!\");\
    \ }\n  }\n)\n```\n\n# 回调函数 (CALLBACK FUNCTIONS)\n\n这些选项通常被称为“回调函数”（或 \"callbacks\"\
    ），因为它们在未来发生某些事件时会被“调用”。回调函数对于触发依赖于元素可见性的事件非常有用。例如，如果一个元素初始为不可见，然后向透明度 1 制作动画，那么在用户能够看到它之后，随后触发一个\
    \ UI 事件来修改新内容可能是合适的。\n\n请记住，你不需要使用回调函数来将动画彼此排队，当多个动画被分配给单个元素或一组元素时，动画会自动顺序触发。回调函数用于非动画逻辑的排队。\n\
    \n# 循环 (LOOP)\n\n将 `loop` 选项设置为整数，以指定动画在调用之前在单元格属性映射中的值与元素值之间交替的次数：\n\n```javascript\n\
    $element.velocity({ height: \"10em\" }, { loop: 2 });\n```\n\n如果元素的原始高度为 5em，那么它的高度将在\
    \ 5em 和 10em 之间交替两次。\n\n如果在循环调用中使用了 `begin` 或 `complete` 选项，它们各会被触发一次——分别在整个循环序列的最开始和结束处；它们不会在每次循环迭代时重新触发。\n\
    \n除了传递整数，你还可以传递 `true` 来触发无限循环：\n\n```javascript\n$element.velocity({ height:\
    \ \"10em\" }, { loop: 3 });\n```\n\n无限循环会忽略 `complete` 回调，因为它们不会自然结束。然而，可以通过 Velocity\
    \ 的 `stop` 命令手动停止：\n\n```javascript\n$element.velocity(\"stop\");\n```\n\n非无限循环对于需要重复链式动画代码的动画序列非常有用。例如，如果你想让一个元素上下跳动两次（可能是为了提醒用户有新消息在等待），未优化的代码看起来如下：\n\
    \n```javascript\n$element\n// 假设 translateY 开始于 \"0px\"\n.velocity({ translateY:\
    \ \"100px\" })\n.velocity({ translateY: \"0px\" })\n.velocity({ translateY: \"\
    100px\" })\n.velocity({ translateY: \"0px\" });\n```\n\n此代码更紧凑且易于维护的版本看起来如下：\n\
    \n```javascript\n// 重复（循环）此动画两次\n$element.velocity({ translateY: \"100px\" },\
    \ { loop: 2 });\n```\n\n使用此优化版本，如果你改变了关于顶部值应改变多少的想法（当前为 \"100px\"），你只需要更改代码中一处的顶部值即可。如果你的代码中有许多此类重复实例，很快就能看出循环对你的工作流有多大好处。\n\
    \n无限循环对于加载指示器非常有帮助，它们在数据加载完成之前会无限动画。\n\n首先，让元素在可见和不可见之间无限循环透明度：\n\n```javascript\n\
    // 假设 opacity 为 1（完全可见）\n$element.velocity({ opacity: 0 }, loop: true });\n```\n\
    \n随后，在数据加载完成后，你可以停止动画并隐藏元素：\n\n```javascript\n$element\n// 先停止无限循环\n.velocity(\"\
    stop\")\n// ...然后隐藏元素\n.velocity({ opacity: 0 });\n```\n\n# 延迟 (DELAY)\n\n指定毫秒级的\
    \ `delay` 选项在动画开始前插入暂停。`delay` 选项的目的是保留动画计时——而不是依赖 jQuery 的 `delay()` 函数：\n\n\
    ```javascript\n// 在制作透明度之前等待 100ms\n$element.velocity({ opacity: 0 }, { delay:\
    \ 100 });\n```\n\n你可以通过 `loop` 选项设置 `delay` 选项在循环之间创建暂停：\n\n```javascript\n//\
    \ 循环 4 次，每次之间等待 100ms\n$element.velocity({ height: \"+50px\" }, { loop: 4, delay:\
    \ 100 });\n```\n\n# 显示与可见性 (DISPLAY AND VISIBILITY)\n\nVelocity 的 `display` 和\
    \ `visibility` 选项直接对应其 CSS 属性，并接受相同的值，包括：\"none\"\"inline\"\"inline-block\"\"\
    block\"\"flex\" 等。此外，Velocity 允许使用 \"auto\"，这指示 Velocity 将显示属性设置为元素的默认值（参考：锚点和\
    \ span 默认认为 inline，而 div 和其他元素默认为 block）。Velocity 的 `visibility` 选项与其对应的属性类似，接受\
    \ \"hidden\"\"visible\" 和 \"collapse\" 值。\n\n在 Velocity 中，当 `display` 选项设置为 \"\
    none\"（或 `visibility` 设置为 \"hidden\"）时，动画完成后完成后元素的 CSS 属性将相应设置。这在实际上可以在动画完成后隐藏元素，并与降低元素的透明度结合使用非常有用。\n\
    \n```javascript\n// 将元素淡出到透明度0 然后从页面流中移除\n$element.velocity({ opacity: 0 }, {\
    \ display: \"none\" });\n```\n\n> 注意：上述代码有效地替换了 jQuery 等效\n$element\n.animate({\
    \ opacity: 0 })\n.hide();\n\n# 可见性与显示的快速回顾 (QUICK REVIEW OF VISIBILITY AND DISPLAY)\n\
    \n作为参考，CSS `display` 属性决定元素如何影响周围及包含内部元素的定位。相比之下，CSS `visibility` 属性专门影响元素是否可以被看到。如果一个元素被设置为\
    \ \"visibility: hidden\"，它将继续占据页面上的空间，但该空间将仅表现为空间隙——元素的任何部分都将不可见。如果元素被设置为 \"display:\
    \ none\"，该元素将从页面流中完全移除，其内部和周围的所有元素将填补被移除元素的空间，就像它从未存在过一样。\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_42_0.png)\n\
    \n"
