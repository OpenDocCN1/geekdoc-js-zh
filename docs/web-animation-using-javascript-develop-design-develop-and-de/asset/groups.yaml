    \n    }\n  }\n}\n```\n\n// Animate using the fast duration.\n$button.velocity(fadeIn.p,\
    \ fadeIn.o.fast);\n\n/* Animate using the slow duration. */\n$modal.velocity(fadeIn.p,\
    \ fadeIn.o.slow);\n\nIf this seems like too much overhead, and if you have few\
    \ lines of JavaScript to justify simply inlining all your animation logic, don't\
    \ feel like a bad developer for skipping this approach altogether. You should\
    \ always use whichever of abstraction best suits the scope of your project. The\
    \ takeaway here is simply that animation workflow best practices do exist if you\
