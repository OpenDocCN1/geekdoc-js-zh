    ```\n\n这段代码对句子进行 Blast 处理，选择其第三个单词（\"paused\"），将该单词淡出视图，将淡掉的单词替换为新单词（\"running\"\
    ），然后让新单词淡入视图。最终效果是句子中指示状态的关键词优雅地淡变为新单词，以提醒用户发生了变化。这是一个极其优雅的特效，仅需几行简单的代码即可实现。如果你在一个较大的文本块上多次执行此效果，可以实现一种一个消息似乎在零星地变为另一个消息的效果。\n\
    \n# 华丽的文本过渡\n\n你可以轻松地将此前使用的 `transition.fadeIn` 效果切换为 Velocity UI 插件中的其他效果。其中一些效果非常华丽，范围涵盖从\
    \ `transition.shrinkIn`（让元素缩小并进入视图）到 `transition.perspectiveDown`（让元素像合页门一样旋转进入视图）。（如既常，你特效的复杂程度应根于第3章“运动设计理论”中讨论的原则。）\n\
    \n注意：UI 插件特效完整列表（包括在线演示），请访问 Velocity.js/#UiPack。\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_111_0.png)\n\
    \n请记住，某些特效使用了 3D 变换（rotateX、rotateY 和 translateZ），这些变换对 CSS display 值为 \"inline\"\
