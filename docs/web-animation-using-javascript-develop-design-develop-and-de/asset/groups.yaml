    # a pain-free workflow is vital.'
  - "[PAGE 77]\n\nThe benefit of switching from CSS to JavaScript to segregate logic\
    \ is that your style.js file is uniquely capable of defining animation options—not\
    \ just properties. There are many ways to specify an option: one is to assign\
    \ two member properties to a parent animation object to which you assign an expressive\
    \ name. The first property on the object defines the animation's properties; the\
    \ second defines its options.\n\nIn this case, your style.js file would look like\
    \ this:\n\n```\nvar fadeIn = {\n  // p is for \"properties\"\n  p: {\n    opacity:\
    \ 1,\n    top: \"50px\"\n  },\n  // o is for \"options\"\n  o: {\n    duration:\
    \ 1000,\n    easing: \"linear\"\n  }\n};\n```\n\nIn the script.js file, you've\
    \ have:\n\n// Pass in our clean and re-usable animation objects\n$element.velocity(fadeIn.p,\
    \ fadeIn.o);\n\nPretty and clean, right? Someone skimming it would understand\
    \ its purpose, and would know where to look to modify its properties—the style.js\
    \ file. Further, the purpose of this animation is immediately evident because\
    \ you named the object appropriately, you know that the code serves to fade an\
    \ object into view. You no longer have to mentally parse animation properties\
    \ to assess the purpose of the animation.\n\nThis approach discourages you from\
    \ arbitrarily selecting options for each individual animation on a page since\
    \ there's now a bank of premade animation objects you can easily pull from. This\
    \ results in leaner code and more consistent motion design. Consistency, as you\
    \ learned in the previous chapter, is a key component of great UX."
  - "[PAGE 78]\n\nBut the best part is that this approach lends itself perfectly to\
    \ organizing your animation variations together. For example, if you typically\
    \ fade button elements into view with a duration of 1000ms, but you fade modal\
    \ windows into view with a duration of 3000ms, you can simply split your objects\
    \ object into two appropriately named variations:\n\n```\nvar fadeIn = {\n  p:\
    \ {\n    opacity: 1,\n    top: \"50px\"\n},\n  // Options object variation #1\
    \ uses a fast duration\nofast: {\n    duration: 1000,\n    easing: \"linear\"\n\
    },\n  // Variation #2 uses a slower duration\nloSlow: {\n    duration: 3000,\n\
    \    easing: \"linear\"\n}\n};\n// Animate using the fast duration.\n$button.velocity(fadeIn.p,\
    \ fadeIn.ofast);\n/* Animate using the slow duration. */\n$modal.velocity(fadeIn.p,\
    \ fadeIn.loSlow);\n```"
  - "[PAGE 79]\n\nAlternatively, you could nest \"fast\" and \"slow\" objects as children\
