    \ at invisible then animates toward an opacity of 1, it may be appropriate to\
    \ subsequently trigger a UI event that modifies the new content once users are\
    \ able to see it.\n\nRemember that you don't need to use callbacks to queue animations\
    \ onto one another, animations automatically fire sequentially when more than\
    \ one is assigned to a single element or set of elements. Callbacks are for the\
    \ queuing of non-animation logic.\n\n# LOOP\n\nSet the loop option to an integer\
    \ to specify the number of times an animation should alternate between the values\
    \ in the cell's property map and the element's values prior to the call:\n\n```javascript\n\
    $element.velocity({ height: \"10em\" }, { loop: 2 });\n```\n\nIf the element's\
    \ original height was 5em, its height would alternate between 5em and 10em twice.\n\
    \nIf the begin or complete options are used with a looped call, they are triggered\
    \ once each—at the very beginning and end of the total loop sequence, respectively;\
    \ they are not retriggered for each loop iteration.\n\nInstead of passing in an\
    \ integer, you can also pass in true to trigger infinite looping:\n\n```javascript\n\
    $element.velocity({ height: \"10em\" }, { loop: 3 });\n```\n\nInfinite loops ignore\
    \ the complete callback since they don't naturally end. They can, however, be\
    \ manually stopped via Velocity's stop command:\n\n```javascript\n$element.velocity(\"\
    stop\");\n```\n\nNon-infinite loops are useful for animation sequences that would\
    \ otherwise require the repetition of chained animation code. For example, if\
    \ you were to bounce an element up and down twice (perhaps to alert the user of\
    \ a new message awaiting them), the non-optimized code would look like this:\n\
    \n```javascript\n$element\n// Assume translateY starts at \"0px\"\n.velocity({\
    \ translateY: \"100px\" })\n.velocity({ translateY: \"0px\" })\n.velocity({ translateY:\
    \ \"100px\" })\n.velocity({ translateY: \"0px\" });\n```\n\nThe more compact and\
    \ easier to maintain version of this code would look like this:\n\n```javascript\n\
    // Repeat (loop) this animation twice\n$element.velocity({ translateY: \"100px\"\
    \ }, { loop: 2 });\n```\n\nWith this optimized version, if you have a change of\
    \ heart about how much the top value should be changed by (currently \"100px\"\
    ), you need only change the top value in one part of the code. If there are many\
    \ such instances of repetition in your code, it quickly becomes obvious how much\
    \ looping benefits your workflow.\n\nInfinite looping is tremendously helpful\
    \ for loading indicators, which typically animate indefinitely until data has\
    \ finished loading.\n\nFirst, make the loading element appear to pulsate by infinitely\
    \ looping its opacity from visible to invisible:\n\n```javascript\n// Assume opacity\
    \ starts at 1 (fully visible)\n$element.velocity({ opacity: 0 }, loop: true });\n\
    ```\n\nLater, once the data has finished loading, you can stop the animation,\
    \ then hide the element:\n\n```javascript\n$element\n// First stop the infinite\
    \ loop...\n.velocity(\"stop\")\n// ... so you can hide the element\n.velocity({\
    \ opacity: 0 });\n```\n\n# DELAY\n\nSpecify the delay option in milliseconds to\
    \ insert a pause before an animation begins. The delay option's purpose is to\
    \ retain the animation's timing entirely—as opposed to relying on jQuery's $.delay()\
