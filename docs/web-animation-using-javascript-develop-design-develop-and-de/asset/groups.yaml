    calls instead of one? What is the reasoning behind the choice of properties and
    options for each of these individual calls? The answers to these questions are
    irrelevant to the code that triggers the animation, and should consequently be
    tucked away.'
  - "[PAGE 85]\n\n# OPTIMIZED APPROACH\n\nVelocity's UI pack lets you register effects\
    \ that you can subsequently reuse across a site. Once an effect is registered,\
    \ you can call it by passing its name into Velocity as its first parameter:\n\n\
    ```\n// Assume we registered our effect under the name \"growIn\"\nelement.velocity(\"\
    growIn\");\n```\n\nThat's a lot more expressive, isn't it? You quickly understand\
    \ the code's purpose: An element will grow into view. The code remains tense and\
    \ maintainable.\n\nWhat's more, a registered effect behaves identically to a standard\
    \ Velocity call; you can pass in an options object as normal and chain other Velocity\
    \ calls onto it:\n\n```\n$element\n// Scroll the element into view\n.velocity(\"\
    scroll\")\n// Then trigger the \"growIn\" effect on it, with the following settings\n\
    .velocity(\"growIn\", { duration: 1000, delay: 200 })\n```\n\nIf the UI pack is\
    \ loaded onto your page, an effect such as this is registered using the following\
    \ syntax:\n\n```\n.$Velocity.RegisterEffect(name, {\n// Default duration value\
    \ if one isn't passed into the call\ndefaultDuration: duration,\n// The following\
    \ Velocity calls occur one after another,\nwith each taking up\na predf percentage\
    \ of the effect's total duration\ncalls: [\n  [ propertiesObject, durationPercentage,\
    \ optionsObject ] ,\n  [ propertiesObject, durationPercentage, optionsObject ]\n\
    ],\nreset: resetButton\n});\n```"
  - '[PAGE 86]


    Let''s break down this template by step:


    +   1. The first argument is the name of the effect. If the effect is responsible
    for bringing an element into view (as in, it fades an element''s opacity from
    0 to 1), it''s important to suffix the effect with "In".


    +   2. The second argument is an object that defines the effect''s behavior. The
    first property in this object is defaultDuration, which lets you specify the duration
    the full effect should take if one is not passed into the Velocity call that triggers
    the effect.


    +   3. The next property in the object is the calls array, which consists of the
    Velocity calls that constitute the effect (in the order that they should occur).
    Each of these array items is an array itself, which consists of the calls properties
    object, followed by the optional percentage of the total duration that call should
    consume (a decimal value that defaults to 1.00), followed by an options object
    for that specific call. Note that Velocity calls specified within the calls array
    accept only the easing delay options.


    +   4. Finally, you have the option of passing a reset object. The reset object
    is specified using the syntax as a standard Velocity properties map object, but
    it is used to enact an immediate value change upon completion of the full effect.
    This is useful when you''re animating the opacity and scale properties of an element
    going down to 0 (out of view), but want to return the element''s scale property
    to 1 after the element is hidden so subsequent effects needn''t worry about the
    properties beyond opacity it must reset the element for their calls to properly
    take effect. In other words, you can leverage the reset properties map to make
    effects self-contained, such that they leave no clean duties on the target elements.


    In addition to the reset object, another powerful workflow bonus of the UI pack''s
    effect registration is automatic display property toggling. When an element begins
    animating into view, you want to ensure its display value is set to a value other
    than "none" so the element is visible throughout the course of its animation.
    (Remember, display: none removes an element from the page''s flow). Conversely,
    when fading an element out, you want to ensure its display value is switched to
    "none" once its opacity hits 0. This way, you remove all traces of the element
    when you''re done using it.


    Using jQuery, display toggling is accomplished by chaining the show() and hide()
    helper functions onto animations (entimes messy buried within nested callbacks).
    With Velocity''s UI pack, however, this logic is taken care of automatically when
    you fix your effect names with "In" and "Out" as appropriate.'
  - "[PAGE 87]\n\nLet’s register two UI pack effects—one for the “In” direction and\
    \ one for the “Out” direction—and call the element “shadowIn” since it consists\
    \ of fading and scaling an element into view, then expanding its boxShadow property\
    \ outward:\n\n```\nVelocity\n.RegisterEffect(\"shadowIn\", {\ndefaultDuration:\
    \ 1000,\ncalls: [\n  { opacity: 1, scale: 1 }, 0.4 ],\n  { boxShadowBlur: 50 },\
    \ 0.6\n]\n})\n```\n\n```\n.RegisterEffect(\"shadowOut\", {\ndefaultDuration: 800,\n\
    calls: [\n// We reverse the order to mirror the \"In\"\n  { boxShadowBlur: 50\
    \ }, 0.2\n  { opacity: 0, scale: 0 }, 0.8\n]\n});\n```\n\nIf your effect’s name\
    \ ends with “Out”, Velocity will automatically set the element’s display property\
    \ to “none” once the animation is complete. Conversely, if your effect’s name\
    \ ends with “In”, Velocity will automatically set the element’s display property\
    \ to the default value associated with the element’s tag type (for example, “inline”\
    \ for anchors, “block” for div and p). If your effect’s name does not contain\
    \ one of these special suffixes, the UI pack will not perform automatic display\
    \ setting.\n\nRegistering effects not only improves your code, but also makes\
    \ it highly portable between projects and among fellow developers. When you’ve\
    \ designed an effect you love, now it’s painless to share the effect’s registration\
    \ code with others so they can use it too. Pretty neat!"
- md: "\n# DESIGN TECHNIQUES\n\nThe techniques discussed so far in this chapter will\
    \ improve your workflow during the coding phase of motion design. The techniques\
    \ covered in this section focus on the design phase, where you're still experimenting\
    \ to find the perfect animation that fits your UI. This phase requires a lot of\
    \ creativity and a lot of repetition, and is accordingly ripe for workflow improvements.\n\
    \n# TIMING MULTIPLIERS\n\nThe first design technique is to use a global timing\
    \ multiplier. This consists of sprinkling in a multiplier constant against all\
    \ of your animations' delay and duration values.\n\nStart by defining your global\
    \ timing multiplier (arbitrarily designated as M) for multiplier:\n\n```\nvar\
    \ M = 1;\n```\n\nThen, bake the multiplier into the duration and delay option\
    \ values within each animation call:\n\n```\nelement1.animate({ opacity: 1 },\
    \ duration: 1000 * M });\nelement2.velocity({ opacity: 1 }, delay: 250 * M });\n\
    ```\n\n> NOTE: if you use SASS or LESS, which provide support for variable usage\
    \ within stylesheets, this technique applies equally to CSS animations!\n\nEmbedding\
    \ a multiplier constant will help you quickly modify the M constant in one location\
    \ (presumably at the top of your style.js) in order to quickly speed up or slow\
    \ down all of the animations across your page. Benefits of such timing control\
    \ include:\n\n- Slowing animations to perfect the individual animation calls within\
    \ a complex animation sequence. When you're constantly refreshing your page in\
    \ order to tweak a multi-element animation sequence to perfection, seeing the\
    \ sequence in slow motion makes it significantly easier to assess how individual\
    \ elements interact with one another.\n\n- Speed up animations when you're performing\
    \ repetitive UI testing. When you're testing a site for purposes other than animation,\
    \ evaluating the end state of UI animations (how elements wind up) is more important\
    \ than testing the animations' motion. In these situations, it saves time and\
    \ reduces headaches to speed up all the animations across your page so you're\
    \ not repeatedly waiting for your animations to play out on each page refresh.\n\
    \nVelocity has a handy implementation of this functionality called mock, which\
    \ functions as a behind-the-scenes global multiplier so you don't have to sprinkle\
    \ it by hand. Like the example shown above, mock multiplies both the duration\
    \ and the delay values. To turn mock on, temporarily set $.Velocity.mock to the\
    \ multiplier value you want to use:\n\n```\n// Multi animation timing by 5\n$.Velocity.mock\
    \ = 5;\n// All animations are now time-adjusted\n// The duration below effectively\
    \ becomes 5000ms\n$element.velocity({ opacity: 1 }, duration: 1000 });\n```\n\n\
    Velocity's mock feature also accepts a Boolean value: setting mock to true all\
    \ durations and delays to ms, which forces all animations to complete within a\
    \ single browser timing tick, which occurs every few milliseconds. This is a powerful\
    \ shortcut for quickly turning off all animations when they're getting in the\
    \ way of your UI development and testing.\n\n# USE VELOCITY MOTION DESIGNER\n\n\
    Velocity Motion Designer (VMD) was crafted with the sole purpose of helping developers\
    \ streamline the creation phase of motion design. VMD is a bookmarklet that you\
    \ load onto a page to design animations in real time. It allows you to double-click\
    \ elements to open a modal that lets specify animation properties and options\
    \ for that element. You then hit Enter on your keyboard to watch the animation\
    \ play out immediately—without a page refresh.\n\n> NOTE: Get Velocity Motion\
    \ Designer at http://velocityjs.org/#vmd.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_90_0.png)\n\
    \nOnce you've designed all your element animations exactly the way you want them,\
    \ you can export your work into one-for-one Velocity code, which you can place\
    \ immediately into an IDE for use in production. (The resulting code is also fully\
    \ compatible with jQuery.)\n\nUltimately, VMD saves countless hours of development\
    \ time by preventing constant IDE and browser tab switching and repeated UI state\
    \ retriggering. Further, it streamlines the designer-to-developer workflow by\
    \ allowing the two teams to work alongside another in real time: with VMD, designers\
    \ can implement motion design without having to familiarize themselves with a\
    \ site's JavaScript or CSS. They can simply hand off the exported Velocity code\
    \ to the developers to integrate into the codebase at their discretion.\n\nVMD\
    \ is a highly visual tool—visit VelocityJS.org/#vmd to see the walkthrough video.\n\
    \n# WRAPPING UP\n\nAs you implement animation workflow techniques, you'll notice\
    \ the intimidating black box of motion design beginning to unfold. The beautifully\
    \ intricate loading sequences found on cutting-edge sites like Stripe.com and\
    \ Webflow.com will start to make sense to you. You'll gain confidence in your\
    \ ability to code animation sequences, and this newfound skill will reduce friction\
    \ in your development routine, making it not only easier but also significantly\
    \ more fun to accomplish your motion design goals.\n\n# CHAPTER 5\n\n# Animating\
    \ Text\n\nSince textual animation is rarely employed in webpages, using it is\
    \ an easy way to impress users. That’s precisely what makes this topic so much\
    \ fun to learn: the underlying techniques are simple to program, but the results\
    \ feel incredibly rich and complex to the user.\n\nThis chapter introduces you\
    \ to tools that remove the tedious aspects of textual animation and equip you\
    \ with an efficient workflow. Read on to learn the nuances of this dark art.\n\
