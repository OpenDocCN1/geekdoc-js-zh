  - '[PAGE 176]


    # VALUE FUNCTIONS


    Unlike the static animation property values used in the previous section (for
    example, [ 215, 50 ]), this section uses functions for property values: each property
    is force-fed an array of start and end values that are dynamically produced by
    functions. Let''s briefly explore these value functions, which are a unique feature
    of Velocity.


    > NOTE: Read more about value functions at VelocityJS.org/#valueFunctions.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_176_0.png)


    Value functions let you pass in as animation property values. These functions
    trigger at run-time, and are called individually for each element animated in
    a set. In the demo, the set in question is the circle divs within the $circles
    jQuery element object. Consequently, each circle element property will be assigned
    its randomized value once the animation begins. The only other way to achieve
    differentiation between animation properties in a set of elements is to animate
    the elements separately by looping through them, which gets messy and performs
    badly. This is the benefit of value functions—you keep dynamic animation code
    terse and maintainable.


    Notice that, to produce the randomized values, this section of code leverages
    our helper function that was defined in Animation setup. (As a reminder, the r
    function returns a randomized integer value constrained by its min and max arguments.)
    You''ll learn more about this function momentarily.


    # OPACITY ANIMATION


    The opacity property animates from and toward randomized values. In the case of
    the starting value, you''re giving the randomized value a slight boost to ensure
    that the elements are never too close to be invisible—after all, you want the
    viewer to see what you''re animating! The animation of opacity results in a scattering
    of circles all over the page that have varying opacities from the very first frame.
    Differentiated opacities create a nice gradient effect that adds visual richness
    to the demo.


    This code takes advantage of force-feeding for performance optimization: value
    functions are being force-fed to dynamically generate start values for the elements
    that have yet to be inserted into the DOM, which means that you''re avoiding writing
    an entirely new code block just to set the initial CSS states'
