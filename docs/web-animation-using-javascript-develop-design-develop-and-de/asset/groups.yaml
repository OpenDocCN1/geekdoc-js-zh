    attention.(However, consider how through repeated exposure in some countries,
    people are trained to interpret red as "stop" and green as "go", which are examples
    of socially reinforced meaning. When designing motion, take this phenomenon into
    consideration as well.)


    Diving a bit deeper into psychology, the user interprets movement toward her as
    an urgent notice that requires action, whereas she interprets movement away from
    her getting out of her way and, consequently, not requiring action.


    # MAKE INTERACTIONS  VISCERAL


    Big, squishy buttons with rich color gradients make the user want to click. Elements
    like this reward clicking with a satisfying sense of pressure exertion and color
    explosion. The lesson here is one of incentivization: the more intriguing it is
    to click a button, the more a user will it. Leverage this phenomenon for important
    calls to action that you want the user to engage with, such as buttons for registering
    a new account or checking out of a shopping cart.


    # REFLECT GRAVITAS


    If the user has taken an action with irreversible consequences, reinforce that
    notion by using motion design that feels equally important. For example, the animation
    associated with clicking a Delete button should feel more significant than the
    animation associated with hovering over a standard navigation dropdown. While
    the latter may entail a simple color change, the former might consist of a sudden
    jump in size and a thickening of the element''s border. By divying up motion design
    along a gradient of severity, you''ll help the user intuitively grasp the hierarchy
    of the available actions. This technique, along with the others detailed in this
    chapter, serves the goal of increasing user understanding and confidence.


    # REDUCE CONCURRENCY


    To some extent, users are always trying to make sense of your UI. Consciously
    or unconsciously, they ascribe meaning to every design and motion design choice
    you make. So, if you present the user with extended animation sequences consisting
    of many elements animating into view concurrently, you will compromise their ability
    to parse the meaning of all the movements taking place.


    In short, if you''re using motion design to indicate something important, make
    sure you''re not indicating many different things at once. If you are, consider
    breaking animations into steps or reducing the total animation count.'
  - '[PAGE 59]


    # REDUCE VARIETY


    Related to the best practice the fewer variations you have, the more reassured
    the user will feel that she''s a’breast of what each animation in your UI denotes.
    For example, if you use one type of animation for bringing big images into view,
    but a different type for bringing small images into view, consider consolidating
    them into one. If the differentiation between them was merely for aesthetic purposes
    rather than improving usability, you''ve successfully eliminated unnecessary complexity
    from your UI, and reinforced behavioral consistency in the process. Consistency
    leads to pattern recognition and understanding. Understanding leads to increased
    user confidence.


    # MIRROR ANIMATIONS


    A tangential aspect of limiting variety is consistency in your choice of animation
    property and option combinations. For example, if you have a modal that animates
    into view by transitioning opacity and scale, ensure the modal animates out of
    view with these two properties reverting to their original values. Don''t change
    properties of the two sides of the same coin. Doing so will make the user question
    what prompted the differentiation, and needlessly raised questions are the hallmark
    of a bad user experience.


    When working with properties that affect translation (for example, translateLeft,
    marginLeft in CSS), mirroring applies literally: if a modal animates into view
    by sliding down from the top of the page, have it animate out of view by sliding
    back up toward the top of the page. Conversely, if you were to have the modal
    animate out of view by further sliding down off the page, you''d be indicating
    to the user that the modal has been sent somewhere new as opposed to having gone
    back where it came from. Typically, you want to imply that the modal dialog has
    gone back where it came now that the user is done, say, changing account settings.
    If the user were instead sending an email, then having the modal animate down
    off the page would be contextually appropriate because it reinforces the idea
    that the email is being sent from its origin (the user) to a new location (the
    recipient).'
  - '[PAGE 60]


    # LIMIT DURATIONS


    Designers often make the mistake of letting animations run too long


    Similarly, if there''s a part of your UI—a profile image, for instance—that transitions
    into or out of view on a frequent basis due to the users interact with your page,
    be extra careful not to allow protracted durations. Seeing a piece of motion design
    unfold is nice the first time, but seeing it unfold dozens times every time user
    interacts with an app becomes burdensome very quickly—especially if the user feels
    that repeatedly waiting for the animation to play out is significantly increasing
    the overall UI wait time.


    Since it''s difficult to judge the appropriateness of your animation durations
    after seeing them play out dozens of times during testing, a good rule of thumb
    is to speed up all animations by 25 percent before you push a site live to production.
    This will help ensure that they always lean toward the faster side. (See Chapter
    4, "Animation Work-flow" for tips on how quickly time-shift your animations.)


    # LIMIT ANIMATIONS


    If removing an animation altogether doesn''t detract from the user''s understanding
    of your interface, consider dropping it and using an instant styling change in
    its place. The more animation you have throughout your UI, the more the user will
    get used to seeing them. The more she gets used to seeing them, the less attention
    she''ll pay to them, and the less likely she''ll be to differentiate between the
    different types of motion design and what each signifies.


    The vast majority of your motion design should be subtle—minor color changes on
    hovers, for example—so the few instances of grandiose motion design that do exist
    should pop to convey their intended message.'
  - '[PAGE 61]


