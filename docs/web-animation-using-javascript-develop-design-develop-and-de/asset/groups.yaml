    culprit is the img element, but there are two other ways that images can sneak
    into your pages.


    # CSS GRADIENTS


    These are actually a type of image. Instead of being pre-produced by a photo editor,
    they are produced at run-time according to CSS styling definitions, for example,
    using a linear-gradient() as the background-image value on an element. The solution
    is here to opt for solid-color backgrounds instead of gradients whenever possible.
    Browsers can easily optimize the rendering of solid chunks of color, but, as with
    images, they have to work overtime to render gradients, which differ in color
    from pixel to pixel.


    # SHADOW PROPERTIES


    The evil twins of gradients are the box-shadow and text-shadow CSS properties.
    These are rendered similarly to gradients, but instead of styling background-color,
    they effectively stylize border-color. What''s more, they have opacity falloffs
    that require browsers to perform extra compositing work because the semitransparent
    portions of the gradients must be rendered against the elements underneath the
    animating element. The solution here is the previous one: if your UI looks almost
    as good when you remove these CSS properties from your stylesheet, yourself on
    the back and never look back. Your website''s performance will thank you.


    These recommendations are simply that: recommendations. They are not performance
    practices since they sacrifice your design intentions for increased performance.
    Considered them only as last resorts when your site''s performance is poor and
    you''ve exhausted all other options.'
  - '[PAGE 154]


    # TECHNIQUE: DEGRADE ANIMATIONS\NON OLDER BROWSERS


    You don''t have to neglect supporting underperforming browsers and devices. If
    you embrace a performance-mindeded workflow from day one, you can simply provide
    them with a degraded—but completely functional—experience.


    # PROBLEM


    Internet Explorer 8—a slow, outdated browser—is dying in popularity. But Internet
    Explorer 9, its successor, is still widely used outside of the Americas. Further,
    older Android smartphones running Android 2.3.x and below, which are slow relative
    to the latest-generation Android and iOS devices, remain tremendously popular.
    Of of every ten users to your site, expect up to three of them to fall into one
    of these two groups (depending on the type of users your app attracts). Accordingly,
    if your site is rich in animation and other UI interactions, awesome will perform
    especially poorly for up to a third of your users.


    # SOLUTION


    There are two approaches to addressing the performance issue raised by weaker
    devices: either broadly reduce the occurrence of animations across your entire
    site, or reduce them exclusively for the weaker devices. The former is a ultimately
    product decision, but the latter is a simple technical decision that is easily
    implemented if you''re using the global animation multiplier technique (or Velocity''s
    equivalent mock feature) explained in the Chapter 4, "Animation Workflow." The
    global multiplier technique lets you dynamically alter the timing of animations
    across your entire site by setting a single variable. The trick then—whenever
    a weak browser is detected—is to set the multiplier to o (or set $.Velocity.mock
    to true) so that all of a page''s animations complete within a single animation
    tick (less than 16ms):


    ```

    // Cause all animations to complete immediately

    $.Velocity.mock = true;

    ```'
- md: '

    The result of this technique is that weaker devices experience UI animations that
    degrade so that instant style changes replace your animated transition. The benefits
    are significant: your UI will perform noticeably more smoothly without resource-intensive
    animations occurring on your page. While this technique is undoubtedly destructive
    (it compromises your motion design intentions), an improvement in usability is
    always worth a reduction in elegance. After all, users visit your app to accomplish
    specific goals, not to admire how clever your UI work is. Never let animations
    get in the way of user intentions.


    If you''re still irked by the notion of stripping animations from your UI, keep
    in mind that users on weaker devices are accustomed to websites behaving slowly
    for them. So, if your site bucks the trend in a constructive way, they''ll be
    especially delighted by it and will be more likely to continue using it.


    ## FIND YOUR PERFORMANCE THRESHOLD EARLY ON


    Continuing from the previous technique''s theme, it''s worth stressing that the
    advice in this chapter is especially relevant for mobile devices, many of which
    are slow relative to desktop computers. Unfortunately, we, as developers, often
    fail to consider this in our workflows: we routinely create websites within the
    pristine operating environments of our high-end desktops, which are likely running
    the latest-generation hardware and software available. This type of environment
    is divorced from the real-world environments of users, who are not only using
    outdated hardware and software, but tend to have many apps and browser tabs running
    simultaneously. In other words, most of us work in development environments that
    are non-representationally high-performance! The side effect of this oversight
    is that your app may actually be noticeably laggy for a significant portion of
    your users. By the time you awake what frustrates them, they may already lost
    interest in using it.


    The correct approach for a performance-minded developer is to determine the performance
    threshold early on in the development cycle. While developing your app, check
    its performance frequently on reference devices, which might include a last-generation
    mobile device plus a virtual machine running Internet Explorer 9. If you set a
    performance goal early on of being performant on your reference devices, then
    you can sleep soundly knowing that all newer devices will deliver even better
    performance for your users.


    > TIP: If you''re a Mac user, visit Microsoft''s Modern.ie website for information
    on how to run free virtual copies of old Internet Explorer versions.


    If you find a reference device is too weak to power the motion design that you
    insist your app has, follow the advice from the previous technique: gracefully
    degrade animations on that reference device, and choose a faster device as your
    new (non-degraded) reference.


    For each testing device, remember to open several apps and tabs at once so you
    simulate users'' operating environments. Never test in a vacuum in which the only
    app running is your own.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_156_0.png)


    Keep in mind remote browser testing (through services such as BrowserStack.com
    and SauceLabs.com) is not the same as live reference device testing. Remote testing
    services are appropriate for testing for bugs and UI responsiveness—not for animation
    performance. After all, the test devices running in the cloud aren''t using real
    hardware—they are emulated versions of devices. Consequently, their performance
    is typically different than that of their real-world counterparts. Furthermore,
    the lag time between what occurs on the virtual machine and what''s displayed
    on your browser window is significant to get a meaningful gauge of UI animation
    performance.


    In short, you''ll need to go out and buy real devices for performance testing.
    Even if you''re a cash-strapped developer, don''t skimp on this. The few hundred
    dollars you spend on test devices will be offset by the increased recurring revenue
    you''ll generate from happier users engaging more frequently with your buttery-smooth
    app.


    If you wind up with a handful of reference devices, also consider purchasing Device
    Lab, a versatile stand that props up all of your mobile devices on a single surface
    so you can easily eyeball the screens during testing. As a bonus, the device includes
    a nifty app that lets you control all the browsers across your devices at once
    so you don''t have to manually refresh each browser tab.


    > NOTE: Visit Vanamco.com to purchase and download Device Lab.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_157_0.png)


    ## find your threshold early.


    ## VISIT EBAY TO BUY OLD DEVICES FOR CHEAP


    Purchasing the most popular Android and iOS devices from each of these products''
    major release cycles will give you a broad cross-section of the hardware and software
    environments that your users have. Here''s my recommended setup (as of early 2015):


    - iPhone 4 or iPad 2 running iOS

    - iPhone 5s (or newer) running the latest version of iOS

    - Motorola Droid X running Android 2.3.x

    - Samsung Galaxy S3 running Android 4.1.x

    - Samsung Galaxy S5 (or newer) running the latest version of Android


    You''re welcome to substitute any of the Android devices for devices of similar
    performance. What''s important here is that you''re using one device from each
    major Android release cycle (2.3.x, 4.1.x, and so on) so that you have a representative
    sample of the web browser performance from each one. Refer to http://developer.android.com/about/dashboards
    for a distribution of the most popular Android versions.


    ## WRAPPING UP


    Performance affects everything. From how many devices can run your app, to the
    quality of the user experience, to the perception of your app’s technical competency,
    performance is a major tenet of professional web design. It’s not a "nice-to-have,"
    it’s a fundamental building block. Don’t relegate performance as a simple optimization
    to be made in hindsight.


    ## CHAPTER 8


    ## Animation Demo


    It''s time to get your hands dirty! This final chapter walks you through a full
    animation demo powered by Velocity. In going through the demo''s source, you''ll
    learn how Velocity''s core features complement one another to greatly improve
    UI animation workflow. This demo will also introduce you to advanced techniques
    for working with CSS''s transform properties, which are vital to web-based animation
    today.


    In short, you''re going to put together the skills you''ve accumulated throughout
    this book to make something really darn cool. Your goals in coding the demo are
    twofold: use terse and expressive animation code, and ensure maximum performance.


    ## BEHAVIOR


    The demo consists of 250 circles floating in, out, and around the screen. Periodically,
    you''ll zoom in, then back out to the position where the camera started. The first
    image presented momentarily shows a zoomed-in view.


    NOTE: Before you continue reading, head on over to VelocityJS.org/demo.html to
    see a live preview of the demo.

    (You can right-click anywhere on the page then choose "View Source" to see the
    demo''s code.)


    The circle elements are simple normal divs with box-shadow and border-radius in
    CSS. There''s no WebGL or Canvas animation going on—just HTML element manipulation.
    (Given the volume of elements that are being animated at once, it''s quite impressive
    that this demo is capable of running smoothly in the DOM!)


    Let break down the animation: It consists of div translating along the X, Y and
    Z axes. The Z-axis dictates the depth of each element animation, whereas X and
    Y provide the general flow, 2D movement across the screen. Concurrent to the elements''
    individual movements is a larger perspective shift that occurs on the element
    containing all these divs. This perspective shift occurs every 3 seconds, and
    it creates a periodic zooming effect that makes the viewer feel as if he''s briefly
    traveling through the circles'' 3 space.


    The second graphic depicts the 3D scene in its zoomed-out view. Contrast with
    the zoomed-in view shown in the first image.


    ## HOW TO DOWNLOAD THE CODE SAMPLE


    The code behind this animation demo is available for download from peachpit.com.

    Here''s how to get it:


    1. Go to www.peachpit.com/register and create or log in to your account.

    2. Enter the book''s ISBN (978-0-13-409670-4) and click Submit.

    3. Your "My Registered Products" page opens. Find the listing for this book, and
    click "Access Bonus Content."

    4. The page containing the download link opens—click to access the Animation Demo
    file titled WebAnimationJS_DemoCodesSample.zip.

    '
