    </body>\n</html>\n```\n\nWhen using jQuery and Velocity together, include jQuery\
    \ before Velocity. \nThat's it! Now you're ready to roll.\n\n# USING VELOCITY:\
    \ BASICS\n\nTo get oriented to Velocity, we'll start with the basic components:\
    \ arguments, properties, and chaining. Since jQuery is ubiquitous, it is also\
