    # ELEGANCE


    The line between frivolous and consequential motion design is an easy one to discern:
    does a particular piece of motion design satisfy one of the best practices discussed
    in the “Utility” section of this chapter? If not, remove it. It''s frivolous,
    and it''s jeopardizing the usability of your UI.


    # DON''T BE FRIVOLOUS


    To hone your judgment about what is frivolous, download the most popular apps,
    play with each extensively, and judge whether they feature animation to a greater
    or lesser extent than your app does. Pay close to attention to what each animation
    conveys, and why it conveys it. If you feel that these apps use animation to a
    much lesser extent than yours does, consider backing the motion design in your
    UI.


    There''s one exception to this don''t-be-frivolous mantra—read on!


    # YOUR ONE OPPORTUNITY TO BE FRIVOLOUS


    A page''s loading sequence—when all of your elements animate into view from an
    initial state of invisibility—is your opportunity to be over-the-top and frivolous
    with your animations. Why? Because this sequence happens only once, and it won''t
    repeatedly get in the way of the user''s interaction with your site. Also, this
    is your moment to leverage your motion design skills to deliver a great first
    impression on your site.


    If you have a really cool idea for animating your content into view, do it here.
    But be sure to respect all the other rules in this chapter, especially limiting
    durations.


    # CONSIDER PERSONALITY


    If you were designing a corporate site, you wouldn''t use a bounce effect to transition
    elements into view. Bounciness is playful—not that corporate sites often want
    to convey. And if you were designing an educational or government app, you wouldn''t
    use easings that result in movement that starts very quickly before finishing
    very slowly (thereby conveying a whizzing-by-your-face futuristic slickness)—these
    would probably be too glossy and stylized for the content at hand.'
- md: '

    Always it be considerate of the personality expressed by your animation decisions.
    As a designer, it''s hard to judge the tone of your own work, so it''s a good
    idea to get third-party feedback early and often. Ask test users whether a UI
    feels professional, friendly, and sleek, and tweak your motion design according
    to your preference for each of these three traits.


    ## GO BEYOND OPACITY


    The most common means of transitioning an element into or out of view is to animate
    its opacity from 0 to 1, and vice versa. This can be rather boring. Opacity is
    just the base property that is to be animated when displaying or hiding content—it''s
    not the only property. You can spice up your property choices by scaling an element
    down view, sliding it out of view, or changing its background color. As you add
    more properties to an animation, consider leveraging multistep effects, which
    you''ll learn about in the next technique.


    ## BREAK ANIMATIONS INTO STEPS


    The simplest path to professional-looking motion design is to break animations
    into multistep effects. For example, if you''re animating an image view by transitioning
    its opacity and scale from 0 to 1, instead consider first animating the element''s
    opacity to 0.5—half of its final value—followed by animating its scale from 0
    while simultaneously animating the remaining half of properties into steps like
    this removes the linearity that''s common to most amateur motion design on the
    web—wherein all properties animate perfectly in sync. In the real world, the properties
    of objects in motion do not all accelerate in sync: Consider how, when a bird
    flies, it moves forward (translate) at a different rate than it moves up and down
    (translate). If it were to move linearly in both of its X and Y axes, it would
    look more like a bullet than an animal. Great motion design borrows from the movement,
    breathing things because UIs are for humans—not machines and humans like to feel
    expression and reaction.


    If you pay attention to the futuristic UI animation depicted in movies, you''ll
    notice that intricate multistep animations are a key component in making them
    look sleek. The reason for this is simple, and it further supports the case for
    avoiding linearity: humans are attracted to variety and contrast. Consider how,
    when you break up an animation, you''re contrasting and juxtaposing the individual
    components of that animation against each other. Just like layering clothing to
    create pleasant color and texture combinations, you should layer animations to
    create pleasant motion design combinations.


    For advice on the technical implementation of multistep effects, read Chapter
    4,

    "Animation Workflow."


    ## STAGGER ANIMATIONS


    When multiple sibling elements—say, a series of images in a gallery—are animating
    view at the same time, consider adding a tiny successive delay between them. (That
    is, after the first image loads, a delay occurs before the second image loads,
    and so on.) To delay the animation of sibling elements in this way is called staggering,
    and its purpose is similar to that of breaking animation into steps: it adds visual
    layering by preventing all your elements from animating perfectly in sync, which
    can look plain and inelegant compared to staggered loading. Why? Because animating
    a series of elements in sync lacks any semblance of granularity or radiance. Consider
    this: Birds don''t fly side by side in a straight line. What makes their aerial
    movements so graceful is their successive formation and timing. It''s their juxtaposition,
    and the motion of their juxtaposition, that makes them so elegant to the human
    eye.


    ## FLOW FROM THE TRIGGERING ELEMENT


    If clicking a button causes a modal to appear, have the modal animate out from
    the button''s location. In other words, have animations flow from the elements
    that trigger them. This bridges the cause-and-effect relationships in your UI,
    making individual elements feel better coupled and better organized.


    To understand the psychological benefit of this technique, consider how motion
    works in the real world: when you pull a lever, a series of mechanical parts causes
    a connected object to move. Connected is the key word: real objects don''t move
    unless a force is exerted upon them. Likewise, it''s important to treat every
    element in your UI as an element capable of exerting its own force. Every action
    should feel connected to a trigger. This sort of seamless experience is what helps
    an interface transcend from the digital into the physical. The more physical an
    interface is, the more responsive and emotive it feels.


    ## USE GRAPHICS


    Make use of scalable vector graphics (SVG) to animate individual graphic components
    of a larger element that the user can interact with (learn more in Chapter 6,
    "Scalable Vector Graphics Primer"). A common example of this is the trio of horizontal
    lines that constitute a "hamburger menu" icon, or the dots that form a circle
    in a loading indicator. In both of these, arbitrary shapes are grouped together
    to form a common UI component. Before SVG animation was possible on the web, the
    common approach to animating a graphic like either of the two described was to
    embed the full graphic as a PNG image then animate the entire shape by transitioning
    its opacity in CSS. By leveraging SVG, however, you can animate these unique elements
    on an individual shape-by-shape basis and subject them to many types of property
    animations.


    Graphic animation is a surefire way to add nuance to key portions of your UI.
    This nuance is partially a result of the fact that web-based animation primarily
    deals with solid, rectangular shapes. (Sometimes they have rounded corners, but
    the shapes nonetheless remain solid and whole.) Animating the individual shapes
    of an element instead lets you delight the user with motion design that she might
    not have realized even possible.


    Beyond novelty, you can uniquely leverage SVG animation to transform shapes into
    brand-new ones. Pairing this with the techniques for previewing outcomes and flowing
    from the triggering element, you can use graphic transformations to indicate UI
    behavior and provide feedback to the user. For example, if hovering over the dots
    in a loading indicator causes dots to rearrange themselves into an X, that indicates
    clicking the status indicator would cancel the loading of content.


    ![img/66399f6bc0b186cf74d5dbe29921a7c_66_0.png]


    ## EXPERIMENT REPEATEDLY


    Finding the right duration, stagger, easing, and property combinations for each
    animation is not a skill that designers are born with. It''s a skill that every
    great designer has had to learn. So, remember: your first attempt at a combination
    of properties might look good, but it''s probably not the best case. There are
    only two ways to find the best case: experiment by systematically changing each
    factor in the motion design equation until you stumble onto something sublime,
    or borrow ideas from others'' work. Once you''ve found a combination you like—even
    if it''s one you''ve already borrowed elsewhere—experiment further. Consider cutting
    the duration in half, switching to a completely different easing type, or swapping
    out a property.


    Designers are often averse to extended experimentation—even though there are a
    million ways to animate a button into view—each way effectively fulfils the goal
    at hand: making the button visible. Consequently, once you stumble onto a combination
    of properties that look good, you''re likely to stick with it because it looks
    good and it works. But don''t forget that goodness isn''t a respectable design
    goal—greatness entails stepping outside your comfort zone, and not necessarily
    relying on what you already know works.


    ## WRAPPING UP


    Utility and elegance are your goals. At minimum, all animation code must fulfill
    one or the other.


    When implemented properly, animation code should provide concrete value to your
    UX and not adversely impact the website''s performance. No matter how sleek your
    motion design is, if the interface is laggy as a result of its implementation,
    the overall user experience will not be elegant. You''ll learn more about the
    importance of performance in the Chapter 7, "Animation Performance."

    '
  mdcn: '


    始终要考虑到你的动画决策所传达的个性。作为设计师，很难判断自己作品的基调，因此尽早且频繁地获取第三方反馈是一个好主意。询问测试用户 UI 感觉是专业的、友好的还是流畅的，并根据你对这三个特征的喜好来调整你的动效设计。


    ## 超越透明度


    将元素进入或离开视图的最常见过渡方式是将其透明度（opacity）从 0 动画到 1，反之亦然。这可能相当无聊。透明度只是在显示或隐藏内容时进行动画的基础属性——它并不是唯一的属性。你可以通过缩小元素以离开视图、将其滑出视图或更改其背景颜色来让你的属性选择更加丰富。当你向动画中添加更多属性时，请考虑利用多步效果，你将在下一个技巧中学习到这些内容。


    ## 将动画拆分为步骤


    实现专业感运动设计的最简单路径是将动画拆分为多步效果。例如，如果你正在通过将透明度和缩放从 0 切换到 1 来制作图像视图，不如考虑先将元素的透明度动画到
    0.5（其最终值的一半），随后将缩放从 0 开始动画，同时将剩余的一半属性分步动画化。这种方法消除了网络上大多数业余运动设计中常见的线性感——即所有属性完美地同步动画。在现实世界中，运动物体的属性并非同步加速的：考虑一下鸟在飞行时，它向前移动（平移）的速度与它上下移动（平移）的速度不同。如果它在
    X 和 Y 轴上都线性运动，它看起来会更像一颗子弹而不是动物。伟大的动效设计借鉴了生物的运动和呼吸，因为 UI 是为人类设计的，而不是机器，而人类喜欢感受到表达和反应。


    如果你注意电影中描述的未来感 UI 动画，你会发现复杂的多步动画是使其看起来流畅的关键组件。其原因很简单，这进一步进一步支持了避免线性的论点：人类被多样性和对比所吸引。考虑一下，当你拆分一个动画时，你正在将该动画的各个组件相互进行对比和并列。就像层穿衣服来创造愉悦的色彩和纹理组合一样，你应该分层动画来创造愉悦的运动设计组合。


    关于多步效果技术实施的建议，请阅读第 4 章，“动画工作流”。


    ## 交错动画


    当多个兄弟级元素（例如，画廊中的一系列图像）同时显示视图时，请考虑在它们之间添加微小的连续延迟。（也就是说，在第一张图片加载后，在第二张图片加载之前出现一个延迟，依此类推。）以这种方式延迟兄弟级元素的动画被称为“交错”（staggering），其目的与将动画拆分为步骤相似：它通过防止所有元素完美同步动画来增加视觉层次感，与交错加载相比，同步动画看起来可能很平淡且不优雅。为什么呢？因为同步动画一系列元素缺乏任何细粒度或光彩。考虑一下：鸟类并不是并排成直线飞行的。让它们的空中动作如此优雅的是它们连续的阵型和时机。正是由于这种并列以及这种并列的运动，让它们在人类眼中是如此优雅。


    ## 流源于触发元素


    如果点击按钮会导致模态框出现，让模态框从按钮的位置动画出来。换句话说，让动画从触发它们的元素流出。这桥接了你 UI 中的因果关系，让单个元素感觉耦合更紧密、组织得更好。


    要理解这种技术的心理益处，请考虑现实世界中运动是如何工作的：当你拉动杠杆时，一系列机械零件会导致连接的物体移动。“连接”是关键词：除非对物体施加了力，否则真实的物体不会移动。同样，将你
    UI 中的每个元素视为能够施加自身力量的元素也是重要的。


    '
