  mdcn: '


    当涉及到 JavaScript 动画计时控制时，不仅仅是反转：JavaScript 还允许你全局地减慢或加速所有运行中的 JavaScript 动画。你目前将在第
    4 章“动画工作流”中学习更多关于这一强大的功能。


    # 基于物理的运动


    物理学在运动设计中的实用性反映了让网站拥有优佳用户体验（UX）的核心原理：界面能够根据用户的输入自然地流动。换句话说，界面要向现实世界中物体运动的方式致敬。


    作为对基于物理运动的一个简单而强大的介绍，Velocity 提供了一种基于弹簧物理的缓动（easing）类型。（我们将在下一章中充分探索缓动的概念）。对于典型的缓动选项，你传入一个对应预缓动曲线的字符串（例如
    "ease" 或 "easeInOutSine"）。相比之下，弹簧物理缓动类型接受一个包含两个元素的数组。


    ```

    // 使用 500 张力单位和 20 摩擦单位的弹簧物理缓动

    // 将元素的宽度动画到 "500px"

    $element.velocity({ width: "500px" }, { easing: [ 500, 20 ] });

    ```


    缓动数组中的第一个元素代表模拟弹簧的张力（tension），第二个元素代表摩擦（friction）。较高的张力值会增加动画的总速度和弹弹性。较低的摩擦值会增加动画末尾的震动速度。通过调优这些值，你可以为页面上的每个动画提供独特的运动特征，这有助于强化它们个体行为之间的差异。


    # 可维护的工作流


    设计动画是一个实验性的过程，需要反复调整计时和缓动值以实现整个页面的统一感。不可避免的是，当你完善了设计时，客户会提出重大更改。在这些情况下，可维护的代码变得至关重要。


    这种工作流问题的 JavaScript 解决方案非常优雅，将在第 4 章“动画工作流”中深入介绍。目前，这里有一个简短的解释：有些技术可以将单个 JavaScript
    动画链联起来——它们的持续时间、缓动等各不相同——使得一个动画的计时不会影响另一个。这意味着你可以更改单个持续时间而无需重新计算，并且你可以返回并轻松地设置动画并行运行或顺序执行。


    # 总结


    在 CSS 中设计动画时，你本质上受限于 CSS 规范提供的功能。在 JavaScript 中，由于编程语言的本质，第三方库对运动设计具有无限的逻辑控制能力。动画引擎利用这一点提供了强大的功能，极大地改进了工作流并扩展了交互式运动设计的可能性。这正是本书的核心所在：以尽可能高效的方式设计精美的动画。


    下一章将解释如何使用本书选择的 JavaScript 动画引擎：Velocity.js。通过掌握 Velocity.js，你将理解如何利用我们刚刚介绍的功能以及许多其他功能。


    # 第 2 章


    # 使用 Velocity.js 制作动画


    在本章中，你将学习 Velocity.js 提供的功能、命令和选项。如果你熟悉基于 jQuery 的动画，你已经知道如何使用 Velocity；它的功能与
    jQuery 的 $.animate() 函数几乎相同。


    但无论你现有的知识如何，本章中系统的功能拆解都将向你介绍动画引擎行为的细微差别。掌握这些细微差别将帮助你从新手变为专业人士。即使你已经对 JavaScript
    动画和 Velocity.js 了如指掌，也请帮个忙浏览一下这一章。你一定会发现一些你从未意识到可以做到的事情。


    # JavaScript 动画库的类型


    JavaScript 动画库有很多类型。有些在浏览器中模拟物理相互作用。有些让 WebGL 和 Canvas 动画更易维护。有些专注于 SVG 动画。有些改进
    UI 动画——后一种类型是本书的重点。


    两个流行的 UI 动画库是 GSAP（在 GreenSock.com 下载）和 Velocity（在 VelocityJS.org 下载）。你在整本书中将使用
    Velocity，因为它在 MIT 许可证下是免费的（GSAP 根据网站的业务模式需要支付许可费用），此外，它在编写简洁且具表现力的动画代码方面拥有极其强大的功能。它被应用在许多热门网站上，包括
    Tumblr、Gap 和 Scribd。


    噢，它是由本书的作者的！


    # 安装 JQUERY 和 VELOCITY


    你可以从 jQuery.com 下载 jQuery，从 VelocityJS.org 下载 Velocity。要在你的页面上使用它们——就像使用任何 JavaScript
    库一样——只需在页面的 <body> 标签之前包含指向相应库的 <script></script> 标签即可。如果你链接的是预托管的库版本（而不是计算机上的本地副本），你的代码可能像所示：


    ```html

    <html>

    <head>我的页面</head>

    <body>

    我的内容。

    <script src="//code.jquery.com/jquery-2.1.1.min.js"></script>

    <script src="//cdn.jsdelivr.net/velocity/1.1.0/velocity.js"></script>

    </body>

    </html>

    ```


    将 jQuery 和 Velocity 结合使用，请在 Velocity 之前包含 jQuery。

    就是这样！现在你准备好开始了。


    # 使用 VELOCITY：基础


    为了熟悉 Velocity，我们将从基础组件开始：参数、属性和链式调用。由于 jQuery 无处不在，查看 # VELOCITY AND JQUERY 也同样重要。


    Velocity 接受多个参数。它的第一个参数是一个将属性映射到所需值的对象。


    > 提示：在 JavaScript 中，如果你提供的值包含字母，请将该值放在引号中。


    ```

    // 使用 500 张力单位和 20 摩擦单位的弹簧物理缓动

    // 将元素的宽度动画到 "500px"

    $element.velocity({ width: "500px" }, { easing: [ 500, 20 ] });

    ```


    还有一种简写语法：不需要传入对象作为第二个参数，可以使用逗号分隔的语法。这涉及到以任何顺序列出时长（接受整数值）、缓动（字符串值）和完成（函数值）。


    ```javascript

    // 以持续时间为 1000ms 执行动画（并隐式使用默认

    // 缓动值 "swing"）

    $element.velocity({ top: 50 }, 1000);

    ```


    ```javascript

    // 以 1000ms 的持续时间和 "ease-in-out" 缓动执行动画

    $element.velocity({ top: 50 }, 1000, "ease-in-out");

    ```


    ```javascript

    // 以 "ease-out" 缓动执行动画（并隐式使用默认

    // 持续值 400ms）

    $element.velocity({ top: 50 }, "ease-out");

    ```


    ```javascript

    // 以 1000ms 的持续并在动画完成后

    // 回调函数

    $element.velocity({ top: 50 }, 1000, function() { alert("完成."); });

    ```


    这种简写语法是在只需要指定基础选项（时长、缓动完成）时传递动画选项的快速方法。如果你传入了这些以外的动画选项，则必须将所有选项切换到对象语法。因此，如果你想指定延迟选项，请更改以下语法：


    ```javascript

    $element.velocity({ top: 50 }, 1000, "ease-in-out");

    ```


    ```javascript

    // 重新指定上述的动画选项，但包含 500ms 的// 延迟值

    $element.velocity({ top: 50 }, { duration: 1000, easing: "ease-in-out" },

    delay: 500);

    ```


