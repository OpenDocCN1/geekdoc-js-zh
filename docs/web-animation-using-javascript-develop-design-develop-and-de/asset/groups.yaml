  - '[PAGE 43]


    Note that, instead of removing an element from the page''s flow, you can simply
    mark the element as invisible and non-interactive by setting its visibility to
    "hidden". This is useful for when you want a hidden element to continue taking
    up space on the page:


    ```

    // Fade an element to opacity:0 then make it non-interactive

    element.velocity({ opacity: 0 }, visibility: "hidden" });

    ```


    Now, let''s consider animations in the opposite direction (showing elements of
    hiding elements): When display or visibility is set to a value other than "none"
    or "hidden", the value is set *before* the animation begins so the element is
    visible throughout the duration of the ensuing animation. In other words, you''re
    undoing the hiding that occurred when the element was previously removed from
    view.


    Below, display is set to "block" before the element begins fading in:

    $element.velocity({ opacity: 1 }, { display: "block" });


    This effectively replaces the jQuery equivalent:


    ```

    $element

    .show()

    .animate({ opacity: 0 });

    ```


    > TIP: For a complete overview of Velocity''s animation options, consult the documentation
    at VelocityJS.org.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_43_0.png)'
  - '[PAGE 44]


    # CONTAINING ANIMATION LOGIC


    As with Velocity''s delay option, Velocity''s incorporation of CSS display and
    visibility setting allows for animation logic to be fully contained within Velocity.
    In production code, whenever an element is faded into or out of view, It''s almost
    always accompanied by a change in display or visibility. Leveraging Velocity shorthands
    like these helps you keep your code clean and maintainable, since it''s less dependent
    on external jQuery functions and free of repetitive helper functions that commonly
    bloat animation logic.


    Note that Velocity includes shorthands for the opacity toggling animations demonstrated
    above. They function identically to jQuery''s fadeIn and fadeOut functions. You
    simply pass the corresponding command into Velocity as the first argument, and
    you pass in an options object, if desired, as normal:


    ```

    $element.velocity("fadeIn", { duration: 1000 });

    $element.velocity("fadeOut", { duration: 1000 });

    ```'
