    # USING VELOCITY: BASICS


    To get oriented to Velocity, we''ll start with the basic components: arguments,
    properties, values, and chaining. Since jQuery is ubiquitous, it is also important
    to look at the relationship between Velocity and jQuery.


    # VELOCITY AND JQUERY


    Velocity functions independently of jQuery, but the two can be used in combination.
    It''s often preferable to do so to benefit from jQuery''s chaining capabilities:
    When you''ve preselected an element using jQuery, you can extend it with a call
    to .velocity() to animate:


    ```

    // Assign a variable to a jquery element

    var $div = $("div");

    // Animate the element using Velocity

    $div.velocity({ opacity: 0 });

    // This syntax is identical to jQuery''s own animate function

    $div.animate({ opacity: 0 });

    ```


    All the examples in this book use Velocity in combination with jQuery, and therefore
    follow this syntax.


    # ARGUMENTS


    Velocity accepts multiple arguments. Its first argument is an object that maps
    CSS properties to their desired values and their accepted value types directly
    used in CSS (if you''re unfamiliar with basic CSS properties, pick up an introductory
