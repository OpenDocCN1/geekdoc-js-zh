    # SVG ANIMATION


    SVG elements might never be the backbone of your UI, but they''re certainly appropriate
    for spicing up the parts of your page that you''d normally fill with static images.
    SVGs include:


    +   - Buttons with intricate animation sequences that are triggered when users
    hover and click.


    +   - Unique loading status graphics that replace the all-too-common rotating
    indicator GIF.


    +   - Company logos whose individual parts animate together upon page load.


    This last use case is explored in more detail later in this chapter.


    # PASSING IN PROPERTIES


    With Velocity, SVG properties are animated in the same way that standard CSS properties.
    Pass the appropriate properties and their desired end values into Velocity''s
    properties object:


    ```

    // Animate an SVG element to a red fill and a black stroke

    $svgElement.velocity({ fill: "#ff0000", stroke: "#000000" });

    ```


    In contrast, note that the code below would not work since the following CSS properties
    are not supported by SVG elements:


    ```

    // Incorrect: These properties don''t apply to SVG elements

    $svgElement.velocity({ borderRadius: "px", borderColor: "#000000" });

    ```'
  - '[PAGE 125]


    # PRESENTATIONAL ATTRIBUTES


    The presentational attributes explored earlier in this chapter are also animated

    as as expected:


    ```

    // Animate the x and y coordinates of a rectangle

    $("rect").velocity({ x: 100, y: 100 });

    // Animate the cx and cy coordinates of a circle

    $("circle").velocity({ cx: 100, cy: 100 });

    // Animate the dimensions of a rectangle

    $("rect").velocity({ width: 200, height: 200 });

    // Animate the radius of a circle

    $("circ").velocity({ r: 100 });

    ```


    All the Velocity features you''re currently using—animation reversal, UI pack

    effects, sequence triggering, and so on—work as expected with SVG elements.


    # POSITIONAL ATTRIBUTES VS. TRANSFORMS


    You might be wondering what the difference is between using the x, cx, y, and
    cy

    positional attributes instead of CSS transforms (e.g. translateX, translateY)
    when

    specifying the properties of SVG elements. The answer is browser support. Internet

    Explorer (up to and including Internet Explorer 11) does not support CSS transforms

    on SVG elements. Consider the following:


    +   * The x and y attributes work everywhere where SVG elements

    (IE8+, Android 3+)

    $("rect").velocity({ x: 100, y: 100 });

    // Alternatively, positional transforms (such as translateX and translateY)

    work everywhere *except* Internet Explorer

    $("rect").velocity({ translateX: 100, translateY: 100 });


    > NOTE: Although transforms are known to be particularly performant

    hard by hardware acceleration (read more on this in Chapter 7, "Animation Performance"),
    both approaches to SVG animation are equally

    fast since SVG graphics are hardware-accelerated by default.'
