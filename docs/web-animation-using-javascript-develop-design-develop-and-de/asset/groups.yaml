    \nNow that you're armed with an understanding of the benefits of using JavaScript\
    \ for web animation, plus a grasp of the basics of Velocity, you're ready to explore\
    \ the fascinating theoretical foundation that underlies professional motion design.\n\
    \n# CHAPTER 3\n\n# Motion Design Theory\n\nUtility and elegance are the goals\
    \ of every great motion designer, and this chapter explores a handful of techniques\
    \ for achieving those goals. Because the focus here is on the thery of motion\
    \ design—not its implementation—there are no code examples. The techniques discussed\
    \ can be broadly abstracted across all languages, devices, and platforms.\n\n\
    # MOTION DESIGN IMPROVES THE USER EXPERIENCE\n\nLet's examine the phrase *motion\
    \ design*: To design motion is to decide which visual properties of an object\
    \ should change, and how that change should accelerate. For example, you want\
    \ to call attention to a button by changing its color: you might change the background\
    \ color from red to blue over a 100ms with an easing style of ease-in-out. In\
    \ this case, background-color is the target property and red is the desired end\
    \ value. The timing of the property's transition toward its end value is subject\
    \ to a 100ms duration whose acceleration curve is defined by ease-in-out. Great\
    \ motion designers deliberately choose each of these components—not because they\
    \ look good or hit on popular trends, but because they reinforce the intentions\
    \ of a UI. Whimsical motion design, in contrast, is not only inconsistent, but\
    \ also appears inconvenient and diverting to the user.\n\nThere are hundreds of\
    \ tutorials on the minutiae of UI design, but very few on a webpage than UI design.\
    \ Until recently, browsers and devices weren't actually fast enough to accommodate\
    \ rich motion design. While UI design lays the structural foundation for interacting\
    \ with a page, motion design enriches that foundation with the furnishing and\
    \ decoration that make the page usable and comfortable. Furnishing is the utility\
    \ that motion design serves, and decoration is the *elegance* it provides.\n\n\
    Great apps leverage utility and elegance to make the user feel like she's interacting\
    \ with an interface that's living, breathing, and tangible. An interface that\
    \ reacts the way things do in the real world is one that she'll engage with more\
    \ deeply. In contrast, an interface that's devoid of motion design reminds the\
    \ user that she's simply dragging a cursor across a screen or tapping her finger\
    \ on a piece of glass. A UI *without* motion design makes the user painfully aware\
    \ of the artifice before her.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_54_0.png)\n\
    \nThe utility of motion design leverages psychology. When a user presses a button,\
    \ can she be confident that the press was acknowledged by the UI? An easy way\
    \ to ensure her confidence is to animate the button's transition to a depressed\
    \ state. When a user is waiting for content to load, can she be confident that\
    \ progress is being made or is she left with the unsettling feeling that the app\
