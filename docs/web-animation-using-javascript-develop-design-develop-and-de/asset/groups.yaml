    This triggers a reversal of the circles'' page-load animation when the user hovers
    on or off the SVG element. The single line of code accomplishes this by leveraging
    Velocity’s reverse animation command. For more on working with reverse, refer
    to Chapter 2, “Animating with Velocity.js.” In effect, when the user first hovers,
    the page-load animation is reversed. When the user then hovers off, the reversal
    is itself reversed, bringing the logo back to its original form.


    While this code example is undoubtedly anticlimactic, this is once again a good
    thing because it reflects the similarities between animating SVG and HTML elements.
    Where SVGs do start to become uniquely complex is when you define arbitrary shapes
    that go beyond the basics of squares, rectangles, circles, and so on. After all,
    SVG elements can define any shape you can dream up in a photo editor, so they
    have to be tremendously expressive. And they are. But mastering SVG design is
