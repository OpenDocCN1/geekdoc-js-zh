    这种技术的结果是，性能较弱的设备 UI 动画会降级，导致即时样式变化取代你的动画过渡。这种做法的好处是显著的：由于页面不再发生资源密集型动画，你的 UI 运行会明显更加流畅。虽然这种技术无疑是破坏性的（它损害了你的动效设计理念），但可用性的提升总是比牺牲优雅性值得。毕竟，用户访问你的
    App 是为了完成特定目标，而不是为了欣赏你的 UI 设计有多聪明。千万不要让动画阻碍用户的意图。


    如果你仍然对从 UI 中移除动画的想法感到不满，请记住，性能较弱设备上的用户已经习惯了网站运行缓慢。因此，如果你的网站能以建设性的方式逆潮流而行，他们会感到格外惊喜，并更有可能继续使用。


    ## 尽早确定你的性能节点


    接上一个技术的主题，值得强调的是，本章的建议对移动设备特别适用，许多移动设备相对于台式电脑非常缓慢。遗憾的是，作为开发者，我们经常在工作流中忽略掉这一点：我们通常在高端桌面电脑的纯净运行环境中创建网站，而这些电脑可能运行着最新的硬件和软件。这种环境与用户的真实环境完全脱节，用户不仅在使用过时的硬件和软件，而且往往同时运行许多应用和浏览器标签页。换句话说，我们大多数人的开发环境在性能上是非代表性的高性能！这种疏忽的副作用是，你的
    App 对大部分用户来说实际上可能会明显卡顿。当你意识到这让他们感到沮丧时，他们可能已经失去了使用的兴趣。


    对于关注性能的开发者来说，正确的方法是在开发周期早期确定性能节点。在开发 App 期间，经常在参考设备上检查其性能，这些设备可能包括一个上一代的移动设备加上一个运行
    Internet Explorer 9 的虚拟机。如果你在早期就设定了在参考设备上性能良好的目标，那么你就可以安心睡觉了，因为所有新的设备都会为你的用户提供更好的性能。


    > 提示：如果你是 Mac 用户，请访问 Microsoft 的 Modern.ie 网站获取如何免费运行旧版本 Internet Explorer 虚拟机的信息。


    如果你发现参考设备太弱，无法支持你坚持要在 App 中的动效设计，请遵循上一个技术的建议：在该参考设备上优雅地降级动画，并选择更快的设备作为新的新的（非降级）参考设备。


    对于每个测试设备，记住同时打开几个应用和标签页，以模拟用户的操作环境。永远不要在真空环境中进行测试，即只运行你自己的应用。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_156_0.png)


    记住，远程浏览器测试（通过 BrowserStack.com 和 SauceLabs.com 等服务）与现场参考设备测试不是一回事。远程测试服务适用于测试
    Bug 和 UI 响应能力——而不适用于动画性能。毕竟，运行在云端的测试设备并没有使用真实的硬件——它们是设备的仿真版本。因此，它们的性能通常与现实世界的对应物不同。此外，虚拟机上发生的情况与浏览器窗口中显示的内容之间的延迟时间非常显著，不足以对
    UI 动画性能进行有意义的。


    简而言之，你需要出去购买真实的设备进行性能测试。即使你是一个预算紧张的开发者，也不要在这方面吝啬。你在测试设备上花费的几百美元，将通过更快乐的用户更频繁地使用你那丝般流畅的
    App 所带来的经常性收入所抵消。


    如果你最终拥有几个参考设备，也可以考虑购买 Device Lab，这是一种多功能支架，可以将你所有的移动设备支撑在单一表面上，这样你就可以在测试期间轻松观察屏幕。作为一个奖励，该设备包含一个实用的应用，可以让你同时控制所有设备上的所有浏览器，而无需手动刷新每个浏览器标签页。


    > 注意：访问 Vanamco.com 购买并下载 Device Lab。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_157_0.png)


    ## 尽早找到你的节点。


    ## 去 eBay 购买廉价旧设备


    从这些产品的每个主要发布周期中购买最流行的 Android 和 iOS 设备，将让你获得用户所拥有的硬件和软件环境的广泛代表。以下是我的推荐配置（截至 2015
    年初）：


    - 运行 iOS 的 iPhone 4 或 iPad 2

    - 运行最新版本 iOS 的 iPhone 5s（或更新）

    - 运行 Android 2.3.x 的 Motorola Droid X

    - 运行 Android 4.1.x 的 Samsung Galaxy S3

    - 运行最新版本 Android 的 Samsung Galaxy S5（或更新）


    你可以用任何性能相似的设备替换任何一个 Android 设备。这里重要的是，你使用了每个主要的 Android 发布周期（2.3.x、4.1.x 等）的设备设备，这样你就有了每个周期浏览器性能的代表性样本。参考
    http://developer.android.com/about/dashboards 获取最流行的 Android 版本的分布。


    ## 总结


    性能影响一切。从有多少设备可以运行你的 App，到用户体验的质量，再到人们对你 App 技术能力的感知，性能是专业网页设计的核心原则。它不是“可有可无”，而是一个基础性的构建模块。不要把性能降级为一种事后才做的简单优化。


    ## 第 8 章


    ## 动画演示


    是时候大显身手了！这最后一章将带你你完成一个由 Velocity 驱动的完整动画演示。通过查看演示的源码，你将学习 Velocity 的核心功能如何互补并极大提升
    UI 动画工作流。这个演示还将向你介绍处理 CSS `transform` 属性的高级技术，这对于如今的网页动画至关重要。


    简而言之，你将把在整书中积累的技能组合起来，做出一些真正酷的东西。你在编写演示代码时的目标有两个：使用简洁且富有表现力的动画代码，并确保最大的性能。


    ## 行为


    该演示由 250 个圆形在屏幕上飞入、飞出和周围浮动组成。你会定期地放大，然后缩小到相机开始的位置。呈现的第一幅图像短暂显示了放大视图。


    注意：在继续阅读之前，请前往 VelocityJS.org/demo.html 查看演示的实时预览。

    （你可以在页面的任何地方右键点击并选择“查看源代码”来查看演示代码。）


    圆形元素是简单的普通 `div`，在 CSS 中设置了 `box-shadow` 和 `border-radius`。并没有 WebGL 或 Canvas
    动画在运行——仅仅是 HTML 元素操作。（考虑到同时进行动画的元素数量，这个演示能够在 DOM 中流畅运行着着令人印象深刻！）


    让我们拆解一下动画：它由 `div` 沿 X、Y 和 Z 轴平组成。Z 轴决定了每个元素动画的深度，而 X 和 Y 轴提供了通用的流，即跨屏幕的 2D 移动。在元素个体移动的同时，包含所有这些
    `div` 的元素上发生了一个更大的视角切换。这种视角切换每 3 秒发生一次，创建了一种周期性的缩放效果，让观众感觉自己短暂地穿过了圆形的 3D 空间。


    第二张图描绘了缩小视图下的 3D 场景。与第一幅图中显示的放大视图形成对比。


    ## 如何下载代码示例


    此动画演示后的代码可以从 peachpit.com 下载。

    以下是获取方法：


    1. 访问 www.peachpit.com/register 创建或登录你的账户。

    2. 输入书籍的 ISBN (978-0-13-409670-4) 并点击提交。

    3. 打开你的“我的注册产品”（My Registered Products）页面。找到这本书的列表，并点击“访问奖励内容”（Access Bonus Content）。

    4. 打开包含下载链接的页面——点击访问名为 WebAnimationJS_DemoCodesSample.zip 的动画演示文件。


