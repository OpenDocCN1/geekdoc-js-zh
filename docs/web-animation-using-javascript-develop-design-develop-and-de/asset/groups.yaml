    animation demo powered by Velocity. In going through the demo''s source, you''ll
    learn how Velocity''s core features complement one another to greatly improve
    UI animation workflow. This demo will also introduce you to advanced techniques
    for working with CSS''s transform properties, which are vital to web-based animation
    today.


    In short, you''re going to put together the skills you''ve accumulated throughout
    this book to make something really darn cool. Your goals in coding the demo are
    twofold: use terse and expressive animation code, and ensure maximum performance.'
  - '[PAGE 163]


    # BEHAVIOR


    The demo consists of 250 circles floating in, out, and around the screen. Periodically,
    you''ll zoom in, then back out to the position where the virtual camera started.
    The first image presented momentarily shows a zoomed-in view.


    NOTE: Before you continue reading, head on over to

    VelocityJS.org/demo.book.html to see a live preview of the demo.

    (You can right-click anywhere on the page then choose

    "View Source" to see the demo''s code.)


    The circle elements are simple normal divs with box-shadow and border-radius in
    CSS. There''s no WebGL or Canvas animation going on here—just HTML element manipulation.
    (Given the volume of elements that are being animated at once, it''s quite impressive
    that this demo is capable of running smoothly in the DOM!)


    Let break down the animation: It consists of div translating along the X, Y and
    Z axes. The Z-axis dictates the depth of each element animation, whereas X and
    Y provide the general flow, 2D movement across the screen. Concurrent to the elements''
    individual movements is a larger perspective shift that occurs on the element
    containing all these divs. This perspective shift occurs every 3 seconds, and
    it creates a periodic zooming effect that makes the viewer feel as if he''s briefly
    traveling through the circles'' 3 space.


    The second graphic depicts the 3D scene in its zoomed-out view. Contrast with
    the zoomed-in view shown in the first image.


    # HOW TO DOWNLOAD THE CODE SAMPLE


    The code behind this animation demo is available for download from peachpit.com.

    Here''s how to get it:


    +   1. Go to www.peachpit.com/register and create or log in to your account.

    2. Enter the book''s ISBN (978-0-13-409670-4) and click Submit.

    3. Your "My Registered Products" page opens. Find the listing for this book, and
    click "Access Bonus Content."

    4. The page containing the download link opens—click to access the Animation Demo
    file titled WebAnimationJS_DemoCodesSample.zip.'
- md: "\n![](img/66399f6bc0b186cf74d5dbe299211a7c_164_0.png)\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_164_1.png)\n\
    \n# CODE STRUCTURE\n\nLet's take a look at the code that powers this demo. It\
    \ is structured as follows:\n\n- 5. Animation setup: The specification of parameters\
    \ used for constraining animation movement.\n- 6. Circle creation: The generation\
    \ of the div elements to be animated.\n- 7. Container animation: The code responsible\
    \ for animating the circles' parent element.\n- 8. Circle animation: The code\
    \ responsible for animating the circle elements themselves.\n\nTry to familiarize\
    \ yourself with the broader strokes of the demo's implementation so you can keep\
    \ its full context in mind as you explore each individual code block in the upcoming\
    \ sections:\n\n****************************\nAnimation setup\n****************************/\n\
    \n```\n/* Randomly generate an integer between two numbers. */\nfunction r(min,\
    \ max) {\n  return Math.floor(Math.random() * (max - min + 1)) + min;\n}\n```\n\
    \n```\n/* Query the window's dimensions. */\nvar screenWidth = window.screen.availWidth,\n\
    screenHeight = window.screen.availHeight,\n```\n\n```\n/* Define the z-axis animation\
    \ range. */\nvar translateZMin = -725,\ntransformZMax = 600;\n```\n\n```\n************************\n\
    Circle creation\n************************/\nvar circleCount = 250,\n  circlesHtml\
    \ = \"\",\n  $circles = \"\";\nfor (var i = 0; i < circleCount; i++) {\n  circlesHtml\
    \ += \"<div class='circle'>div\";\n}\n$circle = $(circlesHtml);\n```\n\n```\n\
    ************************\nContainer animation\n************************/\n```\n\
    \n```\n$container\n.css(\"perspective-origin\", screenWidth/2 + \"px \" +\n  screenHeight/2\
    \ + \"px\")\n.velocity(\n{\n  perspective: [ 215, 50 ],\n  opacity: [ 0.90, 0.55\
    \ ]\n},\n  duration: 800,\n  loop: 1,\n  delay: 3000\n});\n```\n\n```\n/************************************/\n\
    Circle animation\n************************************/\n$circles\n.appendTo($container)\n\
    .velocity({\n  opacity: [\n    function() { return Math.random() },\n    function()\
    \ { return Math.random() + 0.1 }\n  ],\n  translateX: [\n    function() { return\
    \ \"+=\" + r(-screenWidth/2.5, screenWidth/2.5) },\n    function() { return r(0,\
    \ screenWidth) }\n  ],\n  translateY: [\n    function() { return \"+=\" + r(-screenHeight/2.75,\
    \ imageHeight/2.75) },\n    function() { return r(0, imageHeight) }\n  ],\n  translateZ:\
    \ [\n    function() { return \"+=\" + r(translateZMin, translateZMax) },\n   \
    \ function() { return r(translateZMin, translateZMax) }\n  ]\n}, { duration: 6000\
    \ })\n.velocity(\"reverse\", { easing: \"easeOutQuad\" })\n.velocity({ opacity:\
    \ 0 }, 2000);\n```\n\n# CODE SECTION: ANIMATION SETUP\n\nThis section's code is\
    \ copied below for easy reference:\n**********************************\n\nAnimation\
    \ setup\n*******************\n\n```\n/* Randomly generate an integer between two\
    \ numbers. */\nfunction r (min, max) {\n  return Math.floor(Math.random() * (max\
    \ - min + 1)) + min;\n}\n/* Query the window's dimensions. */\nvar screenWidth\
    \ = window.screen.availWidth,\nscreenHeight = window.screen.availHeight;\n/* Define\
    \ the z-axis animation range. */\nvar translateZMin = -725,\ntranslateZMax = 600;\n\
    ```\n\nThe first section, Animation setup, begins defining a function r (abbreviated\
    \ from \"random\") that lets you artificially constrain randomly generated integer\
    \ values. This function takes min and max parameters, then outputs a random number\
    \ between the min to max range (using some basic algebra). You'll use this when\
    \ randomizing the animating elements' CSS transform values within ranges that\
    \ are predefined in the next two code blocks.\n\nThe next section queries the\
    \ window object to retrieve the monitor's dimensions. By later referencing these\
    \ values, you can ensure that the circles don't animate too far off-screen (and\
    \ consequently out of view).\n\nAnimation setup concludes by defining the min\
    \ and max values for the elements’ Z-axis movement. These values control how small\
    \ (far away) or large (nearby) you want the circles to animate from their initial\
    \ size. Specifically, it dictates that the circles can go as far as 725 pixels\
    \ along the Z-axis away from the virtual camera (away from the screen), and as\
    \ close as 600 pixels toward the camera. In this case, there’s no constraint of\
    \ going off off-screen, but the circle could become too distant to see or so close\
    \ that it takes up the entire monitor. Basically, it’s a creative decision.\n\n\
    # CODE SECTION: CIRCLE CREATION\n\n```\n************************************\n\
    Circle creation\n************************************/\nvar circleCount = 250,\n\
    circlesHtml = \"\",\n$circles = \"\";\nfor (var i = 0; i < circleCount; i++) {\n\
    \  circlesHtml += \"<div class='circle'>div\";\n}\n$circle = $(circlesHtml);\n\
    ```\n\nThe demo's second section, Circle creation, generates the primary div elements\
    \ to be animated. Here, it first defines the desired number of circles as circleCount.\
    \ Then, it defines a circlesHtml string to contain the circles' collated HTML.\n\
    \nNext, it iterates up to the circleCount number to generate the circles' HTML.\
    \ Notice that it uses the performance best practice of batching DOM additions,\
    \ as detailed in Chapter 7, \"Animation Performance.\" It collates the markup\
    \ for each div element into a master circlesHtml string that's later inserted\
    \ into the DOM in a single action. (If you were to insert the div elements into\
    \ the DOM one at a time, the negative performance impact would be significant:\
    \ UI interaction in the browser would be frozen until the relatively slow element\
    \ insertion process completed.)\n\nFinally, it wraps the circle elements in a\
    \ jQuery element object so that they can be easily manipulated as a group in the\
    \ upcoming sections.\n\n# CODE SECTION: CONTAINER ANIMATION\n\n**********************************\n\
    Container animation\n********************************\n\n```\n$container\n.css(\"\
    perspective-origin\", screenWidth/2 + \"px \" +\n  screenHeight/2 + \"px\")\n\
    .velocity(\n{\n  perspective: [ 215, 50 ],\n  opacity: [ 0.90, 0.55 ]\n},\n  duration:\
    \ 800,\n  loop: 1,\n  delay: 3000\n});\n```\n\n# 3D CSS PRIMER\n\nLet's begin\
    \ the first of the two animation sections of the codebase by focusing on the element.\
    \ Before diving into the code, however, here's a primer on how 3D animation works.\n\
    \nIn order for 3D transforms to work (for example, translateZ, rotateY), the CSS\
    \ specification requires that the perspective property be set on the parent. In\
    \ this case, that's what the $container element is for.\n\nThe greater the perspective\
    \ is set to, the less distance relative to the origin. In other words, if you\
    \ wanted exaggerated depth in your 3D animations, set the perspective to something\
    \ low, such as 50px, which is in fact the value the container is set to.\n\nA\
    \ separate and complementary CSS prospective-origin, which defines the angle at\
    \ which the virtual camera is positioned. The virtual camera is the peephole through\
    \ which the viewer sees 3d animation. This section's code uses jQuery's .css()\
    \ function to set a perspective-origin value on the container element that results\
    \ in the camera being positioned at the center of the page. This perpendicular\
    \ view results in the appearance of circles flying towards and away from the viewer.\n\
    \nSpecifically, this code section sets prospective-origin to the point on the\
    \ page that's at half the browser's height and half its width—the center of the\
    \ page. This leverages the window dimensions queried in the Animation setup section.\n\
    \nWhile the prospective-origin property is set once on the container element and\
    \ thereafter left alone, the perspective property is being animated by Velocity.\
    \ This is necessary because the intended effect of the demo is to keep the vantage\
    \ point into the scene stationary (perpendicular), but to exaggerate the de-exaggerate\
    \ the distance of the elements from the virtual camera, which is where the perspective\
    \ property's animation comes in.\n"
