  - '[PAGE 36]


    # # USING VELOCITY: OPTIONS


    To round out this introduction to Velocity, let''s run through the most commonly
    used options: duration, easing, begin and complete, loop, delay, and display.


    # ## DURATION


    You can specify the duration option, which dictates how long an animation call
    takes to complete, in milliseconds (1/1000th of a second) or as one of three shorthand
    durations: "slow" (equivalent to 6000ms), "normal" (400ms), or "fast" (200ms).
    When specifying a duration value in milliseconds, provide an integer value without
    any unit:


    ```

    // animate with a duration of 1000ms (1 second)

    element.velocity({ opacity: 1, duration: 1000 });

    ```


    or


    ```

    element.velocity({ opacity: 1}, duration: "slow" });

    ```


    The advantage of using the named shorthand durations is that they express the
    tempo of an animation (if it is slow or is it fast?) when you are reviewing your
    code. If you use these shorthands exclusively, they''ll naturally lead to more
    uniform motion design across your site, since all of your animations will fall
    into one of three speed categories instead of each being passed an arbitrary value.


    # ## EASING


    Easings are the mathematical functions that define how fast or slow animations
    occur. For example, an easing type of "ease-out" indicates that the animation
    should gradually accelerate (ease in) during the first part then gradually decelerate
    (ease out) during the final part. In contrast, an easing type of "ease-in" produces
    an animation that accelerates up to a target speed during the first part of an
    animation but remains at a constant speed until the animation completes. An easing
    type of "ease-out" is the inverse of this: the animation starts and continues
    at a constant speed before it gradually decelerates during the final part of the
    animation.'
  - '[PAGE 37]


    Much like the physics-based motion discussed in Chapter 1, "Advantages of JavaScript
    Animation," easing gives you the power to inject personalità into your animations.
    Take, for example, how robotic animation that uses the linear easing feels. (A
    linear easing produces an animation that starts, runs, and ends at the same velocity)
    The robotic feel is the result of association with linear robotic motion in the
    real world: Self-guided mechanical objects typically move neither in straight
    lines nor operate at constant speeds because there''s neither an aesthetic nor
    an organic reason for them to do otherwise.


    In contrast, living things—whether it''s the human body or trees blowing in the
    wind—move at constant speed in the real world. Friction and other external forces
    cause them to move at varying speeds.


    Great motion designers pay homage to organic motion because it gives the impression
    that the interface is responding fluidly to the user''s interaction. In mobile
    apps, for example, you expect a menu to quickly accelerate away from your fingers
    when you swipe off-screen. If the menu were to move away from your fingers at
    a constant speed—like a robotic arm—you''d feel as if the swipe merely set a chain
    of motion events that were outside your control.


    You''ll learn more about the power of easing types in Chapter 3, "Motion Design
    Theory." For now, let''s run through all of Velocity''s available easing values:


    +   - jQuery UI''s trigonometric easings. For a complete listing of these easing
    equations, as well as interactive demonstrations of their acceleration profiles,
    refer to the demos on easing.net.


    ```

    $element.velocity({ width: "100px", "easeInOutSine" });

    ```


    +   - CSS''s easings: "ease-in", "ease-out", "ease-in-out", and "ease" (a subtler
    version of "ease-in-out").


    ```

    $element.velocity({ width: "100px", "ease-in-out" });

    ```


    +   - Bézier''s curves: The Bézier curve easing allows complete control over the
    structure of an easing acceleration curve. A Bézier curve is defined by specifying
    the height of four equidistant points on a chart, which Velocity accepts in the
    format of a four-item array of decimal values. Visit bezier-bezier.com for an
    interactive guide to creating Bézier curves.


    ```

    $element.velocity({ width: "100px" }, [ 0.17, 0.67, 0.83, 0.67 ]);

    ```'
