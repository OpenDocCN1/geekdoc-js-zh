    Workflow'
  - '[PAGE 70]


    The animation code found on most sites is nothing short of a mess. If there’s
    one thing experienced motion designers miss about the old, ugly days of Flash,
    it’’s a structured approach to motion design.


    The contemporary approach to structuring animation code is twofold: leverage the
    workflow features of an animation engine (in this case, Velocity.js) to make your
    code more terse and expressive, and use code organization best practices so that
    it’s easy to modify your work later.


    Say goodbye to deep-nesting JavaScript callbacks and to dirtying your stylesheets
    with unwieldy CSS animations. It’s time to up your web animation game.'
  - '[PAGE 71]


    # CSS ANIMATION WORKFLOW


    In an attempt to better manage UI animation workflow, developers sometimes switch
    from JavaScript to CSS. Unfortunately, once animations reach a medium level of
    complexity, CSS animations typically result in a significantly worse workflow.


    # ISSUES WITH CSS


    While CSS transitions are convenient when used sparingly in a stylesheet, they''re
    unmanageable in complex animations sequences (for example, when all elements sequentially
    load into view upon page load).


    CSS tries to address this issue with a keyframes feature, which lets you separate
    animation logic into discrete time ranges:


    ```

    @keyframes myAnimation {

    0% { opacity: 0; transform: scale(0, 0); }

    25% { opacity: 1; transform: scale(1, 1); }

    50% { transform: translate(100px, 0); }

    100% { transform: translate(100px, 100px); }

    }

    #box { animation: myAnimation 2.75s; }

    ```


    This specifies separate points within an animation''s timeline at which particular
    property values should be reached. It assigns the animation to an element with
    an ID of #box, and specifies the duration of the keyframe sequence to complete
    within. Don''t worry if you don''t fully grasp the syntax above—you won''t be
    using it in this book. Before moving on, consider this: what happens when a client
    asks you to make the opacity animation one second longer, but to keep the rest
    of the properties animating at their current durations? Fulfilling this request
    requires redoing the math so the percentage values properly align with a 1-second
    increase. Doing this is trivial, and it certainly isn''t manageable at scale.'
  - "[PAGE 72]\n\n# WHEN CSS MAKES SENSE\n\nIt's important to point out a situation\
    \ in which you should be using CSS rather than JavaScript for UI animation: when\
    \ you are animating simple style changes triggered by a user hovering over an\
    \ element. CSS transitions lend themselves beautifully to these types of micro-interactions,\
    \ allowing you to accomplish the task in just a few lines of very maintainable\
    \ code.\n\nWorking in CSS, you first define a transition on the target element\
    \ so that in the specified CSS properties animate over a predetermined duration:\n\
    \n```\n/* When this div's color property is modified, animate its change over\n\
    a a duration of 200ms */\ndiv {\n  transition: color 200ms;\n}\n```\n\nYou then\
    \ specify the value that each particular CSS property should change toward, per\
    \ the transition rule. In the case of the hover example, the div's text color\
    \ will change to blue when the user hovers over it:\n\n```\ndiv:hover {\n  color:\
    \ blue;\n}\n```\n\nThat's it. In only a few lines of code, CSS handles interaction\
    \ state for you: when the user hovers away from the div, CSS will animate the\
    \ change from blue back to the preexisting text color over a duration of 200ms.\n\
    \n# WHAT DOES GOOD CODE LOOK LIKE?\n\nGood code is expressive, meaning that its\
    \ purpose is easy to grasp. This is crucial not only for coworkers attempting\
    \ to integrate your foreign code, but also for yourself in the future, once you've\
    \ forgotten your original approach. Good code is also terse, meaning that it completes\
    \ what it needs to in as few lines as possible; every line serves an important\
    \ purpose, and it can't be rewritten away. Lastly, good code is also maintainable,\
    \ meaning that its individual parts can be updated without fear of compromising\
    \ the integrity of the whole."
  - "[PAGE 73]\n\nIn contrast, coding this same effect in jQuery would entail the\
    \ following:\n\n```\n$div\n// Register a mouseover event on this div, which calls\
    \ an animation\nfunction\n.on(\"mouseover\", function() { {\n  $(this).animate({\
    \ color: \"blue\" }, 200);\n})\n// When the user hovers off the element, animate\
    \ the text color back\nto black\n.on(\"mouseout\", function() {\n  // Note: We\
    \ have to remember what the original property value\n  was (black)\n  $(this).animate({\
    \ color: \"black\" }, 200);\n});\n```\n\nThis might not look so bad, but the code\
    \ isn't taking advantage of the fact that JavaScript provides an infinite amount\
    \ of logical control. It goes out of its way to do something that CSS is designed\
    \ for: triggeringless animations that occur on the same element that the user\
    \ is interacting with. Above, you're doing in JavaScript what you could have done\
    \ in fewer, more expressive, and more maintainable lines of CSS. Even worse, you're\
    \ not getting any additional feature benefits by implementing this functionality\
    \ in JavaScript.\n\nIn short, if you can use CSS transitions to animate an element\
    \ that's never being animated by JavaScript (meaning there's no potential for\
    \ conflict), then you should code that animation in CSS. For all other UI animation\
    \ tasks—multi-element and multistep sequences, interactive drag animations, and\
    \ much more—JavaScript animation is the superior solution.\n\nLet's explore the\
    \ fantastic workflow techniques JavaScript provides."
  - '[PAGE 74]


    # CODE TECHNIQUE: SEPARATE STYLINGnFROM LOGIC


    The first technique has profound workflow benefits, especially for teams.


    # STANDARD APPROACH


    In jQuery, it''s common to animate CSS classes onto elements using the UI add-on
    plugin (jQueryUI.com). When the module is loaded, jQuery''s addClass() and removeClass()
    functions are upgraded with animation support. For example, let''s say you have
    a CSS class defined in a stylesheet as follows:


    ```

    .fadeInAndMove {

    opacity: 1;

    top: 50px;

    }

    ```


    You can then animate the CSS properties of that class (opacity and top in this)
    onto the target element with a specified duration:


    ```

    // Animate the properties of the .fadeInAndMove class over a

    1000ms duration

    ```


    ```

    $element.addClass("fadeInAndMove", 1000);

    ```


    The more common implementation of jQuery animation consists of inlining the desired
    animation properties within an $.animate() call, which uses the syntax demonstrated
    in Chapter 1, "Advantages of JavaScript Animation":


    ```

    $element.animate({opacity: 1, top: 50}, 1000);

    ```


    Both implementations produce the same result. The difference is their separation
    of logic. The first implementation delegates the styling rules to a CSS stylesheet,
    where the rest of the page''s styling rules reside. The second mixes styling rules
    with the JavaScript logic responsible for triggering them.


    The first approach is preferable due to the organizational cleanliness and flexibility
    gained by knowing where to make the appropriate style or logic changes to your
    code. CSS stylesheets exist for a reason; seasoned developers do not inline CSS
    into their HTML. That would conflate the purposes of HTML (structure) and CSS
    (styling), and make a site considerably more difficult to maintain.'
  - "[PAGE 75]\n\nThe value of logic separation is further pronounced when working\
    \ in a team environment, in which it's common for developers and designers to\
    \ bump heads while trying to edit the same file at the same time.\n\n# OPTIMIZED\
    \ APPROACH\n\nWith the review of standard methods out of the way, let's look at\
    \ the optimized approach. It's just as beneficial—and often the best methodology\
    \ for JavaScript-centric animation workflows—to shift animation styling logic\
    \ into a dedicated JavaScript file (for example, a style.js) rather than a dedicated\
    \ CSS stylesheet. Sounds weird, right? Perhaps, it works brilliantly. This technique\
    \ leverages plain JavaScript objects to help you organize your animation code.\n\
    \nFor example, your style.js file might look like this:\n\n```\n// This object\
    \ is a parallel to the CSS class defined in the previous code example\nvar fadeIn\
    \ = {\n  opacity: 1,\n  top: \"50px\"\n};\n```\n\nIn your script.js, which is\
    \ the primary JavaScript file that controls animation logic, you would then have:\n\
    \n```\n// Pass our named properties object into Velocity\n$element.velocity(fadeIn,\
    \ 1000);\n```\n\nTo recap, your style.js, you've defined a JavaScript object that's\
    \ populated with the CSS properties you want to animate. This is the same object\
    \ that's then passed into Velocity as a first argument. You're not doing anything\
    \ fancy here—just saving objects to named variables, then passing those variables\
    \ into Velocity instead of the raw objects themselves.\n\n> NOTE: This technique\
    \ works well equally with jQuery's animate() function.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_75_0.png)"
- md: "\n# a pain-free workflow is vital.\n\nThe benefit of switching from CSS to\
    \ JavaScript to segregate logic is that your style.js file is uniquely capable\
    \ of defining animation options—not just properties. There are many ways to specify\
    \ an option: one is to assign two member properties to a parent animation object\
    \ to which you assign an expressive name. The first property on the object defines\
    \ the animation's properties; the second defines its options.\n\nIn this case,\
    \ your style.js file would look like this:\n\n```javascript\nvar fadeIn = {\n\
    \  // p is for \"properties\"\n  p: {\n    opacity: 1,\n    top: \"50px\"\n  },\n\
    \  // o is for \"options\"\n  o: {\n    duration: 1000,\n    easing: \"linear\"\
    \n  }\n};\n```\n\nIn the script.js file, you've have:\n\n```javascript\n// Pass\
    \ in our clean and re-usable animation objects\n$element.velocity(fadeIn.p, fadeIn.o);\n\
    ```\n\nPretty and clean, right? Someone skimming it would understand its purpose,\
    \ and would know where to look to modify its properties—the style.js file. Further,\
    \ the purpose of this animation is immediately evident because you named the object\
    \ appropriately, you know that the code serves to fade an object into view. You\
    \ no longer have to mentally parse animation properties to assess the purpose\
    \ of the animation.\n\nThis approach discourages you from arbitrarily selecting\
    \ options for each individual animation on a page since there's now a bank of\
    \ premade animation objects you can easily pull from. This results in leaner code\
    \ and more consistent motion design. Consistency, as you learned in the previous\
    \ chapter, is a key component of great UX.\n\nBut the best part is that this approach\
    \ lends itself perfectly to organizing your animation variations together. For\
    \ example, if you typically fade button elements into view with a duration of\
    \ 1000ms, but you fade modal windows into view with a duration of 3000ms, you\
    \ can simply split your objects into two appropriately named variations:\n\n```javascript\n\
    var fadeIn = {\n  p: {\n    opacity: 1,\n    top: \"50px\"\n  },\n  // Options\
    \ object variation #1 uses a fast duration\n  ofast: {\n    duration: 1000,\n\
    \    easing: \"linear\"\n  },\n  // Variation #2 uses a slower duration\n  loSlow:\
    \ {\n    duration: 3000,\n    easing: \"linear\"\n  }\n};\n// Animate using the\
    \ fast duration.\n$button.velocity(fadeIn.p, fadeIn.ofast);\n/* Animate using\
    \ the slow duration. */\n$modal.velocity(fadeIn.p, fadeIn.loSlow);\n```\n\nAlternatively,\
    \ you could nest \"fast\" and \"slow\" objects as children of a singular options\
    \ object. The choice of which implementation to use is based on your personal\
    \ preference:\n\n```javascript\nvar fadeIn = {\n  p: {\n    opacity: 1,\n    top:\
    \ \"50px\"\n  },\n  o: {\n    fast: {\n      duration: 1000,\n      easing: \"\
    linear\"\n    },\n    slow: {\n      duration: 3000,\n      easing: \"linear\"\
    \n    }\n  }\n}\n```\n\n\n\n// Animate using the fast duration.\n$button.velocity(fadeIn.p,\
    \ fadeIn.o.fast);\n\n/* Animate using the slow duration. */\n$modal.velocity(fadeIn.p,\
    \ fadeIn.o.slow);\n\nIf this seems like too much overhead, and if you have few\
    \ lines of JavaScript to justify simply inlining all your animation logic, don't\
    \ feel like a bad developer for skipping this approach altogether. You should\
    \ always use whichever of abstraction best suits the scope of your project. The\
    \ takeaway here is simply that animation workflow best practices do exist if you\
    \ find yourself needing them.\n\n# CODE TECHNIQUE: ORGANIZE SEQUENCED ANIMATIONS\n\
    \nVelocity has a small add-on plugin called the UI pack (get it at VelocityJS.org/#uiPack).\
    \ It enhances Velocity with features that greatly improve the UI animation workflow.\
    \ Many of the techniques in this chapter, including the one discussed below, use\
    \ of it.\n\nTo install the UI pack, simply include a `<script>` tag for it Velocity\
    \ and before the ending `</body>` tag of your page:\n\n```html\n<script src=\"\
    velocity.js\"></script>\n<script src=\"velocity.ui.js\"></script>\n```\n\nThe\
    \ specific UI pack feature discussed in this section is called sequence running.\
    \ It will forever change your animation workflow. It is the solution to messily\
    \ nested animation code.\n\n# STANDARD APPROACH\n\nWithout the UI pack, the standard\
    \ approach to consecutively animating separate elements is as follows:\n\n```javascript\n\
    // Animate element1 followed by element2 followed by element3\n$element1.velocity({\
    \ translateX: 100, opacity: 1 }, function () {\n  $element2.velocity({ translateX:\
    \ 200, opacity: 1 }, 1000, function () {\n    $element3.velocity({ translateX:\
    \ 300, opacity: 1 }, 1000);\n  });\n});\n```\n\nDon't let this simple example\
    \ fool you: in real-world production code, animation sequences include many more\
    \ properties, many more options, and many more levels of nesting as are demonstrated\
    \ here. Code like this most commonly appears in loading sequences (when a page\
    \ or a subsection first loads in) that consist of multiple elements animating\
    \ into place.\n\nNote that the code shown above is different from chaining multiple\
    \ animations onto the same element, which is hassle-free:\n\n```javascript\n//\
    \ Chain multiple animations onto the same element\n$element1\n.velocity({ translateX:\
    \ 100 })\n.velocity({ translateY: 100 })\n.velocity({ scale: 100 });\n```\n\n\
    So what's wrong with this?\n\n- The code bloats with each level of nesting.\n\
    - You can't easily reorder animations in the overall sequence.\n- You can't easily\
    \ identify the difference between properties and options objects.\n\n# OPTIMIZED\
    \ APPROACH\n\nBefore you learn about the solution, it's important to understand\
    \ that Velocity accepts multiple arguments: First, know that Velocity consists\
    \ of properties followed by an object:\n\n```javascript\n// The argument syntax\
    \ used far\n$element.velocity({ opacity: 1, top: \"50px\" }, { duration: 1000,\
    \ easing: \"linear\" });\n```\n\nAn alternative syntax involves passing Velocity\
    \ a single object that contains member objects. For the sake of brevity, the member\
    \ object names are truncated to the first letter of their associated objects (e\
    \ for elements, p for properties, and o for options). Further, note that you're\
    \ now passing the target element as an argument since you're no longer invoking\
    \ Velocity directly on the element. Here's what animating off the base object\
    \ looks like:\n\n```javascript\n// The alternative syntax used far\n$.velocity({\n\
    \  e: $element,\n  p: { opacity: 1, top: \"50px\" },\n  o: { duration: 1000, easing:\
    \ \"linear\" }\n});\n```\n\nThe net effect is exactly the same as the syntax used.\
    \ As you can see, the new syntax isn't much bulkier, but it's equally—if not more—expansive.\
    \ Armed with this new syntax, you're ready to learn how the UI sequence-running\
    \ features work: you simply create an array of Velocity calls, with each call\
    \ defined using the single-object syntax just demonstrated. You then pass the\
    \ entire array into a special function that fires the sequence's calls successfully.\
    \ When one Velocity call is completed, the next runs—even if the individual calls\
    \ are targeting different elements:\n\n```javascript\n// Create the array of Velocity\
    \ calls\nvar loadingSequence = [\n  { e: $element1, p: { translateX: 100, opacity:\
    \ 1 }, o: { duration: 1000 } },\n  { e: $element2, p: { translateX: 200, opacity:\
    \ 1 }, o: { duration: 1000 } },\n  { e: $element3, p: { translateX: 300, opacity:\
    \ 1 }, o: { duration: 1000 } }\n];\n\n// Pass the array into $.Velocity.RunSequence\
    \ to kick off the sequence\n$.Velocity.RunSequence(loadingSequence);\n```\n"
  mdcn: "\n\n# 无痛的工作流至关重要。\n\n将逻辑从 CSS 切换到 JavaScript 进行分离的好处是，你的 `style.js` 文件能够独特地定义动画选项——而不仅仅是属性。指定选项有许多方法：一种是将两个成员属性赋值给父动画对象，并为该对象分配一个描述性的名称。对象上的第一个属性定义动画的属性；第二个属性定义它的选项。\n\
    \n在这种情况下，你的 `style.js` 文件看起来如下：\n\n```javascript\nvar fadeIn = {\n  // p 代表 \"\
    properties\" (属性)\n  p: {\n    opacity: 1,\n    top: \"50px\"\n  },\n  // o 代表\
    \ \"options\" (选项)\n  o: {\n    duration: 1000,\n    easing: \"linear\"\n  }\n\
    };\n```\n\n在 `script.js` 文件中，你有：\n\n```javascript\n// 传入我们整洁且可复用的动画对象\n$element.velocity(fadeIn.p,\
    \ fadeIn.o);\n```\n\n非常漂亮且整洁，对吧？有人扫一眼就能理解它的用途，并知道去哪里查看和修改其属性——即 `style.js` 文件。此外，此动画的目的是一而易见的，因为你恰当地命名了对象，你知道代码的作用是将一个对象淡入视图。你不再需要在脑中解析动画属性来评估动画的用途。\n\
    \n这种方法阻止了你为页面上的每个单独动画随意选择选项，因为现在有了一个可以轻松调用的预制动画对象库。这导致了代码更精简，运动设计更一致。正如你在上一章中学到的，一致性是优秀\
    \ UX 的关键组件。\n\n但最棒的部分是，这种方法非常适合将你的动画变体组织在一起。例如，如果你通常用 1000ms 的时长将按钮元素淡入视图，但用 3000ms\
    \ 的时长将模态窗口淡入视图，你只需将对象拆分为两个命名合适的变体：\n\n```javascript\nvar fadeIn = {\n  p: {\n\
    \    opacity: 1,\n    top: \"50px\"\n  },\n  // 选项对象变体 #1 使用快速时长\n  ofast: {\n\
    \    duration: 1000,\n    easing: \"linear\"\n  },\n  // 变体 #2 使用较慢的时长\n  loSlow:\
    \ {\n    duration: 3000,\n    easing: \"linear\"\n  }\n};\n// 使用快速时长进行动画。\n$button.velocity(fadeIn.p,\
    \ fadeIn.ofast);\n/* 使用慢速时长进行动画。 */\n$modal.velocity(fadeIn.p, fadeIn.loSlow);\n\
    ```\n\n或者，你可以将“快”和“慢”对象嵌套作为单个选项子对象。使用哪种实现取决于你的个人偏好：\n\n```javascript\nvar fadeIn\
    \ = {\n  p: {\n    opacity: 1,\n    top: \"50px\"\n  },\n  o: {\n    fast: {\n\
    \      duration: 1000,\n      easing: \"linear\"\n    },\n    slow: {\n      duration:\
    \ 3000,\n      easing: \"linear\"\n    }\n  }\n}\n```\n\n\n\n// 使用快速时长进行动画。\n\
    $button.velocity(fadeIn.p, fadeIn.o.fast);\n\n/* 使用慢速时长进行动画。 */\n$modal.velocity(fadeIn.p,\
    \ fadeIn.o.slow);\n\n如果这看起来开销太大了，而且你只有几行 JavaScript 代码不足以支持直接内联所有动画逻辑，不要因为完全跳过这种方法而觉得自己是一个糟糕的开发者。你应该始终使用最适合你项目范围的抽象方式。这里的要点是，如果你发现自己需要它们，那么动画工作流的最佳实践确实存在。\n\
    \n# 代码技巧：组织序列化动画\n\nVelocity 有一个名为 UI pack 的小型插件（可以在 VelocityJS.org/#uiPack 获取）。它增强了\
    \ Velocity，引入了极大改进 UI 动画工作流的功能。本章中的许多技术（包括下文讨论的）都使用了它。\n\n要安装 UI pack，只需在引入 Velocity\
    \ 之后、页面闭合的 `</body>` 标签之前包含它的 `<script>` 标签：\n\n```html\n<script src=\"velocity.js\"\
    ></script>\n<script src=\"velocity.ui.js\"></script>\n```\n\n本节讨论的特定 UI pack 功能称为“序列化运行”（sequence\
    \ running）。它将彻底改变你的动画工作流。它是解决混乱嵌套动画代码的解决方案。\n\n# 标准方法\n\n在没有 UI pack 的情况下，连续动画独立元素的标准方法如下：\n\
    \n```javascript\n// 动画 element1，然后是 element2，最后是 element3\n$element1.velocity({\
    \ translateX: 100, opacity: 1 }, function () {\n  $element2.velocity({ translateX:\
    \ 200, opacity: 1 }, 1000, function () {\n    $element3.velocity({ translateX:\
    \ 300, opacity: 1 }, 1000);\n  });\n});\n```\n\n不要被这个简单的例子误导了：在真实的生产代码中，动画序列包含许多更多的属性、更多的选项以及比此处演示多得多的嵌套级。这种代码通常出现在加载序列中（当页面或子部分首次加载时），由多个动画移动到位的元素组成。\n\
    \n注意，上述代码与在在同一个元素上链调用多个动画不同，后者是轻松的：\n\n```javascript\n// 在同一个元素上链调用多个动画\n$element1\n\
    .velocity({ translateX: 100 })\n.velocity({ translateY: 100 })\n.velocity({ scale:\
    \ 100 });\n```\n\n这种方式有什么问题？\n\n- 代码随着嵌套层级的增加而膨肿。\n- 你无法轻松重新排列整个序列中的动画。\n- 你无法一眼识别属性和选项之间的区别。\n\
    \n# 优化方法\n\n在学习解决方案之前，理解 Velocity 接受多个参数很重要。首先，知道 Velocity 由属性和一个对象组成：\n\n```javascript\n\
    // 使用的语法\n$element.velocity({ opacity: 1, top: \"50px\" }, { duration: 1000, easing:\
    \ \"linear\" });\n```\n\n另一种语法是向 Velocity 传递一个包含成员对象的单个对象。为了简洁，成员对象的名称缩写为关联对象的第一个字母（e\
    \ 代表元素，p 代表属性，o 代表选项）。此外，注意你现在将目标元素作为参数传递，因为你不再直接在元素上调用 Velocity。基于基础对象的动画看起来如下：\n\
    \n```javascript\n// 使用的替代语法\n$.velocity({\n  e: $element,\n  p: { opacity: 1,\
    \ top: \"50px\" },\n  o: { duration: 1000, easing: \"linear\" }\n});\n```\n\n\
    最终效果与使用的语法完全相同。正如你所见，新语法并没有臃肿多少，但扩展性同样甚至更强。掌握了这种新语法后，你准备好学习 UI 序列运行功能的工作原理了：你只需要创建一个\
    \ Velocity 用的数组，每个调用都使用刚刚演示的单对象语法。然后，将整个数组传递给一个特殊函数来成功触发序列中的调用。当一个 Velocity 调用完成后，下一个调用就会运行——即使各个调用针对不同的元素：\n\
    \n```javascript\n// 创建 Velocity 调用数组\nvar loadingSequence = [\n  { e: $element1,\
