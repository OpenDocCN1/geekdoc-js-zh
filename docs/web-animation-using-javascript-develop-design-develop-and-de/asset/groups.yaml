    $element.velocity({ width: \"500px\" }, { easing: [ 500, 20 ] });\n```\n\nThere's\
    \ also a shorthand syntax: Instead of passing in an object as a second argument,\
    \ you can use comma-separated syntax. This entails listing values for duration\
