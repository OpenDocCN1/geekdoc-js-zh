  raw:
  - '[PAGE 63]


    Always it be considerate of the personality expressed by your animation decisions.
    As a designer, it''s hard to judge the tone of your own work, so it''s a good
    idea to get third-party feedback early and often. Ask test users whether a UI
    feels professional, friendly, and sleek, and tweak your motion design according
    to your preference for each of these three traits.


    # GO BEYOND OPACITY


    The most common means of transitioning an element into or out of view is to animate
    its opacity from 0 to 1, and vice versa. This can be rather boring. Opacity is
    just the base property that is to be animated when displaying or hiding content—it''s
    not the only property. You can spice up your property choices by scaling an element
    down view, sliding it out of view, or changing its background color. As you add
    more properties to an animation, consider leveraging multistep effects, which
    you''ll learn about in the next technique.


    # BREAK ANIMATIONS INTO STEPS


    The simplest path to professional-looking motion design is to break animations
    into multistep effects. For example, if you''re animating an image view by transitioning
    its opacity and scale from 0 to 1, instead consider first animating the element''s
    opacity to 0.5—half of its final value—followed by animating its scale from 0
    while simultaneously animating the remaining half of properties into steps like
    this removes the linearity that''s common to most amateur motion design on the
    web—wherein all properties animate perfectly in sync. In the real world, the properties
    of objects in motion do not all accelerate in sync: Consider how, when a bird
    flies, it moves forward (translate) at a different rate than it moves up and down
    (translate). If it were to move linearly in both of its X and Y axes, it would
    look more like a bullet than an animal. Great motion design borrows from the movement,
    breathing things because UIs are for humans—not machinesand humans like to feel
    expression and reaction.


    If you pay attention to the futuristic UI animation depicted in movies, you''ll
    notice that intricate multistep animations are a key component in making them
    look sleek. The reason for this is simple, and it further supports the case for
    avoiding linearity: humans are attracted to variety and contrast. Consider how,
    when you break up an animation, you''re contrasting and juxtaposing the individual
    components of that'
  - '[PAGE 64]


    animation against each other. Just like layering clothing to create pleasant color
    and texture combinations, you should layer animations to create pleasant motion
    design combinations.


    For advice on the technical implementation of multistep effects, read Chapter
    4,

    "Animation Workflow."


    # STAGGER ANIMATIONS


    When multiple sibling elements—say, a series of images in a gallery—are animat-

    ing view at the same time, consider adding a tiny successive delay between them.

    (That is, after the first image loads, a delay occurs before the second image
    loads, and so

    on.) To delay the animation of sibling elements in this way is called staggering,
    and its

    purpose is similar to that of breaking animation into steps: it adds visual layering
    by

    preventing all your elements from animating perfectly in sync, which can look
    plain and

    inelegant compared to staggered loading. Why? Because animating a series of elements

    s sync lacks any semblance of granularity or radiance. Consider this: Birds don''t
    fly

    side by side in a straight line. What makes their aerial movements so graceful
    is their

    successive formation and timing. It''s their juxtaposition, and the motion of
    their juxta-

    position, that makes them so elegant to the human eye.


    # FLOW FROM THE TRIGGERING ELEMENT


    If clicking a button causes a modal to appear, have the modal animate out from
    the

    button''s location. In other words, have animations flow from the elements that
    trigger

    them. This bridges the cause-and-effect relationships in your UI, making individual

    elements feel better coupled and better organized.


    To understand the psychological benefit of this technique, consider how motion

    works in the real world: when you pull a lever, a series of mechanical parts causes
    a

    connected object to move. Connected is the key word: real objects don''t move
    unless a

    force is exerted upon them. Likewise, it''s important to treat every element in
    your UI as an\element capable of exerting its own force. Every action should feel
    connected to a trigger.

    This sort of seamless experience is what helps an interface transcend from the
    digital into

    the physical. The more physical an interface is, the more responsive and emotive
    it feels.'
  - '[PAGE 65]


    # USE GRAPHICS


    Make use of scalable vector graphics (SVG) to animate individual graphic components
    of a larger element that the user can interact with (learn more in Chapter 6,
    "Scalable Vector Graphics Primer\). A common example of this is the trio of horizontal
    lines that constitute a "hamburger menu" icon, or the dots that form a circle
    in a loading indicator. In both of these, arbitrary shapes are grouped together
    to form a common UI component. Before SVG animation was possible on the web, the
    common approach to animating a graphic like either of the two described was to
    embed the full graphic as a PNG image then animate the entire shape by transitioning
    its opacity in CSS. By leveraging SVG, however, you can animate these unique elements
    on an individual shape-by-shape basis and subject them to many types of property
    animations.


    Graphic animation is a surefire way to add nuance to key portions of your UI.
    This nuance is partially a result of the fact that web-based animation primarily
    deals with solid, rectangular shapes. (Sometimes they have rounded corners, but
    the shapes nonetheless remain solid and whole.) Animating the individual shapes
    of an element instead lets you delight the user with motion design that she might
    not have realized even possible.


    Beyond novelty, you can uniquely leverage SVG animation to transform shapes into
    brand-new ones. Pairing this with the techniques for previewing outcomes and flowing
    from the triggering element, you can use graphic transformations to indicate UI
    behavior and provide feedback to the user. For example, if hovering over the dots
    in a loading indicator causes dots to rearrange themselves into an X shape, that
    indicates to the user that clicking the status indicator graphic would cancel
    the loading of content.'
  - '[PAGE 66]


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_66_0.png)'
  - '[PAGE 67]


    # EXPERIMENT REPEATEDLY


    Finding the right duration, stagger, easing, and property combinations for each
    animation is not a skill that designers are born with. It''s a skill that every
    great designer has had to learn. So, remember: your first attempt at a combination
    of animation properties might look good, but it''s probably not the best case.
    There are only two ways to find the best case: experiment by systematically changing
    each factor in the motion design equation until you stumble onto something sublime,
    or borrow ideas from other peoples'' work. Once you''ve found a combination you
    like—even if it''s one you''ve already borrowed elsewhere pixel-for-pixel—experiment
    further. Consider cutting the duration in half, switching to a completely different
    easing type, or swapping out a property.


    Designers are often averse to extended experimentation—even though there are a
    million ways to animate a button into view—each way effectively fulfils the goal
    at hand: making the button visible. Consequently, once you stumble onto a combination
    of properties that look good, you''re likely to stick with it because it looks
    good and it works. But don''t forget that goodness isn''t a respectable design
    goal—greatness entails stepping outside your comfort zone, and not necessarily
    relying on what you already know works.'
  - '[PAGE 68]


    # WRAPPING UP


    Utility and elegance are your goals. At minimum, all animation code must fulfill
    one or the other.


    When implemented properly, animation code should provide concrete value to your
    UX and not adversely impact the website''s performance. No matter how sleek your
    motion design is, if the interface is laggy as a result of its implementation,
    the overall user experience will not be elegant. You''ll learn more about the
    importance of performance in the Chapter 7, "Animation Performance."'
- md: "\n# CHAPTER 4\nAnimation Workflow\n\nThe animation code found on most sites\
    \ is nothing short of a mess. If there’s one thing experienced motion designers\
    \ miss about the old, ugly days of Flash, it’s a structured approach to motion\
    \ design.\n\nThe contemporary approach to structuring animation code is twofold:\
    \ leverage the workflow features of an animation engine (in this case, Velocity.js)\
    \ to make your code more terse and expressive, and use code organization best\
    \ practices so that it’s easy to modify your work later.\n\nSay goodbye to deep-nesting\
    \ JavaScript callbacks and to dirtying your stylesheets with unwieldy CSS animations.\
    \ It’s time to up your web animation game.\n\n## CSS ANIMATION WORKFLOW\n\nIn\
    \ an attempt to better manage UI animation workflow, developers sometimes switch\
    \ from JavaScript to CSS. Unfortunately, once animations reach a medium level\
    \ of complexity, CSS animations typically result in a significantly worse workflow.\n\
    \n### ISSUES WITH CSS\n\nWhile CSS transitions are convenient when used sparingly\
    \ in a stylesheet, they're unmanageable in complex animations sequences (for example,\
    \ when all elements sequentially load into view upon page load).\n\nCSS tries\
    \ to address this issue with a keyframes feature, which lets you separate animation\
    \ logic into discrete time ranges:\n\n```css\n@keyframes myAnimation {\n0% { opacity:\
    \ 0; transform: scale(0, 0); }\n25% { opacity: 1; transform: scale(1, 1); }\n\
    50% { transform: translate(100px, 0); }\n100% { transform: translate(100px, 100px);\
    \ }\n}\n#box { animation: myAnimation 2.75s; }\n```\n\nThis specifies separate\
    \ points within an animation's timeline at which particular property values should\
    \ be reached. It assigns the animation to an element with an ID of #box, and specifies\
    \ the duration of the keyframe sequence to complete within. Don't worry if you\
    \ don't fully grasp the syntax above—you won't be using it in this book. Before\
    \ moving on, consider this: what happens when a client asks you to make the opacity\
    \ animation one second longer, but to keep the rest of the properties animating\
    \ at their current durations? Fulfilling this request requires redoing the math\
    \ so the percentage values properly align with a 1-second increase. Doing this\
    \ is trivial, and it certainly isn't manageable at scale.\n\n## WHEN CSS MAKES\
    \ SENSE\n\nIt's important to point out a situation in which you should be using\
    \ CSS rather than JavaScript for UI animation: when you are animating simple style\
    \ changes triggered by a user hovering over an element. CSS transitions lend themselves\
    \ beautifully to these types of micro-interactions, allowing you to accomplish\
    \ the task in just a few lines of very maintainable code.\n\nWorking in CSS, you\
    \ first define a transition on the target element so that in the specified CSS\
    \ properties animate over a predetermined duration:\n\n```css\n/* When this div's\
    \ color property is modified, animate its change over\na duration of 200ms */\n\
    div {\n  transition: color 200ms;\n}\n```\n\nYou then specify the value that each\
    \ particular CSS property should change toward, per the transition rule. In the\
    \ case of the hover example, the div's text color will change to blue when the\
    \ user hovers over it:\n\n```css\ndiv:hover {\n  color: blue;\n}\n```\n\nThat's\
    \ it. In only a few lines of code, CSS handles interaction state for you: when\
    \ the user hovers away from the div, CSS will animate the change from blue back\
    \ to the preexisting text color over a duration of 200ms.\n\n## WHAT DOES GOOD\
    \ CODE LOOK LIKE?\n\nGood code is expressive, meaning that its purpose is easy\
    \ to grasp. This is crucial not only for coworkers attempting to integrate your\
    \ foreign code, but also for yourself in the future, once you've forgotten your\
    \ original approach. Good code is also terse, meaning that it completes what it\
    \ needs to in as few lines as possible; every line serves an important purpose,\
    \ and it can't be rewritten away. Lastly, good code is also maintainable, meaning\
    \ that its individual parts can be updated without fear of compromising the integrity\
    \ of the whole.\n\nIn contrast, coding this same effect in jQuery would entail\
    \ the following:\n\n```javascript\n$div\n// Register a mouseover event on this\
    \ div, which calls an animation\n.on(\"mouseover\", function() {\n  $(this).animate({\
    \ color: \"blue\" }, 200);\n})\n// When the user hovers off the element, animate\
    \ the text color back\n// to black\n.on(\"mouseout\", function() {\n  // Note:\
    \ We have to remember what the original property value\n  // was (black)\n  $(this).animate({\
    \ color: \"black\" }, 200);\n});\n```\n\nThis might not look so bad, but the code\
    \ isn't taking advantage of the fact that JavaScript provides an infinite amount\
    \ of logical control. It goes out of its way to do something that CSS is designed\
    \ for: triggeringless animations that occur on the same element that the user\
    \ is interacting with. Above, you're doing in JavaScript what you could have done\
    \ in fewer, more expressive, and more maintainable lines of CSS. Even worse, you're\
    \ not getting any additional feature benefits by implementing this functionality\
    \ in JavaScript.\n\nIn short, if you can use CSS transitions to animate an element\
    \ that's never being animated by JavaScript (meaning there's no potential for\
    \ conflict), then you should code that animation in CSS. For all other UI animation\
    \ tasks—multi-element and multistep sequences, interactive drag animations, and\
    \ much more—JavaScript animation is the superior solution.\n\nLet's explore the\
    \ fantastic workflow techniques JavaScript provides.\n\n## TECHNIQUE: SEPARATE\
    \ STYLING FROM LOGIC\n\nThe first approach is preferable due to the organizational\
    \ cleanliness and flexibility gained by knowing where to make the appropriate\
    \ style or logic changes. CSS stylesheets exist for a reason; seasoned developers\
    \ do not inline CSS into HTML. That would conflate the purposes of HTML (structure)\
    \ and CSS (styling), and make a site considerably more difficult to maintain.\n\
    \nThe value of logic separation is further pronounced when working in a team environment,\
    \ in which it's common for developers and designers to bump heads while trying\
    \ to edit the same file at the same time.\n\n### STANDARD APPROACH\n\nIn jQuery,\
    \ it's common to animate elements using CSS classes. For example, let's say you\
    \ have a CSS class defined:\n\n```css\n.fadeInMove {\n  opacity: 1;\n  top: 50px;\n\
    }\n```\n\nYou can then animate the class with a specified duration:\n\n```javascript\n\
    // Animate the fadeInMove class over 1000ms\n$element.addClass(\"fadeInMove\"\
    , 1000);\n```\n\nBoth implementations produce the same result. The difference\
    \ is their separation. The first implementation delegates the styling rules to\
    \ a CSS stylesheet, where styling rules reside. The second mixes styling rules\
    \ with the JavaScript logic responsible for them.\n\n### OPTIMIZED APPROACH\n\n\
    With the review of standard methods out of the way, let's look at the optimized\
    \ approach. It's just as beneficial—and often the best methodology for JavaScript-centric\
    \ animation workflows—to shift animation logic into a dedicated JavaScript file\
    \ (for example, a style.js) rather than a dedicated CSS stylesheet. Sounds weird,\
    \ right? Perhaps, it works brilliantly. This technique leverages plain JavaScript\
    \ objects to help you organize your animation code.\n\nFor example, your style.js\
    \ file might look like this:\n\n```javascript\n// This object is a parallel to\
    \ the CSS class defined in the previous example\nvar fadeIn = {\n  opacity: 1,\n\
    \  top: \"50px\"\n};\n```\n\nIn your script.js, which is the primary JavaScript\
    \ file that controls animation logic, you would then have:\n\n```javascript\n\
    // Pass our named properties object into Velocity\n$element.velocity(fadeIn, 1000);\n\
    ```\n\nTo recap, your style.js, you've defined a JavaScript object that's populated\
    \ with the CSS properties you want to animate. This is the same object that's\
    \ then passed into Velocity as a first argument. You're not doing anything fancy\
    \ here—just saving objects to named variables, then passing those variables into\
    \ Velocity instead of the raw objects themselves.\n\n> NOTE: This technique works\
    \ well equally with jQuery's animate() function.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_75_0.png)\n"
  mdcn: "\n\n# 第 4 章\n动画工作流\n\n大多数网站上看到的动画代码简直是一团乱麻。如果说经验丰富的动态设计师对 Flash 那个老旧且丑的时代唯一怀念的，那就是一种结构化的动态设计方法。\n\
    \n现代的动画代码结构化方法包含两个方面：利用动画引擎（在本例中为 Velocity.js）的工作流特性使你的代码更简洁、更具表现力；并使用代码组织的最佳实践，以便日后修改你的作品。\n\
    \n告别深度嵌套的 JavaScript 回调，也别再用笨笨的 CSS 动画弄脏你的样式表。是时候提升你的 Web 动画水平了。\n\n## CSS 动画工作流\n\
    \n为了更好地管理 UI 动画工作流，开发者有时会从 JavaScript 切换到 CSS。遗憾的是，一旦动画达到中等复杂度，CSS 动画通常会导致工作流显著变差。\n\
    \n### CSS 的问题\n\n虽然 CSS 过渡在样式表中少量使用时非常方便，但在复杂的动画序列中（例如，当所有元素在页面加载时顺序进入视图时），它们通常是难以管理的。\n\
    \nCSS 尝试通过关键帧（keyframes）功能来解决这个问题，它允许你将动画逻辑分离到离散的时间范围内：\n\n```css\n@keyframes\
    \ myAnimation {\n0% { opacity: 0; transform: scale(0, 0); }\n25% { opacity: 1;\
    \ transform: scale(1, 1); }\n50% { transform: translate(100px, 0); }\n100% { transform:\
    \ translate(100px, 100px); }\n}\n#box { animation: myAnimation 2.75s; }\n```\n\
    \n这指定了动画时间轴内特定的点，此时应达到特定的属性值。它将动画分配给 ID 为 #box 的元素，并指定了完成关键帧序列所需的持续时间。如果你还没有完全理解上面的语法不用担心——在书中不会用到它。在继续之前，请考虑这一点：如果客户要求你让透明度动画增加一秒钟，但保持其他属性的动画持续时间不变，满足这一请求需要重新计算，使百分比值正确对齐增加的\
    \ 1 秒。这样做固然琐容易，但在规模化下是不可维护的。\n\n## 何时使用 CSS 合理\n\n指出一种你应该使用 CSS 而不是 JavaScript\
    \ 进行 UI 动画的情况是非常重要的：当你正在对由用户悬停在元素上触发的简单样式变化进行动画处理时。CSS 过渡非常适合这类微交互，允许你仅用几行极易维护的代码就能完成任务。\n\
    \n在 CSS 中工作时，你首先在目标元素上定义一个过渡，使得指定的 CSS 属性在预定的持续时间内进行动画：\n\n```css\n/* 当此 div 的颜色属性被修改时，在\
    \ 200ms 的持续时间内动画其变化 */\ndiv {\n  transition: color 200ms;\n}\n```\n\n然后，你根据每条过渡规则指定每个特定\
    \ CSS 属性应该向变化的值。在悬停的示例中，当用户悬停在 div 上时，div 的文本颜色将变为蓝色：\n\n```css\ndiv:hover {\n\
    \  color: blue;\n}\n```\n\n就这样。仅需几行代码，CSS 就会为你处理了交互状态：当用户移开 div 时，CSS 将在 200ms\
    \ 的持续时间内完成从蓝色变回原有文本颜色的动画。\n\n## 好代码看起来是什么样？\n\n良好的代码是具有表现力的，这意味着它的目的很容易理解。这不仅对于尝试整合你的外来代码的同事至关重要，对于未来的你（一旦你忘记了最初的方法）也至关重要。良好的代码也是简洁的，意味着它能用尽可能少的行数完成所需任务；每一行都有重要的目的，且不能被重写删除。最后，良好的代码还是可维护的，这意味着它的各个部分可以更新，而必担心损害整体的完整性。\n\
    \n相比之下，在 jQuery 中编写相同的效果将涉及以下操作：\n\n```javascript\n$div\n// 在此 div 上注册鼠标悬入事件，调用一次动画\n\
    .on(\"mouseover\", function() {\n  $(this).animate({ color: \"blue\" }, 200);\n\
    })\n// 当用户鼠标移出元素时，将文本颜色动画\n// 回黑色\n.on(\"mouseout\", function() {\n  // 注意：我们必须记住原始属性值\n\
    \  // 是什么（黑色）\n  $(this).animate({ color: \"black\" }, 200);\n});\n```\n\n这看起来可能并不糟糕，但这段代码没有利用\
    \ JavaScript 提供的无限逻辑控制这一事实。它费力去做一些 CSS 设计初衷的事情：在用户交互的同一个元素上触发无触发动画。在上面，你用 JavaScript\
    \ 做的事情，本可以用更少、更具表现力且更易维护的 CSS 代码来实现。更糟糕的是，通过在 JavaScript 中实现此功能，你并没有获得任何额外的特性优势。\n\
    \n简而言之，如果你可以使用 CSS 过渡来动画一个从未被 JavaScript 动画处理的元素（这意味着没有潜在冲突），那么你就应该在 CSS 中编写该动画。对于所有其他\
    \ UI 动画任务——多元素和多步骤序列、交互式拖拽动画等——JavaScript 动画都是更优的解决方案。\n\n让我们探索 JavaScript 提供的精彩工作流技术。\n\
    \n## 技术：样式与逻辑分离\n\n第一种方法更优，是因为通过知道在何处进行适当的样式或逻辑更改获得了组织上的整洁和灵活性。CSS 样式表的存在是有其原因的；资深开发者不会将\
    \ CSS 内联到 HTML 中。那样会混淆 HTML（结构）和 CSS（样式）的目的，并使网站变得难以维护得多。\n\n在团队环境中工作时，逻辑分离的价值愈为明显，在这种环境中，开发者和设计师试图同时编辑同一个文件时发生冲突是常有的事。\n\
    \n### 标准方法\n\n在 jQuery 中，使用 CSS 类来动画元素是常见的。例如，假设你定义了一个 CSS 类：\n\n```css\n.fadeInMove\
    \ {\n  opacity: 1;\n  top: 50px;\n}\n```\n\n然后你可以指定的持续时间对该类进行动画：\n\n```javascript\n\
    // 在 1000ms 内对 fadeInMove 类动画\n$element.addClass(\"fadeInMove\", 1000);\n```\n\
    \n两种实现方式产生相同的结果。区别在于它们的分离。第一种实现将样式规则委托给 CSS 样式表，即样式规则所在的地方。第二种实现将样式规则与负责这些规则的\
    \ JavaScript 逻辑混合在一起。\n\n### 优化方法\n\n在回顾了标准方法之后，让我们看看优化方法。同样有利（且通常是 JavaScript\
    \ 中心动画工作流的佳方法）是将动画逻辑转移到专门的 JavaScript 文件（例如 style.js），而不是专门的 CSS 样式表。听起来很奇怪吧？也许效果非常好。这项技术利用纯\
    \ JavaScript 对象来帮助你组织动画代码。\n\n例如，你的 style.js 文件可能如下所示：\n\n```javascript\n// 此对象等同于上一个示例中定义的\
    \ 类\nvar fadeIn = {\n  opacity: 1,\n  top: \"50px\"\n};\n```\n\n在控制动画逻辑的主 JavaScript\
    \ 文件 script.js 中，你随后将拥有：\n\n```javascript\n// 将我们命名的属性对象传递给 Velocity\n$element.velocity(fadeIn,\
    \ 1000);\n```\n\n总结一下，在 style.js 中，你定义了一个填充了想要动画的 CSS 属性的 JavaScript 对象。这个对象随后作为第一个参数传递给\
    \ Velocity。你并没有做任何复杂的操作——只是将对象保存到命名变量，然后将这些变量而不是原始对象传递给 Velocity。\n\n> 注意：这种技术在\
    \ jQuery 的 animate() 函数中同样有效。\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_75_0.png)\n\
    \n"
