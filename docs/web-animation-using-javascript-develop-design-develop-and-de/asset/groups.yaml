  - "[PAGE 112]\n\n# TEXTUAL FLOURISHES\n\nThe final topic in this discussion of textual\
    \ animation is the concept of flourishes, ambient animations that produce ongoing\
    \ effects for aesthetic purposes. One example might be a string of text that flickers\
    \ like a dying light bulb. Another might be having all the words in a sentence\
    \ continuously animate to different shades of blue.\n\nBoth of these are bad ideas.\n\
    \nThese effects distract users and ultimately amuse only you—the developer who\
    \ enjoysing with motion design. Never include animation just for the sake of animation;\
    \ if a part of your page is meaningless drawing the user's attention away from\
    \ the parts that have utility, go back to the drawing board.\n\nThe rare exception\
    \ to this is status—text as \"Loading...”—that keep the user aware of what the\
    \ interface is doing. These are appropriate targets for textual flourishes because\
    \ the flourishes tell the user that the interface is still processing data (as\
    \ opposed to frozen). In this way, flourishes act as an engaging visual heartbeat.\n\
    \nSo if textual flourishes are generally considered bad practice, why is this\
    \ section included in the book? Because flourishes that aren't animated are often\
    \ a great idea! Consider this non-animation bonus provided by Blast: you can stylize\
    \ the text elements generated by Blast to produce colorful collages and unique\
    \ typographic designs. For example, you could break apart a website’s slogan text\
    \ (“Delivering happiness to your door!\") word by word to reduce the opacity of\
    \ each successive word, thereby creating a subtle gradient effect that spans the\
    \ entire sentence. Here’s what that code would look like:\n\n```\n<div>\nHi Mom\n\
    </div>\n// Blast the div then iterate through the generated text elements\n$('div\\\
    ).blast({ delimiter: \"character\" }).each(function(i, element) {\n  // Successively\
    \ reduce the opacity of each element with an\n  arbitrary formula\n  var adjustedOpacity\
    \ = 1 - i/10;\n  element.style.opacity = adjustedOpacity;\n});\n```"
  - "[PAGE 113]\n\nInstead of iterating opacity values, you could also iterate RGB\
    \ values to create color-based gradients. For example, if you increased the blue\
    \ component of text whose color initially starts as gray, you'd produce elements\
    \ that are increasingly rich in blue as you go from first to last:\n\n```\n//\
    \ Blast the div then iterate through the generated text elements\n$(\"div\").blast({\
    \ delimiter: \"character\" }).each(function(i, element) {\n  // Successively increase\
    \ the blue color component of each element\n  with an an arbitrary formula\n \
    \ var adjustedBlue = i*20;\n\n  element.style.opacity = \"rgb(0, 0,\" + adjustedBlue\
    \ + \")\";\n});\n```"
