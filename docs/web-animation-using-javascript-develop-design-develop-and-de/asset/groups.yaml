    You can now animate these span elements independently. Before you dive into textual
    animation, however, you''re going to learn more about how Blast works so you can
    take full advantage of its powerful features.


    # HOW BLAST.JS WORKS


    The goal of this section is to make you comfortable with the prospect of using
    Blast to break apart the text on your beloved page. Let''s dive in!


    divs, tables, and the other HTML elements that you''re familiar with called element
    nodes. An element node consists of two types of children: additional element nodes
    and text nodes (raw text).


    Take this element, for example:


    ```

    <div>

    Hello <span>World</span>

    </div>

    ```


    This div element is composed of of two children: a text node ("Hello") and a span
    element node. The span element contains a child of its own: another text node
    ("World”).


    When Blast is called, it traverses the entirety of the target element''s descendant
    element chain to find text nodes. With each text node, Blast executes the Regex
    query associated with the specified delimiter (character, word, or sentence) to
    subdivide the node into new elements, each with its own text node part. Since
    Blast doesn''t actually element nodes—only text nodes—you can safely apply it
    to the entire page without worrying about breaking elements'' event handlers and
    other expected behaviors. This versatility is crucial when Blast on user-generated
    content that is often dirtied with HTML. (Say, for example, you want to separate
    the words in a message posted to your site''s comments section so you can highlight
    important passages. With Blast, you can safely do so without concern for breaking
    the embedded elements.)'
  - '[PAGE 99]


    In addition to its robustness, Blast provides a high level of accuracy. It doesn''t
    dumbly split words at spaces, nor does it split sentences at periods within words.
    It leverages UTF-8 character sets for Latin alphabet languages, meaning that you
    can accurately apply it to French, German, Spanish, English, Italian, and Portuguese
    content on the following paragraph.


    Suppose you used Blast''s sentence delimiter on the following paragraph.(Bold
    and italic are used below to indicate the consecutive text matches that Blast
    detects.) Blast correctly identified six sentences in the paragraph:


    ?Will the sentence delimiter recognize this full sentence containing Spanish punctuation?
    ¡Yes! « Mais, oui » «Nested quotes" doesn''t break the sentence delimiter!» Further,
    periods inside words (e.g. Blast.js), in formal titles (e.g. Mrs. Bluth, Dr. Funke),
    and in “e.g.” and “i.e.” do not falsely match as sentence-final punctuation. Darn.
    That''s pretty impressive.


    Notice how punctuation is associated with its proper sentence, and how errant
    periods don''t falsely demarcate sentence matches.


    With these foundations covered, it''s time to run through how to use Blast.


    # INSTALLATION


    Blast is installed on a page like any other JavaScript plugin: embed the appropriate
    script link before your page''s <body> tag:


    ```

    <html>

    <head>My Page</head>

    <body>

    My content.

    <script src="jquery.js"></script>

    <script src="velocity.js"></script>

    <script src="blast.js"></script>

    </body>

    </html>

    ```


    NOTE: Blast requires jQuery (or Zepto, a jQuery alternative), and therefore must
    be required after jQuery. It doesn''t matter whether Blast is loaded before or
    after Velocity.'
  - '[PAGE 100]


    Once Blast is loaded, use it by calling .blast() on a jQuery element object. It
    accepts an options object as its sole argument:


    ```

    $element.blast({ option1: value1, option2: value2 });

    ```


    Let''s run through the available options.


    # OPTION: DELIMITER


    Blast''s most important option is delimiter, which accepts "character", "word",
    or sentence. To separate the text within $element using the "sentence" delimiter,
    your code would look like this:


    ```

    $element.blast({ delimiter: "sentence" });

    ```


    Note that Blast returns the generated text wrapper elements to the jQuery selector
    chain so you can manipulate them, like this:


    ```

    $element.blast({ delimiter: "sentence" })

    .css("opacity", 0.5);

    ```


    The .css() call is applied to the individual text elements, not the parent $element
    that you called Blast.


    # OPTION: CUSTOMCLASS


    Blast provides two options to make text manipulation easier: customClass and generateValueClass.
    customClass behaves exactly as you would expect: supply a custom class (as a string
    value) to be assigned to the text node elements.


    Suppose you had the following div and blast:


    ```

    <div>

    Hi Mom

    </div>

    ```


    ```

    $("div").blast({ delimiter: "word" , customClass: "myClass" });

    ```'
