    ，这既保持了 \"inline\" 元素的照常行为方式，又赋予了它们类似 \"block\" 元素（如 div 和 p）额外的功能，在这些元素中，可以对位置相关的属性（包括\
    \ 3D 变换）进行样式设置。考虑到这一调整，内向文本过渡示例现在看起来如下：\n\n```javascript\n$(\"div\")\n.html({\
    \ delimiter: \"word\" })\n.css({ opacity: 0, display: \"inline-block\" })\n.velocity(\"\
    transition.perspectiveDownIn\", { stagger: 50 });\n```\n\n这在调用 jQuery 的 `css()`\
    \ 函数时，在将元素的 `opacity` 设置为初始值 0 的同时，将 Blast 处理后的文本部分的 `display` 值设为 \"inline-block\"\
    。\n\n# 文本修饰\n\n关于文本动画讨论的最后一个话题是“修饰（flourishes）”的概念，即为了美学目的而产生持续效果的氛围动画。一个例子可能是像坏掉的灯泡一样闪烁的文本字符串。另一个例子可能是句子中的所有单词连续地变为不同深浅的蓝色。\n\
    \n这二者都是坏主意。\n\n这些特效会分散用户的注意力，并且最终只会取悦你自己——那个享受运动设计的开发者。永远不要为了添加动画而添加动画；如果页面的某部分毫无意义，反而将用户的注意力从实用的部分引开，请回到起点重新设计。\n\
    \n这种做法的罕见例外是状态提示——如“Loading...”等文本——它们能让用户意识到界面正在做什么。这些是文本修饰的合适目标，因为修饰告诉用户界面仍在处理数据（而不是卡住了）。通过这种方式，修饰充当了吸引人的视觉心跳。\n\
    \n既然文本修饰通常被认为是坏做法，为什么书中要包含这一节呢？因为没有动画的修饰通常是一个好主意！考虑一下 Blast 提供的非动画奖励：你可以对 Blast\
    \ 生成的文本元素进行样式化，产生彩色拼贴和独特的字体设计。例如，你可以逐单词拆分网站的标语（“Delivering happiness to your door!”），降低后续单词的透明度，从而创建一个跨越句子的微妙渐变效果。代码看起来像这样：\n\
    \n```javascript\n<div>\nHi Mom\n</div>\n// 处理 div，然后遍历生成的文本元素\n$(\"div\").blast({\
    \ delimiter: \"character\" }).each(function(i, element) {\n  // 使用任意公式逐渐减少每个元素的透明度\n\
    \  var adjustedOpacity = 1 - i/10;\n  element.style.opacity = adjustedOpacity;\n\
    });\n```\n\n与其迭代透明度值，你也可以迭代 RGB 值来创建基于颜色的渐变。例如，如果你增加了初始颜色为灰色的文本的蓝色分量，那么从第一个到最后一个，你会发现元素的蓝色变得越来越丰富：\n\
    \n```javascript\n// 处理 div，然后遍历生成的文本元素\n$(\"div\").blast({ delimiter: \"character\"\
    \ }).each(function(i, element) {\n  // 使用任意公式逐渐增加每个元素的蓝色分量\n  var adjustedBlue\
    \ = i*20;\n\n  element.style.opacity = \"rgb(0, 0,\" + adjustedBlue + \")\";\n\
    });\n```\n\n# 记住：\n形式追随功能。\n\n# 总结\n\n# 第6章\n\n# 可缩矢量图入门\n\n由于关于可缩矢量图（SVG）的深度教程可以轻松写一本书，因此本章仅作为该主题的介绍。目标是让你掌握足够的知识，以便对动画\
    \ SVG 元素感到自在，并知道下一步去哪里继续学习。\n\n# 通过代码创建图像\n\nSVG 元素是一种 DOM 元素。\n\n"
