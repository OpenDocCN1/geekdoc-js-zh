    # FOREWORD


    It''s a special time when a developer first discovers jQuery''s .animate(). I
    remember trying to animate any part of the page that wasn''t bolted to the main
    content. I created transitions, fly-out menus, hover effects, scroll transitions,
    magical reveals, and parallax sliders. Turning my websites from cold, static documents
    into moving, visual experiences felt like I was reaching another level as a web
    designer. But it was just bells and whistles. I realize now that for all the animation
    I added, I hadn''t actually improved the user experience of my websites.


    All the same, it was thrilling. So what makes animation so exciting? My apartment
    looks over downtown Brooklyn. I see people walk down the street. Plumes from smokestacks
    billow up. Pigeons flutter to perch on a ledge. A construction crane raises a
    section of a building. A single, heart-shaped balloon floats into the Brooklyn
    sky (corny, I know, but I literally saw this twice). Cars drive over the Williamsburg
    Bridge. Clouds pass overhead.


    The world is in motion. Motion is how you expect the universe to work. Things
    move. Like the movements outside my window, each one is a one-sentence story.
    Together they tell the larger story of what is happening.


    Yet it isn''t how digital interfaces work. Those little stories are missing. When
    things change, you have to fill in the story for yourself.

