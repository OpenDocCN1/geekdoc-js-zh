    # TECHNIQUE: BATCH DOM ADDITIONS\n\nLike reducing layout thrashing, batching DOM\
    \ additions is another performance technique to help avoid unoptimized interaction\
    \ with the browser.\n\n# PROBLEM\n\nYou're not done with gets and sets just yet!\
