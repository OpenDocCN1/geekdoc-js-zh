    \n# 代码结构\n\n让我们来看看驱动此演示的。。它的结构如下：\n\n- 5. 动画设置：用于限制动画运动的参数规范。\n- 6. 圆形创建：生成待进行动画的\
    \ div 元素。\n- 7. 容器动画：负责控制圆形父元素动画的代码。\n- 8. 圆形动画：负责控制圆形元素本身动画的代码。\n\n尝试熟悉该演示实现的整体思路，这样在探索后续章节中的每个单独代码块时，你可以在脑中保持完整的上下文：\n\
    \n****************************\n动画设置\n****************************/\n\n```\n/*\
    \ 随机生成两个数字之间的一个整数。 */\nfunction r(min, max) {\n  return Math.floor(Math.random()\
    \ * (max - min + 1)) + min;\n}\n```\n\n```\n/* 查询窗口的尺寸。 */\nvar screenWidth =\
    \ window.screen.availWidth,\nscreenHeight = window.screen.availHeight,\n```\n\n\
    ```\n/* 定义 z 轴动画范围。 */\nvar translateZMin = -725,\ntransformZMax = 600;\n```\n\
    \n```\n************************\n圆形创建\n************************/\nvar circleCount\
    \ = 250,\n  circlesHtml = \"\",\n  $circles = \"\";\nfor (var i = 0; i < circleCount;\
    \ i++) {\n  circlesHtml += \"<div class='circle'>div\";\n}\n$circle = $(circlesHtml);\n\
    ```\n\n```\n************************\n容器动画\n************************/\n```\n\n\
    ```\n$container\n.css(\"perspective-origin\", screenWidth/2 + \"px \" +\n  screenHeight/2\
    \ + \"px\")\n.velocity(\n{\n  perspective: [ 215, 50 ],\n  opacity: [ 0.90, 0.55\
    \ ]\n},\n  duration: 800,\n  loop: 1,\n  delay: 3000\n});\n```\n\n```\n/************************************/\n\
    圆形动画\n************************************/\n$circles\n.appendTo($container)\n\
    .velocity({\n  opacity: [\n    function() { return Math.random() },\n    function()\
    \ { return Math.random() + 0.1 }\n  ],\n  translateX: [\n    function() { return\
    \ \"+=\" + r(-screenWidth/2.5, screenWidth/2.5) },\n    function() { return r(0,\
    \ screenWidth) }\n  ],\n  translateY: [\n    function() { return \"+=\" + r(-screenHeight/2.75,\
    \ imageHeight/2.75) },\n    function() { return r(0, imageHeight) }\n  ],\n  translateZ:\
    \ [\n    function() { return \"+=\" + r(translateZMin, translateZMax) },\n   \
    \ function() { return r(translateZMin, translateZMax) }\n  ]\n}, { duration: 6000\
    \ })\n.velocity(\"reverse\", { easing: \"easeOutQuad\" })\n.velocity({ opacity:\
    \ 0 }, 2000);\n```\n\n# 代码章节：动画设置\n\n本节代码已复制在下方，方便参考：\n**********************************\n\
    \n动画设置\n*******************\n\n```\n/* 随机生成两个数字之间的一个整数。 */\nfunction r (min, max)\
    \ {\n  return Math.floor(Math.random() * (max - min + 1)) + min;\n}\n/* 查询窗口的尺寸。\
    \ */\nvar screenWidth = window.screen.availWidth,\nscreenHeight = window.screen.availHeight;\n\
    /* 定义 z 轴动画范围。 */\nvar translateZMin = -725,\ntranslateZMax = 600;\n```\n\n第一部分“动画设置”开始定义一个函数\
    \ `r`（\"random\" 的缩写），该函数允许你人工限制随机生成的整数值。此函数接受 `min` 和 `max` 参数，然后输出 `min` 到 `max`\
    \ 范围之间的随机数（使用了一些基础代数运算）。当你需要在接下来两个代码块中预定义的范围内随机化动画元素的 CSS transform 值时，将会使用它。\n\
    \n下一部分查询 `window` 对象以获取显示器的尺寸。通过稍后引用这些值，你可以确保圆形不会动画到屏幕之外（从而移出视野）。\n\n“动画设置”通过定义元素\
    \ Z 轴运动的最小值和最大值而结束。这些值控制了你希望圆形从初始大小向多小（远离）或多大（靠近）进行动画。具体而言，它规定了圆形沿 Z 轴方向可以远离虚拟摄像头（远离屏幕）最远\
    \ 725 像素，靠近摄像头最近 600 像素。在这种情况下，没有限制不能超出屏幕，但圆形可能会太远而看不见，或者太近而占据整个显示器。基本上，这是一个创意上的决策。\n\
    \n# 代码章节：圆形创建\n\n```\n************************************\n圆形创建\n************************************/\n\
    var circleCount = 250,\ncirclesHtml = \"\",\n$circles = \"\";\nfor (var i = 0;\
    \ i < circleCount; i++) {\n  circlesHtml += \"<div class='circle'>div\";\n}\n\
    ```\n\n演示的第二部分“圆形创建”生成了待动画的 div 元素。在这里，它首先定义了预期的圆形数量 `circleCount`。然后，它定义了一个 `circlesHtml`\
    \ 字符串。接下来，它循环 `circleCount` 次以生成这些 HTML。最后，它使用 `$(circlesHtml)` 将转换为 jQuery 对象。\n\
    \n# 代码章节：容器动画\n\n**********************************\n容器动画\n********************************\n\
    \n```\n$container\n.css(\"perspective-origin\", screenWidth/2 + \"px \" +\n  screenHeight/2\
    \ + \"px\")\n.velocity(\n{\n  perspective: [ 215, 50 ],\n  opacity: [ 0.90, 0.55\
    \ ]\n},\n  duration: 800,\n  loop: 1,\n  delay: 3000\n});\n```\n\n# 3D CSS 基础\n\
    \n让我们从关注元素开始，进入两个动画章节中的第一个。然而，在深入代码之前，这里有一个关于 3D 动画的入门知识。\n\n为了让 3D 变换（例如 `translateZ`,\
    \ `rotateY`）生效，CSS 规范要求在父元素上设置 `perspective` 。在这种情况下，这就是 `$container` 元素的作用。\n\
    \n`perspective` 的值越大，相对于原点的距离就越小。换句话说，如果你想在 3D 动画中夸张深度，请将 `perspective` 设置为较低的值，例如\
    \ 50px，这实际上是容器设置的值。\n\n另一个独立且补充的 CSS 属性是 `perspective-origin`，它定义了虚拟摄像头的位置。虚拟摄像头是观察\
    \ 3D 动画的观察孔。本节代码使用 jQuery 的 `.css()` 方法在容器元素上设置 `perspective-origin` 值，使得摄像头位于页面的中心。这种垂直视角产生了圆形飞向和远离观众的效果。\n\
    \n具体来说，此代码章节将 `perspective-origin` 设置为页面上高度的一半和宽度的一半的点——即页面中心。这利用了在“动画设置”部分查询的窗口尺寸。\n\
    \n虽然 `perspective-origin` 属性在容器元素上设置一次后不再变动，但 `perspective` 属性正在通过 Velocity 进行动画。这是必要的，因为演示预期的效果是保持场景的视角固定（垂直），但夸张地或减小元素与虚拟摄像头的距离，这正是\
    \ `perspective` 属性动画发挥的地方。\n\n"
