    # 设计技巧


    本章到目前为止的技术将改进你在动态设计编码阶段的工作流。本节涵盖的技术重点侧重于设计阶段，此时你仍在通过实验来寻找适合你 UI 的完美动画。这个阶段需要大量的创意和重复，因此非常适合改进工作流。


    # 时间倍数


    第一种设计技巧是使用全局时间倍数。这包括在你的所有动画的延迟值和持续时间值上乘以一个倍数常数。


    首先，定义你的全局时间倍数（任意指定为 M）：


    ```

    var M = 1;

    ```


    然后，将倍数嵌入到每个动画调用的 `duration` 和 `delay` 选项值中：


    ```

    element1.animate({ opacity: 1 }, duration: 1000 * M });

    element2.velocity({ opacity: 1 }, delay: 250 * M });

    ```


    > 注意：如果你使用 SASS 或 LESS（它们支持在样式表中使用变量），此技术同样适用于 CSS 动画！


    嵌入倍数常数将帮助你快速在一个处修改 M 常数（可能在你的 `style.js` 顶部），以便快速加速或减慢页面上的所有动画。这种时间控制的优点包括：


    - 减慢动画以完善复杂动画序列中的单个动画调用。当你不断刷新页面以将一个多元素动画序列调整到完美时，以慢动作查看序列将使其更容易评估单个元素之间是如何相互作用的。


    - 在进行重复性 UI 测试时加速动画。当你为了动画以外的目的测试网站时，评估 UI 动画的最终状态（元素如何停止）比测试动画的运动更重要。在这些情况下，加速页面上的所有动画可以节省时间并减少麻烦，这样你就不需要在每次刷新页面时反复等待动画播放完毕。


    Velocity 对此功能有一个方便实现叫做 `mock`，它作为一个后台全局倍数运行，这样你就不需要手动添加它。如上面的示例所示，`mock` 同时乘以持续时间和延迟值。要开启
    `mock`，请临时将 `$.Velocity.mock` 设置为你想要使用的倍数值：


    ```

    // 将动画时间倍增 5 倍

    $.Velocity.mock = 5;

    // 所有动画现在都经过了时间调整

    // 下方的持续时间实际上变成了 5000ms

    $element.velocity({ opacity: 1 }, duration: 1000 });

    ```


    Velocity 的 `mock` 功能也接受一个布尔值：将 `mock` 设置为 `true`，所有持续时间和延迟都变为毫秒，这会强制所有动画在单个浏览器计时周期（每几毫秒发生一次）内完成。这是一个当动画阻碍你的
    UI 开发和测试时快速关闭所有动画的强大快捷方法。


    # 使用 VELOCITY MOTION DESIGNER


    Velocity Motion Designer (VMD) 的设计唯一目的是帮助开发者简化动态设计的创建阶段。VMD 是一个书签脚本（bookmarklet），你可以将其加载到页面上实时设计动画。它允许你双击元素打开一个模态框，为该元素指定动画属性和选项。然后你按下键盘上的回车键即可立即看到动画播放——无需刷新页面。


    > 注意：在 http://velocityjs.org/#vmd 获取 Velocity Motion Designer。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_90_0.png)


    一旦你按照想要的方式设计了所有元素动画，就可以将你的工作导出为一对对应的 Velocity 代码，将其将其放入 IDE 中供生产环境使用。（生成的代码也完全兼容
    jQuery。）


    最终，VMD 通过防止频繁在 IDE 和浏览器标签页之间切换，以及反复触发 UI 状态，节省了无数小时的开发时间。此外，它通过允许两个团队实时协作工作，简化了从设计师到开发人员的工作流：通过
    VMD，设计师可以实现动态设计，而无需熟悉网站的 JavaScript 或 CSS。他们只需要将导出的 Velocity 代码交给开发人员，由他们根据情况集成到代码库中。


    VMD 是一个高度视觉化的工具——访问 VelocityJS.org/#vmd 查看演示视频。


    # 总结


    当你实现动画工作流技术时，你会发现动态设计那个令人生畏的“黑盒”开始逐渐展开。在 Stripe.com 和 Webflow.com 等尖端网站上看到的精美加载序列将开始变得易理解。你将对自己编写动画序列的能力充满信心，这种新获得的技能将减少你开发流程中的摩擦，使完成动态设计目标不仅变得更容易，而且有趣得多。


    # 第 5 章


