    This concatenates the string representation of each HTML element onto a master
    string that is then turned into a JEO and appended into the DOM in a single shot.
    In this way, the browser is given explicit instruction to insert everything at
    once, and it optimizes for performance accordingly.


    Simple, right? As you''ll see in the remainder of this chapter, performance best
    practices are usually as easy as this. You simply have to train your eye to know
    to use them.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_144_0.png)


    ## TECHNIQUE: AVOID AFFECTING NEIGHBORING ELEMENTS


    It''s important to consider the impact of an element''s animation on neighboring
    elements.


    ## PROBLEM


    When an element''s dimensions are animated, the changes often affect the positioning
    of nearby elements. For example, if an element between two sibling elements shrinks
    in width, the siblings'' absolute positions will dynamically change so they remain
    next to the animating element. Another example might be animating a child nested
    inside a parent element that doesn''t explicitly defined width and height properties.
    Accordingly, when the child is being animated, the parent will resize itself so
    that it continues to fully wrap itself around the child. In effect, the child
    element is no longer the only element being animated—the parent''s dimensions
    are also being animated, and that''s even more work for the browser to perform
    upon each tick in an animation loop!


    There are many CSS properties whose modification can result in dimensional and
    positional adjustments to neighboring elements, including top, right, bottom,
    and left; all margin and padding properties; border thickness; and the width and
    height dimensions.


    As a performance-minded developer, you need to appreciate the impact that animating
    these properties can have on your page. Always ask yourself how each property
    you''re attempting to animate affects nearby elements. If there''s a way to rewrite
    your code such that you can isolate elements'' changes from one another, then
    consider doing so. In fact, there is an easy way to do this—on to the solution!


    ## SOLUTION


    The simple solution to avoid affecting neighboring elements is to animate the
    CSS transform properties (translateX, translateY, scaleX, scaleY, rotateZ, and
    rotate) whenever possible. The transform properties are unique in that they elevate
    targeted elements to isolated layers that are rendered separately from the rest
    of the page (with a performance boost courtesy of your GPU), so that neighboring
    elements aren''t affected. For example, when animating an element''s translateX
    to a value of "500px", the element will move 500px rightward while superimposing
    itself on top of whatever elements exist along its animation path. If there are
    no elements along its path (that is, if there are no elements to affect it), then
    using translateX will have the same effect on the look of your page as if you
    have animated using the much slower effect.


    Hence, whenever possible, an animation that once looked like this:


    ```javascript

    // Move the element 500px from the left

    $element.velocity({ left: "500px" });

    ```


    should be refactored into this:


    ```javascript

    // Faster: Use translateX

    $element.velocity({ translateX: "500px" });

    ```


    Similarly, if you can substitute translateY for top, do so:


    ```javascript

    $element.velocity({ top: "100px" });

    // Faster: Use translateY

    $element.velocity({ translateY: "100px" });

    ```


    > NOTE: Sometimes you actually intend to use left or top so that neighboring elements''
    positions are changed. In all other cases, get into the habit of using the transform
    properties. The performance impact is significant.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_146_0.png)


    ## CONSIDER OPACITY OVER COLOR


    opacity is another CSS property that receives a GPU rendering boost since it doesn''t
    affect the positioning of elements. So, if there are elements on your page for
    which you''re currently animating, say, color when the user hovers over them,
    consider animating opacity instead. If the net effect looks almost as good as
    the color animation, then consider sticking with it—you''ve just boosted the UI''s
    performance without compromising its look.


    As a performance-minded developer, you''re no longer allowed to arbitrarily select
    animation properties. You must now consider the impact of each of your property
    choices.


    > NOTE: Refer to CSSTiggers.com for a breakdown of how CSS properties affect browser
    performance.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_147_0.png)


    ## TECHNIQUE: REDUCE CONCURRENT LOAD


    Browsers have bottlenecks. Find out what they are and stay below them.


    ## PROBLEM


    When a page first loads, the browser processes HTML, CSS, JavaScript, and images
    as quickly as possible. It should come as no surprise that animations occurring
    during this time tend to be laggy—they’re fighting for the browser’s limited resources.
    So, despite the fact that a page''s loading sequence is often a great time to
    flaunt all your motion design skills, it''s best to restrain yourself if you want
    to avoid users the first impression that your site is laggy.


    A similar concurrency bottleneck arises when any animations occur at once on a
    page—regardless of where they take place in the page''s lifecycle. In these situations,
    browsers can choke under the stress of processing many styling changes at once,
    and stuttering can occur.


    Fortunately, there are some clever techniques for reducing concurrent animation
    load.


    ## SOLUTION


    There are two approaches for addressing the concurrency issue: staggering and
    breaking up animations into sequences.


    ### STAGGER


    One way to reduce concurrent animation load is to make use of Velocity''s UI pack''s
    stagger feature, which delays the start times of successive animations in a set
    of elements by a specified duration. For example, to animate every element in
    a set toward an opacity value of 1 with successive 300ms delays between start
    times, your code might look like this:


    ```javascript

    $elements.velocity({ opacity: 1 }, { stagger: 300 });

    ```


    The elements are no longer animating in perfect synchronization; instead, the
    very start of the entire animation sequence, only the first element is animating.
    Later, at the very end of the entire sequence, only the last element is animating.
    You are effectively spreading out the animation sequence''s total workload so
    that the browser is always performing work at one time than it would have had
    it been animating every element simultaneously. What''s more, implementing staggering
    your motion design is often a good aesthetic choice.(Chapter 3, "Motion Design
    Theory," further explores the merits of staggering.)


    ### MULTI-ANIMATION SEQUENCES


    There''s one more clever way to reduce concurrent load: break up property animations
    into multi-animation sequences. Take, for example, the case of animating an element''s
    opacity value. This is typically a relatively low-stress operation. But, if you
    were to simultaneously animate the element''s width and box-shadow properties,
    you''d be giving the browser appreciably more work to perform: more pixels will
    be affected, and more computation required.


    Hence, an animation that looks like this:


    ```javascript

    $images.velocity({ opacity: 1, boxShadowBlur: "50px" });

    ```


    might be refactored into this:


    ```javascript

    $images

    .velocity({ opacity: 1 })

    .velocity({ boxShadowBlur: "50px" });

    ```


    The browser has less concurrent work to do since these individual property animations
    occur one after another. Note that the creative tradeoff being made here is that
    we''ve opted to prolong the total animation sequence duration, which may or may
    not be desirable for your particular use case.


    Since an optimization such as this entails changing the intention of your motion
    design, this is not a technique that should always be employed. Consider it a
    last resort. If you need to squeeze additional performance out of low-powered
    devices, then this technique may be suitable. Otherwise, don''t pre-optimize the
    code on your site using techniques like this, or you''ll end up with unnecessarily
    bloated and ineffective code.

