- md: "\nNote that, instead of removing an element from the page's flow, you can simply\
    \ mark the element as invisible and non-interactive by setting its visibility\
    \ to \"hidden\". This is useful for when you want a hidden element to continue\
    \ taking up space on the page:\n\n```javascript\n// Fade an element to opacity:0\
    \ then make it non-interactive\nelement.velocity({ opacity: 0 }, { visibility:\
    \ \"hidden\" });\n```\n\nNow, let's consider animations in the opposite direction\
    \ (showing elements instead of hiding elements): When display or visibility is\
    \ set to a value other than \"none\" or \"hidden\", the value is set *before*\
    \ the animation begins so the element is visible throughout the duration of the\
    \ ensuing animation. In other words, you're undoing the hiding that occurred when\
    \ the element was previously removed from view.\n\nBelow, display is set to \"\
    block\" before the element begins fading in:\n$element.velocity({ opacity: 1 },\
    \ { display: \"block\" });\n\nThis effectively replaces the jQuery equivalent:\n\
    \n```javascript\n$element\n.show()\n.animate({ opacity: 0 });\n```\n\n> TIP: For\
    \ a complete overview of Velocity's animation options, consult the documentation\
    \ at VelocityJS.org.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_43_0.png)\n\n\
    # CONTAINING ANIMATION LOGIC\n\nAs with Velocity's delay option, Velocity's incorporation\
    \ of CSS display and visibility setting allows for animation logic to be fully\
    \ contained within Velocity. In production code, whenever an element is faded\
    \ into or out of view, it's almost always accompanied by a change in display or\
    \ visibility. Leveraging Velocity shorthands like these helps you keep your code\
    \ clean and maintainable, since it's less dependent on external jQuery functions\
    \ and free of repetitive helper functions that commonly bloat animation logic.\n\
    \nNote that Velocity includes shorthands for the opacity toggling animations demonstrated\
    \ above. They function identically to jQuery's fadeIn and fadeOut functions. You\
    \ simply pass the corresponding command into Velocity as the first argument, and\
    \ you pass in an options object, if desired, as normal:\n\n```javascript\n$element.velocity(\"\
    fadeIn\", { duration: 1000 });\n$element.velocity(\"fadeOut\", { duration: 1000\
    \ });\n```\n\n# USING VELOCITY: ADDITIONAL FEATURES\n\nAdditional Velocity.js\
    \ features that are worthy of note include: the reverse command, scrolling, colors,\
    \ and transforms (translation, rotate, and scale).\n\n# REVERSE COMMAND\n\nTo\
    \ animate an element back to the values prior to its last Velocity call, pass\
    \ in \"reverse\" as Velocity's first argument. The reverse command behaves identically\
    \ to a standard Velocity call; it can take options and is queued up with other\
    \ chained Velocity calls.\n\nReverse defaults to the options (duration, easing,\
    \ etc.) used in the element's prior Velocity call. However, you can override these\
    \ options by passing in a new options object:\n\n```javascript\n// Animate back\
