    所以，你手头有这本书是一件好事。Julian Shapiro 是网页动画领域的顶级专家之一。在创建和支持 Velocity.js 的过程中，他对在网站上使用动效果的所有特性和优势都有了深入的了解。《使用
    JavaScript 的网页动画》一书不仅将为你提供在网站实现动画的技术知识，更重要的是，将提供你有效使用动画并打造引人用户体验所需的洞察力。


    动画库和技术让动态设计比以往任何时候都变得更容易实现。但并非每个开发者都遵循最佳实践。过去几年中，出现了几种流行的反模式层来又去。滚动行为被劫持了；移动端导航被推到了只有通过手势才能访问的菜单中。对于任何偶然遇到
    `.animate()` 的人来说，添加动画并非难事，但利用它来提升用户体验是一个专注开发者的标志之一。这本书将帮助你成为其中之一。


    David DeSandro

    2015年2月

    纽约布鲁克林


    David DeSandro 是 Metafizzy 的创始人，Masonry 和 Isotope 的作者/开发者。


    # 引言


    在网页的早期，动画主要被初级开发者用作最后的手段，以引起用户对页面某些部分的注意。即使他们希望动画超越其小众领域，也做不到：浏览器（以及计算机）的速度实在太慢，无法提供流畅的基于
    Web 的动画。


    从闪烁横幅广告、滚动新闻条和 Flash 开场动画时代起，我们已经很远。今天，iOS 和 Android 惊人的动态设计极大地提升了用户体验——而不是损害它。顶级网站和
    App 的开发者利用动画来提高用户界面的手感和直观性。动画重要性的提升不仅仅是处理能力提高的副产品；它反映了开发社区对最佳实践的更好理解。你用来制作网站的工具现在被认为没有生成的最终用户体验质量重要。尽管这显而易见，但过去并非如此。


    那么，究竟是什么让动画特别有用呢？无论是在内容块之间切换、指定复杂的加载序列，还是提醒用户该做什么，动画都与文本和布局互形成补，强化网站预期的行为、个性和视觉高级感。你的内容是以友好的方式跳入视野，还是横扫屏幕？这是动态设计的范畴，你所做出的决定将建立你
    App 的优越感。


    当用户向他人推荐你的 App 时，他们通常会尝试用“丝滑”或“精细”等词来描述它。他们没有意识到，这仅仅指的是投入界面的动态设计工作。这种外行人无法区分的区别，正是伟大的用户界面
    (UI) 设计师追求的：既能增强界面目标又不会分散用户注意力的动画。


    这本书为你提供了必要的基础，使你能够自信地实现动画，并且在技术上是可维护的，在视觉上是有冲击力的。在整个过程中，它考虑了用动态设计丰富页面与避免不必要的修饰之间的平衡。


    为什么这一切如此重要？为什么你值得花时间去完善你的过渡和缓动组合？这与设计师花费数小时完善他们的字体和颜色组合的原因相同：精制的产品感觉上更优越。它们让用户在转身告诉朋友之前自言自语：“哇，这太酷了”，然后转而对朋友说：“你一定要看看这个！”


    > **注意：** 如果你不熟悉基础 CSS 属性，在阅读这本书之前，你应该先读一本入门的 HTML 和 CSS 书籍。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_16_0.png)


    # 第1章


    # JavaScript 动画的优势


    在本章中，我们将比较 JavaScript 和 CSS 在动画用途上的区别，并介绍 JavaScript 提供的独特功能和工作流优势。


    简而言之，我们提供了所需的背景，帮助你理解在书中关于 JavaScript 将学习的所有内容。


    # JAVASCRIPT 对比 CSS 动画


    网页开发社区中存在一个误区，认为 CSS 动画是在 Web 上实现动画的唯一高效方式。这种误解导致许多开发者完全放弃了基于 JavaScript 的动画，迫使他们：


    - 在样式表中管理整个用户界面 (UI) 交互，这会迅速变得难以维护。

    - 牺牲对实时动画计时的控制，这只有在 JavaScript 中才能实现。（计时控制对于设计响应用户拖拽输入的 UI 是必要的，例如移动 App 中常见的界面。）

    - 无法实现基于物理的动态设计，这种设计允许网页上的元素像现实世界中的物体一样。

    - 失去对旧版本浏览器的支持，这些浏览器在全球范围内仍然流行。


    基于 JavaScript 的动画实际上实际上与基于 CSS 的动画一样快。CSS 动画被误认为具有显著优势，因为它最常与 jQuery 的动画功能进行比较，而事实上后者非常慢。然而，完全跳过
    jQuery 的其他 JavaScript 动画库通过简化它们与页面的交互交付了极佳的性能。


    > 注意：一个值得注意的库（我们将在书中一直使用它）是 Velocity.js。它轻量级但功能极其丰富，并且镜像了 jQuery 的动画语法，以帮助消除学习曲线。


    当然，CSS 非常适用于悬停状态动画（例如，当鼠标悬停在链接上时改变链接颜色），这通常是基础网页中包含动画的全部范围。CSS 过渡可以无缝地集成到现有的样式表中，允许开发者避免因不必要的
    JavaScript 库导致页面臃肿。此外，CSS 动画开箱即用即可提供极性能。


    但这本书将证明，为什么在简单的悬停状态动画之外，JavaScript 往往是动画的优越选择。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_19_0.png)


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_20_0.png)


    # 卓越的性能


    JavaScript 和 jQuery 被错误地混淆。JavaScript 动画是很快的。尽管 jQuery 非常强大，它并没有设计用于高性能的动画引擎。由于
    jQuery 的代码会导致动画出现抖动。JavaScript 动画库通过简化它们与页面的交互交付了极佳的性能。轻量级但功能极其丰富，并且镜像了 jQuery
    的动画语法以帮助消除学习曲线。


    这个主题我们将在第 7 章“动画性能”中深入探讨。通过学习浏览器渲染性能的细微差别，你将为所有浏览器构建可靠动画的基础，无论它们的处理能力如何。


    # 特性


    当然，速度不是使用 JavaScript 的唯一理由——其功能的丰富性同样重要。让我们过一遍几个 JavaScript 特有的功能。


    # 页面滚动


    页面滚动是基于 JavaScript 动画最流行的用途之一。网页设计的一个近期趋势是创建大型网页，在滚动页面时将新内容动画到视图。


    JavaScript 动画库（如 Velocity）提供了简单的函数来滚动元素：


    ```javascript

    $element.velocity("scroll", 1000);

    ```


    这使用 Velocity 的 "scroll" 命令在 1000ms 内将浏览器滚动到元素的顶边缘。注意，Velocity 的语法与 jQuery 的 $.animate()
    函数几乎相同，后者将在本章后面介绍。


    # 动画反转


    动画反转是撤销元素之前动画的实用快捷方式。通过调用反转命令，你正在指示元素回到其上次动画之前的值。反转的一个常见用例是将模态框动画到视图，并在用户按下关闭时隐藏它。


    未优化的反转工作流包括跟踪每个可能随后进行反转的元素最后动画的属性。不幸的是，在 UI 代码中跟踪之前的动画状态会迅速变得复杂。相比之下，使用反转命令，Velocity
    会为你记住一切。


    模仿 Velocity滚动命令的语法，反转命令的调用是通过将 "reverse" 作为 Velocity 的第一个参数来实现的：


    ```javascript

    // 第一次动画：将元素的透明度向 0 动画

    $element.velocity({ opacity: 0 });

    // 第二次动画：向初始透明度值 1 动画

    $element.velocity("reverse");

    ```


