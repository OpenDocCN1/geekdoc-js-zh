    # 结语


    如果你对目前读的内容感兴趣，并想学习更多关于使用 SVG 的知识，请查看这些优质资源：


    - 欲全面了解 SVG 元素的使用，请参考 Joni Tryhall 编写精彩且免费的 [SVG Pocket Guide](https://github.com/jonitrhythall/svgpocketguide)。

    - 如需 SVG 元素类型及其属性的目录，请咨询 Mozilla 开发者网络（https://developer.mozilla.org/en-US/docs/Web/SVG）。

    - 如需 Velocity 可以动画的所有 SVG 属性和样式属性列表，请参考 VelocityJS.org/#svg。


    # 第 7 章


    ## 动画性能


    性能影响一切。性能的提升——无论是表面的还是真实的——都能极大改善用户体验（UX），从而增加公司的利润。多项重大研究已经证明，搜索引擎上的延迟增加会导致人均收入大幅下降。直白地说，人们讨厌等待。


    正如第 1 章所解释的，JavaScript 性能与 CSS 动画相当。因此，如果你正在使用如 Velocity.js 这样的现代动画引擎，那么你动画应用的性能瓶颈就是你自己的代码。这本章要探索的：跨所有浏览器和设备编写高性能动画的技术。


    # 网络性能的现实


    如果你曾想过为什么运行并发动画会让 UI 变慢，或者为什么你的网站在移动设备上运行缓慢，那么这一章就是为你准备的。


    动画对于浏览器来说是一项非常消耗资源的过程，但有很多技术可以帮助浏览器尽可能高效地工作。我们即将学习这些技术。


    从 UI 设计的角度来看，并不缺关于讲述构建移动优先、响应式网站优点的文章。相反，从 UI 性能的角度来看，我们大多数开发者并不知道最佳实践是什么，也不知道该如何遵循它们。跟上网络性能的发展趋势令人目应不暇且往往是徒劳的；我们被浏览器和设备的特性所束缚，这些特性是系统中设备（桌面电脑、智能手机和平板）和浏览器（Chrome、Android、Firefox、Safari、Internet
    Explorer）数量庞大的产物。考虑到这些平台正在不断更新，我们经常会放弃，并尽可能地搁置性能问题，这并不奇怪。有时，如果我们不确定如何在不牺牲性能的情况下实现动画，甚至可能想完全放弃动画。


    我们对自己说：


    > 既然设备变得越来越快，用户会不断升级硬件，我的网站会变得越来越高效。


    不幸的是，全球的现实恰恰相反：发展中国家正在采用的智能手机性能还不如我们口袋里最新的 iPhone。你真的想要放弃为未来几批上线的人构建产品吗？即将到来的
    Firefox OS 倡议将为数亿人带来功能强大的智能手机，所以我们不仅仅是在空谈假设性的事情。移动革命已经到来。


    注意：爱立信（Ericsson）报告称，全球智能手机用户数将在未来五年内从 19 亿增长到 59 亿——这几乎完全是由发展中国家的推动。


    # 性能影响一切。


    如果你的直觉是：“这不是我的问题——我的应用只是给给发达国家精通技术的中产阶级的”，那么请放心，你那邪恶的网络开发者双胞胎正坐在两千英里外，正想着如何通过实际付出必要的努力在低功耗设备上提供优质体验，从而比你先一步进入新兴市场。（事实上，有一个专门从事此事的巨头——在
    Google 上搜索“Rocket Internet”。）


    忽视性能问题还有另一个糟糕的现实：我们系统性地犯了一个错误，即在理想负载下运行的设备上测试网站。而实际上，用户同时运行着多个应用和浏览器标签。他们的设备在任何时候都在加班处理数十个任务。因此，为你的应用建立的性能基准可能无法反映它在真实世界中的性能。糟糕！


    但是，别担心，热心的开发者。是时候探索你可以利用的性能技术并提升你的动画水平了。


    # 技术：消除布局抖动（LAYOUT THRASHING）


    布局抖动（Layout thrashing）——DOM 操作缺乏同步——是动画性能中的“大头”。虽然没有无痛苦的解决方案，但有最佳实践。让我们探索一下。


    # 问题


    考虑网页操作是如何由设置（set）和获取（get）构而成的：你可以设置（更新）或获取（查询）元素的 CSS 属性。同样，你可以向页面插入新元素（一次设置），或者查询一组现有的元素（一次获取）。获取和设置是产生性能开销（另一种图形渲染）的浏览器核心过程。可以将其比作：在元素上设置了新属性后，浏览器必须计算你的更改所产生的影响。例如，更改一个元素的宽度可能会触发链反应，该元素的父元素、兄弟元素和子元素也必须根据各自的
    CSS 属性发生变化。


    UI 性能下降发生在交替调用设置和获取时，被称为布局抖动。虽然浏览器对页面布局重新计算进行了高度优化，但布局抖动会大大削弱这些优化的程度。例如，一次性执行一系列获取可以很容易被浏览器优化为单一的流式操作，因为浏览器可以在第一次获取后缓存页面状态，然后在后续每次获取中引用该状态。然而，重复地一个一个执行获取会强制浏览器进行大量沉重工作，因为它的缓存会被设置操作所做的更改不断失效。


    当布局抖动发生在动画循环内部时，这种性能影响会加剧。考虑动画循环旨在实现每秒 60 帧，这是人眼感知丝滑运动的阈值。这意味着动画循环中的每一次刷新（tick）都必须在
    16.7 毫秒内完成（1/60 ticks $\approx$ 16.67ms）。布局抖动是导致每次刷新超过此限制的非常简单的方法。最终结果自然是，你的动画将会卡顿（在网络动画术语中称为
    jank）。


    虽然某些动画引擎（如 Velocity.js）包含了以减少其内部动画循环中布局抖动频率的优化，但请务必避免在自己的循环中产生布局抖动，例如 `setInterval()`
    或自执行 `setTimeout()` 内部的代码。


    # 解决方案


    避免布局抖动只需将 DOM 设置操作和 DOM 获取操作合并在一起即可。以下代码会导致布局抖动：


    ```

    // 坏做法

    var currentTop = $("element").css("top"); // Get

    $("element").style.top = currentTop + 1; // Set

    var currentLeft = $("element").css("left"); // Get

    $("element").style.left = currentLeft + 1; // Set

    ```


    如果你重写代码使所有的查询和更新对齐，浏览器就能捕捉到反应式动作，并减少此代码引起布局抖动的程度：


    ```

    var currentTop = $("element").css("top"); // Get

    var currentLeft = $("element").css("left"); // Get

    $("element").css("top", currentTop + 1); // Set

    $("element").css("left", currentLeft + 1); // Set

    ```


    所示的问题在生产代码中很常见，特别是在根据元素 CSS 属性的当前值执行 UI 操作的情况下。


    假设你的目标是在点击按钮时切换侧边菜单的可见性。为了实现这一目标，你可能会首先检查侧边菜单的显示属性（display）是否被设置为 "none" 或 "block"，然后根据情况交替值。检查显示属性的过程构成一次获取，而随后采取的显示或隐藏侧边菜单的任何操作将构成一次设置。


    '
