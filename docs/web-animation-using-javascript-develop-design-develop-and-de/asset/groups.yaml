  - '[PAGE 119]


    # CREATING IMAGES THROUGH CODE


    An SVG element is a type of DOM element that borrows the syntax of the HTML elements
    you''''re already familiar with to define arbitrary shapes. SVG elements differ
    from HTML elements in that they have unique tags, attributes, and behaviors that
    allow them to define graphic shapes. Another way, SVG lets you create images through
    code. This is a tremendously powerful concept which means you can programmatically
    style and animate these shapes using JavaScript and CSS. In addition SVG offers
    many other benefits:


    +   - SVG compresses incredibly well. Graphics defined in SVG have smaller file
    sizes than their PNG/JPEG equivalents, which can greatly improve site load times.

    - SVG graphics scale to any resolution without a loss of clarity. Unlike standard
    image formats, they look razor sharp across all devices—say good-bye to blurry
    images on mobile screens.

    - Like HTML elements, SVG elements can be assigned event handlers that respond
    to a user''s input, which means the graphics on your page can be made interactive.
    If you so desired, all the buttons on your site could be turned into animated
    graphics.

    - Many photo-editing apps (including Adobe Photoshop, Sketch, and Inkscape) let
    you export your design work into SVG format for quick copying and pasting into
    HTML. So, even if you don''t consider yourself an artist, you can leverage third-party
    applications to do the designing for you.


    In short, SVGs are an amazing graphics solution. Let''s dive in!'
  - "[PAGE 120]\n\n# SVG MARKUP\n\nSVG elements are defined within a parent <svg>\
    \ container. Specifying the width and height dimensions of container element defines\
    \ the canvas that your SVG graphics render upon:\n\n```\n<svg version=\"1.1\"\
    \ width=\"500\" height=\"500\"\nxmlns=\"http://www.w3.org/2000/svg\">\n  <circle\
    \ cx=\"100\" cy=\"100\" r=\"30\" />\n  <rect id=\"rect\" x=\"100\" y=\"100\" width=\"\
    200\" height=\"200\" />\n</svg>\n```\n\nWithin <svg>, you can insert SVG shapes\
    \ of varying sorts. The above example has a circle element followed by a rect\
    \ (rectangle). As with normal HTML elements, SVG elements accept height and width\
    \ attributes, which are used here for demonstration purposes, but it is considered\
    \ best practice to specify SVG styling properties within a CSS stylesheet. Also\
    \ as with HTML, stylesheet classes target SVG elements via their id, class, or\
    \ tags.\n\nWhere the SVG and HTML specifications fundamentally differs in their\
    \ range of accepted attributes and CSS properties. SVG elements accept only a\
    \ few of the standard CSS properties. Further, SVGs accept a special set of attributes,\
    \ *presentational attributes*, which include fill, and y. and y. (fill specifies\
    \ which color to fill a shape, whereas x and y define the position of the element's\
    \ top-left corner). These attributes define how an element is visually rendered\
    \ on its canvas. Lets run through a few of them, using rect as a sample SVG element:\n\
    \n```\n<rect id=\"rect\" x=\"100\" y=\"100\" width=\"200\" height=\"200\" />\n\
    ```\n\nHere, the width and height attributes work as you expect. The unique x\
    \ and y attributes define the rectangle's coordinates within the canvas. These\
    \ values simply position the rectangle relative to an x = 0, y = 0 origin point.\
    \ Unlike HTML, SVG positioning is not defined with top, right, bottom, left, float,\
    \ or margin CSS properties; SVG positioning logic is dictated by explicitly defined\
    \ coordinates. In other words, an SVG element's positioning doesn't affect the\
    \ position of its sibling elements; instead of pushing each other around the page,\
    \ SVG siblings simply overlap one another."
- md: "\nNow's take a look at the circle element. Its rendering is specified via coordinates\
    \ that designate its center point (cx and cy) along with a radius value (r) that\
    \ designates its length:\n\n```\n<circle cx=\"100\" cy=\"100\" r=\"30\" />\n```\n\
    \nPretty simple, right? SVG elements use the same markup structure as HTML elements,\
    \ so all the code samples in this chapter should feel familiar.\n\nNote that there\
    \ are many other types of SVG elements, including ellipse, line, and text. See\
    \ the end of this chapter for further details.\n\n# SVG STYLING\n\nSVG elements\
    \ accept a variety of special styling properties that are not available to HTML\
    \ elements. SVG's fill property, for example, is similar to background-color in\
    \ CSS, stroke is similar to border-color, and stroke-width is similar to border-width.\
    \ Take a look at this example:\n\n```\n<svg version=\"1.1\" width=\"500\" height=\"\
    500\"\nxmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"100\" cy=\"100\" r=\"\
    30\" style=\"fill: blue\" />\n<rect id=\"rect\" x=\"100\" y=\"100\" width=\"200\"\
    \ height=\"200\"\nstyle=\"fill: green; stroke: red; stroke-width:5px\" />\n</svg>\n\
    ```\n\nAbove, the circle element is filled with solid blue, and the rect element\
    \ is filled with solid green. Additionally, the rectangle has a red border with\
    \ a thickness of 5px.\nThere are many other SVG-specific styling properties. For\
    \ now, it's simply important for you to know that they exist so you'll pay extra\
    \ attention when trying to animate CSS properties on SVG elements.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_122_0.png)\n\
    \n> NOTE: Refer to the \"Wrapping up\" section of this chapter for information\
    \ on where to find a full listing of SVG styling properties.\n\n# SUPPORT FOR\
    \ SVG\n\nOut-of-the-box support for SVG element animation isn't great: neither\
    \ jQuery nor CSS offers complete support for animating SVG-specific styling properties\
    \ and transform attributes. Further, CSS transitions can't animate SVG elements\
    \ at all on Internet Explorer 9, and CSS can't be used to transform animations\
    \ to SVG elements on any version of Internet Explorer.\n\nTo gain comprehensive\
    \ SVG animation support, use either a dedicated SVG library or an animation library\
    \ that has built-in support for SVG elements. One noteworthy dedicated SVG library\
    \ is Snap.svg. It probably won't surprise you to learn that Velocity.js, the JavaScript\
    \ animation library you've been using throughout this book, provides full support\
    \ for SVG element animation.\n\n> **NOTE:** Go to SnapSVG.io to download the Snap.svg\
    \ library.\n\n# SVG ANIMATION\n\nSVG elements might never be the backbone of your\
    \ UI, but they're certainly appropriate for spicing up the parts of your page\
    \ that you'd normally fill with static images. SVGs include:\n\n- Buttons with\
    \ intricate animation sequences that are triggered when users hover and click.\n\
    - Unique loading status graphics that replace the all-too-common rotating indicator\
    \ GIF.\n- Company logos whose individual parts animate together upon page load.\n\
    \nThis last use case is explored in more detail later in this chapter.\n\n# PASSING\
    \ IN PROPERTIES\n\nWith Velocity, SVG properties are animated in the same way\
    \ that standard CSS properties. Pass the appropriate properties and their desired\
    \ end values into Velocity's properties object:\n\n```\n// Animate an SVG element\
    \ to a red fill and a black stroke\n$svgElement.velocity({ fill: \"#ff0000\",\
    \ stroke: \"#000000\" });\n```\n\nIn contrast, note that the code below would\
    \ not work since the following CSS properties are not supported by SVG elements:\n\
    \n```\n// Incorrect: These properties don't apply to SVG elements\n$svgElement.velocity({\
    \ borderRadius: \"px\", borderColor: \"#000000\" });\n```\n\n# PRESENTATIONAL\
    \ ATTRIBUTES\n\nThe presentational attributes explored earlier in this chapter\
    \ are also animated as as expected:\n\n```\n// Animate the x and y coordinates\
    \ of a rectangle\n$(\"rect\").velocity({ x: 100, y: 100 });\n// Animate the cx\
    \ and cy coordinates of a circle\n$(\"circle\").velocity({ cx: 100, cy: 100 });\n\
    // Animate the dimensions of a rectangle\n$(\"rect\").velocity({ width: 200, height:\
    \ 200 });\n// Animate the radius of a circle\n$(\"circle\").velocity({ r: 100\
    \ });\n```\n\nAll the Velocity features you're currently using—animation reversal,\
    \ UI pack effects, sequence triggering, and so on—work as expected with SVG elements.\n\
    \n# POSITIONAL ATTRIBUTES VS. TRANSFORMS\n\nYou might be wondering what the difference\
    \ is between using the x, cx, y, and cy positional attributes instead of CSS transforms\
    \ (e.g. translateX, translateY) when specifying the properties of SVG elements.\
    \ The answer is browser support. Internet Explorer (up to and including Internet\
    \ Explorer 11) does not support CSS transforms on SVG elements. Consider the following:\n\
    \n- The x and y attributes work everywhere where SVG elements (IE8+, Android 3+)\n\
    $(\"rect\").velocity({ x: 100, y: 100 });\n- Alternatively, positional transforms\
    \ (such as translateX and translateY) work everywhere *except* Internet Explorer\n\
    $(\"rect\").velocity({ translateX: 100, translateY: 100 });\n\n> NOTE: Although\
    \ transforms are known to be particularly performant hard by hardware acceleration\
    \ (read more on this in Chapter 7, \"Animation Performance\"), both approaches\
    \ to SVG animation are equally fast since SVG graphics are hardware-accelerated\
    \ by default.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_126_0.png)\n\n# IMPLEMENTATION\
    \ EXAMPLE: ANIMATED LOGOS\n\nHigh-resolution site logos that animate into place\
    \ upon page load are ideal targets for SVG implementation. Suppose you wanted\
    \ to crudely replicate the MasterCard logo, which consists of two overlapping\
    \ circles of different colors. If you were to animate this logo into place using\
    \ Velocity, you'd start with an SVG canvas defined as follows:\n\n```\n<svg version=\"\
    1.1\" width=\"500\" height=\"500\"\nxmlns=\"http://www.w3.org/2000/svg\">\n  <circle\
    \ id=\"circleLeft\" cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: red\" />\n  <circle\
    \ id=\"circleRight\" cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: orange\" />\n\
    </svg>\n```\n\nThis creates two overlapping circles with identical radii. Next,\
    \ you'd animate the circles outward from their origins so that they overlap slightly:\n\
    \n```\n// Move one circle toward the left\n$(\"circleLeft\").velocity({ cx: \"\
    -15px\" }, { easing: \"spring\" });\n// Move one circle toward the right\n$(\"\
    circleRight\").velocity({ cx: \"+15px\" }, { easing: \"spring\" });\n```\n\nHere,\
    \ the left circle is animated 15 pixels leftward using the \"-\" operator to decrement\
    \ the circle's current value and the right circle is animated 15 pixels right.\
    \ The spring easing provides added flair by making the circles bounce away from\
    \ one another with impulsive force.\n\nSince SVG elements can listen for mouse-based\
    \ events (clicks, hovers, and so on), you could improve this demo by turning it\
    \ into an example of SVG element interaction. With the aid of jQuery and Velocity,\
    \ such an implementation could look like this:\n\n```\n$(\"svg\").on(\"mouseover\
    \ mouseout\", function() {\n  $(\"circleLeft, #circleRight\").velocity(\"reverse\"\
    );\n});\n```\n\nThis triggers a reversal of the circles' page-load animation when\
    \ the user hovers on or off the SVG element. The single line of code accomplishes\
    \ this by leveraging Velocity’s reverse animation command. In effect, when the\
    \ user first hovers, the page-load animation is reversed. When the user then hovers\
    \ off, the reversal is itself reversed, bringing the logo back to its original\
    \ form.\n"
  mdcn: "\n\n现在来看圆形元素（circle element）。它的渲染通过坐标指定，这些坐标定义了中心点（cx 和 cy）以及指定长度的半径值（r）：\n\
    \n```\n<circle cx=\"100\" cy=\"100\" r=\"30\" />\n```\n\n非常简单，对吧？SVG 元素使用了与 HTML\
    \ 元素相同的标记结构，因此本章中的所有代码示例看起来都很熟悉。\n\n请注意，还有许多类型的 SVG 元素，包括椭圆、线条和文本。更多细节请参阅本章末尾。\n\
    \n# SVG 样式\n\nSVG 元素接受多种 HTML 元素不具备的特殊样式属性。例如，SVG 的 `fill` 属性类似于 CSS 中的 `background-color`，`stroke`\
    \ 类似于 `border-color`，而 `stroke-width` 类似于 `border-width`。看这个示例：\n\n```\n<svg version=\"\
    1.1\" width=\"500\" height=\"500\"\nxmlns=\"http://www.w3.org/2000/svg\">\n<circle\
    \ cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: blue\" />\n<rect id=\"rect\" x=\"\
    100\" y=\"100\" width=\"200\" height=\"200\"\nstyle=\"fill: green; stroke: red;\
    \ stroke-width:5px\" />\n</svg>\n```\n\n上方，圆形元素填充了实蓝色，矩形（rect）元素填充了实绿色。此外，矩形有一个厚度为\
    \ 5px 的红色边框。\n还有许多其他 SVG 特有的样式属性。目前，重要的是让你知道它们的存在，这样当你尝试对 SVG 元素进行 CSS 属性动画时就会额外注意。\n\
    \n![](img/66399f6bc0b186cf74d5dbe299211a7c_122_0.png)\n\n> 注意：请参阅本章的“总结”部分，获取有关\
    \ SVG 样式属性完整列表的信息。\n\n# 对 SVG 的支持\n\n对 SVG 元素动画原生支持并不完美：jQuery 和 CSS 都没有对 SVG\
    \ 特有的样式属性和变换（transform）属性提供完整支持。此外，CSS 过渡在 Internet Explorer 9 上完全无法动画 SVG 元素，并且在任何版本的\
    \ Internet Explorer 中都无法使用 CSS 将变换应用于 SVG 元素。\n\n为了获得全面的 SVG 动画支持，请使用专用的 SVG 库或内置支持\
    \ SVG 元素的动画库。一个值得注意的专用 SVG 库是 Snap.svg。你可能不会惊讶于发现，你在书中一直使用的 JavaScript 动画库 Velocity.js\
    \ 为 SVG 元素动画提供了完全支持。\n\n> **注意：** 前往 SnapSVG.io 下载 Snap.svg 库。\n\n# SVG 动画\n\n\
    SVG 元素可能永远不会是你 UI 的骨干，但它们绝对适合装饰页面中那些通常用静态图像填充的部分。SVG 包括：\n\n- 具有复杂动画序列的按钮，当用户悬停和点击时会触发。\n\
    - 独特的加载状态图形，取代了过于常见的旋转指示器 GIF。\n- 在页面加载时其各个部分会协同动画的公司 Logo。\n\n最后一个用法用例将在本章稍后的部分进行更详细的探讨。\n\
    \n# 传递属性\n\n使用 Velocity 时，SVG 属性的动画方式与标准 CSS 属性相同。将相应的属性及其所需的结束值传入 Velocity 的属性对象中：\n\
    \n```\n// 将 SVG 元素动画变为红色填充和黑色描边\n$svgElement.velocity({ fill: \"#ff0000\", stroke:\
    \ \"#000000\" });\n```\n\n相比之下，请注意下面的代码将无法工作，因为 SVG 元素不支持以下 CSS 属性：\n\n```\n//\
    \ 错误：这些属性不适用于 SVG 元素\n$svgElement.velocity({ borderRadius: \"px\", borderColor:\
    \ \"#000000\" });\n```\n\n# 表现属性\n\n本章之前探讨的表现属性也可以如预期地进行动画处理：\n\n```\n// 动画化矩形的\
    \ x 和 y 坐标\n$(\"rect\").velocity({ x: 100, y: 100 });\n// 动画圆形的 cx 和 cy 坐标\n$(\"\
    circle\").velocity({ cx: 100, cy: 100 });\n// 动画矩形的尺寸\n$(\"rect\").velocity({\
    \ width: 200, height: 200 });\n// 动画圆形的半径\n$(\"circle\").velocity({ r: 100 });\n\
    ```\n\n你目前正在使用的所有 Velocity 功能——动画反转、UI 组效果、序列触发等——在 SVG 元素上都能按预期工作。\n\n# 位置属性对比.\
    \ 变换\n\n你可能会好奇，在指定 SVG 元素的属性时，使用 x, cx, y 和 cy 位置属性而不是 CSS 变换（例如 translateX, translateY）有什么区别。答案是浏览器兼容性。Internet\
    \ Explorer（包含 Internet Explorer 11）不支持 SVG 元素上的 CSS 变换。考虑以下情况：\n\n- x 和 y 属性在支持\
    \ SVG 元素的地方（IE8+, Android 3+）均有效。\n$(\"rect\").velocity({ x: 100, y: 100 });\n\
    - 或者，位置变换（如 translateX 和 translateY）在 Internet Explorer *之外*的所有地方都有效。\n$(\"rect\"\
    ).velocity({ translateX: 100, translateY: 100 });\n\n> 注意：虽然已知变换通过硬件加速具有特别的性能（在第\
    \ 7 章中阅读更多内容），但 SVG 动画的两种方法都一样快。\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_126_0.png)\n\
    \n# 实现示例：动画 Logo\n\n高分辨率 Logo 在页面加载时进入动画是 SVG 实现的理想目标。假设你想粗略地复制 MasterCard Logo，它由两个不同色的重叠圆形组成。如果你使用\
    \ Velocity 对此 Logo 进行动画，将从如下 SVG 画布开始：\n\n```\n<svg version=\"1.1\" width=\"500\"\
    \ height=\"500\"\nxmlns=\"http://www.w3.org/2000/svg\">\n  <circle id=\"circleLeft\"\
    \ cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: red\" />\n  <circle id=\"circleRight\"\
    \ cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: orange\" />\n</svg>\n```\n\n这创建了两个半径相同的圆形。接下来，让圆形从其起点向外移动，以便它们稍微重叠：\n\
    \n```\n// 将圆形向左移动\n$(\"circleLeft\").velocity({ cx: \"-15px\" }, { easing: \"\
    spring\" });\n// 将圆形向右移动\n$(\"circleRight\").velocity({ cx: \"+15px\" }, { easing:\
    \ \"spring\" });\n```\n\n在这里，左侧圆形使用减法运算符向左移动 15 像素，右侧圆形向右移动 15 像素。弹簧缓动（spring\
    \ easing）为动画增添了韵味，使圆形以脉冲力相互弹开。\n\n由于 SVG 元素可以监听鼠标事件（点击、悬停等），你可以通过将其转换为 SVG 元素交互示例来改进此演示。在\
    \ jQuery 和 Velocity 的帮助下，这种实现可能如下所示：\n\n```\n$(\"svg\").on(\"mouseover mouseout\"\
    , function() {\n  $(\"circleLeft, #circleRight\").velocity(\"reverse\");\n});\n\
    ```\n\n这在用户悬停在或离开 SVG 元素时触发圆形页面加载动画的反转。这单行代码通过利用 Velocity 的反转动画命令实现了这一点。效果上，当用户首次悬停时，页面加载动画会被反转。当用户离开悬停时，反转本身会被反转，使\
    \ Logo 回到原始形式。\n\n"
