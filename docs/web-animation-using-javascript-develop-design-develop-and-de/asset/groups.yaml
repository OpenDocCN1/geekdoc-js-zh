    performance without compromising its look.


    As a performance-minded developer, you''re no longer allowed to arbitrarily select
    animation properties. You must now consider the impact of each of your property
    choices.


    > NOTE: Refer to CSSTiggers.com for a breakdown of how CSS properties affect browser
    performance.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_147_0.png)'
  - '[PAGE 148]


    # TECHNIQUE: REDUCE CONCURRENT LOAD


    Browsers have bottlenecks. Find out what they are and stay below them.


    # PROBLEM


    When a page first loads, the browser processes HTML, CSS, JavaScript, and images
    as quickly as possible. It should come as no surprise that animations occurring
    during this time tend to be laggy—they’re fighting for the browser’s limited resources.
    So, despite the fact that a page''s loading sequence is often a great time to
    flaunt all your motion design skills, it''s best to restrain yourself if you want
    to avoid users the first impression that your site is laggy.


    A similar concurrency bottleneck arises when any animations occur at once on a
    page—regardless of where they take place in the page''s lifecycle. In these situations,
    browsers can choke under the stress of processing many styling changes at once,
    and stuttering can occur.


    Fortunately, there are some clever techniques for reducing concurrent animation
    load.


    # SOLUTION


    There are two approaches for addressing the concurrency issue: staggering and
    breaking up animations into sequences.


    # STAGGER


    One way to reduce concurrent animation load is to make use of Velocity''s UI pack''s
    stagger feature, which delays the start times of successive animations in a set
    of elements by a specified duration. For example, to animate every element in
    a set toward an opacity value of 1 with successive 300ms delays between start
    times, your code might look like this:


    ```

    $elements.velocity({ opacity: 1 }, { stagger: 300 });

    ```'
  - '[PAGE 149]


    The elements are no longer animating in perfect synchronization; instead, the
    very start of the entire animation sequence, only the first element is animating.
    Later, at the very end of the entire sequence, only the last element is animating.
    You are effectively spreading out the animation sequence''s total workload so
    that the browser is always performing work at one time than it would have had
    it been animating every element simultaneously. What''s more, implementing staggering
    your motion design is often a good aesthetic choice.(Chapter 3, "Motion Design
    Theory," further explores the merits of staggering.)


    # MULTI-ANIMATION SEQUENCES


    There''s one more clever way to reduce concurrent load: break up property animations
    into multi-animation sequences. Take, for example, the case of animating an element''s
    opacity value. This is typically a relatively low-stress operation. But, if you
    were to simultaneously animate the element''s width and box-shadow properties,
    you''d be giving the browser appreciably more work to perform: more pixels will
    be affected, and more computation required.


    Hence, an animation that looks like this:


    ```

    $images.velocity({ opacity: 1, boxShadowBlur: "50px" });

    ```


    might be refactored into this:


    ```

    $images

    .velocity({ opacity: 1 })

    .velocity({ boxShadowBlur: "50px" });

    ```


    The browser has less concurrent work to do since these individual property animations
    occur one after another. Note that the creative tradeoff being made here is that
    we''ve opted to prolong the total animation sequence duration, which may or may
    not be desirable for your particular use case.


    Since an optimization such as this entails changing the intention of your motion
    design, this is not a technique that should always be employed. Consider it a
    last resort. If you need to squeeze additional performance out of low-powered
    devices, then this technique may be suitable. Otherwise, don''t pre-optimize the
    code on your site using techniques like this, or you''ll end up with unnecessarily
    bloated and ineffective code.'
- md: "\n## TECHNIQUE: DON’T CONTINUOUSLY REACT TO SCROLL AND RESIZE EVENTS\n\nBe\
    \ mindful of how often your code is being run. A fast snippet of code being run\
    \ 1,000 times per second may—in aggregate—no longer be very fast.\n\n## PROBLEM\n\
    \nBrowsers’ scroll and resize events are two types that are triggered at very\
    \ high rates: when a user resizes or scrolls the browser window, the browser fires\
    \ the callback functions associated with these events many times per second. Hence,\
    \ if you've registered callbacks that interact with the DOM—or worse, contain\
    \ layout thrashing—they can cause tremendously high browser load during times\
    \ of scrolling and resizing. Consider the following code:\n\n```javascript\n//\
    \ Perform an action when the browser window is scrolled\n$(window).scroll(function()\
    \ {\n  // Anything in here is fired multiple times per second while the\n  user\
    \ scrolls\n});\n\n// Perform an action when the browser window is resized\n$(window).resize(function()\
    \ {\n  // Anything in here is fired multiple times per second while the\n  user\
    \ resizes\n});\n```\n\nRecognize that the functions above aren't simply called\
    \ once when their respective events start; instead, they are called throughout\
    \ the duration of the user’s respective interaction with the page.\n\n## SOLUTION\n\
    \nThe solution to this problem is to debounce event handlers. Debouncing is the\
    \ process of defining an interval during which an event handler callback will\
    \ be called only once. For example, say you defined a debounce interval of 250ms\
    \ and the user scrolled the page for a total duration of 1000ms. The debounced\
    \ event handler code would accordingly fire only four times (1000ms/250ms).\n\n\
    The code for a debounce implementation is beyond the scope of this book. Fortunately,\
    \ many libraries exist exclusively to solve this problem. Visit davidwalsh.name/javascript-debounce-function\
    \ for one example. Further, the tremendously popular Underscore.js (UnderscoreJS.org),\
    \ a JavaScript library akin to jQuery that provides helper functions for making\
    \ coding easier, includes a debounce function that you can easily reuse across\
    \ your event handlers.\n\n**NOTE:** As of this book's writing, the latest version\
    \ of Chrome automatically debounces scroll events.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_151_0.png)\n\
    \n## TECHNIQUE: REDUCE IMAGE RENDERING\n\nNot all elements are rendered equally.\
    \ Browsers have to work overtime when displaying certain elements. Let's look\
    \ at which those are.\n\n## PROBLEM\n\nVideos and images are multimedia element\
    \ types that browsers have to work extra hard to render. Whereas the dimensional\
    \ properties of non-multimedia HTML elements can be computed with ease, multimedia\
    \ elements contain thousands of pixel-by-pixel data points that are computationally\
    \ expensive for browsers to resize, reposition, and recomposite. Animating these\
    \ elements will always be less optimal versus animating standard HTML elements\
    \ as `div`, `p`, and `table`.\n\nFurther, given that scrolling a page is nearly\
    \ equivalent to *animating a page* (think of scrolling as animating the page's\
    \ top property), multimedia elements can also drastically reduce scrolling performance\
    \ on CPU-constrained mobile devices.\n\n## SOLUTION\n\nUnfortunately, there's\
    \ no way to \"refactor\" multimedia content into faster element types, other than\
    \ turning simple, shape-based images into SVG elements whenever possible. Accordingly,\
    \ the only available performance optimization is reducing the total number of\
    \ multimedia elements that are displayed on the page at once and animated at once.\
    \ Note that the words *at once* stress a reality of browser rendering: browsers\
    \ only render what is visible. The portions of page (including the portions that\
    \ contain additional images) that *aren't* visible do not get rendered, and do\
    \ not impose additional stress on browser processes.\n\nSo, there are two best\
    \ practices to follow. First, if you're ever on the fence about adding an additional\
    \ image to your page, opt not to include it. The fewer images there are to render,\
    \ the better UI performance will be. (Not to mention the positive impact fewer\
    \ images will have on your page's network load time.)\n\nSecond, if your UI is\
    \ loading many images into view at once (say, eight or more, depending on your\
    \ device's hardware capabilities), consider not animating the images at all, and\
    \ instead crudely toggling the visibility of each image from invisible to visible.\
    \ To help counteract elegant this can look, consider staggering visibility toggling\
    \ so that the images load view one after another instead of simultaneously. This\
    \ will help the user's eye across the loading sequence, and will generally deliver\
    \ more refined motion design.\n\nNOTE: Refer to Chapter 3, \"Motion Design Theory,\"\
    \ to learn more about animation design best practices.\n\n## SNEAKY IMAGES\n\n\
    You're not done yet. There's more to this section than meets the eye, as we haven't\
    \ explored the ways in which images can materialize on a page. The obvious culprit\
    \ is the img element, but there are two other ways that images can sneak into\
    \ your pages.\n\n## CSS GRADIENTS\n\nThese are actually a type of image. Instead\
    \ of being pre-produced by a photo editor, they are produced at run-time according\
    \ to CSS styling definitions, for example, using a linear-gradient() as the background-image\
    \ value on an element. The solution is here to opt for solid-color backgrounds\
    \ instead of gradients whenever possible. Browsers can easily optimize the rendering\
    \ of solid chunks of color, but, as with images, they have to work overtime to\
    \ render gradients, which differ in color from pixel to pixel.\n\n## SHADOW PROPERTIES\n\
    \nThe evil twins of gradients are the box-shadow and text-shadow CSS properties.\
    \ These are rendered similarly to gradients, but instead of styling background-color,\
    \ they effectively stylize border-color. What's more, they have opacity falloffs\
    \ that require browsers to perform extra compositing work because the semransparent\
    \ portions of the gradients must be rendered against the elements underneath.\
    \ The solution here is the previous one: if your UI looks almost as good when\
    \ you remove these properties from your stylesheet, yourself on and never look\
    \ back. Your website's performance will thank you.\n\nThese recommendations are\
    \ simply that: recommendations. They are not performance practices since they\
    \ sacrifice your design intentions for increased performance. Considered them\
    \ only as last resorts when your site's performance is poor and you've exhausted\
    \ all other options.\n\n## TECHNIQUE: DEGRADE ANIMATIONS ON BROWSERS\n\nYou don't\
    \ have to neglect underperforming browsers and devices. If you embrace a performance-minded\
    \ workflow from day one, you can simply provide them with a degraded—but completely\
    \ functional—experience.\n\n## PROBLEM\n\nInternet Explorer 8—a slow, outdated\
    \ browser—is dying in popularity. But Internet Explorer 9, its successor, is still\
    \ widely used outside of the Americas. Further, older Android smartphones running\
    \ Android 2.3.x and below, which are slow relative to the latest-generation Android\
    \ and iOS devices, remain tremendously popular. Of every ten users to your site,\
    \ expect up to three of them to fall into one of these two groups (depending on\
    \ the type of users your app attracts). Accordingly, if your site is rich in animation\
    \ and other UI interactions, awesome will perform especially poorly for up to\
    \ a third of your users.\n\n## SOLUTION\n\nThere are two approaches to addressing\
    \ the performance issue raised by weaker devices: either broadly reduce the occurrence\
    \ of animations across your entire site, or reduce them exclusively for the weaker\
    \ devices. The former is a ultimately product decision, but the latter is a simple\
    \ technical decision that is easily implemented if you're using the global animation\
    \ multiplier technique (or Velocity's equivalent mock feature) explained in Chapter\
    \ 4, \"Animation Workflow.\" The global multiplier technique lets you dynamically\
    \ alter the timing of animations across your entire site by setting a single variable.\
    \ The trick then—whenever a weak browser is detected—is to set the multiplier\
    \ to o (or set $.Velocity.mock to true) so that all of a page's animations complete\
    \ within a single animation tick (less than 16ms):\n\n```javascript\n// Cause\
    \ all animations to complete immediately\n$.Velocity.mock = true;\n```\n"
  mdcn: "\n\n## 技术：不要对滚动和缩放事件产生连续响应\n\n请留意你的代码运行的频率。一个每秒运行 1,000 次的快速代码段——从累加来看——可能再也不算快了。\n\
    \n## 问题\n\n浏览器的滚动（scroll）和缩放（resize）事件是两种触发频率极高的事件类型：当用户缩放或滚动浏览器窗口时，浏览器每秒会触发多次与这些事件关联的回调函数。因此，如果你注册了与\
    \ DOM 交互的回调——或者更糟糕的，包含了布局抖动（layout thrashing）的回调——它们在滚动和缩放期间会导致极高的浏览器负载。考虑以下代码：\n\
    \n```javascript\n// 当浏览器窗口滚动时执行操作\n$(window).scroll(function() {\n  // 当用户滚动时，这里的任何内容\n\
    \  // 每秒内都会触发多次\n});\n\n// 当浏览器窗口缩放时执行操作\n$(window).resize(function() {\n  //\
    \ 当用户缩放时，这里的任何内容\n  // 每秒内都会触发多次\n});\n```\n\n请意识到，上述函数并非在各自事件开始时仅调用一次；相反，它们在用户与页面进行交互的持续期间都会被调用。\n\
    \n## 解决方案\n\n解决此问题是对事件处理程序进行“防抖”（debounce）。防抖是定义一个间隔的过程，在此间隔内事件处理程序回调只会被调用一次。例如，假设你定义了一个\
    \ 250ms 的防抖间隔，用户滚动页面的总时长为 1000ms。相应的，防抖后的事件处理代码只会触发四次（1000ms/250ms）。\n\n防抖实现的代码超出了本书的范围。幸运的是，有许多库专门用于解决这个问题。可以访问\
    \ davidwalsh.name/javascript-debounce-function 查看示例。此外，广受欢迎的 Underscore.js (UnderscoreJS.org)\
    \ 是一个类似于 jQuery 的 JavaScript 库，提供了许多简化编码的辅助函数，它包含一个 debounce 函数，你可以轻松地在各个事件处理程序中复用。\n\
    \n**注意：** 在编写本书时，最新版本的 Chrome 已自动对滚动事件进行防抖。\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_151_0.png)\n\
    \n## 技术：减少图像渲染\n\n并非所有元素的渲染成本都是平等的。浏览器在显示某些元素时必须付出额外努力。让我们来看看哪些是这些元素。\n\n## 问题\n\
    \n视频和图像是多媒体元素类型，浏览器必须投入额外精力来渲染。虽然非多媒体 HTML 元素的尺寸属性可以轻松计算，但多媒体元素包含了数千个像素级数据点，对于浏览器来说，调整大小、重新定位和重新组合这些数据的计算是非常昂贵的。动画这些元素的效果总是不如动画\
    \ `div`、`p` 和 `table` 等标准 HTML 元素。\n\n此外，考虑到滚动页面几乎等同于*页面动画*（将滚动想象成对页面 top 属性的动画），多媒体元素还会剧烈降低\
    \ CPU 受限的移动设备上的滚动性能。\n\n## 解决方案\n\n遗憾的是，没有办法可以将所有多媒体内容“重构”为更快的元素类型，除非尽可能将简单的基于形状的图像转换为\
    \ SVG 元素。因此，唯一可行的性能优化方法是减少页面上同时显示并同时动画的多媒体元素总数。注意，“*同时*”（at once）一词强调了浏览器渲染的一个现实：浏览器只渲染可见部分。页面中*不可见*的部分（包括包含额外图像的部分）不会被渲染，也不会给浏览器进程带来额外压力。\n\
    \n所以，有两个最佳实践需要遵循。首先，如果你对是否要在页面上添加额外的图像犹豫不决，请选择不包含。渲染的图像越少，UI 性能就越好。（更不用说减少图像对页面网络加载时间的积极影响。）\n\
    \n其次，如果你的 UI 一次加载了许多图像（例如八张或更多，取决于你的设备硬件能力），考虑完全不要对图像做动画，而是粗略地切换每个图像的可见性（从不可见变为可见）。为了防止这种做法看起来很生兀，可以考虑交替切换可见性，让图像一个接一个加载而不是同时加载。这有助于用户的视线跟随加载序列移动，并通常能提供更精的运动设计。\n\
    \n注意：请参阅第 3 章“运动设计理论”，了解更多关于动画设计的最佳实践。\n\n## 隐藏的图像\n\n你的工作还没结束。这一节的内容比表面看到的更多，因为我们还没有探索图像在页面上呈现的方式。显而易见的罪首是\
    \ `img` 元素，但还有两种方式可以让图像溜进你的页面中。\n\n## CSS 渐变\n\n这些实际上也是一种图像。它们不是由照片编辑器预先生成的，而是根据\
    \ CSS 样式定义在运行时生成的，例如在元素上使用 `linear-gradient()` 作为 `background-image` 值。解决方案是：尽可能选择纯色背景而不是渐变。浏览器可以轻松优化纯色色块的渲染，但与图像一样，它们必须投入额外精力来渲染在像素间颜色存在不同的渐变。\n\
    \n## 阴影属性\n\n渐变的“恶毒孪胎”是 `box-shadow` 和 `text-shadow` CSS 属性。它们的渲染方式与渐变类似，但它们不是样式化\
    \ `background-color`，而是有效地样式化了 `border-color`。此外，它们具有透明度衰减，这需要浏览器执行额外的合成工作，因为渐变的半透明部分必须针对底层元素进行渲染。这里的解决方案与之前相同：如果移除这些属性后\
    \ UI 看起来几乎没有区别，那就移除它们。你的网站性能会感谢你的。\n\n这些建议仅仅是建议。它们并不是性能实践，因为它们为了性能牺牲了设计意图。只有在网站性能不佳且已耗尽所有其他方案时，才将它们作为最后的手段。\n\
    \n## 技术：在浏览器上降级动画\n\n你不需要忽视性能不的浏览器和设备。如果你从第一天起就采用优先的工作流，你只需为它们提供一种降级但功能完整的体验。\n\
    \n## 问题\n\nInternet Explorer 8——一个缓慢且过时的浏览器——正在失去流行。但其继者 Internet Explorer 9 在美国以外仍被广泛使用。此外，运行\
    \ Android 2.3.x 及以下版本的旧 Android 智能手机相对于最新的 Android 和 iOS 设备来说仍然非常流行。在每十个访问你网站的用户中，预计会有三三个属于这两类之一（取决于你的应用吸引的用户类型）。因此，如果你的网站充满了动画和其他\
    \ UI 交互，对于你的三分之一的用户来说，体验会特别糟糕。\n\n## 解决方案\n\n解决弱设备引起的性能问题有两种方法：要么在整个网站范围内广泛减少动画的发生，要么仅针对弱设备设备减少动画。前者最终是一个产品决策，但如果你使用了了我们在第\
    \ 4 章“动画工作流”中解释的全局动画倍率技术（或 Velocity 对应的 mock 功能），后者则是一个简单的技术决策。全局倍率技术允许你通过设置单个变量来动态更改整个网站的动画计时。这里的技巧是——当检测到弱浏览器时——将倍率设置为\
    \ 0（或将 `$.Velocity.mock` 设置为 `true`），以便页面的所有动画都在单个动画帧内（小于 16ms）完成：\n\n```javascript\n\
    // 让所有动画立即完成\n$.Velocity.mock = true;\n```\n\n"
