    So it''s a good thing you have this book in front of you. Julian Shapiro is one
    of the principal experts on animation on the web. In creating and supporting Velocity.js,
    he has developed an intimate knowledge of all the quirks and advantages of using
    motion on websites. Web Animation using JavaScript will give you not only the
    technical know-how to implement animation in your websites, but, more importantly,
    the insights you''ll need to use animation effectively and craft compelling user
    experiences.


    Animation libraries and technologies have made motion design more accessible than
    ever. But not every developer abide by best practices. The past couple of years
    have seen several trendy anti-patterns come and go. Scroll behavior has been hijacked.
    Mobile navigation has been pushed into menus accessible only via gestures. While
    adding animation is within the grasp of anyone who stumbles across .animate(),
    utilizing it to improve the user experience is one of the hallmarks of a dedicated
    developer. This book will help you become one of them.


    David DeSandro

    February 2015

    Brooklyn, New York


    David DeSandro is the founder of Metafizzy and author/developer of Masonry and
    Isotope.


    # INTRODUCTION


    In the early days of the web, animation was primarily used by novice developers
    as a last-ditch effort to call attention to parts of a page. And even if they
    wanted animation to transcend its niche, it couldn''t: browsers (and computers)
    were simply too slow to deliver smooth web-based animation.


    We''ve come a long way since the days of flashing banner ads, scrolling news tickers,
    and Flash intros. Today, the stunning motion design of iOS and Android dramatically
    improves the user experience—instead of detracting from it. Developers of the
    best sites and apps leverage animation to improve the feel and intuitiveness of
    their user interfaces. Animation''s rise to relevancy isn''t just a by-product
    of improved processing power; it reflects a better appreciation for best practices
    within the development community. The tools you use to make a website are now
    considered less important than the quality of the resulting user experience. As
    obvious as this, it wasn''t always the case.


    So, what makes animation in particular useful? Whether it''s transitioning between
    chunks of content, designating intricate loading sequences, alerting the user
    what to do, animation complements text and layout to reinforce your site''s intended
    behavior, personality, and visual sophistication. Does your content bounce into
    view in a friendly way, or does it whip across the screen? This is the domain
    of motion design, and the decisions you make will establish the transcendent feeling
    of your app.


    When users recommend your app to others, they''ll often try to describe it with
    words like "sleek" or "polished." What they don''t realize is that they''re merely
    referring to the motion design work that''s gone into the interface. This inability
    of the layman to make the distinction is precisely what great user interface (UI)
    designers strive for: animations that reinforce the interface''s objectives but
    don''t divert the user''s attention.


    This book provides you with the foundation necessary to implement animation confidently
    and in a way that''s both technically maintainable and visually impactful. Throughout,
    it considers the balance between enriching a page with motion design and avoiding
    unnecessary flourishes.


    Why is all of this so important? Why is it worth your time to perfect your transitions
    and easing combinations? For the same reason that designers spend hours perfecting
    their font and color combinations: refined products simply feel superior. They
    leave users whispering to themselves, "Wow, this is cool," right before they turn
    to a friend and reclaim, "You gotta see this!"


    > **NOTE:** If you''re unfamiliar with basic CSS properties, you should pick an
    introductory HTML and CSS book before reading this one.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_16_0.png)


    # CHAPTER 1


    # Advantages of JavaScript Animation


    In this chapter, we compare JavaScript to CSS for the purposes of animation, and
    introduce the unique features and workflow advantages provided by JavaScript.


    In short, we provide the context needed to help you understand everything you''ll
    learn about JavaScript in this book.


    # JAVASCRIPT VS. CSS ANIMATION


    There''s a false belief in the web development community that CSS animation is
    the only performant way to animate on the web. This misconception has led many
    developers to abandon JavaScript-based animation altogether, forcing them to:


    - Manage the entirety of user interface (UI) interaction within style sheets,
    which can quickly become difficult to maintain.

    - Sacrifice real-time animation timing control, which is achievable only within
    JavaScript. (Timing control is necessary for designing animation into UIs that
    respond to a user''s drag input, like those found in mobile apps.)

    - For physics-based motion design, which allows elements on a webpage to behave
    like objects in the real world.

    - Lose support for older browser versions, which remain popular throughout the
    world.


    JavaScript-based animation is actually as fast as CSS-based animation. CSS animation
    is mistakenly considered to have a significant leg up because it''s most often
    compared to jQuery''s animation features, which are in fact very slow. However,
    alternative JavaScript animation libraries that bypass jQuery entirely deliver
    fantastic performance by streamlining their interaction with a page.


    > NOTE: One library of note, which we''ll be using throughout this book, is Velocity.js.
    Its lightweight yet incredibly feature rich, and it mirrors jQuery''s animation
    syntax to help eliminate the learning curve.


    Of course, CSS is perfectly suited for hover state animations (turning a link
    when the mouse is positioned over it, for example), which are very often the extent
    to that basic webpages include animation. CSS transitions fit seamlessly into
    existing stylesheets, allowing developers to avoid bloating their pages with unnecessary
    JavaScript libraries. What''s more, CSS animation delivers blazing performance
    out of the box.


    But this book will demonstrate why JavaScript is often the superior choice for
    animations beyond simple hover state animations.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_19_0.png)


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_20_0.png)


    # GREAT PERFORMANCE


    JavaScript and jQuery are falsely conflated. JavaScript animation is fast. jQuery
    slows it down. Despite jQuery being tremendously powerful, it wasn''t designed
    to be a high-performance animation engine. It has no mechanism to avoid "layout
    thrashing," in which a browser becomes overtasked with layout processing work
    while it''s in the process of animating.


    Further, because jQuery''s code base serves many purposes beyond animation, its
    memory consumption triggers garbage collections within the browser, causing animations
    to stutter unpredictably. Lastly, due to decisions made by the jQuery team in
    the noble pursuit of helping novice users avoid sabotaging their UI with bad code,
    jQuery forges the recommended practice of using requestAnimationFrame function,
    which browsers make available to drastically improve frame rates.


    JavaScript animation libraries that bypass jQuery entirely deliver fantastic performance
    by streamlining their interaction with a page. One library of note, which we''ll
    be using throughout this book, is Velocity.js. Its lightweight, yet incredibly
    feature rich, and it mirrors jQuery''s animation syntax to help eliminate the
    learning curve.


    This is a topic we''ll explore in-depth in Chapter 7, "Animation Performance."
    By learning the nuances of browser rendering performance, you''ll gain a foundation
    to build reliable animations for all browsers and devices, regardless of their
    individual processing power.


    # FEATURES


    Speed is, of course, not the only reason to use JavaScript—its abundance of features
    is equally important. Let''s run through a few of the notable features that are
    exclusive to JavaScript.


    # PAGE SCROLLING


    Page scrolling is one of the most popular uses for JavaScript-based animation.
    A recent trend in web design is to create large webpages that animate new pieces
    of content into view as the page is scrolled down.


    JavaScript animation libraries, such as Velocity, provide simple functions for
    scrolling elements into view:


    ```javascript

    $element.velocity("scroll", 1000);

    ```


    This scrolls the browser towards the top edge of element over a duration of 1000ms
    using Velocity''s "scroll" command. Notice that Velocity''s syntax is nearly identical
    to jQuery''s $.animate() function, which is covered later in this chapter.


    # ANIMATION REVERSAL


    Animation reversal is a useful shorthand for undoing an element''s previous animation.
    By invoking the reverse command, you''re instructing an element to animate back
    to its values prior to its last animation. A common use for reversal is animating
    a modal dialogue into view, hiding it when the user presses to close it.


    An unoptimized reversal workflow consists of keeping track of the specific properties
    that were last animated on each element that may later be subjected to reversal.
    Unfortunately, keeping track of prior animation states in UI code quickly becomes
    unwieldy. In contrast, with the reverse command, Velocity remembers everything
    for you.


    Mimicking the syntax of Velocity''s scroll command, the reverse command is called
    by passing "reverse" as Velocity''s first argument:


    ```javascript

    // First animation: Animate an element''s opacity toward 0

    $element.velocity({ opacity: 0 });

    // Second animation: Animate back toward the starting opacity value of 1

    $element.velocity("reverse");

    ```

