    # DISTRACTION OVER BOREDOM


    When a user performs a role, non-engaging task on your page—such as filling out
    a long form—you can use color and movement to raise her level of awareness and
    intrigue. For example, you might animate a check mark when she successfully com-letes
    each field. This keeps the user''s mind superbly engaged with the inter-face,
    lessens the dullness of the task at hand. Similarly, you could show the user an
    eye-catching loading indicator while she waits for content to load. A great example
    of this can be found in Lyft, a popular ride-sharing app, which animates a balloon
    rhyth-mically floating up and down on a blank canvas when the app loads into memory.


    Allowing the user''s brain to relax and feel the pleasurable moment of repeated
    movement keeps her more engaged with your content. However superficial may this
    seem, it works. Recognize that this technique should be used only in situations
    where the user will experience an unavoidable stretch of boredom; avoid using
    it as a Band-Aid any time you feel spicy up your UI.


    Let''s consider another example: when Facebook loads text into its News Feed,
    it animates a blurring content of dummy text until the real text is ready to be
    shown. This rhythmic blurring animation not only indicates that the interface
    is at work (as opposed to having stalled), but also tells the user which portion
    of the UI she''s waiting on. This technique is called *inline status indicator*.
    Compare this to the ubiquitous status indicator, which is as old as the web itself:
    the superposition of a single, looped animation graphic on a page that feels discomfortably
    devoid of content. Users are tired of this. Inline status indication, in contrast,
    lets you show *as much of the interface as possible* by blocking out only the
    specific subsections whose content has yet to load. This is not only more, but
    also gives the user more content to fix her eyes while she twiddles her thumbs
    waiting for the page to fully load.


    The takeaway here is simple: the more you give users to engage with, the longer
    it''ll for them to get bored.


