    请注意，并不是从页面的流中移除元素，你只需要通过将 `visibility` 设置为 "hidden" 将该元素标记为不可见且不可交互。这在你希望一个隐藏的元素继续占据页面上某个空间时非常有用：


    ```javascript

    // 将元素透明度渐变为0，然后使其变为不可交互

    element.velocity({ opacity: 0 }, { visibility: "hidden" });

    ```


    现在，让我们考虑相反方向动画（显示元素而不是隐藏元素）：当 `display` 或 `visibility` 被设置为 "none" 或 "hidden"
    以外的值时，该值会在动画开始*之前*被设置，以便元素在随后的动画持续期间是可见的。换句话说，你正在撤销元素之前从视图中移除时所发生的隐藏效果。


    在下方，在元素开始淡入之前，将 `display` 设置为 "block"：

    $element.velocity({ opacity: 1 }, { display: "block" });


    这实际上替代了 jQuery 的等效写法：


    ```javascript

    $element

    .show()

    .animate({ opacity: 0 });

    ```


    > 提示：如需全面了解 Velocity 的动画选项，请参阅 VelocityJS.org 的文档。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_43_0.png)


    # 包含动画逻辑


    与 Velocity 的 `delay` 选项一样，Velocity 对 CSS `display` 和 `visibility` 设置的整合允许将动画逻辑完全包含
    Velocity。在生产代码中，每当元素淡入或淡出视图时，几乎总是伴随着 `display` 或 `visibility` 的变化。利用这些 Velocity
    简写可以帮助你保持代码整洁且易维护，因为它对外部 jQuery 函数的依赖较低，并且没有通常膨胀动画逻辑的重复辅助函数。


    请注意，Velocity 包含了上述演示的透明度切换动画的简写。它们的功能与 jQuery 的 `fadeIn` 和 `fadeOut` 函数相同。你只需要将相应的命令作为第一个参数传递给
    Velocity，并根据需要正常地传递一个选项对象：


    ```javascript

    $element.velocity("fadeIn", { duration: 1000 });

    $element.velocity("fadeOut", { duration: 1000 });

    ```


    # 使用 VELOCITY：额外功能


    值得注意的额外 Velocity.js 功能还包括：反转命令（reverse）、滚动、颜色和变换（平移、旋转和缩放）。


    # REVERSE 命令


    要将元素动画回上一次 Velocity 调用之前的值，请将 "reverse" 作为 Velocity 的第一个参数传递。`reverse` 命令的行为与标准的
    Velocity 调用完全相同；它可以接收选项，并与其他链式 Velocity 调用一起排队。


    `reverse` 默认使用元素在上一次 Velocity 调用中使用的选项（`duration`、`easing` 等）。但是，你可以通过传递一个新的选项对象来覆盖这些选项：


    ```javascript

    // 使用上一次 Velocity 调用的选项动画回原始值

    element.velocity("reverse");

    ```


    或


    ```javascript

    // 执行上方相同的操作，但将上一次调用的持续时间替换为 2000ms

    element.velocity("reverse", { duration: 2000 });

    ```


    > 注意：`reverse` 命令会忽略上一次调用的 `begin` 和 `complete` 选项；`reverse` 永远不会再次回调函数。


    # 滚动


    要将浏览器滚动到元素的顶部，请将 "scroll" 作为 Velocity 的参数传递。`scroll` 命令的行为与标准的 Velocity 调用完全相同；它可以接收选项，并与其他链式
    Velocity 调用一起排队：


    ```javascript

    $element

    .velocity("scroll", { duration: 1000, easing: "spring" })

    .velocity({ opacity: 1 });

    ```


    这使用 100ms 的持续时间和 "spring" 缓动将浏览器滚动到元素的顶部。然后，一旦元素滚动到视图中，它就会完全淡入。要将浏览器滚动到元素的顶部边缘，传入
    "scroll" 作为 Velocity 的参数。`scroll` 命令的行为与标准的 Velocity 调用完全相同；它可以接收选项，并与其他链式 Velocity
    调用一起排队：


