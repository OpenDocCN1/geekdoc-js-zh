    # WRAPPING UP


    If you''re intrigued by what you''ve read so far and want to learn more about
    working with SVGs, check out these great resources:


    - For a full overview of working with SVG elements, refer to Joni Tryhall''s fantastic
    and free SVG Pocket Guide (https://github.com/jonitrhythall/svgpocketguide).

    - For a directory of SVG element types and their properties, consult Mozilla Developer
    Network (https://developer.mozilla.org/en-US/docs/Web/SVG).

    - For a listing of all the SVG attributes and styling properties that Velocity
    can animate, refer to VelocityJS.org/#svg.


    # CHAPTER 7


    ## Animation Performance


    Performance affects everything. Increased performance—apparent or real—drastically
    improves UX, which in turn boosts your company’s bottom line. Several major studies
    have demonstrated that latency increases on search engines result in significant
    decreases in revenue per user. To put it bluntly, people hate waiting.


    As explained in Chapter 1, JavaScript animation performance is comparable to that
    of CSS animation. So, if you’re using a modern animation engine such as Velocity.js,
    the performance of your animation app’s bottleneck—it’s your own code. That’s
    what this chapter explores: techniques for coding high-performance animations
    across all browsers and devices.


    # THE REALITY OF WEB PERFORMANCE


    If you''ve ever wondered why running concurrent animations slows down your UI,
    or why your site performs slowly on mobile devices, this chapter is for you.


    Animations are a very resource-intensive process for browsers to perform, but
    there are many techniques that can help the browser work as efficiently as possible.
    We''re about to learn them.


    From the perspective of UI design, there''s no shortage of articles telling the
    virtues of building mobile-first, responsive websites. Conversely, the perspective
    of UI performance, most of us, as developers, are unaware of what best practices
    are or how to follow them. Staying abreast of the web performance landscape is
    overwhelming and oftentimes futile; we''re held captive by browser and device
    quirks, byproducts of the volume of devices (desktops, smartphones, and tablets)
    and browsers (Chrome, Android, Firefox, Safari, Internet Explorer) that crowd
    the ecosystem. Considering that these platforms are continuously updated, it''s
    no surprise that we often throw in the towel and sideline performance concerns
    as much as we can. Sometimes we may even be tempted to do away with animations
    altogether if we''re unsure how to implement them without sacrificing performance.


    We tell ourselves:


    > Since devices are getting faster, users continue upgrading hardware, my site
    will become progressively more performant.


    Unfortunately, the global reality is the exact opposite: the smartphones that
    the developing world is adopting fall short of the performance of the latest iPhones
    in our pockets. Do you really want to forsake building products for the next few
    people coming online? The upcoming Firefox OS initiative is poised to bring capable
    smartphones to hundreds of millions of people, so we''re not simply waxing poetic
    about hypotheticals. The mobile revolution is here now.


    NOTE: Ericsson has reported that the global smartphone subscriber count will rise
    from 1.9 billion to 5.9 billion in the next five years—fueled almost exclusively
    by the developing world.


    # performance affects everything.


    If your gut reaction is, “It’s not my problem—my app is just for the tech-savvy
    middle-class in the developed world,” rest assured that your evil web developer
    twin is sitting two thousand miles away cackling at the thought of getting to
    a nascent market before you do by actually putting in the effort necessary to
    deliver great experiences on low-powered devices. (There’s actually an enormous
    conglomerate dedicated to this—search Google for “Rocket Internet.”)


    There''s another nasty reality to sidelining performance concerns: we systematically
    make the mistake of testing our sites on devices operating under ideal loads.
    In reality, of course, users have multiple apps and browser tabs running concurrently.
    Their devices are working overtime to process a dozen tasks at any given time.
    Accordingly, the performance baseline established for your app probably doesn''t
    reflect its performance in the real world. Yikes!


    But, fear not, keen developer. It''s time to explore the performance techniques
    at your disposal and level up your animation game.


    # TECHNIQUE: REMOVE LAYOUT THRASHING


    Layout thrashing—the lack of synchronization in DOM manipulation—is the 800-pound
    gorilla in animation performance. There''s no painless solution, but there are
    best practices. Let''s explore.


    # PROBLEM


    Consider how webpage manipulation consists of setting and getting: you can set
    (update) or get (query) an element''s CSS properties. Likewise, you can insert
    new elements onto a page (a set) or you can query for a set of existing elements
    (a get). Gets and sets are the core browser processes that incur performance overhead
    (another graphical rendering). Think of it like: after setting new properties
    on an element, the browser has to calculate the resulting impacts of your changes.
    For example, changing the width of one element can trigger a chain reaction in
    which the width of the element''s parent, siblings, and children elements must
    also change depending on their respective CSS properties.


    The UI performance reduction occurs when alternating sets with gets is called
    layout thrashing. While browsers are highly optimized for page-layout recalculations,
    the extent of their optimizations is greatly diminished by layout thrashing. Performing
    a series of gets at once, for example, can be easily optimized by the browser
    into a single, streamlined operation because the browser can cache the page''s
    state after the first get, then reference that state for each subsequent get.
    However, repeatedly performing one get by one forces the browser to do a lot of
    heavy lifting since its cache is continuously invalidated by the changes made
    by set.


    This performance impact is exacerbated when layout thrashing occurs within an
    animation loop. Consider how an animation loop aims to achieve 60 frames per second,
    the threshold at which the human eye perceives buttery-smooth motion. What this
    means is that every tick in an animation loop must complete within 16.7ms (1/60
    ticks $\approx$ 16.67ms). Layout thrashing is a very easy way to cause each tick
    to exceed this limit. The end result, of course, is that your animation will stutter
    (or jank), in web animation parlance.


    While some animation engines, such as Velocity.js, contain optimizations to reduce
    the occurrence of layout thrashing inside their own animation loops, be careful
    to avoid layout thrashing in your own loops, such as the code inside a setInterval()
    or a self-invoking setTimeout().


    # SOLUTION


    Avoiding layout thrashing consists of simply batching together DOM sets and DOM
    gets. The following code causes layout thrashing:


    ```

    // Bad practice

    var currentTop = $("element").css("top"); // Get

    $("element").style.top = currentTop + 1; // Set

    var currentLeft = $("element").css("left"); // Get

    $("element").style.left = currentLeft + 1; // Set

    ```


    If you rewrite the code so that all queries and updates are aligned, the browser
    can catch the reactive actions and reduce the extent to which this code causes
    layout thrashing:


    ```

    var currentTop = $("element").css("top"); // Get

    var currentLeft = $("element").css("left"); // Get

    $("element").css("top", currentTop + 1); // Set

    $("element").css("left", currentLeft + 1); // Set

    ```


    The illustrated problem is commonly found in production code, particularly in
    situations where UI operations are performed depending on the current value of
    an element''s CSS property.


    Say your goal is to toggle the visibility of a side menu when a button is clicked.
    To accomplish this, you might first check to see if the side menu has its display
    property set to either "none" or "block", then you''d proceed to alternate the
    value as appropriate. The process of checking for the display property constitutes
    a get, and whichever action is subsequently taken to show or hide the side menu
    will constitute a set.

    '
