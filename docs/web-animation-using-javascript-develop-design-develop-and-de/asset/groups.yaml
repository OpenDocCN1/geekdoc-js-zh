  raw:
  - '[PAGE 104]


    Reversing Blast in this way is a crucial component of textual animation since
    the modus operandi when animating elements on a webpage is to leave things as
    they were before you touched them. If, for example, you''ve Blasted apart a sentence
    in order to animate its words into view one at a time, you would subsequently
    reverse Blast upon completion of the animation. Consequently, JavaScript code
    that later interacts with the text won''t have unexpected child elements that
    it has to parse out. In short, it''s good practice to avoid leaving your HTML
    unnecessarily bloated so that further programmatic interaction with your elements
    doesn''t become increasingly convoluted.


    > NOTE: To learn more about Blast, including its unique search capabilities and
    its compatibility with screen-reading software, visit its documentation at Julian.com/research/blast.


    Now that you''ve separated your text elements, it''s time to animate them.


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_104_0.png)'
  - '[PAGE 105]


    # TRANSITIONING TEXT INTO OR OUT OF VIEW


    The most common use of textual animation is animating text in and out of view.
    A basic implementation of this is to animate the words in a sentence into view
    one after another.


    # REPLACING EXISTING TEXT


    Let''s start by creating a div with placeholder text that will be replaced by
    new text that animates into place:


    ```

    <div>

    A message will load here shortly...

    </div>

    ```


    Because the div starts out as visible, Blasting the div''s text results in child
    text elements that are visible as well. Since your goal is to animate the generated
    text elements into view starting from a state of invisibility, you have to make
    the generated elements invisible immediately after you call Blast:


    ```

    $("div")

    .html("This is our new message.")

    .blast({ delimiter: "word" })

    .css("opacity", 0);

    .velocity({ opacity: 1 });

    ```


    This replaces the div''s existing text with a new message. Then it Blasts the
    div using the word delimiter. Since a call to Blast returns the generated text
    wrapper elements to the jQuery selector chain, you can easily extend the code
    to set the opacity of each element to o. This primes the elements for the subsequent
    Velocity call, which consists of a simple opacity animation.


    You may have noticed that the above code results in all text parts animating into
    view simultaneously. This, of course, defeats the purpose of using Blast in the
    first place: if you wanted all of the div''s content to animate into view simultaneously,
    you could have simply animated the div itself. The goal here is actually to achieve
    a successive animation sequence that consists of one text element animating after
    another.'
  - '[PAGE 106]


    # STAGGERING


    This is where Velocity''s UI pack comes into play. (Review Chapter 4, "Animation
    Workflow," if you need a primer on the UI pack.) To impose a successive delay
    between animation start times within an element set, use Velocity pack''s stagger
    option, which expects a duration specified in milliseconds. Applying it to the
    previous code example, you get:


    ```

    $$(div)


    .html("This is our new message.")

    .blast({ delimiter: "word" })

    .css("opacity", 0)


    .velocity("transition.fadeIn", { stagger: 50 });

    ```


    The code above produces a successive delay of 50ms between the elements'' animation
    start times. Notably, the Velocity call''s previous { opacity: 1 } argument for
    "transition.fadeIn" is a premade fade effect included with Velocity''s UI pack.
    (Refer to Chapter 4, "Animation Workflow," if you need a refresher.) Since the
    stagger option works with UI pack effects, this example shows the effect that
    mirroring animating opacity to a value of 1.


    As discussed in Chapter 3, "Motion Design Theory," be careful to keep stagger
    timers to a low duration so that users aren''t waiting needlessly while text fades
    into view. Keep in mind that the longer an element''s word count, the greater
    the overall time an animation sequence will take to complete. Text element staggering
    is one of the easiest ways to slip into the bad practice of slowing down your
    interface.


    # TRANSITIONING TEXT OUT OF VIEW


    The code example in the previous section only animated text into—not out of-view;
    the div''s preexisting text was immediately replaced by the new message. This
    doesn''t necessarily make for poor motion design, but it is often beneficial from
    the perspective of motion design theory to unify animations such that an element
    fades out of view in a way that reflects the it faded into view. Chapter 3, "Motion
    Design Theory," covered the concept of mirroring animations so that what reflects
    in what goes out. That advice applies here.'
  - "[PAGE 107]\n\nIf you want the outward textual animation to mirror the inward\
    \ animation, you could rework the code example as follows:\n\n```\n// Select the\
    \ previously blasted text\n$(\"div .blast\").velocity(\n  // Animate the existing\
    \ text out of view with the appropriate\n  UI pack effect\n  \"transition.fadeOut\"\
    ,\n  {\n    // Stagger the outward animation as you did the inward animation\n\
    \    stagger: 50,\n    backwards: true,\n    // When this outward animation is\
    \ complete, begin the inward animation\n    complete: function() {\n      // Proceed\
    \ with the inward animation\n      $(\"div\")\n        .html(message)\n      \
    \  .blast({delimiter: \"word\"})\n        .css(\"opacity\", 0)\n        .velocity({opacity:\
    \ 1}, {stagger: 50});\n    }\n  }\n)\n```\n\nThis begins by calling the Velocity\
    \ UI pack \"transition. fadeOut\" on the text parts generated by the div having\
    \ previously been Blasted. With the inward direction, the stagger option successively\
    \ offsets the individual text part animations in the outward direction. New to\
    \ this call is the use of Velocity UI pack's backwards option, which pairs with\
    \ stagger to reverse the target element's order so that the last element (the\
    \ last word in the sentence) animates out of view before the second-to-last element,\
    \ and that element animates out of view before the third-to-last element does,\
    \ and so on. When this outward animation sequence is complete, the inward animation\
    \ is called from within the complete callback."
  - '[PAGE 108]


    Using the backwards option for text animation provides two benefits. First, it
    helps mirror (create the inverse of) the inward animation, which consists of the
    first word animating into view before the second word does, and so on. Second,
    when the back-ward animation is immediately followed by the forward animation,
    the net result is an elegant chaining effect in which the last word in the backward
    direction and the first word in the forward direction occur back-to-back. This
    works to tie the two animation sequences together into what looks like one conjoined
    animation instead of two separate-rate animations crudely glued together.'
  - "[PAGE 109]\n\n# TRANSITIONING INDIVIDUAL TEXT PARTS\n\nMovie title sequences\
    \ are well known for their inventive typographic motion design. The technique\
    \ underlying many of these effects is singling out individual text elements for\
    \ animation. That's what this section covers.\n\n> NOTE: For typographic animation\
    \ inspiration, search YouTube for movie title sequences and take detailed notes!\
    \ As long as you keep the principles of motion design theory in mind, you should\
    \ feel encouraged to explore textual animation design in your interface.\n\nTo\
    \ achieve fine-grained control over the elements that Blast generates, simply\
    \ use CSS's nth-child selector or jQuery's eq() function. These functions behave\
    \ similarly to one another, in that they allow for the selection of an element\
    \ within a set based on that element's index. If you passed an integer value of\
    \ 3 into these functions (or 2 in the case of full element set (that is, multiword\
    \ sentence): jQuery as you will see), they would target the third element (that\
    \ is, third word) in the full sentence:\n\n```\n// CSS implementation\n.blast:nth-child(3)\
    \ {\n  color: red;\n}\n\n// jQuery implementation\n(\".blast\").eq(2).css(\"color\"\
    , \"red\");\n```\n\nBoth examples above target the third element on the page that\
    \ has the .blast class applied. (Note that jQuery's eq function is o-based whereas\
    \ CSS's nth-child is 1-based, hence the different integer values being passed\
    \ into the examples.) Let's continue with the jQuery implementation to work toward\
    \ a complete example:\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_109_0.png)"
- md: "\n```javascript\n<div>\n  Current status: paused\n</div>\n// Blast the div\
    \ using the word delimiter\n$(\"div\").blast({delimiter: \"word\"})\n// Select\
    \ the third word in the sentence (the span containing\n  the \"paused\" text)\n\
    eq(2)\n// Fade the third element out of view then replace its inner\n  text with\
    \ a new message\n  .velocity({ opacity: 0 }, function() { $(this).text(\"running\"\
    ); });\n// Fade the replaced text into view\n  .velocity({ opacity: 1 });\n```\n\
    \nThis Blasts a sentence, selects its third word (\"paused\"), fades the word\
    \ out of view, replaces the faded word with a new word (\"running\"), then fades\
    \ the new word into view. The net effect is that the status-indicating keyword\
    \ within a sentence gracefully fades into a new word to alert the user of a change.\
    \ This is a tremendously elegant effect that consists of only a few lines of simple\
    \ code. If you were to perform this effect many times over a larger block of text,\
    \ you could achieve an effect in which one message appears to sporadically change\
    \ into another.\n\n# TRANSITIONING TEXT FANCIFULLY\n\nYou could easily swap the\
    \ transition.fadeIn effect you used thus for with another effect from Velocity's\
    \ UI pack. Some of the other effects are quite fanciful, ranging from transition.shrinkIn,\
    \ which causes an element to scale down into view, to transition.perspectiveDown,\
    \ which causes an element to rotate down into view like a hinged door. (As, always,\
    \ the sophistication of your effects should be rooted in the principles discussed\
    \ in Chapter 3, \"Motion Design Theory.\")\n\nNOTE: For a complete list of UI\
    \ pack effects, including live demos, visit Velocity.js/#UiPack.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_111_0.png)\n\
    \nKeep in mind that some effects use 3D transforms (rotateX, rotateY, and translateZ),\
    \ which don't work with elements whose CSS display value is set to \"inline\"\
    —the default display value for span and anchor elements in particular. The workaround\
    \ is to set Blast's generated text elements to a display value of \"inline-block\"\
    , which keeps \"inline\" elements behaving as they normally do while giving them\
    \ the added functionality of \"block\" elements (such as div and p), in which\
    \ position-related properties, including 3D transforms, can be styled. Taking\
    \ this tweak into account, the inward text transition example would now look like\
    \ this:\n\n```javascript\n$(\"div\")\n.html({ delimiter: \"word\" })\n.css({ opacity:\
    \ 0, display: \"inline-block\" })\n.velocity(\"transition.perspectiveDownIn\"\
    , { stagger: 50 });\n```\n\nThis sets the Blasted text parts' display values to\
    \ \"inline-block\" in the same call to jQuery's css() function that sets the elements'\
    \ opacity to a starting value of 0.\n\n# TEXTUAL FLOURISHES\n\nThe final topic\
    \ in this discussion of textual animation is the concept of flourishes, ambient\
    \ animations that produce ongoing effects for aesthetic purposes. One example\
    \ might be a string of text that flickers like a dying light bulb. Another might\
    \ be having all the words in a sentence continuously animate to different shades\
    \ of blue.\n\nBoth of these are bad ideas.\n\nThese effects distract users and\
    \ ultimately amuse only you—the developer who enjoys with motion design. Never\
    \ include animation just for the sake of animation; if a part of your page is\
    \ meaningless drawing the user's attention away from the parts that have utility,\
    \ go back to the drawing board.\n\nThe rare exception to this is status—text as\
    \ \"Loading...”—that keep the user aware of what the interface is doing. These\
    \ are appropriate targets for textual flourishes because the flourishes tell the\
    \ user that the interface is still processing data (as opposed to frozen). In\
    \ this way, flourishes act as an engaging visual heartbeat.\n\nSo if textual flourishes\
    \ are generally considered bad practice, why is this section included in the book?\
    \ Because flourishes that aren't animated are often a great idea! Consider this\
    \ non-animation bonus provided by Blast: you can stylize the text elements generated\
    \ by Blast to produce colorful collages and unique typographic designs. For example,\
    \ you could break apart a website’s slogan text (“Delivering happiness to your\
    \ door!\") word by word to reduce the opacity of each successive word, thereby\
    \ creating a subtle gradient effect that spans the entire sentence. Here’s what\
    \ that code would look like:\n\n```javascript\n<div>\nHi Mom\n</div>\n// Blast\
    \ the div then iterate through the generated text elements\n$(\"div\").blast({\
    \ delimiter: \"character\" }).each(function(i, element) {\n  // Successively reduce\
    \ the opacity of each element with an\n  arbitrary formula\n  var adjustedOpacity\
    \ = 1 - i/10;\n  element.style.opacity = adjustedOpacity;\n});\n```\n\nInstead\
    \ of iterating opacity values, you could also iterate RGB values to create color-based\
    \ gradients. For example, if you increased the blue component of text whose color\
    \ initially starts as gray, you'd produce elements that are increasingly rich\
    \ in blue as you go from first to last:\n\n```javascript\n// Blast the div then\
    \ iterate through the generated text elements\n$(\"div\").blast({ delimiter: \"\
    character\" }).each(function(i, element) {\n  // Successively increase the blue\
    \ color component of each element\n  with an an arbitrary formula\n  var adjustedBlue\
    \ = i*20;\n\n  element.style.opacity = \"rgb(0, 0,\" + adjustedBlue + \")\";\n\
    });\n```\n\n# remember:\nform follows function.\n\n# WRAPPING UP\n\n# CHAPTER\
    \ 6\n\n# Scalable Vector Graphics Primer\n\nSince an in-depth tutorial on Scalable\
    \ Vector Graphics (SVG) could easily comprise a book of its own, this chapter\
    \ simply serves as an introduction to the topic. The goal is to equip you with\
    \ enough knowledge to be comfortable animating SVG elements and to know where\
    \ to go next to continue your learning.\n\n# CREATING IMAGES THROUGH CODE\n\n\
    An SVG element is a type of DOM element.\n"
