    The element would consequently turn into this:


    ```

    <div class="blast-root">

    <div class="blast">Hi</div>

    <div class="blast">Mom</div>

    </div>

    ```


    This feature is useful to ensure that the resulting text elements mimic of the
    surrounding HTML. Perhaps nearby sibling elements are all of the div type, in
    which case the above example may be appropriate.


    You might also want to take advantage of the unique properties offered by different
    tag types. strong, for example, automatically builds text, whereas div forces
    each text match to begin on a new line thanks to div''s default display value
    of "block".


    # COMMAND: REVERSE


    You can undo Blast on an element by passing false as the sole parameter into a
    Blast call. Hence, if your Blasted looked like this:


    ```

    <div class="blast-root">

    <div class="blast">Hi</div>

    <div class="blast">Mom</div>

    </div>

    ```


    and you passed in the following Blast call:


    ```

    $("div").blast(false);

    ```


    the element would return to its original structure:


    ```

    <div>

    Hi Mom

    </div>

    ```


    You might be wondering how this works: when Blast is reversed, it simply destroys
    the generated wrapper elements, then inserts raw text where the wrapper elements
    were previously. Note that this will break event handlers assigned to the new
    elements generated by Blast, but it won''t break event handlers associated with
    the HTML that existed prior to Blast being initially called.'
- md: "\nReversing Blast in this way is a crucial component of textual animation since\
    \ the modus operandi when animating elements on a webpage is to leave things as\
    \ they were before you touched them. If, for example, you've Blasted apart a sentence\
    \ in order to animate its words into view one at a time, you would subsequently\
    \ reverse Blast upon completion of the animation. Consequently, JavaScript code\
    \ that later interacts with the text won't have unexpected child elements that\
    \ it has to parse out. In short, it's good practice to avoid leaving your HTML\
    \ unnecessarily bloated so that further programmatic interaction with your elements\
    \ doesn't become increasingly convoluted.\n\n> NOTE: To learn more about Blast,\
    \ including its unique search capabilities and its compatibility with screen-reading\
    \ software, visit its documentation at Julian.com/research/blast.\n\nNow that\
    \ you've separated your text elements, it's time to animate them.\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_104_0.png)\n\
    \n## TRANSITIONING TEXT INTO OR OUT OF VIEW\n\nThe most common use of textual\
    \ animation is animating text in and out of view. A basic implementation of this\
    \ is to animate the words in a sentence into view one after another.\n\n## REPLACING\
    \ EXISTING TEXT\n\nLet's start by creating a div with placeholder text that will\
    \ be replaced by new text that animates into place:\n\n```\n<div>\nA message will\
    \ load here shortly...\n</div>\n```\n\nBecause the div starts out as visible,\
    \ Blasting the div's text results in child text elements that are visible as well.\
    \ Since your goal is to animate the generated text elements into view starting\
    \ from a state of invisibility, you have to make the generated elements invisible\
    \ immediately after you call Blast:\n\n```javascript\n$(\"div\")\n.html(\"This\
    \ is our new message.\")\n.blast({ delimiter: \"word\" })\n.css(\"opacity\", 0)\n\
    .velocity({ opacity: 1 });\n```\n\nThis replaces the div's existing text with\
    \ a new message. Then it Blasts the div using the word delimiter. Since a call\
    \ to Blast returns the generated text wrapper elements to the jQuery selector\
    \ chain, you can easily extend the code to set the opacity of each element to\
    \ o. This primes the elements for the subsequent Velocity call, which consists\
    \ of a simple opacity animation.\n\nYou may have noticed that the above code results\
    \ in all text parts animating into view simultaneously. This, of course, defeats\
    \ the purpose of using Blast in the first place: if you wanted all of the div's\
    \ content to animate into view simultaneously, you could have simply animated\
    \ the div itself. The goal here is actually to achieve a successive animation\
    \ sequence that consists of one text element animating after another.\n\n## STAGGERING\n\
    \nThis is where Velocity's UI pack comes into play. (Review Chapter 4, \"Animation\
    \ Workflow,\" if you need a primer on the UI pack.) To impose a successive delay\
    \ between animation start times within an element set, use Velocity pack's stagger\
    \ option, which expects a duration specified in milliseconds. Applying it to the\
    \ previous code example, you get:\n\n```javascript\n$(\"div)\n.html(\"This is\
    \ our new message.\")\n.blast({ delimiter: \"word\" })\n.css(\"opacity\", 0)\n\
    .velocity(\"transition.fadeIn\", { stagger: 50 });\n```\n\nThe code above produces\
    \ a successive delay of 50ms between the elements' animation start times. Notably,\
    \ the Velocity call's previous { opacity: 1 } argument for \"transition.fadeIn\"\
    \ is a premade fade effect included with Velocity's UI pack. (Refer to Chapter\
    \ 4, \"Animation Workflow,\" if you need a refresher.) Since the stagger option\
    \ works with UI pack effects, this example shows the effect that mirroring animating\
    \ opacity to a value of 1.\n\nAs discussed in Chapter 3, \"Motion Design Theory,\"\
    \ be careful to keep stagger timers to a low duration so that users aren't waiting\
    \ needlessly while text fades into view. Keep in mind that the longer an element's\
    \ word count, the greater the overall time an animation sequence will take to\
    \ complete. Text element staggering is one of the easiest ways to slip into the\
    \ bad practice of slowing down your interface.\n\n## TRANSITIONING TEXT OUT OF\
    \ VIEW\n\nThe code example in the previous section only animated text into—not\
    \ out of-view; the div's preexisting text was immediately replaced by the new\
    \ message. This doesn't necessarily make for poor motion design, but it is often\
    \ beneficial from the perspective of motion design theory to unify animations\
    \ such that an element fades out of view in a way that reflects the it faded into\
    \ view. Chapter 3, \"Motion Design Theory,\" covered the concept of mirroring\
    \ animations so that what reflects in what goes out. That advice applies here.\n\
    \nIf you want the outward textual animation to mirror the inward animation, you\
    \ could rework the code example as follows:\n\n```javascript\n// Select the previously\
    \ blasted text\n$(\"div .blast\").velocity(\n  // Animate the existing text out\
    \ of view with the appropriate\n  // UI pack effect\n  \"transition.fadeOut\"\
    ,\n  {\n    // Stagger the outward animation as you did the inward animation\n\
    \    stagger: 50,\n    backwards: true,\n    // When this outward animation is\
    \ complete, begin the inward animation\n    complete: function() {\n      // Proceed\
    \ with the inward animation\n      $(\"div\")\n        .html(message)\n      \
    \  .blast({delimiter: \"word\"})\n        .css(\"opacity\", 0)\n        .velocity({opacity:\
    \ 1}, {stagger: 50});\n    }\n  }\n)\n```\n\nThis begins by calling the Velocity\
    \ UI pack \"transition. fadeOut\" on the text parts generated by the div having\
    \ previously been blasted. Using the backwards option for text animation provides\
    \ two benefits. First, it helps mirror (create the inverse of) the inward animation,\
    \ which consists of the first word animating view before the second word does,\
    \ and so on. Second, when the backward animation is immediately followed by the\
    \ forward animation, the net result is an elegant chaining effect in which the\
    \ last word in the backward direction and the first word in the forward direction\
    \ occur back-back.\n\n## TRANSITIONING INDIVIDUAL TEXT PARTS\n\nMovie title sequences\
    \ are well known for their inventive typographic motion design. The technique\
    \ underlying many of these effects is singling out text elements for animation.\
    \ That's what this section covers.\n\n> NOTE: For typographic animation inspiration,\
    \ search YouTube for movie title sequences and take detailed notes! As long as\
    \ you keep the principles of motion design theory in mind, you should feel encouraged\
    \ to explore textual animation design in your interface.\n\nTo achieve fine-grained\
    \ control over the elements that Blast generates, simply use CSS's nth-child selector\
    \ or jQuery's eq() function. These functions behave similarly to one another,\
    \ in that they allow for the selection of an element within a set based on that\
    \ element's index. If you passed an integer value of 3 into these functions (or\
    \ 2 in the case of full element set (that is, multiword sentence): jQuery as you\
    \ will see), they would target the third element (that is, third word) in the\
    \ full sentence:\n\n```css\n// CSS implementation\n.blast:nth-child(3) {\n  color:\
    \ red;\n}\n\n// jQuery implementation\n(\".blast\").eq(2).css(\"color\", \"red\"\
    );\n```\n\nBoth examples above target the third element on the page that has the\
    \ .blast class applied. (Note that jQuery's eq function is o-based whereas CSS's\
    \ nth-child is 1-based, hence the different integer values being passed into the\
    \ examples.) Let's continue with the jQuery implementation to work toward a complete\
    \ example:\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_109_0.png)\n"
  mdcn: "\n\n以这种方式反转 Blast（炸裂）是文本动画的一个关键环节，因为在网页上对元素元素的操作通常是让元素在处理之前保持原样。例如，如果你为了让单词逐个进入视野，而对一个句子进行了\
    \ Blast 处理（拆分），那么在动画完成后，你随后需要反转 Blast。因此，后续与文本交互的 JavaScript 代码就不会有它必须解析的意外子元素。简而言之，避免让你的\
    \ HTML 变得不必要的臃肿是一个做法，这样后续对元素的程序化交互才不会变得日益复杂。\n\n> 注意：要了解更多关于 Blast 的信息，包括其独特的搜索功能以及与阅读软件的兼容性，请访问\
    \ Julian.com/research/blast 上的文档。\n\n现在你已经分离了文本元素，是时候让它们动起来了。\n\n![](img/66399f6bc0b186cf74d5dbe299211a7c_104_0.png)\n\
    \n## 文本进入或离开视图\n\n文本动画最常见的用途是让文本进入或离开视图。这种的基本实现方法是让句子中的单词一个接一个地进入视图。\n\n## 替换现有文本\n\
    \n让我们先创建一个带有占位符文本的 div，该文本将被一个动画到指定位置的新文本所替换：\n\n```\n<div>\nA message will load\
    \ here shortly...\n</div>\n```\n\n由于 div 初始状态是可见的，对 div 的文本进行 Blast 处理会导致生成的子文本元素也是可见的_的。由于你的目标是让生成的文本元素从不可见状态动画进入视野，因此你必须在调用\
    \ Blast 之后立即将生成的元素设为不可见：\n\n```javascript\n$(\"div\")\n.html(\"This is our new\
    \ message.\")\n.blast({ delimiter: \"word\" })\n.css(\"opacity\", 0)\n.velocity({\
    \ opacity: 1 });\n```\n\n这用新消息替换了 div 现有的文本。然后，它使用单词分隔符对 div 进行 Blast 处理。由于调用\
    \ Blast 会将生成的文本包装元素返回到 jQuery 选择器链，因此你可以轻松地扩展代码，将每个元素的透明度设置为 0。这为随后的 Velocity\
    \ 调用做好了准备，该调用由一个简单的透明度动画组成。\n\n你可能已经注意到，上述代码会导致所有文本部分同时进入视图。这显然违背了使用 Blast 的初衷：如果你想让\
    \ div 的所有内容同时进入视图，只需对 div 本身动画即可。这里的目标实际上是实现一个连续的动画序列，即一个文本元素接一个地动画。\n\n## 错落（STAGGERING）\n\
    \n这就是 Velocity 的 UI 包发挥用场的地方。（如果需要了解 UI 包的基础，请回顾第 4 章“动画工作流”）。要在一组元素动画开始时间之间施加连续延迟，请使用\
    \ Velocity 包的 stagger 选项，它接收以毫秒为单位的持续。将其应用于之前的代码示例，结果如下：\n\n```javascript\n$(\"\
    div\")\n.html(\"This is our new message.\")\n.blast({ delimiter: \"word\" })\n\
    .css(\"opacity\", 0)\n.velocity(\"transition.fadeIn\", { stagger: 50 });\n```\n\
    \n上述代码在元素动画开始时间之间产生了 50ms 的连续延迟。值得注意的是，Velocity 调用中用于 \"transition.fadeIn\" 之前的\
    \ `{ opacity: 1 }` 参数是 Velocity UI 包中包含的预设淡入效果。（如果需要复习，请参考第 4 章“动画工作流”）。由于 stagger\
    \ 选项适用于 UI 包效果，此示例展示了镜像动画透明度到值 1 的效果。\n\n正如第 3 章“运动设计理论”中讨论的，注意将 stagger 定器保持在短时间内，以免让用户在文本淡入视野时无谓等待。请记住，元素的单词越多，整个动画序列完成所需的时间就越长。文本元素错落是陷入缓慢界面这一糟糕习惯的最简单方法之一。\n\
    \n## 文本离开视图\n\n上一节中的代码示例仅让文本进入——而非离开——视图；div 原有的文本立即被新消息替换。这并不一定意味着运动设计糟糕，但从运动设计理论的角度来看，统一动画通常是有益的，让元素离开视图的方式能反映它进入视图的方式。第\
    \ 3 章“运动设计理论”涵盖了镜像动画的概念，即进出相对应。这一建议在这里适用。\n\n如果你想让向出的文本动画镜像进入的动画，可以如下所示重写代码示例：\n\
    \n```javascript\n// 选择之前 Blast 处理过的文本\n$(\"div .blast\").velocity(\n  // 使用适当的\
    \ UI 包效果让现有文本淡出移出视图\n  \"transition.fadeOut\",\n  {\n    // 像处理进入动画一样对向出动画使用 stagger\n\
    \    stagger: 50,\n    backwards: true,\n    // 当此向出动画完成后，开始进入动画\n    complete:\
    \ function() {\n      // 继续执行进入动画\n      $(\"div\")\n        .html(message)\n\
    \        .blast({delimiter: \"word\"})\n        .css(\"opacity\", 0)\n       \
    \ .velocity({opacity: 1}, {stagger: 50});\n    }\n  }\n)\n```\n\n这通过对之前被 Blast\
    \ 处理过的 div 所生成的文本部分调用 Velocity UI 包的 \"transition.fadeOut\"。在文本动画中使用 backwards\
    \ 选项有两个好处：第一，它有助于镜像（创建反向的）进入动画，该动画由第一个单词在第二个单词之前进入，依此类推。其次，当反向动画紧接着正向动画时，最终结果是一种优雅的链式效果，即最后一个单词和第一个单词前后衔接。\n\
    \n## 文本部分的过渡\n\n电影片头以其创新的字体运动设计而闻名。许多效果背后的技术是提取单个文本元素进行动画。这就是本节涵盖的内容。\n\n> 注意：为了获取字体动画的灵感，请在\
    \ YouTube 上搜索电影片头并做好笔记！只要牢记运动设计理论原则，就应该大胆在界面中探索文本动画设计。\n\n要对 Blast 生成的元素进行精细控制，只需使用\
    \ CSS 的 nth-child 选择器或 jQuery 的 eq() 函数。这些函数的功能非常相似，它们都允许根据元素的索引选择集合中的元素。如果你向这些函数传递整数值\
    \ 3（在完整元素集（即多单词句子）的情况下为 2，正如你将看到的所示），它们将指向完整句子中的第三个元素（即第三个单词）：\n\n```css\n// CSS\
    \ 实现\n.blast:nth-child(3) {\n  color: red;\n}\n\n// jQuery 实现\n(\".blast\").eq(2).css(\"\
    color\", \"red\");\n```\n\n上述两个示例都指向页面上应用了 .blast 类的第三个元素。（注意 jQuery 的 eq 函数是基于\
    \ 0 的，而 CSS 的 nth-child 是基于 1 的，因此示例中传递的整数值不同）。让我们继续使用 jQuery 实现以完成一个完整的示例：\n\n\
    ![](img/66399f6bc0b186cf74d5dbe299211a7c_109_0.png)\n\n"
