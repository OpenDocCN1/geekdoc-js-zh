    <span class="blast myClass">Hi!</span>

    <span class="blast myClass">Mom</span>

    </div>

    ```


    The value in providing a custom class is in differentiating the elements generated
    by each Blast call. If, for example, you used Blast in two locations on your page—once
    in the header and once in the footer—it might be helpful to assign these calls
    different classes so your subsequent JavaScript code and CSS styles can act on
    the text elements appropriately.


    # OPTION: GENERATEVALUECLASS


    generateValue takes a Boolean value (true or false) indicating whether a unique
    class, in the form of .blast-[delimiter]-[keyValue], should be assigned to the
    generated elements.


    **NOTE:** This option is applicable only to the character and word delimiters.


    The [delimiter] placeholder represents the delimiter type used in the call, and
    the [keyValue] placeholder represents the text contained within an individual
    element. Consider the following example:


    ```

    <div>

    Hi Mom

    </div>

    $("div").blast({ delimiter: "word", generateValueClass: true });

    ```


    The element would turn into this:


    ```

    <div class="blast-root">

    <span class="blast-word-Hi">Hi</span>

    <span class="blast-word-Mom">Mom</span>

    </div>

    ```'
