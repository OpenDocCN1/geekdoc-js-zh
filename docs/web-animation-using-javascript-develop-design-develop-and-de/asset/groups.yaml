    Velocity 的反转命令（reverse）默认使用上一次 Velocity 调用中的选项对象——包括其持续时间、缓动（easing）等。在这种情况下，由于上一次调用使用了
    600ms 的持续时间，反转调用也将如此。反转命令还允许你指定一个新的选项对象以扩展到之前的对象上。此演示使用了一种新的 `easeOutQuad` 缓动类型，为动画的反转方向增添了运动设计的格调。


    > 提示：要预览常用缓动类型的行为，请访问 http://easings.net。


    当反转动画完成后，最后一次 Velocity 调用将通过 2000ms 的持续时间将元素透明度值过渡到 0，从而将其淡出视野。这完成了整个演示，让浏览器的画布保持在与开始时相同的视觉状态：整洁且空白！你的工作到此结束。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_179_0.png)


    # 结语


    从强制同步（force-feeding）到值函数（value functions），再到反转（reverse），本本指南说明了 Velocity 动画引擎的强大。希望这一章已经让你信服，本本书对
    Velocity 的关注是值得的。在少于 75 行简洁、易读且高性能的代码中，你创建了一个丰富的 3D 场景，这在纯 HTML 中是以前所未见的方式实现的。


    让这个演示作为一个具体的例子，说明了看起来复杂的动画实际上可以有多简单——尤其是当你使用正确的工具并采用最佳实践时。我希望这本书已经将你在网络上看到的精美动画工作提炼为一组易于理解和遵循的原则，以供你在追求自己的运动设计时参考。现在，去设计一些精美的网站和应用
    吧！一旦你组合出酷酷的东西，请在 Twitter 上展示给我看：twitter.com/shapiro。


