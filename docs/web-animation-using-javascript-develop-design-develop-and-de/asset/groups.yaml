    此操作将每个 HTML 元素的字符串表示连接到一个主字符串上，然后将其转换为 JEO 并一次性追加到 DOM 中。通过这种方式，浏览器收到了显式指令，一次性插入所有内容，并据此进行性能优化。


    很简单，对吧？正如你在本章的剩余部分中看到的，性能最佳实践通常像这样简单。你只需要训练自己的直觉，知道在何时使用它们。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_144_0.png)


    ## 技巧：避免影响相邻元素


    考虑元素动画对相邻元素的影响是非常重要的。


    ## 问题


    当一个元素的尺寸发生动画变化时，这些往往会影响附近元素的定位。例如，如果两个兄弟元素之间的某个元素宽度收缩，那么这两个兄弟元素的绝对位置将发生动态变化，以保持在动画元素旁边。另一个例子可能是动画一个没有显式定义宽度和高度属性的父元素内部的子元素。相应地，当子元素进行动画时，父元素会调整自身的大小，以便继续完全包裹子元素。实际上，子元素不再是唯一正在动画的元素——父元素的尺寸也在发生动画，这增加了浏览器在动画循环的每次
    tick 中需要执行的工作量！


    许多 CSS 属性的修改都可能导致相邻元素的尺寸和位置调整，包括 top、right、bottom 和 left；所有的 margin 和 padding
    属性；border 厚度以及 width 和高度尺寸。


    作为一名关注性能的开发者，你需要意识到动画这些属性对你的页面可能产生的影响。始终问自己，你正尝试动画化的每个属性是如何影响附近的元素的。如果有一种重写代码的方法，可以将元素之间的变化相互隔离，那么请考虑这样做。事实上，有一种简单的方法可以实现这一点——看解决方案吧！


    ## 解决方案


    避免影响相邻元素的简单解决方案是尽可能对 CSS transform 属性进行动画处理（translateX, translateY, scaleX, scaleY,
    rotateZ 和 rotate）。`transform` 属性的独特之处在于，它们会将目标元素提升到隔离的层中，并与页面的其余部分分开渲染（得益于 GPU
    的性能提升），从而使相邻元素不受影响。例如，当将元素的 `translateX` 动画值为 "500px" 时，元素将向右移动 500px，同时叠加在动画路径上存在的任何元素之上。如果路径上没有元素（也就是说，没有元素会影响它），那么使用
    `translateX` 对页面视觉效果的影响与你使用速度慢得的效果进行动画是相同的。


    因此，只要可能，曾经看起来像这样的动画：


    ```javascript

    // 将元素向左移动 500px

    $element.velocity({ left: "500px" });

    ```


    应该被重构为：


    ```javascript

    // 更快：使用 translateX

    $element.velocity({ translateX: "500px" });

    ```


    同样，如果你可以用 `translateY` 替换 `top`，请尽管这样做：


    ```javascript

    $element.velocity({ top: "100px" });

    // 更快：使用 translateY

    $element.velocity({ translateY: "100px" });

    ```


    > 注意：有时你实际上打算使用 `left` 或 `top`，以便改变相邻元素的位置。在所有其他情况下，养成使用 `transform` 属性的习惯。其性能影响是巨大的。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_146_0.png)


    ## 考虑透明度而非颜色


    `opacity` 是另一个接收 GPU 渲染加速的 CSS 属性，因为它不会影响元素的定位。因此，如果页面上有某些元素你正在对其进行动画处理（例如，当用户悬停时改变颜色），请考虑改为对
    `opacity` 进行动画。如果最终效果看起来几乎和颜色动画一样好，请考虑坚持使用——你只是在不损害视觉效果的情况下提升了 UI 的性能。


    作为一名关注性能的开发者，你不再被允许随意选择动画属性。你现在必须考虑你所选择的每个属性的影响。


    > 注意：请参考 CSSTiggers.com 了解 CSS 属性如何影响浏览器性能的分类。


    ![](img/66399f6bc0b186cf74d5dbe299211a7c_147_0.png)


    ## 技巧：减少并发负载


    浏览器有瓶颈。找出它们是什么，并保持在它们之下。


    ## 问题


    当页面首次加载时，浏览器会尽可能快地处理 HTML、CSS、JavaScript 和图像。在此期间发生的动画往往会有卡顿感，这并不意外——它们正在竞争有限有限资源。因此，尽管页面的加载序列通常是展示你所有动态设计技能的好时机，但如果你想避免用户对你的网站留下卡顿的第一印象，最好还是克制一下。


    当页面上同时发生任何动画时（无论它们发生在页面生命周期的哪个阶段），就会出现类似的并发瓶颈。在这种情况下，浏览器可能会由于同时处理许多样式更改的压力而崩溃，并出现掉帧。


    幸运的是，有一些聪明的技巧可以减少并发动画负载。


    ## 解决方案


    解决并发问题有两种方法：交错（stagger）和将动画拆分为序列。


    ### 交错


    减少并发动画负载的一种方法是利用 Velocity UI 包的 `stagger` 特性，它通过指定的持续延迟一组元素中连续动画的开始时间。例如，要让一组中的每个元素动画到透明度值
    1，且开始时间之间有 300ms 的连续延迟，你的代码可能如下：


    ```javascript

    $elements.velocity({ opacity: 1 }, { stagger: 300 });

    ```


    元素不再完美同步地进行动画；相反，在整个动画序列的刚开始，只有第一个元素在进行动画。稍后，在整个序列的最后，只有最后一个元素在进行动画。你实际上分散了动画序列的总工作负载，使得浏览器每次执行的工作始终比它同时动画每个元素时要执行的要少。此外，在你的动态设计中实现交错通常是一个很好的美学选择。（第
    3 章“动态设计理论”进一步探讨了交错的优点。）


    ### 多动画序列


    还有一种减少并发负载的明智方法：将属性动画拆分为多动画序列。以对元素透明度值的动画为例。这通常是一个压力较小的操作。但如果你同时对元素的 `width` 和
    `box-shadow` 属性进行动画，你将给浏览器带来多得的工作：会有更多像素受到影响，需要更多的计算。


    因此，看起来像这样的动画：


    ```javascript

    $images.velocity({ opacity: 1, boxShadowBlur: "50px" });

    ```


    可能会被重构为：


    ```javascript

    $images

    .velocity({ opacity: 1 })

    .velocity({ boxShadowBlur: "50px" });

    ```


    由于这些单个属性动画是一个接一个发生的，浏览器需要的并发工作更少了。请注意，这里所做的创意权衡是我们选择了延长整个动画序列的持续，这对于你的特定用例可能可能也可能不可取。


    由于这种优化涉及改变你动态设计的意图，因此这不是一种应该始终使用的技术。将其视为最后的手段吧。如果你需要从低性能设备中压榨额外的性能，那么这种技术可能是适用的。否则，不要使用此类技术预优化你网站上的代码，否则你最终将得到不必要的臃肿且无效的代码。


