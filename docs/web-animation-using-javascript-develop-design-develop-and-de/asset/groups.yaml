    # COLORS


    Velocity supports color animation for these CSS properties: color, backgroundColor,

    borderColor, and outline. In Velocity, color properties accept only hex strings

    inputs, for example, #000000 (black) or #e2e2e2 (light gray). For more granular
    color

    control, you can animate the individual red, green, and blue components of a color

    property, as well as the alpha component. Red, green, and blue range in value
    from o to

    255, and alpha (which is equivalent to opacity) ranges from o to 1.'
