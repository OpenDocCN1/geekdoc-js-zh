  trans: "\n\n在 JavaScript 中，`functions`是由 `EVENTS`（事件）触发的。\n\n我们有很多 `EVENT` 类型可以选择来激活我们的函数。\n\
    \n![](img/index-17_1.jpg)\n\n返回，简单\n\n```html\n<html><body>\n<script>\nfunction\
    \ simple() {\n  return \"howdy\";\n}\nalert(simple());\n</script>\n</body>\n</html>\n\
    ```\n\n![](img/index-18_1.jpg)\n\n返回，简单，带参数\n\n```html\n<html>\n<body>\n<script>\n\
    function simple(yourMessage) {\n  return yourMessage;\n}\nalert(simple(\"Hi Everyone\"\
    ));\n</script>\n</body>\n</html>\n```\n\n![](img/index-19_1.jpg)\n\n返回，简单，带参数\n\
    \n```html\n<html>\n<body>\n<script>\nfunction simple(yourMessage) {\n  let greeting\
    \ = \"Hi there \" + yourMessage;\n  return yourMessage;\n}\nalert(simple(\"So\
    \ good to see you\"));\n</script>\n</body>\n</html>\n```\n\n![](img/index-20_1.jpg)\n\
    \n返回，简单，带参数\n\n```html\n<html>\n<body>\n<script>\nfunction simple() {\n  let person\
    \ = prompt(\"Enter your Name?\", \"\");\n  let greeting = \"Howdy \" + person;\n\
    \  return greeting;\n}\nalert(simple());\n</script>\n</body>\n</html>\n```\n\n\
    ![](img/index-21_1.jpg)\n\n在 head 中函数并返回\n\n```html\n<html>\n<head><title>使用 return\
    \ 在 head 中编写函数</title>\n<script>\nfunction ourMessage() {\n  return \"Hi Everyone\"\
    ;\n}\nfunction showText() {\n  document.write(ourMessage());\n}\n</script>\n</head>\n\
    <body onload=\"showText();\">\n</body>\n</html>\n```\n\n![](img/index-22_1.jpg)\n\
    \n### 什么是 onload 事件？\n\n`<body onload =ourMessage();\">` `onload` 事件在页面上所有内容完成加载时`触发`。\n\
    \n因此，我们创建的名为 `ourMessage()` 的函数将在`页面加载完成`的瞬间被`激活`。`onload` 事件是我们可以选择的用于激活函数的众多事件之一。\n\
    \n现在让我们学习用不同的事件来触发我们的代码，例如当人员点击 `BUTTON`（按钮）时。\n\n![](img/index-23_1.jpg)\n\n\
    #### 我们按钮的 onclick 事件\n\n```html\n<html>\n<head><title>按钮点击</title>\n<script>\n\
    function ourFunction() {\n  alert(\"Hi Everyone\");\n}\n</script>\n</head>\n<body>\n\
    Push the Button <br>\n<button onclick=\"ourFunction();\">Enter</button>\n<br>\n\
    </body>\n</html>\n```\n\n![](img/index-24_1.jpg)\n\n#### 带计数器的按钮\n\n```html\n\
    <html><head><title>按钮点击</title>\n<script>\nlet theText = \"Clicks\";\nlet ourCounter\
    \ = 0;\nfunction ourFunction() {\n  ourCounter += 1;\n  document.getElementById(\"\
    displayText\").value = theText + ourCounter;\n}\n</script></head>\n<body>\nPush\
    \ the Button <br>\n<button onclick=\"ourFunction();\">Enter</button>\n<br>\n<hr\
    \ width =\"200px\" align=\"left\">Message is Displayed Here <br>\n<textarea id=\"\
    displayText\" rows=\"1\"></textarea>\n</body>\n</html>\n```\n\n![](img/index-25_1.jpg)\n\
    \n#### 询问并说名字\n\n```html\n<html\n<head><title> 询问并说名字 </title></head>\n<body>\n\
    <script>\nlet name = prompt(\"Enter your name\",\"\");\nalert(\"Hi \" + name);\n\
    </script>\n</body>\n</html>\n```\n\n![](img/index-26_1.jpg)\n\n#### 如果简单则提示\n\n\
    ```html\n<html><head><title>提示提示函数</title></head>\n<body>\n<script>\nlet name\
    \ = prompt(\"Enter your name\");\nif (name == \"chris\") {\n  document.write(\"\
    Hi Chris\");\n}\n</script>\n</body>\n</html>\n```\n\n![](img/index-27_1.jpg)\n\
    \n#### 询问并说名字，如果名字是\n\n```html\n<html><head><title>询问，说名字，如果是人，否则</title></head>\n\
    <body>\n<script>\nlet name = prompt(\"Enter your name\",\"\");\nif (name == \"\
    chris\") {\n  alert(\"Hi \" + name);\n}\nelse {\n  alert(\"Where is Chris?\");\n\
    }\n</script>\n</body>\n</html>\n```\n\n![](img/index-28_1.jpg)\n\n#### 输入一个数字，返回\n\
    \n```html\n<html><head>\n<script>\nfunction askNumber() {\n  let question = prompt(\"\
    Enter a number\",\"\");\n  return question;\n}\nfunction displayIt(where, whatFunction)\
    \ {\n  document.getElementById(where).innerHTML = whatFunction;\n}\n</script>\n\
    </head>\n<body>\n<button onclick=\"displayIt('div1', askNumber());\"><h2>Enter\
    \ Number</h2></button>\n<div id=\"div1\"></div>\n</body>\n</html>\n```\n\n![](img/index-29_1.jpg)\n\
    \n#### 返回，绝对值\n\n```html\n<html><body><script>\nfunction ourFunction() {\n  let\
    \ question = prompt(\"Enter a number\",\"\");\n  let answer = Math.abs(question);\n\
    \  return answer;\n}\nfunction showIt(where, whatFunction) {\n  document.getElementById(where).innerHTML\
    \ = whatFunction;\n}\n</script>\n<button onclick=\"showIt('div1', ourFunction());\"\
    ><h2>Absolute Value</h2></button>\n<div id=\"div1\"></div>\n</body>\n</html>\n\
    ```\n\n![](img/index-30_1.jpg)\n\n#### 使用 textarea 用户输入\n\n```html\n<html><head><title>用户输入</title>\n\
    <script>\nfunction ourFunction() {\n  let theText = document.getElementById(\"\
    enteredText\").value;\n  document.getElementById(\"displayText\").value = theText;\n\
    }\n</script></head>\n<body>\nEnter Text Here <br>\n<textarea id =\"enteredText\"\
    \ rows=\"1\"></textarea> <br>\n<button onclick=\"ourFunction();\">Enter</button>\
    \ <br>\n<hr width =\"200px\" align=\"left\">Text Displayed Here <br>\n<textarea\
    \ id =\"displayText\" rows=\"1\"></textarea>\n</body>\n</html>\n```\n\n![](img/index-31_1.jpg)\n\
    \n### 如何设计应用\n\n我们从代码开始吗？不。我们从大声说出想做什么开始。然后写下想要完成的每一件事。让我们一起设计一个界面。让我们先讨论一下。\n\
    \n我想以多种方式显示日期和时间。我想单独显示星期。我想单独显示月份。我想让日期时间和更新。\n\n![](img/index-32_1.jpg)\n\n\
    #### 获取日期星期\n\n```html\n<html><head><script>\nfunction dateGetDayName() {\n  let\
    \ theDate = new Date();\n  let theDay = theDate.getDay();\n  if (theDay == 0)\
    \ { return \"Sunday\"; }\n  if (theDay == 1) { return \"Monday\"; }\n  if (theDay\
    \ == 2) { return \"Tuesday\"; }\n  if (theDay == 3) { return \"Wednesday\"; }\n\
    ```\n![](img/index-33_1.jpg)\n```html\nif (theDay == 4) { return \"Thursday\"\
    ; }\n```\n![](img/index-34_1.jpg)\n```html\n}\nfunction showInfo() {\n\ndocument.write(dateGetDayName())\n\
    }\n</script>\n</head>\n<body onload=\"showInfo();\">\n<div id=\"day\">Day</div>\n\
    </body>\n</html>\n```\n\n![](img/index-35_1.jpg)\n\n<!--\n正如上面所示，我们的代码很快变得复杂。\n\
    让我们简化代码和编程方式。\n让我们把函数定义在外部文件中。\n我们可以这样保持代码的整洁。\n-->\n\n![](img/index-36_1.jpg)\n\
    \n#### 保存为 dateGetDayName.js\n\n```javascript\nfunction dateGetDayName() {\n \
    \ let theDate = new Date();\n  let theDay = theDate.getDay();\n  if (theDay ==\
    \ 0) { return \"Sunday\"; }\n  if (theDay == 1) { return \"Monday\"; }\n  if (theDay\
    \ == 2) { return \"Tuesday\"; }\n  if (theDay == 3) { return \"Wednesday\"; }\n\
    \  if (theDay == 4) { return \"Thursday\"; }\n  if (theDay == 5) { return \"Friday\"\
    ; }\n  if (theDay == 6) { return \"Saturday\"; }\n}\n```\n\n![](img/index-37_1.jpg)\n\
    \n//在 **ourProject 文件夹**中，我们创建了 3 个 **新** **文件夹**并命名为 js, html, css\n\n//我们将 `dateGetDayName.js`\
    \ 保存在 `ourProject` 文件夹的 `js` 文件夹中\n\n//下一个 html 页面使用了这个脚本！\n\n//ourProject 文件夹下的\
    \ `js` 文件夹内包含 `dateGetDayName.js` 文件。\n\n![](img/index-38_1.jpg)\n\n"
