  trans: "\n\n`<script src=\"../js/showInfo.js\"></script>` 在接下来的 2 页页中，我们将首先创建一个简单的\
    \ `js` 和 `html` 文件。然后，我们的 `index.html` 文件将引用我们创建的 `html` 文件。\n\n![](img/index-76_1.jpg)\n\
    \n保存为 `ourSimpleFunction.js`\n\n```javascript\nfunction ourSimpleFunction()\n\
    {\n  alert(\"Hi Everyone\");\n}\n```\n\n//我们将此文件保存为 `ourSimpleFunction.js`，位于\
    \ `ourProject` 文件夹下的 `js` 文件夹中。\n\n![](img/index-77_1.jpg)\n\n使用 `ourSimpleFunction.js`\n\
    \n```html\n<html>\n<head>\n  <title>按钮点击</title>\n  <script src=\"../js/ourSimpleFunction.js\"\
    ></script>\n</head>\n<body>\n  点击按钮 <br>\n  <button onclick=\"ourSimpleFunction();\"\
    >进入</button>\n  <br>\n</body>\n</html>\n```\n\n<!-- 我们将此文件保存为 `ourSimpleFunction.html`，位于我们的\
    \ `html` 文件夹中。 -->\n\n![](img/index-78_1.jpg)\n\n保存为 `index.html`\n\n```html\n\
    <html>\n<head>\n  <style>\n    a{\n      color: rgb(30, 99, 211);\n      font-size:\
    \ 20pt;\n    }\n  </style>\n</head>\n<body style=\"background-color:rgb(140, 192,\
    \ 192);\">\n  <div id=\"first\" style=\"font-size:30pt\">首页文件</div>\n  <hr>\n\
    \  <a href=\"./html/ourSimpleFunction.html\">我们的简单函数</a>\n</body>\n</html>\n```\n\
    \n<!-- 我们将此文件保存为 `index.html`，位于 `ourProject` 文件夹中。 -->\n\n![](img/index-79_1.jpg)\n\
    \n### ourProject 的文件结构\n\n文件结构显示了我们保存 `index.html` 文件的位置。\n当我们打开 `index.html`\
    \ 文件时，可以点击链接打开我们的应用程序之一。我们可以随时添加更多链接。\n\n![](img/index-80_1.jpg)\n\n### 我们 js\
    \ 文件的文件结构\n`ourProject` 文件夹中的 `js` 文件夹包含了我们的 JavaScript `library`！\n\n![](img/index-81_1.jpg)\n\
    \n### 我们 html 文件的文件结构\n`ourProject` 文件夹中的 `html` 文件夹包含了我们的 `html` 文件，这些文件会触发库中的\
    \ `js` 文件！\n\n![](img/index-82_1.jpg)\n\n### 文件结构的优势\n\n随着我们向 `js` 库文件夹添加越来越多的\
    \ `js` 函数，我们可以在 `html` 文件夹中添加更多的 `html` 文件来触发它们。\n然后我们可以在 `index.html` 文件中创建`超链接`来激活我们的\
    \ `html` 文件。\n现在创建复杂项目对我们变得非常简单，因为我们有了良好的结构！\n\n![](img/index-83_1.jpg)\n\n保存为\
    \ `mathNumberSquare.js`\n\n```javascript\nclass mathFunctions\n{\n  numberSquare(number)\n\
    \  {\n    return number * number;\n  }\n}\nlet ourMath = new mathFunctions();\n\
    //我们当然可以把所有的数学函数放在这一个类中！\n// 这取决于每个程序员如何喜欢思考数据。\n// 下一页将此脚本。\n```\n\n![](img/index-84_1.jpg)\n\
    \n使用 `mathNumberSquare.js`\n\n```html\n<html>\n<body style=\"background-color:rgb(140,\
    \ 192, 192);\">\n  <script src=\"../js/mathNumberSquare.js\"></script>\n  <script\
    \ src=\"../js/showInfo.js\"></script>\n  <button onclick=\"showInfo('showResult',\
    \ ourMath.numberSquare(7), '结果是')\">点击</button>\n  <div id=\"showResult\" style=\"\
    font-size:30pt\">结果</div>\n</body>\n</html>\n```\n<!-- 注意我们引用了创建的名为 `ourMath`\
    \ 的类，然后使用点符号。接着是函数名。 -->\n\n![](img/index-85_1.jpg)\n\n### 类方法很有用，但是..\n\n我们需要使用类方法来编程吗？\n\
    不需要！\n但如果我们喜欢使用它，我们就可以这样做，因为类方法在很多领域都很有用，我们用得越频繁，就越熟悉。\n\n只使用函数方法好吗？\n是的！\n如果只需要函数，我们就使用函数！\n\
    我们保持每个函数的简单！\n我们让每个函数只做一件事！\n以后，我们可以将所有相关的函数放在一个文件中。现在，我们使用独立的文件，因为这让思考每个函数变得更容易。\n\
    正如此，让我们再次展示示例，使用函数方法作为我们的设计模式。\n\n![](img/index-86_1.jpg)\n\n保存为 `mathNumberSquare1.js`\n\
    \n```javascript\nfunction mathNumberSquare(number)\n{\n  return number * number;\n\
    }\n```\n\n![](img/index-87_1.jpg)\n\n使用 `mathNumberSquare1.js`\n\n```html\n<html>\n\
    <body style=\"background-color:rgb(140, 192, 192);\">\n  <script src=\"../js/mathNumberSquare1.js\"\
    ></script>\n  <script src=\"../js/showInfo.js\"></script>\n  <button onclick=\"\
    showInfo('showResult', mathNumberSquare(7), '结果是')\">点击</button>\n  <div id=\"\
    showResult\" style=\"font-size:30pt\">结果</div>\n</body>\n</html>\n```\n\n![](img/index-88_1.jpg)\n\
    \n### 将所有 js 文件合并为一个\n\n我们打开包含许多 `js` 文件的 `js` 文件夹。\n在地址栏输入 `cmd`\n这会在...打开我们的\
    \ `js` 文件夹\n\n## 命令行提示符\n\n### 我们输入单词\n```bash\ncopy *.js combine.js\n```\n并按回车\n\
    它将创建一个名为 `combine.js` 的新文件\n这个新文件将我们所有的 `.js` 文件包含在一个文件中。这可以让我们部署网站变得简单得多！\n\n\
    ![](img/index-89_1.jpg)\n\n### JavaScript 基础教程\n\n这是一个简单的 JavaScript 教程集合，教授了\
    \ JavaScript 编程的基础。\n当我们学习接下来几页的每个教程时，可以将它们添加到我们的 js 库中，并创建一个 html 文件来激活它们，我们还可以向我们的\
    \ `index.html` 文件添加入口。\n在书结束时，我们将拥有一个非常令人深刻的 js 库文件夹，有一个相应的 html 文件夹来激活我们的脚本，以及一个\
    \ `index.html` 文件让一切都变得更容易找到。\n\n![](img/index-90_1.jpg)\n\n使用 `location.href`\
    \ 确认\n\n```html\n<html>\n<head>\n  <title>确认</title>\n  <script>\n    function\
    \ goHere()\n    {\n      if (confirm(\"去 google\"))\n      {\n        location.href\
    \ = \"http://www.google.com\";\n      }\n    }\n  </script>\n</head>\n<body>\n\
    \  <input type=\"button\" value=\"你想去 google 吗\" onclick=\"goHere()\">\n</body>\n\
    </html>\n```\n\n![](img/index-91_1.jpg)\n\n询问并命名\n```html\n<html>\n<head>\n  <title>询问说名字</title>\n\
    \  <script>\n    function ourQuestion()\n    {\n      let name = prompt(\"输入名字\"\
    );\n      alert(name);\n    }\n  </script>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n![](img/index-92_1.jpg)\n\n日期和时间\n```html\n<html>\n<head>\n  <title>日期</title>\n\
    \  <script>\n    function ourTime()\n    {\n      let time = new Date();\n   \
    \   document.write(time);\n    }\n  </script>\n</head>\n<body>\n  <input type=\"\
    button\" value=\"点击获取时间\" onclick=\"ourTime()\">\n</body>\n</html>\n```\n\n![](img/index-93_1.jpg)\n\
    \ndo 循环询问输入名字\n```html\n<html>\n<head>\n  <title>do-while 输入名字</title>\n  <script>\n\
    \    function enterName()\n    {\n      let name;\n      do {\n        name =\
    \ prompt(\"输入名字\");\n      } while (!name);\n      alert(\"你好 \" + name);\n  \
    \  }\n  </script>\n</head>\n<body>\n  <input type=\"button\" value=\"输入名字\" onclick=\"\
    enterName()\">\n</body>\n</html>\n```\n\n![](img/index-94_1.jpg)\n\ndo 循环询问密码和位置\n\
    ```html\n<html>\n<head>\n  <title>do-while 位置</title>\n  <script>\n    function\
    \ pass2Go()\n    {\n      let pass;\n      do {\n        pass = prompt(\"输入密码\"\
    );\n      } while (!pass);\n      if (pass == \"789\") {\n        location.href\
    \ = \"http://www.google.com\";\n      } else {\n        location.href = \"http://www.yahoo.com\"\
    ;\n      }\n    }\n  </script>\n</head>\n<body>\n  <input type=\"button\" value=\"\
    输入密码跳转站点\" onclick=\"pass2Go()\">\n</body>\n</html>\n```\n\n![](img/index-95_1.jpg)\n\
    \ndo 循环使用与逻辑\n```html\n<html>\n<head>\n  <title>do-while 使用 &&</title>\n  <script>\n\
    \    function nameAge()\n    {\n      let name;\n      let age;\n      do {\n\
    \        name = prompt(\"输入名字\");\n        age = prompt(\"输入年龄\");\n      } while\
    \ (!name && !age);\n      alert(name + \" 今年 \" + age + \" 岁\");\n    }\n  </script>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n![](img/index-96_1.jpg)\n\n"
