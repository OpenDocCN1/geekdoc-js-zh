    Planning Bigger Projects


    When we are creating our **library**, we may want to organize things by using
    an **index.html** file.


    We create an **index.html** file that will reference the **html folder files**
    to activate our J**avaScript** files in our **js folder**.


    If we had placed our **.html** files in only the **ourProject** folder, then we
    would use


    **<script src="./js/showInfo.js"></script>** But, since we placed our **.html**
    files in the **html** **folder**, then we must use **two dots** to reference that
    file from the **html** folder.'
