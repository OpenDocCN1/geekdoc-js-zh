    ```\n\n![](img/index-65_1.jpg)\n\n获取日期，获取月份，获取时间，持续\n\n```html\n<html>\n<head>\n\
    \    <script src=\"../js/dateGetDayName.js\"></script>\n    <script src=\"../js/dateGetMonthName.js\"\
