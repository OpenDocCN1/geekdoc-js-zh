    \n![](index-7_1.jpg)\n\n# Make a New Folder\n\nOur project begins with us creating\
    \ a **New Folder**.\n\n`ourProject` folder will hold all of our `js`, `html` and\
    \ `css` files.\n\n- **Right Click** on the **Desktop** and choose **New Folder**\n\
    - **Rename** the **Folder** to\n\n## `ourProject`\n\nWe will **save** all of our\
    \ **files** in this **folder**.\n\n![](index-8_1.jpg)\n\n# Text Editor\n\nWe can\
    \ choose from many Text Editors to make our JavaScripts, including Notepad, that\
    \ comes with Windows, but Notepad is not as good as newer alternatives. Let's\
    \ check out the excellent and free JavaScript text editors.\n\n### VS CODE\nhttps://code.visualstudio.com/\n\
    \n### ATOM\nhttps://atom.io/\n\n### BRACKETS\nhttp://brackets.io/\n\n![](index-9_1.jpg)\n\
    \n### Sublime\nhttps://www.sublimetext.com/\n\n### Notepad++\nhttps://notepad-plus-plus.org/downloads/\n\
    \nVS Code is favorite of many. After we have downloaded and installed our Editor,\
    \ such as VS Code, we will then make our `.html` file.\n\n# First HTML Page\n\n\
    ```html\n<html>\n<head>\n<title>Our First Page</title>\n</head>\n<body>\nWe write\
    \ anything here\n</body>\n</html>\n```\n\nSave this `First.html` file in `ourProject`\
    \ folder.\n\n# First HTML Page \n\n```html\n<html>\n<head>\n<title>Our First Page</title>\n\
    </head>\n<body>\nWe write anything here\n</body>\n</html>\n```\n\nSave this `First.html`\
    \ file in `ourProject` folder.\n\n# First HTML Page \n\n```html\n<html>\n<head>\n\
    <title>Our First Page</title>\n</head>\n<body>\nWe write anything here\n</body>\n\
    </html>\n```\n\nSave this `First.html` file in `ourProject` folder.\n\n# Our Function\
    \ defined in the HEAD\n\n```html\n<html>\n<head>\n<title>Our First Page</title>\n\
    </head>\n<body>\nWe write anything here\n<script>\nfunction ourMessage() {\n \
    \ alert(\"Hi everyone\");\n}\n</script>\n</body>\n</html>\n```\n\nSave this `First.html`\
    \ file in `ourProject` folder.\n\n# Our Function defined in the BODY\n\n```html\n\
    <html>\n<head>\n<title>Our First Page</title>\n</head>\n<body>\nWe write anything\
    \ here\n<script>\nfunction ourMessage() {\n  alert(\"Hi everyone\");\n}\n</script>\n\
    </body>\n</html>\n```\n\nSave this `First.html` file in `ourProject` folder.\n\
    \n# Our Function is Like a Sandwich\n\n```javascript\nfunction ourMessage() {\n\
    \  alert(\"Hi everyone\");\n}\n```\n\nAs we have learned from the past two pages;\
    \ we can **define** our function in the **head**, or in the **body**. Either way\
    \ is fine to do. And as shown above, our function is currently very simple and\
    \ acts as a container for the message code.\n"
