    \n保存为 `showInfo.js`\n\n```javascript\nfunction showInfo(whichDiv, functionName,\
    \ ourText) {\n    document.getElementById(whichDiv).innerHTML = ourText + ' '\
    \ + functionName;\n}\n```\n\n// 因为我们在许多脚本中反复使用 `showInfo`，所以我们将其封装了一个独立的函数以便调用。\n\
    // 我们将此文件保存为 `showInfo.js`\n// 我们将此文件保存在 `ourProject` 文件夹下的 `js` 文件夹中\n\n![](img/index-59_1.jpg)\n\
    \n获取月份，获取日期，使用外部文件\n\n```html\n<html>\n<head>\n    <script src=\"../js/dateGetDayName.js\"\
    ></script>\n    <script src=\"../js/dateGetMonthName.js\"></script>\n    <script\
    \ src=\"../js/showInfo.js\"></script>\n    <link rel=\"stylesheet\" href=\"../css/ourStyle.css\"\
    >\n</head>\n<body>\n    <div id=\"monthDiv\" class=\"monthStyle\" onclick=\"showInfo('monthDiv',\
    \ dateGetMonthName(), 'It is ')\">Month</div\n    <div id=\"dayDiv\" class=\"\
    dayStyle\" onclick=\"showInfo('dayDiv', dateGetDayName(), 'Today is ')\">Day</div>\n\
    </body></html>\n```\n\n![](img/index-60_1.jpg)\n\n保存为 `timeGetLocalTime.js`\n\n\
    ```javascript\nfunction timeGetLocalTime() {\n    let theDate = new Date();\n\
    \    theDate.toLocaleString();\n    return theDate;\n}\n\nfunction timeGetLocalTimeRepeat()\
    \ {\n    let theDate = new Date();\n    theDate.toLocaleString();\n    document.getElementById(\"\
    timeDiv\").innerHTML = theDate;\n    //console.log(theDate);\n}\n\nfunction activateTimer()\
    \ {\n    let ourTimer = setInterval(timeGetLocalTimeRepeat, 1000);\n}\n```\n\n\
    ![](img/index-62_1.jpg)\n![](img/index-63_1.jpg)\n\n获取日期，获取月份，获取时间，点击事件\n\n```html\n\
