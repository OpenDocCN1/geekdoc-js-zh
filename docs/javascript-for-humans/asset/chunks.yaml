- fmt: "\n`<script src=\"../js/showInfo.js\"></script>` On the next 2 pages, we will\
    \ first make a simple `js` and `html` file. Our `index.html` file will then reference\
    \ the `html` file we made.\n\n![](index-76_1.jpg)\n\nsave as `ourSimpleFunction.js`\n\
    \n```javascript\nfunction ourSimpleFunction()\n{\n  alert(\"Hi Everyone\");\n\
    }\n```\n\n//we save this file as `ourSimpleFunction.js` in the `js` folder in\
    \ `ourProject` folder.\n\n![](index-77_1.jpg)\n\nuses `ourSimpleFunction.js`\n\
    \n```html\n<html>\n<head>\n  <title>Button Press</title>\n  <script src=\"../js/ourSimpleFunction.js\"\
    ></script>\n</head>\n<body>\n  Push the Button <br>\n  <button onclick=\"ourSimpleFunction();\"\
    >Enter</button>\n  <br>\n</body>\n</html>\n```\n\n<!-- We save this file as `ourSimpleFunction.html`\
    \ in our `html` folder. -->\n\n![](index-78_1.jpg)\n\nsave as `index.html`\n\n\
    ```html\n<html>\n<head>\n  <style>\n    a{\n      color: rgb(30, 99, 211);\n \
    \     font-size: 20pt;\n    }\n  </style>\n</head>\n<body style=\"background-color:rgb(140,\
    \ 192, 192);\">\n  <div id=\"first\" style=\"font-size:30pt\">Index File</div>\n\
    \  <hr>\n  <a href=\"./html/ourSimpleFunction.html\">Our Simple Function</a>\n\
    </body>\n</html>\n```\n\n<!-- We save this file as `index.html` in `ourProject`\
    \ folder. -->\n\n![](index-79_1.jpg)\n\n### File Structure of ourProject\n\nThe\
    \ File Structure, showing where we save our `index.html` file.\nWhen we open the\
    \ `index.html` file we can click on the link to open one of our apps. We can add\
    \ more links anytime.\n\n![](index-80_1.jpg)\n\n### File Structure of our js files\n\
    The `js` folder in `ourProject` folder contains our JavaScript `library`!\n\n\
    ![](index-81_1.jpg)\n\n### File Structure of our html files\nThe `html` folder\
    \ in `ourProject` folder contains our `html` files that trigger the `js` files\
    \ of our library!\n\n![](index-82_1.jpg)\n\n### The File Structure Advantage\n\
    \nAs we add more and more `js` functions to our `js` library folder, we can also\
    \ add more `html` files in our `html` folder, to trigger them.\nWe can then create\
    \ the `hyperlinks` in our `index.html` file, to activate our `html` files.\nIt's\
    \ now very easy for us to create complex projects, because we have good structure!\n\
    \n![](index-83_1.jpg)\n\nsave as `mathNumberSquare.js`\n\n```javascript\nclass\
    \ mathFunctions\n{\n  numberSquare(number)\n  {\n    return number * number;\n\
    \  }\n}\nlet ourMath = new mathFunctions();\n//We can of course put al of our\
    \ math functions in this one class!\n//It is up to each programmer how they enjoy\
    \ thinking about data.\n// The next page uses this script.\n```\n\n![](index-84_1.jpg)\n\
    \nuses `mathNumberSquare.js`\n\n```html\n<html>\n<body style=\"background-color:rgb(140,\
    \ 192, 192);\">\n  <script src=\"../js/mathNumberSquare.js\"></script>\n  <script\
    \ src=\"../js/showInfo.js\"></script>\n  <button onclick=\"showInfo('showResult',\
    \ ourMath.numberSquare(7), 'Result is')\">Press</button>\n  <div id=\"showResult\"\
    \ style=\"font-size:30pt\">Result</div>\n</body>\n</html>\n```\n<!-- notice that\
    \ we reference the class we made called `ourMath` and then use a dot. and then\
    \ the function name. -->\n\n![](index-85_1.jpg)\n\n### The class method is useful,\
    \ but..\n\nDo we need to use the class method to program?\nNo!\nBut if we enjoy\
    \ using it, then we can, because the class method is useful in many areas and\
    \ the more we use it the more familiar we are with it.\n\nIs it good to just use\
    \ the functions method?\nYes!\nWe use Functions, if that is al that is required!\n\
    We keep each function simple!\nWe make each function do ONE thing!\nLater, we\
    \ can place al related functions in one file. For now, we are using separate files,\
    \ because it makes thinking about each function easier.\nBecause of this, let's\
    \ show the example again, using the function method as our design pattern.\n\n\
    ![](index-86_1.jpg)\n\nsave as `mathNumberSquare1.js`\n\n```javascript\nfunction\
    \ mathNumberSquare(number)\n{\n  return number * number;\n}\n```\n\n![](index-87_1.jpg)\n\
    \nuses as `mathNumberSquare1.js`\n\n```html\n<html>\n<body style=\"background-color:rgb(140,\
    \ 192, 192);\">\n  <script src=\"../js/mathNumberSquare1.js\"></script>\n  <script\
    \ src=\"../js/showInfo.js\"></script>\n  <button onclick=\"showInfo('showResult',\
    \ mathNumberSquare(7), 'Result is')\">Press</button>\n  <div id=\"showResult\"\
    \ style=\"font-size:30pt\">Result</div>\n</body>\n</html>\n```\n\n![](index-88_1.jpg)\n\
    \n### Combine all js files into one\n\nWe open our `js` folder, that contains\
    \ our many `js` files.\nWe type in the address bar `cmd`\nThis open our `js` folder\
    \ in the\n\n## Command prompt\n\n### We type in the words\n```bash\ncopy *.js\
    \ combine.js\n```\nand press enter\nIt will make a New file, that is named `combine.js`\n\
    This new file contains all of our `.js` files in ONE file. This can make deploying\
    \ our website much easier!\n\n![](index-89_1.jpg)\n\n### Foundational JavaScript\
    \ Tutorials\n\nHere is a collection of simple JavaScript Tutorials that teach\
    \ the foundation of JavaScript programming.\nAs we are going through each of the\
    \ tutorials on the next pages, we can add them to our js library and make an html\
    \ file to activate them and we can also add the entry to our `index.html` file.\n\
    By the end of the book, we will have a pretty impressive js library folder, with\
    \ a corrosponding html folder to activate our scripts and an `index.html` file\
    \ to make everything easier to find.\n\n![](index-90_1.jpg)\n\nconfirm with `location.href`\n\
    \n```html\n<html>\n<head>\n  <title>confirm</title>\n  <script>\n    function\
    \ goHere()\n    {\n      if (confirm(\"Go to google\"))\n      {\n        location.href\
    \ = \"http://www.google.com\";\n      }\n    }\n  </script>\n</head>\n<body>\n\
    \  <input type=\"button\" value=\"Would you like google\" onclick=\"goHere()\"\
    >\n</body>\n</html>\n```\n\n![](index-91_1.jpg)\n\nask and name\n```html\n<html>\n\
    <head>\n  <title>Ask Say Name</title>\n  <script>\n    function ourQuestion()\n\
    \    {\n      let name = prompt(\"Enter name\");\n      alert(name);\n    }\n\
    \  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](index-92_1.jpg)\n\n\
    date and time\n```html\n<html>\n<head>\n  <title>Current Date</title>\n  <script>\n\
    \    function ourTime()\n    {\n      let time = new Date();\n      document.write(time);\n\
    \    }\n  </script>\n</head>\n<body>\n  <input type=\"button\" value=\"Click for\
    \ Time\" onclick=\"ourTime()\">\n</body>\n</html>\n```\n\n![](index-93_1.jpg)\n\
    \ndo while prompt, enter name\n```html\n<html>\n<head>\n  <title>do while Enter\
    \ Name</title>\n  <script>\n    function enterName()\n    {\n      let name;\n\
    \      do {\n        name = prompt(\"Enter Name\");\n      } while (!name);\n\
    \      alert(\"How are you \" + name);\n    }\n  </script>\n</head>\n<body>\n\
    \  <input type=\"button\" value=\"Enter Name\" onclick=\"enterName()\">\n</body>\n\
