    </body></html>\n```\n\n![](img/index-67_1.jpg)\n\n保存为 `dateDayMessage.js`\n\n\
    ```javascript\nfunction messageFromDay() {\n    if(dateGetDayName() == \"Friday\"\
    ) {\n        return \"It's Friday. Good time to learn something new.\";\n    }\
    \ else if(dateGetDayName() == \"Saturday\") {\n        return \"It's Saturday.\
