    monthStyle\" onclick=\"showInfo('monthDiv', dateGetMonthName(), 'It is ')\">Month</div\n\
    ```\n\n![](img/index-64_1.jpg)\n\n```html\n<div id=\"dayDiv\" class=\"dayStyle\"\
