    \n![](img/index-7_1.jpg)\n\n# 创建新文件夹\n\n我们的项目从创建一个**新文件夹**开始。\n\n`ourProject`\
    \ 文件夹将存放我们所有的 `js`、`html` 和 `css` 文件。\n\n- 在**桌面**上**右键点击**并选择**新建文件夹** \n- 将该**文件夹****重命名**为\n\
    \n## `ourProject`\n\n我们将在这个**文件夹**中**保存**我们所有的**文件**。\n\n![](img/index-8_1.jpg)\n\
    \n# 编辑器\n\n我们可以从许多编辑器中选择编写 JavaScript，包括 Windows 自带的记事本，但记事本不如较新的替代方案。让我们来看看优秀且免费的\
    \ JavaScript 编辑器。\n\n### VS CODE\nhttps://code.visualstudio.com/\n\n### ATOM\n\
    https://atom.io/\n\n### BRACKETS\nhttp://brackets.io/\n\n![](img/index-9_1.jpg)\n\
    \n### Sublime\nhttps://www.sublimetext.com/\n\n### Notepad++\nhttps://notepad-plus-plus.org/downloads/\n\
    \nVS Code 是许多人的最爱。在我们下载并安装编辑器（如 VS Code）之后，我们将创建 `.html` 文件。\n\n# 第一个 HTML 页面\n\
    \n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n</head>\n<body>\n我们在这里写任何内容\n\
    </body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject` 文件夹中。\n\n# 第一个 HTML\
    \ 页面 \n\n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n</head>\n<body>\n我们在这里写任何内容\n\
    </body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject` 文件夹中。\n\n# 第一个 HTML\
    \ 页面 \n\n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n</head>\n<body>\n我们在这里写任何内容\n\
    </body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject` 文件夹中。\n\n# 在 HEAD\
    \ 中定义的函数\n\n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n</head>\n<body>\n\
    我们在这里写任何内容\n<script>\nfunction ourMessage() {\n  alert(\"Hi everyone\");\n}\n\
    </script>\n</body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject` 文件夹中。\n\
    \n# 在 BODY 中定义的函数\n\n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n</head>\n\
    <body>\n我们在这里写任何内容\n<script>\nfunction ourMessage() {\n  alert(\"Hi everyone\"\
    );\n}\n</script>\n</body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject`\
    \ 文件夹中。\n\n# 我们的函数就像三明治\n\n```javascript\nfunction ourMessage() {\n  alert(\"\
    Hi everyone\");\n}\n```\n\n正如我们在过去两页中中学到的；我们可以在 **head** 中**定义**我们的函数，也可以在 **body**\
    \ 中定义。任何一种都是可以的。如上所示，我们的函数目前非常简单，作为消息代码的容器。\n\n"
- fmt: "\nIn JavaScript, `functions` are `triggered` by `EVENTS`.\n\nWe have many\
    \ `EVENT` types to choose from to activate our functions.\n\n![](index-17_1.jpg)\n\
    \nreturn, simple\n\n```html\n<html><body>\n<script>\nfunction simple() {\n  return\
    \ \"howdy\";\n}\nalert(simple());\n</script>\n</body>\n</html>\n```\n\n![](index-18_1.jpg)\n\
    \nreturn, simple, with parameter\n\n```html\n<html>\n<body>\n<script>\nfunction\
    \ simple(yourMessage) {\n  return yourMessage;\n}\nalert(simple(\"Hi Everyone\"\
    ));\n</script>\n</body>\n</html>\n```\n\n![](index-19_1.jpg)\n\nreturn, simple,\
    \ with parameter\n\n```html\n<html>\n<body>\n<script>\nfunction simple(yourMessage)\
    \ {\n  let greeting = \"Hi there \" + yourMessage;\n  return yourMessage;\n}\n\
    alert(simple(\"So good to see you\"));\n</script>\n</body>\n</html>\n```\n\n![](index-20_1.jpg)\n\
    \nreturn, simple, with parameter\n\n```html\n<html>\n<body>\n<script>\nfunction\
    \ simple() {\n  let person = prompt(\"Enter your Name?\", \"\");\n  let greeting\
    \ = \"Howdy \" + person;\n  return greeting;\n}\nalert(simple());\n</script>\n\
    </body>\n</html>\n```\n\n![](index-21_1.jpg)\n\nfunction in head and return\n\n\
    ```html\n<html>\n<head><title>write function in head using return</title>\n<script>\n\
    function ourMessage() {\n  return \"Hi Everyone\";\n}\nfunction showText() {\n\
    \  document.write(ourMessage());\n}\n</script>\n</head>\n<body onload=\"showText();\"\
    >\n</body>\n</html>\n```\n\n![](index-22_1.jpg)\n\n### What is the onload event?\n\
    \n`<body onload =ourMessage();\">` The `onload` event `triggers` when everything\
    \ is done loading on the page.\n\nThus, the function that we made, named `ourMessage()`\
    \ will be `activated` the moment that the `page is finished loading`. The `onload`\
    \ event is one of many events that we can choose from to activate our functions.\n\
    \nLet's now learn to trigger our code with a different event, such as when a person\
    \ clicks on a `BUTTON`.\n\n![](index-23_1.jpg)\n\n#### onclick event for our Button\n\
    \n```html\n<html>\n<head><title>Button Press</title>\n<script>\nfunction ourFunction()\
    \ {\n  alert(\"Hi Everyone\");\n}\n</script>\n</head>\n<body>\nPush the Button\
    \ <br>\n<button onclick=\"ourFunction();\">Enter</button>\n<br>\n</body>\n</html>\n\
    ```\n\n![](index-24_1.jpg)\n\n#### Button with Counter\n\n```html\n<html><head><title>Button\
    \ Press</title>\n<script>\nlet theText = \"Clicks\";\nlet ourCounter = 0;\nfunction\
    \ ourFunction() {\n  ourCounter += 1;\n  document.getElementById(\"displayText\"\
    ).value = theText + ourCounter;\n}\n</script></head>\n<body>\nPush the Button\
    \ <br>\n<button onclick=\"ourFunction();\">Enter</button>\n<br>\n<hr width =\"\
    200px\" align=\"left\">Message is Displayed Here <br>\n<textarea id=\"displayText\"\
    \ rows=\"1\"></textarea>\n</body>\n</html>\n```\n\n![](index-25_1.jpg)\n\n####\
    \ ask and say name\n\n```html\n<html>\n<head><title> Ask and Say Name </title></head>\n\
    <body>\n<script>\nlet name = prompt(\"Enter your name\",\"\");\nalert(\"Hi \"\
    \ + name);\n</script>\n</body>\n</html>\n```\n\n![](index-26_1.jpg)\n\n#### prompt\
    \ if simple\n\n```html\n<html><head><title>Prompt function</title></head>\n<body>\n\
    <script>\nlet name = prompt(\"Enter your name\");\nif (name == \"chris\") {\n\
    \  document.write(\"Hi Chris\");\n}\n</script>\n</body>\n</html>\n```\n\n![](index-27_1.jpg)\n\
    \n#### ask and say name, if name\n\n```html\n<html><head><title>Ask, Say name,\
    \ if person, else</title></head>\n<body>\n<script>\nlet name = prompt(\"Enter\
    \ your name\",\"\");\nif (name == \"chris\") {\n  alert(\"Hi \" + name);\n}\n\
    else {\n  alert(\"Where is Chris?\");\n}\n</script>\n</body>\n</html>\n```\n\n\
    ![](index-28_1.jpg)\n\n#### enter a number, return\n\n```html\n<html><head>\n\
    <script>\nfunction askNumber() {\n  let question = prompt(\"Enter a number\",\"\
    \");\n  return question;\n}\nfunction displayIt(where, whatFunction) {\n  document.getElementById(where).innerHTML\
    \ = whatFunction;\n}\n</script>\n</head>\n<body>\n<button onclick=\"displayIt('div1',\
    \ askNumber());\"><h2>Enter Number</h2></button>\n<div id=\"div1\"></div>\n</body>\n\
    </html>\n```\n\n![](index-29_1.jpg)\n\n#### return, absolute number\n\n```html\n\
    <html><body><script>\nfunction ourFunction() {\n  let question = prompt(\"Enter\
    \ a number\",\"\");\n  let answer = Math.abs(question);\n  return answer;\n}\n\
    function showIt(where, whatFunction) {\n  document.getElementById(where).innerHTML\
    \ = whatFunction;\n}\n</script>\n<button onclick=\"showIt('div1', ourFunction());\"\
    ><h2>Absolute Value</h2></button>\n<div id=\"div1\"></div>\n</body>\n</html>\n\
    ```\n\n![](index-30_1.jpg)\n\n#### User Input using textarea\n\n```html\n<html><head><title>User\
    \ Input</title>\n<script>\nfunction ourFunction() {\n  let theText = document.getElementById(\"\
    enteredText\").value;\n  document.getElementById(\"displayText\").value = theText;\n\
    }\n</script></head>\n<body>\nEnter Text Here <br>\n<textarea id =\"enteredText\"\
    \ rows=\"1\"></textarea> <br>\n<button onclick=\"ourFunction();\">Enter</button>\
    \ <br>\n<hr width =\"200px\" align=\"left\">Text Displayed Here <br>\n<textarea\
    \ id =\"displayText\" rows=\"1\"></textarea>\n</body>\n</html>\n```\n\n![](index-31_1.jpg)\n\
    \n### How to Design Applications\n\nDo we start in code? No. We start by saying\
    \ out loud what we want to do. We then write down each thing that we want to accomplish.\
    \ Let's design an interface together. Let's talk it out first.\n\nI want to show\
    \ the date and time in many ways. I want to show the day by itself. I want to\
    \ show the month by itself. I want to have date and time updating.\n\n![](index-32_1.jpg)\n\
    \n#### date get Day\n\n```html\n<html><head><script>\nfunction dateGetDayName()\
    \ {\n  let theDate = new Date();\n  let theDay = theDate.getDay();\n  if (theDay\
    \ == 0) { return \"Sunday\"; }\n  if (theDay == 1) { return \"Monday\"; }\n  if\
    \ (theDay == 2) { return \"Tuesday\"; }\n  if (theDay == 3) { return \"Wednesday\"\
    ; }\n```\n![](index-33_1.jpg)\n```html\nif (theDay == 4) { return \"Thursday\"\
    ; }\n```\n![](index-34_1.jpg)\n```html\n}\nfunction showInfo() {\n\ndocument..(\"\
    (\"\").\n = =GetGetNameName\n\n}\n</script>\n</head>\n<body onload=\"showInfo();\"\
    >\n<div id=\"day\">Day</div>\n</body>\n</html>\n```\n\n![](index-35_1.jpg)\n\n\
    <!--\nAs we can see above, our code is becoming complex very quickly.\nLet's simplify\
    \ this code and how we program.\nLet's define our function in an external file.\n\
    We can keep our code very organized in this way.\n-->\n\n![](index-36_1.jpg)\n\
    \n#### save as dateGetDayName.js\n\n```javascript\nfunction dateGetDayName() {\n\
    \  let theDate = new Date();\n  let theDay = theDate.getDay();\n  if (theDay ==\
    \ 0) { return \"Sunday\"; }\n  if (theDay == 1) { return \"Monday\"; }\n  if (theDay\
    \ == 2) { return \"Tuesday\"; }\n  if (theDay == 3) { return \"Wednesday\"; }\n\
    \  if (theDay == 4) { return \"Thursday\"; }\n  if (theDay == 5) { return \"Friday\"\
    ; }\n  if (theDay == 6) { return \"Saturday\"; }\n}\n```\n\n![](index-37_1.jpg)\n\
    \n//In **ourProject folder**, we make 3 **New** **Folders** named it `js, html,\
