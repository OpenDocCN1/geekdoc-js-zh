  \ 一天时间消息, 使用 timeMessage.js................179\n\n![](img/index-7_1.jpg)\n\n# 创建新文件夹\n\
  \n我们的项目从创建一个**新文件夹**开始。\n\n`ourProject` 文件夹将存放我们所有的 `js`、`html` 和 `css` 文件。\n\n\
  - 在**桌面**上**右键点击**并选择**新建文件夹** \n- 将该**文件夹****重命名**为\n\n## `ourProject`\n\n我们将在这个**文件夹**中**保存**我们所有的**文件**。\n\
  \n![](img/index-8_1.jpg)\n\n# 编辑器\n\n我们可以从许多编辑器中选择编写 JavaScript，包括 Windows 自带的记事本，但记事本不如较新的替代方案。让我们来看看优秀且免费的\
  \ JavaScript 编辑器。\n\n### VS CODE\nhttps://code.visualstudio.com/\n\n### ATOM\nhttps://atom.io/\n\
  \n### BRACKETS\nhttp://brackets.io/\n\n![](img/index-9_1.jpg)\n\n### Sublime\nhttps://www.sublimetext.com/\n\
  \n### Notepad++\nhttps://notepad-plus-plus.org/downloads/\n\nVS Code 是许多人的最爱。在我们下载并安装编辑器（如\
  \ VS Code）之后，我们将创建 `.html` 文件。\n\n# 第一个 HTML 页面\n\n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n\
  </head>\n<body>\n我们在这里写任何内容\n</body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject`\
  \ 文件夹中。\n\n# 第一个 HTML 页面 \n\n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n\
  </head>\n<body>\n我们在这里写任何内容\n</body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject`\
  \ 文件夹中。\n\n# 第一个 HTML 页面 \n\n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n\
  </head>\n<body>\n我们在这里写任何内容\n</body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject`\
  \ 文件夹中。\n\n# 在 HEAD 中定义的函数\n\n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n\
  </head>\n<body>\n我们在这里写任何内容\n<script>\nfunction ourMessage() {\n  alert(\"Hi everyone\"\
  );\n}\n</script>\n</body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject` 文件夹中。\n\
  \n# 在 BODY 中定义的函数\n\n```html\n<html>\n<head>\n<title>我们的第一个页面</title>\n</head>\n\
  <body>\n我们在这里写任何内容\n<script>\nfunction ourMessage() {\n  alert(\"Hi everyone\");\n\
  }\n</script>\n</body>\n</html>\n```\n\n将此 `First.html` 文件保存到 `ourProject` 文件夹中。\n\
  \n# 我们的函数就像三明治\n\n```javascript\nfunction ourMessage() {\n  alert(\"Hi everyone\"\
  );\n}\n```\n\n正如我们在过去两页中中学到的；我们可以在 **head** 中**定义**我们的函数，也可以在 **body** 中定义。任何一种都是可以的。如上所示，我们的函数目前非常简单，作为消息代码的容器。\n\
  \n\n\n\n\n在 JavaScript 中，`functions`是由 `EVENTS`（事件）触发的。\n\n我们有很多 `EVENT` 类型可以选择来激活我们的函数。\n\
  \n![](img/index-17_1.jpg)\n\n返回，简单\n\n```html\n<html><body>\n<script>\nfunction\
  \ simple() {\n  return \"howdy\";\n}\nalert(simple());\n</script>\n</body>\n</html>\n\
  ```\n\n![](img/index-18_1.jpg)\n\n返回，简单，带参数\n\n```html\n<html>\n<body>\n<script>\n\
  function simple(yourMessage) {\n  return yourMessage;\n}\nalert(simple(\"Hi Everyone\"\
  ));\n</script>\n</body>\n</html>\n```\n\n![](img/index-19_1.jpg)\n\n返回，简单，带参数\n\n\
  ```html\n<html>\n<body>\n<script>\nfunction simple(yourMessage) {\n  let greeting\
  \ = \"Hi there \" + yourMessage;\n  return yourMessage;\n}\nalert(simple(\"So good\
  \ to see you\"));\n</script>\n</body>\n</html>\n```\n\n![](img/index-20_1.jpg)\n\
  \n返回，简单，带参数\n\n```html\n<html>\n<body>\n<script>\nfunction simple() {\n  let person\
  \ = prompt(\"Enter your Name?\", \"\");\n  let greeting = \"Howdy \" + person;\n\
  \  return greeting;\n}\nalert(simple());\n</script>\n</body>\n</html>\n```\n\n![](img/index-21_1.jpg)\n\
  \n在 head 中函数并返回\n\n```html\n<html>\n<head><title>使用 return 在 head 中编写函数</title>\n\
  <script>\nfunction ourMessage() {\n  return \"Hi Everyone\";\n}\nfunction showText()\
  \ {\n  document.write(ourMessage());\n}\n</script>\n</head>\n<body onload=\"showText();\"\
  >\n</body>\n</html>\n```\n\n![](img/index-22_1.jpg)\n\n### 什么是 onload 事件？\n\n`<body\
  \ onload =ourMessage();\">` `onload` 事件在页面上所有内容完成加载时`触发`。\n\n因此，我们创建的名为 `ourMessage()`\
  \ 的函数将在`页面加载完成`的瞬间被`激活`。`onload` 事件是我们可以选择的用于激活函数的众多事件之一。\n\n现在让我们学习用不同的事件来触发我们的代码，例如当人员点击\
  \ `BUTTON`（按钮）时。\n\n![](img/index-23_1.jpg)\n\n#### 我们按钮的 onclick 事件\n\n```html\n\
  <html>\n<head><title>按钮点击</title>\n<script>\nfunction ourFunction() {\n  alert(\"\
  Hi Everyone\");\n}\n</script>\n</head>\n<body>\nPush the Button <br>\n<button onclick=\"\
  ourFunction();\">Enter</button>\n<br>\n</body>\n</html>\n```\n\n![](img/index-24_1.jpg)\n\
  \n#### 带计数器的按钮\n\n```html\n<html><head><title>按钮点击</title>\n<script>\nlet theText\
  \ = \"Clicks\";\nlet ourCounter = 0;\nfunction ourFunction() {\n  ourCounter +=\
  \ 1;\n  document.getElementById(\"displayText\").value = theText + ourCounter;\n\
  }\n</script></head>\n<body>\nPush the Button <br>\n<button onclick=\"ourFunction();\"\
  >Enter</button>\n<br>\n<hr width =\"200px\" align=\"left\">Message is Displayed\
  \ Here <br>\n<textarea id=\"displayText\" rows=\"1\"></textarea>\n</body>\n</html>\n\
  ```\n\n![](img/index-25_1.jpg)\n\n#### 询问并说名字\n\n```html\n<html\n<head><title> 询问并说名字\
  \ </title></head>\n<body>\n<script>\nlet name = prompt(\"Enter your name\",\"\"\
  );\nalert(\"Hi \" + name);\n</script>\n</body>\n</html>\n```\n\n![](img/index-26_1.jpg)\n\
  \n#### 如果简单则提示\n\n```html\n<html><head><title>提示提示函数</title></head>\n<body>\n<script>\n\
  let name = prompt(\"Enter your name\");\nif (name == \"chris\") {\n  document.write(\"\
  Hi Chris\");\n}\n</script>\n</body>\n</html>\n```\n\n![](img/index-27_1.jpg)\n\n\
  #### 询问并说名字，如果名字是\n\n```html\n<html><head><title>询问，说名字，如果是人，否则</title></head>\n\
  <body>\n<script>\nlet name = prompt(\"Enter your name\",\"\");\nif (name == \"chris\"\
  ) {\n  alert(\"Hi \" + name);\n}\nelse {\n  alert(\"Where is Chris?\");\n}\n</script>\n\
  </body>\n</html>\n```\n\n![](img/index-28_1.jpg)\n\n#### 输入一个数字，返回\n\n```html\n\
  <html><head>\n<script>\nfunction askNumber() {\n  let question = prompt(\"Enter\
  \ a number\",\"\");\n  return question;\n}\nfunction displayIt(where, whatFunction)\
  \ {\n  document.getElementById(where).innerHTML = whatFunction;\n}\n</script>\n\
  </head>\n<body>\n<button onclick=\"displayIt('div1', askNumber());\"><h2>Enter Number</h2></button>\n\
  <div id=\"div1\"></div>\n</body>\n</html>\n```\n\n![](img/index-29_1.jpg)\n\n####\
  \ 返回，绝对值\n\n```html\n<html><body><script>\nfunction ourFunction() {\n  let question\
  \ = prompt(\"Enter a number\",\"\");\n  let answer = Math.abs(question);\n  return\
  \ answer;\n}\nfunction showIt(where, whatFunction) {\n  document.getElementById(where).innerHTML\
  \ = whatFunction;\n}\n</script>\n<button onclick=\"showIt('div1', ourFunction());\"\
  ><h2>Absolute Value</h2></button>\n<div id=\"div1\"></div>\n</body>\n</html>\n```\n\
  \n![](img/index-30_1.jpg)\n\n#### 使用 textarea 用户输入\n\n```html\n<html><head><title>用户输入</title>\n\
  <script>\nfunction ourFunction() {\n  let theText = document.getElementById(\"enteredText\"\
  ).value;\n  document.getElementById(\"displayText\").value = theText;\n}\n</script></head>\n\
  <body>\nEnter Text Here <br>\n<textarea id =\"enteredText\" rows=\"1\"></textarea>\
  \ <br>\n<button onclick=\"ourFunction();\">Enter</button> <br>\n<hr width =\"200px\"\
  \ align=\"left\">Text Displayed Here <br>\n<textarea id =\"displayText\" rows=\"\
  1\"></textarea>\n</body>\n</html>\n```\n\n![](img/index-31_1.jpg)\n\n### 如何设计应用\n\
  \n我们从代码开始吗？不。我们从大声说出想做什么开始。然后写下想要完成的每一件事。让我们一起设计一个界面。让我们先讨论一下。\n\n我想以多种方式显示日期和时间。我想单独显示星期。我想单独显示月份。我想让日期时间和更新。\n\
  \n![](img/index-32_1.jpg)\n\n#### 获取日期星期\n\n```html\n<html><head><script>\nfunction\
  \ dateGetDayName() {\n  let theDate = new Date();\n  let theDay = theDate.getDay();\n\
  \  if (theDay == 0) { return \"Sunday\"; }\n  if (theDay == 1) { return \"Monday\"\
  ; }\n  if (theDay == 2) { return \"Tuesday\"; }\n  if (theDay == 3) { return \"\
  Wednesday\"; }\n```\n![](img/index-33_1.jpg)\n```html\nif (theDay == 4) { return\
  \ \"Thursday\"; }\n```\n![](img/index-34_1.jpg)\n```html\n}\nfunction showInfo()\
  \ {\n\ndocument.write(dateGetDayName())\n}\n</script>\n</head>\n<body onload=\"\
  showInfo();\">\n<div id=\"day\">Day</div>\n</body>\n</html>\n```\n\n![](img/index-35_1.jpg)\n\
  \n<!--\n正如上面所示，我们的代码很快变得复杂。\n让我们简化代码和编程方式。\n让我们把函数定义在外部文件中。\n我们可以这样保持代码的整洁。\n-->\n\
  \n![](img/index-36_1.jpg)\n\n#### 保存为 dateGetDayName.js\n\n```javascript\nfunction\
  \ dateGetDayName() {\n  let theDate = new Date();\n  let theDay = theDate.getDay();\n\
  \  if (theDay == 0) { return \"Sunday\"; }\n  if (theDay == 1) { return \"Monday\"\
  ; }\n  if (theDay == 2) { return \"Tuesday\"; }\n  if (theDay == 3) { return \"\
  Wednesday\"; }\n  if (theDay == 4) { return \"Thursday\"; }\n  if (theDay == 5)\
  \ { return \"Friday\"; }\n  if (theDay == 6) { return \"Saturday\"; }\n}\n```\n\n\
  ![](img/index-37_1.jpg)\n\n//在 **ourProject 文件夹**中，我们创建了 3 个 **新** **文件夹**并命名为 js,\
  \ html, css\n\n//我们将 `dateGetDayName.js` 保存在 `ourProject` 文件夹的 `js` 文件夹中\n\n//下一个\
  \ html 页面使用了这个脚本！\n\n//ourProject 文件夹下的 `js` 文件夹内包含 `dateGetDayName.js` 文件。\n\n\
  ![](img/index-38_1.jpg)\n\n\n\n\n\n# 获取星期，使用 `dateGetDayName.js`\n\n## 文件\n```html\n\
  <html\n<head>\n  <script src=\"../js/dateGetDayName.js\"></script>\n  <script>\n\
  \    function showInfo() {\n      document.getElementById(\"dayDiv\").innerHTML\
  \ = \"It is \" + dateGetDayName();\n    }\n  </script>\n</head>\n<body onload=\"\
  showInfo();\">\n  <div id=\"dayDiv\">Day</div>\n</body>\n</html>\n```\n![](img/index-41_1.jpg)\n\
  \n# 获取星期，使用参数\n\n```html\n<html\n<head>\n  <script src=\"../js/dateGetDayName.js\"\
  ></script>\n  <script>\n    function showInfo(whichDiv) {\n      document.getElementById(whichDiv).innerHTML\
  \ = \"It is \" + dateGetDayName();\n    }\n  </script>\n</head>\n<body onload=\"\
  showInfo('dayDiv');\">\n  <div id=\"dayDiv\">Day</div>\n</body>\n</html>\n```\n\
  <!-- 我们在函数中使用参数，而不是在函数中定义它。相反，它在使用函数时定义它的。 -->\n![](img/index-42_1.jpg)\n\n# 保存为\
  \ dateGetMonthName.js\n```javascript\nfunction dateGetMonthName() {\n  let theDate\
  \ = new Date();\n  let theMonth = theDate.getMonth();\n  if(theMonth == 0) {\n \
  \   return \"January\";\n  }\n  if(theMonth == 1) {\n    return \"February\";\n\
  \  }\n  if(theMonth == 2) {\n    return \"March\";\n  }\n  if(theMonth == 3) {\n\
  \    return \"April\";\n  }\n  if(theMonth == 4) {\n    return \"May\";\n  }\n \
  \ if(theMonth == 5) {\n    return \"June\";\n  }\n  if(theMonth == 6) {\n    return\
  \ \"July\";\n  }\n  if(theMonth == 7) {\n    return \"August\";\n  }\n  if(theMonth\
  \ == 8) {\n    return \"September\";\n  }\n  if(theMonth == 9) {\n    return \"\
  October\";\n  }\n  if(theMonth == 10) {\n    return \"November\";\n  }\n  if(theMonth\
  \ == 11) {\n    return \"December\";\n  }\n}\n```\n![](img/index-44_1.jpg)\n\n#\
  \ 获取月份，使用 2 个参数\n```html\n<html\n<head>\n  <script src=\"../js/dateGetMonthName.js\"\
  ></script>\n  <script>\n    function showInfo(whichDiv, functionName) {\n      document.getElementById(whichDiv).innerHTML\
  \ = \"It is \" + functionName;\n    }\n  </script>\n</head>\n<body onload=\"showInfo('monthDiv',\
  \ dateGetMonthName())\">\n  <div id=\"monthDiv\">Month</div>\n</body>\n</html>\n\
  ```\n![](img/index-45_1.jpg)\n\n# 获取星期，获取月份，使用 2 个参数\n```html\n<html\n<head>\n \
  \ <script src=\"../js/dateGetDayName.js\"></script>\n  <script src=\"../js/dateGetMonthName.js\"\
  ></script>\n  <script>\n    function showInfo(whichDiv, functionName) {\n      document.getElementById(whichDiv).innerHTML\
  \ = \"It is \" + functionName;\n    }\n  </script>\n</head>\n<body onload=\"showInfo('monthDiv',\
  \ dateGetMonthName()); showInfo('dayDiv', dateGetDayName())\">\n  <div id=\"monthDiv\"\
  >Month</div>\n  <div id=\"dayDiv\">Day</div>\n</body>\n</html>\n```\n![](img/index-46_1.jpg)\n\
  \n# 使用样式为月份和星期的 Div 定位\n```html\n<html\n<head>\n  <script src=\"../js/dateGetDayName.js\"\
