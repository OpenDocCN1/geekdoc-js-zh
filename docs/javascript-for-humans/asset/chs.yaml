  \n# 保存为 ourStyle.css\n```css\ndiv {\n  border: 5px solid rgb(0,0,0);\n  border-radius:\
  \ 5px;\n  text-align: center;\n}\nbody {\n  background-color: rgb(196,196,196);\n\
