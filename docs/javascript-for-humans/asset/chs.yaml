  showInfo('dayDiv', dateGetDayName())\">Day</div>\n</body>\n</html>\n```\n<!-- 记得点击\
  \ div 以激活 -->\n![](img/index-50_1.jpg)\n\n# 获取月份，获取星期，样式美化\n```html\n<html\n<head>\n\
