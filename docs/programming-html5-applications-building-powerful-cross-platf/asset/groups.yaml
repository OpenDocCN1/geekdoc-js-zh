    # CHAPTER 2

    The Power of JavaScript


    Although JavaScript is not a difficult language to program, it can be challenging
    to rise to the level of a true expert. There are several key factors to becoming
    a skilled JavaScript programmer. The techniques in this chapter will appear repeatedly
    in the libraries and programming practices taught in the rest of this book, so
    you should familiarize yourself with these techniques before continuing with those
    chapters.


    There are a number of excellent tools for JavaScript programming, some of them
    listed in the Appendix. These tools can provide you with a lot of assistance.
    Specifically, JSLint will catch a large number of errors that a programmer might
    miss. Sites as StackOverflow and O''Reilly Answers will be a good source of other
    tools.


    This chapter is not a full introduction to the power of JavaScript. O''Reilly
    publishes a number of excellent books on JavaScript, including:


    +   * JavaScript The Good Parts by Douglas Crockford

    * JavaScript: The Definitive Guide by David Flanagan

    * High Performance JavaScript by Nicholas C. Zakas

    * JavaScript Patterns by Stoyan Stefananov


    # Nonblocking I/O and Callbacks


    The first key to JavaScript, after learning the language itself, is to understand
    event-driven programming. In the environment where JavaScript runs, operations
    tend to be asynchronous, which is to say that they are set up in one place and
    execute later after some external event happens.


    This can represent a major change from the way I/O happens in traditional languages.
    Take Example 2-1 as a typical case of I/O in a traditional language, in this case
    PHP. The line $db->getAll($query); requires the database to access the disk, and
    therefore will take orders of magnitude more time to run than the rest of the
    function. While the program is waiting for the server to execute, the query statement
    is blocked and the'
  - "[PAGE 19]\n\nprogram is doing nothing. In a server-side language like PHP, where\
    \ there can be many parallel threads or processes of execution, this isn't usually\
    \ a problem.\n\nExample 2-1. Blocking I/O in PHP\n\n```\nfunction getFromDatabase()\
    \ {\n  $db = getDatabase();\n  $query = \"SELECT name FROM countries\";\n  $result\
    \ = $db->getAll($query);\n  return $result;\n}\n```\n\nIn JavaScript, however,\
    \ there is only one thread of execution, so if the function is blocked, nothing\
    \ happens and the user interface is frozen. Therefore, JavaScript must find a\
    \ different way to handle I/O (including all network operations). What JavaScript\
    \ does right away from a method that might perceive slow, leaving behind a function\
    \ that gets called when the operation (say, downloading new data from the web\
    \ server) completes. The function is known as a callback. When making an Ajax\
    \ call to the server, the JavaScript launches the request and then goes on to\
    \ do something else. It provides a function that is called when the server is\
    \ finished. This function is called (hence the term callback) with the data that\
    \ is returned from the server at the time when the data is ready.\n\nAs an analogy,\
    \ consider two ways of buying an item at a grocery store. Some stores leave items\
    \ behind the counter, so you have to ask a salesperson for the item and wait while\
    \ she retrieves it. That's like the PHP program just shown. Other stores have\
    \ a deli counter where you can request an order and get a number. You can go off\
    \ to do other shopping, and when your order is ready, you can pick it up. That\
    \ situation is like a callback.\n\nIn general, a fast operation can be blocking\
    \ because it should return the data requested right away. A operation, such as\
    \ a call to a server that may take several seconds, should be nonblocking and\
    \ return its data via a callback function. The presence of a callback option in\
    \ a function will provide a good clue to the relative time it will take for an\
    \ operation to run. In a single-threaded language like JavaScript, a function\
    \ can't block while waiting for the network or user without using the browser.\n\
    \nSo a major step to JavaScript mastery involves using callbacks strategically\
    \ and knowing when they’ll be triggered. When you use a DataStore object, for\
    \ example, the data will not be there for a second or two. Using a closure to\
    \ create a callback is the correct way to handle data loading (“Closures” on page\
    \ 11). All external I/O (e.g., databases, calls to the server) should be nonblocking\
    \ in JavaScript, learning to use closures and callbacks is critical."
  - "[PAGE 20]\n\nWith a few exceptions that should probably be avoided, JavaScript\
    \ I/O does not.\nThe three major exceptions to this rule are the window methods\
    \ alert(), confirm(),nand prompt(). These three methods do, in fact, block all\
    \ JavaScript on the page from\nthe moment when they are called to the moment the\
    \ user dismisses the dialog.\nin addition, the XMLHttpRequest object can make\
    \ an Ajax call to the server in asynchronous mode.\nThis can be used safely in\
    \ a Web Worker, but in the main window it will cause the\nbrowser UI to lock up,\
    \ so it should be avoided.\n\n# # Lambda Functions Are Powerful\n\nProgrammers\
    \ who have come to JavaScript from PHP or other procedural languages\nwill tend\
    \ to treat JavaScript functions like those in the languages that they have already\n\
    used. While it is possible to use JavaScript functions in this way, it is missing\
    \ a large\nchunk of what JavaScript functions so powerful.\n\nJavaScript functions\
    \ can be created with the function statement (Example 2-2) or the\nfunction expression\
    \ (Example 2-3). These two forms look pretty similar, and both\nproduce a function\
    \ square that will square a number. However, there\nsome key differences. The\
    \ first form is subject to hosting, which is to say that the\nfunction will be\
    \ created at the start of the enclosing scope. So you can use a function\nstatement\
    \ when you want the function defined conditionally, because JavaScript won't\n\
    wait for the conditional statement to be executed before deciding whether to create\
    \ the\nfunction. In practice, most browsers allow you to put a function inside\
    \ an if, but it is\not a good idea, as what browsers do in this case can vary.\
    \ It is much better to use\nafunction statement if the definition of a function\
    \ should be conditional.\n\nExample 2-2. Function statement\n\n```\nfunction square(x)\
    \ {\n  return x * x;\n} // Note lack of a ;\n```\n\nExample 2-3. Function expression\n\
    \n```\nvar square = function(x) {\n  return x * x;\n}\n```\n\nIn the second form,\
    \ the function expression, the function is created when execution\ngets to that\
    \ point in the flow of the program. It is possible to define a function\nconditionally,\
    \ or to have the function defined inside a larger statement.\nThe function expression,\
    \ in addition, assigns no name to the function, so the function\ncan be left anonymous.\
    \ However, the example shown assigns a name (square) on the\nleft side of the\
    \ equals sign, which is a good idea for two reasons. First, when you are\ndebugging\
    \ a program, assigning a name allows you to tell which function you're seeing\n\
    in a stack trace; without it, the function will show up as anonymous."
- md: "\nfrustrating to look at a stack trace in Firebug and see a stack of nine or\
    \ ten functions, all of which are simply listed as anonymous. Also, assigning\
    \ a function name allows you to call the function recursively if desired.\n\n\
    A function expression can be used anywhere in JavaScript that an expression can\
    \ appear. So a function can be assigned to a variable as in Example 2-3, but it\
    \ can also be assigned to an object member or passed to a function.\n\nJavaScript\
    \ functions are more like the Lisp lambdas than C functions (including Java and\
    \ C++); a function is basically a static. It is not an object on which you can\
    \ operate. While you can pass objects as arguments to functions, there is little\
    \ ability to build composite objects or otherwise expand them.\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_21)\n\
    \nBack in the 1950s when Lisp was created, the folks at MIT were heavily influenced\
    \ by Alonzo Church's Lambda Calculus, which provided a framework for dealing with\
    \ recursion. So John McCarthy used the keyword lambda for dealing with functions.\
    \ This has propagated to other languages such as Perl, Python, and Ruby.\n\nIn\
    \ JavaScript, functions are first-class citizens of the language. A function in\
    \ JavaScript is just data and can be used in every place. A function can be assigned\
    \ to a variable, passed as a parameter, or returned by a function. Passing a function\
    \ to another function is a very common operation in JavaScript. For example, this\
    \ would be used when creating a callback for a button (Example 2-4).\n\nExample\
    \ 2-4. Ext Button with function as handler\n\n```javascript\nvar button = new\
    \ Ext.Button({\n  text: 'Save',\n  handler: function() {\n    // something here\n\
    \  }\n});\n```\n\n## Closures\n\nAccess to functions as first-class objects in\
    \ JavaScript would not be worth much not for the property that goes along with\
    \ it called closure. Closure is yet another element from Lisp that migrated into\
    \ JavaScript. When a function is created in JavaScript, it has access to any lexically\
    \ scoped variables that were defined. Those variables are still available even\
    \ if the context in which they were defined has finished.\n\nClosures are often\
    \ useful for constructing callbacks. This is often useful when building a function,\
    \ each time the generator runs will have a different outer state, which is encapsulated.\n\
    \nClosures are one of the most powerful features in JavaScript. In a simple case,\
    \ a closure can be used to create functions that access data from any scope. However,\
    \ even more powerful is the ability to create custom functions that bind variables\
    \ to a scope.\n\nExample 2-5. Basic closure\n\n```javascript\nvar factory = function\
    \ (el) {\n  return function (html) {\n    $(el).html(html);\n  };\n}\n```\n\n\
    It is also possible to create several functions that are closed on one scope.\
    \ If a function returns several functions in an object or array, all of those\
    \ functions will have access to internal variables of the creating function.\n\
    \nExample 2-6. Closure in a button\n\n```javascript\n$('.document').ready(function()\
    \ {\n  var button, tools;\n  tools = ['save', 'add', 'delete'];\n  console.info('div#toolbar');\n\
    \  tools.forEach(function (tool) {\n    console.info(tool, button);\n    var button\
    \ = $('<button>').text(tool).attr({\n      css: 'tool'\n    }).appendTo('div#toolbar');\n\
    \    button.click(function clickHandler() {\n      console.info(tool, button);\n\
    \      alert(\"User clicked \" + tool);\n    });\n  });\n});\n```\n\nWhen using\
    \ closures, it is hard to know which variables are or are not in the scope of\
    \ a function. However, both Google Chrome's DevTools and Firebug show the list\
    \ of closed variables. In Firebug, the scope can be seen in the Script tab by\
    \ looking under \"Watch\". Under all the variables of the current scope is a ladder\
    \ of the scopes going up to the main \"window\" object.\n\nIn DevTools, for example,\
    \ when the code is halted in the debugger, a subsection called \"closure\" in\
    \ the right-hand column under Scope Variables will show the closed variables for\
    \ the current function (see Figure 2-1). In this case, it shows that we have clicked\
    \ on the \"delete\" button and lists the reference to the jQuery object for the\
    \ button itself.\n\n## Functional Programming\n\nFunctional programming is a methodology\
    \ that is more commonly associated with languages like Lisp, Erlang, F#, or Haskell,\
    \ but works quite well in JavaScript also. Functional programming rests on a couple\
    \ of basic assumptions:\n\n- Functions are first-class citizens of the language\
    \ and can be used where any other value can be used.\n- Complex behavior can be\
    \ built by composition of simple functions.\n- Functions return values. In many\
    \ cases, a given function will always return the same value for the same inputs.\n\
    \n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_24_0)\n\nFigure 2-1. Closures in Chrome's\
    \ DevTools\n\nIn mathematics, functions do not have side effects. Take a classical\
    \ mathematical function like y = sin(x). It just returns a value that y can store,\
    \ but does not change x or anything in the global state of the program. By ensuring\
    \ that functions are \"pure\" (have no side effects), this practice enables the\
    \ function to be called from anywhere in the program without causing strange to\
    \ happen. The problem with side effects is that they can cause dependencies that\
    \ can be very hard to track down. If calling a method can cause data to be corrupted\
    \ elsewhere, it greatly increases the potential for bugs that will be very difficult\
    \ to find.\n\nJavaScript functions can have side effects, and there is no built-in\
    \ way to prevent functions from having side effects. In addition, JavaScript functions\
    \ do not return value unless the return statement has been explicitly invoked.\
    \ In the absence of a return statement, the function will return undefined.\n\n\
    When employing functional programming, the programmer often falls into the pattern\
    \ of using many very functions, with only two or three lines of code, to accomplish\
    \ a goal. This can be a very good design technique, as short functions are, in\
    \ general, easier to make correct and to test.\n"
  mdcn: "\n\n在 Firebug 中查看堆栈轨迹时，如果看到九或十个函数且它们都被简单地列为匿名，是非常令人沮丧的。此外，为函数命名允许你在需要时递归调用该函数。\n\
    \n函数表达式可以出现在 JavaScript 中任何可以出现表达式的地方。因此，函数可以像示例 2-3 那样赋值给变量，也可以赋值给对象成员或传递给函数。\n\
    \nJavaScript 函数更像 Lisp 的 lambda 而不是 C 函数（包括 Java 和 C++）；函数本质上是一个静态的（static）。它本身不是一个你可以对其进行操作的对象。虽然你可以将对象作为参数传递给函数，但构建复合对象或其他其他方式扩展它们的能力很小。\n\
    \n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_21)\n\n回到 20 世纪 50 年代 Lisp 创建时，MIT\
    \ 的人们深受阿隆佐·丘奇（Alonzo Church）Lambda 演算的影响，该理论为处理递归提供了一个框架。因此，约翰·麦卡锡使用了 lambda 关键字来处理函数。这种做法已经传播到\
    \ Perl、Python 和 Ruby 等语言中。\n\n在 JavaScript 中，函数是语言的一等公民。JavaScript 函数仅仅是数据，可以在任何地方使用。函数可以赋值给变量、作为参数传递、或由函数返回。将函数传递给另一个函数是\
    \ JavaScript 中非常常见的操作。例如，在为按钮创建回调函数时就会这样做（示例 2-4）。\n\n示例 2-4. 使用函数作为处理程序的 Ext\
    \ Button\n\n```javascript\nvar button = new Ext.Button({\n  text: 'Save',\n  handler:\
    \ function() {\n    // something here\n  }\n});\n```\n\n## 闭包 (Closures)\n\n在\
    \ JavaScript 中将函数作为一等对象访问，如果没有随之来的被称为“闭包”的属性，将毫无意义。闭包是另一个从 Lisp 迁移到 JavaScript\
    \ 的元素。当在 JavaScript 中创建一个函数时，它可以访问任何定义的词法作用域变量。即使定义这些变量的上下文已经结束，这些变量仍然可用。\n\n\
    闭包通常用于构建回调函数。这在构建函数时通常非常有用，生成器每次运行时都将有一个不同的外部状态，而这些状态被封装了起来。\n\n闭包是 JavaScript\
    \ 中最强大的特性之一。在简单的情况下，闭包可以用于创建访问任何作用域数据的函数。然而，更强大的是创建可以将变量绑定到作用域的自定义函数的能力。\n\n示例\
    \ 2-5. 基本闭包\n\n```javascript\nvar factory = function (el) {\n  return function\
    \ (html) {\n    $(el).html(html);\n  };\n}\n```\n\n创建多个闭包于同一个作用域的函数也是可能的。如果一个函数在对象或数组中返回了多个函数，那么所有这些函数都可以访问创建函数的内部变量。\n\
    \n示例 2-6. 按钮中的闭包\n\n```javascript\n$('.document').ready(function() {\n  var button,\
    \ tools;\n  tools = ['save', 'add', 'delete'];\n  console.info('div#toolbar');\n\
    \  tools.forEach(function (tool) {\n    console.info(tool, button);\n    var button\
    \ = $('<button>').text(tool).attr({\n      css: 'tool'\n    }).appendTo('div#toolbar');\n\
    \    button.click(function clickHandler() {\n      console.info(tool, button);\n\
    \      alert(\"User clicked \" + tool);\n    });\n  });\n});\n```\n\n使用闭包时，很难知道哪些变量在函数的作用域内。然而，Google\
    \ Chrome 的 DevTools 和 Firebug 都能显示闭包变量的列表。在 Firebug 中，可以通过查看 Script 标签页下的“Watch”来查看作用域。在当前作用域的所有变量下方，是一层作用域的阶梯，向上直到主“window”对象。\n\
    \n例如，在 DevTools 中，当代码在调试器中停止时，右侧 Scope Variables（作用域变量）下方名为“closure”的子部分将显示当前函数的闭包变量（见图\
    \ 2-1）。在这种情况下，它显示我们点击了“delete”按钮，并列出了按钮本身 jQuery 对象的引用。\n\n## 函数式编程 (Functional\
    \ Programming)\n\n函数式编程通常与 Lisp、Erlang、F# 或 Haskell 等语言相关，但在 JavaScript 中也运行得很好。函数式编程建立在几个基本假设之上：\n\
    \n- 函数是语言的一等公民，可以在任何可以使用其他值的地方使用。\n- 复杂的行为可以通过简单函数的组合来构建。\n- 函数返回结果。在许多情况下，给定的函数对于相同的输入总是返回相同的值。\n\
    \n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_24_0)\n\n图 2-1. Chrome DevTools 中的闭包\n\
    \n在数学中，函数没有副作用。以一个经典的数学函数 y = sin(x) 为例。它只是返回一个 y 可以存储的值，但不会改变 x 或程序全局状态中的任何内容。通过确保函数是“纯”的（没有副作用的），这种做法使得函数可以从程序的任何地方被调用，而不会发生奇怪的事情。副作用的问题在于它们可能会导致非常难以追踪的依赖关系。如果调用一个方法会导致其他地方的数据损坏，将极大增加难以发现的\
    \ bug 的可能性。\n\nJavaScript 函数可以有副作用，并且没有内置方法可以防止函数产生副作用。此外，除非显式调用 return 语句，否则\
    \ JavaScript 函数不会返回结果。在缺少 return 语句的情况下，函数将返回 undefined。\n\n采用函数式编程时，程序员经常会陷入一种模式：使用许多许多只有两三行代码的短函数来实现目标。这可能是一种非常好的设计技术，因为短函数通常更容易编写正确且易于测试。\n\
    \n"
