    As of this writing (August 2011), web sockets are supported by Chrome version
    8 and later Safari version 5. As of Firefox version 6, web sockets are available,
    but the constructor is MozWebSockets. Opera has implemented the web sockets spec
    but leaves it turned off by default, pending work on security issues. For browsers
    that do not support web sockets, fallbacks using classic HTTP or Flash can work.
    There are also some libraries such as socket.io that provide a common interface
    for web sockets and the fallback to older-style HTTP for browsers that may not
    support web sockets. It is also possible to emulate web sockets via Flash for
    browsers that support Flash but not web sockets.


    The WebSockets specification document also appears to be in progress. While web
    sockets have been deployed in several browsers, there is still very little documentation
    on how to implement them. There have also been several earlier versions of the
    web sockets standard that are not always compatible.


    # The Web Socks Interface


    To use a web socket, start by creating a WebSocket object. As a parameter, pass
    a socket URL. Unlike an HTTP URL, a web socket URL will start with ws or wss.
    The latter is a safer socket which will use SSL, similar to HTTPS over Ajax:


    ```

    var socket = new WebSocket("ws://example.com/socket");

    ```


    Once a socket connection is opened, the socket''s socket.open() will be called
    to let the program know that everything is ready. When the socket closes, the
    socket.onclose method will be called. If the browser chooses to close the socket,
    it will call socket.close().


    To send data over the socket, use the socket.send("data") method. Data is limited
    to strings, so if it''s more complex, you need to encode it to JSON, XML, or some
    other data interchange format. In addition, sockets are text-only, so if binary
    data must be sent it should be encoded into text through some method.


    # Setting Up a Web Socket


    A web socket connection starts out like an HTTP connection. It opens a connection
    on port 80 (ws) or 443 (wss) to the server. In addition to the standard HTTP headers,
    it also includes some headers that tell the server this is a web socket connection
    and not an HTTP connection. It also includes some handshake bytes to provide some
    security. Since the WebSocket protocol uses ports 80 and 443, most proxies and
    firewalls should deal with it correctly. Web sockets can also specify a different
    port in the same way that an HTTP protocol can, but like an Ajax call, the web
    socket must be on the same port as the server spawned it.'
