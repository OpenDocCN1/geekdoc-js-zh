    # # Automatically Running Tests


    It is possible to use one of the popular test suites (such as JUnit or PHPUnit)
    to run Selenium, letting the tests run across multiple browsers and platforms.
    If you are running a regular set of unit tests, Selenium tests can be run from
    your normal runner (see Example 3-6).'
  - "[PAGE 51]\n\nMost or all of what is described here for PHPUnit should work with\
    \ minor modifications in all similar test suites for other languages.\n\nThese\
    \ tests will run just like any other test in the test environment. Each HTML file\
    \ will run as a test in the test suite. (Details of this may vary depending on\
    \ which test runner is being.) The test runner will run each HTML file in sequence\
    \ in a similar manner to what was done in the IDE.\n\nTo runs from PHPUnit, one\
    \ or more test machines need to be designated to run the browsers. Each test machine\
    \ needs a copy of the Selenium RC program and must have the browser or browsers\
    \ being tested installed on the machine. selenium binary is a Java .jar file,\
    \ so it will run on Windows, Linux, or the Mac.\n\nWhen a test is run in PHPUnit,\
    \ the test class PHPUnit_Extensions_SeleniumTestCase will send the selenium program\
    \ and ask it to start a browser and send commands over a REST interface.\n\nIf\
    \ multiple browsers are listed in the $browsers static member, or via a phpunit.xml\
    \ file (see Example 3-7), the PHPUnit_Extensions_SeleniumTestCase will run each\
    \ test for each browser in sequence. In Example 3-6, it will run the tests on\
    \ Safari, Firefox, Chrome, and Internet Explorer. Often it is better to list the\
    \ browser options in the phpunit.xml file, because you can create multiple files\
    \ to change test options without changing source code.\n\nThe following test runs\
    \ one Selenium from the seleneseTest.html. However, we could have automatically\
    \ run an entire directory of Selenium HTML files by setting the $seleseDirectory\
    \ property of the test class to the path to the files:\n\n```\npublic static $seleseDirectory\
    \ = '/path/to/files';\n```\n\nExample 3-6. Running Selenium from PHPUnit\n\n```\n\
