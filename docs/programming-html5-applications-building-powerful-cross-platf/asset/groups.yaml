    \ in the list, but when passed \"CT\" it returns false.\n\nExample 3-1. In-list\
    \ test\n\n```\nvar makeInList = function (list, rec)\n{\n  return function inList\
    \ (rec)\n{\n    var value = rec[field];\n    return list.indexOf(value) == -1;\n\
    \  }\n};\n```\n\nExample 3-2. In-list used test\n\n```\nvar nnyj = makeInList(['NY','NJ'],\
    \ 'state');\nok(nnyj({state: \"NY\"}));\nok(!nnyj({state: \"CT\"}));\n```"
  - '[PAGE 40]


    # Types of Tests


    Testers generally talk about several kinds of tests: unit tests, integration tests,
    and on. All of these use the same basic tools but work on different levels.


    A unit test seeks to the smallest unit of a code, often a function or method.
    For instance, Example 3-2 is a unit test. It tests only function and seeks to
    check all the possible options for how the code could run.


    An integration test is designed to make sure the system as a whole works as designed.
    An integration test could click a button in the browser and then verify that a
    record has been updated in a database, which verifies that the system is working
    together. Integration tests run much slower than unit tests. For this reason,
    many people run unit tests in real time, but integration tests overnight.


    Acceptance tests verify that the software meets the requirements of the customer.
    The purpose of these is not so much technical—to ensure that it does what the
    programmer intends—as it is a matter of deployment and meeting user needs.


    The runtime model for JavaScript is also more complex. In a server-side language,
    a unit test generally consists of a few sequential steps:


    +   - Set up any needed features.

    - Run the method to be tested.

    - Test the results of the method against some criteria.


    However, this model does not fit JavaScript, where the results of an action may
    not be immediate but some time later. A test this would fail in JavaScript, as
    there can be a delay when the method is run and when its results become available.
    In JavaScript, testing a test may go more like this:


    +   - Set up any needed features.

    - Run the method to be tested.

    - Wait for an Ajax call to complete.

    - Check the DOM for the results of the action (including undesired effects on
    unexpected parts of the page).


    An additional complication is that, in many cases the method to run is a callback
    on a DOM element. To run unit tests in this situation, you really want to find
    the DOM element and send it the correct event. That way, the handler is invoked
    in a manner as similar as possible to when an actual user is using the application.
    Even that is not enough: it doesn''t reproduce the experience of a user clicking
    through various complex interfaces in the DOM.


    Browser applications also have the complexity of being based around a user interface.
    Most test-driven development is done on server interfaces, or data-handling code,'
  - '[PAGE 41]


    where the set of inputs and outputs is relatively constrained. A given function
    will return one thing when passed input “A” and another when passed input “B.”


    JavaScript applications are more complicated by centrality of the user interface.
    The possible range of actions a user can take is by definition very large. The
    number of tests needed can be very large and the developer may not even think
    to create many of them. For example, what happens if a user enters a name with
    an accent mark into an input field? Will the system react correctly?


    # # QUnit


    QUnit is a JavaScript test suite from the same team that produced jQuery. To create
    a test suite in QUnit, call the test function with two arguments: the test suite
    name and a function that actually runs the tests.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_41_0.png)


    It is possible to configure QUnit to complain if any new global variables have
    been introduced by running a test, and because global variables are one of the
    main sources of JavaScript bugs, this is a very helpful feature. To test for leaking
    global variables, add `?globals` to the URL.


    Using of JSLint (the discussion of JSLint on page 117) can also be very helpful
    in finding leaking globals and a lot of other errors. It is possible to run JSLint
    over a set of JavaScript files as part of an automated test suite.


    # # A Simple Example


    As an example, let us consider a very trivial Ajax application. In Example 3–3,
    we have an HTML page with a button. When the button is clicked, the JavaScript
    `handleButtonClick` function will make an Ajax query to the server for a document
    (in this case, a static HTML document) and then place that document in a `<div>`
    page. Note that for simplicity I have placed the JavaScript document directly.
    A cleaner implementation would keep the JavaScript in a separate file that the
    test runner loads with the tests.


    To test this, we want to run the button callback and verify the results are correct.
    There are two ways that this can be. The test program could click an event to
    the button, or it could call the function directly. For testing in QUnit, it is
    simpler to call the function directly, but requires us to bind the function to
    some variable that can be seen by the test runner. I have done this in the example,
    assigning the function to the variable `handleButtonClick`. After calling the
    callback, the test function waits for a short time to allow the Ajax call to run
    and then uses jQuery to check if the element is present.'
  - "[PAGE 42]\n\n# Example 3-3. Simple application\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <script src=\"http://code.jquery.com/jquery-latest.js\"></script>\n\
    \  <script src=\"button.js\"></script>\n  <script>\n    var handleButtonClick\
    \ = function handleButtonClick() {\n      $().get('document.html', '', function(data,\
    \ status) {\n        $(\"div\").attr('id='target_div'').text(data).appendTo('body');\n\
    \      });\n    }\n    $('.button.click_me').click(handleButtonClick);\n  </script>\n\
    \  <link rel=\"stylesheet\" href=\"http://github.com/jquery/junit/raw/master/junit.css\"\
    \ type=\"text/css\">\n  <script src=\"http://github.com/jquery/junit/raw/master/junit.js\"\
    ></script>\n  <script src=\"simple-test.js\"></script>\n</head>\n<body>\n  <button\
    \ id=\"unit-click_me\">Click Me</button>\n  <!-- Stuff required by QUnit -->\n\
    \  <h1 id=\"unit-header\">QUnit example</h1>\n  <h2 id=\"unit-banner\"></h2>\n\
    \  <h2 id=\"unit-userAgent\"></h2>\n  <ol id=\"unit-tests\"></ol>\n  <div id=\"\
    unit-fixture\">test markup, which will be hidden</div>\n</body>\n</html>\n```\n\
    \nThe QUnit test is created by the page on load as any other JavaScript program\
    \ would be. In this case, it is loaded from http://github.com/jquery/junit/raw/master/qunit.js.\
    \ This file will start running any jQuery tests on load. The result of those tests\
    \ requires those elements to be present in the DOM.\n\nTo test example, we'll\
    \ load QUnit, which the in Example 3-3 does, and then call the handleButtonClick\
    \ method. Example 3-4 waits for one second for the document to be loaded, by passing\
    \ a value of 1,000 to the setTimeout method. After that second, it tests whether\
    \ the div exists in the DOM (the first call), gets the text from the div, and\
    \ that the first word in the text is \"First\", which is the expected value (the\
    \ second call). A more complete test may choose to check for that element quarter-second\
    \ until it appears or some maximum time is reached. In the real world, page load\
    \ times can vary depending on external factors including network usage and server\
    \ load."
- md: "\nA test in QUnit is a JavaScript function that is called by the test runner.\
    \ Look at the simple test in Example 3-4. The test uses several assertion functions\
    \ that must be satisfied for the test to pass. To test if a value is equal to\
    \ an expected result, use the equal() method, which makes three parameters: the\
    \ value to test, the expected result, and an optional parameter, which is a message\
    \ for the test to show if it fails. This is even more useful if a test is being\
    \ looked at six months after it was written.\n\nExample 3-4. Simple test\n\n```javascript\n\
    test(\"Basic Test\", function () {\n// assert that the target attribute does not\
    \ exist\n  equal($`div#target_div\\`).length, 0,\n    \"Target element should\
    \ not exist\");\n// run method\n  handleButtonClick() {\n    equal($`div#target_div\\\
    `).length, 0,\n      \"Target element should still not exist\");\n    window.setTimeout(function\
    \ () {\n      equal($`div#target_div\\`).length,1,\n        \"Target element should\
    \ now exist\");\n      equal(\"first\",\n        ($`div#target_div\\`).text().substr(0,5),\n\
    \        \"Check that the first word is correct\");\n    });\n  }, 1000);\n});\n\
    ```\n\n## Testing with QUnit\n\nTo run QUnit, the qunit stylesheet and JavaScript\
    \ files must be included in your test runner. These can be pulled directly from\
    \ GitHub or loaded locally (see Example 3-3). The DOM must also include a few\
    \ elements that are loaded by QUnit to display its results. These can be in the\
    \ bottom of the HTML in Example 3-3. That is all that is required to run tests.\n\
    \nQUnit provides eight assertion functions. In addition to equal(), which appeared\
    \ in our previous example, there are further tests of equality and the ok() method,\
    \ which tests whether the value passed to it is true. Also, strictEqual() tests\
    \ according to the JavaScript \"===\" operator, whereas equal() uses the \"==\"\
    \ operator for comparison. To test a more complex data structure is this, use\
    \ deepEqual(). This does a recursive comparison of the two data structures.\n\n\
    Each equality function has an inverted form that will test for lack of equality:\
    \ notEqual(), notStrictEqual(), and notDeepEqual(). These take the same parameters\
    \ as the equal versions but test for the inverted cases.\n\nThe final assertion\
    \ is **raises()**, which takes a function as a parameter and expects it to throw\
    \ an error condition.\n\nTo test events that happen in an asynchronous manner,\
    \ it won't work simply to make a change and return a value. In this case, the\
    \ test must wait for the action to complete. This can be done by setting timeout\
    \ with `setTimeout()`, which will run after a set time. Or it be done by a callback\
    \ from some operation, such as an Ajax load or other event.\n\n## Selenium\n\n\
    While QUnit lets you JavaScript code, Selenium takes a different approach. Selenium\
    \ tests the user interface by simulating the actions a user may take. Selenium\
    \ test will consist of a number of steps that run in a browser, such as loading\
    \ a page, clicking on a particular element, typing something into a text area,\
    \ and so on. interspersed with these actions will be assertions to verify the\
    \ state of the DOM or other things to be tested. These can include testing an\
    \ element that exists or is absent.\n\nWhen a Selenium test run it will actually\
    \ launch a browser and run it in more or less the same way that the user would.\
    \ So it is possible to watch the test interacting with the browser. It is even\
    \ possible to manually interact with the browser while a test is running (which\
    \ may not be a great idea).\n\nSelenium consists of several, mostly independent\
    \ parts. One is IDE implemented as a browser plug-in for Firefox. Another is the\
    \ RC server, seleniumrc, a Java server that can be used to automate running tests\
    \ in different browsers.\n\nThe Selenium IDE plug-in for Firefox is a developer's\
    \ best friend. It allows you to construct tests that are run directly in the browser.\
    \ The IDE can record the user's actions and replay them as a test later. It also\
    \ allows you step through a test line one at a time, which can be very useful\
    \ for finding timing problems in a test.\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_44_0.png)\n\
    \nBy default, when recording actions, the Selenium IDE will use the IDs of the\
    \ various HTML elements. When IDs are not explicitly assigned by the programmer,\
    \ some frameworks will assign IDs sequentially as elements are created. These\
    \ IDs will not be consistent from run to run, or use some other method to identify\
    \ elements of interest.\n\nThe Selenium IDE outputs tests as HTML files that can\
    \ run in the IDE itself in Firefox. In addition, these HTML files can be run with\
    \ the Selenium RC component as a batch job. The Selenium RC server will also allow\
    \ the HTML tests to run with any browser, so it is possible to run these tests\
    \ with IE, Chrome, Opera, or Safari. The Selenium RC server can also be controlled\
    \ by a traditional test from a something like PHPUnit or JUnit.\n\nThe Selenium\
    \ IDE also is useful for recording web macros in development. For example, if\
    \ you are testing a wizard in your web application that displays four or five\
    \ screens before the screen is being debugged, you can use the IDE to create a\
    \ Selenium script that you can invoke as a macro to get automatically to the point\
    \ being tested.\n\n- If a test works when it is run in single-step mode but not\
    \ during normal execution, it needs a few pause statements to allow the browser\
    \ to catch up, or even better, waitFor... statements, which will allow the test\
    \ to be in sync.\n\nThere are three ways to run tests in Selenium:\n- The IDE\n\
    - The RC server\n- Programming language\n\nIf a test works when it is run in single-step\
    \ mode but not during normal execution, it needs a few pause statements to allow\
    \ the browser to catch up, or even better, waitFor... statements, which will allow\
    \ the test to be in sync.\n\nExample 3-5: Selenium test\n\n```html\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.0 strict//EN\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" profile=\"http://selenium-ide.org/profiles/test-case\"\
    >\n<head>\n  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    \ />\n  <link rel=\"selenium.base type=\"text/css\" href=\"http://www.example.com/\"\
    \ />\n  <title>New Test</title>\n</head>\n<body>\n  <table cellpadding=\"1\" cellspacing=\"\
    1\" border=\"1\">\n    <head>\n      <tr>\n        <td rowspan=\"3\">New Test</td>\n\
    \        <td></td>\n      </tr>\n    </head>\n    <tbody>\n      <tr>\n      \
    \  <td>open</td>\n        <td>/examples/simple.html</td>\n        <td></td>\n\
    \      </tr>\n      <tr>\n        <td>click</td>\n        <td>click_me</td>\n\
    \        <td></td>\n      </tr>\n      <tr>\n        <td>waitForElementPresent</td>\n\
    \        <td>/div[@id='target_div']</td>\n        <td></td>\n      </tr>\n   \
    \   <tr>\n        <td>assertTextPresent</td>\n        <td>First</td>\n       \
    \ <td></td>\n      </tr>\n    </tbody>\n  </table>\n  <!-- More tests -->\n\n\
    </body>\n</html>\n```\n\n## Selenium Commands\n\nSelenium features a rich command\
    \ language called Selense to allow the programmer to create tests. Pretty much\
    \ any that a user could take in the browser can be done in a Selenium command.\
    \ You can create a Selenium test by creating a script consisting of a series of\
    \ actions and tests.\n\nDragging a file from the desktop to the browser (see \"\
    Drag-and-Drop\" on page 71\") is one thing that cannot be done from Selenium,\
    \ nor can it be easily tested from QUnit.\n"
  mdcn: "\nQUnit 中的测试是一个由测试运行器调用的 JavaScript 函数。查看示例 3-4 中的简单测试。该测试使用了几个断言函数，必须满足这些函数的条件测试才能通过。要测试一个值是否等于预期结果，请使用\
    \ `equal()` 方法，它接受三个参数：要测试的值、预期结果以及一个可选参数（该参数是测试失败时显示的消息）。如果一个测试在编写六个月后才被被查看，这种方法会更加有用。\n\
    \n示例 3-4. 简单测试\n\n```javascript\ntest(\"Basic Test\", function () {\n// assert\
    \ that the target attribute does not exist\n  equal($`div#target_div\\`).length,\
    \ 0,\n    \"Target element should not exist\");\n// run method\n  handleButtonClick()\
    \ {\n    equal($`div#target_div\\`).length, 0,\n      \"Target element should\
    \ still not exist\");\n    window.setTimeout(function () {\n      equal($`div#target_div\\\
    `).length,1,\n        \"Target element should now exist\");\n      equal(\"first\"\
    ,\n        (``div#target_div\\`).text().substr(0,5),\n        \"Check that the\
    \ first word is correct\");\n    });\n  }, 1000);\n});\n```\n\n## 使用 QUnit 进行测试\n\
    \n要运行 QUnit，必须在测试运行器中包含 qunit 样式和 JavaScript 文件。这些文件可以直接从 GitHub 获取，也可以从本地加载（参见示例\
    \ 3-3）。DOM 还必须包含几个由 QUnit 加载的元素以显示其结果。这些元素可以位于示例 3-3 HTML 的底部。这就是运行测试所需的所有内容。\n\
    \nQUnit 八个断言函数。除了我们在上一个示例中出现的 `equal()` 之外，还有进一步的等性测试以及 `ok()` 方法，`ok()` 测试传递给它的值是否为真。此外，`strictEqual()`\
    \ 根据 JavaScript 的 `\"===\"` 运算符进行测试，而 `equal()` 使用 `\"==\"` 运算符进行比较。要测试更复杂的数据结构，请使用\
    \ `deepEqual()`。它对两个数据结构进行递归比较。\n\n每个等性函数都有一个反向形式，用于测试不相等的情况：`notEqual()`、`notStrictEqual()`\
    \ 和 `notDeepEqual()`。它们接受与 `equal` 版本相同的参数，但测试的是反向情况。\n\n最后一个断言是 **raises()**，它接受一个函数作为参数并预期该函数抛出一个错误条件。\n\
    \n要测试以异步方式发生的事件，简单地进行更改并返回值是不够的。在这种情况下，测试必须等待操作完成。这可以通过 `setTimeout()` 设置超时来实现，它将在设定的时间后运行。或者通过某些操作（如\
    \ Ajax 加载或其他事件）的回调函数来实现。\n\n## Selenium\n\n虽然 QUnit 允许你编写 JavaScript 代码，但 Selenium\
    \ 采取了不同的方法。Selenium 通过模拟用户可能采取的操作来测试用户界面。Selenium 测试由许多在浏览器中运行的步骤组成，例如加载页面、点击特定元素、在文本区域中输入内容等。在这些操作之间将穿插着用于验证\
    \ DOM 状态或其他待测试内容的断言。这些断言可以包括测试元素是否存在或缺失。\n\n当运行 Selenium 测试时，它实际上会启动浏览器，并以与用户操作大体相同的方式运行。因此，可以观察测试与浏览器的交互。在测试运行期间，甚至可以手动与浏览器进行交互（尽管这这可能不是个好主意）。\n\
    \nSelenium 由几个大部分独立的部分组成。其中一个是实现为 Firefox 浏览器插件的 IDE。另一个是 RC 服务器 `seleniumrc`，它是一个\
    \ Java 服务器，可以用于在不同的浏览器中自动运行测试。\n\nFirefox 的 Selenium IDE 插件是开发者的好朋友。它允许你构建直接在浏览器中运行的测试。IDE\
    \ 可以记录用户的操作并在稍后作为测试进行重放。它还允许你逐行执行测试，这对于发现测试中的时序问题非常有用。\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_44_0.png)\n\
    \n默认情况下，在记录操作时，Selenium IDE 将使用各种 HTML 元素的 ID。当程序员没有显式分配 ID 时，某些框架会在元素创建时按顺序分配\
    \ ID。这些 ID 在每次运行之间将是不一致的，或者你可以使用某些其他方法来识别感兴趣的元素。\n\nSelenium IDE 将测试输出为 HTML 文件，这些文件可以在\
    \ Firefox 的 IDE 中直接运行。此外，这些 HTML 文件可以使用 Selenium RC 组件作为批作业运行。Selenium RC 服务器还允许\
    \ HTML 测试在任何浏览器中运行，因此可以使用 IE、Chrome、Opera 或 Safari 运行这些测试。Selenium RC 服务器还可以通过类似\
    \ PHPUnit 或 JUnit 的传统测试进行控制。\n\nSelenium IDE 在开发过程中记录 Web 宏也有用。例如，如果你正在测试 Web\
    \ 应用程序中的一个向导，在调试屏幕之前会显示四个五个屏幕，你可以使用 IDE 创建一个 Selenium 脚本，并将其作为宏调用，以自动到达待测试点。\n\
    \n-   如果一个测试在单步模式下运行正常，但在正常执行时不通过，则需要几个暂停语句来让浏览器追上进度，或者更好使用 `waitFor...` 语句，这将允许测试保持同步。\n\
    \n在 Selenium 中运行测试有三种方法：\n- IDE\n- RC 服务器\n- 编程语言\n\n如果一个测试在单步模式下运行正常，但在正常执行时不通过，则需要几个暂停语句来让浏览器追上进度，或者更好使用\
    \ `waitFor...` 语句，这将允许测试保持同步。\n\n示例 3-5. Selenium 测试\n\n```html\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.0 strict//EN\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" profile=\"http://selenium-ide.org/profiles/test-case\"\
