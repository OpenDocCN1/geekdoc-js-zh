  - "[PAGE 37]\n\nThe path method takes a path in the form of a Unix file path,/path/to/our/data.\
    \ It then uses an inner function to recursively move down the data tree until\
    \ it finds the requested element and returns it, or realizes the element is not\
    \ present, in which case it returns undefined. At first, it would seem to make\
    \ sense to just call the level path function for each iteration. This would not\
    \ be a good idea, as it is possible that in some cases there will be an indexed\
    \ array at some point in the path, causing the iteration to break if Array.prototype\
    \ is not the same as the Object.prototype. By doing the search with an inner function,\
    \ you avoid this problem.\n\nThe method in Example 2-24 can handle arrays as well\
    \ as objects. Both arrays and objects can be addressed with the square bracket\
    \ notation if a part of the path is a number; for example, [3] will take the fourth\
