  - '[PAGE 12]


    # CHAPTER 1


    # The Web As Application Platform


    HTML5 makes the Web a first-class environment for creating real applications.
    It reinforces JavaScript''s existing tool set with key extensions to the browser
    APIs that make it easier to create applications that feel (and can be) complete
    in themselves, not just views on some distant server process.


    The Web began as a way to share files, stored on a web server, that changed only
    occasionally. Developers quickly figured out how to generate those files on the
    fly, taking the first big step toward building applications. The next big step
    was adding interactivity in the browser client. JavaScript and the Document Object
    Model (DOM) let developers create Dynamic HTML, as the "browser wars" raged and
    suddenly stopped. After a few years, Ajax brought these techniques back into style,
    adding some tools to let pages communicate with the server in smaller chunks.


    HTML5 builds on these 20 years of development, and fills in some critical gaps.
    On the surface, many of HTML5''s changes add support for features (especially
    multimedia and graphics) that had previously required plug-ins, but underneath,
    it gives JavaScript programmers the tools they need to create standalone (or at
    least more loosely tethered) applications using HTML for structure, CSS for presentation,
    and JavaScript for logic and behavior.


    # Adding Power to Web Applications


    HTML5 raises the bar for web applications. While it still has to work under security
    constraints, it finally provides tools that desktop developers have expected for
    years:


    Local data storage


    It can store up to 5 MB of data, referenced with a key-value system.


    Databases


    Originally a SQLite-based API, the tide seems to have shifted to IndexedDB, a
    NoSQL system that is natively JavaScript.'
  - '[PAGE 13]


    # Files


    While applications still can''t freely access the filesize (for obvious security
    reasons), they can now work with files the user specifies and are starting to
    be able to create files as well.


    # Taking offline


    When a laptop or phone is in airplane mode, web applications are not able to communicate
    with the server. Manifest files help developers work around that by caching files
    for later use.


    # Web Workers


    Threads and forks have always been problematic, but JavaScript didn''t offer them.
    Web Workers provide a way to put application processes into separate spaces where
    they work without blocking other code.


    # Web sockets


    Hypertext Transfer Protocol (HTTP) has been the foundation of the Web, despite
    a few updates over time. Web sockets transform the request-response approach to
    create more flexible communication systems.


    There''s more, of course—from geolocation to audio and video to Canvas graphics—to
    a wide variety of minor new tags—but these provide the foundations for building
    industrial-strength applications in HTML5.


    # Developing Web Applications


    In the old days, a complex web application might be a catalog, which would be
    static pages derived from a database, or a JavaScript loan calculator. But no
    one would have dreamed of dreaming complex applications in JavaScript. Those required
    Java or maybe a dedicated client/server application writing in Cor C++. Indeed,
    in the days before the DOM and Ajax, developing complex applications in JavaScript
    would have been pretty impossible. However, Ajax introduced the ability to interact
    with the server without reloading the page, and the DOM allowed the programmer
    to change HTML on the fly.


    In 2007, Google Gears, a browser extension that gave the developer lot more power
    than had been before. Gears allowed the browser to work offline, to enable users
    to store more data in the browser and have a worker pool to offload long-running
    tasks. Gears has since been discontinued, as most of its features have migrated
    to HTML5 in modified forms.


    The modern Web features a full range of sites, from those that are still effectively
    old-style collections of documents, like Wikipedia, to sites that offer interactions
    with other people, such as Facebook, YouTube, and eBay, to things that can serve
    as replacements for desktop applications, such as Gmail and Google Docs. Many
    formerly standalone applications, such as mail clients, have become part and parcel
    of the web experience.'
  - '[PAGE 14]


    In the modern Web, the line between applications and pages has blurred. The difference
    at this point is only in the intent of the site.


    Running an application in the browser has some major advantages for both the user
    and the developer. For the user, there is no commitment to the application: you
    try it out, and if you don''t like it, you can move on to the next page with nothing
    left behind to clutter up your desktop. Trying new applications is also reasonably
    safe, as they run in aboxed environment. New versions of the application are automatically
    downloaded to the browser when the developer updates the code. Web applications
    rarely have version numbers, at least public ones.


    For the developer, the case is even stronger. First of all, the things that are
    an advantage to the users are also good for the developers. There is no installation
    program to write, and new versions can automatically be sent to the users, making
    small, incremental updates not only possible but practical. However, there are
    bonuses without


    The Web is cross-platform. It is possible to write a web page that will work on
    Windows XP, Windows Vista, Windows 7, Mac OS X, Linux, the iPhone/iPad, and Android.
    Doing that with the Web and some foresight almost comes for free. A web application
    built on standards with a library like jQuery will be able to run on major browsers
    on all platforms. While one point some hoped that Java applets defeated the Web
    as a platform, JavaScript has turned out to become the default web platform.


    You can run web applications on mobile devices, at least those that are today
    are called smartphones. With a wrapper like PhoneGap, you can create an HTML5
    app and package it for sale in the App Store, the Android Market, and you might
    create an application that interacts heavily with a web server, or you might create
    a completely self-contained application. Both options are available.


    The real place that the Web, prior to HTML5, traditionally falls short is that
    a web application, running on a computer with gigabytes of memory and disk space,
    almost like it is running on an old VT320 terminal. All data storage must be done
    on a server, all files must be loaded from the server, and every interaction pretty
    much requires a round-trip to the server. This can cause the user experience to
    feel slow, especially if the server is far away from the user. Every time the
    user wishes to look something up there is a minimum response time of 400 milliseconds
    before any actions can be taken, the application will feel slow. From my office
    in Tel Aviv to a server in California, the round-trip time for an ICMP ping is
    about 250 ms. Any action on the server would be extra and slow that down even
    more. Mobile device communications can, of course, be slower


    # Developing Web Applications | 3'
  - '[PAGE 15]


    # JavaScript''s Triumph


    Though JavaScript has been a key component of web development since it first appeared
    in 1995, it spent a decade or so with a bad reputation. It offered weak performance,
    was saddled with a quirky syntax that led to mysterious bugs, and suffered from
    its dependence on the DOM. Browsers keep it locked in a "sandbox," easing security
    concerns making it very difficult for developers to provide features that seemed
    trivial in more traditional desktop application development.


    Scripting culture created its own problems. Although providing a low barrier to
    entry is a good thing, it does come with costs. One of the costs is that such
    a language often allows inexperienced programmers to do some ill-advised things.
    Beginning programmers could easily find JavaScript examples on the Web, cut and
    paste them, change a few things, and have that mostly worked. Unfortunately, maintaining
    such code becomes more and more over time.


    With the Ajax revival, developers took a new look at JavaScript. Some worked on
    improving the engines interpreting running JavaScript code, leading to substantial
    speed improvements. Others focused on the language itself, realizing that it had
    some very nice features, and developing best practices like those outlined in
    JavaScript: The Good Parts by Douglas Crockford (O''Reilly, 2008).


    Beyond the code realm, developers built tools that make debugging JavaScript much
    easier. Although Venman, an early debugger, had appeared in 1998, the 2006 release
    of Firefox became the gold standard of JavaScript debuggers allowed the DOM and
    CSS, single-step through code, and much more. Browsers built on WebKit, notably
    Apple''s Safari and Google Chrome, offer similar functionality built in, and Opera
    Dragonfly provides support for Opera. Even developers working in the confined
    spaces of mobile devices can now use Firebug-like debugging with (WeB InspectorRemote).


    The key component in this massive investment in JavaScript was libraries. Developers
    still might not understand all the code they were using, but organizing code into
    readily upgradable and sometimes interchangeable libraries simplified code management.


    jQuery If anything can be described as the gold standard of JavaScript libraries,
    it would have to be Resig''s jQuery library, which forms a wrapper around the
    DOM and other JavaScript objects such as the XMLHttpRequest object, and makes
    all sorts of things in JavaScript a lot easier and a lot fun. In many years, jQuery
    is the essential JavaScript library that every programmer should know. To learn
    jQuery, see the jQuery website or a number of books on the subject, such as Head
    First jQuery by Ryan Benedetti and Ronan Cranley and jQuery Cookbook by Cory Lindley,
    both published by O''Reilly. Many examples in this book are written using jquery.'
- md: "\n# ExtJS\n\nWhereas jQuery forms a wrapper around the DOM, Sencha's ExtJS\
    \ tries to abstract it away as much as possible. ExtJS features a rich widget\
    \ set that can live in a web page and provide many of the widgets, such as trees,\
    \ grids, forms, buttons, and so on, that desktop developers are familiar with.\
    \ The entire system is very well thought out, fits together well, and makes developing\
    \ many kinds of applications a joy. Although the ExtJS library takes up a lot\
    \ of space, the expenditure is worthwhile for some kinds of application development.\n\
    \nOne nice feature of ExtJS is that many of its objects know how to save their\
    \ state. So if a user takes a grid and reorganizes the columns, the state can\
    \ be saved so that the same order appears the next time the user views that grid.\
    \ “Using localStorage in ExtJS” on page 53 will show how to use the HTML5 localStorage\
    \ facility with this feature.\n\n# Google Web Toolkit, etc.\n\nTools such as GWT\
    \ allow the programmer to write Java code, which is then compiled down to JavaScript\
    \ and can run on the browser.\n\n# CHAPTER 2\nThe Power of JavaScript\n\nAlthough\
    \ JavaScript is not a difficult language to program, it can be challenging to\
    \ rise to the level of a true expert. There are several key factors to becoming\
    \ a skilled JavaScript programmer. The techniques in this chapter will appear\
    \ repeatedly in the libraries and programming practices taught in the rest of\
    \ this book, so you should familiarize yourself with these techniques before continuing\
    \ with those chapters.\n\nThere are a number of excellent tools for JavaScript\
    \ programming, some of them listed in the Appendix. These tools can provide you\
    \ with a lot of assistance. Specifically, JSLint will catch a large number of\
    \ errors that a programmer might miss. Sites as StackOverflow and O'Reilly Answers\
    \ will be a good source of other tools.\n\nThis chapter is not a full introduction\
    \ to the power of JavaScript. O'Reilly publishes a number of excellent books on\
    \ JavaScript, including:\n\n- * JavaScript The Good Parts by Douglas Crockford\n\
    - JavaScript: The Definitive Guide by David Flanagan\n- High Performance JavaScript\
    \ by Nicholas C. Zakas\n- JavaScript Patterns by Stoyan Stefanananov\n\n# Nonblocking\
    \ I/O and Callbacks\n\nThe first key to JavaScript, after learning the language\
    \ itself, is to understand event-driven programming. In the environment where\
    \ JavaScript runs, operations tend to be asynchronous, which is to say that they\
    \ are set up in one place and execute later after some external event happens.\n\
    \nThis can represent a major change from the way I/O happens in traditional languages.\
    \ Take Example 2-1 as a typical case of I/O in a traditional language, in this\
    \ case PHP. The line $db->getAll($query); requires the database to access the\
    \ disk, and therefore will take orders of magnitude more time to run than the\
    \ rest of the function. While the program is waiting for the server to execute,\
    \ the query statement is blocked and the program is doing nothing. In a server-side\
    \ language like PHP, where there can be many parallel threads or processes of\
    \ execution, this isn't usually a problem.\n\nExample 2-1. Blocking I/O in PHP\n\
    \n```\nfunction getFromDatabase() {\n  $db = getDatabase();\n  $query = \"SELECT\
    \ name FROM countries\";\n  $result = $db->getAll($query);\n  return $result;\n\
    }\n```\n\nIn JavaScript, however, there is only one thread of execution, so if\
    \ the function is blocked, nothing happens and the user interface is frozen. Therefore,\
    \ JavaScript must find a different way to handle I/O (including all network operations).\
    \ What JavaScript does right away from a method that might perceive slow, leaving\
    \ behind a function that gets called when the operation (say, downloading new\
    \ data from the web server) completes. The function is known as a callback. When\
    \ making an Ajax call to the server, the JavaScript launches the request and then\
    \ goes on to do something else. It provides a function that is called when the\
    \ server is finished. This function is called (hence the term callback) with the\
    \ data that is returned from the server at the time when the data is ready.\n\n\
    As an analogy, consider two ways of buying an item at a grocery store. Some stores\
    \ leave items behind the counter, so you have to ask a salesperson for the item\
    \ and wait while she retrieves it. That's like the PHP program just shown. Other\
    \ stores have a deli counter where you can request an order and get a number.\
    \ You can go off to do other shopping, and when your order is ready, you can pick\
    \ it up. That situation is like a callback.\n\nIn general, a fast operation can\
    \ be blocking because it should return the data requested right away. A operation,\
    \ such as a call to a server that may take several seconds, should be nonblocking\
    \ and return its data via a callback. In a single-threaded language, the presence\
    \ of a function will provide a good clue to the relative time it will take. So\
    \ a major step to JavaScript mastery involves using closures and knowing when\
    \ they are triggered. When you use a Store object, for example, the data will\
    \ not wait for a second. Using a closure to create a callback is critical. In\
    \ JavaScript, learning to use closures (“Closures” on page 11) should be avoided.\n\
    \n# Lambda Functions Are Powerful\n\nProgrammers who have come to JavaScript from\
    \ PHP or other languages will tend to treat JavaScript functions like those in\
    \ the languages they have already used. While it is possible to use JavaScript\
    \ functions in this way, it is missing a large chunk of what JavaScript functions\
    \ so.\n\nJavaScript functions can be created with the function statement (Example\
    \ 2-2) or the function expression (Example 2-3). These two forms look pretty similar,\
    \ and both produce a function square that will square a number. However, there\
    \ are key differences. The first form is subject to hosting, which is to say that\
    \ the function will be created at the start of the enclosing scope. So you can\
    \ use a function statement when you want the function defined conditionally, because\
    \ JavaScript won't wait for the conditional statement to be executed before deciding\
    \ whether to create the function. In practice, most browsers allow you to put\
    \ a function inside an if, but it is not a good idea, as what browsers do in this\
    \ case can vary. It is much better to use a function statement if the definition\
    \ of a function should be conditional.\n\nExample 2-2. Function statement\n\n\
    ```\nfunction square(x) {\n  return x * x;\n} // Note lack of a ;\n```\n\nExample\
    \ 2-3. Function expression\n\n```\nvar square = function(x) {\n  return x * x;\n\
    }\n```\n\nIn the second form, the function expression, the function is created\
    \ when execution gets to that point in the flow of the program. It is possible\
    \ to define a function conditionally, or to have the function defined inside a\
    \ larger statement. The function expression, in addition, assigns no name to the\
    \ function, so the function can be left anonymous. However, the example shown\
    \ assigns a name (square) on the left side of the equals sign, which is a good\
    \ idea for two reasons. First, when you are debugging a program, assigning a name\
    \ allows you to tell which function you're seeing in a stack trace; without it,\
    \ the function will show up as anonymous.\n"
  mdcn: "\n\n# ExtJS\n\n与其说 jQuery 是对 DOM 的封装，不如说 Sencha 的 ExtJS 试图尽可能地将其抽象化。ExtJS\
    \ 拥有一套丰富的组件集，这些组件可以运行在网页中，并提供许多桌面开发者熟悉的组件，如树形、网格、表单、按钮等。整个系统设计得非常周密，配合良好，让开发各种应用程序变成了一件乐事。尽管\
    \ ExtJS 库占用的空间很大，但对于某些类型的应用来说，这种投入是值得的。\n\nExtJS 的一个很棒的特性是它的许多对象都知道如何保存自己的状态。因此，如果用户对网格进行了列重排，可以保存该状态，这样当用户下次查看该网格时就会出现相同的顺序。第\
    \ 53 页的“在 ExtJS 中使用 localStorage”将展示如何结合此功能使用 HTML5 localStorageset。\n\n# Google\
    \ Web Toolkit 等\n\n如 GWT 等工具允许程序员编写 Java 代码，然后这些代码会被编译为 JavaScript 并在浏览器中运行。\n\
    \n# 第 2 章\nJavaScript 的威力\n\n尽管 JavaScript 并不是一种难以编程的语言，但要达到真正的专家水平可能具有挑战性。成为一名熟练的\
    \ JavaScript 程序员有几个关键因素。本章中的技术将在本书后续章节的库和编程实践中反复出现，因此在继续阅读后续章节之前，你应该先熟悉这些技术。\n\
    \nJavaScript 编程有很多出色的工具，其中一些列在附录中。这些工具可以为你提供很多帮助。具体来说，JSLint 会捕获程序员可能会忽略的大量错误。StackOverflow\
    \ 和 O'Reilly Answers 等网站也是其他工具的良好来源。\n\n本章并不是 JavaScript 威力的完整介绍。O'Reilly 出版了许多关于\
    \ JavaScript 的优秀书籍，包括：\n\n- *JavaScript The Good Parts* 作者 Douglas Crockford\n\
    - *JavaScript: The Definitive Guide* 作者 David Flanagan\n- *High Performance JavaScript*\
    \ 作者 Nicholas C. Zakas\n- *JavaScript Patterns* 作者 Stoyan Stefanananov\n\n# 非阻塞\
    \ I/O 与回调\n\n在学习了语言本身之后，JavaScript 的第一个关键是理解事件驱动编程。在 JavaScript 运行的环境中，操作往往是异步的，也就是说它们在某处设置，并在某些外部事件发生后以后执行。\n\
    \n这代表了与传统语言处理 I/O 的的一种重大改变。以示例 2-1 为传统语言（在此情况下为 PHP）的典型 I/O 案例。行代码 `$db->getAll($query);`\
    \ 要求数据库访问磁盘，因此其运行时间比函数的其他部分慢几个数量级。当程序等待服务器执行时，查询语句被阻塞，程序什么无可做。在像 PHP 这样的服务端语言中，可以有很多并行的执行线程或进程，这通常不是问题。\n\
    \n示例 2-1. PHP 中的阻塞 I/O\n\n```\nfunction getFromDatabase() {\n  $db = getDatabase();\n\
    \  $query = \"SELECT name FROM countries\";\n  $result = $db->getAll($query);\n\
    \  return $result;\n}\n```\n\n但在 JavaScript 中，只有一个执行线程，因此如果函数被阻塞，什么都不会发生，用户界面也会冻结。因此，JavaScript\
    \ 必须找到一种不同的方式来处理 I/O（包括所有的网络操作）。JavaScript 会立即从可能感知为缓慢的方法返回，留下一个在操作（例如，从 Web 服务器下载新数据）完成后被调用的函数。这个函数被称为回调。当向服务器发起\
    \ Ajax 调用时，JavaScript 启动请求然后继续做其他事情。它提供了一个在服务器完成后被调用的函数。该函数在数据就绪时，带有从服务器返回的数据被调用（因此称为“回调”）。\n\
    \n作为一个类比，考虑在杂货店购买商品的两种方式。有些商店将商品放在柜台后面，所以你必须向销售员索要商品并在等待她取东西。这就像刚才展示的 PHP 程序。其他商店有肉类柜台，你可以请求订单并获得一个号码。你可以去买其他东西，当你的订单准备好时，你可以取走。这种情况就像回调。\n\
    \n通常情况下，快速的操作可以是阻塞的，因为它应该立即返回请求的数据。而操作（例如可能需要几秒钟的服务器调用）应该是非阻塞的，并通过回调返回其数据。在单线程语言中，函数的存在将为相对所需时间提供良好的线索。因此，精通\
    \ JavaScript 的一个大步涉及使用闭包并知道它们何时被触发。例如，当你使用 Store 对象时，数据不会等待一秒。使用闭包创建回调至关重要。在 JavaScript\
    \ 中，学习使用闭包（第 11 页的“Closures”）是不应该被避免的（*注：此处原文可能有误，此处应为“应当学习”*）。\n\n# Lambda 函数是强大的\n\
    \n从 PHP 或其他语言转向 JavaScript 的程序员倾向于将 JavaScript 函数看作他们已经使用过的语言中的函数。虽然可以这样使用 JavaScript\
    \ 函数，但它遗漏了 JavaScript 函数如此运作的很大特性。\n\nJavaScript 函数可以通过函数声明（示例 2-2）或函数表达式（示例 2-3）创建。这两种形式看起来非常相似，并且都会产生一个对平方的函数\
    \ `square`。然而，它们存在关键差异。第一种形式受变量提升（hosting）的影响，这意味着函数将在闭作用范围的开始时创建。因此，当你想要有条件的定义函数时可以使用函数声明，因为\
    \ JavaScript 不会在执行条件语句之前决定是否创建该函数。在实践中，大多数浏览器允许你将函数放在 if 语句中，但这不是一个好主意，因为浏览器在这种情况下的做法可能有所不同。如果函数的定义应该是条件的，使用函数声明要好得多。\n\
    \n示例 2-2. 函数声明\n\n```\nfunction square(x) {\n  return x * x;\n} // 注意缺少分号\n```\n\
    \n示例 2-3. 函数表达式\n\n```\nvar square = function(x) {\n  return x * x;\n}\n```\n\n\
    在第二种形式即函数表达式中，函数在程序流运行到这一点时被创建。可以有条件地定义函数，或者在较大的语句中定义函数。此外，函数表达式没有给函数分配名称，因此函数可以是匿名的。然而，所示的示例在等号左侧分配了一个名称（square），这出于两个好主意。首先，当你调试程序时，分配名称允许你识别出堆栈跟踪中看到的是哪个函数；如果没有名称，函数将显示为匿名。\n\
    \n"
