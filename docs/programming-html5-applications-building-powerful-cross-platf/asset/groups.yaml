    \ = path.split('/');\n  var findIter = function findIter(element, path) {\n  \
    \  // If the element is empty just ignore it and move on\n    if (path[0] ===\
    \ '') {\n      return findIter(element, path.slice(1));\n    }\n    if (element[path[0]]\
