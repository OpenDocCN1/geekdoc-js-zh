    \ value of i that is referenced in all cases is the final value. A closure will\
    \ show the current value of variable, not the value when the closure was created.\
    \ The for loop changes the value of i as it iterates over the list. In Example\
    \ 2-19, the code will work correctly. In this case, the node referenced in each\
    \ iteration is independent because it is inside the scope of the function.\n\n\
    # Example 2-18. Loop with for\n\n```\nfor (var i = 0; i < nodes.length; i += 1)\
    \ {\n  nodes[i].bind('click', function() {\n    console.info(nodes[i]);\n  });\n\
    }\n```\n\n# Example 2-19. Binding with foreach\n\n```\nnodes.forEach(function(node)\
    \ {\n  node.bind('click', function() {\n    console.info(node);\n  });\n});\n\
    ```\n\nThe next method of note is filter(). This method takes an array and returns\
    \ the subset of the array for which the method returns true. The iterator function\
    \ shown in Example 2-20 receives the same parameters as it does for map(), but\
    \ should return a boolean value."
