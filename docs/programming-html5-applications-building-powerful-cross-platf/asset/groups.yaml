    \ and the provided snippets in the later pages of the OCR.)*\n\n# CHAPTER 3\n\n\
    # Testing JavaScript Applications\n\nTest-driven development has become all the\
    \ rage in software development over the past years. By creating tests that are\
    \ automated and repeatable, a developer can have confidence that the code is high\
    \ quality and that new changes will not break older features. Some proponents\
    \ claim that tests should be written before the code they test.\n\nHaving a reliable\
    \ set of tests is a vital part of any software development effort. It enables\
    \ a developer to have confidence that code works once it's written and will continue\
    \ to work over time.\n\nTesting has a key element of development in most server-side\
    \ development platforms. Solid test harnesses can be found in environments for\
    \ PHP, Java, Ruby, and so on. However, the standard method for testing in most\
    \ of these languages does not work well for JavaScript. Let's look at a few reasons\
    \ why.\n\nServer-side test suites generally have to test the program under one\
    \ set of environments. If a REST service is being built with Python, the tester\
    \ can build the tests with several safe assumptions. For instance, he may know\
    \ that it will run on Python version 3.0 on Linux, along with specific versions\
    \ of all the supporting software.\n\nThe web application has no such confidence.\
    \ Users may come to use the site Firefox, Internet Explorer, Chrome, Safari, and\
    \ Opera—and several versions of each. So test suites must be able to handle testing\
    \ across a number of browsers and operating systems, each of which is a little\
    \ different.\n\nThere are two main sources of differences. First, there are differences\
    \ in the language itself among the different browsers. For example, the keyword\
    \ const is supported by Firefox, but not by Internet Explorer. Second, many HTML\
    \ interfaces exist only in particular browsers or browser versions. For example,\
    \ many of the various JavaScript interfaces in this book exist only in particular\
    \ browsers. So tests must be able to adjust to those differences and handle degradation\
    \ where needed.\n"
