  - '[PAGE 49]


    Actions in Selenium have two forms: a simple form and a second form that will
    wait for a page to reload. The waiting form of the click command, for instance,
    is clickAnd Wait.


    After a sequence of actions, it is necessary to verify that the application actually
    performed the correct actions. Most tests in Selenium check for the presence or
    absence of an element or section of text. For example, test adding a new element
    to an ExtJS grid, the script would go something like this:


    +   1. Click the add button.

    2. Fill out a form giving default values.

    3. Submit a new record to the server.

    4. Wait for the server to respond and verify the test in the correct grid.


    All of the assertions have three fundamental forms: the basic form, a verify form,
    and a WaitFor. The basic command will be similar to assertElementPresent, and
    will stop a test when the assertion fails. verifyElementPresent will check whether
    the element exists, but let the test continue if it does not. This is useful if
    there are multiple tests and you don''t want them to stop after one failure. If
    an action is supposed to have a result that is delayed, waitForElementPresent,
    will pause the test script until the condition is met or the test times out. In
    summary:


    assert...

    Check that something is true, and stop if it is not.


    verify...

    Check that something is true, but continue if it is false.


    waitFor...

    Wait for something to happen on the page (often with Ajax).


    # Constructing Tests with the Selenium IDE


    Selenium tests can be constructed by hand, but it is often much easier to automate
    their construction. The Selenium IDE plug-in for Firefox let you record your actions
    in the browser and save them as a test. The programmer will still have to put
    in the assertions and the wait commands manually, and may have to make adjustments
    to the script that has been produced. The test is saved as an HTML document that
    can be checked in version control and run from the IDE as well as an automatic
    runner.


    The IDE is a very nice way to try out options in Selenium. It will also let you
    create test scripts and run them directly from the IDE. The Selenium IDE also
    allows you to control how fast it executes the scripts, and single-step through
    them.'
