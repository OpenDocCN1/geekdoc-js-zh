    \ `[10, 10, false, false]` 的命令。\n\n最后一种情况是想要存储器的内容。此时索引并不重要（除非需要排序），直接在存储器上调用\
    \ `openCursor` 即可。示例 5-9 中的 `write` 回调将依次对每个元素调用。\n\n示例 5-9. 获取所有行\n\n```\n$.indexed(db).objectStore(objectStore).openCursor().each(write);\n\
    ```\n\n# 删除数据\n\n从对象存储器中删除数据也非常简单。每个对象存储器都有一个 `remove()` 方法，可以通过要删除项目的 ID 来进行调用。存储器将删除该项目并调用回调，如示例\
    \ 5-10 所示。\n\n示例 5-10. 删除数据\n\n```\n$.indexed(db).objectStore(objectStore).remove(id).then(write,\
    \ err);\n```\n\n你可以遍历游标并使用 `deleteEach()` 方法删除选定的行。该方法的作用类似于数组过滤器，只删除函数返回 `true`\
    \ 的项。例如，示例 5-11 删除了所有 `isDuplicate()` 函数返回 `true` 的记录。\n\n示例 5-11. 删除多个数据项\n\n\
    ```javascript\n{\n  $.indexed(db).objectStore(objectStore).deleteEach(function\
    \ (value, key) {\n    return isDuplicate(value);\n  });\n}\n```\n\n# 第 6 章\n##\
    \ 文件\n\n显而易见的原因，浏览器在历史上访问文件系统的能力非常有限。HTML 表单已经能够上传文件，某些 HTTP 请求头使得用户从服务器下载文件成为可能。但在这些特定功能之外，浏览器无法访问本地文件系统上的文件。总的来说，这是一好事。我不希望我访问的每个网页都能查看我的硬盘内容！\n\
    \nHTML5 的一些新功能允许浏览器通过现有的表单输入对文件进行有限访问。从历史上看，浏览器可以从表单上传文件，但现在可以在 JavaScript 中直接使用文件数据。此外，浏览器现在允许你从\
    \ Web 应用程序拖拽文件。Google 的 Gmail 使用此功能允许用户附加文件。这曾是通过 Flash 实现的，但现在只需 JavaScript 即可完成。\n\
    \n这不会产生任何新的安全问题，因为应用程序已经通过将其上传到服务器并重新下载到浏览器获取了这些数据。\n\n在编写本文时，这些功能在 Firefox、Chrome\
    \ 和 Opera 中均已支持。对于 Safari 和 Internet Explorer，Flash 插件可以实现文件拖放。\n\n# Blobs\n\n\
