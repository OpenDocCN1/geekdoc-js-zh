    machines. The Selenium Grid software along with examples and documentation can
    be found at http://selenium-grid.seleniumhq.org.


    If you don''t want to build your own test farm, there are Selenium farms on the
    Web that you can use. In addition, it is possible to run Selenium on Amazon''s
    EC2 cloud service. This can be very useful for occasional users or for a new startup
    that may not have the resources to build and maintain a local Selenium farm. This
    can be very helpful in explaining how an application performs over a remote network.


    # Selenium Command Programming Interface


    The test suite can run a test from an HTML file or directly from the unit test
    code. The Selenium RC server also has an API that can be called from unit test
    code in several languages. You can write test suites for Selenium in PHP, Ruby,
    Python, Java, C#/.NET, and Perl. You can create test cases for all of these languages
    via the Selenium IDE or by hand. The Selenium IDE will generate the skeleton of
    a test for you. To do this, record a test in the IDE, choose the output option
    for the language in which to run the test. The tests will be converted to that
    language.


    Run Selenium on several browsers, you need to set up the Selenium server. See
    "Selenium RC and a Test Farm" on page 46.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_53_0.png)


    Running Selenium directly from a unit test gives you the full power of the host
    language, notably its flow control, while the HTML-style tests are much more limited.
    By using the API from a server-side programming language, it is possible to create
    a very rich environment for scripting the Web, and of course you have access to
    libraries on the server side to check in a database or access web services. You
    can construct a test that will perform some actions in the browser, and then check
    the result in a database or against a logfile.'
  - "[PAGE 54]\n\nAnother advantage of server-side testing is that if you are using\
    \ any form of continuous integration, such as CruiseControl or phpUnderControl,\
    \ the Selenium tests appear to be the test system as just more tests in whatever\
    \ language the team is using. In a team that is using a test framework, this will\
    \ leverage the existing experience of the team.\n\nExample 3-8 is a very simple\
    \ Selenium test, written in PHP with theUnit testing framework. It just opens\
    \ a web page, and after the page has loaded, it asserts that the title of the\
    \ page is the string \"Hello World.\" It will then click a button with the text\
    \ \"Click Me.\" If the title is not \"Hello World\" or there is no such button,\
    \ the test will fail.\n\n# Example 3-8. Testing Hello World\n\n```\n<?php\nrequire_once\
    \ 'PHPUnit/Extensions/SeleniumTestCase.php';\n\nclass WebTest extends PHPUnit_Extensions_SeleniumTestCase\n\
    {\n    function testTitle() {\n        $this->open('http://www.example.com/');\n\
    \        $this->assertTitle('Hello World');\n        $this->click//button[text()='Click\
    \ Me']');\n    }\n}\n```\n\nIn general, Selenium commands consist of actions,\
    \ assertions, and queries. The actions reflect the basic forms of Selenium actions:\
    \ click, mouseOver, mouseDown, type, and so on. The various delays that appear\
    \ in the server-side Selenium interface are not present, but can be easily simulated\
    \ by using a loop with a sleep function.\n\nMany of the useful methods that are\
    \ present in the HTML Selenium test runner are not present in the server-side\
    \ Selenium interface. Methods such as WaitForElement Present WaitForNotPresent\
    \ are not included, but can be easily added by creating a custom base class for\
    \ the tests and adding them.\n\nExample 3-9. WaitForElementPresent\n\n```\nfunction\
    \ WaitForElementPresent($el, $timeout = 60)\n{\n    while($timeout)\n    {\n \
    \       if($this->isElementPresent($el))\n        {\n            return true;\n\
    \        }\n        $timeout -= 1;\n        sleep(1);\n    }\n    $this->fail(\"\
    Element $el not found\");\n}\n```"
  - '[PAGE 55]


    Queries allow the programmer to determine the state of the page after actions
    have happened. These queries allow the programmer to find out whether an element
    or piece of text exists on the page, or otherwise find out about the current state
    of the page.


    The Selenium API also features a number of methods to get data from the HTML document
    in the context of a unit test. To test whether a text is present in the page,
    use the method `$this->isPresent()`, which is often useful to find out if an element
    is present or otherwise `$this->isPresent()`. To actually retrieve text from the
    DOM, use the `$this->getText()` method. This will take any form of selector that
    Selenium can accept and return the text of that element. If the element is not
    present, the method will throw an exception.


    The XPath selector matches elements on the page. It will normally return the first
    matched element. To find out how many elements are matched, use `$this->getPathCount()`.


    When building tests in PHP, synchronizing the test actions between the interface
    in the browser and the test runner in PHP can be a challenge. It is intuitive
    to write a test that does something like click one element and then immediately
    mouse over another. This will inevitably fail, as the JavaScript will take some
    time (maybe 0.1 second) to create a piece of the user interface or wait for data
    to load from the server. There are two ways to handle this.


    The simple way is to place delays in the PHP code. A few well-placed `sleep()`
    commands can cause a test to function correctly. However, this may cause a test
    to take longer than is necessary. To speed up tests, something like a `waitForElementPresent()`
    call with 1/10 of a second delay testing can cause the script to run faster, as
    there is a way to tell from the DOM when the browser is ready for the next step
    in the test.


    The second way is to use the `$this->eval()` method in the Selenium interface
    to evaluate JavaScript. Pass this method a string that contains the JavaScript
    to be executed. When you call JavaScript via `eval()`, it will run in the window
    context of the test runner, not the test window. Therefore, global variables must
    be prefixed by the global `window` object, which normally is not required.


    In Example 3-10, Selenium executes `eval()` in JavaScript to extract the global
    `session_id` variable.


    Example 3-10. Running JavaScript from Selenium

    `$session_id = $this->eval(''window.session_id'');`'
