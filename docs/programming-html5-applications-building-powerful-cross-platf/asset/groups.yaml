    \ 还提供了几个回调函数，你可以在其中向用户提供反馈。`progress` 事件会返回已发送的字节数和上传的总大小，这可以让你在大型上传期间显示进度条。上传完成后，会触发\
    \ `complete` 事件。\n\n当你使用 `XMLHttpRequest` 上传文件时，服务器看到文件的方式与标准的 `<input type='file'>\
    \ multiple` 表单接口使用的接口相同。服务器端代码应采用自 `form` 元素引入以来一直使用的标准文件上传代码。\n\n示例 6-3 展示了通过\
    \ Ajax 上传文件的代码示例。它使用 `FormData` 对象封装文件，然后将其发送到服务器。`FormData` 是一个 JavaScript 对象，可以将数据打包成文件，以便执行标准的\
    \ HTTP 连接。要实现这一点，请使用 XHR，并将文件名作为 `blob` 添加到 `FormData.append()` 中。然后，使用 XHR 接口将\
    \ `FormData` 对象作为 Ajax 载荷发送出去。\n\n```javascript\n示例 6-3. 使用 Ajax 上传文件\nfunction\
