    \ browsers (e.g., they were added to Internet Explorer version 9). However, if\
    \ they are not available, they can be added. Sample code for all of the array\
    \ methods can be found on the Mozilla Developer Network website.\n\nThe called\
    \ function receives parameters as the current value of the array, the index of\
