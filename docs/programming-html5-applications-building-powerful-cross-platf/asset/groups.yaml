    \ of\n  undefined ->\n    {content, \"text/plain\", \"You're not a websocket client!\
    \ Go away!\"}\n  \"Upgrade\"\n    WebSocketOwner = spawn(fun() -> websocket_owner()\
    \ end),\n      {websocket, WebSocketOwner, passive}\n  end.\n\nwebsocket_owner()\
    \ ->\n  receive\n    % This is how we read messages (plural!!) from websockets\
    \ on passive mode\n    case yaws_api:websocket_receive(Websocket) of\n      {error,closed}\
    \ ->\n        io:format(\"The websocket disconnected from the right. ~n\\n\"This\
    \ wasn't supposed to happen!!~n\")\n      {ok, Messages} ->\n        case Messages\
    \ of\n          <<client-connected>> ->\n            yaws_api:websocket_setopts(Websocket,\
    \ [{active, true}]),\n            echo_server(Websocket);\n          Other ->\n\
    \            io:format(\"~websocket_owner_get: ~p. Terminating~n\", [Other])\n\
    \  end;\n  -> ok.\n```"
