    # Updates to the Manifest File


    The browser will update the files in the manifest whenever the manifest file itself
    changes. There are several ways to handle this. It is possible to add a version
    number in a comment to the file. If the project is using a of version control
    system like Subversion, you can use the version number tag for this.


