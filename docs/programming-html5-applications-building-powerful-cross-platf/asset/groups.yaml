    \ also provides handlers for onopen, onmessage, and onClose.\n\nExample 9-4. Ruby\
    \ Machine websocket handler\n\n```ruby\nrequire 'em-websocket'\n\nEventMachine::WebSocket.start(:host\
    \ => \"0.0.0.0\", :port => 8080) do |ws|\n  ws.onopen do\n    ws.send \"Hello!\"\
    \n  end\n\n  ws.onmessage do |msg|\n    ws.send \"Pong: #{msg}\"\n  end\n\n  ws.onclose\
    \ do\n    puts \"WebSocket closed\"\n  end\nend\n```\n\n### Erlang Pretty\n\n\
    Erlang is a pretty functional language that was developed decades ago. It is concurrent,\
    \ fault-tolerant, and very scalable.\n\nExample 9-5. Erlang socket handler\n\n\
    ```erlang\nget_upgrade_header(#headers(other=L)) ->\nlists:foldl(fun(http_header(_KO,_V,Acc)\
    \ ->\n    K = case is:atom(KO) of\n        true ->\n            atom:to_list(KO);\n\
    \        false ->\n            KO;\n    case string:to_lower(K) of\n        \"\
