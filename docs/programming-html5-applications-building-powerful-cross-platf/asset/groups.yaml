    ## Web Socket Protocol\n\nMost of the time, the low-level details of sockets will\
    \ not be of great concern to the programmer. The interfaces in the browser and\
    \ on the server will take care of the details and just provide an API that can\
    \ send data.\n\nThat being said, sometimes it may be useful to know the low-level\
    \ details of how things operate, to understand why something is not working, or\
    \ to implement a web socket client in some other environment. In particular, it\
    \ is important to understand how a socket is set up.\n\nWeb sockets carry data\
    \ between browser and server using a TCP socket instead of an HTTP envelope. When\
    \ the browser tries to open a socket, it sees what looks like an HTTP GET request\
    \ but a few extra headers (see Example 9-3).\n\nExample 9-3. Socket headers\n\n\
    ```\n/socket HTTP/1.1\nUpgrade: WebSocket\nConnection: Upgrade\nOrigin: http://www.test.com\n\
    Host: www.test.com\nContent-Length: 0\n```\n\nAfter the connection has been set,\
    \ frames of data are sent back and forth. Each frame starts with a null byte of\
    \ 0x00 and ends with the 0xFF byte. The envelope is in UTF-8 format.\n\nThere\
    \ are server-side implementations for web sockets that work with Python, Ruby,\
    \ Node.js, and Java, as well as other languages. The state of libraries for web\
    \ sockets is advancing, and there are packages in various states of development\
    \ for pretty all the major languages used in web development. In general, the\
    \ choice of a server-side web implementation will be dictated by the needs of\
