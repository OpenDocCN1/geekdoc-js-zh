    \ this approach with a few smaller functions allows you to take an array and create\
    \ a set of operations on it that can build an algebra of arrays. This in turn\
    \ lets build up a very robust set of operations from a basic set of operations.\n\
    \nThe first of the array methods is `map()`, which takes an array and a method\
    \ as arguments. It applies the method to each element of the array and creates\
    \ a new array from the return values. Given an array of numbers, it would be possible\
    \ to create an array of squares of each number by applying a square function in\
