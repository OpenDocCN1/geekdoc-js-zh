    ## Web Worker Use Cases


    The types of applications traditionally run on the Web, and the limitations of
    the browser environment limited the computational needs that would call for a
    Web Worker. Until recently, most web applications manipulated small amounts of
    data consisting mostly of text and images. In these cases, a Web Worker type of
    construct is of limited use. Now JavaScript is asked to do a lot, and many common
    can benefit from spawning new tasks.


    ## Graphics


    The HTML `<svg>` and `<canvas>` tags allow JavaScript to manipulate images, potentially
    a computationally heavy task. Although web browsers have been able to display
    since the release of the Mosaic browser around 1993, the browsers couldn''t manipulate
    those images. In the `<img>` tag, all the browser could substitute a different
    image by changing the `src` attribute, or change the displayed size of the image.
    However, the browser had no way of knowing what the image was or accessing the
    raw data.


    The recently added `<canvas>` tag makes it possible to import an image into a
    canvas and export the raw data back into JavaScript for processing, as long as
    the image was loaded from the same server as the page. It is also possible to
    export a frame from a video in the HTML5 `<video>` tag.


    Once the data has been extracted from a graphic, you can pass it to a worker for
    post-processing. This could be useful for doing from cleaning up an image to doing
    a Fourier transform on a scientific data set. Canvas makes it possible to build
    complex image editing through various filters in JavaScript, which should often
    use Web Workers for better performance.

