    图像中的每个元素都是 DOM 元素。因此，可以在 SVG 中创建一个圆，并为它附加 JavaScript 事件处理程序。SVG 中的元素也可以作为 DOM
    的一部分进行操作；可以直接使用 DOM 或 jQuery 添加、删除或更改元素。SVG 元素也可以像任何其他 HTML 元素一样使用 CSS 设置样式。其他书籍深入探讨了
    SVG，包括 Kurt Cagle 编写的《HTML5 Graphics with SVG & CSS3》（O''Reilly 出）。


    Canvas 最初由 Apple 创建用于用于 OS X，然后移动到 Safari；现在它已经进入了大多数其他浏览器。Canvas 提供了一个 2D 绘制表面，代码可以在上面渲染图像。这在
    [Web Worker Fractal Example](第 90 页) 中被用于绘制曼德尔集合，但它的完整威力远比这大。关于详细介绍，请参见 Steve
    Fulton 和 Jeff Fulton 编写的《HTML5 Canvas》。


    除了 2D 之外，WebGL 上的 3D canvas 已经在许多浏览器中开始实现。演示和教程，请查看 http://www.html5rocks.com/en/tutorials/three/intro/
    的 HTML5 Rocks 教程。


    ## 地理定位


    根据定义，万网是全球性的，但上面有很多本地内容。如果我正在寻找披萨店，我可能想要我所在地的地方。地理定位允许浏览器通过几种机制之一确定用户的位置。如果可用
    GPS（所有智能手机上都有），它将使用它来获取可能精确到几米的位置。如果没有 GPS 访问，浏览器可以使用手机基站或 WiFi 枢纽的信息；这些方法可能不准确，但通常足够。如果目标是找到当地的披萨店，知道几个街区的位置可能就足够了。在大多数情况下，Geolocation
    API 将要求用户批准请求。


    要获取用户的位置，调用 `getCurrentPosition()` 方法并带有两个回调函数，一个用于成功定位，一个用于错误。如果浏览器能够找到用户的位置，它将返回纬度和经度，如果能计算出来还有高度，以及一个精度参数。如果发生错误，它将返回几种错误条件之一：


    ```

    navigator.geolocation.getCurrentPosition(userLocationCallback, errorCallback);

    ```


    ## 新 CSS


    除了 JavaScript 接口和新的 HTML 标签外，HTML5 还增加了 `:nth-child()` 和 `:first-child`，以及 CSS
    否定运算符 `:not()`，它可以像 `:not(.box)` 一样使用。这些应该允许开发者对应用程序的呈现有更多的控制。


    除了选择器外，HTML5 在 CSS 中包含了对网络字体的支持。现在可以在 CSS 中定义新字体，并在 CSS 中包含 TrueType 字体以获得特定的外观。


    HTML5 CSS 还包含了一些非常酷的功能。可以对文本溢出进行更具体的设置，设置 DOM 中对象的透明度，设置文本描边，通过 HSL 指定颜色，等许多功能。当然，HTML5
    中的其他所有内容中，并非所有这些功能在所有浏览器中都受到支持。


    ## 附录 你应该知道的 JavaScript 工具


    JavaScript 在许多方面是一门年轻的语言。尽管它已经存在了大约 15 年，但最近才被用于大型项目。因此，帮助程序员进行健壮、可调试编程的工具仍然存在。


    ### ESLint


    ESLint 是一个静态分析工具，它可以帮助你发现 JavaScript 中的错误。它非常流行，在许多现代 JavaScript 项目中使用 ESLint。


    ### JSLint


    JSLint 是一个 JavaScript 代码检查器，它可以帮助你发现代码中的问题。虽然它不如 ESLint 流行，但仍然在使用。你可以在编辑器中集成 ESLint
    或 JSLint。


    如果你使用 JSLint，它它可以发现许多 JavaScript 的问题。要理解这一点，请阅读 Crockford 编写的《JavaScript: The
    Good Parts》。这本书详细描述了 ESLint 所做的选择。


    为了根据文件配置 JSLint，可以在文件顶部添加注释。这些注释可以在文件中开启或关闭选项。


    示例 A-1. JSLint 包装器


    ```bash

    #!/bin/bash


    java -jar ~/bin/rhino/js.jar ~/bin/jslint.js

    ```


    ### JSMin


    JSMin 是一个将 JavaScript 代码压缩的工具。对于以源代码形式下载到用户的程序来说，这可以通过压缩更快地完成。运行 JSMin 后，文件大小通常只有原始大小的
    30%。这意味着传输到客户端的字节更少。


    JSMin 是一个单向过程，所以确保你有文件的备份。它也不不应该在开发中使用，因为它会让调试变得非常困难。在运行 JSMin 之前，确保运行了 JSLint。


    ### JSBeautifier


    如果你的 JavaScript 代码变得混乱，JSBeautifier 是一个很好的工具。它接收 JavaScript 文件并根据基本规则对其进行重新格式化。你可以在网站上或通过桌面
    Rhino 运行它。书中所有的 JavaScript 代码都是使用此工具格式化的。


    JSBeautifier 可以接受许多命令行选项来指定缩进和括号样式。缩进可以是制表符或空格。i 选项控制缩进级别。


    JSBeautifier 还可以格式化 JSON 字符串。由于是用 JavaScript 编写，你可以将其嵌入任何 JavaScript 程序中。如果你需要向用户显示
    JSON 结构，可以使用此库对其进行格式化打印（参见示例 A-2）。


    # 示例 A-2. JavaScript 格式化打印


    ```bash

    #!/bin/bash


    cp $1.bak

    export WORKING_DIR=`pwd''

    cd ~/bin/js-beautify


    java -jar ~/bin/rhino/js.jar beautify-cl.js -d ~/bin/js-beautify \

    -i 1 -b -p $WORKING_DIR/$1 > /tmp/$1


    m /tmp/$1 $WORKING_DIR/$1

    ```


    ## Emacs JS2 mode


    JS2 mode 是一个非常友好的 JavaScript 编辑框架。对于那些已经在使用 Emacs 的人，这非常有帮助。


    ## Aptana


    对于那些希望有一个完整的 IDE 来开发 JavaScript 的人，Aptana 是一个很好的选择。Aptana 是为 JavaScript 定制的 Eclipse
    版本。它有很多可以自定义的选项。


