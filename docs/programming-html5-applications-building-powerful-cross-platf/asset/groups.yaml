    # Debugging Manifest Files


    Manifest files provide a particular debugging challenge. They can be the source
    of several special classes of bugs.


    The first and most obvious bug is to include missing files in the manifest. If
    a file is included in the page and it is not in the manifest, it will not be loaded
    by the page, in the same way a missing file on the server will not be downloaded.


    Many Selenium tests will not explicitly test for correct styles and the presence
    of images, so it is possible that an application CSS file or image will still
    work to the extent that it is normally tested in Selenium. In an application that
    includes resources from outside web servers, those must also be whitelisted in
    the manifest file.


    A further complication comes in some browsers, including Firefox, that make the
    manifest an opt-feature. So a Selenium test may not opt into, which would make
    the entire test moot. In order to test this in Firefox, it will be necessary to
    set up a Firefox profile in which the application cache is by default. To do this:


    - 1. Quit Firefox completely.

    - 2. Start up Firefox from a command line with the `profileManager` switch. This
    will result in a dialog similar to that shown in Figure 7-2. Save the custom profile.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_92_0.png)


    Figure 7-2. Firefox custom profile dialog


    - 3. Restart Firefox. Go to the Firefox Options menu, select the Advanced tab
    and under that the Network tab (see Figure 7-3), and turn off the "Tell me when
    a website asks to store data for offline use" option.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_93_0.png)


    Figure 7-3. Firefox Options


    Now, when starting up the Selenium RC server, use an option like this:


    ```

    java -jar selenium-server.jar -firefoxProfileTemplate

    ```


    For full details on Firefox profiles, http://support.mozilla.com/en-US/kb/Managing-profiles.


    A second class of problems can occur when the manifest is updated and the browser
    does not reflect the update. Normally, it will take a minute or two after loading
    a page for the browser to update the file cache, and the browser will not check
    the cache until the page is loaded. So if the server is updated, the browser will
    not have the new version until the user visits the page. This can cause problems
    if there has an update on the server that will cause the application in the browser
    to fail, such as a change in the format of how data is sent between the client
    and server.


    When the user visits the page (assuming course that the server is online), the
    browser will fetch the manifest file from the server. However, if the manifest
    file has a cache control header set on it, the browser may not check for a new
    version of the manifest. For example, if the file has a header that says the browser
    should check for updates only once a year (as is sometimes common on web servers),
    the browser will not reload the manifest file. So it is very important to ensure
    that the manifest file itself is not cached by the browser, or if it is cached
    it is done only via an ETag.


    The browser can always prevent caching of the manifest file by giving the URL
    with a query string attached, as in cache.manifest?load=1. If the manifest file
    is a static text file, the query string will be ignored, but the browser will
    not know that and will force the server to send a fresh copy.


    Different web browsers, and even different versions of a single browser, may update
    the manifest file somewhat differently. So it is very important to test any application
    using a manifest file very carefully across different browsers and browser versions.


    # CHAPTER 8

    ## Splitting Up Work Through Web Workers


    JavaScript has, since its inception, run in a single thread. With small applications
    this was practical, but it runs up against certain limits now, with larger and
    larger applications loaded into browsers. As more and more JavaScript is run,
    the application will start to block, waiting for code to finish.


    JavaScript runs code from an event loop that takes events off a queue of all the
    events that have happened in the browser. Whenever the JavaScript runtime is idle,
    it takes the first event off the queue and runs the handler that goes with that
    event (see Figure 8-1). As long as those handlers run quickly, this makes for
    a responsive user experience.


