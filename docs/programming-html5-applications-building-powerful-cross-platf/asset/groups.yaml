    # Libraries for Web Workers


    When programming JavaScript in the main thread, programmers use a library such
    as jQuery to improve the API and hide differences between browsers. For use with
    Web Workers, there is a jQuery extension called jQuery Hive that provides much
    of this functionality. Hive includes the PollenJS library in the main JavaScript
    thread. The library includes interfaces to create workers.


    Hive also encode and decode messages between the main thread and worker if needed.
    In some browsers (notably Firefox), complex data can be sent over the postMessage()
    interface. However, in some versions of Chrome and Safari, postMessage() will
    handle only a string or other simple data.


    Hive also includes a subset of the jQuery API in the worker itself. The most important
    methods in the Hive API are $.get() and $.post(), which mirror the APIs in jQuery.
    If a worker needs to access the server via Ajax, for instance, using Hive will
    make your life much easier.


    Hive also includes access to a persistent storage interface via $.storage. To
    set a value, use $.storage(name, value). Calling $.storage(name) without the second
    value parameter will return the existing value, if set.


    Also included in Hive are $.decode() and $.encode(), which can be used to decode
    or encode JSON messages.'
