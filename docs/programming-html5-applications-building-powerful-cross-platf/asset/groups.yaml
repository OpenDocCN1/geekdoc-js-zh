    \ the inner function well as the outer function.\n\nClosures are often useful\
    \ for constructing callbacks. A closure should be used whenever a second function\
    \ will run as a response to some event but needs to know what has happened before.\n\
    \nThis is often useful when building a function generator, each time the generator\
    \ runs it will have a different outer state, which is encapsulated with the created\
    \ function. It is also possible to create more than one function in a generator,\
    \ all of which are closed onto the same environment.\n\nClosures are one of the\
    \ most powerful features in JavaScript. In a simple case, a closure can be used\
    \ to create functions that can access the variables of any scope to allow callbacks\
    \ to access data from the controlling function. However, even more powerful is\
    \ the ability to create custom functions that bind variables into a scope.\n\n\
    In Example 2-5, a DOM element or CSS selector el is wrapped in a function to allow\
    \ the HTML content to be set with a simple function call. The outer function (factory)\
    \ binds the el to a lexical variable that is used by the inner function to set\
    \ the result of the example is to set the *updateElement* returns the inner function\
    \ as its return value. function, with el already bound to a CSS selector. When\
    \ a program calls *factory* with a CSS selector, it returns a function that can\
    \ be used to set the HTML of the relevant HTML element.\n\nExample 2-5. Basic\
    \ closure\n\n```\nvar factory = function factory (el)\n{\n  return function set(html)\n\
    {\n    $(el).html(html);\n  };\n}\n```\n\nIt is also possible to create several\
    \ functions that are closed on one scope. If a function returns several functions\
    \ in an object or array, all of those functions will have access to the internal\
    \ variables of the creating function."
  - "[PAGE 23]\n\nExample 2-6 adds to the browser's toolbar the buttons defined in\
    \ the tools array. Each of the buttons gets its own handler, named clickHandler.\
    \ This function has access to the calling function's variables, and embeds the\
    \ button and tools variables into its operations. You can easily update the application\
    \ by adding or subtracting an element from the tools array, and the button with\
    \ all the defined functionality will appear or disappear.\n\n# Example 2-6. Closure\
    \ in a button\n\n```\n$('.document').ready(function Ready() {\n  var button, tools;\n\
    \  tools = ['save', 'add', 'delete'];\n  console.info($`div#toolbar`);\n  tools.forEach(function\
    \ (tool) {\n    console.info(tool, button);\n    var button = $(`<button>`).text(tool).attr({\n\
    \      css: 'tool'\n    }).appendTo(`div#toolbar`);\n    button.click(function\
    \ clickHandler() {\n      console.info(tool, button);\n      alert(\"User clicked\
    \ \" + tool);\n    });\n  });\n});\",\n```\n\nWhen using closures, it is hard\
    \ to know which variables are or are not in the scope of a function. However,\
    \ both Google Chrome's DevTools and Firebug show the list of closed variables.\n\
    \nIn Firebug, the scope can be seen in the Script tab by looking under \"Watch\"\
    . Under all the variables of the current scope will be a ladder of the scopes\
    \ going up to the main \"window\" object.\n\nIn DevTools, for example, when the\
    \ code is halted in the debugger, a subsection called \"closure\" in the right-hand\
    \ column under Scope Variables will show the closed variables for the current\
    \ function (see Figure 2-1). In this case, it shows that we have clicked on the\
    \ \"delete\" button and lists the reference to the jQuery object for the button\
    \ itself."
  - '[PAGE 24]


    # Functional Programming


    Functional programming is a methodology that is more commonly associated with
    languages like Lisp, Spac, Erlang, F#, or Haskell, but works quite well in JavaScript
    also. Functional programming rests on a couple of basic assumptions:


    +   - Functions are first-class citizens of the language and can be used where
    any other value can be used.

    - Complex behavior can be built by composition of simple functions.

    - Functions return values. In many cases, a given function will always return
    the same value for the same inputs.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_24_0.png)


    Figure 2-1. Closures in Chrome''s DevTools'
  - "[PAGE 25]\n\nIn mathematics, functions do not have side effects. Take a classical\
    \ mathematical function like y = sin(x). It just returns a value that y can store,\
    \ but does not change x or anything in the global state of the program. By ensuring\
    \ that functions are \"pure\" (have no side effects), this practice enables the\
    \ function to be called from anywhere in the program without causing strange to\
    \ happen. The problem with side effects is that they can cause dependencies that\
    \ can be very hard to track down. If calling a method can cause data to be corrupted\
    \ elsewhere, it greatly increases the potential for bugs that will be very difficult\
    \ to find.\n\nJavaScript functions can have side effects, and there is no built-in\
    \ way to prevent functions from having side effects. In addition, JavaScript functions\
    \ do not return value unless the return statement has been explicitly invoked\
    \ to return a value. In the absence of a return statement, the function will return\
    \ undefined.\n\nWhen employing functional programming, the programmer often falls\
    \ into the pattern of using many very functions, with only two or three lines\
    \ of code, to accomplish a goal. This can be a very good design technique, as\
    \ short functions are, in general, easier to make correct and to test.\n\nIt is\
    \ often the case that complex behavior can be built up from simple functions by\
    \ composition. A chain of functions can be built from simple functions, in which\
    \ each function returns this, allowing the next function to be called. The last\
    \ function in the chain can return **this.**\n\nThe jQuery library uses function\
    \ changes such as in Example 2-7. In this example, jQuery finds a DOM item, sets\
    \ its text, fades it into view, and then sets a click handler on it that will\
    \ hide with a second DOM chain.\n\nExample 2-7. Choosing functions with a closure\n\
    \n```\n$('#div.alert').text(\"Message\").fadein(\n2000).click(\nfunction() {\n\
    \  $(this).fadeout(2000);\n}););\n```\n\nOne very powerful pattern of functional\
    \ programming is the *higher-order function*. A higher-order function takes a\
    \ function as an argument to abstract specific behavior while leaving the generic\
    \ behavior in the outer function.\n\nA example of a higher-order function is the\
    \ Array map function (see \"Array Iteration Operations\" on page 22). It takes\
    \ an array and returns a new array that is the result of applying the passed function\
    \ to each element in the array. This model can be applied to a wide range of circumstances\
    \ beyond just manipulation. As a general pattern, the higher-order function can\
    \ be used wherever a generic behavior needs a few specific modifications."
- md: "\nThe jQuery library's interface tends to favor functional programming. This\
    \ interface is particularly apt for selecting a set of DOM nodes from the page\
    \ and then providing a functional interface to interact with those nodes.\n\n\
    In addition, most of the methods of jQuery return a value so that they can be\
    \ chained. For example, to find all images wider than a size in a page, one could\
    \ select all the images in the page, filter out all that are smaller than 300\
    \ pixels, and scale all those that are left in the list.\n\nExample 2-8 does exactly\
    \ that. It selects all the images in a document (anything with an img tag), uses\
    \ the filter to determine which ones has a width greater than 300 pixels (maxWidth),\
    \ and scales them. By making the filter and scale functions very simple, you can\
    \ be more confident that the code will work as intended.\n\nExample 2-8. Scaling\
    \ images\n\n```javascript\nvar scaleImages = (function maxWidth) {\n  return function\
    \ () {\n    $('img').filter(function () {\n      return $(this).width() > maxWidth;\n\
    \    }).each(function () {\n      $(this).width(maxWidth);\n    });\n  };\n}(300);\n\
    ```\n\nWhen processing a list of operations in a time-consuming procedure, such\
    \ as in an Ajax call, it is sometimes not practical to send the entire list to\
    \ the server in one request. For example, it may be that sending the entire list\
    \ will cause the server to time out.\n\nIn this case, to iterate the list, it\
    \ is useful to think of the list as a head and tail. Take the first element off\
    \ the list (or the first few elements) and then, process the rest of the list\
    \ by use of recursion until the list is empty (Example 2-9).\n\nI have used this\
    \ strategy when adding data to a REST interface. Each call to the interface takes\
    \ on average about one second, so it is not practical to call it 500 times for\
    \ one Ajax call. In this case, I used to process the list by recursion.\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_26_0.png)\n\
    \nWhat's with the entire Ajax XOR terminology? The JavaScript object is called\
    \ XMLHttpRequest, which is abbreviated XOR. Ajax derives from the term Asynchronous\
    \ JavaScript and XML, which was coined by Jesse Garrett. Actually, in many cases,\
    \ the data being sent over the network is not XML but may be JSON or other data.\n\
    \n# Example 2-9. List recursion\n\n```javascript\nfunction iterateAjax(tasks)\
    \ {\n  function iterator(tasks) {\n    $.ajax({\n      url: 'index.php',\n   \
    \   data: tasks[0],\n      success: function(data, status, XMLHttpRequest) {\n\
    \        if (tasks.length > 0) {\n          // Do something with the results\n\
    \          iterator(tasks.slice(1));\n        }\n      }\n    });\n  }\n  iterator(tasks);\n\
    }\n```\n\nAlthough building an entire single-page web application with only functional\
    \ programming styles would not be practical, functional programming still provides\
    \ many useful ideas that should not be ignored. Functional programming is very\
    \ well suited, for, for use with Web Workers (see Chapter 8).\n\nNot a lot written\
    \ about functional programming in JavaScript, but there is quite a lot in other\
    \ languages that can be applied to JavaScript. For more functional programming,\
    \ see these books:\n\n- *Real World Haskell by Bryan O’Sullivan, John Goerzen,\
    \ and Donald Bruce Stewart (O'Reilly)*\n- *Programming Scala by Dean Wampler and\
    \ Alex Payne (O'Reilly)*\n- *Structure and Interpretation of Computer Programs\
    \ by Harold Abelson and Gerald Sussman (MIT Press)*\n\n# Prototypes and How to\
    \ Expand Objects\n\nEverything in JavaScript can have methods attached to it.\
    \ Every element has some basic methods that can be used by the programmer to enhance\
    \ its usefulness. JavaScript primitives such as Booleans, strings, and numbers\
    \ have a second life as objects. The transformation from primitive to object is\
    \ transparent, so it is possible to apply these methods to a primitive. Actually,\
    \ what happens is that a simple value—for example, a string—will be converted\
    \ to an object, and then converted back if needed.\n\nStrings offer a large number\
    \ of methods that can be called to manipulate them. A few will modify the string\
    \ in place, but most will return a new string. A full list can be found on the\
    \ Mozilla Developer Network website, but here are a few highlights:\n\n```\nstring.indexOf()\n\
    Returns the first index of a substring in a string, or –1 if not found\n```\n\n\
    ```\nstring.lastIndexOf()\nSame as indexOf(), starting at the end\n```\n\n```\n\
    string.match()\nMatches a regular expression in a string\n```\n\n```\nstring.replace()\n\
    Replaces a regular expression (specified as a function or string) with a new string\n\
    ```\n\n```\nstring.split()\nSplits a string into an array of substrings\n```\n\
    \n```\nstring.slice()\nExtracts a substring\n```\n\nHowever, there may come a\
    \ time when the predefined methods are not enough and some custom functionality\
    \ is required. In this case, JavaScript provides an unusual and very powerful\
    \ feature, to extend a built-in object. Although you can always assign a method\
    \ to a JavaScript object with a simple assignment, that is not always the best\
    \ way to do it. If you want to add a method to every string, you can attach it\
    \ to the String.prototype object. In the JavaScript object system, each object\
    \ inherits from a chain of prototypes, so by adding methods somewhere in that\
    \ chain you can add to an entire type of object.\n\nHere is an example to illustrate\
    \ the concept. The goal is to create a new method populate that substitutes values\
    \ into a template. The template is:\n\n```javascript\nString.prototype.populate\
    \ = function(params) {\n  var str = this.replace(/(\\w+)/g, function(word) {\n\
    \    return params[word.substr(1)];\n  });\n  return str;\n}\n```\n\nUsed like\
    \ this:\n\n```javascript\n$('.target').html(\"Hello {name}\").populate({name:\
    \ \"Zach\"});\n```\n\nOf course, strings are not the only types of objects in\
    \ JavaScript that have prototypes. Numbers, arrays, objects, Booleans, and functions\
    \ do so well. Extending base types such as Object, Array, and on can sometimes\
    \ break libraries. The culprit is usually creating a property that already exists\
    \ on the object. Be sure that you are creating it before adding it, and test carefully.\n\
    \nIn truth, extending types in JavaScript is a practice that attracts a lot debate.\
    \ Some people say it should never be done. I think it is such a power tool that\
    \ cannot be ruled out.\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_29_0.png)\n\
    \nThe Number prototype works exactly the same way as for strings. So it is very\
    \ possible to define a new method to take care of any need that may be required.\
    \ If, for example, an application requires squaring numbers on a regular basis,\
    \ it would be easy to add the method, as shown in Example 2-11.\n\nExample 2-11.\
    \ Using Number.prototype\n\n```javascript\nNumber.prototype.square = function\
    \ square() {\n  return this * this;\n}\n6.square(); // 36\n```\n\n# Expanding\
    \ Functions with Prototypes\n\nIn addition to data objects as strings and arrays,\
    \ functions also have a prototype. This can be used to create composite functions\
    \ that are very powerful. By combining simple functions into larger units, using\
    \ the Function.prototype to add methods to the Function object, you can pull apart\
    \ complex logic into much simpler cases. In fact, many toolkits to do exactly\
    \ this and some methods to accomplish some of these tasks.\n\nOne example of prototyping,\
    \ which may increase the robustness of your code is to add error-checking before\
    \ executing a function. The code in Example 2-12, a cube function runs without\
    \ checking that its input is a number. The code wraps the function in an interceptor\
    \ that does the check. Whenever cube is subsequently called, the interceptor runs\
    \ first, then lets the original cube if the input is a number.\n\n```javascript\n\
    Function.prototype.createInterceptor = function createInterceptor(fn) {\n  var\
    \ scope = {};\n  return function() {\n    if (fn.apply(scope, arguments)) {\n\
    \      return fn.apply(this, arguments);\n    }\n  }\n};\n\nvar cube = function(n)\
    \ {\n  return n * n * n;\n};\n\ncube = cube.createInterceptor(function(n) {\n\
    \  return typeof n === 'number';\n});\n\nconsole.log(cube(3)); // 27\nconsole.log(cube(\"\
    3\")); // undefined\n```\n"
  mdcn: "\n\njQuery 库的接口倾向于函数式编程。这种接口特别适用于从页面选择一组 DOM 节点，然后提供一个功能性接口与这些节点进行交互。\n\n\
    此外，jQuery 的大多数方法都会返回一个值，以便进行链式调用。例如，为了找到页面中所有宽度大于指定尺寸图像，可以选择页面上的所有图像，过滤掉所有小于 300\
    \ 像素的图像，并对列表中剩余的所有进行缩放。\n\n示例 2-8 正是这样做的。它选择了文档中所有的图像（任何带有 `img` 标签的内容），使用 `filter`\
    \ 确定哪些的宽度大于 300 像素（maxWidth），并对它们进行缩放。通过让 `filter` 和 `scale` 函数非常简单，你可以更有信心的代码会按预期运行。\n\
    \n示例 2-8 缩放图像\n\n```javascript\nvar scaleImages = (function maxWidth) {\n  return\
    \ function () {\n    $('img').filter(function () {\n      return $(this).width()\
    \ > maxWidth;\n    }).each(function () {\n      $(this).width(maxWidth);\n   \
    \ });\n  };\n}(300);\n```\n\n在处理耗时过程中的操作列表时（例如在 Ajax 调用中），有时在一次请求中将整个列表发送到服务器是不切行的。例如，发送整个列表可能会导致服务器超时。\n\
    \n在这种情况下，为了遍历列表，将列表考虑为头部和尾部是有用的。从列表中取出第一个元素（或前几个元素），然后通过递归处理列表的其余部分，直到列表为空（示例\
    \ 2-9）。\n\n我在向 REST 接口添加数据时使用过这种策略。每次接口调用平均大约需要一秒钟，因此在一个 Ajax 调用中调用它 500 次是不切行的。在这种情况下，我通常使用递归来处理列表。\n\
    \n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_26_0.png)\n\n整个 Ajax XOR 术语是怎么回事？JavaScript\
    \ 对象被称为 `XMLHttpRequest`，缩写为 XOR。Ajax 衍生于术语 Asynchronous JavaScript and XML（异步\
    \ JavaScript 和 XML），该术语由 Jesse Garrett 提出的。实际上，在很多情况下，通过网络发送的数据并不是 XML，而是 JSON\
    \ 或其他数据。\n\n# 示例 2-9 列表递归\n\n```javascript\nfunction iterateAjax(tasks) {\n  function\
    \ iterator(tasks) {\n    $.ajax({\n      url: 'index.php',\n      data: tasks[0],\n\
    \      success: function(data, status, XMLHttpRequest) {\n        if (tasks.length\
    \ > 0) {\n          // 对结果进行处理\n          iterator(tasks.slice(1));\n        }\n\
    \      }\n    });\n  }\n  iterator(tasks);\n}\n```\n\n虽然仅用函数式编程风格构建整个单页 Web 应用是不切行的，但函数式编程提供了许多不应忽视的有用想法。函数式编程非常适合用于\
    \ Web Workers（见第 8 章）。\n\n关于 JavaScript 中的函数式编程虽然不多，但在其他语言中有有很多可以应用于 JavaScript\
    \ 的。关于更多函数式编程，请参考这些书籍：\n\n- *Real World Haskell by Bryan O’Sullivan, John Goerzen,\
    \ and Donald Bruce Stewart (O'Reilly)*\n- *Programming Scala by Dean Wampler and\
    \ Alex Payne (O'Reilly)*\n- *Structure and Interpretation of Computer Programs\
    \ by Harold Abelson and Gerald Sussman (MIT Press)*\n\n# 原型以及如何扩展对象\n\nJavaScript\
    \ 中的一切都可以为其挂载方法。每个元素都有一些基本方法，程序员可以使用这些方法来增强其实用性。JavaScript 原生类型如布尔值、字符串和数字拥有作为对象的“第二次生命”。从原生类型到对象的转换是透明的，因此可以将这些方法应用到原生类型上。实际上，发生的情况是一个简单的值——例如一个字符串——会被转换为对象，然后在需要时转换回对象。\n\
    \n字符串提供了许多可以调用的方法来操作它们。其中一些方法会直接修改字符串，但大多数会返回一个新字符串。完整列表可以在 Mozilla Developer\
    \ Network 网站上找到，但这里有几个亮点：\n\n```\nstring.indexOf()\n返回字符串中子字符串的第一个索引，如果未找到则返回\
    \ -1\n```\n\n```\nstring.lastIndexOf()\n与 indexOf() 相同，但从末尾开始\n```\n\n```\nstring.match()\n\
    匹配字符串中的正则表达式\n```\n\n```\nstring.replace()\n用新字符串替换正则表达式（指定为函数或字符串）\n```\n\n```\n\
    string.split()\n将字符串拆分为子字符串数组\n```\n\n```\nstring.slice()\n提取子字符串\n```\n\n然而，可能会\
    \ way 预定义方法不再足够且需要某些自定义功能。在这种情况下，JavaScript 提供了一个不寻常且强大的功能：扩展内置对象。虽然你总是可以通过简单的赋值为\
    \ JavaScript 对象分配一个方法，但那并不总是最佳方法。如果你想为每个字符串添加一个方法，可以将其挂载到 `String.prototype` 对象上。在\
    \ JavaScript 对象系统中，每个对象都继承自一个原型链，因此通过在该原型链的某处添加方法，你可以为整种类型的对象添加方法。\n\n这里有一个示例来说明这个概念。目标是创建一个新方法\
    \ `populate`，将值替换到模板中。模板是：\n\n```javascript\nString.prototype.populate = function(params)\
    \ {\n  var str = this.replace(/(\\w+)/g, function(word) {\n    return params[word.substr(1)];\n\
    \  });\n  return str;\n}\n```\n\n使用方法如下：\n\n```javascript\n$('.target').html(\"\
    Hello {name}\").populate({name: \"Zach\"});\n```\n\n当然，字符串不是 JavaScript 中唯一具有原型的对象类型。数字、数组、对象、布尔值和函数也是如此。扩展基础类型如\
    \ `Object`、`Array` 等有时会破坏库。罪祸首通常是创建了对象上已经存在的属性。确保你在添加它之前已经创建了它，并进行仔细测试。\n\n事实上，在\
    \ JavaScript 中扩展类型是一项引起许多争议的实践。有些人认为永远不应该这样做。我认为它是一个如此强大的工具，不能将其排除。\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_29_0.png)\n\
    \n`Number` 原型的工作方式与字符串完全相同。因此，可以定义一个新方法来处理任何可能的需要。例如，如果应用程序经常需要对数字进行平方运算，添加该方法很容易，如示例\
    \ 2-11 所示。\n\n示例 2-11 使用 Number.prototype\n\n```javascript\nNumber.prototype.square\
    \ = function() {\n  return this * this;\n}\n6.square(); // 36\n```\n\n# 使用原型扩展函数\n\
    \n除了字符串和数组对象，函数也具有原型。这可以用于创建强大的复合函数。通过将简单函数组合成更大的单元，利用 `Function.prototype` 为\
    \ `Function` 对象添加方法，你可以将复杂的逻辑拆解为更简单的情况。事实上，有很多工具包可以完全实现这一点，并且有一些方法可以完成这些任务。\n\n\
    原型的一个示例是在执行函数之前添加错误检查，可能会增加代码的健壮性。示例 2-12 中的代码 `cube` 函数在运行时没有检查输入是否为数字。代码将函数封装在一个拦截器中进行检查。每当随后调用\
    \ `cube` 时，拦截器先运行，如果输入是数字，则执行原始的 `cube`。\n\n```javascript\nFunction.prototype.createInterceptor\
    \ = function createInterceptor(fn) {\n  var scope = {};\n  return function() {\n\
    \    if (fn.apply(scope, arguments)) {\n      return fn.apply(this, arguments);\n\
    \    }\n  }\n};\n\nvar cube = function(n) {\n  return n * n * n;\n};\n\ncube =\
    \ cube.createInterceptor(function(n) {\n  return typeof n === 'number';\n});\n\
    \nconsole.log(cube(3)); // 27\nconsole.log(cube(\"3\")); // undefined\n```\n"
