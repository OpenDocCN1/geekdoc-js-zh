    \  var newValue = prompt(\"Change Value of \" + key + \"?\", value);\n  if (newValue\
    \ != null) {\n    localStorage[key] = newValue;\n  }\n});\n\n)();\n```\n\n# Using\
    \ localStorage in ExtJS\n\nExtJS, some examples of which appeared in earlier chapters,\
    \ is a very popular JavaScript framework allowing very sophisticated interactions.\
    \ This section shows how to use localStorage with ExtJS.\n\nOne nice feature of\
    \ ExtJS is that many of its objects can remember their state. For example, the\
    \ ExtJS grid object allows the user to resize, hide and reorder columns, these\
    \ changes are remembered and reid when a user comes"
  - "[PAGE 65]\n\nto the application later. This allows each user to customize the\
    \ way the elements of an application work.\n\nExtJS provides an object to save,\
    \ but uses cookies to store the data. A complex application can create enough\
    \ state to exceed the size limits of cookies. An application with a few dozen\
    \ grids can overflow the size of a cookie, which can lock up the application.\
    \ So it would be nicer to use localStorage, taking advantage of its much larger\
    \ size and avoiding the overhead of sending the data to the server on every request.\n\
    \nSetting up a custom state provider object is, in fact, pretty easy. The provider\
    \ shown in Example 4-4 extends the generic provider object and must provide three\
    \ methods: set, clear, and get. These methods simply read and write the data into\
    \ the store. Example 4-4, I have chosen to index the data in the store with the\
    \ simple method of using the string state_ with the state ID of the element being\
    \ saved. This is a reasonable method.\n\n# Example 4-4. ExtJS local state provider\n\
    \n```\nExt.ux.LocalProvider = function() {\n    Ext.ux.LocalProvider.superclass.constructor.call(this);\n\
    }\n\nExt.extend(Ext.ux.LocalProvider,Ext.state.Provider, {\n    ****************************************************\n\
    \    set: function(name, value) {\n        if (typeof value == \"undefined\" ||\
    \ value === null) {\n            localStorage['state_' + name] = undefined;\n\
    \            return;\n        }\n        else {\n            localStorage['state_'\
    \ + name] = this.encodeValue(value);\n        }\n    },\n\n    ****************************************************\n\
    \    // private\n    clear: function(name) {\n        localStorage['state_' +\
    \ name] = undefined;\n    },\n\n    ****************************************************\n\
    \    get: function(name, defaultValue) {\n        return Ext.value(this.decodeValue(localStorage['state_'\
    \ + name]), defaultValue);\n    }\n});\n\n// set up the state handler\nExt.on.Ready(function\
    \ setUpState() {\n    var provider = new Ext.ux.LocalProvider();\n    Ext.state.Manager.setProvider(provider);\n\
    });\n```"
  - "[PAGE 66]\n\nIt would also be possible to have all the state in one large object\
    \ and to store it into one key in the store. This has the advantage of not creating\
    \ a large number of elements in the store, but makes the code more complex. In\
    \ addition, if two windows try to update the store, one could clobber the changes\
    \ made by the other. The local storage solution in this chapter offers no solution\
    \ to the issue of race conditions. In places where it can be a problem, it is\
    \ properly better to use IndexedDB or other solution.\n\n# Offline Loading with\
    \ a Data Store\n\nWhen some of the persistent data used in an application will\
    \ be relatively static, it can make sense to load it to local storage for faster\
    \ access. In this case, the Ext.data.Json Store object will need to be modified\
    \ so that its load() method will look for the data from the localStorage area,\
    \ Ext.data.JsonStore object shall call the server to check whether the data has\
    \ changed. By doing this, the application can make the data available to the user\
    \ right away at the cost of possibly short-term inconsistency. This can make a\
    \ user interface feel faster to reduce the amount of bandwidth that the application\
    \ uses.\n\nFor requests, the data will not have changed, so some form of ETag\
    \ for data makes a great deal of sense. The data is requested from the server\
    \ with an HTTP GET request and an If-None-Match header. If the server determines\
    \ that the data has not changed, it can send back a 304 Not Modified response.\
    \ If the data has changed, the server sends back the new data, and the application\
    \ loads it into both the Ext.data.Json Store and the sessionStorage object.\n\n\
    The Ext.data.PreloadStore object (see Example 4-6) stores data in the session\
    \ cache as one large JSON object (see Example 4-5). It wraps the data that the\
    \ server sends back in a JSON envelope, which allows it to store some metadata\
    \ with it. In this case, the ETag data is stored as well as when the data is loaded.\n\
    \nExample 4-5. Ext.data.PreloadStore offline data format\n\n```\n{\n  \"etag\"\
    : \"25f9e79423b45388b518f1b624dob\",\n  \"LoadDate\": \"26-Jan-2011\",\n  \"data\"\
    : {\n    \"root\": [\n      {\n        \"code\": \"us\",\n        \"name\": \"\
    United States\"\n      },\n      {\n        \"code\": \"ca\",\n        \"name\"\
    : \"Canada\"\n      }\n    ]\n  }\n}\n```"
- md: "\nWhen building an ETag make sure to use a good hash function. MD5 is probably\
    \ the best choice. SHA1 can also be used, but since it produces a longer string\
    \ it is probably not worthwhile. In theory, it is possible to get an MD5 collision,\
    \ but in practice it is probably not something to worry about cache control.\n\
    \nData in the localStorage object can be changed in Chrome the background. As\
    \ I already explained, the user can change the data from the Chrome Developer\
    \ Tools or from the Firebase command line. Or it can happen unexpectedly because\
    \ the user has two browsers open to the same application. It is important for\
    \ the store to listen for an update event from the localStorage object.\n\nMost\
    \ of the work is done in the beforeload event handler. This handler checks the\
    \ data store for a cached copy of the data, and if it is there, it reloads the\
    \ data as well, but will use the Function.defer() method to delay the load until\
    \ a time when the system has hopefully finished the web page so that the loading\
    \ will be less likely to interfere with the user.\n\nThe store.doConditional()\
    \ method makes an Ajax call to the server to load the data. It includes the If-None-Match\
    \ header so that, if the data has not changed, it will load the current data.\
    \ It also includes a force option that will cause the beforeload handler to activate\
    \ new data and not try to refresh the store from the localStorage cached version\
    \ of the object.\n\nI generally define constants for SECOND, MINUTE, and HOUR\
    \ simply to make the code more readable.\n\nExample 4-6. Ext.data.PreloadStore\n\
    \n```javascript\nExt.extend(Ext.data.PreloadStore, Ext.data.JsonStore, {\n  indexKey:\
    \ '',\n});\n\n//default index key\nloadDefer: Time.MINUTE,\n// how to defer loading\
    \ the data\nlisteners: {\n  function load(store, records, options) {\n    var\
    \ etag = this.reader.etag;\n    var jsonData = this.reader.jsonData;\n    var\
    \ data = {\n      etag: etag,\n      date: new Date(),\n      data: jsonData\n\
    \    };\n    sessionStorage[store.indexKey] = Ext.encode(data);\n  }\n});\n```\n\
    \n```javascript\nbeforeLoad: function beforeLoad(store, options)\n{\n  var data\
    \ = sessionStorage[store.indexKey];\n  if (data === undefined || options.force)\n\
    \  {\n    return true; // Cache miss, load from server\n  }\n  var raw = Ext.decode(data);\n\
    \  store.loadData(raw.data);\n  // Defer reloading the data until later\n  store.doConditionload.defer(store.loadDefer,\
    \ store, [raw.etag]);\n  return false;\n},\n\ndoConditionload: function doConditionload(etag)\n\
    {\n  this.proxy.headers[\"If-None-Match\"] = etag;\n  this.load({\n  force: true\n\
    \  });\n\nforceload: function ()\n{\n  // Pass in a bogus ETag to force a load\n\
    \  this.doConditionload('');\n});\n```\n\n## Storing Changes for a Later Server\
    \ Sync\n\nIn the event that an application may be used offline, or on a flaky\
    \ connection to the Internet, it can be nice to provide the user a way to save\
    \ her changes without actually needing the network to be present. To do this,\
    \ write the changes in each record to a queue in the localStorage object. When\
    \ the browser is online, the queue can be pushed to the server. This is similar\
    \ to a transaction log as used in a database.\n\nA save queue could look like\
    \ Example 4-7. Each record in the queue represents an action to take on the server.\
    \ The exact format will of be determined by the needs of a specific application.\n\
    \nExample 4-7. Save queue data\n\n```json\n{\n  \"url\": \"index.php\",\n  \"\
    params\": {}\n},\n{\n  \"url\": \"index.php\",\n  \"params\": {}\n}\n```\n\n```json\n\
    {\n  \"url\": \"/index.php\",\n  \"params\": {}\n}\n```\n\nOnce the web browser\
    \ is online, it will be necessary to process the items in the queue. Example 4-8\
    \ takes the queue and sends the first element to the server. If that request is\
    \ a success, it will take the next element and continue walking the queue until\
    \ the queue has been sent. Even if the queue is long, this process will execute\
    \ with minimal effort on the user because Ajax processes each item in an asynchronous\
    \ manner. To reduce the number of Ajax calls, it would also be possible to change\
    \ this code to send the queue items in groups of, say, five at a time.\n\nExample\
    \ 4-8. Save queue\n\n```javascript\nvar save = function (queue) {\n  if (queue.length\
    \ > 0) {\n    $.ajax({\n      url: queue[0].url,\n      data: queue[0].params,\n\
    \      success: function (data, status) {\n        queue.shift();\n        save(queue);\n\
    \      }\n    });\n  }\n}\n```\n\n## Storing Changes for a Later Server Sync\n\
