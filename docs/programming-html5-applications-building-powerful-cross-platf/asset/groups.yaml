    ## Files\n\nFor obvious reasons, the browser has historically had very limited\
    \ ability to access the filesystem. HTML forms have been able to upload files,\
    \ and certain HTTP headers make it possible for a user to download files from\
    \ the server. But outside of those specific features, the browser has not been\
    \ able to access files on the local filesystem. In general this is a good thing.\
    \ I don't want every web page I visit to be able to look around my hard drive!\n\
    \nSome of the new features of HTML5 give the browser limited access to the files\
    \ via the existing form input. Historically, a browser could upload a file from\
    \ a form, but now it is possible to use the data from the file directly in JavaScript.\
    \ In addition, the browser now lets you drag files from your web application.\
    \ Google's Gmail uses this feature to allow the user to attach files. This had\
    \ been done with Flash, but now can be done with just JavaScript.\n\nThis does\
    \ not create any new security problems, because the application already had access\
    \ to this data by uploading it to the server, downloading it again into the browser.\n\
    \nAs of this writing, these features are supported in Firefox, Chrome, and Opera.\
    \ For Safari and Internet Explorer, the Flash plug-in will work to allow file\
    \ drag-and-drop.\n\n# Blobs\n\nJavaScript has always been good at working with\
    \ strings and numbers, but binary data has never been its strong point. Recently,\
    \ however, it added a blob data type and interfaces to work with blobs (binary\
    \ large objects). JavaScript sees a blob as a chunk of raw data. The amount of\
    \ actual manipulation that JavaScript can do on a blob is somewhat limited. However,\
    \ blobs are very important for moving binary data around. Blobs can be read and\
    \ written to files (“Working with Files” on page 69), used as URLs, saved in IndexedDB\
    \ (see Chapter 5), and passed to and from a Web Worker (see Chapter 8).\n\nYou\
    \ can create a new blob with the BlobBuilder interface. This creates a basic empty\
    \ BlobBuilder, which is possible to append a string, an existing blob, or binary\
    \ data from an ArrayBuffer. The BlobBuilder.getBlob() method returns the actual\
    \ blob.\n\nBlobBuilder is called MozBlobBuilder in Firefox, as of version 6, and\
    \ WebKitBlob Builder in Safari Night kids and Chrome as of version 8.\n\nIn Example\
    \ 6-1, PNG data is passed to a BlobBuilder object to create a blob that is then\
    \ turned into a URL. The URL object can be set the src attribute of an image tag\
    \ to display the DOM.\n\nExample 6-1. Creating a blob from raw data\n\n```javascript\n\
