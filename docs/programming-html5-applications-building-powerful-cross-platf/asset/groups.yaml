    在过去的几年里，测试驱动开发在软件开发中变得非常流行。通过创建自动化且可重复的测试，开发者可以相信代码是高质量的，并且更改不会破坏旧功能。一些支持者声称测试应该在被测试的代码之前编写。\n\
    \n拥有一可靠的测试集是任何软件开发工作中至关重要的部分。它让开发者有信心代码在编写后可以运行，并且会随着时间的推移继续工作。\n\n在大多数服务器端开发平台中，测试是开发的一个关键元素。在\
    \ PHP、Java、Ruby 等环境中可以找到健壮的测试框架。然而，大多数这些语言的标准测试方法对于 JavaScript 并不适用。让我们来看看其中的原因。\n\
    \n服务器端测试套件通常必须在一组环境中测试程序。如果使用 Python 构建 REST 服务，测试人员可以根据几个安全假设来构建测试。例如，他可能知道它将在\
