    \ [Selenium Location Options](page 36).\n\nUsing the ID will not work in ExtJS,\
    \ as ExtJS assigns IDs to elements that will change each time. Use CSS classes\
    \ or other properties of the HTML element. To denote buttons, it is often useful\
    \ to use the text of the button with XPath, like //button[text='Save']. It is\
    \ also possible to select on an attribute, like //img[@src='img.png'].\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_47_0.png)\n\
    \n# Selenium Location Options\n\nSelenium offers six ways to address elements\
    \ on the web page. Using the correct addressing scheme will ease development of\
    \ tests:\n\n- ID\n  Supply an HTML ID:\n  `id`\n\n- Name\n  Supply an element\
    \ name (useful for form inputs):\n  `name=username`\n\n- XPath\n  Use XPath to\
    \ find an element:\n  `//form[@id='loginForm']/input[1]`\n\n- CSS\n  Find an element\
    \ by a CSS Selector, a procedure that's familiar to users of jQuery. However,\
    \ the CSS selector engine in Selenium is more limited than jQuery:\n  `div.x-btn-text`\n\
    \n- Document\n  Use the DOM to find an element:\n  `document.getElementById('loginForm')`\n\
    \n- Link text\n  Find the text in the href attribute (useful for HTML links):\n\
    \  `link='Continue'`\n\nThe Selenium base commands do not include any capability\
    \ for conditionals or loops. A Selenium HTML file runs sequentially from top to\
    \ bottom, when an assertion fails or when the last command is executed. If you\
    \ need flow control, use the goto_sel_id.js plug-in.\n\nThis plug-in can be useful\
    \ when looking for memory leaks or other problems that may occur in an application\
    \ that runs for a long time. JavaScript still has a way to escape from the memory\
    \ leaks that were not an issue when page reloads were frequent, resetting the\
    \ JavaScript state to the DOM.\n\nA large number of commands in Selenium can be\
    \ used to construct tests. The Selenium IDE contains a reference for commands,\
    \ so once you have learned some of the basics, you can easily figure out the command\
    \ for any given circumstance. Table 3-1 shows some of the common Selenium commands.\
    \ They tend to come in two basic groups, actions and assertions. Actions include\
    \ such as click, type, dblclick, keydown,keyup and more. Assertions perform the\
    \ actual tests allow Selenium to find out how user actions affect the page. Assertions\
    \ can pause a script but make no changes in the page.\n\n# Table 3-1. Selenium\
    \ commands\n\n| Command | Target | Action |\n|---|---|---|\n| open | Web page\
    \ to open | Opens a web page. |\n| dblclick | Element to double-click | Double-clicks\
    \ an element. |\n| click | Element to click | Clicks an element. |\n| mouseOver\
    \ | Element over which to move the mouse | Replicates a mouseOver event. |\n|\
    \ mouseUp | Element over which to let up the mouse button | Replicates a mouseUp\
    \ event. |\n| mouseDown | Element on which to press the mouse button down | Replicates\
    \ a mouseDown event. |\n| type | An XPath or other kind of selector to choose\
    \ the element; the third column is the text to type | Simulates text entry. |\n\
    | windowMaxized | | Maximizes the current window. |\n| refresh | | Refreshes the\
    \ browser. Can be useful for resetting JavaScript state. |\n\nIn Jest, or any\
    \ other widget, if a click event does not do what is expected, try using a mouseDown.\
    \ To select a row in a grid, for example, the browser sends three events: mouseDown,\
    \ mouseUp, and click. Different elements in a user interface may respond to any\
    \ of them.\n\nActions in Selenium have two forms: a simple form and a second form\
    \ that will wait for a page to reload. The waiting form of the click command,\
    \ for instance, is clickAnd Wait.\n\nAfter a sequence of actions, it is necessary\
    \ to verify that the application actually performed the correct actions. Most\
    \ tests in Selenium check for the presence or absence of an element or section\
    \ of text. For example, test adding a new element to an ExtJS grid, the script\
    \ would go something like this:\n\n1. Click the add button.\n2. Fill out a form\
    \ giving default values.\n3. Submit the form.\n4. Wait for the result.\n\n"
  mdcn: "\n\n在极少数情况下，Selenium 命令会将 DOM 中中要操作的元素位置作为参数。该位置可以通过多种方式指定，包括元素 ID、元素名称、XPath、CSS\
