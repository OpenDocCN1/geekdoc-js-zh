    more than one per second, as shown in Figure 9-1. This has a lot of overhead and
    is not a particularly efficient way to poll the server. It can also create a huge
    amount of server load, as each request involves a setup and teardown that may
    need to happen on the server. Plus, there is the network overhead of HTTP headers,
    as well as user authentication. The HTTP headers can add a few hundred bytes to
    each request. In a busy server this can add a significant amount of load to the
    servers and network.


    A second method is to open an HTTP request to the server and let it hang open.
    When the server needs to send some data, it sends it to the client and then closes
    the HTTP request. At this point the browser will open a new connection and repeat.
    Depending on the specific server technology employed, this can still cause a significant
    load on the server, as a large pool of threads and connections are kept running,
    even if in a waiting state, though this would be less of an issue using a nonblocking
    server as Node.js. A further complication is that the browser may allow only a
    limited number of Ajax requests to a given server at a time, so holding a request
    or two open may cause other things to block, making this a less-than-optimal way
    to do things.'
