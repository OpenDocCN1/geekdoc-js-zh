    # 使用 JavaScript 构建强大的跨平台环境


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_0_0.png)


    # 编程


    # HTML5 应用


    O''REILLY


    Zachary Kessin


    www.allitebooks.com


    # 编程 HTML5 应用


    释放 HTML5 的全部威力，学习如何构建完整的、自包含的应用程序，这些程序可以在移动设备上运行并与桌面应用竞争。通过这本实用的指南，你将发现处理数据的有效
    HTML5 方法，如离线存储和多线程处理。你还将熟悉先进的 JavaScript 工具，这些工具将帮助你利用整个 HTML5 元素。书中包含了大量的代码示例，向经验丰富的
    JavaScript 开发者展示了 HTML5 如何将 Web 变成一个一级的开发环境。


    > “HTML5 在如今非常风靡，但它不仅仅是一个热词。《编程 HTML5 应用》一书提供的知识将引导你掌握构建现代 Web 应用所需的所有新技术。” ——Ralph
    Whitbeck，官方 jQuery 播客联合主持人


    - 使用本地存储对象对象在浏览器中处理会话数据

    - 保存服务器访问：使用 IndexedDB 存储更多数据

    - 赋予浏览器访问用户系统的有限权限以读取和上传文件

    - 让你的应用离线运行——并在在线时加速页面加载

    - 使用 Workers 创建多线程应用程序

    - 使用 WebSockets 更高效地在浏览器和服务器之间传输数据

    - 学习用于表单、多媒体、图形和地理定位的 HTML5 标签


    Zachary Kess 开发交互式 Web 应用已有二十年。他专注于使用 JavaScript 在浏览器中构建复杂应用、使用 Selenium 进行浏览器测试、函数式编程以及代码生成。


