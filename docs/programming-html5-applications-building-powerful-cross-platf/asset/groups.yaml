    \ to HTML elements, you provide metadata about what the data represents. For example,\
    \ you can mark up a piece of text as a price, a date, or an author. This is particularly\
    \ useful for SEO and other web services.\n\n## New Form Types\n\nHTML5 enhances\
    \ the classic form that has been in HTML since the 1990s with a bunch of new form\
    \ types. Most of these are classic \\<input type=\"text\"> tag that has been in\
    \ use since the beginning. These new form types provide some-needed flexibility\
    \ in the types of input a form can take, and the interface provides.\n\nIn many\
    \ cases, on a mobile device, changing the input type will also cause the device\
    \ to put up a custom keyboard to enable the user to enter the right kind of data.\
    \ For instance, if type is set to number, the device can put up a numeric keypad\
    \ that looks a little different but is optimized for entering phone numbers. For\
    \ a type of email, the keyboard will be a standard QWERTY keyboard but modified\
    \ for entry of email addresses.\n\nOne type that is especially useful for smartphone\
    \ applications is the speech input \\<input type=\"text\" x-webkit-speech>. The\
    \ speech tag will take the user said and translate it into text. My Android, for\
    \ instance, has a Google Search widget that can search by voice. The speech tag\
    \ also allows the user to type normally as well. When the user speaks, the input\
    \ will fill the websspeech event, which can be used to interact with.\n\n> Be\
    \ warned for users who speak English with foreign or other non-standard accents,\
    \ this tag may prove very difficult to use. Many of the Israeli and Russian coworkers\
    \ find that these inputs are not very useful. It also may limited support for\
    \ languages other than English. So if your application's users speak, for example,\
    \ Polish or Hebrew, the tag may or not be useful.\n"
  mdcn: "\n\n# 第 10 章\n\n## 新标签\n\n除了用于处理数据的许多新接口外，HTML5 还引入了许多新的 HTML 标签，这些标签可以用于网页，以增强应用程序开发者发布高质量应用程序的能力。\n\
    \n## 应用程序的标签\n\n任何应用程序中的常见任务都是向用户提供长时间运行任务的进度反馈。这让用户知道她的任务正在进行，程序没有死机。可以通过几个 \\\
    <div></div> 元素和一些自定义 CSS 来显示进度条，但 HTML5 通过新的 \\<progress> 标签标准化了这一过程和外观。在编写本文时，该标签已在\
    \ Firefox 和 Chrome 中支持。它提供了两个属性，以便向用户直观地显示进度：`value` 用于显示进度条的当前值，`max` 用于显示最大值。\n\
    \n为了向旧版浏览器的用户显示进度指示，建议你在 \\<<span>\\</span>> 元素内部包含某种形式的文本以指示进度。\n\n示例 10-1 显示了完成率为\
    \ 20% 的进度条代码。示例 6-4 显示了 JavaScript 如何随着程序中的事件指示进度更新属性。进度条也可以像其他 HTML 元素一样使用 CSS\
    \ 进行样式设置。\n\n示例 10-1 进度指示\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Progress</title>\n\
    </head>\n<body>\n<progress value=\"20\" max=\"100\">\n<span>running</span>\n</progress>\n\
    </body>\n</html>\n```\n\n如果说 \\<progress> 元素可以用于显示运行中的事件，那么 \\<meter> 元素就可以用于显示静态值，例如磁盘的满程度或为筹款目标筹了多少资金。\n\
    \n\\<meter> 标签可以接受几个参数，包括 `min`、`max`、`low`、`high`、`optimum` 和 `value`。所有这些值都应该设置为数值。`min`\
    \ 和 `max` 值显示值范围的端点，而 `value` 属性显示当前值。`high`、`low` 和 `optimum` 参数允许你对范围进行细分。通过\
    \ CSS，你可以为范围的不同部分设置不同外观的数值。 \\<meter> 标签在[示例 10-2](#)所示。\n\n与 \\<progress> 标签一样，\\\
    <meter> 标签应该包裹在 \\<<span>\\</span> 中，以便向不支持此标签的浏览器显示数据。目前，Chrome 和 Opera 支持此功能。其他浏览器可能会在某个时候支持。\n\
    \n示例 10-2 仪表指示\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Meter</title>\n\
    </head>\n<body>\n  <meter min=\"0\" value=\"20\" max=\"100\">\n    <span>20%</span>\n\
    \  </meter>\n</body>\n</html>\n```\n\n## 通过 WAI-ARIA 实现无访问性\n\n对于身体残障的人来说，使用 Web\
    \ 应用（或其他任何 GUI 应用程序）可能非常有挑战性。对于这些用户，HTML5 定义了“可访问富内容的应用程序”（Accessible Rich Internet\
    \ Applications）。这些特别针对视障人士（由于某些原因，这些人可能仍在使用非图形化浏览器）。通过向应用程序中的标签中添加属性，你可以帮助这些用户访问应用程序的内容。\n\
    \n本节并不是制作可访问应用程序的完整指南，那可以写成一本书。WAI-ARIA 的基本思想是为页面元素添加语义含义，这些含义可以被阅读器读取，从而让视障用户了解页面上正在发生什么。这种文本一段时间以来一直通过\
    \ \\<img> 标签中的 `alt` 属性和 \\<hr> 标签上的 `title` 属性得到支持。\n\nWAI-ARIA 中常见的属性是 `role`\
    \ 属性。它为元素提供了上下文。在 HTML 中，诸如 \\<<span>\\</span>> 和 \\<<li>\\</li>> 这样的标签被用于许多不同的用途，从导航到实际列表。通过添加\
    \ `role` 属性，你可以帮助阅读器理解所有这一切。[示例 10-3](#) 展示了 WAI-ARIA 的示例。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>Meter</title>\n</head>\n<body>\n  <ul id=\"\
    tree\"\n    role=\"tree\"\n    tabindex=\"0\"\n    aria-labelledby=\"label_1\"\
    >\n    <li role=\"treeitem\" tabindex=\"-1\" aria-expanded=\"true\">Fruits</li>\n\
    \    <li role=\"group\">\n      <ul>\n        <li role=\"treeitem\" tabindex=\"\
    -1\">Oranges</li>\n        <li role=\"treeitem\" tabindex=\"-1\">Pineapples</li>\n\
    \      </ul>\n    </li>\n  </ul>\n</body>\n</html>\n```\n\n## 微数据 (Microdata)\n\
    \n## 微数据\n\n有时，为一组 HTML 标签添加机器可读的数据是很有用的。例如，你可以在模板中使用此过程将数据编码到可以被 JavaScript 读取的页面中。为了以标准方式启用此类过程，HTML5\
    \ 创建了*微数据*（microdata）的概念，它可以添加到 HTML5 标签中。\n\n传统上，HTML 标签提供关于信息在屏幕上如何格式化的数据，而不是关于数据本身的信息。程序可以查看\
