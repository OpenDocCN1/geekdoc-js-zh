    \ 状态。 |\n\n在 Jest 或任何其他组件中，如果点击事件未达到预期，请尝试使用 `mouseDown`。例如，要在网格中选择一行，浏览器会发送三个事件：`mouseDown`、`mouseUp`\
    \ 和 `click`。用户界面中的不同元素可能会对其中任何一个做出响应。\n\nSelenium 中的动作有两种形式：简单形式和等待页面重新加载的第二形式。例如，`click`\
    \ 命令的等待形式是 `clickAnd Wait`。\n\n在执行一系列动作后，必须验证应用程序确实执行了正确的操作。Selenium 中的大多数测试都会检查元素或文本段的存在或缺失。例如，测试向\
    \ ExtJS 网格中添加新元素，脚本将如下所示：\n\n1. 点击添加按钮。\n2. 填写带有默认值的表单。\n3. 提交表单。\n4. 等待结果。\n\n"
