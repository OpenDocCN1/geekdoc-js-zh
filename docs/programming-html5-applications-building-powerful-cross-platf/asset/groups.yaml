    \nIf the uncertainty of all the client-side storage options is enough to drive\
    \ you crazy, we have other options. With many things in JavaScript, a bad and\
    \ inconsistent interface can be covered up with a module that provides a much\
    \ better interface. Here are two such modules that can make life easier.\n\n#\
    \ DSt\n\nDSt (http://github.com/gamache/DSt) is a simple library that wraps the\
    \ localStorage object. DSt can be a freestanding library or a jQuery plug-in.\
    \ It will automatically convert any complex object to a JSON structure.\n\nDSt\
    \ can also save and restore the state of a element or an entire form. To save\
