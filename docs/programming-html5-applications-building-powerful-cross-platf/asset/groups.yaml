    \ (value, key) {\n    return isDuplicate(value);\n  });\n}\n```"
  - '[PAGE 78]


    # CHAPTER 6

    Files


    For obvious reasons, the browser has historically had very limited ability to
    access the filesystem. HTML forms have been able to upload files, and certain
    HTTP headers make it possible for a user to download files from the server. But
    outside of those specific features, the browser has not been able to access files
    on the local filesystem. In general this is a good thing. I don''t want every
    web page I visit to be able to look around my hard drive!


    Some of the new features of HTML5 give the browser limited access to the files
    via the existing form input. Historically, a browser could upload a file from
    a form, but now it is possible to use the data from the file directly in JavaScript.
    In addition, the browser now lets you drag files from your web application. Google''s
    Gmail uses this feature to allow the user to attach files. This had been done
    with Flash, but now can be done with just JavaScript.


    This does not create any new security problems, because the application already
    had access to this data by uploading it to the server, downloading it again into
    the browser.


    As of this writing, these features are supported in Firefox, Chrome, and Opera.
    For Safari and Internet Explorer, the Flash plug-in will work to allow file drag-and-drop.


    # Blobs


    JavaScript has always been good at working with strings and numbers, but binary
    data has never been its strong point. Recently, however, it added a blob data
    type and interfaces to work with blobs (binary large objects). JavaScript sees
    a blob as a chunk of raw data. The amount of actual manipulation that JavaScript
    can do on a blob is somewhat limited. However, blobs are very important for moving
    binary data around. Blobs can be read and written to files (“Working with Files”
    on page 69), used as URLs, saved in IndexedDB (see Chapter 5), and passed to and
    from a Web Worker (see Chapter 8).'
  - "[PAGE 79]\n\nYou can create a new blob with the BlobBuilder interface. This creates\
    \ a basic empty BlobBuilder, which is possible to append a string, an existing\
    \ blob, or binary data from an ArrayBuffer. The BlobBuilder.getBlob() method returns\
    \ the actual blob.\n\nBlobBuilder is called MozBlobBuilder in Firefox, as of version\
    \ 6, and WebKitBlob Builder in Safari Night kids and Chrome as of version 8.\n\
    \nIn Example 6-1, PNG data is passed to a BlobBuilder object to create a blob\
    \ that is then turned into a URL. The URL object can be set the src attribute\
    \ of an image tag to display the DOM.\n\nExample 6-1. Creating a blob from raw\
    \ data\n\n```\n/*global window, $, BlobBuilder, document, XMLHttpRequest */\n\
    /*jslint onever: false, white: false */\n\nfunction makePNG(pngData)\n{\n  var\
    \ BlobBuilder = window.BlobBuilder || window.MozBlobBuilder ||\n  window.WebKitBlobBuilder;\n\
    \n  var blob = new BlobBuilder();\n  blob.append(pngData);\n  var url = blob.getBlob('image/png').createObjectURL();\n\
    \  return url;\n}\n```\n\nYou can extract a section of the blob with the slice()\
    \ method. Because slice has different parameters from the array and string methods\
    \ of the same name, it has been renamed to mozSlice() on Firefox and webkitSlice()\
    \ on Chrome. Whatever name the browser requires, the method returns the extracted\
    \ data as a new blob. Taking a slice is the only access that the blob API allows\
    \ to get the raw data of the blob.\n\nIf a blob contains data that needs to be\
    \ loaded as if it were a URL, it can be turned into something that can be used\
    \ as a URL with the createObjectURL() method. This returns an object that can\
    \ be assigned to an HTML tag that expects a URL. For example, a blob that contains\
    \ image can be assigned to the src attribute of an <img> tag to display the image.\n\
    \nWhen done with a URL, it is important to deallocate it manually, because JavaScript\
    \ will not be able to determine when to garbage-collect this object. To use this,\
    \ revokeBlobURL() method. Blob URLs have the same origin as the creating script,\
    \ so they can be used pretty flexibly in places where the browser's same-origin\
    \ policy can be a problem. The browser will also revoke all blob URLs when the\
    \ user navigates away from the page."
  - '[PAGE 80]


    # Working with Files


    For many years, HTML forms have been able to include a file type as a form element
    that allows the user to specify a file to upload to the server. The browser does
    not allow JavaScript to set this field, for fear that it could somehow the upload
    of a file it shouldn''t. However, new JavaScript APIs allow you to read the contents
    of files from the local system that have been added to the form element by the
    user.


    If you have a file with upload field, it will provide a FileList object. Each
    element of the FileList object is a File object. A file object provides the user
    with the file''s name, MIME type, size, and last modified. The full path is not
    exposed in JavaScript, but it can be seen in Firebug.


    The file pointed to a File object can be read in by the FileReader object, or
    in sections using the `.slice()` method. To upload a very large file, such as
    a video, it may make sense to chop the file into smaller parts and upload each
    part to the server instead of uploading a single file that may be a few hundred
    megabytes. It is also noted that many servers, by default, limit file uploads
    to a few tens of megabytes.


    By using the FileReader interface, your program can read the contents of the file.
    All of these methods return void and the data that will be delivered after the
    browser finishes reading the file into memory, with the onload handler. This asynchronous
    operation is important because it can take some time for a large file to be read
    into the browser.


    The FileReader API has four options for reading data:


    ```

    FileReader.readAsDataURL()

    ```


    Transforms a file to a URL that it can be used in the page. The resultant object
    will contain the full data of the file.


    ```

    FileReader.readAsText()

    ```


    Returns the data as a string. By default, the text is encoded as UTF-8, but you
    can specify a different format.


    ```

    FileReader.readAsBinaryString()

    ```


    Returns the data as a binary string, with no attempt to interpret the contents.


    ```

    FileReader.readAsArrayBuffer()

    ```


    Returns the data as an ArrayBuffer.


    Example 6-2 shows an example of a drop handler. Drag-and-drop file handling will
    be introduced fully with "Drag-and-Drop" on page 71. Now, the concepts to take
    away from this example are that `drop` is the name of the event passed to `addEventListener`
    along with a callback function, and that function is called by the event handler
    with a list of files in the `FileList` object. In this example, the function displays
    the first file in the list by creating a URL on the fly and adding it to an `<img>`
    tag.'
