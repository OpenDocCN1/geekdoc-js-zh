    # CHAPTER 3


    # Testing JavaScript Applications


    Test-driven development has become all the rage in software development over the
    past few years. By creating tests that are automated and repeatable, a developer
    can have confidence that the code is of high quality and that new changes will
    not break older features. Some proponents claim that tests should be written before
    the code they test.


    Having a reliable set of tests is a vital part of any software development effort.
    It enables a developer to have confidence that code works once it''s written and
    will continue to work over time.


    Testing has a key element of development in most server-side development platforms.
    Solid test harnesses can be found in development environments for PHP, Java, Ruby,
    and so on. However, the standard method for testing in most of these languages
    does not work well for JavaScript. Let''s look at a few reasons why.


    Server-side test suites generally have to test the program under one set of environments.
    If a REST service is being built with Python, the tester can build the tests with
    several safe assumptions. For instance, he may know that it will run on Python
    version 3.0 on Linux, along with specific versions of all the supporting software.


    The web application has no such confidence. Users may come to use the site Firefox,
    Internet Explorer, Chrome, Safari, and Opera—and several versions of each. So
    test suites must be able to handle testing across a number of browsers and operating
    systems, each of which is a little different.


    There are two main sources of differences. First, there are differences in the
    language itself among the different browsers. For example, the keyword const is
    supported by Firefox, but not by Internet Explorer. Second, many HTML interfaces
    exist only in particular browsers or browser versions. For example, many of the
    various JavaScript interfaces in this book exist only in particular browsers.
    So tests must be able to adjust to those differences and handle degradation where
    needed.'
- md: "\nTesting experts in Java or C talk about several kinds of tests: unit tests,\
    \ integration tests, and so on. The base technology of all of these is the same,\
    \ but the goals of each are different.\n\nUnit tests should be small tests that\
    \ run fast and test one thing. They should work along the lines that, for a given\
    \ function/method/interface, if i give it x it should do y. These test the basic\
    \ logic of a system. Each unit test should ideally test one method or very small\
    \ block of code.\n\nIntegration tests are more complex tests that make sure everything\
    \ is working together. They tend to be more along the lines of \"If I click this\
    \ button...\n\nThese ideas don't seem to work well in JavaScript as they do in\
    \ other languages. QUnit (\"Unit on page 30\") is better for unit tests, while\
    \ Selenium (\"Selenium on page 33\") is better for integration. However, the tendency\
    \ of JavaScript to have lots of anonymous functions making unit tests harder,\
    \ as those functions can't be easily reached by the testing functions. One aid\
    \ to testing is to create as many of those functions as external to the place\
    \ they are used, as part of some namespace or as the result of some other function\
    \ which can be tested.\n\nExample 3-1, makeInList will return a function that\
    \ tests whether a field in a record is in a passed list. In this case, the returned\
    \ function is a pure function with no side effects, so it is easy to test. Example\
    \ 3-2 shows two tests using a function created by makeInList. If passed \"NY\"\
    , the function returns true because it was created with \"NY\" in the list, but\
    \ when passed \"CT\" it returns false.\n\nExample 3-1. In-list test\n\n```javascript\n\
    var makeInList = function (list, rec)\n{\n  return function inList (rec)\n{\n\
    \    var value = rec[field];\n    return list.indexOf(value) == -1;\n  }\n};\n\
    ```\n\nExample 3-2. In-list used test\n\n```javascript\nvar nnyj = makeInList(['NY','NJ'],\
    \ 'state');\nok(nnyj({state: \"NY\"}));\nok(!nnyj({state: \"CT\"}));\n```\n\n\
    ## Types of Tests\n\nTesters generally talk about several kinds of tests: unit\
    \ tests, integration tests, and so on. All of these use the same basic tools but\
    \ work on different levels.\n\nA unit test seeks the smallest unit of a code,\
    \ often a function or method. For instance, Example 3-2 is a unit test. It tests\
    \ only the function and seeks to check all the possible options for how the code\
    \ could run.\n\nAn integration test is designed to make sure the system as a whole\
    \ works as designed. An integration test could click a button in the browser and\
    \ then verify that a record has been updated in a database, which verifies that\
    \ the system is working together. Integration tests run much slower than unit\
    \ tests. For this reason, many people run unit tests in real time, but integration\
    \ tests overnight.\n\nAcceptance tests verify that the software meets the requirements\
    \ of the customer. The purpose of these is not so much technical—to ensure that\
    \ it does what the programmer intends—as it is a matter of deployment and meeting\
    \ user needs.\n\nThe runtime model for JavaScript is also more complex. In a server-side\
    \ language, a unit test generally consists of a few sequential steps:\n\n- Set\
    \ up any needed features.\n- Run the method to be tested.\n- Test the results\
    \ of the method against some criteria.\n\nHowever, this model does not fit JavaScript,\
    \ where the results of an action may not be immediate but some time later. A test\
    \ like this would fail in JavaScript, as there can be a delay when the method\
    \ is run and when its results become available. In JavaScript, testing this may\
    \ go more like this:\n\n- Set up any needed features.\n- Run the method to be\
    \ tested.\n- Wait for an Ajax call to complete.\n- Check the DOM for the results\
    \ of the action (including undesired effects on unexpected parts of the page).\n\
    \nAn additional complication is that, in many cases the method to run is a callback\
    \ on a DOM element. To run unit tests in this situation, you really want to find\
    \ the DOM element and send it the correct event. That way, the handler is invoked\
    \ in a manner as similar as possible to when an actual user is using the application.\
    \ Even that is not enough: it doesn't reproduce the experience of a user clicking\
    \ through various complex interfaces in the DOM.\n\nBrowser applications also\
    \ have the complexity of being based around a user interface. Most test-driven\
    \ development is done on server interfaces, or data-handling code, where the set\
    \ of inputs and outputs is relatively constrained. A given function will return\
    \ one thing when passed input “A” and another when passed input “B.”\n\nJavaScript\
    \ applications are more complicated by centrality of the user interface. The possible\
    \ range of actions a user can take is by definition very large. The number of\
    \ tests needed can be very large and the developer may not even think to create\
    \ many of them. For example, what happens if a user enters a name with an accent\
    \ mark into an input field? Will the system react correctly?\n\n## QUnit\n\nQUnit\
    \ is a JavaScript test suite from the same team that produced jQuery. To create\
    \ a test suite in QUnit, call the test function with two arguments: the test suite\
    \ name and a function that actually runs the tests.\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_41_0.png)\n\
    \nIt is possible to configure QUnit to complain if any new global variables have\
    \ been introduced by running a test, and because global variables are one of the\
    \ main sources of JavaScript bugs, this is a very helpful feature. To test for\
    \ leaking global variables, use the following example.\n\n## Example 3-3. Simple\
    \ application\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"https://code.jquery.com/jquery-latest.js\"\
    ></script>\n  <script src=\"button.js\"></script>\n  <script>\n    var handleButtonClick\
    \ = function() {\n      $.get('document.html', '', function(data, status) {\n\
    \        $(\"div\").attr('id='target_div'').text(data).appendTo('body');\n   \
    \   });\n    }\n    $('.button.click_me').click(handleButtonClick);\n  </script>\n\
    \  <link rel=\"stylesheet\" href=\"http://github.com/jquery/junit/raw/master/junit.css\"\
    \ type=\"text/css\">\n  <script src=\"http://github.com/jquery/junit/raw/master/junit.js\"\
    ></script>\n  <script src=\"simple-test.js\"></script>\n</head>\n<body>\n  <button\
    \ id=\"unit-click_me\">Click Me</button>\n  <!-- Stuff required by QUnit -->\n\
    \  <h1 id=\"unit-header\">QUnit example</h1>\n  <h2 id=\"unit-banner\"></h2>\n\
    \  <h2 id=\"unit-userAgent\"></h2>\n  <ol id=\"unit-tests\"></ol>\n  <div id=\"\
    unit-fixture\">test markup, which will be hidden</div>\n</body>\n</html>\n```\n\
    \nThe QUnit test is created by the page on load as any other JavaScript program\
    \ would be. In this case, it is loaded from http://github.com/jquery/junit/raw/master/qunit.js.\
    \ This file will start running any jQuery tests on load. The result of those tests\
    \ requires those elements to be present in the DOM.\n"
  mdcn: "\n\nJava 或 C 语言的测试专家会讨论几种测试：单元测试、集成测试等。所有这些测试的基础技术都是相同的，但每个测试的目标是不同的。\n\n\
    单元测试应该是小型的、运行快速且只测试某一项内容的测试。它们的工作原理通常是：对于给定的函数/方法/接口，如果我给它 x，它应该执行 y。这些测试检查了系统的基本逻辑。每个单元测试理想情况下应该只测试一个方法或非常小的代码块。\n\
    \n集成测试是更复杂的测试，确保所有部分都能协同工作。它们往往更类似于“如果我点击这个按钮……”\n\n这些想法在 JavaScript 中的效果可能不像在其他语言中那么好。QUnit（“见第\
    \ 30 页的 QUnit”）更适合单元测试，而 Selenium（“见第 33 页的 Selenium”）更适合集成测试。然而，JavaScript 具有大量匿名函数的倾向使得单元测试变得更加困难，因为这些函数无法被测试函数轻松访问。测试的一种辅助方法尽可能将这些函数创建在它们使用位置之外，作为命名空间的一部分或作为其他可以测试的函数的结果。\n\
    \n示例 3-1，`makeInList` 将返回一个函数，用于测试记录中的字段是否在传递的列表中。在这种情况下，返回的函数是一个没有副作用的纯函数，因此很容易测试。示例\
    \ 3-2 显示了两个使用 `makeInList` 创建的函数的测试。如果传递 \"NY\"，函数返回 true，因为它在创建时列表中就包含了 \"NY\"\
    ；但当传递 \"CT\" 时，它返回 false。\n\n示例 3-1. 列表内测试\n\n```javascript\nvar makeInList =\
    \ function (list, rec)\n{\n  return function inList (rec)\n{\n    var value =\
    \ rec[field];\n    return list.indexOf(value) == -1;\n  }\n};\n```\n\n示例 3-2.\
    \ 列表内测试（已使用测试）\n\n```javascript\nvar nnyj = makeInList(['NY','NJ'], 'state');\n\
    ok(nnyj({state: \"NY\"}));\nok(!nnyj({state: \"CT\"}));\n```\n\n## 测试类型\n\n测试人员通常会讨论几种测试：单元测试、集成测试等。所有这些测试使用相同的相同的工具，但工作层级不同。\n\
    \n单元测试寻求代码的最小单元，通常是一个函数或方法。例如，示例 3-2 就是一个单元测试。它只测试该函数，并试图检查代码运行的所有可能选项。\n\n集成测试的设计目的是确保整个系统按照设计工作。集成测试可以点击浏览器中的按钮，然后验证数据库中的记录是否已更新，这验证了系统正在协同工作。集成测试的运行速度比单元测试慢得多。由于这个原因，许多人会实时运行单元测试，而在深夜运行集成测试。\n\
    \n验收测试验证软件是否满足客户的需求。这些测试的目的与其说是在技术层面的（确保它执行了程序员的意图），不如说是为了部署和满足用户需求。\n\nJavaScript\
    \ 的运行时模型也更具复杂。在服务器端语言中，单元测试通常包含几个顺序步骤：\n\n- 设置任何需要的功能。\n- 运行待测试的方法。\n- 根据某些标准对方法的结果进行测试。\n\
    \n然而，这种模型并不适用于 JavaScript，在 JavaScript 中，操作的结果可能不会立即出现，而是过段时间后出现。这种测试在 JavaScript\
    \ 中会失败，因为在方法执行与其结果可用之间可能存在延迟。在 JavaScript 中，这种测试可能是这样的：\n\n- 设置任何需要的功能。\n- 运行待测试的方法。\n\
    - 等待 Ajax 调用完成。\n- 检查 DOM 中操作的结果（包括对页面意外部分的任何非预期影响）。\n\n额外的复杂性在于，在很多情况下，要运行的方法是某个\
    \ DOM 元素的回调。在这种情况下运行单元测试，你真的需要找到 DOM 元素并向它发送正确的事件。这样，处理程序的调用方式将与真实用户使用应用程序尽可能相似。即使如此仍然是不够：它无法重现用户在\
    \ DOM 中点击各种复杂界面的体验。\n\n浏览器应用程序还有基于用户界面的复杂性。大多数测试驱动开发都是在服务器接口或数据处理代码上进行的，这些地方的输入输出集相对有限。给定的函数在传递输入“A”时返回一个结果，在传递输入“B”时返回另一个。\n\
    \nJavaScript 应用因为用户界面的核心性而变得复杂。用户可以采取的操作范围定义上非常大。需要的测试数量可能非常多，开发者可能甚至没有考虑到创建许多测试。例如，如果用户在输入框中输入带有重音符号的名字会怎样？系统会有正确反应吗？\n\
    \n## QUnit\n\nQUnit 是由制作 jQuery 的同一团队开发的 JavaScript 测试套件。在 QUnit 中创建测试套件，请调用带有两个参数的测试函数：测试套件名称和一个实际运行测试的函数。\n\
    \n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_41_0.png)\n\n可以配置 QUnit 在运行测试时引入了任何新全局变量时报错，由于全局变量是\
    \ JavaScript Bug 的主要来源之一，这是一个非常有用的功能。要测试泄漏的全局变量，请使用以下示例。\n\n## 示例 3-3. 简单应用程序\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"https://code.jquery.com/jquery-latest.js\"\
    ></script>\n  <script src=\"button.js\"></script>\n  <script>\n    var handleButtonClick\
    \ = function() {\n      $.get('document.html', '', function(data, status) {\n\
    \        $(\"div\").attr('id='target_div'').text(data).appendTo('body');\n   \
    \   });\n    }\n    $('.button.click_me').click(handleButtonClick);\n  </script>\n\
    \  <link rel=\"stylesheet\" href=\"http://github.com/jquery/junit/raw/master/junit.css\"\
    \ type=\"text/css\">\n  <script src=\"http://github.com/jquery/junit/raw/master/junit.js\"\
    ></script>\n  <script src=\"simple-test.js\"></script>\n</head>\n<body>\n  <button\
    \ id=\"unit-click_me\">Click Me</button>\n  <!-- QUnit 需要的元素 -->\n  <h1 id=\"\
    unit-header\">QUnit example</h1>\n  <h2 id=\"unit-banner\"></h2>\n  <h2 id=\"\
    unit-userAgent\"></h2>\n  <ol id=\"unit-tests\"></ol>\n  <div id=\"unit-fixture\"\
    >test markup, which will be hidden</div>\n</body>\n</html>\n```\n\nQUnit 测试是在页面加载时创建的，就像任何其他\
    \ JavaScript 程序一样。在这种情况下，它是从 http://github.com/jquery/junit/raw/master/qunit.js\
    \ 加载的。该文件会在加载时启动任何 jQuery 测试。这些测试的结果需要这些元素存在于 DOM 中。\n\n"
