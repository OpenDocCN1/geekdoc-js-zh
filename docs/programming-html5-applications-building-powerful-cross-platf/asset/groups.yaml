- md: "\n# CHAPTER 10\n\n## New Tags\n\nIn addition to a lot of new interfaces for\
    \ working with data, HTML5 also introduces a number of new HTML tags that can\
    \ be used in a web page to enhance the application developer's ability to put\
    \ out a quality application.\n\n## Tags for Applications\n\nA common task in any\
    \ application is to give the user feedback on how far along a long-running task.\
    \ This lets the user know that her task is moving and that something didn't freeze\
    \ up. It is possible to show a progress meter by a few \\<div></div> elements\
    \ and some custom CSS, but HTML5 standardizes the procedure and appearance through\
    \ a new \\<progress> tag. As of this writing, the tag is supported in Firefox\
    \ and Chrome. It offers two attributes to make it easy to visualize progress to\
    \ the user: value to show the current value of the progress bar and max to show\
    \ the maximum value.\n\nIn order to show a progress indication to users of legacy\
    \ browsers, it is recommended that you include some form of text inside a \\<<span></span>\
    \ element to indicate the progress.\n\nExample 10-1 shows the code for a progress\
    \ bar at 20% completion. Example 6-4 shows how JavaScript can update the attributes\
    \ as events in the program indicate progress. The progress bar can also be styled\
    \ with CSS like any other HTML element.\n\nExample 10-1. Progress indicator\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Progress</title>\n</head>\n<body>\n\
    <progress value=\"20\" max=\"100\">\n<span>running</span>\n</progress>\n</body>\n\
    </html>\n```\n\nIf the \\<progress> element can be used to show a running event,\
    \ the \\<meter> element can be used to show a static value such as how a full\
    \ disk is or how much money has been raised for a fundraising goal. \n\nThe \\\
    <meter> tag can take a few parameters, including min, max, low, high, optimum,\
    \ and value. All of these should be set to numeric values. The min and max values\
    \ show the ends of ranges of values, whereas the value attribute shows the current\
    \ value. The high, low, and optimum parameters allow you to subsegment the range.\
    \ Through CSS, you can style values for different parts of the ranges with different\
    \ looks. A \\<meter> tag is shown in [Example 10-2](#).\n\nLike the \\<progress>\
    \ tag, the \\<meter> tag should be wrapped around a \\<<span> that can show the\
    \ data to browsers that do not support this tag. Currently, Chrome supports this,\
    \ as Opera. Other browsers may follow at some point.\n\nExample 10-2. Meter indicator\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Meter</title>\n</head>\n\
    <body>\n  <meter min=\"0\" value=\"20\" max=\"100\">\n    <span>20%</span>\n \
    \ </meter>\n</body>\n</html>\n```\n\n## Accessibility Through WAI-ARIA\n\nFor\
    \ people with physical disabilities, using a web app (or any other GUI application)\
    \ can be quite challenging. For these users, HTML5 defines Accessible Rich Internet\
    \ Applications. These are directed particularly at the vision-impaired (which\
    \ may include people for some reason still use a nongraphic browser). By adding\
    \ attributes to tags in an application, you may help these users access the application's\
    \ contents.\n\nThis section is not a full guide to making an accessible application,\
    \ which could fill a book of its own. The basic idea of WAI-ARIA is that it adds\
    \ semantic meaning to elements on the page that can be read by a screen reader\
    \ to let a user who is vision-impaired have context for what is happening on a\
    \ page. This sort of text has been supported for some time by the alt attribute\
    \ in \\<img> tags and the title attribute on \\<hr> tags. \n\nThe most common\
    \ attribute in WAI-ARIA is the role attribute. This provides context for elements.\
    \ In HTML, tags such as \\<<span></span> and \\<<li></li> are used for many different\
    \ things, from navigation to actual lists. By adding a role attribute, you can\
    \ help the screen reader make sense of all of this. [Example 10-3](#) shows an\
    \ example of WAI-ARIA.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Meter</title>\n\
    </head>\n<body>\n  <ul id=\"tree\"\n    role=\"tree\"\n    tabindex=\"0\"\n  \
    \  aria-labelledby=\"label_1\">\n    <li role=\"treeitem\" tabindex=\"-1\" aria-expanded=\"\
    true\">Fruits</li>\n    <li role=\"group\">\n      <ul>\n        <li role=\"treeitem\"\
    \ tabindex=\"-1\">Oranges</li>\n        <li role=\"treeitem\" tabindex=\"-1\"\
    >Pineapples</li>\n      </ul>\n    </li>\n  </ul>\n</body>\n</html>\n```\n\n##\
    \ Microdata\n\n## Microdata\n\nSometimes it is useful to add machine-readable\
    \ data to a set of HTML tags. For example, you can use this procedure in a template\
    \ to encode data into a page that can be read by JavaScript. To enable such procedures\
    \ in a standardized way, HTML5 created the concept of *microdata*, which can be\
    \ added to HTML5 tags.\n\nTraditionally, HTML tags give data about how information\
    \ is formatted on screen, but not about the data itself. A program can look at\
    \ an \\<li></li> tag and know it is an item in a list, but not what kind of list.\
    \ Is it a list of books for sale, or people who attended an event? By adding microdata\
    \ it is possible to give context to data, which can be used later programmatically.\n\
    \nIn general, microdata is used to help search engines and other tools understand\
    \ the content of your web page. By adding specific attributes to HTML elements,\
    \ you provide metadata about what the data represents. For example, you can mark\
    \ up a piece of text as a price, a date, or an author. This is particularly useful\
