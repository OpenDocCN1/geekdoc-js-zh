    \ case, the data is in JSON, so it can be parsed with the standard browser JSON\
    \ parsing methods and then displayed in the browser.\n\nThe web socket client\
    \ does not make sense without a server to go with it. In general, web sockets\
    \ lend themselves well to event-driven data such as a shared document, stock ticker,\
    \ or chat service. Although PHP has often been the standby of web development,\
