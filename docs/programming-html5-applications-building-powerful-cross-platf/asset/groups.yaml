    \ 命令\n\n| Command | Target | Action |\n|---|---|---|\n| open | 要打开的网页 | 打开一个网页。\
    \ |\n| dblclick | 要双击的元素 | 双击一个元素。 |\n| click | 要点击的元素 | 点击一个元素。 |\n| mouseOver\
    \ | 鼠标移动其上的元素 | 模拟 `mouseOver` 事件。 |\n| mouseUp | 释放开鼠标键的元素 | 模拟 `mouseUp` 事件。\
    \ |\n| mouseDown | 按下鼠标键的元素 | 模拟 `mouseDown` 事件。 |\n| type | 用于选择元素的 XPath 或其他选择器；第三列是要输入的文本\
