    \ 5-8 所示。\n\n示例 5-8. 获取范围行\n\n```\n$.indexed(db).objectStore(objectStore).index('title').openCursor(MIN,MAX).each(write);\n\
    ```\n\n范围通过一个包含四个元素的数组设置，格式为 `[lower, upper, lowerExclusive, upperExclusive]`。前两个元素是整数，后两个元素（可选）是布尔值。默认情况下，范围是排他的，也就是说\
    \ `[10, 20]` 将为你提供 11–19 的值。但 `[10, 20, false, false]` 将包含搜索范围中的所有点。\n\n要使用上限或下限进行搜索，请将另一个参数留为未。`[10,\
