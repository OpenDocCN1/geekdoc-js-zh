    \ Acc) ->\n    Acc\nend, undefined, L).\n\necho_server(WebSocket) ->\n    receive\n\
    \        {tcp, WebSocket, DataFrame} ->\n            Data = yaws_api:websocket_unframe_data(DataFrame),\n\
    \            io:format(\"Got data from Websocket: ~p\", [Data]),\n           \
    \ yaws_api:websocket_send(WebSocket, Data),\n            echo_server(WebSocket);\n\
    \        {tcp_closed, WebSocket} ->\n            io:format(\"WebSocket closed.\
    \ Terminating echo server...~n\");\n        Any ->\n            io:format(\"echo_server\
    \ received msg: ~p\", [Any]),\n            echo_server(WebSocket);\n    end.\n\
    \nwebsocket_owner() ->\n  receive\n    % This is how we read messages from passive\
    \ mode\n    case yaws_api:websocket_receive(Websocket) of\n      {error,closed}\
    \ ->\n        io:format(\"The websocket disconnected. ~n~This wasn't supposed\
    \ to happen!~n\")\n      {ok, Messages} ->\n        case Messages of\n       \
    \   client-connected ->\n            yaws_api:websocket_setopts(Websocket, [{active,\
    \ true}]),\n            echo_server(WebSocket);\n          Other ->\n        \
    \    io:format(\"websocket_owner_get: ~p. Terminating~n\", [Other])\n    end\n\
    \  end.\n```\n"
