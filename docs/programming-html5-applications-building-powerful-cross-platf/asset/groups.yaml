    # CHAPTER 7


    # # Taking It Offline


    The Internet may seem to be always on these days but, let''s honest, it''s not.
    There are times and places when even the most modern mobile devices are out of
    range of the network for one reason or another.


    Chapter 4 looked at how to have data stored local to the browser so that it does
    not require network access to use. However, if the web page on which the application
    is hosted is not available, having the data handy will be of no use.


    With more and more of the modern application infrastructure moving into the browser,
    being able to access this software at any time has become critically important.
    The problem is that the standard web application assumes many components, including
    JavaScript sources, HTML, images, CSS, and so forth, will be loaded with the web
    page. In order to be able to use these resources the user does not have access
    to the Internet HTML5 lets a programmer give the browser a listing (known as a
    manifest*) of files that should be stored locally and saved. by the browser when
    needed. The browser will be able to access these files when there is no network
    connection to the server.


    The files listed in the manifest will also be loaded from the local disk if by
    browser is online, thus giving the user the experience of the ultimate content
    delivery network.


    As long as the browser is online when a page is loaded, it will check the manifest
    file with the server. If the manifest file has changed, the browser will attempt
    to redownload all the files listed for download in the manifest. Once all the
    files in the manifest have been downloaded, the browser will update the file cache
    to show the new files.


    # Introduction to the Manifest File


    The ability to access files offline was one of the features introduced by Google
    in Gears. The user provided a manifest as a JSON file, which directed the browser
    to load other required files. When the browser next visited that page, the files'
- md: "\nwould be loaded from the local disk instead of from the network. When the\
    \ version field of the manifest file was updated, Gears would check all the files\
    \ in the manifest for updates.\n\nThe HTML5 manifest is similar in idea but somewhat\
    \ different in implementation. One thing right about it is that you can implement\
    \ a manifest in an application without using any JavaScript code, which Gears\
    \ did require. To create a manifest, add the manifest attribute containing the\
    \ name of the manifest file to the document's `<html>` tag (see Example 7-1).\n\
    \nExample 7-1. HTML manifest declaration\n\n```html\n<!DOCTYPE HTML>\n<html manifest=\"\
    cache.manifest\">\n<body>\n  \n</body>\n</html>\n```\n\n```\n\nThe manifest will\
    \ be served with the MIME type text/cache-manifest. This can be done via the web\
    \ server configuration files. For the Apache web server, add the following line\
    \ to the config file. For other web servers, consult the server's document. The\
    \ filename does not matter as long as the file has the correct MIME type, cache.manifest\
    \ seems to be a good default choice:\n\n`AddType text/cache-manifest .manifest`\n\
    \n## Structure of the Manifest File\n\nThe format of the manifest file is in fact\
    \ pretty simple. The first line must be the words CACHE MANIFEST. After that comes\
    \ a list of files, one per line, to include in the manifest (see Example 7-2).\
    \ Comments can be marked with the pound (#) character.\n\nThe manifest will cache\
    \ HTTP GET requests, while POST, PUT, and DELETE will still go to the network.\
    \ If the page has an active manifest file, all GET requests will be directed to\
    \ local storage. But for some files, offline access does not make sense. These\
    \ can include various resources as Ajax calls, collections of documents that could\
    \ be so large as overflow the cache. These files can be included in a NETWORK\
    \ section. Any URLs in the NETWORK section will bypass the cache and load directly\
    \ from the server. The HTML5 manifest specification requires that any non-included\
    \ files be explicitly opted out of the manifest.\n\nIn other cases, you may wish\
    \ to provide different content depending on whether the user is offline or online.\
    \ The manifest provides a FALLBACK section for resources. The user will be shown\
    \ different content, depending on whether the browser has a connection to the\
    \ Internet or not. On each line of the FALLBACK section, the first file is loaded\
    \ from the server when a connection is available, and the second file is loaded\
    \ locally when the connection is not available.\n\nBoth the NETWORK and FALLBACK\
    \ sections list file patterns, not specific files. So it is possible to list entire\
    \ directories or URL paths here, as well as file types such as images (e.g., .jpg).\n\
    \nExample 7-2. Manifest file\n\n```\nCACHE MANIFEST\n# 11 October 2010\n/index.php\n\
    /js/jquery.js\n/css/style.css\n/images/logo.png\n\nNETWORK:\n/request.php\n\n\
    FALLBACK:\n/about.html /offline-about.html\n```\n\n## Updates to the Manifest\
    \ File\n\nThe browser will update the files in the manifest whenever the manifest\
    \ file itself changes. There are several ways to handle this. It is possible to\
    \ add a version number in a comment to the file. If the project is using a of\
    \ version control system like Subversion, you can use the version number tag for\
    \ this.\n\nThe problem with using a version number from a version control system\
    \ is that it requires a programmer to remember to update that time every file\
    \ in the system changes. It would be much better to create an automated system\
    \ that updates the manifest file whenever a file listed in it changes, and run\
    \ that script as part of a deployment procedure.\n\nFor instance, you could write\
    \ a script that checks all the files in the manifest for changes and then change\
    \ the manifest file itself when one of the files changes. A simple way to do this\
    \ is to write a script that loops over all the files in the manifest, then does\
    \ an MD5 checksum on each one, then puts a checksum into the manifest file. This\
    \ will ensure that any changes will cause the manifest file to update.\n\nThis\
    \ script would be too slow to run on the web server, as running hundreds of times\
    \ a second would be overkill. However, it can efficiently run in the development\
    \ environment. One option would be to have it run from an editor when a file is\
    \ saved. Another option is to run it as the check-in process for a version control\
    \ system.\n\nExample [7-3](https://example.com/7-3), we parse the manifest file\
    \ and do a few things with it. The program uses the [Symfony Yaml Library](https://example.com)\
    \ to load a list of files to use as a manifest. As a bonus, the program first\
    \ checks that no file has been included more than once. It also checks that every\
    \ file exists, because missing files.\n"
  mdcn: "\n将从本地磁盘加载而不是从网络加载。当清单文件的版本字段被更新时，Gears 会检查清单中的所有文件以进行更新。\n\nHTML5 清单在理念上相似，但在实现上有所不同。它正确的一点是，你可以在不使用任何\
    \ JavaScript 代码的情况下实现应用程序清单，而 Gears 是要求要求的。要创建清单，可以在文档的 `<html>` 标签中添加包含清单文件名的\
    \ `manifest` 属性（参见示例 7-1）。\n\n示例 7-1. HTML 清单声明\n\n```html\n<!DOCTYPE HTML>\n\
    <html manifest=\"cache.manifest\">\n<body>\n  \n</body>\n</html>\n```\n\n```\n\
    \n清单文件将以 MIME 类型 `text/cache-manifest` 提供。这可以通过 Web 服务器配置文件来实现。对于 Apache Web 服务器，请在配置文件中添加以下行。对于其他\
    \ Web 服务器，请咨询服务器的文档。只要文件具有正确的 MIME 类型，文件名并不重要，`.manifest` 似乎是一个很好的默认选择：\n\n`AddType\
    \ text/cache-manifest .manifest`\n\n## 清单文件的结构\n\n清单文件的格式实际上非常简单。第一行必须是 `CACHE\
    \ MANIFEST` 单词。之后是文件列表，每行一个，用于包含在清单中（参见示例 7-2）。可以使用井号 (`#`) 字符标记注释。\n\n清单将缓存 HTTP\
    \ GET 请求，而 POST、PUT 和 请求 请求仍将通过网络。如果页面有一个活跃的清单文件，所有 GET 请求将重定向到本地存储。但对于某些文件，离线访问是没有意义的。这些可能包括作为\
    \ Ajax 调用的各种资源、大到可能导致缓存溢出的文档集合。这些文件可以包含在 `NETWORK` 部分中。`NETWORK` 部分中的任何 URL 都将绕过缓存并直接从服务器加载。HTML5\
    \ 清单规范要求，任何未包含的文件都必须显式地从清单中排除。\n\n在其他情况下，你可能希望根据用户是离线还是在线提供不同的内容。清单为资源提供了一个 `FALLBACK`\
    \ 部分。用户将根据浏览器是否连接到互联网显示不同的内容。在 `FALLBACK` 部分的每一行中，当连接可用时，从服务器加载第一个文件；当连接不可用时，从本地加载第二个文件。\n\
    \n`NETWORK` 和 `FALLBACK` 部分列出的是文件模式，而不是特定文件。因此，在这里列出整个目录或 URL 路径，以及像图像（例如 `.jpg`）的文件类型都是可能的。\n\
    \n示例 7-2. 清单文件\n\n```\nCACHE MANIFEST\n# 11 October 2010\n/index.php\n/js/jquery.js\n\
    /css/style.css\n/images/logo.png\n\nNETWORK:\n/request.php\n\nFALLBACK:\n/about.html\
    \ /offline-about.html\n```\n\n## 清单文件的更新\n\n当清单文件本身发生变化时，浏览器将更新清单中的文件。有几种方法可以处理这种情况。可以在文件的注释中添加版本号。如果项目正在使用如\
    \ Subversion 之类的版本控制系统，可以使用版本号标签为此。\n\n使用来自版本控制系统的版本号的问题是，它要求程序员在系统中的每个文件发生更改时都记得更新它。更好的方法是创建一个自动化系统，当清单列出的任何文件发生变化时更新清单文件，并将该脚本作为部署程序的一部分运行。\n\
    \n例如，你可以编写一个脚本来检查清单中所有文件的更改，并在其中一个文件发生变化时更改清单文件本身。实现此点的简单方法是编写一个脚本，遍历清单中的所有文件，对每个文件进行\
    \ MD5 校验，然后将校验和放入清单文件中。这将确保任何更改都会导致清单文件的更新。\n\n该脚本在 Web 服务器上运行会太慢，因为每秒运行数百次就太浪费了。然而，它可以在开发环境中高效运行。一种方案是让它在保存文件时从编辑器运行。另一种方案是将其作为版本控制系统的提交过程运行。\n\
    \n示例 [7-3](https://example.com/7-3)，我们解析清单文件并对其进行一些操作。该程序使用 [Symfony Yaml Library](https://example.com)\
    \ 来加载文件列表以作为清单。作为额外奖励，程序首先检查没有没有文件被包含超过一次。它还会检查每个文件是否存在，因为缺少文件会导致问题。\n\n"
