  mdcn: "\n\n# 第一章\n\n## 作为应用平台的 Web\n\nHTML5 使 Web 成为了创建真实应用程序的第一级环境。它通过对浏览器 API\
    \ 进行关键扩展，增强了 JavaScript 现有的工具集，使得创建那些本身就很完整（并且可以是）完整的应用程序变得更容易，而不仅仅是某些远程服务器进程的视图。\n\
    \nWeb 起初是一种共享存储在 Web 服务器上的文件的方法，这些文件偶尔变化。开发者很快就发现了如何即时生成这些文件，迈向了构建应用程序的第一大步。下一个大步是在浏览器客户端添加交互性。JavaScript\
    \ 和文档对象模型（DOM）让开发者能够创建动态 HTML，尽管当时正值“浏览器大战”激烈进行并又突然停止。几年后，Ajax 让这些技术重新回到风口，增加了一些工具，让页面能够以更小的数据块与服务器进行通信。\n\
    \nHTML5 构建在这些 20 年的发展的基础上，并填补了某些关键空白。从表面上看，HTML5 的许多变化增加了对某些功能（尤其是多媒体和图形）的支持，这些功能以前需要插件；但在底层，它为\
    \ JavaScript 程序员提供了所需的工具，他们可以使用 HTML 构建结构、使用 CSS 表现、使用 JavaScript 处理逻辑和行为，从而创建独立的（或至少是更松耦合的）应用程序。\n\
    \n## 为 Web 应用增强力量\n\nHTML5 提高了 Web 应用的标准。虽然它仍然必须在安全限制下工作，但它终于提供了桌面开发者期待了多年的工具：\n\
    \n### 本地数据存储\n它可以存储高达 5 MB 的数据，通过键值系统进行引用。\n\n### 数据库\n最初是一个基于 SQLite 的 API，但趋势似乎转向了\
    \ IndexedDB，这是一种原生支持 JavaScript 的 NoSQL 系统。\n\n### 文件\n虽然应用程序仍然无法自由访问文件大小（出于显而易的安全原因），但现在可以处理用户指定的文件，并开始能够创建文件了。\n\
    \n### 离线运行\n当笔记本电脑或手机处于飞行模式时，Web 应用程序无法与服务器通信。Manifest 文件帮助开发者通过缓存文件以备后用来绕过这个问题。\n\
    \n### Web Workers\n线程和分叉一直是个问题，但 JavaScript 以前没有提供这些功能。Web Workers 提供了一种将应用程序进程放入独立空间的方法，让它们在其中工作而不会阻塞其他代码。\n\
    \n### Web sockets\n超文本传输协议（HTTP）一直是 Web 的基础，尽管随着时间的推移经历了几次更新。Web sockets 改变了请求-响应模式，创建了更灵活的通信系统。\n\
    \n当然，还有更多——从地理定位到音频和视频到 Canvas 图形，到各种细微的新标签——但这些为在 HTML5 中构建工业级应用程序奠定了基础。\n\n\
    ## 开发 Web 应用\n\n在过去，一个复杂的 Web 应用可能是一个目录（即源自数据库的静态页面），或者一个 JavaScript 贷款计算器。但没有人会梦想过要用\
    \ JavaScript 编写复杂的应用程序。那些应用需要 Java，或者可能是用 C++ 编写的专用客户端/服务器应用程序。事实上，在 DOM 和 Ajax\
    \ 出现之前的日子，在 JavaScript 中开发复杂应用几乎是不可能的。然而，Ajax 引入了在不重新加载页面的情况下与服务器交互的能力，而 DOM 则允许程序员即时更改\
    \ HTML。\n\n2007 年，Google Gears 是一种浏览器扩展程序，它为开发者提供了比以前多多的权力。Gears 让浏览器能够离线工作，允许使用户在浏览器中存储更多数据，并拥有一个工作池来卸载长时间运行的任务。Gears\
    \ 自此以后已停止使用，因为它的大部分功能已以改进后的形式迁移到 HTML5 中。\n\n现代 Web 拥有各种类型的网站，从那些仍然实际上是旧式文档集合的网站（如\
    \ Wikipedia），到提供与他人交互的网站（如 Facebook、YouTube 和 eBay），以及可以作为桌面应用程序替代品的物品（如 Gmail\
    \ 和 Google Docs）。许多以前独立的应用程序（如邮件客户端）已成为 Web 体验不可或的一部分。\n\n在现代 Web 中，应用程序与页面之间的界限已经模糊。此时的区别仅在于网站的意图。\n\
    \n在浏览器中运行应用程序具有优势。这种优势让开发者和用户都受益。在 DOM 出现之前，开发者可以使用工具让调试 JavaScript 变得容易许多。\n\n\
    \ JavaScript 在在沙中中，，，， 是是困难的。\n\n除了代码领域，开发者还开发了工具让 JavaScript 调试变得容易得多。\n\n脚本文化创造了自己的了自己的问题。对于开发者来说，提供低门槛是好事，但但也随着代价。代价之一是这种语言允许那些没有经验的程序员做一些糟糕的事情。初学者可以轻松地在\
    \ Web 上找到 JavaScript 示例，复制粘贴并修改几处就能让它们运行起来。遗憾的是，维护这样的代码随着时间的推移变得困难。\n\n随着 Ajax\
    \ 的复兴，开发者重新审视了 JavaScript。有些人致力于改进解释 JavaScript 代码的引擎，导致了速度的提升。另一些人专注于语言本身，意识到它有一些很好的特性，并开发了最佳实践，正如\
    \ Douglas Crockford 在《JavaScript: The Good Parts》（O'Reilly，2008）中所述的那样。\n\n在代码之外，开发者构建了工具让调试\
    \ JavaScript 变得容易得多。尽管早期调试器 Venman 在 1998 年就出现了，但 2006 年发布的 Firefox 是 JavaScript\
