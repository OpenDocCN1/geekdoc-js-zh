    \n## localStorage 和 sessionStorage\n\n现代浏览器为程序员提供了两个存储对象：localStorage 和 sessionStorage。每个对象都可以以键值值对的形式存储数据。它们具有相同的接口且工作方式也相同，但有一个例外。localStorage\
