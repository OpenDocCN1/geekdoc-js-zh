    # Programming HTML5 Applications


    Tap the full power of HTML5 and learn how to build complete, self-contained applications
    that can run on mobile devices and compete with desktop apps. With this practical
    guide, you''ll discover effective HTML5 methods for working with data, as offline
    storage and multithreaded processing. You''ll also become familiar with advanced
    JavaScript tools that help you exploit the entire array of HTML5 elements. Packed
    with code samples, this book shows experienced JavaScript developers how HTML5
    turns the Web into a first-class development environment.


    > “HTML5 is all the rage these days, but it''s more than just a buzzword. Programming
    HTML5 Applications provides the knowledge to guide you through all the new technologies
    needed to make modern web applications.” —Ralph Whitbeck Cohost Of The Official
    jQuery Podcast


    - Session data in the browser with local storage objects

    - Save trips to the server: store larger amounts of data with IndexedDB

    - Give browsers limited access to a user''s system to read and upload files

    - Take your app offline—and speed up page loading when it''s online

    - Use Workers to create multithreaded applications

    - Transfer data between browser and server more efficiently with Web Sockets

    - Learn about HTML5 tags for forms, multimedia, graphics, and geolocation


    Zachary Kess has been developing interactive web applications for two decades.
    He focuses on building complex applications in the browser with Javascript, browser-based
    testing with Selenium, functional programming, and code generation.


