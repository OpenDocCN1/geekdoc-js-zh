    \ of this software might check traffic to tell you that a different bus might\
    \ make a more roundabout and leave you a block from your destination, probably\
    \ run faster by missing a major traffic snarl.\n\n# Using Web Workers\n\nTo start\
    \ up a Worker, create a new Worker object and pass, as the parameter to the call,\
    \ the file that contains the code (see Example 8-1). This will create a worker\
    \ from the source file.\n\nExample 8-1. Worker example\n\n```\n$$(document).ready(function()\
    \ {\n  var worker = new Worker('worker.js');\n  worker.onmessage = function(event)\
    \ {\n    console.info(event);\n  };\n  worker.postMessage(\"World\");\n});\n```\n\
    \nThe browser will load the worker, run any code that is not in an event handler,\
    \ and then launch the event loop to wait for events. The main event concerned\
    \ with is the message event, which is how you send data to the worker. The main\
    \ thread sends the message by issuing postMessage() and passing data as the argument.\n\
    \nThe data from the main thread is held in the event.data field. The worker should\
    \ retrieve this data through a call to onmessage().\n\n# The Worker Environment\n\
    \nWeb Workers run in a pretty minimal environment. Many of the familiar objects\
    \ and interfaces of JavaScript in the browser are missing, including the DOM object,\
    \ and the window object."
  - '[PAGE 100]


    In addition to the standard ECMAScript objects like String, Array, and Date, the
    following objects and interfaces are available to the Web Worker:


    +   * The navigator object, which contains four properties: appName, appVersion,
    user Agent, and platform

    * The location object, with all properties read-only

    * The self object, which is the worker object

    * The importScripts() method

    * The XMLHttpRequest interface for doing Ajax methods

    * setTimeout() and setInterval()

    * The close() method, which ends the worker process


    ECMAScript 5 JSON interfaces can also be used, as they are part of the language,
    not the browser environment. Furthermore, the worker can import library scripts
    from the server with the importScripts() method. This method takes a list of one
    or more files, which are then loaded. This has the same effect as using a <script>
    tag in the main worker interface. Unlike methods in JavaScript, importScripts
    is blocking. The function will not return until all the listed files have been
    loaded.


    Although localStorage and sessionStorage are not accessible from the Web Worker,
    IndexedDB databases are (see Chapter 5). In addition the blocking forms can be
    used in a Web Worker (but not in the main window). If you want a worker to manipulate
    data through IndexedDB, it would make sense to load the new data into the database
    and then send an “updated” message to the main window or other workers so that
    they can take any needed actions.


    # Worker Communication


    The main event that concerns a worker is the message event, which is sent to the
    worker from the postMessage method in the main JavaScript context to pass information.
    However, some versions of Chrome and Safari support only simple data, such as
    strings, Booleans, and Numbers. It is good practice to encode all data into JSON
    before sending it to a Web Worker.


    The worker can send data back to the main thread via the same postMessage method,
    and receive it back in the main thread via the worker.onmessage handler.


    The model for worker communication is that the main task creates the worker, after
    which they pass messages back and forth as shown in Figure 8-2.'
