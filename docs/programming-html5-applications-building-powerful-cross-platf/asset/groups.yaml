    Other input types are pretty simple and mostly allow the programmer to specify
    what kind of data is expected, and the browser mark a field as invalid if it is
    not correct.


    Table 10-1 shows some of the possible options.


    Table 10-1. Form inputs


    | Type | Use | Notes |

    | --- | --- | --- |

    | email | Email addresses | |

    | date | Dates | Min and max can specify a range |

    | time | Time of day | Min and max can specify a range |

    | tel | Telephone numbers | Pattern to format via Regular Expression |

    | color | Colors | Format like #888888 |

    | number | Numbers | Will show up and down arrows |

    | search | Search | Min and max can specify a range |


    ## Audio and Video


    HTML5 also provides new support for audio and video via the <audio> and <video>
    tags. These tags will be familiar to anyone who has used the HTML <img> tag in
    that the audio source or video source is the src attribute. Audio and video can
    also be controlled with controls JavaScript and styled with CSS.


    A full description of how to script HTML5 media is beyond the scope of this book,
    but can be found in HTML5 Media by Shelley Powers (O''Reilly).


    ## Canvas and SVG


    In addition to providing sound and video support, HTML5 provides support for building-graphics
    in the browser with Canvas and SVG. Classic HTML can display images, but Canvas
    and SVG can do much more.


    SVG is an XML standard for Scalable Vector Graphics, which is to show that images
    created in SVG can be scaled and rotated. In addition, each element in an SVG
    image is an element of the DOM. So it is possible to, create a circle in SVG that
    can have JavaScript event handlers attached to it. Elements in SVG can also be
    manipulated as parts of the DOM; elements can be added, removed, or changed directly
    with the DOM or with jQuery. SVG elements can also be styled with CSS like any
    other HTML element. SVG is covered in depth in other books, including HTML5 Graphics
    with SVG & CSS3 by Kurt Cagle (O''Reilly).


    Canvas was initially created by Apple for use OS X and then moved to Safari; it
    has moved into most of the other browsers. Canvas provides a 2D drawing surface
    on which the code can render images. This was used in [Web Worker Fractal Example](page
    90) to draw a Mandelbrot set, but its full power is much greater than that. For
    a full treatment, see HTML5 Canvas by Steve Fulton and Jeff Fulton.


    In addition to the 2D, a 3D canvas on WebGl has started to be implemented in a
    number of browsers. For demos and a tutorial, look at the HTML5 Rocks tutorial
    at http://www.html5rocks.com/en/tutorials/three/intro/.


    ## Geolocation


    The World Wide Web is, by definition, worldwide, but there are many things on
    it that are local. If I am searching for a pizza place, I probably want that is
    where I am located. Geolocation lets the browser determine the user''s location
    by one of several mechanisms. If GPS is available (as it is on all smartphones)
    it will use that to get a location that is probably accurate to a few meters.
    If there is no GPS access, the browser can use information from cell towers or
    WiFi hubs; these methods may not be accurate but are often good enough. If the
    goal is to find a local pizza place, knowing the location to a few blocks is probably
    good. In most cases the Geolocation API will require the user to approve the request.


    To get the user''s position, call the getCurrentPosition() method with two callbacks,
    one for a successful location and one for error. In the case that the browser
    was able to find the user''s location, it will return with the latitude and longitude,
    altitude if it can figure out, also with an accuracy parameter. If there is an
    error it will return with one of several error conditions:


    ```

    navigator.geolocation.getCurrentPosition(userLocationCallback, errorCallback);

    ```


    ## New CSS


    In addition to JavaScript interfaces and new HTML tags, HTML5 also adds :nth-child()
    and :first-child as well as the CSS negation operator :not(), which can be used
    like :not(.box). These should allow developers to have more control over presentation
    of their applications.


    In addition to selectors, HTML5 includes support for web fonts in CSS. It is now
    possible to define a new font in CSS and include a TrueType font in the CSS to
    get a specific look.


    HTML5 CSS also includes some pretty cool features. It is possible to be more specific
    in text overflow, to set opacity of an object in the DOM, to set up text strokes,
    to specify color by HSL, and a lot more. Of course, everything else in HTML5,
    not all of these capabilities are supported in all browsers.


    ## APPENDIX JavaScript Tools You Should Know


    JavaScript is a young language in many ways. Although it has been around for about
    15 years, only recently has it been used for large-scale projects. So the tools
    to help programmers do robust, debuggable programming are still being developed.
    Here are a few you should strongly consider using.


    ### JSLint


    This is Douglas Crockford''s JavaScript syntax checker. JSLint can test JavaScript
    for all possible manner of problems. You can run JSLint from the website (http://eslint.com)
    or locally. There is a Drag and Drop widget in the Yahoo! editor and you can run
    it from the command line with Rhino (discussed later). A simple bash script will
    make this easy to run (see Example A-1). You can even hook JSLint into your editor.


    If you use one for JavaScript, it should be this one. To understand why, read
    Crockford''s JavaScript: The Good Parts. That book describes in detail how JSLint
    makes the choices it makes. It will catch many common JavaScript bugs and should
    be considered a key part of every JavaScript''s tool set.


    To configure JSLint on a per-file basis, you can put comments at the top of the
    file. These can turn options on or off in the file as well as JSLint about global
    variables that are defined elsewhere.


    Example A-1. JSLint shell wrapper


    ```

    #!/bin/bash

    java -jar ~/bin/rhino/js.jar ~/bin/jslint.js $1

    ```


    ### JSMin


    It''s a fact of life for JavaScript programmers that our programs are downloaded
    in source form to the user''s web browser. This can be done more quickly through
    minification. JSMin performs a number of actions on a file, such as removing comments
    and whitespace. After running JSMin, files generally are about 30% of their original
    size. This means fewer bytes have to be transmitted to the client.


    JSMin is a one-way process, so make sure you have a copy of your files around.
    It also should not be used in development, as it makes debugging very difficult.
    And before running JSMin, make sure to run JSLint.


    ### JSBeautifier


    If your JavaScript code tends to get messy, JSBeautifier is a good tool to know
    about. It takes a JavaScript file and reformats it according to some basic rules.
    You can run this from the website or using Rhino from a command line on your desktop.
    All the JavaScript code in this book was formatted with this tool.


    JSBeautifier can take a number of command-line options to specify indentation
    style and bracket style. Indentation can be tabs or spaces. The -i option controls
    indentation level.


    JSBeautifier can also format JSON strings. Since it is written in JavaScript,
    you can embed it in any JavaScript programs. If you need to display a JSON structure
    from some point to a user, you can use this library to pretty-print it (see Example
    A-2).


    # Example A-2. JavaScript pretty printer


    ```

    #!/bin/bash


    cp $1.bak

    export WORKING_DIR=`pwd''

    cd ~/bin/js-beautify


    java -jar ~/bin/rhino/js.jar beautify-cl.js -d ~/bin/js-beautify \

    -i 1 -b -p $WORKING_DIR/$1 > /tmp/$1


    m /tmp/$1 $WORKING_DIR/$1

    ```


    ## Emacs JS2 mode


    JS2 mode is a very nice framework for JavaScript editing. For those who already
    live in Emacs, this is very helpful.


    ## Aptana


    For those who wish to have a full IDE to develop JavaScript in, Aptana is a good
    choice. Aptana is a version of Eclipse customized for JavaScript. It has a lot
    of options that can be customized.

    '
