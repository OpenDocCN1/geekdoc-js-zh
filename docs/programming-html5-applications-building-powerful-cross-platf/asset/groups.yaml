    \ 将 blob 视为一段原始数据。JavaScript 对 blob 可以执行的实际操作量是有限的。然而，blob 对于移动二进制数据非常重要。blobs\
    \ 可以被读取和写入文件（见第 69 页的“处理文件”）、作为 URL、保存在 IndexedDB 中（见第 5 章），并与 Web Worker 之间传递（见第\
    \ 8 章）。\n\n你可以使用 `BlobBuilder` 接口创建一个新的 blob。这创建了一个基础的空 BlobBuilder，可以在其中追加字符串、现有的\
    \ blob 或来自 `ArrayBuffer` 的二进制数据。`BlobBuilder.getBlob()` 方法返回实际 blob。\n\n从第 6 版本开始，Firefox\
    \ 中的 `BlobBuilder` 被称为 `MozBlobBuilder`，在 Safari Night kids 和第 8 版 Chrome 中称为\
    \ `WebKitBlob Builder`。\n\n在示例 6-1 中，PNG 数据被传递给 `BlobBuilder` 对象以创建一个 blob，然后将其转换为\
    \ URL。URL 对象可以设置图像标签的 `src` 属性以显示 DOM。\n\n示例 6-1. 从原始数据创建 blob\n\n```javascript\n\
    /*global window, $, BlobBuilder, document, XMLHttpRequest */\n/*jslint onever:\
    \ false, white: false */\n\nfunction makePNG(pngData)\n{\n  var BlobBuilder =\
    \ window.BlobBuilder || window.MozBlobBuilder ||\n  window.WebKitBlobBuilder;\n\
    \n  var blob = new BlobBuilder();\n  blob.append(pngData);\n  var url = blob.getBlob('image/png').createObjectURL();\n\
    \  return url;\n}\n```\n\n## 处理文件\n\n多年来，HTML 表单一直能够包含文件。`FileList` 的每个元素都是 `File`\
    \ 对象。`File` 对象为用户提供文件名、MIME 类型、大小和修改时间。出于安全原因，完整路径不会在 JavaScript 中暴露。\n\n通过使用\
    \ `FileReader` 接口，你的程序可以读取文件内容。所有方法都返回 `void`，数据将在浏览器完成读取文件到内存后通过 `onload` 处理程序传递。这种异步操作是非常重要的，因为大文件读取到浏览器可能需要一些时间。\n\
    \n`FileReader` API 有四种读取数据的选项：\n\n- `readAsDataURL()`：将文件转换为可以在页面使用的 URL。生成的对象将包含文件的完整数据。\n\
    - `readAsText()`：将数据作为字符串返回。默认情况下，文本编码为 UTF-8，但你可以指定不同的格式。\n- `readAsBinaryString()`：将数据作为二进制字符串返回，不尝试解释内容。\n\
    - `readAsArrayBuffer()`：将数据作为 `ArrayBuffer` 返回。\n\n"
