    HTML5 还通过 `<audio>` 和 `<video>` 标签为音频和视频提供了新的支持。对于任何使用过 HTML `<img>` 标签的人来说，这些标签会很熟悉，因为音频源或视频源都是
    `src` 属性。音频和视频还可以通过控制 JavaScript 控制并使用 CSS 进行样式设置。


