    \ 不支持。其次，许多 HTML 接口仅存在于特定的浏览器或版本。例如，书中提到的许多 JavaScript 接口仅存在于特定的浏览器。因此，测试必须能够适应这些差异，并在需要时处理降级情况。\n\
