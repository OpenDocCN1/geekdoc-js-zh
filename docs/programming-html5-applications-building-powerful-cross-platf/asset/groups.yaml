    \ of Ajax calls, it would also be possible to change this code to send the queue\
    \ items in groups of, say, five at a time.\n\n## IndexedDB\n\nThe localStorage\
    \ interface (see Chapter 4) provides a very nice interface for storing small amounts\
    \ of data, the browser limits this storage space to 5 MB in many cases. If the\
    \ storage needs of an application go beyond that, or if the application needs\
    \ to have query access to structured data, local storage is not the best choice.\
    \ In this case, having a more robust storage mechanism can be useful for the application.\
    \ IndexedDB provides this mechanism on many browsers. For example, a programmer\
    \ may store product catalog data into an IndexedDB store so that when the user\
    \ searches for an item, the server does not need to make a trip to the server\
    \ to find the data for a particular item. IndexedDB is a NoSQL database that feel\
    \ familiar to people who have used products as Mongo or CouchDB. A program can\
    \ store JavaScript objects directly into an IndexedDB store.\n\nIndexedDB has\
    \ been in Firefox starting with version 4. It was also introduced into Google\
    \ Chrome starting with version 11. Microsoft has a version online at HTML5 Labs\
    \ website as an ActiveX control, which can be added into IE, and probably it will\
    \ be in the main IE release at some point. It will be available in other browsers\
    \ in the next year or so. Formally, IndexedDB is now a draft proposal from the\
    \ W3C.\n\n![](/3a2d3586be95b30d9b98b5411d3c2bc4_72_0.png)\n\nIndexedDB is supported\
    \ by only two browsers at this point, use should be restricted to internal applications\
    \ where you can limit use to browsers of your choice. Using it in a general app\
    \ should be done with extreme caution, as Microsoft Internet Explorer, Opera,\
    \ and Safari do not support this feature (at as of November 2011).\n\nlike localStorage,\
    \ IndexedDB has a strict same-origin policy. So a database created by one page\
    \ cannot be accessed by pages on other hosts. This provides a level of security\
    \ for data, in that it is protected by scripts running on other pages. But any\
    \ script\n"
  mdcn: "\n在构建 ETag 时，请确保使用良好的哈希函数。MD5 可能是最好的选择。SHA1 也可以使用，但由于它生成的字符串较长，可能不划算。在理论上，可能会发生\
    \ MD5 冲突，但在实践中，对于缓存控制来说可能不是需要担心的事情。\n\n`localStorage` 对象中的数据可以在 Chrome 后台被更改。正如我已经解释过的，用户可以从\
    \ Chrome 开发者工具或 Firebase 命令行界面更改数据。也可能因为用户打开了两个指向同一个应用的浏览器而意外发生。对于存储器来说，监听来自 `localStorage`\
    \ 对象的更新事件至关重要。\n\n大部分工作在 `beforeload` 事件处理程序中完成。该处理程序检查数据存储中是否有数据的缓存，如果存在，它也会重新加载数据，但将使用\
    \ `Function.defer()` 方法延迟加载，直到系统可能已经完成网页加载的时间，这样加载过程就不可能干扰到用户。\n\n`store.doConditional()`\
    \ 方法向服务器发送 Ajax 请求以加载数据。它包含了 `If-None-Match` 请求头，这样如果数据没有变化，它将加载当前数据。它还包含一个 `force`\
    \ 选项，该选项会使 `beforeload` 处理程序激活新数据，而不是尝试从 `localStorage` 对象的缓存版本中刷新存储器。\n\n我通常为\
    \ `SECOND`、`MINUTE` 和 `HOUR` 定义常量，是为了让代码更具可读性。\n\n示例 4-6. Ext.data.PreloadStore\n\
    \n```javascript\nExt.extend(Ext.data.PreloadStore, Ext.data.JsonStore, {\n  indexKey:\
    \ '',\n});\n\n//默认索引键\nloadDefer: Time.MINUTE,\n// 如何延迟加载数据\nlisteners: {\n  function\
    \ load(store, records, options) {\n    var etag = this.reader.etag;\n    var jsonData\
    \ = this.reader.jsonData;\n    var data = {\n      etag: etag,\n      date: new\
    \ Date(),\n      data: jsonData\n    };\n    sessionStorage[store.indexKey] =\
    \ Ext.encode(data);\n  }\n});\n```\n\n```javascript\nbeforeLoad: function beforeLoad(store,\
    \ options)\n{\n  var data = sessionStorage[store.indexKey];\n  if (data === undefined\
    \ || options.force)\n  {\n    return true; // 缓存未，从服务器加载\n  }\n  var raw = Ext.decode(data);\n\
    \  store.loadData(raw.data);\n  // 延迟重新加载数据\n  store.doConditionload.defer(store.loadDefer,\
    \ store, [raw.etag]);\n  return false;\n},\n\ndoConditionload: function doConditionload(etag)\n\
    {\n  this.proxy.headers[\"If-None-Match\"] = etag;\n  this.load({\n  force: true\n\
    \  });\n\nforceload: function ()\n{\n  // 传入一个伪造 ETag 以强制加载\n  this.doConditionload('');\n\
    });\n```\n\n## 存储更改以备后续服务器同步\n\n在应用可能离线使用或在不稳定的 Internet 连接上的情况下，为用户提供一种保存更改而无需实际需要网络的方法将非常有用。要做到这一点，将每条记录的更改写入\
    \ `localStorage` 对象中的队列中。当浏览器在线时，可以将队列推送到服务器。这类似于数据库中使用的事务日志。\n\n保存队列可能像示例 4-7\
    \ 那样。队列中的每条记录代表在服务器上执行的操作。具体格式将取决于特定应用程序的需求。\n\n示例 4-7. 保存队列数据\n\n```json\n{\n\
    \  \"url\": \"index.php\",\n  \"params\": {}\n},\n{\n  \"url\": \"index.php\"\
    ,\n  \"params\": {}\n}\n```\n\n```json\n{\n  \"url\": \"/index.php\",\n  \"params\"\
    : {}\n}\n```\n\n一旦 Web 浏览器在线，就需要处理队列中的项目。示例 4-8 获取队列并将第一个元素发送到服务器。如果请求成功，它将获取下一个元素并继续遍历队列，直到队列发送完毕。即使队列很长，这个过程对用户来说也只会以最小的精力执行，因为\
