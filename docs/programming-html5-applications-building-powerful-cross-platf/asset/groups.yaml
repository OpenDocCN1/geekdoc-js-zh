  - "[PAGE 73]\n\nrunning on the page that created the database has full access to\
    \ the database, and of course the user has access to the data.\n\nIndexedDB has\
    \ several advantages over SQLite. First, its native data storage format is a JavaScript\
    \ object. There is no need to map a JavaScript object into a SQL table structure,\
    \ which is always a poor fit and can allow SQL injection attacks. Injection attacks\
    \ can't happen on IndexedDB, in some cases XSS could be a problem, if a user manages\
    \ to inject JavaScript into the store and have it put back into a page.\n\nThe\
    \ IndexedDB data store provides a set of interfaces to store JavaScript objects\
    \ on a local disk. Each object must have a key by which objects can be retrieved,\
    \ and may also have secondary keys.\n\nLike many native JavaScript interfaces,\
    \ IndexedDB turns out to be very verbose and a bit of pain to use. However, like\
    \ many other JavaScript interfaces, it has been wrapped into a new API in the\
    \ form of a jQuery plug-in. This chapter will show all examples using that plug-in\
    \ because the code is much easier to understand than the raw IndexedDB interface,\
    \ and this is how I would recommend using IndexedDB if you have a choice in the\
    \ market.\n\nI will show a number of examples around a theoretical book search\
    \ application. Each line of data will be formatted like Example 5-1. We will also\
    \ create indexes on various fields to show how they are used.\n\nExample 5-1.\
    \ Example data record\n\n```\n{\n  \"title\": \"Real World Haskell\",\n  \"price\"\
    : 49.95,\n  \"price_can\": 49.95,\n  \"authors\": [\n    \"Bryan O'Sullivan\"\
    ,\n    \"John Goerzen\",\n    \"Don Stewart\"\n  ],\n  \"cover_animal\": \"Rhinoceros\
    \ Beetle\",\n  \"cover_url\": \"http://...\",\n  \"topics\": [\"Haskell\"]\n}\n\
    ```\n\nIndexedDB keeps applications and related data stores in sync as they evolve,\
    \ through each data store has a version that an application can check a built-in\
    \ version when it loads. If the version is not current, the application can then\
    \ take appropriate actions to make it current by creating new object stores and\
    \ indexes. The jQuery IndexedDB interface will increment the version as needed\
    \ when changes to the structure happen, so this is now handled automatically.\n\
    \nVersions will be changed when a new data store is being added, or an index is\
    \ being added. When an index or store is removed, a version must also be changed.\
    \ The jQuery IndexedDB module will do this automatically. Simply having an application\
    \ check that"
