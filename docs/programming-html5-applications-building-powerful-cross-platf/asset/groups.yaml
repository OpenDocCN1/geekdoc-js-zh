    xIter(range[0].x, range[1].x, startX);

    ```


    The final part of this application is the actual mathematical computation of the
    Mandelbrot set. This function is done as a loop instead of a pure function in
    "Functional Programming" on page 13, because JavaScript does not support tail
    recursion. Doing this as a recursive function would be more elegant, but would
    cause a stack overflow.


    Example 8-5. Mandelbrot computation


    ```

    Complex.prototype.mandelbrot_iteration = 255 * 2;

    Complex.prototype.mandelbrot = function() {

    var x0 = this.x;

    var y0 = this.y;

    var x = x0;

    var y = y0;

    var count;

    var x_, y_;

    var max_iteration = this.max_iteration;

    function in(x, y) {

    return x * x + y * y < 4;

    }

    count = 0;

    while (count < max_iteration && in(x, y)) {

    x_ = x * x - y * y + x0;

    y_ = 2 * x * y + y0;

    count += 1;

    x = x_;

    y = y_;

    }

    return count;

    };

    ```


    While the worker is doing the calculation of the Mandelbrot set, its main event
    is blocked. So it is not possible for the UI process to send it a new computation
    task, or more correctly stated, the worker will not accept the new task until
    the current task is finished.'
  - '[PAGE 107]


    To interrupt or change a worker''s behavior—for instance, to let the user in the
    user interface thread select which area of the Mandelbrot set to draw and request
    that the worker draw that area—you have a choice among few methods.


    The simplest method would be to kill the worker and create a new one. This has
    the advantage that the new worker starts off on a clean state and there can be
    nothing left over from the prior runs. On the other hand, it also means the worker
    has to load all the scripts and data from scratch so if the worker has a long
    startup time, this is probably not the best approach.


    The second method is a little more complex: manage the task manually through your
    program. Have a data structure in the main thread or a worker that keeps a list
    of blocks of data to compute. When a worker needs a task, it can send a message
    to the queue object and have it sent to it. This creates more complexity but has
    several advantages. First, the worker does not need to be restarted when the application
    needs it to do something different. Second, it allows the use of multiple workers.
    Each worker can query the queue manager when it needs the next part of the problem.


    You could also have the master send a large number of events to the worker in
    sequence. This has the problem that there is no way from JavaScript to create
    the event queue. Having a job queue that can be managed seems to be the best approach.
    We''ll explore this in the following section.


    There is no requirement that an application restrict itself to one Web Worker.
    JavaScript is quite happy to let you start a reasonable number of workers. Of
    course, this makes sense only if the problem can be easily partitioned into several
    workers, but many problems can be divided that way.


    Each worker is an independent construction, so it is possible to create several
    workers from the source code, or to create several workers that work independently.


    Workers are a fairly heavy construct in JavaScript, so it is probably a bad idea
    to create more than, say, 10 workers on a given task. The optimal number is probably
    dependent on the user''s browser and hardware as well as the task to be performed.


    # Testing and Debugging Web Workers


    Over the past 10 years, the tools for JavaScript debugging have gotten quite good.
    Firefox and Chrome Developer tools both are first-rate debugging tools that can
    be used for testing JavaScript applications. Unfortunately, neither can access
    code running in a Web Worker. So you can''t set breakpoints or step your code
    in a worker. Nor do workers show up in the list of loaded scripts that appear
    in the respective script tags of Firebug and Chrome. Nor can Selenium or QUnit
    directly test code running in a Web Worker.'
