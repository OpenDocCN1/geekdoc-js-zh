    \ 基础命令不包含条件或循环功能。Selenium HTML 文件从上到下顺序执行，在断言失败或执行最后一个命令时停止。如果你需要流程控制，请使用 `goto_sel_id.js`\
    \ 插件。\n\n在寻找长时间运行的应用可能出现的内存泄漏或其他问题时，该插件非常有用。JavaScript 仍然有一种方法可以避免在频繁刷新页面时不是问题的内存泄漏，即将\
    \ JavaScript 状态重置为 DOM。\n\nSelenium 中大量的命令可以用于构建测试。Selenium IDE 包含了命令引用，因此一旦掌握了一些基础知识，就可以轻松找到任何特定情况下的命令。表\
    \ 3-1 显示了一些常见的 Selenium 命令。它们倾向于分为两组：动作（actions）和断言（assertions）。动作包括 `click`、`type`、`dblclick`、`keydown`、`keyup`\
