    # 调试清单文件 (Manifest Files)


    清单文件带来了特殊的调试挑战。它们可能是几类特殊漏洞的根源。


    第一个也是最明显的错误是在清单文件中包含了缺失的文件。如果一个文件被包含在页面中但不在清单文件中，它将不会被页面加载，就像服务器上缺失的文件不会被下载一样。


    许多 Selenium 测试不会显式地测试样式是否正确以及图像是否存在，因此应用程序的 CSS 文件或图像在 Selenium 测试的范围内可能仍然可以工作。在包含来自
    Web 服务器外部资源的应用程序中，这些资源也必须在清单文件中加入白名单。


    进一步的复杂性源于某些浏览器（包括 Firefox），这些浏览器将清单文件设为一种可选功能（opt-feature）。因此，Selenium 测试可能不会开启它，这会导致整个测试失去意义。为了在
    Firefox 中测试这一点，有必要设置一个默认启用应用程序缓存的 Firefox 配置文件。操作如下：


    - 1. 完全退出 Firefox。

