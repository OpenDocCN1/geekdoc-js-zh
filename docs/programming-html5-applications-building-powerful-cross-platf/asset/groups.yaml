    \ # Microdata\n\nSometimes it is useful to add machine-readable data to a set\
    \ of HTML tags. For example, you can use this procedure in a template to encode\
    \ data into a page that can be read by JavaScript. To enable such procedures in\
    \ a standardized way, HTML5 created the concept of *microdata*, which can be added\
    \ to HTML5 tags.\n\nTraditionally, HTML tags give data about how information is\
    \ formatted on screen, but not about the data itself. A program can look at an\
    \ `<li>` tag and know it is an item in a list, but not what kind of list. Is it\
    \ a list of books for sale, or people who attended an event? By adding microdata\
    \ it is possible to give context to data, which can be used later programmatically.\n\
    \nIn general, microdata tags will probably be used in web pages more than in applications,\
    \ but applications that run as plugins-ins to a page, or administer a page in\
    \ other ways, may be called to use microdata. One can imagine an HTML5 application\
    \ that serves as an administrative panel for a company's website and offers spaces\
    \ where a sales manager could put in microdata tags that give items for sale a\
    \ context for Google Search or for JavaScript programs from an external vendor\
    \ that may be added to a web page.\n\nIn truth, microdata is pretty simple: just\
    \ a few extra attributes with standardized names attached to HTML tags, and some\
    \ interfaces to work with that data attribute.\n\nTo designate a section of a\
    \ page that will use microdata, give the enclosing element `itemscope`. The vocabulary\
    \ for the microdata is defined by using the `itemtype`"
