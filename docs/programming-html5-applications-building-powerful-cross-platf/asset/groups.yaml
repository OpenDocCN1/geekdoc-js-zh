    \ elements that are loaded by QUnit to display its results. These can be in the\
    \ bottom of the HTML in Example 3-3. That is all that is required to run tests.\n\
    \nQUnit provides eight assertion functions. In addition to equal(), which appeared\
    \ in our previous example, there are further tests of equality and the ok() method,\
    \ which tests whether the value passed to it is true. Also, strictEqual() tests\
    \ according to the JavaScript \"===\" operator, whereas equal() uses the \"==\"\
    \ operator for comparison. To test a more complex data structure is this, use\
    \ deepEqual(). This does a recursive comparison of the two data structures.\n\n\
    Each equality function has an inverted form that will test for lack of equality:\
    \ notEqual(), notStrictEqual(), and notDeepEqual(). These take the same parameters\
    \ as the equal versions but test for the inverted cases."
  - '[PAGE 44]


    The final assertion is **raises()**, which takes a function as a parameter and
    expects it to throw an error conditon.


    To test events that happen in an asynchronous manner, it won''t work simply to
    make a change and return a value. In this case, the test must wait for the action
    to complete. This can be done by setting timeout with `setTimeout()`, which will
    run after a set time. Or it be done by a callback from some operation, such as
    an Ajax load or other event.


    # # Selenium


    While QUnit lets you JavaScript code, Selenium takes a different approach. Selenium
    tests the user interface by simulating the actions a user may take. Selenium test
    will consist of a number of steps that run in a browser, such as loading a page,
    clicking on a particular element, typing something into a text area, and so on.
    interspersed with these actions will be assertions to verify the state of the
    DOM or other things to be tested. These can include testing an element that exists
    or is absent.


    When a Selenium test run it will actually launch a browser and run it in more
    or less the same way that the user would. So it is possible to watch the test
    interacting with the browser. It is even possible to manually interact with the
    browser while a test is running (which may not be a great idea).


    Selenium consists of several, mostly independent parts. One is IDE implemented
    as a browser plug-in for Firefox. Another is the RC server, seleniumrc, a Java
    server that can be used to automate running tests in different browsers.


    The Selenium IDE plug-in for Firefox is a developer''s best friend. It allows
    you to construct tests that are run directly in the browser. The IDE can record
    the user''s actions and replay them as a test later. It also allows you step through
    a test line one at a time, which can be very useful for finding timing problems
    in a test.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_44_0.png)


    By default, when recording actions, the Selenium IDE will use the IDs of the various
    HTML elements. When IDs are not explicitly assigned by the programmer, some frameworks
    will assign IDs sequentially as elements are created. These IDs will not be consistent
    from run to run, or use some other method to identify elements of interest.


    The Selenium IDE outputs tests as HTML files that can run in the IDE itself in
    Firefox. In addition, these HTML files can be run with the Selenium RC component
    as a batch job. The Selenium RC server will also allow the HTML tests to run with
    any browser, so it is possible to run these tests with IE, Chrome, Opera, or Safari.
    The Selenium RC server can also be controlled by a traditional test from a something
    like PHPUnit or JUnit.'
  - '[PAGE 45]


    The Selenium IDE also is useful for recording web macros in development. For example,
    if you are testing a wizard in your web application that displays four or five
    screens before the screen is being debugged, you can use the IDE to create a Selenium
    script that you can invoke as a macro to get automatically to the point being
    tested.


    +   If a test works when it is run in single-step mode but not during normal execution,
    it needs a few pause statements to allow the browser to catch up, or even better,
    waitFor... statements, which will allow the test to be in sync.


    There are three ways to run tests in Selenium: via the Selenium IDE, the RC runner,
    and from a programming language. The IDE is easy to use in an active setting,
    but works only with Firefox. The test runner accepts inputs in HTML format, which
    can be created in the IDE. Finally, it is possible to write tests in a test framework
    in the programming language as PHPUnit. Using the test runner or the programming
    language-based test suite allows with a full suite of browsers and can provide
    reporting and other functions. This procedure can also be integrated with continuous
    integration tools along with any other tests written in any of the XUnit frameworks.


    A Selenium test is constructed from an HTML file containing a table, with each
    test being a row in the table. The row consists of three columns: the command
    to run, the element it will act, and an optional parameter used in some cases.
    For example, the third column contains the text to type into an input element
    while testing a form.


    Unlike a JUnit test, a Selenium test is all about the user interface. Thus, Selenium
    is more about integration testing than unit testing. To test Example 3-3 in Selenium,
    a different approach is required from JUnit. While the JUnit test calls the handler
    function directly Selenium clicks the button and waits for


    This is illustrated in Example 3-5. Each row in the document performs an action
    as part of the test. The first row opens the page to test, then the second line
    clicks the button (which is identified by the ID). The test then waits for the
    page to display the <div>, identified in this case through XPath.


    This tests the same simple script as the JUnit test shown in the previous section.
    However, instead of testing the function itself, it tests the user interface similar
    to how a human tester may do. It opens the page and clicks on the click_me button.
    It waits for the target_div to be present in the DOM. It then asserts that the
    word First appears in the page.'
