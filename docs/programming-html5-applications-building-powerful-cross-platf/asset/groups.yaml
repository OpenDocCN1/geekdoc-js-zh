- md: "\n## YSlow\n\nIn a large web application, it is not unusual for loading to\
    \ go slowly. If this is happening, you can use YSlow along with Firebug to find\
    \ out where bottlenecks are. The tool goes along with High Performance Web Sites\
    \ by Steve Souders (O’Reilly), who also created YSlow. It covers much more than\
    \ JavaScript, because it shows when each file is transmitted as part of the web\
    \ page.\n\n## FireRainbow\n\nFireRainbow is a Firebug-plugin that colorizes JavaScript\
    \ in the Firebug script tab. It’s a very nice way to make code easier to read\
    \ in the debugger.\n\n## Speed Tracer\n\nSpeed Tracer is a Google Chrome plug-in\
    \ that lets you know the browser is spending time on. Before you spend a few days\
    \ optimizing JavaScript, find out if it actually helps. If CSS is the real bottleneck,\
    \ this will tell you!\n\n## CoffeeScript\n\nCoffeeScript is a new language that\
    \ uses JavaScript as a compile target. If you run functional programming, this\
    \ should interest you. It has been a solid following of lately. There are several\
    \ CoffeeScript books out or in the works. CoffeeScript claims to produce code\
    \ that will always pass JSLint validation.\n\n## ClojureScript\n\nIf you like\
    \ Lisp, check out ClojureScript, which is a compiler that will compile the Clojure\
    \ dialect of Lisp into JavaScript. It comes from Rich Hickey, who created Clojure.\n\
    \n## Rhino\n\nRhino is a Java-based JavaScript implementation. If you want to\
    \ build tools to run on a command line in JavaScript, this is the tool for the\
    \ job. A number of JavaScript programs, such as JSLint, will run under Rhino as\
    \ well as the browser. In addition, Rhino can be used to allow JavaScript to script\
    \ Java objects, which can be pretty useful.\n\n## Node.js\n\nNode.js is a new\
    \ server-side platform under development as of this writing. It uses the JavaScript\
    \ event loop to create a nonblocking server that can handle a great number of\
    \ requests very efficiently. Watch this project for cool things in the future.\n\
