    \ // Give it a recurser name\nArray.prototype.stddev = Array.prototype.standardDeviation;\n\
    ```\n\n## You Can Extend Objects, Too\n\nIf you like the map function in arrays\
    \ and wish you had that for objects as well, there is no reason why you not add\
    \ it. It is possible to build a map function that will not visit only the nodes\
    \ of a JavaScript object, but also recursively apply a function to each of its\
    \ subunits. This can be very useful for turning a data structure into form of\
    \ a node tree. Example 2-23 checks to see whether the user's browser has already\
    \ defined map() and filter() for the object being assigned to, and then defines\
    \ the functions necessary.\n\n### Example 2-23. Extending map and filter to objects\n\
    \n```javascript\nif (Object.prototype.map === undefined) {\n  Object.prototype.map\
