  mdcn: "\n\n## YSlow\n\n在大型 Web 应用程序中，加载缓慢并不稀见。如果出现这种情况，你可以一起使用 YSlow 配合 Firebug\
    \ 来找到瓶颈所在。该工具随 Steve Souders（O’Reilly 出版）的《高性能网站》（High Performance Web Sites）一书推出，作者也创建了\
    \ YSlow。它涵盖的内容远超 JavaScript，因为它展示了每个文件何时作为网页的一部分进行传输的。\n\n## FireRainbow\n\nFireRainbow\
    \ 是一个 Firebug 插件，可以为 Firebug 脚本标签页中的 JavaScript 着色。这是一种在调试器中让代码更易读的极方法。\n\n##\
    \ Speed Tracer\n\nSpeed Tracer 是一个 Google Chrome 插件，可以让你知道浏览器把时间花在了哪里。在你花费几天时间优化\
    \ JavaScript 之前，先看看它是否真的有效。如果 CSS 是真正的瓶颈，这个工具会告诉你！\n\n## CoffeeScript\n\nCoffeeScript\
    \ 是一种使用 JavaScript 作为编译目标的新语言。如果你运行函数式编程，这会对你产生兴趣。它拥有一批忠实的跟随者。目前已有几本 CoffeeScript\
    \ 的书籍出版或正在编写中。CoffeeScript 声称生成的代码将始终通过 JSLint 验证。\n\n## ClojureScript\n\n如果你喜欢\
    \ Lisp，请查看 ClojureScript，它是一个将 Lisp 的 Clojure 方言编译为 JavaScript 的编译器。它来自 Clojure\
    \ 的创始人 Rich Hickey。\n\n## Rhino\n\nRhino 是一个基于 Java 的 JavaScript 实现。如果你想构建在命令行运行\
    \ JavaScript 的工具，那么这个工具就是胜任的。许多 JavaScript 程序（如 JSLint）可以在 Rhino 中以及浏览器中运行。此外，Rhino\
    \ 还可以允许 JavaScript 编写 Java 对象，这非常有用。\n\n## Node.js\n\nNode.js 是编写本文时正在开发的新服务器端平台。它利用\
