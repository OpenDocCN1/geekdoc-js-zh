  - "[PAGE 32]\n\nYou could just quietly choose to run it, or to throw an exception,\
    \ as needed by the application.\n\nOn the flip side, it is also possible to create\
    \ a method to a function that will cause it to execute after a delay, or periodically.\
    \ Often, a task needs to run after an event but should not run too often. For\
    \ instance, you might want to check what a user is typing, but running the check\
    \ after every keystroke would be excessive. Setting up a method that will run\
    \ once every 250 ms would make sense.\n\nThere are two approaches to this. First,\
    \ you could run the method and not allow it to run until the required time has\
    \ passed. Or you could create a method that will run at some time interval after\
    \ it is called, and reset the timer when called. This pattern is useful if the\
    \ objective is to have something run when the user stops typing or when some other\
    \ set of events occurs. In practice, a new method would act as a wrapper around\
    \ the basic JavaScript setTimeout() and setInterval() methods, but make their\
    \ use more convenient. It is also possible to create a method that will schedule\
    \ a future task and cancel an existing task if it has already been scheduled.\n\
    \n# Currying and Object Parameters\n\nIn functional programming, one common programming\
    \ model is currying a function. Named for a feature of Haskell, currying refers\
    \ to the practice of combining several parameters into a single object so you\
    \ can pass them to a function as a single parameter. If a function needs to take\
    \ a large number of parameters, it is often best in JavaScript to curry the long\
    \ parameter list and take a single object as a parameter. By using an object as\
    \ the parameter, you can turn all the options into name/value pairs. One benefit\
    \ of so is that the ordering of arguments becomes irrelevant. Furthermore, you\
    \ can make some or all of the parameters optional. For complex methods accepting\
    \ many parameters, this can be a great help. In particular, it is often useful\
    \ for some of the object creation methods in ExtJS.\n\nThe easiest way to curry\
    \ parameters is to create a function that takes a parameter block and returns\
    \ a function that will call the original function with the presupplied parameters\
    \ as defaults (see Example 2-15). This way, you can establish a set of defaults\
    \ that you don't have to specify each time, while allowing callers to change any\
    \ parameters they want.\n\nExample 2-15. Curry example\n\n```\nFunction.prototype.curry\
    \ = function FunctionCurry(defaults) {\n  var fn = this;\n  return function(params)\
    \ {\n    return fn.apply(this, defaults.concat(params));\n  }\n};\n```"
  - "[PAGE 33]\n\nThis pattern can also be applied to object creation. For an object\
