- md: "\nrunning on the page that created the database has full access to the database,\
    \ and of course the user has access to the data.\n\nIndexedDB has several advantages\
    \ over SQLite. First, its native data storage format is a JavaScript object. There\
    \ is no need to map a JavaScript object into a SQL table structure, which is always\
    \ a poor fit and can allow SQL injection attacks. Injection attacks can't happen\
    \ on IndexedDB; in some cases XSS could be a problem, if a user manages to inject\
    \ JavaScript into the store and have it put back into a page.\n\nThe IndexedDB\
    \ data store provides a set of interfaces to store JavaScript objects on a local\
    \ disk. Each object must have a key by which objects can be retrieved, and may\
    \ also have secondary keys.\n\nLike many native JavaScript interfaces, IndexedDB\
    \ turns out to be very verbose and a bit of pain to use. However, like many other\
    \ JavaScript interfaces, it has been wrapped into a new API in the form of a jQuery\
    \ plug-in. This chapter will show all examples using that plug-in because the\
    \ code is much easier to understand than the raw IndexedDB interface, and this\
    \ is how I would recommend using IndexedDB if you have a choice in the market.\n\
    \nI will show a number of examples around a theoretical book search application.\
    \ Each line of data will be formatted like Example 5-1. We will also create indexes\
    \ on various fields to show how they are used.\n\nExample 5-1. Example data record\n\
    \n```\n{\n  \"title\": \"Real World Haskell\",\n  \"price\": 49.95,\n  \"price_can\"\
    : 49.95,\n  \"authors\": [\n    \"Bryan O'Sullivan\",\n    \"John Goerzen\",\n\
    \    \"Don Stewart\"\n  ],\n  \"cover_animal\": \"Rhinoceros Beetle\",\n  \"cover_url\"\
    : \"http://...\",\n  \"topics\": [\"Haskell\"]\n}\n```\n\nIndexedDB keeps applications\
    \ and related data stores in sync as they evolve, through each data store has\
    \ a version that an application can check against a built-in version when it loads.\
    \ If the version is not current, the application can then take appropriate actions\
    \ to make it current by creating new object stores and indexes. The jQuery IndexedDB\
    \ interface will increment the version as needed when changes to the structure\
    \ happen, so this is now handled automatically.\n\nVersions will be changed when\
    \ a new data store is being added, or an index is being added. When an index or\
    \ store is removed, a version must also be changed. The jQuery IndexedDB module\
    \ will do this automatically. Simply having an application check that the various\
    \ objectStores and indices exist will ensure that the schema is correct. If an\
    \ index does not exist in Example 5-2 it will be created automatically.\n\nExample\
    \ 5-2. Creating an index\n\n```\n$.indexedDB(db).objectStore(objectStore).index(field);\n\
    ```\n\nInteractions with IndexedDB must be done by transactions. This is because\
    \ the IndexedDB itself is asynchronous, and IndexedDB can be accessed from a Web\
    \ Worker or a second window running another thread (each window in JavaScript\
    \ runs its own thread). So, even though simultaneous accesses will be rare, it\
    \ is possible for more than one JavaScript thread to access a given IndexedDB\
    \ database at the same time, and therefore one must protect against race conditions.\n\
    \nThe IndexedDB spec includes a synchronous version of the interface that can\
    \ be used in Web Workers, but it has not been implemented in browsers yet. In\
    \ addition, using it will mean that any code cannot be reused by a Web Worker\
    \ and non-Worker context.\n\nThe fundamental unit of data storage in IndexedDB\
    \ is the database. A database in IndexedDB is roughly comparable to a database\
    \ in a relational product like MySQL. Each IndexedDB database contains one or\
    \ more object stores, which can be considered equivalent to tables in a SQL database.\
    \ However, unlike a SQL database, an object store has no fixed schema.\n\nEach\
    \ record in an object store is a key/value pair, where the key is the primary\
    \ index and the value is a JavaScript object. Any JavaScript object that can be\
    \ serialized be inserted into the object store.\n\n> Closures and functions in\
    \ general cannot be stored in IndexedDB.\n\nThe first step in using IndexedDB\
    \ is to create a new database. To do that, just pick a name and request that it\
    \ be opened. If the database does not exist, it will be created. If it does exist,\
    \ it will be opened. The jQuery IndexedDB plug-in makes this easy: just name the\
    \ database:\n\n```\n$.indexedDB(db);\n```\n\nAfter opening a database, you need\
    \ to create a transaction object. The call creating this object will take a list\
    \ of object stores to be used, as well as an optional mode variable and timeout.\
    \ The mode variable can be IDTransaction.READ_ONLY, IDTransaction.READ_WRITE,\
    \ or IDTransaction.VERSION_CHANGE, the default being IDBTransaction.READ_ONLY.\
    \ The timeout is specified in milliseconds, or can be set to zero for timeout.\n\
    \nThe jQuery IndexedDB API implicitly creates a transaction for a simple operation,\
    \ so creating a transaction object as in Example 5-3 will be needed only if a\
    \ change involves more than one object store or is doing something strange. When\
    \ using iterating over a list of items to add map, forEach, or the like, make\
    \ sure all the data goes into the store in a consistent manner. When you finish\
    \ with transaction, transaction.done.\n\nExample 5-3. Using an explicit transaction\n\
    \n```javascript\nvar transaction = $.indexedDB(db).transaction([], IDTransaction.READ_WRITE);\n\
    transaction.done(function(){\n  transaction.objectStore(\"store-name\").add(data);\n\
    });\n```\n\n# Adding and Updating Records\n\nThe IndexedDB data store provides\
    \ a set of interfaces to store JavaScript objects on a local disk. Each object\
    \ must have a key by which objects can be retrieved, and may also have secondary\
    \ keys.\n\nLike many native JavaScript interfaces, IndexedDB turns out to be very\
    \ verbose and a bit of pain to use. However, like many other JavaScript interfaces,\
    \ it has been wrapped into a new API in the form of a jQuery plug-in. This chapter\
    \ will show all examples using that plug-in because the code is much easier to\
    \ understand than the raw IndexedDB interface, and this is how I would recommend\
    \ using IndexedDB if you have a choice in the market.\n\nI will show a number\
    \ of examples around a theoretical book search application. Each line of data\
    \ will be formatted like Example 5-1. We will also create indexes on various fields\
    \ to show how they are used.\n\nThe IndexedDB keeps applications and related data\
    \ stores in sync as they evolve, through each data store has a version that an\
    \ application can check against a built-in version when it loads. If the version\
    \ is not current, the application can then take appropriate actions to make it\
    \ current by creating new object stores and indexes. The jQuery IndexedDB interface\
    \ will increment the version as needed when changes to the structure happen, so\
    \ this is now handled automatically.\n\nVersions will be changed when a new data\
    \ store is being added, or an index is being added. When an index or store is\
    \ removed, a version must also be changed. The jQuery IndexedDB module will do\
    \ this automatically. Simply having an application check that the various objectStores\
    \ and indices exist will ensure that the schema is correct. If an index does not\
    \ exist in Example 5-2 it will be created automatically.\n\nExample 5-2. Creating\
    \ an index\n\n```javascript\n$.indexedDB(db).objectStore(objectStore).index(field);\n\
    ```\n\nInteractions with IndexedDB must be done by transactions. This is because\
    \ the IndexedDB itself is asynchronous, and IndexedDB can be accessed from a Web\
    \ Worker or a second window running another thread (each window in JavaScript\
    \ runs its own thread). So, even though simultaneous accesses will be rare, it\
    \ is possible for more than one JavaScript thread to access a given IndexedDB\
    \ database at the same time, and therefore one must protect against race conditions.\n\
    \nThe IndexedDB spec includes a synchronous version of the interface that can\
    \ be used in Web Workers, but it has not been implemented in browsers yet. In\
    \ addition, using it will mean that any code cannot be reused by a Web Worker\
    \ and non-Worker context.\n\nThe fundamental unit of data storage in IndexedDB\
    \ is the database. A database in IndexedDB is roughly comparable to a database\
    \ in a relational product like MySQL. Each IndexedDB database contains one or\
    \ more object stores, which can be considered equivalent to tables in a SQL database.\
    \ However, unlike a SQL database, an object store has no fixed schema.\n\nEach\
    \ record in an object store is a key/value pair, where the key is the primary\
    \ index and the value is a JavaScript object. Any JavaScript object that can be\
    \ serialized be inserted into the object store.\n\n> Closures and functions in\
    \ general cannot be stored in IndexedDB.\n\nThe first step in using IndexedDB\
    \ is to create a new database. To do that, just pick a name and request that it\
    \ be opened. If the database does not exist, it will be created. If it does exist,\
    \ it will be opened. The jQuery IndexedDB plug-in makes this easy: just name the\
    \ database:\n\n```javascript\n$.indexedDB(db);\n```\n\nAfter opening a database,\
    \ you need to create a transaction object. The call creating this object will\
    \ take a list of object stores to be used, as well as an optional mode variable\
    \ and timeout. The mode variable can be IDTransaction.READ_ONLY, IDTransaction.READ_WRITE,\
    \ or IDTransaction.VERSION_CHANGE, the default being IDBTransaction.READ_ONLY.\
    \ The timeout is specified in milliseconds, or can be set to zero for timeout.\n\
    \nThe jQuery IndexedDB API implicitly creates a transaction for a simple operation,\
    \ so creating a transaction object as in Example 5-3 will be needed only if a\
    \ change involves more than one object store or is doing something strange. When\
    \ using iterating over a list of items to add map, forEach, or the like, make\
    \ sure all the data goes into the store in a consistent manner. When you finish\
    \ with transaction, transaction.done.\n\nExample 5-3. Using an explicit transaction\n\
    \n```javascript\nvar transaction = $.indexedDB(db).transaction([], IDTransaction.READ_WRITE);\n\
    transaction.done(function(){\n  transaction.objectStore(\"store-name\").add(data);\n\
    });\n```\n\n# Adding Indexes\n\nIndexes can be added or removed only in a transaction.\
    \ An index can be created when a store is created, or later with the index() method\
    \ (see Example 5-6). This method will create the index if it does not. It will\
    \ also return an index object that can be used to iterate over the index.\n\n\
    Example 5-6. Using an index\n\n```javascript\n$.indexedDB(db).objectStore(objectStore).index(field).openCursor([1,10]).each(write);\n\
    ```\n\nOne difference between a data store like IndexedDB and most forms of data\
    \ storage is that IndexedDB runs on the customer’s browser, so updating it requires\
    \ a little more than a store mechanism that runs on a small set of servers in\
    \ a central location. It is possible to check the current version of a store on\
    \ the customer’s and, if needed, bring it to current version. For example, version\
    \ 1.0 of the software may have two stores, while in version 1.1 a third store\
    \ has been added, as well as a new index in the original tables. By checking the\
    \ version, your code can know if it should apply any needed updates or if the\
    \ user’s data store is set up correctly. The jQuery IndexedDB plug-in handles\
    \ this automatically.\n\n# Retrieving Data\n\nAfter data has been added to an\
    \ object store, there must be a way to query and display it. There are several\
    \ areas of interest to query data. The program may wish to display all the data,\
    \ a subset of the data, or just one row.\n\nTo retrieve one row, identified by\
    \ its primary key, use the get method as shown in Example 5-7. This method returns\
    \ a promise object which is accessed via the then method. The then takes two functions\
    \ as callbacks: the first is called on success with the object from the database,\
    \ and the second, in case of error, with an error object.\n\nExample 5-7. Get\
    \ one row\n\n```javascript\n$.indexedDB(db).objectStore(objectStore).get(primaryKey).then(wrap,\
    \ err);\n```\n"
  mdcn: "\n在创建数据库的页面上运行对数据库具有完全访问权限，当然，用户对数据拥有访问权限。\n\nIndexedDB 比 SQLite 有许多优势。首先，它的原生数据存储格式是\
    \ JavaScript 对象。不需要将 JavaScript 对象映射到 SQL 表结构，这种映射通常是非常不匹配的，并且可能允许 SQL 注入攻击。IndexedDB\
    \ 不会发生注入攻击；在某些情况下，如果用户成功将 JavaScript 注入到存储器并将其放入页面，可能会出现 XSS 问题。\n\nIndexedDB\
    \ 数据存储提供了一组接口，用于在本地磁盘上存储 JavaScript 对象。每个对象都必须有一个用于检索对象的键（key），也可以有次级键。\n\n与许多原生\
    \ JavaScript 接口一样，IndexedDB 事实证明非常繁琐，使用起来有点痛苦。然而，像许多其他 JavaScript 接口一样，它已经被封装成以\
    \ jQuery 插件形式存在的新 API。本章将展示使用该插件的所有示例，因为这些代码比原始 IndexedDB 接口易于理解得多，如果你在市场上上有选择，这就是我推荐使用\
    \ IndexedDB 的方式。\n\n我将展示许多围绕理论书籍搜索应用程序的示例。每行数据的格式将如示例 5-1 所示。我们还将各种字段上创建索引，以展示它们是如何使用的。\n\
    \n示例 5-1. 示例数据记录\n\n```\n{\n  \"title\": \"Real World Haskell\",\n  \"price\"\
    : 49.95,\n  \"price_can\": 49.95,\n  \"authors\": [\n    \"Bryan O'Sullivan\"\
