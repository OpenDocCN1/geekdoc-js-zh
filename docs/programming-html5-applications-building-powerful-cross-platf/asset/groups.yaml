    1\" border=\"1\">\n    <head>\n      <tr>\n        <td rowspan=\"3\">New Test</td>\n\
    \        <td></td>\n      </tr>\n    </head>\n    <tbody>\n      <tr>\n      \
    \  <td>open</td>\n        <td>/examples/simple.html</td>\n        <td></td>\n\
    \      </tr>\n      <tr>\n        <td>click</td>\n        <td>click_me</td>\n\
    \        <td></td>\n      </tr>\n      <tr>\n        <td>waitForElementPresent</td>\n\
    \        <td>/div[@id='target_div']</td>\n        <td></td>\n      </tr>\n   \
    \   <tr>\n        <td>assertTextPresent</td>\n        <td>First</td>\n       \
    \ <td></td>\n      </tr>\n    </tbody>\n  </table>\n  <!-- More tests -->\n\n\
    </body>\n</html>\n```\n\n## Selenium 命令\n\nSelenium 提供了一了一种丰富的命令语言称为 Selense，允许程序员创建测试。几乎任何用户在浏览器中可以执行的操作都可以通过\
    \ Selenium 命令来完成。你可以通过创建一个由一系列操作和测试组成的脚本来创建 Selenium 测试。\n\n从桌面拖动文件到浏览器（参见第 71\
    \ 页的“拖放”）是 Selenium 无法完成的操作之一，它也无法通过 QUnit 轻松测试。\n"
