    # Adding Indexes


    Indexes can be added or removed only in a setVersion transaction. An index can
    be created when a store is created, or later with the index() method (see Example
    5-6). This method will create the index if it does not exist. It will also return
    an index object that can be used to iterate over the index.


    Example 5-6. Using an index


    ```

    $.indexeddb(db).objectStore(objectStore).index(field).openCursor([1,10]).each(write);

    ```


    One difference between a data store like IndexedDB and most other forms of data
    storage is that IndexedDB runs on the customer’s browser, so updating it requires
    a little more than a store mechanism that runs on a small set of servers in a
    central location. The JavaScript code must be able to cope with the possibility
    that the user may have out-of-date store and update on the fly.


    It is possible to check the current version of a store on a customer’s and and,
    if needed, bring it to to current version. For example, version 1.0 of the software
    may have two stores, while in version 1.1 a third store has been added, as well
    as a new index in the original tables. By checking the version, your code can
    know if it should apply any needed updates or if the user’s data store is set
    up correctly. The jQuery IndexedDB plug-in handles this automatically.


    # Retrieving Data


    After data has been added to an object store, there must be a way to query and
    display it. There are several areas of interest to query data. The program may
    wish to display all the data, a subset of the data, or just one row.


    To retrieve one row, identified by its primary key, use the get method as shown
    in Example 5-7. This method returns a promise object which is accessed via the
    then method. The then takes two functions as callbacks: the first is called on
    success with the object from the database, and the second, in case of error, with
    an error object.


    Example 5-7. Get one row


    ```

    $.indexeddb(db).objectStore(objectStore).get(primaryKey).then(wrap, err);

    ```'
