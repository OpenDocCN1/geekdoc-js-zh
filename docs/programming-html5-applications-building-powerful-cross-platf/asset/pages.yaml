  md: 'The Selenium base commands do not include any capability for conditionals or
    loops. A Selenium HTML file runs sequentially from top to bottom, when an assertion
    fails or when the last command is executed. If you need flow control, use the
    goto_sel_id.js plug-in.


    This plug-in can be useful when looking for memory leaks or other problems that
    may occur in an application that runs for a long time. JavaScript still has a
    way to escape from the memory leaks that were not an issue when page reloads were
    frequent, resetting the JavaScript state to the DOM.


    A large number of commands in Selenium can be used to construct tests. The Selenium
    IDE contains a reference for commands, so once you have learned some of the basics,
    you can easily figure out the command for any given circumstance. Table 3-1 shows
    some of the common Selenium commands. They tend to come in two basic groups, actions
    and assertions. Actions include such as click, type, dblclick, keydown,keyup and
    more. Assertions perform the actual tests allow Selenium to find out how user
    actions affect the page. Assertions can pause a script but make no changes in
    the page.


    # Table 3-1. Selenium commands


    | Command | Target | Action |

    |---|---||

    | open | Web page to open | Opens a web page. |

    | dblclick | Element to double-click | Double-clicks an element. |

    | click | Element to click | Clicks an element. |

    | mouseOver | Element over which to move the mouse | Replicates a mouseOver event.
    |

    | mouseUp | Element over which to let up the mouse button | Replicates a mouseUp
    event. |

    | mouseDown | Element on which to press the mouse button down | Replicates a mouseDown
    event. |

    | type | An XPath or other kind of selector to choose the element; the third column
    is the text to type | Simulates text entry. |

    | windowMaxized | | Maximizes the current window. |

    | refresh | | Refreshes the browser. Can be useful for resetting JavaScript state.
    |


    In Jest, or any other widget, if a click event does not do what is expected, try
    using a mouseDown. To select a row in a grid, for example, the browser sends three
    events: mouseDown, mouseUp, and click. Different elements in a user interface
    may respond to any of them.'
