    {\n```\n\n```\nthis.proxy.headers[\"If-None-Match\"] = etag;\nthis.load({\n  force:\
    \ true\n});\n\nforceload: function ()\n{\n  // Pass in a bogus ETag to force a\
    \ load\n  this.doConditionload('');\n});\n```\n\n# # Storing Changes for a Later\
    \ Server Sync\n\nIn the event that an application may be used offline, or on a\
    \ flaky connection to the Internet, it can be nice to provide the user a way to\
    \ save her changes without actually needing the network to be present. To do this,\
    \ write the changes in each record to a queue in the localStorage object. When\
    \ the browser is online, the queue can be pushed to the server. This is similar\
    \ to a transaction log as used in a database.\n\nA save queue could look like\
    \ Example 4-7. Each record in the queue represents an action to take on the server.\
    \ The exact format will of be determined by the needs of a specific application.\n\
    \nExample 4-7. Save queue data\n\n```\n{\n  \"url\": \"index.php\",\n  \"params\"\
    : {}\n},\n{\n  \"url\": \"index.php\",\n  \"params\": {}\n}\n```"
  merge: -1
  pgno: 68
- img_proc: true
  md: "```\n{\n  \"url\": \"/index.php\",\n  \"params\": {}\n}\n```\n\nOnce the web\
    \ browser is online, it will be necessary to process the items in the queue. Example\
    \ 4-8 takes the queue and sends the first element to the server. If that request\
    \ is a success, it will take the next element and continue walking the queue until\
    \ the queue has been sent. Even if the queue is long, this process will execute\
    \ with minimal effort on the user because Ajax processes each item in an asynchronous\
    \ manner. To reduce the number of Ajax calls, it would also be possible to change\
    \ this code to send the queue items in groups of, say, five at a time.\n\nExample\
    \ 4-8. Save queue\n\n```\nvar save = function save(queue) {\n  if (queue.length\
    \ > 0) {\n    $.ajax({\n      url: 'save.php',\n      data: queue.slice(0, s),\n\
    \      success: function (data, status, request) {\n        save(queue.slice(5));\n\
    \      }\n    });\n  }\n}\n```\n\n# JQuery Plug-ins\n\nIf the uncertainty of all\
    \ the client-side storage options is enough to drive you crazy, we have other\
    \ options. With many things in JavaScript, a bad and inconsistent interface can\
    \ be covered up with a module that provides a much better interface. Here are\
    \ two such modules that can make life easier.\n\n# DSt\n\nDSt (http://github.com/gamache/DSt)\
    \ is a simple library that wraps the localStorage object. DSt can be a freestanding\
    \ library or a jQuery plug-in. It will automatically convert any complex object\
    \ to a JSON structure.\n\nDSt can also save and restore the state of a element\
    \ or an entire form. To save and restore an element, pass the element or its ID\
    \ to the DSt.store() method. To restore it later, pass the element to the DSt.recall()\
    \ method."
  merge: -1
  pgno: 69
- img_proc: true
  md: 'To store the state of an entire form, use the DSt.store_form() method. It takes
    the ID or element of the form itself. The data can be restored with the DSt.populate_form()
    method. Example 4-9 shows the basic use of DSt.


    Example 4-9. DSt interface


    ```

    $DSt.set(''key'', ''value'');

    var value = $DSt.get(''key'');


    $DSt.store(''element''); // Store the value of a form element

    $DSt.recall(''element''); // Recall the value of a form element


    $DSt.store_form(''form'');

    $DSt.populate_form(''form'');

    ```


    # jStore


    If you don''t want to venture for which storage engines are supported on which
    browsers and create different code for each case, there is a good solution: the
    jStore plug-in for jQuery. This supports localStorage, sessionStorage, Gears QLite,
    and HTML5 SQLite, as well as Flash Storage and IE 7''s proprietary solution.


    The jStore plug-in has a simple interface that allows the programmer to store
    name/value pairs in any of its various storage engines. It provides one set of
    interfaces for all the engines, so the program can degrade gracefully when needed
    in situations where a storage engine doesn''t exist on a given browser.


    The jStore plug-in provides a list of engines that are available in the jQuery.jStore.
    Availability instance variable. The program should select the engine that makes
    the most sense. For applications that require multibrowser support, this can be
    a useful addition. See the jStore web page for more details.'
