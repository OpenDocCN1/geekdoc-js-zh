  md: "With very few exceptions, Selenium commands take as a parameter the location\
    \ of an element in the DOM to be acted on. This location can be specified in one\
    \ of several ways, including an element ID, an element name, XPath, a CSS class,\
    \ a JavaScript call into the DOM, and link text. The options are illustrated in\
    \ [Selenium Location Options](page 36).\n\nUsing the ID will not work in ExtJS,\
    \ as ExtJS assigns IDs to elements that will change each time. Use CSS classes\
    \ or other properties of the HTML element. To denote buttons, it is often useful\
    \ to use the text of the button with XPath, like //button[text='Save']. It is\
    \ also possible to select on an attribute, like //img[@src='img.png'].\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_47_0.png)\n\
    \n# Selenium Location Options\n\nSelenium offers six ways to address elements\
    \ on the web page. Using the correct addressing scheme will ease development of\
    \ tests:\n\n+   ID\n  Supply an HTML ID:\n  `id`\n\n+   Name\n  Supply an element\
    \ name (useful for form inputs):\n  `name=username`\n\n+   XPath\n  Use XPath\
    \ to find an element:\n  `//form[@id='loginForm']/input[1]`\n\n+   CSS\n  Find\
    \ an element by a CSS Selector, a procedure that's familiar to users of jQuery.\
    \ However, the CSS selector engine in Selenium is more limited than jQuery:\n\
    \  `div.x-btn-text`\n\n+   Document\n  Use the DOM to find an element:\n  `document.getElementById('loginForm')`\n\
    \n+   Link text\n  Find the text in the href attribute (useful for HTML links):\n\
    \  `link='Continue'`"
