  md: 'Both the NETWORK and FALLBACK sections list file patterns, not specific files.
    So it is possible to list entire directories or URL paths here, as well as file
    types such as images (e.g., .jpg).


    Example 7-2. Manifest file


    ```

    CACHE MANIFEST

    # 11 October 2010

    /index.php

    /js/jquery.js

    /css/style.css

    /images/logo.png


    NETWORK:

    /request.php


    FALLBACK:

    /about.html /offline-about.html

    ```


    # Updates to the Manifest File


    The browser will update the files in the manifest whenever the manifest file itself
    changes. There are several ways to handle this. It is possible to add a version
    number in a comment to the file. If the project is using a of version control
    system like Subversion, you can use the version number tag for this.


    The problem with using a version number from a version control system is that
    it requires a programmer to remember to update that time every file in the system
    changes. It would be much better to create an automated system that updates the
    manifest file whenever a file listed in it changes, and run that script as part
    of a deployment procedure.


    For instance, you could write a script that checks all the files in the manifest
    for changes and then change the manifest file itself when one of the files changes.
    A simple way to do this is to write a script that loops over all the files in
    the manifest, then does an MD5 checksum on each one, then puts a checksum into
    the manifest file. This will ensure that any changes will cause the manifest file
    to update.


    This script would be too slow to run on the web server, as running hundreds of
    times a second would be overkill. However, it can efficiently run in the development
    environment. One option would be to have it run from an editor when a file is
    saved. Another option is to run it as the check-in process for a version control
    system.


    Example [7-3](https://example.com/7-3), we parse the manifest file and do a few
    things with it. The program uses the [Symfony Yaml Library](https://example.com)
    to load a list of files to use as a manifest. As a bonus, the program first checks
    that no file has been included more than once. It also checks that every file
    exists, because missing files will break the manifest. By adding each file''s
    MD5 as a comment after the filename, the script makes that any updated file will
    cause a change so that the browser will update its content. It takes a datafile'
