    Interactions with IndexedDB must be done by transactions. This is because the
    IndexedDB itself is asynchronous, and IndexedDB can be accessed from a Web Worker
    or a second window running another thread (each window in JavaScript runs its
    own thread). So, even though simultaneous accesses will be rare, it is possible
    for more than one JavaScript thread to access a given IndexedDB database at the
    same time, and therefore must protect against race conditions.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_74_0.png)


    The IndexedDB spec includes a synchronous version of the interface that can be
    used in Web Workers, but it has not been implemented in browsers yet. In addition,
    using it will mean that any code cannot be reused by a Web Worker and non-Worker
    context.


    The fundamental unit of data storage in IndexedDB is the database. A database
    in IndexedDB is roughly comparable to a database in a relational product like
    MySQL. Each IndexedDB database contains one or more object stores, which can be
    considered equivalent to tables in a SQL database. However, unlike a SQL database,
    an object store has no fixed schema.


    Each record in an object store is a key/value pair, where the key is the primary
    index and the value is a JavaScript object. Any JavaScript object that can be
    serialized be inserted into the object store.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_74_1.png)


    > Closures and functions in general cannot be stored in IndexedDB.


    The first step in using IndexedDB is to create a new database. To do that, just
    pick a name and request that it be opened. If the database does not exist, it
    will be created. If it does exist, it will be opened. The jQuery IndexedDB plugin-in
    makes this easy: just name the database:


    ```

    $.indexedDB(db);

    ```


