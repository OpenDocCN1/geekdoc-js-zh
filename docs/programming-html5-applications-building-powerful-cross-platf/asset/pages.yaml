  md: "```\nreturn this.apply(scope, arguments);\n}\nelse {\n  return null;\n}\n}\n\
    ;\n```\n\n```\nvar interceptMe = function cube(x) {\n  console.info(x);\n  return\
    \ Math.pow(x, 3);\n};\n```\n\n```\nvar cube = interceptMe.createInterceptor(function(x)\
    \ {\n  return typeof x === \"number\";\n});\n```\n\nAs a more extensive example,\
    \ say that you might wish to regularly compute Fibonacci sequences. A simple brute\
    \ force approach would be something like Example-2-13. However, as trivial as\
    \ fib(40) would take quite a long time to run.\n\nExample 2-13. Basic Fibonacci\
    \ calculation\n\n```\nvar fib = function fib(n) {\n  if (n === 1 || n === 2) {\n\
    \    return 1;\n  }\n  return fib(n - 1) + fib(n - 2);\n};\n```\n\nA quick trace\
    \ through a sample of this function shows that it does a lot of redundant calculations.\
    \ It would be much faster to have a Fibonacci method that could calculate each\
    \ value only once. We can do this by wrapping the Fibonacci function with an interceptor\
    \ that caches the result of each iteration (see Example 2-14). The interceptor\
    \ does not need to know anything about how a Fibonacci sequence is generated;\
    \ it just has to know that for a given input it should always produce the same\
    \ output. Once fib(n) is computed, it becomes a simple matter of doing a lookup,\
    \ and if it is not, it is computed.\n\nExample 2-14 has two parts: the cache method\
    \ and the actual Fibonacci sequence generator. The cache method does not know\
    \ anything about this sequence except for one fact: that any given input value\
    \ will return the same value, which can be cached. Then, when decoratedfib(32)\
    \ is called, the cache will first check whether it has already computed the result\
    \ for 32. If it has, it will return it. If it has not, it will start to compute\
    \ it. But the Fibonacci sequence is heavily recursive. So to compute the Fibonacci\
    \ sequence for 32, the function first must compute it for 31, and so on. The function\
    \ will recursively call for a solution until it hits a value. If this is the first\
    \ time running the function, it will find n = 2 and n = 1, which are in the seed\
    \ values."
