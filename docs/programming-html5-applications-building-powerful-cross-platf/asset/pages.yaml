  md: '# Web Socket Protocol


    Most of the time, the low-level details of sockets will not be of great concern
    to the programmer. The interfaces in the browser and on the server will take care
    of the details and just provide an API that can send data.


    That being said, sometimes it may be useful to know the low-level details of how
    things operate, to understand why something is not working, or to implement a
    web socket client in some other environment. In particular, it is important to
    understand how a socket is set up.


    Web sockets carry data between browser and server using a TCP socket instead of
    an HTTP envelope. When the browser tries to open a socket, it sees what looks
    like an HTTP GET request but a few extra headers (see Example 9-3).


    Example 9-3. Socket headers


    ```

    /socket HTTP/1.1

    Upgrade: WebSocket

    Connection: Upgrade

    Origin: http://www.test.com

    Host: www.test.com

    Content-Length: 0

    ```


    After the connection has been set, frames of data are sent back and forth. Each
    frame starts with a null byte of 0x00 and ends with the 0xFF byte. The envelope
    is in UTF-8 format.


    There are server-side implementations for web sockets that work with Python, Ruby,,,
    Node.js, and Java, as well as other languages. The state of libraries for web
    sockets is advancing, and there are packages in various states of development
    for pretty all the major languages used in web development. In general, the choice
    of a server-side web implementation will be dictated by the needs of a project.
    So it makes sense to find the web sockets package for the environment that is
    being used by a given project.


    # Ruby Event Machine


    Ruby''s Event Machine also provides an ideal platform for working with web sockets,
    as the programmer is an event-based interface with which a stream of data can
    be sent to the client. The EventMachine::WebSocket interface closely matches the
    interface in JavaScript. In the client, the EventMachine interface has standard
    event handlers for onopen, onmessage, and onClose, as well as a ws.send method
    to send data back to the client.


    Example 9-4 shows a very trivial "hello world" type of web socket interface in
    Ruby.'
  merge: -1
  pgno: 119
