  md: "Example 2-6 adds to the browser's toolbar the buttons defined in the tools\
    \ array. Each of the buttons gets its own handler, named clickHandler. This function\
    \ has access to the calling function's variables, and embeds the button and tools\
    \ variables into its operations. You can easily update the application by adding\
    \ or subtracting an element from the tools array, and the button with all the\
    \ defined functionality will appear or disappear.\n\n# Example 2-6. Closure in\
    \ a button\n\n```\n$('.document').ready(function Ready() {\n  var button, tools;\n\
    \  tools = ['save', 'add', 'delete'];\n  console.info($`div#toolbar`);\n  tools.forEach(function\
    \ (tool) {\n    console.info(tool, button);\n    var button = $(`<button>`).text(tool).attr({\n\
    \      css: 'tool'\n    }).appendTo(`div#toolbar`);\n    button.click(function\
    \ clickHandler() {\n      console.info(tool, button);\n      alert(\"User clicked\
    \ \" + tool);\n    });\n  });\n});\",\n```\n\nWhen using closures, it is hard\
    \ to know which variables are or are not in the scope of a function. However,\
    \ both Google Chrome's DevTools and Firebug show the list of closed variables.\n\
    \nIn Firebug, the scope can be seen in the Script tab by looking under \"Watch\"\
    . Under all the variables of the current scope will be a ladder of the scopes\
    \ going up to the main \"window\" object.\n\nIn DevTools, for example, when the\
    \ code is halted in the debugger, a subsection called \"closure\" in the right-hand\
    \ column under Scope Variables will show the closed variables for the current\
    \ function (see Figure 2-1). In this case, it shows that we have clicked on the\
    \ \"delete\" button and lists the reference to the jQuery object for the button\
    \ itself."
  merge: -1
