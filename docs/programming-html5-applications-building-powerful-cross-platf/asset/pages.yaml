  md: '![](img/3a2d3586be95b30d9b98b5411d3c2bc4_115_0.png)


    HTML5 introduces the idea of web sockets, which work like la classic TCP/

    socket is opened by the browser to the server from which it was loadedand can
    be kept open until it is no longer needed, whereupon it is explicitly closed.
    A socket is a bidirectional real-time data channel, where an HTTP request is a
    simple polling system. If you were to send each keystroke to the server over HTTP
    with Ajax,

    y would incur an overhead of 300–400 bytes at a minimum, may be as much as a kilobyte
    or two with cookies for every keystroke. A socket uses no HTTP headers,

    much of that would just go away. The overhead would be reduced to just a few

    bytes.


    # 104 | Chapter 9: Web Sockets'
