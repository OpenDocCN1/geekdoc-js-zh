  md: "```\n//get\n\nvar sessionId = localStorage.sessionID;\nsessionId = localStorage.getItem('sessionID');\n\
    ```\n\n```\nlocalStorage.sessionID = undefined;\nlocalStorage.removeItem('sessionID');\n\
    ```\n\nBrowser storage, like cookies, implements a \"same origin\" policy, so\
    \ different websites can interfere with one another or read one's data. But both\
    \ of the storage objects in this section are stored on the user's disk (as are\
    \ cookies), so a sophisticated user can find a way to edit the data. Chrome's\
    \ Developer Tools allow a programmer to edit the storage object, and you can edit\
    \ it in Firefox via debug or some other tool. So, while other sites can't sneak\
    \ data into the storage objects, these objects should still not be trusted.\n\n\
    Cookies are burdened with certain restrictions: they are limited to about 4 KB\
    \ in size and must be transmitted to the server with every Ajax request, greatly\
    \ increasing network traffic. The browser's localStorage is much more generous.\
    \ The HTML5 specification does not list an size limit for its, but most browsers\
    \ seem to limit it to about 5 MB per web host. The storage should not assume a\
    \ very large storage area.\n\nData can be stored in a storage object with direct\
    \ access or with a set of access functions. The storage object can only store\
    \ strings, as any storage object will be typecast to a string. This means an object\
    \ will be stored as [object Object], which is probably not what you want. To store\
    \ an object or array, convert it to JSON first.\n\nWhenever a value in a storage\
    \ object is changed, it fires a storage event. This event will show the key, its\
    \ old value, and its new value. A typical data structure is shown in Example 4-2.\
    \ Unlike some events, such as clicks, storage events cannot be prevented. There\
    \ is no way for the application to tell the browser to not make a change. The\
    \ event simply informs the application of the change after the fact.\n\n# Example\
    \ 4-2. Storage event interface\n\n```\nvar storageEvent = {\n  key: 'key',\n \
    \ oldValue: 'old',\n  newValue: 'newValue',\n  url: 'url',\n  storageArea: storage\
    \ // the area that changed\n};\n```\n\nWebKit provides a screen in its Developer\
    \ Tools where a programmer can view and edit the localStorage and sessionStorage\
