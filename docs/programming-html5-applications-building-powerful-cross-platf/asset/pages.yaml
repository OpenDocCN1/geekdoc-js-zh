  md: "Another advantage of server-side testing is that if you are using any form\
    \ of continuous integration, such as CruiseControl or phpUnderControl, the Selenium\
    \ tests appear to be the test system as just more tests in whatever language the\
    \ team is using. In a team that is using a test framework, this will leverage\
    \ the existing experience of the team.\n\nExample 3-8 is a very simple Selenium\
    \ test, written in PHP with theUnit testing framework. It just opens a web page,\
    \ and after the page has loaded, it asserts that the title of the page is the\
    \ string \"Hello World.\" It will then click a button with the text \"Click Me.\"\
    \ If the title is not \"Hello World\" or there is no such button, the test will\
    \ fail.\n\n# Example 3-8. Testing Hello World\n\n```\n<?php\nrequire_once 'PHPUnit/Extensions/SeleniumTestCase.php';\n\
    \nclass WebTest extends PHPUnit_Extensions_SeleniumTestCase\n{\n    function testTitle()\
    \ {\n        $this->open('http://www.example.com/');\n        $this->assertTitle('Hello\
    \ World');\n        $this->click//button[text()='Click Me']');\n    }\n}\n```\n\
    \nIn general, Selenium commands consist of actions, assertions, and queries. The\
    \ actions reflect the basic forms of Selenium actions: click, mouseOver, mouseDown,\
    \ type, and so on. The various delays that appear in the server-side Selenium\
    \ interface are not present, but can be easily simulated by using a loop with\
    \ a sleep function.\n\nMany of the useful methods that are present in the HTML\
    \ Selenium test runner are not present in the server-side Selenium interface.\
    \ Methods such as WaitForElement Present WaitForNotPresent are not included, but\
    \ can be easily added by creating a custom base class for the tests and adding\
    \ them.\n\nExample 3-9. WaitForElementPresent\n\n```\nfunction WaitForElementPresent($el,\
    \ $timeout = 60)\n{\n    while($timeout)\n    {\n        if($this->isElementPresent($el))\n\
    \        {\n            return true;\n        }\n        $timeout -= 1;\n    \
    \    sleep(1);\n    }\n    $this->fail(\"Element $el not found\");\n}\n```"
