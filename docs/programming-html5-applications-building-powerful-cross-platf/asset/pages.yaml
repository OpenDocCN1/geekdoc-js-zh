- img_proc: true
  md: "Once a connection is set up, both ends send data over it. Any valid UTF-8 string\
    \ can be sent. It is up to the server and the client to agree on a data format.\
    \ Normally data will probably be JSON or XML, but there is no reason that some\
    \ other format could not be used if desired.\n\n# Web Socket Example\n\nTo illustrate\
    \ websockets, consider Example 9-1. Here a very simple JavaScript function opens\
    \ a socket to a server that serves up stock prices. The JavaScript sends a stock\
    \ ticker symbol that it is interested in (IBM). The server will find a price for\
    \ that stock and send it to the client as JSON. The server could be set up to\
    \ poll every seconds for a new price and send it to the client when it changes.\
    \ The client will just refresh the element every time the price changes.\n\nExample\
    \ 9-1. Socket client example\n\n```\n$(function () {\n  var socket = new WebSocket('ws://localhost/stockprice');\n\
    \n  // wait for socket to open\n  socket.onopen = function () {\n    socket.send(JSON.stringify({\n\
    \      ticker: \"ibm\"\n    }));\n  };\n\n  socket.onmessage = function (msg)\
    \ {\n    var prices = $.parseJSON(msg.data);\n    var html = \"IBM: \" + prices.ibm;\n\
    \    $('div.prices').html(html);\n  };\n});\n```\n\nThe browser code for working\
    \ with webs should look pretty familiar to any programmer who has worked with\
    \ Ajax. A web object is created with the appropriate URL. Once the socket is opened\
    \ (be sure to wait for it), data can be sent via the socket.send event to the\
    \ server. When the server sends data back to the browser, the socket.onmessage\
    \ event is called with the string in the data field of the event object. In this\
    \ case, the data is in JSON, so it can be parsed with the standard browser JSON\
    \ parsing methods and then displayed in the browser."
