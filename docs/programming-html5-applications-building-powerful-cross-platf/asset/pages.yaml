- img_proc: true
  md: "frustrating to look at a stack trace in Firebug and see a stack of nine or\
    \ ten functions, all of which are simply listed as anonymous. Also, assigning\
    \ a function name allows you to call the function recursively if desired.\n\n\
    A function expression can be used anywhere in JavaScript that an expression can\
    \ appear. So a function can be assigned to a variable as in Example 2-3, but it\
    \ can also be assigned to an object member or passed to a function.\n\nJavaScript\
    \ functions are more like the Lisp lambdas than C functions (including Java and\
    \ C++), a function is basically a static. It is not an object on which you can\
    \ operate. While you can pass objects as arguments to functions, there is little\
    \ ability to build composite objects or otherwise expand them.\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_21_0.png)\n\
    \nBack in the 1950s when Lisp was being created, the folks at MIT were heavily\
    \ influenced by Alonzo Church's Lambda Calculus, which provided a mathematical\
    \ framework for dealing with functions and recursion. So John McCarthy used the\
    \ keyword lambda for dealing with an anonymous function. This has propagated to\
    \ other languages such as Perl, Python, and Ruby. Although the keyword lambda\
    \ does not appear in JavaScript, its functions do the same things.\n\nAs in Lisp,\
    \ functions in JavaScript are first-class citizens of the language. A function\
    \ in JavaScript is just data with a special property that can be executed. But\
    \ like all other variables in JavaScript, a function can be operated on. In C\
    \ and similar languages, functions and data are in two separate spaces. In JavaScript,\
    \ functions are data and can be used in every place that you use data. A function\
    \ can be assigned to a variable, passed as a parameter, or returned by a function.\
    \ Passing a function to another function is a very common operation in JavaScript.\
    \ For example, this would be used when creating a callback for a button click\
    \ (Example 2-4). Also, a function can be changed by simple assignment.\n\nExample\
    \ 2-4. ExtJs Button with function as handler\n\n```\nvar button = new Ext.Button(\n\
    \  text: 'Save',\n  handler: function() {\n    // Do Save here\n  }\n});\n```"
  merge: -1
