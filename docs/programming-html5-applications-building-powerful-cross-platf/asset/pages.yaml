  md: '# Functional Programming


    Functional programming is a methodology that is more commonly associated with
    languages like Lisp, Spac, Erlang, F#, or Haskell, but works quite well in JavaScript
    also. Functional programming rests on a couple of basic assumptions:


    +   - Functions are first-class citizens of the language and can be used where
    any other value can be used.

    - Complex behavior can be built by composition of simple functions.

    - Functions return values. In many cases, a given function will always return
    the same value for the same inputs.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_24_0.png)


    Figure 2-1. Closures in Chrome''s DevTools'
  merge: -1
  pgno: 24
- img_proc: true
  md: "In mathematics, functions do not have side effects. Take a classical mathematical\
    \ function like y = sin(x). It just returns a value that y can store, but does\
    \ not change x or anything in the global state of the program. By ensuring that\
    \ functions are \"pure\" (have no side effects), this practice enables the function\
    \ to be called from anywhere in the program without causing strange to happen.\
    \ The problem with side effects is that they can cause dependencies that can be\
    \ very hard to track down. If calling a method can cause data to be corrupted\
    \ elsewhere, it greatly increases the potential for bugs that will be very difficult\
    \ to find.\n\nJavaScript functions can have side effects, and there is no built-in\
    \ way to prevent functions from having side effects. In addition, JavaScript functions\
    \ do not return value unless the return statement has been explicitly invoked\
    \ to return a value. In the absence of a return statement, the function will return\
    \ undefined.\n\nWhen employing functional programming, the programmer often falls\
    \ into the pattern of using many very functions, with only two or three lines\
    \ of code, to accomplish a goal. This can be a very good design technique, as\
    \ short functions are, in general, easier to make correct and to test.\n\nIt is\
    \ often the case that complex behavior can be built up from simple functions by\
    \ composition. A chain of functions can be built from simple functions, in which\
    \ each function returns this, allowing the next function to be called. The last\
    \ function in the chain can return **this.**\n\nThe jQuery library uses function\
    \ changes such as in Example 2-7. In this example, jQuery finds a DOM item, sets\
    \ its text, fades it into view, and then sets a click handler on it that will\
    \ hide with a second DOM chain.\n\nExample 2-7. Choosing functions with a closure\n\
    \n```\n$('#div.alert').text(\"Message\").fadein(\n2000).click(\nfunction() {\n\
    \  $(this).fadeout(2000);\n}););\n```\n\nOne very powerful pattern of functional\
    \ programming is the *higher-order function*. A higher-order function takes a\
    \ function as an argument to abstract specific behavior while leaving the generic\
    \ behavior in the outer function.\n\nA example of a higher-order function is the\
    \ Array map function (see \"Array Iteration Operations\" on page 22). It takes\
    \ an array and returns a new array that is the result of applying the passed function\
    \ to each element in the array. This model can be applied to a wide range of circumstances\
    \ beyond just manipulation. As a general pattern, the higher-order function can\
    \ be used wherever a generic behavior needs a few specific modifications."
  merge: -1
  pgno: 25
- img_proc: true
  md: "The jQuery library's interface tends to favor functional programming. This\
    \ interface is particularly apt for selecting a set of DOM nodes from the page\
    \ and then providing a functional interface to interact with those nodes.\n\n\
    In addition, most of the methods of jQuery return a value so that they can be\
    \ chained. For example, to find all images wider than a size in a page, one could\
    \ select all the images in the page, filter out all that are smaller than 300\
    \ pixels, and scale all those that are left in the list.\n\nExample 2-8 does exactly\
    \ that. It selects all the images in a document (anything with an img tag), uses\
    \ the filter to determine which ones has a width greater than 300 pixels (maxWidth),\
    \ and scales them. By making the filter and scale functions very simple, you can\
    \ be more confident that the code will work as intended.\n\nExample 2-8. Scaling\
    \ images\n\n```\nvar scaleImages = (function maxWidth) {\n  return function ()\
    \ {\n    $('img').filter(function () {\n      return $(this).width() > maxWidth;\n\
    \    }).each(function () {\n      $(this).width(maxWidth);\n    });\n  };\n}(300);\n\
    ```\n\nWhen processing a list of operations in a time-consuming procedure, such\
    \ as in an Ajax call, it is sometimes not practical to send the entire list to\
    \ the server in one request. For example, it may be that sending the entire list\
    \ will cause the server to time out.\n\nIn this case, to iterate the list, it\
    \ is useful to think of the list as a head and tail. Take the first element off\
    \ the list (or the first few elements) and then, process the rest of the list\
    \ by use of recursion until the list is empty (Example 2-9).\n\nI have used this\
    \ strategy when adding data to a REST interface. Each call to the interface takes\
    \ on average about one second, so it is not practical to call it 500 times for\
    \ one Ajax call. In this case, I used to process the list by recursion.\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_26_0.png)\n\
    \nWhat's with the entire Ajax XOR terminology? The JavaScript object is called\
    \ XMLHttpRequest, which is abbreviated XOR. Ajax derives from the term Asynchronous\
    \ JavaScript and XML, which was coined by Jesse Garrett. Actually, in many cases,\
    \ the data being sent over the network is not XML but may be JSON or other data."
  merge: -1
  pgno: 26
