- img_proc: true
  md: 'Selenium RC makes it possible to test all of these various combinations using
    a network of machines. Each test machine must have Java installed. In many cases,
    Java will be installed by default, if it is not, download and unpack the Selenium
    RC package from http://seleniumhq.org/download/. On each server, start the Selenium
    JAR with the command. It is probably a good idea to have the Selenium server start
    up automatically on machine boot in the case of a machine that will be a member
    of a test farm. Normally the Selenium server will be installed with reasonable
    defaults, but it offers a command-line options that allow some degree of customization.
    Specifically, you can change the port from the default 4444, if needed, with the
    -port option. This can be used to run several instances of the server on one server
    in order to test on several browsers at once:


    ```

    java -jar selenium-server.jar [-port 4444]

    ```


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_58_0.png)


    It is not necessary to use a separate physical machine for each test server.

    Any of the common virtual machine technologies can work well for this.

    A reasonably powerful server with enough RAM should be able to run a small but
    useful virtual test farm.


    If you need to test your application on Android or iOS Selenium, you can do that
    as well. There is an Android driver for Selenium, as well as an iPhone driver.
    Note that in order to run the iPhone driver you need to have a Mac as well as
    the iPhone development setup. Because the Selenium driver is not in the iPhone
    store, you need to be able to install it on your phone with a provisioning profile,
    or use the simulator in Xcode.'
  merge: -1
