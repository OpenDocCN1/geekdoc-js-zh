  md: '# Preface


    This book reflects the evolution of the Web. Less and less can programming be
    treated as a distinct activity shoehorned into web pages through scripts. Instead,
    HTML and JavaScript are now intertwined in producing an enchanting user experience.
    With this book, you can master the latest in this evolution.


    # How This Book Is Organized


    The elements of this book are as follows:


    +   Chapter 1, The Web As Application Platform

    Introduces the reasons for programming on the new HTML5 platforms and what they
    offer to the JavaScript programmer


    +   Chapter 2, The Power of JavaScript

    Explains some powerful features of JavaScript you may not already know, and why
    you need to use them exploit the HTML5 features and associated libraries in this
    book


    +   Chapter 3, Testing JavaScript Applications

    Shows how to create and use tests in the unique environment provided by JavaScript
    and spawners


    +   Chapter 4, Local Storage

    Describes the loalStorage and sessionStorage objects that permit simple data caching
    in the browser


    +   Chapter 5, IndexedDB

    Shows the more powerful NoSQL database that supports local storage


    +   Chapter 6, Files

    Describes how to read and upload files from the user’s system


    +   Chapter 7, Taking It Offline

    Describes the steps you must go through to permit a user to use your application
    when the device is disconnected from the Internet'
