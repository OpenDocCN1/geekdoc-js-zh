  md: 'The Selenium IDE also is useful for recording web macros in development. For
    example, if you are testing a wizard in your web application that displays four
    or five screens before the screen is being debugged, you can use the IDE to create
    a Selenium script that you can invoke as a macro to get automatically to the point
    being tested.


    +   If a test works when it is run in single-step mode but not during normal execution,
    it needs a few pause statements to allow the browser to catch up, or even better,
    waitFor... statements, which will allow the test to be in sync.


    There are three ways to run tests in Selenium: via the Selenium IDE, the RC runner,
    and from a programming language. The IDE is easy to use in an active setting,
    but works only with Firefox. The test runner accepts inputs in HTML format, which
    can be created in the IDE. Finally, it is possible to write tests in a test framework
    in the programming language as PHPUnit. Using the test runner or the programming
    language-based test suite allows with a full suite of browsers and can provide
    reporting and other functions. This procedure can also be integrated with continuous
    integration tools along with any other tests written in any of the XUnit frameworks.


    A Selenium test is constructed from an HTML file containing a table, with each
    test being a row in the table. The row consists of three columns: the command
    to run, the element it will act, and an optional parameter used in some cases.
    For example, the third column contains the text to type into an input element
    while testing a form.


    Unlike a JUnit test, a Selenium test is all about the user interface. Thus, Selenium
    is more about integration testing than unit testing. To test Example 3-3 in Selenium,
    a different approach is required from JUnit. While the JUnit test calls the handler
    function directly Selenium clicks the button and waits for


    This is illustrated in Example 3-5. Each row in the document performs an action
    as part of the test. The first row opens the page to test, then the second line
    clicks the button (which is identified by the ID). The test then waits for the
    page to display the <div>, identified in this case through XPath.


    This tests the same simple script as the JUnit test shown in the previous section.
    However, instead of testing the function itself, it tests the user interface similar
    to how a human tester may do. It opens the page and clicks on the click_me button.
    It waits for the target_div to be present in the DOM. It then asserts that the
    word First appears in the page.'
