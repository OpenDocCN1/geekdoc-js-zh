  md: 'with a URL that defines the vocabulary. Within that, data is tagged by marking
    the enclosing HTML tag with the itemprop attribute.


    A number of predefined vocabularies can be found at http://www.data-vocabulary.org.
    These include specs for Events, Organizations, People, Products, Reviews, Review-Aggregates,
    Breadcrumbs, Offers, and Offer-Aggregates. Google understands these syntaxes to
    enhance search results.


    In theory there will be interfaces in the DOM to parse microdata, but also of
    this writing they are not ready yet and implementation can be spotty. Frankly,
    microdata is just HTML attributes, so it can be easily parsed and processed with
    CSS selectors via the DOM interface or with jQuery.


    # ## New Form Types


    HTML5 enhances the classic form that has been in HTML since the early 1990s with
    a bunch of new form types. Most of these are classic <input type="text"> tag that
    has been in use since the beginning. These new form types provide some-needed
    flexibility in the types of input a form can take, and the interface provides.


    In many cases, on a mobile device, changing the input type will also cause the
    device to put up a custom keyboard to enable the user to enter the right kind
    of data. For instance, if type is set to number, the device can put up a numeric
    keypad that looks a little different but is optimized for entering phone numbers.
    For a type of email, the keyboard will be a standard QWERTY keyboard but modified
    for entry of email addresses.


    One type that is especially useful for smartphone applications is the speech input
    <input type="text" x-webkit-speech>. The speech tag will take the user said and
    translate it into text. My Android, for instance, has a Google Search widget that
    can search by voice. The speech tag also allows the user to type text normally
    as well. When the user speaks, the input will fill the websspeech event, which
    can be used to interact with.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_125_0.png)


    > Be warned for users who speak English with foreign or other non-standard accents,
    this tag may prove very difficult to use. Many of the Israeli and Russian coworkers
    find that these inputs are not very useful. It also may limited support for languages
    other than English. So if your application''s users speak, for example, Polish
    or Hebrew, the tag may or not be useful.


    HTML5 adds the ability for a form to be required. If the required attribute is
    set and the element is blank, it can be styled in CSS with the :invalid selector.'
