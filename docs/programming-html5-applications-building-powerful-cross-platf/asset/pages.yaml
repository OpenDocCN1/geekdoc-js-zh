  md: "# Example 2-9. List recursion\n\n```\nfunction iterateAjax(tasks) {\n  function\
    \ iterator(tasks) {\n    $.ajax({\n      url: 'index.php',\n      data: tasks[0],\n\
    \      success: function(data, status, XMLHttpRequest) {\n        if (tasks.length\
    \ > 0) {\n          // Do something with the results\n          iterator(tasks.slice(1));\n\
    \        }\n      }\n    });\n  }\n  iterator(tasks);\n}\n```\n\nAlthough building\
    \ an entire single-page web application with only functional programming styles\
    \ would not be practical, functional programming still provides many useful ideas\
    \ that should not be ignored. Functional programming is very well suited, for,\
    \ for use with Web Workers (see Chapter 8).\n\nNot a lot written about functional\
    \ programming in JavaScript, but there is quite a lot in other languages that\
    \ can be applied to JavaScript. For more functional programming, see these books:\n\
    \n+   * Real World Haskell by Bryan O’Sullivan, John Goerzen, and Donald Bruce\
    \ Stewart (O'Reilly)\n* Programming Scala by Dean Wampler and Alex Payne (O'Reilly)\n\
    * Structure and Interpretation of Computer Programs by Harold Abelson and Gerald\
    \ Sussman (MIT Press)\n\n# Prototypes and How to Expand Objects\n\nEverything\
    \ in JavaScript can have methods attached to it. Every element has some basic\
    \ methods that can be used by the programmer to enhance its usefulness. JavaScript\
    \ primitives such as Booleans, strings, and numbers have a second life as objects.\
    \ The transformation from primitive to object is transparent, so it is possible\
    \ to apply these methods to a primitive. Actually, what happens is that a simple\
    \ value—for example, a string—will be converted to an object, and then converted\
    \ back if needed.\n\nStrings offer a large number of methods that can be called\
    \ to manipulate them. A few will modify the string in place, but most will return\
    \ a new string. A full list can be found on the Mozilla Developer Network website,\
    \ but here are a few highlights:\n\n```\nstring.indexOf()\nReturns the first index\
    \ of a substring in a string, or –1 if not found\n```"
  merge: -1
  pgno: 27
- img_proc: true
  md: "```\nstring.lastIndexOf()\n```\n\nSame as indexOf(), starting at the end\n\n\
    ```\nstring.match()\n```\n\nMatches a regular expression in a string\n\n```\n\
    string.replace()\n```\n\nReplaces a regular expression (specified as a function\
    \ or string) with a new string\n\n```\nstring.split()\n```\n\nSplits a string\
    \ into an array of substrings\n\n```\nstring.slice()\n```\n\nExtracts a substring\n\
    \nHowever, there may come a time when the predefined methods are not enough and\
    \ some custom functionality is required. In this case, JavaScript provides an\
    \ unusual and very powerful feature, to extend a built-in object. Although you\
    \ can always assign a method to a JavaScript object with a simple assignment,\
    \ that is not always the best way to do it. If you want to add a method to every\
    \ string, you can attach it to the String.prototype object. In the JavaScript\
    \ object system, each object inherits from a chain of prototypes, so by adding\
    \ methods somewhere in that chain you can add to an entire type of object.\n\n\
    Here is an example to illustrate the concept. The goal is to create a new method\
    \ populate that substitutes values into a template. The template is the object\
    \ on which the method is called, for instance:\n\n```\nHello {name}\n```\n\nThe\
    \ string should contain keywords in curly braces that the programmer wants to\
    \ replace with specific values. The parameter to populate is an object specifying\
    \ keywords in the template and values to substitute. Thus, if the argument contains\
    \ a property name, the value for name is plugged in the string.\n\nOnce the code\
    \ in Example 2-10 is run, the populate method is attached to all strings. When\
    \ populate is called, it refers to the string on which it is called through the\
    \ standard JavaScript object this. Having the value of this, the populate method\
    \ can use simple substitution to plug values from it. In general, it is a good\
    \ idea to not modify the object on which a method is called, but to return a new\
    \ instance of the object (an from functional programming).\n\nExample 2-10. String\
    \ token replacement\n\n```\nString.prototype.populate = function(params) {\n \
    \ var str = this.replace(/\\{(\\w+)\\}/g, function stringFormatInner(word) {\n\
    \    return params[word.substr(1, word.length - 2)];\n  });\n  return str;\n}\n\
    $('.target').html(\"Hello {name}\").populate({\n```"
