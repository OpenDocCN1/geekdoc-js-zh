  md: '# CHAPTER 5


    # IndexedDB


    The localStorage interface (see Chapter 4) provides a very nice interface for
    storing small amounts of data, the browser limits this storage space to 5 MB in
    many cases. If the storage needs of an application go beyond that, or if the application
    needs to have query access to structured data, local storage is not the best choice.
    In this case, having a more robust storage mechanism can be useful for the application
    developer. IndexedDB provides this mechanism on many browsers. For example, a
    programmer may store product catalog data into an IndexedDB store so that when
    the user searches for an item, the server does not need to make a trip to the
    server to find the data for a particular item.


    IndexedDB is a NoSQL database that feel familiar to people who have used products
    as Mongo or CouchDB. A program can store JavaScript objects directly into an IndexedDB
    store.


    IndexedDB has been in Firefox starting with version 4. It was also introduced
    into Google Chrome starting with version 11. Microsoft has a version online at
    HTML5 Labs website as an ActiveX control, which can be added into IE, and probably
    it will be in the main IE release at some point. It will be available in other
    browsers in the next year or so. Formally, IndexedDB is now a draft proposal from
