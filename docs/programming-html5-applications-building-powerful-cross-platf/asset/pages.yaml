  md: "Although the Fibonacci sequence is not something many people spend time on,\
    \ it is a good example of how using a function prototype can take two very short\
    \ functions and combine them for a very powerful result.\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_31_0.png)\n\
    \nThis example is more complex than it really has to be in to show how to cache\
    \ results from functions that have no side effects. This is probably not the best\
    \ way to write this code.\n\nExample 2-14. Advanced Fibonacci calculation\n\n\
    ```\nvar smartFib = (function makeFib() {\n  var fibsequence = [0, 1, 1];\n  var\
    \ fib = function fib(n) {\n    if (fibsequence[n]) {\n      return fibsequence[n];\n\
    \    }\n    fibN = fib(n - 1) + fib(n - 2);\n    fibsequence[n] = fibN;\n    return\
    \ fibsequence[n];\n  }\n  return fib;\n});\n```\n\n```\nFunction.prototype.decorate\
    \ = function Decorate(params) {\n  return params.decorator(this, params.initialData);\n\
    };\n```\n\n```\nvar cache = function cache(lambda, initial) {\n  return function\
    \ cacheRunner(n) {\n    if (initial[n] !== undefined) {\n      return initial[n];\n\
    \    } else {\n      initial[n] = lambda(n);\n      return initial[n];\n    }\n\
    \  }\n};\n```\n\n```\nvar decoratedFib = function fib(n) {\n  return decoratedFib(n\
    \ - 1) + decoratedFib(n - 2);\n}).decorate({\n  decorator: cache,\n  initialData:\
    \ [0, 1, 1]\n});\n```\n\nSuppose you have a function that should run periodically\
    \ in response to user inputs but should not run more than once in a given time\
    \ period. It would be using the Function prototype to create a wrapper function\
    \ that would store when that function was last called and keep it from running\
    \ if it is called again within the designated time."
