  md: "name: \"Zach\"\n\nOf course, strings are not the only types of objects in JavaScript\
    \ that have prototypes. \nNumbers, arrays, objects, Booleans, and functions do\
    \ so well.\n\nExtending the types of basic objects such as Object, Array, and\
    \ so\non, can sometimes break libraries. The culprit is usually creating a\nproperty\
    \ that already exists on the object. Be sure that the property\nYou are creating\
    \ it before adding it, and test carefully.\n\nIn truth, extending base types in\
    \ JavaScript is a practice that attracts a\nlot debate. Some people say it should\
    \ never be done. I think it is such\npower tool that cannot be ruled out completely.\n\
    \n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_29_0.png)\n\nThe Number prototype works\
    \ exactly the same way as the for strings. So it is very\\possible to define a\
    \ new method to take care of any need that may be required. If, for\nexample,\
    \ an application requires squaring numbers on a regular basis, it would be easy\n\
    to add the method, as shown in Example 2-11.\n\nExample 2-11. Using Number.prototype\n\
    \n```\nNumber.prototype.square = function square() {\n  return this *;\n}\n6.square();\
    \ // 36\n```\n\n# Expanding Functions with Prototypes\n\nIn addition to data objects\
    \ as strings and arrays, functions also have a prototype.\nThis can be used to\
    \ create composite functions that are very powerful. By combining\nsimple functions\
    \ into larger units, using the Function.prototype to add methods to the\nFunction\
    \ object, you can pull apart complex logic into much simpler cases. In fact,\n\
    many toolkits to do exactly this and some methods to accomplish some of these\n\
    tasks.\n\nOne example of prototyping, which may increase the robustness of your\
    \ code-\nout its execution, is to add error-checking before executing a function.\
    \ The code in\nExample 2-12, a cube function runs without checking that its input\
    \ is a number.\nThecode wraps the function in an interceptor that does the check.\
    \ Whenever cube is\nsubsequently called, the interceptor runs first, then lets\
    \ the original cube if the input\nis a number.\n\nExample 2-12. Function interceptor\n\
    \n```\nFunction.prototype.createInterceptor = function createInterceptor(fn) {\n\
    \  var scope = {};\n  return function() {\n    if (fn.apply(scope, arguments))\n\
    ```"
