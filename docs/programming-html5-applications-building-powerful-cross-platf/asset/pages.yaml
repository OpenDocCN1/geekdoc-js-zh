- img_proc: true
  md: "The frontend script (see Example 8-2) sets up the canvas element and scales\
    \ it to fit in the page. Then it creates an object to wrap the worker interface.\
    \ The wrapper object creates the worker in the worker's run() method, passing\
    \ to the worker a parameter block that it chunks of the Mandelbrot set to compute.\n\
    \nThe draw method takes the data, scales it to onto the canvas, sets a color,\
    \ and then draws the pixel.\n\n![](img/3a2d3586be95b30d9b98b5411d3c2bc4_102_0.png)\n\
    \nThe HTML Canvas does not have a \"draw pixel\" command, to draw a pixel we must\
    \ draw a square of size 1 and offset it by half pixel from the spot where we want\
    \ to show up. So to draw a pixel at (20,20) the square should extend from (19.5,19.5)\
    \ to (20.5,20.5). The locations on the canvas grid are not the pixels on the screens\
    \ between them.\n\nThe onmessage handler waits for events to be sent to the worker.\
    \ If the event type is draw, the handler calls method to draw the new data into\
    \ the canvas. If the event is log, it is logged to the JavaScript console via\
    \ console.info(). This provides a very simple method to log status information\
    \ from a worker.\n\nThe startWorker method aliases the this to a local variable\
