  md: '# Working with Files


    For many years, HTML forms have been able to include a file type as a form element
    that allows the user to specify a file to upload to the server. The browser does
    not allow JavaScript to set this field, for fear that it could somehow the upload
    of a file it shouldn''t. However, new JavaScript APIs allow you to read the contents
    of files from the local system that have been added to the form element by the
    user.


    If you have a file with upload field, it will provide a FileList object. Each
    element of the FileList object is a File object. A file object provides the user
    with the file''s name, MIME type, size, and last modified. The full path is not
    exposed in JavaScript, but it can be seen in Firebug.


    The file pointed to a File object can be read in by the FileReader object, or
    in sections using the `.slice()` method. To upload a very large file, such as
    a video, it may make sense to chop the file into smaller parts and upload each
    part to the server instead of uploading a single file that may be a few hundred
    megabytes. It is also noted that many servers, by default, limit file uploads
    to a few tens of megabytes.


    By using the FileReader interface, your program can read the contents of the file.
    All of these methods return void and the data that will be delivered after the
    browser finishes reading the file into memory, with the onload handler. This asynchronous
    operation is important because it can take some time for a large file to be read
    into the browser.


    The FileReader API has four options for reading data:


    ```

    FileReader.readAsDataURL()

    ```


    Transforms a file to a URL that it can be used in the page. The resultant object
    will contain the full data of the file.


    ```

    FileReader.readAsText()

    ```


    Returns the data as a string. By default, the text is encoded as UTF-8, but you
    can specify a different format.


    ```

    FileReader.readAsBinaryString()

    ```


    Returns the data as a binary string, with no attempt to interpret the contents.


    ```

    FileReader.readAsArrayBuffer()

    ```


    Returns the data as an ArrayBuffer.


    Example 6-2 shows an example of a drop handler. Drag-and-drop file handling will
    be introduced fully with "Drag-and-Drop" on page 71. Now, the concepts to take
    away from this example are that `drop` is the name of the event passed to `addEventListener`
    along with a callback function, and that function is called by the event handler
    with a list of files in the `FileList` object. In this example, the function displays
    the first file in the list by creating a URL on the fly and adding it to an `<img>`
    tag.'
