  md: "It is also possible to use Selenium RC to set up manual tests, by having the\
    \ script open the page and perform all the steps leading up to the point where\
    \ you need to test things. When it gets to the end point, it should pause for\
    \ an extended period of time the browser will close when the tests end. At the\
    \ point that the test stops, a human can take over the browser and perform any\
    \ manual actions that might be needed. This is often helpful when developing a\
    \ multistep wizard or similar user interface.\n\n# # Running QUnit from Selenium\n\
    \nSelenium can run QUnit tests as well. To do so, load the QUnit page in Selenium\
    \ and run the tests. It is also possible to choose to only run a subset of tests\
    \ by passing parameters to the URL string. By integrating Selenium with QUnit,\
    \ you can export the results of browser tests to QUnit into a test runner for\
    \ continuous integration.\n\nSelenium just opens the QUnit URL and stands back\
    \ and waits for the test to finish. To let the test runner know whether the tests\
    \ passed or failed, QUnit provides a simple mock format (Example 3-12 shows how\
    \ many tests were run and how many passed or failed. The unit test can look for\
    \ this data by an XPath selector and make sure all tests passed.\n\nIn Example\
    \ 3-11, the PHP program opens the QUnit test from the start of this chapter and\
    \ waits for the test to run. When the test finishes, the *junit-testresult* element\
    \ will be inserted into the DOM. Some Selenium can find the number of tests that\
    \ were run and how many passed or failed. Example 3-13 shows the PHP code to extract\n\
    \nExample 3-11. Selenium to run QUnit\n\n```\n<?php\nrequire_once 'PHPUnit/Extensions/SeleniumTestCase.php';\n\
    \nclass WebTest extends PHPUnit_Extensions_SeleniumTestCase\n{\n    function testQUnit()\n\
    \    {\n        // Use the URL of your HTML file with the QUnit test\n       \
    \ $this->open('http://localhost/simple.html');\n\n        $this->waitForElement('//p[@id=\"\
    junit-testresult\"]');\n        $failCount = $this->getText('//p[@id=\"junit-testresult\"\
    ]/span[@class='failed']');\n        $passCount = $this->getText('//p[@id=\"junit-testresult\"\
    ]/span[@class='passed']');\n        $totalCount = $this->getText('//p[@id=\"junit-testresult\"\
    ]/span[@class='total']');\n        $this->assertEquals($passCount, $totalCount,\n\
    \            \"Check that all tests passed $passCount $totalCount passed\");\n\
    \        $this->assertEquals(\"0\", $failCount,\n            \"Checking result\
    \ of QUnit tests $failCount/$totalCount tests failed\");\n    }\n}\n```"
