- img_proc: true
  md: "The web socket client does not make sense without a server to go with it. In\
    \ general, web sockets lend themselves well to event-driven data such as a shared\
    \ document, stock ticker, or chat service. Although PHP has often been the standby\
    \ of web development, in this case having a programming model set up for long-running\
    \ processes and events makes more sense.\n\nThere are several good choices here.\
    \ Node.js works, and with the advantage of being JavaScript, which the web programmer\
    \ will already be familiar with. Other possibilities include Erlang and Yaws,\
    \ which have a socket interface and a multiprocessor model that could be ideal\
    \ for this kind of programming. There are also a number of options for Java and\
    \ the other languages based on the JVM, Scala and Clojure. In addition, there\
    \ are implementations for Ruby and probably most of the .NET/CLR languages. Most\
    \ languages that are used for server programming will be able to use web sockets.\n\
    \nIn the example of server code, done in Node.js (see Example 9-2), a server is\
    \ set up with the websocket-server package, which can be found via NPM or on GitHub.\
    \ The server waits for a connection on port 8080, and when one comes in, it calls\
    \ the callback. Connection callback waits for a message to arrive via the connection\
    \ object. In this example, it calls a function called tickerUpdate, which somehow\
    \ finds stock prices. When the relevant symbol has changed, the server sends the\
