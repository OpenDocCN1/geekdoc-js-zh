  md: '# CHAPTER 4

    Local Storage


    The web browser provides JavaScript users a wonderful environment for building
    applications that run in the browser. Using ExtJS or jQuery, it is possible to
    build an app that for many users can rival what can be done in a desktop application,
    and provide a method of distribution that is about as simple as it gets. But however
    nice the browser has been in terms of providing a user experience, it has fallen
    flat when it comes to data storage.


    Historically, browsers did not have any way to store data. They were, in effect,
    the ultimate client. The closest that could have happened was the HTTP cookie
    mechanism, which allows a piece of data to be attached to each HTTP request. However,
    cookies suffer from several problems. First, each cookie is sent back and forth
    with every request. The browser sends the cookie for each JavaScript file, image,
    Ajax request, and so on. This can add a lot of bandwidth use for no reason. Second,
    the cookie specification required to make it that the cookie could be shared among
    different subdomains. If a company had app.test.com and images.test.com, a cookie
    could be set to be visible to both. The problem with this is that outside of the
    United States, three-part domain names become common. For example, it would be
    possible to set a cookie for all the hosts in .co.il would allow a cookie to leak
    to almost every host in Israel. And it is not possible to simply require a three-part
    domain name whenever the name contains a country suffix, because some countries
    such as Canada do not follow


    Having local storage on the browser can be a major advantage in terms of speed.
    A normal Ajax query can take anywhere from half a several seconds to execute,
    depending on the server. However, even in the best possible case it can be quite
    slow. A simple ICMP ping between my office in Tel Aviv and a server in California
    will take an average of 250 ms. At 250 ms, a large part is probably due to basic
    physical limitations: data can travel down the wire at just some fraction of the
    speed of light. there is very little that can be done to make that faster, as
    long as the data has to travel between browser and server.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Local storage options are a very good option for data that is static or mostly
    static. For example, many applications have a list of countries as part of their
    data. Even if the list includes some extra information, such as whether a product
    is offered in each country, the list will not change often. In this case, it works
    to have the data preloaded into a localStorage object, and then by a conditional
    reload so that the user will get fresh data, but not to wait for the current data.


    Local storage is, of course, essential for working with a web application that
    may be offline. Although Internet access may be everywhere these days, it should
    not be regarded as universal, even on smartphones. Users with devices such as
    the iPod touch have access to the Internet only where there is WiFi, and even
    smartphones like the iPhone or Android will have dead zones where there is no
    access.


    With the development of HTML5, a serious movement has grown to provide the browser
    with a way to create persistent storage, but the results of this movement have
    yet to gel. There are currently at least three different proposals for how to
    store data on the client.


    In 2007, as of Gears, Google introduced a browser-based SQLite database. Web-based
    browsers, including Chrome, Safari, and the browsers on the iPhone and Android
    phones, have implemented a version of the SQLite database. However, SQLite was
    dropped from the HTML5 proposal because it is a single-sourced component.


    The localStorage mechanism provides a JavaScript object that persists across web
    reloads. This mechanism seems to be reasonably agreed upon and stable. It is good
    for storing small-sized data such as session information or user preferences.


    This chapter explains how to use current localStorage implementations. In Chapter
    5, we''ll look at a more complicated and sophisticated form of local storage that
    has appeared on browsers: IndexedDB.


    # # The localStorage and sessionStorage Objects


    Modern browsers provide two objects to the programmer for storage, localStorage
    and sessionStorage. Each can hold data as keys and values. They have the same
    interface and work in the same way, with one exception. The localStorage object
    is persistent across restarts, while the sessionStorage object resets itself when
    a browser session restarts. This can be when the browser closes or a window closes.
    Exactly when this happens will depend on the specifics of the browser.


    Setting and getting these objects is pretty simple, as shown in Example 4-1.


    Example 4-1. Accessing localStorage


    ```

    //set

    localStorage.sessionID = sessionID;

    localStorage.setItem(''sessionID'', sessionId);

    ```'
