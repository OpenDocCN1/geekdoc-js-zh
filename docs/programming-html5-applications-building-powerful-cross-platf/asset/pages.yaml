  md: '# CHAPTER 2

    The Power of JavaScript


    Although JavaScript is not a difficult language to program, it can be challenging
    to rise to the level of a true expert. There are several key factors to becoming
    a skilled JavaScript programmer. The techniques in this chapter will appear repeatedly
    in the libraries and programming practices taught in the rest of this book, so
    you should familiarize yourself with these techniques before continuing with those
    chapters.


    There are a number of excellent tools for JavaScript programming, some of them
    listed in the Appendix. These tools can provide you with a lot of assistance.
    Specifically, JSLint will catch a large number of errors that a programmer might
    miss. Sites as StackOverflow and O''Reilly Answers will be a good source of other
    tools.


    This chapter is not a full introduction to the power of JavaScript. O''Reilly
    publishes a number of excellent books on JavaScript, including:


    +   * JavaScript The Good Parts by Douglas Crockford

    * JavaScript: The Definitive Guide by David Flanagan

    * High Performance JavaScript by Nicholas C. Zakas

    * JavaScript Patterns by Stoyan Stefananov


    # Nonblocking I/O and Callbacks


    The first key to JavaScript, after learning the language itself, is to understand
    event-driven programming. In the environment where JavaScript runs, operations
    tend to be asynchronous, which is to say that they are set up in one place and
    execute later after some external event happens.


    This can represent a major change from the way I/O happens in traditional languages.
    Take Example 2-1 as a typical case of I/O in a traditional language, in this case
    PHP. The line $db->getAll($query); requires the database to access the disk, and
    therefore will take orders of magnitude more time to run than the rest of the
    function. While the program is waiting for the server to execute, the query statement
    is blocked and the'
  merge: -1
  pgno: 18
- img_proc: true
  md: "program is doing nothing. In a server-side language like PHP, where there can\
    \ be many parallel threads or processes of execution, this isn't usually a problem.\n\
    \nExample 2-1. Blocking I/O in PHP\n\n```\nfunction getFromDatabase() {\n  $db\
    \ = getDatabase();\n  $query = \"SELECT name FROM countries\";\n  $result = $db->getAll($query);\n\
    \  return $result;\n}\n```\n\nIn JavaScript, however, there is only one thread\
    \ of execution, so if the function is blocked, nothing happens and the user interface\
    \ is frozen. Therefore, JavaScript must find a different way to handle I/O (including\
    \ all network operations). What JavaScript does right away from a method that\
    \ might perceive slow, leaving behind a function that gets called when the operation\
    \ (say, downloading new data from the web server) completes. The function is known\
    \ as a callback. When making an Ajax call to the server, the JavaScript launches\
    \ the request and then goes on to do something else. It provides a function that\
    \ is called when the server is finished. This function is called (hence the term\
    \ callback) with the data that is returned from the server at the time when the\
    \ data is ready.\n\nAs an analogy, consider two ways of buying an item at a grocery\
    \ store. Some stores leave items behind the counter, so you have to ask a salesperson\
    \ for the item and wait while she retrieves it. That's like the PHP program just\
    \ shown. Other stores have a deli counter where you can request an order and get\
    \ a number. You can go off to do other shopping, and when your order is ready,\
    \ you can pick it up. That situation is like a callback.\n\nIn general, a fast\
    \ operation can be blocking because it should return the data requested right\
    \ away. A operation, such as a call to a server that may take several seconds,\
    \ should be nonblocking and return its data via a callback function. The presence\
    \ of a callback option in a function will provide a good clue to the relative\
    \ time it will take for an operation to run. In a single-threaded language like\
    \ JavaScript, a function can't block while waiting for the network or user without\
    \ using the browser.\n\nSo a major step to JavaScript mastery involves using callbacks\
    \ strategically and knowing when they’ll be triggered. When you use a DataStore\
    \ object, for example, the data will not be there for a second or two. Using a\
    \ closure to create a callback is the correct way to handle data loading (“Closures”\
    \ on page 11). All external I/O (e.g., databases, calls to the server) should\
    \ be nonblocking in JavaScript, learning to use closures and callbacks is critical."
  merge: -1
  pgno: 19
