  md: "It would also be possible to have all the state in one large object and to\
    \ store it into one key in the store. This has the advantage of not creating a\
    \ large number of elements in the store, but makes the code more complex. In addition,\
    \ if two windows try to update the store, one could clobber the changes made by\
    \ the other. The local storage solution in this chapter offers no solution to\
    \ the issue of race conditions. In places where it can be a problem, it is properly\
    \ better to use IndexedDB or other solution.\n\n# Offline Loading with a Data\
    \ Store\n\nWhen some of the persistent data used in an application will be relatively\
    \ static, it can make sense to load it to local storage for faster access. In\
    \ this case, the Ext.data.Json Store object will need to be modified so that its\
    \ load() method will look for the data from the localStorage area, Ext.data.JsonStore\
    \ object shall call the server to check whether the data has changed. By doing\
    \ this, the application can make the data available to the user right away at\
    \ the cost of possibly short-term inconsistency. This can make a user interface\
    \ feel faster to reduce the amount of bandwidth that the application uses.\n\n\
    For requests, the data will not have changed, so some form of ETag for data makes\
    \ a great deal of sense. The data is requested from the server with an HTTP GET\
    \ request and an If-None-Match header. If the server determines that the data\
    \ has not changed, it can send back a 304 Not Modified response. If the data has\
    \ changed, the server sends back the new data, and the application loads it into\
    \ both the Ext.data.Json Store and the sessionStorage object.\n\nThe Ext.data.PreloadStore\
    \ object (see Example 4-6) stores data in the session cache as one large JSON\
    \ object (see Example 4-5). It wraps the data that the server sends back in a\
    \ JSON envelope, which allows it to store some metadata with it. In this case,\
    \ the ETag data is stored as well as when the data is loaded.\n\nExample 4-5.\
    \ Ext.data.PreloadStore offline data format\n\n```\n{\n  \"etag\": \"25f9e79423b45388b518f1b624dob\"\
    ,\n  \"LoadDate\": \"26-Jan-2011\",\n  \"data\": {\n    \"root\": [\n      {\n\
    \        \"code\": \"us\",\n        \"name\": \"United States\"\n      },\n  \
    \    {\n        \"code\": \"ca\",\n        \"name\": \"Canada\"\n      }\n   \
    \ ]\n  }\n}\n```"
  merge: -1
  pgno: 66
- img_proc: true
  md: "When building an ETag make sure to use a good hash function. MD5 is probably\
    \ the best choice. SHA1 can also be used, but since it produces a longer string\
    \ it is probably not worthwhile. In theory, it is possible to get an MD5 collision,\
    \ but in practice it is probably not some-thing to worry about cache control.\n\
    \nData in the localStorage object can be changed in Chrome the background. As\
    \ I already explained, the user can change the data from the Chrome Developer\
    \ Tools or from the Firebase command line. Or it can happen unexpectedly because\
    \ the user has two browsers open to the same application. It is important for\
    \ the store to listen for an update event from the localStorage object.\n\nMost\
    \ of the work is done in the beforeload event handler. This handler checks the\
    \ data store for a cached copy of the data, and if it is there, it reloads the\
    \ data as well, but will use the Function.defer() method to delay the load until\
    \ a time when the system has hopefully finished the web page so that the loading\
    \ will be less likely to interfere with the user.\n\nThe store.doConditional()\
    \ method makes an Ajax call to the server to load the data. It includes the If-None-Match\
    \ header so that, if the data has not changed, it will load the current data.\
    \ It also includes a force option that will cause the beforeload handler to activate\
    \ new data and not try to refresh the store from the localStorage cached version\
    \ of the object.\n\nI generally define constants for SECOND, MINUTE, and HOUR\
    \ simply to make the code more readable.\n\nExample 4-6. Ext.data.PreloadStore\n\
    \n```\nExt.extend(Ext.data.PreloadStore, Ext.data.JsonStore, {\n  indexKey: '',\n\
    });\n\n//default index key\nloadDefer: Time.MINUTE,\n// how to defer loading the\
    \ data\nlisteners: {\n  function load(store, records, options) {\n    var etag\
    \ = this.reader.etag;\n    var jsonData = this.reader.jsonData;\n    var data\
    \ = {\n      etag: etag,\n      date: new Date(),\n      data: jsonData\n    };\n\
    \    sessionStorage[store.indexKey] = Ext.encode(data);\n  }\n});\n```"
  merge: -1
  pgno: 67
