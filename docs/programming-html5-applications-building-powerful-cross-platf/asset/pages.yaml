  md: "to the application later. This allows each user to customize the way the elements\
    \ of an application work.\n\nExtJS provides an object to save, but uses cookies\
    \ to store the data. A complex application can create enough state to exceed the\
    \ size limits of cookies. An application with a few dozen grids can overflow the\
    \ size of a cookie, which can lock up the application. So it would be nicer to\
    \ use localStorage, taking advantage of its much larger size and avoiding the\
    \ overhead of sending the data to the server on every request.\n\nSetting up a\
    \ custom state provider object is, in fact, pretty easy. The provider shown in\
    \ Example 4-4 extends the generic provider object and must provide three methods:\
    \ set, clear, and get. These methods simply read and write the data into the store.\
    \ Example 4-4, I have chosen to index the data in the store with the simple method\
    \ of using the string state_ with the state ID of the element being saved. This\
    \ is a reasonable method.\n\n# Example 4-4. ExtJS local state provider\n\n```\n\
    Ext.ux.LocalProvider = function() {\n    Ext.ux.LocalProvider.superclass.constructor.call(this);\n\
    }\n\nExt.extend(Ext.ux.LocalProvider,Ext.state.Provider, {\n    ****************************************************\n\
    \    set: function(name, value) {\n        if (typeof value == \"undefined\" ||\
    \ value === null) {\n            localStorage['state_' + name] = undefined;\n\
    \            return;\n        }\n        else {\n            localStorage['state_'\
    \ + name] = this.encodeValue(value);\n        }\n    },\n\n    ****************************************************\n\
    \    // private\n    clear: function(name) {\n        localStorage['state_' +\
    \ name] = undefined;\n    },\n\n    ****************************************************\n\
    \    get: function(name, defaultValue) {\n        return Ext.value(this.decodeValue(localStorage['state_'\
    \ + name]), defaultValue);\n    }\n});\n\n// set up the state handler\nExt.on.Ready(function\
    \ setUpState() {\n    var provider = new Ext.ux.LocalProvider();\n    Ext.state.Manager.setProvider(provider);\n\
    });\n```"
