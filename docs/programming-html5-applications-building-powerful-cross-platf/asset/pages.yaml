    The manifest is not always very good updating when you think it should. Even with
    a new version of a manifest, it can often take time to update the content in the
    browser. Unless you use control headers, the browser will not download the manifest
    again until several hours after it was last downloaded. Make sure the cache headers
    don''t cache the browser to only download the file, say, every five years, or
    use the ETag header. Or, better yet, have the server set at no cache header. Be
    sure to test well.


    ![](img/3a2d3586be95b30d9b98b5411d3c2bc4_90_0.png)


    # # Events


    When the browser loads a page with a manifest file, it will fire a checking event
    on the window.applicationCache object. This event will fire whether not the page
    has been visited before.


    If the cache has not been seen before, the browser will fire a downloading event,
    and start to download the files. This event will also fire if the manifest file
    has changed. If the manifest has not changed the browser will fire a nought event.


    As the browser downloads the files, it fires a series of progress events. These
    can be used if you wish to provide some form of feedback to the user to let her
    know that software is downloading.


    Once all the files have downloaded, the cached event is fired.


    If anything goes wrong, the browser will fire the error event. This can be caused
    by a problem in the HTML page, a defective manifest, or a failure to download
    the manifest or any resource listed in it. Normally, if a single file is missing
    from the manifest, the cache won''t download any of the files in the manifest.
    When a manifest changes and ends up including a bad link, the old version of the
    file will be retained. If there is no existing manifest it is downloaded, the
    browser will not create an incomplete offline storage, but will continue to work
    on the network.


    However, it is possible that not all browsers or browser versions handle erroneous
    manifests in the exact way just described. Having an automatic test to validate
    all the URLs in a manifest is a good idea. This can be a very hard error to catch
    because there may be very little visible evidence of what went wrong. Catching
    the error object in your JavaScript and presenting it to the user would be a good
    idea, as would some of automatic testing for bad links.'
