    \ different versions of each.\n\nThe implementations of JavaScript and many user\
    \ interfaces are similar among these different browsers, and using a framework\
    \ like jQuery will smooth over some of the differences, but the browsers are not\
    \ exactly the same. So code that works well in Firefox may suddenly break in Chrome\
    \ or Safari. And, of course, code could work well in one version of a browser\
    \ but not on an older or newer version. Testing across a wide matrix of browsers\
    \ is vital. However, it is probably too much for a QA team to do this manually,\
    \ hence the need for automation."
