    The final part of this application is the actual mathematical computation of the
    Mandelbrot set. This function is done as a loop instead of a pure function in
    "Functional Programming" on page 13, because JavaScript does not support tail
    recursion. Doing this as a recursive function would be more elegant, but would
    cause a stack overflow.


    Example 8-5. Mandelbrot computation


    ```

    Complex.prototype.mandelbrot_iteration = 255 * 2;

    Complex.prototype.mandelbrot = function() {

    var x0 = this.x;

    var y0 = this.y;

    var x = x0;

    var y = y0;

    var count;

    var x_, y_;

    var max_iteration = this.max_iteration;

    function in(x, y) {

    return x * x + y * y < 4;

    }

    count = 0;

    while (count < max_iteration && in(x, y)) {

    x_ = x * x - y * y + x0;

    y_ = 2 * x * y + y0;

    count += 1;

    x = x_;

    y = y_;

    }

    return count;

    };

    ```


    While the worker is doing the calculation of the Mandelbrot set, its main event
    is blocked. So it is not possible for the UI process to send it a new computation
    task, or more correctly stated, the worker will not accept the new task until
    the current task is finished.'
