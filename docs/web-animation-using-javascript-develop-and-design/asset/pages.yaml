  md: '# DISPLAY AND VISIBILITY


    Velocity''s display and visibility options correspond directly to their CSS counterparts,
    and accept the same values: "none", "inline", "inline-block", "block", "Flex",
    and so on. In addition, Velocity allows for a value of "auto", which instructs
    Velocity to set the display property to its element''s default value. (For reference,
    anchors and spans default to "inline", whereas divs and most other elements default
    to "block.") Velocity''s visibility option, like its CSS counterpart, accepts
    the "hidden", "visible", and "collapse" values.


    Within Velocity, when the display option is set to "none" (or visibility is set
    to "hidden"), the element''s CSS property is set accordingly the animation has
    completed. This effectively works to hide an element upon completion of an animation,
    and is useful in animating an element''s opacity down to 0 (where the intention
    is to fade an element off the page:


    ```

    // Fade an element to opacity: 0 then remove it from the page''s flow

    $element.velocity({ opacity: 0 }, { display: "none" });

    ```


    > NOTE: The code above effectively replaces the jQuery equivalent:

    $element.animate({ opacity: 0 })

    .hide();


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_41_0.png)


    # QUICK REVIEW OF VISIBILITY AND DISPLAY


    For reference, the CSS display property dictates how an element affects the positioning
    of the elements surrounding it and contained within it. In contrast, the CSS visibility
    property exclusively affects whether an element can be seen. If an element is
    set to "visibility: hidden", it will continue to take up space on the page, but
    its space will be represented by an empty gap—no part of the element will be seen.
    If an element is instead set to "display: none", the element will be fully removed
    from the page''s flow, and all elements within and around it will fill into the
    removed element''s space as if the element never existed.'
