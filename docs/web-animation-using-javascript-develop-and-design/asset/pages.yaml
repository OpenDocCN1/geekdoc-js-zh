  md: '# DESIGN TECHNIQUES


    The techniques discussed so far in this chapter will improve your workflow during
    the coding phase of motion design. The techniques covered in this section focus
    on the design phase, where you''re still experimenting to find the perfect animation
    that fits your UI. This phase requires a lot of creativity and a lot of repetition,
    and is accordingly ripe for workflow improvements.


    # TIMING MULTIPLIERS


    The first design technique is to use a global timing multiplier. This consists
    of sprinkling in a multiplier constant against all of your animations'' delay
    and duration values.

    Start by defining your global timing multiplier (arbitrarily designated as M multiplier):


    ```

    var M = 1;

    ```


    Then, bake the multiplier into the duration and delay option values within each
    animation call:


    ```

    $element1.animate({ opacity: 1 }, { duration: 1000 * M });

    $element2.velocity({ opacity: 1 }, { delay: 250 * M });

    ```


    > NOTE: if you use SASS or LESS, which provide support for variable usage within
    stylesheets, this technique applies equally to CSS animations!


    Embedding a multiplier constant will help you quickly modify the M constant in
    one location (presumably at the top of your style.js) in order to quickly speed
    up or slow down all of the animations across your page. Benefits of such timing
    control include:


    +   Slowing down animations to perfect the timing of individual animation calls
    within a complex animation sequence. When you''re constantly refreshing your page
    in order to tweak a multi-element animation sequence to perfection, seeing the
    sequence in slow motion makes it significantly easier to assess how individual
    elements interact with one another.'
  merge: -1
