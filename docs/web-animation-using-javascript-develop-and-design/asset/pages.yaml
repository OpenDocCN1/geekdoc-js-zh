  md: "# CODE TECHNIQUE: PACKAGE YOUR EFFECTS\n\nOne of the most common uses of motion\
    \ design is fading content in and out of view. This type of animation often consists\
    \ of a series of individual animation calls that are chained together to deliver\
    \ a nuanced, multistage effect.\n\n# STANDARD APPROACH\n\nInstead of simply animating\
    \ the opacity of an element toward 1, you might simultaneously animate its scale\
    \ property so that the elements appear to fade in and grow into place. Once the\
    \ element is fully in view, you might choose to animate its border thickness to\
    \ 1rem as a finishing touch. If this animation were to happen multiple times across\
    \ a page, and on many different elements, it would make sense to avoid repetition\
    \ by turning it into a standalone function. Otherwise, you'd have to repeat this\
    \ non-expressive code throughout your script.js.\n\n```\n$element\n  velocity({\
    \ opacity: 1 }, duration: 500,\n    easing: \"ease-in-out\"})\n  velocity({ borderWidth:\
    \ \"1rem\" }, delay: 200,\n    easing: \"spring\", duration: 400 });\n```\n\n\
    Unlike the sequencing technique discussed in the previous section, the code above\
    \ consists of multiple animations that occur on the same element. Chained animations\
    \ on a single element constitute an effect. If you were to improve this effect\
    \ by implementing the first technique in this chapter (turning CSS classes into\
    \ JavaScript objects), you'd have to go out of your way to uniquely name each\
    \ argument object for each stage in the overall animation. Not only is it possible\
    \ that these objects would not be used by other portions of the animation code\
    \ due to the uniqueness of this particular sequence, but you'd have to deal with\
    \ appending integers to each animation call's respective objects to delineate\
    \ them from one another. This could get messy, and neutralize the organizational\
    \ effort and benefit of turning CSS classes into JavaScript objects.\n\nAnother\
    \ problem with effects such as the one above is that the code isn't very self-descriptive—its\
    \ purpose isn't immediately clear. Why are there two animation calls instead of\
    \ one for each of these individual calls? The answers to these questions are irrelevant\
    \ to the code that triggers the animation, and should consequently be tucked away."
  merge: -1
