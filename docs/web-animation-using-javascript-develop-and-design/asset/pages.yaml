  md: '# CREATING IMAGES THROUGH CODE


    An SVG element is a type of DOM element that borrows the syntax of the HTML elements
    you''re already familiar with to define arbitrary shapes. SVG elements differ
    from HTML elements in that they have unique tags, attributes, and behaviors that
    allow them to define graphic shapes. Put another way, SVGs let you create images
    through code. This is a tremendously powerful concept because it means you can
    programmatically style and animate these shapes using JavaScript and CSS. In addition
    offers many other benefits:


    +   - SVG compresses incredibly well. Graphics defined in SVG have smaller file
    sizes than their PNG/JPEG equivalents, which can greatly improve site load times.

    - SVG graphics scale to any resolution without a loss of clarity. Unlike standard
    image formats, they look razor sharp across all devices—say good-bye to blurry
    images on screens.

    - Like HTML elements, SVG elements can be assigned event handlers that respond
    to a user''s input, which means that the graphics on your page can be made interactive.
    If you so desired, all the buttons on your site could be turned into animated
    graphics.

    - Many photo-editing apps (including Adobe Photoshop, Sketch, and Inkscape) let
    you export your design into SVG format for quick copying and pasting into HTML.
    So, even if you don''t consider yourself an artist, you can leverage third-party
    applications to do the designing for you.


    In short, SVGs are an amazing graphics solution. Let''s dive in!'
  merge: -1
