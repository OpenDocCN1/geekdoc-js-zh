  md: "# THE STANDARD APPROACH\n TEXT ANIMATION\n\nThe standard HTML elements we code\
    \ with—divs, tables, anchor tags, and the like—are the lowest-level components\
    \ of a webpage that can be styled. So it makes sense that these are the lowest-level\
    \ components that can be animated.\n\nText does not constitute an element unto;\
    \ a block of text is designated by the browser as a text node, which is an unstylable,\
    \ lower-level component that must be contained by an element. Further complicating\
    \ factors is that the browser does not subdivide text nodes into grammatical components;\
    \ there is no way to access individual letters, words, or sentences.\n\nConsequently,\
    \ to animate a letter, word, or sentence basis, you have to break each text node\
    \ into separate text nodes, and then wrap each of these in a new element. You\
    \ can animate them. But manually wrapping text in span elements, for example,\
    \ is tedious work that results in bloated HTML.\n\nIt’s no surprise that text\
    \ animation on the web is uncommon; it’s typically too much of a hassle to deal\
    \ with software. This puts the web at an aesthetic disadvantage to dedicated motion\
    \ design software, such as Adobe After Effects, which allows for the fine-grained\
    \ animation of text—the results of which are commonly seen in TV commercials and\
    \ movie title sequences. These effects can look absolutely beautiful. Unfortunately,\
    \ in addition to being difficult to integrate on the web, they’re also widely\
    \ considered bad practice. After all, the web is a medium that prioritizes function\
    \ over form, and text animation is largely about form.\n\nHowever, there is one\
    \ textual animation case that can carry well over the web when used sparingly;\
    \ if you pay close attention to the depictions of futuristic hardware interfaces\
    \ in movies, you’ll notice the common thread of text being animated into out of\
    \ view on a graphical level. The future of computing, according to pop culture,\
    \ consists of words and sentences animating with flickers, glitches, pops and\
    \ bursts. These effects look cool, and there isn’t much downside to embracing\
    \ them for the purposes of transitioning content into out of view since the text\
    \ had to undergo a visibility animation by one means or another. This concept\
    \ of transitioning text visibility is precisely what you’ll learn about in this\
    \ chapter."
  merge: -1
  pgno: 94
