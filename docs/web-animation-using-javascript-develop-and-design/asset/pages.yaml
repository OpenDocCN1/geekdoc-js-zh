  md: '# JAVASCRIPT VS. CSS ANIMATION


    There''s a false belief in the web development community that CSS animation is
    the only performant way to animate on the web. This misconception has led many
    developers to abandon JavaScript-based animation altogether, forcing them to


    +   - Manage the entity of user interface (UI) interaction within style sheets,
    which can quickly become difficult to maintain.

    - Sacrifice real-time animation control, which is achievable only within JavaScript.
    (Timing control is necessary for designing animation into UIs that respond to
    a user''s drag input, like those found in mobile apps).

    - Forgot physics-based motion design, which allows elements on a webpage to behave
    like objects in the real world.

    - Lose support for older browser versions, which remain popular throughout the
    world.


    JavaScript-based animation is actually often as fast as CSS-based animation. CSS
    animation is mistakenly considered to have a significant leg because it is most
    often compared to jQuery''s animation features, which are in fact very slow. However,
    alternative JavaScript animation libraries that bypass jQuery entirely deliver
    fantastic performance by streamlining their interaction with a page.


    > NOTE: One library of note, which we''ll be using throughout this book, is Velocity.js.
    It''s lightweight yet incredibly feature rich, and it mirrors jQuery''s animation
    syntax to help eliminate the learning curve.


    Of course, CSS is perfectly suited for hover animations (turning a link blue when
    the mouse is positioned over it, for example), which are very often the extent
    to what basic webpages include animation. CSS transitions fit seamlessly into
    existing stylesheets, allowing developers to avoid bloating their pages with unnecessary
    JavaScript libraries. What''s more, CSS animation delivers blazing performance
    out of the box.


    But this book will demonstrate why JavaScript is often the superior choice for
    animations beyond simple hover state animations.'
  merge: -1
  pgno: 18
