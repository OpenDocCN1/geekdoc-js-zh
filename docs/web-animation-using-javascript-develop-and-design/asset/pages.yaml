  md: '# CODE TECHNIQUE: SEPARATE STYLING

    FROM LOGIC


    The first technique has profound workflow benefits, especially for teams.


    # STANDARD APPROACH


    In jQuery animation, it''s common to animate CSS classes onto elements using the
    UI

    add-on plugin (jQueryUI.com). When the module is loaded, jQuery''s addClass()
    and

    removeClass() functions are upgraded with animation support. For example, let''s

    you have a CSS class defined in a stylesheet as:


    ```

    .fadeInAndMove {

    opacity: 1;

    top: 50px;

    }

    ```


    You can then animate the CSS properties of that class (opacity and top in this
    case)

    to the target element along with a specified duration:


    ```

    // Animate the properties of the .fadeInAndMove class over a

    → 1000ms duration

    element.addClass("fadeInAndMove", 1000);

    ```


    The most common implementation of jQuery animation consists of inclining the

    desired animation motion within an $.animate() call, which uses the syntax

    demonstrated in Chapter 1, (Advantages of JavaScript Animation):


    ```

    $element.animate({ opacity: 1, top: 50 }; 1000);

    ```


    Both implementations produce the same result. The difference is that separation
    of

    logic: The first implementation delegates the styling rules to a CSS stylesheet,
    where

    the rest of the page''s styling rules reside. The second mixes styling rules with
    the JavaScript

    logic responsible for triggering them.


    The first approach is preferable due to the organizational cleanliness and flexibility

    gained by knowing where to look to make the appropriate style or logic changes
    for

    code. CSS stylesheets exist for a reason; seasoned developers do not inline CSS
    into

    their HTML. That would conflate of HTML (structure) and CSS (styling),

    and make a site considerably more difficult to maintain.'
  merge: -1
  pgno: 73
- img_proc: true
  md: "The value of logic separation is further pronounced when working in a team\
    \ environment, in which it's common for developers and designers to bump heads\
    \ while trying to edit the same file at the same time.\n\n# OPTIMIZED APPROACH\n\
    \nWith the review of standard methods out of the way, let's look at the optimized\
    \ approach. It's just as beneficial—and often the best methodology for JavaScript-centric\
    \ animation workflows—to shift animation logic into a dedicated JavaScript file\
    \ (for example, a style.js) rather than a dedicated CSS stylesheet. Sounds weird,\
    \ right? Perhaps, but it works brilliantly. This technique leverages plain old\
    \ JavaScript objects to help you organize your animation code.\n\nFor example,\
    \ your style.js file might look like this:\n\n```\n// This object is a parallel\
    \ to the CSS class defined in the previous\nvar fadeIn = {\n  opacity: 1,\n  top:\
    \ \"50px\"\n}\n```\n\nIn your script.js, which is the primary JavaScript file\
    \ that controls animation logic, you would then have:\n\n```\n// Pass our named\
    \ properties object into Velocity\n$element.velocity(fadeIn, 1000);\n```\n\nTo\
    \ recap, in your style.js, you've defined a JavaScript object's populated with\
    \ the CSS properties you want to animate. This is the same object that's then\
    \ passed into Velocity as a first argument. You're not doing anything here—just\
    \ saving objects to named variables, then passing those variables into Velocity\
    \ instead of the raw objects themselves.\n\n> NOTE: This technique works well\
    \ equally with jQuery's animate() function."
  merge: -1
  pgno: 74
- img_proc: true
  md: '![](img/556d1045d4d84ff85ee82fbcd7feb49f_75_0.png)'
  merge: -1
  pgno: 75
- img_proc: true
  md: "The benefit of switching from CSS to JavaScript segregate logic is that your\
    \ style.js file is uniquely capable of defining animation options—not just animation\
    \ properties. There are many ways to specify an option: one is assign two member\
    \ properties to a parent animation object which you assign an expressive name.\
    \ The first property on the object defines the animation's properties; the second\
    \ defines its options.\n\nIn this case, your style.js file would look like this:\n\
    \n```\nvar fadeIn = {\n  // p is for \"properties\"\n  p: {\n    opacity: 1,\n\
    \    top: \"50px\"\n  },\n  // o is for \"options\"\n  o: {\n    duration: 1000,\n\
    \    easing: \"linear\"\n  }\n}\n```\n\nIn the script.js file, you'd have:\n\n\
    // Pass in our clean and re-usable animation objects\n$element.velocity(fadeIn.p,\
    \ fadeIn.o);\n\nPretty and clean, right? Someone skimming it would understand\
    \ its purpose, and would know where to look to modify its properties—the style.js\
    \ file. Further, the purpose of this animation is immediately evident: you've\
    \ named the animation object appropriately, you know that the code serves to fade\
    \ an object into view. You no longer have to mentally parse animation properties\
    \ to assess the purpose of the animation.\n\nThis approach discourages you from\
    \ arbitrarily setting options for each individual animation on a page since there's\
    \ now a bank of premade animation objects you can easily pull from. This results\
    \ in leaner code and more consistent motion design. Consistency, as you learned\
    \ in the previous chapter, is a key component of great UX."
  merge: -1
  pgno: 76
- img_proc: true
  md: "But the best part is that this approach lends itself perfectly to organizing\
    \ your animation variations together. For example, if you typically fade button\
    \ elements into view with a duration of 100ms, but you fade modal windows into\
    \ view with a duration of 300ms, you can simply split your object into two appropriately\
    \ named variations:\n\n```\nvar fadeIn = {\n  p: {\n    opacity: 1,\n    top:\
    \ \"50px\"\n  },\n  // Options object variation #1 uses a fast duration\n  oFast:\
    \ {\n    duration: 1000,\n    easing: \"linear\"\n  },\n  // Variation #2 uses\
    \ a slower duration\n  oSlow: {\n    duration: 3000,\n    easing: \"linear\"\n\
    \  }\n};\n// Animate using the fast duration.\n$button.velocity(fadeIn.p, fadeIn.oFast);\n\
    /* Animate using the slow duration. */\n$modal.velocity(fadeIn.p, fadeIn.oSlow);\n\
    ```"
  merge: -1
  pgno: 77
- img_proc: true
  md: "Alternatively, you could nest “fast” and “slow” objects as children of a singular\
    \ options object. The choice of which implementation to use is based on your personal\
    \ preference:\n\n```\nvar fadeIn = {\np: {\n  opacity: 1,\n  top: \"50px\"\n},\n\
    o: {\n  fast: {\n    duration: 1000,\n    easing: \"linear\"\n  },\n  slow: {\n\
    \    duration: 3000,\n    easing: \"linear\"\n  }\n}\n};\n// Animate using the\
    \ fast duration.\n$button.animate(fadeIn.p, fadeIn.o.fast);\n/* Animate using\
    \ the slow duration. */\n$modal.velocity(fadeIn.p, fadeIn.o.slow);\n```\n\nIf\
    \ this seems like too much overhead, and if you have enough lines of JavaScript\
    \ to justify simply inlining all your animation logic, then don't feel like a\
    \ bad developer for skipping this approach altogether. You should always use degree\
    \ of abstraction best suits the scope of your project. The takeaway here is simply\
    \ that animation workflow best practices do exist if you find yourself needing\
    \ them."
  merge: -1
