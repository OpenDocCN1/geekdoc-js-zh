    \ Animate the cx and cy coordinates of a circle\n$(\"circle\").velocity({ cx:\
    \ 100, cy: 100 });\n// Animate the dimensions of a rectangle\n$(\"rect\").velocity({\
    \ width: 200, height: 200 });\n// Animate the radius of a circle\n$(\"circ\").velocity({\
    \ r: 100 });\n```\n\nAll the Velocity attributes features that you're currently\
    \ using—animation reversal, UI pack effects, sequence triggering, and so on—work\
    \ as expected with SVG elements.\n\n# POSITIONAL ATTRIBUTES VS. TRANSFORMS\n\n\
    You might be wondering what the difference is between using the x, y, and y positional\
