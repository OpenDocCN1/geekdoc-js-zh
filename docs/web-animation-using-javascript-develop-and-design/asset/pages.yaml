- img_proc: true
  md: 'The utility of motion design leverages user psychology. When a user presses
    a button, can she be confident that the press was acknowledged by the UI? An easy
    way to ensure her confidence is to animate the button''s transition to a depressed
    state. When a user is waiting for content to load, can she be confident that progress
    is being made or is she left with the unsettling feeling that the app has frozen?
    These are psychological expectations that motion design can address by providing
    ongoing visual indications of the UI''s state.


    The complementary elegance of motion design is what elevates an app from merely
    looking good to feeling good. It''s the source of that "ooh ahh" feeling that
    reminds the user how magical technology can be.


    Let''s master both of these aspects. Let''s dive in.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# UTILITY


    How do you ensure your motion design choices are valuable additions to your site?

    Here are some techniques.


    # BORROW CONVENTIONS


    Let yourself be inspired by the motion design in your favorite sites and apps.
    Popular motion design conventions are worth leveraging because they already hold
    meaning in the user''s mind. Repeated exposure to conventions leads the user to
    form expectations about how animations “should” look. If you use a convention
    for a purpose other than what the user has to expect, your app will feel unintuitive.


    The more you copy design effects from elsewhere, the more familiar your app will
    feel to the user. The more familiar an app, the quicker the user will feel comfortable
    with and confident about it. While there''s utility in novelty, the motion design
    of everyday UI elements shouldn''t be novel. Reserve novelty for animation sequences
    that carry little meaning or are hard to misconstr, such as a page''s loading
    sequence or a status indicator animation, respectively.


    # PREVIEW OUTCOMES


    When an element on your page has an ambiguous purpose, give the user a preview
    of the outcome of interaction. This provides reassurance that the element does
    what the user thinks. A simple example of this would be a button that initiates
    a file sending over visual radio pulses when hovered over. This leverages a common
    graphic design trope to tell the user that a data transfer action will occur.


    A less ambiguous kind of previewing outcomes is to show part of the animation
    that occurs when the user actually takes an action. For example, an in-progress
    file transfer indicator animation begins running when the user clicks a button,
    implement motion design such that hovering over the triggering element랴 the in-progress
    animation. When the user hovers off the element, reverse the partial animation
    so the file transfer indicator returns to its default state. This type of previewing
    technique helps the user immediately understand the effect that her actions will
    trigger, which helps to reassure her of the purpose of UI elements. The more the
    user feels, the more in control she feels. The more in control she feels, the
    more pleasant the experience.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# DISTRACTION OVER BOREDOM


    When a user performs a rote, non-engaging task on your page—such as filling out
    a long form—you can use color and movement to raise her level of awareness and
    intrigue. For example, you might animate a check mark when she successfully completes
    each form field. This keeps the user’s mind superbly engaged with the interface,
    which less the dullness of the task at hand. Similarly, you could show the user
    an eye-catching loading indicator while she waits for content. A great example
    of this can be found in Lyft, a popular ride-sharing app, which animates a balloon
    rhythmically floating and down on a blank canvas while the app loads into memory.


    Allowing the user’s brain to relax and feel the pleasurable momentum of repeated
    movement keeps her more engaged with your content. However superficial this may
    seem, it works. Recognize that this technique should be used in situations where
    the user will experience an unavoidable stretch of boredom; avoid using it as
    a Band-Aid any time you feel like spicying up your UI.


    Let’s consider another example: when Facebook loads content into its News Feed,
    it animates a blurring of dummy text until the real text is ready to be shown.
    This rhythmic blurring not indicates that the interface is hard (as opposed to
    having stalled), but specifically tells the user which portion of the UI she’s
    waiting on. This technique is called inline status indication. Compare this to
    the ubiquitous status indicator, which is as old as the web itself: the superimposition
    of a single, looped animation graphic on a page that is discomfortably devoid
    of content. Users are tired of this. Inline status indication, in contrast, lets
    you show much of the interface as possible by blocking out only the specific sections
    whose content has yet to load. This is not only more nuanced, but also gives the
    user more content to fix her eyes on she twles her thumbs waiting for the page
    to fully load.


    The takeaway here is simple: the more you give users to engage with, the longer
    it’ll for them to get bored.


    # LEVERAGE PRIMAL INSTINCTS


    The human brain has a region dedicated to visual processing. We’re programmed
    to respond to sudden movements whether we want to or not. So, if an important
    action is occurring on the page that requires the user’s immediate attention,
    considering movement to flag her attention. A common way to alert the user is
    to “bounce” an element by repeatedly translating it up and down. This implementation
    sits in contrast to animating the element’s color, which doesn’t exploit instincts;
    we’re not programmed to instinctively interpret color changes as worthy of our
    immediate'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'attention. (However, consider how repeated exposure in some countries, people
    are trained to interpret red as “stop” and green as “go”, which are examples of
    socially reinforced meaning. When designing motion, take this phenomenon into
    consideration as well.)


    Diving deeper into psychology, the user interprets movement toward as an urgent
    notice that requires action, whereas she interprets movement away from her getting
    out of her way and, consequently, not requiring action.


    # MAKE INTERACTIONS VISCERAL


    Big, squishy buttons with rich color gradients make the user want to click. Elements
    like these reward clicking with a satisfying sense of pressure exertion and color
    explosion. The lesson here is one of incentivization: the more intriguing it is
    to click a button, the more a user will do it. Leverage this phenomenon for important
    calls to action that make the user to engage with, such as buttons for registering
    a new account or checking out of a shopping cart.


    # REFLECT GRAVITAS


    If the user has taken an action with irreversible consequences, reinforce that
    notion by using motion design that feels equally important. For example, the animation
    associated with clicking a Delete button should feel more significant than the
    animation associated with hovering over a standard navigation dropdown. The latter
    may entail a simple color change, the former might consist of a sudden jump in
    size and a thickening of the element’s border. By divying up motion design along
    a gradient of severity, you’ll help the user intuitively grasp the hierarchy of
    the available actions. technique, along with the others detailed in this chapter,
    serves the goal of increasing user understanding and confidence.


    # REDUCE CONCURRENCY


    To some extent, users are always trying to make sense of your UI. Consciously
    or unconsciously, they ascribe meaning to every design and motion design choice
    you make. So, if you present the user with extended animation sequences consisting
    of many elements animating into view concurrently, you will compromise their ability
    to parse the meaning of all the movements taking place.


    In short, if you’re using motion design to indicate something important, make
    sure you’re not indicating many different things at once. If you are, consider
    breaking animations into steps or reducing the total animation count.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# REDUCE VARIETY


    Related to the best practice of reducing concurrency is the concept of limiting
    animation variations you have, the more reassured the user will feel that she''s
    fully abreast of what each animation in your UI connotes. For example, if you
    use one type of animation for bringing big images into view, but a different type
    for bringing small images into view, consider consolidating them into. If the
    differentiation between them was merely for aesthetic purposes rather than improving
    usability, you''ve successfully eliminated unnecessary complexity from your UI,
    and reinforced behavioral consistency in the process. Consistency leads to pattern
    recognition and understanding. Understanding leads to increased user confidence.


    # MIRROR ANIMATIONS


    A tangential aspect of limiting animation variety is consistency in your choice
    of animation property and option combinations. For example, if you have a modal
    that animates into view by transitioning opacity and scale, ensure that the modal
    animates out of view with these two properties reverting to their original values.
    Don''t change properties for the two sides of the coin. Doing so will make the
    user question what prompted the differentiation, and needlessly raised questions
    are the hallmark of a bad user experience.


    When working with properties that affect translation (for example, translateX,
    left, marginLeft in CSS), mirroring applies literally: if a modal animates into
    view by sliding down from the top of the page, have it animate out of view by
    sliding back up toward the top of the page. Conversely, if you were to have the
    modal animate out of view by further sliding down off the page, you''d be indicating
    to the user that the modal has been sent somewhere *new* as opposed to having
    gone back where it came. Typically, you want to imply that the modal dialog has
    gone back where it came from now that the user is done, say, changing account
    settings. If the user were instead sending an email, having the modal animate
    off the page would be contextually appropriate because it reinforces the idea
    that the email is being sent from its origin (the user) to a *new* location (the
    recipient).'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# LIMIT DURATIONS


    Designers often make the mistake of letting animations run too long, causing the
    user to wait needlessly. Never let UI flourishes slow down the apparent speed
    of your page. If you have a lot of content fading into view within a larger animation
    sequence, ensure that the total duration across the entire sequence is short.


    Similarly, if there''s a part of your UI—a profile image, for instance—that transitions
    out or of view on a frequent basis due to we users interact with you, be extra
    careful not to allow protracted durations. Seeing a piece of motion design unfold
    is the first time, but seeing it unfold dozens times every time a user interacts
    with an app becomes burdensome very quickly—especially if the user feels repeatedly
    waiting for the animation to play out is significantly increasing the overall
    UI wait time.


    Since it''s difficult to judge the appropriateness of your animations after seeing
    them play out dozens of times during testing, a good rule of thumb is to speed
    up all animations by 25 percent before you push a site live to production. This
    will help ensure that they always lead toward the faster side. (See Chapter 4,
    "Animation Work-flow" for tips on how to quickly time-shift your animations.)


    # LIMIT ANIMATIONS


    Removing an animation altogether doesn''t detract from the user''s understanding
    of your interface, consider dropping it and using an instant styling change in
    its place. The more animation you have have throughout your UI, the more the user
    will get used to seeing them. The more she gets used to seeing them, the less
    attention they''ll pay to them, and the less likely she''ll be able to differentiate
    between the different types of motion design and what each signifies.


    The vast majority of your motion design should be subtle—minor color changes on
    hovers, for example—so the few instances of grandiose motion design that do exist
    should pop to convey their intended message.'
  merge: -1
