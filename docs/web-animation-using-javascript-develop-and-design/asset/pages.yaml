  md: '# THE REALITY OF WEB PERFORMANCE


    If you''ve ever wondered why running concurrent animations slows down your UI,
    or why your site performs slowly on mobile devices, this chapter is for you.


    Animations are a very resource-intensive process for browsers to perform, but
    there are many techniques that can help the browser work as efficiently as possible.
    We''re about to learn them.


    From the perspective of UI design, there''s no shortage of articles excelling
    the virtues of mobile-first, responsive websites. Conversely, from the perspective
    of UI performance, most of us, as developers, are unaware of what best practices
    are or how to follow them. Staying abreast of the web performance landscape is
    overwhelming and oftentimes futile; we''re held captive by browser and device
    quirks, byproducts of the volume of devices (desktops, smartphones, and tablets)
    and browsers (Chrome, Android, Firefox, Safari, Internet Explorer) that crowd
    the ecosystem. Considering that these platforms are continuously updated, it''s
    no surprise that we often throw in the towel and sideline performance concerns
    as much as we can. Sometimes we may be tempted to do with animations altogether
    if we''re unsure how to implement without sacrificing performance.


    We tell ourselves:


    > Since devices are getting faster, as users continue upgrading hardware, my site
    will become progressively more performant.


    Unfortunately, the global reality is the exact opposite: the smartphones that
    the developing world is adopting fall short of performance of the latest iPhones
    in our pockets. Do you really want to forsake building products for the next few
    people coming online? The upcoming Firefox OS initiative is poised to bring capable
    smartphones to hundreds of millions of people, so we''re not simply waxing poetic
    about hypot. The mobile revolution is here now.


    NOTE: Ericsson has reported that the global smartphone subscriber count will rise
    from 1.9 billion to 5.9 billion in the next five years—fueled almost exclusively
    by the developing world.


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_132_0.png)'
  merge: -1
  pgno: 132
- img_proc: true
  md: '![](img/556d1045d4d84ff85ee82fbcd7feb49f_133_0.png)'
  merge: -1
