  md: '# ELEGANCE


    The line between frivolous and consequential motion design is an easy one to discern:
    does a particular piece of motion design satisfy one of the best practices discussed
    in the "Utility" section of this chapter? If not, remove it. It’s frivolous, and
    it’s jeopardizing the usability of your UI.


    # DON''T BE FRIVOLOUS


    To hone your judgment about what is frivolous, download the most popular apps,
    play with each extensively, and judge whether they feature animation to a greater
    or lesser extent than your app does. Pay close to attention to what each animation
    conveys, and why it conveys. If you feel that these apps use animation to a much
    lesser extent than yours does, consider toning back the motion design in your
    UI.


    There’s one exception to this don’t-be-frivolous mantra—read on!",


    # YOUR ONE OPPORTUNITY TO BE FRIVOLOUS


    A page’s loading sequence—when all of your elements animate into view from an
    initial state of invisibility—is your one opportunity to be over-the-top and frivolous
    with your animations. Why? Because this sequence happens only once, and it won’t
    repeatedly get in the way of the user’s interaction with your site. Also, this
    is your moment to leverage your motion design skills to deliver a great first
    impression on your site.


    If you have a cool idea for animating your content into view, then do it here.
    But be sure to respect all the other rules in this chapter, especially limiting
    durations.


    # CONSIDER PERSONALITY


    If you were designing a corporate site, Bounciness is playful—not a quality that
    corporate sites often want to elements into sites to convey. And if you were designing
    an educational or government app, you wouldn’t use easings that result in movement
    that starts very quickly before finishing very slowly (thereby conveying a whizzing-by-your-face
    futuristic slickness)—these would be too glossy and stylized for the content at
    hand.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'Always be considerate of the personality expressed by your animation decisions.
    As a designer, it’s hard to judge the tone of your own work, so it’s a good idea
    to get third-party feedback early and often. Ask test users whether a UI feels
    professional, friendly, and sleek, and tweak your motion design according to your
    preference for each of these three traits.


    # GO BEYOND OPACITY


    The most common means of transitioning an element into or out of view is to animate
    its opacity from 0 to 1, and vice versa. This can be rather boring. Opacity is
    just the base property that to be animated when displaying or hiding content—it’s
    not the only. You can spice up your property choices by scaling an element down,
    sliding it out of view, or changing its background color. As you add more properties
    to animation, consider leveraging multistep effects, which you’ll learn in the
    next technique.


    # BREAK ANIMATIONS INTO STEPS


    The simplest path to professional-looking motion design is to break animations
    into multistep effects. For example, if you’re animating an image into view by
    transitioning its opacity and scale from 0 to 1, consider first animating the
    element’s opacity to 0.5—half of its final value—followed by animating its scale
    from 0 a while simultaneously animating the remaining half of opacity. Breaking
    the animations of properties into steps like this removes the linearity that’s
    common to most amateur motion design on the web—wherein all properties animate
    perfectly in sync. In the real world, the properties of objects in motion do not
    all accelerate in sync: Consider how, a bird flies, moves forward (translate)
    at a different rate than it moves up and down (translate). If it were to move
    linearly in both of its X and Y axes, it would look more like a bullet than an
    animal. Great motion design borrows from the movement of living, breathing things
    because UI are for humans—not machines—and humans feel expression and reaction.


    If you pay attention to the futuristic UI animation in movies, you’ll notice that
    intricate multistep animations are a key component in case making them look so
    sleek. The reason for this is simple, and it further supports the case for avoiding
    linearity: humans are attracted to variety and contrast. Consider how, when you
    break up an animation, you’re contrasting and juxtaposing the individual components
    of that'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'animation against each other. Just like layering up clothing to create pleasant
    color and texture combinations, you should layer animations to create pleasant
    motion design combinations.


    For advice on the technical implementation of multistep effects, read Chapter
    4, "Animation Workflow."


    # STAGGER ANIMATIONS


    When multiplying sibling elements—say, a series of images in a gallery—are animating
    view at the same time, consider adding a tiny delay between them. (That is, after
    the first image loads, a delay occurs before the second image loads, and so on.)
    To delay the animation of sibling elements in this way is called staggering, and
    its purpose is similar to that of breaking an animation into steps: it adds visual
    layering by preventing all your elements from animating perfectly in sync, which
    can look plain and inelegant to staggered loading. Why? Because animating a series
    of elements in sync lacks any sense of granularity or gradation. Consider this:
    Birds don''t fly side by side in a straight line. What makes their aerial movements
    so graceful is their successive formation and timing. It''s their juxtaposition,
    and the motion of their juxtaposition, that makes them so elegant to the human
    eye.


    # FLOW FROM THE TRIGGERING ELEMENT


    If clicking a button causes a modal to appear, have the modal animate out from
    the button''s location. In other words, have animations flow from the elements
    that trigger them. This bridges the cause-and-effect relationships in your UI,
    making individual elements feel better coupled and organized.


    To understand the psychological benefit of this technique, consider how motion
    works in the real world: when you pull a lever, a series of mechanical parts causes
    a connected object. The key is the word: real objects don''t move unless a force
    is exerted upon them. Likewise, it''s important to treat every element in your
    UI as an element capable of exerting its own force. Every action should feel connected
    to a trigger. This sort of seamless experience is what helps an interface transcend
    from the digital to the physical. The more physical an interface is, the more
    responsive and emotive it feels.'
  merge: -1
