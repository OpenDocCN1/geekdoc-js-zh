  md: "# BEGIN AND COMPLETE\n\nThe begin and complete options allow you to specify\
    \ functions to be triggered at certain points in an animation: Pass the begin\
    \ option a function to be called prior to the start of an animation. Conversely,\
    \ pass the complete option a function to be called at the completion of an animation.\n\
    \nWith both options, the function is called once per animation call, even if multiple\
    \ elements are being animated at once:\n\n```\nvar $divs = $(\"div\");\n$divs.velocity(\n\
    \  opacity: 0,\n  // Open an alert box before the animation begins\n  begin: function\
    \ () { console.log(\"Begin!\"); },\n  // Open an alert box once the animation\
    \ completes\n  complete: function () { console.log(\"Complete!\"); }\n);\n```\n\
    \n# CALLBACK FUNCTIONS\n\nThese options are commonly referred to as \"callback\
    \ functions\" (or \"callbacks\") since they are \"called\" when certain events\
    \ occur in the future. Callbacks are useful for firing events that are dependent\
    \ on the visibility of elements. For example, if an element starts at invisible\
    \ it animates toward an opacity of 1, it may be appropriate to subsequently trigger\
    \ a UI event that modifies the new content once users are able to see it.\n\n\
    Remember that you don't need to use callbacks to queue animations one after another;\
    \ animations automatically fire sequentially when more than one is assigned to\
    \ a single element or set of elements. Callbacks are for the queuing of non-animation\
    \ logic."
