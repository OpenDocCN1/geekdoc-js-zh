    element(s) are passed directly into the animation as the first argument:


    ```

    Velocity(element, { opacity: 0.5 }, 1000)); // Velocity

    ```


    Velocity retains the same syntax as jQuery''s .animate() even when it''s used
    with jQuery; the difference is that all arguments are shifted one position to
    the right to make room for passing in the targeted elements in the first position.
    Further, the global Velocity object is used to invoke animations instead of specific
    jQuery element objects.


    When you''re using Velocity without jQuery, you''re no longer animating jQuery
    elements, but rather raw Document Object Model (DOM) elements. Raw elements can
    be retrieved using the following functions:


    +   - document.getElementById(): Retrieve an element by its ID attribute.

    - document.getElementsByTagName(): Retrieve all elements with a particular name
    (e.g. a, div, p).

    - document.getElementsByClassName(): Retrieve all elements with a particular CSS
    class.

    - document.querySelectorAll(): This function works nearly identically to jQuery''s
    selector engine.


    Let''s explore document.querySelectorAll() since it will probably be your weapon
    of choosing elements without the aid of jQuery.(It''s a performant function that''s
    widely supported across browsers.) As with jQuery''s element selector syntax,
    you simply pass selector a CSS selector (the same selectors you use in your stylesheets
    for targeting elements), and it will return all matched elements in the form of
    an array:'
