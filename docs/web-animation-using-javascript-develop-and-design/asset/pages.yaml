  md: "# TECHNIQUE: DON’T CONTINUOUSLY REACT TO SCROLL AND RESIZE EVENTS\n\nBe mindful\
    \ of how often your code is being run. A fast snippet of code being run 1,000\
    \ times per second may—in agregate—no longer be very fast.\n\n# PROBLEM\n\nBrowsers'\
    \ scroll and resize events are two event types that are triggered at very high\
    \ rates: when a user resizes or scrolls the browser window, the browser fires\
    \ the callback functions associated with these events many times per second. Hence,\
    \ if you've registered callbacks that interact with the DOM—or worse, contain\
    \ layout thrashing—they can cause tremendously high load during times of scrolling\
    \ and resizing. Consider the following code:\n\n```\n// Perform an action when\
    \ the browser window is scrolled\n$(window).scroll(function() {\n  // Anything\
    \ in here is fired multiple times per second while the\n  -> user scrolls\n});\n\
    \n// Perform an action when the browser window is resized\n$(window).resize(function()\
    \ {\n  // Anything in here is fired multiple times per second while the\n  ->\
    \ user resizes\n});\n```\n\nRecognize that the functions above aren't simply called\
    \ once when their respective events start: instead, they are called throughout\
    \ the duration of the user's respective interaction with the page.\n\n# SOLUTION\n\
    \nThe solution to this problem is debounce event handlers. Debouncing is the process\
    \ of defining an interval during which an event handler callback will be called\
    \ only once. For example, say you defined a debounce interval of 250ms and the\
    \ user scrolled the page for a total duration of 100ms. The debounced event handler\
    \ code would acquire only four times (1000ms/250ms)."
