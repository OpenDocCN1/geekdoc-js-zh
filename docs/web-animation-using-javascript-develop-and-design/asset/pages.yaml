  md: '# TYPES OF JAVASCRIPT ANIMATION LIBRARIES


    There are many types of JavaScript animation libraries. Some replicate physics
    interactions in the browser. Some make WebGL and Canvas animations easier to maintain.
    Some focus on SVG animation. Some improve UI animation—this type is the focus
    of this book.


    The two popular UI animation libraries are GSAP (download it at GreenSock.com)
    and Velocity (download it at VelocityJS.org). You''ll work with Velocity throughout
    this book since it''s free under the MIT license (GSAP requires licensing fees
    depending on a site''s business model), plus it boasts incredibly powerful features
    for writing clean and expressive animation code. It''s in use on many popular
    sites, including Tumblr, Gap, and Scribd.


    Oh, and it was created by the author of this book!'
  merge: -1
