  md: "Let’s register two UI pack effects—one for the \"In\" direction and one for\
    \ the \"Out\" direction—and call the element \"shadowIn\" since it consists of\
    \ fading and scaling an element into view, expanding its boxShadow property outward:\n\
    \n# $.Velocity\n\n```\n.RegisterEffect(\"shadowIn\",\n  defaultDuration: 1000,\n\
    \  calls: [\n    [ opacity: 1, scale: 1 }, 0.4 ]\n    [ { boxShadowBlur: 50 },\
    \ 0.6 ]\n  ]\n)\n.RegisterEffect(\"shadowOut\",\n  defaultDuration: 800,\n  calls:\
    \ [\n    // We reverse the order to mirror the \"In\" direction\n    [ { boxShadowBlur:\
    \ 50 }, 0.2 ]\n    [ { opacity: 0, scale: 0 }, 0.8 ]\n  ]\n);\n```\n\nIf your\
    \ effect's name ends with \"Out\", Velocity will automatically set the element's\
    \ display property to \"none\" once the animation is complete. Conversely, if\
    \ your effect's name ends with \"In\", Velocity will automatically set the element's\
    \ display property to the default value associated with the element's tag type\
    \ (for example, \"inline\" for anchors, \"block\" for div and p). If your effect's\
    \ name does not contain one of these special suffixes, the UI pack will not perform\
    \ automatic display setting.\n\nRegistering effects not only improves your code,\
    \ but also makes it highly portable between projects and among fellow developers.\
    \ When you've designed an effect you love, now it's painless to share the effect's\
    \ registration code with others they can use it too. Pretty neat!"
