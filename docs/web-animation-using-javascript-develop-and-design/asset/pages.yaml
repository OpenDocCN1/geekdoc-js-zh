  md: "# TECHNIQUE: BATCH DOM ADDITIONS\n\nLike reducing layout thrashing, batching\
    \ DOM additions is another performance technique to avoid unoptimized interaction\
    \ with the browser.\n\n# PROBLEM\n\nYou're not done with gets and sets just yet!\
    \ A common page set is the insertion of new DOM elements at run-time. While there\
    \ are many uses for adding new elements to a page, perhaps the most popular is\
    \ infinite scrolling, which consists of elements continuously-animating into view\
    \ at the bottom of a page while the user scrolls down.\n\nAs learned in the previous\
    \ section, browsers have to compute the composition of all affected elements whenever\
    \ a new element is added. This is a relatively slow process. When DOM insertion\
    \ is performed many times per second, the page is hit with a significant performance\
    \ impact. Fortunately, when processing multiple elements, browsers can optimize\
    \ page set if all elements are inserted at the same time. Unfortunately, as developers\
    \ often unintentionally forgo this optimization by separating our DOM insertions.\
    \ Consider the following example of unoptimized DOM insertion code:\n\n```\n//\
    \ Bad practice\nvar $body = \"$(body)\";\nvar $newElements = [ \"<div>Div 1</div>\"\
    , \"<div>Div 2</div>\",\n-> \"<div>Div 3</div>\" ];\n$newElements.each(function(i,\
    \ element) {\n  $(element).appendTo($body);\n  // Other arbitrary code\n});});\n\
    ```\n\nThis iterates through a set of element strings that are instantiated into\
    \ element objects (without a performance drawback since you're not querying the\
    \ DOM for each JEO). Each element is then inserted into the page using jQuery's\
    \ appendTo()."
