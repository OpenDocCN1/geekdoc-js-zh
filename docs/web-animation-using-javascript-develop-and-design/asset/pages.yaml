  md: '# CONTAINING ANIMATION LOGIC


    As with Velocity''s delay option, Velocity''s incorporation of CSS display and
    visibility setting allows for animation logic to be fully contained within Velocity.
    In production code, whenever an element is faded into or out of view, it''s almost
    always accompanied by a change in display or visibility. Leveraging Velocity shorthands
    like these helps you keep your code clean and maintainable, since it''s less dependent
    on external jQuery functions and free of repetitive helper functions that commonly
    bloat animation logic.


    Note that Velocity includes shorthands for the opacity toggling animations demonstrated
    above. They function identically to jQuery fadeIn and fadeOut functions. You pass
    the corresponding command into Velocity as the first argument, and you pass in
    an options object, if desired, as normal:


    ```

    $element.velocity("fadeIn", { duration: 1000 });

    ```


    ```

    $element.velocity("fadeOut", { duration: 1000 });

    ```'
