  md: '# TECHNIQUE: REDUCE CONCURRENT LOAD


    Browsers have bottlenecks. Find out what they are and stay below them.


    # PROBLEM


    When a page first loads, the browser processes HTML, CSS, JavaScript, and images
    as quickly as possible. It should come as no surprise that animations occurring
    during this time tend to be laggy—they''re fighting for the browser''s limited
    resources. So, despite the fact that a page''s loading sequence is often a great
    time to flaunt all your motion design skills, it''s best to restrain yourself
    if you want to avoid giving users the first impression that your site is laggy.


    A similar concurrency bottleneck arises when many animations occur at once on
    a page—regardless of where they take place in the page''s lifecycle. In these
    situations, browsers can choke under the stress of processing many style changes
    at once, and stuttering can occur.


    Fortunately, there are some clever techniques for reducing concurrent animation
    load.


    # SOLUTION


    There are two approaches for addressing the concurrency issue: staggering and
    breaking up animations into sequences.


    # STAGGER


    One way to reduce concurrent animation load is to make use of Velocity''s UI pack''s
    stagger feature, which delays the start times of successive animations in a set
    of elements by a specified duration. For example, to animate every element in
    a set toward an opacity value of 1 with successive 300ms delays between start
    times, your code might look like this:


    ```

    $elements.velocity({ opacity: 1 }, { stagger: 300 });

    ```'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'The elements are no longer animating in perfect synchronization; instead, at
    the very start of the entire animation sequence, only the first element is animating.
    Later, at the very end of the entire sequence, only the last element is animating.
    You''re effectively spreading the animation sequence''s total workload so that
    the browser is always performing work at one time than it would have had it been
    animating every element simultaneously. What''s more, implementing staggering
    into your motion design is often a good aesthetic choice. (Chapter 3, "Motion
    Design Theory," further explores the merits of staggering.)


    # MULTI-ANIMATION SEQUENCES


    There''s one more clever way to reduce concurrent load: break up properties into
    multi-animation sequences. Take, for example, the case of animating an element''s
    opacity value. This is typically a relatively low-stress operation. But, if you
    were to simultaneously animate the element''s width and box-shadow properties,
    you would be giving the browser appreciably more work to perform: more pixels
    will be affected, and more computation to be required.


    Hence an animation looks like this:


    ```

    $images.velocity({ opacity: 1, boxShadowBlur: "50px" });

    ```


    might be refactored into this:


    ```

    $images

    .velocity({ opacity: 1 })

    .velocity({ boxShadowBlur: "50px" });

    ```


    The browser has less concurrent work to do since these individual property animations
    occur one after another. Note that the creative tradeoff being made here is that
    we''ve opted to prolong the total animation sequence duration, which may or not
    be desirable for your particular use case.


    Since an optimization such as this entails the intention of your motion design,
    this is not a technique that should always be employed. Consider it a last resort.
    If you need to squeeze additional performance out of low-powered devices, then
    this technique might be suitable. Otherwise, don''t over-optimize the code on
    your site using techniques like this, or you will end up with unnecessarily bloated
    and inexpressive code.'
  merge: -1
