- img_proc: true
  md: '# BEHAVIOR


    The demo consists of 250 circles floating in, out, and around the screen. Periodically,
    you''ll zoom in, then back out to the position where the virtual camera started.
    The first image momentarily shows a zoomed-in view.


    NOTE: Before you continue reading, head over to VelocityJS.org/demo.book.html
    to see a live preview of the demo.

    (You can right-click anywhere on the page then choose "View Source" to see the
    demo''s code.)


    The circle elements are simply normal divs with box-shadow and border-radius set
    in CSS. There''s no WebGL or Canvas animation going on here—just pure HTML element
    manipulation. (Given the volume of elements that are being animated at once, it''s
    quite impressive this demo is capable of running smoothly in the DOM!)


    Let''s break down the animation: It consists of div elements translating along
    the X, Y, and Z axes. The Z-axis dictates the depth of each element''s animation,
    whereas X and Y provide the flowing, d2 movement across the screen. Concurrent
    to the elements'' individual movements is a larger perspective shift that occurs
    on the element containing all these divs. This perspective shift occurs every
    3 seconds, and it creates a periodic zooming effect that makes the viewer feel
    as if he''s briefly traveling through the circles'' 3D space.


    The second graphic depicts the 3D scene in its zoomed-out view. Contrast with
    the zoomed-in view shown in the first image.


    # HOW TO DOWNLOAD THE CODE SAMPLE


    +   The code behind this animation demo is available for download from peachpit.com.

    Here''s how to get it:

    1. Go to peachpit.com/register and create or log in to your account.

    2. Enter the book''s ISBN (978-0-13-409670-4) and click Submit.

    3. Your "My Registered Products" page opens. Find the listing for this book, and
    click "Access Bonus Content.

    4. The page containing the download link opens—click to access the Animation demo
    entitled WebAnimationJS_DemoCodeSample.zip'
