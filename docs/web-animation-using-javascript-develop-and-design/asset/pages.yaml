  md: "# CODE SECTION: ANIMATION SETUP\n\nThis section's code is copied below for\
    \ easy reference:\n\n```\n/*\n * Animation setup\n *//\\n/* Randomly generate\
    \ an integer between two numbers. */\nfunction r (min, max) {\n  return Math.floor(Math.random()\
    \ * (max - min + 1));\n}\n/* Query the window's dimensions. */\nvar screenWidth\
    \ = window.screen.availWidth,\n    screenHeight = window.screen.availHeight;\n\
    /* Define the z-axis animation range. */\nvar translateZMin = -725,\n    translateZMax\
    \ = 600;\n```\n\nThe first section, Animation setup, begins by defining a function\
    \ r (abbreviated of \"random\") that lets you constrain randomly generated integer\
    \ values. This function takes min and max parameters, then outputs a random number\
    \ between the min to max range (using some basic algebra). You'll use this later\
    \ when randomizing the animating elements' CSS transform values within ranges\
    \ that are predefined in the next code blocks.\n\nThe next section queries the\
    \ window object to retrieve the monitor's dimensions. By later referencing these\
    \ values, you can ensure that the circles do not animate too far off-screen (and\
    \ consequently out of view)."
