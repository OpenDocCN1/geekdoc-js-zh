  md: '+   Speeding up animations when you''re performing repetitive UI testing. When
    you''re testing a site for purposes other than animation, evaluating the end state
    of UI animations (how elements wind up) is more important than testing the animations''
    motion. In these situations, it saves time and reduces headaches to speed up all
    the animations across your page so you''re not waiting for your animations to
    play out on each page refresh.


    Velocity has a handy implementation of this functionality mock, which functions
    as a behind-the-scenes global multiplier you don''t have to sprinkle in the M
    by hand. Like the example shown above, mock multiplies both the duration and the
    delay values. To turn mock on, temporarily set $.Velocity.mock to the multiplier
    value you want to use:


    ```

    // Multiply all animation timing by 5

    $.Velocity.mock = 5;

    ```


    ```

    // All animations are now time-adjusted

    // The duration below effectively becomes 5000ms

    $element.velocity({ opacity: 1 }, { duration: 1000 });

    ```


    Velocity''s mock feature also accepts a Boolean value: setting mock to true sets
    all durations and delays to oms, which forces all animations to complete within
    a single browser ticking tick, which occurs every few milliseconds. This is a
    powerful shortcut for quickly turning off all animations when they''re getting
    in the way of your UI development and testing.


    # USE VELOCITY MOTION DESIGNER


    Velocity Motion Designer (VMD) was crafted with the sole purpose of helping developers
    streamline the creation phase of motion design. VMD is a bookmarklet you load
    onto a page in order to design animations in real time. It allows you to double-click
    elements to open a modal that lets you specify animation properties and options
    for that element. You then hit Enter on your keyboard to watch the animation play
    out immediately—without a page refresh.


    > NOTE: Get Velocity Motion Designer at http://velocityjs.org/#vmd.'
