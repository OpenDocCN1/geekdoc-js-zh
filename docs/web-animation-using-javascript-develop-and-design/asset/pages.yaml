    In the first example, you''re passing translateX a force-fed start value of 0
    since you know that the element has yet to be translated (since the page has just
    loaded). You''re force-feeding in what you know (or want) the original property
    value to be. Further, in the second example, the element''s current opacity is
    1 because that''s the default value for opacity and you haven''t modified the
    element in any way. In short, with force-feeding, you can reduce the browser''s
    workload in situations where you have an understanding of how elements are styled.


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_139_0.png)


    > NOTE: Force-fed animation properties only when they''re first used in an animation
    chain, not when they occur subsequently in the chain, since Velocity already does
    internal caching:

    $element

