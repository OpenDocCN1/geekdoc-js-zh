  md: '# PREPARING TEXT ELEMENTS FOR ANIMATION WITH BLAST.JS


    The tool of choice for typographic animation is Blast.js, which handily breaks
    blocks of text into characters, words, and sentences. You can then animate the
    resulting parts using Velocity and its UI pack plugin.


    > NOTE: Get Blast.js at Julian.com/research/blast.


    Blast.js has three delimiter types to define the grammatical components to be
    individ-ually extracted: character, word, and sentence. Suppose you have a div
    that looks like this:


    ```

    <div>

    Hello World

    </div>

    ```


    If you call Blast on this div using the following syntax


    ```

    $("div").blast({ delimiter: "word" });


    t div would turn into this:


    <div class="blast-root">

    <span class="blast">Hello</span></span>

    <span class="blast">World</span></span>

    </div>

    ```


    As you can see, Blast separates the target div''s text into text parts that are
    individu-wrapped in span elements. If you were to use instead the character delimiter,
    the result would have been:


    ```

    <div class="blast-root">

    <span class="blast">H</span></span>

    <span class="blast">e</span></span>

    <span class="blast">l</span></span>

    <span class="blast">l</span></span>

    <span class="blast">o</span></span>

    </div>

    ```'
  merge: -1
  pgno: 96
- img_proc: true
  md: '```

    <span class="blast"> </span>

    <span class="blast">W</span>

    <span class="blast">o</span>

    <span class="blast">r</span>

    <span class="blast">l</span>

    <span class="blast">d</span>

    </div>

    ```


    You can now animate these span elements independently. Before you dive into textual
    animation, you''re going to learn more about how Blast works so you can take full
    advantage of its powerful features.


    # HOW BLAST.JS WORKS


    The goal of this section is to make you comfortable with the prospect of using
    Blast to break apart the text on your beloved page. Let''s dive in!

    divs, tables, and the other HTML elements you''re familiar with are called element
    nodes. An element commonly consists of two types of children: additional element
    nodes and text nodes (raw text).

    Take this element, for example:


    ```

    <div>

    Hello <span>World</span>

    </div>

    ```


    This element is composed of two children: a text node (“Hello”) and a span element
    node. The span element node contains a child of its owner: another text node (“World”).

    When Blast is called, it traverses the entirety of the target element''s descendant
    chain to find text nodes. With each text node, Blast executes the RegExp query
    with the specified delimiter type (character, word, or sentence) to subdivide
    the node into elements. Since Blast doesn''t actually subdivide elements—you can
    safely apply it to the entire page without worrying about breaking elements''
    event handlers or other expected behaviors. This versatility is crucial when using
    Blast on user-generated content that is often dirtied with HTML. (Say, for example,
    you want to separate the words in a message posted to your site''s comments section
    so you can highlight important passages. With Blast, you can safely do so without
    concern for breaking the user''s embedded links.)'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'In addition to its robustness, Blast provides a high level of accuracy. It
    doesn''t dumbly

    split words at spaces, nor does it split sentences at periods within words. It
    leverages

    UTF-8 character sets for Latin languages, meaning that you can accurately apply

    to French, German, Spanish, English, Italian, and Portuguese content.


    Suppose you use Blast''s sentence delimiter in the following paragraph. (**Bold
    and

    italic* are used below to indicate the consecutive text matches that Blast detects).
    Blast

    correctly identified six sentences in the paragraph:


    **Will the sentence delimiter recognize this full sentence containing Spanish

    punctuation?** *¡Yes! «Mais, ou » «Nested "quotes" do not break the sentence

    delimiter!* *Further, periods inside words (e.g. Blast.js), in formal titles (e.g.
    Mrs. Bluth,

    Dr. Funke), and in "e.g." and "i.e." do not falsely match as sentence-final punctuation.

    Darn. That''s pretty.*


    Notice how punctuation is associated with its proper sentence, and how allant

    periods do not falsely demarcate sentence matches.


    With these foundations covered, it''s time to run through how to use Blast.


    # INSTALLATION


    Blast is installed on a page like any other JavaScript plugin: embed the appropriate
    script

    link before your page''s </body> tag:


    ```

    <html>

    <head>My Page</head>

    <body>

    My content.

    <script src="jquery.js"></script>

    <script src="velocity.js"></script>

    <script src="blast.js"></script>

    </body>

    </html>

    ```


    NOTE: Blast requires jQuery (or Zepto, a jQuery alternative), and there-

    fore must be required after jQuery. It doesn''t matter whether Blast is

    loaded before or after Velocity.'
