- img_proc: true
  md: "# TRANSITIONING TEXT INTO OR OUT OF VIEW\n\nThe most common use of textual\
    \ animation is animating text in and out of view.\nA basic implementation of this\
    \ is to animate the words in a sentence into view one after another.\n\n# REPLACING\
    \ EXISTING TEXT\n\nLet's start by creating a container div with placeholder text\
    \ that will be replaced by new text that animates into place:\n\n```\n<div>\n\
    \  A message will load here shortly...\n</div>\n```\n\nBecause the div starts\
    \ out as visible, Blasting the div's text results in child text elements that\
    \ are visible as well. Since your goal is to animate the generated text elements\
    \ into view starting from a state of invisibility, you have to make the generated\
    \ text elements invisible immediately after you call Blast:\n\n```\n$(\")\n  .html(\"\
    This is our new message.\")\n  .blast({{ delimiter: \"word\"}})\n  .css(\"opacity\"\
    , 0);\n  .velocity({{ opacity: 1 }});\n```\n\nThis replaces the div's existing\
    \ text with a new message. Then it Blasts the div using the word delimiter. A\
    \ call to Blast returns the generated text wrapper elements to the jQuery selector\
    \ chain, you can easily extend the code to set the opacity of each text element\
    \ to o. This primes for the subsequent Velocity call, which consists of a simple\
    \ opacity animation.\n\nYou may have noticed that the above code results in all\
    \ text parts animating into view simultaneously. This, of course, defeats the\
    \ purpose of using Blast in the first place: if you wanted all of the div's content\
    \ to animate into view simultaneously, you could have simply animated the div\
    \ itself. The goal here is actually to achieve a successive animation sequence\
    \ that consists of one text element animating after another."
  merge: -1
  pgno: 104
- img_proc: true
  md: '# STAGGERING


    This is where Velocity''s UI pack comes into play. (Review Chapter 4, "AnimationnWorkflow,"
    if you need a primer on the UI pack.) To impose a successive delay

    bween animation starts times within an element set, use Velocity pack''s stagger

    option, which expects a duration specified in milliseconds. Applying it to the
    previous

    example, you get:


    ```

    $("div")

    .html({\This is our new message.")

    .blast({ delimiter: "word" })

    .css("opacity", 0)

    .velocity({"transition.fadeIn", { stagger: 50 });

    ```


    The code above produces a successive delay of 50ms between the elements''

    animation starts. Importantly, note the Velocity call''s previous ( opacity: 1
    }

    argument for "transition.fadeIn is a premade fade effect included with

    Velocity''s UI pack. (Refer to Chapter 4, "Animation Workflow," if you need a
    refresher).

    Since the stagger option works with UI pack effects, this example shows the effect
    that

    mrors animating opacity to a value only of 1.


    As discussed in Chapter 3, "Motion Design Theory," be careful to keep stagger
    times

    to a lower duration so users aren''t waiting needlessly while text fades into
    view. Keep

    mind that the longer an element''s word count, the greater the overall time an
    anima-

    sequence will take to complete. Text staggering is one of the easiest ways

    lip into the bad practice of slowing down your interface.


    # TRANSITIONING TEXT OUT OF VIEW


    The code example in the previous section only animated text—not out of—view;

    the div preexisting text was immediately replaced by the new message. This doesn''t

    necessarily make for poor motion design, but it is often beneficial from the perspective

    of motion design theory to unify animations such that an element fades out of
    view in a

    way that reflects the way it faded into view. Chapter 3, "Motion Design Theory,"
    covered

    the concept of mirroring so that what comes in reflects what goes out. That

    advice applies here.'
  merge: -1
  pgno: 105
- img_proc: true
  md: "If you want the outward textual animation to mirror the inward animation, you\
    \ could rework the code example as follows:\n\n```\n// Select the previously blasted\
    \ text\n$(\"div .blast\").velocity(\n  // Animate the text text out of view with\
    \ the appropriate pack effect\n  \"transition.fadeOut\",\n{\n    // Stagger the\
    \ outward animation as you did the inward animation\n    stagger: 50,\n    backwards:\
    \ true,\n    // When this outward animation is complete, begin the inward animation\n\
    \    complete: function() {\n      // Proceed with the inward animation\n    \
    \  $(\"div\")\n        .html({{message}})\n        .blast({ delimiter: \"word\"\
    \ }})\n        .css(\"opacity\", 0)\n        .velocity({ opacity: 1 }, { stagger:\
    \ 50 });\n    }\n  }\n);\n```\n\nThis begins by calling the Velocity UI pack \"\
    transition.fadeOut\" effect on the text parts generated by the div having previously\
    \ been Blasted. With the inward direction, the stagger option successively offsets\
    \ the individual text part animations in the outward direction. To call this is\
    \ the use of Velocity UI pack's backwards option, which pairs with stagger to\
    \ reverse the target element's order so that the last element (the last word in\
    \ the sentence) animates out of view before the second-to-last element, and that\
    \ element animates out of view before the third-to-last element, and so on. When\
    \ this outward animation sequence is complete, the inward animation is called\
    \ from within the complete callback."
  merge: -1
  pgno: 106
- img_proc: true
  md: Using the backwards option for text animation provides two benefits. First,
    it helps mirror (create the inverse of) the inward animation, which consists of
    the first word animating into view before the second word does, and so on. Second,
    when the backward animation is immediately followed by the forward animation,
    the net result is an an elegant chaining effect in which the last word in the
    backward direction and the first word in the forward direction occur back-to-back.
    This works to tie the two animation sequences together into what looks like one
    conjoined animation instead of two separate animations crudely glued together.
  merge: -1
  pgno: 107
- img_proc: true
  md: "# TRANSITIONING INDIVIDUAL TEXT PARTS\n\nMovie title sequences are well known\
    \ for their inventive typographic motion design. The technique underlying many\
    \ of these effects is sing out individual text elements for animation. That's\
    \ what this section covers.\n\n> NOTE: For typographic animation inspiration,\
    \ search YouTube for movie title sequences and take detailed notes! As long as\
    \ you keep the principles of motion design theory in mind, you should feel encouraged\
    \ to explore textual animation design in your interface.\n\nTo achieve fine-grained\
    \ control over the elements that Blast generates, simply use CSS's nth-child selector\
    \ or jQuery's eq() function. These functions behave similarly to one another,\
    \ in that they allow for the selection of an element within a set based on that\
    \ element's index. If you passed an integer value of 3 into these functions (or\
    \ 2 in the case of jQuery as you will see), they would target the third element\
    \ (that is, third word) in the full element set (that is, multiword sentence):\n\
    \n```\n// CSS implementation\n.blast:nth-child(3) {\n  color: red;\n}\n```\n\n\
    ```\n// jQuery implementation\n$('.blast').eq(2).css(\"color\", \"red\");\n```\n\
    \nBoth examples above target the third element on the page that has the .blast\
    \ class applied. (Note that jQuery's eq function is o-based whereas CSS' nth-child\
    \ is 1-based, hence the different integer values being passed into the examples.)\
    \ Let's continue with a jQuery implementation to work toward a complete example:"
  merge: -1
  pgno: 108
- img_proc: true
  md: "```\n<div>\nCurrent status: paused\n</div>\n// Blast the div using the word\
    \ delimiter\n(\"div\").blast({ delimiter: \"word\" })\n// Select the third word\
    \ in the sentence (the span containing\n  -> the \"paused\" text)\neqq(2)\n//\
    \ Fade the third element out of view then replace its inner\n  -> text with a\
    \ new message\n  .velocity({ opacity: 0 }, function() { $(this).text(\"running\"\
    ); })\n// Fade the replaced text into view\n  .velocity({ opacity: 1 });\n```\n\
    \nThis Blast a sentence, selects its third word (\"paused\"), fades the word out\
    \ of view, replaces the faded word with a new word (\"running\"), then fades the\
    \ new word into view. The net effect is the status-indicating keyword within a\
    \ sentence gracefully fades into a new word to alert the user of a change. This\
    \ is a tremendously elegant effect that consists of only a few lines of simple\
    \ code. If you were to perform this effect many times over a larger block of text,\
    \ you could achieve an effect in which one message appears to sporadically change\
    \ into another."
  merge: -1
  pgno: 109
- img_proc: true
  md: "# TRANSITIONING TEXT FANCIALLY\n\nYou could easily swap the transition.fadeIn\
    \ effect you've used thus far with another effect from Velocity's UI pack. Some\
    \ of the other effects are quite fanciful, ranging from transition.shrinkIn, which\
    \ causes an element to scale down into view, to transition.perspectiveDownIn,\
    \ which causes an element to rotate into view like a hinged barn door. (As always,\
    \ the sophistication of your effects should be rooted in the principles discussed\
    \ in Chapter 3, \"Motion Design Theory.\")\n\n**NOTE:** For a complete list of\
    \ UI pack effects, including live demos, VelocityJS.org/#uiPack.\n\nKeep in mind\
    \ that some effects use 3D transforms (rotateX, rotateY, and translateZ), which\
    \ don't work on elements whose CSS display value is set to \"inline\"—the default\
    \ display value for span and anchor elements in particular. The workaround is\
    \ to set Blast's generated text elements to a display value of \"inline-block\"\
    , which keeps \"inline\" elements behaving as they normally do while giving them\
    \ the added functionality of \"block\" elements (such as div and p), in which\
    \ position-related properties, including 3D transforms, can be styled. Taking\
    \ this tweak into account, the inward text transition example would now look like\
    \ this: \n\n```\n$$(div)\n.html({ delimiter: \"word\" })\n.css({ opacity: 0, display:\
    \ \"inline-block\" })\n.velocity(\"transition.perspectiveDownIn\", { stagger:\
    \ 50 });\n```\n\nThis sets the Blast text parts' display values to \"inline-block\"\
    \ in the same call to jQuery's css() function that sets the elements' opacity\
    \ to a starting value of o."
