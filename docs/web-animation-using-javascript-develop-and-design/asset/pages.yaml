  md: '# LOOP


    Set the loop option to specify the number of times an animation should alternate
    between the values in the call''s property and map the element''s values prior
    to the call:


    ```

    $element.velocity({ height: "10em" }, { loop: 2 });

    ```


    If the element''s original height was 5em, its height would alternate between
    5em and 10em twice.


    If the begin or complete options are used with a looped call, they are triggered
    once each—at the very beginning and end of the loop sequence, respectively; they
    are not retriggered for each loop iteration.


    Instead of passing an integer, you can also pass in true to trigger infinite looping:


    ```

    $element.velocity({ height: "10em" }, { loop: true });

    ```


    Infinite loops ignore the callback back unless they naturally end. They, however,
    can be manually stopped via Velocity''s stop command:


    ```

    $element.velocity("stop");

    ```


    Non-infinite loops are useful for animation sequences that would otherwise require
    the repetition of chained animation code. For example, if you were to bounce an
    element up and down twice (perhaps to alert the user of a new message awaiting
    them), the non-optimized code would look like this:


    ```

    $element

    // Assume translateY starts at "0px"

    .velocity({ translateY: "100px" })

    .velocity({ translateY: "0px" })

    .velocity({ translateY: "100px" })

    .velocity({ translateY: "0px" });

    ```


    The more compact and easier to maintain version of this code would look like this:


    ```

    // Repeat (loop) this animation twice

    $element.velocity({ translateY: "100px" }, { loop: 2 });

    ```'
