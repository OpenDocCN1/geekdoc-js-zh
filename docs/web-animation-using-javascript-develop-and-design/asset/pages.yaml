  md: 'With this optimized version, if you have a change of heart about how much the
    top value should be changed by (currently "100px"), you need only change the top
    value in one part of the code. If there are many instances of repetition in your
    code, it quickly becomes obvious how much looping benefits your workflow.


    Infinite looping is tremendously helpful for loading indicators, which typically
    animate indefinitely until data has finished loading.


    First, make the loading element appear to pulsate by infinitely looping its opacity
    from visible to invisible:


    ```

    // Assume opacity starts at 1 (fully visible)

    $element.velocity({ opacity: 0 }, { loop: true });

    ```


    Later, once the data has finished loading, you can stop the animation, and then
    the element:


    ```

    $element

    // First stop the infinite loop...

    .velocity("stop")

    // ... so you can give the element a new animation,

    // in which you can animate it back to invisibility

    .velocity({ opacity: 0 });

    ```


    # DELAY


    Specify the delay option in milliseconds to insert a pause before an animation
    begins. The delay option''s purpose is to retain an animation''s timing logic
    entirely within Velocity—as opposed to relying on jQuery''s $.delay() function
    to change when a Velocity starts:


    ```

    // Wait 100ms before animating opacity toward 0

    $element.velocity({ opacity: 0 }, { delay: 100 });

    ```


    You can set the delay option with the loop option to create a pause between loop
    alternations:


    ```

    // Loop four times, waiting 100ms between each loop

    $element.velocity({ height: "+=50px" }, { loop: 4, delay: 100 });

    ```'
