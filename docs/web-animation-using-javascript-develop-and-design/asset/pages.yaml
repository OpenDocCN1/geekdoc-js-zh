  md: "# SVG MARKUP\n\nSVG elements are defined within a parent <svg> container. Specifying\
    \ the width and height dimensions of container element defines the canvas that\
    \ your SVG graphics render upon:\n\n```\n<svg version=\"1.1\" width=\"500\" height=\"\
    500\"\n  xmlns=\"http://www.w3.org/2000/svg\">\n  <circle cx=\"100\" cy=\"30\"\
    \ />\n  <rect id=\"rect\" x=\"100\" y=\"100\" width=\"200\" height=\"200\" />\n\
    </svg>\n```\n\nWithin <svg>, you can insert SVG shapes of varying sorts. The above\
    \ example has a circle element defined by a rect (rectangle) element. As normal\
    \ HTML elements, SVG elements accept height and width attributes, which are used\
    \ here for demonstration purposes, but (as with HTML) it is considered best practice\
    \ to specify SVG styling properties within a CSS stylesheet. As with HTML, stylesheets\
    \ classes target SVG elements via their id, class, or tag types.\n\nWhere the\
    \ SVG and HTML specifications differs in their range of accepted HTML attributes\
    \ and CSS properties. SVG elements accept only a few of the standard CSS properties.\
    \ Further, SVGs accept a special set of attributes, called *presentational attributes*,\
    \ which include *fill*, *x*, and *y*. (fill specifies which color to fill a shape,\
    \ with x and y define the position of the element's top-left corner.) These attributes\
    \ define how an element is visually rendered on its canvas. Let's run through\
    \ a few of them, using rect as a sample SVG element:\n\n```\n<rect id=\"rect\"\
    \ x=\"100\" width=\"200\" height=\"200\" />\n```\n\nHere, the width and height\
    \ attributes work as you'd expect. The unique x and y attributes define the rectangle's\
    \ coordinates within the canvas. These values simply position the rectangle relative\
    \ to an x=0, y=0 origin point. Unlike HTML, SVG positioning is not defined with\
    \ top, right, bottom, left, float, or margin CSS properties; SVG positioning logic\
    \ is fully dictated by explicitly defined coordinates. In other words, an element's\
    \ positioning doesn't affect the position of its sibling elements; instead of\
    \ pushing each other around the page, SVG siblings simply overlap another."
