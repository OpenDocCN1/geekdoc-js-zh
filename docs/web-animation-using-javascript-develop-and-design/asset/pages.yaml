  md: "# INSTALLING JQUERY AND VELOCITY\n\nYou can download jQuery from jQuery.com,\
    \ and Velocity from VelocityJS.org. To use them on your page—as any JavaScript\
    \ library—simply include <script></script> tags pointing toward the respective\
    \ libraries before your page's <body> tag. If you're linking to pre-hosted versions\
    \ of the libraries (as opposed to local copies on your computer), your code might\
    \ look like this:\n\n```\n<html>\n<head>My Page</head>\n<body>\n  My content.\n\
    \  <script src=\"//code.jquery.com/jquery-2.1.1.min.js\"></script>\n  <script\
    \ src=\"//cdn.jsdelivr.net/velocity/1.1.0/velocity.min.js\">\n    </--></script>\n\
    </body>\n</html>\n```\n\nWhen using jQuery and Velocity together, include jQuery\
    \ before Velocity.\nThat's it! Now you're ready to roll."
  merge: -1
