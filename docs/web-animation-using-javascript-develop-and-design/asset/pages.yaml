  md: 'You can see $ "body" is a JEO instantiation that is repeated for every iteration
    of the $.each() loop. In addition to appending the loop''s current element to
    the DOM (which has its own performance implications), you''re now also forcing
    a DOM query. Seemingly harmless-line operations like these add up very quickly.


    The solution is to cache the results—or, save the returned JEO''s variables—to
    avoid repeated DOM operation every time you want to call a jQuery function on
    element. Hence, the code goes from looking like this:


    ```

    // Bad practice: We haven''t cached JEO

    $("element").css("opacity", 1);

    // ... some intermediary code...

    // We instantiate the JEO again

    $("element").css("opacity", 0);

    ```


    to looking like this after it''s properly optimized:


    +   - Cache the jQuery element object, prefixing the variable with $

    - to indicate a JEO

    var element = $("element");

    element.css("opacity", 1);

    // ... some intermediary code...

    - We re-use the cached JEO and avoid a DOM query

    element.css("opacity", 0);


    Now you can reuse $element throughout your code without ever incurring a repeated
    DOM lookup on its behalf.


    # FORCE-FEEDING


    Traditionally, animation engines query the DOM at the start of an animation to
    determine the initial value of each CSS property being animated. Velocity offers
    a workaround to this page-querying through a feature called *force-feeding*. With
    force-feeding, you explicitly define your animations'' start values so that these
    upfront frets are eliminated.


    Force-fed start values are passed in the second item in an array that takes the
    place of a property''s value in an animation properties map. The first item in
    the array is the standard end value that you''re animating toward.'
