- img_proc: true
  md: 'If your gut reaction, "It’s not my problem—my app is just for the tech-savvy
    middle-class in the developed world," rest assured that your evil web developer
    twin is sitting two thousand miles away cackling at the thought of getting to
    a nascent market before you do actually putting in the effort necessary to deliver
    great experiences on low-powered devices. (There’s actually an enormous conglomerate
