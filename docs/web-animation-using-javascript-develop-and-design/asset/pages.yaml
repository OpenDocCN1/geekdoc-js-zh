  md: '# USE GRAPHICS


    Make of **scalable vector graphics (SVG)** to animate individual graphic components
    of a larger element that the user can interact with (learn more in Chapter 6,
    "Scalable Vector Graphics Primer"). A common example of this is the trio of horizontal
    lines that constitute a "hamburger menu" icon, or the dots that form a circle
    in a loading indicator. In both of these examples, arbitrary shapes are grouped
    together to form a common UI component. Before SVG animation was possible on the
    web, the common approach to animating a graphic like either of the two described
    was to embed the full graphic as a PNG image and then animate the entire shape
    by transitioning its opacity in CSS. By leveraging SVG, however, you can animate
    these unique elements on an individual shape-by-shape basis and subject them to
    many types of property animations.


    Graphic animation is a surefire to add nuance to key portions of your UI. This
    nuance is partially a result of the fact that web-based animation primarily deals
    with solid, rectangular shapes. (Sometimes they have rounded corners, but the
    shapes nonetheless remain solid and whole.) Animating the individual shapes of
    an element instead lets you delight the user with motion design that she might
    not have realized was possible.


    Beyond novelty, you can also uniquely leverage SVG animation to transform shapes
    into brand-new ones. Pairing this with the techniques for **previewing outcomes**
    and **flowing from the triggering element**, you can use graphic transitions to
    indicate UI behavior and provide feedback to the user. For example, if hovering
    over the dots in a loading indicator causes those dots to rearrange themselves
    into an X shape, that would indicate to the user that clicking the status indicator
    graphic would cancel the loading of content.'
