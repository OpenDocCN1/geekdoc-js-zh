  md: 'Performance affects everything. Increased performance—apparent or real—drastically
    improves UX, which in turn boosts your company''s *bottom line*. Several major
    studies have demonstrated that latency increases on search engines result in significant
    decreases in revenue per user. To put it bluntly, *people hate waiting.*


    As explained in Chapter 1, JavaScript animation performance is comparable to that
    of CSS animation. So, if you''re using a modern animation library such as Velocity.js,
    the performance of your animation engine is not your app’s bottleneck—it''s your
