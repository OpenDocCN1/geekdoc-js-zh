  md: '# TEXTUAL FLOURISHES


    The final topic in this discussion of textual animation is the concept of flourishes,
    ambi-ent animations that produce ongoing effects for aesthetic purposes. One example
    might be a string of text that flickers like a light bulb. Another might be having
    all the words in a sentence continuously animate to different shades of blue.

    Both of these are bad ideas.


    These effects distract users and ultimately amuse you only—the developer who enjoys
    toying with motion design. Never include animation just for the sake of the animation;
    if a part of your page is mindlessly drawing the user''s attention away from the
    parts that have utility, go back to the drawing board.


    The rare exception is status indicators—text such as "Loading...”—that keep the
    user aware of what the interface is doing. These are appropriate targets for textual
    flourishes because the flourishes tell the user that the interface is still processing
    data (as opposed to having frozen). In this way, flourishes act as an engaging
    visual heartbeat.


    So textual flourishes are generally considered bad practice, why is this section
    included in the book? Because flourishes that aren animated are often a great
    idea! Consider this non-animation bonus provided by Blast: you can stylize the
    text elements generated by Blast to produce colorful collages and other unique
    typographic designs. For example, you could break apart a website''s text ("Delivering
    happiness right to your door!") word by word to reduce the opacity of successive
    word, thereby creating a subtle gradient effect that spans the entire sentence.
    Here''s what that code would look like:


    ```

    <div>

    Hi Mom

    </div>

    // Blast the div then iterate through the generated text elements

    $(''div'').blast({ delimiter: "character" }).each(function(i, element) {

    // Successively reduce the opacity of each element with an

    -> arbitrary formula

    var adjustedOpacity = 1 - i/10;

    element.style.opacity = adjustedOpacity;

    });

    ```'
