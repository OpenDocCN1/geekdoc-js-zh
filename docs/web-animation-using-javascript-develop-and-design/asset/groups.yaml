    \ to this page-querying through a feature called *force-feeding*. With force-feeding,\
    \ you explicitly define your animations' start values so that these upfront frets\
    \ are eliminated.\n\nForce-fed start values are passed in the second item in an\
    \ array that takes the place of a property's value in an animation properties\
