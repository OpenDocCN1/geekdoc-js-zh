    \ ultimately add up to a substantial benefit, which is the underlying theme of\
    \ this code: Follow as many performance best practices as you can, and you'll\
    \ end up with a UI that sacrifices your responsive design goals for the sake of\
    \ performance.\n\n### JQUERY ELEMENTS\n\nInstantiating jQuery objects (JEO) is\
    \ the most common culprit of DOM gets. You might be wondering what JEO is, but\
    \ you've seen this code before:\n\n```\n$(\"#element\").css(\"opacity\", 1);\n\
    ``` or its raw JavaScript equivalent:\n\n```\ndocument.getElementById(\"element\"\
    ).style.opacity = 1;\n```\n\nIn the case of the jQuery implementation, the value\
    \ returned by $(\"#element\") is a JEO, which is an object that wraps the raw\
    \ DOM element. jQuery provide you with access to all of your functions, including\
