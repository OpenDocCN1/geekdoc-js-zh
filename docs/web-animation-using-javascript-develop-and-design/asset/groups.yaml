    \ 值（如 `250px`）会导致元素的 `translateZ` 属性每增加一个像素时，其从原点的可见移动就越少。\n\n另一个独立且互补的 CSS 属性\
    \ `perspective-origin`（透视原点）定义了虚拟相机的位置角度。虚拟相机是观众观察浏览器中 3D 动画展开的“窥视孔”。本节的代码块使用\
    \ jQuery 的 `.css()` 函数在容器元素上设置了 `perspective-origin` 值，使相机位于页面中心，从而创建出 3D 动画的垂直视角。这种垂直视角使得圆形看起来像是直接向观众飞来或飞去。\n\
    \n具体而言，这段代码部分将 `perspective-origin` 设置为页面上高度的一半和宽度的一半的点——即页面的中心点。这利用了在动画设置部分查询的窗口维度。\n\
    \n在介绍完这些背景后，让我们探索本节的代码。\n\n# 属性\n\n本节代码重现如下，便于参考，创建了示例的放大缩小效果：\n\n$container\n\
    \n```\n.css(\"perspective-origin\", screenWidth/2 + \"px \" +\nscreenHeight/2\
    \ + \"px\")\nvelocity(\n{\n  perspective: [ 215, 50 ],\n  opacity: [ 0.90, 0.55\
    \ ]\n},\n  duration: 800,\n  loop: 1,\n  delay: 3250\n});\n```\n\n当 `perspective-origin`\
    \ 属性设置在容器元素上并在之后不再变动时，`perspective` 属性正在被 Velocity 进行动画处理。这是必要的，因为示例的预期效果是保持场景的视角点静止（垂直），但夸张化然后缩小元素与虚拟相机的距离，这正是\
    \ `perspective` 属性动画派用用场。\n\n具体而言，本节使用 Velocity 将 `perspective` CSS 属性从初始 `50px`\
    \ 动画到最终值 `215px`。\n\n通过传递一个数组作为动画属性的值，你强制指定了要*向*动画的最终值（在上例中为 `215px`）以及从*开始*动画的初始值（在上例中为\
    \ `50px`）。虽然你可以向属性传递一个单一整数值（这通常是 Velocity 期望的），但这种“强制喂”（force-feeding）语法提供了对属性完整动画路径的更强控制。\n\
    \n你可能会想，强制喂不是必要的吗，因为 Velocity 知道如何自己获取 CSS 属性的初始值？虽然当将整数值而不是数组作为值传递时，这是 Velocity\
    \ 的标准行为，但由于查询 DOM 获取属性的初始值存在固有的性能缺陷，这并不总是理想的行为。强制喂技术允许你显式地传递一个初始值，这样 Velocity\
    \ 就可以避免查询 DOM 获取它。换句话说，`perspective` 代码中使用的 `50px` 初始值与你在 CSS 表中最初设置元素 `perspective`\
    \ 属性的值是相同的。你只是在这里重复了该值。注意，这种强制喂技术也用在了元素的 `opacity` 属性上；它从初始值 `0.55` 动画到最终值 `0.90`，因为那是该属性在\
    \ CSS 中被设置的值。\n\n正如第 7 章“动画性能”中彻底讨论的那样，DOM 查询确实是高性能动画的阿喀琉斯之踵：浏览器执行资源密集型计算来确定元素的视觉状态。虽然对于示例的性能来说，包含这种性能优化并不是必须（因为相关的\
    \ Velocity 动画没有在循环内部触发），但它仍然包含了，以对比强制喂的次要用途（你将在本章中学习这一点）。\n\n动画 `perspective`\
    \ 和 `opacity` 的净效果是，容器的所有圆形元素看起来都在向虚拟相机放大，同时淡化到亮度增加（`opacity` 从 `0.55` 变为 `0.90`）。\n\
    \n# 选项\n\n容器动画代码的最后部分包含了传递给 Velocity 的选项：`duration` 自言自明；`delay` 在动画开始处插入延迟；`loop`\
    \ 则在属性映射和动画之前的值之间往复循环。具体而言，通过将 `loop` 设置为 `2`，你是在告诉 Velocity 动画到属性映射的值，回到之前的值，然后在延迟\
    \ `3000ms` 后再次重复此循环。\n\n> 注意：当 `delay` 与 `loop` 设置同时，延迟发生在每次循环切换之间。使用 `delay`\
    \ 创建了一个舒适的停顿，使得放大和缩小效果不会来回波动。\n\n[IMAGE: 173_0.png]\n\n# 代码部分：圆形动画\n\n这里开始变得有趣了。让我们看看圆形动画，你在其中单独对它们的\
    \ X、Y、Z 轴平移进行动画处理。你还在处理它们的透明度。\n\n> /************************************/\nCircle\
    \ animation\n************************************/\n\n```\n$circles\n  .appendTo($container)\n\
    \  .velocity({\n    opacity: {\n      function() { return Math.random() },\n \
    \     function() { return Math.random() + 0.1 }\n    },\n    translateX: [\n \
    \     function() { return \"+\" + r(-screenWidth/2.5, screenWidth/2.5) },\n  \
    \    function() { return r(0, screenWidth) }\n    ],\n    translateY: [\n    \
    \  function() { return \"+\" + r(-screenHeight/2.75, screenHeight/2.75) },\n \
    \     function() { return r(0, screenSize) }\n    ],\n    translateZ: [\n    \
    \  function() { return \"+\" + r(translateZMin, translateZMax) },\n      function()\
    \ { return r(translateZMin, translateZMax) }\n    ]\n  }, { velocity(\"reverse\"\
    ), easing: \"easeOutQuad\" })\n  .velocity({ opacity: 0, 2000 });\n```\n\n"
