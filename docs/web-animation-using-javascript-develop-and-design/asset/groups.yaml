  - "[PAGE 83]\n\n# CODE TECHNIQUE: PACKAGE YOUR EFFECTS\n\nOne of the most common\
    \ uses of motion design is fading content in and out of view. This type of animation\
    \ often consists of a series of individual animation calls that are chained together\
    \ to deliver a nuanced, multistage effect.\n\n# STANDARD APPROACH\n\nInstead of\
    \ simply animating the opacity of an element toward 1, you might simultaneously\
    \ animate its scale property so that the elements appear to fade in and grow into\
