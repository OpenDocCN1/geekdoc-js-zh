    ```\n\nThe demo's second section, Circle creation, generates the primary div elements\
    \ to be animated. Here, it first defines the desired number of circles as circleCount.\
    \ Then, it defines a circlesHtml string to contain the circles' collated HTML.\n\
    \nNext, it iterates up to the circleCount number to generate the circles' HTML.\
    \ Notice that it uses the performance best practice of batching DOM additions,\
    \ as detailed in Chapter 7, \"Animation Performance.\" It collates the markup\
    \ for each div element onto a master circlesHtml string thats is later inserted\
    \ into the DOM in a single action. (If you were to insert the div elements into\
    \ the DOM one at a time, the negative performance impact would be significant:\
    \ UI interaction in the browser would be frozen until the relatively slow element\
    \ insertion completed.)\n\nFinally, it wraps the circle elements in a jQuery element\
