  - '[PAGE 24]


    # WRAPPING UP


    When designing animations in CSS, you''re inherently limited to the features that
    the CSS specification provides. In JavaScript, because of the very nature of programming
    languages, third-party libraries have an infinite amount of logical control over
    motion design. Animation engines leverage this to provide powerful features that
    drastically improve workflow and expand the possibilities of interactive motion
    design. That''s what this book is all about about: Designing beautiful animations
    as efficiently as possible.


    The next chapter explains how to use this book’s JavaScript animation engine of
    choice: Velocity.js. In mastering Velocity.js, you’ll understand how to leverage
    the features we’ve just introduced, and many more.'
