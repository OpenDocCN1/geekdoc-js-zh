  - '[PAGE 98]


    In addition to its robustness, Blast provides a high level of accuracy. It doesn''t
    dumbly

    split words at spaces, nor does it split sentences at periods within words. It
    leverages

    UTF-8 character sets for Latin languages, meaning that you can accurately apply

    to French, German, Spanish, English, Italian, and Portuguese content.


    Suppose you use Blast''s sentence delimiter in the following paragraph. (**Bold
    and

    italic* are used below to indicate the consecutive text matches that Blast detects).
    Blast

    correctly identified six sentences in the paragraph:


    **Will the sentence delimiter recognize this full sentence containing Spanish

    punctuation?** *¡Yes! «Mais, ou » «Nested "quotes" do not break the sentence

    delimiter!* *Further, periods inside words (e.g. Blast.js), in formal titles (e.g.
    Mrs. Bluth,

    Dr. Funke), and in "e.g." and "i.e." do not falsely match as sentence-final punctuation.

    Darn. That''s pretty.*


    Notice how punctuation is associated with its proper sentence, and how allant

    periods do not falsely demarcate sentence matches.


    With these foundations covered, it''s time to run through how to use Blast.


    # INSTALLATION


    Blast is installed on a page like any other JavaScript plugin: embed the appropriate
    script

    link before your page''s </body> tag:


    ```

    <html>

    <head>My Page</head>

    <body>

    My content.

    <script src="jquery.js"></script>

    <script src="velocity.js"></script>

    <script src="blast.js"></script>

    </body>

    </html>

    ```


    NOTE: Blast requires jQuery (or Zepto, a jQuery alternative), and there-

    fore must be required after jQuery. It doesn''t matter whether Blast is

    loaded before or after Velocity.'
  - "[PAGE 99]\n\nOnce Blast is loaded, use it calling .blast() on a jQuery element\
    \ object. It accepts an options object as its sole argument:\n\n```\n$element.blast({option1:\
    \ value1, option2: value2});\n```\n\nLet's run through the available options.\n\
    \n# OPTION: DELIMITER\n\nBlast's most important option is delimiter, which accepts\
    \ \"character\", \"word\", or \"sentence\". To separate the text within $element\
    \ using the \"sentence\" delimiter, or code would look like this:\n\n```\n$element.blast({\
    \ delimiter: \"sentence\" });\n```\n\nNote that Blast returns the generated text\
    \ wrapper elements to the jQuery selector chain so you can manipulate them, like\
    \ this:\n\n```\n$element.blast({ delimiter: \"sentence\" })\n.css(\"opacity\"\
    , 0.5);\n```\n\nThe .css() call is applied to the individual text elements, not\
    \ the parent $element that you called Blast on.\n\n# OPTION: CUSTOMCLASS\n\nBlast\
    \ provides two options to make text manipulation easier: customClass and generateValueClass.\
    \ customClass behaves exactly as you would expect: supply a custom class (as a\
    \ string value) to be assigned to the text node wrapper elements.\n\nSuppose you\
    \ had the following div and Blast call:\n\n```\n<div>\n  Hi Mom\n</div>\n```\n\
    \n```\n$(\"div\").blast({ delimiter: \"word\" , customClass: \"myClass\" });\n\
    ```"
  - '[PAGE 100]


    The div would turn into the following (note how Blast automatically assigns every
    text part the "blast" class by default):


    ```

    <div>

    <span class="blast myClass">Hi</span>

    <span class="blast myClass">Mom</span>

    </div>

    ```


    The value in providing a custom class is in differentiating the elements generated
    by each Blast call. If, for example, you used Blast in two locations on your page—once
    in the header and once in the footer—it might be helpful to assign these two different
    classes so your subsequent JavaScript code and CSS styles act on the text elements
    appropriately.


    # OPTION: GENERATEVALUE


    generateCellValue takes a Boolean value (true or false) indicating whether a unique
    class, in the form of .blast-[delimiter]-[maxValue], should be assigned to the
    generated text elements.


    > NOTE: This option is applicable only to the character and word delimiters.


    The [delimiter] placeholder represents the delimiter type used in the call, and
    the [maxValue] placeholder represents the text contained within an individual
    element. Consider the following example:


    ```

    <div>

    Hi Mom

    </div>

    $("div").blast({ delimiter: "word", generateCellValue: true });

    ```


    The element would turn into this:


    ```

    <div class="blast-root">

    <span class="blast blast-word-Hi">Hi</span>

    <span class="blast blast-word-Mom">Mom</span>

    </div>

    ```'
  - "[PAGE 101]\n\n```\n<div class=\"blast-root\">\n<span class=\"blast blast-letter-H\"\
    ><i></span>\n<span class=\"blast blast-letter-i\"><i></span>\n  ... and so on...\n\
    </div>\n```\n\nThe generateClass option is useful when you need to use CSS or\
    \ JavaScript to manipulate text matches on the text contained with them. If, for\
    \ example, you used this feature on a book excerpt, you could create a visualization\
    \ of all instances of the word \"and\" by giving elements with the .blast.word-and\
    \ class a yellow background:\n\n```\n// j jQuery implementation\n$(\".blast-word-and\"\
    ).css(\"background\", \"yellow\");\n// Raw JavaScript implementation\ndocument.querySelectorAll(\"\
    .blast-word-and\").forEach(function(item) {\n  item.style.background = \"yellow\"\
    ;\n});\n// CSS implementation\n.blast-word-and {\n  background: yellow;\n}\n```\n\
    \nThanks to this feature, you can painlessly target text matches by either CSS\
    \ or JavaScript without having to use messy custom code to individually check\
    \ the text contents of each element.\n\n# OPTION: TAG\n\nThis option lets you\
    \ specify the type of element that wraps text parts. The default value is span,\
    \ but you can pass in any element type (for example, a, div, p). Consider this\
    \ example:\n\n```\n<div>\nHi Mom\n</div>\n```\n\n```\n// Use the \"div\" element\
    \ as the wrapper tag\n$(\"div\").blast({ delimiter: \"word\", tag: \"div\" });\n\
    ```"
  - '[PAGE 102]


    The element would consequently turn into this:


    ```

    <div class="blast-root">

    <div class="blast">Hi</div>

    <div class="blast">Mom</div>

    </div>

    ```


    This feature is useful to ensure that the resulting text elements mimic the structure
    of the surrounding HTML. Perhaps nearby sibling elements are all of the div type,
    in which case the above example may be appropriate.


    You might also want to take advantage of the unique properties offered by different
    tag types. strong, for example, automatically bolds text, whereas div forces each
    match to begin on a new line thanks to div''s default display value of "block".


    # COMMAND: REVERSE


    You can undo Blast on an element by passing false as the sole parameter into a
    Blast call. Hence, if your Blasted element looked like this:


    ```

    <div class="blast-root">

    <div class="blast">Hi</div>

    <div class="blast">Mom</div>

    </div>

    ```


    and you passed in the following Blast call:


    ```

    $("div").blast(false);

    ```


    the element would return to its original structure:


    ```

    <div>

    Hi Mom

    </div>

    ```


    You might be wondering how this works: when Blast is reversed, it simply destroys
    the wrapper elements, then inserts raw text where the wrapper elements were previously.
    Note that this will break event handlers assigned to the new elements generated
    by Blast, but it won''t break event handlers associated with the HTML that existed
    prior to Blast being initially called.'
  - '[PAGE 103]


    Reversing Blast in this way is a crucial component of textual animation since
    the modus operandi when animating elements on a webpage is to leave things as
    they were before you touched them. If, for example, you''ve Blasted apart a sentence
    in order to animate its words into view one at a time, you would subsequently
    reverse Blast upon completion of the animation. Consequently, JavaScript code
    that later interacts with the text won''t have unexpected child elements that
    it has to parse out. In short, it''s a good practice to avoid leaving your HTML
    unnecessarily bloated so that further programmatic interaction with your elements
    doesn''t become increasingly convoluted.


    **NOTE:** To learn more about Blast, including its unique search capabilities
    and its compatibility with screen-reading software, visit its documentation at
    Julian.com/research/blast.


    Now that you''ve separated your text elements, it''s time to animate them.


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_103_0.png)'
  - "[PAGE 104]\n\n# TRANSITIONING TEXT INTO OR OUT OF VIEW\n\nThe most common use\
    \ of textual animation is animating text in and out of view.\nA basic implementation\
    \ of this is to animate the words in a sentence into view one after another.\n\
    \n# REPLACING EXISTING TEXT\n\nLet's start by creating a container div with placeholder\
    \ text that will be replaced by new text that animates into place:\n\n```\n<div>\n\
    \  A message will load here shortly...\n</div>\n```\n\nBecause the div starts\
    \ out as visible, Blasting the div's text results in child text elements that\
    \ are visible as well. Since your goal is to animate the generated text elements\
    \ into view starting from a state of invisibility, you have to make the generated\
    \ text elements invisible immediately after you call Blast:\n\n```\n$(\")\n  .html(\"\
    This is our new message.\")\n  .blast({{ delimiter: \"word\"}})\n  .css(\"opacity\"\
    , 0);\n  .velocity({{ opacity: 1 }});\n```\n\nThis replaces the div's existing\
    \ text with a new message. Then it Blasts the div using the word delimiter. A\
    \ call to Blast returns the generated text wrapper elements to the jQuery selector\
    \ chain, you can easily extend the code to set the opacity of each text element\
    \ to o. This primes for the subsequent Velocity call, which consists of a simple\
    \ opacity animation.\n\nYou may have noticed that the above code results in all\
    \ text parts animating into view simultaneously. This, of course, defeats the\
    \ purpose of using Blast in the first place: if you wanted all of the div's content\
    \ to animate into view simultaneously, you could have simply animated the div\
    \ itself. The goal here is actually to achieve a successive animation sequence\
    \ that consists of one text element animating after another."
- md: "\n# STAGGERING\n\nThis is where Velocity's UI pack comes into play. (Review\
    \ Chapter 4, \"Animation Workflow,\" if you need a primer on the UI pack.) To\
    \ impose a successive delay between animation starts times within an element set,\
    \ use Velocity pack's stagger option, which expects a duration specified in milliseconds.\
    \ Applying it to the previous example, you get:\n\n```javascript\n$(\"div\")\n\
    .html(\"This is our new message.\")\n.blast({ delimiter: \"word\" })\n.css(\"\
    opacity\", 0)\n.velocity(\"transition.fadeIn\", { stagger: 50 });\n```\n\nThe\
    \ code above produces a successive delay of 50ms between the elements' animation\
    \ starts. Importantly, note the Velocity call's previous { opacity: 1 } argument\
    \ for \"transition.fadeIn\" is a premade fade effect included with Velocity's\
    \ UI pack. (Refer to Chapter 4, \"Animation Workflow,\" if you need a refresher).\
    \ Since the stagger option works with UI pack effects, this example shows the\
    \ effect that mirrors animating opacity to a value only of 1.\n\nAs discussed\
    \ in Chapter 3, \"Motion Design Theory,\" be careful to keep stagger times to\
    \ a lower duration so users aren't waiting needlessly while text fades into view.\
    \ Keep mind that the longer an element's word count, the greater the overall time\
    \ an animation sequence will take to complete. Text staggering is one of the easiest\
    \ ways to fall into the bad practice of slowing down your interface.\n\n# TRANSITIONING\
    \ TEXT OUT OF VIEW\n\nThe code example in the previous section only animated text—not\
    \ out of—view; the div's preexisting text was immediately replaced by the new\
    \ message. This doesn't necessarily make for poor motion design, but it is often\
    \ beneficial from the perspective of motion design theory to unify animations\
    \ such that an element fades out of view in a way that reflects the way it faded\
    \ into view. Chapter 3, \"Motion Design Theory,\" covered the concept of mirroring\
    \ so that what comes in reflects what goes out. That advice applies here.\n\n\
    If you want the outward textual animation to mirror the inward animation, you\
    \ could rework the code example as follows:\n\n```javascript\n// Select the previously\
    \ blasted text\n$(\"div .blast\").velocity(\n  // Animate the text out of view\
    \ with the appropriate pack effect\n  \"transition.fadeOut\",\n  {\n    // Stagger\
    \ the outward animation as you did the inward animation\n    stagger: 50,\n  \
    \  backwards: true,\n    // When this outward animation is complete, begin the\
    \ inward animation\n    complete: function() {\n      // Proceed with the inward\
    \ animation\n      $(\"div\")\n        .html({{message}})\n        .blast({ delimiter:\
    \ \"word\" })\n        .css(\"opacity\", 0)\n        .velocity({ opacity: 1 },\
    \ { stagger: 50 });\n    }\n  }\n);\n```\n\nThis begins by calling the Velocity\
    \ UI pack \"transition.fadeOut\" effect on the text parts generated by the div\
    \ having previously been Blasted. With the inward direction, the stagger option\
    \ successively offsets the individual text part animations in the outward direction.\
    \ To call this is the use of Velocity UI pack's backwards option, which pairs\
    \ with stagger to reverse the target element's order so that the last element\
    \ (the last word in the sentence) animates out of view before the second-to-last\
    \ element, and that element animates out of view before the third-to-last element,\
    \ and so on. When this outward animation sequence is complete, the inward animation\
    \ is called from within the complete callback.\n\nUsing the backwards option for\
    \ text animation provides two benefits. First, it helps mirror (create the inverse\
    \ of) the inward animation, which consists of the first word animating into view\
    \ before the second word does, and so on. Second, when the backward animation\
    \ is immediately followed by the forward animation, the net result is an elegant\
    \ chaining effect in which the last word in the backward direction and the first\
    \ word in the forward direction occur back-to-back. This works to tie the two\
    \ animation sequences together into what looks like one conjoined animation instead\
    \ of two separate animations crudely glued together.\n\n# TRANSITIONING INDIVIDUAL\
    \ TEXT PARTS\n\nMovie title sequences are well known for their inventive typographic\
    \ motion design. The technique underlying many of these effects is splitting out\
    \ individual text elements for animation. That's what this section covers.\n\n\
    > NOTE: For typographic animation inspiration, search YouTube for movie title\
    \ sequences and take detailed notes! As long as you keep the principles of motion\
    \ design theory in mind, you should feel encouraged to explore textual animation\
    \ design in your interface.\n\nTo achieve fine-grained control over the elements\
    \ that Blast generates, simply use CSS's nth-child selector or jQuery's eq() function.\
    \ These functions behave similarly to one another, in that they allow for the\
    \ selection of an element within a set based on that element's index. If you passed\
    \ an integer value of 3 into these functions (or 2 in the case of jQuery as you\
    \ will see), they would target the third element (that is, third word) in the\
    \ full element set (that is, multi-word sentence):\n\n```css\n// CSS implementation\n\
    .blast:nth-child(3) {\n  color: red;\n}\n```\n\n```javascript\n// jQuery implementation\n\
    $('.blast').eq(2).css(\"color\", \"red\");\n```\n\nBoth examples above target\
    \ the third element on the page that has the .blast class applied. (Note that\
    \ jQuery's eq function is 0-based whereas CSS' nth-child is 1-based, hence the\
    \ different integer values being passed into the examples.) Let's continue with\
    \ a jQuery implementation to work toward a complete example:\n\n```html\n<div>Current\
    \ status: paused</div>\n// Blast a sentence using the word delimiter\n$(\"div\"\
    ).blast({ delimiter: \"word\" })\n// Select the third word in the sentence (the\
    \ \"paused\" text)\neq(2)\n// Fade the third element out of view then replace\
    \ its inner\n.velocity({ opacity: 0 }, function() {\n  $(this).text(\"running\"\
    );\n})\n// Fade the new word into view\n.velocity({ opacity: 1 });\n```\n\nThis\
    \ Blast a sentence, selects its third word (\"paused\"), fades the word out of\
    \ view, replaces it with a new word (\"running\"), then fades the new word into\
    \ view. The net effect is the status-indicating keyword within a sentence gracefully\
    \ fades into a change. This is a tremendously elegant effect that consists of\
    \ only a few lines of code. If you were to perform this effect many times over\
    \ a larger block of text, you could achieve an effect in which one message appears\
    \ to sporadically change into another.\n\n# TRANSITIONING TEXT FANCIALLY\n\nYou\
    \ could easily swap the transition.fadeIn effect you've used so far with another\
    \ effect from Velocity's UI pack. Some of the other effects are quite fanciful,\
    \ ranging from transition.shrinkIn, which causes an element to scale down into\
    \ view, to transition.perspectiveIn, which causes an element to rotate into view\
    \ like a hinged barn door. (As always, the sophistication of your effects should\
    \ be rooted in the principles discussed in Chapter 3, \"Motion Design Theory.\"\
    )\n\n**NOTE:** For a complete list of UI pack effects, including live demos, VelocityJS.org/#uiPack.\n\
    \nKeep in mind that some effects use 3D transforms (rotateX, rotateY, and translateZ),\
    \ which don't work on elements whose CSS display value is set to \"inline\"—the\
    \ default display value for span and anchor elements in particular. The workaround\
    \ is to set Blast's generated text elements to a display value of \"inline-block\"\
    , which keeps \"inline\" elements behaving as they normally do while giving them\
    \ the added functionality of \"block\" elements (such as div and p), in which\
    \ position-related properties, including 3D transforms, can be styled. Taking\
    \ this tweak into account, the inward text transition example would now look like\
    \ this:\n\n```javascript\n$(\"div\")\n.html({ delimiter: \"word\" })\n.css({ opacity:\
    \ 0, display: \"inline-block\" })\n.velocity(\"transition.perspectiveDownIn\"\
    , { stagger: 50 });\n```\n"
  mdcn: "\n\n# 错落效果 (STAGGERING)\n\n这就是 Velocity UI 插件大显身手的地方。（如果你需要关于 UI 插件的入门介绍，请回顾第\
    \ 4 章“动画工作流”）。要在一组元素的动画开始时间之间设置连续延迟，请使用 Velocity 插件的 `stagger` 选项，它接收以毫秒为单位指定的持续时间。将其应用于上一个示例，你会得到：\n\
    \n```javascript\n$(\"div\")\n.html(\"This is our new message.\")\n.blast({ delimiter:\
    \ \"word\" })\n.css(\"opacity\", 0)\n.velocity(\"transition.fadeIn\", { stagger:\
    \ 50 });\n```\n\n上述代码在元素动画开始之间产生了 50 毫的连续延迟。重要的是，请注意 Velocity 调用中 \"transition.fadeIn\"\
    \ 之前的参数 `{ opacity: 1 }` 是 Velocity UI 插件中包含的预制淡入效果。（如果你需要复习，请参阅第 4 章“动画工作流”）。由于\
    \ `stagger` 选项适用于 UI 插件的效果，此示例展示了镜像“将透明度变为值 1”这一动画的效果。\n\n正如第 3 章“运动设计理论”中所讨论的，务必将\
    \ `stagger` 时间保持在较短的时间，以免用户在文本淡入视图时产生无谓的等待。记住，元素的单词数越多，动画序列完成所需的总时间越长。文本错落（Text\
    \ staggering）是掉入让界面变慢的最简单的方法之一。\n\n# 文字移出视图 (TRANSITIONING TEXT OUT OF VIEW)\n\
    \n上一节中的代码示例仅对文本进行了动画处理——并没有将其移出视图；`div` 原有的文本立即被新消息替换了。这并不意味着运动设计很糟糕，但从运动设计理论的角度来看，统一动画通常是有益的，使元素淡出视图的方式能够反映它淡入视图的方式。第\
    \ 3 章“运动设计理论”涵盖了“镜像（mirroring）”的概念，即进入的方式应反映退出的方式。这一建议在这里同样适用。\n\n如果你想让向出的文本动画镜像进入的动画，可以按照以下方式重写代码示例：\n\
    \n```javascript\n// 选择之前经过 blast 处理的文本\n$(\"div .blast\").velocity(\n  // 使用相应的插件效果将文本移出视图\n\
    \  \"transition.fadeOut\",\n  {\n    // 像处理进入动画那样对向外动画设置错落\n    stagger: 50,\n\
    \    backwards: true,\n    // 当此向外动画完成后，开始进入动画\n    complete: function() {\n \
    \     // 继续进入动画\n      $(\"div\")\n        .html({{message}})\n        .blast({\
    \ delimiter: \"word\" })\n        .css(\"opacity\", 0)\n        .velocity({ opacity:\
    \ 1 }, { stagger: 50 });\n    }\n  }\n);\n```\n\n这首先对 `div` 被 Blast 后生成的文本部分调用\
    \ Velocity UI 插件的 \"transition.fadeOut\" 效果。在进入方向上，`stagger` 选项连续抵消了单个文本部分的向外动画。调用此功能使用的是\
    \ Velocity UI 插件的 `backwards` 选项，它与 `stagger` 配合反转目标元素的顺序，使得最后一个元素（句子中的最后一个单词）在倒数第二个元素之前移出视图，该元素又在倒数第三个元素之前移出，以此类推。当这个向外动画序列完成后，会在\
    \ `complete` 回调内部调用进入动画。\n\n在文本动画中使用 `backwards` 选项有两个好处。首先，它有助于镜像（创建进入动画的反向）——进入动画由第一个单词在第二个单词之前进入视图组成，以此此类推。其次，当后向动画紧接着正向动画时，最终结果是一种优雅的链式效果，其中后向方向的最后一个单词和正向方向的第一个单词连续发生。这可以将两个动画序列连接在一起，看起来像是一个整体的动画，而不是两个粗暴拼接在一起的独立动画。\n\
    \n# 切换单个文本部分 (TRANSITIONING INDIVIDUAL TEXT PARTS)\n\n电影片头序列以其创新的排版运动设计而闻名。许多此类效果背后的技术是将单个文本元素拆分进行动画。这就是本节涵盖的内容。\n\
    \n> 注意：欲获取排版动画灵感，请在 YouTube 上搜索电影片头序列并做详细笔记！只要你牢记运动设计理论的原则，就应该鼓励在你的界面中探索文本动画设计。\n\
    \n为了对 Blast 生成的元素进行精细粒度的控制，只需使用 CSS 的 `nth-child` 选择器或 jQuery 的 `eq()` 函数。这些函数的行为相似，它们都允许根据元素的索引选择集合中的某个元素。如果你向这些函数传递整数值\
    \ 3（在 jQuery 中为 2，如你将所看到的），它们将针对整个元素集合（即多单词句子）中的第三个元素（即第三个单词）：\n\n```css\n// CSS\
    \ 实现\n.blast:nth-child(3) {\n  color: red;\n}\n```\n\n```javascript\n// jQuery\
    \ 实现\n$('.blast').eq(2).css(\"color\", \"red\");\n```\n\n上述两个示例都针对页面上应用了 .blast\
    \ 类的第三个元素。（注意 jQuery 的 `eq` 函数是基于 0 的，而 CSS 的 `nth-child` 是基于 1 的，因此传递到示例中的整数值不同）。让我们继续使用\
    \ jQuery 实现来实现一个完整的示例：\n\n```html\n<div>Current status: paused</div>\n// 使用单词分隔符对句子进行\
    \ blast 处理\n$(\"div\").blast({ delimiter: \"word\" })\n// 选择句子中的第三个单词（\"paused\"\
    \ 文本）\neq(2)\n// 将第三个元素淡出视图，然后替换其内容\n.velocity({ opacity: 0 }, function() {\n\
    \  $(this).text(\"running\");\n})\n// 将新单词淡入视图\n.velocity({ opacity: 1 });\n```\n\
    \n这段代码对句子进行 blast 处理，选择其第三个单词（\"paused\"），将其淡出视图，替换为新单词（\"running\"），然后将新单词淡入视图。最终效果是句子中的状态指示关键词优雅地发生了变化。这是一个极其优雅的效果，仅需几行代码即可。如果你在较大的文本块上多次执行此效果，你可以实现一种效果，即一个消息似乎在随机地变为另一个消息。\n\
    \n# 华丽的文字切换 (TRANSITIONING TEXT FANCIALLY)\n\n你可以轻松地将目前为止使用的 `transition.fadeIn`\
    \ 效果替换为 Velocity UI 插件中的其他效果。其中一些效果非常华丽，从 `transition.shrinkIn`（导致元素缩放进入视图）到 `transition.perspectiveIn`（导致元素像合页谷门一样旋转进入视图）。（一如既往，你效果的复杂程度应根于第\
    \ 3 章“运动设计理论”中讨论的原则。）\n\n**注意**：欲查看完整的 UI 插件效果列表（包括现场演示），请访问 [VelocityJS.org/#uiPack](https://velocityjs.org/#uiPack)。\n\
    \n请记住，某些效果使用了 3D 变换（`rotateX`, `rotateY` 和 `translateZ`），这些变换在 CSS 显示值设置为 `inline`\
    \ 的元素上不起作用（特别是对于 `span` 和 `a` 元素）。解决方法是将 Blast 生成的文本元素显示值设置为 `inline-block`，这在保持“内联”元素正常行为的同时，赋予了它们“块级”元素（如\
    \ `div` 和 `p`）的功能，可以在其中样式化包括 3D 变换在内的位置相关属性。考虑到这一调整，进入文字过渡示例现在看起来像这样：\n\n```javascript\n\
    $(\"div\")\n.html({ delimiter: \"word\" })\n.css({ opacity: 0, display: \"inline-block\"\
    \ })\n.velocity(\"transition.perspectiveDownIn\", { stagger: 50 });\n```\n\n"
