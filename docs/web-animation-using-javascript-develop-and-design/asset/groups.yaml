    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_53_0.png)


    动态设计的实用性利用了用户心理学。当用户点击按钮时，她能确定 UI 已经响应了这次点击吗？确保她确信的一种简单方法是让按钮过渡到按下状态的动画效果。当用户等待内容加载时，她能确定进度正在进行吗，还是会产生一种程序已卡死的不安感？这些都是心理预期，而动态设计可以通过提供
    UI 状态的持续视觉指示来解决这些问题。


    动态设计的这种互补的优雅感，让一个 App 从仅仅的“好看”提升到了“好用”。它是那种“哇，太神奇了”感觉的来源，提醒用户技术是多么神奇。


    让我们精通这两个方面吧。让我们开始吧。


    ## 实用性 (UTILITY)


    如何确保你的动态设计选择对你的网站有价值的补充？

    这里有一些技巧。


    ## 借鉴约定 (BORROW CONVENTIONS)


    从你喜欢的网站和 App 的动态设计中获取灵感。流行的动态设计规范值得借鉴，因为它们在用户脑海中已经具有意义。对约定的反复接触会让用户对动画“应该”长什么样形成预期。如果你将约定用于用户非预期的用途，你的
    App 就会显得很不直观。


    你从别处复制的设计效果越多，用户对你的 App 感到就越熟悉。App 越熟悉，用户就会越快感到舒适和自信。虽然新颖性具有实用价值，但日常 UI 元素的动态设计不应该是新颖的。将新颖留给意义较小或难以被误解的动画序列，例如页面的加载序列或状态指示动画。


    ## 结果预览 (PREVIEW OUTCOMES)


    当页面上的某个元素用途模糊时，给用户提供交互结果的预览。这提供了一种保证，确保该元素的功能如用户所想的那。一个简单的例子是，按钮在悬停时通过视觉上的无线电脉冲来启动文件发送。这利用了一种常见的图形设计修辞，告诉用户将发生数据传输动作。


    另一种更不那么模糊的预览结果的方法是显示用户实际采取行动时发生的动画部分。例如，当用户点击按钮时，正在进行的文件传输指示动画开始运行；实现动态设计，使得悬停在触发元素上会触发进行中的动画。当用户悬停离开元素时，反转部分动画，让文件传输指示器恢复到默认状态。这种预览技术帮助用户立即理解她的动作将触发的效果，有助于增强她对
    UI 元素目的的信心。用户感觉越强烈，就越有掌控感。掌控感越强，体验就越愉快。


    ## 分散注意力而非无聊 (DISTRACTION OVER BOREDOM)


    当用户在你的页面上执行枯燥、缺乏参与感的任务时——例如填写很长的表单——你可以使用颜色和移动来提高她的意识水平并增加趣味性。例如，当她成功完成每个表单字段时，你可以为勾选标记添加动画。这让用户的注意力保持与界面的互动，减少了当前任务的枯燥感。同样，你可以在用户等待内容时向他们展示一个引人注目的加载指示器。在网车共享
    App Lyft 中可以找到很好的例子，当 App 加载到内存时，它会在空白画布上节律地让气球漂浮落下。


    让用户的大脑放松并感受重复运动带来的愉快动能，能让她更投入到你的内容中。尽管这看起来可能很表面，但它是有效的。要意识到这种技术应该在用户将经历避免的无聊时期时使用；避免在你任何想要给
    UI 增加一点趣味时将其作为“创可贴”。


    让我们考虑另一个例子：当 Facebook 将内容加载到其新闻动态（News Feed）时，它会对虚拟文本进行模糊处理，直到真实文本准备好显示。这种节律性的模糊表示界面正在忙碌（而不是停滞了），并具体告诉用户她正在等待
    UI 的哪个部分。这种技术被称为“内联状态指示”（inline status indication）。将其与无处不在的状态指示进行比较，后者和互联网本身一样老：在极度缺乏内容的页面上叠加单个循环的动画图形。用户已经厌倦了这种。相比之下，内联状态指示允许你通过阻塞内容尚未加载的特定区域来显示尽可能多的界面。这不仅更细致，而且当用户在数手指等待页面完全加载时，有更多内容可以注视。


    这里的要点很简单：你提供给用户的参与内容越多，他们感到无聊的时间就越长。


    ## 利用本能直觉 (LEVERAGE PRIMAL INSTINCTS)


    人类大脑有一个专门用于视觉处理的区域。我们天生无论主观意愿如何对突然的移动做出反应。因此，如果页面上发生了需要用户立即注意的重要操作，请考虑使用移动来标记她的注意力。提醒用户的一种常用方法是通过反复向上向下移动元素来产生“弹跳”效果。这种实现方式与元素颜色的动画形成对比，后者没有利用本能；我们并没有被训练成本能地将颜色变化解释为值得立即关注的事。（然而，请考虑在某些国家，通过反复接触，人们被训练将红色解释为“停止”，绿色解释为“通过”，这些都是社会强化意义的例子。在设计动态时，也要考虑这种现象。）


    深入研究心理学，用户将朝向自己的移动解释为一个需要采取行动的紧急通知，而将远离自己的移动解释为避开她的路，因此不需要采取行动。


    ## 让交互具有直观感受 (MAKE INTERACTIONS VISCERAL)


    大而软软的、带有丰富色彩渐变的按钮会让用户想要点击。这类元素通过令人满意的压力施加感和色彩爆发来奖励点击行为。这里的教训是激励：点击按钮越有趣，用户就越会这样做。利用这种现象为重要的行动号召（Call
    to Action）让用户参与，例如注册新账户或从购物车结账的按钮。


    ## 反映分量 (REFLECT GRAVITAS)


    如果用户采取了具有不可逆转后果的行动，请使用感觉同样重要的动态设计来加强这种观念。例如，点击“删除”按钮相关的动画应该比悬停在标准导航下拉菜单上的动画更具意义。后者可能涉及简单的颜色变化，而前者可能包含尺寸的突然跳变和元素边界的加粗。通过根据严重程度梯度划分动态设计，你将帮助用户直观地理解可用操作的层级。这种技术与本章的其他技术一起，服务于增加用户理解和信心的目标。


    ## 减少并发 (REDUCE CONCURRENCY)


    在某种程度上，用户总是试图理解你的 UI。无论是有意识无意识，他们都会对你所做的每一个设计和动态设计选择赋予意义。因此，如果你向用户展示由许多元素同时进入视图的扩展动画序列，将损害他们解析所有正在发生的运动含义的能力。


    简而言之，如果你正在使用动态设计来指示重要内容，请确保你没有同时指示许多不同的事情。如果是这样，考虑将动画拆分为步骤或减少动画总数。


