    \ that is repeated for every iteration of the loop. In addition to appending the\
    \ loop's current element to the DOM (which has its own performance implications),\
    \ you're now also forcing a DOM query. Seemingly harmless-line operations like\
    \ these add up quickly.\n\nThe solution is to cache the results—or, save the JEO's\
    \ variables—to avoid repeated DOM operation every time you want to call a jQuery\
    \ function. Hence, the code goes from looking like this:\n\n```javascript\n//\
    \ Bad practice: We haven't cached JEO\n$(\"element\").css(\"opacity\", 1);\n//\
