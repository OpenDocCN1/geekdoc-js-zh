- md: "\n# VALUE FUNCTIONS\n\nUnlike the static animation property values for the\
    \ previous section (for example, [ 215, 50 ]), this section uses functions for\
    \ property values: each property is forced an array of start and end values that\
    \ are dynamically produced by functions. Let's briefly explore these value functions,\
    \ which are a unique feature of Velocity.\n\nNOTE: Read more about value functions\
    \ at VelocityJS.org/#valueFunctions\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_175_0.png)\n\
    \nValue functions you pass in as animation property values. These functions trigger\
    \ at run-time, and are called individually for each element animated in a set.\
    \ In the demo, the set in question is the circle divs contained within the $circles\
    \ jQuery element object. Consequently, each circle element property will be assigned\
    \ its own randomized value once the animation begins. The only other way to achieve\
    \ differentiation between animation properties in a set of elements is by looping\
    \ through them, which gets messy and performs badly. This is the benefit of value\
    \ functions—you keep animation code clean and maintainable.\n\nNotice that, to\
    \ produce the randomized values, this section of code leverages a helper function\
    \ that was defined in Animation setup. (As a reminder, the r function returns\
    \ a randomized integer value constrained by its min and max arguments.) You'll\
    \ learn more about this function momentarily.\n\n# OPACITY ANIMATION\n\nThe opacity\
    \ property animates from and toward randomized values. In the case of the starting\
    \ value, you're giving the randomized value a slight boost to ensure that the\
    \ elements are never too close to being invisible—after all, you want the viewer\
    \ to see what you're animating! The animation of opacity results in a scattering\
    \ of circles all over the page that have varying opacities from the very first\
    \ frame. Differentiated opacities create a nice gradient effect that adds visual\
    \ richness to the demo.\n\nThis code takes advantage of force-feeding for a purpose\
    \ other than performance optimization: value functions are being force-fed to\
    \ dynamically generate start values for the elements that have yet to be inserted\
    \ into the DOM, which means you're successfully avoiding writing an entirely new\
    \ code block just to set the initial CSS states of the circle elements. You're\
    \ dynamically providing unique starting positions in the same line of code responsible\
    \ for animating those positions. As discussed thoroughly in Chapter 4, \"Animation\
    \ Workflow,\" you should strive for this level of expressiveness in all of your\
    \ animation code.\n\n# TRANSLATION ANIMATION\n\nFor easy reference, here's this\
    \ section's code once again:\n\n```\n********************************\nCircle\
    \ animation\n********************************\n$circles\n.appendTo($container)\n\
    .velocity({\n  opacity: {\n    function() { return Math.random() },\n    function()\
    \ { return Math.random() + 0.1 }\n  },\n  translateX: {\n    function() { return\
    \ \"+\" + r(-screenWidth/2.5, screenWidth/2.5) },\n    function() { return r(0,\
    \ screenWidth) }\n  },\n  translateY: {\n    function() { return \"+\" + r(-screenHeight/2.75,\
    \ screenHeight/2.75) },\n    function() { return r(0, screenHeight) }\n  },\n\
    \  translateZ: {\n    function() { return \"+\" + r(translateZMin, translateZMax)\
    \ },\n    function() { return r(translateZMin, translateZMax) }\n  }\n}, { duration:\
    \ 6000 })\n.velocity(\"reverse\", easing: \"easeOutQuad\")\n.velocity({ opacity:\
    \ 0 }, 2000);\n```\n\nIt's time to examine the translate animations, which individually\
    \ translate the circle elements' positions in the demo's 3D space. All three axes\
    \ are animating from a randomized start value toward randomized end value. The\
    \ value operator, which consists of the plus sign followed by the equals sign\
    \ (=), tells the animation engine to animate properties incrementally from their\
    \ starting values. In other words, the += value operator instructs the animation\
    \ engine to treat the end value as a relative value. In contrast, the default\
    \ behavior of an animation engine is to interpret an end value in absolute terms.\n\
    \nAs with opacity, this code section leverages force-feeding and value functions\
    \ for their expressivity and performance benefits. In particular, the circles'\
    \ movement is constrained within ranges relative to the screen dimensions for\
    \ the X and Y axes, and relative to the predefined min and max depth values for\
    \ the Z-axis. (As a reminder, these values were set in the animation setup section.)\
    \ In the case of the X and Y axes, there's an arbitrary fudge factor (notice the\
    \ division by 2.75) to reduce how speed out the elements animate. This value is\
    \ simply a creative decision; tweak it to suit your aesthetic preference.\n\n\
    Finally, the options object specifies that this entire animation should occur\
    \ over a duration of 6000ms.\n\n# REVERSE COMMAND\n\nAfter the primary Velocity\
    \ animation, the chain continues with a call to Velocity's reverse command. Reverse\
    \ does exactly what it sounds like: it animates the target elements back to their\
    \ initial values prior to the previous Velocity call taking place. In this unique\
    \ case, since start values have been force-fed into the previous Velocity call,\
    \ those are the start values that reverse will animate toward.\n\nOne of my reasons\
    \ for including the reverse command in this demo is to extend the demo's overall\
    \ animation with a single line of maintainable and expressive code. (While you\
    \ could double the duration of the animation from 6000ms to 12000ms, this would\
    \ result in slowing down the movement of the circles.) The convenience of the\
    \ reverse command is avoiding having to respecify—by hand—all of the animation\
    \ start values. It would have been a huge mess to accomplish.\n\n**TIP:** To preview\
    \ popular easing types, visit easings.net.\n\nThe reverse command fades the elements\
    \ out over a duration of 2000ms, leaving the browser in its original state.\n\n\
    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_178_0.png)\n\n# WRAPPING UP\n\nFrom force-feeding,\
    \ to value functions, to reverse, this walkthrough has illustrated the power of\
    \ Velocity. Hopefully, this chapter has convinced you that intricate-looking animations\
    \ can actually be achieved in fewer than 75 lines of clean, legible, and performant\
    \ code. Let this demo serve as a concrete example of how to use the right tools.\n\
    \nNow, go and design some beautiful websites and apps! Once you’ve put together\
    \ something cool, show me on Twitter: twitter.com/shapiro.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_180_0.png)\n"
  mdcn: "\n\n# 数值函数\n\n与上一节中静态动画属性值（例如，[ 215, 50 ]）不同，本节对属性值使用了函数：每个属性都被强制要求一个由函数动态生成的起始值和结束值数组。让我们简要探索这些数值函数，它们是\
    \ Velocity 的独特特性。\n\n注意：访问 VelocityJS.org/#valueFunctions 了解更多关于数值函数的知识。\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_175_0.png)\n\
    \n这些是你作为动画属性值传递的数值函数。这些函数在运行时触发，并为集合中动画的每个元素单独调用。在演示中，涉及的集合是包含在 `$circles` jQuery元素对象中的圆形\
    \ `div`。因此，一旦动画开始，每个圆形元素的属性将被分配其自身的随机值。在元素集合中实现动画属性差异化的唯一其他方法是循环遍历它们，但这会导致代码变得混乱且性能低下。这就是数值函数的优势——你能够保持动画代码的整洁和易于维护。\n\
    \n注意，为了产生随机值，本节代码利用了在“动画设置”中定义的辅助函数。（提醒一下，`r` 函数返回一个受其 `min` 和 `max` 参数限制的随机整数值。）稍后你将学习更多该函数的知识。\n\
    \n# 不度动画\n\n不度属性从随机值向随机值进行动画。在起始值的情况下，你对随机值进行了轻微提升，以确保元素永远不会太接近透明——毕竟，你希望让观众看到你正在制作的内容！不度的动画会导致圆形散布在整个页面上，并且从第一帧开始就具有不同的不度。差异化的不度营造了良好的渐变效果，为演示增添了视觉丰富性。\n\
    \n这段代码利用“强制注入”（force-feeding）是为了性能优化之外的目的：通过强制注入数值函数来为尚未插入 DOM 的元素动态生成起始值，这意味着你成功地避免了为了设置圆形元素的初始\
    \ CSS 状态而编写完全全新的代码块。你在负责处理这些位置动画的同一行代码中，动态地提供了唯一的起始位置。正如第四章“动画工作流”中彻底讨论的那样，你应该在所有的动画代码中都追求这种表达力。\n\
    \n# 翻译动画\n\n为了方便参考，这里再次给出本节的代码：\n\n```\n********************************\nCircle\
    \ animation\n********************************\n$circles\n.appendTo($container)\n\
    .velocity({\n  opacity: {\n    function() { return Math.random() },\n    function()\
    \ { return Math.random() + 0.1 }\n  },\n  translateX: {\n    function() { return\
    \ \"+\" + r(-screenWidth/2.5, screenWidth/2.5) },\n    function() { return r(0,\
    \ screenWidth) }\n  },\n  translateY: {\n    function() { return \"+\" + r(-screenHeight/2.75,\
    \ screenHeight/2.75) },\n    function() { return r(0, screenHeight) }\n  },\n\
    \  translateZ: {\n    function() { return \"+\" + r(translateZMin, translateZMax)\
    \ },\n    function() { return r(translateZMin, translateZMax) }\n  }\n}, { duration:\
    \ 6000 })\n.velocity(\"reverse\", easing: \"easeOutQuad\")\n.velocity({ opacity:\
    \ 0 }, 2000);\n```\n\n现在是时候检查平移动画了，它们在演示的 3D 空间中单独平移圆形元素的位置。三个轴都会从随机起始值向随机结束值进行动画。值运算符（由加号\
    \ `+` 后接等号 `=` 组成）告诉动画引擎从其起始值增量动画属性。换句话说，`+=` 值运算符指示动画引擎将结束值视为相对值。相比之下，动画引擎的默认行为是用绝对值解释结束值。\n\
    \n与不度一样，这段代码利用强制注入和数值函数是为了表达力和性能优势。特别是圆形的移动被限制在 X 和 Y 轴相对于屏幕尺寸的范围内，以及 Z 轴相对于预定义的最小和最大深度值的范围内。（提醒一下，这些值在动画设置部分已设置过。）对于\
    \ X 和 Y 轴，有一个任意的修正因子（注意除以 2.75），用以减少元素动画的速度感。这个值纯粹是一个创意决定；可以根据你的审美偏好对其进行调整。\n\n\
    最后，`options` 对象指定了整个动画应该在 6000ms 的持续时间内完成。\n\n# 反向命令\n\n在主 Velocity 动画之后，链式继续调用\
    \ Velocity 的 `reverse`（反向）命令。`reverse` 的作用顾物其名：它将目标元素动画回上一次 Velocity 调用之前的初始值。在这种特殊情况下，由于起始值已强制注入到上一次\
    \ Velocity 调用中，那些就是 `reverse` 将向之动画的起始值。\n\n我在此演示中包含 `reverse` 命令的原因之一是用一行易于维护且具有表达力的代码来扩展演示的整体动画。（虽然你可以将动画时间从\
    \ 6000ms 翻倍到 12000ms，但这会导致圆形移动变慢。）`reverse` 命令的便利之处在于避免了手动重新指定所有的动画起始值。如果手动实现，将是一场巨大的混乱。\n\
    \n**提示：** 要预览流行的缓动类型，请访问 easings.net。\n\n`reverse` 命令在 2000ms 的持续时间内让元素淡出，使浏览器恢复原始状态。\n\
    \n![](img/556d1045d4d84ff85ee82fbcd7feb49f_178_0.png)\n\n# 总结\n\n从强制注入到数值函数再到反向命令，本教程说明了\
    \ Velocity 的强大。希望本章能说服你，看起来复杂的动画实际上可以用少于 75 行整洁、易读且性能良好的代码来实现。让这个演示作为一个如何使用正确工具的具体示例吧。\n\
    \n现在，去设计一些精美的网站和应用吧！一旦你组合出酷炫的东西，请在 Twitter 上展示给我：twitter.com/shapiro。\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_180_0.png)\n\
    \n"
