    # CHAPTER 6

    Scalable Vector Graphics Primer'
  - '[PAGE 117]


    Since an in-depth tutorial on Scalable Vector Graphics (SVG) could easily comprise
    a book of its own, this chapter simply serves as an introduction to the topic.
    The goal is to equip you with enough knowledge to be comfortable animating SVG
    elements and to know where to go next to continue your learning.'
  - '[PAGE 118]


    # CREATING IMAGES THROUGH CODE


    An SVG element is a type of DOM element that borrows the syntax of the HTML elements
    you''re already familiar with to define arbitrary shapes. SVG elements differ
    from HTML elements in that they have unique tags, attributes, and behaviors that
    allow them to define graphic shapes. Put another way, SVGs let you create images
    through code. This is a tremendously powerful concept because it means you can
    programmatically style and animate these shapes using JavaScript and CSS. In addition
    offers many other benefits:


    +   - SVG compresses incredibly well. Graphics defined in SVG have smaller file
    sizes than their PNG/JPEG equivalents, which can greatly improve site load times.

    - SVG graphics scale to any resolution without a loss of clarity. Unlike standard
    image formats, they look razor sharp across all devices—say good-bye to blurry
    images on screens.

    - Like HTML elements, SVG elements can be assigned event handlers that respond
    to a user''s input, which means that the graphics on your page can be made interactive.
    If you so desired, all the buttons on your site could be turned into animated
    graphics.

    - Many photo-editing apps (including Adobe Photoshop, Sketch, and Inkscape) let
    you export your design into SVG format for quick copying and pasting into HTML.
    So, even if you don''t consider yourself an artist, you can leverage third-party
    applications to do the designing for you.


    In short, SVGs are an amazing graphics solution. Let''s dive in!'
  - "[PAGE 119]\n\n# SVG MARKUP\n\nSVG elements are defined within a parent <svg>\
    \ container. Specifying the width and height dimensions of container element defines\
    \ the canvas that your SVG graphics render upon:\n\n```\n<svg version=\"1.1\"\
    \ width=\"500\" height=\"500\"\n  xmlns=\"http://www.w3.org/2000/svg\">\n  <circle\
    \ cx=\"100\" cy=\"30\" />\n  <rect id=\"rect\" x=\"100\" y=\"100\" width=\"200\"\
    \ height=\"200\" />\n</svg>\n```\n\nWithin <svg>, you can insert SVG shapes of\
    \ varying sorts. The above example has a circle element defined by a rect (rectangle)\
    \ element. As normal HTML elements, SVG elements accept height and width attributes,\
    \ which are used here for demonstration purposes, but (as with HTML) it is considered\
    \ best practice to specify SVG styling properties within a CSS stylesheet. As\
    \ with HTML, stylesheets classes target SVG elements via their id, class, or tag\
    \ types.\n\nWhere the SVG and HTML specifications differs in their range of accepted\
    \ HTML attributes and CSS properties. SVG elements accept only a few of the standard\
    \ CSS properties. Further, SVGs accept a special set of attributes, called *presentational\
    \ attributes*, which include *fill*, *x*, and *y*. (fill specifies which color\
    \ to fill a shape, with x and y define the position of the element's top-left\
    \ corner.) These attributes define how an element is visually rendered on its\
    \ canvas. Let's run through a few of them, using rect as a sample SVG element:\n\
    \n```\n<rect id=\"rect\" x=\"100\" width=\"200\" height=\"200\" />\n```\n\nHere,\
    \ the width and height attributes work as you'd expect. The unique x and y attributes\
    \ define the rectangle's coordinates within the canvas. These values simply position\
    \ the rectangle relative to an x=0, y=0 origin point. Unlike HTML, SVG positioning\
    \ is not defined with top, right, bottom, left, float, or margin CSS properties;\
    \ SVG positioning logic is fully dictated by explicitly defined coordinates. In\
    \ other words, an element's positioning doesn't affect the position of its sibling\
    \ elements; instead of pushing each other around the page, SVG siblings simply\
    \ overlap another."
  - '[PAGE 120]


    Now let''s take a look at the circle element. Its rendering is specified via coordinates
    that designate its center point (cx and cy) along with a radius value (r) that
    designates its length:


    ```

    <circle cx="100" cy="100" r="30" />

    ```


    Pretty simple, right? SVG elements use the same markup structure as HTML elements,
    so all the code samples in this chapter should feel familiar.


    Note that there are many other types of SVG elements, including ellipse, line,
    and text. See the end of this chapter for further details.'
  - "[PAGE 121]\n\n# SVG STYLING\n\nSVG elements accept a variety of special styling\
    \ properties that are not available to HTML elements. SVG's fill property, for\
    \ example, is similar to background-color in CSS, stroke is similar to border-color,\
    \ and stroke-width is similar to border-width. Take a look at this example:\n\n\
    ```\n<svg version=\"1.1\" width=\"500\" height=\"500\">\n  <xmlns=\"http://www.w3.org/2000/svg\"\
    >\n  <circle cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: blue\" />\n  <rect id=\"\
    rect\" x=\"100\" y=\"100\" width=\"200\" height=\"200\"\n       style=\"fill:\
    \ green; stroke: red; stroke-width: 5px\" />\n</svg>\n```\n\nAbove, the circle\
    \ element is filled with solid blue, and the rect element is filled with solid\
    \ green. Additionally, the rectangle has a red border with a thickness of 5px.\n\
    There many other SVG-specific styling properties. For now, it's simply important\
    \ for you to know that they exist so you'll pay extra attention when trying to\
    \ animate CSS properties on SVG elements.\n\n> NOTE: Refer to the \"Wrapping up\"\
    \ section of this chapter for information on where to find a full listing of SVG\
    \ styling properties.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_121_0.png)"
- md: "\n# SUPPORT FOR SVG\n\nOut-of-the-box support for SVG element animation isn’t\
    \ great: neither jQuery nor CSS offers complete support for animating SVG-specific\
    \ SVG styling properties and present attributes. Further, CSS transitions can’t\
    \ animate SVG elements at all on Internet Explorer 9, and CSS can’t be used to\
    \ apply transform animations to SVG elements on any version of Internet Explorer.\n\
    \nTo gain comprehensive SVG animation support, use either a dedicated SVG library\
    \ or an animation library that has built-in support for SVG elements. One noteworthy\
    \ dedicated SVG library is Snap.svg. It probably won’t surprise you to learn that\
    \ Velocity.js, the JavaScript animation library you’ve been using throughout this\
    \ book, provides full support for SVG element animation.\n\n> NOTE: Go to SnapSVG.io\
    \ to download the Snap.svg library.\n\n# SVG ANIMATION\n\nSVG elements might never\
    \ be the backbone of your UI, but they’re certainly appropriate for spicing up\
    \ the parts of your page that you’d normally fill with static images. Uses for\
    \ SVGs include:\n\n- Buttons with intricate animation sequences that are triggered\
    \ when users hover and click.\n- Unique loading status graphics that replace the\
    \ all-to-common rotating indicator GIF.\n- Company logos whose individual parts\
    \ animate together upon page load.\n\nThis last use case is explored in more detail\
    \ later in this chapter.\n\n# PASSING IN PROPERTIES\n\nWith Velocity, SVG properties\
    \ are animated in the same way that standard CSS properties are. Pass the appropriate\
    \ properties and their desired end values into Velocity’s properties object:\n\
    \n```\n// Animate an SVG element to a red fill and a black stroke\n$svgElement.velocity({\
    \ fill: \"#ff0000\", stroke: \"#000000\" });\n```\n\nIn contrast, note that the\
    \ code below would not work since the following CSS properties are not supported\
    \ by SVG elements:\n\n```\n// Incorrect: These properties don't apply to SVG elements\n\
    $svgElement.velocity({ border: \"5px\", borderColor: \"#000000\" });\n```\n\n\
    # PRESENTATIONAL ATTRIBUTES\n\nThe presentational attributes explored earlier\
    \ in this chapter are also animated as expected:\n\n```\n// Animate the x and\
    \ y coordinates of a rectangle\n$(\"rect\").velocity({ x: 100, y: 100 });\n//\
    \ Animate the cx and cy coordinates of a circle\n$(\"circle\").velocity({ cx:\
    \ 100, cy: 100 });\n// Animate the dimensions of a rectangle\n$(\"rect\").velocity({\
    \ width: 200, height: 200 });\n// Animate the radius of a circle\n$(\"circle\"\
    ).velocity({ r: 100 });\n```\n\nAll the Velocity attributes features that you're\
    \ currently using—animation reversal, UI pack effects, sequence triggering, and\
    \ so on—work as expected with SVG elements.\n\n# POSITIONAL ATTRIBUTES VS. TRANSFORMS\n\
    \nYou might be wondering what the difference is between using the x, y, and y\
    \ positional attributes instead of CSS transforms (e.g. translateX, translate)\
    \ when specifying the positions of SVG elements. The answer is browser support.\
    \ Internet Explorer (up to including Internet Explorer 11) does not support CSS\
    \ transforms on SVG elements. Consider the following:\n\n- The x and y attributes\
    \ work everywhere SVG elements do (IE8+, Android 3+)\n$(\"rect\").velocity({ x:\
    \ 100, y: 100 });\n- Alternatively, positional transforms (such as translateX\
    \ and translateY) work everywhere *except* Internet Explorer\n$(\"rect\").velocity({\
    \ translateX: 100, translateY: 100 });\n\n> NOTE: Although transforms are known\
    \ to be particularly performant due to hardware acceleration (read more on this\
    \ in Chapter 7, \"Animation Performance\"), both approaches to SVG animation are\
    \ equally fast since SVG graphics are hardware-accelerated by default.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_124_0.png)\n\
    \n![](img/556d1045d4d84ff85ee82fbcd7feb49f_125_0.png)\n\n# IMPLEMENTATION EXAMPLE:\
    \ ANIMATED LOGOS\n\nHigh-resolution site logos that animate into place upon load\
    \ are ideal targets for SVG implementation. Suppose you want to crudely replicate\
    \ the MasterCard logo, which consists of two overlapping circles of different\
    \ colors. If you were to animate this logo into place using Velocity, you would\
    \ start with an SVG canvas defined as:\n\n```\n<svg version=\"1.1\" width=\"500\"\
    \ height=\"500\" xmlns=\"http://www.w3.org/2000/svg\">\n  <circle id=\"circleleft\"\
    \ cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: red\" />\n  <circle id=\"circleRight\"\
    \ cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: orange\" />\n</svg>\n```\n\nThis\
    \ creates two overlapping circles with identical radii. Next, you'd animate the\
    \ circles outward from their origins so they could overlap slightly when animating:\n\
    \n```\n// Move one circle toward the left\n$(\"#circleleft\").velocity({ cx: \"\
    -15px\" }, { easing: \"spring\" });\n// Move one circle toward the right\n$(\"\
    #circleRight\").velocity({ cx: \"+15px\" }, { easing: \"spring\" });\n```\n\n\
    Here, the left circle is animated 15 pixels (using the \"-\" operator to decrement\
    \ the circle's current value) and the right circle is animated 15 pixels. The\
    \ spring easing adds flair by making the circles bounce away from one another\
    \ with prop force.\n\nSince SVG elements can listen for mouse-based events (clicks,\
    \ hovers, and so on), you could improve this by turning it into SVG interaction.\
    \ With the aid of jQuery and Velocity, one implementation could look like:\n\n\
    ```\n$(\"svg\").on(\"mouseover\", function() {\n  $(\"#circleleft, #circleRight\"\
    ).velocity(\"reverse\");\n});\n```\n\nThis triggers a reversal of the circles'\
    \ page-load animation when the user hovers on or off the SVG element. The single\
    \ line of code accomplishes this by leveraging Velocity’s reverse command. For\
    \ more on working with reverse, refer to Chapter 2, “Animating with Velocity.”\
    \ In effect, when the user first hovers, the page-load animation is reversed,\
    \ bringing the logo back to its original form.\n\nWhile this code example is undoubtedly,\
    \ this is once again a good thing because it reflects the similarities between\
    \ animating SVG and HTML elements. Where SVGs do start to become complex is when\
    \ you define arbitrary shapes that go beyond the basics of squares, rectangles,\
    \ and so on. After all, SVG elements can define any shape you can dream up in\
    \ a photo editor, so they have to be tremendously expressive. But mastering SVG\
    \ design is beyond the scope of this book. See the “Wrapping up” section of this\
    \ chapter to learn where to go.\n\n# WRAPPING UP\n\nIf you're intrigued by what\
    \ you've read so far and want to learn more about working with SVGs, check out\
    \ these great resources:\n\n- For a full overview of working with SVG elements,\
    \ refer to Jonathan Tryhall's fantastic and free SVG Pocket Guide (https://github.com/jonitryhall/svgpocketguide).\n\
    - For a directory of SVG element types and their properties, consult Mozilla Developer\
    \ Network (https://developer.mozilla.org/en-US/docs/Web/SVG).\n- For a listing\
    \ of all the SVG attributes and styling properties that Velocity can animate,\
    \ refer to VelocityJS.org/#svg.\n\n# CHAPTER 7: Animation Performance\n\nPerformance\
    \ affects everything. Increased performance—apparent or real—drastically improves\
    \ UX, which in turn boosts your company's *bottom line*. Several major studies\
    \ have demonstrated that latency increases on search engines result in significant\
    \ decreases in revenue per user. To put it bluntly, *people hate waiting.*\n\n\
    As explained in Chapter 1, JavaScript animation performance is comparable to that\
    \ of CSS animation. So, if you're using a modern animation library such as Velocity.js,\
    \ the performance of your engine is not your app’s bottleneck—it's your own code.\
    \ That's what this chapter explores: techniques for coding high-performance animations\
    \ across all browsers and devices.\n\n# THE REALITY OF WEB PERFORMANCE\n\nIf you've\
    \ ever wondered why running concurrent animations slows down your UI, or why your\
    \ site performs slowly on mobile devices, this chapter is for you.\n\nAnimations\
    \ are a very resource-intensive process for browsers to perform, but there are\
    \ many techniques that can help the browser work as efficiently as possible. We're\
    \ about to learn them.\n\nFrom the perspective of UI design, there's no shortage\
    \ of articles excelling the virtues of mobile-first, responsive websites. Conversely,\
    \ from the perspective of UI performance, most of us, as developers, are unaware\
    \ of what best practices are or how to follow them. Staying abreast of the web\
    \ performance landscape is overwhelming and oftentimes futile; we're held captive\
    \ by browser and device quirks, byproducts of the volume of devices (desktops,\
    \ smartphones, and tablets) and browsers (Chrome, Android, Firefox, Safari, Internet\
    \ Explorer) that crowd the ecosystem. Considering that these platforms are continuously\
    \ updated, it's no surprise that we often throw in the towel and sideline performance\
