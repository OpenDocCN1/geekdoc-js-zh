    \ once when their respective events start: instead, they are called throughout\
    \ the duration of the user's respective interaction with the page.\n\n# SOLUTION\n\
    \nThe solution to this problem is debounce event handlers. Debouncing is the process\
    \ of defining an interval during which an event handler callback will be called\
    \ only once. For example, say you defined a debounce interval of 250ms and the\
