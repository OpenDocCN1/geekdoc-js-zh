    how to use Velocity; it functions nearly identically to jQuery''s $.animate()
    function.


    But regardless of your existing knowledge, the methodical feature breakdowns in
    this chapter will introduce you to the nuances of animation engine behavior. Mastering
    these nuances will help take you from novice to professional. Even if you''re
