    \ Hence, if you've registered callbacks that interact with the DOM—or worse, contain\
    \ layout thrashing—they can cause tremendously high load during times of scrolling\
    \ and resizing. Consider the following code:\n\n```\n// Perform an action when\
    \ the browser window is scrolled\n$(window).scroll(function() {\n  // Anything\
    \ in here is fired multiple times per second while the\n  -> user scrolls\n});\n\
    \n// Perform an action when the browser window is resized\n$(window).resize(function()\
    \ {\n  // Anything in here is fired multiple times per second while the\n  ->\
