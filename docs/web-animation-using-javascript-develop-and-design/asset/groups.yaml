    # DESIGN TECHNIQUES


    The techniques discussed so far in this chapter will improve your workflow during
    the coding phase of motion design. The techniques covered in this section focus
    on the design phase, where you''re still experimenting to find the perfect animation
    that fits your UI. This phase requires a lot of creativity and a lot of repetition,
    and is accordingly ripe for workflow improvements.


    # TIMING MULTIPLIERS


    The first design technique is to use a global timing multiplier. This consists
    of sprinkling in a multiplier constant against all of your animations'' delay
    and duration values.

    Start by defining your global timing multiplier (arbitrarily designated as M multiplier):


    ```

    var M = 1;

    ```


    Then, bake the multiplier into the duration and delay option values within each
    animation call:


    ```

    $element1.animate({ opacity: 1 }, { duration: 1000 * M });

    $element2.velocity({ opacity: 1 }, { delay: 250 * M });

    ```


    > NOTE: if you use SASS or LESS, which provide support for variable usage within
    stylesheets, this technique applies equally to CSS animations!


    Embedding a multiplier constant will help you quickly modify the M constant in
    one location (presumably at the top of your style.js) in order to quickly speed
    up or slow down all of the animations across your page. Benefits of such timing
    control include:


    +   Slowing down animations to perfect the timing of individual animation calls
    within a complex animation sequence. When you''re constantly refreshing your page
    in order to tweak a multi-element animation sequence to perfection, seeing the
    sequence in slow motion makes it significantly easier to assess how individual
    elements interact with one another.'
- md: '

    +   Speeding up animations when you''re performing repetitive UI testing. When
    you''re testing a site for purposes other than animation, evaluating the end state
    of UI animations (how elements wind up) is more important than testing the animations''
    motion. In these situations, it saves time and reduces headaches to speed up all
    the animations across your page so you''re not waiting for your animations to
    play out on each page refresh.


    Velocity has a handy implementation of this functionality mock, which functions
    as a behind-the-scenes global multiplier you don''t have to sprinkle in the M
    by hand. Like the example shown above, mock multiplies both the duration and the
    delay values. To turn mock on, temporarily set $.Velocity.mock to the multiplier
    value you want to use:


    ```

    // Multiply all animation timing by 5

    $.Velocity.mock = 5;

    ```


    ```

    // All animations are now time-adjusted

    // The duration below effectively becomes 5000ms

    $element.velocity({ opacity: 1 }, { duration: 1000 });

    ```


    Velocity''s mock feature also accepts a Boolean value: setting mock to true sets
    all durations and delays to 0ms, which forces all animations to complete within
    a single browser ticking tick, which occurs every few milliseconds. This is a
    powerful shortcut for quickly turning off all animations when they''re getting
    in the way of your UI development and testing.


    ## USE VELOCITY MOTION DESIGNER


    Velocity Motion Designer (VMD) was crafted with the sole purpose of helping developers
    streamline the creation phase of motion design. VMD is a bookmarklet you load
    onto a page in order to design animations in real time. It allows you to double-click
    elements to open a modal that lets you specify animation properties and options
    for that element. You then hit Enter on your keyboard to watch the animation play
    out immediately—without a page refresh.


    > NOTE: Get Velocity Motion Designer at http://velocityjs.org/#vmd.


    ## make motion design fun.


    Once you''ve designed all your element animations exactly the way you want them,
    you can export your work into one-for-one Velocity code, which you can place immediately
    into an IDE for use in production. (The resulting code is also fully compatible
    with jQuery.)


    Ultimately, VMD saves countless hours of development time by preventing constant
    IDE and browser switching and repeated UI state retriggering. Further, it streamlines
    the designer-to-developer workflow by allowing the two teams to work alongside
    another in real time: with VMD, designers can implement motion design without
    having to familiarize themselves with a site''s JavaScript or CSS. They can simply
    hand off the exported Velocity code to the developers to integrate into the codebase
    at their discretion.


    VMD is a highly visual tool—visit Velocity.org/#vmd to see the walkthrough video.


    ## WRAPPING UP


    As you implement animation workflow techniques, you''ll notice the intimidating
    black box of motion design beginning to unfold. The beautifully intricate loading
    sequences found on cutting-edge sites like Stripe.com and Webflow.com will start
    to make sense to you. You''ll gain confidence in your ability to code animation
    sequences, and this newfound skill will reduce friction in your development routine,
    making it not only easier but also significantly more fun to accomplish your motion
    design goals.


    ## CHAPTER 5


    ## Animating Text


    Since textual animation is rarely employed in webpages, using it is an easy way
    to impress users. That''s precisely what makes this topic so much fun to learn:
    the underlying techniques are simple to program, but the results feel incredibly
    rich and complex to the user.


    This chapter introduces you to tools that remove the tedious aspects of textual
    animation and equip you with an efficient workflow. Read on to learn the nuances
    of this dark art.


    ## THE STANDARD APPROACH TEXT ANIMATION


    The standard HTML elements we code with—divs, tables, anchor tags, and the like—are
    the lowest-level components of a webpage that can be styled. So it makes sense
    that these are the lowest-level components that can be animated.


    Text does not constitute an element unto; a block of text is designated by the
    browser as a text node, which is an unstylable, lower-level component that must
    be contained by an element. Further complicating factors is that the browser does
    not subdivide text nodes into grammatical components; there is no way to access
    individual letters, words, or sentences.


    Consequently, to animate a letter, word, or sentence basis, you have to break
    each text node into separate text nodes, and then wrap each of these in a new
    element. You can animate them. But manually wrapping text in span elements, for
    example, is tedious work that results in bloated HTML.


    It’s no surprise that text animation on the web is uncommon; it’s typically too
    much of a hassle to deal with software. This puts the web at an aesthetic disadvantage
    to dedicated motion design software, such as Adobe After Effects, which allows
    for the fine-grained animation of text—the results of which are commonly seen
    in TV commercials and movie title sequences. These effects can look absolutely
    beautiful. Unfortunately, in addition to being difficult to integrate on the web,
    they’re also widely considered bad practice. After all, the web is a medium that
    prioritizes function over form, and text animation is largely about form.


    However, there is one textual animation case that can carry well over the web
    when used sparingly; if you pay close attention to the depictions of futuristic
    hardware interfaces in movies, you’ll notice the common thread of text being animated
    into out of view on a graphical level. The future of computing, according to pop
    culture, consists of words and sentences animating with flickers, glitches, pops
    and bursts. These effects look cool, and there isn’t much downside to embracing
    them for the purposes of transitioning content into out of view since the text
    had to undergo a visibility animation by one means or another. This concept of
    transitioning text visibility is precisely what you’ll learn about in this chapter.


    ## text effects look plain cool.


    ## PREPARING TEXT ELEMENTS FOR ANIMATION WITH BLAST.JS


    The tool of choice for typographic animation is Blast.js, which handily breaks
    blocks of text into characters, words, and sentences. You can then animate the
    resulting parts using Velocity and its UI pack plugin.


    > NOTE: Get Blast.js at Julian.com/research/blast.


    Blast.js has three delimiter types to define the grammatical components to be
    individually extracted: character, word, and sentence. Suppose you have a div
    that looks like this:


    ```

    <div>

    Hello World

    </div>

    ```


    If you call Blast on this div using the following syntax


    ```

    $("div").blast({ delimiter: "word" });

    ```


    the div would turn into this:


    ```html

    <div class="blast-root">

    <span class="blast">Hello</span></span>

    <span class="blast">World</span></span>

    </div>

    ```


    As you can see, Blast separates the target div''s text into elements wrapped in
    span. If you were to use the character delimiter, the result would have been:


    ```html

    <div class="blast-root">

    <span class="blast">H</span></span>

    <span class="blast">e</span></span>

    <span class="blast">l</span></span>

    <span class="blast">l</span></span>

    <span class="blast">o</span></span>

    </div>

    ```


    ```html

    <span class="blast"> </span>

    <span class="blast">W</span></span>

    <span class="blast">o</span></span>

    <span class="blast">r</span></span>

    <span class="blast">l</span></span>

    <span class="blast">d</span></span>

    </div>

    ```


    You can now animate these elements independently. Before you dive into textual
    animation, you''re going to learn more about how Blast works so you can take full
    advantage of its features.


    ## HOW BLAST.JS WORKS


    The goal of this section is to make you comfortable with the prospect of using
    Blast to break apart the text on your beloved page. Let''s dive in!

    div, tables, and the other HTML elements you''re familiar with are called element
    nodes. An element commonly consists of two types of children: additional element
    nodes and text nodes (raw text).

    Take this element, for example:


    ```html

    <div>Hello <span>World</span></div>

    ```


    This element is composed of two children: a text node (“Hello”) and a span element
    node. The span element node contains a child of its owner: another text node (“World”).

    When Blast is called, it traverses the entirety of the target element''s descendant
    chain to find text nodes. With each text node, Blast executes the RegExp query
    with the specified delimiter type (character, word, or sentence) to subdivide
    the node into elements. Since Blast doesn''t actually subdivide elements—you can
    safely apply it to the entire page without worrying about breaking elements''
    event handlers or other expected behaviors. This versatility is crucial when using
    Blast on user-generated content that is often dirtied with HTML. (Say, for example,
    you want to separate the words in a message posted to your site''s comments section
    so you can highlight important passages. With Blast, you can safely do so without
    concern for breaking the user''s embedded links.)

