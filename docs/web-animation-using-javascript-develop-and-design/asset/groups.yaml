  - '[PAGE 175]


    # VALUE FUNCTIONS


    Unlike the static animation property values for the previous section (for example,
    [ 215, 50 ]), this section uses functions for property values: each property is
    forced an array of start and end values that are dynamically produced by functions.
    Let''s briefly explore these value functions, which are a unique feature of Velocity.


    NOTE: Read more about value functions at VelocityJS.org/#valueFunctions


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_175_0.png)


    Value functions you pass in as animation property values. These functions trigger
    at run-time, and are called individually for each element animated in a set. In
    the demo, the set in question is the circle divs contained within the $circles
    jQuery element object. Consequently, each circle element property will be assigned
    its own randomized value once the animation begins. The only other way to achieve
    differentiation between animation properties in a set of elements is by looping
    through them, which gets messy and performs badly. This is the benefit of value
    functions—you keep animation code clean and maintainable.


    Notice that, to produce the randomized values, this section of code leverages
    a helper function that was defined in Animation setup. (As a reminder, the r function
    returns a randomized integer value constrained by its min and max arguments.)
    You''ll learn more about this function momentarily.


    # OPACITY ANIMATION


    The opacity property animates from and toward randomized values. In the case of
    the starting value, you''re giving the randomized value a slight boost to ensure
    that the elements are never too close to being invisible—after all, you want the
    viewer to see what you''re animating! The animation of opacity results in a scattering
    of circles all over the page that have varying opacities from the very first frame.
    Differentiated opacities create a nice gradient effect that adds visual richness
    to the demo.


    This code takes advantage of force-feeding for a purpose other than performance
    optimization: value functions are being force-fed to dynamically generate start
    values for the elements that have yet to be inserted into the DOM, which means
    you''re successfully avoiding writing an entirely new code block just to set the
    initial CSS states'
  - "[PAGE 176]\n\nof the circle elements. You're dynamically providing unique starting\
    \ positions in the same line of code responsible for animating those positions.\
    \ As discussed thoroughly in Chapter 4, \"Animation Workflow,\" you should strive\
    \ for this level of expressiveness in all of your animation code.\n\n# TRANSLATION\
    \ ANIMATION\n\nFor easy reference, here's this section's code once again:\n\n\
    ```\n********************************\nCircle animation\n********************************\n\
    $circles\n.appendTo($container)\n.velocity({\n  opacity: {\n    function() { return\
    \ Math.random() },\n    function() { return Math.random() + 0.1 }\n  },\n  translateX:\
    \ {\n    function() { return \"+\" + r(-screenWidth/2.5, screenWidth/2.5) },\n\
    \    function() { return r(0, screenWidth) }\n  },\n  translateY: {\n    function()\
    \ { return \"+\" + r(-screenHeight/2.75, screenHeight/2.75) },\n    function()\
    \ { return r(0, screenHeight) }\n  },\n  translateZ: {\n    function() { return\
    \ \"+\" + r(translateZMin, translateZMax) },\n    function() { return r(translateZMin,\
    \ translateZMax) }\n  }\n}, { duration: 6000 }n.velocity(\"reverse\", easing:\
    \ \"easeOutQuad\")\n.velocity({ opacity: 0 }, 2000);\n```"
  - '[PAGE 177]


    It''s time to examine the translate animations, which individually translate the
    circle elements'' positions in the demo''s 3D space. All three axes are animating
    from a randomized start value toward randomized end value. The value operator,
    which consists of the plus sign followed by the equals sign (=), tells the animation
    engine to animate properties incrementally from their starting values. In other
    words, the += value operator instructs the animation engine to treat the end value
    as a relative value. In contrast, the default behavior of an animation engine
    is to interpret an end value in absolute terms.


    As with opacity, this code section leverages force-feeding and value functions
    for their expressivity and performance benefits. In particular, the circles''
    movement is constrained within ranges relative to the screen dimensions for the
    X and Y axes, and relative to the predefined min and max depth values for the
    Z-axis. (As a reminder, these values were set in the animation setup section.)
    In the case of the X and Y axes, there''s an arbitrary fudge factor (notice the
    division by 2.75) to reduce how speed out the elements animate. This value is
    simply a creative decision; tweak it to suit your aesthetic preference.


    Finally, the options object specifies that this entire animation should occur
    over a duration of 6000ms.


    # REVERSE COMMAND


    After the primary Velocity animation, the chain continues with a call to Velocity''s
    reverse command. Reverse does exactly what it sounds like: it animates the target
    elements back to their initial values prior to the previous Velocity call taking
    place. In this unique case, since start values have been force-fed into the previous
    Velocity call, those are the start values that reverse will animate toward.


    One of my reasons for including the reverse command in this demo is to extend
    the demo''s overall animation with a single line of maintainable and expressive
    code. (While you could double the duration of the animation from 6000ms to 12000ms,
    this would result in slowing down the movement of the circles.) The convenience
    of the reverse command is avoiding having to respecify—by hand—all of the animation
    start values. It would have been a huge mess to accomplish this manually since
    you would have to first store all of the randomly generated start values into
    memory you could animate back to them. Hence, reverse is yet another great Velocity
    feature that allows the demo to accomplish a lot with just a few lines of code.'
  - '[PAGE 178]


    Velocity''s reverse command defaults to the options object used in the previous
    Velocity call—including its duration, easing, and so on. In this case, since the
    previous call used a duration of 6000ms, so will the reverse call. The reverse
    command also lets you specify a new options object to extend onto the previous
    one. This demo uses a new easing type of easeOutQuad for added motion design flair
    in the animation''s reverse direction.


    > **TIP:** To preview the behavior of the popular easing types, visit http://easings.net.


    When the reverse animation completes, a final Velocity call fades the elements
    out of view by transitioning their opacity values to 0 over a duration of 2000ms.
    This completes the demo by leaving the browser''s canvas in the same visual state
    it began in: clean and empty! Your work here is done.


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_178_0.png)'
  - '[PAGE 179]


    # WRAPPING UP


    From force-feeding, to value functions, to reverse, this walkthrough has illustrated
    the power of the Velocity animation engine. Hopefully, this chapter has convinced
    you that this book’s focus on Velocity was worthwhile. In fewer than 75 lines
    of terse, legible, and performant code, you’ve created a rich 3D scene unlike
    you’ve seen before in pure HTML.


    Let this demo serve as a concrete example of how simple intricate-looking animations
    can actually be—especially when you use the right tools and employ best practices.
    My hope is that this book has distilled the beautiful animation work you’ve seen
    across the web into a set of tenets that are easy to grasp and follow in pursuit
    of your own motion design.


    Now, go and design some beautiful websites and apps! Once you’ve put together
    something cool, show me on Twitter: twitter.com/shapiro.'
