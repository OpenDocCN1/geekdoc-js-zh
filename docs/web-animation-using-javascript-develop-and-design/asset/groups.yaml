- md: "\nSecond, if your UI is loading many images into view at once (say, eight or\
    \ more, depending on your device's hardware capabilities), consider not animating\
    \ the images at all, and instead crudely toggling the visibility of each image\
    \ from invisible to visible. To counteract how inept this can look, consider staggering\
    \ visibility so that the images load into one after another instead of simultaneously.\
    \ This will help the user's eye across the loading sequence, and will generally\
    \ deliver more refined motion design.\n\n> NOTE: Refer to Chapter 3, *Motion Design\
    \ Theory,* to learn more about animation design best practices.\n\n## SNEAKY IMAGES\n\
    \nYou're not done yet. There's more to this section than meets the eye, as we\
    \ haven't fully explored the ways in which images can materialize on a page. The\
    \ obvious culprit is the img element, but there are two other ways images can\
    \ sneak onto your pages.\n\n## CSS GRADIENTS\n\nThese are actually a type of image.\
    \ Instead of being pre-produced by a photo editor, they are produced at run-time\
    \ according to CSS styling definitions, for example, using a linear-gradient()\
    \ as the background-image on an element. The solution here is to opt for solid-color\
    \ backgrounds instead of gradients whenever possible. Browsers can easily optimize\
    \ the rendering of solid chunks of color, but with images, they have to work overtime\
    \ to render gradients, which differ from pixel to pixel.\n\n## SHADOW PROPERTIES\n\
    \nThe twin siblings of gradients are the box-shadow and text-shadow CSS properties.\
    \ These are rendered similarly to gradients, but instead of stylizing background-color,\
    \ they effectively stylize border-color. What's more, they have opacity falloffs\
    \ that require browsers to perform extra compositing work because the semitransparent\
    \ portions of the gradients must be rendered against the elements underneath the\
    \ animating element. The solution here is similar to the previous one: if your\
    \ UI looks almost good when you remove these CSS properties from your stylesheet,\
    \ pat yourself on the back and never look back. Your website's performance will\
    \ tell you.\n\nThese recommendations are simply that: recommendations. They are\
    \ not best practices since they sacrifice your design intentions for increased\
    \ performance. Consider them only as last resorts when your site's performance\
    \ is poor and you've exhausted all other options.\n\n## TECHNIQUE: DEGRADE ANIMATIONS\
    \ ON OLDER BROWSERS\n\nYou don't have to neglect supporting underperforming browsers\
    \ and devices. If you embrace a performance-minded workflow from day one, you\
    \ can provide them with a degraded—but completely functional—experience.\n\n##\
    \ PROBLEM\n\nInternet Explorer 8—a slow, outdated browser—is dying in popularity.\
    \ But Internet Explorer 9, its successor, is widely used outside of the Americas.\
    \ Further, older Android smartphones running Android 2.3 and below, which are\
    \ slow relative to the latest-generation Android and iOS devices, also remain\
    \ tremendously popular. Out of every users to your site, expect up to three of\
    \ them to fall into one of these two groups (depending on the type of users your\
    \ app attracts). Accordingly, if your site is rich in animation and other UI interactions,\
    \ assume it will perform especially poorly up to three of your users.\n\n## SOLUTION\n\
    \nThere are two approaches to addressing the performance issue raised by weaker\
    \ devices: either broadly reduce the occurrence of animations across your entire\
    \ site, or reduce them exclusively for the weaker devices. The former is ultimately\
    \ a product decision, but the latter is a simple technical decision that is easily\
    \ implemented if you're using the global animation multiplier technique (or Velocity's\
    \ equivalent mock feature) explained in the Chapter 4, \"Animation Workflow.\"\
    \ The global multiplier technique lets you dynamically alter the timing of animations\
    \ across your entire site by setting a single variable. The trick then—whenever\
    \ a weaker browser is detected—is to set the multiplier to 0 (or set $.Velocity.mock\
    \ to) so that all of a page's animations complete within a single animation tick\
    \ (less than 16ms):\n\n```\n// Cause all animations to complete immediately\n\
    $.Velocity.mock = true;\n```\n\nThe result of this technique is that weaker devices\
    \ experience UI animations that degrade so that instant style changes replace\
    \ your animated transition. The benefits are significant: your UI will perform\
    \ noticeably smoother without resource-intensive animations occurring on your\
    \ page. While this technique is undoubtedly destructive (it compromises your motion\
    \ design intentions), an improvement in usability is always worth a reduction\
    \ in elegance. After all, users visit your app to accomplish specific goals, not\
    \ to admire how clever your UI work is. Never let animations get in the way of\
    \ user intentions.\n\nIf you're still irked by the notion of stripping animations\
    \ from your UI, keep in mind that users on weaker devices are accustomed to websites\
    \ behaving slowly for them. So, if your site bucks the trend in a constructive\
    \ way, they'll be especially delighted by it and will be more likely to continue\
    \ using it.\n\n## FIND YOUR PERFORMANCE THRESHOLD EARLY ON\n\nContinuing from\
    \ the previous technique, it's worth stressing that the advice in this chapter\
    \ is especially relevant for mobile devices, many of which are slow relative to\
    \ desktop computers. Unfortunately, we, as developers, often fail to consider\
    \ this in our workflows: we routinely create websites within the pristine operating\
    \ environments of our high-end desktops, which are likely running the latest-generation\
    \ hardware and software available. This type of environment is divorced from the\
    \ real-world environments of users, who are often not using outdated hardware\
    \ and software, but tend to have many apps and browser tabs running simultaneously.\
    \ In other words, most of us work in development environments that are non-representationally\
