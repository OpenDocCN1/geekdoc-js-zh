  - '[PAGE 139]


    Consider the following two animation examples, both of which are triggered upon
    page load:


    ```

    // Animate translateX to 500px from a start value of 0

    $element.velocity({ translateX: [ 500, 0 ] });

    // Animate opacity to 0 from a start value of 1

    $element.velocity({ opacity: [ 0, 1 ]});

    ```


    In the first example, you''re passing translateX a force-fed start value of 0
    since you know that the element has yet to be translated (since the page has just
    loaded). You''re force-feeding in what you know (or want) the original property
    value to be. Further, in the second example, the element''s current opacity is
    1 because that''s the default value for opacity and you haven''t modified the
    element in any way. In short, with force-feeding, you can reduce the browser''s
    workload in situations where you have an understanding of how elements are styled.


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_139_0.png)


    > NOTE: Force-fed animation properties only when they''re first used in an animation
    chain, not when they occur subsequently in the chain, since Velocity already does
    internal caching:

    $element

    // Optionally forcefeed here

    .velocity({ translateX: [ 500, 0 ] })

    // Do not forcefeed here; 500 is internally cached

    .velocity({ translateX: 1000 });


    Force-feeding is an invaluable feature for high-stress situations as animating
    a large number of elements once on a desktop browser or when dealing with lowpowered
    mobile devices for which every page interaction incurs a noticeable delay.


    However, for most real-world UI animation situations, force-feeding is an unnecessary
    optimization that makes your code less maintainable due to having to update the
    force-fed start values whenever you change the elements'' values within CSS stylesheets.


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_139_1.png)


    > NOTE: Refer to Chapter 8, "Animation Demo," to walk through an application of
    force-feeding.'
  - "[PAGE 140]\n\n# TECHNIQUE: BATCH DOM ADDITIONS\n\nLike reducing layout thrashing,\
    \ batching DOM additions is another performance technique to avoid unoptimized\
    \ interaction with the browser.\n\n# PROBLEM\n\nYou're not done with gets and\
    \ sets just yet! A common page set is the insertion of new DOM elements at run-time.\
    \ While there are many uses for adding new elements to a page, perhaps the most\
    \ popular is infinite scrolling, which consists of elements continuously-animating\
    \ into view at the bottom of a page while the user scrolls down.\n\nAs learned\
    \ in the previous section, browsers have to compute the composition of all affected\
    \ elements whenever a new element is added. This is a relatively slow process.\
    \ When DOM insertion is performed many times per second, the page is hit with\
    \ a significant performance impact. Fortunately, when processing multiple elements,\
    \ browsers can optimize page set if all elements are inserted at the same time.\
    \ Unfortunately, as developers often unintentionally forgo this optimization by\
    \ separating our DOM insertions. Consider the following example of unoptimized\
    \ DOM insertion code:\n\n```\n// Bad practice\nvar $body = \"$(body)\";\nvar $newElements\
    \ = [ \"<div>Div 1</div>\", \"<div>Div 2</div>\",\n-> \"<div>Div 3</div>\" ];\n\
    $newElements.each(function(i, element) {\n  $(element).appendTo($body);\n  //\
    \ Other arbitrary code\n});});\n```\n\nThis iterates through a set of element\
    \ strings that are instantiated into element objects (without a performance drawback\
    \ since you're not querying the DOM for each JEO). Each element is then inserted\
    \ into the page using jQuery's appendTo()."
  - '[PAGE 141]


    Here''s the problem: even if additional code exists after the appendTo() statement,
    the browser won''t compress DOM sets into a single insertion operation because
    it can''t be certain that asynchronous code operating outside the loop won''t
    alter the DOM''s state between insertions. For example, if you queried the DOM
    to find how many elements exist on the page after each insertion:


    ```

    // Bad practice

    $newElements.each(function(i, element) {

    $(element).appendTo($body);

    // Output how many children the body element has

    console.log($body.children().size());

    });

    ```


    The browser couldn''t possibly optimize the DOM insertions into a single operation
    because the code explicitly asks the browser to tell us the accurate of elements
    that exist before the next loop begins. For the browser to return the correct
    count each time, it can''t have batched all insertions upfront.


    In conclusion, when you perform DOM element insertion inside a loop, each insertion
    happens independently of any others, resulting in a notable performance sacrifice.


    # SOLUTION


    Instead of individually inserting new elements into the DOM, construct the full
    element set in memory, then insert it via a single call to appendTo(). The optimized
    version of the code shown in the section above now looks like this:


    ```

    // Optimized

    var $body = "$body";

    var $newElements = [ "<div>Div 1</div>", "<div>Div 2</div>",

    "<div>Div 3</div>" \ ];

    var html = "";

    $newElements.each(function(i, element) {

    html += element;

    });

    $(html).appendTo($body);

    ```'
