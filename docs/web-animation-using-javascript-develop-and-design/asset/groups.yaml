  - '[PAGE 135]


    # TECHNIQUE: REMOVE LAYOUT THRASHING


    Layout thrashing—the lack of synchronization in DOM manipulation—is the 800-pound
    gorilla in animation performance. There''s no painless solution, but there are
    best practices. Let''s explore.


    # PROBLEM


    Consider webpage manipulation consists of setting and getting: you can set (update)
    or get (query) an element''s CSS properties. Likewise, you can insert new elements
    onto a page (set) or query for a set of existing elements (get). Gets and sets
    are the core browser processes that incur performance overhead (another is graphical
    rendering). Think of it this way: setting new properties on an element, the browser
    has to calculate the results of your changes. For example, changing the width
    of one element can trigger a chain reaction in which the width of the element''s
    parent, siblings, and children elements must also change depending on their respective
    CSS properties.


    The UI performance reduction that occurs from alternating sets with gets is called
    layout thrashing. While browsers are highly optimized for page-layout recalculations,
    the extent of their optimizations is greatly diminished by layout thrashing. Performing
    a series of gets at once, for example, can be easily optimized by the browser
    into a single, streamlined operation because the browser can cache the page''s
    state after the first get, then reference that state for each subsequent get.
    However, repeatedly performing one get by one forces the browser to do a lot of
    heavy lifting since its cache is continuously invalidated by the changes made
    by set.


    This performance impact is exacerbated when layout thrashing occurs within an
    animation loop. Consider how an animation loop aims to achieve 60 frames per second,
    the threshold at which the human eye perceives buttery-smooth motion. What this
    means is that every tick in an animation loop must complete within 16.7ms (1 second/60
    ticks ~= 16.67ms). Layout thrashing is a very easy way to cause each tick to exceed
    this limit. The end result, of course, is that your animation will stutter (or
    jank, animation parlance).'
  - '[PAGE 136]


    While some animation engines, such as Velocity.js, contain optimizations to reduce
    the occurrence of layout thrashing inside their own animation loops, be careful
    to avoid layout thrashing in your own loops, as the code inside a setInterval()
    or a self-invoking setTimeout().


    # SOLUTION


    Avoiding layout thrashing consists of simply batching together DOM sets and DOM
    gets. The following code causes layout thrashing:


    +   // Bad practice


    ```

    var currentTop = $("element").css("top"); // Get

    $(\element").style.top = currentTop + 1; // Set

    var currentleft = $("element").css("left"); // Get

    $(\element")...style.left = currentLeft + 1; // Set

    ```


    If you rewrite the code so that all queries and updates are aligned, the browser
    can batch the respective actions and reduce the extent to which code causes layout
    thrashing:


    ```

    var currentTop = $("element").css("top"); // Get

    var currentLeft = $("element").css("left"); // Get

    $(\element").css("top"), currentTop + 1); // Set

    $(\element").css("left"), currentLeft + 1); // Set

    ```


    The illustrated problem is commonly found in production code, particularly in
    situations where UI operations are performed depending on the current value of
    an element''s CSS property.


    Say your goal is to toggle the visibility of a side menu when a button is clicked.
    To accomplish this, you might first check to see if the side menu has its display
    property set to either "none" or "block", then you''d proceed to alternate the
    value as appropriate. The process of checking for the display property constitutes
    a get, and whichever action is subsequently taken to show or hide the side menu
    will constitute a set.'
