    \n简而言之，你将整合整书中积累的技能，创作出真正非常酷的东西。你编写演示的目标有两个：使用简洁且富有表现力的动画代码，并确保最大的性能。\n\n# 行为描述\n\
    \n该演示由 250 个在屏幕上浮入、浮出和移动的圆组成。每定期，你会放大，然后缩小回到虚拟摄像头开始的位置。第一张图片显示了放大后的视图。\n\n注意：在继续阅读之前，请访问\
    \ VelocityJS.org/demo.book.html 查看演示预览。\n（你可以在页面任何地方点击右键，选择“查看源代码”来查看演示代码。）\n\n\
