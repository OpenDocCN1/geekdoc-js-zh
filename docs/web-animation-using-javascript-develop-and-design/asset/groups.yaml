    \ section.\n\n# CODE SECTION: CONTAINER ANIMATION\n\n```\n/************************************\n\
    Container animation\n************************************/\n$container\n.css(\"\
    perspective-origin\", screenWidth/2 + \"px\" + \n  screenHeight/2 + \"px\")\n\
