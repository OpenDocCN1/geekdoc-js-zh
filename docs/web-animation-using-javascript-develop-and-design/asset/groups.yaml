  - '[PAGE 144]


    # TECHNIQUE: AVOID AFFECTING NEIGHBORING ELEMENTS


    It''s important to consider the impact of an element''s animation on neighboring
    elements.


    # PROBLEM


    When an element''s dimensions are animated, the changes often affect the positioning
    of nearby elements. For example, if an element between two sibling elements shrinks
    in the width, the siblings'' absolute positions will dynamically change so they
    remain next to the animating element. Another example is animating a child element
    inside a parent element that doesn''t have explicitly defined width and height
    properties. Accordingly, when the child is being animated, the parent will also
    resize itself so that it continues to fully wrap itself around the child. In effect,
    the child element is no longer the only element being animated—the parent''s dimensions
    are also being animated, and that''s even more work for the browser to perform
    upon each tick in an animation loop!


    There are many CSS properties whose modification can result in dimensional and
    positional adjustments to neighboring elements, including top, right, bottom,
    and left; all margin and padding properties; border thickness; and the width and
    height dimensions.


    As a performance-minded developer, you need to appreciate the impact that animating
    properties can have on your page. Always ask yourself how property you''re attempting
    to animate affects nearby elements. If there''s a way to rewrite your code such
    that you can isolate elements'' changes from one another, then consider doing
    so. In fact, there is an easy way to do this—on to the solution!'
