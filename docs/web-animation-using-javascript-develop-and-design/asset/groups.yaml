    # LOOP


    Set the loop option to specify the number of times an animation should alternate
    between the values in the call''s property and map the element''s values prior
    to the call:


    ```

    $element.velocity({ height: "10em" }, { loop: 2 });

    ```


    If the element''s original height was 5em, its height would alternate between
    5em and 10em twice.


    If the begin or complete options are used with a looped call, they are triggered
    once each—at the very beginning and end of the loop sequence, respectively; they
    are not retriggered for each loop iteration.


    Instead of passing an integer, you can also pass in true to trigger infinite looping:


    ```

    $element.velocity({ height: "10em" }, { loop: true });

    ```


    Infinite loops ignore the callback back unless they naturally end. They, however,
    can be manually stopped via Velocity''s stop command:


    ```

    $element.velocity("stop");

    ```


    Non-infinite loops are useful for animation sequences that would otherwise require
    the repetition of chained animation code. For example, if you were to bounce an
    element up and down twice (perhaps to alert the user of a new message awaiting
    them), the non-optimized code would look like this:


    ```

    $element

    // Assume translateY starts at "0px"

    .velocity({ translateY: "100px" })

    .velocity({ translateY: "0px" })

    .velocity({ translateY: "100px" })

    .velocity({ translateY: "0px" });

    ```


    The more compact and easier to maintain version of this code would look like this:


    ```

    // Repeat (loop) this animation twice

    $element.velocity({ translateY: "100px" }, { loop: 2 });

    ```'
  - '[PAGE 40]


    With this optimized version, if you have a change of heart about how much the
    top value should be changed by (currently "100px"), you need only change the top
    value in one part of the code. If there are many instances of repetition in your
    code, it quickly becomes obvious how much looping benefits your workflow.


    Infinite looping is tremendously helpful for loading indicators, which typically
    animate indefinitely until data has finished loading.


    First, make the loading element appear to pulsate by infinitely looping its opacity
    from visible to invisible:


    ```

    // Assume opacity starts at 1 (fully visible)

    $element.velocity({ opacity: 0 }, { loop: true });

    ```


    Later, once the data has finished loading, you can stop the animation, and then
    the element:


    ```

    $element

    // First stop the infinite loop...

    .velocity("stop")

    // ... so you can give the element a new animation,

    // in which you can animate it back to invisibility

    .velocity({ opacity: 0 });

    ```


    # DELAY


    Specify the delay option in milliseconds to insert a pause before an animation
    begins. The delay option''s purpose is to retain an animation''s timing logic
    entirely within Velocity—as opposed to relying on jQuery''s $.delay() function
    to change when a Velocity starts:


    ```

    // Wait 100ms before animating opacity toward 0

    $element.velocity({ opacity: 0 }, { delay: 100 });

    ```


    You can set the delay option with the loop option to create a pause between loop
    alternations:


    ```

    // Loop four times, waiting 100ms between each loop

    $element.velocity({ height: "+=50px" }, { loop: 4, delay: 100 });

    ```'
  - '[PAGE 41]


    # DISPLAY AND VISIBILITY


    Velocity''s display and visibility options correspond directly to their CSS counterparts,
    and accept the same values: "none", "inline", "inline-block", "block", "Flex",
    and so on. In addition, Velocity allows for a value of "auto", which instructs
    Velocity to set the display property to its element''s default value. (For reference,
    anchors and spans default to "inline", whereas divs and most other elements default
    to "block.") Velocity''s visibility option, like its CSS counterpart, accepts
    the "hidden", "visible", and "collapse" values.


    Within Velocity, when the display option is set to "none" (or visibility is set
    to "hidden"), the element''s CSS property is set accordingly the animation has
    completed. This effectively works to hide an element upon completion of an animation,
    and is useful in animating an element''s opacity down to 0 (where the intention
    is to fade an element off the page:


    ```

    // Fade an element to opacity: 0 then remove it from the page''s flow

    $element.velocity({ opacity: 0 }, { display: "none" });

    ```


    > NOTE: The code above effectively replaces the jQuery equivalent:

    $element.animate({ opacity: 0 })

    .hide();


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_41_0.png)


    # QUICK REVIEW OF VISIBILITY AND DISPLAY


    For reference, the CSS display property dictates how an element affects the positioning
    of the elements surrounding it and contained within it. In contrast, the CSS visibility
    property exclusively affects whether an element can be seen. If an element is
    set to "visibility: hidden", it will continue to take up space on the page, but
    its space will be represented by an empty gap—no part of the element will be seen.
    If an element is instead set to "display: none", the element will be fully removed
    from the page''s flow, and all elements within and around it will fill into the
    removed element''s space as if the element never existed.'
  - '[PAGE 42]


    Note that, instead of removing an element from the page''s flow, you can simply
    mark the element as both invisible and non-interactive by setting its visibility
    to "hidden". This is useful for when you want a hidden element to continue taking
    up space on the page:


    ```

    // Fade element to opacity:0 then make it non-interactive

    ```


    ```

    $element.velocity({ opacity: 0 }, { visibility: "hidden" });

    ```


    Now, let''s consider animations in the opposite direction (showing elements instead
    of hiding elements): When display or visibility is set to a value other than "none"
    or "hidden", the value is set **before** the animation begins so the element is
    visible throughout the duration of the ensuing animation. In other words, you''re
    undoing the hiding that occurred when the element was previously removed from
    view.


    Below, display is set to "block" before the element begins fading in:


    ```

    $element.velocity({ opacity: 1 }, { display: "block" });

    ```


    This effectively replaces the jQuery equivalent:


    ```

    $element

    .show()

    .animate({ opacity: 0 });

    ```


    > TIP: For a complete overview of Velocity animation options, consult the documentation
    at VelocityJ5.org.


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_42_0.png)'
  - '[PAGE 43]


    # CONTAINING ANIMATION LOGIC


    As with Velocity''s delay option, Velocity''s incorporation of CSS display and
    visibility setting allows for animation logic to be fully contained within Velocity.
    In production code, whenever an element is faded into or out of view, it''s almost
    always accompanied by a change in display or visibility. Leveraging Velocity shorthands
    like these helps you keep your code clean and maintainable, since it''s less dependent
    on external jQuery functions and free of repetitive helper functions that commonly
    bloat animation logic.


    Note that Velocity includes shorthands for the opacity toggling animations demonstrated
    above. They function identically to jQuery fadeIn and fadeOut functions. You pass
    the corresponding command into Velocity as the first argument, and you pass in
    an options object, if desired, as normal:


    ```

    $element.velocity("fadeIn", { duration: 1000 });

    ```


    ```

    $element.velocity("fadeOut", { duration: 1000 });

    ```'
  - '[PAGE 44]


    # USING VELOCITY: ADDITIONAL FEATURES


    Additional Velocity.js features that are worthy of note include: the reverse command,
    scrolling, colors, and transforms (translation, rotate, and scale).


    # REVERSE COMMAND


    To animate an element back to the values prior to to its last Velocity call, pass
    in "reverse" as Velocity''s first argument. The reverse command behaves identically
    to a standard Velocity call; it can take options and is queued up with other chained
    Velocity calls.


    Reverse defaults to the options (duration, easing, etc.) used in the element''s
    prior Velocity call. However, you can override these options by passing in a new
    options object:


    ```

    // Animate back to the original values using the prior Velocity call''s

    -> options

    $element.velocity("reverse");

    ```


    or


    ```

    // Do the same as above, but replace the prior call''s duration with a

    -> value of 2000ms

    $element.velocity("reverse", { duration: 2000 });

    ```


    > NOTE: The previous call''s begin and complete options are ignored by the reverse
    command; reverse never re-calls callback functions.


    # SCROLLING


    To scroll the browser to the top edge of an element, pass in "scroll" as Velocity''s
    first argument. The scroll command behaves identically to a standard Velocity
    call; it can take options and is queued up with other chained Velocity calls:


    ```

    $element

    .velocity("scroll", { duration: 1000, easing: "spring" })

    .velocity({ opacity: 1 });

    ```'
