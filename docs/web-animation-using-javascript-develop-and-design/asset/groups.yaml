    # OPTIMIZED APPROACH


    Velocity''s UI pack lets you register effects that you can subsequently reuse
    across a site. Once an effect is registered, you can call it by passing its name
    into Velocity as its first parameter:


    ```

    // Assume we registered our effect under the name "growIn"

    $element.velocity("growIn");

    ```


    That''s a lot more expressive, isn''t it? You quickly understand the code''s purpose:
    An element will grow into view. The code remains tense and maintainable.


    What''s more, a registered effect behaves identically to a standard Velocity call;
    you can pass it in an options object as normal and chain any Velocity calls onto
    it:


    ```

    $element

    // Scroll the element into view

    .velocity("scroll")

    // Then trigger the "growIn" effect on it, with the following settings

    .velocity("growIn", { duration: 1000, delay: 200 })

    ```


    If UI pack is loaded onto your page, an effect such as this is registered using
    the following syntax:


    ```

    $.Velocity.RegisterEffect(name, {

    // Default duration value if one isn''t passed into the call

    defaultDuration: duration,

    // The following Velocity calls occur one after another,

    → with each taking up

    a predefined percentage of the effect''s total duration

    calls: [

    [ propertiesObject, durationPercentage, optionsObject ],

    [ propertiesObject, durationPercentage, optionsObject ]

    ],

    reset: resetPropertiesObject

    });

    ```'
  - '[PAGE 85]


    Let’s break down this template by step:


    +   1. The first argument is the name of the effect. If the effect is responsible
    for bringing an element into view (as in, it fades an element’s opacity from o
    to 1), it’s important to suffix the effect with “In”.


    +   2. The second argument is an object that defines the effect’s behavior. The
    first property in this object is defaultDuration, which lets you specify the duration
    that the effect should take if one is not passed into the Velocity call that triggers
    the effect.


    +   3. The next property in the object is calls array, which consists of the Velocity
    calls that constitute the effect (in the order that they should occur). Each of
    these array items is an array itself, which consists of the calls properties object,
    followed by the optional percentage of the total duration that call should consume
    (decimal value that defaults to 1.00), followed by an optional options object
    for that specific call. Note that Velocity calls specified within the calls array
    count only the easing and delay options.


    +   4. Finally, you have the option of passing in a reset object. The reset object
    is specified using the same syntax as a standard Velocity properties map object,
    but it is used to enact an immediate value change upon completion of the full
    effect. It is useful when you’re animating the opacity and scale properties of
    an element down to o (out of view), but want to return the element’s scale property
    to 1 after the element is hidden so that subsequent effects needn’t worry about
    the properties beyond opacity they must reset on the element for their calls to
    properly take effect. In other words, you can leverage the reset properties map
    to make effects selfcontained, such that they leave no clean duties on the target
    elements.


    In addition to the reset object, another powerful bonus of the UI pack’s effect
    registration is automatic display property toggling. When an element begins animating
    view, you want to ensure its display value is set to a value other than “none”
    so the element is visible throughout the course of its animation. (Remember, display:
    none removes an element from the page’s flow.) Conversely, when fading an element
    out, you want to ensure its display value is switched to “none” once its opacity
    hits o. This way, you remove all traces of the element when you’re done using
    it.


    Using jQuery, display toggling is accomplished by chaining the show() and hide()
    helper functions onto animations (oftentimes buried within nested callbacks).
    With Velocity’s UI pack, however, this logic is taken care of automatically when
    you fix your effect names with “In” and “Out” as appropriate.'
