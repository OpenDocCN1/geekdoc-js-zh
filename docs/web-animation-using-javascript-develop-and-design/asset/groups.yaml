  - '[PAGE 122]


    # SUPPORT FOR SVG


    Out-of-the-box support for SVG element animation isn’t great: neither jQuery nor
    CSS offers complete support for animating SVG-specific SVG styling properties
    and present attributes. Further, CSS transitions can’t animate SVG elements at
    all on Internet Explorer 9, and CSS can’t be used to apply transform animations
    to SVG elements on any version of Internet Explorer.


    To gain comprehensive SVG animation support, use either a dedicated SVG library
    or an animation library that has built-in support for SVG elements. One noteworthy
    dedicated SVG library is Snap.svg. It probably won’t surprise you to learn that
    Velocity, js, the JavaScript animation library you’ve been using throughout this
    book, provides full support for SVG element animation.


    > NOTE: Go to SnapSVG.io to download the Snap.svg library.'
  - '[PAGE 123]


    # SVG ANIMATION


    SVG elements might never be the backbone of your UI, but they’re certainly appropriate
    for spicing up the parts of your page that you’d normally fill with static images.
    Uses for SVGs include:


    +   - Buttons with intricate animation sequences that are triggered when users
    hover and click.

    - Unique loading status graphics that replace the all-to-common rotating indicator
    GIF.

    - Company logos whose individual parts animate together upon page load.


    This last use case is explored in more detail later in this chapter.


    # PASSING IN PROPERTIES


    With Velocity, SVG properties are animated in the same way that standard CSS properties
    are. Pass the appropriate properties and their desired end values into Velocity’s
    properties object:


    ```

    // Animate an SVG element to a red fill and a black stroke

    $svgElement.velocity({ fill: "#ff0000", stroke: "#000000" });

    ```


    In contrast, note that the code below would not work since the following CSS properties
    are not supported by SVG elements:


    ```

    // Incorrect: These properties don''t apply to SVG elements

    $svgElement.velocity({ border: "5px", borderColor: "#000000" });

    ```'
  - "[PAGE 124]\n\n# PRESENTATIONAL ATTRIBUTES\n\nThe presentational attributes explored\
    \ earlier in this chapter are also animated as expected:\n\n```\n// Animate the\
    \ x and y coordinates of a rectangle\n$(\"rect\").velocity({ x: 100, y: 100 });\n\
    // Animate the cx and cy coordinates of a circle\n$(\"circle\").velocity({ cx:\
    \ 100, cy: 100 });\n// Animate the dimensions of a rectangle\n$(\"rect\").velocity({\
    \ width: 200, height: 200 });\n// Animate the radius of a circle\n$(\"circ\").velocity({\
    \ r: 100 });\n```\n\nAll the Velocity attributes features that you're currently\
    \ using—animation reversal, UI pack effects, sequence triggering, and so on—work\
    \ as expected with SVG elements.\n\n# POSITIONAL ATTRIBUTES VS. TRANSFORMS\n\n\
    You might be wondering what the difference is between using the x, y, and y positional\
    \ attributes instead of CSS transforms (e.g. translateX, translate) when specifying\
    \ the positions of SVG elements. The answer is browser support. Internet Explorer\
    \ (up to including Internet Explorer 11) does not support CSS transforms on SVG\
    \ elements. Consider the following:\n\n+   - The x and y attributes work everywhere\
    \ SVG elements do\n- (IE8+, Android 3+)\n$(\"rect\").velocity({ x: 100, y: 100\
    \ });\n- Alternatively, positional transforms (such as translateX and translateY)\n\
    \ work everywhere *except* Internet Explorer\n$(\"rect\").velocity({ translateX:\
    \ 100, translateY: 100 });\n\n> NOTE: Although transforms are known to be particularly\
    \ performant due to hardware acceleration (read more on this in Chapter 7, \"\
    Animation Performance\"), both approaches to SVG animation are equally fast since\
    \ SVG graphics are hardware-accelerated by default.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_124_0.png)"
