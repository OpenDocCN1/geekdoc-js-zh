  - '[PAGE 114]


    # WRAPPING UP


    This is just the beginning of the possibilities created by granular text control.
    Other techniques include fine-tuning the coordinates of every letter in a word
    to produce a collage effect, or placing words around the circumference of a circle
    to mimic the typographic design you might find on a drink coaster.


    While these techniques may be well-suited for bold homepage centerpieces, they
    may not be appropriate for critical parts of your UI that are subject to repeated
    user interaction. Why? Because stylized text is harder to read at a glance than
    unstylized text. But if you consider the balance between form and function, you''ll
    be fine.'
