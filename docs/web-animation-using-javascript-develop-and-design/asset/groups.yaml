    Let's begin the first of the two animation sections of the codebase by focusing\
    \ on the element that contains the circle elements. Before diving into the code,\
    \ however, here's a primer on how 3D animation works in the browser:\n\nIn order\
    \ for 3D transforms to work (for example, translateZ, rotateX, rotateY), the CSS\
    \ requires that the perspective CSS property be set on the element's parent. In\
    \ this case, that's what the $container element is for.\n\nThe greater the value\
    \ that perspective is set to, the less distance Z-axis translations (via CSS's\
    \ translateZ) appear to move relative to their origin. In other words, if you\
    \ want more exaggerated depth in your 3D animations, set the element's perspective\
    \ property to something low, like 50px, which is in fact the value that the container\
    \ element is set to in the demo's CSS. In contrast, a higher perspective value,\
    \ such as 250px, would result in less visible movement from the origin point for\
    \ every pixel that the element's translateZ property is incremented by."
  - "[PAGE 171]\n\nA separate and complementary CSS property prospective-origin, which\
    \ defines the angle at which the virtual camera is positioned. The virtual camera\
    \ is the peehole through which the viewer sees 3D animation unfold in the browser.\
    \ This section's code block uses jQuery's .css() function to set a prospective-origin\
    \ value on the container element that results in the camera being positioned at\
    \ the center of the page, creating a perpendicular view of the 3D animation. This\
    \ perpendicular view results in the appearance of circles flying directly toward\
    \ and away from the viewer.\n\nSpecifically, this code section sets perspective-origin\
    \ to the point on the page that's half the browser's height and half its width—the\
    \ center point of the page. This leverages the window dimensions queried in the\
    \ Animation setup section.\n\nWith that context out of the way, let's explore\
    \ this section's code.\n\n# PROPERTIES\n\nThis section's code, reproduced below\
    \ for easy reference, creates the demo's zooming in and out effect:\n\n$container\n\
    \n```\n.css(\"perspective-origin\", screenWidth/2 + \"px \" +\nscreenHeight/2\
    \ + \"px\")\nvelocity(\n{\n  perspective: [ 215, 50 ],\n  opacity: [ 0.90, 0.55\
    \ ]\n},\n  duration: 800,\n  loop: 1,\n  delay: 3250\n});\n```\n\nWhile the prospective-origin\
    \ property is set on the container element and thereafter left alone, the prospective\
    \ property is being animated by Velocity. This is necessary because the intended\
    \ effect of the demo is to keep the vantage point into the scene stationary (perpendicular),\
    \ but to exaggerate then de-exaggerate the distance of the elements from the virtual\
    \ camera, which is where the prospective property's animation comes in."
  - '[PAGE 172]


    Specifically, this section uses Velocity to animate the perspective CSS property
    to a final value of 215px from a starting value of 50px.


    By passing in an array as an animation property''s value, you''re forcefully specifying
    the final value to animate the *toward* (215px, in the case above) as well as
    the initial value to animate *from* (50px, in the case above). While you could
    de have passed the property a single integer value which is typically expected
    by Velocity, the force-feeding syntax provides increased control over the property''s
    complete animation path.


    You might be wondering, isn''t force-feeding unnecessary since Velocity knows
    how to retrieve a CSS property''s starting value on its own? While that is Velocity''s
    standard behavior when an integer is passed as a value instead of an array, this
    isn''t always a desirable behavior due to the performance drawbacks inherent in
    querying the DOM for a property''s starting value. What the force-feeding technique
    allows you to do is explicitly pass a starting value so Velocity can avoid querying
    the DOM for a. In other words, the 50px starting value used in the perspective
    code is the same as the value you initially set the element''s perspective property
    to in the CSS stylesheet. You''re simply repeating the value here. Notice that
    this force-feeding technique is used on the element''s opacity property as well;
    it''s animated to a final value of 0.90 from a starting value of 0.55 since that''s
    what the property was set to in the CSS.


    As discussed thoroughly in Chapter 7, "Animation Performance," DOM queries are
    indeed the Achilles'' heel of performant animation: the browser performs resource-intensive
    calculations to determine the visual state of an element. While it''s not important
    to the demo''s performance that you include this performance optimization, since
    the associated Velocity animation isn''t being triggered inside a loop, it''s
    included nonetheless to contrast force-feeding''s secondary use, which you''ll
    learn about in this chapter.


    The net effect of animating the perspective and opacity is that all of the container''s
    circle elements appear to zoom in closer to the virtual camera while animating
    to an increased brightness (opacity goes from 0.55 to 0.90). The opacity mimics
    the way that light behaves in the real world: the closer we is to the objects,
    the brighter they appear!'
  - '[PAGE 173]


    # OPTIONS


    The final section of Container animation code includes the options being passed
    into Velocity: duration, which is self-explanatory; delay, which inserts a time-out
    at the start of the animation, and loop, which loops an animation back and forth
    between the values defined in the properties map and the element’s values prior
    to the animation occurring. Specifically, by setting loop to 2, you''re telling
    Velocity to animate to the values in properties map, back to where they were before,
    then to repeat this full loop iteration once more after a 3000ms delay.


    > NOTE: When delay is set alongside loop, the delay occurs between each of the
    loop''s alternations. Using delay creates a pleasant pause so that the zoom-in
