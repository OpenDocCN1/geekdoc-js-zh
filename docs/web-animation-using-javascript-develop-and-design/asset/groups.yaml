  mdcn: '

    其次，如果你的 UI 一次性加载了许多图像（例如八张或更多，取决于你设备的硬件能力），请考虑完全不对这些图像进行动画处理，而是简单地切换每张图像的可见性（从不可见变为可见）。为了弥补这种做法可能看起来很拙劣的，可以考虑交错显示，让图像一个接一个加载，而不是同时加载。这将有助于用户的视线追踪整个加载序列，并且通常会带来更精细的动态设计。


    > 注意：请参考第 3 章《动效设计理论》（*Motion Design Theory）以了解更多关于动画设计的最佳实践。


    ## 隐蔽的图像


    你还没有结束。这一节的内容比表面看到的要得多，因为我们还没有充分探索图像在页面上呈现的方式。显而易见的罪祸首是 `img` 元素，但还有两种方式可以让图像“悄悄”进入你的页面。


    ## CSS 渐变


    这些实际上是图像的一种。它们不是由照片编辑器预先制作的，而是根据 CSS 样式定义在运行时生成的，例如，使用 `linear-gradient()` 作为元素的
    `background-image`。这里的解决方案是尽可能选择纯色背景而非渐变。浏览器可以轻松优化纯色块的渲染，但对于图像，它们必须加班渲染渐变，因为渐变在像素之间是不同的。


    ## 阴影属性


    渐变的双胞胎兄弟是 `box-shadow` 和 `text-shadow` CSS 属性。它们的渲染方式与渐变类似，但它们不是修饰 `background-color`，而是有效地修饰
    `border-color`。此外，它们具有透明度衰减，需要浏览器执行额外的合成工作，因为渐变的半透明必须相对于动画元素下的元素进行渲染。这里的解决方案与之前类似：如果你从样式表中移除这些
    CSS 属性后，你的 UI 看起来已经很不错了，那么给自己拍拍掌吧，永远不要回头。你网站的性能会告诉你答案。


    这些建议仅仅是建议。它们并不是最佳实践，因为它们为了提高性能牺牲了你的设计意图。只有当你的网站性能不佳且用尽了所有其他选项时，才将它们视为最后的手段。


    ## 技术：在旧版浏览器上降级动画


    你不必忽视对性能不佳浏览器和设备的支持。如果你从第一天起就采用性能优先的工作流，就可以为它们提供一种降级但完全可用的体验。


    ## 问题


    Internet Explorer 8——一个缓慢、过时的浏览器——正在逐渐失去流行。但其继任者 Internet Explorer 9 在美洲以外地区被广泛使用。此外，运行
    Android 2.3 及以下版本的旧版 Android 智能手机相对于最新一代的 Android 和 iOS 设备也非常缓慢，但仍然非常受欢迎。在你网站的每个用户中，预计会有多达三分之一的用户落入这两个小组之一（取决于你的应用吸引什么类型的用户）。因此，如果你的网站富含动画和其他
    UI 交互，请假设多达三分之一的用户体验性能会特别糟糕。


    ## 解决方案


    解决弱势设备引起的性能问题有两种方法：要么在整个网站范围内广泛减少动画的出现次数，要么专门针对弱势设备减少动画。前者根结底是一个产品决策，但如果你使用了在第
    4 章“动画工作流”中解释的全局动画倍数技术（或 Velocity 的等效模拟功能），后者则是一个易于实现的简单技术决策。全局倍数技术允许你通过设置单个变量来动态更改整个网站动画的时机。这里的技巧是——每当检测到较弱的浏览器时——将倍数设置为
    0（或设置为 `$.Velocity.mock`），以便页面上的所有动画都在单个动画帧内完成（少于 16ms）：


    ```

    // 让所有动画立即完成

    $.Velocity.mock = true;

    ```


    这种技术的结果是，弱势设备经历的 UI 动画会降级，使得即时样式变化取代了你的动画过渡。其益处是巨大的：你的 UI 运行将明显更加流畅，因为页面上不会发生资源密集型的动画。虽然这种技术无疑是破坏性的（它损害了你的动效设计意图），但可用性的提升总是比牺牲优雅性值得的。毕竟，用户访问你的应用是为了完成特定目标，而不是为了欣赏你的
    UI 设计有多么聪明。永远不要让动画阻碍用户的意图。


    如果你仍然对从 UI 中剥离动画的想法感到反感，请记住，弱势设备上的用户已经习惯了网站运行缓慢。因此，如果你的网站以一种建设性的方式反潮流而行，他们会感到特别惊喜，并更有可能继续使用。


    ## 尽早发现你的性能阈值


    接上一个技术，值得强调的是，本章的建议对移动设备特别适用，许多设备相对于桌面电脑来说很慢。遗憾的是，我们作为开发者，往往在工作流中没有考虑到这一点：我们通常在高端桌面电脑的完美运行环境中创建网站，而这些电脑可能运行着目前最新的硬件和软件。这种环境与用户的真实环境脱节的，用户往往不是在使用过时的硬件和软件，而是倾向于同时运行许多应用和浏览器标签。换句话说，我们大多数人的开发环境都是非代表性的高性能环境！这种疏忽的副作用是，你的应用对大部分用户来说可能会明显卡顿。当你询问什么让他们感到沮丧时，他们可能已经失去了使用的兴趣。


    对于性能优先的开发者来说，正确的方法是在开发周期早期确定性能阈值。在开发应用时，经常在参考设备上检查其性能。如果你在早期就设定了高性能的目标，就可以安心睡觉，因为知道所有新设备都会为你的用户提供更好的性能。


    > 提示：如果你是 Mac 用户，请访问微软的 Modern.ie 网站获取如何运行免费版 Internet Explorer 的信息。


    如果你发现参考设备太弱，无法支持你坚持应用拥有的动态设计，请遵循上一个技术的建议：在该参考设备上优雅地降级动画。


    对于每个测试设备，记住同时打开几个应用和标签页，以模拟用户的环境。永远不要在只运行你自己的真空环境中进行测试。


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_155_0.png)


    记住，远程浏览器测试（通过如 BrowserStack.com 和 SauceLabs.com 等服务）与现场参考设备测试不同。远程测试服务适用于测试 Bug
    和 UI 响应式——而不是用于动画性能。毕竟，运行在云端的测试设备没有使用真实的硬件——它们是设备的仿真版本。因此，它们的性能通常与现实世界的对应物不同。此外，虚拟机上发生的情况与浏览器窗口中显示的内容之间的延迟时间太长，无法获得意义的
    UI 动画性能衡量。


    简而言之，你需要出去购买真实的设备进行性能测试。即使你是一个资金紧张的开发者，也不要跳过这一步。你在测试设备上花费的几百美元将通过由于用户更频繁地使用你丝滑的应用而带来的经常性收入所抵消。


    > 注意：访问 Vanamco.com 并下载设备实验室（Device Lab）。


    '
