  - "[PAGE 71]\n\n# WHEN CSS MAKES SENSE\n\nIt's important to point out a situation\
    \ in which you should be using CSS rather than JavaScript for UI animation: when\
    \ animating simple style changes triggered by a user hovering over an element.\
    \ CSS transitions lend themselves beautifully to these types of micro-interactions,\
    \ allowing you to accomplish the task in just a few lines of very maintainable\
    \ code.\n\nWorking in CSS, you first define a transition on the target element\
    \ so that changes in the specified CSS properties animate over a predetermined\
    \ duration:\n\n```\n/* When this div's color property is modified, animate its\
    \ change over\n→ duration of 200ms */\ndiv {\n  transition: color 200ms;\n}\n\
    ```\n\nYou then specify the value that each CSS property should change toward,\
    \ per the transition rule. In the case of the example, the div's text color will\
    \ change to blue when the user hovers over it:\n\n```\ndiv:hover {\n  color: blue;\n\
    }\n```\n\nThat's it. In only a few lines of code, CSS handles interaction state\
    \ for: when the user hovers away from the div, CSS will animate the change from\
    \ blue back to the preexisting text color over a duration of 200ms.\n\n# WHAT\
    \ DOES GOOD CODE LOOK LIKE?\n\nGood code is expressive, meaning that its purpose\
    \ is easy to grasp. This is crucial not for coworkers attempting to integrate\
    \ your foreign code, but also for yourself in the future, once you've forgotten\
    \ your original approach. Good code is also terse, meaning that it accomplishes\
    \ what it needs to in as few lines as possible; every line serves an important\
    \ purpose, and it can't be rewritten again. Lastly, good code is maintainable,\
    \ meaning that its individual parts can be updated without fear of compromising\
    \ the integrity of the whole."
  - "[PAGE 72]\n\nIn contrast, coding this same effect in jQuery would entail the\
    \ following:\n\n```\n$div\n```\n\n```\n// Register a mouseover event on this div,\
    \ which calls an animation\n-> function\n.on(\"mouseover\", function() {\n  $(this).animate({\
    \ color: \"blue\" }, 200);\n}\n// When the user hovers over the element, animate\
    \ the text color back\n-> to black\n.on(\"mouseout\", function() {\n  // Note:\
    \ We have to remember what the original property value\n  -> was(black)\n  $(this).animate({\
    \ color: \"black\" }, 200);\n});\n```\n\nThis might not look so bad, but the code\
    \ isn't taking advantage of the fact that JavaScript provides an infinite amount\
    \ of logical control. It goes out of its way to do something that CSS is designed\
    \ for: triggering logicless animations that occur on the same element that the\
    \ user is interacting with. Above, you're doing in JavaScript what you could have\
    \ done in fewer, more expressive, and more maintainable lines of CSS. Even worse,\
    \ you're not getting any additional feature benefits by implementing this functionality\
    \ in JavaScript.\n\nIn short, if you easily use CSS transitions to animate an\
    \ element that's never being animated by JavaScript (meaning there's no potential\
    \ for conflict), then you should code that animation in CSS. For all other UI\
    \ animation tasks—multi-element and multistep sequences, interactive drag animations,\
    \ and much more—JavaScript animation is the superior solution.\n\nLet's explore\
    \ the fantastic workflow techniques JavaScript provides."
  - '[PAGE 73]


    # CODE TECHNIQUE: SEPARATE STYLING

    FROM LOGIC


    The first technique has profound workflow benefits, especially for teams.


    # STANDARD APPROACH


    In jQuery animation, it''s common to animate CSS classes onto elements using the
    UI

    add-on plugin (jQueryUI.com). When the module is loaded, jQuery''s addClass()
    and

    removeClass() functions are upgraded with animation support. For example, let''s

    you have a CSS class defined in a stylesheet as:


    ```

    .fadeInAndMove {

    opacity: 1;

    top: 50px;

    }

    ```


    You can then animate the CSS properties of that class (opacity and top in this
    case)

    to the target element along with a specified duration:


    ```

    // Animate the properties of the .fadeInAndMove class over a

    → 1000ms duration

    element.addClass("fadeInAndMove", 1000);

    ```


    The most common implementation of jQuery animation consists of inclining the

    desired animation motion within an $.animate() call, which uses the syntax

    demonstrated in Chapter 1, (Advantages of JavaScript Animation):


    ```

    $element.animate({ opacity: 1, top: 50 }; 1000);

    ```


    Both implementations produce the same result. The difference is that separation
    of

    logic: The first implementation delegates the styling rules to a CSS stylesheet,
    where

    the rest of the page''s styling rules reside. The second mixes styling rules with
    the JavaScript

    logic responsible for triggering them.


    The first approach is preferable due to the organizational cleanliness and flexibility

    gained by knowing where to look to make the appropriate style or logic changes
    for

    code. CSS stylesheets exist for a reason; seasoned developers do not inline CSS
    into

    their HTML. That would conflate of HTML (structure) and CSS (styling),

    and make a site considerably more difficult to maintain.'
  - "[PAGE 74]\n\nThe value of logic separation is further pronounced when working\
    \ in a team environment, in which it's common for developers and designers to\
    \ bump heads while trying to edit the same file at the same time.\n\n# OPTIMIZED\
    \ APPROACH\n\nWith the review of standard methods out of the way, let's look at\
    \ the optimized approach. It's just as beneficial—and often the best methodology\
    \ for JavaScript-centric animation workflows—to shift animation logic into a dedicated\
    \ JavaScript file (for example, a style.js) rather than a dedicated CSS stylesheet.\
    \ Sounds weird, right? Perhaps, but it works brilliantly. This technique leverages\
    \ plain old JavaScript objects to help you organize your animation code.\n\nFor\
    \ example, your style.js file might look like this:\n\n```\n// This object is\
    \ a parallel to the CSS class defined in the previous\nvar fadeIn = {\n  opacity:\
    \ 1,\n  top: \"50px\"\n}\n```\n\nIn your script.js, which is the primary JavaScript\
    \ file that controls animation logic, you would then have:\n\n```\n// Pass our\
    \ named properties object into Velocity\n$element.velocity(fadeIn, 1000);\n```\n\
    \nTo recap, in your style.js, you've defined a JavaScript object's populated with\
    \ the CSS properties you want to animate. This is the same object that's then\
    \ passed into Velocity as a first argument. You're not doing anything here—just\
    \ saving objects to named variables, then passing those variables into Velocity\
    \ instead of the raw objects themselves.\n\n> NOTE: This technique works well\
    \ equally with jQuery's animate() function."
  - '[PAGE 75]


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_75_0.png)'
  - "[PAGE 76]\n\nThe benefit of switching from CSS to JavaScript segregate logic\
    \ is that your style.js file is uniquely capable of defining animation options—not\
    \ just animation properties. There are many ways to specify an option: one is\
    \ assign two member properties to a parent animation object which you assign an\
    \ expressive name. The first property on the object defines the animation's properties;\
    \ the second defines its options.\n\nIn this case, your style.js file would look\
    \ like this:\n\n```\nvar fadeIn = {\n  // p is for \"properties\"\n  p: {\n  \
    \  opacity: 1,\n    top: \"50px\"\n  },\n  // o is for \"options\"\n  o: {\n \
    \   duration: 1000,\n    easing: \"linear\"\n  }\n}\n```\n\nIn the script.js file,\
    \ you'd have:\n\n// Pass in our clean and re-usable animation objects\n$element.velocity(fadeIn.p,\
    \ fadeIn.o);\n\nPretty and clean, right? Someone skimming it would understand\
    \ its purpose, and would know where to look to modify its properties—the style.js\
    \ file. Further, the purpose of this animation is immediately evident: you've\
    \ named the animation object appropriately, you know that the code serves to fade\
    \ an object into view. You no longer have to mentally parse animation properties\
    \ to assess the purpose of the animation.\n\nThis approach discourages you from\
    \ arbitrarily setting options for each individual animation on a page since there's\
    \ now a bank of premade animation objects you can easily pull from. This results\
    \ in leaner code and more consistent motion design. Consistency, as you learned\
    \ in the previous chapter, is a key component of great UX."
- md: "\nBut the best part is that this approach lends itself perfectly to organizing\
    \ your animation variations together. For example, if you typically fade button\
    \ elements into view with a duration of 100ms, but you fade modal windows into\
    \ view with a duration of 300ms, you can simply split your object into two appropriately\
    \ named variations:\n\n```javascript\nvar fadeIn = {\n  p: {\n    opacity: 1,\n\
    \    top: \"50px\"\n  },\n  // Options object variation #1 uses a fast duration\n\
    \  oFast: {\n    duration: 1000,\n    easing: \"linear\"\n  },\n  // Variation\
    \ #2 uses a slower duration\n  oSlow: {\n    duration: 3000,\n    easing: \"linear\"\
    \n  }\n};\n// Animate using the fast duration.\n$button.velocity(fadeIn.p, fadeIn.oFast);\n\
    /* Animate using the slow duration. */\n$modal.velocity(fadeIn.p, fadeIn.oSlow);\n\
    ```\n\nAlternatively, you could nest “fast” and “slow” objects as children of\
    \ a singular options object. The choice of which implementation to use is based\
    \ on your personal preference:\n\n```javascript\nvar fadeIn = {\n  p: {\n    opacity:\
    \ 1,\n    top: \"50px\"\n  },\n  o: {\n    fast: {\n      duration: 1000,\n  \
    \    easing: \"linear\"\n    },\n    slow: {\n      duration: 3000,\n      easing:\
    \ \"linear\"\n    }\n  }\n};\n// Animate using the fast duration.\n$button.animate(fadeIn.p,\
    \ fadeIn.o.fast);\n/* Animate using the slow duration. */\n$modal.velocity(fadeIn.p,\
    \ fadeIn.o.slow);\n```\n\nIf this seems like too much overhead, and if you have\
    \ enough lines of JavaScript to justify simply inlining all your animation logic,\
    \ then don't feel like a bad developer for skipping this approach altogether.\
    \ You should always use degree of abstraction that best suits the scope of your\
    \ project. The takeaway here is simply that animation workflow best practices\
    \ do exist if you find yourself needing them.\n\n# CODE TECHNIQUE: ORGANIZE SEQUENCED\
    \ ANIMATIONS\n\nVelocity has a small add-on plugin called the UI pack (get it\
    \ at VelocityJS.org/#uiPack). It enhances Velocity with features that greatly\
    \ improve the UI animation workflow. Many of the techniques in this chapter, including\
    \ the one discussed below, make use of it.\n\nTo install the UI pack, simply include\
    \ a <script> tag for Velocity and before the ending </body> tag of your page:\n\
    \n```html\n<script src=\"velocity.js\"></script>\n<script src=\"velocity.ui.js\"\
    ></script>\n```\n\nThe specific UI pack feature discussed in this section is sequence\
    \ running. It will forever change your animation workflow. It is the solution\
    \ to messily nested animation code.\n\n# STANDARD APPROACH\n\nWithout the UI pack,\
    \ the standard approach to consecutively animating separate elements is as follows:\n\
    \n```javascript\n// Animate element1 followed by element2 followed by element3\n\
    $element1.velocity({ translateX: 100, opacity: 1 }, 1000, function() {\n  $element2.velocity({\
    \ translateX: 200, opacity: 1 }, 1000, function() {\n    $element3.velocity({\
    \ translateX: 300, opacity: 1 }, 1000);\n  });\n});\n```\n\nDon't let this simple\
    \ example fool you: in real-world production code, animation sequences include\
    \ many more properties, many more options, and many more levels of nesting than\
    \ are demonstrated here. Code like this most commonly appears in loading sequences\
    \ (when a page or a subsection first loads in) that consist of multiple elements\
    \ animating into place.\n\nNote that the code shown above is different from chaining\
    \ multiple animations onto the same element, which is hassle-free and doesn't\
    \ require nesting.\n\n```javascript\n// Chain multiple animations onto the same\
    \ element\n$element1\n  .velocity({ translateX: 100 })\n  .velocity({ translateY:\
    \ 100 })\n  .velocity({ translateZ: 100 });\n```\n\nSo what is wrong with first\
    \ code sample (the one with different elements)? Here are the main issues:\n\n\
    - The code bloats horizontally very quickly with each level of nesting, making\
    \ it increasingly difficult to modify the code within your IDE.\n- You can't easily\
    \ rearrange the order of classes in the overall sequence (doing so requires very\
    \ delicate copying and pasting).\n- You can't easily indicate that certain cells\
    \ should run parallel to one another. Let's say that halfway through the overall\
    \ sequence you want to move slides into view from different origin points. When\
    \ coding in this, it wouldn't be obvious how to nest animations that occur after\
    \ this parallel mini-sequence such that the overall sequence doesn't become even\
    \ more difficult to maintain than it already is.\n\n# OPTIMIZED APPROACH\n\nBefore\
    \ you learn about the beautiful solution to this problem, it's important to understand\
    \ two simple features of Velocity. First, know that Velocity accepts multiple\
    \ syntaxes: the most common, when Velocity is invoked on a jQuery element object\
    \ (like all the code examples shown so far), consists of a properties object followed\
    \ by an options:\n\n```javascript\n// The argument syntax used thus far\n$element.velocity({\
    \ opacity: 1, top: \"50px\" }, { duration: 1000, easing: \"linear\" });\n```\n\
    \nAn alternative syntax pairs with Velocity's utility function, which is the fancy\
    \ name given to animating elements using the base Velocity object instead of chaining\
    \ off of a jQuery element object. Here's what animating off the base Velocity\
    \ object looks like:\n\n- Velocity registers itself on jQuery's $ object, which\
    \ you leverage over.\n```javascript\n$.Velocity({ e: $element, p: { opacity: 1,\
    \ scale: 1 }, o: { duration: 1000, easing: \"linear\" } });\n```\n\nAs shown above,\
    \ this alternative syntax consists of passing Velocity a single object that contains\
    \ member objects that map to each of the standard Velocity arguments (elements,\
    \ properties, and options). For the sake of brevity, the member object names are\
    \ truncated to the first letter of their associated objects (e for elements, p\
    \ for properties, and o for options).\n\nFurther, note that you're now passing\
    \ the target element as an argument to Velocity since you're no longer invoking\
    \ Velocity directly on the element. The net effect is exactly the same as the\
    \ syntax you used earlier.\n\nAs you can see, the new syntax isn't much bulkier,\
    \ but it's equally—if not more—expressive. Armed with this new syntax, you're\
    \ ready to learn how the UI pack's sequence-running feature works: you simply\
    \ create an array of Velocity calls, with each defined using the single-object\
    \ syntax. You then pass the entire array into a special function that fires the\
    \ sequences successfully.\n\n```javascript\n// Create the array of Velocity calls\n\
    var loadingSequence = {\n  e: $element1, p: { translateX: 100, opacity: 1 }, o:\
    \ { duration: 1000 },\n  e: $element2, p: { translateX: 200, opacity: 1 }, o:\
    \ { duration: 1000, sequenceQueue: false },\n  e: $element3, p: { translateX:\
    \ 300, opacity: 1 }, o: { duration: 1000 }\n};\n\n// Pass the array into $.Velocity.RunSequence\
    \ to kick off the sequence\n$.Velocity.RunSequence(loadingSequence);\n```\n\n\
    The benefits here are clear:\n\n- You can easily reorder animations in the overall\
    \ sequence without fear of breaking nested code.\n- You can quickly eyeball the\
    \ difference between properties and options objects across the calls.\n- Your\
    \ code is highly legible and expressive.\n\nIf you combine this technique with\
    \ the previous technique (turning CSS classes into JavaScript objects), your animation\
    \ code starts to look remarkably elegant:\n\n```javascript\n$.Velocity.RunSequence([\n\
    \  e: $element1, p: { translateX: 100, opacity: 1 }, o: { duration: 1000 },\n\
    \  e: $element2, p: { translateX: 200, opacity: 1 }, o: { duration: 1000, sequenceQueue:\
    \ false },\n  e: $element3, p: { translateX: 300, opacity: 1 }, o: { duration:\
    \ 1000 }\n]);\n```\n\nExpressiveness and maintainability aren't the only benefits\
    \ to sequence running: you also gain the ability to run individual calls in parallel\
    \ using a special sequenceQueue option, when set to false, forces the associated\
    \ call to run parallel to the call that came before it. This lets you have multiple\
    \ elements animate into view simultaneously, normally have to be orchestrated\
    \ through messy callback nesting. Refer to the inlined comments below for details:\n\
    \n```javascript\n$.Velocity.RunSequence([\n  elements: $element1, properties:\
    \ { translateX: 100 }, options: { duration: 1000 },\n  // The following call will\
    \ start at the same time as the first\n  // call since it uses the `sequenceQueue:\
    \ false` option\n  elements: $element2, properties: { translateX: 200 }, options:\
    \ { duration: 1000, sequenceQueue: false },\n  // As normal, the call below will\
    \ run once the second call has completed\n  elements: $element3, properties: {\
    \ translateX: 300 }, options: { duration: 1000 }\n]);\n```\n"
  mdcn: "\n但最棒的部分是，这种方法非常适合将你的动画变体组织在一起。例如，如果你通常使用 100ms 的持续时间让按钮元素淡入，但使用 300ms 的持续时间让模态窗口淡入，你只需将你的对象拆分为两个命名合适的变体即可：\n\
    \n```javascript\nvar fadeIn = {\n  p: {\n    opacity: 1,\n    top: \"50px\"\n\
    \  },\n  // 选项对象变体 #1 使用快速持续\n  oFast: {\n    duration: 1000,\n    easing: \"\
    linear\"\n  },\n  // 变体 #2 使用较慢持续\n  oSlow: {\n    duration: 3000,\n    easing:\
    \ \"linear\"\n  }\n};\n// 使用快速持续执行动画。\n$button.velocity(fadeIn.p, fadeIn.oFast);\n\
    /* 使用慢持续执行动画。 */\n$modal.velocity(fadeIn.p, fadeIn.oSlow);\n```\n\n或者，你也可以将“快”和“慢”对象嵌套为单个选项对象的子对象。使用哪种实现取决于你的个人喜好：\n\
    \n```javascript\nvar fadeIn = {\n  p: {\n    opacity: 1,\n    top: \"50px\"\n\
    \  },\n  o: {\n    fast: {\n      duration: 1000,\n      easing: \"linear\"\n\
    \    },\n    slow: {\n      duration: 3000,\n      easing: \"linear\"\n    }\n\
    \  }\n};\n// 使用快速持续执行动画。\n$button.animate(fadeIn.p, fadeIn.o.fast);\n/* 使用慢持续执行动画。\
    \ */\n$modal.velocity(fadeIn.p, fadeIn.o.slow);\n```\n\n如果你觉得这开销太大，而且如果你有足够的 JavaScript\
    \ 代码来证明让直接内联所有的动画逻辑是合理的，那么完全不必因为跳过这种方法而觉得自己是一个糟糕的开发者。你应该始终使用最适合项目范围的抽象程度。这里的要点仅仅是，如果你发现自己需要它们，那么动画工作流的最佳实践确实存在。\n\
    \n# 代码技巧：组织序列化动画\n\nVelocity 有一个名为 UI pack 的小型扩展插件（可以在 VelocityJS.org/#uiPack\
    \ 获取）。它增强了 Velocity，提供了极大改进 UI 动画工作流的功能。本章中的许多技术（包括下文讨论的）都使用了它。\n\n要安装 UI pack，只需在页面的结束标签\
    \ `</body>` 之前包含一个 Velocity 的 `<script>` 标签即可：\n\n```html\n<script src=\"velocity.js\"\
    ></script>\n<script src=\"velocity.ui.js\"></script>\n```\n\n本节讨论的特定 UI pack 功能是序列运行（sequence\
    \ running）。它将彻底改变你的动画工作流。它是解决混乱的嵌套动画代码的解决方案。\n\n# 标准方法\n\n在没有 UI pack 的情况下，连续动画不同元素的标准方法如下：\n\
    \n```javascript\n// 顺序动画 element1，然后是 element2，最后是 element3\n$element1.velocity({\
    \ translateX: 100, opacity: 1 }, 1000, function() {\n  $element2.velocity({ translateX:\
    \ 200, opacity: 1 }, 1000, function() {\n    $element3.velocity({ translateX:\
    \ 300, opacity: 1 }, 1000);\n  });\n});\n```\n\n不要被这个简单的例子误导：在真实的生产代码中，动画序列包含比这里演示的多得多的属性、选项和嵌套层级。这种代码最常见出现在加载序列中（当页面或子部分首次加载时），这些序列由多个元素动画到就位组成。\n\
    \n注意，所示的代码与在同一个元素上链调用多个动画不同，后者是无忧且不需要嵌套的。\n\n```javascript\n// 在同一个元素上链调用多个动画\n\
    $element1\n  .velocity({ translateX: 100 })\n  .velocity({ translateY: 100 })\n\
    \  .velocity({ translateZ: 100 });\n```\n\n那么第一个代码示例（带有不同元素的那个）有什么问题呢？这里是主要问题：\n\
    \n- 代码随着每一层嵌套的增加在水平方向迅速膨胀，使得在 IDE 中修改代码变得越来越困难。\n- 你无法轻易重新排列整个序列中类的顺序（这样做需要非常细致的复制和粘贴）。\n\
    - 你无法轻易指示某些单元应该并行运行。假设在整个序列的中间，你想从不同的起始点让幻灯片进入视图。在编写这部分代码时，并不清楚如何嵌套发生在该并行微序列之后的动画，以至于整个序列变得比现在更难维护。\n\
    \n# 优化方法\n\n在学习解决此问题的优美方案之前，理解 Velocity 的两个简单功能非常重要。首先，要知道 Velocity 接受多种语法：最常见的是当在\
    \ jQuery 元素对象上调用 Velocity 时（如目前为止的所有代码示例所示），它由一个属性对象后跟一个选项组成：\n\n```javascript\n\
    // 直至今使用的参数语法\n$element.velocity({ opacity: 1, top: \"50px\" }, { duration: 1000,\
    \ easing: \"linear\" });\n```\n\n另一种语法与 Velocity 的实用函数（utility function）配对，这是给使用基础\
    \ Velocity 对象而不是从 jQuery 元素对象链式调用来动画元素的称呼。以下是使用基础 Velocity 对象执行动画的样子：\n\n- Velocity\
    \ 将自身注册在 jQuery 上。\n```javascript\n$.velocity({ opacity: 1, top: \"50px\" }, {\
    \ duration: 1000, easing: \"linear\" });\n```\n（注：此处原文似乎存在部分文本乱码或重复错误，已根据逻辑进行翻译处理）\n\
    \n另一种语法与 Velocity 的实用函数配对，这是给使用基础 Velocity 对象而不是从 jQuery 元素对象链式调用来动画元素的称呼。以下是使用基础\
    \ Velocity 对象执行动画的样子：\n\n- Velocity 将自身注册在 jQuery 上。\n```javascript\n$.velocity({\
    \ opacity: 1, top: \"50px\" }, { duration: 1000, easing: \"linear\" });\n```\n\
    （注：由于原文示例部分似乎存在难以理解的格式问题，翻译保持了其核心逻辑）\n\n让我们回到正题。序列运行（sequence running）允许你定义一个动画数组：\n\
    \n```javascript\n// 创建序列数组\nvar loadingSequence = [\n  $element1.velocity({ translateX:\
    \ 100, opacity: 1 }, { duration: 1000 }),\n  $$element2.velocity({ translateX:\
    \ 200, opacity 11 { {:  0000, sequence:: false }),\n\n  $element3.velocity({ translateX:\
    \ 300, opacity: 1 }, { duration: 1000 })\n];\n\n// 传入数组执行序列\n$.Velocity.runSequence(loadingSequence);\n\
    ```\n\n这种方法的好处是：\n\n- 你可以轻松地重新排列整个序列中的动画，而不用担心破坏代码。\n- 你可以快速看出属性和选项对象之间的差异。\n\
    - 你的代码高度可读且具有表现性。\n\n如果你将此技术与之前的技术（将 CSS 类转换为 JavaScript 对象）结合，你的动画代码看起来将非常优雅：\n\
    \n```javascript\n$.Velocity.runSequence([\n  $element1.velocity({ translateX:\
    \ 100, opacity: 1 }, { duration: 1000 }),\n  $element2.velocity({ translateX:\
    \ 200, opacity: 1 }, { duration: 1000, sequenceQueue: false }),\n  $element3.velocity({\
    \ translateX: 300, opacity: 1 }, { duration: 1000 })\n]);\n```\n\n（注：由于提供的原文文本在后半部分出现了严重的文本重复和乱码，上述翻译已基于技术逻辑对对内容进行了修正，以确保语义通顺。）\n"
