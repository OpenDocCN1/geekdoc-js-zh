    \ with a duration of 1000ms and a callback function to be\n// triggered upon animation\
    \ completion\n$element.velocity({ top: 50 }, 1000, function() { alert(\"Complete.\"\
    ) });\n```\n\nThis shorthand syntax is a quick way of passing in animation options\
    \ when you only need to specify the basic options (duration, easing, and complete).\
