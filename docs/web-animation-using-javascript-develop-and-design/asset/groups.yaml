    # PREPARING TEXT ELEMENTS FOR ANIMATION WITH BLAST.JS


    The tool of choice for typographic animation is Blast.js, which handily breaks
    blocks of text into characters, words, and sentences. You can then animate the
    resulting parts using Velocity and its UI pack plugin.


    > NOTE: Get Blast.js at Julian.com/research/blast.


    Blast.js has three delimiter types to define the grammatical components to be
    individ-ually extracted: character, word, and sentence. Suppose you have a div
    that looks like this:


    ```

    <div>

    Hello World

    </div>

    ```


    If you call Blast on this div using the following syntax


    ```

    $("div").blast({ delimiter: "word" });


    t div would turn into this:


    <div class="blast-root">

    <span class="blast">Hello</span></span>

    <span class="blast">World</span></span>

    </div>

    ```


    As you can see, Blast separates the target div''s text into text parts that are
    individu-wrapped in span elements. If you were to use instead the character delimiter,
    the result would have been:


    ```

    <div class="blast-root">

    <span class="blast">H</span></span>

    <span class="blast">e</span></span>

    <span class="blast">l</span></span>

    <span class="blast">l</span></span>

    <span class="blast">o</span></span>

    </div>

    ```'
  - '[PAGE 97]


    ```

    <span class="blast"> </span>

    <span class="blast">W</span>

    <span class="blast">o</span>

    <span class="blast">r</span>

    <span class="blast">l</span>

    <span class="blast">d</span>

    </div>

    ```


    You can now animate these span elements independently. Before you dive into textual
    animation, you''re going to learn more about how Blast works so you can take full
    advantage of its powerful features.


    # HOW BLAST.JS WORKS


    The goal of this section is to make you comfortable with the prospect of using
    Blast to break apart the text on your beloved page. Let''s dive in!

    divs, tables, and the other HTML elements you''re familiar with are called element
    nodes. An element commonly consists of two types of children: additional element
    nodes and text nodes (raw text).

    Take this element, for example:


    ```

    <div>

    Hello <span>World</span>

    </div>

    ```


    This element is composed of two children: a text node (“Hello”) and a span element
    node. The span element node contains a child of its owner: another text node (“World”).

    When Blast is called, it traverses the entirety of the target element''s descendant
    chain to find text nodes. With each text node, Blast executes the RegExp query
    with the specified delimiter type (character, word, or sentence) to subdivide
    the node into elements. Since Blast doesn''t actually subdivide elements—you can
    safely apply it to the entire page without worrying about breaking elements''
    event handlers or other expected behaviors. This versatility is crucial when using
    Blast on user-generated content that is often dirtied with HTML. (Say, for example,
    you want to separate the words in a message posted to your site''s comments section
    so you can highlight important passages. With Blast, you can safely do so without
    concern for breaking the user''s embedded links.)'
- md: "\nIn addition to its robustness, Blast provides a high level of accuracy. It\
    \ doesn't dumbly split words at spaces, nor does it split sentences at periods\
    \ within words. It leverages UTF-8 character sets for Latin languages, meaning\
    \ that you can accurately apply to French, German, Spanish, English, Italian,\
    \ and Portuguese content.\n\nSuppose you use Blast's sentence delimiter in the\
    \ following paragraph. (**Bold and *italic* are used below to indicate the consecutive\
    \ text matches that Blast detects). Blast correctly identified six sentences in\
    \ the paragraph:\n\n**Will the sentence delimiter recognize this full sentence\
    \ containing Spanish punctuation?** *¡Yes! «Mais, ou » «Nested \"quotes\" do not\
    \ break the sentence delimiter!* *Further, periods inside words (e.g. Blast.js),\
    \ in formal titles (e.g. Mrs. Bluth, Dr. Funke), and in \"e.g.\" and \"i.e.\"\
    \ do not falsely match as sentence-final punctuation. Darn. That's pretty.*\n\n\
    Notice how punctuation is associated with its proper sentence, and how allant\
    \ periods do not falsely demarcate sentence matches.\n\nWith these foundations\
    \ covered, it's time to run through how to use Blast.\n\n## INSTALLATION\n\nBlast\
    \ is installed on a page like any other JavaScript plugin: embed the appropriate\
    \ script link before your page's `</body>` tag:\n\n```html\n<<html>\n<head>My\
    \ Page</head>\n<body>\nMy content.\n<script src=\"jquery.js\"></script>\n<script\
    \ src=\"velocity.js\"></script>\n<script src=\"blast.js\"></script>\n</body>\n\
    </html>\n```\n\n**NOTE:** Blast requires jQuery (or Zepto, a jQuery alternative),\
    \ and therefore must be required after jQuery. It doesn't matter whether Blast\
    \ is loaded before or after Velocity.\n\nOnce Blast is loaded, use it calling\
    \ .blast() on a jQuery element object. It accepts an options object as its sole\
    \ argument:\n\n```javascript\n$element.blast({option1: value1, option2: value2});\n\
    ```\n\nLet's run through the available options.\n\n## OPTION: DELIMITER\n\nBlast's\
    \ most important option is delimiter, which accepts \"character\", \"word\", or\
    \ \"sentence\". To separate the text within $element using the \"sentence\" delimiter,\
    \ or code would look like this:\n\n```javascript\n$element.blast({ delimiter:\
    \ \"sentence\" });\n```\n\nNote that Blast returns the generated text wrapper\
    \ elements to the jQuery selector chain so you can manipulate them, like this:\n\
    \n```javascript\n$element.blast({ delimiter: \"sentence\" })\n.css(\"opacity\"\
    , 0.5);\n```\n\nThe .css() call is applied to the individual text elements, not\
    \ the parent $element that you called Blast on.\n\n## OPTION: CUSTOMCLASS\n\n\
    Blast provides two options to make text manipulation easier: customClass and generateValueClass.\
    \ customClass behaves exactly as you would expect: supply a custom class (as a\
    \ string value) to be assigned to the text node wrapper elements.\n\nSuppose you\
    \ had the following div and Blast call:\n\n```html\n<div>\n  Hi Mom\n</div>\n\
    ```\n\n```javascript\n$(\"div\").blast({ delimiter: \"word\" , customClass: \"\
    myClass\" });\n```\n\nThe div would turn into the following (note how Blast automatically\
    \ assigns every text part the \"blast\" class by default):\n\n```html\n<div>\n\
    <span class=\"blast myClass\">Hi</span>\n<span class=\"blast myClass\">Mom</span>\n\
    </div>\n```\n\nThe value in providing a custom class is in differentiating the\
    \ elements generated by each Blast call. If, for example, you used Blast in two\
    \ locations on your page—once in the header and once in the footer—it might be\
    \ helpful to assign these two different classes so your subsequent JavaScript\
    \ code and CSS styles act on the text elements appropriately.\n\n## OPTION: GENERATEVALUE\n\
    \ngenerateCellValue takes a Boolean value (true or false) indicating whether a\
    \ unique class, in the form of .blast-[delimiter]-[maxValue], should be assigned\
    \ to the generated text elements.\n\n> **NOTE:** This option is applicable only\
    \ to the character and word delimiters.\n\nThe [delimiter] placeholder represents\
    \ the delimiter type used in the call, and the [maxValue] placeholder represents\
    \ the text contained within an individual element. Consider the following example:\n\
    \n```html\n<div>\nHi Mom\n</div>\n$(\"div\").blast({ delimiter: \"word\", generateCellValue:\
    \ true });\n```\n\nThe element would turn into this:\n\n```html\n<div class=\"\
    blast-root\">\n<span class=\"blast blast-word-Hi\">Hi</span>\n<span class=\"blast\
    \ blast-word-Mom\">Mom</span>\n</div>\n```\n\n```html\n<div class=\"blast-root\"\
    >\n<span class=\"blast blast-letter-H\"><i></span>\n<span class=\"blast blast-letter-i\"\
    ><i></span>\n  ... and so on...\n</div>\n```\n\nThe generateClass option is useful\
    \ when you need to use CSS or JavaScript to manipulate text matches on the text\
    \ contained with them. If, for example, you used this feature on a book excerpt,\
    \ you could create a visualization of all instances of the word \"and\" by giving\
    \ elements with the .blast.word-and class a yellow background:\n\n```javascript\n\
    // jQuery implementation\n$(\".blast-word-and\").css(\"background\", \"yellow\"\
    );\n// Raw JavaScript implementation\ndocument.querySelectorAll(\".blast-word-and\"\
    ).forEach(function(item) {\n  item.style.background = \"yellow\";\n});\n// CSS\
    \ implementation\n.blast-word-and {\n  background: yellow;\n}\n```\n\nThanks to\
    \ this feature, you can painlessly target text matches by either CSS or JavaScript\
    \ without having to use messy custom code to individually check the text contents\
    \ of each element.\n\n## OPTION: TAG\n\nThis option lets you specify the type\
    \ of element that wraps text parts. The default value is span, but you can pass\
    \ in any element type (for example, a, div, p). Consider this example:\n\n```html\n\
    <div>\n  Hi Mom\n</div>\n```\n\n```javascript\n// Use the \"div\" element as the\
    \ wrapper tag\n$(\"div\").blast({ delimiter: \"word\", tag: \"div\" });\n```\n\
    \nThe element would consequently turn into this:\n\n```html\n<div class=\"blast-root\"\
    >\n<div class=\"blast\">Hi</div>\n<div class=\"blast\">Mom</div>\n</div>\n```\n\
    \nThis feature is useful to ensure that the resulting text elements mimic the\
    \ structure of the surrounding HTML. Perhaps nearby sibling elements are all of\
    \ the div type, in which case the above example may be appropriate.\n\nYou might\
    \ also want to take advantage of the unique properties offered by different tag\
    \ types. strong, for example, automatically bolds text, whereas div forces each\
    \ match to begin on a new line thanks to div's default display value of \"block\"\
    .\n\n## COMMAND: REVERSE\n\nYou can undo Blast on an element by passing false\
    \ as the sole parameter into a Blast call. Hence, if your Blasted element looked\
    \ like this:\n\n```html\n<div class=\"blast-root\">\n<div class=\"blast\">Hi</div>\n\
    <div class=\"blast\">Mom</div>\n</div>\n```\n\nand you passed in the following\
    \ Blast call:\n\n```javascript\n$(\"div\").blast(false);\n```\n\nthe element would\
    \ return to its original structure:\n\n```html\n<div>\nHi Mom\n</div>\n```\n\n\
    You might be wondering how this works: when Blast is reversed, it simply destroys\
    \ the wrapper elements, then inserts raw text where the wrapper elements were\
    \ previously. Note that this will break event handlers assigned to the new elements\
    \ generated by Blast, but it won't break event handlers associated with the HTML\
    \ that existed prior to Blast being initially called.\n\nReversing Blast in this\
    \ way is a crucial component of textual animation since the modus operandi when\
    \ animating elements on a webpage is to leave things as they were before you touched\
    \ them. If, for example, you've Blasted apart a sentence in order to animate words\
    \ into view, you would subsequently reverse Blast upon completion of the animation.\
    \ In short, it's a good practice to avoid leaving your HTML unnecessarily bloated\
    \ so that further interaction with it doesn't become increasingly convoluted.\n\
    \n**NOTE:** To learn more about Blast, including its unique search capabilities\
    \ and its compatibility with screen-reading software, visit its documentation\
    \ at Julian.com/research.\n\nNow that you've separated your text elements, it's\
    \ time to animate them.\n\n![](img/556d1045d4d84ff85ee2fbcd7feb49f_103.png)\n"
  mdcn: "\n除了健壮性外，Blast 还提供了高水平的准确性。它不会盲目地按空格分割单词，也不会在单词内部的句号分割句子。它针对拉丁语言利用了 UTF-8\
    \ 字符集，这意味着你可以将其准确应用于法语、德语、西班牙语、英语、意大利语和葡萄语内容。\n\n假设你在以下段落中使用 Blast 的句子分隔符。（下文使用**粗体**和*斜体*来表示\
    \ Blast 检测到的连续文本匹配）。Blast 正确识别了该段落中的六个句子：\n\n**句子分隔符会识别这个包含西班牙语标点的完整句子吗？** *¡可以！«Mais,\
    \ ou »«嵌套的“引号”不会破坏句子分隔符！* *此外，单词内部的句号（例如 Blast.js）、正式标题（例如 Mrs. Bluth, Dr. Funke）以及\
    \ \"e.g.\" 和 \"i.e.\" 中的句号不会错误地匹配为句末标点。真棒。这很到位。*\n\n注意标点是如何与其正确的句子关联的，以及句号是如何没有错误地标记句子匹配的。\n\
    \n完成这些基础之后，是时候介绍如何使用 Blast 了。\n\n## 安装\n\nBlast 的安装方法与其他任何 JavaScript 插件一样：在页面的\
    \ `</body>` 标签之前嵌入相应的脚本链接：\n\n```html\n<html>\n<head>我的页面</head>\n<body>\n我的内容。\n\
    <script src=\"jquery.js\"></script>\n<script src=\"velocity.js\"></script>\n<script\
    \ src=\"blast.js\"></script>\n</body>\n</html>\n```\n\n**注意：** Blast 需要 jQuery（或者\
    \ Zepto，Zepto 是 jQuery 的替代方案），因此必须在引入 jQuery 之后引入它。Blast 在 Velocity 之前加载还是之后加载都没有关系。\n\
    \n一旦加载了 Blast，就可以通过在 jQuery 元素对象上调用 `.blast()` 来使用它。它接受一个选项对象作为唯一参数：\n\n```javascript\n\
    $element.blast({option1: value1, option2: value2});\n```\n\n让我们过一遍可用选项。\n\n##\
    \ 选项：分隔符 (DELIMITER)\n\nBlast 最重要的选项是 `delimiter`，它接受 \"character\"（字符）、\"word\"\
    （单词）或 \"sentence\"（句子）。使用 \"sentence\" 分隔符分离 $element 内部文本的代码如下：\n\n```javascript\n\
    $element.blast({ delimiter: \"sentence\" });\n```\n\n注意，Blast 会将生成的文本封装元素返回 jQuery\
    \ 选择器链，这样你可以对它们进行操作，如下所示：\n\n```javascript\n$element.blast({ delimiter: \"sentence\"\
    \ })\n.css(\"opacity\", 0.5);\n```\n\n`.css()` 调用被应用于单个文本元素，而不是你调用 Blast 的父级 $element。\n\
    \n## 选项：自定义类名 (CUSTOMCLASS)\n\nBlast 提供了两个选项来简化文本操作：`customClass` 和 `generateValueClass`。`customClass`\
    \ 的行为完全如你预期的那样：提供一个自定义类（作为字符串值）分配给文本节点封装元素。\n\n假设你有以下 div 和 Blast 调用：\n\n```html\n\
    <div>\n  Hi Mom\n</div>\n```\n\n```javascript\n$(\"div\").blast({ delimiter: \"\
    word\" , customClass: \"myClass\" });\n```\n\n该 div 将变成如下所示（请注意-由于 Blast 默认如何自动为每个文本部分分配\
    \ \"blast\" 类）：\n\n```html\n<div>\n<span class=\"blast myClass\">Hi</span>\n<span\
    \ class=\"blast myClass\">Mom</span>\n</div>\n```\n\n提供自定义类的意义在于区分由每次 Blast 调用生成的元素。例如，如果你在页面的两个位置使用了\
    \ Blast——一次在页眉，一次在页脚——那么分配这两个不同的类可能会有所帮助，以便你随后的 JavaScript 代码和 CSS 样式能够恰当地作用于文本元素。\n\
    \n## 选项：生成值类 (GENERATEVALUE)\n\n`generateCellValue` 接收一个布尔值（true 或 false），表示是否应为生成的文本元素分配一个格式为\
    \ `.blast-[delimiter]-[maxValue]` 的唯一类。\n\n> **注意：** 此选项仅适用于字符和单词分隔符。\n\n`[delimiter]`\
    \ 占位符代表调用时使用的分隔符类型，`[maxValue]` 占位符代表单个元素包含的文本。考虑以下示例：\n\n```html\n<div>\nHi Mom\n\
    </div>\n$(\"div\").blast({ delimiter: \"word\", generateCellValue: true });\n\
    ```\n\n该元素将变成：\n\n```html\n<div class=\"blast-root\">\n<span class=\"blast blast-word-Hi\"\
    >Hi</span>\n<span class=\"blast blast-word-Mom\">Mom</span>\n</div>\n```\n\n```html\n\
    <div class=\"blast-root\">\n<span class=\"blast blast-letter-H\"><i></span>\n\
    <span class=\"blast blast-letter-i\"><i></span>\n  ... 以此类推...\n</div>\n```\n\n\
    当你需要使用 CSS 或 JavaScript 操作包含在其内部的文本匹配时，`generateClass` 选项非常有用。例如，如果你在书籍摘录中使用此功能，你可以通过给带有\
    \ `.blast.word-and` 类的元素设置黄色背景，创建一个所有单词 \"and\" 可的可视化：\n\n```javascript\n// jQuery\
    \ 实现\n$(\".blast-word-and\").css(\"background\", \"yellow\");\n// 原 JavaScript\
    \ 实现\ndocument.querySelectorAll(\".blast-word-and\").forEach(function(item) {\n\
    \  item.style.background = \"yellow\";\n});\n// CSS 实现\n.blast-word-and {\n  background:\
    \ yellow;\n}\n```\n\n得益于此功能，你可以通过 CSS 或 JavaScript 轻松地定位文本匹配，而无需使用混乱的自定义代码逐个检查每个元素的文本内容。\n\
    \n## 选项：标签 (TAG)\n\n此选项允许你指定封装文本的元素类型。默认值为 `span`，但你可以传递任何元素类型（例如 `div`、`p`）。考虑以下示例：\n\
    \n```html\n<div>\n  Hi Mom\n</div>\n```\n\n```javascript\n// 使用 div 元素作为封装\n$(\"\
    div\").blast({ delimiter: \"word\", tag: \"div\" });\n```\n\n该元素随后将变为：\n\n```html\n\
    <div class=\"blast-root\">\n<div class=\"blast\">Hi</div>\n<div class=\"blast\"\
    >Mom</div>\n</div>\n```\n\n此功能有助于确保结果与周围的 HTML 结构一致。如果相邻元素都是 `div` 类型，那么上述示例可能是合适的。\n\
    \n你可能还想利用不同标签类型提供的独特属性。例如，`strong` 会自动加粗文本，而 `div` 由于其默认显示值为 `block` 会强制每个匹配换行。\n\
    \n## 命令：反向 (REVERSE)\n\n你可以通过向 Blast 调用传递 `false` 作为唯一参数来撤销元素的 Blast。因此，如果你的被\
    \ Blast 处理过的元素如下：\n\n```html\n<div class=\"blast-root\">\n<div class=\"blast\"\
    >Hi</div>\n<div class=\"blast\">Mom</div>\n</div>\n```\n\n并且你执行了以下 Blast 调用：\n\
    \n```javascript\n$(\"div\").blast(false);\n```\n\n该元素将返回原始结构：\n\n```html\n<div>\n\
    Hi Mom\n</div>\n```\n\n你可能在想它是如何工作的：当反转 Blast 时，它简单销毁封装元素，并在之前封装元素的位置插入原始文本。注意，这将破坏分配给\
    \ Blast 生成元素的事件处理器，但不会破坏在调用 Blast 之前与 HTML 相关的事件处理器。\n\n以这种方式反转 Blast 是文本动画至关重要的环节，因为在网页上动画元素的模式是让事物保持在你接触之前的状态。例如，如果你为了动画单词出现而拆分了句子，你会在动画完成后随后反转\
    \ Blast。简而言之，避免让你的 HTML 不必要的膨胀是一种好习惯，这样后续的交互就不会变得日益复杂。\n\n**注意：** 要了解更多关于 Blast\
    \ 的信息，包括其独特的搜索功能和与屏幕阅读器的兼容性，请访问 Julian.com/research 上的文档。\n\n现在你已经分离了文本元素，是时候对它们进行动画处理了。\n\
    \n![](img/556d1045d4d84ff85ee2fbcd7feb49f_103.png)\n"
