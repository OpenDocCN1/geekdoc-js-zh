    # JQUERY OBJECT ELEMENTS


    Instantiating jQuery element objects (JEO) is the most common culprit of DOM gets.
    You might be wondering what a JEO is, but you''ve seen this code snippet before:


    ```

    $("#element").css("opacity", 1);

    ... or its raw JavaScript equivalent:

    document.getElementById("element").style.opacity = 1;

    ```


    In the case of the jQuery implementation, the value returned by $("#element")
    is a JEO, which is an object that wraps the raw DOM element that was queried.
    jQuery provide you with access to all of your jQuery functions, including .css(),
    .animate(), and so on.


    In the case of the raw JavaScript implementation, the value returned by getElementById("element")
    is the raw (unwrapped) DOM element. In both implementations, the browser is instructed
    to search through the DOM tree to find the desired element. This is an operation
    that, when repeated in bulk, impacts page performance.


    This performance concern is exacerbated when uncached elements are used in code
    snippets that are repeated, as the code contained by a loop. Consider the following
    example:


    ```

    $elements.each(function(i, element) {

    ($("body").append(element);

    });",

    ```'
