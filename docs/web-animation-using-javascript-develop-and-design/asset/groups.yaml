    \ Google 上搜索“Rocket Internet” 即可。）\n\n忽视性能问题还有另一个残酷的现实：我们系统性地犯了一个错误，即在理想负载下运行的设备上测试网站。实际上，用户会同时运行多个\
    \ App 和浏览器标签页。他们的设备正在加班工作，同时处理数十个任务。因此，为你的 App 建立的性能基准可能无法反映其在真实世界中的表现。糟糕！\n\n\
    但是，别害怕，热切的开发者。是时候探索你所掌握的性能技术，并提升你的动画水平了。\n\n## 技巧：消除布局抖动（REMOVE LAYOUT THRASHING）\n\
    \n布局抖动（Layout thrashing）——DOM 操作缺乏同步——是动画性能中的“大猩”。虽然没有无痛的解决方案，但有最佳实践。让我们来探索一下。\n\
    \n### 问题\n\n考虑网页操作由“设置（set）”和“获取（get）”组成：你可以设置（更新）或获取（查询）元素的 CSS 属性。同样，你可以在页面上插入新元素（set）或查询一组已存在的元素（get）。获取和设置是导致会产生性能开销的浏览器核心过程（另一个是图形渲染）。可以这样想：在元素上设置新属性时，浏览器必须计算你更改的结果。例如，更改一个元素的宽度可能会触发链式反应，该元素的父元素、兄弟元素和子元素的宽度也必须根据各自的\
    \ CSS 属性发生变化。\n\n由于交替执行“设置”和“获取”导致的 UI 性能下降被称为布局抖动。虽然浏览器对页面布局的重新计算进行了高度优化，但布局抖动会极大地削弱这些优化的程度。例如，一次执行一系列“获取”可以被浏览器轻松优化为单一的流式操作，因为浏览器在第一次“获取”后可以缓存页面状态，然后对后的每个“获取”引用该状态。然而，重复地逐个执行“获取”会迫使浏览器执行大量重负载工作，因为它的缓存因“设置”所做的更改不断失效。\n\
    \n当布局抖动发生在动画循环内部时，这种性能影响会加剧。考虑动画循环的目标是实现每秒 60 帧，这是人眼感知丝滑顺畅运动的阈值。这意味着动画循环中的每一个帧跳（tick）都必须在\
    \ 16.7ms 内完成（1 秒/60 帧 ~= 16.67ms）。布局抖动是导致每个帧跳都超过此限制的非常简单的方法。结果自然是，你的动画将会卡顿（在动画术语中称为\
    \ jank）。\n\n虽然某些动画引擎（如 Velocity.js）包含了为了减少其内部动画循环中布局抖动发生的优化，但请务必在自己的循环中避免布局抖动，例如在\
    \ `setInterval()` 或自调用 `setTimeout()` 内部的代码中。\n\n### 解决方案\n\n避免布局抖动的方法是将 DOM“设置”和\
    \ DOM“获取”简单地合并。以下代码会导致布局抖动：\n\n- // 错误做法\n\n```\nvar currentTop = $(\"element\"\
    ).css(\"top\"); // Get\n$(\"element\").style.top = currentTop + 1; // Set\nvar\
    \ currentleft = $(\"element\").css(\"left\"); // Get\n$(\"element\").style.left\
    \ = currentLeft + 1; // Set\n```\n\n如果你重写代码，使所有查询和更新对齐，浏览器就可以批量处理操作，并减少代码导致布局抖动的程度：\n\
    \n```\nvar currentTop = $(\"element\").css(\"top\"); // Get\nvar currentLeft =\
    \ $(\"element\").css(\"left\"); // Get\n$(\"element\").css(\"top\", currentTop\
    \ + 1); // Set\n$(\"element\").css(\"left\", currentLeft + 1); // Set\n```\n\n\
    图中说明的问题在生产代码中常见，特别是在根据元素 CSS 属性的当前值执行 UI 操作的情况下。\n\n假设你的目标是在点击按钮时切换侧边菜单的可见性。为了实现这一点，你可能首先检查侧边菜单的显示属性是否已被设置为\
    \ \"none\" 还是 \"block\"，然后根据情况交替更改该值。检查显示属性的过程构成了一次“获取”，而随后采取的显示或隐藏侧边菜单的任何操作都将构成一次“设置”。\n\
    \n此代码的优化实现将涉及内存中维护一个变量，每当点击按钮时更新该变量，并在切换可见性之前检查该变量以获取侧边菜单的当前状态。这样，就可以完全跳过“获取”，从而减少代码产生“设置”交替“获取”的可能性。此外，除了减少布局抖动的可能性外，UI\
    \ 现在还受益于每页只有一行。请记住，每次“设置”和“获取”都是相对昂贵的操作；操作越少，你的 UI 性能就越快。\n\n许多改进最终会汇聚成巨大的收益，这是这段代码的主题：尽可能遵循所有的性能最佳实践，你最终将获得一个为了性能而牺牲响应式设计目标的\
    \ UI。\n\n### JQUERY 元素\n\n实例化 jQuery 对象（JEO）是 DOM“获取”最常见的罪魁祸首。你可能在想 JEO 是什么，但你一定见过这种代码：\n\
    \n```\n$(\"#element\").css(\"opacity\", 1);\n```\n\n或者其原生 JavaScript 版本：\n\n```\n\
    document.getElementById(\"element\").style.opacity = 1;\n```\n\n在 jQuery 的实现中，`$(\"\
    #element\")` 返回的是一个 JEO，它是封装原生 DOM 元素的对象。jQuery 提供了访问所有函数的方法，包括 `.css()`、`.animate()`\
    \ 等。\n\n在原生 JavaScript 实现中，`getElementById(\"element\")` 返回的是原生 DOM 元素。在两种实现中，浏览器都被指示遍历\
    \ DOM 树以寻找目标元素。这在重复时会加剧。考虑以下示例：\n\n```javascript\n$elements.each(function(i, element)\
    \ {\n  $(\"body\").append(element);\n});\n```\n\n你可以看到 `$(\"body\")` 是循环中重复的 JEO\
    \ 实例化。除了将循环当前的元素添加到 DOM（这本身就有性能影响）之外，你现在还强制执行了 DOM 查询。这些看似无害的操作会迅速累积。\n\n解决方案是缓存结果——或者保存\
    \ JEO 变量——以避免在每次调用 jQuery 函数时都执行 DOM 操作。因此，代码从长成这样：\n\n```javascript\n// 错误做法：我们没有缓存\
    \ JEO\n$(\"element\").css(\"opacity\", 1);\n// ... 一些代码 ...\n// 我们再次实例化 JEO\n\
    $(\"element\").css(\"opacity\", 0);\n```\n\n变为经过优化后的长成这样：\n\n```javascript\n//\
    \ 缓存 jQuery 元素，并在变量前加 $ 表明这是一个 JEO\nvar element = $(\"element\");\nelement.css(\"\
    opacity\", 1);\n// ... 一些代码 ...\n// 复用缓存的 JEO 并避免 DOM 查询\nelement.css(\"opacity\"\
    , 0);\n```\n\n### 强制喂养（FORCE-FEEDING）\n\n传统的动画引擎通常会在动画开始时查询 DOM 以确定每个动画的 CSS 属性的初始值。Velocity\
    \ 通过一种名为“强制喂养”（force-feeding）的功能来绕过这种页面查询。通过强制喂养，你可以显式地定义动画的起始值，从而消除了这些启动前的顾虑。\n\
    \n"
