    # USING VELOCITY: BASICS


    To get oriented to Velocity, we''ll start with the basic components: arguments,
    properties, values, and chaining. Since jQuery is so ubiquitous, it is also important
    to look at the relationship between Velocity and jQuery.


    # VELOCITY AND JQUERY


    Velocity functions independently of jQuery, but the two can be used in combination.
    It''s often preferable to do so to benefit from jQuery''s chaining capabilities:
    When you''re preselected an element using jQuery, you can extend it with a call
    to .velocity() to animate it:


    ```

    // Assign a variable to a jQuery element

    var div = "$div";

    // Animate the element using Velocity

    $div.animate({ opacity: 0 });

    ```


    This syntax is identical to jQuery''s own animate function:

    $div.animate({ opacity: 0 });


    All the examples in this book Velocity in combination with jQuery, and therefore
    follow this syntax.


    # ARGUMENTS


    Velocity accepts multiple arguments. Its first argument is an object that maps
    CSS properties to their desired final values. The properties and their accepted
    value correspond directly to those used in CSS (if you''re unfamiliar with basic
    CSS properties, pick up an introductory HTML and CSS book before reading this
    one):


    ```

    // Animate an element to a width of "500px" and to an opacity of 1.

    $element.velocity({ width: "500px", opacity: 1 });

    ```


    > TIP: In JavaScript, if you''re providing a property value that contains letters
    (instead of only integers), put the value in quotes.'
  - '[PAGE 31]


    You can pass in an object specifying animation options as a second argument:


    ```

    $element.velocity({ width: "500px", opacity: 1 },

    { duration: 400, easing: "swing" });

    ```


    There''s a shorthand argument syntax: Instead of passing in an options object
    as a second argument, you can use comma-separated syntax. This entails listing
    values for duration (which accepts an integer value), easing (a string value),
    and complete (a function value) in any comma-separated order. (You''ll learn what
    all of these options documentarily.)


    ```

    // animate with a duration of 1000ms (and implicitly use the default easing

    -> value of "swing")

    $element.velocity({ top: 50 }, 1000 });

    // animate with a duration of 1000ms and an easing of "ease-in-out"

    $element.velocity({ top: 50 }, 1000, "ease-in-out" });

    // animate with an easing of "ease-out" (and implicitly use the default

    -> duration value of 400ms)

    $element.velocity({ top: 50 }, "ease-out" });

    // animate with a duration of 1000ms and a callback function to be

    -> triggered upon animation completion

    $element.velocity({ top: 50 }, 1000, function() { alert("Complete.") });

    ```


    This shorthand syntax is a quick way of passing in animation options when you
    only need to specify the basic options (duration, easing, and complete). If you
    pass in an animation option other than these three, you must switch all options
    to the object syntax. Hence, if you want to specify a delay option, change the
    following syntax:


    ```

    $element.velocity({ top: 50 }, 1000, "ease-in-out" });

    ```


    to this syntax:


    // Re-specify the animation options used above, but include a delay value

    -> of 500ms


    ```

    $element.velocity({ top: 50 }, { duration: 1000, easing: "ease-in-out",

    -> delay: 500 });",

    ```'
  - '[PAGE 32]


    You can''t do:


    ```

    // Incorrect: Divides animation options between the comma-separated syntax

    -> and the object syntax

    $elementvelocity({ top: 50 }, 1000, easing: "ease-in-out",

    -> delay: 500 });

    ```


    # PROPERTIES


    There are two differences between CSS-based and JavaScript-based property animation.

    First, unlike CSS, Velocity accepts only a single numeric value per CSS property.

    So, you can pass in:


    ```

    $element.velocity({ padding: 10 });

    ```


    or


    ```

    $element.velocity({ paddingLeft: 10, paddingRight: 10 });

    ```


    But you can''t pass in:


    ```

    // Incorrect: The CSS property is being passed more than one numeric value.

    $element.velocity({ padding: "10 10 10 10" });

    ```


    If you do want to animate all four padding values (top, right, bottom, and left),
    list them out as separate properties:


    ```

    // Correct

    $element.velocity({

    paddingTop: 10,

    paddingRight: 10,

    paddingBottom: 10,

    paddingLeft: 10

    });

    ```


    Other CSS properties that can take multiple numeric values like\margin, transform,
    text-shadow, and box-shadow.


    Breaking up compound properties into their sub-properties for the purposes of

    animation you gives increased control over easing values. In CSS, you can specify
    only'
  - '[PAGE 33]


    one property-wide easing type when animating multiple sub-properties within the
    parent padding property, for example. In JavaScript, you can specify independent
    easing values for each sub-property—the advantages of this will become apparent
    during the discussion of CSS property animation later in this chapter.


    Listing out independent-properties can also make your animation code easier to
    read and maintain.


    The second difference between CSS-based and JavaScript-based property animation
    is that JavaScript properties drop the dashes between words and all words that
    the first must be capitalized. For example, padding-left becomes paddingLeft,
    and background-color becomes backgroundColor. Further note that JavaScript names
    should not be in quotes:


    ```

    // Correct

    element.velocity({paddingLeft: 10});

    // Incorrect: Uses a dash and doesn''t capitalize

    element.velocity({padding-left: 10});

    // Incorrect: Uses quotes around the JavaScript-formatted property name

    $element.velocity("paddingLeft": 10});

    ```


    # VALUES


    Velocity supports the px, em, rem, %, deg, vw, and v units. If you don''t provide
    a unit with a numeric value, an appropriate one is automatically assigned based
    on the CSS property type. For most properties, px is the default unit, but a property
    that expects a rotation angle, such as rotateZ for example, would be automatically
    assigned the deg (unit):


    ```

    element.velocity({

    top: 50, // Defaults to the px unit type

    left: "50%", // we manually specify the % unit type

    rotateZ: 25 // Defaults to the deg unit type

    });

    ```


    Explicitly declaring unit types for all property values increases your code''s
    legibility by making the contrast between the px unit and its alternatives more
    obvious when quickly eyeballing your code.'
- md: "\nAnother advantage of Velocity over CSS is that it supports four value operators\
    \ that can be optionally prefixed to a property value: +, -, and /. These directly\
    \ correspond to their math operators in JavaScript. You can combine these value\
    \ operators with an equals sign (=) to perform relative math operations. Refer\
    \ to the inline code comments for examples:\n\n```\nelement.velocity({\ntop: \"\
    50px\", // No operator. Animate toward 50 as expected.\nleft: \"-50\", // Negative\
    \ operator. Animate toward -50 as expected.\nwidth: \"+=5rem\", // Convert the\
    \ current width value into its rem\n  -> equivalent and add 5 units.\nheight:\
    \ \"-=10rem\", // Convert the current height value into its rem\n  -> equivalent\
    \ and subtract 10 units.\npaddingLeft: \"*=2\" // Double the current paddingLeft\
    \ value.\npaddingRight: \"/=2\" // Divide the current paddingLeft value into two.\n\
    });\n```\n\nVelocity's shorthand features, as value operators, retain animation\
    \ logic entirely not only keeps the code more concise by eliminating manual value\
    \ calculation, but also improves performance by telling Velocity more about how\
    \ you plan to animate your elements. The more logic that is performed within Velocity,\
    \ the better Velocity can optimize your code for higher frame rates.\n\n# CHAINING\n\
    \nWhen multiple Velocity calls are chained back-to-back on an element (or a series\
    \ of elements), they automatically queue onto one another. This means that each\
    \ animation begins before the preceding animation has completed:\n\n```\n$element\n\
    // Animate the width and height properties\n.velocity({ width: \"100px\", height:\
    \ \"100px\" })\n// When width and height are done animating, animate the top property\n\
    .velocity({ top: \"50px\" });\n```\n\n# USING VELOCITY: OPTIONS\n\nTo round out\
    \ this introduction to Velocity, let's run through the most commonly used options:\
    \ duration, easing, begin and complete, loop, delay, and display.\n\n# DURATION\n\
    \nYou can specify the duration option, which dictates how long an animation call\
    \ takes to complete, in milliseconds (1/100th of a second) or as one of three\
    \ shorthand durations: \"slow\" (equivalent to 60ms), \"normal\" (400ms), or \"\
    fast\" (200ms). By specifying a duration value in milliseconds, provide an integer\
    \ value without any type:\n\n```\n// Animate with a duration of 100ms (1 second)\n\
    $element.velocity({ opacity: 1 }, { duration: 1000 });\n```\n\nor\n\n```\n$element.velocity({\
    \ opacity: 1 }, { duration: \"slow\" });\n```\n\nThe advantage of using the named\
    \ shorthand durations is that they express the tempo of an animation (is it slow\
    \ or is it fast?) when you're reviewing your code. If you use these shorthands\
    \ exclusively, they'll naturally lead to uniform motion design across your site,\
    \ since all of your animations will fall into one of three categories instead\
    \ of each being passed an arbitrary value.\n\n# EASING\n\nEasings are the mathematical\
    \ functions that define how fast or slow animations occur in different parts of\
    \ an animation's total duration. For example, an easing type of \"ease-in\" indicates\
    \ that the animation should gradually accelerate (ease in) during the first part\
    \ then gradually decelerate (ease out) during the final part. In contrast, an\
    \ easing type of \"ease-in\" produces an animation that accelerates up to a target\
    \ speed during the first part of an animation but thereafter remains at a constant\
    \ speed until the animation completes. An easing type of \"ease-out\" is the converse\
    \ of this: the animation starts and continues at a constant speed before it gradually\
    \ decelerates during the final part of the animation.\n\nMuch like the physics-based\
    \ motion discussed in Chapter 1, \"Advantages of JavaScript Animation,\" easings\
    \ give you the power to inject personality into your animations. Take, for example,\
    \ how robotic an animation that uses the linear easing produces an animation that\
    \ starts, runs, and ends at the same velocity. The robotic feel is the result\
    \ of an animation with linear robotic motion in the real world: Self-guided mechanical\
    \ objects typically move in straight lines and at constant speed because there's\
    \ neither aesthetic nor organic reason for them to do otherwise.\n\nIn contrast,\
    \ living things—whether the human body or trees blowing in the wind—never move\
    \ at constant speed in the real world. Friction and other forces cause them to\
    \ move at varying speeds.\n\nGreat motion designers pay homage to organic motion\
    \ because it gives the impression that the interface is responding fluidly to\
    \ the user's interaction. In mobile apps, for example, you expect a menu to quickly\
    \ accelerate away from your fingers when you swipe it off-screen. If the menu\
    \ were to move away from your fingers at a constant speed—like a robotic arm—you'd\
    \ feel as if the swipe merely off a chain of motion events that were outside your\
    \ control.\n\nYou'll learn more about the power of easing types in Chapter 3,\
    \ \"Motion Design Theory.\" For now, let's run through all of Velocity's available\
    \ easing values:\n\n- * jQuery UI's trigonometric easings. For a complete listing\
    \ of these easing equations, as well as interactive demonstrations of their acceleration\
    \ profiles, refer to the demos on easings.net.\n\n```\n$element.velocity({ width:\
    \ \"100px\" }, \"easeInOutSine\" });\n```\n\nCSS easings: \"ease-in\", \"ease-out\"\
    , and \"ease\" (a subtler version of \"ease-in-out\").\n\n```\n$element.velocity({\
    \ width: \"100px\" }, \"ease-in-out\" });\n```\n\n- * CSS Bézier curves: The Bézier\
    \ curve allows complete control over the structure of an easing's acceleration\
    \ curve. A Bézier curve is defined by specifying the height of four equidistant\
    \ points on a chart, in the format of a four-item array of decimal values. Visit\
    \ cubic-bezier.com for an interactive to creating Bézier curves.\n\n```\n$element.velocity({\
    \ width: \"100px\" }, [ 0.17, 0.67, 0.83, 0.67 ] });\n```\n\n- * Spring physics:\
    \ This easing type mimics the bouncy behavior of a spring that's been stretched\
    \ suddenly released. As with the classical physics equation that defines the motion\
    \ of a spring, this easing type lets you pass a two-item array of { tension, friction\
    \ }. A higher tension (default: 500) increases total speed and bounciness. A lower\
    \ friction (default: 20) increases ending vibration speed.\n\n```\n$element.velocity({\
    \ width: \"100px\", }, { 250, 15 });\n```\n\n- * \"spring\" easing is a predefined\
    \ implementation of the spring easing that's handy to use when you don't want\
    \ to experiment with tension and friction values.\n\n```\n$element.velocity({\
    \ width: \"100px\" }, easing: \"spring\" });\n```\n\nRemember that you can also\
    \ pass in the easing option as an explicitly defined property in an options object\
    \ argument:\n\n```\n$element.velocity({ width: 50 }, { easing: \"spring\" });\n\
    ```\n\nDo not be overwhelmed by the number of easing options available to you.\
    \ You'll most often rely on the CSS easing types and the \"spring\" easing, which\
    \ suit the vast majority of animation use cases. The most complex easing type,\
    \ the Bézier curve, is most often employed by developers who have a highly specific\
    \ easing style in mind and aren't afraid to get their hands dirty.\n\n> NOTE:\
    \ The rest of the Velocity options in this section must be explicitly passed into\
    \ an options object. Unlike those already described, these additional options\
    \ cannot be supplied to Velocity in the shorthand comma-separated syntax.\n\n\
    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_37_0.png)\n\n# BEGIN AND COMPLETE\n\n\
    The begin and complete options allow you to specify functions to be triggered\
    \ at certain points in an animation: Pass the begin option a function to be called\
    \ prior to the start of an animation. Conversely, pass the complete option a function\
    \ to be called at the completion of an animation.\n\nWith both options, the function\
    \ is called once per animation, even if multiple elements are being animated at\
    \ once:\n\n```\nvar $divs = $(\"div\");\n$divs.velocity(\n  opacity: 0,\n  //\
    \ Open an alert box before the animation begins\n  begin: function () { console.log(\"\
    Begin!\"); },\n  // Open an alert box once the animation completes\n  complete:\
    \ function () { console.log(\"Complete!\"); }\n);\n```\n\n# CALLBACK FUNCTIONS\n\
    \nThese options are commonly referred to as \"callback functions\" (or \"callbacks\"\
    ) since they are \"called\" when certain events occur in the future. Callbacks\
    \ are useful for firing events that are dependent on the visibility of elements.\
    \ For example, if an element starts at invisible it animates toward an opacity\
    \ of 1, it may be appropriate to subsequently trigger a UI event that modifies\
    \ the new content once users are able to see it.\n\nRemember that you don't need\
    \ to use callbacks to queue animations one after another; animations automatically\
    \ fire sequentially when more than one is assigned to a single element or set\
    \ of elements. Callbacks are for the queuing of non-animation logic.\n"
  mdcn: "\n\nVelocity 优于 CSS 的另一个优势是它支持四种值运算符，这些运算符可以可选地加在属性值之前：`+`、`-` 和 `/`。它们直接对应\
    \ JavaScript 中相应的数学运算符。你可以将这些值运算符与等号 (`=`) 组合执行相对数学运算。请参考内联代码注释示例：\n\n```\nelement.velocity({\n\
    top: \"50px\", // 无操作符。预期向 50 动画。\nleft: \"-50\", // 负操作符。按预期向 -50 动画。\nwidth:\
    \ \"+=5rem\", // 将当前宽度值转换为对应的 rem\n  -> 等同于增加 5 个单位。\nheight: \"-=10rem\", //\
    \ 将当前高度值转换为对应的 rem\n  -> 等同于减去 10 个单位。\npaddingLeft: \"*=2\" // 当前 paddingLeft\
    \ 值翻倍。\npaddingRight: \"/=2\" // 将当前的 paddingLeft 值平分。\n});\n```\n\nVelocity 的简写功能作为值运算符完全保留了动画逻辑，这不仅通过消除手动数值计算使了代码更加简洁，还通过告诉\
    \ Velocity 更多关于你计划如何动画元素的信息提高了性能。Velocity 内部执行的逻辑越多，Velocity 就越能优化你的代码以获得更高的帧率。\n\
    \n# 链式调用 (CHAINING)\n\n当多个 Velocity 调用连续地接在一个元素（或是一系列元素）上时，它们会自动相互排队。这意味着每个动画都会在上一个动画完成之前开始：\n\
    \n```\n$element\n// 动画化宽度和高度属性\n.velocity({ width: \"100px\", height: \"100px\"\
    \ })\n// 当宽度和高度动画完成后，动画化顶部属性\n.velocity({ top: \"50px\" });\n```\n\n# 使用 VELOCITY：选项\n\
    \n为了完善对 Velocity 的介绍，让我们过一遍最常用的选项：duration（持续时间）、easing（缓动函数）、begin（开始）和 complete（完成）、loop（循环）、delay（延迟）以及\
    \ display（显示）。\n\n# DURATION (持续时间)\n\n你可以指定 `duration`选项，它决定了动画调用完成所需的时间，单位为毫秒（1/100\
    \ 秒），或者使用三种简写持续时间之一：\"slow\"（等同于 60ms）、\"normal\"（400ms）或 \"fast\"（200ms）。通过指定毫秒的持续时间值，提供一个无任何类型的整数值：\n\
    \n```\n// 以 1000ms (1秒) 的持续时间动画\n$element.velocity({ opacity: 1 }, { duration:\
    \ 1000 });\n```\n\n或者\n\n```\n$element.velocity({ opacity: 1 }, { duration: \"\
    slow\" });\n```\n\n使用命名简写持续时间的优势在于，当你审查代码时，它们表达了动画的节奏（是慢是快？）。如果你完全使用这些简写，它们自然会引导你的整个网站呈现出统一的运动设计，因为你所有的动画将落入三个类别之一，而不是每个都传递一个任意值。\n\
    \n# EASING (缓动函数)\n\n缓动函数（Easings）是定义动画在动画总持续时间不同部分发生速度快慢的数学函数。例如，\"ease-in\"\
    \ 缓动类型表示动画在第一部分应该逐渐加速（淡入），然后在最后部分逐渐减速（淡出）。相比之下，\"ease-in\" 缓动类型产生的动画在动画的第一部分加速到目标速度，此后保持恒定速度直到动画完成。\"\
    ease-out\" 缓动类型是此反面：动画以恒定速度开始并持续，然后在动画的最后部分逐渐减速。\n\n就像第 1 章“JavaScript 动画的优势”中讨论的基于物理的运动一样，缓动赋予了你向动画注入个性的力量。例如，使用线性缓动（linear\
    \ easing）的动画是多么机械化，它的启动、运行和结束速度相同。这种机器人感是现实世界中线性机器人运动的结果：自引导的机械物体通常以直线和恒定速度移动，因为它们既没有美学理由也没有有机理由那样做。\n\
    \n相反，活的生物——无论是人体还是随风摇曳的树木——在现实世界中从不以恒定速度移动。摩擦和其他力量使它们以不同的速度移动。\n\n伟大的运动设计师向有机运动（organic\
    \ motion）致敬，因为它给人一种界面对用户交互做出流畅响应的印象。例如，在移动应用中，当你将菜单滑出屏幕时，你预期它会迅速离开手指。如果菜单以恒定速度离开手指——就像机械臂一样——你会觉得滑动仅仅触发了一系列不受你控制的运动事件。\n\
    \n你将在第 3 章“运动设计理论”中学习更多关于缓动类型的威力。现在，让我们过一遍 Velocity 所有可用的缓动值：\n\n- * jQuery UI\
    \ 的三角函数缓动。关于这些缓动方程的完整列表以及其加速曲线的交互演示，请参考 easings.net 上的演示。\n\n```\n$element.velocity({\
    \ width: \"100px\" }, \"easeInOutSine\" });\n```\n\nCSS 缓动：\"ease-in\"、\"ease-out\"\
    \ 和 \"ease\"（\"ease-in-out\" 的更微妙版本）。\n\n```\n$element.velocity({ width: \"100px\"\
    \ }, \"ease-in-out\" });\n```\n\n- * CSS 贝塞尔曲线 (Bézier curves)：贝塞尔曲线允许对缓动加速曲线结构进行完全控制。贝塞尔曲线通过指定图表上四个等距点的高度来定义，格式为四项小数数组。访问\
    \ cubic-bezier.com 交互式生成曲线。\n\n```\n$element.velocity({ width: \"100px\" }, [0.17,\
    \ 0.67, 0.83, 0.67] });\n```\n\n- * 弹簧物理 (Spring physics)：这种缓动类型模拟了拉伸后突然释放的弹簧行为。通过\
    \ tension（张力）和 friction（阻力）来调整它。\n\n```\n$element.velocity({ width: \"100px\"\
    \ }, { tension: 500, friction: 15 });\n```\n\n- * \"spring\" 缓动是预定义的实现，当你不想尝试张力和阻力值时非常方便。\n\
    \n```\n$element.velocity({ width: \"100px\" }, easing: \"spring\" });\n```\n\n\
    记住，你也可以将缓 作为选项对象中的属性传入：\n\n```\n$element.velocity({ width: 50 }, { easing: \"\
    spring\" });\n```\n\n> 注意：本节中的其余 Velocity 选项必须显式传递到选项对象。与之前描述的不同，这些额外选项不能通过逗号分隔的语法提供给\
    \ Velocity。\n\n![](img/556d1045d4d84ff5ee82fbcd749f_37_0.png)\n\n"
