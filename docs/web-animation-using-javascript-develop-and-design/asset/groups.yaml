  - '[PAGE 93]


    Since textual animation is rarely employed in webpages, using it is an easy way
    to impress users. That''s precisely what makes this topic so much fun to learn:
    the underlying techniques are simple to program, but the results feel incredibly
    rich and complex to the user.


    This chapter introduces you to tools that remove the tedious aspects of textual
