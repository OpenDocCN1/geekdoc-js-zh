    In both cases—whether scrolling is relative to the browser window or to a parent
    element—the scroll command is always called on the element being scrolled


    By default, scrolling over the y-axis. Pass in the axis: "x" option to scroll
    horizontally instead of vertically


    ```

    // Scroll the browser to the *left* edge of the targeted div.

    $element.velocity("scroll", { axis: "x" });

    ```


    Finally, the scroll command uniquely takes an offset option, specified in pixels,
    which offsets the target scroll position:


    ```

    // Scroll to a position 50px *above* the element''s top edge.

    $element.velocity("scroll", { duration: 1000, offset: "-50px" });

    // Scroll to a position 250px *beyond* the element''s top edge.

    $element.velocity("scroll", { duration: 1000, offset: "250px" });

    ```


    # COLORS


    Velocity supports color animation for these CSS properties: color, borderColor,
    and outlineColor. In Velocity, color properties accept only hex strings as inputs,
    for example, #000000 (black) or #e2e2e2 (light gray). For more granular control,
    you can animate the individual red, green, and blue components of a color property,
    as well as the alpha component. Red, green, and blue range in value from 0 to
    255, and alpha (which is equivalent to opacity) ranges from 0 to 1.'
