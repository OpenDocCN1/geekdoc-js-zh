    ```\n\nThis syntax is identical to jQuery's own animate function:\n$div.animate({\
    \ opacity: 0 });\n\nAll the examples in this book Velocity in combination with\
    \ jQuery, and therefore follow this syntax.\n\n# ARGUMENTS\n\nVelocity accepts\
