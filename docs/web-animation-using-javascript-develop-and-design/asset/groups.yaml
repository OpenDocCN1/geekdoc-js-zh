  - "[PAGE 34]\n\nAnother advantage of Velocity over CSS is that it supports four\
    \ value operators that can be optionally prefixed to a property value: +, -, and\
    \ /. These directly correspond to their math operators in JavaScript. You can\
    \ combine these value operators with an equals sign (=) to perform relative math\
    \ operations. Refer to the inline code comments for examples:\n\n```\nelement.velocity({\n\
    top: \"50px\", // No operator. Animate toward 50 as expected.\nleft: \"-50\",\
    \ // Negative operator. Animate toward -50 as expected.\nwidth: \"+=5rem\", //\
    \ Convert the current width value into its rem\n  -> equivalent and add 5 units.\n\
    height: \"-=10rem\", // Convert the current height value into its rem\n  -> equivalent\
    \ and subtract 10 units.\npaddingLeft: \"*=2\" // Double the current paddingLeft\
    \ value.\npaddingRight: \"/=2\" // Divide the current paddingLeft value into two.\n\
    });\n```\n\nVelocity's shorthand features, as value operators, retain animation\
    \ logic entirely not only keeps the code more concise by eliminating manual value\
    \ calculation, but also improves performance by telling Velocity more about how\
    \ you plan to animate your elements. The more logic that is performed within Velocity,\
    \ the better Velocity can optimize your code for higher frame rates.\n\n# CHAINING\n\
    \nWhen multiple Velocity calls are chained back-to-back on an element (or a series\
    \ of elements), they automatically queue onto one another. This means that each\
    \ animation begins before the preceding animation has completed:\n\n```\n$element\n\
    // Animate the width and height properties\n.velocity({ width: \"100px\", height:\
    \ \"100px\" })\n// When width and height are done animating, animate the top property\n\
    .velocity({ top: \"50px\" });\n```"
  - '[PAGE 35]


    # USING VELOCITY: OPTIONS


    To round out this introduction to Velocity, let''s run through the most commonly
    used options: duration, easing, begin and complete, loop, delay, and display.


    # DURATION


    You can specify the duration option, which dictates how long an animation call
    takes to complete, in milliseconds (1/100th of a second) or as one of three shorthand
    durations: "slow" (equivalent to 60ms), "normal" (400ms), or "fast" (200ms). By
    specifying a duration value in milliseconds, provide an integer value without
    any type:


    ```

    // Animate with a duration of 100ms (1 second)

    $element.velocity({ opacity: 1 }, { duration: 1000 });

    ```


    or


    ```

    $element.velocity({ opacity: 1 }, { duration: "slow" });

    ```


    The advantage of using the named shorthand durations is that they express the
    tempo of an animation (is it slow or is it fast?) when you''re reviewing your
    code. If you use these shorthands exclusively, they''ll naturally lead to uniform
    motion design across your site, since all of your animations will fall into one
    of three categories instead of each being passed an arbitrary value.


    # EASING


    Easings are the mathematical functions that define how fast or slow animations
    occur in different parts of an animation''s total duration. For example, an easing
    type of "ease-in" indicates that the animation should gradually accelerate (ease
    in) during the first part then gradually decelerate (ease out) during the final
    part. In contrast, an easing type of "ease-in" produces an animation that accelerates
    up to a target speed during the first part of an animation but thereafter remains
    at a constant speed until the animation completes. An easing type of "ease-out"
    is the converse of this: the animation starts and continues at a constant speed
    before it gradually decelerates during the final part of the animation.'
  - '[PAGE 36]


    Much like the physics-based motion discussed in Chapter 1, "Advantages of JavaScript
    Animation," easings give you the power to inject personality into your animations.
    Take, for example, how robotic an animation that uses the linear easing produces
    an animation that starts, runs, and ends at the same velocity). The robotic feel
    is the result of an animation with linear robotic motion in the real world: Self-guided
    mechanical objects typically move in straight lines and at constant speed because
    there''s neither aeshetic nor organic reason for them to do otherwise.


    In contrast, living things—whether the human body or trees blowing in the wind—never
    move at constant speed in the real world. Friction and other forces cause them
    to move at varying speeds.


    Great motion designers pay homage to organic motion because it gives the impression
    that the interface is responding fluidly to the user''s interaction. In mobile
    apps, for example, you expect a menu to quickly accelerate away from your fingers
    when you swipe it off-screen. If the menu were to move away from your fingers
    at a constant speed—like a robotic arm—you''d feel as if the swipe merely off
    a chain of motion events that were outside your control.


    You''ll learn more about the power of easing types in Chapter 3, "Motion Design
    Theory." For now, let''s run through all of Velocity''s available easing values:


    +   * jQuery UI''s trigonometric easings. For a complete listing of these easing
    equations, as well as interactive demonstrations of their acceleration profiles,
    refer to the demos on easings.net.


    ```

    $element.velocity({ width: "100px" }, "easeInOutSine\ });

    ```


    CSS easings: "ease-in", "ease-out", and "ease" (a subtler version of "ease-in-out").


    ```

    $element.velocity({ width: "100px" }, "ease-in-out\ });

    ```


    +   * CSS Bézier curves: The Bézier curve allows complete control over the structure
    of an easing''s acceleration curve. A Bézier curve is defined by specifying the
    height of four equidistant points on a chart, in the format of a four-item array
    of decimal values. Visit cubic-bezier.com for an interactive to creating Bézier
    curves.


    ```

    $element.velocity({ width: "100px" }, [ 0.17, 0.67, 0.83, 0.67 ] });

    ```'
  - '[PAGE 37]


    +   Spring physics: This easing type mimics the bouncy behavior of a spring that''s
    been stretched suddenly released. As with the classical physics equation that
    defines the motion of a spring, this easing type lets you pass a two-item array
    of { tension, friction }. A higher tension (default: 500) increases total speed
    and bounciness. A lower friction (default: 20) increases ending vibration speed.


    ```

    $element.velocity({ width: "100px", }, { 250, 15 });

    ```


    +   "spring" easing is a predefined implementation of the spring easing that''s
    handy to use when you don''t want to experiment with tension and friction values.


    ```

    $element.velocity({ width: "100px" }, easing: "spring" });

    ```


    Remember that you can also pass in the easing option as an explicitly defined
    property in an options object argument:


    ```

    $element.velocity({ width: 50 }, { easing: "spring" });

    ```


    Do not be overwhelmed by the number of easing options available to you. You''ll
    most often rely on the CSS easing types and the "spring" easing, which suit the
    vast majority of animation use cases. The most complex easing type, the Bézier
    curve, is most often employed by developers who have a highly specific easing
    style in mind and aren''t afraid to get their hands dirty.


    > NOTE: The rest of the Velocity options in this section must be explicitly passed
    into an options object. Unlike those already described, these additional options
    cannot be supplied to Velocity in the shorthand comma-separated syntax.


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_37_0.png)'
  - "[PAGE 38]\n\n# BEGIN AND COMPLETE\n\nThe begin and complete options allow you\
    \ to specify functions to be triggered at certain points in an animation: Pass\
    \ the begin option a function to be called prior to the start of an animation.\
    \ Conversely, pass the complete option a function to be called at the completion\
    \ of an animation.\n\nWith both options, the function is called once per animation\
    \ call, even if multiple elements are being animated at once:\n\n```\nvar $divs\
    \ = $(\"div\");\n$divs.velocity(\n  opacity: 0,\n  // Open an alert box before\
    \ the animation begins\n  begin: function () { console.log(\"Begin!\"); },\n \
    \ // Open an alert box once the animation completes\n  complete: function () {\
    \ console.log(\"Complete!\"); }\n);\n```\n\n# CALLBACK FUNCTIONS\n\nThese options\
    \ are commonly referred to as \"callback functions\" (or \"callbacks\") since\
    \ they are \"called\" when certain events occur in the future. Callbacks are useful\
    \ for firing events that are dependent on the visibility of elements. For example,\
    \ if an element starts at invisible it animates toward an opacity of 1, it may\
    \ be appropriate to subsequently trigger a UI event that modifies the new content\
    \ once users are able to see it.\n\nRemember that you don't need to use callbacks\
    \ to queue animations one after another; animations automatically fire sequentially\
    \ when more than one is assigned to a single element or set of elements. Callbacks\
    \ are for the queuing of non-animation logic."
- md: "\n# LOOP\n\nSet the loop option to specify the number of times an animation\
    \ should alternate between the values in the call's property and map the element's\
    \ values prior to the call:\n\n```\n$element.velocity({ height: \"10em\" }, {\
    \ loop: 2 });\n```\n\nIf the element's original height was 5em, its height would\
    \ alternate between 5em and 10em twice.\n\nIf the begin or complete options are\
    \ used with a looped call, they are triggered once each—at the very beginning\
    \ and end of the loop sequence, respectively; they are not retriggered for each\
    \ loop iteration.\n\nInstead of passing an integer, you can also pass in true\
    \ to trigger infinite looping:\n\n```\n$element.velocity({ height: \"10em\" },\
    \ { loop: true });\n```\n\nInfinite loops ignore the callback back unless they\
    \ naturally end. They, however, can be manually stopped via Velocity's stop command:\n\
    \n```\n$element.velocity(\"stop\");\n```\n\nNon-infinite loops are useful for\
    \ animation sequences that would otherwise require the repetition of chained animation\
    \ code. For example, if you were to bounce an element up and down twice (perhaps\
    \ to alert the user of a new message awaiting them), the non-optimized code would\
    \ look like this:\n\n```\n$element\n// Assume translateY starts at \"0px\"\n.velocity({\
    \ translateY: \"100px\" })\n.velocity({ translateY: \"0px\" })\n.velocity({ translateY:\
    \ \"100px\" })\n.velocity({ translateY: \"0px\" });\n```\n\nThe more compact and\
    \ easier to maintain version of this code would look like this:\n\n```\n// Repeat\
    \ (loop) this animation twice\n$element.velocity({ translateY: \"100px\" }, {\
    \ loop: 2 });\n```\n\nWith this optimized version, if you have a change of heart\
    \ about how much the top value should be changed by (currently \"100px\"), you\
    \ need only change the top value in one part of the code. If there are many instances\
    \ of repetition in your code, it quickly becomes obvious how much looping benefits\
    \ your workflow. \n\nInfinite looping is tremendously helpful for loading indicators,\
    \ which typically animate indefinitely until data has finished loading.\n\nFirst,\
    \ make the loading element appear to pulsate by infinitely looping its opacity\
    \ from visible to invisible:\n\n```\n// Assume opacity starts at 1 (fully visible)\n\
    $element.velocity({ opacity: 0 }, { loop: true });\n```\n\nLater, once the data\
    \ has finished loading, you can stop the animation, and then the element:\n\n\
    ```\n$element\n// First stop the infinite loop...\n.velocity(\"stop\")\n// ...\
    \ so you can give the element a new animation,\n// in which you can animate it\
    \ back to invisibility\n.velocity({ opacity: 0 });\n```\n\n# DELAY\n\nSpecify\
    \ the delay option in milliseconds to insert a pause before an animation begins.\
    \ The delay option's purpose is to retain an animation's timing logic entirely\
    \ within Velocity—as opposed to relying on jQuery's $.delay() function to change\
    \ when a Velocity starts:\n\n```\n// Wait 100ms before animating opacity toward\
    \ 0\n$element.velocity({ opacity: 0 }, { delay: 100 });\n```\n\nYou can set the\
    \ delay option with the loop option to create a pause between loop alternations:\n\
    \n```\n// Loop four times, waiting 100ms between each loop\n$element.velocity({\
    \ height: \"+=50px\" }, { loop: 4, delay: 100 });\n```\n\n# DISPLAY AND VISIBILITY\n\
    \nVelocity's display and visibility options correspond directly to their CSS counterparts,\
    \ and accept the same values: \"none\", \"inline\", \"inline-block\", \"block\"\
    , \"Flex\", and so on. In addition, Velocity allows for a value of \"auto\", which\
    \ instructs Velocity to set the display property to its element's default value.\
    \ (For reference, anchors and spans default to \"inline\", whereas divs and most\
    \ other elements default to \"block.\") Velocity's visibility option, like its\
    \ CSS counterpart, accepts the \"hidden\", \"visible\", and \"collapse\" values.\n\
    \nWithin Velocity, when the display option is set to \"none\" (or visibility is\
    \ set to \"hidden\"), the element's CSS property is set accordingly the animation\
    \ has completed. This effectively works to hide an element upon completion of\
    \ an animation, and is useful in animating an element's opacity down to 0 (where\
    \ the intention is to fade an element off the page):\n\n```\n// Fade an element\
    \ to opacity: 0 then remove it from the page's flow\n$element.velocity({ opacity:\
    \ 0 }, { display: \"none\" });\n```\n\n> NOTE: The code above effectively replaces\
    \ the jQuery equivalent:\n$element.animate({ opacity: 0 })\n.hide();\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_41_0.png)\n\
    \n# QUICK REVIEW OF VISIBILITY AND DISPLAY\n\nFor reference, the CSS display property\
    \ dictates how an element affects the positioning of the elements surrounding\
    \ it and contained within it. In contrast, the CSS visibility property exclusively\
    \ affects whether an element can be seen. If an element is set to \"visibility:\
    \ hidden\", it will continue to take up space on the page, but its space will\
    \ be represented by an empty gap—no part of the element will be seen. If an element\
    \ is instead set to \"display: none\", the element will be fully removed from\
    \ the page's flow, and all elements within and around it will fill into the removed\
    \ element's space as if the element never existed.\n\nNote that, instead of removing\
    \ an element from the page's flow, you can simply mark the element as both invisible\
    \ and non-interactive by setting its visibility to \"hidden\". This is useful\
    \ for when you want a hidden element to continue taking up space on the page:\n\
    \n```\n// Fade element to opacity:0 then make it non-interactive\n$element.velocity({\
    \ opacity: 0 }, { visibility: \"hidden\" });\n```\n\nNow, let's consider animations\
    \ in the opposite direction (showing elements instead of hiding elements): When\
    \ display or visibility is set to a value other than \"none\" or \"hidden\", the\
    \ value is set **before** the animation begins so the element is visible throughout\
    \ the duration of the ensuing animation. In other words, you're undoing the hiding\
    \ that occurred when the element was previously removed from view.\n\nBelow, display\
    \ is set to \"block\" before the element begins fading in:\n\n```\n$element.velocity({\
    \ opacity: 1 }, { display: \"block\" });\n```\n\nThis effectively replaces the\
    \ jQuery equivalent:\n\n```\n$element\n.show()\n.animate({ opacity: 0 });\n```\n\
    \n> TIP: For a complete overview of Velocity animation options, consult the documentation\
    \ at VelocityJ5.org.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_42_0.png)\n\n\
    # CONTAINING ANIMATION LOGIC\n\nAs with Velocity's delay option, Velocity's incorporation\
    \ of display and visibility setting allows for animation logic to be fully contained\
    \ within Velocity. In production code, whenever an element is faded into or out\
    \ of view, it's almost always accompanied by a change in visibility. Leveraging\
    \ shorthands like these helps you keep your code clean and maintainable, since\
    \ it's less dependent on external functions and free of repetitive helper functions\
    \ that bloat animation logic.\n\nNote that Velocity includes shorthands for the\
    \ opacity toggling animations demonstrated above. They function identically to\
    \ fadeIn and fadeOut functions. You pass the corresponding command into Velocity\
    \ as the first argument, and you pass in an options object, if desired, as normal:\n\
    \n```\n$element.velocity(\"fadeIn\", { duration: 1000 });\n```\n\n```\n$element.velocity(\"\
    fadeOut\", { duration: 1000 });\n```\n\n# USING VELOCITY: ADDITIONAL FEATURES\n\
    \nAdditional Velocity.js features that are worthy of note include: the reverse\
    \ command, scrolling, colors, and transforms (translation, rotate, and scale).\n\
    \n# REVERSE COMMAND\n\nTo animate an element back to the values prior to its last\
    \ Velocity call, pass in \"reverse\" as Velocity's first argument. The reverse\
    \ command behaves identically to a standard Velocity call; it can take options\
    \ and is queued up with other chained Velocity calls.\n\nReverse defaults to the\
    \ options (duration, easing, etc.) used in the element's prior Velocity call.\
    \ However, you can override these options by passing in a new options object:\n\
    \n```\n// Animate back to the original values using the prior Velocity call's\
    \ options\n$element.velocity(\"reverse\");\n```\n\nor\n\n```\n// Do the same as\
    \ above, but replace the prior call's duration with a value of 2000ms\n$element.velocity(\"\
    reverse\", { duration: 2000 });\n```\n\n> NOTE: The previous call's begin and\
    \ complete options are ignored by the reverse command; reverse never re-calls\
    \ callback functions.\n\n# SCROLLING\n\nTo scroll the browser to the top edge\
    \ of an element, pass in \"scroll\" as Velocity's first argument. The scroll command\
    \ behaves identically to a standard Velocity call; it can take options and is\
    \ queued up with other chained Velocity calls:\n\n```\n$element\n.velocity(\"\
    scroll\", { duration: 1000, easing: \"spring\" })\n.velocity({ opacity: 1 });\n\
    ```\n"
