    Since the stagger option works with UI pack effects, this example shows the effect
    that

    mrors animating opacity to a value only of 1.


    As discussed in Chapter 3, "Motion Design Theory," be careful to keep stagger
    times

    to a lower duration so users aren''t waiting needlessly while text fades into
    view. Keep

    mind that the longer an element''s word count, the greater the overall time an
    anima-

    sequence will take to complete. Text staggering is one of the easiest ways

    lip into the bad practice of slowing down your interface.


    # TRANSITIONING TEXT OUT OF VIEW


    The code example in the previous section only animated text—not out of—view;

    the div preexisting text was immediately replaced by the new message. This doesn''t

    necessarily make for poor motion design, but it is often beneficial from the perspective

    of motion design theory to unify animations such that an element fades out of
