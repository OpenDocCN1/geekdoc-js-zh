    # FORCE-FEEDING


    Traditionally, animation engines query the DOM at the start of an animation to
    determine the initial value of each CSS property being animated. Velocity offers
    a workaround to this page-querying through a feature called *force-feeding*. With
    force-feeding, you explicitly define your animations'' start values so that these
    upfront frets are eliminated.


    Force-fed start values are passed in the second item in an array that takes the
    place of a property''s value in an animation properties map. The first item in
    the array is the standard end value that you''re animating toward.'
- md: "\nConsider the following two animation examples, both of which are triggered\
    \ upon page load:\n\n```\n// Animate translateX to 500px from a start value of\
    \ 0\n$element.velocity({ translateX: [ 500, 0 ] });\n// Animate opacity to 0 from\
    \ a start value of 1\n$element.velocity({ opacity: [ 0, 1 ]});\n```\n\nIn the\
    \ first example, you're passing translateX a force-fed start value of 0 since\
    \ you know that the element has yet to be translated (since the page has just\
    \ loaded). You're force-feeding in what you know (or want) the original property\
    \ value to be. Further, in the second example, the element's current opacity is\
    \ 1 because that's the default value for opacity and you haven't modified the\
    \ element in any way. In short, with force-feeding, you can reduce the browser's\
    \ workload in situations where you have an understanding of how elements are styled.\n\
    \n![](img/556d1045d4d84ff85ee82fbcd7feb49f_139_0.png)\n\n> NOTE: Force-fed animation\
    \ properties only when they're first used in an animation chain, not when they\
    \ occur subsequently in the chain, since Velocity already does internal caching:\n\
    $element\n// Optionally forcefeed here\n.velocity({ translateX: [ 500, 0 ] })\n\
    // Do not forcefeed here; 500 is internally cached\n.velocity({ translateX: 1000\
    \ });\n\nForce-feeding is an invaluable feature for high-stress situations as\
    \ animating a large number of elements once on a desktop browser or when dealing\
    \ with low-powered mobile devices for which every page interaction incurs a noticeable\
    \ delay.\n\nHowever, for most real-world UI animation situations, force-feeding\
    \ is an unnecessary optimization that makes your code less maintainable due to\
    \ having to update the force-fed start values whenever you change the elements'\
    \ values within CSS stylesheets.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_139_1.png)\n\
    \n> NOTE: Refer to Chapter 8, \"Animation Demo,\" to walk through an application\
    \ of force-feeding.\n\n## TECHNIQUE: BATCH DOM ADDITIONS\n\nLike reducing layout\
    \ thrashing, batching DOM additions is another performance technique to avoid\
    \ unoptimized interaction with the browser.\n\n## PROBLEM\n\nYou're not done with\
    \ gets and sets just yet! A common page set is the insertion of new DOM elements\
    \ at run-time. While there are many uses for adding new elements to a page, perhaps\
    \ the most popular is infinite scrolling, which consists of elements continuously-animating\
    \ into view at the bottom of a page while the user scrolls down.\n\nAs learned\
    \ in the previous section, browsers have to compute the composition of all affected\
    \ elements whenever a new element is added. This is a relatively slow process.\
    \ When DOM insertion is performed many times per second, the page is hit with\
    \ a significant performance impact. Fortunately, when processing multiple elements,\
    \ browsers can optimize page set if all elements are inserted at the same time.\
    \ Unfortunately, as developers often unintentionally forgo this optimization by\
    \ separating our DOM insertions. Consider the following example of unoptimized\
    \ DOM insertion code:\n\n```javascript\n// Bad practice\nvar $body = \"$(body)\"\
    ;\nvar $newElements = [ \"<<div>>Div 1</</div>>\", \"<<div>>Div 2</</div>>\",\n\
    \  \"<<div>>Div 3</</div>>\" ];\n$newElements.each(function(i, element) {\n  $(element).appendTo($body);\n\
    \  // Other arbitrary code\n});\n```\n\nThis iterates through a set of element\
    \ strings that are instantiated into element objects (without a performance drawback\
    \ since you're not querying the DOM for each JEO). Each element is then inserted\
    \ into the page using jQuery's appendTo().\n\nHere's the problem: even if additional\
    \ code exists after the appendTo() statement, the browser won't compress DOM sets\
    \ into a single insertion operation because it can't be certain that asynchronous\
    \ code operating outside the loop won't alter the DOM's state between insertions.\
    \ For example, if you queried the DOM to find how many elements exist on the page\
    \ after each insertion:\n\n```javascript\n// Bad practice\n$newElements.each(function(i,\
    \ element) {\n  $(element).appendTo($body);\n  // Output how many children the\
    \ body element has\n  console.log($body.children().size());\n});\n```\n\nThe browser\
    \ couldn't possibly optimize the DOM insertions into a single operation because\
    \ the code explicitly asks the browser to tell us the accurate of elements that\
    \ exist before the next loop begins. For the browser to return the correct count\
    \ each time, it can't have batched all insertions upfront.\n\nIn conclusion, when\
    \ you perform DOM element insertion inside a loop, each insertion happens independently\
    \ of any others, resulting in a notable performance sacrifice.\n\n## SOLUTION\n\
    \nInstead of individually inserting new elements into the DOM, construct the full\
    \ element set in memory, then insert it via a single call to appendTo(). The optimized\
    \ version of the code shown in the section above now looks like this:\n\n```javascript\n\
    // Optimized\nvar $body = \"$(body)\";\nvar $newElements = [ \"<<div>>Div 1</</div>>\"\
    , \"<<div>>Div 2</</div>>\",\n  \"<<div>>Div 3</</div>>\" ];\nvar html = \"\"\
    ;\n$newElements.each(function(i, element) {\n  html += element;\n});\n$(html).appendTo($body);\n\
    ```\n\nThis concatenates the string representation of each HTML element onto a\
    \ master string that is then turned into a JEO and appended into the DOM in a\
    \ single shot. In this way, the browser is given to isolate elements' changes\
    \ from one another. As you'll see in the remainder of this chapter, you simply\
    \ have to train your eye to know them them.\n\n## TECHNIQUE: AVOID AFFECTING NEIGHBORING\
    \ ELEMENTS\n\nIt's important to consider the impact of animation on neighboring\
    \ elements.\n\n## PROBLEM\n\nWhen an element's dimensions are animated, it often\
    \ affects the positioning of siblings. Another example is animating a child element\
    \ inside a parent that doesn't have defined width and height. Accordingly, when\
    \ the child is animated, the parent will also resize itself so that's even more\
    \ work for the browser to perform upon each tick.\n\nThere are many CSS properties\
    \ whose modification can result in dimensional and positional adjustments to neighboring\
    \ elements, including top, right, bottom, and left; all margin and padding properties;\
    \ border thickness; and the width and height.\n\nAs a performance-minded developer,\
    \ you need to appreciate the impact... ask yourself how property you're attempting\
    \ to animate affects neighboring elements. If there's a way to rewrite your code\
    \ such that you can isolate elements, then consider doing so.\n\n## SOLUTION\n\
    \nThe simple solution to avoid affecting neighboring elements is to animate the\
    \ CSS transform properties (translateX, translateY, scaleX, scaleY, rotateZ, rotateX,\
    \ and rotateY) whenever possible. The transform properties are unique in they\
    \ elevate targeted elements to isolated layers that are rendered separately from\
    \ the rest of the page (with a performance boost courtesy of your GPU), so that\
    \ neighboring elements aren't affected. For example, when animating an element\
    \ translateX to a value of \"500px\", the element will move 500px rightward without\
    \ superposing itself on top of whatever exists along its animation path. If there\
    \ are no elements along its path (that is, if there are no nearby elements for\
    \ it to affect), then using translateX will have the same net effect on the look\
    \ of your page as if you had animated the much slower property.\n\nHence, whenever\
    \ possible, an animation that once looked like this:\n\n```javascript\n// Move\
    \ the element 500px from the left\n$element.velocity({ left: \"500px\" });\n```\n\
    \nshould be refactored into this:\n\n```javascript\n// Faster: Use translateX\n\
    $element.velocity({ translateX: \"500px\" });\n```\n\nSimilarly, if you can substitute\
    \ translateY for top, do so:\n\n```javascript\n$element.velocity({ top: \"100px\"\
    \ });\n```\n\n// Faster: Use translateY\n\n```javascript\n$element.velocity({\
    \ translateY: \"100px\" });\n```\n\n> NOTE: Sometimes you actually intend to use\
    \ left or top so that neighboring elements' positions are changed. In all other\
    \ cases, get into the habit of using the transform properties. The performance\
    \ impact is significant.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_143_0.png)\n"
  mdcn: "\n\n考虑以下两个动画示例，它们都会在页面加载时触发：\n\n```\n// 将 translateX 从起始值 0 动画到 500px\n$element.velocity({\
    \ translateX: [ 500, 0 ] });\n// 将 opacity 从起始值 1 动画到 0\n$element.velocity({ opacity:\
    \ [ 0, 1 ]});\n```\n\n在第一个示例中，你为 translateX 传递了一个强制指定的（force-fed）起始值 0，因为你知道该元素尚未被移动（因为页面刚刚加载）。你正在强制输入你所知的（或希望的）原始属性值。此外，在第二个示例中，元素的当前透明度为\
    \ 1，因为这是透明度的默认值，且你没有对元素进行任何修改。简而言之，在对元素样式样式有了解的情况下，通过强制指定可以减少浏览器的负载。\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_139_0.png)\n\
    \n> 注意：强制指定的动画属性（force-fed animation properties）仅在动画链中首次使用时生效，而不是在链中后续出现时生效，因为\
    \ Velocity 已经执行了内部缓存：\n$element\n// 可选在此处强制指定\n.velocity({ translateX: [ 500,\
    \ 0 ] })\n// 不要在此处强制指定；500 已在内部缓存\n.velocity({ translateX: 1000 });\n```\n\n强制指定是高压力场景下的一个无价的功能，因为在桌面浏览器上一次性动画大量元素，或者在处理低功耗移动设备时，每次页面交互都会产生明显的延迟。\n\
    \n然而，对于大多数真实世界中的 UI 动画场景，强制指定是一种不必要的优化，因为每当你更改 CSS 样式表中的元素值时，就必须更新强制指定的起始值，这会导致代码的可维护性降低。\n\
    \n![](img/556d1045d4d84ff85ee82fbcd7feb49f_139_1.png)\n\n> 注意：参考第 8 章“动画演示”以了解强制指定的应用。\n\
    \n## 技巧：批量添加 DOM 元素\n\n与减少布局抖动（layout thrashing）一样，批量添加 DOM 元素是另一种避免与浏览器进行非优化交互的性能技术。\n\
    \n## 问题\n\n你还没有完成获取和设置操作！常见的页面设置是在运行时插入新的 DOM 元素。虽然向页面添加新元素有许多用途，但最流行的用法可能是无限滚动，它由元素在用户向下滚动时不断在页面底部通过动画进入视口组成。\n\
    \n正如上一节所学，每当添加一个新元素时，浏览器都必须计算所有影响元素的组合。这是一个相对缓慢的过程。当每秒执行多次 DOM 插入时，页面会受到严重的性能影响。幸运的是，当处理多个元素时，如果所有元素都同时插入，浏览器可以优化页面设置。遗憾的是，开发者经常通过分离\
    \ DOM 插入而无意中放弃了这种优化。考虑以下未优化的 DOM 插入代码：\n\n```javascript\n// 坏做法\nvar $body = \"\
    $(body)\";\nvar $newElements = [ \"<<div>>Div 1</</div>>\", \"<<div>>Div 2</</div>>\"\
    ,\n  \"<<div>>Div 3</</div>>\" ];\n$newElements.each(function(i, element) {\n\
    \  $(element).appendTo($body);\n  // 其他任意代码\n});\n```\n\n这遍历了一组元素字符串，这些字符串被实例化为元素对象（没有性能开销，因为你没有为每个\
    \ JEO 查询 DOM）。然后每个元素都使用 jQuery 的 `appendTo()` 插入到页面。\n\n问题在于：即使在 `appendTo()`\
    \ 语句之后存在额外代码，浏览器也不会将 DOM 设置合并为单次插入操作，因为无法确定在循环之外的异步代码不会在插入之间更改 DOM 的状态。例如，如果你在每次插入后都查询\
    \ DOM 以查找页面上存在多少个元素：\n\n```javascript\n// 坏做法\n$newElements.each(function(i, element)\
    \ {\n  $(element).appendTo($body);\n  // 输出 body 元素拥有多少个子元素\n  console.log($body.children().size());\n\
    });\n```\n\n浏览器无无可能将 DOM 插入优化为单个操作，因为代码显式地要求浏览器告诉我们在下次循环开始之前存在的元素准确数量。为了让浏览器每次都返回正确的计数，它不能提前批量处理插入。\n\
    \n结论，当你在循环内部执行 DOM 元素插入时，每次插入都是独立于其他插入的，导致了显著的性能牺牲。\n\n## 解决方案\n\n与其逐个将新元素插入 DOM，不如在内存中构建完整的元素集，然后通过单次调用\
    \ `appendTo()` 进行插入。上面部分代码的优化版本现在如下：\n\n```javascript\n// 优化后\nvar $body = \"\
    $(body)\";\nvar $newElements = [ \"<<div>>Div 1</</div>>\", \"<<div>>Div 2</</div>>\"\
    ,\n  \"<<div>>Div 3</</div>>\" ];\nvar html = \"\";\n$newElements.each(function(i,\
    \ element) {\n  html += element;\n});\n$(html).appendTo($body);\n```\n\n这会将每个\
    \ HTML 元素的字符串表示连接到一个主字符串上，然后该字符串被转换为 JEO 并一次性附加到 DOM。通过这种方式，浏览器可以将元素之间的更改相互隔离。正如你在本章的剩余部分看到的，你只需要训练你的眼睛来识别它们。\n\
    \n## 技巧：避免影响相邻元素\n\n考虑动画对相邻元素的影响很重要。\n\n## 问题\n\n当元素的尺寸发生动画变化时，它通常会影响兄弟元素的定位。另一个例子是在没有定义宽度和高度的父元素内部对子元素进行动画。因此，当子元素进行动画时，父元素也会调整自身的大小，这使得浏览器在每一帧（tick）都要执行更多工作。\n\
    \n许多 CSS 属性的修改都会导致相邻元素的尺寸和位置调整，包括 top、right、bottom 和 left；所有的 margin（外边距）和 padding（内边距）属性；border\
    \ 厚度以及宽度和高度。\n\n作为一个关注性能的开发者，你需要意识到影响……问问你自己正尝试动画的属性如何影响相邻元素。如果有一种重写代码的方法可以隔离元素，那么请考虑这样做。\n\
    \n## 解决方案\n\n避免影响相邻元素的简单解决方案是尽可能使用 CSS `transform` 属性（translateX、translateY、scaleX、scaleY、rotateZ、rotateX\
    \ 和 rotateY）。`transform` 属性的独特之处在于它们将目标元素提升到隔离层，与页面的其他部分分开渲染（得益于 GPU 加速），从而不会影响相邻元素。例如，当将一个元素\
    \ `translateX` 动画到 \"500px\" 时，元素将向右移动 500px，而不会覆盖在其动画路径上的任何内容。如果其路径上没有元素（即没有邻近元素受其影响），那么使用\
    \ translateX 对页面的视觉效果将与你动画速度慢得多的属性相同。\n\n因此，在可能的情况下，曾经像这样的动画：\n\n```javascript\n\
    // 将元素向左移动 500px\n$element.velocity({ left: \"500px\" });\n```\n\n应该被重构为：\n\n\
    ```javascript\n// 更快：使用 translateX\n$element.velocity({ translateX: \"500px\"\
    \ });\n```\n\n同样，如果你可以用 `translateY` 代替 `top`，请这样做：\n\n```javascript\n$element.velocity({\
    \ top: \"100px\" });\n```\n\n// 更快：使用 translateY\n\n```javascript\n$element.velocity({\
    \ translateY: \"100px\" });\n```\n\n> 注意：有时你确实打算使用 left 或 top 以改变相邻元素的位置。在所有其他情况下，请养成使用\
    \ transform 属性的习惯。性能影响是显著的。\n\n"
