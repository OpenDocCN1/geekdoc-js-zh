- md: "\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_133_0.png)\n\nIf your gut reaction,\
    \ \"It’s not my problem—my app is just for the tech-savvy middle-class in the\
    \ developed world,\" rest assured that your evil web developer twin is sitting\
    \ two thousand miles away cackling at the thought of getting to a nascent market\
    \ before you do actually putting in the effort necessary to deliver great experiences\
    \ on low-powered devices. (There’s actually an enormous conglomerate dedicated\
    \ to this—search Google for \"Rocket Internet.\")\n\nThere's another nasty reality\
    \ to sidelining performance concerns: we systematically make the mistake of testing\
    \ our sites on devices operating under ideal loads. In reality, of course, users\
    \ have multiple apps and browser tabs running concurrently. Their devices are\
    \ working overtime to process a dozen tasks at any given time. Accordingly, the\
    \ performance baseline established for your app probably doesn't reflect its performance\
    \ in the real world. Yikes!\n\nBut, fear not, keen developer. It's time to explore\
    \ the performance techniques at your disposal and level up your animation game.\n\
    \n## TECHNIQUE: REMOVE LAYOUT THRASHING\n\nLayout thrashing—the lack of synchronization\
    \ in DOM manipulation—is the 800-pound gorilla in animation performance. There's\
    \ no painless solution, but there are best practices. Let's explore.\n\n### PROBLEM\n\
    \nConsider webpage manipulation consists of setting and getting: you can set (update)\
    \ or get (query) an element's CSS properties. Likewise, you can insert new elements\
    \ onto a page (set) or query for a set of existing elements (get). Gets and sets\
    \ are the core browser processes that incur performance overhead (another is graphical\
    \ rendering). Think of it this way: setting new properties on an element, the\
    \ browser has to calculate the results of your changes. For example, changing\
    \ the width of one element can trigger a chain reaction in which the width of\
    \ the element's parent, siblings, and children elements must also change depending\
    \ on their respective CSS properties.\n\nThe UI performance reduction that occurs\
    \ from alternating sets with gets is called layout thrashing. While browsers are\
    \ highly optimized for page-layout recalculations, the extent of their optimizations\
    \ is greatly diminished by layout thrashing. Performing a series of gets at once,\
    \ for example, can be easily optimized by the browser into a single, streamlined\
    \ operation because the browser can cache the page's state after the first get,\
    \ then reference that state for each subsequent get. However, repeatedly performing\
    \ one get by one forces the browser to do a lot of heavy lifting since its cache\
    \ is continuously invalidated by the changes made by set.\n\nThis performance\
    \ impact is exacerbated when layout thrashing occurs within an animation loop.\
    \ Consider how an animation loop aims to achieve 60 frames per second, the threshold\
    \ at which the human eye perceives buttery-smooth motion. What this means is that\
    \ every tick in an animation loop must complete within 16.7ms (1 second/60 ticks\
    \ ~= 16.67ms). Layout thrashing is a very easy way to cause each tick to exceed\
    \ this limit. The end result, of course, is that your animation will stutter (or\
    \ jank, animation parlance).\n\nWhile some animation engines, such as Velocity.js,\
    \ contain optimizations to reduce the occurrence of layout thrashing inside their\
    \ own animation loops, be careful to avoid layout thrashing in your own loops,\
    \ as the code inside a setInterval() or a self-invoking setTimeout().\n\n### SOLUTION\n\
    \nAvoiding layout thrashing consists of simply batching together DOM sets and\
    \ DOM gets. The following code causes layout thrashing:\n\n- // Bad practice\n\
    \n```\nvar currentTop = $(\"element\").css(\"top\"); // Get\n$(\"element\").style.top\
    \ = currentTop + 1; // Set\nvar currentleft = $(\"element\").css(\"left\"); //\
    \ Get\n$(\"element\").style.left = currentLeft + 1; // Set\n```\n\nIf you rewrite\
    \ the code so that all queries and updates are aligned, the browser can batch\
    \ the respective actions and reduce the extent to which code causes layout thrashing:\n\
    \n```\nvar currentTop = $(\"element\").css(\"top\"); // Get\nvar currentLeft =\
    \ $(\"element\").css(\"left\"); // Get\n$(\"element\").css(\"top\", currentTop\
    \ + 1); // Set\n$(\"element\").css(\"left\", currentLeft + 1); // Set\n```\n\n\
    The illustrated problem is commonly found in production code, particularly in\
    \ situations where UI operations are performed depending on the current value\
    \ of an element's CSS property.\n\nSay your goal is to toggle the visibility of\
    \ a side menu when a button is clicked. To accomplish this, you might first check\
    \ to see if the side menu has its display property set to either \"none\" or \"\
    block\", then you'd proceed to alternate the value as appropriate. The process\
    \ of checking for the display property constitutes a get, and whichever action\
    \ is subsequently taken to show or hide the side menu will constitute a set.\n\
    \nThe optimized implementation of this code would entail maintaining a variable\
    \ in memory that is updated whenever the button is clicked, and checking that\
    \ variable for the side menu's current status before toggling its visibility.\
    \ In this way, the get can be skipped altogether, which reduces the likelihood\
    \ of the code producing a set alternated with a get. Further, beyond reducing\
    \ the likelihood of layout thrashing, the UI now also benefits from having one\
    \ line per page. Keep in mind that each set and get is a relatively expensive\
