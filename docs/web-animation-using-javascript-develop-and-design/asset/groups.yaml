    \ world is adopting fall short of performance of the latest iPhones in our pockets.\
    \ Do you really want to forsake building products for the next few people coming\
    \ online? The upcoming Firefox OS initiative is poised to bring capable smartphones\
    \ to hundreds of millions of people, so we're not simply waxing poetic about hypot.\
    \ The mobile revolution is here now.\n\nNOTE: Ericsson has reported that the global\
    \ smartphone subscriber count will rise from 1.9 billion to 5.9 billion in the\
    \ next five years—fueled almost exclusively by the developing world.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_132_0.png)\n"
  mdcn: "\n\n# 对 SVG 的支持\n\nSVG 元素动画的开箱支持并不完美：无论是 jQuery 还是 CSS 都无法对动画 SVG 特有的样式属性和呈现属性（present\
    \ attributes）提供完整支持。此外，CSS 过渡在 Internet Explorer 9 上完全无法动画 SVG 元素，且在任何版本的 Internet\
    \ Explorer 中都无法使用 CSS 为 SVG 元素应用变换动画。\n\n为了获得全面的 SVG 动画支持，请使用专用的 SVG 库或内置支持 SVG\
    \ 元素的动画库。一个值得关注的专用 SVG 库是 Snap.svg。你可能不会感到惊讶的是，你在本书中一直使用的 JavaScript 动画库 Velocity.js\
    \ 为 SVG 元素动画提供了全方位支持。\n\n> 注意：前往 SnapSVG.io 下载 Snap.svg 库。\n\n# SVG 动画\n\nSVG\
    \ 元素可能永远不会成为你 UI 的骨干，但它们非常适合用于点缀页面中通常填充静态图像的部分。SVG 的用途包括：\n\n- 当用户悬停和点击时触发的具有复杂动画序列的按钮。\n\
    - 独特的加载状态图形，取代那些随处可见旋转指示器 GIF。\n- 公司 Logo，其各个部分在页面加载时共同进行动画处理。\n\n最后这个用例将在本章稍后的部分进行详细探讨。\n\
    \n# 传递属性\n\n使用 Velocity，SVG 属性的动画方式与标准 CSS 属性相同。将相应的属性及其期望的结束值传入 Velocity 的属性对象中：\n\
    \n```javascript\n// 将 SVG 元素动画到红色填充和黑色描边\n$svgElement.velocity({ fill: \"#ff0000\"\
    , stroke: \"#000000\" });\n```\n\n相比之下，请注意下面的代码将无法运行，因为 SVG 元素不支持以下 CSS 属性：\n\n\
    ```javascript\n// 错误：这些属性不适用于 SVG 元素\n$svgElement.velocity({ border: \"5px\",\
    \ borderColor: \"#000000\" });\n```\n\n# 呈现属性\n\n在本章之前探讨的呈现属性也可以按预期进行动画处理：\n\n\
    ```javascript\n// 动画矩形的 x 和 y 坐标\n$(\"rect\").velocity({ x: 100, y: 100 });\n\
    // 动画圆的 cx 和 cy 坐标\n$(\"circle\").velocity({ cx: 100, cy: 100 });\n// 动画矩形的尺寸\n\
    $(\"rect\").velocity({ width: 200, height: 200 });\n// 动画圆的半径\n$(\"circle\").velocity({\
    \ r: 100 });\n```\n\n你目前使用的所有 Velocity 属性功能——动画反转、UI 包特效、序列触发等——在 SVG 元素上的工作方式都符合预期。\n\
    \n# 位置属性 vs. 变换（TRANSFORMS）\n\n你可能会好奇，在指定 SVG 元素的位置时，使用 x、y 和 y 位置属性而不是 CSS 变换（例如\
    \ translateX, translate）有什么区别。答案是浏览器支持问题。Internet Explorer（包括 Internet Explorer\
    \ 11 在内）不支持 SVG 元素上的 CSS 变换。考虑以下情况：\n\n- x 和 y 属性在所有 SVG 元素支持的地方都有效（IE8+, Android\
    \ 3+）\n$(\"rect\").velocity({ x: 100, y: 100 });\n- 或者，位置变换（如 translateX 和 translateY）在\
    \ *Internet Explorer 之外*的所有地方都有效\n$(\"rect\").velocity({ translateX: 100, translateY:\
    \ 100 });\n\n> 注意：虽然由于硬件加速，变换已知具有很高的性能（在第 7 章“动画性能”中阅读更多内容），但两种 SVG 动画方法都一样快，因为\
    \ SVG 图形默认由硬件加速驱动。\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_124_0.png)\n\n\
    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_125_0.png)\n\n# 实现示例：动画 Logo\n\n加载时动画化到位置的高分辨率网站\
    \ Logo 是 SVG 实现的理想目标。假设你想粗略地复制万事 Logo，它由两个不同颜色的重叠圆组成。如果你想用 Velocity 将此 Logo 动画化到位，你将从定义如下的\
    \ SVG 画布开始：\n\n```xml\n<svg version=\"1.1\" width=\"500\" height=\"500\" xmlns=\"\
    http://www.w3.org/2000/svg\">\n  <circle id=\"circleleft\" cx=\"100\" cy=\"100\"\
    \ r=\"30\" style=\"fill: red\" />\n  <circle id=\"circleRight\" cx=\"100\" cy=\"\
    100\" r=\"30\" style=\"fill: orange\" />\n</svg>\n```\n\n这创建了两个半径相同的重叠圆。接下来，你让圆从原点向外移动，这样它们在动画化时就可以稍微重叠：\n\
    \n```javascript\n// 将一个圆向左移动\n$(\"#circleleft\").velocity({ cx: \"-15px\" }, {\
    \ easing: \"spring\" });\n// 将另一个圆向右移动\n$(\"#circleRight\").velocity({ cx: \"\
    +15px\" }, { easing: \"spring\" });\n```\n\n在这里，左圆移动了 15 像素（使用 \"-\" 运算符减少圆的当前值），右圆移动了\
    \ 15 像素。弹簧缓动（spring easing）通过让圆以弹性的力道相互弹开增添了趣味性。\n\n由于 SVG 元素可以监听鼠标事件（点击、悬停等），你可以通过将其转换为\
    \ SVG 交互来改进这一点：\n\n```javascript\n// 当鼠标悬停时触发动画\n$(\"svg\").on(\"mouseover\",\
    \ function() {\n  $(\"#circleleft\").velocity({ cx: \"-15px\" }, { easing: \"\
    spring\" });\n  $(\"#circleRight\").velocity({ cx: \"+15px\" }, { easing: \"spring\"\
    \ });\n});\n```\n\n由于 SVG 元素可以监听鼠标事件，你可以通过将其转换为 SVG 交互来改进这一点。关于性能的性能问题，请在第 7 章“动画性能”中阅读更多内容。\n\
    \n"
