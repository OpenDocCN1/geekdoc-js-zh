    It''s a special time when a developer first discovers jQuery''s .animate(). I
    remember trying to animate any part of the page that wasn''t bolted to the main
    content. I created accordions, fly-out menus, hover effects, scroll transitions,
    magical reveals, and parallax sliders. Turning my websites from code, static contents
    into moving, visual experiences felt like I was reaching another level as a web
    designer. But it was just bells and whistles. I realize now that for all the animation
    added, I hadn''t actually improved the user experience of my websites.


    All the time, it was thrilling. So what makes animation so exciting?


    My apartment looks over downtown Brooklyn. I see people walk down the street.
    Plumes from smokestacks billow up. Pigeons flutter to a ledge. A construction
    crane raises a section of a building. A single, heart-shaped balloon floats into
    the Brooklyn sky (corny, I know, but literally saw this happen twice). Cars drive
    over the Williamsburg Bridge. Clouds pass overhead.


    The world is in motion.


    This is how you expect the universe to work. Things like the movements outside
    my window, each one is a one-sentence story. Together they tell the larger story
    of what is happening.


    Yet this is not how digital interfaces work. Those little stories are missing.
    When things change, you have to fill in the story for yourself. When you press
    the Next button at an ATM, the screen suddenly changes. Did it move forward successfully?
    Was there an error? You have to read the screen again to interpret the results
    of your action. Using motion removes this leap of understanding between interactions.
    Motion inherently communicates what has changed. It''s like writing stories between
    states.


    When a slide transition takes you to the next screen, animation helps you understand
    what just happened. Wielding this power is what makes animation so thrilling.
    Like layout, color, and typography, animation helps you shape and direct the user
    experience. Animation is more than just making things move. It''s designing more
    effective, and doing it thoughtfully.


    Unfortunately, in the history of web animation, thoughtfulness hasn''t always
    been the highest priority. As developers, we''ve used Flash, animated GIFs, Java
    applets, marquee-tags, and more recently, CSS, JavaScript, and SVG to create animation
    that''s been, at best, a level of polish or, at worst, a gimmick. The idea of
    creating animation that''s both high-performance and user-friendly is relatively
    new.


    So it''s a good thing you have this book in front of you. Julian Shapiro is one
    of the principal experts on animation on the web. In creating and supporting Velocity.js,
    he has developed an intimate knowledge of all the quirks and advantages of using
    motion on websites. Web Animation using JavaScript will give you not only the
    technical know required to implement animation in your websites, but, more importantly,
    the insights you''ll need to use animation effectively and craft compelling user
    experiences.


    Animation libraries and technologies have made motion design more accessible than
    ever. But not every developer abides by best practices. The past couple of years
    have seen several trendy anti-patterns come and go. Scroll behavior has been hijacked.
    Mobile navigation has been pushed into menus accessible only via gestures. While
    adding animation is within the grasp of anyone who stumbles across .animate(),
    utilizing it to improve the user experience is one of the hallmarks of a dedicated
    developer. This book will help you become one of them.


    David DeSandro

    February 2015

    Brooklyn, New York


    > David DeSandro is the founder of Metafizzzy and author/developer of Masonry
    and Isotope.


    # INTRODUCTION


    In the early days of the web, animation was primarily used by novice developers
    as a last-ditch effort to call attention to important parts of a page. And even
    if they wanted animation to transcend its niche, it couldn''t: browsers (and computers)
    were simply too slow to deliver smooth web-based animation.


    We''ve come a long way since the days of flashing banner ads, scrolling news tickers,
    and Flash videos. Today, the stunning motion design of iOS and Android dramatically
    improves the user experience—instead of detracting from it. Developers of the
    best sites and leverage animation to improve the feel and intuitiveness of their
    user interfaces. Animation''s rise to relevancy is just a by-product of improved
    processing power; it reflects a better appreciation for best practices within
    the development community. The tools you use to make a website are now considered
    less important than the quality of the resulting user experience. As obvious as
    this seems, it wasn''t always the case.


    So, what makes animation in particular so useful? Whether it''s transitioning
    between chunks of content, designing intricate loading sequences, or alerting
    the user what to do, animation complements text and layout to reinforce your site''s
    intended behavior, personality, and visual sophistication. Does your content bounce
    into view in a friendly way, or does it whip across the screen? This is the domain
    of motion design, and the decisions you make will establish the transcendent feeling
    of your app.


    When users recommend your app to others, they''ll often try to describe it with
    words like "sleek" or "polished." What they don''t realize is that they''re mostly
    referring to the motion design work that''s gone into the interface. This inability
    of the layman to make the distinction is precisely what great user interface (UI)
    designers strive for: animations that reinforce the interface''s objectives but
    do not divert the user''s attention.


    This book provides you with the foundation necessary to implement animation confidently
    and in a way that''s both technically maintainable and visually impactful. Throughout,
    it considers the balance between enriching a page with motion design and avoiding
    unnecessary flourishes.


    Why is all of this so important? Why is it worth your time to perfect your transitions
    and easing combinations? For the same reason that designers spend hours perfecting
    their font and color combinations: refined products simply feel superior. They
    leave users whispering to themselves, “Wow, this is cool,” right before they turn
    to a friend and exclamation, “You gotta see this!”


    **NOTE:** If you''re unfamiliar with basic CSS properties, you should pick up
    an introductory HTML and CSS book before reading this one.


