    # ELEGANCE


    The line between frivolous and consequential motion design is an easy one to discern:
    does a particular piece of motion design satisfy one of the best practices discussed
    in the "Utility" section of this chapter? If not, remove it. It’s frivolous, and
    it’s jeopardizing the usability of your UI.


    # DON''T BE FRIVOLOUS


    To hone your judgment about what is frivolous, download the most popular apps,
    play with each extensively, and judge whether they feature animation to a greater
    or lesser extent than your app does. Pay close to attention to what each animation
    conveys, and why it conveys. If you feel that these apps use animation to a much
    lesser extent than yours does, consider toning back the motion design in your
    UI.


    There’s one exception to this don’t-be-frivolous mantra—read on!",


    # YOUR ONE OPPORTUNITY TO BE FRIVOLOUS


    A page’s loading sequence—when all of your elements animate into view from an
    initial state of invisibility—is your one opportunity to be over-the-top and frivolous
    with your animations. Why? Because this sequence happens only once, and it won’t
    repeatedly get in the way of the user’s interaction with your site. Also, this
    is your moment to leverage your motion design skills to deliver a great first
    impression on your site.


    If you have a cool idea for animating your content into view, then do it here.
    But be sure to respect all the other rules in this chapter, especially limiting
    durations.


    # CONSIDER PERSONALITY


    If you were designing a corporate site, Bounciness is playful—not a quality that
    corporate sites often want to elements into sites to convey. And if you were designing
    an educational or government app, you wouldn’t use easings that result in movement
    that starts very quickly before finishing very slowly (thereby conveying a whizzing-by-your-face
    futuristic slickness)—these would be too glossy and stylized for the content at
    hand.'
