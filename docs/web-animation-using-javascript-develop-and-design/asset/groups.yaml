    \n```javascript\n// Cache the jQuery element object, prefixing the variable with\
    \ $\n// to indicate a JEO\nvar element = $(\"element\");\nelement.css(\"opacity\"\
    , 1);\n// ... some intermediary code...\n// We reuse the cached JEO and avoid\
    \ a DOM query\nelement.css(\"opacity\", 0);\n```\n\n### FORCE-FEEDING\n\nTraditionally,\
    \ animation engines query the DOM at the start of an animation to determine the\
