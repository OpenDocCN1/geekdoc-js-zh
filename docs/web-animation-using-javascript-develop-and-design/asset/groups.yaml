  - "[PAGE 106]\n\nIf you want the outward textual animation to mirror the inward\
    \ animation, you could rework the code example as follows:\n\n```\n// Select the\
    \ previously blasted text\n$(\"div .blast\").velocity(\n  // Animate the text\
    \ text out of view with the appropriate pack effect\n  \"transition.fadeOut\"\
    ,\n{\n    // Stagger the outward animation as you did the inward animation\n \
    \   stagger: 50,\n    backwards: true,\n    // When this outward animation is\
    \ complete, begin the inward animation\n    complete: function() {\n      // Proceed\
    \ with the inward animation\n      $(\"div\")\n        .html({{message}})\n  \
    \      .blast({ delimiter: \"word\" }})\n        .css(\"opacity\", 0)\n      \
    \  .velocity({ opacity: 1 }, { stagger: 50 });\n    }\n  }\n);\n```\n\nThis begins\
    \ by calling the Velocity UI pack \"transition.fadeOut\" effect on the text parts\
    \ generated by the div having previously been Blasted. With the inward direction,\
    \ the stagger option successively offsets the individual text part animations\
    \ in the outward direction. To call this is the use of Velocity UI pack's backwards\
    \ option, which pairs with stagger to reverse the target element's order so that\
    \ the last element (the last word in the sentence) animates out of view before\
    \ the second-to-last element, and that element animates out of view before the\
    \ third-to-last element, and so on. When this outward animation sequence is complete,\
    \ the inward animation is called from within the complete callback."
  - '[PAGE 107]


    Using the backwards option for text animation provides two benefits. First, it
    helps mirror (create the inverse of) the inward animation, which consists of the
    first word animating into view before the second word does, and so on. Second,
    when the backward animation is immediately followed by the forward animation,
    the net result is an an elegant chaining effect in which the last word in the
    backward direction and the first word in the forward direction occur back-to-back.
    This works to tie the two animation sequences together into what looks like one
    conjoined animation instead of two separate animations crudely glued together.'
  - "[PAGE 108]\n\n# TRANSITIONING INDIVIDUAL TEXT PARTS\n\nMovie title sequences\
    \ are well known for their inventive typographic motion design. The technique\
    \ underlying many of these effects is sing out individual text elements for animation.\
    \ That's what this section covers.\n\n> NOTE: For typographic animation inspiration,\
    \ search YouTube for movie title sequences and take detailed notes! As long as\
    \ you keep the principles of motion design theory in mind, you should feel encouraged\
    \ to explore textual animation design in your interface.\n\nTo achieve fine-grained\
    \ control over the elements that Blast generates, simply use CSS's nth-child selector\
    \ or jQuery's eq() function. These functions behave similarly to one another,\
    \ in that they allow for the selection of an element within a set based on that\
    \ element's index. If you passed an integer value of 3 into these functions (or\
    \ 2 in the case of jQuery as you will see), they would target the third element\
    \ (that is, third word) in the full element set (that is, multiword sentence):\n\
    \n```\n// CSS implementation\n.blast:nth-child(3) {\n  color: red;\n}\n```\n\n\
    ```\n// jQuery implementation\n$('.blast').eq(2).css(\"color\", \"red\");\n```\n\
    \nBoth examples above target the third element on the page that has the .blast\
    \ class applied. (Note that jQuery's eq function is o-based whereas CSS' nth-child\
    \ is 1-based, hence the different integer values being passed into the examples.)\
    \ Let's continue with a jQuery implementation to work toward a complete example:"
  - "[PAGE 109]\n\n```\n<div>\nCurrent status: paused\n</div>\n// Blast the div using\
    \ the word delimiter\n(\"div\").blast({ delimiter: \"word\" })\n// Select the\
    \ third word in the sentence (the span containing\n  -> the \"paused\" text)\n\
    eqq(2)\n// Fade the third element out of view then replace its inner\n  -> text\
    \ with a new message\n  .velocity({ opacity: 0 }, function() { $(this).text(\"\
    running\"); })\n// Fade the replaced text into view\n  .velocity({ opacity: 1\
    \ });\n```\n\nThis Blast a sentence, selects its third word (\"paused\"), fades\
    \ the word out of view, replaces the faded word with a new word (\"running\"),\
    \ then fades the new word into view. The net effect is the status-indicating keyword\
    \ within a sentence gracefully fades into a new word to alert the user of a change.\
    \ This is a tremendously elegant effect that consists of only a few lines of simple\
    \ code. If you were to perform this effect many times over a larger block of text,\
    \ you could achieve an effect in which one message appears to sporadically change\
    \ into another."
  - "[PAGE 110]\n\n# TRANSITIONING TEXT FANCIALLY\n\nYou could easily swap the transition.fadeIn\
    \ effect you've used thus far with another effect from Velocity's UI pack. Some\
    \ of the other effects are quite fanciful, ranging from transition.shrinkIn, which\
    \ causes an element to scale down into view, to transition.perspectiveDownIn,\
    \ which causes an element to rotate into view like a hinged barn door. (As always,\
    \ the sophistication of your effects should be rooted in the principles discussed\
    \ in Chapter 3, \"Motion Design Theory.\")\n\n**NOTE:** For a complete list of\
    \ UI pack effects, including live demos, VelocityJS.org/#uiPack.\n\nKeep in mind\
    \ that some effects use 3D transforms (rotateX, rotateY, and translateZ), which\
    \ don't work on elements whose CSS display value is set to \"inline\"—the default\
    \ display value for span and anchor elements in particular. The workaround is\
    \ to set Blast's generated text elements to a display value of \"inline-block\"\
    , which keeps \"inline\" elements behaving as they normally do while giving them\
    \ the added functionality of \"block\" elements (such as div and p), in which\
    \ position-related properties, including 3D transforms, can be styled. Taking\
    \ this tweak into account, the inward text transition example would now look like\
    \ this: \n\n```\n$$(div)\n.html({ delimiter: \"word\" })\n.css({ opacity: 0, display:\
    \ \"inline-block\" })\n.velocity(\"transition.perspectiveDownIn\", { stagger:\
    \ 50 });\n```\n\nThis sets the Blast text parts' display values to \"inline-block\"\
    \ in the same call to jQuery's css() function that sets the elements' opacity\
    \ to a starting value of o."
- md: "\n[content]\n# TEXTUAL FLOURISHES\n\nThe final topic in this discussion of\
    \ textual animation is the concept of flourishes, ambient animations that produce\
    \ ongoing effects for aesthetic purposes. One example might be a string of text\
    \ that flickers like a light bulb. Another might be having all the words in a\
    \ sentence continuously animate to different shades of blue.\nBoth of these are\
    \ bad ideas.\n\nThese effects distract users and ultimately amuse you only—the\
    \ developer who enjoys toying with motion design. Never include animation just\
    \ for the sake of the animation; if a part of your page is mindlessly drawing\
    \ the user's attention away from the parts that have utility, go back to the drawing\
    \ board.\n\nThe rare exception is status indicators—text such as \"Loading...\"\
    —that keep the user aware of what the interface is doing. These are appropriate\
    \ targets for textual flourishes because the flourishes tell the user that the\
    \ interface is still processing data (as opposed to having frozen). In this way,\
    \ flourishes act as an engaging visual heartbeat.\n\nSo textual flourishes are\
    \ generally considered bad practice, why is this section included in the book?\
    \ Because flourishes that are not animated are often a great idea! Consider this\
    \ non-animation bonus provided by Blast: you can stylize the text elements generated\
    \ by Blast to produce colorful collages and other unique typographic designs.\
    \ For example, you could break apart a website's text (\"Delivering happiness\
    \ right to your door!\") word by word to reduce the opacity of successive words,\
    \ thereby creating a subtle gradient effect that spans the entire sentence. Here's\
    \ what that code would look like:\n\n```javascript\n<div>\nHi Mom\n</div>\n//\
    \ Blast the div then iterate through the generated text elements\n$('div').blast({\
    \ delimiter: \"character\" }).each(function(i, element) {\n  // Successively reduce\
    \ the opacity of each element with an\n  // arbitrary formula\n  var adjustedOpacity\
    \ = 1 - i/10;\n  element.style.opacity = adjustedOpacity;\n});\n```\n\nInstead\
    \ of iterating opacity values, you could also iterate RGB values to create color-based\
    \ gradients. For example, if you increased the blue component of text whose color\
    \ initially starts as gray, you'd produce elements that are increasingly rich\
    \ in blue as you go from first to last:\n\n```javascript\n// Blast the div then\
    \ iterate through the generated text elements\n$(\"div\").blast({ delimiter: \"\
    character\" }).each(function(i, element) {\n  // Successively increase the blue\
    \ color component of each element\n  // with an arbitrary formula\n  var adjustedBlue\
    \ = i*20;\n  element.style.opacity = \"rgb(0, 0,\" + adjustedBlue + \")\";\n});\n\
    ```\n\n# remember:\nform\nfollows\nfunction.\n\n# WRAPPING UP\n\nThis is just\
    \ the beginning of the possibilities created by granular text control. Other techniques\
    \ include fine-tuning the coordinates of every letter in a word to produce a collage\
    \ effect, or placing words around the circumference of a circle to mimic the typographic\
    \ design you might find on a drink coaster.\n\nWhile these techniques may be well-suited\
    \ for bold homepage centerpieces, they may not be appropriate for critical parts\
    \ of your UI that are subject to repeated user interaction. Why? Because stylized\
    \ text is harder to read at a glance than unstylized text. But if you consider\
    \ the balance between form and function, you'll be fine.\n\n# CHAPTER 6\nScalable\
    \ Vector Graphics Primer\n\nSince an in-depth tutorial on Scalable Vector Graphics\
    \ (SVG) could easily comprise a book of its own, this chapter simply serves as\
    \ an introduction to the topic. The goal is to equip you with enough knowledge\
    \ to be comfortable animating SVG elements and to know where to go next to continue\
    \ your learning.\n\n# CREATING IMAGES THROUGH CODE\n\nAn SVG element is a type\
    \ of DOM element that borrows the syntax of the HTML elements you're already familiar\
    \ with to define arbitrary shapes. SVG elements differ from HTML elements in that\
    \ they have unique tags, attributes, and behaviors that allow them to define graphic\
    \ shapes. Put another way, SVGs let you create images through code. This is a\
    \ tremendously powerful concept because it means you can programmatically style\
    \ and animate these shapes using JavaScript and CSS. In addition it offers many\
    \ other benefits:\n\n- SVG compresses incredibly well. Graphics defined in SVG\
    \ have smaller file sizes than their PNG/JPEG equivalents, which can greatly improve\
    \ site load times.\n- SVG graphics scale to any resolution without a loss of clarity.\
    \ Unlike standard image formats, they look razor sharp across all devices—say\
    \ good-bye to blurry images on screens.\n- Like HTML elements, SVG elements can\
    \ be assigned event handlers that respond to a user's input, which means that\
    \ the graphics on your page can be made interactive. If you so desired, all the\
    \ buttons on your site could be turned into animated graphics.\n- Many photo-editing\
    \ apps (including Adobe Photoshop, Sketch, and Inkscape) let you export your design\
    \ into SVG format for quick copying and pasting into HTML. So, even if you don't\
    \ consider yourself an artist, you can leverage third-party applications to do\
    \ the designing for you.\n\nIn short, SVGs are an amazing graphics solution. Let's\
    \ dive in!\n\n# SVG MARKUP\n\nSVG elements are defined within a parent <svg> container.\
    \ Specifying the width and height dimensions of container element defines the\
    \ canvas that your SVG graphics render upon:\n\n```html\n<svg version=\"1.1\"\
    \ width=\"500\" height=\"500\"\n  xmlns=\"http://www.w3.org/2000/svg\">\n  <circle\
    \ cx=\"100\" cy=\"30\" />\n  <rect id=\"rect\" x=\"100\" y=\"100\" width=\"200\"\
    \ height=\"200\" />\n</svg>\n```\n\nWithin <svg>, you can insert SVG shapes of\
    \ varying sorts. The above example has a circle element defined by a rect (rectangle)\
    \ element. As normal HTML elements, SVG elements accept height and width attributes,\
    \ which are used here for demonstration purposes, but (as with HTML) it is considered\
    \ best practice to specify SVG styling properties within a CSS stylesheet. As\
    \ with HTML, stylesheets classes target SVG elements via their id, class, or tag\
    \ types.\n\nWhere the SVG and HTML specifications differs in their range of accepted\
    \ HTML attributes and CSS properties. SVG elements accept only a few of the standard\
    \ CSS properties. Further, SVGs accept a special set of attributes, called *presentational\
    \ attributes*, which include *fill*, *x*, and *y*. (fill specifies which color\
    \ to fill a shape, with x and y define the position of the element's top-left\
    \ corner.) These attributes define how an element is visually rendered on its\
    \ canvas. Let's run through a few of them, using rect as a sample SVG element:\n\
    \n```html\n<rect id=\"rect\" x=\"100\" width=\"200\" height=\"200\" />\n```\n\n\
    Here, the width and height attributes work as you'd expect. The unique x and y\
    \ attributes position the rectangle relative to x=0, y=0 origin. Unlike HTML,\
    \ positioning is not defined with top, right, bottom, left, float, or margin properties;\
    \ SVG positioning is fully dictated by explicitly coordinates. In other words,\
    \ an element's positioning doesn't affect the position of its siblings; SVG siblings\
    \ simply overlap.\n\nNow let's take a look at the circle element. Its rendering\
    \ is specified via coordinates that designate its center (cx and cy) along with\
    \ a radius value (r) that designates its length:\n\n```html\n<circle cx=\"100\"\
    \ cy=\"100\" r=\"30\" />\n```\n\nPretty simple, right? SVG elements use the same\
    \ markup structure as HTML elements, so all the code samples in this chapter should\
    \ feel familiar.\n\nNote that there many other types of SVG elements, including\
    \ ellipse, line, and text. See the end of this chapter for further details.\n\n\
    # SVG STYLING\n\nSVG elements accept a variety of special styling properties that\
    \ are not available to HTML elements. SVG's fill property, for example, is similar\
    \ to background-color in CSS, stroke is similar to border-color, and stroke-width\
    \ is similar to border-width. Take a look at this example:\n\n```html\n<svg version=\"\
    1.1\" width=\"500\" height=\"500\"\n  xmlns=\"http://www.w3.org/2000/svg\">\n\
    \  <circle cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: blue\" />\n  <rect id=\"\
    rect\" x=\"100\" y=\"100\" width=\"200\" height=\"200\"\n       style=\"fill:\
    \ green; stroke: red; stroke-width: 5px\" />\n</svg>\n```\n\nAbove, the circle\
    \ element is filled with solid blue, and the rect element is filled with solid\
    \ green. Additionally, the rectangle has a red border with a thickness of 5px.\n\
    There many other SVG-specific styling properties. For now, it's simply important\
    \ for you to know that they exist so you'll pay extra attention when trying to\
    \ animate CSS properties on SVG elements.\n\n> NOTE: Refer to the \"Wrapping up\"\
    \ section of this chapter for information on where to find a full listing of SVG\
    \ styling properties.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_121_0.png)\n\
    [/content]\n"
  mdcn: "\n# 文本修饰\n\n关于文本动画讨论的最后一个主题是“修饰”（flourishes）概念，即为了美学目的而产生持续效果的氛围动画。一个例子可能是像灯泡一样闪烁的文本字符串。另一个可能是句子中的所有单词持续变为不同深浅的蓝色。\n\
    这两种都是糟糕的主意。\n\n这些效果会分散用户的注意力，最终只是取悦了你——那个喜欢摆弄运动设计的开发者。永远不要为了动画而添加动画；如果页面的某部分在无意识地将用户的注意力从功能性部分吸引走，请回到设计起点。\n\
    \n极少数的例外是状态指示器——如“Loading...”之类的文本——它们让用户知道界面正在执行什么。这些是文本修饰的合适目标，因为修饰告诉用户界面仍在处理数据（而不是卡死）。通过这种方式，修饰充当了引人入胜的视觉心跳。\n\
    \n既然文本修饰通常被认为是不良习惯，为什么书中包含这一节呢？因为没有动画的修饰通常是一个很棒的主意！考虑 Blast 提供的非动画奖励：你可以对 Blast\
    \ 生成的文本元素进行样式化，以产生色彩丰富的拼贴和其他独特的排版设计。例如，你可以逐词拆分网站文本（“将快乐直接送到家门口！”）并降低后续单词的透明度，从而创建一个跨越整个句子的细微渐变效果。以下是该代码的样子：\n\
    \n```javascript\n<div>\nHi Mom\n</div\n// Blast the div 然后遍历生成的文本元素\n$('div').blast({\
    \ delimiter: \"character\" }).each(function(i, element) {\n  // 使用任意公式逐渐减少每个元素的透明度\n\
    \  var adjustedOpacity = 1 - i/10;\n  element.style.opacity = adjustedOpacity;\n\
    });\n```\n\n与其迭代透明度值，你也可以迭代 RGB 值来创建基于颜色的渐变。例如，如果你增加了初始颜色为灰色的文本的蓝色分量，那么从第一个到最后一个，你将产生的元素蓝色会变得越来越丰富：\n\
    \n```javascript\n// Blast the div 然后遍历生成的文本元素\n$(\"div\").blast({ delimiter: \"\
    character\" }).each(function(i, element) {\n  // 使用任意公式逐渐增加每个元素的蓝色分量\n  var adjustedBlue\
    \ = i*20;\n  element.style.opacity = \"rgb(0, 0,\" + adjustedBlue + \")\";\n});\n\
    ```\n\n# 记住：\n形式\n遵循\n功能。\n\n# 结语\n\n这只是粒化文本控制所创造可能性的开始。其他技术包括精调单词中每个字母的坐标以产生拼贴效果，或者在圆周周围放置单词，以模仿可能在饮料杯垫上看到的排版设计。\n\
    \n虽然这些技术可能非常适合首页的中心视觉，但它们可能不适用于你 UI 中需要频繁用户交互的交互部分。为什么呢？因为样式化的文本比未样式化的文本更难一目了读。但如果你考虑形式与功能之间的平衡，你就没问题。\n\
    \n# 第 6 章\n可缩放矢量图入门\n\n由于关于可缩放矢量图（SVG）的深度教程可以轻松组成一本书，因此本章仅作为该主题的介绍。目标是让你掌握足够的知识，以便能够舒适地动画\
    \ SVG 元素，并知道下一步该去哪里继续学习。\n\n# 通过代码创建图像\n\nSVG 元素是 DOM 元素的一种，它借用了你已经熟悉的 HTML 元素语法来定义任意形状。SVG\
    \ 元素与 HTML 元素的区别在于，它们具有独特的标签、属性和行为，允许它们定义图形形状。换句话说，SVG 允许你通过代码创建图像。这是一个极其强大的概念，因为这意味着可以使用\
    \ JavaScript 和 CSS 以编程的方式对这些形状进行样式化和动画处理。此外，它提供了许多其他益处：\n\n- SVG 压缩效果极佳。在 SVG\
    \ 中定义的图形文件大小比其对应的 PNG/JPEG 小，这可以极大地提高网站的加载速度。\n- SVG 图形可以缩放到任何分辨率而不会丢失清晰度。与标准图像格式不同，它们在所有设备上看起来都非常锐利——告别屏幕上的模糊图像。\n\
    - 像 HTML 元素一样，SVG 元素可以分配事件处理程序来响应用户的输入，这意味着你页面上的图形可以是交互式的。如果你有需要，你网站上的所有按钮都可以转换为动画图形。\n\
    - 许多照片编辑应用（包括 Adobe Photoshop、Sketch 和 Inkscape）允许你将设计导出为 SVG 格式，以便快速复制和粘贴到 HTML\
    \ 中。所以，即使你不认为自己是艺术家，也可以利用第三方应用程序来为你完成设计。\n\n简而言之，SVG 是一种奇的图形解决方案。让我们开始吧！\n\n#\
    \ SVG 标记\n\nSVG 元素定义在父级 <svg> 容器内。指定容器元素的宽度和高度定义了你的 SVG 图形渲染的画布：\n\n```html\n\
    <svg version=\"1.1\" width=\"500\" height=\"500\"\n  xmlns=\"http://www.w3.org/2000/svg\"\
    >\n  <circle cx=\"100\" cy=\"30\" />\n  <rect id=\"rect\" x=\"100\" y=\"100\"\
    \ width=\"200\" height=\"200\" />\n</svg>\n```\n\n在 <svg> 内部，你可以插入各种 SVG 形状。上面的示例有一个由\
    \ rect（矩形）元素定义的圆形元素。作为普通的 HTML 元素，SVG 元素接受 height 和 width 属性，这些属性在这里用于演示，但（与 HTML\
    \ 一样）最佳实践是在 CSS 样式表中指定 SVG 样式属性。与 HTML 一样，样式表类通过其 id、class 或标签类型目标定 SVG 元素。\n\n\
    SVG 和 HTML 规范在接受的 HTML 属性和 CSS 属性范围上存在差异。SVG 元素仅接受少数标准 CSS 属性。此外，SVG 接受一组特殊的属性，称为*表现性属性*（presentational\
    \ attributes），包括 *fill*、*x* 和 *y*。（fill 指定了用什么颜色填充形状，而 x 和 y 定义了元素左上角的位置。）这些属性定义了元素如何在画布上进行视觉渲染。让我们使用\
    \ rect 作为示例 SVG 元素，过一遍其中的几个属性：\n\n```html\n<rect id=\"rect\" x=\"100\" width=\"\
    200\" height=\"200\" />\n```\n\n在这里，width 和 height 属性的作用正如你预期的那样样。独特的 x 和 y 属性相对于\
    \ x=0, y=0 原点确定了矩形的位置。与 HTML 不同，定位不是通过 top, right, bottom, left, float 或 margin\
    \ 属性定义的；SVG 定位完全由显式坐标决定。换句话说，一个元素的定位不会影响其兄弟元素的位置；SVG 兄弟元素简单地重叠。\n\n现在让我们来看圆形元素。它的渲染是通过坐标指定的，这些坐标指定了它的中心（cx\
    \ 和 cy）以及指定其长度的半径值（r）：\n\n```html\n<circle cx=\"100\" cy=\"100\" r=\"30\" />\n\
    ```\n\n非常简单，对吧？SVG 元素使用与 HTML 元素相同的标记结构，因此本章中的所有代码示例应该看起来很熟悉。\n\n注意，还有许多类型的 SVG\
    \ 元素，包括椭圆（ellipse）、直线（line）和文本（text）。更多详情见本章末尾。\n\n# SVG 样式\n\nSVG 元素接受 HTML 元素不具备的各种特殊样式属性。例如，SVG\
    \ 的 fill 属性类似于 CSS 中的 background-color，stroke 类似于 border-color，而 stroke-width\
    \ 类似于 border-width。看这个例子：\n\n```html\n<svg version=\"1.1\" width=\"500\" height=\"\
    500\"\n  xmlns=\"http://www.w3.org/2000/svg\">\n  <circle cx=\"100\" cy=\"100\"\
    \ r=\"30\" style=\"fill: blue\" />\n  <rect id=\"rect\" x=\"100\" y=\"100\" width=\"\
    200\" height=\"200\"\n       style=\"fill: green; stroke: red; stroke-width: 5px\"\
    \ />\n</svg>\n```\n\n在上面，圆形元素被填充为纯蓝色，rect 元素被填充为纯绿色。此外，矩形有一个厚度为 5px 的红色边框。\n还有许多其他\
    \ SVG 特有的样式属性。现在，重要的是你知道它们的存在，这样当你尝试对 SVG 元素上的 CSS 属性进行动画时就会额外注意。\n\n> 注意：参阅本章的“结语”部分获取\
    \ SVG 样式属性的完整列表。\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_121_0.png)\n"
