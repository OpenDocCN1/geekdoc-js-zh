  - "[PAGE 77]\n\nBut the best part is that this approach lends itself perfectly to\
    \ organizing your animation variations together. For example, if you typically\
    \ fade button elements into view with a duration of 100ms, but you fade modal\
    \ windows into view with a duration of 300ms, you can simply split your object\
    \ into two appropriately named variations:\n\n```\nvar fadeIn = {\n  p: {\n  \
    \  opacity: 1,\n    top: \"50px\"\n  },\n  // Options object variation #1 uses\
    \ a fast duration\n  oFast: {\n    duration: 1000,\n    easing: \"linear\"\n \
    \ },\n  // Variation #2 uses a slower duration\n  oSlow: {\n    duration: 3000,\n\
    \    easing: \"linear\"\n  }\n};\n// Animate using the fast duration.\n$button.velocity(fadeIn.p,\
    \ fadeIn.oFast);\n/* Animate using the slow duration. */\n$modal.velocity(fadeIn.p,\
    \ fadeIn.oSlow);\n```"
  - "[PAGE 78]\n\nAlternatively, you could nest “fast” and “slow” objects as children\
    \ of a singular options object. The choice of which implementation to use is based\
    \ on your personal preference:\n\n```\nvar fadeIn = {\np: {\n  opacity: 1,\n \
    \ top: \"50px\"\n},\no: {\n  fast: {\n    duration: 1000,\n    easing: \"linear\"\
    \n  },\n  slow: {\n    duration: 3000,\n    easing: \"linear\"\n  }\n}\n};\n//\
    \ Animate using the fast duration.\n$button.animate(fadeIn.p, fadeIn.o.fast);\n\
    /* Animate using the slow duration. */\n$modal.velocity(fadeIn.p, fadeIn.o.slow);\n\
    ```\n\nIf this seems like too much overhead, and if you have enough lines of JavaScript\
    \ to justify simply inlining all your animation logic, then don't feel like a\
    \ bad developer for skipping this approach altogether. You should always use degree\
    \ of abstraction best suits the scope of your project. The takeaway here is simply\
    \ that animation workflow best practices do exist if you find yourself needing\
    \ them."
  - "[PAGE 79]\n\n# CODE TECHNIQUE: ORGANIZE SEQUENCED ANIMATIONS\n\nVelocity has\
    \ a small add-on plugin called the UI pack (get it at VelocityJS.org/#uiPack).\
    \ It enhances Velocity with features that greatly improve the UI animation workflow.\
    \ Many of the techniques in this chapter, including the one discussed below, make\
    \ use of it.\n\nTo install the UI pack, simply include a <script> tag for Velocity\
    \ and before the ending <body> tag of your page:\n\n```\n<script src=\"velocity.js\"\
    ></script>\n<script src=\"velocity.ui.js\"></script>\n```\n\nThe specific UI pack\
    \ feature discussed in this section is sequence running. It will forever change\
    \ your animation workflow. It is the solution to messily nested animation code.\n\
    \n# STANDARD APPROACH\n\nWithout the UI pack, the standard approach to consecutively\
    \ animating separate elements is as follows:\n\n```\n// Animate element1 followed\
    \ by element2 followed by element3\n$element1.velocity({ translateX: 100, opacity:\
    \ 1 }, 1000, function() {\n  $element2.velocity({ translateX: 200, opacity: 1\
    \ }, 1000, function() {\n    $element3.velocity({ translateX: 300, opacity: 1\
    \ }, 1000);\n  });\n});\n```\n\nDon't let this simple example fool you: in real-world\
    \ production code, animation sequences include many more properties, many more\
    \ options, and many more levels of nesting than are demonstrated here. Code like\
    \ this most commonly appears in loading sequences (when a page or a subsection\
    \ first loads in) that consist of multiple elements animating into place."
  - '[PAGE 80]


    Note that the code shown above is different from chaining multiple animations
    onto the same element, which is hassle-free and doesn''t require nesting.


    // Chain multiple animations onto the same element

    $element1


    ```

    .velocity({ translateX: 100 })

    .velocity({ translateY: 100 })

    .velocity({ translateZ: 100 });

    ```


    So what is wrong with first code sample (the one with different elements)? Here
    are the main issues:


    +   - The code bloats horizontally very quickly with each level of nesting, making
    it increasingly difficult to modify the code within your IDE.


    +   - You can''t easily rearrange the order of classes in the overall sequence
    (doing so requires very delicate copying and pasting).


    +   - You can''t easily indicate that certain cells should run parallel to one
    another. Let''s say that halfway through the overall sequence you want to move
    slides into view from different origin points. When coding in this, it wouldn''t
    be obvious how to nest animations that occur after this parallel mini-sequence
    such that the overall sequence doesn''t become even more difficult to maintain
    than it already is.


    # OPTIMIZED APPROACH


    Before you learn about the beautiful solution to this problem, it''s important
    to understand two simple features of Velocity. First, know that Velocity accepts
    multiple syntaxes: the most common, when Velocity is invoked on a jQuery element
    object (like all the code examples shown so far), consists of a properties object
    followed by an options:


    // The argument syntax used thus far

    $element.velocity({ opacity: 1, top: "50px" }, { duration: 1000,

    easing: "linear" });


    An alternative syntax pairs with Velocity''s utility function, which is the fancy
    name given to animating elements using the base Velocity object instead of chaining
    off of a jQuery element object. Here''s what animating off the base Velocity object
    looks like:


    +   - Velocity registers itself on jQuery''s $ object, which you leverage over

    $.Velocity({ e: $element, p: { opacity: 1, scale: 1 },

    o: { duration: 1000, easing: "linear" } });'
  - "[PAGE 81]\n\nAs shown above, this alternative syntax consists of passing Velocity\
    \ a single object that contains member objects that map to each of the standard\
    \ Velocity arguments (elements, properties, and options). For the sake of brevity,\
    \ the member object names are truncated to the first letter of their associated\
    \ objects (e for elements, p for properties, and o for options).\n\nFurther, note\
    \ that you're now passing the target element as an argument to Velocity since\
    \ you're no longer invoking Velocity directly on the element. The net effect is\
    \ exactly the same as the syntax you used earlier.\n\nAs you can see, the new\
    \ syntax isn't much bulkier, but it's equally—if not more—expressive. Armed with\
    \ this new syntax, you're ready to learn how the UI pack's sequence-running feature\
    \ works: you simply create an array of Velocity calls, with each defined using\
    \ the single-object syntax you just demonstrated. You then pass the entire array\
    \ into a special Velocity function that fires the sequences successfully. When\
    \ one Velocity call is completed, the next runs—even if the individual calls are\
    \ targeting elements:\n\n```\n// Create the array of Velocity calls\nvar loadingSequence\
    \ = {\n  e: $element1, p: { translateX: 100, opacity: 1 },\n  o: { duration: 1000\
    \ } },\n  e: $element2, p: { translateX: 200, opacity: 1 },\n  o: { duration:\
    \ 1000 } },\n  e: $element3, p: { translateX: 300, opacity: 1 },\n  o: { duration:\
    \ 1000 } }\n};\n```\n\n// Pass the array into $.Velocity.RunSequence to kick off\
    \ the sequence\n$.Velocity.RunSequence(loadingSequence);\n\nThe benefits here\
    \ are clear:\n\n+   * You can easily reorder animations in the overall sequence\
    \ without fear of breaking nested code.\n* You can quickly eyeball the difference\
    \ between properties and options objects across the calls.\n* Your code is highly\
    \ legible and expressive to others."
  - "[PAGE 82]\n\nIf you combine this technique with the previous technique (turning\
    \ CSS classes into\nJavaScript objects), your animation code starts to look remarkably\
    \ elegant:\n\n```\n$.Velocity.RunSequence([\n  e: $element1, p: { translateX:\
    \ 100, opacity: 1 }, o: slideIn.o },\n  e: $element2, p: { translateX: 200, opacity:\
    \ 1 }, o: slideIn.o },\n  e: $element3, p: { translateX: 300, opacity: 1 }, o:\
    \ slideIn.o }\n]);\n```\n\nExpressiveness and maintainability aren't the only\
    \ benefits to sequence running:\nyou also gain the ability to run individual calls\
    \ in parallel using a special sequenceQueue\noption, when set to false, forces\
    \ the associated call to run parallel to the call that\ncame before it. This lets\
    \ you have multiple elements animate into view simultaneously,\nnormally have\
    \ to be orchestrated through messy callback nesting. Refer to the inlined\ncomments\
    \ below for details:\n\n```\n$.Velocity.RunSequence([\n  elements: $element1,\
    \ properties: { translateX: 100 },\n  -> options: { duration: 1000 },\n// The\
    \ following call will start at the same time as the first\n-> call since it uses\
    \ the `sequenceQueue: false` option\n  elements: $element2, properties: { translateX:\
    \ 200 },\n  -> options: { duration: 1000, sequenceQueue: false },\n// As normal,\
    \ the call below will run once the second call has completed\n  elements: $element3,\
    \ properties: { translateX: 300 },\n  -> options: { duration: 1000 }\n]);\n```"
- md: "\n# CODE TECHNIQUE: PACKAGE YOUR EFFECTS\n\nOne of the most common uses of\
    \ motion design is fading content in and out of view. This type of animation often\
    \ consists of a series of individual animation calls that are chained together\
    \ to deliver a nuanced, multistage effect.\n\n# STANDARD APPROACH\n\nInstead of\
    \ simply animating the opacity of an element toward 1, you might simultaneously\
    \ animate its scale property so that the elements appear to fade in and grow into\
    \ place. Once the element is fully in view, you might choose to animate its border\
    \ thickness to 1rem as a finishing touch. If this animation were to happen multiple\
    \ times across a page, and on many different elements, it would make sense to\
    \ avoid repetition by turning it into a standalone function. Otherwise, you'd\
    \ have to repeat this non-expressive code throughout your script.js.\n\n```javascript\n\
    $element\n  velocity({ opacity: 1 }, duration: 500,\n    easing: \"ease-in-out\"\
    })\n  velocity({ borderWidth: \"1rem\" }, delay: 200,\n    easing: \"spring\"\
    , duration: 400 });\n```\n\nUnlike the sequencing technique discussed in the previous\
    \ section, the code above consists of multiple animations that occur on the same\
    \ element. Chained animations on a single element constitute an effect. If you\
    \ were to improve this effect by implementing the first technique in this chapter\
    \ (turning CSS classes into JavaScript objects), you'd have to go out of your\
    \ way to uniquely name each argument object for each stage in the overall animation.\
    \ Not only is it possible that these objects would not be used by other portions\
    \ of the animation code due to the uniqueness of this particular sequence, but\
    \ you'd have to deal with appending integers to each animation call's respective\
    \ objects to delineate them from one another. This could get messy, and neutralize\
    \ the organizational effort and benefit of turning CSS classes into JavaScript\
    \ objects.\n\nAnother problem with effects such as the one above is that the code\
    \ isn't very self-descriptive—its purpose isn't immediately clear. Why are there\
    \ two animation calls instead of one for each of these individual calls? The answers\
    \ to these questions are irrelevant to the code that triggers the animation, and\
    \ should consequently be tucked away.\n\n# OPTIMIZED APPROACH\n\nVelocity's UI\
    \ pack lets you register effects that you can subsequently reuse across a site.\
    \ Once an effect is registered, you can call it by passing its name into Velocity\
    \ as its first parameter:\n\n```javascript\n// Assume we registered our effect\
    \ under the name \"growIn\"\n$element.velocity(\"growIn\");\n```\n\nThat's a lot\
    \ more expressive, isn't it? You quickly understand the code's purpose: An element\
    \ will grow into view. The code remains tense and maintainable.\n\nWhat's more,\
    \ a registered effect behaves identically to a standard Velocity call; you can\
    \ pass it in an options object as normal and chain any Velocity calls onto it:\n\
    \n```javascript\n$element\n// Scroll the element into view\n.velocity(\"scroll\"\
    )\n// Then trigger the \"growIn\" effect on it, with the following settings\n\
    .velocity(\"growIn\", { duration: 1000, delay: 200 })\n```\n\nIf UI pack is loaded\
    \ onto your page, an effect such as this is registered using the following syntax:\n\
    \n```javascript\n$.Velocity.RegisterEffect(name, {\n  // Default duration value\
    \ if one isn't passed into the call\n  defaultDuration: duration,\n  // The following\
    \ Velocity calls occur one after another,\n  // with each taking up a predefined\
    \ percentage of the effect's total duration\n  calls: [\n    [ propertiesObject,\
    \ durationPercentage, optionsObject ],\n    [ propertiesObject, durationPercentage,\
    \ optionsObject ]\n  ],\n  reset: resetPropertiesObject\n});\n```\n\nLet’s break\
    \ down this template by step:\n\n- 1. The first argument is the name of the effect.\
    \ If the effect is responsible for bringing an element into view (as in, it fades\
    \ an element’s opacity from 0 to 1), it’s important to suffix the effect with\
    \ “In”.\n- 2. The second argument is an object that defines the effect’s behavior.\
    \ The first property in this object is defaultDuration, which lets you specify\
    \ the duration that the effect should take if one is not passed into the Velocity\
    \ call that triggers the effect.\n- 3. The next property in the object is calls\
    \ array, which consists of the Velocity calls that constitute the effect (in the\
    \ order that they should occur). Each of these array items is an array itself,\
    \ which consists of the calls properties object, followed by the optional percentage\
    \ of the total duration that call should consume (decimal value that defaults\
    \ to 1.00), followed by an optional options object for that specific call. Note\
    \ that Velocity calls specified within the calls array count only the easing and\
    \ delay options.\n- 4. Finally, you have the option of passing in a reset object.\
    \ The reset object is specified using the same syntax as a standard Velocity properties\
    \ map object, but it is used to enact an immediate value change upon completion\
    \ of the full effect. It is useful when you’re animating the opacity and scale\
    \ properties of an element down to 0 (out of view), but want to return the element’s\
    \ scale property to 1 after the element is hidden so that subsequent effects needn’t\
    \ worry about the properties beyond opacity they must reset on the element for\
    \ their calls to properly take effect. In other words, you can leverage the reset\
    \ properties map to make effects selfcontained, such that they leave no clean\
    \ duties on the target elements.\n\nIn addition to the reset object, another powerful\
    \ bonus of the UI pack’s effect registration is automatic display property toggling.\
    \ When an element begins animating view, you want to ensure its display value\
    \ is set to a value other than “none” so the element is visible throughout the\
    \ course of its animation. (Remember, display: none removes an element from the\
    \ page’s flow.) Conversely, when fading out, you want to set the display value\
    \ to \"none\" once the animation is complete. If your effect's name ends with\
    \ \"In\", Velocity will automatically set the display value to the default value\
    \ associated with the element's tag (for example, \"inline\" for anchors, \"block\"\
    \ for div). If your effect's name does not contain one of these suffixes, the\
    \ UI pack will not perform automatic display setting.\n\nUsing Velocity, let’s\
    \ register two effects—one for the \"In\" direction and one for \"Out\"—and call\
    \ them shadowIn and shadowOut to see them in action:\n\n```javascript\n$.Velocity.RegisterEffect(\"\
    shadowIn\", {\n  defaultDuration: 1000,\n  calls: [\n    [ { opacity: 1, scale:\
    \ 1 }, 0.4 ],\n    [ { boxShadow: 50 }, 0.6 ]\n  ]\n});\n.RegisterEffect(\"shadowOut\"\
    , {\n  defaultDuration: 800,\n  calls: [\n    [ { opacity: 0, scale: 0 }, 0.2\
    \ ],\n    [ { boxShadow: 50 }, 0.8 ]\n  ]\n});\n```\n\nRegistering effects not\
    \ only improves your code, but also makes it highly portable between projects\
    \ and among developers. When you've designed an effect you love, now it's painless\
    \ to share the effect's registration code with others they can use too.\n\n# DESIGN\
    \ TECHNIQUES\n\nThe techniques discussed so far in this chapter will improve your\
    \ workflow during the coding phase. The techniques covered in this section focus\
    \ on the design phase, where you're still experimenting to find the perfect animation\
    \ that fits your UI. This phase requires a lot of creativity and a lot of repetition,\
    \ and is accordingly ripe for workflow improvements.\n\n# TIMING MULTIPLIERS\n\
    \nThe first design technique is to use a global timing multiplier. This consists\
    \ of sprinkling in a multiplier constant against all of your animations' delay\
    \ and duration values.\nStart by defining your global timing multiplier (arbitrarily\
    \ designated as M multiplier):\n\n```javascript\nvar M = 1;\n```\n\nThen, bake\
    \ the multiplier into the duration and delay option values within each animation\
    \ call:\n\n```javascript\n$element1.animate({ opacity: 1 }, { duration: 1000 *\
    \ M });\n$element2.velocity({ opacity: 1 }, { delay: 250 * M });\n```\n\n> NOTE:\
    \ if you use SASS or LESS, which provide support for variable usage within stylesheets,\
    \ this technique applies equally to CSS animations!\n\nEmbedding a multiplier\
    \ constant will help you quickly modify the M constant in one location (presumably\
    \ at the top of your style.js) in order to quickly speed up or slow down all of\
    \ the animations across your page. Benefits of such timing control include:\n\n\
    - Slowing down animations to perfect the timing of individual animation calls\
    \ within a complex animation sequence. When you're constantly refreshing your\
    \ page in order to tweak a multi-element animation sequence to perfection, seeing\
    \ the sequence in slow motion makes it significantly easier to assess how individual\
    \ elements interact with one another.\n"
  mdcn: "\n\n# 代码技巧：封装你的效果\n\n动设计最常见的用途之一是内容的淡入和淡出视图。这种动画通常由一系列链联的单独动画调用组成，以实现细微的、多阶段的效果。\n\
    \n# 标准方法\n\n你可能不是简单地将元素的透明度（opacity）动画化到 1，而是同时动画化其缩放（scale）属性，让元素看起来像是淡入并放大到到位。一旦元素完全进入视野，你可能会选择将它的边框厚度（border\
    \ thickness）动画到 1rem 作为收尾工作。如果这种动画在页面上多次发生，并且在许多不同的元素上发生，那么将其转换为一个独立的函数以避免重复是有意义的。否则，你必须在整个\
    \ script.js 中重复这些非表达性的代码。\n\n```javascript\n$element\n  velocity({ opacity: 1\
    \ }, duration: 500,\n    easing: \"ease-in-out\"})\n  velocity({ borderWidth:\
    \ \"1rem\" }, delay: 200,\n    easing: \"spring\", duration: 400 });\n```\n\n\
    与上一节讨论的序列化技术不同，上述代码由多个发生在同一个元素上的动画组成。单个元素上的链式动画构成了一个效果。如果你想通过实现本章的第一种技术（将 CSS\
    \ 类转换为 JavaScript 对象）来改进此效果，你将不得不费力为整个动画中每个阶段的每个参数对象命名唯一的名称。不仅由于此特定序列的唯一性，这些对象可能不会动画代码的其他部分使用，而且你必须处理向每个动画调用的相应对象附加整数，以将它们区分开来。这可能会变得混乱，并抵消将\
    \ CSS 类转换为 JavaScript 对象所带来的组织努力和收益。\n\n像上面的效果这样的另一个问题是代码不具有自描述性——它的意图并不显而易见。为什么这些单独的调用中有两个动画调用，而不是每个调用用一个？这些问题的答案与触发动画的代码无关，因此应该被隐藏起来。\n\
    \n# 优化方法\n\nVelocity 的 UI pack 允许你注册效果，随后你可以在整个站点复用这些效果。一旦注册了效果，你就可以通过将其名称作为第一个参数传递给\
    \ Velocity 来调用它：\n\n```javascript\n// 假设我们以 \"growIn\" 名称注册了效果\n$element.velocity(\"\
    growIn\");\n```\n\n这表达性要强得多，不是吗？你很快就能理解代码的目的：一个元素将放大进入视图。代码保持了简洁且易于维护。\n\n此外，注册的效果的行为与标准的\
    \ Velocity 调用完全相同；你可以像往常一样将选项对象传递给它，并在其上链联任何 Velocity 调用：\n\n```javascript\n$element\n\
    // 将元素滚动到视图\n.velocity(\"scroll\")\n// 然后对其触发 \"growIn\" 效果，带有以下设置\n.velocity(\"\
    growIn\", { duration: 1000, delay: 200 })\n```\n\n如果 UI pack 已加载到你的页面上，像这样的效果使用以下语法注册：\n\
    \n```javascript\n$.Velocity.RegisterEffect(name, {\n  // 如果调用中没有传递，则默认持续时间值\n\
    \  defaultDuration: duration,\n  // 以下 Velocity 调用将一个接一个地发生，\n  // 每个调用占用效果总持续时间的预定义百分比\n\
    \  calls: [\n    [ propertiesObject, durationPercentage, optionsObject ],\n  \
    \  [ propertiesObject, durationPercentage, optionsObject ]\n  ],\n  reset: resetPropertiesObject\n\
    });\n```\n\n让我们逐步拆解这个模板：\n\n- 1. 第一个参数是效果的名称。如果效果负责将元素引入视图（例如，它将元素的透明度从 0 淡入到\
    \ 1），那么在效果后面加上“In”是非常重要的。\n- 2. 第二个参数是一个定义效果行为的对象。该对象中的第一个属性是 `defaultDuration`，它允许你指定触发效果的\
    \ Velocity 调用中没有传递持续时间，则效果应该持续多久。\n- 3. 对象中的下一个属性是 `calls` 数组，它由构成效果的 Velocity\
    \ 调用组成（按照它们应该发生的顺序）。数组中的每个项本身都是一个数组，由调用的属性对象组成，随后是该调用应该消耗的总持续时间的可选百分比（默认为 1.00\
    \ 的小数值），最后是该特定调用的可选选项对象。注意，在 `calls` 数组内指定的 Velocity 调用仅计算缓动（easing）和延迟（delay）选项。\n\
    - 4. 最后，你可以选择传递一个 `reset` 对象。`reset` 对象使用与标准 Velocity 属性映射对象相同的语法指定，但它用于在完整效果完成后立即执行值的更改。当你正在将元素的透明度和缩放属性动画到\
    \ 0（移出视图），但想在元素隐藏后将元素的缩放属性返回到 1 时，这非常有用，这样后续的效果就不需要担心为了让调用正常生效而必须在元素上重置透明度之外的属性。换句话说，你可以利用\
    \ `reset` 属性映射使效果自自包含，使得它们不会给目标元素留下任何清理工作。\n\n除了 `reset` 对象外，UI pack 效果注册的另一个强大优势是自动切换显示（display）属性。当元素开始动画化进入视图时，你希望确保其\
    \ `display` 值设置为“none”以外的值，以便元素在整个动画过程中可见的。（记住，`display: none` 会将元素从页面流中移除。）相反，当淡出时，你希望在动画完成后将\
    \ `display` 值设置为“none”。如果你的效果名称以“In”结尾，UI pack 将自动设置显示值为元素标签的默认值（例如，锚点的“inline”，div\
    \ 的“block”）。\n\n使用 Velocity，让我们注册两个效果——一个用于“In”方向，一个用于“Out”方向——并调用 `shadowIn`\
    \ 和 `shadowOut` 来查看效果：\n\n```javascript\n$.Velocity.RegisterEffect(\"shadowIn\"\
    , {\n  defaultDuration: 1000,\n  calls: [\n    [ opacity: 1, scale: 1 }, 0.4 ],\n\
    \    [ boxShadow: 50 }, 0.6 ]\n  ]\n});\n$.RegisterEffect(\"shadowOut\", {\n \
    \ defaultDuration: 800,\n  calls: [\n    [ opacity: 0, scale: 0 }, 0.2 ],\n  \
    \  [ boxShadow: 50 }, 0.8 ]\n  ]\n});\n```\n\n注册效果不仅改进了你的代码，还使其项目之间和开发者之间具有高度的可移植性。当你设计了一个你喜欢的效果时，现在可以轻松地将注册代码分享给其他人使用。\n\
    \n# 设计技术\n\n本章为止讨论的技术将改进你在编码阶段的工作流。本节涵盖的技术侧重于设计阶段，你仍在实验寻找适合 UI 的完美动画。这个阶段需要大量的创意和重复，因此非常适合改进工作流。\n\
    \n# 时间倍器\n\n第一个设计技术是使用全局时间倍器。这包括在你的所有动画的延迟和持续时间值撒入一个倍器常量。\n首先定义你的全局时间倍器（任意指定为\
    \ M 倍器）：\n\n```javascript\nvar M = 1;\n```\n\n然后，将倍器注入每个动画调用的持续时间和延迟选项值中：\n\n\
    ```javascript\n$element1.animate({ opacity: 1 }, { duration: 1000 * M });\n$element2.velocity({\
    \ opacity: 1 }, { delay: 250 * M });\n```\n\n> 注意：如果你使用 SASS 或 LESS（这些工具在样式表中支持变量使用），该技术同样适用于\
    \ CSS 动画！\n\n嵌入倍器将帮助你在一个位置快速修改 M 常数（通常位于 style.js 顶部），以便快速加速或减慢页面上所有的动画。这种时间控制的好处包括：\n\
    \n- 减慢动画以完善复杂动画序列中单个动画调用的计时。当你不断刷新页面以调整多元素动画序列时，以慢动作查看序列将显著更容易评估单个元素之间的相互作用。\n\
    \n"
