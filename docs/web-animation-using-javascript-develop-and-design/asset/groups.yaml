    animation against each other. Just like layering up clothing to create pleasant
    color and texture combinations, you should layer animations to create pleasant
    motion design combinations.


    For advice on the technical implementation of multistep effects, read Chapter
    4, "Animation Workflow."


    ## STAGGER ANIMATIONS


    When multiplying sibling elements—say, a series of images in a gallery—are animating
    view at the same time, consider adding a tiny delay between them. (That is, after
    the first image loads, a delay occurs before the second image loads, and so on.)
    To delay the animation of sibling elements in this way is called staggering, and
    its purpose is similar to that of breaking an animation into steps: it adds visual
    layering by preventing all your elements from animating perfectly in sync, which
    can look plain and inelegant to staggered loading. Why? Because animating a series
    of elements in sync lacks any sense of granularity or gradation. Consider this:
    Birds don''t fly side by side in a straight line. What makes their aerial movements
    so graceful is their successive formation and timing. It''s their juxtaposition,
    and the motion of their juxtaposition, that makes them so elegant to the human
    eye.


    ## FLOW FROM THE TRIGGERING ELEMENT


    If clicking a button causes a modal to appear, have the modal animate out from
    the button''s location. In other words, have animations flow from the elements
    that trigger them. This bridges the cause-and-effect relationships in your UI,
    making individual elements feel better coupled and organized.


    To understand the psychological benefit of this technique, consider how motion
    works in the real world: when you pull a lever, a series of mechanical parts causes
    a connected object. The key is the word: real objects don''t move unless a force
    is exerted upon them. Likewise, it''s important to treat every element in your
    UI as an element capable of exerting its own force. Every action should feel connected
    to a trigger. This sort of seamless experience is what helps an interface transcend
    from the digital to the physical. The more physical an interface is, the more
    responsive and emotive it feels.


    ## USE GRAPHICS


    Make of **scalable vector graphics (SVG)** to animate individual graphic components
    of a larger element that the user can interact with (learn more in Chapter 6,
    "Scalable Vector Graphics Primer"). A common example of this is the trio of horizontal
    lines that constitute a "hamburger menu" icon, or the dots that form a circle
    in a loading indicator. In both of these examples, arbitrary shapes are grouped
    together to form a common UI component. Before SVG animation was possible on the
    web, the common approach to animating a graphic like either of the two described
    was to embed the full graphic as a PNG image and then animate the entire shape
    by transitioning its opacity in CSS. By leveraging SVG, however, you can animate
    these unique elements on an individual shape-by-shape basis and subject them to
    many types of property animations.


    Graphic animation is a surefire to add nuance to key portions of your UI. This
    nuance is partially a result of the fact that web-based animation primarily deals
    with solid, rectangular shapes. (Sometimes they have rounded corners, but the
    shapes nonetheless remain solid and whole.) Animating the individual shapes of
    an element instead lets you delight the user with motion design that she might
    not have realized was possible.


    Beyond novelty, you can also uniquely leverage SVG animation to transform shapes
    into brand-new ones. Pairing this with the techniques for **previewing outcomes**
    and **flowing from the triggering element**, you can use graphic transitions to
    indicate UI behavior and provide feedback to the user. For example, if hovering
    over the dots in a loading indicator causes those dots to rearrange themselves
    into an X shape, that would indicate to the user that clicking the status indicator
    graphic would cancel the loading of content.


    ![](img/556d1045d4d84ff85ee82fbcd7feb49f_65_0.png)


    ## EXPERIMENT REATEDLY


    Finding the right duration, stagger, easing, and property combinations for each
    animation is **not** a skill that designers are born with. It''s a skill that
    every great designer has had to learn. So, remember: your first attempt at animation
    properties might look good, but it''s probably not the best case. There are only
    two ways to find the best case: by systematically changing each factor in the
    motion design equation until you stumble onto something sublime, or borrow ideas
    from others peoples'' work. Once you''ve found a combination you like—even if
    it''s one you''ve already borrowed elsewhere pixel-for-pixel—experiment *further*.
    Consider side-cutting the duration in half, switching to a completely different
    easing type, or swapping out a property.


    Designers are often averse to extended experimentation because—even though there
    are a million ways to animate a button into view—each way effectively fulfills
    the goal at a hand: making the button visible. Consequently, once you stumble
    onto a combination of properties that look good, you''re likely to stick with
    it because it looks good and it works. But don''t forget that goodness isn''t
    a respectable design goal—greatness is. Greatness entails stepping outside of
    your comfort zone, and not necessarily relying on what you already know works.


    ## WRAPPING UP


    Utility and elegance are your goals. At minimum, all animation code must fulfill
    one or the other.


    When implemented properly, animation code should provide concrete value to your
    UX and not adversely impact the website’s performance. No matter how sleek your
    motion design is, if the interface is laggy as a result of its implementation,
    the overall user experience will not be elegant. You’ll learn more about the importance
    of performance in the Chapter 7, “Animation Performance.”


    ## CHAPTER 4


    ## Animation Workflow


    The animation code found on most sites is nothing short of a mess. If there’s
    one thing experienced motion designers miss about the old, ugly days of Flash,
    it’s a structured approach to motion design.


    The contemporary approach to structuring animation code is twofold: leverage the
    workflow features of an animation engine (in this case, Velocity.js) to make your
    code more terse and expressive, and use code organization best practices so that
    it’s easy to modify your work later.


    Say goodbye to deep-nesting JavaScript callbacks and to dirtying your stylesheets
    with unwieldy CSS animations. It’s time to up up your web animation game.


    ## CSS ANIMATION WORKFLOW


    In an attempt to better manage UI animation workflow, developers sometimes switch
    from JavaScript to CSS. Unfortunately, once animations reach a medium level of
    complexity, CSS animations typically result in a significantly worse workflow.


    ## ISSUES WITH CSS


    While CSS transitions are convenient when used sparingly in a stylesheet, they’re
    unmanageable in complex animations sequences (for example, when all elements sequentially
    load into view page load).


    CSS tries to address this with a keyframes feature, which lets you separate animation
    logic into discrete ranges:


    ```

    @keyframes {

    0% { opacity: 0; transform: scale(0, 0); }

    25% { opacity: 1; transform: scale(1, 1); }

    50% { transform: translate(100px, 0); }

    100% { transform: translate(100px, 100px); }

    }

    #box { animation: myAnimation 2.75s; }

    ```


    This specifies separate points within an animation''s timeline at which particular
    property values should be reached. It assigns the animation to an element with
    ID of #box, and specifies the duration of the keyframe sequence to complete within.
    Don''t worry if you don''t fully grasp the syntax above—you won''t be using it
    in this book. Before moving on, consider this: what happens when a client asks
    you to make the opacity one second longer, but keep the rest of the properties
    animating at their current durations? Fulfilling this request requires redoing
    the math so the percentage values properly align with a 1-second increase. Doing
    this is trivial, and it certainly isn''t manageable at scale.

