    $element\n  velocity({ opacity: 1 }, duration: 500,\n    easing: \"ease-in-out\"\
    })\n  velocity({ borderWidth: \"1rem\" }, delay: 200,\n    easing: \"spring\"\
    , duration: 400 });\n```\n\nUnlike the sequencing technique discussed in the previous\
    \ section, the code above consists of multiple animations that occur on the same\
    \ element. Chained animations on a single element constitute an effect. If you\
    \ were to improve this effect by implementing the first technique in this chapter\
    \ (turning CSS classes into JavaScript objects), you'd have to go out of your\
    \ way to uniquely name each argument object for each stage in the overall animation.\
    \ Not only is it possible that these objects would not be used by other portions\
    \ of the animation code due to the uniqueness of this particular sequence, but\
    \ you'd have to deal with appending integers to each animation call's respective\
    \ objects to delineate them from one another. This could get messy, and neutralize\
    \ the organizational effort and benefit of turning CSS classes into JavaScript\
    \ objects.\n\nAnother problem with effects such as the one above is that the code\
    \ isn't very self-descriptive—its purpose isn't immediately clear. Why are there\
    \ two animation calls instead of one for each of these individual calls? The answers\
    \ to these questions are irrelevant to the code that triggers the animation, and\
    \ should consequently be tucked away."
