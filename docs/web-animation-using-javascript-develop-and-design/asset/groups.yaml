  - "[PAGE 126]\n\n# IMPLEMENTATION EXAMPLE: ANIMATED LOGOS\n\nHigh-resolution site\
    \ logos that animate into place upon load are ideal targets for SVG implementation.\
    \ Suppose you want to crudely replicate the MasterCard logo, which consists of\
    \ two overlapping circles of different colors. If you were to animate this logo\
    \ into place using Velocity, you would start with an SVG canvas defined as:\n\n\
    ```\n<svg version=\"1.1\" width=\"500\" height=\"500\"\n  xmlns=\"http://www.w3.org/2000/svg\"\
    >\n  <circle id=\"circleleft\" cx=\"100\" cy=\"100\" r=\"30\" style=\"fill: red\"\
    \ />\n  <circle id=\"circleRight\" cx=\"100\" cy=\"100\" r=\"30\"\n    style=\"\
    fill: orange\" />\n</svg>\n```\n\nThis creates two overlapping circles with identical\
    \ radii. Next, you'd animate the circles outward from their origins so they could\
    \ overlap slightly when they're animating:\n\n```\n// Move one circle toward the\
    \ left\n$(\"#circleleft\").velocity({ cx: \"-15px\" }, { easing: \"spring\" });\n\
    // Move one circle toward the right\n$(\"#circleRight\").velocity({ cx: \"+15px\"\
    \ }, { easing: \"spring\" });\n```\n\nHere, the left circle is animated 15 pixels\
    \ leftover (using the \"-\" operator to instruct Velocity to decrement the circle's\
    \ current value) and the right circle is animated 15 pixels right. The spring\
    \ easing adds flair by making the circles bounce away from one another with propulsive\
    \ force.\n\nSince SVG elements can listen for mouse-based events (clicks, hovers,\
    \ and so on), you could improve this by turning it into an example of SVG interaction.\
    \ With the aid of jQuery and Velocity, one such implementation could look like\
    \ this:\n\n```\n$(\"svg\").on(\"mouseover\", function() {\n  $(\"#circleleft,\
    \ #circleRight\").velocity(\"reverse\");\n});\n```"
