- md: "\n# CONSIDER OPACITY OVER COLOR\n\nopacity is another CSS property that receives\
    \ a GPU rendering boost since it doesn't affect the positioning of elements. So,\
    \ if there are elements on your page for which you're currently animating, say,\
    \ color when the user hovers over them, consider animating opacity instead. If\
    \ the net effect looks almost as good as the color animation, then consider sticking\
    \ with it—you've just boosted the UI's performance without compromising its look.\n\
    \nAs a performance-minded developer, you're no longer allowed to arbitrarily select\
    \ animation properties. You must now consider the impact of each of your property\
    \ choices.\n\n> NOTE: Refer to CSSTriggers.com for a breakdown of how CSS properties\
    \ affect browser performance.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_146_0.png)\n\
    \n# TECHNIQUE: REDUCE CONCURRENT LOAD\n\nBrowsers have bottlenecks. Find out what\
    \ they are and stay below them.\n\n# PROBLEM\n\nWhen a page first loads, the browser\
    \ processes HTML, CSS, JavaScript, and images as quickly as possible. It should\
    \ come as no surprise that animations occurring during this time tend to be laggy—they're\
    \ fighting for the browser's limited resources. So, despite the fact that a page's\
    \ loading sequence is often a great time to flaunt all your motion design skills,\
    \ it's best to restrain yourself if you want to avoid giving users the first impression\
    \ that your site is laggy.\n\nA similar concurrency bottleneck arises when many\
    \ animations occur at once on a page—regardless of where they take place in the\
    \ page's lifecycle. In these situations, browsers can choke under the stress of\
    \ processing many style changes at once, and stuttering can occur.\n\nFortunately,\
    \ there are some clever techniques for reducing concurrent animation load.\n\n\
    # SOLUTION\n\nThere are two approaches for addressing the concurrency issue: staggering\
    \ and breaking up animations into sequences.\n\n# STAGGER\n\nOne way to reduce\
    \ concurrent animation load is to make use of Velocity's UI pack's stagger feature,\
    \ which delays the start times of successive animations in a set of elements by\
    \ a specified duration. For example, to animate every element in a set toward\
    \ an opacity value of 1 with successive 300ms delays between start times, your\
    \ code might look like this:\n\n```\n$elements.velocity({ opacity: 1 }, { stagger:\
    \ 300 });\n```\n\nThe elements are no longer animating in perfect synchronization;\
    \ instead, at the very start of the entire animation sequence, only the first\
    \ element is animating. Later, at the very end of the entire sequence, only the\
    \ last element is animating. You're effectively spreading the animation sequence's\
    \ total workload so that the browser is always performing work at one time than\
    \ it would have had it been animating every element simultaneously. What's more,\
    \ implementing staggering into your motion design is often a good aesthetic choice.\
    \ (Chapter 3, \"Motion Design Theory,\" further explores the merits of staggering.)\n\
    \n# MULTI-ANIMATION SEQUENCES\n\nThere's one more clever way to reduce concurrent\
    \ load: break up properties into multi-animation sequences. Take, for example,\
    \ the case of animating an element's opacity value. This is typically a relatively\
    \ low-stress operation. But, if you were to simultaneously animate the element's\
    \ width and box-shadow properties, you would be giving the browser appreciably\
    \ more work to perform: more pixels will be affected, and more computation to\
    \ be required.\n\nHence an animation looks like this:\n\n```\n$images.velocity({\
    \ opacity: 1, boxShadowBlur: \"50px\" });\n```\n\nmight be refactored into this:\n\
    \n```\n$images\n.velocity({ opacity: 1 })\n.velocity({ boxShadowBlur: \"50px\"\
    \ });\n```\n\nThe browser has less concurrent work to do since these individual\
    \ property animations occur one after another. Note that the creative tradeoff\
    \ being made here is that we've opted to prolong the total animation sequence\
    \ duration, which may or not be desirable for your particular use case.\n\nSince\
    \ an optimization such as this entails the intention of your motion design, this\
    \ is not a technique that should always be employed. Consider it a last resort.\
    \ If you need to squeeze additional performance out of low-powered devices, then\
    \ this technique might be suitable. Otherwise, don't over-optimize the code on\
    \ your site using techniques like this, or you will end up with unnecessarily\
    \ bloated and inexpressive code.\n\n# TECHNIQUE: DON’T CONTINUOUSLY REACT TO SCROLL\
    \ AND RESIZE EVENTS\n\nBe mindful of how often your code is being run. A fast\
    \ snippet of code being run 1,000 times per second may—in aggregate—no longer\
    \ be very fast.\n\n# PROBLEM\n\nBrowsers' scroll and resize events are two event\
    \ types that are triggered at very high rates: when a user resizes or scrolls\
    \ the browser window, the browser fires the callback functions associated with\
    \ these events many times per second. Hence, if you've registered callbacks that\
    \ interact with the DOM—or worse, contain layout thrashing—they can cause tremendously\
    \ high load during times of scrolling and resizing. Consider the following code:\n\
    \n```\n// Perform an action when the browser window is scrolled\n$(window).scroll(function()\
    \ {\n  // Anything in here is fired multiple times per second while the\n  //\
    \ user scrolls\n});\n\n// Perform an action when the browser window is resized\n\
    $(window).resize(function() {\n  // Anything in here is fired multiple times per\
    \ second while the\n  // user resizes\n});\n```\n\nRecognize that the functions\
    \ above aren't simply called once when their respective events start: instead,\
    \ they are called throughout the duration of the user's respective interaction\
    \ with the page.\n\n# SOLUTION\n\nThe solution to this problem is debounce event\
    \ handlers. Debouncing is the process of defining an interval during which an\
    \ event handler will be called only once. The code for a debounce implementation\
    \ is beyond the scope of this book. Fortunately, many libraries exist exclusively\
    \ to solve this problem. Visit davidwalsh.name/javascript-function for one example.\
    \ Further, the tremendously popular Underscore.js (UnderscoreJS), a JavaScript\
    \ library akin to jQuery that provides helper functions for making coding easier,\
    \ includes a debounce function that you can easily reuse across your event handlers.\n\
    \n> **NOTE:** As of this book's writing, the latest version of Chrome automatically\
    \ debounces scroll events.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_150_0.png)\n\
    \n# TECHNIQUE: REDUCE IMAGE RENDERING\n\nNot all elements are rendered equally.\
    \ Browsers have to work overtime when displaying certain elements. Let's look\
    \ at which those are.\n\n# PROBLEM\n\nVideos and images are multimedia element\
    \ types that browsers have to work extra hard to render. Whereas the dimensional\
    \ properties of non-multimedia HTML elements can be computed with ease, multimedia\
    \ elements thousands of pixel-by-pixel data points that are computationally expensive\
    \ for browsers to resize, reposition, and composite. Animating these elements\
    \ will always be less than optimal versus animating standard HTML elements such\
    \ as div, p, and table.\n\nFurther, given that scrolling a page is nearly equivalent\
    \ to animating a page (think of scrolling as animating the page's top property),\
    \ multimedia elements can also drastically reduce performance on CPU-constrained\
    \ mobile devices.\n\n# SOLUTION\n\nUnfortunately, there's no way to \"refactor\"\
    \ multimedia content into faster element types, other than turning simple, shape-based\
    \ images into SVG elements wherever possible. Accordingly, the only available\
    \ performance optimization is reducing the total number of multimedia elements\
    \ that are displayed on the page at once and animated at once. Note that the words\
    \ stress reality of browser rendering: browsers only render what is visible. The\
    \ portions of your page (including the portions that contain additional images)\
    \ aren't visible do not get rendered, and do not impose additional stress on browser\
    \ processes.\n\nSo, there are two best practices to follow. First, if you're ever\
    \ on the fence about adding an additional image to your page, opt not to include\
    \ it. The fewer images there are to render, the better UI performance will be.\
    \ (Not to mention the positive impact fewer images will have on your page's network\
    \ load time.)\n"
  mdcn: "\n\n# 考虑透明度而非颜色\n\nopacity 是另一个 CSS 属性，由于它不影响元素的定位，它可以获得 GPU 渲染加速。因此，如果你的页面上有某些元素你正在对其进行动画处理（例如在用户悬停时改变颜色），请考虑改为动画化透明度。如果最终视觉效果与颜色动画几乎无异，那么就坚持使用它——你这样在不损害视觉效果的情况下，提升了\
    \ UI 性能。\n\n作为一名关注性能的开发者，你不再被允许随意选择动画属性。你现在必须考虑所选择的每个属性所产生的影响。\n\n> 注意：请参考 CSSTriggers.com\
    \ 了解 CSS 属性如何影响浏览器性能的详细分析。\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_146_0.png)\n\
    \n# 技巧：减少并发负载\n\n浏览器存在瓶颈。找出它们在哪里，并保持在这些限制以下。\n\n# 问题\n\n当页面首次加载时，浏览器会尽可能地处理 HTML、CSS、JavaScript\
    \ 和图像。在此期间发生的动画往往会卡顿，这并不意外——因为它们正在争夺器的有限资源。因此，尽管页面的加载序列通常是展示所有动态设计技巧的好时机，但如果你想避免给用户留下网站很卡顿的初印象，最好克制一下自己。\n\
    \n当页面上同时发生许多动画时，也会出现类似的并发瓶颈——无论它们发生在页面生命周期的哪个阶段。在这种情况下，浏览器可能会在同时处理许多样式变化的压力下崩溃，并出现掉帧现象。\n\
    \n幸运的是，有一些巧妙的技巧可以减少并发动画负载。\n\n# 解决方案\n\n解决并发问题有两种方法：交错（staggering）和将动画分解为序列。\n\
    \n# 交错 (STAGGER)\n\n减少并发动画负载的一种方法是利用 Velocity UI 包中的交错功能，它可以根据指定的时长延迟一组元素中连续动画的开始时间。例如，要让一组中的每个元素向透明度值\
    \ 1 执行动画，且开始时间之间有 300ms 的延迟，你的代码可能如下：\n\n```\n$elements.velocity({ opacity: 1\
    \ }, { stagger: 300 });\n```\n\n元素不再是完美同步地进行动画；相反，在整个动画序列的刚开始，只有第一个元素在进行动画。稍后，在整个序列的最后，只有最后一个元素在进行动画。你实际上分散了整个动画序列的总工作量，使得浏览器每次执行的工作量比同时动画每个元素时要少。此外，在你的动态设计中引入交错通常是一个很好的美学选择。（第\
    \ 3 章“动态设计理论”进一步探讨了交错的优点。）\n\n# 多重动画序列\n\n还有一种巧妙的方法可以减少并发负载：将属性分解为多动画序列。以动画元素的透明度值为例，这通常是一个压力较小的操作。但如果你同时动画元素的宽度和投影投影（box-shadow）属性，你就会给浏览器增加明显的工作量：会有更多像素受到影响，需要更多的计算。\n\
    \n因此，动画看起来像这样：\n\n```\n$images.velocity({ opacity: 1, boxShadowBlur: \"50px\"\
    \ });\n```\n\n可能会被重构为：\n\n```\n$images\n.velocity({ opacity: 1 })\n.velocity({\
    \ boxShadowBlur: \"50px\" });\n```\n\n由于这些单个属性动画是相继发生的，浏览器需要执行的并发工作变少了。请注意，这里所做的创作权衡是我们选择了延长整个动画序列的时长，这对于你的特定用例可能理想也可能不利。\n\
    \n由于这种优化涉及到你动态设计的意图，因此这不是一种应该始终采用的技术。请将其视为最后手段。如果你需要从低性能设备中挤榨出额外的性能，那么这种技术可能是合适的。否则，不要使用此类技术过度优化你网站的代码，否则你最终将得到不必要的臃肿且缺乏表现力的代码。\n\
    \n# 技巧：不要连续地响应滚动和缩放事件\n\n留意你的代码运行的频率。一段每秒运行 1,000 次的快速代码——从整体来看——可能就不再快了。\n\n\
    # 问题\n\n浏览器的滚动事件和缩放事件是两种触发频率极高的事件类型：当用户缩放或滚动浏览器窗口时，浏览器每秒会触发多次与这些事件相关的回调函数。因此，如果你注册了与\
    \ DOM 交互的回调——更糟糕的是包含布局抖动（layout thrashing）的回调——它们在滚动和缩放期间会导致巨大的负载。考虑以下代码：\n\n\
    ```\n// 当浏览器窗口滚动时执行操作\n$(window).scroll(function() {\n  // 当用户滚动时，这里的任何内容\n  //\
    \ 每秒都会触发多次\n});\n\n// 当浏览器窗口缩放时执行操作\n$(window).resize(function() {\n  // 当用户缩放时，这里的任何内容\n\
    \  // 每秒都会触发多次\n});\n```\n\n要意识到，上述函数并不是在各自事件开始时简单地调用一次：相反，它们在用户与页面交互的整个期间都会被不断调用。\n\
    \n# 解决方案\n\n解决此问题的方法是对事件处理程序进行防抖（debounce）。防抖是定义一个间隔的过程，在此间隔内，事件处理程序只会被调用一次。防抖实现的代码超出了本书的范围。幸运的是，有许多库专门用于解决这个问题。访问\
    \ davidwalsh.name/javascript-function 查看一个示例。此外，广受欢迎的 Underscore.js (UnderscoreJS)\
    \ 是一个类似于 jQuery 的 JavaScript 库，提供了帮助简化编码的辅助函数，它包含了一个 debounce 函数，你可以轻松地在你的事件处理程序中复用它。\n\
    \n> **注意：** 在本书编写时，最新版本的 Chrome 会自动对滚动事件进行防抖。\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_150_0.png)\n\
    \n# 技巧：减少图像渲染\n\n并不是所有元素的渲染方式都是相同的。浏览器在显示某些元素时必须额外工作。让我们来看看是哪些元素。\n\n# 问题\n\n\
    视频和图像是浏览器必须额外努力才能渲染的多媒体元素类型。虽然非多媒体 HTML 元素的尺寸属性可以轻松计算，但多媒体元素包含数千个像素级数据点，对于浏览器来说，调整大小、重新定位和合成这些数据的计算代价很大。与动画\
    \ div、p 和 table 等标准 HTML 元素相比，动画这些元素总是次优。\n\n此外，考虑到滚动页面几乎等同于动画页面（将滚动视为动画页面的顶部属性），多媒体元素还会极大降低\
    \ CPU 受限的移动设备的性能。\n\n# 解决方案\n\n遗憾的是，没有办法可以将多媒体内容重构为更快的元素类型，除非将简单的基于形状的图像转换为 SVG\
    \ 元素。因此，唯一的性能优化方法是减少同时显示和同时动画的多媒体元素总数。请注意这些词强调了浏览器渲染的现实：浏览器只渲染可见部分。你页面中不可见的部分（包含额外图像的部分）就不会被渲染，也不会给浏览器进程带来额外压力。\n\
    \n所以，要遵循两个最佳实践。首先，如果你在犹豫是否要在页面上添加一张额外的图像，请选择不包含它。渲染的图像越少，UI 性能就越好。（更不用说，更少的图像对你的页面网络加载时间也有积极影响。）"
