    \ to the px unit type\nleft: \"50%\", // we manually specify the % unit type\n\
    rotateZ: 25 // Defaults to the deg unit type\n});\n```\n\nExplicitly declaring\
    \ unit types for all property values increases your code's legibility by making\
    \ the contrast between the px unit and its alternatives more obvious when quickly\
    \ eyeballing your code.\n"
  mdcn: "\n\n# 结语\n\n在 CSS 中设计动画时，你本质上受限于 CSS 规范所提供的功能。在 JavaScript 中，由于编程语言的本质，第三方库对运动设计具有无限的逻辑控制力。动画引擎利用这一点提供了强大的功能，极大地改进了工作流并扩展了交互式运动设计的可能性。这正是本书的核心内容：以最高效的方式设计精美的动画。\n\
    \n下一章将介绍如何使用本书选择的 JavaScript 动画引擎：Velocity.js。通过掌握 Velocity.js，你将理解如何利用我们刚刚介绍的许多功能，以及更多功能。\n\
    \n# 第 2 章\n\n# 使用 Velocity.js 制作动画\n\n在本章中，你将学习 Velocity.js 提供的功能、命令和选项。如果你熟悉基于\
    \ jQuery 的动画，那么你已经知道如何使用 Velocity 了；它的运行机制与 jQuery 的 `$.animate()` 函数几乎完全相同。\n\
    \n但无论你现有的知识如何，本章中有条理的功能拆解都将向你介绍动画引擎行为的细微差别。掌握这些细微差别将帮助你从新手蜕变为专业人士。即使你已经对 JavaScript\
    \ 动画和 Velocity.js 非常熟悉，也请帮自己自己快速浏览这一章。你一定会发现一些你从未意识到可以做到的。\n\n# JavaScript 动画库的类型\n\
    \n有很多类型的 JavaScript 动画库。有些在浏览器中模拟物理交互。有些让 WebGL 和 Canvas 动画更易维护。有些专注于 SVG 动画。有些则改进了\
    \ UI 动画——而这种类型是本书的重点。\n\n两个流行的 UI 动画库是 GSAP（可以在 GreenSock.com 下载）和 Velocity（可以在\
    \ VelocityJS.org 下载）。在本书中你将一直使用 Velocity，因为它在 MIT 许可证下是免费的（GSAP 根据网站的业务模式需要许可费用），此外，它在编写简洁且具表现力的动画代码方面拥有极其强大的功能。它被广泛用于许多热门网站，包括\
    \ Tumblr、Gap 和 Scribd。\n\n哦，它是由本书作者创建的！\n\n# 安装 JQUERY 和 VELOCITY\n\n你可以从 jQuery.com\
    \ 下载 jQuery，从 VelocityJS.org 下载 Velocity。要在你的页面上使用它们（像使用任何 JavaScript 库一样），只需在页面的\
    \ `<body>` 标签之前包含指向各自库的 `<script></script>` 标签。如果你链接的是预托管的库版本（而不是计算机本地的副本），你的代码可能如下：\n\
    \n```html\n<<html>\n<head>My Page</head>\n<body>\n  My content.\n  <script src=\"\
    //code.jquery.com/jquery-2.1.1.min.js\"></script>\n  <script src=\"//cdn.jsdelivr.net/velocity/1.1.0/velocity.min.js\"\
    ></script>\n</body>\n</html>\n```\n\n当将 jQuery 和 Velocity 结合使用时，请在 Velocity 之前包含\
    \ jQuery。\n就是这样！现在你准备好大显身手了。\n\n# 使用 VELOCITY：基础\n\n为了熟悉 Velocity，我们将从基础组件开始：参数、属性、值和链式调用。由于\
    \ jQuery 无处不在，因此查看 Velocity 与 jQuery 之间的关系也同样重要。\n\n# VELOCITY 和 JQUERY\n\nVelocity\
    \ 独立于 jQuery 运行，但两者可以结合使用。通常情况下这样做更好，以便利用 jQuery 的链式调用能力：当你使用 jQuery 预选一个元素时，可以通过调用\
    \ `.velocity()` 来扩展它并对其制作动画：\n\n```javascript\n// 给 jQuery 元素赋值变量\nvar div = $(\"\
    #div\");\n// 使用 Velocity 动画化元素\n$div.animate({ opacity: 0 });\n```\n\n这种语法与 jQuery\
    \ 自身的 `animate` 函数相同：\n$div.animate({ opacity: 0 });\n\n本书中的所有示例都将 Velocity 与\
    \ jQuery 结合使用，因此遵循这种语法。\n\n# 参数\n\nVelocity 接受多个参数。它的第一个参数是一个对象，将 CSS 属性映射到它们期望的最终值。这些属性及其接受的值与\
    \ CSS 中使用的属性直接对应（如果你不熟悉基础 CSS 属性，请在阅读本书之前读一本入门的 HTML 和 CSS 书）：\n\n```javascript\n\
    // 将元素动画化为宽度 \"500px\"，不透明度为 1。\n$element.velocity({ width: \"500px\", opacity:\
    \ 1 });\n```\n\n> 提示：在 JavaScript 中，如果你提供的属性值包含字母（而不仅仅是整数），请将该值放在引号中。\n\n你可以通过第二个参数传递一个指定了动画选项的对象：\n\
    \n```javascript\n$element.velocity({ width: \"500px\", opacity: 1 },\n{ duration:\
    \ 400, easing: \"swing\" });\n```\n\n这里还有一种简写参数语法：与其作为第二个参数传递选项对象，不如使用逗号分隔的语法。这意味着可以用任何逗号分隔的顺序列出\
    \ `duration`（接受整数值）、`easing`（字符串值）和 `complete`（函数值）的值。（你将在文档中学习这些选项的所有详细说明。）\n\
    \n```javascript\n// 以 1000ms 的持续时间动画（并隐式使用默认的 \"swing\" 缓动值）\n$element.velocity({\
    \ top: 50 }, 1000);\n// 以 1000ms 的持续时间和 \"ease-in-out\" 缓动进行动画\n$element.velocity({\
    \ top: 50 }, 1000, \"ease-in-out\");\n// 以 \"ease-out\" 缓动进行动画（并隐式使用默认的 400ms\
    \ 持续时间）\n$element.velocity({ top: 50 }, \"ease-out\");\n// 在动画完成后触发回调\n$element.velocity({\
    \ top: 50 }, 1000, function() { alert(\"Complete.\"); });\n```\n\n简写参数语法：与其作为第二个参数传递选项对象，不如使用逗号分隔的语法。这意味着可以用任何逗号分隔的顺序列出\
    \ `duration`（接受整数值）、`easing`（字符串值）和 `complete`（函数值）的值。（你将在文档中学习这些选项的所有详细说明。）\n\
    \n（注：此处原文中示例代码块存在括号不匹配等格式错误，翻译时已根据逻辑修正）\n\n"
