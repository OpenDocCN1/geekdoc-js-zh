    \n## 第 5 章\n\n## 文本动画\n\n由于文本动画在网页中很少使用，使用它是给用户留下印象的一种简单方法。这正是这个主题学习起来如此有趣的原因：底层技术编程很简单，但对用户来说效果感觉非常丰富且复杂。\n\
    \n本章将向你介绍消除文本动画枯燥部分的工具，并为你提供一套高效的工作流。继续阅读以了解这门“黑艺术”的细微之处。\n\n## 标准的文本动画方法\n\n\
    我们编写代码的标准 HTML 元素——div、表格、锚点标签等——是网页中可以设置样式的低级组件。因此，让这些成为可以进行动画的低级组件也是合合理的。\n\n\
    文本本身并不构成一个元素；一段文本被浏览器指定为“文本节点”，这是一种不可样式的低级组件，必须包含在元素内部。进一步增加复杂性的因素是，浏览器不会将文本节点细分为语法组件；没有办法访问单个字母、单词或句子。\n\
    \n因此，要以字母、单词或句子为基础进行动画，你必须将每个文本节点拆分为单独的文本节点，然后将其中的每一个封装在一个新元素中。你可以对它们进行动画处理。但例如，手动将文本封装在\
    \ span 元素中是一项枯燥的工作，会导致 HTML 膨胀。\n\n网页上的文本动画不常见并不意外；处理这些软件通常太麻烦了。这使得网页在审美上处于相对于专门的运动设计软件（如\
    \ Adobe After Effects）的劣势，后者允许对文本进行精细的动画处理——其结果常见于电视广告和电影片头序列。这些效果可以看起来绝对非常美。遗憾的是，除了在网页上难以集成之外，它们也被广泛认为是不良做法。毕竟，网页是一种功能优先于形式的媒介，而文本动画在很大程度上是关于形式的。\n\
    \n然而有一种文本动画案例在节节使用时可以在网页上良好运行；如果你密切关注电影中未来硬件界面的描写，你会注意到一个共同点：文本在图形层上被动画化移出视野。根据流行文化，未来的计算由带有闪烁、故障、弹出和爆发效果的动画化单词和句子组成。这些效果看起来很酷，而且为了将内容移出视野的目的，采用它们并没有多少坏处，因为文本必须得以某种方式经历可见性动画。这种转换文本可见性的概念正是你将在本章中学学的。\n\
    \n## 文本效果看起来很酷。\n\n## 为动画准备文本元素（使用 BLAST）\n\n用于文本动画的首选工具是 Blast.js，它可以方便地将文本拆分为字符、单词和句子。然后你可以使用\
    \ Velocity 对这些部分进行动画处理。\n\n> 注意：访问 Julian/blast\n\nBlast.js 有三种分隔符类型来定义要提取的语法组件：字符、单词和句子。假设你有这样一个\
    \ div：\n\n```\n<div>Hello World</div>\n```\n\n```\n$(\"div\").blast({ delimiter:\
    \ \"word\" });\n```\n\n该 div 将变成：\n\n```html\n<div class=\"blast-root\">\n  <span\
    \ class=\"blast\">Hello</span>\n  <span class=\"blast\">World</span>\n</div>\n\
    ```\n\n正如你所看到的，Blast 将 div 的文本拆分为 span 元素。如果你使用字符分隔符，结果将是：\n\n```html\n<div class=\"\
    blast-root\">\n  <span class=\"blast\">H</span>\n  <span class=\"blast\">e</span>\n\
    \  <span class=\"blast\">l</span>\n  <span class=\"blast\">l</span>\n  <span class=\"\
    blast\">o</span>\n  <span class=\"blast\"> </span>\n  <span class=\"blast\">W</span>\n\
    \  <span class=\"blast\">o</span>\n  <span class=\"blast\">r</span>\n  <span class=\"\
    blast\">l</span>\n  <span class=\"blast\">d</span>\n</div>\n```\n\n你现在可以对这些元素进行动画处理了。在深入学习之前，你将了解更多关于\
    \ Blast 的原理，以便充分利用其功能。\n\n## BLAST.JS 的工作原理\n\n本节的目标是让你熟悉使用 Blast 拆分你喜爱的页面文本的想法。让我们开始吧！\n\
    div、表格以及你熟悉的其他 HTML 元素被称为元素节点。一个元素通常由两种类型组成：额外的元素节点和文本节点（原始文本）。\n以该元素为例：\n\n```html\n\
    <div>Hello <span>World</span></div>\n```\n\n该元素由两个部分组成：一个文本节点（Hello）和一个 span 元素节点。span\
    \ 元素节点包含其所有者的孩子：另一个文本节点（World）。\n\n当调用 Blast 时，它会遍历目标元素的整个后代链以寻找文本节点。对于每个文本节点，Blast\
    \ 会根据指定的分隔符（字符、单词或句子）执行正则表达式查询，将节点拆分为元素。由于 Blast 并没有真正拆分元素——你可以安全地将其应用于整个页面，而必担心破坏事件处理程序或其他预期行为。\n\
    \n"
