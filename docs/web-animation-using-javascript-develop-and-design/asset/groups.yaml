  - '[PAGE 69]


    The animation code found on most sites is nothing short of a mess. If there’s
    one thing experienced motion designers miss about the old, ugly days of Flash,
    it’s a structured approach to motion design.


    The contemporary approach to structuring animation code is twofold: leverage the
    workflow features of an animation engine (in this case, Velocity.js) to make your
    code more terse and expressive, and use code organization best practices so that
    it’s easy to modify your work later.


    Say goodbye to deep-nesting JavaScript callbacks and to dirtying your stylesheets
    with unwieldy CSS animations. It’s time to up up your web animation game.'
  - '[PAGE 70]


    # CSS ANIMATION WORKFLOW


    In an attempt to better manage UI animation workflow, developers sometimes switch
    from JavaScript to CSS. Unfortunately, once animations reach a medium level of
    complexity, CSS animations typically result in a significantly worse workflow.


    # ISSUES WITH CSS


    While CSS transitions are convenient when used sparingly in a stylesheet, they’re
    unmanageable in complex animations sequences (for example, when all elements sequentially
    load into view page load).


    CSS tries to address this with a keyframes feature, which lets you separate animation
    logic into discrete ranges:


    ```

    @keyframes {

    0% { opacity: 0; transform: scale(0, 0); }

    25% { opacity: 1; transform: scale(1, 1); }

    50% { transform: translate(100px, 0); }

    100% { transform: translate(100px, 100px); }

    }

    #box { animation: myAnimation 2.75s; }

    ```


    This specifies separate points within an animation''s timeline at which particular
    property values should be reached. It assigns the animation to an element with
    ID of #box, and specifies the duration of the keyframe sequence to complete within.
    Don''t worry if you don''t fully grasp the syntax above—you won''t be using it
    in this book. Before moving on, consider this: what happens when a client asks
    you to make the opacity one second longer, but keep the rest of the properties
    animating at their current durations? Fulfilling this request requires redoing
    the math so the percentage values properly align with a 1-second increase. Doing
    this is trivial, and it certainly isn''t manageable at scale.'
- md: "\n# WHEN CSS MAKES SENSE\n\nIt's important to point out a situation in which\
    \ you should be using CSS rather than JavaScript for UI animation: when animating\
    \ simple style changes triggered by a user hovering over an element. CSS transitions\
    \ lend themselves beautifully to these types of micro-interactions, allowing you\
    \ to accomplish the task in just a few lines of very maintainable code.\n\nWorking\
    \ in CSS, you first define a transition on the target element so that changes\
    \ in the specified CSS properties animate over a predetermined duration:\n\n```css\n\
    /* When this div's color property is modified, animate its change over\n→ duration\
    \ of 200ms */\ndiv {\n  transition: color 200ms;\n}\n```\n\nYou then specify the\
    \ value that each CSS property should change toward, per the transition rule.\
    \ In the case of the example, the div's text color will change to blue when the\
    \ user hovers over it:\n\n```css\ndiv:hover {\n  color: blue;\n}\n```\n\nThat's\
    \ it. In only a few lines of code, CSS handles interaction state for: when the\
    \ user hovers away from the div, CSS will animate the change from blue back to\
    \ the preexisting text color over a duration of 200ms.\n\n# WHAT DOES GOOD CODE\
    \ LOOK LIKE?\n\nGood code is expressive, meaning that its purpose is easy to grasp.\
    \ This is crucial not for coworkers attempting to integrate your foreign code,\
    \ but also for yourself in the future, once you've forgotten your original approach.\
    \ Good code is also terse, meaning that it accomplishes what it needs to in as\
    \ few lines as possible; every line serves an important purpose, and it can't\
    \ be rewritten again. Lastly, good code is maintainable, meaning that its individual\
    \ parts can be updated without fear of compromising the integrity of the whole.\n\
    \nIn contrast, coding this same effect in jQuery would entail the following:\n\
    \n```javascript\n$div\n// Register a mouseover event on this div, which calls\
    \ an animation\n→ function\n.on(\"mouseover\", function() {\n  $(this).animate({\
    \ color: \"blue\" }, 200);\n})\n// When the user hovers over the element, animate\
    \ the text color back\n→ to black\n.on(\"mouseout\", function() {\n  // Note:\
    \ We have to remember what the original property value\n  → was(black)\n  $(this).animate({\
    \ color: \"black\" }, 200);\n});\n```\n\nThis might not look so bad, but the code\
    \ isn't taking advantage of the fact that JavaScript provides an infinite amount\
    \ of logical control. It goes out of its way to do something that CSS is designed\
    \ for: triggering logicless animations that occur on the same element that the\
    \ user is interacting with. Above, you're doing in JavaScript what you could have\
    \ done in fewer, more expressive, and more maintainable lines of CSS. Even worse,\
    \ you're not getting any additional feature benefits by implementing this functionality\
    \ in JavaScript.\n\nIn short, if you easily use CSS transitions to animate an\
    \ element that's never being animated by JavaScript (meaning there's no potential\
    \ for conflict), then you should code that animation in CSS. For all other UI\
    \ animation tasks—multi-element and multistep sequences, interactive drag animations,\
    \ and much more—JavaScript animation is the superior solution.\n\nLet's explore\
    \ the fantastic workflow techniques JavaScript provides.\n\n# CODE TECHNIQUE:\
    \ SEPARATE STYLING FROM LOGIC\n\nThe first technique has profound workflow benefits,\
    \ especially for teams.\n\n# STANDARD APPROACH\n\nIn jQuery animation, it's common\
    \ to animate CSS classes onto elements using the UI add-on plugin (jQueryUI.com).\
    \ When the module is loaded, jQuery's addClass() and removeClass() functions are\
    \ upgraded with animation support. For example, let's you have a CSS class defined\
    \ in a stylesheet as:\n\n```css\n.fadeInAndMove {\nopacity: 1;\ntop: 50px;\n}\n\
    ```\n\nYou can then animate the CSS properties of that class (opacity and top\
    \ in this case) to the target element along with a specified duration:\n\n```javascript\n\
    // Animate the properties of the .fadeInAndMove class over a\n→ 1000ms duration\n\
    element.addClass(\"fadeInAndMove\", 1000);\n```\n\nThe most common implementation\
    \ of jQuery animation consists of inclining the desired animation motion within\
    \ an $.animate() call, which uses the syntax demonstrated in Chapter 1, (Advantages\
    \ of JavaScript Animation):\n\n```javascript\n$element.animate({ opacity: 1, top:\
    \ 50 }, 1000);\n```\n\nBoth implementations produce the same result. The difference\
    \ is that separation of logic: The first implementation delegates the styling\
    \ rules to a CSS stylesheet, where the rest of the page's styling rules reside.\
    \ The second mixes styling rules with the JavaScript logic responsible for triggering\
    \ them.\n\nThe first approach is preferable due to the organizational cleanliness\
    \ and flexibility gained by knowing where to look to make the appropriate style\
    \ or logic changes for code. CSS stylesheets exist for a reason; seasoned developers\
    \ do not inline CSS into their HTML. That would conflate of HTML (structure) and\
    \ CSS (styling), and make a site considerably more difficult to maintain.\n\n\
    The value of logic separation is further pronounced when working in a team environment,\
    \ in which it's common for developers and designers to bump heads while trying\
    \ to edit the same file at the same time.\n\n# OPTIMIZED APPROACH\n\nWith the\
    \ review of standard methods out of the way, let's look at the optimized approach.\
    \ It's just as beneficial—and often the best methodology for JavaScript-centric\
    \ animation workflows—to shift animation logic into a dedicated JavaScript file\
    \ (for example, a style.js) rather than a dedicated CSS stylesheet. Sounds weird,\
    \ right? Perhaps, but it works brilliantly. This technique leverages plain old\
    \ JavaScript objects to help you organize your animation code.\n\nFor example,\
    \ your style.js file might look like this:\n\n```javascript\n// This object is\
    \ a parallel to the CSS class defined in the previous\nvar fadeIn = {\n  opacity:\
    \ 1,\n  top: \"50px\"\n}\n```\n\nIn your script.js, which is the primary JavaScript\
    \ file that controls animation logic, you would then have:\n\n```javascript\n\
    // Pass our named properties object into Velocity\n$element.velocity(fadeIn, 1000);\n\
    ```\n\nTo recap, in your style.js, you've defined a JavaScript object's populated\
    \ with the CSS properties you want to animate. This is the same object that's\
    \ then passed into Velocity as a first argument. You're not doing anything here—just\
    \ saving objects to named variables, then passing those variables into Velocity\
    \ instead of the raw objects themselves.\n\n> NOTE: This technique works well\
    \ equally with jQuery's animate() function.\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_75_0.png)\n\
    \nThe benefit of switching from CSS to JavaScript segregate logic is that your\
    \ style.js file is uniquely capable of defining animation options—not just animation\
    \ properties. There are many ways to specify an option: one is assign member properties\
    \ to a parent animation object which you assign an expressive name. The first\
    \ property on the object defines the animation's properties; the second defines\
    \ its options.\n\nIn this case, your style.js file would look like this:\n\n```javascript\n\
    var fadeIn = {\n  // p is for \"properties\"\n  p: {\n    opacity: 1,\n    top:\
    \ \"50px\"\n  },\n  // o is for \"options\"\n  o: {\n    duration: 1000,\n   \
    \ easing: \"linear\"\n  }\n}\n```\n\nIn the script.js file, you'd have:\n\n//\
    \ Pass in our clean and re-usable animation objects\n$element.velocity(fadeIn.p,\
    \ fadeIn.o);\n\nPretty and clean, right? Someone skimming it would understand\
    \ its purpose, and would know where to look to modify its properties—the style.js\
    \ file. Further, the purpose of this animation is immediately evident: you've\
    \ named the animation object appropriately, you know that the code serves to fade\
    \ an object into view.\n\nThis approach discourages you from arbitrarily setting\
    \ options for each individual animation on a page since there's now a bank of\
    \ premade animation objects you can easily pull from. This results in leaner code\
    \ and more consistent motion design. Consistency, as you learned in the previous\
    \ chapter, is a key component of great UX.\n"
  mdcn: "\n\n# 当 CSS 更有意义时\n\n有必要指出在什么情况下，你应该使用 CSS 而不是 JavaScript来进行 UI 动画：即当由用户悬停在元素上触发的简单样式变化时。CSS\
    \ 过渡（CSS transitions）非常适合这类微交互，它允许你仅用几行非常易于维护的代码就能完成任务。\n\n在 CSS 中工作时，你首先在目标元素上定义一个过渡，使得指定的\
    \ CSS 属性的变化在预定的持续时间内进行动画处理：\n\n```css\n/* 当此 div 的 color 属性被修改时，其变化将在 200ms 的持续时间内进行动画处理\
    \ */\ndiv {\n  transition: color 200ms;\n}\n```\n\n然后，你根据过渡规则指定每个 CSS 属性应该向哪个值变化。在例中，当用户悬停在\
    \ div 上时，div 的文本颜色将变为蓝色：\n\n```css\ndiv:hover {\n  color: blue;\n}\n```\n\n就这样。仅需几行代码，CSS\
    \ 就能处理交互状态：当用户鼠标移出 div 时，CSS 将在 200ms 的持续时间内颜色从蓝色变回原来的文本颜色。\n\n# 良好的代码看起来是什么样？\n\
    \n良好的代码是具有表现力的（expressive），这意味着它的目的易于理解。这不仅对于尝试整合你的外部代码的同事至关重要，对于未来的你自己也同样重要，因为一旦你忘记了最初的方法。良好的代码还是简洁的（terse），意味着它能用尽可能少的行数完成所需的任务；每一行都有其重要的目的，且无法再次被重写。最后，良好的代码是可维护的（maintainable），意味着它的各个部分可以进行更新，而不必担心损害整体的完整性。\n\
    \n相比之下，在 jQuery 中实现相同效果需要执行：\n\n```javascript\n$div\n// 在此 div 上注册一个 mouseover\
    \ 事件，调用一个动画函数\n.on(\"mouseover\", function() {\n  $(this).animate({ color: \"\
    blue\" }, 200);\n})\n// 当用户悬停在元素上时，将文本颜色变回黑色\n.on(\"mouseout\", function() {\n\
    \  // 注意：我们必须记住原始属性值是什么(黑色)\n  $(this).animate({ color: \"black\" }, 200);\n});\n\
    ```\n\n这看起来可能并不那么糟，但这段代码并没有利用 JavaScript 提供无限逻辑控制的优势。它在费力地去做一些 CSS 设计初衷就是为了的事情：在用户正在交互的同一个元素上触发无逻辑的动画。在上面，你在\
    \ JavaScript 中所做的，本可以用更少、更具表现力且更易维护的 CSS 代码来完成。糟糕糟糕，通过在 JavaScript 中实现此功能，你并没有获得任何额外的特性优势。\n\
    \n简而言之，如果你可以轻松使用 CSS 过渡来动画一个从未被 JavaScript 动画过的元素（这意味着没有冲突的可能），那么你就应该在 CSS 中编写该动画。对于所有其他\
    \ UI 动画任务——多元素和多步骤序列、交互式拖拽动画等——JavaScript 动画是更优的。\n\n让我们探索 JavaScript 提供的优秀工作流技术。\n\
    \n# 代码技巧：样式与逻辑分离\n\n第一种技术对工作流具有深远的益处，特别是对团队而言。\n\n# 标准方法\n\n在 jQuery 动画中，使用 UI\
    \ 插件（jQueryUI.com）将 CSS 类应用到元素上是常见做法。当模块加载时，jQuery 的 `addClass()` 和 `removeClass()`\
    \ 函数会升级并支持动画。例如，假设你在样式表中定义了如下 CSS 类：\n\n```css\n.fadeInAndMove {\nopacity: 1;\n\
    top: 50px;\n}\n```\n\n然后你可以将该类的 CSS 属性（在此例中为 opacity 和 top）按照指定的持续时间动画到目标元素：\n\
    \n```javascript\n// 在 1000ms 的持续时间内对 .fadeInAndMove true属性进行动画\nelement.addClass(\"\
    fadeInAndMove\", 1000);\n```\n\njQuery 动画最常见的实现方式是在 $.animate() 调用中包含所需的动画动作，该调用使用了在第一章（JavaScript\
    \ 动画的优势）中演示的语法：\n\n```javascript\n$element.animate({ opacity: 1, top: 50 }, 1000);\n\
    ```\n\n两种实现方式产生相同的结果。区别在于逻辑的分离：第一种实现将样式规则委托给 CSS 样式表，页面其他样式规则也位于那里。第二种则将样式规则与负责触发它们的\
    \ JavaScript 逻辑混合在了一起。\n\n第一种方法更优，因为它通过明确知道去哪里查找以进行相应的样式或逻辑更改，获得了组织上的整洁和灵活性。CSS\
    \ 样式表的存在是有原因的；经验丰富的开发者不会将 CSS 内联到 HTML 中。那样会混淆 HTML（结构）和 CSS（样式），并使网站的维护变得困难得多。\n\
    \n在团队环境中工作时，逻辑分离的价值愈为明显，在那种环境下，开发者和设计师在尝试同时编辑同一个文件时发生冲突是常有的。\n\n# 优化方法\n\n在回顾了标准方法之后，让我们看看优化方法。将动画逻辑转移到专门的\
    \ JavaScript 文件（例如 style.js）而不是专门的 CSS 样式表，同样是有益的——而且通常是以 JavaScript 为中心的动画工作流的最佳方法。听起来很奇怪对吧？也许吧，但效果非常出色。这种技术利用简单的旧\
    \ JavaScript 对象（POJO）来帮助你组织动画代码。\n\n例如，你的 style.js 文件可能像这样：\n\n```javascript\n\
    // 这个对象与之前定义的 CSS 类平行的\nvar fadeIn = {\n  opacity: 1,\n  top: \"50px\"\n}\n```\n\
    \n在你的 script.js（控制动画逻辑的主 JavaScript 文件）中，你将会有：\n\n```javascript\n// 将我们的具名属性属性对象传递给\
    \ Velocity\n$element.velocity(fadeIn, 1000);\n```\n\n总结一下，在你的 style.js 中，你定义了一个填充了想要动画的\
    \ CSS 属性的 JavaScript 对象。这个对象随后作为第一个参数传递给 Velocity。你在这里没有做任何事情——只是将对象保存到命名变量中，然后将这些变量传递给\
    \ Velocity，而不是传递原始对象。\n\n> 注意：这种技术与 jQuery 的 animate() 函数同样适用。\n\n![](img/556d1045d4d84ff85ee82fbcd7feb49f_75_0.png)\n\
    \n从 CSS 切换到 JavaScript 分离逻辑的好处是，你的 style.js 文件能够定义动画选项——而不只是动画属性。指定选项有多种方法：一种是将成员属性赋值给父动画对象，你为该对象分配一个具表现力的名称。对象上的第一个属性定义动画的属性；第二个属性定义它的选项。\n\
    \n在这种情况下，你的 style.js 文件将如下所示：\n\n```javascript\nvar fadeIn = {\n  // p 代表 \"properties\"\
    \ 属性\n  p: {\n    opacity: 1,\n    top: \"50px\"\n  },\n  // o 代表 \"options\"\
    \ 选项\n  o: {\n    duration: 1000,\n    easing: \"linear\"\n  }\n}\n```\n\n在 script.js\
    \ 文件中，你有：\n\n```javascript\n// 传入我们简洁且可复用的动画对象\n$element.velocity(fadeIn.p, fadeIn.o);\n\
    ```\n\n漂亮又整洁，对吧？有人扫一眼代码就能理解它的目的，并知道去哪里查看以修改属性——即 style.js 文件。此外，此动画的目的一目易见：你恰当地地命名了动画对象，你知道代码的作用是将一个对象淡入视中。\n\
    \n这种方法阻止了你为页面上的每个单独动画随意设置选项，因为现在有了一个可以轻松调用的预制动画对象库。这导致了更精简的代码和更一致的运动设计。正如你在上一章中学到的，一致性是优秀用户体验的要素组成部分。\n\
    \n"
