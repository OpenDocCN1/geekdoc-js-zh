- img_proc: true
  md: 'You''ll see this output:


    ```

    npm notice created a lockfile as package-lock.json. You should commit this file.

    npm WARN newtwitbot@0.0.0 No description

    npm WARN newtwitbot@0.0.0 No repository field.

    + twit@2.2.9

    added 55 packages, removed 55 packages and updated 1 package in 15.243s

    ```


    After the twit package has finished installing, open the index.js file. We''ll
    start adding lines. (Don''t worry about the WARN lines! If we were building code
    to then store for other people to use, we would want to add a description. In
    this case, we aren''t.)


    > **Building the index.js File**


    If you get lost, don''t worry. The complete contents of the index.js file are
    listed at the end of this chapter.


    Open index.js in an editor and add these lines. They tell our bot to use the twit
    code and let the code access the Twitter application keys in the config.js file.


    ```

    // Dependencies

    var twit = require(''twit''), config = require(''./config'');

    ```


    Now under those lines, add the following:


    ```

    var Twitter = new twit(config);

    ```


    This line creates a variable called Twitter, a special object that has access
    to all the code in the twit library, as well as the keys we set up in the config.js
    file so that it can actually communicate with Twitter. (This is confusing, but
    think of this Twitter variable as a superhero. It''s more than just a single value;
    it can access lots of custom functions built to do things with Twitter like post,
    retweet, and favorite. This will be clearer by the end of the chapter.)'
