  md: "Remember using npm to install the Twitter code library called twit? We're going\
    \ to use npm again, this time to import another library called onoff that lets\
    \ us control the LED.\n\nTo install this library, use this command:\n\n```\npi@raspberrypi:~/newtwitbot\
    \ $ npm install --save onoff\n```\n\nAfter onoff has finished installing, create\
    \ and open a new file, helloBlink.js.\n\n```\npi@raspberrypi:~/newtwitbot $ nano\
    \ helloBlink.js\n```\n\nThis opens the editor with a new blank file. Here's the\
    \ code to enter:\n\n```\n//helloBlink.js\nvar Gpio = require('onoff').Gpio,\n\
    \  led = new Gpio(4, 'out');\nvar iv = setInterval(function () {\n  led.writeSync(led.readSync()\
    \ === 0 ? 1 : 0)\n}, 500);\n// Toggle state of the LED every half second\nsetTimeout(function\
    \ () {\n  clearInterval(iv);\n  led.writeSync(0);\n  // Turn LED off\n  led.unexport();\n\
    }, 2000);\n// End blinking after 2 seconds\n```\n\nSave this file.\n\nNow give\
    \ it a try with the node command:\n\n```\npi@raspberrypi:~/newtwitbot $ node helloBlink.js\n\
    ```\n\n# MAKE YOUR BOT DETECT YOUR TWITTER HANDLE\n\nBefore your bot can blink\
    \ in response to your Twitter handle being tweeted, it needs to be able to detect\
    \ when that happens."
  merge: -1
