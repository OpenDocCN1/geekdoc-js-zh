    # 3


    # Creating a Node Twitter Bot on Raspberry Pi


    You''ve written your first JavaScript program. Next, you''ll learn how to create
    a Twitter bot with Node that can run on any machine that has Node installed, including
    your Raspberry Pi.

    By now, you should already have Node installed on your system. This chapter will
    take you through the steps you need to set up and authorize a Twitter account,
    connect that account to a JavaScript program, and use the twit npm module in your
    program to do most of the work.


    # CREATE AND AUTHORIZE YOUR TWITTER ACCOUNT


    If you don''t have a Twitter account for your bot, create one at Twitter.com.'
- md: "## Do You Use Gmail?\n\nTwitter accounts are based off unique email addresses.\
    \ If you don't have a spare email address but you use Gmail, you can save the\
    \ hassle of creating a new email address with a handy trick. Gmail lets you add\
    \ a plus sign and a few letters to your address.\n\nFor example, if your Gmail\
    \ address is jane-doe@gmail.com, you can create other email addresses like janedoe+twitterbot@gmail.com\
    \ or janedoe+catbot@gmail.com.\n\nTwitter will think this is a new address, but\
    \ Gmail will place everything sent to that address into your existing inbox.\n\
    \nOne interesting side effect: It's relatively easy to set up a Gmail filter to\
    \ label all messages sent to that address as \"Twitterbot Email\" or something\
    \ similar. That way, you can see at a glance which emails have been sent to your\
    \ bot.\n\n**Step 1.** Log into the Twitter account you'll be using for your bot.\n\
    \n**Step 2.** Visit apps.twitter.com and click the Create New App button.\n\n\
    **Step 3.** You'll be presented with a form to fill out (Figure 3.1). Complete\
    \ all the fields. You can enter any website you wish, and make sure you type a\
    \ URL in the callback field. Don't worry too much about what you enter in the\
    \ fields now; you can change the contents at any time.\n\n**Step 4.** Click the\
    \ Developer Agreement check box and click Create Your Twitter Application.\n\n\
    **Step 5.** You'll now see a summary page. Click the Keys And Access Tokens tab\
    \ (Figure 3.2). The keys on this page connect your Twitter app to the Node bot\
    \ program you'll create later in this chapter.\n\n![Creating a new Twitter app\
    \ form](img/a0848e8632a09becbaacc6826f2a8219_30_0.png)\n\nFIGURE 3.1: Creating\
    \ a new Twitter app form\n\n![Keys And Access Tokens page](img/a0848e8632a09becbaacc6826f2a8219_30_1.png)\n\
    \nFIGURE 3.2: Keys And Access Tokens page\n\n**Step 6.** Scroll to the bottom\
    \ of this page and click the Create My Access Token button. This page now displays\
    \ an access token and access token secret (Figure 3.3). Leave this page open.\
    \ Next up, you'll create a file in your terminal and copy and paste info from\
    \ this page into it.\n\n![Keys for your Twitter application](img/a0848e8632a09becbaacc6826f2a8219_31_0.png)\n\
    \nFIGURE 3.3: Keys for your Twitter application\n\nIn the next section, you'll\
    \ set up a directory, initialize it, and create a configuration file with the\
    \ keys and tokens on this page.\n\n## Create a Configuration File\n\nOpen your\
    \ terminal on the device where you installed Node.\nCreate a new directory where\
    \ you can keep all your new Twitter bot files. I'll call mine newtwitbot. Navigate\
    \ to your new directory:\n\n```\npi@raspberrypi:~ $ mkdir newtwitbot\npi@raspberrypi:~\
    \ $ cd newtwitbot\npi@raspberrypi:~/newtwitbot $\n```\n\nOur Twitter bot will\
    \ use two files: config.js and index.js. Create them now with the touch command:\n\
    \n```\npi@raspberrypi:~/newtwitbot $ touch config.js index.js\npi@raspberrypi:~/newtwitbot\
    \ $ ls\nconfig.js index.js\n```\n\nWe need to edit the config.js file with the\
    \ Twitter keys for your app. Using the editor of your choice (I use nano), edit\
    \ your config.js file as shown here. Substitute your keys in place of the xxxxx\
    \ values:\n\n```\n//config.js\n/* TWITTER APP CONFIGURATION\n    consumer_key\n\
    \    consumer_secret\n    access_token\n    access_token_secret\n*/\nmodule.exports\
    \ = {\n    consumer_key: 'xxxxx',\n    consumer_secret: 'xxxxx',\n    access_token:\
    \ 'xxxxx',\n    access_token_secret: 'xxxxx'\n}\n```\n\nNow, the Twitter bot's\
    \ configuration is complete. These four values will be unique for each Twitter\
    \ application you create.\n\n## Create the Twitter Bot\n\nDo you remember the\
    \ npm application you installed along with Node? This handy application lets you\
    \ reuse code other people have previously written.\n\nThere's already a Twitter\
    \ code library called twit. We can import this library with npm and then use functions\
    \ to make communication with Twitter much easier.\n\nTo install this library,\
    \ use this command:\n\n```\npi@raspberrypi:~/newtwitbot $ npm install --save twit\n\
    ```\n\nYou'll see this output:\n\n```\nnpm notice created a lockfile as package-lock.json.\
    \ You should commit this file.\nnpm WARN newtwitbot@0.0.0 No description\nnpm\
    \ WARN newtwitbot@0.0.0 No repository field.\n+ twit@2.2.9\nadded 55 packages,\
    \ removed 55 packages and updated 1 package in 15.243s\n```\n\nAfter the twit\
    \ package has finished installing, open the index.js file. We'll start adding\
    \ lines. (Don't worry about the WARN lines! If we were building code to then store\
    \ for other people to use, we would want to add a description. In this case, we\
    \ aren't.)\n\n> **Building the index.js File**\n\nIf you get lost, don't worry.\
    \ The complete contents of the index.js file are listed at the end of this chapter.\n\
    \nOpen index.js in an editor and add these lines. They tell our bot to use the\
    \ twit code and let the code access the Twitter application keys in the config.js\
    \ file.\n\n```\n// Dependencies\nvar twit = require('twit'), config = require('./config');\n\
    ```\n\nNow under those lines, add the following:\n\n```\nvar Twitter = new twit(config);\n\
    ```\n\nThis line creates a variable called Twitter, a special object that has\
    \ access to all the code in the twit library, as well as the keys we set up in\
    \ the config.js file so that it can actually communicate with Twitter. (This is\
    \ confusing, but think of this Twitter variable as a superhero. It's more than\
    \ just a single value; it can access lots of custom functions built to do things\
    \ with Twitter like post, retweet, and favorite. This will be clearer by the end\
    \ of the chapter.)\n\nNext we'll get to the heart of our bot. We'll start by making\
    \ it find tweets that contain the text strings doggo or pupper. Then it will use\
    \ the console.log function you've already seen and post any found tweets to your\
    \ terminal.\n\nAdd this function, called retweet, to your index.js file:\n\n```\n\
    var retweet = function() {\n  var params = {\n    q: 'doggo OR pupper',\n    result_type:\
    \ 'recent'\n  }\n  Twitter.get('search/tweets', params, function(err, data) {\n\
    \    // if there no errors\n    if (!err) {\n      // grab ID of tweet to retweet\n\
    \      var retweetId = data.statuses[0].id_str;\n      // Tell Twitter to retweet\n\
    \      Twitter.post('statuses/retweet/:id',\n      {\n        id: retweetId\n\
    \      },\n      function(err, response) {\n        if (response) {\n        \
    \  console.log('Retweeted!!!');\n        }\n        // if there was an error while\
    \ tweeting\n        if (err) {\n          console.log('Error tweeting');\n   \
    \     }\n      });\n    }\n    // if unable to Search a tweet\n    else {\n  \
    \    console.log('Error searching');\n    }\n  });\n}\n```\n\nThere's a lot going\
    \ on here. This entire block of code is a single function. We'll take a closer\
    \ look in a minute, but let's get it working and try it first.\n\nIf you tried\
    \ to run this code right now, it wouldn't actually do anything. You've written\
    \ a function, but you haven't added any code that will call it. Let's do that\
    \ now. At the end of this code, add these lines:\n\n```\nretweet();\n// retweet\
    \ every 3 minutes\nsetInterval(retweet, 180000);\n```\n\nNow we're calling our\
    \ function every 180,000 milliseconds, or every 3 minutes. Change this to whatever\
    \ interval you wish.\n\n> **WARNING** If you run your bot too frequently, Twitter\
    \ will see that you're using up too many resources and will \"rate-limit\" you.\
    \ Once every 3 minutes is plenty.\n\nIt's time to try the program. Open your bot's\
    \ Twitter feed in a web browser. Now in your terminal, run your program by using\
    \ this command:\n\n```\npi@raspberrypi:~/newtwitbot $ node index.js\n```\n\nYou'll\
    \ see lots of output! All the info about each tweet that matches your search string\
    \ is displayed on your terminal. It is also retweeted to your bot's Twitter account.\n\
    \n## Customize Your Own Search\n\nIt's not likely that you'll want to keep searching\
    \ for and retweeting doggo and pupper tweets! You can change the query string\
    \ (the text in quotes after q:) to look for any terms you wish, including hashtags.\
    \ Separate multiple terms with commas. The argument result_type: 'recent' tells\
    \ the code to search for the latest tweets since our bot last retweeted. You can\
    \ find more parameters for this query string by checking out the Twitter API reference\
    \ at dev.twitter.com/rest/reference/get/search/tweets."
  mdcn: "\n## 你使用Gmail吗？\n\nTwitter账号基于唯一的电子邮件地址。如果你没有备用邮箱但使用Gmail，可以通过一个小技巧省去创建新邮箱的麻烦。Gmail允许你在邮箱地址中添加加号和字母后缀。\n\
    \n例如，如果你的Gmail地址是jane-doe@gmail.com，可以创建janedoe+twitterbot@gmail.com或janedoe+catbot@gmail.com这样的邮箱。\n\
    \nTwitter会视其为新邮箱，但Gmail会将所有发往该地址的邮件投递到现有收件箱。\n\n有个有趣的附带效果：可以轻松设置Gmail过滤器，将发往该地址的所有邮件标记为\"\
    Twitter机器人邮件\"或类似标签。这样就能一目了然地看到哪些邮件发送给了你的机器人。\n\n**步骤 1.** 登录用于运行机器人的Twitter账号。\n\
    \n**步骤 2.** 访问apps.twitter.com，点击\"创建新应用\"按钮。\n\n**步骤 3.** 填写表单（图3.1）。完成所有字段填写。可以输入任意网站地址，确保在回调字段中输入网址。不必太在意当前填写的内容，随时可以修改。\n\
    \n**步骤 4.** 勾选开发者协议复选框，点击\"创建你的Twitter应用\"。\n\n**步骤 5.** 此时会看到概览页面。点击\"密钥和访问令牌\"\
    标签页（图3.2）。本页的密钥将把你的Twitter应用与本章稍后创建的Node机器人程序关联起来。\n\n![创建新Twitter应用表单](img/a0848e8632a09becbaacc6826f2a8219_30_0.png)\n\
    \n图3.1：创建新Twitter应用表单\n\n![密钥和访问令牌页面](img/a0848e8632a09becbaacc6826f2a8219_30_1.png)\n\
    \n图3.2：密钥和访问令牌页面\n\n**步骤 6.** 滚动到页面底部，点击\"创建我的访问令牌\"按钮。页面将显示访问令牌和访问令牌密钥（图3.3）。保持此页面打开。接下来，你将在终端中创建文件，并将此页面的信息复制粘贴进去。\n\
    \n![Twitter应用密钥](img/a0848e8632a09becbaacc6826f2a8219_31_0.png)\n\n图3.3：Twitter应用密钥\n\
    \n下一节将设置目录、初始化，并创建包含此页面密钥和令牌的配置文件。\n\n## 创建配置文件\n\n在安装Node的设备上打开终端。\n创建一个新目录存放Twitter机器人文件。我将目录命名为newtwitbot。进入新目录：\n\
    \n```\npi@raspberrypi:~ $ mkdir newtwitbot\npi@raspberrypi:~ $ cd newtwitbot\n\
    pi@raspberrypi:~/newtwitbot $\n```\n\n我们的Twitter机器人将使用两个文件：config.js和index.js。现在用touch命令创建它们：\n\
    \n```\npi@raspberrypi:~/newtwitbot $ touch config.js index.js\npi@raspberrypi:~/newtwitbot\
    \ $ ls\nconfig.js index.js\n```\n\n需要用你的应用Twitter密钥编辑config.js文件。使用你喜欢的编辑器（我用nano），按如下方式编辑config.js文件。将xxxxx替换为你的密钥：\n\
    \n```\n//config.js\n/* TWITTER APP CONFIGURATION\n    consumer_key\n    consumer_secret\n\
    \    access_token\n    access_token_secret\n*/\nmodule.exports = {\n    consumer_key:\
    \ 'xxxxx',\n    consumer_secret: 'xxxxx',\n    access_token: 'xxxxx',\n    access_token_secret:\
    \ 'xxxxx'\n}\n```\n\n现在Twitter机器人配置完成。这四个值对于你创建的每个Twitter应用都是唯一的。\n\n## 创建Twitter机器人\n\
    \n还记得随Node一起安装的npm应用吗？这个便捷工具让你能重用他人编写的代码。\n\n已有名为twit的Twitter代码库。我们可以通过npm导入这个库，然后使用函数来简化与Twitter的通信。\n\
    \n安装此库的命令：\n\n```\npi@raspberrypi:~/newtwitbot $ npm install --save twit\n```\n\
    \n将看到以下输出：\n\n```\nnpm notice created a lockfile as package-lock.json. You should\
    \ commit this file.\nnpm WARN newtwitbot@0.0.0 No description\nnpm WARN newtwitbot@0.0.0\
    \ No repository field.\n+ twit@2.2.9\nadded 55 packages, removed 55 packages and\
    \ updated 1 package in 15.243s\n```\n\ntwit包安装完成后，打开index.js文件。我们将开始添加代码。（不必担心WARN提示！如果我们要构建供他人使用的代码，就需要添加描述。但此场景下不需要。）\n\
    \n> **构建index.js文件**\n\n如果迷失了方向，别担心。index.js文件的完整内容将在本章末尾列出。\n\n在编辑器中打开index.js，添加以下代码。这些代码告诉机器人使用twit代码，并允许代码访问config.js文件中的Twitter应用密钥。\n\
    \n```\n// Dependencies\nvar twit = require('twit'), config = require('./config');\n\
    ```\n\n然后在下方添加：\n\n```\nvar Twitter = new twit(config);\n```\n\n这行代码创建名为Twitter的变量——一个特殊对象，可访问twit库中的所有代码，以及我们在config.js文件中设置的密钥，从而实现与Twitter的实际通信。（这听起来复杂，但可以把Twitter变量想象成超级英雄。它不仅是单一值，还能访问众多定制函数来执行发布、转发、收藏等Twitter操作。本章结束时你会更清楚。）\n\
    \n接下来进入机器人核心功能。首先让它查找包含字符串\"doggo\"或\"pupper\"的推文。然后使用你已见过的console.log函数，将找到的推文输出到终端。\n\
    \n将这个名为retweet的函数添加到index.js文件：\n\n```\nvar retweet = function() {\n  var params\
    \ = {\n    q: 'doggo OR pupper',\n    result_type: 'recent'\n  }\n  Twitter.get('search/tweets',\
    \ params, function(err, data) {\n    // if there no errors\n    if (!err) {\n\
    \      // grab ID of tweet to retweet\n      var retweetId = data.statuses[0].id_str;\n\
    \      // Tell Twitter to retweet\n      Twitter.post('statuses/retweet/:id',\n\
    \      {\n        id: retweetId\n      },\n      function(err, response) {\n \
    \       if (response) {\n          console.log('Retweeted!!!');\n        }\n \
    \       // if there was an error while tweeting\n        if (err) {\n        \
    \  console.log('Error tweeting');\n        }\n      });\n    }\n    // if unable\
    \ to Search a tweet\n    else {\n      console.log('Error searching');\n    }\n\
    \  });\n}\n```\n\n这里包含大量逻辑。整个代码块是一个函数。我们稍后会深入分析，但先让它运行起来试试。\n\n如果现在尝试运行这段代码，它实际上不会执行任何操作。你已经编写了函数，但没有添加调用它的代码。现在添加。在代码末尾添加：\n\
    \n```\nretweet();\n// retweet every 3 minutes\nsetInterval(retweet, 180000);\n\
    ```\n\n现在我们每180,000毫秒（即每3分钟）调用一次函数。你可以根据需要调整这个间隔。\n\n> **警告** 如果机器人运行频率过高，Twitter会检测到资源滥用并进行\"\
    频率限制\"。每3分钟一次完全足够。\n\n现在尝试运行程序。在网页浏览器中打开机器人的Twitter动态。然后在终端中用以下命令运行程序：\n\n```\n\
    pi@raspberrypi:~/newtwitbot $ node index.js\n```\n\n你会看到大量输出！所有匹配搜索字符串的推文信息都显示在终端中，同时也会被转发到机器人的Twitter账号。\n\
    \n## 自定义搜索\n\n你可能不会持续搜索并转发\"doggo\"和\"pupper\"推文！可以修改查询字符串（q:后的引号内容）来搜索任何术语，包括话题标签。多个术语用逗号分隔。参数result_type:\
    \ 'recent'告诉代码搜索机器人上次转发后的最新推文。更多查询字符串参数可参考Twitter API文档：dev.twitter.com/rest/reference/get/search/tweets。\n"
