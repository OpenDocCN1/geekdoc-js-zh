  md: '# # 2


    # Getting into JavaScript


    You played with the REPL at the end of the last chapter. Now you''ll begin learning
    JavaScript by writing code both in the REPL and into saved JavaScript files.


    # ## STRINGS, MATH, AND THE REPL


    You''ve already used the REPL (also called the Node shell). If it isn''t open,
    go ahead and launch it. In Windows, open a command prompt or click the Node.js
    Command Prompt that you installed in your Start menu. On Mac or Linux, open a
    terminal.


    Type `node` to start the REPL. Remember, you''re in the shell when the prompt
    changes to >.


    The REPL is handy as you learn JavaScript. You can test pieces of your JavaScript
    code before saving them to a file. When you make an error in the REPL, you''ll
    get immediate feedback.'
  merge: -1
  pgno: 20
- img_proc: true
  md: "> **When You See...**\n\nTry entering this incomplete command:\n> console.log(\n\
    \nInstead of an error message, you'll see this:\n...\n\nThis ellipsis means that\
    \ the REPL is waiting for you to type more code to finish the command. If you\
    \ get the ellipsis but you're not sure why, you can break out of it by typing\
    \ the REPL command `.break`.\n\nLet's try making a deliberate mistake so you can\
    \ see the feedback you get from the REPL.\n\nTry this broken line of code:\n\n\
    ```\n> console.log(It's broken)\n```\n\nAlthough there are several things wrong\
    \ with this code, you'll get only one message at a time. Here's the first error:\n\
    \n```\nconsole.log(It's broken);\n          ^^^^^^^^^^^\nSyntaxError: Invalid\
    \ or unexpected token\n```\n\nLet's fix the first problem. If you look at the\
    \ carets under the text It's broken, you'll see they start right under the single\
    \ quote. In JavaScript, anytime you use a string of text, you need to put it in\
    \ quotes. Otherwise, the REPL thinks those words are code. So now try this:\n\n\
    ```\n> console.log('It's broken');\n```\n\nArgh! You get a hanging ellipsis.\n\
    \n```\nconsole.log('It's broken');\n...\n```"
  merge: -1
  pgno: 21
- img_proc: true
  md: 'This time the REPL finds the beginning of the string, but it thinks the second
    quote is closing your text. It''s looking for a parenthesis to end the command.

    This is tricky. We want to use a quote in our string, but we need quotes around
    our string. The simple way to fix it is to use double quotes around the whole
    string so you can use the single quote in the string.

    Both single and double quotes can be used around strings of text:


    ```

    > console.log("It''s broken");

    It''s broken

    undefined

    ```


    (Remember, you can ignore the `undefined`!)

    You can put more than a single string of text in the parentheses of the `console.log`
    function. Try these commands:


    ```

    > console.log(''Hello''+''world'');

    ```


    This command combines the two strings and outputs the single string `Helloworld`.
    If you want a space between the two words, you can use any of these three arguments
    in the parentheses; they''ll all work.


    ```

    ''Hello ''+''world''

    ''Hello''+'' world''

    ''Hello''+'' ''+''world''

    ```


    You won''t always be using strings, though—you''ll be using lots of numbers and
    variables. Here''s a quick look at some of your options; try them out.


    ```

    > console.log(42);

    > console.log(5 + 4);

    > console.log(5 * 4);

    ```


    Numbers don''t use quotes; the REPL recognizes them. And you can do math operations
    on them.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# FUNCTIONS


    You''ve used your first built-in function, console.log. This simple function prints
    out whatever string or other value you put in parentheses.


    Now let''s write a function! A *function* is basically code that can be reused.
    There''s more to it than that, but you''ll start with something simple. Try typing
    in the following function. (Don''t type the ellipsis; it indicates that the REPL
    is waiting for more code that you can enter on the next line. Press Enter/Return
    and use multiple lines.)


    ```

    > function countPets(){

    var dogs = 2; var cats = 1;

    var total = dogs + cats; return (total);

    ... }

    ```


    Here''s what is going on in this function:


    ```

    function countPets(){

    ```


    This line starts with the JavaScript keyword `function` so the REPL knows a function
    is coming.


    `countPets()` is the name of the function. Everything in the function goes inside
    curly braces.


    Next are two lines beginning with the JavaScript keyword `var`. It''s short for
    variable, and the lines are saying that the variable `dogs` is equal to 2 and
    the variable `cats` is equal to 1.


    The next line says that the variable `total` contains the sum of `dogs` and `cats`.


    The keyword `return` instructs the function to send back the value of `total`
    after the function finishes.


    To use the function, type this command:


    ```

    > countPets();

    ```


    You''ll get back the sum of `dogs` and `cats`: 3.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Let''s make the function a little more reusable. Take a look at this code and
    see if you can guess what''s going on.


    ```

    > function countPets(dogs, cats){

    ... var total = dogs + cats;

    ... return (total);

    ... }

    ```


    Now try it!


    ```

    > countPets(5, 3);

    ```


    In this function, you''re passing in values that the function can use. Being able
    to add different values to the same code is part of what makes functions so useful!


    You''ve now had a taste of JavaScript code. Unfortunately, as soon as you end
    this REPL session, your functions will not be saved. It''s time to move out of
    the REPL and put your code into .js files so you can start simple and build on
    them.


    # USING JAVASCRIPT FILES


    The REPL is great for testing, but you need to be able to save and reuse your
    code. You''ll need a text editor so you can write and edit your JavaScript code
    and save it into a file.


    Start by creating a text file called **fromfile.js**. Put this code in your file
    and save it to a location you''ll remember:


    ```

    console.log(''These words are from my .js file!'');

    ```


    In your terminal, navigate to the same directory where your **fromfile.js** was
    saved and type this command on your command line (not in the REPL!):


    ```

    $ node fromfile.js

    ```


    Node will execute the code in your file and you''ll see the output on your screen.'
  merge: -1
  pgno: 24
- img_proc: true
  md: "# MAKE A WEB SERVER\n\nNow that you can save .js files, you can start exploring\
    \ the real power of Node. Without Node, you can write JavaScript code that would\
    \ run only on an existing web server. But Node frees you from those browsers and\
    \ lets you create your own web server!\n\nIt's easy to create a little web server\
    \ with Node. Begin by creating a file called **easyserver.js** and save this code\
    \ in it:\n\n```\nvar http = require('http');\nvar server = http.createServer(function(req,\
    \ res) {\n    res.writeHead('I created this server!');\n    res.end();\n});\n\
    server.listen(8080);\n```\n\nNow try running your server. I'll explain this code\
    \ after you try it. In your terminal, visit the command line in the directory\
    \ where you saved the file. Type\n\n```\n$ node easyserver.js\n```\n\nThe terminal\
    \ will seem to hang, but that's fine—it means your server is running!\n\nOpen\
    \ a browser and visit the URL `localhost:8080`. You should see the line `I created\
    \ this server!` (Figure 2.1).\n\n![](img/a0848e8632a09becbaacc6826f2a8219_25_0.png)\n\
    \n**FIGURE 2.1:** A web page with output from your web server\n\nAfter you visit\
    \ the web page, press Ctrl-C in your terminal to end the program."
  merge: -1
  pgno: 25
- img_proc: true
  md: "Let's take a closer look at what's going on in this code. I don't expect you\
    \ to understand it right now. I've added comments to the original code. Just try\
    \ to get the gist of it!\n\n```\nvar http = require('http');\nvar server = http.createServer(function(req,\
    \ res) {\n  //send response to client\n  res.writeHead('I created this server!');\n\
    \  // finish the response\n  res.end();\n});\n//the web server is listening on\
    \ port 8080\nserver.listen(8080);\n```\n\nNode is doing most of the work for you\
    \ with built-in code. The very first line is calling the http module, which, behind\
    \ the scenes, has the code to turn your running program into a web server. The\
    \ require keyword is giving the new variable http access to a whole lot of saved\
    \ Node code and functions that can create a web server.\nIn the second line, the\
    \ code is calling a function called createServer. Whenever anyone connects to\
    \ your web server, the code in that function will be executed.\nThe last line\
    \ tells the server you created to start listening for incoming requests on a particular\
    \ port (in this case, 8080).\n\n# Comments in Your Code\n\nThe double slashes\
    \ you saw in the last code example let you add comments to your code. Node ignores\
    \ any words following the //. Comments are great for helping you remember what\
    \ you did in your code.\n\nIn the next chapter, you'll begin using JavaScript\
    \ to build a Twitter bot!"
