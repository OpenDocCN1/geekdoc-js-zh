  md: '# 3


    # Creating a Node Twitter Bot on Raspberry Pi


    You''ve written your first JavaScript program. Next, you''ll learn how to create
    a Twitter bot with Node that can run on any machine that has Node installed, including
    your Raspberry Pi.

    By now, you should already have Node installed on your system. This chapter will
    take you through the steps you need to set up and authorize a Twitter account,
    connect that account to a JavaScript program, and use the twit npm module in your
    program to do most of the work.


    # CREATE AND AUTHORIZE YOUR TWITTER ACCOUNT


    If you don''t have a Twitter account for your bot, create one at Twitter.com.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Do You Use Gmail?


    Twitter accounts are based off unique email addresses. If you don''t have a spare
    email address but you use Gmail, you can save the hassle of creating a new email
    address with a handy trick. Gmail lets you add a plus sign and a few letters to
    your address.


    For example, if your Gmail address is jane-doe@gmail.com, you can create other
    email addresses like janedoe+twitterbot@gmail.com or janedoe+catbot@gmail.com.


    Twitter will think this is a new address, but Gmail will place everything sent
    to that address into your existing inbox.


    One interesting side effect: It''s relatively easy to set up a Gmail filter to
    label all messages sent to that address as "Twitterbot Email" or something similar.
    That way, you can see at a glance which emails have been sent to your bot.


    **Step 1.** Log into the Twitter account you''ll be using for your bot.


    **Step 2.** Visit apps.twitter.com and click the Create New App button.


    **Step 3.** You''ll be presented with a form to fill out (Figure 3.1). Complete
    all the fields. You can enter any website you wish, and make sure you type a URL
    in the callback field. Don''t worry too much about what you enter in the fields
    now; you can change the contents at any time.


    **Step 4.** Click the Developer Agreement check box and click Create Your Twitter
    Application.


    **Step 5.** You''ll now see a summary page. Click the Keys And Access Tokens tab
    (Figure 3.2). The keys on this page connect'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'your Twitter app to the Node bot program you''ll create later in this chapter.


    ![](img/a0848e8632a09becbaacc6826f2a8219_30_0.png)


    FIGURE 3.1: Creating a new Twitter app form


    ![](img/a0848e8632a09becbaacc6826f2a8219_30_1.png)


    FIGURE 3.2: Keys And Access Tokens page'
