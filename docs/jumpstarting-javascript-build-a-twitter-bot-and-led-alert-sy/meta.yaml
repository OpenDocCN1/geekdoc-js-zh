- md: '## Step 4.


    You need to make sure that `/usr/local/bin` is in your PATH environment variable.
    To do this, open the Terminal.app program—you can find it under /Applications/Utilities.
    Start the Terminal program. In the new terminal window, type


    ```

    echo $PATH

    ```


    This will return a list of directory paths, separated by colons. In my case, I
    get this output:


    ```

    /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    ```


    You can see that /usr/local/bin is the first thing in my PATH. If you don’t see
    it in yours, you’ll need to add it. If you do see it, skip step 5.


    ## Step 5.


    Here’s how to add /usr/local/bin to your PATH. In your terminal, type


    ```

    touch ~/.bash_profile

    ```


    This creates the file if it doesn’t already exist. Now type


    ```

    open ~/.bash_profile

    ```


    This opens the .bash_profile file in TextEdit. In TextEdit, add the line


    ```

    PATH=${PATH}:/usr/local/bin

    ```


    Save the .bash_profile file and quit TextEdit.


    You’ll need the changes you made to take effect. To do this, type this command
    in the terminal:


    ```

    source ~/.bash_profile

    ```


    ## Step 6.


    Let’s confirm that we have Node running. Type this command in your terminal to
    see the versions you’ve installed:


    ```

    node --version

    ```


    Jumpstarting JavaScript


    You''ll see output like this, giving you the version of Node that you just installed:


    ```

    v6.11.3

    ```


    Don''t worry if the version number is different from what you see here; new releases
    come out frequently.


    After confirming you have the Node program installed and working, you''re ready
    to start writing JavaScript. Leave this terminal open and skip ahead to the section
    "Node Is Installed; Now What?"


    # INSTALL NODE ON WINDOWS


    You''ll start by visiting the official Node website, Nodejs.org, and getting the
    automated installer. Here are the steps involved:


    **Step 1.** Visit *https://nodejs.org/en/download/* and click the Windows Installer
    button to download the installer (Figure 1.4). Pick the MSI file for either 32
    bits or 64 bits, depending on your computer platform.


    **Step 2.** Find the file you downloaded and double-click it. You may get a warning
    dialog asking for permission to install. Click OK.


    The installation program opens (Figure 1.5). Click Continue to go through the
    installation. Stick with the default settings.


    **Step 3.** When the installation finishes, you''ll see a summary screen with
    installation information. Let''s confirm that we have Node running. Click your
    Start menu, and you should see two new menu items under Recently Added: Node.js
    and Node.js Command Prompt (Figure 1.6).


    **Step 4.** Click Node.js Command Prompt to open the prompt. You''ll see a terminal
    window open with this line:


    ```

    Your environment has been set up for using Node.js 6.11.3 (x64) and npm

    ```


    Don''t worry if the version number is different from what you see here; new releases
    come out frequently.


    This confirms that you have the Node program installed and working. You now have
    everything you need to start writing JavaScript. Leave this terminal open and
    skip ahead to the section "Node Is Installed; Now What?"


    # INSTALL NODE ON LINUX


    The easiest way to get going with Linux is to install a prebuilt binary package
    from the Nodejs.org website.


    > NOTE If you''re an experienced Linux user, you may find it simplest to use the
    package manager for your particular Linux distro. You can find a rundown of those
    at nodejs.org/en/download/package-manager.


    **Step 1.** Visit https://nodejs.org/en/download/. Download the 32- or 64-bit
    file with a name like node-v6.11.3-linux-x64.tar.xz where v6.11.3 is the current
    version (Figure 1.7). Be sure to save it in a directory you''ll remember. I''m
    saving mine to my Downloads directory.


    # Opening node-v6.11.3-linux-x64.tar.xz


    You have chosen to open:

    node-v6.11.3-linux-x64.tar.xz

    which is: XZ file (8.9 MB)

    from: https://nodejs.org

    What should Firefox do with this file?


    - Open with Archive Utility (default)

    - Save File

    - Do this automatically for files like this from now on.


    Cancel


    OK


    FIGURE 1.7: Linux download


    ## Step 2.


    This archive contains everything you''ll need and is organized into subdirectories.
    You can extract it where it needs to go by using these commands:


    ```

    ~$ cd ~/bin

    ~$ tar xz ~/Downloads/node-v6.11.3-linux-x64.tar.xz

    ```


    > NOTE If ~/bin does not exist, you''ll need to create it first.


    ## Step 3.


    Make sure you have your PATH set to find your Node installation. Edit your .bash_profile
    file and include that line. You can do so with this command:


    ```

    ~$ PATH=$PATH:~/bin/node-v6.11.3-linux

    ```


    or by editing your .bash_profile and adding this line:


    ```

    PATH=${PATH}:/usr/local/bin/node-v6.11.3-linux

    ```


    **Step 4.** Use this command to check to see whether Node has been installed:


    ```

    node --version

    ```


    and you should get output with the version number


    ```

    v6.11.3

    ```


    Don''t worry if the version number is different from what you see here; new releases
    come out frequently.


    This confirms that you have the Node program installed and working. You have everything
    you need to start writing JavaScript. Leave this terminal open and continue to
    the next section.


    # NODE IS INSTALLED; NOW WHAT?


    At this point, you should have Node installed and a terminal or console window
    open. (From here on, we''ll just call it the terminal.)


    In the next chapter, you''ll write your first program, but let''s quickly try
    out the Node REPL.


    > **NOTE** The REPL is like a playground where you can try out JavaScript code.
    It''s installed along with Node. REPL stands for Read Eval Print Loop. The REPL
    gives you a quick and easy way to test your JavaScript code and fix any mistakes.


    In your terminal, type **node** to start the Node REPL:


    ```

    $ node

    ```


    Notice that your cursor has changed to a greater than sign (>). You''re now interacting
    with the REPL. Let''s output some text:


    ```

    > console.log(''Hello World!'');

    Hello World!

    undefined

    ```


    If you''re getting an error of some kind, check your punctuation. Make sure you''ve
    got single quotes around the text and a semicolon at the very end of your code.


    > **Did You Get Back *undefined*?**


    Don''t worry if you did! You''re using a JavaScript function, which will always
    return `undefined` if it doesn''t have a return value (you''ll learn more about
    this later). For now, you can just ignore it. You haven''t made any mistakes.


    Now try this very handy **.help** command:


    ```

    > .help

    .break Sometimes you get stuck, this gets you out

    .clear Alias for .break

    .exit Exit the repl

    .help Show repl options

    .load Load JS from a file into the REPL session

    .save Save all evaluated commands in this REPL session to a file

    ```


    > **NOTE** Commands starting with a period are talking to the REPL interface—they''re
    not JavaScript code.


    And let''s close the REPL and get back to the regular command prompt, using the
    .exit command:


    ```

    > .exit

    ```


    You''ve installed Node, and you know how to start up and quit the REPL. This means
    that you''re ready to learn some JavaScript. Chapter 2 awaits.


    # 2 Getting into JavaScript


    You played with the REPL at the end of the last chapter. Now you''ll begin learning
    JavaScript by writing code both in the REPL and into saved JavaScript files.


    ## STRINGS, MATH, AND THE REPL


    You''ve already used the REPL (also called the Node shell). If it isn''t open,
    go ahead and launch it. In Windows, open a command prompt or click the Node.js
    Command Prompt that you installed in your Start menu. On Mac or Linux, open a
    terminal.


    Type `node` to start the REPL. Remember, you''re in the shell when the prompt
    changes to >.


    The REPL is handy as you learn JavaScript. You can test pieces of your JavaScript
    code before saving them to a file. When you make an error in the REPL, you''ll
    get immediate feedback.'
