    # # 2


    # Getting into JavaScript


    You played with the REPL at the end of the last chapter. Now you''ll begin learning
    JavaScript by writing code both in the REPL and into saved JavaScript files.


    # ## STRINGS, MATH, AND THE REPL


    You''ve already used the REPL (also called the Node shell). If it isn''t open,
    go ahead and launch it. In Windows, open a command prompt or click the Node.js
    Command Prompt that you installed in your Start menu. On Mac or Linux, open a
    terminal.


    Type `node` to start the REPL. Remember, you''re in the shell when the prompt
    changes to >.


    The REPL is handy as you learn JavaScript. You can test pieces of your JavaScript
    code before saving them to a file. When you make an error in the REPL, you''ll
    get immediate feedback.'
