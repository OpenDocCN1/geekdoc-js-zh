  md: 'Step 6. Scroll to the bottom of this page and click the Create My Access Token
    button. This page now displays an access token and access token secret (Figure
    3.3). Leave this page open. Next up, you''ll create a file in your terminal and
    copy and paste info from this page into it.


    ![](img/a0848e8632a09becbaacc6826f2a8219_31_0.png)


    FIGURE 3.3: Keys for your Twitter application


    In the next section, you''ll set up a directory, initialize it, and create a configuration
    file with the keys and tokens on this page.


    # CREATE A CONFIGURATION FILE


    Open your terminal on the device where you installed Node.

    Create a new directory where you can keep all your new Twitter bot files. I''ll
    call mine newtwitbot. Navigate to your new directory:


    ```

    pi@raspberrypi:~ $ mkdir newtwitbot

    pi@raspberrypi:~ $ cd newtwitbot

    pi@raspberrypi:~/newtwitbot $

    ```'
