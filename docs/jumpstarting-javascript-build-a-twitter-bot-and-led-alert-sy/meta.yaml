- img_proc: true
  md: "In this section, we'll add some code that will tweet a greeting back to anyone\
    \ who tweets your handle.\n\nIn the last chapter, you created a Twitter bot in\
    \ a program called index.js. Open index.js (or whatever you named your file) in\
    \ an editor. We'll add this new code to the end of the current file. Make sure\
    \ you change @doggobot to whatever you named your bot!\n\n```\n//Respond when\
    \ someone mentions me, @doggobot\nvar stream = Twitter.stream('statuses/filter',\n\
    \  { track: ['@doggobot'] });\n//Look for my @name\nstream.on('tweet', tweetEvent);\n\
    function tweetEvent(tweet) {\n  // Get Twitter handle of who tweeted me\n  var\
    \ name = tweet.user.screen_name;\n  // Now send a reply back to the sender\n \
    \ var reply = 'You mentioned me! @' + name + ' ' + 'Bork bork!';\n  var params\
    \ = {\n    status: reply,\n    in_reply_to_status_id: nameID\n  };\n  Twitter.post('statuses/update',\
    \ params,\n    function(err, data, response) {\n      if (err !== undefined) {\n\
    \        //Report error if response tweet fails\n        console.log(err);\n \
    \     } else {\n        //Report success\n        console.log('Tweeted: ' + params.status);\n\
    \      }\n    })\n};\n```\n\nBasically, this code listens for your bot's Twitter\
    \ handle. When it detects your handle, it grabs the handle of the sender. Then\
    \ it creates a reply that includes the sender's handle, and tweets it. In our\
    \ example, if someone—let's call her @lynnbeighley—were to tweet anything containing\
    \ my bot's name, @doggobot, the bot will respond with You mentioned me! @lynnbeighley\
    \ Bork bork!."
