    \n在下一章，我们将扩展这个机器人的功能，并使用树莓派在我们的机器人Twitter账号被提及时点亮一个LED灯！\n\n# 响应Twitter事件闪烁LED\n\
    \n你已经用Node.js创建了你的Twitter机器人。如果你在树莓派上设置好了它，你就可以连接一个LED灯，并在Twitter上发生事件时让它闪烁。在本章中，你将在连接到你的树莓派的面包板上接线一个LED。接下来，你将编写一个简短的程序，让LED闪烁两次。最后，你将把这段代码添加到你的Twitter机器人程序中，这样每次你的机器人Twitter账号被提及时，LED灯就会通过闪烁来提醒你（图4.1）。\n\
    \n![](img/a0848e8632a09becbaacc6826f2a8219_41_0.png)\n\n图4.1：闪烁的LED灯\n\n## 在你的树莓派上设置LED\n\
