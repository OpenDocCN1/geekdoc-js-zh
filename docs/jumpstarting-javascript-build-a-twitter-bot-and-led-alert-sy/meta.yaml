    > ## What Do You Mean by GPIO?

    See those 26 pins along one edge of your Pi? Seventeen of these pins are called
    GPIO, short for General Purpose Input/Output. You can attach external hardware
    to these pins. The other pins are power or ground pins.


    +   - **Step 2.** Connect the female end of the green jumper cable to pin 4 of
    the GPIO on the Pi, as shown in both Figures 4.1 and 4.2.

    - **Step 3.** Connect the female end of the black jumper cable to pin 3 of the
    GPIO.

    - **Step 4.** Take a look at your LED. One leg is longer than the other. The longer
    leg is the plus side, and the shorter leg is the minus terminal. This is important
    to keep track of.

    - **Step 5.** Insert your LED into the breadboard as shown in Figure 4.2. Make
    sure the plus side of the LED is on the right.

    - **Step 6.** Connect the male end of the black cable to the breadboard adjacent
    to the minus terminal of the LED. If any of this is confusing, just take a close
    look at Figure 4.2.

    - **Step 7.** Connect the male end of the green cable to the breadboard adjacent
    to the plus terminal of the LED.


    Your Pi will now be able to blink the LED in response to the code you''re about
    to write!


    # ## CREATE THE BLINK PROGRAM


    Open your terminal and connect to your Pi. Navigate to the directory where you
    created your Twitter bot files.


    ```

    pi@raspberrypi:~ $ cd newtwitbot

    pi@raspberrypi:~/newtwitbot $

    ```'
  - "[PAGE 44]\n\nRemember using npm to install the Twitter code library called twit?\
    \ We're going to use npm again, this time to import another library called onoff\
    \ that lets us control the LED.\n\nTo install this library, use this command:\n\
    \n```\npi@raspberrypi:~/newtwitbot $ npm install --save onoff\n```\n\nAfter onoff\
    \ has finished installing, create and open a new file, helloBlink.js.\n\n```\n\
    pi@raspberrypi:~/newtwitbot $ nano helloBlink.js\n```\n\nThis opens the editor\
    \ with a new blank file. Here's the code to enter:\n\n```\n//helloBlink.js\nvar\
    \ Gpio = require('onoff').Gpio,\n  led = new Gpio(4, 'out');\nvar iv = setInterval(function\
    \ () {\n  led.writeSync(led.readSync() === 0 ? 1 : 0)\n}, 500);\n// Toggle state\
    \ of the LED every half second\nsetTimeout(function () {\n  clearInterval(iv);\n\
    \  led.writeSync(0);\n  // Turn LED off\n  led.unexport();\n}, 2000);\n// End\
    \ blinking after 2 seconds\n```\n\nSave this file.\n\nNow give it a try with the\
    \ node command:\n\n```\npi@raspberrypi:~/newtwitbot $ node helloBlink.js\n```\n\
    \n# MAKE YOUR BOT DETECT YOUR TWITTER HANDLE\n\nBefore your bot can blink in response\
    \ to your Twitter handle being tweeted, it needs to be able to detect when that\
    \ happens."
