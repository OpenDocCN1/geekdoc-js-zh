- img_proc: true
  md: "Our Twitter bot will use two files: config.js and index.js. Create them now\
    \ with the touch command:\n\n```\npi@raspberrypi:~/newtwitbot $ touch config.js\
    \ index.js\npi@raspberrypi:~/newtwitbot $ ls\nconfig.js index.js\n```\n\nWe need\
    \ to edit the config.js file with the Twitter keys for your app. Using the editor\
    \ of your choice (I use nano), edit your config.js file as shown here. Substitute\
    \ your keys in place of the xxxxx values:\n\n```\n//config.js\n/* TWITTER APP\
    \ CONFIGURATION\n    consumer_key\n    consumer_secret\n    access_token\n   \
    \ access_token_secret\n*/\nmodule.exports = {\n    consumer_key: 'xxxxx',\n  \
    \  consumer_secret: 'xxxxx',\n    access_token: 'xxxxx',\n    access_token_secret:\
    \ 'xxxxx'\n}\n```\n\nNow, the Twitter bot's configuration is complete. These four\
    \ values will be unique for each Twitter application you create.\n\n# CREATE THE\
    \ TWITTER BOT\n\nDo you remember the npm application you installed along with\
    \ Node? This handy application lets you reuse code other people have previously\
    \ written.\n\nThere's already a Twitter code library called twit. We can import\
    \ this library with npm and then use functions to make communication with Twitter\
    \ much easier.\n\nTo install this library, use this command:\n\n```\npi@raspberrypi:~/newtwitbot\
    \ $ npm install --save twit\n```"
