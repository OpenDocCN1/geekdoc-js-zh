    \ expect you to understand it right now. I've added comments to the original code.\
    \ Just try to get the gist of it!\n\n```\nvar http = require('http');\nvar server\
    \ = http.createServer(function(req, res) {\n  //send response to client\n  res.writeHead('I\
    \ created this server!');\n  // finish the response\n  res.end();\n});\n//the\
    \ web server is listening on port 8080\nserver.listen(8080);\n```\n\nNode is doing\
    \ most of the work for you with built-in code. The very first line is calling\
    \ the http module, which, behind the scenes, has the code to turn your running\
    \ program into a web server. The require keyword is giving the new variable http\
    \ access to a whole lot of saved Node code and functions that can create a web\
