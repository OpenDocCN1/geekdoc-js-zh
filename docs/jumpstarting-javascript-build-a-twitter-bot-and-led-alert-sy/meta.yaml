    # # Flash an LED in Response to a Twitter Event


    You''ve created your Twitter bot with Node. If you''ve set it up on your Raspberry
    Pi, you can hook up an LED and make it flash when an event happens on Twitter.
    In this chapter, you''ll wire up an LED on a breadboard hooked in to your Pi.
    Next, you''ll write a short program that will make the LED blink twice. Finally,
    you''ll add this code to your Twitter bot program so that each time your bot''s
    Twitter handle is mentioned, the LED will alert you by blinking (Figure 4.1).'
