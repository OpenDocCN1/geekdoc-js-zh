  md: 'If you tried to run this code right now, it wouldn''t actually do anything.
    You''ve written a function, but you haven''t added any code that will call it.
    Let''s do that now. At the end of this code, add these lines:


    ```

    retweet();

    // retweet every 3 minutes

    setInterval(retweet, 180000);

    ```


    Now we''re calling our function every 180,000 milliseconds, or every 3 minutes.
    Change this to whatever interval you wish.


    > **WARNING** If you run your bot too frequently, Twitter will see that you''re
    using up too many resources and will "rate-limit" you. Once every 3 minutes is
    plenty.


    It''s time to try the program. Open your bot''s Twitter feed in a web browser.
    Now in your terminal, run your program by using this command:


    ```

    pi@raspberrypi:~/newtwitbot $ node index.js

    ```


    You''ll see lots of output! All the info about each tweet that matches your search
    string is displayed on your terminal. It is also retweeted to your bot''s Twitter
    account.


    # Customize Your Own Search


    It''s not likely that you''ll want to keep searching for and retweeting doggo
    and pupper tweets! You can change the query string (the text in quotes after q:)
    to look for any terms you wish, including hashtags. Separate multiple terms with
    commas. The argument result_type: ''recent'' tells the code to search for the
    latest tweets since our bot last retweeted. You can find more parameters for this
    query string by checking out the Twitter API reference at dev.twitter.com/rest/reference/get/search/tweets.'
