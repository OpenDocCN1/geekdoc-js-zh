  md: '# Meet JavaScript and Node.js!


    This chapter takes you through the steps to install Node on your Mac, Windows,
    or Linux OS. Then you''ll check to see that it''s working.


    > **NOTE** As you install Node, you may notice that something called *npm* is
    also being installed. This program is the Node Package Manager.


    Node is really popular, and it has a whole new ecosystem of useful Node-based
    code packages other developers have created for you to use. When you want to use
    one of these packages in Node, you need an easy way to install and manage them.
    That''s what npm does for you—it installs additional Node packages you want to
    use.


    Follow the instructions for your system; then jump to the last section, "Node
    Is Installed; Now What?"'
