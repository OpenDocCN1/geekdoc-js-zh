    You''ve now got a bot that not only responds when someone tweets at it, but also
    blinks an LED to let you know! Using similar techniques, you could monitor Twitter
    for more practical search terms—for example, the words tsunami and earthquake.


    > Run Node Applications in the Background


    If you''re running something like a Twitter bot on your Pi, you''ll probably want
    to let it run in the background. You can use the command `forever` to do this.


    Use npm to install `forever`:

    `pi@raspberrypi:~ $ npm install forever --global`


    Now you can run it like this:

    `pi@raspberrypi:~ $ forever start yourProgram.js`


    Your program will now run as a process. To stop it, use this:

    `pi@raspberrypi:~ $ forever stop yourProgram.js`


    # NODE, PI, AND THE INTERNET OF THINGS


    You''ve now had a jumpstart into JavaScript with Node and Raspberry Pi. You can
    control real-world devices and interact with the Internet. Blinking an LED is
    just a small taste of what you can'
