    \ simple function prints out whatever string or other value you put in parentheses.\n\
    \n> **When You See...**\n\nTry entering this incomplete command:\n```\n> console.log(\n\
    ```\nInstead of an error message, you'll see this:\n```\n...\n```\nThis ellipsis\
    \ means that the REPL is waiting for you to type more code to finish the command.\
    \ If you get the ellipsis but you're not sure why, you can break out of it by\
    \ typing the REPL command `.break`.\n\nLet's try making a deliberate mistake so\
    \ you can see the feedback you get from the REPL.\n\nTry this broken line of code:\n\
    ```\n> console.log(It's broken)\n```\nAlthough there are several things wrong\
    \ with this code, you'll get only one message at a time. Here's the first error:\n\
    ```\nconsole.log(It's broken);\n          ^^^^^^^^^^^\nSyntaxError: Invalid or\
    \ unexpected token\n```\nLet's fix the first problem. If you look at the carets\
    \ under the text `It's broken`, you'll see they start right under the single quote.\
    \ In JavaScript, anytime you use a string of text, you need to put it in quotes.\
    \ Otherwise, the REPL thinks those words are code. So now try this:\n```\n> console.log('It's\
    \ broken');\n```\nArgh! You get a hanging ellipsis.\n```\nconsole.log('It's broken');\n\
    ...\n```\nThis time the REPL finds the beginning of the string, but it thinks\
    \ the second quote is closing your text. It's looking for a parenthesis to end\
    \ the command.\n\nThis is tricky. We want to use a quote in our string, but we\
    \ need quotes around our string. The simple way to fix it is to use double quotes\
    \ around the whole string so you can use the single quote in the string. Both\
    \ single and double quotes can be used around strings of text:\n```\n> console.log(\"\
    It's broken\");\nIt's broken\nundefined\n```\n(Remember, you can ignore the `undefined`!)\n\
    \nYou can put more than a single string of text in the parentheses of the `console.log`\
    \ function. Try these commands:\n```\n> console.log('Hello'+'world');\n```\nThis\
    \ command combines the two strings and outputs the single string `Helloworld`.\
    \ If you want a space between the two words, you can use any of these three arguments\
    \ in the parentheses; they'll all work.\n```\n'Hello '+'world'\n'Hello'+' world'\n\
    'Hello'+' '+'world'\n```\nYou won't always be using strings, though—you'll be\
    \ using lots of numbers and variables. Here's a quick look at some of your options;\
    \ try them out.\n```\n> console.log(42);\n> console.log(5 + 4);\n> console.log(5\
    \ * 4);\n```\nNumbers don't use quotes; the REPL recognizes them. And you can\
    \ do math operations on them.\n\nNow let's write a function! A *function* is basically\
    \ code that can be reused. There's more to it than that, but you'll start with\
    \ something simple. Try typing in the following function. (Don't type the ellipsis;\
    \ it indicates that the REPL is waiting for more code that you can enter on the\
    \ next line. Press Enter/Return and use multiple lines.)\n```\n> function countPets(){\n\
    var dogs = 2; var cats = 1;\nvar total = dogs + cats; return (total);\n... }\n\
    ```\nHere's what is going on in this function:\n```\nfunction countPets(){\n```\n\
    This line starts with the JavaScript keyword `function` so the REPL knows a function\
    \ is coming.\n\n`countPets()` is the name of the function. Everything in the function\
    \ goes inside curly braces.\n\nNext are two lines beginning with the JavaScript\
    \ keyword `var`. It's short for variable, and the lines are saying that the variable\
    \ `dogs` is equal to 2 and the variable `cats` is equal to 1.\n\nThe next line\
    \ says that the variable `total` contains the sum of `dogs` and `cats`.\n\nThe\
    \ keyword `return` instructs the function to send back the value of `total` after\
    \ the function finishes.\n\nTo use the function, type this command:\n```\n> countPets();\n\
    ```\nYou'll get back the sum of `dogs` and `cats`: 3.\n\nLet's make the function\
    \ a little more reusable. Take a look at this code and see if you can guess what's\
    \ going on.\n```\n> function countPets(dogs, cats){\n... var total = dogs + cats;\n\
    ... return (total);\n... }\n```\nNow try it!\n```\n> countPets(5, 3);\n```\nIn\
    \ this function, you're passing in values that the function can use. Being able\
    \ to add different values to the same code is part of what makes functions so\
    \ useful!\n\nYou've now had a taste of JavaScript code. Unfortunately, as soon\
    \ as you end this REPL session, your functions will not be saved. It's time to\
    \ move out of the REPL and put your code into .js files so you can start simple\
    \ and build on them.\n\n## USING JAVASCRIPT FILES\n\nThe REPL is great for testing,\
    \ but you need to be able to save and reuse your code. You'll need a text editor\
    \ so you can write and edit your JavaScript code and save it into a file.\n\n\
    Start by creating a text file called **fromfile.js**. Put this code in your file\
    \ and save it to a location you'll remember:\n```\nconsole.log('These words are\
    \ from my .js file!');\n```\nIn your terminal, navigate to the same directory\
    \ where your **fromfile.js** was saved and type this command on your command line\
    \ (not in the REPL!):\n```\n$ node fromfile.js\n```\nNode will execute the code\
    \ in your file and you'll see the output on your screen.\n\n## MAKE A WEB SERVER\n\
    \nNow that you can save .js files, you can start exploring the real power of Node.\
    \ Without Node, you can write JavaScript code that would run only on an existing\
    \ web server. But Node frees you from those browsers and lets you create your\
    \ own web server!\n\nIt's easy to create a little web server with Node. Begin\
    \ by creating a file called **easyserver.js** and save this code in it:\n```\n\
    var http = require('http');\nvar server = http.createServer(function(req, res)\
    \ {\n    res.writeHead('I created this server!');\n    res.end();\n});\nserver.listen(8080);\n\
    ```\nNow try running your server. I'll explain this code after you try it. In\
    \ your terminal, visit the command line in the directory where you saved the file.\
    \ Type\n```\n$ node easyserver.js\n```\nThe terminal will seem to hang, but that's\
    \ fine—it means your server is running!\n\nOpen a browser and visit the URL `localhost:8080`.\
    \ You should see the line `I created this server!` (Figure 2.1).\n\n![A web page\
    \ with output from your web server](img/a0848e8632a09becbaacc6826f2a8219_25_0.png)\n\
    \n**FIGURE 2.1:** A web page with output from your web server\n\nAfter you visit\
    \ the web page, press Ctrl-C in your terminal to end the program.\n\nLet's take\
    \ a closer look at what's going on in this code. I don't expect you to understand\
    \ it right now. I've added comments to the original code. Just try to get the\
    \ gist of it!\n```\nvar http = require('http');\nvar server = http.createServer(function(req,\
    \ res) {\n  //send response to client\n  res.writeHead('I created this server!');\n\
    \  // finish the response\n  res.end();\n});\n//the web server is listening on\
    \ port 8080\nserver.listen(8080);\n```\nNode is doing most of the work for you\
    \ with built-in code. The very first line is calling the `http` module, which,\
    \ behind the scenes, has the code to turn your running program into a web server.\
    \ The `require` keyword is giving the new variable `http` access to a whole lot\
    \ of saved Node code and functions that can create a web server.\n\nIn the second\
    \ line, the code is calling a function called `createServer`. Whenever anyone\
    \ connects to your web server, the code in that function will be executed.\n\n\
    The last line tells the server you created to start listening for incoming requests\
    \ on a particular port (in this case, 8080).\n\n## Comments in Your Code\n\nThe\
    \ double slashes you saw in the last code example let you add comments to your\
    \ code. Node ignores any words following the `//`. Comments are great for helping\
    \ you remember what you did in your code.\n\nIn the next chapter, you'll begin\
    \ using JavaScript to build a Twitter bot!\n\n# 3\n\n# Creating a Node Twitter\
    \ Bot on Raspberry Pi\n\nYou've written your first JavaScript program. Next, you'll\
    \ learn how to create a Twitter bot with Node that can run on any machine that\
    \ has Node installed, including your Raspberry Pi.\n\nBy now, you should already\
    \ have Node installed on your system. This chapter will take you through the steps\
    \ you need to set up and authorize a Twitter account, connect that account to\
    \ a JavaScript program, and use the `twit` npm module in your program to do most\
    \ of the work.\n\n## CREATE AND AUTHORIZE YOUR TWITTER ACCOUNT\n\nIf you don't\
    \ have a Twitter account for your bot, create one at Twitter.com."
  mdcn: "\n## 函数\n\n你已经使用了你的第一个内置函数 `console.log`。这个简单的函数会打印出你放在括号中的任何字符串或其他值。\n\n\
    > **当你看到……**\n\n尝试输入这个不完整的命令：\n```\n> console.log(\n```\n你不会收到错误信息，而是会看到这个：\n\
    ```\n...\n```\n这个省略号意味着 REPL 正在等待你输入更多代码以完成命令。如果你看到省略号但不确定原因，可以通过输入 REPL 命令 `.break`\
    \ 来退出。\n\n让我们尝试一个故意的错误，这样你就能看到 REPL 给出的反馈。\n\n尝试这行有问题的代码：\n```\n> console.log(It's\
    \ broken)\n```\n尽管这段代码有几个问题，但一次只会显示一个错误信息。这是第一个错误：\n```\nconsole.log(It's broken);\n\
    \          ^^^^^^^^^^^\nSyntaxError: Invalid or unexpected token\n```\n让我们来修复第一个问题。如果你看文本\
    \ `It's broken` 下方的脱字符，你会发现它们正好从单引号下方开始。在 JavaScript 中，每次使用文本字符串时，都需要将其放在引号中。否则，REPL\
    \ 会认为这些单词是代码。所以现在试试这个：\n```\n> console.log('It's broken');\n```\n啊！你得到了一个悬挂的省略号。\n\
    ```\nconsole.log('It's broken');\n...\n```\n这次 REPL 找到了字符串的开头，但它认为第二个引号结束了你的文本。它正在寻找一个括号来结束命令。\n\
    \n这很棘手。我们想在字符串中使用一个引号，但我们又需要在字符串周围加上引号。简单的解决方法是在整个字符串周围使用双引号，这样你就可以在字符串中使用单引号。单引号和双引号都可以用于包裹文本字符串：\n\
    ```\n> console.log(\"It's broken\");\nIt's broken\nundefined\n```\n（记住，你可以忽略 `undefined`！）\n\
    \n你可以在 `console.log` 函数的括号中放入多个字符串。尝试这些命令：\n```\n> console.log('Hello'+'world');\n\
    ```\n这个命令将两个字符串组合起来，输出单个字符串 `Helloworld`。如果你想在这两个单词之间加一个空格，可以在括号中使用以下三种参数中的任何一种；它们都有效。\n\
    ```\n'Hello '+'world'\n'Hello'+' world'\n'Hello'+' '+'world'\n```\n不过，你不会总是使用字符串——你会使用大量的数字和变量。这里快速浏览一下你的选项；试试看。\n\
    ```\n> console.log(42);\n> console.log(5 + 4);\n> console.log(5 * 4);\n```\n数字不使用引号；REPL\
    \ 能识别它们。并且你可以对它们进行数学运算。\n\n现在让我们来编写一个函数！*函数*基本上就是可以重用的代码。它不止于此，但你将从一些简单的东西开始。尝试输入以下函数。（不要输入省略号；它表示\
    \ REPL 正在等待更多代码，你可以在下一行输入。按回车键并使用多行。）\n```\n> function countPets(){\nvar dogs\
    \ = 2; var cats = 1;\nvar total = dogs + cats; return (total);\n... }\n```\n这个函数内部是这样的：\n\
    ```\nfunction countPets(){\n```\n这一行以 JavaScript 关键字 `function` 开头，因此 REPL 知道一个函数即将到来。\n\
    \n`countPets()` 是函数的名称。函数内的所有内容都放在花括号内。\n\n接下来是两行以 JavaScript 关键字 `var` 开头的代码。它是\
    \ variable（变量）的缩写，这两行表示变量 `dogs` 等于 2，变量 `cats` 等于 1。\n\n下一行表示变量 `total` 包含 `dogs`\
    \ 和 `cats` 的和。\n\n关键字 `return` 指示函数在函数完成后返回 `total` 的值。\n\n要使用该函数，请输入此命令：\n```\n\
    > countPets();\n```\n你将得到 `dogs` 和 `cats` 的和：3。\n\n让我们使函数更具可重用性。看看这段代码，看看你能否猜出发生了什么。\n\
    ```\n> function countPets(dogs, cats){\n... var total = dogs + cats;\n... return\
    \ (total);\n... }\n```\n现在试试看！\n```\n> countPets(5, 3);\n```\n在这个函数中，你传入了函数可以使用的值。能够将不同的值添加到相同的代码中，这是函数如此有用的一部分原因！\n\
    \n你现在已经体验了 JavaScript 代码。不幸的是，一旦你结束这个 REPL 会话，你的函数将不会被保存。是时候离开 REPL，将你的代码放入 .js\
    \ 文件中，这样你就可以从简单开始并在此基础上构建。\n\n## 使用 JavaScript 文件\n\nREPL 对于测试很棒，但你需要能够保存和重用你的代码。你需要一个文本编辑器，这样你就可以编写和编辑你的\
    \ JavaScript 代码并将其保存到文件中。\n\n首先创建一个名为 **fromfile.js** 的文本文件。将此代码放入你的文件中，并将其保存到你记得的位置：\n\
    ```\nconsole.log('These words are from my .js file!');\n```\n在你的终端中，导航到保存 **fromfile.js**\
    \ 的同一目录，然后在命令行（不是在 REPL 中）输入此命令：\n```\n$ node fromfile.js\n```\nNode 将执行你文件中的代码，你将在屏幕上看到输出。\n\
    \n## 创建 Web 服务器\n\n既然你可以保存 .js 文件，你就可以开始探索 Node 的真正威力了。没有 Node，你只能编写在现有 Web 服务器上运行的\
    \ JavaScript 代码。但 Node 将你从那些浏览器中解放出来，让你可以创建自己的 Web 服务器！\n\n使用 Node 创建一个小型 Web\
    \ 服务器很容易。首先创建一个名为 **easyserver.js** 的文件，并将此代码保存在其中：\n```\nvar http = require('http');\n\
    var server = http.createServer(function(req, res) {\n    res.writeHead('I created\
    \ this server!');\n    res.end();\n});\nserver.listen(8080);\n```\n现在尝试运行你的服务器。我会在你尝试之后解释这段代码。在你的终端中，访问保存文件的目录中的命令行。输入\n\
    ```\n$ node easyserver.js\n```\n终端似乎会挂起，但没关系——这意味着你的服务器正在运行！\n\n打开一个浏览器并访问 URL\
    \ `localhost:8080`。你应该会看到 `I created this server!` 这行文字（图 2.1）。\n\n![一个包含来自你的\
    \ Web 服务器输出的网页](img/a0848e8632a09becbaacc6826f2a8219_25_0.png)\n\n**图 2.1：** 一个包含来自你的\
    \ Web 服务器输出的网页\n\n访问网页后，在终端中按 Ctrl-C 结束程序。\n\n让我们仔细看看这段代码中发生了什么。我不指望你现在就能理解它。我在原始代码中添加了注释。试着理解其主旨！\n\
    ```\nvar http = require('http');\nvar server = http.createServer(function(req,\
    \ res) {\n  // 向客户端发送响应\n  res.writeHead('I created this server!');\n  // 结束响应\n\
    \  res.end();\n});\n// Web 服务器正在监听 8080 端口\nserver.listen(8080);\n```\nNode 使用内置代码为你完成了大部分工作。第一行是调用\
    \ `http` 模块，该模块在幕后拥有将你正在运行的程序转换为 Web 服务器的代码。`require` 关键字使新变量 `http` 能够访问大量保存的\
    \ Node 代码和函数，这些代码和函数可以创建 Web 服务器。\n\n在第二行中，代码调用了一个名为 `createServer` 的函数。每当有人连接到你的\
    \ Web 服务器时，该函数中的代码就会被执行。\n\n最后一行告诉你要创建的服务器开始在特定端口（本例中为 8080）上监听传入的请求。\n\n## 你代码中的注释\n\
    \n你在上一个代码示例中看到的双斜杠允许你在代码中添加注释。Node 会忽略 `//` 后面的任何内容。注释对于帮助你记住代码中做了什么非常有用。\n\n\
    在下一章中，你将开始使用 JavaScript 构建一个 Twitter 机器人！\n\n# 3\n\n# 在树莓派上创建一个 Node Twitter 机器人\n\
    \n你已经编写了你的第一个 JavaScript 程序。接下来，你将学习如何使用 Node 创建一个 Twitter 机器人，该机器人可以在任何安装了 Node\
    \ 的机器上运行，包括你的树莓派。\n\n到现在为止，你的系统上应该已经安装了 Node。本章将指导你完成设置和授权 Twitter 帐户、将该帐户连接到\
    \ JavaScript 程序，并在程序中使用 `twit` npm 模块来完成大部分工作的步骤。\n\n## 创建并授权你的 Twitter 帐户\n\n\
    如果你的机器人还没有 Twitter 帐户，请在 Twitter.com 上创建一个。\n"
