    ## PREFACE: WHAT IS NODE.JS?


    JavaScript is a programming language that web browsers can run. Browsers like
    Firefox and Chrome are built with engines that can understand and execute programs
    written in the JavaScript language. Firefox has an engine called SpiderMonkey,
    and Chrome''s engine is called V8.


    Running JavaScript in a browser limits what you can do with it. For example, with
    JavaScript in a browser, you are limited to interacting with web pages. You can
    detect errors when people enter information in a form. You can open browser windows
    and alert boxes. But you can''t control anything outside of a browser.


    Fortunately, you have another option. When you install and use the JavaScript
    extension Node.js, your JavaScript code can run independently of a web browser.
    (You''ll often see Node.js simply called Node, and that''s what we''ll do for
    the rest of this book.)


    Node is the V8 JavaScript engine bundled together with libraries that handle input/output
    and networking. This means that Node lets you use JavaScript outside of a browser
    to run shell scripts, manage back-end services, and run directly on devices.


    ### What You Bring to the Book


    - Basic familiarity with programming concepts

    - Ability to set up and connect a Raspberry Pi

    - Ability to access and use a console

    - Understanding of sudo, directories, and file creation/editing


    ## Meet JavaScript and Node.js!


    This chapter takes you through the steps to install Node on your Mac, Windows,
    or Linux OS. Then you''ll check to see that it''s working.


    > **NOTE** As you install Node, you may notice that something called *npm* is
    also being installed. This program is the Node Package Manager.


    Node is really popular, and it has a whole new ecosystem of useful Node-based
    code packages other developers have created for you to use. When you want to use
    one of these packages in Node, you need an easy way to install and manage them.
    That''s what npm does for you—it installs additional Node packages you want to
    use.


    Follow the instructions for your system; then jump to the last section, "Node
    Is Installed; Now What?"


    ## INSTALL NODE ON MAC


    Although you could build Node from the source code, this guide is all about getting
    you going quickly. The easy way is to visit the official Node website, Nodejs.org,
    and use an automated installer. Here are the steps involved:


    **Step 1.** Visit *nodejs.org/en/download/* and click the Macintosh Installer
    button to download the installer (Figure 1.1).


    ![img/a0848e8632a09becbaacc6826f2a8219_9_0.png](img/a0848e8632a09becbaacc6826f2a8219_9_0.png)


    **FIGURE 1.1:** Nodejs.org download page


    **Step 2.** Find the file you downloaded and double-click it. You''ll see the
    installation dialog (Figure 1.2). Click Continue to go through the installation.
    Stick with the default settings.


    **Step 3.** When the installation finishes, you''ll see a summary screen with
    installation information (Figure 1.3).'
