    的使用。既然所有特性默认都是启用的，为什么还要特意激活某个特性呢？实际上，使用\"yes\"对新窗口的构成有不同的效果。如果你使用\"feature=yes\"\
    ，你会专门激活该特性并停用所有其他特性。这相当于说：\"除我明确声明激活的特性（通过使用\"feature=yes\"）外，所有特性都应停用。\" 无论你使用哪种方法，纯粹是个人偏好问题。\n\
    \n## 加载现有文档\n\n在决定了新窗口的构成后，我们可以专注于将要放入其中的内容。有两种主要方法可以为新窗口生成内容。你可以从现有网页生成新网页的内容，或者从与主网页一起加载并动态生成（或\"\
    即时\"生成）的内容。这里我们先看第一种方法。\n\n### 定义要插入的网页\n\n- 要用另一个 HTML 文档填充这个新窗口，请根据需要替换语法中的\
    \ URL 部分：document.write(\"URL\",\"name\",\"features\")。你需要已经创建好打算加载到新窗口中的文档，除非你打算使用在其他网站上找到的网页。（在使用其他网站的网页之前，你必须先征得并获得网站所有者的许可。）这里所示的示例中，主页面名为\
    \ sonnet.htm，要加载到页面中的文档名为 18.htm。它们的效果如下所示。\n\n### 触发动作\n\n- 现在你已经决定了新窗口的特性以及要加载的内容。最后要做的就是决定什么将触发新窗口的出现。一个典型且简单的解决方案是使用超链接或按钮。这里的示例（代码见反面）使用超链接和\
    \ onClick 事件处理程序来打开新窗口。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_49_0.png)\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_49_1.png)\n\n- 47 代码元素\n- 14 JavaScript\
    \ 事件处理程序\n\n## 代码元素\n\n❶ 由于我们在这里使用 onClick 事件处理程序，因此无需使用 `<script>` 标签。所有脚本都包含在\
    \ HTML 锚点标签 `<a href>` 和 `</a>` 中。\n\n❷ 首先输入将从中\"调用\"新窗口的文档名称——换句话说，就是你正在输入此代码的文档，在本例中为\
    \ sonnets.htm。\n\n❸ 接下来是 onClick=\"window.open()\" 命令。注意包围 window.open() 命令的引号，以及将包含所有与新窗口相关信息的括号。这些是代码的基本要素。\n\
    \n❹ 将所有与新窗口相关的参数（本章到目前为止讨论的所有内容）放在括号内。本示例显示以下信息：要加载的文档名为 18.htm。窗口的名称（用于编码目的而非显示目的）是\
    \ **sonnet18**。然后定义新窗口中可用的特性。新窗口将没有工具栏、菜单栏、滚动条，并且保持相同大小。高度和宽度分别定义为 320 像素高和 320\
    \ 像素宽。\n\n❺ 最后，给出将在页面上提供可见超链接的文本——Sonnet XVIII。\n\n## 向新窗口即时写入\n\n填充新网页的第二种主要方法是使用嵌入在主页\
