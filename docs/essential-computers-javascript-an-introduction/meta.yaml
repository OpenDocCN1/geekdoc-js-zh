  md: '# LOADING AN EXISTING DOCUMENT


    Having decided on the composition of the new window, we can concentrate on the
    material that will go into it. There are two main methods for generating content
    for new windows. You can generate the content of a new web page from an existing
    web page, or from content loaded with the main web page and generated dynamically
    (or "on the fly"). Here we will look at the first of these methods.


    ### DEFINING THE WEB PAGE TO BE INSERTED

    ● To fill this new window with another HTML document, replace the URL part of
    the syntax as required: document.write("URL","name","features"). You will need
    to have already created the document that you intend to load into the new window,
    unless you are going to use a web page that you have found on another site. (You
    must have asked for and received the site owner''s permission before using a web
    page from another website in this way.) In the example shown here, the main page
    is called sonnet.htm and the document to be loaded into the page is called 18.htm.
    These are seen in action below.


    ### TRIGGERING THE ACTION

    ● You have now decided on the features for your new window and the content that
    will be loaded into it. All that''s left to decide now is what will trigger the
    appearance of the new window. A typical and straightforward solution is to use
    a hyperlink or a button. The example here (for the code, see opposite) uses a
    hyperlink and the onClick event handler to open the new window.


