    ## MAKING THE IMAGE A LIVE HYPERLINK


    To keep things simple, in this example we have used a dead link (#) for the image.
    If anyone clicks on the image, nothing will happen. Placing a live link here is
    simply a matter of replacing # with the appropriate URL.


    ## PRELOADING IMAGES


    You can use JavaScript to preload images. This means that while your web page
    is first loading in the visitor''s browser window, you can send the specified
    images to the browser cache, a folder on your computer that stores recently accessed
    web pages. If a web page is cached here, the browser can access it much more quickly
    than from a remote server. Certain images required for rollovers are not visible
    when the page has loaded. These are the images that can be usefully preloaded
    into the cache, so that they really spring into life when needed rather than being
    subject to the slight delay that usually happens while they are being downloaded
    from the web.


    ### PRELOADING ON.JPG


    The code to make on.jpg appear, when we rollover off.jpg, goes into the body of
    the web page, but the code for preloading on.jpg goes into the <head> tag within
    script tags.


    ```

    <head>

    <script language="JavaScript">

    Image1=new Image(20,20)

    Image1.src="on.jpg"

    </script>

    </head>

    ```


    ## PRELOADING MULTIPLE IMAGES


    Image1 is a variable and you can choose any name you like for this, but it is
    always advisable to keep things simple. The information in brackets after new
    Image tells the browser the size of the image in pixels. It is saying "Reserve
    me a space with these dimensions on the page and fill it with the new image called
    Image1. I am just about to tell you where you can find Image1." Image1.src provides
    that location. If you want to preload more than one image, simply repeat the formula,
    keeping everything within the script tags. For example:


    Image2=new Image(100,50)

    Image2.src="services2.jpg"

    Image3=new Image(120,50)

    Image3.src="contact2.jpg"


    This tells the browser to preload two more images with the dimensions in pixels
    and gives them both variable names (Image2 and Image3). Initially, this profusion
    of names for what seem to be the same images can seem confusing, but, once grasped,
    it is really very simple.


    ## HOW IT WORKS


    In this example, Image1 Ⓐ is the name that identifies the space into which the
    image off.jpg Ⓑ is loaded. This space is filled when the web page is first displayed.
    If the visitor doesn''t move the mouse cursor over that space (i.e. that image),
    then nothing will happen. If the mouse cursor is moved over the space named Image1,
    however, the browser first checks the cache folder to see if any images have been
    preloaded for use in that space, it will find on.jpg Ⓒ, which is the image that
    the browser is calling for.


    ## NEW WINDOWS


    Have you ever wondered how some websites use pop-up windows to enhance their content?
    These sites are probably using JavaScript''s `window.open()` and `window.close()`
    commands.


    ## THE WINDOW OPEN() METHOD


    The `open()` method of the window object creates new windows when a link or button
    is clicked while keeping the original window open. In addition to specifying the
    contents of a new window, you can also determine its dimensions and use of features
    such as toolbar and scrollbar. Some web page links lead to a pop-up text box rather
    than another web page, but the text box is probably a new web page. JavaScript
    has been used to strip the new web page of its features, which can be deactivated
    as easily as typing "feature=no" in a line of JavaScript.


    ## WINDOW.OPEN SYNTAX


    "URL"

    If the HTML document is in the same folder (directory) as the main page, just
    type its name (e.g., pagetoload.htm). If it is in another directory, type the
    path (e.g., anotherfolder/pagetoload.htm). If the document is on another server
    (and if you have the owner''s permission to use it), type the full web address
    (e.g., http://www.anotherserver.com/pagetoload.htm).


    "NAME"

    This name, surprisingly, does not appear in the title bar of the new web page.
    It is required for more advanced JavaScript effects, but in the example shown
    here it will have no effect on the appearance of the new window.


    "FEATURES"

    This contains all the optional features that determine the size and composition
    of the new window. If this third part of the string is left blank, the default
    window is opened with all the features in place.


    ## OPENING A NEW WINDOW


    - Opening a new window using JavaScript is simple. Just drop the lines of code:
    `<script language="JavaScript">window.open("");</script>` into your HTML document.
    Of course, just opening a new window is only part of the process. If you dropped
    this code into one of your web pages, you would only display an empty box – or
    rather a window containing a pop-up error message. This is because you have not
    yet defined two important windows'' parameters: (1) The content you want to load
    into the new window; (2) The event that will trigger the appearance of the new
    window and the loading of the content.


    - The appearance of the new window is determined by the features that you decide
    it is to have. On the following pages, we will consider first how to define the
    new window''s features, then how and when to load material into it.


    Since neither the content of the page nor the event that will trigger its appearance
    has been defined, the page displays an error message


    ## Designing the New Window


    The appearance of web browsers can vary considerably, according to user preference.
    You need to cater to all browser setups when deciding which features to include
    or omit from any new windows you intend to create. Just because you can''t see
    a particular browser feature on-screen, it doesn''t mean that visitors to your
    website will have their browsers configured in the same way. So even if you have
    the toolbar switched off in your browser, remember to use the **"toolbar=no"**
    code if you want to ensure that it is absent from the new window when viewed in
    all browsers.


    ### OPTIONAL CHOICES


    This typical web page shows the features of the browser window that can be included
    or excluded when you use JavaScript to open a new window.


    ### DEACTIVATING FEATURES


    All these features are active by default when a new window is loaded. To deactivate
    any of them, use this code:


    | | |

    |:---|:---|

    | `menubar=no` | `toolbar=no` |

    | `location=no` | `scrollbars=no` |

    | `status=no` | `resizeable=no` |


    ### COMBINED NOTATIONS


    Features can be set by using 1 (for "yes") and 0 (for "no"). Either notation works
    and they can also be combined.


    ### KEY TO WINDOW FEATURES


    1. Menu bar

    2. Toolbar (back, forward buttons, etc.)

    3. Address bar (URL location field)

    4. Scrollbar

    5. Status bar

    6. Resize corner'
