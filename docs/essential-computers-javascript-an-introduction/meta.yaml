    # USING VARIABLES WITH PROMPT BOXES


    +   - As this code shows, in order to use what your visitor has typed, you need
    to create a variable name. The window.prompt() code captures the visitor''s first
    name for you, but you can only use it if you associate that input with a variable
    name (e.g. vName).

    - The variable can then be placed anywhere on the web page when used in conjunction
    with the document.write() command.


    ```

    <html>

    <title>WebVerse</title>

    <script language="JavaScript">

    var vName=prompt("What''s your name?","");

    alert("Hi "+vName+" !");

    </script>


    <body>

    <p><img src="images/vv.png" width="128" height="51"></p>

    <p><b>A collection of the finest English poetry.</b></p>

    <p>

    <script language="JavaScript">

    document.write("Welcome to WebVerse " +vName+ ".")

    </script>

    <p>This is an online guide to English poetry, providing links to some of the many
    collections of online verse, literary magazines, poetry discussion sites and so
    on.

    <p> This site mainly exists as an additional resource for a weekly e-mail newsletter
    compiled by a group of enthusiasts here in London. You''ll find plenty to interest
    you on this site, but you''ll find much more information if you subscribe to our
    newsletter

    <p> <a href="subs.htm">Subscribe</a>

    <br>

    </html>

    ```


    Place the variable anywhere on the page


    # WINDOW.PROMPT SYNTAX


    The prompt method must be used within <script> tags. The first string comprises
    the contents of the pop-up dialog box (usually the question that you are asking
    the visitor). In the code, you define the question exactly as you would for an
    Alert box. With the window.prompt() method, however, you can use an optional second
    text string to determine the text that will appear in the text field. This is
    usually filled with something helpful for the visitor like "Type your reply here,"
    and the visitor can immediately overtype it. If the second string is kept blank
    (i.e. you just use the quotation marks with nothing between them) and the visitor
    clicks OK without typing anything in the text box, nothing will appear in the
    appropriate position on the web page.


    To create a variable in JavaScript, first choose a name for the variable, and
    then state what that variable name represents, using the following syntax:

    var yourVariableName =value. You can pick any name you choose for a variable,
    but it is more helpful to give it a descriptive name that shows what it contains.


    ```

    window.prompt("first string","second string");

    ```'
  - '[PAGE 33]


    # CONFIRM BOXES


    Confirm boxes are essentially Alert boxes that offer a choice of two response
    buttons: OK or Cancel (which is the same as Yes or No). There is very little point
    in using the window.confirm() method unless you can do something useful with the
    response typed by the visitor. To make the most of this OK or Cancel response,
    you need to learn how to use the if...else statement in JavaScript.


    # USING JUST THE IF... STATEMENT


    +   - Here is a simple example that shows you can sometimes get the result you
    want merely by using the if clause. Clicking on the subscribe link brings up a
    Confirm box.


    ![](img/9c0598183412917c38d5c5bb4b516af7_33_0.png)


    +   - The code that controls the Confirm box provides a conditional clause. This
    determines the effect of clicking on the OK button.


    ```

    <html>

    <head>

    <script language="JavaScript">


    if (confirm("To subscribe to the newsletter click OK."))

    {

    location.href=''subscribe.htm''

    }


    </script>


    </head>

    </html>

    ```


    +   - If the visitor clicks the OK button, he or she will be taken to the URL
    defined in the line beginning location.href.


    ![](img/9c0598183412917c38d5c5bb4b516af7_33_1.png)'
