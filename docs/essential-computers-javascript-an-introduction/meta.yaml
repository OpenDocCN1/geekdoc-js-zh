- md: ' ## 64 · AUTOMATED SCRIPTING


    In this example, FrontPage Express has been used to cause a User Prompt to appear,
    generated by the line of code beginning var greet=prompt. As this example shows,
    FrontPage Express has made very few modifications to the code you typed in the
    code box, but it has carried out two important tasks. First, it has added comment
    tags to prevent it from being visible to non-JavaScript-enabled browsers; and
    second, it has placed the necessary `<script>` tags around your code.


    If you opt to use such sophisticated web design packages as FrontPage Editor and
    Explorer to generate JavaScript code, you may find, when you look at the source
    code, that it turns out to be more complex than you were expecting.


    ```

    <html>

    <head>

    <meta http-equiv="Content-Type"

    content="text/html; charset=iso-8859-1">

    <meta name="GENERATOR" content="Microsoft FrontPage Express 2.0">

    <title>Untitled Normal Page</title>

    </head>

    <body bgcolor="#FFFFFF">

    <h3><font color="#0000FF">William Shakespeare: the Sonnets</font></h3>

    <p><font color="#0000FF"><b>Sonnets 40-49</b><br>

    <br>

    <img src="file:///C:/WINDOWS/Profiles/bri/Desktop/book.jpg"

    align="center" width="20" height="25"> </font><a

    href="file:///C:/WINDOWS/Profiles/bri/Desktop/sonnets.htm"

    onclick="window.open(''18.htm'',''sonnet18'',''config=toolbar=0,menubar=0,sc

    olor=#0000FF'')">Sonnet XVIII</font><a><font color=#0000FF> <font><p>

    <p><script language="JavaScript"><!--

    var greet=prompt("What''s your name","Type your name");

    alert("Greetings " +greet+ "!");

    // --></script></p>

    </body>

    ```


    The User Prompt is generated by the line of code beginning var greet=prompt


    Hiding JavaScript


    ## MACROMEDIA''S DREAMWEAVER


    Macromedia''s Dreamweaver is one of the best site-design packages available. Most
    of its JavaScript-related features (categorized as Behaviors), together with other
    advanced HTML effects, are accessed through the Behaviors window.


    ## DREAMWEAVER''S BEHAVIOR MENUS


    - In this example, we are going to use the Open Browser Window dialog box to set
    the features for a new pop-up window.


    - Start by clicking the + button and choosing Open Browser Window from the drop-down
    menu.


    - Choose the features you require from the Open Browser Window dialog box and
    click on OK.


    - Dreamweaver now automatically generates the JavaScript code and places it within
    the HTML source code for the page.


    44 Designing the New Window


    ## ADDING YOUR OWN SCRIPTS


    - To place your own JavaScript within an HTML document that you are building using
    Dreamweaver, start by choosing Script from the Insert drop-down menu.


    - In the Insert Script dialog box, choose JavaScript from the drop-down Language
    box.


    - Type your script in the Content box. There is no need to key in `<script>` tags
    or comments within this box. Click on OK.


    ## INSERTING A ROLLOVER IMAGE


    - To insert a rollover image, start by choosing Rollover Image from the Insert
    drop-down menu.


    The Insert Rollover Image dialog box will open. Click the Preload Rollover Image
    check box if you want the rollover images to be preloaded.


    - Then click on the first Browse button.


    - In the Original Image dialog box, navigate to the image file you intend to use
    for the original image.


    - Once it is selected, you will return to the Insert Rollover Image dialog box.
    Click on the second Browse button, navigate to the image file you intend to use
    for the rollover image, and click on Select.


    - Once the original and rollover images are named in the fields in the Insert
    Rollover Image dialog box, click on OK.


    The rollover will now be in place on your web page. This method reduces the need
    for you to know how to write code, but the code that it generates can be very
    confusing if you want to learn to do it for yourself.


    40 Preloading Images


    ## SCRIPTS FROM THE WEB


    The web can offer huge amounts of JavaScript code for all levels of author. You
    will also find some excellent tutorials and repositories of ready-made scripts.


    ## READY-MADE SCRIPTS


    One of the quickest ways to see the range of JavaScript''s capabilities is to
    visit one of the many "script repositories" on the web, which have scripts available
    for you to cut and paste into your own documents. Usually, you are asked to credit
    the author in your HTML code or to place a shortcut to the site on your web page.
    Many of these sites give clear instructions about how to copy and paste the script
    into your own HTML document, and you can learn a lot from the code.


    ## WEBMONKEY JAVASCRIPT LIBRARY


    HotWired''s WebMonkey is an essential site for any web page author. The Javascript
    code library covers a wide range of subjects and offers a large number of free
    code samples to use in your source code. There is also a wealth of information
    from JavaScript authors that will stimulate your own ideas and help you write
    better code. Or you can just copy and paste the scripts, marvel at the authors''
    ingenuity, and leave the learning for another day...


    ## THE JAVASCRIPT SOURCE


    The JavaScript Source contains hundreds of free JavaScripts that you can copy
    and paste into your source code. Organized by category, each script is illustrated
    with a fully working example. You can also choose an option that enables you to
    have any JavaScript sent directly to your email address.


    ## WEBSITE ABSTRACTION


    This site offers an excellent library of free JavaScript code as well as a broad
    range of JavaScript-related resources, including tutorials aimed at beginners
    to advanced-level users. The free JavaScripts are arranged in more than 20 top-level
    categories.


    - JavaScript clocks, calendars, and timers

    - Scrollers

    - Combo Boxes

    - Windows, remotes, frames, etc

    - Special effects with background document

    - Effects with images and music

    - Links

    - Password protecting


    ## GLOSSARY


    | Term | Definition |

    |------|-----------|

    | **COMMENTS** | Explanatory text that appears in source code but not on the page.
    |

    | **CONCATENATE** | Run two or more strings together (using the character + between
    each) to create one longer string. |

    | **DOWNLOAD** | The process of transferring a file from a remote computer to
    your computer. |

    | **EMBED** | To place one block of code within another. JavaScript code is embedded
    within HTML. |

    | **EVENT** | An action carried out by the user, such as moving or clicking the
    mouse, or entering or leaving a web page. |

    | **EVENT HANDLERS** | A JavaScript command (such as onClick or onSubmit) that
    is carried out when the user has executed the appropriate mouse or key movement.
    |

    | **FREEWARE** | Software that can be freely used and distributed but whose author
    retains copyright. |

    | **FUNCTION** | A block of code containing a series of commands, identified by
    a single user-defined name. |

    | **GIF** | Graphics Interchange Format. A compressed image format limited to
    256 colors, suited to images with large areas of flat color, such as web graphics.
    |

    | **HOME PAGE** | The main page of a website, usually called home.htm or index.htm,
    which is opened first when you visit a website. |

    | **HTML** | Hypertext markup language. The "tagged" formatting language in which
    web pages are written. |

    | **HYPERLINK** | Part of a web page (text, image, table, etc.) that links to
    a file or document on the internet. |

    | **HYPERTEXT** | Text that links to other parts of a document, or to documents
    held on another computer. |

    | **ISP** | Internet Service Provider. Any organization that provides access to
    the internet. |

    | **JPEG** | Joint Photographic Experts Group. One of the most commonly used image
    formats on the internet, widely used for photographs. |

    | **LAYER** | A container in Dreamweaver into which text, images, objects, and
    other layers can be loaded. |

    | **NETWORK** | A group of interconnected computers that exchange data. |

    | **PATH** | The address of a file on a computer system. |

    | **PIXEL** | A unit of measurement for computer displays. A display consists
    of a series of pixels that display images on screen. |

    | **PNG** | A widely used compressed image format on the web that, like the JPEG
    format, can display millions of colors. |

    | **ROLLOVER** | In web pages, the swapping of one image for another when the
    mouse cursor passes over a specific image space, giving the effect of animation.
    |

    | **SERVER** | Any computer that allows users to connect to it and share information
    and resources held on it. Also refers to the software that makes the information
    available for downloading. |

    | **SHAREWARE** | Software that is made freely available for use on a try-before-you-buy
    basis. |

    | **STATUS BAR** | The area along the bottom of the web browser window that shows
    a URL when the mouse cursor points to the hyperlink. |

    | **STRING** | A value consisting of a series of alphanumeric characters enclosed
    in quotation marks. |

    | **UPLOAD** | The process of transferring a file from your computer to a remote
    computer. |

    | **VARIABLE** | A user-defined name that refers to a value. A variable can consist
    of a string. |'
