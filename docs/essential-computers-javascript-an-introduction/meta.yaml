  md: '# # GLOSSARY


    **COMMENTS**

    Explanatory text that appears in source code but not on the page.


    **HOME PAGE**

    The main page of a website, usually called home.htm or index.htm, which is opened
    first when you visit a website.


    consists of a series of pixels that display images on screen.


    **CONCATENATE**

    Run two or more strings together (using the character + between each) to create
    one longer string.


    **HTML**

    Hypertext markup language. The "tagged" formatting language in which web pages
    are written.


    **PNG**

    A widely used compressed image format on the web that, like the JPEG format, can
    display millions of colors.


    **DOWNLOAD**

    The process of transferring a file from a remote computer to your computer.


    **HYPERLINK**

    Part of a web page (text, image, table, etc.) that links to a file or document
    on the internet.


    **ROLLOVER**

    In web pages, the swapping of one image for another when the mouse cursor passes
    over a specific image space, giving the effect of animation.


    **EMBED**

    To place one block of code within another. JavaScript code is embedded within
    HTML.


    **HYPERTEXT**

    Text that links to other parts of a document, or to documents held on another
    computer.


    **SERVER**

    Any computer that allows users to connect to it and share information and resources
    held on it. Also refers to the software that makes the information available for
    downloading.


    **EVENT HANDLERS**

    A JavaScript command (such as onClick or onSubmit) that is carried out when the
    user has executed the appropriate mouse or key movement.


    **ISP**

    Internet Service Provider. Any organization that provides access to the internet.


    **SHAREWARE**

    Software that is made freely available for use on a try-before-you-buy basis.


    **EVENT**

    An action carried out by the user, such as moving or clicking the mouse, or entering
    or leaving a web page.


    **JPEG**

    Joint Photographic Experts Group. One of the most commonly used image formats
    on the internet, widely used for photographs.


    **STATUS BAR**

    The area along the bottom of the web browser window that shows a URL when the
    mouse cursor points to the hyperlink.


    **FREEWARE**

    Software that can be freely used and distributed but whose author retains copyright.


    **LAYER**

    A container in Dreamweaver into which text, images, objects, and other layers
    can be loaded.


    **STRING**

    A value consisting of a series of alphanumeric characters enclosed in quotation
    marks.


    **FUNCTION**

    A block of code containing a series of commands, identified by a single user-defined
    name.


    **NETWORK**

    A group of interconnected computers that exchange data.


    **UPLOAD**

    The process of transferring a file from your computer to a remote computer.


    **GIF**

    Graphics Interchange Format. A compressed image format limited to 256 colors,
    suited to images with large areas of flat color, such as web graphics.


    **PATH**

    The address of a file on a computer system.


    **VARIABLE**

    A user-defined name that refers to a value. A variable can consist of a string.


    **PIXEL**

    A unit of measurement for computer displays. A display'
