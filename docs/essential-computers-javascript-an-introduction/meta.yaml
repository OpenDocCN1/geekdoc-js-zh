  - '[PAGE 48]


    # DEFINING OTHER FEATURES


    There are various other optional features that can be incorporated into a new
    window, but some of these are “JavaScript 1.2-compliant” only, which means that
    they will not work in earlier versions of Internet Explorer, Netscape Navigator,
    and some other browsers. The most useful of these features enables you to define
    the position on the screen where the new window will pop up. Both the x and y
    coordinates of the top left corner of the new window can be defined in terms of
    the number of pixels from the left and the top of your on-screen desktop. The
    syntax for doing this is: screenx=pixels (for the x coordinate) screeny=pixels
    (for the y coordinate). The effect of typing in “screenx=200,” for example, will
    be to position the top left corner of the new window 200 pixels from the left
    of your on-screen desktop.


    # DEFINING WIDTH AND HEIGHT


    To define the dimensions of the new window, use the width and height settings.
    width=pixels (e.g., width=300) height=pixels (e.g., height=320) Separate each
    feature setting with a comma: “width=350,menubar=no,status=no,resizeable=no.”


    ![](img/9c0598183412917c38d5c5bb4b516af7_48_0.png)


    > **USING YES FOR FEATURES**


    When you are looking at other people’s source code (which is highly recommended
    if you decide to learn more about JavaScript), you will notice the use of “feature=yes.”
    Why bother to deliberately activate a feature when all features are active by
    default? Using “yes” actually has a different effect on the new window’s composition.
    If you use “feature=yes” you specifically activate that feature and deactivate
    all the others. It is the equivalent to saying, “All features should be deactivated
    apart from the ones I am expressly stating are active (by using “feature=yes”
    ).” Whichever method you use is purely a matter of personal preference.'
