  md: '# HIDING JAVASCRIPT


    In the context of JavaScript, there are two kinds of comments that can be included
    in the HTML document. The first of these, discussed in a later chapter, consists
    of comments keyed into the JavaScript itself that allow you to write helpful notes
    to yourself. The second kind consists of comments keyed into the HTML, and these
    serve a more important purpose when writing JavaScript. HTML comments can hide
    your code from old browsers that can''t handle JavaScript.


    # USING AN HTML COMMENT


    Older browsers that cannot display JavaScript may display your code as text on
    the page. To prevent this from happening, comments in the HTML can be used to
    hide JavaScript. The example below shows this in action. The opening of a comment
    in HTML is: <!--. The closing of a comment in HTML is: -->. A browser that can
    handle Javascript will carry out the JavaScript commands – in this example, writing
    text to the browser window. A browser that can''t handle Javascript will simply
    ignore everything between the HTML comment tags.


    ![](img/9c0598183412917c38d5c5bb4b516af7_23_0.png)


    ```

    <html>

    <head>

    <title>HTML comments</title>

    </head>


    <script language="JavaScript">

    <!-- Hide JavaScript from older browsers


    document.write("All this text will appear in<br>");

    document.write("browsers that handle JavaScript.<br>") ;

    document.write("Older browsers will display <br>");

    document.write("only the message in red <br>");

    document.write("at the bottom of the page.<br>");


    // stop hiding JavaScript -->

    </script>


    <hr>

    <h6> <font color="red">If only this message is displayed,

    you need to visit the <a href="textonly.htm">text-only

    version </a> of this page.</font></h6>


    </html>|

    ```'
  merge: -1
