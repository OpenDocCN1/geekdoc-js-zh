- md: '## WHAT CAN JAVASCRIPT DO?


    By extending the control you have over the way that the web browser works, JavaScript
    can produce many on-screen effects that inject added functionality to web pages
    to increase their attractiveness and, most importantly, their usefulness.


    ## JAVASCRIPT CONTROLS


    For instance, JavaScript can enable you to:


    - Control the contents of the status bar along the foot of the window, which by
    default displays the relevant URL when the mouse cursor is positioned over a hyperlink.


    ![](img/9c0598183412917c38d5c5bb4b516af7_10_0.png)


    - Specify images and text to appear when the mouse pointer moves over certain
    areas of the screen. These areas can be images, links, or even blank areas of
    the page. This facility enables you to produce smooth rollover effects, swapping
    one image for another – for example, making a button appear to be pressed in.


    ![](img/9c0598183412917c38d5c5bb4b516af7_10_1.png)


    - Use information from the visitor''s browser to detect whether necessary software
    is installed, and alert the visitor or reroute them to a part of the site that
    is designed for their browser type.


    ![](img/9c0598183412917c38d5c5bb4b516af7_10_2.png)


    - Use information from the visitor to personalize the page with his/her name.

    - Determine the makeup of new hyperlinked windows, such as whether they are to
    contain toolbars, address boxes, and scroll bars.


    ![](img/9c0598183412917c38d5c5bb4b516af7_11_0.png)


    The user''s name is keyed in


    The name then appears in this pop-up Alert box


    ## ADVANCED EFFECTS


    JavaScript can also be used to carry out equations or create interactive games.
    There are many sites, such as javascript.internet.com, that offer complex scripts
    that can be pasted into your HTML documents.


    ![](img/9c0598183412917c38d5c5bb4b516af7_11_1.png)


    ## OVERDOING IT


    The interactivity that JavaScript offers can prove too tempting for many beginners,
    so use it sensibly to help the visitor, rather than just to show off. For example,
    if you use JavaScript to detect the visitor''s browser type and version, it is
    irritating for the visitor just to be told that you know. It would be far better
    to use the information to divert the visitor to a part of the site specifically
    designed for users of that browser. To do this, you will need some knowledge of
    functions and "if...else" statements. These may sound complex, but they are surprisingly
    easy to learn.


    ## SHOWING OFF


    - Using JavaScript to activate an Alert box like this one is more likely to be
    annoying than helpful.


    ![](img/9c0598183412917c38d5c5bb4b516af7_11_2.png)


    15 JavaScript Functions


    27 Alert Boxes


    ## JAVASCRIPT IN ACTION


    You can embed JavaScript in the HTML code of any web page in your website. Before
    looking at an example of the code, let''s look at a typical sequence of web pages
    that demonstrates the kind of interactivity that JavaScript can produce.


    ### 1 BRINGING UP AN ALERT BOX


    - The appearance and content of this Alert box on the opening screen are controlled
    by JavaScript.


    ![](img/9c0598183412917c38d5c5bb4b516af7_12_0.png)


    ### 2 IDENTIFYING THE WEB BROWSER


    - The ability to identify the particular web browser that the visitor is using,
    and to insert the browser name into the onscreen text, is a feature of JavaScript.


    ![](img/9c0598183412917c38d5c5bb4b516af7_12_1.png)


    ### 3 VIEWING TEXT IN THE STATUS BAR


    - In this case, the text that appears in the status bar at the bottom of the screen,
    in response to the pointer passing over the link on the page, is defined in the
    JavaScript code.


    ![](img/9c0598183412917c38d5c5bb4b516af7_12_2.png)


    ## THE JAVASCRIPT BEHIND THE EVENTS


    Taking the sequence that we have just seen and looking at the HTML source code,
    we can see how the effects have been achieved using just a few lines of JavaScript
    embedded in the HTML. The annotations highlight a few points about the appearance
    and uses of JavaScript, which are developed in this book.


    ![](img/9c0598183412917c38d5c5bb4b516af7_13_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_13_1.png)


    This code causes the above Alert box to pop up when the page is opened


    The document.write command writes everything in quotes, plus everything within
    the + signs, to the web page


    This code (navigator.appName) detects the visitor''s browser type and version
    and writes the browser type dynamically to the web page


    Learning about your browser


    I see you''re using the Microsoft Internet Explorer browser. This page will help
    you find out more about your browser. Use the buttons at the bottom of the page
    to visit the main browser producers'' sites, or to read a history of Web browsers.


    To do your own research, follow these hyperlinks to our lists of leading Web directories
    and recommended search engines.


    ![](img/9c0598183412917c38d5c5bb4b516af7_13_2.png)


    ## MAKING THINGS HAPPEN


    The active elements within the windows we have just seen (the appearance of an
    Alert box, the identification of the user''s browser, and the text seen in the
    status bar when the cursor moves over the hyperlinks) are controlled by JavaScript
    embedded within this HTML document.


    ```

    <title>


    page'')">

    >

    <b>" +navigator.appName


    about your browser. Use the

    isit the main browser

    of Web browsers.</b>


    hyperlinks to our lists of

    sitehere.com/webdir.htm"

    these recommended Web

    ies</a>


    m/webdir.htm"

    ing with one of these top

    gines</a>

    ```


    ## JAVASCRIPT SYNTAX


    ### QUOTATION MARKS IN TEXT


    Use quotation marks within text "strings" carefully, because they can seriously
    confuse the browser about where the code ends and the text begins. The rule is,
    you should use single quotations if you need to use quotation marks within double
    quotation marks. For example:


    document.write ("Be very ''careful'' about using quote marks.")


    ### SEMICOLONS


    It is an optional, but useful, practice to end each line of code with a semicolon.
    This punctuation mark tells the browser unequivocally where a new line of code
    begins. The newer versions of the most popular web browsers may be able to work
    out for themselves where a new line of code begins, but now and then a missing
    semicolon can cause a mess.


    or to read a history of Web browsers.


    ![](img/9c0598183412917c38d5c5bb4b516af7_14_0.png)


    To do your own research, follow to our lists of leading Web directories and recommended
    search engines


    Try searching with one of these top search engines


    These two blocks of code specify the text that will appear in the status bar (see
    above) when the mouse cursor moves over the text hyperlinks


    ## JAVASCRIPT BASICS


    Recognizing where to put blocks of JavaScript code into an HTML document is one
    of the first things you need to know when approaching the language for the first
    time.


    ### IDENTIFYING JAVASCRIPT


    Lines of JavaScript code need to be identified separately from HTML code. If you
    look at the source code of any HTML document containing JavaScript, the JavaScript
    code is most easily recognized if it is contained within <script> tags.


    #### USING <SCRIPT> TAGS


    ![](img/9c0598183412917c38d5c5bb4b516af7_15_0.png)


    - When code is placed between <script> and </script> tags, most browsers assume
    that the enclosed code is to be read as JavaScript.

    - Most browsers take JavaScript to be the default, but other scripts (VBScript,
    for example) can be used within these tags. For this reason it is advisable to
    specify the programming language that is being used, in this case by making the
    first tag `<script language="JavaScript">`.


    #### EMBED JAVASCRIPT ANYWHERE


    When enclosed within <script> tags, JavaScript can be embedded anywhere in an
    HTML document (as long as it doesn''t conflict with HTML rules), and as many times
    as required. If the script relates to a button on the page, you can place the
    code adjacent to that block of HTML on the page. More often than not, though,
    the JavaScript is placed within the <head> section of the document. This is particularly
    true where functions are concerned.'
  mdcn: '

    ## JAVASCRIPT 能做什么？


    通过扩展你对网页浏览器工作方式的控制能力，JavaScript 可以产生许多屏幕效果，为网页注入额外功能，提升其吸引力，更重要的是，增强其实用性。


    ## JAVASCRIPT 控制功能


    例如，JavaScript 可以让你：


    - 控制窗口底部状态栏中显示的内容。默认情况下，当鼠标光标悬停在超链接上时，状态栏会显示相应的 URL。


    ![](img/9c0598183412917c38d5c5bb4b516af7_10_0.png)


    - 指定当鼠标指针移过屏幕上某些区域时显示的图像和文字。这些区域可以是图像、链接，甚至是页面的空白区域。此功能使你能够制作平滑的悬停效果，将一个图像替换为另一个——例如，使按钮看起来像是被按下的。


    ![](img/9c0598183412917c38d5c5bb4b516af7_10_1.png)


    - 利用访问者的浏览器信息来检测是否安装了必要的软件，并提醒访问者或将他们重定向到为他们的浏览器类型而设计的网站部分。


    ![](img/9c0598183412917c38d5c5bb4b516af7_10_2.png)


    - 利用访问者的信息，用他/她的名字个性化页面。

    - 确定新的超链接窗口的构成，例如它们是否包含工具栏、地址栏和滚动条。


    ![](img/9c0598183412917c38d5c5bb4b516af7_11_0.png)


    用户输入姓名


    随后姓名出现在此弹出的提示框中


    ## 高级效果


    JavaScript 还可以用来执行方程计算或创建互动游戏。有许多网站，例如 javascript.internet.com，提供复杂的脚本，可以直接粘贴到你的
    HTML 文档中。


    ![](img/9c0598183412917c38d5c5bb4b516af7_11_1.png)


    ## 不要过度使用


    JavaScript 提供的交互性对许多初学者来说可能过于诱人，因此要合理使用，以帮助访问者为目的，而不仅仅是炫耀。例如，如果你使用 JavaScript
    检测访问者的浏览器类型和版本，仅仅告诉访问者你知道这一点会让他们感到恼火。更好的做法是利用这些信息将访问者引导到专门为该浏览器用户设计的网站部分。要做到这一点，你需要了解一些函数和
    "if...else" 语句的知识。这些听起来可能很复杂，但学起来出奇地简单。


    ## 炫耀


    - 使用 JavaScript 激活像这样的提示框，与其说是有帮助，不如说更可能令人厌烦。


    ![](img/9c0598183412917c38d5c5bb4b516af7_11_2.png)


    15 个 JavaScript 函数


    27 个提示框


    ## JAVASCRIPT 实战


    你可以将 JavaScript 嵌入网站中任何网页的 HTML 代码中。在查看代码示例之前，让我们先看一个典型的网页流程，展示 JavaScript 能够产生的交互效果。


    ### 1 弹出提示框


    - 开屏提示框的外观和内容由 JavaScript 控制。


    ![](img/9c0598183412917c38d5c5bb4b516af7_12_0.png)


    ### 2 识别网页浏览器


    - 识别访问者使用的特定网页浏览器，并将浏览器名称插入屏幕文本中，这是 JavaScript 的一项功能。


    ![](img/9c0598183412917c38d5c5bb4b516af7_12_1.png)


    ### 3 在状态栏中显示文本


    - 在本例中，当指针经过页面上的链接时，屏幕底部状态栏中显示的文本由 JavaScript 代码定义。


    ![](img/9c0598183412917c38d5c5bb4b516af7_12_2.png)


    ## 事件背后的 JAVASCRIPT


    回顾我们刚刚看到的序列并查看 HTML 源代码，我们可以看到这些效果是如何通过嵌入在 HTML 中的仅仅几行 JavaScript 实现的。注释突出了 JavaScript
    外观和用途的几个要点，这些将在本书中详细讲解。


    ![](img/9c0598183412917c38d5c5bb4b516af7_13_0.png)


