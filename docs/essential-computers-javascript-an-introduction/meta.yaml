    ## 关于大小写的问题


    如果你曾好奇为什么 JavaScript 中的变量、函数和其他名称都使用大写字母，简单的答案是：约定俗成。无论你使用 myVariable、MyVariable
    还是 myVARIABLE 这样的拼写都没有关系，但你在文档主体中使用的拼写方式必须完全匹配，否则你的代码可能会失败。因此，大多数人倾向于对函数和变量使用小写，对名称中后续单词的首字母使用大写，例如
    myVariable。


    ## 警告框


    alert 方法主要用于吸引访客的注意力。例如，一行 JavaScript 代码就可以创建一个简单的欢迎公告。Alert 框还可以宣告更复杂的 JavaScript
    检测脚本的结果，比如检测访客是否拥有查看你的网站所需的所有插件。你可以选择发布任何复杂的公告，但启动 Alert 框的代码非常直接，如下例所示。


    ## 一个友好的欢迎警告框


