    of the properties and methods relating to the window object, but the principles
    apply to all JavaScript objects, properties, and methods.


    # ## OBJECT


    ● An object in JavaScript is an entity that can usually be broken down into sub-categories
    or parts. It can also have things done to it, or be acted upon. Objects include
    window, form, image, and button.


