    ## 链接方法是如何工作的？


    当访问此网页的访客点击“关闭此窗口”超链接时，浏览器会尝试转到新页面。由于没有可供跳转的页面，浏览器会遵循 JavaScript 代码给出的指令并关闭页面。（如果你尝试在引号之间键入一个
