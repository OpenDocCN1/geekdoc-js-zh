- md: '## POP-UP BOXES


    One of the easiest ways to enliven your web pages and directly involve any visitors
    to your site is to use JavaScript''s Alert, Confirm, and Prompt pop-up dialog
    boxes.


    ## JAVASCRIPT DIALOG BOXES


    The three kinds of JavaScript dialog boxes share one important characteristic.
    Once any one of them has popped up on-screen, all activity within the web page
    is frozen until an appropriate button in the dialog box is clicked. For example,
    once an Alert box has popped up, everything freezes until the OK button has been
    clicked. On-screen Alert boxes cannot be sent to the back of the browser window.
    Nor can you click within the main part of the browser window when an Alert box
    is displayed. The only possible action is to click the OK button in the box. This
    same suspension of activity holds true for the Confirm and Prompt boxes.


    ## THE JAVASCRIPT POP-UP BOXES


    - The Alert box is the simplest kind of box, and it is used mainly to capture
    the attention of the visitor.

    - The Confirm box is also used in this way, but has a Cancel button so that the
    visitor also has the choice of refusing an option.

    - The Prompt box takes the process one stage further by prompting the visitor
    to input information of some kind.


    ![](img/9c0598183412917c38d5c5bb4b516af7_29_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_29_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_29_2.png)


    27 Alert Boxes   28 Prompt Boxes   30 Confirm Boxes


    ## THE CASE IN QUESTION


    If you have wondered why capital letters are found throughout the variables, functions,
    and other names used in JavaScript, the simple answer is convention. It doesn''t
    matter whether you use the spelling myvariable, MyVariable, or myVARIABLE, but
    the way in which you spell it in the main body of the document should then match
    the case exactly, or your code may fail. For that reason, most people tend to
    use lower-case for functions and variables, reserving upper-case for the initial
    letter of subsequent words within the name, for example, myVariable.


    ## ALERT BOXES


    The alert method is used mainly to catch the visitor''s attention. For example,
    one line of JavaScript can create a simple welcome announcement. An Alert box
    can also announce the results of more complicated JavaScript detection scripts,
    such as detecting whether the visitor has all the plug-ins necessary to view your
    site. You can choose to make any complex announcement that you like, but the code
    for launching the Alert box is very straightforward, as this example shows.


    ## A WELCOMING ALERT BOX


    - This example shows how to produce an Alert box that welcomes visitors to the
    "WebVerse" site. Whatever the content, the syntax works just the same.

    - The status bar shows that the appearance of the Alert box has frozen the loading
    of the web page. As the window.alert code is in the head, the page will not load
    further until the OK button has been clicked.


    ![](img/9c0598183412917c38d5c5bb4b516af7_30_0.png)


    ## PROMPT BOXES


    The JavaScript Prompt box provides a text field in which the visitor to your web
    page can type an answer in response to a question. The box has an OK button, a
    Cancel button, and a text box to hold the response typed by the visitor. The Prompt
    box must be closed by clicking one of the buttons before being able to continue.
    The Prompt box enables you to capture the data typed there and use it elsewhere.
    How this information is subsequently used depends on the requirements of the web
    page and the skill and inventiveness of the author.


    ## THE PROMPT BOX IN ACTION


    - In this typical example, the visitor is invited to type his or her name into
    a field on the Prompt box and click the OK button.

    - The visitor''s name then appears in an on-screen greeting, which remains until
    the OK button is clicked.

    - The web page that then appears in the browser window incorporates the visitor''s
    name within the text. The JavaScript code that makes all this happen can be seen
    on the opposite page.


    ![](img/9c0598183412917c38d5c5bb4b516af7_31_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_31_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_31_2.png)


    ## USING VARIABLES WITH PROMPT BOXES


    - As this code shows, in order to use what your visitor has typed, you need to
    create a variable name. The window.prompt() code captures the visitor''s first
    name for you, but you can only use it if you associate that input with a variable
    name (e.g. vName).

    - The variable can then be placed anywhere on the web page when used in conjunction
    with the document.write() command.


    ```html

    <html>

    <title>WebVerse</title>

    <script language="JavaScript">

    var vName=prompt("What''s your name?","");

    alert("Hi "+vName+" !");

    </script>


    <body>

    <p><img src="images/vv.png" width="128" height="51"></p>

    <p><b>A collection of the finest English poetry.</b></p>

    <p>

    <script language="JavaScript">

    document.write("Welcome to WebVerse " +vName+ ".")

    </script>

    <p>This is an online guide to English poetry, providing links to some of the many
    collections of online verse, literary magazines, poetry discussion sites and so
    on.

    <p> This site mainly exists as an additional resource for a weekly e-mail newsletter
    compiled by a group of enthusiasts here in London. You''ll find plenty to interest
    you on this site, but you''ll find much more information if you subscribe to our
    newsletter

    <p> <a href="subs.htm">Subscribe</a>

    <br>

    </html>

    ```


    Place the variable anywhere on the page


    ## WINDOW.PROMPT SYNTAX


    The prompt method must be used within <script> tags. The first string comprises
    the contents of the pop-up dialog box (usually the question that you are asking
    the visitor). In the code, you define the question exactly as you would for an
    Alert box. With the window.prompt() method, however, you can use an optional second
    text string to determine the text that will appear in the text field. This is
    usually filled with something helpful for the visitor like "Type your reply here,"
    and the visitor can immediately overtype it. If the second string is kept blank
    (i.e. you just use the quotation marks with nothing between them) and the visitor
    clicks OK without typing anything in the text box, nothing will appear in the
    appropriate position on the web page.


    To create a variable in JavaScript, first choose a name for the variable, and
    then state what that variable name represents, using the following syntax:

    var yourVariableName = value. You can pick any name you choose for a variable,
    but it is more helpful to give it a descriptive name that shows what it contains.


    ```javascript

    window.prompt("first string","second string");

    ```


    ## CONFIRM BOXES


    Confirm boxes are essentially Alert boxes that offer a choice of two response
    buttons: OK or Cancel (which is the same as Yes or No). There is very little point
    in using the window.confirm() method unless you can do something useful with the
    response typed by the visitor. To make the most of this OK or Cancel response,
    you need to learn how to use the if...else statement in JavaScript.


    ## USING JUST THE IF... STATEMENT


    - Here is a simple example that shows you can sometimes get the result you want
    merely by using the if clause. Clicking on the subscribe link brings up a Confirm
    box.


    ![](img/9c0598183412917c38d5c5bb4b516af7_33_0.png)


    - The code that controls the Confirm box provides a conditional clause. This determines
    the effect of clicking on the OK button.


    ```html

    <html>

    <head>

    <script language="JavaScript">


    if (confirm("To subscribe to the newsletter click OK."))

    {

    location.href=''subscribe.htm''

    }


    </script>


    </head>

    </html>

    ```


    - If the visitor clicks the OK button, he or she will be taken to the URL defined
    in the line beginning location.href.


    ![](img/9c0598183412917c38d5c5bb4b516af7_33_1.png)


    The visitor is now taken to the defined URL (in this case, the subscription page
    subscribe.htm).


    ![](img/9c0598183412917c38d5c5bb4b516af7_34_0.png)


    However, if the visitor clicks the **Cancel** button, he/she will remain on the
    same page, since no other action has been defined.


    To provide a second option, you need to use the else statement.


    In this example, the else statement is used to define a second URL (in this case,
    **nonsubs.htm**), to which the visitor will be sent if he or she clicks the Cancel
    button.


    ![](img/9c0598183412917c38d5c5bb4b516af7_34_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_34_2.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_34_3.png)'
