  md: '# REVIEWING AND EDITING


    You will regularly want to review your code as you go along. To do this, you will
    need to have both Notepad, containing the HTML document you are editing, and your
    web browser, containing the same HTML document, open at the same time.


    # OPENING THE SOURCE CODE


    +   - To open the source code of a web page (this includes your HTML documents
    stored on your hard disk), open the file in your web browser and choose Source
    from the View menu.

