  - '[PAGE 59]


    # ERROR WARNINGS IN INTERNET EXPLORER


    If you are not seeing the kind of JavaScript error warning box described on these
    pages, perhaps this feature is inactive in your copy of Internet Explorer. If
    that is the case, turn it on right away. It may not be everything you need, but
    it can prove invaluable in sending you to the area of your script that is going
    wrong.


    # ACTIVATING ERROR NOTIFICATION


    +   - Choose **Internet Options** from the Tools menu of Internet Explorer.


    ![](img/9c0598183412917c38d5c5bb4b516af7_59_0.png)


    +   - Click the **Advanced** tab.

    - Place a check mark in the box next to **Display a notification about every script
    error**.


    ![](img/9c0598183412917c38d5c5bb4b516af7_59_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_59_2.png)'
  - '[PAGE 60]


    Once you have carried out these steps, click on the OK button.


    ![](img/9c0598183412917c38d5c5bb4b516af7_60_0.png)


    # Common Errors in JavaScript Code


    The two main types of error in JavaScript are known as syntax errors and runtime
    errors. This usually means that you have either mistyped or omitted something.
    Syntax errors often involve mistyped quotation marks or parentheses. Runtime errors
    are often caused by misspelled commands. Both kinds of errors will cause your
    web pages to behave erratically, or they will stop loading in the browser.


    # A WORKING EXAMPLE


    Here we see source code for a web page that uses a simple level of interactivity.
    The JavaScript code consists of just a few lines: a function within the document''s
    <head> tags and an onClick event handler within the document''s <body> tags.


    ```

    <html>

    <head>

    <script language="JavaScript">

    function whatYear()

    {

    var n=prompt("What year is it?");

    confirm("It is really now "+n+" and we still haven''t returned to the moon?");

    }

    </script>

    </head>

    <body>

    <form>

    <input type="button" value="Answer me this..." onClick="whatYear()">

    </form>

    </body>

    </html>

    ```


    The web page invites the user to click on the Answer me this button.


    ![](img/9c0598183412917c38d5c5bb4b516af7_60_1.png)'
  - '[PAGE 61]


    +   - Clicking on the button causes a prompt box to appear, asking a question.
    The user keys the answer into the field below.

    - The user''s input is then output as part of the text that appears in an alert
    box that pops up.

    - We will now introduce some deliberate errors and look at the resulting error
    messages provided by the web browser.


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_1.png)


    # ROGUE PARENTHESES AND BRACKETS


    +   - Opened parentheses and brackets that are not closed later on can be a major
    cause of script failure. This example shows a curly bracket in the last line that
    is closed but was never opened!

    - Netscape Navigator recognizes that there is an error and tells you how to find
    out more.

    - The error message explicitly states that the curly bracket has been omitted
    from its expected position before the body of the function, and the cursor line
    in the code shows where it should be.


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_2.png)


    To view JavaScript error messages in Netscape Navigator (v4.75), follow the instructions
    in the browser''s status bar


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_3.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_4.png)'
  - '[PAGE 62]


    # ROGUE QUOTATION MARKS


    +   - Quotation marks also work in pairs. Confusion can be caused by apostrophes.
    Internet Explorer thinks the error here is the absence of a closing parenthesis,
    but in fact it is interpreting the apostrophe in haven''t as a closing single
    quotation mark and so it expects a closing parenthesis after it.

    - The best solution is to use double quotation marks if you are going to use any
    apostrophes, or you can sidestep the issue by avoiding contractions.


    ![](img/9c0598183412917c38d5c5bb4b516af7_62_0.png)


    # THE CASES IN QUESTION


    +   - If you can''t seem to detect that troublesome bug, make sure that all case-sensitive
    words match exactly, especially in functions and variables since these are words
    you have defined yourself. The problem here is very clearly stated by the Opera
    web browser. The function "whatYear" is defined, but the browser has never heard
    of the variable "whatyear," and it tells you so in its error message.


    ![](img/9c0598183412917c38d5c5bb4b516af7_62_1.png)'
