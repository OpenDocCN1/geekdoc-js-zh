  md: '# # WRITING JAVASCRIPT IN NOTEPAD


    You don''t need any special software to write JavaScript. In fact, when you are
    starting out, it is best to use the simplest text editor at your disposal. Notepad,
    which is supplied with Windows 98, provides a good, no-frills tool. Whatever editor
    you use, you need to save your scripts in "text only" format. In this way, if
    you copy-and-paste JavaScript code from a saved file, you can guarantee you will
    not be copying hidden code placed there by the word-processing program.


    # ## 1 WRITING IN NOTEPAD


    +   - Using Notepad, you can write JavaScript directly into HTML documents, or
    you can write the JavaScript separately, save the file, and then copy and paste
    the script into an HTML document later.

    - Here we are writing two scripts in a new Notepad document, making sure to give
    each script a brief descriptive heading that will help us identify it later.


    ![](img/9c0598183412917c38d5c5bb4b516af7_19_0.png)


    # ## 2 SAVING THE DOCUMENT


    +   - Once the scripts are complete, save the document into a suitably named folder.

    - If you are creating an HTML document including JavaScript, remember to save
    it as an HTML document with either a **.htm** or **.html** extension.


    ![](img/9c0598183412917c38d5c5bb4b516af7_19_1.png)'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# ## 3 COPY AND PASTE THE SCRIPT


    +   - When you are ready to embed the code in an HTML document, simply open the
    file in Notepad, highlight the script that you want, as shown here, and then copy
    it into the relevant part of the web page HTML code.


    ![](img/9c0598183412917c38d5c5bb4b516af7_20_0.png)


    # # USEFUL SCRIPTING TOOLS


    Nearly all the examples of JavaScript in this book have been created by keying
    the code in Notepad, but there is nothing to stop you from using several different
    web building and script editing programs to produce your JavaScript code. Remember,
    you can always read the JavaScript code produced in any of these programs, so
    you can learn from the techniques they employ and make them your own.


    # ### WYSIWYG HTML PACKAGES


    +   - You can find many sophisticated menu-driven HTML design packages, such as
    Macromedia''s Dreamweaver, Microsoft''s FrontPage, and others, that will help
    simplify the process of creating JavaScript. These packages can automatically
    generate a wide range of JavaScript effects, such as rollover images 🖼.


    ![](img/9c0598183412917c38d5c5bb4b516af7_20_1.png)


    *This Dreamweaver dialog box simplifies the creation and placement of rollover
    images.*'
