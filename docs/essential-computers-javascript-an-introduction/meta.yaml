    # # POP-UP BOXES


    One of the easiest ways to enliven your web pages and directly involve any visitors
    to your site is to use JavaScript''s Alert, Confirm, and Prompt pop-up dialog
    boxes.


    # # JAVASCRIPT DIALOG BOXES


    The three kinds of JavaScript dialog boxes share one important characteristic.
    Once any one of them has popped up on-screen, all activity within the web page
    is frozen until an appropriate button in the dialog box is clicked. For example,
    once an Alert box has popped up, everything freezes until the OK button has been
    clicked. On-screen Alert boxes cannot be sent to the back of the browser window.
    Nor can you click within the main part of the browser window when an Alert box
    is displayed. The only possible action is to click the OK button in the box. This
    same suspension of activity holds true for the Confirm and Prompt boxes.


    +   ## THE JAVASCRIPT POP-UP BOXES

    * The Alert box 📄 is the simplest kind of box, and it is used mainly to capture
    the attention of the visitor.

    * The Confirm box 📄 is also used in this way, but has a Cancel button so that
    the visitor also has the choice of refusing an option.

    * The Prompt box 📄 takes the process one stage further by prompting the visitor
    to input information of some kind.


    ![](img/9c0598183412917c38d5c5bb4b516af7_29_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_29_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_29_2.png)


    27 Alert Boxes   28 Prompt Boxes   30 Confirm Boxes'
  - '[PAGE 30]


    # THE CASE IN QUESTION


    If you have wondered why capital letters are found throughout the variables, functions,
    and other names used in JavaScript, the simple answer is convention. It doesn''t
    matter whether you use the spelling myvariable, MyVariable, or myVARIABLE, but
    the way in which you spell it in the main body of the document should then match
    the case exactly, or your code may fail. For that reason, most people tend to
    use lower-case for functions and variables, reserving upper-case for the initial
    letter of subsequent words within the name, for example, myVariable.


    # ALERT BOXES


    The alert method is used mainly to catch the visitor''s attention. For example,
    one line of JavaScript can create a simple welcome announcement. An Alert box
    can also announce the results of more complicated JavaScript detection scripts,
    such as detecting whether the visitor has all the plug-ins necessary to view your
    site. You can choose to make any complex announcement that you like, but the code
    for launching the Alert box is very straightforward, as this example shows.


    # A WELCOMING ALERT BOX


    +   - This example shows how to produce an Alert box that welcomes visitors to
    the "WebVerse" site. Whatever the content, the syntax works just the same.

    - The status bar shows that the appearance of the Alert box has frozen the loading
    of the web page. As the window.alert code is in the head, the page will not load
    further until the OK button has been clicked.


    ![](img/9c0598183412917c38d5c5bb4b516af7_30_0.png)'
  - '[PAGE 31]


    # PROMPT BOXES


    The JavaScript Prompt box provides a text field in which the visitor to your web
    page can type an answer in response to a question. The box has an OK button, a
    Cancel button, and a text box to hold the response typed by the visitor. The Prompt
    box must be closed by clicking one of the buttons before being able to continue.
    The Prompt box enables you to capture the data typed there and use it elsewhere.
    How this information is subsequently used depends on the requirements of the web
    page and the skill and inventiveness of the author.


    # THE PROMPT BOX IN ACTION


    +   - In this typical example, the visitor is invited to type his or her name
    into a field on the Prompt box and click the OK button.

    - The visitor''s name then appears in an on-screen greeting, which remains until
    the OK button is clicked.

    - The web page that then appears in the browser window incorporates the visitor''s
    name within the text. The JavaScript code that makes all this happen can be seen
    on the opposite page.


    ![](img/9c0598183412917c38d5c5bb4b516af7_31_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_31_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_31_2.png)'
