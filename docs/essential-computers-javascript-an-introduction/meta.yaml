    试试使用这些顶级搜索引擎之一进行搜索


    这两段代码指定了当鼠标光标移过文本超链接时状态栏中显示的文本（见上文）


    ## JAVASCRIPT 基础


    认识到将 JavaScript 代码块放在 HTML 文档中的什么位置，是你第一次学习这门语言时需要了解的首要事项之一。


    ### 识别 JAVASCRIPT


    JavaScript 代码行需要与 HTML 代码区分开来。如果你查看任何包含 JavaScript 的 HTML 文档的源代码，JavaScript 代码最容易通过包含在
    `<script>` 标签中来识别。


    #### 使用 `<script>` 标签


    ![](img/9c0598183412917c38d5c5bb4b516af7_15_0.png)


    - 当代码放置在 `<script>` 和 `</script>` 标签之间时，大多数浏览器会假定其中的代码作为 JavaScript 来读取。

    - 大多数浏览器默认将 JavaScript 作为脚本语言，但也可以在这些标签中使用其他脚本语言（例如 VBScript）。因此，建议指明所使用的编程语言，在本例中，通过将第一个标签写为
    `<script language="JavaScript">` 来实现。


    #### 在任何地方嵌入 JAVASCRIPT


    当被 `<script>` 标签包围时，JavaScript 可以嵌入到 HTML 文档的任何位置（只要不违反 HTML 规则），并且可以按需多次嵌入。如果脚本与页面上的某个按钮相关，你可以将代码放在页面上该
    HTML 块的旁边。不过，大多数情况下，JavaScript 会被放在文档的 `<head>` 部分。这在涉及函数时尤其如此。

