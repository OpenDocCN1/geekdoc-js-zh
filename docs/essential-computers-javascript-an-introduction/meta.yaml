  md: '# 40 • MOUSEOVERS


    # MAKING THE IMAGE A LIVE HYPERLINK


    To keep things simple, in this example we have used a dead link (#) for the image.
    If anyone clicks on the image, nothing will happen. Placing a live link here is
    simply a matter of replacing # with the appropriate URL.


    ![](img/9c0598183412917c38d5c5bb4b516af7_43_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_43_1.png)


    The name tag

    It helps to think of the area on the page identified by the name tag as the space
    that the image occupies. The files on.jpg and off.jpg will occupy the space called
    image, depending on the cursor''s action.


    # PRELOADING IMAGES


    You can use JavaScript to preload images. This means that while your web page
    is first loading in the visitor''s browser window, you can send the specified
    images to the browser cache, a folder on your computer that stores recently accessed
    web pages. If a web page is cached here, the browser can access it much more quickly
    than from a remote server. Certain images required for rollovers are not visible
    when the page has loaded. These are the images that can be usefully preloaded
    into the cache, so that they really spring into life when needed rather than being
    subject to the slight delay that usually happens while they are being downloaded
    from the web.


    # PRELOADING ON.JPG


    The code to make on.jpg appear, when we rollover off.jpg, goes into the body of
    the web page, but the code for preloading on.jpg goes into the <head> tags within
    script tags.


    ```

    <head>

    <script language="JavaScript">

    Image1=new Image(20,20)

    Image1.src="on.jpg"

    </script>

    </head>

    ```'
