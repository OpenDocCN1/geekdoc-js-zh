    ## WINDOW.CONFIRM SYNTAX


    The window.confirm() statement produces a pop-up window that offers the visitor
    a choice of actions. He or she can choose to accept a course of action by clicking
    the OK button, or reject it by clicking the Cancel button. The choice presented
    to the visitor is composed of the text you have typed between the brackets within
    quotation marks. Clicking OK takes the visitor to the location defined in the
    code. The use of the else... clause can be used to direct the visitor to an alternative
    page (rather than back to the original) if he or she clicks Cancel.


    ```

    window.confirm("Place text to go in confirm box here.")

    ```


    ## SOME JAVASCRIPT TERMINOLOGY


    If you want to take your web page authoring skills beyond simple coding and communicate
    with other authors, you will need to understand the "hierarchy" on which JavaScript
    is built; this includes understanding the relationships of the three principal
    concepts of "object," "property," and "method." These examples show only a few
    of the properties and methods relating to the window object, but the principles
    apply to all JavaScript objects, properties, and methods.


    ### OBJECT


    • An object in JavaScript is an entity that can usually be broken down into sub-categories
    or parts. It can also have things done to it, or be acted upon. Objects include
    window, form, image, and button.


    ![](img/9c0598183412917c38d5c5bb4b516af7_36_0.png)


    > *In grammatical terms, an object is the JavaScript equivalent of a noun*


    ### PROPERTY


    • A property in JavaScript is a quality that helps define an object – by providing
    a subcategory, or by describing a noun. The properties of an image, for example,
    are its name, border, height, and width.


    ![](img/9c0598183412917c38d5c5bb4b516af7_36_1.png)


    > *In JavaScript code, a property immediately follows the object it defines, separated
    by a period*


    ### METHOD


    • A method describes an action that can be applied to an object. In this chapter,
    the alert, confirm, and prompt methods of the window object are described.


    ![](img/9c0598183412917c38d5c5bb4b516af7_36_2.png)


    > *In JavaScript, the method acts on an object in the way that a verb acts on
    a noun*


    ## MOUSEOVERS


    Mouseover describes certain activities within the browser window that occur as
    a direct result of the movement of the mouse cursor or the clicking of the mouse
    button.


    ### FUNCTIONS OF THE STATUS BAR


    The text that appears in the web browser''s status bar can provide useful information
    when you are viewing web pages. The changes in the contents of the status bar
    are often triggered by the movement and action of the mouse cursor.


    #### THE STATUS BAR


    • The status bar is at the bottom of the web browser window. Text in the status
    bar can change according to an activity currently taking place or that has just
    taken place in the browser window.


    • For example, the text in the status bar will tell you that a web page is opening
    and will give you the URL of that site, as this example demonstrates.


    • The status bar also tells you when a document has loaded by displaying the word
    Done.


    ![](img/9c0598183412917c38d5c5bb4b516af7_37_0.png)


    The status bar shows the URL of the document being loaded


    ![](img/9c0598183412917c38d5c5bb4b516af7_37_1.png)


    Done appears when the document has been loaded


    • It also reveals the URL of a link when the mouse is moved over the hyperlink
    text or image, but as we will see below, the URL may not always be the most useful
    piece of information. This is where JavaScript can help.


    ![](img/9c0598183412917c38d5c5bb4b516af7_38_0.png)


    ## MAKING MORE OF THE STATUS BAR


    By using JavaScript to define the **window.status** property, you can use the
    status bar to provide useful information when the mouse cursor is held over a
    hyperlink. This can make your web pages more interesting and dynamic.


    ## USING ONMOUSEOVER


    • In the example shown here, the URL contained in this hyperlink (as it appears
    between the `<a href>` and `</a>` tags of the HTML code for the web page) will
    appear in the status bar by default when the mouse cursor is held over the hyperlinked
    text.


    ![](img/9c0598183412917c38d5c5bb4b516af7_38_1.png)


    • Although the URL is fictional, its length is typical of many web pages, and
    because of its length only part of it is visible in the status bar.


    ![](img/9c0598183412917c38d5c5bb4b516af7_38_2.png)


    # 36 · MOUSEOVERS


    • This information, which will not even fit in the status bar, does very little.
    However, it is possible to use window.status to make useful and interesting text
    appear in the status bar when the mouse is over the hyperlink.


    ![](img/9c0598183412917c38d5c5bb4b516af7_39_0.png)


    • The onMouseOver code in this example causes the text "William Shakespeare 1564-1616"
    to appear in the status bar when the mouse moves over the William Shakespeare
    hyperlink.


    ![](img/9c0598183412917c38d5c5bb4b516af7_39_1.png)


    • However, the new status bar text remains even after the mouse is moved away
    from the hyperlink. This can be changed by using onMouseOut.


    ![](img/9c0598183412917c38d5c5bb4b516af7_39_2.png)


    ## ONMOUSEOVER SYNTAX


    This code will cause the text within single quotes to appear in the status bar
    when the mouse moves over the hyperlink. It will remain there until the page is
    reloaded or the mouse moves over another hyperlink. The onMouseOut event handler
    can be used to remove this status bar text.


    ![](img/9c0598183412917c38d5c5bb4b516af7_39_3.png)


    Using onMouseOut


    ## USING ONMOUSEOUT


    • This code (line 6 in the code shown below) causes the text string within the
    single quote marks (i.e., nothing) to appear in the status bar when the mouse
    is moved off the hyperlink.


    ```

    <html>

    <h4>Welcome to WebVerSE: a collection of the finest English poetry</h4><p>

    <b>Renaissance section</b></p>

    <a href="http://www.unmemorable_url.com/poetry/english/renaissance/ws.htm"

    onMouseOver="window.status=''William Shakespeare 1564-1616'';return true"

    onMouseOut="window.status='''';return true">William Shakespeare </a></p>

    </html>

    ```


    • When the mouse is moved over the hyperlink the text defined in the onMouseOver
    code appears in the status bar, as it did before.


    ![](img/9c0598183412917c38d5c5bb4b516af7_40_0.png)


    • Now, however, when the mouse is moved off the hyperlink, the text in the status
    bar disappears. If a text string had been placed between the single quotation
    marks, this would now appear in the status bar.


    ![](img/9c0598183412917c38d5c5bb4b516af7_40_1.png)


    ## ONMOUSEOUT SYNTAX


    When used in conjunction with the onMouseOver code, the onMouseOut code will cause
    the text within single quotes to appear in the status bar when the mouse moves
    over the hyperlink. Because nothing appears between the single quotes in the example
    on this page, the text disappears and nothing appears in its place.


    ```

    onMouseOut="window.status='''';return true"

    ```


    ## DOING IT WITH PICTURES


    The most widely used kind of mouseover involves image swapping. The examples over
