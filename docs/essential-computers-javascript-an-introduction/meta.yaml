- md: ' ## ERROR WARNINGS IN INTERNET EXPLORER


    If you are not seeing the kind of JavaScript error warning box described on these
    pages, perhaps this feature is inactive in your copy of Internet Explorer. If
    that is the case, turn it on right away. It may not be everything you need, but
    it can prove invaluable in sending you to the area of your script that is going
    wrong.


    ## ACTIVATING ERROR NOTIFICATION


    - Choose **Internet Options** from the Tools menu of Internet Explorer.


    ![](img/9c0598183412917c38d5c5bb4b516af7_59_0.png)


    - Click the **Advanced** tab.

    - Place a check mark in the box next to **Display a notification about every script
    error**.


    ![](img/9c0598183412917c38d5c5bb4b516af7_59_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_59_2.png)


    Once you have carried out these steps, click on the OK button.


    ![](img/9c0598183412917c38d5c5bb4b516af7_60_0.png)


    ## Common Errors in JavaScript Code


    The two main types of error in JavaScript are known as syntax errors and runtime
    errors. This usually means that you have either mistyped or omitted something.
    Syntax errors often involve mistyped quotation marks or parentheses. Runtime errors
    are often caused by misspelled commands. Both kinds of errors will cause your
    web pages to behave erratically, or they will stop loading in the browser.


    ## A WORKING EXAMPLE


    Here we see source code for a web page that uses a simple level of interactivity.
    The JavaScript code consists of just a few lines: a function within the document''s
    `<head>` tags and an onClick event handler within the document''s `<body>` tags.


    ```

    <html>

    <head>

    <script language="JavaScript">

    function whatYear()

    {

    var n=prompt("What year is it?");

    confirm("It is really now "+n+" and we still haven''t returned to the moon?");

    }

    </script>

    </head>

    <body>

    <form>

    <input type="button" value="Answer me this..." onClick="whatYear()">

    </form>

    </body>

    </html>

    ```


    The web page invites the user to click on the Answer me this button.


    ![](img/9c0598183412917c38d5c5bb4b516af7_60_1.png)


    - Clicking on the button causes a prompt box to appear, asking a question. The
    user keys the answer into the field below.

    - The user''s input is then output as part of the text that appears in an alert
    box that pops up.

    - We will now introduce some deliberate errors and look at the resulting error
    messages provided by the web browser.


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_1.png)


    ## ROGUE PARENTHESES AND BRACKETS


    - Opened parentheses and brackets that are not closed later on can be a major
    cause of script failure. This example shows a curly bracket in the last line that
    is closed but was never opened!

    - Netscape Navigator recognizes that there is an error and tells you how to find
    out more.

    - The error message explicitly states that the curly bracket has been omitted
    from its expected position before the body of the function, and the cursor line
    in the code shows where it should be.


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_2.png)


    To view JavaScript error messages in Netscape Navigator (v4.75), follow the instructions
    in the browser''s status bar


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_3.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_61_4.png)


    ## ROGUE QUOTATION MARKS


    - Quotation marks also work in pairs. Confusion can be caused by apostrophes.
    Internet Explorer thinks the error here is the absence of a closing parenthesis,
    but in fact it is interpreting the apostrophe in haven''t as a closing single
    quotation mark and so it expects a closing parenthesis after it.

    - The best solution is to use double quotation marks if you are going to use any
    apostrophes, or you can sidestep the issue by avoiding contractions.


    ![](img/9c0598183412917c38d5c5bb4b516af7_62_0.png)


    ## THE CASES IN QUESTION


    - If you can''t seem to detect that troublesome bug, make sure that all case-sensitive
    words match exactly, especially in functions and variables since these are words
    you have defined yourself. The problem here is very clearly stated by the Opera
    web browser. The function "whatYear" is defined, but the browser has never heard
    of the variable "whatyear," and it tells you so in its error message.


    ![](img/9c0598183412917c38d5c5bb4b516af7_62_1.png)


    ## AUTOMATED SCRIPTING


    So far we have looked at using a simple text editor, such as Notepad, to write
    JavaScript code as a script or directly into an HTML document. There are alternatives...


    ## SOFTWARE: SCRIPT EDITORS


    If you are likely to do much scripting, you may find it helpful to use software
    that works like a kind of enhanced text editor. Such programs take some of the
    routine keyboard work out of scripting, but still leave you in control of what
    you produce. You can find plenty of programs of this kind on software download
    sites such as Tucows at www.tucows.com or Winfiles at www.winfiles.com.


    ## USING SCRIBBLER 2000


    This example features a shareware program called Scribbler 2000 by Cream Software,
    which can be found at www.creamsoft.com/scribbler. The program produces code that
    is almost identical (and equally effective) to any coded-by-hand, Notepad-produced
    examples shown in this book so far. The example here shows how to use Scribbler
    2000 to produce the kind of new window that was created in Chapter 6.


    ## A NEW WINDOW IN SCRIBBLER 2000


    - With the program installed and open on your PC, choose Open new window from
    the Script drop-down menu.


    ![](img/9c0598183412917c38d5c5bb4b516af7_63_0.png)


    - In the New window settings dialog box, choose all the features you require the
    new window to have by defining the dimensions in the **Width** and **Height**
    boxes, and by placing a check mark in the appropriate **Settings** boxes.

    - Finally, click on the OK button.


    ![](img/9c0598183412917c38d5c5bb4b516af7_64_0.png)


    When you have defined the features of the new window, the program generates the
    JavaScript code in the two windows at right. The top window is for any code that
    you need to place within the `<head>` tags of the HTML document. The lower window
    is for code you need to place in the `<body>` tags of the same document.


    - Click the Copy to Clipboard button to copy the relevant script to the clipboard
    for transfer into your HTML document.


    ![](img/9c0598183412917c38d5c5bb4b516af7_64_1.png)


    ## Microsoft''s FrontPage Express


    FrontPage Express is Microsoft''s free web page editor that enables you to create
    and format web pages in an easy-to-use WYSIWYG (what you see is what you get)
    layout. It offers many of the features available in the full versions of FrontPage
    Editor and FrontPage Explorer, including the capability to insert JavaScript code.


    ## ADDING YOUR OWN JAVASCRIPT CODE


    - To add your own JavaScript code to an HTML document that you are creating using
    FrontPage Express, first choose Script from the Insert menu. The Script dialog
    box will appear.


    ![](img/9c0598183412917c38d5c5bb4b516af7_65_0.png)


    - In the Script dialog box, click on the JavaScript radio button in the Language
    panel. Then type your code in the code box below and click on OK. There is no
    need to surround the code with `<script>` tags.


    ![](img/9c0598183412917c38d5c5bb4b516af7_65_1.png)


    - The JavaScript code you have inserted into the HTML will now appear as a symbol
    on the page.


    ![](img/9c0598183412917c38d5c5bb4b516af7_66_0.png)


    - To see the HTML source code, choose HTML from the View menu.


    ![](img/9c0598183412917c38d5c5bb4b516af7_66_1.png)


    ## REVISING YOUR JAVASCRIPT


    You can revise an existing script at any time when you are using Frontpage Express,
    simply by right-clicking the appropriate script icon in the Frontpage Express
    window and choosing Script Properties from the drop-down menu. This will open
    the Script window, revealing your Javascript code (in the Script window). Click
    OK when you have finished revising the script and then save the HTML document
    by choosing Save from the File menu in the main Frontpage Express window.


    ![](img/9c0598183412917c38d5c5bb4b516af7_66_2.png)'
  mdcn: "\n ## INTERNET EXPLORER 中的错误警告\n\n如果看不到这些页面所描述的 JavaScript 错误警告框，那么此功能可能在你的\
    \ Internet Explorer 中处于未激活状态。如果是这种情况，请立即将其开启。它可能不是你所需要的一切，但它在引导你定位脚本出错区域方面可能证明是无价的。\n\
    \n## 激活错误通知\n\n- 在 Internet Explorer 的\"工具\"菜单中选择**Internet 选项**。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_59_0.png)\n\
    \n- 单击**高级**选项卡。\n- 在**显示每个脚本错误的通知**旁边的框中打勾。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_59_1.png)\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_59_2.png)\n\n执行完这些步骤后，单击\"确定\"按钮。\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_60_0.png)\n\n## JavaScript 代码中的常见错误\n\
    \nJavaScript 中的两种主要错误类型被称为语法错误和运行时错误。这通常意味着你要么输入错误，要么遗漏了某些内容。语法错误通常涉及输错的引号或括号。运行时错误通常由拼写错误的命令引起。这两种错误都会导致你的网页行为异常，或者停止在浏览器中加载。\n\
    \n## 一个可用的示例\n\n这里我们看到一个网页的源代码，它使用了简单的交互功能。JavaScript 代码只有几行：文档的`<head>`标签中的一个函数，以及文档的`<body>`标签中的一个\
    \ onClick 事件处理程序。\n\n```\n<html>\n<head>\n<script language=\"JavaScript\">\nfunction\
    \ whatYear()\n{\nvar n=prompt(\"What year is it?\");\nconfirm(\"It is really now\
    \ \"+n+\" and we still haven't returned to the moon?\");\n}\n</script>\n</head>\n\
    <body>\n<form>\n<input type=\"button\" value=\"Answer me this...\" onClick=\"\
    whatYear()\">\n</form>\n</body>\n</html>\n```\n\n该网页邀请用户单击 *Answer me this* 按钮。\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_60_1.png)\n\n- 单击按钮会弹出一个提示框，询问问题。用户在下方字段中输入答案。\n\
    - 用户的输入随后作为弹出的警告框中的一部分文本输出。\n- 我们现在故意引入一些错误，并查看 Web 浏览器提供的错误消息。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_61_0.png)\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_61_1.png)\n\n## 错位括号和方括号\n\n- 打开的括号和方括号如果没有在之后关闭，可能是脚本失效的主要原因。这个示例显示最后一行有一个闭花括号，但它从未被打开过！\n\
    - Netscape Navigator 识别出存在错误，并告诉你如何了解更多信息。\n- 错误消息明确指出在函数主体之前预期位置遗漏了花括号，代码中的光标行显示了它应该在的位置。\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_61_2.png)\n\n要在 Netscape Navigator（v4.75）中查看\
    \ JavaScript 错误消息，请按照浏览器状态栏中的说明操作\n\n![](img/9c0598183412917c38d5c5bb4b516af7_61_3.png)\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_61_4.png)\n\n## 错位引号\n\n- 引号也是成对工作的。撇号可能会引起混淆。Internet\
    \ Explorer 认为这里的错误是缺少右括号，但实际上它将 *haven't* 中的撇号解释为右单引号，因此期望在其后有一个右括号。\n- 最佳的解决方案是如果你要使用任何撇号，就使用双引号，或者你可以通过避免使用缩略形式来回避这个问题。\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_62_0.png)\n\n## 大小写问题\n\n- 如果你似乎无法发现那个麻烦的\
    \ bug，请确保所有区分大小写的单词完全匹配，尤其是在函数和变量中，因为这些都是你自己定义的单词。Opera Web 浏览器非常清楚地说明了这里的问题。函数\
    \ *whatYear* 已定义，但浏览器从未听说过变量 *whatyear*，它在错误消息中告诉了你这一点。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_62_1.png)\n\
    \n## 自动化脚本编写\n\n到目前为止，我们已经研究了使用简单的文本编辑器（如记事本）来编写 JavaScript 代码作为脚本或直接写入 HTML 文档。还有其他的选择……\n\
    \n## 软件：脚本编辑器\n\n如果你可能会进行大量脚本编写，你可能会发现使用类似增强型文本编辑器的软件会有所帮助。这类程序可以减少一些脚本编写的常规键盘工作，但仍由你控制所生成的内容。你可以在软件下载网站上找到很多这类程序，例如\
    \ Tucows（www.tucows.com）或 Winfiles（www.winfiles.com）。\n\n## 使用 SCRIBBLER 2000\n\
    \n此示例介绍了一款名为 Scribbler 2000 的共享软件，由 Cream Software 开发，可在 www.creamsoft.com/scribbler\
    \ 找到。该程序生成的代码与本书迄今为止展示的任何手写、记事本生成的示例几乎相同（且同样有效）。这里的示例展示了如何使用 Scribbler 2000 生成第\
    \ 6 章中创建的那种新窗口。\n\n## SCRIBBLER 2000 中的新窗口\n\n- 在 PC 上安装并打开该程序后，从\"脚本\"下拉菜单中选择\"\
    打开新窗口\"。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_63_0.png)\n\n- 在\"新窗口设置\"\
    对话框中，通过在**宽度**和**高度**框中定义尺寸，以及在适当的**设置**框中打勾，选择你希望新窗口具备的所有功能。\n- 最后，单击\"确定\"按钮。\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_64_0.png)\n\n定义了新窗口的功能后，程序会在右侧的两个窗口中生成\
    \ JavaScript 代码。上方窗口用于需要放置在 HTML 文档的`<head>`标签内的任何代码。下方窗口用于需要放置在同一文档的`<body>`标签中的代码。\n\
    \n- 单击\"复制到剪贴板\"按钮将相关脚本复制到剪贴板，以便传输到你的 HTML 文档中。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_64_1.png)\n\
    \n## Microsoft 的 FrontPage Express\n\nFrontPage Express 是 Microsoft 的免费网页编辑器，使你能够在易于使用的\
    \ WYSIWYG（所见即所得）布局中创建和格式化网页。它提供了 FrontPage Editor 和 FrontPage Explorer 完整版本中的许多功能，包括插入\
    \ JavaScript 代码的功能。\n\n## 添加你自己的 JavaScript 代码\n\n- 要在使用 FrontPage Express 创建的\
    \ HTML 文档中添加你自己的 JavaScript 代码，首先从\"插入\"菜单中选择\"脚本\"。将弹出\"脚本\"对话框。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_65_0.png)\n\
    \n- 在\"脚本\"对话框中，单击\"语言\"面板中的 JavaScript 单选按钮。然后在下方的代码框中输入你的代码并单击\"确定\"。无需用`<script>`标签包围代码。\n\
    \n![](img/9c0598183412917c38d5c5bb4b516af7_65_1.png)\n\n- 你插入到 HTML 中的 JavaScript\
    \ 代码现在将以符号形式显示在页面上。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_66_0.png)\n\n\
    - 要查看 HTML 源代码，从\"视图\"菜单中选择\"HTML\"。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_66_1.png)\n\
    \n## 修改你的 JavaScript\n\n在使用 FrontPage Express 时，你可以随时修改现有脚本，只需在 FrontPage Express\
    \ 窗口中右键单击适当的脚本图标，然后从下拉菜单中选择\"脚本属性\"。这将打开\"脚本\"窗口，显示你的 JavaScript 代码（在\"脚本\"窗口中）。完成脚本修改后单击\"\
    确定\"，然后通过从主 FrontPage Express 窗口的\"文件\"菜单中选择\"保存\"来保存 HTML 文档。\n\n![](img/9c0598183412917c38d5c5bb4b516af7_66_2.png)\n"
