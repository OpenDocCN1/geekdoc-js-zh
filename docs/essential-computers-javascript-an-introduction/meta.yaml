    框必须通过点击其中一个按钮来关闭，然后才能继续操作。Prompt 框使你能够捕获在那里输入的数据并在其他地方使用。这些信息随后如何使用，取决于网页的需求以及作者的技能和创意。


    ## 提示框的实际应用


