    ## 一些 JavaScript 术语


    如果您希望将网页制作技能提升到简单编码之外，并与其他作者交流，您需要理解 JavaScript 构建所基于的“层次结构”；这包括理解“对象”、“属性”和“方法”这三个主要概念之间的关系。这些示例仅展示了与窗口对象相关的一些属性和方法，但其原理适用于所有
    JavaScript 对象、属性和方法。


    ### 对象


    • JavaScript 中的对象是一个通常可以细分为子类别或部分的实体。它也可以被施加操作，或作为操作的对象。对象包括窗口、表单、图像和按钮。


