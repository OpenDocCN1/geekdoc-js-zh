  - '[PAGE 15]


    # # JAVASCRIPT BASICS


    Recognizing where to put blocks of JavaScript code into an HTML document is one
    of the first things you need to know when approaching the language for the first
    time.


    # ## IDENTIFYING JAVASCRIPT


    Lines of JavaScript code need to be identified separately from HTML code. If you
    look at the source code of any HTML document containing JavaScript, the JavaScript
    code is most easily recognized if it is contained within <script> tags.


    ### USING <SCRIPT> TAGS


    ![](img/9c0598183412917c38d5c5bb4b516af7_15_0.png)


    +   - When code is placed between <script> and </script> tags, most browsers assume
    that the enclosed code is to be read as JavaScript.

    - Most browsers take JavaScript to be the default, but other scripts (VBScript,
    for example) can be used within these tags. For this reason it is advisable to
    specify the programming language that is being used, in this case by making the
    first tag `<script language="JavaScript">`.


    > ### EMBED JAVASCRIPT ANYWHERE


    When enclosed within <script> tags, JavaScript can be embedded anywhere in an
    HTML document (as long as it doesn''t conflict with HTML rules), and as many times
    as required. If the script relates to a button on the page, you can place the
    code adjacent to that block of HTML on the page. More often than not, though,
    the JavaScript is placed within the <head> section of the document. This is particularly
    true where functions are concerned.'
- md: '## USING <HEAD> TAGS


    - When you open a web page, the code between the `<head>` tags is loaded before
    the web page is displayed on-screen.

    - In this example, an Alert box containing the words **Welcome to our website**
    pops up before the web page appears on your screen.


    ![](img/9c0598183412917c38d5c5bb4b516af7_16_0.png)


    ## USING A FUNCTION


    - It is not obligatory for any code within `<script>` tags to appear between the
    `<head>` tags of the document, but it is good practice to place this code there
    when using a function (or functions) that you will "call" further down the page.


    ```html

    <SCRIPT language="JavaScript">


    function myFunction()

    {

    ... The JavaScript statements that go to

    ... make up myFunction (or the name you

    ... decide to call that particular function)

    ... go here, between the curly brackets.

    }


    </SCRIPT>

    ```


    ## THE IMPORTANCE OF RECOGNIZING JAVASCRIPT


    The ability to recognize JavaScript code will help you to identify those sections
    of code in other people''s web pages that you can learn from, adapt, and use to
    suit your own website. Also, you sometimes need to modify the JavaScript that
    has been generated using third-party software. Even the best HTML design packages
    can sometimes get themselves into a tangle, leaving you with no other solution
    than to open the source code and debug the script. More often than not, this simply
    involves locating the problem area and removing a duplicate tag. Knowing your
    way around the code will also have obvious benefits when it comes to tracking
    down your own mistakes.


    ## JavaScript Event Handlers


    Some JavaScript code does not need to be placed within `<script>` tags. Usually,
    these instances are known as event handlers. Examples include the commands that
    make events happen when the visitor clicks the mouse or moves the cursor over
    text or an image. Whatever appears in quotes after one of these commands is interpreted
    by the browser as being JavaScript and is handled accordingly.


    ## AN EVENT HANDLER IN ACTION


    - Event handlers are compound words that begin with on, followed by a verb beginning
    with a capital letter. For example: onClick, onChange, onLoad, onSubmit, or onMouseOver.

    - In this example, onUnload is being used to call up an Alert box.


    ```html

    <html>

    <title> Simple example of onUnload at work</title>


    <body onUnload="alert(''Thanks for visiting. Call again soon!'')">

    This simple Web page demonstrates the onUnload event handler at work.


    <p>When you leave this Web page, or quit the Web browser, an alert box will appear
    containing the words you have specified for the alert box.


    <p>Note that you do not need to use "javascript" tags in this example.

    </body>

    </html>

    ```


    - This is the page that contains source code for the JavaScript event handler.
    Event handlers do not require "JavaScript" tags.


    ![](img/9c0598183412917c38d5c5bb4b516af7_17_0.png)


    - When the user leaves the page or quits the browser, the Alert box appears.


    ![](img/9c0598183412917c38d5c5bb4b516af7_17_1.png)


    ## JAVASCRIPT FUNCTIONS


    JavaScript uses a programming tool called a "function" to work more efficiently.
    Once you understand how functions fit into the general plan, you should be able
    to break down a page of code into something that makes sense structurally.


    ## THE PURPOSE OF FUNCTIONS


    - A function is a named series of commands and is usually contained within the
    `<head>` tags.

    - Once a function has been created, you can "call" it as many times as you like
    further down the page by using a single line of code rather than typing a long
    block of code into the body of the HTML.

    - What a function does, and what it is named, is determined by the author.

    - In this case, the function showAA is being used to bring up an appropriate Alert
    box when a button is clicked.

    - Clicking on the Best Actress button causes the function to operate and bring
    up an Alert box containing the words Judy Holliday.


    ![](img/9c0598183412917c38d5c5bb4b516af7_18_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_18_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_18_2.png)


    ## WRITING JAVASCRIPT IN NOTEPAD


    You don''t need any special software to write JavaScript. In fact, when you are
    starting out, it is best to use the simplest text editor at your disposal. Notepad,
    which is supplied with Windows 98, provides a good, no-frills tool. Whatever editor
    you use, you need to save your scripts in "text only" format. In this way, if
    you copy-and-paste JavaScript code from a saved file, you can guarantee you will
    not be copying hidden code placed there by the word-processing program.


    ### 1 WRITING IN NOTEPAD


    - Using Notepad, you can write JavaScript directly into HTML documents, or you
    can write the JavaScript separately, save the file, and then copy and paste the
    script into an HTML document later.

    - Here we are writing two scripts in a new Notepad document, making sure to give
    each script a brief descriptive heading that will help us identify it later.


    ![](img/9c0598183412917c38d5c5bb4b516af7_19_0.png)


    ### 2 SAVING THE DOCUMENT


    - Once the scripts are complete, save the document into a suitably named folder.

    - If you are creating an HTML document including JavaScript, remember to save
    it as an HTML document with either a **.htm** or **.html** extension.


    ![](img/9c0598183412917c38d5c5bb4b516af7_19_1.png)


    ### 3 COPY AND PASTE THE SCRIPT


    - When you are ready to embed the code in an HTML document, simply open the file
    in Notepad, highlight the script that you want, as shown here, and then copy it
    into the relevant part of the web page HTML code.


    ![](img/9c0598183412917c38d5c5bb4b516af7_20_0.png)


    ## USEFUL SCRIPTING TOOLS


    Nearly all the examples of JavaScript in this book have been created by keying
    the code in Notepad, but there is nothing to stop you from using several different
    web building and script editing programs to produce your JavaScript code. Remember,
    you can always read the JavaScript code produced in any of these programs, so
    you can learn from the techniques they employ and make them your own.


    ### WYSIWYG HTML PACKAGES


    - You can find many sophisticated menu-driven HTML design packages, such as Macromedia''s
    Dreamweaver, Microsoft''s FrontPage, and others, that will help simplify the process
    of creating JavaScript. These packages can automatically generate a wide range
    of JavaScript effects, such as rollover images.


    ![](img/9c0598183412917c38d5c5bb4b516af7_20_1.png)


    *This Dreamweaver dialog box simplifies the creation and placement of rollover
    images.*


    ## JAVASCRIPT EDITORS


    Some excellent JavaScript editing programs, available as shareware and freeware,
    provide shortcuts to various common coding tasks. For example, several programs
    allow you to highlight a block of text and choose a menu item, and the necessary
    code is then generated automatically for you, saving a good deal of routine work
    on the keyboard.


    ### STJS MENUMAKER


    - STJS Menumaker is a good example. It is an easy-to-use freeware program that
    generates JavaScript drop-down menus. For more detail, see the author''s site
    (www.comwell.se/samuel/software) and follow the links.


    ![](img/9c0598183412917c38d5c5bb4b516af7_21_0.png)


    - Here we have typed the names and URLs that will produce a drop-down menu of
    Mediterranean islands.


    - Once you have clicked the **Make** button, a new web page is produced containing
    the drop-down menu you have just specified.


    ![](img/9c0598183412917c38d5c5bb4b516af7_21_1.png)


    The list here corresponds to the contents of the Menu Item box in the previous
    screen.


    ## REVIEWING AND EDITING


    You will regularly want to review your code as you go along. To do this, you will
    need to have both Notepad, containing the HTML document you are editing, and your
    web browser, containing the same HTML document, open at the same time.


    ### OPENING THE SOURCE CODE


    - To open the source code of a web page (this includes your HTML documents stored
    on your hard disk), open the file in your web browser and choose Source from the
    View menu.

    - By default, Notepad will open, displaying the HTML document as a text file.


    ![](img/9c0598183412917c38d5c5bb4b516af7_22_0.png)


    - With the web page open in the background, edit the text document. To monitor
    the effect of your editing on the web page, first choose Save from the File menu
    in Notepad.

    - Now bring the web browser window to the front, click on the Refresh button,
    and review the changes.

    - This is a very useful way of working because you can identify any problems as
    they arise, thereby saving a lot of time debugging your script later.


    ![](img/9c0598183412917c38d5c5bb4b516af7_22_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_22_2.png)


