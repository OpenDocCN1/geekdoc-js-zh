- md: '## CLOSING A SECONDARY WINDOW


    One of the main uses of a window without a menubar is as an "info box" – a pop-up
    window providing material that is meant to be read and closed. While the visitor
    can close the window by clicking the close [x] box in the top right of this mini-window,
    it is neater if you provide a "close" link or button as part of the page.


    ## THE CLOSE COMMAND


    - To trigger the window close command, you will generally use the same technique
    that you employed to open it; i.e., a text hyperlink or a button.

    - You then embed the close command into the material that is loaded into the new
    window. So, if you are loading a new document (e.g., 18.htm), the window.close
    command must appear in the appropriate position on that page.


    ```

    But thy eternal summer shall not fade.<br>

    Nor lose possession of that fair ow''st.<br>

    Nor shall death brag thou wander''st in his shade.<br>

    When in eternal lines to time thou grow''st.<br>

    So long as men can breathe, or eyes can see.<br>

    So long lives this, and this gives life to thee.</font><br>

    <br>

    <a href="" onClick="self.close()">Close this window</a>


    <html>

    ```


    Place this line of code within the HTML source code where you want it to appear
    on the web page (i.e. at the bottom of the page in the example)


    ![](img/9c0598183412917c38d5c5bb4b516af7_53_0.png)


    ## THE "LINK METHOD"


    To close a new window using a hyperlink, first create a link that goes nowhere!
    To do this, type the quotation marks but leave a blank where the linked document
    or URL would normally appear: `<a href="">`


    Then type the text that will appear on the page as the hyperlink between the >
    < characters, as usual: `<a href="">Close this window</a>`. Then add the JavaScript
    code immediately after the blank quotation marks: `<a href="" onClick="self.close()">Close
    this window</a>`.


    ## HOW DOES THE LINK METHOD WORK?


    When a visitor to this web page clicks the "Close this window" hyperlink, the
    browser attempts to go to the new page. Since there is no page to go to, the browser
    follows the instruction given by the JavaScript code and closes the page. (If
    you try typing a URL between the quote marks, you will see that the hyperlink
    will take you to that URL, overruling the JavaScript instruction).


    ## USING A CLOSE BUTTON


    To use a "Close" button to close the new window, as this example shows, you need
    to place the JavaScript code in the position on the page where you intend for
    the button to appear. The obvious place in this example would seem to be the bottom
    of the page, so the code can be placed immediately before the closing </html>
    tag.


    ```

    Nor lose possession of that fair thou ow''st.<br>

    Nor shall death brag thou wander''st in his shade.<br>

    When in eternal lines to time thou grow''st.<br>

    So long as men can breathe, or eyes can see.<br>

    So long lives this, and this gives life to thee.</font>

    <br><br>

    <form>

    <input type="button" value="Close" onClick="self.close()">

    </form>


    <html>

    ```


    And summer''s lease hath a

    Sometime too hot the eye of

    And often is his gold comp

    And every fair from fair son

    By chance, or nature''s chan

    But thy eternal summer shal

    Nor lose possession of that

    Nor shall death brag thou w

    When in eternal lines to tim

    So long as men can breathe

    So long lives this, and this


    ![](img/9c0598183412917c38d5c5bb4b516af7_54_0.png)


    *onClick="self.close()."* This part of the <form> code instructs the browser window
    to close when the button is clicked.


    ## HOW DOES THIS WORK?


    When a visitor to this web page clicks the "Close" button, the page closes itself.
    To produce this page-closing button, create a button by using <form> and <input>
    tags. Whatever you choose for value, of course, will appear on the button itself,
    so keep it relatively brief. In this example, we have just used the word "Close."


    ```

    <form>

    <input type="button" value="Close">

    </form>

    ```


    The JavaScript event handler code is the same as that for closing a hyperlink.
    Place this immediately before the end of the input line.


    ```

    <form>

    <input type="button" value="Close"

    onClick=self.close( )>

    </form>

    ```


    When the close button is clicked, the page closes, and the visitor should now
    be returned seamlessly to the page from which he/she began.


    ## GETTING HELP


    If your JavaScript code goes wrong, your browser will sometimes (but not always)
    provide you with help in the form of a JavaScript error message box.


    ## DEBUGGING THE JAVASCRIPT


    If any of your JavaScript code contains errors, you will need to correct them
    before making the web page that contains them available to the public. This process
    is known as debugging. If you are lucky, it will involve only one or two typographical
    corrections. Sometimes – if, for example, there are major syntactical errors in
    the JavaScript – it might necessitate rebuilding your code line by line.


    **GETTING ADVICE FROM THE BROWSER**


    If you have been working through the examples in the last chapter, typing the
    code into Notepad and testing it in your web browser as you go, you will almost
    certainly have seen one of these error message boxes, unless your typing skills
    are flawless!


    Lines from Shakespeare''s Sonnet XVIII


    ![](img/9c0598183412917c38d5c5bb4b516af7_55_0.png)


    If there is a further error, the browser will inform you when you click OK. Correcting
    the first error may stop all subsequent errors from occurring.


    ## RECEIVING AN ERROR MESSAGE


    - Error message boxes can be very helpful, vague, or just confusing, depending
    on the kind of error detected and the type and version of the web browser that
    is being used to read the web page. The page may load, but the JavaScript fails
    to work. The only evidence that something is wrong may simply be a message in
    the status bar.


    ![](img/9c0598183412917c38d5c5bb4b516af7_56_0.png)


    *Error messages can be vague*


    ## UNDERSTANDING THE DETAIL


    - When a JavaScript error message does appear in Internet Explorer, it usually
    contains the line and character position where the scripting problem has occurred.
    If you have been learning how to write your scripts using Notepad, or a similarly
    simple text editor, you will have little difficulty in finding where things have
    gone wrong. If you have copied-and-pasted a script from elsewhere (another web
    page or a script repository on the web, for example) or you have inserted a script
    created by a web design package (such as FrontPage or Dreamweaver), and need to
    rely on the information provided in the error message box, you will find that
    debugging can take considerably longer.


    *Line:* This indicates the line where the error has occurred


    *Char:* This indicates the position of the first character on the indicated line
    where the error occurs


    *Error:* This indicates the type of error that has occurred


    ![](img/9c0598183412917c38d5c5bb4b516af7_56_1.png)


    ## FIND AND FIX


    The error message in this example gives you enough information to locate the area
    causing all the problems.


    ![](img/9c0598183412917c38d5c5bb4b516af7_57_0.png)


    ## LOCATING THE ERROR


    - Open the source code of the relevant HTML document in Notepad.

    - Following the instructions in the error message, count down 11 lines from the
    top of the page, including blank lines.

    - Now count 62 characters from the left of line 11.

    - The error line in your JavaScript message box can sometimes be a little cryptic,
    but, in this case, character 62 of line 11 leads us to the end of a string that
    fails to close a pair of double quotes (that opened earlier on that line) after
    the line break `<br>` at the end of this line.

    - Add the double quotes between the `>` and the `)`, and you''ve fixed the problem
    that the error box has announced as an "unterminated string constant."


