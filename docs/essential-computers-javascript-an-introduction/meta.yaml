    # CATERING FOR THE MINORITY


    Catering for those visitors to your site who use non-JavaScript-enabled browsers
    is a site-design issue that can be tackled in a number of ways. Writing a page
    that contains JavaScript, but that also provides sufficient information for anyone
    who can''t access the JavaScript material, requires careful planning. The solution
    depends on the nature of the web pages you are building, the information they
    contain, and how conscientious you are. Some authors design a separate page for
