    # CLOSING A SECONDARY WINDOW


    One of the main uses of a window without a menubar is as an "info box" – a pop-up
    window providing material that is meant to be read and closed. While the visitor
    can close the window by clicking the close [x] box in the top right of this mini-window,
    it is neater if you provide a "close" link or button as part of the page.


    # THE CLOSE COMMAND


    +   - To trigger the window close command, you will generally use the same technique
    that you employed to open it; i.e., a text hyperlink or a button.


    +   - You then embed the close command into the material that is loaded into the
    new window. So, if you are loading a new document (e.g., 18.htm), the window.close
    command must appear in the appropriate position on that page.


    ```

    But thy eternal summer shall not fade.<br>

    Nor lose possession of that fair ow''st.<br>

    Nor shall death brag thou wander''st in his shade.<br>

    When in eternal lines to time thou grow''st.<br>

    So long as men can breathe, or eyes can see.<br>

    So long lives this, and this gives life to thee.</font><br>

    <br>

    <a href="" onClick="self.close()">Close this window</a>


    <html>

    ```


    Place this line of code within the HTML source code where you want it to appear
    on the web page (i.e. at the bottom of the page in the example)


    ![](img/9c0598183412917c38d5c5bb4b516af7_53_0.png)


    # THE "LINK METHOD"


    To close a new window using a hyperlink, first create a link that goes nowhere!
    To do this, type the quotation marks but leave a blank where the linked document
    or URL would normally appear: `<a href="">`


    Then type the text that will appear on the page as the hyperlink between the >
    < characters, as usual: `<a href="">Close this window</a>`. Then add the JavaScript
    code immediately after the blank quotation marks: `<a href="" onClick="self.close()">Close
    this window</a>`.'
