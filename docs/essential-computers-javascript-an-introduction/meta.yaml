    \ `<head>` 标签内的 `<script>` 标签之间。要向新窗口写入内容，请使用 document.write() 方法 [1]。你需要在这部分代码中创建一个函数，然后在\
    \ `<body>` 部分调用此函数。\n\n## 代码元素说明\n\n- 1. 首先创建一个函数。在本例中，它被称为 rhymenote。该函数包含大括号之间的所有内容。\n\
