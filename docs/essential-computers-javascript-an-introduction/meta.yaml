  md: '# # SOME JAVASCRIPT TERMINOLOGY


    If you want to take your web page authoring skills beyond simple coding and communicate
    with other authors, you will need to understand the “hierarchy” on which JavaScript
    is built; this includes understanding the relationships of the three principal
    concepts of “object,” “property,” and “method.” These examples show only a few
    of the properties and methods relating to the window object, but the principles
    apply to all JavaScript objects, properties, and methods.


    # ## OBJECT


    ● An object in JavaScript is an entity that can usually be broken down into sub-categories
    or parts. It can also have things done to it, or be acted upon. Objects include
    window, form, image, and button.


    ![](img/9c0598183412917c38d5c5bb4b516af7_36_0.png)


    > *In grammatical terms, an object is the JavaScript equivalent of a noun*


    # ## PROPERTY


    ● A property in JavaScript is a quality that helps define an object – by providing
    a subcategory, or by describing a noun. The properties of an image, for example,
    are its name, border, height, and width.


    ![](img/9c0598183412917c38d5c5bb4b516af7_36_1.png)


    > *In JavaScript code, a property immediately follows the object it defines, separated
    by a period*


    # ## METHOD


    ● A method describes an action that can be applied to an object. In this chapter,
    the alert, confirm, and prompt methods of the window object are described.


    ![](img/9c0598183412917c38d5c5bb4b516af7_36_2.png)


    > *In JavaScript, the method acts on an object in the way that a verb acts on
    a noun*'
