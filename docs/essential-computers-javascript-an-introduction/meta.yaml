    Image3=new Image(120,50)

    Image3.src="contact2.jpg"


    这告诉浏览器预加载另外两张具有指定像素尺寸的图像，并为它们分别分配变量名（Image2 和 Image3）。最初，这些似乎相同图像的众多名称可能会让人困惑，但一旦理解，它其实非常简单。


    ## 工作原理


    在这个例子中，`Image1` Ⓐ 是用于标识加载图像 off.jpg Ⓑ 的空间的名称。这个空间在网页首次显示时被填充。如果访客没有将鼠标光标移到该空间（即该图像）上，则不会发生任何事情。然而，如果鼠标光标移到名为
    Image1 的空间上，浏览器会首先检查缓存文件夹，查看是否有为该空间预加载的图像，它会找到 on.jpg Ⓒ，这正是浏览器请求的图像。


    ## 新窗口


    你是否想知道某些网站如何使用弹出窗口来丰富其内容？这些网站可能使用了 JavaScript 的 `window.open()` 和 `window.close()`
    命令。


    ## WINDOW OPEN() 方法


    window 对象的 `open()` 方法在点击链接或按钮时创建新窗口，同时保持原始窗口打开。除了指定新窗口的内容外，你还可以确定其尺寸以及工具栏、滚动条等功能的使用。某些网页链接会导向一个弹出文本框，而不是另一个网页，但该文本框可能就是一个新的网页。JavaScript
    已被用于去除新网页的功能，这些功能可以很容易地通过在一行 JavaScript 中输入 `feature=no` 来停用。


    ## WINDOW.OPEN 语法


    "URL"

    如果 HTML 文档与主页面在同一文件夹（目录）中，只需输入其名称（例如，pagetoload.htm）。如果在另一个目录中，输入路径（例如，anotherfolder/pagetoload.htm）。如果文档在另一台服务器上（并且你已获得所有者使用许可），请输入完整的网址（例如，http://www.anotherserver.com/pagetoload.htm）。


    "NAME"

    令人惊讶的是，这个名称不会出现在新网页的标题栏中。它在更高级的 JavaScript 效果中是必需的，但在此示例中，它对新窗口的外观没有影响。


    "FEATURES"

    这包含所有可选功能，用于确定新窗口的大小和组成。如果字符串的这第三部分留空，则会打开具有所有默认功能的默认窗口。


    ## 打开新窗口


    - 使用 JavaScript 打开新窗口很简单。只需将代码行 `<script language="JavaScript">window.open("");</script>`
    插入到你的 HTML 文档中即可。当然，仅仅打开新窗口只是过程的一部分。如果你将此代码放入你的某个网页中，你只会显示一个空框——或者更确切地说，一个包含弹出错误消息的窗口。这是因为你尚未定义两个重要的窗口参数：(1)
    你想要加载到新窗口中的内容；(2) 将触发新窗口出现和内容加载的事件。


    - 新窗口的外观取决于你为其决定的功能。在接下来的页面中，我们将首先考虑如何定义新窗口的功能，然后考虑如何以及何时将内容加载到其中。


    由于页面的内容和触发其显示的事件均未定义，页面显示了错误消息


    ## 设计新窗口


    网页浏览器的外观可能因用户偏好而有很大不同。在决定创建任何新窗口时应包含或省略哪些功能时，你需要考虑所有浏览器设置。仅仅因为你无法在屏幕上看到某个特定的浏览器功能，并不意味着你网站的访客会以相同的方式配置他们的浏览器。因此，即使你的浏览器中禁用了工具栏，也要记住，如果你想确保它在所有浏览器中查看新窗口时都不存在，请使用
    **"toolbar=no"** 代码。


    ### 可选功能


    这个典型的网页显示了使用 JavaScript 打开新窗口时可以包含或排除的浏览器窗口功能。


    ### 停用功能


    当新窗口加载时，所有这些功能默认是激活的。要停用其中任何一项，请使用此代码：


    | | |

    |:---|:---|

    | `menubar=no` | `toolbar=no` |

    | `location=no` | `scrollbars=no` |

    | `status=no` | `resizeable=no` |


    ### 组合表示法


    功能可以通过使用 1（代表“是”）和 0（代表“否”）来设置。两种表示法都有效，并且也可以组合使用。


    ### 窗口功能说明


    1. 菜单栏

    2. 工具栏（后退、前进按钮等）

    3. 地址栏（URL 位置字段）

    4. 滚动条

    5. 状态栏

    6. 调整大小角

    '
