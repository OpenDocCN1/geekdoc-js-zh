    ```html

    <html>

    <head>

    <script language="JavaScript">


    if (confirm("To subscribe to the newsletter click OK."))

    {

    location.href=''subscribe.htm''

    }


    </script>


    </head>

    </html>

    ```


    - 如果访客点击 OK 按钮，他/她将被带到以 location.href 开头的行中定义的 URL。


