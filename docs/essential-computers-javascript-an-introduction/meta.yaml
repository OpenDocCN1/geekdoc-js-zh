    ## 在提示框中使用变量


    - 如这段代码所示，要使用访客输入的内容，你需要创建一个变量名。window.prompt() 代码会为你捕获访客的名字，但你只有将输入内容与变量名关联起来（例如
    vName）才能使用它。

    - 然后，该变量可以与 document.write() 命令结合使用，放置在网页上的任何位置。


    ```html

    <html>

    <title>WebVerse</title>

