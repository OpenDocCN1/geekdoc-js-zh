  md: '# REPEAT THE PROCEDURE


    +   - Now save the page and open the HTML document in your Web browser again.

    - If the HTML document opens as you expected, with all the JavaScript code functioning
    correctly, you have solved the problem.

    - If the browser then encounters another problem, you will need to address the
    new problem using the technique just described.

    - Repeat the procedure as many times as necessary!


    # FINDING THE LINES


    +   - If there is a marked discrepancy between your calculation of a line number
    and the number that appears in the browser''s error message box, try turning off
    the Word Wrap feature in Notepad. You''ll find it in the Edit menu.

    - Some script editors and website design programs provide line numbers for you.
    When you view the source code, these may prove more helpful than Notepad when
    correcting errors in your scripts.

    - In Macromedia''s Dreamweaver, for example, you have the option of displaying
    line numbering alongside the HTML code. Simply click on the check box next to
    Line Numbers at the top of the page.


    ![](img/9c0598183412917c38d5c5bb4b516af7_58_0.png)


    When you choose to view the source code in Macromedia''s Dreamweaver, you can
    opt to view line numbers by checking the Line Numbers box at the top of the viewing
    area.'
