  md: '# # JAVASCRIPT BASICS


    Recognizing where to put blocks of JavaScript code into an HTML document is one
    of the first things you need to know when approaching the language for the first
    time.


    # ## IDENTIFYING JAVASCRIPT


    Lines of JavaScript code need to be identified separately from HTML code. If you
    look at the source code of any HTML document containing JavaScript, the JavaScript
    code is most easily recognized if it is contained within <script> tags.


    ### USING <SCRIPT> TAGS


    ![](img/9c0598183412917c38d5c5bb4b516af7_15_0.png)


    +   - When code is placed between <script> and </script> tags, most browsers assume
    that the enclosed code is to be read as JavaScript.

    - Most browsers take JavaScript to be the default, but other scripts (VBScript,
    for example) can be used within these tags. For this reason it is advisable to
    specify the programming language that is being used, in this case by making the
    first tag `<script language="JavaScript">`.


    > ### EMBED JAVASCRIPT ANYWHERE


    When enclosed within <script> tags, JavaScript can be embedded anywhere in an
    HTML document (as long as it doesn''t conflict with HTML rules), and as many times
    as required. If the script relates to a button on the page, you can place the
    code adjacent to that block of HTML on the page. More often than not, though,
    the JavaScript is placed within the <head> section of the document. This is particularly
    true where functions are concerned.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# USING <HEAD> TAGS


    +   - When you open a web page, the code between the <head> tags is loaded before
    the web page is displayed on-screen.

    - In this example, an Alert box 📄 containing the words **Welcome to our website**
    pops up before the web page appears on your screen.


    ![](img/9c0598183412917c38d5c5bb4b516af7_16_0.png)


    # USING A FUNCTION


    +   - It is not obligatory for any code within <script> tags to appear between
    the <head> tags of the document, but it is good practice to place this code there
    when using a function (or functions) that you will "call" further down the page
    📄.


    ```

    <SCRIPT language="JavaScript">


    function myFunction()

    {

    ... The JavaScript statements that go to

    ... make up myFunction (or the name you

    ... decide to call that particular function)

    ... go here, between the curly brackets.

    }


    </SCRIPT>

    ```


    # THE IMPORTANCE OF RECOGNIZING JAVASCRIPT


    The ability to recognize JavaScript code will help you to identify those sections
    of code in other people''s web pages that you can learn from, adapt, and use to
    suit your own website. Also, you sometimes need to modify the JavaScript that
    has been generated using third-party software. Even the best HTML design packages
    can sometimes get themselves into a tangle, leaving you with no other solution
    than to open the source code and debug the script. More often than not, this simply
    involves locating the problem area and removing a duplicate tag. Knowing your
    way around the code will also have obvious benefits when it comes to tracking
    down your own mistakes.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# JavaScript Event Handlers


    Some JavaScript code does not need to be placed within `<script>` tags. Usually,
    these instances are known as event handlers. Examples include the commands that
    make events happen when the visitor clicks the mouse or moves the cursor over
    text or an image. Whatever appears in quotes after one of these commands is interpreted
    by the browser as being JavaScript and is handled accordingly.


    # AN EVENT HANDLER IN ACTION


    +   - Event handlers are compound words that begin with on, followed by a verb
    beginning with a capital letter. For example: onClick, onChange, onLoad, onSubmit,
    or onMouseOver.

    - In this example, onUnload is being used to call up an Alert box.


    ```

    <html>

    <title> Simple example of onUnload at work</title>


    <body onUnload="alert(''Thanks for visiting. Call again soon!'')">

    This simple Web page demonstrates the onUnload event handler at work.


    <p>When you leave this Web page, or quit the Web browser, an alert box will appear
    containing the words you have specified for the alert box.


    <p>Note that you do not need to use "javascript" tags in this example.

    </body>

    </html>

    ```


    +   - This is the page that contains source code for the JavaScript event handler.
    Event handlers do not require "JavaScript" tags.


    ![](img/9c0598183412917c38d5c5bb4b516af7_17_0.png)


    +   - When the user leaves the page or quits the browser, the Alert box appears.


    ![](img/9c0598183412917c38d5c5bb4b516af7_17_1.png)'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# JAVASCRIPT FUNCTIONS


    JavaScript uses a programming tool called a "function" to work more efficiently.
    Once you understand how functions fit into the general plan, you should be able
    to break down a page of code into something that makes sense structurally.


    # THE PURPOSE OF FUNCTIONS


    +   - A function is a named series of commands and is usually contained within
    the `<head>` tags.

    - Once a function has been created, you can "call" it as many times as you like
    further down the page by using a single line of code rather than typing a long
    block of code into the body of the HTML.

    - What a function does, and what it is named, is determined by the author.

    - In this case, the function showAA is being used to bring up an appropriate Alert
    box when a button is clicked.

    - Clicking on the Best Actress button causes the function to operate and bring
    up an Alert box containing the words Judy Holliday.


    ![](img/9c0598183412917c38d5c5bb4b516af7_18_0.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_18_1.png)


    ![](img/9c0598183412917c38d5c5bb4b516af7_18_2.png)'
