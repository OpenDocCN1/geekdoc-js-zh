  md: '# AUTOMATED SCRIPTING


    So far we have looked at using a simple text editor, such as Notepad, to write
    JavaScript code as a script or directly into an HTML document. There are alternatives...


    # SOFTWARE: SCRIPT EDITORS


    If you are likely to do much scripting, you may find it helpful to use software
    that works like a kind of enhanced text editor. Such programs take some of the
    routine keyboard work out of scripting, but still leave you in control of what
    you produce. You can find plenty of programs of this kind on software download
    sites such as Tucows at www.tucows.com or Winfiles at www.winfiles.com.


    # USING SCRIBBLER 2000


    This example features a shareware program called Scribbler 2000 by Cream Software,
    which can be found at www.creamsoft.com/scribbler. The program produces code that
    is almost identical (and equally effective) to any coded-by-hand, Notepad-produced
    examples shown in this book so far. The example here shows how to use Scribbler
    2000 to produce the kind of new window that was created in Chapter 6.


    # A NEW WINDOW IN SCRIBBLER 2000


    +   - With the program installed and open on your PC, choose Open new window from
    the Script drop-down menu.


    ![](img/9c0598183412917c38d5c5bb4b516af7_63_0.png)'
