  md: '# OPENING A NEW WINDOW


    +   - Opening a new window using JavaScript is simple. Just drop the lines of
    code: `<script language="JavaScript">window.open("");</script>` into your HTML
    document. Of course, just opening a new window is only part of the process. If
    you dropped this code into one of your web pages, you would only display an empty
    box – or rather a window containing a pop-up error message. This is because you
    have not yet defined two important windows'' parameters: (1) The content you want
    to load into the new window; (2) The event that will trigger the appearance of
    the new window and the loading of the content.

    - The appearance of the new window is determined by the features that you decide
    it is to have. On the following pages, we will consider first how to define the
    new window''s features, then how and when to load material into it.


    ![](img/9c0598183412917c38d5c5bb4b516af7_46_0.png)


    Since neither the content of the page nor the event that will trigger its appearance
    has been defined, the page displays an error message'
