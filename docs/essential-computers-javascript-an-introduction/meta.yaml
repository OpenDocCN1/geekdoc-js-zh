    ## window.prompt 语法


    prompt 方法必须在 <script> 标签内使用。第一个字符串构成弹出对话框的内容（通常是你向访客提出的问题）。在代码中，你精确地定义问题，就像对 Alert
    框一样。然而，使用 window.prompt() 方法时，你可以使用可选的第二个文本字符串来确定将出现在文本字段中的文本。这通常会填写一些对访客有帮助的内容，如
    "Type your reply here"（在此输入你的回复），访客可以立即覆盖它。如果第二个字符串保持空白（即只使用引号，中间没有任何内容），并且访客点击
    OK 时没有输入任何内容，则网页上相应位置将不会出现任何内容。


    要在 JavaScript 中创建变量，首先选择变量的名称，然后使用以下语法说明该变量名代表什么：var yourVariableName = value。你可以为变量选择任何名称，但给它一个有描述性的名称，表明它包含什么内容，会更有帮助。


    ```javascript

    window.prompt("first string","second string");

    ```


    ## 确认框


    Confirm 框本质上是提供两个响应按钮选择的 Alert 框：OK 或 Cancel（等同于 Yes 或 No）。除非你能对访客的响应做些有用的处理，否则使用
    window.confirm() 方法几乎没有意义。要充分利用这个 OK 或 Cancel 的响应，你需要学会如何在 JavaScript 中使用 if...else
    语句。


    ## 仅使用 if... 语句


    - 这里有一个简单的例子，表明有时仅仅使用 if 子句就能得到你想要的结果。点击订阅链接会弹出 Confirm 框。


    ![](img/9c0598183412917c38d5c5bb4b516af7_33_0.png)


