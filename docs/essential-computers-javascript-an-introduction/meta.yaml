  md: '# GETTING HELP


    If your JavaScript code goes wrong, your browser will sometimes (but not always)
    provide you with help in the form of a JavaScript error message box.


    # DEBUGGING THE JAVASCRIPT


    If any of your JavaScript code contains errors, you will need to correct them
    before making the web page that contains them available to the public. This process
    is known as debugging. If you are lucky, it will involve only one or two typographical
    corrections. Sometimes – if, for example, there are major syntactical errors in
    the JavaScript – it might necessitate rebuilding your code line by line.


    **GETTING ADVICE FROM THE BROWSER**


    If you have been working through the examples in the last chapter, typing the
    code into Notepad and testing it in your web browser as you go, you will almost
    certainly have seen one of these error message boxes, unless your typing skills
    are flawless!


    Lines from Shakespeare''s Sonnet XVIII


    ![](img/9c0598183412917c38d5c5bb4b516af7_55_0.png)


    If there is a further error, the browser will inform you when you click OK. Correcting
    the first error may stop all subsequent errors from occurring.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# ## RECEIVING AN ERROR MESSAGE


    +   - Error message boxes can be very helpful, vague, or just confusing, depending
    on the kind of error detected and the type and version of the web browser that
    is being used to read the web page. The page may load, but the JavaScript fails
    to work. The only evidence that something is wrong may simply be a message in
    the status bar.


    ![](img/9c0598183412917c38d5c5bb4b516af7_56_0.png)


    *Error messages can be vague*


    # ## UNDERSTANDING THE DETAIL


    +   - When a JavaScript error message does appear in Internet Explorer, it usually
    contains the line and character position where the scripting problem has occurred.
    If you have been learning how to write your scripts using Notepad, or a similarly
    simple text editor, you will have little difficulty in finding where things have
    gone wrong. If you have copied-and-pasted a script from elsewhere (another web
    page or a script repository on the web, for example) or you have inserted a script
    created by a web design package (such as FrontPage or Dreamweaver), and need to
    rely on the information provided in the error message box, you will find that
    debugging can take considerably longer.


    *Line:* This indicates the line where the error has occurred


    *Char:* This indicates the position of the first character on the indicated line
    where the error occurs


    *Error:* This indicates the type of error that has occurred


    ![](img/9c0598183412917c38d5c5bb4b516af7_56_1.png)'
  merge: -1
