    # PRELOADING MULTIPLE IMAGES


    Image1 is a variable and you can choose any name you like for this, but it is
    always advisable to keep things simple. The information in brackets after new
    Image tells the browser the size of the image in pixels. It is saying “Reserve
    me a space with these dimensions on the page and fill it with the new image called
    Image1. I am just about to tell you where you can find Image1.” Image1.src provides
    that location. If you want to preload more than one image, simply repeat the formula,
    keeping everything within the script tags. For example:

    Image2=new Image(100,50)

    Image2.src=“services2.jpg”

    Image3=new Image(120,50)

    Image3.src="contact2.jpg"

    This tells the browser to preload two more images with the dimensions in pixels
    and gives them both variable names (Image2 and Image3). Initially, this profusion
    of names for what seem to be the same images can seem confusing, but, once grasped,
    it is really very simple.


    # HOW IT WORKS


    In this example, Image1 Ⓐ is the name that identifies the space into which the
    image off.jpg Ⓑ is loaded. This space is filled when the web page is first displayed.
    If the visitor doesn''t move the mouse cursor over that space (i.e. that image),
    then nothing will happen. If the mouse cursor is moved over the space named Image1,
    however, the browser first checks the cache folder to see if any images have been
    preloaded for use in that space, it will find on.jpg Ⓒ, which is the image that
    the browser is calling for.


    ![](img/9c0598183412917c38d5c5bb4b516af7_44_0.png)'
