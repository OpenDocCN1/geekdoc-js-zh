  md: '# # ABOUT THIS BOOK


    *JavaScript: An Introduction* is an easy-to-follow guide to incorporating JavaScript
    code into your HTML document and understanding the effects of JavaScript on the
    web page.


    THIS BOOK WILL GIVE YOU A FLAVOR OF JavaScript as a programming language and familiarize
    you with how it looks as code in the HTML document. You will find advice on how
    to build up some basic, but widely used, JavaScript code from scratch; how to
    use third-party software such as Macromedia''s Dreamweaver to generate code for
    you; and how to recognize JavaScript in other web pages, enabling you to learn
    from what others have done. This book is intended for PC users working with Notepad
    and Internet Explorer version 4 or higher, but the basic principles apply to all
    modern web browsers and simple text editors. You are welcome to adapt any of the
    scripts shown here and use them on your own web pages. It should be simple enough
    to substitute your own text and hyperlinks within the JavaScript code shown throughout
    the book. Equally importantly, Chapter 7 of this book advises you on how to debug
    your scripts.


    ![](img/9c0598183412917c38d5c5bb4b516af7_5_0.png)


    The chapters and the subsections present the information using step-by-step sequences.
    Virtually every step is accompanied by an illustration showing how your screen
    should look at each stage.


    The book contains several features to help you understand both what is happening
    and what you need to do. Command keys are shown in these rectangles: Enter← and
    Ctrl, to prevent confusion over what should be typed. Cross-references are shown
    in the text as left- or right-hand page icons: ◁ and ▷. The page number and the
    reference are shown at the foot of the page.


    ![](img/9c0598183412917c38d5c5bb4b516af7_5_1.png)


    There are also boxes that explain a feature in detail, and tip boxes that provide
    alternative methods. Finally, at the back, you will find a glossary of common
    terms and a comprehensive index.'
