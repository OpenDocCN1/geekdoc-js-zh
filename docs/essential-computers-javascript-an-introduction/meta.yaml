  md: '# NON-JAVASCRIPT-ENABLED BROWSERS


    Here the web page is being seen on a JavaScript-enabled browser. A link is provided
    to a text-only version of the page for browsers that cannot handle JavaScript.
    This requires more work, but will make your web page more widely available.


    ![](img/9c0598183412917c38d5c5bb4b516af7_24_0.png)


    # CATERING FOR THE MINORITY


    Catering for those visitors to your site who use non-JavaScript-enabled browsers
    is a site-design issue that can be tackled in a number of ways. Writing a page
    that contains JavaScript, but that also provides sufficient information for anyone
    who can''t access the JavaScript material, requires careful planning. The solution
    depends on the nature of the web pages you are building, the information they
    contain, and how conscientious you are. Some authors design a separate page for
    users of older browsers. Others provide a link to a text-only version of the page.
    Some authors simply include a message that states: "Your web browser cannot cope
    with this page; perhaps it''s time to upgrade your browser," and they leave it
    at that.


    # BROWSERS AND JAVASCRIPT


    | BROWSERS ABLE TO HANDLE JAVASCRIPT | BROWSERS UNABLE TO HANDLE JAVASCRIPT |

    | :--- | :--- |

    | **Browser** &nbsp;&nbsp;&nbsp;&nbsp; **Version** | **Browser** &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    **Version** |

    | Netscape Navigator 2 &nbsp;&nbsp; JavaScript 1.0 | AOL Browser &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    1.3 |

    | Netscape Navigator 3 &nbsp;&nbsp; JavaScript 1.1 | Mosaic &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    1.3 |

    | Netscape Navigator 4+ &nbsp; JavaScript 1.2 | Netscape Navigator &nbsp; 1.1
    |

    | Internet Explorer 3 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Jscript | Internet Explorer
    &nbsp;&nbsp; 1.2 |

    | Internet Explorer 4+ &nbsp;&nbsp;&nbsp; Jscript 1.2 | Lynx |

    | Internet Explorer 5 | |

    | Opera 3.5, 4 and other recent browsers | |'
