  ### 1.1 什么是编程？\n编程是指示计算机执行任务的艺术。它涉及编写 `code` 来解决问题，无论你是想开发 Web 应用、分析数据还是构建游戏。\n\n\
  ### 1.2 为什么要学习 Python？\nPython 以其简单性和可读性闻名，是初学者的理想选择。以下是一些原因：\n\n1. **易于学习和阅读**：`Python`\
  \ 的语法设计得非常简单，且类似于英语。\n2. **多功能且强大**：`Python` 功能非常强大，可以用于 Web 开发和数据科学等各种用途。\n3. **庞大且支持社区**：`Python`\
  \ 在全球范围内庞大且活跃的社区，这有助于你找到答案。\n4. **就业市场需求量**：`Python` 的人气近年来一直飙升，使其成为最受欢迎的语言之一。\n\
  5. **非常适合原型设计和快速开发**：`Python` 的简单性使其成为实现想法的完美工具。\n\n### 1.3 配置 Python 环境\n在深入学习\
  \ `Python` 编程之前，你需要配置环境。以下是分步骤指南：\n\n1. **选择并安装 Python 发行版**：`Python` 有不同的发行版本，如\
  \ `CPython`、`Anaconda` 和 `PyPy`。对于初学者，推荐 `CPython`。访问官网 `python.org` 下载最新版本。\n2.\
  \ **安装过程**：运行安装程序并按照指示操作。确保勾选 `Add Python to PATH` 框，以确保可以从任何目录访问。\n3. **验证安装**：打开你的命令行提示符或终端并输入\
  \ `python --version`。如果显示版本号，说明安装成功。\n4. **集成开发环境 (IDE)**：虽然可以在任何文本编辑器编写代码，但使用 IDE\
  \ 可以增强体验。流行的选项包括 `PyCharm`、`Visual Studio Code` 和 `IDLE`。\n5. **创建项目文件夹**：组织项目是一个良好的习惯。创建一个新文件夹来存储你的\
  \ `.py` 文件。\n\n\n\n\n\n## 6. 编写并运行你的第一个 Python 程序\n\n打开你选择的 IDE，并在项目文件夹中创建一个新的 Python\
  \ 文件。从编写一个简单的“Hello, World!”程序开始，这是新程序员的传统起点。以 `.py` 扩展名保存文件（例如 `hello_world.py`），并在\
  \ IDE 中运行它。如果一切设置正确，你应该能在控制台中看到显示输出的“Hello, World!”。\n\n恭喜你！你已经成功搭建了 Python 环境并编写了你的第一个\
  \ Python 程序。现在，你准备好深入学习 Python 编程并探索它提供的巨大可能性了。\n\n请记住，随着学习的进行，你可能需要安装额外的库或包，以扩展\
  \ Python 处理特定任务的能力。但目前，你已经拥有了开始 Python 之旅所需的所有内容。\n\n### 1.4 编写你的第一个 Python 程序\n\
  \n现在你已经在电脑上安装了 Python，是时候编写你的第一个 Python 程序了。按照以下步骤开始：\n\n1. **选择文本编辑器或 IDE**：打开文本编辑器或集成开发环境（IDE）来编写你的\
  \ Python 代码。诸如 PyCharm、Visual Studio Code 或 IDLE（Python 自带）等 IDE 提供了更增强的编码体验。\n\n\
  2. **创建新的 Python 文件**：在你选择的文本编辑器或 IDE 中，创建一个新文件并以 `.py` 扩展名保存。该扩展名表示这是一个 Python\
  \ 文件。\n\n3. **编写你的代码**：开始编写你的 Python 代码。让我们从一个传统的初学者程序“Hello, World!”开始。输入以下代码：\n\
  \n```python\nprint(\"Hello, World!\")\n```\n\n这段代码在执行时将输出消息“Hello, World!”。\n\n\
  4. **保存文件**：使用一个有意义的名字和 `.py` 扩展名保存你的 Python 文件。例如，你可以将其保存为 `hello_world.py`。\n\n\
  5. **运行程序**：要运行你的 Python 程序，打开命令提示符或终端并并到保存 Python 文件的目录。使用以下命令：\n\n```bash\npython\
  \ hello_world.py\n```\n\n此命令告诉 Python 执行 `hello_world.py` 文件中的代码。如果一切设置正确，你应该能在控制台中看到显示输出的“Hello,\
  \ World!”。\n\n恭喜你！你已经编写并执行了第一个 Python 程序。你现在正处于成为 Python 程序员的道路上。\n\n随着你的进步，你将学习更多关于\
  \ Python 语法、数据类型、控制结构、函数等许多内容。继续练习、探索和构建项目，以加深对 Python 及其强大能力的理解。\n\n记住将复杂问题分解为更小、易于管理的任务，并使用\
  \ Python 强大的特性来解决它们。不要犹豫咨询文档、在线资源或论坛以寻求指导并扩展你的知识。\n\n# 第 2 章：Python 入门\n\n### 2.1\
  \ Python 语法与结构\n\n要精通 Python 编程，理解它的语法和结构至关重要。Python 拥有简洁且易读的语法，对新手非常友好。让我们探索一些关键元素：\n\
  \n1. **语句和缩进**：与其他使用大括号或分号的编程语言不同，Python 使用缩进来定义代码块。缩进是指位于行首的空格或制表符，用于在视觉上表示代码结构。一致的缩进对于正确的执行和可读性至关重要。\n\
  \n例如：\n\n```python\nif x > 5:\n    print(\"x is greater than 5\")\n```\n\n2. **注释**：注释用于标记代码，会被\
  \ Python 解释器忽略。它们有助于记录你的代码或添加备注。在 Python 中，注释以井号（`#`）开头。\n\n例如：\n\n```python\n#\
  \ 这是一个注释\n```\n\n3. **变量**：变量用于存储数据值。在 Python 中，你不需要显式声明变量类型。你可以使用等号（`=`）为变量赋值。\n\
  \n例如：\n\n```python\nx = 5\nname = \"John\"\n```\n\n4. **数据类型**：Python 支持多种数据类型，包括整数、浮点数、字符串、布尔值、列表、元组、字典等。每种数据类型都有自己的特性和用途。\n\
  \n例如：\n\n```python\nage = 25           # integer\ntemperature = 98.6 # 浮点数\nname\
  \ = \"Alice\"      # 字符串\nis_true = True      # 布尔\n```\n\n5. **Print 函数**：`print()`\
  \ 函数用于在控制台中显示输出。它允许你打印变量、字符串，甚至进行基础格式化。\n\n例如：\n\n```python\nname = \"Bob\"\nprint(\"\
  Hello, \" + name + \"!\") # 输出: Hello, Bob!\n```\n\n6. **控制结构**：Python 提供控制结构，如\
  \ if-else 语句、循环（如 for 和 while 循环）等，根据某些条件控制程序的流。\n\n例如：\n\n```python\nif x > 10:\n\
  \    print(\"x is greater than 10\")\nelse:\n    print(\"x is less than or equal\
  \ to 10\")\n```\n\n这些只是 Python 语法和结构的几个基础元素。随着学习的深入，你将进一步深入探索该语言更高级的概念和特性。\n\n###\
  \ 2.2 变量与数据类型\n\n变量在 Python 中用于存储数据值。它们允许你为某个值命名并在代码的其他部分引用它。Python 支持你可以赋值给变量的各种数据类型。让我们探索一些常用的数据类型：\n\
  \n1. **数值类型**：\n   - 整数 (`int`)：代表整数，正数或负数，不带小数点。\n   - 浮点数 (`float`)：代表带有小数点的实数。\n\
  \n示例如：\n```python\nage = 25           # 整数\ntemperature = 98.6 # 浮点数\n```\n\n2.\
  \ **字符串 (`str`)**：表示由单引号 (' ') ) 或双引号 (\" \") ) 包围的字符序列。你可以对字符串执行各种操作，如拼接和切片。\n\n\
  示例：\n```python\nname = \"Alice\"\nmessage = 'Hello, ' + name + '!'\n```\n\n3. **布尔值\
  \ (`bool`)**：代表可以是 True 或 False 的逻辑值。布尔值常用于逻辑判断和控制流。\n\n示例：\n```python\nis_true\
  \ = True\nis_false = False\n```\n\n4. **列表 (List)**：表示由方括号 (`[]`) 包围的有序元素集合。列表可以存储不同的数据类型且是可变的，这意味着你可以修改它们。\n\
  \n示例：\n```python\nnumbers = [1, 2, 3, 4, 5] # 整数列表\nnames = ['Alice', 'Bob', 'Charlie']\
  \ # 字符串列表\n```\n\n5. **元组 (Tuple)**：与列表类似，元组是由圆括号 `()` 包围的有序元素集合。然而，元组是不可变的，这意味着你不能在创建后修改它们。\n\
  \n示例：\n```python\ncoordinates = (10, 20) # 整数元组\nperson = ('Alice', 25, 'Engineer')\
  \ # 不同数据类型的元组\n```\n\n6. **字典 (Dictionary)**：表示由大括号 (`{}`) 包围的键值对集合。每个键通过冒号（`:`）与其值分隔。字典是无序的，你可以使用相应的键来访问值。\n\
  \n示例：\n```python\nperson = {'name': 'Alice', 'age': 25, 'occupation': 'Engineer'}\n\
  ```\n\n这些只是 Python 数据类型的几个例子。随着学习的深入，你将遇到更高级的数据结构和专门的数据类型。要给变量赋值，请使用等号（`=`）。例如，`x\
  \ = 10` 将值 10 赋值给变量 `x`。\n\n记住选择反映其用途的有意义的变量名，并遵循 Python 的命名规范。变量名应以字母（或下划线）开头，并包含字母、数字和下划线。\n\
  \n## 2.3 Python 中的输入与输出\n\n\n\n\n输入和输出（I/O）操作在任何编程语言中都是至关重要的，因为它们实现了程序与用户或外部源之间的通信。Python\
  \ 提供了几个内置函数来处理 I/O 操作。让我们探索 Python 中的输入和输出：\n\n### 1. 输出\n\n*   `print()` 函数：`print()`\
  \ 函数用于在控制台中显示输出。它接受一个或多个参数，并按照指定的顺序打印它们。你可以打印变量、字符串并进行基础格式化。\n\n示例：\n```python\n\
  name = \"Alice\"\nage = 25\nprint(\"Hello, \" + name + \"! You are \" + str(age)\
  \ + \" years old.\")\n```\n\n### 2. 输入\n\n*   `input()` 函数：`input()` 函数允许你从控制台获取用户输入。它会向用户显示提示信息并等待他们输入值。输入的内容始终被处理为字符串，因此你可能需要将其转换为适当的数据类型。\n\
  \n示例：\n```python\nname = input(\"Enter your name: \")\nage = input(\"Enter your\
  \ age: \")\nprint(\"Hello, \" + name + \"! You are \" + age + \" years old.\")\n\
  ```\n\n### 3. 文件输入与输出\n\n*   `open()` 函数：`open()` 函数用于打开文件并返回一个文件对象。它接受两个参数：文件名和模式（`'r'`\
  \ 用于读取，`'w'` 用于写入，`'a'` 用于追加等）。\n*   `read()` 方法：`read()` 方法用于读取内容。\n*   `write()`\
  \ 方法：`write()` 方法向文件写入数据。\n*   `close()` 方法：`close()` 方法关闭文件并释放系统资源。\n\n示例（读取文件）：\n\
  ```python\nfile = open(\"example.txt\", \"r\")\ncontent = file.read()\nprint(content)\n\
  file.close()\n```\n\n示例（写入文件）：\n```python\nfile = open(\"example.txt\", \"w\")\n\
  file.write(\"Hello, World!\")\nfile.close()\n```\n\n这些是 Python 中一些基本的 I/O 操作。它们允许你与用户交互、读写文件并高效处理数据。\n\
  \n在处理 I/O 操作时，记住处理异常和错误，例如文件未找到或错误的用户输入。你可以使用 `try-except` 块来优雅地处理异常并避免程序崩溃。\n\n\
  ## 2.4 基础运算符和表达式\n\n运算符是用于对变量和值执行操作的符号或特殊字符。Python 提供了许多运算符来处理不同类型的操作。让我们探索 Python\
  \ 中的一些基础运算符和表达式：\n\n### 1. 算术运算符\n\n*   加法 (`+`)：将两个值相加。\n*   减法 (`-`)：从第一个值中减去第二个值。\n\
  *   乘法 (`*`)：将两个值相乘。\n*   除法 (`/`)：将第一个值除以第二个值，返回浮点数结果。\n*   整除 (`//`)：将第一个值除以第二个值，返回整数形式的商。\n\
  *   取模 (`%`)：返回除法后的余数。\n*   幂 (`**`)：将第一个值提升到第二个值的幂。\n\n示例：\n```python\nx = 10\n\
  y = 3\nprint(x + y)      # 输出: 13\nprint(x - y)      # 输出: 7\nprint(x * y)     \
  \ # 输出: 30\nprint(x / y)      # 输出: 3.3333333333333335\nprint(x // y)     # 输出:\
  \ 3\nprint(x % y)      # 输出: 1\nprint(x ** y)     # 输出: 1000\n```\n\n### 2. 赋值运算符\n\
  \n*   赋值 (`=`)：将值赋给变量。\n*   复合赋值 (`+=`, `-=`, `*=`, `/=`, `//=`, `%=`)：执行操作并将结果赋值给变量。\n\
  \n示例：\n```python\nx = 10\nx += 5 # 等同于：x = x + 5\nprint(x)   # 输出: 15\n```\n\n###\
  \ 3. 比较运算符\n\n*   等于 (`==`)：检查两个值是否相等。\n*   不等于 (`!=`)：检查两个值是否不等。\n*   大于 (`>`)、小于\
  \ (`<`)：检查第一个值是否大于或小于第二个值。\n*   大于等于 (`>=`)、小于等于 (`<=`)：检查第一个值是否大于或等于，或小于或等于第二个值。\n\
  \n示例：\n```python\nx = 10\ny = 5\nprint(x == y)     # 输出: False\nprint(x != y)  \
  \   # 输出: True\nprint(x > y)      # 输出: True\nprint(x < y)      # 输出: False\nprint(x\
  \ >= y)     # 输出: True\nprint(x <= y)     # 输出: False\n```\n\n### 4. 逻辑运算符\n\n*\
  \   `and`：如果两个条件都为 True，则返回 True。\n*   `or`：如果任一条件为 True，则返回 True。\n*   `not`：返回条件的反值。\n\
  \n示例：\n```python\nx = 10\ny = 5\nprint(x > y and y < 10) # 输出: True\nprint(x > y\
  \ or y < 2)  # 输出: True\nprint(not (x > y))      # 输出: False\n```\n\n## 2.5 字符串操作\n\
  \n字符串是 Python 中最常用的类型之一。它们被单引号 (`'`) 或双引号 (`\" `) 包围。\n\n### 1. 拼接\n\n`+` 运算符用于将一个或多个字符串拼接在一起。\n\
  \n示例：\n```python\nfirstName = \"John\"\nlastName = \"Doe\"\nfullName = firstName\
  \ + \" \" + lastName\nprint(fullName) # 输出: John Doe\n```\n\n### 2. 长度\n\n`len()`\
  \ 函数用于获取字符串的长度。\n\n示例：\n```python\nmessage = \"Hello, World!\"\nprint(len(message))\
  \ # 输出: 13\n```\n\n### 3. 访问\n\n可以通过索引访问字符串中的字符。索引从第一个字符的 0 开始，直到字符串长度。\n\n示例：\n\
  ```python\nmessage = \"Hello, World!\"\nprint(message[0]) # 输出: H\n```\n\n### 4.\
  \ 切片\n\n切片允许通过指定起始和结束索引提取字符串的一部分（子字符串）。结束索引是不包含的。\n\n示例：\n```python\nmessage = \"\
  Hello, World!\"\nprint(message[0:5]) # 输出: Hello\n```\n\n### 5. 方法\n\nPython 提供了各种对字符串操作的方法，例如转换大小写、替换字符、分割和连接字符串。\n\
  \n```python\nmessage = \"Hello, World!\"\nprint(message.upper()) # 输出: HELLO, WORLD!\n\
  print(message.lower()) # 输出: hello, world!\nprint(message.replace(\"Hello\", \"\
  Hi\")) # 输出: Hi, World!\nprint(message.split(\",\")) # 输出: ['Hello', ' World!']\n\
  ```\n\n### 6. 格式化\n\n字符串格式化允许将变量或值插入字符串中。Python 提供了多种格式化方法，包括 `%` 运算符、`.format()`\
  \ 方法和 f-strings（格式化字符串字面量）。\n\n示例：\n```python\nname = \"Alice\"\nage = 25\nprint(\"\
  My name is %s and I am %d years old.\" % (name, age))\nprint(\"My name is {} and\
  \ I am {} years old.\".format(name, age))\nprint(f\"My name is {name} and I am {age}\
  \ years old.\")\n```\n\n# 第 3 章：控制流\n\n### 3.1 条件语句 (if, else, elif)\n\n条件语句允许根据某些条件做出决策。在\
  \ Python 中，条件语句使用 `if`、`else` 和 `elif` 关键字实现。\n\n### 1. `if` 语句\n\n`if` 语句仅在特定条件为\
  \ True 时执行代码块。\n\n示例：\n```python\nage = 18\nif age >= 18:\n    print(\"你有投票权.\"\
  )\n```\n\n### 2. `else` 语句\n\n`else` 语句在 `if` 语句中的条件为 False 时执行代码块。\n\n示例：\n```python\n\
  age = 15\nif age >= 18:\n    print(\"你有投票权.\")\nelse:\n    print(\"你没有投票权.\")\n\
  ```\n\n### 3. `elif` 语句\n\n`elif` 语句用于检查多个条件。它位于 `if` 和 `else` 语句之间，允许测试额外的条件。\n\
  \n示例：\n```python\nscore = 85\nif score >= 90:\n    print(\"Grade: A\")\nelif score\
  \ >= 80:\n    print(\"Grade: B\")\nelse:\n    print(\"Grade: C\")\n```\n\n\n\n\n\
  ```python\nif score >= 90:\n    print(\"Grade A\")\nelif score >= 80:\n    print(\"\
  Grade B\")\nelif score >= 70:\n    print(\"Grade C\")\nelse:\n    print(\"Grade\
  \ D\")\n```\n注意：`elif` 语句是可选的，可以出现多次以测试不同的条件。\n\n### 4. 嵌套 if 语句\n\n你也可以将 `if` 语句嵌套在一起处理更复杂的条件。\n\
  \n示例：\n\n```python\nage = 20\nif age >= 18:\n    if age <= 21:\n        print(\"\
  You are eligible for a special offer.\")\n    else:\n        print(\"You are eligible\
  \ to vote.\")\nelse:\n    print(\"You are not eligible for any special offers.\"\
  )\n```\n\n### 5. 三元运算符\n\nPython 提供了一种编写简单 if-else 语句的简方式，称为三元运算符。\n\n示例：\n\n```python\n\
  age = 18\nmessage = \"You are eligible to vote.\" if age >= 18 else \"You are not\
  \ eligible to vote.\"\nprint(message)\n```\n\n注意：三元运算符适用于简单的 if-else 条件，但在处理复杂条件时可能会变得难以阅读。\n\
  \n条件语句是强大的工具，允许你的程序根据特定条件做出决策并采取不同的路径。它们使你能够控制程序的流并使其更加动态。\n\n## 3.2 使用 for 和 while\
  \ 循环进行迭代\n\n循环用于重复执行一组指令。Python 提供了类型的循环：`for` 循环和 `while` 循环。让我们探索这些循环是如何工作的：\n\
  \n### 1. for 循环\n\n`for` 循环用于遍历序列（如 `list`、`tuple`、`string` 或 `range`）或任何可迭代对象。\n\
  \n示例：\n\n```python\nfruits = [\"apple\", \"banana\", \"cherry\"]\nfor fruit in fruits:\n\
  \    print(fruit)\n```\n\n注意：变量（在此例中为 `fruit`）在每次迭代中获取序列中每个项的值。\n\n### 2. while\
  \ 循环\n\n`while` 循环用于在特定条件为 `True` 时重复执行一段代码块。\n\n示例：\n\n```python\ncount = 0\nwhile\
  \ count < 5:\n    print(count)\n    count += 1\n```\n\n注意：确保包含一个最终会变为 `False` 的条件；否则循环将无限运行。\n\
  \n### 3. 循环控制语句\n\n*   `break`: 终止循环并退出循环。\n*   `continue`: 跳过循环中当前迭代的剩余代码并进入下一次迭代。\n\
  \n示例：\n\n```python\nfor num in range(10):\n    if num == 3:\n        break\n   \
  \ if num % 2 == 0:\n        continue\n    print(num)\n```\n\n注意：`break` 和 `continue`\
  \ 语句是可选的，可以用于 `for` 和 `while` 循环。\n\n### 4. 带有 else 的循环\n\n`for` 和 `while` 循环都可以有一个\
  \ `else` 块，该块在循环完成所有迭代（且没有遇到 `break` 语句）时执行。\n\n示例：\n\n```python\nfor num in range(5):\n\
  \    print(num)\nelse:\n    print(\"Loop completed successfully.\")\n```\n\n注意：`else`\
  \ 块是可选的，可以用于 `for` 和 `while` 循环。\n\n循环对于执行重复性任务和遍历序列至关重要。它们帮助自动化流程并让你的代码更高效。\n\n\
  ## 3.3 循环控制语句 (break 和 continue)\n\n除了基本的循环结构外，Python 还提供了两个循环控制语句：`break` 和 `continue`。这些语句允许你对循环的执行有更多控制。让我们探索这些语句是如何工作的：\n\
  \n### 1. break 语句\n\n`break` 语句用于终止当前循环并完全退出循环，无论循环条件如何。\n\n示例：\n\n```python\nfor\
  \ num in range(1, 6):\n    if num == 4:\n        break\n    print(num)\n```\n\n\
  输出：\n1\n2\n3\n\n注意：一旦遇到 `break` 语句，循环就会终止，程序执行将继续执行循环后的下一个语句。\n\n### 2. continue\
  \ 语句\n\n`continue` 语句用于跳过循环中当前迭代的剩余代码，并进入下一次迭代。\n\n示例：\n\n```python\nfor num in\
  \ range(1, 6):\n    if num == 3:\n        continue\n    print(num)\n```\n\n输出：\n\
  1\n2\n4\n5\n\n注意：当遇到 `continue` 语句时，当前迭代立即停止，循环进入下一次迭代。\n\n`break` 和 `continue`\
  \ 语句在循环内部提供了灵活性，允许你根据特定条件控制执行流。它们可以用于 `for` 和 `while` 循环。\n\n审慎地使用这些语句很重要，以避免创建难以阅读或理解的代码。过度使用\
  \ `break` 和 `continue` 会使你的代码变得难以维护且更难调试。\n\n## 3.4 嵌套循环和循环变体\n\n除了基本的 `for` 和 `while`\
  \ 循环，Python 还允许你将循环嵌套在一起，并提供了循环变体以为代码增加更多灵活性。让我们探索嵌套循环和循环变体：\n\n### 1. 嵌套循环\n\n\
  你可以将循环嵌套在一起创建更复杂的迭代。内部循环会在外部循环的每次迭代时完成其所有的迭代。\n\n示例：\n\n```python\nfor i in range(1,\
  \ 4):\n    for j in range(1, 4):\n        print(i, j)\n```\n\n输出：\n1 1\n1 2\n1 3\n\
  2 1\n2 2\n2 3\n3 1\n3 2\n3 3\n\n注意：内部循环的迭代次数取决于外部循环的迭代次数。\n\n### 2. 循环变体\n\n*  \
  \ `range()` 函数：`range()` 函数通常配合循环使用生成数字序列。它可以接受 `start`、`stop` 和 `step` 值。\n\n示例：\n\
  \n```python\nfor num in range(1, 10, 2):\n    print(num)\n```\n输出：\n1\n3\n5\n7\n\
  9\n\n*   `enumerate()` 函数：`enumerate()` 函数用于遍历序列，同时跟踪每个元素的索引。\n\n示例：\n\n```python\n\
  fruits = [\"apple\", \"banana\", \"cherry\"]\nfor index, fruit in enumerate(fruits):\n\
  \    print(index, fruit)\n```\n输出：\n0 apple\n1 banana\n2 cherry\n\n*   `zip()` 函数：`zip()`\
  \ 函数用于遍历多个序列，组合对应的元素。\n\n示例：\n\n```python\nnames = [\"Alice\", \"Bob\", \"Charlie\"\
  ]\nages = [25, 30, 35]\nfor name, age in zip(names, ages):\n    print(name, age)\n\
  ```\n输出：\nAlice 25\nBob 30\nCharlie 35\n\n这些循环变体为迭代过程提供了更多的灵活性和控制，允许你处理不同的场景。\n\n\
  ## 3.5 控制流练习\n\n现在你已经学习了 Python 中的控制流，是时候通过练习将知识付诸实践了。尝试解决以下练习以加深理解：\n\n1. 写一个程序检查一个数字是正数、负数还是零。\n\
