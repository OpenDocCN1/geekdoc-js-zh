  Negative\")\nelse:\n    print(\"Zero\")\n```\n\n2. 找到三个数中最大的一个解答：\n\n```python\n\
  num1 = float(input(\"Enter the first number: \"))\nnum2 = float(input(\"Enter the\
  \ second number: \"))\nnum3 = float(input(\"Enter the third number: \"))\nif num1\
  \ >= num2 and num1 >= num3:\n    print(num1)\nelif num2 >= num1 and num2 >= num3:\n\
  \    print(num2)\nelse:\n    print(num3)\n```\n\n\n\n\n\n```python\nnum3 = float(input(\"\
  Enter the third number: \"))\n\nif num1 >= num2 and num1 >= num3:\n    largest =\
  \ num1\nelif num2 >= num1 and num2 >= num3:\n    largest = num2\nelse:\n    largest\
  \ = num3\n\nprint(\"The largest number is:\", largest)\n```\n\n### 3. 打印 1 到 50\
  \ 之间所有偶数的解决方案：\n\n```python\nfor num in range(2, 51, 2):\n    print(num)\n```\n\n\
  ### 4. 询问密码直到输入正确密码的解决方案：\n\n```python\npassword = input(\"Enter the password: \"\
  )\nwhile password != \"python123\":\n    password = input(\"Incorrect password.\
  \ Try again: \")\nprint(\"Access granted!\")\n```\n\n### 5. 打印到指定项数的斐波数列的解决方案：\n\
  \n```python\nterms = int(input(\"Enter the number of terms: \"))\nnum1, num2 = 0,\
  \ 1\n\nif terms <= 0:\n    print(\"Invalid input\")\nelif terms == 1:\n    print(num1)\n\
  else:\n    print(num1, num2, end=\" \")\n    for _ in range(2, terms):\n       \
  \ next_num = num1 + num2\n        print(next_num, end=\" \")\n        num1, num2\
  \ = num2, next_num\n```\n\n### 6. 计算给定数字阶乘的解决方案：\n\n```python\nnum = int(input(\"\
