  10. 写一个程序找到 1 到 100 之间的质数。\n\n这些练习将帮助你练习并强化对 Python 控制流的理解。可以自由探索解决这些问题的不同方法和方案。\n\
  \n以下是上述控制流练习的解答：\n\n1. 检查数字是否为正数、负数或零的解答：\n\n```python\nnum = float(input(\"Enter\
