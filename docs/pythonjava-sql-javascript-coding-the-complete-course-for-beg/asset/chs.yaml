  print(filled_data)\n```\n\n# 第 11 章：数据可视化\n\n### 11.1 数据可视化简介\n\n数据可视化是对数据进行图形化表示，以获取洞察并有效地传播信息。它有助于理解数据中的模式、趋势和关系，使人类更容易解释和做出决策。数据可视化允许我们以视觉上吸引人且易于理解的形式来探索和展示复杂信息。\n\
  \n数据可视化可以使用各种类型的图表、图形、地图和投影来完成。一些常用的可视化类型包括：\n\n1. **折线图**：显示数据随时间变化的趋势或变化。\n2.\
  \ **柱状图**：使用矩形条比较不同的数据类别。\n3. **饼图**：代表整体的一部分，显示每个类别的比例。\n4. **散点图**：通过图上的点显示两个变量之间的关系。\n\
  5. **直方图**：通过条形显示连续数据的分布。\n6. **热力图**：以矩阵形式表示数据，并使用颜色指示值。\n7. **地图**：在地图上显示地理数据。\n\
  \n数据可视化是数据分析过程中不可或缺的步骤，因为它有助于理解模式、识别异常值并做出数据驱动的决策。它被广泛应用于业务、金融、营销、医疗保健和社会科学等各个领域。\n\
  \nPython 提供了几个用于数据可视化的库，包括 `Matplotlib`、`Seaborn` 和 `Plotly`。这些库提供了广泛的可定制和交互式可视化选项，以适应不同的需求和偏好。\n\
  \n### 11.2 使用 Matplotlib 库\n\nMatplotlib 是 Python 中一个流行的数据可视化库，它提供了丰富的绘图函数和选项。它是高度可定制的，允许你创建各种图表、图形和投影。\n\
  \n要使用 `Matplotlib`，你需要导入库及其 `pyplot` 模块：\n\n```python\nimport matplotlib.pyplot\
  \ as plt\n```\n\nMatplotlib 提供了两种创建图表的主要接口：MATLAB 风格接口和面向对象的接口。MATLAB 风格接口对于快速绘图更加简单方便，而面向对象的接口为高级绘图提供了更多的控制和活性。\n\
  \n这是一个使用 MATLAB 风格接口创建简单折线图的示例：\n\n```python\nimport matplotlib.pyplot as plt\n\
  # Data for x and y coordinates\nx = [1, 2, 3, 4, 5]\ny = [2, 4, 6, 8, 10]\n# Create\
  \ a line plot\nplt.plot(x, y)\n# Add labels and title\nplt.xlabel('X-axis')\nplt.ylabel('Y-axis')\n\
  plt.title('Line Plot')\n# Show the plot\nplt.show()\n```\n\n要使用面向对象的接口创建相同的折线图，你可以使用\
  \ `subplots` 函数创建一个 `Figure` 和 `Axes` 对象：\n\n```python\nimport matplotlib.pyplot\
  \ as plt\n# Data for x and y coordinates\nx = [1, 2, 3, 4, 5]\ny = [2, 4, 6, 8,\
  \ 10]\n# Create a Figure and Axes object\nfig, ax = plt.subplots()\n# Plot the data\n\
  ax.plot(x, y)\n# Add labels and title\nax.set_xlabel('X-axis')\nax.set_ylabel('Y-axis')\n\
  ax.set_title('Line Plot')\n# Show the plot\nplt.show()\n```\n\nMatplotlib 提供了许多自定义选项，例如更改线条样式、添加标记、设置轴限制、添加图例等。你可以参考\
  \ Matplotlib 文档和示例了解更多。\n\n除了折线图，Matplotlib 还支持许多其他类型的图，包括柱状图、散点图、直方图、饼图等。你可以参考\
  \ Matplotlib 文档和示例了解如何创建不同类型的可视化。\n\nMatplotlib 是 Python 中一个强大的数据可视化库，它为创建专业的图形和图表提供了坚实的基础。\n\
  \n### 11.3 创建折线图、柱状图和饼图\n\n在本节中，我们将探索如何使用 Matplotlib 库创建折线图、柱状图和饼图。\n\n1. **折线图**：\n\
  \   折线图适用于显示数据随时间变化的趋势或变化。这是一个创建折线图的示例：\n\n```python\nimport matplotlib.pyplot as\
  \ plt\n# Data for x and y coordinates\nx = [1, 2, 3, 4, 5]\ny = [2, 4, 6, 8, 10]\n\
  # Create a line plot\nplt.plot(x, y)\n# Add labels and title\nplt.xlabel('X-axis')\n\
  plt.ylabel('Y-axis')\nplt.title('Line Plot')\n# Show the plot\nplt.show()\n```\n\
  \n2. **柱状图**：\n   柱状图适用于比较不同的数据类别。这是一个创建柱状图的示例：\n\n```python\nimport matplotlib.pyplot\
  \ as plt\n# Data for x and y coordinates\nx = ['A', 'B', 'C', 'D']\ny = [10, 20,\
  \ 15, 25]\n# Create a bar chart\nplt.bar(x, y)\n# Add labels and title\nplt.xlabel('Categories')\n\
  plt.ylabel('Values')\nplt.title('Bar Chart')\n# Show the plot\nplt.show()\n```\n\
  \n3. **饼图**：\n\n\n\n\n饼图用于表示整体的各个部分，显示每个别的比例。这里有一个创建饼图的示例：\n\n```python\nimport\
  \ matplotlib.pyplot as plt\n\n# 类别及其对应的值\ncategories = ['A', 'B', 'C', 'D']\nvalues\
  \ = [30, 20, 15, 35]\n\n# 创建饼图\nplt.pie(values, labels=categories)\n\n# 添加标题\nplt.title('Pie\
  \ Chart')\n\n# 显示图表\nplt.show()\n```\n\n这些示例演示了如何使用 Matplotlib 创建折线、柱状图和饼图。你可以通过添加图例、更改颜色、调整轴限制等方式来定制这些图表。Matplotlib\
  \ 提供了广泛的选项用于自定义和增强你的可视化效果。\n\n### 11.4 使用散点图和箱线图\n\n除了折线、柱状图和饼图，Matplotlib 还提供了对散点图和箱线图的支持。这些图表适用于可视化数据点的分布和关系。\n\
  \n### 1. 散点图\n\n散点图用于通过图上的点显示两个变量之间的关系。这里是一个创建散点图的示例：\n\n```python\nimport matplotlib.pyplot\
  \ as plt\n\n# x 和 y 坐标的数据\nx = [1, 2, 3, 4, 5]\ny = [2, 4, 6, 8, 10]\n\n# 创建散点图\n\
  plt.scatter(x, y)\n\n# 添加标签和标题\nplt.xlabel('X-axis')\nplt.ylabel('Y-axis')\nplt.title('Scatter\
  \ Plot')\n\n# 显示图表\nplt.show()\n```\n\n### 2. 箱线图\n\n箱线图（称为箱须图）用于显示数据集的分布。它显示了五数摘要：最小值、第一四分位数、中位数、第三四分位数最大值。这里是一个创建箱线图的示例：\n\
  \n```python\nimport matplotlib.pyplot as plt\n\n# 箱线图数据\ndata = [10, 15, 20, 25,\
  \ 30, 35, 40, 45, 50]\n\n# 创建箱线图\nplt.boxplot(data)\n\n# 添加标签和标题\nplt.xlabel('Data')\n\
  plt.ylabel('Values')\nplt.title('Box Plot')\n\n# 显示图表\nplt.show()\n```\n\n这些示例演示了如何使用\
  \ Matplotlib 创建散点图和箱线图。你可以通过更改标记样式、添加网格线、调整轴限制等方式来定制这些图表。Matplotlib 提供了广泛的选项用于自定义和增强你的可视化效果。\n\
