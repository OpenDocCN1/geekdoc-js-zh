  \ Python 中的文件操作。\n\n# 第 7 章：面向对象编程 (OOP)\n\n### 7.1 OOP 简介\n\n面向对象编程（OOP）是一种关注创建对象（类的实例）的编程范式，允许将代码组织成可重用的模块化结构。OOP\
  \ 提供了一种基于真实世界对象及其交互来结构化程序的方法。\n\n让我们进入 OOP 的核心概念：\n\n1. **类 (Class)**：`class` 是创建对象的蓝图或模板。它定义了该类对象将拥有的属性（数据）和行为（方法）。例如，`Car`\
  \ 类可能有颜色、型号和速度等属性，以及 `accelerate`（加速）和 `brake`（刹车）等方法。\n2. **对象 (Object)**：`object`\
  \ 是 `class` 的实例。它根据类的定义表示一个特定的实体，拥有自己的属性值。例如，`Car` 类对象的颜色可以是“红色”，型号为“轿车”，速度为 50\
  \ km/h。\n3. **封装 (Encapsulation)**：封装是将数据（属性）和方法（行为）封装在 `class` 内部的过程。它允许数据隐藏和抽象，使得对象的内部细节对外部隐藏。对对象属性和方法的访问通过使用公共（public）、私有（private）和保护（protected）等访问修饰符控制。\n\
  4. **继承 (Inheritance)**：继承允许类继承另一个类（称为父类或基类）的属性和方法。自父类的称为子类或派生类。继承实现了代码重用，并促进了类之间层次关系的概念。\n\
  5. **多态 (Polymorphism)**：多态是指对象根据其使用的上下文采取不同形式或具有不同行为的能力。它允许不同类的对象被视为共同父类的对象。多态赋予了代码灵活性和可扩展性。\n\
  6. **抽象 (Abstraction)**：抽象是通过通过将复杂系统分解为更小、更易管理的组件来简化系统的过程。它涉及识别对象或系统的本质特征并隐藏不必要的细节。抽象允许创建抽象类和接口，它们定义了共同行为并为子类的实现提供了契约。\n\
  \n### 7.2 类与对象\n\n在 Python 中，类是创建对象的蓝图或模板，而对象是 `class` 的实例。类提供了一种定义属于对象的属性（数据）和方法（函数）的方法。让我们探索如何在\
  \ Python 中定义类和创建对象：\n\n1. **类定义**：要定义一个类，使用 `class` 关键字后跟类名。在类内部，你可以定义属性和方法。\n \
  \  示例：\n   ```python\n   class Car:\n       def __init__(self, color, model):\n\
  \           self.color = color\n           self.model = model\n       def accelerate(self):\n\
  \           print(\"The car is accelerating.\")\n       def brake(self):\n     \
  \      print(\"The car is braking.\")\n   ```\n2. **创建对象**：要创建一个类的对象，使用类名后跟括号。你可以将对象赋值给变量以便访问其属性和方法。\n\
  \   示例：\n   ```python\n   my_car = Car(\"red\", \"Sedan\")\n   ```\n3. **访问属性和方法**：要访问对象的属性和方法，使用点符号（`.`）后跟属性或方法名。\n\
  \   示例：\n   ```python\n   print(my_car.color)      # 输出: red\n   print(my_car.model)\
  \      # 输出: Sedan\n   my_car.accelerate()      # 输出: The car is accelerating.\n\
  \   my_car.brake()           # 输出: The car is braking.\n   ```\n4. **修改属性**：你可以通过使用点符号对其赋值新值来修改对象的属性。\n\
  \   示例：\n   ```python\n   my_car.color = \"blue\"\n   print(my_car.color)      #\
  \ 输出: blue\n   ```\n5. **类变量**：类变量被类的所有实例共享。它们定义在类内部，但在任何方法之外。使用类名或类的实例访问类变量。\n\
  \   示例：\n   ```python\n   class Car:\n       wheels = 4  # 类变量\n       def __init__(self,\
  \ color, model):\n           self.color = color\n           self.model = model\n\
  \n   print(Car.wheels) # 输出: 4\n   my_car = Car(\"red\", \"Sedan\")\n   print(my_car.wheels)\
  \ # 输出: 4\n   ```\n\n## 7.3 继承与多态\n\n继承和多态是面向对象编程（OOP）中的两个重要概念，允许代码重用和灵活性。让我们探索\
  \ Python 中继承和多态是如何工作的：\n\n1. **继承**：继承允许类继承另一个类（称为父类或基类）的属性和方法的机制。自父类的称为子类或派生类。子类可以添加新的属性和方法，也可以覆盖现有的方法。\n\
  \   示例：\n   ```python\n   class Vehicle:\n       def __init__(self, color, model):\n\
  \           self.color = color\n           self.model = model\n       def accelerate(self):\n\
  \           print(\"The vehicle is accelerating.\")\n\n   class Car(Vehicle):\n\
  \           def __init__(self, color, model, num_doors):\n           super().__init__(color,\
  \ model)\n               self.num_doors = num_doors\n       def accelerate(self):\n\
  \           print(\"The car is accelerating.\")\n\n   my_car = Car(\"red\", \"Sedan\"\
  , 4)\n   my_car.accelerate()  # 输出: The car is accelerating.\n   print(my_car.color)\
  \  # 输出: red\n   print(my_car.model)  # 输出: Sedan\n   print(my_car.num_doors) #\
  \ 输出: 4\n   ```\n\n2. **多态**：（原文此处结束）\n\n\n\n\n\n多态是指对象根据其使用的上下文呈现出不同形式或具有不同行为的能力。它允许将不同类的对象视为公共父类的对象。多态赋予了代码灵活性和扩展性。\n\
  \n示例：\n\n```python\nclass Animal:\n    def speak(self):\n        pass\n\nclass Dog(Animal):\n\
  \    def speak(self):\n        print(\"Woof!\")\n\nclass Cat(Animal):\n    def speak(self):\n\
  \        print(\"Meow!\")\n\ndef make_animal_speak(animal):\n    animal.speak()\n\
  \nmy_dog = Dog()\nmy_cat = Cat()\nmake_animal_speak(my_dog)  # Output: Woof!\nmake_animal_speak(my_cat)\
  \  # Output: Meow!\n```\n\n在上面的示例中，`Dog` 和 `Cat` 类都继承自 `Animal` 类并重写了 `speak` 方法。`make_animal_speak`\
  \ 函数接收一个 `Animal` 对象并调用其 `speak` 方法。这允许我们将 `Dog` 和 `Cat` 对象传递给函数，并根据它们对 `speak`\
  \ 方法的具体实现表现出不同的行为。\n\n继承和多态是面向对象编程（OOP）的强大特性，促进了代码复用、模块化和活性。它们允许创建类的层次结构，并使对象根据特定的类实现展现不同的行为。\n\
  \n## 7.4 封装与抽象\n\n封装和抽象是面向对象编程（OOP）中的两个重要概念，有助于组织和管理代码复杂性。让我们探索封装和抽象在 Python 中是如何工作的：\n\
  \n### 1. 封装\n封装是将数据（属性）和方法（行为）封装在类内部的过程。它允许数据隐藏和抽象，使得对象的内部细节对外部世界隐藏。对对象属性和方法的访问通过公共（public）、私有（private）和保护（protected）等访问修饰符控制。\n\
  \n在 Python 中，封装通过使用命名约定和访问修饰符来实现。按照约定，意为私有的属性和方法以下划线（`_`）开头。然而，这仅仅是一个约定，仍然可以在类外部访问这些属性或方法。\n\
  \n示例：\n\n```python\nclass Employee:\n    def __init__(self, name, salary):\n   \
  \     self._name = name      # Private attribute\n        self._salary = salary\
  \  # Private attribute\n\n    def get_name(self):\n        return self._name   \
  \   # Private method\n\n    def get_salary(self):\n        return self._salary \
  \ # Private method\n\nemployee = Employee(\"John Doe\", 5000)\nprint(employee.get_name())\
  \      # Output: John Doe\nprint(employee.get_salary())  # Output: 5000\n```\n\n\
  在上面的示例中，`_name` 和 `_salary` 属性意为私有，但仍然可以从类外部访问。`get_name` 和 `get_salary` 方法提供了对这些私有属性的受控访问。\n\
  \n### 2. 抽象\n抽象是通过将复杂系统分解为更小、更易管理的组件来简化系统的过程。它涉及识别对象或系统的基本特征并隐藏不必要的细节。抽象允许创建抽象类和接口，它们定义了共同行为并为子类的实现提供了契。在\
  \ Python 中，抽象通过使用来自 `abc` 模块的抽象基类（ABCs）来实现。ABCs 定义了子类必须实现的抽象方法。\n\n示例：\n\n```python\n\
  from abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    @abstractmethod\n\
  \    def area(self):\n        pass\n\nclass Rectangle(Shape):\n    def __init__(self,\
  \ width, height):\n        self.width = width\n        self.height = height\n\n\
  \    def area(self):\n        return self.width * self.height\n\nrectangle = Rectangle(5,\
  \ 8)\nprint(rectangle.area())  # Output: 40\n```\n\n在上面的示例中，`Shape` 类是一个抽象基类，将 `area`\
  \ 方法定义为抽象方法。`Rectangle` 类继承自 `Shape` 类并实现了 `area` 方法。这强制任何继承自 `Shape` 的类必须实现 `area`\
  \ 方法。\n\n封装和抽象是 OOP 中的重要概念，促进了代码组织、数据隐藏和模块化。它们有助于管理复杂性并创建更具维护性和可重用的代码。理解这些概念对于设计和实现有效的面向对象解决方案至关重要。\n\
