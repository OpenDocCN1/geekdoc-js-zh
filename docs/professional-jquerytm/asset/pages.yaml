    Table 8-4 lists $s.tab() methods.


    # Table 8.4: Available $s.tabs() Methods


    | METHOD | DESCRIPTION |

    | $(selector).tabs() | Initializes the tab widget on the selected element. |

    | $(selector).tabs("destroy") | Removes the tab completely. This option returns
    the selected element back to its initial state. |

    | $().).tabs("disable") | Disables the tab widget. |

    | $(selector).tabs("enable") | Enables the tab widget. |

    | $(selector).tabs("option", value) | Gets or sets the tab option. If the third
    argument is omitted, it acts as a getter. Otherwise it sets the option with the
    provided value. |

    | $(selector).tabs("widget") | Returns the ui-element. |

    | $(selector).tabs("add", label, index) | Adds a new tab widget. The second argument
    is either an identifier for an an-tab or a URL for a (Ajax) tab. The label argument
    represents the text of the label. The optional index argument is the zero-based
    index to insert the new tab. |

    | $(selector).tabs("remove", index) | Removes a tab. The second index indicates
    the tab to be removed. |

    | $(selector).tabs("enable", index) | Enables a disabled tab. As a note, the currently
    selected tab cannot be disabled. The second index indicates the tab to be enabled
    or the id selector of the associated panel. |

    | $(selector).tabs("disable", index) | Disables a tab. The second index indicates
    the tab to be disabled. |

    | $(selector).tabs("select", index) | Selects a tab, as it is selected. The second
    index indicates the tab to be selected or the id selector of the associated panel.
    |

    | $(selector).tabs("load", index) | Reloads the content of an Ajax tab. The second
    index indicates the tab to be reloaded. |

    | $(selector).tabs("url", index) | Changes the url which an Ajax tab will be loaded.
    The second index indicates the tab to be removed. The third argument is the url
    to load and the new content. |

    | $(selector).tabs("length") | Retrieves the number of the first matched tab widget.
    |

    | $(selector).tabs("abort") | Terminates all running ajax requests and animations.
    |

    | $(selector).tabs("rotate", ms, continuing) | Sets up an automatic rotation of
    tabs. The ms argument indicates the time between rotations. The third argument,
    continuing, controls whether or not the rotation continues after a tab has been
    selected by a user. |


