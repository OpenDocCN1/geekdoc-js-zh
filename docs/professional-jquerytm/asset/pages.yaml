  md: 'Basically defined, a promise is a proxy for the result of an action that will
    happen at an unspecified time in the future.


    Although they''re relatively new to jQuery, software promises have been around
    for a good while. The name and concept of promises dates back to a paper written
    in 1976 by Daniel P. Friedman and David Wise. Though language implementations
    are generally more academic than practical, library implementations exist for
    Java, Scala, Ruby, Perl, Python, and Common Lisp. Closer to home, a major JavaScript
    implementation has been in place in the dojo framework from version 0.9.


    Because they''re so easily asynchronous, they''re particularly suited to web programming,
    so it was inevitable that they''d land in jQuery.


    # The Promises/A Proposal


    jQuery''s specific implementation is based on the Promises/A proposal from CommonJS.


    CommonJS is a group centered on interoperability in JavaScript and the growth
    of a healthy JavaScript ecosystem similar to the ones that have developed around
    other languages like Python, Ruby, and Java. The group''s main focus is on the
    question of modules, which the Common JS Modules API addresses directly, they''ve
    worked on several language features. One is Promises. The CommonJS wiki lists
    several proposals for the Promises pattern. Promises/A proposal is from Kris Zip.
    It''s defined as follows:


    A promise represents the eventual value returned from the single completion of
    an operation. A promise may be one of the three states, unfilled, fulfilled, and
    failed. The promise may only move from unfilled to fulfilled, or unfulfilled to
    failed. Once a promise is fulfilled or failed, the promise''s value MUST not be
    changed The immutable characteristic of promises are important for avoiding effects
    from listeners that can create unanticipated changes in behavior and allows promises
    to be passed to other functions without affecting the caller, in same way that
    primitives can be passed to functions without any concern that the caller''s variable
    will be modified by the callee.


    A promise is defined as an object that has a function as the value for the property
    ''then''.


    ```

    http://wiki.commons.org/wiki/Promises/A

    ```


    The following code sample presents a simplified look at the concepts'
