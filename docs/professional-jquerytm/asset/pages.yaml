  md: "first match is returned. Both .get() and .index() are considered destructive\
    \ because they break a jQuery chain. A chain is broken when the method invoked\
    \ doesn't return a jQuery wrapper object, and hence the chain can't continue.\n\
    \nIt's useful to think of a chain as if it were a stack, upon calling a method,\
    \ such as .filter() or .find(), a new element is pushed onto the stack. At times\
    \ you might want to revert back to the original wrapper object. This is accomplished\
    \ with the .end() method as the following example shows:\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_93_0.png)\n\
