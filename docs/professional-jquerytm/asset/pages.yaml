  md: '# ABOUT THE AUTHORS


    **CESAR OTERO** is a freelance web developer currently living in Mountain View,
    California. His technical interests include Python, Django, JavaScript, and jQuery.
    Cesar occasionally contributes articles to IBM’s developer works. He holds a degree
    in electrical engineering from the Inter American University of Puerto Rico.


    **ROB LARSEN** has more than 12 years’ experience as a front-end engineer and
    team leader, building websites and applications for some of the world’s biggest
    brands. He is currently a Senior Specialist, Platform at Sapient Global Markets.


    Prior to his time at Sapient, Rob spent time at Isobar, The Brand Experience,
