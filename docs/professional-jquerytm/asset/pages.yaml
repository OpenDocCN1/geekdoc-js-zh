    Table 4-2 summarizes the different kind of attribute selectors.


    # TABLE 4-2: CSS Attribute Selectors


    | ATTRIBUTE SELECTOR | DESCRIPTION |

    |---|--- |

    | elem[attr] | Select elements that match attr. |

    | elem[attr=val] | Select elements that contain an attribute that have match value.
    |

    | elem[attr^=val] | Select elements that contain an attribute attr and begin with
    value val. |

    | elem[attr*=val] | Select elements with attribute values that either begin with
    val, or are equal to val |

    | elem[attr$=val] | Select elements that contain an attribute attr and end with
    value val. |

    | elem[attr!=val] | Select elements that don''t contain an attribute attr with
    value val. |

    | elem[attr~val] | Select elements that contain an attribute with a value that
    contains the word val. Words are delimited. |

    | elem[attr*=val] | Select elements that have the specific attribute members attr
    with a value containing a given substring val. |


    # Selecting by Position


    Elements can also be selected by their relation to other elements (child/parent
    relationships), or by hierarchical position in a document. Some examples might
    include the first or last items in a list, or the even rows in a table. Suppose
    you have an ordered list like the one in the following code snippet. It presents
    an ordered list of "fowl". The JavaScript that follows illustrates several variations
    on jQuery’s selectors by position. They resolve as follows:


    +   - li:even returns the even numbered members of the matched set.

    - li:odd returns the odd numbered members of the matched set.'
