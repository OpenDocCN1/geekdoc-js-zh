  md: "# APPLYING AJAX WITH JQUERY\n\nJust as you saw in the previous chapter with\
    \ event handling, jQuery abstracts away many of the details of Ajax communication.\
    \ For example, you don't have to worry about how the xhr is instantiated. The\
    \ general jQuery method used for sending Ajax calls is (drum roll...) the $.ajax()\
    \ method, which takes the form:\n\n```\n$.ajax(url, [settings]);\n```\n\nOr a\
    \ single settings object:\n\n```\n$.ajax([settings]);\n```\n\nMany of the following\
    \ examples require a server to respond to the Ajax calls. The samples include\
    \ both Python and PHP backends to support the frontend; and are freely available.\
    \ Unfortunately, explanation of either of these technologies is beyond the scope\
    \ of this book.\n\nTable 6-3 lists some of the most important available settings.\
    \ For a full list check out the online documentation at http://api.jquery.com/jquery.ajax/#jQuery-ajax-settings.\n\
    \n# Table 6-3: j$.ajax() Settings\n\n| PROPERTY | DESCRIPTION |\n| --- | --- |\n\
    | url | The URL of the request to be requested. |\n| type | The method of the\
    \ Ajax request. This will generally be a GET or a POST, although more exotic HTTP\
    \ methods like PUT or DELETE are possible, depending on browser support. |\n|\
    \ data | Data to be sent to the server. |\n| dataType | The type of data you are\
    \ expecting back from the server. The expected types are: \"XML\", \"HTML\", \"\
    script\", \"JSON\", \"JSONP\" and \"text\". |\n| success(data, textStatus, jxhr)\
    \ | A function to be called if the request succeeds. |\n| error(xhr, textStatus,\
    \ errorThrown) | A function to be called if the request fails. |\n| complete(xhr,\
    \ textStatus) | A function to be called when the Ajax request completes. |\n|\
    \ timeout | Set a timeout (in milliseconds) for the request. |\n\nThe following\
    \ example sends a post to the URL /post/2/here.html, which receives some plain\
    \ text, and the script handles on the results, or displays another error if one:\n\
    \n```\n<DOCTYPE html>\n<html>\n<head>\n<script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n<script type=\"javascript\">\n$.ajax({\n  url: \"/post/2/here.html\"\
    ,\n  dataType: \"html\",\n  success: function(r) {\n    console.log(\"made it\"\
    );\n\n```"
  merge: -1
  pgno: 137
- img_proc: true
  md: "```\n),\n  error : function(r){\n    console.log(\"Something didn't work \"\
    );\n  }\n}\n</script>\n<head>\n<body>\n</body>\n</html>\n```\n\nValid types of\
    \ data that can be returned are XML, HTML, JSON, JSONP, text and script.\n\nAs\
    \ you've seen in previous chapters, jQuery is particularly adept at traversing\
    \ DOM trees. In a situation where the server response is XML, jQuery has the $.find()\
    \ method for getting data an XML document. Say you have an Ajax call that returns\
    \ an XML document that describes a book, and you'd like to retrieve the chapter\
    \ titles. The following code illustrates a $.find() to parse some XML data and\
    \ append it into the DOM.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_138_0.png)\n\
    \n```\n<DOCTYPE html>\n<html>\n<head>\n<script src=\"http://code.jquery/jquery-1.7.1.js\"\
    ></script>\n<script type=\"text/javascript\">\n$.ajax({\n  url: \"book.html\"\
    ,\n  dataType: \"xml\",\n  success: function (data) {\n    data.find(\"chapter\"\
    ).each(function() {\n      $(\"document\").append($(this).find(\"title\").text()));\n\
    \    });\n  },\n  error: function(data) {\n    console.log(\"unable to process\
    \ request \");\n  }\n});\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n\
    > Code snippet is from ajax-find.txt\n\nThis example appends the titles to the\
    \ document body. The .find() searches an XML document for the element name specified.\
    \ Just like an HTML document, if you want to access an attribute use the .attr()\
    \ method.\n\nThese days it's fairly common to request data in JSON format, which\
    \ is completely logical considering that JSON objects are JavaScript objects.\
    \ They also have the advantage of being lighter-weight than XML data. You"
  merge: -1
  pgno: 138
- img_proc: true
  md: "could use the $.ajax() method to obtain a JSON object from the server like\
    \ this:\n\n```\n$.ajax({\n  url: \"/jsonBook.html\",n  dataType: 'json',\n  data:\
    \ data,\n  success: function( data ) {\n    // process json data\n  }\n});\n```\n\
    \nBut, jQuery provides a shortcut method for obtaining data from the server asynchronously\
    \ in JSON format — it is called $.JSON():\n\n```\n<!DOCTYPE html>\n<head>\n<script\
    \ src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n<script type=\"text/javascript\"\
    >\n$.JSON(\"/url2/get.php\",function(data, text, jXHR) {\n  // handle callback\
    \ here\n});\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\nUnfortunately,\
    \ there is no equivalent $.postJSON method.\n\nBy now, you'll notice that many\
    \ of your applications will use a common set of options. jQuery provides a method\
    \ that globally sets the Ajax options called $.Setup(). These values will be used\
    \ in any call to $.ajax() unless overridden. $.ajaxSetup() takes the form:\n\n\
    ```\n$.ajaxSetup(options);\n```\n\nwhere options is an instance whose properties\
    \ are used to set the global Ajax properties. For example, to set the default\
    \ type, dataType, and error callback:\n\n```\n$.ajaxSetup({\n  type: \"GET\",\n\
    \  dataType: \"json\",\n  error: universalGoofupFunction\n});\n```\n\nIt should\
    \ be noted that $.ajaxSetup() overrides the settings for all Ajax requests on\
    \ the page so it should be used sparsely unless you're in complete control of\
    \ all the JavaScript code running on the page.\n\nBut, before continuing this\
    \ is a good time to review a feature introduced in jQuery 1.5, which is deferred\
    \ objects. These objects are an example of the promise pattern. A promise is an\
    \ object that \"promises\" to give a value at a convenient time; this is particularly\
    \ useful for asynchronous computing. jQuery deferred objects, also based on the\
    \ promise pattern, allow chainable callback functions.\n\nDeferred objects begin\
    \ in the unresolved state, and can change from"
  merge: -1
  pgno: 139
- img_proc: true
  md: "unresolved to either resolved or rejected. Deferred objects are covered in\
    \ depth in Chapter 13.\n\nThe $.ajax() method, indeed all jQuery Ajax methods,\
    \ returns a promise object called a jXHR object, which is a superset of the XMLHttpRequest\
    \ object. This Ajax calls to be rewritten, now, as:\n\n```\n$.ajax({url: \"go/here\"\
    \n  .success(function() {/* handle success */ });\n  .complete(function() {/*\
    \ handle complete method */ });\n```\n\nThere are shortcut utility methods as\
    \ well, like $.get(), which send get and post requests, respectively. In the case\
    \ of $.get(), instead of writing:\n\n```\n$.ajax{\n  type: \"get\",\n  url: \"\
    go/here.php\",\n  data: data,\n  success: callback,\n  dataType: \"json\"\n});\n\
    ```\n\nyou can instead use:\n\n```\nvar jqxhr = $.get(\"/go/here.php\", function(data){});\n\
    ```\n\nThe general format is:\n\n```\n$.get(url, parameters, callback, type);\n\
    ```\n\nJust like $.ajax(), the $.get() method returns a jXHR object. The shortcut\
    \ for posts, $.post(), is almost identical, except for the type, of course:\n\n\
    ```\n$.post(url, parameters, callback, type);\n```\n\njQuery also has an incredibly\
    \ useful method, $.load(), for making Ajax requests and loading HTML fragments\
    \ into a matched element, all in the same call. It takes the following format:\n\
    \n```\n$(selector).load( url, [data], [success(response, status, XHR)] )\n```\n\
    \nIt accepts a url, an optional data object, which will receive a response text,\
    \ a status string, and an XMLHttpRequest object. For example:\n\n```\n$(\"#latestNews\"\
    )(\"/latest.php\", dateObj, function(resp, status, XHR){\n  if(status == \"success\"\
    ) {\n    // handle here\n  });\n```\n\nAssuming went well on the server, the latestNews\
    \ element will be loaded with the text obtained from the server.\n\nThe last example\
    \ of this chapter is a pizza order, and uses the new HTML5 controls and jQuery's\
    \ $.load() Ajax method. To accommodate customers using older browsers, you'll\
    \ employ jQuery to fill in the functionality, but also to validate and post the\
    \ order."
