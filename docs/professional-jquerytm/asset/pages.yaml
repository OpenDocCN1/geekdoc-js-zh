    \ matched set.\n\nli:gt(2) returns all elements of index greater than 2 in the\
    \ matched set.\n\nli:lt(3) returns all elements of index less than 3 in the matched\
    \ set.\n\nNote that all position selectors start their count at zero except for\
    \ the nth-child filter, which starts at 1, which we will explain in the section\n\
    \"Filtering by Relationships.\n\n\n```\n<ol id=\"fowl\">\n  &lt;li&gt;Turkey&lt;/li&gt;\
