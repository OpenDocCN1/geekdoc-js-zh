  md: 'use direct lookups to the href attribute of each element instead of attr().
    As Table 10-6 shows, even with this simple example, using native methods is faster
    in all major browsers.


    # TABLE 10-6: Going Naive (Higher is Better)


    | | FF8 | IE6 | IE7 | IE8 |

    |---|---|---|---||

    | Native | 8,153 | 798 | 4,565 | 4,431 |

    | jQuery Methods | 5,954 | 575 | 3,537 | 3,778 |

    | | IE9 | SAFARI 5 | CHROME 15 |

    |---|---|---|---|

    | Native | 7,512 | 14,905 | 11,796 |

    | jQuery Methods | 6,532 | 12,166 | 10,801 |


    Clearly, this isn''t going to be an option for every statement as there are cross-browser
    issues and lose the ability to chain methods. If it was possible for everything,
    you wouldn''t be using jQuery in the first place. It''s just a good idea to know
    where you can fall back to the native methods to get a performance tweak. Simple
    property lookups to grab a string for later manipulation or to test against (this.id,
    this.className) are a common area, but look for examples in your own code. If
    performance becomes an issue, there might be easy gains waiting for you.


    # DRY


    “Don’t repeat yourself” (or DRY) is an oft-repeated mantra in software development.
    It''s an important principle for maintenance and performance. With the simple
    elegance of the jQuery API, it''s important stylistically as well. One place where
    jquery can encourage repetition is with the liberal use of anonymous functions.
    Because it''s so common to pass an anonymous function in an event handler, it''s
    not uncommon to see several short functions doing the same thing in a block of
    code. Although this may feel fast and convenient in the short term, it''s in your
    best long-term interest to simplify the repeated code. You don''t want to wade
    through thousands lines later to make edits to similar code that lives in five
    places in your application.


    A typical example is shown in Listing 10-5. The function changes the class of
    the bound element, fires off an Ajax request, and then shows a jQuery UI dialog
    indicating the results of the request. Writing it once as an anonymous function
    makes sense. It''s short and full of common code. If it appears several times
    throughout your site, it''s time to simplify.'
