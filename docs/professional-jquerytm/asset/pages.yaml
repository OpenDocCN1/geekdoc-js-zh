    As you can see, this new event API simplifies the way jQuery handles events. All
    the power and convenience you''ve learned in this chapter is still available,
    it''s just presented in a more straightforward, consistent manner.


    # SUMMARY


    At this point your jQuery scripts are taking on a whole new dimension. You can
    select elements in any number of ways, traverse the DOM, manipulate the classes
    and attributes of any element, and apply a uniform event-handling mechanism, independent
    of browser types.


    In this chapter you also learned the historical differences of how event handling
    is different across browsers; about event propagation, the Event object, and how
    jQuery helps cut through the haze and deliver a simple solution to managing events
    easily. Finally, you put together all this event know into a useful example.


    In the next step of your journey, you''ll use your knowledge of events to work
    with data and forms, and learn about submission of forms via Ajax, a cornerstone
    of modern web development.


