  md: "class/object-based inheritance. A built-in object, Object.prototype, is inherited\
    \ by all other objects, and is at the top of the inheritance hierarchy. Each object\
    \ in an inheritance tree is linked by the prototype property.\n\nProperty retrieval\
    \ occurs through delegation. Upon attempting to retrieve a nonexistent property,\
    \ JavaScript looks for the property from the prototype object. If it fails to\
    \ find the property, it runs up the prototype tree looking for the property, until\
    \ it reaches the primordial Object.prototype. After that, if it can't find the\
    \ property in question, the interpreter gives up and returns undefined.\n\nFunctions\
    \ that are properties of objects are called methods, which are either added to\
    \ an object by assignment to the prototype object, or directly. Methods always\
    \ receive a free argument, bound in the function scope as this, which refers to\
    \ the method it was invoked from. The following code snippet shows an example\
    \ of prototype-based inheritance. Behind the scenes, a Monster.prototype object\
    \ is created.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_34_0.png)\n\n```\nfunction\
    \ Monster( type ) {\n  this.type = type;\n}\n\nMonster.prototype.getType = function(){\n\
    \  return this.type;\n}\n\nfunction Zombie( name ) {\n  this.name = name;\n}\n\
    \nZombie.prototype = new Monster();\n\nZombie.prototype.eatPeople = function(){\n\
    \  console.log('tastes like chicken ');\n}\n```\n\n> Code snippet is from prototype.txt\n\
    \nA reference is a pointer to the location of an object instance. Objects are\
    \ reference types and because all objects are passed by reference, changing a\
