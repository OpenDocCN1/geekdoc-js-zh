    \n//kicked off with the ready() function\n$( document ).ready(myAppInit)\n\n>\
    \ Code snippet is from multiple-functions.txt\n\nThough there's nothing wrong\
    \ about this pattern in a technical sense, it does present some compatibility\
    \ hurdles.\n\nTo see the compatibility issues, you can just pop open Firefox and\
    \ navigate to the DOM tab. There'll see all the functions created available in\
    \ the global namespace. This is illustrated in Figure 10-1.\n\n# FIGURE 10-1\n\
    \n![](img/8acf2bc7faf21ccdde2b9192aee791a5_206_0.png)\n\nIt doesn't take long\
    \ for a JavaScript developer to discover that populating the global namespace\
    \ with multiple variables can cause issues. For an obvious example, imagine naming\
    \ a variable i__, or $ in the global namespace. That's going to cause a problem\
    \ somewhere down the line.\n\nMore obscure names might be safer, but they're still\
    \ not safe, so dont naming your variables after characters from Jabberwocky is\
    \ going to save you from variable collisions.\n\nJust wait until you have two\
    \ Lewis Carroll freaks on a project.\n\nSo, instead of merely dropping a series\
    \ of functions into a global namespace, you can alternatively leverage a single\
    \ variable to hold all of your application code. In the simplest example, this\
