  md: "# Chapter 6\n\n# HTML Forms, Data, and Ajax\n\n# WHAT’S IN THIS CHAPTER?\n\n\
    +   - jQuery Data Appreciation\n- Validating Forms With jQuery\n- Using jQuery’s\
    \ Ajax Methods\n\nThe three main topics of this chapter are closely related cousins.\
    \ HTML forms contain and process data, an everyday operation of the Web. More\
    \ often than not, form data is processed and posted to a server somewhere asynchronously,\
    \ rather than the old-fashioned post-process-reload technique. Here, you explore\
    \ one of the biggest revolutions in web development of the past 10 years — Ajax.\
    \ You also learn how insanely easy jQuery makes it, simplifying asynchronous communication\
    \ with the server side.\n\n# JQUERY DATA APPRECIATION\n\nAn often misused feature\
    \ of tag elements is using attributes as alt or class to attach useful data to\
    \ an element. For example:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <script\
    \ src=\"http://code.jquery.com/jquery-1.6.1.js\"></script>\n  <script type=\"\
    text/javascript\">\n  $(function() {\n    $(\"#randomEl\").attr(\"alt\", \"1999\"\
    );\n  });\n  </script>\n</head>\n<body>\n  <img src=\"usefulImage.jpg\" id=\"\
    randomEl\">\\n</body>\n</html>\n```\n\nJust for the record, we’re aware of the\
    \ fact that we can assign “1999” directly to the alt attribute, but just suppose\
    \ you need to add the string programmatically. There’s a semantic problem with\
    \ this because the attribute used to store the data isn’t meaningfully associated.\
    \ 1999 is a year, a random integer, or what? A better approach is to use jQuery’s"
