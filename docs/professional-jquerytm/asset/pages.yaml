  md: "to mention the Modernizr library. It can greatly simplify the task of detecting\
    \ browser features that aren't yet implemented in all mainstream browsers. Instead\
    \ of relying on the old-school method of User Agent (UA) Sniffing, detecting a\
    \ browser’s capabilities based on the unreliable navigator.userAgent string, feature\
    \ detection tests for specific browser capabilities. This is a much more future-proof\
    \ and user-friendly method of feature testing. It doesn't matter if some new browser\
    \ appears or version of Chrome or Firefox hits the Web with a novel navigator.userAgent\
    \ string. If the feature is supported, Modernizr will report it as available.\n\
    \nFor example, you could use Modernizr to detect if a browser supports the canvas\
    \ element: In this sample, you'll see one of the great features of Modernizr.\
    \ For every feature it detects it stores a Boolean flag in the Modernizr object\
    \ representing the result of the test. In this example, with supporting browsers,\
    \ Modernizr.canvas will evaluate to. In addition to this Modernizr also adds CSS\
    \ classes to the html element indicating the availability of features.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_129_0.png)\n\
    \n```\n<DOCTYPE html><html><head><script src=\"http://code.jquery.com/jquery-1.6.1.js\"\
    ></script><!-- modernizr --><script src=\"http://ajax.cdnjs.com/ajax/libs/modernizr/1.7.min.js\"\
    ></script><script type=\"text/javascript\">\nif(Modernizr.canvas){\n    // code\
    \ that depends on canvas here\n} else {\n    // oops, canvas doesn't exist, deal\
    \ with situation\n}\n</script><body></body></html>\n```\n\nCode snippet is from\
    \ modernizr.txt\n\nAnywhere I need to use Modernizr, we need to link the code\
    \ using the public JavaScript CDN ajax.cdnjs.com. Let’s put Modernizr to some\
    \ use. Another great feature of HTML5 forms is the required field flag. For example,\
    \ the following form:\n\n```\n<DOCTYPE html>\n```"
