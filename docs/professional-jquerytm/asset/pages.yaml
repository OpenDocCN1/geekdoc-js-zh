    If you''re comfortable with the concepts of unit testing in general, getting up
    and running with QUnit is relatively straightforward. The following section outlines
    the key structure of QUnit testing and illustrates the basic assertions you''ll
    use to test your code.


    # The QUnit Hello World using equal


    The following file shows a bare-bones QUnit test. It contains a copy of jQuery,
    a copy of the QUnit script file, a copy of the QUnit CSS file, and some script
    and markup that make up the body of the test itself.


    The script block uses the QUnit method. test does what the name implies — it sets
    up a test to run. Here it accepts a pair of arguments, a name, "Hello World,"
    and a function that actually represents the test. The function argument itself
    uses the QUnit function equal. In unit testing terminology, equal is referred
    to as an assertion. An assertion indicates what you expect the code to do. As
    the name implies, equals equivalence. It accepts three arguments: an actual variable
    to be tested, the asserted expected value, and a message to display alongside
    the assertion.


    The markup contains several QUnit-specific HTML elements:

    qunit-header contains the name of the test suite.

    qunit-banner shows up red with a failing test and green if all tests pass.


    #qunit-userAgent displays the navigator.userAgent property.

    qunit-tests is a container for the test results.

    #qunit-fixture is where you place and manipulate your test markup.

    You learn more about #qunit-fixture in a later section.


