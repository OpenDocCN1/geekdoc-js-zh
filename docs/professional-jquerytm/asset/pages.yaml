  md: "# Using asyncTest\n\nLike the convenience methods available with $.Ajax, QUnit\
    \ has a convenience method for the common pattern of starting a test, and then\
    \ stopping it for an asynchronous action.\n\nThe following code sample shows the\
    \ previous example rewritten with that convenience method, asyncTest:\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_298_0.png)\n\
    \n```\nasyncTest(\"async\", function() {\n  expect(2);\n\n  $.JSON(\"/data/json/\"\
    , function(data) {\n    ok(data, \"We expect to get data from the server\");\n\
    \    equal(data.name, \"Testing\", \"We expect the name to match\");\n\n    start();\n\
    \  });\n});\n```\n\n> Code snippet is from asynctest.html\n\nThis is a definitely\
    \ a recommended option. It guarantees your asynchronous tests will be set up correctly\
    \ and will allow you to differentiate between regular and asynchronous tests.\
    \ Doing so will make your tests more readable. Other developers will know, without\
    \ reading any of the assertions or other logic within the test body, that this\
    \ is an asynchronous test.\n\n# Mocking Ajax Requests\n\nThough it's possible\
    \ to test Ajax requests with live data, it's not recommended. As you will remember\
    \ from earlier in the chapter, one of the fundamentals of unit testing is that\
    \ tests are self-contained. To that end, it's a best practice to mock your Ajax\
    \ requests.\n\nThankfully, there's a plugin already available to just that in\
    \ QUnit."
  merge: -1
  pgno: 298
- img_proc: true
  md: "Mockjax from the fine folks at appendto (https://github.com/append/jquery-mockjax)\
    \ allows you to set up URLs that will be captured by the Mockjax plugin. Doing\
    \ so means they'll be intercepted before they hit the traditional Ajax method\
    \ and the response will be handled by Mockjax. Mockjax allows you to craft a testable\
    \ response and customize it with headers of your own design.\n\nRewriting the\
    \ previous example to better follow testing practices, the following example shows\
    \ how to wire up a proper, testable Ajax request with Mockjax.\n\nIn this example,\
    \ the Mockjax plugin takes three arguments: the url to be captured and mapped\
    \ to Mockjax, the responseTime, and the responseText, which, in this case, will\
    \ be converted to the JSON data into any successful Ajax callback methods.\n\n\
    With Mockjax, the test is now self-contained.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_299_0.png)\n\
    \n```\nAvailable for download on\nW3schools.com\ntest(\"async\", function() {\n\
    \  expect(2)\n  $.mockjax({\n    url: '/data/json/',\n    responseTime: 100,\n\
    \    responseText: {\n      status: 'success',\n      name: 'Testing'\n    }\n\
    \  })\n});\nstop();\n$.getJSON(\"/data/json/\", function(data) {\n  ok(data, \"\
    We expect to get data from the server\");\n  equal(data.name, \"Testing\", \"\
    We expect the name match\");\n  start();\n});\n```\n\n> Code snippet is from mockjax.html\n\
    \nEven without an Internet connection or a completed data service, the test will\
    \ pass. This allows you to test your code without worrying about the state of\
    \ other parts of the system. If you're working in a large team, this ability to\
    \ write to an interface without the interface existing is invaluable. Figure 14-11\
    \ shows a completed test using mockjax.\n\n# FIGURE 14-11"
