  md: '# UNDERSTANDING NUMBERS


    Like any other programming language, JavaScript manipulates values such as numbers
    or text. The kinds of values a language can work with are its data types. JavaScript
    supports the basic data types of number and string. All numbers are 64-bit double-precision,
    and range from -5e-324 to 1.79769313486235e308. In other words, there''s no difference
    between integers and floating-point numbers; they are both just numbers. The following
    example uses the typeof operator to demonstrate:


    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_25_0.png)


    ```

    Available for

    down download on

    W3.com

    > typeof 1;

    number

    > typeof 1.5;

    number

    ```


    > Code snippet is from typeof.txt


    All JavaScript numbers are represented in binary as IEEE-754 Doubles. That also
    means you should apply some caution when doing arithmetic. For example, if you
    are summing two number values that, in your mind, represent a currency operation,
    you may get very unexpected results, as shown in the following code:


    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_25_1.png)


    ```

    Available for

    down download on

    W3.com

    > .1 + .2

    0.30000000000000004

    ```


    > Code snippet is from unexpected-addition.txt


    Unfortunately, JavaScript has no built-in decimal type. The language offers two
    methods on Number, toPrecision, and toFixed, which will format a number using
    a fixed number of decimal places. The following code shows in action:


    ```

    >var num = 1234.12345123;

    >num.toFixed(2);

    1234.12


    var num2 = 1234.12345123 ;

    num2.toPrecision(8);

    1234.1234

    ```


    > Code snippet is from decimal.txt


    If you use a number, or obtain a result, out of the 64-bit range, JavaScript returns
    a special number called Infinity, or -Infinity. Division'
