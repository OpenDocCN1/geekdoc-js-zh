    To install Firebug, go to Tools -> Add Ons on the menu bar, click Get Add Ons
    search for Firebug. Click Add To Firefox. After installing, you will notice a
    bug icon at the bottom right of the window. Click it to open the Firebug explorer.

    You''ll notice Firebug includes six tabs: Console, HTML, CSS, Script, DOM, and
    .NET. Each tab contains features to simplify your life as a web developer.

    The Console tab provides an output interface for viewing and error messages, logs,
    debugging information, general info, and XMLHttpRequest Request and response objects.

    Firebug loads into the global namespace an object called console. Use this object
    to log console messages of the inner workings of your application. The console
    object contains several methods, which you can check out at http://getfirebug.com/wiki/index.php/Console_API.


    Table 1-5 lists a subset of methods contained by the console object with descriptions
    provided by the Firebug Wiki.


    # TABLE 1-5: Some Console Object Methods


    | METHOD | DESCRIPTION |

    | console.log(object, ... ) | Writes a message to the console. |

    | console.debug(object, ... ) | Writes a message to the console, including a hyperlink
    to the line where it was called. |

    | console.info(object, ... ) | Writes a message to the console with the visual
    "info" icon and color coding and a hyperlink to the line where it was called.
    |

    | console.warn(object, ... ) | Writes a message to the console with the visual
    "warning" icon and color coding and a hyperlink to the line where it was called.
    |

    | console.error(object, ... ) | Writes a message to the console with the visual
    "error" icon and color coding and a hyperlink to the line where it was called.
    |

    | console.assert(expression(, ... ) | Tests that an expression is true. If not,
    it will write a message to the console object and throw an exception. |

    | console.clear() | Clears the console. |


    The profiler is used for performance analysis of your application.'
