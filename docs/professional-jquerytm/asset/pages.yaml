    http://code.jquery.com/jquery-1.7.1.min.js\"></script>\n  <script>\n    function\
    \ fib() {\n      return Deferred.defer(function() {\n        var int1 = 0;\n \
    \       var int2 = 1;\n        var int3, sequence = \"<li>\";\n        for (var\
    \ i = 3; i <= 100; i++) {\n          int3 = int1 + int2;\n          int1 = int2;\n\
    \          int2 = int3;\n          sequence += \"<li>\" + int3 + \"</li>\";\n\
    \        }\n        $(\"#numbers\").append(sequence).show(1000, this.resolve);\n\
    \      }).promise();\n    });\n}\n\n    function success() {\n      $(\"h1\").text(\"\
    Fibonacci!\");\n    }\n    function failure() {\n      $(\"h1\").text(\"No numbers?\"\
