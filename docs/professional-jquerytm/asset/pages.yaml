  md: "# Filtering by Visibility\n\njQuery determines whether an element is visible\
    \ depending on the properties offsetWidth and offsetHeight. If both are zero,\
    \ the element is considered hidden. If an element's visibility is toggled directly\
    \ changing its styling from display:block; to display:none; jQuery will detect\
    \ those as visible/invisible, respectively. Use the :hidden and visible filters\
    \ to match each type. The next example demonstrates usage of the visible and hidden\
    \ filters.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_83_0.png)\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n</head>\n<script>\n$(function() {\n  var numInv = $(\":text:hidden\"\
    ).length;\n  var numVisis = $(\":text:visible\").length;\n  console.log(numInv);\n\
    \  console.log(numVisis);\n});\n</script>\n</head>\n<body>\n<form name=\"text\"\
    \ method=\"post\">\n<input type=\"text\" name=\"text1\" style=\"display:none\"\
    ;/>\n<input type=\"text\" name=\"text2\" style=\"offsetLeft:0; offsetHeight:0\"\
    ;/>\n<input type=\"text\" name=\"text3\" style=\"display:block\";/>\n</form>\n\
    </body>\n</html>\n```\n\n> Code snippet from visibility-filters.txt\n\n# TABLE\
    \ 4-5: Visibility Filters\n\n| TYPE | DESCRIPTION |\n| --- | --- |\n| :hidden\
    \ Selector | Selects all elements that are hidden. |\n| :visible Selector | Selects\
    \ all elements that are visible. |\n\n# Filtering by Content\n\nSometimes you\
    \ may want to select according to what an element does (or doesn't) contain; for\
    \ example, some text. Using the :contains filter you can select an element that\
    \ contains a matching text directly inside the"
