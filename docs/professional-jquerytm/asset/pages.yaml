    “Not a Number” which is a “toxic value” that is often the source of bugs.

    NaNs occur when attempting to cast an invalid string object to a number.

    It has a viral nature; in other words, performing an operation between

    numbers and a NaN returns a NaN. You can test if a variable is a NaN by

    using the built-in isNaN function.


    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_26_0.png)


    ```

    var x = NaN;

    >isNaN(x);

    true

    ```


    Code snippet is from isNaN.txt


    JavaScript supports Octal (base 8) and Hexadecimal (base 16) numbers

    as well. Octal literals are prefixed with a 0 (zero), and Hexadecimal

    numbers are prefixed with an x.


    Javascript has a built-in Math object for common math operations. For

    example, you can use the Math.round() method to get a two decimal point

    accuracy.


    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_26_1.png)


    Code snippet is from math-round.txt


    Making good use of the built-in objects can save time and effort.


    # WORKING WITH STRINGS


    Strings are a series of zero or more 16-bit unicode characters enclosed by

    either single quotes or double quotes. I emphasize unicode because of its

    importance in internationalization. There is no special data type for

    characters. Strings are also (immutable) objects, and hence have methods

    properties as well.


    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_26_2.png)'
