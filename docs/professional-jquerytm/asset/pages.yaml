    \ is useful, but several other features are available that allow for greater control.\n\
    \n# ## Adding Simple Logic to Your Templates with {{if}} {{else}}\n\n{{if}} and\
    \ {{else}} provide conditional inclusion of content in templates. It renders content\
    \ between the {{if}} and closing {{/if}} tag only if a provided value is not null.\
    \ {{else}} indicates alternative content to be rendered if the provided expression\
    \ is false. The following example illustrates using {{if}} and {{else}} to conditionally\
    \ include a thumbnail image. If the thumbnail isn't in the data source, a default\
    \ image will be included.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_229_0.png)\n\
