    \ majority of the hard work to do properly (setting up a fallback validation service\
    \ on the server) is outside the scope of a book like this.\n\nThe customer is\
    \ not required to register for the pizza shop in order to get a pizza, but must\
    \ fill out several fields. The order form will have the following fields:\n\n\
    +   - first name\n- last name\n- address\n- state\n- zip\n- phone\n- e-mail\n\
    - time of delivery\n- cc type\n- cc number\n- pizza size\n- toppings\n\nFirst\
