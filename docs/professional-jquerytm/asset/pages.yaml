  md: "Profiling is as simple as clicking a button. Load your page, click the Profile\
    \ button under the Console tab, use your application for a while, and click the\
    \ Profile button again to generate a report.\n\nThe HTML tab enables you to peruse\
    \ the DOM and edit HTML code “on the fly.” The tags are displayed in a tree widget,\
    \ which expands to show the children of each node. The CSS tab also enables editing\
    \ of styles and layout, while neatly displaying the values of each cascading style\
    \ sheet.\n\nPerhaps one of FireBug's most useful features is the interactive command\
    \ line, which allows execution of JavaScript code in the context of the web page\
    \ you're developing. There's no need to manually load jQuery and other dependencies.\
    \ The console also has command completion. The Script tab also has the ability\
    \ to add/remove breakpoints, view stack traces, and watch variable values over.\n\
    \nIt's also possible to use FireBug with other browsers via FireBug Lite. To do\
    \ so, include in your HTML a script tag that links to the .js file online:\n\n\
    ```\n<script src=\"https://firebug.com/firebug-lite.js\"></script>\n```\n\nAlong\
    \ with Firefox, Live HTTP Headers, another Firefox plugin, gives a nice rounded\
    \ view of the data flowing in and about your application. The “Live” means the\
    \ HTTP header information is displayed in real time.\n\nTo install, follow the\
    \ same procedure you used for Firebug. After installing, you can access Live HTTP\
    \ Headers from the menu bar by selecting Tools ⇒ Live HTTP Headers. A dialog displays\
    \ the requests with all kinds of useful debug information as server type, encoding\
    \ cookies, hosts, and so on. The replay feature enables you to edit request headers\
    \ and resend a URL, for debugging Ajax.\n\nWhen trying to load JSON data directly\
    \ from Firefox, the default behavior of the browser is to give you a Download\
