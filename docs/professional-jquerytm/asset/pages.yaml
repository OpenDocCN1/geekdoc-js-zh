  md: 'provide the highest degree of interoperability between your code and the rest
    of the jQuery environment in which your code is running. This first section goes
    through some important plugin fundamentals.


    # Applying jQuery Plugin Naming Conventions


    Imagine that after reading this chapter, you''re full of knowledge about plugin
    development and you''re happy to be sitting down to write your first jQuery plugin.
    You fire up your favorite editor or IDE, and create a new script file. Depending
    on your editor of choice, you may have the option of creating a filename and then
    you or not may have the option until you save. Regardless of the reality in your
    particular editor, you''ll want to know in advance how to name your files. The
    answer is straightforward, but it''s nice to be prepared.


    Generally, jQuery plugins are named with the following pattern:


    ```

    jquery.pluginName

    ```


    Minified versions are similarly named, adding a min flag:


    ```

    jquery.pluginName.min

    ```


    The reasoning for including jquery in the name is simple. It''s a jQuery plugin,
    so it''s convenient to indicate compatibility right in the filename. Some plugins
    may come with support for multiple libraries, so this is an important touch.


    Adding the .min. to minified versions allows for two versions to exist side by
    side, which is very handy because it enables developers to switch between full
    and minified versions while debugging.


    # How to Extend jQuery


    Now that you know how to name your files, it''s time to actually get down to the
    business of extending jQuery.


    jQuery offers two separate, simple patterns for extending jQuery and one more
    complicated, but very powerful, option to extend jQuery.


    The first, and most common, is a simple alias for the prototype property of the
    jQuery function, jquery.fn. The second is the method jquery.extend(). The third,
    more complicated option is the powerful jQuery UI Widget Factory.


    # Using jQuery.fn


    If you''ve ever looked at the jQuery source, you''ll have seen the following very
    early in the source code. As of version 1.7.1, it''s visible on line 97:'
