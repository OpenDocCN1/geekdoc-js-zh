    \n# ANIMATIONS WITH HTML5 CANVAS\n\nIf we said it, we'll say it again. Recent\
    \ developments on the Web have made giving a site that extra \"wow\" effect just\
    \ that much easier. One of the big additions to HTML5 is the canvas tag. This\
    \ element creates a space for drawing bitmap images in HTML. The markup for canvas\
    \ is as minimalistic as it gets:\n\n```\n<canvas id=\"drawingSpace\" width=\"\
    300\" height=\"200\"></canvas>\n```\n\nTo get any real out of canvas, you'll need\
    \ JavaScript. The following example demonstrates how to create a rectangle:\n\n\
    ```\nfunction(ctx) {\nvar rect_ctx = $(canvas)[0].getContext(\"2d\");\nrect_ctx.fillRect(10,\
    \ 10, 50, 50);\n}\n```\n\nThe canvas object is selected, and used to get a handle\
    \ on its context. Then the context is used to draw a rectangle at the point (10,\
    \ 10) with a width of 50 and a height of 50. The context is an object that contains\
    \ all of the drawing methods and properties for the canvas. In the previous example,\
    \ you use the fillRect() method to create a rectangle using the system default\
    \ color black.\n\nThe coordinate system used by canvas has its origin at the top-left\
    \ corner of the browser window with an increasing x value toward the right and\
    \ an increasing y value downward. Figure 7-3 illustrates this system."
