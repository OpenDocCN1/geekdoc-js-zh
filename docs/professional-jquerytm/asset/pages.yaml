    \ a wrapped set, and jQuery has precisely those shortcuts as the following code\
    \ example demonstrates:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"\
    http://code.jquery.com/jquery-1.7.1.js\"></script>\n<script>\n$(function() {\n\
    \  var listElements = $(\"li\");\n  var firstEl = listElements.first();\n  var\
    \ lastEl = listElements.last();\n\n  console.log(\"first value:\" + firstEl.html());\n\
    \  console.log(\"first length:\" + firstEl.length);\n\n  console.log(\"last value:\"\
    \ + lastEl.html());\n  console.log(\"last length:\" + lastEl.length);\n});\n</script>\n\
    </head>\n<body>\n<ul>\n<li>eggs</li>\n<li>bacon</li>\n<li>ham</li>\n</ul>\n</body>\n\
    </html>\n```\n\n> Code snippet is from children.txt\n\nHere you have an unordered\
    \ list with three items: eggs, bacon, and ham.\nUsing the jQuery function, all\
