  md: "JavaScript Style Guide specifies the following:\n\n+   - Declarations of variables\
    \ always use var, except intentionally creating a global variable.\n- Always use\
    \ semicolons. This is important for minifying code.\n- Constants are uppercase,\
    \ with each word separated by underscore.\n- Functions, variables, and method\
    \ names all use camel case notation with the first letter lowercase.\n- Classes\
    \ and enum names also use camel case notation but with the first letter uppercase.\n\
    - The big exception to any of these rules is when an example demonstrates how\
    \ not to do something.\n\nThe jQuery team also published a set of conventions\
    \ for development of the core library. The documentation mentions the following:\n\
    \n+   - **Spacing code:** Abundantly use spacing, using tabs to indent code. Don't\
    \ use white spaces at the end of lines and empty lines should not have spaces\
    \ either. This illustrates the preferred spacing.\n- **Using comments:** For multiple-line\
    \ comments use /* */ and for single-line comments use //, with an empty line above\
    \ the comment. The single-line comment precedes the comment that it refers to,\
    \ and should be the only thing on the line.\n\n```\nif ( test === \"string\" {\n\
    \  methodCall(\"see\", \"our\", \"spacing\");\n}\n```\n\n```\n// my comment\n\
    var x = 'blah';\n```\n\n```\nvar x = 'blah'; // bad\n```\n\n+   - **Equality:**\
    \ Always use identity (===) comparison over simple quality (==). The jQuery team\
    \ makes the exception of using simple equality testing for null. As the guidelines\
    \ say, “It's actually useful to do == null || null as it will pass (or fail) if\
    \ the value is null or undefined.\\n- **Block presentation:** Always use braces\
    \ for control constructs (if/else/for/while/try), and distribute over multiple\
    \ lines. Don't use the one liner without braces. Braces should always be placed\
    \ on the same line as else/else if/catch. It's also suggested to avoid replacing\
    \ if/else statements with ternary operators. Here are some examples:\n\n```\n\
    // bad\nif( stuffHappens ) alert('blaaah');\n```\n\n```\n// good\nif( stuffHappens\
    \ ) {\n```"
