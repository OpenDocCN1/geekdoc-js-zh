  md: '# Using HTML5 Data Attributes Instead of CSS Classes and IDs


    Jason Garber’s variation is very similar, with the key difference that it uses
    HTML5 data attributes to trigger the execution.


    If you''re unfamiliar with them, HTML5 data attributes are defined methods for
    storing custom data in HTML attributes. Application developers have had long stored
    string data in custom attributes, so this is a case of the Web Hypertext Application
    Technology Working Group (WHATWG) “paving the cowpaths” and standardizing common
    developer behavior. The benefit of standardization is the data-* prefix allows
    for predictable programmatic access to the custom attributes. You learn more about
    that in an upcoming section, but for now, you see the slight difference in the
    body tag:


    ```

    <body data-controller="dashboard" data-action="render">

    ```


    Instead using CSS classes and IDs, this method maps controllers to actions. This
    is a very elegant method, especially if you''re building a Ruby on Rails (or similar)
    application where consistent naming conventions are a high priority. It also allows
    body IDs and classes to be used for other methods, if the needs arises.


    The one downside is that leveraging data attributes for section-specific styling
    is awkward. In a sense, it''s a choice of where the one-to-one correspondence
    will be — on the server with your Ruby on Rails controllers or actions or in your
    CSS file with section-specific classes and IDs.


    Regardless of what specific example you choose, this pattern provides an elegant
    addition to your toolset, adding a consistent, scalable, and maintainable method
    of running code on $(document).ready().


    # USING $.DATA()


    As you saw in the previous section, the new HTML5 data attribute is designed for
    structured, programmatic access to custom attributes. jQuery provides a straightforward
    method to do that with $.data(). Any data attributes on an HTML element are immediately
    available to be retrieved with $.data(). That''s extremely convenient, $.data()
    also provides the ability to bind any data to a DOM element. This allows arrays
    and complicated objects to be stored as well as the string values previously possible
    with hand-rolled custom attributes. It should be noted'
  merge: -1
  pgno: 214
- img_proc: true
  md: "that while $.data() can read HTML5 attributes, it doesn't actually write values\
    \ to elements in the form of data- attributes. This makes sense because arbitrary\
    \ arrays and objects don't lend themselves to being stored as string values of\
    \ HTML attributes.\n\nThis is extremely powerful, and if you've been doing this\
    \ for a while, it should feel like something you've been searching for your whole\
    \ career.\n\nIf you've ever passed an object as an argument between several methods,\
    \ you'll be happy to know you'll never have to do that again if you learn to embrace\
    \ the $.data() method. Gone are the days of managing application state with function\
    \ arguments spreading across a half dozen calls. Now, you can simply bind or component\
    \ data directly on the DOM element itself for convenient, direct access throughout\
    \ the application life cycle.\n\nAdditionally, it's important to note that the\
    \ data API stores data in a way that's safe from circular references, which prevents\
    \ memory leaks.\n\nA note on support: HTML5 data attribute support was added in\
    \ jQuery 1.4.3 and a revision was released to match the W3C spec more closely\
    \ in jQuery 1.6.\n\n# The Basics of the .data() API\n\nLike many jQuery methods,\
    \ $.data() can be used as both a setter and a getter. If two arguments, as a name/value\
    \ pair, or an object of name/value pairs is passed in, $.data() will set the data\
