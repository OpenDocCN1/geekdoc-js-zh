  md: 'Code snippet is from no-chaining.txt


    Here you have three calls to the jQuery function; each selects an element from
    the DOM and performs some operation like adding or removing a CSS class to an
    element. There''s not actually anything wrong but there is a more efficient method.
    A call to the jQuery function with a selector argument returns an instance of
    a jQuery object with a collection of selected DOM elements.


    Several jQuery methods also return wrapped objects. For example:

    $(''body'').find(''div'');


    Because .find() returns another wrapped object, you can do successive method invocation
    like:

    $(''body'').find(''div'').addClass(''cssClass'');


    This is called chaining and it''s not unusual to see long jQuery method chains.
    Besides readability, it also has a performance advantage over instantiating a
    new jQuery object, searching through the DOM, and then applying a method. Here''s
    the rewrite example using chaining instead of separate instances:


    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_64_0.png)


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <style type="text/css">

    .class1 {

    color: "white",

    background-color: "black",

    width:200px,

    height:100px

    }

    .class2 {

    color: "yellow",

    background-color: "red",

    width:100px,

    height:200px

    }

    </style>

    <script type="text/javascript" src="jquery.js"></script>

    $(function() {

    .addClass("class1")

    .find("myDiv")

    .removeClass("class1")

    .addClass("class1")

    });

    </script>

    ```'
