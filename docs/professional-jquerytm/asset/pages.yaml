    function failed() {

    //Error!

    }


    promise then(

    unfulfilled,

    fulfilled,

    failed

    );

    ```


    > Code snippet is from pseudocode.txt


    English, ajaxPromise goes off, gets some data with XMLHttpRequest, and when the
    request finishes, it returns a promise in one of three states. The then() method
    routes the result to one of three functions designed to handle that state. None
    of logic is bound to ajaxPromise itself. Its all handled outside the function,
    which allows ajaxPromiseto remain much more generic because application logic
    is bound to it directly.


