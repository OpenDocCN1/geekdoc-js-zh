    \ and properties. A simple example is shown in Listing 10-7.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_206_1.png)\n\
    \n# LISTING 10-7: A singleton\n\n```\nvar myApp = {\ninit : function(){\n  //code\
    \ to initialize your application\n},\ndashboard: function(){\n};\n```"
