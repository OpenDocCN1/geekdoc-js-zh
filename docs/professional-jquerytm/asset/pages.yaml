  md: "application flows. It's all laid out in (nearly) plain English.\n\n# Deferred.then\
    \ Syntactic Sugar for Deferred.fail and Deferred.done\n\nWith aliases for $.ajax\
    \ $.get $.post, jQuery provides a convenient alias for the core Deferred objects:\
    \ Deferred.then. Deferred.then accepts two arguments, one for resolved promises\
    \ and the other for rejected promises. Like the functions it maps to, Deferred.done\
    \ and Deferred.fail, the arguments for Deferred.then can be either individual\
    \ functions or an array of functions.\n\nThe following code sample shows the original\
    \ Deferred example from earlier in the chapter rewritten to use Deferred.then.\n\
    \n![](img/8acf2bc7faf21ccdde2b9192aee791a5_272_0.png)\n\n```\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n</head>\n<body>\n  <div id=\"main\">\n    <h1></h1>\n\
