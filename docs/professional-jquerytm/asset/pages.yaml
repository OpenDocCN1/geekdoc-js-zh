    \ 1. aopch (2, 2)\n\n# Additional Mockjax Features\n\nBecause web application\
    \ development needs to handle more than just a simple, successful JSON request,\
    \ you'll be glad to know that Mockjax has features to handle most Ajax situations.\
    \ It's worth exploring them in full because you never know what you might have\
    \ to accommodate in testing, but the two that follow are looking right off the\
    \ bat.\n\n# Using a Mockjax Data Proxy\n\nOne nicely feature is the ability to\
    \ create a data proxy. Listing out a couple of data elements when setting up a\
    \ simple test is convenient, but if you're trying to test a full interface, it\
    \ could be awkward to wrap a large data structure inside the plugin setup call.\
    \ To fix this, Mockjax has an option to set a data proxy, which will point to\
    \ a static file to serve as the source for your Ajax request. All it takes, other\
    \ than having the file itself, is to add an optional proxy parameter when the\
    \ plugin is set up. The simplest possible example would look like this:\n\n```\n\
    $.mockjax({\n  url: '/data/json',\n  proxy: '/mock/data.json'\nn});\n```\n\nDo\
    \ that and you can use complicated data structures without worrying about embedding\
    \ them directly in your testing framework. Note that you do need to have access\
    \ to JSON.stringify, which may require the use of json2.js (https://github.com/douglasckford/JSON-js)\
    \ if you're going to be testing in legacy browsers.\n\n# Adding Additional HTTP\
    \ Headers\n\nMockjax also allows you to set additional HTTP headers. For advanced\
    \ Ajax programming, this is vital. Some standards ones, are available directly\
    \ from the Mockjax setup object. and contentType Others can be set using an optional\
    \ headers property, which can contain a series of name/value pairs representing\
    \ the desired HTTP headers. The"
