  md: 'for validating your JavaScript code; see

    https://github.com/douglascrockford/JSLint.git. In the source code

    You''ll find fulljsint, which you can run outside of a web browser.

    Using Mozilla Rhino, you can use a short script for validating

    JavaScript/jQuery code from a command line.


    ```

    load(''JSLint/fulljsint.js'');

    var src = readFile(arguments[0]);

    var passes = JSLint(src);

    print(passes ? ''Passes Line Validation'' : ''Failed Validation'');

    ```


    The functions load(), readFile(), and print() are Rhino-specific

    functions. The load() function takes the input string pointing to the

    fulljsint.js file, loads the code into memory, and executes it

    y access to the JSLINT() function. The readFile() function obtains the

    first parameter from the command line, using the arguments

    ray, and reads the source into a string. The JSLINT() function then

    vates the content of the src variable, and returns a Boolean object

    signing whether or not the string validated. With a ternary operator a

    message is then printed to the console depending on whether the file read

    passed validation. Open a terminal, and try validating a simple JavaScript

    file:


    ```

    $ rhino run test.js

    Passes Line Validation

    ```


    If the above seems like too much work, you can also take a look at the

    project, jslint4java at http://code.google.com/p/jslint4java/, which

    simplifies the command to the single line seen in the following code

    snippet.


    ```

    $ java -jar jslint4java-1.4.jar test.js

    ```


    In addition to JSLint, there''s an alternative code tool that''s

    gaining popularity, JSHint www.jshint.com/. Originally forged from

    JSLint in order to create a more configurable version of JSLint that didn''t

    enforce one particular coding style, JSHint has grown into a project of its

    with its own goals and ideals. If you find yourself running up against

