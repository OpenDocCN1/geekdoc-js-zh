  md: "# Testing for Truthiness with ok\n\nIn some ways, this would have made a better\
    \ \"Hello World\" example, because it's the most basic assertion. ok accepts two\
    \ arguments: a Boolean state to test and a message to display in the case of a\
    \ failing test. The following code example shows ok in action. It tests whether\
    \ the return value of a function is an array using the jQuery method.$isArray.\n\
    \n```\ntest(\"Truthiness is golden\", function() {\n  var val = function(){\n\
    \  var arr = [1,2,3,4,5];\n  //dustuff\n  return arr;\n}\nok($.isArray(val), \"\
    We're expecting an array as a return value\");\n});\n```\n\n> Code snippet is\
    \ from ok.html\n\n# Setting Expectations\n\nOne good habit to get into is to set\
    \ expectations for your tests. Basically, you tell QUnit, \"Expect to see x assertions.\"\
    \ If QUnit doesn't exactly x assertions, the test will fail. This is true if the\
    \ assertions did not run all.\n\nTests might not run for a variety of reasons,\
    \ from something as simple as a type to more complicated issues relating to application\
    \ flow. You see the prime example of why expect is important when you learn the\
    \ asynchronous testing in a later section.\n\nYou set expectations in QUnit in\
    \ two ways. The first is calling the expect method within the test body. The following\
    \ example shows expect in use. Two assertions are expected but only one is present,\
    \ so the test fails.\n\n```\ntest(\"Hello World\", function() {\nexpect(2)\nvar\
    \ message = \"hello world\";\nequal(message, \"hello world\", \"We expect the\
    \ message to match.\");\n});\n```\n\n> Code snippet is from expect.html"
