  md: "The jQuery to bind a function to an event is through the .bind() method, which\
    \ accepts three arguments: the event type, data, and the function handler. For\
    \ example, to bind a mouseover event:\n\n```\n$('#objId').bind('mouseover', function(event){\n\
    \  // code here...\n});\n```\n\nIn this example, element, objId is selected by\
    \ id, and has a mouseover event bound to an anonymous function.\n\nTable 5-4 lists\
    \ all the available jQuery event handlers.\n\n# Table 5-4 jQuery Events\n\n| |\
    \ |\n|---|---|\n| .blur() | .mouseenter)|\n| .focus() | .mousemove)|\n| .select()\
    \ | .mouseout)|\n| .submit() | .mouseover)|\n| .click() | .mouseup)|\n| .dblclick()\
    \ | .toggle)|\n| .focusin() | .error(|\n| .focusout() | .resize)|\n| .hover()\
    \ | .scroll)|\n| .mousedown() | |\n\nIt's also possible to remove any bindings\
    \ with .unbind()\n\nThis removes all events of type mouseover from the selected\
    \ elements. If you want the capability to unbind a particular class of events,\
    \ events can also be namespaced.\n\nThe element you want to bind an event handler\
    \ to may not exist given the dynamic nature of JavaScript/jQuery. If this is the\
    \ case, bind won't work, instead use the corresponding method .live(), which will\
    \ bind an event handler independently of whether it exists. This is very useful\
    \ for cases where DOM elements are added on the fly as shown in the following\
    \ example, where bound using .live(). When the .ready() event is executed, the\
    \ anchor is dynamically added and is bound to the click handler.\n\n```\nAvailable\
    \ for download on W3schools.com\n<head>\n<script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n<script>\n$(function(){\n  // element does not exist yet, but we can\
    \ create handler\n  // anyways\n});\n```"
