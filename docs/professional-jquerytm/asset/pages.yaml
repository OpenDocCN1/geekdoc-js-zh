  md: "recognize areas where it typically starts to creep in, you can stay ahead of\
    \ it by immediately making the more maintainable solution.\n\n# USE JAVASCRIPT\
    \ PATTERNS\n\nAlthough the subject of software design patterns is far too broad\
    \ to cover here in depth, understanding and implementing basic patterns can go\
    \ a long way toward making your code more maintainable.\n\nFor more on software\
    \ design patterns in general, the classic \"Gang of Four\" book, Design Patterns:\
    \ Elements of Reusable Object-Oriented Software by Erich Gamma, Richard Helm,\
    \ Ralph Johnson, and John Vlissides, is the indispensable reference. Check it\
    \ out if anything in the following section strikes a chord with you.\n\nIn this\
    \ section, you learn about techniques that limit global namespace pollution, provide\
    \ logical module initialization, and allow for easier collaboration among multiple\
    \ developers.\n\n# Creating an Application Namespace with a Singleton\n\nOne of\
    \ the simplest techniques you can use to structure your code is to use well-chosen\
    \ namespaces. This pattern is commonly called a singleton.\n\nBefore you look\
    \ at the singleton, look at the unstructured approach it approves upon. This style\
    \ of code is still common and was especially prevalent in the earliest days of\
    \ JavaScript programming. For a long time, it was typical to simply present a\
    \ series of function declarations defined at the global space. This throwback\
    \ approach is shown in Listing 10-6.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_205_0.png)\n\
    \nLISTING 10-6: The old-school approach\n\n```\nfunction myInit() {\n  //code\
    \ to initialize your application\n}\n\nfunction myFunctionDashboard() {\n  //your\
    \ dashboard feature goes here\n}\n\nfunction myControlPanel() {\n  //control panel\
    \ code goes here\n}\n```"
