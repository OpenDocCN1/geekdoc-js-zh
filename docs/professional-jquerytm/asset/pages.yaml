    You might have expected a simple utility method for resizing an element but there''s
    not one. The $.resize() method is a handler for the onresize event. Unless you''re
    using $.animate(), you''ll have to code your own.


    To resize an element change its height and width attributes using $.css(). For
    example, shrink the width of an existing element you could do the following:


    ```

    var w = $("#MyElement").css("width");

    w = parseInt(size.replace("px","")) - 10;

    $("#MyElement").css("width", w);

    ```


    But this has the inherent disadvantage of returning a string with a unit, for
    example, pixels. By using the $.height() and $.width() methods, you can get the
    height and width of an element, making it easier to resize:


    ```

    var w = $("#MyElement").width()

