    # Filtering Tests with URL Parameters


    Similar to the way you can set the globlobals and notrycatch flags with query
    parameters, you can also filter tests. Simply add filter=filename to the URL and
    QUnit will only run tests whose names contain filename. This can be based on module
    names or test names and allows you to easily target specific features when doing
    tests.


    The use of this feature is made apparent when bug fixing the jQuery core. Although
    you''re required to run the full test suite before issuing a pull request, you
    don''t want to test the entire library when you''re testing against your feature-specific
    fix.


