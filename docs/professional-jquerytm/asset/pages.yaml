    \ '</div>'\n+ '</div>\n+ '</div></div>');\n}\nn});\n</script>\n</body>\n</html>\n\
    ```\n\nCode snippet from no-templates.txt\n\nThe preceding code takes the comics\
    \ array, iterates through its members, and builds blocks of HTML to add to the\
    \ document. This is done by simply concatenating strings of HTML with data references.\
    \ Although this is a common solution, jQuery Templates implement the pattern in\
    \ some important ways.\n\n# Separation of Content and Behavior\n\njQuery Templates\
    \ allow for a further separation of content and behavior. One the central tenets\
    \ of modern web development is the separation of code that describes the structure\
    \ and content of the page (the HTML)"
