  md: '# # Chapter 1


    # ## Getting Started


    ### WHAT’S IN THIS CHAPTER?


    +   - What jQuery Is Good At

    - The jQuery “Hello World” Code Conventions and Development Tools


    You probably spend more time in front of a computer than your significant other.
    Hence, having a nice comfortable seat, a fast computer, and software that accelerates
    development is essential.


    Starting with the basics, we’ll review requirements, different ways to obtain
    jQuery, and how to run it on both client and server, and set up some conventions
    for the rest of the book, using Google’s JavaScript standards.


    In this chapter you set up your work environment for developing and debugging
    jQuery and JavaScript code. A major portion of development time goes into debugging,
    so good debugger isn''t really an option. After reviewing Firebug, Chrome, and
    IE debuggers a portion of this chapter covers debugging JSON, tools for inspecting
    HTTP headers, and the JSLint code quality tool.


    You learn to package your .js files for production, explore tools, and establish
    some coding conventions.


    # ## JQUERY IS GOOD AT


    Without a doubt, one of the strong points of using jQuery is how it diminishes
    many cross-browser concerns. Without it, writing cross-browser-compatible JavaScript
    code is a tedious, and unnecessary, exercise. It’s difficult not to marvel at
    how much time is saved things running in both IE and Firefox with jQuery. The
    core is also excellent at traversing the DOM tree and selecting elements. It’s
    very lightweight, with the production version standing at 29 kb, which is minified
    and compressed. That’s a lot of kick for a small file. When debugging and testing,
    you’re better off using the uncompressed development version, which is 212 kb.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'jQuery is also good at handling fairly complex JavaScript code with relatively
    little code. This was one of my initial attractions to the framework. For a newbie
    trying to learn the “ropes” with Ajax, jQuery lowers the learning curve. Understanding
    what’s going on under the hood is important, but as a first step, using $.ajax()
    isn''t a bad start.


    An active user community means active support. Googling jQuery returns 36.8 million
    results at the time of writing. New official and third-party plugins come out
    every day, extending its core functionality. With many projects dependent upon
    jQuery, it''s easy to find online (and really cool print books too).


    With that, it might be overkill in some cases. Remember that including the jQuery
    library has some overhead, even if it''s small, and if you''re only using the
    selectors to get an element by its ID, then the built-in JavaScript capability
    of the browser is enough. But, if you plan to build a feature-rich, dynamic Ajax
    web application, jQuery is the way to go.


    # HARDWARE AND BROWSER REQUIREMENTS


    Your requirements for running jQuery are very light: a computer, smart phone,
    or device capable of running a modern browser. The browser requirements are fairly
    liberal as well. The official site lists the following browsers that are supported
    as well:


    +   * Firefox 2.0+

    * Internet Explorer 6+

    * Safari 3+

    * Opera 10.6+

    * Chrome 8+


    The following browsers are known to give problems:


    +   * Firefox 1.0.x

    * Internet Explorer 1.0–5.x

    * Safari 1.0–2.0.1

    * Opera 1.0–9.x

    * Konqueror


    Quirksmode has a great page detailing the CSS compatibilities of different browsers,
    including CSS3. To find out more visit [www.quirksmode.org/css/contents.html](http://www.quirksmode.org/css/contents.html).'
