    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_161_0.png)


    Build Your Download

    Customize your jQuery UI by selecting the version and specific modules you need
    from them below or select a quick download package. A range of current and historical
    UI releases are also hosted on Google''s CDN.


    Quick downloads: Stable (Themes 1.8.3) for jQuery 1.12.2 / Legacy (Themes 1.7.3)
    for jQuery 1.9-


    Source (pre-build): Stable (1.8.3) for jQuery 1.12.2 / Master (unsigned) / GitHub
    repo


    If you want to edit your theme, inside of the file css/selected-theme-jquery-ui-xxx.css,
    there is a series of commented outlines (in my file, around line 50) with an HTTP
    address. Use this address to create your altered theme in ThemeRoller, and continue
    modifying to your heart''s content.


    The following folders are included in the jQuery UI download:


    +   - **index.html**: A "gallery" of the widgets included with jQuery UI as well
    as the CSS classes

    - **js**: A folder containing a copy of the latest, full version of jQuery UI,
    alongside a local copy of the core jQuery library

    - **css**: A folder containing a default jQuery UI theme

    - **development-bundle**: A folder containing full, unminified versions of all
    the jQuery UI files


    jQuery UI provides a comprehensive framework, which gives all of the widgets a
    consistent look and feel.


    The CSS framework files are located in two places: the css folder at the top level
    and the development-bundle/themes folder. The .css file found at the top level
    contains all of the definitions in a single place, which reduces the amount of
    HTTP requests required to obtain CSS definitions. The files found under the development-bundle
    directory contain both the base theme and the selected custom.'
