  md: '# FIGURE 5-1


    Microsoft went went with the opposite approach where the inner element’s “onclick”
    handler should be executed before the outer element’s, or the bubbling phase,
    as shown in Figure 5-2.


    # FIGURE 5-2


    The third argument to the .addEventListener() method is a Boolean flag to determine
    whether or not you should use the capture phase.


    But, you may not prevent propagation or bubbling to occur at all; this can also
    be controlled in JavaScript. In browsers that follow the W3C standard, a call
    to the method .stopPropagation() is used. In older versions of IE, the property
    cancelBubble of the event object is assigned a value of true.


