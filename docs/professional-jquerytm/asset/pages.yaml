  md: '# INTRODUCTION


    OVER THE PAST YEARS JAVASCRIPT has undergone a remarkable transformation. Where
    once it was a “toy” language relegated to secondary status it''s now one of the
    most important programming languages in the world. With the ongoing importance
    of Ajax-based development and the release of full-featured JavaScript libraries,
    the stigma surrounding JavaScript has all but vanished. As easily the most popular
    and beginner-friendly library, jQuery is responsible for the lion''s share of
    that progress.


    jQuery is more than just a beginner’s choice; however, it''s in use at some of
    the organizations in the world, adding interactivity to billions of page views
    every month. Amazon, IBM, Twitter, NBC, Best Buy and Dell are just few of the
