  md: '| SELECTOR | FF8 | SAFARI 5 | CHROME 15 | IE9 |

    | --- | --- | --- | --- | --- |

    | for loop | 9,885 | 13,608 | 22,444 | 25,118 |

    | .forEach | 3,504 | 6,794 | 8,957 | 10,550 |

    | $each | 1,981 | 6,794 | 3,609 | 4,268 |


    The difference comes down to two things that, when understood, can help you write
    more effective JavaScript code. The first is being wary of extraneous function
    creation. Because they accept functions as arguments, the convenience methods
    require the JavaScript engine to create a new execution context for each step
    in the loop. Compare that to the traditional loop, which executes in the containing
    scope without the overhead of a new execution context.


    Scope is the second piece. Because the operations are happening inside a function,
    any variables that reference the outer scope are now placed one level away in
    the scope chain. The looped code has to constantly walk the scope chain up a level
    to validate references. Because the traditional loop executes in one scope, any
    variables defined outside the loop still remain in the current scope.


    # Caching Objects


    Building on the idea of using local variables to speed up your script, you''ll
    also want to think of caching objects in local scope to avoid additional script
    overhead. In general, if you''re going to use an object more than once in a function,
    it''s useful to cache that object in a local variable. It shortens lookup time,
    and if the variable is the result of a jQuery call, it cuts down on the number
    of times jQuery needs to do its selector magic.


    It''s very common to do this with $() because the object bound to a function is
    often the subject of multiple operations in a function.


    As a matter of style, when the object being saved to a local variable is a jQuery
