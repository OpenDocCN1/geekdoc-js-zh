    # # UNDERSTANDING HOW JQUERY HANDLES EVENTS


    All this talk of propagation, event model inconsistencies, and so on, is enough
    to drive anyone away the differences in event-handling mechanisms, which is precisely
    what jQuery does. You have few options for binding event handlers in jquery: .bind(),
    .live(), one of the several event methods such as .click(), .load(), or .mouseout(),
    or the new unified on() and off() API introduced in jQuery 1.7.


    Just like DOM level 2, you can bind more than one event handler to the same event
    using .bind():


