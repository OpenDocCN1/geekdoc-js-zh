    \ elements, such as :button or :input, a filter for detecting if an element is\
    \ in a state of animation, and other goodies. The jQuery does classify the selectors\
    \ into basic, visibility, content, child, and form. We talk about the animated\
    \ filters in Chapter 7.\n\n# Selection Using Basic Filters\n\nTable 4-3 lists\
