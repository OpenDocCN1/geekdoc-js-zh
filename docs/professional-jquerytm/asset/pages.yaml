    # DESIGNING CUSTOM ANIMATIONS


    All of the previous methods for animating elements are nice, but there''s a more
    elegant weapon for these uncivilized times, the $.animate() method. jQuery has
    a more general method for doing animations, which permits you to modify more than
    one attribute simultaneously. Any attribute that uses a numeric value such as
    top, height, width, and opacity is open game for manipulation by $.animate().
    It accepts an object with the properties to be animated, the duration of the animation,
    a string denoting the easing algorithm to use, and a callback function executed
    upon completion:


    ```

    $(selector).animate( properties, [duration,] [easing,] [complete] )

    ```


    In the next example, a plain blue div is animated from left to right to 100px
    when the document is clicked; this is about as simple as it gets. Note that the
    position must be relative, absolute, or fixed in order for the animation to work.


    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_152_0.png)'
