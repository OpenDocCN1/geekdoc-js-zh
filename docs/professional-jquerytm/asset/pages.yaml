    # Minimize DOM Updates


    One of the most fundamental concepts of optimized front-end code is to keep the
    number of DOM updates in any given interaction down to the absolute minimum. Crossing
    over from the JavaScript engine into the DOM is a costly position. This is especially
    true if the operation is going to cause a repaint or reflow.


    If you''re unfamiliar with the concept of reflow and repaints, pay particular
    attention to the next section. Understanding these concepts, how they differ,
    and how they affect both perceived and clock performance of a web page or application,
    is vital knowledge for the serious front-end engineer.


    # Reflows and Repaints


    Two common, but potentially expensive operations in the life of a web page are
    reflows and repaints. Reflows and repaints happen when the browser needs to update
    its rendering model (the combination of the DOM and the CSS rules that make up
    the style component of the page). This happens at least once a page load (because
    the browser must draw something at least once), but can happen many more times
    in the case of dynamic applications.


    The events are related, but slightly different. Understanding the difference can
    make or break performance of a page:


    +   - A repaint is caused by a stylistic change to the page that doesn''t change
    the overall page geometry. Hiding an element or changing an element''s background
    color would cause a repaint.

    - A reflow is caused by a structural update to the page. Adding or removing an
    element from a document


