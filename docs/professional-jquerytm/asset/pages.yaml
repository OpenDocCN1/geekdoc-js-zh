  md: '# EVENTS


    Both HTML and XML are hierarchical tree structures of tags (or elements). The
    window contains a document; documents contain an HTML element, which in turn contains
    a child header and body element, and so forth. The best definition of the DOM
    is the one specified by the W3C:


    > The Document Object Model is a platform- and language-neutral interface that
    will allow programs and scripts to dynamically access and update the content,
    structure and style of documents. The document can be further processed and the
    results of that processing can be incorporated back into the presented page."


    Most of the cross-browser events pertaining to variations in the DOM are silently
    taken of for you in jQuery. You don''t need to worry (much) about the differences
    in the DOM redundant over the Gecko-friendly browsers, IE, Safari, and Opera.


    # USING JQUERY WITH JAVASCRIPT LIBRARIES


    From time to time you want to include in your program other JavaScript frameworks
    or libraries with your code. If those frameworks use the dollar sign with others,
    as a variable, this will cause conflicts. But, because jQuery plays nice with
    others, it has a method for avoiding these conflicts. To do so, use the $.noConflict();
    method after loading the libraries that may conflict. This has the effect of reverting
    the dollar sign to its previous value. After invoking .noConflict(), use jQuery
    instead of $ to refer to the jQuery core. The following code demonstrates example:


    ```

    <html>

    <head>

    <script src="conflictingframework.js"></script>

    <script src="jquery.js"></script>

    <script>

    jquery.noConflict();


    jquery("<p>I am a paragraph</p>").appendTo(body);

    // // references conflictingframework.js, not jquery

    $..blahMethodFromOtherLibrary();

    </script>

    </head>

    <body>

    </body></body>

    </html>

    ```


