  md: "looking at .end() jQuery maintains a stack that keeps track of changes to the\
    \ matched set of elements. When a method that traverses the DOM like .filter()\
    \ or .find() is called the new matched set is pushed onto the stack. If you need\
    \ to manipulate the previous set of matched elements as well, .andSelf() will\
    \ come the rescue. The following code sample illustrates .andSelf() to add a div\
    \ back onto the stack after doing a .find() manages the stack. The new set of\
    \ matched elements maintains the order of the elements in the DOM.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_95_0.png)\n\
    \nAvailable for download on W3.com\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script\
    \ src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n<script>\n$(function()\
    \ {\n  console.log(\"div\");\n  // [div]\n  console.log(\"div\").find(\"p\"));\n\
    \  // [p, p, p]\n  console.log(\"div\").find(\"p\").andSelf());\n  // [div, p,\
    \ p, p]\n});\n</script>\n</head>\n<body>\n<div>\n  <p>Paragraph</p>\n  <p>Paragraph</p>\n\
    \  <p>Paragraph</p>\n</div>\n</body>\n</html>\n```\n\nCode snippet is from andSelf.txt\n\
