    \n  bool = this.arr.indexOf(0);\n  ok(bool, \"We're expecting 0 to be in the Array\"\
    );\n});\ntest(\"Getting Deep\", function() {\n  expect(2);\n  deepEqual(this.arr,\
    \ [1, 2, 3, 4, 5]);\n});\n```\n\n> Code snippet from module.html\n\nRunning these\
    \ tests produces the output shown in Figure 14-8. As you can see, the tests are\
