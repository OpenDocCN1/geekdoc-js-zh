  md: "references, getting another wrapper object with a subset of the original, or\
    \ generally just traversing the DOM are all handled with ease jQuery.\n\nUsing\
    \ the .find() method you can retrieve descendants from an already wrapped set\
    \ of elements in a manner similar to using the jQuery function. The .find() method\
    \ also accepts a selector string. The net effect of using .find() is updating\
    \ the current wrapper you're operating on. In contrast to the jQuery function,\
    \ the selector expression is required.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_89_0.png)\n\
    \nAvailable for download on W3.com\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script\
    \ src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n</head>\n<script>\n\
    $(function(){\n  var wrapper = $(\"ul\");\n  console.log(\"selected list count:\
    \ \" + wrapper.length);\n  var newWrapper = wrapper.find(\"#books\");\n  console.log(\"\
    selected list count: \" + newWrapper.length);\n});\n</script>\n<body>\n<ul id=\"\
    groceries\">\n  <li>Eggs</li>\n  <li>Bacon</li>\n  <li>Ham</li>\n</ul>\n<ul id=\"\
    books\">\n  <li>\n    <li>Pro jQuery</li>\n    <li>JavaScript 101</li>\n  </li>\n\
    \  <ul id=\"mathBooks\">\n    <li>Calculus for the Gods</li>\n    <li>Intro to\
    \ Finite State Machines</li>\n  </ul>\n  </li>\n  <li>How to Win at Jeopardy</li>\n\
    \  <li>How to Cook</li>\n</ul>\n</body>\n</html>\n```\n\n> Code snippet is from\
    \ find.txt\n\nIn this example, the first console.log displays 4, where the second\
    \ displays 1. The .find() method works for getting all of the descendants, but\
    \ if you want to get only the first level of descendants use .children() instead."
