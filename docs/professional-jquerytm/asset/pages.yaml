    \ good to understand these concepts for your own work and to understand the work\
    \ of other plugin authors even better.\n\n# Applying the jQuery Plugin Pattern\n\
    \nIn his post \"A Plugin Development Pattern\" (http://www.learningjquery.com/2007/10/a-plugin-development-pattern),\
    \ Mike Alsups outlines a comprehensive set of best practices to follow when developing\
    \ jQuery plugins. Although the post is several years old now, it still holds up\
    \ and is cited as a vital resource for plugin developers. This section examines\
    \ the pattern in some detail.\n\n# Claim Only a Single Name in the jQuery Namespace\n\
    \nGiven the large number of plugins available and the common convergence of functionality\
