  md: '# Chapter 14


    # Unit Testing with QUnit


    WHAT’S IN THIS CHAPTER?


    +   - An Introduction to Unit Testing

    - Getting Started with QUnit

    - Asynchronous Testing

    - Putting It All Together


    In this chapter, you learn about the benefits of unit testing and about the specific
    unit testing framework created and used by the jQuery project itself, QUnit. You
    learn how to write your own tests and how to integrate QUnit with your own projects
    to increase code quality, maintainability, and overall confidence.


    # AN INTRODUCTION TO UNIT TESTING


    If you’re coming to jQuery and JavaScript engineering from some other programming
    discipline, the concept of unit testing is likely familiar to you. If that’s the
    case, or you’re among the minority of front-end engineers already doing unit testing,
    feel free to skip ahead to the sections that deal specifically with unit testing
    with QUnit. Otherwise, read and learn about the benefits of a development approach
    centered on a structured, atomic testing framework.


    As a note, this is an area of front-end engineering where there’s an opportunity
    to get ahead of the curve. The DailyJS JavaScript Developer Survey 2011 Results
    (https://dailyjs.com/2011/12/15/javascript-survey-results/), show 42 percent of
    JavaScript engineers are testing their code. That number is up from 2010, but
    it still shows that there’s a gap between the tools commonly used in other programming
    disciplines and the ones used in the average JavaScript project.


    As you’ll soon see, the benefits are potentially significant, ramping'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'up to include unit testing in your development toolbox testing whilst a worthwhile
    effort.


    # # WHAT IS UNIT TESTING?


    Unit testing is a software practice where individual pieces of code (called units)
    are tested to determine their viability for a specific task. Units should be as
    small as possible, have one or a few inputs, and a single output.


    Unit tests are generally automated, either as part of a build process, or as a
    pre-commit hook for check-ins or some other type of the software life cycle. Each
    test returns a binary pass/fail result.


    Unit testing is a vital partner of a style of testing much more familiar to JavaScript:
    functional testing. Functional testing, what most people think of as "QA", or
    more formally, acceptance testing, tests the site or application from the end
    user''s perspective, after it''s complete. Unit tests that flip model on its head.
    Unit tests are written alongside the code they''re meant to test and, most importantly,
    written from the developer''s perspective.


    Instead of testing, an end user will see unit tests analyze the expected result,
    from a software perspective, of a piece of code.


    # # Benefits of Unit Testing


    Some of the benefits of unit testing should be obvious. Testing code early and
    often improves code quality by uncovering issues that might be glossed over with
    simple, unstructured developer tests. Better code quality means fewer bugs during
    functional testing or worse, in production.


    “Fewer bugs” should make everyone involved with your project happy, including
    your users.


    Beyond producing better code at the start of a project, one other key use of unit
    testing is automated regression testing. In the jQuery project itself. Using automated
    unit tests ensures that new features and/or bug fixes not introduce other errors.
    This is a key to ensuring the stability of the library.


    Rick Waldron''s line in the jQuery Bug Fixing Guide (http://weblog.bocop.com/javascript-jquery-bug-fixing-guide)
    bellows (in all caps) the importance of this with the admonition “ALWAYS RUN THE
    FULL SUITE BEFORE COMMITTING AND PUSHING A PATCH!!!” That’s clarity.'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'Running the full test suite and ensuring all tests pass means you''ve added
    to, but not subtracted from, the library as a whole.


    The unit testing structure allows for easier refactoring. Because you know exactly
    what a particular piece of code needs to pass, you can more confidently refactor
    that code without the nagging fear that you''re missing some dependency or other.
    No developer wants to feel the code she or he has rewritten will the whole application
    crashing down. Passing existing unit tests alleviates this fear significantly.


    Additionally, because good unit testing relies on relation standalone modules,
    coding for unit testing forces developers to write more loosely coupled code.
    You want to avoid writing tests that spread more than one module, so you''re forced
    to write more abstract interfaces for inputs and outputs that can be easily mocked
    up in a testing framework.


    Coding for standalone tests also means that code can be tested and verified before
    other, dependent systems are complete. With a well-documented interface and well-written
    unit tests, modules can be coded efficiently if other modules are to be created
    later in the process. This can be especially beneficial with large teams spread
    across different organizations. A consultant can come in, create a module for
    which he''s specifically suited, and if his code is well tested and works properly
    with the agreed-upon interface, he could theoretically move to his next gig, before
    the rest of the organization catches up to his progress. This doesn''t negate
    the need for integration tests (tests to ensure that the actual systems involved
    function as expected when coupled together), but it could alleviate many of the
    surprises that can pop up with a less structured approach to development.


    # Test-Driven Development


    Unit testing is the foundation of an advanced software methodology called Test-Driven
    Development (TDD). TDD encourages extremely short development cycles by centering
    the development life cycle on small unit tests. A developer will start by writing
    a failing unit test. He''ll write the minimum amount of code to pass that failing
    test. Finally, he''ll move on to the next feature and/or refactor the code for
    better quality. Although this chapter doesnt go into specific TDD practices, TDD
    is often mentioned alongside unit testing, so the relationship is important to
    point out.


    Basically, though you can''t do TDD without unit tests, you can unit test without
    signing up to practice the full spectrum of TDD.'
