  md: "The following code shows how to do this. A function expression wrapped around\
    \ the plugin definition. It accepts one argument, $, and because the function\
    \ is immediately executed with jQuery as the single argument, $ is guaranteed\
    \ to bound to jQuery.\n\n```\nAvailable for download on Wrx.com\n(function($ {\n\
    \  $.fn.newStuff = function() {\n    /* $ is now jquery, no matter what value\n\
    \     * $ might have in the global namespace\n    */\n  };\n}(jquery );\n```\n\
    \nCode snippet is from jquery-is-jquery.txt\n\nAdditionally, there's a common\
    \ enhancement to this pattern that's worth taking a look at. It creates local\
    \ references for window and document and ensures that undefined remains undefined.\
    \ This pattern provides several benefits.\n\nHaving local references for window\
    \ and document allow them to be minified (every byte counts) and speeds up access\
    \ to those objects inside the function by shortening the lookup table.\n\nAdditionally,\
    \ because undefined can be reassigned in older versions of the ECMAScript standard,\
    \ it's a source of potential bugs if someone accidentally or maliciously redefines\
    \ undefined. Defining it as an argument and then not defining it is a clever way\
    \ to ensure that the value is as expected.\n\n```\nAvailable for download on Wrx.com\n\
    (function($, window, document, undefined) {\n  $.fn.newStuff = function() {\n\
    \    /* $ is now jquery, no matter what value\n     * $ might have in the global\
    \ namespace\n    */\n  };\n}(jquery, window, document );\n```\n\nCode snippet\
    \ is from document-undefined.txt\n\n# Use Semicolons Properly\n\nIf you're lucky\
    \ enough to use your plugin, it's important to remember that they'll probably\
    \ end concatenating and minifying your script along with other code. To that end,\
    \ it's worth paying attention to"
