  md: "# JQUERY’S NEW DOM EVENT API\n\nStarting with version 1.7, jQuery has made\
    \ an effort to simplify the API for setting events. While you will still be able\
    \ to .bind() and .unbind(), .live() and .die() and set .click() and .blur() the\
    \ old way, there's now a unified API which bundles all the various functionalities\
    \ under one, consistent API. The two new methods are .on() and .off(). Moving\
    \ forward, these two methods represent the preferred API, so it's worth learning\
    \ about them now so that any new projects you kick off start by using the recommended\
    \ API.\n\nThe beauty of .on() is that it replaces the functionality of all the\
    \ event covered in this chapter with a single, flexible API. The following code\
    \ sample shows a basic example of .on(), using it to bind a click event to an\
    \ element already present in the DOM. It accepts two arguments in this example,\
    \ an eventType and a handler function to execute.\n\nThis would compare to directly\
    \ using .bind(\"click\") or .click() and as proof, this rewrites the .bind() example\
    \ from earlier in the chapter.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_122_0.png)\n\
    \n```\n<html>\n<head>\n  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n  <script>\n    function(){\n      $(\"aDiv\").on('click', function(){\n\
    \        console.log(\"Handler 1\");\n      });\n\n      $(\"aDiv\").on('click',\
    \ function(){\n        console.log(\"Handler 2\");\n      });\n    }\n  </script>\n\
    </head>\n<body>\n  <div id=\"aDiv\" class=\"boxDiv\">Press Me\n</div>\n</body>\n\
    </html>\n```\n\nCode snippet is from on-click.txt\n\nBeyond that basic example,\
    \ .on() also exposes the same functionality present in .delegate() and .live()\
    \ and does so with the exact same syntax. To use .on() like delegate or .live(),\
    \ simply add a second, optional selector argument representing the target element\
    \ for the event. This first example shows .on() used to replace our example of\
    \ .live()"
