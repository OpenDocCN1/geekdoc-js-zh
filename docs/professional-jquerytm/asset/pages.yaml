  md: 'The .trigger() method calls the browser event. For example, doing a $("#myButton").trigger("click");
    calls the default JavaScript onclick method. Using .triggerHandler() instead,
    as the name implies, executes the attached handler rather than the native method
    and takes the same arguments as .trigger(). But, unlike the .trigger() method,
    .triggerHandler() executes the handler of the first matched object instead of
    an entire match, and does not bubble up.


    Table 5-5 summarizes jQuery''s methods for attaching event handlers.


    # TABLE 5-5: Event Handler Attachment


    | METHOD | DESCRIPTION |

    | --- | --- |

    | .bind() | Binds an event handler |

    | .delegate() | Binds a handler to one or more events currently or in the future
    |

    | .die() | Removes event handlers using the .live() method |

    | .live() | Binds a handler currently or in the future |

    | .one() | Attaches an event handler that is executed at once |

    | .proxy() | Takes a function and returns another belonging to a specified context
    |

    | .trigger() | Executes event handlers attached to an element for an event type
    |

    | .triggerHandler() | Executes all handlers for a specific event |

    | .unbind() | Removes bindings created with .bind() |

    | .undelegate() | Removes bindings created with .delegate() |


