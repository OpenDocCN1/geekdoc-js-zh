  md: "# Understanding What Makes a Good Unit Test\n\nNow that you know about the\
    \ basics of unit testing, it’s important to get a sense of how to create a quality\
    \ unit test.\n\nThere are several hallmarks of a good unit test. The following\
    \ list outlines some tenets to follow. In general, unit tests should be:\n\n+\
    \   * **Automated**: Getting developers to do anything is hard enough as it is.\
    \ Testing to be as easy as possible or else there won’t be buy-in from the front\
    \ lines.\n* **Fast**: Anything else and developers are going to be less likely\
    \ to get with the testing program.\n* **Focused**: They should test as narrow\
    \ a component as possible to cut down on ambiguity.\n* **Independent**: This can\
    \ be approached from two different angles. Both are important:\n  * **Self-contained**:\
    \ Tests need to be atomic. This means you may need to use some code to stand in\
    \ external inputs/outputs. This code is known in testing circles \"mocks\" or\
    \ \"stubs.\" You see more about mocks later in the chapter.\n  * **Standalone**:\
    \ In addition to having no external dependencies, tests should be able to run\
    \ in any order, without having sequential dependencies on any other test.\n* **Consistent**:\
    \ Tests should always return the same results.\n* **Readable**: Tests should be\
    \ clear in intent and focus so that the developers who follow you onto a project\
    \ will be able to pick up the purpose of your tests without so much ramp-up time.\n\
    * **Maintainable**: Unit tests will live with your project, so they should be\
    \ maintainable. Having out-of-date tests is better than having no tests at all,\
    \ but out-of-date tests will cause their own problems.\n* **Trustworthy**: Developers\
    \ should have complete confidence in the result of a unit test.\n\nNow that you’ve\
    \ got a handle on unit testing in general, it’s time to look at the star of the\
    \ show, QUnit.\n\n# GETTING STARTED WITH QUNIT\n\nQUnit was born May 2008, out\
    \ of the jQuery project’s own testrunner. As"
