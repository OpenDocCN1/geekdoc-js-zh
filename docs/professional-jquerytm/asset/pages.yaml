  md: "| charCode | Property | keyCode |\n| --- | --- | --- |\n| relatedTarget | Property\
    \ | fromElement, toElement |\n| Bubbles | Property | N/A |\n\nAt times, you may\
    \ want to bind several different handlers to the onclick event of the same element.\
    \ In DOM level 0, binding will overwrite any other method already bound to the\
    \ event.\n\nThe solution is found in DOM level 2 events; it's because they don't\
    \ exist. Level 2, on the other hand, is a more advanced model than DOM level 0,\
    \ and is supported by most browsers except for IE version 8 and earlier; on this\
    \ deviation later, instead of assigning an event handler function as an object\
    \ property each page element in the DOM has a method called .addEventListener(),\
    \ which allows you to add more than one event handler to an element. For example:\n\
    \n![](img/8acf2bc7faf21ccdde2b9192aee791a5_105_0.png)\n\n```\n<html><head>\n<script\
    \ src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n<script>\n$(function()\
    \ {\n  var eventType = \"click\";\n  var capturePhase = false;\n  var handler1\
    \ = function(event){ /* handler code here */ };\n  var handler2 = function(event){\
    \ /* handler code here */ };\n\n  $(\"element\").addEventListener(eventType, handler1,\
    \ useCapturePhase);\n  $(\"element\").addEventListener(eventType, handler2, useCapturePhase);\n\
    });\n</script>\n</head>\n<body></body>\n</html>\n```\n\nCode snippet from addEventListener.txt\n\
    \nTheaddEventListener() accepts three arguments: the event type (in this case\
    \ it's \"click\"), the function that will handle the event, and a Boolean value\
    \ for using the capturing phase. \"What's that? you ask.\n\n# Event Capturing\
    \ and Bubbling\n\nConsider the situation of nested elements with the same event\
    \ type, for example an onclick event type. Which element should have its onclick\
    \ handler executed first, the inner element or the outer element? Originally,\
    \ Netscape decided that the handling should be from outer to inner, called *capturing*,\
    \ as Figure 5-1 illustrates."
