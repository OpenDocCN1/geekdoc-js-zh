  md: "# Working with Content\n\nOne of the glorious features of JavaScript is the\
    \ ability to update text on web pages on the fly, instead of waiting for a page\
    \ reload. With jQuery, it's easy to not change the contents of a node, but retrieve\
    \ them as well. Consider the case where you'd like to get the contents of a paragraph\
    \ element of an HTML page. One manner to accomplish this is with the .text() method.\
    \ But beware, the .text() method combines the text of all the elements in a selected\
    \ set.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n<script type=\"javascript\">\n$function(){\n  var content = $(\"p\"\
    ).text();\n  console.log(content);\n}\n</script>\n</head>\n<body>\n<p>Where's\
    \ </p>\n<p>The </p>\n<p>Beef?</p>\n</body>\n</html>\n```\n\nThis example displays\
    \ \"Where's the beef?\" in the console. That's fine and great, but about updating\
    \ the contents? You use the same method, .text(), instead of an argument list,\
    \ feed it a string containing the new text to insert. In this next example, after\
    \ page load, the paragraph element doesn't display the text \"blah\" but rather\
    \ \"The trees are green.\"\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"\
    http://code.jquery.com/jquery-1.7.1.js\"></script>\n<script>\n$function(){\n \
    \ $(\"p\").text(\"The trees are green.\");\n}\n</script>\n```"
