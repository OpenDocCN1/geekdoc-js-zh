  md: "run under.\n\nThe following new features that empower the custom environment:\
    \ setup and teardown. These are methods that run before and after the tests in\
    \ the module, and allow for great flexibility in terms of setting up the test\
    \ environment for similar methods.\n\nThe following example sets a variable to\
    \ test throughout the module, arr (array). It also stores a value in a variable,\
    \ control, to test against later, on the off chance that something crazy happens\
    \ to arr during the test. Inside the module itself are tests. One contains two\
    \ assertions and the others contain deepEqual. These are all testing different\
    \ pieces of the Array.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_295_0.png)\n\
    \n```\nmodule(\"fun with arrays\", {\n  setup:function() {\n    this.arr = [1,\
    \ 2, 3, 4, 5];\n    this.control = this.arr.length;\n  },\n  teardown:function()\
    \ {\n    equal(this.arr.length,this.control, \"Just Checking to see if it's still\
    \ an Array\");\n  }\n});\ntest(\"Truthiness golden\", function() {\n  expect(3);\n\
