- img_proc: true
  md: "The basic setup is simple. At different points in your application, you set\
    \ notify methods that are designed to fire at specific points in an application\
    \ or in a long-running method. Deferred.notify accepts an optional argument, which\
    \ will be passed to the Deferred.progress callback. The related function Deferred.notifyWith\
    \ accepts a context indicating the desired context for the Deferred.progress callback.\
    \ The Deferred.progress callback method is added to the chain. This callback method\
    \ should be designed to handle whatever message was sent via Deferred.notify or\
    \ Deferred.notifyWith.\n\nIn the simple example that follows, the function longRunning\
    \ is Deferred that uses setTimeout to 5000ms to resolve its promise. Before the\
    \ timer is started, there's a string notification sent out. The progress function\
    \ accepts that argument and inserts the update text into the DOM. After the process\
    \ is finished, you notify that the process is complete and then manually resolve\
    \ the promise.\n\nIn theory, the text update could have been handled by the Deferred.done\
    \ callback, leaving the progress callback to handle the original notification.\
    \ There's just a nice symmetry to using Deferred.notify at both ends of the process.\
    \ Also, there's a case to be made for keeping repetition of code down to a minimum.\
    \ So it just makes sense to keep all of the notifications bound to progress.\n\
    \n![](img/8acf2bc7faf21ccdde2b9192aee791a5_279_0.png)\n\n```\nvar longRunning\
    \ = function() {\n  return Deferred.deferred(function(dfd) {\n    dfd.notify(\"\
    operation started\")\n    var callback = function() {\n      dfd.notify(\"operation\
    \ finished\")\n      dfd.resolve();\n    }\n    setTimeout(callback, 5000);\n\
    \  }).promise();\n}\nlongRunning().progress(\n  function(notification) {\n   \
    \ $(\"#notifier\").text( notification ).fadeIn( 500 );\n  }).done(function() {\n\
    \    $(\"#notifier\").css({\n      \"color\": \"green\",\n      \"font-weight\"\
    : \"bold\"\n    });\n  });\n});\n```\n\n> Code snippet is from deferred-progress.txt\n\
    \n# Debugging with Deferred.state"
