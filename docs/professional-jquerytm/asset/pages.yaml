    # Button


    Browsers use the default OS native button for inputs. While this is certainly
    your design, you''ll often need to create custom styles to match your site''s
    design. Figure 8-2 illustrates how the jQuery UI button class enhances the native
    version.


    # FIGURE 8-2


    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_163_0.png)


    The $.button() style is applied to individual buttons whereas $.buttonset() is
    applied to button groups like radio inputs and checkboxes. Table 8-2 lists the
    available methods for both types of widgets.


    # Table 8.2: Available $.button() and $.buttonset() Methods


    | METHOD | DESCRIPTION |

    |---|---|

    | $(selector).button(); | Creates a default button widget |

    | $(selector).buttonset(); | Disables a previously created widget. |

    | $(selector).button(''disable''); $(selector).buttonset(''disable''); | Disables
    a previously created widget. |

    | $(selector).button(''enable''); $(selector).buttonset(''enable''); | Enables
    a previously enabled widget. |

    | $(selector).button(''destroy''); $(selector).buttonset(''destroy''); | Removes
    the button widget completely. This option returns the element back to its initial
    state. |

    | $(selector).button(''option'', optionName, value); $(selector).button(''option'',
    optionName, value); | Gets or sets any button option. If the third argument is
    omitted, it sets the optionName with the provided value. |

    | $(selector).button(''widget''); | Returns the .ui element. |'
