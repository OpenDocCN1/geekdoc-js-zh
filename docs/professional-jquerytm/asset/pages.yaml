  md: "you might use bit of code like to instantiate a request object:\n\n```\n/*\n\
    Support for the original ActiveX object in older versions of Internet Explorer\n\
    This works all the way back to IES.\n*/\nif (typeof XMLHttpRequest == \"undefined\"\
    ) {\n  XMLHttpRequest = function () {\n    try {\n      return new ActiveXObject(\"\
    Msxml2.XMLHttpRequest.6.0\");\n    } catch (e) {\n      try {\n        return\
    \ new ActiveXObject(\"Msxml2.XMLHttpRequest.3.0\");\n      } catch (e) {\n   \
    \     return new ActiveXObject(\"Msxml2.XMLHttpRequest\");\n      }\n    } catch\
    \ (e) {\n      throw new Error(\"No XMLHttpRequest Request.\");\n    }\n  };\n\
    }\nvar xhr = new XMLHttpRequest();\n```\n\nOnce the details of creating the request\
    \ object have been taken care of, a connection must be established with the server,\
    \ using the xhr.open() method, which follows the following:\n\n```\nxhr.open(method,\
    \ url, isAsynchronous);\n```\n\nwhere method refers to the HTTP method, the action\
    \ to be performed on the specified resource. While the full list of HTTP methods\
    \ (or \"verbs\") is longer, Ajax requests will typically be a POST or a GET. The\
    \ second parameter is the url used to exchange data, and isAsynchronous is a Boolean\
    \ flag indicating whether or not the call is asynchronous. This flag indicates\
    \ whether or not the request should block the execution of the script. As the\
    \ name of the technique implies, this will normally be set to true. So, you can\
    \ use the request object to make synchronous posts to the server, but would be\
    \ defeating the whole purpose of Ajax. After opening the connection, use the xhr.send()\
    \ method to initiate the request to the server. It accepts a data argument:\n\n\
    ```\nxhr.open(\"POST\", \"/request/1\", true);\nxhr.send(data);\n```\n\nBecause\
    \ the communication is asynchronous you can't count on sequential execution of\
    \ methods. For example:\n\n```\nxhr.send(data);\ndoSomething();\n```\n\nThe send\
    \ method is executed and returns immediately, whereas the request and response\
    \ each operate on separate threads. You won't have the response from the server\
    \ when doSomething(); gets executed. The solution is to use the callback handler\
    \ onreadystatechange, which is invoked when there is a request state change. So,\
    \ the previous snippet can"
  merge: -1
  pgno: 135
- img_proc: true
  md: "rewritten as:\n\n```\nxhr.onreadystatechange = function() {\n  if(this.status\
    \ >= 200 && this.status < 300) {\n    doSomething();\n  } else {\n    // problem\
    \ with communication\n  }\n}\nxhr.send( data );\n```\n\nNow, when the request\
    \ is completed and successful, doSomething() is executed. Table 6-2 shows the\
    \ ready states.\n\n# TABLE 6-2: The ReadyState Object\n\n| STATE | DESCRIPTION\
    \ |\n| --- | --- |\n| 0: Uninitialized | The object has been constructed. |\n\
    | 1: Loading | The open() method has been successfully invoked. During this state\
    \ request headers can be set using setRequestHeader() and the request can be made\
    \ using the send(method). |\n| 2: Loaded | All redirects (if any) have been followed\
    \ and all HTTP headers of the response have been received. Server response members\
    \ of the object are now available. |\n| 3: Interactive | The response body is\
    \ being received. |\n| 4: Completed | The data transfer has been completed or\
    \ something went wrong during the transfer (e.g., infinite redirects). |\n\nFrom:\
    \ http://www.w3.org/TR/XMLHttpRequest/#states\n\nAfter the request is completed\
    \ and successful, you can get the response using the xhr object's responseText\
    \ method. What the responseText returns depends on the server-side code. It can\
    \ be text of any format, not just XML. Now given that, you can expect any data\
    \ format to come from the server — HTML, XML, JSON, plain text, and so on, each\
    \ with its own pros and cons for parsing data.\n\nThe major trend nowadays is\
    \ using JSON at the data interchange format of choice. Since it's a native JavaScript\
    \ object, people find it easier to deal with programmatically. Instead of firing\
    \ up DOM traversal methods to walk through the XML DOM returned by the server,\
    \ you can use dot notation to access properties of the JSON response. Also, JSON\
    \ is generally less verbose than XML so it lowers the cost of each request over\
    \ the wire.\n\nYou'll still see XML, of course, and there are uses for plain text\
    \ and full blocks of HTML, but it's much more common to see JSON these days.\n\
    \nAs you've no doubt expected, jQuery offers alternative ways of handling Ajax\
    \ request and response in a more simplified manner."
