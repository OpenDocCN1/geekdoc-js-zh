  md: "The JavaScript in this example is obviously intrusive. I've bound to the onclick\
    \ event the hitMe()> method. The previous example can also be written as:\n\n\
    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_104_0.png)\n\n```\n<html>\n<head>\n<style\
    \ type=\"text/css\">\n.clickDiv {\n  width:100px;\n  height:100px;\n  background-color:blue;\n\
    }\n</style>\n<script type=\"javascript\">\ndocument.getElementById(\"clickDiv\"\
    ).onclick = function(event){\n  document.getElementsByTagName(\"body\")[0].appendChild(\"\
    clicked\");\n}\n</script>\n</head>\n<body>\n<div id=\"clickDiv\" class=\"checkBox\"\
    >Click Here</div>\n</body>\n</html>\n```\n\nCode snippet is from better-onclick.txt\n\
    \nwhich now separates the control logic from the structure. This still suffers\
    \ from a few setbacks. The function bound to the onclick event accepts a event\
    \ object. While most browsers accept the standard event object, Internet Explorer\
    \ uses window.event, or in other words, binds the event to the global window object.\
    \ Using feature detection, preferred over browser detection, your event handler\
    \ script should do something like the following:\n\nvar evt = (window.event ?\
    \ window.event : event);\n\nFurthermore, the standard event object is not the\
    \ same as IE's object, and supports a slightly different set of properties. For\
    \ cross-browser scripts, this is very annoying and breaks compatibility. Table\
    \ 5-2 illustrates some of the similarities/differences between the IE Event object\
    \ and the Standard Event object.\n\n# Table 5-2: Firefox Event Object (IE) Compatibilities\n\
    \n| NAME | PROPERTY OR METHOD? |\n|---|---|---|\n| stopPropagation() | Method\
    \ | cancelBubble() |\n| layerX, layerY | Property | offset, offset |\n| Target\
    \ | Property | srcElement |\n| Type | Property | Type |\n| preventDefault() |\
    \ Method | returnValue() |\n| altKey, ctrlKey, shiftKey | Property | altKey, ctrlKey,\
    \ shiftKey |\n| Button | Property | Button |"
