    to add unit tests to your projects. As you probably already know, although jQuery
    handles most cross-browser concerns, it is still necessary to test in different
    browsers and environments, including portable devices like iPhones. Having a full
    test suite will make it easier to detect and squash cross-browser bugs.


    For small bits of code, like one-liners, use console applications like jconsole
    and Rhino to make sure you''re getting the expected results.


