    , function(event){\n        console.log(\"I have a handler\");\n      });\n  \
    \  });\n    $(\"body\").append(\"<a id='anchor'>I go nowhere where</a>\");\n \
    \ </script>\n</head>\n<body>\n</body>\n</html>\n```\n\nCode snippet is from on-live.txt\n\
    \nUsing on() like delegate() uses the exact syntax as the live() replacement in\
    \ the previous example. This illustrates one of the benefits of the new, simplified\
    \ events API. Instead of remembering two separate methods and their associated\
    \ arguments, you simply remember the on() method and adjust your arguments accordingly.\
    \ If you truly need to bind events to generic elements across the whole page,\
    \ you just use .on() on the document and pass in your generic p or a selector.\
    \ If you want to follow the more performant delegate pattern, you simply apply\
    \ .on() to a more focused selector.\n\nRewriting the earlier .delegate() example\
    \ to use .on() is shown in the following code sample. In it, .on() is used to\
    \ listen for clicks on the #delegate div and provides the provided handler function\
    \ if the click originates from a p.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_123_1.png)\n\
    \n```\n<head>\n  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n\
    \  <script>\n    $(function({\n      $(\"#delegate\").on(\"click\", \"p\", function({\n\
