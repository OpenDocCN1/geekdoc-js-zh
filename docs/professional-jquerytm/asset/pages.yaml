    \ in #junit-fixture, make your DOM magic, and then use assertions to test the\
    \ state of the DOM. QUnit will reset jquery after each test.\n\nA simple example\
    \ is shown in the following code:\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_291_0.png)\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
