    # # Accordion


    Accordion widgets, similarly to tabs, are a great way to display and categorize
    a large amount of information. This widget is an expandable/collapsible box. It’s
    not meant to have all of its content expanded at the same time, but to display
    one "slice" of content at a time.


    Table 8-6 illustrates the various accordion methods.


    # Table 8.6: Available $.accordion Methods


    | METHOD | DESCRIPTION |

    | --- | --- |

    | $(selector).accordion(); | Initializes an accordion. |

    | $(selector).accordion("destroy"); | Removes the accordion completely. This option
    rolls the selected element back to its initial state. |

    | $(selector).accordion("disable"); | Disables the accordion. |

    | $(selector).accordion("enable"); | Enables the accordion. |

    | $(selector).accordion("option:optionName", [value]); | Gets or set any accordion
    option. If the third argument is omitted, it sets the optionName with the provided
    value. |

    | $(selector).accordion("widget"); | Returns the ui-accordion element. |

    | $(selector).accordion("activate": index); | Activates a content part of the
    accordion. The index indicates the zero-indexed number matching the position of
    the header to close or a selector matching an element. |

    | $(selector).accordion("resize"); | Recomputes the heights of the accordion content.
    |


    The required markup for an accordion is a div with nested headers, where each
    header requires a link. The content is placed in a nested div following the header,
    as the following example illustrates:'
