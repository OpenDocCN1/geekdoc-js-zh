    \nTraditionally, you would use jQuery, or some form of JavaScript, to either mask\
    \ a field or validate the data. The simplest example is to check that data has\
    \ been entered for a required field:\n\n```\nif(\"myInput\").val() !== '') {\n\
    \  // handle here\n}\n```\n\nA note of caution: your carefully crafted validation\
    \ is useless if end users turn off JavaScript features on their browsers. Data\
    \ should be sanitized on both the server and client side before saving.\n\n# Feature\
    \ Detection with Modernizn\n\nBefore going any further with HTML5 forms and jQuery,\
    \ it's a good time"
