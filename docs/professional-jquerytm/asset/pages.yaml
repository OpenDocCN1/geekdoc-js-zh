- img_proc: true
  md: ".data() method, which stores arbitrary data for an element with a meaningful\
    \ key. It takes the following form:\n$data(element, key, value);\n\nOr, to review\
    \ the stored data use:\n$data(element, key);\n\nFor example:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <script src=\"\"></script>\n  <script type=\"text/javascript\"\
    >\n$(function() {\n    $(\"randomEl\").data(\"itemPrice\", \"1999\");\n  });\n\
    </script>\n</head>\n<body>\n  <img src=\"imageBase.jpg\" id=\"randomEl\">\n</body>\n\
    </html>\n```\n\nNow it is obvious that 1999 is not a year, but rather a price.\
    \ HTML5 introduces custom data attributes, where any attribute prefixed with data-\
    \ can be used in a standardized, programmatic way. For example, the following\
    \ element contains the data attribute data-age. That's an alternative for storing\
    \ information on the client side.\n<div id=\"person\" data-age=\"31\"></div>\n\
    \nMicrosoft contributed to the community three additional plugins that, for a\
    \ time, officially endorsed by the jQuery Project; Data Link, Template, and Globalization.\
    \ In a later we review the Template plugin. The Data Link plugin allows two-way\
    \ binding between objects. In other words, it links the one object to another,\
    \ so changing the value of one field changes the corresponding field on the second\
    \ object. You can use this feature to simplify communication between a form and\
    \ an object because it removes glue code. For example:\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_127_0.png)\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"http://code.jquery.com/jquery-1.6.1.js\"\
    ></script>\n  <script src=\"jquery.datalink.js\"></script>\n  <script type=\"\
    text/javascript\">\n$(document).ready(function(){\n  var registration = {};\n\
    \  $(\"form\").link(registration);\n\n  // set some default values\n  $(registration).set(\"\
    name\", \"New User Registration\");\n  $(registration).set(\"email\", \"i_dont_exist@mail.com\"\
    );\n});\n```"
