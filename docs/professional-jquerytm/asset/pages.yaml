  md: '# Chapter 5


    # Event Handling


    # WHAT’S IN THIS CHAPTER?


    +   - Understanding the Browser Event Model

    - Understanding How jQuery Handles Events

    - Loading with jQuery Events


    Any GUI-based modern application is inherently event-driven, and web applications
    are no event-driven applications follow the familiar pattern of setting up event-handling
    mechanisms, waiting for an interesting event to occur (such as a mouse click),
    and responding to that event. Beyond the normal clicking and key-pressing events,
    there’s also page loading and other semantic events, as well as the more recently
    added events such swipe gestures, which are now important given the popularity
    of touch devices such as iPhones and Android. Events are fundamental to the Web;
    the JavaScript is seriously limited without them. The jQuery docs categorize event
    methods into document loading, form events, event-handler attachments, mouse events,
    browser events, methods related to the Event object, and keyboard events.


    Most likely, at some point in your career as a developer you''ve heard about the
    various cross-browser issues that plague web development. How different browsers
    manage events is one of the most significant cross-browser problems.


    In this chapter you review basic JavaScript event handling, both DOM level 0 and
    level 2, event propagation, bubbling, and Internet Explorer’s event model to get
    a better understanding of what’s going on under the hood. Then you translate that
    knowledge over to jQuery’s event-handling mechanism, and see how it normalizes
    all of the cross-browser difficulties. Finally, you apply this to a sample application.


    # UNDERSTANDING THE BROWSER EVENT MODEL'
  merge: -1
  pgno: 102
- img_proc: true
  md: "Before getting into how jQuery handles events, and how it saves a lot of grief,\
    \ let's review JavaScript event models. JavaScript was originally introduced as\
    \ LiveScript in 1995. In the DeLorean and jumping back in time to 1996, Netscape\
    \ Navigator and Microsoft Internet Explorer 3 were all the rage among young crowd.\
    \ Table 5-1 illustrates the various event models in play during primordial days\
    \ of web scripting.\n\n# TABLE 5-1: DOM Level Events\n\n| DOM LEVEL DESCRIPT |\n\
    | 0 | Original event models developed by Netscape. All browsers support this model.\
    \ |\n| 2 | Standard event model, more advanced than level 0, but not supported\
    \ by IE. |\n| IE Model | A separate event model that only IE browsers use. |\n\
    \nDOM level 0 refers to the document model support given by Netscape Navigator\
    \ 2.0, which is also adopted by later layers. This is not a formal standard, but\
    \ all major browsers are level 0 compatible. DOM provides an interface for accessing\
    \ and modifying the content, style, and structure of an HTML document. DOM level\
    \ 0 events are handled either inline, with an \"on\" attribute added to the element\
    \ with JavaScript code as the attribute value, or by selecting the element JavaScript\
    \ code and the binding an anonymous function as the event handler. The following\
    \ snippet demonstrates the former method:\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_103_0.png)\n\
    \n```\n<html>\n<head>\n<style type=\"text/css\">\n.clickDiv {\nwidth:100px;\n\
    height:100px;\nbackground-color:blue;\n}\n</style>\n<script type=\"javascript\"\
    >\nfunction hitMe() {\n  var txtNode = document.createTextNode(\" clicked \");\n\
    \  var br = document.createElement(\"br\");\n  document.getElementsByTagName(\"\
    body\")[0].appendChild(txtNode);\n  document.getElementsByTagName(\"body\")[0].appendChild(br);\n\
    }\n</script>\n</head>\n<body>\n<div class=\"clickDiv\" onclick=\"hitMe();\">\n\
    </div>\n</body>\n</html>\",\n```\n\nCode snippet is from onclick.txt"
  merge: -1
