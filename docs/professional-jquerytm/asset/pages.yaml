  md: "# LISTING 10-3: $.each() vs. [].forEach() vs. a traditional for loop\n\n/*\n\
    * Here we use the setup function which populates an array with integers\n */\n\
    \n```\nvar numbers = [];\nfives = [];\nfor ( var i=0; i<1000000; i++) {\n  numbers.push(Math.round(Math.random()*i));\n\
    }\n```\n\n/*\n* First we use a traditional for loop,\n* caching the length\n */\n\
    \n```\nvar test = numbers.length;\nfor ( var j = 0; j<test; j++) {\n  if ((numbers[j]\
    \ % 5) == 0 && numbers[j] != 0) {\n    fives.push(numbers[j]);\n  }\n}\n```\n\n\
    /*\n* Now we use the ESS method.\n* This is actually what jQuery falls back on\
    \ if it's available\n */\n\n```\nnumbers.forEach(function(e,i) {\n  if ((e % 5)\
    \ == 0 && e != 0) {\n    fives.push( e);\n  }\n});\n```\n\n/*\n* Finally we use\
    \ the $.each, convenience method.\n */\n\n```\n$each(function(i,e) {\n  if ((e\
    \ % 5) == 0 && e != 0) {\n    fives.push( e);\n  }\n});\n```\n\n> Code snippet\
    \ is from looptest.txt\n\nThe difference in speed between the three versions is\
    \ shown in Table 10-2. You can clearly see, for the loop is significantly faster\
    \ than the convenience methods.\n\n# TABLE 10-2: for loop, forEach, and $.each\
    \ (Higher is Better)"
