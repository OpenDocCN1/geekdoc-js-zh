    Who hasn''t added a script tag for including jQuery, only to find out much later,
    with great dismay, that the path was mistyped? The debuggers will let you know
    quickly if the $ variable is undefined.


    Being aware of browser-specific issues and their particular behaviors is important.
    Trailing comma in an object literal is priceless after you''ve developed in a
    browser like Firefox or Safari for hours, only to have your beautifully scripted
    project explode in IE.


