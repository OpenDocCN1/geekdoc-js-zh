  md: '# Give Your Selectors a Context


    By default, when you pass a selector into jQuery, it traverses the entire DOM.
    There''s an underused, second possible context argument into jQuery that limits
    search to a specific section of the DOM. As a note, it helps to pass in fast selectors
    as the additional context. It doesn''t much help to speed things up with a context
    if the context itself is slow to be reached.


    This traverses the whole DOM:


    ```

    $(".className")

    ```


    This searches only element#id:


    ```

    $(".className", "#id")

    ```


    As Table 10-5 shows, adding in a context is always faster than a whole DOM selector
    or a selector with two (or more) elements.


    **TABLE 10-5:** jQuery Selector Performance (Higher is Better)


    | SELECTOR | FF8 | IE6 | IE7 | IE8 |

    | --- | --- | --- | --- | --- |

    | $(".class" ) | 6,487 | 21 | 99 | 1,997 |

    | $(".#id.class" ) | 2,595 | 1,376 | 8,457 | 2,697 |

    | $(".class", "#id") | 33,289 | 1,688 | 12,174 | 11,762 |

    | SELECTOR | IE9 | ANDROID 2.3 | SAFARI 5 | CHROME 15 |

    | $(".class" ) | 10,198 | 418 | 4,255 | 3,312 |

    | $(".#id.class" ) | 3,313 | 420 | 5,100 | 5,199 |

    | $(".class", "#id") | 38,295 | 4,100 | 49,468 | 46,880 |


    # Consider Skipping jQuery Methods Entirely


    If performance is of primary concern to your site or application, it''s useful
    to keep in mind the places where it is safe to skip jQuery methods entirely, falling
    back to quicker core JavaScript methods and properties. One common example is
    using attr() to get the href attribute and then using attr() to apply it to another
    element:


    ```

    $("baz").attr("href", $this).attr("href");

    ```


    If you know JavaScript methods, the preceding line can be rewritten as:


    ```

    document.getElementById("baz").href = this.href;

    ```


    As you can see, calls to jQuery are removed because you use document.getElementById
    to reference the element in question and then'
