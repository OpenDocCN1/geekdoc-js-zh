  md: '# OBTAINING JQUERY AND JQUERY UI


    Besides the links found on jquery.com for downloading the production and development
    versions, you have a few other options for obtaining or linking to the jQuery
    libraries. You can link to several content delivery networks (CDNs) in your applications
    such as Google, Microsoft, and the jQuery CDN that are mentioned on the official
    jQuery website.


    The following code illustrates obtaining jQuery from the various available CDNs.
    Simply add a script tag, point it at the proper URL and you''re ready to go.


    ![](img/8acf2bc7faf21ccdde2b9192aee791a5_9_0.png)


    ```

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>

    <script src="http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.7.1.min.js"></script>

    <script src="http://code.jquery.com/jquery-1.7.1.min.js\/\></script>

    ```


    Code snippet from cdns.txt


    A Git repository also hosts a “Work in Progress,” or WIP, build. This is a constantly
    revised development version, which is not meant for production. The WIP build
    is generated every single minute. To use this bleeding-edge version you can directly
    link from http://code.jquery.com/jquery-git.js or you can clone the Git repository
    to build it jQuery from scratch. The following code shows the Git command used
    to clone the latest version of the library.


    ```

    $ git clone https://github.com/jquery/jquery jquery-build

    ```


    In order to build, you''ll need GNU make 3.8+ and Node.js .+. After cloning the
    repo, change into the jQuery directory and execute the make command. This will
    generate a complete minified version of jQuery, and run through JSLint (more on
    JSLint later). If you don''t want this, run make instead of make.


    # “HELLO WORLD” EXAMPLE


    No programming text is complete without the ubiquitous “Hello World” program:'
