  md: "TABLE 4-7: Child Filters\n| SELECTOR | DESCRIPTION |\n| :first-child | Selects\
    \ all elements that are the first child of parent. |\n| :last-child | Selects\
    \ all elements that are the last child of parent. |\n| :nth-child | Selects all\
    \ elements that are the nth-child of parent. |\n| :only-child | Selects all elements\
    \ that are the only child of parent. |\n\n# # Custom User Selectors\n\nIf the\
    \ built-in selectors are not enough, you can extend jQueryWith your own custom-made\
    \ selectors. To do so, you must extend the core jQuery object. The following code\
    \ snippet creates a custom selector that selects elements with a green background:\n\
    \n![](img/8acf2bc7faf21ccdde2b9192aee791a5_88_0.png)\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<script src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n\
    <script>\n$(function() {\n // Define custom filter by extending $.expr(\":\")\n\
    \  $.expr(\":\\].greenb\") = function(element) {\n    return $(element).css(\"\
    background-color\") === \"green\";\n  };\n  var n = $(\":.greenb\").length;\n\
    \  console.log(\"There are \" + n + \" green divs\");\n});\n</script>\n</head>\n\
    <body>\n<div style=\"width:100; height:10; background-color:green;\"></div>\n\
    <div style=\"width:100; height:10; background-color:black;\"></div>\n<div style=\"\
    width:100; height:10; background-color:blue;\"></div>\n</body>\n</html>\n```\n\
    \n> Code snippet is from custom-filters.txt\n\nThe capacity to create your ad-hoc\
    \ selectors is a welcome feature, because you're not limited to the built-in selector\
    \ domain.\n\n# # DOING DOM TRAVERSAL\n\nBy now, we hope you're convinced that\
    \ the jQuery selectors offer a diverse set of options for creating a wrapper with\
    \ elements selected from the DOM. The next set of tools you'll need in your arsenal\
    \ will allow you to manage your wrapped set. Handling tasks such as getting element"
