  md: "# The Module Pattern\n\nA variation on the singleton, the module pattern was\
    \ created by Douglas Crockford, Chief JavaScript Architect at Yahoo! and author\
    \ of the JSON data exchange format. It was popularized by a post by Eric Miraglia\
    \ on the Yahoo! User Interface Blog in June 2007 (http://www.uiblog.com/blog/2007/06/module-pattern/)\
    \ and is cover in depth in Crockford's book, JavaScript: The Good Parts (O'Reilly\
    \ Media, 2008). It enhances the encapsulation provided by the singleton and adds\
    \ the ability to create private methods and properties.\n\nThe module pattern\
    \ consists of three main components: a namespace similar to the one leveraged\
    \ in the previous example, a function that immediately executes, and the function's\
    \ return object, which contains publicly available methods and properties. You\
    \ can see a simplified example in Listing 10-9.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_209_0.png)\n\
    \n# LISTING 10-9: The JavaScript module pattern\n\n```\n// Our app namespace.\
    \ We pass in the Jquery object to shorten lookups\nvar myApp = function () {\n\
    \  // private variables and methods, only available within this myApp\n  var message\
    \ = \"not directly accessible from outside the module\";\n  var multiplier = function\
    \ (x, y) {\n    return x * y\n  };\n  // the return object contains the public\n\
    \  properties and methods\n  return {\n    init: initialize the app,\n    prop:\
    \ \"42\",\n    specialNumber: function () {\n      // access to our private method\n\
    \      var num = multiplier(7, 6);\n      return \"our special number is definitely\
    \ \" + num;\n    },\n    // we provided access to private variables\n    shareMessage:\
    \ function(arg) {\n      if (arg === \"open sesame\") {\n        return message\
    \ + \"unless you know the magic word\";\n      } else {\n        throw new Error(\"\
    You need to know the magic word\");\n      }\n    }\n  };\n}( jQuery );\n```\n\
    \nExamining this sample app on the console illustrates the way the module"
  merge: -1
  pgno: 209
- img_proc: true
  md: "works. The private variables can be referenced within the module body, but\
    \ can't be called directly from the outside. You are able to grant access in special\
    \ cases through methods exposed in the return object. As you can see in Listing\
    \ 10-10, examining the module using console.log illustrates both cases.\n\n# LISTING\
    \ 10-10: Examining the module pattern in the JavaScript console\n\n```\n>>> console.log(\
    \ myApp.message )\nundefined\n>>> console.log( myApp.multiplier() )\nTypeError:\
    \ myApp.privateMethod is not a function\n>>> console.log( myApp.shareMessage(\
    \ \"please?\" ) )\n\"You need to know the magic word\"\n>>> console.log( myApp.shareMessage(\
    \ \"open sesame\" )\\ndirectly accessible from outside the module, unless you\
    \ know the magic word\n42\n>>> console.log( myApp.specialNumber() )\nOur special\
    \ number is literally 42\n```\n\nExtending the pattern to additional modules is\
    \ straightforward. Listing 10-11 illustrates a dashboard module, complete with\
    \ a private configuration object and a public method to allow gated access to\
    \ dashboard configuration based on a set of predefined criteria. If you've got\
    \ experience with languages like C#, Java, and C++, then you're familiar with\
    \ the usage of the private and public keywords. This pattern allows JavaScript\
    \ to provide similar functionality. It's not every day that you'll need to use\
    \ this kind of protected access, but it's important to know that it's there when\
    \ the need does arise.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_210_0.png)\n\
    \n# LISTING 10-11: A dashboard module\n\n```\nmyApp.dashboard = function ( ) {\n\
    \  // private variables and methods\n  var config = {\n    \"color\" : \"blue\"\
    ,\n    \"title\" : \"my dashboard\",\n    \"width\" : \"960px\"\n  };\n  return\
    \ {\n    init : function(){\n      //initialize the dashboard\n    },\n  };\n\
    \  //updateConfig allows for monitored configuration\n  //of the private config\
    \ object\n```"
