    \ # The Garber-Irish Implementation\n\nThe following pattern expands on the singleton\
    \ and module pattern with cleverly chosen markup and style hooks to create a seamless\
    \ initialization pattern for sites and applications.\n\nThis pattern was introduced\
    \ in 2009 by Paul Irish in a blog post entitled “Markup-based unobtrusive DOM-ready\
    \ execution” (http://paulirish.com/2009/markup-based-unobtrusive-comprehensive-dom-ready-execution/)\
    \ and later modified by Jason Garber in a blog post entitled “http://www.viget.com/inspire/extending-paul-irish-comprehensive-dom-ready-execution/.\n\
    \nIn short, it leverages a small utility script and either CSS classes or HTML5\
    \ attributes on the body element to selectively fire init() events depending on\
    \ the section or page type. This pattern alleviates the problem of trying to hunt\
    \ down $(document).ready() calls strewn throughout an application, instead providing\
    \ a consistent, structured approach that works across multiple domains (server\
    \ code, JavaScript, and style).\n\nYou can use either version, depending on your\
    \ taste, so I'll share both flavors. First up is Paul’s original version.\n\n\
    # # The Original Recipe\n\nThe pattern starts with a typical object literal. This\
    \ variation has that"
