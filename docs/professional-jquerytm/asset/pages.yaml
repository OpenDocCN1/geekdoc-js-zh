    \ \"block\", \"display:block\");\n  });\n});\n</script>\n</head>\n<body>\n<h1\
    \ id=\"qunit-header\">QUnit example</h1>\n<h2 id=\"qunit-banner\"></h2>\n</body></html>\n\
    ```"
