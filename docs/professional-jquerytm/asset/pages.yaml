  md: "proper semicolon usage.\n\nIf you follow good coding practice anyway, you should\
    \ be fine, but it's especially important when your code is going to live on in\
    \ unknown environments.\n\nFor reference, the Google JavaScript Style Guide (http://styleguide.google.com/svn/trunk/javascriptguide.xml#Semicolon:)\
    \ says the following about semicolons:\n\n> “Relying on implicit insertion can\
    \ be subtle, hard to debug problems. Don't do it. You're better than that.”\n\n\
    Translated — semicolons are your friend.\n\nAdditionally, it's a relatively common\
    \ practice to include a leading semicolon in your plugin definition to ensure\
    \ that your code will function properly in a minified environment. It's possible\
    \ (even likely) that other code will break when minified because of poor semicolon\
    \ usage or other buggy statements. Inserting a semicolon at the beginning of your\
    \ plugin definition ensures that any previous statements will be explicitly ended\
    \ at that point.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_246_0.png)\n\n```\n\
    (function($, window, document, undefined ) {\n  $fn.newStuff = function() {\n\
    };\n})(jquery, window, document);\n```\n\nCode snippet is from leading-semicolon.txt\n\
    \n# Return the jQuery Object Wherever Possible\n\njQuery is an example of a Fluent\
    \ Interface, a software pattern identified by Martin Fowler and Eric Evans and\
    \ described by Fowler in 2005 (http://www.martinfowler.com/bliki/FluentInterface.html).\
    \ The basic concept method chaining with an API that reads more natural language\
    \ to create a more natural, accessible API. In describing one implementation,\
    \ Fowler said “The API is primarily designed to be readable and to flow.” That\
    \ description could apply equally well to jQuery.\n\nWith in mind, it's clear\
    \ that one of the key features of jQuery is the ability to chain methods. The\
    \ concise, “Fluent” feel of the API provided by chaining was one of the features\
    \ that truly drew people into the library, and chaining remains a popular feature\
    \ for jQuery and other JavaScript libraries, large and small."
