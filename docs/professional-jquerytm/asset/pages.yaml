    # More Effective Looping


    Before you get into this particular optimization, it should be pointed out that,
    most of the time, using the jQuery convenience method $.each() on a collection
    is a perfectly acceptable solution for iterating the members of an array.


    Sometimes, however, using $.each() isn''t acceptable. With larger collections
    where speed is an issue, using traditional control structures are a more effective
    solution.


    # $.each() and Array.forEach(): Trading Convenience for Speed


    All implementations of this functionality, whether it''s the aforementioned jQuery
    convenience method or the EcmaScript 5th Array method forEach(), are slower than
    an array loop. To understand why this is, it''s useful to understand the scope
    in which the looped code runs.


    # The Price of Function Creation and Adding Levels to Symbol Lookup


    Take a look at the simple example in Listing 10-3 that looks through a collection
    of integers and tests to see if they''re multiples of the number 5. One test is
    done with a traditional loop, one with [].forEach(), and the other is done with
    $.each().'
