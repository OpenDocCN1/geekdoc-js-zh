- img_proc: true
  md: "If you ever find the need to debug Deferred resolution (and you will if you\
    \ ever get deep into using Deferrals), you'll be taking advantage of Deferred.state.\n\
    \nA simple function, deferred.state returns a string value representing the current\
    \ state of a Deferred. The three return values are \"pending,\" \"resolved,\"\
    \ and \"rejected.\"\n\nTable 13-1 defines the three states.\n\nTABLE 13-1 Potential\
    \ Deferred States\n| STATE | DEFINITION |\n|---|---|n| pending | The Deferred\
    \ object is not yet in a completed state. |\n| resolved | The Deferred object\
    \ is in the resolved state, meaning that the deferred.resolve() method has been\
    \ called and the Deferred's callback methods have fired. |\n| rejected | The Deferred\
    \ object is in the resolved state, meaning that the deferred.reject() method has\
    \ been called and the Deferred's callback methods have fired.\n\nThe following\
    \ example shows deferred.state calls sprinkled throughout a Deferred chain based\
    \ on the long-running function example from the previous section.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_280_0.png)\n\
    \n```\nvar longRunning = function() {\n  return S.Deferred(function( dfd ) {\n\
    \    dfd.notify(\"operation started\");\n    console.log(dfd.state);\n    var\
    \ callback = function() {\n      dfd.notify(\"operation finished\");\n      dfd.resolve();\n\
    \    };\n    setTimeout(callback, 5000);\n  }).promise();\n};\n\nlongRunning().progress(\n\
    function( notification ) {\n  console.log(dfd.state);\n  $(\"notifier\").text(notification).fadeIn(500);\n\
    }).done(function() {\n  console.log(dfd.state);\n  $(\"notifier\").css({\n   \
    \ \"color\": \"green\",\n    \"font-weight\": \"bold\"\n  });\n});});\n```\n\n\
