    In some cases you may want to validate values in a database, and using Ajax you
    can achieve this effect. But first, the following section provides a quick review
    of Ajax and later on we return to form validation.


    # REVISITING AJAX BASICS


    The definition of Ajax has evolved from its original acronym of Asynchronous JavaScript
    and XML, a method for sending and retrieving data (using XML) to a server asynchronously
    without the need to completely reload a web document. It now refers to methods
    for creating interactive web and dynamic applications with JavaScript, as you''ve
    seen in previous chapters, as well as asynchronous communication between the client
    and server. These days it''s not always XML that''s used to transport information
    between the server and client, but often other formats such as JSON.


    At the heart of Ajax is the XMLHttpRequest object, which dates back to 2000 when
    Microsoft introduced an ActiveX object for asynchronous communication between
    server and client. The term “Ajax” was coined by James Garrett to describe this
    technique.


    The same disparity between the way browsers manage events is also observed with
    Ajax, albeit not as complex. For example, to create a new request object in Internet
    Explorer, you would the following:


    ```

    var xhr = new ActiveXObject("Microsoft.XMLHTTP")

    ```


    or in older versions of IE:


    ```

    var xhr = new ActiveXObject("MSXML2.XMLHTTP")

    ```


    In IE 7 and above any other browser that supports XMLHttpRequest, you use the
    native JavaScript XMLHttpRequest object:


    ```

    var xhr = new XMLHttpRequest();

    ```


    Luckily, the methods used between the standard XMLHttpRequest object and the Microsoft
    ActiveX object are remarkably similar, hence simplifying matters. Typically, if
    you were to handle the details yourself'
