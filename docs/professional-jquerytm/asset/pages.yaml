  md: "# Code snippet is from decoupling.txt\n\nWith just the simple application of\
    \ a Deferred, updateStatus is now much more flexible. Instead of being tied to\
    \ a single callback, you can now use that same piece of code in several different\
    \ flows. The upcoming code block shows several ways in which it could be used\
    \ to take advantage of Deferreds.\n\nThe example contains three callback functions.\
    \ The first is equivalent to the original anonymous functions passed as a callback\
    \ in the first example. The second, alternativeCallback, represents a different\
    \ path to follow after the animation completes. If the same animation is running\
    \ on a second page, a different piece of markup will have to be updated. The third,\
    \ happyBirthday, represents a function to be called in a special case where a\
    \ specific UI update would be required, a \"HAPPY BIRTHDAY\" message indicator,\
    \ for example. Three uses of $.when follow. The first replicates the original\
    \ case with a single callback function. The second shows the alternative callback.\
    \ The third shows multiple callbacks.\n\n![](img/8acf2bc7faf21ccdde2b9192aee791a5_271_0.png)\n\
    \n```\nfunction callback() {\n  console.log(\"The animation is done. To the next\
    \ operation\");\n}\nfunction alternativeCallback() {\n  console.log(\"The animation\
    \ is done. Let's follow a different path.\");\n}\nfunction specialCase() {\n \
    \ console.log(\"This is a special case. Let's do a special UI update.\");\n}\n\
    \n$.when(updateStatus()) {\n  .done( callback );\n}\n//an alternative callback\n\
    $.when(updateStatus()) {\n  .done( alternative callback );\n}\n//multiple callbacks\n\
    $.when(updateStatus()) {\n  .done(\n    [ callback,\n      specialCase ]\n  );\n\
    }\n```\n\n# Code snippet is from decoupled-callbacks.txt\n\nAs you can see, the\
    \ code nicely decoupled the callback logic from the animation buried in the function\
    \ body. This allows for greater code reuse and presents a much clearer pattern\
    \ for any other developers on the project to grasp. No one even needs to read\
    \ updateStatus how the the"
