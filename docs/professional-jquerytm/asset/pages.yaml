    \ <!-- returns 3 -->\n  &lt;li&gt;Hawk&lt;/li&gt; <!-- returns 4 -->\n</ol>\n\n\
    $(\":fowl\") // returns turkey, parrot, and hawk\n$(\":li:first\") // returns\
