  md: "The while statement is followed by a condition in parentheses and a code block\
    \ in curly brackets. As long as the condition evaluates to true, the code block\
    \ is executed over and over again.\n\n# # Do-while loops\n\ndo-while loops are\
    \ a slight variation of while loops. An example is shown as follows:\n\n```\n\
    var i = 0;\ndo ({\n  i++;\n} while (i < 10);\n```\n\nHere, the do statement is\
    \ followed by a code block and a condition after the block. This means that the\
    \ code block is always executed, at least once, before the condition is evaluated.\n\
    \nIf you initialize i to 1 instead of 0 in the last two examples, the code block\
    \ in the first example (the while loop) will not be executed, and i will still\
    \ be 11 at the end, while in the second (the do-while loop), the code block will\
    \ be executed once and i will become 12.\n\n# # For loops\n\nfor is the most widely\
    \ used type of loop, and you should make sure you're comfortable with this one.\
    \ It requires just a bit more in terms of syntax.\n\n![](img/901612d85bd2f01ce60fcfeb0719ea7c_71_0.png)\n\
    \nIn addition to the condition C and the code block L, you have the following:\n\
    \n+   - Initialization—code that is executed before you even enter the loop (marked\
    \ with 0 in the diagram)\n- Increment—code that is executed after every iteration\
    \ (marked with ++ in the diagram)"
