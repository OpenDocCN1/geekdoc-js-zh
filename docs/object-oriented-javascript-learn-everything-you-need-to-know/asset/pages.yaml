    # Cookies, title, referrer, domain


    The four properties of document Level 0 to the HTML extension of DOM Level 1.
    In this section are also ported from DOM. Unlike the previous ones, for these
    properties there are no core DOM equivalents.

    document.cookie is a property that contains a string. This string is the content
    of the cookies exchanged between the server and the client. When the server sends
    a page to the browser, it may include the Set-Cookie HTTP header. When the client
    sends a request to the server, it sends the cookie back with the Cookie header.
    Using document.cookie you can alter the cookies sent to the server. For example,
    visiting cnn.com and typing document.cookie in the console gives you the following:


    ```

    > document.cookie;

    "mbox"check=true#1356053765#135605370495-121286#1356055565...

    ```


    document.title allows you to change the value of the page displayed in the browser
    window. For example, see the following code:


    ```

    > document.title = ''My title'';

    "My title"

    ```


    Note, that this doesn''t change the value of the <title> element, but only the
    display in the browser window, it''s not equivalent to document.querySelector(''title'').


    document.referrer tells you the URL of the previously-visited page. This is the
    same value the browser sends in the Referer HTTP header when requesting the page.
    (Note, that Referer is misspelled in the HTTP headers, but is correct in JavaScript''s
    document.referrer.) If''ve visited the CNN page by searching on Yahoo first, you
    can see something like this:


    ```

    > document.referrer;

    "http://search.yahoo.com/search?q=cnn&ie=UTF-8&fr=moz2"

    ```'
