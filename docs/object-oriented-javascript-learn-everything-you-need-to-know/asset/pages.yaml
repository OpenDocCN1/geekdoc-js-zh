  md: "# Parameters\n\nWhen defining a function, you can specify what parameters the\
    \ function expects to receive when it's called. A function may not require any\
    \ parameters, but if it does and you forget to pass them, JavaScript will assign\
    \ the value undefined to the ones you skipped. In the next example, the function\
    \ returns NaN because it tries to sum 1 and undefined:\n\n```\n> sum(1);\nNaN\n\
    ```\n\nTechnically speaking, there is a difference between parameters and arguments,\
    \ although the two are often used interchangeably. Parameters are defined together\
    \ with the function, while arguments are passed to the function when it's called:\n\
    \n```\n> sum(a, b) {\n  return a + b;\n}\n> sum(1, 2);\n```\n\nHere, a and b are\
    \ parameters, while 1 and 2 are arguments.\n\nJavaScript is not picky at all when\
    \ it comes to accepting arguments. If you pass more than the function expects,\
    \ the extra ones will be silently ignored:\n\n```\n> sum(1, 2, 3, 4, 5);\n3\n\
    ```\n\nWhat's more, you can create functions that are flexible about the number\
    \ of parameters they accept. This is possible thanks to the special value arguments\
    \ that is created automatically inside each function. Here's a function that simply\
    \ returns whatever arguments are passed to it:\n\n```\n> args() {\n  return arguments;\n\
    }\n> args();\n[]\n> args(1, 2, 3, 4, true, 'ninja');\n[1, 2, 3, 4, true, \"ninja\"\
    ]\n```"
