  md: "# Closures\n\nThe rest of the chapter is about closures (what better way to\
    \ close a chapter?). Closures can be a little hard to grasp initially, so don't\
    \ feel discouraged if you don't 'get it' during the first read. You should go\
    \ through the rest of the chapter and experiment with the examples on your own,\
    \ but if you feel you don't fully understand the concept, you can come back to\
    \ it when the topics discussed previously in this chapter have had a chance to\
    \ sink in.\n\nBefore moving on closures, let's first review and expand on the\
    \ concept of scope in JavaScript.\n\n# Scope chain\n\nAs you know, JavaScript,\
    \ there is no braces scope, but there is function scope. A variable defined in\
    \ a function is not visible outside the function, but a variable defined in a\
    \ code block (for example an if or a for loop) is visible outside the block:\n\
    \n```\nvar a = 1;\nfunction f() {\n  var b = 1;\n  return a;\n}\nf();\nb;\n```\n\
    \nReferenceError: b is not defined\n\nThe variable a is in the global space, while\
    \ b is in the scope of the function f( ). So:\n\n+   - Inside f(), both a and\
    \ b are visible\n- Outside f(), a is visible, but b is not\n\nIf you define a\
    \ function inner() nested inside outer(), inner() will have access to variables\
    \ in its own scope, plus the scope of its \"parents\". This is known as a scope\
    \ chain, and the chain can be as long (deep) as you need it to be:\n\n```\nvar\
    \ global = 1;\nfunction outer() {\n  var outer_local = 2;\n  function inner()\
    \ {\n    var inner_local = 3;\n    return inner_local + outer_local + global;\n\
    \  }\n```"
  merge: -1
  pgno: 99
- img_proc: true
  md: "Functions\n\n```\n}\n  return inner();\n}\n```\n\nLet's test that inner() has\
    \ access to all variables:\n\n+   > outer();\n6\n\n# Breaking the chain with a\
    \ closure\n\nLet's introduce closures with an illustration. Let's look at this\
    \ code and see what's happening here:\n\n```\nvar a = \"global variable\";\nvar\
    \ F = function () {\n  var b = \"local variable\";\nvar N = function () {\n  \
