  md: '# split()


    You already know about the split() method, which creates an array from an input
    string and let''s take a string of comma-separated values and split it:


    ```

    var csv = ''one,two,three,four'';

    csv.split('','');

    ["one","two","three","four"]

    ```


    Because the input string happens to have random inconsistent spaces before and
    after the commas, the array result has spaces too. With a regular expression,
    you can fix this using \s*, which means "zero or more spaces":


    ```

    csv.split(/\s*,\s*/);

    ["one","two","three","four"]

    ```


    # Passing a string when a RegExp is expected


    One last thing to note is that the four methods that you have just seen (split(),
    match(), search(), and replace()) can also take strings as opposed to regular
    expressions. In this case, the string argument is used to produce a new regex
    as if it was passed to new RegExp().


    An example of passing a string to replace is shown as follows:


    ```

    "test".replace(''t'', ''r'');

    "rest"

    ```


    The above is the same as:


    ```

    "test".replace(new RegExp(''t''), ''r'');

    "rest"

    ```


    When you pass a string, you cannot set modifiers the way you do with a normal
    constructor or regex literal. There''s a common source of errors when using a
    string instead of a regular expression for string replacements, and it''s to the
    fact that the g modifier is false by default. The outcome is that only the first
    string is replaced, which is inconsistent with most other languages and a little
    confusing. For example:


    ```

    "pool".replace(''o'', ''\*'');

    "pool"

    ```


    Most likely, you want to replace all occurrences:


    ```

    "pool".replace(/o/g, ''\*'');

    "p\*ol"

    ```'
