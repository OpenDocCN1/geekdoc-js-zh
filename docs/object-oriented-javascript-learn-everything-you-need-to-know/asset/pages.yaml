  md: "# Chapter 8\n\n+   - It's easy to add more optional configuration attributes\n\
    - It makes the code more readable because the configuration object's properties\
    \ are present in the calling code along with their names\n\nImagine you have some\
    \ sort of UI widget constructor you use to create fancy buttons. It accepts the\
    \ text to put inside the button (the value attribute of the <input> tag) and an\
    \ optional parameter of the type of button. For simplicity let's say your fancy\
    \ button takes the same configuration as a regular button.\nHave a look at the\
    \ following:\n\n```\n// a constructor creates buttons\nMYAPP.dom.FancyButton =\
    \ function (text, type) {\n  var b = document.createElement('input');\n  b.type\
    \ = 'submit';\n  b.value = text;\n  return b;\n}\n```\n\nUsing the constructor\
    \ is simple; you just give it a string. then you can add the new button to the\
    \ body of the document:\n\n```\ndocument.body.appendChild(\n  new MYAPP.dom.FancyButton('puuush')\n\
    );\n```\n\nThis is all and works fine, then you decide you also want to be able\
    \ to set some of the style properties of the button such as colors and fonts.\
    \ You can end up with a definition like the following:\n\n```\nMYAPP.dom.FancyButton\
    \ =\nfunction (text, type, color, border, font) {\n  // ...\n}\n```\n\nNow, using\
    \ the constructor can become a little inconvenient, especially when you want to\
    \ set the third and fifth parameter, but not the second or the fourth:\n\n```\n\
    new MYAPP.dom.FancyButton(\n  'puuush', null, 'white', null, 'Arial');\n```\n\n\
    A better approach is to use one config parameter for all the settings. The function\
    \ definition can become something like this:\n\n```\nMYAPP.dom.FancyButton = function\
    \ (text, conf) {\n  var type = conf.type || 'submit';\n  var font = conf.font\
    \ || 'Verdana';\n  // ...\n}\n```"
