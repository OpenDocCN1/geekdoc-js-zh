  md: 'Coding and Design Patterns


    The patterns discussed through the rest of the chapter are:


    +   * Singleton

    * Factory

    * Decorator

    * Observer


    # # Singleton


    Singleton is a creatational design pattern meaning that its focus is on creating
    objects. It helps when you want to make sure there is only one object of a given
    kind (or class). In a classical language this would mean that an instance of a
    class is only created once and any subsequent attempts to create new objects of
    the same class would return the original instance.


    In JavaScript, because there are no classes, a singleton is the default and most
    natural pattern. Every object is a singleton object.


    The most basic implementation of the singleton in JavaScript is the object literal:


    ```

    var simple = {};

    ```


    That was easy, right?


    # # Singleton 2


    If you want to use class-like syntax and still implement the singleton pattern,
    things become a bit more interesting. Let''s say you have a constructor called
    Logger() and you want to be able to do something like:


    ```

    var my_log = new Logger();

    my_log.log(''some event'');


    // ... 1000 lines of code later in a different scope ...


    var other_log = new Logger();

    other_log.log(''some new event'');

    console.log(other_log === my_log); // true

    ```


    The idea is that although you use new, only one instance needs to be created,
    and this instance is returned in consecutive calls.'
