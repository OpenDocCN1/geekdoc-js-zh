  md: 'The first three items in the preceding list represent the regex modifiers.
    If you create a regex object using the constructor, you can pass any combination
    of the following characters as a second parameter:


    +   - g for global

    - i for ignoreCase

    - m for multiline


    These letters can be in any order. If a letter is passed, the corresponding modifier
    property is set to true. In the following example, all modifiers are set to true:


    ```

    var re = new RegExp(''.*t'', ''gi'');

    ```


    Let''s verify:


    ```

    re.global;

    true

    ```


    Once set, the modifier cannot be changed:


    ```

    re.global = false;

    re.global;

    true

    ```


    To set any modifiers using the regex literal, you add them after the closing slash:


    ```

    var re = /.*t/ig;

    re.global;

    true

    ```


    # Methods of RegExp objects


    RegExp objects provide two methods you can use to find matches: test() and exec().
    They both accept a string parameter. test() returns a Boolean (true when there''s
    a match, false otherwise), while exec() returns an array of matched strings. Obviously,
    exec() is doing more work, so use test() unless you really need to do something
    with the matches. People often use regular expressions to validate data, in this
    case, test() should be enough.


    In the following example, there is no match because of the capital J:


    ```

    /.*t/.test("Javascript");

    false

    ```


    A case insensitive test gives a positive result:


    ```

    /.*t/i.test("Javascript");

    true

    ```'
