  md: "```\nvar target = evt.target || evt.srcElement;\n\n// actual callback work\n\
    console.log(target.nodeName);\n}\n\n// start listening for click events\nif (document.addEventListener('\
    \ // Modern browsers\n    document.addEventListener('click', callback, false);\n\
    } else if (document.attachEvent) // old IE\n    document.attachEvent('onclick',\
    \ callback);\n} else {\n    document.onclick = callback; // ancient\n```\n\n#\
    \ # Types of events\n\nNow you know how to handle cross-browser events. But all\
    \ of the examples above used only click events. What other events are happening\
    \ out there? As you can probably guess, different browsers provide different events.\
    \ There is a subset of cross-browser events and some browser-specific ones. For\
    \ a full list of events, you should consult the browser's documentation, but here's\
    \ a selection of cross-browser events:\n\n+   - Mouse events\n    - mouse, mousedown,\
    \ click (the sequence is mousedown-up-click), dblclick\n    - mouseover (mouse\
    \ is over an element), mouseout (mouse was over an element left it), mousemove\n\
    \n+   - Keyboard events\n    - keydown, keypress, keyup (occur in this sequence)\n\
    \n+   - Loading/window events\n    - load (an image or a page and all of its components\
    \ are done loading), unload (user leaves the page), beforeunload (the script can\
    \ provide the user with an option to stop the unload)\n    - abort (user stops\
    \ loading the page or an image in IE), error (a JavaScript error, also when an\
    \ image cannot be loaded in IE)\n    - resize (the browser window is resized),\
    \ scroll (the page is scrolled), contextmenu (the right-click menu appears)"
  merge: -1
  pgno: 273
- img_proc: true
  md: "# The Browser Environment\n\n+   - Form events\n  - focus (enter a form field),\
    \ blur (leave the form field)\n  - change (leave a field after the value has changed),\
    \ select (select text in a text field)\n  - reset (wipe out all user input), submit\
    \ (send the form)\n\nAdditionally, modern responsive browsers provide drag events\
    \ (dragstart, dragend, drop, and others) and touch devices provide touchstart,\
    \ touchmove, and touchend.\n\nThis concludes the discussion of events. Refer to\
    \ the exercise section at the end of this chapter for a little challenge of creating\
    \ your own event utility to handle browser-events.\n\n# XMLHttpRequest\n\nXMLHttpRequest()\
    \ is an object (a constructor function) that allows you to send HTTP requests\
    \ from JavaScript. Historically, XHttpRequest (or XHR for short) was introduced\
    \ in IE and was implemented as an ActiveX object. Starting with IE7 it is a native\
    \ browser object, the same as it's in the other browsers. The common implementation\
    \ of this object across browsers gave birth to the so-called Ajax applications,\
    \ where it's no longer necessary to refresh the whole page every time you need\
    \ new content. With JavaScript, you can make an HTTP request to the server, get\
    \ the response, and update build much more responsive and desktop-like webs.\n\
    \nAjax stands for Asynchronous JavaScript and XML.\n\n+   - Asynchronous because\
    \ after sending an HTTP request your code doesn't need to wait for the response,\
    \ but it can do other stuff and be notified (through an event) when the response\
    \ arrives.\n- JavaScript because it's obvious that XHR objects are created with\
    \ JavaScript.\n- XML because initially developers were making HTTP requests for\
    \ XML documents and were using the data contained in them to update the page.\
    \ This is no longer a common practice, though, as you can request data in plain\
    \ text, in the more convenient JSON format, or simply as HTML ready to be inserted\
    \ into the page."
  merge: -1
  pgno: 274
- img_proc: true
  md: 'There are two steps to using the XMLHttpRequest:


    +   - **Send the request**: This includes creating an XMLHttpRequest object and
    attaching an event listener

    - **Process the response**: Your event listener gets notified that the response
    has arrived and your code gets busy something amazing with the response


    # # Sending the request


    In order to create an object you simply use the code (let''s deal with browser
    inconsistencies in just a bit)


    ```

    var xhr = new XMLHttpRequest();

    ```


    The next thing is to attach an listener to the readystatechange event fired by
    the object:


    ```

    xhr.onreadystatechange = myCallback;

    ```


    Then, you need to call the open(method) method, as follows:


    ```

    xhr.open(''GET'', ''myfile.txt'', true);

    ```


    The first parameter specifies the type of HTTP request (GET


    The last step is to fire off the request which is done as follows:


    ```

    xhr.send('''');

    ```


    The method send() accepts any data you want to send with the request. For GET
    requests, this is an empty string, the data is in the URL. For POST request, it''s
    a query string in the form key=value&key2=value.


    At this point, the request is sent and your code (and the user) can move on to
    other tasks. The callback function myCallback will be invoked when the response
    comes back from the server.'
  merge: -1
  pgno: 275
- img_proc: true
  md: "# Processing the response\n\nA listener is attached to the readystatechange\
    \ event. So what exactly is the ready state and how does it change?\n\nThere is\
    \ a property of the XHR object called readyState. Every time it changes, the readystate\
    \ event fires. The possible values of the readyState property are as follows:\n\
    \n+   - 0-uninitialized\n- 1-loading\n- 2-loaded\n- 3-interactive\n- 4-complete\n\
    \nWhen readyState gets the value of 4, it means the response is back and ready\
    \ to be processed. In myCallback after you make sure ready is 4, the other thing\
    \ to check is the status code of the HTTP request. You might have requested a\
    \ non-existing URL for example and get a 404 (File not found) status code. The\
    \ interesting code is the 200 (OK), so myCallback should check for this value.\
    \ The status code is in the status property of the XHR object.\n\nOnce xhr.readyState\
    \ is 4 and xhr.status is 200, you can access the contents of the requested URL\
    \ using the xhr.responseText property. Let's see how myCallback could be implemented\
    \ to simply alert() the contents of the requested URL:\n\n```\nfunction myCallback()\
    \ {\n    if (xhr.readyState < 4) {\n        return; // not ready yet\n    }\n\n\
    \    if (xhr.status != 200) {\n        alert('Error!'); // the HTTP status code\
    \ is not OK\n        return;\n    }\n\n    // all is fine, do the work\n    alert(xhr.responseText);\n\
    }\n```\n\nOnce you've received the new content you requested, you can add it to\
    \ the page, or use it for some calculations, or for other purpose you find suitable."
  merge: -1
  pgno: 276
- img_proc: true
  md: "Overall, this two-step process (send request and process response) is the core\
    \ of the whole XHR/ Ajax functionality. Now that you know the basics, you can\
    \ move on to building the next Gmail. Oh yes, let's have a look at some minor\
    \ browser inconsistencies.\n\n# Creating XMLHttpRequest objects in IE prior to\
    \ Version 7\n\nIn Internet Explorer prior to version 7, the XMLHttpRequest object\
    \ was an ActiveX object, so creating an XHR instance is a little different. Here\
    \ is how it follows:\n\n```\nvar xhr = new XMLHttpRequest('MSXML2.XMLHTTP.3.0');\n\
    ```\n\nMSXML2.XMLHttpRequest is the identifier of what you want to create. There\
    \ are several versions of the XMLHttpRequest object and if your page visitor doesn't\
    \ have the latest one, you can try two others, before you give up.\n\nFor a fully-cross-browser\
    \ solution, you should first test to see if the user's browser supports XMLHttpRequest\
    \ as a native object, and if not, try the IE way. Therefore, the whole process\
    \ of creating an XHR instance could be like this:\n\n```\nvar ids = ['MSXML2.XMLHTTP.3.0',\
    \ 'MSXML2.XMLHTTP', 'Microsoft.XMLHTTP'];\nnvar xhr;\nif (XMLHttpRequest) {\n\
    \  xhr = new XMLHttpRequest();\n} else {\n  // IE: try to find an ActiveX object\
    \ to use\n  for (var i = 0; i < ids.length; i++) {\n    try {\n      xhr = new\
    \ ActiveXObject(ids[i]);\n      break;\n    } catch (e) {}\n  }\n}\n\n```\n\n\
    What is this doing? Array ids contains a list of ActiveX program IDs to try. The\
    \ variable xhr points to the new XHR object. The code first checks to see if XMLHttpRequest\
    \ exists. If (so the browser is relatively modern). If it is not, the code loops\
    \ through ids trying to create an object. catch(e) quietly ignores failures and\
    \ the loop continues. As soon as an xhr object is created, you break out of the\
    \ loop."
  merge: -1
  pgno: 277
- img_proc: true
  md: "The Browser Environment\n\nAs you can see, this is quite a bit of code so it's\
    \ best to abstract it into a function.\nActually, one of the exercises at the\
    \ end of the chapter prompts you to create your\nown Ajax utility.\n\n# A is for\
    \ Asynchronous\n\nNow you know how to create an XHR object, give it a URL and\
    \ handle the response\nto the request. What happens when you send two requests\
    \ asynchronously? What ifntnt response to the second request comes before the\
    \ first?\n\nIn the example above, the XHR object was global and myCallback relying\
    \ on\nthe presence of this global object in order to access its readyState, status,\
    \ and\nresponseText properties. Another way, which prevents you from relying on\n\
    variables, is to wrap the callback in a closure. Let's see how:\n\n```\nvar xhr\
    \ = new XMLHttpRequest();\n\nxr.onreadystatechange = (function (myxhr) {\n  return\
    \ function () {\n    myCallback(myxhr);\n  };\n}(xhr);\n\nxr.open('GET', 'somefile.txt',\
    \ true);\nxr.send('');\n```\n\nIn this caseCallback() receives the XHR object\
    \ as a parameter and is not going\nlook for it in the global space. This also\
    \ means that at the time the response is\nreceived, the original xhr might have\
    \ been reused for a second request. The closure\nkeeps pointing to the original\
    \ object.\n\n# X is for XML\n\nAlthough these JSON (discussed in the next chapter)\
    \ is preferred over XML\nas a data transfer, XML is still option. In addition\
    \ to the responseText\nproperty, the XHR objects also have another property called\
    \ responseXML.\nWhen you send an HTTP request for an XML document, responseXML\
    \ points\nto an XML DOM document object. To work with this document, you can use\n\
    ell of the core DOM methods discussed previously in this chapter, such as\ngetElementsByTagName(),\
    \ getElementById(), and so on.\n\n[ 264 ]"
  merge: -1
