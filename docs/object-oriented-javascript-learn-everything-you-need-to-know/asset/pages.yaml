    The benefits of using private functions are as follows: (less likely to cause\
    \ naming collisions)\n\n+   * You keep the global namespace clean\n* Privacy –\
    \ you expose only the functions you decide to the \"outside world,\nkeeping to\
    \ yourself functionality that is not meant to be consumed by the rest\nof the\
    \ application\n\n# Functions that return functions\n\nAs mentioned earlier, a\
    \ function always returns a value, and if it doesn't do it\nexplicitly with return,\
    \ then it does so implicitly by returning undefined. A function\ncan return only\
    \ one value, and this value can just as easily be another function:\n\n```\nfunction\
