  md: "Let's take a look at the constructor function Gadget(), which uses this to\
    \ add two\nproperties and one method to the objects it creates.\n\n```\nfunction\
    \ Gadget(name, color) {\n  this.name = name;\n  this.color = color;\n  this.whatAreYou\
    \ = function () {\n    return 'I am a ' + this.color + ' ' + this.name;\n  };\n\
    }\n```\n\nAdding methods and properties to the prototype of the constructor\n\
    function is another way to add functionality to the objects this constructor produces.\n\
    Let's add two more properties, price and rating, as well as the getInfo() method.\n\
    Since prototype already points to an object, you can just keep adding properties\
    \ and\nmethods to it as follows:\n\n```\nGadget.prototype.price = 100;\nGadget.prototype.rating\
    \ = 3;\nGadget.prototype.getInfo = function () {\n  return 'Rating: ' + this.rating\
    \ +\n  ', price: ' + this.price;\n};\n```\n\nAlternatively, instead of adding\
    \ properties to the prototype one by one, you\ncan overwrite the prototype completely,\
    \ replacing it with an object of your choice.\n\n```\nGadget.prototype = {\n \
    \ price: 100,\n  rating: ... /* and so on... */\n};\n```\n\n# Using the prototype's\
    \ methods and\nproperties\n\nAll the methods and properties you have added to\
    \ the prototype are available as\nas as you create a new object using the constructor.\
    \ If you create a newtoy object\nusing the Gadget () constructor, you can access\
    \ all the methods and properties\nalready defined.\n\n```\n> var newtoy = new\
    \ Gadget('webcam', 'black');\n> newtoy.name;\n\"webcam\"\n```"
