- img_proc: true
  md: '# Chapter 1


    Let''s take a closer look into each of these concepts. If you''re new to the object-oriented
    programming lingo, these concepts might sound too theoretical, and you might have
    trouble grasping them or remembering them from one reading. Don''t worry, it takes
    a few tries, and the subject could be a little dry at a conceptual level. But,
    we''ll look at plenty of code examples further on the book, and you will see that
    things are much simpler in practice.


    # Objects


    As the name-oriented subjects, objects are important. An object is a representation
    of "thing" (someone or something), and this representation is expressed with the
    help of a programming language. The thing can be anything—a real-life object,
    or a more convoluted concept. Taking a common object like a cat for example, you
    can has certain characteristics (color, name, weight, and so on) and can perform
    some actions (meow, speak, hide, escape, and so on). The characteristics of the
    object are called *properties* in OOP-speak, and the actions are called *methods*.


    There is an analogy to the spoken language:


    +   - Objects are most named using nouns (book, person, and so on)

    - Methods are verbs (read, run, and so on)

    - Values of the properties are adjectives


    Take the sentence "The black cat sleeps on the mat". "The cat" (a noun) is the
    object, "black" (adjective) is the value of the *color* property, and "sleep"
    (a verb) is an action, or a method in OOP. For the sake of the analogy, we can
    go a step further and say that "on the mat specifies something about the action
    "sleep", so it''s acting as a parameter to the `sleep` method.


    # Classes


    In real life, similar objects can be grouped based on some criteria. Hummingbird
    and eagle are both birds, so they can be classified as belonging to some made
    up Birds class. In OOP, a class is a blueprint, or a recipe for an object. Another
    name for "object" is "instance", so we say that the eagle is one concrete instance
    of the general class *Birds*. You can create different objects using the same
    class, because a class is just a template, while the objects are concrete instances
    based on the template.


    [ 13 ]'
  merge: -1
