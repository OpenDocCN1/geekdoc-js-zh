  md: "# Private functions as public methods\n\nLet us say you've defined a function\
    \ that you absolutely need to keep intact, so you make it private. But you also\
    \ want to provide access to the same function so that outside code can also benefit\
    \ from it. In this case, you can assign the private function to a publicly available\
    \ method.\n\nLet's define _setStyle() and _getStyle() as private functions, but\
    \ then assign them to the public setStyle() and getStyle():\n\n```\nvar MYAPP\
    \ = {};nMYAPP.dom = (function () {\n  var _setStyle = function (el, prop, value)\
    \ {\n    console.log('setStyle');\n  };\n  var _getStyle = function (el, prop)\
    \ {\n    console.log('getStyle');\n  };\n  return {\n    setStyle: _setStyle,\n\
    \    getStyle: _getStyle,\n    yetAnother: _setStyle\n  };\n});\n```\n\nNow, when\
    \ you call MYAPP.dom.setStyle(), it invokes the private _setStyle() function.\
    \ You can also overwrite setStyle() from the outside:\n\n```\nMYAPP.dom.setStyle\
    \ = function () {alert('b')};\n```\n\nNow, the result is as follows:\n\n+   *\
    \ MYAPP.dom.setStyle points to the new function\n* MYAPP.dom.yetAnother still\
    \ points to _setStyle\n* _setStyle() is always available when any other internal\
    \ code relies on it to be working as intended, regardless of the outside code\n\
    \nWhen you expose something private, keep in mind that objects (and functions\
    \ and arrays are objects too) are passed by reference and, therefore, can be modified\
    \ from the outside."
  merge: -1
  pgno: 298
