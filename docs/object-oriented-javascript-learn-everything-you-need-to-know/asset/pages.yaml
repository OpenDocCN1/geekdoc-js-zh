  md: '# Objects


    Calling toString() returns a string representation of the object:


    ```

    > o.toString();

    "[object Object]"

    ```


    toString() will be called internally by JavaScript when an object is used in a
    string context. For example, alert() works only with strings, so if you call the
    alert() function passing an object, the toString() method will be called the scenes.
    These two lines produce the same result:


    ```

    > alert(o);

    > alert(o.toString());

    ```


    Another type of string context is the string concatenation. If you try to concatenate
    an object with a string, the object''s toString() method is called first:


    ```

    > "An object: " + o;

    "An object: [object Object]"

    ```


    valueOf() is another method that all objects provide. For the simple objects (whose
    constructor is Object()), the valueOf() method returns the object itself:


    ```

    > o.valueOf() === o;

    true

    ```


    To summarize:


    +   - You can create objects with var o = {}; (object literal notation, the preferred
    method) or with var o = new Object();

    - Any object, no matter how complex, inherits from the Object object, and therefore
    offers methods such as toString() and properties such as constructor


    # Array


    Array() is a built-in function that you can use as a constructor to create arrays:


    ```

    > var a = new Array();

    ```


    This is equivalent to the array literal notation:


    ```

    > var a = [];

    ```'
