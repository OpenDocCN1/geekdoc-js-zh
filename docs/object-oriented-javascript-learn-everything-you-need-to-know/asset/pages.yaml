- img_proc: true
  md: 'What happens then? N is in the same global space as a. And, as functions remember
    the environment in which they were defined, N will still have access to the F
    space, and hence can access b. This is interesting, because N is where a is and
    yet N does have access to b, but a doesn''t.


    And how does N break the chain? By making itself global (omitting var) or by having
    F (or return) it to the global space. Let''s see how this is in practice.


    # Closure #1


    Take a look at this function, which is the same as before, only F returns N and
    also N b, to which it has access via the scope:


    ```

    var a = "global variable";nvar F = function () {

    var b = "local variable";nvar N = function () {

    var c = "inner local";

    return b;

    }

    return N;

    }

    ```


    The function F contains the variable b, which is local, and therefore inaccessible
    to the global space:


    +   > b;

    > ReferenceError: not defined


    The function N has access to its private space, to the F() function''s space,
    and to the global space. So, it can see b. Since F() is callable from the global
    space (it''s a global function), you can call it and assign the returned value
    to another global variable.

    The result: a new global function that has access to the F() function''s private
    space:


    +   > var inner = F();

    > inner();

    > "local variable"


    # Closure #2


    The final result of the next example will be the same as the previous example,
    but the way to achieve it is a little different. F() doesn''t return a function,
    but instead it creates a new global function, inner(), inside its body.'
