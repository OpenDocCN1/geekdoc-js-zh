  md: '# Chapter 7


    You can get the text contained in the paragraph using the textContent property.
    textContent does not exist in IEs, but another property called innerText returns
    the same value, as seen in the following output:


    > > bd.childNodes[1].textContent;

    > "first paragraph"


    There also the innerHTML property. It''s a relatively new addition to the DOM
    standard despite the fact that it previously existed in all major browsers. It
    returns (or sets) HTML code contained in one. You can see how this is a little
    inconsistent as DOM treats the document as a tree of nodes, not as a string of
    tags. But innerHTML is so convenient to use that you''ll see it everywhere. Refer
    to the following code:


    > > bd.childNodes[1].innerHTML;

    > "first paragraph"


    The first paragraph contains only text, so innerHTML is the same as textContent
    (or innerText in IE). However, the second paragraph does contain an em node, so
    you can see the difference as follows:


    > > bd.childNodes[3].innerHTML;

    > "<em>second</em> paragraph"


