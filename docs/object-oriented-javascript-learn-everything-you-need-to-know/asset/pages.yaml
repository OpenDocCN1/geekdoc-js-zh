  md: "You can attach a JavaScript function (called an event listener or event handler)\
    \ to a specific event and the browser will invoke your function as soon as the\
    \ event occurs. Let's see how this is done.\n\n# Inline HTML attributes\n\nAdding\
    \ specific attributes to a tag is the laziest (but the least maintainable) way,\
    \ for example:\n\n```\n<div onclick=\"alert ('Oouch!')\">click</div>\n```\n\n\
    In this case when the user clicks on the <div>, the click event fires and the\
    \ string of JavaScript code contained in the onclick attribute is executed. There's\
    \ no explicit function that listens to the click event, but behind the scenes\
    \ a function is still created and it contains the code you specified as a value\
    \ of the onclick attribute.\n\n# Element Properties\n\nAnother way to have some\
    \ code when a click event fires is to assign a to the onclick function of a DOM\
    \ node element. For example:\n\n```\n<div id=\"my-div\">click</div>\n<script>\n\
    var elementy = document.getElementById('my-div');\nmyelement.onclick = function\
    \ () {\n  alert('Oouch!');\n  alert('And double ouch!');\n};\n</script>\n```\n\
    \nThis is better because it keeps you your <div> clean of any JavaScript code.\
    \ Always keep in mind that HTML is for content, JavaScript for behavior, and CSS\
    \ for formatting, and you should keep these separate as much as possible.\n\n\
    This method has the drawback that you can attach only one function to the event,\
    \ as the radio panel has only one listener. It's true that you can have a lot\
    \ happening inside the same function, but this is not convenient, as if all the\
    \ radio listeners are in the same room."
