  md: "# window.open()/close()\n\nHaving explored some of the most common cross-browser\
    \ properties of the window object, let's move to some of the methods. One such\
    \ method is open(), which allows you to open new browser windows (pop ups). Various\
    \ browser policies and user settings prevent you from opening a pop up (due to\
    \ abuse of the technique for marketing purposes), but generally you should be\
    \ able to open a new window if it was initiated by the user. Otherwise, if you\
    \ try to open a pop up as the page loads, it will most likely be blocked, because\
    \ the user didn't initiate it explicitly.\n\nwindow.open() accepts the following\
    \ parameters:\n\n+   * URL to load in the new window\n* Name of the new window,\
    \ which can be used as the value of a form's target attribute\n* Comma-separated\
    \ list of features. They are as follows:\n    * resizable: Should the user be\
    \ able to resize the new window\n    * width, height: Width and height of the\
    \ pop up\n    * status: The status should be visible\n\nwindow.open() returns\
    \ a reference to the window of the newly created browser instance. Following is\
    \ an example:\n\n```\nvar win = window.open('http://www.packpub.com', 'packt',\
    \ 'width=300,height=300,resizable=yes');\n```\n\nwin points to the window object\
    \ of the pop up. You can check if win has a false value, which means that the\
    \ pop up was blocked.\n\nwin.close() closes the new window.\n\nIt's best to stay\
    \ away from opening windows for accessibility and usability reasons. If you don't\
    \ like sites popping up to windows, why do you it to your users? There are legitimate\
    \ purposes, such as providing help information while filling out a form, but the\
    \ same can be achieved with alternative solutions, such as using a floating <div>\
    \ inside the page.\n\n# window.moveTo() and window.resizeTo()\n\nContinuing with\
    \ the shady practices from the past, following are more methods to irritate your\
    \ users, provided their browser and personal settings allow you to.\n\n+   * window.moveTo(100,\
    \ 100) moves the browser window to screen location x = 100 and y = 100 (counted\
    \ from the top-left)"
