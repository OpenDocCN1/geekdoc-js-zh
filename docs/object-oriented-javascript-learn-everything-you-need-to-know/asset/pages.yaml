  md: "# Immediate functions\n\nAnother pattern that helps you keep the global namespace\
    \ clean is to wrap your code in an anonymous function and execute that immediately.\
    \ This way any variables inside the function are local (as long as you use the\
    \ var statement) and are destroyed when the function returns, they aren't part\
    \ of a closure. This pattern was discussed in more detail in Chapter 3, Functions.\
    \ Have a look at the following code:\n\n```\nfunction () {\n  // code goes here...\n\
    }\n```\n\nThis pattern is especially suitable for on-off initialization tasks\
    \ performed when the script loads.\n\nThe immediate (self-executing) function\
    \ pattern can be extended to create and return objects. If the creation of these\
    \ objects is more complicated and involves some initialization work, you can do\
    \ this in the first part of the self-executable function and return a single object,\
    \ which can access and benefit from any private properties in the top position\
    \ as follows:\n\n```\nvar MYAPP = {};\nMYAPP.dom = (function () {\n  // initialization\
    \ code...\n  function _private() {\n    // ...\n  }\n  return {\n    getStyle:\
    \ function (el, prop) {\n      console.log('getStyle');\n      _private();\n \
    \   },\n    setStyle: function (el, prop, value) {\n      console.log('setStyle');\n\
    \    }\n  };\n})()\n```"
  merge: -1
