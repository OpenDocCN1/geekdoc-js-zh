  md: "# Cross-browser event listeners\n\nAs you already know, most modern browsers\
    \ almost implement the DOM Level 1 specification. However, the events were not\
    \ standardized until DOM 2. As a result, there are quite a few differences in\
    \ IE before version 9 implements this functionality compared to modern browsers.\n\
    \nCheck out an example that causes the nodeName of a clicked element (the target\
    \ element) to be written to the console:\n\n```\ndocument.addEventListener('click',\
    \ function (e) {\n  console.log(e.target.nodeName);\n  false;\n});\n```\n\nNow,\
    \ let's look at how IE is:\n\n+   * In IE there is noEventListener method, although\
    \ since IE Version 5 there is equivalent attachEvent(). For earlier versions,\
    \ your only choice is accessing the property (such as onclick) directly.\n* click\
    \ event becomes onclick when using attachEvent().\n* If you listen to the old-fashioned\
    \ way (for example, by setting function value to the onclick property), when the\
    \ callback function is invoked, it doesn't get an event object passed as a parameter.\
    \ But, regardless of how you attach the listener in IE, there is always a global\
    \ window.event that points to the last event.\n* In IE the event object doesn't\
    \ get a target attribute telling the element on which the event fired, but it\
    \ does have an equivalent property called srcElement.\n* As mentioned before,\
    \ event capturing doesn't apply to all events, so only bubbling should be used.\n\
    * There's no stopPropagation() method, but you can set the IE-only cancelBubble\
    \ property to true.\n* There's no preventDefault() method, but you can set the\
    \ IE-only returnValue to false.\n* To stop listening to an event, instead of removeEventListener()\
    \ in IE you'll need detachEvent().\n\nSo, here's the revised version of the previous\
    \ code that works across browsers:\n\n```\nfunction callback(evt) {\n  // prep\
    \ work\n  evt = evt || window.event;\n```"
  merge: -1
  pgno: 272
