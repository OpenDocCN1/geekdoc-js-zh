    nodes. The whitespace between these four nodes makes three more text nodes. This
    makes a total of seven so far. The whitespace between <body> and the first <p>
    is the eighth node. The whitespace between the comment and the closing </body>
    is another text node. This makes a total of nine child nodes. Just type bd.childNodes
    in the console to inspect them all.


