    \ walkDOM(n) {\n  do {\n    console.log(n);\n    if (n.hasChildNodes()) {\n  \
    \    walkDOM(n.firstChild);\n    }\n  } while (n = n.nextSibling)\n}\n```\n\n\
    You can test the function as follows:\n\n+   > walkDOM(document.documentElement);\n\
    > walkDOM(document.body);\n\n# Modifying DOM nodes\n\nNow that you know a lot\
