    Encapsulation? Yes, the objects encapsulate both the data and the means (methods)
    to do something with the data. Aggregation? Sure, an object can contain other
    objects. In fact, this is almost always the case since methods are functions,
    and functions are also objects.


    Now, let''s focus on the inheritance part. This is one of the most interesting
    features, as it allows you to reuse existing code, thus promoting laziness, which
    is likely to be what brought human species to computer programming in the first
    place.


    JavaScript is a dynamic language and there is usually more than one way to achieve
    any given task. Inheritance is not an exception. In this chapter, you''ll see
    some common patterns for implementing inheritance. Having a good understanding
    of these patterns will help you pick the right one, or the right mix, depending
    on your task, or your style.


    # # Prototypal chaining


    Let''s start with the default way of implementing inheritance—inheritance chaining
    through the prototype.


    As you already know, every function has a prototype property, which points to
    an object. When a function is invoked using the new operator, an object is created
    and returned. This new object has a secret link to the prototype object. The secret
    link (called __proto__ in some environments) allows methods and properties of
    the prototype object to be used as if they belonged to the newly-created object.'
