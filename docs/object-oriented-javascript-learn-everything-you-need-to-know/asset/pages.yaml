  md: '# Objects


    Here''s an example of how you can assign an object to another variable and then
    make a change to the copy. As a result, the original object is also changed:


    ```

    > var original = {howmany: 1};

    > var mycopy = original;

    > mycopy.howmany;

    1


    > mycopy.howmany = 100;

    100


    > original.howmany;

    100

    ```


    The same thing applies when passing objects to functions:


    ```

    > var original = {howmany: 100};

    > var nullify = function (o) { o.howmany = 0; };

    > nullify(original);

    > original.howmany;

    0

    ```


    # Comparing objects


    When you compare objects, you''ll get true only if you compare two references
    to the same object. Comparing two distinct objects that happen to have the exact
    same methods and properties returns false.


    Let''s create two objects that look the same:


    ```

    > var fido = {breed: ''dog''};

    > var benji = {breed: ''dog''};

    ```


    Comparing benji returns false:


    ```

    > benji === fido;

    false

    ```


    ```

    > benji == fido;

    false

    ```


    You can create a new variable, mydog, and assign one of the objects to it. This
    way, mydog actually points to the same object:


    ```

    > var mydog = benji;

    ```'
