  md: "```\nel.detachEvent('on' + type, fn);\n};\n} else { // old browsers\nMYAPP.event.addListener\
    \ = function (el, type, fn) {\n  el['on' + type] = fn;\n};\nMYAPP.event.removeEventListener\
    \ = function (el, type) {\n  el['on' + type] = null;\n};\n\n```\n\nAfter this\
    \ script executes, you use the addListener() and removeListener() methods defined\
    \ in a browser-dependent way. Every time you invoke one of these methods there's\
    \ no more feature-sniffing and it results in less work and faster execution.\n\
    \nOne thing to watch out for when sniffing features is not to assume too much\
    \ after checking for one. In the previous example this rule is broken because\
    \ the code only checks for addEventListener support but then defines both addEventListener\
    \ and removeEventListener(). In this case it's safer to assume that if a browser\
    \ implements addEventListener it implements removeEventListener(). Imagine what\
    \ happens if a browser stopPropagation() but not preventedDefault() because addEventListener\
    \ and you haven't checked for these individually. You have assumed that because\
    \ addEventListener is not defined, the browser must be an old IE and write your\
    \ code using your knowledge and assumptions of how IE works. Remember that all\
    \ of your knowledge is based the way a certain browser works today, but not necessarily\
    \ the it will work tomorrow. To avoid rewrites of your code as new browser versions\
    \ are shipped, it's best to individually check for features you intend to use\
    \ and not generalize on what a certain browser supports.\n\n# Lazy definition\n\
    \nThe lazy definition pattern is similar to the previous init-time branching pattern.\
    \ The difference is that the branching happens only when the function is called\
    \ for the first time. When the function is called, it redefines itself with the\
    \ best implementation. Unlike the init-time branching where it happens once, during\
    \ loading, here it may not happen at all in cases where the function is never\
    \ called. The lazy definition also makes the initialization process lighter as\
    \ there's no init-time branching work to be done."
