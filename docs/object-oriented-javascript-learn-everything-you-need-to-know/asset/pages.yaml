  md: "Functions\n\nOr, you can do the following:\n\n```\n>invoke(\n  function ()\
    \ {\n    return 1;\n  },\n  function () {\n    return 2;\n  }\n);\n```\n\n3 When\
    \ you pass a function, A, to another function, B, and then B executes A, it's\
    \ often said that A is a callback function. If A doesn't have a name, then you\
    \ can say that it's an anonymous callback function.\n\nWhen callback functions\
    \ usefully? Let's see some examples that demonstrate the benefits of callback\
    \ functions, namely:\n\n+   - They let you pass functions without the need to\
    \ name them (which means there are fewer variables floating)\n- You delegate the\
    \ responsibility of calling a function to another function (which means there\
    \ is less code to write)\n- They can help with performance\n\n# Callback examples\n\
    \nTake a look at this common scenario: you have a function that returns a value,\
    \ which you then pass to another function. In our example, the first function,\
    \ multiplyByTwo(), accepts three parameters, loops through them, multiplies by\
    \ two, and returns an array containing the result. The second function, addOne(),\
    \ takes a value, adds it to it, and returns it:\n\n```\nfunction multiplyByTwo(a,\
    \ b, c) {\n  var i, ar = [];\n  for (i = 0; i < 3; i++) {\n    ar[i] = arguments[i]\
    \ * 2;\n  }\n  return ar;\n}\n\nfunction addOne(a) {\n  return a + 1;\n}\n```"
