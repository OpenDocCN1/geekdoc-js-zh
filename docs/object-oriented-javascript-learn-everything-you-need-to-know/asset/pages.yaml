    # document.write()


    The method document.write() allows you to insert HTML into the page while the
    page is being loaded. You can have something like this into the code:


    ```

    <p>It is now

    <script>

    document.write("<em>" + new Date() + "</em>");

    </script>

    </p>

    ```


    This is the same as if you had the date directly in the source of the HTML as
    follows:


    ```

    <p>It is now

    <em>Fri Apr 26 2013 16:55:16 GMT-0700 (PDT)</em>

    </p>

    ```'
