  md: "# DOM\n\nThe Document Object Model (DOM) represents an XML or an HTML document\
    \ as a tree of nodes. Using DOM methods and properties, you can access any element\
    \ on the page, modify or remove elements, or add new ones. The DOM is a language-independent\
    \ API (Application Programming Interface) and can be implemented not only in JavaScript,\
    \ but also in any language. For example, you can generate pages on the server-side\
    \ with PHP's DOM implementation (http://php.net/dom).\n\nTake a look at this example\
    \ HTML page:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>My page</title>\n\
    </head>\n<body>\n  <p class=\"opener\">first paragraph</p>\n  <p><em>second</em>\
    \ paragraph</p>\n  <p id=\"closer\">final</p>\n  <!-- and that's about it -->\n\
    </body>\n</html>\n```\n\nConsider the second paragraph <p><em>second</em> paragraph</p>.\
    \ You see that it's a <p> tag and you can say that <body> is the parent of <p>\
    \ and <p> is the child. The first and the third paragraphs would also be children\
    \ of the <body>, and at the same time siblings of the second paragraph. The <em>\
    \ tag is a child of the second <p>, so <p> is its parent. The parent-child relationships\
    \ can be represented graphically in an ancestry tree, called the DOM tree:\n\n\
    | first paragraph |\n| second paragraph |\n| final |\n| Elements | Resources |\
    \ Network | Sources |\n|---|---|---|--|\n| <html>\n| <title>My page</title>\n\
    | </head>\n| <body>\n| <p class=\"opener\">first paragraph</p>\n| <p><em>second</em>\
    \ paragraph</p>\n| <p id=\"closer\">final</p>\n| <!-- and that's about it -->\n\
    | </body>\n| </html> |"
  merge: -1
