    # A definition and closure #3\n\nEvery function can be considered a closure. This\
    \ is because every function maintains a secret link to the environment (the scope)\
    \ in which it was created. But, most of the time this scope is destroyed unless\
    \ something interesting happens (as shown above) that causes this scope to be\
    \ maintained.\n\nBased on what you've seen so far, you can say that a closure\
    \ is created when a function keeps a link to its parent scope after the parent\
    \ has returned. And, every function is a closure because, at the very least, every\
    \ function maintains access to the global scope, which is never destroyed.\n\n\
