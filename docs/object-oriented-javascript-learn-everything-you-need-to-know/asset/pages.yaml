    # # Arrays


    Now that you know about the basic primitive types in JavaScript, it''s time to
    move to a more powerful data structure – the array.


    So, what is an array? It''s simply a list (a sequence) of values. Instead of using
    one variable to store one value, you can use one array variable to store any number
    of values as elements of the array.


    To declare a variable that contains an empty array, you use square brackets with
    nothing between them:


    ```

    > var a = [];

    ```


    To define an array that has three elements, you do this:


    ```

    > var a = [1, 2, 3];

    ```


    When you simply type the name of the array in the console, you get the contents
    of your array:


    ```

    > a;

    [1, 2, 3]

    ```


    Now the question is how to access the values stored in these array elements. The
    elements contained in an array are indexed with consecutive numbers starting from
    zero. The first element has index (or position) 0, the second has index 1, and
    so on. Here''s the three-element array from your example:


    | Index | Value |

    |---|---|

    | 0 | 1 |

    | 1 | 2 |

    | 2 | 3 |'
