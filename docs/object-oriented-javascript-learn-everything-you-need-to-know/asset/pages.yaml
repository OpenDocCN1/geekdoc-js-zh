  md: 'It''s also important to note that if you don''t use var to declare a variable,
    this variable is automatically assigned a global scope. Let''s see an example:


    ![](img/901612d85bd2f01ce60fcfeb0719ea7c_87_0.png)


    What happened? The function f() contains the variable local. Before calling the
    function, the variable doesn''t exist. When you call the function for the first
    time, the variable local is created with a global scope. Then, if you access local
    outside the function, it will be available.


    # Best practice tips


    +   - Minimize the number of global variables in order to avoid naming collisions.
    Imagine two people working on two different functions in the same script, and
    they both decide to use the same name for their global variable. This could easily
    lead to unexpected results and hard-to-find bugs.

    - Always declare your variables with the var statement. Consider a "single var"
    pattern. Define all variables in your function at the very top of the function
    so you have a single place to look for variables and hopefully prevent accidental
    globals.'
