  md: '# Functions


    The function will also try to convert the input to a number:


    +   > NaN(''1.23'');

    false


    +   > NaN(''al.23'');

    true


    The NaN() function is useful because the special value NaN is not equal to anything
    including itself. In other words, NaN === NaN is false. So, NaN cannot be used
    to check if a value is a valid number.


    # isFinite()


    isFinite() checks whether the input is a number that is neither Infinity nor NaN:


    +   > isFinite(Infinity);

    false


    +   > isFinite(-Infinity);

    false


    +   > isFinite(12);

    true


    +   > isFinite(1e308);

    true


    +   > isFinite(1e309);

    false


    If you are wondering about the results returned by the last two calls, remember
    from the previous chapter that the biggest number in JavaScript is 1.797691348623157e+308,
    so 1e309 is effectively infinity.


    # Encode/decode URIs


    In a Uniform Resource Locator (URL) or a Uniform Resource Identifier (URI), some
    characters have special meanings. If you want to ''escape'' those characters,
    you can use the functions encodeURI() or encodeURIComponent(). The first one will
    return a usable URL, while the second assumes you''re only passing a part of the
    URL, such as a query string for example, and will encode all applicable characters:


    ```

    > var url = ''http://www.packpub.com/script.php?q=this and that'';

    > encodeURI(url);

    "http://www.packpub.com/scr%20ipt.php?q=this%20and%20that"

    ```'
