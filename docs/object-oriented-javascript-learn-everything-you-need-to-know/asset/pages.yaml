  md: "# Coding and Design Patterns\n\nLet's see an example that illustrates this\
    \ via the definition of an addListener function. The function is first defined\
    \ with a generic body. It checks which functionality is supported by the browser\
    \ when it's called for the first time and redefines itself using the most suitable\
    \ implementation. At the end of the first call, the function calls itself so that\
    \ the actual event is attaching. The next time you call the same function it will\
    \ be defined with its new body and ready for use, so no further branching is necessary.\
    \ Following is the code snippet:\n\n```\nvar MYAPP = {\nMYAPP.myevent = {\n  addListener:\
    \ function (el, type, fn) {\n    if (el.addEventListener) {\n      MYAPP.myevent.addListener\
    \ = function (el, type, fn, false);\n    } else if (el.attachEvent) {\n      MYAPP.myevent.addListener\
    \ = function (el, type, fn) {\n        el.attachEvent('on' + type, fn);\n    \
    \  }\n    } else {\n      MYAPP.myevent.addListener = function (el, type, fn)\
    \ {\n        el['on' + type] = fn;\n      }\n    }\n  }\nMYAPP.myevent.addListener(el,\
    \ type, fn);\n};\n```\n\n# Configuration object\n\nThis pattern is convenient\
    \ when you have a function or method that accepts a lot of optional parameters.\
    \ It's up to you to decide how many constitutes a lot. But generally, a function\
    \ with more than three parameters is not convenient to call because you have to\
    \ remember the order of the parameters, and it is even more inconvenient when\
    \ some of the parameters are optional.\n\nInstead of having many parameters, you\
    \ can use one parameter and make it an object. The properties of the object are\
    \ the actual parameters. This is suitable for passing configuration options because\
    \ these tend to be numerous and optional (with smart defaults). The beauty of\
    \ using a single object as opposed to multiple parameters is described as follows:\n\
    \n+   - The order doesn't matter\n- You can easily skip parameters that you don't\
    \ want to set"
