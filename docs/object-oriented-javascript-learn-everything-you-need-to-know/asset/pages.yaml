- img_proc: true
  md: "# Prototype\n\nYou can use this secret property for learning purposes, but\
    \ it's not a good idea to use in your real scripts because it does not exist in\
    \ all browsers (notably Internet Explorer), so your scripts are not portable.\n\
    \nBeware that __proto__ is not the same as prototype, since __proto__ is a property\
    \ of the instances (objects), whereas prototype is a property of the constructor\
    \ functions used to create these objects.\n\n+   > typeof developer.__proto__;\n\
    > \"undefined\"\n\n+   > typeof developer.prototype;\n\n+   > typeof developer.constructor.prototype;\n\
    > \"object\"\n\nOnce again, you should use __proto__ only for learning or debugging\
    \ purposes. Or, if you are lucky enough and your code works in ES5-compliant environments,\
    \ you can use Object.getPrototypeOf().\n\n# Augmenting built-in objects\n\nThe\
    \ objects created by the built-in functions such as Array, String, and even Object\
    \ and Function can be augmented (or enhanced) through the use of prototypes. This\
    \ means that you can, for example, add new methods to the Array prototype, and\
    \ in this way you can make them available to all arrays. Let's see how to do this.\n\
    \nIn PHP, there is a function called in_array(), which tells you if a value exists\
    \ in an array. In JavaScript, there is no inArray() (method in ES5's there is\
    \ indexOf(), which you can use for the same purpose). So, let's implement and\
    \ add it to Array.prototype.\n\n```\nArray.prototype.inArray = function (needle)\
    \ {\n  for (var i = 0, len = this.length; i < len; i++) {\n    if (this[i] ===\
    \ needle) {\n      return true;\n    }\n  }\n  return false;\n};\n```"
  merge: -1
  pgno: 178
- img_proc: true
  md: "Now all arrays have access to the new method. Let's test this.\n\n+   > var\
    \ colors = ['red', 'green', 'blue'];\n> colors.inArray('red');\ntrue\n\n+   >\
    \ colors.inArray('yellow');\nfalse\n\nThat was nice and easy! Let's do it again.\
    \ Imagine your application often needs to spell words backwards and you feel there\
    \ should be a built-in reverse() method for string objects. After all, arrays\
    \ have reverse(). You can easily add a reverse() method to the String prototype\
    \ by borrowing Array.prototype.reverse() (there was turned back into a string\
    \ using a similar exercise at the end of Chapter 4, Objects).\n\n```\nString.prototype.reverse\
    \ = function () {\n  return Array.prototype.reverse\n    apply(this.split('')).join('');\n\
    };\n```\n\nThis code uses split() to create an array from a string, then calls\
    \ the reverse() method on this array, which produces a reversed array. The resulting\
    \ array is then turned back into a string using join(). Let's test the new method.\n\
    \n+   > \"bumblebee\".reverse();\n\"eeelbumbum\"\n\nThat is a name for a big and\
    \ scary (and potentially hairy) mythical creature, isn't it?\n\n# Augmenting built-in\
    \ objects – a discussion\n\nAugmenting built-in objects through the prototype\
    \ is a powerful technique, and you can use it to shape JavaScript in any way you\
    \ like. Because of its power, you should always thoroughly consider your options\
    \ before using this approach.\n\nThe reason is that once you know JavaScript,\
    \ you're expecting it to work the same way, no matter which third-party library\
    \ or widget you use. Modifying core objects could confuse the users and maintainers\
    \ of your code and create unexpected errors."
  merge: -1
  pgno: 179
- img_proc: true
  md: "# Prototype\n\nJavaScript evolves and browser's vendors continuously support\
    \ more features. What you consider a missing method today and decide to add to\
    \ a core prototype could be a built-in method tomorrow. In this case, the method\
    \ is no longer needed. Additionally, what if you have already written a lot of\
    \ code that uses the method and your method is slightly different from the new\
    \ built-in implementation?\n\nThe most common and acceptable use for augmenting\
    \ built-in prototypes is to add support for new features (that are already standardized\
    \ by the ECMAScript committee and implemented in new browsers) to old browsers.\
    \ For example, one would be adding an ES5 method to old versions of IE. These\
    \ extensions are known as polyfills.\n\nWhen augmenting prototypes, you first\
    \ check if the method exists before implementing it yourself. This way, you use\
    \ the native implementation in the browser if one exists. Let's add the trim()\
    \ method for strings, which is a method that exists in ES5 but is missing in older\
    \ browsers.\n\n```\nif (typeof String.prototype.trim !== 'function') {\n  String.prototype.trim\
    \ = function () {\n    return this.replace(/^\\s+|\\s+$/g, '');\n  };\n}\n> \"\
    hello\" .trim();\n\"hello\"\n```\n\n> Best practice\nIf you decide to augment\
    \ a built-in object or its prototype with a new property, do check for the existence\
    \ of the new property first.\n\n# Prototype gotchas\n\nThere are two important\
