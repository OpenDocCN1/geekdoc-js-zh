  md: "# The Browser Environment\n\nLet's see some of the browser-related properties\
    \ of the window object. Again, these can vary from one browser to another, so\
    \ let's only consider the properties that are implemented consistently and reliably\
    \ across all major browsers.\n\n# window.navigator\n\nThe navigator is an object\
    \ that has some information about the browser and its capabilities. One property\
    \ is navigator.userAgent, which is a long string of browser identification. In\
    \ Firefox, you'll get the following output:\n\n```\n> navigator.userAgent;\n\"\
    Mozilla/5.0 (Macintosh; Intel OS X 10_8_3) AppleWebKit/536.28.10 (KHTML, like\
    \ Gecko) Version/6.10 Safari/536.10\"\n```\n\nThe user string in Internet Explorer\
    \ would be something like this:\n\n> \"Mozilla/5.0 (compatible; MSIE 10.0; Windows\
    \ NT 6.1; Trident/6.0)\"\n\nBecause the browsers have different capabilities,\
    \ developers have been using the userAgent to identify and provide different versions\
    \ of the code. For example, the following code searches for the presence of the\
    \ string MSIE to identify Internet Explorer:\n\n```\nif (navigator.userAgent.indexOf('MSIE')\
    \ != -1) {\n  // this is IE\n} else {\n  // not IE\n}\n```\n\nIt's better not\
    \ to rely on the user agent string, but to use feature sniffing (also called capability\
    \ detection) instead. The reason for this is that it's hard to keep track of all\
    \ browsers and their different versions. It is much easier to simply check if\
    \ the feature you intend to use is available in the user's browser. For example\
    \ have a look at the following code:\n\n```\nif (typeof window.addEventListener\
    \ === 'function') {\n  // feature is supported, let's use it\n} else {\n  // hmm,\
    \ this feature is not supported, will have to\n  // think of another way\n}\n\
    ```\n\nAnother reason to avoid user agent sniffing is that some browsers allow\
    \ users to modify the string and pretend they are using a different browser."
