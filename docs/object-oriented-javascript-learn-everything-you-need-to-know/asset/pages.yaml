    \ of the points on the canvas start from x=0, y=0, which is the top left. The\
    \ bottom right will be x=800, y=600:\n\n![](img/901612d85bd2f01ce60fcfeb0719ea7c_220_0.png)\n\
    \nNext, the Line constructor. It takes two points and calculates the length of\
    \ the line between them, using the Pythagorean Theorem a2+b2=c2 (imagine a right-angled\
    \ triangle where the hypotenuse connects the two points).\n\n```\nfunction Line(p1,\
    \ p2) {\n  this.p1 = p1;\n  this.p2 = p2;\n  this.length = Math.sqrt(\n    Math.pow(p1.x\
    \ - p2.x, 2) +\n    Math.pow(p1.y - p2.y, 2)\n  );\n}\n```"
