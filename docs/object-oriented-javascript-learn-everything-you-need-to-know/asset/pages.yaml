  md: 'It can contain global variables as a1 and a2 and global functions such as F:


    ![](img/901612d85bd2f01ce60fcfeb0719ea7c_101_0.png)


    Functions have their own private space and can use it to store other variables
    such as b and inner functions as N (for iNNer). At some point, you end up with
    a picture like this:


    ![](img/901612d85bd2f01ce60fcfeb0719ea7c_101_1.png)


    If you''re at point a, you are inside the global space. If you''re at point b,
    which is inside the space of the function F, then you have access to the global
    space and to the F space. If you''re at point c, which is inside the function
    N, then you can access the global space, the F space, and the N space. You cannot
    reach from a to b, because b is invisible outside F. But, you can get from c to
    b if you want, or from N to b. The interesting part—the closure effect—happens
    when somehow N breaks out of F and ends up in the global space:


    ![](img/901612d85bd2f01ce60fcfeb0719ea7c_101_2.png)'
