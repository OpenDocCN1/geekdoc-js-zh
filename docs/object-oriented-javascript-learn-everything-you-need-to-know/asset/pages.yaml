- img_proc: true
  md: 'Object-oriented JavaScript


    # Polymorphism


    In the preceding example, a Programmer object inherited all of the methods of
    the parent Person object. This means that both objects provide a talk method,
    among others. Now imagine somewhere in your code there''s a variable called Bob,
    and it just happens that you don''t know if Bob is a Person object or a Programmer
    object. You can still call the talk method on the Bob object and the code will
    work. This ability to call the same method on different objects and have each
    of them respond in their way is called polymorphism.


    # OOP summary


    Here''s a quick table summarizing the concepts discussed so far:


    | Feature | Illustrates concept |

    | --- | --- |

    | Bob is a man (object). | Objects |

    | Bob''s date of birth is June 1, 1980, gender: male; hair: black. | Properties
    |

    | Bob can eat, sleep, drink, dream, talk, and calculate his own age. | Methods
    |

    | Bob is an instance of the Programmer class. | Class (in classical OOP) |

    | Bob is based on another object, called Programmer. | Prototype (in prototypypical
    OOP) Encapsulation |

    | Bob holds data (such as birth_date) and methods that work with the data (as
    calculateAge()). | Information hiding |

    | You don''t need to know how the calculation method works internally. The object
    might have some private data, such as the number of days in February in a leap
    year. You don''t know, nor do you want to know. |

    | Bob is part of a WebTeam object, together with Jill, a Designer object, and
    a ProjectManager object. | Aggregation and composition |

    | Designer, ProjectManager, and Programmer are all based on and extend a Person
    object. | Inheritance |

    | You can call the methods Bob.talk(), Jill.talk(), and Jack.talk() and they will
    all work fine, albeit producing different results (Bob will probably talk more
    about performance, Jill about beauty, and Jack about deadlines). Each object inherited
    the method talk from Person and customized it. | Polymorphism and method overriding
    |'
