  md: '# Child nodes


    In order to tell if a node has any children you use hasChildNodes() as follows:


    ```

    > document.documentElement.hasChildNodes();

    true

    ```


    The HTML element has three children, the head and the body elements and the whitespace
    between them (whitespace is counted in most, but not all browsers). You can access
    them using the childNodes array-like collection as follows:


    ```

    > document.documentElement.childNodes.length;

    3

    ```


    ```

    > document.documentElement.childNodes[0]

    <head>...

    ```


    ```

    > document.documentElement.childNodes[1]

    #text

    ```


    ```

    > document.documentElement.childNodes[2]

    <<body>...</body>

    ```


    Any child has access to its parent through the parentNode property, as seen in
    the following code:


    ```

    > document.documentElement.childNodes[1].parentNode;

    <html>...</html>

    ```


    Let''s assign a reference to a variable as follows:


    ```

    > var bd = document.documentElement.childNodes[2];

    ```


    How many children does the body element have?


    ```

    > bd.childNodes.length;

    9

    ```


    As a refresher, here is the body of the document:


    ```

    <body>

    <p class="opener">first paragraph</p>

    <p><em>second</em> paragraph</p>

    <p id="closer">final</p>

    <!-- and that''s about it --

    </body>

    ```'
