  md: "# Mixins\n\nYou might come across the term *mixin*. Think of a mixin as an\
    \ object that provides some useful functionality but is not meant to be inherited\
    \ and extended by sub-objects. The approach to multiple inheritance outlined previously\
    \ can be considered an implementation of the mixins idea. When you create a new\
    \ object you can pick and choose any other objects to mix into your new object.\
    \ By passing them all to `multi()` you get all their functionality without making\
    \ them part of the inheritance tree.\n\n# Parasitic inheritance\n\nIf you like\
    \ that you can have all kinds of different ways to implement inheritance in JavaScript\
    \ and you're hungry for more, here's another one. This pattern, courtesy of Douglas\
    \ Crockford, is called parasitic inheritance. It's about a function that creates\
    \ objects by taking all of the functionality from another object into a new object,\
    \ augmenting the new object, \"pretending\" that it has done all the work.\n\n\
    Here's an ordinary object, defined with an object literal, and unaware of the\
    \ fact that its is going to fall victim to parasitism:\n\n```\nvartwoD = {\n \
    \ name: '2D shape',\n  dimensions: 2\n};\n```\n\nA function that creates triangle\
    \ objects could:\n\n+   - Use twoD object as a prototype of an object called that\
    \ (similar to this for convenience). This can be done in any way you saw previously,\
    \ for example using the `()` function or copying all the properties.\n- Augment\
    \ that with more properties.\n- Return that.\n\n```\nfunction triangle(s, h) {\n\
    \  var that = object(twoD);\n  that.name = 'Triangle';\n  that.getArea = function\
    \ () {\n    return this.side * this.height / 2;\n  };\n  that.side = s;\n  that.height\
    \ = h;\n  return that;\n}\n```"
