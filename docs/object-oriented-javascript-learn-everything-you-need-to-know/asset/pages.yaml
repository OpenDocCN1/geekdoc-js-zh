    3\n\n+   > newtoy.getInfo();\n**Rating: 3, price: 100**\n\nIt is important to\
    \ note that the prototype is \"live\". Objects are passed by reference in JavaScript,\
    \ and therefore, it is not copied with every new object instance. What does this\
    \ mean in practice? It means that you can modify the prototype at any time and\
    \ all the objects (even those created before the modification) will \"see\" the\
