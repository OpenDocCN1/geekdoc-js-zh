  md: '# Objects


    charAt() tells you the character found at the position you specify, which is the
    same

    as as using square brackets (treating a string as an array of characters):


    ```

    > s.charAt(0);

    "C"

    ```


    ```

    > s[0];

    "C"

    ```


    If you pass a non-existing position to charAt(), you get an empty string:


    ```

    > s.charAt(101);

    ""

    ```


    indexOf() allows you to search within a string. If there is a match, the method

    returns the position where the first match is found. The position count starts
    at 0,

    as the second character in "Couch" is "o" at position 1:


    ```

    > s.indexOf(''o'');

    1

    ```


    You can optionally specify where (at what position) to start the search. The following

    finds the second "o", because indexOf() is instructed to start the search at position
    2:


    ```

    > s.indexOf(''o'', 2);

