  md: "Coding and Design Patterns\n\n# JSON\n\nLet's wrap up the coding patterns section\
    \ of this chapter with a few words about JSON. JSON is not technically a coding\
    \ pattern, but you can say that using JSON is a good pattern.\n\nJSON is a popular\
    \ lightweight format for exchanging data. It's often preferred over XML when using\
    \ XMLHttpRequest() to retrieve data from the server. JSON stands for JavaScript\
    \ Object Notation and there's nothing specifically interesting about it other\
    \ than the fact that it's extremely convenient. The JSON format consists of data\
    \ defined using object, and array literals. Here is an example of a JSON string\
    \ that your server could respond with after an XHR request:\n\n```\n{\n  'name':\
    \ 'Stoyan',\n  'family': 'Stefanov',\n  'books': ['OOJS', 'JSPatterns', 'JS4PHP']\n\
    }\n```\n\nAn XML example of this would be something like the following:\n\n```\n\
    <?xml version=\"1.1\" encoding=\"iso-8859-1\"?>\n<response>\n  <name>Stoyan</name>\n\
    \  <family>Stefanov</family>\n  <books>\n    <book>OOJS</book>\n    <book>JSPatterns</book>\n\
    \    <book>JS4PHP</book>\n  </books>\n</response>\n```\n\nFirst, you can see how\
    \ JSON is lighter in the number of bytes. But the main benefit is not the smaller\
    \ byte size but the fact that it's trivial to work with JSON in JavaScript. Let's\
    \ say you make an XHR request and received a JSON string in the responseText of\
    \ the XHR object. You can convert this string of data into a working JavaScript\
    \ object by simply using eval():\n\n```\n// warning: counter-example\nvar response\
    \ = eval('(' + xhr.responseText + ')');\n```"
  merge: -1
  pgno: 302
