  md: '# Inheritance


    | # | Name | Example | Classification | Notes |

    |---|---|---|---|---|

    | 2 | Inherit the prototype | Child.prototype = Parent.prototype; | • Works with
    constructors<br>• Copies the prototype (no prototype chain, all share the same
    prototype object) | • More efficient, no new instances are created just for the
    sake of inheritance.<br>• Prototype chain lookup runtime is fast, since there''s
    no chain.<br>• Drawback: children can modify parents'' functionality. |

    | 3 | Temporary constructor | function extend(Child, Parent) { var F = function(){};
    F.prototype = Parent.prototype; Child.prototype = new F(); Child.constructor =
    Child; Child.uber = Parent.prototype; } | • Works with constructors<br>• Uses
    the prototype chain | • Unlike #1, it inherits properties of the prototype.<br>•
    Own properties (created with this inside the constructor) are not inherited.<br>•
    Provides convenient access to the parent (through uber). |

    | 4 | Copying the prototype properties | function extend(Child, Parent) { var
    p = Parent.prototype; var c = Child.prototype; for (var i in p) { c[i] = p[i];
    } c.uber = p; } | • Works with constructors<br>• Copies properties<br>• Uses the
    prototype chain | • All properties of the parent become properties of the child
    prototype<br>• No need to create a new object for inheritance purposes<br>• Shorter
    prototype chains |'
