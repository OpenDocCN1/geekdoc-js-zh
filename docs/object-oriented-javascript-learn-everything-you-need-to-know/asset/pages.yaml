  md: '# Preface


    This is the second edition of the highly rated book Object-Oriented JavaScript
    by St Stefanano, Packt Publishing. After the release of the first edition, in
    the last five years, JavaScript has moved from being most used in browsers for
    client-side technologies to being used even on server side. This edition explores
    the "language side" of JavaScript. The stress is still find it useful and informative.
    The book talks about ECMA, Object-Oriented JS, patterns, prototypal inheritance,
    and design patterns.


    The book doesn''t assume any prior knowledge of JavaScript and works from the
    ground up to give you a thorough understanding of the language. People who know
    the language will still find it useful and informative. Exercises at the end of
    the chapters help you assess your understanding.


    # What this book covers


    +   Chapter 1, Object-Oriented JavaScript, talks briefly about the history, present,
    and future of JavaScript, and moves on to explore the basics of object-oriented
    programming (OOP) in general. You then learn how to set up your environment (Firebug)
    in order to dive into the language on your own, using the book examples as a base.


    +   Chapter 2, Primitive Data Types, Arrays, Loops, and Conditions, discusses
    the language basics: variables, data types, primitive data types, arrays, loops,
    and conditionals.


    +   Chapter 3, Functions, covers functions that JavaScript uses, and here you
    learn to master them all. You also learn about the scope of variables and JavaScript''s
    built-in functions. An interesting, but often misunderstood feature of the language—closures—is
    demystified at the end of the chapter.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Preface


    Chapter 4, Objects, talks about objects, how to work with properties and methods,
    and the various ways to create your objects. This chapter also talks about built-in
    objects as Array, Function, Number, and String.


    Chapter 5, Prototype, is dedicated to the all-important concept of prototypes
    in JavaScript. It also explains how prototype chain works, hasOwnProperty(), and
    some gotchas of prototypes.


    Chapter 6, Inheritance, discusses how inheritance works. This chapter also talks
    about a method to create subclasses like other classic languages.


    Chapter 7, The Browser Environment, is dedicated to browsers. This chapter also
    covers BOM (Browser Object Model), DOM (W3C''s Document Object Model), browser
    events, and AJAX.


    Chapter 8, Coding and Design Patterns, dives into unique JavaScript coding patterns,
    as well as several language-independent design patterns, translated to JavaScript
    from the Book of Four, the most influential work of software design patterns.
    The chapter also discusses JSON.


    Appendix A, Reserved Words, lists the reserved words in JavaScript.


    Appendix B, Built-in Functions, is a reference of built-in JavaScript functions
    together with sample uses.


    Appendix C, Built-in Objects, is a reference that provides details and examples
    of the use of every method and property of every built-in object in JavaScript.


    Appendix D, Regular Expressions, is a regular expressions pattern reference.


    Appendix E, Answers to Exercise Questions, has solutions for all the exercises
    mentioned at the end of the chapters.


    You can download this Appendix from http://www.packpub.com/sites/default/files/downloads/3127OT_Answers_to_Exercise_Questions.pdf.'
