    # Modifying styles


    Often you don''t change the content of a node but its presentation. The elements
    have a style property, which in turn has a property mapped to each CSS property.
    For example, changing the style of the paragraph to add a red border:


    +   > my.style.border = "1px solid red";

    > "Ipx solid red"


    CSS properties often have dashes, but dashes are not acceptable in JavaScript
    identifiers. In such cases, you skip the dash and uppercase the next letter. padding-top
    becomes paddingTop, margin-left becomes marginLeft, and so on. Have a look at
    the following code:


    +   > my.style.fontWeight = "bold";

    > "bold"


    You also have access to cssText property of style, which lets you work with styles
    as strings:


    +   > my.style.cssText;

    > "border: 1px solid red; font-weight: bold;"


    And modifying styles is a string manipulation:


    +   > my.style.cssText += " border-style: dashed";

    > "border: 1px dashed red; font-weight: bold; border-style: dashed;"


