    # isNaN()


    Using isNaN(), you can check if an input value is a valid number that can be used
    in arithmetic operations. This function is also a convenient way to check whether
    parseInt() or parseFloat() (or any arithmetic operation) succeeded:


    ```

    > isNaN(NaN);

    true

    ```


    ```

    > isNaN(123);

    false

    ```


    ```

    > isNaN(1.23);

    false

    ```


    ```

    > isNaN(parseInt(''abc123''));

    true

    ```'
