  md: "# Global variable\n\nOne approach would be to use a global variable to store\
    \ the single instance. Your constructor could look like this:\n\n```\nfunction\
    \ Logger() {\n  if (typeof global_log === \"undefined\") {\n    global_log = this;\n\
    \  }\n  return global_log;\n}\n```\n\nUsing this constructor gives the expected\
    \ result:\n\n```\nvar a = new Logger();\nvar b = new Logger();\nconsole.log(a\
    \ === b); // true\n```\n\nThe drawback is, obviously, the use of a global variable.\
    \ It can be overwritten at any time, even accidentally, and you lose the instance.\
    \ The opposite, your global variable overwriting someone else's is also possible.\n\
    \n# Property of the Constructor\n\nAs you know, functions are objects and they\
    \ have properties. You can assign the single instance to a property of the constructor\
    \ function as follows:\n\n```\nfunction Logger() {\n  if (Logger.single_instance)\
    \ {\n    Logger.single_instance = this;\n  }\n  return Logger.single_instance;\n\
    }\n```\n\nIf you write a = new Logger(), points to the newly created Logger.single_instance\
    \ property. A subsequent call var b = new Logger() results in b pointing to the\
    \ same Logger.single_instance property, which is exactly what you want.\n\nThis\
    \ approach certainly solves the global namespace issue because no global variables\
    \ are created. The only drawback is that the property of the Logger constructor\
    \ is publicly visible, so it can be overwritten at any time. In such cases, the\
    \ single instance can be lost or modified. Of course, you can provide some protection\
    \ against fellow programmers shooting themselves in the foot. After all, if someone\
    \ can mess with the single instance property, they can mess up the Logger constructor\
    \ directly, as well."
