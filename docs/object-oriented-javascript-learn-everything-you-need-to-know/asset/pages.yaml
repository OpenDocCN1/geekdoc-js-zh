  md: '# Boolean


    Your journey through the built-in objects in JavaScript continues, and the next
    three are fairly straightforward; they merely wrap the primitive data types Boolean,
    number, and string.


    You already know lot about Booleans from Chapter 2, Primitive Data Types, Arrays,
    Loops, and Conditions. Now, let''s meet the Boolean() constructor:


    +   > var b = new Boolean();


    It''s important to note that this creates a new object, b, and not a primitive
    Boolean value. If you get the primitive value, you can call the valueOf() method
    (inherited from Object and customized):


    +   > var b = new Boolean();

    > typeof b;

    > "object"


    +   > typeof b.valueOf();

    > "boolean"


    +   > b.valueOf()();

    > false


    Overall, objects created with the Boolean() constructor are not too useful, as
    they don''t provide any methods or properties other than the inherited ones.


    The Boolean() function, when called as a normal function with new, converts non-Booleans
    to Booleans (which is like using a double negation !!value):


    +   > Boolean("test");

    > true


    +   > Boolean("");

    > false


    +   > Boolean({});

    > true


    Apart from the six falsy values, everything else is true in JavaScript, including
    all objects. This also means that all Boolean objects created with new Boolean()
    are also true, as they objects:


    +   > Boolean(new Boolean(false));

    > true'
