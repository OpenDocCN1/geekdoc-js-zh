  md: "# # What is a function?\n\nFunctions allow you to group together code, give\
    \ this code a name, and reuse it later, addressing it by the name you gave it.\
    \ Let's see an example:\n\n```\nfunction sum(a, b) {\n  var c = a + b;\n  return\
    \ c;\n}\n```\n\nThe parts that make up a function are shown as follows:\n\n+ \
    \  * The function statement.\n* The name of the function, in this case sum.\n\
    * The function parameters, in this case a and b. A function can take any number\
    \ of parameters, separated by commas.\n* A code block, also called the body of\
    \ the function.\n* The return statement. A function always returns a value. If\
    \ it doesn't return a value explicitly, it implicitly returns the value undefined.\n\
    \nNote that a function can only return a single value. If you need to return more\
    \ values, you can simply return an array that contains all of the values you need\
    \ as elements of this array.\n\nThe preceding syntax is called a function declaration.\
    \ It's just one of the ways to create a function in JavaScript, and more ways\
    \ are coming up.\n\n# # Calling a function\n\nIn order to make use of a function,\
    \ you need to call it. You call a function simply by using its name optionally\
    \ followed by any number of values in parentheses. \"To invoke\" a function is\
    \ another way of saying \"to call\".\n\nLet's call the function sum(), passing\
    \ two arguments and assigning the value that the function returns to:\n\n```\n\
    > var result = sum(1, 2);\n> result;\n3\n```"
  merge: -1
