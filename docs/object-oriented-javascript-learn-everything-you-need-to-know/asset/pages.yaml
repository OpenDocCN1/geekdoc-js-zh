  md: "# Inheritance\n\nThe prototype object is just a regular object, and therefore,\
    \ it also has the secret link to its prototype. And so a chain is created, called\
    \ a prototype chain:\n\n| | | C |\n|---|---|---|n| | B | --PROTO-- | |\n| A |\
    \ --PROTO-- | |\n\nIn this illustration, an object A contains a number of properties.\
    \ One of the properties is the hidden __proto__ property, which points to another\
    \ object, B's __proto__ property points to C. This chain ends with the Object.prototype—the\
    \ grandparent, and every object inherits from it.\n\nThis is all to know, but\
    \ how does it help you? The practical side is when object A lacks a property but\
    \ B has it, A can still access this property as its own. The same applies if B\
    \ also doesn't have the required property, but C does. This is how inheritance\
    \ takes place: an object can access any property found somewhere down the inheritance\
    \ chain.\n\nThroughout the rest of this chapter, you'll see different examples\
    \ that use the inheritance hierarchy: a generic Shape is inherited by a 2D shape,\
    \ which in turn is inherited by any number of specific two-dimensional shapes\
    \ such as a Triangle, Rectangle, and so on.\n\n# Prototype chaining example\n\n\
    Prototype chaining is the default way to implement inheritance. In order to implement\
    \ the hierarchy, let's define three constructor functions.\n\n```\nfunction Shape()\
