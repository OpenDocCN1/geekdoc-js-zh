  pgno: 310
- img_proc: true
  md: "Let's take a look at an example implementation of the push model. Let's keep\
    \ the observer-related code into a separate object and then use this object as\
    \ a mix-in, adding its functionality to any other object that decides to be a\
    \ publisher. In this way any object can become a publisher and any function can\
    \ become a subscriber. The observer object will have the following properties\
    \ and methods:\n\n+   - An array of subscribers that are just callback functions\n\
    - addSubscriber() and removeSubscriber() methods that add to, and remove from,\
    \ the subscribers collection\n- A publish() method that takes data and calls all\
    \ subscribers, passing the data to\n- A make() method that takes any object and\
    \ turns it into a publisher by adding all of the methods mentioned previously\
    \ to it\n\nHere's the observer-mix object, which contains all the subscription-related\
    \ methods and can be used to turn any object into a publisher:\n\n```\nvar observer\
    \ = {\n  addSubscriber: function (callback) {\n    if (typeof callback === \"\
    function\") {\n      this.subscribers[this.subscribers.length] = callback;\n \
    \   }\n  },\n  removeSubscriber: function (callback) {\n    for (var i = 0; i\
    \ < this.subscribers.length; i++) {\n      if (this.subscribers[i] === callback)\
    \ {\n        delete this.subscribers[i];\n      }\n    }\n  },\n  publish: function\
    \ (what) {\n    for (var i = 0; i < this.subscribers.length; i++) {\n      if\
    \ (typeof this.subscribers[i] === 'function') {\n        this.subscribers[i](what);\n\
    \      }\n    }\n  },\n  make: function (o) { // turns an object into a publisher\n\
    \    for (var i in this) {\n      if (this.hasOwnProperty(i)) {\n        o[i]\
    \ = this[i];\n        o.subscribers = [];\n      }\n    }\n  }\n};\n```"
