    \ function. These are invisible to the code outside of the constructor. Here's\
    \ how FancyButton can make use of the local properties:\n\n```\nvar MYAPP = {};\n\
    MYAPP.dom = {;\n\nMYAPP.dom.FancyButton = function (text, conf) {\n  var styles\
    \ = {\n    font: 'Verdana',\n    border: 'lpx solid black',\n    color: 'black',\n\
    \    background: 'grey'\n  };\n  function setStyles(b) {\n    var i;\n    for\
    \ (i in styles) {\n      if (styles.hasOwnProperty(i)) {\n        b.style[i] =\
    \ conf[i] || styles[i];\n      }\n    }\n  }\n  conf = conf || {};\n  var b =\
    \ document.createElement('input');\n  b.type = conf.type || 'submit';\n  b.value\
    \ = text;\n  setStyles(b);\n  return b;\n}\n```\n\nIn this implementation, styles\
    \ is a private property and setStyle() is a private method. The constructor uses\
    \ them internally (and can access anything inside the constructor), but they are\
    \ not available to code outside of the function.\n\n# # Privileged methods\n\n\
    Privileged methods (this term was coined by Douglas Crockford) are normal public\
    \ methods that can access private methods or properties. They can act like a bridge\
    \ in making some of the private functionality accessible but in a controlled manner,\
    \ wrapped in a privileged method."
