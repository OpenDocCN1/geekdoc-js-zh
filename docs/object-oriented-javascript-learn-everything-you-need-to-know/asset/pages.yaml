  md: '# Core DOM and HTML DOM


    One diversion before moving on to more practical examples. As you now know, the
    DOM represents XML documents and HTML documents. In fact, HTML documents are XML
    documents, but a little more specific. Therefore, as part of DOM Level 1, there
    is a Core DOM specification that is applicable to all XML documents, and there
    is also an HTML DOM specification, which extends and builds upon the Core DOM.
    Of course, the HTML DOM doesn''t apply to all XML documents, but only to HTML
    documents. Let''s see some examples of Core and HTML constructors:


    | Constructor | Inherits from | Core or HTML | Comment |

    | --- | --- | --- | --- |

    | Node | Node | Core | Any node on the tree. |

    | Document | Node | Core | The document object, the main entry point to any XML
    document. |

    | HTMLElement | Document | HTML | This is window.document or simply document,
    the HTML-specific version of the object, you will use extensively. |

    | Element | Node | Core | Every tag is represented by an element. That''s why
    you say "the <p> tag". |

    | HTMLElement | Element | HTML | General-purpose constructor, all constructors
    for HTML elements inherit from. |

    | HTMLBodyElement | HTMLElement | HTML | Element representing the <body> tag.
    |

    | HTMLLinkElement | HTMLElement | HTML | An element (an <a href="..."><a> tag).
    All the rest of the HTML elements. |

    | CharacterData | Node | Core | General-purpose constructor for dealing with texts.
    |

    | Text | CharacterData | Core | Text node inside a tag. In <em>second/</em> you
    have the element node EM and the text node with value second. |

    | Comment | CharacterData | Core | <!-- any comment --> |'
  merge: -1
  pgno: 243
- img_proc: true
  md: "# The Browser Environment\n\n| Constructor | Inherits from | Core or HTML |\
    \ Comment |\n|---|---|---|---|\n Attr | Node | Core | Represents an attribute\
    \ of a tag, in <p id=\"closer\"> the id attribute is a DOM object created by the\
    \ Attr() constructor. |\n NodeList | | Core | A list of nodes, an array-like object\
    \ that has a length property. |\n NamedNodeMap | | Core | Same as NodeList but\
    \ the nodes can be accessed by name, not only by numeric index. |\n HTMLCollection\
    \ | | HTML | Similar to NamedNodeMap specific for HTML. |\n\nThese are by no means\
    \ of all the Core DOM and HTML DOM objects. For the full list consult http://www.w3.org/TR/DOM-Level-1/.\n\
    \nNow that this bit of DOM theory is behind you, let's focus on the practical\
    \ side of working with the DOM. In the following sections, you'll learn how to\
    \ do the following things:\n\n+   * Access DOM nodes\n* Modify nodes\n* Create\
    \ new nodes\n* Remove nodes\n\n# Accessing DOM nodes\n\nBefore you can validate\
    \ the user input in a form on a page or swap an image, you need to get access\
    \ to the element you want to inspect or modify. Luckily, there are many ways to\
    \ get to any element, by navigating around traversing the DOM tree or by using\
    \ a shortcut.\n\nIt's best if you start experimenting with all of the new objects\
    \ and methods. The examples you'll see use the same simple document you saw at\
    \ the beginning of the DOM section, and which you can access at http://www.phpied.com/files/jsoop/ch7.html.\
    \ Open your console, and let's get started."
