  md: '# # Object-oriented JavaScript


    Ever since the early days of the Web, there has been a need for more dynamic and
    responsive interfaces. While it''s OK to read static HTML pages of text and even
    better when they are beautifully presented with the help of CSS, it''s much more
    fun to engage with applications in our browsers, such as e-mail, calendars, banking,
    shopping, drawing, playing games, and editing. All that is possible thanks to
    JavaScript, the programming language of the Web. JavaScript started with simple
    one-liners embedded in HTML, but is now used in much more sophisticated ways.
    Developers leverage the object-oriented nature of the language to build scalable
    code architectures made up of reusable pieces.


    If you look at the time and present buzzwords in web development –DHTML, Ajax,
    Web 2.0, HTML5–they all essentially mean HTML, CSS, and JavaScript. HTML for content,
    CSS for presentation, and JavaScript for behavior. In other words, JavaScript
    is the glue that makes everything work together so that we can build rich web
    applications.


    But that''s not, JavaScript can be used for more than just the Web.


    JavaScript programs run inside a host environment. The web browser is the most
    common environment, but it''s not the only one. Using JavaScript, you can create
    all kinds of widgets, application extensions, and other pieces of software, as
    you''ll see in a bit. Taking the time to learn JavaScript is a smart investment;
    one language can then write all kinds of different applications running on multiple
    platforms, including mobile and server-side applications. These days, it''s safe
    to say that JavaScript is everywhere.


    This book starts from zero, and does not assume any prior programming knowledge
    other than some basic understanding of HTML. Although there is one chapter dedicated
    to the web browser environment, the rest of the book is about JavaScript in general,
    so it is applicable to all environments.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Object-oriented JavaScript


    Let''s start with the following:


    +   - A brief introduction to the story behind JavaScript

    - The basic concepts you will encounter in discussions on object-oriented programming


    # # A bit of history


    Initially


    The applets didn''t quite catch up, but JavaScript did. The ability to use short
    code snippets embedded in HTML documents and otherwise static elements of a web
    page was embraced by the webmaster community. Soon, the competing browser vendor
    Microsoft shipped Internet Explorer (IE) 3.0 with JavaScript, which was a reverse
    engineered version of JavaScript plus some IE-specific features. Eventually, there
    was an effort to standardize the usage of the language, and this is how ECMAScript
    was born. ECMA (European Computer Manufacturers Association) created the standard
    called ECMA-262, which describes the core parts of the JavaScript language without
    browser and web-page specific features.


    You can think of JavaScript as a terrace that encompasses three pieces:


    +   - ECMAScript—the core language—variables, functions, loops, and so on. This
    part is independent of the browser and this language can be used in many other
    environments.

    - Document Object Model (DOM), which provides ways to work with HTML and XML documents.
    Initially, JavaScript provided limited access to what''s scriptable on the page,
    mainly forms, links, and images. Later it was expanded to make all elements scriptable.
    This lead to the DOM standard by the **World Wide Web Consortium (W3C)** as a
    language-independent (no longer tied to JavaScript) way to manipulate structured
    documents.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '+   - Browser Object Model (BOM), which is a set of objects related to the
    browser environment and was never part of any standard until HTML5 started standardizing
    some of the common objects that exist across browsers.


    While there is one chapter in the book dedicated to the browser, and the BOM,
    most of the book describes the core language and teaches you skills you can use
    in any environment where JavaScript programs run.


    # # Browser wars and renaissance


    For better or worse, JavaScript''s instant popularity happened during the period
    of the Browser Wars (approximately 1996 to 2001). Those were the times during
    the Initial Internet boom when the two major browser vendors—Netscape and Microsoft—were
    competing for market share. Both were constantly adding more bells and whistles
    to their browsers and versions of JavaScript, DOM, and BOM, which naturally led
    to many inconsistencies. While adding more features, the browser vendors were
    falling behind on providing proper development and debugging tools and adequate
    documentation. Often, you would write a script in one browser, and when you''re
    done testing in the other browser, only to find that your script simply fails
    for no apparent reason and the best you can get is a cryptic error message like
    "Operation aborted":


    Inconsistent implementations, missing documentation, and no appropriate tools
    painted JavaScript in such a light that many programmers simply refused to bother
    with it.


    On the other hand, developers who tried to experiment with JavaScript got a little
    carried away adding too many special effects to their pages without much regard
