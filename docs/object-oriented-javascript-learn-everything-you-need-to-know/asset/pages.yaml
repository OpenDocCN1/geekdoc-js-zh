  md: "```\n// vs.\n\n(function () {\n  // ...\n})();\n```\n\nOne good application\
    \ of immediate (self-invoking) anonymous functions is when you want to have some\
    \ work done without creating extra global variables. A drawback of, course, is\
    \ that you cannot execute the same function twice. This makes immediate functions\
    \ best suited for one-off or initialization tasks.\n\nAn immediate function can\
    \ also optionally return a value if you need one. It's not uncommon to see code\
    \ that looks like the following:\n\n```\nvar result = (function () {\n  // something\
    \ complex with\n  // temporary local variables...\n  // ...\n\n  return something;\n\
    })();\n```\n\nIn this case, you don't need to wrap the function expression in\
    \ parentheses, you only need the parentheses that invoke the function. So, the\
    \ following also works:\n\n```\nvar result = function () {\n  // something complex\
    \ with\n  // temporary local variables\n  // return something;\n};\n```\n\nThis\
    \ syntax works, may look slightly confusing: without reading the end of the function,\
    \ you don't know if result is a function or the return value of the immediate\
    \ function.\n\n# Inner (private) functions\n\nBearing in mind that a function\
    \ is just like any other value, there's nothing that stops you from defining a\
    \ function inside another function:\n\n```\nfunction outer(param) {\n  function\
    \ inner(theinput) {\n    return theinput * 2;\n  }\n\n  return 'The result is\
    \ ' + inner(param);\n}\n```"
