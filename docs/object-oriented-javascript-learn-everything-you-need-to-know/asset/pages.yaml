  md: "# The secret __proto__ link\n\nAs you already know, the prototype property\
    \ is consulted when you try to access a property that does not exist in the current\
    \ object.\n\nConsider another object called monkey and use it when creating objects\
    \ with the Human() constructor.\n\n```\nvar monkey = {\n  feeds: 'bananas',\n\
    \  breaths: 'air'\n};\nfunction Human() {\n  Human.prototype = monkey;\n```\n\n\
    Now, let's create a developer and give it some properties.\n\n```\nvar developer\
    \ = new Human();\ndevelop.feeds = 'pizza';\ndevelop.hacks = 'JavaScript'\n```\n\
    \nNow let's access these properties. For example, hacks is a property of the developer\
    \ object.\n\n```\ndeveloper.hacks;\n\"JavaScript'\n```\n\nfeeds could also be\
    \ found in the object.\n\n```\ndeveloper.feeds;\n\"pizza\"\n```\n\nbreat doesn't\
    \ exist as a property of the developer object, so the prototype is looked up,\
    \ as if there is a secret link, or a secret passageway, that leads to the prototype\
    \ object.\n\n```\ndeveloper.breaths;\n\"air\"\n```\n\nThe secret link is exposed\
    \ in most modern JavaScript environments as the __proto__ property (the word \"\
    proto\" with two underscores before and two after).\n\n```\ndeveloper.__proto__\
    \ === monkey;\ntrue\n```"
  merge: -1
