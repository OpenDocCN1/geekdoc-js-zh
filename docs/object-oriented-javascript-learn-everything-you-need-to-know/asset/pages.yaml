- img_proc: true
  md: 'In other words, the step-by-step procedure for executing a switch statement
    is as follows:


    +   1. Evaluate the switch expression found in parentheses, remember it.

    2. Move to the first case and compare its value with the one from step 1.

    3. If the comparison in step 2 returns true, execute the code in the case block.

    4. After the case block is executed, if there''s a break statement at the end
    of it, execute the switch.

    5. If there''s no break or step 2 returned false, move on to the next case.

    6. Repeat steps 2 to 5.

    7. If you are still here (no exit in step 4), execute the code following the default
    statement.


    # Best practice tips


    +   * Indent the code that follows the case lines. You can also indent from the
    switch, but doesn''t give you much in terms of readability.

    * Don''t forget to break.

    * Sometimes, you may want to omit the break intentionally, but that''s rare. It''s
    called a fall-through and should be documented because it might look like an accidental
    omission. On the other hand, sometimes you may want to omit the code block following
    and have two cases sharing the same code. This is fine, but doesn''t change the
    rule that there''s code that follows a case statement, this code should end with
    a break. In terms of indentation, aligning the break with the case or with the
    code inside the case is a personal preference; again, being consistent is what
    matters.

    * Use the default case. This helps make sure you always have a meaningful result
    after the switch statement, even if none of the cases matches the value being
    switched.


    ![](img/901612d85bd2f01ce60fcfeb0719ea7c_69_0.png)'
