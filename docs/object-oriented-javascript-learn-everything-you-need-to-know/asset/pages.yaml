    \   - The if statement\n- A condition (the part in parentheses)—“is greater than\
    \ 2?”\n- A block of code wrapped in {} executes if the condition is true\n\nThe\
    \ condition (the part in parentheses) always returns a Boolean value, and may\
    \ also contain the following:\n\n+   - A logical operation: !, &&, ||\n- A comparison,\
    \ such as ===, !=, >, and so on\n- Any value or variable that can be converted\
    \ to a Boolean\n- A combination of the above\n\n# The else clause\n\nThere can\
    \ also be an else part of the if condition. The else statement is followed by\
    \ a block of code that runs if the condition evaluates to false:\n\n```\nif (a\
    \ > 2) {\n  result = 'a is greater than 2';\n} else {\n  result = 'a is NOT greater\
    \ than 2';\n}\n```"
