  md: "Using the three different constructors is exactly the same, pass the url and\
    \ call the insert() method:\n\n```\nvar url = 'http://www.phpdied.com/images/covers/oojs.jpg';\n\
    ```\n\n```\nvar o = new MYAPP.dom.Image(url);\no.insert(document.body);\n```\n\
    \n```\nvar o = new MYAPP.dom.Text(url);\no.insert(document.body);\n```\n\n```\n\
    var o = new MYAPP.dom.Link(url);\no.insert(document.body);\n```\n\nImagine your\
    \ program doesn't know in advance which type of object is required. The user decides,\
    \ during runtime, by clicking on a button for example. If type contains the required\
    \ type of object, you'll need to use an if or a switch, and do something like:\n\
    \n```\nvar o;\nif (type === 'Image') {\n    o = new MYAPP.dom.Image(url);\n}\n\
    if (type === 'Link') {\n    o = new MYAPP.dom.Link(url);\n}\nif (type === 'Text')\
    \ {\n    o = new MYAPP.dom.Text(url);\n}\nu.url = 'http://...';\no.insert();\n\
    ```\n\nThis works fine, but if you have a lot of constructors, the code becomes\
    \ too long and hard to maintain. Also, if you are creating a library or a framework\
    \ that allows extensions or plugins, you don't even know the exact names of all\
    \ the constructor functions in. In such cases, it's convenient to have a factory\
    \ function that takes care of creating an object of the dynamically determined\
    \ type:\n\nLet's add a factory method to the MYAPP.dom utility:\n\n```\nMYAPP.dom.factory\
    \ = function (type, url) {\n    return new MYAPP.dom[type](url);\n};\n```"
