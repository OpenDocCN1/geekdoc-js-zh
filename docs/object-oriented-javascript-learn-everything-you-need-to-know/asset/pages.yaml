  md: '# Aggregation


    Combining objects into a new one is known as **aggregation** or **composition**.
    It''s a powerful way to separate a problem into smaller and more manageable parts
    (divide and conquer). When a problem scope is so complex that it''s impossible
    to think about it at a detailed level in its entirety, you can separate the problem
    into several smaller areas, and then separate each of these into smaller chunks.
    This allows you to think about the problem on several levels of abstraction.


    Take, for example, a personal computer. It''s a complex object. You cannot think
    about all the things that need to happen when you start your computer. But, you
    can abstract the problem saying that you need to initialize all the separate objects
    that your *Computer* object consists of—the *Monitor* object, the *Mouse* object,
    the *Keyboard* object, then you can dive deeper into each of the sub-objects.
    This way, you''re composing complex objects by assembling reusable.


    To use another, a Book object can contain (aggregate) or more *Author* objects,
    a *Publisher* object, several *Chapter* objects, a *TOC* (table of contents),
    and so on.


    # Inheritance


    Inheritance is an elegant way to reuse existing code. For example, you can have
    a generic object, *Person*, which has properties such as *name* and *date_of_birth*,
    and which also implements the functionality *walk*, *talk*, *sleep*, and *eat*.
    Then, you figure out that you need another object called *Programmer*. You could
    re-implement that Programmer inherits *Person* and save yourself some work. The
    *Programmer* object only needs to implement more-specific functionality, as the
    *writeCode* method, while reusing all of the *Person* object''s functionality.


    In classical OOP, classes inherit from other classes, but in JavaScript, since
    there are no classes, objects inherit from other objects.


    When an object inherits from another object, it usually adds new methods to the
    inherited ones, extending the old object. Often, the phrases can be used interchangeably:
    "B inherits from A" and "B extends A". Also, the object inherits can pick one
    or more methods and redefine them, customizing them for its own needs. This way,
    the interface stays the same, the method name is the same, but when called on
    the new object, the method behaves differently. This way of redefining how an
    inherited method is known as *overriding*.'
  merge: -1
