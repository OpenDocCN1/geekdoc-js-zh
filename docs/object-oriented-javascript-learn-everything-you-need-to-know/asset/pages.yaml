  md: '# Chapter 4


    Now you can create different objects using the same constructor:


    ```

    var h1 = new Hero(''Michelangelo'');

    var h2 = new Hero(''Donatello'');

    h1.whoAreYou();

    "I''m Michelangelo and I''m a Ninja"


