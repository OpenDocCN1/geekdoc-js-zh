  md: "# Appendix C\n\nThink of a property descriptor as an object that specifies\
    \ the features of a property. The syntax to describe these features is a regular\
    \ object literal, so property descriptors have properties and methods of their\
    \ own, but let's call them **attributes** to avoid confusion. The attributes are:\n\
    \n+   - value - what you get when you access the property\n- writable - can you\
    \ change this property\n- enumerable - should it appear in for-in\n- configurable\
    \ - can you delete it\n- set() - a function called any time you update the value\n\
    - get() - called when you access the value of the property\n\nFurther, there is\
    \ a distinction between **data descriptors** (you define the properties enumerable,\
    \ configurable, value, and writable) and **accessor descriptors** (you define\
    \ set(), get(), and get()). If you define set() or get(), the descriptor is considered\
    \ an accessor and attempting to define value or writable will raise an error.\n\
    \nDefining a regular old ES3-style property:\n\n```\nvar person = {};\nperson.legs\
    \ = 2;\n```\n\nThe same using an ES5 data descriptor:\n\n```\nvar person = {};\n\
    Object.defineProperty(person, \"legs\", {\n  value: 2,\n  writable: true,\n  configurable:\
    \ true,\n  enumerable: true\n});\n```\n\nThe value of value if set to undefined\
    \ by default, all are false. So, you need to set them explicitly if you want to\
    \ be able to change this property.\n\nOr, the same property using an ES5 accessor\
    \ descriptor:\n\n```\nvar person = {};\nObject.defineProperty(person, \"legs\"\
    , {\n  set: function (v) { this.value = v; },n  get: function (v) { return this.value;\
    \ },\n  configurable: true,\n  enumerable: true\n});\nperson.legs = 2;\n```"
  merge: -1
  pgno: 327
