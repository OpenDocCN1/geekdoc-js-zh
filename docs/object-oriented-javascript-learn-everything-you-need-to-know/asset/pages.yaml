  md: "# Coding and Design Patterns\n\nNow, let's create some publishers. A publisher\
    \ can be any object and its only duty is to call the publish() method whenever\
    \ something important occurs. Here's a blogger object which calls publish() every\
    \ time a new blog post is ready:\n\n```\nvar blogger = {\n  writeBlogPost: function()\
    \ {\n    var content = 'Today is ' + new Date();\n    this.publish(content);\n\
    \  }\n};\n```\n\nAnother object could be the LA Times newspaper which calls publish()\
    \ when a new newspaper issue is:\n\n```\nvar la_times = {\n  newIssue: function()\
    \ {\n    var paper = 'Martians have landed on Earth!';\n    this.publish(paper);\n\
    \  }\n};\n```\n\nTurning these objects into publishers:\n\n```\nobserver.make(blogger);\n\
    observer.make(la_times);\n```\n\nNow, let's have two simple objects jack and jill:\n\
    \n```\nvar jack = {\n  read: function(what) {\n    console.log(\"*I just read\
