    Let''s take an array and experiment with some of these methods:


    +   > var a = [3, 5, 1, 7, ''test'']


    The push() method appends a new element to the end of the array. The pop() method
    removes the last element. a.push(''new'') works like a[a.length] = ''new'' and
    a.pop() is like a.length--.


