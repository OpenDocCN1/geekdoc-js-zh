  md: 'The built-in objects can be divided into three groups:


    +   - **Data objects**: These are Object, Array, Function, Boolean, Number, and
    String. These objects correspond to the different data types in JavaScript. There
    is a data wrapper object for every different value returned by `typeof` (discussed
    in Chapter 2, Primitive Data Types, Arrays, Loops, and Conditions), with the exception
    of "undefined" and "null".


    +   - **Utility objects**: These are Math, Date, and RegExp, and can come in handy.


    +   - **Error objects**: These include the generic `Error` object as well as other
    specific objects that can help you recover your working state when something unexpected
    happens.


    Only a handful of methods of the built-in objects will be discussed in this chapter.
    For a full reference, see Appendix C, Built-in Objects.


    If you''re confused about what a built-in object is and what a built-in constructor
    is, they are the same thing. In a moment, you''ll see how functions, and therefore
    constructor functions, are also objects.


    # Object


    Object is the parent of all JavaScript objects, which means that every object
    you inherits from it. To create a "empty" object, you can use the literal notation
    or the `Object()` constructor function. The following two lines are equivalent:


    ```

    var o = {};nvar o = new Object();

    ```


    As mentioned before, an "empty" (or "blank") object is not completely useless
    because it already contains certain inherited methods and properties. In this
    book, "empty" means an object like `{}` that has no properties of its own other
    than the ones it automatically generates. Let''s see a few of the properties that
    even "blank" objects already have:


    +   - `o.constructor` returns a reference to the constructor function

    - `o.toString()` is a method that returns a string representation of the object

    - `o.valueOf()` returns a single-value representation of the object; often this
    is the object itself


    Let''s see these methods in action. First, create an object:


    ```

    var o = new Object();

    ```'
