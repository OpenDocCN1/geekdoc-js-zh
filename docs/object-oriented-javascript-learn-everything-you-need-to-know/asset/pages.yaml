  md: 'All nodes (this also includes the document node, text nodes, element nodes,
    and attribute nodes) have nodeType, nodeName, and nodeValue properties:


    ```

    document.nodeType;

    ```


    There are 12 type nodes, represented by integers. As you can see, the document
    node type is 9. The most commonly used are 1 (element), 2 (attribute), and 3 (text).


    Nodes also have names. For HTML tags the name is the tag name (tagName property).
    For text nodes, it is #text, and for document nodes the name is as follows:


    ```

    document.nodeName;

    #document"

    ```


    Nodes can also have value. For example, for text nodes the value is the actual
    text. The document node doesn''t have a value which can be seen as follows:


    ```

    document.nodeValue;

    null

    ```


    # documentElement


    Now, let''s move around the tree. XML documents always have one root node that
    wraps the root of the document. For HTML documents, the root is the <html> tag.
    To access the root, you use the documentElement property of the document object:


    ```

    document.documentElement;

    <html>...</html>

    ```


    nodeType is 1 (an element node) which can be seen as follows:


    ```

    document.documentElement.nodeType;

    1

    ```


    For element nodes, both nodeName and tagName properties contain the name of the
    tag, as can be seen in the following output:


    ```

    document.documentElement.nodeName;

    "HTML"

    ```


    ```

    document.documentElement.tagName;

    "HTML"

    ```'
