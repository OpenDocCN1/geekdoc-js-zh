  md: '# Math


    Math is different from the other built-in objects because it cannot be used as
    a

    constructor to create objects. It''s just a collection of static functions and
    constants.

    Some examples to illustrate the differences are as:


    +   > typeof Date.prototype;

    "object"


    +   > typeof Math.prototype;

    "undefined"


    +   > typeof String;

    "function"


    +   > typeof Math;

    "object"


    # Members of the Math object


    | Property/method | Description |

    | --- | --- |

    | Math.E | These are useful math constants, all read-only. Here are their values:
    |

    | Math.LN10 | > Math.E;

    2.71828128459045 |

