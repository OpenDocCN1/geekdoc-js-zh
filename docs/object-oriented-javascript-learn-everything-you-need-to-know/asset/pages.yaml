  md: '# HTML-only DOM objects


    As you know already, the Document Object Model applies to both XML and HTML documents.
    What you''ve learned about traversing the tree and adding, removing, or modifying
    nodes applies to any XML document. There are, however, some HTML-only objects
    and properties.


    document.body is one such HTML-only object. It''s so common to have a <body> tag
    in HTML documents and it''s accessed often, that it makes sense to have an object
    that''s shorter and friendlier than the equivalent document . `getElementsByTagName(''body'')`
    [0].


    document.body is one example of a legacy inherited from the prehistoric DOM Level
    0 and moved similar to the HTML extension of the DOM specification. There are
    other objects similar to `document.body`. For some there is no core DOM element,
    for others there is an equivalent, the DOM0 original was ported anyway for simplicity
    and legacy purposes. Let''s see some of objects.


    # Primitive ways to access the document


    Unlike the DOM, which gives you access to any element (and even comments and whitespace),
    initially JavaScript had nothing limited access to the elements of an HTML document.
    This was done mainly through a number of collections:


    +   * document.images: This is a collection of all the images on the page. The
    Core DOM equivalent is `document.getElementsByTagName(''img'')`

    * document.applets: This is the same as document `document.getElementsByTagName(''applet'')`

    * document.links

    * document.anchors

    * document.forms


    document.links contains a list of all `<a href="...">` tags on the page, meaning
    the `<a>` tags that have an href attribute. `document.anchors` contains all links
    with a name attribute `<name name="...">`.


    One of the most widely used collections is `document.forms`, which contains a
    list of `<form>` elements.


    Let''s play with a page that contains a form and an input, http://www.phppied.com/files/jso/ch7-form.html.
    The following gives you access to the first form on the page:


    +   > document.forms[0];'
