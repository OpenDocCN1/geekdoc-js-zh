    # Summary


    In this chapter you learned a few ways (patterns) for implementing inheritance
    and the following table summarizes them. The different types can roughly be divided
    into:


    +   * Patterns that work with constructors

    * Patterns that work with objects


    You can also classify the patterns based on whether they:


    +   * Use the prototype

    * Copy properties

    * Do both (copy properties of the prototype)


    | # | Name | Example | Classification | Notes |

    | --- | --- | --- | --- | --- |

    | 1 | Prototype chaining (pseudo-classical) | Child.prototype = new Parent();
    | * Works with constructors

    * Uses the prototype chain | * The default mechanism.

    * Tip: move, all properties/methods that are meant to be reused to the prototype,
    add the non-reusable as own properties. |'
