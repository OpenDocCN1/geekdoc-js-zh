  md: "Primitive Data Types, Arrays, Loops, and Conditions\n\n# # Loops\n\nThe if-else\
    \ and switch statements allow your code to take different paths, as if you're\
    \ at a crossroads and decide which way to go depending on a condition. Loops,\
    \ on the other hand, allow your code to take a few roundabouts before merging\
    \ back into the main road. How many repetitions? That depends on the result of\
    \ evaluating a condition before (or after) each iteration.\n\nLet's say you (your\
    \ program execution) is traveling from A to B. At some point, you reach a place\
    \ where you evaluate a condition, C. The result of evaluating C tells you if you\
    \ should go into a loop, L. You make one iteration and arrive at C again. Then,\
    \ you evaluate the condition once again to see if another iteration is needed.\
    \ Eventually, you move on your way to B.\n\n![](img/901612d85bd2f01ce60fcfeb0719ea7c_70_0.png)\n\
    \nAn infinite loop is when the condition is always true and your code gets stuck\
    \ in the loop 'forever'. This is, of course, a logical error, and you should look\
    \ out for such scenarios.\n\nIn JavaScript, there are four types of loops:\n\n\
    +   * while loops\n* do-while loops\n* for loops\n* for-in loops\n\n# # While\
    \ loops\n\nwhile loops are the simplest type of iteration. They look like this:\n\
    \n```\nvar i = 0;\nwhile (i < 10) {\n  i++;\n}\n```"
