  md: "# An example\n\nLet's wrap up the different .phpied.com/files/jsoop/xhr.html\
    \ example. You can visit the page located at http://www.phpied.com/files/jsoop/xhr.html\
    \ to work on the example:\n\nThe main page, xhr.html, is a simple static page\
    \ that contains nothing but three <div> tags.\n\n```\n<div id=\"text\">Text will\
    \ be here</div>\n<div id=\"html\">HTML will be here</div>\n<div id=\"xml\">XML\
    \ will be here</div>\n```\n\nUsing the console, you can write code that requests\
    \ three files and loads their respective contents into each <div>.\n\nThe three\
    \ files to load:\n\n+   - text: a simple text file containing the text \"I am\
    \ a text file\"\n- html: a file containing HTML code \"I am <strong>formatted</strong>/<em>HTML</em></em>\"\
    \n- xml: an XML file, containing the following code:\n\n```\n<?xml version=\"\
    1.0\" ?>\n<root>\n  I'm XML data.\n</root>\n```\n\nAll of the files are stored\
    \ in the same directory as xhr.html.\n\n> For security reasons you can only use\
    \ the original XMLHttpRequest to request files that are on the same domain. However,\
    \ modern browsers support lets cross-domain requests, provided that the appropriate\
    \ Access-Control-Allow-Origin HTTP header is in place.\n\nFirst, let's create\
    \ a function to abstract the request/response part:\n\n```\nfunction request(url,\
    \ callback) {\n  var xhr = new XMLHttpRequest();\n  xhr.onreadystatechange = (function\
    \ (myxhr) {\n    return function () {\n      if (myxhr.readyState === 4 && myxhr.status\
    \ === 200) {\n        callback(myxhr);\n      }\n    }\n  });\n```"
  merge: -1
  pgno: 279
