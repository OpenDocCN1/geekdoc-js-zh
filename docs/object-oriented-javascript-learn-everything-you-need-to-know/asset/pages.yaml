- img_proc: true
  md: "# Coding and Design Patterns\n\nUsing the constructor is given as follows:\n\
    \n```\nvar config = {\n  font: 'Arial, Verdana, sans-serif',\n  color: 'white'\n\
    }\nnew MYAPP.dom.FancyButton('puuush', config);\n```\n\nAnother example is as\
    \ follows:\n\n```\ndocument.body.appendChild('dude', {color: 'red'});\n```\n\n\
    As you can see, it's easy to set only some of the parameters and to switch around\
    \ their order. In addition, the code is friendlier and easier to understand when\
    \ you see the names of the parameters at the same place where you call the method.\n\
    \nA drawback of this pattern is the same as its strength. It's trivial to keep\
    \ adding more parameters, which means trivial to abuse the technique. Once you\
    \ have an excuse to add to this free-all-bag of properties, you will find it to\
    \ keep adding some that are not entirely optional or some that are dependent on\
    \ other properties.\n\nAs a rule of thumb, all properties should be independent\
    \ and optional. If you have to check all possible combinations inside your function\
    \ ('oh, A is set, but A is only used if B is also set') this is a recipe for a\
    \ large function body, which quickly becomes confusing and difficult, if not impossible,\
    \ to test, because of all the combinations.\n\n# Private properties and methods\n\
    \nJavaScript doesn't have the notion of access modifiers, which settle the privileges\
    \ of the properties in an object. Other languages often have access modifiers\
    \ such as:\n\n+   * Public - all users of an object can access these properties\
    \ (or methods)\n* Private - only the object itself can access these properties\n\
    * Protected - only objects inheriting the object in question can access these\
    \ properties\n\nJavaScript doesn't have a special syntax to denote private properties\
    \ or methods, as discussed in Chapter 3, Functions, you can use local variables\
    \ and methods inside a function and achieve the same level of protection."
