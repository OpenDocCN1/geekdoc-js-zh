  md: "# Functions are data\n\nFunctions in JavaScript are actually data. This is\
    \ an important concept that we'll need later on. This means that you can create\
    \ a function and assign it to a variable:\n\n```\nvar f = function () {\n  return\
    \ 1;\n};\n```\n\nThis way of defining a function is sometimes referred to as function\
    \ literal notation.\n\nThe part function () { return 1; } is a function expression.\
    \ A function expression can optionally have a name, in which case it becomes a\
    \ named function expression (NFE). So, this is also allowed, although rarely seen\
    \ in practice (and causes IE to mistakenly create two variables in the enclosing\
    \ scope: f and myFunc:\n\n```\nvar f = function myFunction() {\n  return 1;\n\
    };\n```\n\nAs you can see, there is no difference between a named function expression\
    \ and a function declaration. But they are, in fact, different. The only way to\
    \ distinguish between the two is to look at the context in which they are used.\
    \ Function declarations may only appear in program code (a body of another function\
    \ or in the main program). You'll see many more examples of functions later in\
    \ the book that will clarify these concepts.\n\nWhen you use the typeof operator\
    \ on a variable that holds a function value, it returns the string \"function\"\
    :\n\n```\n> function define() {\n  return 1;\n}\n```\n\n```\n> var express = function\
    \ () {\n  return 1;\n}\n```\n\n```\n> typeof define;\n\"function\"\n```\n\n```\n\
    > typeof express;\n\"function\"\n```"
