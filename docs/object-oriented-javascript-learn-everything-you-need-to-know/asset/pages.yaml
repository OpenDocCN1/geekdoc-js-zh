- img_proc: true
  md: 'In this example, the first &lt;script&gt; tag includes an external file, `somefile.js`,
    which contains JavaScript code. The second &lt;script&gt; tag includes the JavaScript
    code directly in the HTML code of the page. The browser executes the JavaScript
    code in the sequence it finds on the page and all the code in all tags share the
    same global namespace. This means that when you define a variable in `somefile.js`,
    it also exists in the second &lt;script&gt; block.


    # BOM and DOM – an overview


    The JavaScript code in a page has access to a number of objects. These objects
    can be divided into the following:


    +   - Core ECMAScript objects: All the objects mentioned in the previous chapters

    - DOM: Objects that have to do with the currently loaded page (the page is also
    called the document)

    - BOM: Objects that deal with everything outside the page (the browser window
    and the desktop screen)


    DOM stands for Document Object Model and BOM for Browser Object Model.

    The DOM is a standard, governed by the World Wide Consortium (W3C) and has different
    versions, levels, called as DOM Level 1, DOM Level 2, and so on. Browsers in use
    today have different degrees of compliance with the standard but in general, they
    almost completely implement DOM Level 1. The DOM was standardized post-factum,
    after the browser vendors had implemented their own ways to access the document.
    The legacy part (from before the W3C took over) is still around and is referred
    to as DOM 0 although no real DOM 0 standard exists. Some parts of DOM 0 have de-facto
    standards as all major browsers support them. Some of these were added to DOM
    Level 1 to DOM 1 is lower browser-specific and won''t be discussed.


    BOM historically has not been a part of any standard. Similar to DOM 0, it has
    a subset of objects that is supported by all major browsers, and another subset
    that is browser-specific. The HTML5 standard codifies common behavior among browsers,
    and includes common BOM objects. Additionally, mobile devices come with their
    specific objects (and HTML5 aims to standardize those as well) which traditionally
    have not been necessary for desktop computers, but make sense in a mobile world,
    for example, geolocation, camera access, vibration, touch events, telephony, and
    SMS.'
