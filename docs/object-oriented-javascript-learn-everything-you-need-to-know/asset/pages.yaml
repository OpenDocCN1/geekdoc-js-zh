- img_proc: true
  md: '# Coding patterns


    Let''s start with some patterns that reflect JavaScript''s unique features. Some
    patterns aim to help you organize your code (for example, namesacing), others
    are related to improving performance (such as lazy definitions and init-time branching),
    and some make up for missing features such as private properties. The patterns
    discussed in this section include:


    +   * Separating behavior

    * Namespaces

    * Init-time branching

    * Lazy definition

    * Configuration objects

    * Private variables and methods

    * Privileged methods

    * Private functions as public methods

    * Immediate functions

    * Chaining

    * JSON


    # Separating behavior


    As discussed previously, the three building blocks of a web page are as follows:


    +   * Content (HTML)

    * Presentation (CSS)

    * Behavior (JavaScript)


    # Content


    HTML is the content of the web page, the actual text. Ideally, the content should
    be marked up using the least amount of HTML tags that sufficiently describe the
    semantic meaning of content. For example, if you''re working on a navigation menu
    it''s a good idea to use `<ul>` and `<li>` since a navigation menu is in essence
    just a list of links.'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'Your content (HTML) should be free from any formatting elements. Visual formatting
    belongs to the presentation layer and should be achieved through the use of Cascading
    Style Sheets (CSS). This means the:


    +   - style attribute of HTML tags should not be used, if possible.

    - Presentational HTML tags such as <font> should not be used at all.

    - Tags should be used for their semantic meaning, for instance, because of how
    browsers render by default. For instance, developers sometimes use a <div> tag
    where a <p> would be more appropriate. It is also favorable to use <strong> and
    <em> instead of <b> and <i> as the latter describe the visual presentation rather
    than the meaning.


    # Presentation


    A good approach to keep presentation of the content is to reset, or nullify all
    defaults. For example, using reset.css for the Yahoo! UI library. This way the
    browser''s default rendering won''t distract you from consciously thinking about
    the proper semantic tags to use.


    # Behavior


    The third component of a web page is the behavior. Behavior should be kept separate
    from both the content and the presentation. Behavior is usually added by JavaScript
    that is isolated to <script> tags, and preferably contained in external files.
    This means not using any inline attributes such as onclick, onmouseover, and so
    on. Instead, you can use the addEventListener/attachEventListener methods from
    the previous chapter.


    The best strategy for separating behavior from content is as follows:


    +   - Minimize the number of <script> tags

    - Avoid inline event handlers

    - Do not use CSS expressions

    - Dynamically add markup that has no purpose if JavaScript is disabled by the
    user

    - Towards the end of your content when you are ready to close the <body> tag,
    insert a single external.js file'
