  md: '# Object-oriented JavaScript


    In order to bring up the console in Chrome or Safari, right-click anywhere on
    a page and select **Inspect Element**. The additional window that shows up is
    the Web Inspector feature. Select the **Console** tab and you''re ready to go.


    You type code directly into the console, and when you press *Enter*, your code
    is executed. The return value of the code is printed in the console. The code
    is executed in the context of the currently loaded page, for example, if you type
    `location.href`, it will return the URL of the current page.


    The console also has an autocomplete feature. It works similar to the normal command
    prompt line in your operating system. Doc, for example, you type `doc` and hit
    the *Tab* key or the right arrow key, `doc` will be autocompleted to document.
    If you type `. (the dot operator), you can iterate through all the properties
    and methods you can find on the document object.


    By using the up and down arrow keys, you can go through the list of already executed
    commands and bring them back in the console.


    The console gives you only one line to type in, but you can execute several JavaScript
    statements by separating them with semicolons. If you type more lines, you press
    *Shift + Enter* to go to a new line without executing the result just yet.


    # # JavaScriptCore on a Mac


    On a Mac, you don''t actually need a browser; you can explore JavaScript directly
    from your command **Terminal** application.


    If you''ve never used **Terminal**, you can simply search for it in the Spotlight
    search. Once you''ve launched it, type:


    ```

    alias jsc=''/System/Library/Frameworks/JavaScriptCore.framework/Versions/Current/Resources/jsc''

    ```


    This command makes an alias to the little `jsc` application, which stands for
    "JavaScriptCore" and is part of the WebKit engine. JavaScriptCore is shipped together
    with Mac operating systems.


    You can add the alias line shown previously to your `~/.profile` file so that
    jsc is always there when you need it.


    Now, in order to start the interactive shell, you simply type `jsc` from any directory.
    Then you can type JavaScript expressions, and when you hit *Enter*, you''ll see
    the result of the expression.'
