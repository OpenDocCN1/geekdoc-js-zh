    # JSON


    The JSON object is new to ES5. It''s not a constructor (similarly to Math) and
    has only two methods: parse() and stringify(). For ES3 browsers that don''t support
    JSON natively, you can use the "shim" from http://json.org.


    JSON stands for JavaScript Object Notation. It''s a lightweight data interchange
    format. It''s a subset of JavaScript that only supports primitives, object literals,
    and array literals.'
