  md: "# Uber – access to the parent from a child object\n\nClassical OO languages\
    \ usually have a special syntax that gives you access to the parent class, also\
    \ referred to as superclass. This could be convenient when a child wants to have\
    \ a method that does everything the parent's method plus something in. In such\
    \ cases, the child calls the parent's method with the same name and JavaScript\
    \ works with the result.\n\nIn JavaScript, there is no such special syntax, but\
    \ it's trivial to achieve the same functionality. Let's rewrite the last example\
    \ and, while taking care of inheritance, create an uber property that points to\
    \ the parent's prototype object.\n\n```\nfunction Shape() {\n  // augment prototype\n\
    \  Shape.prototype.name = 'Shape';\n  Shape.prototype.toString = function () {\n\
    \    var const = this.constructor;\n    return const.uber.toString() + ', ' +\
    \ this.name;\n  };\n}\n\nfunction TwoShape() {\n  // take care of inheritance\n\
    \  var F = function () {};\n  F.prototype = Shape.prototype;\n  TwoShape.prototype\
    \ = new F();\n  TwoShape.prototype.constructor = TwoShape;\n  TwoShape.uber =\
    \ Shape.prototype;\n  // augment prototype\n  TwoShape.prototype.name = '2D shape';\n\
    }\n\nfunction Triangle(side, height) {\n  this.side = side;\n  this.height = height;\n\
    }\n\n// take care of inheritance\n  var F = function () {};\n  F.prototype = TwoShape.prototype;\n\
    \  Triangle.prototype = new F();\n  Triangle.prototype.constructor = Triangle;\n\
    \  Triangle.uber = TwoShape.prototype;\n```"
