  md: '# Chapter 4


    A regular expression consists of:


    +   - A pattern you use to match

    - Zero or more modifiers (also called flags) that provide more instructions on
    how the pattern should be matched verbatim, but that''s rare


    The pattern can be as literal as literal text to be matched verbatim, but that''s
    rare, and in such cases you''re better off using indexOf(). Most of the time,
    the pattern is more complex and could be difficult to understand. Mastering regular
    expression''s patterns is a large topic, which won''t be discussed in full detail
    here; instead, you''ll see what RegExp provides in terms of syntax, objects, and
    methods in order to support the use of regular expressions. You can also refer
    to Appendix D, Regular Expressions, to help you when you are writing patterns.


    JavaScript provides the RegExp constructor, which allows you to create expression
    objects:


    ```

    var re = new RegExp(`j.*t`);

    ```


    There is also the common regexp literal notation:


    ```

    var re = /j.*t/;

    ```


    In the preceding example, j.*t is the regular expression pattern. It means "match
    any string that starts with j, ends with t, and has zero or more characters in
    between". The asterisk (*) means "zero or more of the preceding"; the dot means
    "any character". The pattern needs to be quoted when passed to a RegExp() constructor.


    # Properties of RegExp objects


    Regular expression objects have the following properties:


    +   - global: If this property is false, which is the default, the search stops
    when the first match is found. Set this to true if you want all matches.

    - ignoreCase: When the match is case insensitive, the defaults to false (meaning
    the default is a case sensitive).

    - multiline: Search matches that may span over more than one line to false.

    - lastIndex: The position at which to start the search; this defaults to 0.

    - source: Contains the regexp pattern.


    None of these properties, except lastIndex, can be changed once the object has
    been created.


    [139 ]'
