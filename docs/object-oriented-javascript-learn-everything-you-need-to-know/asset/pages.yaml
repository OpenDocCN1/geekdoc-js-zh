  md: '# window.setTimeout() and window.setInterval()


    setTimeout() and setInterval() allow for scheduling the execution of a piece of
    code. setTimeout() attempts to execute the given code once after a specified number
    of milliseconds. setInterval() attempts to execute it repeatedly after a specified
    number of milliseconds has passed.


    This shows an alert after approximately 2 seconds (2000 milliseconds):


    +   > function boo() { alert(''Boo!''); }

    > setTimeout(boo, 2000);

    > 4


    As you can see the function returned an integer (in this case 4) representing
    the ID of the timeout. You can use this ID to clear the timeout using clearTimeout().
    In the following example, if you are quick enough, and clear the timeout before
    2 seconds pass, the alert will never be shown as you can see in the following
    code:


    +   > var id = setTimeout(boo, 2000);

    > clearTimeout(id);


    Let''s change boo() to to something less intrusive as follows:


    +   > function boo() { console.log(''boo''); }


    Now, using setInterval() you can schedule boo() to execute every two seconds,
    until you cancel the scheduled execution with clearInterval():


    +   > var id = setInterval(boo, 2000);

    > boo

    > boo

    > boo

    > boo

    > boo

    > boo


    +   > clearInterval(id);


    Note, that both functions accept a pointer to a callback function as a first parameter.
    They can also accept a string which is evaluated with eval() as you know, eval()
    is evil, so it should be avoided. And what if you want to pass arguments to the
    function? In such cases, you can just wrap the function call inside another function.


    The following code is valid, but not recommended:


    ```

    // bad idea

    var id = setInterval("alert(''boo'', boo)", 2000);

    ```'
