  md: "Before using this function, bear in mind that it blocks the browser thread,\
    \ meaning that no other code will be executed until the user closes the alert.\
    \ If you have a busy Ajax-type application, it's generally not a good idea to\
    \ use alert().\n\n# Scope of variables\n\nIt's important to note, especially if\
    \ you have come to JavaScript from another language, that variables in JavaScript\
    \ are not defined in a block scope, but in a function scope. This means that if\
    \ a variable is defined inside a function, it's not visible outside of the function.\
    \ However, if it's defined inside an if or for a code block, it's visible outside\
    \ the block. The term \"global variables\" describes variables you define outside\
    \ of any function (in the global program code), as opposed to \"local variables\"\
    , which are defined inside a function. The code inside a function has access to\
    \ all global variables as well as to its own local ones.\n\nIn the next example:\n\
    \n+   - The f() function has access to the global variable\n- Outside the f()\
    \ function, the local variable doesn't exist\n\n```\nvar global = 1;\nfunction\
