    The name of the property .uber could have been ''superclass'' but this would suggest
    that JavaScript has classes. Ideally it could have been ''super'' (as in Java),
    but ''super'' is a reserved word in JavaScript. The German word ''uber'' suggested
    by Douglas Crockford, means more or less the same as ''super'' and you have to
    admit, it sounds uber-cool.


    # Isolating the inheritance part into a function


    Let''s move the code that takes care of all the inheritance details from the last
    example into a reusable extend() function:


    ```

    function extend(Child, Parent) {

    var F = function () {};

    F.prototype = Parent.prototype;

    Child.prototype = new F();

    Child.prototype.constructor = Child;

    Child.uber = Parent.prototype;

    }

    ```'
