  md: '# Chapter 4


    No matter how the array is created, you can add elements to it as usual:


    ```

    > a[0] = 1;

    > a[1] = 2;


    > a;

    [1, 2]

    ```


    When using the Array() constructor, you can also pass values that will be assigned
    to the new array''s elements:


    ```

    > var a = new Array(1, 2, 3, ''four'');

    > a;

    [1, 2, 3, "four"]

    ```


    An exception to this is when you pass a single number to the constructor. In this
    case, the number is considered to be the length of the array:


    ```

    > var a2 = new Array(5);

    > a2;

    [undefined x5]

    ```


    Because arrays are created with a constructor, does this mean that arrays are
    in fact objects? Yes, and you can verify this using the typeof operator:


    ```

    > typeof [1, 2, 3];

    "object"

    ```


    Arrays are objects, this means they inherit the properties and methods of the
    parent Object:


    ```

    > var a = [1, 2, 3, ''four''];

    > a.toString();

    "1,2,3,four"

    ```


    ```

    > a.valueOf();

    [1, 2, 3, "four"]


    > a.constructor;

    function Array() { [native code ]

    ```


    Arrays are objects, but of a special type because:


    +   * The names of their properties are automatically assigned using numbers starting
    from 0

    * They have a length property that contains the number of elements in the array
    in addition to those inherited from the parent

    * They have more built-in methods than those inherited from the parent Object


