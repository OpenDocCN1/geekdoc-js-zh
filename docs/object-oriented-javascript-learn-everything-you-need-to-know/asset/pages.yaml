- img_proc: true
  md: '# Object-oriented JavaScript


    There''s a difference between JavaScript and the "classic" OO languages such as
    C++ and Java. You should be aware right the start that in JavaScript, there are
    no classes; everything is built on objects. JavaScript has the notion of prototypes,
    there are also objects (we''ll discuss them later in detail). In a classic OO
    language, you''d say something like "create a new object Bob, which is of class
    Person". In a prototype OO language, you say, "I''m going to take this object
    Bob''s Dad that I have lying around (on the couch in front of the TV?) and reuse
    it as a prototype for a new object that I''ll call Bob".


    # Encapsulation


    Encapsulation is another OO-related concept, which illustrates the fact that an
    object contains (encapsulates) both:


    +   * Data (stored in properties)

    * The means to do something with the data (using methods)


    One other that goes with encapsulation is information hiding. This is a rather
    broad term and can mean different things, but let''s see what people usually mean
    when they use it in the context of OOP.


    Imagine an object, say an MP3 player. You, as the user of the object, are given
    some interface to work with, such as buttons, and so on. You use the interface
    in order to get the object to do something useful for you, like play a song. How
    exactly the device is working on the inside, you don''t know, and, most often,
    don''t care. In other words, the implementation of the interface is hidden from
    you. The thing happens in OOP when you code the object yourself or it comes from
    some third-party library; your code doesn''t need to know internally. In compiled
    languages, you can''t actually read the code that makes an object work. In JavaScript,
    because it''s an interpreted language, you can see the source code, but the concept
    is still the same – you work with the object''s interface, without worrying about
    its implementation.


    Another aspect of hiding is the visibility of methods and properties. In some
    languages, objects can have public, private, and protected methods and properties.
    This categorization defines the level of access the users of the object have.
    For example, only the methods of the same object have access to the private methods,
    while anyone has access to the public ones. In JavaScript, all methods and properties
    are public, but we''ll see that there are ways to protect the data inside an object
    and achieve privacy.'
  merge: -1
