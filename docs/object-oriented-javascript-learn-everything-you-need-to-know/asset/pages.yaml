    \ {\n  var arr = [], i;\n  for (var i = 0; i < 3; i++) {\n    arr[i] = (function\
    \ (x) {\n      return function () {\n        return x;\n      };\n    })(i);\n\
    \  }\n  return arr;\n}\n```\n\nThis gives you the expected result:\n\n> > var\
