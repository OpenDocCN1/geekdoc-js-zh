  md: "# Callback functions\n\nBecause a function is just like any other data assigned\
    \ to a variable, it can be defined, copied, and also passed as an argument to\
    \ other functions.\n\nHere is an example of a function that accepts two functions\
    \ as parameters, executes them, and returns the sum of what each them returns:\n\
    \n```\nfunction invokeAdd(a, b) {\n  return a() + b();\n}\n```\n\nNow let's define\
    \ two simple additional functions (using a function declaration pattern) that\
    \ only return hardcoded values:\n\n```\nfunction one() {\n  return 1;\n}\n```\n\
    \n```\nfunction two() {\n  return 2;\n}\n```\n\nNow you can pass those functions\
    \ to the original function, invokeAdd(), and get the result:\n\n+   > invokeAdd(one,\
    \ two)\n3\n\nAnother example of passing a function as a parameter is to use anonymous\
    \ functions (function expressions). Instead of defining one() and two(), you can\
    \ simply do the following:\n\n+   > invokeAdd(function () { return 1; }, function\
    \ () { return 2; });\n3\n\nOr, you can make it more readable in the following\
    \ code:\n\n```\n> invokeAdd(\n  function () { return 1; },\n  function () { return\
    \ 2; })\n3\n```"
