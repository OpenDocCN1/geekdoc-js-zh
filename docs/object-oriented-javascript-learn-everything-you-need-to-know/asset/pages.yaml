  md: "# Coding and Design Patterns\n\nNow, you can replace the if functions with\
    \ a simpler code as follows:\n\n```\nvar image = MYAPP.dom.factory(\"Image\",\
    \ url);\nimage.insert(document.body);\n```\n\nThe example factory() method in\
    \ the previous code was simple, but in a real life scenario you'd want to do some\
    \ validation against the type value (for example, check if MYAPP.dom[type] exists\
    \ and optionally do some setup work common to all object types (for example, setup\
    \ the URL all constructors use).\n\n# Decorator\n\nThe Decorator design pattern\
    \ is a structural pattern: how objects are created but rather their functionality\
    \ is extended. Instead of using inheritance you extend in a linear way (parent-child-grandchild),\
    \ you can have one base object and a pool of decorator objects that provide extra\
    \ functionality. Your program can pick and choose decorators it wants and in order.\
    \ For a different program or code page, you might have a different set of requirements\
    \ and pick different decorators out of the same pool. Take a look at how the usage\
    \ part of the decorator pattern could be implemented:\n\n```\nvar obj = {\n  doSomething:\
    \ function () {\n    console.log('sure', asap);\n  }\n  // // ...\n};\nobj = obj.getDecorator('decol');\n\
    obj = obj.getDecorator('deco3');\nobj = obj.getDecorator('deco5');\nobj.doSomething();\n\
    ```\n\nYou can see how you can start with a simple object that has a doSomething()\
    \ method. Then you can pick one of the decorator objects you have lying around\
    \ and can be identified by name. All decorators provide a doSomething() method\
    \ which first calls the base method of the previous decorator and proceeds with\
    \ its own code. Every time you add a decorator, you overwrite the base obj- with\
    \ an improved version of it. At the end, when you are finished adding decorators,\
    \ you call doSomething(). As a result all of the doSomething() methods of all\
    \ the decorators are executed in sequence. Let's see an example."
