    # eval()


    eval() takes a string input and executes it as a JavaScript code:


    ```

    > eval(''var ii = 2'');

    > ii;

    2

    ```


    So, eval(''var ii = 2;'') is the same as var ii = 2.


    eval() can be useful, but should be avoided if there are other options. Most of
    the time there are alternatives, and in most cases the alternatives are elegant
    and easier to write and maintain. "Eval is evil" is a mantra you can often hear
    from seasoned JavaScript programmers. The drawbacks of using eval() are:


    +   - Security – JavaScript, which also means it can cause damage. If you don''t
    trust the source of the input you pass to eval(), don''t use it.

    - Performance – It''s slower to evaluate "live" code than to have the code directly
    in the script.


    # A bonus – the alert() function


    Let''s talk about another function–alert(). It''s not part of the core JavaScript
    (it''s nowhere to be found in the ECMA specification), but it''s provided by the
    host environment–the browser. It shows a string of text in a message box. It can
    also be used as a primitive debugging tool, although the debuggers in modern browsers
    are better suited for this.


    Here''s a screenshot showing the result of executing the code alert("hello!"):


    ![](img/901612d85bd2f01ce60fcfeb0719ea7c_85_0.png)


