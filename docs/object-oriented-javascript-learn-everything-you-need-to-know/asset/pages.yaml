    \ the following elements:\n\n+   - The Browser Object Model (BOM)\n- The Document\
    \ Object Model (DOM)\n- Browser events\n- The XMLHttpRequest object\n\n# Including\
    \ JavaScript in an HTML page\n\nTo include JavaScript in an HTML page, you need\
    \ to use the `<script>` tag as follows:\n\n```\n<!DOCTYPE>\n<html>\n<head>\n \
    \ <title>JS test</title>\n  <script src=\"somefile.js\"></script>\n</head>\n<body>\n\
