    \ of zero or more expressions enclosed in curly brackets:\n\n```\n{\n    var a\
    \ = 1;\n    var b = 3;\n}\n```\n\nYou can nest blocks within each other indefinitely:\n\
    \n```\n{\n    var a = 1;\n    var b = 3;\n    var c, d;\n    c = a + b;\n}\n```"
