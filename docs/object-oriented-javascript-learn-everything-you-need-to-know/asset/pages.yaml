  md: "The Triangle constructor takes three point objects and assigns them to this.points\n\
    (its own collection of points). Then it implements the getArea() method, using\n\
    Heron's formula:\n\n```\nArea = s(s-a) (s-b) (s-c)\n```\n\ns is the semi-perimeter\
    \ (perimeter divided by two).\nNext, comes the Rectangle constructor. It receives\
    \ one point (the upper-left point)\nand the lengths of the two sides. Then, it\
    \ populates its points array starting from\nthat one.\n\n```\nfunction Rectangle(p,\
    \ side_a, side_b) {\n  this.points = [\n    p,\n    new Point(p.x + side_a, p.y),//\
    \ top right\n    new Point(p.x + side_a, p.y + side_b), // bottom right\n    new\
    \ Point(p.x, p.y + side_b)// bottom left\n  ];\n  this.getArea = function () {\n\
    \    return side_a * side_b;\n  };\n}\n```\n\nThe last constructor is Square.\
    \ A square is a special case of a rectangle, so\nit makes sense to reuse Rectangle.\
    \ The easiest thing to do here is to borrow the\nconstructor.\n\n```\nfunction\
    \ Square(p, side) {\n  Rectangle.call(this, p, side, side);\n}\n```\n\nNow that\
    \ all constructors are done, let's take care of inheritance. Any pseudo-\nclassical\
    \ pattern (one that works with constructors as opposed to objects) will do.\n\
