  md: '# Summary


    Let''s summarize the most important topics you have learned in this chapter:


    +   * All functions have a property called `prototype`. Initially it contains
    an "empty" object (an object without any own properties).

    * You can add properties and methods to the prototype object. You can even replace
    it completely with an object of your choice.

    * When you create an object using a function as a constructor (with `new`), the
    object gets a secret link pointing to the prototype of the constructor, and can
    access the prototype''s properties.

    * An object''s own properties take precedence over a prototype''s properties with
    the same name.

    * Use the method `hasOwnProperty()` to differentiate between an object''s properties
    and prototype properties.

    * There is a prototype chain. When you execute `foo.bar`, if your object `foo`
    does not have a property called `bar`, the JavaScript interpreter looks for a
    `bar` property in the prototype. If not found, it keeps searching in the prototype''s
    prototype, then the prototype of the prototype, and it will keep going all the
    way up to `Object.prototype`.

    * You can augment the properties of built-in constructor functions and all objects
    will see your additions. Assign a function to `Array.prototype.flip` and all arrays
    will immediately get a `flip()` method, as in `[1,2,3].flip()`. But do check if
    the method/property you want to add already exists, so you can future-proof your
    scripts.


    # Exercises


    +   1. Create an object `shape` that has the type `property` and a `getType()`
    method.

    2. Define a `Triangle()` constructor function whose prototype is `shape`. Objects
    created with `Triangle()` should have three properties – `a`, `b`, and `c`, representing
    the lengths of the sides of a triangle.

    3. Add a new method to the prototype called `getPerimeter()`.'
