  md: '# # Prototype


    In this chapter, you''ll learn about the prototype property of the function objects.
    Understanding how the prototype works is an important part of learning the JavaScript.
    JavaScript is often classified as having a prototype-based object model. There''s
    nothing particularly difficult about the prototype, but it''s a new concept, and
    as much may sometimes take a bit of time to sink in. Like closures (see Chapter
    3, Functions), the prototype is one of those things in JavaScript, which once
    you "get", you''re strongly encouraged to type in and play around with the examples
    — this makes it much easier to learn and remember the concepts.


    The following topics are discussed in this chapter:


    +   * Every function has a prototype property and it contains an object

    * Adding properties to the prototype object

    * Using the properties added to the prototype

    * The difference between own properties and properties of the prototype

    * proto_ the secret link every object keeps to its prototype

    * Methods such as isPrototypeOf(), hasOwnProperty(), and propertyIsEnumerable()

    * Enhancing built-in objects, such as arrays or strings (and why that can be a
    bad idea)'
  merge: -1
