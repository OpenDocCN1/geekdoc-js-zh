  md: "# Prototype\n\nThere are a few details to be aware of:\n\n+   - Not all properties\
    \ show up in a for-in loop. For example, the length (for arrays) and constructor\
    \ properties don't show up. The properties that do show up are called enumerable.\
    \ You can check which ones are enumerable with the help of the propertyEnumerable()\
    \ method that every object provides. In ESS, you can specify which properties\
    \ are enumerable, while in ES3 you don't have control.\n- Prototypes that come\
    \ through the prototype chain also show up, provided they are enumerable. You\
    \ can check if a property is an object's property or a prototype's property using\
    \ the hasOwnProperty() method.\n- propertyEnumerable() returns false for all of\
    \ the prototype's properties, even those that are enumerable and show up in the\
    \ for-in loop.\n\nLet's see these in action. This simplified version of Gadget():\n\
    \n```\nfunction Gadget(name, color) {\n  this.name = name;\n  this.color = color;\n\
    \  this.getName = function () {\n    return this.name;\n  };\n  Gadget.prototype.price\
    \ = 100;\n  Gadget.prototype.rating = 3;\n}\n```\n\nCreate a new object as:\n\n\
    ```\nvar newtoy = new Gadget('webcam', 'black');\n```\n\nNow, if you loop using\
    \ a for-in loop, you see all of the object's properties, including those that\
    \ come from the prototype:\n\n```\nfor (var prop in newtoy) {\n  console.log(prop\
    \ + ' = ' + newtoy[prop]);\n}\n```\n\nThe result also contains the object's methods\
    \ (since methods are just properties that happen to be functions):\n\n```\nname\
    \ = webcam\ncolor = black\ngetName = function () {\n  return this.name;\n}\nprice\
    \ = 100\nrating = 3\n```"
