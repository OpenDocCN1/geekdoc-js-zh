    [3, 5, 1, 7, ''new'']


    +   > a.pop()


    "new"


    +   > a;


    [3, 5, 1, 7, ''test'']


    The sort() method sorts the array and returns it. In the next example, after the
    sort, both a and b point to the same array:


    +   > var b = a.sort();


