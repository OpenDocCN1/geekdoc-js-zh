  md: "# The Browser Environment\n\ndocument.domain gives you access to the domain\
    \ name of the currently loaded page. This is commonly used when you need to perform\
    \ so-called domain relaxation. Imagine your page is www.yahoo.com and inside it\
    \ you have an iframe hosted on music.yahoo.com subdomain. These are separate domains\
    \ so the browser's security restrictions won't allow the page and the iframe to\
    \ communicate. To resolve you can set document.domain on both pages to yahoo.com\
    \ and you'll be able to talk to each other.\n\nNote, that you can only set the\
    \ domain to a less-specific one, for example, you can change yours to .yahoo.com\
    \ to yahoo.com, but you cannot change yahoo.com or any other non-yahoo domain.\n\
    \n+   > document.domain;\n  \"www.yahoo.com\"\n\n+   > document.domain = 'yahoo.com';\n\
    \  \"yahoo.com\"\n\n+   > document.domain = 'www.yahoo.com';\n  Error:SecurityError:\
    \ DOM Exception 18\n\n+   > document.domain = 'www.example.org';\n  Error:SecurityError:\
    \ DOM Exception 18\n\nPreviously in this chapter, you saw the window.location\
    \ object. Well, the same functionality is also available as document.location:\n\
    \n+   > window.location === document.location;\n  true\n\n# Events\n\nImagine\
    \ you are listening to a radio program and they announce, \"Big event! Huge! Aliens\
    \ have landed on Earth!\" You might think \"Yeah, whatever\", some other listeners\
    \ might think \"They come in peace\" and \"We're all gonna die!\" Similarly, the\
    \ browser broadcasts events and your code could be notified should it decide to\
    \ tune in and listen to the events as they happen. Some example events include:\n\
    \n+   * The user clicks a button"
