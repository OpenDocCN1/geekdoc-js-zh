  md: "# Primitive Data Types, Arrays, Loops, and Conditions\n\nThe most widely used\
    \ for loop pattern is:\n\n+   - In the initialization part, you define a variable\
    \ (or set the initial value of an existing variable), most often called i\n- In\
    \ the condition part, you compare i to a boundary value, like i < 100\n- In the\
    \ increment part, you increase i by 1, like i++\n\nHere's an example:\n\n```\n\
    var punishment = '';\nfor (var i = 0; i < 100; {\n    punishment += 'I will never\
    \ do this again,';\n}\n```\n\nAll parts (initialization, condition, and increment)\
    \ can contain multiple expressions separated by commas. Say you want to rewrite\
    \ the example and define the variable punishment inside the initialization part\
    \ of the loop:\n\n```\nfor (var i = 0, punishment = ''; i < 100; {\n    punishment\
    \ += 'I will never do this again,';\n}\n```\n\nCan you move the body of the loop\
    \ inside the increment part? Yes, you can, especially as it's a one-liner. This\
    \ gives you a loop that looks a bit awkward, as it has no body. Note that this\
    \ is just an intellectual exercise; it's not recommended that you write awkward-looking\
    \ code:\n\n```\nfor {\n    var i = 0, punishment = '';\n    i < 100;\n    i++,\
    \ punishment += 'I will never do this again, ';\n\n    // nothing here\n}\n```\n\
    \nThese three parts are all optional. Here's another way of rewriting the same\
    \ example:\n\n```\nvar i = 0, punishment = '';\nfor (;;) {\n    punishment +=\
    \ 'I will never do this again, ';\n    if (++i == 100) {\n        break;\n   \
    \ }\n}\n```"
