    \n```\nGadget.prototype.get = function (what) {\n  return this[what];\n}\n```\n\
    \nEven though newtoy was created before the get () method was defined, newtoy\
    \ still has access to the new method:\n\n+   > newtoy.get('price');\n100\n\n+\
    \   > newtoy.get('color');\n`black`**\n\n# Object properties versus prototype\
    \ properties\n\nIn the preceding example, getInfo() was used to access the properties\
    \ of the object. It could also use Gadget.prototype to achieve the same output.\n\
    \n```\nGadget.prototype.getInfo = function () {\n  return 'Rating: ' + Gadget.prototype.rating\
    \ + \n  ', price: ' + Gadget.prototype.price;\n}\n```\n\nWhat's the difference?\
    \ To answer this question, let's examine how the prototype works in more detail."
