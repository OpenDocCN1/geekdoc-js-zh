    \ In this case, it's not\nary to have a new instance for each child–they can all\
    \ share it.\n\n```\n(function () {\n  var s = new Shape();\n  Triangle.prototype\
    \ = s;\n  Rectangle.prototype = s;\n  Square.prototype = s;\n})();\n```"
