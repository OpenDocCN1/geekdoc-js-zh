  md: "# Calling an object's methods\n\nYou know a method is just a property that\
    \ happens to be a function, so you access methods the same way as you would access\
    \ properties: the dot notation or using square brackets. Calling (invoking) a\
    \ method is the same as calling any other function: you just add parentheses after\
    \ the method name, which effectively says \"Execute!\".\n\n```\nvar hero = {\n\
    \  breed: 'Turtle',\n  occupation: 'Ninja',\n  say: function () {\n    return\
    \ 'I am ' + hero.occupation;\n  }\n};\nhero.say();\n\"I am Ninja\"\n```\n\nIf\
    \ there are any parameters that you want to pass to a method, you proceed as with\
    \ normal functions:\n\n```\nhero.say('a', 'b', 'c');\n```\n\nBecause you use the\
    \ array-like square brackets to access a property, this means you can also use\
    \ brackets to access and invoke methods:\n\n```\nhero['say']();\n```\n\nThis is\
    \ not a common practice unless the method name is not known at the time of writing\
    \ code, but is instead defined at runtime\n\n```\nvar method = 'say';\nhero[method]();\n\
    ```\n\n> Best practice tip: no quotes (unless you have to)\nUse the dot notation\
    \ to access methods and properties and don't quote properties in your object literals.\n\
    \n# Altering properties/methods\n\nJavaScript allows you to alter the properties\
    \ and methods of existing objects at any time. This includes adding new properties\
    \ or deleting them. You can start with a \"blank\" object and add properties later.\
    \ Let's see how you can go about doing this.\n\nAn object without properties is\
    \ shown as follows:\n\n```\nvar hero = {};\n```"
