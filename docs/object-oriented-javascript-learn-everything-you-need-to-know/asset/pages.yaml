  md: '# Chapter 5


    Let''s take the newtoy object again.


    ```

    var newtoy = new Gadget(''webcam'', ''black'');

    ```


    When you try to access a property of newtoy, say, newtoy.name, the JavaScript
    engine looks through all of the properties of the object searching for one called
    name, and if it finds it, it returns its value.


    +   > newtoy.name;

    > "webcam"


    What if you try to access the rating property? The JavaScript engine examines
    all of the properties of newtoy and doesn''t find the one called rating. Then,
    the script identifies the prototype of the constructor function used to create
    this object (the same as if you do newtoy.constructor.prototype). If the prototype
    is found in the prototype object, the following property is used:


    +   > newtoy.rating;

    > 3


    You can do the same and access the prototype directly. Every object has a constructor
    property, which is a reference to the function that created the object, in this
    case:


    ```

    > newtoy.constructor == Gadget;

    > true

    ```


    +   > newtoy.constructor.prototype.rating;

    > 3


    Now, let''s take this lookup one step further. Every object has a constructor.
    The prototype is an object, you must have a constructor which, in turn, has a
    prototype. You can go up the prototype chain and you will eventually end up with
    the built-in Object() object, which is the highest-level parent. In practice,
    this means that if you use newtoy.toString() and newtoy doesn''t have its own
    toString() method and its prototype doesn''t, in the end you will get the object''s
    toString() method:


    +   > newtoy.toString();

    > "Object Object"


    # Overwriting a prototype''s property with an own property


    As the above discussion demonstrates, if one of your objects doesn''t have a certain
    property of its own, you can use one (if it exists) somewhere up the prototype
    chain. What if the object does have its own property and the prototype also has
    one with the same name? Then, the object property takes precedence over the prototype''s.


    [ 157 ]'
