  md: "Coding and Design Patterns\n\n# # Modules\n\nCombining several of the previous\
    \ patterns, gives you a new pattern, commonly referred to as a module pattern.\
    \ The concept of modules in programming is convenient as it allows you to separate\
    \ pieces or libraries and combine them as needed just like pieces of a puzzle.\n\
    \n> Two notable facts beyond the scope of this chapter\nJavaScript doesn't have\
    \ a built-in concept of modules, although this is planned for the future export\
    \ and import declarations. There is also the module specification from http://www.conjs.org,\
    \ which defines a require() function and an exports object.\n\nThe module pattern\
    \ includes:\n\n+   * Namespaces to reduce naming conflicts among modules\n* An\
    \ immediate function to provide a private scope and initialization\n* Private\
    \ properties and methods\n* Returning an object that has the public API of the\
    \ module as:\n\n```\nMYAPP.module.amazing = (function () {\nnamespace ('MYAPP.module.amazing');\n\
    ```\n\n```\n// short names for dependencies\nvar another = MYAPP.module.another;\n\
    \n// local/private variables\nvar i, j;\n\n// private functions\nfunction hidden()\
    \ {}\n\n// public API\nreturn {\n hi: function () {\n  return \"hello\"\n }\n\
    }();\n```\n\nAnd using the following module:\n\n```\nMYAPP.module.amazing.hi();\
    \ // \"hello\"\n```"
  merge: -1
