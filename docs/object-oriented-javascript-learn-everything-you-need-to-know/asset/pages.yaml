  md: "# DOM event listeners\n\nThe best way to work with browser events is to use\
    \ the event listener approach outlined in DOM Level 2, where you can have many\
    \ functions listening to an event. When the event fires, all functions are executed.\
    \ All of the listeners don't need to know about each other and can work independently.\
    \ They can tune in and out at any time without affecting the other listeners.\n\
    \nLet's use the same simple markup from the previous section (available for you\
    \ to play with http://www.phpied.com/files/jssoop/ch7.html). It has this piece\
    \ of markup as follows:\n\n```\n<p id=\"closer\"=final\"></p>\n```\n\nYour JavaScript\
    \ code can assign listeners to the click event using the addEventListener method.\
    \ Let's attach two listeners as follows:\n\n```\nvar mypara = document.getElementById('closer');\n\
    mypara.addEventListener('click', function () {\n  alert('Boo!');\n}, false);\n\
    mypara.addEventListener(\n  'click', console.log.bind(console), false);\n```\n\
    \nAs you can see, addEventListener is a method called on the node object and accepts\
    \ the type of event as its first parameter and a function pointer as its second.\
    \ You can use anonymous functions as function () { alert('Boo!'); } or existing\
    \ functions such as console.log. The listener functions you specify are called\
    \ when the event happens and an argument is passed to them. This argument is an\
    \ event object. If you run the preceding code and click on the last paragraph,\
    \ you can see event objects being logged to the console. Clicking on an event\
    \ object allows you to see its properties:"
