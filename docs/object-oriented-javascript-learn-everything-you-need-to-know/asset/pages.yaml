  md: 'When you click on the link, you''re actually also clicking on the list item
    <li>li</li>, the list <ul></ul>, the <body>, and eventually the document as a
    whole. This is called event propagation. A click on a link can also also be seen
    as a click on the document. The process of propagating an event can be implemented
    in two ways:


    +   - Event capturing: The click happens on the document first, then it propagates
    down to the body, the list, the list item, and finally to the link

    - Event bubbling: The click happens on the link and bubbles up to the document


    DOM Level 2 events specification suggests that the events propagate in three phases,
    capturing, at target, and bubbling. This means that the event propagates from
    the document to the link (target) and then bubbles back up to the document. The
    event objects have an `eventPhase property, which reflects the current phase:


    ![](img/901612d85bd2f01ce60fcfeb0719ea7c_268_0.png)


    Historically, IE and Netscape (working on their own and without a standard to
    follow) implemented the exact opposites. IE implemented only bubbling. Netscape
    only capturing. Today, long after the DOM specification, modern browsers implement
    all three phases.'
  merge: -1
  pgno: 268
- img_proc: true
  md: "The practical implications related to the event propagation are as follows:\n\
    \n+   - The third parameter to addEventListener specifies whether or not capturing\
    \ should be used. In order to have your code more portable across browsers, it's\
    \ better to always set this parameter to `false` and use bubbling only.\n- You\
    \ can stop the propagation of the event in your listeners so that it stops bubbling\
    \ up and never reaches the document. To do this you can call the `stopPropagation()`\
    \ method of the event object (there is an example in the next section).\n- You\
    \ can also use event delegation. If you have ten buttons inside a `<div>`, you\
    \ can always attach ten listeners, one for each. But a smarter thing to do is\
    \ attach only one listener to the wrapping `<div>` and once the event happen,\
    \ which button was the target of the click.\n\nAs a side note, there is a way\
    \ to use capturing in old IEs using `setCapture()` and `releaseCapture()` methods\
    \ but only for mouse events. Capturing any other (keystroke events for example)\
    \ is not supported.\n\n# # Stop propagation\n\nLet's see an example of how you\
    \ can stop the event from bubbling up. Going back to the test document, there\
    \ is this piece of code:\n\n```\n<p id=\"closer\">final</p>\n```\n\nLet's define\
    \ a function that handles clicks on the paragraph:\n\n```\nfunction paraHandler()\
    \ {\n  alert('clicked paragraph');\n}\n```\n\nNow, let's attach this as a listener\
    \ to the click event:\n\n```\nvar para = document.getElementById('closer');\n\
    para.addEventListener('click', paraHandler, false);\n```\n\nLet's also attach\
    \ the listener to the click event on the body, and the browser window:\n\n```\n\
    document.body.addEventListener('click', function () {\n  alert('clicked body');\n\
    },\ndocument.addEventListener('click', function () {\n  alert('clicked doc');\n\
    }\n```"
  merge: -1
  pgno: 269
- img_proc: true
  md: "```\n}, false);\nwindow.addEventListener('click', function () {\n  alert('clicked\
    \ window');\n}, false);\n```\n\nNote, that the DOM specifications don't say anything\
    \ about events on the window. And why would they, some DOM deals with the document\
    \ and not the browser. Browsers implement events inconsistently.\n\nNow, if you\
    \ click on the paragraph, you'll see four alerts saying:\n\n+   - clicked paragraph\n\
    - clicked body\n- clicked doc\n- clicked window\n\nThis illustrates how the same\
    \ click event propagates (bubbles up) from the target all the way up to the window.\n\
    \nThe opposite of addEventListener() is removeEventListener() and it accepts exactly\
    \ the same parameters. Let's remove the listener attached to the paragraph.\n\n\
    > > para.removeEventListener('click', paraHandler, false);\n\nIf you try now,\
    \ you'll see alerts only for the click event on the body, document, and window,\
    \ but not on the paragraph.\n\nNow, let's stop the propagation of the event. The\
    \ function you add as a listener receives the event object as a parameter and\
    \ you can call the stopPropagation() method of that object as follows:\n\n```\n\
    function paraHandler(e) {\n  alert('clicked paragraph');\n  e.stopPropagation();\n\
    }\n```\n\nAdding the modified listener is done as follows:\n\n```\npara.addEventListener('click',\
    \ paraHandler, false);\n```\n\nNow, when you click on the paragraph you see only\
    \ one alert because the event doesn't bubble up to the body, the document, or\
    \ the window."
  merge: -1
  pgno: 270
- img_proc: true
  md: "Note, that when you remove a listener, you have to pass a pointer to the function\
    \ you previously attached. Otherwise doing the following does not work because\
    \ the second argument is a new function, the same you pass when adding the event\
    \ listener, even if the body is exactly the same:\n\n```\ndocument.body.removeEventListener('click',\n\
    function () {\n  alert('clicked');\n},\nfalse); // does NOT remove the handler\n\
    ```\n\n# Prevent default behavior\n\nSome browser events have a predefined behavior.\
    \ For example, clicking a link causes the browser to navigate to another page.\
    \ You can attach listeners to a link and you can disable the default behavior\
    \ by calling the method preventDefault() on the event object.\n\nLet's see how\
    \ you can annoy your visitors by asking \"Are you sure you want to follow this?\"\
    \ every time they click a link. If the user clicks on Cancel (confirm() to return\
    \ false), the preventDefault() method is called as follows:\n\n```\n// all links\n\
    var all_links = document.getElementsByTagName('a');\nfor (var i = 0; i < all_links.length;\
    \ i++) { // loop all links\n  all_links[i].addEventListener(\n    'click',\n \
    \   // event type\n    function (e) { // handler\n      if (!confirm('Are sure\
    \ you want to follow this link?')) {\n        e.preventDefault();\n      }\n \
    \   },\n    false // don't use capturing\n  );\n}\n```\n\nNote, that not all events\
    \ allow you to prevent the default behavior. Most do, but if you want to be sure,\
    \ you can check the cancelable property of the event object."
  merge: -1
