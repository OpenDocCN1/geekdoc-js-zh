  md: "# Chaining\n\nChaining is a pattern that allows you to invoke multiple methods\
    \ on one line as if the methods are the links in a chain. This is convenient when\
    \ calling several related methods. You invoke the next method on the result of\
    \ the previous without the use of an intermediate variable.\n\nSay you created\
    \ a constructor that helps you work with DOM elements. The code to create a <span>\
    \ and add it to the <body> could look something like the following:\n\n```\nvar\
    \ obj = new MYAPP.dom.Element('span');\nobj.setText('hello');\nobj.setStyle('color',\
    \ 'red');\nobj.setStyle('font', 'Verdana');\ndocument.body.appendChild(obj);\n\
    ```\n\nAs you know, constructors return the object referred to as this that they\
    \ create. You can make your methods such as setText() and setStyle() also return\
    \ this, which allows you to call the next method on the instance returned by the\
    \ previous one. This way you can chain methods:\n\n```\nvar obj = new MYAPP.dom.Element('span');\n\
    obj.setText('hello')\n  .setStyle('color', 'red')\n  .setStyle('font', 'Verdana')\n\
    \  document.body.appendChild(obj);\n```\n\nYou don't need the obj variable if\
    \ you don't plan on using it after the new element has been added to the tree,\
    \ so the code looks like the following:\n\n```\ndocument.body.appendChild(\n \
    \ new MYAPP.dom.Element('span')\n  .setText('hello')\n  .setStyle('color', 'red')\n\
    \  .setStyle('font', 'Verdana')\n);\n```\n\nA drawback of this pattern is that\
    \ it makes it a little harder to debug when an error occurs somewhere in a long\
    \ chain and you don't know which link is to blame because they are all on the\
    \ same line."
  merge: -1
  pgno: 301
