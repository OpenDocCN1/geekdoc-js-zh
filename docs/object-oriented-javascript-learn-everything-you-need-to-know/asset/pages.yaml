    +   - Month: 0 (January) to 11 (December)

    - Day: 1 to 31

    - Hour: 0 to 23

    - Minutes: 0 to 59

    -Seconds: 0 to 59

    - Milliseconds: 0 to 999


    Let''s see some examples.


    Passing all the parameters:


    ```

    > new Date(2015, 0, 1, 17, 05, 03, 120);

    Tue Jan 01 2015 17:05:03 GMT-0800 (PST)

