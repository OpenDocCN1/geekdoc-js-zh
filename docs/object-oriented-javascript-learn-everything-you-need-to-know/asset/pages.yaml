    # RegExp


    You can create a regular expression using the RegExp constructor. You pass the
    expression pattern as the first parameter and the modifiers as the second.


    ```

    > var re = new RegExp(''[dn]o+dle'', ''gmi'');

    ```


    This matches ''noodle'', ''doodle'', ''dooodoodle'', and so on. It''s equivalent
    to using the regular literal:


    ```

    > var re = (''/[dn]o+dle/gmi''); // recommended

    ```


    Chapter 4, Objects and Appendix D, Regular Expressions contains more information
    on regular expressions and patterns.


    # The RegExp.prototype members


    | Property/method | Description |

    |--- |--- |

    | global | Read-only, true if the g modifier was set when creating the regex object
    |

    | ignoreCase | Read-only, true if the i modifier was set when creating the regex
    object |

    | multiline | Read-only, true if the m modifier was set when creating the regex
    object |


    [ 341 ]'
