  md: "# Built-in Objects\n\nThis Appendix lists the built-in constructor functions\
    \ outlined in the ECMAScript (ES) standard, together with the properties and methods\
    \ of the objects created by these constructors. ES5-specific APIs are listed separately.\n\
    \n# Object\n\nObject() is a constructor that creates objects, for example:\n\n\
    +   - var o = new Object();\n\nThis is the same as using the object literal:\n\
    \n+   - var o = {}; // recommended\n\nYou can pass anything to the constructor\
    \ and it will try to guess what it is and use a more appropriate constructor.\
    \ For example, passing a string to new Object() will be the same as using the\
    \ new String() constructor. This is not a recommended practice (it's better to\
    \ be explicit than let guesses creep in), but still possible.\n\n```\n> var o\
    \ = new Object('something');\n> o.constructor; \nfunction String() [native code\
    \ ]\n```\n\n```\n> var o = new Object(123);\n> o.constructor;\nfunction Number()\
    \ [native code ]\n```\n\nAll other objects, built-in or custom, inherit from Object.\
    \ So, the properties and methods listed in the following sections apply to all\
    \ types of objects."
