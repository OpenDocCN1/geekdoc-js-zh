  md: "# Decorating a Christmas tree\n\nLet's illustrate the decorate pattern with\
    \ an example of decorating a Christmas tree. You start with the decorate() method\
    \ as follows:\n\n```\nvar tree = {};ntree.decorate = function () {\n  alert('Make\
    \ sure the tree won\\'t fall');\n};\n```\n\nNow, let's implement a getDecorator()\
    \ method which adds extra decorators. The decorators will be implemented as constructor\
    \ functions, and they will all inherit from the base tree object:\n\n```\ngetDecorator\
    \ = function (deco) {\ntree[deco].prototype = this;\nreturn new tree[deco];\n\
    };\n```\n\nNow, let's create the first decorator, RedBalls(), as a property of\
    \ tree (in order to keep the global namespace cleaner). The red ball objects also\
    \ provide a decorate() method, but they make sure they call their parent's decorate()\
    \ first:\n\n```\ntree.RedBalls = function () {\nthis.decorate = function () {\n\
    this.RedBalls.prototype.decorate();\nalert('Put on some red balls');\n};\n}\n\
    ```\n\nSimilarly, implementing BlueBalls() and Angel() decorators:\n\n```\ntree.BlueBalls\
    \ = function () {\nthis.decorate = function () {\nthis.BlueBalls.prototype.decorate();\n\
    alert('Add blue balls');\n};\n}\ntree.Angel = function () {\nthis.decorate = function\
    \ () {\nthis.Angel.prototype.decorate();\nalert('An angel on the top');\n};\n\
    }\n```"
