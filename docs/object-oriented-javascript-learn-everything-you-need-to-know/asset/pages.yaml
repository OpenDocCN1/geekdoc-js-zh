  md: '# 8 Coding and Design Patterns


    Now that you know all about the objects in JavaScript, you''ve mastered prototypes
    and inheritance, and you have seen some practical examples of using browser-specific
    objects, let''s move forward, or rather move a level up. Let''s have a look at
    some common JavaScript patterns.


    But first, what''s a pattern? In short, a pattern is a good solution to a common
    problem.


    Sometimes when you''re facing a new programming problem, you may recognize right
    away that you''ve previously solved another, suspiciously similar problem. In
    such cases, it''s worth isolating this class of problems and searching for a common
    solution. A pattern is a proven and reusable solution (or an approach to) a class
    of problems.


    There are cases where a pattern is nothing more than an idea or a name. Sometimes
    just using a name helps you think more clearly about a problem. Also, when working
    with other developers in a team, it''s much easier to communicate when everybody
    uses the same terminology to discuss a problem or a solution.


    Other times you may come across a unique pattern that doesn''t look like anything
    you''ve seen before and doesn''t readily fit into a known pattern. Blindly applying
    a pattern just for the sake of using a pattern is not a good idea. It''s preferable
    to not use any known pattern than try to tweak your problem so it fits an existing
    solution.


    This chapter talks about two types of patterns:


    +   * **Coding patterns**: These are mostly JavaScript-specific best practices


    +   * **Design patterns**: These are language-independent patterns, popularized
    by the famous "Gang of Four" book'
  merge: -1
