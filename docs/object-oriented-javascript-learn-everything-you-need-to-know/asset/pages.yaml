  md: "Primitive Data Types, Arrays, Loops, and Conditions\n\n# Switch\n\nIf you find\
    \ yourself using an if condition and having too many else parts, you could consider\
    \ changing the if to a switch:\n\n```\nvar a = '1';\nresult = '';\nswitch (a)\
    \ {\n  case 1:\n    result = 'Number 1';\n    break;\n  case '1':\n    result\
    \ = 'String 1';\n    break;\n  default:\n    result = 'I don't know';\n    break;\n\
    }\n```\n\nThe result after executing this is \"String 1\". Let's see what the\
    \ parts of a switch are:\n\n+   * The expression statement. The expression often\
    \ contains a variable, but can be anything that returns a value.\n* A number of\
    \ case blocks enclosed in curly brackets.\n* Each case statement is followed by\
    \ an expression. The result of the expression is compared to the comparison is\
    \ true, the code that follows the colon after the switch statement. If the result\
    \ of the comparison is true, the code that follows the colon after the switch\
    \ statement is executed.\n* There is an optional break statement to signal the\
    \ end of the case block. If this break statement is reached, the switch is all\
    \ done. Otherwise, if the break is missing, the program execution enters the next\
    \ case block.\n* There's an optional default case marked with the default statement\
    \ and followed by a block of code. The default case is executed if none of the\
    \ previous cases evaluated to true."
