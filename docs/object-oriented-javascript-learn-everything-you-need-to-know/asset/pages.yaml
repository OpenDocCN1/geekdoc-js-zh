    ```


    You can also search for strings, not only characters, and the search is sensitive


    ```

    > s.indexOf(''Couch'');

    0

    ```


    If there is no match, the function returns position -1:


    ```

    > s.indexOf(''couch'');

    -1

    ```


    For a case-insensitive search, you can transform the string to lowercase first
    and

    then search:


    ```

    > s.toLowerCase().indexOf(''couch'');

