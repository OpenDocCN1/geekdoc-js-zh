  md: '# Chapter 6


    Given so many options, you must be wondering: which is the right one? That depends
    on your style and preferences, your project, task, and team. Are you more comfortable
    thinking in terms of classes? Pick one of the methods that work with constructors.
    You are going to need just or a few instances of your ''class''? Choose an object-based
    pattern.


    Are these the only ways of implementing inheritance? No. You can choose a pattern
    from the preceding table or you can mix them, or you can think of your own. The
    important thing is to understand and be comfortable with objects, prototypes,
    and constructors; the rest is just joy.


    # Case study – drawing shapes


    Let''s finish off this chapter with a more practical example of using inheritance.
    The task is to be able to calculate the area and the perimeter of different shapes,
    as well as to draw them, while using much code as possible.


    # Analysis


    Let''s have one Shape constructor that contains all the common parts. From there,
    let''s have Triangle, Rectangle, and Square constructors, all inheriting from
    Shape. A square is really a rectangle with the same-length sides, so let''s reuse
    Rectangle when building the Square.


    In order to define a shape, you will need points with x and y coordinates. A generic
    shape can have any number of points. A triangle is defined with three points,
    a rectangle (to keep it simpler)—with one point and the lengths of the sides.
    The perimeter of any shape is the sum of its sides'' lengths. Calculating the
    area is shape-specific and will be implemented by each shape.


    The common functionality in Shape would be:


    +   - A draw() method that can draw any shape given the points

    - A getParameter() method

    - A property that contains an array of points

    - Other methods and properties as needed


    The drawing part let''s use a <canvas> tag. It''s not supported in early IEs,
    but, this is an exercise.


    Let''s have two other helper constructors—Point and Line. Point will help when
    defining shapes; Line will make calculations easier, as it can give the length
    of the line connecting any two points.


    [ 205 ]'
