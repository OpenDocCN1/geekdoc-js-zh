  md: "# Example of separating behavior\n\nLet's say you have a search form on a page\
    \ and you want to validate the form with JavaScript. So you go ahead and keep\
    \ the form tags free from any JavaScript, and then immediately before closing\
    \ the <body> tag you insert a <script> tag which links to an external file as\
    \ follows:\n\n```\n<body>\n<form id=\"myform\" method=\"post\" action=\"server.php\"\
    >\n  <fieldset>\n    <legend>search</legend>\n    <input\n      name=\"search\"\
    \n      id=\"search\"\n      type=\"text\"\n    />\n    <input type=\"submit\"\
    \ />\n  </fieldset>\n</form>\n<script src=\"behaviors.js\"></script>\n</body>\n\
    ```\n\nIn behaviors.js you attach an event listener to the submit event. In your\
    \ listener, you check to see if the input field was left blank and if so, stop\
    \ the form from being submitted. This way you save a round trip between the server\
    \ and the client and make the application immediately responsive.\n\nThe content\
    \ of behaviors.js is given in the following code. It assumes that you've created\
    \ your myevent utility from the exercise at the end of the previous chapter:\n\
    \n```\n// init\nmyevent.addEventListener('myform', 'submit', function (e) {\n\
    \  // no need to propagate further\n  e = myevent.getEvent(e);\n  myevent.stopPropagation(e);\n\
    \  // validate\n  var el = document.getElementById('search');\n  if (!el.value)\
    \ { // too bad, field is empty\n    myevent.preventDefault(e); // prevent the\
    \ form submission\n    alert('Please enter a search string');\n  }\n});\n```"
  merge: -1
