  md: '# Chapter 3


    +   * isFinite()

    * encodeURI()

    * decodeURI()

    * encodeURIComponent()

    * decodeURIComponent()

    * eval()


    The black box function

    Often, when you invoke functions, your program doesn''t need to know how these
    functions work internally. You can think of it as a black box: you give it some
    values (as input arguments) and then you take the result it returns. This is true
    for any function – one that''s built into the JavaScript engine, one that you
    create, or one that co-worker or someone else created.


    # parseInt()


    parseInt() takes any type of input (most often a string) and tries to make an
    integer out of it. If it fails, returns NaN.


    ```

    > parseInt(''123'');

    123

    ```


    ```

    > parseInt(''abc123'');

    NaN

    ```


    ```

    > parseInt(''abc23'');

    1

    ```


    ```

    > parseInt(''123abc'');

    123

    ```


    The function accepts an optional second parameter, which is the radix, telling
    the function what type of number to decide – decimal, hexadecimal, binary, and
    so on. For example, trying to extract a decimal out of the string FF makes no
    sense, so the result is NaN, but if you try FF as a hexadecimal, then you get
    255.


    ```

    > parseInt(''FF'', 10);

    NaN

    ```


    ```

    > parseInt(''FF'', 16);

    255

    ```'
  merge: -1
