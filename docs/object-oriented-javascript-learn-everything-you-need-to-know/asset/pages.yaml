  md: "# Primitive Data Types, Arrays, Loops, and Conditions\n\nThis code obviously\
    \ works because the end result was not \"yes\". But firstly, the code generated\
    \ an error: somevar is not defined, and you don't want your code to behave like\
    \ that. Secondly, just if (somevar) returns false doesn't mean that somevar is\
    \ not defined. It could be that somevar is defined and initialized to 0 or contains\
    \ a false value like false or 0.\n\nA better way to check if a variable is defined\
    \ is to use typeof:\n\n```\nvar result = \"\";\nif (typeof somevar != \"undefined\"\
    ) {\n  result = \"yes\";\n}\nresult;\n```\n\ntypeof always returns a string, and\
    \ you can compare this string with the string \"undefined\". Note that the variable\
    \ somevar may have been declared but not assigned a value yet, and you'll still\
    \ get the same result. So, when testing with typeof like this, you're really testing\
    \ whether the variable has any value other than the value defined:\n\n```\nvar\
    \ somevar;\nif (typeof somevar != \"undefined\") {\n  result = \"yes\";\n}\nresult;\n\
    ```\n\n```\nsomevar = undefined;\nif (typeof somevar != \"undefined\") {\n  result\
    \ = \"yes\";\n}\nresult;\n```\n\nIf a variable is defined and initialized with\
    \ any value other than undefined, its result returned by typeof is no longer \"\
    undefined\":\n\n```\nsomevar = 123;\nif (typeof somevar != \"undefined\") {\n\
    \  result = 'yes';\n}\nresult;\n```\n\n\"yes\""
