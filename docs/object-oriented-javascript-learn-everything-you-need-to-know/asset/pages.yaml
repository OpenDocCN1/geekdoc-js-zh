  md: "# Error objects\n\nErrors happen, and it's good to have the mechanisms in place\
    \ so that your code can realize there has been an error condition and can recover\
    \ from it in a graceful manner. JavaScript provides the statements try, catch,\
    \ and finally to help you deal with errors. If an error occurs, an error object\
    \ is thrown. Error objects are created using one of these built-in constructors:\
    \ EvalError, RangeError, ReferenceError, SyntaxError, TypeError, and URIError.\
    \ All of these constructors inherit from Error.\n\nLet's just cause an error and\
    \ see what happens. What's a simple way to cause an error? Just call a function\
    \ that doesn't exist. Type this into the console:\n\n```\n> iDontExist();\n```\n\
    \nYou'll get something like this:\n\n![](img/901612d85bd2f01ce60fcfeb0719ea7c_159_0.png)\n\
    \nThe display of errors can vary greatly between browsers and other host environments.\
    \ In fact, most recent browsers tend to hide the errors from the users. However,\
    \ you cannot assume that all of your users have disabled the display of errors,\
    \ and it is your responsibility to ensure an error-free experience for them. The\
    \ previous error propagated to the user the code didn't try to catch (catch) this\
    \ error. The code didn't catch the error and was not prepared to handle it. Fortunately,\
    \ it's trivial to trap the error. All you need is the try statement followed by\
    \ a catch statement.\n\nThis code hides the error from the user:\n\n```\ntry {\n\
    \  iDontExist();\n} catch (e) {\n  // do nothing\n}\n```"
