  md: 'Now, you can access the data in obj as object properties:


    ```

    console.log(response.name); // "Stoyan"

    console.log(response.books[2]); // "JS4PHP"

    ```


    The problem is that eval() is insecure, so it''s best if you use the JSONJSON
    object to parse the JSON data (a fallback for older browsers is available from
    http://json.org/).

    Creating an object from a JSON string is still trivial:


    ```

    var response = JSON.parse(xhr.responseText);

    ```


    To the opposite, to convert an object to a JSON string, you may use the method
    stringify();


    ```

    var str = JSON.stringify({hello: "you"});

    ```


    Due to its simplicity, JSON has quickly become popular as a language-independent
    format for exchanging data and you can easily produce JSON on the server side
    using your preferred language. In PHP, for example, there are the functions json_encode()
    and json_decode() that let you serialize a PHP array or object into a JSON string
    and vice versa.


    # Design patterns


    The second part of this chapter presents a JavaScript approach to a subset of
    the design patterns introduced by the book called Design Patterns: Elements of
    Reusable Object-Oriented Software, an influential book most referred to as the
    Book of Four or the Gang of Four, or GoF (after its four authors). The patterns
    discussed in the GoF book are divided into three groups:


    +   - Creational patterns that deal with how objects are created (instantiated)

    - Structural patterns that describe how different objects can be composed in order
    to provide new functionality

    - Behavioral patterns that describe ways for objects to communicate with each
    other


    There are 23 patterns in the Book of Four and more patterns have been identified
    since the book''s publication. It''s beyond the scope of this book to discuss
    all of them, so the remainder of the chapter demonstrates only four, along with
    examples of their implementation in JavaScript. Remember that the patterns are
    more about interfaces and relationships rather than implementation. Once you have
    an understanding of a design pattern, it''s not difficult to implement it, especially
    in a dynamic language such as JavaScript.'
