  md: '# Regular Expressions


    When you use regular expressions (discussed in Chapter 4, Objects), you can match
    literal strings, for example:


    ```

    > "some text".match(/me/);\n["me"]

    ```


    But, the true power of regular expressions comes from matching patterns, not literal
    strings. The following table describes the different syntax you can use in your
    patterns, and provides some examples of their use:


    | Pattern | Description |

    | [abc] | Matches a class of characters.\n> "some text".match(/otx/g);\n["o",
    "t", "x", "t"]

    | [a-z] | A class of characters defined as a range. For example, [a-d] is the
    same as [abcd], [a-z] matches all lowercase characters, [a-zA-Z0-9_] matches all
    characters, numbers, and the underscore character.\n> "Some Text".match(/[a-z]/g);\n["o",
    "m", "m", "e", "x", "t"]

    > "Some Text".match(/[a-zA-Z]/g);\n["S", "o", "m", "e", "T", "x", "t"]

    | ^[abc] | Matches everything that is not matched by the class of characters.\n>
    "Some Text".match(/[^a-z]/g);\n["S", " ", "T"] |'
