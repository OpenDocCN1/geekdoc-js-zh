    "I''m Donatello and I''m a Ninja"

    ```


    > Best practice

    By convention, you should capitalize the first letter of your constructor functions
    so that you have a visual clue that this is not intended to be called as a regular
    function.


    If you call a function that is designed to be a constructor but you omit the new
    operator, this is not an error, but it doesn''t give you the expected result.


    ```

    var h = Hero(''Leonardo'');

    typeof h

    "undefined"

    ```


    What happened here? There is no operator, so a new object was not created. The
    function was called like any other function, so h contains the value that the
    function returns. The function does not return anything (there''s no return),
    so it actually returns undefined, which gets assigned to h.


    In this case, what this refer to? It refers to the global object.


    # The global object


    You have learned a bit about global variables (and how you should avoid them).
    You also know that JavaScript programs run inside a host environment (the browser
    for example). Now that you know about objects, it''s time for the whole truth:
    the host environment provides a global object and all global variables are accessible
    as properties of the global object.


    If your environment is the web browser, the global object is called window. Another
    way to access the global object (and this is also true in most other environments)
    is to use this outside a constructor function, for example in the global program
    code outside any function.


    As an illustration, you can declare a global variable outside any function, such
    as:


    ```

    var a = 1;

    ```


