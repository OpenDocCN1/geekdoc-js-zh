    and to choose and combine them in any way you like.


    # Observer


    The observer pattern (also known as the subscriber-publisher pattern) is a behavioral
    pattern, which means that it deals with how objects interact and communicate with
    each other. When implementing the observer pattern you have the following objects:


    +   * One or more publishers objects announce when they do something important.

    * One or more subscribers tuned in to one or more publishers. They listen to what
    the publishers announces and act appropriately.


    The observer pattern may look familiar to you. It sounds similar to the browser
    events discussed in the previous chapter, and rightly so, because the browser
    events are one example application of this pattern. The browser is the publisher,
    it announces the fact that an event (such as a click) has happened. Your event
    listener functions are subscribed to (listen to) this event will be notified when
    the event happens. The browser-publisher sends an event object to all of the subscribers.
    In your custom implementations you can send any type of data you find appropriate.


    There are two subtypes of the observer pattern, push and pull. Push is where the
    publishers are responsible for notifying each subscriber, and pull is where the
    subscribers monitor for changes in a publisher''s state.'
