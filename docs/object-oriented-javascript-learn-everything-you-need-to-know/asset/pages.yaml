  md: "# isPrototypeOf()\n\nObjects also have the isPrototypeOf() method. Method tells\
    \ you whether that specific object is used as a prototype of another object.\n\
    \nLet's take a simple object named monkey.\n\n```\nvar monkey = {\n  hair: true,\n\
    \  feeds: 'bananas',\n  breathes: 'air'\n};\n```\n\nNow we create a Human() constructor\
    \ function and set its prototype property to point to monkey.\n\n```\nfunction\
    \ Human(name) {\n  this.name = name;\n}\nHuman.prototype = monkey;\n```\n\nNow\
    \ if you create a Human object called george and ask \"is monkey the prototype\
    \ of george?\", you'll get true.\n\n+   > george = new Human('george');\n> monkey.isPrototypeOf(george)\n\
    true\n\nNote that you have to know, or suspect, what the prototype is and then\
    \ ask \"is it true that your prototype is monkey?\" in order to confirm your suspicion.\
    \ But what if you don't suspect anything and you have no idea? Can you ask the\
    \ object to tell you its prototype? The answer is you can't in all browsers, but\
    \ you can in most of them. Most browsers have implemented the ES5 called Object\
    \ getPrototypeOf().\n\n+   > Object.getPrototypeOf(george).feeds;\n> \"bananas\"\
    \n> Object.getPrototypeOf(george) === monkey;\ntrue\n\nFor some of the ES-5 environments\
    \ that don't have getPrototypeOf(), you can use the special property __proto__."
