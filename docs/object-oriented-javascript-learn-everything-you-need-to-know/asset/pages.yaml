  md: '# Functions


    Another example would be parsing a string with a base 10 (decimal) and base 8
    (octal):


    ```

    > parseInt(''0377'', 10);

    377

    ```


    ```

    > parseInt(''0377'', 8);

    255

    ```


    If you omit the second argument when calling parseInt(), the function will assume
    10 (decimal), with these exceptions:


    +   - If you pass a string beginning with 0x, the radix is assumed to be 16 (a
    hexadecimal number is assumed).

    - If the string starts with 0, the radix assumes 8 (an octal number is assumed).
    Consider the following examples:


    ```

    > parseInt(''377'');

    377

    ```


    ```

    > parseInt(''0377'');

    255

    ```


    ```

    > parseInt(''0x377'');

    887

    ```


    The safest thing to do is always specify the radix. If you omit the radix, your
    code will probably still work in 99 percent of cases (most often you parse decimals),
    but every once in a while it might cause you a bit of hair loss while debugging
    some edge cases. For example, imagine you have a form field that accepts certain
    days or months or the user types 06 or 08.


    > ECMAScript 5 removes the octal literal values and avoids the confusion with
    parseInt() and unspecified radix.


    # parseFloat()


    parseFloat() is similar to parseInt(), but it also looks for decimals when trying
    to figure out a number from your input. This function takes only one parameter:


    ```

    > parseFloat(''1.23'');

    123

    ```


    ```

    > parseFloat(''1.23'');

    1.23

    ```'
