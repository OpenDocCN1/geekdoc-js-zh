  md: "> > arr[2]();\n\nHmm, not quite as expected. What happened here? All three\
    \ functions point to the same local variable i. Why The functions don't remember\
    \ values, they only keep a link (reference) to the environment where they were\
    \ created. In this case, the variable i happens to live in the environment where\
    \ the three functions were defined. So, all functions, when they need to access\
    \ the value, reach back to the environment and find the most current value of\
    \ i. After the loop, the variable's value is 3. So, all three functions point\
    \ to the same value.\n\nWhy three and not two is another good question to think\
