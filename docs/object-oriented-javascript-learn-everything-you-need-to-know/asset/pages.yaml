  md: '# Built-in Objects


    As you can see property descriptors are a lot more code, so you only use them
    if you really want to prevent someone from mangling your property, and also you
    forget about backwards compatibility with ES3 browsers because, unlike additions
    to Array.prototype for example, you cannot "shim" this feature in old browsers.


    And the power of the descriptors in action (defining a nonmalleable property):


    ```

    > var person = {};

    > Object.defineProperty(person, ''heads'', {value: 1});

    > person.heads = 0

    ```


    ```

    > person.heads;

    1

    ```


    ```

    > delete person.heads;

    false

    ```


    ```

    > person.heads;

    1

    ```


