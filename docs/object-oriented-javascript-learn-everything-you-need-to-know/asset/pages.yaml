  md: "# Alternative if syntax\n\nWhen you have a simple condition, you can consider\
    \ using an alternative if syntax. Take a look at this:\n\n```\nvar a = 1;\nvar\
    \ result = '';\nif (a === 1) {\n    result = \"a is one\";n} else {\n    result\
    \ = \"a is not one\";n}\n```\n\nYou can also write this as:\n\n+   * var a = 1;\n\
    * var result = (a === 1) ? \"a is one\" : \"a is not one\";\n\nYou should only\
    \ use this syntax for simple conditions. Be careful not to abuse it, as it can\
    \ easily make your code unreadable. Here's an example:\n\nLet's say you want to\
    \ make sure a number is within a certain range, say between 50 and 100:\n\n+ \
    \  * var a = 123;\n* a = a > 100 ? 100 : a < 50 ? 50 : a;\n* a; 100\n\nIt may\
    \ not be clear how this code works exactly because of the multiple ?. Adding parentheses\
    \ makes it a little clearer:\n\n+   * var a = 123;\n* a = (a > 100 ? 100 : a <\
    \ 50) ? 50 : a;\n* a; 50\n\n+   * var a = 123;\n* a = a > 100 ? 100 : (a < 50\
    \ ? 50 : a);\n* a; 100\n\n?: is called a ternary operator because it takes three\
    \ operands."
