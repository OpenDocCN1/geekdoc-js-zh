  md: '# Primitive Data Types, Arrays, Loops, and Conditions


    To declare a variable, you use the var statement, like this:


    ```

    var a;

    var thisIsAVariable;

    var _and_this_too;

    var mix12three;

    ```


    For the names of the variables, you can use any combination of letters, numbers,
    the underscore character, and the dollar sign. However, you can''t start with
    a number, which means that this is invalid:


    ```

    var 2threefive;

    ```


    To initialize a variable means to give it a value for the first (initial) time.
    You have two ways to do so:


    +   * Declare the variable first, then initialize it

    * Declare and initialize it with a single statement


    An example of the latter is:


    ```

    var a = 1;

    ```


    Now the variable named a contains the value 1.


    You can declare (and optionally initialize) several variables with a single statement;
    just separate the declarations with a comma:


    ```

    var v1, v2, v3 = ''hello'', v4 = 4, v5;

    ```


    For readability, this is often written using one variable per line:


    ```

    var v1,

    v2,

    v3 = ''hello'',

    v4 = 4,

    v5;

    ```


    > The $ character in variable names

    You may use the dollar sign character ($) used in variable names, as in $myvar
    commonly my$var. This character is allowed to appear anywhere in a variable name,
    although previous versions of the ECMA standard discouraged its use in handwritten
    programs and suggested it should only be used in generated code (programs written
    by other programs). This suggestion is not well respected by the JavaScript community,
    and $ is in fact commonly used in practice as a function name.'
