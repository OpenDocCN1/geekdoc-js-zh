  md: "# Variable hoisting\n\nHere's an interesting example that shows an important\
    \ aspect of local versus global scoping:\n\n```\nvar a = 123;\n```\n\n```\nfunction\
    \ f() {\n  alert(a);\n  var a = 1;\n  alert(a);\n}\n```\n\n```\nf();\n```\n\n\
    You might expect that the first alert() will display 123 (the value of the local\
    \ variable a) and the second will display 1 (the local variable a). But\n\nWhen\
    \ your JavaScript program execution enters a new function, all the variables declared\
    \ anywhere in the function are moved (or elevated, hoisted) to the top of the\
    \ function. This is an important concept to keep in mind. Further, only the declaration\
    \ is hoisted, meaning only the presence of the variable is moved to the top. Any\
    \ assignments stay where they are. In the preceding example, the declaration of\
    \ the local variable a was hoisted to the top. Only the declaration was hoisted,\
    \ but not the assignment to 1. It's if the function was written like this:\n\n\
    ```\nvar a = 123;\n```\n\n```\nfunction f() {\n  var a; // same as: var a = undefined;\n\
    \  alert(a); // undefined\n  a = 1;\n  alert(a); // 1\n}\n```\n\nYou can also\
    \ adopt the single var pattern mentioned previously in the best practice section.\
    \ In this case, you'll be doing a sort of manual variable hoisting to prevent\
    \ confusion with the JavaScript hoisting behavior."
