  md: "# Asynchronous JavaScript loading\n\nYou noticed how the script was loaded\
    \ at the end of the HTML right before closing the body. The reason is that JavaScript\
    \ blocks the DOM construction of the page and in some browsers enhance the downloads\
    \ of the other components that follow. By moving the scripts to the bottom of\
    \ the page you ensure the script is out of the way and when it arrives, it simply\
    \ enhances the already usable page.\n\nAnother way to prevent external JavaScript\
    \ files from blocking the page is to load them asynchronously. This way you can\
    \ start them earlier. HTML5 has the defer attribute for this purpose:\n\n```\n\
    <script src=\"behaviors.js\"></script>\n```\n\nUnfortunately, the defer attribute\
    \ is not supported by older browsers, but luckily, there is a solution that works\
    \ across browsers, and new. The solution is to create a script node dynamically\
    \ and append it to the DOM. In other words you use a bit of inline JavaScript\
    \ to load the external JavaScript file. You can have this script loader snippet\
    \ at the top of your document so that the download has an early start:\n\n```\n\
    <head>\n(function () {\n  var s = document.createElement('script');\n  s.src =\
    \ 'behaviors.js';\n  document.getElementsByTagName('head')[0].appendChild(s);\n\
    });\n</head>\n...\n```\n\n# Namespaces\n\nGlobal variables should be avoided in\
    \ order to reduce the possibility of variable naming collisions. You can minimize\
    \ the number of globals by namespacing your variables and functions. The idea\
    \ is simple, you create only one global object and all your variables and functions\
    \ become properties of that object.\n\n# An Object as a namespace\n\nLet's create\
    \ a global object called MYAPP:\n\n```\n// global namespace\nvar MYAPP = MYAPP\
    \ || {};\n```"
