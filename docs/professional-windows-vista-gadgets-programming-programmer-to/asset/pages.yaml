  md: "# Part I: Sidebar Gadgets\n\n# **System.Shell.RecycleBin**\n\nThe `System.Shell.RecycleBin`\
    \ object enables you to programmatically manipulate the Recycle Bin on your computer.\
    \ It has the following properties:\n\n| Property | Returns |\n| :--- | :--- |\n\
    | `fileCount` | The number of file objects and/or shortcut (.Lnk) files currently\
    \ stored in the system's Recycle Bin, awaiting deletion or recovery. |\n| `folderCount`\
    \ | The number of folder objects currently stored in the system's Recycle Bin,\
    \ awaiting deletion or recovery. |\n| `sizeUsed` | The total amount of space consumed\
    \ by files stored in the Recycle Bin. |\n\nHere's a code example that shows how\
    \ to display the number of files and folders in the Recycle Bin, as well as the\
    \ current size of the Recycle Bin:\n\n```\nvar result = document.getElementById(\"\
    result\");\nresult.innerHTML = \"fileCount: \" +\n                  System.Shell.RecycleBin.fileCount\
    \ + \"<br/>\" +\n                  \"folderCount: \" +\n                  System.Shell.RecycleBin.folderCount\
    \ + \"<br/>\" +\n                  \"sizeUsed: \" +\n                  System.Shell.RecycleBin.sizeUsed\
    \ + \" KB\";\n```\n\nThe `System.Shell.RecycleBin` object has three methods:\n\
    \n| Method | Description |\n| :--- | :--- |\n| `deleteItem` | Deletes a specific\
    \ file or folder in the Recycle Bin. |\n| `emptyAll` | Deletes all the contents\
    \ of the Windows Recycle Bin. |\n| `showRecycleSettings` | Displays Windows Recycle\
    \ Bin settings dialog. |\n\nThe following code example first displays the Recycle\
    \ Bin Properties dialog (see Figure 3-15), followed by deleting an item (by moving\
    \ it into the Recycle Bin). Finally, it asks the user if he wants to empty the\
    \ Recycle Bin (see Figure 3-16):\n\n```\n//---shows the recycle bin status---\n\
    System.Shell.RecycleBin.showRecycleSettings();\n\n//---delete a particular file\
    \ (move to recycle bin)---\nSystem.Shell.RecycleBin.deleteItem(\"c:\\\\folder1\\\
    \\pic1.bmp\")\n\n//---empties the recycle bin---\nSystem.Shell.RecycleBin.emptyAll();\n\
    ```\n\n96"
