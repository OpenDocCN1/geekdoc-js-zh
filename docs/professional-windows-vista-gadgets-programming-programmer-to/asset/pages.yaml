    # Packaging the Camera SideShow Gadget


    The final stage is to package the CameraClient application so that it can be installed
    easily. You''ll create a setup package that invokes a custom installer to install
    your gadget on the target computer.


    # Creating the Custom Installer


    Unlike installing normal Windows applications, installing a SideShow gadget requires
    you to register a gadget with SideShow so that users can connect SideShow-enabled
    devices to it. You therefore need to configure your setup package to run a custom
    installer so that you can programmatically install the gadget onto the computer
    without user intervention. First, you''ll create the custom installer.


    Begin with the CameraClient solution created in the previous section. Add a new
    project to it — a Class Library project. Name it CustomInstaller.


    Add references to the `Microsoft.SideShow.dll` and `System.Configuration.Install`
    libraries.'
