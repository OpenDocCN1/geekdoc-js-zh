    # System.Gadget.Settings


    The System.Gadget.Settings object enables you to save settings'' values specific
    to each Sidebar gadget. It has the following methods:


    | Method | Description |

    | --- | --- |

    | read | Reads the gadget''s previously stored settings. |

    | readString | Reads the gadget''s previously stored settings without attempting
    to determine the type of data stored. |

    | write | Stores a setting that should be persistent across sessions. |

    | writeString | Stores a setting that should be persistent across sessions without
    attempting to determine the type of data stored. |


    The following code example how you can save and read settings'' values using each
    of the four methods:


    ```

    System.Gadget.Settings.write("age", 30);

    System.Gadget.Settings.write("PI_1", 3.142857142857142857);

    System.Gadget.Settings.writeString("PI_2", 3.142857142857142857);


    System.Gadget.Settings.write("firstname", "John");

    System.Gadget.Settings.writeString("lastname", "Smith");


    var result = document.getElementById("result");

    ```


    (continued)'
