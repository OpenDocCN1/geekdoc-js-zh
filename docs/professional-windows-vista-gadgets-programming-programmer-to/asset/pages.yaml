  md: '**Chapter 8: Simple Content Format**


    # SCF Elements


    Simple Content Format (SCF) defines a set of elements that make up the content
    of a SideShow gadget. They are:


    ```

    body   content   img

    br     dialog    item

    btn    div       menu

    clr    em        txt

    ```


    The following sections describe each of these elements in order of functionality.


    > **Sending Data to a SideShow Device**

    There are two ways to send content to a SideShow device — programmatically, or
    using XML fragments (each representing a page). Each of the following sections
    shows both approaches.


    # <body> and <content> Elements


    <body> is the root element in the SCF XML specification. It can contain one of
    the three content types described earlier — content page, menu page, or dialog
    page.


    The <content> element specifies a content page that can contain text and images
    laid out in a flow manner. The following XML file shows an empty content page
    (see also Figure 8-8).


    ![](img/e79736c237e5bbe93c2846fd417f9382_273_0.png)


    **Figure 8-8**'
