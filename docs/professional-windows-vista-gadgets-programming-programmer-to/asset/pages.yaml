  md: "# Part II: SideShow Gadgets\n\n# DeviceAdded Event\n\nThe `DeviceAdded` event\
    \ is fired when you connect a gadget to a SideShow device. For example, after\
    \ you have installed your gadget, you tick the checkbox (under the name of the\
    \ SideShow device) next to the gadget (see Figure 9-1) to connect it to the SideShow\
    \ device.\n\n![](img/e79736c237e5bbe93c2846fd417f9382_310_0.png)\n\nTo handle\
    \ this event, simply code the following event handler (note that for the C# code,\
    \ you need to add the event handler for the event in the `Form1_Load()` event):\n\
    \n```\nVB 2005\nPrivate Sub gadget_DeviceAdded( _\n    ByVal sender As Object,\
    \ _\n    ByVal e As Microsoft.SideShow.DeviceCapabilityEventArgs) _\n    Handles\
    \ gadget.DeviceAdded\n\nEnd Sub\n```"
