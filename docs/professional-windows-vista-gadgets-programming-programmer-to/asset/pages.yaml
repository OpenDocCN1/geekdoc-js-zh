    {\n    throw new Exception(\"Loaded types must implement IDisposable\");\n}\n\
    if (preserveParams)\n{\n    paramList.Clear();\n}\nreturn loadedType;\ncatch (Exception\
    \ ex)\n{\n    throw new Exception(ex.Message);\n}\n```\n\nUsing standard .NET,\
    \ the specified assembly is loaded and an instance of the input type is created.\
    \ That instance is returned and it is directly callable by JavaScript (more on\
    \ that to come). preserveParams flag prevents the constructor arguments from being\
    \ cleared after the object is created. This is only necessary when you are creating\
    \ multiple instances of a class with the same constructor arguments.\n\nFinally,\
    \ because you're dealing with COM, you have to be careful about object disposal.\
    \ The UnloadType() method call (highlighted code line) disposes the incoming object\
    \ to allow for graceful cleanup.\n\n```\npublic void UnloadType(object typeToUnload)\n\
    {\n    try{\n        if (typeToUnload != null && typeToUnload is IDisposable)\n\
