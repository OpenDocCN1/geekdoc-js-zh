  md: '# Introduction to Windows SideShow


    Windows SideShow, a new feature in Windows Vista, is a technology that supports
    secondary display(s) on your PC, be a notebook or desktop computer. Using Windows
    SideShow, you can view or control information such as emails, media player, weather
    updates, and so on without needing to power up your computer. SideShow is also
    appearing in all kinds of devices, such as MP3 players, remote controls, phones,
    and more.


    Windows SideShow was originally known as Auxiliary Display.


    Figure 6-1 illustrates Microsoft''s vision for SideShow running on a wide variety
    of gadgets and devices. It shows SideShow-enabled devices in an MP3 music player,
    a notebook computer''s cover, and a laptop bag.


    # SideShow Devices


    At the time of writing, there aren''t many SideShow devices on the market, but
    many device manufacturers have committed to building devices for it. The following
    sections show the various types of SideShow devices that manufacturers have announced.
    By the time you read this, there''ll be more SideShow devices available.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# # Part II: SideShow Gadgets


    ![](img/e79736c237e5bbe93c2846fd417f9382_212_0.png)


    Figure 6-1


    # ## Notebook Computers


    One notable product that supports SideShow is the Asus W5Fe notebook (http://asus.com/news_show.aspx?id=5366;),
    shown in Figure 6-2, which has a SideShow auxiliary LCD built in its cover. The
    external auxiliary LCD display is a 2.8-inch QVGA TFT LCD screen and comes with
    1GB NAND flash memory.


    Using the SideShow screen, you can read your emails, play songs from your library,
    and more without needing to turn on your computer.


    > ### Limitations of SideShow-Enabled Devices

    Though you can view a wide variety of information on your SideShow-enabled devices,
    it is important to remember that the main aim of SideShow is to provide an additional
    way for you to quickly access your daily dose of information, such as emails,
    weather updates, RSS feeds, and so forth. So although you can read your email
    on a SideShow-enabled device, you cannot reply or compose a new email. That’s
    due to the constraint design of SideShow-enabled devices, which provide only basic
    buttons for you to navigate the information.'
