  md: "# Part I: Sidebar Gadgets\n\n# Refreshing Your Gadget\n\nFrequently you'll\
    \ find that you need to refresh your gadget at regular time intervals. As you\
    \ saw earlier, you can use the `setInterval()` method in JavaScript to call the\
    \ `monitorMachine()` function every second, like this:\n\n```\n//---calls monitorMachine()\
    \ every second---\nsetInterval(\"monitorMachine()\", 1000);\n```\n\n`setInterval()`\
    \ calls the named function at every specified interval, regardless of whether\
    \ the code within the function has finished executing. If you have a lot of activities\
    \ within the function to be called, using the `setInterval()` method with a small\
    \ interval might cause some congestion. Alternatively, you can also use the `setTimeout()`\
    \ method, which calls a specific function only once. If you use that method, you\
    \ need to place it within the function itself to be repeated, like this:\n\n```\n\
    function monitorMachine()\n{\n    //...\n    //...\n    //...\n    //---calls\
    \ itself every second---\n    setTimeOut(\"monitorMachine()\", 1000);\n}\n```\n\
    \nIn this case, the `monitorMachine()` function is called only once, one second\
    \ after all the code within it has finished executing.\n\nWhen you refresh your\
    \ gadget, you are using the computing resources of the computer hosting the gadget.\
    \ Depending on the activity of the gadget, this might be a serious resource hog\
    \ and cause delays to other gadgets. Ideally, you should stop the refresh on your\
    \ gadget when your gadget goes out of view.\n\nThe `System.Gadget.visible` property\
    \ enables you to know if your gadget is visible. It returns false in the following\
    \ conditions:\n\n+   The gadget is docked to the Sidebar and has been scrolled\
    \ off-screen.\nThe gadget is docked to the Sidebar and the Sidebar has been minimized.\n\
    The workstation is locked or the user has “fast-user-switched” to another session\
    \ on the console.\nThe power management timeout for the monitor has elapsed and\
    \ the monitor is turned off.\n\nThe following code segment shows how you can use\
    \ the `System.Gadget.visible` property to turn off updating when the gadget is\
    \ not visible:\n\n```\nvar timerID;\n\nfunction visibilityChanged()\n{\n    //---clears\
    \ the looping---\n    clearInterval(timerID);\n\n    //---update only if visible---\n\
    }\n```"
