    # # Sidebar Gadgets UI


    To manipulate the various UI features — flyout, options page, docking and unlocking,
    and so forth—of your Sidebar gadget, you can use the following objects:


    +   - System.Gadget

    - System.Gadget.Settings.ClosingEvent

    - System.Gadget.Flyout

    - System.Gadget.Settings


    # # System.Gadget


    The System.Gadget object contains various events, methods, and properties that
    allow you to control the behavior of your Sidebar gadgets. You have seen some
    of them in action in the previous chapter. For example, you saw how you used the
    onDock and onUnlock events to handle situations when the gadget is docked to the
    Sidebar pane, or when it is unlocked.


    The System.Gadget object has the following events:


    | Event | Description |

    |---|---||

    | onDock | Fires when the gadget is being docked, and will run the specified function
    when the event occurs. |

    | onSettingsClosed | Fires when the current gadget’s settings dialog is about
    to close, and specifies the function that should be executed when the event occurs.
    |

    | onSettingsClosing | Fires when the current gadget’s settings dialog is being
    closed, and specifies the function that should be executed when the event occurs.
    |

    | onShowSettings | Detects when the current gadget’s settings dialog is being
    opened, and runs the appropriate function when the event occurs. |

    | onUndock | Fires when the gadget is being undocked, and runs the specified function
    when the event occurs. |'
