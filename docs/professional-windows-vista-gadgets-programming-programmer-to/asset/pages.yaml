  md: "# Part II: SideShow Gadgets\n\nThe `ExtractFeed()` function downloads the RSS\
    \ feed from a site and then extracts the `<title>` and `<description>` elements\
    \ from each post and saves them into a string. Each post is separated by the ASCII\
    \ character 12 and each title and description is separated by the ASCII character\
    \ 3, as shown by the following example:\n\n> DocBook: Write Once, Read Anywhere\
    \ Documentation<12>DocBook enables developers to create technical documentation\
    \ in XML...........<3>Business Intelligence for the Average Joe<12>Follow this\
    \ case study to unlock the .........<3>\n\nThe following `GetPosts()` subroutine\
    \ calls the `ExtractFeed()` function, processes the result, and it adds the title\
    \ of each post as a menu and the content of the post as a text page in the SideShow\
    \ gadget:\n\n**VB 2005**\n\n```\nPrivate Sub GetPosts(ByVal ID As Integer, ByVal\
    \ URL As String)\n    '---retrieve the RSS gadget---\n    Dim gadget As ScfSideShowGadget\
    \ = New ScfSideShowGadget(_GadgetID)\n\n    '---split the posts into an array\
    \ of string---\n    Dim posts() As String = ExtractFeed(URL).Split(Chr(12))\n\n\
