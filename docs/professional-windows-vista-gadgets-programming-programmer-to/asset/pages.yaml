    What is interesting that when you try to save the value of PI using the write()
    method, write() attempts to guess the data type of the data to be saved and some
    rounding or truncation may occur inadvertently (depending on the precision of
    the number to be saved). In this case, the value of PI_1 will be truncated when
    it is saved and can be seen when you read the value of PI_1 using the read() and
    readString() methods. The value of PI_2 is saved using the writeString() method,
    which writes the value as a string without trying to convert it to a numeric type.
    Notice that when you use the read() method to read the value of PI_2, there is
    a loss of precision; that''s because read() tries to guess the data type it is
    reading. If you use the readString() method, the value of PI_2 will be retrieved
    correctly.


    > In general, use the writeString() and readString() methods when manipulating
    numerical values.


