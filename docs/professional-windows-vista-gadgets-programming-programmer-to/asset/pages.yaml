    # System.Diagnostics.EventLog


    The `System.Diagnostics.EventLog` object enables you to write entries in the Event
    Viewer event log. It has only one method — `writeEntry()`, which writes an entry
    into Event Viewer.


    `writeEntry()` has the following signature:


    ```

    System.Diagnostics.EventLog.writeEntry(strEventLogEntry [, intEventType])

    ```


    The `strEventLogEntry` parameter takes in a string containing the information
    to write to the event log. The `intEventType` parameter specifies the type of
    event being logged. It can be one of the following values:


    +   - 0: Success

    - 1: Error

    - 2: Warning

    - 3: Information (default)'
