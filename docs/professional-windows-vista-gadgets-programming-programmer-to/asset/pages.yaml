    # Building the RSS Aggregator


    The RSS Aggregator you build in this chapter will enable you to always check for
    the latest news on your SideShow device without needing to keep your computer
    turned on all the time. You will download RSS documents from sites to which you
    subscribe and send the postings from each site to a SideShow-enabled device, which
    caches them. You can then use the device to view the postings even if your computer
    is not turned on.


    Start with the RSSGadget project you created in the previous section. Add a resource
    file to your project and use its default name of `Resource1.resx` (see Figure
    7-12). You''ll use the resource file to add some images to your project.'
