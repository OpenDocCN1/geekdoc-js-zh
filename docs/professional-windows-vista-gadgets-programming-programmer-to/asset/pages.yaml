  md: '# Introduction


    Windows Vista includes two new features: Sidebar and SideShow. A Sidebar gadget
    is an easy-to-use mini-application that provides information at a glance and is
    hosted by a panel on the desktop known as the Windows Sidebar. Sidebar gadgets
    afford an easy way to access information at your fingertips and can be easily
    created by developers who are familiar with HTML and scripting languages such
    as JavaScript.


    While the Sidebar displays gadgets on your Windows desktop, Vista also supports
    another auxiliary display option called Windows SideShow. Using SideShow, Vista
    can display information on SideShow-enabled devices, such as secondary displays
    on desktops or external devices such as controls and mobile phones. The main advantage
    of SideShow is that users can obtain up-to-date information (such as checking
    weather reports, finding a contact''s phone number) as needed without having to
    turn on their computers.


    Because Windows Vista is a relatively new operating system, information about
    creating Sidebar and SideShow gadgets is limited. Though can find documentation
    related to gadget development on MSDN, a much more effective way to start gadget
    development is to actually build your own-self. In addition, it is also easier
    to get started if there are ample code examples that illustrate the various APIs
    that can be used in gadget development. Wading through pages of methods and properties
    documentation doesn''t really help the new developers to gadgets development.


    My goals for this book are to:


    +   - Get you-started in Windows Vista gadgets development.

    - Provide you with numerous code examples illustrating the use of the various
    APIs and various techniques you can use to program gadgets.

    - Demonstrate building gadgets from the start right through to deployment.


    # Who This Book Is For


    This book is targeted at experienced developers who are interested in developing
    gadgets for Windows Vista — both for Sidebar and SideShow. For Sidebar gadget
    programming, you are expected to have some basic knowledge of HTML, CSS, and JavaScript.
    Experience in building client-side applications using JavaScript is recommended.
    For SideShow programming, you should preferably be familiar with Windows application
    development and understand basic concepts such as how a Windows application works
    and interacts with the operating system.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    # What This Book Covers


    This book is a comprehensive guide to Windows Vista Sidebar and SideShow gadgets
    programming. It provides in-depth discussions of each technology and the various
    supporting APIs that developers can use to build their gadgets. Discussions of
    each API are accompanied by extensive code examples and code listings. Each part
    ends with a project that you can build, providing you a good opportunity to put
    together all the concepts covered in the earlier chapters.


    Some of the topics covered include:


    +   - Sidebar gadgets architecture and components

    - Debugging Sidebar gadgets in Visual Studio 2005

    - Deploying Sidebar gadgets

    - The Sidebar gadget system APIs

    - Localizing gadgets

    - SideShow architecture, managed code, and classes

    - SideShow devices, UI components, and SDK

    - SideShow Simple Content Format (SCF)

    - Interacting with SideShow devices and handling SideShow device events


    # How This Book Is Structured


    *Professional Windows Vista Gadgets Programming* has two parts: Part I covers
    Sidebar gadget development, and Part II covers SideShow gadget development. In
    each part, the book first explains the motivation behind each technology and its
    features. Then, you walk through how to develop a simple gadget; the traditional
    “Hello World” approach quickly introduces the key concepts. Subsequent chapters
    dive into each specific API that is relevant to enhancing the gadget. Finally,
    when you have mastered all the important APIs, each part ends with a chapter covering
    a complete project.


    # What You Need to Use This Book


    For Part I, most of the coding involves JavaScript, CSS, and HTML. Any text editor
    (such as Notepad) will suffice.


    For Part II, Visual Studio 2005 Professional is the primary tool used for building
    SideShow gadgets. You will also need the SideShow Simulator, which you can download
    free of charge from Microsoft’s web site.


    All code samples are shown in both Visual Basic .NET and C#, so you can also use
    the various products in the Visual Studio 2005 Express Editions for developing
    applications.'
  merge: -1
  pgno: 24
