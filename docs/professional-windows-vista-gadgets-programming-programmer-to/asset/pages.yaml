  md: '# Chapter 4: Enhancing Sidebar Gadgets


    The key advantage to using this object is that it enables you to maintain a single
    code base that can simultaneously target Sidebar and SideShow. The following sections
    explain the details.


    # System.Gadget.SideShow


    The System.Gadget.SideShow object enables you to send data (texts and images)
    to SideShow-enabled devices. It has the following methods:


    | Method | Description |

    | --- | --- |

    | addImage | Sends an image to SideShow-enabled devices. |

    | addText | Sends a text string to SideShow-enabled devices. |

    | enabled | Returns a Boolean value indicating whether SideShow is supported on
    the computer. |

    | remove | Removes a specific content based on the specified ID. |

    | removeAll | Removes all content on SideShow-enabled devices. |

    | setFriendlyName | Sends glance content to SideShow-enabled devices. |


    The enabled() method was previously incorrectly listed as a property in the MSDN
    documentation.


    The System.Gadget.SideShow object has one event, applicationEvent, which specifies
    gadget script code intended to handle event commands received from a SideShow
    information appliance''s navigation controls, and others.


    > The applicationEvent is not working in the current release of Sidebar.


    # A Sample SideShow-Enabled Sidebar Gadget


    To see how you can send content in your gadget to a SideShow-enabled device, you''ll
    create a simple Sidebar gadget that monitors the memory and CPU usage in your
    current computer. This information will be sent to SideShow-enabled device.


    First, create a new folder in the C:\Users\<user_name>\AppData\Local\Windows\Gadgets\
    and name it SystemMonitor.gadget. Create two new files — gadget.xml and SystemMonitor.html.


    Create a sub named Images and copy two new files icon.jpg and icon.ico into it.


    Images needed are included in this chapter’s download from www.wrox.com.'
