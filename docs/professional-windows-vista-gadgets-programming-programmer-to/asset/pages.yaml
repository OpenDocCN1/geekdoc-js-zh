  md: "# # Components of a SideShow Gadget\n\nA gadget running on a SideShow device\
    \ has the following components:\n\n+   - Glance data showing some description\
    \ about the gadget\n- Content pages displaying information in different formats,\
    \ such as menus, dialogs, and text pages\n\nBecause the lifetime of a gadget starts\
    \ the moment you register it on the computer, you want to carefully examine the\
    \ registration process so that you understand how to write a well-behaving gadget.\n\
    \n# # Registering a Gadget\n\nRecall from the previous chapter that to register\
    \ a SideShow gadget, you use the `Register()` method from the static `GadgetRegistration`\
    \ class, like this:\n\n```\nVB 2005\n'---register the gadget---\nGadgetRegistration.Register(\
    \ _\n    False, _\n    _GadgetID, _\n    ScfSideShowGadget.ScfEndpointId, _\n\
    \    \"RSS Aggregator Gadget\", _\n    Nothing, _\n    \"C:\\Resources\\rss.ico\"\
    , _\n    False, _\n    GadgetCachePolicies.KeepNewest, _\n    Nothing)\n\nC# 2005\n\
    //---register the gadget---\nGadgetRegistration.Register(\n    false,\n    _GadgetID,\n\
    \    ScfSideShowGadget.ScfEndpointId,\n    \"RSS Aggregator Gadget\",\n    null,\n\
    \    @\"C:\\Resources\\rss.ico\",\n    false,\n    GadgetCachePolicies.KeepNewest,\n\
    \    null);\n```"
  merge: -1
  pgno: 265
- img_proc: true
  md: "# # Part II: SideShow Gadgets\n\n> ## Executing Path of SideShow Gadgets\n\
    I’m using the absolute path of a resource item (such as an icon file or an XML\
    \ file) so that it is clear to you which arguments are expected for each parameter.\
    \ However, when you are developing your gadget, it is likely that you will embed\
    \ your resource files together with your project, so you’ll need to find the execution\
    \ path of your gadget during runtime. The following function returns the path\
    \ of your gadget during runtime:\n\n```\n**VB 2005**\n```vb\nPublic Shared Function\
    \ GetGadgetPath() As String\n    '---get the path where the gadget is installed---\n\
    \    Return Path.GetDirectoryName( _\n        System.Reflection.Assembly. _\n\
    \        GetExecutingAssembly().Location)\nEnd Function\n```\n\n**C# 2005**\n\
    ```csharp\npublic static string GetGadgetPath()\n{\n    //---get the path where\
    \ the gadget is installed---\n    return Path.GetDirectoryName(\n        System.Reflection.Assembly.GetExecutingAssembly().Location);\n\
    }\n```\n```\n\nThe `Register()` method has the following parameters:\n\n```\n\
    **VB 2005**\n```vb\nPublic Shared Sub Register( _\n    ByVal registerForAllUsers\
    \ As Boolean, _\n    ByVal gadgetId As System.Guid, _\n    ByVal endpointId As\
    \ System.Guid, _\n    ByVal friendlyName As String, _\n    ByVal startCmd As String,\
    \ _\n    ByVal iconPathNameAndResourceId As String, _\n    ByVal onlineOnly As\
    \ Boolean, _\n    ByVal policy As Microsoft.SideShow.GadgetCachePolicies, _\n\
    \    ByVal propertyPage As System.Nullable(Of System.Guid))\n```\n\n**C# 2005**\n\
    ```csharp\npublic static void Register(\n    bool registerForAllUsers,\n    System.Guid\
    \ gadgetId,\n    System.Guid endpointId,\n    string friendlyName,\n    string\
    \ startCmd,\n    string iconPathNameAndResourceId,\n    bool onlineOnly,\n   \
    \ Microsoft.SideShow.GadgetCachePolicies policy,\n    System.Guid? propertyPage)\n\
    ```\n```\n\n240"
