- img_proc: true
  md: '# Part II: SideShow Gadgets


    A menu page displays a list of selectable items for users to select. Users choose
    the items by pressing the up or down arrow keys and clicking the OK button to
    select the chosen menu item. Figure 8-6 shows a menu page.


    ![](img/e79736c237e5bbe93c2846fd417f9382_272_0.png)


    **Figure 8-6**


    A dialog page displays a dialog window together with some selectable options,
    such as Yes and No. Users press the left or right arrow keys to select an option
    and then click the OK button to select the chosen option. Figure 8-7 shows a dialog
    page.


    ![](img/e79736c237e5bbe93c2846fd417f9382_272_1.png)


    **Figure 8-7**


    These three content types are mutually exclusive and cannot be combined into a
    single page.'
