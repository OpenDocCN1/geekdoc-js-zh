    \nFigure 4-8\n\n# Localizing Sidebar Gadgets\n\nAlthough most of the gadgets you\
    \ are writing may be targeted at users in the English-speaking world, there are\
    \ times when you need to localize your gadget into some other languages. Sidebar\
    \ gadgets can easily be localized, if you understand how Sidebar loads your gadgets\
    \ and its associated files:\n\n+   - First, Sidebar looks into your gadget folder\
    \ and tries to locate all full locale folders. Examples of these folders are en-US,\
    \ zh-CN, ja-jp, and so on. If one of these exists, Sidebar will load whatever\
    \ it needs from this folder. Which local folders it looks into depends on your\
    \ currently selected language.\n- If Sidebar cannot locate the full locale folders,\
    \ it then looks into the language folders, such as en, zh, ja, and so on.\n- If\
    \ everything else fails, Sidebar then looks into the root folder of the gadget."
