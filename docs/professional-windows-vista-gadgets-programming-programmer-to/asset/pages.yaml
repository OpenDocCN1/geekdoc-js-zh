    Unlike Apple''s Dashboard, the Yahoo! Widget Engine is a free application for
    both Mac OS X and Windows operating systems. (In comparison, Windows Sidebar is
    only available for Windows Vista users.)


    Sidebar was actually present in the early builds of Windows Vista (beginning September
    2002), way before Dashboard and Yahoo! Widget Engine were released.


    The Windows Sidebar consists of two components:


    +   - Sidebar pane — The translucent panel anchored on your screen.

    - Sidebar gadgets — Mini-applications that can either be docked in the Sidebar
    or floating on the desktop.


    # Using Sidebar


    The Sidebar pane is anchored to the right side of the Windows Vista desktop by
    default. It contains several built-in Sidebar gadgets (see Figure 1-2).'
