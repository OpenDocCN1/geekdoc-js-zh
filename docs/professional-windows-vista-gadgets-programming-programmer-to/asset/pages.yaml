  md: "# Chapter 3: Exploring Sidebar Gadgets APIs\n\n# System.Shell\n\nThe `System.Shell`\
    \ object enables you to use the command shell of Windows to perform file operations.\
    \ It has the following methods:\n\n| Methods | Description |\n| --- | --- |\n\
    | `chooseFile` | Activates a dialog box to choose a file. |\n| `chooseFolder`\
    \ | Selects the active folder. |\n| `drive` | Returns a collection associated\
    \ with a `System.Shell.Drive` object. |\n| `execute` | Specifies a command to\
    \ be executed by the Windows shell. |\n| `itemFromFileDrop` | Returns a collection\
    \ associated with a `System.Shell.Item` object. |\n| `itemFromPath` | Returns\
    \ a collection associated with a `System.Shell.Item` object. |\n| `knownFolder`\
    \ | Takes a string that represents a user's well-known folder (such as a user's\
    \ Documents folder) and returns an instance of a `System.Shell.Folder` object\
    \ based on that path. |\n| `knownFolderPath` | Takes a well-known folder known\
    \ to the system (such as My Documents) and returns the path name as defined in\
    \ the context of the user's environment. |\n| `refreshDesktop` | Refreshes the\
    \ desktop after adding or removing files. |\n| `saveFileDialog` | Triggers a prompt\
    \ to the user that brings up the standard Windows File Save dialog to allow a\
    \ user to save data created within the gadget to a file. |\n\nHere's a code example\
    \ that shows how you can let the user choose a file from within a gadget:\n\n\
    ```\n//---choose a file---\nvar item = System.Shell.chooseFile(\n    true, \"\
    Text File:*.txt:Png File:*.png\", \".\", \"\");\n\n//---if the user clicks Open---\n\
    if (item!=null) {\n    result.innerHTML = \"File selected: \" + item.name + \"\
    <br/>\";\n}\n```\n\nThe `chooseFile()` method invokes the Open dialog (see Figure\
    \ 3-10) and lets the user selects a file for opening. When the user selects a\
    \ file and clicks the Open button, the file name is displayed.\n\n85"
