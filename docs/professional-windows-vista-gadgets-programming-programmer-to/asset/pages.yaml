  md: '# Part I: Sidebar Gadgets


    As you can see, there are three JavaScript functions defined within the file.
    They''re described in the following table.


    | Function | Description |

    | :--- | :--- |

    | `ShowDashboard()` | Saves the user setting named `ShowDashboard` to indicate
    if the Dashboard should be displayed. |

    | `LoadSettings()` | Loads the user settings named `lat`, `lng`, and `ShowDashboard`
    and displays their values on the textboxes and checkbox, respectively. |

    | `SettingsClosing()` | Saves the values of the textboxes into the user settings
    named `lat` and `lng`. |


    For Sidebar gadgets, you can save values specific to each user in user settings.
    Each instance of a Sidebar gadget maintains its own set of user settings, allowing
    personalization of each individual gadget.


    > **To read a user settings value, use the `System.Gadget.Settings.read()` method.
    To write a user setting, use the `System.Gadget.Settings.write()` method.**


    In this `Settings.html` file, the page itself contains a checkbox, a label, and
    two textboxes. When the page is loaded, the `LoadSettings()` JavaScript function
    is called. This function loads the values of the three user settings and shows
    their values on the page.


    For a Sidebar gadget''s options page, the OK and Cancel buttons are automatically
    added for you. To initiate an action when the OK button is clicked, you need to
    wire it up by setting the `onSettingsClosing` property to the function that you
    want to call:


    ```

    `System.Gadget.onSettingsClosing = SettingsClosing;`

    ```


    This statement calls the `SettingsClosing()` JavaScript function when the user
    clicks the OK button. Here, the function will save the values of the user settings.


    Finally, when the checkbox is checked/unchecked, the JavaScript function `ShowDashboard()`
    is called.


    In the options page, you are simply retrieving and saving the values of the user
    settings. Actual modification to the map is not done in this page (because you
    cannot programmatically reference the map in this page). To actually modify the
    page, you have to do it in `VirtualEarth.html`.'
