  md: '# Part II: SideShow Gadgets


    This code also sets the `startCmd` parameter to `Application.ExecutablePath`.
    The `Application.ExecutablePath` property returns the path of your installed gadget.
    Setting the `startCmd` parameter to this path causes the gadget to be run every
    time the user checks the checkbox in the SideShow window (see Figure 8-1).


    ![](img/e79736c237e5bbe93c2846fd417f9382_268_0.png)


    > ### Setting the startCmd Parameter


    If you set the `startCmd` parameter, be aware that every time the user ticks the
    checkbox in the SideShow window, your gadget application will automatically be
    launched. That means that even if your gadget application is already running,
    another instance will be loaded. Having multiple instances of the same gadget
    application running is bad—besides taking up additional memory, they will all
    try to send the same data to the SideShow devices attached to them, thereby slowing
    the devices and causing congestion. That''s why you must ensure that your gadget
    is single-instance. This is discussed in detail in Chapter 9.


    # Glance Data


    The first piece of information your SideShow gadget sends to a SideShow device
    is *glance data*. Glance data is simply a piece of text information that displays
    information pertaining to your gadget. Figure 8-2 shows the glance data for the
    Stocks and Inbox gadgets.


    242'
