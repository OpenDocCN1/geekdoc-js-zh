  md: '# # SideShow Project


    In the past few chapters, you''ve explored the basics of SideShow gadgets and
    how they interact with SideShow-enabled devices. You''ve also looked at the Simple
    Content Format (SCF) content that devices understand and how it is rendered. In
    this chapter, you build a SideShow gadget from beginning to end, see how to package
    it using a setup installation program, and ensure that it is installed properly
    on the target computer.


    # ## The Surveillance SideShow Gadget


    The SideShow gadget project in this chapter is for web surveillance. Nowadays,
    most people have webcams that, in addition to being used for instant messaging,
    can double as a key component for a security surveillance system. What you''ll
    build is a system that comprises the following components:


    +   - A Windows application that connects to a webcam. It serves as a server and
    sends the images to clients that connect to it through the Internet.

    - A Windows application that connects to the server application just described.
    It also sends the images received from the server to SideShow-enabled devices.


    You learn how to use socket communications to send a live video image from a server
    to clients connected to it remotely. The server will allow multiple clients to
    connect to it simultaneously. This set of applications is useful for home/office
    environments — you can use it in your office to monitor your kids at home, for
    example. In addition, you can send the images to a SideShow-enabled device, such
