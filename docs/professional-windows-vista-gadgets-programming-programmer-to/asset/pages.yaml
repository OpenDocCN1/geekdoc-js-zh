    \ data sent from the client. All messages sent from the client will end with a\
    \ `LineFeed` (LF) character. Because a single message may be broken up into a\
    \ few blocks during transmission, it is important that you look for an LF character\
    \ to ensure that you have received the entire message. Once a message is received\
    \ and it contains the word “Send”, the webcam image is sent to the client using\
    \ the `SendData()` subroutine, defined here:\n\n**VB 2005**\n\n```\n'---send the\
    \ data to the client---\nPublic Sub SendData(ByVal data As Byte())\n    Try\n\
    \        Dim ns As System.Net.Sockets.NetworkStream\n        SyncLock _client.GetStream\n\
    \            ns = _client.GetStream\n            ns.Write(data, 0, data.Length)\n\
    \        End SyncLock\n    Catch ex As Exception\n        Console.WriteLine(ex.ToString)\n\
    \    End Try\nEnd Sub\n```\n\n**C# 2005**\n\n```\n//---send the data to the client---\n\
    public void SendData(byte[] data)\n{\n    try\n    {\n        System.Net.Sockets.NetworkStream\
    \ ns;\n        lock (_client.GetStream())\n        {\n            ns = _client.GetStream();\n\
    \            ns.Write(data, 0, data.Length);\n        }\n    }\n    catch (Exception\
    \ ex)\n    {\n        Console.WriteLine(ex.ToString());\n    }\n}\n```\n\nThe\
    \ `SendData()` subroutine sends the data contained in the `Image` global variable\
    \ to the client.\n\nBack in `Form1`, you can now wire up the rest of the code\
    \ to make the server functional. Add the following constants and variable:\n\n\
    **VB 2005**\n\n```\nPublic Class Form1\n    '---port no for listening and sending\
    \ data---\n    Const IP_Address As String = \"127.0.0.1\"\n    Const portNo As\
    \ Integer = 500\n\n    '---use to spin off a thread to listen for incoming connections---\n\
    \    Dim t As System.Threading.Thread\n```\n\n323"
