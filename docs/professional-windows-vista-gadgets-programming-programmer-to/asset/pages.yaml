  md: '# Exploring Sidebar Gadgets APIs


    As you have realized, developing Sidebar gadgets generally involves a lot of JavaScript
    programming. Those of you who have done JavaScript programming on the client side
    have a good understanding of the limitations of JavaScript, particularly in the
    areas of file and system access. That''s because JavaScript was originally designed
    to work within a browser and, logically, it should not be given the rights to
    access the file systems of users who are viewing a page containing JavaScript
    code. Although a Sidebar gadget uses JavaScript, it is a different breed of animal.
    Because you are loading a Sidebar gadget directly from your computer and not from
    a web server, it should have a higher level of security clearance and do much
    more compared to being hosted on a web page.


    To make it possible for Sidebar gadgets to access the various systems information,
    Microsoft has provided a set of objects that gadget developers can use within
    their Sidebar gadgets, callable from JavaScript. In this chapter, you explore
    the various gadget objects and how they can be used to enhance the functionality
    of your gadget. The objects are grouped based on their functionalities:


    +   - Contacts

    - Debugging and diagnostics

    - Sidebar gadgets UI

    - Machine information

    - Emails

    - Network

    - Sounds

    - Time and time zones'
  merge: -1
