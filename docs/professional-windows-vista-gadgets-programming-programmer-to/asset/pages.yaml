    # SideShow Architecture


    How do SideShow gadgets and devices work together? First, all SideShow devices
    must provide a user-mode device driver to be installed on Windows Vista. Windows
    Vista then creates a `WUDFHost.exe` process (Windows User-Mode Driver Framework
    Host) to load the user-mode driver provider by the SideShow device. A SideShow
    gadget communicates with the device through the `WUDFHost.exe` process (see Figure
    6-24).


    > For each SideShow device installed, Windows creates a separate instance of the
    `WUDFHost.exe` process to load its user-mode driver.'
