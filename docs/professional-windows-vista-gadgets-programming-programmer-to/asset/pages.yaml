  md: '# # 4 Enhancing Sidebar Gadgets


    In this chapter, you learn how you can implement your gadget logic using .NET
    and how it can interface nicely with JavaScript. In addition, you’ll discover
    how to send data to a SideShow-enabled device from within your Sidebar gadget.
    If the target audience of your gadget is dispersed geographically, you’ll want
    to know how to localize it to display different languages. And when you are ready
    to ship your gadget, be sure to digitally sign it. This chapter explains all of
    this and then provides some additional information that will save you time and
    effort in developing your Sidebar gadgets.


    # ## Interacting with .NET Code Using .NET Interop


    So far, you have seen that developing Sidebar gadgets involves becoming familiar
    with HTML, CSS, and JavaScript. If you are a .NET developer like me, you might
    be disappointed to know that you won’t be able to make use of your .NET skills
    to develop Sidebar gadgets. However, though the UI part of the gadget has to be
    created using HTML, CSS, and JavaScript, the logic behind it can be called from
    a .NET component. All you need is a way for your gadget to call this component
    using JavaScript. Fortunately, someone has made this possible via the use of an
    “adapter.”


    Tyler Brinks (a .NET architect and developer for Notion ONE, www.notionone.com)
    has posted a useful article at www.codeproject.com/gadgets/GadgetInterop.asp on
    how to develop a .NET gadget adapter component that supports COM interop (so that
    it can be called from within JavaScript), and is capable of loading other .NET
    assemblies using reflection. This .NET component is registered on the user’s machine
    using JavaScript. And using this component, you can now call other .NET assemblies
    from within your Sidebar gadget.'
