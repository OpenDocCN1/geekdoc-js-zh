    # System.Machine.PowerStatus


    The System.Machine.PowerStatus object returns detailed information about the power
    status of the computer hosting the gadget. It has the following properties:


    | Property | Returns |

    | --- | --- |

    | batteryCapacityRemaining | The theoretical amount of seconds that a battery-powered
    system would remain powered up, given the current state of charge of the battery.
    |

    | batteryCapacityTotal | The theoretical amount of time that a battery-powered
    system would remain powered up if the battery were charged to 100%. |

    | batteryPercentRemaining | The percent of remaining battery life on the machine
    upon which the gadget is running. |

    | batteryStatus | The power characteristics of a machine, such as whether the
    system is on battery power or AC power. |

    | enumBatteryStatus | The power characteristics of a machine, such as whether
    the system is on battery power or AC power. |

    | isBatteryCharging | True to indicate that the power adapter is plugged in and
    in addition to replenishing the battery''s charge, in addition providing power
    to the system. |

    | sPowerLineConnected | True to indicate that the power adapter is plugged in
    and providing power to the system that is currently running Sidebar. |


    The System.Machine.PowerStatus object has one event, powerLineStatusChanged, which
    specifies a function that is called whenever the system is switched from adapter
    power to battery power, or vice


    The gadget in Listing 3-5 shows the detailed power status of your computer. When
    the page is loaded, you first print out the power status of your computer. You
    then set the powerLineStatusChanged event handler, which will be called whenever
    there is a change in power status, such as when you switch from battery power
    to adapter power, and versa, as shown in the following highlighted code.


