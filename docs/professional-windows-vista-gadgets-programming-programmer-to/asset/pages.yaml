  md: "Chapter 4: Enhancing Sidebar Gadgets\n\n# Registering the Gadget Adapter using\
    \ JavaScript\n\nWith the gadget adapter component created, you now need to find\
    \ a way to register it onto the user’s local machine. Instead of registering the\
    \ component using an MSI installer, you can install it by writing the appropriate\
    \ values directly into the Registry. The GadgetInterop.js is a JavaScript library\
    \ written by Tyler Brinks to install the gadget adapter onto the local computer.\
    \ The interesting thing about this library is that the gadget adapter will only\
    \ be installed once on the target computer, and subsequently other gadgets can\
    \ use it straight away.\n\n> Listing 4-2 shows the content of the `GadgetInterop.js`\
    \ JavaScript library, with all the function names highlighted. (You can download\
    \ the source code from the download page at www.wrox.com.) Be sure to set the\
    \ `progID` variable to \"GadgetInterop.GadgetAdapter\".\n\n# Listing 4-2: GadgetInterop.js\n\
    \n```\n////////////////////////////////////////////////////////////\n//\n// JavaScript\
    \ library to load any .NET assembly/type and execute against its\n// public methods\
    \ and properties\n//\n/////////////////////////////////////////////////////////////\n\
    function GadgetBuilder()\n{\n    // ProgID of the Gadget Adapter for use in creating\
    \ an ActiveX object instance\n    var progID = \"GadgetInterop.GadgetAdapter\"\
    ;\n\n    // File name of the Gadget Interop DLL\n    var assemblyName = \"Gadget.Interop.dll\"\
    ;\n    // Gadget Adapter class GUID\n\n    var guid = \"{89BB4535-5AE9-43a0-89C5-19B4697E5C5E}\"\
    ;\n\n    // Gadget Adapter assembly location (under the gadget's root directory)\n\
    \    var assemblyStore = \"\\\\bin\\\\\";\n\n    // Instance of the ActiveX gadget\
    \ adapter object\n    this._builder;\n\n    // Method pointers\n    this.Initialize\
    \ = Initialize;\n    this.LoadType = LoadType;\n    this.LoadTypeWithParams =\
    \ LoadTypeWithParams;\n    this.UnloadType = UnloadType;\n    this.AddConstructorParam\
    \ = AddConstructorParam;\n    this.InteropRegistered = InteropRegistered;\n  \
    \  this.GetActiveXObject = GetActiveXObject;\n```\n\n(continued)\n\n111"
