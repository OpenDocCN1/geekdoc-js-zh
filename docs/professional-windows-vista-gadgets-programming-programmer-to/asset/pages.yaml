  md: '# Part I: Sidebar Gadgets


    # Contacts


    To access the contacts information stored in Windows Contacts (Start ⭞ Programs
    ⭞ Windows Contacts), you can use the following objects:


    +   - System.ContactManager

    - System.Contact


    System.ContactManager object exposes a collection of System.Contact objects through
    its Contacts collection. The following code gets all the contacts (located in
    C:\Users\<UserName>\Contacts) and passes it to the contacts variable:


    ```

    --get all contacts--

    var contacts = System.ContactManager.Contacts;

    ```


    To access each contact individually, you can use its item property (zero-based):


    ```

    --get a particular contact (first contact)--

    var contact = System.ContactManager.Contacts.item(0);

    ```


    The count property provides the number of contacts retrieved:


    ```

    --get total number of contacts--

    var count = System.ContactManager.Contacts.count;

    ```


    # System.Contact Object


    The System.Contact object contains all the details of a contact. It has the following
    properties:


    | Property | Returns |

    |---|---|

    | city | The city, as part of the mailing address block. |

    | country | The country for a given contact. |

    | defaultEmail | The default email address. |

    | filePath | The file path for the vCard. |

    | homePhone | The home telephone number. |

    | mobilePhone | The mobile telephone number. |

    | name | The display name (sometimes called the "friendly name"). |

    | PBox | The postal box as part of the mailing address block. |

    | postalCode | The postal or ZIP Code as part of the mailing address block. |'
