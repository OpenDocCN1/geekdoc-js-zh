  md: '# # Part I: Sidebar Gadgets


    The `GPS.Logger` class contains two methods, described in the following table.


    | Method | Description |

    |---|---|

    | `ReadGPS()` | Returns the content of a specified GPS log file. |

    | `PhotoLatLng()` | Returns the latitude and longitude of a photo given the name
    of a GPS log file and the name of the image file. The `LastWriteTime` property
    of the `FileInfo` class contains the modication date of an image. The modification
    date of an image file is the date that an image is taken by a camera. |


    Compile the class and the `GPS.DLL` assembly will be located in the Bin\Debug
    folder.


