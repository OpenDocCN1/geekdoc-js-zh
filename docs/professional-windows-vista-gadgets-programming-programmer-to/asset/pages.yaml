  md: "# Chapter 9: Interacting with SideShow Devices\n\n# Querying the Capabilities\
    \ of Devices\n\nA SideShow gadget installed on your computer may have one or more\
    \ SideShow devices connected to it. You can use the `GetDeviceCount` property\
    \ of the `ScfSideShowGadget` class to obtain the number of devices connected to\
    \ a gadget. In addition to knowing how many devices are connected to a gadget,\
    \ it is also useful to know the capabilities of the connected device. For this\
    \ you can use the `GetCapabilitiesForDevices` property, which returns an array\
    \ of type `DeviceCapabilities`. The `DeviceCapabilities` object contains information\
    \ about the SideShow device, such as screen size, supported cultures, type of\
    \ images supported, and more.\n\nThe following code snippet retrieves all the\
    \ SideShow gadgets installed for the current user and lists the capabilities of\
    \ all the devices connected to each gadget:\n\n```\nVB 2005\n'---obtain all the\
    \ GUIDs under this registry key---\nDim keys As RegistryKey = _\n    Registry.CurrentUser.OpenSubKey(\
    \ _\n    \"SOFTWARE\\Microsoft\\SideShow\\Gadgets\", False)\n\n'---get all the\
    \ gadget GUIDs---\nDim gadget_GUIDs As String() = keys.GetSubKeyNames\n\nDim gadget\
    \ As ScfSideShowGadget\nDim FriendlyName As String\n\n'---retrieve each individual\
    \ gadget---\nFor Each gadget_GUID As String In gadget_GUIDs\n\n    '---retrieve\
    \ the gadget---\n    gadget = New ScfSideShowGadget(New Guid(gadget_GUID))\n\n\
    \    '---retrieve the FriendlyName of the gadget---\n    FriendlyName = Registry.CurrentUser.OpenSubKey(\
    \ _\n        \"SOFTWARE\\Microsoft\\SideShow\\Gadgets\\\" & gadget_GUID, False).\
    \ _\n        GetValue(\"FriendlyName\").ToString()\n\n    '---display the gadget's\
    \ ID and friendly name---\n    Console.WriteLine(\"Gadget: {0} - Friendly Name:\
    \ {1}\", _\n        gadget.GadgetId, FriendlyName)\n\n    '---number of devices\
    \ connected to this gadget---\n    Console.WriteLine(vbTab & \"Devices connected\
    \ to: {0}\", _\n        gadget.GetDeviceCount)\n\n    '---get the capabilities\
    \ for each device connected to the gadget---\n    Dim deviceCap As DeviceCapabilities()\n\
    \    deviceCap = gadget.GetCapabilitiesForDevices\n\n    '---for each device---\n\
    \    For deviceIndex As Integer = 0 To deviceCap.Length - 1\n\n        '---display\
    \ screen width---\n```"
