  md: '# # Chapter 10: SideShow Project


    this custom data from your installation package later in the next section. For
    now, if the user chooses to install the application for himself, the `Context.Parameters("allUsers")`
    collection returns a value of 1. If he chooses to install the application for
    all users, the `Context.Parameters("allUsers")` collection returns an empty string.


    Once the user decides, you install the gadget accordingly, using the static class
    `GadgetRegistration`’s `Register()` method. Notice that for the fifth parameter,
    you passed in:


    ```

    GetGadgetPath() & "\CameraClient.exe"

    ```


    That’s the `startCmd` parameter, which takes in a path to your executable file.
    Whenever the checkbox in the Windows SideShow window is checked, SideShow goes
    to this specified path and executes your gadget. The sixth parameter is the path
    to the icon you want to use for the gadget, which you specified as follows:


    ```

    GetGadgetPath() & "\icon.ico"

    ```


    The `Installer_AfterUninstall()` subroutine is fired when the user uninstalls
    the application. You can’t really know whether the gadget is installed for one
    individual user or all users (you can, actually, but that would involve checking
    the Registry), so the easiest way is to try to uninstall it assuming that it is
    installed only for one user. If that fails, you uninstall it for all users.


    The `GetGadgetPath()` function returns the path containing the CameraClient application.


    That’s it for the custom installer. Build the project by right-clicking the project
    name in Solution Explorer and selecting Build.


