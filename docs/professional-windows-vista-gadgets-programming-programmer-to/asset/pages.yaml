  md: "# Well-Behaved SideShow Gadgets\n\nThere are a couple of important points about\
    \ writing well-behaved SideShow gadgets that you should observe, as demonstrated\
    \ in the project you created in this chapter.\n\nAs you uncheck and check the\
    \ checkbox of a SideShow gadget in the Windows SideShow window, Windows attempts\
    \ to load your gadget by going to the path set in the fifth parameter of the `Register()`\
    \ class:\n\n```\nVB 2005\n'---to be executed when the application is installed---\n\
    GadgetRegistration.Register( _\n    RegisterForAllUsers, _\n    _gadgetID, _\n\
    \    ScfSideShowGadget.ScfEndpointId, _\n    \"Webcam Gadget\", _\n    GetGadgetPath()\
    \ & \"\\CameraClient.exe\", _\n    GetGadgetPath() & \"\\icon.ico\", _\n    False,\
    \ _\n    GadgetCachePolicies.KeepNewest, _\n    Nothing)\n\nC# 2005\n//---to be\
    \ executed when the application is installed---\nGadgetRegistration.Register(\n\
    \    RegisterForAllUsers, _gadgetID,\n    ScfSideShowGadget.ScfEndpointId,\n \
    \   \"Webcam Gadget\",\n    GetGadgetPath() + \"\\\\CameraClient.exe\",\n    GetGadgetPath()\
    \ + \"\\\\icon.ico\",\n    false,\n    GadgetCachePolicies.KeepNewest,\n    null);\n\
    ```\n\nWindows does it regardless of whether you have an instance of the gadget\
    \ currently running. That means that if you already have an instance of the gadget\
    \ running, Windows will load another instance. If you check and uncheck the gadget\
    \ a couple of times, you would have a couple of instances running, each trying\
    \ to send data (images in this case) to your SideShow-enabled devices (which is\
    \ really bad). That's why it is important that you make your application single-instance,\
    \ so that only one instance can be running at any one time.\n\nAlso, when the\
    \ last SideShow-enabled device is disconnected from the gadget, you should stop\
    \ sending images to the device. You achieve that by servicing the `AllDevicesRemoved`\
    \ event of the gadget and setting the `SendToDevice` flag to `False`."
  merge: -1
  pgno: 389
- img_proc: true
  md: '# Part II: SideShow Gadgets


    # Summary


    In this chapter, you followed the development of a gadget from beginning to end.
    You wrote a Windows application that connects to a webcam and displays the images
    captured by it on a Windows form. Then you wrote another Windows application that
    enables you to remotely connect to the application with the webcam so that the
    images can be transmitted over the Internet. In addition, the images received
    are continuously sent to a SideShow-enabled device, enabling you to stream live
    video images to a device such as the MomentoLive Wireless Digital Picture Frame.
    The last part of this chapter showed you how to package your application so that
    it registers itself with SideShow during its installation stage.'
  merge: -1
