  md: '# Part I: Sidebar Gadgets


    # Launching Sidebar


    The Windows Sidebar is itself a Windows application. When you boot Windows Vista,
    Sidebar is automatically loaded by default. If for some reason the Sidebar does
    not load, you can manually load it by selecting Start -> All Programs -> Windows
    Sidebar. Alternatively, you can type the word Sidebar in the Search box to launch
    the Sidebar application.


    The Sidebar application is located in the C:\Program Files\Windows folder, which
    has the following subfolders (see Figure 1-3):


    +   - en-US — Stores the localized versions of the Sidebar application (the default
    culture in US).

    - Gadgets — Contains various Sidebar gadgets that come pre-installed on your local
    system.

    - Shared Gadgets — Contains gadgets that are shared among all the users of the
    computer.


    ![](img/e79736c237e5bbe93c2846fd417f9382_34_0.png)


    Figure 1-3


    # Customizing Sidebar


    Once Sidebar is running, a Windows Sidebar icon displays in the system tray (see
    Figure 1-4).


    ![](img/e79736c237e5bbe93c2846fd417f9382_34_1.png)


    Figure 1-4'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# # Chapter 1: Introduction to Windows Sidebar


    To customize the appearance and properties of the Sidebar, right-click either
    the Windows Sidebar or its icon, and then select the Sidebar Properties dialog
    box (see Figure 1-5) opens.


    ![](img/e79736c237e5bbe93c2846fd417f9382_35_0.png)


    Figure 1-5


    You can configure the Sidebar with the following options:


    +   - Start Sidebar when Windows starts — Auto-launches Sidebar when Windows starts.

    - Sidebar is always on top of other windows — Sidebar will always appear on top
    of other windows. This option is useful if you have a large display (or more than
    one display attached to your system) and can afford the additional space taken
    up by Sidebar. For smaller monitors, it is always better to uncheck this option.

    - Display Sidebar on this side of the screen — Right or Left. In addition, if
    you have more than one monitor attached to your system, you can also specify the
    monitor to display the Sidebar.

    - View list of running gadgets — Click to see a list of currently running gadgets;
    you have the option to remove them from the Sidebar.


    9'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Hiding Sidebar


    Quite often, you may need to free up some screen estate to gain additional space
    for running applications such as Visual Studio 2005. You can hide the Sidebar
    by simply right-clicking it and selecting Close Sidebar. This step only hides
    the Sidebar; the application will still be running in the background. To view
    the Sidebar again, right-click the Sidebar icon in the system tray and choose
    Open.


    If desktop icons are covered by the Sidebar, there is no way you can use the mouse
    to reach them. For example, Figure 1-6 shows an image file named Golden Gate Bridge
    covered by the Sidebar; you can''t access it while the Sidebar is visible. To
    get the Sidebar out of the way, you can either use the Close Sidebar option described
    earlier, or right-click the taskbar and Show the Desktop. Either way, the Sidebar
    disappears and you can access the image file.


    ![](img/e79736c237e5bbe93c2846fd417f9382_36_0.png)


    Figure 1-6


    If you don''t need Sidebar anymore, right-click the Sidebar icon in system tray
    and select Exit.


    # Sidebar Gadgets


    A Sidebar is virtually useless if there are no Sidebar Gadgets in it. Sidebar
    gadgets are mini applications that can be docked inside the Sidebar or floating
    on your desktop.'
