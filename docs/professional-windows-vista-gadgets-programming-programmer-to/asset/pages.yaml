  md: '# ## Chapter 3: Exploring Sidebar Gadgets APIs


    The following code writes four entries in the event log:


    ```

    System.Diagnostics.EventLog.writeEntry("Success message", 0);

    System.Diagnostics.EventLog.writeEntry("Error message", 1);

    System.Diagnostics.EventLog.writeEntry("Warning message", 2);

    System.Diagnostics.EventLog.writeEntry("Information message", 3);

    ```


    To view the entries in the event log, select Start > Settings > Control Panel
    > Event Viewer. Choose the Application log to see the new entries (Figure 3-4).


