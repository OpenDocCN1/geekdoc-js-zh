    # ## Step 3: Creating a Certificate


    To sign the CAB file, you need a certificate. Visual Studio 2005 ships with the
    Certificate Creation Tool (makecert.exe) that enables you to create an X.509 certificate
    for testing. To create the certificate, type the following command:


    ```

    makecert -sv "SystemMonitor.pvk" -n "CN=Developer Learning Solutions" SystemMonitor.cer

    ```


    > The makecert.exe tool is only for testing purposes. For production use, you
    should purchase a certificate from a Certificate Authority such as VeriSign or
    Thawte.


    The parameters used are:


    | Parameter | Description |

    | :--- | :--- |

    | `-sv` | Creates a private key file. |

    | `-n` | Sets the certificate subject X500 name (Issued To field). |


    You will be asked to type in a password three times. Supply a password of your
    choice. The certificate (SystemMonitor.cer) and private key (SystemMonitor.pvk)
    will then be created.


    # ## Step 4: Signing the Cab File


    Once the certificate is created, you can use it to sign the CAB file. You can
    use the SignTool tool (signtool.exe) for this purpose. Type the following command:


    ```

    signtool signwizard

    ```'
