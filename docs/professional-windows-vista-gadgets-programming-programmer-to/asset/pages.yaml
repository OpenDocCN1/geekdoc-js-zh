  md: '# Part I: Sidebar Gadgets


    Why is this so? Well, every time you add a gadget to the Sidebar, you are actually
    creating a new instance of it. And each instance has its own set of application
    settings that is independent of other instances. And due to this behavior, each
    time you add a gadget to the Sidebar it will initialize itself to some default
    values.


    > Of course, developers can code their gadgets to manually persist the settings
    so that the information can be shared with other instances of the same gadget.
    That''s discussed in more detail in Chapter 4.


    # Summary


    This chapter provided a quick overview of the capabilities of Windows Sidebar.
    You have seen how to launch the Sidebar and also how to add and install new gadgets
    onto the Sidebar. In the next chapter, you embark on the journey of creating your
    first Sidebar gadget.'
  merge: -1
