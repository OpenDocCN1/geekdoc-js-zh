    {\n    var gadgetTitle = document.getElementById(\"title\");\n    gadgetTitle.innerHTML\
    \ = title;\n\n    //---monitor gadget?s visibility---\n    System.Gadget.visibilityChanged\
    \ = visibilityChanged;\n\n    //---only call monitorMachine() if gadget is hosted\
    \ in Sidebar---\n    if (window.System != undefined) {\n        //---calls monitorMachine()\
    \ every second---\n        timerID = setInterval(\"monitorMachine()\", 1000);\n\
    \    }\n}\n```\n\nThe `System.Gadget` object has the `visibilityChanged` event\
    \ that is fired whenever there is a change is the gadget's visibility. The `clearInterval()`\
    \ method cancels the interval previously set by the `setInterval()` method.\n\n\
    > *If you are using the `setTimeout()` method to repeatedly call a function, use\
    \ the `clearTimeout()` method to cancel the timeout.*\n\n# Persisting Settings\n\
    \nEach instance of the gadget you add to the Sidebar lives in its own world. That\
    \ is, the settings saved in one instance of a gadget are visible to itself and\
    \ not to others. In addition, whatever settings you save in one instance of a\
    \ gadget will be deleted when you remove the instance.\n\nThere are times when\
    \ you need to share values between instances of the same gadget, or that you simply\
    \ want to persist some values so that when the gadget is added to the Sidebar\
    \ again, the values can be retrieved again. Unfortunately, the Sidebar does not\
    \ have any provision for this, so you'll have to roll your own code. Fortunately,\
    \ Bruce from the Gadget Corner (http://blogs.msdn.com/sidebar/archive/2006/09/21/765604.aspx)\
    \ has written a JavaScript library that exposes an API for reading and writing\
    \ shared settings. To use this JavaScript library, download it from http://channel9.msdn.com/Photos/ZippedFiles/236914_persistentSettings.zip\
    \ and place the JavaScript file in your gadget folder (say, the js folder).\n\n\
    Then, add this element to your HTML to reference the JavaScript library:\n\n```\n\
    <script src=\"js/persistentSettings.js\" language=\"javascript\"></script>\n```"
