  md: "# # Part II: SideShow Gadgets\n\nIn this code, you connect to the server using\
    \ its IP address and port number, and then send a \"Send\" message to the server\
    \ indicating that you are ready to receive the image. After that, you spin off\
    \ a thread so that you can receive images via the `ReceiveImageLoop()` subroutine.\n\
    \nThe `ReceiveImageLoop()` subroutine calls the `ReceiveImage()` function indefinitely,\
    \ until the `ReceiveImage()` function returns `False`. Here it is:\n\n```\n**VB\
    \ 2005**\nPrivate Sub ReceiveImageLoop()\n    '---keep on receiving image until\
    \ an error occurs---\n    While ReceiveImage()\n    End While\n\n    '---display\
    \ error message---\n    MsgBox(\"Server has stopped responding. Please try\" &\
    \ _\n        \" restarting the video.\")\nEnd Sub\n```\n\n```\n**C# 2005**\nprivate\
    \ void ReceiveImageLoop()\n{\n    //---keep on receiving image until an error\
    \ occurs---\n    while (ReceiveImage()) {}\n\n    //---display error message---\n\
    \    MessageBox.Show(\"Server has stopped responding. Please try\" +\n       \
    \ \" restarting the video.\");\n}\n```\n\nThe `ReceiveImage()` function reads\
    \ the incoming image data (in blocks of 8192 bytes, as defined by the `ReceiveBufferSize`\
    \ property of the `TcpClient` class) sent from the server. Because each image\
    \ sent is 341504 bytes (defined by the `SIZEOFIMAGE` constant; this value is dependent\
    \ on your webcam), you will read the number of bytes as expected. Once the image\
    \ is received, display the image in the PictureBox control. To receive the next\
    \ image from the server, send another \"Send\" message to the server:\n\n> **To\
    \ find out the exact value for the SIZEOFIMAGE constant for your webcam, you can\
    \ set a breakpoint in the SendData() method in the CameraServer project and view\
    \ the size of the byte array that you are sending across the network. The size\
    \ of the byte array will return the size of the image.**\n\n```\n**VB 2005**\n\
    '---receive video image from server---\nPublic Function ReceiveImage() As Boolean\n\
    \    Dim s As New MemoryStream\n    Try\n        Dim nws As NetworkStream = client.GetStream\n\
    \        Dim counter As Integer = 0\n        Dim totalBytes As Integer = 0\n\n\
    \        Do\n```"
