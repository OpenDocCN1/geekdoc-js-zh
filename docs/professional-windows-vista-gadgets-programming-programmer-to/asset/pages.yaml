  md: "# # Chapter 4: Enhancing Sidebar Gadgets\n\nWhen a user using the Chinese (Simplified)\
    \ version of Windows Vista loads the gadget, Sidebar will first find the gadget\
    \ manifest located in the zh-CN folder. However, it cannot find the SystemMonitor.html\
    \ file in the current folder and eventually it will find it in the root folder.\
    \ Recall that the SystemMonitor.html contains a reference to the js/resource.js\
    \ file, and in this case, Sidebar will first look into the zh-CN folder to see\
    \ if it could locate the file. When it does, the localized strings stored in it\
    \ will be loaded and displayed appropriately.\n\n> ### Language and Location Localization\n\
    Most often, a localization discussion focuses on how to display different languages.\
    \ However, localization is more than simply displaying the appropriate languages;\
    \ it also involves displaying values of the correct format. For example, the currency\
    \ symbol in the US is $, and China’s is ¥. With some coding, you can know which\
    \ currency symbol to display.\n\nFor example, you might add the following variables\
    \ to each resource.js file:\n\nIn SystemMonitor.gadget\\js\\resource.js:\n```javascript\n\
    var locale = \"US\";\n```\n\nIn SystemMonitor.gadget\\zh-CN\\js\\resource.js:\n\
    ```javascript\nvar locale = \"CN\";\n```\n\nTo display the correct currency symbol,\
    \ you can add the following logic to your JavaScript:\n```javascript\nif (locale\
    \ == \"US\")\n    amount.innerHTML = \"$\" + amount;\nelse\n    amount.innerHTML\
    \ = \"¥\" + amount;\n```\n\n# # Deploying and Signing Gadgets\n\nAs you learned\
    \ in Chapter 2, the easiest way to package and deploy a gadget is simply to zip\
    \ up all the relevant files and then rename it with the .gadget extension. However,\
    \ you cannot sign a zip file, and so there’s no way you can sign a gadget packaged\
    \ this way. A better way would be to package the gadget files using a CAB file,\
    \ which can then be signed digitally. The following sections show you how you\
    \ can package a gadget using a CAB file and then sign it using the tools available\
    \ in Visual Studio 2005. The SystemMonitor gadget is used for this example.\n\n\
    > Signing a Sidebar gadget is not mandatory."
  merge: -1
  pgno: 163
- img_proc: true
  md: "# Part I: Sidebar Gadgets\n\n# Step 1: Launching the Visual Studio 2005 Command\
    \ Prompt\n\nLaunch the Visual Studio 2005 Command Prompt by selecting Start ⇒\
    \ Programs ⇒ Visual Studio 2005 ⇒ Visual Studio Tools ⇒ Visual Studio 2005 Command\
    \ Prompt.\n\nChange into the directory containing the gadget you want to package\
    \ (SystemMonitor.gadget in this case) as shown in Figure 4-13.\n\n![](img/e79736c237e5bbe93c2846fd417f9382_164_0.png)\n\
    \n# Step 2: Creating a CAB File\n\nPackage all the gadget files into a CAB file.\
    \ Use the Cabinet Tool (`cabarc.exe`), with the following commands:\n\n```\ncabarc\
    \ -p -r N SystemMonitor.gadget *\n```\n\nThe parameters used are described in\
    \ the following table:\n\n| Parameter | Description |\n|---|---|\n| `-p` | Preserves\
    \ path names. |\n| `-r` | Recurses into subdirectories. |\n| `N` | Creates new\
    \ cabinet file. |\n| `*` | Includes all files and folders. |\n\nYou should get\
    \ the following output:\n\n```\nMicrosoft (R) Cabinet Tool - Version 5.00.2134.1\n\
    Copyright (C) Microsoft Corp. 1981-1999.\n\nCreating new cabinet 'SystemMonitor.gadget'\
    \ with compression 'MSZIP':\n -- adding gadget.xml\n -- adding SystemMonitor.html\n\
    \ -- adding Images\\icon.jpg\n```"
