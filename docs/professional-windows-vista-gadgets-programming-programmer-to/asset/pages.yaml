  md: "# Chapter 5: Sidebar Gadget Project\n\nEssentially, you read all available\
    \ incoming data from the `SerialPort` object using the `ReadExisting()` method.\
    \ All received data are appended to the TextBox control. The following shows a\
    \ block of GPS data sentences (each beginning with the “$” character):\n\n$GPVTG,,T,M,,N,K,N*2C\n\
    $GPGGA,001431.092,0118.2653,N,10351.1359,E,0,00,,-19.6,M,4.1,M,,0000*5B\n$GPGSA,A,1,,,,,,,,,,,,*1E\n\
    $GPGSV,3,1,12,20,00,000,,10,00,000,,25,00,000,,27,00,000,*79\n$GPGSV,3,2,12,03,00,000,,31,00,000,,24,00,000,,15,00,000,*78\n\
    $GPGSV,3,3,12,16,00,000,,05,00,000,,01,00,000,,26,00,000,*7D\n$GPRMC,001431.092,V,0118.2653,N,10351.1359,E,,,070805,,,N*72\n\
    $GPVTG,,T,M,,N,K,N*2C\n$GPGGA,001432.092,0118.2653,N,10351.1359,E,0,00,,-19.6,M,4.1,M,,0000*58\n\
    $GPRMC,001432.092,V,0118.2653,N,10351.1359,E,,,070805,,,N*71\n$GPVTG,,T,M,,N,K,N*2C\n\
    $GPGGA,001433.106,0118.2653,N,10351.1359,E,0,00,,-19.6,M,4.1,M,,0000*55\n$GPRMC,001433.106,V,0118.2653,N,10351.1359,E,,,070805,,,N*7C\n\
    \nBecause each GPS data sentence may be received in multiple blocks, you’ll use\
    \ a TextBox control to act as data storage. The TextBox control can contain only\
    \ a limited number of characters, though; it is cleared whenever its length reaches\
    \ 500 characters or more.\n\nOnly GPS data that begins with the $GPGGA and $GPRMC\
    \ prefixes are processed. The $GPGGA data sentences contain the latitude and longitude\
    \ information you want, and you’ll obtain the speed information from the $GPRMC\
    \ sentences. To process these sentences, you use the `processGPSData()` subroutine,\
    \ which is defined next:\n\n```\nVB 2005\nPrivate Sub processGPSData(ByVal str\
    \ As String)\n    Dim rawLatLng As Double\n    Try\n        '---separate the GPS\
    \ data into various fields---\n        Dim field() As String\n        field =\
    \ str.Split(\",\")\n        Dim lat, lng As Double\n        Select Case field(0)\n\
    \            Case \"$GPGGA\"\n                '---latitude---\n              \
    \  rawLatLng = Convert.ToDouble(field(2))\n                lat = (rawLatLng \\\
    \ 100) + _\n                    ((rawLatLng - ((rawLatLng \\ 100) * 100)) / 60)\n\
    \n                '---latitude is negative if South---\n                If field(3)\
    \ = \"S\" Then\n                    lat *= -1.0\n                End If\n\n  \
    \              '---longitude---\n                rawLatLng = Convert.ToDouble(field(4))\n\
    ```\n\n(continued)"
