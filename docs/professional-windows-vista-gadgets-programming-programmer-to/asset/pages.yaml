  md: '# # Testing the GPS Tracker


    You can test the GPS Tracker by first pairing up your Windows Mobile 5.0 Pocket
    PC with a Bluetooth-enabled GPS receiver. For the GPS, I used the Holux GPSlim
    236 Bluetooth-enabled GPS receiver (see Figure 5-3).


    ![](img/e79736c237e5bbe93c2846fd417f9382_189_0.png)


    Figure 5-3


    When pairing, select a serial port to use for communicating with the GPS receiver.
    This example uses COM7 for the connection. The COM port on your pocket PC may
    vary.


    To deploy the application, connect the pocket PC to your computer using Windows
    Mobile Device Center (also known as ActiveSync). Then, deploy your project in
    Visual Studio 2005 onto the pocket PC.


    You can now start recording your geographical locations. You might want to place
    the GPS receiver on the dashboard of your car to track your journey.


    The GPS coordinates are stored in the \Storage Card\GPS.txt file (assuming you
    have a storage card on your pocket PC). The content of the file looks like something
    this:


    ```

