  md: '# # Sidebar Gadget Project


    All of the concepts you’ve learned in the preceding chapters — the basics of Sidebar
    gadgets, objects exposed by Windows Sidebar, and so on — come together in this
    chapter as you create a compelling Sidebar gadget for a geo-tracking and geo-tagging.


    > > The gadget in this chapter uses a pocket PC, and a GPS receiver to capture
    geographical coordinates. If you do not have these devices, you can still try
    out the gadget by downloading the log files from this book’s download site at
    www.wrox.com.


    # ## A Geo-Tracking and Geo-Tagging Gadget


    How many times have you taken pictures during your vacation only to wonder a few
    months later where they were taken? When I go on holiday, I usually take a lot
    of pictures, but I have a bad memory and I am always at a loss when my friends
    later ask me where a particular photo was taken. And so I thought that it might
    be cool to find a way to associate a picture with a particular location on a map.
    And the process should be automated so that I need not manually write down the
    location where a picture was taken.


    With this as the motivation, I wrote a pocket PC application that logs the geographical
    data received by a GPS receiver. I then compared that data with the dates of the
    pictures taken with my digital camera, and I could deduce the approximate location
    that each picture was taken. In this chapter, you’ll see how to build such an
    application and how a picture can be displayed in a Sidebar gadget that hosts
    the Virtual Earth. In addition, using the GPS data recorded by the pocket PC,
    you can also plot a path showing the places that you have been. For simplicity,
    this project extends the Virtual Earth gadget that you saw in Chapter 2. Figure
    5-1 shows what the completed gadget looks like.'
