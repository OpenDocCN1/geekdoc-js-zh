    Note the following points:


    +   - The `System.Gadget.SideShow.enabled()` method enables you to check whether
    SideShow is enabled for your computer; it does not check whether there are any
    SideShow devices connected. Because you can only run Sidebar gadgets on Windows
    Vista (and SideShow is only supported on Windows Vista), this method always returns
    true. I always check to see whether SideShow is enabled before sending any data
    to the devices, but this step is somewhat redundant.

    - You first send glance data to the SideShow device by using the `System.Gadget.SideShow.setFriendlyName()`
    method. The content ID for glance data is 0.

    - To send content to the SideShow device, you send the SCF content in its XML
    representation. Chapter 8 shows the XML representation for the various SCF elements.

    - You use the `System.Gadget.SideShow.addText()` method to send SCF content to
    SideShow-enabled devices.

    - The `monitorMachine()` function is called repeatedly every second using the
    `setTimeout()` function available in JavaScript.


