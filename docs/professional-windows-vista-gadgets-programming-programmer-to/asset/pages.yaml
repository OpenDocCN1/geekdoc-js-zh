  md: '# 9 Interacting with SideShow Devices


    Sending content to a SideShow device is only one part of developing SideShow gadgets;
    the other part involves getting feedback from the device whenever a user interacts
    with it. This is important because it enables you to dynamically send information
    to the device whenever users require it.


    In this chapter, you learn how to interact with SideShow devices through the various
    events raised by it when the user uses your gadget.


    # Querying the Number of SideShow Gadgets Installed


    Remember, all SideShow gadgets installed on your local computer are saved in the
    Registry settings. Keys for system-wide (available to all users using the machine)
    SideShow gadgets can be found in:


    `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\SideShow\Gadgets`


    Keys for user-specific SideShow gadgets are found in:


    `HKEY_CURRENT_USER\Software\Microsoft\SideShow\Gadgets`


    Hence programmatically you can detect the different gadgets installed so that
    you can retrieve the GUID of each gadget. The following code snippet enables you
    to retrieve all the SideShow gadgets installed for the current user:


    ```

    VB 2005

    Imports Microsoft.Win32

    Imports Microsoft.SideShow

    ```'
