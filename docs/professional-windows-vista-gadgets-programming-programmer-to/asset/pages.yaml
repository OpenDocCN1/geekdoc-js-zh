    \n# ## Communications Between the Client and the Server\n\nThe next step is to\
    \ write the code for communicating with clients over a socket connection. Before\
    \ you do so, take a look at how the client will communicate with the server.\n\
    \nAs shown in Figure 10-6, upon connecting to the server, the client first sends\
    \ a `Send` message to the server. When the server receives a `Send` message, it\
    \ sends back to the client an image captured by the webcam (specifically, the\
    \ data contained within the `Image` global variable). The transfer takes place\
    \ synchronously and the client only sends another `Send` message when it is ready\
    \ to accept another image from the server. This technique prevents the server\
    \ from overwhelming the client, especially if the client is connected to the server\
    \ over a slow connection.\n\n![](img/e79736c237e5bbe93c2846fd417f9382_344_0.png)\n\
    \n**Figure 10-6**\n\nNow for the code. First, add a new class to the project and\
    \ name the file `WebCamClient.vb` (`WebCamClient.cs` for C#). Import the following\
    \ namespace:\n\n```\nVB 2005\nImports System.Net.Sockets\n\nC# 2005\nusing System.Net.Sockets;\n\
    ```"
