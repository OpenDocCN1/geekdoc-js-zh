  md: '# Part I: Sidebar Gadgets


    The System.Gadget object has three methods, described in the following table:


    | Method | Description |

    | --- | --- |

    | beginTransition | Specifies any script code that should be run when the gadget
    view is about to be updated and should be halted to shield the user from any transitional
    gadget effects in appearance. |

    | close | Ends a running instance of a gadget. |

    | endTransition | Animates into its new view state from a previous size or view
    state. |


    The System.Gadget object''s properties are described here:


    | Property | Description |

    | --- | --- |

    | background | Sets the background image using a file path, or to get the name
    of the current background image. |

    | docked | Determines whether or not the gadget making the script call is docked.
    |

    | name | Determines the gadget''s name as it appears in the gadget manifest file.
    |

    | opacity | Determines non-transparency as an integer. |

    | path | Determines the file path to the gadget''s source directory. |

    | platformVersion | Determines the version of the gadget platform upon which the
    gadget is running. |

    | settingsUI | Specifies the settings to display to the user, and also activates
    the UI allowing a user to bring up the options page. |

    | version | Determines the version of the Windows operating system upon which
    the gadget platform is running. |


    The code in Listing 3-1 shows a simple gadget that utilizes all the functions
    and properties of the System.Gadget object. It also has an options page named
    Settings.html. First, when the gadget is loaded, you print out the properties
    of the gadget and the location of the options page (via the settingsUI property).
    Next, you assign the event handlers for the onUndock, onDock, onSettingsClosed,
    and onShowSettings. Finally, you define the event handlers for these events. And
    in each of these event handlers, you print a message when each event is fired.'
