    # Running Multiple Instances of a Gadget


    Sometimes it makes sense to run multiple copies of the same gadget on the Sidebar.
    For example, you may want to use Clock gadget to display the current time in London
    and another to show the current time in Chicago. You all have to do is add another
    instance follow the same procedure to add a gadget to your Sidebar.


    # Sidebar Gadgets Are Not Persistent


    When you close a gadget, lose all information that you created in it. For example,
    you have the Notes gadget running in the Sidebar and have typed some text into
    it. When you close the Notes gadget and add it back to the Sidebar again, all
    the text that you have typed in previously is gone and will never come back again.
    When you close a Clock gadget that is currently displaying London time, it is
    reset to the computer''s default time zone when you add a new copy of the Clock
    gadget to the pane again.'
