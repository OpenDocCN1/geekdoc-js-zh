    # An Improved Approach to Localization


    If you observe carefully, you’ll notice that you need to maintain multiple versions
    of the SystemMonitor.html file in the various locale folders. This is clearly
    not a very efficient way to perform localization because any changes made to one
    file would have to be replicated across all the others. A better way would be
    to extract all the localized strings and store them in separate files, one for
    each locale.


    Figure 4-12 shows the modified SystemMonitor.gadget folder. js, a new subfolder
    that stores the localized string for the default locale (say, English), is added
    to the gadget root folder. The zh-CN folder now only contains the localized version
    of the manifest and a new subfolder, js, that holds the localized strings for
    the Chinese (Simplified) locale.


    ![](img/e79736c237e5bbe93c2846fd417f9382_160_1.png)


    Figure 4-12


    For this approach to work, you need to make some changes to the SystemMonitor.html
    file, as shown in Listing 4-10.


