- img_proc: true
  md: '# Chapter 1: Introduction to Windows Sidebar


    In Microsoft''s parlance, when a gadget is contained in the Sidebar pane it is
    known as Docked. When it is detached from the Sidebar pane, it is known as Undocked.


    When gadgets are detached from the Sidebar, they often expand, taking more screen
    space. This allows gadgets to expose more functionality than was possible when
    they were docked in the Sidebar. For example, Figure 1-8 shows the Weather gadget
    docked inside the Sidebar (left) and outside the Sidebar floating on the desktop
    (right).


    ![](img/e79736c237e5bbe93c2846fd417f9382_39_0.png)


    To re-attach (dock) a gadget to the Sidebar, right-click the gadget and select
    Attach to Sidebar, or just drag and drop it onto the Sidebar. You can also rearrange
    gadgets within the Sidebar pane by simply dragging and dropping them onto the
    desired location.


    Sidebar gadgets detached from the Sidebar remain visible even if the Sidebar is
    closed (hidden).


    # Adding Gadgets to Sidebar


    When you first boot up Windows Vista, the Sidebar contains four gadgets — Stocks,
    Clock, Slide Show, and Feed Headlines. As mentioned in the previous section, 11
    gadgets ship with Windows Vista. So how do you add them to the Sidebar? That''s
    easy. Simply right-click the Sidebar and select Add Gadgets. The Gadgets Gallery
    appears (see Figure 1-9).


    The Gadgets Gallery shows all the gadgets installed on the local computer (those
    that come with Vista as well as those you install yourself). To add a gadget to
    the Sidebar, double-click it. To uninstall a gadget from the local computer, right-click
    the gadget and select Uninstall.'
