  md: '# Part I: Sidebar Gadgets


    # **Enabling Script Debugging**


    I strongly recommend that you turn on script debugging whenever you are developing
    Sidebar gadgets. By default, the Sidebar suppresses any error it encounters when
    it loads a gadget, and that makes it really hard to detect problems with your
    JavaScript code, especially because you are likely to code it using a text editor
    like Notepad, which doesn''t catch mistakes such as incorrect casing, and so forth.


    To turn on script debugging, launch Internet Explorer 7 and go to Tools ⇒ Internet
    Options. Click the Advanced tab and uncheck the Disable Script Debugging (Other)
    checkbox (see Figure 4-19).


    ![](img/e79736c237e5bbe93c2846fd417f9382_170_0.png)


    Figure 4-19


    The next time Sidebar encounters an error with a gadget, you''ll see an error
    prompt like the one shown in Figure 4-20.


    **144**'
