  md: '# Chapter 1: Introduction to Windows Sidebar


    # Understanding the Gadgets World


    Microsoft seems to be using the term "gadgets" pretty casually, and at this moment
    there are three differentent types of gadgets offered by Microsoft:


    +   - Live gadgets (also known as Web gadgets)

    - SideShow gadgets

    - Sidebar gadgets


