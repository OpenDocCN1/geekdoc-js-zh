  md: '# # Introduction to Windows Sidebar


    After working on the successor to Windows XP for more than five years, Microsoft
    finally unveiled the latest version of the Windows operating system — Windows
    Vista — in early 2007. Windows Vista tout many new and improved features, most
    notably its enhanced security and reliability. Apart from that, there are a lot
    of face lifts, particularly in the way in which users interact with the operating
    system and how they manage the huge influx of information.


    Two important new features in Vista — Sidebar and SideShow — are the focus of
    this book. Windows Sidebar is a translucent panel anchored on your desktop that
    contains mini-applications known as Sidebar gadgets. These gadgets are designed
    for specialized purposes, such as displaying weather information, RSS feeds, and
    more. The main use of gadgets is to provide a quick and easy way for users to
    obtain information, eliminating the need to launch full-scale applications. For
    example, you can use the Stock gadget to monitor the pricing trends of a few selected
    stocks without needing to launch the web browser and visit stock exchange sites.


    In this chapter, you explore the basics of Windows Sidebar and how to install
    and use the various gadgets included in Windows Vista. In addition, you learn
    how to download and install third-party gadgets onto your Sidebar. (You tackle
    SideShow in the second half of the book.)'
  merge: -1
