  md: "# # Chapter 9: Interacting with SideShow Devices\n\nTo service the events fired\
    \ by the SideShow device, declare an instance of the `ScfSideShowGadget` class\
    \ within the class of your SideShow gadget and then declare it using the `WithEvents`\
    \ keyword (only applicable for VB 2005). For C#, you need to add the event handler\
    \ for each event separately.\nHere's the code:\n\n```\n```vb\nVB 2005\nPublic\
    \ Class Form1\n\n    Dim WithEvents gadget As ScfSideShowGadget\n\n    Private\
    \ _GadgetID As Guid = _\n        New Guid(\"{185E19BC-B468-42be-934C-7BB75C4C87FA}\"\
    )\n\n    Private Sub Form1_Load( _\n        ByVal sender As System.Object, _\n\
    \        ByVal e As System.EventArgs) Handles MyBase.Load\n\n        '---retrieve\
    \ the RSS gadget---\n        gadget = New ScfSideShowGadget(_GadgetID)\n    End\
    \ Sub\n\nEnd Class\n```\n```\n\n```\n```csharp\nC# 2005\npublic partial class\
    \ Form1 : Form\n{\n    ScfSideShowGadget gadget;\n\n    private Guid _GadgetID\
    \ =\n        new Guid(\"{185E19BC-B468-42be-934C-7BB75C4C87FA}\");\n\n    private\
    \ void Form1_Load(object sender, System.EventArgs e)\n    {\n        //---retrieve\
    \ the RSS gadget---\n        gadget = new ScfSideShowGadget(_GadgetID);\n    }\n\
    }\n```\n```\n\nThe following sections provide the details of using these events."
