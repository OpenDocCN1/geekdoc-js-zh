  md: "# Chapter 8: Simple Content Format\n\nThe following table describes these parameters:\n\
    \n| Parameter | Description |\n|---|---|\n| `registerForAllUsers` | A Boolean\
    \ value indicating if the gadget is installed for the user or all users on the\
    \ local computer. |\n| `gadgetID` | A GUID identifying the gadget’s ID. |\n| `endpointId`\
    \ | A GUID identifying the kind of content produced by the gadget. |\n| `friendlyName`\
    \ | A String identifying the gadget’s friendly name. This name will appear in\
    \ the SideShow window as well as on the main page of the SideShow device. |\n\
    | `startCmd` | A String identifying the path used to start the application containing\
    \ the gadget’s code. |\n| `iconFilePathName` | A String identifying the path of\
    \ the file containing the gadget’s icon. |\n| `onlineOnly` | A Boolean indicating\
    \ whether Windows should execute the gadget’s application when the user enters\
    \ the gadget on a device. |\n| `Policy` | A GadgetCachePolicies value indicating\
    \ how SideShow devices should control the caching of the gadget’s content. |\n\
    | `propertyPage` | A GUID identifying the gadget’s property page implementation.\
    \ |\n\nFor example, to install the gadget for all users on your local computer,\
    \ you set the first parameter to true, like this:\n\n```\nVB 2005\n'---register\
    \ the gadget---\nGadgetRegistration.Register( _\n    True, _\n    _GadgetID, _\n\
    \    ScfSideShowGadget.ScfEndpointId, _\n    \"RSS Aggregator Gadget\", _\n  \
    \  Application.ExecutablePath, _\n    \"C:\\Resources\\rss.ico\", _\n    False,\
    \ _\n    GadgetCachePolicies.KeepNewest, _\n    Nothing)\n\nC# 2005\n//---register\
    \ the gadget---\nGadgetRegistration.Register(\n    true,\n    _GadgetID,\n   \
    \ ScfSideShowGadget.ScfEndpointId,\n    \"RSS Aggregator Gadget\",\n    Application.ExecutablePath,\n\
    \    @\"C:\\Resources\\rss.ico\",\n    false,\n    GadgetCachePolicies.KeepNewest,\n\
    \    null);\n```"
  merge: -1
  pgno: 267
