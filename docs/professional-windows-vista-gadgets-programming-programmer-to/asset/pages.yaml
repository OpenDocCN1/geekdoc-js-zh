  md: '# Part II: SideShow Gadgets


    These steps ensure that when the user installs or uninstalls the application,
    the `CustomInstaller.dll` will be invoked and the appropriate methods within it
    will execute (`Installer_AfterInstall()` and `Installer_AfterUninstall()`).


    You also need to add custom data by setting the `CustomActionData` to `/allUsers="[ALLUSERS]"`
    so that you can pass the user''s selection (whether to install the application
    for everyone, or just for himself) from the setup window to the custom installer.
    To do that, just right-click the `CustomInstaller.dll` under the Install item
    and select Properties Window (see Figure 10-28). Set the `CustomActionData` property
    as shown in Figure 10-28.


    ![](img/e79736c237e5bbe93c2846fd417f9382_384_0.png)


    The final step is to build the project by right-clicking the project name in Solution
    Explorer and selecting Build.


    The installation files are now in the `Debug` folder of the `CameraClientSetup`
    project (see Figure 10-29).


    # Testing the Installation


    To test the installation, double-click the `setup.exe` file. Step through the
    various dialogs and select Just Me to install the application for yourself (see
    Figure 10-30).'
