    # Creating the .NET Component


    The next stage of the project is to create a .NET component callable from a Sidebar
    gadget. The purpose of this component is:


    +   - To return the list of coordinates (latitude and longitude) stored in the
    GPS.txt file.

    - To return the set of latitude and longitude that best match a particular time.
    For example, you took a photo on 20 December 2006 at 9.04.40 PM and you want to
    know where the photo was taken. To do so, you compare that date (and time) with
    the coordinates stored in the GPS.txt file. Figure 5-4 shows the nearest location
    found for this example. Observe that 12/20/06 9:04:40 PM is between 12/20/06 9:04:39
    PM and 12/20/06 9:04:45 PM, so the location returned would be 1.374455 and 103.93118.


    ![](img/e79736c237e5bbe93c2846fd417f9382_190_0.png)


    > Chapter 4 discusses how to call a .NET assembly from within your Sidebar gadget
    using .NET Interop.


