    # Enhancing the Gadget


    Sidebar gadgets have two states — docked and undocked. In the docked state, gadgets
    are hosted in the Sidebar pane, have a limited size, and according to Microsoft''s
    design guidelines for Sidebar gadgets, have a width of 130 pixels.


    Sidebar gadgets can be undocked, which is when they float on the desktop and are
    not docked in the Sidebar pane. For undocked gadgets, Microsoft recommends a maximum
    size of 400 × 400 pixels.'
