  md: "# Chapter 3: Exploring Sidebar Gadgets APIs\n\n# System.Shell.Item\n\nThe System.Shell.Item\
    \ object returns detailed information about an item in the shell (such as files,\
    \ folders, and shortcuts). It currently has the following properties:\n\n| Property\
    \ | Description |\n| --- | --- |\n| isFile | Checks whether the previously selected\
    \ shell item is a Microsoft Windows file; and is neither a folder nor a shortcut\
    \ (.Lnk) file. This property is now OBSLETE. |\n| isFileSystem | Indicates whether\
    \ the specified item is a critical part of the file system. |\n| isFolder | Checks\
    \ whether the selected shell item is a Windows folder (and is neither a folder\
    \ nor a shortcut). |\n| isLink | Checks whether the selected shell item is a Windows\
    \ shortcut (. Lnk) file (and is neither a folder nor folder). |\n| link | Returns\
    \ the path to the item, if the previously specified is a link file (.Lnk). |\n\
    | modifyDate | Returns the last modification date of a file. |\n| name | Returns\
    \ the name of the selected Windows Shell item. |\n| path | Returns the item's\
    \ path and name. |\n| SHFolder | Returns the current folder containing the selected\
    \ item. |\n| size | Returns the size in bytes of the selected item. |\n| type\
    \ | Returns the type (application or document extension) of the designated item,\
    \ as a string. |\n\nThe following example shows how to display the attributes\
    \ of each file in folder1:\n\n```\nvar result = document.getElementById(\"result\"\
    );\nvar destFolder = System.Shell.ItemFromPath(\"C:\\folder2\");\nvar sourceFolder\
    \ = System.Shell.ItemFromPath(\"C:\\folder1\");\n\n//copies all files in folder1\
    \ to folder2-\nfor (var i = 0; i=sourceFolder.SHFolder.Items.count; i++) {\nvar\
    \ item = sourceFolder.SHFolder.Items.item(i);\n\n//--display all the attributes\
    \ of each file----\nresult.innerHTML += \"isFile: \" + (item.isFile || item.isLink)\
    \ + \"<br>\" + +\n  \"isFileSystem: \" + item.isFileSystem + \"<br>\" + +\n  \"\
    isFolder: \" + item.isFolder + \"<br>\" + +\n  \"isLink: \" + item.isLink + \"\
    <br>\" + +\n  \"modifyDate: \" + item.modifyDate + \"<br>\" +\",\n```"
