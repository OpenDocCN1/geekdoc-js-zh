  md: "# Chapter 2: Programming Windows Sidebar Gadgets\n\nMicrosoft publishes a useful\
    \ guide for developing Sidebar gadgets. You can download those design guidelines\
    \ from http://msdn.microsoft.com/En-US/library/aa94179.aspx.\n\nSidebar gadgets\
    \ can also have an options page, which allows users to customize the behavior\
    \ of the gadget. In this section, you work with gadget states and add Options\
    \ for your gadget.\n\n# Docking and Undocking the Sidebar Gadget\n\nWhen a gadget\
    \ changes its state (from docked to undocked or vice versa), you can programmatically\
    \ modify its behavior by servicing two events: onDock and onDock. As you might\
    \ expect, onDock is triggered when the gadget is docked, and onDock is triggered\
    \ when a gadget is undocked. To service these events, use the System.Gadget class,\
    \ which defines methods, events, and properties that are used to identify and\
    \ specify gadget configuration options in the Microsoft Windows Sidebar environment.\n\
    \nYou learn more about the System.Gadget class in Chapter 3.\n\nModify the VirtualEarth.html\
    \ file by adding the following code:\n\n```\n<script>\n--variable for the map--\n\
    var map = null;\n\n--when the gadget is undocked or docked--\nSystem.Gadget.onUndock=CheckDockState;\n\
    System.Gadget.onDock=CheckDockState;\n\n--check if the gadget is undocked or docked--\n\
    function CheckDockState() {\n    if (!System.Gadget.docked) {\n        UndockedState();\n\
    \    } else {\n        DockedState();\n    }\n}\n\n--the gadget is docked--\n\
    function DockedState() {\n    with (document.body.style) {\n        width = \"\
    130px\";\n        height = \"265px\";\n    }\n\n    container = document.getElementById(\"\
    myMap\");\n    with (container.style)\n}\n(continued)\n```"
