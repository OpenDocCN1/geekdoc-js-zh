  md: "# Chapter 3: Exploring Sidebar Gadgets APIs\n\nWhen files are dropped onto\
    \ the gadget, the `onDropped()` function is called and the `chooseFolder()` method\
    \ is called to allow the user to choose a folder to copy the dropped files. The\
    \ `itemFromFileDrop()` method enables you to obtain the files that are dropped\
    \ (as a collection of `System.Shell.Item` objects). The files are then copied\
    \ to the destination folder using the `copyHere()` method. If you want to move\
    \ the files instead of copying them, use the `moveHere()` method instead:\n\n\
    ```\nfolder.moveHere(System.Shell.itemFromFileDrop(event.dataTransfer, i));\n\
    ```\n\nThe `itemFromPath()` method returns a collection of `System.Shell.Item`\
    \ objects associated with a specified path. For example, the following code copies\
    \ all the files stored in `C:\\folder1` into `C:\\folder2`:\n\n```\nvar destFolder\
    \ = System.Shell.itemFromPath(\"C:\\\\\\\\folder2\");\nvar sourceFolder = System.Shell.itemFromPath(\"\
    C:\\\\\\\\folder1\");\n\n//---copies all the files in folder1 into folder2---\n\
    for (var i = 0; i<sourceFolder.SHFolder.Items.count; i++ ){\n    var item = sourceFolder.SHFolder.Items.item(i);\n\
    \    destFolder.SHFolder.copyHere( item, 16 + 256 + 512 );\n}\n```\n\nThe `knownFolder()`\
    \ method takes in a string representing a well-known folder and returns a `System.Shell.Folder`\
    \ object. The following code displays the total number of items on the desktop:\n\
    \n```\nvar result = document.getElementById(\"result\");\nvar folder = System.Shell.knownFolder(\"\
    Desktop\")\nresult.innerHTML = folder.Items.count;\n```\n\nHere’s a list of valid\
    \ well-known folders:\n\n+   - Desktop\n- Startup\n- StartMenu\n- Documents\n\
    - Programs\n- CommonStartup\n- CommonPrograms\n- PublicDesktop\n- PublicFavorites\n\
    - PublicDocuments\n- System\n- SystemX86\n- Profile\n- Windows\n- Pictures\n-\
    \ Music\n- Videos\n- ProgramFiles\n- ProgramFilesCommon\n- ProgramFilesX86\n-\
    \ ProgramFilesCommonX86\n- AdminTools\n- CommonAdminTools\n- PublicMusic\n- PublicPictures\n\
    - PublicVideos\n- UserProfiles\n- Downloads\n- PublicDownloads\n- GadgetsUser\n\
    - RecycleBinFolder"
