    # Time and Time Zones


    You can obtain information about the different time zones using the following
    objects:


    +   - System.Time

    - System.Time.TimeZone


    # System.Time


    The `System.Time` object enables you to obtain time information of the current
    system. It exposes a `System.Time.timezones` collection of `System.Time.TimeZone`
    objects.


    Here''s how you can obtain the collection of `System.Time.TimeZone` objects:


    ```

    var timeZones = System.Time.timeZones;

    ```


    The `System.Time` object has only one method, `getLocalTime()`, which returns
    the local time based on the specified time zone:


    It also has only one property, `currentTimeZone`, which returns the current time
    zone as a `System.Time.TimeZone` object.


    The following example shows how you can display the current time in the current
    time zone:


    ```

    var result = document.getElementById("result");

    var timeZone = System.Time.currentTimeZone;

    result.innerHTML = "Local Time: " + System.Time.getLocalTime(timeZone);

    ```'
