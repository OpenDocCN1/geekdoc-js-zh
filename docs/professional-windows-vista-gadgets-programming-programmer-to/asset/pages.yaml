  md: "# Part II: SideShow Gadgets\n\n# Sending Notifications to SideShow Devices\n\
    \nIn addition to servicing the events raised by the SideShow device, you can also\
    \ send notifications to it by using the `ShowNotification()` method:\n\n```\n\
    VB 2005\nDim expire As DateTime = Now.AddSeconds(5)\ngadget.ShowNotification(1,\
    \ \"New feeds downloaded!\", _\n    \"There are new feeds available\", Nothing,\
    \ _\n    expire)\n\nC# 2005\nDateTime expire = System.DateTime.Now.AddSeconds(5);\n\
    gadget.ShowNotification(1, \"New feeds downloaded!\",\n    \"There are new feeds\
    \ available\", null, expire);\n```\n\nFigure 9-12 shows how the notification window\
    \ looks on the SideShow device. You can configure the notification window to disappear\
    \ after a certain period of time. This is set via the last parameter of `ShowNotification()`.\n\
    \n![](img/e79736c237e5bbe93c2846fd417f9382_330_0.png)\n\nFigure 9-12\n\n> The\
    \ notification window does not automatically disappear after the indicated time.\
    \ This problem seems to exist only on the Simulator."
