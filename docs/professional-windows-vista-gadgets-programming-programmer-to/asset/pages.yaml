  md: "# Part I: Sidebar Gadgets\n\nSideShow gadgets are applications that work with\
    \ auxiliary devices (known appropriately as SideShow\ndevices). SideShow gadgets\
    \ are covered in detail in Chapters 6–10.\n\nAnd of course, Sidebar gadgets are\
    \ the focus of this chapter.\n\n# Built-in Sidebar Gadgets\n\nWindows Vista comes\
    \ with 11 cool Sidebar gadgets in various views. You can use\n\n+   - Calendar\
    \ — A simple calendar application that displays data in various views. You cannot\n\
    change the current date, but it is useful if you need to quickly refer to a particular\
    \ date.\n- Clock — Displays time in the zone you select. You can change the analog\
    \ clock face.\n- Contacts — Displays information stored in your Windows Contacts\
    \ application.\nThis gadget offers a quick way to find contacts without launching\
    \ the Windows\nContacts application.\n- CPU Meter — Displays the CPU and memory\
    \ usage of your computer.\n- Currency — A currency converter that allows you to\
    \ convert to four currencies at once. The\napplication goes online to fetch the\
    \ latest exchange rates, and the results are quite accurate.\n- Feed Headlines\
    \ — An RSS feeds aggregator that shows your Internet explorer feed\nsubscriptions.\n\
    \ Notes — Virtual Post-It notes. You can change the color as well as additional\
    \ pages.\n- Picture Puzzle — A tile game that requires you to piece together the\
    \ various parts of a photo.\n- Slide Show — Displays photos stored on your local\
    \ computer as a slide show. You can set the\ndelay between each photo, as well\
    \ as specify the transition effect.\n- Stocks — Displays stock information in\
    \ real time. Choose the stocks you are interested in and\nmonitor their price\
    \ movements.\n- Weather — Displays current weather information as well as the\
    \ forecast for the next three days.\n\n| Windows Sidebar Shortcuts | Here are\
    \ some time-saving keyboard shortcuts to use with Windows Sidebar. Windows + spacebar\
    \ — Toggles showing and hiding Windows Sidebar.\nangely, this shortcut may not\
    \ work when at least one gadget is undocked\nfrom the Sidebar pane.\nWindows +\
    \ G — Cycle through the gadgets in Windows Sidebar. |\n\n# Detaching Sidebar Gadgets\
    \ from Sidebar\n\nTo detach (undock) a gadget from the Sidebar that it floats\
    \ on your desktop, right-click the\ngadget and select Detach from Sidebar. Alternatively,\
    \ you can drag gadgets from the Sidebar and drop\nthem onto the desktop."
