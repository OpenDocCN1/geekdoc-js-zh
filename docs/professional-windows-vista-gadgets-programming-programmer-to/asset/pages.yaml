    ```\n\n# Handling SideShow Devices Events\n\nOnce SCF content is sent to the device,\
    \ users primarily interact with the gadget through the various buttons available\
    \ on the device. However, each time the user interacts with the SCF content that\
    \ you sent to the device, the device actually triggers some events that you can\
    \ service on your application’s end. The following events are supported:\n\n|\
    \ Event | Fires when ... |\n| :--- | :--- |\n| DeviceAdded | A device is added\
    \ (connected) to the gadget. |\n| DeviceRemoved | A device connected to a gadget\
    \ is removed (disconnected) from the gadget. |\n| AllDevicesRemoved | The last\
    \ device that is connected to the gadget is removed (disconnected) from the gadget.\
    \ |\n| GadgetEnter | The user enters the first content page of a gadget. |\n|\
    \ GadgetExit | The user exits the gadget and returns to the main page. |\n| MenuSelect\
    \ | The user selects an item on a menu page. |\n| ContentNavigate | The user navigates\
    \ between pages. |\n| ContentMissing | The user tries to load a page/item that\
    \ is not present on the device. |\n| ContextMenuSelect | The user selects an item\
    \ on a context menu. |"
