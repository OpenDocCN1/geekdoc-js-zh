  md: "# # Chapter 10: SideShow Project\n\nIn the Form1_Load event, preview the video\
    \ by calling the PreviewVideo() subroutine and then spin off a separate thread\
    \ to listen for incoming connections from clients:\n\n```\n```vb\nPrivate Sub\
    \ Form1_Load(\n    ByVal sender As System.Object, _\n    ByVal e As System.EventArgs)\
    \ _\n    Handles MyBase.Load\n\n    '---preview the selected video source---\n\
    \    PreviewVideo(PictureBox1)\n\n    '---listen for incoming connections from\
    \ clients---\n    t = New System.Threading.Thread(AddressOf Listen)\n    t.Start()\n\
    End Sub\n```\n```\n\n```\n```csharp\nprivate void Form1_Load(object sender, EventArgs\
    \ e)\n{\n    //---preview the selected video source---\n    PreviewVideo(PictureBox1);\n\
    \n    //---listen for incoming connections from clients---\n    t = new System.Threading.Thread(Listen);\n\
    \    t.Start();\n}\n```\n```\n\nFinally, if Form1 is closed, abort the thread\
    \ (for listening for connections) and end the application:\n\n```\n```vb\nPrivate\
    \ Sub Form1_FormClosing(\n    ByVal sender As Object, _\n    ByVal e As System.Windows.Forms.FormClosingEventArgs)\
    \ _\n    Handles Me.FormClosing\n    '---abort the thread---\n    t.Abort()\n\
    \    '---end the application---\n    End\nEnd Sub\n```\n```\n\n```\n```csharp\n\
    private void Form1_FormClosing(object sender, FormClosingEventArgs e)\n{\n   \
    \ //---abort the thread---\n    t.Abort();\n    //---end the application---\n\
    \    System.Environment.Exit(0);\n}\n```\n```\n\nThat's it! The server is ready\
