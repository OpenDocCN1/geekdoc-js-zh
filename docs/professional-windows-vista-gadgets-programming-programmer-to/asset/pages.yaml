  md: "# # Chapter 2: Programming Windows Sidebar Gadgets\n\n# ## Tidying up the Gadget\n\
    \nAs your gadget gets more and complex, it is always a good idea to organize it\
    \ into separate files so that you have a clean separation of UI and logic. With\
    \ that, let's tidy up your gadget a bit and store the JavaScript code and the\
    \ CSS styles in separate files.\n\nWith your gadget, create two additional folders:\n\
    \n+   - js — For storing JavaScript files\n- css — For storing CSS files\n\nThe\
