  md: '# Part II: SideShow Gadgets


    # Registry Settings for SideShow Gadgets


    All SideShow gadgets installed on your local computer are saved in the Registry
    settings. The keys for system-wide (available to all users in the machine) SideShow
    gadgets can be found in:


    `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\SideShow\Gadgets`


    The keys for user-specific SideShow gadgets can be found in:


    `HKEY_CURRENT_USER\Software\Microsoft\SideShow\Gadgets`


    For example, on my Windows Vista machine, I have three SideShow gadgets installed
    system-wide (see Figure 6-26). These gadgets are visible to anyone using my machine.


    ![](img/e79736c237e5bbe93c2846fd417f9382_232_0.png)


    In contrast, gadgets installed for a particular user are only visible to that
    particular user. I have two SideShow gadgets installed on my computer that are
    only visible to me (see Figure 6-27).


    ![](img/e79736c237e5bbe93c2846fd417f9382_232_1.png)


    206'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Chapter 6: Introduction to Windows SideShow


    > **Determining SideShow Gadget Scope**


    It''s the job of the SideShow developer to determine the scope of the SideShow
    gadget. To make your gadget available to all users, simply create a new registry
    key for your gadget in `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\SideShow\Gadgets`.
    Otherwise, create the key in `HKEY_CURRENT_USER\Software\Microsoft\SideShow\Gadgets`.
    Chapter 8 discusses this in more detail.


    # Interaction Between SideShow Devices and the User


    Most of the time, a SideShow gadget pushes data to a SideShow device. However,
    there are instances in which a gadget needs to obtain the result of an interaction
    with the user. For example, you can use the Windows Media Player gadget to browse
    the media library on your computer and then play a song directly using the SideShow
    device (see Figure 6-28).


    ![](img/e79736c237e5bbe93c2846fd417f9382_233_0.png)


    ![](img/e79736c237e5bbe93c2846fd417f9382_233_1.png)'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Part II: SideShow Gadgets


    The Windows Media Player gadget must know which song the user wants to play and
    then send the information back to Windows Media Player so that it can play it
    the song. A SideShow gadget must react to events fired by the SideShow device
    if it needs to interact with the user.


    # Offline and Online Gadgets


    Gadgets that require the computer to be always online are known as online gadgets.
    For example, the Windows Media Player, which requires the computer to be always
    on so that it can play a song, is an online gadget.


    Gadgets that can work even if the computer is off (shut down, sleeping, or hibernating)
    are known as offline gadgets. The Office Outlook 2007 Calendar gadget is an example
    of an offline gadget. It can work even when the computer is shut down.


    By default, SideShow gadgets are offline gadgets.


    SideShow gadgets can be marked as `OnlineOnly`. This is set in the `OnlineOnly`
    registry key of a gadget (see Figure 6-29 for an example of the Windows Media
    Player gadget as indicated by the `FriendlyName` key). If you try to use a gadget
    that is marked as `OnlineOnly` when a computer is in Sleep or Hibernate mode,
    the SideShow device prompts you to power up the computer. If the computer is shut
    down, you’re asked to power it up.


    ![](img/e79736c237e5bbe93c2846fd417f9382_234_0.png)


    Figure 6-29


    > A SideShow gadget is marked `OnlineOnly` if its `OnlineOnly` registry key is
    set to 1. Otherwise it is set to 0.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Chapter 6: Introduction to Windows SideShow


    # Gadget Needs


    If SideShow gadgets have a UI, users can interact with it. SideShow gadgets meant
    to run in the background without user intervention do not need a UI.


    For SideShow devices to work, SideShow gadgets must be running so that they send
    data to the devices at regular time intervals. When a user logs on to Windows,
    Windows automatically launches all the SideShow gadgets that have a `StartCommand`
    key in the Registry.


    Because all gadgets are invoked during login time, most UI gadgets should not
    have the `StartCommand` registry key thus preventing Windows from automatically
    launching them and making them visible. For gadgets that have a UI, it is usually
    better for the user to manually launch them.


    A gadget must also check to ensure that there are no other instances of itself
    running because multiple instances of a gadget may send duplcate data to SideShow
    devices, causing data congestions on the devices.


    A gadget must be capable of terminating itself when it is disconnected from a
    SideShow device; keeping it running when there is no device connected to it just
    wastes resources.


    > Chapter 8 discusses how to detect devices that are disconnected.


    # Summary


    In this chapter, you have seen how SideShow works and how you can download and
    install additional gadgets. You have also explored the characteristics of a typical
    SideShow gadget and how Windows interacts with it. In the next chapter, you get
    a taste of writing your own SideShow gadget.'
