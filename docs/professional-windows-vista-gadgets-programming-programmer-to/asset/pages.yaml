    # ## System Information


    To access basic information (such as system resource, user name, Windows directory,
    and so on) contained within the Windows environment variables, you can use the
    System.Environment object.


    The System.Environment object enables you to obtain values of environment variables.
    It contains one property, machineName, which holds the name of the machine on
    the group or network.'
