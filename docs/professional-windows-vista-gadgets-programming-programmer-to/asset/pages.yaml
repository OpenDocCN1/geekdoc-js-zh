    Once the glance data is set, it’s time to build the actual content for the gadget.


    # Types of SCF Content


    There are three types of Simple Content Format: content pages, dialog pages, and
    menu pages.


    A content page displays text and images, and is often used for displaying information.
    Figure 8-5 shows an example of a content page.


    ![](img/e79736c237e5bbe93c2846fd417f9382_271_1.png)'
