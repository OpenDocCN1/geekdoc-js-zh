    The idea behind Dashboard is similar to that of Sidebar: providing easy access
    to commonly required information. Ironically, Apple has been accused of copying
    the ideas behind Dashboard from Yahoo! Widget Engine (see the following figure),
    more famously known as Konfabulator.


    (Continued)'
