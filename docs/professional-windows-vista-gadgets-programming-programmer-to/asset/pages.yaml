  md: "# # 8 Simple Content Format\n\nThe Windows SideShow platform uses an XML-based\
    \ content format known as Simple Content Format (SCF). SCF defines the various\
    \ UI elements that you see on a SideShow device. In this chapter, you learn how\
    \ the various SCF elements make up the UI of a SideShow gadget.\n\nFirst, though,\
    \ is a brief review of how to send content to a SideShow device.\n\n# ## Sending\
    \ Content to a SideShow Device\n\nYou load an existing SideShow gadget by creating\
    \ an instance of the `ScfSideShowGadget` class by passing it the GUID of the gadget:\n\
    \n```\n**VB 2005**\n```vb\nDim gadget As ScfSideShowGadget = New ScfSideShowGadget(_GadgetID)\n\
    ```\n**C# 2005**\n```csharp\nScfSideShowGadget gadget = new ScfSideShowGadget(_GadgetID);\n\
    ```\n```\n\nYou then use the `AddGlanceContent()` method to send glance data to\
    \ the SideShow device:\n\n```\n**VB 2005**\n```vb\ngadget.AddGlanceContent(\"\
    RSS feeds updated on \" & vbCrLf & _ Now.ToString)\n```\n**C# 2005**\n```csharp\n\
    gadget.AddGlanceContent(\"RSS feeds updated on \" +\n    System.Environment.NewLine\
    \ +\n    System.DateTime.Now.ToString());\n```\n```"
  merge: -1
  pgno: 263
- img_proc: true
  md: "# # Part II: SideShow Gadgets\n\nFrom there, you can use the `AddContent()`\
    \ method to send some images to the SideShow device, like this:\n\n```\n```vb\n\
    ' VB 2005\ngadget.AddContent(5000, _\n    ImageContentTransforms.ReduceColorDepth\
    \ Or _\n    ImageContentTransforms.KeepAspectRatio, _\n    My.Resources.Resource1.digg)\n\
    ```\n\n```csharp\n// C# 2005\ngadget.AddContent(5000,\n    ImageContentTransforms.ReduceColorDepth\
    \ |\n    ImageContentTransforms.KeepAspectRatio,\n    Resource1.digg);\n```\n\
    ```\n\nYou also use `AddContent()` to display a menu page, but this time you pass\
    \ it more complicated objects, like this:\n\n```\n```vb\n' VB 2005\ngadget.AddContent(\
    \ _\n    Scf.Menu( _\n        ScfSideShowGadget.HomePageContentId, _\n       \
    \ \"Feeds\", _\n        ScfSelectAction.Target, _\n        Scf.Item(Nothing, 5000,\
    \ True, True, Nothing, _\n            2, \"Digg.com\"), _\n        Scf.Item(Nothing,\
    \ 5001, True, True, Nothing, _\n            3, \"DevX.com\"), _\n        Scf.Item(Nothing,\
    \ 5002, True, True, Nothing, _\n            4, \"MSDN.com\")))\n```\n\n```csharp\n\
    // C# 2005\ngadget.AddContent(\n    Scf.Menu(\n        ScfSideShowGadget.HomePageContentId,\n\
    \        \"Feeds\",\n        ScfSelectAction.Target,\n        Scf.Item(null, 5000,\
    \ true, true, null,\n            2, \"Digg.com\"),\n        Scf.Item(null, 5001,\
    \ true, true, null,\n            3, \"DevX.com\"),\n        Scf.Item(null, 5002,\
    \ true, true, null,\n            4, \"MSDN.com\")));\n```\n```\n\nSideShow-enabled\
    \ devices support a content format known appropriately as Simple Content Format\
    \ (SCF). The SCF defines a set of XML elements and attributes that collectively\
    \ define the way information is displayed on a SideShow-enabled device.\n\nIn\
    \ the next few sections, you learn about the different types of SCF content you\
    \ can send to a SideShow device."
