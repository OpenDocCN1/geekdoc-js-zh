    # Summary


    This chapter showed you the basics of developing your own SideShow gadgets using
    the Windows SideShow .NET Framework Components 1.0 managed class and Visual Studio
    2005. You learned how to send glance data to a SideShow-enabled device so that
    users can see the status of a gadget. You also downloaded RSS feeds from the web
    and then formulated the content of the feeds to be displayed on SideShow-enabled
    devices.


    In the next chapter, you examine the Simple Content Format (SCF) format in more
    detail and learn how each element of the SCF affects the visual layout of a SideShow
    content page.'
