  md: "# Chapter 3: Exploring Sidebar Gadgets APIs\n\n# System.Gadget.Settings.ClosingEvent\n\
    \nThe System.Gadget.Settings.ClosingEvent object provides the status of the options\
    \ page and gives you the capability to prevent options page from closing. It has\
    \ the following properties:\n\n| Property | Description |\n|---|---|n| Action\
    \ | An enumeration containing the status of the settings (options) page. |\n cancel\
    \ | Allows the user capability to cancel the gadget settings dialog. |\n cancellable\
    \ | Detects whether the user can successfully cancel the gadget settings dialog.\
    \ |\n closeAction | Detects whether the settings dialog was closed. |\n\nIn the\
    \ previous section, you saw that the System.Gadget.onSettingsClosing is fired\
    \ in the options page is closing, and the System.Gadget.onSettingsClosed is fired\
    \ in the main gadget when the options page has closed.Handlers for these two events\
    \ have an event parameter of type System.Gadget.Settings.ClosingEvent. Using this\
    \ parameter, you can know whether the user clicked OK or Cancel:\n\n```\n--in\
    \ the gadgetOs main page--\n--when the settings page has closed--\nfunction SettingsClosed(event)\n\
    {\n    if (event.closeAction == event.Action.commit) {\n        DisplayValue(\"\
    User clicked OK\");\n    } else {\n        DisplayValue(\"User clicked Cancel\"\
    );\n    }\n}\n```\n\nThe Action property has two enumerations: commit and cancel.\n\
    \nTo make sure that the options page does not close until some criteria is satisfied,\
    \ you can use the System.Gadget.Settings.ClosingEvent property in the System.Gadget.onSettingsClosing\
    \ handler (in the options page), like this:\n\n```\n--in the options page--\n\
    function onSettingsClosing(event)\n{\n    if ((some_condition) && (!event.cancellable))\
    \ {\n        //--prevent the options page from closing----\n        event.cancel=true;\n\
    \    }\n}\n```\n\n71"
