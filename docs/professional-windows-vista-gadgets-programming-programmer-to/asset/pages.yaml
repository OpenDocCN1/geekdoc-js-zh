    One advantage of using IE to test your gadget UI is that you can use the Internet
    Explorer Developer Toolbar (downloadable from www.microsoft.com/downloads/details.aspx?familyid=e59c3964-672d-4511-bb3e-2d5e1db91038&displaylang=en)
    to dynamically tweak your HTML code.


    After you’ve downloaded and installed the IE Developer, activate it by selecting
    Tools ⇢ Toolbars ⇢ Explorer Bar ⇢ IE Developer Toolbar (see Figure 4-22).


