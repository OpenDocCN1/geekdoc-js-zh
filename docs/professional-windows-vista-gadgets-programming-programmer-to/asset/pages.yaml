    # Configuring SideShow Devices


    A SideShow gadget works by communicating with a SideShow-enabled device by sending
    it information constantly. Information received by the SideShow-enabled device
    is displayed on the screen. Hence, even if the computer is switched off, the SideShow
    device can still display information from the gadget (from its cache). However,
    in this example, the gadget would not be able to send updated information to the
    SideShow device.


    There are exceptions to the preceding statement. The Reversi and Columns gadgets
    do not work based on this communication model. Technically, a SideShow device
    is powered using the .NET Micro Framework, and these two are native .NET Micro
    Framework applications. The key advantage of writing native applications is that
    you can access all the device capabilities from within your'
