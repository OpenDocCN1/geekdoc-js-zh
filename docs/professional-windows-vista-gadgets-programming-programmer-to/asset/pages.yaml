  md: '# 2

    Programming Windows Sidebar Gadgets


    This chapter shows you how to build your Sidebar gadgets. It walks you through
    the process of building a complete gadget so that you understand the various components
    that make up one. By the end of this chapter, you''ll have a solid foundation
    for creating compelling Sidebar gadgets.


    # Components of a Sidebar Gadget


    A Sidebar gadget consists of the following components:


    +   An XML file named `gadget.xml` (required) that contains information about
    the gadget as well as the links to the main HTML file for the gadget.

    An HTML file (required) containing the markup for the main UI of the gadget.

    One or more CSS files (optional) that contain all the CSS styles used by your
    gadget. The CSS styles can be either stored in these CSS files, or embedded within
    the HTML file.

    One or more JavaScript files (optional) that contain all the JavaScript code used
    by your gadget. Like the CSS files, the JavaScript code can be either stored separately
    or embedded within your HTML file.

    A Settings file (optional) containing the markup for the Options page for your
    gadget, allowing users to customize the behavior of your gadget.'
  merge: -1
  pgno: 45
- img_proc: true
  md: "# Part I: Sidebar Gadgets\n\nHere's the typical structure of the gadget.xml\
    \ manifest file:\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<gadget>\n\
    \  <name>Virtual Earth</name>\n  <namespace>www.learn2develop.net</namespace>\n\
    \  <version>1.0.0</version>\n  <author>Wei-Meng Lee</author>\n  <info url=\"http://www.learn2develop.net\"\
    \ />\n  <logo src=\"Images/logo.jpg\" />\n</author>\n  <copyright>&#169; 2007</copyright>\n\
    \  <description>Microsoft Virtual Earth Sidebar Gadget</description>\n  <icons>\n\
    \    <icon height=\"48\" width=\"48\" src=\"Images/icon.jpg\" />\n  </icons>\n\
    \  <hosts>\n    <host name=\"sidebar\">\n      <base type=\"HTML\" apiVersion=\"\
    1.0.0\" src=\"VirtualEarth.html\" />\n      <permissions>Full</permissions>\n\
    \      <platform minPlatformVersion=\"1.0\" />\n      <defaultImage src=\"Images/Icon.png\"\
    \ />\n    </host>\n  </hosts>\n</gadget>\n```\n\nSome of the important elements\
    \ to look for:\n\n+   <base> — The src attribute specifies the main HTML file\
    \ containing the UI of your gadget. In this case, the VirtualEarth.html file contains\
    \ the UI for your gadget.\n\n+   <version> — Used to identify the version of a\
    \ gadget. If you try to install a gadget that has already been installed on your\
    \ computer, Windows Sidebar uses this version number for comparison and asks whether\
    \ you want to replace the gadget with the current version.\n\n+   <logo> — Displays\
    \ an image next to the author's name in the expanded details area of the Add Gadget\
    \ window.\n<icons> — Specifies the icon used to display your gadget in the Add\
    \ Gadget window. You can have multiple <icon> elements within the <icons> element.\
    \ The height and width attributes specify which icon to use for a particular dimension.\
    \ For example, icons displayed in the Add Gadget window are displayed in 48 x\
    \ 48 pixels, and the image that is auto-scaled to 48 x 48 pixels. If the <icon>\
    \ element is not specified, a default icon is used instead.\n\n+   <permissions>\
    \ — In the current version of the Sidebar, only full trust is supported.\n\n+\
    \   <defaultImage> — The image that will be displayed when the user drags a gadget\
    \ from the Add Gadget window. If this element is not specified, the image specified\
    \ by the <icon> element is used instead."
  merge: -1
