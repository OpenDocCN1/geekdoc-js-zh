  md: '# # Chapter 1: Introduction to Windows Sidebar


    # ## Windows Sidebar, Apple Dashboard, and Yahoo! Konfabulator


    Critics of Microsoft are quick to complain that Microsoft copied the Sidebar concept
    from its competitors, most notably Apple and Yahoo!. Apple''s Mac OS v10.4 has
    a new feature known as Dashboard (shown in the following figure), which contains
    mini-applications called Dashboard Widgets.


