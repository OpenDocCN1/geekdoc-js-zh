  md: '# # 7 Programming SideShow Gadgets


    Now that you know about the various types of SideShow devices available today
    and how you can use the SideShow Simulator if you do not have a real device, you''re
    ready to dive into the basics of creating a SideShow gadget and to learn how to
    push data to a SideShow device.


    In this chapter, you build a SideShow gadget that displays RSS feeds. The gadget
    will download the RSS feeds from the web and stream them to a SideShow-enabled
    device. Figure 7-1 shows what the completed gadget will look like.


    # ## Your First SideShow Gadgets


    Developing your own SideShow gadgets is definitely the fun part!


    To develop a SideShow gadget to talk to a SideShow device, you can use the native
    API named `AuxiliaryDisplayApi.dll`. However, that is a not a managed class, so
    it is available only to C++ developers. Fortunately, Microsoft has released a
    SideShow managed class (Windows SideShow .NET Framework Components 1.0) that talks
    directly to this native API so that managed developers (VB and C#) can call it
    directly from their .NET applications.


    You can obtain Windows SideShow .NET Framework Components 1.0 from `http://microsoft.com/downloads/details.aspx?familyid=06FA2ACE-A42D-4117-821C-BCE80786F1C4&displaylang=en`.
    Alternatively, you can search for Windows SideShow .NET Framework Components 1.0.'
