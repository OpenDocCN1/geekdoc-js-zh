  md: "# Chapter 8: Simple Content Format\n\nPage1c.xml\n\n```\n<body>\n    <content\
    \ id=\"1\" title=\"This is a page\">\n    <txt>Line 1<br/>Line 2</txt>\n    </content>\n\
    </body>\n```\n\nThe following code snippet sends the content page to the SideShow\
    \ device using the XML file:\n\n```\n**VB 2005**\nDim scfXMLContent As String\n\
    scfXMLContent = My.Computer.FileSystem.ReadAllText( _\n    \"C:\\Users\\Wei-Meng\
    \ Lee\\Page1c.xml\")\ngadget.AddContent(scfXMLContent)\n\n**C# 2005**\nstring\
    \ scfXMLContent;\nscfXMLContent = File.ReadAllText (\n    @\"C:\\Users\\Wei-Meng\
    \ Lee\\Page1c.xml\");\ngadget.AddContent(scfXMLContent);\n```\n\nProgrammatically,\
    \ you can add a line break element using the following code snippet:\n\n```\n\
    **VB 2005**\nDim content() As ScfElement = _\n    {Scf.Txt(ScfAlign.Left, True,\
    \ Color.White, \"Line 1\", Scf.Br, \"Line 2\")}\ngadget.AddContent(Scf.Content(1,\
    \ \"This is a page\", content))\n\n**C# 2005**\nScfElement[] content =\n    {\
    \ Scf.Txt(ScfAlign.Left, true, Color.White, \"Line 1\", Scf.Br(), \"Line 2\")\
    \ };\ngadget.AddContent(Scf.Content(1, \"This is a page\", content));\n```\n\n\
    **params Keyword**\nThe `Scf.Txt()` method (as well as many other methods in the\
    \ `Scf` class) contains an overloaded method that has a parameter of type `params`.\
    \ The `params` keyword lets you specify a method parameter that takes a variable\
    \ number of arguments. In the earlier example you saw a usage of the `Scf.Txt()`\
    \ method like this:\n\n`Scf.Txt(ScfAlign.Center, true, Color.White, \"Centralized\
    \ text\")`\n\nNotice that the fourth parameter is of type `params`, which means\
    \ it can take in a variable number of parameters, like the following:\n\n`Scf.Txt(ScfAlign.Left,\
    \ true, Color.White, \"Line 1\", Scf.Br(), \"Line 2\")`\n\nHere, the fourth parameter\
    \ can either be a string (\"Centralized text\"), or a series of parameters: \"\
    Line 1\", `Scf.Br()`, \"Line 2\"."
