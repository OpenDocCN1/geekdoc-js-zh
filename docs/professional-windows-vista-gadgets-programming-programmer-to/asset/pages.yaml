  md: "# Chapter 2: Programming Windows Sidebar Gadgets\n\n# # Using the Virtual Map\
    \ Control\n\nThe first step in producing a Sidebar gadget is to create the main\
    \ user interface using HTML. Because you're going to create a Virtual Earth Sidebar\
    \ gadget, you begin by embedding the Virtual Earth Map control in an HTML file\
    \ and test it using Internet Explorer.\n\nCreate a folder called VirtualEarth.gadget\
    \ in C:\\Users\\Username\\AppData\\Local\\Microsoft\\Windows\\Gadgets. Next, create\
    \ a file named Map.html in the VirtualEarth.gadget folder and populate it with\
    \ the following content:\n\n```\n<html>\n<head>\n<title>Virtual Earth Sidebar\
    \ Gadget</title>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\"\
    >\n<script src=\"http://dev.virtualearth.net/mapcontrol/mapcontrol.aspx?v=5\"\
    ></script>\n<script>\n//variable for the map ---\nvar map = null;\n\n--fires when\
    \ the page is loaded for the first time--\nfunction OnPageLoad() {\n map = new\
    \ VMap('myMap');\n\n--loads the map ---\nmap.LoadMap(new VELatLong(47.603482318462,\
    \ -122.317657470703, 12, 'r', false));\n\n--hides the Dashboard ---\nmap.HideDashboard();\n\
    }\n</script>\n</head>\n<body onload=\"OnPageLoad();\">\n<div id=\"myMap\" style=\"\
    position:relative;width:600px; height:400px;\"></div>\n</body>\n</html>\n```\n\
    \n> > Sidebar uses Internet Explorer to host all its gadgets, so you need not\
    \ worry about cross-browser compatibility issues. All of your HTML, JavaScript,\
    \ and CSS only need to be compatible with Internet Explorer.\n\nBasically, the\
    \ OnPageLoad() function is called when the page is loaded in Internet Explorer.\
    \ Within the function, you create an instance of the VEMap to a particular location\
    \ by specifying its latitude and longitude."
