    \ Vuex ensures your views remain consistent with your application data, regardless\
    \ of which function triggers a change to your application data.\n\nIn this article,\
    \ I’ll offer you a high-level overview of Vuex and demonstrate how to implement\
    \ it into a simple app.\n\n## A Shopping Cart Example\n\nLet’s consider a real-world\
    \ example to demonstrate the problem that Vuex solves.\n\nWhen you go to a shopping\
    \ site, you’ll usually have a list of products. Each product has an *Add to Cart*\
    \ button and sometimes an *Items Remaining* label indicating the current stock\
    \ or the maximum number of items you can order for the specified product. Each\
    \ time a product is purchased, the current stock of that product is reduced. When\
    \ this happens, the *Items Remaining* label should update with the correct figure.\
    \ When the product’s stock level reaches 0, the label should read *Out of Stock*.\
    \ In addition, the *Add to Cart* button should be disabled or hidden to ensure\
    \ customers can’t order products that are currently not in inventory.\n\nNow ask\
    \ yourself how you’d implement this logic. It may be trickier than you think.\
    \ And let me throw in a curve ball. You’ll need another function for updating\
    \ stock records when new stock comes in. When the depleted product’s stock is\
    \ updated, both the *Items Remaining* label and the *Add to Cart* button should\
    \ be updated instantly to reflect the new state of the stock.\n\nDepending on\
    \ your programming prowess, your solution may start to look a bit like spaghetti.\
    \ Now, let’s imagine your boss tells you to develop an API that allows third-party\
