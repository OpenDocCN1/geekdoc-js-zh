    \      }\n    }\n  },\n  components: {\n    Card, Col, Row, Icon,\n    checkout:\
    \ () => import('./Checkout')\n  },\n  data: () => ({\n    items: [\n      { msg:\
    \ 'First Product', price: 9.99 },\n      { msg: 'Second Product', price: 19.99\
