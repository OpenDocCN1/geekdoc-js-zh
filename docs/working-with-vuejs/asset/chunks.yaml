    \ a function. This is useful if you want to perform a query within the `getter`:\n\
    \n```\ngetters: {\n  getProductById: state => id => {\n    return state.products.find(product\
    \ => product.id === id);\n  }\n}\n\nstore.getters.getProductById(5)\n```\n\nDo\
    \ note that each time a `getter` handler is accessed via a method, it will always\
    \ run and the result won’t be cached.\n\nCompare:\n\n```\n// property notation,\
    \ result cached\nstore.getters.depletedProducts\n\n// method notation, result\
    \ not cached\nstore.getters.getProductById(5)\n```\n\n### Changing State with\
    \ Mutations\n\nAn important aspect of the Vuex architecture is that components\
    \ never alter the state directly. Doing so can lead to odd bugs and inconsistencies\
    \ in the app’s state.\n\nInstead, the way to change state in a Vuex store is by\
    \ committing a *mutation*. For those of you familiar with Redux, these are similar\
    \ to *reducers*.\n\nHere is an example of a mutation that increases a `count`\
    \ variable stored in `state`:\n\n```\nexport default new Vuex.Store({\n  state:{\n\
    \    count: 1\n  },\n  mutations: {\n    increment(state) {\n      state.count++\n\
    \    }\n  }\n})\n```\n\nYou can’t call a mutation handler directly. Instead, you\
    \ trigger one by “committing a mutation” like this:\n\n```\nmethods: {\n  updateCount()\
    \ {\n    this.$store.commit('increment');\n  }\n}\n```\n\nYou can also pass parameters\
    \ to a mutation:\n\n```\n// store.js\nmutations: {\n  incrementBy(state, n) {\n\
    \    state.count += n;\n  }\n}\n```\n\n```\n// component\nupdateCount() {\n  this.$store.commit('incrementBy',\
    \ 25);\n}\n```\n\nIn the above example, we’re passing the mutation an integer\
    \ by which it should increase the count. You can also pass an object as a parameter.\
    \ This way, you can include multiple fields easily without overloading your mutation\
    \ handler:\n\n```\n// store.js\nmutations: {\n  incrementBy(state, payload) {\n\
    \    state.count += payload.amount;\n  }\n}\n```\n\n```\n// component\nupdateCount()\
    \ {\n  this.$store.commit('incrementBy', { amount: 25 });\n}\n```\n\nYou can also\
    \ perform an *object-style commit* that looks like this:\n\n```\nstore.commit({\n\
    \  type: 'incrementBy',\n  amount: 25\n})\n```\n\nThe mutation handler will remain\
    \ the same.\n\n#### The `mapMutations` Helper\n\nSimilar to `mapState` and `mapGetters`,\
    \ you can also use the `mapMutations` helper to reduce the boilerplate for your\
    \ mutation handlers:\n\n```\nimport { mapMutations } from  'vuex'\n\nexport default{\n\
    \  methods: {\n    ...mapMutations([\n      'increment', // maps to this.increment()\n\
    \      'incrementBy' // maps to this.incrementBy(amount)\n    ])\n  }\n}\n```\n\
    \nOn a final note, mutation handlers must be synchronous. You can attempt to write\
    \ an asynchronous mutation function, but you’ll come to find out later down the\
    \ road that it causes unnecessary complications. Let’s move on to actions.\n\n\
    ### Actions\n\nActions are functions that don’t change the state themselves. Instead,\
    \ they commit mutations after performing some logic (which is often asynchronous).\
    \ Here’s a simple example of an action:\n\n```\n//..\nactions: {\n  increment(context)\
    \ {\n    context.commit('increment');\n  }\n}\n```\n\nAction handlers receive\
    \ a `context` object as their first argument, which gives us access to store properties\
    \ and methods. For example:\n\n*   `context.commit`: commit a mutation\n\n*  \
    \ `context.state`: access state\n\n*   `context.getters`: access getters\n\nYou\
    \ can also use *argument destructing* to extract the store attributes you need\
    \ for your code. For example:\n\n```\nactions: {\n  increment({ commit }) {\n\
    \    commit('increment');\n  }\n}\n```\n\nAs mentioned above, actions can be asynchronous.\
    \ Here’s an example:\n\n```\nactions: {\n  incrementAsync: async({ commit }) =>\
    \ {\n    return await setTimeout(() => { commit('increment') }, 1000);\n  }\n\
    }\n```\n\nIn this example, the mutation is committed after 1,000 milliseconds.\n\
    \nLike mutations, action handlers aren’t called directly, but rather via a dedicated\
    \ `dispatch` method on the store, like so:\n\n```\nstore.dispatch('incrementAsync')\n\
    \n// dispatch with payload\nstore.dispatch('incrementBy', { amount: 25})\n\n//\
    \ dispatch with object\nstore.dispatch({\n  type: 'incrementBy',\n  amount: 25\n\
    })\n```\n\nYou can dispatch an action in a component like this:\n\n```\nthis.$store.dispatch('increment')\n\
    ```\n\n#### The `mapActions` Helper\n\nAlternatively, you can use the `mapActions`\
    \ helper to assign action handlers to local methods:\n\n```\nimport { mapActions\
    \ } from  'vuex'\n\nexport default {\n  //..\n  methods: {\n    ...mapActions([\n\
    \      'incrementBy', // maps this.increment(amount) to this.$store.dispatch(increment)\n\
    \      'incrementAsync', // maps this.incrementAsync() to this.$store.dispatch(incrementAsync)\n\
    \      add: 'increment' // maps this.add() to this.$store.dispatch(increment)\n\
    \    ])\n  }\n}\n```\n\n## Re-build Counter App Using Vuex\n\nNow that we’ve had\
    \ a look at the core concepts of Vuex, it’s time to implement what we’ve learned\
    \ and rewrite our counter to make use of Vue’s official state management solution.\n\
    \nIf you fancy a challenge, you might like to have a go at doing this yourself\
    \ before reading on …\n\nWhen we generated our project using `Vue CLI`, we selected\
    \ `Vuex` as one of the features. A couple of things happened:\n\n1.  `Vuex` was\
    \ installed as a package dependency. Check your `package.json` to confirm this.\n\
    \n2.  A `store.js` file was created and injected into your Vue.js application\
    \ via `main.js`.\n\nTo convert our “local state” counter app to a Vuex application,\
    \ open `src/store.js` and update the code as follows:\n\n```\nimport Vue from\
    \ 'vue'\nimport Vuex from 'vuex'\n\nVue.use(Vuex)\n\nexport default new Vuex.Store({\n\
    \  state: {\n    count: 0\n  },\n  getters: {\n    parity: state => state.count\
    \ % 2 === 0 ? 'even' : 'odd'\n  },\n  mutations: {\n    increment(state) {\n \
    \     state.count++;\n    },\n    decrement(state) {\n      state.count--;\n \
    \   }\n  },\n  actions: {\n    increment: ({ commit }) => commit('increment'),\n\
    \    decrement: ({ commit }) => commit('decrement'),\n    incrementIfOdd: ({ commit,\
    \ getters }) => getters.parity === 'odd' ? commit('increment') : false,\n    incrementAsync:\
    \ ({ commit }) => {\n      setTimeout(() => { commit('increment') }, 1000);\n\
    \    }\n  }\n});\n```\n\nHere we can see how a complete Vuex store is structured\
    \ in practice. Please go back over the theory part of this article if anything\
    \ here is unclear to you.\n\nNext, update the `src/components/Counter.vue` component\
    \ by replacing the existing code within the `<script>` block. We’ll switch the\
    \ local state and functions to the newly created ones in the Vuex store:\n\n```\n\
    import { mapState mapGetters, mapActions } from 'vuex'\n\nexport default {\n \
    \ name: 'Counter',\n  computed: {\n    ...mapState([\n      'count'\n    ]),\n\
    \    ...mapGetters([\n      'parity'\n    ])\n  },\n  methods: mapActions([\n\
    \    'increment',\n    'decrement',\n    'incrementIfOdd',\n    'incrementAsync'\n\
    \  ])\n}\n```\n\nThe template code should remain the same, as we’re sticking to\
    \ the previous variable and function names. See how much cleaner the code now\
    \ is.\n\nIf you don’t want to use the state and getter map helpers, you can access\
    \ the store data directly from your template like this:\n\n```\n<p>\n  Clicked\
    \ {{ $store.state.count }} times! Count is {{ $store.getters.parity }}.\n</p>\n\
    ```\n\nAfter you’ve saved your changes, make sure to test your application. From\
    \ an end-user perspective, the counter application should function exactly the\
    \ same as before. The only difference is that the counter is now operating from\
    \ a Vuex store.\n\n#### Live Code\n\nSee the Pen [Vue Counter Using Vuex](https://codepen.io/SitePoint/pen/ZmaMKO/).\n\
    \n## Conclusion\n\nIn this article, we’ve looked at what Vuex is, what problem\
    \ it solves, how to install it, as well as its core concepts. We then applied\
    \ these concepts to refactor our counter app to work with Vuex. Hopefully this\
    \ introduction will serve you well in implementing Vuex in your own projects."
