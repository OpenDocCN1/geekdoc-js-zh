    \ can refer to `data` rather than `githubData[currentUsername]`:\n\n```html\n\
    <!-- src/GithubUserData/index.vue -->\n<template>\n  <div v-if=\"data\">\n   \
    \ <h4>{{ data.name }}</h4>\n    <p>{{ data.company }}</p>\n    <p>Number of repos:\
    \ {{ data.public_repos }}</p>\n  </div>\n</template>\n<script src=\"./script.js\"\
    ></script>\n<style scoped src=\"./style.css\"></style>\n```\n\nTo use this component\
    \ we need to update the `GithubOutput` component. Firstly, we import and register\
    \ `GithubUserData`:\n\n```javascript\n// src/GithubOutput/script.js\nimport bus\
    \ from '../bus'\nimport Vue from 'vue'\nimport GithubUserData from '../GithubUserData/index.vue'\n\
    \nexport default {\n  name: 'GithubOutput',\n  components: {\n    'github-user-data':\
    \ GithubUserData,\n  },\n  ...\n}\n```\n\nYou can use any name for the component\
    \ when declaring it, so where I’ve placed `github-user-data`, you could place\
    \ anything you want. It’s advisable that you stick to components with a dash in\
    \ them. Vue doesn’t enforce this, but the W3C specification on custom elements\
    \ states that they must contain a dash to prevent naming collisions with elements\
    \ added in future versions of HTML.\n\nOnce we’ve declared the component, we can\
    \ use it in our template:\n\n```html\n<!-- src/GithubOutput/index.vue -->\n<p\
    \ v-else>\n  Below are the results for {{ currentUsername }}:\n  <github-user-data\
    \ :data=\"githubData[currentUsername]\"></github-user-data>\n</p>\n```\n\nThe\
    \ crucial part here is how I pass the `data` property down to the component:\n\
    \n```html\n:data=\"githubData[currentUsername]\"\n```\n\nThe colon at the start\
    \ of that attribute is crucial; it tells Vue that the attribute we’re passing\
    \ down is dynamic and that the component should be updated every time the data\
    \ changes. Vue will evaluate the value of `githubData[currentUsername]` and ensure\
    \ that the `GithubUserData` component is kept up to date as the data changes.\n\
