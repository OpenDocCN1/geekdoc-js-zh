    \  <Card title=\"Checkout Items\" key=\"checkout\">\n    <p v-for=\"(k, i) in\
    \ this.shoppingList\" :key=\"i\">\n      Item: {{items[Number(k)].msg}} for ${{items[Number(k)].price}}\n\
    \    </p>\n  </Card>\n</template>\n\n<script>\nimport { Card } from 'ant-design-vue';\n\
    \nexport default {\n  props: ['shoppingList'],\n  components: {\n    Card\n  },\n\
    \  data: () => ({\n    items: [\n      { msg: 'First Product', price: 9.99 },\n\
    \      { msg: 'Second Product', price: 19.99 },\n      { msg: 'Third Product',\
    \ price: 15.00 },\n      { msg: 'Fancy Shirt', price: 137.00 },\n      { msg:\
    \ 'More Fancy', price: 109.99 },\n      { msg: 'Extreme', price: 3.00 },\n   \
    \   { msg: 'Super Shirt', price: 109.99 },\n      { msg: 'Epic Shirt', price:\
    \ 3.00 },\n    ]\n  })\n}\n</script>\n```\n\nHere we’re looping over the props\
    \ we receive as `shoppingList` and outputting them to the screen.\n\nYou can run\
    \ the app using the `npm run serve` command. Then navigate to [http://localhost:8080/](http://localhost:8080/).\
    \ If all has gone according to plan, you should see something like what’s shown\
    \ in the image below.\n\n![Vue Webshop Demo](Images/15431556012-Webshop-example.png\
    \ \"Vue.js Webshop example\")\n\nTry clicking around the store with your network\
    \ tab open to assure yourself that the `Checkout` component is only loaded when\
    \ you click the *Checkout* button.\n\nYou can also find [the code for this demo\
    \ on GitHub](https://github.com/sitepoint-editors/shopping-cart-async).\n\n##\
    \ Async with Loading and Error Component\n\nIt’s even possible to define a loading\
    \ and/or error component for when the async component takes some time to load\
    \ or fails to load. It can be useful to show a loading animation, but bear in\
    \ mind this again slows down your application. An asynchronous component should\
    \ be small and fast to load. Here’s an example:\n\n```\nconst Message = () =>\
    \ ({\n  component: import(\"./Message\"),\n  loading: LoadingAnimation,\n  error:\
    \ ErrorComponent\n});\n```\n\n## Conclusion\n\nCreating and implementing asynchronous\
    \ components is very easy and should be part of your standard development routine.\
    \ From a UX perspective, it’s important to reduce the initial load time as much\
    \ as possible to maintain the user’s attention. Hopefully this tutorial has assisted\
    \ you with loading your own components asynchronously and applying conditions\
    \ to them to delay (lazy load) the load of the component."
