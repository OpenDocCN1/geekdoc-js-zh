    \ showing the recent blog posts from the blog. We’ll do this by creating a `<posts>`\
    \ component and displaying it in the `index.vue` page.\n\nBut first, we have to\
    \ get our saved JSON blog posts and place them in a file in the app root folder.\
    \ [The file can be downloaded from here](https://github.com/sitepoint-editors/nuxt-ssr-blog/blob/master/posts.json),\
    \ or you can just copy the JSON below and save in the root folder as `posts.json`:\n\
    \n```\n[\n    {\n        \"id\": 4,\n        \"title\": \"Building universal JS\
    \ apps with Nuxt.js\",\n        \"summary\": \"Get introduced to Nuxt.js, and\
    \ build great SSR Apps with Vue.js.\",\n        \"content\": \"<p>Lorem ipsum\
    \ dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt\
    \ ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation\
    \ ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor\
    \ pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui\
    \ officia deserunt mollit anim id est laborum.</p>\",\n        \"author\": \"\
    Jane Doe\",\n        \"published\": \"08:00 - 07/06/2017\"\n    },\n    {\n  \
    \      \"id\": 3,\n        \"title\": \"Great SSR Use cases\",\n        \"summary\"\
    : \"See simple and rich server-rendered JavaScript apps.\",\n        \"content\"\
    : \"<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod\
    \ aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate\
    \ velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat\
    \ non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</p>\"\
    ,\n        \"author\": \"Jane Doe\",\n        \"published\": \"17:00 - 06/06/2017\"\
    \n    },\n    {\n        \"id\": 2,\n        \"title\": \"SSR in Vue.js\",\n \
    \       \"summary\": \"Learn about SSR in Vue.js, and where Nuxt.js can make it\
    \ all faster.\",\n        \"content\": \"<p>Lorem ipsum dolor sit amet, consectetur\
    \ adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna\
    \ aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi\
    \ in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint\
    \ occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim\
    \ id est laborum.</p>\",\n        \"author\": \"Jane Doe\",\n        \"published\"\
    : \"13:00 - 06/06/2017\"\n    },\n    {\n        \"id\": 1,\n        \"title\"\
    : \"Introduction to SSR\",\n        \"summary\": \"Learn about SSR in JavaScript\
    \ and how it can be super cool.\",\n        \"content\": \"<p>Lorem ipsum dolor\
    \ sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore\
    \ et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco\
    \ laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor. Excepteur\
    \ sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit\
    \ anim id est laborum.</p>\",\n        \"author\": \"John Doe\",\n        \"published\"\
    : \"11:00 - 06/06/2017\"\n    }\n]\n```\n\n#### Where to Retreive the Content\n\
    \nIdeally the posts should be retrieved from an API or resource. For example,\
    \ [Contentful](https://www.contentful.com/) is a service that can be used for\
    \ this.\n\nComponents live in the `components` directory. We’ll create the `<posts>`\
    \ single file component in there:\n\n```\n<!-- ./components/Posts.vue -->\n<template>\n\
    \  <section class=\"main-content\">\n    <div class=\"container\">\n      <h1\
    \ class=\"title has-text-centered\">\n        Recent Posts.\n      </h1>\n   \
    \   <div class=\"columns is-multiline\">\n        <div class=\"column is-half\"\
    \ v-for=\"post in posts\" :key=\"post.id\">\n          <div class=\"card\">\n\
    \           <header class=\"card-header\">\n            <p class=\"card-header-title\"\
    >\n              {{ post.title }}\n            </p>\n          </header>\n   \
    \       <div class=\"card-content\">\n            <div class=\"content\">\n  \
    \            {{ post.summary }}\n              <br>\n              <small>\n \
    \               by <strong>{{ post.author}}</strong>\n                \\\\ {{\
    \ post.published }}\n              </small>\n            </div>\n          </div>\n\
    \          <footer class=\"card-footer\">\n            <nuxt-link :to=\"`/post/${post.id}`\"\
    \n              class=\"card-footer-item\">\n              Read More\n       \
    \     </nuxt-link>\n          </footer>\n        </div>\n      </div>\n    </div>\n\
    \  </div>\n</section>\n</template>\n\n<script>\n  import posts from '~/posts.json'\n\
    \n  export default {\n    name: 'posts',\n    data () {\n      return { posts\
    \ }\n    }\n  }\n</script>\n```\n\nWe import the posts data from the saved JSON\
    \ file and assign it to the `posts` value in our component. We then loop through\
    \ all the posts in the component template with the `v-for` directive and display\
    \ the post attributes we want.\n\n#### The `~` Symbol\n\nThe `~` symbol is an\
    \ alias for the `/` directory. You can check out the docs [here](https://nuxtjs.org/guide/directory-structure/#aliases)\
    \ to see the different aliases Nuxt.js provides, and what directories they’re\
    \ linked to.\n\nNext, we add the `<posts>` component to the homepage:\n\n```\n\
    <!-- ./pages/index.vue -->\n<template>\n<div>\n    <!-- ... -->\n    <posts />\n\
    </div>\n</template>\n\n<script>\nimport Posts from '~/components/Posts.vue'\n\n\
    export default {\n  components: {\n    Posts\n  },\n  // ...\n}\n</script>\n```\n\
    \n### Adding Dynamic Routes\n\nNow we’ll add dynamic routes for the posts, so\
    \ we can access a post for example with this URL: `/post/1`.\n\nTo achieve this,\
    \ we add the `post` directory to the `pages` directory and structure it like this:\n\
    \n```\npages\n└── post\n    └── _id\n        └── index.vue\n```\n\nThis generates\
    \ the corresponding dynamic routes for the application like this:\n\n```\nrouter:\
    \ {\n  routes: [\n    // ...\n    {\n      name: 'post-id',\n      path: '/post/:id',\n\
    \      component: 'pages/post/_id/index.vue'\n    }\n  ]\n}\n```\n\nUpdating the\
    \ single post file:\n\n```\n<!-- ./pages/post/_id/index.vue -->\n<template>\n\
    \  <div class=\"main-content\">\n    <div class=\"container\">\n      <h2 class=\"\
    title is-2\">{{ post.title }}</h2>\n      <div v-html=\"post.content\"></div>\n\
    \      <br>\n      <h4 class=\"title is-5 is-marginless\">by <strong>{{ post.author\
    \ }}</strong> at <strong>{{ post.published }}</strong></h4>\n    </div>\n  </div>\n\
    </template>\n\n<script>\n  // import posts saved JSON data\n  import posts from\
    \ '~/posts.json'\n\n  export default {\n    validate ({ params }) {\n      return\
    \ /^\\d+$/.test(params.id)\n    },\n    asyncData ({ params }, callback) {\n \
    \     let post = posts.find(post => post.id === parseInt(params.id))\n      if\
    \ (post) {\n        callback(null, { post })\n      } else {\n        callback({\
    \ statusCode: 404, message: 'Post not found' })\n      }\n    },\n    head ()\
    \ {\n      return {\n        title: this.post.title,\n        meta: [\n      \
    \    {\n            hid: 'description',\n            name: 'description',\n  \
    \          content: this.post.summary\n          }\n        ]\n      }\n    }\n\
    \  }\n</script>\n```\n\nNuxt.js adds some custom methods to our page components\
    \ to help make the development process easier. See how we use some of them on\
    \ the single post page:\n\n*   Validate the route parameter with the `validate`\
    \ method. Our validate method checks if the route parameter passed is a number.\
    \ If it returns `false`, Nuxt.js will automatically load the 404 error page. You\
    \ can read more on it [here](https://nuxtjs.org/api/pages-validate).\n\n*   The\
    \ `asyncData` method is used to fetch data and render it on the server side before\
    \ sending a response to the browser. It can return data via different methods.\
    \ In our case, we use a callback function to return the post that has the same\
    \ `id` attribute as the route `id` parameter. You can see the various ways of\
    \ using this function [here](https://nuxtjs.org/guide/async-data).\n\n*   As we’ve\
    \ seen before, we use the `head` method to set the page’s headers. In this case,\
    \ we’re changing the page title to the title of the post, and adding the post\
    \ summary as a meta description for the page."
