  trans: "\nVue 还为我们提供了一个快捷方式，我们可以使用 `@` 代替 `v-on:`，正如我在上面的代码中展示的那样。对于处理器，我们可以指定 Vue\
    \ 实例中的任何方法。\n\n### 计算属性 (Computed properties)\n\n现在我们唯一需要做的就是在发票底部显示总额额。理论上，我们可以在模板本身中完成这一点：正如我之前提到的，Vue\
    \ 允许我们在花括号之间放置任何 JavaScript 语句。然而，将任何超出基础逻辑的内容保持在模板之外要好得多；如果将这些逻辑分离，代码会更整洁且更易测试。\n\
    \n我们可以使用另一个方法来实现它，但我认为[计算属性](https://vuejs.org/v2/guide/computed.html#Computed-Properties)\
    \ 更合适。与创建方法类似，我们向 Vue 实例传递一个 `computed` 对象，该对象中包含了一些函数，我们希望在模板中使用这些函数的结果：\n\n\
    ```\nconst app = new Vue({\n  // ...\n  computed: {\n    total() {\n      return\
    \ this.items.reduce((acc, item) => acc + (item.price * item.quantity), 0);\n \
    \   }\n  }\n});\n```\n\n现在，我们可以在模板中引用这个计算属性了：\n\n```\n<tr class=\"total\">\n \
    \ <td colspan=\"3\"></td>\n  <td>Total: ${{ total }}</td>\n</tr>\n```\n\n正如你可能已经注意到的，计算属性可以像数据一样被对待；我们不需要用括号来调用它们。但使用计算属性还有另一个好处：Vue\
    \ 足够智能可以缓存返回的值，并且只有当它依赖的某个数据属性发生变化时，才会重新评估该函数。\n\n如果我们使用方法来累加总额，那么在每次模板重新渲染时都会执行该计算。由于我们使用了计算属性，只有当项的\
    \ `quantity` 或 `price` 字段发生变化时，总额才会被重新计算。\n\n### 过滤器 (Filters)\n\n你可能已经注意到我们的实现中有一个小\
    \ Bug。虽然单价是整数，但我们的总额和小计显示时没有分分位。我们真正希望这些数字始终保留两位小数。\n\n与其同时修改计算小计的代码和计算总额的代码，Vue\
    \ 为我们提供了一种非常棒的方法来处理此类常见的格式化任务：过滤器。\n\n正如你可能已经猜到的，要创建一个过滤器，我们只需要向 Vue 实例传递一个带有该键的对象：\n\
    \n```\nconst app = new Vue({\n  // ...\n  filters: {\n    currency(value) {\n\
    \      return value.toFixed(2);\n    }\n  }\n});\n```\n\n在这里，我们创建了一个名为 `currency`\
    \ 的简单过滤器，它对接收到的值调用 `toFixed(2)` 并返回结果。我们可以像这样将其应用于模板中的任何输出内容：\n\n```\n<td>Total:\
    \ ${{ total | currency }}</td>\n```\n\n### 实时代码 (Live Code)\n\n查看 Pen 项目 [Vue\
    \ Invoice](https://codepen.io/SitePoint/pen/MVLVmv/)。\n\n## 总结 (Summing Up)\n\n\
    对比这两个版本的代码，Vue 应用有几点非常值得关注：\n\n- UI 与驱动它的逻辑/数据之间有清晰的分离：代码更容易理解，并且更便于测试。\n- UI\
    \ 是声明式的：你只需要关注你想看到什么，而不需要关注如何操作 DOM 来实现它。\n\n这两个库的大小（KB）几乎完全相同。诚然，你可以通过自定义构建稍微精简\
    \ jQuery，但即使对于像我们发票示例这样简单的项目，我认为开发的便利性和代码的可读性也证明了这种差异。\n\nVue 提供的功能比我们在这里涵盖的多得多。它的优势在于允许你创建模块化、可用的\
    \ UI 组件，这些组件可以组合成复杂的前端应用。如果你对深入研究 Vue 感兴趣，建议查看 [Getting Up and Running with the\
    \ Vue.js 2.0 Framework](https://www.sitepoint.com/up-and-running-vue-js-2-0/)。\n\
    \n# 第 8 章：Nuxt.js：用于通用 Vue.js 应用的极简框架\n\n### 作者：Olayinka Omole\n\n**通用（或同构）JavaScript\
    \ 是 JavaScript 社区中非常常用的术语。它被用来描述可以在客户端和服务器端执行的 JavaScript 代码。**\n\n许多现代 JavaScript\
    \ 框架（如 [Vue.js](https://vuejs.org/)）旨在构建单页应用 (SPA)。这样做是为了提高用户体验并让应用看起来更快，因为用户可以立即看到页面更新。虽然这有很多优势，但也有一些缺点，例如在初始加载应用时，浏览器需要获取\
    \ JavaScript 包导致“内容呈现时间”较长，而且某些搜索引擎爬虫或社交网络机器人在爬取你的网页时无法看到整个加载后的应用。\n\nJavaScript\
    \ 的服务器端渲染是指在 Web 服务器上预加载 JavaScript 应用，并将渲染后的 HTML 作为响应发送给对页面的浏览器请求。\n\n构建服务器端渲染的\
    \ JavaScript 应用可能有点繁琐，因为在开始编写代码之前需要进行大量的配置。这正是 [Nuxt.js](https://nuxtjs.org) 为\
    \ Vue.js 应用旨在解决的问题。\n\n## 什么是 Nuxt.js (What Nuxt.js Is)\n\n简单来说，Nuxt.js 是一个帮助你轻松构建服务器渲染的\
    \ Vue.js 应用的框架。它抽象化了管理异步数据、中间件和路由涉及的大部分复杂配置。它类似于用于 Angular 的 [Angular Universal](https://universal.io/)，以及用于\
    \ React 的 [Next.js](https://zeit.co/blog/next)。\n\n根据 [Nuxt.js 文档](https://nuxtjs.org/)，“它的主要范围是\
    \ UI 渲染的抽象化”。\n\n### 静态生成 (Static Generation)\n\nNuxt.js 的另一个强大功能是可以使用 `generate`\
    \ 命令生成静态网站。它提供了类似于 [Jekyll](https://jekyllrb.com/) 等流行的静态生成工具的功能。\n\n### Nuxt.js\
    \ 底层 (Under the Hood of Nuxt.js)\n\n除了 Vue.js 2.0 外，Nuxt.js 还包含了以下内容：[Vue-Router](https://github.com/vuejs/vue-router)、Vuex（仅在使用\
    \ [store 选项](https://nuxtjs.org/guide/vuex-store) 时包含）、[Vue Server Renderer](https://ssr.vuejs.org/)\
    \ 和 [vue-meta](https://github.com/declandew/vue-meta)。这非常棒，因为它消除了手动包含和配置开发服务器渲染\
    \ Vue.js 应用所需的各种库的负担。Nuxt.js 开箱即用这一切，同时保持 57kb 的总大小（带 vuex 为 60KB）。\n\nNuxt.js\
    \ 还使用 webpack 配合 [vue-loader](https://vue-loader](https://github.com/vuejs/vue-loader)\
    \ 和 [babel-loader](https://github.com/babel/babel-loader) 进行代码打包、代码分割和代码压缩。\n\n\
    ### 工作原理 (How it works)\n\n当用户访问 Nuxt.js 应用或通过 `<nuxt-link>` 导航到某个页面时，会发生这种情况：\n\
    \n- 当用户首次访问应用时，如果 store 中定义了 [`nuxtServerInit action`](https://nuxtjs.org/guide/vuex-store/#the-nuxtserverinit-action)，Nuxt.js\
    \ 将调用它并更新 store。\n- 接下来执行访问页面的现有[中间件](https://nuxtjs.org/guide/routing/#middleware)。Nuxt\
    \ 首先检查 `nuxt.config.js` 文件中的全局中间件，然后检查匹配的[布局文件](https://nuxtjs.org/guide/views#layouts)，最后检查页面及其子组件的中间件。中间件的优先级按上述顺序排列。\n\
    - 如果访问的路由是动态路由，且该路由存在 `validate()` 方法，则会对[路由进行验证](https://nuxtjs.org/api/pages-validate)。\n"
- fmt: "\n4. Then, `Nuxt.js` calls the `asyncData()` and `fetch()` methods to load\
    \ data before rendering the page. The [`asyncData()` method](https://nuxtjs.org/guide/async-data/)\
    \ is used for fetching data and rendering it on the server-side, while the [`fetch()`\
    \ method](https://nuxtjs.org/api/pages-fetch/) is used to fill the store before\
    \ rendering the page.\n\n5. At the final step, the page (containing all the proper\
    \ data) is rendered.\n\nThese actions are portrayed properly in this schema, gotten\
    \ from the Nuxt docs:\n\n![Nuxt.js Schema](Images/1498691466nuxt-schema.png \"\
    Nuxt.js Schema\")\n\n# Creating A Serverless Static Site With Nuxt.js\n\nLet’s\
    \ get our hands dirty with some code and create a simple static generated blog\
    \ with `Nuxt.js`. We’ll assume our posts are fetched from an API and will mock\
    \ the response with a static `JSON` file.\n\nTo follow along properly, a working\
    \ knowledge of `Vue.js` is needed. You can check out Jack Franklin’s great [getting\
    \ started guide](https://www.sitepoint.com/up-and-running-vue-js-2-0/) for `Vue.js`\
    \ 2.0 if you’re new to the framework. I’ll also be using `ES6` Syntax, and you\
    \ can get a refresher on that here: [sitepoint.com/tag/es6/](https://www.sitepoint.com/tag/es6/).\n\
    \nOur final app will look like this:\n\n![Nuxt SSR Blog](Images/nuxt1.png \"Nuxt\
    \ SSR Blog\")\n\n## Github\n\nThe entire code for this tutorial can be seen [here\
    \ on GitHub](https://github.com/sitepoint-editors/nuxt-ssr-blog/), and you can\
    \ check out the demo [here](https://nuxt-ssr-blog.firebaseapp.com/).\n\n## Application\
    \ Setup and Configuration\n\nThe easiest way to get started with `Nuxt.js` is\
    \ to use the template created by the Nuxt team. We can install it to our project\
    \ (`ssr-blog`) quickly using the [vue-cli](https://cli.vuejs.org/):\n\n```\nvue\
    \ init nuxt/starter ssr-blog\n```\n\nOnce you’ve run this command, a prompt will\
    \ open and ask you a couple of questions. You can press `Return` to accept the\
    \ default answers, or enter values of your own.\n\n### Install vue-cli\n\nIf you\
    \ don’t have `vue-cli` installed, you have to run `npm install -g @vue/cli` first,\
    \ to install it.\n\nNext, we install the project’s dependencies:\n\n```\ncd ssr-blog\n\
    npm install\n```\n\nNow we can launch the app:\n\n```\nnpm run dev\n```\n\nIf\
    \ all goes well, you should be able to visit [http://localhost:3000](http://localhost:3000)\
    \ to see the `Nuxt.js` template starter page. You can even view the page’s source,\
    \ to see that all content generated on the page was rendered on the server and\
    \ sent as `HTML` to the browser.\n\nNext, we can make some simple configurations\
    \ in the `nuxt.config.js` file. We’ll add a few options:\n\n```\n// ./nuxt.config.js\n\
    \nmodule.exports = {\n  /*\n   * Headers of the page\n   */\n  head: {\n    titleTemplate:\
    \ '%s | Awesome JS SSR Blog',\n    // ...\n    link: [\n      // ...\n      {\n\
    \        rel: 'stylesheet',\n        href: 'https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.2/css/bulma.min.css'\n\
    \      }\n    ]\n  },\n  // ...\n}\n```\n\nIn the above config file, we simply\
    \ specify the title template to be used for the application via the `titleTemplate`\
    \ option. Setting the `title` option in the individual pages or layouts will inject\
    \ the `title` value into the `%s` placeholder in `titleTemplate` before being\
    \ rendered.\n\nWe also pulled in my current CSS framework of choice, [Bulma](http://bulma.io/),\
    \ to take advantage of some preset styling. This was done via the `link` option.\n\
    \n### Understanding the Headers\n\nNuxt.js` uses [vue-meta](https://github.com/declandewet/vue-meta)\
    \ to update the headers and HTML attributes of our apps. So you can take a look\
    \ at it for a better understanding of how the headers are being set.\n\nNow we\
    \ can take the next couple of steps by adding our blog’s pages and functionalities.\n\
    \n## Working with Page Layouts\n\nFirst, we’ll define a custom base layout for\
    \ all our pages. We can extend the main Nuxt.js layout by updating the `layouts/default.vue`\
    \ file:\n\n```\n<!-- ./layouts/default.vue -->\n\n<template>\n  <div>\n    <!--\
    \ navigation -->\n    <nav class=\"navbar has-shadow\" role=\"navigation\" aria-label=\"\
    main navigation\">\n      <div class=\"container\">\n        <div class=\"navbar-start\"\
    >\n          <nuxt-link to=\"/\" class=\"navbar-item\">\n            Awesome JS\
    \ SSR Blog!\n          </nuxt-link>\n          <nuxt-link active-class=\"is-active\"\
    \ to=\"/\" class=\"navbar-item is-tab\" exact>Home</nuxt-link>\n          <nuxt-link\
    \ active-class=\"is-active\" to=\"/about\" class=\"navbar-item is-tab\" exact>About</nuxt-link>\n\
    \        </div>\n      </div>\n    </nav>\n    <!-- /navigation -->\n\n    <!--\
    \ displays the page -->\n    <nuxt/>\n\n  </div>\n</template>\n\n<style>\n  .main-content\
    \ {\n    margin: 30px;\n  }\n</style>\n```\n\nIn our custom layout, we use `<nuxt-link`](https://nuxtjs.org/guide/components)\
    \ to see how it works. It’s also possible to do more things — like document templates\
    \ and error layouts — but we don’t need those for our simple blog. The `<nuxt>`\
    \ component is really important when creating a layout. Check out [Nuxt documentation](https://nuxtjs.org/guide/components)\
    \ to see all the possibilities (Wait, the original text says: [views](https://nuxtjs.org/guide/views)\
    \ to see the possibilités).\n\n### Simple Pages and Routes\n\nPages in Nuxt.js\
    \ are created as [single file components](https://vuejs.org/guide/single-file-components)\
    \ in the `pages` directory. Nuxt.js automatically transforms every `.vue` file\
    \ into an application route.\n\n### Building the Homepage\n\nWe can add our homepage\
    \ by updating the `index.vue` file:\n\n```\n<!-- ./pages/index.vue -->\n<template>\n\
    \  <div>\n    <section class=\"hero is-medium is-primary\">\n      <div class=\"\
    hero-body\">\n        <div class=\"container\">\n          <h1 class=\"title\"\
    >\n            Welcome to the SSR Blog.\n          </h1>\n          <h2 class=\"\
    subtitle\">\n            Hope you find something you like.\n          </h2>\n\
    \        </div>\n      </div>\n    </section>\n  </div>\n</template>\n\n<script>\n\
    \  export default {\n    head: {\n      title: 'Home'\n    }\n  }\n</script>\n\
    ```\n\nAs stated earlier, specifying the `title` option here automatically injects\
    \ its value into the `titleTemplate` before rendering the page. We can now reload\
    \ our app to see the changes to the homepage.\n\n### Building the About page\n\
    \nAnother great thing about Nuxt.js is that it will listen to file changes inside\
    \ the `pages` directory, so there’s no need to restart the application when adding\
    \ new pages.\n\nWe can test this, by adding a simple `about.vue` page:\n\n```\n\
    <!-- ./pages/about.vue -->\n<template>\n  <div class=\"main-content\">\n    <div\
    \ class=\"container\">\n      <h2 class=\"title is-2\">About this website.</h2>\n\
    \      <p>Curabitur accumsan turpis pharetra <strong>augue tincidunt</strong>\
    \ blandit. Quisque condimentum maximus mi, sit amet commodo arcu rutrum id. Proin\
    \ pretium urna vel cursus venenatis. Suspendisse potentially. Etiam mattis sem\
    \ rhoncus lacus dapibus facilisis. Donec at dignissim dui. Ut et neque nisl.</p>\n\
    \      <br>\n      <h4 class=\"title is-4\">What we hope to achieve:</h4>\n  \
    \    <ul>\n        <li>In fermentum leo eu luctus mollis, quis dictum mi velit.</li>\n\
    \        <li>Morbi eu nulla lobortis, lobortis est in, fringilla felis.</li>\n\
    \        <li>Aliquam nec felis in sapien viverra fermentum nec lectus.</li>\n\
    \        <li>Ut non enim metus.</li>\n      </ul>\n    </div>\n  </div>\n</template>\n\
    \n<script>\nexport default {\n  head: {\n    title: 'About'\n  }\n}\n</script>\n\
    ```\n\nNow, we can visit [http://localhost:3000/about](http://localhost:3000/about)\
    \ to see the about page, without having to restart the app, which is awesome.\n\
    \n### Showing Blog Posts on the Homepage\n"
