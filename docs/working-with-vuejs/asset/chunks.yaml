    \ script.js\n│   └── style.css\n├── index.html\n└── index.js\n```\n\n## Forms\
    \ in Vue.js\n\nLet’s start with the `GithubInput` component. As with the `App`\
    \ component, the `index.vue` file should contain the template, as well as loading\
    \ in the script and CSS file. The template simply contains `<p>github input</p>`\
    \ for now. We’ll fill it in properly shortly. I like putting in some dummy HTML\
    \ so I can check I’ve got the template wired up properly when creating a new component:\n\
    \n```\n<!-- src/GithubInput/index.vue -->\n<template>\n  <p>github input</p>\n\
    </template>\n\n<script src=\"./script.js\"></script>\n<style scoped src=\"./style.css\"\
    ></style>\n```\n\nWhen creating this component the one thing we do differently\
    \ is create a piece of data that’s associated with the component. This is very\
    \ similar to React’s concept of state:\n\n```\n// src/GithubInput/script.js\n\
    export default {\n  name: 'GithubInput',\n  data() {\n    return {\n      username:\
    \ '',\n    }\n  }\n}\n```\n\nThis says that this component has a piece of data,\
    \ `username`, that it owns and is responsible for. We’ll update this based on\
    \ the user’s input shortly.\n\nFinally, to get this component onto the screen,\
    \ I need to register it with the `App` component, as it’s the `App` component\
    \ that will be rendering it.\n\nTo do this, I update `src/App/script.js` and tell\
    \ it about `GithubInput`:\n\n```\n// src/App/script.js\nimport GithubInput from\
    \ '../GithubInput/index.vue'\n\nexport default {\n  name: 'App',\n  components:\
    \ {\n    'github-input': GithubInput,\n  },\n  data() {\n    return {}\n  },\n\
    }\n```\n\nAnd then I can update the `App` component’s template:\n\n```\n<!-- src/App/index.vue\
    \ -->\n<div>\n  <p>Hello World</p>\n  <github-input></github-input>\n</div>\n\
    ```\n\nA restriction of Vue components (which is also true in Angular and React)\
    \ is that each component must have one root node, so when a component has to render\
    \ multiple elements, it’s important to remember to wrap them all in something,\
    \ most commonly a `div`.\n\n## Tracking a Form Input\n\nOur `GithubInput` component\
    \ will need to do two things:\n\n*   Keep track of the current value of the input\n\
    \n*   Communicate that the value has changed, so that other components can know\
    \ and therefore update their state.\n\nWe can do the first version by creating\
    \ a `form` with an `input` element in it. We can use Vue’s built-in directives\
    \ that enable us to keep track of form values. The template for `GithubInput`\
    \ looks like so:\n\n```\n<form v-on:submit.prevent=\"onSubmit\">\n  <input type=\"\
    text\" v-model=\"username\" placeholder=\"Enter a github username here\" />\n\
    \  <button type=\"submit\">Go!</button>\n</form>\n```\n\nThere are two important\
    \ attributes that you’ll notice: `v-on` and `v-model`.\n\n`v-on` is how we bind\
    \ to DOM events in Vue and call a function. For example, `<p v-on:click=\"foo\"\
    >Click me!</p>` would call the component’s `foo` method every time the paragraph\
    \ was clicked. If you’d like to go through event handling in greater detail, I\
    \ highly recommend the [Vue documentation on event handling](https://vuejs.org/v2/guide/events.html).\n\
    \n`v-model` creates a two-way data binding between a form input and a piece of\
    \ data. Behind the scenes, `v-model` is effectively listening for change events\
    \ on the form input and updating the data in the Vue component to match.\n\nTaking\
    \ our template above into consideration, here’s how we’re using `v-on` and `v-model`\
    \ to deal with the data in the form:\n\n*   `v-on:submit.prevent=\"onSubmit\"\
    ` binds the method `onSubmit` to be run when the form is submitted. By adding\
    \ `.prevent` that means that Vue will automatically prevent the default action\
