    \ of more things — like define custom document templates and error layouts — but\
    \ we don’t need those for our simple blog. I urge you to check out the [Nuxt.js\
    \ documentation on views](https://nuxtjs.org/guide/views) to see all the possibilities.\n\
    \n### Simple Pages and Routes\n\nPages in Nuxt.js are created as [single file\
    \ components](https://vuejs.org/v2/guide/single-file-components.html) in the `pages`\
    \ directory. Nuxt.js automatically transforms every `.vue` file in this directory\
    \ into an application route.\n\n### Building the Blog Homepage\n\nWe can add our\
    \ blog homepage by updating the `index.vue` file generated by the Nuxt.js template\
    \ in the pages directory:\n\n```\n<!-- ./pages/index.vue -->\n<template>\n  <div>\n\
    \    <section class=\"hero is-medium is-primary is-bold\">\n      <div class=\"\
    hero-body\">\n        <div class=\"container\">\n          <h1 class=\"title\"\
    >\n            Welcome to the JavaScript SSR Blog.\n          </h1>\n        \
    \  <h2 class=\"subtitle\">\n            Hope you find something you like.\n  \
    \        </h2>\n        </div>\n      </div>\n    </section>\n  </div>\n</template>\n\
    \n<script>\n  export default {\n    head: {\n      title: 'Home'\n    }\n  }\n\
    </script>\n\n<!-- Remove the CSS styles -->\n```\n\nAs stated earlier, specifying\
    \ the `title` option here automatically injects its value into the `titleTemplate`\
    \ value before rendering the page.\n\nWe can now reload our app to see the changes\
    \ to the homepage.\n\n### Building the About page\n\nAnother great thing about\
    \ Nuxt.js is that it will listen to file changes inside the `pages` directory,\
    \ so there’s no need to restart the application when adding new pages.\n\nWe can\
    \ test this, by adding a simple `about.vue` page:\n\n```\n<!-- ./pages/about.vue\
    \ -->\n<template>\n  <div class=\"main-content\">\n    <div class=\"container\"\
    >\n      <h2 class=\"title is-2\">About this website.</h2>\n      <p>Curabitur\
    \ accumsan turpis pharetra <strong>augue tincidunt</strong> blandit. Quisque condimentum\
    \ maximus mi, sit amet commodo arcu rutrum id. Proin pretium urna vel cursus venenatis.\
    \ Suspendisse potenti. Etiam mattis sem rhoncus lacus dapibus facilisis. Donec\
    \ at dignissim dui. Ut et neque nisl.</p>\n      <br>\n      <h4 class=\"title\
    \ is-4\">What we hope to achieve:</h4>\n      <ul>\n        <li>In fermentum leo\
    \ eu lectus mollis, quis dictum mi aliquet.</li>\n        <li>Morbi eu nulla lobortis,\
    \ lobortis est in, fringilla felis.</li>\n        <li>Aliquam nec felis in sapien\
    \ venenatis viverra fermentum nec lectus.</li>\n        <li>Ut non enim metus.</li>\n\
    \      </ul>\n    </div>\n  </div>\n</template>\n\n<script>\nexport default {\n\
    \  head: {\n    title: 'About'\n  }\n}\n</script>\n```\n\nNow, we can visit [http://localhost:3000/about](http://localhost:3000/about)\
    \ to see the about page, without having to restart the app, which is awesome.\n\
    \n### Showing Blog Posts on the Homepage"
