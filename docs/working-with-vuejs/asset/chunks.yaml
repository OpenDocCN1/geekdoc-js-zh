    \ component:\n\n```\nVue.component('counter', {\n  template: `\n    <div>\n  \
    \    <button @click=\"increment\">+</button>\n    </div>\n  `,\n  props: {\n \
    \   value: {\n      type: Number,\n      required: true\n    }\n  },\n  methods:\
    \ {\n    increment() {\n      this.count++\n    }\n  }\n})\n```\n\nThen our template\
    \ will look like this:\n\n```\n<div id=\"app\">\n  <h3>\n    {{ count }}\n  </h3>\n\
    \  <counter :count=\"count\" />\n</div>\n```\n\nIf you try incrementing the value\
    \ like that, it won’t work. To make it work, we have to emit an event from the\
    \ child component, send the new value of `count` and also listen for this event\
    \ in the parent component.\n\nFirst, we create a new instance of Vue and set it\
    \ to `eventBus`:\n\n```\nconst eventBus = new Vue();\n```\n\nWe can now make use\
    \ of the event bus in our component. The child component will look like this:\n\
    \n```\nVue.component('counter', {\n  props: {\n    count: {\n      type: Number,\n\
    \      required: true\n    }\n  },\n  methods: {\n    increment() {\n      this.count++\n\
    \      eventBus.$emit('count-incremented', this.count)\n    }\n  },\n  template:\
    \ `\n  <div>\n    <button @click=\"increment\">+</button>\n  </div>\n  `\n})\n\
    ```\n\nThe event is emitted each time the `increment` method is called. We have\
    \ to listen for the event in the main component and then set `count` to the value\
    \ we obtained through the event that was emitted:\n\n```\nnew Vue({\n  el: '#app',\n\
    \  data() {\n    return {\n      count: 0\n    }\n  },\n  created() {\n    eventBus.$on('count-incremented',\
    \ (count) => {\n      this.count = count\n    })\n  }\n})\n```\n\nNote that we’re\
    \ making use of [Vue’s created lifecycle method](https://vuejs.org/v2/api/#created)\
    \ to hook into the component before it’s mounted and to set up the event bus.\n\
    \nUsing an event bus is good if your application isn’t complex, but please remember\
    \ that, as your application grows, you may need to make use of Vuex instead.\n\
    \n#### Live Code\n\nSee the Pen [Vue Components - Event Bus](https://codepen.io/SitePoint/pen/qLjzZL/)\n\
    \n## Nesting Content in Components Using Slots\n\nIn all the examples we’ve seen\
    \ so far, the components have been self-closing elements. However, in order to\
    \ make components that can be composed together in useful ways, we need to be\
    \ able to nest them inside one another as we do with HTML elements.\n\nIf you\
    \ try using a component with a closing tag and putting some content inside, you’ll\
    \ see that Vue just swallows this up. Anything within the component’s opening\
    \ and closing tags is replaced with the rendered output from the component itself:\n\
    \n```\n<div id=\"app\">\n  <author-detail :owner=\"author\">\n    <p>This will\
    \ be replaced</p>\n  </author-detail>\n</div>\n```\n\nLuckily, [Vue’s slots](https://vuejs.org/v2/guide/components-slots.html)\
    \ make it possible to pass an arbitrary value to a component. This can be anything\
    \ from DOM elements from a parent component to a child component. Let’s see how\
    \ they work.\n\nThe script part of our components will look like this:\n\n```\n\
    Vue.component('list', {\n  template: '#list'\n})\n\nnew Vue({\n  el: \"#app\"\n\
    })\n```\n\nThen the templates will look like this:\n\n```\n<div id=\"app\">\n\
    \  <h2>Slots</h2>\n  <list>\n    <h4>I am the first slot</h4>\n  </list>\n  <list>\n\
    \    <h4>I am the second slot</h4>\n  </list>\n</div>\n\n<script type=\"text/x-template\"\
    \ id=\"list\">\n  <div>\n    <h3>Child Component</h3>\n    <slot></slot>\n  </div>\n\
    </script>\n```\n\nThe content inside our `<list>` component gets rendered between\
    \ the `<slot></slot>` element tag. We can also make use of fallback content, for\
    \ cases where the parent doesn’t inject any.\n\n```\n<div id=\"app\">\n  <h2>Slots</h2>\n\
    \  <list>\n    <h4>I am the first slot</h4>\n  </list>\n  <list></list>\n</div>\n\
    \n<script type=\"text/x-template\" id=\"list\">\n  <div>\n    <h3>Child Component</h3>\n\
    \    <slot>This is fallback content</slot>\n  </div>\n</script>\n```\n\nThe fallback\
    \ content will render in cases where there’s no content from the parent component.\n\
    \n#### Live Code\n\nSee the Pen [Vue Components - Slots](https://codepen.io/SitePoint/pen/zyzQgR/).\n\
    \n## Conclusion\n\nThis has been a high-level introduction to working with components\
    \ in Vue. We looked at how to create components in Vue, how to communicate from\
    \ a parent to a child component via props and from a child to a parent via an\
    \ event bus. We then finished off by looking at slots, a handy method for composing\
    \ components in useful ways. I hope you’ve found the tutorial useful.\n\n# Chapter\
    \ 5: A Beginner’s Guide to Working with Forms in Vue\n\n### by Kingsley Silas\n\
    \nForms are an integral part of modern web applications. They allow us to receive\
    \ input from users which we can then validate and act upon.\n\nIn this tutorial,\
    \ I’m going to demonstrate how to work with forms in Vue. We’ll start off by creating\
    \ a simple form and look at how to use two-way data binding to keep user input\
    \ in sync with our data model. We’ll then take a look at modifiers, which allow\
    \ us to change the browser’s default form-handling behavior, and filters, which\
    \ allow us to format the output the user sees. We’ll finish off by implementing\
    \ form validation using the [VeeValidate](https://baianat.github.io/vee-validate/)\
    \ plugin. Each section will be accompanied by a runnable CodePen demo.\n\nBy the\
    \ time you’ve finished reading, you’ll have seen how easy Vue makes it to work\
    \ with forms, and you’ll be able to implement all of these techniques in your\
    \ own apps.\n\nLet’s get to it.\n\n## Two-way Data Binding with v-model\n\nVue\
    \ provides a two-way binding feature that keeps the inputs entered by your user\
    \ in sync with the data model. This is made possible by using the [v-model](https://vuejs.org/v2/api/#v-model)\
    \ directive like so: `v-model=\"entry\"`.\n\nIn the data model, you’ll need to\
    \ have the following:\n\n```\ndata() {\n  return {\n    entry: 3\n  }\n}\n```\n\
    \nThen our template will look like this:\n\n```\n<div id=\"app\">\n  <h2>Vue Form</h2>\n\
    \  <h2>{{ entry }}</h2>\n  <input type=\"text\" v-model=\"entry\" />\n</div>\n\
    ```\n\nBy default, the input field will have a value of `3`, which is the initial\
    \ state for our entry. However, that doesn’t stop us from changing the state by\
    \ entering another value in our input field. The value automatically changes as\
    \ we do this. Underneath the hood, the `v-model` directive is shorthand for this:\n\
    \n```\n<div id=\"app\">\n  <h2>Vue Form</h2>\n  <h2>Input: {{ entry }}</h2>\n\
    \  <input type=\"text\"\n     v-bind:value=\"entry\"\n     v-on:input=\"entry=$event.target.value\"\
    \n  />\n</div>\n```\n\nThe `v-model` directive combines the power of [v-bind](https://vuejs.org/v2/api/#v-bind)\
    \ and [v-on:input](https://vuejs.org/v2/api/#v-on) to provide you with the two-way\
    \ data binding for form inputs. The above snippet can also be written like this:"
