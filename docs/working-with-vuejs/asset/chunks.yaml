    Ruby\" v-model=\"languages\">\n      <label for=\"ruby\">Ruby</label>\n      <input\
    \ type=\"checkbox\" id=\"python\" value=\"Python\" v-model=\"languages\">\n  \
    \    <label for=\"python\">Python</label>\n    </div>\n\n    <div>\n      <label>\n\
    \        <input type=\"checkbox\" v-model=\"agreeToTerms\"/>\n        Yes, I agree\
    \ to everything\n      </label>\n    </div>\n  </form>\n</div>\n```\n\nNotice\
    \ that, at the top of the template, we’re doing some basic interpolation to output\
    \ the values of our form fields. We’ll need to declare these as data properties\
    \ on our Vue instance:\n\n```\nnew Vue({\n  el: '#app',\n  data() {\n    return\
    \ {\n      name: \"John Doe\",\n      agreeToTerms: false,\n      genre: '',\n\
    \      gender: '',\n      languages: []\n    }\n  }\n})\n```\n\nWe can finish\
    \ off with some basic styling:\n\n```\nh2 {\n  margin: 30px 0;\n  text-align:\
    \ center;\n  font-size: 3em;\n  color: tomato;\n}\n\n.output {\n  text-align:\
    \ center;\n  margin: 30px;\n}\n\nform {\n  width: 40%;\n  max-width: 350px;\n\
    \  margin: 0 auto 30px;\n  border-radius: 4px;\n  border: none;\n  border-top:\
    \ 2px solid tomato;\n}\n\ninput[type=\"text\"], select {\n  background: rgba(255,\
    \ 255, 255, 0.1);\n  border: none;\n  font-size: 16px;\n  height: auto;\n  margin:\
    \ 0;\n  outline: 0;\n  padding: 10px;\n  width: 100%;\n  background-color: #e8eeef;\n\
    \  color: #2E4049;\n  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.03) inset;\n  margin-bottom:\
    \ 20px;\n}\n\nlabel {\n  display: inline-block;\n  margin: 5px 0 10px 0;\n}\n\n\
    input[type=\"checkbox\"] {  margin: 0 2px 8px 0; }\ninput[type=\"radio\"] {  margin:\
    \ 0 2px 0 15px; }\n.gender label {  margin: 0 0 10px 0; }\n.languages label {\
    \  margin: 0 15px 0 0; }\np {  margin-bottom: 3px; }\n```\n\n#### Live Code\n\n\
    ![-](Images/forms1.png)\n\nAnd [here’s the demo running on CodePen](https://codepen.io/SitePoint/pen/KbpYoj/).\
    \ Try altering any of the fields. You should see the updated value reflected in\
    \ the UI.\n\n## Altering the Browser’s Default Behavior with Modifiers\n\nEvents\
    \ are handled in Vue using the `v-on` directive. However, there are modifiers\
    \ that allow us to change the behaviors of these events.\n\nLet’s say we have\
    \ a counter that can be increased or decreased depending on the button that’s\
    \ clicked. We can modify the click event to ensure that it’s only clicked once,\
    \ like so:\n\n```\n<button class=\"incrementButton\" @click.once=\"handleIncrement\"\
    >\n  Increment\n</button>\n```\n\n#### Live Code\n\n![-](Images/forms2.png)\n\n\
    It becomes impossible to increment the counter multiple times. [Here’s a demo\
    \ that demonstrates this](https://codepen.io/SitePoint/pen/wRabgw/).\n\nAnother\
    \ modifier you’ll use frequently is the `.prevent` modifier—which prevents the\
    \ default behavior of an event. Let’s redo the demo above to include a form.\n\
    \nThe template part will look like this:\n\n```\n<div id=\"app\">\n  <h2>Counter</h2>\n\
    \  <form>\n    <h2>{{ count }}</h2>\n    <div class=\"div__buttons\">\n      <button\
    \ class=\"incrementButton\" type=\"submit\">\n        Increment\n      </button>\n\
    \    </div>\n  </form>\n</div>\n```\n\nThe form will submit each time you click\
    \ the button, causing the value of `count` to change to `0`. To avoid that, we\
    \ have to add the `.prevent` modifier, like so:\n\n```\n<div id=\"app\">\n  <h2>Counter</h2>\n\
    \  <form @submit.prevent=\"handleIncrement\">\n    ...\n  </form>\n</div>\n```\n\
    \nThe script section should look like this:\n\n```\nnew Vue({\n  el: '#app',\n\
    \  data() {\n    return {\n      count: 0\n    }\n  },\n  methods: {\n    handleIncrement()\
    \ {\n      this.count += 1;\n    }\n  }\n})\n```\n\nThat will alter the default\
    \ behavior of the button. You can also use this if on anchor and form elements.\n\
    \n#### Live Code\n\n![-](Images/forms3.png)\n\n[Here’s a working demo of the technique](https://codepen.io/SitePoint/pen/WLvBMw/)\n\
    \nOther [event modifiers](https://vuejs.org/v2/guide/events.html#Event-Modifiers)\
    \ include these:\n\n*   `.capture`: This is used for handling an event.\n\n* \
    \  `.self`: This will be triggered if the event’s target is the element itself.\n\
    \n*   `.stop`: This will stop the propagating of the event up the DOM tree.\n\n\
    And there are [some modifiers you can apply to `v-model` itself](https://vuejs.org/v2/guide/forms.html#Modifiers):\n\
    \n*   `.lazy`: This syncs the input with the data model after a `change` event.\
    \ By default, `v-model` syncs after each `input` event.\n\n*   `.number`: This\
    \ typecasts user input as a number.\n\n*   `.trim`: This automatically trims the\
    \ user input.\n\n## Formatting Output with Filters\n\nFilters make it possible\
    \ for you to transform data. They only change the displayed data, but don’t actually\
    \ transform the data itself. You apply a filter to an expression using the pipe\
    \ `|` symbol.\n\nTo see filters at work, let’s create a filter to capitalize text\
    \ entered through an input:\n\n```\nnew Vue({\n  el: '#app',\n  data() {\n   \
    \ return {\n      entry: \"John\"\n    }\n  },\n  filters: {\n    capitalize(value)\
    \ {\n      return value.toUpperCase()\n    }\n  }\n})\n```\n\nOur filter takes\
    \ a parameter and returns the result of calling `.toUpperCase()` on the parameter.\
    \ This is how we make use of it on our template:\n\n```\n<div id=\"app\">\n  <h2>Filters</h2>\n\
    \  <p>Input: {{ entry }}</p>\n  <p>Filtered Text: {{ entry | capitalize }}</p>\n\
    \  <input type=\"text\" v-model=\"entry\" />\n</div>\n```\n\nNote that the fact\
    \ that the filter is a function doesn’t mean we call it with `capitalize(entry)`.\
    \ In the template, we display two versions of the input—the transformed text and\
    \ the original text."
