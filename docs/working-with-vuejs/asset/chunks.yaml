    \ scoped src=\"./style.css\"></style>\n```\n\n再次，对于任何 Angular 开发者来说，这看起来非常熟悉。在这里我们使用双等而不是三等等，是因为我们希望条件不仅在\
    \ `currentUsername` 为 `null` 时成立，在它为 `undefined` 时也成立，而 `null == undefined` 为\
    \ `true`。\n\n### 从 GitHub 获取数据\n\nVue.js 没有内置 HTTP 库，这是有缘之的。如今，`fetch` API 已经在许多浏览器中原生支持（尽管在编写本文时，IE11、Safari\
    \ 或 iOS Safari 没有）。为了本教程，我将不会使用 polyfill（填充方案），但如果你需要，可以[轻松地在浏览器中对 API 进行 polyfill](https://github.com/github/fetch)。如果你不喜欢\
    \ `fetch` API，有很多第三方的 HTTP 库，Vue 文档中提到的是 [Axios](https://github.com/mzabriskie/axios)。\n\
    \n我是像 Vue 这种不带 HTTP 库的框架的坚定支持者。它保持了框架的包体积，并让开发者选择最适合自己的库，并根据需要轻松自定义请求以与其 API 通信。本文中将坚持使用\
    \ `fetch` API，但你可以随时替换为你喜欢的库。\n\n如果你需要 `fetch` API 的介绍，请查看 [Ludovico Fischer 在\
    \ SitePoint 上的文章](https://www.sitepoint.com/introduction-to-the-fetch-api/)，它将让你快速上手。\n\
    \n为了发起 HTTP 请求，我们将为组件提供另一个方法 `fetchGithubData`，它向 GitHub API 发起请求并存储结果。它还会首先检查是否已经有了该用户的数据，如果是，则不再发送请求：\n\
    \n```javascript\nmethods: {\n  ...\n  fetchGithubData(name) {\n    // 如果我们已经有了数据，就不再请求\n\
    \    if (this.githubData.hasOwnProperty(name)) return\n\n    const url = `https://api.github.com/users/${name}`\n\
    \    fetch(url)\n      .then(r => r.json())\n      .then(data => {\n        //\
    \ 在这里我们需要更新 githubData 对象\n      })\n  }\n}\n```\n\n最后，我们只需要在用户名更改时触发这个方法即可：\n\
    \n```javascript\nmethods: {\n  onUsernameChange(name) {\n    this.currentUsername\
    \ = name\n    this.fetchGithubData(name)\n  },\n  ...\n}\n```\n\n还有一点需要注意，这是由于\
    \ Vue 跟踪你正在处理的数据的方式，以便它知道何时更新视图。有一份非常好的[响应式指南](https://vuejs.org/guide/reactivity.html)\
    \ 详细解释了这一点，但基本上 Vue 无法魔法地知道你何时从对象中添加或删除了属性，所以如果我们这样做：\n\n```javascript\nthis.githubData[name]\
    \ = data\n```\n\nVue 将不会识别，也不会更新我们的视图。相反，我们可以使用特殊的 `Vue.set` 方法，它显式地告诉 Vue 我们添加了一个键。上面的代码看起来应该是这样：\n\
    \n```javascript\nVue.set(this.githubData, name, data)\n```\n\n为了发起 HTTP 请求，我们将组件提供另一个方法\
    \ `fetchGithubData`，它向 GitHub API 发起请求并存储结果。它还会首先检查是否已经有了该用户的数据，如果是，则不再发送请求：\n\
    \n我们最后只需要在用户名更改时触发这个方法：\n\n```javascript\nmethods: {\n  onUsernameChange(name)\
    \ {\n    this.currentUsername = name\n    this.fetchGithubData(name)\n  },\n \
    \ ...\n}\n```\n\n还有一点需要注意，这是由于 Vue 跟踪你正在处理的数据的方式，以便它知道何时更新视图。有一份非常好的[响应式指南](https://vuejs.org/guide/reactivity.html)\
    \ 详细解释了这一点，但基本上 Vue 无法魔法地知道你何时从对象中添加或删除了属性，所以如果我们这样做：\n\n```javascript\nthis.githubData[name]\
    \ = data\n```\n\nVue 将不会识别，也不会更新我们的视图。相反，我们可以使用特殊的 `Vue.set` 方法，它显式地告诉 Vue 我们添加了一个键。上面的代码看起来应该是这样：\n\
    \n```javascript\nVue.set(this.githubData, name, data)\n```\n\n### 在视图中显示统计数据\n\
    \n我们现在可以更新模板来显示一些数据。我们将这段代码包装在另一个 `v-if` 指令中，以便在请求完成后渲染数据：\n\n```html\n<!-- src/GithubOutput/index.vue\
    \ -->\n<p v-if=\"currentUsername == null\">\n  在上方输入用户名以查看其 GitHub 数据\n</p>\n\
    <p v-else>\n  下方是 {{ currentUsername }} 的结果\n  <div v-if=\"githubData[currentUsername]\"\
    >\n    <h4>{{ githubData[currentUsername].name }}</h4>\n    <p>{{ githubData[currentUsername].company\
    \ }}</p>\n    <p>仓库数量：{{ githubData[currentUsername].public_repos }}</p>\n  </div>\n\
    </p>\n```\n\n## 重构\n\n我们确实可以进行一些改进。上面渲染 GitHub 数据的 HTML 代码只需要其中一小部分——用户的数据。这非常适合另一个组件，我们可以把用户数据交给它并由它来渲染。\n\
    \n让我们创建一个 `GithubUserData` 组件，与其他组件相同的结构：\n\n```bash\nmkdir src/GithubUserData\n\
    touch src/GithubUserData/{index.vue,script.js,style.css}\n```\n\n这个组件只有一个微小的区别：它将接收一个属性\
    \ `data`，这将是用户的数据。属性（或 \"props\"）是父传递传递组件的数据位，它们在 Vue 中的行为与 React 中非常相似。在 Vue\
    \ 中，你必须显式地声明组件需要的每个属性，所以在这里说我们的组件将接收一个属性 `data`：\n\n```javascript\n// src/GithubUserData/script.js\n\
    export default {\n  name: 'GithubUserData',\n  props: ['data'],\n  data() {\n\
    \    return {}\n  }\n}\n```\n\n我非常喜欢 Vue 的一个特点是它要求必须是显式的；组件使用的所有属性、数据和组件都是显式声明的。这使得代码变得更易用，我想随着项目的变大变复杂，它会变得更容易维护。\n"
