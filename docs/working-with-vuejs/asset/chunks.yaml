    \  </div>\n</template>\n\n<script>\nimport Counter from './components/Counter.vue'\n\
    \nexport default {\n  name: 'app',\n  components: {\n    Counter\n  }\n}\n</script>\n\
    ```\n\n你可以保持样式不变。\n\n### 创建计数器\n\n让我们先从初始化一个计数并将其输出到页面开始。我们还会告知用户当前计数是偶数还是奇数。打开\
    \ `src/components/Counter.vue` 并将代码替换为以下内容：\n\n```\n<template>\n  <div>\n    <p>已点击\
    \ {{ count }} 次！计数为 {{ parity }}.</p>\n  </div>\n</template>\n\n<script>\nexport\
    \ default {\n  name: 'Counter',\n  data: function() {\n    return {\n      count:\
    \ 0\n    };\n  },\n  computed: {\n    parity: function() {\n      return this.count\
    \ % 2 === 0 ? 'even' : 'odd';\n    }\n  }\n}\n</script>\n```\n\n如你所见，我们有一个名为 `count`\
    \ 的状态变量和一个名为 `parity` 的计算属性，它根据 `count` 是奇数还是偶数返回字符串 `even` 或 `odd`。\n\n要查看目前的内容，请在根目录下运行\
    \ `npm run serve` 启动应用，并导航到 [`localhost:8080`](http://localhost:8080)。\n\n可以随意更改计数器的值，以显示\
    \ `counter` 和 `parity` 的正确输出。当你满意后，在继续下一步之前，请确保将其重置为 0。\n\n### 递增和递减\n\n在 `Counter.vue`\
    \ 的 `<script>` 部分 `computed` 属性之后，添加以下代码：\n\n```\nmethods: {\n  increment: function\
    \ () {\n    this.count++;\n  },\n  decrement: function () {\n    this.count--;\n\
    \  },\n  incrementIfOdd: function () {\n    if (this.parity === 'odd') {\n   \
    \   this.increment();\n    }\n  },\n  incrementAsync: function () {\n    setTimeout(()\
    \ => {\n      this.increment()\n    }, 1000)\n  }\n}\n```\n\n前两个函数 `increment`\
    \ 和 `decrement` 应该是自而易懂的。`incrementIfOdd` 函数仅在 `count` 的值为奇数时才执行，而 `incrementAsync`\
    \ 是一个异步函数，会在一秒后执行递增。\n\n为了在模板中访问这些新方法，我们需要定义一些按钮。在输出计数和奇性的模板代码之后插入以下内容：\n\n```\n\
    <button @click=\"increment\" variant=\"success\">递增</button>\n<button @click=\"\
    decrement\" variant=\"danger\">递减</button>\n<button @click=\"incrementIfOdd\"\
    \ variant=\"info\">奇数时递增</button>\n<button @click=\"incrementAsync\" variant=\"\
    warning\">异步递增</button>\n```\n\n保存后，浏览器应该会自动刷新。点击所有按钮以确保一切运行符合预期。\n\n### 实时代码\n\
    \n[使用本地状态的 Vue 计数器](https://codepen.io/SitePoint/pen/xQXNwm/) 显示了你应该的结果。\n\n计数器示例现在已完成。让我们检查\
    \ Vuex 的基础知识，然后再查看我们将如何重写计数器来实现这些功能。\n\n## Vuex 如何工作\n\n在介绍具体实现之前，最好先简单掌握 Vuex\
    \ 代码是如何组织的。如果你熟悉类似 Redux 的类的框架，那么你不会在这里发现任何太令人惊讶的地方。如果你以前没有处理过任何基于 Flux 的状态管理框架，请密切注意。\n\
    \n### Vuex Store\n\nstore 为 Vue 应用中的共享状态提供了一个中心化的仓库。这是它最基本形式的样式：\n\n```\n// src/store/index.js\n\
    \nimport Vue from 'vue'\nimport Vuex from 'vuex'\n\nVue.use(Vuex)\n\nexport default\
    \ new Vuex.Store({\n  state: {\n    //在此处放置变量和集合\n  },\n  mutations: {\n    //在此处放置更改状态的同步函数，例如添加、编辑、删除\n\
    \  },\n  actions: {\n    //在此处放置可以调用一个或多个 mutation 函数的异步函数\n  }\n})\n```\n\n定义\
    \ store 后，你需要将其注入到你的 Vue.js 应用中：\n\n```\n// src/main.js\nimport store from './store'\n\
    \nnew Vue({\n  store,\n  render: h => h(App)\n}).$mount('#app')\n```\n\n这将使得注入的\
    \ store 实例可以通过 `this.$store` 使应用程序中的每个组件可用。\n\n### 使用状态\n\n状态也被称为单一状态树（single\
    \ state tree），它只是包含所有前端应用数据的对象。Vuex 就像 Redux 一样，使用单一 store 操作。应用程序数据以树状结构组织。它的构建非常简单。这是一个示例：\n\
    \n```\nstate: {\n  products: [],\n  count: 5,\n  loggedInUser: {\n    name: 'John',\n\
    \    role: 'Admin'\n  }\n}\n```\n\n在这里，我们初始化了一个为空数组的 `products`，以及初始化值为 5 的 `count`。我们还有\
    \ `loggedInUser`，这是一个包含多个字段的 JavaScript 字面量对象。状态属性可以包含任何有效类型，从布尔值到数组到其他对象。\n\n\
    在视图中显示状态有多种方法。我们可以在模板中通过 `$store` 直接引用 store：\n\n```\n<template>\n  <p>{{ $store.state.count\
    \ }}</p>\n</template>\n```\n\n或者我们可以从[计算属性](https://vuejs.org/guide/computed.html)内部返回一些\
    \ store 状态：\n\n```\n<template>\n  <p>{{ count }}</p>\n</template>\n\n<script>\n\
    export default {\n  computed: {\n    count() {\n      return this.$store.state.count;\n\
    \    }\n  }\n}\n</script>\n```\n\n由于 Vuex store 是响应式的，每当 `$store.state.count`\
    \ 的值变化时，视图也会随之变化。这一切都在后台发生，让你的代码看起来简单整洁。\n\n### `mapState` 辅助函数\n\n现在，假设你有多个想在视图显示的状态。声明大量的计算属性可能会变得繁琐，所以\
    \ Vuex 提供了 `mapState` 辅助函数。它可以轻松地生成计算属性。这是一个示例：\n\n```\n<template>\n  <div>\n\
    \    <p>欢迎 {{ loggedInUser.name }}.</p>\n    <p>计数为 {{ count }}.</p>\n  </div>\n\
    </template>\n\n<script>\nimport { mapState } from 'vuex';\n\nexport default {\n\
    \  computed: mapState({\n    count: state => state.count,\n    loggedInUser: state\
    \ => state.loggedInUser\n  })\n}\n</script>\n```\n\n这里是更简单的替代方案，我们可以向 `mapState`\
    \ 函数传递字符串数组：\n\n```javascript\nexport default {\n  computed: mapState([\n    'count',\
    \ 'loggedInUser'\n  ])\n}\n```\n\n这个版本的代码与上面的完全相同。你应该注意 `mapState` 返回的是一个对象。如果你想与其他计算属性一起使用它，可以使用[展开运算符](https://developer.mozilla.org/en-US/Reference/Operators/Spread_syntax)。如下：\n\
    \n```javascript\ncomputed: {\n  ...mapState([\n    'count', 'loggedInUser'\n \
    \ ]),\n  parity: function() {\n    return this.count % 2 === 0 ? 'even' : 'odd'\n\
    \  }\n}\n```\n\n### Getters\n\n在 Vuex store 中，getters 等同于 Vue 的计算属性。它们允许你创建可以在组件间共享的派生状态。这是一个快速示例：\n\
    \n```javascript\ngetters: {\n  depletedProducts: state => {\n    return state.products.filter(product\
    \ => product.stock <= 0)\n  }\n}\n```\n\n`getter`处理器的结果（当作为属性访问时）会被缓存，并且可以被多次调用。它们对状态变化具有响应性。换句话说，如果它依赖的状态发生变化，`getter`\
    \ 函数会自动执行并缓存新结果。任何访问了 `getter` 处理的组件都将立即更新。这是从组件中访问 `getter`处理器的方法：\n\n```javascript\n\
    computed: {\n  depletedProducts() {\n    return this.$store.getters.depletedProducts;\n\
    \  }\n}\n```\n\n#### `mapGetters` 辅助函数\n\n你可以使用 `mapGetters` 辅助函数来简化 getters 代码：\n\
    \n```javascript\nimport { mapGetters } from 'vuex'\n\nexport default {\n  //..\n\
    \  computed: {\n    ...mapGetters([\n      'depletedProducts',\n      'anotherGetter'\n\
    \    ])\n  }\n}\n```\n\n"
- fmt: "\nThere’s an option for passing arguments to a `getter` handler by returning\
    \ a function. This is useful if you want to perform a query within the `getter`:\n\
    \n```\ngetters: {\n  getProductById: state => id => {\n    return state.products.find(product\
    \ => product.id === id);\n  }\n}\n\nstore.getters.getProductById(5)\n```\n\nDo\
    \ note that each time a `getter` handler is accessed via a method, it will always\
    \ run and the result won’t be cached.\n\nCompare:\n\n```\n// property notation,\
    \ result cached\nstore.getters.depletedProducts\n\n// method notation, result\
    \ not cached\nstore.getters.getProductById(5)\n```\n\n### Changing State with\
    \ Mutations\n\nAn important aspect of the Vuex architecture is that components\
    \ never alter the state directly. Doing so can lead to odd bugs and inconsistencies\
    \ in the app’s state.\n\nInstead, the way to change state in a Vuex store is by\
    \ committing a `mutation`. For those of you familiar with Redux, these are similar\
    \ to `reducers`.\n\nHere is an example of a mutation that increases a `count`\
    \ variable stored in `state`:\n\n```\nexport default new Vuex.Store({\n  state:{\n\
    \    count: 1\n  },\n  mutations: {\n    increment(state) {\n      state.count++\n\
    \    }\n  }\n})\n```\n\nYou can’t call a mutation handler directly. Instead, you\
    \ trigger one by “committing a mutation” like this:\n\n```\nmethods: {\n  updateCount()\
    \ {\n    this.$store.commit('increment');\n  }\n}\n```\n\nYou can also pass parameters\
    \ to a mutation:\n\n```javascript\n// store.js\nmutations: {\n  incrementBy(state,\
    \ n) {\n    state.count += n;\n  }\n}\n```\n\n```\n// component\nupdateCount()\
    \ {\n  this.$store.commit('incrementBy', 25);\n}\n```\n\nIn the above example,\
    \ we’re passing the mutation an integer by which it should increase the count.\
    \ You can also pass an object as a parameter. This way, you can include multiple\
    \ fields easily without overloading your mutation handler:\n\n```javascript\n\
    // store.js\nmutations: {\n  incrementBy(state, payload) {\n    state.count +=\
    \ payload.amount;\n  }\n}\n```\n\n```\n// component\nupdateCount() {\n  this.$store.commit('incrementBy',\
    \ { amount: 25 });\n}\n```\n\nYou can also perform an `object-style commit` that\
    \ looks like this:\n\n```javascript\nstore.commit({\n  type: 'incrementBy',\n\
    \  amount: 25\n})\n```\n\nThe mutation handler will remain the same.\n\n### The\
    \ `mapMutations` Helper\n\nSimilar to `mapState` and `mapGetters`, you can also\
    \ use the `mapMutations` helper to reduce the boilerplate for your mutation handlers:\n\
    \n```javascript\nimport { mapMutations } from  'vuex'\n\nexport default{\n  methods:\
    \ {\n    ...mapMutations([\n      'increment', // maps to this.increment()\n \
    \     'incrementBy' // maps to this.incrementBy(amount)\n    ])\n  }\n}\n```\n\
    \nOn a final note, mutation handlers must be synchronous. You can attempt to write\
    \ an asynchronous mutation function, but you’ll come to find out later down the\
    \ road that it causes unnecessary complications. Let’s move on to actions.\n\n\
    ### Actions\n\nActions are functions that don’t change the state themselves. Instead,\
    \ they commit mutations after performing some logic (which is often asynchronous).\
    \ Here’s a simple example of an action:\n\n```javascript\n//..\nactions: {\n \
    \ increment(context) {\n    context.commit('increment');\n  }\n}\n```\n\nAction\
    \ handlers receive a `context` object as their first argument, which gives us\
    \ access to store properties and methods. For example:\n\n* `context.commit`:\
    \ commit a mutation\n* `context.state`: access state\n* `context.getters`: access\
    \ getters\n\nYou can also use `argument destructing` to extract the store attributes\
    \ you need for your code. For example:\n\n```javascript\nactions: {\n  increment({\
    \ commit }) {\n    commit('increment');\n  }\n}\n```\n\nAs mentioned above, actions\
    \ can be asynchronous. Here’s an example:\n\n```javascript\nactions: {\n  incrementAsync:\
    \ async({ commit }) => {\n    return await setTimeout(() => { commit('increment')\
    \ }, 1000);\n  }\n}\n```\n\nIn this example, the mutation is committed after 1,000\
    \ milliseconds.\n\nLike mutations, action handlers aren’t called directly, but\
    \ rather via a dedicated `dispatch` method on the store, like so:\n\n```javascript\n\
    store.dispatch('incrementAsync')\n\n// dispatch with payload\nstore.dispatch('incrementBy',\
    \ { amount: 25})\n\n// dispatch with object\nstore.dispatch({\n  type: 'incrementBy',\n\
    \  amount: 25\n})\n```\n\nYou can dispatch an action in a component like this:\n\
    \n```javascript\nthis.$store.dispatch('increment')\n```\n\n### The `mapActions`\
    \ Helper\n\nAlternatively, you can use the `mapActions` helper to assign action\
    \ handlers to local methods:\n\n```javascript\nimport { mapActions } from  'vuex'\n\
    \nexport default {\n  //..\n  methods: {\n    ...mapActions([\n      'incrementBy',\
    \ // maps this.increment(amount) to this.$store.dispatch(increment)\n      'incrementAsync',\
    \ // maps this.incrementAsync() to this.$store.dispatch(incrementAsync)\n    \
    \  add: 'increment' // maps this.dispatch(increment)\n    ])\n  }\n}\n```\n"
