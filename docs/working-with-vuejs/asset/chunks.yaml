    \ `0.js` 的文件，它包含了你的异步组件。\n\n![webpack  webpack 代码分割](img/15431553231-network-tab-output.png\
    \ \"异步组件代码分割\")\n\n## 按条件加载异步组件\n\n现在我们已经掌握了异步组件，让我们通过只在真正需要时才加载它们，来真正发挥它们的威力吧。在篇文章的上一个章节中，我解释了一个结账框的用例，它只有在用户点击结账按钮时才会被加载。让我们来实现这个功能。\n\
    \n### 项目设置\n\n如果你还没有安装 Vue CLI，现在应该去下载：\n\n```\nnpm i -g @vue/cli\n```\n\n接下来，使用\
    \ CLI 创建一个新项目，并在提示时选择默认预设：\n\n```\nvue create my-store\n```\n\n进入项目目录，然后安装 [ant-design-vue](https://www.npmjs.com/package/ant-design-vue)\
    \ 库，我们将使用它来进行样式设计：\n\n```\ncd my-store\nnpm i ant-design-vue\n```\n\n接下来，在 `src/main.js`\
    \ 中导入 Ant Design 库：\n\n```\nimport 'ant-design-vue/dist/antd.css'\n```\n\n最后，在\
    \ `src/components` 中创建两个新组件`Checkout.vue` 和 `Items.vue`：\n\n```\ntouch src/components/{Checkout.vue,Items.vue}\n\
    ```\n\n### 构建商店视图\n\n打开 `src/App.vue` 并将其代码替换为以下内容：\n\n```\n<template>\n  <div\
    \ id=\"app\">\n    <h1>{{ msg }}</h1>\n    <items></items>\n  </div>\n</template>\n\
    \n<script>\nimport items from \"./components/Items\"\n\nexport default {\n  components:\
    \ {\n    items\n  },\n  name: 'app',\n  data () {\n    return {\n      msg: 'My\
    \ Fancy T-Shirt Store'\n    }\n  }\n}\n</script>\n\n<style>\n#app {\n  font-family:\
    \ 'Avenir', Helvetica, Arial, sans-serif;\n  -webkit-font-smoothing: antialiased;\n\
    \  -moz-osx-font-smoothing: grayscale;\n  text-align: center;\n  color: #2c3e50;\n\
    \  margin-top: 60px;\n}\n\nh1, h2 {\n  font-weight: normal;\n}\n\nul {\n  list-style-type:\
    \ none;\n  padding: 0;\n}\n\nli {\n  display: inline-block;\n  margin: 0 10px;\n\
    }\n\na {\n  color: #42b983;\n}\n</style>\n```\n\n这里没有什么特别复杂的。。我们做的只是显示一条消息并渲染一个\
    \ `<items>` 组件。\n\n接下来，打开 `src/components/Items.vue` 并添加以下代码：\n\n```\n<template>\n\
    \  <div>\n    <div style=\"padding: 20px;\">\n      <Row :gutter=\"16\">\n   \
    \     <Col :span=\"24\" style=\"padding:5px\">\n          <Icon type=\"shopping-cart\"\
    \ style=\"margin-right:5px\"/>{{shoppingList.length}}\n          <Button @click=\"\
    show = true\" id=\"checkout\">Checkout</Button>\n        </Col>\n      </Row>\n\
    \    <div v-if=\"show\">\n      <Row :gutter=\"16\" style=\"margin:0 400px 50px\
    \ 400px\">\n        <checkout v-bind:shoppingList=\"shoppingList\"></checkout>\n\
    \      </Row>\n    </div>\n    <div style=\"background-color: #ececec; padding:\
    \ 20px;\">\n      <Row :gutter=\"16\">\n        <Col :span=\"6\" v-for=\"(item,\
    \ key) in items\" v-bind:key=\"key\" style=\"padding:5px\">\n          <Card v-bind:title=\"\
    item.msg\" v-bind:key=\"key\">\n            <Button type=\"primary\" @click=\"\
    addItem(key)\">${{item.price}}</Button>\n          </Card>\n        </Col>\n \
    \     </Row>\n    </div>\n  </div>\n</template>\n\n<script>\nimport { Card, Col,\
    \ Row, Button } from 'ant-design-vue';\n\nexport default {\n  methods: {\n   \
