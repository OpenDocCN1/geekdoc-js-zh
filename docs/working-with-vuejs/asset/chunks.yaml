  trans: "\n\n作为一个示例应用，我们将使用 GitHub API 来构建一个应用程序，该应用允许我们输入用户名并查看该用户的 GitHub 统计数据。我选择\
    \ GitHub API 是因为它对大多数人来说都很熟悉，不需要身份验证即可使用，并且为我们提供了相当的信息。\n\n在开始编写应用之前，我喜欢快速思考我们需要哪些组件。我想我们的\
    \ `App` 组件将渲染另外两个组件：`GithubInput`（用于接收用户输入）以及 `GithubOutput`（它将在屏幕上显示用户的这些）。我们将从输入部分开始。\n\
    \n## Github\n\n你 可以在 [GitHub 上找到所有代码](https://github.com/sitepoint-editors/vue2-demo-project)，甚至可以查看[在线运行的应用程序](http://sitepoint-vue2-demo.surge.sh/)。\n\
    \n### 初始设置\n\n在 `src` 目录内，为 `GithubOutput` 和 `GithubInput` 组件创建文件夹：\n\n```bash\n\
    mkdir src/{GithubInput,GithubOutput}\n```\n\n为每个文件夹添加必要的文件：\n\n```bash\ntouch\
    \ src/GithubInput/{index.vue,script.js,style.css}\ntouch src/GithubOutput/{index.vue,script.js,style.css}\n\
    ```\n\n现在 `src` 文件夹的结构看起来如下：\n\n```\n.\n├── App\n│   ├── index.vue\n│   ├── script.js\n\
    │   └── style.css\n├── GithubInput\n│   ├── index.vue\n│   ├── script.js\n│  \
    \ └── style.css\n├── GithubOutput\n│   ├── index.vue\n│   ├── script.js\n│   └──\
    \ style.css\n├── index.html\n└── index.js\n```\n\n## Vue.js 中的表单\n\n让我们从 `GithubInput`\
    \ 组件开始。与 `App` 组件一样，`index.vue` 文件应该包含模板，并加载脚本和 CSS 文件。目前模板只包含 `<p>github input</p>`。我们稍后会正确填充它。我喜欢放一些占位\
    \ HTML，这样在创建新组件时，就可以检查模板是否连接得当：\n\n```vue\n<!-- src/GithubInput/index.vue -->\n\
    <template>\n  <p>github input</p>\n</template>\n\n<script src=\"./script.js\"\
    ></script>\n<style scoped src=\"./style.css\"></style>\n```\n\n在创建此组件时，我们所做的不同之处是创建一个与组件关联的数据。这与\
    \ React 的状态（state）概念非常相似：\n\n```javascript\n// src/GithubInput/script.js\nexport\
    \ default {\n  name: 'GithubInput',\n  data() {\n    return {\n      username:\
    \ '',\n    }\n  }\n}\n```\n\n这表示该组件有一份数据 `username`，由它拥有并负责。我们稍后将根据用户的输入更新此数据。\n\
    \n最后，为了将此组件显示在屏幕上，我需要在 `App` 组件中注册它，因为是 `App` 组件来渲染它。\n\n为了做到这一点，我更新了 `src/App/script.js`\
    \ 并告诉它 `GithubInput`：\n\n```javascript\n// src/App/script.js\nimport GithubInput\
    \ from '../GithubInput/index.vue'\n\nexport default {\n  name: 'App',\n  components:\
    \ {\n    'github-input': GithubInput,\n  },\n  data() {\n    return {}\n  },\n\
    }\n```\n\n然后我可以更新 `App` 组件的模板：\n\n```vue\n<!-- src/App/index.vue -->\n<div\n \
    \ <p>Hello World</p>\n  <github-input></github-input>\n</div>\n```\n\nVue 组件的一个限制（这在\
    \ Angular 和 React 中也是如此）是每个组件必须有一个根节点，因此当一个组件必须渲染多个元素时，务必将它们全部封装在某些元素中，最常见的是 `div`。\n\
    \n## 跟踪表单输入\n\n我们的 `GithubInput` 组件需要做两件事：\n\n*   跟踪输入的当前值\n*   通知该值已更改，以便其他组件能够获知并更新它们的状态。\n\
    \n我们可以通过创建一个包含一个 `input` 元素的 `form` 来实现第一个版本。我们可以使用 Vue 内置的指令，这些指令允许我们跟踪表单值。`GithubInput`\
    \ 的模板看起来如下所示：\n\n```vue\n<form v-on:submit.prevent=\"onSubmit\">\n  <input type=\"\
    text\" v-model=\"username\" placeholder=\"Enter a github username here\" />\n\
    \  <button type=\"submit\">Go!</button>\n</form>\n```\n\n你会注意到有两个重要的属性：`v-on`\
    \ 和 `v-model`。\n\n`v-on` 是我们在 Vue 中绑定 DOM 事件并调用函数的方式。例如，`<p v-on:click=\"foo\"\
    >Click me!</p>` 每当段落被点击时，都会调用组件的 `foo` 方法。如果你想更详细地了解事件处理，我强烈推荐 [Vue 关于事件处理的官方文档](https://vuejs.org/v2/guide/events.html)。\n\
    \n`v-model` 在表单输入和数据之间创建了双向数据绑定。在后台，`v-model` 实际上在监听表单输入上的更改事件，并更新 Vue 组件中的数据以保持匹配。\n\
    \n考虑到我们的模板，`v-on:submit.prevent=\"onSubmit\"` 和 `v-model=\"username\"` 是关键所在。`v-on`\
    \ 是我们绑定 DOM 事件并调用函数的方式。`v-model` 创建了双向数据绑定。\n\n当你的应用程序增长时，你可能想要研究更有结构化的方法，例如 Vuex。目前，一个消息总线（message\
    \ bus）就能胜任。好消息是，可以使用空的 Vue 实例作为消息总线。为了这样做，我们将创建 `src/bus.js`，它简单地创建一个 Vue 实例并将其导出：\n\
    \n```javascript\nimport Vue from 'vue'\nconst bus = new Vue()\n\nexport default\
    \ bus\n```\n\n在 `GithubInput` 组件中，我们可以导入该模块，并在用户名更改时通过发射事件使用它：\n\n```javascript\n\
    import bus from '../bus'\n\nexport default {\n  // ...\n  methods: {\n    onSubmit()\
    \ {\n      if (this.username && this.username !== '') {\n        bus.$emit('new-username',\
    \ this.username)\n      }\n    }\n  }\n}\n```\n\n这样，我们的表单就完成了，我们准备好对结果数据进行一些操作了。\n\
    \n## 显示 GitHub 的结果\n\n`GithubOutput` 组件与其他组件的结构相同。在 `GithubOutput/script.js` 中，我们也导入了\
    \ `bus` 模块，因为我们需要它来感知用户名何时更改。此组件负责的数据将是一个对象，将 GitHub 用户名映射到我们从 GitHub API 获取的数据。这意味着我们不需要每次都向\
    \ API 请求请求；如果之前已经获取了该数据，我们可以直接复用。我们还会存储最后收到的用户名，以便知道在屏幕上显示哪些数据：\n\n```javascript\n\
    // src/GithubOutput/script.js\nimport bus from '../bus'\nimport Vue from 'vue'\n\
    \nexport default {\n  name: 'GithubOutput',\n  data() {\n    return {\n      currentUsername:\
    \ null,\n      githubData: {}\n    }\n  }\n}\n```\n\n"
- fmt: "\nWhen the component is created, we want to listen for any `new-username`\
    \ events that are emitted on the message bus. Thankfully, Vue supports a number\
    \ of [lifecycle hooks](https://vuejs.org/api/#Options-Lifecycle-Hooks), including\
    \ `created`. Because we’re responsible developers, let’s also stop listening for\
    \ events when the component is destroyed by using the `destroyed` event:\n\n```\n\
    export default {\n  name: 'GithubOutput',\n  data: { ... },\n  created() {\n \
    \   bus.$on('new-username', this.onUsernameChange)\n  },\n  destroyed() {\n  \
    \  bus.$off('new-username', this.onUsernameChange)\n  }\n}\n```\n\nWe then define\
    \ the `onUsernameChange` method, which will be called and will set the `currentUsername`\
    \ property:\n\n```\nmethods: {\n  onUsernameChange(name) {\n    this.currentUsername\
    \ = name\n  }\n},\n```\n\nNote that we don’t have to explicitly bind the `onUsernameChange`\
    \ method to the current scope. When you define methods on a Vue component, Vue\
    \ automatically calls `myMethod.bind(this)` on them, so they’re always bound to\
