    \ highly enough for their documentation: it’s absolutely brilliant. The guides\
    \ are excellent, and the API reference is thorough yet easy to navigate to find\
    \ exactly what you’re after.\n\n# Chapter 2: Getting Started with Vuex: a Beginner’s\
    \ Guide\n\n### by Michael Wanyoike\n\nIn single-page applications, the concept\
    \ of `state` relates to any piece of data that can change. An example of state\
    \ could be the details of a logged-in user, or data fetched from an API. \n\n\
    Handling state in single-page apps can be a tricky process. As an application\
    \ gets larger and more complex, you start to encounter situations where a given\
    \ piece of state needs to be used in multiple components, or you find yourself\
    \ passing state through components that don’t need it, just to get it to where\
    \ it needs to be. This is also known as “prop drilling”, and can lead to some\
    \ unwieldy code.\n\n[Vuex](https://vuex.vuejs.org/) is the official state management\
    \ solution for Vue. It works by having a central store for shared state, and providing\
    \ methods to allow any component in your application to access that state. In\
    \ essence, Vuex ensures your views remain consistent with your application data,\
    \ regardless of which function triggers a change to your application data.\n\n\
    In this article, I’ll offer you a high-level overview of Vuex and demonstrate\
    \ how to implement it into a simple app.\n\n## A Shopping Cart Example\n\nLet’s\
    \ consider a real-world example to demonstrate the problem that Vuex solves.\n\
    \nWhen you go to a shopping site, you’ll usually have a list of products. Each\
    \ product has an `Add to Cart` button and sometimes an `Items Remaining` label\
    \ indicating the current stock or the maximum number of items you can order for\
    \ the specified product. Each time a product is purchased, the current stock of\
    \ that product is reduced. When this happens, the `Items Remaining` label should\
    \ update with the correct figure. When the product’s stock level reaches 0, the\
    \ label should read `Out of Stock`. In addition, the `Add to Cart` button should\
    \ be disabled or hidden to ensure customers can’t order products that are currently\
    \ not in inventory.\n\nNow ask yourself how you’d implement this.\n\n## Build\
    \ a Counter Using Local State\n\nIn this section, we’re going to build a simple\
    \ counter that keeps track of its state locally. Once we’re done, I’ll go over\
    \ the fundamental concepts of Vuex, before looking at how to rewrite the counter\
    \ app to use Vue’s official state management solution.\n\n### Prerequisites\n\n\
    Before we start, I’ll assume that you:\n\n- have a basic knowledge of [Vue.js](https://www.sitepoint.com/getting-started-with-vue-js/)\n\
