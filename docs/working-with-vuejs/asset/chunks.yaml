    >\n  <style>\n    /* 在处编写样式 */\n  </style>\n</head>\n<body>\n  <!-- 在处编写模板 -->\n\
    \n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.17/vue.min.js\"\
    ></script>\n  <script>\n    // 在处编写脚本\n  </script>\n</body>\n</html>\n```\n\n\
    我们首先添加一个包含四种表单输入类型的模板——即：文本输入、选择元素、单选按钮和复选框。你可以在所有这些输入框中使用 `v-model`，使它们的值与 `Vue`\
    \ 实例的数据模型保持同步：\n\n```html\n<div id=\"app\" class=\"container\">\n  <h2>Vue Form</h2>\n\
    \n  <div class=\"output\">\n    <p>Name: {{ name }}</p>\n    <p>Genre: {{ genre}}</p>\n\
    \    <p>Gender: {{ gender }}</p>\n    <p>\n      Languages:\n      <span v-for=\"\
    (language, index) in languages\" :key=\"index\">\n        {{ language }}\n   \
    \     <span v-if=\"index + 1 < languages.length\">, </span>\n      </span>\n \
    \   </p>\n    <p>Terms Agreement: {{ agreeToTerms }}</p>\n  </div>\n\n  <form>\n\
    \    <div>\n      <label for=\"name\">Name:</label>\n      <input type=\"text\"\
    \ v-model=\"name\" id=\"name\" />\n    </div>\n\n    <div class=\"gender\">\n\
    \      <input type=\"radio\" id=\"male\" value=\"Male\" v-model=\"gender\">\n\
    \      <label for=\"male\">Male</label>\n      <br>\n      <input type=\"radio\"\
    \ id=\"female\" value=\"Female\" v-model=\"gender\">\n      <label for=\"female\"\
    >Female</label>\n    </div>\n\n    <div>\n      <select v-model=\"genre\">\n \
    \       <option disabled value=\"\">Please select a genre</option>\n        <option>Rap</option>\n\
    \        <option>Indie Pop</option>\n        <option>Soul</option>\n      </select>\n\
    \    </div>\n\n    <div class=\"languages\">\n      <input type=\"checkbox\" id=\"\
    javascript\" value=\"JavaScript\" v-model=\"languages\">\n      <label for=\"\
    javascript\">Javascript</label>\n      <input type=\"checkbox\" id=\"ruby\" value=\"\
    Ruby\" v-model=\"languages\">\n      <label for=\"ruby\">Ruby</label>\n      <input\
    \ type=\"checkbox\" id=\"python\" value=\"Python\" v-model=\"languages\">\n  \
    \    <label for=\"python\">Python</label>\n    </div>\n\n    <div>\n      <label>\n\
    \        <input type=\"checkbox\" v-model=\"agreeToTerms\"/>\n        Yes, I agree\
    \ to everything\n      </label>\n    </div>\n  </form>\n</div>\n```\n\n注意，在模板顶部，我们正在使用基础插值来输出表单字段的值。我们需要在\
    \ `Vue` 实例中声明这些数据属性：\n\n```javascript\nnew Vue({\n  el: '#app',\n  data() {\n\
    \    return {\n      name: \"John Doe\",\n      agreeToTerms: false,\n      genre:\
    \ '',\n      gender: '',\n      languages: []\n    }\n  }\n})\n```\n\n我们可以最后添加一些基础样式：\n\
    \n```css\nh2 {\n  margin: 30px 0;\n  text-align: center;\n  font-size: 3em;\n\
    \  color: tomato;\n}\n\n.output {\n  text-align: center;\n  margin: 30px;\n}\n\
    \nform {\n  width: 40%;\n  max-width: 350px;\n  margin: 0 auto 30px;\n  border-radius:\
    \ 4px;\n  border: none;\n  border-top: 2px solid tomato;\n}\n\ninput[type=\"text\"\
    ], select {\n  background: rgba(255, 255, 255, 0.1);\n  border: none;\n  font-size:\
    \ 16px;\n  height: auto;\n  margin: 0;\n  outline: 0;\n  padding: 10px;\n  width:\
    \ 100%;\n}\n```\n\n### 使用过滤器格式化输出\n\n过滤器让你能够转换数据。它们只会更改显示的数据，而不会实际转换数据本身。你可以使用管道符号\
    \ `|` 将过滤器应用于表达式上。为了看到过滤器的工作，让我们创建一个过滤器，将通过输入框输入的文本转换为大写：\n\n"
- fmt: "\nLet’s say you’re working with an API that returns some posts and displays\
    \ the date the posts were created. You may want to display a user-friendly date\
    \ to the users. This is one of the scenarios where filter comes in handy. Using\
    \ [Momentjs](http://momentjs.com/), you can create a filter for the date.\n\n\
    Your filter will look like this:\n\n```\ndate(value) {\n  return moment(value).fromNow()\n\
    }\n```\n\nNothing special is happening here: we only call `moment`’s `.fromNow()`\
    \ method on the parameter, which is then returned. To display the filtered date,\
    \ we use `{{ created_at | date }}`.\n\n### Live Code\n\n![-](Images/forms4.png)\n\
    \nSee the Pen [Formatting Data With Filters](https://codepen.io/SitePoint/pen/bOdXXy/).##\
    \ VeeValidate\n\n[VeeValidate](https://baianat.github.io/vee-validate/) simplifies\
    \ validation for forms in Vue. In this final section, we’ll build a registration\
    \ form and use VeeValidate to implement some basic validation checks.\n\nIf you’re\
    \ following along using the CLI, you’ll need to install VeeValidate using `npm`:\n\
    \n```\nnpm install vee-validate --save\n```\n\nYou’ll also need to register the\
    \ plugin in `main.js`:\n\n```\nimport  VeeValidate  from  \"vee-validate\";\n\
    Vue.use(VeeValidate);\n```\n\nAlternatively, you can pull it into your application\
    \ using a CDN:\n\n```\n<script src=\"https://unpkg.com/vee-validate@latest\"></script>\n\
    ```\n\nYou’ll then need to amend your template like so:\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head> ... </head>\n<body>\n  <!-- Template here\
    \ -->\n\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.17/vue.min.js\"\
    ></script>\n  <script src=\"https://unpkg.com/vee-validate@latest\"></script>\n\
    \  <script>\n    Vue.use(VeeValidate);\n    new Vue({ .. })\n  </script>\n</body>\n\
    </html>\n```\n\nNext up, let’s create our form. We’re going to have `name`, `gender`,\
    \ `phone`, `email` and `password` fields, which we’ll bind to our data model using\
    \ `v-model`:\n\n```html\n<div id=\"app\">\n  <h2>Register</h2>\n\n  <form @submit.prevent=\"\
    register\" method=\"post\" class=\"form\">\n    <div>\n      <label for=\"name\"\
    >Name:</label>\n      <input id=\"name\" name=\"name\" v-validate=\"'required'\"\
    \ type=\"text\" v-model=\"user.name\" class=\"form-control\" />\n      <span v-show=\"\
    errors.has('name')\" class=\"text-danger\">{{ errors.first('name') }}</span>\n\
    \    </div>\n    <div>\n      <label for=\"gender\">Gender:</label>\n      <select\
    \ id=\"gender\" name=\"gender\" v-model=\"user.gender\" class=\"form-control\"\
    \ v-validate=\"'required'\">\n        <option>Female</option>\n        <option>Male</option>\n\
    \      </select>\n      <span v-show=\"errors.has('gender')\" class=\"text-danger\"\
    >\n        {{ errors.first('gender') }}\n      </span>\n    </div>\n    <div>\n\
    \      <label for=\"phone\">Phone:</label>\n      <input id=\"phone\" name=\"\
    phone\" v-validate=\"'required'\" type=\"text\" v-model=\"user.phone\" class=\"\
    form-control\" />\n      <span v-show=\"errors.has('phone')\" class=\"text-danger\"\
    >\n        {{ errors.first('phone') }}\n      </span>\n    </div>\n    <div>\n\
    \      <label for=\"email\">Email:</label>\n      <input id=\"email\" name=\"\
    email\" v-validate=\"'required|email'\" type=\"text\" v-model=\"user.email\" class=\"\
    form-control\" />\n      <span v-show=\"errors.has('email')\" class=\"text-danger\"\
    >\n        {{ errors.first('email') }}\n      </span>\n    </div>\n    <div>\n\
    \      <label for=\"password\">Password:</label>\n      <input id=\"password\"\
    \ name=\"password\" v-validate=\"'required'\" type=\"password\" v-model=\"user.password\"\
    \ class=\"form-control\" />\n      <span v-show=\"errors.has('password')\" class=\"\
    text-danger\">\n        {{ errors.first('password') }}\n      </span>\n    </div>\n\
    \    <div>\n      <button class=\"btn btn-lg btn-primary btn-block\" type=\"submit\"\
    >Submit</button>\n    </div>\n  </form>\n</div>\n```\n\nTo ensure that the required\
    \ fields are filled, we pass the value `required` to a `v-validate` attribute\
    \ in our template. This signifies that a value must be provided for the input.\
    \ We won’t do much more than that in our example, but please be aware that [VeeValidate\
    \ comes with a bunch of validation rules out of the box](https://baianat.github.io/vee-validate/guide/rules.html),\
    \ which are all localized and cover most validation needs. And if you don’t find\
    \ what you’re looking for there, it’s possible to [create custom rules](https://baianat.github.io/vee-validate/guide/rules.html),\
    \ too.\n"
  raw: "Let’s say you’re working with an API that returns some posts and displays\
    \ the date the posts were created. You may want to display a user-friendly date\
    \ to the users. This is one of the scenarios where filter comes in handy. Using\
    \ [Momentjs](http://momentjs.com/), you can create a filter for the date.\n\n\
    Your filter will look like this:\n\n```\ndate(value) {\n  return moment(value).fromNow()\n\
    }\n```\n\nNothing special is happening here: we only call moment’s `.fromNow()`\
    \ method on the parameter, which is then returned. To display the filtered date,\
    \ we use `{{ created_at | date }}`.\n\n#### Live Code\n\n![-](Images/forms4.png)\n\
    \nSee the Pen [Formatting Data With Filters](https://codepen.io/SitePoint/pen/bOdXXy/).\n\
    \n## VeeValidate\n\n[VeeValidate](https://baianat.github.io/vee-validate/) simplifies\
    \ validation for forms in Vue. In this final section, we’ll build a registration\
    \ form and use VeeValidate to implement some basic validation checks.\n\nIf you’re\
    \ following along using the CLI, you’ll need to install VeeValidate using npm:\n\
    \n```\nnpm install vee-validate --save\n```\n\nYou’ll also need to register the\
    \ plugin in `main.js`:\n\n```\nimport  VeeValidate  from  \"vee-validate\";\n\
    Vue.use(VeeValidate);\n```\n\nAlternatively, you can pull it into your application\
    \ using a CDN:\n\n```\n<script src=\"https://unpkg.com/vee-validate@latest\"></script>\n\
    ```\n\nYou’ll then need to amend your template like so:\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head> ... </head>\n<body>\n  <!-- Template here -->\n\n \
    \ <script src=\"https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.17/vue.min.js\"\
    ></script>\n  <script src=\"https://unpkg.com/vee-validate@latest\"></script>\n\
    \  <script>\n    Vue.use(VeeValidate);\n    new Vue({ .. })\n  </script>\n</body>\n\
    </html>\n```\n\nNext up, let’s create our form. We’re going to have `name`, `gender`,\
    \ `phone`, `email` and `password` fields, which we’ll bind to our data model using\
    \ `v-model`:\n\n```\n<div id=\"app\">\n  <h2>Register</h2>\n\n  <form @submit.prevent=\"\
    register\" method=\"post\" class=\"form\">\n    <div>\n      <label for=\"name\"\
    >Name:</label>\n      <input id=\"name\" name=\"name\" v-validate=\"'required'\"\
    \ type=\"text\" v-model=\"user.name\" class=\"form-control\" />\n      <span v-show=\"\
    errors.has('name')\" class=\"text-danger\">{{ errors.first('name') }}</span>\n\
    \    </div>\n    <div>\n      <label for=\"gender\">Gender:</label>\n      <select\
    \ id=\"gender\" name=\"gender\" v-model=\"user.gender\" class=\"form-control\"\
    \ v-validate=\"'required'\">\n        <option>Female</option>\n        <option>Male</option>\n\
    \      </select>\n      <span v-show=\"errors.has('gender')\" class=\"text-danger\"\
    >\n        {{ errors.first('gender') }}\n      </span>\n    </div>\n    <div>\n\
    \      <label for=\"phone\">Phone:</label>\n      <input id=\"phone\" name=\"\
    phone\" v-validate=\"'required'\" type=\"text\" v-model=\"user.phone\" class=\"\
    form-control\" />\n      <span v-show=\"errors.has('phone')\" class=\"text-danger\"\
    >\n        {{ errors.first('phone') }}\n      </span>\n    </div>\n    <div>\n\
    \      <label for=\"email\">Email:</label>\n      <input id=\"email\" name=\"\
    email\" v-validate=\"'required|email'\" type=\"text\" v-model=\"user.email\" class=\"\
    form-control\" />\n      <span v-show=\"errors.has('email')\" class=\"text-danger\"\
    >\n        {{ errors.first('email') }}\n      </span>\n    </div>\n    <div>\n\
    \      <label for=\"password\">Password:</label>\n      <input id=\"password\"\
    \ name=\"password\" v-validate=\"'required'\" type=\"password\" v-model=\"user.password\"\
    \ class=\"form-control\" />\n      <span v-show=\"errors.has('password')\" class=\"\
    text-danger\">\n        {{ errors.first('password') }}\n      </span>\n    </div>\n\
    \    <div>\n      <button class=\"btn btn-lg btn-primary btn-block\" type=\"submit\"\
    >Submit</button>\n    </div>\n  </form>\n</div>\n```\n\nTo ensure that the required\
    \ fields are filled, we pass the value `required` to a `v-validate` attribute\
    \ in our template. This signifies that a value must be provided for the input.\
    \ We won’t do much more than that in our example, but please be aware that [VeeValidate\
    \ comes with a bunch of validation rules out of the box](https://baianat.github.io/vee-validate/guide/rules.html),\
    \ which are all localized and cover most validation needs. And if you don’t find\
    \ what you’re looking for there, it’s possible to [create custom rules](https://baianat.github.io/vee-validate/guide/custom-rules.html#creating-a-custom-rule),\
    \ too.\n\nOnce the form is submitted, we prevent the browser’s default submit\
    \ action using the `.prevent` modifier. Then we call a custom `register` method.\
    \ Any errors from the form will be in the `errors` object, and we can use one\
    \ of the built-in helper methods to display each error for a particular field.\n\
    \nNext, let’s implement the form’s logic:\n\n```\nVue.use(VeeValidate);\n\nnew\
    \ Vue({\n  el: '#app',\n  data() {\n    return {\n      user: {\n        email:\
    \ '',\n        password: '',\n        name: '',\n        phone: '',\n        gender:\
    \ ''\n      }\n    }\n  },\n  methods: {\n    register() {\n      this.$validator.validateAll().then((result)\
    \ => {\n        if (result) {\n          alert('Form Submitted!');\n         \
    \ return;\n        }\n\n        alert('Form is invalid!');\n      });\n    }\n\
    \  }\n})\n```\n\nWithin our `register` method, the `validateAll` method is used\
    \ to validate each value against the corresponding field validations. We’re also\
    \ displaying two different alerts depending on the validity of the form. In your\
    \ application, you’ll want to replace the first alert with your POST request to\
    \ the server.\n\nAnd finally, the styles:\n\n```\nh2 {\n  margin: 20px 0;\n  text-align:\
    \ center;\n}\n.form {\n  max-width: 380px;\n  padding: 15px 35px 45px;\n  margin:\
    \ 0 auto;\n  background-color: #fff;\n  border: 1px solid rgba(0,0,0,0.1);\n}\n\
    label {\n  margin: 12px 0 2px 0;\n}\nbutton {\n  margin: 15px 0 0 0;\n}\n```\n\
    \n#### Live Code\n\n![-](Images/forms5.png)\n\nSee the Pen [vue form - VeeValidate](https://codepen.io/SitePoint/pen/aPvzRB/).\n\
    \n## Conclusion\n\nIn this guide, I’ve demonstrated how easy it can be to work\
    \ with forms in Vue. We looked at how to use two-way data binding to keep user\
    \ input in sync with a data model, how to change the browser’s default form-handling\
    \ behavior, and how to implement form validation using the [VeeValidate](https://baianat.github.io/vee-validate/)\
    \ plugin.\n\nAt this point, you can go on to build simple to complicated forms\
    \ in Vue, without the need to write long lines of code to handle validation.\n\
    \n# Chapter 6: How to Conditionally Apply a CSS Class in Vue.js\n\n### by Chad\
    \ Campbell\n\n**There are times you need to change an element’s CSS classes at\
    \ runtime. But when changing classes, it’s sometimes best to apply style details\
    \ conditionally. For example, imagine your view has a pager. Pagers are often\
    \ used to navigate larger sets of items. When navigating, it can be helpful to\
    \ show the user the page they’re currently on. The style of the item is conditionally\
    \ set, based on the current page that’s being viewed.**\n\nA pager in this case\
    \ may look something like this:\n\n![Pager](Images/1501161191pager.png)\n\nIn\
    \ this example, there are five pages. Only one of these pages is selected at a\
    \ time. If you built this pager with Bootstrap, the selected page would have a\
    \ CSS class named `active` applied. You’d want this class applied only if the\
    \ page was the currently viewed page. In other words, you’d want to *conditionally*\
    \ apply the `active` CSS class. Luckily, Vue provides a way to conditionally apply\
    \ a CSS class to an element, which I’m going to demonstrate in this article.\n\
    \nTo conditionally apply a CSS class at runtime, you can bind to a JavaScript\
    \ object. To successfully complete this task, you must complete two steps. First,\
    \ you must ensure that your CSS class is defined. Then, you create the class bindings\
    \ in your template. I’m going to explain each of these steps in detail in the\
    \ rest of this article.\n\n## Step 1: Define Your CSS Classes\n\nImagine, for\
    \ a moment, that the five page items shown in the image above were defined using\
    \ the following HTML:"
