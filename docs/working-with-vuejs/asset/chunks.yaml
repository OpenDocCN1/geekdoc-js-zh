    \ CSS 类是与本文最相关的。\n\n`active` CSS 类用于识别当前选中的页面。对于本文，该 CSS 类也是在 Bootstrap CSS 中定义的。如上面的代码段所示，`active`\
    \ 类仅在第三个列表项元素中使用。正如你可能猜到的那样，这就是你想要条件应用的 CSS 类。要实现这一点，你需要添加一个 JavaScript 对象。\n\n\
    ## 第 2 步：创建你的类绑定\n\n让我们在第 1 步所示的代码段的基础上继续。在模板中创建类绑定时，有两种主要选择：使用对象语法或使用数组语法。我将在本文的剩余部分向你展示如何使用这两种方法。\n\
    \n### 使用对象语法绑定\n\n要使用对象语法创建类绑定，你必须使用 JavaScript `expression`。我们将使用的表达式可以在与本文相关的代码[此处](https://codepen.io/SitePoint/pen/RqbBdK)\
    \ 看到。相关代码看起来如下：\n\n```\n<div id=\"myApp\">\n  <nav aria-label=\"An example with\
    \ pagination\">\n    <ul class=\"pagination\">\n      <li v-for=\"page in totalPages\"\
    \ v-bind:class=\"{'page-item':true, 'active':(page === currentPage)}\">\n    \
    \    <a class=\"page-link\" href=\"#\">{{ page }}</a>\n      </li>\n    </ul>\n\
    \  </nav>\n</div>\n```\n\n通过使用 Vue 内置的 `v-for` 指令减少了代码量。该指令用于循环渲染项目。此示例中的项目是页面本身。除了使用\
    \ `v-for` 指令外，请注意 `v-bind` 指令的使用。\n\n`v-bind` 指令将元素的 `class` 属性连接到 Vue 实例。该 Vue\
    \ 实例定义如下：\n\n```\nvar app = new Vue({\n  el: '#myApp',\n  data: {\n    totalPages:\
    \ 5,\n    currentPage: 3\n  }\n});\n```\n\n这个 Vue 实例直击了当。上面的 `data` 对象包含一个名为 `currentPage`\
    \ 的属性。如果你重新查看上面的 HTML 模板，你会发现该属性正在被使用。事实上，与类绑定关联的 JavaScript 对象看起来如下：\n\n```\n\
    {'page-item':true, 'active':(page === currentPage)}\n```\n\n该对象定义了两个属性：`page-item`\
    \ 和 `active`。值得注意的是，这些是第 1 步中讨论的两个 CSS 类名称。在第 2 步中，这两个类变成了 JavaScript 对象中的属性名。与这些属性名关联的值是\
    \ JavaScript 表达式。如果表达式求值为真（truthy），将包含该 CSS 类。如果表达式求值为假（false），则不包含该 CSS 类。记住这些规则，让我们来看每个属性。\n\
    \n第一个属性 `page-item` 的值为 `true`。使用这个硬编码值是因为我们总是想包含 `page-item` 类。第二个属性 `active`\
    \ 使用 JavaScript 表达式。当此表达式为 `true` 时，将应用 `active` 类。这使我们能够根据 `currentPage` 的值条件地应用\
    \ `active` 类。条件应用 `active` 类的另一种方法是绑定到 `Array`。\n\n### 使用数组语法绑定\n\nVue 允许你通过绑定到\
    \ `Array` 来应用一组 CSS 类。如果你想使用 `Array` 语法，第 1 步中所示的 HTML 将变成：\n\n```\n<div id=\"\
    myApp\">\n  <nav aria-label=\"An example with pagination\">\n    <ul class=\"\
    pagination\">\n        <li v-for=\"page in totalPages\" v-bind:class=\"[pageItemClass,\
    \ (page === currentPage) ? activeClass : '']\">\n          <a class=\"page-link\"\
    \ href=\"#\">{{ page }}</a>\n        </li>\n    </ul>\n  </nav>\n</div>\n```\n\
    \n带有 `Array` 语法的运行版本可以在[此处](https://codepen.io/SitePoint/pen/dQbjX) 看到。唯一的区别是在类绑定上使用了\
    \ `Array`。这种替代方法期望 Vue 的 `data` 对象中存在两个属性。这两个属性是：`pageItemClass` 和 `activeClass`。带有这些属性的更新后的\
    \ Vue 初始化代码如下：\n\n```\nvar app = new Vue({\n  el: '#myApp',\n  data: {\n    totalPages:\
    \ 5,\n    currentPage: 3,\n    pageItemClass: 'page-item',\n    activeClass: 'active'\n\
    \  }\n});\n```\n\n正如你所见，`data` 对象增加了，但使用 `Array` 语法的模板稍微简洁。在对象语法和 `Array` 语法之间的选择取决于个人偏好。两种方法似乎都会让你的\
    \ HTML 模板变得复杂。然而，实际上这分离了关注点。我们正在创建一个由数据驱动的视图。这使得视图在应用程序增长时更容易测试、更容易维护。\n\n# 第\
    \ 7 章：如何用 Vue 替换 jQuery\n\n### 作者：Nilson Jacques\n\n我敢打赌，有很多开发者在构建简单应用时仍然会求助于\
    \ `jQuery`。经常我们需要为页面添加一些交互性，但引入一个 JavaScript 框架似乎大材小用——考虑到所有额外的字节、模板代码、构建工具和模块打包器。从\
    \ CDN 引入 `jQuery` 似乎是理所当然的。\n\n在本文中，我想尝试说服你，使用 `Vue.js`（后文简称 Vue）即使对于简单的项目也不必令人头疼，并且可以帮你更快地编写更好的代码。我们将取一个示例，先用\
    \ `jQuery` 编写，然后逐步在 Vue 中重建。\n\n## 我们要构建的内容\n\n对于本文，我们将构建一个基础在线发票，使用来自 Sparksuite\
    \ 的[开源模板](https://github.com/sparksuite/simple-html-invoice-template)。希望这与另一个待办事项列表有所不同，并提供了足够的复杂度来展示使用类似\
    \ Vue 之类的优势，同时保持易于理解。\n\n![模板截图](img/1523363247sparksuite-template.png)\n\n我们将通过提供项目、单价和数量输入来使其具有交互性，并在其中一个值更改时自动重新计算“价格”列。我们还将添加一个按钮向发票插入新的空行，以及一个会在编辑数据时自动更新的“合计”字段。\n\
    \n我修改了模板，使得单个（空）行的 HTML 现在看起来如下：\n\n```html\n<tr class=\"item\">\n  <td><input\
    \ value=\"\" /></td>\n  <td>$<input type=\"number\" value=\"0\" /></td>\n  <td><input\
    \ type=\"number\" value=\"1\" /></td>\n  <td>$0.00</td>\n</tr>\n```\n\n## jQuery\n\
    \n所以，首先，让我们看看如何使用 `jQuery` 实现。\n\n```javascript\n$('table').on('mouseup keyup',\
    \ 'input[type=number]', calculateTotals);\n```\n\n"
- fmt: "\n```javascript\nfunction calculateTotals()  {\n  const subtotals = $('.item').map((idx,\
    \ val)  => calculateSubtotal(val)).get();\n  const total = subtotals.reduce((a,\
    \ v)  => a + Number(v),  0);\n  $('.total td:eq(1)').text(formatAsCurrency(total));\n\
    }\n```\n\nThis function looks for all item rows in the table and loops over them,\
    \ passing each row to a `calculateSubtotal` function, and then summing the results.\
    \ This `total` is then inserted into the relevant spot on the invoice.\n\n```javascript\n\
    function calculateSubtotal(row) {\n  const $row = $(row);\n  const inputs = $row.find('input');\n\
    \  const subtotal = inputs[1].value * inputs[2].value;\n\n  $row.find('td:last').text(formatAsCurrency(subtotal));\n\
    \n  return subtotal;\n}\n```\n\nIn the code above, we’re grabbing a reference\
    \ to all the `<input>`s in the row and multiplying the second and third together\
    \ to get the subtotal. This value is then inserted into the last cell in the row.\n\
    \n```javascript\nfunction formatAsCurrency(amount) {\n  return `$${Number(amount).toFixed(2)}`;\n\
    }\n```\n\nWe’ve also got a little helper function that we use to make sure both\
    \ the subtotals and the total are formatted to two decimal places and prefixed\
    \ with a currency symbol.\n\n```javascript\n$('.btn-add-row').on('click', () =>\
    \ {\n  const $lastRow = $('.item:last');\n  const $newRow = $lastRow.clone();\n\
    \n  $newRow.find('input').val('');\n  $newRow.find('td:last').text('$0.00');\n\
    \  $newRow.insertAfter($lastRow);\n\n  $newRow.find('input:first').focus();\n\
    });\n```\n\nLastly, we have a click handler for our `Add row` button. What we’re\
    \ doing here is selecting the last item row and creating a duplicate. The inputs\
    \ of the cloned row are set to default values, and it’s inserted as the new last\
    \ row. We can also be nice to our users and set the focus to the first input,\
    \ ready for them to start typing.\n\n### Live Code\n\nSee the Pen [jQuery Invoice](https://codepen.io/SitePoint/pen/YaBwJQ/).\n\
    \n### Downsides\n\nSo what’s wrong with this code as it stands, or rather, what\
    \ could be better?\n\nYou may have heard some of these newer libraries, like `Vue`\
    \ and `React`, claim to be declarative rather than imperative. Certainly looking\
    \ at this jQuery code, the majority of it reads as a list of instructions on how\
    \ to manipulate the DOM. The purpose of each section of code — the “what” — is\
    \ often hard to make out through the details of “how” it’s being done. Sure, we\
    \ can clarify the intent of the code by breaking it up into well-named functions,\
    \ but this code is still going to take some effort to mentally parse if you come\
    \ back to it after a while.\n\nThe other issue with code like this is that we’re\
    \ keeping our application state in the DOM itself. Information about the items\
    \ ordered exists only as part of the HTML making up the UI. This might not seem\
    \ like a big problem when we’re only displaying the information in a single location,\
    \ but as soon as we start needing to display the same data in multiple places\
    \ in our app, it becomes increasingly complex to ensure that each piece is kept\
    \ in sync. There’s no single source of truth.\n\nAlthough nothing about jQuery\
    \ prevents us from keeping our state outside the DOM and avoiding these problems,\
    \ libraries such as `Vue` provide functionality and structure that facilitate\
    \ creating a good architecture and writing cleaner, modular code.\n\n## Converting\
    \ to Vue\n\nSo how would we go about recreating this functionality using `Vue`?\n\
    \nAs I mentioned earlier, `Vue` doesn’t require us to use a module bundler, or\
    \ a transpiler, or to opt in to their single file components (`.vue` files) in\
    \ order to get started. Like jQuery, we can simply include the library from a\
    \ CDN. Let’s start by swapping out the script tag:\n\n```html\n<script src=\"\
    https://cdn.jsdelivr.net/npm/vue@2.5.17/dist/vue.js\"></script>\n```\n\nThe next\
    \ thing we need to do is create a new `Vue` instance:\n\n```javascript\nconst\
    \ app = new Vue({\n  el: 'table'\n});\n```\n\nThe only option we need to provide\
    \ here is `el`, which is a selector (like we would use with jQuery) identifying\
    \ which part of the document we want `Vue` to manage.\n\nWe can put `Vue` in charge\
    \ of anything from the entire page (for a single page application, for example)\
    \ or a single `<div>`. For our invoice example, we’ll give `Vue` control of the\
    \ HTML table.\n\n### Data\n\nLet’s also add the data for the three example rows\
    \ to our `Vue` instance:\n\n```javascript\nconst app = new Vue({\n  el: 'table',\n\
    \  data: {\n    items: [\n      { description: 'Website design', quantity: 1,\
    \ price: 300 },\n      { description: 'Hosting (3 months)', quantity: 1, price:\
    \ 75 },\n      { description: 'Domain name (1 year)', quantity: 1, price: 10 },\n\
    \    ]\n  }\n});\n```\n\nThe `data` property is where we store the state of our\
    \ application. This includes not only any data we want our app to work with, but\
    \ also information about the state of the UI (for example, which section is currently\
    \ active in a tab group, or whether an accordion is expanded or contracted).\n\
    \n`Vue` encourages us to keep our app’s state separate from its presentation (that\
    \ is, the DOM) and centralized in one place — a single source of truth.\n\n###\
    \ Modifying the template\n\nNow let’s set up our template to display the items\
    \ from our data object. As we’ve told `Vue` we want it to control the table, we\
    \ can use its template syntax in the HTML to tell `Vue` how to render and manipulate\
    \ it.\n\nUsing the `v-for` attribute, we can render a block of HTML for each item\
    \ in our `items` array:\n\n```html\n<tr class=\"item\" v-for=\"item in items\"\
    >\n\n</</tr>\n```\n\n`Vue` will repeat this markup for each element of the array\
    \ (or object) that you pass to the `v-for` construct, allowing you to reference\
    \ each element inside the loop — in this case, as `item`. As `Vue` is observing\
    \ all the properties of the `data` object, it will dynamically re-render the markup\
    \ as the contents of `items` change. All we have to do is add or remove items\
    \ to our app state, and `Vue` takes care of updating the UI.\n\nWe’ll also need\
    \ to add `<input>`s for the user to fill out the description, unit price, and\
    \ quantity of the item:\n\n```html\n<td><input v-model=\"item.description\" /></td>\n\
    <td>$<input type=\"number\" v-model=\"item.price\" /></td>\n<td><input type=\"\
    number\" v-model=\"item.quantity\" /></td>\n<td>${{ item.price * item.quantity\
    \ }}</td>\n```\n\nHere we’re using the `v-model` attribute to set up two-way binding\
    \ between the inputs and properties on our data model. This means any change to\
    \ the inputs will update the properties on the item, and vice versa.\n\nIn the\
    \ last cell, we’re using double braces `{{ }}` to output some text. We can use\
    \ any valid JavaScript expression within the braces, so we’re multiplying two\
    \ of item properties together and outputting the result. Again, as `Vue` is observing\
    \ our data model, a change to either property will cause the expression to be\
    \ re-evaluated.\n\n### Events and methods\n\nNow we have our template set up to\
    \ render out `items` collection, but how do we go about adding new rows? As `Vue`\
    \ will render whatever is in `items`, to render an empty row we just need to push\
    \ an object with whatever default values into the `items` array.\n\nTo create\
    \ functions that we can access from within our template, we need to pass them\
    \ to our `Vue` instance as properties of a `methods` object:\n\n```javascript\n\
    const app = new Vue({\n  // ...\n  methods: {\n    myMethod() {}\n  },\n  // ...\n\
    })\n```\n\nNote that any methods we create are automatically bound to the `Vue`\
    \ instance itself, so we can access properties from our `data` object, and other\
    \ methods, as properties of `this`.\n\nLet’s define an `addRow` method that we\
    \ can call to add a new item to our `items` array:\n\n```javascript\nmethods:\
    \ {\n  addRow() {\n    this.items.push({ description: '', quantity: 1, price:\
    \ 0 });\n  },\n},\n```\n\nSo, now that we have our method, how do we call it when\
    \ the `Add row` button is clicked? The syntax for adding event listeners to an\
    \ element in the template is `v-on:event-name`:\n\n```html\n<button class=\"btn-add-row\"\
    \ @click=\"addRow\">Add row</button>\n```\n"
