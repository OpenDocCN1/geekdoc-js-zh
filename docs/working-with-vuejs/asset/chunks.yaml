  trans: "\n\n```html\n<div id=\"app\">\n  <h2>Vue Form</h2>\n  <h2>Input: {{ entry\
    \ }}</h2>\n  <input type=\"text\"\n    :value=\"entry\"\n    @input=\"entry=$event.target.value\"\
    \n  />\n</div>\n```\n\n现在，让我们来看一个示例。如果你想在家里跟着练习，可以采取两种方法中的一种。你可以使用 `Vue CLI` 创建新应用（你可以在本\
    \ Vue 系列的“Vue CLI 入门指南”中读到相关内容）。另一种选择是使用下面的模板，它包含了通过 `CDN` 引入的 `Vue`，你可以直接在浏览器中打开它：\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
