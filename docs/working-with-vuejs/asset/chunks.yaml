  trans: "\n\n![](img/default_cover.jpeg)\n![](img/default_cover.jpeg)\n\n# 使用 Vue.js\
    \ 开发\n\nCopyright © 2019 SitePoint Pty. Ltd.\n\n电子书 ISBN: 978-1-925836-26-4\n\n\
    - **封面设计：** Alex Walker\n- **项目编辑：** James Hibbard\n\n## 版权声明\n\n保留所有权利。未经出版者事先书面许可，不得以任何形式或通过任何手段复制、存储在检索系统中或传输本书的任何部分，但用于评论性文章或评论的简短引文除外。\n\
    \n## 免责声明\n\n作者和出版者已尽力确保书中信息的准确性。然而，本书包含的信息按原样销售，不提供任何明确或暗示的保证。作者、SitePoint Pty.\
    \ Ltd. 及其经销商或分销商对于因遵循书中包含的说明或此处描述的软件或硬件产品而直接或间接造成的任何损害均不承担责任。\n\n## 商标说明\n\n本书并非将每个商标名称的出现都标记为商标，而是以编辑的方式使用这些名称，并以商标所有者的利益为准，无侵犯商标之意。\n\
    \n![SitePoint logo](img/sitepoint-logo-2012.png)\n\nSitePoint Pty. Ltd. 出版\n\n\
    48 Cambridge Street Collingwood\nVIC Australia 3066\n网站: www.sitepoint.com\n邮箱:\
    \ books@sitepoint.com\n\n## 关于 SitePoint\n\nSitePoint 专注于为 Web 专业人员发布有趣、实用且易于理解的内容。访问\
    \ [`www.sitepoint.com/`](http://www.sitepoint.com/) 获取我们的博客、书籍、通讯报、文章和社区论坛。你将找到关于\
    \ JavaScript、`PHP`、设计等大量信息。\n\n# 前言\n\n自 2014 年发布以来，Vue.js 的人气经历了飞跃式的增长，现在被认为是主要的\
    \ own 框架之一，这并非没有理由。它基于组件的架构设计得非常灵活且易于采用，使其在集成到项目中以及与非 Vue 代码一起使用时，变得与构建复杂的客户端应用程序一样简单。\n\
    \n如果你是一个想要开始学习 Vue 的经验丰富的开发者，这本书就是为你准备的。它对你需要理解的关键主题进行了快速介绍。它包含：\n\n1. *快速上手 Vue.js\
    \ 2.0 框架* —— Jack Franklin\n2. *上手 Vuex：初学者指南* —— Michael Wanyoike\n3. *Vue CLI\
    \ 入门指南* —— Ahmed Bouchefra\n4. *在 Vue 中处理组件的入门指南* —— Kingsley Silas\n5. *在 Vue\
    \ 中处理表单的入门指南* —— Kingsley Silas\n6. *如何在 Vue.js 中条件地应用 CSS 类* —— Chad Campbell\n\
    7. *如何用 Vue 替换 jQuery* —— Nilson Jacques\n8. *Nuxt.js：一个用于创建通用 Vue.js 应用的极简主义框架*\
    \ —— Olayinka Omole\n9. *使用异步组件优化 Vue 应用的性能* —— Michiel Mulders\n\n## 谁应该读这本书？\n\
    \n本书适合具有 `JavaScript` 经验的开发者。\n\n## 采用的规范\n\n### 代码示例\n\n书中的代码使用等宽字体显示，如下：\n\n\
    ```\n <h1>一个完美的夏日</h1>\n<p>这是一个在公园里散步的好日子。\n鸟儿在歌唱，孩子们都回学校了。</p> \n```\n\n当需要现有代码作为上下文时，而不是重复所有内容，将显示\
    \ `⋮`：\n\n```\n function animate() {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\
    \n某些代码行应该在一行内输入，但由于页面限制，我们不得不对它们进行换行。`➥` 表示仅出于格式目的而存在的换行，应该被忽略：\n\n```\n URL.open(\"\
    http://www.sitepoint.com/responsive-web-\n➥design-real-user-testing/?responsive1\"\
    );\n```\n\n你你会注意到，我们在整本书中使用某些布局样式来表示不同类型的信息。请关注以下项目。\n\n#### 提示、注意和警告\n\n####\
    \ 嘿，你！(Hey, You!)\n\n提示（Tips）提供有用的小建议。\n\n#### 额，打扰一下……(Ahem, Excuse Me ...)\n\
    \n注意（Notes）是与当前主题相关但并非重要的有用补充。将它们看作额外的信息。\n\n#### 确保你始终……（Make Sure You Always\
    \ ...）\n\n……注意这些重要点。\n\n#### 注意！(Watch Out!)\n\n警告（Warnings）强调了在过程中可能会让你碰壁的任何陷阱。\n\
    \n# 第 1 章：快速上手 Vue.js 2.0 框架\n\n#### 由 Jack Franklin 编写\n\n当流行的 JavaScript 框架\
    \ [Vue.js](https://vuejs.org/) 发布 [v2](https://medium.com/the-vue-point/vue-2-0-is-here-ef1f26acf4b8#.f6sth6njx)\
    \ 时，我急于尝试一下，看看用起来感觉如何。作为一个非常熟悉 `Angular` 和 `React` 的人，我期待看到它们与 Vue 之间的相似之处和差异。\n\
    \nVue 2 拥有出色的性能数据、较小的负载（压缩并 gzip 后的 Vue 运行时版本仅重 30KB），以及配套库（如 `vue-router` 和 `Vuex`）的更新。\n\
    \n##其他库的灵感\n\n在整个教程过程中，你会看到 Vue 的许多功能显然受到了其他框架的启发。这是一件好事；看到新框架从其他库中汲取想法并进行改进。其中一个例子是，像\
    \ `React` 和当今几乎所有的框架一样，Vue 使用虚拟 DOM 的概念来保持渲染高效。Vue 使用了 [snabbdom](https://github.com/snabbdom/snabbdom)\
    \ 的分支，它是流行的虚拟 DOM 库之一。Vue 网站包含了[关于虚拟 DOM 的文档](https://vuejs.org/v2/guide/render-function.html#Nodes-Trees-and-the-Virtual-DOM)，但作为用户只需要只需要\
    \ Vue 的渲染非常快（在很多情况下性能优于 React），这意味着你可以放心地进行构建。\n\n## 组件、组件、组件\n\n与现在的其他框架一样，Vue\
    \ 的核心构建块是组件。你的应用程序应该是系列相互构建的组件，最终生成整个应用程序。Vue.js 更进一步，建议（尽管并非强制）在单个 `.vue` 文件中定义组件，然后由构建工具进行解析（我们稍后会介绍这些）。考虑到本文的目标是充分探索\
    \ Vue 以及使用它的感觉，我将在我的应用程序中使用这种约定。\n\nVue 文件看起来如下：\n\n```\n<template>\n  <p>这是我组件的\
    \ HTML</p>\n</template>\n\n<script>\n  export default {\n    // 我组件的所有代码都放在这里\n\
    \  }\n</script>\n\n<style scoped>\n  /* CSS 在这里\n   * 通过包含 `scoped`，我们确保所有 CSS\n\
    \   * 仅限于该组件！\n   */\n</style>\n```\n\n或者，你也可以给每个元素分配一个 `src` 属性并分别指向独立的 HTML、JS\
    \ 或 CSS 文件，如果你不喜欢将组件的所有部分放在一个文件中。\n\n## 设置项目\n\n"
- fmt: "\nThese days, [webpack](https://webpack.js.org/) is my preferred build tool\
    \ of choice, and we can couple that with the [vue-loader plugin](https://github.com/vuejs/vue-loader)\
    \ to support the Vue.js component format that I mentioned previously. We’ll also\
    \ need Babel and the `env` preset, so we can write all our code using modern JavaScript\
    \ syntax, as well as the [webpack-dev-server](https://github.com/webpack/webpack-dev-server),\
    \ which will update the browser when it detects a file change.\n\nLet’s initialize\
    \ a project and install the dependencies:\n\n```\nmkdir vue2-demo-project\ncd\
    \ vue2-demo-project\nnpm init -y\nnpm i vue\nnpm i webpack webpack-cli @babel/core\
    \ @babel/preset-env babel-loader vue-loader vue-template-compiler webpack-dev-server\
    \ html-webpack-plugin --save-dev\n```\n\nThen create the initial folders and files:\n\
    \n```\nmkdir src\ntouch webpack.config.js src/index.html src/index.js\n```\n\n\
    The project structure should look like this:\n\n```\n.\n├── package.json\n├──\
    \ package-lock.json\n├── src\n│   ├── index.html\n│   └── index.js\n└── webpack.config.js\n\
    ```\n\nNow let’s set up the webpack configuration. This boils down to the following:\n\
    \n*   Tell webpack to use the `vue-loader` for any `.vue` files\n*   Tell webpack\
    \ to use Babel and the `env` preset for any `.js` files\n*   Tell webpack to generate\
    \ an HTML file for the dev-server to serve, using `src/index.html` as a template:\n\
    \n```\n//webpack.config.js\nconst VueLoaderPlugin = require('vue-loader/lib/plugin')\n\
    const HtmlWebPackPlugin = require(\"html-webpack-plugin\")\n\nmodule.exports =\
    \ {\n  module: {\n    rules: [\n      {\n        test: /\\.vue$/,\n        loader:\
    \ 'vue-loader',\n      },\n      {\n        test: /\\.js$/,\n        exclude:\
    \ /node_modules/,\n        use: {\n          loader: 'babel-loader',\n       \
    \   options: {\n            presets: ['@babel/preset-env']\n          }\n    \
    \    }\n      }\n    ]\n  },\n  plugins: [\n    new VueLoaderPlugin(),\n    new\
    \ HtmlWebPackPlugin({\n      template: \"./src/index.html\"\n    })\n  ]\n}\n\
    ```\n\nFinally, we’ll add some content to the HTML file and we’re ready to go!\n\
    \n```\n<!-- src/index.html -->\n<!DOCTYPE html>\n<html\n  <head>\n    <title>My\
    \ Vue App</title>\n  </head>\n  <body>\n    <div id=\"app\"></div>\n  </body>\n\
    </\n>\n```\n\nWe create an empty `div` with the ID of `app`, as this is the element\
    \ that we’re going to place our Vue application in. I always prefer to use a `div`,\
    \ rather than just the `body` element, as that lets me have control over the rest\
    \ of the page.\n\n## Writing Our First Vue.js App\n\nWe’re going to stay true\
    \ to every tutorial ever and write a Vue application that puts “Hello, World!”\
    \ onto the screen before we dive into something bit more complicated. Each Vue\
    \ app is created by importing the library and then instantiating a new `Vue` instance:\n\
    \n```\nimport Vue from 'vue'\n\nconst vm = new Vue({\n  el: '#app',\n})\n```\n\
    \nWe give Vue an element to render onto the page, and with that, we’ve created\
    \ a Vue application! We pass a selector for the element we want Vue to replace\
    \ with our application. This means when Vue runs it will take the `div#app` that\
    \ we created and replace it with our application.\n\nThe reason we use the variable\
    \ name `vm` is because it stands for “View Model”. Although not strictly associated\
    \ with the [Model View-Model (MVVM) pattern](https://en.wikipedia.org/wiki/Model),\
    \ Vue was inspired in part by it, and the convention of using the variable name\
    \ `vm` for Vue applications has stuck. Of course you can call the variable whatever\
    \ you like!\n\nSo far, our application isn’t doing anything, though, so let’s\
    \ create our first component, `App.vue`, that will render something onto the page.\
    \ Vue doesn’t dictate how your application is structured, so this one is to you.\
    \ I ended up creating one folder per component, in this case `App` (I like the\
    \ capital letter, signifying a component), with three files in it:\n\n*   `index.vue`\n\
    *   `script.js`\n*   `style.css`\n\n```\nmkdir src/App\ntouch src/App/{index.vue,script.js,style.css}\n\
    ```\n\nThe file structure should now be:\n\n```\n.\n├── package.json\n├── package-lock.json\n\
    ├── src\n│   ├── App\n│   │   ├── index.vue\n│   │   ├── script.js\n│   │   └──\
    \ style.css\n│   ├── index.html\n│   └── index.js\n└── webpack.config.js\n```\n\
    \n`App/index.vue` defines the template, then imports the other files. This is\
    \ in keeping with the structure recommended in the [What About Separation of Concerns?](https://vuejs.org/guide/single-file-components.html#What-Separation-of-Concerns)\
    \ section of Vue’s docs.\n\n```html\n<!-- src/App/index.vue -->\n<template>\n\
    \  <p>Hello, World!</p>\n</template>\n<script src=\"./script.js\"></script>\n\
    <style scoped=\"./style.css\"></style>\n```\n\nI like calling it `index.vue`,\
    \ but you might want to call it `app.vue` too so it’s easier to search for. I\
    \ prefer importing `App/index.vue` in my code versus `App/app.vue`, but again\
    \ you might disagree, so feel free to pick whatever you and your team like.\n\n\
    For now, our template is just `<p>Hello, World!</p>`, and I’ll leave the CSS file\
    \ blank. The main work goes into `script.js`, which looks like so:\n\n```javascript\n\
    export default {\n  name: 'App',\n  data() {\n    return {}\n  },\n}\n```\n\n\
    Doing this creates a component which we’ll give the name `App`, primarily for\
    \ debugging purposes, which I’ll come to later, and then defines the data that\
    \ this component has and is responsible for. For now, we don’t have any data,\
    \ so we can just tell Vue by returning an empty object. Later on, we’ll see an\
    \ example of a component using data.\n\nNow we can head back into `src/index.js`\
    \ and tell the Vue instance to render our `App` component:\n\n```javascript\n\
    import Vue from 'vue'\n\nimport AppComponent from './App/index.vue'\n\nconst vm\
    \ = new Vue({\n  el: '#app',\n  components: {\n    app: AppComponent,\n  },\n\
    \  render: h => h('app'),\n})\n```\n\nFirstly, we import the component, trusting\
    \ webpack and the `vue-loader` to take care of parsing it. We then declare the\
    \ component. This is an important step: by default, Vue components are not globally\
    \ available. Each component must have a list of all the components they’re going\
    \ to use, and the tag that it will be mapped to. In this case, because we register\
    \ our component like so:\n\n```javascript\ncomponents: {\n  app: AppComponent,\n\
    }\n```\n\nThis means that in our templates we’ll be able to use the `app` element\
    \ to refer to our component.\n\nFinally, we define the `render` function. This\
    \ function is called with a helper — commonly referred to as `h` — that’s able\
    \ to create elements. It’s not too dissimilar to the `React.createElement` function\
    \ that React uses. In this case, we give it the string `'app'`, because the component\
    \ we want to render is registered as having the tag `app`.\n\nMore often than\
    \ not (and for the rest of this tutorial) we won’t use the `render` function on\
    \ other components, because we’ll define HTML templates. But the [Vue.js guide\
    \ to the render function](https://vuejs.org/guide/render-function) is worth a\
    \ read if you’d like more information.\n\nOnce we’ve done that, the final step\
    \ is to create an npm script in `package.json`:\n\n```json\n\"scripts\": {\n \
    \ \"start\": \"webpack-dev-server --mode development --open\"\n},\n```\n\nNow,\
    \ run `npm run start`. Your default browser should open at [http://localhost:8080/](http://localhost:8080/)\
    \ and you should see “Hello, World!” on the screen.\n"
