    \            <p class=\"card-header-title\">\n              {{ post.title }}\n\
    \            </p>\n          </header>\n          <div class=\"card-content\"\
    >\n            <div class=\"content\">\n              {{ post.summary }}\n   \
    \           <br>\n              <small>\n                by <strong>{{ post.author}}</strong>\n\
    \                // {{ post.published }}\n              </small>\n           \
    \ </div>\n          </div>\n          <footer class=\"card-footer\">\n       \
    \     <nuxt-link :to=\"`/post/${post.id}`\"\n              class=\"card-footer-item\"\
    >\n              Read More\n            </nuxt-link>\n          </footer>\n  \
    \      </div>\n      </div>\n    </div>\n  </section>\n</template>\n\n<script>\n\
    \  import posts from '~/posts.json'\n\n  export default {\n    name: 'posts',\n\
    \    data () {\n      return { posts }\n    }\n  }\n</script>\n```\n\nWe import\
    \ the `posts` data from the saved JSON file and assign it to the `posts` value\
    \ in our component. We then loop through all the posts in the component template\
    \ with the `v-for` directive and display the post attributes we want.\n\n### The\
    \ `~` Symbol\n"
