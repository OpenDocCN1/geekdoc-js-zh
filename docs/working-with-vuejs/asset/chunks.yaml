    \ val)  => calculateSubtotal(val)).get();\n  const total = subtotals.reduce((a,\
    \ v)  => a + Number(v),  0);\n  $('.total td:eq(1)').text(formatAsCurrency(total));\n\
    }\n```\n\n此函数查找表格中所有的行并对其进行循环，将每行传递给 `calculateSubtotal` 函数，然后对结果求和。最后，这个 `total`\
    \ 会被插入到发票的相关位置。\n\n```javascript\nfunction calculateSubtotal(row) {\n  const $row\
    \ = $(row);\n  const inputs = $row.find('input');\n  const subtotal = inputs[1].value\
    \ * inputs[2].value;\n\n  $row.find('td:last').text(formatAsCurrency(subtotal));\n\
    \n  return subtotal;\n}\n```\n\n在上面的代码中，我们获取了行中所有 `<input>` 的引用，并将第二个和第三个值相乘得到小计。该值随后被插入到行的最后一个单元格中。\n\
    \n```javascript\nfunction formatAsCurrency(amount) {\n  return `$${Number(amount).toFixed(2)}`;\n\
    }\n```\n\n我们还有一个小小的辅助函数，用于确保小计和总计都经过格式化为两位小数，并带有货币符号前缀。\n\n```javascript\n$('.btn-add-row').on('click',\
    \ () => {\n  const $lastRow = $('.item:last');\n  const $newRow = $lastRow.clone();\n\
    \n  $newRow.find('input').val('');\n  $newRow.find('td:last').text('$0.00');\n\
    \  $newRow.insertAfter($lastRow);\n\n  $newRow.find('input:first').focus();\n\
    });\n```\n\n最后，我们为 `Add row` 按钮编写了一个点击处理程序。我们在这里的操作是选择最后一行项目并创建一个副本。克隆行的输入被设置为默认值，并将其作为新的最后一行插入。我们还可以对用户友好一点，将焦点设置在第一个输入框，以便他们开始输入。\n\
    \n### 实时代码\n\n查看 Pen 上的 [jQuery Invoice](https://codepen.io/SitePoint/pen/YaBwJQ/)。\n\
    \n### 缺点\n\n那么，这段代码有什么问题，或者说，哪些地方可以做得更好？\n\n你可能听过一些较新的库，如 `Vue` 和 `React`，它们声称是声明式的而非命令式的。观察这段\
    \ jQuery 代码，它的大部分内容读起来像是一系列如何操作 DOM 的指令列表。代码每个部分的目的——即“做什么”——往往很难通过“如何”执行的细节中看出来。诚然，我们可以通过将代码拆分为命名良好的函数来明确代码意图，但如果你在一段时间后回来看这段代码，它仍然需要花费精力在脑中进行解析。\n\
    \n这类代码的另一个问题是，我们将应用程序状态保留在 DOM 本身中。订单项目的信息仅作为构成 UI 的 HTML 的存在。当我们只在单个位置显示信息时，这看起来可能不是什么大问题，但一旦我们开始需要在应用程序的多个地方显示相同的数据，要确保每个部分保持同步就会变得越来越复杂。没有单一的事实来源（source\
    \ of truth）。\n\n虽然 jQuery 的任何特性都没有阻止我们将状态存储在 DOM 之外并避免这些问题，但 `Vue` 等库提供了功能和结构，有助于创建良好的架构并编写更简洁、模块化的代码。\n\
    \n## 转换为 Vue\n\n那么，我们如何使用 `Vue` 重新创建此功能呢？\n\n正如我之前提到的，`Vue`并不要求我们使用模块打包器、转译器，或者为了启动而选择单文件组件（`.vue`\
    \ 文件）。像 jQuery 一样，我们可以直接从 CDN 引入库。让我们从更换脚本标签开始：\n\n```html\n<script src=\"https://cdn.jsdelivr.net/npm/vue@2.5.17/dist/vue.js\"\
    ></script>\n```\n\n接下来我们需要做的是创建一个新的 `Vue` 实例：\n\n```javascript\nconst app = new\
    \ Vue({\n  el: 'table'\n});\n```\n\n在这里我们需要提供的唯一选项是 `el`，这是一个选择器（就像我们在 jQuery\
    \ 中使用的那样），用于标识我们希望 `Vue` 管理文档的哪个部分。\n\n我们可以让 `Vue` 管理整个页面（例如用于单页应用）或单个 `<div>`。对于我们的发票示例，我们将\
    \ HTML 表格交由 `Vue` 控制。\n\n### 数据\n\n让我们也为 `Vue` 实例添加三个示例行的数据：\n\n```javascript\n\
    const app = new Vue({\n  el: 'table',\n  data: {\n    items: [\n      { description:\
    \ 'Website design', quantity: 1, price: 300 },\n      { description: 'Hosting\
    \ (3 months)', quantity: 1, price: 75 },\n      { description: 'Domain name (1\
    \ year)', quantity: 1, price: 10 },\n    ]\n  }\n});\n```\n\n`data` 属性是我们存储应用程序状态的地方。这不仅包括我们希望应用程序处理的数据，还包括关于\
    \ UI 状态的信息（例如，标签组中当前激活的是哪个部分，或者手风琴是展开还是折叠状态）。\n\n`Vue` 鼓励我们将应用程序的状态与它的表现层（即 DOM）分开，并将其集中在一个地方——单一的事实来源。\n\
    \n### 修改模板\n\n现在让我们设置模板来显示数据对象中的项目。由于我们已经告诉了 `Vue` 我们让它控制表格，我们就可以在 HTML 中使用它的模板语法告诉\
    \ `Vue` 如何渲染和操作它。\n\n使用 `v-for` 属性，我们可以为 `items` 数组中的每个项目渲染一段 HTML 块：\n\n```html\n\
    <tr class=\"item\" v-for=\"item in items\">\n\n</tr>\n```\n\n`Vue` 会为你传递给 `v-for`\
    \ 构造的数组（或对象）中的每个元素重复此标记，允许你在循环内部引用每个元素——在这种情况下，引用为 `item`。由于 `Vue` 正在观察 `data`\
    \ 对象的所有属性，当 `items` 的内容变化时，它将动态地重新渲染标记。我们只需要向我们的应用程序状态中添加或删除项目，`Vue` 就会负责更新 UI。\n\
    \n我们还需要添加 `<input>` 让用户填写项目的描述、单价和数量：\n\n```html\n<td><input v-model==\"item.description\"\
    \ /></td>\n<td>$<input type=\"number\" v-model=\"item.price\" /></td>\n<td><input\
    \ type=\"number\" v-model=\"item.quantity\" /></td>\n<td>{{ item.price * item.quantity\
    \ }}</td>\n``` (注：修正了可能的标记错误)\n\n在这里，我们使用 `v-model` 属性在输入框和数据模型上的属性之间建立双向绑定。这意味着输入框的任何更改都将更新项目上的属性，反之亦然。\n\
    \n在最后一个单元格中，我们使用双大括号 `{{ }}` 输出一些文本。我们可以在括号内使用任何有效的 JavaScript 表达式，因此我们将两个项目属性相乘并输出结果。同样，由于\
    \ `Vue` 正在观察我们的数据模型，任一属性的更改都会导致表达式重新求值。\n\n### 事件和方法\n\n现在我们设置好了模板来渲染 `items`\
    \ 集合，但我们如何添加新行呢？由于 `Vue` 会渲染 `items` 中的任何内容，要渲染一个空行，我们只需要向 `items` 数组推入一个带有默认值的对象即可。\n\
    \n为了创建一个从模板内部访问的函数，我们需要将它们作为 `methods` 对象的属性传递给 `Vue` 实例：\n\n```javascript\nconst\
    \ app = new Vue({\n  // ...\n  methods: {\n    myMethod() {}\n  },\n  // ...\n\
    })\n```\n\n注意，我们创建的任何方法都会自动绑定到 `Vue` 实例本身，因此我们可以通过 `this` 访问 `data` 对象中的属性和其他方法。\n\
    \n让我们定义一个 `addRow` 方法，可以通过调用它向 `items` 数组中添加新项目：\n\n```javascript\nmethods: {\n\
    \  addRow() {\n    this.items.push({ description: '', quantity: 1, price: 0 });\n\
    \  },\n},\n```\n\n现在既然我们有了这个方法，当点击 `Add row` 按钮时如何调用它呢？在模板中的元素上添加事件监听器的语法是 `v-on:event-name`：\n\
    \n```html\n<button class=\"btn-add-row\" @click=\"addRow\">Add row</button>\n\
    ```\n\n"
- fmt: "\nVue also provides a shortcut for us so we can use `@` in place of `v-on:`,\
    \ as I’ve shown in the code above. For the handler, we can specify any method\
    \ from our Vue instance.\n\n### Computed properties\n\nNow all we need to do is\
    \ display the grand total at the bottom of the invoice. Potentially we could do\
    \ this within the template itself: as I mentioned earlier, Vue allows us to put\
    \ any JavaScript statement between curly brackets. However, it’s much better to\
    \ keep anything more than very basic logic out of our templates; it’s cleaner\
    \ and easier to test if we keep that logic separate.\n\nWe could use another method\
    \ for this, but I think a [computed property](https://vuejs.org/v2/guide/computed.html#Computed-Properties)\
    \ is a better fit. Similar to creating methods, we pass our Vue instance a `computed`\
    \ object containing functions whose results we want to use in our template:\n\n\
    ```\nconst app = new Vue({\n  // ...\n  computed: {\n    total() {\n      return\
    \ this.items.reduce((acc, item) => acc + (item.price * item.quantity), 0);\n \
    \   }\n  }\n});\n```\n\nNow we can reference this computed property within our\
    \ template:\n\n```\n<tr class=\"total\">\n  <td colspan=\"3\"></td>\n  <td>Total:\
    \ ${{ total }}</td>\n</tr>\n```\n\nAs you might already have noticed, computed\
    \ properties can be treated as if they were data; we don’t have to call them with\
    \ parentheses. But using computed properties has another benefit: Vue is smart\
    \ enough to cache the returned value and only re-evaluate the function if one\
    \ of the data properties it depends upon changes.\n\nIf we were using a method\
    \ to sum up the grand total, the calculation would be performed each and every\
    \ time the template was re-rendered. Because we’re using a computed property,\
    \ the total is only recalculated if one of the item’s `quantity` or `price` fields\
    \ are changed.\n\n### Filters\n\nYou might have spotted we have a small bug in\
    \ our implementation. While the unit costs are whole numbers, our total and subtotals\
    \ are displayed without the cents. What we really want is for these figures to\
    \ always be displayed to two decimal places.\n\nRather than modify both the code\
    \ that calculates the subtotals and the code that calculates the grand total,\
    \ Vue provides us with a nice way to deal with common formatting tasks like this:\
    \ filters.\n\nAs you might have already guessed, to create a filter we just pass\
    \ an object with that key to our Vue instance:\n\n```\nconst app = new Vue({\n\
    \  // ...\n  filters: {\n    currency(value) {\n      return value.toFixed(2);\n\
    \    }\n  }\n});\n```\n\nHere we’ve created a very simple filter called `currency`,\
    \ which calls `toFixed(2)` on the value it receives and returns the result. We\
    \ can apply it to any output in our template like so:\n\n```\n<td>Total: ${{ total\
    \ | currency }}</td>\n```\n\n### Live Code\n\nSee the Pen [Vue Invoice](https://codepen.io/SitePoint/pen/MVLVmv/).\n\
    \n## Summing Up\n\nComparing the two versions of the code side by side, a couple\
    \ things stand out about the Vue app:\n\n- The clear separation between the UI,\
    \ and the logic/data that drives it: the code is much easier to understand, and\
    \ lends itself to easier testing\n- The UI is declarative: you only need to concern\
    \ yourself with what you want to see, not how to manipulate the DOM to achieve\
    \ it.\n\nThe size (in KB) of both libraries is almost identical. Sure, you could\
    \ slim down jQuery a bit with a custom build, but even with a relatively simple\
    \ project such as our invoice example, I think the ease of development and the\
    \ readability of the code justifies the difference.\n\nVue can also do a lot more\
    \ than we’ve covered here. Its strength lies in allowing you to create modular,\
    \ reusable UI components that can be composed into sophisticated front-end applications.\
    \ If you’re interested in delving deeper into Vue, I’d recommend checking out\
    \ [Getting Up and Running with the Vue.js 2.0 Framework](https://www.sitepoint.com/up-and-running-vue-js-2-0/).\n\
    \n# Chapter 8: Nuxt.js: a Minimalist Framework for Creating Universal Vue.js Apps\n\
    \n### by Olayinka Omole\n\n**Universal (or Isomorphic) JavaScript is a term that\
    \ has become very common in the JavaScript community. It’s used to describe JavaScript\
    \ code that can execute both on the client and the server.**\n\nMany modern JavaScript\
    \ frameworks, like [Vue.js](https://vuejs.org/), are aimed at building single-page\
    \ applications (SPAs). This is done to improve the user experience and make the\
    \ app seem faster, since users can see updates to pages instantaneously. While\
    \ this has a lot of advantages, it also has a couple of disadvantages, such as\
    \ long “time to content” when initially loading the app as the browser retrieves\
    \ the JavaScript bundle, and some search engine web crawlers or social network\
    \ robots won’t see the entire loaded app when they crawl your web pages.\n\nServer-side\
    \ rendering of JavaScript is about preloading JavaScript applications on a web\
    \ server and sending rendered HTML as the response to a browser request for a\
    \ page.\n\nBuilding server-side rendered JavaScript apps can be a bit tedious,\
    \ as a lot of configuration needs to be done before you even start coding. This\
    \ is the problem [Nuxt.js](https://nuxtjs.org) aims to solve for Vue.js applications.\n\
    \n## What Nuxt.js Is\n\nSimply put, Nuxt.js is a framework that helps you build\
    \ server-rendered Vue.js applications easily. It abstracts most of the complex\
    \ configuration involved in managing asynchronous data, middleware, and routing.\
    \ It’s similar to [Angular Universal](https://universal.io/) for [Angular](https://angular.io/),\
    \ and [Next.js](https://zeit.co/blog/next) for [React](https://facebook.github.io/).\n\
    \nAccording to [the Nuxt.js docs](https://nuxtjs.org/), “its main scope is UI\
    \ rendering while abstracting away the client/server.”\n\n### Static Generation\n\
    \nAnother great feature of Nuxt.js is its ability to generate static websites\
    \ with the `generate` command. It provides features similar to popular static\
    \ generation tools like [Jekyll](https://jekyllrb.com/).\n\n### Under the Hood\
    \ of Nuxt.js\n\nIn addition to Vue.js 2.0, Nuxt.js includes the following: [Vue-Router](https://github.com/vuejs/vue-router),\
    \ `Vuex`Vuex` (only included when using the [store option](https://nuxtjs.org/guide/vuex-store)),\
    \ [Vue Server Renderer](https://ssr.vuejs.org/) and [vue-meta](https://github.com/declandew/vue-meta).\
    \ This is great, as it takes away the burden of manually including and configuring\
    \ different libraries needed for developing a server-rendered Vue.js application.\
    \ Nuxt.js does all this out of the box, while still maintaining a total size of\
    \ 57kB min+gzip (60KB with vuex).\n\nNuxt.js also uses [webpack](https://github.com/webpack/webpack)\
    \ with [vue-loader](https://github.com/vuejs/vue-loader) and [babel-loader](https://github.com/babel/babel-loader)\
    \ to bundle, code-split and minify code.\n\n### How it works\n\nThis is what happens\
    \ when a user visits a Nuxt.js app or navigates to one of its pages via `<nuxt-link>`:\n\
    \n- When the user initially visits the app, if the [`nuxtServerInit` action](https://nuxtjs.org/guide/vuex-store/#the-nuxtserverinit-action)\
    \ is defined in the store, Nuxt.js will call it and update the store.\n- Next,\
    \ it executes any existing [middleware](https://nuxtjs.org/guide/routing/#middleware)\
    \ for the page being visited. Nuxt checks the `nuxt.config.js` file first for\
    \ global middleware, then checks the matching [layout file](https://nuxtjs.org/guide/views#layouts)\
    \ (for the requested page), and finally checks the page and its children for middleware.\
    \ Middleware are prioritized in that order.\n- If the route being visited is a\
    \ dynamic route, and a `validate()` method exists for it, [the route is validated](https://nuxtjs.org/api/pages-validate).\n"
