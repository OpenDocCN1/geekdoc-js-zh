    \ `Vue` 实例并将其设置为 `eventBus`：\n\n```\nconst eventBus = new Vue();\n```\n\n我们现在可以在组件中使用事件总线了。子组件看起来如下：\n\
    \n```\nVue.component('counter', {\n  props: {\n    count: {\n      type: Number,\n\
