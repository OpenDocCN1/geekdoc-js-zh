    \  name: 'GithubInput',\n  data() {\n    return { username: '', }\n  },\n  methods:\
    \ {\n    onSubmit(event) {\n      if (this.username && this.username !== '') {\n\
    \      }\n    }\n  }\n}\n```\n\nWe can refer to data directly on `this`, so `this.username`\
    \ will give us the latest value of the text box. If it’s not empty, we want to\
    \ let other components know that the data has changed. For this, we’ll use a message\
