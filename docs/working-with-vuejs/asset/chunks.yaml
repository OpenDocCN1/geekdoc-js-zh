    \ command. It’s pretty cool, and provides features similar to popular static generation\
    \ tools like [Jekyll](https://jekyllrb.com/).\n\n### Under the Hood of Nuxt.js\n\
    \nIn addition to Vue.js 2.0, Nuxt.js includes the following: [Vue-Router](https://github.com/vuejs/vue-router),\
    \ [Vuex](https://github.com/vuejs/vuex) (only included when using the [store option](https://nuxtjs.org/guide/vuex-store)),\
    \ [Vue Server Renderer](https://ssr.vuejs.org/) and [vue-meta](https://github.com/declandewet/vue-meta).\
