  trans: "\n假设你正在处理一个 API，它返回了一些文章并显示文章创建的日期。你可能希望向用户显示一个更易好的日期。这就是过滤器（filter）派上用场的场景之一。使用\
    \ [Momentjs](http://momentjs.com/)，你可以为日期创建一个过滤器。\n\n你的过滤器看起来像这样：\n\n```\ndate(value)\
    \ {\n  return moment(value).fromNow()\n}\n```\n\n这里并没有特别之处：我们只是在参数上调用了 `moment`\
    \ 的 `.fromNow()` 方法并将其返回。要显示过滤后的日期，我们使用 `{{ created_at | date }}`。\n\n### 现场代码\n\
    \n![-](img/forms4.png)\n\n查看 Pen [使用过滤器格式化数据](https://codepen.io/SitePoint/pen/bOdXXy/)。##\
    \ VeeValidate\n\n[VeeValidate](https://baianat.github.io/vee-validate/) 简化了 Vue\
    \ 表单的验证。在最后一个章节中，我们将构建一个注册表单并使用 VeeValidate 实现一些基本的验证检查。\n\n如果你正在使用 CLI 跟进学习，你需要使用\
    \ `npm` 安装 VeeValidate：\n\n```\nnpm install vee-validate --save\n```\n\n你还需要在\
    \ `main.js` 中注册该插件：\n\n```\nimport  VeeValidate  from  \"vee-validate\";\nVue.use(VeeValidate);\n\
    ```\n\n或者，你也可以通过 CDN 将其引入应用：\n\n```html\n<script src=\"https://unpkg.com/vee-validate@latest\"\
    ></script>\n```\n\n然后你需要像这样修改模板：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head> ... </head>\n<<body>\n  <!-- 此处放置模板 -->\n\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.17/vue.min.js\"\
    ></script>\n  <script src=\"https://unpkg.com/vee-validate@latest\"></script>\n\
    \  <script>\n    Vue.use(VeeValidate);\n    new Vue({ .. })\n  </script>\n</body>\n\
    </html>\n```\n\n接下来，让我们创建表单。我们将拥有 `name`、`gender`、`phone`、`email` 和 `password`\
    \ 字段，并将使用 `v-model` 将它们绑定到我们的数据模型：\n\n```html\n<div id=\"app\">\n  <h2>Register</h2>\n\
    \n  <form @submit.prevent=\"register\" method=\"post\" class=\"form\">\n    <div>\n\
    \      <label for=\"name\">Name:</label>\n      <input id=\"name\" name=\"name\"\
    \ v-validate=\"'required'\" type=\"text\" v-model=\"user.name\" class=\"form-control\"\
    \ />\n      <span v-show=\"errors.has('name')\" class=\"text-danger\">{{ errors.first('name')\
    \ }}</span>\n    </div>\n    <div>\n      <label for=\"gender\">Gender:</label>\n\
    \      <select id=\"gender\" name=\"gender\" v-model=\"user.gender\" class=\"\
    form-control\" v-validate=\"'required'\">\n        <option>Female</option>\n \
    \       <option>Male</option>\n      </select>\n      <span v-show=\"errors.has('gender')\"\
    \ class=\"text-danger\">\n        {{ errors.first('gender') }}\n      </span>\n\
    \    </div>\n    <div>\n      <label for=\"phone\">Phone:</label>\n      <input\
    \ id=\"phone\" name=\"phone\" v-validate=\"'required'\" type=\"text\" v-model=\"\
    user.phone\" class=\"form-control\" />\n      <span v-show=\"errors.has('phone')\"\
    \ class=\"text-danger\">\n        {{ errors.first('phone') }}\n      </span>\n\
    \    </div>\n    <div>\n      <label for=\"email\">Email:</label>\n      <input\
    \ id=\"email\" name=\"email\" v-validate=\"'required|email'\" type=\"text\" v-model=\"\
    user.email\" class=\"form-control\" />\n      <span v-show=\"errors.has('email')\"\
    \ class=\"text-danger\">\n        {{ errors.first('email') }}\n      </span>\n\
    \    </div>\n    <div>\n      <label for=\"password\">Password:</label>\n    \
    \  <input id=\"password\" name=\"password\" v-validate=\"'required'\" type=\"\
    password\" v-model=\"user.password\" class=\"form-control\" />\n      <span v-show=\"\
    errors.has('password')\" class=\"text-danger\">\n        {{ errors.first('password')\
    \ }}\n      </span>\n    </div>\n    <div>\n      <button class=\"btn btn-lg btn-primary\
    \ btn-block\" type=\"submit\">Submit</button>\n    </div>\n  </form>\n</div>\n\
    ```\n\n为了确保必填字段已填写，我们将值 `required` 传递给模板中的 `v-validate` 属性。这意味着输入框必须提供一个值。在我们的示例中，我们不会做更多操作，但请注意\
    \ [VeeValidate 开箱即提供了一系列验证规则](https://baianat.github.io/vee-validate/guide/rules.html)，这些规则都是经过本地化处理的并涵盖了大多数验证需求。如果你在其中没有找到需要的规则，也可以[创建自定义规则](https://baianat.github.io/vee-validate/guide/rules.html)。\n\
    \n"
- fmt: "\n```\n<div id=\"myApp\">\n  <nav aria-label=\"Page navigation example\">\n\
    \    <ul class=\"pagination\">\n      <li class=\"page-item\"><a class=\"page-link\"\
    \ href=\"#\">1</a></li>\n      <li class=\"page-item\"><a class=\"page-link\"\
    \ href=\"#\">2</a></li>\n      <li class=\"page-item active\"><a class=\"page-link\"\
    \ href=\"#\">3</a></li>\n      <li class=\"page-item\"><a class=\"page-link\"\
    \ href=\"#\">4</a></li>\n      <li class=\"page-item\"><a class=\"page-link\"\
    \ href=\"#\">5</a></li>\n    </ul>\n  </nav>\n</div>\n```\n\nNotice that each\
    \ page in this code snippet has a list-item element (`<li …>`). That element references\
    \ the `page-item` CSS class. In the code for this article, this class is defined\
    \ in the Bootstrap CSS framework. However, if it weren’t defined there, it would\
    \ be your responsibility to ensure that it was defined somewhere. The second CSS\
    \ class is the one that’s most relevant to this article, though.\n\nThe `active`\
    \ CSS class is used to identify the currently selected page. For this article,\
    \ this CSS class is also defined in the Bootstrap CSS. As shown in the snippet\
    \ above, the `active` class is only used in the third list item element. As you\
    \ can probably guess, this is the CSS class that you want to apply conditionally.\
    \ To do that, you need to add a JavaScript object.\n\n## Step 2: Create Your Class\
    \ Bindings\n\nLet’s build on the code snippet shown in step 1. When creating class\
    \ bindings in your template, there are two primary choices: using the object syntax\
    \ or using the array syntax. I’m going to show you how to use both approaches\
    \ in the remainder of this article.\n\n### Binding using object syntax\n\nTo create\
    \ a class binding using the object syntax, you have to use a JavaScript `expression`.\
    \ The expression we’ll be using can be seen in the code associated with this article\
    \ [here](https://codepen.io/SitePoint/pen/RqbBdK). That relevant code looks like\
    \ this:\n\n```\n<div id=\"myApp\">\n  <nav aria-label=\"An example with pagination\"\
    >\n    <ul class=\"pagination\">\n      <li v-for=\"page in totalPages\" v-bind:class=\"\
    {'page-item':true, 'active':(page === currentPage)}\">\n        <a class=\"page-link\"\
    \ href=\"#\">{{ page }}</a>\n      </li>\n    </ul>\n  </nav>\n</div>\n```\n\n\
    I’ve reduced the amount of code by using Vue’s baked-in `v-for` directive. This\
    \ directive is used to render items in a loop. The items in this example are the\
    \ pages themselves. Beyond the use of the `v-for` directive, notice the use of\
    \ the `v-bind` directive.\n\nThe `v-bind` directive connects the element’s `class`\
    \ attribute to the Vue instance. That instance of Vue is defined like this:\n\n\
    ```\nvar app = new Vue({\n  el: '#myApp',\n  data: {\n    totalPages: 5,\n   \
    \ currentPage: 3\n  }\n});\n```\n\nThis Vue instance is straight to the point.\
    \ The `data` object above includes a property named `currentPage`. If you revisit\
    \ the HTML template above, you’ll notice that this property is being. In fact,\
    \ the JavaScript object associated with class binding looks like this:\n\n```\n\
    {'page-item':true, 'active':(page === currentPage)}\n```\n\nThis object defines\
    \ two properties: `page-item` and `active`. Notably, these are the names of the\
    \ two CSS classes discussed in Step 1. In Step 2, these two class have become\
    \ property names in a JavaScript object. The values associated with these property\
    \ names are JavaScript expressions. If the expression evaluates as truthy, the\
    \ CSS class will be included. If the expression evaluates to `false`, the CSS\
    \ class will not be included. With these rules in mind, let’s look at each property.\n\
    \nThe first property, `page-item`, has a value of `true`. This hard-coded value\
    \ is used because we always want to include the `page-item` class. The second\
    \ property, `active`, uses a JavaScript expression. When this expression is `true`,\
    \ the `active` class will be applied. This empowers us to conditionally apply\
    \ the `active` class based on the value of `currentPage`. Another way to conditionally\
    \ apply the `active` class is by binding to an `Array`.\n\n### Binding using array\
    \ syntax\n\nVue lets you apply a list of CSS classes by binding to an `Array`.\
    \ If you wanted to use the `Array` syntax, the HTML shown in Step 1 would become\
    \ this:\n\n```\n<div id=\"myApp\">\n  <nav aria-label=\"An example with pagination\"\
    >\n    <ul class=\"pagination\">\n        <li v-for=\"page in totalPages\" v-bind:class=\"\
    [pageItemClass, (page === currentPage) ? activeClass : '']\">\n          <a class=\"\
    page-link\" href=\"#\">{{ page }}</a>\n        </li>\n    </ul>\n  </nav>\n</div>\n\
    ```\n\nA running version with the `Array` syntax can be seen [here](https://codepen.io/SitePoint/pen/dQbjX).\
    \ The only difference is the use of `Array` on the class binding. This alternative\
    \ approach expects two properties to exist in Vue’s `data` object. Those two properties\
    \ are: `pageItemClass` and `activeClass`. The updated Vue initialization code\
    \ with these properties looks like this:\n\n```\nvar app = new Vue({\n  el: '#myApp',\n\
    \  data: {\n    totalPages: 5,\n    currentPage: 3,\n    pageItemClass: 'page-item',\n\
    \    activeClass: 'active'\n  }\n});\n```\n\nAs you can see, the `data` object\
    \ has grown in size, but the code in the template is slightly cleaner using the\
    \ `Array` syntax. The object syntax is a little bit more compact. The choice between\
    \ the object syntax and the `Array` syntax comes down to personal preference.\
    \ Both approaches may seem to make your HTML template more complicated. However,\
    \ there’s actually more going here. In reality, we’re separating concerns. We’re\
    \ creating a template that is driven by data. This makes the view easier to test\
    \ and easier to maintain as the app grows.\n\n# Chapter 7: How to Replace jQuery\
    \ with Vue\n\n### by Nilson Jacques\n\nI’m willing to bet that there are a lot\
    \ of developers out there who still reach for `jQuery` when tasked with building\
    \ simple apps. There are often times when we need to add some interactivity to\
    \ a page, but reaching for a JavaScript framework seems like overkill — with all\
    \ the extra kilobytes, the boilerplate, build tools and module bundlers. Including\
    \ `jQuery` from a CDN seems like a no-brainer.\n\nIn this article, I’d like to\
    \ take a shot at convincing you that using `Vue.js` (referred to as Vue from here\
    \ on), even for relatively basic projects, doesn’t have to be a headache, and\
    \ will help you write better code faster. We’ll take a simple example, code it\
    \ up in `jQuery`, and then recreate it in Vue step by step.\n\n## What We’re Building\n\
    \nFor this article, we’re going to be building a basic online invoice, using this\
    \ [open-source template from Sparksuite](https://github.com/sparksuite/simple-html-invoice-template).\
    \ Hopefully, this should make a refreshing change from another to-do list, and\
    \ provide enough complexity to demonstrate the advantages of using something like\
    \ Vue while still being easy to follow.\n\n![Screenshot of template](Images/1523363247sparksuite-template.png)\n\
    \nWe’re going to make this interactive by providing item, unit price, and quantity\
    \ inputs, and having the `Price` column automatically recalculated when one of\
    \ the values changes. We’ll also add a button to insert new empty rows into the\
    \ invoice, and a `Total` field that will automatically update as we edit the data.\n\
    \nI’ve modified the template so that the HTML for a single (empty) row now looks\
    \ like this:\n\n```\n<tr class=\"item\">\n  <td><input value=\"\" /></td>\n  <td>$<input\
    \ type=\"number\" value=\"0\" /></td>\n  <td><input type=\"number\" value=\"1\"\
    \ /></td>\n  <td>$0.00</td>\n</tr>\n```\n\n## jQuery\n\nSo, first of all, let’s\
    \ take a look at how we might do this with `jQuery`.\n\n```\n$('table').on('mouseup\
    \ keyup', 'input[type=number]', calculateTotals);\n```\n\nWe’re attaching a listener\
    \ to the table itself, which will execute the `calculateTotals` function when\
    \ either the `Unit Cost` or `Quantity` values are changed:\n"
