    \ to `Counter.vue`:\n\n```bash\ncd vuex-counter\nmv src/components/HelloWorld.vue\
    \ src/components/Counter.vue\n```\n\nFinally, open up `src/App.vue` and replace\
    \ the existing code with the following:\n"
