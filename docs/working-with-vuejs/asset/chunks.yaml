  trans: "\n\n最近，[webpack](https://webpack.js.org/) 是我首选的构建工具，我们可以结合 [vue-loader 插件](https://github.com/vuejs/vue-loader)\
    \ 使用，以支持我之前提到的 Vue.js 组件格式。我们还需要 Babel 和 `env` 预设，这样我们就可以使用现代 JavaScript 语法编写所有代码，此外还需要\
    \ [webpack-dev-server](https://github.com/webpack/webpack-dev-server)，它会在检测到文件更改时更新浏览器。\n\
    \n让我们初始化项目并安装依赖：\n\n```\nmkdir vue2-demo-project\ncd vue2-demo-project\nnpm init\
    \ -y\nnpm i vue\nnpm i webpack webpack-cli @babel/core @babel/preset-env babel-loader\
    \ vue-loader vue-template-compiler webpack-dev-server html-webpack-plugin --save-dev\n\
    ```\n\n然后创建初始文件夹和文件：\n\n```\nmkdir src\ntouch webpack.config.js src/index.html\
    \ src/index.js\n```\n\n项目结构应该是这样的：\n\n```\n.\n├── package.json\n├── package-lock.json\n\
    ├── src\n│   ├── index.html\n│   └── index.js\n└── webpack.config.js\n```\n\n\
    现在让我们设置 webpack 配置。这可以归结为以下内容：\n\n*   告诉 webpack 对任何 `.vue` 文件使用 `vue-loader`\n\
    *   告诉 webpack 对任何 `.js` 文件使用 Babel 和 `env` 预设\n*   告诉 webpack 生成一个 HTML 文件供开发服务器提供，并使用\
    \ `src/index.html` 作为模板：\n\n```\n//webpack.config.js\nconst VueLoaderPlugin =\
    \ require('vue-loader/lib/plugin')\nconst HtmlWebPackPlugin = require(\"html-webpack-plugin\"\
    )\n\nmodule.exports = {\n  module: {\n    rules: [\n      {\n        test: /\\\
    .vue$/,\n        loader: 'vue-loader',\n      },\n      {\n        test: /\\.js$/,\n\
    \        exclude: /node_modules/,\n        use: {\n          loader: 'babel-loader',\n\
    \          options: {\n            presets: ['@babel/preset-env']\n          }\n\
    \        }\n      }\n    ]\n  },\n  plugins: [\n    new VueLoaderPlugin(),\n \
    \   new HtmlWebPackPlugin({\n      template: \"./src/index.html\"\n    })\n  ]\n\
    }\n```\n\n最后，我们向 HTML 文件中添加一些内容，就可以准备就绪了\n\n```\n<!-- src/index.html -->\n<!DOCTYPE\
    \ html>\n<html\n  <head>\n    <title>My Vue App</title>\n  </head>\n  <body>\n\
    \    <div id=\"app\"></</div>\n  </body>\n</\n>\n```\n\n我们创建了一个 ID 为 `app` 的空\
    \ `div`，因为这是我们要放置 Vue 应用程序的元素。我总是倾向于使用 `div` 而不是直接使用 `body` 元素，因为这可以让我控制页面的其他部分。\n\
    \n## 编写我们的第一个 Vue.js 应用\n\n我们将遵循每一个教程的惯例，在深入研究更复杂的内容之前，编写一个在屏幕上显示“Hello, World!”的\
    \ Vue 应用。每个 Vue 应用都是通过导入库并实例化一个新的 `Vue` 实例创建的：\n\n```\nimport Vue from 'vue'\n\
    \nconst vm = new Vue({\n  el: '#app',\n})\n```\n\n我们给 Vue 提供一个渲染到页面上的元素，这样我们就创建了一个\
    \ Vue 应用！我们传递一个选择器，指定 Vue 用我们的应用程序来替换哪个元素。这意味着当 Vue 运行时，它将获取我们创建的 `div#app` 并将其替换为我们的应用程序。\n\
    \n我们之所以使用变量名 `vm`，是因为它代表“View Model”（视图模型）。虽然它并没有严格关联 [模型-视图-模型 (MVVM) 模式](https://en.wikipedia.org/wiki/Model)，但\
    \ Vue 在某种程度上受了它的启发，并且在 Vue 应用中使用 `vm` 作为变量名的约定也保留了下来。当然，你可以用任何喜欢的名称命名该变量！\n\n\
    到目前为止，我们的应用什么都没做，所以让我们创建第一个第一个组件 `App.vue`，它将在页面上渲染一些内容。Vue 并不规定你的应用程序如何结构，所以这部分由你决定。我最终为每个组件创建了一个文件夹，在本例中是\
    \ `App`（我喜欢大写字母，它表示一个组件），里面有三个文件：\n\n*   `index.vue`\n*   `script.js`\n*   `style.css`\n\
    \n```\nmkdir src/App\ntouch src/App/{index.vue,script.js,style.css}\n```\n\n现在的文件结构应该是：\n\
    \n```\n.\n├── package.json\n├── package-lock.json\n├── src\n│   ├── App\n│   │\
    \   ├── index.vue\n│   │   ├── script.js\n│   │   └── style.css\n│   ├── index.html\n\
    │   └── index.js\n└── webpack.config.js\n```\n\n`App/index.vue` 定义了模板，然后导入了其他文件。这与\
    \ Vue 文档中[关注点分离？](https://vuejs.org/guide/single-file-components.html#What-Separation-of-Concerns)\
    \ 章节推荐的结构一致。\n\n```html\n<!-- src/App/index.vue -->\n<template>\n  <p>Hello, World!</p>\n\
    </template>\n<script src=\"./script.js\"></script>\n<style scoped=\"./style.css\"\
    ></style>\n```\n\n我喜欢 `index.vue`，但你可能想调用它 `app`。目前，我们的模板只是 `<p>Hello, World!</p>`，我们在\
    \ `script.js` 中让它是空的。\n\n```javascript\nexport default {\n  name: 'App',\n  data()\
    \ {\n    return {}\n  },\n}\n```\n\n这样做创建了一个组件，我们将它命名为 `App` 主要为了调试。之后我们会看到一个使用数据的示例。\n\
    \n现在我们回到 `src/index.js`，告诉 Vue 实例渲染我们的 `App` 组件：\n\n```javascript\nimport Vue\
    \ from 'vue'\n\nimport AppComponent from './App/index.vue'\n\nconst vm = new Vue({\n\
    \  el: '#app',\n  components: {\n    app: AppComponent,\n  },\n  render: h =>\
    \ h('app'),\n})\n```\n\n"
- fmt: "\nAs an example application, we’re going to be using the GitHub API to build\
    \ an application that lets us enter a username and see some GitHub stats about\
    \ that user. I’ve picked the GitHub API here as it’s familiar to most people,\
    \ usable without authenticating, and gives us a fair amount of information.\n\n\
    Before starting an application I like to have a quick think about what components\
    \ we’ll need, and I’m thinking that our `App` component will render two further\
    \ components: `GithubInput`, for taking input from the user, and `GithubOutput`,\
    \ which will show the user’s information on the screen. We’ll start with the input.\n\
    \n## Github\n\nYou can find all [the code on GitHub](https://github.com/sitepoint-editors/vue2-demo-project)\
    \ and even check out the [application running online](http://sitepoint-vue2-demo.surge.sh/).\n\
    \n### Initial Setup\n\nCreate folders for the `GithubOutput` and `GithubInput`\
    \ components within the `src` directory:\n\n```bash\nmkdir src/{GithubInput,GithubOutput}\n\
    ```\n\nAdd the necessary files to each:\n\n```bash\ntouch src/GithubInput/{index.vue,script.js,style.css}\n\
    touch src/GithubOutput/{index.vue,script.js,style.css}\n```\n\nThe structure of\
    \ the `src` folder should now look like so:\n\n```\n.\n├── App\n│   ├── index.vue\n\
    │   ├── script.js\n│   └── style.css\n├── GithubInput\n│   ├── index.vue\n│  \
    \ ├── script.js\n│   └── style.css\n├── GithubOutput\n│   ├── index.vue\n│   ├──\
    \ script.js\n│   └── style.css\n├── index.html\n└── index.js\n```\n\n## Forms\
    \ in Vue.js\n\nLet’s start with the `GithubInput` component. As with the `App`\
    \ component, the `index.vue` file should contain the template, as well as loading\
    \ in the script and CSS file. The template simply contains `<p>github input</p>`\
    \ for now. We’ll fill it in properly shortly. I like putting in some dummy HTML\
    \ so I can check I’ve got the template wired up properly when creating a new component:\n\
    \n```vue\n<!-- src/GithubInput/index.vue -->\n<template>\n  <p>github input</p>\n\
    </template>\n\n<script src=\"./script.js\"></script>\n<style scoped src=\"./style.css\"\
    ></style>\n```\n\nWhen creating this component the one thing we do differently\
    \ is create a piece of data that’s associated with the component. This is very\
    \ similar to React’s concept of state:\n\n```javascript\n// src/GithubInput/script.js\n\
    export default {\n  name: 'GithubInput',\n  data() {\n    return {\n      username:\
    \ '',\n    }\n  }\n}\n```\n\nThis says that this component has a piece of data,\
    \ `username`, that it owns and is responsible for. We’ll update this based on\
    \ the user’s input shortly.\n\nFinally, to get this component onto the screen,\
    \ I need to register it with the `App` component, as it’s the `App` component\
    \ that will be rendering it.\n\nTo do this, I update `src/App/script.js` and tell\
    \ it about `GithubInput`:\n\n```javascript\n// src/App/script.js\nimport GithubInput\
    \ from '../GithubInput/index.vue'\n\nexport default {\n  name: 'App',\n  components:\
    \ {\n    'github-input': GithubInput,\n  },\n  data() {\n    return {}\n  },\n\
    }\n```\n\nAnd then I can update the `App` component’s template:\n\n```vue\n<!--\
    \ src/App/index.vue -->\n<div\n  <p>Hello World</p>\n  <github-input></github-input>\n\
    </div>\n```\n\nA restriction of Vue components (which is also true in Angular\
    \ and React) is that each component must have one root node, so when a component\
    \ has to render multiple elements, it’s important to remember to wrap them all\
    \ in something, most commonly a `div`.\n\n## Tracking a Form Input\n\nOur `GithubInput`\
    \ component will need to do two things:\n\n* Keep track of the current value of\
    \ the input\n* Communicate that the value has changed, so that other components\
    \ can know and therefore update their state.\n\nWe can do the first version by\
    \ creating a `form` with an `input` element in it. We can use Vue’s built-in directives\
    \ that enable us to keep track of form values. The template for `GithubInput`\
    \ looks like so:\n\n```vue\n<form v-on:submit.prevent=\"onSubmit\">\n  <input\
    \ type=\"text\" v-model=\"username\" placeholder=\"Enter a github username here\"\
    \ />\n  <button type=\"submit\">Go!</button>\n</form>\n```\n\nThere are two important\
    \ attributes you’ll notice: `v-on` and `v-model`.\n\n`v-on` is how we bind to\
    \ DOM events in Vue and call a function. For example, `<p v-on:click=\"foo\">Click\
    \ me!</p>` would call the component’s `foo` method every time the paragraph was\
    \ clicked. If you’d like to go through event handling in greater detail, I highly\
    \ recommend the [Vue documentation on event handling](https://vuejs.org/v2/guide/events.html).\n\
    \n`v-model` creates a two-way data binding between a form input and a piece of\
    \ data. Behind the scenes, `v-model` is effectively listening for change events\
    \ on the form input and updating the data in the Vue component to match.\n\nTaking\
    \ our template into consideration, `v-on:submit.prevent=\"onSubmit\"` and `v-model=\"\
    username\"` are the keys. `v-on` is how we bind to DOM events and call a function.\
    \ `v-model` creates a two-way data binding.\n\nWhen your application grows, you\
    \ might want to look into a more structured approach, such as Vuex. For now, a\
    \ message bus does the job. The great news is that we can use an empty Vue instance\
    \ as a message bus. To do so, we’ll create `src/bus.js`, which simply creates\
    \ a Vue instance and exports it:\n\n```javascript\nimport Vue from 'vue'\nconst\
    \ bus = new Vue()\n\nexport default bus\n```\n\nIn the `GithubInput` component\
    \ we can then import that module and use it by emitting an event when the username\
    \ changes:\n\n```javascript\nimport bus from '../bus'\n\nexport default {\n  //\
    \ ...\n  methods: {\n    onSubmit() {\n      if (this.username && this.username\
    \ !== '') {\n        bus.$emit('new-username', this.username)\n      }\n    }\n\
    \  }\n}\n```\n\nWith that, our form is done, and we’re ready to start doing something\
    \ with the resulting data.\n\n## Displaying Results From GitHub\n\nThe `GithubOutput`\
    \ component has the same structure as our other components. In `GithubOutput/script.js`\
    \ we also import the `bus` module, as we’ll need it to know when the username\
    \ changes. The data that this component will be responsible for will be an object\
    \ that maps GitHub usernames to the data we got from the GitHub API. This means\
    \ we won’t have to make the request to the API every single time; if we’ve already\
    \ fetched the data previously we can simply reuse it. We’ll also store the last\
    \ username we were given, so we know what data to display on screen:\n\n```javascript\n\
    // src/GithubOutput/script.js\nimport bus from '../bus'\nimport Vue from 'vue'\n\
    \nexport default {\n  name: 'GithubOutput',\n  data() {\n    return {\n      currentUsername:\
    \ null,\n      githubData: {}\n    }\n  }\n}\n```\n"
  raw: "As an example application, we’re going to be using the GitHub API to build\
    \ an application that lets us enter a username and see some GitHub stats about\
    \ that user. I’ve picked the GitHub API here as it’s familiar to most people,\
    \ usable without authenticating, and gives us a fair amount of information.\n\n\
    Before starting an application I like to have a quick think about what components\
    \ we’ll need, and I’m thinking that our `App` component will render two further\
