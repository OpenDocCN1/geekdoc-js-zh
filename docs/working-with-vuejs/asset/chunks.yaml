  trans: "\n\n我们目前的首页看起来非常空陋，因此可以通过显示博客中的最新文章来使其变得更好。我们将通过创建一个 `<posts>` 组件并在 `index.vue`\
    \ 页面显示它来实现。\n\n但首先，我们必须获取保存的 JSON 博客文章，并将它们存放在应用根目录下的文件中。[可以从这里下载文件](https://github.com/sitepoint-editors/nuxt-ssr-blog/blob/master/posts.json)，或者你也可以复制下面的\
    \ JSON 并将其保存到根目录下的 `posts.json`：\n\n```json\n[\n    {\n        \"id\": 4,\n  \
    \      \"title\": \"使用 Nuxt.js 构建通用 JS 应用程序\",\n        \"summary\": \"介绍 Nuxt.js，并使用\
    \ Vue.js 构建优秀的 SSR 应用。\",\n        \"content\": \"<p>Lorem ipsum dolor sit amet,\
    \ consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore\
    \ magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris\
    \ nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor pariatur. Excepteur\
    \ sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit\
    \ anim id est laborum.</p>\",\n        \"author\": \"Jane Doe\",\n        \"published\"\
    : \"08:00 - 07/06/2017\"\n    },\n    {\n        \"id\": 3,\n        \"title\"\
    : \"优秀的 SSR 用用例\",\n        \"summary\": \"查看简单且丰富的服务器渲染 JavaScript 应用程序。\",\n\
    \        \"content\": \"<p>Lorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit, sed do eiusmod aliquip ex ea commodo consequat. Duis aute irure dolor\
    \ in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.\
    \ Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt\
    \ mollit anim id est laborum.</p>\",\n        \"author\": \"Jane Doe\",\n    \
    \    \"published\": \"17:00 - 06/06/2017\"\n    },\n    {\n        \"id\": 2,\n\
    \        \"title\": \"Vue.js 中的 SSR\",\n        \"summary\": \"学习 Vue.js 中的 SSR，以及\
    \ Nuxt.js 如何让这一切变得更快。\",\n        \"content\": \"<p>Lorem ipsum dolor sit amet,\
    \ consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore\
    \ magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris\
    \ nisi ut voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur\
    \ sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit\
    \ anim id est laborum.</p>\",\n        \"author\": \"Jane Doe\",\n        \"published\"\
    : \"13:00 - 06/06/2017\"\n    },\n    {\n        \"id\": 1,\n        \"title\"\
    : \"SSR 简介\",\n        \"summary\": \"学习 JavaScript 中的 SSR 以及它如何能变得超级酷。\",\n \
    \       \"content\": \"<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit,\
    \ sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad\
    \ minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea\
    \ commodo consequat. Duis aute irure dolor. Excepteur sint occaecat cupidatat\
    \ non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</p>\"\
    ,\n        \"author\": \"John Doe\",\n        \"published\": \"11:00 - 06/06/2017\"\
    \n    }\n]\n```\n\n### 如何获取内容\n\n理想情况下，文章应该从 API 或资源获取。例如，[Contentful](https://www.contentful.com/)\
    \ 就是一个可以用于此目的的服务。\n\n组件位于 `components` 目录。我们将在那里创建一个 `<posts>` 单文件组件：\n\n```vue\n\
    <!-- ./components/Posts.vue -->\n<template>\n  <section class=\"main-content\"\
    >\n    <div class=\"container\">\n      <h1 class=\"title has-text-centered\"\
    >\n        最新文章。\n      </h1>\n      <div class=\"columns is-multiline\">\n  \
    \      <div class=\"column is-half\" v-for=\"post in posts\" :key=\"post.id\"\
    >\n          <div class=\"card\">\n           <header class=\"card-header\">\n\
    \            <p class=\"card-header-title\">\n              {{ post.title }}\n\
    \            </p>\n          </header>\n          <div class=\"card-content\"\
    >\n            <div class=\"content\">\n              {{ post.summary }}\n   \
    \           <br>\n              <small>\n                作者：<strong>{{ post.author}}</strong>\n\
    \                // {{ post.published }}\n              </small>\n           \
    \ </div>\n          </div>\n          <footer class=\"card-footer\">\n       \
    \     <nuxt-link :to=\"`/post/${post.id}`\"\n              class=\"card-footer-item\"\
    >\n              阅读更多\n            </nuxt-link>\n          </footer>\n       \
    \ </div>\n      </div>\n    </div>\n  </section>\n</template>\n\n<script>\n  import\
    \ posts from '~/posts.json'\n\n  export default {\n    name: 'posts',\n    data\
    \ () {\n      return { posts }\n    }\n  }\n</script>\n```\n\n我们从保存的 JSON 文件中导入\
    \ `posts` 数据，并将其分配给组件中的 `posts` 值。然后，我们使用 `v-for` 指令在组件模板中循环遍历所有文章，并显示我们想要的文章属性。\n\
    \n### `~` 符号\n\n"
- fmt: "\nGreat, now we can visit our blog again to see all routes and pages working\
    \ properly, and also view the page source to see the HTML being generated. We\
    \ have a functional server-rendered JavaScript application.\n\n### Generating\
    \ Static Files\n\nNext, we can generate the static HTML files for our pages.\n\
    \nWe’ll need to make a minor tweak though, as by default Nuxt.js ignores dynamic\
    \ routes. To generate the static files for dynamic routes, we need to specify\
    \ them explicitly in the `./nuxt.config.js` file.\n\nWe’ll use a callback function\
    \ to return the list of our dynamic routes:\n\n```\n// ./nuxt.config.js\n\nmodule.exports\
    \ = {\n  // ...\n  generate: {\n    routes(callback) {\n      const posts = require('./posts.json')\n\
    \      let routes = posts.map(post => `/post/${post.id}`)\n      callback(null,\
    \ routes)\n    }\n  }\n}\n```\n\nYou can check [here](https://nuxtjs.org/api/configuration-generate/)\
    \ for the full documentation on using the `generate` property.\n\nTo generate\
    \ all the routes, we can now run this command:\n\n```\nnpm run generate\n```\n\
    \nNuxt saves all generated static files to a `dist` folder.\n\n### Deployment\
    \ on Firebase Hosting\n\nAs a final step, we can take advantage of [hosting by\
    \ Firebase](https://firebase.google.com/products/hosting/) to make our static\
    \ website live in a couple of minutes. This step assumes that you have a Google\
    \ account.\n\nFirst, install the Firebase CLI, if you don’t already have it:\n\
    \n```\nnpm install -g firebase-tools\n```\n\nTo connect your local machine to\
    \ your Firebase account and obtain access to your Firebase projects, run the following\
    \ command:\n\n```\nfirebase login\n```\n\nThis should open a browser window and\
    \ prompt you to sign in. Once you’re signed in, visit [https://console.firebase.google.com](https://console.firebase.google.com)\
    \ and click `Add project`. Make the relevant choices in the wizard that opens.\n\
    \nOnce the project is created, go to the project’s hosting page at `https://console.firebase.google.com/project/<project\
    \ name>/hosting` and complete the `Get started` wizard.\n\nThen, on your PC, from\
    \ the root of your project directory, run the following command:\n\n```\nfirebase\
    \ init\n```\n\nIn the wizard that appears, select “Hosting”. Then select your\
    \ newly created project from the list of options. Next choose the `dist` directory\
    \ as the public directory. Select to configure the page as a single-page app and\
    \ finally select “No” when asked if you want to overwrite `dist/index.html`.\n\
    \nFirebase will write a couple of configuration files to your project, then put\
    \ the website live at `https://<project name>.firebaseapp.com`. The demo app for\
    \ this article can be seen at [nuxt-ssr-blog.firebaseapp.com](https://nuxt-ssr-blog.firebaseapp.com/).\n\
    \nIf you run into problems, you can find full instructions on [Firebase’s quickstart\
    \ page](https://firebase.google.com/docs/hosting/quickstart).\n\n## Conclusion\n\
    \nIn this article, we’ve learned how we can take advantage of Nuxt.js to build\
    \ server-rendered JavaScript applications with Vue.js. We also learned how to\
    \ use its `generate` command to generate static files for our pages, and deploy\
    \ them quickly via a service like Firebase Hosting.\n\nThe Nuxt.js framework is\
    \ really great. It’s even [recommended in the official Vue.js SSR GitBook](https://ssr.vuejs.org/en/#about-this-guide).\
    \ I really look forward to using it in more SSR projects and exploring all of\
    \ its capabilities.\n\n# Chapter 9: Optimize the Performance of a Vue App with\
    \ Async Components\n\n### by Michiel Mulders\n\nSingle-page applications sometimes\
    \ cop a little flack for their slow initial load. This is because traditionally,\
    \ the server will send a large bundle of JavaScript to the client, which must\
    \ be downloaded and parsed before anything is displayed on the screen. As you\
    \ can imagine, as your app grows in size, this can become more and more problematic.\n\
    \nLuckily, when building a Vue application using Vue CLI (which uses webpack under\
    \ the hood), there are a number of measures one can take to counteract this. In\
    \ this article, I’ll demonstrate how make use of both asynchronous components\
    \ and webpack’s code-splitting functionality to load in parts of the page after\
    \ the app’s initial render. This will keep the initial load time to a minimum\
    \ and give your app a snappier feel.\n\nTo follow this tutorial, you need a basic\
    \ understanding of Vue.js and optionally Node.js.\n\n## Async Components\n\nBefore\
    \ we dive into creating asynchronous components, let’s take a look at how we normally\
    \ load a component. To do so, we’ll use a very simple message component:\n\n```\n\
    <!-- Message.vue -->\n<template>\n  <h1>New message!</h1>\n</template>\n```\n\n\
    Now that we’ve created our component, let’s load it into our `App.vue` file and\
    \ display it. We can just import the component and add it to the components option\
    \ so we can use it in our template:\n\n```\n<!-- App.vue -->\n<template>\n  <div>\n\
    \    <message></message>\n  </div>\n</template>\n\n<script>\nimport Message from\
    \ \"./Message\";\nexport default {\n  components: {\n    Message\n  }\n};\n</script>\n\
    ```\n\nBut what happens now? The `Message` component will be loaded-ever whenever\
    \ the application is loaded, so it’s included in the initial load.\n\nThis might\
    \ not sound like a huge problem for a simple app, but consider something more\
    \ complex like a web store. Imagine that a user adds items to a basket, then wants\
    \ to check out, so clicks the checkout button which renders a box with all details.\
    \ Using the above method, this checkout box will be included in the initial bundle,\
    \ although we only need the component when the user clicks the button.\n\nTo improve\
    \ the efficiency of the application, we can combine both lazy loading and code\
    \ splitting techniques.\n\nLazy loading is all about delaying the initial load\
    \ of a component. You can see lazy loading in action on sites like medium.com,\
    \ where the images are loaded in before they’re required. This is useful, as we\
    \ don’t have to waste resources loading all the images for a particular post up\
    \ front, as the reader might skip the article halfway.\n\nThe code splitting feature\
    \ webpack allows you to split your code into various bundles that can then be\
    \ loaded on demand or in parallel at a later point in time. It can be used to\
    \ load specific pieces of code only when they’re used.\n\n## Dynamic Imports\n\
    \nLuckily, Vue caters for this scenario using something called dynamic imports.\
    \ This feature introduces a new function-like form of import that will return\
    \ a `Promise` containing the requested (Vue) component. As the import is a function\
    \ receiving a string, we can do powerful things like loading modules using expressions.\
    \ Dynamic imports have been available in Chrome since version 61. More information\
    \ about them can be found on the [Google Developers website](https://developers.google.com/web/updates/2017/11/dynamic-import).\n\
    \nThe code splitting is taken care of by bundlers like webpack, Rollup or Parcel,\
    \ which understand the dynamic import syntax and create a separate file for each\
    \ dynamically imported module. We’ll see this later in our console’s network tab.\
    \ But first, let’s take a look at the difference between a static and dynamic\
    \ import:\n\n```\n// static import\nimport Message from \"./Message\";\n\n// dynamic\
    \ import\nimport(\"./Message\").then(Message => {\n  // Message module is available\
    \ here...\n});\n```\n\nNow, let’s apply this knowledge to our `Message` component,\
    \ and we’ll get an `App.vue` component that looks like this:\n\n```\n<!-- App.vue\
    \ -->\n<template>\n  <div>\n    <message></message>\n  </div>\n</template>\n\n\
    <script>\nimport Message from \"./Message\";\nexport default {\n  components:\
    \ {\n    Message: () => import(\"./Message\")\n  }\n};\n</script>\n```\n"
