    \ and routing. It’s similar to [Angular Universal](https://universal.angular.io/)\
    \ for [Angular](https://angular.io/), and [Next.js](https://zeit.co/blog/next6)\
    \ for [React](https://facebook.github.io/react/).\n\nAccording to [the Nuxt.js\
    \ docs](https://nuxtjs.org/guide), “its main scope is UI rendering while abstracting\
    \ away the client/server distribution.”\n\n### Static Generation\n\nAnother great\
