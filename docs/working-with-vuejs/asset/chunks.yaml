  trans: "\n\n可以通过返回一个函数来向 `getter` 处理器传递参数。如果你想在 `getter` 中执行查询，这将非常有用：\n\n```\n\
    getters: {\n  getProductById: state => id => {\n    return state.products.find(product\
    \ => product.id === id);\n  }\n}\n\nstore.getters.getProductById(5)\n```\n\n请注意，每次通过方法访问\
    \ `getter` 处理器时，它始终都会运行且结果不会被缓存。\n\n对比一下：\n\n```\n// 属性写法，结果会被缓存\nstore.getters.depletedProducts\n\
    \n// 方法写法，结果不缓存\nstore.getters.getProductById(5)\n```\n\n### 使用 Mutations 改变状态\n\
    \nVuex 架构的一个重要方面是组件永远不会直接修改状态。这样做会导致应用状态出现诡异的 Bug 和不一致性。\n\n相反，在 Vuex store 中更改状态的方法是通过提交（commit）一个\
    \ `mutation`。对于熟悉 Redux 的人来说，这些类似于 `reducers`。\n\n这里是一个增加存储 `state` 中 `count`\
    \ 变量的 mutation 示例：\n\n```javascript\nexport default new Vuex.Store({\n  state:{\n\
    \    count: 1\n  },\n  mutations: {\n    increment(state) {\n      state.count++\n\
    \    }\n  }\n})\n```\n\n你不能直接调用 mutation 处理器。相反，你通过像这样“提交 mutation”来触发它：\n\n```javascript\n\
    methods: {\n  updateCount() {\n    this.$store.commit('increment');\n  }\n}\n\
    ```\n\n你也可以向 mutation 传递参数：\n\n```javascript\n// store.js\nmutations: {\n  incrementBy(state,\
    \ n) {\n    state.count += n;\n  }\n}\n```\n\n```javascript\n// component\nupdateCount()\
    \ {\n  this.$store.commit('incrementBy', 25);\n}\n```\n\n在上面的示例中，我们向 mutation\
    \ 传递了一个整数，用于增加计数。你也可以传递对象作为参数。这样，你就可以轻松地包含多个字段，而无需重载你的 mutation 处理器：\n\n```javascript\n\
    // store.js\nmutations: {\n  incrementBy(state, payload) {\n    state.count +=\
    \ payload.amount;\n  }\n}\n```\n\n```javascript\n// component\nupdateCount() {\n\
    \  this.$store.commit('incrementBy', { amount: 25 });\n}\n```\n\n你也可以执行类似这样的“对象风格提交”（object-style\
    \ commit）：\n\n```javascript\nstore.commit({\n  type: 'incrementBy',\n  amount:\
    \ 25\n})\n```\n\nmutation 处理器保持不变。\n\n### `mapMutations` 辅助函数\n\n类似于 `mapState`\
    \ 和 `mapGetters`，你也可以使用 `mapMutations` 辅助函数来减少 mutation 处理器的模板代码：\n\n```javascript\n\
    import { mapMutations } from  'vuex'\n\nexport default{\n  methods: {\n    ...mapMutations([\n\
    \      'increment', // 映射到 this.increment()\n      'incrementBy' // 映射到 this.incrementBy(amount)\n\
    \    ])\n  }\n}\n```\n\n最后一点，mutation 处理器必须是同步的。你可以尝试编写异步 mutation 函数，但你以后会发现这会导致不必要的复杂性。让我们来看\
    \ actions 吧。\n\n### Actions\n\nActions 是本身不改变状态的函数。相反，它们在执行某些逻辑（通常是异步的）之后提交 mutations。这里是一个\
    \ action 的简单示例：\n\n```javascript\n//..\nactions: {\n  increment(context) {\n \
    \   context.commit('increment');\n  }\n}\n```\n\nAction 处理器接收一个 `context` 对象作为第一个参数，这允许我们访问\
    \ store 的属性和方法。例如：\n\n* `context.commit`: 提交一个 mutation\n* `context.state`: 访问\
    \ state\n* `context.getters`: 访问 getters\n\n你也可以使用“参数解构”（argument destructing）来提取代码所需的\
    \ store 属性。例如：\n\n```javascript\nactions: {\n  increment({ commit }) {\n    commit('increment');\n\
    \  }\n}\n```\n\n如上所述，actions 是异步的。这里有一个示例：\n\n```javascript\nactions: {\n  incrementAsync:\
    \ async({ commit }) => {\n    return await setTimeout(() => { commit('increment')\
    \ }, 1000);\n  }\n}\n```\n\n在这个示例中，mutation 在 1000 毫秒后提交。\n\n和 mutations 一样，action\
    \ 处理器不是直接调用的，而是通过 store 上的专用 `dispatch` 方法调用的，如下：\n\n```javascript\nstore.dispatch('incrementAsync')\n\
    \n// 带有 payload 的 dispatch\nstore.dispatch('incrementBy', { amount: 25})\n\n//\
    \ 带有对象的 dispatch\nstore.dispatch({\n  type: 'incrementBy',\n  amount: 25\n})\n\
    ```\n\n你可以在组件中这样 dispatch 一个 action：\n\n```javascript\nthis.$store.dispatch('increment')\n\
    ```\n\n### `mapActions` 辅助函数\n\n或者，你可以使用 `mapActions` 辅助函数将 action 处理器分配给本地方法：\n\
    \n```javascript\nimport { mapActions } from  'vuex'\n\nexport default {\n  //..\n\
    \  methods: {\n    ...mapActions([\n      'incrementBy', // 将 this.increment(amount)\
    \ 映射到 this.$store.dispatch(increment)\n      'incrementAsync', // 将 this.incrementAsync()\
    \ 映射到 this.$store.dispatch(incrementAsync)\n      add: 'increment' // 映射 this.dispatch(increment)\n\
    \    ])\n  }\n}\n```\n\n"
