  trans: "\n\n使用 CLI 生成的 Vue 项目具有遵循最佳实践的预定义结构。如果你选择安装任何额外的插件（如 Vue router），CLI 还会创建使用和配置这些库所需的文件。\n\
    \n让我们来看下使用默认预设时，Vue 项目中重要的文件和文件夹。\n\n*   `public`。此文件夹包含 `index.html` 和 `favicon.ico`\
    \ 等公共文件。放置在此处的任何静态资源都会被直接复制，而不会经过 `webpack` 处理。\n*   `src`。此文件夹包含项目的源代码文件。大部分工作将在此完成。\n\
    *   `src/assets`。此文件夹包含项目的资源，如 `logo.png`。\n*   `src/components`。此文件夹包含 Vue 组件。\n\
    *   `src/App.vue`。这是项目的根 Vue 组件。\n*   `src/main.js`。这是项目的主文件，用于启动 Vue 应用。\n* \
    \  `babel.config.js`。这是 `Babel` 的配置文件。\n*   `package.json`。此文件包含项目依赖项列表，以及 `ESLint`、`PostCSS`\
    \ 和支持的浏览器的配置选项。\n*   `node_modules`。此文件夹包含已安装的 `npm` 包。\n\n这是项目结构的结构图：\n\n![Project\
    \ anatomy](img/vue-cli-2.png)\n\n## Vue CLI 插件\n\nVue CLI v3 在设计时考虑了插件架构。在本节中，我们将介绍插件是什么以及如何在项目中安装它们。我们还将查看一些流行的插件，它们可以通过自动安装所需的库并进行各种设置来帮助添加高级功能——而这些操作通常情况下需要手动完成。\n\
    \n### 什么是 Vue 插件\n\nCLI 插件只是为你的 Vue 项目提供额外功能的 `npm` 包。`vue-cli-service` 二进制文件会自动解析并加载\
    \ `package.json` 文件中列出的所有插件。\n\nVue CLI 3 项目的基础配置是 `webpack` 和 `Babel`。所有其他功能都可以通过插件添加。\n\
    \nVue 团队提供了官方插件，以及社区开发的社区插件。官方插件名称以 `@vue/cli-plugin-` 开头，社区插件名称以 `vue-cli-plugin-`\
    \ 开头。\n\n官方 Vue CLI 3 插件包括：\n\n*   Typescript\n*   PWA\n*   Vuex\n*   Vue Router\n\
    *   ESLint\n*   单元测试等\n\n### 如何添加 Vue 插件\n\n插件要么在创建项目时自动安装，要么稍后由开发者显式安装。\n\n你可以在初始化项目时在项目中安装许多内置插件，并在项目的任何时候使用\
    \ `vue add my-plugin` 命令在项目中安装任何其他额外插件。\n\n你还可以安装带有预设的插件，并将你喜欢的插件分组为可重用的预设，以后可以作为其他项目的基准。\n\
    \n### 一些实 Vue 插件\n\n你可能会发现许多 Vue CLI 插件对你的下一个项目有用。例如，Vuetify UI 库作为插件可用](https://github.com/vuetifyjs/vue-cli-plugin-vuetify)，同样的\
    \ [Storybook](https://github.com/storybooks/vue-cli-plugin-storybook)。你还可以使用 [Electron\
    \ Builder 插件](https://github.com/nklayman/vue-cli-plugin-electron-builder) 快速基于\
    \ Electron 搭建出一个 Vue 项目。\n\n我还写了几个供你使用的插件：\n\n*   [vue-cli-plugin-nuxt](https://www.npmjs.com/package/vue-cli-plugin-nuxt)：一个用于使用\
    \ `Nuxt.js` 快速创建通用 Vue 应用的 Vue CLI 插件。\n*   [vue-cli-plugin-bootstrap](https://www.npmjs.com/package/vue-cli-plugin-bootstrap)：一个为项目添加\
    \ Bootstrap 4 的 Vue CLI 插件。\n\n如果你想了解更多关于插件的信息，请查看 Vue Mastery 上的这篇佳文：[适用于 Vue\
    \ 项目的 5 个 Vue CLI 3 插件](https://medium.com/vue-mastery/5-vue-cli-3-plugins-for-your-vue-project-df5af357d076)。\n\
    \n## 关于 webpack？\n\n`webpack` 被 Vue CLI 抽象了，它提供了访问和修改 `webpack` 配置的不同 API。\n\n\
    Vue CLI 的大部分项目配置都被抽象为插件并在运行时合并到基础配置中。但在某些情况下，你可能想手动调整项目的 `webpack` 配置。在这种情况下，你可以：\n\
    \n*   在项目根目录下创建一个 `vue.config.js` 文件，然后在 `configureWebpack` 选项中进行任何配置：\n\n```javascript\n\
    module.exports = {\n  configureWebpack: {\n    // 在此处进行自定义配置\n  }\n}\n```\n\n\
    *   使用如 [webpack-chain](https://neutrino.js.org/webpack-chain.html) 等工具修改 `webpack`\
    \ 配置\n\n你可以在此处了解更多关于使用 Vue CLI 和 webpack 的信息](https://cli.vuejs.org/guide/webpack.html)。\n\
    \n## Vue CLI UI\n\n现在让我们来看 [Vue CLI UI](https://cli.vuejs.org/guide/creating-a-project.html#using-the-gui)，涵盖了如何启动它以及用于图形用户界面创建和管理项目的视图。\n\
    \nVue CLI v3 提供了一个现代 Web 界面，允许你在不使用终端命令的情况下创建和管理项目。你可以如下所示启动 UI：\n\n```bash\n\
    vue ui\n```\n\nUI 应该可以在 [`localhost:8000`](http://localhost:8000) 。\n\n![Project\
    \ Manager](img/vue-cli-3.png)\n\n你可以从 *Create* 标签创建一个新项目。浏览你想创建项目的位置，然后点击 *+ Create\
    \ new project* 按钮。\n\n![Create a project](img/vue-cli-4.png)\n\n接下来，你将被带到一个新界面，在其中你需要输入项目的详细信息，如名称、项目位置、包管理器以及是否想要初始化\
    \ Git 仓库。\n\n![Create a project](img/vue-cli-5.png)\n\n接下来，你将被带到 *Presets* 标签，你可以在那里为项目指定预设。你可以选择：\n\
    \n*   *Default preset*：带有 Babel 和 ESLint 插件的默认预设\n*   *Manual*：手动选择插件\n*   *Remote\
    \ preset*：使用来自 Git 仓库的远程预设\n\n让我们继续使用默认预设：\n\n![Select a preset](img/vue-cli-6.png)\n\
    \n### 预设 (Presets)\n\n预设是插件和配置的关联。\n\n接下来，你可以点击 *Create Project* 按钮开始生成项目。将被带到一个到一个界面，显示项目生成的进度。\n\
    \n接下来，你将被带到项目仪表板——你可以使用右上角的 *Customize* 按钮添加小部件，之后它们会自动保存。\n\n![Project dashboard](img/vue-cli-7.png)\n\
    \n在仪表板的左侧，你可以找到不同的页面：\n\n*   `Plugins`：添加新的 Vue CLI 插件\n*   `Dependencies`：管理包\n\
    *   `Configuration`：配置工具\n*   `Tasks`：运行脚本\n\n切换到 *Tasks* 页面。\n\n![Project tasks](img/vue-cli-8.png)\n\
    \n接下来，点击 *serve* 按钮然后点击 *Run task* 按钮来运行你的项目。\n\n![Run task](img/vue-cli-9.png)\n\
    \n你可以使用 *Stop task* 按钮停止项目服务。你还可以从此界面打开应用程序并查看有关项目的信息，例如资源、模块和依赖的大小、速度统计等。\n\n\
    ![App statistics](img/vue-cli-10.png)\n\n## 总结\n\n在本文中，我们概述了新版本的 Vue CLI，它提供了一系列对开发者友的功能，例如交互式项目脚手架、集成前端生态系统中最佳工具的官方插件集合，以及用于创建和管理\
    \ Vue.js 项目的完整图形用户界面。\n\n"
- fmt: "\nThe `CLI` is a powerful tool in the hands of Vue developers, but in cases\
    \ when you don’t need all of its features, it might be preferable to use Vue.js\
    \ in your project without the CLI. You can see how to do this in our tutorial\
    \ *[Getting up and Running with the Vue.js 2.0 Framework](https://www.sitepoint.com/up-and-running-vue-js-2-0/)*.\n\
    \n# Chapter 4: A Beginner’s Guide to Working With Components in Vue\n\n### by\
    \ Kingsley Silas\n\nOne of the great things about working with Vue is its component-based\
    \ approach to building user interfaces. This allows you to break your application\
    \ into smaller, reusable pieces (components) which you can then use to build out\
    \ a more complicated structure.\n\nIn this guide, I’ll offer you a high-level\
    \ introduction to working with components in Vue. I’ll look at how to create components,\
    \ how to pass data between components (via both `props` and an event bus) and\
    \ how to use Vue’s `<slot>` element to render additional content within a component.\n\
    \nEach example will be accompanied by a runnable CodePen demo.\n\n## How to Create\
    \ Components in Vue\n\nComponents are essentially reusable Vue instances with\
    \ a name. There are various ways to create components within a Vue application.\
    \ For example, in a small- to medium-sized project you can use the [Vue.component](https://vuejs.org/v2/api/#Vue-component)\
    \ method to register a global component, like so:\n\n```\nVue.component('my-counter',\
    \ {\n  data() {\n    return {\n      count: 0\n    }\n  },\n  template: `<div>{{\
    \ count }}</div>`\n})\n\nnew Vue({ el: '#app' })\n```\n\nThe name of the component\
    \ is `my-counter`. It can be used like so:\n\n```\n<div id=\"app\">\n  <my-counter></my-counter>\n\
    </>\n```\n\nWhen naming your component, you can choose kebab case (`my-custom-component`)\
    \ or Pascal case (`MyCustomComponent`). You can use either variation when referencing\
    \ your component from within a template, but when referencing it directly in the\
    \ DOM (as in the example above), only the kebab case tag name is valid.\n\nYou\
    \ might also notice that, in the example above, `data` is a function which returns\
    \ an object literal (as opposed to being an object literal itself). This is so\
    \ that each instance of the component receives its own `data` object and doesn’t\
    \ have to share one global instance with all other instances.\n\nThere are several\
    \ ways to define a component template. Above we are using a template literal,\
    \ but we could also use a `<script tag>` marked with `text/x-template` or an in-DOM\
    \ template. You can read more about [the different ways of defining templates\
    \ here](https://medium.com/js-dojo/7-ways-to-define-a-component-template-in-vuejs-c04e0c72900d).\n\
    \n### Single-file Components\n\nIn more complex projects, global components can\
    \ quickly become unwieldy. In such cases, it makes sense to craft your application\
    \ to use single-file components. As the name suggests, these are single files\
    \ with a `.vue` extension, which contain a `<template>`, `<script>` and `<style>`\
    \ section.\n\nFor our example above, an `App` component might look like this:\n\
    \n```\n<template>\n  <div id=\"app\">\n    <my-counter></my-counter>\n  </div>\n\
    </template>\n\n<script>\nimport myCounter from './components/myCounter.vue'\n\n\
    export default {\n  name: 'app',\n  components: { myCounter }\n}\n</script>\n\n\
    <style></style>\n```\n\nAnd a `MyCounter` component might look like this:\n\n\
    ```\n<template>\n  <div>{{ count }}</div>\n</template>\n\n<script>\nexport default\
    \ {\n  name: 'my-counter',\n  data() {\n    return {\n      count: 0\n    }\n\
    \  }\n}\n</script>\n\n<style></style>\n```\n\nAs you can see, when using single-file\
    \ components, it’s possible to import and use these directly within the components\
    \ where they’re needed.\n\nIn this guide, I’ll present all of the examples using\
    \ the `Vue.component()` method of registering a component.\n\nUsing single-file\
    \ components generally involves a build step (for example, with Vue CLI). If this\
    \ is something you’d like to find out more about, please check out “A Beginner’s\
    \ Guide to Vue CLI” in this Vue series.\n\n## Passing Data to Components Via Props\n\
    \n`Props` enable us to pass data from a parent component to child component. This\
    \ makes it possible for our components to be in smaller chunks to handle specific\
    \ functionalities. For example, if we have a blog component we might want to display\
    \ information such as the author’s details, post details (title, body and images)\
    \ and comments.\n\nWe can break these into child components, so that each component\
    \ handles specific data, making the component tree look like this:\n\n```\n<BlogPost>\n\
    \  <AuthorDetails></AuthorDetails>\n  <PostDetails></PostDetails>\n  <Comments></Comments>\n\
    </BlogPost>\n```\n\nIf you’re still not convinced about the benefits of using\
    \ components, take a moment to realize how useful this kind of composition can\
    \ be. If you were to revisit this code in the future, it would be immediately\
    \ obvious how the page is structured and where (that is, in which component) you\
    \ should look for which functionality. This declarative way of composing an interface\
    \ also makes it much easier for someone who isn’t familiar with a codebase to\
    \ dive in and become productive quickly.\n\nSince all the data will be passed\
    \ from the parent component, it can look like this:\n\n```\nnew Vue({\n  el: '#app',\n\
    \  data() {\n    return {\n      author: {\n        name: 'John Doe',\n      \
    \  email: 'jdoe@example.com'\n      }\n    }\n  }\n})\n```\n\nIn the above component,\
    \ we have the author details and post information defined. Next, we have to create\
    \ the child component. Let’s call the child component `author-detail`. So our\
    \ HTML template will look like this:\n\n```\n<div id=\"app\">\n  <author-detail\
    \ :owner=\"author\"></author-detail>\n</div>\n```\n\nWe’re passing the child component\
    \ the `author` object as props with the name `owner`. It’s important to note the\
    \ difference here. In the child component, `owner` is the name of the prop with\
    \ which we receive the data from the parent component. The data we want to receive\
    \ is called `author`, which we’ve defined in our parent component.\n\nTo have\
    \ access to this data, we need to declare the `props` in the `author-detail` component:\n\
    \n```\nVue.component('author-detail', {\n  template: `\n    <div>\n      <h2>{{\
    \ owner.name }}</h2>\n      <p>{{ owner.email }}</p>\n    </div>\n  `,\n  props:\
    \ ['owner']\n})\n```\n\nWe can also enable validation when passing props, to make\
    \ sure the right data is passed. This is similar to [PropTypes](https://reactjs.org/docs/typechecking-with-proypes.html)\
    \ in React. To enable validation in the above example, change our component to\
    \ look like this:\n\n```\nVue.component('author-detail', {\n  template: `\n  \
    \  <div>\n      <h2>{{ owner.name }}</h2>\n      <p>{{ owner.email }}</p>\n  \
    \  </div>\n  `,\n  props: {\n    owner: {\n      type: Object,\n      required:\
    \ true\n    }\n  }\n})\n```\n\nIf we pass the wrong prop type, you’ll see an error\
    \ in your console that looks like what I have below:\n\n```\n\"[Vue warn]: Invalid\
    \ prop: type check failed for prop 'text'. Expected Boolean, got String.\n(found\
    \ in component <>)\"\n```\n\nThere’s an [official guide in the Vue docs](https://vuejs.org/v2/guide/components-props.html#Prop-Validation)\
    \ that you can use to learn about prop validation.\n\n#### Live Code\n\nSee the\
    \ Pen [Vue Comets - Props](https://codepen.io/SitePoint/pen/NegVgK/).\n\n## Communicating\
    \ From a Child to Parent Component via an Event Bus\n\n[Events](https://vuejs.org/v2/guide/events.html)\
    \ are handled by creating wrapper methods that are triggered when the chosen event\
    \ takes place. By way of a refresher, let’s build on our original counter example,\
    \ so that it increases each time a button is clicked.\n\nThis is what our component\
    \ should look like:\n\n```\nnew Vue({\n  el: '#app',\n  data() {\n    return {\n\
    \      count: 0\n    }\n  },\n  methods: {\n    increment() {\n      this.count++\n\
    \    }\n  }\n})\n```\n\nAnd our template:\n\n```\n<div id=\"app\">\n  {{ count\
    \ }}\n  <div>\n    <button @click=\"increment\">+</button>\n  </div>\n</div>\n\
    ```\n"
