    \ 的 `<script tag>` 或内 DOM 模板。你可以在这里阅读更多关于[定义模板的不同方法](https://medium.com/js-dojo/7-ways-to-define-a-component-template-in-vuejs-c04e0c72900d)。\n\
    \n### 单文件组件\n\n在更复杂的项目中，全局组件会迅速变得难以管理。在这种情况下，构建你的应用程序使用单文件组件是有意义的。正如名称所示，这些是具有\
    \ `.vue` 扩展名的单文件，包含 `<template>`、`<script>` 和 `<style>` 部分。\n\n对于我们上面的示例，一个 `App`\
