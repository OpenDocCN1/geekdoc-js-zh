    It should also be noted that using Vuex in such a simple app is total overkill.
    However, in another article—*Build a Shopping List App with Vue, Vuex and Bootstrap
    Vue*—I’ll build a more complicated app to demonstrate a more real-world scenario,
    as well as some of Vuex’s more advanced features.


    # Chapter 3: A Beginner’s Guide to Vue CLI


    ## by Ahmed Bouchefra


    When building a new Vue app, the best way to get up and running quickly is to
    use [Vue CLI](https://cli.vuejs.org/). This is a command-line utility that allows
    you to choose from a range of build tools, which it will then install and configure
    for you. It will also scaffold out your project, providing you with a pre-configured
    starting point that you can build on, rather than starting everything from scratch.


    The most recent version of Vue CLI is version 3. It provides a new experience
    for Vue developers and helps them start developing Vue apps without dealing with
    the complex configuration of tools like `webpack`. At the same time, it can be
    configured and extended with plugins for advanced use cases.


    Vue CLI v3 is a complete system for rapid Vue.js development and prototyping.
    It’s composed of different components, such as the [CLI service](https://cli.vuejs.org/guide/cli-service.html),
    [CLI plugins](https://cli.vuejs.org/guide/plugins-and-presets.html#plugins) and
    recently a [web UI](https://cli.vuejs.org/guide/creating-a-project.html#using-the-gui)
    that allows developers to perform tasks via an easy-to-use interface.


    Throughout this article, I’ll introduce the latest version of Vue CLI and its
    new features. I’ll demonstrate how to install the latest version of Vue CLI and
    how to create, serve and build an example project.


    ## Vue CLI v3 Installation and Requirements


    In this section, we’ll look at the requirements needed for Vue CLI v3 and how
    to install it.


    ### Requirements


    Let’s start with the requirements. Vue CLI v3 requires Node.js 8.9+, but v8.11.0+
    is recommended.


    You can install the latest version of Node.js in various ways:


    * By downloading the binaries for your system from the [official website](https://nodejs.org).

    * By using the official package manager for your system.

    * Using a version manager. This is probably the easiest way, as it allows you
    to manage multiple versions of Node on the same machine. If you’d like to find
    out more about this approach, please see our quick tip [Installing Multiple Versions
    of Node.js Using nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).


    Vue creator, Evan You, described version 3 of the CLI as a “completely different
    beast” from its predecessor. As such, it’s important to uninstall any previous
    version of the CLI (that is, 2.x.x) before preceding with this tutorial.


    If the `vue-cli` package is installed globally on your system, you can remove
    it by running the following command:


    ```

    npm uninstall vue-cli -g

    ```


    ### Installing Vue CLI v3


    You can now install Vue CLI v3 by simply running the following command from your
    terminal:


    ```

    npm install -g @vue/cli

    ```


    #### Fixing Permissions


    If you find yourself needing to add `sudo` before your command in macOS or Debian-based
    systems, or to use an administrator CMD prompt in Windows in order to install
    packages globally, then you should fix your permissions. The npm site has [a guide
    on how to do this](https://docs.npmjs.com/resolving-eacces-permissions-errors-when-installing-packages-globally),
    or just use a version manager and you avoid the problem completely.


    After successfully installing the CLI, you’ll be able to access the `vue` executable
    in your terminal.


    For example, you can list all the available commands by executing the `vue` command:


    ```

    vue

    ```


    You can check the version you have installed by running:


    ```

    vue --version

    $ 3.2.1

    ```


    ## Creating a Vue Project


    After installing Vue CLI, let’s now look at how we can use it to quickly scaffold
    complete Vue projects with a modern front-end toolset.


    Using Vue CLI, you can create or generate a new Vue app by running the following
    command in your terminal:


    ```

    vue create example-vue-project

    ```


    #### Naming a Project


    `example-vue-project` is the name of the project. You can obviously choose any
    valid name for your project.


    The CLI will prompt you for the preset you want to use for your project. One option
    is to select the default preset which installs two plugins: Babel for transpiling
    modern JavaScript, and ESLint for ensuring code quality. Or you can manually select
    the features needed for your project from a set of official plugins. These include:


    * [Babel](https://github.com/vuejs/vue-cli/tree/dev/packages/@vue/cli-plugin-babel)

    * [TypeScript](https://github.com/vuejs/vue-cli/tree/dev/packages/@vue/cli-plugin-typescript)

    * [Progressive Web App support](https://github.com/vuejs/vue-cli/tree/dev/packages/@vue/cli-plugin-pwa)

    * [Vue Router](https://github.com/vuejs/vue-router)

    * [Vuex](https://github.com/vuejs/vuex) (Vue’s official state management library)

    * CSS Pre-processors ([PostCSS](https://postcss.org/), [Sass](https://sass-lang.com/),
    [Less](https://less-lang.org/), [Stylus](https://stylus.com/))

    * Linter/Formatter ([ESLint](https://eslint.org/) and [Prettier](https://prettier.io/))

    * Unit Testing ([Mocha](https://mocha.org/) or [Jest](https://jestjs.io/))

    * E2E Testing ([Cypress](https://www.cypress.io/) or [Nightwatch](https://nightwatch.dev/))


    Whatever you choose, the CLI will download the appropriate libraries and configure
    the project. If you choose to manually select, at the end of the prompts you’ll
    also have the option to save your selections as a preset so you can reuse it in
    future projects.


    Now let’s look at the other scripts for serving the project (using a webpack development
    server and hot module reloading) and building the project for production.


    Navigate inside your project’s folder:


    ```

    cd example-vue-project

    ```


    Next, run the following command to serve your project:


    ```

    npm run serve

    ```


    The command will allow you to run a local development server from the [http://localhost:8080](http://localhost:8080)
    address. If you use your web browser to navigate to this address, you should see
    the following page:


    ![Welcome to Your Vue.js App](Images/vue-cli.png)


    The development server supports features like hot code reloading, which means
    you don’t need to stop and start your server every time you make any changes to
    your project’s source code. It will even preserve the state of your app!


    And when you’ve finished developing your project, you can use the following command
    to build a production bundle:


    ```

    npm run build

    ```


    This will output everything to a `dist` folder within your project. You can [read
    more about deployment here](https://cli.vuejs.org/guide/deployment.html).


    ### What is the Vue CLI Service?


    The [CLI Service](https://cli.vuejs.org/guide/cli-service.html) is a run-time
    dependency (`@vue/cli-service`) that abstracts webpack and provides default configurations.
    It can be upgraded, configured and extended with plugins.


    It provides multiple scripts for working with Vue projects, such as the `serve`,
    `build` and `inspect` scripts.


    We’ve seen the `serve` and `build` scripts in action already. The `inspect` script
    allows you to inspect the webpack config in a project with `vue-cli-service`.
    Try it out:


    ```

    vue inspect

    ```


    As you can see, that produces a lot of output. Later on we’ll see how to tweak
    the webpack config in a Vue CLI project.


    ### The Project Anatomy

