  trans: "\n\n`CLI` 是 Vue 开发者手中功能强大的工具，但在你不需要它的所有功能的情况下，在项目中使用不带 CLI 的 Vue.js 可能是更好的选择。你可以在我们的教程\
    \ *[快速上手：Vue.js 2.0 框架的入门与运行](https://www.sitepoint.com/up-and-running-vue-js-2-0/)*\
    \ 中看到如何做到。\n\n# 第 4 章：Vue 组件开发初学者指南\n\n### 作者：Kingsley Silas\n\n使用 Vue 的伟大之处之一在于它采用了基于组件的构建界面构建方法。这允许你将应用程序拆分为更小的、可重用的部分（组件），然后你可以使用这些部分来构建更复杂的结构。\n\
    \n在本指南中，我将为你提供一个关于在 Vue 中处理组件的层层级介绍。我将介绍如何创建组件、如何在组件之间传递数据（通过 `props` 和事件总线），以及如何使用\
    \ Vue 的 `<slot>` 元素在组件内部渲染额外内容。\n\n每个示例都将配有一个可运行的 CodePen 演示。\n\n## 如何在 Vue 中创建组件\n\
    \n组件本质上是带有名称的可复用 Vue 实例。在 Vue 应用中创建组件有多种方法。例如，在一个小型中项目中，你可以使用 [Vue.component](https://vuejs.org/v2/api/#Vue-component)\
    \ 方法来注册全局组件，如下所示：\n\n```\nVue.component('my-counter', {\n  data() {\n    return\
    \ {\n      count: 0\n    }\n  },\n  template: `<div>{{ count }}</div>`\n})\n\n\
    new Vue({ el: '#app' })\n```\n\n组件的名称为 `my-counter`。它可以这样使用：\n\n```\n<div id=\"\
    app\">\n  <my-counter></my-counter>\n</div>\n```\n\n在命名组件时，你可以选择短横线命名法（`my-custom-component`）或帕斯卡命名法（`MyCustomComponent`）。在模板内部引用组件时，可以使用这两种变体，但在\
    \ DOM 中直接引用时（如上例所示），只有短横线类型的标签名是有效的。\n\n你可能还会注意到，在上面的示例中，`data` 是一个返回对象字面量的函数（而不是本身\
    \ true 对象字面量）。这样做是为了确保组件的每个实例都能接收自己的 `data` 对象，而不需要与所有其他实例共享一个全局实例。\n\n定义组件模板有多种方法。我们在上面使用了模板字面量，但也可以使用标记为\
    \ `text/x-template` 的 `<script tag>` 或内 DOM 模板。你可以在这里阅读更多关于[定义模板的不同方法](https://medium.com/js-dojo/7-ways-to-define-a-component-template-in-vuejs-c04e0c72900d)。\n\
    \n### 单文件组件\n\n在更复杂的项目中，全局组件会迅速变得难以管理。在这种情况下，构建你的应用程序使用单文件组件是有意义的。正如名称所示，这些是具有\
    \ `.vue` 扩展名的单文件，包含 `<template>`、`<script>` 和 `<style>` 部分。\n\n对于我们上面的示例，一个 `App`\
    \ 组件可能如下：\n\n```\n<template>\n  <div id=\"app\">\n    <my-counter></my-counter>\n\
    \  </div>\n</template>\n\n<script>\nimport myCounter from './components/myCounter.vue'\n\
    \nexport default {\n  name: 'app',\n  components: { myCounter }\n}\n</script>\n\
    \n<style></style>\n```\n\n而一个 `MyCounter` 组件可能如下：\n\n```\n<template>\n  <div>{{\
    \ count }}</div>\n</template>\n\n<script>\nexport default {\n  name: 'my-counter',\n\
    \  data() {\n    return {\n      count: 0\n    }\n  }\n}\n</script>\n\n<style></style>\n\
    ```\n\n如你所见，当使用单文件组件时，可以在需要它们的组件中直接导入并使用它们。\n\n在本指南中，我将展示所有使用 `Vue.component()`\
    \ 方法注册组件的示例。\n\n使用单文件组件通常涉及一个构建步骤（例如，使用 Vue CLI）。如果你想了解更多相关信息，请查看此 Vue 系列中的“Vue\
    \ CLI 初学者指南”。\n\n## 通过 Props 向组件传递数据\n\n`Props` 允许我们把数据从父组件传递到子组件。这使得我们的组件能够分成更小的块来处理特定的功能。例如，如果我们有一个博客组件，我们可能想要显示诸如作者详细信息、帖子详情（标题、正文和图片）以及评论。\n\
    \n我们可以将这些拆分为子组件，以便每个组件处理特定数据，使组件树看起来如下：\n\n```\n<BlogPost>\n  <AuthorDetails></AuthorDetails>\n\
