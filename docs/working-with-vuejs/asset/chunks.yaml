    \n## 使用插槽在组件中嵌套内容\n\n在到目前为止看到的所有示例中，组件都是自闭合元素。然而，为了创建可以以有用方式组合在一起的组件，我们能够像处理 HTML\
    \ 元素那样将它们嵌套在彼此内部。\n\n如果你尝试使用带有闭合标签的组件并在内部放入内容，你会发现 Vue 只是吞噬了这些内容。组件开始标签和结束标签之间的任何内容都将被替换为组件自身的渲染输出：\n\
    \n```\n<div id=\"app\">\n  <author-detail :owner=\"author\">\n    <p>这些内容将被替换</p>\n\
    \  </author-detail>\n</div>\n```\n\n幸运的是，[Vue 的插槽](https://vuejs.org/v2/guide/components-slots.html)\
    \ 使得向组件传递任意值成为可能。可以是从父组件到子组件的任何 DOM 元素。让我们看看它们是如何工作的。\n\n我们组件的脚本部分看起来如下：\n\n```\n\
    Vue.component('list', {\n  template: '#list'\n})\n\nnew Vue({\n  el: \"#app\"\n\
    })\n```\n\n那么模板将看起来如下：\n\n```html\n<div id=\"app\">\n  <h2>插槽</h2>\n  <list>\n\
    \    <h4>我是第一个插槽</h4>\n  </list>\n  <list>\n    <h4>我是第二个插槽</h4>\n  </list>\n\
    </div>\n\n<script type=\"text/x-template\" id=\"list\">\n  <div>\n    <h3>子组件</h3>\n\
    \    <slot></slot>\n  </div>\n</script>\n```\n\n`<slot>` 标签是来自父组件内容的占位符。\n\n##\
    \ 第 5 章：表单入门指南\n\n表单是 Web 应用程序不可或缺的一部分。在本教程中，我将演示如何处理表单。我们将从创建一个简单的表单并查看如何处理输入开始。我们将查看修饰符（modifiers），它们允许我们更改浏览器行为，以及过滤器（filters），它们允许我们格式化输出。最后我们将使用\
    \ [VeeValidate](https://baian.github.io/vee-validate/) 插件来实现表单验证。每个部分都将配有一个可运行的\
    \ CodePen。\n\n### 使用 v-model 进行双向绑定\n\nVue 提供了一种双向绑定功能，使用户输入的内容与数据模型保持同步。这是通过使用\
    \ [v-model](https://vuejs.org/v2/api/#v-model) 指令实现的，例如 `v-model=\"entry\"`。\n\
    \n在数据模型中，你需要以下内容：\n\n```\ndata() {\n  return {\n    entry: 3\n  }\n}\n```\n\n\
    那么我们的模板看起来如下：\n\n```html\n<div id=\"app\">\n  <h2>Vue 表单</h2>\n  <h2>{{ entry\
    \ }}</h2>\n  <input type=\"text\" v-model=\"entry\" />\n</div>\n```\n\n`v-model`\
    \ 指令结合了 [v-bind](https://vuejs.org/v2/api/#v-bind) 和 [v-on:input](https://vuejs.org/v2/api/#v-on)\
    \ 的功能，为表单输入提供双向数据绑定。上面的代码也可以写成这样：\n\n```html\n<div id=\"app\">\n  <h2>Vue 表单</h2>\n\
    \  <h2>输入: {{ entry }}</h2>\n  <input type=\"text\"\n     v-bind:value=\"entry\"\
    \n     v-on:input=\"entry=$event.target.value\"\n  />\n</div>\n```\n\n"
