    \ I really look forward to using it in more SSR projects and exploring all of\
    \ its capabilities.\n\n# Chapter 9: Optimize the Performance of a Vue App with\
    \ Async Components\n\n### by Michiel Mulders\n\n**Single-page applications sometimes\
    \ cop a little flack for their slow initial load. This is because traditionally,\
    \ the server will send a large bundle of JavaScript to the client, which must\
    \ be downloaded and parsed before anything is displayed on the screen. As you\
    \ can imagine, as your app grows in size, this can become more and more problematic.**\n\
    \nLuckily, when building a Vue application using Vue CLI (which uses webpack under\
    \ the hood), there are a number of measures one can take to counteract this. In\
    \ this article, I’ll demonstrate how make use of both asynchronous components\
    \ and webpack’s code-splitting functionality to load in parts of the page after\
    \ the app’s initial render. This will keep the initial load time to a minimum\
    \ and give your app a snappier feel.\n\nTo follow this tutorial, you need a basic\
