    \ of the selected items. Using the above method, this checkout box will be included\
    \ in the initial bundle, although we only need the component when the user clicks\
    \ the checkout button. It’s even possible that the user navigates through the\
    \ website without ever clicking the checkout button, meaning that it doesn’t make\
    \ sense to waste resources on loading this potentially unused component.\n\nTo\
