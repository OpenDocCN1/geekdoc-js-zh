- fmt: "\nA Vue project generated with the CLI has a predefined structure that adheres\
    \ to best practices. If you choose to install any extra plugins (such as the Vue\
    \ router), the CLI will also create the files necessary to use and configure these\
    \ libraries.\n\nLet’s take a look at the important files and folders in a Vue\
    \ project when using the default preset.\n\n*   `public`. This folder contains\
    \ public files like `index.html` and `favicon.ico`. Any static assets placed here\
    \ will simply be copied and not go through `webpack`.\n*   `src`. This folder\
    \ contains the source files for your project. Most work will be done here.\n*\
    \   `src/assets`. This folder contains the project’s assets such as `logo.png`.\n\
    *   `src/components`. This folder contains the Vue components.\n*   `src/App.vue`.\
    \ This is the main Vue component of the project.\n*   `src/main.js`. This is the\
    \ main project file which bootstraps the Vue application.\n*   `babel.config.js`.\
    \ This is a configuration file for `Babel`.\n*   `package.json`. This file contains\
    \ a list of the project’s dependencies, as well as the configuration options for\
    \ `ESLint`, `PostCSS` and supported browsers.\n*   `node_modules`. This folder\
    \ contains the installed `npm` packages.\n\nThis is a screenshot of the project’s\
    \ anatomy:\n\n![Project anatomy](Images/vue-cli-2.png)\n\n## Vue CLI Plugins\n\
    \nVue CLI v3 is designed with a plugin architecture in mind. In this section,\
    \ we’ll look at what plugins are and how to install them in your projects. We’ll\
    \ also look at some popular plugins that can help add advanced features by automatically\
    \ installing the required libraries and making various settings—all of which would\
    \ otherwise have to be done manually.\n\n### What a Vue Plugin Is\n\nCLI Plugins\
    \ are just `npm` packages that provide additional features to your Vue project.\
    \ The `vue-cli-service` binary automatically resolves and loads all plugins listed\
    \ in the `package.json` file.\n\nThe base configuration for a Vue CLI 3 project\
    \ is `webpack` and `Babel`. All the other features can be added via plugins.\n\
    \nThere are official plugins provided by the Vue team and community plugins developed\
    \ by the community. Official plugin names start with `@vue/cli-plugin-`, and community\
    \ plugin names start with `vue-cli-plugin-`.\n\nOfficial Vue CLI 3 plugins include:\n\
    \n*   Typescript\n*   PWA\n*   Vuex\n*   Vue Router\n*   ESLint\n*   Unit testing\
    \ etc.\n\n### How to Add a Vue Plugin\n\nPlugins are either automatically installed\
    \ when creating the project or explicitly installed later by the developer.\n\n\
    You can install many built-in plugins in a project when initializing your project,\
    \ and install any other additional plugins in the project using the `vue add my-plugin`\
    \ command at any point of your project.\n\nYou can also install plugins with presets,\
    \ and group your favorite plugins as reusable presets that you can use later as\
    \ the base for other projects.\n\n### Some Useful Vue Plugins\n\nThere are many\
    \ Vue CLI plugins that you might find useful for your next projects. For example,\
    \ the [Vuetify UI library is available as a plugin](https://github.com/vuetifyjs/vue-cli-plugin-vuetify),\
    \ as is [Storybook](https://github.com/storybooks/vue-cli-plugin-storybook). You\
    \ can also use the [Electron Builder plugin](https://github.com/nklayman/vue-cli-plugin-electron-builder)\
    \ to quickly scaffold out a Vue project based on Electron.\n\nI’ve also written\
    \ a couple of plugins which you can make use of:\n\n*   [vue-cli-plugin-nuxt](https://www.npmjs.com/package/vue-cli-plugin-nuxt):\
    \ a Vue CLI plugin for quickly creating a universal Vue application with `Nuxt.js`.\n\
    *   [vue-cli-plugin-bootstrap](https://www.npmjs.com/package/vue-cli-plugin-bootstrap):\
    \ a Vue CLI plugin for adding Bootstrap 4 to your project\n\nIf you’d like to\
    \ find out more about plugins, check out this great article on Vue Mastery: [5\
    \ Vue CLI 3 plugins for your Vue project](https://medium.com/vue-mastery/5-vue-cli-3-plugins-for-your-vue-project-df5af357d076).\n\
    \n## What About webpack?\n\n`webpack` is abstracted away by the Vue CLI and the\
    \ different APIs it provides to access and mutate the `webpack` configuration.\n\
    \nMost project configuration for Vue CLI is abstracted into plugins and is merged\
    \ into the base configuration at runtime. But in some situations you might want\
    \ to manually tweak the `webpack` configuration for your project. In that case,\
    \ you can either:\n\n*   Create a `vue.config.js` file in your project root and\
    \ then make any configuration within a `configureWebpack` option:\n\n```javascript\n\
    module.exports = {\n  configureWebpack: {\n    // custom config here\n  }\n}\n\
    ```\n\n*   Mutate the `webpack` configuration using tools like [webpack-chain](https://neutrino.js.org/webpack-chain.html)\n\
    \nYou can find out [more about working with Vue CLI and webpack here](https://cli.vuejs.org/guide/webpack.html).\n\
    \n## Vue CLI UI\n\nLet’s now look at the [Vue CLI UI](https://cli.vuejs.org/guide/creating-a-project.html#using-the-gui),\
    \ covering how to launch it and the different views used to create and manage\
    \ projects a graphical user interface.\n\nVue CLI v3 provides a modern web interface\
    \ that allows you to create and manage projects without using terminal commands.\
    \ You can launch the UI as follows:\n\n```bash\nvue ui\n```\n\nThe UI should be\
    \ available at [http://localhost:8000](http://localhost:8000).\n\n![Project Manager](Images/vue-cli-3.png)\n\
    \nYou create a new project from the *Create* tab. Browse for the location where\
    \ you want to create your project, then click on the *+ Create new project* button.\n\
    \n![Create a project](Images/vue-cli-4.png)\n\nNext, you’ll be taken to a new\
    \ interface where you need to enter details about your project such as the name,\
    \ the project’s location, the package manager and whether or not you want to initialize\
    \ a Git repository.\n\n![Create a project](Images/vue-cli-5.png)\n\nNext, you’ll\
    \ be taken to the *Presets* tab where you can specify the preset for your project.\
    \ You can choose:\n\n*   *Default preset* for a default preset with Babel and\
    \ ESLint plugins\n*   *Manual* for manually selecting plugins\n*   *Remote preset*\
    \ for using a remote preset from a Git repository\n\nLet’s continue with the default\
    \ preset:\n\n![Select a preset](Images/vue-cli-6.png)\n\n### Presets\n\nA preset\
    \ is an association of plugins and configurations.\n\nNext, you can click on the\
    \ *Create Project* button to start generating your project. You’ll be taken to\
    \ a new interface that shows you the progress of your project generation.\n\n\
    Next, you’ll be taken to the project dashboard—where you can put widgets, which\
    \ you can add using the *Customize* button at the top right of the page, after\
    \ which they’ll be automatically saved.\n\n![Project dashboard](Images/vue-cli-7.png)\n\
    \nOn the left of the dashboard you can find different pages:\n\n*   `Plugins`\
    \ for adding new Vue CLI plugins\n*   `Dependencies` for managing packages\n*\
    \   `Configuration` for configuring the tools\n*   `Tasks` for running scripts\n\
    \nSwitch to the *Tasks* page.\n\n![Project tasks](Images/vue-cli-8.png)\n\nNext,\
    \ click on the *serve* button and then on the *Run task* button to serve your\
    \ project.\n\n![Run task](Images/vue-cli-9.png)\n\nYou can stop serving the project\
    \ using the *Stop task* button. You can also open the application from this interface\
    \ and see information about the project, such as the size of assets, modules and\
    \ dependencies, speed statistics and so on.\n\n![App statistics](Images/vue-cli-10.png)\n\
    \n## Conclusion\n\nIn this article we’ve seen an overview of the new Vue CLI version,\
    \ which provides a whole host of developer-friendly features such as interactive\
    \ project scaffolding, a rich collection of official plugins integrating the best\
    \ tools in the front-end ecosystem, and a full graphical user interface to create\
    \ and manage Vue.js projects.\n"
