  trans: "\n\n4. 然后，`Nuxt.js` 会在渲染页面之前调用 `asyncData()` 和 `fetch()` 方法来加载数据。[`asyncData()`\
    \ 方法](https://nuxtjs.org/guide/async-data/) 用于获取数据并在服务器端进行渲染，而[`fetch()` 方法](https://nuxtjs.org/api/pages-fetch/)\
    \ 则用于在渲染页面之前填充 store（仓库）。\n\n5. 在最后一步，页面（包含所有正确的数据）将完成渲染。\n\n这些操作在下方的架构图中得到了很好的展示，该图取自\
    \ Nuxt 文档：\n\n![Nuxt.js Schema](img/1498691466nuxt-schema.png \"Nuxt.js Schema\"\
    )\n\n# 使用 Nuxt.js 创建无服务器静态站点\n\n让我们动手写一些代码，并使用 `Nuxt.js` 创建一个简单的静态生成博客。我们假设文章是从\
    \ API 获取的，并将使用一个静态的 `JSON` 文件来模拟响应。\n\n为了跟上进度，需要具备 `Vue.js` 的基础知识。如果你是该框架的新手，可以查看\
    \ Jack Franklin 为 `Vue.js` 2.0 编写的优秀[入门指南](https://www.sitepoint.com/up-and-running-vue-js-2-0/)。我还将使用\
    \ `ES6` 语法，你可以在这里进行复习：[sitepoint.com/tag/es6/](https://www.sitepoint.com/tag/es6/)。\n\
    \n我们的最终应用看起来像这样：\n\n![Nuxt SSR Blog](img/nuxt1.png \"Nuxt SSR Blog\")\n\n## Github\n\
    \n本教程的所有代码可以在 [GitHub 这里](https://github.com/sitepoint-editors/nuxt-ssr-blog/)\
    \ 查看，你可以在[这里](https://nuxt-ssr-blog.firebaseapp.com/) 查看演示效果。\n\n## 应用安装与配置\n\n\
    开始使用 `Nuxt.js` 最简单的方法是使用 Nuxt 团队创建的模板。我们可以使用 [vue-cli](https://cli.vuejs.org/)\
    \ 快速将其安装到我们的项目 (`ssr-blog`) 中：\n\n```\nvue init nuxt/starter ssr-blog\n```\n\n\
    运行此命令后，会弹出一个提示框并询问你几个问题。你可以按 `Return` 键接受默认答案，也可以输入你自己的值。\n\n### 安装 vue-cli\n\n\
    如果你没有安装 `vue-cli`，必须先运行 `npm install -g @vue/cli` 来安装它。\n\n接下来，我们安装项目的依赖：\n\n\
    ```\ncd ssr-blog\nnpm install\n```\n\n现在我们可以启动应用了：\n\n```\nnpm run dev\n```\n\n\
    如果一切顺利，你应该能够访问 [`localhost:3000`](http://localhost:3000) 来查看 `Nuxt.js` 模板启动页。你甚至可以查看源代码，发现页面上生成的所有内容都是在服务器上渲染并作为\
    \ `HTML` 发送到浏览器的。\n\n接下来，我们可以在 `nuxt.config.js` 文件中进行一些简单的配置。我们将添加几个选项：\n\n```\n\
    // ./nuxt.config.js\n\nmodule.exports = {\n  /*\n   * 页面的头部信息 (Headers)\n   */\n\
    \  head: {\n    titleTemplate: '%s | Awesome JS SSR Blog',\n    // ...\n    link:\
    \ [\n      // ...\n      {\n        rel: 'stylesheet',\n        href: 'https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.2/css/bulma.min.css'\n\
    \      }\n    ]\n  },\n  // ...\n}\n```\n\n在上面的配置文件中，我们通过 `titleTemplate` 选项简单地指定应用程序使用的标题模板。在单个页面或布局中设置\
    \ `title` 选项将在渲染之前将 `title` 值注入到 `titleTemplate` 中的 `%s` 占位符中。\n\n我们引入了我目前喜欢的\
    \ CSS 框架 [Bulma](http://bulma.io/)，以利用一些预设样式。这是通过 `link` 选项实现的。\n\n### 理解 Headers\n\
    \nNuxt.js 使用 [vue-meta](https://github.com/declandewet/vue-meta) 来更新我们应用的 headers\
    \ 和 HTML 属性。因此，你可以查看它以更好地理解 headers 是如何设置的。\n\n现在我们可以通过添加博客的页面和功能来接下来的几个步骤。\n\n\
    ## 页面布局 (Page Layouts)\n\n首先，我们将为所有页面定义一个自定义的基础布局。我们可以通过更新 `layouts/default.vue`\
    \ 文件来扩展 Nuxt.js 的主布局：\n\n```\n<!-- ./layouts/default.vue -->\n\n<template>\n \
    \ <div>\n    <!-- 导航 -->\n    <nav class=\"navbar has-shadow\" role=\"navigation\"\
    \ aria-label=\"main navigation\">\n      <div class=\"container\">\n        <div\
    \ class=\"navbar-start\">\n          <nuxt-link to=\"/\" class=\"navbar-item\"\
    >\n            Awesome JS SSR Blog!\n          </nuxt-link>\n          <nuxt-link\
    \ active-class=\"is-active\" to=\"/\" class=\"navbar-item is-tab\" exact>首页</nuxt-link>\n\
    \          <nuxt-link active-class=\"is-active\" to=\"/about\" class=\"navbar-item\
    \ is-tab\" exact>关于</nuxt-link>\n        </div>\n      </div>\n    </nav>\n  \
    \  <!-- 导航结束 -->\n\n    <!-- 显示页面内容 -->\n    <nuxt />\n\n  </div>\n</template>\n\
    \n<style>\n  .main-content {\n    margin: 30px;\n  }\n</style>\n```\n\n在自定义布局中，我们使用\
    \ `<nuxt>`](https://nuxtjs.org/guide/components) 来查看它是如何工作的。也可以做更多事情，比如文档模板和错误布局，但我们的博客不需要。\n\
    \n### 简单页面与路由\n\nNuxt.js 中的页面是在 `pages` 目录中的单文件组件。每个 `.vue` 文件都会转换为应用程序路由。\n\n\
    ### 构建首页\n\n我们可以通过更新 `index.vue` 文件来添加首页：\n\n```\n<!-- ./pages/index.vue -->\n\
    <template>\n  <div>\n    <section class=\"hero-medium is-primary\">\n      <div\
    \ class=\"hero-body\">\n        <div class=\"container\">\n          <h1 class=\"\
    title\">\n            欢迎来到 SSR 博客\n          </h1>\n          <h2 class=\"subtitle\"\
    >\n            希望你喜欢这里。\n          </h2>\n        </div>\n      </div>\n    </section>\n\
    \  </div>\n</template>\n\n<script>\n  export default {\n    head: {\n      title:\
    \ '首页'\n    }\n  }\n</script>\n```\n\n如前所述，设置 `title` 选项将在页面之前将其值注入 `titleTemplate`。现在我们可以刷新应用以查看首页的更改。\n\
    \n### 构建关于页面\n\nNuxt.js 的另一个优点是它会监听 `pages` 目录内部的文件变化，因此在添加新页面时无需重启应用程序。\n\n我们可以通过添加一个简单的\
    \ `about.vue` 页面来测试这一点：\n\n```\n<!-- ./pages/about.vue -->\n<template>\n  <div\
    \ class=\"main-content\">\n    <div class=\"container\">\n      <h2 class=\"title\
    \ is-2\">关于这个网站</h2>\n      <p>这是一个使用 Nuxt.js 构建的 SSR 博客的示例。</p>\n      <br>\n\
    \      <h4 class=\"title is-4\">我们希望实现：</h4>\n      <ul>\n        <li>在框架中学习新功能。</li>\n\
    \        <li>理解服务器端渲染。</li>\n        <li>学习如何 SEO 优化博客。</li>\n        <li>探索 Vue\
    \ 的生态。</li>\n      </ul>\n    </div>\n  </div>\n</template>\n\n<script>\nexport\
    \ default {\n  head: {\n    title: '关于'\n  }\n}\n</script>\n```\n\n现在，我们可以访问 [`localhost:3000/about`](http://localhost:3000/about)\
    \ 来查看关于页面，而无需重启应用，这太棒了。\n\n### 在首页上显示博客文章\n\n"
