- fmt: "\nThis is hopefully simple enough. As you can see, we’re hooking into the\
    \ `onClick` event to trigger a custom `increase` method whenever the button is\
    \ clicked. The `increase` method is then incrementing our `count` property. Now\
    \ let’s expand the example to move the counter into a separate component and display\
    \ the count in the parent. Event buses come in handy when you want to communicate\
    \ from child component to parent. This is contrary to the default method of communication\
    \ which happens from parent to child. You can make use an event bus if your application\
    \ isn’t big enough to require the use of Vuex (you can read more about that in\
    \ “Getting Started with Vuex”).\n\nSo here’s what we want to do: the `count` will\
    \ be declared in the parent component and passed down to a child. Then in the\
    \ child component, we want to increment the value and also ensure that the value\
    \ is updated in the parent. App component will look like this:\n\n```\nnew Vue({\n\
    \  el: '#app',\n  data() {\n    return {\n      count: 0\n    }\n  }\n})\n```\n\
    \nThen in the child component, we want to receive the count via props and have\
    \ a method to increment it. We don’t want to display the value of count in the\
    \ child component. We only want to do increment from the child component and have\
    \ it reflected in the parent component:\n\n```\nVue.component('counter', {\n \
    \ template: `\n    <div>\n      <button @click=\"increment\"></button>\n    </div>\n\
    \  `,\n  props: {\n    count: {\n      type: Number,\n      required: true\n \
    \   }\n  },\n  methods: {\n    increment() {\n      this.count++\n    }\n  }\n\
    })\n```\n\nThen our template will look like this:\n\n```\n<div id=\"app\">\n \
    \ <h3>{{ count }}</h3>\n  <counter :count=\"count\" />\n</div>\n```\n\nIf you\
    \ try incrementing the value like that, it won’t work. To make it work we have\
    \ to emit an event from the child component and listen for it in the parent. First,\
    \ we create a new instance of `Vue` and set it to `eventBus`:\n\n```\nconst eventBus\
    \ = new Vue();\n```\n\nWe can now make use of the event bus in our component.\
    \ The child component will look like this:\n\n```\nVue.component('counter', {\n\
    \  props: {\n    count: {\n      type: Number,\n      required: true\n    }\n\
    \  },\n  methods: {\n    increment() {\n      this.count++\n      eventBus.$emit('count-incremented',\
    \ this.count)\n    }\n  },\n  template: `\n  <div>\n    <button @click=\"increment\"\
    ></button>\n  </div>\n  `\n})\n```\n\nThe event is emitted each time the `increment`\
    \ method is called. We have to listen for the event in the main component and\
    \ then set `count` to the value we obtained through the event:\n\n```\nnew Vue({\n\
    \  el: '#app',\n  data() {\n    return {\n      count: 0\n    }\n  },\n  created()\
    \ {\n    eventBus.$on('count-incremented', (count) => {\n      this.count = count\n\
    \    })\n  }\n})\n```\n\nNote that we’re making use of [Vue’s [created lifecycle\
    \ method](https://vuejs.org/v2/api/#created)] to hook into the component before\
    \ it’s mounted and to set up the event bus. Using an event bus is good if your\
    \ application isn’t complex, but please remember that as your application grows,\
    \ you may need to make use Vuex instead.\n\n#### Live Code\nSee the Pen [Vue Components\
    \ - Event Bus](https://codepen.io/SitePoint/pen/qLjz/)\n\n## Nesting Content in\
    \ Components Using Slots\n\nIn all the examples we’ve seen so far, the components\
    \ have been self-closing elements. However, in order to make components that can\
    \ be composed together in useful ways, we need to be able to nest them inside\
    \ one another as we do with HTML elements.\n\nIf you try using a component with\
    \ a closing tag and putting some content inside, you’ll see that Vue just swallows\
    \ this up. Anything within the component’s opening and closing tags is replaced\
    \ with the rendered output from the component itself:\n\n```\n<div id=\"app\"\
    >\n  <author-detail :owner=\"author\">\n    <p>This will be replaced</p>\n  </author-detail>\n\
    </div>\n```\n\nLuckily, [Vue’s slots](https://vuejs.org/v2/guide/components-slots.html)\
    \ make it possible to pass an arbitrary value to a component. This can be anything\
    \ from DOM elements from a parent component to a child component. Let’s see how\
    \ they work.\n\nThe script part of our components will look like this:\n\n```\n\
    Vue.component('list', {\n  template: '#list'\n})\n\nnew Vue({\n  el: \"#app\"\n\
    })\n```\n\nThen the templates will look like this:\n\n```\n<div id=\"app\">\n\
    \  <h2>Slots</h2>\n  <list>\n    <h4>I am the first slot</h4>\n  </list>\n  <list>\n\
    \    <h4>I am the second slot</h4>\n  </list>\n</div>\n\n<script type=\"text/x-template\"\
    \ id=\"list\">\n  <div>\n    <h3>Child Component</h3>\n    <slot></slot>\n  </div>\n\
    </script>\n```\n\nThe `<slot>` tag is a placeholder where the content from the\
    \ parent will be injected.\n\n## Chapter 5: A Beginner’s Guide to Working with\
    \ Forms\n\nForms are an integral part of web applications. In this tutorial, I’m\
    \ going to demonstrate how to work with forms. We’ll start off by creating a simple\
    \ form and looking at how to handle user input. We’ll then look at modifiers,\
    \ which allow us to change the browser’s behavior, and filters, which allow us\
    \ to format the output. We’ll finish off by implementing form validation using\
    \ [VeeValidate](https://baian.github.io/vee-validate/) plugin. Each section will\
    \ be accompanied by a runnable CodePen.\n\n### Two-way Data Binding with v-model\n\
    \nVue provides a two-way binding feature that keeps the inputs entered by your\
    \ user in sync with the data model. This is made possible by using the [v-model](https://vuejs.org/v2/api/#v-model)\
    \ directive like so: `v-model=\"entry\"`.\n\nIn the data model, you’ll need to\
    \ have the following:\n\n```\ndata() {\n  return {\n    entry: 3\n  }\n}\n```\n\
    \nThen our template will look like this:\n\n```html\n<div id=\"app\">\n  <h2>Vue\
    \ Form</h2>\n  <h2>{{ entry }}</h2>\n  <input type=\"text\" v-model=\"entry\"\
    \ />\n</div>\n```\n\nThe `v-model` directive combines the power of [v-bind](https://vuejs.org/v2/api/#v-bind)\
    \ and [v-on:input](https://vuejs.org/v2/api/#v-on) to provide you with the two-way\
    \ data binding for form inputs. The above snippet can also be written like this:\n\
    \n```html\n<div id=\"app\">\n  <h2>Vue Form</h2>\n  <h2>Input: {{ entry }}</h2>\n\
    \  <input type=\"text\"\n     v-bind:value=\"entry\"\n     v-on:input=\"entry=$event.target.value\"\
    \n  />\n</div>\n```\n"
