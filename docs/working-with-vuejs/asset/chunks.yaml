  trans: "\n\n太棒了，现在我们可以再次访问博客，确保所有路由和页面都能正常工作，还可以查看源代码以观察生成的 HTML。我们现在有了一个功能完备的服务渲染\
    \ JavaScript 应用。\n\n### 生成静态文件\n\n接下来，我们可以为我们的页面生成静态 HTML 文件。\n\n不过，我们需要进行一些微小的调整，因为\
    \ Nuxt.js 默认忽略动态路由。要为动态路由生成静态文件，我们需要在 `./nuxt.config.js` 文件中显式指定它们。\n\n我们将使用一个回调函数来返回动态路由列表：\n\
    \n```\n// ./nuxt.config.js\n\nmodule.exports = {\n  // ...\n  generate: {\n  \
    \  routes(callback) {\n      const posts = require('./posts.json')\n      let\
    \ routes = posts.map(post => `/post/${post.id}`)\n      callback(null, routes)\n\
    \    }\n  }\n}\n```\n\n你可以在[此处](https://nuxtjs.org/api/configuration-generate/)查看关于使用\
    \ `generate` 属性的完整文档。\n\n现在，我们可以运行此命令来生成所有路由：\n\n```\nnpm run generate\n```\n\n\
    Nuxt 将所有生成的静态文件保存到 `dist` 文件夹中。\n\n### 在 Firebase Hosting 上部署\n\n作为最后一步，我们可以利用\
    \ [Firebase Hosting](https://firebase.google.com/products/hosting/) 在几分钟内让我们的静态网站上线。此步骤假设你已经有一个\
    \ Google 账号。\n\n首先，如果你还没有 Firebase CLI，请先安装它：\n\n```\nnpm install -g firebase-tools\n\
    ```\n\n运行以下命令将你的本地机器连接到 Firebase 账户并获取对 Firebase 项目的访问权限：\n\n```\nfirebase login\n\
    ```\n\n这应该打开浏览器窗口并提示你登录。登录后，访问 [`console.firebase.google.com`](https://console.firebase.google.com)\
    \ 并点击 `Add project`。在打开的向导中进行相关选择。\n\n项目完成后，进入项目的托管页面 `https://console.firebase.google.com/project/<project\
    \ name>/hosting` 并完成 `Get started` 向导。\n\n然后，在你的 PC 上，从项目目录的根运行运行以下命令：\n\n```\n\
    firebase init\n```\n\n在弹出的向导中，选择“Hosting”。然后从选项列表中选择你新创建的项目。接下来，选择 `dist` 目录作为公共目录。选择将页面配置为单页应用（single-page\
    \ app），并在询问是否要覆盖 `dist/index.html` 时选择“No”。\n\nFirebase 将向你的项目写入几个配置文件，然后将网站发布到\
    \ `https://<project name>.firebaseapp.com`。本文的演示应用可以在 [nuxt-ssr-blog.firebaseapp.com](https://nuxt-ssr-blog.firebaseapp.com/)\
    \ 看到。\n\n如果你遇到任何问题，可以在 [Firebase 快速上手页面](https://firebase.google.com/docs/hosting/quickstart)\
    \ 上找到完整说明。\n\n## 结论\n\n在这篇文章中，我们学习了如何利用 Nuxt.js 使用 Vue.js 构建服务端渲染的 JavaScript\
    \ 应用。我们还学习了如何使用它的 `generate` 命令为页面生成静态文件，并通过像 Firebase Hosting 这样的服务快速部署。\n\n\
    Nuxt.js 框架非常棒。它甚至在[官方 Vue.js SSR GitBook](https://ssr.vuejs.org/en/#about-this-guide)\
    \ 中被推荐过。我非常期待在更多的 SSR 项目中使用它，并探索它的所有功能。\n\n# 第 9 章：使用异步组件优化 Vue 应用的性能\n\n####\
    \ 作者 Michiel Mulders\n\n单页应用有时会因为初始加载缓慢而受到一些批评。这是因为传统上，服务器会向客户端发送一个巨大的 JavaScript\
    \ 数据包，在屏幕上显示任何内容之前，必须下载并解析该包。正如你可以想象的，随着应用程序体积增大，这可能会变得越来越严重。\n\n幸运的是，在使用 Vue\
    \ CLI 构建 Vue 应用（它底层使用 webpack）时，可以采取许多措施来应对这一问题。在本文，我将演示如何同时利用异步组件和 webpack 的代码分割功能，在应用初始渲染后加载页面的部分。这将初始加载时间降至最低，并让你的应用感觉更加敏捷流畅。\n\
    \n要遵循本教程，你需要对 Vue.js 有基础了解，可选地了解 Node.js。\n\n## 异步组件\n\n在深入创建异步组件之前，让我们先看看通常是如何加载组件的。为了这一点，我们将使用一个非常简单的消息组件：\n\
    \n```\n<!-- Message.vue -->\n<template>\n  <h1>New message!</h1>\n</template>\n\
    ```\n\n现在我们已经创建了该组件，让我们将其加载到 `App.vue` 文件并显示它。我们只需要导入组件并将其添加到 `components` 选项中，这样就可以在模板中使用它了：\n\
    \n```\n<!-- App.vue -->\n<template>\n  <div>\n    <message></message>\n  </div>\n\
    </template>\n\n<script>\nimport Message from \"./Message\";\nexport default {\n\
    \  components: {\n    Message\n  }\n};\n</script>\n```\n\n但现在会发生什么？`Message` 组件将在应用程序加载时被加载，因此它被包含在初始加载中。\n\
    \n对于简单的应用来说，这可能不是一个大问题，但请考虑更复杂的情况，比如网商店。想象用户将商品添加到购物车，然后想要结算，于是点击结账按钮渲染出一个包含所有详情的框。使用上述方法，这个结账框将被包含在初始包中，尽管我们只在用户点击按钮时才需要该组件。\n\
    \n为了提高应用的效率，我们可以结合懒加载和代码分割技术。\n\n懒加载的核心是延迟组件的初始加载。你可以在 medium.com 等网站上看到懒加载的实际效果，图片在需要之前才加载。这很有用，因为我们不需要预先浪费资源加载某特定文章的所有图片，因为读者可能读到一半就跳过了文章。\n\
    \nwebpack 的代码分割功能允许你将代码拆分为多个包，这些包可以在以后根据需要或并行加载。它可以用于仅在使用某些特定代码时才加载这些代码。\n\n##\
    \ 动态导入\n\n幸运的是，Vue 通过所谓的“动态导入”（dynamic imports）提供了这种支持。该功能引入了一种新的、类似于函数的导入形式，它将返回一个包含请求的（Vue）组件的\
    \ `Promise`。由于导入是一个接收字符串的函数，我们可以执行强大的操作，例如使用表达式加载模块。动态导入从 Chrome 61 版本开始可用。关于它们的更多信息可以在[Google\
    \ 开发者网站](https://developers.google.com/web/updates/2017/11/dynamic-import)找到。\n\
    \n代码分割由 webpack、Rollup 或 Parcel 等打包器处理，它们理解动态导入语法并为每个动态导入模块创建一个单独的文件。我们稍后会在控制台的网络标签中看到这一点。在此之前，让我们看看静态导入和动态导入的区别：\n\
    \n```\n// 静态导入\nimport Message from \"./Message\";\n\n// 动态导入\nimport(\"./Message\"\
    ).then(Message => {\n  // Message 模块在这里可用...\n});\n```\n\n现在，让我们将这些知识应用到我们的 `Message`\
    \ 组件，我们将得到一个如下所示的 `App.vue` 组件：\n\n```\n<!-- App.vue -->\n<template>\n  <div>\n\
    \    <message></message>\n  </div>\n</template>\n\n<script>\nimport Message from\
    \ \"./Message\";\nexport default {\n  components: {\n    Message: () => import(\"\
    ./Message\")\n  }\n};\n</script>\n```\n\n"
- fmt: "\nAs you can see, the `import()` function will resolve a Promise that returns\
    \ the component, meaning that we’ve successfully loaded our component asynchronously.\
    \ If you take a look in your devtools’ network tab, you’ll notice a file called\
    \ `0.js` that contains your asynchronous component.\n\n![Code splitting webpack](Images/15431553231-network-tab-output.png\
    \ \"Async Component Code Splitting\")\n\n## Conditionally Loading Async Components\n\
    \nNow that we have a handle on asynchronous components, let’s truly harvest their\
    \ power by only loading them when they’re really needed. In the previous section\
    \ of this article, I explained the use case of a checkout box that’s only loaded\
    \ when the user hits the checkout button. Let’s build that out.\n\n### Project\
    \ Setup\n\nIf you don’t have Vue CLI installed, you should grab that now:\n\n\
    ```\nnpm i -g @vue/cli\n```\n\nNext, use the CLI to create a new project, selecting\
    \ the default preset when prompted:\n\n```\nvue create my-store\n```\n\nChange\
    \ into the project directory, then install the [ant-design-vue](https://www.npmjs.com/package/ant-design-vue)\
    \ library, which we’ll be using for styling:\n\n```\ncd my-store\nnpm i ant-design-vue\n\
    ```\n\nNext, import the Ant Design library in `src/main.js`:\n\n```\nimport 'ant-design-vue/dist/antd.css'\n\
    ```\n\nFinally, create two new components in `src/comonents`, `Checkout.vue` and\
    \ `Items.vue`:\n\n```\ntouch src/components/{Checkout.vue,Items.vue}\n```\n\n\
    ### Making the Store View\n\nOpen up `src/App.vue` and replace the code there\
    \ with the following:\n\n```\n<template>\n  <div id=\"app\">\n    <h1>{{ msg }}</h1>\n\
    \    <items></items>\n  </div\n</template>\n\n<script>\nimport items from \"./components/Items\"\
    \n\nexport default {\n  components: {\n    items\n  },\n  name: 'app',\n  data\
    \ () {\n    return {\n      msg: 'My Fancy T-Shirt Store'\n    }\n  }\n}\n</script>\n\
    \n<style>\n#app {\n  font-family: 'Avenir', Helvetica, Arial, sans-serif;\n  -webkit-font-smoothing:\
    \ antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-align: center;\n\
    \  color: #2c3e50;\n  margin-top: 60px;\n}\n\nh1, h2 {\n  font-weight: normal;\n\
    }\n\nul {\n  list-style-type: none;\n  padding: 0;\n}\n\nli {\n  display: inline-block;\n\
    \  margin: 0 10px;\n}\n\na {\n  color: #42b983;\n}\n</style>\n```\n\nThere’s nothing\
    \ fancy going on here. All we’re doing is displaying a message and rendering an\
    \ `<items>` component.\n\nNext, open up `src/components/Items.vue` and add the\
    \ following code:\n\n```\n<template>\n  <div>\n    <div style=\"padding: 20px;\"\
    >\n      <Row :gutter=\"16\">\n        <Col :span=\"24\" style=\"padding:5px\"\
    >\n          <Icon type=\"shopping-cart\" style=\"margin-right:5px\"/>{{shoppingList.length}}\n\
    \          <Button @click=\"show = true\" id=\"checkout\">Checkout</Button>\n\
    \        </Col>\n      </Row>\n    <div v-if=\"show\">\n      <Row :gutter=\"\
    16\" style=\"margin:0 400px 50px 400px\">\n        <checkout v-bind:shoppingList=\"\
    shoppingList\"></checkout>\n      </Row>\n    </div>\n    <div style=\"background-color:\
    \ #ececec; padding: 20px;\">\n      <Row :gutter=\"16\">\n        <Col :span=\"\
    6\" v-for=\"(item, key) in items\" v-bind:key\" style=\"padding:5px\">\n     \
    \     <Card v-bind:title=\"item.msg\" v-bind:key>\n            <Button type=\"\
    primary\" @click=\"addItem(key)\">${{item.price}}</Button>\n          </Card>\n\
    \        </Col>\n      </Row>\n    </div>\n  </div>\n</template>\n\n<script>\n\
    import { Card, Col, Row, Button } from 'ant-design-vue';\n\nexport default {\n\
    \  methods: {\n    addItem (key) {\n      if(!this.shoppingList.includes(key))\
    \ {\n        this.shoppingList.push(key);\n      }\n    }\n  },\n  components:\
    \ {\n    Card, Col, Row, Icon,\n    checkout: () => import('./Checkout')\n  },\n\
    \  data: () => ({\n    items: [\n      { msg: 'First Product', price: 9.99 },\n\
    \      { msg: 'Second Product', price: 19.99 },\n      { msg: 'Third Product',\
    \ price: 15.00 },\n      { msg: 'Fancy Shirt', price: 137.00 },\n      { msg:\
    \ 'More Fancy', price: 109.99 },\n      { msg: 'Extreme', price: 3.00 },\n   \
    \   { msg: 'Super Shirt', price: 109.99 },\n      { msg: 'Epic Shirt', price:\
    \ 3.00 },\n    ],\n    shoppingList: [],\n    show: false\n  })\n}\n</script>\n\
    <style>\n#checkout {\n  background-color:#e55242;\n  color:white;\n  margin-left:\
    \ 10px;\n}\n</style>\n```In this file, we’re displaying a shopping cart icon with\
    \ the current amount of purchased items. The items themselves are pulled from\
    \ an `items` array, declared as a data property. If you click on an item’s `Buy`\
    \ button, the `addItem` method is called, which will push the item in question\
    \ to a `shoppingList` array. In turn, this will increment the cart’s total.\n\n\
    We’ve also added a `Checkout` button to the page, and this is where things start\
    \ to get:\n\n```\n<Button @click=\"show = true\" id=\"checkout\">Checkout</Button>\n\
    ```\n\nWhen a user clicks on this button, we’re setting a parameter `show` to\
    \ be `true`. This `true` value is very important for the purpose of conditionally\
    \ loading our async component.\n\nA few lines below, you can find a `v-if` statement,\
    \ which only displays the content of the `<div>` when `show` is set to `true`.\
    \ This `<div>` tag contains the checkout component, which we only want to load\
    \ when the user has hit the checkout button.\n\nThe checkout component is loaded\
    \ asynchronously in the `components` option in the `<script>` section. The cool\
    \ thing here is that we can even pass arguments to the component via the `v-bind`\
    \ statement. As you can see, it’s relatively easy to create asynchronous components:\n\
    \n```\n<div v-if=\"show\">\n  <checkout v-bind:shoppingList=\"shoppingList\"></checkout>\n\
    </div>\n```\n\nLet’s quickly add the code for the `Checkout` component in `src/components/Checkout.vue`:\n\
    \n```\n<template>\n  <Card title=\"Checkout Items\" key=\"checkout\">\n    <p\
    \ v-for=\"(k, i) in this.shoppingList\" :key=\"i\">\n      Item: {{items[Number(k)].msg}}\
    \ for ${{items[Number(k)].price}}\n    </p>\n  </Card>\n</template>\n\n<script>\n\
    import { Card } from 'ant-design-vue';\n\nexport default {\n  props: ['shoppingList'],\n\
    \  components: {\n    Card\n  },\n  data: () => ({\n    items: [\n      { msg:\
    \ 'First Product', price: 9.99 },\n      { msg: 'Second Product', price: 19.99\
    \ },\n      { msg: 'Third Product', price: 15.00 },\n      { msg: 'Fancy Shirt',\
    \ price: 137.00 },\n      { msg: 'More Fancy', price: 109.99 },\n      { msg:\
    \ 'Extreme', price: 3.00 },\n      { msg: 'Super Shirt', price: 109.99 },\n  \
    \    { msg: 'Epic Shirt', price: 3.00 },\n    ]\n  })\n}\n</script>\n```\n\nHere\
    \ we’re looping over the props we receive as `shoppingList` and outputting them\
    \ to the screen.\n\nYou can run the app using the `npm run serve` command. Then\
    \ navigate to [http://localhost:8080/](http://localhost:8080/). If all has gone\
    \ according to plan, you should see something like what’s shown in the image below.\n\
    \n![Vue Webshop Demo](Images/15431556012-Webshop-example.png \"Vue.js Webshop\
    \ example\")\n\nTry clicking around the store with your network tab open to assure\
    \ yourself that the `Checkout` component is only loaded when you click the `Checkout`\
    \ button. You can also find [the code for this demo on GitHub](https://github.com/sitepoint-editors/shopping-cart-async).\n\
    \n## Async with Loading and Error Component\n\nIt’s even possible to define a\
    \ loading and/or error component for when the async component takes some time\
    \ to load or fails to load. It can be useful to show a loading animation, but\
    \ bear in mind this again slows down your application. An asynchronous component\
    \ should be small and fast to load. Here’s an example:\n\n```\nconst Message =\
    \ () => ({\n  component: import(\"./Message\"),\n  loading: LoadingAnimation,\n\
    \  error: ErrorComponent\n});\n```\n\n## Conclusion\n\nCreating and implementing\
    \ asynchronous components is very easy and should be part of your standard development\
    \ routine. From a UX perspective, it’s important to reduce the initial load time\
    \ as much as possible to maintain the user’s attention. Hopefully this tutorial\
    \ has assisted you with loading your own components asynchronously and applying\
    \ conditions to them to delay (lazy load) the load of the component.\n"
