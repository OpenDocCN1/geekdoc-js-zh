    \ 的值，并确保随着数据的变化，`GithubUserData` 组件能够保持更新。\n\n如果你觉得 `:data` 有点短且太神奇，也可以使用更长的 `v-bind`\
    \ 语法：\n\n```html\nv-bind:data=\"githubData[currentUsername]\"\n```\n\n两者是等价的，所以使用你喜欢的任何一种即可。\n\
    \n## 结论\n\n这样，我们的 GitHub 应用就处于非常好的状态！你可以在 GitHub 上找到[所有代码](https://github.com/sitepoint-editors/vue2-demo-project)，甚至查看[在线运行的应用程序](http://sitepoint-vue2-demo.surge.sh/)。\n\
    \n在开始学习 Vue 时我充满希望，因为我只听过好评，我很兴地说它确实符合了我的预期。使用 Vue 的感觉就像是将 React 的最佳部分与 Angular\
    \ 的最佳部分融合在一起。某些指令（如 `v-if`、`v-else`、`v-model` 等）非常容易上手（并且比在 React 的 JSX 语法中编写条件判断更容易理解），但\
    \ Vue 的组件系统感觉与 React 非常相似。\n\n我鼓励你将系统拆解成小的组件，总的来说，我觉得这是一个非常无缝的体验。我对比 Vue 团队的文档赞不绝口：它太棒了。指南非常出色，API\
    \ 参考详尽且易于导航，可以准确找到你想要的内容。\n\n# 第 2 章：入门 Vuex：新手指南\n\n### 作者：Michael Wanyoike\n\
    \n在单页应用中，`state`（状态）的概念涉及任何可以更改的数据。状态的示例可以是登录用户的详情，或者从 API 获取的数据。\n\n在单页应用中处理状态可能是一个棘手的过程。随着应用程序变得越来越大复杂，你会开始遇到这样的情况：某特定状态需要在多个组件中使用，或者你发现自己正在将状态通过不需要它的组件进行传递，仅仅为了把它传递到需要的地方。这被称为“属性层层传递”（prop\
    \ drilling），可能会导致某些难以维护的代码。\n\n[Vuex](https://vuex.vuejs.org/) 是 Vue 的官方状态管理解决方案。它的工作原理是建立一个中央存储来用于共享状态，并提供方法允许应用程序中的任何组件访问该状态。从本质上说，Vuex\
    \ 无论哪个函数触发了应用程序数据的更改，你的视图都能与应用程序数据保持一致。\n\n在篇文章中，我将为你提供 Vuex 的高级概述，并演示如何将其实现到简单的应用中。\n\
    \n## 购物车示例\n\n让我们考虑一个真实世界的示例来演示 Vuex 解决的问题。\n\n当你访问一个购物网站时，通常会有一个产品列表。每个产品都有一个“加入购物车”按钮，有时还有一个“剩余物品”标签，指示当前库存或你为指定产品可以订购的最大数量。每当购买一个产品时，该产品的当前库存就会减少。当这种情况发生时，“剩余物品”标签应该更新为正确的数字。当产品库存水平达到\
    \ 0 时，标签应显示为“缺货”。此外，“加入购物车”按钮应该被禁用或隐藏，以确保客户无法订购当前无库存的产品。\n\n现在问问你自己，你会如何实现这个。\n\
    \n## 使用本地状态构建计数器\n\n在本节中，我们将构建一个在本地跟踪状态的简单计数器。完成后，我将介绍 Vuex 的基本概念，然后查看如何使用 Vue\
    \ 的官方状态解决方案来重写计数器应用。\n\n### 先决条件\n\n在我们开始之前，我假设你：\n\n- 拥有 [Vue.js](https://www.sitepoint.com/getting-started-with-vue-js/)\
    \ 的基础知识\n- 熟悉 [ES6](https://www.sitepoint.com/tag/es6/) 和 [ES7](https://www.sitepoint.com/es2017-whats-new/)\
    \ 语言特性\n\n你需要一个不是 6.0 版本的最新 Node.js。在写作时，Node.js `v10.13.0` (LTS) 和 npm 版本 `6.4.1`\
    \ 是最新版本。如果你系统中已经没有安装合适的 Node 版本，我建议[使用版本管理器](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)）。\n\
    \n最后，你应该已安装最新版本的 [Vue CLI](https://cli.vuejs.org/)：\n\n```bash\nnpm install -g\
    \ @vue/cli\n```\n\n### 设置\n\n让 CLI 创建新项目：\n\n```bash\nvue create vuex-counter\n\
    ```\n\n向导将打开并引导你创建项目。选择*手动选择功能*并确保你选择了安装 Vuex。\n\n接下来，进入新目录并在 `src/components`\
    \ 文件夹中，将 `HelloWorld.vue` 重命名为 `Counter.vue`：\n\n```bash\ncd vuex-counter\nmv\
    \ src/components/HelloWorld.vue src/components/Counter.vue\n```\n\n最后，打开 `src/App.vue`\
    \ 并将现有代码替换为以下内容：\n\n"
- fmt: "\n```\n<template>\n  <div id=\"app\">\n    <h1>Vuex Counter</h1>\n    <Counter/>\n\
    \  </div>\n</template>\n\n<script>\nimport Counter from './components/Counter.vue'\n\
    \nexport default {\n  name: 'app',\n  components: {\n    Counter\n  }\n}\n</script>\n\
    ```\n\nYou can leave the styles as they are.\n\n### Creating the Counter\n\nLet’s\
    \ start off by initializing a count and outputting it to the page. We’ll also\
    \ inform the user whether the count is currently even or odd. Open up `src/components/Counter.vue`\
    \ and replace the code with the following:\n\n```\n<template>\n  <div>\n    <p>Clicked\
    \ {{ count }} times! Count is {{ parity }}.</p>\n  </div>\n</template>\n\n<script>\n\
    export default {\n  name: 'Counter',\n  data: function() {\n    return {\n   \
    \   count: 0\n    };\n  },\n  computed: {\n    parity: function() {\n      return\
    \ this.count % 2 === 0 ? 'even' : 'odd';\n    }\n  }\n}\n</script>\n```\n\nAs\
    \ you can see, we have one state variable called `count` and a computed function\
    \ called `parity` which returns the string `even` or `odd` depending on the whether\
    \ `count` is an odd or even number.\n\nTo see what we’ve got so far, start the\
    \ app from within the root folder by running `npm run serve` and navigate to [http://localhost:8080](http://localhost:8080).\n\
    \nFeel free to change the value of the counter to show that the correct output\
    \ for both `counter` and `parity` is displayed. When you’re satisfied, make sure\
    \ to reset it back to 0 before we proceed to the next step.\n\n### Incrementing\
    \ and Decrementing\n\nRight after the `computed` property in the `<script>` section\
    \ of `Counter.vue`, add this code:\n\n```\nmethods: {\n  increment: function ()\
    \ {\n    this.count++;\n  },\n  decrement: function () {\n    this.count--;\n\
    \  },\n  incrementIfOdd: function () {\n    if (this.parity === 'odd') {\n   \
    \   this.increment();\n    }\n  },\n  incrementAsync: function () {\n    setTimeout(()\
    \ => {\n      this.increment()\n    }, 1000)\n  }\n}\n```\n\nThe first two functions,\
    \ `increment` and `decrement`, are hopefully self-explanatory. The `incrementIfOdd`\
    \ function only executes if the value of `count` is an odd number, whereas `incrementAsync`\
    \ is an asynchronous function that performs an increment after one second.\n\n\
    In order to access these new methods from the template, we’ll need to define some\
    \ buttons. Insert the following after the template code which outputs the count\
    \ and parity:\n\n```\n<button @click=\"increment\" variant=\"success\">Increment</button>\n\
    <button @click=\"decrement\" variant=\"danger\">Decrement</button>\n<button @click=\"\
    incrementIfOdd\" variant=\"info\">Increment if Odd</button>\n<button @click=\"\
    incrementAsync\" variant=\"warning\">Increment Async</button>\n```\n\nAfter you’ve\
    \ saved, the browser should refresh automatically. Click all of the buttons to\
    \ ensure everything is working as expected.\n\n### Live Code\n\n[Vue Counter Using\
    \ Local State](https://codepen.io/SitePoint/pen/xQXNwm/) shows what you should\
    \ have ended up with.\n\nThe counter example is now complete. Let’s move and examine\
    \ the fundamentals of Vuex, before looking at how we would rewrite the counter\
    \ to implement them.\n\n## How Vuex Works\n\nBefore we go over the practical implementation,\
    \ it’s best that we acquire a basic grasp of how Vuex code is organized. If you’re\
    \ familiar with similar frameworks such as Redux, you shouldn’t find anything\
    \ too surprising here. If you haven’t dealt with any Flux-based state management\
    \ frameworks before, please pay close attention.\n\n### The Vuex Store\n\nThe\
    \ store provides a centralized repository for shared state in Vue apps. This is\
    \ what it looks like in its most basic form:\n\n```\n// src/store/index.js\n\n\
    import Vue from 'vue'\nimport Vuex from 'vuex'\n\nVue.use(Vuex)\n\nexport default\
    \ new Vuex.Store({\n  state: {\n    // put variables and collections here\n  },\n\
    \  mutations: {\n    // put sychronous functions for changing state e.g. add,\
    \ edit, delete\n  },\n  actions: {\n    // put asynchronous functions that can\
    \ call one or more mutation functions\n  }\n})\n```\n\nAfter defining your store,\
    \ you need to inject it into your Vue.js application like this:\n\n```\n// src/main.js\n\
    import store from './store'\n\nnew Vue({\n  store,\n  render: h => h(App)\n}).$mount('#app')\n\
    ```\n\nThis will make the injected store instance available to every component\
    \ in our application as `this.$store`.\n\n### Working with State\n\nAlso referred\
    \ to as the single state tree, this is simply an object that contains all front-end\
    \ application data. Vuex, just like Redux, operates using a single store. Application\
    \ data is organized in a tree-like structure. Its construction is quite simple.\
    \ Here’s an example:\n\n```\nstate: {\n  products: [],\n  count: 5,\n  loggedInUser:\
    \ {\n    name: 'John',\n    role: 'Admin'\n  }\n}\n```\n\nHere we have `products`\
    \ that we’ve initialized with an empty array, and `count`, which is initialized\
    \ with the value 5. We also have `loggedInUser`, which is a JavaScript object\
    \ literal containing multiple fields. State properties can contain any valid datatype\
    \ from Booleans, to arrays, to other objects.\n\nThere are multiple ways to display\
    \ state in our views. We can reference the store directly in our templates using\
    \ `$store`:\n\n```\n<template>\n  <p>{{ $store.state.count }}</p>\n</template>\n\
    ```\n\nOr we can return some store state from within a [computed property](https://vuejs.org/guide/computed.html):\n\
    \n```\n<template>\n  <p>{{ count }}</p>\n</template>\n\n<script>\nexport default\
    \ {\n  computed: {\n    count() {\n      return this.$store.state.count;\n   \
    \ }\n  }\n}\n</script>\n```\n\nSince Vuex stores are reactive, whenever the value\
    \ of `$store.state.count` changes, the view will change as well. All this happens\
    \ behind the scenes, making your code look simple and cleaner.\n\n### The `mapState`\
    \ Helper\n\nNow, suppose you have multiple states you want to display in your\
    \ views. Declaring a long list of computed properties can get verbose, so Vuex\
    \ provides a `mapState` helper. This can be used to generate computed properties\
    \ easily. Here’s an example:\n\n```\n<template>\n  <div>\n    <p>Welcome, {{ loggedInUser.name\
    \ }}.</p>\n    <p>Count is {{ count }}.</p>\n  </div>\n</template>\n\n<script>\n\
    import { mapState } from 'vuex';\n\nexport default {\n  computed: mapState({\n\
    \    count: state => state.count,\n    loggedInUser: state => state.loggedInUser\n\
    \  })\n}\n</script>\n```\n\nHere’s an even simpler alternative where we can pass\
    \ an array of strings to the `mapState` function:\n\n```javascript\nexport default\
    \ {\n  computed: mapState([\n    'count', 'loggedInUser'\n  ])\n}\n```\n\nThis\
    \ version of the code and the one above it do exactly the same. You should note\
    \ that `mapState` returns an object. If you want to use it with other computed\
    \ properties, you can use the spread operator](https://developer.mozilla.org/en-US/docs/Reference/Operators/Spread_syntax).\
    \ Here’s how:\n\n```javascript\ncomputed: {\n  ...mapState([\n    'count', 'loggedInUser'\n\
    \  ]),\n  parity: function() {\n    return this.count % 2 === 0 ? 'even' : 'odd'\n\
    \  }\n}\n```\n\n### Getters\n\nIn a Vuex store, getters are the equivalent to\
    \ Vue’s computed properties. They allow you to create derived state that can be\
    \ shared between different components. Here’s a quick example:\n\n```javascript\n\
    getters: {\n  depletedProducts: state => {\n    return state.products.filter(product\
    \ => product.stock <= 0)\n  }\n}\n```\n\nResults of `getter` handlers (when accessed\
    \ as properties) are cached and can be called as many times as you wish. They’re\
    \ also reactive to state changes. In other words, if the state it depends upon\
    \ changes, the `getter` function is automatically executed and the new result\
    \ is cached. Any component that has accessed a `getter` handler will get updated\
    \ instantly. This is how you can access a `getter` handler from a component:\n\
    \n```javascript\ncomputed: {\n  depletedProducts() {\n    return this.$store.getters.depletedProducts;\n\
    \  }\n}\n```\n\n#### The `mapGetters` Helper\n\nYou can simplify the `getters`\
    \ code by using the `mapGetters` helper:\n\n```javascript\nimport { mapGetters\
    \ } from 'vuex'\n\nexport default {\n  //..\n  computed: {\n    ...mapGetters([\n\
    \      'depletedProducts',\n      'anotherGetter'\n    ])\n  }\n}\n```\n"
