    \n1.  When the user initially visits the app, if the [`nuxtServerInit` action](https://nuxtjs.org/guide/vuex-store/#the-nuxtserverinit-action)\
    \ is defined in the store, Nuxt.js will call it and update the store.\n\n2.  Next,\
    \ it executes any existing [middleware](https://nuxtjs.org/guide/routing/#middleware)\
    \ for the page being visited. Nuxt checks the `nuxt.config.js` file first for\
    \ global middleware, then checks the matching [layout file](https://nuxtjs.org/guide/views#layouts)\
    \ (for the requested page), and finally checks the page and its children for middleware.\
    \ Middleware are prioritized in that order.\n\n3.  If the route being visited\
    \ is a dynamic route, and a `validate()` method exists for it, [the route is validated](https://nuxtjs.org/api/pages-validate)."
