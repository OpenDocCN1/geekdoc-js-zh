  md: "**It’s a Wrap**\n\nOne final function that’s nice to know about is wordwrap.\
    \ If you have a long\n\nstring of text that contains no particular formatting,\
    \ you can use wordwrap to\n\ninsert a character, such as new line character (\\\
    \\n), at a given interval. wordwrap\n\ntakes care not to break up words unless\
    \ you specifically tell it to. This can be\n\nparticularly useful for constructing\
    \ well-laid out email messages, as we’ll see in\n\nChapter 8.\n\n**How do I make\
    \ changes to the contents**\n\n**of a string?**\n\nPHP comes with a powerful collection\
    \ of string functions. With a first glance at\n\nthe manual\\[1\\], they may seem\
    \ simple, but with a little cunning there’s much you\n\ncan accomplish with them.\
    \ For example, PEAR::XML\\_HTMLSax\\[2\\] is a complete\n\nSAX parser for badly\
    \ formed XML (such as HTML). It works almost entirely\n\n*without* the use of\
    \ regular expressions, relying on functions like strpos and substr\n\nto do the\
    \ work.\n\n**Search and Replace**\n\nStarting with a simple example, let’s consider\
    \ the following code:\n\nFile: **3.php**\n\n<?php\n\n// Places part of a string\
    \ inside an HTML tag\n\nfunction addTag($text, $word, $tag)\n\n{\n\n $length =\
    \ strlen($word);\n\n $start = strpos($text, $word);\n\n $word = '<' . $tag . '>'\
    \ . $word . '</' . $tag . '>';\n\n return substr\\_replace($text, $word, $start,\
    \ $length);\n\n}\n\n$text = <<<EOD\n\nPHP (recursive acronym for \"PHP: Hypertext\
    \ Preprocessor\") is a\n\nwidely-used Open Source general-purpose scripting language\
    \ that\n\nis especially suited for Web development and can be embedded\n\n\\[1\\\
    ] http://www.php.net/strings\n\n\\[2\\] http://pear.php.net/package-info.php?package=XML\\\
    _HTMLSax\n\n149\n\nIt’s a Wrap"
