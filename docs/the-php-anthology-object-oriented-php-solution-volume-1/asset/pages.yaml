    \nhttp://www.example.com/news/index.php\n\nAdopting \n\nthat \n\napproach, \n\n\
    you \n\nwould \n\nlikely \n\nuse \n\nthe \n\nPHP \n\nvariable\n\n$\\_SERVER\\\
    ['PATH\\_INFO'\\] to obtain the script location, and choose a menu based\n\non\
    \ that.\n\nBut let’s move on with our single-script example that uses a URL suffix\
