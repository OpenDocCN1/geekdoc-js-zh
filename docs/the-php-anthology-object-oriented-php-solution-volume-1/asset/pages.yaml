  md: "Here is a simple example that lets us sort the results of a query by a table\
    \ column:\n\nFile: **11.php**** (excerpt)**\n\n// A query to select all articles\n\
    \n$sql = \"SELECT \\* FROM articles\";\n\n// Initialize $\\_GET\\['order'\\] if\
    \ it doesn't exist\n\nif (!isset($\\_GET\\['order'\\]))\n\n $\\_GET\\['order'\\\
    ] = FALSE;\n\n// Use a conditional switch to determine the order\n\nswitch ($\\\
    _GET\\['order'\\]) {\n\n case 'author':\n\n // Add to the $sql string\n\n $sql\
    \ .= \" ORDER BY author\";\n\n break;\n\n default:\n\n // Default sort by title\n\
    \n $sql .= \" ORDER BY title\";\n\n break;\n\n}\n\n// Run the query, identifying\
    \ the connection\n\nif (!$queryResource = mysql\\_query($sql, $dbConn)) {\n\n\
    \ trigger\\_error('Query error ' . mysql\\_error() . ' SQL: ' . $sql);\n\n}\n\n\
    ?>\n\n<table>\n\n<tr>\n\n<th><a href=\"<?php echo $\\_SERVER\\['PHP\\_SELF'\\\
    ]; ?>?order=title\"\n\n >Title</a></th>\n\n<th><a href=\"<?php echo $\\_SERVER\\\
    ['PHP\\_SELF'\\]; ?>?order=author\"\n\n >Author</a></th>\n\n</tr>\n\n<?php\n\n\
    while ($row = mysql\\_fetch\\_array($queryResource, MYSQL\\_ASSOC)) {\n\n echo\
    \ \"<tr>\\\\n\";\n\n echo \"<td>\" . $row\\['title'\\] . \"</td>\";\n\n echo \"\
    <td>\" . $row\\['author'\\] . \"</td>\";\n\n echo \"</tr>\\\\n\";\n\n}\n\n?>\n\
    \n</table>\n\nWithin the switch statement, I’ve generated part of the SQL statement\
