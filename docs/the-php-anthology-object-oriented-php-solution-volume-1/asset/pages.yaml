  md: "File: **8.php**\n\n<?php\n\n// Include DateMath class\n\nrequire\\_once 'DateTime/DateMath.php';\n\
    \n// Build an array for the next ten years\n\n$thisyear = date('Y');\n\n$years\
    \ = range($thisyear, $thisyear + 10);\n\n// Find the leap years\n\nforeach ($years\
    \ as $year) {\n\n $dateMath = new DateMath($year, 1, 1, 0, 0, 0);\n\n if (!$dateMath->isLeapYear())\
    \ {\n\n echo $year . ' is not a leap year<br/>';\n\n } else {\n\n echo $year .\
    \ ' is a leap year!<br/>';\n\n }\n\n}\n\n?>\n\nThis identifies which of the next\
    \ ten years are and are not leap years:\n\n2003 is not a leap year\n\n2004 is\
    \ a leap year!\n\n2005 is not a leap year\n\n2006 is not a leap year\n\n2007 is\
    \ not a leap year\n\n2008 is a leap year!\n\n2009 is not a leap year\n\n2010 is\
    \ not a leap year\n\n2011 is not a leap year\n\n2012 is a leap year!\n\n2013 is\
