  md: "March has 31 days\n\nApril has 30 days\n\nMay has 31 days\n\nJune has 30 days\n\
    \nJuly has 31 days\n\nAugust has 31 days\n\nSeptember has 30 days\n\nOctober has\
    \ 31 days\n\nNovember has 30 days\n\nDecember has 31 days\n\nNote that this method\
    \ will correctly report twenty-nine days in February when\n\nthe date stored in\
    \ DateMath occurs in a leap year. And *speaking* of leap years…\n\n**Leap Years**\n\
    \nNot all years are the same, which, if you had the misfortune to be born on Feb-\n\
    \nruary 29, you’ll know only too well; every four years there’s an extra day,\
    \ with\n\noccasional exceptions.³ To identify leap years, I can take advantage\
    \ of the\n\ndaysInMonth method to create a new method; this will examine February\
    \ and\n\nuse it to find out whether it occurs in a leap year:\n\nFile: **DateTime/DateMath.php****\
    \ (in ****SPLIB****) (excerpt)**\n\n /\\*\\*\n\n \\* Determines whether current\
    \ year is a leap year\n\n \\* @return boolean true if a leap year\n\n \\* @access\
    \ public\n\n \\*/\n\n function isLeapYear()\n\n {\n\n return date('L', $this->timeStamp);\n\
    \n }\n\nOnce again, we’re wrapping a convenient package around an obscure feature\
    \ of\n\nPHP’s date function.\n\nLet’s see how it works:\n\n3Years evenly divisible\
    \ by 4 are leap years, with the exception of years evenly divisible by 100 that\n\
    \nare *not* evenly divisible by 400. Therefore, the years 1700, 1800, 1900 and\
    \ 2100 are not leap years,\n\nbut 1600, 2000, and 2400 are leap years.\n\n185\n\
    \nLeap Years"
