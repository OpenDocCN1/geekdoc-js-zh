  md: "File: **DateTime/DateMath.php**** (in ****SPLIB****) (excerpt)**\n\n /\\*\\\
    *\n\n \\* Provides the number of days in the month\n\n \\* @return int number\
    \ of days in the month\n\n \\* @access public\n\n \\*/\n\n function daysInMonth()\n\
    \n {\n\n return date('t', $this->timeStamp);\n\n }\n\nHere, we simply rely again\
    \ on the PHP date function to do the hard work, but\n\nit’s good to have this\
    \ method available from our class—this makes it a complete\n\nsolution for common\
    \ date-related problems.\n\nLet’s put it to the test:\n\nFile: **7.php**\n\n<?php\n\
    \n// Include DateMath class\n\nrequire\\_once 'DateTime/DateMath.php';\n\n$months\
    \ = array(\n\n 'January' => 01,\n\n 'February' => 02,\n\n 'March' => 03,\n\n 'April'\
    \ => 04,\n\n 'May' => 05,\n\n 'June' => 06,\n\n 'July' => 07,\n\n 'August' =>\
    \ 08,\n\n 'September' => 09,\n\n 'October' => 10,\n\n 'November' => 11,\n\n 'December'\
    \ => 12);\n\nforeach ($months as $name => $num) {\n\n $dateMath = new DateMath(2003,\
    \ $num, 1, 0, 0, 0);\n\n echo $name . ' has ' . $dateMath->daysInMonth() . ' days<br/>';\n\
    \n}\n\n?>\n\nThis helps me remember that:\n\nJanuary has 31 days\n\nFebruary has\
    \ 28 days\n\nChapter 6: Dates and Times\n\n184"
