- img_proc: true
  md: 'to a file, which is very similar to connecting to a database; the process uses
    the


    fopen function to “connect”, and fclose to “disconnect.” Using fopen, the value


    returned is a PHP **file pointer**, known as the **handle** of the file. When
    you use


    fopen to connect to a file, you must specify the path to the file and a **mode**
    in


    which the file is to be accessed, such as r for read only.


    // Open a file for reading


    $fp = fopen($filename, ''r'');


    The various modes available are explained in the manual\[2\].


    ![](img/4aa42814ed6f04055a7211c9ee423453_136_0.png)


    **The Binary File Modifier**


    Unlike Linux, Windows differentiates between binary and ASCII files. An


    additional modifier, b can be used to identify binary files to PHP, so that


    they are dealt with correctly on Windows.


    // Open a binary file for reading


    $fp = fopen($filename, ''r**b**'');


    Even if the code you’re writing is currently used on a Unix-based system, it’s


    worth implementing the b modifier for binary files to ensure portability.


    The fread function could be used in older versions as a substitute for


    file\_get\_contents:


    File: **4.php**


    <?php


    // Variable to store the location of the file


    $location = ''demo/writeSecureScripts.html'';


    // Open the file handle for reading


    $fp = fopen($location, ''r'');


    // Read the complete file into a string


    $file = fread($fp, filesize($location));


    // Close the file handle


    fclose($fp);


    echo $file;


    ?>


    \[2\] http://www.php.net/fopen


    Chapter 4: Files


    116'
