    include\_path = ".:/home/username/pear/pear"


    For Windows users, the path is as follows:


    include\_path = ".;c:\\pear\\pear"


    Finally, to use the PEAR package manager from the command line, you need to


    set up some environment variables. For Windows users these can be automatically


    added to your Windows registry by right clicking on the file PEAR\_ENV.reg and


    choosing Run. They may also be manually configured as environment variables


    via the Windows Control Panel. Users with Unix-based systems can configure


    them to be set up every time you log in, by editing the file .profile in your


    home directory (/home/*username*):


    \# Envinment variables


    export PHP\_PEAR\_SYSCONF\_DIR=/home/username/pear


    export PHP\_PEAR\_INSTALL\_DIR=/home/username/pear/pear


    export PHP\_PEAR\_DOC\_DIR=/home/username/pear/pear/docs


    export PHP\_PEAR\_BIN\_DIR=/home/username/pear


    export PHP\_PEAR\_DATA\_DIR=/home/username/pear/pear/data


    export PHP\_PEAR\_TEST\_DIR=/home/username/pear/pear/tests


    export PHP\_PEAR\_PHP\_BIN=/usr/local/bin/php


    Finally, you need to add the PEAR command line script to your system path,


    which, on Windows, can be achieved through the System Control Panel applica-


    tion (on the *Advanced* tab, click Environment Variables), by appending ;c:\\pear


    to the PATH variable.


    On Unix-based systems, add the following to your .profile script:


    export PATH=$PATH;/home/username/pear


    Appendix D: Working with PEAR


    358'
