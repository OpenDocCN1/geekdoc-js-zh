  md: 'and end of a set of menu items that occupy the same


    level in the tree structure.


    One thing to note about the Menu classes is that they perform a full table scan


    on the menu table and fetch the entire contents in one go. Earlier I advised not


    to do full table scans, but in this particular instance it’s a choice between
    the


    lesser of two evils, the alternative method being to use many recursive queries,


    which will drastically slow your application’s performance.


    You need to be aware, however, that the more rows you have in your table, the


    more memory PHP will need to handle these classes. As menus don’t change


    frequently, you can get around this by using some form of caching—a subject


    we’ll discuss in Volume II, Chapter 5.


    Now that I’ve introduced you to the classes, the first thing is not to panic!
    Let’s


    look at each one with an example that will show you how easy these classes are


    to use.


    **Feeding the Birds**


