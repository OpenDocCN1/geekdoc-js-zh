  md: "One particularly nice feature of the popular Apache server is that, when presented\n\
    \nwith a URL like http://www.example.com/article.php/123/4, it’s smart enough\
    \ to\n\nrecognize that article.php is the filename and everything that follows\
    \ it\n\n(/123/4), which we’ll call the **URL suffix**, can be ignored. The trick,\
    \ of course,\n\nis to get PHP to see that URL suffix and read the values contained\
    \ therein.\n\nFortunately, while Apache is conveniently blind to the URL suffix,\
    \ PHP is not.\n\nPHP provides a few variables which can be useful to gather this\
    \ information,\n\nnamely \n\n$\\_SERVER\\['PATH\\_INFO'\\], \n\n$\\_SERVER\\['PHP\\\
    _SELF'\\],\n\n$\\_SERVER\\['REQUEST\\_URI'\\] and $\\_SERVER\\['SCRIPT\\_NAME'\\\
    ]. The following script\n\ndemonstrates them in action:\n\nFile: **18.php**\n\n\
    <?php\n\n// Examine some pre-defined variables\n\necho '$\\_SERVER\\[\\\\'PATH\\\
    _INFO\\\\'\\]: ' . @$\\_SERVER\\['PATH\\_INFO'\\] .\n\n '<br />';\n\necho '$\\\
    _SERVER\\[\\\\'PHP\\_SELF\\\\'\\]: ' . @$\\_SERVER\\['PHP\\_SELF'\\] .\n\n '<br\
    \ />';\n\necho '$\\_SERVER\\[\\\\'REQUEST\\_URI\\\\'\\]: ' . @$\\_SERVER\\['REQUEST\\\
    _URI'\\] .\n\n '<br />';\n\necho '$\\_SERVER\\[\\\\'SCRIPT\\_NAME\\\\'\\]: ' .\
    \ @$\\_SERVER\\['SCRIPT\\_NAME'\\] .\n\n '<br />';\n\n?>\n\nIf you put this file\
    \ on your server and load it as, say, http://www.example.com/php-\n\nanth/WebPageElements/18.php,\
    \ the output it produces is:\n\n$\\_SERVER\\['PATH\\_INFO'\\]: \n\n$\\_SERVER\\\
    ['PHP\\_SELF'\\]: /phpanth/WebPageElements/18.php\n\n$\\_SERVER\\['REQUEST\\_URI'\\\
    ]: /phpanth/WebPageElements/18.php\n\n$\\_SERVER\\['SCRIPT\\_NAME'\\]: /phpanth/WebPageElements/18.php\n\
    \nAt first glance, these variables aren’t especially inspiring. But look what\
    \ happens\n\nwhen we add a URL suffix and query string to the URL, such as http://www.ex-\n\
    \nample.com/phpanth/WebPageElements/18.php/this/is?a=test:\n\n$\\_SERVER\\['PATH\\\
    _INFO'\\]: /this/is\n\n$\\_SERVER\\['PHP\\_SELF'\\]: /phpanth/WebPageElements/18.php/this/is\n\
    \n$\\_SERVER\\['REQUEST\\_URI'\\]:\n\n /phpanth/WebPageElements/18.php/this/is?a=test\n\
    \n$\\_SERVER\\['SCRIPT\\_NAME'\\]: /phpanth/WebPageElements/18.php\n\n*Now* we’re\
    \ talking! In particular, $\\_SERVER\\['PATH\\_INFO'\\] looks like the best\n\n\
    place to grab the values hidden in the URL suffix. Unfortunately, when we imple-\n\
