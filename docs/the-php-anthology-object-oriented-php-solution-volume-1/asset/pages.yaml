  md: "File: **3.php**\n\n<?php\n\nerror\\_reporting(E\\_ALL); // Report all errors\n\
    \nerror\\_reporting(2047); // Report all errors\n\nerror\\_reporting(0); // Turn\
    \ off error reporting\n\n?>\n\nGenerally, you won’t need to change the error levels\
    \ beyond the examples above.\n\n**Which Error Reporting Level?**\n\nWhen developing\
    \ your code, always set the error level to its highest value, E\\_ALL (or\n\n\
    2047). This will inform you of all errors. In particular, it’ll display notices\
    \ that help you\n\nfind uninitialized variables—the source of many a logic error.\
    \ This error level will also\n\nensure maximum portability for others using your\
    \ code, who may prefer to run PHP at\n\nthis level and not see any error messages\
    \ generated by your work.\n\nThe best way to set this error level is in php.ini,\
    \ using the error\\_reporting setting.\n\nIf this is not possible, the next best\
    \ solution is to use a .htaccess file with the following\n\ncommand:\n\nphp\\\
    _value error\\_reporting 2047\n\nHowever you do it, it’s important to apply the\
    \ setting globally to all your code.\n\nRemember, too, that the simple fact that\
    \ you’ve told PHP not to report certain errors\n\ndoesn’t mean they aren’t happening!\
    \ Be careful when developing code and use full error\n\nreporting.\n\nAn important\
    \ thing to note is that the error reporting level applies to the in-built\n\n\
    PHP error handler, not to error handlers you define yourself (which we’ll be\n\
    \nlooking at shortly). In other words, you can switch off error reporting as far\
    \ as\n\nthe default PHP error reporting mechanism is concerned, while still catching\
    \ errors\n\nwith an error handler you’ve defined yourself.\n\nOne more mechanism\
    \ that is available for controlling error behavior is the **error**\n\n**suppression\
    \ operator**, @, which can be used to suppress error messages generated\n\nby\
    \ PHP functions and expressions. For example:\n\nFile: **4.php**\n\n<?php\n\n\
    // Use error reporting operator\n\nif (!**@**mysql\\_connect('localhost', 'wronguser',\
    \ 'wrongpassword')) {\n\n echo 'Error connecting to MySQL Server: ' . mysql\\\
    _error();\n\nChapter 10: Error Handling\n\n322"
