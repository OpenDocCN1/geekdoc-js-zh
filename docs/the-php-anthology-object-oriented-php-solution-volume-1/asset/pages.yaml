  md: "Now, to prove the point, let’s create some Message objects using our three\
    \ sub-\n\nclasses at random:\n\nFile: **14.php**** (excerpt)**\n\n$classNames\
    \ =\n\n array('PoliteMessage', 'TerseMessage', 'RudeMessage');\n\n$messages =\
    \ array();\n\nsrand((float)microtime() \\* 1000000); // Prepares random shuffle\n\
    \nfor ($i = 0; $i < 10; $i++) {\n\n shuffle($classNames);\n\n $messages\\[\\]\
    \ = new $classNames\\[0\\]();\n\n}\n\n$messageReader = new MessageReader($messages);\n\
    \n?>\n\nBy creating the array $classNames and then repeatedly shuffling it, we\
    \ can take\n\nthe first element of the array and use it to create a new object:\n\
    \n $messages\\[\\] = new $classNames\\[0\\]();\n\nThis is an example of a **variable\
    \ function**. The expression $classNames\\[0\\] is\n\nevaluated to determine the\
    \ name of the constructor (PoliteMessage,\n\nTerseMessage, or RudeMessage) to\
    \ call.\n\nFinally, the $messages array contains ten messages, randomly selected,\
    \ and is\n\npassed to the constructor of MessageReader on instantiation.\n\nHere’s\
    \ a sample result:\n\nYou look like \\*%&\\* today!\n\nHowzit?\n\nHow are you\
    \ today?\n\nHow are you today?\n\nHow are you today?\n\nYou look like \\*%&\\\
    * today!\n\nHow are you today?\n\nHow are you today?\n\nHowzit?\n\nHow are you\
    \ today?\n\nEach time we execute the script, the list is different.\n\nBecause\
    \ all the concrete message classes share the same getMethod function (i.e.\n\n\
    they implement the same interface), the MessageReader class is able to extract\n\
    \nthe data without knowing which particular type of message it’s dealing with.\
    \ The\n\nChapter 2: Object Oriented PHP\n\n62"
