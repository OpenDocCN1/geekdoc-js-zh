  md: 'E\_USER\_NOTICE to display on all pages of your site a


    message that states, “At 1PM today the site will be


    down for ten minutes due to routine maintenance.”


    Note that errors triggered at these levels may not be the only errors generated


    when your application executes. The PHP–generated error types, E\_PARSE,


    E\_ERROR, E\_WARNING, and E\_NOTICE will also be “in force” unless you specifically


    disable them, or suppress them with the error suppression operator. This means


    you can distinguish between “PHP level” errors and “application level” errors,


    which helps make error handling flexible.


    **Custom Error Handler**


    Now that you’re acquainted with PHP’s error levels and have seen the


    trigger\_error function in action, it’s time to look at how to implement a **custom**


    **error handler**.


    PHP provides you with the ability to specify your own error handler with which


    you can catch errors and respond to them as you choose, perhaps displaying a


    friendly message to your site’s visitors while updating an error log with a detailed


    message for your site’s administrators. The mechanism that allows you to do this


    is a PHP function that will be used as a **callback**—a function that will be
    called


    automatically by PHP. With the function defined, we instruct PHP to use the


    error handler with the set\_error\_handler\[3\] function, which takes as its argu-


    ment the name of your custom error handling function. Note that it is possible


    to use class methods as custom error handlers but the code required to do this


    is a pretty ugly hack, so we’ll avoid using classes in this case.


    Be warned that you cannot handle errors that cause PHP to halt execution imme-


    diately, namely the E\_PARSE and E\_ERROR levels. The E\_ERROR level would be


    used in circumstances where PHP has run out of available memory (perhaps


    parsing a huge XML document with the DOM extension) and is forced to halt


    immediately. As for E\_PARSE—well, you weren’t editing a file on a live Web


    server, were you?


    Here’s a simple example of a custom error handler geared to deal with an


    E\_USER\_ERROR:


    \[3\] http://www.php.net/set\_error\_handler


    Chapter 10: Error Handling


    326'
  merge: -1
  pgno: 346
- img_proc: true
  md: "File: **7.php**\n\n<?php\n\n/\\*\\*\n\n \\* Custom Error handler\n\n \\*\n\n\
    \ \\* @param int error level number\n\n \\* @param string error message\n\n \\\
    * @param string php script where error occurred\n\n \\* @param int line number\
    \ in script where error was triggered\n\n \\* @param array current state of all\
    \ global variables\n\n \\*/\n\nfunction myErrorHandler($errLvl, $errMsg, $errFile,\
    \ $errLine,\n\n $errContext)\n\n{\n\n // Switch statement watching for specific\
    \ error levels\n\n switch ($errLvl) {\n\n case E\\_USER\\_ERROR:\n\n $error =\
    \ \"<h2>Custom Error Message</h2>\n\n <b>E\\_USER\\_ERROR</b> in $errFile on line\
    \ $errLine<br />\n\n $errMsg\";\n\n break;\n\n }\n\n echo $error;\n\n}\n\n// Set\
    \ the custom error handler\n\nset\\_error\\_handler('myErrorHandler');\n\n// Trigger\
    \ an error\n\nif (!@mysql\\_connect('localhost', 'wronguser', 'wrongpassword'))\
    \ {\n\n trigger\\_error('Error connecting to MySQL Server: ' .\n\n mysql\\_error(),\
    \ E\\_USER\\_ERROR);\n\n}\n\n?>\n\nIn this example, we begin by creating the custom\
    \ error handling function. The\n\nparameters defined in the function are all those\
    \ that will be passed as arguments\n\nwhen an error is triggered. You don’t have\
    \ to use (or even define) them all, but\n\nthe order in which they appear must\
    \ replicate that shown here. The first paramet-\n\ner, $errLvl is the number representing\
    \ the level of this error. We’ve used this as\n\nthe basis of the switch statement,\
    \ which in this example is geared to catching\n\nonly E\\_USER\\_ERROR reports.\
    \ The second parameter, $errMsg, is the error message\n\nwhich, in this case,\
    \ we provided as the first argument for the trigger\\_error\n\nfunction. The parameter\
    \ $errFile contains the name of the PHP script where\n\nthe error occurred; $errLine\
    \ is the line number in that file where the error oc-\n\n327\n\nCustom Error Handler"
