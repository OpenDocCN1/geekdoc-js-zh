  md: "The class doesn’t provide everything we want, so the first thing we need is\
    \ a class\n\nthat will extend the Pager\\_Sliding class to provide some extra\
    \ information.\n\nThis, by the way, uses **inheritance** (see Chapter 2 for more\
    \ information).\n\nFile: **Database/DB\\_Pager\\_Sliding.php**** (in ****SPLIB****)\
    \ (excerpt)**\n\n/\\*\\*\n\n \\* DB\\_Pager\\_Sliding - extends PEAR::Pager\\\
    _Sliding\n\n \\* Provides an API to help build query result pagers\n\n \\* @access\
    \ public\n\n \\* @package SPLIB\n\n \\*/\n\nclass DB\\_Pager\\_Sliding extends\
    \ Pager\\_Sliding {\n\n /\\*\\*\n\n \\* DB\\_Pager\\_Sliding constructor\n\n \\\
    * @param array params for parent\n\n \\* @access public\n\n \\*/\n\n function\
    \ DB\\_Pager\\_Sliding($params)\n\n {\n\n parent::Pager\\_Sliding($params);\n\n\
    \ }\n\n /\\*\\*\n\n \\* Returns the number of rows per page\n\n \\* @access public\n\
    \n \\* @return int\n\n \\*/\n\n function getRowsPerPage()\n\n {\n\n return $this->\\\
    _perPage;\n\n }\n\n /\\*\\*\n\n \\* The row number to start a SELECT from\n\n\
    \ \\* @access public\n\n \\* @return int \n\n \\*/\n\n function getStartRow()\n\
    \n {\n\n if ($this->\\_currentPage == 0) {\n\n return $this->\\_perPage;\n\n }\
    \ else {\n\n return ($this->\\_currentPage - 1) \\* $this->\\_perPage;\n\n }\n\
    \n }\n\n}\n\nChapter 9: Web Page Elements\n\n264"
