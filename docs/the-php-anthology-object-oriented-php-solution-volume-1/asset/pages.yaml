  md: "Doing so is often a sign of a bad design, in which opportunities for classes\n\
    \nto interact in different ways (see the next solution) were missed. In practice,\n\
    \nhaving more than two generations of classes often leads to all sorts of debug-\n\
    \nging problems and makes the code difficult to maintain. For example, it can\n\
    \nbecome hard to keep track of variable names you’ve used higher up in the\n\n\
    hierarchy.\n\n**How do objects interact?**\n\nAside from inheritance, there are\
    \ other ways for objects to interact; for example,\n\none object *uses* another\
    \ object. In many ways, such interactions are more important\n\nthan inheritance,\
    \ and this is where the object oriented paradigm shows its real\n\npower.\n\n\
    There are two ways in which one object can use another: **aggregation** and **com-**\n\
    \n**position**.\n\n**Aggregation**\n\nAggregation occurs when one object is given\
    \ another object on “temporary loan.”\n\nThe second object will usually be passed\
    \ to the first through one of the first’s\n\nmember functions. The first object\
    \ is then able to call methods in the second,\n\nallowing it to use the functionality\
    \ stored in the second object for its own pur-\n\nposes.\n\nA common example of\
    \ aggregation in action involves a database connection class.\n\nImagine you pass\
    \ a database connection class to some other class, which then\n\nuses the database\
    \ connection class to perform a query. The class performing the\n\nquery **aggregates**\
    \ the database connection class.\n\nHere’s a simple example using the MySQL class,\
    \ which we’ll create in Chapter 3:\n\nFile: **13.php**\n\n<?php\n\n// Include\
    \ the MySQL database connection class\n\nrequire\\_once 'Database/MySQL.php';\n\
    \n// A class which aggregates the MySQL class\n\nclass Articles {\n\n var $db;\n\
    \n var $result;\n\n // Accept an instance of the MySQL class\n\nChapter 2: Object\
    \ Oriented PHP\n\n56"
