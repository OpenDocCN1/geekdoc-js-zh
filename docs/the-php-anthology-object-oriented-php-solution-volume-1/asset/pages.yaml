    \n**How do I add attachments to messages?**\n\nWith PHPMailer, you effectively\
    \ have at your disposal three methods to add at-\n\ntachments to messages—two\
    \ dealing with files in general, and one specific to\n\nimages:\n\n**AddAttachment(path,\
    \ name \\[, encoding\\[, type\\]\\])**\n\nThis method is intended for files that\
    \ are already located on your server. You\n\nsupply the path and name of the file.\
    \ Note that *encoding* is generally best\n\nleft to the default of \"base64\"\
    , while you may want to supply a more specific\n\nMIME type¹ via the *type* parameter.\n\
    \n1A list of common MIME types can be found at http://www.hivemail.com/mime.types.phps.\
    \ MIME\n\ntypes are discussed in greater detail in Chapter 7.\n\n239\n\nHow do\
    \ I add attachments to messages?"
