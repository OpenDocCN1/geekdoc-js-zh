    Mike can continue to impress with his formatting!


    ![](img/4aa42814ed6f04055a7211c9ee423453_167_0.png)


    **Modify Text when SELECTing, not INSERTing**


    It’s a common mistake among those who are new to PHP to use the types


    of functions described above at the point at which text is inserted into a


    database. During the initial design of the application, this may seem like a


    good idea. However, this approach may cause problems later—for example,


    if you decide you want to display the text in a different format.


    Let’s take the nl2br function as an example. This is fine for simple display


    in HTML, but what if you want to allow users to edit the text in a textarea


    form field? They’ll be confronted with text in which the line feeds have been


    stripped out and replaced with br tags. If users weren’t expecting to edit


    HTML, they may be very confused. Converting the br elements back to line


    feeds is a possibility, but adds complexity and confusion to your code.


    By applying nl2br only at the point at which content is displayed to an end


    user, *after* it has been fetched from your database, you’ll avoid many head-


    aches.


    In some cases, it may be acceptable to remove parts of a string as you insert


    it into the database, as is the case with the strip\_tags function (see below),


    but it’s usually better to avoid actually reformatting the string until you need


    to render it for a browser.


    **Tag Stripping**


    If you allow your site to be updated by the general public, being able to preclude


    the use of HTML is important in preventing visitors posting markup that interferes


    with your site’s layout.


    The PHP function strip\_tags handles most of this job almost perfectly. Given


    some text, strip\_tags will eliminate anything that looks like an HTML tag. To


    be more exact, what strip\_tags does is remove any block of text that begins


    with < and ends with \>. Everything other than the tags is left exactly as it
    was.


    Here’s a simple example:


    147


    Tag Stripping'
