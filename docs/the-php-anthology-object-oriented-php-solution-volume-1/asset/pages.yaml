  md: " // A function declared in the class scope\n\n function **myFunction()**\n\n\
    \ {\n\n // A variable in the function (method) scope\n\n**$myVariable** = 'Methodical';\n\
    \n }\n\n}\n\n?>\n\nIn the above example, each of the $myVariable declarations\
    \ is actually a separate\n\nvariable. They can live together happily without interfering\
