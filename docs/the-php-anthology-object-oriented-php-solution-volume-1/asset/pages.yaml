  md: "}\n\n// Tell the browser it's a file for downloading\n\nheader('content-disposition:\
    \ attachment; filename=' . $fileName);\n\nheader('content-type: ' . $mimeType);\n\
    \nheader('content-length: ' . filesize($fileName));\n\n// Display the file\n\n\
    readfile($fileName);\n\n?> \n\nThe content-disposition header tells the browser\
    \ to treat the file as a download\n\n(i.e. not to display it in the browser window),\
    \ and gives it the name of the file.\n\nThe content-type header also tells the\
    \ browser what type of file you’re sending\n\nit. In most cases, this should be\
    \ chose to match the type of file you are sending;\n\nhowever, Internet Explorer\
    \ 5 and Opera browsers have a bad habit of displaying\n\nfiles of recognized types\
    \ in the browser regardless of the content-disposition\n\nheader, so we set the\
    \ MIME type to the made-up value application/x-download\n\nfor those browsers.\
    \ Finally, the content-length header tells the browser the size\n\nof the file,\
    \ so that it’s able to display a download progress bar.\n\n![](img/4aa42814ed6f04055a7211c9ee423453_156_0.png)\n\
    \n**Send HTTP Headers First**\n\nRemember that headers must be delivered before\
    \ any other content is sent\n\nto the browser.\n\nBe aware that PHP’s output control\
    \ functions can be helpful here, as they\n\nlet you send things to the browser\
    \ in the right order: you can “hold” content\n\nalready sent to output by PHP\
    \ while letting the headers pass. See Volume\n\nII, Chapter 5 for further details\
    \ on output control.\n\nNow that delivery of the file is under your control, you\
    \ can fit this functionality\n\ninto your authentication system, for example,\
    \ to control who can download the\n\nfile.\n\n**File Distribution Strategy**\n\
    \nOne of the Internet’s unsolvable problems is how best to distribute files from\
    \ a\n\nWebsite. If you sell artwork in JPEG format, for example, how will you\
    \ handle\n\nthe process of accepting payments from customers and then letting\
    \ them download\n\nonly the image they paid for? How can you make sure they don’t\
    \ redistribute\n\nthe images they buy? How many times will customers be allowed\
    \ to download\n\nan image they’ve paid for?\n\nChapter 4: Files\n\n136"
