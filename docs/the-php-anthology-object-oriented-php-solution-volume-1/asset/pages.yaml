- img_proc: true
  md: "**php\\_value**\n\nused to specify a string value for settings, such as you\
    \ might have with the\n\ninclude\\_path setting\n\nHere’s an example .htaccess\
    \ file:\n\n\\# Switch off register globals\n\nphp\\_flag register\\_globals off\n\
    \n\\# Set the include path\n\nphp\\_value include\\_path \".;/home/username/pear\"\
    \n\nThe final mechanism controlling PHP’s configuration is the group of functions\n\
    \nini\\_set and ini\\_alter, which let you modify configuration settings, as well\
    \ as\n\nini\\_get, which allows you to check configuration settings, and ini\\\
    _restore,\n\nwhich resets PHP’s configuration to the default value as defined\
    \ by php.ini and\n\nany .htaccess files. Using ini\\_set, here’s an example which\
    \ allows us to avoid\n\nhaving to define our host, user name and password when\
    \ connecting to MySQL:\n\nini\\_set('mysql.default\\_host', 'localhost');\n\n\
    ini\\_set('mysql.default\\_user', 'harryf');\n\nini\\_set('mysql.default\\_password',\
    \ 'secret');\n\nif (!mysql\\_connect()) {\n\n echo mysql\\_error();\n\n} else\
    \ {\n\n echo 'Success';\n\n}\n\nBe aware that PHP provides for some settings,\
    \ such as error\\_reporting, altern-\n\native functions that perform effectively\
    \ the same job as ini\\_set. Which you\n\nprefer is a matter of taste.\n\nNote\
    \ that certain settings, such as register\\_globals, can only be usefully\n\n\
    modified by php.ini or .htaccess, because such settings influence PHP’s beha-\n\
    \nvior *before* it begins executing your scripts.\n\nFurthermore, some configuration\
    \ settings can be changed *only* in php.ini, such\n\nas extension\\_dir, which\
    \ tells PHP the directory in which PHP extensions can\n\nbe found. For a complete\
    \ reference on controlling settings, refer to the PHP\n\nManual\\[1\\].\n\n\\\
    [1\\] http://www.php.net/ini\\_set\n\nAppendix A: PHP Configuration\n\n340"
