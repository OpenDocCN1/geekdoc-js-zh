  md: "**A Basic Connection**\n\nHere is a MySQL database connection in its simplest\
    \ form:\n\nFile: **1.php**\n\n<?php\n\n$host = 'localhost'; // Hostname of MySQL\
    \ server\n\n$dbUser = 'harryf'; // Username for MySQL\n\n$dbPass = 'secret'; //\
    \ Password for user\n\n$dbName = 'sitepoint'; // Database name\n\n// Make connection\
    \ to MySQL server\n\nif (!$dbConn = mysql\\_connect($host, $dbUser, $dbPass))\
    \ {\n\n die('Could not connect to server');\n\n}\n\n// Select the database\n\n\
    if (!mysql\\_select\\_db($dbName, $dbConn)) {\n\n die('Could not select database');\n\
    \n}\n\necho 'Connection successful!';\n\n// ... some code here using MySQL\n\n\
    // Close the connection when finished\n\nmysql\\_close($dbConn);\n\n?>\n\nIt’s\
    \ important to remember that MySQL is a separate server program, much like\n\n\
    Apache. Both servers may run on the same physical computer (hence our use of\n\
    \n$host = 'localhost'; in the above example) but it’s also possible to connect\n\
    \nto MySQL on a remote computer, for example $host = 'anothercom-\n\nputer.com';.\
    \ To make matters a little more interesting, MySQL also has its own\n\nport number,\
    \ which by default is 3306. PHP assumes that 3306 will be the port\n\nnumber but\
    \ should you need to use a different one, all you need is $host =\n\n'anothercomputer.com:4321';.\n\
    \nThe other conceptual hurdle lies in understanding that a single MySQL server\n\
    \nmay provide access to many databases, which is why you need to select your\n\
    \ndatabase in PHP after connecting to the server.\n\nReturning to the code above,\
    \ there are a few things to note. First, I’ve placed in\n\nvariables the values\
    \ I need in order to connect to MySQL. This simply makes\n\nour lives easier;\
    \ it’s common to store this kind of information in separate files\n\n67\n\nA Basic\
    \ Connection"
  merge: -1
  pgno: 87
- img_proc: true
  md: "that are included in every PHP script, making it possible to change many scripts\n\
    \nat one time. We’ll be looking at further tricks we can employ to make life easier\n\
    \nin a moment.\n\nThe mysql\\_connect function does the work of connecting to\
    \ a MySQL server.\n\nThe value it returns is either a **link identifier** (a value\
    \ supplied by PHP to\n\nidentify the connection), or FALSE, meaning the connection\
    \ failed.\n\nif (!$dbConn = **mysql\\_connect**($host, $dbUser, $dbPass)) {\n\n\
    \ die('Could not connect to server');\n\n}\n\nThis if statement asks the question\
    \ “Did I successfully connect to the MySQL\n\nserver?” If not, it uses die to\
    \ terminate the script.\n\nNext, we’ve selected the database we want with mysql\\\
    _select\\_db, using the\n\nsame if statement technique:\n\nif (!**mysql\\_select\\\
    _db**($dbName, **$dbConn**)) {\n\nNote that we provided the variable containing\
    \ the link identifier as the second\n\nargument to mysql\\_select\\_db. We wouldn’t\
    \ usually need to do this (the argu-\n\nment is optional), but when a complex\
    \ script juggles multiple database connec-\n\ntions, this method can help ensure\
    \ PHP knows which you’re referring to.\n\nFinally, we’ve used mysql\\_close to\
    \ disconnect from the server again:\n\nmysql\\_close($dbConn);\n\nThis occurs\
    \ at the bottom of the script, once we’ve run some imaginary PHP\n\ncode that\
    \ used the connection. Closing the connection is generally optional—PHP\n\nautomatically\
    \ closes any connections after the script finishes¹.\n\n1Connections made with\
    \ mysql\\_pconnect are different. This function establishes a persistent\n\nconnection\
    \ to the database to be reused by multiple PHP scripts. Using a persistent connection\
    \ makes\n\nyour scripts slightly faster, as PHP no longer has to reconnect each\
    \ time, but speed comes at a price:\n\nif your Website runs on a shared server,\
    \ persistent connections may monopolize that server, resulting\n\nin other sites\
    \ being unable to connect at times. In such environments, it’s typical to either\
    \ avoid\n\nmysql\\_pconnect, or configure MySQL so that connections are terminated\
    \ the moment they stop\n\ndoing anything, using a short connection timeout value.\n\
    \nChapter 3: PHP and MySQL\n\n68"
