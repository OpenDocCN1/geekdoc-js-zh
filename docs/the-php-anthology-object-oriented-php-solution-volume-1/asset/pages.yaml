  md: 'The great thing about the Pager\_Sliding class is that the range of pages it
    dis-


    plays will change to reflect the page the visitor is currently viewing. As your
    table


    grows, it remains easy to navigate. This is important when you’re dealing with


    large result sets; if a query returned more than ten pages of results, for example,


    without a “sliding pager” you’d have a very long row of pages to display on your


    Web page, which would be both ugly and difficult to navigate. The Pager\_Sliding


    class helps you implement a pager that’s similar to the one used by Google\[3\],


    where a search often returns hundreds of pages of results.


    **How do I handle HTML forms in PHP?**


    *“With great power comes great responsibility.”*


    —Spiderman’s Uncle Ben


    Compared to links and URLs, HTML forms provide a far more powerful mech-


    anism by which to accept information from your site’s visitors. Forms allow you


    to develop complex interfaces that, for example, can enable users to select values


    from a dynamically-generated list, enter large bodies of text, and even upload


    files. Forms make possible anything from a simple guest book to an intricate user


    registration and authentication system. But with increased functionality comes


    a wider range of problems. How can you validate a form? What should you do


    if a form is incorrectly completed? How can you populate a form with data from


    a database? These are just a few of the challenges you’ll face as you deal with


    forms; there are many more.


    **HTTP Request Methods**


    The Internet’s HTTP protocol, commonly used to fetch Web pages, defines a number
    of


    “methods” that browsers can use to send requests and data to Web servers. Of the
    available


    methods, the two most important are the GET method and the POST method.


    K GET is the “default” method for the Internet, used whenever you request a page
    with


    your browser. All data in the request must be encoded in the URL.


    K POST is most often used for submitting forms. It allows additional form data
    to be sent


    with the request.


    HTML lets you specify the method to use for each form tag. Although GET is the
    default,


    it is most common to use POST, which avoids cluttering the URL with the submitted


    data.


    \[3\] http://www.google.com/


    Chapter 9: Web Page Elements


    268'
  merge: -1
  pgno: 288
- img_proc: true
  md: '**Guidelines for Dealing with Forms**


    K Use the POST method when declaring your form in HTML. This prevents


    form values from appearing in the URL, and allows a larger amount of data


    to be submitted through the form.


    K Use PHP’s htmlspecialchars function when populating form fields with


    PHP values, to avoid malformed HTML, as discussed in Chapter 5.


    K Don’t rely exclusively on JavaScript validation. It can improve the user exper-


    ience, but used alone JavaScript validation can easily be bypassed by the user.


    K If you use normal HTTP, form data will be sent in “clear text” over the Internet


    from the browser to the server. This means it can be intercepted by someone


    using a packet sniffer. When you send confidential information such as finan-


    cial details, use an encryption technology such as SSL.


    **Forms in Action with QuickForm**


    I’ll assume for the moment that you’re happy to use forms at their most basic.


    Here, we’ll concentrate on another PEAR package—PEAR::HTML\_QuickForm\[4\].


    Developed by Bertrand Mansion and Adam Daniel, QuickForm makes it easy to


    render simple HTML forms from PHP… but that’s not all! QuickForm provides


    further functionality to help with a range of other problems, such as the generation


    of calendar form elements, and validation with both PHP and JavaScript. It


    automatically takes care of issues related to magic quotes, too, so if you’re
    using


    QuickForm, you don’t need to worry whether magic quotes is on or off. The


    version used in these examples was 3.1.


    First, a simple example:


    File: **5.php**


    <?php


    // Include the QuickForm class


    require\_once ''HTML/QuickForm.php'';


    // Instantiate the QuickForm class


    $form = new HTML\_QuickForm(''quickForm1'', ''POST'');


    // Add a text input field called firstName,


    \[4\] http://pear.php.net/HTML\_QuickForm


    269


    Guidelines for Dealing with Forms'
