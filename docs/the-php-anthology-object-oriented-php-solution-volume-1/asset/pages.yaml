  md: "**Day of the Week**\n\nIf we’re given the date “March 22, 2003”, how can we\
    \ find out which day of the\n\nweek it was? The easiest solution is to convert\
    \ it to a timestamp, then use PHP’s\n\ndate function to tell us which day the\
    \ twenty-second fell on. To add this to the\n\nclass, we need only insert another\
    \ method:\n\nFile: **DateTime/DateMath.php**** (in ****SPLIB****) (excerpt)**\n\
    \n /\\*\\*\n\n \\* Returns the day of the week\n\n \\* @param boolean if true\
    \ returned value will be numeric day of\n\n \\* week\n\n \\* @return mixed e.g.\
    \ Saturday or 6\n\n \\* @access public\n\n \\*/\n\n function dayOfWeek($numeric\
    \ = false)\n\n {\n\n if ($numeric) {\n\n return date('w', $this->timeStamp);\n\
    \n } else {\n\n return date('l', $this->timeStamp);\n\n }\n\n }\n\nNow, using\
    \ the dayOfWeek method, we’ll find out what day of the week March\n\n22, 2003\
    \ was:\n\nFile: **5.php**\n\n<?php\n\n// Include DateMath class\n\nrequire\\_once\
    \ 'DateTime/DateMath.php';\n\n// Instantiate DateMath class 22nd March 2003\n\n\
    $dateMath = new DateMath(2003, 03, 22);\n\necho '22nd March 2003 is a ' . $dateMath->dayOfWeek();\n\
    \n?>\n\nNote that if we pass TRUE to the dayOfWeek method, it will return a numeric\n\
    \nrepresentation of the day of the week, starting with 0 as Sunday:\n\necho '22nd\
    \ March 2003 is day ' . $dateMath->dayOfWeek(TRUE) .\n\n ' of the week.';\n\n\
    Chapter 6: Dates and Times\n\n182"
  merge: -1
  pgno: 202
- img_proc: true
  md: "**Week of the Year**\n\nTo ascertain the week of the year, we add another method\
    \ to the DateMath class:\n\nFile: **DateTime/DateMath.php**** (in ****SPLIB****)\
    \ (excerpt)**\n\n /\\*\\*\n\n \\* Returns the ISO 8601 week of the year\n\n \\\
    * @return int numeric week of year e.g. 12\n\n \\* @access public\n\n \\*/\n\n\
    \ function weekOfYear()\n\n {\n\n return date('W', $this->timeStamp);\n\n }\n\n\
    Putting this into action:\n\nFile: **6.php**\n\n<?php\n\n// Include DateMath class\n\
    \nrequire\\_once 'DateTime/DateMath.php';\n\n// Instantiate DateMath class 22nd\
    \ March 2003\n\n$dateMath = new DateMath(2003, 3, 22, 0, 0, 0);\n\necho '22nd\
    \ March 2003 is in week ' . $dateMath->weekOfYear() .\n\n ' of the year';\n\n\
    ?>\n\nBe aware that the weekOfYear method relies on PHP’s date function, which\
    \ uses\n\nthe ISO 8601 notation for weeks\\[4\\]. Under that standard, the first\
    \ week of the\n\nyear is the week (beginning on a Monday) that contains the first\
    \ Thursday of\n\nthe year. So if, for instance, the last two days in December\
    \ fell on a Monday and\n\na Tuesday, they would actually belong to the next year\
    \ according to this notation.\n\n**Number of Days in a Month**\n\nMy memory is\
    \ terrible and I can never remember how many days a particular\n\nmonth is supposed\
    \ to have. Thankfully, it’s not too hard to find out with PHP,\n\nwhere we can\
    \ simply add a daysInMonth method to the DateMath class:\n\n\\[4\\] http://www.cl.cam.ac.uk/~mgk25/iso-time.html\n\
    \n183\n\nWeek of the Year"
