  md: 'echo ''1st Jan 1902: '' . mktime(0, 0, 0, 1, 1, 1902) . ''<br />'';


    echo ''31st Dec 1969: '' . mktime(0, 0, 0, 12, 31, 1969) . ''<br />'';


    echo ''1st Jan 1790: '' . mktime(0, 0, 0, 1, 1, 1970) . ''<br />'';


    echo ''1st Jan 1937: '' . mktime(0, 0, 0, 1, 1, 2037) . ''<br />'';


    echo ''1st Jan 2038: '' . mktime(0, 0, 0, 1, 1, 2038) . ''<br />'';


    echo ''19th Jan 2038: '' . mktime(0, 0, 0, 1, 19, 2038) . ''<br />'';


    echo ''20th Jan 2038: '' . mktime(0, 0, 0, 1, 20, 2038) . ''<br />'';


    echo ''1st Jan 2039: '' . mktime(0, 0, 0, 1, 19, 2039) . ''<br />'';


    ?>


    Depending on your operating system, and particularly on Windows, this may


    generate a range of different PHP warning errors.


    Another thing to be aware of with Unix timestamps is that they vary in length;


    a timestamp from January 2, 1970 will obviously be shorter than a contemporary


    timestamp. In general, when you’re placing Unix timestamps in your database,


    a column size of 10 (INT(10)) should be more than enough to keep your applic-


    ation running for the next 270+ years (assuming it’s not running on a 32-bit


    operating system, of course).


    **MySQL Timestamps**


    MySQL timestamps are simpler than Unix timestamps. The generalized form is


    *YYYY*\-*MM*\-*DD HH*:*MM*:*SS* and is typically stored in a column of type DATETIME
    (note


    also the column types DATE and TIME, which store only *YYYY*\-*MM*\-*DD* and *HH*:*MM*:*SS*


    respectively).


    For simple sorting and comparison operations, timestamps in this form are perfect


    *and* they have the advantage of being human-readable. They also have a predict-


    able length (until we get to the year 9999), which makes them easier to validate.


    On the downside, you’re still lumbered with problems when it comes to more


    complicated date-related operations. How would you group data on a weekly


    basis, for example? You’ll probably end up converting the MySQL timestamp to


    a Unix timestamp to achieve this, and such conversions can significantly slow


    down an application that handles large sets of data.


    Personally, of the two timestamps, I prefer to use Unix timestamps to store date


    information in MySQL. Of course, I plan to be retired and fishing when 2038


    comes around, but I’ll provide examples of both here, and leave the choice up
    to


    you.


    Chapter 6: Dates and Times


    174'
