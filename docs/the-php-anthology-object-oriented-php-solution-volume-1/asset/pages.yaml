    \nuseful to be able to find out the ID of a row you’ve just inserted, so that\
    \ other\n\ntables can be updated with this information. That, after all, is how\
    \ relationships\n\nbetween tables are built. PHP provides the function mysql\\\
    _insert\\_id, which,\n\nwhen given a link identifier, returns the ID generated\
    \ by the last INSERT performed\n\nwith that connection. Here’s how mysql\\_insert\\\
    _id can be used:\n\nFile: **17.php**** (excerpt)**\n\n// A query to insert a row\n\
    \n$sql = \"INSERT INTO \n\n articles\n\n SET\n\n title='How to use mysql\\_insert\\\
    _id()',\n\n body='This is an example',\n\n author='HarryF'\";\n\n// Run the query,\
    \ identifying the connection\n\n$queryResource = mysql\\_query($sql, $dbConn);\n\
    \n// Fetch the inserted ID\n\n$insertID = mysql\\_insert\\_id($dbConn);\n\necho\
    \ 'The new row has ID: ' . $insertID;\n\n**Class Insert ID**\n\nTo use this functionality\
    \ in our MySQLResult class, add the following method:\n\nFile: **Database/MySQL.php****\
    \ (in ****SPLIB****) (excerpt)**\n\n /\\*\\*\n\n \\* Returns the ID of the last\
    \ row inserted\n\n \\* @return int\n\n \\* @access public\n\n \\*/\n\n function\
    \ insertID()\n\n {\n\n return mysql\\_insert\\_id($this->mysql->dbConn);\n\n }\n\
    \nChapter 3: PHP and MySQL\n\n94"
