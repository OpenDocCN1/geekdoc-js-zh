  md: "**Polymorphism**\n\nAnother powerful aspect of object oriented programming\
    \ is polymorphism—the\n\nability of different classes to share an **interface**.\n\
    \nAn interface is one or more methods that let you use a class for a particular\
    \ pur-\n\npose. For example, you could have two database connection classes—one\
    \ for\n\nMySQL and one for PostgreSQL. As long as they both offered a query method,\n\
    \nyou could use them interchangeably for running queries on different databases.\n\
    \nThe query method is a simple interface that the two classes share.\n\nThe classes\
    \ sharing the same interface are often inherited from a parent class that\n\n\
    makes the common methods available. Again, this is best understood by example.\n\
    \nFirst, we define an **abstract** base class, Message, which provides the common\n\
    \nmethod getMessage. Beneath the Message class, we define **concrete** classes,\
    \ each\n\nof which creates a specific message.\n\nThe terms “abstract” and “concrete”\
    \ refer to class usage, in particular, whether\n\na class is intended to be used\
    \ directly or not. An abstract class is one in which\n\nsome functionality or\
    \ structure is to be shared by all subclasses, but is not intended\n\nto be used\
    \ directly; typically, it has one or more empty methods that don’t do\n\nanything\
    \ useful. In other words, you’re not supposed to create objects from an\n\nabstract\
    \ class. A concrete class is a subclass of the abstract class from which you\n\
    \n*can* create objects. Some languages, like Java, provide support for abstract\
    \ classes\n\nwithin the language syntax—something PHP 4 doesn’t offer. You can\
    \ still use\n\nthe *concept* of abstract classes when designing applications,\
    \ though you might\n\nconsider adding documentation to tell other developers working\
    \ with the code\n\nthat the class is abstract.\n\nFile: **14.php**** (excerpt)**\n\
    \n<?php\n\nclass Message {\n\n var $message;\n\n function setMessage($message)\n\
    \n {\n\n $this->message = $message;\n\n }\n\n function getMessage()\n\n {\n\n\
    \ return $this->message;\n\n }\n\n}\n\nChapter 2: Object Oriented PHP\n\n60"
  merge: -1
  pgno: 80
- img_proc: true
  md: "class PoliteMessage extends Message {\n\n function PoliteMessage()\n\n {\n\n\
    \ $this->setMessage('How are you today?');\n\n }\n\n}\n\nclass TerseMessage extends\
    \ Message {\n\n function TerseMessage()\n\n {\n\n $this->setMessage('Howzit?');\n\
    \n }\n\n}\n\nclass RudeMessage extends Message {\n\n function RudeMessage()\n\n\
    \ {\n\n $this->setMessage('You look like \\*%&\\* today!');\n\n }\n\n}\n\nNow,\
    \ we define the MessageReader class, which takes an array of Message objects\n\
    \nthrough its constructor.\n\nFile: **14.php**** (excerpt)**\n\nclass MessageReader\
    \ {\n\n var $messages;\n\n function MessageReader(&$messages) {\n\n $this->messages\
    \ = &$messages;\n\n $this->readMessages();\n\n }\n\n function readMessages() {\n\
    \n foreach ($this->messages as $message) {\n\n echo $message->getMessage() . '<br\
    \ />';\n\n }\n\n }\n\n}\n\nThe important thing to note here is that, as far as\
    \ MessageReader is concerned,\n\na “Message object” is any object that was instantiated\
    \ from the Message class *or*\n\n*one of its subclasses*. Did you see how, inside\
    \ the readMessages method, we call\n\nthe getMessage method? This code will work\
    \ on any object that has a getMessage\n\nmethod—including any subclass of Message.\n\
    \n61\n\nPolymorphism"
