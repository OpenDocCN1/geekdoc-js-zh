  md: '**Use the Full ****<?php ?>**** Tags**


    PHP supports a variety of tag styles to mark up sections of PHP code, including


    the short tags (<? ?>), and ASP-style tags (<% %>). These are controlled from


    php.ini with the settings short\_open\_tag and asp\_tags. While you have these


    settings set to On, other people may not. The short tag style, for example, causes


    a problem when the PHP is mixed with XML documents, which use processing


    instructions like this:


    <?xml version="1.0"?>


    If we have a document which contains PHP and XML, and we have the


    short\_open\_tag turned on, PHP will mistake the XML processing instruction


    <?xml for a PHP opening tag.


    It’s possible that your code will need to run in environments where


    short\_open\_tags and asp\_tags are both off. The best way to be sure that they


    are is to get into the habit of always using the <?php ?> tag style, otherwise
    there


    may be a lot of code rewriting to do in some dark future.


    **register\_globals**** off**


    PHP is capable of turning incoming data into native PHP variables. This feature


    is controlled by the register\_globals setting in php.ini. With register\_glob-


    als switched on, if I point my browser at an address like http://www.mysite.com/in-


    dex.php?logged\_in=1, PHP will automatically create a variable $logged\_in and


    assign it the value of 1. The PHP group now recommends this setting be disabled


    because it presents a risk to security, as the previous example suggests.


    So, in php.ini make sure the following code is in place:


    register\_globals = Off


    This will force you to access incoming data via the special predefined **superglobal**


    **variables** (e.g. $\_GET\[''username''\]), which means they won’t conflict with


    variables you’ve created in your script.


    Using a .htaccess file with Apache, the same result can be achieved with the


    following code:


    php\_flag register\_globals off


    Chapter 1: PHP Basics


    18'
