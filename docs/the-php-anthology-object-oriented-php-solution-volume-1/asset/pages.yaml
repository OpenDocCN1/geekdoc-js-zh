    **A Roman Calendar**


    Now you have a rough idea of the methods available, how about a more useful


    example? The following code displays a given month in a format that’s common


    to calendars—a table in which each row represents a week. To start with, we’ll


    instantiate a Month and use it to get timestamps for the next and previous months:


    File: **13.php**** (excerpt)**


    <?php


    // Include Calendar Month and Day


    require\_once ''DateTime/Month.php'';


    require\_once ''DateTime/Day.php'';


    // Set up initial variables


    if (!isset($\_GET\[''y''\])) $\_GET\[''y''\] = date(''Y'');


    if (!isset($\_GET\[''m''\])) $\_GET\[''m''\] = date(''m'');


    if (!isset($\_GET\[''d''\])) $\_GET\[''d''\] = date(''d'');


    // Instantiate the Month class


    $month = new Month($\_GET\[''y''\], $\_GET\[''m''\]);


    // Get the details of the months as timestamps


    $last = $month->lastMonth(true);


    $next = $month->nextMonth(true);


    $thisMonth = $month->thisMonth(true);


    Next, we’ll build the top row of the table, allowing users to navigate between


    months:


