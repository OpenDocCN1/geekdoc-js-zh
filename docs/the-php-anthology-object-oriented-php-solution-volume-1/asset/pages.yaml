  md: "**Good and Bad Practices**\n\nWhen working with classes and objects, it’s a\
    \ good idea to use references\n\nwhenever an object is involved. Occasionally,\
    \ you may have to do the same with\n\nan array, such as when you want to sort\
    \ the array in a different section of code.\n\nBut, for the most part, normal\
    \ variables will not need this treatment, simply be-\n\ncause, when your code\
    \ reaches the level of complexity where you’d need to do\n\nso, you will (I hope!)\
    \ be storing variables inside objects and passing the complete\n\nobject by reference.\n\
    \nLet’s look at some other situations in which you might need to use references…\n\
    \n// Make sure $myObject is a reference to\n\n// the variable created by the new\
    \ keyword\n\n$myObject = **&**new MyClass();\n\nThis looks odd at first, but remember,\
    \ a variable created by the new keyword is\n\nbeing passed here—even if you can’t\
    \ see it. The reference operator saves PHP\n\nfrom having to create a copy of\
    \ the newly-created object to store in $myObject.\n\nclass Bar {\n\n}\n\nclass\
    \ Foo {\n\n // Return by reference\n\n function **&**getBar()\n\n {\n\n return\
    \ new Bar();\n\n }\n\n}\n\n// Instantiate Foo\n\n$foo = **&**new Foo();\n\n//\
    \ Get an instance of Bar from Foo\n\n$bar = **&**$foo->getBar();\n\nIn the above\
    \ example, you’ll notice the getBar method in the Foo class. By pre-\n\nceding\
    \ the function name with the reference operator, the value the function re-\n\n\
    turns is passed by reference. Note that we also had to use a reference operator\n\
    \nwhen assigning the return value of getBar to $bar. This technique is commonly\n\
    \nused when a class method will return objects.\n\nWhat’s *bad* practice is the\
    \ following:\n\nChapter 2: Object Oriented PHP\n\n46"
  merge: -1
  pgno: 66
- img_proc: true
  md: "function display($message) {\n\n echo $message;\n\n}\n\n$myMessage = 'Hello\
    \ World!';\n\n// Call time pass by reference - bad practice!\n\ndisplay(**&**$message);\n\
    \nThat’s known as a **call-time pass-by-reference**, which PHP controls with the\n\
    \nfollowing setting in php.ini:\n\nallow\\_call\\_time\\_pass\\_reference = Off\n\
    \nBy default, in recent PHP releases the above setting should be switched to Off;\n\
    \nturning it on is “frowned upon” by PHP’s makers. Switched off, PHP will generate\n\
    \nwarning errors every time a function call specifies an argument should be passed\n\
    \nby reference. As such, it’s good practice to leave this setting off.\n\nThe\
    \ reason why call time pass by reference is a “bad thing” is that call time passing\n\
    \nby reference can make code extremely difficult to follow. I’ve occasionally\
    \ seen\n\nPHP XML parsers written using a call-time pass-by-reference—it’s nearly\
    \ im-\n\npossible to gain any idea of what’s going on.\n\nThe “decision” as to\
    \ whether a variable is passed by reference or not is one that\n\nbelongs to the\
    \ *function* being called, not the code that calls it. The above code\n\nwritten\
    \ correctly would look like this:\n\n// Accept by reference - good practice\n\n\
    function display(**&**$message)\n\n{\n\n echo $message;\n\n}\n\n$myMessage = 'Hello\
    \ World!';\n\ndisplay($message);\n\n**Performance Issues**\n\nDepending on the\
    \ scale of your application, there are some performance issues\n\nyou might need\
    \ to consider when using references.\n\n47\n\nPerformance Issues"
