  md: "expressions (the same as PHP’s ereg functions). Using the RLIKE operator, we\n\
    \ncan compare a column using a regular expression:\n\nSELECT \\* FROM articles\
    \ WHERE title **RLIKE** '^How ' \n\nThe above statement also selects every article\
    \ in which the title begins with “How”\n\nfollowed by a space.\n\nWith some work,\
    \ these operators provide everything needed to explore your data.\n\nWhere the\
    \ above approach becomes a burden is in performing a search against\n\nmultiple\
    \ columns. For example,\n\nSELECT \\* FROM articles\n\nWHERE title LIKE '%how%'\
    \ OR body LIKE '%how%'\n\nFor larger tables, this can require you to write some\
    \ very complicated and unpleas-\n\nant queries.\n\n**FULLTEXT Searches**\n\nMySQL\
    \ provides an alternative that does most of the work for you—the FULLTEXT\n\n\
    index. Indexes in a database are much like the index of a book; they provide a\n\
    \nmeans to locate information within the database quickly from an organized list.\n\
    \nA FULLTEXT index allows you to search a table for particular words.\n\nFULLTEXT\
    \ indexes were introduced to MySQL with version 3.23. The implement-\n\nation\
    \ at this point was fairly limited but still useful for basic searching, which\
    \ is\n\nwhat I’ll demonstrate here. In MySQL version 4.0.1, this functionality\
    \ was exten-\n\nded to provide a full Boolean search mechanism that gives you\
    \ the ability to build\n\nsomething like Google™’s advanced search features. FULLTEXT\
    \ indexes also allow\n\neach result to be returned with a “relevance” value so\
    \ that, for example, the results\n\nof multiple word searches can be displayed\
    \ in terms of how well each result\n\nmatches that user’s particular search.\n\
    \nTo take advantage of FULLTEXT indexes, you first need to instruct MySQL to\n\
    \nbegin building an index of the columns you want to search:\n\nALTER TABLE articles\
    \ ADD FULLTEXT art\\_search (title, body, author)\n\nOnce you’ve done that, you\
    \ need to INSERT a new record (or modify an existing\n\none) to get MySQL to build\
    \ the index. You also need at least three records in\n\nthe database for FULLTEXT\
    \ searches to work, because non-Boolean searches will\n\nonly return results if\
    \ the search string occurred in less than 50% of the rows in\n\nChapter 3: PHP\
    \ and MySQL\n\n96"
