  md: 'Notices


    potential problems that PHP doesn’t really care about, but


    which may reflect bugs in your code


    An understanding of this categorization will prove useful when it comes to gen-


    erating your own errors.


    The **error reporting level** determines which of the above categories of error
    will


    cause PHP to display an error message. The default error reporting level for a


    PHP installation is set by the error\_reporting option in php.ini. For example,


    setting it to E\_ALL tells PHP to report all error types:


    error\_reporting = E\_ALL


    Except for this special case, telling PHP to use a particular error level will
    see


    PHP report errors from that level only; the levels must be *combined* using **bitwise**


    **operators** if you want PHP to report multiple error types. For example, to
    report


    all error types *except* notices, the setting is often configured as follows:


    error\_reporting = E\_ALL & ~E\_NOTICE


    You can determine the current error reporting level within a PHP script using


    the error\_reporting function:


    File: **1.php**


    <?php


    echo error\_reporting();


    ?>


    This will display the current level as an integer (e.g. 2047 for E\_ALL). You
    can


    also set the error level using the error\_reporting function. For example:


    File: **2.php**


    <?php


    error\_reporting(E\_ALL ^ E\_NOTICE); // Report all except notices


    echo error\_reporting(); // Displays 2039


    ?>


    In the above example, we tell PHP to report all errors except notices, using the


    bitwise XOR operator, ^, to subtract the E\_NOTICE error level from the E\_ALL


    error level.


    Some other illustrative examples follow:


    321


    Error Levels'
