    \ of the file, which PHP created when the\n\nfile was uploaded\n\n**$\\_FILES\\\
    ['fieldname'\\]\\['error'\\]**\n\n0 if all went well (see the PHP Manual\\[9\\\
    ] for error codes)\n\n**$\\_FILES\\['fieldname'\\]\\['size'\\]**\n\nthe size of\
    \ the file in bytes\n\nHere’s an example of the array of information for a file\
    \ upload, as produced by\n\nPHP’s print\\_r function:\n\nArray\n\n(\n\n \\[name\\\
    ] => php\\_logo.gif\n\n \\[type\\] => image/gif\n\n \\[tmp\\_name\\] => /tmp/php1BB.tmp\n\
    \n \\[error\\] => 0\n\n \\[size\\] => 3872\n\n)\n\nArmed with this knowledge,\
    \ let’s look at a simple script that accepts a GIF file\n\nupload and copies it\
    \ to the files subdirectory of the current directory:²\n\nFile: **8.php**\n\n\
    <?php\n\n// Include Magic Quotes filter\n\nrequire\\_once 'MagicQuotes/strip\\\
    _quotes.php';\n\n// If the form has been submitted...\n\nif (isset($\\_POST\\\
    ['submit'\\])) {\n\n // If the file is a GIF image...\n\n if ($\\_FILES\\['image'\\\
    ]\\['type'\\] == 'image/gif') {\n\n // Copy the file from temporary storage to\
    \ final destination\n\n copy($\\_FILES\\['image'\\]\\['tmp\\_name'\\], \"./files/\"\
    \ .\n\n\\[8\\] http://www.hivemail.com/mime.types.phps\n\n\\[9\\] http://www.php.net/features.file-upload.errors\n\
    \n2The current directory is, by default, the location of the PHP script that was\
