  md: "**How do I display data in a table?**\n\nHTML tables are the natural result\
    \ of much of PHP’s interaction with data stored\n\nin MySQL databases. Having\
    \ a tool in your kit for quick table generation is an\n\nessential time saver\
    \ as you build PHP applications.\n\nThe simplest approach to generating a table\
    \ using the MySQL class I built in\n\nChapter 3 might look like this:\n\nFile:\
    \ **1.php**\n\n$db = &new MySQL($host, $dbUser, $dbPass, $dbName);\n\n$sql = \"\
    SELECT \\* FROM user ORDER BY lastName, firstName\";\n\n$result = $db->query($sql);\n\
    \necho \"<table align=\\\\\"center\\\\\">\\\\n\";\n\necho \"<tr>\\\\n<th>Login</th><th>Name</th><th>Email</th>\\\
    \\n</tr>\";\n\nwhile ($row = $result->fetch()) {\n\n echo \"<tr>\n\n <td>\" .\
    \ $row\\['login'\\] . \"</td>\n\n <td>\" . $row\\['firstName'\\] . ' ' . $row\\\
    ['lastName'\\] . \"</td>\n\n <td>\" . $row\\['email'\\] . \"</td>\n\n </tr>\\\\\
    n\";\n\n}\n\necho \"</table>\";\n\nWhile it’s fine for something simple, this\
    \ method can become a burden as your\n\ntables grow more complex.\n\n**PEAR Shaped\
    \ Tables**\n\nThe \n\ntask \n\nof \n\nbuilding \n\nmore \n\ncomplex \n\ntables\
    \ \n\nis \n\nmade \n\neasier \n\nby\n\nPEAR::HTML\\_Table\\[1\\]. Developed by\
    \ Bertrand Mansion and Adam Daniel,\n\nHTML\\_Table provides a handy API for table\
    \ construction that doesn’t require you\n\nto type a tag of HTML. For complex\
    \ tables, this can save a lot of time, and reduce\n\nyour chance of making mistakes\
    \ with HTML itself. The version used here was\n\n1.5.\n\n\\[1\\] http://pear.php.net/HTML\\\
    _Table\n\n255\n\nHow do I display data in a table?"
  merge: -1
  pgno: 275
- img_proc: true
  md: "Let’s see how it works with a simple example. We’ll repeat the above user list\n\
    \nand add some attractive visuals. First, having included the HTML\\_Table class,\
    \ we’ll\n\nbuild a switch statement that allows us to order the results by a particular\
    \ column:\n\nFile: **2.php**** (excerpt)**\n\n// Include the PEAR::HTML\\_Table\
    \ class\n\nrequire\\_once 'HTML/Table.php';\n\n$db = &new MySQL($host, $dbUser,\
    \ $dbPass, $dbName);\n\n// Basic SQL statement\n\n$sql = \"SELECT \\* FROM user\"\
    ;\n\n// A switch to allow sorting by column\n\nswitch (@$\\_GET\\['sort'\\]) {\n\
    \n case 'login';\n\n $sql .= \" ORDER BY login ASC\";\n\n break;\n\n case 'email';\n\
    \n $sql .= \" ORDER BY email ASC\";\n\n break;\n\n default:\n\n $sql .= \" ORDER\
    \ BY lastName, firstName\";\n\n break;\n\n}\n\nSo far, so good.\n\nTo use HTML\\\
    _Table, you’ll need to be happy with PHP’s arrays; many of the ar-\n\nguments\
    \ accepted by HTML\\_Table are passed in array form. HTML attributes are\n\ntypically\
    \ passed as associative (named) arrays, while row data itself is passed as\n\n\
    indexed (numbered) arrays:\n\nFile: **2.php**** (excerpt)**\n\n// Overall style\
    \ for the table\n\n$tableStyle = array(\n\n 'width' => '650',\n\n 'style' => 'border:\
    \ 1.75px dotted #800080;'\n\n);\n\n// Create the table, passing the style\n\n\
    $table = new HTML\\_Table($tableStyle);\n\n// Define a style for the caption of\
    \ the table\n\n$captionStyle = array(\n\nChapter 9: Web Page Elements\n\n256"
  merge: -1
  pgno: 276
- img_proc: true
  md: " 'style' => 'font-family: Verdana; font-weight: bold;\n\n font-size: 14.75px;\
    \ color: navy;'\n\n);\n\n// Add the caption, passing the text to display and the\
    \ style\n\n$table->setCaption('User List', $captionStyle);\n\n// Define an array\
    \ of column header data\n\n$columnHeaders = array(\n\n '<a href=\"' . $\\_SERVER\\\
    ['PHP\\_SELF'\\] . '?sort=login\">Login</a>',\n\n '<a href=\"' . $\\_SERVER\\\
    ['PHP\\_SELF'\\] . '?sort=name\">Name</a>',\n\n '<a href=\"' . $\\_SERVER\\['PHP\\\
    _SELF'\\] . '?sort=email\">Email</a>'\n\n);\n\n// Add the header row, passing\
    \ header text and using a TH tag\n\n$table->addRow($columnHeaders, '', 'TH');\n\
    \nInside the following while loop, we fetch each row and build an indexed array\n\
    \nout of the associative arrays we’ve retrieved from the database. We then add\
    \ the\n\nindexed array to the table using the addRow method:\n\nFile: **2.php****\
    \ (excerpt)**\n\n// Fetch the result object\n\n$result = $db->query($sql);\n\n\
    // A loop for each row of the result set\n\nwhile ($row = $result->fetch()) {\n\
    \n // Place row data in indexed array\n\n $rowData = array(\n\n $row\\['login'\\\
    ],\n\n $row\\['firstName'\\] . ' ' . $row\\['lastName'\\],\n\n $row\\['email'\\\
    ]\n\n );\n\n // Add the row, passing the data\n\n $table->addRow($rowData);\n\n\
    }\n\nLet’s finish up by applying a few HTML attributes to make the table more\
    \ attract-\n\nive. First, we’ll use setAllAttributes to apply a style to every\
    \ cell. Then, we’ll\n\noverride this style for the first row (numbered 0), using\
    \ setRowAttributes to\n\nmake that text slightly larger. Finally, we’ll use altRowAttributes\
    \ to apply an\n\nalternating style to each row, beginning with the first row of\
    \ real data in the table:\n\n257\n\nPEAR Shaped Tables"
