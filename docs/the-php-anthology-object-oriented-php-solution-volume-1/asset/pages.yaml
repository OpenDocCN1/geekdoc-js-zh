  md: 'Zend, the company developing the core of the PHP engine, also hosts a fairly


    active forum\[20\] for general PHP questions.


    If you want to be guaranteed an answer, it’s worth investigating PHP Help-


    desk\[21\], a service run by Tap Internet\[22\], who have partnered with Zend
    to


    offer PHP training.


    **How do I fix an error that PHP finds in**


    **my script?**


    There you are, half way through your latest and greatest script, and all of a
    sudden


    a test execution delivers this error:


    Parse error: parse error, unexpected T\_ECHO, expecting '','' or '';''


    in c:\\htdocs\\sitepoint\\phpbasics\\2.php on line 5


    The offending code here is as follows:


    File: **2.php**


    <?php


    echo ''This is some code<br />'';


    echo ''Somewhere in here I\\''ve got a '';


    echo ''parse error!<br />''


    echo ''But where is it?<br />'';


    ?>


    What you’re dealing with here is known as a syntax error, and while you’re new


    to PHP you may find yourself spending a lot of time hunting down such problems.


    As you get more experienced with PHP, tracking down syntax errors will become


    easier. You’ll even come to know your own bad habits and probably be able to


    guess the error you made before you start the hunt (my own typical failings are


    forgetting the final quote when building SQL statements in a PHP string and


    leaving out commas when building arrays). Being familiar with PHP’s error


    messages is a good idea, though.


    In general terms, there are four basic types of errors you’ll encounter in your
    PHP


    applications:


    \[20\] http://www.zend.com/phorum/list.php?num=3


    \[21\] http://www.phphelpdesk.com/


    \[22\] http://www.tapinternet.com/


    Chapter 1: PHP Basics


    8'
