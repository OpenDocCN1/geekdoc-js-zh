    \ where, for example, a\n\n$\\_GET variable your code relies upon has not\n\n\
    been initialized. This forces you to write code\n\nthat is more secure and contains\
    \ fewer logic er-\n\nrors, in order to avoid warnings. This also en-\n\nsures\
    \ that your code will run neatly on other\n\nservers configured this way.\n\n\
    error\\_reporting\n\n(default: E\\_ALL & ~E\\_NOTICE)\n\nDetermines whether PHP\
