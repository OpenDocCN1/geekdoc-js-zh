    \nURL, relative to the Web root, using $\\_SERVER\\['PHP\\_SELF'\\], then strip\
    \ out the\n\n$baseUrl. This leaves us with a string we can match against the location\
    \ field\n\nin the menu table. I took this approach for the sake of example, as\
    \ it allowed me\n\nto demonstrate the menu with a single script, while taking\
    \ advantage of Apache’s\n\n“look back” functionality (which we’ll discuss in more\
    \ detail later in this chapter).\n\nUsing this, we can fetch the path fragment\
    \ that appears to the right of the script\n\nname in the URL, and insert it into\
    \ our PHP script. For example, consider this\n\nURL:\n\nhttp://localhost/sitepoint/WebPageElements/12.php/products/\n\
    \nThe actual script name is 12.php; I can examine the additional /products/\n\n\
