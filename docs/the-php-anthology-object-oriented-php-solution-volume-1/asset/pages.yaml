  md: "2.\n\nDetermine the height and width of the original image.\n\n3.\n\nCreate\
    \ a blank thumbnail image of the correct size.\n\n4.\n\nCopy the original image\
    \ to the blank thumbnail.\n\n5.\n\nDisplay the thumbnail using the correct content\
    \ type.\n\nLet’s create a thumbnail from a large version of the SitePoint logo\
    \ in JPEG format:\n\nFile: **1.php**\n\n<?php\n\n// Specify source image\n\n$sourceImage\
    \ = 'sample\\_images/sitepoint\\_logo.jpg';\n\n// Specify thumbnail height and\
    \ width\n\n$thumbWidth = 200;\n\n$thumbHeight = 90;\n\n// Load the source image\n\
    \n$original = imagecreatefromjpeg($sourceImage);\n\n// Get the size of the original\n\
    \n$dims = getimagesize($sourceImage);\n\n// Create a blank thumbnail (note slightly\
    \ reduced height)\n\n$thumb = imagecreatetruecolor($thumbWidth, $thumbHeight);\n\
    \n// Copy a resized version of the original onto the thumbnail\n\nimagecopyresampled($thumb,\
    \ $original, 0, 0, 0, 0,\n\n $thumbWidth, $thumbHeight, $dims\\[0\\], $dims\\\
    [1\\]);\n\n// Send the content header\n\nheader(\"Content-type: image/jpeg\");\n\
    \n// Display the image\n\nimagejpeg($thumb);\n\n?>\n\nIn the above example, we\
    \ used imagecreatefromjpeg to load an image from the\n\nfile system into a PHP\
    \ variable. The getimagesize function tells us the width\n\nand height of the\
    \ image (more on getimagesize in a moment).\n\nThe imagecreatetruecolor function\
    \ is used to create a blank image (in memory,\n\nas a PHP variable) into which\
    \ the thumbnail image will be placed. Note that as\n\nChapter 7: Images\n\n212"
