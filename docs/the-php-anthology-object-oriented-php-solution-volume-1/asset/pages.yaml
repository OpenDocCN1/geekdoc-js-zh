  md: '**Figure 9.5. PHP Logo Uploaded Successfully**


    ![](img/4aa42814ed6f04055a7211c9ee423453_303_0.png)![](img/4aa42814ed6f04055a7211c9ee423453_303_1.png)


    **Be Sure it’s an Upload**


    Perhaps you have a more complicated script in which you passed the tempor-


    ary file name to another PHP variable, performed various tricks, and then


    forgot you’d left a hole in your code—a hole that allowed a user to modify


    the contents of the PHP variable with a different file name! It’s worth using


    the PHP function is\_uploaded\_file to double-check that the uploaded


    file really is the right one before you do anything with it, such as copying it


    to a public directory where others can see it. In the past, people have tricked


    PHP scripts into copying a file containing a password, rather than the image


    that was actually uploaded, to a public directory. Be safe, rather than sorry.


    **Using QuickForm for File Uploads**


    Let’s put our friend QuickForm back into action, and learn to store the files
    in


    MySQL.


    The construction of the form is very similar to the example in “How do I handle


    HTML forms in PHP?”:


    283


    Using QuickForm for File Uploads'
