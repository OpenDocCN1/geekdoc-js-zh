    \ one person at a time. Other\n\ntimes, sending email to a group of people is\
    \ called spamming—something I’m\n\nsure you won’t be doing with PHP!\n\nWith PHPMailer,\
    \ one option you have is to use the addCC and addBCC methods,\n\nwhich allow you\
    \ to add multiple addresses to those fields, operating in the same\n\nway as the\
    \ addAddress method. This approach may not suit your needs, though,\n\nas especially\
    \ large distribution lists can quickly overwhelm your email server if\n\nyou list\
    \ all the addresses in the header of a single email.\n\nA better approach can\
    \ be achieved by sending each email individually, while re-\n\nusing the same\
    \ instance of the PHPMailer class:\n\n245\n\nHow do I mail a group of people?"
