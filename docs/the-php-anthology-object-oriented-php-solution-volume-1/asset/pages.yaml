  md: "ment the second part of our URL simplification (by hiding the name of the PHP\n\
    \nscript), PHP will no longer create this variable for us, so we can’t rely on\
    \ it at\n\nthis stage.\n\nTo help fetch variables from the URL suffix, I’ve created\
    \ the class PathVars for\n\nyou. This class automatically analyzes the URL requested\
    \ by the browser and\n\nfetches all the values in the URL suffix. The class uses\
