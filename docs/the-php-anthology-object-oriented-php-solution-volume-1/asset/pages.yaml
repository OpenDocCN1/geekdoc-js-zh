  md: " // The constructor function\n\n function Page()\n\n {\n\n**$this**\\->page\
    \ = '';\n\n }\n\nWithin any method (including the constructor) $this points to\
    \ the object in\n\nwhich the method is running. It allows the method to access\
    \ the other methods\n\nand variables that belong to that particular object. The\
    \ \\-> (arrow) operator that\n\nfollows $this is used to point at a property or\
    \ method that’s named within the\n\nobject.\n\nIn the example above, the constructor\
    \ assigns an empty string value to the $page\n\nmember variable we declared at\
    \ the start. The idea of the $this variable may\n\nseem awkward and confusing\
    \ to start with, but it’s a common strategy employed\n\nby other programming languages,\
    \ such as Java\\[5\\], to allow class members to in-\n\nteract with each other.\
    \ You’ll get used to it very quickly once you start writing\n\nobject oriented\
    \ PHP code, as it will likely be required for almost every method\n\nyour class\
    \ contains.\n\nOf the other class methods, addHeader and addFooter are almost\
    \ the same as\n\nbefore; however, notice that they no longer return values. Instead,\
    \ they update\n\nthe object’s $page member variable, which, as you’ll see, helps\
    \ simplify the code\n\nthat will use this class. We’ve also used the addContent\
    \ method here; with this,\n\nwe can add further content to the page (e.g. HTML\
