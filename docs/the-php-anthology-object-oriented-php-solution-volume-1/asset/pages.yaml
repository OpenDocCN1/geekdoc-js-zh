  md: '**How do I include one PHP script in**


    **another?**


    Having discovered that writing thousand-line scripts may not be the best way to


    stay organized, you’re probably looking for ways to break your code into separate


    files. Perhaps, while using someone else’s Open Source application, you find


    yourself struggling to eliminate error messages like the one below:


    Fatal error: Failed opening required ''script.php''


    **Mutual Inclusion**


    PHP provides four commands that allow you to add the contents of one PHP


    script to another, namely include, require, include\_once and require\_once.


    In each case, PHP fetches the file named in the command, then executes its


    contents. The difference between include and require is the way they behave


    should they be unable to find the script they were told to fetch.


    include will generate a PHP warning message like this:


    Warning: Failed opening ''script.php'' for inclusion


    This will allow the script that called the include command to continue execution.


    By contrast, require results in a fatal error like the one shown above, which


    means the calling script will terminate, bringing everything to a halt. If the
    file


    that was required is critical to your application, having the script terminate
    is a


    very good thing.


    The include\_once and require\_once commands behave similarly to their re-


    spective cousins, but if the script has already been included or required anywhere


    else (by any of the four commands), the statement will be ignored. At first glance,


    it may not be obvious how these commands can be used; surely you’ll know how


    many times you’ve used an include command, right? Where the \_once commands


    become extremely handy is in more complex applications in which you have PHP


    scripts that include other PHP scripts, which in turn include yet more PHP scripts.


    This is particularly important when you use libraries of classes (which we’ll
    explore


    in Chapter 2), and those classes are being reused repeatedly by many scripts.
    One


    class may depend on another being available; using a require\_once to include


    Chapter 1: PHP Basics


    12'
