    // Strip that tag\n\necho strip\\_tags($text);\n\n?>\n\nThe output is:\n\nThis\
    \ is bold text\n\nYou can also supply strip\\_tags a list of allowed tags that\
    \ you want it to ignore.\n\nFor example,\n\nFile: **2.php**\n\n<?php\n\n$text\
    \ = 'This is <b>bold</b> and this is <i>italic</i>.\n\n What about this <a href=\"\
    http://www.php.net/\">link</a>?';\n\n// Strip those tags\n\necho strip\\_tags($text,\
    \ '<b><i>');\n\n?>\n\nHere’s the HTML it returns:\n\nThis is <b>bold</b> and this\
    \ is <i>italic</i>.\n\n What about this link?\n\nAs you can see, strip\\_tags\
    \ leaves the text between opening and closing tags. If\n\nit finds a < character\
    \ but fails to find a matching \\> character, it will remove all\n\nthe text to\
    \ the end of the string.\n\nRemoving HTML with strip\\_tags does have one drawback,\
    \ however, in the\n\nhandling of attributes. If you allow some tags, your site’s\
    \ members may be able\n\nto use attributes, such as style, within those tags,\
    \ which can result in some very\n\nstrange layouts. Worse still, JavaScript contained\
    \ in a link can result in an cross-\n\nsite scripting (XSS) security exploit (see\
    \ Appendix C).\n\nIn the next solution, I’ll show you how to implement a “custom\
    \ code” system\n\nthat provides a more reliable mechanism to allow certain tags.\
    \ Later on, we’ll\n\nlook at how you could go about examining the contents of\
    \ the attributes them-\n\nselves in order to check that they’re valid.\n\nChapter\
    \ 5: Text Manipulation\n\n148"
