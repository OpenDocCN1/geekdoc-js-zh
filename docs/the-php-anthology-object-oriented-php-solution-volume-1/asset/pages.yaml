    **How do I validate submitted data?**


    Validating strings is often important. How do you make sure that the data a user


    submits via a form is what it’s supposed to be—for example, a URL or an email


    address? Ensuring that the value provided by a user is what it’s supposed to be


    is a common problem. Thankfully, PEAR::Validate is available, saving you from


    reinventing the wheel. The version used here was 0.2.0.


    PEAR::Validate offers a main class for validating strings and values that are


    common to Web applications, as well as a growing number of related internation-


    alized classes for dealing with things like UK post codes and US social security


    numbers. Within each class is a collection of static methods (methods that can


    be called without constructing an object from the class) that are used to validate


    a particular value. Currently, the best way to find out what’s available is to
    look


    at the source code, as this is still a fairly young package with little documentation.


    Parse the files with **PHPDocumentor** to generate the API documentation (see


    Volume II, Chapter 6 for more on PHPDocumentor).


