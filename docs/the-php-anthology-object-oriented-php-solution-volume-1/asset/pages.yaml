  md: "**AddStringAttachment(string, filename\\[, encoding\\[, type\\]\\])**\n\nUsing\
    \ AddStringAttachment, you can supply PHPMailer with a file that\n\nyou’ve already\
    \ stored in a PHP variable, for example, a file that has just been\n\nuploaded\
    \ or a file stored in MySQL.\n\n**AddEmbeddedImage(path, cid, name\\[, encoding\\\
    [, type\\]\\])**\n\nUsing AddEmbeddedImage, you can attach an image and give it\
    \ an id (via\n\n*cid*), which allows you to embed it in the body of an HTML email.\n\
    \nHere’s an example using the AddAttachment method:\n\nFile: **2.php**\n\n<?php\n\
    \n// Include the phpmailer class\n\nrequire 'ThirdParty/phpmailer/class.phpmailer.php';\n\
    \n// Instantiate it\n\n$mail = new phpmailer();\n\n// Modify this\n\n$yourEmail\
    \ = 'your@yourdomain.com';\n\n$yourName = 'Your Name';\n\n// Modify this\n\n$recipientEmail\
    \ = 'your@yourdomain.com';\n\n$recipientName = 'Your Name';\n\n// Define who the\
    \ message is from\n\n$mail->From = $yourEmail;\n\n$mail->FromName = $yourName;\n\
    \n// Set the subject of the message\n\n$mail->Subject = 'Test Attachment';\n\n\
    // Add the body of the message\n\n$body = 'This message has an attachment';\n\n\
    $mail->Body = $body;\n\n// Add an attachment, \n\nif (!$mail->AddAttachment('./files/php\\\
    _logo.gif',\n\n 'php\\_logo.gif',\n\n 'base64', 'image/gif')) {\n\n echo 'Failed\
