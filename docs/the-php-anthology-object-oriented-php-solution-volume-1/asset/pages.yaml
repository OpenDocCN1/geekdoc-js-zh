  md: "Now, let’s say that, in response to one of the options on your user control\
    \ panel,\n\nyou want to make some changes to the look and feel of the site. Let’s\
    \ put this\n\ninto action:\n\nFile: **6.php**** (excerpt)**\n\n$lookandfeel =\
    \ new LookAndFeel(); // Create a LookAndFeel\n\n$output = new Output($lookandfeel);\
    \ // Pass it to an Output\n\n// Modify some settings\n\n$lookandfeel->setColor('red');\n\
    \n$lookandfeel->setSize('large');\n\n// Display the output\n\necho $output->display();\n\
    \nUsing the setColor and setSize methods, we change the color to “red” and the\n\
    \nsize to “large,” right? Well, in fact, no. The output display still says:\n\n\
    Color is white and size is medium\n\nWhy is that? The problem is that we’ve only\
    \ passed a *copy* of the LookAndFeel\n\nobject to $output. So the changes we make\
    \ to $lookandfeel have no effect on\n\nthe copy that $output uses to generate\
    \ the display.\n\nTo fix this we have to modify the Output class so that it uses\
    \ a *reference* to the\n\nLookAndFeel object it is given. We do this by altering\
    \ the constructor:\n\nFile: **7.php**** (excerpt)**\n\n function Output(**&**$lookandfeel)\n\
    \n {\n\n $this->lookandfeel = **&**$lookandfeel;\n\n }\n\nNotice that we have\
    \ to use the reference operation twice here. This is because\n\nthe variable is\
    \ being passed twice—first to the constructor function, then again,\n\nto place\
    \ it in a member variable.\n\nOnce we’ve made these changes, the display looks\
    \ like this:\n\nColor is red and size is large\n\nIn summary, passing by reference\
    \ keeps the target variable “linked” to the source\n\nvariable, so that if one\
    \ changes, so does the other.\n\n45\n\nThe Importance of References"
