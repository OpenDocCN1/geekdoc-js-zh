    \ get method, which is the only method\n\nthat returns a value. Once we’ve finished\
    \ building the page, we’ll use this to create\n\nthe HTML.\n\nAll these methods\
    \ access the $page member variable, and this is no coincidence.\n\nThe ability\
    \ to tie PHP code (the methods) to the data (the variables) that it works\n\n\
    on is the most fundamental feature of object oriented programming.\n\nHere’s the\
    \ class in action:\n\nFile: **3.php**** (excerpt)**\n\n// Instantiate the Page\
    \ class\n\n$webPage = new Page();\n\n// Add the header to the page\n\n$webPage->addHeader('A\
