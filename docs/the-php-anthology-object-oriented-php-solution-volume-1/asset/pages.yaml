  md: 'This allows us to access them again via the property names, as with


    $articles->title.


    Further methods are provided to make the query more complex, for example, the


    whereAdd method:


    File: **24.php**** (excerpt)**


    // Instantiate the DataObject\_Articles class


    $articles = new DataObject\_Articles();


    // Assign a value to use to search the ''Author'' column


    $articles->author = ''Kevin Yank'';


    // Add a where clause


    $articles->whereAdd(''published > '' . mktime(0, 0, 0, 5, 1, 2002));


    // Perform the query


    $articles->find();


    This allows us to add a further condition to the WHERE clause:


    SELECT \* FROM articles


    WHERE published > 1020204000 AND articles.author = ''Kevin Yank''


    There are other similar methods, so if these fail to provide what you need, you


    can use the query method to execute a hand-coded query. Note that if you find


    yourself needing to use the query method, it may be a good idea to create a


    subclass of the generated DataObject class, and wrap the query in a useful


    method name that describes it accurately.


    DB\_DataObject also deals effectively with table joins, which, although slightly


    more detailed than the example above, is certainly a time saver when compared


    with writing complex join queries by hand.


    That concludes our short introduction to DB\_DataObject, but this section should


    have given you a taste of what it can do for you. The big advantage is that it


    makes querying your database with SQL far less exhausting and error-prone. Also,


    by centralizing access to a particular table in a single class, it helps simplify


    dealing with changes to the table structure.


