  md: '# Get stuff done with PHP...


    ''The PHP Anthology, Volume I: Foundations'' is a compilation of best practice
    solutions to common Web Development problems. It focuses on the achievement of
    practical goals with minimal effort by applying well-structured, object oriented
    software design principles.


    # About Harry Fuecks


    ![](img/4aa42814ed6f04055a7211c9ee423453_397_0.png)


    Harry Fuecks has worked in corporate IT since 1994, having completed a Bachelor''s
    degree in Physics. He first came across PHP in 1999, while putting together a
    small intranet. Today, he''s the lead developer of a corporate extranet, an active
    participant in SitePoint''s rich PHP community, and the driving force behind phpPatterns.com.


    # About SitePoint


    ![](img/4aa42814ed6f04055a7211c9ee423453_397_1.png)


    SitePoint specializes in publishing fun, practical and easy-to-understand content
    for Web professionals. Visit sitepoint.com to access our books, newsletters, articles
    and community forums.


    # Need more help?


    Visit the SitePoint Community Forums, located at sitepointforums.com

    For sales and support,email us at books@sitepoint.com


    ![](img/4aa42814ed6f04055a7211c9ee423453_397_2.png)


    USD $39.9'
