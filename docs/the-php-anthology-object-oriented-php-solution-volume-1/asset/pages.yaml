  md: "**Understanding Scope**\n\nWrite more than a few hundred lines of procedural\
    \ PHP code and, no doubt,\n\nyou’ll run into a parser error or, worse still, a\
    \ mysterious bug caused by your ac-\n\ncidentally having used a function or variable\
    \ name more than once. When you’re\n\nincluding numerous files and your code grows\
    \ increasingly complex, you may\n\nfind yourself becoming more paranoid about\
    \ this issue. How do you stop such\n\nnaming conflicts from occurring? One approach\
    \ that can help solve this problem\n\nis to take advantage of **scope** to hide\
    \ variables and functions from code that\n\ndoesn’t need them.\n\nA scope is a\
    \ context within which the variables or functions you define are isolated\n\n\
    from other scopes. PHP has three available scopes: the **global scope**, the **function**\n\
    \n**scope**, and the **class scope**. Functions and variables defined in any of\
    \ these\n\nscopes are hidden from any other scope. The function and class scopes\
    \ are *local*\n\nscopes, meaning that function X’s scope is hidden from function\
    \ Y’s scope, and\n\nvice versa.\n\nThe big advantage of classes is that they let\
    \ you define variables and the functions\n\nthat use them together in one place,\
    \ while keeping the functions hidden from\n\nunrelated code. This highlights one\
    \ of the key theoretical points about the object\n\noriented paradigm. The procedural\
    \ paradigm places most emphasis on functions,\n\nvariables being treated as little\
    \ more than a place to store data between function\n\ncalls. The object oriented\
    \ paradigm shifts the emphasis to variables; the functions\n\n“back” the variables\
    \ and are used to access or modify them.\n\nLet’s explore this through an example:\n\
    \n<?php\n\n// A global variable\n\n**$myVariable** = 'Going global';\n\n// A function\
    \ declared in the global scope\n\nfunction **myFunction()**\n\n{\n\n // A variable\
    \ in function scope\n\n**$myVariable** = 'Very functional';\n\n}\n\n// A class\
    \ declared in the global scope\n\nclass MyClass {\n\n // A variable declared in\
    \ the class scope\n\n var **$myVariable** = 'A class act';\n\nChapter 2: Object\
    \ Oriented PHP\n\n34"
  merge: -1
  pgno: 54
