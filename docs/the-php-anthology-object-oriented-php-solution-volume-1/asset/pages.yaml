  md: "**How do I solve common date problems?**\n\nConsider the types of calculations\
    \ our brains make each time we’re confronted\n\nwith a calendar:\n\n“I’d like\
    \ it finished by the 3^(rd) of March… That’s only five days\n\naway!”\n\nIt’s\
    \ clear there’s more to dealing with dates than simply organizing data in order\n\
    \nof significance, or displaying an individual datum. In this solution, we’ll\
    \ look at\n\nsome of the common problems you may encounter when dealing with dates\
    \ and\n\ntimes. In particular, we’ll see how to deal with\n\nK days of the week\n\
    \nK weeks of the year\n\nK days of the year\n\nK the number of days in a month\n\
    \nK leap years\n\nIn the process, we’ll build a class that can be easily reused\
    \ in your own applica-\n\ntions.\n\nThe following code lays the foundation for\
    \ the class:\n\nFile: **DateTime/DateMath.php**** (in ****SPLIB****) (excerpt)**\n\
    \n<?php\n\n/\\*\\*\n\n \\* DateMath class for solving common date problems\n\n\
    \ \\* @package SPLIB\n\n \\*/\n\nclass DateMath {\n\n /\\*\\*\n\n \\* Unix timestamp\n\
    \n \\* @access private\n\n \\* @var int\n\n \\*/\n\n var $timeStamp;\n\n /\\*\\\
    *\n\nChapter 6: Dates and Times\n\n180"
  merge: -1
  pgno: 200
- img_proc: true
  md: " \\* DateMath constructor\n\n \\* If parameters not provided, DateMath uses\
    \ current time\n\n \\* <code>\n\n \\* $dateMath = new DateMath(2003,8,22); //\
    \ Uses 22nd August 2003\n\n \\* $dateMath = new DateMath(); // Uses current date\
    \ and time\n\n \\* </code>\n\n \\* @param int year ( e.g. 2003 )\n\n \\* @param\
    \ int month ( e.g. 8 for August )\n\n \\* @param int day of month ( e.g. 22 )\n\
    \n \\* @param int hours ( e.g. 15 )\n\n \\* @param int minutes ( e.g. 5 )\n\n\
    \ \\* @param int seconds ( e.g. 7 )\n\n \\*/\n\n function DateMath($y = NULL,\
    \ $m = NULL, $d = NULL, $h = NULL,\n\n $i = NULL, $s = NULL)\n\n {\n\n $time =\
    \ time();\n\n $y = is\\_numeric($y) ? $y : date('Y', $time);\n\n $m = is\\_numeric($m)\
    \ ? $m : date('m', $time);\n\n $d = is\\_numeric($d) ? $d : date('d', $time);\n\
    \n $h = is\\_numeric($h) ? $h : date('H', $time);\n\n $i = is\\_numeric($i) ?\
    \ $i : date('i', $time);\n\n $s = is\\_numeric($s) ? $s : date('s', $time);\n\n\
    \ $this->timeStamp = mktime($h, $i, $s, $m, $d, $y);\n\n }\n\n /\\*\\*\n\n \\\
    * For setting a Unix timestamp\n\n \\* @param int a Unix timestamp\n\n \\* @return\
    \ void\n\n \\* @access public\n\n \\*/\n\n function setTimeStamp($timeStamp)\n\
    \n {\n\n $this->timeStamp = $timeStamp;\n\n }\n\nThe constructor checks to see\
    \ whether you’ve passed any values for a date, the\n\narguments appearing in the\
    \ order year, month, day, hour, minute and finally\n\nsecond. Any parameter for\
    \ which you fail to provide a numeric value will assume\n\nthe current date or\
    \ time. The constructor then turns this into a timestamp, which\n\nwill make later\
    \ calculations easier.\n\nIf I want to begin with a timestamp, I can use the setTimeStamp\
    \ method to\n\nprovide my own.\n\n181\n\nHow do I solve common date problems?"
