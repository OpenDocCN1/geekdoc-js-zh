  md: "File: **20.php**\n\n<?php\n\n// Include PEAR::Archive\\_Tar\n\nrequire\\_once\
    \ 'Archive/Tar.php' ;\n\n// Instantiate Archive\\_Tar\n\n$tar = new Archive\\\
    _Tar('demo/demo.tar.gz', 'gz');\n\n// An array of files to archive\n\n$files =\
    \ array(\n\n 'demo/example.ini',\n\n 'demo/writeSecureScripts.html'\n\n);\n\n\
    // Create the archive file\n\n$tar->create($files);\n\necho 'Archive created';\n\
    \n?>\n\nIt’s pretty simple. When instantiating the class, the second argument\
    \ tells\n\nArchive\\_Tar what type of compression to use—the alternative to gz\
    \ (for gzip)\n\nis bz2 (for bzip2). You can simply omit the second argument if\
    \ you don’t require\n\ncompression. The array of file names needs to be specified\
    \ when you use the\n\ncreate method, the file paths being relative to the location\
    \ where the above\n\nscript is executed. That’s it.\n\nTo extract the file again,\
    \ we could use the following code:\n\nFile: **21.php**\n\n<?php\n\n// Include\
