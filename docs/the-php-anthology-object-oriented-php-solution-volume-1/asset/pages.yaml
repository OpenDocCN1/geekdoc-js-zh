    _NAME'\\], which is the *actual* path of the script:\n\nFile: **19.php**** (excerpt)**\n\
    \n<?php\n\n// Include the PathVars class\n\nrequire\\_once 'Url/PathVars.php';\n\
    \necho '$\\_SERVER\\[\\\\'REQUEST\\_URI\\\\'\\] is ' . $\\_SERVER\\['REQUEST\\\
    _URI'\\] .\n\n '<br />';\n\necho '$\\_SERVER\\[\\\\'SCRIPT\\_NAME\\\\'\\] is '\
    \ . $\\_SERVER\\['SCRIPT\\_NAME'\\] .\n\n '<br />';\n\n// Instaniate PathVars\n\
    \n$pathVars = &new PathVars($\\_SERVER\\['SCRIPT\\_NAME'\\]);\n\nPathVars compares\
