  md: "This displays the entire file as we did using readfile, and produces the display\n\
    \nshown in Figure 4.3. This example is meant more as a simple demonstration of\n\
    \nfile handles in action. Notice that when we use fread, the second argument is\n\
    \nthe size in bytes from the start of the file which should be read. For this\
    \ argument,\n\nI’ve used the filesize function, which tells me the total size\
    \ of the file. In gen-\n\neral fread is really only useful for reading a limited\
    \ portion of a file; to fetch a\n\ncomplete file it will usually be more efficient\
    \ to work with file\\_get\\_contents\n\nor file, depending on your needs.\n\n\
    **Saving Memory**\n\nWhat you’ve seen so far is fine for small files. However,\
    \ an argument that’s sim-\n\nilar to that applied to the use of queries like SELECT\
    \ \\* FROM table also applies\n\nto reading files; if you use file or file\\_get\\\
    _contents to read a large file, PHP\n\nwill be forced to fill a lot of memory\
    \ with its contents.\n\nTo solve this problem, a different approach can be used\
    \ to read the contents of\n\na file, read the file in stages, and operate on the\
    \ contents as you go. This approach\n\nuses functions like fgets:\n\nFile: **5.php**\n\
    \n<?php\n\n// Open the file handle for reading\n\n$fp = fopen('demo/writeSecureScripts.html',\
    \ 'r');\n\n// Loop until the end of the file\n\nwhile (!feof($fp)) {\n\n // Get\
    \ a chunk to the next linefeed\n\n $chunk = fgets($fp);\n\n echo $chunk;\n\n}\n\
    \n// Close the file handle!\n\nfclose($fp);\n\n?>\n\nThe connection is opened\
    \ as normal. Next, we use a while loop, which continues\n\nso long as the feof\
    \ function returns FALSE. feof returns TRUE if the end of the\n\nfile has been\
    \ reached, or if there’s an error with the file handle (such as a loss of\n\n\
    connection, which can happen with remote files).\n\n117\n\nSaving Memory"
