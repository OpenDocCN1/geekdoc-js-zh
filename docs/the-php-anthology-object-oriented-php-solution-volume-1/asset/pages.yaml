    ?>\n\nNotice the mode we used to open the new file with fopen. The mode w will\
    \ mean\n\nthat anything written to the file starts at the top, overwriting anything\
    \ that already\n\nexists. If we’d used a instead, the new contents would have\
    \ been appended to\n\nthe file, preserving the original contents. In either case,\
    \ if the file doesn’t exist it\n\nwill be created.\n\nHere’s how to achieve the\
    \ same thing with PEAR::File, which provides the added\n\nbenefit of locking the\
    \ file while it’s being written:\n\n119\n\nHow do I modify a local file?"
