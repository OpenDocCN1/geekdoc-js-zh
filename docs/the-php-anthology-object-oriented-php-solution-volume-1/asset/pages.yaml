    MySQL also provides the SQL statements BACKUP TABLE and RESTORE TABLE,


    which allow you to copy the contents of a table to another location on your file


    system. Unlike the mysqldump utility, tables backed up in this way preserve their


    original format (which is not human-readable) but this mechanism does not re-


    quire access to a command line utility, so it could be executed via a Web page.


    The general syntax for these statements is as follows:


    BACKUP TABLE *tbl\_name*\[, *tbl\_name* ...\]


    TO ''/path/to/backup/directory''


    RESTORE TABLE *tbl\_name*\[, *tbl\_name* ...\]


    FROM ''/path/to/backup/directory''


    Note that on Windows systems it’s best to specify paths using forward slashes


    (e.g. C:/backups).


