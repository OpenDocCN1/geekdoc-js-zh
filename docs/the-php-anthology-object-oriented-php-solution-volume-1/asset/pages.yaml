    that you have the PEAR::DB database abstraction library installed (see Appendix
    D


    for more information on installing PEAR libraries).


    The first step in getting started with DB\_DataObject is to point it at your database


    and tell it to generate the DataObject classes that will constitute your interface


    with the tables. DB\_DataObject automatically examines your database, using


    MySQL’s introspection functionality, and generates a class for each table in the


    database, as well as a configuration file containing the details of the columns


    defined by the table. To let DB\_DataObject know where your database can be


    found, you need to provide it a configuration file like this one:


    File: **db\_dataobject.ini**


    \[DB\_DataObject\]


    ; PEAR::DB DSN


    database = mysql://harryf:secret@localhost/sitepoint


    ; Location where sitepoint.ini schema file should be created


    schema\_location = /htdocs/phpanth/SPLIB/ExampleApps/DataObject


    ; Location where DataObject classes should be created


    class\_location = /htdocs/phpanth/SPLIB/ExampleApps/DataObject


    ; Prefix for including files from your code


    require\_prefix = ExampleApps/DataObject


    ; Classes should be prefixed with this string e.g. DataObject\_User


    class\_prefix = DataObject\_


    ; Debugging information: 0=off, 1=display sql, 2=display results,


    ; 3=everything


    debug = 0


    ; Prevent SQL INSERT, UPDATE or DELETE from being performed


    debug\_ignore\_updates = false


    ; Whether to die of error with a PEAR\_ERROR\_DIE or not


    dont\_die = false


    The above ini file obeys the same formatting rules as php.ini. Most important


    is the first line, which is a PEAR::DB DSN string that defines the variables needed


    to connect to the database. This file is used both to generate the DataObject


    classes, and to use them in performing queries.


    With that in place, we can use this script (which must be run from the command


    line) to generate the classes:


    File: **22.php**


    <?php


    // Builds the DataObjects classes


    $\_SERVER\[''argv''\]\[1\] = ''db\_dataobject.ini'';


