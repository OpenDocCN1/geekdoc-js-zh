    \ number\\_format(($size / 1073741824), 2);\n\n $unit = 'GB';\n\n } else if ($size\
    \ >= 1048576) {\n\n $size = number\\_format(($size / 1048576), 2);\n\n $unit =\
    \ 'MB';\n\n } else if ($size >= 1024) {\n\n $size = number\\_format(($size / 1024),\
