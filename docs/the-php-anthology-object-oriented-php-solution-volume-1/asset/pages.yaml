  md: 'Another option is the readfile function, which fetches the content of the file


    and displays it directly on screen:


    File: **3.php**


    <?php


    // Read file and display it directly


    readfile(''demo/writeSecureScripts.html'');


    ?>


    One line of code displays the file exactly as it was found, as shown in Figure
    4.3.


    **Figure 4.3. Direct Output with ****readfile**


    ![](img/4aa42814ed6f04055a7211c9ee423453_135_0.png)


    Of course, because I only downloaded the HTML—not the associated images


    and CSS files—the appearance isn’t quite the same as the original.


    **File Handles**


    The above file functions simply require that you point them at the file they have


    to read, using a path relative to the PHP script that executed the function. The


    majority of PHP’s file functions use a slightly different mechanism to “connect”


    115


    File Handles'
