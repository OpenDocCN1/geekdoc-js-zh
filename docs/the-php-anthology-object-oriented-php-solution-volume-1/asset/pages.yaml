  md: 'urlencode and similar functions should only be applied to text as it is being
    used


    to create an HTML document. Don’t be lulled into the trap of modifying the


    text before you store it in the database! In the above example, I had to render


    the user name in two different formats. If, instead, I had applied the urlencode


    to the user name before I inserted it into the database, I’d need to apply


    urldecode whenever I wanted to display the user name as normal text. I’d also


    run into problems when performing operations such as searching the database;


    I’d need yet more code to translate between the two versions. All this can be


    avoided if we simply insert the text into the database “as is”, and encode it
    only


    as required.


    **Form Fields and HTML Content**


    We face another catch in dealing with HTML form elements that should be pre-


    populated with a value—perhaps one that’s taken from a database.


    Imagine you have a form that allows users to edit the details of their account


    with your site, such as the “profile” page that’s common in online forums. In
    the


    form there’s a text field that allows users to modify their “nickname.” The field


    might look something like this:


    <input type="text" name="nickname"


    value="<?php echo **$nickname**; ?>" />


    The value of the $nickname variable would come from your database. If the user


    has a nickname like “Joe Bloggs” there’s no problem. The final HTML that’s de-


    livered to the browser will be:


    <input type="text" name="nickname"


    value="**Joe Bloggs**" />


    But what happens if someone uses a nickname like “Joe "The Hacker" Bloggs”?


    The form element will end up looking like this:


    <input type="text" name="nickname"


    value="Joe "The Hacker" Bloggs" />


    This is bad news for Web browsers. At best, they’ll display a form field containing


    just the name “Joe”; at worst, they’ll scramble the page completely.


    Again, it’s PHP to the rescue! The function htmlspecialchars will identify


    characters that are likely to cause problems, and convert them to a special code


    so that browsers recognize them as being part of the *content*. The characters
    in


    145


    Form Fields and HTML Content'
