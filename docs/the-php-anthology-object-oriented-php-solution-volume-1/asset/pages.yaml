  md: "**Formatting**\n\nTwo other powerful functions are the printf and sprintf functions,\
    \ the former\n\ndisplaying the output to the screen, the latter to another string.\
    \ Here’s an example:\n\nFile: **7.php**\n\n<?php\n\n$fruit = array('banana', 'mango',\
    \ 'pear');\n\n$price = array('30', '50', '35');\n\n// A string with formatting\n\
    \n$format = \"A %1\\\\$s costs %2\\\\$d cents.<br />\\\\n\";\n\nfor ($i = 0; $i\
    \ < 3; $i++) {\n\n printf($format, $fruit\\[$i\\], $price\\[$i\\]);\n\n}\n\n?>\n\
    \nThis produces the following output:\n\nA banana costs 30 cents.\n\nA mango costs\
    \ 50 cents.\n\nA pear costs 35 cents.\n\nIn this example, $format contains special\
    \ characters that printf and sprintf\n\nrecognize and replace with a value we\
    \ supply. For more details, refer to the PHP\n\nManual\\[3\\].\n\nPHP also has\
    \ the ability to treat strings as arrays, at least from the point of view\n\n\
    of simple syntax. For example:\n\nFile: **8.php**\n\n<?php\n\n$string = 'Hello\
    \ World!';\n\n$length = strlen($string);\n\nfor ($i = 0; $i < $length; $i++) {\n\
    \n echo $string\\[$i\\] . '<br />';\n\n}\n\n?>\n\n\\[3\\] http://www.php.net/sprintf\n\
    \nChapter 5: Text Manipulation\n\n152"
