  md: "Now we can modify the query to use a LIMIT clause generated by the pager:\n\
    \nFile: **4.php**** (excerpt)**\n\n// Basic SQL statement\n\n$sql = \"SELECT \\\
    * FROM user\";\n\n// A switch to allow sorting by column\n\nswitch (@$\\_GET\\\
    ['sort'\\]) {\n\n case 'login';\n\n $sql .= \" ORDER BY login ASC\";\n\n break;\n\
    \n case 'email';\n\n $sql .= \" ORDER BY email ASC\";\n\n break;\n\n default:\n\
    \n $sql .= \" ORDER BY lastName, firstName ASC\";\n\n break;\n\n}\n\n// Add the\
    \ LIMIT clause\n\n$sql .= \" LIMIT \" . $pager->getStartRow() . \", \" .\n\n $pager->getRowsPerPage();\n\
    \nAll that remains now is to define the CSS classes currentPage and pageLink,\n\
    \nwhich we’ve specified in the pager’s settings, and display the links below the\n\
    \ntable:\n\nFile: **4.php**** (excerpt)**\n\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
    \ XHTML 1.0 Transitional//EN\"\n\n \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n\n<head>\n\n<title> Users\
    \ </title>\n\n<meta http-equiv=\"Content-Type\"\n\n content=\"text/html; charset=iso-8859-1\"\
    \ />\n\n<style type=\"text/css\">\n\n**.currentPage**\n\n{\n\n font-family: verdana;\n\
    \n font-size: 10px;\n\n font-weight: bold;\n\n color: red;\n\n}\n\n**.pageLink**\n\
    \n{\n\nChapter 9: Web Page Elements\n\n266"
