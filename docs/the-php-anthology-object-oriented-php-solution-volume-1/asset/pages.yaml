    $sql = \"SELECT \\* FROM articles\";\n\n$result = $db->query($sql);\n\nwhile ($row\
    \ = $result->fetch()) {\n\n // Add a string as a file\n\n $tar->addString('articles/'\
    \ . $row\\['article\\_id'\\] . '.txt',\n\n $row\\['body'\\]);\n\n}\n\necho 'Article\
    \ archive created';\n\n?>\n\nHere, we’ve queried a database using the MySQL class\
    \ we created in Chapter 3,\n\nand used the addString method to add to the archive\
    \ as files some of the data\n\nwe fetched. The first argument represents the path\
    \ and filename under which\n\nthe string should be stored; the second is the string\
    \ itself.\n\nThat should give you a general idea of when Archive\\_Tar can be\
