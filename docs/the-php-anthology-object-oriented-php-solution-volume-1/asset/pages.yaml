    \ we decide on the suffix for the\n\nnumber? In this case, the built-in date function\
    \ provides the answer with its S\n\nformatting character:\n\n// Retrieve the day\
    \ of the month, with suffix\n\n$dayOfMonth = date('jS');\n\nOn February 3, this\
    \ would result in $dayOfMonth being '3rd'.\n\nHowever, what if we want to apply\
    \ a suffix for a number that *isn’t* a day of the\n\nmonth? You may have noticed\
    \ in the section called “Day of the Year” that what\n\nwe got back was a message\
    \ like this:\n\n22nd March 2003 is day 81 of the year\n\nOf course, “the 81^(st)\
    \ day of the year” would have been more natural. What we\n\nneed is a little code\
