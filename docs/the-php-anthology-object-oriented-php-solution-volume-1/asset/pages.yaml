  md: "**How do I add a watermark to an image?**\n\nAnother common problem you may\
    \ have to solve is how to **watermark** an image,\n\nthat is, how to place some\
    \ identifying image or text to show that you own the\n\ncopyright. With the GD\
    \ library and PHP, it’s a snap!\n\nIf you have a logo or some other identifiable\
    \ graphic with a transparent back-\n\nground, you can easily place this over another\
    \ image:\n\nFile: **6.php**\n\n<?php\n\n// Load the original image\n\n$image =\
    \ imagecreatefrompng('sample\\_images/mysql\\_logo.png');\n\n// Get image width\n\
    \n$iWidth = imagesx($image);\n\n// Allow transparent images...\n\nimagealphablending($image,\
    \ true); \n\n// Get the watermark image\n\n$watermark = imagecreatefrompng(\n\n\
    \ 'sample\\_images/sitepoint\\_watermark.png');\n\n// Get the height and width\n\
    \n$wmWidth = imagesx($watermark);\n\n$wmHeight = imagesy($watermark);\n\n// Find\
    \ the far right position\n\n$xPos = $iWidth - $wmWidth;\n\n// Copy the watermark\
    \ to the top right of original image\n\nimagecopy($image, $watermark, $xPos, 0,\
    \ 0, 0, $wmWidth,\n\n $wmHeight);\n\n// Send the HTTP content header\n\nheader('Content-Type:\
    \ image/png');\n\n// Display the final image\n\nimagejpeg($image);\n\n?>\n\nThe\
    \ process is simply a matter of loading the original image and switching on\n\n\
    **alpha blending** (drawing transparency), so that images with transparent back-\n\
    \n223\n\nHow do I add a watermark to an image?"
