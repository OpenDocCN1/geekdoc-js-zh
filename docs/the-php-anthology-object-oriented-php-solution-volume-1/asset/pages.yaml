  md: "**Reusable Code**\n\nYou’ve just seen the most simplistic way to connect to\
    \ MySQL. It’s often more\n\nuseful, however, to “package” the above code in a\
    \ function or a class so it can be\n\nreused.\n\nAs a function we could have:\n\
    \nFile: **2.php**\n\n<?php\n\nfunction &connectToDb($host, $dbUser, $dbPass, $dbName)\n\
    \n{\n\n // Make connection to MySQL server\n\n if (!$dbConn = @mysql\\_connect($host,\
    \ $dbUser, $dbPass)) {\n\n return false;\n\n }\n\n // Select the database\n\n\
    \ if (!@mysql\\_select\\_db($dbName)) {\n\n return false;\n\n }\n\n return $dbConn;\n\
    \n}\n\n$host = 'localhost'; // Hostname of MySQL server\n\n$dbUser = 'harryf';\
    \ // Username for MySQL\n\n$dbPass = 'secret'; // Password for user\n\n$dbName\
    \ = 'sitepoint'; // Database name\n\n$dbConn = &connectToDb($host, $dbUser, $dbPass,\
    \ $dbName);\n\n?>\n\nThis reduces the process of connecting to MySQL and selecting\
    \ a database to a\n\nsingle line (two if you count the include statement, which\
    \ would point to a\n\nseparate file containing the connectToDb function):\n\n\
    $dbConn = &connectToDb($host, $dbUser, $dbPass, $dbName);\n\nNote that we’ve used\
    \ the reference operator &. This operator and the role it plays\n\nwere covered\
    \ in detail in Chapter 2.\n\n69\n\nReusable Code"
