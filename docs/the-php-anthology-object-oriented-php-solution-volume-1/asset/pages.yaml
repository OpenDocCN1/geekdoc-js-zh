    With luck, you’ll need to use these commands only once or twice, but it’s worth


    being prepared in advance so you can react effectively (without even a hint of


    panic creeping into your actions).


    **Do I really need to write SQL?**


    A good quality to posses as a programmer is laziness—the desire to do as much


    as possible with the minimum amount of effort. Although you may not want to


    cite it as one of your strong points in a job interview, being motivated to make


    life easier for yourself is a significant boon in developing a well designed applica-


    tion.


    Now that you’ve read this chapter on PHP and MySQL, I think it’s a good time


    to reveal that I hate SQL not because there’s anything wrong with it, as such,


    but because it always causes me grief. If there’s a syntax error in my PHP, for


    example, PHP will find it for me. But PHP *won’t* find errors in SQL statements,


    and MySQL error messages can be less than revealing. If I’m hand coding SQL


    in an application, I’ll spend a fair amount of time debugging it—time I could


    have spent taking it easy!


    What if you could avoid having to write SQL statements altogether? If you think


    back to “How do I create flexible SQL statements?”, where we constructed SQL


    strings “on the fly” based on incoming variables, you may have had an inkling


    that there would be some kind of generic solution to make generating SQL even


    easier. Well, there is! It’s called PEAR::DB\_DataObject\[3\].


    DB\_DataObject is a class that encapsulates the process of writing SQL statements


    in a simple API. It takes advantage of the native “grammar” of SQL and presents


    you with a mechanism that removes almost any need to write any SQL yourself.


    As an approach to dealing with databases, it’s usually described as a **database**


    **persistence layer**, or, alternatively, as using the **Data Access Objects**
    (DAO)


    design pattern. You’ll find further discussion of the general techniques used
    by


    DB\_DataObject at the end of this chapter.


    Here, I’ll provide a short introduction to DB\_DataObject to get you started,
    as


    it’s a subject that could easily absorb a whole chapter if examined in depth.
    The


    DB\_DataObject documentation\[4\] on the PEAR Website should provide you


    \[3\] http://pear.php.net/DB\_DataObject


    \[4\] http://pear.php.net/manual/en/package.database.db-dataobject.php


    Chapter 3: PHP and MySQL


