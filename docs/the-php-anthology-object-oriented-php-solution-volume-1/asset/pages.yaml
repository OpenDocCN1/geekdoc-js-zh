  md: "File: **6.php**\n\n<?php\n\n// Include the QuickForm class\n\nrequire\\_once\
    \ 'HTML/QuickForm.php';\n\n// Instantiate the QuickForm class\n\n$form = new HTML\\\
    _QuickForm('quickForm2', 'POST');\n\n// Add a text input field called firstName,\
    \ labelled\n\n// \"Enter your name\"\n\n$form->addElement('text', 'firstName',\
    \ 'Enter your name');\n\n**// Rule to validate with JavaScript and PHP**\n\n**$form->addRule('firstName',\
    \ 'Please enter your name', 'required',**\n\n** FALSE, 'client');**\n\n// Add\
    \ a submit button called submit with \"Send\" as the text\n\n// for the button\n\
    \n$form->addElement('submit', 'submit', 'Send');\n\n// If the form is submitted...\n\
    \nif (**$form->validate()**) {\n\n // Display the submitted value \"firstName\"\
    \n\n echo 'Hello ' . $form->getSubmitValue('firstName');\n\n} else {\n\n // If\
    \ not submitted, display the form\n\n $form->display();\n\n}\n\n?>\n\nThe addRule\
    \ method provides the means to add validation rules to the form.\n\nThe inclusion\
    \ of the argument client tells QuickForm to use JavaScript for form\n\nvalidation\
    \ on the client side. Note that when you use client side validation,\n\nQuickForm\
    \ will continue to validate the form on the server side for browsers in\n\nwhich\
    \ JavaScript is turned off.\n\nWe can use the validate method to check whether\
    \ the form has been submitted.\n\nNote that if the form fails to validate in PHP,\
    \ it is again displayed to users along\n\nwith a message that tells them what\
    \ they did wrong (see Figure 9.3).\n\n271\n\nForms in Action with QuickForm"
