  md: '**Dates and Times**


    **6**


    Wouldn’t it be nice if we had a ten-day week? How about 100 minutes in an


    hour? Ten months each year?


    Dates and times are probably something you take for granted. You deal with


    them every day and are probably unaware of the clever mathematical algorithms


    your brain uses to work out how long you have to wait before Friday comes


    around again. It’s only when you start programming that you realize that what


    you’ve been taking for granted all these years is not as easy to deal with in
    code


    as you’d expect. Blame the Romans!


    In our day-to-day lives, we’re used to working with decimal (base ten) numbers,


    which are optimized for dealing with groups of ten (ten ones in ten, ten tens
    in


    a hundred, ten hundreds in a thousand, etc.). Avoiding a math lecture, the


    problem with dates and times is that they don’t break down into groups of ten:


    K In one second you have one thousand milliseconds. No problem.


    K In one minute you have sixty seconds.


    K In one hour you have sixty minutes.


    K In one day you have twenty-four hours.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'So, how do you calculate the number of days given a value in milliseconds?
    That’s


    a *stack* of long division! And that’s just time—what about dates?


    K In one week, you have seven days (does your week begin on Sunday or


    Monday?)


    K In one month you have… er… you don’t know exactly how many days or


    weeks; it depends on the month (and don’t get me started on leap years!)


    K In one year you have twelve months.


    Of course, that’s too easy. How about making it more difficult? You often need


    to be able to express a date in multiple formats such as “Tuesday 18th March,


    2003”, “03/18/03” (US format), “18/03/03” (European format), “18th Mar 2003”,


    and “20030318” (a MySQL-style timestamp), not to forget “1047942000” (a


    Unix timestamp)!


    How do you plan to display a list of articles fetched from a database and ordered


    by date? What if you want to present something more complex, such as an online


    calendar? There’s a lot to think about when dealing with dates and times in your


    applications.


    PHP really helps to make times and dates as painless as possible, thanks to


    powerful functions like date. But it’s important to develop the right strategy
    for


    dealing with dates and times early in your career as a PHP programmer. Take


    the right approach from day one, and you’ll avoid having to go back later and


    write insanely complex code to fix the mistakes you made as a newbie. In this


    chapter, we’ll be looking at the kinds of strategies you can employ, and solving


    some of the common problems you’ll face when it comes to dates and times.


    **How do I store dates in MySQL?**


    At first glance, the easiest way to store dates in MySQL may appear to be to


    simply drop them in exactly as they’d appear on a Web page, for example, as


    “18th March 2003”. Be warned—this is the first step on the path to serious hair


    loss. The WHERE clause in an SQL statement run against MySQL will not allow


    you to do things like this:


    SELECT \* FROM table WHERE date > ''14th February 2003''


    A far better way to store date information is to use a **timestamp**. Timestamps


    are numbers that identify dates and times in a format that can be used to solve


    Chapter 6: Dates and Times


    172'
