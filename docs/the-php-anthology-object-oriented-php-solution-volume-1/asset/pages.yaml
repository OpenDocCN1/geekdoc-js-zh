  md: "The most obvious way to change the filename that appears in the URL is to re-\n\
    \nname the file; that is, we could simply rename the script article.php to article.\n\
    \nOf course, without the .php extension, Apache has no way of knowing that the\n\
    \nfile is a PHP script. By default, therefore, it will simply send the unparsed\
    \ PHP\n\ncode straight to the browser—definitely *not* what we want!\n\nTo correct\
    \ this, we need to tell Apache specifically to treat the file as a PHP script.\n\
    \nThis can be done easily with a .htaccess file, but you first need to make sure\n\
    \nApache is configured to allow it. If you’re working on your own server, you\
    \ simply\n\nneed to ensure that AllowOverride is set to All in Apache’s httpd.conf\
    \ file. If\n\nyou’re working with a Web host, you’ll need to ask them to do the\
    \ honours. Once\n\nthat’s done, drop the following code into a file named .htaccess,\
    \ and save it in\n\nthe same directory as the script you want to rename:\n\nFile:\
    \ **forcetype/.htaccess**\n\n<Files *article*\\>\n\n ForceType application/x-httpd-php\
    \ \n\n</Files>\n\nThis directive tells Apache to treat the file named *article*\
    \ as a PHP script.\n\nSimple, right?\n\nTo try this out yourself, check out the\
    \ forcetype directory in the code archive\n\nfor this chapter. I’ve set it up\
    \ with a script called article and a .htaccess file\n\nthat identifies it as a\
    \ PHP script. Here’s the code for article:\n\nFile: **forcetype/article**\n\n\
    <?php\n\n// Include the PathVars class\n\nrequire\\_once 'Url/PathVars.php';\n\
    \n// Create instance of PathVars\n\n$pathVars = new PathVars($\\_SERVER\\['SCRIPT\\\
    _NAME'\\]);\n\necho 'This is the article script<br />';\n\nif ($pathVars->fetchByIndex(0))\
    \ {\n\n echo 'The article ID is ' . $pathVars->fetchByIndex(0);\n\n}\n\n?>\n\n\
    Try loading it with an article ID in the URL suffix (e.g. http://www.ex-\n\nample.com/phpanth/WebPageElements/forcetype/article/123).\
    \ If Apache is cor-\n\n311\n\nHiding PHP Scripts with ForceType"
