    _Tar\n\n$tar = new Archive\\_Tar('demo/demo.tar.gz');\n\n// Create the archive\
    \ file\n\n$tar->extract('extract');\n\necho 'Archive extracted';\n\n?>\n\n139\n\
    \nHow do I create compressed ZIP/TAR files with PHP?"
