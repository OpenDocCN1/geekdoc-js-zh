  md: "PHP arrays, others champion XML documents, still others plumb for using a\n\
    \ndatabase. Each approach has advantages and disadvantages, although the future\n\
    \nmay see XML become the prevalent mechanism for storing this kind of informa-\n\
    \ntion as it becomes an easier format for developers to work with.\n\nHere, we’ll\
    \ adopt the last approach: storing the data in MySQL. This method\n\nmakes building\
    \ and fetching menus easy—it’s simply a case of inserting new rows\n\ninto a table,\
    \ and selecting them later. It also makes the construction of the final\n\nmenu\
    \ in different “styles” easy; other approaches, such as text files, may tie us\n\
    \nto a particular menu design and can require some heavy duty text editing during\n\
    \ndevelopment.\n\nThe disadvantage of MySQL is that, without handy stored procedures\
    \ to help\n\nus, we’ll have to fetch the entire contents of the menu table in\
    \ one go and use\n\nPHP to manipulate them to reflect the structure we desire.\
    \ Performing multiple\n\nqueries to build a menu can result in a drag on your\
    \ application, which grows\n\nwith the addition of each new menu item. The other\
    \ problem with MySQL is\n\nthe issue of editing and deleting menu items, which\
    \ will impact the relationships\n\nbetween “branches” of the menu. We’ll solve\
    \ the former problem here, and leave\n\nyou to work out how to do the latter.\n\
    \nLet’s look again at the table structure we’ll use:\n\nCREATE TABLE menu (\n\n\
    \ menu\\_id INT(11) NOT NULL AUTO\\_INCREMENT,\n\n parent\\_id INT(11) NOT NULL\
    \ DEFAULT '0',\n\n name VARCHAR(255) NOT NULL DEFAULT '',\n\n description TEXT\
    \ NOT NULL,\n\n location VARCHAR(255) NOT NULL DEFAULT '',\n\n PRIMARY KEY (menu\\\
    _id),\n\n UNIQUE KEY location (location)\n\n)\n\nIn this table, we use a recursive\
    \ relationship between rows; each row has its own,\n\nunique menu\\_id (the primary\
    \ key for the table), and a field called parent\\_id\n\nthat relates the row to\
    \ its “parent” row in the same table. This way, we can define\n\nmenu items that\
    \ appear “below” other menu items to create a tree structure. The\n\ndefault parent\\\
    _id of 0 is used to define “root” nodes that have no parent (top\n\nlevel menu\
    \ items, in other words).\n\nOf the other fields, name is the name of the menu\
    \ item itself, as it would appear\n\non the menu. The description allows us to\
    \ give visitors more information about\n\neach menu item. More important is the\
    \ location field, which we’ve defined as\n\nChapter 9: Web Page Elements\n\n290"
