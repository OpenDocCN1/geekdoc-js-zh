  md: 'PHP’s four include commands should not be confused with the various file-related


    functions (discussed in Chapter 4); these are intended for fetching files without


    parsing them immediately as PHP scripts, thereby allowing you to work on their


    contents.


    Note that throughout this book I’ll be talking about “including” a file even when


    I’m using one of the require commands. This is a common convention for talking


    about PHP that stems from older programming languages used by the first PHP


    pioneers.


    **Path Finding**


    So far, I’ve only looked at including files in the same directory as the script
    that


    contains the include command. In practice, you’ll usually want to organize files


    into subdirectories based on the job they do. This can be a source of much con-


    fusion, particularly when you’re using third party code, as there are numerous


    alternative approaches to dealing with includes in other directories.


    The first thing to be aware of is that all includes are calculated *relative*
    to the


    directory in which the main script (where execution began) resides. For example,


    imagine we have three files in the following locations:


    /home/username/www/index.php


    /home/username/www/includes/script.php


    /home/username/www/another.php


    First, let’s consider index.php. The command include ''includes/script.php'';


    will correctly include script.php, assuming index.php is the actual file requested.


    But what if we use the following command in script.php:


    include ''../another.php''; // ???


    If script.php is the page we’re viewing, this command will correctly include


    another.php. However, if index.php is the page we’re viewing, and it includes


    script.php, this command will fail, because the location of another.php is cal-


    culated relative to the location of index.php, *not* relative to script.php.


    We have two choices. We can modify script.php so that it includes another.php


    as follows:


    include ''another.php'';


    15


    Path Finding'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'Alternatively, we can enter the full path to another.php, like this:


    include ''/home/username/www/another.php'';


    This leaves no doubt as to where another.php is located.


    The PHP configuration file php.ini also contains the directive include\_path.


    This allows you to specify directories from which files can be included, without


    the need to specify their locations when using one of the include commands.


    This approach needs to be used with caution, as it may lead to strange results
    if


    an included file of the same name exists in more than one directory, yet it can


    be an effective means to solve include-related headaches. PHP’s PEAR\[25\] class


    library, for example, relies on your adding the directory that contains PEAR’s


    include files to the include path. Note also that it’s not a good idea to specify


    too many locations in your include path, as this will slow PHP down when it


    tries to find the scripts you’ve included in your code.


    If you’re using Apache in a shared hosting environment, you may be able to


    override the value of include\_path using a .htaccess file. Placed in the directory


    to which you want it to apply (it will also apply to all subdirectories), the
    file


    should contain something like this:


    php\_value include\_path ".:/usr/local/lib/php:/home/*user*/phplib/"


    The same can also be accomplished with the PHP function ini\_set, for example:


    ini\_set(''include\_path'', ''C:/phplib/'');


    This allows changes to be made at runtime from within a PHP script.


    You’ll find a reference to php.ini values in Appendix A.


    **How do I write portable PHP code?**


    Not all PHP installations are the same. Depending on version and configuration


    settings in php.ini, your script may or may not run correctly on another server


    where PHP is installed. However, there are some general good practices you can


    adopt to make life easier and minimize the need to rewrite code for other servers.


    \[25\] http://pear.php.net/


    Chapter 1: PHP Basics


    16'
