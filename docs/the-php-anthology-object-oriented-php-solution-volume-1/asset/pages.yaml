    \n {\n\n // Perform a query using the MySQL class\n\n $sql = \"SELECT \\* FROM\
    \ articles LIMIT 0,5\";\n\n $this->result = &$this->db->query($sql);\n\n }\n\n\
    \ function fetch()\n\n {\n\n return $this->result->fetch();\n\n }\n\n}\n\n// Create\
    \ an instance of the MySQL class\n\n$db = &new MySQL('localhost', 'harryf', 'secret',\
    \ 'sitepoint');\n\n// Create an instance of the Article class, passing it the\
    \ MySQL\n\n// object\n\n$articles = &new Articles($db);\n\nwhile ($row = $articles->fetch())\
    \ {\n\n echo '<pre>';\n\n print\\_r($row);\n\n echo '</pre>';\n\n}\n\n?>\n\nIn\
    \ the above example, we instantiate the MySQL class outside the Articles class,\n\
    \nthen pass it to the Articles constructor as Articles is instantiated. Articles\n\
    \nis then able to use the MySQL object to perform a specific query. In this case,\n\
    \nArticles* aggregates* the MySQL object. Figure 2.2 illustrates this relationship\
    \ with\n\nUML.\n\n57\n\nAggregation"
