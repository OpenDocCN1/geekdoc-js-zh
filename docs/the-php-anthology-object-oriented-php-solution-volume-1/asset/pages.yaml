    \n }\n\n function getSize()\n\n {\n\n return $this->size;\n\n }\n\n function setColor($color)\n\
    \n {\n\n $this->color = $color;\n\n }\n\n function setSize($size)\n\n {\n\n $this->size\
    \ = $size;\n\n }\n\n}\n\nNext, we have a class that deals with rendering output:\n\
    \n43\n\nThe Importance of References"
