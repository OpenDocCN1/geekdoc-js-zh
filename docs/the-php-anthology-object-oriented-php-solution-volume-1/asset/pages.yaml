  md: 'Combined with the logging mechanisms we’ll discuss in Chapter 10, this would


    allow you to build up statistics of script performance across your site.


    **How do I schedule batch jobs with PHP?**


    Being able to use cron jobs⁵ is an ideal way to execute scripts on a regular basis


    irrespective of what’s happening on your site. However, if you don’t have access


    to cron, or you’re running PHP on a system that lacks an effective “batch execu-


    tion” tool, another alternative exists in the form of pseudo-cron\[6\]. If ever
    you’re


    looking for an example of the ingenuity of PHP developers, look no further than


    this!


    The way pseudo-cron works is by using the normal hits on your site to execute


    PHP scripts in the background. Particularly cunning is the way it uses a script


    that behaves as an image to execute other PHP scripts without impacting the


    performance of the page a visitor is viewing. All you need to do is use an HTML


    img tag to insert the image script into a page that’s viewed regularly.


    **Installing Pseudo-cron**


    The version of pseudo-cron I used was 1.22. If your php.ini setting


    short\_open\_tag is off, make sure you edit the files that come with pseudo-cron


    to provide a full <?php opening tag.


    Step one is to place the contents of the ZIP file somewhere on your site—ideally


    in a directory outside your Web directory, to prevent any potential security risks.


    Next, edit the following sections of the file pseudo-cron.inc.php to your liking:


    $cronTab = ''/home/username/pseudocron/cronjobs/crontab.txt'';


    $writeDir = ''/home/username/pseudocron/cronjobs/'';


    $useLog = 1;


    5Cron is a program that runs on most Unix-based systems. It allows tasks—often
    called “cron jobs”—to


    be scheduled for execution at regular intervals.


    \[6\] http://www.bitfolge.de/?l=en&s=pseudocron


    205


    How do I schedule batch jobs with PHP?'
