  md: "The easiest way to see how inheritance works in PHP is by example. Let’s say\
    \ we\n\nhave this simple class:\n\nFile: **8.php**** (excerpt)**\n\n<?php\n\n\
    class Hello {\n\n function sayHello()\n\n {\n\n return 'Hello World!';\n\n }\n\
    \n}\n\nUsing the extends keyword, we can make a class that’s a child of Hello:\n\
    \nFile: **8.php**** (excerpt)**\n\nclass Goodbye **extends Hello** {\n\n function\
    \ sayGoodbye()\n\n {\n\n return 'Goodbye World!';\n\n }\n\n}\n\nGoodbye is now\
    \ a child of Hello. Expressed the other way around, Hello is the\n\n**parent**\
    \ or **superclass** of Goodbye. Now, we can simply instantiate the child class\n\
    \nand have access to the sayHello and the sayGoodbye methods using a single\n\n\
    object:\n\nFile: **8.php**** (excerpt)**\n\n$msg = &new Goodbye();\n\necho $msg->sayHello()\
    \ . '<br />';\n\necho $msg->sayGoodbye() . '<br />';\n\n?>\n\nThat example shows\
    \ the basics of how inheritance works, but doesn’t demonstrate\n\nits real power…\
    \ This comes with the addition of overriding.\n\n**Overriding**\n\nWhat happens\
    \ when we give a function in the child the same name as a function\n\nin the parent?\
    \ An example:\n\n49\n\nOverriding"
