  md: "**Figure 2.2. Aggregation**\n\n![](img/4aa42814ed6f04055a7211c9ee423453_78_0.png)\n\
    \n**Composition**\n\nComposition occurs when one object “completely owns” another\
    \ object. That is,\n\nthe first object was responsible for creating (instantiating)\
    \ the second object.\n\nThere are many cases in which this can be useful, although,\
    \ typically, composition\n\nis used when it’s likely that the first object will\
    \ be the only one that needs to use\n\nthe second object.\n\nOne example from\
    \ Volume II, Chapter 1 is the Auth class, which **composes** an\n\ninstance of\
    \ the Session class, creating it in the constructor:\n\nclass Auth {\n\n …\n\n\
    \ /\\*\\*\n\n \\* Instance of Session class\n\n \\* @var Session\n\n \\*/\n\n\
    \ var $session;\n\n …\n\n function Auth (&$dbConn, $redirect, $md5 = true)\n\n\
    \ {\n\n $this->dbConn = &$dbConn;\n\n $this->redirect = $redirect;\n\n $this->md5\
    \ = $md5;\n\n**$this->session = &new Session();**\n\n $this->checkAddress();\n\
    \n $this->login();\n\n }\n\nChapter 2: Object Oriented PHP\n\n58"
  merge: -1
