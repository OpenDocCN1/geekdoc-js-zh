    **URL Rewriting and PathVars**


    Pay special attention to the way PathVars is instantiated in this example:


    // MODIFY THIS FOR YOUR CONFIGURATION!!!


    $baseUrl = ''/phpanth/WebPageElements/rewrite/'';


    // Create instance of PathVars


    $pathVars = new PathVars($baseUrl);


    One side-effect of URL rewriting is that $\_SERVER\[''SCRIPT\_NAME''\] and


    $\_SERVER\[''REQUEST\_URI''\] can no longer be compared in order to find


    the URL suffix. The former contains the *actual* name of the PHP script, while


    the latter contains the URL that the browser actually requested.


    For this reason, when you use PathVars in a URL rewriting setup like this,


    you need to supply the constructor with the path to the directory that con-


    tains .htaccess, instead of simply passing it $\_SERVER\[''SCRIPT\_NAME''\]


    as we’ve done before.


    To put it simply, when using URL rewriting, give PathVars the portion of


    the URLs that you want it to ignore.


    Note also that we’ve made use of the $baseUrl variable when building links,


    rather than $\_SERVER\[''PHP\_SELF''\]. The latter would include index.php in
    the


    links again, which we don’t want.


    **Designing URLs**


    PHP based Websites are typically a collection of **applications** that perform
    dif-


    ferent tasks, each with its own identifiable URL. For example:


    **http://www.example.com/forums/**


    a forum


    **http://www.example.com/blog/**


    a Web log (or “blog”)


    **http://www.example.com/downloads/**


    a download manager


    Chapter 9: Web Page Elements


    314'
