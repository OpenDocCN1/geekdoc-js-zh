    **What is my time zone?**


    To determine the value to set for major cities all over the world, visit


    http://www.bsdi.com/xdate/.


    But how can you change the environment so that the date and time functions


    display values for the specific time zone you want them to reflect? On Linux


    systems, this is easily achieved in a global manner, using PHP’s putenv function


    to set the system’s TZ variable for the current script execution:


    File: **15.php**


    <?php


    echo ''Current time: '' . date(''H:i:s T O'') . ''<br />'';


    putenv(''TZ=Europe/London'');


    echo ''New time: '' . date(''H:i:s T O'');


    ?>


    ![](img/4aa42814ed6f04055a7211c9ee423453_223_1.png)


    **putenv and Internet Information Services (IIS)**


    Be aware that on some Windows servers (particularly on Microsoft IIS), the


    putenv function affects not only the current script execution, but the entire


    server process.


    In the above example, the first time you invoke the script you will see the


    time zone change, but thereafter you will see the same time zone displayed


    by both echo statements. To return the server to your system’s default time


    zone, you will have to either restart it or use putenv again to set the TZ


    variable it to its original value.


    On my Linux server, this displays the following:


    Current time: 09:31:10 EST -0500


    New time: 14:31:10 GMT +0000


    By using the php.ini setting auto\_prepend\_file, you can apply the change to


    every PHP script executed on your site, making sure all instances of date or time


    use the correct time zone. If you cannot change php.ini, or you need to restrict


    the change to a particular site or directory on your server, use a .htaccess file


    with a command like this one:


    php\_value auto\_prepend\_file ''/path/to/set\_timezone.php''


    203


    How do I deal with time zones?'
