- img_proc: true
  md: 'The $cronTab variable points to the file that contains your crontab schedule⁶.


    The format is very similar to traditional cron (see the section called “Further


    Reading”). The $writeDir variable specifies a location that will be used to write


    the log files of cron executions. In the distribution, this is a relative directory


    location; if you’ve placed the code in a secure directory, you will need to specify


    the full path. You will also need to provide public read and write permissions
    to


    this directory so that the Web server user has permission to write to it; this
    comes


    with the usual security warning to users of a shared Web server: other users will


    also have access to this directory. That, of course, assumes you wish to write
    log


    files; you can switch them off by setting $useLog to 0.


    Next, edit the following line in imagecron.php so that it includes the correct
    file:


    include("/home/username/pseudocron/pseudo-cron.inc.php");


    The file crontab.txt is used to specify PHP scripts that will be executed by


    pseudo-cron. For example:


    #mi h d m dow job


    0 1 \* \* \* /home/user/pseudocron/cronjobs/dbbackup.php


    \*/30 9-17 \* \* 1-5 /home/user/pseudocron/cronjobs/rssupdate.php


    0 2 \* \* \* /home/user/pseudocron/cronjobs/webstats.php


    0 9 1 \* \* /home/user/pseudocron/cronjobs/report.php


    The cron schedule format takes a little getting used to, but is well described
    on


    the Web (see the section called “Further Reading” for a recommendation).


    In this particular case the first script, dbbackup.php, representing a database


    backup, is run every day at 01:00. The rssupdate.php script, which might be


    updating news feeds, is run every thirty minutes between 9:00 and 17:00 from


    Monday to Friday (note you can also use Mon-Fri instead of 1-5). On the second


    hour of every day, webstats.php is run, a job which processes visitor data captured


    from the last day. Finally, at 09:00 on the first day of every month, the re-


    port.php script is run, which mails a report of various critical information about


    the site to it its administrator.


    The files specified in crontab.txt are included by pseudo-cron.inc.php. Be


    aware that it’s up to you to make sure the scripts don’t contain any critical
    errors


    (this may result in pseudo-cron.inc.php failing to execute other scripts as well).


    6To set up tasks for execution by cron on a Unix system, a user has traditionally
    had to use a separate


    program named crontab. The name has grown to be used as the name for the group
    of cron tasks


    that have been configured on a system.


    Chapter 6: Dates and Times


    206'
