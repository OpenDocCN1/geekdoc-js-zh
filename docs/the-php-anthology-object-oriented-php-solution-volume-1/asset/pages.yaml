  md: "If you’ve read some of the earlier solutions in this book, you’ll know I advocate\n\
    \nthe use of classes in PHP. This solution gives me a chance to illustrate this\
    \ point\n\nto full effect, as we select an open source class that will make implementing\
    \ a\n\nBBCode system easy.\n\nThe class in question is called BBCode, developed\
    \ by Leif K-Brooks and available\n\nfrom PHP Classes\\[4\\]. This class meets\
    \ nearly all your BBCode needs, and is\n\nsupplied with the code for this book.\
    \ It is licensed under the PHP license\\[5\\].\n\nThe most important method of\
    \ this class is the add\\_tag method. It takes as its\n\nargument an associative\
    \ array, which can contain up to six keys describing the\n\ntag in question. Let’s\
    \ look at some examples of the add\\_tag method in action.\n\nThe following example\
    \ registers the BBTag, \\[b\\]:\n\n$this->bbcode->add\\_tag(\n\n array(\n\n 'Name'\
    \ => 'b',\n\n 'HtmlBegin' => '<span style=\"font-weight: bold;\">',\n\n 'HtmlEnd'\
    \ => '</span>'\n\n )\n\n);\n\nThe Name of the tag is b. The HtmlBegin and HtmlEnd\
    \ keys in the array define\n\nthe HTML start and end tags that will be used once\
    \ the BBTags have been con-\n\nverted.\n\nThe following sets up another BBTag,\
    \ \\[link\\]:\n\n$this->bbcode->add\\_tag(\n\n array(\n\n 'Name' => 'link',\n\n\
    \ 'HasParam' => TRUE,\n\n 'HtmlBegin' => '<a href=\"%%P%%\">',\n\n 'HtmlEnd' =>\
    \ '</a>'\n\n )\n\n);\n\nThis code registers another key, HasParam, which tells\
    \ the class that this BBTag\n\nhas a single attribute that should be displayed\
    \ in the converted text. Notice also\n\nthe HtmlBegin value. Here we use the string\
    \ %%P%% to identify where the parameter\n\nshould be placed.\n\n\\[4\\] http://www.phpclasses.org/browse.html/package/951.html\n\
    \n\\[5\\] http://www.php.net/license/2\\_02.txt\n\nChapter 5: Text Manipulation\n\
    \n154"
  merge: -1
  pgno: 174
- img_proc: true
  md: "In this next example, which creates a size tag, we see a new key. ParamRegex\n\
    \ndefines a regular expression to which the parameter must conform; in this case,\n\
    \nit’s a number that corresponds to a font size. Here’s the code:\n\n$this->bbcode->add\\\
    _tag(\n\n array(\n\n 'Name' => 'size',\n\n 'HasParam' => TRUE,\n\n 'HtmlBegin'\
    \ => '<span style=\"font-size: %%P%%pt;\">',\n\n 'HtmlEnd' => '</span>',\n\n 'ParamRegex'\
    \ => '\\[0-9\\]+'\n\n )\n\n);\n\nThis final example demonstrates all keys of the\
    \ array in action, and introduces\n\nthe key ParamRegexReplace, which can be used\
    \ to modify a parameter. In this\n\ncase, it allows a BBTag such as \\[color=c5c6c7\\\
    ] to become <span style=\"color:\n\n#c5c6c7;\">:\n\n$this->bbcode->add\\_tag(\n\
    \n array(\n\n 'Name' => 'color',\n\n 'HasParam' => TRUE,\n\n 'ParamRegex' => '\\\
    [A-Za-z0-9#\\]+',\n\n 'HtmlBegin' => '<span style=\"color: %%P%%;\">',\n\n 'HtmlEnd'\
    \ => '</span>',\n\n 'ParamRegexReplace' => array('/^\\[A-Fa-f0-9\\]{6}$/'=>'#$0')\n\
    \n )\n\n);\n\nI’ve wrapped all this stuff neatly in a class called SitepointBBCode\
    \ (TextManip-\n\nulation/SitePointBBCode.php in SPLIB), which creates the custom\
    \ tags in its\n\nconstructor. This allows us to define BBTags simply by instantiating\
    \ the class.\n\nLet’s look at this code in action:\n\nFile: **9.php**\n\n<?php\n\
    \n// Include the BBCode class\n\nrequire\\_once 'ThirdParty/bbcode/bbcode.inc.php';\n\
    \n// Include the SitepointBBCode class which defines custom tags\n\nrequire\\\
    _once 'TextManipulation/SitepointBBCode.php';\n\n$text=<<<EOD\n\nHere is some\
    \ <b>bold HTML which is unparsed</b>.\n\n155\n\nHow do I implement custom formatting\
    \ code?"
