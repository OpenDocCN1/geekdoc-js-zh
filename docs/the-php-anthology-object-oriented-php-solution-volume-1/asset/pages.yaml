    \n**How do I search my table?**\n\nSome people are just impatient; rather than\
    \ trawling your site with the friendly\n\nnavigation system you’ve provided, they\
    \ demand information now! Hence PHP\n\ndevelopers like you and I are required\
    \ to implement search features to provide\n\nvisitors a “short cut” to find the\
    \ information they want. In the days of storing\n\nall content in the form of\
    \ HTML files, this could be quite a problem, but now\n\nthat you’re using a database\
    \ to store content, searching becomes much easier.\n\n**Select What You ****LIKE**\n\
    \nThe most basic form of search occurs against a single column, with the LIKE\
    \ op-\n\nerator:\n\nSELECT \\* FROM articles WHERE title **LIKE** 'How %'\n\n\
    The % is a wildcard character. The above statement will select all articles in\
    \ which\n\nthe title begins with the word “How.” MySQL also has support for POSIX\
    \ regular\n\n95\n\nHow do I search my table?"
