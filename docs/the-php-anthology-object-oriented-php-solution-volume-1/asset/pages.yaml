    Displaying text on top of an image is even easier. For example:


    File: **7.php**


    <?php


    // Load the original image


    $image = imagecreatefrompng(''sample\_images/mysql\_logo.png'');


    // Get a color and allocate to the image pallet


    $color = imagecolorallocate($image, 153, 153, 153);


    // Add the text to the image


    imagestring($image, 3, 0, 0, ''Skippy 2003'', $color);


    // Send the HTTP content header


    header(''Content-Type: image/png'');


    // Display the final image


    imagejpeg($image);


    ?>


    The imagecolorallocate function allows you to create a new color to use for


    drawing on the image by specifying the red, green, and blue components. The


    function returns a number, which identifies that color in the image.


    Once you have the color in hand, you can use the imagestring function to place


    the text over the image. The second argument of the function is a font number,


    where numbers 1 to 5 refer to built-in fonts. You can use imagefontload to make


    your own fonts available. The third and fourth arguments represent the horizontal


