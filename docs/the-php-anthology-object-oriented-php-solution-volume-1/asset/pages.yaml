  md: 'You have the option of using fetch to iterate through the extracted path variables,


    or you can use fetchByIndex, which returns the variable for which you supplied


    the index. You can also use size to find out how many variables the object has


    found. Finally, fetchAll can be used to return the complete array of path vari-


    ables. Figure 9.13 shows the output if we’re given a URL such as http://www.ex-


    ample.com/phpanth/WebPageElements/19.php/this/is/?a=test/of/the/class/.


    **Figure 9.13. Extracted Path Variables**


    ![](img/4aa42814ed6f04055a7211c9ee423453_330_0.png)


    In particular, note that the PathVars class detected and ignored the query string


    style segment of the URL (?a=test). This was achieved by design, so that the


    presence of a query string (e.g. a session identifier automatically generated
    by


    PHP) does not interfere with the variables in your URL suffix.


    **Hiding PHP Scripts with ****ForceType**


    Having successfully moved query string variables to the URL suffix, all we need


    to do to achieve search-engine friendly URLs is to hide the filename of the PHP


    script. That is, we want to transition from http://www.example.com/art-


    icle.php/123/4 to http://www.example.com/article/123/4. There are actually


    two distinct ways to do this; in this section I’ll explain the most straightforward


    of the two, and I’ll cover the second method in the next. As with the method for


    reading URL suffixes, both techniques rely on useful features of the Apache Web


    server.


    Chapter 9: Web Page Elements


