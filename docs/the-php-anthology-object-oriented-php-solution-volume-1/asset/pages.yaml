  md: "On Windows systems, no such luck; if you are not able to change the time zone\n\
    \nsettings of your server yourself, you’ll need to resort to translating the time\
    \ zone\n\nusing PHP, which means you won’t be able to call date and time directly.\n\
    \n**How do I time a PHP script?**\n\nAs you find yourself building bigger and\
    \ more complicated applications with\n\nPHP, it’s often a good idea to know what\
    \ impact your code is having on overall\n\nperformance; the Internet is already\
    \ slow, especially for those using dialup con-\n\nnections, and making your visitors\
    \ wait won’t encourage them to come back for\n\nmore. Discovering how long your\
    \ scripts take to execute can be achieved easily\n\nwith PHP’s microtime function:\n\
    \nFile: **16.php**\n\n<?php\n\nfunction getMicroTime()\n\n{\n\n list($usec, $sec)\
    \ = explode(\" \", microtime()); \n\n return (float)$usec + (float)$sec;\n\n}\
    \ \n\n$start = getMicroTime();\n\nfor ($i = 0; $i < 5; $i++) {\n\n sleep(1);\n\
    \n}\n\necho 'Script took: ' . (getMicroTime() - $start);\n\n?>\n\nThe above code\
    \ tells me “Script took: 4.9990350008011”, which is a time in\n\nseconds. microtime\
    \ returns a string value of the format *decimal\\_part*\n\n*in-*\n\n*teger\\_part*.\
    \ Exploding this result and adding them together gets the floating\n\npoint time\
    \ in seconds. This approach to timing scripts simply involves noting\n\nthe time\
    \ before the script begins, and again when all execution has finished. The\n\n\
    microtime function is used to provide a time that’s precise enough to be useful.\n\
    \nIf you want to build an overall picture of what’s going on within your site,\
    \ you\n\ncould use the php.ini settings auto\\_prepend\\_file and auto\\_append\\\
    _file to\n\ntime all scripts, or with a .htaccess file like so:\n\nphp\\_value\
    \ auto\\_prepend\\_file '/path/to/script\\_start.php'\n\nphp\\_value auto\\_append\\\
    _file '/path/to/script\\_end.php'\n\nChapter 6: Dates and Times\n\n204"
