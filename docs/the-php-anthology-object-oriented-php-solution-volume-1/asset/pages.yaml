    \ this makes it easy to reuse Calendar as a tool to build\n\nother calendars that\
    \ look and behave differently for the end user.\n\n**How do I deal with time zones?**\n\
    \nEver since Britannia ruled the waves, the world has been encumbered with the\n\
    \nproblem that all time is centered on an area of London called Greenwich. Now\n\
    \nhome to the National Maritime Museum, Greenwich is home to many a dimly\n\n\
    lit pub where you’ll find it’s a good idea not to mention you’re from out of town.\n\
    \nUsing landlubber terminology, time zones operate east and west around the globe,\n\
    \nand measure how many hours before or after Greenwich the sun reaches its\n\n\
    highest point in the day. The fact that no one ever sees the sun in Greenwich\n\
    \napparently never deterred early sailors, who used clocks set to Greenwich Mean\n\
    \nTime (GMT) to work out how far east or west they’d traveled round the globe.\n\
    \nThese days, GMT is also referred to as coordinated universal time (UTC), Zulu\n\
    \ntime, universal time, or simply world time.\n\nDealing with time zones is almost\
    \ as problematic for today’s Web developer as\n\nit was for the early explorers,\
    \ and it requires some effort to make sure you get it\n\nright. Maybe the country\
    \ in which your site is hosted is in a different time zone\n\nto the one in which\
    \ you’re based. You may also need to allow visitors to set their\n\nown time zone,\
    \ so your site can adapt time-sensitive content accordingly.\n\nYour host should\
    \ provide you with a server that’s configured correctly and provides\n\nyou with\
    \ a time value that you’ll be able to use through PHP’s date and time\n\nfunctions.\
    \ The server should also be accurately configured for the time zone in\n\nwhich\
    \ it resides. You can check these values with PHP’s date function, as shown\n\n\
    here:\n\n<?php\n\n echo date('H:i:s T O');\n\n?>\n\nThis will return something\
    \ like:\n\nChapter 6: Dates and Times\n\n202"
