  md: 'dealing with file uploads in the next solution. For an example in which we


    modify the appearance of QuickForm, see the “sign up” form developed in Volume


    II, Chapter 1.


    **How do I upload files with PHP?**


    It’s often handy to be able to allow your site members to upload files to the


    site—so that other members can download them, for example. With PHP the


    solution is, as always, very easy. Note that full documentation is available in
    the


    PHP Manual\[7\].


    ![](img/4aa42814ed6f04055a7211c9ee423453_300_0.png)


    **Setting the Maximum Upload Size**


    PHP has two settings in php.ini that limit the maximum size of file uploads.


    The first, post\_max\_size, controls the maximum amount of data that can


    be sent to a script with the POST method. By default this is set to eight


    megabytes. The second setting, upload\_max\_filesize, specifically limits


    the size of uploaded files, and is set to two megabytes by default. It may be


    necessary to increase these two settings if you expect large file uploads.


    See Appendix A for more details.


    If you’re familiar with HTML forms, you’ll already know that the addition of a


    file upload field to a form is a simple matter. You just have to add the attribute


    enctype="multipart/form-data" to the form tag, and add the necessary input


    tag to the form:


    <input type="file" name="*fieldname*" />


    When file upload is submitted to a PHP script, the file is stored safely in your


    Website’s temporary directory (usually /tmp on a Linux system) and is given a


    unique temporary file name, so that your PHP script can make use of it. The in-


    formation about the file is contained in the $\_FILES array, along with a key
    that


    corresponds to the name of the form field (i.e. $\_FILES\[''*fieldname*''\]. The
    in-


    formation is stored as another array containing five values:


    **$\_FILES\[''fieldname''\]\[''name''\]**


    the original name of the file


    \[7\] http://www.php.net/features.file-upload.php


    Chapter 9: Web Page Elements


    280'
