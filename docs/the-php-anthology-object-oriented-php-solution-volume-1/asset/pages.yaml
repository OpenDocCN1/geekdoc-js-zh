    \ add this code to the DateMath class:\n\nFile: **DateTime/DateMath.php**** (in\
    \ ****SPLIB****) (excerpt)**\n\n /\\*\\*\n\n \\* Provide the suffix for a number\
    \ e.g. 22 is the 22nd\n\n \\* @static\n\n \\* @param int some number\n\n \\* @return\
    \ string e.g. 'nd' for 22nd\n\n \\* @access public\n\n \\*/\n\nChapter 6: Dates\
