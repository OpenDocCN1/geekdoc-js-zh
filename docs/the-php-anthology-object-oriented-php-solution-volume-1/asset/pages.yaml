  md: "This extended class provides the information we’ll need to construct the query.\n\
    \nNow, let’s add the pager to the user table we built in “How do I display data\
    \ in\n\na table?”:\n\nFile: **4.php**** (excerpt)**\n\n// Include the PEAR::HTML\\\
    _Pager\\_Sliding class\n\nrequire\\_once 'HTML/Sliding.php';\n\n// Include the\
    \ extended class\n\nrequire\\_once 'DB\\_Pager\\_Sliding.php';\n\n// Instantiate\
    \ MySQL\n\n$db = &new MySQL($host, $dbUser, $dbPass, $dbName);\n\n$sql = \"SELECT\
    \ COUNT(\\*) AS num\\_rows FROM user\";\n\n$result = $db->query($sql);\n\n$row\
    \ = $result->fetch();\n\n// Define pager settings\n\n$pager\\_params = array(\n\
    \n // The total number of rows\n\n 'totalItems' => $row\\['num\\_rows'\\],\n\n\
    \ // Rows per page\n\n 'perPage' => 10,\n\n // The size of the sliding Window\
    \ +/-\n\n 'delta' => 2,\n\n // Separator and spacing between links\n\n 'separator'\
    \ => '.',\n\n 'spacesBeforeSeparator' => 2,\n\n 'spacesAfterSeparator' => 2,\n\
    \n // The $\\_GET variable name\n\n 'urlVar' => 'page',\n\n // Browser status\
    \ bar text\n\n 'altPrev' => 'Previous Page',\n\n 'altNext' => 'Next Page',\n\n\
    \ 'altPage' => 'Page: ',\n\n // CSS Class names\n\n 'curPageLinkClassName' =>\
    \ 'currentPage',\n\n 'linkClass' => 'pageLink',\n\n);\n\n// Instantiate the pager\n\
    \n$pager = &new DB\\_Pager\\_Sliding($pager\\_params);\n\n// Fetch the HTML links\n\
    \n$links = $pager->getLinks();\n\n265\n\nSliding Page Numbers"
