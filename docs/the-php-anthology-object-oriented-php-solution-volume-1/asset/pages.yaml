- img_proc: true
  md: "The above query will start at row number 5 and select a total of 10 rows. All\
    \ you\n\nneed now is some PHP that constructs this clause dynamically, passing\
    \ the row\n\nnumber at which the query will start and the number of rows it will\
    \ select.\n\n![](img/4aa42814ed6f04055a7211c9ee423453_280_0.png)\n\n**When to\
    \ Implement a Result Pager**\n\nAs a general rule, if you have full table scan\
    \ queries such as SELECT \\* FROM\n\nuser, you should consider implementing a\
    \ result pager.\n\nWhile you’re developing your application you may not notice\
    \ a problem,\n\nbut once you have a table containing thousands of records and\
    \ your site’s\n\nachieving high levels of traffic, MySQL will be hard-pressed\
    \ to deal with all\n\nthose queries. Also, depending on how you write your PHP,\
    \ your scripts may\n\ntake an increasingly long time to execute as the number\
    \ of rows in the table\n\ngrows.\n\nThe trick is to come up with the PHP code\
    \ that generates those two magic\n\nnumbers in the LIMIT clause. In general, the\
    \ first step is to get MySQL to tell\n\nyou how many rows there are in the “unpaged”\
    \ result set. This will typically re-\n\nquire a COUNT query:\n\nSELECT COUNT(\\\
    *) AS num\\_rows FROM user\n\nTo ascertain the total number of pages, we simply\
    \ divide the number of rows in\n\nthe result set by the number of rows to be displayed\
    \ per page. We can then\n\nidentify which row will begin each page by multiplying\
    \ the page number by the\n\nnumber of rows that appear per page.\n\nThis is easier\
    \ to see with some code. First, let’s put together a simple paging class\n\nthat\
    \ encapsulates these calculations:\n\nFile: **Database/SimplePager.php**** (in\
    \ ****SPLIB****) (excerpt)**\n\n/\\*\\*\n\n \\* SimplePager class\n\n \\* Used\
    \ to help calculate the number of pages in a database result\n\n \\* set\n\n \\\
    * @access public\n\n \\* @package SPLIB\n\n \\*/\n\nclass SimplePager {\n\n /\\\
    *\\*\n\n \\* Total number of pages\n\n \\* @access private\n\n \\* @var int\n\n\
    \ \\*/\n\nChapter 9: Web Page Elements\n\n260"
  merge: -1
  pgno: 280
- img_proc: true
  md: " var $totalPages;\n\n /\\*\\*\n\n \\* The row MySQL should start its select\
    \ with\n\n \\* @access private\n\n \\* @var int\n\n \\*/\n\n var $startRow;\n\n\
    \ /\\*\\*\n\n \\* SimplePager Constructor\n\n \\* @param int number of rows per\
    \ page\n\n \\* @param int total number of rows available\n\n \\* @param int current\
    \ page being viewed\n\n \\* @access public\n\n \\*/\n\n function SimplePager($rowsPerPage,\
    \ $numRows, $currentPage = 1)\n\n {\n\n // Calculate the total number of pages\n\
    \n $this->totalPages = ceil($numRows / $rowsPerPage);\n\n // Check that a valid\
    \ page has been provided\n\n if ($currentPage < 1) {\n\n $currentPage = 1;\n\n\
    \ } else if ($currentPage > $this->totalPages) {\n\n $currentPage = $this->totalPages;\n\
    \n }\n\n // Calculate the row to start the select with\n\n $this->startRow = (($currentPage\
    \ - 1) \\* $rowsPerPage);\n\n }\n\n /\\*\\*\n\n \\* Returns the total number of\
    \ pages available\n\n \\* @return int\n\n \\* @access public\n\n \\*/\n\n function\
    \ getTotalPages()\n\n {\n\n return $this->totalPages;\n\n }\n\n /\\*\\*\n\n \\\
    * Returns the row to start the select with\n\n \\* @return int\n\n \\* @access\
    \ public\n\n261\n\nHow do I build a result pager?"
  merge: -1
