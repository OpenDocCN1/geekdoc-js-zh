  md: '**Images**


    **7**


    Building a Website is not just about displaying (X)HTML formatted text. The


    umbrella term “multimedia” describes the delivery of many forms of content to


    your desktop, including sound, text, and images—even animation and movies.


    Where images are concerned, PHP has great capabilities. You can do a whole lot


    more than simply add static images to your HTML.


    How about automatically adding a watermark to identify your files, or uploading


    an image and having it displayed as a thumbnail of the correct size for your page?


    Better yet, what about a graph rendered on the fly from figures stored in your


    database? We’ll cover all this and more in the following pages.


    In other chapters of *The PHP Anthology* you’ll find additional examples, such
    as


    storing images in MySQL and displaying them (Chapter 9), rendering images


    with text (Volume II, Chapter 1), and using an image as a way to run a PHP


    script “in the background” (Volume II, Chapter 4). This chapter concentrates


    purely on some of the common problems you’re likely to want to solve when


    displaying images with the help of PHP.


    To use the examples here, you will need the **GD image library** for PHP. The


    PHP functions that use the GD library are documented in the PHP manual\[1\].


    Complete installation instructions are also provided there.


    \[1\] http://www.php.net/image'
