    \nmay \n\nfind \n\nyourself \n\nmaking \n\na \n\ncameo \n\nappearance \n\nat\n\
    \nhttp://www.webpagesthatsuck.com/. The good news is that this is well-trodden\n\
    \nground; the ingredients for making a successful navigation system have been\n\
    \nclearly defined.\n\nHere, we’ll learn how to put together two of the most solid\
    \ and widely used types\n\nof navigation for a hierarchical category structure:\
    \ **crumb trail navigation** and\n\nthe **tree menu**.\n\nNote that the approach\
    \ to database structuring that I’ve used here is known as\n\nthe **adjacency list\
    \ model**. This approach is perhaps the easiest to understand\n\nand is widely\
    \ used. Yet, often it’s not the best way to store hierarchical information\n\n\
    in a database, because extensive processing is required to analyze the data and\n\
    \nreconstruct the tree (using either recursive PHP functions or multiple database\n\
    \nqueries). If you need to store large quantities of hierarchical data, a better\
    \ model\n\nis the **modified preorder tree traversal model** (also known as **nested\
    \ sets**),\n\ndescribed in the article *Storing Hierarchical Data in a Database*\\\
    [11\\].\n\nPEAR::Tree\\[12\\] provides a useful class for dealing with nested\
    \ sets. See the section\n\ncalled “Further Reading” at the end of this chapter\
    \ for more information.\n\n**Hansel and Gretel**\n\nCrumb trail navigation is\
    \ designed to help users understand where they are\n\nwithin a site, and help\
    \ them get back to where they came from. You’ve probably\n\nseen crumb trail navigation\
    \ somewhere on the Internet; if you visit SitePoint’s\n\n\\[11\\] http://www.sitepoint.com/article/1105\n\
    \n\\[12\\] http://pear.php.net/Tree\n\nChapter 9: Web Page Elements\n\n288"
