  md: " \\*/\n\n function getStartRow()\n\n {\n\n return $this->startRow;\n\n }\n\n\
    }\n\nWe can simply pass this class the relevant row information, along with the\n\
    \nnumber of the page that’s being viewed when we instantiate it. It will then\
    \ tell\n\nus the total number of pages and the row number at which we should start\
    \ our\n\nselect query.\n\nHere it is in action:\n\nFile: **3.php**** (excerpt)**\n\
    \n// Instantiate MySQL connection\n\n$db = &new MySQL($host, $dbUser, $dbPass,\
    \ $dbName);\n\n// Find out how many rows are available\n\n$sql = \"SELECT COUNT(\\\
    *) AS num\\_rows FROM user\";\n\n$result = $db->query($sql);\n\n$row = $result->fetch();\n\
    \n// Define the number of rows per page\n\n$rowsPerPage = 10;\n\n// Set a default\
    \ page number\n\nif (!isset($\\_GET\\['page'\\])) {\n\n $\\_GET\\['page'\\] =\
    \ 1;\n\n}\n\n**// Instantiate the pager**\n\n**$pager = new SimplePager($rowsPerPage,\
    \ $row\\['num\\_rows'\\],**\n\n** $\\_GET\\['page'\\]);**\n\n// Build a table\
    \ for the pager\n\necho \"<table align=\\\\\"center\\\\\">\\\\n<tr>\\\\n\";\n\n\
    // Build the HTML for the pager\n\nfor ($i = 1; $i <= **$pager->getTotalPages()**;\
    \ $i++) {\n\n echo \"<td><a href=\\\\\"\" . $\\_SERVER\\['PHP\\_SELF'\\] . \"\
    ?page=$i\\\\\">\";\n\n if ($i == $\\_GET\\['page'\\]) {\n\n echo \"<strong>$i</strong>\"\
    ;\n\n } else {\n\n echo $i;\n\n }\n\nChapter 9: Web Page Elements\n\n262"
