    **Backslashes and the ANSI SQL Standard**


    Note that using the backslash as an escape character is not standard ANSI SQL.
    If MySQL


    is the only database you’ll ever use, the backslash may be acceptable, but the
    same SQL


    statement run on another database may well fail. According to ANSI SQL we should
    escape


    apostrophes with another single apostrophe:


    INSERT INTO articles SET title=''PHP''''s Greatest Hits'';


    The question is, how do we make sure all our apostrophes are escaped when we


    build a query on the fly in PHP? Dealing with this situation has become rather


    confusing due to the number of alternative solutions:


    K First we have the php.ini setting magic\_quotes\_gpc. **Magic quotes** is a


    feature of PHP which, when turned on, automatically escapes single and


    double quotes, as well as backslashes and null characters found in incoming


    GET, POST and cookie variables, by adding backslashes to the strings. This


    may sound great, but in practice it quickly makes for trouble, typically where


    forms are involved.


    Say you have a form which is used for editing articles. Your script takes the


    text the user enters and inserts it into MySQL. Now, if the user fails to com-


    plete some important field, you might want to re-display the details that have


    been entered in the form so far. With magic quotes on you’d have to strip


    out all the slashes it added to the values (with PHP’s stripslashes function)!


    Then, what if you wanted to run the code on a server where magic\_quotes\_gpc


    is disabled? Your code would then have to check to see if magic quotes is


    switched on and bypass the use of stripslashes. Headaches are inevitable,


    and if you make a mistake and end up with spurious backslashes stored in


    your database⁴, you may have a painful cleanup process ahead of you.


    Magic quotes is discussed in some detail in Chapter 1. If you *do* switch off


    magic\_quotes\_gpc as I advise, you should be aware of the potential risks to


    security. See the section called “SQL Injection Attacks” below and Appendix C.


    4It continually amazes me how many professionally designed sites fail to handle
    character escaping


    properly! Keep an eye out for unexpected backslashes in your own Web travels.
    See Chapter 1 for


    my advice on how best to avoid this on your own sites.


