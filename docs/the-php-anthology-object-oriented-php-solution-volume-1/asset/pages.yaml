    \ one\n\nrow, that makes 50%). One final thing to be aware of is that FULLTEXT\
    \ searches\n\nwill only match searches of more than three letters; the indexing\
    \ mechanism ig-\n\nnores words of three characters or less, to avoid having to\
    \ build a massive index.\n\nThis is much like the index of a book; you’d be pretty\
    \ surprised to discover in a\n\nbook’s index exactly which pages the word “the”\
    \ appeared on!\n\nHere’s a basic FULLTEXT search:\n\nSELECT \\* FROM articles\n\
    \nWHERE MATCH (title,body,author) AGAINST ('MySQL');\n\nThis search will return\
