    \n**How do I back up my database?**\n\nThe bigger a database becomes, the more\
    \ nerve wracking it can be not to have a\n\nbackup of the data it contains. What\
    \ if your server crashes and everything is lost?\n\nThankfully, MySQL comes with\
    \ two alternatives: a command line utility called\n\nmysqldump, and a query syntax\
    \ for backing up tables.\n\nHere’s how you can export the contents of a database\
    \ from the command line\n\nwith mysqldump:\n\nmysqldump -uharryf -psecret sitepoint\
    \ > sitepoint.sql\n\nThis command will log in to MySQL as user “harryf” (\\-uharryf)\
    \ with the pass-\n\nword “secret” (\\-psecret) and output the contents of the\
    \ sitepoint database to\n\na file called sitepoint.sql. The contents of sitepoint.sql\
    \ will be a series of\n\nqueries that can be run against MySQL, perhaps using\
    \ the mysql utility to perform\n\nthe reverse operation from the command line:\n\
    \nmysql -uharryf -psecret sitepoint < sitepoint.sql\n\nUsing the PHP function\
    \ system, you can execute the above command from\n\nwithin a PHP script (this\
    \ requires you to be logged in and able to execute PHP\n\nscripts from the command\
    \ line). The following class puts all this together in a\n\nhandy PHP form that\
    \ you can use to keep regular backups of your site.\n\nFile: **Database/MySQLDump.php****\
    \ (in ****SPLIB****)**\n\n/\\*\\*\n\n \\* MySQLDump Class<br />\n\n \\* Backs\
