    If you’re working with your own cookie-based authentication, store an


    identifying session ID in the cookie only, not the user name and password.


    K** Cross Site Scripting (XSS)**


    By using the legitimate mechanisms your site provides, it’s possible for attack-


    ers to post on your site, for example, JavaScript that results in other users


    giving away their session IDs, thereby allowing the attacker to hijack their


    session. Less serious, but equally embarrassing, is simply posting HTML that


    “scrambles” the layout of your page, perhaps closing a table tag prematurely.


    Use a “deny all, permit a little” approach, or, better yet, employ a separate


    markup language such as BBCode (see Chapter 5), while eliminating HTML


    with PHP functions like strip\_tags and htmlentities. If you really want


    to allow HTML to be posted, consider building a filter based on


    PEAR::XML\_HTMLSax\[5\] (see Volume II, Chapter 2).


    K** Command Injection**


    Command injection occurs when an attacker is able to influence the way PHP


    interacts with external systems, such as the file system or a database. An SQL


    injection is a prime example, which occurs when an attacker uses a form or


    URL to modify a database query. This was discussed in some detail in


    Chapter 3. The bottom line is: escape all data you receive from a user before


    you use it in a query.


    K** Error Handling**


    An experienced attacker will be able to gain a lot of important information


    about your system from your error messages. Although this comes under the


    heading of “security by obscurity” (which is no substitute for having a *really*


    secure application), for a live site, it’s a good idea to instruct PHP to log
    error


    messages to a file, rather than display them to the browser. See Appendix A


    for details.


    K** Insecure Use of Cryptography**


    First of all, when it comes to cryptography, don’t roll your own. Second, re-


    member that if it’s an algorithm that’s meant to be decoded, then someone


