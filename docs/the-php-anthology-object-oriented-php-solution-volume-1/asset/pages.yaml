  md: '**Text Manipulation**


    **5**


    Despite the fact that we’re living in an era of multimedia, the majority of Web


    content appears in that most dull but effective of formats: text. Most of your


    work as a PHP developer will involve manipulating text in some form or other—be


    it HTML, XML or otherwise—for display on your Website.


    **How do I solve problems with text**


    **content in HTML documents?**


    Learning (X)HTML is generally fairly easy, at least when compared to object


    oriented programming languages and the like. HTML is almost *deceptively* simple


    though. There’s more to it than meets the eye, particularly when it comes to


    generating HTML on the fly.


    In this solution, I’ll look at some of the common problems you’ll encounter when


    constructing HTML with PHP, and what’s on offer to help you solve them.


    **Dynamic Link URLs**


    When they’re used as part of a link in a Web page, certain characters will cause


    problems for users who try to activate that link by clicking on it. Take spaces,


    for example; the exact number of spaces contained in the URL may be lost as the'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'browser identifies the address of the page. However, it is possible to send
    a rep-


    resentation of a space character in a URL using the code %20. This process of
    re-


    placing special characters with appropriate codes is called **URL encoding**.


    There are two types of problem characters:


    K** reserved characters**, which already serve some purpose in URLs, such as ?


    and &


    K** unsafe characters**, which may be dealt with unpredictably depending on the


    Web browser and Web server


    Imagine, for example, you have in your database a user whose login name is


    “Ben&Jerry.” You build a page through which you can view that user’s profile.


    To access it, you decide to construct a link using the login name from the database.


    You might end up with a link like this:


    <a href="/index.php?view=profile&amp;user=**Ben&Jerry**">


    View **Ben&Jerry** </a>


    The index.php script that receives the request will receive the GET variable


    ($\_GET\[''user''\]) as just “Ben”, ignoring “Jerry” (who will probably not be


    pleased). When the script tries to locate that name in the database, there will


    obviously be a problem.


    Thankfully, PHP provides the urlencode function to handle this situation. If we


    pass the user name that’s included in the link through urlencode as the link is


    rendered, this will be the result:


    <a href="/index.php?view=profile&amp;user=**Ben%26Jerry**">


    View Ben&Jerry </a>


    Notice that the user name in the link becomes Ben%26Jerry. The script will now


    receive “Ben&Jerry” as the value of $\_GET\[''user''\] and will be able to locate
    the


    user in the database.


    ![](img/4aa42814ed6f04055a7211c9ee423453_164_0.png)


    **Other URL Encoding/Decoding Functions**


    PHP also provides the urldecode function, which can be useful when you


    need to parse HTML with PHP. It also provides the functions rawurlencode


    and rawurldecode, which use a + character instead of %20 for marking


    spaces. This is the result of an alternative specification for encoding URLs.


    At the end of this chapter, I’ve suggested a source of further reading that


    takes a detailed look at the subject of URL encoding in general.


    Chapter 5: Text Manipulation


    144'
