  md: "In PHP, all variable names are linked with values in memory automatically.\n\
    \nUsing a reference allows us to link two variable names to the same value in\n\
    \nmemory, as if the variable names were the same. You can then substitute\n\n\
    one for the other.\n\n**What Are References?**\n\nTo understand references, we\
    \ have to begin by understanding how PHP handles\n\nvariables under normal circumstances\
    \ (i.e. without references).\n\nBy default, when a variable is passed to anything\
    \ else, PHP creates a copy of that\n\nvariable. When I say “passed,” I mean any\
    \ of the following:\n\nK Passing a variable to another variable:\n\n<?php\n\n\
    \ $color = 'blue';\n\n $settings\\['color'\\] = $color;\n\n?>\n\n$settings\\['color'\\\
    ] now contains a *copy* of $color.\n\nK Passing a variable as an argument to a\
    \ function:\n\n<?php\n\nfunction isPrimaryColor($color)\n\n{\n\n // $color is\
    \ a copy\n\n switch ($color) {\n\n case 'red':\n\n case 'blue':\n\n case 'green':\n\
    \n return true;\n\n break;\n\n default:\n\n return false;\n\n }\n\n}\n\n$color\
    \ = 'blue';\n\nif (isPrimaryColor($color)) {\n\n echo $color . ' is a primary\
    \ color';\n\n} else {\n\n echo $color . ' is not a primary color';\n\nChapter\
    \ 2: Object Oriented PHP\n\n40"
