    \ will pass\n\non to the database to execute. The golden rule: *escape all data\
    \ from external sources*\n\nbefore letting it near your database. That rule doesn’t\
    \ just apply to INSERT and\n\nUPDATE queries, but also to SELECT queries.\n\n\
    No doubt many PHP developers have been saved from the worst SQL injection\n\n\
    attacks by the limitations of MySQL, which will only allow a single SQL statement\n\
    \nto be performed with each call to mysql\\_query. On other databases, the effect\n\
    \nof an SQL injection can be disastrous, as an attacker can send a second query\n\
    \nthat, for example, deletes the entire contents of a table. With MySQL, however,\n\
