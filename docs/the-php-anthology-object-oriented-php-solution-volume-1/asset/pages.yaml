  md: "Array\n\n(\n\n \\[0\\] => 395\n\n \\[1\\] => 123\n\n \\[2\\] => 2\n\n \\[3\\\
    ] => width=\"395\" height=\"123\"\n\n \\[bits\\] => 8\n\n \\[channels\\] => 3\n\
    \n \\[mime\\] => image/jpeg\n\n)\n\nThe first element of the array is the width\
    \ of the image, and the second is its\n\nheight. The third is a number that identifies\
    \ the type of image, for which a 1 is\n\na GIF, 2 is a JPEG and 3 is a PNG (more\
    \ are described in the PHP Manual\\[3\\]).\n\nNote that the mime element of the\
    \ array only became available with PHP 4.3.0.\n\n**The ****Thumbnail**** Class**\n\
    \nSo far, so good… but the thumbnail we’ve created stretches the original image\n\
    \nto the full size of the blank thumbnail. This causes the image to warp, unless\
