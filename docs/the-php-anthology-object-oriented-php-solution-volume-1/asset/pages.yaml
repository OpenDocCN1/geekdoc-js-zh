  md: "The Content-Type header is used to specify the **MIME type** of the content\
    \ on\n\nthe current URL. In this case, the MIME type is image/png, which signifies\
    \ a\n\nPNG image.\n\nWhere this becomes important in PHP is when we’re generating\
    \ an image from\n\na PHP script. By default, PHP scripts send a MIME type of text/html\
    \ (an HTML\n\ndocument). So, in instances when your script is sending an image\
    \ instead of\n\nHTML, you’ll need to specify the MIME type using PHP’s header\
    \ function. For\n\nexample:\n\n<?php\n\nheader('Content-Type: image/png');\n\n\
    ?>\n\nThe MIME types you’ll need for images are outlined in Table 7.1.\n\n**Table\
    \ 7.1. MIME Types for Images**\n\n**MIME Type**\n\n**Image Format**\n\nimage/jpeg¹\n\
    \nJPEG \n\nFile \n\nInterchange \n\nFormat\n\n(.jpeg/.jpg)\n\nimage/png\n\nPortable\
    \ Network Graphics (.png)\n\nimage/gif\n\nGraphics Interchange Format (.gif)\n\
    \nimage/bmp\n\nWindows Bitmap (.bmp)\n\nimage/xml+svg\n\nScalable Vector Graphics\
    \ (.svg)\n\n1Internet Explorer understands the image/jpeg type, but when uploading\
    \ a JPEG image it sends\n\na type of image/pjpeg.\n\n**How do I create thumbnail\
    \ images?**\n\nIf your site will allow images to be uploaded, perhaps for display\
    \ with submitted\n\ncontent, how can you make sure the images displayed will be\
    \ of a suitable size?\n\nIf a user uploads a particularly large image, it might\
    \ destroy the layout of the\n\npage when it’s displayed. One solution is to create\
    \ **thumbnail images**, which\n\nguarantee that the images displayed never exceed\
    \ a certain height and width.\n\nBuilding a basic thumbnail is a five stage process:\n\
    \n1.\n\nLoad the source image into a PHP variable.\n\n211\n\nHow do I create thumbnail\
    \ images?"
