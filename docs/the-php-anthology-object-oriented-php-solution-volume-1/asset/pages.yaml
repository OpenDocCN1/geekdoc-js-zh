  md: 'the function name suggests, this creates a **true color** (twenty-four bit)
    image, as


    opposed to the **palette-based** (eight bit) image you’ll get with imagecreate
    (see


    the section called “Further Reading” for suggested sources of information on


    images). The imagecreatefromjpeg function creates a true color image from the


    source file, so we need the thumbnail to be true color as well.


    The imagecopyresampled function is the point at which the thumbnail is actually


    created from the original. It places a resized version of the image into the blank


    thumbnail image, **resampling** along the way to ensure that the image is resized


    smoothly. An older version of this function, imagecopyresized, changes the size


    of the image more crudely. Refer to the PHP manual for a complete description


    of this function’s arguments if you need to.


    Finally, after sending the correct content type header, we use imagejpeg to output


    the completed thumbnail. Figure 7.1 shows the end result. While there is certainly


    room for improvement, this is a start.


    **Figure 7.1. Our First Thumbnail**


    ![](img/4aa42814ed6f04055a7211c9ee423453_233_0.png)


    Let’s go back to the getimagesize function—it’s worth noting the information


    this provides:


    File: **2.php**


    <?php


    // Specify source image


    $sourceImage = ''sample\_images/sitepoint\_logo.jpg'';


    // Get the size of the original


    $dims = getimagesize($sourceImage);


    echo ''<pre>'';


    print\_r($dims);


    echo ''</pre>'';


    ?>


