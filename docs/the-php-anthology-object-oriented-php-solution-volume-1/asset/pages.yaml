  md: "**Generating Errors**\n\nAs we saw above, there are three error levels that\
    \ you can use to report messages\n\nabout errors in your code: errors, warnings,\
    \ and notices. The medium for the\n\ngeneration of error messages is the function\
    \ trigger\\_error\\[2\\], which can be\n\nplaced anywhere in your code and, on\
    \ execution, will result in PHP reporting\n\nerrors of the level you specify.\
    \ Your choices are E\\_USER\\_ERROR, E\\_USER\\_WARNING\n\nand E\\_USER\\_NOTICE,\
    \ the “user” in this sense being you—the PHP developer.\n\nHere’s a simple example:\n\
    \nFile: **6.php**\n\n<?php\n\nif (!@mysql\\_connect('localhost', 'wronguser',\
    \ 'wrongpassword')) {\n\n trigger\\_error('Error connecting to MySQL Server: '\
    \ .\n\n mysql\\_error(), E\\_USER\\_ERROR);\n\n}\n\necho 'Hello World!';\n\n?>\n\
    \nHere, we’ve used the error suppression operator to suppress the normal error\n\
    \nmessage so that we can display a more useful message using trigger\\_error.\
    \ The\n\nsecond argument we’ve supplied to trigger\\_error, which is optional,\
    \ is the level\n\nat which we want the error reported; the default level is E\\\
    _USER\\_NOTICE.\n\nIt’s worth considering from a theoretical standpoint exactly\
    \ what we’ve done\n\nhere. The normal error level that PHP would use if mysql\\\
    _connect failed would\n\nbe a *warning*, because it regards this as an environmental\
    \ error that does not im-\n\npede the running of the script. However, we’ve suppressed\
    \ the normal warning\n\nmessage and increased the severity to an *error*. Since\
    \ errors are considered fatal\n\nto a PHP script, this halts PHP’s execution of\
    \ the script. The instruction to echo\n\n“Hello World!” will not be executed in\
    \ this case, yet the warning that PHP would\n\nhave normally produced would have\
    \ allowed it to execute.\n\nWhy did we do this? Well, if the script that follows\
    \ the database connection at-\n\ntempt relied on that database connection to produce\
    \ useful output, it doesn’t\n\nmake much sense to let the script continue on its\
    \ merry way if the database\n\nconnection fails. While some applications might\
    \ be able to make do without the\n\ndatabase connection, we can use trigger\\\
    _error to stop those that can’t in their\n\ntracks.\n\n\\[2\\] http://www.php.net/trigger\\\
    _error\n\nChapter 10: Error Handling\n\n324"
  merge: -1
  pgno: 344
- img_proc: true
  md: "**Strategy for Generating Errors**\n\nHow you use trigger\\_error in your code\
    \ is completely up to you, but to get\n\nthe most out of it, it’s a good idea\
    \ to have in mind some kind of strategy that\n\nwill allow you to handle correctly\
    \ the errors your code generates. When selecting\n\nthe type of error to trigger,\
    \ think about what the error means from the perspective\n\nof a *user* of your\
    \ application, rather than what it means to the PHP engine. The\n\nfollowing is\
    \ intended to represent best practice for using the different error levels:\n\n\
    E\\_USER\\_ERROR\n\nThis is the most critical level of error you have avail-\n\
    \nable to you, being a fatal error that stops PHP execut-\n\ning the rest of your\
    \ code. From the perspective of\n\nsomeone using your application, a fatal error\
    \ is one\n\nthat caused the application to fail to perform its duty\n\non a fundamental\
    \ level. For instance, the script is un-\n\nable to connect to the MySQL server\
    \ that stores the\n\ncontent your application wants to render.\n\nE\\_USER\\_WARNING\n\
    \nAt this level, your application can continue execution,\n\nthough something\
    \ went wrong with the operation the\n\nuser requested. A good approach to using\
    \ this error\n\nlevel is to apply it when users do something that’s\n\nbeyond\
    \ the limits of your application. For example,\n\nthey might have requested a\
    \ URL at which no content\n\nexists, or passed data of the wrong type to a script\
    \ (for\n\ninstance, they passed a string via a $\\_GET variable,\n\nwhich is expected\
    \ to contain integer values). Obvi-\n\nously, this should be applied within reason;\
    \ in general,\n\ntriggered errors cannot be handled as effectively as\n\nreturned\
    \ values in your code (see the section called\n\n“Triggered Errors vs. Conditional\
    \ Execution” below).\n\nE\\_USER\\_NOTICE\n\nThis level is suitable for providing\
    \ information to users\n\nand administrators of your site. If someone, while at-\n\
    \ntempting to log into a secure area of your site, gets the\n\nuser name/password\
    \ combination wrong three times\n\nin a row, it may be a good time to trigger\
    \ an\n\nE\\_USER\\_NOTICE error. This error would result in an\n\nemail being\
    \ sent to your site’s administrators warning\n\nthem of a potential attempt at\
    \ cracking the user au-\n\nthentication \n\nsystem. \n\nYou \n\nmight \n\nalso\
    \ \n\nuse\n\n325\n\nStrategy for Generating Errors"
  merge: -1
