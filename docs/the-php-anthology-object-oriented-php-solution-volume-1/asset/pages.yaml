  md: " echo \"</a></td>\\\\n\";\n\n}\n\necho \"</tr>\\\\n</table>\\\\n\";\n\nNotice\
    \ that we’ve used the getTotalPages method in the for loop that builds\n\nthe\
    \ links for navigation between pages.\n\nWith the page primed and the HTML built,\
    \ we can now create the results table,\n\ntaking advantage of the getStartRow\
    \ method:\n\nFile: **3.php**** (excerpt)**\n\n// Now construct the \"real\" SQL\
    \ statement\n\n$sql = \"SELECT \\* FROM user\n\n LIMIT \" . $pager->getStartRow()\
    \ . \", \" . $rowsPerPage;\n\n// Fetch and display the results\n\n$result = $db->query($sql);\n\
    \necho \"<table align=\\\\\"center\\\\\">\\\\n\";\n\necho \"<tr>\\\\n<th>Login</th><th>Name</th><th>Email</th>\\\
    \\n</tr>\";\n\nwhile ($row = $result->fetch()) {\n\n echo \"<tr>\\\\n\n\n <td>\"\
    \ . $row\\['login'\\] . \"</td>\n\n <td>\" . $row\\['firstName'\\] . ' ' . $row\\\
    ['lastName'\\] . \"</td>\n\n <td>\" . $row\\['email'\\] . \"</td>\\\\n\n\n </tr>\\\
    \\n\";\n\n}\n\necho \"</table>\";\n\nWe can now page through the user table display\
    \ ten rows at a time. This makes\n\na reasonable start, but the code is somewhat\
    \ messy. It also lacks a few features,\n\nsuch as the ability to simply click\
    \ “next” or “previous” to go one page forward or\n\nbackward. And there’s no limit\
    \ to the number of pages that are displayed at once\n\n(with a large table there\
    \ may be hundreds of pages, which will result in an ugly\n\nlooking Web page).\n\
    \n**Sliding Page Numbers**\n\nPEAR offers another handy package called PEAR::Pager\\\
    _Sliding\\[2\\]. Written by\n\nLorenzo Alberton, Pager\\_Sliding combines calculations\
    \ and link construction\n\nin a single, easy-to-use class. The version used here\
    \ is 1.4.\n\n\\[2\\] http://pear.php.net/Pager\\_Sliding\n\n263\n\nSliding Page\
    \ Numbers"
