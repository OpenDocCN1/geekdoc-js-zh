  md: "Again, the answer is simple with PHP: use the mysql\\_query function combined\n\
    \nwith SQL commands INSERT and UPDATE. INSERT is used to create new rows in\n\n\
    a table, while UPDATE is used to modify existing rows.\n\n**Inserting a Row**\n\
    \nA simple INSERT, using the articles table defined at the start of this chapter,\n\
    \nlooks like this:\n\nFile: **7.php**** (excerpt)**\n\n// A query to INSERT data\n\
    \n$sql = \"INSERT INTO\n\n articles\n\n SET\n\n title = '$title',\n\n body = '$body',\n\
    \n author = '$author'\";\n\n// Run the query, identifying the connection\n\nif\
    \ (!$queryResource = mysql\\_query($sql, $dbConn)) {\n\n trigger\\_error('Query\
    \ error ' . mysql\\_error() . ' SQL: ' . $sql);\n\n}\n\n**Updating a Row**\n\n\
    Before you can use an UPDATE query, you need to be able to identify which row(s)\n\
    \nof the table to update. In this example, I’ve used a SELECT query to obtain\
    \ the\n\nunique article\\_id value for the article entitled “How to insert data”:\n\
    \nFile: **8.php**** (excerpt)**\n\n// A query to select an article\n\n$sql = \"\
    SELECT article\\_id FROM articles\n\n WHERE title='How to insert data'\";\n\n\
    if (!$queryResource = mysql\\_query($sql, $dbConn)) {\n\n trigger\\_error('Query\
    \ error ' . mysql\\_error() . ' SQL: ' . $sql);\n\n}\n\n// Fetch a single row\
    \ from the result\n\n$row = mysql\\_fetch\\_array($queryResource, MYSQL\\_ASSOC);\n\
    \n// A new title\n\n$title = 'How to update data';\n\nChapter 3: PHP and MySQL\n\
    \n80"
