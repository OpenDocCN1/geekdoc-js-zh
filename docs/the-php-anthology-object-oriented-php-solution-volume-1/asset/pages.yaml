    \ '@', '#', '\\*', '£');\n\n foreach ($badWords as $badWord) {\n\n $badWord =\
    \ preg\\_quote($badWord);\n\n $replaceStr = '';\n\n $size = strlen($badWord);\n\
    \n for ($i = 0; $i < $size; $i++) {\n\n shuffle($censors);\n\n $replaceStr .=\
    \ $censors\\[0\\];\n\n }\n\n $this->badWords\\[$badWord\\] = $replaceStr;\n\n\
    \ }\n\n }\n\n /\\*\\*\n\n \\* Searches for bad words in text and censors them\n\
    \n \\* @param string text to filter\n\n \\* @return string the filtered text\n\
    \n \\* @access public\n\n \\*/\n\n function filter($text)\n\n {\n\n foreach ($this->badWords\
    \ as $badWord => $replaceStr) {\n\n $text = preg\\_replace('/' . $badWord . '/i',\
    \ $replaceStr,\n\n $text);\n\n }\n\n return $text;\n\n }\n\n}\n\nIf you’re wondering\
    \ about the constructor, the idea is to create a random string\n\nwith which to\
    \ replace each word—just for fun. Note that I used preg\\_quote to\n\nensure that\
    \ bad words aren’t interpreted as regular expression syntax.\n\nNow, I have a\
    \ loathing of Teletubbies™. In fact, the mere mention of the word\n\n“Tubby” sends\
    \ me into a blind rage. Putting the class into action, I can eradicate\n\nfrom\
    \ my site the discussion of all things “Tubby”:\n\nChapter 5: Text Manipulation\n\
    \n158"
