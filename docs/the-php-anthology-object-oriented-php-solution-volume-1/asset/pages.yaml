  md: "MySQL. Although PostgreSQL is arguably the better database, in that it supports\n\
    \nmore of the features that are common to relational databases, MySQL is better\n\
    \nsupported on Windows, and is a popular choice among Web hosts that provide\n\
    \nsupport for PHP. These factors combine to make PHP and MySQL a very popular\n\
    \ncombination. This book is geared to the use of MySQL with PHP but it’s import-\n\
    \nant to remember that there are alternatives with full support for features such\
    \ as\n\nstored procedures, triggers and constraints, many of which become important\
    \ for\n\napplications with complex data structures.\n\nThis chapter covers all\
    \ the common operations PHP developers have to perform\n\nwhen working with MySQL,\
    \ from retrieving and modifying data, to searching\n\nand backing up a database.\
    \ The examples focus on using a single table, so no\n\ndiscussion is made of table\
    \ relationships here. For a full discussion of table rela-\n\ntionships, see Kevin\
    \ Yank’s *Build Your Own Database Driven Website Using PHP*\n\n*& MySQL* (ISBN\
    \ 0-9579218-1-0), or see an example of them in practice when\n\nwe deal with user\
    \ groups in Volume II, Chapter 1.\n\nThe examples used here work with a sample\
    \ database called sitepoint, which\n\ncontains the following single table:\n\n\
    File: **articles.sql**\n\nCREATE TABLE articles (\n\n article\\_id INT(11) NOT\
    \ NULL AUTO\\_INCREMENT,\n\n title VARCHAR(255) NOT NULL DEFAULT '',\n\n intro\
    \ TEXT NOT NULL,\n\n body TEXT NOT NULL,\n\n author VARCHAR(255) NOT NULL DEFAULT\
    \ '',\n\n published VARCHAR(11) DEFAULT NULL,\n\n public ENUM('0','1') NOT NULL\
    \ DEFAULT '0',\n\n PRIMARY KEY (article\\_id),\n\n FULLTEXT KEY art\\_search (title,\
    \ body, author)\n\n)\n\nA query to construct this table along with some sample\
    \ data is available in the\n\ncode archive, contained in the file sql/articles.sql.\
    \ The table will be used for\n\nexamples in later chapters of the book.\n\n**How\
    \ do I access a MySQL database?**\n\nConnecting to MySQL with PHP couldn’t be\
    \ easier. It’s essentially a two–step\n\nprocess; first connect to the MySQL database\
    \ server itself, then inform MySQL\n\nof the database you want to connect to.\n\
    \nChapter 3: PHP and MySQL\n\n66"
