  md: 'date(''d'') - 7


    date(''d'') returns the day component of today’s date (again, the manual page\[2\]


    for this function is worthy of your attention), and subtracting seven takes us
    back


    one week from today. You may have noticed that if today’s date is the 1^(st) of
    the


    month, subtracting seven from it will give a day of “-6”. Handily, mktime is able


    to understand the intention; it will adjust the month correctly and start counting


    backwards from the total number of days in the previous month.


    If you’re interested in maximum performance and don’t mind doing the math


    yourself, you can achieve approximately the same effect¹ using:


    $lastWeek = time() - 7 \* 24 \* 3600;


    Or even more simply:


    $lastWeek = time() - 604800;


    Later, we’ll use date, in conjunction with a Unix timestamp from the database,


    to create a human-readable date for that stamp:


    date(''F j, Y'', $row\[''published''\])


    date can be given a Unix timestamp, and will format it according to the first
    ar-


    gument (in this case, ''F j, Y''):


    March 18, 2003


    As you can see, the date function converts Unix timestamps into something


    readable.


    To use MySQL timestamps, you need to modify the articles table with this


    command:


    ALTER TABLE articles CHANGE published published DATETIME NOT NULL


    Note that the dates stored in the articles will be messed up when you do this;


    obviously, it’s not something you should try with real data.


    A query to identify articles from the last week would now look like this:


    \[2\] http://www.php.net/date


    1The difference is that by using mktime you can specify articles published after
    *midnight* one week


    ago, whereas the alternative method looks for articles published after *the current
    time* one week ago.


    In most applications, the difference is likely to be academic.


    177


    Timestamps in Action'
