    Keep in mind that there are various ways for code to be read. That is why it is
    so important for you to be sure that your code is easy to read and understand.


    ## Splitting


    There is more than just addition when you are doing math. For code, there is division.


    ```javascript

    Var piecesForEachPerson = piecesOfFruit / 3 ;

    ```


    JavaScript is able to do this math without you having to get out a calculator
    to make sure that the math is done properly. Division is done with a forward slash
    to ensure that you are dividing the left side from the right side.


    ## Operators


    To get the sum of a set of numbers, you are going to use symbols for every operation.


    - Multiplication (`*`)

    - Addition (`+`)

    - Division (`/`)

    - Subtraction (`-`)


    Each symbol is call and operator since they are going to operate some sort of
    mathematical data. Just like any math problem, there are going to be a particular
    order of how things are going to be done, it is called the operator precedence.


    Seeing a set of parentheses means that they need to be done first before you do
    the multiplication, division, addition, or subtraction process. An easy way to
    remember this order of operations is PEMDAS (Parentheses, Exponents, Multiplication
    and Division, and Addition and Subtraction).


    ```javascript

    (10+2) / 2 + 4 * 2

    12 / 2 + 4 * 2

    6 + 4 * 2

    6 + 8

    ```


    # Chapter 5: JavaScript Logic


    When you are programming, it is important to have the ability to compare different
    values so that decisions can be made when it comes to the code and how it is going
    to be carried out. The comparison will either make your outcome false or true.
    Then, there is a special data type that is known as a Boolean data type.


    Using JavaScript to do math will bring out a set of operators that are going to
    work with Booleans. These comparisons are going to be made when you are working
    on a console. Whichever result you get from every line is going to be shown as
    true or false.


    ### Equality


    To determine if two different values are equal you will use three equals signs.
    (`===`).


    ```javascript

    15.234 === 15.234

    True

    ```


    When two values are not equal, you will not only use three equals signs but also
    going to have an exclamation point. (`!==`).


    ```javascript

    15.234 !== 18.4545

    True

    ```


    Strings are going to contain numbers and any actual number is not going to be
    equal.


    ```javascript

    ''10'' === 10

    False

    ```


    ### Greater than/ less than


    Two numbers can be compared as one being larger or smaller than the other. When
    a number is greater than the other you are going to use a greater than symbol
    of `>`.


    ```javascript

    10 > 5

    True

    ```


    The less than symbol will be the opposite of the greater than symbol (`<`).


    ```javascript

    20.4 < 20.2

    False

    ```


    ### Combined comparison


    Numbers can be compared when they are of equality and the size is going to be
    able to be compared with a greater than or equal to (`>=`) or the less than or
    equal to (`<=`) operators.


    ```javascript

    10 >= 10

    True

    10 <= 5

    False

    ```


    # Chapter 6: JavaScript Conditions


    Using JavaScript logic will make the decision for the code based on what sort
    of comparison has been made. Before the comparison can be made, there has to be
    a condition set. There are several conditions that are used in JavaScript, but
    the most common one is the If statement.


    ### If statement


    When the condition is found to be true, the code set is going to be run the way
    that it is supposed to. Thanks to the if statement, you are going to be able to
    add in extra code that has to be run should the condition turn out to not be true.
    When the condition is returned as false, then there will have to be extra conditions
    and blocks of code that are going to be run optionally. This option is going to
    be the if-else statement.


    ```javascript

    If (10 > 5) {

    // Run the code here

    }

    ```


    Any code that has been placed between the curly brackets is going to be considered
    a block and will be connected to the If statement. However, it is only going to
    be run if the condition that falls between the parentheses turns out to be true.


    Note: the double slashes are going to indicate a comment that has been placed
    in the code and it is not going to be run as code. The comments are placed so
    that the code can be easily understood by others.


    ### If-else


    The if-else statement is a different form of the If statement that will use a
    piece of code and run it instead of the original code if the condition comes back
    as false. The code that falls in the If code block is going to be ignored so that
    the else block can be run.


    ```javascript

    If ( 43 < 2) {

    // Run the code here

    } else {

    //A different code is run

    }

    ```


    # Chapter 7: Looping with JavaScript


    Just like a circle, a loop is going to continue to repeat the same code over multiple
    times. Loops are usually used when an code needs to be carried out for an object
    in an array.


    Two loops that you are going to use most often are going to be while loops and
    for loops. The conditions are going to be combined together and then the block
    of code is going to be run until the condition is forced to no longer be true.


    ### While loops


    While loops will repeat the code while the condition turns out to be true. While
    loops are very similar to if statements and the condition that is placed inside
    the parentheses is true.


    ```javascript

    Var i = l ; while ( i < 10 ) {

    Alert (i);

    I = i + l ;

    }

    // i is now going to be 10

    ```


    Once the loop has been completed, the code will keep running even after the closing
    bracket.


    ### For loops


    For loops are also similar to if statements, the main difference being that there
    will be three semicolons used to separate bits of information that is placed between
    a set of parentheses. A for loop is going to initialize the condition to get a
    final expression.


    While initializing, you will be creating the variable so that you can track how
    far into the loop you are going to go just like you did with the while statement.
    Your condition is going to be where the loop’s logic will go. The final expression
    is going to be run at the end of every loop that has been created.


    ```javascript

    For (var i = l ; i < 10 ; i++ ) {

    Alert (i) ;

    }

    ```


    In the code, an alert box is going to pop up that is going to give the numbers
    1 to 10 in their proper order. The `i++` will be the same as `i = i + l`.


    # Chapter 8: Functions Used in JavaScript


    Functions are going to reuse the blocks of code so a specific task can be carried
    out. In order to execute the code inside a function that you call. The function
    will be allowed to pass any argument that is used so that a value is returned
    to what originally called it.


    Functions can be saved for the value of your variable. The function is going to
    use the variable and the parentheses to invoke the function.


    ```javascript

    doSomething() ;

    findAnInterestingThing() ;

    ```


    Creating a function means you are going to use the `function` keyword. After that
    has been used, the arguments are going to be listed inside a set of parentheses
    so that the block has the functions code.


    ```javascript

    Var add = function (a, b) {

    Return a + b ;

    } ;

    ```

