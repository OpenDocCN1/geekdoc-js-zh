    # 第 17 章：jQuery DOM 和 API


    当选择元素并与 DOM 交互时，最可能会使用 jQuery。坦率地说，它来说很容易使用，因为在选择单个元素甚至一组元素时，语法非常简单。这与 CSS 几乎完全一样。jQuery
    允许同时对元素执行操作，从而在编码过程中节省了一些时间。


    `$(''.note'')` 将选择所有位于 `note` 类内部的元素。


    ```javascript

    $(''.note'').css(''background'', ''red'').height(100);

    ```


    ### 获取器 (Getters) 和 设置器 (Setters)


    如所示，`.css()` 和 `.height()` 用于设置元素的值，但这些方法也被称为获取器。当你调用 `.height()` 而没有返回任何值时，元素当前的高度将调用带有简单
    CSS 属性的 `.css()` 来检索该属性的值。


    ```javascript

    var currentWeather = $(''.note'').height();

    var currentColor = $(''.note'').css(''color'');

    ```


