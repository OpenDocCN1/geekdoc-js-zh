    ## DOM


    DOM 代表文档对象模型（Document Object Model），它将操纵 HTML 页面的结构和样式。为了查看 DOM，你需要打开正在使用的浏览器中的开发者工具，并找到“元素”（elements）面板。在大多数浏览器中，你可以在不请求许可的情况下修改和删除元素。


    ### 树与分支


    HTML 的结构与 XML 相似，元素包含父节点和子节点。它非常像树的分支。HTML 有一个根元素，它包含了分支，就像头部、身体以及附在上面的四肢。正如此，形成了
    DOM 树。


    在修改 DOM 时，你将选择一个元素并按需更改它的任何内容。这个过程通常是通过 JavaScript 完成的。为了从 JavaScript 访问 DOM，你需要正在使用的
    `document` 对象。它将由浏览器提供，以便代码与页面内容中的代码进行交互。


    ## 获取元素


    当你获取元素时，取决于你使用的浏览器，你有几种方法可以实现这一点。


    ### ID


    `document.getElementById` 将是在你尝试通过 ID 获取项目时所使用的方法。


    ```javascript

    Var pageHeader = document. getElementByID ( ‘ page header ‘ ) ;

    ```


    `pageHeader` 具有更改的能力，这将改变大小和颜色。当声明其他代码时，它将通过鼠标悬停或点击来处理该元素。大多数浏览器都是这样。


    ### 标签名


    `document.getElementsByTagName` 的工作与 `getElementById` 相同，但它需要标签名（如 `a`、`li` 或
    `ul`）而不是 ID。它将返回一个 `NodeList`，这本质上是 DOM 元素的列表或数组。


