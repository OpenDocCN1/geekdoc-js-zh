    # 第 1 章：JavaScript...它是什么？对我将何受益？


    ![image](img/chapter_title_below.png)


    JavaScript 是一种脚本语言。通过 JavaScript，你将与不同的网页交互，从而创建一个 Web 应用程序。Netscape Communications
    在 1995 年首次实现了 JavaScript。


    JavaScript 很容易与 Java 混淆，因为它们的名字非常相似，但它们并不是同一个东西。好处是，它们可以在客户端共同交互，因为它们可以直接嵌入网页源代码。这取决于你作为
    Web 开发者的意图。每当网页打开或触发网页另一个操作时，脚本就会运行。


    JavaScript 也是一种面向对象的语言，包含原型继承。因此，每当对象被构建到程序中，程序员就可以创建或删除内容。原型链使得 JavaScript 与你可能遇到的任何其他编程语言不同。JavaScript
    这种语言并不具备 C++ 语言中的类，也不具有你在 Java 中找到的那种类。相反，对象将从相互获取属性，从而创建一个链。


    在 JavaScript 作为一种解释型语言时，还有可选的 JIT 编译（即时编译）。当你查看旧的 JavaScript 实现时，它严格来说是一种必须经过解释的语言。每当执行脚本而没有经过初步编译（如将脚本转换为系统机器码）时，浏览器将解释数据，使其被分析并立即执行。


    当你查看现代实现时，代码要么被编译，要么通过 JIT 编译器进行解释。随着浏览器的运行，它将识别哪些代码部分需要 JIT 编译，从而允许代码具有更好的性能。通过这样做，JavaScript
    变得更快，更适合用于具有复杂性能要求的 Web 应用程序。所有常用浏览器的最新 JavaScript 版本都将带有 JIT 编译器。


    每当你查看 JavaScript 支持的情况时，你会惊讶地发现它几乎在任何地方都支持。在 Firefox、Google Chrome 和 Safari 等浏览器中，如果你不确定你的浏览器是否是
    JavaScript 的授权厂商，可以进入设置查看是否可以启用或禁用 JavaScript。可以，说明你的浏览器已获得 JavaScript 授权。


    ## 益处


    了解 JavaScript 将有助于你在职业生涯中晋升或找到另一个职业。如果你想进入 IT 领域甚至是 Web 设计，JavaScript 是必不可少的。如果你已经在这些领域中有一份工作，你将获得职业上的晋升，因为你加深了对你有利的知识的学习。


    JavaScript 不仅在从事 IT 或 Web 设计时有益处。JavaScript 可以用于任何工作，如果你不确定它是否可以在你的工作中使用，请问你的老板。表现出学习工作要求之外知识的积极性将给你的老板留下深刻印象并赢得你的青睐。


