    # Chapter 15: Scopes with JavaScript


    A scope is going to be the term that will determine variable visibility. The scope
    is going to be the part of the code that access as well as modify the variable.
    There is function scope that is going to be used with JavaScript.


    Scope going to be dictated by the block of code where the variable has been declared.
    The block will be anything that is contained inside curly brackets or is indented.


    ```javascript

    Var a = 10;


    If (a > 5) {

    Var b = 5;

    }


    Var c = a + b; // this is not going to work

    ```


    Global variables are going to be read and modified wherever you put them in your
    application, but they are not going to the best to use because they are going
    to expose security issues in the code which ultimately going to make the code
    harder to maintain. It is important to remember that your code needs more than
    is written. Whenever code is read by a human but is unable to determine where
    the variable comes from or what potential values are, you are going to get your
    best results when you limit the scope of the variable as much as possibly which
    will make it visible to few parts of the code.


    ### Function scope


    Since JavaScript does things differently, function scope goes to mean that variables
    will not be visible outside the function where they were declared. If they have
    been declared in a function then they are globally.


    ```javascript

    Var doSomething = function () {

    Var a = 10;

    };


    doSomething();


    console.log(a); // shows that a has been undefined

    ```


    When you compare this block scope to the code you just saw, you are going to notice
    that `b` is available.


    ```javascript

    Var a = 10;


    If (a > 5) {

    Var b = 5;

    }


    Var c = a + b; // c will be 15

    ```


    ### Child scopes


    Variables are going to also come in child scopes that have their own scopes. For
    code if `doSomethingElse` is a child of function then a will be visible when it
    is placed inside.


    ```javascript

    Var doSomething = function () {

    Var a = 10;

    Var doSomethingElse = function () {

    console.log(a); // a will be 10

    };

    };

    ```javascript

    Functional scopes are going to be very powerful tools when it comes to creating
    elegant codes, but it takes a while to actually get the hang of it.


