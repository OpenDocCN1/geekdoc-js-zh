    # HTML and JavaScript


    The JavaScript that helps to run the websites that you enjoy visiting does not
    work alone. In fact, it works right alongside with HTML and even CSS. JavaScript
    can also be used as a script tag instead of actual script to make sure that the
    script is running the way that it is supposed to be.


    JavaScript can also be used directly in the script otherwise known as internally
    or it can be used as its own file that has been uploaded into the script. This
    is known as external use.


    Whenever browsers run JavaScript, they start reading the script as someone would
    read anything. The script is read top to bottom, left to right.


    ## Internal


    Whenever the JavaScript code is put into the scripting element that is being used
    by HTML, you are using JavaScript internally because it is being directly placed
    into the script.


    ### Code

    ```html

    <script>

    Alert(“Hello, people.”);

    </script>

    ```


    ## External


    External files of JavaScript are always going to have the extension of `.js` after
    the file name. As you are adding your files to your pages, there will need to
    be a script tag that is going to help the `src` attribute that is reading the
    file in order for it to be read properly.


    The file that you are using should be called `filename.js` and be listed in the
    same directory that the HTML file is located.


    ### Code

    ```html

    <script src = “ script.js”> </script>

    ```


    Whenever you see attributes such as `<a href = “somewhere . html” onclick = “alert
    (‘Noooooo! ‘) ; “ > Click me </a>` you are just going to ignore it.


    ## Console


    When you are actually writing code, you are going to get onto your browser and
    find a web page. Most of the time you are going to be able to right click with
    your mouse and then select View Source Code to see the JavaScript and HTML that
    was used to create that page.


    After JavaScript has been entered, you should be able to hit enter and have the
    code run immediately. You can also search online and find any development tools
    that you may need to help you write the proper code.


