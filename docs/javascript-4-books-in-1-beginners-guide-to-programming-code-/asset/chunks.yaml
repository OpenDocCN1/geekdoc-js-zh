  trans: "\n\n任何像上面代码那样持有值的变量都将再次给你提供一到十的输出。这种变体的用法将按照通常编写 `for` 语句的通用方式写出语句。\n\n\
    ### break 语句\n\nJavaScript 中使用了两种 `break` 语句：带标签的语句（labeled statement）和不带标签的语句（unlabeled\
    \ statement）。当使用 `switch` 语句时，会使用不带标签的语句。这些 `break` 语句也会终止大多数循环。\n\n#### 代码示例（Code）\n\
    \n```java\nClass BreakDemo {\n    Public static void main(String[] args) {\n \
    \       Int[] arrayofInts = {72, 57, 5, 579, 14, 1179, 2120, 9, 655, 145};\n \
    \       Int searchfor = 14;\n        Int I;\n        Boolean fountIt = false;\n\
    \        For (I = 0; I < arrayOfInts . length; i++) {\n            If (arrayOfInts\
    \ [i] == searchfor) {\n                fountIt = true;\n                break;\n\
    \            }\n        }\n        If (foundIt) {\n            System.out.println(“found\
    \ “ + searchfor + “ at index “ + i);\n        } else {\n            System.out.println\
    \ (search for + “ not in the array”);\n        }\n    }\n}\n```\n\n在到达你想要提取的值之前，只要循环已终止，就必须在粗体打印处放置语句。大多数控制流语句都可以转移到循环中。\n\
    \n在上面的代码中，输出将是数字十二，并且它在第四个索引处被找到。\n\n`break` 将是不带标签的，因此它们会终止 `switch`、`do while`\
    \ 和 `for` 语句的任何内部部分。当 `break` 带有标签时，它将停止任何位于外部的语句。\n\n#### 代码示例（Code）\n\n```java\n\
    Class BreakWithLabelDemo {\n    Public static void main(String[] args) {\n   \
    \     Int[] []arrayOfInts = {\n            { 32, 87, 3, 589 },\n            {\
    \ 12, 1076, 2000, 8 },\n            { 622, 127, 77, 955}\n        };\n       \
    \ Int searchfor = 12;\n        Int I;\n        Int j = 0;\n        Boolean foundIt\
    \ = false;\n        Search:\n        For (I =0; I < arrayOfInts.length; i++) {\n\
    \            For (j = 0; j < arrayOfInts[i].length; J++) {\n                If\
    \ (arrayOfInts[i][j] == searchfor) {\n                    foundIt = true;\n  \
    \                  breack search;\n                }\n            }\n        }\n\
    \        If (foundIt) {\n            System.out.println(“Found “ + searchfor +\
    \ “ at “ + I + “, “ +j);\n        } else {\n            System.outoutprintln(searchfor\
    \ + “ not in the array”);\n        }\n    }\n}\n```\n\n输出将是在第一个索引找到了十二。\n\n带标签的语句将在\
    \ `break` 语句停止，然后流将不会转移。当控制流语句转移时，标签将停止该语句。\n\n### continue 语句\n\n`continue` 语句将跳过你放在\
    \ `for`、`do while` 或 `while` 循环内部的任何迭代。不带标签的格式将被跳过，以便在控制你循环的布尔表达式执行之前，先对内部代码进行求值。\n\
    \n#### 代码示例（Code）\n\n```java\nClass ContinueDemo {\n    Public static void main(String[]\
    \ args) {\n        String searchMe = “Peter Piper picked a “ + “peck of pickled\
    \ peppers”;\n        Int max = searchMe.length();\n        Int numPs=0;\n    \
    \    For (int I = 0; I < max; I++) {\n            // 只对 p 感感兴趣\n            If\
    \ (searchMe.charAt(i) ! = ‘p’)\n                Continue;\n            // 处理 p\n\
    \            numPs++;\n        }\n        System.out.println(found” + numPs +\
    \ “ p’s in the string. “ );\n    }\n}\n```\n\n在上面的代码中发现了两个 p。\n\n每当 `continue`\
    \ 语句被移除时，实际上会找到三个五个 p。当发现语句对于外层循环的当前迭代有一个标签时，该语句将被跳过。\n\n在此代码中，你会看到有两个循环嵌套在一起，以便搜索子字符串。在两个循环嵌套时，需要其中一个对子字符串进行迭代，而另一个字符串则被搜索。\n\
    \n#### 代码示例（Code）\n\n```java\nClass ContinueWithLabelDemo {\n    Public static\
    \ void main(String[] args) {\n        String searchMe = “Look for a substring\
    \ in me” ;\n        String substring = “sub”;\n        Boolean foundIt = false;\n\
    \        Int max = searchMe.length() – Substring.length();\n        Test:\n  \
    \      For (int I = 0; I <= max; i++) {\n            Int n = substring.length();\n\
    \            Int j = I;\n            Int k =0;\n            While (n—!= 0) {\n\
    \                If (searchMe.charAt(j++) != substring.charAt((k++)) {\n     \
    \               Continue test;\n                }\n            }\n           \
    \ foundIt = true;\n            break test;\n        }\n        System.out.println(foundIt\
    \ ? “Found it” : “Didn’t find it”);\n    }\n}\n```\n\n### return 语句\n\n在分支语句末尾可以找到\
    \ `return` 语句。`return` 语句用作当前控制流语句的退出方法，以便它们返回到方法首次被调用的点。与其他表达式一样，有两个不同的表达式可以用于已返回的语句。\n\
    \n当在一个语句中找到值时，它将被返回，而另一个语句则不会。要获取返回的值，你需要在想要返回的关键字后面列出值。语法将是 `return ++ count\
    \ ;`\n\n返回的数据类型需要与声明的方法类型匹配。一旦方法被声明，值将是坏的，它不会返回一个值。\n\n### 结论\n\n感谢你读到《JavaScript：使用\
    \ JavaScript 编程入门指南》的最后，我们希望它是启发性的，并为你提供了所需的所有工具。\n\n下一步是使用你学习的编码技能创建你自己的代码。\n"
