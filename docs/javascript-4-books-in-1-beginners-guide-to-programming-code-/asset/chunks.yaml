    # Chapter 3:


    ![image](d2d_images/chapter_title_below.png)


    ## Data and JavaScript Variables


    Data is normally stored so that it can be used at a later date. This is a very
    important aspect of writing code. JavaScript is a wonderful program that is going
    to store the data so that you can use it later so that you do not have to worry
    about it getting lost.


    When you are writing code, you are going to be able to have it interact with the
    users by asking for information that may be able to be used at a later time.


    ### Code

    You would like for the user to enter their last name so that you can personalize
    a greeting for them.


    ```javascript

    Var surname = prompt ( ‘ Greetings user, may I ask what your surname is? ‘ ) ;

    ```


    After the code has been run, a box is going to appear asking the user what their
    last name is. All the user is going to need to do is type in their last name before
    they hit enter or click the okay button for the information to be moved and stored
    in the proper place.


    Congratulations, you have now created a variable that will be the surname of the
    user.


    ## Variables


    Variables are going to be easier to understand if you think of them as shelves.
    Each shelf has a name that is created once the variable has been created. So,
    for the previous code, your shelf’s name is going to be `surname` and the object
    that is setting on that shelf is the user’s surname.


    Anything you want to make as a variable can be made. But, it is recommended that
    you name your variables first so that you know which variable is which instead
    of naming them things such as numbers or letters.


    At the point in time that you tell the browser that you are using to locate a
    variable, it is not only going to be located, but the data on that “shelf” is
    going to be given back to you. The object on the shelf is also known as a value.


    The data that is stored in the value is called a string. So the letters that make
    up someone’s last name are going to be the `surname` variables value and string.
    Strings do not just have to be letters; they can be numbers as well.


    Essentially, every variable is going to have a value as well as a name and this
    is how data is going to be stored.


    Variables are created through two parts an initialization and a declaration. After
    you create it, you will then assign it to the proper value.


    ### Declaration


    The declaration process with `declare` that the variable exists. Back to thinking
    of the variable like a shelf, the declaration is like when you are first picking
    out the shelf in the store.


    To set a variable aside, the word `var` is used before the name of the variable
