    shoppingList [ 0 ] ;


    Rice


    You can also set the value to the particular index by using the square bracket
    syntax


    Code


    shoppingList [ 1 ] = ‘Chips’ ;


    // your shoppingList is now going to be [ ‘Soda’, ‘Chips’, ‘Rice’ ]


    The quantity of items present in the array is going to use the distance property
    to tell you how many elements there are.


    Code


    shoppingList . length ;


    3


    The push and pop methods can be used so that elements can be added and removed
    from the finish of the array.


    Code


    shoppingList . push (‘A new car ‘ ) ;


    // shoppingList [ ‘Soda ‘ , ‘Buns’, ‘Rice’, ‘A new car’]


    shoppingList . pop() ;


    // shoppingList is now [‘Soda’, ‘Buns’, ‘Rice’]


    The code below is going to create a push, pop, and then iterate it over the array
    so that it can be passed to the name of the function that is labeled as helloFrom.
    helloFrom is going to be returned to the string for the greeting of: “Hello from”
    and then the user’s name. After you have finished with the push and pop method,
    the list of user’s name is going to be “Burt”, “Luke”, “Ron”, and “Tim”.


    Code


    Var helloFrom = function (personName) {


    Return “Hello from “ + personName ;


    }


    Var people = | ‘Burt’, ‘Luke’, ‘Ron’ | ;


    People.push (‘Tim’);


    People.push (‘Dr Evil’);


    People. Pop () ;


    For (var I = 0 ; I < people. distance  ; I ++) {


    Var greeting = helloFrom (people [ I ] ) ;


    Alert ( greeting ) ;


    }


