    # 第 16 章：JavaScript 中的 jQuery


    在修改和控制 DOM 时，有一组工具可以使用。不过，这有点混乱，因为不同类型的浏览器之间有不同的 DOM。为了让编码体验更简单，已经建立了大量的资源来隐藏重大的错误，并为与
    DOM 的交互提供了一种更统一的方式。大多数情况下它还会提供 AJAX 功能，从而消除了处理复杂编码带来的压力。


    jQuery 是一个知名的 DOM 库，被用于各种页面。但你用于与 DOM 通信的过程被称为应用程序编程接口或 API。jQuery 的语法非常独特，因为它基于美元符号
    `$`。


    ```javascript

    $(''.btn'').click(function () {

    // 选择一个不同的动作

    });

    ```


    此代码将附加到 `btn` 类中列出的所有元素的点击处理程序上。选择器语法将是 jQuery 的核心。jQuery 可以像脚本元素一样放置在网站上。你可以从
    `jquery.com` 获取文件，也可以从 CDN 添加。


    ```html

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>

    ```


    你不应该总是使用库，但你应该选择它是否具有基于开发者选择结果建立的既定结构。例如，如果 jQuery 有详尽的文档需要介绍，那么页面加载速度就会变慢，特别是在连接可能较弱移动浏览器上。


