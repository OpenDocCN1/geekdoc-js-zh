  md: '# Chapter 6: The Expression Language


    # The Expression Language Syntax


    One of the most important features in JSP 2.0 is the expression language (EL).
    Inspired by both the ECMAScript and the XPath expression languages, the EL is
    designed to make it possible and easy to author script-free JSPs, that is, pages
    that do not use JSP declarations, expressions, and scriptlet.


    The EL that was adopted into JSP 2.0 first appeared in the JSP Standard Tag Library
    (JSTL) 1.0 specification. JSP 1.2 programmers could use the language by importing
    the standard libraries into their applications. JSP 2.0 developers can use the
    EL without JSTL. However, JSTL also provides other libraries used for JSP authoring,
    so you may still need JSTL even if you are using JSP 2.0.


    An EL expression starts with ${ and ends with }. The construct of an EL expression
    is as follows:


    ```

    ${expression}

    ```


    For example, to write the expression x+y, you use the following construct:


    ```

    ${x+y}

    ```


    It is also common to concatenate two expressions. A sequence of expressions will
    be evaluated from left to right, coerced to Strings, and concatenated. If a+b
    equals 8 and c+d equals 10, the two two expressions produce 810:


    ```

    ${a+b}${c+d}

    ```


    Also, ${a+b}some${c+d}text results in 8some10text.


    If an EL expression is used in an attribute value of a custom tag, the expression
    will be evaluated and the resulting string coerced to the attribute''s expected
    type:


    ```

    <my:tag someAttribute="${expression}"/>

    ```


    The ${ sequence of characters denotes the beginning of an EL expression. If you
    want to send the literal ${ instead, you need to escape the first character: \${$.'
