  md: '# 214 Chapter 8: The Bean Tag Library


    # # The write Tag


    The **write** tag is the most frequently used tag in the Bean Tag Library. It
    prints the value of a scoped object or the value of a scoped object’s property
    to the browser. In addition, the **write** tag can format numbers and dates. The
    list of the **write** tag’s attributes is given in Table 8.2.


    | Attribute | Description |

    | --- | --- |

    | bundle | The name of the resource bundle containing the message to be printed.
    |

    | filter | Indicates whether any special HTML character (<, >, ", &) in the option
    labels will be replaced by its entity code (i.e. by &lt;, &amp;). |

    | format | The format to use when converting a scoped object or a scoped object’s
    property. |

    | formatKey | The key to search format string in application resources. |

    | ignore | A value of true indicates that no exception will be thrown if the scoped
    object or property referenced does not exist. By default, the value of ignore
    is **false**. |

    | locale | The name of the session-scoped variable under which the user’s selected
    object is stored. |

    | name | Specifies a scoped variable referencing a JavaBean whose property is
    to be accessed. If the **property** attribute is not specified, the **write**
    tag prints the value of the scoped object specified by this **name** attribute.
    |

    | property | Specifies the scope of the scoped variable assigned to the JavaBean
    specified by the **name** attribute. |

    | scope | Specifies the scope of the scoped variable assigned to the **name**
    attribute. The possible values are **page**, **request**, **session**, and **application**.
    |


    Table 8.2: The write tag’s attributes


    For instance, the following **write** tag prints the value of the scoped object
    **position**, if it can be found. Otherwise, it prints nothing.


    ```

    <bean:write name="position" ignore="true"/>

    ```


    If **position** is a string, the value of the string is displayed. If **position**
    is a non-string object, its toString method is called and its returned value is
    displayed. If the object does not have a toString method, the string representation
    of the object is displayed. Absence of the **scope** attribute makes the **write**
    tag search the scoped object in the following order: **page**, **request**, **session**,
    **application**.'
  merge: -1
