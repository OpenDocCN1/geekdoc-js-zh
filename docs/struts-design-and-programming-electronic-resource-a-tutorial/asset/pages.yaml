  md: '# # Chapter 12

    # Tiles Framework


    Web applications need a consistent look, which you can achieve by using the same
    layout for all the pages. A typical layout has a header, a footer, a menu, an
    ad section, and a body content. Normally, many parts—such as the header, the footer,
    and the menu—look the same in all pages. To support component reuse, a common
    part can be implemented as an external resource. You then have a choice of using
    a frameset or a layout table to include these external resources With a frameset,
    you reference each external resource using a frame. If layout tables are being
    used, each JSP in your application will include several files: one for the header,
    one for the footer, one for the menu, one for the body content, and so on. The
    JSP technology provides the **include directive (<%@ include %>, to include static
    files)** and the **include tag (<jsp:include>, to include dynamic resources)**
    to make component reuse easy. However, as will be discussed in the first section
    of this chapter, both JSP includes are not without shortcomings. If the layout
    needs changing, you will have to change all your JSPs.


    Tiles overcomes these failings and adds more features to enable you to lay your
    pages more easily and flexibly. First and foremost, Tiles allows you to create
    a layout JSP that defines the layout for all the other JSPs in an application.
    Changes to a layout JSP will be reflected in all the JSPs referencing it. This
    means, only one page needs to be edited to the layout changes.


    In addition to layout JSPs, Tiles allows you to write definition pages, which
    are more powerful than the former. A definition page can have one of the two formats,
    JSP and XML.


    This chapter teaches you how to make full use of Tiles by presenting four sample
    applications that gradually introduce the features in Tiles. Afterwards, the complete
    list of tags in the Tiles Tag Library is given.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 262 Chapter 12: The Tiles Framework


    Note

    The Tiles framework provides its services through a series of tags in

    The Tiles Tag Library. The classes that make up Tiles have been

    included in the struts.jar file, so there is no JAR file that you

    need to copy to your WEB-INF/lib directory. To reference the Tiles

    Tag Library'' tags indirectly, you need the struts-tiles.tld file in your

    WEB-INF directory and the following taglib element in your

    web.xml file.


    ```

    <taglib>

    <taglib-uri>/WEB-INF/struts-tiles.tld</taglib-uri>

    <taglib-location>/WEB-INF/struts-tiles.tld</taglib-location>

    </taglib>

    ```


    # The Problem with JSP Includes


    Figure 12.1 shows a page layout with a header, a footer, a menu, an ad section,

    and a body content. All parts, with the exception of the body content, are

    common to all JSPs. The header comes from the header.jsp page, the footer

    from the footer.jsp page, the menu from the menu.jsp page, and the ad

    section from the ad.jsp page.


    | Header |

    |---|---||

    | Menu | Body Content | Ad |

    | Footer |


    Figure 12.1: A typical layout of a Web page


    To achieve a consistent look, each of your JSPs will contain a layout table

    as this.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '```

    <html>

    <head><title>Page title</title></head>

    <body>

    <table>

    <tr>

    <td colspan="3"><%include file="header.jsp%%"></td>

    </tr>

    <tr>

    <td width="120"><%include file="menu.jsp%%"></td>

    <td>


    body content


    </td>

    </tr>

    <tr><td width="120"><%include file="ad.jsp%%"></td>

    </tr>

    <tr>

    <td colspan="3"><%include file="footer.jsp%%"></td>

    </tr>

    </table>

    </body>

    </head>

    ```


    With this approach, what differentiates one JSP from another is the body content.


    Now, what if you want to change the layout? For example, what if you want to make
    the menu wider by 30 pixels? Or, what if you want the ad to appear on top of the
    menu? This would require changing all your JSPs, which of course is a tedious
    and error-prone chore. Tiles can help solve this problem.


    # A Taste of Tiles


    This section presents the app12a application that illustrates how Tiles resolves
    the problems with JSP includes in defining a page layout. Instead of hardcoding
    the layout in every JSP, with Tiles you write a JSP that defines a layout. Each
    page that needs to use the layout, needs only reference the layout JSP. If you
    need to change the layout, you need only change one file: the layout JSP.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# 264 Chapter 12: The Tiles Framework


    The app12a application has two actions: displayAddProductForm and saveProduct.
    All the JSPs in this application use a Tiles layout JSP, myLayout.jsp page, which
    is given in Listing 12.1.


    # 12.1: The myLayout.jsp Tiles definition page


    ```

    <@ taglib uri="/WEB-INF/struts-tiles.tdld" prefix="tiles">\n<html>

    <head>

    <title><tiles:getAsString name="pageTitle"></title>

    </head>

    <body topmargin="0" leftmargin="0">

    <table>

    <tr>

    <td><tiles:insert attribute="header"/></td>

    </tr>

    <tr>

    <td><tiles:insert attribute="body"/></td>

    </tr>

    <tr>

    <td><tiles:insert attribute="footer"/></td>

    </tr>

    </table>

    </body>

    </html>

    ```


    There are two Tiles Tag Library’s tags used here, insert and getAsString. The
    insert tag defines an insert point into which an external resource will be inserted.
    The attribute specifies the logical name of the resource that will be inserted.


    The getAsString tag specifies a variable whose value will be specified by the
    JSP referencing the layout JSP.


    # Note


    Depending on the attribute used, the insert tag can be used in a layout JSP or
    a JSP that references a layout JSP.


    Any JSP that needs to use the layout specified by the myLayout.jsp page needs
    to reference the latter. For example, the displayAddProductForm.jsp page (in Listing
    12.2) uses the insert tag with the page attribute to reference the myLayout.jsp
    page.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Listing 12.2: The displayAddProductForm.jsp.


    ```

    <%@ taglib uri="/WEB-INF/struts-tiles.tld" prefix="tiles" %>

    <tiles:insert page="/jsp/myLayout.jsp" flush="true">

    <tiles:put name="footer" value="jsp/footer.jsp" />

    <tiles:put name="header" value="/jsp/header.jsp" />

    <tiles:put name="body"

    value="/jsp/displayAddProductForm-body.jsp" />

    <tiles:put name="pageTitle" value="Add Product" />

    </tiles:insert>

    ```


    Used with the page attribute, the insert tag tells Struts to use the layout page
    specified in its page attribute. Nested inside the insert tag are four put tags.
    Each put tag specifies a logical name or a variable in the definition page. The
    first put tag specifies that footer in the layout JSP must be replaced by the
    content of the /jsp/footer.jsp page. The last put tag, whose name attribute is
    assigned pageTitle, is not passing a path but a string literal. It is to tell
    that the getAttr tag with the same name (pageTitle) in the layout JSP must be
    replaced by the content of the put tag''s value attribute.


    The put tags in Listing 12.2 can be in any order because the layout is defined
    by the layout page. The displayAddProductForm-body.jsp page is of the body of
    this page, and is given in Listing 12.3


    # Listing 12.3: The displayAddProductForm.jsp


    ```

    <%@ taglib uri="/WEB-INF/struts-html.tld" prefix="html" %>

    <html:form action="/saveProduct">

    <table>

    <tr>

    <td>Product Name:</td>

    <td><html:text property="productName"/></td>

    <td><html:submit>Add</html:submit></td>

    </tr>

    </table>

    </html:form>

    ```


    You can run the app12a application by invoking the URL.

    http://localhost:8080/app12a/displayAddProductForm.do


    Using a layout JSP gives the advantage of being able to change the layout of all
    the JSPs in an application by updating one single layout JSP. This is a nice feature
    of Tiles, but there is much more, as you can see in the next sections.'
