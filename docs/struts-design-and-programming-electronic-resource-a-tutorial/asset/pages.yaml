  md: '# Chapter 8

    The Bean Tag Library


    Chapters 6 and 7 discussed how to access scoped objects from JSPs using the Expression
    Language (EL) and JSTL. The Bean and Logic Tag Libraries are Struts’ own tag libraries
    for achieving practically the same thing. This book and the Struts recommend you
    use the EL and JSTL, instead of the Bean and Logic Tag Libraries. In the face
    of it, Bean and Logic are discussed in detail both are still widely used and will
    continue to be used for a while. In addition, those planning to migrate from these
    libraries to JSTL will need a guide. This chapter discusses the Bean Tag Library
    and Chapter 9 the Logic Tag Library.


    # Note


    Use EL and JSTL instead of the Bean and Logic Tag Libraries for the following
    reasons:


    +   - The EL and JSTL are more powerful and more comprehensive than the Bean and
    Logic Tag Libraries.

    - Since JSTL is a standard, chances are most JSP programmers are more familiar
    with JSTL than Struts tag libraries.

    - The HTML Tag Library is Struts specific and has no equivalent in JSTL. Therefore,
    it will still be used in Struts applications.


    The list of tags in the Bean Tag Library is presented in Table 8.1.


    > 3 See http://struts.apache.org/userGuide/dev_bean.html. The developments of
    Struts Bean and Logic Tag Libraries and JSTL started almost at the same time,
    as such when the Struts project started there was not yet a powerful library such
    as JSTL.'
