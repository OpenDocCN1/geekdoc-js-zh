  md: '# Other Resources


    servlet also determines which view it will pass a request to. If there is business
    information that needs to be passed to a view, the controller servlet will encapsulate
    the information in a JavaBean and put the bean as an attribute of either the HttpServletRequest
    object or the HttpSession object. Finally, the controller servlet uses a RequestDispatcher
    object to forward the request to the view (JSP). In the JSP, you use custom tags
    to display the content of the JavaBean.


    Scoped Variables and Scoped Objects

    Adding an object (normally, but not necessarily, a JavaBean) as an attribute of
    an HttpServletRequest object, an HttpSession object, or the ServletContext object
    makes the object accessible to custom tags and the Expression Language expressions
    in a JSP, is that the object can be manipulated without scriptlets. Because of
    the resulting accessibility, the added object is called a scoped object. The attribute
    key being used is called a scoped object.

    Suppose you have the following code where request references the current HttpServletRequest
    object:


    ```

    ProductBean productBean = new ProductBean();

    request.setAttribute("product", productBean);

    ```


    In this case, you are creating a scoped variable named product that references
    a ProductBean object. Because you are adding the object to the HttpServletRequest
    object, the scoped variable and the scoped object can be referred to as the request-scoped
    variable and the request-scoped object, respectively. Adding an object to the
    HttpSession object creates a session-scoped variable and a session-scoped object,
    and adding one to the ServletContext object creates an application-scoped variable
    and an application-scoped object.


    In a moment I will present some examples of Model 2 applications, but first I''d
    like to discuss the role of the JavaBeans object that represent the model of the
    MVC pattern as transfer objects.'
