    Inside the **form** element in the validation configuration file, you use a **field**
    element to define the validation rule for an action form’s property. For instance,
    here is how you define the validation rule for the customer property in **app05a**.


    ```

    <field property="customer" depends="required,mask">

    <arg0 key="error. customer"/>

    <var>

    <var-name>mask</var-name>

    <var-value>^[a-z A-Z]*</var-value>

    </var>

    </field>

    ```


    A **field** **property** attribute specifies an action form’s property for which
    the validation rule is specified. The **depends** attribute specifies one or many
    validators defined under a **global** element of a validation file. The **global**
    and **validator** elements were discussed in the previous section.


    The **depends** attribute of the **field** element above specifies **required,mask**.
    This means, the action form’s property that the **field** element references (in
    this example, the **customer** property) will be validated by the required validator
    followed by the mask validator. The required and mask validators are two of the
    default validators in the Validator plugin.


    The **field** element can have any number of the following subelements: **msg**,
    **arg**, and **var**.


    The **msg** element specifies a key to use if the validation of the current property
    fails. The key must be present in your'
