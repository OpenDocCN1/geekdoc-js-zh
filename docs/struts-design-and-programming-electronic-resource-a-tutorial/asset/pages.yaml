    >\n  <nested:write property=\"contactPerson\"/>\n</nested:root>\n```\n\nThe root\
    \ tag specifies the scoped object, and the write tag prints the contactPerson\
    \ property. In the code above, write is nested inside the root tag, so that it\
    \ can access the scoped object specified by the latter. As such, the"
