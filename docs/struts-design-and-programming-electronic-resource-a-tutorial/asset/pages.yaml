  md: '# The Collection Utility Tag


    The use of the **redirect** tag is similar to that of the HTML Tag Library''s
    **link** tag, discussed in Chapter 3. The generated hyperlink can have zero, one,
    or request parameters. The attributes of the **redirect** tag are also similar
    to those of the **link** tag. Consult the section that discusses the **link**
    tag to understand how to use the attributes to control the generated hyperlink.


    # The Collection Utility Tag


    There is only one tag in this category, **iterate**. This tag is used to iterate
    a collection. For each iteration, the **iterate** tag creates a scoped variable
    that references the element being iterated. Table 9.5 lists the attributes of
    this tag.


    | Attribute | Description |

    |---|---|\| id | A required attribute that specifies the name of the page-scoped
    variable that is created in each iteration to reference the element being iterated.
    |

    | collection | Specifies the scoped variable that references the collection to
    be iterated. |

    | name | Specifies the scoped variable that references a collection or an object
    that contains a collection. If the latter is the case, the **property** must be
    present. |

    | property | Specifies the property of the scoped object specified by the **name**
    attribute. The **property** must return a collection. |

    | scope | The scope within which the scoped object named by the **name** property
    will be searched for. The possible values are **page**, **request**, **session**,
    **application**, or **any scope** (default). |

    | length | The maximum number of elements to be iterated through. If the **length**
    attribute is not present, the **iterate** tag iterates all the elements. |

    | offset | The zero-based index that specifies the number of first elements to
    be skipped. If the value of this attribute is 3, for example, the first four elements
    will not be iterated. |

    | type | The type of the element to be iterated. If not present, no type conversion
    is performed. |


    **Table 9.5:** The iterate tag''s attributes.


