  md: "# 142 Chapter 5: The Validator Plugin\n\nvalidate method of the action form.\
    \ After the validation, if one of the validations fails, control will be forwarded\
    \ to the resource specified by the input attribute of the corresponding action\
    \ element. This is exactly how a normal action form behaves.\n\nYou specify methods\
    \ must be used to validate your action form's properties in one or more validation\
    \ files. The Validator plugin includes a set of default validators, and most of\
    \ the time are sufficient for your needs. You specify the location of your validation\
    \ files in the value attribute of the set-property element inside the plug-in\
    \ element.\n\n```\n<plugin-in className=\"org.apache.struts.validator.ValidatorPlugin\"\
    >\n  <set-property property=\"pathnames\"\n    value=\"WEB-INF/validator-rules.xml,WEB-INF/validation.xml\"\
    />\n</plugin-in>\n```\n\nIn order to write validation rules, you need to understand\
    \ how to write a validation file, and this is the topic of discussion of this\
    \ section.\n\nA validation file is an XML file whose root element is form-validation\
    \ and must start with the following header.\n\n```\n<?xml version=\"1.0\" encoding=\"\
    iso-8859-1\"?>\n<!DOCTYPE form-validation PUBLIC\n  \"//Apache Software Foundation//DTD\
    \ Commons Rules Configuration 1.1.3//EN\"\n  \"http://jakarta.apache.org/commons/dtds/validator_1_1_3.dtd\"\
    >\n```\n\nAs you can see from the header, the DTD file is validator_1_1_3.dtd,\
    \ which by default is included in Struts and can be downloaded from the URL in\
    \ the header.\n\nThe form-validation element can contain any number of global\
    \ elements and any number of formset elements. The global element is important\
    \ because you define validators to validate the properties of your action forms\
    \ inside a global element. The formset element is indispensable because here is\
    \ the place where you define the validation rules for your action forms.\n\nHere\
    \ is the skeleton of a validation file.\n\n```\n<form-validation>\n<global>\n\
    \  <validator name=\"validator-1\">\n  ...\n  <validator name=\"validator-n\"\
    >\n```"
