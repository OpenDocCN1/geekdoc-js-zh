  md: '# Using BeanUtils


    http://jakarta.apache.org/commons/.


    The BeanUtils class is part of the BeanUtils component. The class''s static copyProperties
    method can be used to copy a JavaBean''s properties to another JavaBean. The signature
    of this method is as follows:


    ```

    public static void copyProperties(Object destination, Object origin);

    ```


    Using introspection, the method loops through all the properties in origin. For
    each property, the method checks if there is a property having the same name in
    destination. If there is, the value of the property is copied to the destination.
    BeanUtils can convert strings to primitive values and vice versa. Internally,
    BeanUtils uses the org.apache.commons.beans.ConvertUtils class to convert data.


    To create a converter, you must implement the convert method of the org.apache.commons.beans.ConvertUtils
    interface. Here is the signature of the convert method.


    ```

    public Object convert(Class type, Object value);

    ```


    The first argument is the type to which you want to convert the object as the
    second argument. The method returns the result of conversion. The default converters
    in org.apache.commons.beans.converters package.


    To register a custom converter, call the register method of the ConvertUtils class.
    The method has the following signature:


    ```

    public static void register(Converter converter, Class clazz);

    ```


    For instance, If you have a converter that can convert a string to a date, you
    can call the register method this way:


    ```

    ConvertUtils.register(java.util.Date.class, myDateConverter);

    ```'
