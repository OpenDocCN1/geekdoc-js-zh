  md: '# 88 Chapter 3: The HTML Tag Library


    # The multibox Tag


    The multibox tag is also rendered as a check box. However, the multibox tag is
    mapped to an array of strings or an array of other primitives. There are normally
    two multibox tags or more associated with the same property. Here is an example
    of three multibox tags that are all associated with the interests. Each multibox
    tag in this example represents an option.


    ```

    <html:multibo property="interests">au:html:multibo>Automotive

    <html:multibo property="interests">ga:html:multibo>Games

    <html:multibo property="interests">sp:html:multibo>Sports

    ```


    These multibox tags are translated into the following.


    ```

    <input type="checkbox" name="interests" value="au">Automotive

    <input type="checkbox" name="interests" value="ga">Games

    <input type="checkbox" name="interests" value="sp">Sports

    ```


    Each multibox tag has the following format.


    ```

    <html:multibo property="propertyName">value</html:multibo>

    >label

    ```


    label is the text to be displayed by the input element and does not have to be
    present. The value of the value attribute is sent to the server if the corresponding
    check box is checked. The label/value pairs for multibox tags may come from a
    scoped variable referencing a collection (See the sidebar “Managing Options with
    LabelValueBean”). In turn, the collection may obtain its members from a database
    or other storage. Then you use the JSTL foreach tag (see Chapter 7) or the Struts
    Logic Tag Library’s iterate tag to iterate the members of the collection. (See
    Chapter 9)


    Managing Options with LabelValueBeannThe multibox tag and several other tags use
    one or many label/value pairs as the source of options. The org.apache.struts.util.LabelValueBean
    class is a convenience class for encapsulating a label and a value. The LabelValueBean
    class is a JavaBean with two String properties, label and value. You can create
    a LabelValueBean object using one of its constructors.'
