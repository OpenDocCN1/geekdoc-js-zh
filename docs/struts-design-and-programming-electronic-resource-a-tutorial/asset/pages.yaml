  md: '# The html Tag


    # Note


    To use the HTML Tag Library and reference its tags indirectly from JSPs, you must
    add this taglib tag to your web.xml file:


    ```

    <taglib>

    <taglib-uri>/tags/struts-html/taglib-uri>

    <taglib-location>/WEB-INF/struts-html.tld/taglib-location>

    </taglib>

    ```


    On top of that, you must copy the struts-html.tld file (in the lib directory of
    Struts’ deployment directory) to your WEB-INF directory.


    # Note


    A list of attributes are given for each tag. All attributes are optional except
    those indicated by an asterisk (*). Default values are underlined.


    Attributes of a typical tag falls into two classes: Struts related attributes
    and HTML attributes. The latter specify JavaScript event handlers and are simply
    passed to the rendered code by the tag handler. For example, the form tag has
    the action attribute, which has a special purpose in Struts and will be processed
    by the tag handler. The form tag also has the onSubmit attribute, which is not
    processed and will simply be rendered as the onSubmit attribute of the resulting
    HTML form element. The onsubmit attribute, and many other attributes that do not
    get processed by Struts, will not be included in the tables of attributes. The
    purpose of doing so is twofold. First, we save space. Second, you can focus on
    the fewer attributes that are Struts-related.


    # The html Tag


    The html is used to generate an html element. This tag has two attributes, locale
    and xhtml. Both attributes are described in Table 3.2.


    For example, the <html:html lang="true"> tag in a JSP running on your computer
    generates the following element:


    ```

    <html lang="en-US">

    ```


    The xhtml forces the other HTML tags in the same page to be rendered as XHTML
    elements, rather than HTML elements. Therefore, the presence of <html:html xhtml="true">
    will make <html:img> <img src=".../> rather than <img src="...">'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Chapter 3: The HTML Tag Library


    | Attribute | Description | Allowed Value(s) |

    | --- | --- | --- |

    | lang | Indicates whether the generated html element will have the lang attribute.
    A value of true renders the lang attribute with the locale in the user''s session.
    If the information is not found in the HttpSession object, the language from the
    Accept-Language HTTP header is used. If no Accept-Language header is found in
    the current request, the default language for the server is used.. | true or false
    |

    | xhtml | When set to true, forces other HTML tags to be rendered as XHTML elements
    rather than HTML elements. | true or false |


    Table 3.2: The html tag’s attributes


    Note

    Visit http://www.w3.org/TR/xhtml1/ for more information on XHTML.


    # The base Tag


    The base tag generates an HTML base element, which specifies a base URL for all
    links in a page. It can only appear inside the head element. For instance, if
    you specify the following base element in your HTML page:


    ```

    <base href="http://domain/app/images/" />

    ```


    all links in the page are relative to the value of the base element’s href attribute.
    Therefore, if you have the img element <img src="logo.gif"> in the same page,
    the browser will interpret the img element as referencing the absolute URL http://domain/app/images/logo.gif.


    Table 3.3 lists the attributes of the base tag.


    | Attribute | Description | Allowed Value(s) |

    | --- | --- | --- |

    | server | The server name instead of the one returned by request.getServer().
    | string |

    | target | The target window for this base reference | string |


    Table 3.3: The base tag’s attributes'
