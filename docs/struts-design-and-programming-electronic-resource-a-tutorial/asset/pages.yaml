  md: '# Using forward


    The forward tag forwards the user to the specified location. This tag has an attribute,
    name, which is a required attribute that specifies the logical name of a forward
    destination, defined in the Struts configuration file.


    Here is an example of the forward tag.


    ```

    <logic:forward name="displayLoginForm"/>

    ```


    # Using redirect


    The redirect tag contains a hyperlink and redirects the browser to resource specified
    by the hyperlink, either external or internal. It supports URL rewriting so that
    the session identifier will be included in the target URL. Its attributes are
    given in Table 9.4.


    | Attribute | Description | Possible Value(s) |

    | --- | --- | --- |

    | anchor | Specifies a destination Struts action Optional anchor tag (#xxx) to
    be added to the generated hyperlink. Do not include the # character. | string
    |

    | forward | The logical name of a forward element within the global-forwards element
    in the Struts configuration file, that contains the actual content-relative URI
    of the destination of the redirect. | string |

    | href | The destination URL to which the user will be redirected. | string |

    | name | A scoped value that references a Map containing query parameters of the
    generated hyperlink (if the property attribute is not specified), or a scoped
    value whose property parameters returns a Map querying parameters (if property
    is specified). | string |

    | page | The module-relative path (beginning with a "/ character) to which this
    hyperlink will transfer control if activated. | string |

    | paramId | The name of the request parameter that will be dynamically added to
    the generated hyperlink. | string |'
