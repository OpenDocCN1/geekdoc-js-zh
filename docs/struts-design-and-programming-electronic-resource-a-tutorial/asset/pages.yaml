    # The HTML Tag Librarys''s errors Tag


    You have seen the errors tag in action in the previous chapters. Now it is time
    to take a closer look.


    The errors tag is used to display error messages, especially those produced by
    an action form''s validate method. Understanding it will enable you to make full
    this tag.


    Like custom tags, the errors tag communicates with the Struts action servlet through
    scoped objects. This means, for error messages to be displayed by the errors tag,
    they must be encapsulated in a scoped object. The errors tag was designed to locate
    the request-scoped object referenced by a variable having a predefined name, which
    must be the same as the value of the ERROR_KEY field of the org.apache.struts.Globals
    class. The value of this field itself is not important.


    To support the errors tag, the Struts action servlet stores the ActionErrors returned
    by an action form''s validate method in the current HttpServletRequest object,
    using this code.


    ```

    ActionErrors actionErrors = actionForm.validate();

    request.setAttribute(Globals.ERROR_KEY, actionErrors);

    ```


    What does the errors tag do with the ActionErrors it retrieves? First of all,
    note that the errors tag have access to any properties file you registered in
    the struts-config.xml file using the message-resources tag. Note that the ActionErrors
    object have access to contains zero or many ActionMessage object. Each ActionMessage
    object contains a key and zero or more values and you add an ActionMessage object
    using this code:'
