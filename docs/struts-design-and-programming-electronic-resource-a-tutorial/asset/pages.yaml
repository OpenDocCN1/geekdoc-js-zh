  md: "# Employing View Manager and Action Manager\n\n# Employing View Manager and\
    \ Action Manager\n\nIt is easy to see how the action servlet in the previous application\
    \ can easily become bloated as the application grows in complexity. This is due\
    \ to the fact that the code resides inside the controller servlet's process method.\
    \ To avoid this, you can make the application more modular by introducing two\
    \ modules: action manager and view manager.\n\nThe following example app0ib adds\
    \ a view manager and an action manager to the previous sample application. The\
    \ ActionManager class, which represents the action manager, is given in Listing\
    \ 1.7 and the ViewManager class, a representation of the view manager, in Listing\
    \ 1.8\n\n# Listing 1.7: The ActionManager\n\n```\npackage app0ib;\nimport java.io.IOException;\n\
    import java.servlet.ServletExceptionException;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\npublic class ActionManager {\n\
    \    public void execute(HttpServletRequest request,\n                       \
    \  HttpServletResponse response)\n        throws ServletException, IOException\
    \ {\n\n    String action = request.getParameter(\"action\");\n\n    // execute\
    \ an action if necessary\n    if (action.equals(\"displayAddProductForm\")) {\n\
    \        // do nothing\n    }\n    else if (action.equals(\"saveProduct\")) {\n\
    \        // read and save the product into the database\n        ProductTO product\
    \ = new ProductTO();\n        product.setProductName(\n            request.getParameter(\"\
    productName\"));\n        product.setDescription(\n            request.getParameter(\"\
    description\"));\n        product.setPrice(request.getParameter(\"price\"));\n\
    \n        // code for persisting the Product object goes here\n        request.setAttribute(\"\
    product\", product);\n    }\n}\n```"
