    # Struts Security Configuration


    You can restrict access to part of your Struts application by configuring the
    web.xml file, as shown in the app1a and app1b applications. Struts adds a feature
    that allows you to specify which role(s) may access an action. You achieve this
    by specifying the roles in the roles attribute of an action.


    For example, app1c provides an example of using the roles attribute. To be specific,
    you use the deployment descriptor, in which you restrict access to all URLs ending
    with .do, in effect restricting access to all Struts actions.


    ```

    <security-constraint>

    <web-resource-collection>

    <web-resource-name>Admin Area</web-resource-name>

    <url-pattern>*.do</url-pattern>

    </web-resource-collection>

    <auth-constraint>

    <role-name>admin</role-name>

    <role-name>manager</role-name>

    </auth-constraint>

    </security-config>

    <login-method>BASIC</auth-method>

    <realm-name>User Basic Authentication</realm-name>

    </login-config>

    <security-role>

    <role-name>admin</role-name>

    <role-name>manager</role-name>

    <role-name>none</role-name>

    </security-role>

    ```


    You also specify that two roles may access the application, admin and manager.'
