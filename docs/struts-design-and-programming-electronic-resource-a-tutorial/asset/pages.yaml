    # The global-exceptions Element


    You use this element to register all exception handlers to take care of exceptions
    that may be thrown by the execute method of an Action object. You may specify
    an exception handler for an action in the action element, in which case the exception
    handler defined in the action element will override those in the global-exceptions
    element. The global-exceptions element is described as follows in the DTD.


    ```

    <ELEMENT global-exceptions (exception*)>

    ```


    The global-exceptions element may have the optional attribute id, which is an
    identifier for this element.


    # The global-forwards Element


    This element describes all forward destinations that are available to all Action
    objects if the specified forward destination is not defined in the action element
    for a Struts action. In the DTD, this element is described as follows.


    ```

