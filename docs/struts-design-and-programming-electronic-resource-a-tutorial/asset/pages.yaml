    # The Time Zone Tag


    The timeZone tag is used to specify the time zone in which time information

    to be formatted or parsed in its body content. The syntax is as follows:


    ```

    <fmt:timeZone value="timezone"

    body content

    </fmt:timeZone>

    ```


    The body content is JSP. The attribute value can be passed a dynamic value of

    type String or java.util.TimeZone. The values for US and Canada time zones

    are given in Table 7.12.


    If the attribute is null or empty, the GMT time zone is used.


    The following example uses the timeZone tag to format dates with time

    zones.


    ```

    <fmt:timeZone value="GMT+1:00">

    <fmt:formatDate value="${now}" type="both" dateStyle="full"

    timeStyle="full"/>

    </fmt:timeZone>

    <fmt:timeZone value="HST">

    <fmt:formatDate value="${now}" type="both" dateStyle="full"

    timeStyle="full"/>

    </fmt:timeZone>

    <fmt:timeZone value="CST">

    <fmt:formatDate value="${now}" type="both" dateStyle="full"/>

    ```'
