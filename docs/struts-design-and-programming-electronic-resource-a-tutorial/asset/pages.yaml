- img_proc: true
  md: '# The cookie Tag


    If the property attribute is present, the write tag displays the property of the
    specified scoped object. In this case, the name attribute must be present of the
    scoped object and the property attribute specifies the object''s property. For
    instance, the following write tag prints the value of the streetAddress property
    of the request-scoped object.


    ```

    <bean:write name="address" property="streetAddress" scope="request"/>

    ```


    The following write tag prints the value of the second element of the collection
    returned by the phones property of the scoped object address.


    ```

    <bean:write name="address" property="phones[1]" scope="request"/>

    ```


    The write tag can also perform string formatting of dates and numbers using the
    format attribute. For example, the following write tag prints the scoped object
    now (which is a java.util.Date) in the MM/dd/yyyy format.


    ```

    <bean:write name="now" format="MM/dd/yyyy"/>

    ```


    For date formatting, check the JavaDoc for the java.text.SimpleDateFormat class.


    As another example, the following write tag formats a number in the #,## format.


    ```

    <bean:write name="quantity" format="#,####"/>

    ```


    More information about number formatting can be found in the JavaDoc for the java.text.DecimalFormat
    class.


