  md: "# 194 Chapter 7: JSTL\n\n```\n</c:forEach>\n```\n\nFor each iteration, the\
    \ forEach tag creates a scoped variable name specified by the var attribute. In\
    \ this case; the scoped variable is named phone. The out tag within the forEach\
    \ tag is used to display the value of phone. The scoped variable is only available\
    \ from the beginning and closing forEach tags, and will be removed before the\
    \ closing forEach tag.\n\nThe following forEach tag is similar to the previous\
    \ one. However, it uses the varStatus javax.servlet.jsp.core.LoopTagStatus. The\
    \ LoopTagStatus interface has the count property that returns the \"count\" of\
    \ the current round of iteration. The value of status.count is 1 for the first\
    \ iteration, for the second iteration, and so on. By testing the remainder of\
    \ status.count%2, you know whether the tag is processing an even-numbered or odd-numbered\
    \ element.\n\nIn addition, the forEach tag is used in conjunction with the choose,\
    \ when, and otherwise tags to display the items in an HTML table. The choose tag\
    \ is used to test the value of varStatus.count and if it is evenly divisible by\
    \ 2 (which indicates it is an even number), the table row is displayed in red\
    \ (color code #ff0000). Otherwise, the table row is displayed in green (color\
    \ code 00ff00).\n\n```\n<c:forEach var=\"phone\" items=\"${address.phones}\"\n\
    \  varStatus=\"status\">\n  <c:choose>\n    <c:when test=\"${status.count%2==0}>\n\
    \      <tr bgcolor=\"#ff0000\">\n    </c:when>\n    <c:otherwise>\n      <tr bgcolor=\"\
    #00ff00\">\n    </c:otherwise>\n  </c:choose>\n  </c:choose>\n  <td><c:out value=\"\
    ${phone}/></td>\n</tr>\n</c:forEach>\n</table>\n```"
