    # Redisplaying A Form’s Previous Values


    Recall that Struts stores the instance of ActionForm it creates as an attribute
    of the HttpServletRequest or the HttpSession object, depending on the value of
    the scope attribute of the corresponding action element. The name used in the
    form-bean element is used as the attribute key. Therefore, if you define the following:


    ```

    <form-bean name="productForm" type="myPackage.ProductForm"/>

    ```


    the key used for the ProductForm instance is the productForm. If validation is
    not successful, Struts forwards the control to the resource indicated by the input
    attribute. The tags in the HTML Tag Library can be used to access the action form
    in the HttpServletRequest or HttpSession object and'
