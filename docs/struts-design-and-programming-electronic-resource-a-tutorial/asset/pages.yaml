  md: "# 30 Chapter 1: Model 2 and Struts\n\nAn action element can have more than\
    \ one forward subelement, each specifying a possible forward destination. Why\
    \ you may need more than one forward element is because the code execution in\
    \ your action object may branch. For example, the insert product operation in\
    \ the saveProduct action may be successful or it may fail. If you want to be forwarded\
    \ to the displaySavedProduct.jsp upon a successful insert and to the error.jsp\
    \ page upon a failed attempt, you would have the following action element.\n\n\
    ```\n<action path=\"saveProduct\">\n  type=\"myPackage.SaveProductAction\">\n\
    \  <forward name=\"success\" path=\"/jsp/displayConfig.jsp\"/>\n  <forward name=\"\
    failed\" path=\"/jsp/error.jsp\"/>\n</action>\n```\n\nIf a forward element is\
    \ used for more than one action, you can write it within the global-forwards element.\
    \ For example, a Struts application may have a common error page, to which control\
    \ will always be forwarded if an error occur upon the invocation of any action.\
    \ In this case, you would have:\n\n```\n<global-forwards>\n  <forward name=\"\
    failed\" path=\"/jsp/error.jsp\"/>\n</global-forwards>\n```\n\n# Action, ActionForward,\
    \ and ActionMapping\n\nLet's now look at some of the classes in the Struts Application\
    \ Programming Interface (API). Of particular interest are three classes in the\
    \ org.apache.struts.action package: Action, ActionForward, and ActionMapping.\
    \ Struts employs the Commons Digester library to create instances of these classes\
    \ based on the settings in the configuration file.\n\nThe Action class represents\
    \ action objects. If your action class has code that needs to be executed upon\
    \ the action invocation, you must write an action class that extends Action. You\
    \ must override its execute method and write your code there.\n\nSuppose you have\
    \ a saveProduct action that is defined as follows in the configuration file.\n\
    \n> ² I explained how Digester works in detail in my other book “How Tomcat Works”."
