    If you do not understand what this description means, feel free to read the article
    on XML at www.brainysoftware.com.


    All the elements that can appear over the struts-config element are discussed
    in the section below in alphabetical order.


    # Note


    Each element has a list of attributes. Required attributes are indicated by an
    asterisk (*).


