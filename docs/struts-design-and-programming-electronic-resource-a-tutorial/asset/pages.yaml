  md: '# 106 Chapter 3: The HTML Tag Library


    The img tag is useful if the source of the image is dynamic. For example, a thumbnail
    for a different product is either a JPG file or a GIF file with the product identifier
    as the file name. For the first product in the database, the thumbnail filename
    is 1.jpg, for the second product it is 2.gif, and so on. Since the image source
    is not known at design time, the HTML img element cannot used.


    # Note


    A better example of how to use img can be found in Chapter 17.


    The img tag allows you to reference a Struts action and at the same time pass
    one or many request parameters. In the aforementioned example, the resulting img
    element would look like this.


    ```

