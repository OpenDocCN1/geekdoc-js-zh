    Validation is successful if the validate method returns null or an empty ActionErrors
    object. If it returns a non-empty ActionErrors, the validation failed.


    For example, if you have defined that to add a product, both the productName and
    description properties must not be empty, you can write the following validation
    rules:


    ```

    public ActionErrors validate(ActionMapping mapping,

    javax.servlet.ServletRequest request) {

    ActionErrors actionErrors = new ActionErrors();

    If (productName.equals("")) {

    ActionErrors.add(...);

    }

    If (description.equals("")) {

    ActionErrors.add(...);

    }

    return actionErrors;

    }

    ```


    If validation was successful, control will be forwarded to the action object of
    that action. If validation failed, control is forwarded to a resource specified
    in the input attribute of the given action element. If no input attribute is present,
    the user will see an an error message.


    The exact description of how the action servlet processes an action form is given
    in Figure 2.1.


    When working with action forms, use the following attributes in the corresponding
    action element: name, input, scope, validate. The Struts action servlet does the
    following when an action is invoked.


    +   1. If the name attribute of the element is present, create an instance of
    the ActionForm. The class name can be retrieved from the corresponding form-bean
    element.

    2. Store the ActionForm instance in either the HttpServletRequest object or the
    HttpSession object, depending on the value of the scope attribute of the action
    element. If the scope is missing, the instance will be stored as an attribute
    of the HttpServletRequest object.'
