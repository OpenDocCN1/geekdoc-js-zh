  md: '# 220 Chapter 8: The Bean Tag Library


    # # The message Tag


    You use the message tag to retrieve an internationalized message and write it
    to the output stream. You can specify up to five parametric replacements. The
    list of attributes for the message tag is presented in Table 8.9.


    | Attribute | Description |

    |---|---|n| arg0 | First replacement argument. |

    | arg1 | Second replacement argument. |

    | arg2 | Third replacement argument. |

    | arg3 | Fourth replacement argument. |

    | arg4 | Fifth replacement argument. |

    | bundle | The name of the resource bundle containing the key and value of the
    message to be displayed. |

    | key | The message key of the requested message. |

    | locale | The name of the session-scoped variable that references the current
    Selected object. |

    | name | Specifies the scoped object whose property is specified in the property
    attribute. If no property attribute is present, the value of the scoped object
    itself will be used as the message resource key. |

    | property | Specifies the property of the scoped object specified by the name
    attribute, whose value will be used as the message resource key. |

    | scope | Specifies the scope of the scoped variable of the scoped object specified
    by the name attribute.


    Table 8.9: The message tag''s attributes


    For example, in the app08a application, you have an ApplicationResources.properties
    file with the following key/value pair:


    ```

    greetings=Welcome to our Website

    ```


    The ApplicationResources.properties file is loaded by Struts, thanks to the following
    message-resources element in the struts-config.xml file.


    ```

    <message-resources parameter="ApplicationResources"/>

    ```


    Now, you can use the following message tag to retrieve the value of the greetings
    key.


    ```

    <bean:message key="greetings"/>

    ```'
