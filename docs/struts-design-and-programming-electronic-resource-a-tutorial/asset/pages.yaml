    pageTitle\" value=\"Confirmation\" />\n    <put name=\"body\" value=\"/jsp/displayMessage.jsp\"\
    \ />\n  </definition>\n</tiles-definitions>\n```\n\nSee the extends attribute\
    \ in the last definition element? Here, the first definition element is a base\
