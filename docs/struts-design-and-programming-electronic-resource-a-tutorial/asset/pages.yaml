  md: 'Just like non-Struts Model 2 applications, a Struts action may or may not have
    code to execute when the action is invoked. If there is no code to run, you can
    simply tell Struts to forward control to a JSP. For example, the displayAddProductForm
    action in the app01a and app01b applications did not have any code to execute,
    so you could forward control to the displayAddProductForm.jsp page. In Struts,
    use the forward attribute of an element to skip the action manager and forward
    control directly to a view. For the displayAddProductForm action in app01a and
    app01b, you would have the following element in the configuration file.


    ```

    <action path="/displayAddProductForm"

    forward="/jsp/displayAddProductForm.jsp"/>

    ```


    If there is code to run, you must write the code in a separate class called an
    action class. You select the fully qualified name of the action class in the type
    attribute of the corresponding action element. For instance, if the action class
    for saveProduct is myPackage.SaveProductAction, you would have the following action
    element.


    ```

    <action path="/saveProduct"

    type="myPackage.SaveProductAction" />

    ```


    Upon invocation of the action, Struts will instantiate the myPackage.SaveProductAction
    class and execute the code in it. More information on action classes can be found
    in the next subsection.


    The invocation of the code in an action object, Struts must forward control to
    a view. You use the forward child element inside an action element to specify
    the view:


    ```

    <action path="/readConfig"

    type="myPackage.SaveProductAction">

    <forward name="success" path="/jsp/displayConfig.jsp" />

    </action>

    ```


    # Warning


    Do not confuse the forward attribute with the forward element.


    The forward element has two attributes, name and path. The name attribute specifies
    an identifier or a logical name for the forward element and can be any string.
    The path attribute specifies the path to a resource (normally a JSP) to which
    control will be forwarded.'
  merge: -1
