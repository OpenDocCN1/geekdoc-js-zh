  md: '# # Chapter 13

    Securing Struts Applications


    Security is one of the most critical issues in Web application development. As
    for servlet applications, there are two ways to secure application resources,
    by configuring the application and by writing Java code. The former is more popular
    because of its flexibility. By editing your deployment descriptor (web.xml file),
    you can change your security policy without rewriting code. For instance, you
    can restrict access to certain roles and HTTP methods, determine how users authenticate
    themselves and so forth. Since Struts is based on the Servlet technology, securing
    a Struts application will center on this configuration, plus the security feature
    in Struts itself.


    To be good at security configuration, you need to be familiar with the concepts
    of principal and roles, therefore this chapter starts with a discussion of both.
    Afterwards, the chapter explains how to write a security policy and deals with
    authentication methods. After a section on how to hide resources and another on
    Struts-specific security features, this chapter concludes with the second way
    of securing servlet applications: by writing Java code.


    # Principals and Roles


    A principal is an entity which can be either an individual or an organization.
    A role is an abstract grouping of users. Regard a role as a position. Vera, Chuck
    and Dave are users. Administrator, Director, Manager, Programmer are roles. Any
    user can be in no role or in many roles. For example, Vera can be in the Manager
    and Programmer roles, Chuck can be in the Administrator role, and so on.


    Every servlet container provides you with a different mechanism of managing users
    and roles. You should consult the documentation that accompanies the servlet container
    on this.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 286 Chapter 13: Securing Struts Applications


    In Tomcat, for example, you do this by editing the tomcat-users.xml file

    under the conf directory of the deployment directory. For example, here is an

    example of the tomcat-users-xml file.


    ```

    <tomcat-users>

    <role rolename="manager"/>

    <role rolename="admin"/>

    <user username="vera" password="arev" roles="manager"/>

    <user username="chuck" password="chuck" roles="admin"/>

    <user username="dave" password="secret" roles="manager, admin"/>

    </tomcat-users>

    ```


    The file says that there are two roles (admin and manager) and three users

    (vera, chuck, and dave). You can add as many roles and users as you want to

    the tomcat-users.xml file.


    # Writing Security Policy


    Writing a security policy involves the following tasks:


    +   - Protecting resources

    - Determining the login method for user authentication.


    These tasks are discussed in the following subsections.


    # Protecting Resources


    You enforce the security policy by using the security-constraint element in

    the deployment descriptor (web.xml file). Here is the description of this

    element.


    ```

    <!ELEMENT security-constraint (display-name,

    web-resource-collection+, auth-constraint?,

    user-data-constraint?)>

    ```


    This means that the security-constraint element can have an optional

    display-name subelement, one or more web-resource-collection

    elements, an optional auth-constraint subelement, and an optional user-

    data-constraint subelement.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Writing Security Policy 287


    You specify the set of web resources that you want to protect in the web-resource-collection
    element, and you use the auth-constraint element to define the user roles allowed
    to access them. The subelements are described further below.


    You use the web-resource-collection element to specify which resources must be
    protected by specifying a URL pattern for those resources. In addition, you can
    also specify which HTTP methods (GET, POST, etc) should be allowed access to the
    protected resources. The web-resource-collection element can have the following
    subelements.


    +   * web-resource-name. A resource identifier. This element is required.

    * description. A description of the resource. This element is optional.

    * url-pattern. Specifies a URL pattern under which the restriction must be applied.
    There can be zero or many url-pattern elements in a web-resource-collection element.
    For example, if you want to protect the resources in the members and trading directories,
    you need two url-pattern elements.

    * http-method. Specifies the restricted method. For example, if the value of the
    http-method element is GET, then all GET requests will be restricted.


    The auth-constraint element can have the following subelements.


    +   * description. A description. This is an optional element.

    * role-name. The user role allowed access to the restricted resource. There can
    be zero to many role-name elements in an auth-constraint element.


    The user-data-constraint element can contain the following elements:


    +   * description. A description. This is an optional subelement.

    * transport-guarantee. The possible values are NONE, INTEGRAL, CONFIDENTIAL. A
    value of NONE means the application does not require any transport guarantees.
    INTEGRAL means the data must be transported in such a way that it cannot be changed
    in transit. CONFIDENTIAL means that the transmitted data must be encrypted.


    The following is an example of the security-constraint element.


    ```

    <security-constraint>

    <web-resource-collection>

    ```'
  merge: -1
  pgno: 296
- img_proc: true
  md: "# 288 Chapter 13: Securing Struts Applications\n\n```\n<web-resource-name>Manager\
    \ Area</web-resource-name>\n<url-pattern>/manager/*.do</url-pattern>\n</web-resource-collection>\n\
    <auth-constraint>\n  <role-name>manager</role-name>\n</auth-constraint>\n</security-constraint>\n\
    ```\n\nThe security-constraint element will cause the Web container to block any\
    \ request that matches the pattern /manager/*.do that does not come from a user\
    \ belonging to the manager role. Because no http-method is used, the Web container\
    \ will attempt to block all requests regardless of the HTTP method being used\
    \ to access the resource.\n\nIn addition, you should also register all roles used\
    \ to access the restricted resources using the security-role element. Inside the\
    \ security-role element, you write a role-name element for each role. For example,\
    \ the following security-role defines two roles, admin and manager.\n\n```\n<security-role>\n\
    \  <role-name>admin</role-name>\n  <role-name>manager</role-name>\n</security-role>\n\
    ```\n\n# Specifying the Login Method\n\nAfter you specify which resources are\
    \ restricted and which roles may she access them, you must specify how a user\
    \ can login to prove that he or she is in the allowed role(s). You specify the\
    \ login method by using the login-config element. Here is the description of the\
    \ login-config element.\n\n```\n<!ELEMENT login-config (auth-method?, realm-name?,\n\
    form-login-config?)*)>\n<!ELEMENT auth-method (#PCDATA)>\n<!ELEMENT realm-name\
    \ (#PCDATA)>\n<!ELEMENT form-login-config (form-login-page, form-error-page)*)>\n\
    ```\n\nThe auth-method element specifies the method for authenticating users.\
    \ Its possible values are BASIC, DIGEST, FORM, or CLIENT-CERT. The next section,\
    \ “Authentication Methods,” explains more about these methods."
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Authentication Methods 289


    The realm-name element specifies a descriptive name that will be displayed in
    the standard Login dialog when using the BASIC authentication method.


    The form-login-config element is used when the value of <auth-method> is FORM.
    It specifies the login page to be used and the error page to be displayed if authentication
    failed.


    Here is an example of the login-config element.


    ```

    <login-config>

    <auth-method>BASIC</auth-method>

    <realm-name>User Basic Authentication</realm-name>

    </login-config>

    ```


    Authentication methods are the subject of discussion on the next section.


    # Authentication Methods


    There are several authentication methods: basic, form-based, digest, Secure Socket
    Layer, and client certificate authentication. With the basic authentication, the
    Web container asks the browser to display the standard Login dialog box which
    contains two fields: the user name and the password. The standard Login dialog
    box will look different in different browsers. In Internet Explorer, it looks
    like one in Figure 13.1


    ![](img/b333f2b2346b8836cf06378200dc8816_298_0.png)


    Figure 13.1: The standard Login dialog box in Internet Explorer'
  merge: -1
  pgno: 298
- img_proc: true
  md: "# 290 Chapter 13: Securing Struts Applications\n\nIf the user enters the correct\
    \ user name and password, the server displays the requested resource. Otherwise,\
    \ the Login dialog box is redisplayed, asking the user to try again. The server\
    \ will let the user try to log in three times, after which an error message is\
    \ sent. The drawback of this method is that the user name and password are transmitted\
    \ to the server using the base64 encoding, which is a very weak encryption scheme.\
    \ However, you can use SSL to encrypt the user's credentials.\n\nForm-based authentication\
    \ is similar to Basic authentication. However, you specify a page yourself to\
    \ customize the look and feel of your login dialog. This authentication method\
    \ will also display a Custom Error page written by the developer on a failed attempt\
    \ to login. Again, you can use SSL to encrypt users' credentials.\n\nDigest authentication\
    \ works like Basic authentication; however, the login information is not transmitted.\
    \ Instead, the hash of the passwords is sent. This protects the information from\
    \ malicious sniffers.\n\nBasic and digest authentication methods are specified\
    \ in RFC2617, which you can find at http://ftp.isi.edu/in-notes/rfc2617.txt. More\
    \ information about SSL can be found at http://home.netscape.com/eng/ssl3/3-SPEC.HTM.\n\
    \nThe following subsections provide examples of the basic and form-based authentication\
