  md: "# Chapter 5: The Validator Plugin\n\nAs you can see, the **msg** attribute\
    \ references the **errors.required** key. For the error handling to work, you\
    \ must have a key/value pair whose key is `errors.required` in your `ApplicationResources.properties`\
    \ file:\n\n```\nerrors.required=The error message that will be displayed.\n```\n\
    \nThis mechanism allows you to pass arguments. For example, suppose you In to\
    \ display which property is required when using the required validator In this\
    \ case, you can have the following in your `ApplicationResources.properties` file:\n\
    \n```\nerrors.required={} is required.\n```\n\nThe `{}` represents an argument.\
    \ You can pass an argument using the **arg** element inside your **field** element\
    \ in your validation file, e.g. in the `validation.xml` file.\n\n```\n<form name=\"\
    saveCustomerOrder\">\n  <field property=\"customer\" depends=\"required\">\n \
    \   <arg key=\"error.customer\" position=\"0\"/>\n  </field>\n</form>\n```\n\n\
    The **arg** element specifies a key (**error.customer**) and the position. Position\
    \ 0 references that it is first argument in the value of the key/value pair.\n\
    \nYou can also override the default error message in a validator by using a **msg**\
    \ element inside a field. For example, in the `validation.xml` file in `app05a`,\
    \ you can find:\n\n```\n<field property=\"quantity\" depends=\"required,integer\"\
    >\n  <msg name=\"required\" key=\"order.quantity\"/>\n</field>\n```\n\nThe **msg**\
    \ element defines a custom message key to use when one of the validators for the\
    \ corresponding field fails. Therefore, if a **field** element's **depends** attribute\
    \ contains more than one validator, you can have more than one msg element too.\
    \ The **msg** element can accept these attributes.\n\n+   - **name**. The name\
    \ of the field whose default error message will be overridden by this **msg**\
    \ element. The **name** attribute must be present.\n- **bundle**. The resource\
    \ bundle name that the key should be resolved.\n- **key**. The key in the application\
    \ resources file, whose value will be used as the custom error message."
