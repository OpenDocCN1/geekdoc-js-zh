  md: '# The table Tag


    The table tag displays a collection data in an HTML table. The name attribute
    specifies the scoped variable that references the Collection. The table tag iterates
    the specified Collection and, for each iteration, creates a scoped variable that
    references the element iterated over. You specify the name of the scoped variable
    using the id attribute. You can then use the column tag to access the collection''s
    element and display the value of the element''s property. The table tag by default
    supports paging and sorting. See the setProperty tag for details on these features.


    The HTML table rendered by the table tag contains page number links that the user
    can click to navigate to other pages. When the user clicks one of these links,
    the user will be directed to the same page as the current page but the request
    will pass a different set of request parameters, telling the new link which page
    to be displayed. If the user should be directed to a different resource when the
    links are clicked, specify the requestURI attribute. In addition, you specify
    the maximum number of rows for each page using the pagesize attribute.


    For example, the following table tag retrieves data from a collection referenced
    by the scoped variable customerList in the HttpServletRequest object.


    ```

    <display:table name="customerList" id="customer" pagesize="5" requestURI="">

    ```


    If the collection is stored in another scope, prefix the name attribute with sessionScope
    or applicationScope, depending on whether the specified collection is stored in
    the HttpSession object or the ServletContext object. For example:


    ```

    <display:table name="sessionScope.customerList" id="customer" pagesize="5" requestURI="">

    ```


    Table 18.1 lists some of the more important attributes of the table.'
