  md: '# Conditional Actions


    The following if tag tests whether the user and password parameters are ken and
    blackcomb, respectively, and stores the result in the page-scoped variable loggedIn.
    You then use an EL expression to display "You logged in successfully" if the loggedIn
    variable is true and "Login failed" if the loggedIn variable is false.


    ```

    <c:if var="loggedIn"

    test="${param.user==''ken'' && param.password==''blackcomb''}">

    ...

    ${(loggedIn)? ? "You logged in successfully" : "Login failed"}

    ```


    # The choose and otherwise Tags


    The choose and when tags act similarly to the switch and case keywords in Java,
    they are used to provide the context for mutually exclusive conditional execution.
    The choose tag must have one or more when tags nested inside, and each when tag
    represents a case that can be evaluated and processed. The otherwise tag is used
    for the default conditional block that will be processed if none of the when test
    conditions evaluates to true. If present, otherwise must appear after the last
    when.


    choose and otherwise do not have an attribute. when must have the test attribute
    specifying the test condition that determines the body content should be processed.


    As an example, the following code tests the value of a parameter called status.
    If the value of status is full, it displays "You are a full member". If the value
    is student, it displays "You are a student member". If the parameter status does
    not exist or if its value is neither full nor student, the code displays nothing.


    ```

    <c:choose>

    <c:when test="${param.status==''full''}">

    You are a full member

    </c:when>

    <c:when test="${param.status==''student''}">

    You are a student member

    </c:when>

    </c:choose>

    ```'
