  md: 'represent action forms. As you may have guessed, DynaActionForm extends the
    org.apache.struts.action.ActionForm class.


    To add properties to an instance of DynaActionForm, you use form-property elements
    inside a form-bean of your action form. The form-property has two attributes,
    name and type. The name attribute specifies the property name and the type attribute
    specifies the property type. For example, to define an action form of type DynaActionForm
    productForm that has three properties of type String, you will have the following
    form-bean element:


    ```

    <form-bean name="productForm"

    type="org.apache.struts.action.DynaActionForm">

    <form-property name="propertyName" type="java.lang.String"/>

    <form-property name="description" type="java.lang.String"/>

    <form-property name="price" type="java.lang.String"/>

    </form-bean>

    ```


