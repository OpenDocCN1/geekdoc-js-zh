  md: "```\n<input type=\"submit\" name=\"org.apache.struts.taglib.html.CANCEL\nvalue=\"\
    Cancel\" onclick=\"bCancel=true\">\n```\n\nThe cancel tag has the property attribute\
    \ too, but this attribute is never used.\n\nWhen a button is clicked, a request\
    \ parameter org.apache.struts.taglib.html.CANCEL will be sent to the action servlet\
    \ (the value is not important). This Struts that a cancel button has been pressed,\
    \ and as a result, Struts will not validate the action form's property regardless\
    \ of the value of the validate attribute of the action element in the Struts configuration\
    \ file. Subsequently, control is forwarded to the execute method of the class.\
    \ The instance of the action class will have its isC method return true. Therefore,\
    \ you can check whether a user clicks a submit button or a cancel button by examining\
    \ this method. If the user clicked the cancel button, you can then forward to\
    \ somewhere else.\n\nThe app03b demonstrates the use of the cancel tag. In the\
    \ displayAddProductForm.jsp, you have a form with a submit and a cancel button.\
    \ You have the action saveProduct defined in the struts-config.xml file.\n\n```\n\
    <action path=\"/saveProduct\"\ninput=\"/jsp/displayProductForm.jsp\"\nname=\"\
    productForm\"\nscope=\"request\"\ntype=\"app.action.SaveProductAction\">\n<forward\
    \ name=\"success\" path=\"/jsp/displaySavedProduct.jsp/>\n<forward name=\"cancel\"\
    \ path=\"/jsp/displayCancelMessage.jsp/>\n</action>\n```\n\nThere are two forward\
    \ sublements. The first defines a forward destination for the submit button, and\
    \ the second defines a forward destination for the cancel button. To use these\
    \ forward elements, write this in the SaveProductAction class:\n\n```\nif (isCancelled(request))\n\
    \  return mapping.findForward(\"cancel\");\nelse\n  return (mapping.findForward(\"\
    success\"));\n```\n\nTherefore, the saveProduct action will be forwarded to either\
    \ the displaySavedProduct.jsp or the displayCancelMessage.jsp page."
