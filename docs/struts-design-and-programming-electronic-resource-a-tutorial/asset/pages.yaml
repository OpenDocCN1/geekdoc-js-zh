    where value is the value of the LabelValueBean instance and label is its label.


    You iterate the ArrayList returned by getCityOptions using forEach:


    ```

    <c:forEach items="${profileForm.cityOptions}" var="city">

    ..

    </c:forEach>

    ```


    The forEach tag''s items attribute specifies scoped object''s property. In this
    case, the scoped object is the action form referenced by profileForm and its label
    is its.


    For each iteration, forEach retrieves the current element and creates a scoped
    variable that references the element. The name of the scoped variable is specified
    by the var attribute (in this case, city). Therefore, from inside the forEach
    tag, you can use another tag to reference the scoped variable specified by var.


    For example, the following code demonstrates the use of forEach with multibox.


    ```

    <c:forEach items="${profileForm.cityOptions}" var="city">

    <html:multibox property="cities"><c:out value="${city.value}"/>

    </html:multibox><c:out value="${city.label}/><br/>

    </c:forEach>

    ```


