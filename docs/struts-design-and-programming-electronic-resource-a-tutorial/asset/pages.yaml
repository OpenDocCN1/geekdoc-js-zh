  md: '# Chapter 11: Message Handling and Internationalization


    messages tag. Compared to the errors tag, the messages tag gives you control over
    the formatting of the error messages without having to rely on the errors.header,
    errors.footer, errors.prefix, and errors.suffix keys in the properties file.


    An example, the following messages tag displays the validation error messages
    of the current action form.


    ```

