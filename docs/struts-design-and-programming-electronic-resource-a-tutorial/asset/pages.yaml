  md: "# 144 Chapter 5: The Validator Plugin\n\nThe validator element is mainly used\
    \ to register validators. Additionally, you can also define an accompanying error\
    \ message and a JavaScript function that can be used to perform client side validation.\n\
    \nFor instance, the required validator is defined as follows in the validator-rules.xml\
    \ file.\n\n```\n<validator name=\"required\"\nclassname=\"org.apache.struts.validator.FieldChecks\"\
    \nmethod=\"validateRequired\"\nmethodParams=\"java.lang.Object,\norg.apache.commons.validator.ValidatorAction,\n\
    org.apache.commons.validator.Field,\norg.apache.struts.action.ActionMessages,\n\
    javax.servlet.http.HttpServletRequest\nmsg=\"errors.required\"/>\n```\n\nIn this\
    \ validator element, the logical name of the validator is required. The logical\
    \ name is used to reference the validator from custom validation rules.\n\n# The\
    \ formset and form Elements\n\nWhen activating an action form manually, you define\
    \ your validation rules in the validate method of your action form. With the Validator\
    \ plugin, you define your validation rules inside a formset element in a validation\
    \ configuration file. A formset element must have one or more form elements. Each\
