    # JSTL I18N Library


    JSTL provides the following tags for displaying and formatting internationalized
    messages: setLocale, bundle, setBundle, message, param, and requestEncoding. Each
    of these tags is explained in a subsection below. See also Chapter 7 on JSTL in
    general.


    # setLocale


    The setLocale tag is used to set the locale for the scope specified in the scope
    attribute of this tag. For example, if the scope is session, the specified locale
    applies to all JSPs in the same user session. If no locale is explicitly specified
    using setLocale, the locale found in the user request will be used.


    The locale using setLocale is used by the bundle and setBundle tags to select
    a ResourceBundle. The setLocale persists the locale by storing a Locale object
    referenced by the scoped variable javax.servlet.jsp.jst.fmt.locale in the specified
    scope. The bundle and setBundle look for a scoped variable having the same name
    to determine the current locale. If no javax.servlet.jsp.jst.fmt.locale scoped
    variable is found, the user''s locale is used.


