    \ refer to a scoped object and a scoped object's property.\n\nRecall that most\
    \ tags in the HTML, Bean, and Logic Tag Libraries have the name and property attributes.\
    \ The name property is used to specify a scoped object and the property attribute\
    \ to specify a property of the scoped object referenced by the name property.\
    \ The property supports nesting, which means that you can access the property\
    \ of another property. For example, if the address property returns an Address\
    \ object with the city property, you can access the city property by using this\
    \ expression: address.city. In the event that the property attribute is not present,\
    \ the scoped object referenced by the name attribute itself will be the target\
    \ of the corresponding tag.\n\nThe name attribute is not required in a tag if\
    \ it is enclosed by another tag and the enclosing tag is already referencing a\
    \ scoped object. For example, the HTML Tag Library's text tag does not require\
    \ the name attribute. However, the text tag must be nested in a form. In this\
    \ case, the text tag will use the scoped object referenced by the name attribute\
    \ of the enclosing tag.\n\nThe Nested Tag Library provides a different way of\
    \ referencing a property of a scoped object. To specify a scoped object, you use\
    \ the root tag and its name property. Let's see how the root tag can be used in\
    \ the following example.\n\nIf you have a customer scoped object that contains\
    \ a contactPerson property, you can print the value of the contactPerson property\
    \ by using the Bean Tag Library's write tag.\n\n```\n<bean:write name=\"customer\"\
    \ property=\"contactPerson\"/>\n```\n\nWith the Nested Tag Library, you can do\
