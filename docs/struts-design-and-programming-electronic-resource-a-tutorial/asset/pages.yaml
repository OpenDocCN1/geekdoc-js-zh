  md: "# 172 Chapter 6: The Expression Language\n\n```\n${pageContext[\"request\"\
    ][\"servletPath\"]}\n${pageContext.request[\"servletPath\"]}\n${pageContext.request.servletPath}\n\
    ${pageContext[\"request\"].servletPath\n```\n\n# The Evaluation Rule\n\nAn EL\
    \ expression is evaluated from left to right. For an expression of the form expr-a[expr-b],\
    \ here is how the EL expression is evaluated:\n\n+   - Evaluate expr-a to get\
    \ value-a.\n- If value-a is null, return null.\n- Evaluate expr-b to get value-b.\n\
    - If the type of value-a is java.util.Map, check whether value-b is a key in the\
    \ Map. If it is, return value-a.get(value-b). If it is not, return null.\n- If\
    \ the type of value-a is java.util.List or it is an array, then do the following:\n\
    \  - Coerce value-b to int. If coercion fails, throw an exception.\n  - If value-a.get(value-b)\
    \ throws an IndexOfBoundsException or Array.get(value-a, value-b) throws ArrayIndexOutOfBoundsException,\
    \ return null.\n  - Otherwise, return value-a.get(value-b) if value-a is a List,\
    \ or Array.get(value-a, value-b) if value-a is an array.\n- If value-a is not\
    \ a Map, or an array, it must be a JavaBean. In this case, coerce value-b to String.\
    \ If value-b is a readable property of value-a, call the getter of the property\
    \ and return the value from the getter method. If the getter method throws an\
    \ exception, the expression is invalid. Otherwise, the expression is invalid.\n\
    \n# Accessing JavaBeans\n\nThe main use of the EL in the Struts application is\
    \ to access JavaBeans which are added as attributes in the HttpServletRequest\
    \ or HttpSession object. You can use either the . operator or the [] operator\
    \ to access the bean property. Here are the constructs:\n\n```\n${beanName[\"\
    propertyName\"]}\n${beanName.propertyName}\n```"
