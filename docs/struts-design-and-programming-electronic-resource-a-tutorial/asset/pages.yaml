  md: '# 224 Chapter 9: The Logic Tag Library


    # The Value Comparison Tags


    A comparison tag is used to examine a value and execute the tag''s body if the
    compared value evaluates to true. Table 9.1 lists the tags in this category.


    | Tag | Description | JSTL Equivalent |

    |---|---|-|

    | present | Tests if a cookie, a request parameter, a header, or a JavaBean''s
    property is present, and execute the tag''s body if it is. | cif |

    | notPresent | Tests if a cookie, a request parameter, a request header, or a
    JavaBean''s property is present, and execute the tag''s body if it is. | cif |

    | equal | Tests the value of a cookie, a request parameter, a JavaBean''s property
    is equal to the specified value, and execute the tag''s body if it is. | cif |

    | notEqual | Tests the value of a cookie, a request parameter, a request header,
    or a JavaBean''s property is equal to the specified value, and execute the tag''s
    body if it is not. | cif |

    | greaterThan | Tests the value of a cookie, a request parameter, a request header,
