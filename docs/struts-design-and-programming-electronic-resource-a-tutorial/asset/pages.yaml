    \ value=\"3\">Pop</option>\n</select>\n```\n\nWhen the content form is submitted,\
    \ however, only the selected value is sent. In fact, the action object that handles\
    \ this request does not need the label. On the contrary, a JSP may need to display\
    \ a human-readable label, not the value.\n\nHow do you display the label of a\
    \ selected option?\n\nOne way is to use the if tag in JSTL. Suppose, the value\
    \ of the selected option has been stored in the scoped selectedValue. You can\
    \ then use the following if tags to print the label of the selected value in your\
    \ JSP.\n\n```\n<c:if test=\"${selectedValue=='1'}>Jazz</c:if>\n<c:if test=\"${selectedValue=='2'}>Rock</c:if>\n\
    <c:if test=\"${selectedValue=='3'}>Pop</c:if>\n```\n\nHowever, this will become\
    \ a tedious chore once the list grows longer than three options. Moreover, the\
    \ labels are hardcoded in the JSP. Should the labels change, you have edit your\
    \ JSP as well.\n\nA solution is to use the selectLabel tag from BrainySoftware.com.\
    \ This tag accepts a value (such as “1”, “2”, …, or a non-numeric string value)\
    \ and searches for a collection that contains label/value pairs. Upon finding\
    \ a match, it displays the label corresponding to the value. The collection, as\
    \ in the HTML Tag Library’s options and optionsCollection tags, must be a scoped\
    \ object or a scoped object’s property. The list of attributes of the selectLabel\
    \ tag can be found in Table 10.6."
