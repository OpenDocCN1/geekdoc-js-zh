  md: '# The processMapping Method


    Before studying the processMapping method, you should first understand the following
    classes: ActionConfig, ForwardConfig, ActionForward, ActionMapping.


    The org.apache.struts.config.ActionConfig object is created for every action element
    in the Struts configuration, and therefore each attribute of the action element
    corresponds to a property in the ActionConfig class. As such, the ActionConfig
    class has the following properties that correspond to the attributes with identical
    names in the action element: type, input, forward, validate, include, roles, scope.
    An action element can also contain exception and forward subelements. The ActionConfig
    class has a HashMap named forwards that contains all information pertaining to
    the forward subelements and another HashMap named exceptions for all exception
    subelements.


    The org.apache.struts.config.ForwardConfig class represents a forward subelement
    nested inside an action element or under the global-forwards element. Each of
    the ForwardConfig class''s properties (name, path, redirect, contextRelative,
    className) corresponds to an attribute in a forward element.


    The org.apache.struts.action.ActionForward class extends ForwardConfig and is
    very similar to the latter. ActionForward would have been deprecated if not for
    the fact that it is part of the API being used by existing applications.


    The org.apache.struts.action.ActionMapping class extends ActionConfig and adds
    the following three methods:


    +   - findForward. Accepts a logical name and returns an ActionForward object
    of the current ActionConfig object or the module''s global forward collection.

    - findForwards. Returns an array of Strings representing all the logical names
    in the current ActionConfig object.

    - getInputForward. Returns an ActionForward object that is a forward destination
    for the corresponding action element''s input attribute.


    The ActionMapping class is of utmost importance because an Action object can get
    an ActionForward object for its forward destination. In fact, the'
