  md: '# Introduction


    The Servlet technology and JavaServer Pages (JSP) are the two main technologies
    for developing Java Web applications. When first introduced by Sun Microsystems
    in 1996, the Servlet technology was considered superior to the reigning Common
    Gateway Interface (CGI) because servlets stay in memory after they service the
    first requests. Subsequent requests for the same servlet do not require instantiation
    of the servlet''s class, therefore enabling better response time.


    The problem with servlets is it is very cumbersome and error-prone to send HTML
    tags to the browser because all HTML output must be enclosed in String objects,


    ```

    PrintWriter out = response.getWriter();

    out.println("<html><head><title>Testing</title></head>");

    out.println("<body bgcolor=\#ffdddd">");

    ```


    This is hard to program and even small changes in the presentation, such as the
    page''s background color, will require the servlet to be recompiled.


    Sun recognized this problem and came up with JSP, which allows Java code and HTML
    tags to intertwine in easy to edit pages. Any change does not require recompilation.
    Automatic compilation occurs the first time a page is called after it is modified.
    Java code in JSPs is scripted.


    Even though mixing Java code and HTML seems practical at first thought, it is
    actually not a good idea. This is the reason the designers of JSP allowed developers
    to write business logic in Java classes and call the methods in these classes
    from JSPs. Mixing Java code and HTML in JSPs is considered bad for the following
    reasons:


    +   - Interweaving Java code and HTML results in hard to read and hard to maintain
    applications.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Introduction


    +   Writing code in JSPs diminishes the opportunity to reuse the code. Of course,
    you can put all Java methods in a JSP and include this page from other JSPs that
    need to use the methods. However, by doing so you are moving away from the object-oriented
    paradigm. For one thing, you lose the power of inheritance.

    - It is harder to write Java code in a JSP than to do it in a Java class. Let''s
    face it, your IDE is designed to analyze Java code in Java classes.

    - It is easier to debug your code if it is in a Java class.

    - It is easier to test business logic in a Java class.

    - Java code in Java classes is easier to refactor.


    In fact, separation of business logic (Java code) and the presentation (HTML tags)
    is such an important issue that the designers of JSP have been trying to encourage
    this practice right from the first version of JSP.


    In JSP 1.0, the designers of JSP enabled you to use JavaBeans to encapsulate Java
    code, separating code and presentation and promoting code. A JavaBean is basically
    a Java class. You can use `<jsp:useBean>` and `<jsp:setProperty>` to manipulate
    one.


    Unfortunately, JavaBeans do not provide a perfect solution to the problem of code
    and presentation separation. With JavaBeans, method names must follow the JavaBean
    naming convention, resulting in occasionally clumsy names. Also, you cannot pass
    arguments to methods without resorting to scriptlet.


    To make code and HTML tags separation easier to accomplish, JSP 1.1 defines custom
    tag libraries, which is more flexible than JavaBeans. The problem is, custom tags
    are hard to write and the custom tags in JSP 1.1 had a very complex life.


    To alleviate the problem with writing custom tags for developers who want to separate
    code from presentation, an effort was initiated to provide tags with specific
    functionality. These tags are compiled in a set of libraries named Java Pages
    Standard Tag Libraries (JSTL). For example, JSTL has tags for manipulating scoped
    objects, iterating a collection, performing conditional tests, and parsing and
    formatting data, etc.


    Despite the JavaBeans, custom tags, and JSTL, many people still use scriptlet
    in their JSPs for the following reasons.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Why Servlets Are Not Dead


    +   - Convenience. It is very convenient to put everything in JSPs. This is okay
    if your applications are very simple applications consisting only one or two pages
    and will never grow in complexity.

    - Shortsightedness. Writing code and HTML in JSPs seems to be a more rapid way
    of development. However, in the long run, there is a price to pay for building
    your application this way. Maintenance and code readability are two main problems.

    - Lack of knowledge.


    In addition, in a project involving programmers with different skill levels, it
    is even harder to make sure all Java code goes to Java classes. Even a brilliant
    architect would have a headache if he had to watch over all his programmers.


    To make scriptlet-free JSPs more achievable, JSP 2.0 added a feature that allows
    architects to disable scriptlet in JSPs, enforcing the separation of code and
    HTML. So, if the architect is knowledgeable enough, the developers will have to
    resort to JavaBeans custom tags, JSTL, and other libraries for business logic
    implementation. On top of that, JSP 2.0 provides a simpler custom tag and allows
    tags to be built in tag files, if providing a simpler way to write custom tags.


    # Why Servlets Are Not Dead


    With the advent of JSP, many people thought that was the end of the day for servlets.
    It turned out this was not the case. JSP did not displace servlets. In fact, in
    today''s real-world applications, both servlets and JSPs are used together. To
    understand why servlets did not become obsolete after the arrival of JSP, you
    need to understand the two design models upon which you can build your Java Web
    applications.


    The first design model, simply called Model 1, was born right after the JSP was
    made available. Servlets are not normally used in this model. Navigating from
    one JSP to another is done by clicking the link in the page. The second design
    model is named Model 2. You will see shortly why Model 1 is not recommended and
    why Model 2 is the way to go.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# The Problems with Model 1


    The Model 1 design model is page-centric. Applications implementing this model
    have a series of JSPs where the user proceeds from one page to another. This is
    the model you always employ when you first learn JSP because it is simple and
    easy. The main problem with Model 1 applications is that they are hard to maintain
    and inflexible. On top of that, this architecture does not promote the division
    of labor between the page designer and the Web developer because the developer
    is involved in both page development and business logic coding.


    To summarize, Model 1 is not recommended for the following reasons:


    +   - Navigation problem. If you change the name of a JSP that is referenced by
    other pages, you must change the name in many locations.

    - There is more temptation to use scriptlet in JSPs because JavaBeans are limited
    and it is relatively harder to write custom tags. However, as explained above,
    mixing Java code and HTML in JSP pages is a bad thing.

    - If you can discipline yourself to not write Java code in JSPs, you end spending
    more time developing your application because you have to write custom tags for
    most of your business logic. It is faster to write Java code in normal Java classes.


    # Model 2


    The second design model is simply called Model 2. This is the recommended architecture
    to base your Java Web applications on. Model 2 is another name for the Model-View-Controller
    (MVC) design pattern. In Model 2, there are three main components in an application:
    the model, the view, and the controller. The MVC pattern is further discussed
    in Chapter 1.


    # Note


    The term Model 2 was first used in the JavaServer Pages Specification version
    0.92.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# The Benefits of Struts


    In Model 2, you have one entry point for all pages and usually a servlet acts
    as the main controller and JSPs for the presentation. Compared to Model 1, Model
    2 applications enjoy the following benefits.


    +   - more rapid to build

    - easier to test

    - easier to maintain

    - easier to extend


    Now, you see why servlets and JSPs are used together.


    # Note


    One commonly asked: if there is only one servlet for the whole application and
    this is the only entry to the application, doesn''t the performance suffer. Does
    the servlet container spawn many instances of the servlet? The answer is the container
    only creates one servlet instance, unless you implement the `javax.servlet.SingleThreadModel`
    interface (not recommended and has been deprecated in Servlet 2.4) and performance
    does not suffer. For more detailed discussion, see my book *How Tomcat Works.*


    # The Benefits of Struts


    Now that you understand why the MVC pattern (Model 2) is the recommended design
    model for Java Web applications, the next question to ask is, “How do you make
    development of Model 2 applications more rapid?”


    This was also the question that came to Craig McClahan’s mind before he created
    Struts. Struts is a framework for developing Model 2 applications. It makes development
    more rapid because it solves some common problems in Web application development
    by providing these features:


    +   - page navigation management

    - user input validation

    - consistent layout

    - extensibility


    Because Struts is a Model 2 framework, when using Struts you should stick to the
    following unwritten rules:'
  merge: -1
