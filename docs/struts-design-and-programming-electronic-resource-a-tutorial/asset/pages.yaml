    # The parseNumber Tag


    You use parseNumber to parse a string representation of a number, a currency,
    or a percentage in a locale-sensitive format into a number. The syntax has two
    forms. The first is used without a body content:


    ```

    <fmt:parseNumber value="numericValue"

    [type="number|currency|percent"]

    [pattern=="customPattern"]

    [parseLocale="parseLocale"]

    [integerOnly={true|false}]

    [var=varName]

    scope="page|request|session|application"]/>

    ```


    The second form is used with a body content:


    ```

    <fmt:parseNumber type="{number|currency|percent}"

    [pattern="customPattern"]

    [parseLocale="parseLocale"]

    [integerOnly={true|false}]

    [var=varName]

    scope="page|request|session|application">

    numeric value to be parsed

    </fmt:parseNumber>

    ```


    The content body is JSP. The parseNumber tag’s attributes are given in Table 7.14.


    As an example, the following parseNumber tag parses the value referenced by the
    scoped variable quantity and stores the result in the formattedNumber scoped variable.


    ```

    <fmt:parseNumber var="formattedNumber" type="number">

    ```'
