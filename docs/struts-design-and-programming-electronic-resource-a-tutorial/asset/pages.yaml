  md: '# The Default Validators 133


    requires two arguments, **min** and **max**, which indicate the range''s minimum
    and maximum, respectively.


    You can apply more than one validator to a field, if necessary. For example, if
    you have a field that accepts a date and the field is mandatory, you can apply
    both the required and date validators. You can also configure a validator so that
    it throws an error message when a validation fails.


    Each of the validators is discussed below.


    # required


    You apply this validator to a mandatory field. Validation succeeds if there is
    at least one character in the field.


    # minlength


    You use minlength to require that a field contains a minimum number of characters.
    You specify the minimum length using the **minlength** argument. For example,
    if the business rule dictates that a password must be of at least 8 characters,
    you can use the **minlength** validator, passing 8 to the **minlength** argument.


    # maxlength


    Use maxlength to require that the number of characters in a field must not exceed
    the specified length. You specify the maximum length in the maxlength argument.
    For instance, if you want a user to have a maximum number of 6, you can use this
    validator with an argument 6. As another example, if a product id must be exactly
    7 characters, you can use both minlength and maxlength validators.


    # byte, short, integer, long, float, double


    These validators are used to check if a field''s value can be converted to a number.
    Each validator can accept values in a different range. For example, the byte validator
    accepts a byte, the short validator accepts a short, and so on.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# 134 Chapter 5: The Validator Plugin


    # intRange


    You use the intRange validator to specify that a field must accept an integer
    that falls within a range. You use the min argument to specify the lowest integer
    acceptable and the max argument the highest integer.


    # floatRange


    You use the floatRange validator to specify that a field must accept a float within
    a range. You use the min argument to specify the lowest float that can be accepted
    and the max argument to specify the highest float allowed.


    # date


    The date validator uses a java.text.SimpleDateFormat instance to validate dates.
    In most cases, you will use this validator with an additional argument, either
    datePattern or dateStrict. Both datePattern and dateStrict are optional and specify
    the date pattern that will be used in validation. If datePattern is present, this
    will be used regardless whether or not dateStrict is present. If both are not
    present, the date validation is based on the current locale. If dateStrict is
    used, the length of the string will also be checked. For example, for a strict
    checking, 5/10/2005 will not pass validation with the format MM/dd/yyyy because
    the month part is not two digits. The lenient method of the underlying SimpleDateFormat
    is set to false, whether you are validating using datePattern or dateStrict. If
    lenient is true, the SimpleDateFormat object would accept out-of-range dates,
    such as January 32 (which would be translated into February 1).


    # Note


    More details on date patterns can be found in the Javadoc for java.text.SimpleDateFormat
    class.


    # mask


    Use this validator to specify a set of acceptable characters for a field. You
    specify the acceptable character set in the mask argument for this validator'
