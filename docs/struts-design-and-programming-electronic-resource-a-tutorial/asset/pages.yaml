  md: '# Chapter 17: File Upload and File Download


    As with file upload, to protect the files to be sent to the user, they must reside
    outside the application directory or under WEB-INF or in an external storage such
    as a database.


    To send a file to a browser, do the following.


    +   1. Set the response''s content type to the file''s content type. The Content-Type
    header specifies the type of the data in the body of an entity and consists of
    the media type and subtype identifiers. Visit http://www.iana.org/assignments/media-types
    to find all standard content types. If you do not know what the content type is
    or want the browser to always display the Save As dialog, set it to APPLICATION/OCTET-STREAM.
    This value is not case sensitive.

    2. Add an HTTP response header named Content-Disposition and give it the value
    attachment; filename=theFileName, where the fileName is the default name for the
    file that appears in the File Download box. This is normally the same name as
    the file, but does not have to be so.


    For instance, this code sends the specified file to the browser.


    ```

    FileInputStream fis = new FileInputStream(file);

    BufferedInputStream bis = new BufferedInputStream(fis);

    byte[] bytes = new byte[bis.available()];

    response.setContentType(contentType);

    OutputStream os = response.getOutputStream();

    bis.read(bytes);

    os.write(bytes);

    ```


    First, you read the file as a FileInputStream and load the content to a byte array.
    Then, you obtain the HttpServletResponse object''s OutputStream and call its write
    method, passing the byte array.


    # Warning


    Do not send any other characters than the actual file content. This could happen
    without that your realizing it. For example, if you need to write some page directives
    in a JSP, you might write the directives in the normal way, as this as:


    ```

    <@ page import="java.io.FileInputStream%>

    <jsp:Bean id="DBBeanId" scope="page" class="MyBean" />

    ```'
