  md: '# The EL in JSP 2.0


    # The Conditional Operator


    The EL conditional operator has the following syntax:

    ${statement?A:B}


    If statement evaluates to true, the output of the expression is A. Otherwise,
    the output is B.


    For example, you can use the following EL expression to test whether the HttpSession
    object contains the attribute loggedIn. If the attribute found, the string "You
    have logged in" is displayed. Otherwise, "You have not logged in" is displayed.


    ```

    ${(sessionScope.loggedIn==null)?"You have not logged in": "You have logged in"}

    ```


    # The empty Operator


    The empty operator is used to examine whether a value is null or empty. The following
    is an example of the use of the empty operator:


    ```

    ${empty X}

    ```


    If X is null or X is a zero-length string, the expression returns true. It also
    returns true if X is an empty Map, an empty array, or an empty collection. Otherwise,
    it returns false.


    # The EL in JSP 2.0


    With the EL, JavaBeans, and custom tags, it is now possible to write script-free
    JSPs. JSP 2.0 provides a setting to disable scripting in all JSPs. Software architects
    can now enforce the writing of script-free JSPs.


    On the other hand, in certain circumstances you''ll want to disable the EL in
    your applications. For example, you''ll want to do so if you are using a JSP 2.0-compliant
    container but are not ready to upgrade to JSP 2.0. In this case, you can disable
    the evaluation of EL expressions.


    This section discusses how to enforce script-free JSPs and how to disable the
    EL in JSP 2.0.'
