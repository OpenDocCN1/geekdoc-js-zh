    \ extend the first one.\n\nTo run the app12d application, direct your browser\
    \ to URL: `http://localhost:8080/app12d/displayAddProductForm.do`\n\n# Note\n\n\
    The section “Writing Tiles XML Definition” explains how to write XML definition\
    \ files.\n\n# The Tiles Tag Library’s Tags\n\nThe Tiles Tag Library provides tags\
    \ to use in JSPs. Before discussing each of these tags, you need to know the following\
    \ fact that relates to how Tiles works under the hood.\n\nTiles uses a context\
    \ object similar to JSP’s PageContext to store Tiles’ specific attribute values\
    \ (or simply called Tiles attributes). This context object is of type org.apache.struts.tiles.ComponentContext\
