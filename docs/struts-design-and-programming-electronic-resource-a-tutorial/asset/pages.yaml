  md: "# Chapter 1: Model 2 and Struts\n\nYou can obtain an ActionForward by calling\
    \ the findForward method on the ActionMapping object, passing the appropriate\
    \ key. Here is the signature of findForward.\n\n```\npublic ActionForward findForward(java.lang.String\
    \ name);\n```\n\nTherefore, in your action class's execute method, you would have\
    \ something like this that returns an ActionForward object:\n\n```\nreturn mapping.findForward(key);\n\
    ```\n\nThis will become clearer as we study the Struts application in the next\
    \ section. For now, let's have a look at the thing you need to do in your deployment\
    \ descriptor to make Struts work.\n\n# Editing the Deployment Descriptor (web.xml)\n\
    \nYour web.xml file must be configured in such a way for Struts to work. First\
    \ and foremost, Struts comes with a controller servlet org.apache.struts.action.ActionServlet.\
    \ You must register this in your deployment descriptor using the following servlet\
    \ element.\n\n```\n<servlet>\n  <servlet-name>action</servlet-name>\n  <servlet-class>org.apache.struts.action.ActionServlet</servlet-class>\n\
    \  <init-param>\n    <param-name>config</param-name>\n    <param-value>WEB-INF/struts-config.xml</param-value>\n\
    \  </init-param>\n  <init-param>\n    <param-name>debug</param-name>\n    <param-value>2</param-value>\n\
    \  </init-param>\n  <load-on-start>1</load-on-start>\n</servlet>\n```\n\nThe first\
    \ init-param element tells Struts where to find the configuration file.\n\nSecondly,\
    \ Struts does not use a request parameter in a URL to store the action path information.\
    \ Instead, it uses the servlet path. By convention, it uses the following format:\n\
    \n+   * .do"
