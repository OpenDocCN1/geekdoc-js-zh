  md: "```\n<!ELEMENT action (icon?, display-name?, description?, set-property*, exception*,\
    \ forward*)>\n```\n\nOf all the elements that are action, exception and forward\
    \ are the most common. The exception element describes an exception handler for\
    \ this action if the associated Action object's execute method throws an exception,\
    \ and the forward element specifies a resource to which control can be forwarded\
    \ after the execution of the Action object.\n\nThe list of the attributes of the\
    \ action element is given in Table A.1.\n\n| Attribute | Description |\n| ---\
    \ | --- |\n| attribute | An identifier for this action element. \nThe request-scope\
    \ or session-scope variable that references the associated action form, if it\
    \ is other than the action form's specified name. May only be present if the name\
    \ attribute is present. |\n| className | The fully qualified Java class name of\
    \ the ActionMapping subclass to use for this ActionMapping object. If not specified,\
    \ the type specified by the enclosing action-mappings element will be used. In\
    \ the absence of the latter, defaults to org.apache.struts.ActionMapping. |\n\
    | forward | The module-relative path to the resource to which control will be\
    \ forwarded. Exactly one of the following attributes must be present in the action\
    \ element: forward, include, or type. |\n| include | The module-relative path\
    \ to the resource that will process this action. Exactly one of the following\
    \ attributes must be present in the action element: forward, include, or type.\
    \ |\n| input | The module-relative path to the other or resource to which control\
    \ will be forwarded if the associated action form fails to validate. |\n| name\
    \ | The name of the action form, if any, associated with this action. |\n| parameter\
    \ | The configuration parameter that can be used to pass extra information to\
    \ the Object associated with this action. |\n| path* prefix | The module-relative\
    \ path of the action. It must start with a /. The prefix to match request parameter\
