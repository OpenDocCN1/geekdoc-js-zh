    The function works for both Netscape and Internet Explorer browsers. It opens
    a new browser window and invokes the **invalidateSession** action. It then immediately
    closes the new window.


    The **if** tests that check the **window.innerWidth/window.innerHeight** and **window.event.clientX/window.event.clientY**
    are there because many other user activities can trigger the **unload** event,
    as clicking a link to navigate to another page. You don''t want the **invalidateSession**
    action to be invoked for such activities. Fortunately, the browser will set a
    negative width and height for a browser that has been closed, so you know whether
    the **unload** event is triggered by a user closing the browser or by something
    else.


    To use this technique, all JSPs in your application must include the **destroySession**
    JavaScript function and have the following **unload** attribute in its body element.


    ```

