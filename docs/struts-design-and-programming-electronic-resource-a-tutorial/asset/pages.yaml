  md: '# Formatting Actions


    | Attribute | Type | Description |

    |--- | --- | --- |

    | value+ | String or Number | Numeric value to be formatted. |

    | type+ | String | Indicates whether the value is to be formatted as number, currency,
    or percentage. The value of this attribute is one of the following: **number,
    currency, percent.** |

    | pattern+ | String | Custom formatting pattern. |

    | currencyCode+ | String | ISO 4217 code. See Table 7.9. |

    | currencySymbol+ | String | Currency symbol. |

    | groupingUsed+ | Boolean | Indicates whether the output will contain grouping
    separators. |

    | maxIntegerDigits+ | int | The maximum number of digits in the integer portion
    of the output. |

    | minIntegerDigits+ | int | The minimum number of digits in the integer portion
    of the output. |

    | maxFractionDigits+ | int | The maximum number of digits in the fractional portion
    of the output. |

    | minFractionDigits+ | int | The minimum number of digits in the fractional portion
    of the output. |

    | var | String | The name of the scoped variable to store the output as a String.
    |

    | scope | String | The scope of **var**. If the **scope** attribute is present,
    the **var** attribute must be specified. |


    Table 7.8: The formatNumber tag''s attributes


    The one of uses of **formatNumber** is to format numbers as currencies. For this,
    you can use the **currencyCode** attribute to specify an ISO 4217 currency code.
    Some of the codes are given in Table 7.9.


