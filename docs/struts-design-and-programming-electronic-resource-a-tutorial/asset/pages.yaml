  md: '# # Chapter 17

    File Upload and File Download


    This chapter discusses two important topics that do not often get enough attention
    in Web programming books: file upload and file download. Struts supports file
    upload very well by seamlessly incorporating the Jakarta Commons FileUpload library.
    The first section of this chapter discusses how to achieve this programming task
    in Struts. The second section deals with file download and demonstrates how you
    can send binary streams to the browser.


    # ## File Upload


    HTTP file upload is specified in Request For Comments (RFC) 1867. A comprehensive
    article on file upload that details how file upload works is also downloadable
    from www.brainsoftware.com. The overview in this section is a brief summary of
    this article.


    # ## An Overview of File Upload


    When using an HTML form to upload a file or multiple files, the enctype attribute
    of the form must be assigned the value multipart/form-data and the method must
    be post. In a browser your HTML form should look like this.


    ```

    <form action="anAction" enctype="multipart/form-data" method="post">

    </form>

    ```


    Inside the form, you can have normal fields, but to select a file you must have
    an <input type="file"> field. Here is an example of a form used for selecting
    a file.


    ```

    <form action="/upload.do" enctype="multipart/form-data"

    method="post">

    ..

    ```'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# 334 Chapter 17: File Upload and File Download


    Select file to upload <input type="file" name="filename"/><br>

    Description: <input type="text" name="description"/><br>

    <input type="submit" value="Upload"/></form>


    In addition to a field, the field also contains a text box named description and
    a submit button. Figure 17.1 shows how the file input is rendered, i.e. as a text
    box and a Browse button.


    ![](img/b333f2b2346b8836cf06378200dc8816_343_0.png)


    Figure 17.1: The file input field in Internet Explorer


    On the server side, i.e. in your servlet or JSP, you must not call the getWriter
    method on the HttpRequest object. Instead, you will have to call the HttpServletRequest
    object''s getInputStream method.4 Then, you must parse the resulting InputStream
    object to retrieve the uploaded file. This is a tedious and error-prone task.
    Luckily, the Jakarta Commons library can be used and Struts to make file upload
    feature available to us. The next section will show you how to upload file in
    a Struts application.


    > Where to Save Uploaded Files?

    Basically, any directory your application has access to. If a servlet container
    puts restriction to the area a Web application can write to, this means the directory
    and any subdirectories under it. Saving the uploaded files under the WEB-INF directory
    guarantees that people cannot download your files if they guess the URLs correctly.


    4 If you are interested in why you must not call getWriter, read my book “How
    Tomcat Works”.'
