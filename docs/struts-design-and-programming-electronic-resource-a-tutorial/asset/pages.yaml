    Now, let''s take a look at message resources in Struts.


    # Registering Properties Files


    Now that you know how to internationalize and localize your applications, you
    now learn how Struts loads the properties files of your application. To be usable,
    you must place your properties files under WEB-INF/classes or a directory below
    it or in WEB-INF/lib.


    Then, you must register every single properties file in your struts-config.xml
    file using the message-resources tag. Each message-resources represents a properties
    file in all locales. If you have two properties files (one for the general areas
    and one for the members only area in your application) you will need two message-resources
    tags. Use the parameter attribute to specify the name of your properties files.


    For example, if you have an ApplicationResources.properties file in the WEB-INF/classes
    directory, you would have the following message-resources element in your struts-config.xml
    file.


    ```

    <message-resources parameter="ApplicationResources"/>

    ```


    You can course put your properties file in a subdirectory of WEB-INF/classes,
    but this has to be reflected in the parameter attribute of your message-resources
    tag. For example, if you place the above ApplicationResources.properties file
    in WEB-INF/classes/com, the message-resources element would have to'
