    # # Summary


    In this chapter you have learned how to choose the correct types for your action
    form’s properties. Normally, an action form’s properties will have a boolean,
    a numeric value, or Strings as data types. You use a boolean if the property needs
    to be boolean and will be mapped to a check box. You use a numeric type (integer,
    long, etc) if the value is coming from a multibox or a select element, where there
    is a guarantee the user will not type in an invalid value. For everything else,
    you use String. In the app04a application, you used a string to take a date value.


    You have also seen how you can use the BeanUtils class in your action class and
    write your own converter to produce a shorter version of the execute method. BeanUtils
    is very popular and is a good choice. Where performance is critical, you may want
    to avoid using BeanUtils and resort to the last technique discussed in this chapter,
    by using the AsString properties.'
