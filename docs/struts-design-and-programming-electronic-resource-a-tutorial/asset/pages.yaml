    \ of the jsp-config element. You use jsp-property-group to apply certain settings\
    \ to a set of JSPs in the application.\n\nTo use the jsp-property-group to deactivate\
    \ the EL evaluation, you must have two subelements: url-pattern and el-ignored.\
