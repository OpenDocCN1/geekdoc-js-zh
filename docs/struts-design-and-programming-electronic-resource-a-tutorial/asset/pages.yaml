  md: '# 388 Chapter 22: How Struts Works


    # The Action Servlet


    The action servlet is represented by the org.apache.struts.action.ActionServlet
    class, a subclass of javax.servlet.http.HttpServlet. A servlet has three lifecycle
    methods that are called by the servlet container.


    +   - init. Called by the servlet container the first time the servlet is invoked.
    This method is only called once during the servlet''s life time.

    - service. Called by the servlet container each time the servlet is invoked. For
    each invocation, the servlet container creates an HttpServletRequest object and
    an HttpServletResponse object that are passed to the service method.

    - destroy. Called by the servlet container when the servlet is to be destroyed,
    e.g. when the servlet container is shut down.


    In handling an action, the servlet may create an action form and an action object,
    forward control to a JSP. The information about the type of the action form, the
    type of the action object, and the forward destination can be found in the Struts
    configuration file (by default, the struts-config.xml file). Therefore, the action
    servlet needs to read this XML document.


    However, parsing this file for each action invocation would be inefficient. Therefore,
    the Struts designer create a ModuleConfig object (of type org.apache.struts.ModuleConfig
    interface) that encapsulates configuration information. The ModuleConfig object
    is created when the action servlet is initialized and is stored in the ServletContext
    object. As such, a ModuleConfig object lives until the action servlet is destroyed
    and is available from inside the servlet''s service method. This strategy results
    in a more efficient system because a Struts configuration file is only parsed
    once. Larger or many configuration files, in which case each file has a corresponding
    ModuleConfig instance. When storing a ModuleConfig object in the ServletContext
    object, the action servlet uses the following attribute key:


    Globals.MODULE_KEY + prefix


    Where Globals.MODULE_KEY is the value of the MODULE_KEY field of the org.apache.struts.Globals
    class and prefix is the module''s prefix.'
