  md: '# Working with Very Large Collections of Data


    Another approach to paging is the query-based paging. In its strictest definition,
    query-based means retrieving only the data that is to be displayed in a page.
    No caching is involved. However, this would mean more hits to the database, which
    translates to slower user response. In addition, this puts extra burdens on the
    database server. A better approach is to combine cache-based and query-based solution.
    You define the number of records to be retrieved with each hit to the database
    and cache the collection. If the user wants to view more, you make another hit
    to the database to retrieve the second batch of data. Now, which collection needs
    to be cached? In the simplest solution, you replace the first collection in the
    cache with the second collection, hoping the user is not interested in viewing
    the previous pages that display data from the first collection. Alternatively,
    you can cache a limited number of collections. This chapter deals with having
    one collection in the cache at a time.


    The app18b application, provides an example of working with very large collections
    of data. Any search operation always attempts to retrieve and cache a maximum
    of $n$ records, where $n$ records are enough to fill several presentation pages.
    If the user browses further than the available cached data, another hit to the
    database is performed and a second batch of data is cached. For every search,
    the corresponding Struts action first tries to cache its cache. If the data is
    not found, it will retrieve fresh data from the database.


    There are four things that we look at closely in the app18b application, the searchCustomers
    method in the CustomerDAO class, the customer criteria action form, the action
    class, and the JSP that displays the search results.


    # The Search Method


    The searchCustomers method in the CustomerDAO implementation class must also know
    how many records to return at and the offset starting record. In app18b, the searchCustomers
    method has the following signature.


    ```

    public ArrayList searchCustomer(CustomerSearchCriteriaTonsearchCriteria, int offset,
    int maxRecordsToRetrieve)

    ```'
