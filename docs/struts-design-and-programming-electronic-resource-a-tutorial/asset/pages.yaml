  md: '# A TUTORIAL

    Struts Design and Programming


    Struts is the most popular framework for building scalable Java Web applications.
    The first part of this book explains the latest version of Struts and teaches
    how to build real-world Struts applications. The second part goes the extra mile
    to discuss how to design Struts development. It is like two books for the price
    of one. More importantly, this book is a tutorial to make the reader truly understand
    the concepts. It explains not only how to use Struts features, but also how certain
    features work under the hood and how to choose similar features. Examples are
    relevant and based on real-world applications. Several important topics rarely
    mentioned in other books—such as file upload, paging, object caching—are given
    detailed treatment.


    The first part is for beginners and Struts developers who don''t feel they have
    a complete grasp of Struts. It explains the following and many more:

    - The Model-View-Controller design pattern -- Application Configuration

    - Action forms -- The Custom selectLabel Tag

    - User input validation -- Tiles

    - The Validator Plug-in -- Message handling and internationalization

    - JSP Pages Tag Library (JSTL) -- The open source Display Tag Library

    - The Struts 2.0 Expression Language (EL) -- File upload and programmable file
    download

    - HTML, Bean, Logic, Nested Tag Libraries -- Jakarta Commons Bean Class


    In addition, this book deals with design topics such as:

    - Data persistence -- Application security

    - Transfer objects

    - Configuration information sharing

    - Paging and sorting

    - Object caching -- HttpServletRequest wrapping

    - Early session inactivation


    The last chapter, "How Struts Works", dissects Struts'' source code and explains
    the components that together make Struts work. This chapter is particularly interesting
    to readers who want to know how Struts works in the background and how to extend
    Struts. Understanding it helps you design and develop more effective Struts applications.


    This book is for you if you need one written with clarity and readability in mind.


    About the Author


    Bill Kaufmann is the author of "Struts Works" and other Java programming books.
    An experienced developer has written more than 100 articles for prestigious magazines
    and written software licensed by small and large organizations.


    ![](img/b333f2b2346b8836cf06378200dc8816_451_0.png)


    Java/Web programming'
