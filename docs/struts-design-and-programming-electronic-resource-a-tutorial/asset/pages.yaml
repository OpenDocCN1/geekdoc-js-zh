  md: '# # Chapter 4

    Input Validation and

    Data Conversion


    As you have learned in Chapter 2, the action form''s main reason for existence
    is to help Struts programmers with user input validation. This chapter takes a
    closer look at input validation and deals with data conversion, a task that almost
    always precedes input validation. This chapter starts with a discussion of how
    to choose data types for your action form''s properties, so that smooth data conversion
    can be achieved in both Struts'' internals and in action objects. Three examples
    are then presented and the open source utility class BeanUtils, which is part
    of the Jakarta Commons project, discussed.


    Note

    Chapter 5 covers the Validator plug-in, which helps you validate input without
    Java code.


    # ## Data Types for Your Action Form''s Properties


    There are two points to ponder when choosing data types for an action form''s
    properties.


    +   1. The Struts action servlet populates the properties of an action form with
    the current HttpServletRequest object''s parameter values. These parameter values
    are strings.

    2. In an action class, there are two tasks you often perform: populate a transfer
    object with an action form''s properties or populate an action form with a transfer
    object''s properties. This means that you need to perform data conversion if the
    data type of each of the action form''s properties is not compatible with the
    data type of the corresponding property in the transfer object.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Chapter 4: Input Validation and Data Conversion


    Because request parameters are strings, populating an action form''s properties
    with request parameters will be easiest if each of the action form''s properties
    is a string. Struts converts a request parameter value to a data type suitable
    for the corresponding property of an action prior to populating the property.
    However, it can only convert string values to java.lang.String or Java primitives
    (boolean, int, long, etc) and their Java object equivalents (Boolean, Integer,
    Long, etc.). If you are using a java.util.Date for an action form''s property,
    for example, Struts will invariably throw an exception when trying to convert
    the request parameter to the Date property, regardless of or not the request parameter
    has the correct date pattern. This is to say, you can choose String, primitives
    or their Java equivalents as the data types of your action form''s properties,
    but not other types such as java.util.Date.


    What data types should you use for an action form''s properties? Here are some
    suggestions.


    +   * The boolean is the best type for a property that is mapped to a check box
    in an HTML page. Struts handles String to Boolean conversion perfectly.

    * The int is good for properties mapped to pre-defined options, such as in a select
    box or multibox. However, you can also use String.

    * The numeric types (int, short, long, float, etc) are not always suitable for
    properties mapped to a text box, password, and text area, even for HTML input
    fields that accept numeric values. This is because the user enters a non-numeric
    value (such as "abc") to an HTML input field mapped to a numeric property, the
