  md: '# Hibernate


    Hibernate has gained popularity in the past few years as an add-on for J2EE and
    other applications. Its Web site (www.hibernate.org) advertises this free product
    as “a powerful, ultra-high performance object/relational persistence and query
    service for Java”. Using Hibernate, you do not need to implement your own persistence
    layer. Instead, you use a tool to create databases and related tables and determine
    how your objects should be persisted. Hibernate virtually supports all kinds of
    database servers in the market today, and its Hibernate Query Language provides
    “an elegant bridge between the object and relational worlds”.


    More people will be using Hibernate in the near future, and it is definitely worth
    more than a look. If you have time, invest in it.


    # Summary


    Most applications need a persistence layer for persisting value objects. The persistence
    layer hides the complexity of accessing the database from its clients, notably
    the action objects. The persistence layer can be implemented as entity beans,
    the DAO pattern, by using Hibernate, etc.


    This chapter shows you in detail how to implement the DAO pattern. There are many
    variants of this pattern and which one you choose depends on the project specification.
    The most flexible DAO pattern is preferable because you can extend your application
    easily should it need to change in the future.'
