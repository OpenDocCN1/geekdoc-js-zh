    # The setProperty Tag


    You use the setProperty tag to set the specified property of the enclosing table
    tag. The setProperty tag has two attributes, name and value, that are described
    in Table 18.3.


    | Attribute | Description |

    | --- | --- |

    | name | Specifies the name of the property to be set. |

    | value | The value to be assigned to the specified property. |


    Table 18.3: The setProperty tag''s attributes


    For instance, the table tag''s paging.banner.placement property specifies the
    location of the page number links. The following setProperty tag sets its value
    to bottom, to make the links appear at the bottom of the table.


    ```

    <display:setProperty name="paging.banner.placement" value="bottom"/>

    ```


    # Working with Large Collections of Data


    When working with large collections of data, the effective solution is the cache-based
    paging. With this solution, we retrieve all the results and cache them in a temporary
    location, notably the HttpSession object. Subsequent pages are retrieved from
    the cache rather than the database, hence faster access and fewer database hits.
    However, this approach requires more memory. The overall result is better response
    time and better user experience. The opposite of cache-based paging is query-based,
    which will be discussed in the next section.


    The app18a application shows how to use the cache-based paging and displays search
    results in pages with the help of the Display Tag Library. The app18a application
    is used for searching for customers, adding new customers, and updating/deleting
    existing customers.'
