    # The define Tag


    You use the define tag to create a scoped object and a scope variable that references
    the newly created scoped object. In addition, you can use define to create a scoped
    object for an existing scoped object or its property. Table 8.6 lists the define
    tag''s attributes.


    For example, the following define tag creates the string "Using bean:define",
    it makes it scoped object, and creates a scoped variable named aBean that references
    the string. Because no toScope attribute is present, the scoped variable is stored
    in the page scope.


    ```

    <bean:define id="aBean" value="bean:define">

    ```


    The following define tag accesses the city property of the request-scoped object
    address and creates a session-scoped variable named selectedCity that references
    the property.


    ```

    <bean:define id="selectedCity" name="address" property="city" scope="request"
    toScope="session"/>

    ```'
