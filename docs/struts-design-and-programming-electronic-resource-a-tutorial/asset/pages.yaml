  md: '```

    prefix="fn" %>

    ```


    To invoke a function, you use an EL with the format

    ${fn:functionName}


    where functionName is the name of the function.

    Most of the functions are string manipulation. The length function works

    for both strings and collections. In particular, the length function returns the

    number of items in a collection or array or the number of characters in

    string. All these functions are described in the sections to follow.


    # The contains Function


    The contains function tests whether a string contains the specified substring.

    The return value is a Boolean true if the string contains the substring, and

    false otherwise. Its syntax is as follows:


    ```

    contains(string, substring) .

    ```


    For example, both of these EL expressions return true:


    ```

    <c:set var="myString" value="Hello World"/

    ${fn:contains(myString, "Hello")}


    ${fn:contains("Stella Cadente", "Cadente")}

    ```


    # The containsIgnoreCase Function


    The containsIgnoreCase function is similar to the contains function, but

    testing is performed in a case-insensitive way. The syntax is as follows:

    containsIgnoreCase(string, substring)


    For instance, the following EL expression returns true:


    ```

    ${fn:containsIgnoreCase("Stella Cadente", "CADENTE")}

    ```'
