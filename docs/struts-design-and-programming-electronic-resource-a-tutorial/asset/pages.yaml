  md: '# 196 Chapter 7: JSTL


    # Formatting Actions


    JSTL provides tags for formatting and parsing numbers and dates. The tags have
    two forms. The first is formatDate, formatCurrency, timeZone, setTimeZone, parseNumber,
    and parseDate. These tags are discussed in the sections to follow.


    # The formatNumber Tag


    You use formatNumber to format numbers. This tag gives you the flexibility of
    using its various attributes to get a format that suits your need. The syntax
    of formatNumber varies. The first is without a body content:


    ```

    <fmt:formatNumber value="numericValue"

    [type="number|currency|percent"]

    [pattern="customPattern"]\n[currencyCode="currencyCode"]\n[currencySymbol="currencySymbol"]\n[groupingUsed="true|false"]\n[maxIntegerDigits="maxIntegerDigits"]\n[minIntegerDigits="minIntegerDigits"]\n[maxFractionDigits="maxFractionDigits"]\n[minFractionDigits="minFractionDigits"]\n[var="varName"]

    [scope="page|request|session|application"]/>

    ```


    The second form is with a body content:


    ```

    <fmt:formatNumber type="number|currency|percent"

    [pattern="customPattern"]

    [currencyCode="currencyCode"]

    [currencySymbol="currencySymbol"]

    [groupingUsed="true|false"]

    [maxIntegerDigits="maxIntegerDigits"]

    [minIntegerDigits="minIntegerDigits"]

    [maxFractionDigits="maxFractionDigits"]

    [minFractionDigits="minFractionDigits"]

    [var="varName"]

    [scope="page|request|session|application"]

    numeric value to be formatted

    </fmt:formatNumber>

    ```


    The body content is JSP. The list of the formatNumber tag’s attributes is given
    in Table 7.8.'
  merge: -1
  pgno: 205
