  md: '# 276 Chapter 12: The Tiles Framework


    # The importAttribute Tag


    You use this tag to create scoped variables that reference all Tiles'' attributes
    in the ComponentContext object. The created scoped variables will have the same
    names as the names of the Tiles'' attributes. If no name attribute is present,
    the importAttribute tag will create page-scoped variables for all the Tiles''
    attributes. For instance:


