  md: '# # Chapter 1

    Model 2 and Struts


    As explained in Introduction, Model 2 is the recommended architecture for all
    but the simplest Java Web applications. This chapter will now discuss Model 2
    in detail and provide two examples of Model 2 applications. It will also introduce
    Struts as a framework for rapid Model 2 application development. This book starts
    with Model 2 because a sound understanding of this design model is crucial for
    building effective Struts applications.


    Model 2 is based on the Model-View-Controller (MVC) design pattern. The latter
    was the central concept behind the Smalltalk-80 user interface. At that time the
    term “pattern” was not yet used. Instead, it was called the MVC paradigm.


    An application implementing the MVC pattern consists of three modules: model,
    view, and controller. The view takes care of the display of the application. The
    model encapsulates the application data and business logic. The controller receives
    user input and commands the model and/or the view to change accordingly.


    # Note


    The paper entitled *Applications Programming in Smalltalk-80(TM): How to use Model-View-Controller
    (MVC)* by Steve Burbeck, Ph.D. talks about the MVC pattern. You can find it at
    http://st-ws.cs.uiuc.edu/smerch/st-docs/mvc.html.


    In Model 2, you have a servlet acting as the controller pattern. Java Server Pages
    (JSPs) are employed as the views of the application. As the models, you use JavaBeans
    and other Java objects to hold application data and encapsulate business logic.
    Figure 1.1 shows the diagram of a Model 2 application.


    In such an application, every HTTP request must be directed to the controller
    servlet. A piece of information embedded in the request''s Uniform'
