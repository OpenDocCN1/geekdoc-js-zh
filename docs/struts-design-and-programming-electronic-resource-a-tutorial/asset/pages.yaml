    and save the file using the original filename in the WEB-INF directory.


    Run the app17a application by invoking this URL. http://localhost:8080/app17a/displayFileUploadForm.do


    # # File Download


    Downloading files is a day-to-day activity for an Internet surfer. Writing a Web
    application that allows only authorized users to download certain files is a totally
    different story. This is because you cannot simply publish the URL of the file
    you want users to download.


    For security reasons, normally you use the operating system or Web container authentication
    system. This authentication mechanism lets you password-protect files so that
    file downloading is allowed only after the user has entered the correct user name
    and password. However, if you have more than one user, the password must be shared,
    greatly reducing the effectiveness of password-protecting a resource. The more
    people know the password, it is almost impossible to record who downloads what.


    In other applications, you may want to dynamically send a file when the name or
    location of the file is not known at design time. For instance, in a product search
    form, you display the products as the result of the search. Each product has a
    thumbnail image. Since you do not know at design time which image files to send
    to the browser.


    In another scenario, you have a large and expensive image that should only be
    displayed in your Web pages. How do you prevent other Web sites from cross referencing
    it? If only you could check the referer header of each request for this image
    before allowing the image to be downloaded.


    Programmable file download can help solve all the problems detailed above. In
    short, programmable file download lets you selectively send a file to the browser.'
