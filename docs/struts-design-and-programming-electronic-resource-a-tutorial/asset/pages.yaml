  md: '# 136 Chapter 5: The Validator Plugin


    The validwhen validator takes an argument, test. When invoked, the validator will
    evaluates the value of test. If it evaluates to true, validation is performed.
    Otherwise, no validation is performed.


    The test argument can take one of the following.


    +   - String literals, single quoted or double-quoted.

    - Decimal, hexadecimal, or octal numbers.

    - The value null, which will match against null or an empty string.

    - Other fields in the form referenced by the field name.

    - Indexed fields in the form referenced by an implicit integer.

    - Indexed fields in the form referenced by an implicit integer, which will use
    the same index into the array as the index of the field being validated.

    - Properties of an indexed fields in the form referenced by an explicit or implicit
    integer, which will use the same index into the array as the index of the field
    being validated.

    - The literal *, which represents the value of the field being validated.


    For example, in an online job application, you may require that an applicant provide
    a way to contact him/her through email, telephone, or both. The Email field is
    optional, but the Telephone field must be filled if the Email field is empty.
    However, if the Email field has a value, the Telephone field may be empty. For
    this purpose, you may want to validate the Telephone field using the validWhen
    validator. Here is the test argument for this scenario.


    ```

    (email != null) or ((email == null) and (**!=null))

    ```


    Validation will pass


    +   - if email is not empty, or

    - if email is empty but the current field (telephone) is not empty.


    > Note

    validwhen does not support client-side validation. In addition, you need the antlr.jar
    file in WEB-INF/lib when using validwhen


    Now that you have learned all the default validators that come with the Validator
    plugin, I''ll present a sample application that demonstrates how to use Validator.'
