  md: '# Writing Custom Validators


    You can mix the Validator plugin and your own validation code, but your code will
    only apply in a particular action form. If the validation is something you want
    to share across the application, you can create a custom validator and register
    it with the Validator plugin instead. In fact, your custom validator can be used
    in other applications as well.


    To use a pluggable custom validator, you need to follow these steps.


    +   1. Create a class that implements java.io.Serializable and a method that performs
    the validation.

    2. Register the validator in the validator-rules.xml, or in a custom validator
    file, using the validator element. and do not forget to add the path to the file
    in your plug-in element in your Struts configuration file.

    3. Optionally, if you wish to support client validation, write a JavaScript function
    and save it in a JS file. You then refer to this JavaScript file from your validator
    element.


    Two applications, app05f and app05g, demonstrate how you can write a custom validator.
    Both feature the same validator, but app05g includes client side validation while
    app05f supports server side validation. This section features the app05f application,
    and app05g is discussed in the next section, “Custom Validator with Client Side
    Validation”.


