  md: "# The processLocale Method\n\nStruts supports internationalization and localization.\
    \ It is therefore important to retrieve the user's locale before further processing.\
    \ The processLocale method in Listing 22.5 handles the user's locale.\n\n# Listing\
    \ 22.5: The processLocale Method\n\n```\nprotected void processLocale(HttpServletRequest\
    \ request,\n                              HttpServletResponse response) {\n\n\
    \    // Are we configured to select the Locale automatically?\n    if (!moduleConfig.getConfig().getLocale())\
    \ {\n        return;\n    }\n\n    // Has a Locale already selected?\n    HttpSession\
    \ session = request.getSession();\n    if (session.getAttribute(Globals.LOCALE_KEY)\
    \ != null) {\n        return;\n    }\n\n    // Use the Locale returned by the\
    \ servlet container (if any)\n    Locale locale = request.getLocale();\n    if\
    \ (locale == null) {\n        if (log.isDebug(\"Setting user locale \" + locale\
    \ + \"\")) {\n        }\n        session.setAttribute(Globals.LOCALE_KEY, locale);\n\
    \    }\n}\n```\n\nIn order to determine the correct locale, the processLocale\
    \ method follows these steps.\n\n+   1. Checks the value of the locale property\
    \ of the ControllerConfig object in the ModuleConfig object. This boolean value\
    \ indicates whether or not the user locale should be stored in the HttpSession\
    \ object and default is true. You can change the value by assigning true or false\
    \ to the locale property of the controller element in the Struts configuration\
    \ file. If this value is false, processLocale returns immediately.\n2. Retrieve\
    \ the user locale in the HttpSession object, if any.\n3. Obtain the locale from\
    \ the get method on the HttpServletRequest object."
