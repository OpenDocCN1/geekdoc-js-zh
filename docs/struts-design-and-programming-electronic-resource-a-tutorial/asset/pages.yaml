  md: "# A Primitive Model 2 Application\n\nWEB-INF/lib directory. For example, the\
    \ JSTL 1.0 TLDs are packed into the standard.jar file. The uri element of the\
    \ c.tld file (the descriptor for general purpose tags) in the standard.jar file\
    \ is as follows.\n\n```\n<uri>http://java.sun.com/jstl/core</uri>\n```\n\nYou\
    \ can use all the tags in TLD as long as you include the following taglib directive\
    \ in JSP pages.\n\n```\n<@ taglib uri=\"http://java.sun.com/jstl/core\" prefix=\"\
    c\" %>\n```\n\nWhen referring to a TLD file directly, there is no need to mention\
    \ the taglib in the deployment descriptor (web.xml file). When referring to a\
    \ TLD file indirectly, you must use a taglib element in your web.xml file. The\
    \ taglib element will have two subelements: taglib-uri and taglib-location. The\
    \ taglib-uri element specifies a unique identifier for the TLD. The taglib-location\
    \ element defines the location of the TLD file. Normally, you would place the\
    \ TLD file in the WEB-INF directory. Here is an example of a taglib element in\
    \ the web.xml file.\n\n```\n<taglib>\n  <taglib-uri>/tags/struts-html</taglib-uri>\n\
    \  <taglib-location>WEB-INF/struts-html.tld</taglib-location>\n</taglib>\n```\n\
    \nIn your JSPs, the uri attribute of your taglib directive specifies the value\
    \ of the taglib-uri element in the web.xml file, and not the value of the TLD's\
    \ uri element.\n\n```\n<@ taglib uri=\"tags/struts-html\" prefix=\"html\" %>\n\
    ```\n\nReferring to a TLD directly is easier because you do not need to edit your\
    \ web.xml file. However, if you need to upgrade to a later version of the tag\
    \ library, you might have to edit all JSP pages that use a tag from the tag library.\
    \ This is because the value of a TLD's uri element may change in the new release\
    \ of the tag library. For example, the values of the uri elements in the TLDs\
    \ in JSTL 1.0 are different from those in JSTL 1.1.\n\nIn practice, both methods\
    \ of referring to TLD files are used. In this book, Struts TLDs are referred to\
    \ indirectly and non-Struts TLDs are referred to directly to give you the experience\
    \ of using both methods."
