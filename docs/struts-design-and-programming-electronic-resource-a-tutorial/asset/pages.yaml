  md: "# The processContent Method\n\nThe processContent method (in Listing 22.6)\
    \ sets the HttpServletResponse object's content type with the value of the controller\
    \ element's contentType attribute in the Struts configuration file. By default,\
    \ the value is text/html.\n\nListing 22.6: The processContent Method\n\n```\n\
    protected void processContent(HttpServletRequest request,\n  HttpServletResponse\
    \ response) {\n  String contentType =\n    moduleConfig.getControllerConfig().getContentType();\n\
    \  if (contentType != null) {\n    response.setContentType(contentType);\n  }\n\
    }\n```\n\n# The processNoCache Method\n\nThe processNoCache method (in Listing\
    \ 22.7) determines whether or not to disable caching by the browser. If the value\
    \ of the controller element's nocache attribute in the corresponding Struts configuration\
    \ file is true, browser caching will be disabled by setting the Pragma and Cache-Control\
    \ HTTP response headers to No-cache and no-cache,no-store,max-age=0, respectively.\
    \ In addition, the Expires date header is set to 1 so that the content will expire\
    \ immediately, hence prevent browser caching.\n\nListing 22.7: The processNoCache\
    \ Method\n\n```\nprotected void processNoCache(HttpServletRequest request,\n \
    \ HttpServletResponse response) {\n  if (moduleConfig.getControllerConfig()) {\n\
    \    response.setHeader(\"Pragma\", \"No-cache\");\n    response.setHeader(\"\
    Cache-Control\", \"no-cache,no-store,max-age=0\");\n    response.setDateHeader(\"\
    Expires\", 1);\n  }\n}\n```"
