  md: "# Chapter 1: Model 2 and Struts\n\n# Note\n\nThe controller servlet in Struts\
    \ is called “action servlet”, a term I will use throughout the rest of the book.\n\
    \nIn this section, you will see how Struts can help you write Model 2 applications\
    \ more rapidly. The first subsection discusses the Struts configuration file.\
    \ The next subsection explains how to configure your deployment descriptor (web.xml\
    \ file) to use Struts, followed by a rewrite of the previous sample applications\
    \ using Struts.\n\n# The Struts Configuration File\n\nA Struts application must\
    \ have a configuration file, which by default is an XML file named struts-config.xml\
    \ and resides in the WEB-INF directory. The root element of this XML file is struts-config.\
    \ For now, we will focus on the configuration settings related to action and view\
    \ management. Other aspects of configuration will be explained in the next chapters.\n\
    \n# Note\n\nA complete reference of the Struts configuration file is given in\
    \ Appendix A.\n\nThe element for managing actions and views is action-mappings,\
    \ which groups all actions in the Struts application. The action-mappings element\
    \ can have one or more action elements. An action element represents an action\
    \ and must have a path attribute, which uniquely identifies the action. For example,\
    \ the previous applications had two actions, displayAddProductForm and saveProduct.\
    \ In Struts, you would have the following action elements for those two actions.\n\
    \n```\n<struts-config>\n  <action-mappings>\n    <action path=\"/displayAddProductForm\"\
    \ ... />\n    <action path=\"/saveProduct\" ... />\n  </action-mappings>\n</struts-config>\n\
    ```"
