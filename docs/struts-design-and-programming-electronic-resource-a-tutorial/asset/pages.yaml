  md: '# 42 Chapter 2: Input Validation with Action Forms


    Of course, you can get the values of **productName** and **description** by calling
    the **getParameter** method on the **HttpRequest** object, but in a moment you''ll
    see why it makes sense to use action forms.


    +   ### Using Action Forms

    You must take the following steps to use an action form:

    1. Create an action form class that extends **org.apache.struts.action.ActionForm**.
    This action form is mapped to an HTML form. Each field in the HTML form must be
    associated with an identically named property in the action form.

    2. Define the action form using a **form-bean** element in the Struts configuration
    file.

    3. Associate an action with the action form by using the **name** attribute for
    that action in the Struts configuration file.


    Now let''s have a look at the **org.apache.struts.action.ActionForm** class.


    # The ActionForm Class


    The **org.apache.struts.action.ActionForm** class is a JavaBean associated with
    an HTML form. Each property in an action form represents a field in the HTML form.
    The property name must be the same as the associated field.


    You override the **reset** method of **ActionForm** to initialize the property
    values. Note that the **reset** method cannot be used to reset the values of the
    associated HTML form.


    You write validation rules by overriding the **validate** method of **ActionForm**.
    Here is the signature of the **validate** method:


    ```

    public ActionErrors validate(ActionMapping mapping, javax.servlet.ServletRequest
    request)

    ```


    where **ActionErrors** is a collection that can contain **ActionError** objects
    (more about this in Chapter 3).'
