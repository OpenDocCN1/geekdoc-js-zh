  md: '# # Chapter 16

    Object Caching


    Creating Java objects is relatively more expensive than other operations, and
    constructing certain objects, such as database connections, is particularly compute
    intensive. To improve performance, you may want to cache and reuse these objects.
    For instance, database connection pooling is very common nowadays. With connection
    pooling, the system creates a number of connection instances and reuse them. Also,
    a servlet container normally only has one instance for each servlet (except those
    implementing javax.servlet.SingleThreadModel), and all HTTP requests are handled
    by the same servlet instance. In addition, objects obtained from JNDI lookup takes
    lots of CPU cycles. Note, however, caching add complexity to your application,
    so you don''t want to cache *any* object. Also, depending on your approach, there
    are consequences, as thread safety.


    This chapter discusses object caching through the use of the Singleton pattern.


    # # Implementing a Cache


    There are at two ways of caching objects. The first approach is to create a single
    instance of a class and reuse this instance for all clients. Among others, this
    technique has been used in servlet containers. Unless a servlet implements the
    javax.servlet.SingleThreadModel interface, there will be only one instance for
    a servlet definition. All requests for this servlet will be passed to the same
    servlet instance. This method is very easy to implement and the only requirement
    is that your object must be thread safety to store values, even though read-only
    class variables are okay. Methods'' local variables are safe because each method
    is assigned its own memory space for each invocation.'
  merge: -1
  pgno: 338
- img_proc: true
  md: "# 330 Chapter 16: Object Caching\n\nThe second object caching technique is\
    \ to create a pool of objects. Object pooling is more complex than a single instance\
    \ reuse and an example of this is the connection object pooling implemented in\
    \ all J2EE containers. In a connection pooling, a minimum number of Connection\
    \ instances are created. When a client needs to use a Connection object, the J2EE\
    \ container assigns one to it. When the client is finished with it, the connection\
    \ must be closed and this serves as an indication that the Connection object can\
    \ be returned to the pool. Another example of other object pools is the Tomcat\
    \ connectors, which creates pools of HttpServletRequest and HttpServletResponse\
    \ objects.\n\nIn this chapter we will review the first method of object caching,\
    \ in which a single instance is constantly reused. We do this through the use\
    \ of the Singleton pattern.\n\nUsing this pattern, you have a single object cached\
    \ Cache. Inside the object, you have variables that reference cached objects.\
    \ There are also methods that return those objects.\n\nThe app16a application\
