  md: '# Overview of the Chapters


    input without writing Java code. Chapter 5 presents how to use and extend this
    plugin in minute 9.


    Chapters 6 to 9 explained how to access model objects in the MVC pattern from
    JSPs. Chapter 6, “The Expression Language”, covers the Expression Language (EL)
    in JSP 2.0. The EL is one of the most important features in JSP 2.0 that can help
    you write shorter and more effective JSPs, as well as help you author script-free
    pages.


    Chapter 7, “JSTL”, covers JSTL’s tags used for accessing scoped objects and scoped
    objects’ properties, iterating members of a collection, performing conditional
    tests, parsing and formatting dates and numbers, and functions useable from JSP
    2.0 EL expressions.


    Chapter 8, “The Bean Tag Library”, covers the Bean Tag Library, one of the Struts’
    core tag libraries, whose tags are mainly used to access scoped objects and various
    objects in the HttpServletRequest object.


    Chapter 9, “The Logic Tag Library”, explains the Logic Tag Library, which contains
    tags for comparing values, matching strings, forwarding and redirecting users,
    and iterating collections.


    Chapter 10, “Struts-EL, Nested, selectLabel” explains the Struts EL Library, the
    Nested, and a custom tag selectLabel. The latter is to display the text of a selected
    option.


    Chapter 11, “Message Handling and Internationalization”, covers message handling,
    which is also one of the most important tasks in application development. Today
    it is also a requirement that applications be able to display internationalized
    and localized messages. Struts has been designed with internationalization and
    localization in mind and in the core tag libraries all support internationalized
    message handling. In addition, this chapter shows how you can use several tags
    in JSTL to support message displaying and formatting.


    Chapter 12, “The Tiles Framework” discusses how you can achieve a consistent look
    in your Struts applications using the Tiles framework. Tiles, which is vastly
    superior to JSP, allows you to write layout and definition pages There are two
    types of definition pages, JSP and XML, and definition elements or tags inside
    definition pages can be extended.


