  md: '# The Substring Matching Tags


    | Tag | Description | JSTL Equivalent |

    | match | Executes the tag''s body if a value is an exact match of the specified
    value, or if it starts or ends with the specified value. | cif |

    | notMatch | Executes the tag''s body if a value is not an exact match of the
    specified value and it does not start or end with the specified value. | cif |


    Table 9.2: The substring matching tags


    The value to be compared can be a cookie, a request header, a request parameter,
    or a scoped object''s property. Just like the value comparison tags, you need
    the following attributes.


    +   - **cookie**. Specifies the name of the cookie whose value is being tested.

    - **header**. Specifies the name of the request header whose value is being compared.

    - **parameter**. Specifies the name of the request parameter whose value is being
    compared.

    - **name** and **property**. Use either the **name** attribute or the **name**
    and **property** attributes to test a scoped object or scoped object''s property.
    If the scoped object itself contains the value to be verified, e.g. the scoped
    object is a **String**, use the **name** attribute to specify the scoped object.
    If the property of a scoped object is to be compared, use **name** to specify
    the scoped object and **property** to specify the scoped object''s property.


    Additionally, you can use the **scope** attribute when using **match** or **notMatch**
    to compare the value of a scoped object or scoped object''s property, to specify
    the scope of the scoped object. Its value may be one of the following: **page**,
    **request**, **session**, **application**, or any **scope**.


    In addition, the **match** and **notMatch** tags have the optional **location**
    attribute that specifies how the string comparison should be performed. This attribute
    may have one of two possible values, **start** and **end**. If the value of this
    attribute is **start**, the comparison succeeds if the value starts with the specified
    value. If the value of location is **end**, the comparison evaluates to true if
    the value ends with the specified value. To test if a value is an exact match
    of a given value, the **location** can either be **start** or **end**. For example,
    consider the following **match** tag.'
  merge: -1
