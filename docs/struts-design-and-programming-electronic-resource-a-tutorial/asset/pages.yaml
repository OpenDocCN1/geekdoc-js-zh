    \ default validators explained in the previous section. These validators must\
    \ be registered in an XML file to enable the Validator plugin can use them.\n\
    2. The validation rules used for validating an action form's properties. These\
    \ validation rules are defined in an XML file.\n\nThe Validator document for validator\
    \ registration and the XML document for declaring validation rules are validated\
    \ against the DTD file. Therefore, in theory, you can have an XML file for both\
    \ registering validators and declaring validation rules. In practice, however,\
    \ it is better to separate those two.\n\n# Note\n\nThe Validator plugin comes\
    \ with an XML document that registers its default validators so that you can use\
    \ them in your validation rules. This XML file is named validator-rules.xml and\
    \ can be found in the lib directory of the Struts deployment package.\n\n# Note\n\
    \nYou normally use a separate XML file for your validation rules. By convention,\
    \ this XML file is named validation.xml.\n\nTo use the Validator plugin, you must\
