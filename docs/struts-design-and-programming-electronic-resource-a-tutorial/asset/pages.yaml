  md: '# The Default Validators


    uisng a regular expression. The regular expression must start with a ^ and end
    with a $.


    For instance, a US zip code field accepts numbers only. It may consist of 5 digit
    number or five digit number followed by another four digit number. If the last
    four digits are present, a hyphen separates the first five digits from the last.
    The regular expression for a valid US zip code is


    ```

    \d{5} (-\d{4})?

    ```


    To use the mask validator to validate a zip code, you use the following string
    as an argument to the validator''s **mask** argument.


    ```

    ^\d{5}(-\d{4})?

    ```


    # email


    You use this validator to check if the value in a field is a valid email, i.e.
    has the syntax of an email address and contain only characters that are allowed
    in an email address. This validator does not take an argument.


    # url


    You use the url validator to validate if a field''s value is a uniform resource
    locator (URL). This validator does not take an argument.


    # creditCard


    You use this validator to validate if a field''s value conforms to a valid credit
    card number format. It does not, however, check the validity of the card itself.
    This validator does not take an argument.


    # validwhen


    You use valid when you need to validate a field against another field. For example,
    prompting the user to enter a new password, you may want the password to be entered
    twice to make sure there is no mistyping. Or you may require that a field is required
    only if another field is not empty. To Parphrase, the validwhen validator only
    works when a test condition is met.'
