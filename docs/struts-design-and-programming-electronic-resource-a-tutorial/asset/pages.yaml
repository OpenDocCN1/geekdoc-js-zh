  md: '# The Value Comparison Tags


    to convert the value being tested to floats or doubles. If the conversion is successful,
    a number comparison is performed. Otherwise, a string comparison is done.


    To enable you to test or compare a value, a value comparison tag can have the
    following attributes, only one of which may be present in the tag.


    +   - cookie. Specifies the name of the cookie whose value is being tested.

    - header. Specifies the name of the request header whose value is being compared.

    - parameter. Specifies the name of the request parameter whose value is being
    compared.

    - name and property. Use either the name attribute or the name and property attributes
    to test a scoped object or a scoped object''s property. If the scoped object itself
    contains the value to be compared, i.e. the scoped object is a String, use the
    name attribute to specify the scoped object. If the property of a scoped object
    is to be compared, use name to specify the scoped object and property to specify
    the scoped object''s property.


    Additionally, you can use the scope attribute to specify the scope of the scoped
    object being tested. Its value may be one of the following: page, request, session,
    application, or any scope.


    With the exception of the present and notPresent tags, you must use the value
    attribute to specify the compared value. For example, to test the value of a cookie,
    you will use the cookie and value attributes. To compare the value of a request
    parameter, you need the parameter and value attributes in your tag.


    # Using present and notPresent


    You use present to test if a cookie, a request parameter, a request header, or
    a JavaBean''s property is present, and execute the tag''s body if it is. The notPresent
    tag is similar to present, but it executes the tag''s body if it is not present.'
