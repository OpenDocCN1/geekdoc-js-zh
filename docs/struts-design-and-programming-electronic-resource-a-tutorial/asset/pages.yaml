  md: '# A Primitive Model 2 Application


    This section presents an example of a basic Model 2 application to give you a
    general idea of what a Model 2 application looks like. In real life, Model 2 applications
    are far more complex than this.


    The sample application can be used to enter product information and is named app01a.
    The user fills an entry form like the one in Figure 1.2 and submits the form.
    The application will then send a confirmation page to the user and display the
    details of the saved product (see Figure 1.3).


    The application is capable of performing these two actions:


    +   1. Display the “Add Product” form. This action sends the entry form in Figure
    1.2. The path to invoke this action will contain the string action=displayAddProductForm
    and returns the confirmation page in Figure 1.3.

    2. Save the product path to invoke this action must contain the string action=saveProduct.


    The application consists of the following components:


    +   1. The ProductTO class that represents a product.

    2. The ControllerServlet class, which is the controller servlet.

    3. Three JSPs (displayAddProductForm.jsp and displaySavedProduct.jsp) as the views.


    The directory structure for this application is shown in Figure 1.4. Note that
    you must have two JSTL JARS (jstl.jar and standard.jar) in WEB-INF/lib.


    ![](img/b333f2b2346b8836cf06378200dc8816_25_0.png)'
