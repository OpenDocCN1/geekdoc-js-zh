    defaults to the value of the **MESSAGES_KEY** field of the **org.apache.struts.Globals**
    class. |

    | className | The type of the configuration object for this *ExceptionHandler*
    object. The default value is **org.apache.struts.config.ExceptionHandlerConfig**.
    |

    | handler | The type of this exception handler. The default is **org.apache.struts.action.ExceptionHandler**.
    |

    | key* | The key in this handler’s message resource bundle to look up the error
    message for this exception. |

