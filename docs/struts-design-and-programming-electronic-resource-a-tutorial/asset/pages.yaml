    This plug-element tells Tiles that the name of the Tiles definition file is tiles-defs.xml
    and it can be found under the WEB-INF directory.


    To use the definition, you must change your struts-config.xml. In your action,
    you do not forward control to a JSP, but to a variable in the Tiles XML definition
    file. Listing the action-mappings element in the struts-config.xml file.


    Listing 12.6: The action-mappings element in the struts-config.xml file.


    ```

