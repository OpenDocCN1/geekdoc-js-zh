  md: "# Chapter 10\nStruts-EL, Nested, selectLabel\n\nThis chapter discusses Struts-EL\
    \ and Nested, two less important tag libraries that come with Struts, and the\
    \ free and open-sourced selectLabel tag from BrainySoftware.com. The Struts-EL\
    \ Tag Library contains tags that are the Expression Language-enabled version of\
    \ each tag in the HTML, Bean, Logic, and Tiles Libraries with no JSTL replacement.\
    \ The Nested Tag Library extends several tags from the HTML, Bean, and Logic Tag\
    \ Libraries to enable the tags to be used in a nested context. The selectLabel\
    \ tag is used to display the label of a selected option in a select element.\n\
