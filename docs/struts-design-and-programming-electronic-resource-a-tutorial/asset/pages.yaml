  md: '# The MVC-ness of Struts


    Inside the execute method of the SaveProductAction class you create a ProductTO
    JavaBean and populates its properties using the values of some request properties.
    In a real world application, you would want to persist the ProductTO object to
    the database. We will discuss about object persistence in Chapter 15, “The Persistence
    Layer”.


    Finally, we make the ProductTO object request-scoped object, so that it can be
    displayed in the JSP.


    # Running the Application


    This application is a Struts replica of the previous two applications. To invoke
    its first action, use the following URL (assuming Tomcat is used)


    ```

    http://localhost:8080/app01c/displayProductForm.do

    ```


    You will see something like Figure 1.2 in your browser. You can enter values to
    the fields and submit the form. Your browser will look something similar to Figure
    1.3.


    Congratulations. You''ve just seen Struts in action!


    # The MVC-ness of Struts


    Struts is a framework for rapidly building Model 2 applications. Model 2, in turn,
    is based on the MVC pattern. Now, let''s discuss Struts as an implementation of
    the MVC pattern.


    The Struts action servlet is the controller. This is clear from the fact that
    all HTTP requests go to this servlet and the servlet invokes actions and forward
    control to JSPs.


    The JSPs undoubtedly are the views.


    Determining the model is not as straightforward. Bear in mind that the model encapsulates
    business data and houses business methods. We have seen that business data is
    encapsulated in transfer objects (which are JavaBeans), so transfer objects are
    part of the model.'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'However, the business methods are somewhere else, often in EJBs or other business
    objects. Therefore, these EJBs and other business objects, if any, are part of
    the model too.


    What about action objects? Their role is often ambiguous and open to debate. At
    least, you can say that it depends on what you are writing in your action classes.


    If you are using an action object to create transfer objects and invoke business
    methods in EJBs or other business objects, the action object is part of the controller
    and acts as an interface between the controller and the model. This normally happens
    in larger applications. However, if you are writing business logic inside your
    action classes, the action objects are part of the model.


    # Summary


    In this chapter you have learned the Model 2 architecture and how to write Model
    2 applications. Struts was designed to make writing Model 2 application easier.
    You have also been introduced to Struts and built a simple Struts application.


    You will find other features of Struts in the next chapters.'
