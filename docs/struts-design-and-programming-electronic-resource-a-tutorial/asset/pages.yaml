- img_proc: true
  md: '# Introduction


    resources in your applications. What is meant by “configuration” is that you need
    only modify your deployment descriptor file—no programming is necessary. In addition,
    you will also learn how to use the roles attribute in the action element in the
    Struts configuration file. Writing Java code to secure Web applications is also
    possible through the following methods of the javax.servlet.http.HttpServlet interface:
    getRemoteUser, getPrincipal, getAuthType, and isUserRole.


    Chapter 14, “The Config Object”, teaches how to implement a Config object that
    stores key/value pairs that are available throughout the application. Key/value
    pairs may come from the deployment descriptor or a properties file and an application
    listener can be used to populate the Config object.


    Chapter 15, “The Persistence Layer”, addresses the need of a persistence layer
    to save value objects. The persistence layer hides the complexity of accessing
    the database from its clients, the Data Access Object (DAO) pattern, by using
    Hibernate. This chapter shows you in detail how to implement the DAO pattern.
    There are many variants of this pattern and which one you choose depends on the
    project specification. The most flexible DAO pattern is preferable because you
    can extend your application easily it needs to change in the future.


    Creating Java objects is relatively more expensive than other operations, and
    constructing certain objects, such as database connections, is particularly compute
    intensive. Chapter 16, “Object Caching”, shows how to cache objects efficiently.


    Chapter 17, “File Upload and File Download”, discusses two important topics that
    often do not get enough attention in Web programming. Struts supports file upload
    by seamlessly incorporating the Jakarta Commons FileUpload library. The first
    section of this chapter discusses how to achieve this task in Struts. The second
    section deals with file download and demonstrates how you can send binary streams
    to the browser.


    In Chapter 18, “Paging and Sorting”, you can learn about paging, a technique that
    displays data in multiple pages. Paging is used when you are working with a large
    amount of data. For more effective solutions, you need to identify whether your
    action retrieves a large collection of data or a very large one. For the former,
    the effective solution is cache-based paging. For the'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'latter, it is query-based paging. This chapter also introduces the Display
    Tag Library that by default supports paging and sorting.


    Chapter 19, “Preventing Double Submits”, explains how to use Struts’ built-in
    features to prevent double submits, which could happen by accident or by the user’s
    not knowing what to do when it is taking a long time to process a form.


    Chapter 20, “Early Session Invalidation” presents a technique that can be used
    to end the lives of HttpSession objects of users who have closed their browsers,
    effectively freeing precious space.


    Chapter 21, “Decorating Objects”, explains the use of the Decorator design pattern
    to wrap HttpServletRequest objects. An example that features a trimmer filter
    is also presented.


    Chapter 22, “How Struts Works”, sums up this book by looking into what happens
    under the hood. In particular, this chapter explains the three most important
    types in Struts: ActionServlet, RequestProcessor, and ConfigModule. Understanding
    how Struts works undoubtedly enables you to write more effective applications.


    Appendix A, “Struts Configuration”, is a reference of the Struts configuration
    file.


    # Code Download


    One of the strengths of this book is that each topic is accompanied by plenty
