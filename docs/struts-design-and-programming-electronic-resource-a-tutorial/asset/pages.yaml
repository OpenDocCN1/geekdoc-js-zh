  md: 'request headers, and so forth. These tags allow you to create a scoped variable
    that can be used with the write tag to display the value in the browser. Therefore,
    these tags normally work in two steps.


    +   1. Read a value (using cookie, header, parameter, etc) and create a scoped
    variable that references the value.

    2. Use the write tag to displays the value of the scoped variable created.


    In other words, there is no tag similar to the JSTL out tag that can read a value
    and display it at the same time.


    Referencing JavaBeans’ Properties do not use the Expression Language. Instead,
    Struts’ core tag libraries introduces three types of references you can use to
    access a scoped object or scoped object’s property: simple, nested, and indexed.

    Simple references are used to access a scoped object’s property, similar to the
    standard <jsp:getProperty> and <jsp:setProperty> tags. A reference to a property
    named foo is converted into a method getFoo or setFoo, appropriate, using the
    standard JavaBeans Specification naming conventions for bean properties.

    Nested references allow you to access a property of a property. A dot is used
    to separate between properties. For example, city.address refers to the address
    property of the object returned by the city property.

    Indexed references are used to access individual elements of a property. For example,
    foo[0] refers to the first member of the collection referenced by the foo property.

    In practice, the nested and indexed properties can be combined in any way. For
    example,[2].bar refers to the bat property of the third member of the collection
    referred by foo.


    Each of the tags in the Bean Tag Library is given in a separate section in this
    chapter.


    # Note


    The app08a application presents the examples of the tags in the Bean Tag Library.
    You can run it by using the following URL.

    ://localhost:8080/app08a/testBean.do'
