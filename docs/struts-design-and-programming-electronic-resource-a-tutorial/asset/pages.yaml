  md: '# # Chapter 18

    Paging and Sorting


    Paging or pagination is a technique to split large result sets into more viewable
    Web pages. For example, if a business method returns a collection of 300 transfer
    objects, it is more sensible to display 10 or 20 results each time because the
    user screen space is limited and because sending all the results requires the
    transfer of a larger chunk of data. To view the other objects, the user can click
    on the Next link. Also, for easier user access, you can provide page numbers in
    each page so that the user can navigate to any page he/she desires. For more effective
    discussions, we group the problems into two categories: working with large collections
    of data and working with very large collections of data. This chapter also introduces
    the Display Tag Library, a highly popular open source library that contains tags
    for displaying table data. Among others, the Display Tag Library''s tags support
    paging and sorting.


    # ## Working with Large/Very Large Sets of Data


    When dealing with a large collection of data, bear in mind the following facts:


    +   * Retrieving data from a data source, such as a relational database, is a
    resource-intensive operation.

    * Computer memory is no longer an issue. Traditionally, Web developers were constantly
    worried about using too much of the server memory, and programmed their code in
    such a way that it would consume the least amount of memory, which often translated
    into shunning HttpSession objects. Nowadays, RAM manufacturers are making enough
    memory for every computer, bringing down the prices. In addition, modern J2EE
    containers can swap HttpSession objects to secondary storage when the memory is
    getting full. The combination of'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Chapter 18: Paging and Sorting


    cheap memory prices and the container feature makes it no longer a taboo to use
    HttpSession objects, so long as not excessively.


    +   - Paging is always necessary. In other words, you should not send 2,000 instances
    of transfer objects to the browser in one go.


    Based on these facts, you would want to retrieve as many table rows as possible
    from the database, create transfer objects from this data, collect them in a list,
    and cache the list in the user''s HttpSession object. You display the transfer
    objects in pages, of which each displays a small amount of objects each time.


    However, there is also another important fact. Some queries return only large
    collections of data, but very large of them. For example, a query may return 100,000
    records and there are at least four problems if you try to retrieve all at once:


    +   - Retrieving 100,000 records can slow your database server substantially.

    - Converting 100,000 records to 100,000 transfer objects is horribly resource-intensive.

    - Caching a list of 100,000 transfer objects in a user''s HttpSession object is
    an excessive use of memory.

    - Most of the transfer objects are not likely to be displayed.


    Therefore, you need different solutions when working with a large collection of
    data and a very large collection of data. Defining a number that separates both
    categories is often not straightforward. In some cases, 1,000 records can be considered
    large. In other cases, very large. It depends on what kind of data you are displaying,
    how much memory you have, how many milliseconds it takes your database server
    to return 1,000 records, how much of the data is projected to be viewed by the
    user, and so on.


    In practice, you should start to be cautious when a query returns 1,000 records
    or more. For the sake of discussion, let''s consider a collection of 1,000 transfer
    objects or more a very large collection. In both categories, paging and sorting
    are still needed.'
