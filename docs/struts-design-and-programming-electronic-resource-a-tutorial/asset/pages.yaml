    # Summary


    This chapter dealt with the HTML Tag Library, one of the three core tag libraries
    that come with Struts. The tags in the library can be used to generate HTML elements,
    such as the form element, the input element, hyperlinks, images, and so on.


    The benefits of using the HTML Tag Library’s tags include automatic redisplaying
    of a form’s previous values, support for displaying internationalized input validation
    error messages, support for session tracking, and support for preventing double
    submits. The latter will be discussed in detail in Chapter 19, “Preventing Double
    Submits”.'
