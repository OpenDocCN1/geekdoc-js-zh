  md: '# Chapter 3: The HTML Tag Library


    ```

    </html>

    ```


    As you can see, the comment property, which contains a multiline value, is displayed
    twice, by using the JSTL out tag and the HTML Tag Library''s textarea tag. When
    displayed with the out tag, the property loses the original format. This is because
    the carriage return sequences are not rendered by the browser. As a result, the
    comment is not displayed as multiline text. In contrast, the textarea tag displays
    it in the correct format.


    Now, if you don''t want to display a multiline value in a text area but still
    want to retain its format?


    There are several ways:


    +   1. Perform string manipulation on the comment property in the corresponding
    action class, replacing all carriage returns with <br/>. This approach is not
    preferable because text formatting should be done in the presentation layer, i.e.
    in JSPs only.

    2. Use scriptlet on the JSP to manipulate the string. However, having scriptlet
    in JSPs is not considered good practice.

    3. Employ the replace function in JSTL 1.1 (See Chapter 7). This is the most favorable
    approach, unfortunately JSTL 1.1 requires JSP 2.0.

    4. Write your own custom tag that functions similarly to the replace function.
    This seems to be a good solution if you are using JSP 1.2. Be warned, that since
    writing custom tags requires relatively more efforts than simply using scriptlet,
    many will succumb to scriptlet. However, writing one is a good investment since
    you can reuse the tag in other applications.


    # The submit and cancel Tags


    The submit tag is translated into <input type="submit">, which a browser renders
    as a submit button for an HTML form. Like the text tag, submit also has the property
    attribute. However, the property attribute is rarely used because you seldom to
    map a submit button with an action''s property.


    The cancel tag is also rendered as a submit button. However, the name attribute
    of the resulting HTML element is always assigned the value org.apache.struts.taglib.html.CANCEL.'
