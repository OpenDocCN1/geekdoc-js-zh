  md: "# Working with Very Large Collections of Data 361\n\nbatch covers 20 pages\
    \ of data. For the first batch, it is Page 1 to Page 20. If the user clicks the\
    \ Next link on Page 20, the action object must hit the database and take the second\
    \ batch of search result, for the second 20 pages. This time, it is Page 21 to\
    \ Page 40. The cachedStartPage property specifies the first page number of the\
    \ search result batch. For each invocation, the action object checks the current\
    \ page the user is requesting and the cachedStartPage. If the user wants to see\
    \ Page 6 and the value of cachedStartPage is 1 and a batch contains data for 20\
