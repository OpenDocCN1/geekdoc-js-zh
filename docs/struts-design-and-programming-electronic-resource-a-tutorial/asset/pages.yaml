    # Error Handling in Validator


    A validator inserted into the Validator plugin can add an error message when validation
    fails. This error message can then be displayed in a JSP using the errors in the
    HTML Tag Library (See Chapters 3).


    Like other message handling in Struts, you use key/value pairs declared in an
    ApplicationResources.properties file.


    You can tell which error message should be added by selecting a key when registering
    your validator. You do this by using the msg attribute of the validator element.
    For example, here the validator element that registers the required validator
    in the validator-rules.xml file.


    ```

    <validator name="required"

    className="org.apache.struts.validator.FieldChecks"

    method="validateRequired"

    methodParams="java.lang.Object,

    org.apache.commons.validator.ValidatorAction,

    org.apache.commons.validator.Field,

    org.apache.struts.action.ActionMessages,

    javax.servlet.http.HttpServletRequest"

    msg="errors.required"/>

    ```'
