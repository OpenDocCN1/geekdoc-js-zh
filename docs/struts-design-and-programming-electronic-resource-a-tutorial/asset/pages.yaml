  md: '```

    <fmt:bundle basename="AppResources">\n<fmt:message key="farewell"/>

    </fmt:bundle>

    ```


    # setBundle


    setBundle is used to load a ResourceBundle and is similar to bundle.

    However, setBundle applies to all JSPs in the scope specified in the scope attribute
    of this tag. A message tag does not have to reside in its body content to use
    the ResourceBundle it loaded.


    The following is the syntax of the setBundle tag:

    <fmt:setBundle basename="basename"

    [var="varName"]

    scope="page|request|session|application"


    The attributes for setBundle are listed in Table 11.5.


    | Attribute | Type | Description |

    |---|---||

    | basename | String | The base name for the ResourceBundle |

    | var | String | The name of the scoped variable that can be referenced in a message
    tag to use the ResourceBundle loaded by its tag |

    | scope | String | The scope for var |


    Table 11.5: The setBundle tag''s attributes


    Here is an example of how to use setBundle:

    <fmt:setBundle basename="AppResources"/>

    <fmt:message key="welcome"/>


    # message


    The message tag is used to read a message from the specified or current ResourceBundle
    and display the message. Its syntax has three forms.

    The first form is used without body content:


    ```

    <fmt:message key="messageKey"

    [bundle="resourceBundle"]

    [var="varName"]

    scope="page|request|session|application"]

    ```'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'The second form is used with a body to specify message parameters:


    ```

    <fmt:message key="messageKey"

    [bundle="resourceBundle"]

    [var="varName"]

    [scope="page|request|session|application"]

    <fmt:param> subtags

    </fmt:message>

    ```


    The third form is used with a body to specify key and optional message parameters:


    ```

    <fmt:message bundle="resourceBundle"

    [var="varName"]

    [scope="page|request|session|application"]

    key

    optional <fmt:param> subtags

    </fmt:message>

    ```


    The list of attributes is given in Table 11.6.


    | Attribute | Type | Description |

    |---|---|---|

    | key | String | The key of the message in the ResourceBundle |

    | bundle | LocalizationContext | The name of the scoped variable that can be referenced
    in a message tag to use the ResourceBundle loaded by this tag. |

    | var | String | The name of the scoped variable to store the obtained localized
    message |

    | scope | String | The scope for var. |


    # Table 11.6: The message tag’s attributes


    Here is an example of the message tag:


    ```

    <fmt:setBundle basename="AppResources"/>

    <fmt:message key="welcome"/>

    ```


    # param


    The param tag is used to pass a parameter to the enclosing message tag. Its syntax
    has two forms. The first form specifies the value via the value attribute:


    ```

    <fmt:param value="messageParameter"/>

    ```'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Chapter 11: Message Handling and Internationalization


    The second form specifies the value through the body content:

    <fmt:param>

    body content

    </fmt:param>


    The value attribute is the argument used for the replacement of a part in a localized
    message. It can be assigned a dynamic value of type java.lang.Object.


    As an example, here is a param tag:


    ```

    <fmt:message key="welcome">

    <fmt:param value="time"/>

    </fmt:message>

    ```


    # requestEncoding


    This tag is used to set the encoding of the current HttpServletRequest object.
    Here is its syntax:

    <fmt:requestEncoding value="charsetName"/>


    The value attribute is the name of character encoding to be applied when decoding
    request parameters. It can be assigned a dynamic value of type String.


    # Summary


    Message handling is one of the most important tasks in application development.
    Today''s applications also often require that applications can display internationalized
    and localized messages. Struts has been designed with i18n and l10n in mind. The
    tags in the core tag libraries all support internationalized message handling.
    In addition, this chapter showed how you can use several tags in JSTL to support
    message displaying and formatting.'
