  md: '# Inheritance of XML Definition


    The section "Writing Tiles XML Definition" explains how to write XML definition
    files.


    # Inheritance of XML Definition


    Both JSP and XML definitions support inheritance. This section discusses inheritance
    in XML definition since XML definition will be the main definition type in Struts
    applications. With inheritance, a definition element can extends another other
    definition element through the use of the extends attribute.


    In the XML definition in app12c, there are two definition elements with almost
    identical list of put subelements (See Listing 12.7).


    ```

    <definition name="display.add.product.form" path="/jsp/myLayout.jsp">

    <put name="pageTitle" value="Add Product" />

    <put name="header" value="/jsp/header.jsp" />

    <put name="body" value="/jsp/displayAddProductForm.jsp" />

    <put name="footer" value="/jsp/footer.jsp" />

    </definition>

    ```


    ```

    <definition name="display.message" path="/jsp/myLayout.jsp">

    <put name="pageTitle" value="Confirmation" />

    <put name="header" value="/jsp/header.jsp" />

    <put name="body" value="/jsp/displayMessage.jsp" />

    <put name="footer" value="/jsp/footer.jsp" />

    </definition>

    ```


    As you can see, four of put elements in both definition elements are identical.
    To avoid repetition, you can create a base definition element that contains common
    subelements, and write other definition elements that extend the common definition
    element.


    The app12d application shows how you can extend a definition element in an XML
    definition page. Thanks to support for inheritance, the XML definition in app12c
    can be replaced by the XML file in Listing 12.9.


    # Listing 12.9: The XML definition with inheritance


    ```

    <?xml version="1.0" encoding="iso-8859-1"?>

    <!DOCTYPE tiles-definitions PUBLIC

    "-//Apache Software Foundation//DTD Tiles Configuration 1.1//EN"

    ```'
