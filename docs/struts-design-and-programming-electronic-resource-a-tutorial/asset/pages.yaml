    \ Class\n\nThe SearchCustomerAction is invoked every time the user fill in the\
    \ search form and submits it and when the user clicks the Previous or Next links.\
    \ A new search, is when the user submits the form, is indicated by the POST method\
    \ of the request. Requests for subsequent or previous pages of the same search\
    \ will have a GET method. A new search must always retrieve data from the database,\
