  md: "```\n<action path=\"/saveProduct\"\ntype=\"myPackage.SaveProductAction\">\n\
    \  <forward name=\"success\"\n    path=\"/jsp/displaySavedProduct.jsp\"/>\n  <forward\
    \ name=\"failed\" path=\"/jsp/error.jsp\"/>\n</action>\n```\n\nWhen the action\
    \ is invoked, Struts creates an instance of myPackage.SaveProductAction and calls\
    \ its execute method, thus running whatever you have written in the method. Here\
    \ is the signature of the execute method:\n\n```\npublic ActionForward execute(ActionMapping\
    \ mapping,\nActionForm form, javax.servlet.ServletRequest request,\njavax.servlet.ServletResponse\
    \ response) throws\njava.lang.Exception\n```\n\nThe method returns an ActionForward,\
    \ which represents a destination to which control will be forwarded. How do you\
    \ create the correct ActionForward object for your execute method?\n\nIn the background,\
    \ Struts reads all the forward sublements of any action element and under the\
    \ global-forwards element, if any, and creates an ActionMapping object that encapsulates\
    \ this forward information. For each forward sublement in an action element, Struts\
    \ creates a corresponding ActionForward object and stores it in a java.util.HashMap\
    \ inside the ActionMapping object. The value of the name attribute of the forward\
    \ element is used as the key for the ActionForward object. Check this action element\
    \ again:\n\n```\n<action path=\"/saveProduct\" type=\"myPackage.SaveProductAction\"\
    >\n  <forward name=\"success\" path=\"/jsp/displaySavedProduct.jsp\"/>\n  <forward\
    \ name=\"failed\" path=\"/jsp/error.jsp\"/>\n</action>\n```\n\nFor this action\
    \ element, Struts creates two ActionForward objects. The first ActionForward can\
    \ be used to forward control to the displaySavedProduct.jsp page. The key used\
    \ for this ActionForward is success. The second ActionForward object is used to\
    \ forward control to the error.jsp page. The key used for this ActionForward is\
    \ failed.\n\nWhen Struts calls the execute method on the corresponding Action\
    \ object (i.e. an instance of myPackage.SaveProductAction), it also passes an\
    \ ActionMapping object that encapsulates the two ActionForward objects."
