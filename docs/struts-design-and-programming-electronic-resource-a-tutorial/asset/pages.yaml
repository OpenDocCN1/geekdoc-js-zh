  md: '# The Simplest Implementation of the DAO Pattern


    In this implementation, a client instantiates the DAO class directly and call
    its methods. Figure 15.2 shows the ProductDAO class in this variant of the DAO
    pattern.


    ![](img/b333f2b2346b8836cf06378200dc8816_318_0.png)


    Figure 15.2: The simplest implementation of the DAO pattern


    When a Struts action object wants to access product information, it instantiates
    the ProductDAO class and calls its methods.


    # The DAO Pattern with the DAO Interface


    A typical Struts application has more than one DAO class. The instances of the
    DAO classes need a uniform way of getting a connection object to access the data
    source. It is therefore convenient to have a DAO interface that provides the getConnection
    method and a DAOBase class that provides the implementation of the method. All
    the DAO classes then extend the DAOBase class, as depicted in Figure 15.3.'
