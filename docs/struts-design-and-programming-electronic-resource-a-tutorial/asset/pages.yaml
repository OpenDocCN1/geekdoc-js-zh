  md: 'ApplicationResources.properties file (See Chapter 11). It can have the following
    attributes:


    +   - **name.** A required attribute that specifies the name of the validator
    corresponding to this msg element.

    - **bundle.** An optional attribute that specifies the resource bundle name that
    the key should be resolved in.

    - **key.** A required attribute that specifies the key that will return the message
    template from a resource bundle.

    - **resource.** An optional attribute for which a value of false will cause the
    value of the key attribute to be taken as a literal value rather than a bundle
    key.


    The arg element defines a replacement value to use with the message template for
    this field. It can have the following attributes.


    +   - **name.** An optional attribute that specifies the name of the validator
    corresponding to this message. If not present, this argument will be used in the
    given position for every validator.

    - **bundle.** An optional attribute that specifies the resource bundle name that
    the key should be resolved in.

    - **key.** A required attribute that specifies the key that will return the message
    template from a resource bundle.

    - **resource.** An optional attribute for which a value of false will cause the
    value of the key attribute to be taken as a literal value rather than a bundle
    key.

    - **position.** An optional attribute that specifies the position of the replacement
    parameter in the message. Position 0 refers to the first argument, etc.


    # Passing Arguments to Validators


    The var element is used to pass an argument to a validator. For example, when
    using the date validator, you may want to pass a date pattern.


    The var element must contain a var-name and a var-value subelements and can optionally
    contain a var-ctype element.


    The var-name element specifies the name of the var parameter to provide to a field''s
    validators. The var-value element specifies the value of the var'
