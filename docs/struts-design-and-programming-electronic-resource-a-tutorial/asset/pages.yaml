  md: '# Reserved Words


    The following words are reserved and must not be used as identifiers:


    +   - and eq gt true instanceof

    - or ne le empty

    - not lt ge null div mod


    # The [ ] and . Operators


    The return type of an EL expression can be any type. If an EL expression results
    in an object that has a property, you can use the [] or . operators to access
    the property. The [] and . operators function similarly; [] is a more generalized
    form, but provides a nice shortcut.


    To access a scoped object''s property, you use one of the following forms:


    ```

    ${object("propertyName")}

    ${object.propertyName}

    ```


    However, you can use only the first form (using the [] operator) if propertyName
    is not a valid Java variable name.


    For instance, the two EL expressions can be used to access the HTTP header host
    in the implicit object header.


    ```

    ${header("host")}

    ${header.host}

    ```


    However, to access the accept-language header, you can use only the [] operator
    because accept-language is not a legal Java variable name. Using the . operator
    to access it will throw an exception.


    If an object''s property happens to return another object that in turn has a property,
    you can use either [] or . to access the property of the second object. For example,
    the pageContext implicit object represents the PageContext object of the JSP.
    It has the request property, which represents the HttpRequest object. The HttpServletRequest
    object has the servletPath property. The following expressions are equivalent
    and result in the value of the servletPath property of the HttpRequest object
    in pageContext:'
