- img_proc: true
  md: '# Using HTML Tag Libraries


    redisplay its values. This library is discussed in detail in Chapter 3 but some
    of the tags are explained here.


    The first tag is the form tag, which is translated into an HTML form. This tag
    has the action attribute that takes the path to a Struts action. When the form
    is submitted, the action whose path the action attribute will be invoked.


    The second tag is <html:text property="propertyName">, which translates into <input
    type="text" name="propertyName"/>.


    The text tag also accesses the action form associated with the enclosing form
    and copies the value of the action form''s associated property to the HTML field
    it represents. If you write the following:


    ```

    <html:text property="description">

    ```


    the text tag will copy the value of the description property of the containing
    action form. There will be an exception thrown if the action form does not contain
    the specified property.


    With this capability, the text tag can display the previous value user typed in
    if validation fails. This is very convenient because that means the user does
    not need to retype the same value.


    # Error Handling


    Recall that the validate method returns an ActionErrors object. If the ActionErrors
    object is not null and is empty, Struts will assign it as an attribute in the
    HttpRequest object. As a result, the ActionErrors object can be used to display
    the elements of the ActionErrors object. It iterates all the ActionError collection
    and matches the key of each ActionError object against a properties file.


    How does Struts find this properties file? You tell it by using the message-resources
    element in the struts-config.xml file. For example, if you have the following
    message-resources element in your Struts configuration:


    ```

    <message-resources parameter="ApplicationResources"/>

    ```


    Struts will take that you have an ApplicationResources.properties file under the
    WEB-INF/classes directory.'
