  md: '# Introduction to the Display Tag Library


    The Display Tag Library’s tags can be used to display the contents of scoped objects
    in an HTML table. The tags support the Expression Language syntax to access scoped
    objects and their properties.


    An exciting feature of the Display Tag Library is its support for paging. When
    paging is enabled, the user can navigate through pages by clicking the page numbers
    displayed on top or at the bottom of a table. You can also display a Next and
    a Previous links for the user to go to the next and previous pages, respectively.
    Additionally, sorting on a column, both in ascending and descending orders, can
    easily be achieved.


    One to note when working with the Display Tag Library’s pagination feature is
    that all rows to be displayed in multiple pages must be contained in one collection.
    In other words, you must retrieve the whole result set and store it in a collection.
    This can be problematic when working with a very large collection (of, say, 10,000
    records) because you have to retrieve all the records even most of them will never
    be displayed. This book does not recommend using the Display Tag Library when
    the data to be retrieved is very large. Working with very large collections of
    data is discussed in the section “Working with Very Large Collections of Data”
    later in this chapter.


    # Note


    You can download the Display Tag Library and its documentation from www.displaytag.org.
    To use the tags, you must copy to your WEB-INF/lib directory the displaytag.jar
    file and the following dependency JAR files from the Jakarta Commons project:
    commons-beanutils.jar, commons-collections.jar, commons-logging.jar, and commons-lang.jar.
    All these dependency JAR files, except the commons-lang.jar file, are already
    included in the Struts deployment package.


    In addition to the EL syntax, you must also have the jstl.jar and the standard.jar
    files from JSTL.


    The free documentation from its Web site offers a complete list of the tags in
    the Display Tag Library. This section presents the table, column, and setProperty
    tags, three of the most important tags that will be used in the applications accompanying
    this chapter.'
  merge: -1
  pgno: 358
