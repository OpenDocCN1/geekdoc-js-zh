  md: '# 228 Chapter 9: The Logic Tag Library


    ```

    <logic:match parameter="category" value="classA" location="start">

    category starts with classA

    </logic:match>

    ```


    This tag tests if the value of the category request parameter starts with classA.
    The test evaluates to true if the category request parameter is classA, classAbc,
    etc. However, abcClass does not pass the test.


    In the absence of the location attribute, the test succeeds if the tested value
    contains the prescribed value. For instance, the following match tag evaluates
    to true if the value of the category request parameter is classA, classAbc, abclassA,
    abclassAb, and so forth.


    ```

    <logic:match parameter="category" value="classA">

    category starts with classA

    </logic:match>

    ```


    If the value being compared does not exist, the match tag throws an exception.
    Therefore, you may want to use the present tag around this tag.


    The notMatch tag does the opposite of the match tag. Here is an example of the
    notMatch tag.


    ```

    <logic:notMatch parameter="category" value="classA" location="start">

    category does not start with classA

    </logic:notMatch>

    ```


