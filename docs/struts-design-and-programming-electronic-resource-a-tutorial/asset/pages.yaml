    # **applicationScope, sessionScope, requestScope, and pageScope**


    You use the **applicationScope** implicit object to obtain the value of an application-scoped
    variable. For example, if you have an application-scoped variable called **myVar**,
    you use this expression to access the attribute:

    ${applicationScope.myVar}


    The **sessionScope, requestScope,** and **pageScope** implicit objects are similar
    to **applicationScope**. However, the scopes are session, request, and page, respectively.


    # Using Other EL Operators


    In addition to the , [] operators, the EL also provides several other operators:
    arithmetic operators, relational operators, logical operators, the conditional
    operator, and the **empty** operator. Using these operators, you can perform various
    operations. However, because the aim of the EL is to facilitate the authoring
    of script-free JSPs, these EL operators are of limited use, except for the conditional
    operator.


    The EL operators are given in the following subsections.


    # Arithmetic Operators


    There are five arithmetic operators:


    +   - Addition (+)

    - Subtraction (-)

    - Multiplication (*)

    - Division (/ and **div**)

    - Remainder/modulo (% and **mod**)'
