  md: '# Chapter 1: Model 2 and Struts


    Request Identifier (URI) tells the servlet what action to invoke. The term “action”
    is used to refer to an operation that the application must perform.


    ![](img/b333f2b2346b8836cf06378200dc8816_21_0.png)


    Figure 1.1: Model 2 architecture


    A seemingly trivial function may take more than one action. For instance, adding
    a product would require two actions:


    +   1. Display the “Add Product” form for the user to enter product information.

    2. Save the data to the database.


    As mentioned above, you embed a piece of information in the URI to tell the servlet
    which action to invoke. One way of doing it is by using a request parameter to
    contain the action information. In this example, the application to send the “Add
    Product” form, the user would type the following URI:


    ```

    http://domain/appName/Controller?action=displayAddProduct

    ```


    To get the application to save a product, the URI would be:


    ```

    http://domain/appName/Controller?action=saveProduct

    ```


    # Note


    The path information can be obtained by calling the getPath object. However, if
    a parameter is used to indicate the action to invoke, you can also use the getParameter
    method on the same request object.


    The controller servlet examines every URI to obtain the path information so that
    it can decide what action to invoke. Based on the path information, the'
  merge: -1
