    # EL Implicit Objects


    From a JSP, you can use JSP scripts to access JSP implicit objects. However, from
    a script-free JSP page, it is impossible to access these implicit objects. The
    EL allows you to access various objects by providing a set of its own implicit
    objects. The EL implicit objects are listed in Table 11.1.


    | Object | Description |

    | --- | --- |

    | pageContext | The javax.servlet.jsp.PageContext object for the current JSP.
    |

    | initParam | A Map containing all context initialization parameters with the
    parameter names as the keys. |

    | param | A Map containing all request parameters with the parameters names as
    the keys. The value for each key is, if there are two request parameters with
    the same name, only the first can be retrieved using the param object. For accessing
    all parameter values that share the same name, use the params object instead.
    |

    | paramValues | A Map containing all request parameters with the parameter names
    as the keys. The value for each key is an array of strings containing all the
    values for the specified parameter name. If the parameter has only one value,
    it still returns an array having one element. |

    | header | A Map containing the request headers with the header names as the keys.
    The value for each key is the first header of the specified header name. In other
    words, if a header has more than one value, the first value is returned. To obtain
    multi-value headers, use the headerValues object instead. |

    | headerValues | A Map containing all request headers with the header names as
    the keys. The value for each key is an array of strings containing all |'
