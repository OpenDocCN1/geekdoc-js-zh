    | Canadian Dollar | CAD | dollar | cent |

    | Chinese Yuan | CNY | yuan renminbi | jiao |

    | Euro | EUR | euro | euro-cent |

    | Japanese Yen | JPY | yen | sen |

    | Sterling | GBP | pound | pence |

    | US Dollar | USD | dollar | cent |


    Table 7.9: ISO 4217 Currency Codes'
