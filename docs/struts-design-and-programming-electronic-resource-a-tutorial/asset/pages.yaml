  md: '# Chapter 14


    # The Config Object


    Many parts of a J2EE application need some dynamic configuration information that
    can be edited easily. For example, database operations need the data source name
    and the user credentials, the presentation and other layers require a common pattern
    for parsing and displaying datas, etc. Information can be stored in the deployment
    descriptor (the web.xml file) or a properties file. However, while the values
    in the deployment descriptor can be accessed from JSPs and Struts action object,
    they are not visible from other parts of the application, such as a business object.
    The same problem exists with employing a properties file. For the properties to
    be useful, you need a file reader that can be accessed from all parts of the application.


    This chapter proposes a novel approach that is simple enough to implement: by
    creating a Singleton Config object. But first, let''s review using the web.xml
    file or properties files in detail.


    # Using the web.xml File or Properties Files


    Properties files are a popular choice for Java programmers to store configuration
    settings. Inside a properties file you have key/value pairs. Once you know the
    name and the location of the file, reading it is straightforward.


    In Web applications, the deployment descriptor (the web.xml file) provides a similar
    function, and is more convenient to use than a properties file because you don''t
    need to worry about instantiating a file reader. You normally store configuration
    settings in context-param elements, each of which represents a key/value pair.
    For example, here is the context-param element that stores the value of dataPattern.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 300 Chapter 14: The Config Object


    ```

    <context-param>

    <param-name>datePattern</param-name>

    <param-value>MM/dd/yyyy</param-value>

    </context-param>

    ```


    The values of context-param elements are loaded automatically into the ServletContext.
    since the ServletContext is accessible from any Struts action object (through
    the getServletContext().getContext() method of the org.apache.struts.action.Action
    class) as well as from any JSP through the EL or JSTL and other custom tags, this
    seems a good place to store shareable values.


    For instance, you can define a date pattern as a context parameter in the web.xml
    file by using the following context-param element.


    ```

    <context-param>

    <param-name>datePattern</param-name>

    <param-value>MM/dd/yyyy</param-value>

    </context-param>

    ```


    To read the value of datePattern and use it to format a date, use the formatDate
    tag in JSTL.


    ```

    <jsp:useBean id="today" class="java.util.Date"/>

    <f:formatDate value="${today}" pattern="${initParam.datePattern}"/>

    ```


    Unfortunately, the values in the deployment descriptor are not visible from other
    business objects. This leads us to an alternative approach to sharing values across
    the application, discussed in the following section.


    # The Config Object


    A Config object allows you to share information application-wide. The easiest
    way to implement it is by using the Singleton pattern. An instance of a Singleton
    class will not be garbage-collected, therefore it is not necessary to put it in
    the ServletContext. In this section you will be introduced to the Singleton pattern
    and how to implement a Singleton Config object.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Introduction to the Singleton Pattern


    A Singleton class can only have one instance in the same Java Virtual Machine
    (JVM). The Singleton pattern gives you the following benefits.


    +   - A Singleton object is accessible from other objects in the same JVM

    - It can retain values throughout the life of the application

    - It can cache objects. This is especially useful for caching objects that are
    expensive to create..


    In order to prevent multiple instances of a Singleton class, you must make all
    the constructors in the class private or protected. If no constructor is explicitly
    defined in a class, the compiler will create a public no-argument constructor.
    Therefore, you must explicitly define a private or protected constructor in the
    absence of one.


    However, since there is no public constructor, the user will not be able to use
    the new keyword with the constructor to create a Singleton object, either, since
    any existing constructor will not be accessible from outside the class. So, how
    do you create an instance of a Singleton class?


    In any Singleton class, you must add a static method that returns the Singleton
    object, by calling one of the class''s constructors. But, Aren''t all constructors
    private or protected? That''s right. However, remember that the static method
    is also in the same class; therefore, it has access to all members of the class,
    including private and protected constructors or methods.


    You might ask the following question: "You can''t create an instance of a class
    by calling its constructor, so how do you call the static method (responsible
    for creating the single instance of the class) without having the class instance?"
    Note, though, static members of a class can be invoked without having an instance
    of that class. This static method, normally called getInstance, is the only way
    the class can be instantiated.


    To limit the number of instances to one, the static method has to check if an
    instance has been created before. If it has, it returns a reference to the previous
    created instance. If it not, it calls the constructor to create one.


    Listing 14.1 presents an example of a Singleton class called MySingletonClass.'
