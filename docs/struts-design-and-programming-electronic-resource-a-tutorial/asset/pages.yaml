  md: "# # Appendix A\n\n# # The Struts Configuration File\n\nA Struts application\
    \ must have at least one configuration file to store the application settings.\
    \ The default configuration file is struts-config.xml in the WEB-INF directory.\
    \ The file name and path to this XML document must be registered in the init-param\
    \ element inside the servlet element that describes the Struts action servlet.\
    \ The init-param element must contain two elements:\n\n+   * param-name: Specifies\
    \ a logical name for the configuration file.\n* param-value: Specifies the path\
    \ to the configuration file, relative to the application directory.\n\nHere is\
    \ the standard servlet element that describes the action servlet.\n\n```\n<servlet>\n\
    \  <servlet-name>action</servlet-name>\n  <servlet-class>\n    org.apache.struts.action.ActionServlet\n\
    \  </servlet-class>\n  <init-param>\n    <param-name>config</param-name>\n   \
    \ <param-value>WEB-INF/struts-config.xml</param-value>\n  </init-param>\n  <load-on-startup>1</load-on-startup>\n\
    </servlet>\n```\n\nThe init-param element in the code above specifies the default\
    \ module. If an application has other modules than the default, you must have\
    \ an additional init-param element for each additional module. The logical name\
    \ for a module must start with config.\n\nThe content of a Struts 1.2 configuration\
    \ file, which is an XML document, can be verified against the struts-config_1_2.dtd\
    \ document type descriptor (DTD). This file is included in the struts.jar file."
  merge: -1
