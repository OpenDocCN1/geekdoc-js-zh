  md: "# Chapter 1: Model 2 and Struts\n\n```\n{\n}\n```\n\n```\n}\n```\n\nThe **process**\
    \ method processes all the incoming requests. It starts by obtaining the action\
    \ information from the request parameter:\n\n```\nString action = request.getParameter(\"\
    action\");\n```\n\nThe value of **action** can be either **displayAddProductForm**\
    \ or **saveProduct**.\n\nThe **process** method then continues by doing two things:\n\
    \n+   1. Perform an action.\n2. Forward the request to the appropriate view (JSP).\n\
    \nThe code that determines what action to perform is in the following **if** block:\n\
    \n```\n// execute an action\nif (action.equals(\"displayAddProductForm\")) {\n\
    \  // there is nothing to be done\n}\nelelse if (action.equals(\"saveProduct\"\
    )) {\n  // read and save the product into the database\n  ProductTO product =\
    \ new ProductTO();\n  product.setProductName(\n    request.getParameter(\"productName\"\
    ));\n  product.setDescription(\n    request.getParameter(\"description\"));\n\
    \  product.setPrice(request.getParameter(\"price\"));\n}\n\n// code for persisting\
    \ the Product object goes here\nrequest.setAttribute(\"product\", product);\n\
    }\n```\n\nThere is nothing to be in the **if** block if the action is **displayAddProductForm**.\
    \ If the action is **saveProduct**, the controller servlet creates a **ProductTO**\
    \ object and populates it using the request parameter values. It then assigns\
