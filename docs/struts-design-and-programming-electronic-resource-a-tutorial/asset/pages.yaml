    # The link Tag


    The link tag rendered is a hyperlink that references a Struts action or a resource
    external to the current application. The hyperlink can include one or many request
    parameters so that you can pass values to the referenced action. On top of that,
    the action attribute automatically includes the jsessionid request parameter for
    session tracking.


    The link tag''s attributes are listed in Table 3.14. You must specify exactly
    one of the action attribute, the forward attribute, the href attribute, the linkName
    attribute or the page attribute.


    | Attribute | Description | Possible Value(s) |

    | action | Specifies a destination Struts action | string |

    | module | The prefix of a module that contains the destination action. The action
    attribute must be specified for this attribute to have an effect. An empty value
    implies the default module. | string |

    | anchor | Optional anchor tag (#xxx) to be added to the generated hyperlink.
    Do not include the # character. | string |'
