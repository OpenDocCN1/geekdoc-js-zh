  md: '# # Chapter 21

    Decorating Request Objects


    When the Servlet specification first introduced filters, it was very exciting.
    A filter is a Java object that intercept the HttpServletRequest object before
    reaching a servlet''s service method and the HttpServletResponse object after
    control leaves the service method. You can do useful things with filters, such
    as verifying user input, compressing Web contents, etc. Nevertheless, many other
    forms of creativity using filters are hindered by the fact that you cannot change
    the request parameters of an HttpServletRequest object, because the java.util.Map
    that contains parameters in an HttpServletRequest object is immutable, i.e. it
    cannot be changed. This greatly reduces the usefulness of filters. At least half
    of the times, you wish you could change the object you are applying your filter
    to. Wouldn''t it great if you could, for example, write a filter that trims user
    input before the HttpServletRequest object reaches the Struts servlet. This way,
    you would not need to trim them in your action forms'' validate methods.


    Fortunately, using the Decorator design pattern can change the behaviors of an
    immutable object, even though you cannot change the object itself. This chapter
    deals with this pattern and provides an example of a filter that trims user input.


    # # The Decorator Pattern


    With inheritance, you can change the behavior of an object by extending the object''s
    class and override the methods whose behaviors you want to change. However, inheritance
    is powerless if the object in question is constructed by another subsystem in
    your application, such as an action factory or a servlet container.'
