    | Mexico | MX |

    | Switzerland | CH |

    | Taiwan | TW |

    | United Kingdom | GB |

    | United States | US |


    Table 11.2: Examples of ISO 3166 Country Codes


    An internationalized application stores its textual elements in a separate properties
    file for each locale. Each file contains key/value pairs, and each uniquely identifies
    a locale-specific object. Keys are always strings, and values can be strings or
    any other type of object. For example, to support American English, German, and
    Chinese, you will have three properties files, all of which have the same keys.


    Here is the English version of the properties file. Note that it has two keys:
    greetings and farewell:


    ```

    greetings = Hello

    farewell = Goodbye

    ```


    The German version would be as follows:


    ```

    greetings = Hallo

    farewell = Tschuß

    ```


