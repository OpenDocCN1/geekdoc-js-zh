    # Functions


    In addition to custom actions, JSTL 1.1 defines a set of standard functions you
    can use from EL expressions. Unfortunately they are not available in JSTL 1.0.
    These functions are grouped in the function tag library. To use the functions,
    you must use the following taglib directive on top of your JSP.


    ```

    <@taglib uri="http://java.sun.com/jsp/jstl/functions"

    ```'
