  md: '# # Chapter 11

    Message Handling and Internationalization


    Message handling is an important task in application development. For example,
    it is almost always required that an application is able to display error messages
    that are easy to understand. Also, nowadays it is often a requirement that an
    application can be able to “speak” many languages. A technique for developing
    applications that support multiple languages and data formats without having to
    rewrite the programming logic is called internationalization. Internationalization
    is abbreviated i18n because the word starts with an *i* and ends with *n*, and
    there are 18 characters between the first *i* and the last *n*. In addition, localization
    is the technique of adapting an internationalized application to support a specific
    locale. A locale is a specific geographical, political, or cultural region. An
    operation that takes a locale into consideration is said to be *locale-sensitive*.
    For example, displaying a date is locale-sensitive because the date must be in
    the format used by the country or region of the user. The 15th day of November
    2005 is written as 11/15/2005 in the US, but written as 15/11/2005 in Australia.
    Localization is abbreviated l10n because the word starts with an *l* and ends
    with *n* and there are 10 letters between them.


    With internationalization, you can change the visual text in an application quickly
    and easily. Java has built-in supports for this feature that enables an application
    to change language without the need for recompilation.


    Struts makes use of this feature and was designed to support internationalization
    from the beginning. For example, the message tag in the Struts Bean Tag Library
    is capable of selecting a message in the correct language. However, since it is
    a recommendation to use JSTL instead of Struts tag libraries, I will also discuss
    the internationalization-related tags in JSTL.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Working with Locales in Struts


    A locale is a specific geographical, political, or cultural region. There are
    three main components of a locale: language, country, and variant. The language
    is obviously the most important part; however, sometimes the language itself is
    not sufficient to differentiate a locale. For example, the German language is
    spoken in countries such as Germany and Switzerland. However, the German language
    spoken in Switzerland is not exactly the same as the one used in Germany. Therefore,
    it is necessary to specify the country of the language. As another example, the
    English language used in the United States is not exactly the same as the one
    spoken in England. For example, it''s *favor* in the United States, but *favour*
    in England.


    The variant argument is a vendor- or browser-specific code. For example, you use
    WIN for Windows, MAC for Macintosh, and POSIX for POSIX. If there are two variants,
    separate them with an underscore, and put the most important one first. For example,
    a Traditional Spanish collation might construct a locale with parameters for the
    language, the country, and the variant as **es, ES, Traditional_WIN**, respectively.


    The language code is a valid ISO language code. Table 11.1 displays some of the
    country codes. The complete list can be found at http://www.w3.org/WAI/ER/1G/ert/iso639.htm.


    | Code | Language |

    |---||

    | de | German |

    | el | Greek |

    | en | English |

    | cs | Spanish |

    | fr | French |

    | hi | Hindi |

    | it | Italian |

    | ja | Japanese |

    | nl | Dutch |

    | pt | Portuguese |

    | ru | Russian |

    | zh | Chinese |


    Table 11.1: Some examples of ISO 639 language codes'
  merge: -1
