  md: "# Hiding Resources\n\nAn observant reader would notice that all access should\
    \ go through the Struts action servlet and JSPs should not be accessible directly.\
    \ Protecting JSPs from direct access can be easily achieved in several ways.\n\
    \n+   1. By placing the resources, i.e. JSPs, under WEB-INF, which makes the JSPs\
    \ not accessible by typing their URLs. This way, the JSPs can only be displayed\
    \ if they are a forward destination from the action servlet. However, you have\
    \ also noticed that throughout this book all JSPs are not in the WEB-INF directory.\
    \ This is because some containers (such as WebLogic) will not be able to forward\
    \ control to a JSP under WEB-INF. Storing JSPs in WEB-INF may also change how\
    \ other resources, such as image and JavaScript files, can be referenced from\
    \ the JSPs.\n2. By using a filter to protect the JSPs outside the WEB-INF directory.\
    \ It is easy to implement such a filter. All you need to do is apply the filter\
    \ so that it will redirect to a user page if the URL ends with .jsp. However,\
    \ this is not as easy as the trick explained in Step 3.\n3. By using the security-constraint\
    \ element in the web.xml file to protect all JSPs without providing a legitimate\
    \ role to access them. For example, in both app1a and app1b, you have two security-constraint\
    \ elements in the web.xml file. One to prevent all JSPs from being accessed directly,\
    \ another to protects.\n\n```\n<security-constraint>\n<web-resource-collection>\n\
