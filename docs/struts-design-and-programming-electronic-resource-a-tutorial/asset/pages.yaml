    # Using validwhen


    The most complex default validator comes with the Validator plugin validwhen.
    You use this validator to validate a field against another field. For example,
    when prompting the user to enter a new password, you may want the password to
    be entered twice to make sure there is no mistyping. Or, you may require that
    a field is required only if another field is not empty.


    The app05h application modifies app05f to use validwhen. The HTML form contains
    two password elements. Validation is successful if the values of both password
    elements match.


    As usual, you write your validation rules using the form element. The validation
    rules in app05h has two fields, password and password2. The validation of the
    fields is defined in the validation.xml file in Listing 5.16.


