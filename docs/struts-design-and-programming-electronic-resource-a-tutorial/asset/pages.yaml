  md: '# Summary


    element specifies the URL pattern to which the EL deactivation will apply.

    The el-ignored element must be set to true.


    As an example, here is how you deactivate the EL evaluation in a JSP named noEl.jsp.


    ```

    <jsp-config>

    <jsp-property-group>

    <url-pattern>noEl.jsp</url-pattern>

    <el-ignored>true</el-ignored>

    </jsp-property-group>

    </jsp-config>

    ```


    You can also deactivate the EL evaluation in all the JSPs in an application by
    assigning *jsp to the url-pattern element, as in the following:


    ```

    <jsp-config>

    <jsp-property-group>

    <url-pattern>*.jsp</url-pattern>

    <el-ignored>true</el-ignored>

    </jsp-property-group>

    </jsp-config>

    ```


    The EL evaluation in a JSP will be deactivated if either the isIgnored attribute
    of it is true or its URL matches the pattern in the jsp-property-group element
    whose el-ignored subset is set to true. For example, if you set the page directive''s
    isIgnored attribute of a JSP to false but its matches the pattern of JSPs whose
    EL evaluation must be deactivated in the deployment descriptor, the EL evaluation
    of page will be deactivated.


    In addition, if you use a deployment descriptor that is compliant to Servlet 2.3
    or earlier, the EL evaluation is already disabled by default, even though you
    are using a JSP 2.0 container.


