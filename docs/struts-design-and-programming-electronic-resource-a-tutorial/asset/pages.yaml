  md: '# # Chapter 20

    Early HttpSession Invalidation


    HttpSession objects are useful, however they also consume memory. Therefore, when
    an HttpSession object is no longer needed, it should be destroyed by calling its
    invalidate method. Many programmers provide a link for users to log out, but few
    use it. Often, they simply close the browser when they are done with an application.
    Waiting for HttpSession to die naturally will cause more memory to be used longer
    that it needs be. This chapter discusses a technique that forces HttpSession invalidation
    when the browser is closed.


    # ## HttpSession Invalidation in Struts


    Destroying an HttpSession object in Struts application is not as simple as calling
    the invalidate method on the HttpSession object. This is because even a simple
    forward to a JSP will create a new HttpSession object.


    Let''s begin by reviewing some facts.


    By default, every action invocation in Struts is guaranteed to create an HttpSession
    object, if there is none already for it, even if the process has not instantiated
    an action class yet (in the case of action form failing to validate). This is
    because Struts needs to store the user''s locale information in an HttpSession
    object. For those interested, check the process and processLocation methods in
    the org.apache.struts.action.RequestProcessor class. Therefore, there is also
    no point in using the directive <% page session="false%> in a JSP if the JSP is
    a forward destination of a Struts action.


    Then, how do you destroy an HttpSession object? By calling invalidate on the HttpSession
    object and prevent Struts from creating a new HttpSession instance.'
  merge: -1
  pgno: 384
