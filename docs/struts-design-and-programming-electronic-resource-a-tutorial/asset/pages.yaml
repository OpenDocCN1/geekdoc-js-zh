  md: '# Chapter 15

    The Persistence Layer


    At some stage, application data needs to be persisted or saved to secondary storage.
    Struts, application data is encapsulated in Java objects. For example, user input
    is used to populate an action form (which is a Java object) upon form submission,
    business methods accept transfer objects as arguments, and custom tags are designed
    to manipulate JavaBeans.


    The challenge of storing data in Struts applications, therefore, is to effectively
    persist Java objects. Several methods are available, including storing them into
    files, relational databases, XML documents, and so on. Of these, persisting data
    to a relational database is the most reliable and the most popular. In addition,
    object-to-relational mapping tools can be purchased off the shelf to help Java
    programmers persist their objects.


    Without a mapping tool, you have other options in hand. These include the Data
    Access Object (DAO) pattern, Java Data Objects (JDO), and the open source Hibernate
    project. Of these, the DAO pattern in the easiest to learn and is sufficient in
    most applications. This chapter will show you how to implement the DAO pattern
    for data persistence.


    Also note that many parts of an application may need to persist objects, a good
    design dictates that you create a dedicated layer for data persistence. This persistence
    layer provides methods that can be called by any component that needs to persist
    objects. In addition to simplifying your application architecture (because now
    object persistence is handled by only one component), the persistence layer also
    hides the complexity of accessing the relational database. The persistence layer
    is depicted in Figure 15.1.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# 308 Chapter 15: The Persistence Layer


    ![](img/b333f2b2346b8836cf06378200dc8816_317_0.png)


    Figure 15.1: The persistence layer


    The persistence layer provides public methods for storing, retrieving, and manipulating
    value objects, and the client of the persistence layer does not have to know how
    the persistence layer accomplishes this. All they care is their data is safe and
    retrievable.


    # The DAO Pattern


    With this pattern, you write a class for each type of object you need to persist.
    For example, if your application needs to persist three types of transfer objects—ProductTO,
    CustomerTO, and OrderTO—you need three DAO classes, each of which takes care of
    an object type. Therefore, you would have the following classes: ProductDAO, CustomerDAO,
    and OrderDAO. The DAO suffix at the end of the class name indicates that it is
    a DAO class. It is a convention that you should follow unless you have compelling
    reasons for not doing so.


    A typical DAO class takes care of the addition, deletion, modification, and retrieval
    of an object, and the searching for those objects. For example, ProductDAO class
    may support the following methods:


    ```

    void addProduct(ProductTO product)

    void updateProduct(ProductTO product)

    void deleteProduct(int productId)

    ProductTO getProduct(int productId)

    List findProducts(SearchCriteria searchCriteria)

    ```


    There are many variants of the DAO pattern. You will learn the three most common
    variants: from the most basic to the most flexible.'
