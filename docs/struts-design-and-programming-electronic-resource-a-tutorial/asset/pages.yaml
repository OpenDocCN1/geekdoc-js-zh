    # The column Tag


    The column displays the property of the row being iterated over by the enclosing
    table tag. You specify the row''s property in the property attribute and the column
    title in the title attribute. For example, the following column displays the customer
    property of the collection customerList specified by the enclosing table tag is
    “Customer Name”.


    ```

    <display:table name="customerList" id="customer"

    pagesize="5">

    <display:column property="customerName" title="Customer Name"/>

    ```


    Alternatively, the column tag can enclose other tags. For instance, the following
    column tag nests the HTML Library''s link tag to display hyperlinks in a table
    column.


    ```

    <display:column>

    <html:link action="/getCustomer" paramName="customer"

    paramId="customerId" paramProperty="id">update</html:link>

    </display:column>

    ```


    Table 18.2 lists some the more important attributes of the column tag.'
