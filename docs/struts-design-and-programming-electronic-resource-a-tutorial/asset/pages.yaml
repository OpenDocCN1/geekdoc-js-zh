  md: "# 226 Chapter 9: The Logic Tag Library\n\nFor example, the following present\
    \ tag checks if the current HttpServletRequest object has a parameter named userId,\
    \ and prints \"User Id Found\" if it exists. \n\n```\n<logic:present parameter=\"\
    userId\">\nUser Id Found\n</logic:present>\n```\n\n# Using equal, notEqual, lessThan,\
    \ lessEqual, greaterThan, greaterEqual\n\nThese tags are self-explanatory. To\
    \ use these tags you must include the value attribute and one of the following\
    \ attributes: cookie, header, parameter, name, or property. Note that if the specified\
    \ value is not present, no exception will be thrown. Therefore you don't need\
    \ to nest these tags in a present tag. If the value is not present, the comparison\
    \ fails.\n\nAs an example, the following greaterThan compares the value of the\
    \ cookie quantity is greater than 10. If the string is sent to the browser does\
    \ not exist or if its value is not numeric or if it is 10 or less than 10, nothing\
    \ will be sent to the browser.\n\n```\n<logic:greaterThan cookie=\"quantity\"\
    \ value=\"10\">\nOrders of more than 10 units are not allowed.\n</logic:greaterThan>\n\
    ```\n\nAs another example, the following equal tag compares the value of the cookie\
    \ named loggedIn. If the comparison evaluates to true, the string inside the tags\
    \ is displayed.\n\n```\n<logic:equal cookie=\"loggedIn\" value=\"true\">\nYou\
    \ have logged in.\n</logic:equal>\n```\n\n# The Substring Matching Tags\n\nSubstring\
    \ matching tags can be used to verify if a value is an exact match of the specified\
    \ value, or if it starts or ends with the specified value. Table 9.2 lists the\
    \ Logic Tag Library's tags that fall into this category."
  merge: -1
