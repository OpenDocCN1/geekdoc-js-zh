  md: '# 266 Chapter 12: The Tiles Framework


    Note


    In Tiles vocabulary, an included file is called a tile. A tile can recursively
    contain other tiles.


    # Using JSP Definition Files


    The JSPs in the app12a application must pass four values: pageTitle, header, body,
    and footer, using the put tag. As you can see, the values of header and footer
    are the same for all JSPs. How do you avoid writing the same put tags in the JSPs
    in the whole application? By writing a definition page.


    A definition page is a layer between a layout page and all JSPs using the layout.
    The benefit of using a definition page is that you can define values that otherwise
    have to be defined in referencing JSPs.


    By analogy, a layout page is like a Java interface and a definition page is a
    base class that provides methods'' implementations of the interface. Any Java
    class that needs to implement the interface can extend the base class instead,
    so that the class does not need to implement a method unless it needs to override
    it. By the same token, a JSP can reference a definition page instead of a layout
    JSP. The diagram in Figure 12.2 provides a comparison between Java inheritance
    and ''Tiles'' layout and definition pages.


    There are two types of definition pages: JSP and XML. This section explains how
    you can write the first type and the next section will discuss the second type.


    The app12b application modifies app12a to use a definition file in conjunction
    with the same layout JSP presented in Listing 12.1. The definition page is named
    myDefinition.jsp page and is given in Listing 12.4.'
  merge: -1
  pgno: 275
- img_proc: true
