  md: "# Transfer Objects\n\nThe concept of transfer objects in J2EE is simple and\
    \ easy. A transfer object contains only data elements and no business logic. By\
    \ contrast, a business object has no business methods and data elements.\n\nThe\
    \ main purpose of using transfer objects is for efficient data transfer across\
    \ tiers, e.g. from the presentation tier to the business tier and vice versa.\
    \ Suppose you have a business method called `insertOrder(Order)` in an Enterprise\
    \ JavaBeans (EJB) that you call remotely from a servlet. The Order object argument\
    \ must travel from the presentation tier to the business tier (probably running\
    \ in a different Java Virtual Machine). Having the Order object as a transfer\
    \ object will result in a more efficient method call. The insertOrder method is\
    \ only interested in the values of the order (such as product id, quantity, consumer\
    \ id, etc) in the Order object anyway, and will never need to call a business\
    \ method on it. Therefore, the Order class does not need business methods.\n\n\
    A transfer object must be serializable, i.e. its class must implement the java.io.Serializable\
    \ interface. There are two reasons for this: first, objects that are transferred\
    \ in a remote method invocation (RMI) call must be serializable and the EJB technology\
    \ uses RMI as the communication protocol between an EJB and its client. Consequently,\
    \ transfer objects that will be passed to an EJB method must be serializable.\
    \ The second reason has to do with the fact that servlet containers may serialize\
    \ their HttpSession objects to secondary storage when the memory is getting full.\
    \ Since transfer objects are often stored in HttpSession objects, transfer objects\
    \ must be serializable for the object serialization process to be successful.\n\
    \nA transfer object can expose its data values in one of two ways:\n\n+   1. By\
    \ exposing the data elements as public fields:\n\n```\npublic class Order implements\
    \ java.io.Serializable {\n    public String productId;\n    public int quantity;\n\
    \    ...\n\n```\n\n> ¹ For details, check http://java.sun.com/developer/onlineTraining/rmi/RMI.html#SerializingRemoteObjects"
  merge: -1
  pgno: 23
- img_proc: true
  md: "```\n}\n```\n\n2. By using properties, i.e. a data element is represented by\
    \ a private field which is accessed by a public method and a public set method:\n\
    \n```\npublic class Order implements java.io.Serializable {\n  private String\
    \ productId;\n  private int quantity;\n  ...\n\n  public String getProductId()\
    \ {\n    return productId;\n  }\n  public void setProductId(String productId)\
    \ {\n    this.productId = productId;\n  }\n  public int getQuantity() {\n    return\
    \ quantity;\n  }\n  public void setQuantity(int quantity) {\n    this.quantity\
    \ = quantity;\n  }\n  ...\n}\n```\n\nBoth work well, but the second approach is\
    \ the only option if you want to use JSP Standard Tag Library (JSTL) or Struts\
    \ custom tags to access transfer objects referenced by scoped variables. This\
    \ is because JSTL and many other custom tags are designed to work with JavaBeans.\
    \ The Order class in the second approach is in fact a JavaBean that implements\
    \ java.io.Serializable.\n\nTo make transfer objects more recognizable, it is good\
    \ practice to add the suffix TO to their class names, e.g. OrderTO, ConsumerTO,\
    \ etc.\n\nAnother related term is \"value object\", which by definition is an\
    \ object that only contains value or data elements. A transfer object is therefore\
    \ also a value object. Both value objects and transfer objects are often used\
    \ interchangeably even though the purposes of having them can be different."
