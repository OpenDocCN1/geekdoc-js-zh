    # The startsWith Function


    The startsWith Function tests whether a string starts with the specified prefix.

    The syntax is as follows:


    ```

    startsWith(string, prefix)

    ```


    For instance, the following EL expression returns true:


    ```

    ${fn:startsWith("Stella Cadente", "St")}

    ```


    # The substring Function


    The substring function returns a substring from the specified zero-based

    begin index (inclusive) to the specified zero-based end index. The syntax is as

    follows:


    ```

    substring(string, beginIndex, endIndex)

    ```


    For example, the following EL expression returns “Stella Cadente”.


    ```

    ${fn:substring("Stella Cadente", 0, 4)}

    ```


    # The substringAfter Function


    The substringAfter function returns the portion of a string after the first

    occurrence of the specified substring. Its syntax is as follows:


    ```

    substringAfter(string, substring)

    ```'
