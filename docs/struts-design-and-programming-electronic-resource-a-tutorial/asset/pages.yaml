  md: '# The form Tag


    The form tag generates an HTML form element. The most important attribute of this
    tag is action, which specifies the Struts action to be invoked upon the form submission.
    By default, the form method is post. The action attribute must specify the path
    of an action defined in the Struts configuration file. In addition, the name attribute
    of the corresponding action element in the Struts configuration file must refer
    to an action form.


    The list of the form tag''s attributes is given in Table 3.4.


    | Attribute | Description | Possible Value(s) |

    |---|---|---|n| action* | The action to which this form will be submitted. The
    value of this attribute must be the path to a Struts action that is described
    in the Struts configuration file. | string |

    | acceptCharset | The list of character encodings for input data that the server
    should accept. | string |

    | enctype | The content encoding to be used when submitting this form, if it is
    post. By default, the value of this attribute is application/x-www-form-urlencoded.
    For use uploading files, this attribute must be set to multipart/form-data. File
    upload is discussed in Chapter 17. | string |

    | focus | The field name that will be given the initial focus when the form is
    rendered in the browser The form tag achieves this by using a JavaScript function.
    | string |

    | focusIndex | Similar to the focus attribute, but if the initial focus is to
    be given to a field in a field array, such as a radio group. The focusIndex attribute
    specifies the index of the element to receive the initial focus. | string |

    | method | The HTTP method that will be used to submit this request. By default,
