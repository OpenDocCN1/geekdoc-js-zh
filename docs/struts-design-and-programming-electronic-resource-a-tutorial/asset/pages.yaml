    # The rewrite Tag


    The rewrite tag produces a label that resembles a URL. In fact, the rewrite tag
    has attributes similar to the link tag. Instead of a hyperlink, the rewrite tag
    generates a relative URL such as:


    /app0d/displayAddProductForm.do;jsessionid=70DA991D2F6A53532E6D67557D6C94?firstName=John&lastName=Doe


    The rewrite tag could be useful in the link element or if you are writing a JavaScript
    function that needs to reference a dynamic resource. For the list of attributes
    of the rewrite tag, consult Table 3.14.


    # The frame Tag


    The frame generates an HTML frame inside a frameset. The frame tag is very similar
    to the link tag, you can use it to construct a hyperlink that references a Struct
    action or an external resource. In particular, you can use the following attributes
    to specify the base URL: action, forward, href, or page.


    Just like the link tag, the URL constructed by the frame can also contain query
    parameters. You add one or more query parameters by employing the same technique
    and using the same attributes as you would with the link tag.'
