  md: 'If you are saving the uploaded file in the application directory, the ServletContext
    interface’s getRealPath method is useful. For example, the following code returns
    the absolute path of the application directory.


    sservletContext.getRealPath("/");

    The following code returns the physical path to the WEB-INF directory of the application:


    servletContext.getRealPath("/WEB-INF");

    Note that if your application is deployed as a WAR or a JAR, you cannot save files
    in the application directory, because the servlet container deems to be the application
    directory is actually a WAR or a JAR file.


    # File Upload in Struts


    Struts, uploading one or multiple files is very easy. Basically, you are required
    to do three simple tasks:


    +   1. Use the HTML Tag Library’s file tag in a form on your JSP.

    2. Create an action form. For each uploaded file, create a property of org.apache.struts.upload.FormFile.

    3. Retrieve the FormFile(s) in your action class and perform the necessary action.


    This section will discuss the file tag and the FormFile class, as well as present
    an application for uploading files.


    # The file Tag


    The HTML Tag Library’s file tag will be rendered as the following input element
    in the browser:

    <input-type="file" name="propertyName/>


    # The FormFile Class


    An uploaded file is represented by the org.apache.struts.upload.FormFile class.
    It is mandatory that you have good understanding of this class. The three most
    important methods are getFileData, getFileName, and getFileSize.'
