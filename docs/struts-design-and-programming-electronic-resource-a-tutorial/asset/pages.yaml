  md: '# Introduction


    +   - No Java code in JSPs, all business logic should reside in Java classes called
    action classes.

    - Use the Expression Language (if you are using JSP 2.0) or JSTL in JSPs to access
    business model.

    - Little or no writing of custom tags (because they are hard to code).


    # Overview of the Chapters


    This book is for the reader who wants to learn how to develop Struts applications.
    However, this book does not stop here. It takes the extra mile to teach how to
    design effective Struts applications. As the title suggests, this book is designed
    as a tutorial, to be read from cover to cover, written with clarity and readability
    in mind.


    The following is the overview of the chapters.


    Chapter 1, "Model 2 and Struts", explains the Model 2 architecture and provides
    two Model 2 applications. It also introduces Struts as a popular framework for
    rapidly building Model 2 applications.


    Chapter 2, "Input Validation with Action Forms", discusses one of the main features
    of Struts that helps with user input validation. Input validation is an important
    task in Web application development which includes checking if there is a value
    in a mandatory field, whether a date or a number was entered in the correct format,
    Struts action make input validation easy and enable applications to show error
    messages and redraw the previous field values without the need to write Java code.


    Chapter 3, "The HTML Tag Library", explains the tags in the HTML Tag Library,
    one of the core tag libraries that come with Struts. To make full use of Struts
    you should always use these tags to generate HTML forms and other HTML elements
    in your JSPs.


    Chapter 4, "Input Validation and Data Conversion", discusses input validation
    in detail. In addition, it deals with data conversion, a task that almost always
    precedes input validation. Three examples are presented and the utility class
    BeanUtils, from the Jakarta Commons project, is discussed.


    Chapter 5, "The Validator Plugin", discusses one of the most useful features in
    Struts, the Validator plugin. With this plugin you can validate user'
