  md: '# # Chapter 19

    Preventing Double Submits


    Double form submits normally happen by accident or by the user’s not knowing what
    to do when it is taking a long time to process a form. Some double submits have
    fatal consequences, some simply unpleasant. For instance, when submitting an online
    payment in which a credit card will be charged, the user may click the button
    for the second time if the server’s response time is too slow. This may result
    in his/her credit card being charged twice. Other less critical examples include
    forms that add a new product and doubly submitting these forms will cause a product
    to be added twice.


    Struts has built-in support for preventing double submits. It employs a technique
    that you can also find in other Web development technologies. This technique involves
    storing a unique token in the server and inserting a copy of the token into a
    form. When the form is submitted, the token is also sent to the server. The server
    application will compare the token with its own copy for the current user. If
    they match, form submission is considered valid and the token is reset. Subsequent
    (accidental) submits of the same form will fail because the token on the server
    have been reset.


    This chapter explains how to use Struts’ built-in feature for preventing double
    submits.


    # # Managing Tokens in Struts


    In Struts, a form submit always consists of at least two Struts actions, one for
    displaying the form and one for handling the user input. To prevent the user from
    submitting a form twice, you generate a token in the first action and store it
    in the HttpSession object as well as insert into the form a hidden field that
    encapsulates this token. In the second action, before processing the user-'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# 370 Chapter 19: Preventing Double Submits


    input, you compare the submitted token with the one in the HttpSession object.
    If both tokens are identical, you perform the intended operation. Otherwise, forward
    the user to an error page.


    The consequence of this is that you must have an action class for the action that
    sends the form. Other than that, preventing double submits is easy. In fact, the
    org.apache.struts.action.Action class provides you with the following methods:


    +   * saveToken. Generates a token and stores it in the HttpSession object. The
    signature of this method is as follows.


    ```

    protected void saveToken(

    javax.servlet.http.HttpServletRequest request)

    ```


    +   * resetToken. Destroys the saved token from the HttpSession object. The signature
    of this method is as follows.


    ```

    protected void

    resetToken(javax.servlet.http.HttpServletRequest request)

    ```


    +   * isValid. Checks if the submitted token and the one in the HttpSession object
    match. There are two overloads of this method:


    ```

    protected boolean

    isTokenValid(javax.servlet.http.HttpServletRequest request)

    protected boolean

    isTokenValid(javax.servlet.http.HttpServletRequest request,

    boolean reset)

    ```


    A value of true as the second argument to the second isValid overload will call
    the resetToken automatically.


