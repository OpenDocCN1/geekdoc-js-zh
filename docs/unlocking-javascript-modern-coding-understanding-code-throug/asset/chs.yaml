  \ = value;`\n\n正确答案：D) `const constantName = value;`\n\n解释：`const` 关键字在 JavaScript\
  \ 中用于声明常量，其值一旦赋值就无法更改。这与使用 `var` 或 `let` 声明的不同，后者的值可以重新赋值。\n\n使用哪种方法将 JSON 字符串解析为\
