  D) `Object.parse()`\n\n正确答案：C) `JSON.parse()`\n\n解释：`JSON.parse()` 用于将 JSON 字符串转换为\
  \ JavaScript 对象。\n\n`async` 在 JavaScript 中的作用是什么？\n\nA) 暂停执行\nB) 处理事件\nC) 声明函数\n\
  D) 执行\n\n正确答案：C) 声明函数\n\n解释：`async` 关键字用在函数之前，表示该函数返回一个 promise。\n\n在 JavaScript\
