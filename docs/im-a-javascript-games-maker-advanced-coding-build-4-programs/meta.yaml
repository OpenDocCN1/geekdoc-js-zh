    # GLOSSARY


    ![](img/2638ff15866c473a5b1b3f1de53c9951_33_0.png)


    **ANIMATION** Making objects in your program move around.


    **BROWSER** A program used to view web pages, such as Chrome or Internet Explorer.


    **BUG** An error in a program that stops it working properly.


    **DEBUG** To remove bugs (or errors) from a program.


    **ELEMENT** One of the objects making up a web page, such as a paragraph or image.


    **EVENT** Something that happens while the program is running, such as a mouse
    click or key press.


    **FUNCTION** A reusable section of code combining a number of commands.


    **HTML (HYPERTEXT MARKUP LANGUAGE)** The language used to build web pages.


    **JAVASCRIPT** A programming language used to make web pages interactive or to
    build simple games.


    **OVERLAPPING** When objects have collided but are not in exactly the same position.


    **PIXEL** A small dot on the screen, can be used as a unit of measurement.


    **PROPERTY** Information about the style of an element, such as its colour or
    size.


    **RANDOM NUMBER** A number picked by the computer that can''t be predicted.


    **TAGS** Special words in an HTML document, surrounded by angle brackets <> defining
    an element.


    **TEXT EDITOR** A program used to create and change code.


    **TIMER** An object that runs a function after a specified delay, or at a regular
    interval.


    **TWO DIMENSIONAL ARRAY** A list of lists used to represent a grid or table of
    data.


    **VARIABLE** A value used to store information in a program that can change.


    > ### BUGS & DEBUGGING


    When you find your code isn''t working as expected, stop and look through each
    line of code you have put in. Here are some things to check:


    - Check you have spelt the commands correctly.

    - Check you have used the correct case (capitals and lower case).

    - Check you haven''t missed any quotes.

    - Check you have closed tags correctly.

    - If images aren''t showing, check filenames have been typed accurately.

    - If images aren''t moving, check you have set position:absolute.

    - Make sure you have used the correct style of brackets and other symbols.


    ![](img/2638ff15866c473a5b1b3f1de53c9951_33_1.png)


    <30>'
  - '[PAGE 34]


    # # COMMAND LIST


    ### JAVASCRIPT COMMANDS

    **alert("Hello");** – shows "Hello" as a message in a pop up box.

    **var score=0;** – defines a variable called score.

    **var gameTimer=window.setInterval(myFunction, 1000);** – runs a function called
    **myFunction** every second.

    **clearInterval(gameTimer);** – stops the timer called **gameTimer**.

    **function gameOver();** – defines a function called **gameOver()**.

    **document.getElementById("dog")** – selects an element on the page.

    **Math.random()** – creates a random number between 0 and 1.

    **Math.round()** – rounds a decimal to the nearest whole number.

    **location.reload();** – reloads a page to restart the JavaScript (and the game).


    ### HTML ELEMENTS

    **<html>...</html>** – starts and ends the HTML file.

    **<script>...</script>** – starts and ends the script section.

    **<img>** – tags an image, such as a photo or piece of clipart.

    **<p>...</p>** – tags a paragraph or line of text.

    **<body>...</body>** – starts and ends the main body of the page, effectively
    the background of your program.


    ![](img/2638ff15866c473a5b1b3f1de53c9951_34_0.png)


    ### EVENTS

    **onclick** – the mouse has been clicked.

    **onmousedown** – the mouse has been pressed down (happens before click and mouse
    up).

    **onmouseup** – the mouse button has been released.

    **onkeydown** – a key has been pressed on the keyboard.


    ### TIPS TO REDUCE BUGS

    * If you are making your own web page, spend time planning it before you start.

    * Practise debugging! Make a very simple web page and get a friend to change one
    line of code while you’re not looking. Can you fix it?

    * When things are working properly, spend time looking through your code so you
    understand each line. To be good at debugging, you need to understand what each
    line of your code does and how your code works.


    ### STYLE PROPERTIES

    **position:absolute** – allows an element to be moved around by changing left
    and top properties.

    **left** – sets how far across the screen an element (such as an image) is.

    **top** – sets how far down from the top of the screen an element is.

    **height** – sets the height of an element, such as an image (eg 20px means 20
    pixels high).

    **width** – sets the width of an element, such as an image.

    **-webkit-transition** – sets how quickly an element changes its properties.'
