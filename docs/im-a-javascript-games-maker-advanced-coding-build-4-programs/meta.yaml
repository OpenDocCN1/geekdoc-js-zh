  md: '# ROCK STORM


    This game is a simple side scrolling game: rocks will move across the screen from
    the right, towards a spaceship, controlled by the player. Pressing the **up**
    and **down** arrows will allow the spaceship to avoid the rocks. Each time the
    rocks move, a function will check if they have hit the spaceship. The score will
    be stored in a variable, and will increase each time the spaceship avoids a rock.
    When you play the game, maximise your screen so the game is bigger and it is easy
    to avoid the rocks. The complete code for the game is listed on page 23.


    # STEP 1 – PLANNING


    The score is shown in an HTML paragraph element `<p>`.


    Pressing the **up** and **down** arrow keys will make the spaceship move up and
    down the screen.


    A timer will move the rocks every 20 milliseconds.


    It then checks if any of the rocks have hit the spaceship by testing if they overlap
    it. We will create a special function to deal with this test.


    Click **OK** to play again or cancel.


    Variables store the score – the amount the spaceship will be moving up or down
    – and the maximum speed of the rocks.


    If the spaceship is hit by one of the rocks then the game is over.


    # STEP 2 – FIND SOME IMAGES


    +   1. Find an image of a spaceship to use. It needs to be saved into the same
    folder as your HTML file.

    2. Search the internet for spaceship clipart to use.

    3. Right-click one image.

    4. Click **Save Image As...**

    5. Navigate to your **Documents** folder then click **Save**.

    6. Now repeat this step but search for **space rock** clipart to use.'
