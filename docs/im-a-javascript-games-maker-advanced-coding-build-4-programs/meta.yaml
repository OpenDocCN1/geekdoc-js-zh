    ![](img/2638ff15866c473a5b1b3f1de53c9951_20_0.png)\n\n![](img/2638ff15866c473a5b1b3f1de53c9951_20_1.png)\n\
    \n![](img/2638ff15866c473a5b1b3f1de53c9951_20_2.png)\n\n## ROCK STORM\n\nThis\
    \ game is a simple side scrolling game: rocks will move across the screen from\
    \ the right, towards a spaceship, controlled by the player. Pressing the **up**\
    \ and **down** arrows will allow the spaceship to avoid the rocks. Each time the\
    \ rocks move, a function will check if they have hit the spaceship. The score\
    \ will be stored in a variable, and will increase each time the spaceship avoids\
    \ a rock. When you play the game, maximise your screen so the game is bigger and\
    \ it is easy to avoid the rocks. The complete code for the game is listed on page\
    \ 23.\n\n## STEP 1 – PLANNING\n\n- The score is shown in an HTML paragraph element\
    \ `<p>`.\n- Pressing the **up** and **down** arrow keys will make the spaceship\
    \ move up and down the screen.\n- A timer will move the rocks every 20 milliseconds.\n\
    - It then checks if any of the rocks have hit the spaceship by testing if they\
    \ overlap it. We will create a special function to deal with this test.\n- Click\
    \ **OK** to play again or cancel.\n- Variables store the score – the amount the\
    \ spaceship will be moving up or down – and the maximum speed of the rocks.\n\
    - If the spaceship is hit by one of the rocks then the game is over.\n\n## STEP\
    \ 2 – FIND SOME IMAGES\n\n1. Find an image of a spaceship to use. It needs to\
    \ be saved into the same folder as your HTML file.\n2. Search the internet for\
    \ spaceship clipart to use.\n3. Right-click one image.\n4. Click **Save Image\
    \ As...**\n5. Navigate to your **Documents** folder then click **Save**.\n6. Now\
    \ repeat this step but search for **space rock** clipart to use.\n\n## STEP 3\
    \ – START A NEW FILE\n\nStart by typing in the HTML for the game. Add code for\
    \ the body, four images and a paragraph for the score.\n\n```\n<html>\n<body style=\"\
    background-color:#8060AA\">\n    <img id=\"ship\" style=\"position:absolute; width:100px;\
    \ left:50px;\" src=\"spchp.png\">\n    <img id=\"rock1\" style=\"position:absolute;\
    \ width:100px; left:-200px;\" src=\"rock.png\">\n    <img id=\"rock2\" style=\"\
    position:absolute; width:100px; left:-200px;\" src=\"rock.png\">\n    <img id=\"\
    rock3\" style=\"position:absolute; width:100px; left:-200px;\" src=\"rock.png\"\
    >\n    <p id=\"scoreTB\" style=\"position:absolute; color:yellow; font-size:20px;\
    \ font-family:Arial\">Score: 0</p>\n</body>\n```\n\n## STEP 4 – SAVE YOUR CODE\n\
    \n- Click File > Save and type rocks.html as the filename.\n- Make sure you save\
    \ it in your Documents folder. Keep saving it every time you add any code.\n\n\
    ![](img/2638ff15866c473a5b1b3f1de53c9951_22_0.png)\n\n## STEP 5 – BEGIN THE SCRIPT\n\
    \nAt the start of the script we need to:\n- create the variables we need\n- tell\
    \ the program which function to run when keys are pressed\n- tell the program\
    \ which function to run when the page has been loaded and is ready\n- define a\
    \ function to make random numbers\n- define some functions to get and set co-ordinates.\n\
    \n![](img/2638ff15866c473a5b1b3f1de53c9951_22_1.png)\n\n```\n<script>\nvar score=0,\
    \ yChange=3, speed=5, gameTimer;\ndocument.onkeydown=handleKeys;\nonready=startUp();\n\
    function setLeft(id,x){document.getElementById(id).style.left=x+\"px\";}\nfunction\
    \ setTop(id,y){document.getElementById(id).style.top=y+\"px\";}\nfunction getLeft(id){return\
    \ document.getElementById(id).offsetLeft;}\nfunction getTop(id){return document.getElementById(id).offsetTop;}\n\
    function randomNumber(low,high){return(Math.floor(low+Math.random()*(1+high-low)));}\n\
    ```\n\n## HIT OR OVERLAPPING?\n\nIn the previous two games, we moved objects by\
    \ 50 or 100 pixels at a time. This made it easy to see if objects had hit each\
    \ other, after testing the x (how far from the left) and y (how far from the top)\
    \ co-ordinates. In a game where objects move by smaller amounts, they may hit\
    \ each other, but not have exactly the same co-ordinates. To test for this, we\
    \ need to see if the two objects are overlapping.\n\n![](img/2638ff15866c473a5b1b3f1de53c9951_23_0.png)\n\
    \n## STEP 6 – OVERLAPPING TEST CODE\n\n- We need a function that can test if any\
    \ of the three rocks are overlapping the ship. Rather than write separate code\
    \ for each rock, we will write a function that can test if any two objects are\
    \ overlapping. We will call these two imaginary objects ob1 and ob2. When we call\
    \ the function, we will tell it which two objects we want to use in the overlapping\
    \ test.\n\n```\n18 function isOverlapping(ob1,ob2){\n19   return ((getLeft(ob1)+100>getLeft(ob2))\n\
    \        && (getLeft(ob1)<getLeft(ob2)+100) &&\n        (getTop(ob1)+100>getTop(ob2))\
    \ &&\n        (getTop(ob1)<getTop(ob2)+100));}\n```\n\nAdd the code that returns\
    \ (sends back) a value after testing co-ordinates of the two objects. It returns\
    \ true if the objects are overlapping, or false if they are not. It assumes the\
    \ objects are 100 pixels high and 100 pixels wide.\n\n## STEP 7 – START UP\n\n\
    - Once the page has loaded in the browser the startUp function will be called.\
    \ The startUp function will set up a timer to move the rocks.\n\n```\n20 function\
    \ startUp(){\n21   gameTimer=window.setInterval(moveThings,20);\n22 }\n```\n\n\
    Start the gameTimer. This timer will call the function named moveThings every\
    \ 20 milliseconds (50 times a second)."
