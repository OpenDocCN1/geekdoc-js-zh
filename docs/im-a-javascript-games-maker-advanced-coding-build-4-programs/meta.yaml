    \n![](img/2638ff15866c473a5b1b3f1de53c9951_20_2.png)\n\n## 岩石风暴\n\n这个游戏是一个简单的横向卷轴游戏：岩石将从屏幕右侧向玩家控制的飞船移动。按下**上**和**下**箭头可以让飞船躲避岩石。每次岩石移动时，一个函数会检查它们是否撞到了飞船。分数将存储在一个变量中，并在每次飞船躲避岩石时增加。玩游戏时，请最大化屏幕，使游戏更大，更容易躲避岩石。游戏的完整代码在第23页列出。\n\
