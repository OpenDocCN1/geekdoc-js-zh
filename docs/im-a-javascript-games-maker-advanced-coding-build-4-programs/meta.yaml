  md: '# STEP 8 – MOVE THINGS


    ⇔ All three rocks need to move when the timer calls the **moveThings** function.
    We could do this by writing a section of code to move **rock1**, another to move
    **rock2** and a final section to move **rock3**. But this would require a lot
    of code and would mean we would need to change each section if we wanted to make
    the rocks faster or slower. Instead, we will use a loop to move each of the rocks
    in turn and check if it has hit the spaceship. Our loop will count from 1 to 3.
    The first time it will move **rock1**, then **rock2** and then **rock3**. To do
    this, we need to write a general bit of code that will move an imaginary rock,
    called **rock n**. We can give **n** a value between 1 and 3. This will be written
    as “rock” +n.


    ⇔ Finally, we need to move the spaceship up or down. To make the game harder,
    the spaceship won’t keep still.


    ```

    23 function moveThings(){

    24 for(var n=1; n<=3; n++){

    25 var x=getLeft("rock"+n);

    26 if(x<-100){

    27 x=window.innerWidth;

    28 y=randomNumber(0,window.innerHeight-100);

    29 setTop("rock"+n,y);

    30 score=score+10;

    31 document.getElementById("scoreTB").innerText="Score: "+score;

    32 }

    33 setLeft("rock"+n,x-speed-n);

    34 if(isOverlapping("rock"+n,"ship")){

    35 gameOver();

    36 }

    37 }

    38 var y=getTop("ship");

    39 if((y<=0) || (y>window.innerHeight-100)){yChange=-yChange;}

    40 setTop("ship",y+yChange);

    41 }

    ```


