  md: '# > UFO POWER UP


    In this game, the player has to move an alien spaceship (a UFO) as quickly as
    possible to get more energy. The player moves the UFO by pressing the arrow keys
    on the keyboard. The symbol for an atom (in green below) is used to represent
    the energy source. After the player has completed the task five times, the game
    stops and the time taken is shown. You can play the game against your friends
    and see who can complete it in the fastest time! The complete code for the game
    is listed on page 11.


    # STEP 1 - PLANNING


    ![](img/2638ff15866c473a5b1b3f1de53c9951_9_0.png)


    var score | gameTime | var atomX | var atomY | var ufoX | var ufoY

    Variables count the score, how long the game has been running and the co-ordinates
    of the atom and the UFO.


    The score is shown in an HTML paragraph element.

    A timer will count how long it takes to collect five atoms.

    Every time the UFO moves, we need to check if it has reached the atom. This is
    done by comparing their co-ordinates.


    When five atoms have been collected, the game ends and the time taken is shown.

    Pressing the arrow keys will change the ufoX and ufoY co-ordinates, making the
    UFO move around the screen.

    Click OK to play again.


    We will only need one atom image. Each time it has been collected by the UFO,
    we will move it to a new random place and increase the score by 1.


    # STEP 2 - FIND SOME PICTURES


    +   - Find an image of an atom to use, or find another symbol to represent energy
    in your game. It needs to be saved into the same folder as your HTML file.

    - Search for atom clipart to use.

    - Right-click one image.

    - Click Save Image As...

    - Navigate to your Documents folder then click Save.

    - Now repeat this step but search for ufo clipart to use.


    ![](img/2638ff15866c473a5b1b3f1de53c9951_9_1.png)'
