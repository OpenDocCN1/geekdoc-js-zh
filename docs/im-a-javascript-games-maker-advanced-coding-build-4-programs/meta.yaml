    \n## 步骤 3 – 开始一个新文件\n\n- 首先输入游戏的HTML代码。为主体、迷宫容器和玩家（幽灵，在我们玩游戏时会四处移动）添加代码。迷宫稍后会构建，但我们需要准备一个特殊的容器来装方块——即\
    \ **mazeHolder**。我们还将添加一个特殊的样式部分，其中包含每个迷宫方块的大小和颜色。\n\n```\n1 <html>\n2 <body style=\"\
    background-color:black\">\n3     <div id=\"mazeHolder\" style=\"position:absolute;\
    \ top:0; left:0;\"></div>\n4     <img id=\"player\" style=\"position:absolute;\
