  md: "SMOOTH ANIMATIONS\n\nWe will add a transition property to the image to make\
    \ it move smoothly. This means that the image's style properties (i.e. how far\
    \ it is from the left or top of the screen) will change gradually over a specific\
    \ amount of time.\n\n```\n-webkit-transition: all 0.5s;\n```\n\nAll of the style\
    \ properties will be affected.\n\nThe changes will be spread over 0.5 seconds\
    \ (half a second).\n\n# STEP 3 – START A NEW FILE\n\nStart by typing in the HTML\
    \ for the game, setting out the body, image and a paragraph for the score.\n\n\
    ```\nSublime Text\n\n1 <html>\n2 <body style=\"background-color:black\">\n3  \
    \ <img id=\"atom\" style=\"width: 50px; position:absolute\" src=\"atom.png\">\n\
    4   <img id=\"ufo\" style=\"width: 50px; position:absolute; top:0; left:0;\n \
    \  -webkit-transition: all 0.2s;\" src=\"ufo.png\">\n5   <p id=\"scoreTB\" style=\"\
    position:absolute; color:white;\">Score: 0</p>\n6   <p id=\"timeTB\" style=\"\
    position:absolute; right:50px; color:white;\"\n>Time: 0</p>\n7 </body>\n```\n\n\
    Set the background colour.\n\nAdd the image of the atom. Make sure the src property\
    \ matches the name of the downloaded file.\n\nAdd the ufo image.\n\nAdd the score\
    \ paragraph.\n\nAdd the time paragraph.\n\nClick **File > Save** and type **ufo.html**\
    \ as the filename.\n\nMake sure you save it in your **Documents** folder. Keep\
    \ saving it every few minutes.\n\n# STEP 4 – BEGIN THE SCRIPT\n\nNow that we have\
    \ defined the elements that go on the page, we need to start on the JavaScript.\n\
    At the start of the game we need to:\n\n+   * create the variables\n* tell the\
    \ program which function to run when keys are pressed\n* define a function to\
    \ make random numbers\n* define some functions to set co-ordinates\n* tell the\
    \ program which function to run when the page is loaded and ready.\n\n```\n8 \
    \ <script>\n9    var score=0, gameTime=0, gameTimer, ufoX=0, ufoY=0, atomX=0,\
    \ atomY=0;\n10   onkeydown=handleKeys;\n11   onready=startUp();\n12   function\
    \ setLeft(id,x){document.getElementById(id).style.left=x+\"px\";}\n13   function\
    \ setTop(id,y){document.getElementById(id).style.top=y+\"px\";}\n14   function\
    \ randomNumber(low,high){return(Math.floor(low+Math.\n     random()*(1+high-low)));}\n\
    ```\n\nStart the script section.\n\nCreate variables to store the score, gameTime\
    \ and co-ordinates.\n\nTell the program which function to run when keys are pressed.\n\
    \nTell the program which function to run when the page is ready.\n\nDefine functions\
    \ to set any element's co-ordinates.\n\nDefine a function that returns a random\
    \ number between two values."
