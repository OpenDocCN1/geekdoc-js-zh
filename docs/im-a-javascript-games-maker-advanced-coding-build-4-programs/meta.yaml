- md: "## GLOSSARY\n\n**ANIMATION** Making objects in your program move around.\n\n\
    **BROWSER** A program used to view web pages, such as Chrome or Internet Explorer.\n\
    \n**BUG** An error in a program that stops it working properly.\n\n**DEBUG** To\
    \ remove bugs (or errors) from a program.\n\n**ELEMENT** One of the objects making\
    \ up a web page, such as a paragraph or image.\n\n**EVENT** Something that happens\
    \ while the program is running, such as a mouse click or key press.\n\n**FUNCTION**\
    \ A reusable section of code combining a number of commands.\n\n**HTML (HYPERTEXT\
    \ MARKUP LANGUAGE)** The language used to build web pages.\n\n**JAVASCRIPT** A\
    \ programming language used to make web pages interactive or to build simple games.\n\
    \n**OVERLAPPING** When objects have collided but are not in exactly the same position.\n\
    \n**PIXEL** A small dot on the screen, can be used as a unit of measurement.\n\
    \n**PROPERTY** Information about the style of an element, such as its colour or\
    \ size.\n\n**RANDOM NUMBER** A number picked by the computer that can't be predicted.\n\
    \n**TAGS** Special words in an HTML document, surrounded by angle brackets <>\
    \ defining an element.\n\n**TEXT EDITOR** A program used to create and change\
    \ code.\n\n**TIMER** An object that runs a function after a specified delay, or\
    \ at a regular interval.\n\n**TWO DIMENSIONAL ARRAY** A list of lists used to\
    \ represent a grid or table of data.\n\n**VARIABLE** A value used to store information\
    \ in a program that can change.\n\n### BUGS & DEBUGGING\n\nWhen you find your\
    \ code isn't working as expected, stop and look through each line of code you\
    \ have put in. Here are some things to check:\n\n- Check you have spelt the commands\
    \ correctly.\n- Check you have used the correct case (capitals and lower case).\n\
    - Check you haven't missed any quotes.\n- Check you have closed tags correctly.\n\
    - If images aren't showing, check filenames have been typed accurately.\n- If\
    \ images aren't moving, check you have set position:absolute.\n- Make sure you\
    \ have used the correct style of brackets and other symbols.\n\n## COMMAND LIST\n\
    \n### JAVASCRIPT COMMANDS\n\n**alert(\"Hello\");** – shows \"Hello\" as a message\
    \ in a pop up box.\n**var score=0;** – defines a variable called score.\n**var\
    \ gameTimer=window.setInterval(myFunction, 1000);** – runs a function called **myFunction**\
    \ every second.\n**clearInterval(gameTimer);** – stops the timer called **gameTimer**.\n\
    **function gameOver();** – defines a function called **gameOver()**.\n**document.getElementById(\"\
    dog\")** – selects an element on the page.\n**Math.random()** – creates a random\
    \ number between 0 and 1.\n**Math.round()** – rounds a decimal to the nearest\
    \ whole number.\n**location.reload();** – reloads a page to restart the JavaScript\
    \ (and the game).\n\n### HTML ELEMENTS\n\n**<html>...</html>** – starts and ends\
    \ the HTML file.\n**<script>...</script>** – starts and ends the script section.\n\
    **<img>** – tags an image, such as a photo or piece of clipart.\n**<p>...</p>**\
    \ – tags a paragraph or line of text.\n**<body>...</body>** – starts and ends\
    \ the main body of the page, effectively the background of your program.\n\n###\
    \ EVENTS\n\n**onclick** – the mouse has been clicked.\n**onmousedown** – the mouse\
    \ has been pressed down (happens before click and mouse up).\n**onmouseup** –\
    \ the mouse button has been released.\n**onkeydown** – a key has been pressed\
    \ on the keyboard.\n\n### TIPS TO REDUCE BUGS\n\n- If you are making your own\
    \ web page, spend time planning it before you start.\n- Practise debugging! Make\
    \ a very simple web page and get a friend to change one line of code while you’re\
    \ not looking. Can you fix it?\n- When things are working properly, spend time\
    \ looking through your code so you understand each line. To be good at debugging,\
    \ you need to understand what each line of your code does and how your code works.\n\
    \n### STYLE PROPERTIES\n\n**position:absolute** – allows an element to be moved\
    \ around by changing left and top properties.\n**left** – sets how far across\
    \ the screen an element (such as an image) is.\n**top** – sets how far down from\
    \ the top of the screen an element is.\n**height** – sets the height of an element,\
    \ such as an image (eg 20px means 20 pixels high).\n**width** – sets the width\
    \ of an element, such as an image.\n**-webkit-transition** – sets how quickly\
    \ an element changes its properties.\n\n## INDEX\n\n- **angles** 24, 27, 28\n\
    - **animation** 7, 30\n- **arrow keys** 6, 9, 12, 15, 18, 22, 24, 28\n- **brackets**\
    \ 5, 14, 30\n- **bugs** 30, 31\n- **colour** 7, 13, 16, 19, 25\n- **commas** 14\n\
