  md: "# HIT OR OVERLAPPING?\n\nIn the previous two games, we moved objects by 50\
    \ or 100 pixels at a time. This made it easy to see if objects had hit each other,\
    \ after testing the x (how far from the left) and y (how far from the top) co-ordinates.\
    \ In a game where objects move by smaller amounts, they may hit each other, but\
    \ not have exactly the same co-ordinates. To test for this, we need to see if\
    \ the two objects are overlapping.\n\n![](img/2638ff15866c473a5b1b3f1de53c9951_23_0.png)\n\
    \n# STEP 6 – OVERLAPPING TEST CODE\n\n⇒ We need a function that can test if any\
    \ of the three rocks are overlapping the ship. Rather than write separate code\
    \ for each rock, we will write a function that can test if any two objects are\
    \ overlapping. We will call these two imaginary objects ob1 and ob2. When we call\
    \ the function, we will tell it which two objects we want to use in the overlapping\
    \ test.\n\n```\n18 function isOverlapping(ob1,ob2){\n19   return ((getLeft(ob1)+100>getLeft(ob2))\n\
    \        && (getLeft(ob1)<getLeft(ob2)+100) &&\n        (getTop(ob1)+100>getTop(ob2))\
    \ &&\n        (getTop(ob1)<getTop(ob2)+100));}\n```\n\nAdd the code that returns\
    \ (sends back) a value after testing co-ordinates of the two objects. It returns\
    \ true if the objects are overlapping, or false if they are not. It assumes the\
    \ objects are 100 pixels high and 100 pixels wide.\n\n# STEP 7 – START UP\n\n\
    ⇒ Once the page has loaded in the browser the startUp function will be called.\
    \ The startUp function will set up a timer to move the rocks.\n\n```\n20 function\
    \ startUp(){\n21   gameTimer=window.setInterval(moveThings,20);\n22 }\n```\n\n\
    Start the gameTimer. This timer will call the function named moveThings every\
    \ 20 milliseconds (50 times a second)."
