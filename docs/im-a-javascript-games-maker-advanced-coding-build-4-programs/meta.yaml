- md: '# I''M A JAVASCRIPT GAMES MAKER: ADVANCED CODING


    ## CONTENTS


    - INTRODUCTION ............................. 3

    - GETTING STARTED ....................... 4

    - UFO POWER UP .............................. 6

    - GHOST MAZE ................................ 12

    - ROCK STORM ................................ 18

    - SUBMARINE EXPLORER ................. 24

    - GLOSSARY .................................... 30

    - COMMAND LIST ............................. 31

    - INDEX ........................................ 32


    > ### RESPECTING COPYRIGHT

    Copyright means the legal ownership of something. You need to think about who
    owns the images or sound files you are linking to or downloading to your web pages.
    There shouldn''t be any major issues unless you try to make a page available to
    the public. Do check with an adult to make sure.


    An alternative is to find a free to use image or sound file: search for an image
    or sound, then look for the **Settings** button on the website results page. Click
    **Advanced Search** then look for Usage Rights. On this menu choose **Free to
    use, share or modify**.


    ## INTRODUCTION


    This book will show you how to code exciting new games using JavaScript. JavaScript
    is used to make web pages more interactive. It can also be used to create online
    games that will run on both desktops and mobile devices. By the end of this book,
    you will have learnt loads of great techniques to make you the ultimate JavaScript
    expert.


    You could use a plain **text editor** to create your code.


    ```

    <script>

    alert(''Press any key to start'')

    </script>

    ```


    This will work fine but can be quite fiddly, as the software won''t give you any
    help.


    The best thing to use for the activities in this book is an offline HTML text
    editor. This will support you as you type your code, but also give you the opportunity
    to learn actual JavaScript code.


    There are two separate windows that you''ll be using. Arrange them so you can
    see them both at the same time.


    There are many different web browsers you can use. We recommend using Google Chrome
    for the activities in this book. Make sure you have the latest version installed
    on your computer before you start.


    You will learn some HTML, as well as JavaScript, in this book. HTML is the language
    used to build web pages. JavaScript is the language that brings those pages to
    life!


    If you would like to learn more about how HTML works, or if you need a beginner''s
    guide to JavaScript, then try reading some of the other books in the *Generation
    Code* series. But, if you haven''t used HTML or JavaScript before, you''ll still
    be able to create all the games in this book.


    So what are you waiting for? Get coding!


    ## GETTING STARTED


    You need a text editor to start coding in JavaScript. There will probably be a
    simple text editor already on your computer, called Notepad (if you have Windows),
    or TextEdit (on a Mac). This will be sufficient for you to get started, but it
    will be much easier to create JavaScript if you download a more powerful text
    editor. In this book, we will use a text editor called Sublime Text. There are
    many others you could download, such as Brackets or Notepad++ - all of these are
    free for you to try out.


    ### STEP 1 - FIND THE SUBLIME TEXT WEBSITE


    - Open your web browser and visit www.sublimetext.com


    ### STEP 2 - START DOWNLOADING


    - Click the Download button near the top of the web page.

    - Choose which version of Sublime Text you need. If you are not sure, then ask
    an adult to help you find the correct version: click the Apple menu, then About
    if you are using a Mac. On a PC, click the Start menu, select System, and click
    About.

    - Wait for the download to complete.


    ### STEP 3 - INSTALL THE SOFTWARE


    - Some web browsers will then ask you to run the installation program. Choose
    Run.

    - If this does not happen, don''t panic. The installer file should have been downloaded
    to your computer. Look in your Downloads folder for it. Double-click it to start
    installing your new text editor. You should get a big white or grey box giving
    you instructions on what to do next. Follow these instructions to complete the
    installation.


    ### STEP 4 – RUNNING SUBLIME TEXT


    **On a PC:**

    ⇒ Click **Start** > **Programs** > **Sublime Text**. Or just click **Sublime Text**
    if it appears in the **Recently added** section.


    **On a Mac:**

    ⇒ Click **Finder**.

    ⇒ Click **Applications**.

    ⇒ Make a shortcut by dragging **Sublime Text** from **Finder** on to your dock
    at the bottom of the Desktop.

    ⇒ Click the **Sublime Text** icon.


    ### STEP 5 – START CODING!


    ⇒ Carefully type this code into lines 1, 2 and 3 of your text editor.


    ```

    <script>

    alert(''Start Coding!'')

    </script>

    ```


    Mark the start of a JavaScript section.

    Show a message box saying ''Start Coding!''.

    Mark the end of the JavaScript section.


    ### STEP 6 – SAVE YOUR CODE


    - ⇒ Click **File** > **Save**.

    - ⇒ Save to your **Documents** folder.

    - ⇒ Type **start.html** as the filename.


    ### STEP 7 – VIEW YOUR PAGE


    - ⇒ Open your **Documents** folder.

    - ⇒ Find the **start.html** file and double-click it.

    - ⇒ Your web page should now load in your normal web browser.

    - ⇒ You should get a message saying **Start Coding!**


    ### JAVASCRIPT NEEDS HTML


    Although we are coding with JavaScript, we need to put our file inside some HTML
    code to make it work. HTML stands for HyperText Markup Language and is the language
    used to build web pages.


    HTML is used to describe what objects, or elements, are shown on a web page. If
    you are creating a simple game, you need to use HTML to add an image and some
    text to show the score. JavaScript is added to tell the image to move around when
    different keys are pressed, or the mouse is clicked. It can also be used to display
    the score and make it change.


    We need to use both HTML and JavaScript to make a more interesting game. JavaScript
    was designed to be added to HTML pages to make them more interactive.


    You will use a range of HTML elements in this book. Each element uses tags to
    show what type of element it is (see page 31). Tags are enclosed with < > angle
    brackets.


    ## UFO POWER UP


    In this game, the player has to move an alien spaceship (a UFO) as quickly as
    possible to get more energy. The player moves the UFO by pressing the arrow keys
    on the keyboard. The symbol for an atom (in green below) is used to represent
    the energy source. After the player has completed the task five times, the game
    stops and the time taken is shown. You can play the game against your friends
    and see who can complete it in the fastest time! The complete code for the game
    is listed on page 11.


    ### STEP 1 - PLANNING


    Variables count the score, how long the game has been running and the co-ordinates
    of the atom and the UFO.


    - `var score`

    - `var gameTime`

    - `var atomX`

    - `var atomY`

    - `var ufoX`

    - `var ufoY`


    The score is shown in an HTML paragraph element.

    A timer will count how long it takes to collect five atoms.

    Every time the UFO moves, we need to check if it has reached the atom. This is
    done by comparing their co-ordinates.


    When five atoms have been collected, the game ends and the time taken is shown.

    Pressing the arrow keys will change the `ufoX` and `ufoY` co-ordinates, making
    the UFO move around the screen.

    Click OK to play again.


    We will only need one atom image. Each time it has been collected by the UFO,
    we will move it to a new random place and increase the score by 1.


    ### STEP 2 - FIND SOME PICTURES


    - Find an image of an atom to use, or find another symbol to represent energy
    in your game. It needs to be saved into the same folder as your HTML file.

    - Search for atom clipart to use.

    - Right-click one image.

    - Click Save Image As...

    - Navigate to your Documents folder then click Save.

    - Now repeat this step but search for ufo clipart to use.


    ---


    ## APPENDIX: LIBRARY INFORMATION


    | | |

    |---|---|

    | 09 SEP 2019 | 08 DEC 2018 |


    Please return this book on or before the date shown above. To renew go to www.essex.gov.uk/libraries,
    ring 0345 603 7628 or go to any Essex library.


    Essex County Council


