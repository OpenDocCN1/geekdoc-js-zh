- md: "## SMOOTH ANIMATIONS\n\nWe will add a transition property to the image to make\
    \ it move smoothly. This means that the image's style properties (i.e. how far\
    \ it is from the left or top of the screen) will change gradually over a specific\
    \ amount of time.\n\n```css\n-webkit-transition: all 0.5s;\n```\n\nAll of the\
    \ style properties will be affected. The changes will be spread over 0.5 seconds\
    \ (half a second).\n\n## STEP 3 – START A NEW FILE\n\nStart by typing in the HTML\
    \ for the game, setting out the body, image and a paragraph for the score.\n\n\
    ```html\n<html>\n<body style=\"background-color:black\">\n  <img id=\"atom\" style=\"\
    width: 50px; position:absolute\" src=\"atom.png\">\n  <img id=\"ufo\" style=\"\
    width: 50px; position:absolute; top:0; left:0;\n  -webkit-transition: all 0.2s;\"\
    \ src=\"ufo.png\">\n  <p id=\"scoreTB\" style=\"position:absolute; color:white;\"\
    >Score: 0</p>\n  <p id=\"timeTB\" style=\"position:absolute; right:50px; color:white;\"\
    >\n    Time: 0\n  </p>\n</body>\n```\n\nSet the background colour. Add the image\
    \ of the atom. Make sure the src property matches the name of the downloaded file.\
    \ Add the ufo image. Add the score paragraph. Add the time paragraph.\n\nClick\
    \ **File > Save** and type **ufo.html** as the filename. Make sure you save it\
    \ in your **Documents** folder. Keep saving it every few minutes.\n\n## STEP 4\
    \ – BEGIN THE SCRIPT\n\nNow that we have defined the elements that go on the page,\
    \ we need to start on the JavaScript. At the start of the game we need to:\n\n\
    - create the variables\n- tell the program which function to run when keys are\
    \ pressed\n- define a function to make random numbers\n- define some functions\
    \ to set co-ordinates\n- tell the program which function to run when the page\
    \ is loaded and ready.\n\n```javascript\nvar score=0, gameTime=0, gameTimer, ufoX=0,\
    \ ufoY=0, atomX=0, atomY=0;\nonkeydown=handleKeys;\nonready=startUp();\nfunction\
    \ setLeft(id,x){document.getElementById(id).style.left=x+\"px\";}\nfunction setTop(id,y){document.getElementById(id).style.top=y+\"\
    px\";}\nfunction randomNumber(low,high){return(Math.floor(low+Math.\n  random()*(1+high-low)));}\n\
    ```\n\nStart the script section. Create variables to store the score, gameTime\
    \ and co-ordinates. Tell the program which function to run when keys are pressed.\
    \ Tell the program which function to run when the page is ready. Define functions\
    \ to set any element's co-ordinates. Define a function that returns a random number\
    \ between two values.\n\n## STEP 5 - GET STARTED\n\nOnce the page has loaded in\
    \ the browser, the **startUp** function will be called. ('Calling' a function\
    \ means running it and carrying out all the code inside it.) The **startUp** function\
    \ will run code to move the atom icon to a random place and the game timer will\
    \ be started.\n\n```javascript\nfunction startUp(){\n    moveAtom();\n    gameTimer=window.setInterval(displayTime,\
    \ 1000);\n}\n```\n\nDefine the function. Call the moveAtom function. Start the\
    \ gameTimer. This timer will call the function named displayTime every 1000 milliseconds\
    \ (every second). End the function.\n\n## STEP 6 - HOW LONG?\n\nAdd the **displayTime**\
    \ variable. This will store how many seconds the game has been running.\n\n```javascript\n\
    function displayTime(){\n    gameTime++;\n    document.getElementById(\"timeTB\"\
    ).innerText=\"Time:\"+gameTime;\n}\n```\n\nDefine the function. Add one to the\
    \ value stored in the gameTime variable. Show the time left in the paragraph called\
    \ timeTB. End the function.\n\n## POSITIONING ELEMENTS\n\n> Computer images are\
    \ made up of pixels (picture elements). Pixels can be used as units for co-ordinates\
    \ in JavaScript and HTML.\n\nElements can be positioned in a particular place\
    \ by setting their co-ordinates. This is done by setting their left and top style\
    \ properties. Add px on the end of the value to measure in pixels.\n\n(0,0) will\
    \ always be the co-ordinates for the top left of the browser. The maximum values\
    \ for left and top will depend on the size of the browser window. The co-ordinates\
    \ of the red dot on this screen are (100,50).\n\n## STEP 7 - MOVE THE ATOM\n\n\
    We need to define a function that will move the atom to a random place on the\
    \ screen.\n\n```javascript\nfunction moveAtom(){\n  atomX=randomNumber(2,16);\n\
    \  atomY=randomNumber(2,16);\n  setLeft(\"atom\",50*atomX);\n  setTop(\"atom\"\
    ,50*atomY);\n}\n```\n\nDefine the function. Set atomX to a random number between\
    \ 2 and 16. Set atomY to a random number between 2 and 16. Set the new position\
    \ for the atom symbol by multiplying atomX by 50 and atomY by 50 (* means multiply,\
    \ and is used in JavaScript instead of the mathematical symbol x).\n\n## STEP\
    \ 8 - MOVE THE UFO\n\nWhen the arrow keys are pressed, we need to move the UFO\
    \ up, down, left or right – which direction depends on which key is pressed. We\
    \ need to add a special sort of variable called a parameter to our function, which\
    \ will store the information about the key that has been pressed. Type (e) after\
    \ the function name to add the parameter.\n\nEach key on the keyboard has a specific\
    \ code linked to it. The left arrow has a code of 37, the right arrow’s code is\
    \ 39, up is 38 and down is 40. The code for the key pressed will be stored in\
    \ e.keyCode. Type in this function to trigger what will happen when a key is pressed:\n\
    \n```javascript\nfunction handleKeys(e){\n  if(e.keyCode==37){ufoX--;}\n  if(e.keyCode==39){ufoX++;}\n\
    \  if(e.keyCode==38){ufoY--;}\n  if(e.keyCode==40){ufoY++;}\n  setLeft(\"ufo\"\
    ,50*ufoX);\n  setTop(\"ufo\",50*ufoY);\n  checkIfHitAtom();\n}\n```\n\nDefine\
    \ a function called handleKeys. Information about which key is pressed will be\
    \ put into the variable called e. If the code for the left arrow key has been\
    \ sent, make ufoX go down by 1. (ufoX-- means subtract one from the value in ufoX.)\
    \ If the code for the right arrow key has been sent, make ufoX go up by 1. (ufoX++\
    \ means add 1 to ufoX.) If the up arrow key has been pressed, subtract 1 from\
    \ ufoY. If the down arrow key has been pressed, add 1 to ufoY. Set the new position\
    \ for the UFO by multiplying ufoX by 50 and ufoY by 50. Once the UFO has moved,\
    \ we will need to check if it has hit the atom symbol by running the checkIfHitAtom()\
    \ function.\n\n> Remember, events are special bits of code that 'listen' to the\
    \ mouse or keyboard and wait for certain things to happen before running some\
    \ other code.\n\n## STEP 9 - HIT OR MISS?\n\nEvery time the UFO moves, it calls\
    \ the function below. This function will check to see if the UFO has hit the atom\
    \ symbol. We code this by comparing the x co-ordinates (how far from the left)\
    \ and y co-ordinates (how far from the top) of the atom and UFO. If they are equal\
    \ then they both must be in the same position. Therefore, the UFO has hit the\
    \ atom symbol and topped up its energy levels!\n\n```javascript\nfunction checkIfHitAtom(){\n\
    \  if((ufoX==atomX) && (ufoY==atomY)){\n    score++;\n    document.getElementById(\"\
    scoreTB\").innerText=\"Score: \"+score;\n    moveAtom();\n    if(score==5){gameOver();}\n\
    \  }\n}\n```\n\nIf the co-ordinates match, run the code below (&& means and).\
    \ Increase the score by 1. Show the score in the paragraph called scoreTB. Move\
    \ the atom symbol to a new random place. If the score gets up to 5 then the player\
    \ has won, so call the gameOver function.\n\n## STEP 10 - GAME OVER\n\nWhen the\
    \ player has collected five atom icons, the game is over and the following code\
    \ is run:\n\n```javascript\nfunction gameOver(){\n  clearInterval(gameTimer);\n\
    \  alert(\"Well done! Your time was: \"+ gameTime);\n  location.reload();\n}\n\
    ```\n\nDefine the function. Stop the timer running, so the time won't keep going\
    \ up. Show a message explaining how long the player took to complete the game.\
    \ This command will reload the page and make the game start again. (If you don't\
    \ want this to happen, miss out this line.)\n\n## STEP 11 - LAST LINES\n\nFinally,\
    \ add these two lines to show the end of the script section and the end of the\
    \ HTML.\n\n```html\n</script>\n</html>\n```\n\nSave your file, reload the browser,\
    \ then play!\n\n## CUSTOMISE\n\n- Change the game so the player has to collect\
    \ 10 atom icons.\n- Design your own collecting game using different images."
  mdcn: "\n## 平滑动画\n\n我们将为图片添加 `transition` 属性，使其平滑移动。这意味着图片的样式属性（即它距离屏幕左侧或顶部的距离）将在特定的时间段内逐渐变化。\n\
    \n```css\n-webkit-transition: all 0.5s;\n```\n\n所有的样式属性都会受到影响。变化将在 0.5 秒（半秒）内分散完成。\n\
    \n## 步骤 3 – 开始新文件\n\n首先输入游戏的 HTML 代码，设置 `body`、图片以及用于显示分数的段落。\n\n```html\n<html>\n\
    <body style=\"background-color:black\">\n  <img id=\"atom\" style=\"width: 50px;\
    \ position:absolute\" src=\"atom.png\">\n  <img id=\"ufo\" style=\"width: 50px;\
    \ position:absolute; top:0; left:0;\n  -webkit-transition: all 0.2s;\" src=\"\
    ufo.png\">\n  <p id=\"scoreTB\" style=\"position:absolute; color:white;\">Score:\
    \ 0</p>\n  <p id=\"timeTB\" style=\"position:absolute; right:50px; color:white;\"\
    >\n    Time: 0\n  </p>\n</body>\n```\n\n设置背景颜色。添加原子图片。确保 `src` 属性与下载文件的名称匹配。添加\
    \ UFO 图片。添加分数段落。添加时间段落。\n\n点击 **文件 > 另存为**，并将文件命名为 **ufo.html**。确保将其保存在 **文档**\
    \ 文件夹中。每隔几分钟保存一次。\n\n## 步骤 4 – 开始编写脚本\n\n现在我们已经定义了页面上的元素，需要开始编写 JavaScript。在游戏开始时，我们需要：\n\
    \n-   创建变量\n-   告诉程序按下按键时运行哪个函数\n-   定义一个生成随机数的函数\n-   定义一些设置坐标的函数\n-   告诉程序页面加载完毕并准备好时运行哪个函数。\n\
    \n```javascript\nvar score=0, gameTime=0, gameTimer, ufoX=0, ufoY=0, atomX=0,\
    \ atomY=0;\nonkeydown=handleKeys;\nonready=startUp();\nfunction setLeft(id,x){document.getElementById(id).style.left=x+\"\
    px\";}\nfunction setTop(id,y){document.getElementById(id).style.top=y+\"px\";}\n\
    function randomNumber(low,high){return(Math.floor(low+Math.\n  random()*(1+high-low)));}\n\
    ```\n\n开始编写脚本部分。创建变量来存储分数、`gameTime` 和坐标。告诉程序按下按键时运行哪个函数。告诉程序页面准备好时运行哪个函数。定义设置任何元素坐标的函数。定义一个返回两个值之间随机数的函数。\n\
    \n## 步骤 5 - 开始游戏\n\n一旦页面在浏览器中加载完毕，**startUp** 函数将被调用。（“调用”函数是指运行它并执行其中的所有代码。）**startUp**\
    \ 函数将运行代码将原子图标移动到随机位置，并启动游戏计时器。\n\n```javascript\nfunction startUp(){\n    moveAtom();\n\
    \    gameTimer=window.setInterval(displayTime, 1000);\n}\n```\n\n定义该函数。调用 `moveAtom`\
    \ 函数。启动 `gameTimer`。此计时器将每 1000 毫秒（每秒）调用一次名为 `displayTime` 的函数。结束函数。\n\n## 步骤\
    \ 6 - 游戏时长？\n\n添加 **displayTime** 变量。这将存储游戏运行了多少秒。\n\n```javascript\nfunction\
    \ displayTime(){\n    gameTime++;\n    document.getElementById(\"timeTB\").innerText=\"\
    Time:\"+gameTime;\n}\n```\n\n定义该函数。将 `gameTime` 变量中存储的值加一。在名为 `timeTB` 的段落中显示剩余时间。结束函数。\n\
    \n## 定位元素\n\n> 计算机图像由像素（picture elements）构成。像素可以用作 JavaScript 和 HTML 中的坐标单位。\n\
    \n可以通过设置元素的坐标来将其定位在特定位置。这是通过设置其 `left` 和 `top` 样式属性来完成的。在值的末尾添加 `px` 以使用像素作为单位。\n\
    \n`(0,0)` 始终是浏览器左上角的坐标。`left` 和 `top` 的最大值取决于浏览器窗口的大小。屏幕上红点的坐标是 `(100,50)`。\n\n\
    ## 步骤 7 - 移动原子\n\n我们需要定义一个函数，将原子移动到屏幕上的随机位置。\n\n```javascript\nfunction moveAtom(){\n\
    \  atomX=randomNumber(2,16);\n  atomY=randomNumber(2,16);\n  setLeft(\"atom\"\
    ,50*atomX);\n  setTop(\"atom\",50*atomY);\n}\n```\n\n定义该函数。将 `atomX` 设置为 2 到 16\
    \ 之间的随机数。将 `atomY` 设置为 2 到 16 之间的随机数。通过将 `atomX` 乘以 50 和 `atomY` 乘以 50 来设置原子符号的新位置（`*`\
    \ 表示乘法，在 JavaScript 中用于代替数学符号 ×）。\n\n## 步骤 8 - 移动 UFO\n\n当按下方向键时，我们需要将 UFO 向上、下、左或右移动——方向取决于按下了哪个键。我们需要在函数中添加一种称为参数的特殊变量，它将存储有关所按键的信息。在函数名后键入\
    \ `(e)` 以添加参数。\n\n键盘上的每个键都链接到一个特定的代码。左箭头键的代码是 37，右箭头键的代码是 39，向上是 38，向下是 40。按下的键的代码将存储在\
    \ `e.keyCode` 中。输入此函数以触发按下键时将发生的情况：\n\n```javascript\nfunction handleKeys(e){\n\
    \  if(e.keyCode==37){ufoX--;}\n  if(e.keyCode==39){ufoX++;}\n  if(e.keyCode==38){ufoY--;}\n\
    \  if(e.keyCode==40){ufoY++;}\n  setLeft(\"ufo\",50*ufoX);\n  setTop(\"ufo\",50*ufoY);\n\
    \  checkIfHitAtom();\n}\n```\n\n定义一个名为 `handleKeys` 的函数。关于按下哪个键的信息将被放入名为 `e` 的变量中。如果发送了左箭头键的代码，则使\
    \ `ufoX` 减少 1。（`ufoX--` 表示从 `ufoX` 的值中减去 1。）如果发送了右箭头键的代码，则使 `ufoX` 增加 1。（`ufoX++`\
    \ 表示向 `ufoX` 添加 1。）如果按下了向上箭头键，则从 `ufoY` 中减去 1。如果按下了向下箭头键，则向 `ufoY` 添加 1。通过将 `ufoX`\
    \ 乘以 50 和 `ufoY` 乘以 50 来设置 UFO 的新位置。一旦 UFO 移动，我们将需要通过运行 `checkIfHitAtom()` 函数来检查它是否击中了原子符号。\n\
    \n> 请记住，事件是特殊的代码片段，它们“监听”鼠标或键盘，并在运行其他代码之前等待某些事情发生。\n\n## 步骤 9 - 命中还是未命中？\n\n每次\
    \ UFO 移动时，都会调用下面的函数。此函数将检查 UFO 是否击中了原子符号。我们通过比较原子和 UFO 的 x 坐标（距离左侧的距离）和 y 坐标（距离顶部的距离）来实现这一点。如果它们相等，则它们必然在同一位置。因此，UFO\
    \ 击中了原子符号并补充了它的能量！\n\n```javascript\nfunction checkIfHitAtom(){\n  if((ufoX==atomX)\
    \ && (ufoY==atomY)){\n    score++;\n    document.getElementById(\"scoreTB\").innerText=\"\
    Score: \"+score;\n    moveAtom();\n    if(score==5){gameOver();}\n  }\n}\n```\n\
    \n如果坐标匹配，则运行下面的代码（`&&` 表示“和”）。将分数增加 1。在名为 `scoreTB` 的段落中显示分数。将原子符号移动到新的随机位置。如果分数达到\
    \ 5，则玩家获胜，因此调用 `gameOver` 函数。\n\n## 步骤 10 - 游戏结束\n\n当玩家收集到五个原子图标时，游戏结束，并运行以下代码：\n\
    \n```javascript\nfunction gameOver(){\n  clearInterval(gameTimer);\n  alert(\"\
    Well done! Your time was: \"+ gameTime);\n  location.reload();\n}\n```\n\n定义该函数。停止计时器运行，这样时间就不会继续增加。显示一条消息，说明玩家完成游戏所花的时间。此命令将重新加载页面并使游戏重新开始。（如果不想这样发生，请省略此行。）\n\
    \n## 步骤 11 - 最后几行\n\n最后，添加这两行以显示脚本部分和 HTML 的结束。\n\n```html\n</script>\n</html>\n\
    ```\n\n保存文件，重新加载浏览器，然后开始玩！\n\n## 自定义\n\n-   更改游戏，使玩家需要收集 10 个原子图标。\n-   使用不同的图片设计你自己的收集游戏。\n"
