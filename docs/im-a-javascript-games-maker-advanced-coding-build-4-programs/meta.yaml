    # SUBMARINE EXPLORER


    This game involves the player guiding a submarine around the screen, trying to
    catch treasure that has fallen overboard from a shipwreck. It uses a different
    moving system that is often used in things like driving games and side flying
    games to steer and move at an angle. Some complex maths is used to handle the
    angles. The game also includes basic sound effects. The complete code for the
    game is listed on page 29.


    # STEP 1 - PLANNING


    ![](img/2638ff15866c473a5b1b3f1de53c9951_27_0.png)


    +   - The score is shown in an HTML paragraph element `<p>`.

    - A timer will move the coin and the submarine.

    - Every time the sub moves we need to check if it has grabbed a coin. This is
    done by using a function to test for overlapping.

    - If a coin has been caught then a sound effect will play.


    +   - `var score`, `var gameTime`, `var angle`, `var speed`, `var subX`, `var
    subY`

    - Variables count the score, the speed of the submarine, the angle it''s travelling
    at and its co-ordinates.

    - If a coin falls to the bottom of the screen, the game is over.

    - Click **OK** to play again or cancel.

    - Pressing the up and down arrow keys will change the angle of the sub, steering
    it around the screen.


    # STEP 2 - FIND SOME PICTURES


    +   - Find an image of a submarine to use. It needs to be saved into the same
    folder as your HTML file.

