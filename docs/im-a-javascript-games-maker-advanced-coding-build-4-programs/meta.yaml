    \n每次玩家移动时，我们需要检查它是否已到达出口。这是通过检查坐标来完成的。\n\nvar mazeData\n迷宫信息以1和0存储。1表示墙壁，0表示路径。\n\
    \nvar px var py\n变量存储玩家的坐标。\n\n在出口处显示一条消息。\n\n## 步骤 2 – 找一张图片\n\n- 首先，你需要找一张图片来使用。它需要放在与HTML文件相同的文件夹中。\n\
