  trans: '


    每个处理器都必须忽略处理指令（Processing Instructions）的含义，因为它们根本不知道这些指令代表什么。尽管如此，进程必须将处理指令的内容和名称传递给应用程序。


    请看以下 XML 规范：


    ```

    PI : : = ‘<?’ PITarget ( S ( Char* - ( Char* ‘?>’ Char* ) ) ) ? ‘?>’


    PITarget : : = Name – ( ( ‘X’ | ‘X’ ) ( ‘M’ | ‘m’ ) ( ‘L’ | ‘l’ ) )

    ```


    `PITarget` 或紧跟第一个问号后面的名称实际上是处理指令的名字。它后面必须留一个空格。处理指令的其余部分（包括最后一个问号）是一个字符串值或内容。正如你之前在之前的章节中所学到的，`xml`
    字母是预留的。因此，不应该使用它来开始一个用户定义的处理指令名称。同样，内容不应包含 `?>` 字符。


    如你所见，处理指令的内容仅仅是一个字符串值。尽管如此，创建看起来像伪属性的内容是一种常见做法。请看以下示例：


    ```

    <? xml – stylesheet href = “sample.css” type = “text/css” ?>

    ```


    除了这些，你也可以编写 `abc1234567` 或“Processing Instructions are quite unusual but you can
    eventually get used to using them.”这些示例在 XML 中被视为合法内容。


    ## 处理指令的常见用途


    除非在某些情况下，处理指令并不经常使用。事实上，它们是 XML 文档链接到样式表的官方方法。微软在 `Microsoft Office 2003` 中使用了处理指令。这样做是为了用户在将其保存为
    XML 时能够轻松识别 `Microsoft Excel` 和 `Microsoft Word` 文档。


    ### XML 样式表


    在 1999 年，使用处理指令将样式表链接到 XML 文档已成为标准做法。


    ### Microsoft Office 2003 中的处理指令


    自从 `Microsoft Office 2003` 开发以来，处理指令在用户中变得越来越流行。`Word` 和 `Excel` 现在都可以使用 `xml`
    文件扩展名保存为它们自己的 `xml` 格式。然而，事实证明这是一种低效的方法，因为许多其他应用程序也使用了相同的扩展名。


    由于这个问题，微软使用了处理指令进行标识。这样 XML 文件就可以向 `Windows Explorer` 和 `Internet Explorer` 标记为
    `Excel` 或 `Word` 文档。


    如果你正在使用 `Microsoft Word 2003`，XML 声明后的处理指令显示如下：


    ```

    <? mso-application progid = “Word.Document” ?>

    ```


    如果你正在使用 `Microsoft Excel 2003`，XML 声明后的处理指令显示如下：


    ```

    <? mso-application progid = “Excel.Sheet” ?>

    ```


    `Microsoft Office 2007` 使用 zip 文件格式用于 PowerPoint (`pptx`)、Word (`docx`) 和 Excel
    (`xlsx`)。每个压缩的文档都有多个媒体文件、XML 文件和其他文件。如果你正在使用 `Microsoft Office 2007`，你就不再需要使用处理指令，因为可用的文件扩展名已经足够。但是，如果你想以
    2003 XML 格式保存文件且你正在使用 `Microsoft Office 2007`，则可以使用处理指令。


    ## 几乎适用于一切的处理指令


    处理指令具有多种用途。事实上，它们可以用于执行各种操作，例如指示标记中的换行符以及确定哪些单词不需要进行拼写检查等。


    为了让你更好地理解处理指令，请考虑以下示例。在这里，你将学习处理指令的多样性。你将发现它们如何解决几乎每一个问题。例如，如果你在 XML 中有一个项目，你可以使用处理指令来标注你仍处于处理过程中的文档。


    ```

    <? TeamExample member = “Wendy” date = “2015-11-04” comment = “I believe that
    the attributes given in the product element are not of particular importance and
    therefore can be eliminated.” ?>

    ```


    如果你使用了注释标签（comment tags），你可能很难区分实际注释与文档中的其他元素。因此，为了解决此类问题，你可以使用处理指令。你不再需要在架构（schema）中声明它们。你也可以轻松地将它们与实际注释区分来，并在必要删除删除。


    注释只有内容。另一方面，处理指令既有内容又有名称。例如，你可以使用 `processing-instruction()` 节点测试在 `XPath` 中匹配所有处理指令。尽管如此，你也可以通过名称搜索处理指令并返回其内容。为了实现这一点，你需要执行以下操作：


    ```

    processing-instruction() [ name() = “TeamExample” ]

    ```


    请记住，内容仅仅是一个长字符串，伪属性的伪值可以使用正则表达式（Regular Expressions）进行分析。


    ## 什么时候应该使用处理指令？


    理想情况下，只有在你没有其他选择时才应该使用处理指令。换句话说，你应该将它们视为最后的手段。尽可能地，你应该克制使用它们。如果你在不需要的时候使用它们，它们将会被忽略。如果软件程序不理解它们代表什么，情况尤其如此。请注意，即使是专业开发者在使用它们之前也需要知道它们的含义。与
    `xml-stylesheet` 处理指令以及 `Microsoft Office 2003` 中的处理指令不同，处理指令并不容易掌握。


    ## XML 声明不是处理指令


    很多人误误认为 XML 声明是处理指令或特殊处理指令。然而，你应该知道这远非事实。XML 声明和处理指令实际上非常不同。


    尽管 XML 声明看起来和作用像处理指令，但它的功能是不同的。XML 处理器会感知 XML 声明及其内容。事实上，它非常了解它，以至于在发现错误时可以快速返回错误信息。


    对于处理指令，情况就不同了。它们恰恰相反。XML 处理器忽略处理指令，但将它们的名称和内容传递给应用程序。


    世界维网联盟（W3C）建议使用扩展样式表语言转换（XSLT）和 XML 路径语言（XPath）将在 XML 中标记的信息从某种词汇转换为另一种词汇。


    这二者提供了一种树形转换语言的极佳实现。它们将使用单一词汇的 XML 实例转换为纯文本、旧版 HTML 词汇或任何可用的词汇。


    ## 结


    再次感谢下载这本书！


    我希望这本书能够帮助你在计算任务中使用 XML。


    下一步是将你所学到的知识付诸实践——尝试使用 XML 来改进你的 Web 开发项目。即使你不是真的热衷于创建网站，请放心，这种标记语言在你的行业中也有可能的用途。不要犹豫与你的朋友和同事分享你的知识。


