  trans: "\n\n一些预定义的实体（如 `<` 和 `>`）需要转义，在标记中非常难以阅读，这就是为什么需要 CDATA 节的原因。使用 CDATA 节时会命令解析器\
    \ XML 文档的特定部分没有标记，应被视为普通文本。\n\n### 语法\n\n```xml\n<![CDATA[\ncharacters with markup\n\
    ]]>\n```\n\n该语法包含三个部分：\n\n* `CDATA Start Section`（CDATA 开始部分）——它应该始终以 9 个字符的标识符\
    \ `<![CDATA[` 开始。\n* `CDATA End Section`（CDATA 结束部分）——它通常以分隔符 `]]>` 结束。\n* `CDATA\
    \ Section`（CDATA 部分）——开始和结束之间的字符被称为字符。它们不会被识别为标记。它可以包含某些标记字符，但这些字符通常会被 XML 处理器忽略。\n\
    \n### 示例\n\n这是一个标记代码。CDATA 内部的字符会被解析器忽略。\n\n```xml\n<script>\n<![CDATA[\n<message>\
    \ Ahoy! You're in SeaShack </message>\n]] >\n</script>\n```\n\n### 规则\n\n* `CDATA`\
    \ 不允许文档的任何地方包含字符串 `]]>`。\n* `CDATA` 节不允许嵌套。\n\n### XML 空格字符\n\n空白字符是换行符、制表符当然还有空格的集合。它们使\
    \ XML 文档易于阅读。XML 文档有 2 类空白字符：\n\n* `Significant Whitespace`（显著空白）\n* `Insignificant\
    \ Whitespace`（不显著空白）\n\n### 显著空白\n\n这发生在包含文本和标记的元素内部。\n\n#### 示例\n\n```xml\n<name>NelDelgado</name>\n\
    ```\n\n或者\n\n```xml\n<name>Nel Delgado</name>\n```\n\n注意每个元素之间空格的差异。任何读取 XML 文件中此类元素的程序都应该保持这种识别。\n\
    \n### 不显著空白\n\n这是仅允许元素内容的空间。\n\n```xml\n<address.category=\"work\">\n```\n\n或者\n\
    \n```xml\n             <address....category=\"..work\">\n```\n\n这些示例是相同的。点代表空格。上述示例中\
    \ address 和 category 之间的空格实际上可能是显著的。\n\n`xml:space` 是一个特殊属性，可以附加到特定元素。添加该属性表示该特定元素不应删除空白。这可以设置为\
    \ `default` 或 `preserve`。\n\n```xml\n<!ATTLIST address xml:space (default|preserve)\
    \ 'preserve'>\n```\n\n* 值 `default` 允许对该特定元素接受特定应用程序的默认空白处理模式。\n* 值 `preserve`\
    \ 命令应用程序保留所有空白。\n\n# 第 8 章 XML 处理与 编码\n\n处理指令（Processing instructions）允许文档包含针对每个应用程序的指令。这些不是\
    \ XML 文档字符数据的一部分，但它们必须通过应用程序。\n\nPI 允许你向所有应用程序传递信息。它们可以出现在文档的任何位置。它们也可以出现在序言（包含\
    \ DTD 或文档类型定义）中、在文档之后，或者作为文本内容内容出现。\n\n### 语法\n\n```xml\n<?target instructions?>\n\
    ```\n\n* `target` 识别指令来源的应用程序。\n* `instruction` 是用于描述应用程序需要处理的信息字符。\n\n处理指令以特殊标记\
    \ `<?` 开始，以 `?>` 结束。当遇到字符串 `?>` 时，处理会立即结束。\n\n### 示例\n\n虽然 PI 并不常用，但它们用于将 XML\
    \ 文档与样式表链接。它的样子如下：\n\n```xml\n<?xml-stylesheet href=\"businessforms.css\" type=\"\
    text/css\"?>\n```\n\n`target` 是 `xml-stylesheet`，`href=\"businessforms.css\"`\
    \ 和 `type=\"text/css\"` 是目标应用程序必须为 XML 文档处理的指令。\n\n通过此指令，浏览器将通过启动该 XML 文档在显示之前对其进行转换来识别目标。注意第一个属性识别了\
    \ XSL 转换的类型，而第二个属性指示了它的位置。\n\n### 规则\n\n处理指令包含数据，`?>` 组合除外，该组合被解释为结束分隔符。\n\n###\
    \ 示例\n\n```xml\n<?welcome to pg=55 of business hub?>\n```\n\n或者这个：\n\n```xml\n\
    <?hello?>\n```\n\n# XML 编码\n\n编码过程将 Unicode 字符转换为二进制。当 XML 处理器读取特定的 XML 文档时，它会立即根据所需的编码类型对文档进行编码。\n\
    \n### 编码类型\n\n有两种类型的编码：`UTF-8` 和 `UTF-16`。UTF 意味着 Unicode Transformational Format（通用转换格式）；USC\
    \ 是 Universal Character Set（通用字符集）。数字 8 和 16 表示表示字符所用的位数。`UTF-8` 是 1 字节，而 `UTF-16`\
    \ 是 2 字节。如果 XML 文档没有编码信息，默认集合是 `UTF-8`。\n\n### 语法\n\n编码类型必须在 XML 文档自身的序言部分指定。\n\
    \nUTF-8 语法：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    no\" ?>\n```\n\nUTF-16 语法：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-16\"\
    \ standalone=\"no\" ?>\n```\n\n### 示例\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" standalone=\"no\" ?>\n<contact-info>\n<name>Dunny Bobbins</name>\n<company>Real\
    \ Realtors</company>\n<phone>512</phone>\n</contact-info>\n```\n\n此示例指示了 `UTF-8`。\n\
    \n# 第 9 章 验证\n\n验证用于判断文档是否符合限制。验证由 XML 解析器以两种方式进行：良好的（well-formed）或有效的（valid）。\n\
    \n### 良好的 XML 文档\n\n文档应遵循以下规则以成为良好的：\n\n* 文档类型已指示（在 element 中）。\n* 它有一个根元素 `address`。\n\
    * 自解释标签封装了每个元素。\n* 标签的顺序是良好的。\n* 标签应只包含一个属性。\n* 所有标签必须有闭合标签。\n* `&`、`<`、`\"` 和\
    \ `'` 实体应该声明。\n\n#### 示例\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    yes\" ?>\n<!DOCTYPE address [\n<!ELEMENT address (name,company,phone)>\n<!ELEMENT\
    \ name (#PCDATA)>\n<!ELEMENT company (#PCDATA)>\n<!ELEMENT phone (#PCDATA)>\n\
    ]>\n<address>\n<name>Dunny Bobbins</name>\n<company>Real Realtors</company>\n\
    <phone>333-7785</phone>\n</address>\n```\n\n### 有效文档\n\n带有文档类型声明或 DTD 的良好的 XML\
    \ 文档是有效的 XML 文档。文档的结构有效性将根据相应 XML 语言的语法规则进行检查。\n\n### 语法\n\n基本语法：\n\n```xml\n\
    <!DOCTYPE element DTD\n```\n\n`DTD identifier` 用于文档类型定义。它可能是系统中的路径或 URL 链接。如果它指向外部路径，则被称为外部子集（External\
    \ Subset）。\n\n### 内部 DTD\n\n元素位于 XML 文件内部。为了引用内部 DTD，XML 声明中的 `standalone` 属性应设置为\
    \ `yes`。\n\n#### 语法\n\n```xml\n<!DOCTYPE root-element [element-declarations]>\n\
    ```\n\n#### 示例\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    yes\" ?>\n<!DOCTYPE address [\n<!ELEMENT address (name,company,phone)>\n<!ELEMENT\
    \ name (#PCDATA)>\n<!ELEMENT company (#PCDATA)>\n<!ELEMENT phone (#PCDATA)>\n\
    ]>\n<address>\n<name>Dunny Bobbins</name>\n<company>Real Realtors</company>\n\
    <phone>(088) 559-4456</phone>\n</address>\n```\n\n"
- fmt: "\n*   The document type declaration should always be at the beginning of the\
    \ document.\n*   Element declarations should always begin with an exclamation\
    \ mark.\n*   The name indicated in the document type declaration should match\
    \ the element type of the root element.\n\n## External DTD\n\nThe DTD elements\
    \ are declared outside the XML file. The `standalone` attribute has to be set\
    \ to `no` to refer to the external DTD.\n\n### Syntax\n\n```\n<!DOCTYPE root-element\
    \ SYSTEM \"file-name\">\n```\n\n### Example\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" standalone=\"no\" ?>\n\n<!DOCTYPE address SYSTEM \"address.dtd\">\n\n\
    <address>\n<name>Dunny Bobbins</name>\n<company>Real Realtors</company>\n<phone>(077)\
    \ 554-4453</phone>\n</address>\n```\n\nThe content of `address.dtd` looks like\
    \ this:\n\n```xml\n<!ELEMENT address (name,company,phone)>\n<!ELEMENT name (#PCDATA)>\n\
    <!ELEMENT company (#PCDATA)>\n<!ELEMENT phone (#PCDATA)>\n```\n\n### Types of\
    \ External DTD\n\n*   System Identifiers – this allows you to specify the location\
    \ of the external file.\n    ```\n    <!DOCTYPE name SYSTEM \"address.dtd\" [...]>\n\
    \    ```\n*   Public Identifiers – provides mechanisms to locate DTD resources.\n\
    ```\n<!DOCTYPE name PUBLIC \"-//Beginning XML//DTD Address Example//EN\">\n```\n\
    \n## Chapter 10 XML Schemas\n\nXML Schema is more commonly referred to as XML\
    \ Schema Definition or `XSD`. It can be used to validate the structure and content,\
    \ and at the same time describe the content of the XML data.\n\n### Syntax\n\n\
    ```\n<xs:schema xmlns:xs=\"http://www.business.com/2012/XMLSchema\">\n```\n\n\
    ### Example\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<xs:schema\
    \ xmlns:xs=\"http://www.business.com/2012/XMLSchema\">\n<xs:element name=\"contact\"\
    >\n<xs:complexType>\n<xs:sequence>\n<xs:element name=\"name\" type=\"xs:string\"\
    \ />\n<xs:element name=\"company\" type=\"xs:string\" />\n<xs:element name=\"\
    phone\" type=\"xs:int\" />\n</xs:sequence>\n</xs:complexType>\n</xs:element>\n\
    </xs:schema>\n```\n\n### Definition Types\n\n*   Simple Type – utilized in the\
    \ context of the text.\n    ```\n    <xs:element name=\"phone_number\" type=\"\
    xs:int\" />\n    ```\n*   Complex Type – this is a container for other element\
