  trans: "\n\n通过上面的示例，你很可能推断出 `<h>` 标签用于标记列表中的产品名称。此外，你可能还能解释出 `<h2>` 之后的第一个段落是产品描述，而接下来的两个段落表示价格和运费。\n\
    \n然而，如果你进一步观察，即使是粗粗一瞥也能发现明显的人为错误。仍然使用上面的文档，最后一个产品名称在 `<h3>` 标签中可见，但在 `<h2>` 标签中却没有。\n\
    \n一个尝试解码该文档的计算机程序或软件，无法完成理解上述陈述所需的语义跳跃，最终将会失败。计算机将能够按照与标签关联的样式将文档渲染到浏览器中。HTML\
    \ 基本上是一组用于 Web 浏览器中渲染任何类型文档的指令，但它并不具备结构化和解码每个标签含义的能力。\n\n如果上面的文档是使用 `XML` 创建的，你可能会得到这些：\n\
    \n```xml\n<?xml version=\"1.0\"?>\n<productListing title=\"Shop Items\">\n  <product>\n\
    \    <name>Item A</name>\n    <description>Item A is an incredible brush that\
    \ can\n      make your hair shiner.</description>\n    <cost>$88.40</cost>\n \
    \   <shipping>$7.00</shipping>\n  </product>\n  <product>\n    <name>Item B</name>\n\
    \    ...\n  </product>\n  <product>\n    <name>Item C</name>\n    <description>This\
    \ is something so terrific that you will want\n      it in your home or office!\
    \ </p>\n    <cost>$89.50</cost>\n    <shipping>$7.00</shipping>\n  </product>\n\
    \  ...\n</productListing>\n```\n\n新文档中真的没有任何新内容，而且显然，没有关于显示的信息。\n\n此外，你是否曾经想过\
    \ `<product>` 标签在浏览器中会显示什么样？记住，当你使用 `XML` 时，你能够将信息与实际呈现分离。\n\n## 使用 XML\n\n`XML`\
    \ 可用于 Web 开发的各个方面。它通常用于存储和共享数据。\n\n`XML` 将数据与 `HTML` 分离。如果你必须 `HTML` 文档中显示动态数据，那么每次数据变化时你都必须编辑它。显然，这需要花费大量的时间和精力。\n\
    \n然而，通过 `XML`，你可以将数据存储在单独的文件中。这方便得多，因为你可以专注于使用 `CSS`/`HTML` 进行布局和显示。你还可以保证，对底层数据所做的更改不需要修改\
    \ `HTML`。此外，通过几行 `JavaScript` 代码，你还可以读取外部 `XML` 文件并更新你的 Web 页面内容。\n\n在虚拟世界中，计算机数据库和系统可能包含兼容格式的数据。但在现实世界中，情况并非如此。`XML`\
    \ 数据实际上是以纯文本格式存储的，以提供一种独立于硬件和软件的数据存储方式，并使其更容易于生成可供各种应用程序共享的数据。\n\n就像许多其他 Web 开发者一样，你可能在不兼容的系统之间交换数据时遇到困难。这样做会消耗你大量的时间和精力。幸运的是，通过\
    \ `XML`，你可以简化数据传输。如果你以 `XML` 交换数据，就可以避免过多的复杂性，因为即使对于不兼容且不同的应用程序，数据也是可读的。\n\n同样，`XML`\
    \ 简化了平台迁移。如你所知，升级到新系统（无论是软件还是硬件平台）都是耗时的。更重要的是，当必须转换大量数据时，不兼容的数据经常会丢失。正因如此，许多开发者感到沮丧。他们浪费了时间和精力，却没有得到他们期望的输出。\n\
    \n通过 `XML`，你可以将数据存储为文本格式，这样就可以快速升级或扩展到新的操作系统、浏览器或应用程序，而无需担心可能丢失数据。\n\n`XML` 还让数据更易可用。通过\
    \ `XML`，任何类型的读取设备都可以访问你的数据。语音设备、手持计算机和新闻推送都可以从 `XML` 和 `HTML` 页面中的数据源访问你的数据。即使是某些残障人士也可以轻松访问你的数据。例如，盲人访问你的内容将不会遇到困难。\n\
    \n许多网络语言实际上是用 `XML` 编写的。其中一些包括 `XML Schema`、`XHTML`、`SVG`、`RSS` 和 `WSDL`。\n\n\
    ***\n\n## 第二章 基础语法\n\n本节将提供编写 `XML` 文档时的简单语法规则信息。\n\n以下是一个完整的学生服。\n\n![](img/00001.jpeg)\n\
    \n你将在这个示例中看到两类信息：\n\n*   标记 - `<contact-info>`\n*   文本（字符数据）– Manny Dunphy 和 (895)\
    \ 444-111\n\n此图将为你提供使用 `XML` 编写不同类型的标记和文本的语法规则。\n\n![](img/00002.jpeg) ![](img/00003.jpeg)\n\
    \n### XML 声明\n\n文档可以有也可以没有 XML 声明。可以这样写：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n```\n\n### 元素与标签\n\n`XML` 元素被称为 XML 的构建模块。它们表现为容器，持有以下任何内容：文本、元素、属性。它们可以由起始标签和结束标签或空元素来分隔。\n\
    \n#### 语法\n\n```xml\n<element-name attribute1 attribute2>\n  content\n</element-name>\n\
    ```\n\n元素名称指的是元素的名称，起始和结束标签的大小应匹配。\n\n#### 属性\n\n`attribute1`, `attribute2` 是由空格分隔的元素属性。属性指的是元素的属性。它与名称和值关联，如下：\n\
    \n```xml\nname = \"value\"\n```\n\n### 空元素\n\n没有内容的元素显示为：\n\n```xml\n<name attribute1\
    \ attribute2.../>\n```\n\n带有不同元素的 XML 文档如下：\n\n```xml\n<contact-info>\n  <address\
    \ category=\"business\">\n    <name>Manny Dunphy</name>\n    <company>Real Realtor</company>\n\
    \    <phone>(895) 444-111</phone>\n  <address/>\n</contact-info>\n```\n\n### 规则\n\
    \n*   名称应包含字母、数字以及这些标点符号：连字符 (`-`）、下划线 (`_`）和句号 (`.`)。\n*   它们大小敏感：`Address` 和\
    \ `address` 不同。\n*   起始和结束标签应匹配。\n*   元素可以包含文本或元素。\n\n### XML 注释\n\n在 XML 中，编写注释的语法与\
    \ HTML 相同。这是注释的语法：\n\n```xml\n<!--An example of a comment -->\n```\n\n### 参考\n\
    \n![](img/00004.jpeg) ![](img/00005.jpeg) ![](img/00006.jpeg) ![](img/00007.jpeg)\
    \ ![](img/00008.jpeg) ![](img/00009.jpeg) ![](img/00010.jpeg) ![](img/00011.jpeg)\n\
    \n### 语法\n\n等等，![](img/00012.jpeg)\n\n### XML 中的换行\n\nWindows 应用程序通常将换行存储为回车和换行符\
    \ (CR + LF)。旧的 Mac 系统将换行存储为回车，而 Mac OSX 和 Unix 则存储为换行符。相反，XML 将其存储为换行符。\n\n###\
    \ XML 中的空格\n\n与 HTML 不同，XML 文中的多个空格不会被截断。HTML 实际上会将多个空格截断为单个空格。\n\n"
- fmt: "\n# Attributes\n\nAttributes are part of the elements. Every element may contain\
    \ multiple and unique attributes. The attribute specifies a single property for\
    \ the element, with the use of a name and value or name pair. The XML-elements\
    \ can have one or more attributes:\n\n## Syntax\n\n```xml\n<element-name attribute1\
    \ attribute2 >\n\n....content..\n\n< /element-name>\n```\n\nWherein `attribute1`\
    \ and `attribute2` appear like this:\n\n`name = “value”`\n\nValue may be inside\
    \ a (`‘ ‘) or a double (“ ”) quote. Attributes are needed to add a distinctive\
    \ label to an element, put the label in a category, add a Boolean flag, or associate\
    \ with a string of data.\n\n## Use of Attributes\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"UTF-8\"?>\n\n<!DOCTYPE farm [\n\n<!ELEMENT farm (vegetables)*>\n\
    <!ELEMENT vegetables (#PCDATA)>\n<!ATTLIST vegetables category CDATA #REQUIRED>\n\
    ]>\n\n<farm>\n<vegetables category=\"pumpkin\" />\n<vegetables category=\"tomato\"\
    >\n</vegetables>\n</farm>\n```\n\nAttributes distingue the elements with the same\
    \ names. An attribute may add a tiny detail to differentiate two or more elements\
    \ with the same name.\n\nIn this example, the vegetables were categorized with\
    \ the inclusion of the attribute `category` and the use of varying values to each\
    \ of the elements, giving you two vegetable categories one pumpkin, and one tomato.\
    \ So, there are two vegetable elements with dissimilar attributes.\n\n## Types\
    \ of Attributes\n\n| Type of Attribute | Description |\n| :--- | :--- |\n| String\
    \ Type | Value is any literal string type. `CDATA` (character data) is a String\
    \ Type. Meaning, any string type of markup characters can be considered as part\
    \ of the attribute. |\n| Tokenized Type | Characteristically, this type is more\
    \ constrained. `ID` – identifies a unique element. `IDREF` – references an ID\
    \ used to name another element. `IDREFS` – references all the IDs of an element.\
    \ `ENTITY` – this indicates that the attribute represents external entities in\
    \ the XML document. `ENTITIES` – the attribute is representing external entities\
    \ in the XML document. `NMTOKEN` – this is similar to the `CDATA`, only with restrictions\
    \ on the data that would be considered as part of the attribute. `NMTOKENS` –\
    \ similar to the `CDATA`, but with restrictions on the data as part of the attribute.\
    \ |\n| Enumerated Type | This contains predefined values, out of which, one value\
    \ has to be assigned. `Notation Type` – declares that a particular element shall\
    \ be referenced to a `NOTATION`, to be declared somewhere in the document. `Enumeration`\
    \ – it allows user to define a specific list of values that must match the attribute\
    \ value. |\n\n## Rules for Element Attribute\n\n- The attribute name should not\
    \ appear more than once in the same tag.\n- There are no direct or indirect entity\
    \ references to external entities in attribute values.\n- The Document Type Definition\
    \ (`DTD`) should reflect an attribute with the use of the `Attribute-List-Declaration`.\n\
    - The replacement text must not contain a less than sign (`<`).\n\n## XML Attribute\
    \ Values Have to Be Quoted\n\nIn XML, the elements can have name/value pair attributes\
    \ just like in HTML. However, the attributes in XML have to be quoted at all times.\
    \ Consider the following sets of examples:\n\n```xml\n< note date = 12/25/2015\
    \ >\n    <to> Jane </to>\n    <from> John </from>\n</note>\n```\n\nThe example\
    \ shown above is an incorrect way to use the `date` attribute. You have to keep\
    \ in mind that quotes are necessary for attributes to work. In order to correct\
    \ the mistake made in the above example, you have to edit your code and re-write\
