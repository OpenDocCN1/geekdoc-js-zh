    unique attributes. The attribute specifies a single property for the element,
    with the use of a name and value or name pair. The XML-elements can have one or
    more attributes:


    Syntax


    <element-name attribute1 attribute2 >


    ....content..


    < /element-name>


    Wherein attribute1 and attribute2 appear like this:


    name = “value”


    Value may be inside a (‘ ‘) or a double (“ “) quote.  Attributes are needed to
    add a distinctive label to an element, put the label in a category, add a Boolean
    flag, or associate with a string of data.


    Use of Attributes


    <?xml version="1.0" encoding="UTF-8"?>


    <!DOCTYPE farm [


    <!ELEMENT farm (vegetables)*>


    <!ELEMENT vegetables (#PCDATA)>


    <!ATTLIST vegetables category CDATA #REQUIRED>


    ]>


    <farm>


    <vegetables category="pumpkin" />


    <vegetables category="tomato">


    </vegetables>


    </farm>


    Attributes distinguish the elements with the same names. An attribute may add
    a tiny detail to differentiate two or more elements with the same name.


    In this example, the vegetables were categorized with the inclusion of the attribute
    category and the use of varying values to each of the elements, giving you two
    vegetable categories one pumpkin, and one tomato. So, there are two vegetable
    elements with dissimilar attributes.


    Types of Attributes


    | Type of Attribute | Description |


    | String Type | Value is any literal string type. CDATA (character data) is a
    String Type. Meaning, any string type of markup characters can be considered as
    part of the attribute. |


    | Tokenized Type | Characteristically, this type is more constrained.ID –  identifies
    a unique element.IDREF – references an ID used to name another element.IDREFS
    – references all the IDs of an element.ENTITY – this indicates that the attribute
    represents external entities in the XML document.ENTITIES – the attribute is representing
    external entities in the XML document.NMTOKEN – this is similar to the CDATA,
    only with restrictions on the data that would be considered as part of the attribute.NMTOKENS
    – similar to the CDATA, but with restrictions on the data as part of the attribute.
    |


    | Enumerated Type | This contains predefined values, out of which, one value has
    to be assigned.Notation Type – declares that a particular element shall be referenced
    to a NOTATION, to be declared somewhere in the document.Enumeration – it allows
    user to define a specific list of values that must match the attribute value.
    |


    Rules for Element Attribute


    *   The attribute name should not appear more than once in the same tag.


    *   There are no direct or indirect entity references to external entities in
    attribute values.


    *   The Document Type Definition (DTD) should reflect an attribute with the use
    of the Attribute-List-Declaration.


    *   The replacement text must not contain a less than sign (<).


    XML Attribute Values Have to Be Quoted


    In XML, the elements can have name/value pair attributes just like in HTML. However,
    the attributes in XML have to be quoted at all times. Consider the following sets
    of examples:


    < note date = 12/25/2015 >


