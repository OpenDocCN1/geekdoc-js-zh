    Google Chrome is one of the major browsers that support XML. So if you are using
    this browser, you are in luck. You can easily open your XML code.


    ## Using Mozilla Firefox


    Mozilla Firefox also supports XM, but first, you have to open your code in Google
    Chrome. To do this, you have to double click on your file. You will then see your
    code displayed in colorful text. This is great because you will be able to read
    your code more easily. At the left portion of the element, you will see the plus
    (`+` ) sign and the minus (`-` ) sign. If you click on the plus (`+` ) sign, your
    code lines will expand. On the other hand, if you click on the minus (`-` ) sign,
    your code will be hidden.


    ## Document Errors in XML


    If you notice that your code has certain tags missing, you may have an error.
    If so, you will see a message that tells you about the error that you have. Take
    a look at the following example:


    ```xml

    <?xml version = “1.0”?>


    <contact-information>


    <company> Sample Company </company>


    <name> Jane Doe </name>


    <phone> (045) 123-5678 </phone>


    </cntact-information>

    ```


    If you open the above given code in Google Chrome, you will receive an error message.
    As you can see, the start tag `<contact-information>` and the end tag `</cntact-information>`
    do not match.


    ## Editors in XML


    An editor is a markup language editor. Documents in XML can be created and edited
    with the use of existing editors. For instance, you can use Wordpad, Notepad,
    or any other text editor on your computer. You can even use a professional editor
    online if you want to download. Online editors usually have more powerful editing
    features. They automatically close tags that are left open and they strictly check
    syntax. They highlight syntax with color for easier readability as well as provide
    automatic verification of documents against schemas and DTDs. They are also helpful
    in writing valid codes in XML.


    ### Open Source Editors in XML


    In XML, you can choose from a variety of editors. The available open source editors
    include the following:


    - **Xerlin**: It is an open source editor developed for the `Java 2` platform,
    which was released under the Apache license. Since it is a Java based modelling
    application, it can be used to create and edit files in XML much more easily.

    - **Content Assembly Mechanism (CAM)**: It is an editor tool that features `XML
    + JSON + SQL Open-XDX` which is sponsored by Oracle.


    ## Chapter 15 Parsers and Processors in XML


    In XML, a parser is a package or software library that provides an interface for
    a client application to work with a document. It checks the document and verifies
    if it has the right format. It can also validate the documents. Today, most browsers
    include built-in parsers for XML, so you do not have to worry about your browser
    not supporting it. It is unusual for major browsers to not have a built-in parser.


    To help you understand parsers better, here is a diagram that demonstrates how
    a parser interacts with a document in XML:


    ![](images/00034.jpeg) ![](images/00035.jpeg) ![](images/00036.jpeg)

    ![](images/00037.jpeg) ![](images/00038.jpeg)


    The primary goal of the parser is to turn XML into a code that is readable and
    understandable. In order to make the process of parsing easier, certain commercial
    products can be used. These products are available for breaking down XML documents
    and yielding more reliable results. The following are some of the most commonly
    used parsers:


    - **Microsoft Core XML Services (MSXML)**: It is the standard set of XML tools
    available in Microsoft. It includes a parser.

    - **Java built-in parser**: It is the parser solely available in the `Java` library.
    This library is developed in a way that a user can replace such built-in parser
    with an external implementation, such as `Saxon` or `Xerces` from Apache.

    - **Xerces**: It is developed by the Apache Software Foundation, which is a well-known
    open source. It is also implemented in Java.

    - **Saxon**: It offers tool for the purpose of parsing, querying, and transforming
    XML.

    - **System.Xml.XmlDocument**: It is a class that is part of the `.NET` library.
    This library contains numerous classes that are related to working with XML.


    ## Processors in XML


    Processing the XML is whenever a software program reads a document and then takes
    the necessary action. A program that has the ability to process and read documents
    in XML is referred to as an XML processor. The XML processor reads the file and
    transforms it into in-memory structures that are accessible to the other parts
    of the program. The most vital processor reads the documents and turns them into
    internal representations that the other subroutines or programs can use. This
    is known as the parser. It is actually a crucial component in the processing programs
    of XML.


    ### Types of Processors


    The processors are mainly classified into two types, which are validating and
    non-validating. These types depend on whether or not the processors check the
    documents for validity. The processors that discover validity errors should report
    such errors. Nevertheless, they may continue or resume with their normal processing.


    Some of the validating parsers include: `xml4c` (C++, IBM), `xml4j` (Java, IBM),
    `MSXML` (Java, Microsoft), `TclXML` (TCL), `XML :: Parser` (Perl), `xmlproc` (Phyton),
    and `Java Project X` (Java, Sun).


    Some of the non-validating parsers include: `OpenXML` (Java), `xp` (Java), `Lark`
    (Java), `AElfred` (Java), `XParse` (JavaScript), `expat` (C), and `xmllib` (Phyton).


    ## Processing Instructions in XML


    The processor is about processing instructions. Processing Instructions are actually
    special tags that include instructions to the software on how to use the document.
    If you are a beginner, you may think that Processing Instructions are complicated.
    However, Processing Instructions are not used very often.


    ### Importance of Processing Instructions


    If you are used to using HTML, you have probably noticed that it does not have
    Processing Instructions. Whenever you have to send out instructions to the software,
    you need to misuse the comment tag. A classical example of this misuse is the
    Server Side Includes (SSI). Take a look at the following example of an SSI that
    includes a file.


    ```

    <!-- include virtual = “samplefile.txt” -->

    ```


    Yes, this may seem like a smart and practical idea. However, you have to keep
    in mind that it is still a misuse of the comment tag. The comment tag has a specific
    purpose and that is to include comments in the program. It is not designed to
    be used this way. Nonetheless, if your HTML page has an `shtml` file extension,
    the Web server will search for SSI and process it before your page is sent to
    your browser.


    Another way to serve CSS and optimized markup for the Internet browser more easily
    is to use conditional comments. Take a look at the following example:


    ```

    <!--—(if IE 6)>

    <link rel = “stylesheet” type = “text/css” href = ie6only.css>

    <! (endif)-->

    ```


    Again, this is another way to use a comment tag. However, it is still a misuse
    because you are not using the comment tag to insert comments in the program.


    Because of the misuse of the comment tag for other purposes, developers have found
    a way to beat these limitations in the XML. They have acknowledged that there
    are special needs that may not be possible to foresee. These special needs are
    actually much more likely to occur in XML than in HTML. In addition, the Processing
    Instructions tag was developed in order to protect the comment tag against misuse.
    It was also developed to offer a flexible universal mechanism for every type of
    special need that is not immediately solved by attributes and elements.


    ### Processing Instructions


    Processing Instructions make it possible for documents to have instructions for
    applications. They are, however, not part of the character data of these documents.
    They also have to be passed through to the applications.

