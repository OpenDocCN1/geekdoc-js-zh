    \n*   The name should have alphanumeric characters with only these punctuation\
    \ marks: the hyphen (`-`), underscore (`_`), and a period (`.`).\n*   They are\
    \ case sensitive: `Address` and `address` are not the same.\n*   The beginning\
    \ and end tags should match.\n*   The element may contain text or elements.\n\n\
    ### Comments in XML\n\nIn XML, the syntax for writing comments is the same as\
