                  <from> John </from>


    </note>


    The example shown above is an incorrect way to use the date attribute. You have
    to keep in mind that quotes are necessary for attributes to work. In order to
    correct the mistake made in the above example, you have to edit your code and
    re-write it into something like this:


    < note date = “12/25/2015” >


                  <to> Jane </to>


                  <from> John </from>


    </note>


    XML References


    The references normally enable you to include additional markup or text in the
    XML document. These references should always begin with this symbol: “&”, a reserved
    character that will have an ending symbol of ";".


