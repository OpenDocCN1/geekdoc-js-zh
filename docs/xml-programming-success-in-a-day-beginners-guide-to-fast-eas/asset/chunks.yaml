    ```xml

    <! ELEMENT memo (to, from, heading, body)>

    <! ELEMENT to (#PCDATA)>

    <! ELEMENT from (#PCDATA)>

    <! ELEMENT heading (#PCDATA)>

    <! ELEMENT body (#PCDATA)>

    ]>

    ```


    In the example given above, `#PCDATA` refers to parse-able text data. Parsed Character
    Data (`PCDATA`) is actually a data definition that came from the Standard Generalized
    Markup Language (`SGML`). It is also used in Extensible Markup Language Document
    Type Definition for designating mixed content elements in `XML`.


    Still referring to the example shown above, `DTD` is interpreted as follows:


    - `!DOCTYPE memo` states that the root element of the `XML` document is `memo`.

    - `!ELEMENT memo` states that the `memo` element has to have four elements, which
    are to `to`, `from`, `heading`, and `body`.

    - `!ELEMENT to` states that the `to` element belongs under the `#PCDATA` type.

    - `!ELEMENT from` states that the `from` element belongs under the `#PCDATA` type.

    - `!ELEMENT heading` states that the `heading` element belongs under the `#PCDATA`
    type.

    - `!ELEMENT body` states that the `body` element belongs under the `#PCDATA` type.


    You can also use a doctype declaration to define character strings and special
    characters. Remember that an entity has to include an ampersand (`&`), a semicolon
    (`;`), and an entity name.


    Then again, a `DTD` or `Schema` is not required in `XML`. Thus, you may only be
    wasting your time if you create a `DTD` when you work with small files or experiment
    with `XML`.


    If you are developing an application, you must wait until you get a stable specification
    before you add a definition to the document. Otherwise, you may receive validation
    errors that may cause your software to stop working.


    # Chapter 5 The XML Declaration


    The `XML` declaration consists of details put in order by an `XML` processor to
    break down and analyze the `XML` document. This is optional, however, when it
    is utilized; it has to appear in the first line of the `XML` document.


    ### Syntax


    ```xml

    <?xml

    version="version_number"

    encoding="encoding_declaration"

    standalone="standalone_status"

    ?>

    ```


    The above is a syntax showing `XML` declaration.


    Each of the parameters have their own name, equal sign (`=`), and value inside
    a quote. This table above shows the detailed `XML` syntax parameters:


    | Parameter | Parameter_value | Parameter_description |

    | :--- | :--- | :--- |

    | Version | 1.o | The `XML` standard version supposed to be used. |

    | Encoding | UTF-8, UTF 16, ISO-8859-1 to ISO-8859-9, ISO 10646-USC-2, ISO 10646-USC-4,
    ISO-2022-JP, EUC-JP, JIS | Defines the character encoding as used in the content.
    The default encoding used is UTF-8. |

    | Standalone | yes or no | It alerts the parser if the document relies on information
    from an external source, like the external document type definition or `DTD`,
    for its contents. `No` is the default value. When you set it to `yes`, it indicates
    that there are no declarations needed for parsing the `XML` document. |


    ### Rules to Keep in Mind


    - If there is `XML` declaration in the `XML`, it has to be positioned as the first
    line in the `XML` document.

    - The `XML` declaration should contain the version number attribute.

    - Parameter values and names are case-sensitive.

    - Names should always be in lower case.

    - The parameter name should be in proper order: `version`, `encoding`, `standalone`.

    - You can use either the single or double quotes.

    - `XML` declaration does not contain a closing tag, like `</?xml>`.

    - The `XML` declaration should always be in lowercase, except when encoding declarations.

    - If there are elements, entities, or attributes in the `XML` document that are
    defined or referenced in an external `DTD`, there should be `standalone = “no”`.


    ### XML Declaration Example


    With all the parameters defined:


    ```xml

    <?xml> version=’1.0’ encoding=’iso-8859-1’ standalone=’no’

    ```


    # Chapter 6 XML Comments and Character Entities


    `XML` comments are like the `HTML` comments. They are added as notes to help understand
    the purpose of a particular `XML` code. They can be used to include related information,
    terms, and links. However, they can only be seen in the source code, and not in
    the `XML` code.


    ### Syntax


    ```xml

    <!-------Your comment----->

    ```


    An `XML` comment always begins with `<!—` and ends with `-->`. Notes can be added
    as comments in between the characters. It is not advisable to nest one comment
    inside another.


    ### Example


    ```xml

    <?xml version="1.0" encoding="UTF-8" ?>


    <!---Test scores are uploaded by grade---->

    <class_list>

    <student>

    <name>Lilly</name>

    <grade>B+</grade>

    </student>

    </class_list>

    ```


    ### XML Character Entities


    An `XML` entity is the root of the entity tree and the starting-point for the
    `XML` processor. It is the placeholder in `XML`. Entities can be acknowledged
    being in the document prolog or the `DTD`. There are symbols that are to be used
    exclusively for entities that cannot be used as content in the `XML` code; this
    is true for both `XML` and `HTML`. For instance, `<` and `>` are used for the
    opening and closing tags. The character entities are used to make these special
    characters visible.


    There are some special characters and symbols that are not directly available
    via a computer keyboard. Character entities are used to display these special
    characters.


    ### Types of Character Entities


    #### Predefined Character Entities


    These are introduced to prevent ambiguity when some symbols are used. For example,
    there is ambiguity when the symbols (`<`) and (`>`) are used with the angle tag
    (`<>`). The character entities are used to delimit tags. Here are specifications
    of pre-defined character entities. The following can be used to express the characters
    without resulting in ambiguity.


    - Greater than: `&gt;`

    - Less than: `&lt;`

    - Ampersand: `&amp;`

    - Single quote: `&apos;`

    - Double quote: `&quot;`


    #### Numerical Character Entities


    This type uses number reference to define a character entity. It can either be
    in hexadecimal or decimal format. There are thousands of numeric references known
    to man and they are not easy to remember.


    The numeric reference is a number in the Unicode character set. This is the syntax
    for decimal number reference:


    ```text

    &# decimal number ;

    ```


    This is the syntax for hexadecimal reference:


    ```text

    &#x hexadecimal number ;

    ```


    This table shows some the commonly used predefined character entities:


    | Entity name | Character | Decimal reference | Hexadecimal reference |

    | :--- | :--- | :--- | :--- |

    | Quot | “ | `&#34;` | `&#x22;` |

    | Amp | `&` | `&#38;` | `&#x26;` |

    | Apos | ‘ | `&#39;` | `&#x27;` |

    | Lt | `<` | `&#60;` | `&#x3C;` |

    | Gt | `>` | `&#62;` | `&#x3E;` |


    #### Named Character References


    Remembering all the numeric characters would be too hard; hence, the most preferred
    by users is the named character entity. Here are some examples:


    - `Acute` refers to the capital `Á` character with acute accent.

    - `Ugrave` is the name given to the small `ù` with grave accent.


    # Chapter 7 CDATA Sections and Whitespaces


    CDATA is Character Data; it refers to blocks of text not parsed by the assigned
    parser, but are still recognized as markup. Keep in mind that CDATA sections and
    CDATA attributes are not related. CDATA attributes are strings and allow any text.


    In an `XML` document, the CDATA section commands the parser to ignore the markup
    characters. Take a look at source code listings in `XML` documents. They may have
    characters that the parser would normally consider as markup, such as `&` and
    `<`. In order for these characters to be passed onto the application, a CDATA
    section is necessary. Consider the following example:


    ```xml

    <! [CDATA [

    *x = &y;

    A = ( j <= 5 );

    ] ] >

    ```


    Between the beginning and end of the section showed above, all of the character
    data are directly passed onto the application without any interpretation. Entity
    references, elements, processing instructions, and comments are not recognized
    and whatever character comprises them is passed literally onto the application.
    `]] >` is the only string that can never occur in a CDATA section.

