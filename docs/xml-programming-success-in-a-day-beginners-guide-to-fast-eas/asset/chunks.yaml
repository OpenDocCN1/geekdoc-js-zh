    ## Introduction\n\nI want to thank you and congratulate you for downloading the\
    \ book,“XML Programming Success in a Day”. This book contains proven steps and\
    \ strategies on how to do XML programming. Even if you are not knowledgeable about\
    \ computers and programming, this book will help you understand what XML is all\
    \ about. It will also help you discover its potential. Remember, XML is among\
    \ the most powerful markup languages that you can learn without being a true-blue\
    \ technology expert. Thanks again for downloading this book, I hope you enjoy\
    \ it!\n\n## Chapter 1 What is XML Programming?\n\n`XML`, or Extensible Markup\
    \ Language, is recognized as a technical revolution that is almost comparable\
    \ to the invention of the wheel and sliced bread. It is probably the most hyped\
    \ technology in the late 1990’s up to the present, though Java is a close second.\n\
    \nSo what is the big deal about XML? For one, you can use it to make your Web\
    \ applications more powerful, more versatile, and smarter.\n\n### What is XML?\n\
    \nYou know now that `XML` stands for Extensible Markup Language. `XML` is text-based\
    \ and derived from the Standard Generalized Markup Language or `SGML`. `XML` tags\
    \ identify, organize, and store data. It is not the same as the `HTML` tags which\
    \ display the data. There is no way that `XML` would replace `HTML` in the future,\
    \ however, it introduces a lot of possibilities by adopting some useful features\
    \ of `HTML`.\n\nSo basically, `XML` is both a hardware-independent and software-independent\
    \ tool used to carry information. Even though it is a markup language that is\
    \ very similar to `HTML`, it is an entirely different entity. `XML` was designed\
    \ to focus on the data while `HTML` was designed to focus on the appearance of\
    \ the data. `XML` describes the data while `HTML` displays the data. `XML` is\
    \ all about carrying information while `HTML` is about displaying the information.\n\
    \nIn addition, `XML` is designed to be self-descriptive. In order to be highly\
    \ efficient in `XML`, it is important for you to have at least a basic understanding\
    \ of `HTML` and `JavaScript`. The tags in `XML` are also not predefined. Hence,\
    \ you need to define your own tags.\n\nTake a look at the following example:\n\
    \n```xml\n<note>\n    <to> Jane </to>\n    <from> John </from>\n    <heading>\
    \ Memo </heading>\n    <body> Come to the meeting at ten o’clock in the morning\
    \ tomorrow. </body>\n</note>\n```\n\nAs you can see, the example given above is\
    \ quite self-descriptive. You can see the information about both the sender and\
    \ the receiver. It also contains a heading and a message body. Nevertheless, you\
    \ should realize that this `XML` document is merely information that contains\
    \ tags. It does not have a specific function. In other words, it is useless and\
    \ does not do anything important. In order for you to be able to send, display,\
    \ or receive this note, you need to use a software program.\n\nIn `XML`, you define\
    \ your own tags. Using the example given above, you can see that the tags are\
    \ not defined in a particular `XML` standard. The tags are “invented” by the author\
    \ of the document. As a programmer, you have the freedom to invent whatever tags\
    \ you like. You also have the freedom to create your own document structure.\n\
    \n`XML` is a language that does not have any predefined tags. `HTML`, on the other\
    \ hand, has predefined tags that you need to use in your codes. Documents in `HTML`\
    \ are only allowed to use the tags defined in the `HTML` standard, such as `<h1>`\
    \ and `<p>`.\n\nThere are three characteristics of `XML`, as can be deduced from\
    \ its name:\n\n- **Extensible**: `XML` allows you to characterize your own tags\
    \ to make them suitable to your applications. It also enables you to extend the\
    \ concept of what a document is: a file that lives on a file server. It can also\
    \ be a temporary piece of data flowing between different Web services.\n- **Markup**:\
    \ The tags or elements are the most familiar feature of `XML`. The `XML` elements\
    \ that you will be creating will be comparable to the elements that you have been\
    \ used to using in `HTML` documents. The only difference is that with `XML`, you\
    \ are able to define your own set of tags or elements.\n- **Language**: The language\
    \ used in `XML` and `HTML` are almost identical, but `XML` is more flexible as\
    \ it gives you the chance to make your own tags. `XML` is more than just a language.\
    \ It is a meta-language.\n\n### Do You Need XML?\n\nYou need `XML` because `HTML`\
    \ is used specifically to display. For the non-computer expert, `HTML` is simply\
    \ a presentation language, while `XML` is a data-description language. Here's\
    \ the usual kind of code you will see by inspecting an e-commerce site's product\
    \ listing:\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.0 Transitional//EN\"\
    \ \"http://www.w3.org/TR/REC44/transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    >\n<head>\n<title>Shop Items</title>\n<meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=iso-8859-1\" />\n</head>\n<body>\n<h1>Shop Items</h1>\n<h2>Item\
    \ A</h2>\n<p>Item A is a remarkable tool that can make your chores much easier.</p>\n\
    <p><b>Price: $35.00</b></p>\n<p><b>Shipping: $8.00</b></p>\n<h2>Item B</h2>\n\
    ...\n<h3>Item C</h3>\n<p><i>Price: $55.99</i></p>\n<p>This is so wonderful that\
    \ you will never regret buying it.</p>\n...\n</body>\n</html>\n```\n\n## Learning\
    \ About the Semantics and Jargons\n\nSemantics is the study of the meaning of\
    \ any language. It’s a fact that humans are better at semantics compared to computers,\
    \ simply because humans are excellent in deriving meanings. There is always a\
    \ meaning in every action or language; for humans, it is easy to draw conclusions\
    \ on what they are presented in front of them.\n\nFor instance, you were asked\
    \ to list down as many names for female animals as you can, you are most likely\
    \ begin with doe, tigress, lioness, or ewe. On the other hand, if you were given\
    \ a list of names with categories, you are more than likely going to say female\
    \ animals. In addition, if you were asked what a lioness is, you’ll immediately\
    \ say “a female lion.”\n\nFrom the above illustrations, computers do not have\
    \ the capability to do that. It’s a shame, though, since a lot of computing tasks\
    \ need semantic skill. In this regard, computers need help.\n"
