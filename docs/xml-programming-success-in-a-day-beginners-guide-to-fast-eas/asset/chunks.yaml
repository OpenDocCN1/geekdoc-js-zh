    entities will have to be used, the choices are listed below:


    | Characters that are Not Allowed | Replacement Entity | Description |


    | < | &lt; | Less than |


    | > | &gt; | Greater than |


    | & | &amp; | Ampersand |


    | ‘ | &apos; | Apostrophe |


    | “ | &quot; | Quotation mark |


    Chapter 4 XML Documents


    The basic unit of XML information, the XML document, consists of elements and
    markups in an organized package, and has a variety of data. Examples of XML documents
    are a database of numbers, a mathematical equation, and numbers that represent
    molecular structure.


    Example


    A simple XML document looks like this:


    ![](images/00012.jpeg) ![](images/00013.jpeg)<?xml version="1.0"?>             
                                                                          Document
    Prolog


    <contact-info>


    ![](images/00014.jpeg)<name>Elaine Cooper</name>


    ![](images/00015.jpeg)<company>Science Joint</company>                           
                                Document Element


    <phone>(555) 115-8452</phone>             


    </contact-info>


    Parts of an XML Document


    Document Prolog – It is found at the top of the document just before the root
    element. It contains the XML declaration and the document type declaration. (You’ll
    learn more about this when XML declaration is discussed in the next chapter.)


    Document Elements Section – The document elements are the main building blocks
    of XML. These elements divide the document into sections, each are serving their
    own purpose. You are allowed to separate an XML document into different sections
    so rendering is easier. Doing so would also allow other search engines to take
    a tab for it. These elements can be containers , with a combination of elements
    and text.


    Types of Document


    A document with a correct syntax is described as well formed. Valid documents
    have to conform to document type definitions. The rules that define the legal
    attributes and elements for the documents in XML are known as XML Schemas or Document
    Type Definitions (DTD). The DTD is the original Document Type Definition and the
    XML Schema is an XML-based alternative to it.


    All XML documents have to have a root element. Their elements should have a closing
    tag and should be nested properly. Their attribute values should be quoted and
    their tags should match since they are case sensitive. Consider the following
    example of a well formed XML document:


    <?xml version = “1.0” encoding = “UTF – 8”?>


    <note>


    <to> John </to>


    <from> Jane </from>


    <heading> Memo </heading>


    <body> Do not forget the meeting scheduled for tomorrow afternoon. </body>


    </note>


    Using the DTD or Schema


    Anyone can use a standard DTD to interchange data. Your application can make use
    of it for data verification purposes. In other words, you can use DTD to find
    out if the data you obtained from external sources are valid. In addition, you
    can use DTD to check and verify your own data.


    Its main purpose is to define the structure of a document in XML. It uses a list
    of legal elements to define such structure. To help you understand this further,
    consider the following example:


