  trans: "\n\n*   文档类型声明始终位于文档的开头。\n*   元素声明始终以感叹号开头。\n*   文档类型声明中指示的名称应与根元素的元素类型匹配。\n\
    \n## 外部 DTD (External DTD)\n\nDTD 元素定义在 XML 文件外部的。`standalone` 属性必须设置为 `no` 才能引用外部\
    \ DTD。\n\n### 语法\n\n```\n<!DOCTYPE root-element SYSTEM \"file-name\">\n```\n\n\
    ### 示例\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\" ?>\n\
    \n<!DOCTYPE address SYSTEM \"address.dtd\">\n\n<address>\n<name>Dunny Bobbins</name>\n\
    <company>Real Realtors</company>\n<phone>(077) 554-4453</phone>\n</address>\n\
    ```\n\n`address.dtd` 的内容如下：\n\n```xml\n<!ELEMENT address (name,company,phone)>\n\
    <!ELEMENT name (#PCDATA)>\n<!ELEMENT company (#PCDATA)>\n<!ELEMENT phone (#PCDATA)>\n\
    ```\n\n### 外部 DTD 的类型\n\n*   系统标识符 – 这允许你指定外部文件的位置。\n    ```\n    <!DOCTYPE name\
    \ SYSTEM \"address.dtd\" [...]>\n    ```\n*   公共标识符 – 提供定位 DTD 资源的机制。\n```\n<!DOCTYPE\
    \ name PUBLIC \"-//Beginning XML//DTD Address Example//EN\">\n```\n\n## 第 10 章\
    \ XML Schema (XML Schemas)\n\nXML Schema 通常被称为 XML Schema Definition 或 `XSD`。它可以用于验证结构和内容，同时描述\
    \ XML 数据的内容。\n\n### 语法\n\n```xml\n<xs:schema xmlns:xs=\"http://www.business.com/2012/XMLSchema\"\
    >\n```\n\n### 示例\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<xs:schema\
    \ xmlns:xs=\"http://www.business.com/2012/XMLSchema\">\n<xs:element name=\"contact\"\
    >\n<xs:complexType>\n<xs:sequence>\n<xs:element name=\"name\" type=\"xs:string\"\
    \ />\n<xs:element name=\"company\" type=\"xs:string\" />\n<xs:element name=\"\
    phone\" type=\"xs:int\" />\n</xs:sequence>\n</xs:complexType>\n</xs:element>\n\
    </xs:schema>\n```\n\n### 定义类型\n\n*   简单类型（Simple Type） – 用于文本上下文。\n    ```\n \
    \   <xs:element name=\"phone_number\" type=\"xs:int\" />\n    ```\n*   复杂类型（Complex\
    \ Type） – 这是其他元素定义的容器。\n    ```\n    <xs:element name=\"Address\">\n<xs:complexType>\n\
    <xs:sequence>\n<xs:element name=\"name\" type=\"xs:string\" />\n<xs:element name=\"\
    company\" type=\"xs:string\" />\n<xs:element name=\"phone\" type=\"xs:int\" />\n\
    </xs:sequence>\n</xs:complexType>\n</xs:element>\n    ```\n*   全局类型（Global Types）\
    \ – 可以定义在类型文档文件中。\n    ```\n    <xs:element name=\"AddressType\">\n<xs:complexType>\n\
    <xs:sequence>\n<xs:element name=\"name\" type=\"xs:string\" />\n<xs:element name=\"\
    company\" type=\"xs:string\" />\n</xs:sequence>\n</xs:complexType>\n</xs:element>\n\
    \    ```\n\n## 第 11 章 标签与元素 (Tags and Elements)\n\nXML 标签是 XML 最重要的部分之一。它们实际上是这种语言的基础。它们定义了元素的范围，声明了解析环境所需的设置，插入特殊指令并插入注释。XML\
    \ 标签分为以下几类：\n\n### 起标签 (Start Tag)\n\n起始标签标记所有非空 XML 元素的开始。例如：\n\n```\n<address>\n\
    ```\n\n### 空标签 (Empty Tag)\n\n在起始标签和结束标签之间有文本，被称为内容。如果一个元素没有内容，则被描述为空。空元素通常以两种方式表示，如下：\n\
    \n1.  结束标签紧跟在起始标签之后，例如：\n```\n<hr> </hr>\n```\n2.完整的空元素标签，例如：\n```\n<hr />\n```\n\
    空元素标签可以用于任何没有任何内容的元素。\n\n### 结束标签 (End Tag)\n\n如果元素有起始标签，则必须有结束标签。例如：\n\n```\n\
    </address>\n```\n注意，结束标签在元素名称之前有一个斜杠 ( `/` )。\n\n### 在 XML 中使用标签的规则\n\n*   与其他语言不同，XML\
    \ 实际上是区分大小写的。这意味着在使用大写字母和小写字母时你必须小心。请记住，XML 中的标签应该是全大写或全小写。一个微小的错误就可能导致不预期的结果，因此建议在输入或完成代码前检查您的代码。查看以下在行代码中使用的错误语法示例：\n\
