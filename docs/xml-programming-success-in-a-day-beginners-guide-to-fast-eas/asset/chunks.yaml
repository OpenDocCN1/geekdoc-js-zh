    \ the following example of a wrong syntax used in a line code:\n\n<address> </Address>\n\
    \nAs you can see, the first letter in the end tag is capitalized while the rest\
    \ of the letters are not. Because there is a case difference in both of the tags,\
    \ XML treats it as an erroneous syntax. In order to fix this error, you need to\
    \ use the same case in both your start tag and end tag. This is the correct syntax:\n\
    \n<address> </address>\n\n*   Another rule for using tags in XML that you have\
    \ to keep in mind is that the tags should be closed in the right order. For instance,\
    \ if a tag is opened in another element, it has to be closed before the external\
    \ element is closed. Take a look at the following example of this rule:\n\n<external_element>\n\
    \n<internal_element>\n\nThe tag is closed before the external_element\n\n</internal_element>\n\
    \n</external_element>\n\nNaming Rules in XML\n\nYou should take not that all elements\
    \ in XML should follow these rules:\n\n*   The element names are case sensitive.\
    \ So if you want to use ‘phone’, you have to make sure that you are consistent\
