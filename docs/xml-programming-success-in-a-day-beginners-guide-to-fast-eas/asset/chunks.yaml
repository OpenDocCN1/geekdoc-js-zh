    \ if it has a start tag. For example:\n\n</address>\n\nTake note that the end\
    \ tag has a solidus ( / ) prior to the name of the element.\n\nRules for Using\
    \ Tags in XML\n\n*   Unlike other languages, XML is actually case sensitive. This\
