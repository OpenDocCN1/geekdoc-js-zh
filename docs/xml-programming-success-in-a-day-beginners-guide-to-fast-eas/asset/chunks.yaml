  trans: "\n\n![](img/cover.jpeg)\n\n# 一天掌握 XML 编程\n\n作者：Sam Key\n\n快速、简单、高效学习 XML\
    \ 编程的入门指南\n\n第 2 版\n\n## 目录\n\n- 引言\n- 第 1 章 什么是 XML 编程？\n- 第 2 章 基础语法\n- 第 3\
    \ 章 XML 属性、引用与文本\n- 第 4 章 XML 文档\n- 第 5 章 XML 声明\n- 第 6 章 XML 注释与字符实体\n- 第 7 章\
    \ CDATA 区域与空白符\n- 第 8 章 XML 处理与 XML 编码\n- 第 9 章 XML 验证\n- 第 10 章 XML 架构 (Schemas)\
    \ \n- 第 11 章 标签与元素\n- 第 12 章 树形结构\n- 第 13 章 文档对象模型、命名空间与数据库\n- 第 14 章：XML 查看器与编辑器\n\
    - 第 15 章：XML 中的解析器与处理器\n- 结论\n- 查看我的其他书籍\n\n版权所有 2015 由 Sam Key - 版权所有。\n\n严禁以任何方式通过电子手段或打印格式复制、复制或传输本文的任何部分。严禁录制本出版，除非获得出版者的书面许可，否则不允许存储本文。版权所有。\n\
    \n## 引言\n\n我想感谢你的下载，并祝贺你下载了《一天掌握 XML 编程》。这本书包含了关于如何进行 XML 编程的经过的步骤和策略。即使你对计算机和编程并不了解，这本书也能帮助你理解\
    \ XML 的本质。它还将帮助你发现它的潜力。请记住，XML 是你可以在不成为真正的技术专家的情况下学习的最强大的标记语言之一。再次感谢下载，希望你读得愉快！\n\
    \n## 第 1 章 什么是 XML 编程？\n\n`XML`，即可扩展标记语言（Extensible Markup Language），被认为是一场技术革命，几乎与发明轮子和切片面包并论。它可能是\
    \ 20 世纪 90 年代后期至今最受关注的技术，尽管 Java 直随其后。\n\n那么，XML 有什么大不了的？首先，你可以用它让你的 Web 应用程序更强大、更通用、更智能。\n\
    \n### 什么是 XML？\n\n你现在知道 `XML` 代表可扩展标记语言。`XML` 是基于文本的，源自标准通用标记语言或 `SGML`。`XML`\
    \ 标签用于识别、组织和存储数据。它与显示数据的 `HTML` 标签不同。尽管 `XML` 在未来绝不会取代 `HTML`，但它通过采用 `HTML` 的一些实用功能引入了许多可能性。\n\
    \n所以基本上，`XML` 是一种既独立于硬件也独立于软件的用于携带信息的工具。尽管它是与 `HTML` 非常相似的标记语言，但它是一个完全不同的实体。`XML`\
    \ 的设计重点是数据，而 `HTML` 的设计重点是数据的呈现。`XML` 描述数据，而 `HTML` 显示数据。`XML` 专注于携带信息，而 `HTML`\
    \ 专注于显示信息。\n\n此外，`XML` 设计成是自描述的。为了在 `XML` 中高效工作，你至少对 `HTML` 和 `JavaScript` 有基本的了解是非常重要的。`XML`\
    \ 中的标签也不是预定义的。因此，你需要定义自己的标签。\n\n请看下面的示例：\n\n```xml\n<note>\n    <to> Jane </to>\n\
    \    <from> John </from>\n    <heading> Memo </heading>\n    <body> Come to the\
    \ meeting at ten o’clock in the morning tomorrow. </body>\n</note>\n```\n\n如你所见，上面的示例是非常具有自描述性的。你可以看到关于发送者和接收者的信息。它还包含一个标题和消息正文。尽管如此，你应该意识到这个\
    \ `XML` 文档仅仅是包含标签的信息。它没有特定的功能。换句话说，它是没用的，没有做任何重要的事情。为了让你能够发送、显示或接收这条笔记，你需要使用一个软件程序。\n\
    \n在 `XML` 中，你定义自己的标签。使用上面的示例，你可以看到标签并不是在特定的 `XML` 标准中定义的。这些标签是由文档作者“发明”的。作为一名程序员，你有自由发明任何你喜欢的标签。你也有自由创建自己的文档结构。\n\
    \n`XML` 是一种没有任何预定义标签的语言。相比之下，`HTML` 有你需要在代码中使用的预定义标签。`HTML` 文档只允许使用 `HTML` 标准中定义的标签，例如\
    \ `<h1>` 和 `<p>`。\n\n从其名称中可以推出 `XML` 的三个特性：\n\n- **可扩展性 (Extensible)**：`XML` 允许你自定义自己的标签，使其适应你的应用程序。它还允许你扩展对“文档”概念的理解：存储文件服务器上的文件。\n\
    - **标记性 (Markup)**：`XML` 的标签或元素是比较熟悉的特征。`XML` 是可以在不同 Web 服务之间流动的元素。在 `XML` 中，你有机会定义自己的标签或元素。\n\
    - **语言性 (Language)**：`XML` 和 `HTML` 几乎相同，但 `XML` 更灵活。它是元语言。\n\n### 你需要 XML 吗？\n\
    \n你需要 `XML` 是因为 `HTML` 专门用于显示。对于非计算机专家来说，`HTML` 仅仅是一种演示语言，而 `XML` 是数据描述语言。这里是你在检查商品列表时常见的代码：\n\
    \n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/REC44/loose.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<title>商品列表</title>\n\
    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=iso-8859-1\" />\n\
    </head>\n<body>\n<h1>商品列表</h1>\n<h2>商品 A</h2>\n<p>商品 A 是一个可以让你的家务变得更简单的卓越工具。</p>\n\
    <p><b>价格：$35.00</b></p>\n<p><b>运费：$8.00</b></p>\n<h2>商品 B</h2>\n...\n<h3>商品 C</h3>\n\
    <p><i>价格：$55.99</i></p>\n<p>这太棒了，你不会后悔购买的。</p>\n...\n</body>\n</html>\n```\n\n\
    ## 学习语义与术语\n\n语义是对任何语言意义的研究。事实证明，人类在语义方面比计算机更优秀，仅仅因为人类擅长推导意义。每个动作或语言中都有意义；对于人类来说，对呈面前的内容很容易得出结论。\n\
    \n例如，当你被要求列出尽可能多的雌性名称时，你最可能会从母鹿、母虎、母狮或羊开始。相反，如果你被给你一个带有类别的列表，你更有可能说是“雌动物”。此外，如果你被问母狮子是什么，你会立刻说“母性狮子”。\n\
    \n\n\n从上面的插图中可以看出，计算机并不具备这种能力。很遗憾，因为很多计算任务需要语义技能。在这方面，计算机需要帮助。\n\n"
- fmt: "\nUsing the above example, it is highly likely that you can figure out that\
    \ the `<h>` tag is used to tag a product name in their list. Also, you might be\
    \ able to interpret that the 1st paragraph after `<h2>` is the product description,\
    \ and the following 2 paragraphs indicate the price and shipping fee.\n\nHowever,\
    \ if you further look into it, even the cursory glance reveals significant human\
    \ errors. Still using the above document, the last product name is visible in\
    \ `<h3>` but not in `<h2>` tags.\n\nA computer program or software that attempted\
    \ to decode the document, but cannot make the kinds of semantic leaps needed to\
    \ decipher the above statement, will ultimately fail. The computer will only be\
    \ able to render the document to a browser with the styles that are associated\
    \ with the tags. HTML is basically a set of instructions for rendering any kind\
    \ of document in the Web browser, but it doesn’t have the capability to structure\
    \ and decode the meaning of each tag.\n\nIf the document above is created using\
    \ `XML`, this might be what you will get:\n\n```xml\n<?xml version=\"1.0\"?>\n\
    <productListing title=\"Shop Items\">\n  <product>\n    <name>Item A</name>\n\
    \    <description>Item A is an incredible brush that can\n      make your hair\
    \ shiner.</description>\n    <cost>$88.40</cost>\n    <shipping>$7.00</shipping>\n\
    \  </product>\n  <product>\n    <name>Item B</name>\n    ...\n  </product>\n \
    \ <product>\n    <name>Item C</name>\n    <description>This is something so terrific\
    \ that you will want\n      it in your home or office! </p>\n    <cost>$89.50</cost>\n\
    \    <shipping>$7.00</shipping>\n  </product>\n  ...\n</productListing>\n```\n\
    \nThere really isn’t anything new in the new document and obviously, there is\
    \ no information about the display.\n\nAlso, have you ever wondered how a `<product>`\
    \ tag would appear in a browser? Remember that when you use `XML`, you will be\
    \ able to separate the information from the actual presentation.\n\n## Using XML\n\
