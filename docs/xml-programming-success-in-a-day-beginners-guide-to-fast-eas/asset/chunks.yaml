    Google Chrome 是支持 XML 的主要浏览器之一。如果你正在使用这个浏览器，那么你很幸运。你可以轻松地打开你的 XML 代码。


    ## 使用 Mozilla Firefox


    Mozilla Firefox 也支持 XML，但首先，你必须在 Google Chrome 中打开你的代码。要做到这一点，你需要双击文件。你将看到代码以彩色文本的形式显示。这非常棒，因为你可以更轻松地阅读你的代码。在元素的左侧，你会看到加号（`+`）和减号（`-`）符号。如果你点击加号（`+`），你的代码行就会展开。相反，如果你点击减号（`-`），你的代码就会被隐藏。


    ## XML 中的文档错误


    如果你发现代码缺少了某些标签，那么你可能存在错误。如果是这样，你将看到一条提示错误信息的消息。请看下面的示例：


    ```xml

    <?xml version = “1.0”?>


    <contact-information>


    <company> Sample Company </company>


    <name> Jane Doe </name>


    <phone> (045) 123-5678 </phone>


    </cntact-information>

    ```


    如果你在 Google Chrome 中打开上述代码，将收到一条错误信息。如你所见，起始标签 `<contact-information>` 和结束标签 `</cntact-information>`
    并不匹配。


    ## XML 中的编辑器


    编辑器是标记语言编辑器。可以使用现有的编辑器创建和编辑 XML 文档。例如，你可以使用 Wordpad、记事本或计算机上的任何其他文本编辑器。如果你不想下载，你甚至可以使用在线的专业编辑器。在线编辑器通常具有更强大的编辑功能。它们会自动关闭未闭合的标签，并严格检查语法。它们用颜色高亮语法以提高可读性，并提供根据架构文件（Schemas）和
    DTD 对文档进行自动验证。它们对于编写有效的 XML 代码也很有帮助。


    ### XML 中的开源编辑器


    在 XML 中，你可以从多种编辑器中选择。可用的开源编辑器包括：


    - **Xerlin**: 它是一个为 `Java 2` 平台开发的开源编辑器，根据 Apache 许可证发布。由于它是一个基于 Java 的建模应用程序，因此可以更容易地创建和编辑
    XML 文件。

    - **Content Assembly Mechanism (CAM)**：它是一个编辑器工具，具有 `XML + JSON + SQL Open-XDX`
    特，由 Oracle 赞助。


    ## 第 15 章 XML 中的解析器和处理器


    在 XML 中，解析器是一个软件包或软件库，为客户端应用程序处理文档提供接口。它会检查文档并验证其是否具有正确的格式。它还可以验证文档。今天，大多数浏览器都内置了
    XML 解析器，因此你不需要担心你的浏览器不支持它。主流浏览器没有内置解析器的情况是不寻常的。


    为了帮助你更好地理解解析器，这里有一张展示了解析器如何与 XML 文档交互的图：


    ![](img/00034.jpeg) ![](img/00035.jpeg) ![](img/00036.jpeg)

    ![](img/00037.jpeg) ![](img/00038.jpeg)


    解析器的主要目标是将 XML 转换为可读且可理解的代码。为了使解析过程更容易，可以使用某些商业产品。这些产品用于拆解 XML 文档并产生更可靠的结果。以下是一些常用的解析器：


    - **Microsoft Core XML Services (MSXML)**: 它是微软提供的标准 XML 工具集。它包含一个解析器。

    - **Java 内置解析器**: 它是仅在 `Java` 库中提供的解析器。该库的设计方式允许用户用外部实现替换此类内置解析器，例如来自 Apache 的
    `Saxon` 或 `Xerces`。

    - **Xerces**: 它由 Apache 软件基金开发，是一个著名的开源项目。它也用 Java 实现了。

    - **Saxon**: 它提供了用于解析、查询和转换 XML 的工具。

    - **System.Xml.XmlDocument**: 它是 `.NET` 库中的一个类。该库包含许多与处理 XML 相关的类。


    ## XML 中的处理器


    处理 XML 是当软件程序读取文档并采取必要行动时。具有处理和读取 XML 文档能力的程序被称为 XML 处理器。XML 处理器读取文件将其转换为程序其他部分可以访问的内存中结构。最重要的处理器读取文档并将其转换为其他子程序或程序可以使用的内部表示。这被称为解析器。它实际上是
    XML 处理程序中的一个至关重要的组件。


    ### 处理器的类型


    处理器主要分为两类：验证型（validating）和非验证型（non-validating）。这些类型取决于处理器是否检查文档的有效性。发现有效性错误的处理器应该报告此类错误。尽管如此，它们可能会继续或恢复其正常处理。


    一些验证型解析器包括：`xml4c` (C++, IBM), `xml4j` (Java, IBM), `MSXML` (Java, Microsoft),
    `TclXML` (TCL), `XML :: Parser` (Perl), `xmlproc` (Phyton) 和 `Java Project X`
    (Java, Sun)。


    一些非验证型解析器包括：`OpenXML` (Java), `xp` (Java), `Lark` (Java), `Elfred` (Java), `XParse`
    (JavaScript), `expat` (C) 和 `xmllib` (Phyton)。


    ## XML 中的处理指令


    处理器处理指令。处理指令实际上是包含软件指令特殊标签。如果你是初学者，可能会认为处理指令很复杂。然而，处理指令并不常用。


    ### 处理指令的重要性


    如果你习惯使用 HTML，你可能注意到它没有处理指令。每当你需要向软件发送指令时，你就误用了注释标签。这种误用的经典示例是服务器端包含（SSI）。请看下面的包含文件的
    SSI 示例：


    ```

    <!-- include virtual = “samplefile.txt” -->

    ```


    是的，这看起来是一个明智且实用的主意。但你必须记住这仍然是对注释标签的误用。注释标签有一个目的，即在程序中包含注释。它并不是这样设计的。尽管如此，如果你的
    HTML 页面具有 `shtml` 扩展名，Web 服务器将在页面发送到浏览器之前搜索并处理 SSI。


    另一种更方便地为浏览器提供 CSS 和优化标记的方法是使用条件注释。请看下面的示例：


    ```

    <!--—(if IE 6)>

    <link rel = “stylesheet” type = “text/css” href = ie6only.css>

    <! (endif)-->

    ```


    再次，这是另一种使用注释标签的方法。然而，这仍然是误用，因为你并不是为了在程序中插入注释。


    由于注释标签被误用于其他目的，开发者在 XML 中找到了克服这些限制的方法。他们承认存在无法预见的特殊需求。这些特殊需求在 XML 中比在 HTML 中更容易发生。此外，开发处理指令是为了防止注释标签被误用。它还为了每种属性和元素无法立即解决的特殊需求提供一种灵活的通用机制。


    ### 处理指令


    处理指令使得文档包含应用程序的指令成为可能。然而，它们并不是这些文档的字符数据部分。它们也必须传递给应用程序。


    '
- fmt: '

    It is compulsory for every processor to ignore the meaning of the Processing Instructions
    since they do not know what they stand for anyway. Nevertheless, the process has
    to pass the content and name of the Processing Instruction onto the applications.


    Take a look at the following XML spec:


    ```

    PI : : = ‘<?’ PITarget ( S ( Char* - ( Char* ‘?>’ Char* ) ) ) ? ‘?>’


    PITarget : : = Name – ( ( ‘X’ | ‘X’ ) ( ‘M’ | ‘m’ ) ( ‘L’ | ‘l’ ) )

    ```


    The `PITarget` or the name that follows the first question mark is actually the
    name of the Processing Instruction. A space has to be placed after it. The rest
    of the Processing Instruction, including the last question mark, is a string value
    or the content. The letters `xml` are reserved, as you have learned in a previous
    chapter. Thus, it should not be used to begin a user-defined Processing Instruction
    name. Likewise, the content should not include the characters `?>`.


    As you can see, the content of the Processing Instruction is only a string value.
    Nonetheless, it is a common practice to create content that appears to be pseudo-attributes.
    Take a look at the following example:


    ```

    <? xml – stylesheet href = “sample.css” type = “text/css” ?>

    ```


    Aside from this, you may also write `abc1234567` or “Processing Instructions are
    quite unusual but you can eventually get used to using them.” These examples are
    considered legal content in XML.


    ## Common Uses of Processing Instructions


    Processing Instructions are not used very often, except in certain instances.
    They are, in fact, the official method for XML documents to be linked to stylesheets.
    Microsoft makes use of Processing Instructions in `Microsoft Office 2003`. This
    is so the user can easily identify `Microsoft Excel` and `Microsoft Word` documents
    when saving them as XML.


    ### XML Stylesheet


    In 1999, using Processing Instructions to link stylesheets to XML documents has
    been a standard practice.


    ### Processing Instructions in Microsoft Office 2003


    Ever since the development of the `Microsoft Office 2003`, Processing Instructions
    have become more popular amongst users. Both `Word` and `Excel` can now save in
    their very own `xml` formats with the use of an `xml` file extension. Then again,
    this has proven to be an inefficient method because a lot of other applications
    also use the same extension.


    Because of this, Microsoft has used Processing Instructions for identification.
    This is so XML files can be signaled to `Windows Explorer` and `Internet Explorer`
    either as `Excel` or `Word` documents.


    If you are using `Microsoft Word 2003`, the Processing Instruction found after
    the XML declaration appears as follows:


    ```

    <? mso-application progid = “Word.Document” ?>

    ```


    If you are using `Microsoft Excel 2003`, the Processing Instruction found after
    the XML declaration appears as follows:


    ```

    <? mso-application progid = “Excel.Sheet” ?>

    ```


    `Microsoft Office 2007` makes use of a zip file format for PowerPoint (`pptx`),
    Word (`docx`), and Excel (`xlsx`). Every zipped document has several media files,
    XML files, and other files. If you are using `Microsoft Office 2007`, there is
    no more need for you to use Processing Instructions because the file extensions
    available are already enough. However, if you want to save your file in the 2003
    XML format and you are using `Microsoft Office 2007`, Processing Instructions
    may be used.


    ## Processing Instructions for Nearly Everything


    Processing Instructions are highly versatile. In fact, they can be used to do
    a variety of things, such as indicating line breaks in markups and determining
    the words that do not have to be spell checked among others.


    In order for you to understand Processing Instructions better, consider the following
    example. Here, you will learn about the diversity of Processing Instructions.
    You will find out how they can solve nearly every problem. For instance, if you
    have a project in XML, you can use Processing Instructions to annotate your documents
    that are still in process.


    ```

    <? TeamExample member = “Wendy” date = “2015-11-04” comment = “I believe that
    the attributes given in the product element are not of particular importance and
    therefore can be eliminated.” ?>

    ```


    If you used comment tags, you may have a hard time differentiating the actual
    comments from the other elements in your document. So in order for you to solve
    such problem, you can use Processing Instructions. There is no more need for you
    to declare them in your schema. You can easily differentiate them from actual
    comments as well as delete them if necessary.


    Comments only have content. Processing Instructions, on the other hand, have both
    content and a name. For instance, you can use the `processing-instruction()` node
    test to match all Processing Instructions in `XPath`. Nonetheless, you can also
    search for Processing Instructions by name and have their content returned. In
    order for that to happen, you need to do the following:


    ```

    processing-instruction() [ name() = “TeamExample” ]

    ```


    Keep in mind that the content is simply a long string and that the pseudo values
    of pseudo attributes may be analyzed with the use of Regular Expressions.


    ## When Should You Use Processing Instructions?


    Ideally, you should use Processing Instructions when you no longer have any choice.
    In other words, you should consider them as your last resort. As much as possible,
    you should refrain from using them. If you use them when it is not necessary,
    they will only be ignored. This is especially true if the software program does
    not understand what they stand for. Take note that even professional developers
    need to know what they mean before they can use them. Processing Instructions
    are not easy to grasp unlike the `xml-stylesheet` Processing Instructors and the
    Processing Instructors found in `Microsoft Office 2003`.


    ## XML Declarations Are Not Processing Instructions


    A lot of people have this misconception that XML declarations are Processing Instructions
    or Special Processing Instructions. However, you should know that this is far
    from the truth. XML declarations and Processing Instructions are actually very
    different.


    Even though an xml declaration looks and acts like a Processing Instruction, its
    function is different. An xml processor is aware of the xml declaration and its
    content. In fact, it knows it so well that it can quickly return an error message
    in case it finds wrong with it.


    With Processing Instructions, things are different. They are actually the exact
    opposite. The xml processor ignores the Processing Instructions, but passes their
    name and content onto the application.


    The World Wide Web Consortium (W3C), an international community that creates open
    standards to ensure the long term growth of the Web, recommends the Extensive
    Stylesheet Language Transformations (XSLT) and the XML Path Language (XPath) for
    transforming information marked up in XML from a certain vocabulary to another.


    These two offer an excellent implementation of a tree-oriented transformation
    language. They transmute XML instances that use a single vocabulary into plain
    text, legacy HTML vocabulary, or any other available vocabularies.


    ## Conclusion


    Thank you again for downloading this book! 


    I hope this book was able to help you use XML in your computing tasks. 


    The next step is to put the things you have learned into practice - try using
    XML to improve your web development project. Even if you''re not really into creating
    websites, rest assured that there''s a possible use of the markup language in
    your industry. Don''t hesitate to share your knowledge with your friends and colleagues.

