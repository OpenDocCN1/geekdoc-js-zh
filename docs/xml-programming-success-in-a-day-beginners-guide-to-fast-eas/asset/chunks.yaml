  raw: 'Using the above example, it is highly likely that you can figure out that
    the <h> tag is used to tag a product name in their list. Also, you might be able
    to interpret that the 1st paragraph after <h2> is the product description, and
    the following 2 paragraphs indicate the price and shipping fee.


    However, if you further look into it, even the cursory glance reveals significant
    human errors. Still using the above document, the last product name is visible
    in <h3> but not in <h2> tags.


    A computer program or software that attempted to decode the document, but cannot
    make the kinds of semantic leaps needed to decipher the above statement, will
    ultimately fail. The computer will only be able to render the document to a browser
    with the styles that are associated with the tags. HTML is basically a set of
    instructions for rendering any kind of document in the Web browser, but it doesn’t
    have the capability to structure and decode the meaning of each tag.


    If the document above is created using XML, this might be what you will get:


    <?xml version="1.0"?>


    <productListing title="Shop Items">


     <product>


       <name>Item A</name>


       <description>Item A is an incredible brush that can


         make your hair shiner.</description>


       <cost>$88.40</cost>


       <shipping>$7.00</shipping>


     </product>


     <product>


       <name>Item B</name>


       ...


     </product>


     <product>


       <name>Item C</name>


       <description>This is something so terrific that you will want


         it in your home or office! </p>


       <cost>$89.50</cost>


       <shipping>$7.00</shipping>


     </product>


     ...


    </productListing>


    There really isn’t anything new in the new document and obviously, there is no
    information about the display.


    Also, have you ever wondered how a <product> tag would appear in a browser? Remember
    that when you use XML, you will be able to separate the information from the actual
    presentation.


    Using XML


    XML can be used in various aspects of Web development. It is typically used for
    storing and sharing data.


    XML separates data from HTML. In case you have to show dynamic data in an HTML
    document, you have to edit it every time your data changes. Obviously, this takes
    a lot of time and effort.


    With XML, however, you can store your data in separate files. This is much more
    convenient since you can focus on using CSS/HTML for your layout and display.
    You can also guarantee that the changes you make in your underlying data do not
    require changes to the HTML. Moreover, with a few codes in JavaScript, you can
    read external XML files as well as update the content of your Web page.


    In the virtual world, computer databases and systems may see to contain data in
    compatible formats. This is not the case in the real world, though. XML data are
    actually stored in plain text format in order to provide a hardware-independent
    and software-independent way for storing data as well as make it easier to produce
    data that are sharable by various applications.


    Just like many other Web developers, you may also have a hard time exchanging
    data between systems that are not compatible. Doing so can take a lot of your
    time and energy. Fortunately, with XML, you can simplify data transport. You can
    avoid experiencing too much complexity if you exchange data as XML because the
    data is readable even by incompatible and different applications.


    Likewise, XML simplifies platform changes. As you know, upgrading to a new system,
    whether it is software or hardware platform, is time consuming. What’s more, incompatible
    data is frequently lost when huge amounts of data have to be converted. Because
    of this, a lot of developers get frustrated. They waste time and energy, and they
    do not get the output that they hoped for.


    With XML, you can store data in text format so you can quickly upgrade or expand
    to a new operating system, browser, or application without worrying that you might
    lose data.


    XML also makes data more available. With XML, any kind of reading machine can
    access your data. Voice machines, handheld computers, and news feeds can all access
    your data from data sources in XML and in HTML pages. Even people with certain
    disabilities can easily access your data. Blind individuals, for instance, will
    not have a hard time accessing your content.


    Many Internet languages are actually written in XML. Some of these include XML
    Schema, XHTML, SVG, RSS, and WSDL.


    * * *


    * * *


    Chapter 2 Basic Syntax


    This section will give you information on simple syntax rules when writing an
    XML document.


    The following is a complete student uniform.


    ![](images/00001.jpeg)


    You will see 2 kinds of information in this example:


    *   Markup - <contact-info>


    *   Text (character data) – Manny Dunphy  and (895) 444-111


    This diagram will give you the syntax rules in writing different types of markup
    and text with XML.


    ![](images/00002.jpeg) ![](images/00003.jpeg)


    XML Declaration                                                                      
                                References              


    ![](images/00004.jpeg) ![](images/00005.jpeg)             


    ![](images/00006.jpeg) ![](images/00007.jpeg)


    ![](images/00008.jpeg)


    ![](images/00009.jpeg) ![](images/00007.jpeg)Syntax Rules


    ![](images/00010.jpeg) ![](images/00007.jpeg)


    ![](images/00011.jpeg)


    Elements   Attributes  Text Tags


    XML Declaration


    The document may or may not have XML declaration. It can be written like this:


    <?xml version="1.0" encoding="UTF-8"?>


    Version is the XML version and other specific encoding specifies that the character
    encoding used in this particular document.


    There''s no need to worry if that''s a bit unclear. You will learn more about
    XML declaration later.


    Elements and Tags


    XML elements are known as the building blocks of an XML. They behave as containers
    holding any of the following: the text, the elements, the attributes, the media
    objects - basically everything. Each document may contain one or more elements,
    the scopes can be delimited by start and end tags, or empty elements (with empty-element
    tag).


    Syntax


    <element-name attribute1 attribute2>


    ....content


    </element-name>


    Element name refers to the name of the element, and the case in the beginning
    and end tags should match.


    Attribute 1, attribute 2 are the element attributes that are separated by the
    white spaces. Attribute refers to the property of the element. It is associated
    with a name and value, written like this:


    name = "value"


    Empty Element


    An element without content appears like this:


    <name attribute1 attribute2.../>


    An XML document with different XML elements will have this syntax:


    <?xml version="1.0"?>


    <contact-info>


    <address category="business">


    <name>Manny Dunphy</name>


    <company>Real Realtor</company>


    <phone>(895) 444-111</phone>


    <address/>


    </contact-info>


    Rules


    *   The name should have alphanumeric characters with only these punctuation marks:
    the hyphen (-), underscore (_), and a period (.).


    *   They are case sensitive: Address and address are not the same.


    *   The beginning and end tags should match.


    *   The element may contain text or elements.


    Comments in XML


    In XML, the syntax for writing comments is the same as that of HTML. This is the
    syntax for a comment in XML:


    <!—An example of a comment -->


    Comments generally start with <!—and end with -->. They can contain any data with
    the exception of the string literal --. You are allowed to put comments between
    markups anywhere in your XML document.


    New Line in XML


    Applications in Windows generally store new lines as carriage return and line
    feed (CR + LF). Old Mac systems store a new line as carriage return while Mac
    OSX and Unix store it as line feed. XML, on the other hand, stores it as line
    feed.


    Whitespace in XML


    Unlike in HTML, multiple whitespaces in documents are not truncated in XML. HTML
    actually truncates multiple whitespaces into a single whitespace.


    Chapter 3 XML Attributes, References, and Texts'
