    Introduction


    I want to thank you and congratulate you for downloading the book,“XML Programming
    Success in a Day”.


    This book contains proven steps and strategies on how to do XML programming.


    Even if you are not knowledgeable about computers and programming, this book will
    help you understand what XML is all about. It will also help you discover its
    potential. Remember, XML is among the most powerful markup languages that you
    can learn without being a true-blue technology expert.


    Thanks again for downloading this book, I hope you enjoy it!


    Chapter 1 What is XML Programming?


    XML, or Extensible Markup Language, is recognized as a technical revolution that
    is almost comparable to the invention of the wheel and sliced bread. It is probably
    the most hyped technology in the late 1990’s up to the present, though Java is
    a close second.


    So what is the big deal about XML? For one, you can use it to make your Web applications
    more powerful, more versatile, and smarter.


    What is XML?


    You know now that XML stands for Extensible Markup Language. XML is text-based
    and derived from the Standard Generalized Markup Language or SGML.


    XML tags identify, organize, and store data. It is not the same as the HTML tags
    which display the data. There is no way that XML would replace HTML in the future,
    however, it introduces a lot of possibilities by adopting some useful features
    of HTML.


    So basically, XML is both a hardware-independent and software-independent tool
    used to carry information. Even though it is a markup language that is very similar
    to HTML, it is an entirely different entity. XML was designed to focus on the
    data while HTML was designed to focus on the appearance of the data. XML describes
    the data while HTML displays the data. XML is all about carrying information while
    HTML is about displaying the information.


    In addition, XML is designed to be self-descriptive. In order to be highly efficient
    in XML, it is important for you to have at least a basic understanding of HTML
    and JavaScript. The tags in XML are also not predefined. Hence, you need to define
    your own tags.


    Take a look at the following example:


    <note>


                  <to> Jane </to>


                  <from> John </from>


                  <heading> Memo </heading>


    <body> Come to the meeting at ten o’clock in the morning tomorrow. </body>


    </note>


    As you can see, the example given above is quite self-descriptive. You can see
    the information about both the sender and the receiver. It also contains a heading
    and a message body. Nevertheless, you should realize that this XML document is
    merely information that contains tags. It does not have a specific function. In
    other words, it is useless and does not do anything important. In order for you
    to be able to send, display, or receive this note, you need to use a software
    program.


    In XML, you define your own tags. Using the example given above, you can see that
    the tags are not defined in a particular XML standard. The tags are “invented”
    by the author of the document. As a programmer, you have the freedom to invent
    whatever tags you like. You also have the freedom to create your own document
    structure.


    XML is a language that does not have any predefined tags. HTML, on the other hand,
    has predefined tags that you need to use in your codes. Documents in HTML are
    only allowed to use the tags defined in the HTML standard, such as <h1> and <p>.


    There are three characteristics of XML, as can be deduced from its name:


    Extensible


    XML allows you to characterize your own tags to make them suitable to your applications.
    It also enables you to extend the concept of what a document is: a file that lives
    on a file server. It can also be a temporary piece of data flowing between different
    Web services.


    Markup


    The tags or elements are the most familiar feature of XML. The XML elements that
    you will be creating will be comparable to the elements that you have been used
    to using in HTML documents. The only difference is that with XML, you are able
    to define your own set of tags or elements.


    Language


    The language used in XML and HTML are almost identical, but XML is more flexible
    as it gives you the chance to make your own tags. XML is more than just a language.
    It is a meta-language, meaning it allows you to create and define other languages.
    For instance, you can use XML to create languages like RSS and MAthML (Mathematical
    Markup Language).


    Do You Need XML?


    You need XML because HTML is used specifically to illustrate documents for display
    in the Web browser, nothing else. HTML becomes bulky when you try to display documents
    using your mobile device or anything that is quite complicated, like translating
    German content to English. The only purpose of HTML is to enable you to speedily
    create Web documents that you can effortlessly share with other people. 


    XML can be used in different contexts aside from the Web, such as in  Web Services
    and other applications.


    HTML rarely gives you information on how your document is prepared or gives you
    its meaning.


    For the non-computer expert, HTML is simply a presentation language, while XML
    is a data-description language.


    Here''s the usual kind of code you will see by inspecting the structure of an
    e-commerce site''s product listing:


    <!DOCTYPE html PUBLIC "-//Business//DTD XHTML 1.0 Transitional//EN"


       "http://www.business.com/TR/xhtml1/DTD/xhtml1-transitional.dtd">


    <html xmlns="http://www.business.com/1999/xhtml">


    <head>


    <title>Shop Items</title>


    <meta http-equiv="Content-Type"


       content="text/html; charset=iso-8859-1" />


    </head>


    <body>


    <h1>Shop Items</h1>


    <h2>Item A</h2>


    <p>Item A is a remarkable tool that can make your chores much easier.</p>


    <p><b>Price: $35.00</b></p>


    <p><b>Shipping: $8.00</b></p>


    <h2>Item B</h2>


    ...


    <h3>Item C</h3>


    <p><i>Price: $55.99</i></p>


    <p>This is so wonderful that you will never regret buying it .</p>


    ...


    </body>


    </html>


    Learning About the Semantics and Jargons


    Semantics is the study of the meaning of any language. It’s a fact that humans
    are better at semantics compared to computers, simply because humans are excellent
    in deriving meanings. There is always a meaning in every action or language; for
    humans, it is easy to draw conclusions on what they are presented in front of
    them.


    For instance, you were asked to list down as many names for female animals as
    you can, you are most likely begin with doe, tigress, lioness, or ewe. On the
    other hand, if you were given a list of names with categories, you are more than
    likely going to say female animals. In addition, if you were asked what a lioness
    is, you’ll immediately say “a female lion.”


    From the above illustrations, computers do not have the capability to do that.
    It’s a shame, though, since a lot of computing tasks need semantic skill. In this
    regard, computers need help.'
