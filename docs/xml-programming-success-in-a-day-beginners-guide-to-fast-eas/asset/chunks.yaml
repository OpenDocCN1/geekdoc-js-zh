    \ they hoped for.\n\nWith `XML`, you can store data in text format so you can\
    \ quickly upgrade or expand to a new operating system, browser, or application\
    \ without worrying that you might lose data.\n\n`XML` also makes data more available.\
    \ With `XML`, any kind of reading machine can access your data. Voice machines,\
    \ handheld computers, and news feeds can all access your data from data sources\
    \ in `XML` and in `HTML` pages. Even people with certain disabilities can easily\
    \ access your data. Blind individuals, for instance, will not have a hard time\
    \ accessing your content.\n\nMany Internet languages are actually written in `XML`.\
    \ Some of these include `XML Schema`, `XHTML`, `SVG`, `RSS`, and `WSDL`.\n\n***\n\
    \n## Chapter 2 Basic Syntax\n\nThis section will give you information on simple\
    \ syntax rules when writing an `XML` document.\n\nThe following is a complete\
    \ student uniform.\n\n![](images/00001.jpeg)\n\nYou will see 2 kinds of information\
    \ in this example:\n\n*   Markup - `<contact-info>`\n*   Text (character data)\
    \ – Manny Dunphy and (895) 444-111\n\nThis diagram will give you the syntax rules\
    \ in writing different types of markup and text with `XML`.\n\n![](images/00002.jpeg)\
    \ ![](images/00003.jpeg)\n\n### XML Declaration\n\nThe document may or not have\
    \ XML declaration. It can be written like this:\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"UTF-8\"?>\n```\n\n### Elements and Tags\n\n`XML` elements are known\
    \ as the building blocks of XML. They behave as containers holding any of the\
    \ following: the text, the elements, the attributes. They can be delimited by\
    \ start and end tags, or empty elements.\n\n#### Syntax\n\n```xml\n<element-name\
