  raw: "*   The document type declaration should always be at the beginning of the\
    \ document.\n\n*   Element declarations should always begin with an exclamation\
    \ mark.\n\n*   The name indicated in the document type declaration should match\
    \ the element type of the root element.\n\nExternal DTD\n\nThe DTD elements are\
