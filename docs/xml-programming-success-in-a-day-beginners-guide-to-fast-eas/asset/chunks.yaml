- fmt: "\nSome predefined entities, like `<` and `>` need typing and are quite hard\
    \ to read in the markup, this is where CDATA section is needed. CDATA section,\
    \ when used, will command the parser that a particular section of the XML document\
    \ has no markup and should be treated as regular text.\n\n### Syntax\n\n```xml\n\
    <![CDATA[\ncharacters with markup\n]]>\n```\n\nThis syntax has three sections:\n\
    \n* `CDATA Start Section` – it should always begin with the 9-letter delimiter\
    \ `<![CDATA[`.\n* `CDATA End Section` – it usually ends with `]]>` delimeter.\n\
    * `CDATA Section` – the the characters between the start and end sections are\
    \ referred to as characters. They are not recognized as markups. It may contain\
    \ some markup characters but they are often neglected by the XML processor.\n\n\
    ### Example\n\nThis is a markup code. The characters inside the CDAT are ignored\
    \ by the parser.\n\n```xml\n<script>\n<![CDATA[\n<message> Ahoy! You're in SeaShack\
    \ </message>\n]] >\n</script>\n```\n\n### Rules\n\n* `CDATA` is not supposed to\
    \ contain the string `]]>` anywhere in the document.\n* `CDATA` section does not\
    \ allow nesting.\n\n### The XML Whitespaces\n\nA whitespace is a collection of\
    \ newlines, tabs, and of course, spaces. They make the XML document easy to read.\
    \ The XML document has 2 types of white spaces:\n\n* `Significant Whitespace`\n\
    * `Insignificant Whitespace`\n\n### Significant Whitespaces\n\nThis will occur\
    \ within the element that contain the text and the markup that are present together.\n\
    \n#### Examples\n\n```xml\n<name>NelDelgado</name>\n```\n\nOr\n\n```xml\n<name>Nel\
    \ Delgado</name>\n```\n\nTake note of the difference between the spaces of each\
    \ element. Any program that is reading this type of element in an XML file should\
    \ maintain the recognition.\n\n### Insignificant Whitespace\n\nThis is the space\
    \ that only allows element content.\n\n```xml\n<address.category=\"work\">\n```\n\
    \nOr\n\n```xml\n             <address....category=\"..work\">\n```\n\nThese samples\
    \ are the same. The dots represent the space. The space between address and category\
    \ on the above sample may actually be significant.\n\n`xml:space`, a special attribute,\
    \ can be attached to a particular element. The addition would indicate that the\
    \ whitespace should not be removed for the particular element. This can be set\
    \ as either `default` or `preserve`.\n\n```xml\n<!ATTLIST address xml:space (default|preserve)\
    \ 'preserve'>\n```\n\n* The value `default` allows that the default whitespace\
    \ processing modes of a particular application to be accepted for this particular\
    \ element.\n* The value `preserve` commands the application to preserve all the\
    \ whitespaces.\n\n# Chapter 8 XML Processing and XM Encoding\n\nProcessing instructions\
    \ allow the documents to contain instructions for every application. These are\
    \ not part of the character data of the XML document, but they have to pass through\
    \ the application.\n\nPIs allows you to pass information to all the applications.\
    \ They can appear anywhere in the document. They may also appear in the prolog,\
    \ which includes the DTD or document type definition, after the document, or as\
    \ textual content.\n\n### Syntax\n\n```xml\n<?target instructions?>\n```\n\n*\
    \ The `target` recognizes the application from which the instruction originates.\n\
    * The `instruction` is a character that is used to describe the information that\
    \ the application needs to process.\n\nA processing instruction begins in a special\
    \ tag `<?` and ends with `?>`. When the string `?>` is encountered, the processing\
    \ abruptly ends.\n\n### Example\n\nThough PIs are not often used, they are used\
    \ to link an XML document to a style sheet. This is what it looks like:\n\n```xml\n\
    <?xml-stylesheet href=\"businessforms.css\" type=\"text/css\"?>\n```\n\nThe `target`\
    \ is `xml-stylesheet.href=\"businessforms.css\"` `type=text/css` are the instructions\
    \ that the target application will have to process for the XML document.\n\nWith\
    \ this instruction, the browser will recognize the target by initiating that the\
    \ XML document should be transformed before begin shown. Notice that the 1st attribute\
    \ recognizes the type of XSL transform, while the 2nd attribute indicates its\
    \ location.\n\n### Rules\n\nA processing instruction contains data except for\
    \ the combination `?>`, which is interpreted as a closing delimeter.\n\n### Examples\n\
    \n```xml\n<?welcome to pg=55 of business hub?>\n```\n\nOr this:\n\n```xml\n<?hello?>\n\
    ```\n\n# XML Encoding\n\nThe process of encoding converts Unicode characters into\
    \ binary. The moment the XML processor reads a specific XML document, it immediately\
    \ encodes the document according to the type of encoding that is needed.\n\n###\
    \ Types of Encoding\n\nThere are two types of encoding: `UTF-8` and `UTF-16`.\
    \ UTF means USC Transformational Format; USC is Universal Character Set. Numbers\
    \ 8 and 16 indicate the bits used to represent the characters. `UTF-8` is 1 byte,\
    \ while `UTF-16` is 2 bytes. If an XML document has no encoding information, the\
    \ default set is `UTF-8`.\n\n### Syntax\n\nThe type of encoding has to be indicated\
    \ in the prolog section of the XML document itself.\n\nUTF-8 syntax:\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\" ?>\n```\n\nUTF-16 syntax:\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-16\" standalone=\"no\" ?>\n```\n\
    \n### Example\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    no\" ?>\n<contact-info>\n<name>Dunny Bobbins</name>\n<company>Real Realtors</company>\n\
    <phone>512</phone>\n</contact-info>\n```\n\nThis sample indicates the use of `UTF-8`.\n\
    \n# Chapter 9 Validation\n\nThe validation process is needed to know if the document\
    \ complies with the restrictions. Validation is done by the XML parser in 2 ways:\
    \ well-formed or valid.\n\n### Well-formed XML Document\n\nA document should adhere\
    \ to the following rules to become well-formed:\n\n* The type of document is indicated\
    \ (it is in element).\n* It has a root element, the `address`.\n* Self-explanatory\
    \ tags enclose each of the child elements.\n* Order of the tags are well-maintained.\n\
    * The start tag should contain only one attribute.\n* All tags must have a closing\
    \ tag.\n* `&`, `<`, `>`, `\"` , and `'` entities should be declared.\n\n#### Example\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\" ?>\n<!DOCTYPE\
    \ address [\n<!ELEMENT address (name,company,phone)>\n<!ELEMENT name (#PCDATA)>\n\
    <!ELEMENT company (#PCDATA)>\n<!ELEMENT phone (#PCDATA)>\n]>\n<address>\n<name>Dunny\
    \ Bobbins</name>\n<company>Real Realtors</company>\n<phone>333-7785</phone>\n\
    </address>\n```\n\n### Valid Document\n\nA well-formed XML document with Document\
    \ Type Declaration or DTD, is a valid XML document. The vocabulary and validity\
    \ of the structure of documents are checked against the grammatical rules of the\
    \ appropriate XML language.\n\n#### Syntax\n\nBasic syntax:\n\n```xml\n<!DOCTYPE\
    \ element DTD\n```\n\nThe `DTD identifier` is used for the document type definition.\
    \ It may be the path in your system or the URL link. If it is pointing to an external\
    \ path, it is referred to as the External Subset.\n\n#### Internal DTD\n\nThe\
    \ elements are within the XML files. To refer to an internal DTD, the `standalone`\
    \ attribute in the XML declaration should be set to `yes`.\n\n#### Syntax\n\n\
    ```xml\n<!DOCTYPE root-element [element-declarations]>\n```\n\n#### Example\n\n\
    ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\" ?>\n<!DOCTYPE\
    \ address [\n<!ELEMENT address (name,company,phone)>\n<!ELEMENT name (#PCDATA)>\n\
    <!ELEMENT company (#PCDATA)>\n<!ELEMENT phone (#PCDATA)>\n]>\n<address>\n<name>Dunny\
    \ Bobbins</name>\n<company>Real Realtors</company>\n<phone>(088) 559-4456</phone>\n\
    </address>\n```\n"
  raw: "Some predefined entities, like &lt; and &gt; need typing and are quite hard\
    \ to read in the markup, this is where CDATA section is needed. CDATA section,\
    \ when used, will command the parser that a particular section of the XML document\
    \ has no markup and should be treated as regular text.\n\nSyntax\n\n<![CDATA[\n\
    \ncharacters with markup\n\n]]>\n\nThis syntax has three sections:\n\n*   CDATA\
    \ Start Section – it should always begin with the 9-letter delimiter <![CDATA[\n\
    \n*   CDATA End Section – it usually ends with ]]> delimeter.\n\n*   CDATA Section\
    \ –  the characters between the start and end sections are referred to as characters.\
    \ They are not recognized as markups. It may contain some markup characters but\
    \ they are often neglected by the XML processor.\n\nExample\n\nThis is a markup\
    \ code. The characters inside the CDAT are ignored by the parser.\n\n<script>\n\
    \n<![CDATA[\n\n<message> Ahoy! You're in SeaShack </message>\n\n]] >\n\n</script\
    \ >\n\nRules\n\n*   CDATA is not supposed to contain the string “]]> anywhere\
    \ in the document.\n\n*   CDATA section does not allow nesting.\n\nThe XML Whitespaces\n\
    \nA whitespace is a collection of newlines, tabs, and of course, spaces. They\
    \ make the XML document easy to read.\n\nThe XML document has 2 types of white\
    \ spaces:\n\n*   Significant Whitespace\n\n*   Insignificant Whitespace\n\nSignificant\
    \ Whitespaces\n\nThis will occur within the element that contain the text and\
    \ the markup that are present together.\n\nExamples\n\n<name>NelDelgado</name>\n\
    \nOr\n\n<name>Nel Delgado</name>\n\nTake note of the difference between the spaces\
    \ of each element. Any program that is reading this type of element in an XML\
    \ file should maintain the recognition.\n\nInsignificant Whitespace\n\nThis is\
    \ the space that only allows element content.\n\n<address.category=\"work\">\n\
    \nOr\n\n              <address....category=\"..work\">\n\nThese samples are the\
    \ same. The dots represent the space. The space between address and category on\
    \ the above sample may actually be significant.\n\nxml:space, a special attribute,\
    \ can be attached to a particular element. The addition would indicate that the\
    \ whitespace should not be removed for the particular element. This can be set\
    \ as either default or preserve.\n\n              <!ATTLIST address xml:space\
    \ (default|preserve) 'preserve'>\n\n*   The value default allows that the default\
    \ whitespace processing modes of a particular application to be accepted for this\
    \ particular element.\n\n*   The value preserve commands the application to preserve\
    \ all the whitespaces.\n\nChapter 8 XML Processing and XM Encoding\n\nProcessing\
    \ instructions allow the documents to contain instructions for every application.\
    \ These are not part of the character data of the XML document, but they have\
    \ to pass through the application.\n\nPIs allows you to pass information to all\
    \ the applications. They can appear anywhere in the document. They may also appear\
    \ in the prolog, which includes the DTD or document type definition, after the\
    \ document, or as textual content.\n\nSyntax\n\n              <?target instructions?>\n\
    \n*   The target recognizes the application from which the instruction originates.\n\
    \n*   The instruction is a character that is used to describe the information\
    \ that the application needs to process.\n\nA processing instruction begins in\
    \ a special tag <? and ends with ?>. When the string ?> is encountered, the processing\
    \ abruptly ends.\n\nExample\n\nThough PIs are not often used, they are used to\
    \ link an XML document to a style sheet. This is what it looks like:\n\n<?xml-stylesheet\
    \ href=\"businessforms.css\" type=\"text/css\"?>\n\nThe target is the xml-stylesheet.href=”businessforms.css\"\
            \n\ntype=text/css are the instructions that the target application will\
    \ have to process for the XML document.\n\nWith this instruction, the browser\
    \ will recognize the target by initiating that the XML document should be transformed\
    \ before begin shown. Notice that the 1st attribute recognizes the type of XSL\
    \ transform, while the 2nd attribute indicates its location.\n\nRules\n\nA processing\
    \ instruction contains data except for the combination ?>, which is interpreted\
    \ as a closing delimeter.\n\nExamples\n\n<?welcome to pg=55 of business hub?>\n\
    \nOr this:\n\n              <?hello?>\n\nXML Encoding\n\nThe process of encoding\
    \ converts Unicode characters into binary. The moment the XML processor reads\
    \ a specific XML document, it immediately encodes the document according to the\
    \ type of encoding that is needed.\n\nTypes of Encoding\n\nThere are two types\
    \ of encoding: UTF-8 and UTF-16\\. UTF means USC Transformational Format; USC\
    \ is Universal Character Set. Numbers 8 and 16 indicate the bits used to represent\
    \ the characters. UTF-8 is 1 byte, while UTF-16 is 2 bytes. If an XML document\
    \ has no encoding information, the default set is UTF-8.\n\nSyntax\n\nThe type\
    \ of encoding has to be indicated in the prolog section of the XML document itself.\n\
    \nUTF-8 syntax:\n\n              <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    no\" ?>\n\nUTF-16 syntax:\n\n              <?xml version=\"1.0\" encoding=\"UTF-16\"\
    \ standalone=\"no\" ?>\n\nExample\n\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ standalone=\"no\" ?>\n\n<contact-info>\n\n<name>Dunny Bobbins</name>\n\n<company>Real\
    \ Realtors</company>\n\n<phone>(553) 512-1123</phone>\n\n</contact-info>\n\nThis\
    \ sample indicates the use of UTF-8 encoding, meaning 8-bit characters should\
    \ be used. Files encoded using UTF-8 is smaller in size than those used in UTF-16\\\
    .\n\nChapter 9XML Validation\n\nThe validation process is needed in order to know\
    \ if the contents of the document match the elements, DTD, and/or attributes.\
    \ Validation is also used to determine whether the document complies with the\
    \ restrictions indicated in it.\n\nValidation is done by the XML parser in 2 ways:\
    \ well-formed XML document or valid XML document.\n\nWell-formed XML Document\n\
    \nA document should adhere to the following rules to become well-formed:\n\n*\
    \   A DTD XML file should not contain the following character entities: amp (&),\
    \ lt (<),  gt (>), quot (double quote), and apos (single quote.\n\n*   Proper\
    \ tag order should be followed; for instance the inner tag should be closed even\
    \ before closing the outer tag.\n\n*   All tags should contain a closing tag,\
    \ or it has to have a self-ending tag.\n\n*   The start tag should contain only\
    \ 1 attribute in your extra tag.\n\n*   Amp(&), lt(<), gt (>), quot(double quote),\
    \ and apos(single quote) entities other these mentioned should be declared.\n\n\
    Example\n\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\" ?>\n\n\
    <!DOCTYPE address\n\n[\n\n<!ELEMENT address (name,company,phone)>\n\n<!ELEMENT\
    \ name (#PCDATA)>\n\n<!ELEMENT company (#PCDATA)>\n\n<!ELEMENT phone (#PCDATA)>\n\
    \n]>\n\n<address>\n\n<name>Dunny Bobbins</name>\n\n<company>Real Realtors</company>\n\
    \n<phone>(333) 115-7785</phone>\n\n</address>\n\nThis is well-formed because of\
    \ the following:\n\n*   The type of document is indicated (it is in element type).\n\
    \n*   It has a root element, the address.\n\n*   Self-explanatory tags enclose\
    \ each of the child elements.\n\n*   Order of the tags are well-maintained.\n\n\
    Valid Document\n\nA well-formed XML document with Document Type Declaration or\
    \ DTD, is a valid XML document. The vocabulary and validity of the structure of \
    \ XML documents are  checked against the grammatical rules of the appropriate\
    \ XML language.\n\nSyntax\n\nBasic syntax:\n\n <!DOCTYPE element DTD identifier\n\
    \nThe DTD identifier is used for the document type definition. It may be the path\
    \ in your system or the URL link. If it is pointing to an external path, it is\
    \ referred to as the External Subset.\n\nInternal DTD\n\nThe elements are within\
    \ the XML files. To refer to an internal DTD, the standalone attribute in the\
    \ XML declaration should be set to yes.\n\nSyntax\n\n              <!DOCTYPE root-element\
    \ [element-declarations]>\n\nExample\n\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ standalone=\"yes\" ?>\n\n<!DOCTYPE address [\n\n<!ELEMENT address (name,company,phone)>\n\
    \n<!ELEMENT name (#PCDATA)>\n\n<!ELEMENT company (#PCDATA)>\n\n<!ELEMENT phone\
    \ (#PCDATA)>\n\n]>\n\n<address>\n\n<name>Dunny Bobbins</name>\n\n<company>Real\
    \ Realtors</company>\n\n              <phone>(088) 559-4456</phone>\n\n</address>\n\
    \nRules"
