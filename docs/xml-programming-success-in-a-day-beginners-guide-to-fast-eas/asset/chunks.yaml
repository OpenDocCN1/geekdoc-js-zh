    ```\n<address>\n```\n\n*   区分大小写。这意味着在使用大写字母和小写字母时必须小心。请记住，XML 中的标签应该是全大写或全小写。一个微小的错误就可能导致不预期的结果，因此建议在输入或完成代码前检查您的代码。查看以下在行代码中使用的错误语法示例：\n\
    ```\n<address>\n```\n\n*   元素名称必须以下划线 `_` 或字母开头。\n*   元素名称不能以 `xml`、`Xml` 或 `XML`\
    \ 开头。\n*   元素名称允许包含点、下划线、连字符、数字和字母。允许包含字母数字。然而，允许包含的标点符号只有点 `.`、连字符 `-` 和下划线 `_`。\n\
    *   元素名称不允许包含空格。\n*   容器可以包含元素或文本。\n*   在 XML 中，你可以使用任何想要的名称，`xml` 除外。\n\n## XML\
    \ 中的元素 (Elements in XML)\n\nXML 中的元素可以定义为 XML 的构建块。这些元素可以作为容器，存放文本、属性、元素、媒体对象，甚至是这些内容的组合。每个文档都有一个或多个元素，其范围由起始标签和结束标签界定。另一方面，空元素的范围由空标签界定。\n\
    \n### 语法\n\n在编写 XML 语法时，你应该遵循此格式：\n\n```\n<element-name attribute1 attribute2>\n\
    无论你的内容是什么\n</element-name>\n```\n\n参考上面的示例，`element-name` 是元素的名称，而 `attribute1`\
    \ 和 `attribute2` 是元素的属性，用空格分隔。属性定义了元素的属性。它通过将名称与其对应的值（通常是字符字符串）关联来工作。在编写属性时，你必须如下编写：\n\
    \n```\nname = \"value\"\n```\n\n在编写元素名称时，确保你在起始标签中使用的名称与结束标签中使用的名称一致。此外，名称后面应该跟着一个等号\
    \ ( `=` ) 以及以及位于单引号 `‘ ‘` 或双引号 `“ ”` 内的字符串值。\n\n### 空元素 (Empty Element)\n\n正如你在之前的课程中学到的，空元素是指没有任何内容的元素。编写其语法时，你必须遵循以下格式：\n\
    \n```\n<name attribute1 attribute2… />\n```\n\n如果你正在创建一个文档并必须使用各种元素，可以遵循此格式：\n\
    \n```xml\n<?xml version=\"1.0\"?>\n<contact-information>\n<address category=\"\
    home\">\n<name>Wendy Dawn</name>\n<office>My Office</office>\n<phone>(632) 246-1234</phone>\n\
    <address/>\n</contact-information>\n```\n\n## 第 12 章 树形结构 (Tree Structure)\n\n\
    XML 中的树形结构\n\n"
- fmt: "\nWhen creating documents in XML, see to it that they are descriptive. You\
    \ can use a tree structure, also known as the `XML Tree`, to include details in\
    \ your document. This tree structure is very important in a program. Without them,\
    \ it will be difficult for you to describe your documents.\n\nBasically, a tree\
    \ structure has root elements or parent elements and child elements. Through a\
    \ tree structure, you will be able to identify all the branches and the sub-branches\
    \ included in your program. You will be able to see everything from the root down\
    \ to the branches and leaf nodes. The parsing actually begins at the root and\
    \ then it moves downward to the first branch, leaf nodes, and so on and so forth.\n\
    \nConsider the following example of a simple tree structure in XML:\n\n```xml\n\
    <?xml version = “1.0”?>\n<Business>\n  <Member>\n    <FirstName> Wendy </FirstName>\n\
    \    <LastName> Dawn </LastName>\n    <PhoneNumber> 1234567 </PhoneNumber>\n \
    \   <Email> [wendydawn@eph.com](mailto:wendydawn@eph.com) </Email>\n    <Address>\n\
    \      <State> California </State>\n      <City> Sacramento </City>\n      <ZipCode>\
    \ 94203 </ZipCode>\n    </Address>\n  </Member>\n</Business>\n```\n\nUsing the\
    \ document given above, here is the tree structure that corresponds to it:\n\n\
    ![](images/00016.jpeg) ![](images/00017.jpeg) ![](images/00018.jpeg) ![](images/00019.jpeg)\
    \ ![](images/00020.jpeg) ![](images/00019.jpeg) ![](images/00019.jpeg) ![](images/00021.jpeg)\
    \ ![](images/00022.jpeg) ![](images/00023.jpeg) ![](images/00024.jpeg) ![](images/00025.jpeg)\
    \ ![](images/00026.jpeg) ![](images/00027.jpeg) ![](images/00028.jpeg) ![](images/00029.jpeg)\
    \ ![](images/00030.jpeg) ![](images/00020.jpeg) ![](images/00020.jpeg) ![](images/00020.jpeg)\
    \ ![](images/00031.jpeg) ![](images/00032.jpeg) ![](images/00033.jpeg)\n\nIn the\
    \ diagram shown above, a root element called `<business>` is present. Within that\
    \ element, another element, which is called `<member>` is found. In this element,\
    \ there are branches connected to it. These branches are `<FirstName>`, `<LastName>`,\
    \ `<PhoneNumber>`, `<Email>`, and `<Address>`. Conversely, there are also sub-branches\
    \ connected to the element `<Address>`, and these are `<State>`, `<City>`, and\
    \ `<ZipCode>`.\n\n# Chapter 13: Document Object Model, Namespaces, and Databases\n\
    \nThe Document Object Model (`DOM`) is, in fact, the foundation of XML. All documents\
    \ created in XML consist of a hierarchy of informative units known as nodes. The\
    \ Document Object Model is a way to describe nodes and their respective relationships.\
    \ It is a collection of information pieces or nodes that are organized according\
    \ to their hierarchy, which allows you to navigate through the tree in search\
    \ of a particular information. Since it is based on an information hierarchy,\
    \ it is classified as tree based.\n\nThe Document Object Model in XML also offers\
    \ an API that lets you add, move, remove, or edit nodes in your tree at any point\
    \ you like. This is to allow you to make your application. Take a look at the\
    \ following example. It parses a document into a Document Object Model object\
    \ and extracts certain information from it using JavaScript.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <h1> Example of a Document Object Model </h1>\n  <div>\n\
    \    <b> Business </b> <span id = “business” > </span> <br>\n    <b> Member </b>\
    \ <span id = “member” > </span> <br>\n    <b> Number </b> <span id = “number”\
    \ > </span>\n  </div>\n</body>\n</html>\n```\n\n##\n\n## Namespaces in XML\n\n\
    Namespaces are sets of unique names in XML. A namespace is basically a mechanism\
    \ wherein the element and the attribute name are allowed to be assigned to a group.\
    \ The Uniform Resource Identifier (`URI`) identifies the namespace.\n\n### Namespace\
    \ Declaration\n\nNamespaces are declared with the use of reserved attributes.\
    \ Keep in mind that the attribute name has to either start with `xmlns:` or be\
    \ `xmlns`. Consider the following example:\n\n```xml\n<element xmlns:name = “URL”>\n\
    ```\n\n### Namespace Syntax\n\nAs mentioned earlier, the namespace has to start\
    \ with the keyword `xmlns`. Using the example given above, `URL` is your Namespace\
    \ identifier while `name` is your Namespace prefix.\n\nThe Namespace only affects\
    \ a certain area in a document. The element that contains the declaration as well\
    \ as every one of its descendants are included in the scope of the Namespace.\
    \ Take a look at the following example:\n\n```xml\n<?xml version = “1.0” encoding\
    \ = “UTF-8”?>\n<cont : contact xmlns:cont = [www.sampleprograms.net/profile](http://www.sampleprograms.net/profile)>\n\
    \  <cont : company> Sample Programs </cont : company>\n  <cont : name> John Doe\
    \ </cont : name>\n  <cont : phone> (012) 246-1234 </cont : phone>\n</cont : contact>\n\
    ```\n\nUsing the example shown above, `cont` serves as your Namespace prefix while\
    \ `[www.sampleprograms.net/profile](http://www.sampleprograms.net/profile)` serves\
    \ as your Namespace identifier or `URI`.\n\n##\n\n## Databases in XML\n\nThe Database\
    \ is used for storing information. Because of this, the Native XML Database is\
    \ considered to be more advantageous than the XML-Enabled Database.\n\nTypes of\
    \ Databases in XML\n\nIn XML, there are two primary types of databases: Native\
    \ XML or XML-enabled. The Native XML Database is not based on tables. On the other\
    \ hand, the XML-Enabled Database is simply an extension for converting documents.\
    \ It is a relational database in which the data are stored in tables. These tables\
    \ contain columns and rows. Take a look at the following example that demonstrates\
    \ database in XML.\n\n```xml\n<?xml version = “1.0”?>\n<contact-information>\n\
    \  <contact1>\n    <company> Sample Programs </company>\n    <name> Juan dela\
    \ Cruz </name>\n    <phone> (012) 123-4321 </phone>\n  </contact1>\n  <contact2>\n\
    \    <company> Sample Company </company>\n    <name> Jane Doe </name>\n    <phone>\
    \ (012) 246-1234 </phone>\n  </contact2>\n</contact-information>\n```\n\nIf you\
    \ run the code shown above, you will get an output that consists of a table of\
    \ contacts. You will see a record of contact information, which also contains\
    \ three entities. These entities are the company, name, and phone of contact1\
    \ and contact2.\n\n# Chapter 14: XML Viewers and Editors\n\nIn XML, there are\
    \ a variety of methods you can use to view documents. For instance, you can view\
    \ a document using any browser or a simple text editor. Majority of browsers actually\
    \ support XML, so you do not have to worry about your browser not supporting it.\
    \ You can open your files in XML simply by double clicking on them. However, this\
    \ only works if your document is a local file. If your file is found on the server,\
    \ you have to type in the URL path in your address bar the same way when you open\
    \ your other files in your browser. Do not forget to save your files with a `.xml`\
    \ extension.\n\nTo help you understand the methods used for viewing files in XML,\
    \ consider the following example.\n\n```xml\n<?xml version = “1.0”?>\n<contact-information>\n\
    \  <company> Sample Programs </company>\n  <name> Juan dela Cruz </name>\n  <phone>\
    \ (012) 123-4321 </phone>\n</contact-information>\n```\n\n## Text Editors in XML\n\
    \nYou can actually use any text editor you want. You can use Textpad, TextEdit,\
    \ or Notepad to view and create documents in XML.\n\n## Using Google Chrome\n"
  raw: 'When creating documents in XML, see to it that they are descriptive. You can
    use a tree structure, also known as the XML Tree, to include details in your document.
    This tree structure is very important in a program. Without them, it will be difficult
    for you to describe your documents.


    Basically, a tree structure has root elements or parent elements and child elements.
    Through a tree structure, you will be able to identify all the branches and the
    sub-branches included in your program. You will be able to see everything from
    the root down to the branches and leaf nodes. The parsing actually begins at the
    root and then it moves downward to the first branch, leaf nodes, and so on and
    so forth.


    Consider the following example of a simple tree structure in XML:


    <?xml version = “1.0”?>


    <Business>


    <Member>


    <FirstName> Wendy </FirstName>


    <LastName> Dawn </LastName>


    <PhoneNumber> 1234567 </PhoneNumber>


    <Email> [wendydawn@eph.com](mailto:wendydawn@eph.com) </Email>


    <Address>


    <State> California </State>


    <City> Sacramento </City>


    <ZipCode> 94203 </ZipCode>


    </Address>


    </Member>


    </Business>


    Using the document given above, here is the tree structure that corresponds to
    it:


    ![](images/00016.jpeg)


    ![](images/00017.jpeg)


    ![](images/00018.jpeg)


    ![](images/00019.jpeg) ![](images/00020.jpeg) ![](images/00019.jpeg) ![](images/00019.jpeg)
    ![](images/00021.jpeg) ![](images/00022.jpeg)


    ![](images/00023.jpeg) ![](images/00024.jpeg) ![](images/00025.jpeg) ![](images/00026.jpeg)
    ![](images/00027.jpeg)


    ![](images/00028.jpeg)


    ![](images/00029.jpeg) ![](images/00030.jpeg) ![](images/00020.jpeg) ![](images/00020.jpeg)
    ![](images/00020.jpeg)


    ![](images/00031.jpeg) ![](images/00032.jpeg) ![](images/00033.jpeg)


    In the diagram shown above, a root element called <business> is present. Within
    that element, another element, which is called <member> is found. In this element,
    there are branches connected to it. These branches are <FirstName>, <LastName>,
    <PhoneNumber>, <Email>, and <Address>. Conversely, there are also sub-branches
    connected to the element <Address>, and these are <State>, <City>, and <ZipCode>.


    Chapter 13 Document Object Model, Namespaces, and Databases


    The Document Object Model (DOM) is, in fact, the foundation of XML. All documents
    created in XML consist of a hierarchy of informative units known as nodes. The
    Document Object Model is a way to describe nodes and their respective relationships.
    It is a collection of information pieces or nodes that are organized according
    to their hierarchy, which allows you to navigate through the tree in search of
    a particular information. Since it is based on an information hierarchy, it is
    classified as tree based.


    The Document Object Model in XML also offers an API that lets you add, move, remove,
    or edit nodes in your tree at any point you like. This is to allow you to make
    your application. Take a look at the following example. It parses a document into
    a Document Object Model object and extracts certain information from it using
    JavaScript.


    <!DOCTYPE html>


    <html>


    <body>


    <h1> Example of a Document Object Model </h1>


    <div>


    <b> Business </b> <span id = “business”> </span> <br>


    <b> Member </b> <span id = “member”> </span> <br>


    <b> Number </b> <span id = “number”> </span>


    </div>


    Namespaces in XML


    Namespaces are sets of unique names in XML. A namespace is basically a mechanism
    wherein the element and the attribute name are allowed to be assigned to a group.
    The Uniform Resource Identifier (URI) identifies the namespace.


    Namespace Declaration


    Namespaces are declared with the use of reserved attributes. Keep in mind that
    the attribute name has to either start with xmlns: or be xmlns. Consider the following
    example:


    <element xmlns:name = “URL”>


    Namespace Syntax


    As mentioned earlier, the namespace has to start with the keyword xmlns. Using
    the example given above, URL is your Namespace identifier while name is your Namespace
    prefix.


    The Namespace only affects a certain area in a document. The element that contains
    the declaration as well as every one of its descendants are included in the scope
    of the Namespace. Take a look at the following example:


    <?xml version = “1.0” encoding = “UTF-8”?>


    <cont : contact xmlns:cont = [www.sampleprograms.net/profile](http://www.sampleprograms.net/profile)>


    <cont : company> Sample Programs </cont : company>


    <cont : name> John Doe </cont : name>


    <cont : phone> (012) 246-1234 </cont : phone>


    </cont : contact>


    Using the example shown above, cont serves as your Namespace prefix while [www.sampleprograms.net/profile](http://www.sampleprograms.net/profile)
    serves as your Namespace identifier or URI. With this being said, you can say
    that the attribute names and the element names with the prefix cont, including
    your contact element, are classified under the namespace [www.sampleprograms.net/profile](http://www.sampleprograms.net/profile).


    Databases in XML


    The Database is used for storing large amounts of information in XML format. Because
    XML is increasing in popularity in numerous fields, it has been required to have
    a secured place for storing documents. Thus, the data stored in databases are
    queried through XQuery. Then, they are serialized and finally exported into the
    preferred format.


    Types of Databases in XML


    In XML, there are two primary types of databases: Native XML or NXD and XML-enabled.
    The Native XML Database is not based on the table format. Instead, it is based
    on the container. It is capable of storing large amounts of data and documents
    in XML. In addition, it is queried by XPath-expressions. More programmers actually
    prefer the Native XML Database to the XML-Enabled Database due to its better ability
    to query, maintain, and store the document in XML. Because of this, the Native
    XML Database is considered to be much more advantageous than the XML-Enabled Database.


    On the other hand, the XML-Enabled Database is simply an extension for converting
    documents in XML. It is a relational database in which the data are stored in
    tables that consist of columns and rows. These tables contain sets of records
    that consist of fields. Take a look at the following example that demonstrates
    the database in XML.


    <?xml version = “1.0”?>


    <contact-information>


    <contact1>


    <company> Sample Company </company>


    <name> Jane Doe </name>


    <phone> (012) 246-1234 </phone>


    </contact1>


    <contact2>


    <company> Sample Company </company>


    <name> John Doe </name>


    <phone> (012) 123-5678 </phone>


    </contact2>


    </contact-information>


    If you run the code shown above, you will get an output that consists of a table
    of contacts. You will see a record of contact information, which also contains
    three entities. These entities are the company, name, and phone of contact1 and
    contact2.


    Chapter 14 XML Viewers and Editors


    In XML, there are a variety of methods you can use to view documents. For instance,
    you can view a document using any browser or a simple text editor. Majority of
    browsers actually support XML, so you do not have to worry about your browser
    not supporting it. You can open your files in XML simply by double clicking on
    them. However, this only works if your document is a local file. If your file
    is found on the server, you have to type in the URL path in your address bar the
    same way you do when you open your other files in your browser. Do not forget
    to save your files with a “.xml” extension.


    To help you understand the methods used for viewing files in XML, consider the
    following example.


    <?xml version = “1.0”?>


    <contact-information>


    <company> Sample Programs </company>


    <name> Juan dela Cruz </name>


    <phone> (012) 123-4321 </phone>


    </contact-information>


    Text Editors in XML


    You can actually use any text editor you want. You can use Textpad, TextEdit,
    or Notepad to view and create documents in XML.


    Using Google Chrome'
