  \ 中的标签应该是全大写或全小写。一个微小的错误就可能导致不预期的结果，因此建议在输入或完成代码前检查您的代码。查看以下在行代码中使用的错误语法示例：\n```\n\
  <address>\n```\n\n*   区分大小写。这意味着在使用大写字母和小写字母时必须小心。请记住，XML 中的标签应该是全大写或全小写。一个微小的错误就可能导致不预期的结果，因此建议在输入或完成代码前检查您的代码。查看以下在行代码中使用的错误语法示例：\n\
  ```\n<address>\n```\n\n*   区分大小写。这意味着在使用大写字母和小写字母时必须小心。请记住，XML 中的标签应该是全大写或全小写。一个微小的错误就可能导致不预期的结果，因此建议在输入或完成代码前检查您的代码。查看以下在行代码中使用的错误语法示例：\n\
  ```\n<address>\n```\n\n*   元素名称必须以下划线 `_` 或字母开头。\n*   元素名称不能以 `xml`、`Xml` 或 `XML`\
  \ 开头。\n*   元素名称允许包含点、下划线、连字符、数字和字母。允许包含字母数字。然而，允许包含的标点符号只有点 `.`、连字符 `-` 和下划线 `_`。\n\
  *   元素名称不允许包含空格。\n*   容器可以包含元素或文本。\n*   在 XML 中，你可以使用任何想要的名称，`xml` 除外。\n\n## XML\
  \ 中的元素 (Elements in XML)\n\nXML 中的元素可以定义为 XML 的构建块。这些元素可以作为容器，存放文本、属性、元素、媒体对象，甚至是这些内容的组合。每个文档都有一个或多个元素，其范围由起始标签和结束标签界定。另一方面，空元素的范围由空标签界定。\n\
  \n### 语法\n\n在编写 XML 语法时，你应该遵循此格式：\n\n```\n<element-name attribute1 attribute2>\n\
  无论你的内容是什么\n</element-name>\n```\n\n参考上面的示例，`element-name` 是元素的名称，而 `attribute1`\
  \ 和 `attribute2` 是元素的属性，用空格分隔。属性定义了元素的属性。它通过将名称与其对应的值（通常是字符字符串）关联来工作。在编写属性时，你必须如下编写：\n\
  \n```\nname = \"value\"\n```\n\n在编写元素名称时，确保你在起始标签中使用的名称与结束标签中使用的名称一致。此外，名称后面应该跟着一个等号\
  \ ( `=` ) 以及以及位于单引号 `‘ ‘` 或双引号 `“ ”` 内的字符串值。\n\n### 空元素 (Empty Element)\n\n正如你在之前的课程中学到的，空元素是指没有任何内容的元素。编写其语法时，你必须遵循以下格式：\n\
  \n```\n<name attribute1 attribute2… />\n```\n\n如果你正在创建一个文档并必须使用各种元素，可以遵循此格式：\n\n\
  ```xml\n<?xml version=\"1.0\"?>\n<contact-information>\n<address category=\"home\"\
  >\n<name>Wendy Dawn</name>\n<office>My Office</office>\n<phone>(632) 246-1234</phone>\n\
  <address/>\n</contact-information>\n```\n\n## 第 12 章 树形结构 (Tree Structure)\n\nXML\
  \ 中的树形结构\n\n\n\n\n在创建 XML 文档时，请确保它们具有描述性。你可以使用树结构（也称为 `XML Tree`）来在文档中包含细节。这种树结构在程序中非常重要。没有它们，你将很难描述你的文档。\n\
  \n基本上，树结构具有根元素（或父元素）和子元素。通过树结构，你能够识别程序中包含的所有分支和子分支。你可以看到从根到分支以及叶子节点的所有内容。解析实际上从根开始，然后向下移动到第一个分支、叶子节点以此此类推。\n\
  \n考虑以下 XML 中简单树结构的示例：\n\n```xml\n<?xml version = “1.0”?>\n<Business>\n  <Member>\n\
  \    <FirstName> Wendy </FirstName>\n    <LastName> Dawn </LastName>\n    <PhoneNumber>\
  \ 1234567 </PhoneNumber>\n    <Email> wendydawn@eph.com </Email>\n    <Address>\n\
  \      <State> California </State>\n      <City> Sacramento </City>\n      <ZipCode>\
  \ 94203 </ZipCode>\n    </Address>\n  </Member>\n</Business>\n```\n\n使用上方文档，以下是与其对应的树结构：\n\
  \n![](img/00016.jpeg) ![](img/00017.jpeg) ![](img/00018.jpeg) ![](img/00019.jpeg)\
  \ ![](img/00020.jpeg) ![](img/00019.jpeg) ![](img/00019.jpeg) ![](img/00021.jpeg)\
  \ ![](img/00022.jpeg) ![](img/00023.jpeg) ![](img/00024.jpeg) ![](img/00025.jpeg)\
  \ ![](img/00026.jpeg) ![](img/00027.jpeg) ![](img/00028.jpeg) ![](img/00029.jpeg)\
  \ ![](img/00030.jpeg) ![](img/00020.jpeg) ![](img/00020.jpeg) ![](img/00020.jpeg)\
  \ ![](img/00031.jpeg) ![](img/00032.jpeg) ![](img/00033.jpeg)\n\n在上面的图中，存在一个名为 `<business>`\
  \ 的根元素。在该元素内部，发现了另一个名为 `<member>` 的元素。在这个元素中，有连接到它的分支。这些分支是 `<FirstName>`、`<LastName>`、`<PhoneNumber>`、`<Email>`\
  \ 和 `<Address>`。相反，元素 `<Address>` 也有子分支，这些是 `<State>`、`<City>` 和 `<ZipCode>`。\n\n\
  ## 第 13 章：文档对象模型、命名空间和数据库\n\n文档对象模型（`DOM`）实际上是 XML 的基础。在 XML 中创建的所有文档由一组被称为“节点”的信息层级单元组成。文档对象模型是描述节点及其相应关系的方法。它是根据其层次结构组织的信息片段或节点集合，允许你遍历树结构以搜索特定的信息。由于它是基于信息层次结构的，因此它被归类为基于树的。\n\
  \nXML 中的文档对象模型还提供了一个 API，允许你在喜欢的任何时候添加、移动、删除或编辑树中的节点。这是为了让你能够制作应用程序。看看下面这个示例。它将文档解析为文档对象模型对象，并使用\
  \ JavaScript 从中提取某些信息。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h1> Example\
  \ of a Document Object Model </h1>\n  <div>\n    <b> Business </b> <span id = “business”\
  \ > </span> <br>\n    <b> Member </b> <span id = “member” > </span> <br>\n    <b>\
  \ Number </b> <span id = “number” > </span>\n  </div>\n</body>\n</html>\n```\n\n\
  ##\n\n### XML 中的命名空间\n\n命名空间是 XML 中的唯一名称集。命名空间基本上是一种机制，允许将元素和属性名称分配给一组。统一资源标识符（`URI`）标识命名空间。\n\
  \n### 命名空间声明\n\n命名空间使用预留属性声明。记住，属性名必须以 `xmlns:` 开始或为 `xmlns`。考虑以下示例：\n\n```xml\n\
  <element xmlns:name = “URL”>\n```\n\n### 命名空间语法\n\n如前所述，命名空间必须以关键字 `xmlns` 开始。使用上面的示例，`URL`\
  \ 是你的命名空间标识符，而 `name` 是你的命名空间前缀。\n\n命名空间仅影响文档中的特定区域。包含声明的元素及其每一个后代都包含在命名空间的范围内。看看以下示例：\n\
  \n```xml\n<?xml version = “1.0” encoding = “UTF-8”?>\n<cont : contact xmlns:cont\
  \ = [www.sampleprograms.net/profile](http://www.sampleprograms.net/profile)>\n \
  \ <cont : company> Sample Programs </cont : company>\n  <cont : name> John Doe </cont\
  \ : name>\n  <cont : phone> (012) 246-1234 </cont : phone>\n</cont : contact>\n\
  ```\n\n使用上面的示例，`cont` 是你的命名空间前缀，而 [www.sampleprograms.net/profile](http://www.sampleprograms.net/profile)\
  \ 是你的命名空间标识符或 `URI`。\n\n##\n\n### XML 中的数据库\n\n数据库用于存储信息。因此，原生 XML 数据库比启用 XML 数据库更有优势。\n\
  \nXML 中的数据库类型\n\n在 XML 中，有两种主要的数据库类型：原生 XML 或启用 XML。原生 XML 数据库不是基于表格的。相反，启用 XML\
  \ 数据库仅仅是转换文档的扩展。它是一个在表格中存储数据的数据库。这些表格包含列和行。看下面的示例演示 XML 中的数据库。\n\n```xml\n<?xml\
  \ version = “1.0”?>\n<contact-information>\n  <contact1>\n    <company> Sample Programs\
  \ </company>\n    <name> Juan dela Cruz </name>\n    <phone> (012) 123-4321 </phone>\n\
  \  </contact1>\n  <contact2>\n    <company> Sample Company </company>\n    <name>\
  \ Jane Doe </name>\n    <phone> (012) 246-1234 </phone>\n  </contact2>\n</contact-information>\n\
  ```\n\n如果你运行上面的代码，将得到一个联系人表格输出。你会看到联系信息，它包含三个实体。这些实体是 contact1 和 contact2 的公司、姓名和电话。\n\
  \n## 第 14 章：XML 查看器和编辑器\n\n在 XML 中，有多种方法可以查看文档。例如，你可以使用任何浏览器或简单的文本编辑器查看文档。大多数浏览器实际上都支持\
  \ XML，所以你不需要担心浏览器不支持它。你可以只需通过双击打开 XML 文件。然而，这只有当你的文档是本地文件时才有效。如果你的文件位于服务器上，你必须像在浏览器中打开其他文件一样，在地址栏中输入\
  \ URL 路径。不要忘记将文件保存为 `.xml` 扩展名。\n\n为了帮助你理解查看 XML 文件的方法，请考虑以下示例：\n\n```xml\n<?xml\
  \ version = “1.0”?>\n<contact-information>\n  <company> Sample Programs </company>\n\
  \  <name> Juan dela Cruz </name>\n  <phone> (012) 123-4321 </phone>\n</contact-information>\n\
  ```\n\n### XML 中的文本编辑器\n\n你实际上可以使用任何喜欢的文本编辑器。你可以使用 Textpad、TextEdit 或 Notepad（记事本）来查看和创建\
  \ XML 文档。\n\n### 使用 Google Chrome\n\n\n\n\n\nGoogle Chrome 是支持 XML 的主要浏览器之一。如果你正在使用这个浏览器，那么你很幸运。你可以轻松地打开你的\
  \ XML 代码。\n\n### 使用 Mozilla Firefox\n\nMozilla Firefox 也支持 XML，但首先，你必须在 Google Chrome\
  \ 中打开你的代码。要做到这一点，你需要双击文件。你将看到代码以彩色文本的形式显示。这非常棒，因为你可以更轻松地阅读你的代码。在元素的左侧，你会看到加号（`+`）和减号（`-`）符号。如果你点击加号（`+`），你的代码行就会展开。相反，如果你点击减号（`-`），你的代码就会被隐藏。\n\
  \n### XML 中的文档错误\n\n如果你发现代码缺少了某些标签，那么你可能存在错误。如果是这样，你将看到一条提示错误信息的消息。请看下面的示例：\n\n\
  ```xml\n<?xml version = “1.0”?>\n\n<contact-information>\n\n<company> Sample Company\
  \ </company>\n\n<name> Jane Doe </name>\n\n<phone> (045) 123-5678 </phone>\n\n</cntact-information>\n\
  ```\n\n如果你在 Google Chrome 中打开上述代码，将收到一条错误信息。如你所见，起始标签 `<contact-information>` 和结束标签\
  \ `</cntact-information>` 并不匹配。\n\n### XML 中的编辑器\n\n编辑器是标记语言编辑器。可以使用现有的编辑器创建和编辑\
  \ XML 文档。例如，你可以使用 Wordpad、记事本或计算机上的任何其他文本编辑器。如果你不想下载，你甚至可以使用在线的专业编辑器。在线编辑器通常具有更强大的编辑功能。它们会自动关闭未闭合的标签，并严格检查语法。它们用颜色高亮语法以提高可读性，并提供根据架构文件（Schemas）和\
  \ DTD 对文档进行自动验证。它们对于编写有效的 XML 代码也很有帮助。\n\n### XML 中的开源编辑器\n\n在 XML 中，你可以从多种编辑器中选择。可用的开源编辑器包括：\n\
  \n- **Xerlin**: 它是一个为 `Java 2` 平台开发的开源编辑器，根据 Apache 许可证发布。由于它是一个基于 Java 的建模应用程序，因此可以更容易地创建和编辑\
  \ XML 文件。\n- **Content Assembly Mechanism (CAM)**：它是一个编辑器工具，具有 `XML + JSON + SQL\
  \ Open-XDX` 特，由 Oracle 赞助。\n\n## 第 15 章 XML 中的解析器和处理器\n\n在 XML 中，解析器是一个软件包或软件库，为客户端应用程序处理文档提供接口。它会检查文档并验证其是否具有正确的格式。它还可以验证文档。今天，大多数浏览器都内置了\
  \ XML 解析器，因此你不需要担心你的浏览器不支持它。主流浏览器没有内置解析器的情况是不寻常的。\n\n为了帮助你更好地理解解析器，这里有一张展示了解析器如何与\
  \ XML 文档交互的图：\n\n![](img/00034.jpeg) ![](img/00035.jpeg) ![](img/00036.jpeg)\n![](img/00037.jpeg)\
  \ ![](img/00038.jpeg)\n\n解析器的主要目标是将 XML 转换为可读且可理解的代码。为了使解析过程更容易，可以使用某些商业产品。这些产品用于拆解\
  \ XML 文档并产生更可靠的结果。以下是一些常用的解析器：\n\n- **Microsoft Core XML Services (MSXML)**: 它是微软提供的标准\
  \ XML 工具集。它包含一个解析器。\n- **Java 内置解析器**: 它是仅在 `Java` 库中提供的解析器。该库的设计方式允许用户用外部实现替换此类内置解析器，例如来自\
  \ Apache 的 `Saxon` 或 `Xerces`。\n- **Xerces**: 它由 Apache 软件基金开发，是一个著名的开源项目。它也用 Java\
  \ 实现了。\n- **Saxon**: 它提供了用于解析、查询和转换 XML 的工具。\n- **System.Xml.XmlDocument**: 它是 `.NET`\
  \ 库中的一个类。该库包含许多与处理 XML 相关的类。\n\n## XML 中的处理器\n\n处理 XML 是当软件程序读取文档并采取必要行动时。具有处理和读取\
  \ XML 文档能力的程序被称为 XML 处理器。XML 处理器读取文件将其转换为程序其他部分可以访问的内存中结构。最重要的处理器读取文档并将其转换为其他子程序或程序可以使用的内部表示。这被称为解析器。它实际上是\
  \ XML 处理程序中的一个至关重要的组件。\n\n### 处理器的类型\n\n处理器主要分为两类：验证型（validating）和非验证型（non-validating）。这些类型取决于处理器是否检查文档的有效性。发现有效性错误的处理器应该报告此类错误。尽管如此，它们可能会继续或恢复其正常处理。\n\
  \n一些验证型解析器包括：`xml4c` (C++, IBM), `xml4j` (Java, IBM), `MSXML` (Java, Microsoft),\
  \ `TclXML` (TCL), `XML :: Parser` (Perl), `xmlproc` (Phyton) 和 `Java Project X`\
  \ (Java, Sun)。\n\n一些非验证型解析器包括：`OpenXML` (Java), `xp` (Java), `Lark` (Java), `Elfred`\
  \ (Java), `XParse` (JavaScript), `expat` (C) 和 `xmllib` (Phyton)。\n\n## XML 中的处理指令\n\
  \n处理器处理指令。处理指令实际上是包含软件指令特殊标签。如果你是初学者，可能会认为处理指令很复杂。然而，处理指令并不常用。\n\n### 处理指令的重要性\n\
  \n如果你习惯使用 HTML，你可能注意到它没有处理指令。每当你需要向软件发送指令时，你就误用了注释标签。这种误用的经典示例是服务器端包含（SSI）。请看下面的包含文件的\
  \ SSI 示例：\n\n```\n<!-- include virtual = “samplefile.txt” -->\n```\n\n是的，这看起来是一个明智且实用的主意。但你必须记住这仍然是对注释标签的误用。注释标签有一个目的，即在程序中包含注释。它并不是这样设计的。尽管如此，如果你的\
  \ HTML 页面具有 `shtml` 扩展名，Web 服务器将在页面发送到浏览器之前搜索并处理 SSI。\n\n另一种更方便地为浏览器提供 CSS 和优化标记的方法是使用条件注释。请看下面的示例：\n\
  \n```\n<!--—(if IE 6)>\n<link rel = “stylesheet” type = “text/css” href = ie6only.css>\n\
  <! (endif)-->\n```\n\n再次，这是另一种使用注释标签的方法。然而，这仍然是误用，因为你并不是为了在程序中插入注释。\n\n由于注释标签被误用于其他目的，开发者在\
  \ XML 中找到了克服这些限制的方法。他们承认存在无法预见的特殊需求。这些特殊需求在 XML 中比在 HTML 中更容易发生。此外，开发处理指令是为了防止注释标签被误用。它还为了每种属性和元素无法立即解决的特殊需求提供一种灵活的通用机制。\n\
  \n### 处理指令\n\n处理指令使得文档包含应用程序的指令成为可能。然而，它们并不是这些文档的字符数据部分。它们也必须传递给应用程序。\n\n\n\n\n\n\
  每个处理器都必须忽略处理指令（Processing Instructions）的含义，因为它们根本不知道这些指令代表什么。尽管如此，进程必须将处理指令的内容和名称传递给应用程序。\n\
  \n请看以下 XML 规范：\n\n```\nPI : : = ‘<?’ PITarget ( S ( Char* - ( Char* ‘?>’ Char* )\
  \ ) ) ? ‘?>’\n\nPITarget : : = Name – ( ( ‘X’ | ‘X’ ) ( ‘M’ | ‘m’ ) ( ‘L’ | ‘l’\
  \ ) )\n```\n\n`PITarget` 或紧跟第一个问号后面的名称实际上是处理指令的名字。它后面必须留一个空格。处理指令的其余部分（包括最后一个问号）是一个字符串值或内容。正如你之前在之前的章节中所学到的，`xml`\
  \ 字母是预留的。因此，不应该使用它来开始一个用户定义的处理指令名称。同样，内容不应包含 `?>` 字符。\n\n如你所见，处理指令的内容仅仅是一个字符串值。尽管如此，创建看起来像伪属性的内容是一种常见做法。请看以下示例：\n\
  \n```\n<? xml – stylesheet href = “sample.css” type = “text/css” ?>\n```\n\n除了这些，你也可以编写\
  \ `abc1234567` 或“Processing Instructions are quite unusual but you can eventually\
  \ get used to using them.”这些示例在 XML 中被视为合法内容。\n\n### 处理指令的常见用途\n\n除非在某些情况下，处理指令并不经常使用。事实上，它们是\
  \ XML 文档链接到样式表的官方方法。微软在 `Microsoft Office 2003` 中使用了处理指令。这样做是为了用户在将其保存为 XML 时能够轻松识别\
  \ `Microsoft Excel` 和 `Microsoft Word` 文档。\n\n### XML 样式表\n\n在 1999 年，使用处理指令将样式表链接到\
  \ XML 文档已成为标准做法。\n\n### Microsoft Office 2003 中的处理指令\n\n自从 `Microsoft Office 2003`\
  \ 开发以来，处理指令在用户中变得越来越流行。`Word` 和 `Excel` 现在都可以使用 `xml` 文件扩展名保存为它们自己的 `xml` 格式。然而，事实证明这是一种低效的方法，因为许多其他应用程序也使用了相同的扩展名。\n\
  \n由于这个问题，微软使用了处理指令进行标识。这样 XML 文件就可以向 `Windows Explorer` 和 `Internet Explorer` 标记为\
  \ `Excel` 或 `Word` 文档。\n\n如果你正在使用 `Microsoft Word 2003`，XML 声明后的处理指令显示如下：\n\n```\n\
  <? mso-application progid = “Word.Document” ?>\n```\n\n如果你正在使用 `Microsoft Excel\
  \ 2003`，XML 声明后的处理指令显示如下：\n\n```\n<? mso-application progid = “Excel.Sheet” ?>\n\
  ```\n\n`Microsoft Office 2007` 使用 zip 文件格式用于 PowerPoint (`pptx`)、Word (`docx`) 和\
  \ Excel (`xlsx`)。每个压缩的文档都有多个媒体文件、XML 文件和其他文件。如果你正在使用 `Microsoft Office 2007`，你就不再需要使用处理指令，因为可用的文件扩展名已经足够。但是，如果你想以\
  \ 2003 XML 格式保存文件且你正在使用 `Microsoft Office 2007`，则可以使用处理指令。\n\n## 几乎适用于一切的处理指令\n\n\
  处理指令具有多种用途。事实上，它们可以用于执行各种操作，例如指示标记中的换行符以及确定哪些单词不需要进行拼写检查等。\n\n为了让你更好地理解处理指令，请考虑以下示例。在这里，你将学习处理指令的多样性。你将发现它们如何解决几乎每一个问题。例如，如果你在\
  \ XML 中有一个项目，你可以使用处理指令来标注你仍处于处理过程中的文档。\n\n```\n<? TeamExample member = “Wendy” date\
  \ = “2015-11-04” comment = “I believe that the attributes given in the product element\
  \ are not of particular importance and therefore can be eliminated.” ?>\n```\n\n\
  如果你使用了注释标签（comment tags），你可能很难区分实际注释与文档中的其他元素。因此，为了解决此类问题，你可以使用处理指令。你不再需要在架构（schema）中声明它们。你也可以轻松地将它们与实际注释区分来，并在必要删除删除。\n\
  \n注释只有内容。另一方面，处理指令既有内容又有名称。例如，你可以使用 `processing-instruction()` 节点测试在 `XPath` 中匹配所有处理指令。尽管如此，你也可以通过名称搜索处理指令并返回其内容。为了实现这一点，你需要执行以下操作：\n\
  \n```\nprocessing-instruction() [ name() = “TeamExample” ]\n```\n\n请记住，内容仅仅是一个长字符串，伪属性的伪值可以使用正则表达式（Regular\
  \ Expressions）进行分析。\n\n## 什么时候应该使用处理指令？\n\n理想情况下，只有在你没有其他选择时才应该使用处理指令。换句话说，你应该将它们视为最后的手段。尽可能地，你应该克制使用它们。如果你在不需要的时候使用它们，它们将会被忽略。如果软件程序不理解它们代表什么，情况尤其如此。请注意，即使是专业开发者在使用它们之前也需要知道它们的含义。与\
  \ `xml-stylesheet` 处理指令以及 `Microsoft Office 2003` 中的处理指令不同，处理指令并不容易掌握。\n\n## XML\
  \ 声明不是处理指令\n\n很多人误误认为 XML 声明是处理指令或特殊处理指令。然而，你应该知道这远非事实。XML 声明和处理指令实际上非常不同。\n\n尽管\
  \ XML 声明看起来和作用像处理指令，但它的功能是不同的。XML 处理器会感知 XML 声明及其内容。事实上，它非常了解它，以至于在发现错误时可以快速返回错误信息。\n\
  \n对于处理指令，情况就不同了。它们恰恰相反。XML 处理器忽略处理指令，但将它们的名称和内容传递给应用程序。\n\n世界维网联盟（W3C）建议使用扩展样式表语言转换（XSLT）和\
  \ XML 路径语言（XPath）将在 XML 中标记的信息从某种词汇转换为另一种词汇。\n\n这二者提供了一种树形转换语言的极佳实现。它们将使用单一词汇的 XML\
  \ 实例转换为纯文本、旧版 HTML 词汇或任何可用的词汇。\n\n## 结\n\n再次感谢下载这本书！\n\n我希望这本书能够帮助你在计算任务中使用 XML。\n\
  \n下一步是将你所学到的知识付诸实践——尝试使用 XML 来改进你的 Web 开发项目。即使你不是真的热衷于创建网站，请放心，这种标记语言在你的行业中也有可能的用途。不要犹豫与你的朋友和同事分享你的知识。\n\
