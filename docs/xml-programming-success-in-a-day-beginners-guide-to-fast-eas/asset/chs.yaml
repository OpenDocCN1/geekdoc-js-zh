  \n## 引言\n\n我想感谢你的下载，并祝贺你下载了《一天掌握 XML 编程》。这本书包含了关于如何进行 XML 编程的经过的步骤和策略。即使你对计算机和编程并不了解，这本书也能帮助你理解\
  \ XML 的本质。它还将帮助你发现它的潜力。请记住，XML 是你可以在不成为真正的技术专家的情况下学习的最强大的标记语言之一。再次感谢下载，希望你读得愉快！\n\
  \n## 第 1 章 什么是 XML 编程？\n\n`XML`，即可扩展标记语言（Extensible Markup Language），被认为是一场技术革命，几乎与发明轮子和切片面包并论。它可能是\
  \ 20 世纪 90 年代后期至今最受关注的技术，尽管 Java 直随其后。\n\n那么，XML 有什么大不了的？首先，你可以用它让你的 Web 应用程序更强大、更通用、更智能。\n\
  \n### 什么是 XML？\n\n你现在知道 `XML` 代表可扩展标记语言。`XML` 是基于文本的，源自标准通用标记语言或 `SGML`。`XML` 标签用于识别、组织和存储数据。它与显示数据的\
  \ `HTML` 标签不同。尽管 `XML` 在未来绝不会取代 `HTML`，但它通过采用 `HTML` 的一些实用功能引入了许多可能性。\n\n所以基本上，`XML`\
  \ 是一种既独立于硬件也独立于软件的用于携带信息的工具。尽管它是与 `HTML` 非常相似的标记语言，但它是一个完全不同的实体。`XML` 的设计重点是数据，而\
  \ `HTML` 的设计重点是数据的呈现。`XML` 描述数据，而 `HTML` 显示数据。`XML` 专注于携带信息，而 `HTML` 专注于显示信息。\n\n\
  此外，`XML` 设计成是自描述的。为了在 `XML` 中高效工作，你至少对 `HTML` 和 `JavaScript` 有基本的了解是非常重要的。`XML`\
  \ 中的标签也不是预定义的。因此，你需要定义自己的标签。\n\n请看下面的示例：\n\n```xml\n<note>\n    <to> Jane </to>\n\
  \    <from> John </from>\n    <heading> Memo </heading>\n    <body> Come to the\
  \ meeting at ten o’clock in the morning tomorrow. </body>\n</note>\n```\n\n如你所见，上面的示例是非常具有自描述性的。你可以看到关于发送者和接收者的信息。它还包含一个标题和消息正文。尽管如此，你应该意识到这个\
  \ `XML` 文档仅仅是包含标签的信息。它没有特定的功能。换句话说，它是没用的，没有做任何重要的事情。为了让你能够发送、显示或接收这条笔记，你需要使用一个软件程序。\n\
  \n在 `XML` 中，你定义自己的标签。使用上面的示例，你可以看到标签并不是在特定的 `XML` 标准中定义的。这些标签是由文档作者“发明”的。作为一名程序员，你有自由发明任何你喜欢的标签。你也有自由创建自己的文档结构。\n\
  \n`XML` 是一种没有任何预定义标签的语言。相比之下，`HTML` 有你需要在代码中使用的预定义标签。`HTML` 文档只允许使用 `HTML` 标准中定义的标签，例如\
  \ `<h1>` 和 `<p>`。\n\n从其名称中可以推出 `XML` 的三个特性：\n\n- **可扩展性 (Extensible)**：`XML` 允许你自定义自己的标签，使其适应你的应用程序。它还允许你扩展对“文档”概念的理解：存储文件服务器上的文件。\n\
  - **标记性 (Markup)**：`XML` 的标签或元素是比较熟悉的特征。`XML` 是可以在不同 Web 服务之间流动的元素。在 `XML` 中，你有机会定义自己的标签或元素。\n\
  - **语言性 (Language)**：`XML` 和 `HTML` 几乎相同，但 `XML` 更灵活。它是元语言。\n\n### 你需要 XML 吗？\n\n\
  你需要 `XML` 是因为 `HTML` 专门用于显示。对于非计算机专家来说，`HTML` 仅仅是一种演示语言，而 `XML` 是数据描述语言。这里是你在检查商品列表时常见的代码：\n\
  \n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/REC44/loose.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<title>商品列表</title>\n\
  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=iso-8859-1\" />\n\
  </head>\n<body>\n<h1>商品列表</h1>\n<h2>商品 A</h2>\n<p>商品 A 是一个可以让你的家务变得更简单的卓越工具。</p>\n\
  <p><b>价格：$35.00</b></p>\n<p><b>运费：$8.00</b></p>\n<h2>商品 B</h2>\n...\n<h3>商品 C</h3>\n\
  <p><i>价格：$55.99</i></p>\n<p>这太棒了，你不会后悔购买的。</p>\n...\n</body>\n</html>\n```\n\n##\
  \ 学习语义与术语\n\n语义是对任何语言意义的研究。事实证明，人类在语义方面比计算机更优秀，仅仅因为人类擅长推导意义。每个动作或语言中都有意义；对于人类来说，对呈面前的内容很容易得出结论。\n\
  \n例如，当你被要求列出尽可能多的雌性名称时，你最可能会从母鹿、母虎、母狮或羊开始。相反，如果你被给你一个带有类别的列表，你更有可能说是“雌动物”。此外，如果你被问母狮子是什么，你会立刻说“母性狮子”。\n\
  \n\n\n从上面的插图中可以看出，计算机并不具备这种能力。很遗憾，因为很多计算任务需要语义技能。在这方面，计算机需要帮助。\n\n\n\n\n\n通过上面的示例，你很可能推断出\
  \ `<h>` 标签用于标记列表中的产品名称。此外，你可能还能解释出 `<h2>` 之后的第一个段落是产品描述，而接下来的两个段落表示价格和运费。\n\n然而，如果你进一步观察，即使是粗粗一瞥也能发现明显的人为错误。仍然使用上面的文档，最后一个产品名称在\
  \ `<h3>` 标签中可见，但在 `<h2>` 标签中却没有。\n\n一个尝试解码该文档的计算机程序或软件，无法完成理解上述陈述所需的语义跳跃，最终将会失败。计算机将能够按照与标签关联的样式将文档渲染到浏览器中。HTML\
  \ 基本上是一组用于 Web 浏览器中渲染任何类型文档的指令，但它并不具备结构化和解码每个标签含义的能力。\n\n如果上面的文档是使用 `XML` 创建的，你可能会得到这些：\n\
  \n```xml\n<?xml version=\"1.0\"?>\n<productListing title=\"Shop Items\">\n  <product>\n\
  \    <name>Item A</name>\n    <description>Item A is an incredible brush that can\n\
  \      make your hair shiner.</description>\n    <cost>$88.40</cost>\n    <shipping>$7.00</shipping>\n\
  \  </product>\n  <product>\n    <name>Item B</name>\n    ...\n  </product>\n  <product>\n\
  \    <name>Item C</name>\n    <description>This is something so terrific that you\
  \ will want\n      it in your home or office! </p>\n    <cost>$89.50</cost>\n  \
  \  <shipping>$7.00</shipping>\n  </product>\n  ...\n</productListing>\n```\n\n新文档中真的没有任何新内容，而且显然，没有关于显示的信息。\n\
  \n此外，你是否曾经想过 `<product>` 标签在浏览器中会显示什么样？记住，当你使用 `XML` 时，你能够将信息与实际呈现分离。\n\n## 使用 XML\n\
  \n`XML` 可用于 Web 开发的各个方面。它通常用于存储和共享数据。\n\n`XML` 将数据与 `HTML` 分离。如果你必须 `HTML` 文档中显示动态数据，那么每次数据变化时你都必须编辑它。显然，这需要花费大量的时间和精力。\n\
  \n然而，通过 `XML`，你可以将数据存储在单独的文件中。这方便得多，因为你可以专注于使用 `CSS`/`HTML` 进行布局和显示。你还可以保证，对底层数据所做的更改不需要修改\
  \ `HTML`。此外，通过几行 `JavaScript` 代码，你还可以读取外部 `XML` 文件并更新你的 Web 页面内容。\n\n在虚拟世界中，计算机数据库和系统可能包含兼容格式的数据。但在现实世界中，情况并非如此。`XML`\
  \ 数据实际上是以纯文本格式存储的，以提供一种独立于硬件和软件的数据存储方式，并使其更容易于生成可供各种应用程序共享的数据。\n\n就像许多其他 Web 开发者一样，你可能在不兼容的系统之间交换数据时遇到困难。这样做会消耗你大量的时间和精力。幸运的是，通过\
  \ `XML`，你可以简化数据传输。如果你以 `XML` 交换数据，就可以避免过多的复杂性，因为即使对于不兼容且不同的应用程序，数据也是可读的。\n\n同样，`XML`\
  \ 简化了平台迁移。如你所知，升级到新系统（无论是软件还是硬件平台）都是耗时的。更重要的是，当必须转换大量数据时，不兼容的数据经常会丢失。正因如此，许多开发者感到沮丧。他们浪费了时间和精力，却没有得到他们期望的输出。\n\
  \n通过 `XML`，你可以将数据存储为文本格式，这样就可以快速升级或扩展到新的操作系统、浏览器或应用程序，而无需担心可能丢失数据。\n\n`XML` 还让数据更易可用。通过\
  \ `XML`，任何类型的读取设备都可以访问你的数据。语音设备、手持计算机和新闻推送都可以从 `XML` 和 `HTML` 页面中的数据源访问你的数据。即使是某些残障人士也可以轻松访问你的数据。例如，盲人访问你的内容将不会遇到困难。\n\
  \n许多网络语言实际上是用 `XML` 编写的。其中一些包括 `XML Schema`、`XHTML`、`SVG`、`RSS` 和 `WSDL`。\n\n***\n\
  \n## 第二章 基础语法\n\n本节将提供编写 `XML` 文档时的简单语法规则信息。\n\n以下是一个完整的学生服。\n\n![](img/00001.jpeg)\n\
  \n你将在这个示例中看到两类信息：\n\n*   标记 - `<contact-info>`\n*   文本（字符数据）– Manny Dunphy 和 (895)\
  \ 444-111\n\n此图将为你提供使用 `XML` 编写不同类型的标记和文本的语法规则。\n\n![](img/00002.jpeg) ![](img/00003.jpeg)\n\
  \n### XML 声明\n\n文档可以有也可以没有 XML 声明。可以这样写：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n```\n\n### 元素与标签\n\n`XML` 元素被称为 XML 的构建模块。它们表现为容器，持有以下任何内容：文本、元素、属性。它们可以由起始标签和结束标签或空元素来分隔。\n\
  \n### 语法\n\n```xml\n<element-name attribute1 attribute2>\n  content\n</element-name>\n\
  ```\n\n元素名称指的是元素的名称，起始和结束标签的大小应匹配。\n\n## 属性\n\n`attribute1`, `attribute2` 是由空格分隔的元素属性。属性指的是元素的属性。它与名称和值关联，如下：\n\
  \n```xml\nname = \"value\"\n```\n\n### 空元素\n\n没有内容的元素显示为：\n\n```xml\n<name attribute1\
  \ attribute2.../>\n```\n\n带有不同元素的 XML 文档如下：\n\n```xml\n<contact-info>\n  <address\
  \ category=\"business\">\n    <name>Manny Dunphy</name>\n    <company>Real Realtor</company>\n\
  \    <phone>(895) 444-111</phone>\n  <address/>\n</contact-info>\n```\n\n### 规则\n\
  \n*   名称应包含字母、数字以及这些标点符号：连字符 (`-`）、下划线 (`_`）和句号 (`.`)。\n*   它们大小敏感：`Address` 和 `address`\
  \ 不同。\n*   起始和结束标签应匹配。\n*   元素可以包含文本或元素。\n\n### XML 注释\n\n在 XML 中，编写注释的语法与 HTML\
  \ 相同。这是注释的语法：\n\n```xml\n<!--An example of a comment -->\n```\n\n### 参考\n\n![](img/00004.jpeg)\
  \ ![](img/00005.jpeg) ![](img/00006.jpeg) ![](img/00007.jpeg) ![](img/00008.jpeg)\
  \ ![](img/00009.jpeg) ![](img/00010.jpeg) ![](img/00011.jpeg)\n\n### 语法\n\n等等，![](img/00012.jpeg)\n\
  \n### XML 中的换行\n\nWindows 应用程序通常将换行存储为回车和换行符 (CR + LF)。旧的 Mac 系统将换行存储为回车，而 Mac OSX\
  \ 和 Unix 则存储为换行符。相反，XML 将其存储为换行符。\n\n### XML 中的空格\n\n与 HTML 不同，XML 文中的多个空格不会被截断。HTML\
  \ 实际上会将多个空格截断为单个空格。\n\n\n\n\n\n## 属性\n\n属性是元素的一部分。每个元素都可以包含多个且唯一的属性。属性通过名称和值或名称值对来指定元素的单个属性。XML\
  \ 元素可以有一个或多个属性：\n\n### 语法\n\n```xml\n<element-name attribute1 attribute2 >\n\n....content..\n\
  \n< /element-name>\n```\n\n其中 `attribute1` 和 `attribute2` 的出现形式如下：\n\n`name = “value”`\n\
  \n值可以包含在单引号（‘ ‘）或双引号（“ ”）中。属性用于为元素添加一个独特的标签、将该标签放入某个类别中、添加布尔标志，或与字符串数据相关联。\n\n###\
  \ 属性的使用\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\n<!DOCTYPE farm\
  \ [\n\n<!ELEMENT farm (vegetables)*>\n<!ELEMENT vegetables (#PCDATA)>\n<!ATTLIST\
  \ vegetables category CDATA #REQUIRED>\n]>\n\n<farm>\n<vegetables category=\"pumpkin\"\
  \ />\n<vegetables category=\"tomato\">\n</vegetables>\n</farm>\n```\n\n属性用于区分相同名的元素。属性可以添加微小的细节，以区分两个或多个同名的元素。\n\
  \n在这个示例中，通过包含属性 `category` 并对每个元素使用不同的值，对蔬菜进行了分类，从而为您提供了两个蔬菜类别：一个南瓜和一个西红柿。因此，有两个具有不同属性的蔬菜元素。\n\
  \n### 属性类型\n\n| 属性类型 | 描述 |\n| :--- | :--- |\n| 字符串类型 (String Type) | 值可以是任何字面字符串类型。`CDATA`（字符数据）是一种字符串类型。这意味着任何类型的标记字符字符串都可以被视为属性的一部分。\
  \ |\n| 标记类型 (Tokenized Type) | 特性上，这种类型更具限制。`ID` – 标识唯一元素。`IDREF` – 引用用于命名另一个元素的\
  \ ID。`IDREFS` – 引用元素的所有 ID。`ENTITY` – 这表示属性代表 XML 文档中的外部实体。`ENTITIES` – 属性代表 XML\
  \ 文档中的外部实体。`NMTOKEN` – 这与 `CDATA` 类似，但对被视为属性的数据有限制。`NMTOKENS` – 与 `CDATA` 类似，但对作为属性的数据有限制。\
  \ |\n| 枚举类型 (Enumerated Type) | 包含预定义值，必须分配其中一个值。`符号类型` (Notation Type) – 声明特定元素将引用\
  \ `NOTATION`，该符号将在文档的某处声明。`枚举` (Enumeration) – 允许用户定义必须匹配属性值的特定值列表。 |\n\n### 元素属性规则\n\
  \n- 属性名称在同一个标签中出现次数不能一次。\n- 属性值中没有对外部实体的直接或间接实体引用。\n- 文档类型定义 (`DTD`) 应该使用 `属性列表声明`\
  \ (Attribute-List-Declaration) 来反映属性。\n- 替换文本不能包含小于号（`<`）。\n\n### XML 属性值必须加引号\n\
  \n在 XML 中，元素可以像 HTML 一样拥有名称/值对属性。然而，XML 中的属性必须始终加引号。请考虑以下示例组：\n\n```xml\n< note\
  \ date = 12/25/2015 >\n    <to> Jane </to>\n    <from> John </from>\n</note>\n```\n\
  \n上述示例显示了使用 `date` 属性的错误方法。你必须记住，引号对于属性的生效是必须的。为了修正上述示例中的错误，你必须编辑代码并将其重写为类似这样的：\n\
  \n```xml\n< note date = “12/25/2015” >\n    <to> Jane </to>\n    <from> John </from>\n\
  </note>\n```\n\n### XML 引用\n\n引用通常允许你在 XML 文档中包含额外的标记或文本。这些引用始终以此符号开头：`&`，这是一个保留字符，其结束符号为\
  \ `;`。\n\n### 两种引用\n\n- **实体引用 (Entity References)** – 实体引用由定界符开始和结束之间的名称组成。例如，`&amp;`\
  \ 就是将使用的名称。该名称对应预定义的标记和测试字符串。\n- **字符引用 (Character References)** – 另一方面，这些似乎有很多故事要讲。例如\
  \ `&#65;`，它包含一个井号，后面跟着一个数字。该数字通常指向特定字符的 Unicode 编码。例如，65 代表字母。\n\n## XML 文本\n\n\
  用于 XML 属性和 XML 元素的名称是区分大小写的，这意味着开头和结尾应该使用相同的大小写。\n\n通过将每个 XML 文件保存为 Unicode `UTF\
  \ 8` 或 `UTF-16` 文件来防止字符编码问题。\n\n元素和属性之间的空白字符（如制表符、空格和换行）应该被忽略。\n\n某些字符被 XML 语法本身保留以便直接使用。这可能运行良好，但不会持久。为了使用它们，必须使用某些替换实体，选项列如下：\n\
  \n| 不允许的字符 | 替换实体 | 描述 |\n| :--- | :--- | :--- |\n| `<` | `&lt;` | 小于 |\n| `>` |\
  \ `&gt;` | 大于 |\n| `&` | `&amp;` | Ampersand |\n| `‘` | `&apos;` | 单引号 |\n| `“`\
  \ | `&quot;` | 双引号 |\n\n## 第 4 章 XML 文档\n\nXML 的基本单元 XML 文档由元素组成并有一个根元素。XML 示例：\n\
  \n### 示例\n\n一个简单的 XML 文档如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<contact-info>\n<name>Elaine Cooper</name>\n<company>Science Joint</company>\n\
  <phone>(555) 115-8452</phone>\n</contact-info>\n```\n\n## XML 文档部分\n\n**文档引言 (Document\
  \ Prolog)** – 位于文档顶部。它包含 XML 声明和文档类型声明。（你将在下一章讨论 XML 声明时了解更多。）\n\n**文档元素部分 (Document\
  \ Elements Section)** – 文档元素是 XML 的主要区块。这些元素将文档分为若干部分，每个部分都有其用途。这样做允许其他搜索引擎对其进行处理。这些元素可以是容器，包含元素和文本的组合。\n\
  \n## 文档类型\n\n语法正确的文档被称为良好良好（well formed）。有效文档必须符合文档类型定义。定义 XML 文档中合法属性和元素的规则被称为\
  \ XML Schema 或文档类型定义 (`DTD`)。`DTD` 是原始的文档类型定义，而 XML Schema 是其基于 XML 的替代方案。\n\n\n\
  \n\n\n```xml\n<! ELEMENT memo (to, from, heading, body)>\n<! ELEMENT to (#PCDATA)>\n\
  <! ELEMENT from (#PCDATA)>\n<! ELEMENT heading (#PCDATA)>\n<! ELEMENT body (#PCDATA)>\n\
  ]>\n```\n\n在上述示例中，`#PCDATA` 指可解析的文本数据。解析字符数据（`PCDATA`）实际上是源自标准通用标记语言（`SGML`）的数据定义。它也被用于可扩展标记语言文档类型定义（DTD），用于指定\
  \ `XML` 中的混合内容元素。\n\n仍然参考上述示例，`DTD` 的解释如下：\n\n- `!DOCTYPE memo` 声明 `XML` 文档的根元素为\
  \ `memo`。\n- `!ELEMENT memo` 声明 `memo` 必须包含四个元素，即 `to`、`from`、`heading` 和 `body`。\n\
  - `!ELEMENT to` 声明 `to` 元素属于 `#PCDATA` 类型。\n- `!ELEMENT from` 声明 `from` 元素属于 `#PCDATA`\
  \ 类型。\n- `!ELEMENT heading` 声明 `heading` 元素属于 `#PCDATA` 类型。\n- `!ELEMENT body` 声明\
  \ `body` 元素属于 `#PCDATA` 类型。\n\n你也可以使用 doctype 声明来定义字符串和特殊字符。记住，实体必须包含一个和符号（`&`）、分号（`;`）和一个实体名称。\n\
  \n再次强调，`XML` 并不需要 `DTD` 或 `Schema`。因此，如果你在处理小文件或实验 `XML` 时创建 `DTD`，你可能是在浪费时间。\n\n\
  如果你正在开发应用程序，必须在获得稳定的规范之前，再向文档中添加定义。否则，你可能会收到验证错误，这可能导致你的软件停止工作。\n\n## 第 5 章 XML\
  \ 声明\n\n`XML` 声明由 `XML` 处理器按顺序排列的细节组成，用于分解和分析 `XML` 文档。然而，在使用时它是可选的；但它必须出现在 `XML`\
  \ 文档的第一行。\n\n### 语法\n\n```xml\n<?xml\nversion=\"version_number\"\nencoding=\"encoding_declaration\"\
  \nstandalone=\"standalone_status\"\n?>\n```\n\n以上是显示 `XML` 声明的语法。\n\n每个参数都有自己的名称、等号（`=`）和引号内的值。上面的表格显示了详细的\
  \ `XML` 语法参数：\n\n| 参数 | 参数值 | 参数描述 |\n| :--- | :--- | :--- |\n| Version | 1.o |\
  \ 预期使用的 `XML` 标准版本。 |\n| Encoding | UTF-8, UTF 16, ISO-8859-1 to ISO-8859-9, ISO\
  \ 10646-USC-2, ISO 10646-USC-4, ISO-2022-JP, EUC-JP, JIS | 定义内容中使用的字符编码。使用的默认编码是\
  \ UTF-8。 |\n| Standalone | yes or no | 如果文档依赖于外部源（如外部文档类型定义或 `DTD`）的信息作为内容，它会通知解析器。`No`\
  \ 是默认值。当你将其设置为 `yes` 时，表示解析 `XML` 文档不需要任何声明。 |\n\n### 需要记住的规则\n\n- 如果 `XML` 中有 `XML`\
  \ 声明，它必须置于 `XML` 文档的第一行。\n- `XML` 声明应该包含版本号属性。\n- 参数值和名称对大小写敏感。\n- 名称应该始终使用小写字母。\n\
  - 参数名称应该遵循正确的顺序：`version`、`encoding`、`standalone`。\n- 你可以使用单引号或双引号。\n- `XML` 声明不包含闭合标签，如\
  \ `</?xml>`。\n- `XML` 声明应始终使用小写，编码声明除外。\n- 如果 `XML` 文档中有在外部 `DTD` 中定义或引用的元素、实体或属性，则应设置\
  \ `standalone = “no”`。\n\n### XML 声明示例\n\n定义了所有参数后：\n\n```xml\n<?xml> version=’1.0’\
  \ encoding=’iso-8859-1’ standalone=’no’\n```\n\n## 第 6 章 XML 注释和字符实体\n\n`XML` 注释类似于\
  \ `HTML` 注释。它们被添加作为注释以帮助理解特定 `XML` 代码的作用。它们可以包含相关信息、术语和链接。然而，它们只能在源代码中看到，而不能在 `XML`\
  \ 代码中。\n\n### 语法\n\n```xml\n<!-------您的注释----->\n```\n\n`XML` 注释始终以 `<!—` 开头并以 `-->`\
  \ 结束。可以在字符之间添加作为注释。不建议将一个注释嵌套另一个注释中。\n\n### 示例\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\" ?>\n\n<!---成绩按年级上传---->\n<class_list>\n<student>\n<name>Lilly</name>\n\
  <grade>B+</grade>\n</student>\n</class_list>\n```\n\n### XML 字符实体\n\n`XML` 实体是实体树的根节点，也是\
