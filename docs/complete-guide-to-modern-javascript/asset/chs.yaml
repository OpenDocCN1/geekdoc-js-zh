  \ =>  { console.log('2') })\n.catch(() =>  { console.log('3') })\n.then(() =>  {\
  \ console.log('4') });\n```\n\n- ![bullet](img/bullet_nb_square-blk.png) 1,2,3,4\n\
  - ![bullet](img/bullet_nb_square-blk.png) 3,4,1,2\n- ![bullet](img/bullet_nb_square-blk.png)\
  \ 3,4\n- ![bullet](img/bullet_nb_square-blk.png) 4\n\n# 第 14 章：生成器\n\n## 什么是生成器？\n\
  \n生成器函数是一个我们可以启动和停止的函数，可以无限期地暂停。并且，可以在稍后的时间点重新启动并传递额外的数据。\n\n要创建一个生成器函数，我们这样写：\n\
  \n```javascript\nfunction*  fruitList(){ yield  'Banana'; yield  'Apple'; yield\
  \  'Orange'; }\nconst fruits =  fruitList();\nfruits; // Generator\nfruits.next();\
  \ // Object { value: \"Banana\", done: false }\nfruits.next(); // Object { value:\
  \ \"Apple\", done: false }\nfruits.next(); // Object { value: \"Orange\", done:\
  \ false }\nfruits.next(); // Object { value: undefined, done: true }\n```\n\n让我们逐段看一下代码：\n\
  \n1.  我们使用`function*`声明了函数\n2.  我们在内容前使用了关键字`yield`\n3.  我们使用`.next()`启动函数\n4. \
  \ 最后一次调用`.next()`时，我们收到一个空对象，并得到`done: true`\n\n我们的函数在每次`.next()`调用之间暂停。\n\n## 使用生成器遍历数组\n\
  \n我们可以使用`for of`循环来迭代我们的生成器，并在每次循环中产出内容。\n\n```javascript\n// create an array of\
  \ fruits\nconst fruitList = ['Banana','Apple','Orange','Melon','Cherry','Mango'];\n\
  // create our looping generator\nfunction*  loop(arr) {\n  for (const item of arr)\
  \ {\n    yield  `I like to eat ${item}s`;\n  }\n}\nconst fruitGenerator =  loop(fruitList);\n\
  fruitGenerator.next(); // Object { value: \"I like to eat Bananas\", done: false\
  \ }\nfruitGenerator.next(); // Object { value: \"I like to eat Apples\", done: false\
  \ }\nfruitGenerator.next().value; // \"I like to eat Oranges\"\n```\n\n1.  我们的新生成器将遍历数组，每次调用`.next()`时打印一个值\n\
  2.  如果你只关心获取值，那么使用`.next().value`，它不会打印生成器的状态\n\n## 使用`.return()`结束生成器\n\n使用`.return()`我们可以返回一个给定的值并结束生成器。\n\
  \n```javascript\nfunction*  fruitList(){ yield  'Banana'; yield  'Apple'; yield\
  \  'Orange'; }\nconst fruits =  fruitList();\nfruits.return(); // Object { value:\
  \ undefined, done: true }\n```\n\n在这种情况下，我们得到了`value: undefined`，因为我们没有在`return()`中传递任何内容。\n\
  \n## 使用`.throw()`捕获错误\n\n```javascript\nfunction*  gen(){\n  try  {\n    yield \
  \ \"Trying...\";\n    yield  \"Trying harder...\";\n    yield  \"Trying even harder..\"\
  ;\n  } catch(err) {\n    console.log(\"Error: \"  + err );\n  }\n}\nconst myGenerator\
  \ =  gen();\nmyGenerator.next(); // Object { value: \"Trying...\", done: false }\n\
  myGenerator.next(); // Object { value: \"Trying harder...\", done: false }\nmyGenerator.throw(\"\
  ooops\"); // Error: ooops\n// Object { value: undefined, done: true }\n```\n\n正如你所看到的，当我们调用`.throw()`时，生成器返回了错误并结束，尽管我们还有一个\
  \ yield 要执行。\n\n## 将生成器与 Promise 结合\n\n正如我们之前所见，Promise 对于异步编程非常有用，通过将它们与生成器结合，我们拥有一个非常强大的工具来避免像回调地狱这样的问题。\n\
  \n由于我们只讨论 ES6，我不会谈论 async 函数，因为它们是在 ES2017 中引入的，但要知道它们的工作方式是基于你现在将要看到的内容。\n\n你可以在第\
  \ 19 章中阅读更多关于 async 函数的内容。\n\n将生成器与 Promise 结合使用，将使我们能够编写感觉像同步代码的异步代码。\n\n我们想要做的是等待一个\
  \ promise 解决，然后将解决的值通过`.next()`调用传回我们的生成器。\n\n```javascript\nconst myPromise = ()\
  \ =>  new  Promise((resolve) =>  { resolve(\"our value is...\"); });\nfunction*\
  \  gen() {\n  let result =  \"\";\n  // returns promise\n  yield  myPromise().then(data\
  \ =>  { result = data }) ;\n  // wait for the promise and use its value\n  yield\
  \ result +  ' 2';\n};\n// Call the async function and pass params\nconst asyncFunc\
  \ =  gen();\nconst val1 =  asyncFunc.next();\nconsole.log(val1);\n// call the promise\
  \ and wait for it to resolve\n// {value: Promise, done: false}\nval1.value.then(()\
  \ =>  { console.log(asyncFunc.next()); })\n// Object { value: \"our value is...\
  \ 2\", done: false }\n```\n\n第一次调用`.next()`时，它会调用我们的 promise 并等待它解决（在我们的简单示例中，它立即解决），当我们再次调用`.next()`时，它将利用\
  \ promise 返回的值来做其他事情（在这种情况下只是插值一个字符串）。\n\n## 第 14 章测验结束\n\n### 14.1 生成器函数的正确语法是什么？\n\
  \n\n\n\n\n![bullet](img/bullet_nb_square-blk.png)`generator function() {...}`\n\n\
  ![bullet](img/bullet_nb_square-blk.png)`new generator(){...}`\n\n![bullet](img/bullet_nb_square-blk.png)`function*(){...}`\n\
  \n### 14.2 生成器的主要特性是什么？\n\n![bullet](img/bullet_nb_square-blk.png)它无法被停止\n\n![bullet](img/bullet_nb_square-blk.png)它可以生成其他函数\n\
  \n![bullet](img/bullet_nb_square-blk.png)它无法被覆盖\n\n![bullet](img/bullet_nb_square-blk.png)它可以被停止并重新启动\n\
  \n### 14.3 以下代码的正确输出是什么？\n\n```\nfunction*  fruitList(){ yield  'Banana'; yield\
  \  'Apple'; yield  'Pomelo'; yield  'Mangosteen'; yield  'Orange'; } const fruits\
  \ =  fruitList(); fruits; fruits.next(); fruits.next(); fruits.next();\n```\n\n\
  `fruits.next();` 的最后一次输出是什么？\n\n![bullet](img/bullet_nb_square-blk.png)`Object {\
  \ value: \"Banana\", done: false }`\n\n![bullet](img/bullet_nb_square-blk.png)`Object\
  \ { value: \"Pomelo\", done: true }`\n\n![bullet](img/bullet_nb_square-blk.png)`Object\
  \ { value: \"Mangosteen\", done: false }`\n\n![bullet](img/bullet_nb_square-blk.png)`Object\
  \ { value: \"Pomelo\", done: false }`\n\n### 14.4 以下代码的正确输出是什么？\n\n```\nfunction*\
  \  fruitList(){ yield  'Banana'; yield  'Apple'; yield  'Orange'; } const fruits\
  \ =  fruitList(); fruits.return();\n```\n\n![bullet](img/bullet_nb_square-blk.png)`Object\
  \ { value: \"Banana\", done: true }`\n\n![bullet](img/bullet_nb_square-blk.png)`Object\
  \ { value: undefined, done: false }`\n\n![bullet](img/bullet_nb_square-blk.png)`Object\
  \ { value: \"Banana\", done: false }`\n\n![bullet](img/bullet_nb_square-blk.png)`Object\
  \ { value: undefined, done: true }`\n\n# 第 15 章：代理\n\n## 什么是 `Proxy`？\n\n来自 MDN：\n\
  \n`Proxy` 对象用于定义基本操作的自定义行为（例如属性查找、赋值、枚举、函数调用等）。\n\n## 如何使用 `Proxy`？\n\n创建 `Proxy`\
  \ 的方式如下：`var x = new Proxy(target, handler)`\n\n1.  我们的 `target` 可以是任何东西，从对象到函数，再到另一个\
  \ `Proxy`。\n\n1.  `handler` 是一个对象，它将定义当对 `Proxy` 执行操作时的行为。\n\n```\n// our object\
  \ const dog =  {  breed:  \"German Shephard\",  age:  5} // our Proxy const dogProxy\
  \ =  new  Proxy(dog,  { get(target,breed){ return target[breed].toUpperCase(); },\
  \ set(target, breed, value){ console.log(\"changing breed to...\"); target[breed]\
  \ = value; } }); console.log(dogProxy.breed); // \"GERMAN SHEPHARD\" console.log(dogProxy.breed\
  \  =  \"Labrador\") // changing breed to... // \"Labrador\" console.log(dogProxy.breed);\
  \ // \"LABRADOR\"\n```\n\n当我们调用 `get` 方法时，我们进入正常流程并将 `breed` 的值改为大写。\n\n当设置新值时，我们再次进入并在设置值之前记录一条简短消息。\n\
  \n`Proxies` 非常有用。例如，我们可以用它们来验证数据。\n\n```\nconst validateAge =  { set:  function(object,property,value){\
  \ if(property ===  'age'){ if(value <  18){ throw  new  Error('you are too young!');\
  \ }  else  { // default behaviour object[property] = value; return  true } } } }\
  \ const user =  new  Proxy({},validateAge) user.age  =  17 // Uncaught Error: you\
  \ are too young! user.age  =  21 // 21\n```\n\n当我们设置 `user` 对象的 `age` 属性时，我们将其传递给\
  \ `validateAge` 函数，该函数检查它是否大于或小于 18，如果小于 18 则抛出错误。\n\n如果我们有许多属性，每个属性都需要一个 getter\
  \ 和 setter，那么 `Proxies` 会非常有用。通过使用 `Proxy`，我们只需要定义一个 getter 和一个 setter。让我们看这个例子：\n\
  \n```\nconst dog =  { _name:  'pup', _age:  7, get name() { console.log(this._name)\
  \ }, get age(){ console.log(this._age) }, set name(newName){ this._name  = newName;\
  \ console.log(this._name) }, set age(newAge){ this._age  = newAge; console.log(this._age)\
  \ } } dog.name; // pup dog.age; // 7 dog.breed; // undefined dog.name  =  'Max';\
  \ // Max dog.age  =  8; // 8\n```\n\n注意我写的是 `_name` 而不是 `name` 等，`_` 符号在 JavaScript\
  \ 约定中用于定义私有属性，即不应被同一类的实例访问的属性。\n\n这不是 JavaScript 强制要求的，只是为了让开发者快速识别私有属性。我在这里使用它的原因是，如果我调用：\n\
  \n`set name(newName){ this.name = newName; }`\n\n这会导致无限循环，因为 `this.name =` 会反复调用\
  \ setter。通过在它前面加下划线，我实现了与将 setter 重命名为其他名称相同的结果，例如：\n\n`set rename(newName){ this.name\
  \ = newName; }`\n\n如你所见，我们有两个属性：`name` 和 `age`，并且每个属性我们都必须创建一个 getter 和一个 setter。\n\
  \n当我们尝试访问对象上不存在的属性（如 `breed`）时，会得到 `undefined`。\n\n使用 `Proxy`，我们可以通过编写以下代码来简化代码：\n\
  \n```\nconst dog =  { name:  'pup', age:  7 } const handler =  { get: (target, property)\
  \ =>  { property in target ?  console.log(target[property]) : console.log('property\
  \ not found'); }, set: (target, property, value) =>  { target[property] = value;\
  \ console.log(target[property]) } } const dogProxy =  new  Proxy(dog, handler);\
  \ dogProxy.name; // pup dogProxy.age; // 7 dogProxy.name  =  'Max'; // Max dogProxy.age\
  \  =  8; // 8 dogProxy.breed; // property not found\n```\n\n首先，我们创建了 `dog` 对象，但这次我们没有在其中设置任何\
  \ getter 和 setter。\n\n我们创建了 `handler`，它将仅用一个 getter 和一个 setter 处理每个可能的属性。\n\n在 getter\
  \ 中，我们检查属性是否存在于 `target` 对象中。如果存在，则记录它，否则记录自定义消息。\n\nsetter 接受三个参数：`target` 对象、`property`\
  \ 名称和 `value`，这里没有特殊操作，我们将属性设置为新值并记录它。\n\n如你所见，通过使用 `Proxy`，我们实现了两件事：\n\n1.  更短、更清晰的代码\n\
  \n1.  如果我们尝试访问不存在的属性，我们会记录一条自定义消息。\n\n## 第 15 章测验结束\n\n### 15.1 `Proxy` 的用途是什么？\n\
  \n![bullet](img/bullet_nb_square-blk.png)存储唯一值\n\n![bullet](img/bullet_nb_square-blk.png)定义基本操作的自定义行为\n\
  \n![bullet](img/bullet_nb_square-blk.png)使值无法被其他函数访问\n\n### 15.2 `Proxy` 可以接受多少个参数？\n\
