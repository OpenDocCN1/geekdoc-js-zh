  \n# 第 21 章：ES2019 的新特性？\n\n在本章中，我们将了解最新版本的 ECMAScript：ES2019 中包含的内容。\n\n## `Array.prototype.flat()`\
  \ / `Array.prototype.flatMap()`\n\n`Array.prototype.flat()` 会递归地将数组扁平化到我们指定的深度。如果没有指定深度参数，默认值为\
  \ 1。我们可以使用 `Infinity` 来扁平化所有嵌套数组。\n\n```\nconst letters = ['a',  'b', ['c',  'd',\
  \ ['e',  'f']]];\n// 默认深度为 1\nletters.flat(); // ['a', 'b', 'c', 'd', ['e', 'f']]\n\
  // 深度为 2\nletters.flat(2); // ['a', 'b', 'c', 'd', 'e', 'f']\n// 这相当于执行两次深度为 1 的\
  \ flat\nletters.flat().flat(); // ['a', 'b', 'c', 'd', 'e', 'f']\n// 递归扁平化直到数组不包含嵌套数组\n\
  letters.flat(Infinity) // ['a', 'b', 'c', 'd', 'e', 'f']\n```\n\n`Array.prototype.flatMap()`\
  \ 在处理 'depth' 参数方面与前一个相同，但 `flatMap()` 不仅可以扁平化数组，还可以映射数组并将结果返回到新数组中。\n\n```\nlet\
  \ greeting = [\"Greetings from\",  \" \",  \"Vietnam\"];\n// 首先尝试使用普通的 `map()` 函数\n\
  greeting.map(x =>  x.split(\" \"));\n// [\"Greetings\", \"from\"]\n// [\"\", \"\"\
  ]\n// [\"Vietnam\"]\ngreeting.flatMap(x =>  x.split(\" \"))\n// [\"Greetings\",\
  \ \"from\", \"\", \"\", \"Vietnam\"]\n```\n\n如你所见，如果使用 `.map()`，我们会得到一个多层数组，而使用\
  \ `.flatMap()` 可以解决这个问题，因为它也会扁平化数组。\n\n## `Object.fromEntries()`\n\n`Object.fromEntries()`\
  \ 将键值对列表转换为对象。\n\n```\nconst keyValueArray = [ ['key1',  'value1'], ['key2',  'value2']\
  \ ]\nconst obj =  Object.fromEntries(keyValueArray)\n// {key1: \"value1\", key2:\
  \ \"value2\"}\n```\n\n我们可以将任何可迭代对象作为 `Object.fromEntries()` 的参数传递，无论是数组、Map 还是其他实现了可迭代协议的对象。\n\
  \n你可以在此处阅读更多关于可迭代协议的内容：[`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iterationprotocols#Theiterable_protocol`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols%23The_iterable_protocol)\n\
  \n## `String.prototype.trimStart()` / `.trimEnd()`\n\n`String.prototype.trimStart()`\
  \ 移除字符串开头的空白字符，而 `String.prototype.trimEnd()` 移除字符串末尾的空白字符。\n\n```\nlet str =  \"\
  \   this string has a lot of whitespace   \";\nstr.length; // 42\nstr =  str.trimStart();\
  \ // \"this string has a lot of whitespace   \"\nstr.length; // 38\nstr =  str.trimEnd();\
  \ // \"this string has a lot of whitespace\"\nstr.length; // 35\n```\n\n我们也可以使用\
  \ `.trimLeft()` 作为 `.trimStart()` 的别名，使用 `.trimRight()` 作为 `.trimEnd()` 的别名。\n\n\
  ## 可选的 catch 绑定\n\n在 ES2019 之前，你必须在 `catch` 子句中始终包含一个异常变量。ES2019 允许你省略它。\n\n\n\n\
  \n\n// 在 `try { ... } catch(error) { ... }` 之前 // ES2019 `try { ... } catch { ...\
  \ }`\n\n当你想要忽略错误时，这很有用。关于此特性的更多使用场景，我强烈推荐这篇文章：[`2ality.com/2017/08/optional-catch-binding.html`](http://2ality.com/2017/08/optional-catch-binding.html)\n\
  \n## Function.prototype.toString()\n\n`.toString()` 方法返回一个表示函数源代码的字符串。\n\n```\n\
  function sum(a, b) { return a + b; } console.log(sum.toString()); // function sum(a,\
  \ b) { // return a + b; // }\n```\n\n它也会包含注释。\n\n```\nfunction sum(a, b) { // 执行求和\
  \ return a + b; } console.log(sum.toString()); // function sum(a, b) { // // 执行求和\
  \ // return a + b; // }\n```\n\n## Symbol.prototype.description\n\n`.description`\
  \ 返回 Symbol 对象的可选描述。\n\n```\nconst me = Symbol(\"Alberto\"); me.description; //\
  \ \"Alberto\" me.toString() // \"Symbol(Alberto)\"\n```\n\n## 第 21 章小测验\n\n### 21.1\
  \ 使用 ES2019 引入的新数组方法，将以下多维数组转换为单维数组，要求一行代码完成\n\n```\nconst letters = ['a', 'b',\
  \ ['c', 'd', ['e', 'f']]]; // 预期结果：['a', 'b', 'c', 'd', 'e', 'f']\n```\n\n### 21.2\
  \ 从给定的数组出发，使用 ES2019 的新特性创建一个对象\n\n```\nconst keyValueArray = [ ['key1', 'value1'],\
  \ ['key2', 'value2'] ] // 预期结果：{key1: \"value1\", key2: \"value2\"}\n```\n\n###\
  \ 21.3 以下代码的正确输出是什么？\n\n```\nconst me = Symbol(\"Alberto\"); console.log(me.description);\n\
  ```\n\n![bullet](img/bullet_nb_square-blk.png)`Symbol`\n\n![bullet](img/bullet_nb_square-blk.png)`Symbol(Alberto)`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`\"Alberto\"`\n\n![bullet](img/bullet_nb_square-blk.png)`undefined`\n\
  \n### 21.4 以下代码的正确输出是什么？\n\n```\nconst letters = ['a', 'b', ['c', 'd', ['e', 'f']]];\
  \ console.log(letters.flat())\n```\n\n![bullet](img/bullet_nb_square-blk.png)`['a',\
  \ 'b', ['c', 'd', ['e', 'f']]]`\n\n![bullet](img/bullet_nb_square-blk.png)`['a',\
  \ 'b', 'c', 'd', 'e', 'f']`\n\n![bullet](img/bullet_nb_square-blk.png)`['a', 'b',\
  \ 'c', 'd', ['e', 'f']]`\n\n![bullet](img/bullet_nb_square-blk.png)`['a', 'b', ['c',\
  \ 'd', 'e', 'f']]`\n\n### 21.5 以下代码的正确输出是什么？\n\n```\nfunction sum(a, b) { return\
  \ a + b } console.log(sum.toString());\n```\n\n![bullet](img/bullet_nb_square-blk.png)`Function`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`\"a + b\"`\n\n![bullet](img/bullet_nb_square-blk.png)`sum`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`function sum(a, b) { return a + b; }`\n\
  \n# TypeScript 简介\n\n现在你已经清楚了 2019 年 JavaScript 的面貌，我认为是时候向你介绍 TypeScript 了。\n\n\
  虽然对于 JavaScript 开发者来说这不是一项必备技能，但我认为它非常有用，尤其是在团队协作处理大型项目时。\n\n如你所知，JavaScript 不是强类型语言，这意味着你不需要在声明变量时定义其类型。\n\
  \n这意味着变量可以更灵活，接受不同的值，但同时也会使代码更混乱，更容易出现 bug。\n\n看这个例子：\n\n```\nfunction getUserByID(userID){\
  \ // 执行 API 调用到服务器，通过 id 获取用户 }\n```\n\n`userID` 是什么？是整数还是字符串？我们可以假设它是整数，但也许它是一个字母数字字符串（例如：`'A123'`）。\n\
  \n除非我们编写了这段代码，否则我们无法知道参数的类型。\n\n这时 TypeScript 就派上用场了。同样的代码在 TypeScript 中是这样的：\n\n\
  ```\nfunction getUserByID(userID:number){ // 执行 API 调用到服务器，通过 id 获取用户 }\n```\n\n\
  完美！现在我们确定，如果向函数传递字符串，将会导致错误。\n\n一个简单的添加就让代码更易于使用。\n\n## 什么是 TypeScript？\n\nTypeScript\
  \ 由微软在几年前创建，是 JavaScript 的一个类型化超集，编译后生成纯 JavaScript。\n\n作为超集，意味着你可以在 TypeScript\
  \ 文件中编写纯 JavaScript，而不会引发错误。\n\n浏览器不理解 TypeScript，因此它必须被转译成纯 JavaScript。\n\n接下来我们将看看如何设置环境来编写\
  \ TypeScript。\n\n## 如何使用 TypeScript\n\n开始使用 TypeScript 实际上只需要 5 分钟。\n\n首先要做的是安装它。在终端中运行以下命令：\n\
  \n```\nnpm install -g TypeScript\n```\n\n然后打开你的代码编辑器，创建一个名为 `greeter.ts` 的文件（注意不是\
  \ `.js`）。\n\n```\nconst greeter = (name:string) => { console.log(`hello ${name}`)\
  \ } greeter('Alberto'); // hello Alberto\n```\n\n现在，要生成 JavaScript 文件，我们需要在与文件相同的目录下，在终端中运行以下命令：\n\
  \n```\ntsc greeter.ts\n```\n\n现在你应该有一个 `greeter.js` 文件，其中包含以下代码：\n\n```\nvar greeter\
  \ = function (name) { console.log(\"hello \" + name); }; greeter('Alberto'); //\
  \ hello Alberto\n```\n\n`name:string` 去哪了？我们知道 JavaScript 不是强类型语言，因此类型声明在代码转译时会被移除。\n\
  \n为代码添加类型将帮助你调试并减少错误，但它不会产生与不使用类型时不同的 JavaScript 输出。\n\n## TypeScript 基本类型\n\n在本节中，我们将介绍\
  \ TypeScript 支持的基本类型。你应该已经从 JavaScript 入门部分了解了其中大部分类型的含义。\n\nTypeScript 支持的基本类型有：\n\
  \n1. `boolean`\n1. `number`\n1. `string`\n1. `Array`\n1. `object`\n1. `Tuple`\n\
  1. `enum`\n1. `any`\n1. `void`\n1. `null` 和 `undefined`\n1. `never`\n\n### boolean\n\
  \n定义一个可以是 `true` 或 `false` 的值：\n\n```\nconst active: boolean = true;\n```\n\n###\
  \ number\n\n`number` 类型支持十六进制、十进制、二进制和八进制字面量：\n\n```\nconst decimal: number = 9;\
  \ const hex: number = 0xf00d; const binary: number = 0b1010; const octal: number\
  \ = 0o744;\n```\n\n### string\n\n`string` 类型用于存储文本数据：\n\n```\nconst message: string\
  \ = 'Welcome';\n```\n\n### Array\n\n有两种定义数组类型的方式：\n\n```\n// 第一种方式 -> type[] const\
  \ firstArray: number[] = [1,2,3]; // 第二种方式 -> Array<type> const secondArray: Array<number>\
  \ = [4,5,6];\n```\n\n在像这样简单的情况下，两者没有区别，但如果处理比数字类型更复杂的内容，则无法使用第一种表示法。\n\n看这个例子：\n\
  \n```\n// 我们的函数接受一个对象数组，每个对象具有 label 和 value 属性 function example(arg: Array<{label:string,value:string}>\
  \ ){ // 执行某些操作 }\n```\n\n`Array<{label:string,value:string}>` 简单来说就是参数是一个对象数组，这些对象具有\
  \ `label` 和 `value` 属性，两者都是 `string` 类型。\n\n### object\n\n`object` 表示一个不是原始类型的值；\n\
  \n假设我们的函数接受一个 `object` 类型的参数：\n\n```\nfunction greetUser(user: object){ // 属性 name\
  \ 在类型 object 上不存在 console.log(`hello ${user.name}`) } greetUser({name: 'Alberto',\
  \ age:27}); // hello Alberto\n```\n\nTypeScript 编译器会报错，说属性 `name` 在类型 `object` 上不存在。\n\
  \n让我们更好地定义该对象的属性。\n\n```\nfunction greetUser(user: {name:string,age:number}){ console.log(`hello\
  \ ${user.name}`) } greetUser({name: 'Alberto', age:27}); // hello Alberto\n```\n\
  \n现在我们指定了用户对象的所有属性，这让我们和任何查看代码的人都能更容易地知道他们能对该对象做什么，不能做什么。\n\n### Tuple\n\n元组允许你定义数组中已知元素的类型。\n\
  \n```\nlet myTuple: [string,number,string]; myTuple = ['hi',5,'hello']; console.log(myTuple);\
  \ // [ 'hi', 5, 'hello' ]\n```\n\nTypeScript 会知道我们在元组中定义的已知索引处的元素类型，但无法知道添加到数组中的额外元素的类型。\n\
  \n### enum\n\n\n\n\n枚举是一种为一组数值赋予名称的方式：\n\n```\nenum Status {deleted, pending, active}\n\
  const blogPostStatus: Status = Status.active;\nconsole.log(blogPostStatus); // 2\n\
  ```\n\n枚举内部的值从 0 开始，因此在我们的示例中，`active` 对应 2，`pending` 对应 1，`deleted` 对应 0。\n\n说博客文章的状态是\
  \ `active` 比说它是 2 要有意义得多。\n\n如果你愿意，可以通过如下方式指定枚举的起始值来覆盖默认值：\n\n```\nenum Status {deleted\
  \ = -1, pending, active}\nconst blogPostStatus: Status = Status.active;\nconsole.log(blogPostStatus);\
  \ // 1\n```\n\n现在 `deleted` 对应 -1，`pending` 对应 0，`active` 对应 1，比以前好多了。\n\n我们还可以根据枚举的值来访问枚举中的成员：\n\
  \n```\nenum Status {deleted = -1, pending, active}\nconsole.log(Status[0]); // pending\n\
  ```\n\n### any\n\n顾名思义，`any` 表示某个变量的值可以是任何类型。\n\n当我们处理不支持 TypeScript 的第三方库，或者将现有代码从纯\
  \ JavaScript 升级时，可能会用到它。\n\n`any` 允许我们访问可能不存在的属性和方法。\n\n当我们只了解类型的一部分时，也可以使用 `any`：\n\
  \n```\nlet firstUser: Object<any> = { name: 'Alberto', age: 27 }\nlet secondUser:\
  \ Object<any> = { name: 'Caroline' }\n```\n\n我们期望这两个变量都是对象类型，但不确定它们的属性，因此我们使用 `any`。\n\
  \n### void\n\n顾名思义，`void` 定义了类型的缺失。\n\n它常用于如下场景：\n\n```\nfunction storeValueInDatabase(objectToStore):\
  \ void {\n  // 将你的值存储到数据库中\n}\n```\n\n这个函数接收一个对象并将其存储到数据库中，但不返回任何内容，因此我们将其返回值设为\
  \ `void`。\n\n当声明 `void` 类型的变量时，你只能将 `null` 和 `undefined` 赋值给它。\n\n### null 和 undefined\n\
  \n与 `void` 类似，创建 `null` 或 `undefined` 类型的变量并不是很有用，因为我们只能将 `null` 和 `undefined` 作为值赋给它们。\n\
  \n在讨论联合类型时，你会看到这两种类型的用途。\n\n### never\n\n`never` 表示永远不会出现的值，例如，我们可以将其用于从不返回或总是抛出错误的函数。\n\
  \n```\nfunction throwError(error: string): never {\n  throw new Error(error)\n}\n\
  ```\n\n这个函数只抛出错误，永远不会返回任何值。\n\n## 接口、类等更多内容\n\n### 接口\n\n在前面某个示例中，我这样设置了变量的类型：`Array<{label:\
  \ string, value: string}>`\n\n但如果变量的形状更复杂，并且需要在多个地方重复使用呢？\n\n我们可以使用接口来定义该变量应有的形状。\n\
  \n```\ninterface Car {\n  wheels: number;\n  color: string;\n  brand: string;\n\
  }\n```\n\n注意，接口不是对象，我们使用 `;` 而不是 `,`。\n\n我们还可以像这样设置可选属性：\n\n```\ninterface Car {\n\
  \  wheels: number;\n  color: string;\n  brand: string;\n  coupe?: boolean;\n}\n\
  ```\n\n`?` 将属性定义为可选的，即使我们在创建新汽车对象时没有包含它，TypeScript 也不会报错。\n\n也许我们不希望某些属性在对象创建后可以被修改，在这种情况下，我们可以将它们标记为\
  \ `readonly`。\n\n```\ninterface Car {\n  readonly wheels: number;\n  color: string;\n\
  \  brand: string;\n  coupe?: boolean;\n}\n```\n\n在创建汽车对象时，我们可以设置轮子数量，但之后就无法更改了。\n\
  \n使用接口，我们还可以为函数创建形状，而不仅仅是对象。\n\n```\ninterface Greet {\n  (greeting: string, name:\
  \ string): string\n}\nlet greetingFunction: Greet;\ngreetingFunction = (greeting:\
  \ string, name: string): string => {\n  console.log(`${greeting} ${name}`);\n  return\
  \ `${greeting} ${name}`;\n}\ngreetingFunction('Bye', 'Alberto');\n```\n\n我们创建了函数应有的形状，然后将变量赋给一个符合该形状的函数。\n\
  \n如果我们将变量赋给一个形状不同的函数，就会抛出错误。\n\n### 扩展接口\n\n一个接口可以扩展另一个接口，并继承前一个接口的成员：\n\n```\n\
  interface Vehicle {\n  wheels: number;\n  color: string;\n}\ninterface Airplane\
  \ extends Vehicle {\n  wings: number;\n  rotors: number;\n}\n```\n\n如你所见，一个飞机类型的对象将期望拥有所有四个属性，而不仅仅是\
  \ `Airplane` 接口中定义的两个。\n\n### 类\n\nTypeScript 类与 ES6 类非常相似，允许我们执行原型继承，为应用程序构建可复用的组件。\n\
  \n提醒一下它们的样子：\n\n```\nclass Animal {\n  eat = () => { console.log('gnam gnam'); }\n\
  \  sleep = () => { console.log('zzzz'); }\n}\nclass Human extends Animal {\n  work\
  \ = () => { console.log('zzzzzzz'); }\n}\nconst me = new Human();\nme.work(); //\
  \ zzzzzzz\nme.eat(); // gnam gnam\nme.sleep() // zzzz\n```\n\n我们创建了两个类，第二个类从第一个类继承了两种方法。\n\
  \n与 ES6 类的一个区别是，TypeScript 允许我们定义类成员在应用程序中的访问方式。\n\n如果我们希望它们在任何地方都可访问，需要使用关键字 `public`。\n\
  \n```\nclass Animal {\n  public eat = () => { console.log('gnam gnam') }\n  public\
  \ sleep = () => { console.log('zzzz') }\n}\nconst dog = new Animal();\ndog.eat();\
  \ // gnam gnam\n```\n\n在 JavaScript 中，所有类成员都是公开的，我们无法限制对它们的访问。\n\nTypeScript 还允许我们将成员标记为\
  \ `private`，这意味着它将无法从类外部访问。\n\n```\nclass Animal {\n  public eat = () => { console.log('gnam\
  \ gnam') }\n  public sleep = () => { console.log('zzzz') }\n}\nclass Human extends\
  \ Animal {\n  private work = () => { console.log('zzzzzzz') }\n}\nconst me = new\
  \ Human();\nme.work(); // 属性 'work' 是私有的，只能在类 'Human' 内部访问\n```\n\n我们还可以将成员标记为 `protected`，这意味着它只能在声明它的类以及扩展它的类内部访问。\n\
  \n```\nclass Human {\n  protected work = () => { console.log('zzzzzzz') }\n}\nclass\
  \ Adult extends Human {\n  public doWork = () => { console.log(this.work) }\n}\n\
  ```\n\n类 `Adult` 扩展了类 `Human`，因此它可以访问相同的受保护方法。\n\n## 交叉类型和联合类型\n\n我们已经了解了如何使用 TypeScript\
  \ 定义基本类型，现在让我们深入探讨更高级的类型。\n\n### 交叉类型\n\n顾名思义，交叉类型允许我们将多个类型合并在一起。让我们看看如何使用它们：\n\n\
  ```\ninterface Person {\n  sex: 'male' | 'female' | 'N/A'\n  age: number,\n}\ninterface\
  \ Worker {\n  job: string\n}\ntype Adult = Person & Worker;\nconst me: Adult = {\
  \ sex: 'male', age: 27, job: 'software developer' }\nconsole.log(me); // { sex:\
  \ 'male', age: 27, job: 'software developer' }\n```\n\n如你所见，我们有两个不同的类型 `Person`\
  \ 和 `Worker`，我们将它们组合在一起创建了类型 `Adult`，它是两者的结合。\n\n注意，当组合具有相同名称但不同类型的属性时，要小心，因为这会导致编译器报错。\n\
  \n### 联合类型\n\n```\nconst attendee = string | string[];\n```\n\n该变量可以是 `string` 或字符串数组。\n\
  \n另一个例子可能是：\n\n```\nconst identifier = string | number | string[];\n```\n\n我们使用管道符（`|`）来分隔每个类型。\n\
  \n请记住，我们只能访问联合类型中所有类型的公共成员。\n\n```\ninterface Kid { age: number }\ninterface Adult\
  \ { age: number, job: string }\nfunction person(): Kid | Adult { return { age: 27\
  \ } }\nconst me = person();\nme.age  // ok\nme.job  // error\n```\n\n属性 `job` 只存在于接口\
  \ `Adult` 中，而不存在于 `Kid` 中，因此我们无法在联合类型中访问它。\n\n### 结论\n\n本节向你展示了为什么 TypeScript 在使用\
  \ JavaScript 时是一个有用的工具，尤其是在与他人协作时。\n\n现在剩下要做的就是开始一个简单的项目，并熟悉它。\n\n\n\n起初，你可能觉得给变量标注类型是件麻烦事，但随着项目规模增长、复杂度提升，你会逐渐意识到这样做的好处，尤其是在花了几个月时间做其他事情后再回到这个项目时。\n\
  \n关于 TypeScript 的进一步问题，我建议的最佳资源是官方文档，可通过以下链接访问：<https://www.TypeScriptlang.org/docs/>。\n\
  \n## TypeScript 测验\n\n### TS-01 以下哪个不是 TypeScript 的基本类型？\n\n![bullet](img/bullet_nb_square-blk.png)`Tuple`\n\
