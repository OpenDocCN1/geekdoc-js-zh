  \ { wheels: number }`\n\n![bullet](img/bullet_nb_square-blk.png)`interface Car =\
  \ { wheels = number }`\n\n# 结语\n\n衷心感谢你坚持读到这里。这是我的第一本书，知道有人读完了它，我满心欢喜。\n\n希望你觉得它有用。如果是这样，我建议你关注我的新[网站](https://www.inspiredwebdev.com/)（[inspiredwebdev.com](http://inspiredwebdev.com)）和我的\
