  \ `Proxy`\n\n![bullet](img/bullet_nb_square-blk.png)`Proxy` 的 `target` 参数不能是另一个\
  \ `Proxy`\n\n# 第 16 章：Set、WeakSet、Map 和 WeakMap\n\n## 什么是 `Set`？\n\n`Set` 是一个对象，我们可以在其中存储任何类型的唯一值。\n\
  \n```\n// create our set const family =  new  Set(); // add values to it family.add(\"\
  Dad\"); console.log(family); // Set [ \"Dad\" ] family.add(\"Mom\"); console.log(family);\
  \ // Set [ \"Dad\", \"Mom\" ] family.add(\"Son\"); console.log(family); // Set [\
  \ \"Dad\", \"Mom\", \"Son\" ] family.add(\"Dad\"); console.log(family); // Set [\
  \ \"Dad\", \"Mom\", \"Son\" ]\n```\n\n如你所见，最后我们尝试再次添加 \"Dad\"，但 `Set` 仍然保持不变，因为\
  \ `Set` 只能包含唯一值。\n\n让我们继续使用同一个 `Set`，看看我们可以对它使用哪些方法。\n\n\n\n\n\n`family.size`; //\
  \ 3  \n`family.keys()`; // SetIterator {\"Dad\", \"Mom\", \"Son\"}  \n`family.entries()`;\
  \ // SetIterator {\"Dad\", \"Mom\", \"Son\"}  \n`family.values()`; // SetIterator\
  \ {\"Dad\", \"Mom\", \"Son\"}  \n`family.delete(\"Dad\")`;  \n`family`; // Set [\
  \ \"Mom\", \"Son\" ]  \n`family.clear()`;  \n`family`; // Set []\n\n如你所见，`Set` 有一个\
  \ `size` 属性，我们可以从中删除一个元素，或者使用 `clear` 删除所有元素。\n\n我们还可以注意到，`Set` 没有键，因此当我们调用 `.keys()`\
  \ 时，得到的结果与调用 `.values()` 或 `.entries()` 相同。\n\n### 遍历 Set\n\n有两种遍历 `Set` 的方式：使用\
  \ `.next()` 或使用 `for of` 循环。\n\n```\n// 使用 `.next()`\nconst iterator = family.values();\n\
  iterator.next(); // Object { value: \"Dad\", done: false }\niterator.next(); //\
  \ Object { value: \"Mom\", done: false }\n\n// 使用 `for of` 循环\nfor(const person\
  \ of family) {\n  console.log(person);\n}\n// Dad\n// Mom\n// Son\n```\n\n方法 `values()`\
  \ 会返回一个 `Iterator` 对象，我们可以像之前讨论生成器函数时那样，在其上调用 `next()`。\n\n### 从数组中移除重复项\n\n我们可以利用\
  \ `Set` 只能包含唯一值的特性，从 `Array` 中移除重复项。\n\n```\nconst myArray = [\"dad\", \"mom\",\
  \ \"son\", \"dad\", \"mom\", \"daughter\"];\nconst set = new Set(myArray);\nconsole.log(set);\
  \ // Set [ \"dad\", \"mom\", \"son\", \"daughter\" ]\n\n// 将 `Set` 转换为数组\nconst\
  \ uniqueArray = Array.from(set);\nconsole.log(uniqueArray); // Array [ \"dad\",\
  \ \"mom\", \"son\", \"daughter\" ]\n\n// 一行代码实现相同功能\nconst uniqueArray = Array.from(new\
  \ Set(myArray));\n// Array [ \"dad\", \"mom\", \"son\", \"daughter\" ]\n```\n\n\
  如你所见，新数组只包含原数组中的唯一值。\n\n## 什么是 WeakSet？\n\n`WeakSet` 类似于 `Set`，但它只能包含对象。\n\n```\n\
  let dad = {name: \"Daddy\", age: 50};\nlet mom = {name: \"Mummy\", age: 45};\nconst\
  \ family = new WeakSet([dad,mom]);\nfor(const person of family){\n  console.log(person);\n\
  }\n// TypeError: family is not iterable\n```\n\n我们创建了新的 `WeakSet`，但尝试使用 `for of`\
  \ 循环时失败了——我们不能遍历 `WeakSet`。\n\n当我们从 `WeakSet` 中删除一个元素后，它会自动清理自身。\n\n```\nlet dad\
  \ = {name: \"Daddy\", age: 50};\nlet mom = {name: \"Mummy\", age: 45};\nconst family\
  \ = new WeakSet([dad,mom]);\ndad = null;\nconsole.log(family); // WeakSet [ {…},\
  \ {…} ]\n// 等待几秒\nconsole.log(family); // WeakSet [ {…} ]\n```\n\n你可以在浏览器的开发者工具中尝试运行上面的示例，几秒钟后\
  \ `dad` 被移除并被垃圾回收。这是因为当我们将其值设为 `null` 时，对它的引用丢失了。\n\n## 什么是 Map？\n\n`Map` 类似于 `Set`，但它包含键/值对。\n\
  \n```\nconst family = new Map();\nfamily.set(\"Dad\", 40);\nfamily.set(\"Mom\",\
  \ 50);\nfamily.set(\"Son\", 20);\nfamily; // Map { Dad → 40, Mom → 50, Son → 20\
  \ }\nfamily.size; // 3\nfamily.forEach((val,key) => console.log(key,val));\n// Dad\
  \ 40\n// Mom 50\n// Son 20\nfor(const [key,val] of family){\n  console.log(key,val);\n\
  }\n// Dad 40\n// Mom 50\n// Son 20\n```\n\n如果你还记得，我们只能使用 `for of` 循环遍历 `Set`，而 `Map`\
  \ 既可以用 `for of` 也可以用 `forEach` 循环遍历。\n\n## 什么是 WeakMap？\n\n`WeakMap` 是一个键/值对的集合，与\
  \ `WeakSet` 类似，`WeakMap` 中的键也是弱引用的，这意味着当引用丢失时，该值会从 `WeakMap` 中被移除并被垃圾回收。\n\n`WeakMap`\
  \ 不可枚举，因此我们不能遍历它。\n\n```\nlet dad = { name: \"Daddy\" };\nlet mom = { name: \"Mommy\"\
  \ };\nconst myMap = new Map();\nconst myWeakMap = new WeakMap();\nmyMap.set(dad);\n\
  myWeakMap.set(mom);\ndad = null;\nmom = null;\nconsole.log(myMap); // Map(1) {{…}}\n\
  console.log(myWeakMap); // WeakMap {}\n```\n\n如你所见，`mom` 在我们将它的值设为 `null` 后被垃圾回收了，而\
  \ `dad` 仍然保留在我们的 `Map` 中。\n\n## 第 16 章小测验\n\n### 16.1 以下哪个不存在？\n\n![bullet](img/bullet_nb_square-blk.png)\
  \ `Set`\n\n![bullet](img/bullet_nb_square-blk.png) `WeakSet`\n\n![bullet](img/bullet_nb_square-blk.png)\
  \ `StrongSet`\n\n![bullet](img/bullet_nb_square-blk.png) `WeakMap`\n\n### 16.2 以下哪个定义是正确的？\n\
  \n![bullet](img/bullet_nb_square-blk.png) `Set` 只能存储对象\n\n![bullet](img/bullet_nb_square-blk.png)\
  \ `WeakSet` 只能存储对象\n\n![bullet](img/bullet_nb_square-blk.png) `WeakSet` 可以被覆盖\n\n\
  ![bullet](img/bullet_nb_square-blk.png) `Set` 和 `WeakSet` 都只能存储对象\n\n### 16.3 以下哪个定义是正确的？\n\
  \n![bullet](img/bullet_nb_square-blk.png) `Map` 只存储键\n\n![bullet](img/bullet_nb_square-blk.png)\
  \ `Set` 存储键和值，`Map` 只存储值\n\n![bullet](img/bullet_nb_square-blk.png) `Map` 存储键和值，`Set`\
  \ 只存储值\n\n![bullet](img/bullet_nb_square-blk.png) 都不对，它们都只存储值\n\n# 第 17 章：ES2016\
  \ 中的所有新特性\n\nES2016 只引入了两个新特性：\n\n1. `Array.prototype.includes()`\n2. 指数运算符\n\n\
  ## Array.prototype.includes()\n\n如果我们的数组包含某个元素，`includes()` 方法将返回 `true`，否则返回 `false`。\n\
  \n```\nlet array = [1,2,4,5];\narray.includes(2); // true\narray.includes(3); //\
  \ false\n```\n\n### 将 `includes()` 与 `fromIndex` 结合使用\n\n我们可以为 `.includes()` 提供一个索引，从该位置开始搜索元素。默认值为\
  \ `0`，但也可以传入负值。\n\n第一个参数是要搜索的元素，第二个参数是起始索引：\n\n```\nlet array = [1,3,5,7,9,11];\n\
  array.includes(3,1); // 从数组索引 1 开始查找数字 3\n// true\narray.includes(5,4); // false\n\
  array.includes(1,-1); // 从数组末尾向前查找数字 1\n// false\narray.includes(11,-3); // true\n\
  ```\n\n`array.includes(5,4)` 返回 `false`，因为尽管数组确实包含数字 `5`，但它位于索引 `2`，而我们是从位置 `4`\
  \ 开始查找的，所以找不到，返回 `false`。\n\n`array.includes(1,-1)` 返回 `false`，因为我们从索引 `-1`（即数组的最后一个元素）开始查找，然后从该点向后继续。\n\
  \n`array.includes(11,-3)` 返回 `true`，因为我们回到索引 `-3` 并向前移动，在路径上找到了值 `11`。\n\n## 指数运算符\n\
  \n在 ES2016 之前，我们会这样做：\n\n```\nMath.pow(2,2); // 4\nMath.pow(2,3); // 8\n```\n\n\
  现在有了新的指数运算符，我们可以这样做：\n\n```\n2**2; // 4\n2**3; // 8\n```\n\n当组合多个运算时，它会变得非常有用，例如：\n\
  \n```\n2**2**2; // 16\nMath.pow(Math.pow(2,2),2); // 16\n```\n\n使用 `Math.pow()`\
  \ 需要不断嵌套，代码会变得冗长且混乱。指数运算符提供了一种更快、更简洁的方式来完成相同操作。\n\n## 第 17 章小测验\n\n### 17.1 ES2016\
  \ 引入了哪个新数组方法？\n\n![bullet](img/bullet_nb_square-blk.png) `Array.prototype.contains()`\n\
  \n![bullet](img/bullet_nb_square-blk.png) `Array.prototype.has()`\n\n![bullet](img/bullet_nb_square-blk.png)\
  \ `Array.prototype.includes()`\n\n![bullet](img/bullet_nb_square-blk.png) `Array.prototype.find()`\n\
  \n### 17.2 以下代码的正确输出是什么？\n\n```\nlet array = [1,3,5,7,9,11];\narray.includes(5,4);\n\
  ```\n\n![bullet](img/bullet_nb_square-blk.png) `4`\n\n![bullet](img/bullet_nb_square-blk.png)\
  \ `true`\n\n![bullet](img/bullet_nb_square-blk.png) `5`\n\n![bullet](img/bullet_nb_square-blk.png)\
  \ `false`\n\n### 17.3 编写代码完成以下任务：\n\n重构以下代码，使用新的指数运算符。\n\n```\nMath.pow(Math.pow(2,2),2);\
  \ // 16\n```\n\n# 第 18 章：ES2017 字符串填充、`Object.entries()`、`Object.values()` 等\n\n\
  ES2017 引入了许多很酷的新特性，我们将在本章中介绍。\n\n## 字符串填充（`.padStart()` 和 `.padEnd()`）\n\n\n\n\n\
  现在我们可以为字符串添加一些填充，可以在末尾（`.padEnd()`）或开头（`.padStart()`）进行填充。\n\n`\"hello\".padStart(6);`\
  \ // \" hello\" `\"hello\".padEnd(6);` // \"hello \"\n\n我们指定了填充长度为 6，那么为什么两种情况下都只得到了一个空格呢？\n\
  \n这是因为 `padStart` 和 `padEnd` 会去填充空白位置。在我们的例子中，`\"hello\"` 有 5 个字母，填充长度为 6，所以只留下\
  \ 1 个空白位置。\n\n再看这个例子：\n\n`\"hi\".padStart(10);` // 10 - 2 = 8 个空白位置 // \" hi\" `\"\
  welcome\".padStart(10);` // 10 - 6 = 4 个空白位置 // \" welcome\"\n\n### 使用 padStart\
  \ 右对齐\n\n如果我们想右对齐某些内容，可以使用 `padStart`。\n\n```\nconst strings = [\"short\",  \"medium\
  \ length\",  \"very long string\"];\nconst longestString =  strings.sort(str =>\
  \  str.length).map(str =>  str.length)[0];\nstrings.forEach(str =>  console.log(str.padStart(longestString)));\n\
  // very long string\n// medium length\n// short\n```\n\n首先，我们找出最长的字符串并测量其长度。然后，基于最长字符串的长度，对所有字符串应用\
  \ `padStart`，这样它们就完美地右对齐了。\n\n### 为填充添加自定义值\n\n我们不仅限于添加空格作为填充，还可以传入字符串和数字。\n\n`\"\
  hello\".padEnd(13,\" Alberto\");` // \"hello Alberto\" `\"1\".padStart(3,0);` //\
  \ \"001\" `\"99\".padStart(3,0);` // \"099\"\n\n## Object.entries() 和 Object.values()\n\
  \n首先创建一个对象。\n\n```\nconst family =  {\n  father:  \"Jonathan Kent\",\n  mother:\
  \  \"Martha Kent\",\n  son:  \"Clark Kent\",\n}\n```\n\n在旧版本的 JavaScript 中，我们这样访问对象内部的值：\n\
  \n```\nObject.keys(family); // [\"father\", \"mother\", \"son\"]\nfamily.father;\
  \ \"Jonathan Kent\"\n```\n\n`Object.keys()` 只返回对象的键，然后我们必须用这些键来访问值。\n\n现在我们有了另外两种访问对象的方式：\n\
  \n```\nObject.values(family); // [\"Jonathan Kent\", \"Martha Kent\", \"Clark Kent\"\
  ]\nObject.entries(family); // [\"father\", \"Jonathan Kent\"]\n// [\"mother\", \"\
  Martha Kent\"]\n// [\"son\", \"Clark Kent\"]\n```\n\n`Object.values()` 返回所有值的数组，而\
  \ `Object.entries()` 返回一个包含键和值对的数组的数组。\n\n## Object.getOwnPropertyDescriptors()\n\
  \n这个方法会返回一个对象的所有自身属性描述符。\n\n它可以返回的属性包括 value、writable、get、set、configurable 和 enumerable。\n\
  \n```\nconst myObj =  {\n  name:  \"Alberto\",\n  age:  25,\n  greet() { console.log(\"\
  hello\"); },\n}\nObject.getOwnPropertyDescriptors(myObj);\n// age:{value: 25, writable:\
  \ true, enumerable: true, configurable: true}\n// greet:{value: ƒ, writable: true,\
  \ enumerable: true, configurable: true}\n// name:{value: \"Alberto\", writable:\
  \ true, enumerable: true, configurable: true}\n```\n\n## 尾逗号\n\n这只是语法上的一个小改动。现在，在编写对象时，我们可以在每个参数后面加上一个尾逗号，无论它是不是最后一个参数。\n\
  \n```\n// 从这样\nconst object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\"\n}\n\
  // 变成这样\nconst object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\",\n}\n```\n\
  \n注意我在第二个属性末尾写了一个逗号。\n\n如果你不写它，也不会抛出任何错误，但遵循这个习惯可以让你的同事或团队成员的工作更轻松。\n\n```\n// 我这样写\n\
  const object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\"\n}\n// 我的同事更新代码，添加一个新属性\n\
  const object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\"\n  prop3:  \"propopop\"\
  \n}\n// 突然，他得到了一个错误，因为他没有注意到我忘了在最后一个参数末尾加逗号。\n```\n\n## 共享内存和 Atomics\n\n来自 [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Atomics)：\n\
  \n当内存被共享时，多个线程可以读取和写入内存中的同一数据。原子操作确保可预测的值被写入和读取，确保操作在下一个操作开始之前完成，并且操作不会被中断。\n\n\
  `Atomics` 不是一个构造函数，它的所有属性和方法都是静态的（就像 `Math` 一样），因此我们不能使用 `new` 操作符来调用它，也不能将 `Atomics`\
  \ 对象作为函数调用。\n\n它的方法示例包括：\n\n1.  `add` / `sub`\n\n1.  `and` / `or` / `xor`\n\n1.\
  \  `load` / `store`\n\n`Atomics` 与 `SharedArrayBuffer`（通用固定长度二进制数据缓冲区）对象一起使用，这些对象表示通用的、固定长度的原始二进制数据缓冲区。\n\
  \n让我们看一些 `Atomics` 方法的示例：\n\n### Atomics.add()、Atomics.sub()、Atomics.load() 和 Atomics.store()\n\
  \n`Atomics.add()` 接受三个参数：一个数组、一个索引和一个值，并返回执行加法之前该索引处的旧值。\n\n```\n// 创建一个 `SharedArrayBuffer`\n\
  const buffer =  new  SharedArrayBuffer(16);\nconst uint8 =  new  Uint8Array(buffer);\n\
  // 在第一个位置添加一个值\nuint8[0] =  10;\nconsole.log(Atomics.add(uint8,  0,  5)); // 10\n\
  // 10 + 5 = 15\nconsole.log(uint8[0]) // 15\nconsole.log(Atomics.load(uint8,0));\
  \ // 15\n```\n\n如你所见，调用 `Atomics.add()` 会返回目标数组位置处的旧值。当我们再次调用 `uint8[0]` 时，发现加法已经执行，得到了\
  \ 15。\n\n要从数组中检索特定值，我们可以使用 `Atomics.load`，并传入两个参数：一个数组和一个索引。\n\n`Atomics.sub()`\
  \ 的工作方式与 `Atomics.add()` 相同，但它会减去一个值。\n\n```\n// 创建一个 `SharedArrayBuffer`\nconst\
  \ buffer =  new  SharedArrayBuffer(16);\nconst uint8 =  new  Uint8Array(buffer);\n\
  // 在第一个位置添加一个值\nuint8[0] =  10;\nconsole.log(Atomics.sub(uint8,  0,  5)); // 10\n\
  // 10 - 5 = 5\nconsole.log(uint8[0]) // 5\nconsole.log(Atomics.store(uint8,0,3));\
  \ // 3\nconsole.log(Atomics.load(uint8,0)); // 3\n```\n\n这里我们使用 `Atomics.sub()`\
  \ 从 `uint8[0]` 位置的值中减去 5，相当于 10 - 5。\n\n与 `Atomics.add()` 一样，该方法会返回该索引处的旧值，这里是 10。\n\
  \n然后我们使用 `Atomics.store()` 在数组的特定索引（这里是 0，第一个位置）存储一个特定值（这里是 3）。`Atomics.store()`\
  \ 会返回我们刚刚传入的值，这里是 3。你可以看到，当我们对该索引调用 `Atomics.load()` 时，得到的是 3，而不是之前的 5。\n\n### Atomics.and()、Atomics.or()\
  \ 和 Atomics.xor()\n\n这三个方法都在数组的给定位置执行按位与（AND）、或（OR）和异或（XOR）操作。你可以在 [Wikipedia](https://en.wikipedia.org/wiki/Bitwise_operation)\
  \ 上通过链接 https://en.wikipedia.org/wiki/Bitwise_operation 了解更多关于按位操作的信息。\n\n## 第 18\
  \ 章测验结束\n\n### 18.1 以下代码的正确输出是什么？\n\n`\"hello\".padStart(6);`\n\n![bullet](img/bullet_nb_square-blk.png)`\"\
  \ hello\"`\n\n![bullet](img/bullet_nb_square-blk.png)`\"hello \"`\n\n![bullet](img/bullet_nb_square-blk.png)`\"\
  \ hello\"`\n\n![bullet](img/bullet_nb_square-blk.png)`\"hello\"`\n\n### 18.2 编写代码完成以下任务：\n\
  \n使用 `padStart` 将以下三个字符串右对齐。\n\n```\nconst strings = [\"short\",  \"medium length\"\
  ,  \"very long string\"];\n// 期望输出\n// short\n// medium length\n// very long string\n\
  ```\n\n### 18.3 以下哪个不是在 ES2016 中新增的？\n\n![bullet](img/bullet_nb_square-blk.png)`Object.entries()`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`Object.keys()`\n\n![bullet](img/bullet_nb_square-blk.png)`Object.values()`\n\
  \n### 18.4 以下代码的正确输出是什么：\n\n```\nconst buffer =  new  SharedArrayBuffer(16);\nconst\
  \ uint8 =  new  Uint8Array(buffer);\nuint8[0] =  10;\nconsole.log(Atomics.add(uint8,\
  \  0,  5));\n```\n\n![bullet](img/bullet_nb_square-blk.png)0\n\n![bullet](img/bullet_nb_square-blk.png)10\n\
  \n![bullet](img/bullet_nb_square-blk.png)15\n\n![bullet](img/bullet_nb_square-blk.png)5\n\
  \n### 18.5 以下代码的正确输出是什么：\n\n```\nconst buffer =  new  SharedArrayBuffer(16);\nconst\
  \ uint8 =  new  Uint8Array(buffer);\nuint8[0] =  10;\nAtomics.sub(uint8,  0,  6);\n\
  console.log(Atomics.load(uint8,0));\n```\n\n\n\n\n\n![bullet](img/bullet_nb_square-blk.png)0\n\
  \n![bullet](img/bullet_nb_square-blk.png)10\n\n![bullet](img/bullet_nb_square-blk.png)6\n\
  \n![bullet](img/bullet_nb_square-blk.png)4\n\n# 第 19 章：ES2017 异步与等待\n\nES2017 引入了一种处理\
  \ Promise 的新方式，称为“async/await”。\n\n## Promise 回顾\n\n在深入探讨这个新语法之前，我们先快速回顾一下通常如何编写\
  \ Promise：\n\n```javascript\n// 从 GitHub 获取用户\nfetch('api.github.com/user/AlbertoMontalesi').then(\
  \ res =>  {\n  // 以 JSON 格式返回数据\n  return  res.json();\n}).then(res =>  {\n  //\
  \ 如果一切顺利，打印数据\n  console.log(res);\n}).catch( err =>  {\n  // 或者打印错误\n  console.log(err);\n\
  })\n```\n\n这是一个非常简单的 Promise，用于从 GitHub 获取用户并打印到控制台。\n\n让我们看另一个例子：\n\n```javascript\n\
  function  walk(amount) {\n  return  new  Promise((resolve,reject) =>  {\n    if\
  \ (amount <  500) {\n      reject (\"the value is too small\");\n    }\n    setTimeout(()\
  \ =>  resolve(`you walked for ${amount}ms`),amount);\n  });\n}\n\nwalk(1000).then(res\
  \ =>  {\n  console.log(res);\n  return  walk(500);\n}).then(res =>  {\n  console.log(res);\n\
  \  return  walk(700);\n}).then(res =>  {\n  console.log(res);\n  return  walk(800);\n\
  }).then(res =>  {\n  console.log(res);\n  return  walk(100);\n}).then(res =>  {\n\
  \  console.log(res);\n  return  walk(400);\n}).then(res =>  {\n  console.log(res);\n\
  \  return  walk(600);\n});\n// you walked for 1000ms\n// you walked for 500ms\n\
  // you walked for 700ms\n// you walked for 800ms\n// uncaught exception: the value\
  \ is too small\n```\n\n让我们看看如何用新的 async/await 语法重写这个 Promise。\n\n## Async 和 Await\n\
  \n```javascript\nfunction  walk(amount) {\n  return  new  Promise((resolve,reject)\
  \ =>  {\n    if (amount <  500) {\n      reject (\"the value is too small\");\n\
  \    }\n    setTimeout(() =>  resolve(`you walked for ${amount}ms`),amount);\n \
  \ });\n}\n\n// 创建一个 async 函数\nasync  function  go() {\n  // 使用关键字 `await` 等待响应\n\
  \  const res =  await  walk(500);\n  console.log(res);\n  const res2 =  await  walk(900);\n\
  \  console.log(res2);\n  const res3 =  await  walk(600);\n  console.log(res3);\n\
  \  const res4 =  await  walk(700);\n  console.log(res4);\n  const res5 =  await\
  \  walk(400);\n  console.log(res5);\n  console.log(\"finished\");\n}\n\ngo();\n\
  // you walked for 500ms\n// you walked for 900ms\n// you walked for 600ms\n// you\
  \ walked for 700ms\n// uncaught exception: the value is too small\n```\n\n让我们分解一下我们刚刚做了什么：\n\
  \n1.  要创建一个 async 函数，我们需要在它前面加上 `async` 关键字\n2.  该关键字会告诉 JavaScript 始终返回一个 Promise\n\
  3.  如果我们指定返回 `<non-promise>`，它会返回一个包裹在 Promise 中的值\n4.  `await` 关键字只能在 async 函数内部工作\n\
  5.  顾名思义，`await` 会告诉 JavaScript 等待 Promise 返回其结果\n\n让我们看看如果尝试在 async 函数外部使用 `await`\
  \ 会发生什么\n\n```javascript\n// 在普通函数中使用 await\nfunction  func() {\n  let promise =\
  \  Promise.resolve(1);\n  let result =  await promise;\n}\nfunc();\n// SyntaxError:\
  \ await is only valid in async functions and async generators\n\n// 在顶层代码中使用 await\n\
  let response =  Promise.resolve(\"hi\");\nlet result =  await response;\n// SyntaxError:\
  \ await is only valid in async functions and async generators\n```\n\n记住：你只能在 async\
  \ 函数内部使用 `await`。\n\n## 错误处理\n\n在普通的 Promise 中，我们会使用 `.catch()` 来捕获 Promise 可能返回的错误。\n\
  \n在这里，它并没有太大区别：\n\n```javascript\nasync  function  asyncFunc() {\n  try  {\n   \
  \ let response =  await  fetch('http:your-url');\n  }  catch(err) {\n    console.log(err);\n\
  \  }\n}\nasyncFunc();\n// TypeError: failed to fetch\n```\n\n我们使用 `try...catch`\
  \ 来捕获错误，但在没有它们的情况下，我们仍然可以像这样捕获错误：\n\n```javascript\nasync  function  asyncFunc(){\n\
  \  let response =  await  fetch('http:your-url');\n}\nasyncFunc();\n// Uncaught\
  \ (in promise) TypeError: Failed to fetch\nasyncFunc().catch(console.log);\n// TypeError:\
  \ Failed to fetch\n```\n\n## 第 19 章结束测验\n\n### 19.1 以下代码的正确输出是什么？\n\n```javascript\n\
  function  func() {\n  let promise =  Promise.resolve(1);\n  let result =  await\
  \ promise;\n}\nfunc();\n```\n\n![bullet](img/bullet_nb_square-blk.png)1\n\n![bullet](img/bullet_nb_square-blk.png)true\n\
  \n![bullet](img/bullet_nb_square-blk.png)undefined\n\n![bullet](img/bullet_nb_square-blk.png)`SyntaxError`\n\
  \n### 19.2 以下代码的最后输出是什么：\n\n```javascript\nfunction  walk(amount) {\n  return  new\
  \  Promise((resolve,reject) =>  {\n    if (amount >  500) {\n      reject (\"the\
  \ value is too big\");\n    }\n    setTimeout(() =>  resolve(`you walked for ${amount}ms`),amount);\n\
  \  });\n}\nasync  function  go() {\n  const res =  await  walk(500);\n  console.log(res);\n\
  \  const res2 =  await  walk(300);\n  console.log(res2);\n  const res3 =  await\
  \  walk(200);\n  console.log(res3);\n  const res4 =  await  walk(700);\n  console.log(res4);\n\
  \  const res5 =  await  walk(400);\n  console.log(res5);\n  console.log(\"finished\"\
  );\n}\ngo();\n```\n\n![bullet](img/bullet_nb_square-blk.png)\"you walked for 700ms\"\
  \n\n![bullet](img/bullet_nb_square-blk.png)\"you walked for 400ms\"\n\n![bullet](img/bullet_nb_square-blk.png)uncaught\
  \ exception: the value is too big\n\n![bullet](img/bullet_nb_square-blk.png)\"finished\"\
  \n\n# 第 20 章：ES2018 异步迭代及其他？\n\n在本章中，我们将了解 ES2018 引入了哪些新特性。\n\n## 对象的 Rest / Spread\n\
  \n还记得 ES6（ES2015）允许我们这样做吗？\n\n```javascript\nconst veggie = [\"tomato\",\"cucumber\"\
  ,\"beans\"];\nconst meat = [\"pork\",\"beef\",\"chicken\"];\nconst menu = [...veggie,\
  \  \"pasta\", ...meat];\nconsole.log(menu);\n// Array [ \"tomato\", \"cucumber\"\
  , \"beans\", \"pasta\", \"pork\", \"beef\", \"chicken\" ]\n```\n\n现在，我们也可以对对象使用\
  \ rest/spread 语法，让我们看看如何操作：\n\n```javascript\nlet myObj =  {\n  a:1,\n  b:3,\n \
  \ c:5,\n  d:8,\n}\n// 我们使用 rest 运算符来获取对象中剩余的所有内容。\nlet  { a, b, ...z  }  = myObj;\n\
  console.log(a);  // 1\nconsole.log(b);  // 3\nconsole.log(z);  // {c: 5, d: 8}\n\
  \n// 使用 spread 语法，我们克隆了对象\nlet clone =  { ...myObj  };\nconsole.log(clone); // {a:\
  \ 1, b: 3, c: 5, d: 8}\n\nmyObj.e  =  15;\nconsole.log(clone) // {a: 1, b: 3, c:\
  \ 5, d: 8}\nconsole.log(myObj) // {a: 1, b: 3, c: 5, d: 8, e: 15}\n```\n\n使用 spread\
  \ 运算符，我们可以轻松创建对象的克隆，这样当我们修改原始对象时，克隆不会受到影响，这与我们在讨论数组时看到的情况类似。\n\n## 异步迭代\n\n通过异步迭代，我们可以异步地遍历数据。\n\
  \n[来自文档：](https://github.com/tc39/proposal-async-iteration)\n\n异步迭代器与迭代器非常相似，不同之处在于它的\
  \ `next()` 方法返回一个 Promise，该 Promise 解析为 `{ value, done }` 对。\n\n为此，我们将使用 `for-await-of`\
  \ 循环，它会将我们的可迭代对象转换为 Promise，除非它们已经是 Promise。\n\n```javascript\nconst iterables =\
  \ [1,2,3];\nasync  function  test() {\n  for  await (const value of iterables) {\n\
  \    console.log(value);\n  }\n}\ntest();\n// 1\n// 2\n// 3\n```\n\n在执行过程中，会使用 `[Symbol.asyncIterator]()`\
  \ 方法从数据源创建一个异步迭代器。\n\n每次我们访问序列中的下一个值时，都会隐式地等待迭代器方法返回的 Promise。\n\n## Promise.prototype.finally()\n\
  \n在 Promise 完成后，我们可以调用一个回调函数。\n\n```javascript\nconst myPromise =  new  Promise((resolve,reject)\
  \ =>  {\n  resolve();\n})\n\nmyPromise\n.then( () =>  {\n  console.log('still working');\n\
  })\n.catch( () =>  {\n  console.log('there was an error');\n})\n.finally(()=>  {\n\
  \  console.log('Done!');\n})\n```\n\n`.finally()` 也会返回一个 Promise，因此我们可以在它后面链式调用更多的\
  \ `then` 和 `catch`，但这些 Promise 将基于它们所链式调用的 Promise 来履行。\n\n```javascript\nconst\
  \ myPromise =  new  Promise((resolve,reject) =>  {\n  resolve();\n})\n\nmyPromise\n\
  .then( () =>  {\n  console.log('still working');\n  return  'still working';\n})\n\
  .finally(()=>  {\n  console.log('Done!');\n  return  'Done!';\n})\n.then( res =>\
  \  {\n  console.log(res);\n})\n// still working\n// Done!\n// still working\n```\n\
  \n\n\n\n正如你所见，`finally` 之后链式调用的 `then` 返回的值是由第一个 `then` 创建的 `Promise` 返回的，而不是由 `finally`\
  \ 创建的。\n\n## RegExp 特性\n\n四个与正则表达式相关的新特性被纳入新版本的 ECMAScript。它们是：\n\n1.  [正则表达式的 s（dotAll）标志](https://github.com/tc39/proposal-regexp-dotall-flag)\n\
  2.  [正则表达式命名捕获组](https://github.com/tc39/proposal-regexp-named-groups)\n3.  [正则表达式后行断言](https://github.com/tc39/proposal-regexp-lookbehind)\n\
  4.  [正则表达式 Unicode 属性转义](https://github.com/tc39/proposal-regexp-lookbehind)\n\n\
  ### 正则表达式的 s（dotAll）标志\n\n这为 ECMAScript 正则表达式引入了一个新的 `s` 标志，使得 `.` 能够匹配任何字符，包括行终止符。\n\
  \n```\n/foo.bar/s.test('foo\\nbar'); // true\n```\n\n### 正则表达式命名捕获组\n\n[来自文档：](https://github.com/tc39/proposal-regexp-named-groups)\n\
  \n编号捕获组允许引用正则表达式匹配的字符串的特定部分。每个捕获组被分配一个唯一的编号，并可以通过该编号引用，但这可能使正则表达式难以理解和重构。例如，给定匹配日期的\
  \ `/(\\d{4})-(\\d{2})-(\\d{2})/`，如果不检查周围代码，就无法确定哪个组对应月份，哪个组对应日期。此外，如果想要交换月份和日期的顺序，组引用也需要更新。捕获组可以使用\
  \ `(?<name>...)` 语法为任何标识符名称命名。那么日期的正则表达式可以写成 `/(?<year>\\d{4})-(?<month>\\d{2})-(?<day>\\\
  d{2})/u`。每个名称必须唯一，并遵循 ECMAScript IdentifierName 的语法。命名组可以通过正则表达式结果的 `groups` 属性的属性来访问。同时也会创建对组的编号引用，就像非命名组一样。例如：\n\
  \n```\nlet re =  /(?<year>\\d{4})-(?<month>\\d{2})-(?<day>\\d{2})/u;\nlet result\
  \ =  re.exec('2015-01-02');\n// result.groups.year === '2015';\n// result.groups.month\
  \ === '01';\n// result.groups.day === '02';\n// result[0] === '2015-01-02';\n//\
  \ result[1] === '2015';\n// result[2] === '01';\n// result[3] === '02';\nlet  {groups:\
  \  {one, two}}  =  /^(?<one>.*):(?<two>.*)$/u.exec('foo:bar');\nconsole.log(`one:\
  \ ${one}, two: ${two}`);  // one: foo, two: bar\n```\n\n### 正则表达式后行断言\n\n[来自文档：](https://github.com/tc39/proposal-regexp-lookbehind)\n\
  \n使用后行断言，可以确保某个模式前面有（或没有）另一个模式，例如匹配美元金额而不捕获美元符号。正向后行断言表示为 `(?<=...)`，它确保包含的模式位于断言后面的模式之前。例如，如果想要匹配美元金额而不捕获美元符号，可以使用\
  \ `/(?<=\\$)\\d+(\\.\\d*)?/`，匹配 `'$10.53'` 并返回 `'10.53'`。但这不会匹配 `€10.53`。负向后行断言表示为\
  \ `(?<!...)`，它确保包含的模式不在断言后面的模式之前。例如，`/(?<!\\$)\\d+(?:\\.\\d*)/` 不会匹配 `'$10.53'`，但会匹配\
  \ `'€10.53'`。\n\n### 正则表达式 Unicode 属性转义\n\n[来自文档：](https://github.com/tc39/proposal-regexp-unicode-property-escapes)\n\
  \n这引入了形式为 `\\p{…}` 和 `\\P{…}` 的 Unicode 属性转义。Unicode 属性转义是一种新的转义序列类型，可用于设置了 `u`\
  \ 标志的正则表达式。有了这个特性，我们可以编写：\n\n```\nconst regexGreekSymbol =  /\\p{Script=Greek}/u;\n\
  regexGreekSymbol.test('π'); // true\n```\n\n## 解除模板字面量的限制\n\n在使用带标签的模板字面量时，对转义序列的限制被移除。\n\
  \n你可以在此处阅读更多内容：[这里](https://tc39.github.io/proposal-template-literal-revision/#sec-template-literals)（[`tc39.github.io/proposal-template-literal-revision/#sec-template-literals`](https://tc39.github.io/proposal-template-literal-revision/#sec-template-literals)）。\n\
  \n## 第 20 章末测验\n\n### 20.1 对象的展开运算符的正确语法是什么？\n\n![bullet](img/bullet_nb_square-blk.png)`[...]`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`(...)`\n\n![bullet](img/bullet_nb_square-blk.png)`{...}`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`=>`\n\n### 20.2 以下代码的正确输出是什么：\n\n```\n\
