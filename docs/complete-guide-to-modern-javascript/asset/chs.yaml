  `\n\n变量名不能包含标点符号\n\n### JS-02\n\n1. `Object`\n\n### JS-03\n\n1. `const car = { color:\
  \ \"red\" }`\n\n### JS-04\n\n1. `false`\n\n### JS-05\n\n1. `[\"melon\", \"apple\"\
  , \"banana\", \"orange\"]`\n\n## 第 1 章测验答案结束\n\n### 1.1\n\n1. `Good morning`\n\n\
  ### 1.2\n\n1. `2`\n\n### 1.3\n\n1. `100`\n\n### 1.4\n\n1. `ReferenceError`\n\n##\
  \ 第 2 章测验结束\n\n### 2.1\n\n1. `B`\n\n箭头函数的正确语法是所谓的胖箭头 `=>`\n\n### 2.2\n\n1. `10`\n\
  \n在箭头函数内部，`this` 关键字继承自其父作用域，本例中父作用域是 window，因此 age 仍为 10。\n\n### 2.3\n\n```\n(arg)\
  \ => { console.log(arg); }\n```\n\n## 第 3 章测验结束\n\n### 3.1\n\n```\nfunction calculatePrice(total,\
  \ tax = 0.1, tip = 0.05) {\n  // 当未给 tax 或 tip 赋值时，将使用默认值 0.1 和 0.05\n  return total\
  \ + (total * tax) + (total * tip);\n}\n```\n\n### 3.2\n\n1. `10`\n\n## 第 4 章测验结束\n\
  \n### 4.1\n\n```\nlet result = `${a} ${c} ${d} ${b} ${e}`;\n```\n\n### 4.2\n\n```\n\
  let result = `${a} ${c} ${b} ${e} ${d}`;\nconsole.log(result); // 1 plus 2 equals\
  \ 3\n```\n\n### 4.3\n\n```\nconsole.log(`this is a very long text a very long text`);\n\
  // this is a very long text\n// a very long text\n```\n\n## 第 5 章测验结束\n\n### 5.1\n\
  \n1. `true`\n\n它将在 3 个字符后开始检查\n\n### 5.2\n\n1. `false`\n\n`endsWith` 区分大小写\n\n###\
  \ 5.3\n\n```\nlet batman = `${str.repeat(8)} ${bat}`;\nconsole.log(batman); // \"\
  NaNaNaNaNaNaNaNa BatMan\"\n```\n\n## 第 6 章测验结束\n\n### 6.1\n\n```\nlet hungry = \"\
  yes\";\nlet full = \"no\";\n[hungry, full] = [full, hungry];\nconsole.log(hungry);\
  \ // no\nconsole.log(full); // yes\n```\n\n### 6.2\n\n```\nlet arr = [\"one\", \"\
  two\", \"three\"];\n// 解决方案：\nlet [one, two, three] = arr;\nconsole.log(one); //\
