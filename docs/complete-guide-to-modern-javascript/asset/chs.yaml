  ```\n\n![bullet](img/bullet_nb_square-blk.png)`[3,4]`\n\n![bullet](img/bullet_nb_square-blk.png)`{c:3,\
  \ d:4}`\n\n![bullet](img/bullet_nb_square-blk.png)`undefined`\n\n![bullet](img/bullet_nb_square-blk.png)`[c,d]`\n\
