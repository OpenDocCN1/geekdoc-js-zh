  \ 2, 4, 5]`\n\n![bullet](img/bullet_nb_square-blk.png)`[1, 2, 3, 4, 5]`\n\n![bullet](img/bullet_nb_square-blk.png)`\"\
  1, 2, 3, 4, 5\"`\n\n# 第 10 章：对象字面量的升级\n\n在本节中，我们将了解 ES6 为对象字面量语法带来的诸多升级。\n\n## 将变量解构为键和值\n\
  \n这是初始情况：\n\n```\nconst name =  \"Alberto\"; const surname =  \"Montalesi\"; const\
  \ age =  25; const nationality =  \"Italian\";\n```\n\n如果我们想创建一个对象字面量，通常的做法是：\n\n\
  ```\nconst person =  { name: name, surname: surname, age: age, nationality: nationality,\
  \ } console.log(person); // { name: 'Alberto', // surname: 'Montalesi', // age:\
  \ 25, // nationality: 'Italian' }\n```\n\n在 ES6 中，我们可以简化为：\n\n```\nconst person\
  \ =  { name, surname, age, nationality, } console.log(person); // {name: \"Alberto\"\
  , surname: \"Montalesi\", age: 25, nationality: \"Italian\"}\n```\n\n由于我们的常量名称与使用的属性名称相同，因此可以减少输入。\n\
  \n## 向对象添加函数\n\n让我们看一个 ES5 的例子：\n\n```\nconst person =  { name:  \"Alberto\", greet:\
  \  function(){ console.log(\"Hello\"); }, } person.greet(); // Hello\n```\n\n如果我们想向对象添加一个函数，必须使用\
  \ `function` 关键字。在 ES6 中，这变得更简单了，请看：\n\n```\nconst person =  { name:  \"Alberto\"\
  , greet(){ console.log(\"Hello\"); }, } person.greet(); // Hello;\n```\n\n不再需要 `function`，更简洁，行为相同。\n\
  \n请记住，箭头函数是匿名的，看这个例子：\n\n```\n// 这样不行，你需要一个键来访问函数 const person1 =  { () =>  console.log(\"\
  Hello\"), }; const person2 =  { greet: () =>  console.log(\"Hello\"), } person2.greet()\
  \ // Hello\n```\n\n## 动态定义对象的属性\n\n在 ES5 中，我们这样动态定义对象的属性：\n\n```\nvar name =  \"\
  myname\"; // 创建空对象 var person =  {} // 更新对象 person[name] =  \"Alberto\"; console.log(person.myname);\
  \ // Alberto\n```\n\n在上面的例子中，我们先创建了对象，然后修改了它。然而，在 ES6 中，我们可以同时完成这两件事。请看下面的例子：\n\n\
  ```\nconst name =  \"myname\"; const person =  { [name]:\"Alberto\", }; console.log(person.myname);\
  \ // Alberto\n```\n\n## 第 10 章末测验\n\n### 10.1 重构代码使其更简洁：\n\n```\nconst animal =\
