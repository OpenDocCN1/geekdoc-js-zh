- "# 现代 JavaScript 完整指南\n\n# 引言\n\n本书最初于 2018 年出版，是数月自学 JavaScript 的成果，旨在帮助那些希望将技能更新到最新\
  \ ECMAScript 规范的 JavaScript 开发者。\n\n我对这个成果感到非常自豪，但与此同时，我也觉得这本书缺少了一些东西。它并不适合这门语言的新手。\n\
  \n2019 版解决了第一版的问题，并进行了扩展，同时面向 JavaScript 开发者和完全初学者。\n\n这就是为什么我增加了一个全新的章节，专门向初学者介绍\
  \ JavaScript。\n\n另一个新增内容是 TypeScript 部分。经过一年的 TypeScript 工作实践，我可以肯定地说，它是每个 JavaScript\
  \ 开发者必备的知识，而且我认为即使是初学者也应该尝试将其应用到自己的工作流程中。\n\n本书的免费版本可以在 Github 上找到：https://github.com/AlbertoMontalesi/The-complete-guide-to-modern-JavaScript\n\
  \n在那里你可以找到本书的核心章节，这些章节将随着每个新版本的 ECMAScript 进行更新。\n\n# 关于我￼![Alberto_Montalesi.jpg](img/Alberto_Montalesi.jpg)\n\
  \n我叫 Alberto Montalesi，来自意大利，目前在越南担任软件开发人员，负责企业级软件的开发。\n\n我对编程的热情开始得比较晚，2016 年，在我\
  \ 24 岁获得法学学士学位之后。\n\n成为一名自学成才的软件开发者的道路并不容易，但我绝对愿意再来一次。\n\n你可以在 DevTo 上通过这个链接阅读我的故事：https://dev.to/albertomontalesi/my-journey-from-esl-teacher-to-software-developer-5h30。\n\
  \n写一本能够帮助其他有抱负的开发者的书让我充满自豪，因为我深知找到继续学习和提升技能的动力与资源是多么困难。\n\n除了编程，我的其他爱好还包括摄影、旅行和游戏。\n\
  \n## 联系我\n\n如果你想就任何形式的合作或讨论与我联系，可以在以下平台找到我：\n\n1.  [Twitter](https://twitter.com/montalesi)\n\
  1.  [DevTo](https://dev.to/albertomontalesi) 访问 https://dev.to/albertomontalesi\n\
  1.  [Github](https://github.com/AlbertoMontalesi) 访问 https://github.com/AlbertoMontalesi\n\
  1.  [InspiredWebDev](https://inspiredwebdev.com) 我的个人博客 https://inspiredwebdev.com\n\
  \n## 贡献与捐赠\n\n当然，非常感谢你做出的任何贡献。\n\n如果你喜欢我的内容，并想请我喝杯咖啡，可以访问 [`www.paypal.me/albertomontalesi`](https://www.paypal.me/albertomontalesi)。\n\
  \n## 许可协议\n\n￼![图：知识共享许可协议](img/rId30.png)\n\n本作品采用知识共享署名-非商业性使用-禁止演绎 4.0 国际许可协议进行许可。\n\
  \n# 设置你的环境\n\n如果你已经在电脑上安装了代码编辑器，并且已经知道如何使用 Chrome 开发者工具或类似工具，那么你可以跳过本章，继续往下看。\n\n\
  为了让你能够尝试本书中将要使用的代码，我建议你下载一个代码编辑器，用来编写和运行我们将要讨论的 JavaScript 代码。\n\n我个人选择的是 Visual\
  \ Studio Code，由微软开发，可在此处免费获取：https://code.visualstudio.com/\n\n其他替代方案包括：\n\n1. \
  \ Atom：https://atom.io/\n1.  Sublime Text：https://www.sublimetext.com/\n\n无论你选择哪一个，它们都能满足你的需求。\n\
  \n安装完成后，你只需打开软件，创建一个新文件并将其保存为 .js 扩展名，你就拥有了第一个 JavaScript 文件。\n\n我们要看的第二件事是开发者工具。\n\
  \n打开浏览器访问任意页面，在某个位置右键单击。你会看到一组选项，其中一个是“检查”或“检查元素”。点击它，就会打开开发者工具，你可以用它查看网页代码、尝试 JavaScript\
  \ 或调试你的应用程序。\n\nChrome 开发者工具的外观如下所示。\n\n| ￼![developer-tools.png](img/developer-tools.png)\
  \ |\n\n第一个标签页“Elements”可以让你查看正在检查的页面的代码，第二个标签页“Console”则是你可以编写 JavaScript 并进行实验的地方。\n\
  \n| ￼![developer-tools2.png](img/developer-tools2.png) |\n\n我在这里做的是定义一个变量并调用它。你将在下一章中学习变量以及更多内容，届时我将向你介绍\
  \ JavaScript 的基础知识。\n\n# JavaScript 基础\n\nJavaScript 是一种由 Brendan Eich 于 1995 年创建的编程语言，它使网页具有交互性，并且是\
  \ Web 应用程序的重要组成部分。\n\n如果你想了解更多关于这门语言的历史及其名称，我建议你阅读 Medium.com 上的这篇简短文章 `medium.com/@benastontweet/lesson-1a-the-history-of-javascript-8c1ce3bffb17`\
  \ 。\n\n如果你曾经打开过 Chrome 开发者工具或类似工具，你可能已经见过 JavaScript 是如何插入到 HTML 页面中的。\n\n我们通过使用\
  \ script 标签来实现，要么将 JavaScript 代码直接写在标签内部，要么引用一个外部文件。\n\n写在 script 标签内部的代码：\n\n```\n\
  <script type=\"text/javascript\"> [YOUR_SCRIPT_HERE] </script>\n```\n\n引用外部文件：\n\
  \n```\n<script src=\"/home/script.js\"></script>\n```\n\n当然，你可以添加任意数量的脚本，也可以同时使用相对路径、绝对路径和完整路径，例如：\n\
  \n```\n<!-- 从项目根目录开始的绝对路径 --> <script src=\"/home/script.js\"></script>\n<!-- 相对于当前文件夹的路径\
  \ --> <script src=\"script.js\"></script>\n<!-- jQuery 库的完整 URL --> <script src=\"\
  https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/core.js\"></script>\n```\n\n\
  最好不要将代码写在 script 标签内部，而是将其放在单独的文件中，这样浏览器可以缓存它，无论有多少文件引用它，都只需下载一次。这些文件将使用缓存版本，从而提高性能。\n\
  \n## 变量\n\n我们使用变量来存储值，这些值可以是用户名、地址或电子商务网站上的商品等任何内容。\n\n在 ES6（ES2015）之前，我们声明变量的方式是：\n\
  \n```\nvar username =  \"Alberto Montalesi\"\n```\n\n现在，在声明变量时，我们还有另外两种选择：\n\n```\n\
  let username =  \"Alberto Montalesi\" const username =  \"Alberto Montalesi\"\n\
  ```\n\n我们将在第 1 章中深入探讨这三个关键字之间的区别，但让我先给你一个简单的解释。\n\n使用关键字 const 创建的变量，顾名思义，是常量，意味着它们不能被覆盖。\n\
  \n打开你的 Chrome 开发者工具，尝试输入以下内容：\n\n```\nconst age =  26; age =  27; // Uncaught TypeError:\
  \ Assignment to constant variable\n```\n\n如你所见，我们不允许给常量赋新值。\n\n另一方面，如果我们这样做：\n\n\
  ```\nlet height =  190; height =  189\n```\n\n这次没有报错，let 可以被重新赋值，类似于旧的 var 关键字。\n\
  \n如果 var 和 let 都可以被重新赋值，那么为什么我们应该使用 let 而不是 var 呢？这个问题的答案需要对 JavaScript 的工作原理进行更多解释，将在第\
  \ 1 章后面讨论。\n\n很多人争论 let 和 const 的最佳实践是什么。我的看法是：始终使用 const，除非你事先知道需要重新赋值。\n\n\n\n\
  \n如果之后你需要重新赋值某个 `const` 变量，只需将其改为 `let` 即可。就我个人而言，我倾向于默认使用 `const`。这样，如果我意外尝试重新赋值，就会看到错误，而不必在之后调试代码才发现引用了错误的变量。\n\
  \n### 关于变量命名的注意事项\n\n在命名变量时，有一些规则需要遵守。不过别担心，大多数规则都很容易记住。\n\n以下都是禁止的：\n\n```\n//\
  \ 变量名不能以数字开头 let 1apple =  \"one apple\"; // 变量名不能包含空格、符号和标点等字符 let hello!  =  \"\
  hello!\";\n```\n\n还有一些保留字不能用作变量名和函数名。\n\n|   |   |   |   |\n|---|---|---|---|\n\
  | abstract | arguments | await | boolean |\n| break | byte | case | catch |\n| char\
  \ | class | const | continue |\n| debugger | default | delete | do |\n| double |\
  \ else | enum | eval |\n| export | extends | false | final |\n| finally | float\
  \ | for | function |\n| goto | if | implements | import |\n| in | instanceof | int\
  \ | interface |\n| let | long | native | new |\n| null | package | private | protected\
  \ |\n| public | return | short | static |\n| super | switch | synchronized | this\
  \ |\n| throw | throws | transient | true |\n| try | typeof | var | void |\n| volatile\
  \ | while | with | yield |\n\n选择变量名时的经验法则是让它们具有描述性。\n\n避免使用首字母缩写、缩写和无意义的名称。\n\n\
  ```\n// 不好 let cid =  12;  // `cid` 是什么？ // 好 let clientID =  12;  // 哦，是 `client\
  \ id` // 不好 let id =  12  // 什么 id？userID？dogID？catID？ // 好 let userID =  12  //\
  \ 具体一点\n```\n\n如果你希望变量名尽可能具有描述性，那么它们很可能是由多个单词组成的。\n\n在这种情况下，最常见的两种变量命名方式是 camelCase\
  \ 和 snake_case。\n\n```\n// 不好 let lastloggedin =  ''  // 难以阅读 // 好 let lastLoggedIn\
  \ =  ''  // camelCase let last_logged_in =  ''  // snake_case\n```\n\n无论你选择使用 camelCase（首单词后每个单词首字母大写）还是\
  \ snake_case（单词之间用下划线分隔），请记住保持一致并坚持你的选择。\n\n## 数据类型\n\nJavaScript 是一种动态语言，这意味着与静态语言相反，你在定义变量时无需定义其类型。\n\
  \n```\n// 这是字符串还是数字？ var userID; userID =  12;  // 现在是数字 console.log(typeof userID);\
  \  // number userID =  'user1'  // 现在是字符串 console.log(typeof userID);  // string\n\
  ```\n\n这起初可能看起来很便捷，但在处理较大项目时可能会引发问题。\n\n在本书末尾，当你掌握了 JavaScript 的基础知识后，我将向你介绍 TypeScript，它为\
  \ JavaScript 增加了强类型。\n\n在 JavaScript 中，有 7 种数据类型：6 种原始类型和 `Object`。\n\n### 原始类型\n\
  \n原始值是一种简单的数据，它不是 `Object`，也没有方法。\n\n它们是：\n\n1. `string`\n1. `number`\n1. `boolean`\n\
  1. `null`\n1. `undefined`\n1. `symbol`（最新添加的）\n\n让我们快速浏览一下它们，如果你有编程经验，可能已经了解其中一些。\n\
  \n`string` 用于表示文本数据，无论是名称、地址还是书籍的章节。\n\n```\nlet userName =  \"Alberto\"; console.log(userName)\
  \ // Alberto\n```\n\n`number` 用于表示数值。\n\n在 JavaScript 中，没有专门用于整数的类型。\n\n```\nlet\
  \ age =  25;\n```\n\n`boolean` 用于表示值为 `true` 或 `false` 的数据。\n\n```\nlet married\
  \ =  false;\n```\n\n`null` 表示值的缺失，而 `undefined` 表示未定义的值。\n\n`symbol` 表示唯一且不可变的值。它是在\
  \ ES2015 中添加的，是该列表中最新的成员。\n\n我们将在第 11 章中更详细地了解它。\n\n### 对象\n\n虽然我们之前讨论的 6 种原始类型只能保存单个值（无论是\
  \ `null`、`true`、`false` 等），但 `Object` 用于存储属性的集合。\n\n让我们先看一个简单的 `Object`：\n\n```\n\
  const car =  { wheels:  4, color:  \"red\", }\n```\n\n这是一个简单的 `Object`，我用来存储我的汽车的属性。\n\
  \n每个属性都有一个键（在第一行中是 `wheels`）和一个值（在本例中是 4）。\n\n键的类型是 `string`，但值可以是任何类型，也可以是函数，在这种情况下我们称它们为方法。\n\
  \n```\nconst car =  { wheels:  4, color:  \"red\", drive:  function(){ console.log(\"\
  wroom wroom\") } } console.log(Object.keys(car)[0]) // wheels console.log(typeof\
  \  Object.keys(car)[0]) // string car.drive(); // wroom wroom\n```\n\n如你所见，我们现在可以在\
  \ `car` 对象上调用 `drive` 函数。\n\n别担心，我们将在下一章中更详细地介绍函数。\n\n### 创建空对象\n\n我们在创建 `Object`\
  \ 时不必声明属性。\n\n以下是创建空 `Object` 的两种方法：\n\n```\nconst car =  new  Object() const car\
  \ =  {}\n```\n\n更常用的语法是第二种，称为对象字面量。\n\n现在你有了一个新的空汽车对象，要为其添加新属性，只需这样做：\n\n```\ncar.color\
  \  =  'red'; console.log(car) // {color: \"red\"}\n```\n\n如你所见，我们使用点表示法向 `car` 对象添加新属性。\n\
  \n如何访问 `Object` 上的属性呢？\n\n非常简单，我们有两种选择：\n\n```\nconst car =  { wheels:  4, color:\
  \  \"red\", } console.log(car.wheels); // 4 console.log(car['color']); // 'red'\n\
  ```\n\n我们有两种不同的方式来做同一件事？为什么？\n\n嗯，它们并不完全相同。\n\n对于多词属性，我们不能使用点表示法。\n\n```\nconst\
  \ car =  { wheels:  4, color:  \"red\", \"goes fast\":  true } console.log(car.goes\
  \ fast); // 语法错误 console.log(car['goes fast']) // true\n```\n\n当你想要使用多词属性时，需要记得用引号将它们的名称括起来，并且只能使用方括号表示法来访问它们。\n\
  \n方括号表示法的另一个用途是通过键来访问 `Object` 的属性。\n\n假设我们的应用程序接收用户的输入，然后将其保存到一个变量中，该变量将用于访问我们的对象。\n\
  \n用户正在寻找汽车，并且被要求告诉我们他/她喜欢的品牌。该品牌是一个键，我们将用它来仅显示相应的型号。\n\n为简单起见，在示例中每个品牌只有一个型号。\n\n\
  ```\nconst cars =  { ferrari:  \"california\", porsche:  \"911\", bugatti:  \"veyron\"\
  , } // 用户输入 const key =  \"ferrari\" console.log(cars.key); // undefined console.log(cars['key']);\
  \ // undefined console.log(cars[key]); // california\n```\n\n如你所见，我们需要使用方括号表示法通过存储在变量中的键来访问\
  \ `Object` 的属性。\n\n注意，`key` 周围没有引号，因为它是一个变量名，而不是字符串。\n\n### 复制对象\n\n与原始类型不同，对象是通过引用复制的，这意味着如果我们写：\n\
  \n```\nlet car =  { color:  'red' } let secondCar = car;\n```\n\n我们的 `secondCar`\
  \ 只会存储一个引用，即 `car` 的“地址”，而不是 `Object` 本身。\n\n看看这个例子就更容易理解了：\n\n```\nlet car =  {\
  \ color:  'red' } let secondCar = car; car.wheels  =  4 console.log(car); // {color:\
  \ 'red', wheels: 4} console.log(secondCar); // {color: 'red', wheels: 4}\n```\n\n\
  如你所见，`secondCar` 只是存储了对 `car` 的引用，因此当我们修改 `car` 时，`secondCar` 也发生了变化。\n\n如果我们比较这两个对象，会发现一些有趣的事情：\n\
  \n```\nconsole.log(car == secondCar); // true console.log(car === secondCar); //\
  \ true\n```\n\n无论我们使用相等（`==`）还是严格相等（`===`），都会得到 `true`，这意味着这两个对象是同一个。\n\n只有对同一个\
  \ `Object` 进行比较时才会返回 `true`。\n\n\n\n\n看看空对象和具有相同属性的对象之间的比较。\n\n```\nconst emptyObj1\
  \ =  {}; const emptyObj2 =  {}; emptyObj1 == emptyObj2; // false emptyObj1 === emptyObj2;\
  \ // false const obj1 =  {a:  1}; const obj2 =  {a:  1}; obj1 == obj2; // false\
  \ obj1 === obj2; // false\n```\n\n如你所见，只有同一个对象的比较才会返回 `true`。\n\n在 JavaScript 中快速克隆一个对象的方法是使用\
  \ `Object.assign`。\n\n```\nconst car =  { color:'red' }\nconst secondCar =  Object.assign({},\
  \ car)\ncar.wheels  =  4;\nconsole.log(car); // {color: 'red', wheels: 4}\nconsole.log(secondCar);\
  \ // {color: 'red'}\n```\n\n更新 `car` 并没有影响 `secondCar`。`Object.assign` 将目标对象作为第一个参数，源对象作为第二个参数。\n\
  \n在我们的例子中，我们使用一个空对象作为目标，`car` 作为源。\n\n如果你准备好更深入地了解 JavaScript 中对象的复制，我推荐你阅读 [Scotch.io](https://scotch.io/bar-talk/copying-objects-in-javascript)\
  \ 上的这篇文章，链接为 [`scotch.io/bar-talk/copying-objects-in-javascript`](https://scotch.io/bar-talk/copying-objects-in-javascript)。\n\
  \n### 数组\n\n正如我们所见，对象以键值对的形式存储数据。现在我们来看看什么是数组。\n\n数组是一种按顺序存储值的对象。\n\n在上面的例子中，我们使用对象来存储汽车，因为它具有特定的属性，我们希望可以通过键轻松访问这些属性。\n\
  \n如果我们只是想存储一个列表，那么就没有必要创建对象。相反，我们可以使用数组。\n\n例如：\n\n```\nconst fruitBasket = ['apple','banana','orange']\n\
  ```\n\n我们通过索引访问数组的值。记住数组从位置 0 开始。\n\n```\nconst fruitBasket = ['apple','banana','orange']\n\
  console.log(fruitBasket[0]) // apple\nconsole.log(fruitBasket[1]) // banana\nconsole.log(fruitBasket[2])\
  \ // orange\n```\n\n我们可以对数组调用许多方法。让我们看看一些最常用的方法。\n\n```\nconst fruitBasket = ['apple','banana','orange'];\n\
  // 获取数组的长度\nconsole.log(fruitBasket.length); // 3\n// 在数组末尾添加一个新值\nfruitBasket.push('pear')\n\
  console.log(fruitBasket); // [\"apple\", \"banana\", \"orange\", \"pear\"]\n// 在数组开头添加一个新值\n\
  fruitBasket.unshift('melon')\nconsole.log(fruitBasket); // [\"melon\", \"apple\"\
  , \"banana\", \"orange\", \"pear\"]\n// 从数组末尾移除一个值\nfruitBasket.pop()\nconsole.log(fruitBasket);\
  \ // [\"melon\", \"apple\", \"banana\", \"orange\"]\n// 从数组开头移除一个值\nfruitBasket.shift()\n\
  console.log(fruitBasket); // [\"apple\", \"banana\", \"orange\"]\n```\n\n正如我们所见，通过这些方法，我们可以轻松地在数组的开头或末尾添加和删除元素。\n\
  \n你可以在 [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)\
  \ 上找到更完整的方法列表，链接为 [`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)。\n\
  \n### 使用 typeof 确定类型\n\n我们可以使用 `typeof` 来确定变量的值。例如：\n\n```\nconst str =  \"hello\"\
  \ntypeof(str); // string\nconst num =  12\ntypeof(num) // number\nconst arr = [1,2,3]\n\
  typeof(arr) // object\nconst obj =  {prop:  'value'}\ntypeof(obj) // object\n```\n\
  \n记住 `Array` 不是一种类型，数组是对象！\n\n到目前为止一切看起来都很直接，但如果我们尝试这样的操作呢：\n\n```\ntypeof(null)\n\
  ```\n\n我们知道 `null` 是一种原始类型，那么我们应该期望看到 `null` 作为结果吗？\n\n```\ntypeof(null) // object\n\
  ```\n\n长话短说，这是 JavaScript 最初实现中的一个 bug。如果你想了解更多，[这篇文章](http://2ality.com/2013/10/typeof-null.html)\
  \ 提供了很好的解释（[`2ality.com/2013/10/typeof-null.html`](http://2ality.com/2013/10/typeof-null.html)）。\n\
  \n## 函数\n\n函数是我们用来执行各种任务和计算的一个非常重要的工具。\n\n在 JavaScript 中，我们可以用不同的方式声明函数。\n\n让我们看看一个函数定义：\n\
  \n```\nfunction  greet(name){\n  console.log(\"hello \"  + name);\n}\ngreet(\"Alberto\"\
  ) // hello Alberto\n```\n\n这是一个简单的函数，调用时会输出一个字符串。\n\n第 1 行括号内的变量称为参数，而花括号内的代码是语句，在这个例子中是一个简单的\
  \ `console.log()`。\n\n需要记住的一个非常重要的事情是：原始类型是按值传递给函数的，这意味着对这些值的修改不会全局反映出来。另一方面，如果值不是原始类型，比如对象或数组，那么它是按引用传递的，这意味着对它的任何修改都会反映在原始对象中。\n\
  \n```\nlet myInt =  1;\nfunction  increase(value){\n  return value +=1;\n}\nconsole.log(myInt);\
  \ // 1\nconsole.log(increase(myInt)); // 2\nconsole.log(myInt); // 1\n```\n\n如你所见，我们增加了整数的值，但这并没有影响原始变量。\n\
  \n让我们看一个对象的例子。\n\n```\nlet myCar =  { make:  \"bmw\", color:  \"red\" }\nconsole.log(myCar)\
  \ // {make: \"bmw\", color: \"red\"}\nfunction  changeColor(car){\n  car.color \
  \ =  \"blue\"\n}\nchangeColor(myCar)\nconsole.log(myCar) // {make: \"bmw\", color:\
  \ \"blue\"}\n```\n\n如你所见，由于参数 `car` 只是对象 `myCar` 的一个引用，修改它导致了 `myCar` 对象的改变。\n\n\
  另一种声明函数的方式是使用函数表达式。\n\n```\nconst greeter =  function  greet(name){\n  console.log(\"\
  hello \"  + name);\n}\ngreeter(\"Alberto\") // hello Alberto\n```\n\n这里我们将函数 `greet`\
  \ 赋值给一个名为 `greeter` 的常量。\n\n我们得到了与第一个例子相同的结果，但使用函数表达式我们还可以创建匿名函数。\n\n```\nconst\
  \ greeter =  function(name){\n  console.log(\"hello \"  + name);\n}\ngreeter(\"\
  Alberto\") // hello Alberto\n```\n\n我们将 `function greet` 改为 `function`，得到了一个匿名函数。\n\
  \n我们还可以进一步调整，使用 ES2015 引入的箭头函数。\n\n```\nconst greeter = (name) =>  {\n  console.log(\"\
  hello \"  + name);\n}\ngreeter(\"Alberto\") // hello Alberto\n```\n\n`function`\
  \ 关键字消失了，参数后面出现了一个漂亮的胖箭头（`=>`）。\n\n我们将在第 2 章详细讨论箭头函数。\n\n## 理解函数作用域和 this 关键字\n\n\
  在 JavaScript 中需要理解的最重要的概念之一就是作用域。\n\n什么是作用域？\n\n变量的作用域控制着该变量可以从哪里被访问。\n\n我们可以有全局作用域，意味着变量可以从代码中的任何位置访问；也可以有块级作用域，意味着变量只能从声明它的块内部访问。\n\
  \n块可以是一个函数、一个循环或任何由花括号分隔的内容。\n\n让我们看两个例子，首先使用关键字 `var`。\n\n```\nvar myInt =  1;\n\
  if(myInt ===  1){\n  var mySecondInt =  2\n  console.log(mySecondInt); // 2\n}\n\
  console.log(mySecondInt); // 2\n```\n\n如你所见，我们能够在块作用域之外访问 `mySecondInt` 的值，因为使用关键字\
  \ `var` 声明的变量不受块作用域的约束。\n\n现在让我们使用关键字 `let`。\n\n```\nvar myInt =  1;\nif(myInt ===\
  \  1){\n  let mySecondInt =  2\n  console.log(mySecondInt); // 2\n}\nconsole.log(mySecondInt);\
  \ // Uncaught ReferenceError: mySecondInt is not defined\n```\n\n这次我们无法从块作用域外部访问该变量，并得到了一个错误\
  \ `mySecondInt is not defined`。\n\n使用关键字 `let` 或 `const` 声明的变量受限于它们被声明的块作用域。\n\n\
  你将在第 1 章中了解更多关于它们的内容。\n\n### this 关键字\n\n我想讨论的第二个重要概念是 `this` 关键字。\n\n让我们先从一个简单的例子开始：\n\
  \n```\nconst myCar =  {\n  color:  'red',\n  logColor:  function(){\n    console.log(this.color)\n\
  \  }\n}\nmyCar.logColor(); // red\n```\n\n如你在本例中所见，不言而喻，`this` 关键字指向了 `myCar` 对象。\n\
  \n\n\n`this` 的值取决于函数的调用方式。\n\n在上面的例子中，函数是作为 `Object` 的方法被调用的。\n\n请看另一个例子：\n\n```\n\
  function  logThis(){ console.log(this); } logThis(); // Window {...}\n```\n\n我们在全局上下文中调用了这个函数，因此\
  \ `this` 的值指向了 `Window` `Object`。\n\n我们可以通过开启严格模式来避免意外地引用 `Window` `Object`。\n\n\
  你可以在 JavaScript 文件的开头写上 `'use strict';` 来实现这一点。\n\n这样做会启用一套更严格的 JavaScript 规则，其中一条规则是将全局对象的值设置为\
  \ `undefined` 而不是 `Window` `Object`，从而导致我们的 `this` 关键字也变成 `undefined`。\n\n如果我们想手动将\
  \ `this` 的值设置为某个内容，可以使用 `.bind`。\n\n```\nconst myCar =  { color:  'red', logColor:\
  \  function(){ console.log(this.color) } } const unboundGetColor =  myCar.logColor;\
  \ console.log(unboundGetColor()) // undefined const boundGetColor =  unboundGetColor.bind(myCar)\
  \ console.log(boundGetColor()) // red\n```\n\n我们来梳理一下刚才的操作：\n\n1.  首先，我们创建了一个 `Object`，与之前的例子类似。\n\
  \n1.  我们将 `unboundGetColor` 设置为 `myCar` 的方法。\n\n1.  当我们尝试调用 `unboundGetColor` 时，它会尝试查找\
  \ `this.color`，但由于它在全局上下文中被调用，`this` 的值是 `Window` `Object`，而它上面没有 color，因此我们得到 `undefined`。\n\
  \n1.  最后，我们使用 `.bind` 来明确告诉 `boundGetColor`，`this` 关键字将指向括号内的 `Object`，在本例中是 `myCar`。\n\
  \n1.  当我们调用 `boundGetColor` 时，可以看到这次我们得到了想要的结果。\n\n还有另外两种方法可以用来设置 `this` 关键字的值：`.call()`\
  \ 和 `.apply()`。\n\n它们两者相似之处在于，这两个方法都会使用给定的 `this` 值来调用一个函数。它们接受的参数略有不同。\n\n`.call()`\
  \ 接受一个参数列表，而 `.apply()` 接受一个参数数组。\n\n请看这个使用 `.call()` 的例子：\n\n```\nfunction  Car(make,color){\
  \ this.carMake  = make; this.carColor  = color; } function  MyCar(make,color){ Car.call(this,make,color)\
  \ this.age  =  5 } const myNewCar =  new  MyCar('bmw','red') console.log(myNewCar.carMake)\
  \ // bmw console.log(myNewCar.carColor) // red\n```\n\n我们将 `MyCar` `Object` 传入 `.call()`，这样\
  \ `this.carMake` 就会被设置为传递给 `MyCar` 的参数 make。color 同理。\n\n请看这个使用 `.apply()` 的例子，以了解两者之间的区别。\n\
  \n```\nfunction  Car(make,color){ this.carMake  = make; this.carColor  = color;\
  \ } function  MyCar(make,color){ Car.apply(this,[make,color]) this.age  =  5 } const\
  \ myNewCar =  new  MyCar('bmw','red') console.log(myNewCar.carMake) // bmw console.log(myNewCar.carColor)\
  \ // red\n```\n\n如你所见，结果相同，但在这个例子中 `.apply()` 接受一个包含参数列表的数组。\n\n两者之间的主要区别在于，当你编写一个不需要知道或不知道所需参数数量的函数时，就会体现出来。\n\
  \n在这种情况下，由于 `.call()` 要求你逐个传递参数，这样做就会变得很麻烦。\n\n解决方案是使用 `.apply()`，因为你只需传递数组，无论它包含多少个参数，都会在函数内部被解包。\n\
  \n```\nconst ourFunction =  function(item, method, args){ method.apply(args) } ourFunction(item,method,\
  \ ['argument1',  'argument2']) ourFunction(item,method, ['argument1',  'argument2',\
  \  'argument3'])\n```\n\n无论我们传递多少个参数，当调用 `.apply()` 时，它们都会被逐个应用。\n\n## JavaScript\
  \ 基础测验\n\n### JS-01 以下哪种变量命名方式是错误的？\n\n![bullet](img/bullet_nb_square-blk.png)`var\
  \ very_important = \"very_important\"`\n\n![bullet](img/bullet_nb_square-blk.png)`var\
  \ important_999 = \"important_999\"`\n\n![bullet](img/bullet_nb_square-blk.png)`var\
  \ important! = \"important!\"`\n\n![bullet](img/bullet_nb_square-blk.png)`var VeRY_ImP_orTant\
  \ = \"VeRY_ImP_orTant\"`\n\n### JS-02 以下哪个不是真正的原始类型？\n\n![bullet](img/bullet_nb_square-blk.png)`symbol`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`boolean`\n\n![bullet](img/bullet_nb_square-blk.png)`null`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`Object`\n\n### JS-03 定义对象的正确方式是什么？\n\n\
  ![bullet](img/bullet_nb_square-blk.png)`const car: { color: \"red\"}`\n\n![bullet](img/bullet_nb_square-blk.png)`const\
  \ car = {color = \"red\"}`\n\n![bullet](img/bullet_nb_square-blk.png)`const car\
  \ = { color: \"red\" }`\n\n![bullet](img/bullet_nb_square-blk.png)`const car: {color\
  \ = \"red\"}`\n\n### JS-04 以下代码的正确输出是什么？\n\n```\nconst obj1 =  {a:  1}; const obj2\
  \ =  {a:  1}; console.log(obj1 === obj2);\n```\n\n![bullet](img/bullet_nb_square-blk.png)`true`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`undefined`\n\n![bullet](img/bullet_nb_square-blk.png)`false`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`null`\n\n### JS-05 以下代码的正确输出是什么？\n\n```\n\
  const fruitBasket = ['apple','banana','orange']; fruitBasket.unshift('melon') console.log(fruitBasket);\n\
  ```\n\n![bullet](img/bullet_nb_square-blk.png)`[\"apple\", \"banana\", \"orange\"\
  , \"melon\"]`\n\n![bullet](img/bullet_nb_square-blk.png)`[\"melon\"]`\n\n![bullet](img/bullet_nb_square-blk.png)`[\"\
  apple\", \"banana\", \"orange\", \"pear\", \"melon\"]`\n\n![bullet](img/bullet_nb_square-blk.png)`[\"\
  melon\", \"apple\", \"banana\", \"orange\"]`\n\n# 第 1 章：Var vs Let vs Const 与暂时性死区\n\
  \n随着 ES6 中 `let` 和 `const` 的引入，我们现在可以根据需求更好地定义变量。在 JavaScript 入门中，我们了解了这三个关键字的基本区别，现在我们将更详细地探讨。\n\
  \n## Var\n\n使用 `var` 关键字声明的变量是函数作用域的，这意味着如果我们在 for 循环（这是一个块级作用域）内部声明它们，它们即使在循环外部也是可用的。\n\
  \n```\nfor (var i =  0; i <  10; i++) { var leak =  \"I am available outside of\
  \ the loop\"; } console.log(leak); // I am available outside of the loop function\
  \  myFunc(){ var functionScoped =  \"I am available inside this function\"; console.log(functionScoped);\
  \ } myFunc(); // I am available inside this function console.log(functionScoped);\
  \ // ReferenceError: functionScoped is not defined\n```\n\n在第一个例子中，`var` 的值泄漏到了块级作用域之外，可以从外部访问；而在第二个例子中，`var`\
  \ 被限制在函数作用域内，我们无法从外部访问它。\n\n## Let\n\n使用 `let`（和 `const`）关键字声明的变量是块级作用域的，这意味着它们只在其声明的块及其子块中可用。\n\
  \n```\n// 使用 `let` let x =  \"global\"; if (x ===  \"global\") { let x =  \"block-scoped\"\
  ; console.log(x); // 预期输出: block-scoped } console.log(x); // 预期输出: global // 使用\
  \ `var` var y =  \"global\"; if (y ===  \"global\") { var y=  \"block-scoped\";\
  \ console.log(y); // 预期输出: block-scoped } console.log(y); // 预期输出: block-scoped\n\
  ```\n\n如你所见，当我们在块级作用域内给用 `let` 声明的变量赋新值时，它并没有改变外部作用域中的值。而当我们对用 `var` 声明的变量做同样操作时，它泄漏到了块级作用域之外，并且也改变了外部作用域中的值。\n\
  \n## Const\n\n与 `let` 类似，用 `const` 声明的变量也是块级作用域的，但不同之处在于，它们的值不能通过重新赋值来改变，也不能被重新声明。\n\
  \n```\nconst constant =  'I am a constant'; constant =  \" I can't be reassigned\"\
  ; // Uncaught TypeError: Assignment to constant variable\n```\n\n重要提示：\n\n这并不意味着用\
  \ `const` 声明的变量是不可变的。\n\n### `const` 的内容是一个 `Object`\n\n```\nconst person =  { name:\
  \  'Alberto', age:  25, } person.age  =  26; console.log(person.age); // 26\n```\n\
  \n\n\n\n\n在这种情况下，我们并没有重新赋值整个变量，而只是修改了它的一个属性，这是完全可行的。\n\n![Rectangle](img/image.png)\n\
  \n注意：我们仍然可以冻结 `const` 对象，这样就不会改变对象的内容（但尝试修改对象的值时，JavaScript 不会抛出任何错误）。\n\n```\n\
  const person = { name: 'Alberto', age: 25, }\nperson.age = 26;\nconsole.log(person.age);\
  \ // 26\nObject.freeze(person)\nperson.age = 30;\nconsole.log(person.age); // 26\n\
  ```\n\n## 暂时性死区\n\n现在我们将探讨一个非常重要的概念，它的名字听起来可能很复杂，但我向你保证并非如此。\n\n首先来看一个简单的例子：\n\n\
  ```\nconsole.log(i);\nvar i = \"I am a variable\"; // 预期输出：undefined\nconsole.log(j);\n\
  let j = \"I am a let\"; // 预期输出：ReferenceError: can't access lexical declaration\
  \ `j' before initialization\n```\n\n`var` 可以在定义之前被访问，但我们无法访问它们的值。`let` 和 `const`\
  \ 在定义之前不能被访问。\n\n尽管你可能会在其他资料上看到不同的说法，但 `var` 和 `let`（以及 `const`）都会受到**提升**的影响，这意味着它们在任何代码执行之前就会被处理，并被提升到其作用域（无论是全局还是块级作用域）的顶部。\n\
  \n主要区别在于：`var` 仍然可以在定义之前被访问，这会导致其值为 `undefined`。而 `let` 则会让变量处于**暂时性死区**，直到它们被声明为止。因此，在初始化之前访问它们会引发错误，这比得到\
  \ `undefined` 结果更容易调试代码。\n\n## 何时使用 Var、Let 和 Const\n\n并没有规定必须使用哪一个，人们也有不同的看法。这里我将介绍\
  \ JavaScript 社区中两位知名开发者的观点。\n\n第一个观点来自 [Mathias Bynes：](https://mathiasbynens.be/notes/es6-const)\n\
  \n1. 默认使用 `const`\n2. 仅在需要重新绑定时使用 `let`\n3. 在 ES6 中不应使用 `var`\n\n第二个观点来自 [Kyle Simpson：](https://me.getify.com/)\n\
  \n1. 对于跨多个（尤其是较大）作用域共享的顶层变量，使用 `var`\n2. 对于较小作用域中的局部变量，使用 `let`\n3. 只有在编写了一些代码后，并且你相当确定不应该有变量重新赋值的情况下，才将\
  \ `let` 重构为 `const`\n\n选择哪种观点完全取决于你。一如既往，请自行研究并找出你认为最佳的方式。\n\n我个人观点是默认始终使用 `const`，如果发现需要重新绑定值，再改用\
  \ `let`。\n\n## 第一章小测验\n\n### 1.1 以下代码的正确输出是什么？\n\n```\nvar greeting = \"Hello\"\
  ;\ngreeting = \"Farewell\";\nfor (var i = 0; i < 2; i++) {\n  var greeting = \"\
  Good morning\";\n}\nconsole.log(greeting);\n```\n\n![bullet](img/bullet_nb_square-blk.png)Hello\n\
  \n![bullet](img/bullet_nb_square-blk.png)Good morning\n\n![bullet](img/bullet_nb_square-blk.png)Farewell;\n\
  \n### 1.2 以下代码的正确输出是什么？\n\n```\nlet value = 1;\nif(true) {\n  let value = 2;\n \
  \ console.log(value);\n}\nvalue = 3;\n```\n\n![bullet](img/bullet_nb_square-blk.png)1\n\
  \n![bullet](img/bullet_nb_square-blk.png)2\n\n![bullet](img/bullet_nb_square-blk.png)3\n\
  \n### 1.3 以下代码的正确输出是什么？\n\n```\nlet x = 100;\nif (x > 50) {\n  let x = 10;\n}\n\
  console.log(x);\n```\n\n![bullet](img/bullet_nb_square-blk.png)10\n\n![bullet](img/bullet_nb_square-blk.png)100\n\
  \n![bullet](img/bullet_nb_square-blk.png)50\n\n### 1.4 以下代码的正确输出是什么？\n\n```\nconsole.log(constant);\n\
  const constant = 1;\n```\n\n![bullet](img/bullet_nb_square-blk.png)undefined\n\n\
  ![bullet](img/bullet_nb_square-blk.png)ReferenceError\n\n![bullet](img/bullet_nb_square-blk.png)1\n\
  \n# 第二章：箭头函数\n\n## 什么是箭头函数？\n\nES6 引入了胖箭头（`=>`）作为声明函数的一种方式。\n\n在 ES5 中，我们通常这样声明函数：\n\
  \n```\nconst greeting = function(name) {\n  return \"hello \" + name;\n}\n```\n\n\
  使用胖箭头的新语法如下：\n\n```\nvar greeting = (name) => {\n  return `hello ${name}`;\n}\n\
  ```\n\n我们可以更进一步，如果只有一个参数，可以省略括号，写成：\n\n```\nvar greeting = name => {\n  return `hello\
  \ ${name}`;\n}\n```\n\n如果没有参数，则需要写成空括号，如下：\n\n```\nvar greeting = () => {\n  return\
  \ \"hello\";\n}\n```\n\n## 隐式返回\n\n使用箭头函数，我们可以省略显式的 `return`，像这样返回：\n\n```\nconst\
  \ greeting = name => `hello ${name}`;\n```\n\n与旧的 ES5 函数并排比较：\n\n```\nconst oldFunction\
  \ = function(name){\n  return `hello ${name}`\n}\nconst arrowFunction = name =>\
  \ `hello ${name}`;\n```\n\n两个函数实现相同的结果，但新语法允许你更简洁。\n\n注意！可读性比简洁性更重要，因此如果你在团队中工作，且并非所有人都完全熟悉\
  \ ES6，你可能希望这样写函数：\n\n```\nconst arrowFunction = (name) => {\n  return `hello ${name}`;\n\
  }\n```\n\n假设我们想隐式返回一个对象字面量，可以这样做：\n\n```\nconst race = \"100m dash\";\nconst runners\
  \ = [ \"Usain Bolt\", \"Justin Gatlin\", \"Asafa Powell\" ];\nconst results = runners.map((runner,\
  \ i) => ({\n  name: runner,\n  race,\n  place: i + 1\n}));\nconsole.log(results);\n\
  // [{name: \"Usain Bolt\", race: \"100m dash\", place: 1}\n// {name: \"Justin Gatlin\"\
  , race: \"100m dash\", place: 2}\n// {name: \"Asafa Powell\", race: \"100m dash\"\
  , place: 3}]\n```\n\n在这个例子中，我们使用 `map` 函数遍历数组 `runners`。第一个参数是数组中的当前项，`i` 是它的索引。对于数组中的每一项，我们向\
  \ `results` 中添加一个包含属性 `name`、`race` 和 `place` 的对象。\n\n为了告诉 JavaScript 花括号内是一个我们想要隐式返回的对象字面量，我们需要将整个内容包裹在括号中。\n\
  \n写 `race` 和 `race: race` 是等价的。\n\n## 箭头函数是匿名的\n\n从之前的例子可以看出，箭头函数是匿名的。\n\n如果我们想给它们一个名字以便引用，可以将它们绑定到一个变量：\n\
  \n```\nconst greeting = name => `hello ${name}`;\ngreeting(\"Tom\");\n```\n\n##\
  \ 箭头函数与 `this` 关键字\n\n在使用箭头函数时，需要小心 `this` 关键字，因为它们的行为与普通函数不同。\n\n当你使用箭头函数时，`this`\
  \ 关键字继承自父作用域。\n\n这在以下情况下非常有用：\n\n<bdi><div class=\"box open\"></bdi> <bdi>这是一个盒子\
  \ </div></bdi>\n\n<bdi>.opening {</bdi> <bdi>background-color:red; }</bdi>\n\n```\n\
  // 获取 class 为 box 的 div\nconst box = document.querySelector(\".box\");\n// 监听点击事件\n\
  box.addEventListener(\"click\", function() {\n  // 切换 div 上的 opening 类\n  this.classList.toggle(\"\
  opening\");\n  setTimeout(function(){\n    // 尝试再次切换类\n    this.classList.toggle(\"\
  opening\");\n  },500);\n});\n```\n\n这里的问题是，第一个 `this` 绑定到了 `const box`，但第二个 `this`（在\
  \ `setTimeout` 内部）将指向 Window 对象，从而抛出以下错误：\n\n```\nUncaught TypeError: cannot read\
  \ property \"toggle\" of undefined\n```\n\n由于我们知道箭头函数会从父作用域继承 `this` 的值，我们可以将函数重写如下：\n\
  \n```\nconst box = document.querySelector(\".box\");\n// 监听点击事件\nbox.addEventListener(\"\
  click\", function() {\n  // 切换 div 上的 opening 类\n  this.classList.toggle(\"opening\"\
  );\n  setTimeout(()=>{\n    // 尝试再次切换类\n    this.classList.toggle(\"opening\");\n\
  \  },500);\n});\n```\n\n这里，第二个 `this` 将从其父级继承，并指向 `const box`。\n\n运行示例代码，你应该会看到我们的\
  \ div 在半秒内变为红色。\n\n## 何时应避免使用箭头函数\n\n\n\n\n利用我们对 `this` 关键字继承机制的理解，我们可以定义一些不应使用箭头函数的情况。\n\
  \n接下来的两个示例展示了在箭头函数内部使用 `this` 时需要谨慎的场景。\n\n示例 1\n\n```javascript\nconst button =\
  \ document.querySelector(\"btn\");\nbutton.addEventListener(\"click\", () => {\n\
  \  // error: this refers to the `Window` Object\n  this.classList.toggle(\"on\"\
  );\n})\n```\n\n示例 2\n\n```javascript\nconst person1 = {\n  age: 10,\n  grow: function()\
  \ {\n    this.age++;\n    console.log(this.age);\n  }\n}\nperson1.grow(); // 11\n\
  const person2 = {\n  age: 10,\n  grow: () => {\n    // error: this refers to the\
  \ `Window` Object\n    this.age++;\n    console.log(this.age);\n  }\n}\nperson2.grow();\n\
  ```\n\n箭头函数与普通函数的另一个区别在于对 `arguments` 对象的访问。\n\n`arguments` 对象是一个类数组对象，我们可以在函数内部访问它，它包含传递给该函数的参数值。\n\
  \n一个简单的示例：\n\n```javascript\nfunction example(){\n  console.log(arguments[0])\n\
  }\nexample(1,2,3); // 1\n```\n\n如你所见，我们使用数组表示法 `arguments[0]` 访问了第一个参数。\n\n与我们在\
  \ `this` 关键字中看到的情况类似，箭头函数会从其父作用域继承 `arguments` 对象的值。\n\n让我们看看之前跑步者列表中的这个示例：\n\n\
  ```javascript\nconst showWinner = () => {\n  const winner = arguments[0];\n  console.log(`${winner}\
  \ was the winner`)\n}\nshowWinner(\"Usain Bolt\", \"Justin Gatlin\", \"Asafa Powell\"\
  )\n```\n\n这段代码将返回：\n\n`ReferenceError: arguments is not defined`\n\n要访问传递给函数的所有参数，我们可以使用旧函数表示法或展开语法（我们将在第\
  \ 9 章中进一步讨论）。\n\n请记住，`arguments` 只是一个关键字，而不是变量名。\n\n使用箭头函数的示例：\n\n```javascript\n\
  const showWinner = (...args) => {\n  const winner = args[0];\n  console.log(`${winner}\
  \ was the winner`)\n}\nshowWinner(\"Usain Bolt\", \"Justin Gatlin\", \"Asafa Powell\"\
  ) // \"Usain Bolt was the winner\"\n```\n\n使用函数的示例：\n\n```javascript\nconst showWinner\
  \ = function() {\n  const winner = arguments[0];\n  console.log(`${winner} was the\
  \ winner`)\n}\nshowWinner(\"Usain Bolt\", \"Justin Gatlin\", \"Asafa Powell\") //\
  \ \"Usain Bolt was the winner\"\n```\n\n## 第 2 章末测验\n\n### 2.1 箭头函数的正确语法是什么？\n\n\
  ```javascript\nlet arr = [1,2,3];\n//a) let func = arr.map(n -> n+1);\n//b) let\
  \ func = arr.map(n => n+1);\n//c) let func = arr.map(n ~> n+1);\n```\n\n![bullet](img/bullet_nb_square-blk.png)a\n\
  \n![bullet](img/bullet_nb_square-blk.png)b\n\n![bullet](img/bullet_nb_square-blk.png)c\n\
  \n### 2.2 以下代码的正确输出是什么？\n\n```javascript\nconst person = {\n  age: 10,\n  grow:\
  \ () => {\n    this.age++;\n  },\n}\nperson.grow();\nconsole.log(person.age);\n\
  ```\n\n![bullet](img/bullet_nb_square-blk.png)10\n\n![bullet](img/bullet_nb_square-blk.png)11\n\
  \n![bullet](img/bullet_nb_square-blk.png)undefined\n\n### 2.3 将以下代码重构为使用箭头函数语法：\n\
  \n```javascript\nfunction(arg) { console.log(arg); }\n```\n\n# 第 3 章：默认函数参数\n\n\
  在 ES6 之前，为函数参数设置默认值并不容易。让我们看一个示例：\n\n```javascript\nfunction getLocation(city, country,\
  \ continent){\n  if(typeof country === 'undefined'){\n    country = 'Italy'\n  }\n\
  \  if(typeof continent === 'undefined'){\n    continent = 'Europe'\n  }\n  console.log(continent,\
  \ country, city)\n}\ngetLocation('Milan') // Europe Italy Milan\ngetLocation('Paris','France')\
  \ // Europe France Paris\n```\n\n如你所见，我们的函数接受三个参数：城市、国家和洲。在函数体中，我们检查 country 或 continent\
  \ 是否为 undefined，如果是，则赋予它们默认值。\n\n当调用 `getLocation('Milan')` 时，第二个和第三个参数（country\
  \ 和 continent）是 undefined，并被替换为函数的默认值。\n\n但是，如果我们希望默认值位于参数列表的开头而不是末尾呢？\n\n```javascript\n\
  function getLocation(continent, country, city){\n  if(typeof country === 'undefined'){\n\
  \    country = 'Italy'\n  }\n  if(typeof continent === 'undefined'){\n    continent\
  \ = 'Europe'\n  }\n  console.log(continent, country, city)\n}\ngetLocation(undefined,\
  \ undefined, 'Milan') // Europe Italy Milan\ngetLocation(undefined, 'Paris', 'France')\
  \ // Europe Paris France\n```\n\n如果我们想用默认值替换任何第一个参数，则需要将它们作为 `undefined` 传递，这看起来并不优雅。幸运的是，ES6\
  \ 通过默认函数参数解决了这个问题。\n\n## 默认函数参数\n\nES6 使得设置默认函数参数变得非常容易。让我们看一个示例：\n\n```javascript\n\
  function calculatePrice(total, tax = 0.1, tip = 0.05){\n  // When no value is given\
  \ for tax or tip, the default 0.1 and 0.05 will be used\n  return total + (total\
  \ * tax) + (total * tip);\n}\n```\n\n如果我们根本不想传递某个参数呢？比如这样：\n\n```javascript\n//\
  \ The 0.15 will be bound to the second argument, tax even if in our intention it\
  \ was to set 0.15 as the tip\ncalculatePrice(100, 0.15)\n```\n\n我们可以通过这样做来解决：\n\n\
  ```javascript\n// In this case 0.15 will be bound to the tip\ncalculatePrice(100,\
  \ undefined, 0.15)\n```\n\n这样可行，但不太美观，如何改进呢？\n\n使用解构，我们可以这样写：\n\n```javascript\n\
  function calculatePrice({ total = 0, tax = 0.1, tip = 0.05 } = {}){\n  return total\
  \ + (total * tax) + (total * tip);\n}\nconst bill = calculatePrice({ tip: 0.15,\
  \ total:150 }); // 187.5\n```\n\n我们将函数的参数设为一个对象。调用函数时，我们甚至不必担心参数的顺序，因为它们会根据键进行匹配。\n\
  \n在上面的示例中，tip 的默认值是 0.05，我们将其覆盖为 0.15，但没有给 tax 赋值，因此它保持默认值 0.1。\n\n请注意这个细节：\n\n\
  ```javascript\n{ total = 0, tax = 0.1, tip = 0.05 } = {}\n```\n\n如果我们不将参数对象默认设置为空对象，并且尝试运行\
  \ `calculatePrice()`，我们会得到：\n\n```\nCannot destructure property `total` of 'undefined'\
  \ or 'null'.\n```\n\n通过编写 `= {}`，我们将参数默认设置为一个对象，无论我们向函数传递什么参数，它都将是一个对象：\n\n```javascript\n\
  calculatePrice({}); // 0\ncalculatePrice(); // 0\ncalculatePrice(undefined) // 0\n\
  ```\n\n无论我们传递什么，参数都被默认设置为一个对象，该对象具有三个默认属性：total、tax 和 tip。\n\n```javascript\nfunction\
  \ calculatePrice({ total = 0, tax = 0.1, tip = 0.05}){\n  return total + (total\
  \ * tax) + (total * tip);\n}\ncalculatePrice({}); // cannot read property `total`\
  \ of 'undefined' or 'null'.\ncalculatePrice(); // cannot read property `total` of\
  \ 'undefined' or 'null'.\ncalculatePrice(undefined) // cannot read property `total`\
  \ of 'undefined' or 'null'.\n```\n\n不要担心解构，我们将在第 10 章中讨论它。\n\n## 第 3 章末测验\n\n###\
  \ 3.1 编写代码完成以下任务：\n\n在以下代码中，修改 `arg1` 和 `arg2`，使第一个代表税率，第二个代表小费值。\n\n给 tax 一个默认值\
  \ 0.1，给 tip 一个默认值 0.05。\n\n```javascript\nfunction calculatePrice(total, arg1, arg2)\
  \ {\n  return total + (total * tax) + (total * tip);\n}\ncalculatePrice(10); //\
  \ expected result: 11.5\n```\n\n### 3.2 以下代码的正确输出是什么？\n\n```javascript\nvar b =\
  \ 3;\nfunction multiply(a, b=2){\n  return a * b;\n}\nconsole.log(multiply(5));\n\
  ```\n\n![bullet](img/bullet_nb_square-blk.png)2\n\n![bullet](img/bullet_nb_square-blk.png)5\n\
  \n![bullet](img/bullet_nb_square-blk.png)10\n\n![bullet](img/bullet_nb_square-blk.png)15\n\
  \n# 第 4 章：模板字面量\n\n在 ES6 之前，它们被称为模板字符串，现在我们称之为模板字面量。让我们看看 ES6 中字符串插值方式的变化。\n\n##\
  \ 字符串插值\n\n在 ES5 中，我们通常这样写来进行字符串插值：\n\n```javascript\nvar name = \"Alberto\";\n\
  var greeting = 'Hello my name is ' + name;\nconsole.log(greeting); // Hello my name\
  \ is Alberto\n```\n\n在 ES6 中，我们可以使用反引号来简化操作。\n\n```javascript\nlet name = \"Alberto\"\
  ;\nconst greeting = `Hello my name is ${name}`;\nconsole.log(greeting); // Hello\
  \ my name is Alberto\n```\n\n\n\n\n\n## 表达式插值\n\n在 ES5 中，我们通常这样写：\n\n```javascript\n\
  var a =  1; var b =  10; console.log('1 * 10 is '  + ( a * b)); // 1 * 10 is 10\n\
  ```\n\n在 ES6 中，我们可以使用反引号来减少输入：\n\n```javascript\nvar a =  1; var b =  10; console.log(`1\
  \ * 10 is ${a * b}`); // 1 * 10 is 10\n```\n\n## 创建 HTML 片段\n\n在 ES5 中，我们通常这样处理多行字符串：\n\
  \n```javascript\n// 每行都必须加上反斜杠 var text =  \"hello, \\ my name is Alberto \\ how\
  \ are you?\\ \"\n```\n\n在 ES6 中，我们只需将所有内容包裹在反引号内，不再需要每行加反斜杠。\n\n```javascript\n\
  const content =  `hello, my name is Alberto how are you?`;\n```\n\n## 嵌套模板\n\n将一个模板嵌套在另一个模板中非常容易，如下所示：\n\
  \n```javascript\nconst people = [{name:  'Alberto',age:  27 },{name:  'Caroline',age:\
  \  27 },{name:  'Josh',age:  31 }]; const markup =  ` <ul> ${people.map(person =>\
  \  `<li> ${person.name}</li>`)} </ul> `; console.log(markup); // <ul> // <li> Alberto</li>,<li>\
  \ Caroline</li>,<li> Josh</li> // </ul>\n```\n\n这里我们使用 `map` 函数遍历每个人，并显示一个包含人名的\
  \ `li` 标签。\n\n## 添加三元运算符\n\n我们可以通过使用三元运算符轻松地在模板字符串中添加一些逻辑。\n\n三元运算符的语法如下：\n\n```javascript\n\
  const isDiscounted =  false function  getPrice(){console.log(isDiscounted ?  \"\
  $10\" : \"$20\"); } getPrice(); // $20\n```\n\n如果 `?` 之前的条件可以转换为 `true`，则返回第一个值，否则返回\
  \ `:` 之后的值。\n\n```javascript\n// 创建一个包含姓名和年龄的艺术家对象 const artist =  { name:  \"Bon\
  \ Jovi\", age:  56, }; // 只有当 artist 对象有 song 属性时，才将其添加到段落中，否则不返回任何内容 const text\
  \ =  ` <div> <p> ${artist.name} is ${artist.age} years old ${artist.song  ?  `and\
  \ wrote the song ${artist.song}` : ''  } </p> </div> ` // <div> // <p> Bon Jovi\
  \ is 56 years old // </p> // </div> const artist =  { name:  \"Trent Reznor\", age:\
  \  53, song:  'Hurt' }; // <div> // <p> Trent Reznor is 53 years old and wrote the\
  \ song Hurt // </p> // </div>\n```\n\n## 在模板字面量中传递函数\n\n与上面的示例（代码第 10 行）类似，如果需要，我们可以在模板字面量中传递一个函数。\n\
  \n```javascript\nconst groceries =  { meat:  \"pork chop\", veggie:  \"salad\",\
  \ fruit:  \"apple\", others: ['mushrooms',  'instant noodles',  'instant soup'],\
  \ } // 这个函数将映射 groceries 中的每个值 function  groceryList(others) { return  ` <p> ${others.map(\
  \ other =>  ` <span>${other}</span>`).join('\\n')} </p> `; } // 在一个 p 标签中显示所有 groceries，最后一个将包含数组\
  \ **others** 中的所有项 const markup =  ` <div> <p>${groceries.meat}</p> <p>${groceries.veggie}</p>\
  \ <p>${groceries.fruit}</p> <p>${groceryList(groceries.others)}</p> <div> ` // <div>\
  \ // <p>pork chop</p> // <p>salad</p> // <p>apple</p> // <p> // <p> // <span>mushrooms</span>\
  \ // <span>instant noodles</span> // <span>instant soup</span> // </p> // </p> //\
  \ <div>\n```\n\n在最后一个 `p` 标签中，我们调用了函数 `groceryList`，并将其他 groceries 作为参数传递给它。\n\n\
  在函数内部，我们返回一个 `p` 标签，并使用 `map` 遍历 grocery 列表中的每一项，返回一个包含每个 grocery 的 `span` 标签数组。然后我们使用\
  \ `.join('\\n')` 在每个 `span` 之后添加一个新行。\n\n## 带标签的模板字面量\n\n通过给模板字面量添加一个函数标签，我们可以让该函数处理模板字面量，为其提供模板内的所有内容。\n\
  \n其工作方式非常简单：只需将函数名放在要处理的模板前面。\n\n```javascript\nlet person =  \"Alberto\"; let age\
  \ =  25; function  myTag(strings,personName,personAge){ let str = strings[1]; let\
  \ ageStr; personAge >  50  ? ageStr =  \"grandpa\" : ageStr =  \"youngster\"; return\
  \ personName + str + ageStr; } let sentence = myTag`${person} is a ${age}`; console.log(sentence);\
  \ // Alberto is a youngster\n```\n\n我们捕获了变量 `age` 的值，并使用三元运算符决定打印什么。`strings` 将获取\
  \ `let sentence` 中的所有字符串，而其他参数将保存变量。\n\n在我们的示例中，字符串被分为三部分：`${person}`、`is a` 和 `${age}`。\n\
  \n我们使用数组表示法来访问中间的字符串，如下所示：\n\n```javascript\nlet str = strings[1];\n```\n\n要了解更多关于模板字面量的用例，请查看[这篇文章](https://codeburst.io/javascript-es6-tagged-template-literals-a45c26e54761)（[`codeburst.io/javascript-es6-tagged-template-literals-a45c26e54761`](https://codeburst.io/javascript-es6-tagged-template-literals-a45c26e54761)）。\n\
  \n## 第 4 章结束测验\n\n### 4.1 编写代码完成以下任务：\n\n利用模板字面量，组合不同的变量以达到预期的输出。\n\n```javascript\n\
  let a =  \"Hello,\"; let b =  \"is\"; let c =  \"my\"; let d =  \"name\"; let e\
  \ =  \"Tom\"; // 编辑 result 以达到预期输出 let result =  ''; console.log(result); //预期输出\
  \ \"Hello, my name is Tom\"\n```\n\n### 4.2 使用模板字面量重构以下代码\n\n```javascript\nlet\
  \ a =  \"1\"; let b =  \"2\"; let c =  \"plus\"; let d =  \"3\"; let e =  \"equals\"\
  ; // 编辑 result 以使用模板字面量 let result = a +  \" \"  + c +  \" \"  + b +  \" \"  + e\
  \ +  \" \"  + d; console.log(result); // 1 plus 2 equals 3\n```\n\n### 4.3 使用模板字面量重构以下代码\n\
  \n```javascript\n// 编辑 str 以使用模板字面量 let str =  'this is a very long text\\n'  +\
  \ 'a very long text'; console.log(str); // this is a very long text // a very long\
  \ text\n```\n\n# 第 5 章：其他字符串方法\n\n有许多方法可以用于字符串。以下是一些方法的列表：\n\n`indexOf()`\n\n获取字符串中指定值第一次出现的位置。\n\
  \n```javascript\nconst str =  \"this is a short sentence\"; str.indexOf(\"short\"\
  ); // 输出: 10\n```\n\n`slice()`\n\n提取字符串的指定部分作为新字符串。\n\n```javascript\nconst str\
  \ =  \"pizza, orange, cereals\" str.slice(0,  5); // 输出: \"pizza\"\n```\n\n`toUpperCase()`\n\
  \n将字符串中的所有字符转换为大写。\n\n```javascript\nconst str =  \"i ate an apple\" str.toUpperCase()\
  \ // 输出: \"I ATE AN APPLE\"\n```\n\n`toLowerCase()`\n\n将字符串中的所有字符转换为小写。\n\n```javascript\n\
  const str =  \"I ATE AN APPLE\" str.toLowerCase() // 输出: \"i ate an apple\"\n```\n\
  \n还有更多方法；这里只是列举了几个作为提醒。请查看 [MDN 文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String%23)\
  \ 以获取上述方法的更详细描述。\n\n## 其他字符串方法\n\nES6 引入了 4 个新的字符串方法：\n\n1.  `startsWith()`\n\n\
  1.  `endsWith()`\n\n1.  `includes()`\n\n1.  `repeat()`\n\n### `startsWith()`\n\n\
  这个新方法将检查字符串是否以我们传入的值开头：\n\n```javascript\nconst code =  \"ABCDEFG\"; code.startsWith(\"\
  ABB\"); // false code.startsWith(\"abc\"); // false, startsWith 区分大小写 code.startsWith(\"\
  ABC\"); // true\n```\n\n我们可以传入一个额外的参数，即方法开始检查的起始位置。\n\n```javascript\nconst code\
  \ =  \"ABCDEFGHI\" code.startsWith(\"DEF\",3); // true, 它将在 3 个字符后开始检查\n```\n\n\
  ### `endsWith()`\n\n与 `startsWith()` 类似，这个新方法将检查字符串是否以我们传入的值结尾：\n\n```javascript\n\
  const code =  \"ABCDEF\"; code.endsWith(\"DDD\"); // false code.endsWith(\"def\"\
  ); // false, endsWith 区分大小写 code.endsWith(\"DEF\"); // true\n```\n\n我们可以传入一个额外的参数，即检查结尾时要考虑的字符数。\n\
  \n```javascript\nconst code =  \"ABCDEFGHI\" code.endsWith(\"EF\",  6); // true,\
  \ 6 表示我们只考虑前 6 个值 ABCDEF，是的，这个字符串以 EF 结尾，因此我们得到 `true`\n```\n\n### `includes()`\n\
  \n这个方法将检查我们的字符串是否包含我们传入的值。\n\n\n\n\n\n```\nconst code =  \"ABCDEF\" code.includes(\"\
  ABB\"); // false code.includes(\"abc\"); // false, includes is case sensitive code.includes(\"\
  CDE\"); // true\n```\n\n### `repeat()`\n\n顾名思义，这个新方法接受一个参数，指定需要`repeat`字符串的次数。\n\
  \n```\nlet hello =  \"Hi\"; console.log(hello.repeat(10)); // \"HiHiHiHiHiHiHiHiHiHi\"\
  \n```\n\n## 第 5 章小测验\n\n### 5.1 以下代码的正确输出是什么？\n\n```\nconst code =  \"ABCDEFGHI\"\
  ; code.startsWith(\"DEF\",3);\n```\n\n![bullet](img/bullet_nb_square-blk.png)true\n\
  \n![bullet](img/bullet_nb_square-blk.png)false\n\n### 5.2 以下代码的正确输出是什么？\n\n```\n\
  const code =  \"ABCDEF\"; code.endsWith(\"def\");\n```\n\n![bullet](img/bullet_nb_square-blk.png)true\n\
  \n![bullet](img/bullet_nb_square-blk.png)false\n\n### 5.3 编写代码完成以下任务：\n\n```\nlet\
  \ str =  \"Na\"; let bat =  \"BatMan\"; let batman = ... console.log(batman); //\
  \ expected output: \"NaNaNaNaNaNaNaNa Batman\"\n```\n\n# 第 6 章：解构\n\nMDN 对解构的定义如下：\n\
  \n解构赋值语法是一种 JavaScript 表达式，它可以将数组中的值或对象中的属性解包到不同的变量中。\n\n我们先从解构对象开始。\n\n## 解构对象\n\
  \n过去，要从对象创建变量，我们通常这样做：\n\n```\nvar person =  { first:  \"Alberto\", last:  \"Montalesi\"\
  \ } var first =  person.first; var last =  person.last;\n```\n\n在 ES6 中，我们可以这样写：\n\
  \n```\nconst person =  { first:  \"Alberto\", last:  \"Montalesi\" } const  { first,\
  \ last }  = person;\n```\n\n由于我们的常量变量 `person` 与我们要获取的属性同名，因此我们不再需要指定 `person.first`\
  \ 和 `person.last`。\n\n即使有嵌套数据（例如从 API 获取的数据），也同样适用。\n\n```\nconst person =  { name:\
  \  \"Alberto\", last:  \"Montalesi\", links:{ social:  { facebook:  \"https://www.facebook.com/alberto.montalesi\"\
  , }, website:  \"http://albertomontalesi.github.io/\" } } const  { facebook }  =\
  \  person.links.social;\n```\n\n我们并不局限于将变量命名为与对象属性相同的名称。我们也可以像下面这样重命名：\n\n```\n\
  const  {  facebook:fb }  =  person.links.social; // 它会查找 person.links.social.facebook\
  \ 属性，并将变量命名为 fb console.log(fb);  // https://www.facebook.com/alberto.montalesi\
  \ console.log(facebook);  //ReferenceError: facebook is not defined\n```\n\n我们使用语法\
  \ `const { facebook:fb }` 来指定我们要定位对象 `person.links.social` 的属性 `facebook`，并且希望常量变量名为\
  \ `fb`。\n\n这就是为什么当我们尝试输出 `facebook` 时会报错。\n\n我们还可以像这样传递默认值：\n\n```\nconst  {  facebook:fb\
  \ =  \"https://www.facebook.com\"}  =  person.links.social; // 我们将变量重命名为 *fb*，并为其设置了默认值\n\
  ```\n\n## 解构数组\n\n解构数组时，我们注意到的第一个区别是使用 `[]` 而不是 `{}`。\n\n```\nconst person = [\"\
  Alberto\",\"Montalesi\",25]; const [name,surname,age] = person;\n```\n\n如果我们创建的变量数量少于数组中的元素数量，会发生什么？\n\
  \n```\nconst person = [\"Alberto\",\"Montalesi\",25]; // 我们省略了 age，不需要它 const [name,surname]\
  \ = person; // age 的值不会绑定到任何变量。 console.log(name,surname); // Alberto Montalesi\n\
  ```\n\n假设我们想获取所有剩余的值，可以使用剩余运算符：\n\n```\nconst person = [\"Alberto\",  \"Montalesi\"\
  ,  \"pizza\",  \"ice cream\",  \"cheese cake\"]; // 我们使用**剩余运算符**来获取所有剩余的值 const\
  \ [name,surname,...food] = person ; console.log(food); // Array [ \"pizza\", \"\
  ice cream\", \"cheese cake\" ]\n```\n\n在上面的例子中，数组的前两个值被绑定到 `name` 和 `surname`，而其余的值（这就是为什么它被称为剩余运算符）被分配给\
  \ `food`。\n\n`...` 是剩余运算符的语法。\n\n## 使用解构交换变量\n\n解构赋值使得交换变量变得极其简单，请看这个例子：\n\n```\n\
  let hungry =  \"yes\"; let full =  \"no\"; // 吃完饭后我们不再感到饿，而是感到饱，让我们交换值 [hungry,\
  \ full] = [full, hungry]; console.log(hungry,full); // no yes\n```\n\n没有比这更简单的交换值的方法了。\n\
  \n## 第 6 章小测验\n\n### 6.1 编写代码完成以下任务：\n\n使用解构交换两个变量的值。\n\n```\nlet hungry =  \"yes\"\
  ; let full =  \"no\"; // 你的代码写在这里 console.log(hungry); // no console.log(full);\
  \ // yes\n```\n\n### 6.2 编写代码完成以下任务：\n\n用一行代码声明变量，分别存储以下数组中的每个值。\n\n```\nlet arr\
  \ = [ \"one\",  \"two\",  \"three\" ]; //预期输出 console.log(one); // \"one\" console.log(two);\
  \ // \"two\" console.log(three); // \"three\"\n```\n\n# 第 7 章：可迭代对象与循环\n\n## `for\
  \ of` 循环\n\nES6 引入了一种新的循环类型：`for of` 循环。\n\n让我们看看它是如何使用的。\n\n### 遍历数组\n\n通常，我们会使用以下方法进行遍历：\n\
  \n```\nvar fruits = ['apple','banana','orange']; for (var i =  0; i <  fruits.length;\
  \ i++){ console.log(fruits[i]); } // apple // banana // orange\n```\n\n这是一个普通的循环，每次迭代将\
  \ `i` 的值增加 1，直到它小于 `fruits.length`。此时循环停止。\n\n看看我们如何使用 `for of` 循环实现同样的效果：\n\n```\n\
  const fruits = ['apple','banana','orange']; for(const fruit of fruits){ console.log(fruit);\
  \ } // apple // banana // orange\n```\n\n### 遍历对象\n\n对象是不可迭代的，那么我们如何遍历它们呢？\n\n我们必须首先使用类似\
  \ `Object.keys()` 或新的 ES6 函数 `Object.entries()` 来获取对象的所有值。\n\n```\nconst car = \
  \ { maker:  \"BMW\", color:  \"red\", year :  \"2010\", } for (const prop of  Object.keys(car)){\
  \ const value = car[prop]; console.log(prop,value); } // maker BMW // color red\
  \ // year 2010\n```\n\n## `for in` 循环\n\n尽管它不是 ES6 的新循环，但让我们看看 `for in` 循环，以了解它与\
  \ `for of` 循环的区别。\n\n`for in` 循环略有不同，因为它会以任意顺序遍历对象的所有[可枚举属性](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Enumerability_and_ownership_of_properties)。\n\
  \n因此，建议不要在迭代期间添加、修改或删除对象的属性。因为无法保证它们会被访问到，或者是在修改之前还是之后被访问。\n\n```\nconst car = \
  \ { maker:  \"BMW\", color:  \"red\", year :  \"2010\", } for (const prop in car){\
  \ console.log(prop, car[prop]); } // maker BMW // color red // year 2010\n```\n\n\
  ## `for of` 与 `for in` 的区别\n\n通过查看这个例子，我们可以看到第一个区别：\n\n```\nlet list = [4,  5, \
  \ 6]; // for...in 返回键的列表 for (let i in list) { console.log(i);  // \"0\", \"1\"\
  , \"2\", } // for ...of 返回值 for (let i of list) { console.log(i);  // \"4\", \"\
  5\", \"6\" }\n```\n\n`for in` 会返回键的列表，而 `for of` 会返回被迭代对象数值属性的值的列表。\n\n## 第 7 章小测验\n\
  \n### 7.1 以下哪个循环是在 ES6 中引入的？\n\n![bullet](img/bullet_nb_square-blk.png)`while`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`for of`\n\n![bullet](img/bullet_nb_square-blk.png)`for\
  \ in`\n\n### 以下代码的正确输出是什么？\n\n```\nlet people = [ \"Tom\",  \"Jerry\",  \"Mickey\"\
  \ ]; for (let person of people){ console.log(person); }\n```\n\n![bullet](img/bullet_nb_square-blk.png)Tom\
  \ Jerry\n\n![bullet](img/bullet_nb_square-blk.png)Tom\n\n![bullet](img/bullet_nb_square-blk.png)Tom\
  \ Jerry Mickey\n\n![bullet](img/bullet_nb_square-blk.png)Mickey\n\n# 第 8 章：数组改进\n\
  \n## `Array.from()`\n\n`Array.from()` 是 ES6 引入的众多新数组方法中的第一个。\n\n\n\n\n它会接受一个类数组（即看起来像数组但并非数组的东西），并将其转换为真正的数组。\n\
  \n```html\n<div class=\"fruits\"> <p> Apple </p> <p> Banana </p> <p> Orange </p>\
  \ </div>\n```\n\n```javascript\nconst fruits = document.querySelectorAll(\".fruits\
  \ p\"); // fruits 是一个节点列表（类数组集合），包含我们的三个 p 标签\n// 现在我们将其转换为数组\nconst fruitArray\
  \ = Array.from(fruits);\nconsole.log(fruitArray); // [p,p,p]\n// 既然我们现在处理的是数组，就可以使用\
  \ map\nconst fruitNames = fruitArray.map(fruit => fruit.textContent);\nconsole.log(fruitNames);\
  \ // [\"Apple\", \"Banana\", \"Orange\"]\n```\n\n我们也可以这样简化：\n\n```javascript\nconst\
  \ fruits = Array.from(document.querySelectorAll(\".fruits p\"));\nconst fruitNames\
  \ = fruits.map(fruit => fruit.textContent);\nconsole.log(fruitNames); // [\"Apple\"\
  , \"Banana\", \"Orange\"]\n```\n\n现在我们将 fruits 转换成了真正的数组，这意味着我们可以对它使用任何方法，比如 `map`。\n\
  \n`Array.from()` 还接受第二个参数，一个映射函数，因此我们可以这样写：\n\n```javascript\nconst fruits = document.querySelectorAll(\"\
  .fruits p\");\nconst fruitArray = Array.from(fruits, fruit => {\n  console.log(fruit);\
  \ // <p> Apple </p> // <p> Banana </p> // <p> Orange </p>\n  return fruit.textContent;\
  \ // 我们只想获取内容，而不是整个标签\n});\nconsole.log(fruitArray); // [\"Apple\", \"Banana\",\
  \ \"Orange\"]\n```\n\n在上面的例子中，我们向 `.from()` 方法传递了一个映射函数，以便只将 `p` 标签的 `textContent`\
  \ 推入新形成的数组，而不是整个标签。\n\n## `Array.of()`\n\n`Array.of()` 会创建一个包含我们传入的所有参数的数组。\n\n\
  ```javascript\nconst digits = Array.of(1,2,3,4,5);\nconsole.log(digits); // Array\
  \ [ 1, 2, 3, 4, 5];\n```\n\n## `Array.find()`\n\n`Array.find()` 返回数组中满足提供的测试函数的第一个元素的值。否则返回\
  \ `undefined`。\n\n让我们看一个简单的例子来了解 `Array.find()` 是如何工作的。\n\n```javascript\nconst\
  \ array = [1,2,3,4,5];\n// 这将返回数组中第一个值大于 3 的元素\nlet found = array.find(e => e >\
  \ 3);\nconsole.log(found); // 4\n```\n\n正如我们提到的，它会返回第一个满足条件的元素，这就是为什么我们只得到 4 而不是\
  \ 5。\n\n## `Array.findIndex()`\n\n`Array.findIndex()` 会返回第一个满足我们条件的元素的索引。\n\n```javascript\n\
  const greetings = [\"hello\",\"hi\",\"byebye\",\"goodbye\",\"hi\"];\nlet foundIndex\
  \ = greetings.findIndex(e => e === \"hi\");\nconsole.log(foundIndex); // 1\n```\n\
  \n同样，只返回第一个满足条件的元素的索引。\n\n## `Array.some()` 和 `Array.every()`\n\n我把这两个放在一起，因为它们的用法不言自明：`.some()`\
  \ 会搜索是否存在某些满足条件的项，一旦找到第一个就停止。而 `.every()` 会检查所有项是否都满足给定条件。\n\n```javascript\nconst\
  \ array = [1,2,3,4,5,6,1,2,3,1];\nlet arraySome = array.some(e => e > 2);\nconsole.log(arraySome);\
  \ // true\nlet arrayEvery = array.every(e => e > 2);\nconsole.log(arrayEvery); //\
  \ false\n```\n\n简单来说，第一个条件为 true，因为存在一些大于 2 的元素，但第二个条件为 false，因为并非每个元素都大于 2。\n\n\
  ## 第 8 章末测验\n\n### 8.1 编写代码完成以下任务：\n\n给定以下代码，从以下字符串创建一个新数组，其中字符串的每个字母成为数组中的一个项。\n\
  \n```javascript\nconst apple = \"Apple\";\nconst myArr = // 在此处添加你的代码\nconsole.log(myArry);\
  \ // 预期输出 = [\"A\", \"p\", \"p\", \"l\", \"e\"]\n```\n\n### 8.2 以下代码的正确输出是什么？\n\n\
  ```javascript\nconst array = [1,2,3,4,5];\nlet found = array.find(e => e > 3);\n\
  console.log(found);\n```\n\n![bullet](img/bullet_nb_square-blk.png)3\n\n![bullet](img/bullet_nb_square-blk.png)5\n\
  \n![bullet](img/bullet_nb_square-blk.png)4,5\n\n![bullet](img/bullet_nb_square-blk.png)4\n\
  \n### 8.3 以下代码的正确输出是什么？\n\n```javascript\nconst array = [1,2,3,4,5,6,1,2,3,1];\n\
  let arraySome = array.some(e => e > 2);\nconsole.log(arraySome);\n```\n\n![bullet](img/bullet_nb_square-blk.png)2\n\
  \n![bullet](img/bullet_nb_square-blk.png)false\n\n![bullet](img/bullet_nb_square-blk.png)3\n\
  \n![bullet](img/bullet_nb_square-blk.png)true\n\n### 8.4 以下代码的正确输出是什么：\n\n```javascript\n\
  Array.from([1, 2, 3], x => x * x);\n```\n\n![bullet](img/bullet_nb_square-blk.png)[1,2,3]\n\
  \n![bullet](img/bullet_nb_square-blk.png)[1,4,9]\n\n![bullet](img/bullet_nb_square-blk.png)[1,3,5]\n\
  \n# 第 9 章：展开运算符和剩余参数\n\n## 展开运算符\n\n根据 MDN 的说法：\n\n展开语法允许在需要零个或多个参数（用于函数调用）或元素（用于数组字面量）的地方展开可迭代对象（如数组表达式或字符串），或者在需要零个或多个键值对（用于对象字面量）的地方展开对象表达式。\n\
  \n### 合并数组\n\n```javascript\nconst veggie = [\"tomato\",\"cucumber\",\"beans\"];\n\
  const meat = [\"pork\",\"beef\",\"chicken\"];\nconst menu = [...veggie, \"pasta\"\
  , ...meat];\nconsole.log(menu); // Array [ \"tomato\", \"cucumber\", \"beans\",\
  \ \"pasta\", \"pork\", \"beef\", \"chicken\" ]\n```\n\n`...` 是展开语法，它允许我们获取数组 `veggie`\
  \ 和 `meat` 的所有单个值，并将它们放入数组 `menu` 中，同时还可以在它们之间添加一个新项。\n\n### 复制数组\n\n如果我们想创建数组的副本，展开语法非常有用。\n\
  \n```javascript\nconst veggie = [\"tomato\",\"cucumber\",\"beans\"];\nconst newVeggie\
  \ = veggie; // 这看起来像是创建了 veggie 数组的副本，但现在看看\nveggie.push(\"peas\");\nconsole.log(veggie);\
  \ // Array [ \"tomato\", \"cucumber\", \"beans\", \"peas\" ]\nconsole.log(newVeggie);\
  \ // Array [ \"tomato\", \"cucumber\", \"beans\", \"peas\" ]\n```\n\n我们的新数组也发生了变化，但为什么呢？因为我们实际上并没有创建副本，而只是在新数组中引用了旧数组。\n\
  \n以下是在 ES5 及更早版本中通常复制数组的方式：\n\n```javascript\nconst veggie = [\"tomato\",\"cucumber\"\
  ,\"beans\"];\n// 我们创建了一个空数组，并将旧数组的值放入其中\nconst newVeggie = [].concat(veggie);\n\
  veggie.push(\"peas\");\nconsole.log(veggie); // Array [ \"tomato\", \"cucumber\"\
  , \"beans\", \"peas\" ]\nconsole.log(newVeggie); // Array [ \"tomato\", \"cucumber\"\
  , \"beans\" ]\n```\n\n而使用展开语法，我们可以这样做：\n\n```javascript\nconst veggie = [\"tomato\"\
  ,\"cucumber\",\"beans\"];\nconst newVeggie = [...veggie];\nveggie.push(\"peas\"\
  );\nconsole.log(veggie); // Array [ \"tomato\", \"cucumber\", \"beans\", \"peas\"\
  \ ]\nconsole.log(newVeggie); // Array [ \"tomato\", \"cucumber\", \"beans\" ]\n\
  ```\n\n展开运算符的语法如下：`...YourArray`。因为我们希望变量 `newVeggie` 成为数组 `veggie` 的副本，所以我们将其赋值为一个数组，并在其中展开变量\
  \ `veggie` 的所有值，像这样：`[...veggie]`。\n\n### 展开到函数中\n\n得益于展开运算符，我们现在有了一种更简单的方法来使用参数数组调用函数。\n\
  \n```javascript\n// 旧方法\nfunction doStuff(x, y, z) {\n  console.log(x + y + z);\n\
  }\nvar args = [0, 1, 2];\n// 调用函数，传递 args\ndoStuff.apply(null, args);\n// 使用展开语法\n\
  doStuff(...args); // 3 (0+1+2);\nconsole.log(args); // Array [ 0, 1, 2 ]\n```\n\n\
  如你所见，在示例中，我们的 `doStuff` 函数接受 3 个参数，我们通过将数组 `args` 展开到函数中来传递它们，像这样：`...args`，从而无需使用\
  \ `.apply()`。\n\n让我们看另一个例子：\n\n```javascript\nconst name = [\"Alberto\", \"Montalesi\"\
  ];\nfunction greet(first, last) {\n  console.log(`Hello ${first} ${last}`);\n}\n\
  greet(...name); // Hello Alberto Montalesi\n```\n\n数组的两个值自动分配给函数的两个参数。\n\n如果我们提供的值多于参数会怎样？\n\
  \n```javascript\nconst name = [\"Jon\", \"Paul\", \"Jones\"];\nfunction greet(first,\
  \ last) {\n  console.log(`Hello ${first} ${last}`);\n}\ngreet(...name); // Hello\
  \ Jon Paul\n```\n\n\n\n\n\n在上述示例中，我们在数组中提供了三个值，但函数只有两个参数，因此最后一个被忽略了。\n\n### 对象字面量中的展开运算符（ES\
  \ 2018 / ES9）\n\n这个特性并非 ES6 的一部分，但既然我们已经讨论到这个话题，值得提一下 ES2018 为对象引入了展开运算符。\n\n让我们看一个例子：\n\
  \n```\nlet person =  { name :  \"Alberto\", surname:  \"Montalesi\", age:  25, }\
  \ let clone =  {...person}; console.log(clone); // Object { name: \"Alberto\", surname:\
  \ \"Montalesi\", age: 25 }\n```\n\n你可以在第 20 章中了解更多关于 ES2018 的内容。\n\n## Rest 参数\n\
  \nRest 语法看起来与展开语法完全相同，都是三个点 `...`，但它的作用恰恰相反。展开运算符展开数组，而 rest 参数将多个元素合并成一个。\n\n```\n\
  const runners = [\"Tom\",  \"Paul\",  \"Mark\",  \"Luke\"]; const [first,second,...losers]\
  \ = runners; console.log(...losers); // Mark Luke\n```\n\n我们将前两个值存储在常量 `first` 和\
  \ `second` 中，剩下的所有值通过 rest 参数放入 `losers` 中。\n\n## 第 9 章末测验\n\n### 9.1 展开数组值的正确语法是什么？\n\
  \n![bullet](img/bullet_nb_square-blk.png)`[.]`\n\n![bullet](img/bullet_nb_square-blk.png)`(...)`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`[...]`\n\n![bullet](img/bullet_nb_square-blk.png)`{...}`\n\
  \n### 9.2 编写代码完成以下任务：\n\n给定常量 `veggie` 和 `meat`。创建一个名为 `menu` 的新数组，包含：\n\n1.  `veggie`\
  \ 的所有值\n1.  一个新字符串 `'pasta'`\n1.  `meat` 的所有值\n\n```\nconst veggie = [\"tomato\"\
