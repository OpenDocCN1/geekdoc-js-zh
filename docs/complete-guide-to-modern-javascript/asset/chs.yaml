  \ =>  { resolve(); })\nmyPromise\n.then( () =>  { return  '1'; })\n.finally(()=>\
  \  { return  '2!'; })\n.then( res =>  { console.log(res); })\n```\n\n![bullet](img/bullet_nb_square-blk.png)`1`\n\
