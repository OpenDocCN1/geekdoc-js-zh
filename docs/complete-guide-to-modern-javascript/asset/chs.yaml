  Alberto\"`\n\n![bullet](img/bullet_nb_square-blk.png)`myname`\n\n![bullet](img/bullet_nb_square-blk.png)`\"\
  name\"`\n\n### 10.3 以下代码的正确输出是什么：\n\n```\nconst name =  \"myname\"; const age =\
  \  27; const favoriteColor =  \"Green\"; const person =  { name, age, color }; console.log(person.color);\n\
  ```\n\n![bullet](img/bullet_nb_square-blk.png)`\"Green\"`\n\n![bullet](img/bullet_nb_square-blk.png)`color`\n\
  \n![bullet](img/bullet_nb_square-blk.png)`color is not defined`\n\n![bullet](img/bullet_nb_square-blk.png)`favoriteColor`\n\
  \n# 第 11 章：Symbol\n\nES6 新增了一种原始类型，称为 `Symbol`。它们是什么？它们有什么作用？\n\n## Symbol 的唯一性\n\
  \n`Symbol` 始终是唯一的，我们可以将它们用作对象属性的标识符。\n\n让我们一起来创建一个 `Symbol`：\n\n```\nconst me =\
  \  Symbol(\"Alberto\"); console.log(me); // Symbol(Alberto)\n```\n\n我们说它们始终是唯一的，让我们尝试创建一个具有相同值的新\
  \ Symbol，看看会发生什么：\n\n```\nconst me =  Symbol(\"Alberto\"); console.log(me); // Symbol(Alberto)\
  \ const clone =  Symbol(\"Alberto\"); console.log(clone); // Symbol(Alberto) console.log(me\
  \ == clone); // false console.log(me === clone); // false\n```\n\n它们具有相同的值，但由于 `Symbol`\
  \ 始终是唯一的，我们永远不会遇到命名冲突。\n\n## 对象属性的标识符\n\n如前所述，我们可以使用它们来创建对象属性的标识符，让我们看一个例子：\n\n\
  ```\nconst office =  { \"Tom\"  :  \"CEO\", \"Mark\":  \"CTO\", \"Mark\":  \"CIO\"\
  , } for (person in office){ console.log(person); } // Tom // Mark\n```\n\n这里我们有一个包含三个人的办公室对象，其中两个人同名。\n\
  \n为了避免命名冲突，我们可以使用 Symbol。\n\n```\nconst office =  { [Symbol(\"Tom\")] :  \"CEO\"\
  , [Symbol(\"Mark\")] :  \"CTO\", [Symbol(\"Mark\")] :  \"CIO\", } for(person in\
  \ office) { console.log(person); } // undefined\n```\n\n当我们尝试遍历 Symbol 时得到了 `undefined`，因为它们是不可枚举的，所以我们不能使用\
  \ `for in` 遍历它们。\n\n如果我们想获取它们的对象属性，可以使用 `Object.getOwnPropertySymbols()`。\n\n```\n\
  const office =  { [Symbol(\"Tom\")] :  \"CEO\", [Symbol(\"Mark\")] :  \"CTO\", [Symbol(\"\
  Mark\")] :  \"CIO\", }; const symbols =  Object.getOwnPropertySymbols(office); console.log(symbols);\
  \ // 0: Symbol(Tom) // 1: Symbol(Mark) // 2: Symbol(Mark) // length: 3\n```\n\n\
  我们获取到了数组，但要访问属性，必须使用 `map`。\n\n```\nconst symbols =  Object.getOwnPropertySymbols(office);\
  \ const value =  symbols.map(symbol => office[symbol]); console.log(value); // 0:\
  \ \"CEO\" // 1: \"CTO\" // 2: \"CIO\" // length: 3\n```\n\n现在我们终于得到了包含所有 Symbol\
  \ 值的数组。\n\n## 第 11 章末测验\n\n### 11.1 什么是 Symbol？\n\n![bullet](img/bullet_nb_square-blk.png)一个穴居人\n\
  \n![bullet](img/bullet_nb_square-blk.png)一个属性\n\n![bullet](img/bullet_nb_square-blk.png)一种原始类型\n\
  \n![bullet](img/bullet_nb_square-blk.png)一种函数类型\n\n### 11.2 Symbol 的主要特征是什么？\n\n\
  ![bullet](img/bullet_nb_square-blk.png)尝试重新赋值时会抛出错误\n\n![bullet](img/bullet_nb_square-blk.png)它们不能在\
  \ for 循环中使用\n\n\n\n\n\n![bullet](img/bullet_nb_square-blk.png)它们是唯一的\n\n![bullet](img/bullet_nb_square-blk.png)它们只能存储字符串而不能存储整数\n\
  \n### 11.3 以下代码的正确输出是什么？\n\n```\nconst friends =  { \"Tom\"  :  \"bff\", \"Jim\"\
  \  :  \"brother\", \"Tom\"  :  \"cousin\", } for (friend in friends){ console.log(friend);\
  \ }\n```\n\n![bullet](img/bullet_nb_square-blk.png)Jim Tom\n\n![bullet](img/bullet_nb_square-blk.png)Error\n\
  \n![bullet](img/bullet_nb_square-blk.png)Tom Jim Tom\n\n![bullet](img/bullet_nb_square-blk.png)Tom\
  \ Jim\n\n### 11.4 以下代码的正确输出是什么？\n\n```\nconst family =  { [Symbol(\"Tom\")] :  \"\
  father\", [Symbol(\"Jane\")] :  \"mother\", [Symbol(\"Tom\")] :  \"brother\", };\
  \ const symbols =  Object.getOwnPropertySymbols(family); console.log(symbols);\n\
  ```\n\n![bullet](img/bullet_nb_square-blk.png)Symbol(Tom) Symbol(Jane) Symbol(Tom)\n\
  \n![bullet](img/bullet_nb_square-blk.png)Symbol(Tom) Symbol(Jane)\n\n![bullet](img/bullet_nb_square-blk.png)undefined\n\
  \n![bullet](img/bullet_nb_square-blk.png)Symbol(Jane) Symbol(Tom)\n\n# 第 12 章：类\n\
  \n引用 MDN：\n\n类主要是对 JavaScript 现有基于原型的继承的语法糖。类语法并没有为 JavaScript 引入新的面向对象继承模型。\n\n\
  话虽如此，在进入类之前，让我们回顾一下原型继承。\n\n```\nfunction  Person(name,age) { this.name  = name;\
  \ this.age  = age; } Person.prototype.greet  =  function(){ console.log(\"Hello,\
  \ my name is \"  +  this.name); } const alberto =  new  Person(\"Alberto\",  26);\
  \ const caroline =  new  Person(\"Caroline\",26); alberto.greet(); // Hello, my\
  \ name is Alberto caroline.greet(); // Hello, my name is Caroline\n```\n\n我们向原型添加了一个新方法，以便它对我们创建的所有`Person`新实例都可访问。\n\
  \n好了，现在我已经刷新了你对原型继承的认识，让我们来看看类。\n\n## 创建类\n\n有两种创建类的方式：\n\n1.  类声明\n\n1.  类表达式\n\
  \n```\n// class declaration class Person { } // class expression const person =\
  \  class Person { }\n```\n\n记住：类声明（和表达式）不会被提升，这意味着除非你想得到一个`ReferenceError`，否则你需要在访问类之前声明它。\n\
  \n让我们开始创建第一个类。\n\n我们只需要一个名为`constructor`的方法（记住只能添加一个构造函数，如果类包含多个构造函数方法，则会抛出`SyntaxError`）。\n\
  \n```\nclass Person { constructor(name,age){ this.name  = name; this.age  = age;\
  \ } greet(){ console.log(`Hello, my name is ${this.name} and I am ${this.age} years\
  \ old` ); }  // no commas in between methods farewell(){ console.log(\"goodbye friend\"\
  ); } } const alberto =  new  Person(\"Alberto\",26); alberto.greet(); // Hello,\
  \ my name is Alberto and I am 26 years old alberto.farewell(); // goodbye friend\n\
  ```\n\n如你所见，一切和之前一样。正如我们一开始提到的，类只是语法糖，一种更优雅的继承方式。\n\n## 静态方法\n\n现在我们创建的两个新方法`greet()`和`farewell()`可以被每个`Person`的新实例访问，但如果我们想要一个只能由类本身访问的方法，类似于数组的`Array.of()`，该怎么办？\n\
  \n```\nclass Person { constructor(name,age){ this.name  = name; this.age  = age;\
  \ } static  info(){ console.log(\"I am a Person class, nice to meet you\"); } }\
  \ const alberto =  new  Person(\"Alberto\",26); alberto.info(); // TypeError: alberto.info\
  \ is not a function Person.info(); // I am a Person class, nice to meet you\n```\n\
  \n## set 和 get\n\n我们可以使用 setter 和 getter 方法来设置和获取类内部的值。\n\n```\nclass Person { constructor(name,surname)\
  \ { this.name  = name; this.surname  = surname; this.nickname  =  \"\"; } set nicknames(value){\
  \ this.nickname  = value; console.log(this.nickname); } get nicknames(){ console.log(`Your\
  \ nickname is ${this.nickname}`); } } const alberto =  new  Person(\"Alberto\",\"\
  Montalesi\"); // first we call the setter alberto.nicknames  =  \"Albi\"; // \"\
  Albi\" // then we call the getter alberto.nicknames; // \"Your nickname is Albi\"\
  \n```\n\n## 扩展我们的类\n\n如果我们想要一个继承自之前类的新类呢？我们使用`extends`关键字来实现。请看下面的例子：\n\n```\n//\
  \ our initial class class Person { constructor(name,age){ this.name  = name; this.age\
  \  = age; } greet(){ console.log(`Hello, my name is ${this.name} and I am ${this.age}\
  \ years old` ); } } // our new class class Adult extends Person { constructor(name,age,work){\
  \ this.name  = name; this.age  = age; this.work  = work; } } const alberto =  new\
  \  Adult(\"Alberto\",26,\"software developer\");\n```\n\n我们创建了一个新的`class Adult`，它继承自`Person`，但如果你尝试运行这段代码，你会得到一个错误：\n\
  \n`ReferenceError: must call super constructor before using |this|  in Adult class\
  \ constructor`\n\n错误信息告诉我们，在新类中使用`this`之前，必须先调用`super()`。\n\n这意味着我们基本上必须在创建新的`Adult`之前创建一个新的`Person`，而`super()`构造函数正是这样做的。\n\
  \n```\nclass Adult extends Person { constructor(name,age,work){ super(name,age);\
  \ this.work  = work; } }\n```\n\n为什么我们设置了`super(name,age)`？因为我们的`Adult`类从`Person`继承了`name`和`age`，所以我们不需要重新声明它们。\n\
  \nSuper 会简单地为我们创建一个新的`Person`。\n\n如果我们现在再次运行代码，我们会得到：\n\n```\n// our initial class\
  \ class Person { constructor(name,age){ this.name  = name; this.age  = age; } greet(){\
  \ console.log(`Hello, my name is ${this.name} and I am ${this.age} years old` );\
  \ } } // our new class class Adult extends Person { constructor(name,age,work){\
  \ super(name,age); this.work  = work; } } const alberto =  new  Adult(\"Alberto\"\
  ,26,\"software developer\"); console.log(alberto.age); // 26 console.log(alberto.work);\
  \ // \"software developer\" alberto.greet(); // Hello, my name is Alberto and I\
  \ am 26 years old\n```\n\n如你所见，我们的`Adult`继承了`Person`类的所有属性和方法。\n\n## 扩展数组\n\n我们想要创建类似这样的东西，一个类似于数组的结构，其中第一个值是一个属性，用于定义我们的班级，其余的是我们的学生及其成绩。\n\
  \n```\n// we create a new `class`room const my`class`  =  new  `class`room('1A',[\
  \ {name:  \"Tim\",  mark:  6}, {name:  \"Tom\",  mark:  3}, {name:  \"Jim\",  mark:\
  \  8}, {name:  \"Jon\",  mark:  10},] );\n```\n\n我们可以做的是创建一个扩展数组的新类。\n\n```\nclass\
  \  `class`room extends Array { // we use rest operator to grab all the students\
  \ constructor(name, ...students){ // we use spread to place all the students in\
  \ the array individually otherwise we would push an array into an array super(...students);\
  \ this.name  = name; // we create a new method to add students } add(student){ this.push(student);\
  \ } } const my`class`  =  new  `class`room('1A', {name:  \"Tim\",  mark:  6}, {name:\
  \  \"Tom\",  mark:  3}, {name:  \"Jim\",  mark:  8}, {name:  \"Jon\",  mark:  10},\
  \ ); // now we can call my`class`.add({name:  \"Timmy\",  mark:7}); my`class`[4];\
  \ // Object { name: \"Timmy\", mark: 7 } // we can also loop over with for of for(const\
  \ student of my`class`) { console.log(student); } // Object { name: \"Tim\", grade:\
  \ 6 } // Object { name: \"Tom\", grade: 3 } // Object { name: \"Jim\", grade: 8\
  \ } // Object { name: \"Jon\", grade: 10 } // Object { name: \"Timmy\", grade: 7\
  \ }\n```\n\n## 第 12 章结束测验\n\n### 12.1 什么是类？\n\n![bullet](img/bullet_nb_square-blk.png)一个新的原始类型\n\
  \n![bullet](img/bullet_nb_square-blk.png)只是执行原型继承的语法糖\n\n![bullet](img/bullet_nb_square-blk.png)一种新的数组类型\n\
  \n### 12.2 如何声明一个类？\n\n![bullet](img/bullet_nb_square-blk.png)`const person = class\
  \ Person {...}`\n\n![bullet](img/bullet_nb_square-blk.png)`const person = new class\
  \ Person {...}`\n\n![bullet](img/bullet_nb_square-blk.png)`class Person {...}`\n\
  \n\n\n\n\n### 12.3 什么是静态方法？\n\n- 一种不能改变的方法\n- 一种可以被类的每个实例访问的方法\n- 一种只能被类本身访问的方法\n\
  \n### 12.4 以下代码的正确输出是什么？\n\n```\nclass Person { constructor(name,age){ this.name\
  \  = name; this.age  = age; } } class Adult extends Person { constructor(work){\
  \ this.work  = work; } } const my =  new  Adult('software developer'); console.log(my.work);\n\
  ```\n\n- `\"software developer\"`\n- `'Error: age is not defined'`\n- `ReferenceError:\
  \ Must call super constructor in derived class before accessing 'this'`\n\n### 12.5\
  \ 编写代码完成以下任务：\n\n给定以下类，创建一个名为 `Adult` 的新类，它继承自前一个类，并添加一个名为 `work` 的新属性。\n\n```\n\
  // 初始类 class Person { constructor(name,age){ this.name  = name; this.age  = age;\
  \ } greet(){ console.log(`Hello, my name is ${this.name} and I am ${this.age} years\
  \ old` ); } } // 创建一个继承自 Person 并添加新属性的新类 const me =  new  Adult('Alberto',27,'software\
  \ developer'); console.log(me.work); // software developer\n```\n\n# 第 13 章：Promise\n\
  \nJavaScript 是同步工作的，这意味着每个代码块会在前一个代码块执行完毕后执行。\n\n```\nconst data = fetch('your-api-url-goes-here');\n\
  \nconsole.log(\"Finished\");\n\nconsole.log(data); }\n```\n\n在上面的例子中，我们使用 `fetch`\
  \ 从 URL 获取数据（在这个例子中，我们只是假装这样做）。\n\n如果是同步代码，我们会期望后续的行只有在 `fetch` 完成后才会被调用，但实际上会发生的是，`fetch`\
  \ 被调用后，紧接着两个 `console.log` 也会被调用，导致最后一个 `console.log(data)` 返回 `undefined`。\n\n\
  这是因为 `fetch` 是异步执行的，这意味着代码不会在遇到这一行时停止运行，而是会继续执行。\n\n我们需要一种方法，在继续执行代码之前等待 `fetch`\
  \ 返回结果。\n\n为了避免这种情况，我们会使用回调函数或 Promise。\n\n## 回调地狱\n\n你可能听说过一种叫做“回调地狱”的东西，当我们试图以同步的方式编写异步代码时就会发生这种情况，也就是说，我们试图将每个代码块一个接一个地链式执行。\n\
  \n简单来说，它就像：\n\n做 A，如果 A 完成则做 B，如果 B 完成则做 C，以此类推。\n\n以下是一个示例，只是为了展示回调地狱的含义。假设每一步都是异步的，意味着我们需要为准备披萨的每一步向服务器发送请求，并等待服务器响应。\n\
  \n```\nconst makePizza = (ingredients, callback) =>  { mixIngredients(ingredients,\
  \  function(mixedIngredients)){ bakePizza(mixedIngredients,  function(bakedPizza)){\
  \ console.log('finished!') } } }\n```\n\n我们试图以一种从上到下视觉上执行的方式编写代码，导致函数过度嵌套，最终形成你上面看到的结果。\n\
  \n要改进你的回调函数，可以查看 [`callbackhell.com/`](http://callbackhell.com/)\n\nPromise 将帮助我们逃离这个“地狱”并改进我们的代码。\n\
  \n## 什么是 Promise？\n\n来自 MDN：\n\n`Promise` 是一个对象，代表异步操作的最终完成或失败。\n\n快速看一下下面的例子：\n\
  \n```\nconst data =  fetch('your-api-url-goes-here'); console.log('Finished'); console.log(data);\n\
  ```\n\n## 创建你自己的 Promise\n\n```\nconst myPromise =  new  Promise((resolve, reject)\
  \ =>  { // 你的代码写在这里 });\n```\n\n这就是创建你自己的 Promise 的方式，`resolve` 和 `reject` 会在 Promise\
  \ 完成时被调用。\n\n我们可以立即返回它，看看会得到什么：\n\n```\nconst myPromise =  new  Promise((resolve,\
  \ reject) =>  { resolve(\"我们从 Promise 中得到的值\"); }); myPromise.then( data =>  { console.log(data);\
  \ }); // 我们从 Promise 中得到的值\n```\n\n我们立即解决了 Promise，并在控制台中看到了结果。\n\n我们可以结合 `setTimeout()`\
  \ 来等待一段时间再解决。\n\n```\nconst myPromise =  new  Promise((resolve, reject) =>  { setTimeout(()\
  \ =>  { resolve(\"我们从 Promise 中得到的值\"); },  2000); }); myPromise.then( data => \
  \ { console.log(data); }); // 2 秒后 ... // 我们从 Promise 中得到的值\n```\n\n这两个例子非常简单，但\
  \ Promise 在处理大量数据请求时非常有用。\n\n在上面的例子中，我们保持简单，只解决了 Promise，但实际上你也会遇到错误，所以让我们看看如何处理它们：\n\
  \n```\nconst myPromise =  new  Promise((resolve, reject) =>  { setTimeout(() =>\
  \  { reject(Error(\"这是我们的错误\")); },  2000); }); myPromise .then(data =>  { console.log(data);\
  \ }) .catch(err =>  { console.error(err); }) // Error: 这是我们的错误 // Stack trace: //\
  \ myPromise</<@debugger eval code:3:14\n```\n\n我们使用 `.then()` 来获取 Promise 解决时的值，使用\
  \ `.catch()` 来获取 Promise 拒绝时的值。\n\n查看我们的错误日志，你可以看到它告诉我们错误发生的位置，这是因为我们写了 `reject(Error(\"\
  这是我们的错误\"));` 而不是简单的 `reject(\"这是我们的错误\");`。\n\n### 链式 Promise\n\n我们可以一个接一个地链式调用\
  \ Promise，使用前一个 Promise 返回的值作为后一个 Promise 的基础，无论 Promise 是解决还是拒绝。\n\n你可以链式调用任意数量的\
  \ Promise，代码仍然会比我们在上面回调地狱中看到的更易读、更简洁。\n\n```\nconst myPromise =  new  Promise((resolve,\
  \ reject) =>  { resolve(); }); myPromise .then(data =>  { // 返回一些新内容 return  'working...'\
  \ }) .then(data =>  { // 记录从上一个 Promise 得到的数据 console.log(data); throw  'failed!';\
  \ }) .catch(err =>  { // 捕获上一个 Promise 的错误并记录 console.error(err); // failed! })\n\
  ```\n\n如你所见，第一个 `then` 将一个值传递给了第二个 `then`，我们在那里记录了它，并且还抛出了一个错误，该错误被 `catch` 子句捕获。\n\
  \n我们不仅可以在成功时链式调用，也可以在拒绝时链式调用。\n\n```\nconst myPromise =  new  Promise((resolve,\
  \ reject) =>  { resolve(); }); myPromise .then(data =>  { throw  new  Error(\"ooops\"\
  ); console.log(\"first value\"); }) .catch(() =>  { console.log(\"catch an error\"\
  ); }) .then(data =>  { console.log(\"second value\"); }); // catch an error // second\
  \ value\n```\n\n我们没有得到“first value”，因为我们抛出了一个错误，所以只得到了第一个 `.catch()` 和最后一个 `.then()`。\n\
  \n### `Promise.resolve()` 和 `Promise.reject()`\n\n`Promise.resolve()` 和 `Promise.reject()`\
  \ 会创建自动解决或拒绝的 Promise。\n\n```\n//Promise.resolve() Promise.resolve('Success').then(function(value)\
  \ { console.log(); // \"Success\" },  function(value) { cnsole.log('fail') }); //\
  \ Promise.reject() Promise.reject(new  Error('fail')).then(function() { // 不会被调用\
  \ },  function(error) { console.log(error); // Error: fail });\n```\n\n如你在第一个例子中所见，`then`\
  \ 子句中创建的 Promise 有两个参数，一个函数在 Promise 解决时被调用，另一个在 Promise 拒绝时被调用。由于 `Promise.resolve()`\
  \ 立即解决了 Promise，因此第一个函数被调用。\n\n第二个例子中则相反，我们使用 `Promise.reject()` 立即拒绝 Promise，因此\
  \ `then` 子句的第二个参数被调用。\n\n### `Promise.all()` 和 `Promise.race()`\n\n`Promise.all()`\
  \ 返回一个单一的 Promise，当所有 Promise 都解决时，该 Promise 才会解决。\n\n让我们看一个有两个 Promise 的例子。\n\n\
  \n\n\n\n```javascript\nconst promise1 =  new  Promise((resolve,reject) =>  { setTimeout(resolve,\
  \  500,  'first value'); });\nconst promise2 =  new  Promise((resolve,reject) =>\
  \  { setTimeout(resolve,  1000,  'second value'); });\npromise1.then(data =>  {\
  \ console.log(data); }); // after 500 ms // first value\npromise2.then(data => \
  \ { console.log(data); }); // after 1000 ms // second value\n```\n\n它们将彼此独立地解决，但看看当我们使用`Promise.all()`时会发生什么。\n\
  \n```javascript\nconst promise1 =  new  Promise((resolve,reject) =>  { setTimeout(resolve,\
  \  500,  'first value'); });\nconst promise2 =  new  Promise((resolve,reject) =>\
  \  { setTimeout(resolve,  1000,  'second value'); });\nPromise .all([promise1, promise2])\n\
  .then(data =>  { const[promise1data, promise2data] = data; console.log(promise1data,\
  \ promise2data); });\n// after 1000 ms // first value second value\n```\n\n我们的值在\
  \ 1000 毫秒后（第二个 promise 的超时时间）一起返回，这意味着第一个必须等待第二个完成。\n\n如果我们传递一个空的可迭代对象，那么它将返回一个已经解决的\
  \ promise。\n\n如果其中一个 promise 被拒绝，那么所有 promise 都会异步地以该拒绝的值拒绝，即使它们已经解决。\n\n```javascript\n\
  const promise1 =  new  Promise((resolve,reject) =>  { resolve(\"my first value\"\
  ); });\nconst promise2 =  new  Promise((resolve,reject) =>  { reject(Error(\"oooops\
  \ error\")); });\n// one of the two promises will fail, but `.all` will return only\
  \ a rejection.\nPromise .all([promise1, promise2])\n.then(data =>  { const[promise1data,\
  \ promise2data] = data; console.log(promise1data, promise2data); })\n.catch(err\
  \ =>  { console.log(err); });\n// Error: oooops error\n```\n\n另一方面，`Promise.race()`返回一个\
  \ promise，该 promise 会在可迭代对象中的任何一个 promise 解决或拒绝时立即解决或拒绝，并使用该 promise 的值。\n\n```javascript\n\
  const promise1 =  new  Promise((resolve,reject) =>  { setTimeout(resolve,  500,\
  \  'first value'); });\nconst promise2 =  new  Promise((resolve,reject) =>  { setTimeout(resolve,\
  \  100,  'second value'); });\nPromise.race([promise1, promise2]).then(function(value)\
  \ {\n  console.log(value); // Both resolve, but promise2 is faster\n});\n// expected\
  \ output: \"second value\"\n```\n\n如果我们传递一个空的可迭代对象，那么 race 将永远处于待定状态！\n\n## 第 13\
  \ 章测验结束\n\n### 13.1 什么是 Promise？\n\n- ![bullet](img/bullet_nb_square-blk.png) 一种新的原始类型\n\
