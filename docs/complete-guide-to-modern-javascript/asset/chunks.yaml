    finished\"\n\n# 第 20 章：ES2018 异步迭代及其他？\n\n在本章中，我们将了解 ES2018 引入了哪些新特性。\n\n## 对象的\
    \ Rest / Spread\n\n还记得 ES6（ES2015）允许我们这样做吗？\n\n```javascript\nconst veggie = [\"\
    tomato\",\"cucumber\",\"beans\"];\nconst meat = [\"pork\",\"beef\",\"chicken\"\
    ];\nconst menu = [...veggie,  \"pasta\", ...meat];\nconsole.log(menu);\n// Array\
    \ [ \"tomato\", \"cucumber\", \"beans\", \"pasta\", \"pork\", \"beef\", \"chicken\"\
    \ ]\n```\n\n现在，我们也可以对对象使用 rest/spread 语法，让我们看看如何操作：\n\n```javascript\nlet myObj\
    \ =  {\n  a:1,\n  b:3,\n  c:5,\n  d:8,\n}\n// 我们使用 rest 运算符来获取对象中剩余的所有内容。\nlet\
    \  { a, b, ...z  }  = myObj;\nconsole.log(a);  // 1\nconsole.log(b);  // 3\nconsole.log(z);\
    \  // {c: 5, d: 8}\n\n// 使用 spread 语法，我们克隆了对象\nlet clone =  { ...myObj  };\nconsole.log(clone);\
    \ // {a: 1, b: 3, c: 5, d: 8}\n\nmyObj.e  =  15;\nconsole.log(clone) // {a: 1,\
    \ b: 3, c: 5, d: 8}\nconsole.log(myObj) // {a: 1, b: 3, c: 5, d: 8, e: 15}\n```\n\
    \n使用 spread 运算符，我们可以轻松创建对象的克隆，这样当我们修改原始对象时，克隆不会受到影响，这与我们在讨论数组时看到的情况类似。\n\n## 异步迭代\n\
    \n通过异步迭代，我们可以异步地遍历数据。\n\n[来自文档：](https://github.com/tc39/proposal-async-iteration)\n\
    \n异步迭代器与迭代器非常相似，不同之处在于它的 `next()` 方法返回一个 Promise，该 Promise 解析为 `{ value, done\
    \ }` 对。\n\n为此，我们将使用 `for-await-of` 循环，它会将我们的可迭代对象转换为 Promise，除非它们已经是 Promise。\n\
    \n```javascript\nconst iterables = [1,2,3];\nasync  function  test() {\n  for\
    \  await (const value of iterables) {\n    console.log(value);\n  }\n}\ntest();\n\
    // 1\n// 2\n// 3\n```\n\n在执行过程中，会使用 `[Symbol.asyncIterator]()` 方法从数据源创建一个异步迭代器。\n\
    \n每次我们访问序列中的下一个值时，都会隐式地等待迭代器方法返回的 Promise。\n\n## Promise.prototype.finally()\n\
    \n在 Promise 完成后，我们可以调用一个回调函数。\n\n```javascript\nconst myPromise =  new  Promise((resolve,reject)\
    \ =>  {\n  resolve();\n})\n\nmyPromise\n.then( () =>  {\n  console.log('still\
    \ working');\n})\n.catch( () =>  {\n  console.log('there was an error');\n})\n\
    .finally(()=>  {\n  console.log('Done!');\n})\n```\n\n`.finally()` 也会返回一个 Promise，因此我们可以在它后面链式调用更多的\
    \ `then` 和 `catch`，但这些 Promise 将基于它们所链式调用的 Promise 来履行。\n\n```javascript\nconst\
    \ myPromise =  new  Promise((resolve,reject) =>  {\n  resolve();\n})\n\nmyPromise\n\
    .then( () =>  {\n  console.log('still working');\n  return  'still working';\n\
    })\n.finally(()=>  {\n  console.log('Done!');\n  return  'Done!';\n})\n.then(\
    \ res =>  {\n  console.log(res);\n})\n// still working\n// Done!\n// still working\n\
    ```\n\n"
