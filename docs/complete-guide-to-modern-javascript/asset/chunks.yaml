    # Introduction


    This book was first published in 2018 as a result of months of self-study of JavaScript,
    and it was aimed to JavaScript developers who wanted to update their skills to
    the newest version of the ECMAScript specification.


    I was really proud of the result, but at the same time, I felt this book was missing
    something. It was not suitable for newcomers to the language.


    This 2019 edition addresses the problems of the first one and expands on it, targeting
    both JavaScript developers and complete beginners.


