    \ active}\nconst blogPostStatus: Status = Status.active;\nconsole.log(blogPostStatus);\
    \ // 1\n```\n\nNow `deleted` corresponds to -1, `pending` to 0 and `active` to\
    \ 1, much better than before.\n\nWe can also access values of an enum based on\
