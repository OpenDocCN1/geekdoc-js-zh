  trans: "\n起初，你可能觉得给变量标注类型是件麻烦事，但随着项目规模增长、复杂度提升，你会逐渐意识到这样做的好处，尤其是在花了几个月时间做其他事情后再回到这个项目时。\n\
    \n关于 TypeScript 的进一步问题，我建议的最佳资源是官方文档，可通过以下链接访问：<https://www.TypeScriptlang.org/docs/>。\n\
    \n## TypeScript 测验\n\n### TS-01 以下哪个不是 TypeScript 的基本类型？\n\n![bullet](img/bullet_nb_square-blk.png)`Tuple`\n\
    \n![bullet](img/bullet_nb_square-blk.png)`void`\n\n![bullet](img/bullet_nb_square-blk.png)`enum`\n\
    \n![bullet](img/bullet_nb_square-blk.png)`every`\n\n### TS-02 以下变量的正确类型是什么？\n\n\
    ```\nconst x = 0xf00d;\n```\n\n![bullet](img/bullet_nb_square-blk.png)`string`\n\
    \n![bullet](img/bullet_nb_square-blk.png)`void`\n\n![bullet](img/bullet_nb_square-blk.png)`hex`\n\
    \n![bullet](img/bullet_nb_square-blk.png)`number`\n\n### TS-03 以下哪个类型定义是错误的？\n\
    \n![bullet](img/bullet_nb_square-blk.png)`const firstArray: number[] = [1,2,3]`\n\
    \n![bullet](img/bullet_nb_square-blk.png)`const firstArray: Array<number> = [1,2,3]`\n\
    \n![bullet](img/bullet_nb_square-blk.png)`const firstArray: number<Array> = [1,2,3]`\n\
    \n### TS-04 以下代码的正确输出是什么？\n\n```\nenum Rank {first, second, third}\nconst myRank:\
    \ Rank = Rank.second;\nconsole.log(myRank);\n```\n\n![bullet](img/bullet_nb_square-blk.png)`\"\
    second\"`\n\n![bullet](img/bullet_nb_square-blk.png)`{second:1}`\n\n![bullet](img/bullet_nb_square-blk.png)`true`\n\
    \n![bullet](img/bullet_nb_square-blk.png)`2`\n\n![bullet](img/bullet_nb_square-blk.png)`1`\n\
    \n### TS-05 定义接口的正确方式是什么？\n\n![bullet](img/bullet_nb_square-blk.png)`interface\
    \ Car = { wheels: number }`\n\n![bullet](img/bullet_nb_square-blk.png)`interface\
    \ Car { wheels = number }`\n\n![bullet](img/bullet_nb_square-blk.png)`interface\
    \ Car { wheels: number }`\n\n![bullet](img/bullet_nb_square-blk.png)`interface\
    \ Car = { wheels = number }`\n\n# 结语\n\n衷心感谢你坚持读到这里。这是我的第一本书，知道有人读完了它，我满心欢喜。\n\
    \n希望你觉得它有用。如果是这样，我建议你关注我的新[网站](https://www.inspiredwebdev.com/)（[inspiredwebdev.com](http://inspiredwebdev.com)）和我的\
    \ [DevTo](https://dev.to/albertomontalesi)（https://dev.to/albertomontalesi），我在那里撰写关于\
    \ Web 开发的文章。\n\n非常感谢你的时间和支持。\n\n特别感谢 GitHub 上的所有用户，他们提交了拉取请求并提出了问题，帮助修正错误并提高本书的质量。\n\
    \n# 测验答案\n\n## JavaScript 入门答案\n\n### JS-01\n\n1. `var important! = \"important!\"\
    `\n\n变量名不能包含标点符号\n\n### JS-02\n\n1. `Object`\n\n### JS-03\n\n1. `const car = {\
    \ color: \"red\" }`\n\n### JS-04\n\n1. `false`\n\n### JS-05\n\n1. `[\"melon\"\
    , \"apple\", \"banana\", \"orange\"]`\n\n### 第 1 章测验答案结束\n\n### 1.1\n\n1. `Good\
    \ morning`\n\n### 1.2\n\n1. `2`\n\n### 1.3\n\n1. `100`\n\n### 1.4\n\n1. `ReferenceError`\n\
    \n### 第 2 章测验结束\n\n### 2.1\n\n1. `B`\n\n箭头函数的正确语法是所谓的胖箭头 `=>`\n\n### 2.2\n\n1.\
    \ `10`\n\n在箭头函数内部，`this` 关键字继承自其父作用域，本例中父作用域是 window，因此 age 仍为 10。\n\n### 2.3\n\
    \n```\n(arg) => { console.log(arg); }\n```\n\n### 第 3 章测验结束\n\n### 3.1\n\n```\n\
    function calculatePrice(total, tax = 0.1, tip = 0.05) {\n  // 当未给 tax 或 tip 赋值时，将使用默认值\
    \ 0.1 和 0.05\n  return total + (total * tax) + (total * tip);\n}\n```\n\n### 3.2\n\
    \n1. `10`\n\n### 第 4 章测验结束\n\n### 4.1\n\n```\nlet result = `${a} ${c} ${d} ${b}\
    \ ${e}`;\n```\n\n### 4.2\n\n```\nlet result = `${a} ${c} ${b} ${e} ${d}`;\nconsole.log(result);\
    \ // 1 plus 2 equals 3\n```\n\n### 4.3\n\n```\nconsole.log(`this is a very long\
    \ text a very long text`);\n// this is a very long text\n// a very long text\n\
    ```\n\n### 第 5 章测验结束\n\n### 5.1\n\n1. `true`\n\n它将在 3 个字符后开始检查\n\n### 5.2\n\n\
    1. `false`\n\n`endsWith` 区分大小写\n\n### 5.3\n\n```\nlet batman = `${str.repeat(8)}\
    \ ${bat}`;\nconsole.log(batman); // \"NaNaNaNaNaNaNaNa BatMan\"\n```\n\n### 第\
    \ 6 章测验结束\n\n### 6.1\n\n```\nlet hungry = \"yes\";\nlet full = \"no\";\n[hungry,\
    \ full] = [full, hungry];\nconsole.log(hungry); // no\nconsole.log(full); // yes\n\
    ```\n\n### 6.2\n\n```\nlet arr = [\"one\", \"two\", \"three\"];\n// 解决方案：\nlet\
    \ [one, two, three] = arr;\nconsole.log(one); // \"one\"\nconsole.log(two); //\
    \ \"two\"\nconsole.log(three); // \"three\"\n```\n\n### 第 7 章测验结束\n\n### 7.1\n\
    \n1. `for of`\n\n### 7.2\n\n1. `Tom Jerry Mickey`\n\n### 第 8 章测验结束\n\n### 8.1\n\
    \n```\nArray.from(apple);\n```\n\n### 8.2\n\n1. `4`\n\n`Array.find()` 将返回第一个匹配条件的元素。\n\
    \n### 8.3\n\n1. `true`\n\n`Array.some()` 如果有一个元素匹配给定条件，则返回 `true`\n\n### 8.4\n\
    \n1. `[1,4,9]`\n\n我们传入的 map 函数将对数组中的每个值返回 `x * x`\n\n### 第 9 章测验结束\n\n### 9.1\n\
    \n1. `[...]`\n\n### 9.2\n\n```\nconst menu = [...veggie, \"pasta\", ...meat];\n\
    ```\n\n### 9.3\n\n```\nconst [first, second, ...losers] = runners;\nconsole.log(...losers);\n\
    ```\n\n我们使用 rest 运算符来获取前两个之后的所有剩余值\n\n### 9.4\n\n1. `[1, 2, 3, 4, 5]`\n\n### 第\
    \ 10 章测验结束\n\n### 10.1\n\n```\nconst animal = { name, age, breed };\n```\n\n###\
    \ 10.2\n\n1. `\"Alberto\"`\n\n### 10.3\n\n1. `color is not defined`\n\n由于变量名和属性名不匹配，我们需要写成\
    \ `color: favoriteColor` 而不是仅仅 `color`\n\n### 第 11 章测验结束\n\n### 11.1\n\n1. `a\
    \ primitive`\n\nSymbol 是 ES6 引入的一种新的原始类型\n\n### 11.2\n\n1. `they are unique`\n\
    \nSymbol 总是唯一的\n\n### 11.3\n\n1. `Tom Jim`\n\n第二次赋值 `\"Tom\"` 时，我们覆盖了第一个 `\"Tom\"\
    `，因为我们没有使用 symbol。\n\n### 11.4\n\n1. `Symbol(Tom) Symbol(Jane) Symbol(Tom)`\n\n\
    这次我们看到了全部三个，因为我们将它们存储在 symbol 中，保持了唯一性并避免了命名冲突。\n\n### 第 12 章测验结束\n\n### 12.1\n\
    \n1. `just syntactic sugar`\n\n类主要是对 JavaScript 现有基于原型的继承的语法糖。类语法并没有为 JavaScript\
    \ 引入新的面向对象继承模型。\n\n### 12.2\n\n1. `const person = class Person {...}`\n\n1. `class\
    \ Person {...}`\n\n答案 1 和 3 都正确。第一个称为类表达式，第二个称为类声明。\n\n### 12.3\n\n1. `A method\
    \ that can be accessed only by the class itself`\n\n静态方法是只能由类本身访问的方法。\n\n### 12.4\n\
