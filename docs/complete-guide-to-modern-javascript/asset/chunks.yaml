- fmt: "\nAn enum is a way of giving names to a set of numeric values:\n\n```\nenum\
    \ Status {deleted, pending, active}\nconst blogPostStatus: Status = Status.active;\n\
    console.log(blogPostStatus); // 2\n```\n\nThe values inside of an enum start from\
    \ 0 so in our example before `active` corresponds to 2, `pending` to 1 and `deleted`\
    \ to 0.\n\nIt is much more meaningful to say that the status of a blog post is\
