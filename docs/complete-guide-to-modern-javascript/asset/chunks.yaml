    # 第 6 章：解构


    MDN 对解构的定义如下：


    解构赋值语法是一种 JavaScript 表达式，它可以将数组中的值或对象中的属性解包到不同的变量中。


    我们先从解构对象开始。


    ## 解构对象


    过去，要从对象创建变量，我们通常这样做：


    ```

    var person =  { first:  "Alberto", last:  "Montalesi" } var first =  person.first;
    var last =  person.last;

    ```


    在 ES6 中，我们可以这样写：


    ```

    const person =  { first:  "Alberto", last:  "Montalesi" } const  { first, last
    }  = person;

    ```


    由于我们的常量变量 `person` 与我们要获取的属性同名，因此我们不再需要指定 `person.first` 和 `person.last`。


    即使有嵌套数据（例如从 API 获取的数据），也同样适用。


    ```

    const person =  { name:  "Alberto", last:  "Montalesi", links:{ social:  { facebook:  "https://www.facebook.com/alberto.montalesi",
    }, website:  "http://albertomontalesi.github.io/" } } const  { facebook }  =  person.links.social;

    ```


    我们并不局限于将变量命名为与对象属性相同的名称。我们也可以像下面这样重命名：


    ```

    const  {  facebook:fb }  =  person.links.social; // 它会查找 person.links.social.facebook
    属性，并将变量命名为 fb console.log(fb);  // https://www.facebook.com/alberto.montalesi
    console.log(facebook);  //ReferenceError: facebook is not defined

    ```


    我们使用语法 `const { facebook:fb }` 来指定我们要定位对象 `person.links.social` 的属性 `facebook`，并且希望常量变量名为
    `fb`。


    这就是为什么当我们尝试输出 `facebook` 时会报错。


    我们还可以像这样传递默认值：


    ```

    const  {  facebook:fb =  "https://www.facebook.com"}  =  person.links.social;
    // 我们将变量重命名为 *fb*，并为其设置了默认值

    ```


    ## 解构数组


    解构数组时，我们注意到的第一个区别是使用 `[]` 而不是 `{}`。


    ```

    const person = ["Alberto","Montalesi",25]; const [name,surname,age] = person;

    ```


    如果我们创建的变量数量少于数组中的元素数量，会发生什么？


    ```

    const person = ["Alberto","Montalesi",25]; // 我们省略了 age，不需要它 const [name,surname]
    = person; // age 的值不会绑定到任何变量。 console.log(name,surname); // Alberto Montalesi

    ```


    假设我们想获取所有剩余的值，可以使用剩余运算符：


    ```

    const person = ["Alberto",  "Montalesi",  "pizza",  "ice cream",  "cheese cake"];
    // 我们使用**剩余运算符**来获取所有剩余的值 const [name,surname,...food] = person ; console.log(food);
    // Array [ "pizza", "ice cream", "cheese cake" ]

    ```


    在上面的例子中，数组的前两个值被绑定到 `name` 和 `surname`，而其余的值（这就是为什么它被称为剩余运算符）被分配给 `food`。


    `...` 是剩余运算符的语法。


    ## 使用解构交换变量


    解构赋值使得交换变量变得极其简单，请看这个例子：


    ```

    let hungry =  "yes"; let full =  "no"; // 吃完饭后我们不再感到饿，而是感到饱，让我们交换值 [hungry, full]
    = [full, hungry]; console.log(hungry,full); // no yes

    ```


    没有比这更简单的交换值的方法了。


