    \ 时需要谨慎的场景。\n\n示例 1\n\n```javascript\nconst button = document.querySelector(\"\
    btn\");\nbutton.addEventListener(\"click\", () => {\n  // error: this refers to\
    \ the `Window` Object\n  this.classList.toggle(\"on\");\n})\n```\n\n示例 2\n\n```javascript\n\
    const person1 = {\n  age: 10,\n  grow: function() {\n    this.age++;\n    console.log(this.age);\n\
    \  }\n}\nperson1.grow(); // 11\nconst person2 = {\n  age: 10,\n  grow: () => {\n\
    \    // error: this refers to the `Window` Object\n    this.age++;\n    console.log(this.age);\n\
    \  }\n}\nperson2.grow();\n```\n\n箭头函数与普通函数的另一个区别在于对 `arguments` 对象的访问。\n\n`arguments`\
    \ 对象是一个类数组对象，我们可以在函数内部访问它，它包含传递给该函数的参数值。\n\n一个简单的示例：\n\n```javascript\nfunction\
    \ example(){\n  console.log(arguments[0])\n}\nexample(1,2,3); // 1\n```\n\n如你所见，我们使用数组表示法\
