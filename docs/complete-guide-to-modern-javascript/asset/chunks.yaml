    \ one parameter we can drop the parenthesis and write:\n\n```\nvar greeting =\
    \ name => {\n  return `hello ${name}`;\n}\n```\n\nIf we have no parameter at all\
    \ we need to write empty parenthesis like this:\n\n```\nvar greeting = () => {\n\
    \  return \"hello\";\n}\n```\n\n## Implicitly return\n\nWith arrow functions we\
    \ can skip the explicit return and return like this:\n\n```\nconst greeting =\
    \ name => `hello ${name}`;\n```\n\nLook at a side by side comparison with an old\
    \ ES5 Function:\n\n```\nconst oldFunction = function(name){\n  return `hello ${name}`\n\
    }\nconst arrowFunction = name => `hello ${name}`;\n```\n\nBoth functions achieve\
    \ the same result, but the new syntax allows you to be more concise.\n\nBeware!\
    \ Readability is more important than conciseness so you might want to write your\
