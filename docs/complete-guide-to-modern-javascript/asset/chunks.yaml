    \ 20: ES2018 Async Iteration and more?\n\nIn this chapter we will look at what\
    \ was introduced with ES2018.\n\n## Rest / Spread for Objects\n\nRemember how\
    \ ES6 (ES2015) allowed us to do this?\n\n```javascript\nconst veggie = [\"tomato\"\
    ,\"cucumber\",\"beans\"];\nconst meat = [\"pork\",\"beef\",\"chicken\"];\nconst\
    \ menu = [...veggie,  \"pasta\", ...meat];\nconsole.log(menu);\n// Array [ \"\
    tomato\", \"cucumber\", \"beans\", \"pasta\", \"pork\", \"beef\", \"chicken\"\
    \ ]\n```\n\nNow we can use the rest/spread syntax for objects too, let's look\
    \ at how:\n\n```javascript\nlet myObj =  {\n  a:1,\n  b:3,\n  c:5,\n  d:8,\n}\n\
    // we use the rest operator to grab everything else left in the object.\nlet \
    \ { a, b, ...z  }  = myObj;\nconsole.log(a);  // 1\nconsole.log(b);  // 3\nconsole.log(z);\
    \  // {c: 5, d: 8}\n\n// using the spread syntax we cloned our Object\nlet clone\
    \ =  { ...myObj  };\nconsole.log(clone); // {a: 1, b: 3, c: 5, d: 8}\n\nmyObj.e\
    \  =  15;\nconsole.log(clone) // {a: 1, b: 3, c: 5, d: 8}\nconsole.log(myObj)\
