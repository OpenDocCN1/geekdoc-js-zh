    In case of synchronous code we would expect the line subsequent line to be called
    only after the fetch has been complete but in reality what is going to happen
    is that fetch will be called and straight away the subsequent two console.log
    will also be called, resulting in the last one console.log(data) to return undefined.


    This happens because fetch performs asynchronously, which means that the code
    won''t stop running once it hits that line but, instead, will continue executing.


    What we need, is a way of waiting until fetch returns us something before we continue
    executing our code.


    To avoid this we would use callbacks or promises.


    ### Callback hell


    You may have heard of something called callback hell, which is something that
    happens when we try to write asynchronous code as if it was synchronous, meaning
    that we try to chain each block of code after the other.


    In simple words it would something like:


    do A, If A do B, if B do C and so on and so forth.


    The following is an example just to showcase the meaning of the callback hell.
    Imagine each step is asynchronous meaning that we need to send a request to our
    server for each step of preparing the pizza and we need to wait for the server
    to respond.


    const makePizza = (ingredients, callback) =>  { mixIngredients(ingredients,  function(mixedIngredients)){
    bakePizza(mixedIngredients,  function(bakedPizza)){ console.log(''finished!'')
    } } }


    We try to write our code in a way where executions happens visually from top to
    bottom, causing excessive nesting on functions and result in what you can see
    above.


    To improve your callbacks you can check out [http://callbackhell.com/](http://callbackhell.com/)


    Promises will help us escape this "hell" and improve our code.


    ## What is a Promise?


    From MDN:


    A Promise is an object representing the eventual completion or failure of an asynchronous
    operation.


    Have a quick look at the following example:


    const data =  fetch(''your-api-url-goes-here''); console.log(''Finished''); console.log(data);


    ## Create your own promise


    const myPromise =  new  Promise((resolve, reject) =>  { // your code goes here
    });


