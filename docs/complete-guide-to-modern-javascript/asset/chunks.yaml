  trans: "\n枚举是一种为一组数值赋予名称的方式：\n\n```\nenum Status {deleted, pending, active}\nconst\
    \ blogPostStatus: Status = Status.active;\nconsole.log(blogPostStatus); // 2\n\
    ```\n\n枚举内部的值从 0 开始，因此在我们的示例中，`active` 对应 2，`pending` 对应 1，`deleted` 对应 0。\n\n\
    说博客文章的状态是 `active` 比说它是 2 要有意义得多。\n\n如果你愿意，可以通过如下方式指定枚举的起始值来覆盖默认值：\n\n```\nenum\
    \ Status {deleted = -1, pending, active}\nconst blogPostStatus: Status = Status.active;\n\
    console.log(blogPostStatus); // 1\n```\n\n现在 `deleted` 对应 -1，`pending` 对应 0，`active`\
    \ 对应 1，比以前好多了。\n\n我们还可以根据枚举的值来访问枚举中的成员：\n\n```\nenum Status {deleted = -1, pending,\
    \ active}\nconsole.log(Status[0]); // pending\n```\n\n### any\n\n顾名思义，`any` 表示某个变量的值可以是任何类型。\n\
    \n当我们处理不支持 TypeScript 的第三方库，或者将现有代码从纯 JavaScript 升级时，可能会用到它。\n\n`any` 允许我们访问可能不存在的属性和方法。\n\
    \n当我们只了解类型的一部分时，也可以使用 `any`：\n\n```\nlet firstUser: Object<any> = { name: 'Alberto',\
    \ age: 27 }\nlet secondUser: Object<any> = { name: 'Caroline' }\n```\n\n我们期望这两个变量都是对象类型，但不确定它们的属性，因此我们使用\
    \ `any`。\n\n### void\n\n顾名思义，`void` 定义了类型的缺失。\n\n它常用于如下场景：\n\n```\nfunction storeValueInDatabase(objectToStore):\
    \ void {\n  // 将你的值存储到数据库中\n}\n```\n\n这个函数接收一个对象并将其存储到数据库中，但不返回任何内容，因此我们将其返回值设为\
    \ `void`。\n\n当声明 `void` 类型的变量时，你只能将 `null` 和 `undefined` 赋值给它。\n\n### null 和 undefined\n\
    \n与 `void` 类似，创建 `null` 或 `undefined` 类型的变量并不是很有用，因为我们只能将 `null` 和 `undefined`\
    \ 作为值赋给它们。\n\n在讨论联合类型时，你会看到这两种类型的用途。\n\n### never\n\n`never` 表示永远不会出现的值，例如，我们可以将其用于从不返回或总是抛出错误的函数。\n\
    \n```\nfunction throwError(error: string): never {\n  throw new Error(error)\n\
    }\n```\n\n这个函数只抛出错误，永远不会返回任何值。\n\n## 接口、类等更多内容\n\n### 接口\n\n在前面某个示例中，我这样设置了变量的类型：`Array<{label:\
    \ string, value: string}>`\n\n但如果变量的形状更复杂，并且需要在多个地方重复使用呢？\n\n我们可以使用接口来定义该变量应有的形状。\n\
    \n```\ninterface Car {\n  wheels: number;\n  color: string;\n  brand: string;\n\
    }\n```\n\n注意，接口不是对象，我们使用 `;` 而不是 `,`。\n\n我们还可以像这样设置可选属性：\n\n```\ninterface Car\
    \ {\n  wheels: number;\n  color: string;\n  brand: string;\n  coupe?: boolean;\n\
    }\n```\n\n`?` 将属性定义为可选的，即使我们在创建新汽车对象时没有包含它，TypeScript 也不会报错。\n\n也许我们不希望某些属性在对象创建后可以被修改，在这种情况下，我们可以将它们标记为\
    \ `readonly`。\n\n```\ninterface Car {\n  readonly wheels: number;\n  color: string;\n\
    \  brand: string;\n  coupe?: boolean;\n}\n```\n\n在创建汽车对象时，我们可以设置轮子数量，但之后就无法更改了。\n\
    \n使用接口，我们还可以为函数创建形状，而不仅仅是对象。\n\n```\ninterface Greet {\n  (greeting: string, name:\
    \ string): string\n}\nlet greetingFunction: Greet;\ngreetingFunction = (greeting:\
    \ string, name: string): string => {\n  console.log(`${greeting} ${name}`);\n\
    \  return `${greeting} ${name}`;\n}\ngreetingFunction('Bye', 'Alberto');\n```\n\
    \n我们创建了函数应有的形状，然后将变量赋给一个符合该形状的函数。\n\n如果我们将变量赋给一个形状不同的函数，就会抛出错误。\n\n### 扩展接口\n\n\
    一个接口可以扩展另一个接口，并继承前一个接口的成员：\n\n```\ninterface Vehicle {\n  wheels: number;\n  color:\
    \ string;\n}\ninterface Airplane extends Vehicle {\n  wings: number;\n  rotors:\
    \ number;\n}\n```\n\n如你所见，一个飞机类型的对象将期望拥有所有四个属性，而不仅仅是 `Airplane` 接口中定义的两个。\n\n\
    ### 类\n\nTypeScript 类与 ES6 类非常相似，允许我们执行原型继承，为应用程序构建可复用的组件。\n\n提醒一下它们的样子：\n\n```\n\
    class Animal {\n  eat = () => { console.log('gnam gnam'); }\n  sleep = () => {\
    \ console.log('zzzz'); }\n}\nclass Human extends Animal {\n  work = () => { console.log('zzzzzzz');\
    \ }\n}\nconst me = new Human();\nme.work(); // zzzzzzz\nme.eat(); // gnam gnam\n\
    me.sleep() // zzzz\n```\n\n我们创建了两个类，第二个类从第一个类继承了两种方法。\n\n与 ES6 类的一个区别是，TypeScript\
    \ 允许我们定义类成员在应用程序中的访问方式。\n\n如果我们希望它们在任何地方都可访问，需要使用关键字 `public`。\n\n```\nclass Animal\
    \ {\n  public eat = () => { console.log('gnam gnam') }\n  public sleep = () =>\
    \ { console.log('zzzz') }\n}\nconst dog = new Animal();\ndog.eat(); // gnam gnam\n\
    ```\n\n在 JavaScript 中，所有类成员都是公开的，我们无法限制对它们的访问。\n\nTypeScript 还允许我们将成员标记为 `private`，这意味着它将无法从类外部访问。\n\
    \n```\nclass Animal {\n  public eat = () => { console.log('gnam gnam') }\n  public\
    \ sleep = () => { console.log('zzzz') }\n}\nclass Human extends Animal {\n  private\
    \ work = () => { console.log('zzzzzzz') }\n}\nconst me = new Human();\nme.work();\
    \ // 属性 'work' 是私有的，只能在类 'Human' 内部访问\n```\n\n我们还可以将成员标记为 `protected`，这意味着它只能在声明它的类以及扩展它的类内部访问。\n\
    \n```\nclass Human {\n  protected work = () => { console.log('zzzzzzz') }\n}\n\
    class Adult extends Human {\n  public doWork = () => { console.log(this.work)\
    \ }\n}\n```\n\n类 `Adult` 扩展了类 `Human`，因此它可以访问相同的受保护方法。\n\n## 交叉类型和联合类型\n\n我们已经了解了如何使用\
    \ TypeScript 定义基本类型，现在让我们深入探讨更高级的类型。\n\n### 交叉类型\n\n顾名思义，交叉类型允许我们将多个类型合并在一起。让我们看看如何使用它们：\n\
    \n```\ninterface Person {\n  sex: 'male' | 'female' | 'N/A'\n  age: number,\n\
    }\ninterface Worker {\n  job: string\n}\ntype Adult = Person & Worker;\nconst\
    \ me: Adult = { sex: 'male', age: 27, job: 'software developer' }\nconsole.log(me);\
    \ // { sex: 'male', age: 27, job: 'software developer' }\n```\n\n如你所见，我们有两个不同的类型\
    \ `Person` 和 `Worker`，我们将它们组合在一起创建了类型 `Adult`，它是两者的结合。\n\n注意，当组合具有相同名称但不同类型的属性时，要小心，因为这会导致编译器报错。\n\
    \n### 联合类型\n\n```\nconst attendee = string | string[];\n```\n\n该变量可以是 `string`\
    \ 或字符串数组。\n\n另一个例子可能是：\n\n```\nconst identifier = string | number | string[];\n\
    ```\n\n我们使用管道符（`|`）来分隔每个类型。\n\n请记住，我们只能访问联合类型中所有类型的公共成员。\n\n```\ninterface Kid\
    \ { age: number }\ninterface Adult { age: number, job: string }\nfunction person():\
    \ Kid | Adult { return { age: 27 } }\nconst me = person();\nme.age  // ok\nme.job\
    \  // error\n```\n\n属性 `job` 只存在于接口 `Adult` 中，而不存在于 `Kid` 中，因此我们无法在联合类型中访问它。\n\
    \n### 结论\n\n本节向你展示了为什么 TypeScript 在使用 JavaScript 时是一个有用的工具，尤其是在与他人协作时。\n\n现在剩下要做的就是开始一个简单的项目，并熟悉它。\n"
- fmt: "\nAt first it may seems like a chore to have to type your variables but once\
    \ the project grows and it gets more complicated, you will start noticing how\
    \ beneficial it is, especially when coming back to a project after months spent\
    \ working on something else.\n\nFor every further query you have regarding TypeScript,\
    \ the best resource I would suggest is the official documentation that can be\
    \ found at this link: <https://www.TypeScriptlang.org/docs/>.\n\n## TypeScript\
    \ Quiz\n\n### TS-01 Which one of these is not a real basic type of TypeScript?\n\
    \n![bullet](images/bullet_nb_square-blk.png)`Tuple`\n\n![bullet](images/bullet_nb_square-blk.png)`void`\n\
    \n![bullet](images/bullet_nb_square-blk.png)`enum`\n\n![bullet](images/bullet_nb_square-blk.png)`every`\n\
    \n### TS-02 What is the correct type of the following variable?\n\n```\nconst\
    \ x = 0xf00d;\n```\n\n![bullet](images/bullet_nb_square-blk.png)`string`\n\n![bullet](images/bullet_nb_square-blk.png)`void`\n\
    \n![bullet](images/bullet_nb_square-blk.png)`hex`\n\n![bullet](images/bullet_nb_square-blk.png)`number`\n\
    \n### TS-03 Which of the following type definition is wrong?\n\n![bullet](images/bullet_nb_square-blk.png)`const\
    \ firstArray: number[] = [1,2,3]`\n\n![bullet](images/bullet_nb_square-blk.png)`const\
    \ firstArray: Array<number> = [1,2,3]`\n\n![bullet](images/bullet_nb_square-blk.png)`const\
    \ firstArray: number<Array> = [1,2,3]`\n\n### TS-04 What is the correct output\
    \ of the following code?\n\n```\nenum Rank {first, second, third}\nconst myRank:\
    \ Rank = Rank.second;\nconsole.log(myRank);\n```\n\n![bullet](images/bullet_nb_square-blk.png)`\"\
    second\"`\n\n![bullet](images/bullet_nb_square-blk.png)`{second:1}`\n\n![bullet](images/bullet_nb_square-blk.png)`true`\n\
    \n![bullet](images/bullet_nb_square-blk.png)`2`\n\n![bullet](images/bullet_nb_square-blk.png)`1`\n\
    \n### TS-05 What is the correct way of defining an Interface?\n\n![bullet](images/bullet_nb_square-blk.png)`interface\
    \ Car = { wheels: number }`\n\n![bullet](images/bullet_nb_square-blk.png)`interface\
    \ Car { wheels = number }`\n\n![bullet](images/bullet_nb_square-blk.png)`interface\
    \ Car { wheels: number }`\n\n![bullet](images/bullet_nb_square-blk.png)`interface\
    \ Car = { wheels = number }`\n\n# Conclusion\n\nI sincerely thank you for making\
    \ it this far. This is my first book and knowing that somebody read it all fills\
    \ me with joy.\n\nI hope that you found it useful and if that is the case I suggest\
    \ you to follow my new [website](https://www.inspiredwebdev.com/) ([inspiredwebdev.com](http://inspiredwebdev.com))\
    \ and my [DevTo](https://dev.to/albertomontalesi) (https://dev.to/albertomontalesi)\
    \ where I write articles about Web Development.\n\nThank you very much for your\
    \ time and your support.\n\nA special thanks to all the users on GitHub that made\
    \ pull requests and opened issues to help fix mistakes and improve the quality\
    \ of the book.\n\n# Quiz Solutions\n\n## Introduction to JavaScript solutions\n\
    \n### JS-01\n\n1. `var important! = \"important!\"`\n\nVariable names cannot contain\
    \ punctuation marks\n\n### JS-02\n\n1. `Object`\n\n### JS-03\n\n1. `const car\
    \ = { color: \"red\" }`\n\n### JS-04\n\n1. `false`\n\n### JS-05\n\n1. `[\"melon\"\
    , \"apple\", \"banana\", \"orange\"]`\n\n### End of Chapter 1 Quiz Solutions\n\
    \n### 1.1\n\n1. `Good morning`\n\n### 1.2\n\n1. `2`\n\n### 1.3\n\n1. `100`\n\n\
    ### 1.4\n\n1. `ReferenceError`\n\n### End of Chapter 2 Quiz\n\n### 2.1\n\n1. `B`\n\
    \nThe correct syntax for an arrow function is the so called fat arrow `=>`\n\n\
    ### 2.2\n\n1. `10`\n\nInside an arrow function, the `this` keyword inherits from\
    \ its parent scope which in this case it's the window, therefore the age remains\
    \ 10.\n\n### 2.3\n\n```\n(arg) => { console.log(arg); }\n```\n\n### End of Chapter\
    \ 3 Quiz\n\n### 3.1\n\n```\nfunction calculatePrice(total, tax = 0.1, tip = 0.05)\
    \ {\n  // When no value is given for tax or tip, the default 0.1 and 0.05 will\
    \ be used\n  return total + (total * tax) + (total * tip);\n}\n```\n\n### 3.2\n\
    \n1. `10`\n\n### End of Chapter 4 Quiz\n\n### 4.1\n\n```\nlet result = `${a} ${c}\
    \ ${d} ${b} ${e}`;\n```\n\n### 4.2\n\n```\nlet result = `${a} ${c} ${b} ${e} ${d}`;\n\
    console.log(result); // 1 plus 2 equals 3\n```\n\n### 4.3\n\n```\nconsole.log(`this\
    \ is a very long text a very long text`);\n// this is a very long text\n// a very\
    \ long text\n```\n\n### End of Chapter 5 Quiz\n\n### 5.1\n\n1. `true`\n\nit will\
    \ begin checking after 3 characters\n\n### 5.2\n\n1. `false`\n\n`endsWith` is\
    \ case sensitive\n\n### 5.3\n\n```\nlet batman = `${str.repeat(8)} ${bat}`;\n\
    console.log(batman); // \"NaNaNaNaNaNaNaNa BatMan\"\n```\n\n### End of Chapter\
    \ 6 Quiz\n\n### 6.1\n\n```\nlet hungry = \"yes\";\nlet full = \"no\";\n[hungry,\
    \ full] = [full, hungry];\nconsole.log(hungry); // no\nconsole.log(full); // yes\n\
    ```\n\n### 6.2\n\n```\nlet arr = [\"one\", \"two\", \"three\"];\n// solution:\n\
    let [one, two, three] = arr;\nconsole.log(one); // \"one\"\nconsole.log(two);\
    \ // \"two\"\nconsole.log(three); // \"three\"\n```\n\n### End of Chapter 7 Quiz\n\
    \n### 7.1\n\n1. `for of`\n\n### 7.2\n\n1. `Tom Jerry Mickey`\n\n### End of Chapter\
    \ 8 Quiz\n\n### 8.1\n\n```\nArray.from(apple);\n```\n\n### 8.2\n\n1. `4`\n\n`Array.find()`\
    \ will return the first element that matches our condition.\n\n### 8.3\n\n1. `true`\n\
    \n`Array.some()` will return `true` if one element matches the give condition\n\
    \n### 8.4\n\n1. `[1,4,9]`\n\nThe map function we passed will return `x * x` for\
    \ each of the values in the array\n\n### End of Chapter 9 Quiz\n\n### 9.1\n\n\
    1. `[...]`\n\n### 9.2\n\n```\nconst menu = [...veggie, \"pasta\", ...meat];\n\
    ```\n\n### 9.3\n\n```\nconst [first, second, ...losers] = runners;\nconsole.log(...losers);\n\
    ```\n\nWe use the rest operator to grab all the values remaining after the first\
    \ two\n\n### 9.4\n\n1. `[1, 2, 3, 4, 5]`\n\n### End of Chapter 10 Quiz\n\n###\
    \ 10.1\n\n```\nconst animal = { name, age, breed };\n```\n\n### 10.2\n\n1. `\"\
    Alberto\"`\n\n### 10.3\n\n1. `color is not defined`\n\nsince the variable name\
    \ and the property name don't match we needed to write: `color: favoriteColor`\
    \ instead of just `color`\n\n### End of Chapter 11 Quiz\n\n### 11.1\n\n1. `a primitive`\n\
    \nSymbols are a new type of primitive introduced in ES6\n\n### 11.2\n\n1. `they\
    \ are unique`\n\nSymbols are always unique\n\n### 11.3\n\n1. `Tom Jim`\n\nThe\
    \ second time we assigned `\"Tom\"` we overwrote the first `\"Tom\"` because we\
    \ did not use a symbol.\n\n### 11.4\n\n1. `Symbol(Tom) Symbol(Jane) Symbol(Tom)`\n\
    \nThis time we see all three of them because we stored them in a symbol, keeping\
    \ them unique and avoiding naming collisions.\n\n### End of Chapter 12 Quiz\n\n\
    ### 12.1\n\n1. `just syntactic sugar`\n\nclasses are primarily syntactic sugar\
    \ over JavaScript’s existing prototype-based inheritance. The class syntax does\
    \ not introduce a new object-oriented inheritance model to JavaScript.\n\n###\
    \ 12.2\n\n1. `const person = class Person {...}`\n\n1. `class Person {...}`\n\n\
    both answer 1 and 3 are correct. The first one is called class expression while\
    \ the second one is called class declaration.\n\n### 12.3\n\n1. `A method that\
    \ can be accessed only by the class itself`\n\nA static method is A method that\
    \ can only be accessed by the class itself.\n\n### 12.4\n\n1. `ReferenceError:\
    \ Must call super constructor in derived class before accessing 'this'`\n\n###\
    \ 12.5\n\n```\nclass Adult extends Person {\n  constructor(name, age, work) {\n\
    \    super(name, age);\n    this.work = work;\n  }\n}\n```\n\nRemember to add\
    \ the keyword `super` to create the original class before you extend it.\n\n###\
    \ End of Chapter 13 Quiz\n\n### 13.1\n\n1. `is an object representing the eventual\
    \ completion or failure of an asynchronous operation`\n\n### 13.2\n\n```\nconst\
    \ myPromise = new Promise((resolve, reject) => {\n  resolve();\n  console.log(\"\
    Good job!\");\n});\n```\n\n### 13.3\n\n1. `Promise.some()`\n\n### 13.4\n\n1. `3,4`\n\
    \nFor the first two `.then` we did only passed one argument, meaning that we were\
    \ calling `console.log` only if the promise resolved, but in our example it was\
    \ being rejected. In the case of `.catch` the first argument is the callback for\
    \ when a promise is being rejected and that is why we can see 3 being logged in\
    \ the console. The latest `.then` is chained off of the promise created by `.catch`\
    \ which resolved and therefore we also see 4 being logged.\n\n### End of Chapter\
    \ 14 Quiz\n\n### 14.1\n\n1. `function*(){...}`\n\n### 14.2\n\n1. `It can be stopped\
    \ and restarted`\n\n### 14.3\n\n1. `Object { value: \"Pomelo\", done: false }`\n\
    \nThe last output of `fruits.next();` is `Object { value: \"Pomelo\", done: false\
    \ }`. Be careful that `done` is set to `false` and not `true`.\n\n### 14.4\n\n\
    1. `Object { value: undefined, done: true }`\n"
  raw: 'At first it may seems like a chore to have to type your variables but once
    the project grows and it gets more complicated, you will start noticing how beneficial
    it is, especially when coming back to a project after months spent working on
    something else.


    For every further query you have regarding TypeScript, the best resource I would
    suggest is the official documentation that can be found at this link: https://www.TypeScriptlang.org/docs/
    .


    ## TypeScript Quiz


    ### TS-01 Which one of these is not a real basic type of TypeScript?


    ![bullet](images/bullet_nb_square-blk.png)Tuple


    ![bullet](images/bullet_nb_square-blk.png)void


    ![bullet](images/bullet_nb_square-blk.png)enum


    ![bullet](images/bullet_nb_square-blk.png)every


    ### TS-02 What is the correct type of the following variable?


    const x =  0xf00d;


    ![bullet](images/bullet_nb_square-blk.png)string


    ![bullet](images/bullet_nb_square-blk.png)void


    ![bullet](images/bullet_nb_square-blk.png)hex


    ![bullet](images/bullet_nb_square-blk.png)number


    ### TS-03 Which of the following type definition is wrong?


    ![bullet](images/bullet_nb_square-blk.png)const firstArray: number[] = [1,2,3]


    ![bullet](images/bullet_nb_square-blk.png)const firstArray: Array<number> = [1,2,3]


    ![bullet](images/bullet_nb_square-blk.png)const firstArray: number<Array> = [1,2,3]


    ### TS-04 What is the correct output of the following code?


    enum Rank {first, second, third} const myRank: Rank =  Rank.second; console.log(myRank);


    ![bullet](images/bullet_nb_square-blk.png)"second"


    ![bullet](images/bullet_nb_square-blk.png){second:1}


    ![bullet](images/bullet_nb_square-blk.png)true


    ![bullet](images/bullet_nb_square-blk.png)2


    ![bullet](images/bullet_nb_square-blk.png)1


    ### TS-05 What is the correct way of defining an Interface?


    ![bullet](images/bullet_nb_square-blk.png)interface Car = { wheels: number }


    ![bullet](images/bullet_nb_square-blk.png)interface Car { wheels = number }


    ![bullet](images/bullet_nb_square-blk.png)interface Car { wheels: number }


    ![bullet](images/bullet_nb_square-blk.png)interface Car = { wheels = number }


    # Conclusion


    I sincerely thank you for making it this far. This is my first book and knowing
    that somebody read it all fills me with joy.


    I hope that you found it useful and if that is the case I suggest you to follow
    my new [website](https://www.inspiredwebdev.com/) ([inspiredwebdev.com](http://inspiredwebdev.com))
    and my [DevTo](https://dev.to/albertomontalesi) (https://dev.to/albertomontalesi)
    where I write articles about Web Development.


    Thank you very much for your time and your support.


    A special thanks to all the users on GitHub that made pull requests and opened
    issues to help fix mistakes and improve the quality of the book.


    # Quiz Solutions


    ## Introduction to JavaScript solutions


    ### JS-01


    1.  var important! = "important!"


    Variable names cannot contain punctuation marks


    ### JS-02


    1.  Object


    ### JS-03


