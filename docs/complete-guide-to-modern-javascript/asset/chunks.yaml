    \ bind them to a variable:\n\n```\nconst greeting = name => `hello ${name}`;\n\
    greeting(\"Tom\");\n```\n\n## Arrow function and the `this` keyword\n\nYou need\
    \ to be careful when using arrow functions in conjunction with the `this` keyword,\
    \ as they behave differently from normal functions.\n\nWhen you use an arrow function,\
    \ the `this` keyword is inherited from the parent scope.\n\nThis can be useful\
    \ in cases like this one:\n\n<bdi><div class=\"box open\"></bdi> <bdi>This is\
    \ a box </div></bdi>\n\n<bdi>.opening {</bdi> <bdi>background-color:red; }</bdi>\n\
    \n```\n// grab our div with class box\nconst box = document.querySelector(\".box\"\
    );\n// listen for a click event\nbox.addEventListener(\"click\", function() {\n\
    \  // toggle the class opening on the div\n  this.classList.toggle(\"opening\"\
    );\n  setTimeout(function(){\n    // try to toggle again the class\n    this.classList.toggle(\"\
    opening\");\n  },500);\n});\n```\n\nThe problem in this case is that the first\
    \ `this` is bound to the `const box` but the second one, inside the `setTimeout`,\
    \ will be set to the Window object, throwing this error:\n\n```\nUncaught TypeError:\
    \ cannot read property \"toggle\" of undefined\n```\n\nSince we know that arrow\
