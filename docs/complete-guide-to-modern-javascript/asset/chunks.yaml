    \ `let`.\n\n```\nvar myInt =  1;\nif(myInt ===  1){\n  let mySecondInt =  2\n\
    \  console.log(mySecondInt); // 2\n}\nconsole.log(mySecondInt); // Uncaught ReferenceError:\
    \ mySecondInt is not defined\n```\n\nThis time we couldn't access the variable\
    \ from outside of the block scope and we got an error `mySecondInt is not defined`.\n\
    \nVariable declared with the keywords `let` or `const` are bound to the block\
    \ scope where they have been declared.\n\nYou will learn more about them in Chapter\
    \ 1.\n\n### The this keyword\n\nThe second important concept I want to discuss\
    \ is the `this` keyword.\n\nLet's first start with a simple example:\n\n```\n\
    const myCar =  {\n  color:  'red',\n  logColor:  function(){\n    console.log(this.color)\n\
    \  }\n}\nmyCar.logColor(); // red\n```\n\nAs you can see in this example, it is\
    \ self-explanatory that the `this` keyword referred to the `myCar` Object.\n"
  raw: 'Look at this comparison between empty objects and objects with the same properties.


    const emptyObj1 =  {}; const emptyObj2 =  {}; emptyObj1 == emptyObj2; // false
    emptyObj1 === emptyObj2; // false const obj1 =  {a:  1}; const obj2 =  {a:  1};
    obj1 == obj2; // false obj1 === obj2; // false


    As you can see, only a comparison between the same object returns true.


    A quick way of making a clone of an Object in JavaScript is to use Object.assign.


    const car =  { color:''red'' } const secondCar =  Object.assign({}, car) car.wheels  =  4;
    console.log(car); // {color: ''red'', wheels: 4} console.log(secondCar); // {color:
    ''red''}


    Updating car did not affect secondCar. Object.assign takes a target object as
    the first argument, and a source as the second one.


    In our example, we used an empty Object as our target and our car as the source.


    If you are ready for a more in-depth look at copying Objects in JavaScript, I
    suggest you this article on [Scotch.io](https://scotch.io/bar-talk/copying-objects-in-javascript)
    at [https://scotch.io/bar-talk/copying-objects-in-javascript](https://scotch.io/bar-talk/copying-objects-in-javascript)


    ### Arrays


    As we have seen, Objects store data in a key value pair. Now we will have a look
    at what an Array is.


    An Array is an Object that stores values in order.


    In the example above we used an Object to store our car because it had specific
    properties that we wanted to be able to access easily via a key.


    If we just want to store a list of items, then there is no need to create an Object.
    Instead, we can use an Array.


    For example:


    const fruitBasket = [''apple'',''banana'',''orange'']


    We access values of an array via their index. Remember that arrays start at position
    0.


    const fruitBasket = [''apple'',''banana'',''orange''] console.log(fruitBasket[0])
    // apple console.log(fruitBasket[1]) // banana console.log(fruitBasket[2]) //
    orange


    There are many methods that we can call on an Array. Let''s have a look at some
    of the most useful.


    const fruitBasket = [''apple'',''banana'',''orange'']; // get the length of the
    Array console.log(fruitBasket.length); // 3 // add a new value at the end of the
    array fruitBasket.push(''pear'') console.log(fruitBasket); // ["apple", "banana",
    "orange", "pear"] // add a new value at the beginning of the array fruitBasket.unshift(''melon'')
    console.log(fruitBasket); // ["melon", "apple", "banana", "orange", "pear"] //
    remove a value from the end of the array fruitBasket.pop() console.log(fruitBasket);
    // ["melon", "apple", "banana", "orange"] // remove a value from the beginning
    of the array fruitBasket.shift() console.log(fruitBasket); // ["apple", "banana",
    "orange"]


    As we can see we can easily add and remove elements from the beginning or the
    end of an Array with these methods.


    You can find a longer list of methods on [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)
    at this link https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array
    .


    ### Determining types using typeof


    We can use typeof to determine the value of our variables. For example:


    const str =  "hello" typeof(str); // string const num =  12 typeof(num) // number
    const arr = [1,2,3] typeof(arr) // object const obj =  {prop:  ''value''} typeof(obj)
    // object


    Remember that ''Array'' is not a type, Arrays are Objects!.


    Everything seems pretty straight forward so far but what if we try something like
    this:


    typeof(null)


    We know that null is a primitive, so should we expect to see null as the result?


    typeof(null) // object


    Long story short, it''s a bug from the first implementation of JavaScript. If
    you want to know more about it, [this article](http://2ality.com/2013/10/typeof-null.html)
    offers a great explanation ([http://2ality.com/2013/10/typeof-null.html)](http://2ality.com/2013/10/typeof-null.html))


    ## Functions


    Functions are a very important tool we use to perform tasks and calculations of
    all kinds.


    In JavaScript we can declare a function in different ways.


    Let''s have a look at a function definition:


    function  greet(name){ console.log("hello "  + name); } greet("Alberto") // hello
    Alberto


    This is a simple function that when called will log a string.


    The variable inside the parenthesis at line 1, is called a parameter while the
    code inside of the curly brackets is a statement, in this case a very simple console.log().


    A very important thing to remember is that primitives are passed to a function
    by value meaning that the changes done to those values are not reflected globally.
    On the other hand if the value is not a primitive, such as an Object or an Array
    it is then passed by reference meaning that any modification done to it will be
    reflected in the original Object.


    let myInt =  1; function  increase(value){ return value +=1; } console.log(myInt);
    // 1 console.log(increase(myInt)); // 2 console.log(myInt); // 1


    As you can see, we increased the value of the integer but that did not affect
    the original variable.


    Let''s see an example with an Object.


    let myCar =  { make:  "bmw", color:  "red" } console.log(myCar) // {make: "bmw",
    color: "red"} function  changeColor(car){ car.color  =  "blue" } changeColor(myCar)
    console.log(myCar) // {make: "bmw", color: "blue"}


    As you can see, since the parameter car was just a reference to the Object  myCar,
    modifying it resulted in a change in the myCar  Object.


    Another way of declaring a function is by using a function expression.


    const greeter =  function  greet(name){ console.log("hello "  + name); } greeter("Alberto")
    // hello Alberto


    Here we assigned our function greet to a const, called greeter.


    We got the same result as in the first example but with a function expression
    we can also create anonymous functions.


    const greeter =  function(name){ console.log("hello "  + name); } greeter("Alberto")
    // hello Alberto


    We changed function greet to function and we got an anonymous function.


    We could also tweak it a little bit further by using an arrow function, introduced
    by ES2015.


    const greeter = (name) =>  { console.log("hello "  + name); } greeter("Alberto")
    // hello Alberto


    The function keyword goes away and we get a nice fat arrow (=>) after the parameters.


    We will look at arrow functions in detail in Chapter 2.


    ## Understanding function scope and the this keyword


    One of the most important concepts to understand in JavaScript is the scope.


    What is Scope? \


    The scope of a variable controls where that variable can be accessed from.


    We can have a global scope meaning that the variable can be accessed from anywhere
    in our code or we can have a block scope meaning that the variable can be accessed
    only from inside of the block where it has been declared.


    A block can be a function, a loop or anything delimited by curly brackets.


    Let''s have a look at two examples, first using the keyword var.


    var myInt =  1; if(myInt ===  1){ var mySecondInt =  2 console.log(mySecondInt);
    // 2 } console.log(mySecondInt); // 2


    As you can see we were able to access the value of mySecondInt event outside of
    the block scope as variables declared with the keyword var are not bound to it.


    Now let''s use the keyword let.


    var myInt =  1; if(myInt ===  1){ let mySecondInt =  2 console.log(mySecondInt);
    // 2 } console.log(mySecondInt); // Uncaught ReferenceError: mySecondInt is not
    defined


    This time we couldn''t access the variable from outside of the block scope and
    we got an error mySecondInt is not defined.


    Variable declared with the keywords let or const are bound to the block scope
    where they have been declared.


    You will learn more about them in Chapter 1.


    ### The this keyword


    The second important concept I want to discuss is the this keyword.


    Let''s first start with a simple example:


    const myCar =  { color:  ''red'', logColor:  function(){ console.log(this.color)
    } } myCar.logColor(); // red


    As you can see in this example, it is self-explanatory that the this keyword referred
    to the myCar Object.'
