    \ 1}\n// {name: \"Justin Gatlin\", race: \"100m dash\", place: 2}\n// {name: \"\
    Asafa Powell\", race: \"100m dash\", place: 3}]\n```\n\nIn this example, we are\
    \ using the `map` function to iterate over the array `runners`. The first argument\
