    # 第 13 章：Promise


    JavaScript 是同步工作的，这意味着每个代码块会在前一个代码块执行完毕后执行。


    ```

    const data = fetch(''your-api-url-goes-here'');


    console.log("Finished");


    console.log(data); }

    ```


    在上面的例子中，我们使用 `fetch` 从 URL 获取数据（在这个例子中，我们只是假装这样做）。


    如果是同步代码，我们会期望后续的行只有在 `fetch` 完成后才会被调用，但实际上会发生的是，`fetch` 被调用后，紧接着两个 `console.log`
    也会被调用，导致最后一个 `console.log(data)` 返回 `undefined`。


    这是因为 `fetch` 是异步执行的，这意味着代码不会在遇到这一行时停止运行，而是会继续执行。


    我们需要一种方法，在继续执行代码之前等待 `fetch` 返回结果。


    为了避免这种情况，我们会使用回调函数或 Promise。


    ### 回调地狱


    你可能听说过一种叫做“回调地狱”的东西，当我们试图以同步的方式编写异步代码时就会发生这种情况，也就是说，我们试图将每个代码块一个接一个地链式执行。


    简单来说，它就像：


    做 A，如果 A 完成则做 B，如果 B 完成则做 C，以此类推。


    以下是一个示例，只是为了展示回调地狱的含义。假设每一步都是异步的，意味着我们需要为准备披萨的每一步向服务器发送请求，并等待服务器响应。


    ```

    const makePizza = (ingredients, callback) =>  { mixIngredients(ingredients,  function(mixedIngredients)){
    bakePizza(mixedIngredients,  function(bakedPizza)){ console.log(''finished!'')
    } } }

    ```


    我们试图以一种从上到下视觉上执行的方式编写代码，导致函数过度嵌套，最终形成你上面看到的结果。


    要改进你的回调函数，可以查看 [`callbackhell.com/`](http://callbackhell.com/)


    Promise 将帮助我们逃离这个“地狱”并改进我们的代码。


    ## 什么是 Promise？


    来自 MDN：


    `Promise` 是一个对象，代表异步操作的最终完成或失败。


    快速看一下下面的例子：


    ```

    const data =  fetch(''your-api-url-goes-here''); console.log(''Finished''); console.log(data);

    ```


    ## 创建你自己的 Promise


    ```

    const myPromise =  new  Promise((resolve, reject) =>  { // 你的代码写在这里 });

    ```


    这就是创建你自己的 Promise 的方式，`resolve` 和 `reject` 会在 Promise 完成时被调用。


    我们可以立即返回它，看看会得到什么：


    ```

    const myPromise =  new  Promise((resolve, reject) =>  { resolve("我们从 Promise 中得到的值");
    }); myPromise.then( data =>  { console.log(data); }); // 我们从 Promise 中得到的值

    ```


    我们立即解决了 Promise，并在控制台中看到了结果。


    我们可以结合 `setTimeout()` 来等待一段时间再解决。


    ```

    const myPromise =  new  Promise((resolve, reject) =>  { setTimeout(() =>  { resolve("我们从
    Promise 中得到的值"); },  2000); }); myPromise.then( data =>  { console.log(data);
    }); // 2 秒后 ... // 我们从 Promise 中得到的值

    ```


    这两个例子非常简单，但 Promise 在处理大量数据请求时非常有用。


    在上面的例子中，我们保持简单，只解决了 Promise，但实际上你也会遇到错误，所以让我们看看如何处理它们：


    ```

    const myPromise =  new  Promise((resolve, reject) =>  { setTimeout(() =>  { reject(Error("这是我们的错误"));
    },  2000); }); myPromise .then(data =>  { console.log(data); }) .catch(err =>  {
    console.error(err); }) // Error: 这是我们的错误 // Stack trace: // myPromise</<@debugger
    eval code:3:14

    ```


    我们使用 `.then()` 来获取 Promise 解决时的值，使用 `.catch()` 来获取 Promise 拒绝时的值。


    查看我们的错误日志，你可以看到它告诉我们错误发生的位置，这是因为我们写了 `reject(Error("这是我们的错误"));` 而不是简单的 `reject("这是我们的错误");`。


    ### 链式 Promise


    我们可以一个接一个地链式调用 Promise，使用前一个 Promise 返回的值作为后一个 Promise 的基础，无论 Promise 是解决还是拒绝。


    你可以链式调用任意数量的 Promise，代码仍然会比我们在上面回调地狱中看到的更易读、更简洁。


    ```

    const myPromise =  new  Promise((resolve, reject) =>  { resolve(); }); myPromise
    .then(data =>  { // 返回一些新内容 return  ''working...'' }) .then(data =>  { // 记录从上一个
    Promise 得到的数据 console.log(data); throw  ''failed!''; }) .catch(err =>  { // 捕获上一个
    Promise 的错误并记录 console.error(err); // failed! })

    ```


    如你所见，第一个 `then` 将一个值传递给了第二个 `then`，我们在那里记录了它，并且还抛出了一个错误，该错误被 `catch` 子句捕获。


    我们不仅可以在成功时链式调用，也可以在拒绝时链式调用。


    ```

    const myPromise =  new  Promise((resolve, reject) =>  { resolve(); }); myPromise
    .then(data =>  { throw  new  Error("ooops"); console.log("first value"); }) .catch(()
    =>  { console.log("catch an error"); }) .then(data =>  { console.log("second value");
    }); // catch an error // second value

    ```


    我们没有得到“first value”，因为我们抛出了一个错误，所以只得到了第一个 `.catch()` 和最后一个 `.then()`。


    ### `Promise.resolve()` 和 `Promise.reject()`


    `Promise.resolve()` 和 `Promise.reject()` 会创建自动解决或拒绝的 Promise。


    ```

    //Promise.resolve() Promise.resolve(''Success'').then(function(value) { console.log();
    // "Success" },  function(value) { cnsole.log(''fail'') }); // Promise.reject()
    Promise.reject(new  Error(''fail'')).then(function() { // 不会被调用 },  function(error)
    { console.log(error); // Error: fail });

    ```


    如你在第一个例子中所见，`then` 子句中创建的 Promise 有两个参数，一个函数在 Promise 解决时被调用，另一个在 Promise 拒绝时被调用。由于
    `Promise.resolve()` 立即解决了 Promise，因此第一个函数被调用。


    第二个例子中则相反，我们使用 `Promise.reject()` 立即拒绝 Promise，因此 `then` 子句的第二个参数被调用。


    ### `Promise.all()` 和 `Promise.race()`


    `Promise.all()` 返回一个单一的 Promise，当所有 Promise 都解决时，该 Promise 才会解决。


    让我们看一个有两个 Promise 的例子。


    '
