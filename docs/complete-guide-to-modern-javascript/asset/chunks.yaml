    # Chapter 1: Var vs Let vs Const & the temporal dead zone


    With the introduction of `let` and `const` in ES6, we can now better define our
    variables depending on our needs. During our JavaScript primer we looked at the
    basic differences between these 3 keywords, now we will go into more detail.


    ### Var


    Variables declared with the `var` keyword are function scoped, which means that
    if we declare them inside a for loop (which is a block scope) they will be available
    even outside of it.


    ```

    for (var i =  0; i <  10; i++) { var leak =  "I am available outside of the loop";
    } console.log(leak); // I am available outside of the loop function  myFunc(){
    var functionScoped =  "I am available inside this function"; console.log(functionScoped);
    } myFunc(); // I am available inside this function console.log(functionScoped);
    // ReferenceError: functionScoped is not defined

    ```


    In the first example the value of the `var` leaked out of the block-scope and
    could be accessed from outside of it, whereas in the second example `var` was
    confined inside a function-scope and we could not access it from outside.


    ### Let


    Variables declared with the `let` (and `const`) keyword are block scoped, meaning
    that they will be available only inside of the block where they are declared and
    its sub-blocks.


    ```

    // using `let` let x =  "global"; if (x ===  "global") { let x =  "block-scoped";
    console.log(x); // expected output: block-scoped } console.log(x); // expected
    output: global // using `var` var y =  "global"; if (y ===  "global") { var y=  "block-scoped";
    console.log(y); // expected output: block-scoped } console.log(y); // expected
    output: block-scoped

    ```


    As you can see, when we assigned a new value to the variable declared with `let`
    inside our block-scope, it did not change its value in the outer scope. Whereas,
    when we did the same with the variable declared with `var`, it leaked outside
    of the block-scope and also changed it in the outer scope.


    ### Const


    Similarly to `let`, variables declared with `const` are also block-scoped, but
    they differ in the fact that their value can''t change through re-assignment or
    can''t be re-declared.


    ```

    const constant =  ''I am a constant''; constant =  " I can''t be reassigned";
    // Uncaught TypeError: Assignment to constant variable

    ```


    Important:


    This does not mean that variables declared with `const` are immutable.


    ### The content of a `const` is an `Object`


    ```

    const person =  { name:  ''Alberto'', age:  25, } person.age  =  26; console.log(person.age);
    // 26

    ```

