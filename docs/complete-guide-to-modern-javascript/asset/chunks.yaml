    ## 表达式插值


    在 ES5 中，我们通常这样写：


    ```javascript

    var a =  1; var b =  10; console.log(''1 * 10 is ''  + ( a * b)); // 1 * 10 is
    10

    ```


    在 ES6 中，我们可以使用反引号来减少输入：


    ```javascript

    var a =  1; var b =  10; console.log(`1 * 10 is ${a * b}`); // 1 * 10 is 10

    ```


    ## 创建 HTML 片段


    在 ES5 中，我们通常这样处理多行字符串：


    ```javascript

    // 每行都必须加上反斜杠 var text =  "hello, \ my name is Alberto \ how are you?\ "

    ```


    在 ES6 中，我们只需将所有内容包裹在反引号内，不再需要每行加反斜杠。


    ```javascript

    const content =  `hello, my name is Alberto how are you?`;

    ```


    ## 嵌套模板


    将一个模板嵌套在另一个模板中非常容易，如下所示：


    ```javascript

    const people = [{name:  ''Alberto'',age:  27 },{name:  ''Caroline'',age:  27 },{name:  ''Josh'',age:  31
    }]; const markup =  ` <ul> ${people.map(person =>  `<li> ${person.name}</li>`)}
    </ul> `; console.log(markup); // <ul> // <li> Alberto</li>,<li> Caroline</li>,<li>
    Josh</li> // </ul>

    ```


    这里我们使用 `map` 函数遍历每个人，并显示一个包含人名的 `li` 标签。


    ## 添加三元运算符


    我们可以通过使用三元运算符轻松地在模板字符串中添加一些逻辑。


    三元运算符的语法如下：


    ```javascript

    const isDiscounted =  false function  getPrice(){console.log(isDiscounted ?  "$10"
    : "$20"); } getPrice(); // $20

    ```


    如果 `?` 之前的条件可以转换为 `true`，则返回第一个值，否则返回 `:` 之后的值。


    ```javascript

    // 创建一个包含姓名和年龄的艺术家对象 const artist =  { name:  "Bon Jovi", age:  56, }; // 只有当
    artist 对象有 song 属性时，才将其添加到段落中，否则不返回任何内容 const text =  ` <div> <p> ${artist.name}
    is ${artist.age} years old ${artist.song  ?  `and wrote the song ${artist.song}`
    : ''''  } </p> </div> ` // <div> // <p> Bon Jovi is 56 years old // </p> // </div>
    const artist =  { name:  "Trent Reznor", age:  53, song:  ''Hurt'' }; // <div>
    // <p> Trent Reznor is 53 years old and wrote the song Hurt // </p> // </div>

    ```


    ## 在模板字面量中传递函数


    与上面的示例（代码第 10 行）类似，如果需要，我们可以在模板字面量中传递一个函数。


    ```javascript

    const groceries =  { meat:  "pork chop", veggie:  "salad", fruit:  "apple", others:
    [''mushrooms'',  ''instant noodles'',  ''instant soup''], } // 这个函数将映射 groceries
    中的每个值 function  groceryList(others) { return  ` <p> ${others.map( other =>  `
    <span>${other}</span>`).join(''\n'')} </p> `; } // 在一个 p 标签中显示所有 groceries，最后一个将包含数组
    **others** 中的所有项 const markup =  ` <div> <p>${groceries.meat}</p> <p>${groceries.veggie}</p>
    <p>${groceries.fruit}</p> <p>${groceryList(groceries.others)}</p> <div> ` // <div>
    // <p>pork chop</p> // <p>salad</p> // <p>apple</p> // <p> // <p> // <span>mushrooms</span>
    // <span>instant noodles</span> // <span>instant soup</span> // </p> // </p> //
    <div>

    ```


    在最后一个 `p` 标签中，我们调用了函数 `groceryList`，并将其他 groceries 作为参数传递给它。


    在函数内部，我们返回一个 `p` 标签，并使用 `map` 遍历 grocery 列表中的每一项，返回一个包含每个 grocery 的 `span` 标签数组。然后我们使用
    `.join(''\n'')` 在每个 `span` 之后添加一个新行。


    ## 带标签的模板字面量


    通过给模板字面量添加一个函数标签，我们可以让该函数处理模板字面量，为其提供模板内的所有内容。


    其工作方式非常简单：只需将函数名放在要处理的模板前面。


    ```javascript

    let person =  "Alberto"; let age =  25; function  myTag(strings,personName,personAge){
    let str = strings[1]; let ageStr; personAge >  50  ? ageStr =  "grandpa" : ageStr
    =  "youngster"; return personName + str + ageStr; } let sentence = myTag`${person}
    is a ${age}`; console.log(sentence); // Alberto is a youngster

    ```


    我们捕获了变量 `age` 的值，并使用三元运算符决定打印什么。`strings` 将获取 `let sentence` 中的所有字符串，而其他参数将保存变量。


    在我们的示例中，字符串被分为三部分：`${person}`、`is a` 和 `${age}`。


    我们使用数组表示法来访问中间的字符串，如下所示：


    ```javascript

    let str = strings[1];

    ```


    要了解更多关于模板字面量的用例，请查看[这篇文章](https://codeburst.io/javascript-es6-tagged-template-literals-a45c26e54761)（[`codeburst.io/javascript-es6-tagged-template-literals-a45c26e54761`](https://codeburst.io/javascript-es6-tagged-template-literals-a45c26e54761)）。


