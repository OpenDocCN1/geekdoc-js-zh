    \ 返回 `true`，因为我们回到索引 `-3` 并向前移动，在路径上找到了值 `11`。\n\n## 指数运算符\n\n在 ES2016 之前，我们会这样做：\n\
    \n```\nMath.pow(2,2); // 4\nMath.pow(2,3); // 8\n```\n\n现在有了新的指数运算符，我们可以这样做：\n\
    \n```\n2**2; // 4\n2**3; // 8\n```\n\n当组合多个运算时，它会变得非常有用，例如：\n\n```\n2**2**2; //\
    \ 16\nMath.pow(Math.pow(2,2),2); // 16\n```\n\n使用 `Math.pow()` 需要不断嵌套，代码会变得冗长且混乱。指数运算符提供了一种更快、更简洁的方式来完成相同操作。\n\
    \n## 第 17 章小测验\n\n### 17.1 ES2016 引入了哪个新数组方法？\n\n![bullet](img/bullet_nb_square-blk.png)\
    \ `Array.prototype.contains()`\n\n![bullet](img/bullet_nb_square-blk.png) `Array.prototype.has()`\n\
    \n![bullet](img/bullet_nb_square-blk.png) `Array.prototype.includes()`\n\n![bullet](img/bullet_nb_square-blk.png)\
    \ `Array.prototype.find()`\n\n### 17.2 以下代码的正确输出是什么？\n\n```\nlet array = [1,3,5,7,9,11];\n\
    array.includes(5,4);\n```\n\n![bullet](img/bullet_nb_square-blk.png) `4`\n\n![bullet](img/bullet_nb_square-blk.png)\
    \ `true`\n\n![bullet](img/bullet_nb_square-blk.png) `5`\n\n![bullet](img/bullet_nb_square-blk.png)\
    \ `false`\n\n### 17.3 编写代码完成以下任务：\n\n重构以下代码，使用新的指数运算符。\n\n```\nMath.pow(Math.pow(2,2),2);\
    \ // 16\n```\n\n# 第 18 章：ES2017 字符串填充、`Object.entries()`、`Object.values()` 等\n\
    \nES2017 引入了许多很酷的新特性，我们将在本章中介绍。\n\n## 字符串填充（`.padStart()` 和 `.padEnd()`）\n\n"
- fmt: "\nWe can now add some padding to our strings, either at the end (`.padEnd()`)\
    \ or at the beginning (`.padStart()`) of them.\n\n`\"hello\".padStart(6);` //\
    \ \" hello\" `\"hello\".padEnd(6);` // \"hello \"\n\nWe specified that we want\
    \ 6 as our padding, so then why in both cases did we only get 1 space?\n\nIt happened\
    \ because `padStart` and `padEnd` will go and fill the empty spaces. In our example\
    \ `\"hello\"` is 5 letters, and our padding is 6, which leaves only 1 empty space.\n\
    \nLook at this example:\n\n`\"hi\".padStart(10);` // 10 - 2 = 8 empty spaces //\
    \ \" hi\" `\"welcome\".padStart(10);` // 10 - 6 = 4 empty spaces // \" welcome\"\
    \n\n### Right align with padStart\n\nWe can use `padStart` if we want to right\
    \ align something.\n\n```\nconst strings = [\"short\",  \"medium length\",  \"\
    very long string\"];\nconst longestString =  strings.sort(str =>  str.length).map(str\
    \ =>  str.length)[0];\nstrings.forEach(str =>  console.log(str.padStart(longestString)));\n\
    // very long string\n// medium length\n// short\n```\n\nFirst we grabbed the longest\
    \ of our strings and measured its length. We then applied a `padStart` to all\
    \ the strings based on the length of the longest so that we now have all of them\
    \ perfectly aligned to the right.\n\n### Add a custom value to the padding\n\n\
    We are not bound to just add a white space as a padding, we can pass both strings\
    \ and numbers.\n\n`\"hello\".padEnd(13,\" Alberto\");` // \"hello Alberto\" `\"\
    1\".padStart(3,0);` // \"001\" `\"99\".padStart(3,0);` // \"099\"\n\n## Object.entries()\
    \ and Object.values()\n\nLet's first create an Object.\n\n```\nconst family =\
    \  {\n  father:  \"Jonathan Kent\",\n  mother:  \"Martha Kent\",\n  son:  \"Clark\
    \ Kent\",\n}\n```\n\nIn previous versions of JavaScript we would have accessed\
    \ the values inside the object like this:\n\n```\nObject.keys(family); // [\"\
    father\", \"mother\", \"son\"]\nfamily.father; \"Jonathan Kent\"\n```\n\n`Object.keys()`\
    \ returned only the keys of the object that we then had to use to access the values.\n\
    \nWe now have two more ways of accessing our objects:\n\n```\nObject.values(family);\
    \ // [\"Jonathan Kent\", \"Martha Kent\", \"Clark Kent\"]\nObject.entries(family);\
    \ // [\"father\", \"Jonathan Kent\"]\n// [\"mother\", \"Martha Kent\"]\n// [\"\
    son\", \"Clark Kent\"]\n```\n\n`Object.values()` returns an array of all the values\
    \ whilst `Object.entries()` returns an array of arrays containing both keys and\
    \ values.\n\n## Object.getOwnPropertyDescriptors()\n\nThis method will return\
    \ all the own property descriptors of an object.\n\nThe attributes it can return\
    \ are value, writable, get, set, configurable and enumerable.\n\n```\nconst myObj\
    \ =  {\n  name:  \"Alberto\",\n  age:  25,\n  greet() { console.log(\"hello\"\
    ); },\n}\nObject.getOwnPropertyDescriptors(myObj);\n// age:{value: 25, writable:\
    \ true, enumerable: true, configurable: true}\n// greet:{value: ƒ, writable: true,\
    \ enumerable: true, configurable: true}\n// name:{value: \"Alberto\", writable:\
    \ true, enumerable: true, configurable: true}\n```\n\n## Trailing commas\n\nThis\
    \ is just a minor change to a syntax. Now, when writing objects we can leave a\
    \ trailing comma after each parameter, whether or not it is the last one.\n\n\
    ```\n// from this\nconst object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\"\
    \n}\n// to this\nconst object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\"\
    ,\n}\n```\n\nNotice how I wrote a comma at the end of the second property.\n\n\
    It will not throw any error if you don't put it, but it's a better practice to\
    \ follow as it make your colleague’s or team member’s life easier.\n\n```\n//\
    \ I write\nconst object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\"\n}\n//\
    \ my colleague updates the code, adding a new property\nconst object =  {\n  prop1:\
    \  \"prop\",\n  prop2:  \"propop\"\n  prop3:  \"propopop\"\n}\n// suddenly, he\
    \ gets an error because he did not notice that I forgot to leave a comma at the\
    \ end of the last parameter.\n```\n\n## Shared memory and Atomics\n\nFrom [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Atomics):\n\
    \nWhen memory is shared, multiple threads can read and write the same data in\
    \ memory. Atomic operations make sure that predictable values are written and\
    \ read, that operations are finished before the next operation starts and that\
    \ operations are not interrupted.\n\n`Atomics` is not a constructor, all of its\
    \ properties and methods are static (just like `Math`) therefore we cannot use\
    \ it with a `new` operator or invoke the `Atomics` object as a function.\n\nExamples\
    \ of its methods are:\n\n1.  `add` / `sub`\n\n1.  `and` / `or` / `xor`\n\n1. \
    \ `load` / `store`\n\n`Atomics` are used with `SharedArrayBuffer` (generic fixed-length\
    \ binary data buffer) objects which represent generic, fixed-length raw binary\
    \ data buffer.\n\nLet's have a look at some examples of `Atomics` methods:\n\n\
    ### Atomics.add(), Atomics.sub(), Atomics.load() and Atomics.store()\n\n`Atomics.add()`\
    \ will take three arguments, an array, an index and a value and will return the\
    \ previous value at that index before performing an addition.\n\n```\n// create\
    \ a `SharedArrayBuffer`\nconst buffer =  new  SharedArrayBuffer(16);\nconst uint8\
    \ =  new  Uint8Array(buffer);\n// add a value at the first position\nuint8[0]\
    \ =  10;\nconsole.log(Atomics.add(uint8,  0,  5)); // 10\n// 10 + 5 = 15\nconsole.log(uint8[0])\
    \ // 15\nconsole.log(Atomics.load(uint8,0)); // 15\n```\n\nAs you can see, calling\
    \ `Atomics.add()` will return the previous value at the array position we are\
    \ targeting. when we call again `uint8[0]` we see that the addition was performed\
    \ and we got 15.\n\nTo retrieve a specific value from our array we can use `Atomics.load`\
    \ and pass two argument, an array and an index.\n\n`Atomics.sub()` works the same\
    \ way as `Atomics.add()` but it will subtract a value.\n\n```\n// create a `SharedArrayBuffer`\n\
    const buffer =  new  SharedArrayBuffer(16);\nconst uint8 =  new  Uint8Array(buffer);\n\
    // add a value at the first position\nuint8[0] =  10;\nconsole.log(Atomics.sub(uint8,\
    \  0,  5)); // 10\n// 10 - 5 = 5\nconsole.log(uint8[0]) // 5\nconsole.log(Atomics.store(uint8,0,3));\
    \ // 3\nconsole.log(Atomics.load(uint8,0)); // 3\n```\n\nHere we are using `Atomics.sub()`\
    \ to substract 5 from the value at position `uint8[0]` which is equivalent to\
    \ 10 - 5.\n\nSame as with `Atomics.add()`, the method will return the previous\
    \ value at that index, in this case 10.\n\nWe are then using `Atomics.store()`\
    \ to store a specific value, in this case 3, at a specific index of the array,\
    \ in this case 0, the first position. `Atomics.store()` will return the value\
    \ that we just passed, in this case 3. You can see that when we call `Atomics.load()`\
    \ on that specific index we get 3 and not 5 anymore.\n\n### Atomics.and(), Atomics.or()\
    \ and Atomics.xor()\n\nThese three methods all perform bitwise AND, OR and XOR\
    \ operations at a given position of the array. You can read more about bitwise\
    \ operations on [Wikipedia](https://en.wikipedia.org/wiki/Bitwise_operation) at\
    \ this link https://en.wikipedia.org/wiki/Bitwise_operation\n\n## End of Chapter\
    \ 18 Quiz\n\n### 18.1 What is the correct output of the following code?\n\n`\"\
    hello\".padStart(6);`\n\n![bullet](images/bullet_nb_square-blk.png)`\" hello\"\
    `\n\n![bullet](images/bullet_nb_square-blk.png)`\"hello \"`\n\n![bullet](images/bullet_nb_square-blk.png)`\"\
    \ hello\"`\n\n![bullet](images/bullet_nb_square-blk.png)`\"hello\"`\n\n### 18.2\
    \ Write the code to accomplish the following task:\n\nUse `padStart` to right\
    \ align all three of the following strings.\n\n```\nconst strings = [\"short\"\
    ,  \"medium length\",  \"very long string\"];\n//expected output\n// short\n//\
    \ medium length\n// very long string\n```\n\n### 18.3 Which of the following was\
    \ not added in ES2016?\n\n![bullet](images/bullet_nb_square-blk.png)`Object.entries()`\n\
    \n![bullet](images/bullet_nb_square-blk.png)`Object.keys()`\n\n![bullet](images/bullet_nb_square-blk.png)`Object.values()`\n\
    \n### 18.4 What is the correct output of the following code:\n\n```\nconst buffer\
    \ =  new  SharedArrayBuffer(16);\nconst uint8 =  new  Uint8Array(buffer);\nuint8[0]\
    \ =  10;\nconsole.log(Atomics.add(uint8,  0,  5));\n```\n\n![bullet](images/bullet_nb_square-blk.png)0\n\
    \n![bullet](images/bullet_nb_square-blk.png)10\n\n![bullet](images/bullet_nb_square-blk.png)15\n\
    \n![bullet](images/bullet_nb_square-blk.png)5\n\n### 18.5 What is the correct\
    \ output of the following code:\n\n```\nconst buffer =  new  SharedArrayBuffer(16);\n\
    const uint8 =  new  Uint8Array(buffer);\nuint8[0] =  10;\nAtomics.sub(uint8, \
    \ 0,  6);\nconsole.log(Atomics.load(uint8,0));\n```\n"
