  trans: "\n它会接受一个类数组（即看起来像数组但并非数组的东西），并将其转换为真正的数组。\n\n```html\n<div class=\"fruits\"\
    > <p> Apple </p> <p> Banana </p> <p> Orange </p> </div>\n```\n\n```javascript\n\
    const fruits = document.querySelectorAll(\".fruits p\"); // fruits 是一个节点列表（类数组集合），包含我们的三个\
    \ p 标签\n// 现在我们将其转换为数组\nconst fruitArray = Array.from(fruits);\nconsole.log(fruitArray);\
    \ // [p,p,p]\n// 既然我们现在处理的是数组，就可以使用 map\nconst fruitNames = fruitArray.map(fruit\
    \ => fruit.textContent);\nconsole.log(fruitNames); // [\"Apple\", \"Banana\",\
    \ \"Orange\"]\n```\n\n我们也可以这样简化：\n\n```javascript\nconst fruits = Array.from(document.querySelectorAll(\"\
    .fruits p\"));\nconst fruitNames = fruits.map(fruit => fruit.textContent);\nconsole.log(fruitNames);\
    \ // [\"Apple\", \"Banana\", \"Orange\"]\n```\n\n现在我们将 fruits 转换成了真正的数组，这意味着我们可以对它使用任何方法，比如\
    \ `map`。\n\n`Array.from()` 还接受第二个参数，一个映射函数，因此我们可以这样写：\n\n```javascript\nconst\
    \ fruits = document.querySelectorAll(\".fruits p\");\nconst fruitArray = Array.from(fruits,\
    \ fruit => {\n  console.log(fruit); // <p> Apple </p> // <p> Banana </p> // <p>\
    \ Orange </p>\n  return fruit.textContent; // 我们只想获取内容，而不是整个标签\n});\nconsole.log(fruitArray);\
    \ // [\"Apple\", \"Banana\", \"Orange\"]\n```\n\n在上面的例子中，我们向 `.from()` 方法传递了一个映射函数，以便只将\
    \ `p` 标签的 `textContent` 推入新形成的数组，而不是整个标签。\n\n## `Array.of()`\n\n`Array.of()` 会创建一个包含我们传入的所有参数的数组。\n\
    \n```javascript\nconst digits = Array.of(1,2,3,4,5);\nconsole.log(digits); //\
    \ Array [ 1, 2, 3, 4, 5];\n```\n\n## `Array.find()`\n\n`Array.find()` 返回数组中满足提供的测试函数的第一个元素的值。否则返回\
    \ `undefined`。\n\n让我们看一个简单的例子来了解 `Array.find()` 是如何工作的。\n\n```javascript\nconst\
    \ array = [1,2,3,4,5];\n// 这将返回数组中第一个值大于 3 的元素\nlet found = array.find(e => e\
    \ > 3);\nconsole.log(found); // 4\n```\n\n正如我们提到的，它会返回第一个满足条件的元素，这就是为什么我们只得到 4\
    \ 而不是 5。\n\n## `Array.findIndex()`\n\n`Array.findIndex()` 会返回第一个满足我们条件的元素的索引。\n\
    \n```javascript\nconst greetings = [\"hello\",\"hi\",\"byebye\",\"goodbye\",\"\
    hi\"];\nlet foundIndex = greetings.findIndex(e => e === \"hi\");\nconsole.log(foundIndex);\
    \ // 1\n```\n\n同样，只返回第一个满足条件的元素的索引。\n\n## `Array.some()` 和 `Array.every()`\n\n\
    我把这两个放在一起，因为它们的用法不言自明：`.some()` 会搜索是否存在某些满足条件的项，一旦找到第一个就停止。而 `.every()` 会检查所有项是否都满足给定条件。\n\
    \n```javascript\nconst array = [1,2,3,4,5,6,1,2,3,1];\nlet arraySome = array.some(e\
    \ => e > 2);\nconsole.log(arraySome); // true\nlet arrayEvery = array.every(e\
