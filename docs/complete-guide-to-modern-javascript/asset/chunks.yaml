    ,\"goodbye\",\"hi\"];\nlet foundIndex = greetings.findIndex(e => e === \"hi\"\
    );\nconsole.log(foundIndex); // 1\n```\n\nAgain, only the index of the first element\
    \ that matches our condition is returned.\n\n## `Array.some()` & `Array.every()`\n\
    \nI'm grouping these two together because their use is self-explanatory: `.some()`\
    \ will search if there are some items matching the condition and stop once it\
    \ finds the first one. Whereas, `.every()` will check if all items match the given\
    \ condition or not.\n\n```javascript\nconst array = [1,2,3,4,5,6,1,2,3,1];\nlet\
    \ arraySome = array.some(e => e > 2);\nconsole.log(arraySome); // true\nlet arrayEvery\
