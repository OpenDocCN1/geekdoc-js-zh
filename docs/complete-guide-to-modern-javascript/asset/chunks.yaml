    # JavaScript Basics


    JavaScript is a programming language created by Brendan Eich in 1995 that enables
    interactive web pages and is an essential part of web applications.


    If you want to learn more about the history of the language and its name, I suggest
    that you read this brief article on Medium.com [https://medium.com/@benastontweet/lesson-1a-the-history-of-javascript-8c1ce3bffb17](mailto:https%253A//medium.com/@benastontweet/lesson-1a-the-history-of-javascript-8c1ce3bffb17)
    .


    If you have ever opened the Chrome developer tools or a similar tool you may have
    already seen how JavaScript is inserted into an HTML page.


    We do that by using the script tag and either inserting our JavaScript code directly
    inside of it or by referencing an external file.


    Code inside of the script tag:


    ```

    <script type="text/javascript"> [YOUR_SCRIPT_HERE] </script>

    ```


    Reference an external file:


    ```

    <script src="/home/script.js"></script>

    ```


    Of course you can add as many scripts as you want and also use both relative,
    absolute and full path such as:


    ```

    <!-- absolute path from the root of our project --> <script src="/home/script.js"></script>

    <!-- relative path to our current folder --> <script src="script.js"></script>

    <!-- full url to the jquery library --> <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/core.js"></script>

    ```


    It''s better to not write your code inside of the script tag but instead put it
    in its own file so that it can be cached by the browser and downloaded only once,
    regardless of how many files import it. Those files will use the cached version
    of the file, improving performance.


    ## Variables


    We use variables to store values, which can be anything from a username, an address
    or an item from our e-commerce site, for example.


    Prior to ES6 (ES2015) the way we would declare a variable was:


    ```

    var username =  "Alberto Montalesi"

    ```


    Now we have 2 more options when it comes to declaring variables:


    ```

    let username =  "Alberto Montalesi" const username =  "Alberto Montalesi"

    ```


    We will go deeper into the differences between these three keywords in the Chapter
    1 but let me give you a quick explanation.


    Variables created with the keyword const are, as the name implies, constant, meaning
    that they cannot be overwritten.


    Open your Chrome Developer Tools and try typing the following:


    ```

    const age =  26; age =  27; // Uncaught TypeError: Assignment to constant variable

    ```


    As you can see we are not allowed to assign a new value to our constant.


    On the other hand if we were to do this:


    ```

    let height =  190; height =  189

    ```


    We get no complaint this time, let can be reassigned, similarly to the old var
    keyboard.


    If both var and let can be reassigned, then why should we use let instead of var?
    The answer for that requires a bit more explanation of how JavaScript works and
    it will be discussed later in the Chapter 1.


    Many people argue what the best practice is when it comes to let and const. Here
    is my take: se const all the time unless you know in advance that you will need
    to reassign its value.

