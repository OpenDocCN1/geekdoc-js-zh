    ## RegExp features


    Four new RegExp related features made it to the new version of ECMAScript. They
    are:


    1.  [s(dotAll) flag for regular expressions](https://github.com/tc39/proposal-regexp-dotall-flag)

    1.  [RegExp named capture groups](https://github.com/tc39/proposal-regexp-named-groups)

    1.  [RegExp Lookbehind Assertions](https://github.com/tc39/proposal-regexp-lookbehind)

    1.  [RegExp Unicode Property Escapes](https://github.com/tc39/proposal-regexp-lookbehind)


    ### s (dotAll) flag for regular expression


    This introduces a new `s` flag for ECMAScript regular expressions that makes `.`
    match any character, including line terminators.


    ```

    /foo.bar/s.test(''foo\nbar''); // true

    ```


    ### RegExp named capture groups


    [From the documentation:](https://github.com/tc39/proposal-regexp-named-groups)


    Numbered capture groups allow one to refer to certain portions of a string that
    a regular expression matches. Each capture group is assigned a unique number and
    can be referenced using that number, but this can make a regular expression hard
    to grasp and refactor. For example, given `/(\d{4})-(\d{2})-(\d{2})/` that matches
    a date, one cannot be sure which group corresponds to the month and which one
    is the day without examining the surrounding code. Also, if one wants to swap
    the order of the month and the day, the group references should also be updated.
    A capture group can be given a name using the `(?<name>...)` syntax, for any identifier
    name. The regular expression for a date then can be written as `/(?<year>\d{4})-(?<month>\d{2})-(?<day>\d{2})/u`.
    Each name should be unique and follow the grammar for ECMAScript IdentifierName.
    Named groups can be accessed from properties of a `groups` property of the regular
    expression result. Numbered references to the groups are also created, just as
    for non-named groups. For example:


    ```

    let re =  /(?<year>\d{4})-(?<month>\d{2})-(?<day>\d{2})/u;

    let result =  re.exec(''2015-01-02'');

    // result.groups.year === ''2015'';

    // result.groups.month === ''01'';

    // result.groups.day === ''02'';

    // result[0] === ''2015-01-02'';

    // result[1] === ''2015'';

    // result[2] === ''01'';

    // result[3] === ''02'';

    let  {groups:  {one, two}}  =  /^(?<one>.*):(?<two>.*)$/u.exec(''foo:bar'');

    console.log(`one: ${one}, two: ${two}`);  // one: foo, two: bar

    ```


    ### RegExp Lookbehind Assertions


    [From the documentation:](https://github.com/tc39/proposal-regexp-lookbehind)


    With lookbehind assertions, one can make sure that a pattern is or isn''t preceded
    by another, e.g. matching a dollar amount without capturing the dollar sign. Positive
    lookbehind assertions are denoted as `(?<=...)` and they ensure that the pattern
    contained within precedes the pattern following the assertion. For example, if
    one wants to match a dollar amount without capturing the dollar sign, `/(?<=\$)\d+(\.\d*)?/`
    can be used, matching `''$10.53''` and returning `''10.53''`. This, however, wouldn''t
    match `€10.53`. Negative lookbehind assertions are denoted as `(?<!...)` and,
    on the other hand, make sure that the pattern within doesn''t precede the pattern
    following the assertion. For example, `/(?<!\$)\d+(?:\.\d*)/` wouldn''t match
    `''$10.53''`, but would `''€10.53''`.


    ### RegExp Unicode Property Escapes


    [From the documentation:](https://github.com/tc39/proposal-regexp-unicode-property-escapes)


    This brings the addition of Unicode property escapes of the form `\p{…}` and `\P{…}`.
    Unicode property escapes are a new type of escape sequence available in regular
    expressions that have the `u` flag set. With this feature, we could write:


    ```

    const regexGreekSymbol =  /\p{Script=Greek}/u;

    regexGreekSymbol.test(''π''); // true

    ```


    ## Lifting template literals restriction


    When using tagged template literals the restriction on escape sequences are removed.


    You can read more [here](https://tc39.github.io/proposal-template-literal-revision/#sec-template-literals)([https://tc39.github.io/proposal-template-literal-revision/#sec-template-literals](https://tc39.github.io/proposal-template-literal-revision/#sec-template-literals)).


