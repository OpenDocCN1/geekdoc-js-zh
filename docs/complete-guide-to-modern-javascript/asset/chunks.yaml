- fmt: "\nLook at this comparison between empty objects and objects with the same\
    \ properties.\n\n```\nconst emptyObj1 =  {}; const emptyObj2 =  {}; emptyObj1\
    \ == emptyObj2; // false emptyObj1 === emptyObj2; // false const obj1 =  {a: \
    \ 1}; const obj2 =  {a:  1}; obj1 == obj2; // false obj1 === obj2; // false\n\
    ```\n\nAs you can see, only a comparison between the same object returns `true`.\n\
    \nA quick way of making a clone of an Object in JavaScript is to use `Object.assign`.\n\
    \n```\nconst car =  { color:'red' }\nconst secondCar =  Object.assign({}, car)\n\
    car.wheels  =  4;\nconsole.log(car); // {color: 'red', wheels: 4}\nconsole.log(secondCar);\
    \ // {color: 'red'}\n```\n\nUpdating `car` did not affect `secondCar`. `Object.assign`\
    \ takes a target object as the first argument, and a source as the second one.\n\
    \nIn our example, we used an empty Object as our target and our `car` as the source.\n\
    \nIf you are ready for a more in-depth look at copying Objects in JavaScript,\
    \ I suggest you this article on [Scotch.io](https://scotch.io/bar-talk/copying-objects-in-javascript)\
    \ at [https://scotch.io/bar-talk/copying-objects-in-javascript](https://scotch.io/bar-talk/copying-objects-in-javascript).\n\
    \n### Arrays\n\nAs we have seen, Objects store data in a key value pair. Now we\
    \ will have a look at what an Array is.\n\nAn Array is an Object that stores values\
    \ in order.\n\nIn the example above we used an Object to store our car because\
    \ it had specific properties that we wanted to be able to access easily via a\
    \ key.\n\nIf we just want to store a list of items, then there is no need to create\
    \ an Object. Instead, we can use an Array.\n\nFor example:\n\n```\nconst fruitBasket\
    \ = ['apple','banana','orange']\n```\n\nWe access values of an array via their\
    \ index. Remember that arrays start at position 0.\n\n```\nconst fruitBasket =\
    \ ['apple','banana','orange']\nconsole.log(fruitBasket[0]) // apple\nconsole.log(fruitBasket[1])\
    \ // banana\nconsole.log(fruitBasket[2]) // orange\n```\n\nThere are many methods\
    \ that we can call on an Array. Let's have a look at some of the most useful.\n\
    \n```\nconst fruitBasket = ['apple','banana','orange'];\n// get the length of\
    \ the Array\nconsole.log(fruitBasket.length); // 3\n// add a new value at the\
    \ end of the array\nfruitBasket.push('pear')\nconsole.log(fruitBasket); // [\"\
    apple\", \"banana\", \"orange\", \"pear\"]\n// add a new value at the beginning\
    \ of the array\nfruitBasket.unshift('melon')\nconsole.log(fruitBasket); // [\"\
    melon\", \"apple\", \"banana\", \"orange\", \"pear\"]\n// remove a value from\
    \ the end of the array\nfruitBasket.pop()\nconsole.log(fruitBasket); // [\"melon\"\
    , \"apple\", \"banana\", \"orange\"]\n// remove a value from the beginning of\
    \ the array\nfruitBasket.shift()\nconsole.log(fruitBasket); // [\"apple\", \"\
    banana\", \"orange\"]\n```\n\nAs we can see we can easily add and remove elements\
    \ from the beginning or the end of an Array with these methods.\n\nYou can find\
    \ a longer list of methods on [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)\
    \ at this link [https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array).\n\
    \n### Determining types using typeof\n\nWe can use `typeof` to determine the value\
    \ of our variables. For example:\n\n```\nconst str =  \"hello\"\ntypeof(str);\
    \ // string\nconst num =  12\ntypeof(num) // number\nconst arr = [1,2,3]\ntypeof(arr)\
    \ // object\nconst obj =  {prop:  'value'}\ntypeof(obj) // object\n```\n\nRemember\
    \ that `Array` is not a type, Arrays are Objects!.\n\nEverything seems pretty\
    \ straight forward so far but what if we try something like this:\n\n```\ntypeof(null)\n\
    ```\n\nWe know that `null` is a primitive, so should we expect to see `null` as\
    \ the result?\n\n```\ntypeof(null) // object\n```\n\nLong story short, it's a\
    \ bug from the first implementation of JavaScript. If you want to know more about\
    \ it, [this article](http://2ality.com/2013/10/typeof-null.html) offers a great\
    \ explanation ([http://2ality.com/2013/10/typeof-null.html](http://2ality.com/2013/10/typeof-null.html)).\n\
    \n## Functions\n\nFunctions are a very important tool we use to perform tasks\
    \ and calculations of all kinds.\n\nIn JavaScript we can declare a function in\
    \ different ways.\n\nLet's have a look at a function definition:\n\n```\nfunction\
    \  greet(name){\n  console.log(\"hello \"  + name);\n}\ngreet(\"Alberto\") //\
    \ hello Alberto\n```\n\nThis is a simple function that when called will log a\
    \ string.\n\nThe variable inside the parenthesis at line 1, is called a parameter\
    \ while the code inside of the curly brackets is a statement, in this case a very\
    \ simple `console.log()`.\n\nA very important thing to remember is that primitives\
    \ are passed to a function by value meaning that the changes done to those values\
    \ are not reflected globally. On the other hand if the value is not a primitive,\
    \ such as an Object or an Array it is then passed by reference meaning that any\
    \ modification done to it will be reflected in the original Object.\n\n```\nlet\
    \ myInt =  1;\nfunction  increase(value){\n  return value +=1;\n}\nconsole.log(myInt);\
    \ // 1\nconsole.log(increase(myInt)); // 2\nconsole.log(myInt); // 1\n```\n\n\
    As you can see, we increased the value of the integer but that did not affect\
    \ the original variable.\n\nLet's see an example with an Object.\n\n```\nlet myCar\
    \ =  { make:  \"bmw\", color:  \"red\" }\nconsole.log(myCar) // {make: \"bmw\"\
    , color: \"red\"}\nfunction  changeColor(car){\n  car.color  =  \"blue\"\n}\n\
    changeColor(myCar)\nconsole.log(myCar) // {make: \"bmw\", color: \"blue\"}\n```\n\
    \nAs you can see, since the parameter `car` was just a reference to the Object\
    \ `myCar`, modifying it resulted in a change in the `myCar` Object.\n\nAnother\
    \ way of declaring a function is by using a function expression.\n\n```\nconst\
    \ greeter =  function  greet(name){\n  console.log(\"hello \"  + name);\n}\ngreeter(\"\
    Alberto\") // hello Alberto\n```\n\nHere we assigned our function `greet` to a\
    \ const, called `greeter`.\n\nWe got the same result as in the first example but\
    \ with a function expression we can also create anonymous functions.\n\n```\n\
    const greeter =  function(name){\n  console.log(\"hello \"  + name);\n}\ngreeter(\"\
    Alberto\") // hello Alberto\n```\n\nWe changed `function greet` to `function`\
    \ and we got an anonymous function.\n\nWe could also tweak it a little bit further\
    \ by using an arrow function, introduced by ES2015.\n\n```\nconst greeter = (name)\
    \ =>  {\n  console.log(\"hello \"  + name);\n}\ngreeter(\"Alberto\") // hello\
    \ Alberto\n```\n\nThe `function` keyword goes away and we get a nice fat arrow\
    \ (`=>`) after the parameters.\n\nWe will look at arrow functions in detail in\
    \ Chapter 2.\n\n## Understanding function scope and the this keyword\n\nOne of\
    \ the most important concepts to understand in JavaScript is the scope.\n\nWhat\
    \ is Scope? \\\n\nThe scope of a variable controls where that variable can be\
    \ accessed from.\n\nWe can have a global scope meaning that the variable can be\
    \ accessed from anywhere in our code or we can have a block scope meaning that\
    \ the variable can be accessed only from inside of the block where it has been\
    \ declared.\n\nA block can be a function, a loop or anything delimited by curly\
    \ brackets.\n\nLet's have a look at two examples, first using the keyword `var`.\n\
    \n```\nvar myInt =  1;\nif(myInt ===  1){\n  var mySecondInt =  2\n  console.log(mySecondInt);\
    \ // 2\n}\nconsole.log(mySecondInt); // 2\n```\n\nAs you can see we were able\
    \ to access the value of `mySecondInt` event outside of the block scope as variables\
