    # An Intro To TypeScript


    Now that you have a clear idea of how JavaScript looks like in 2019, I think it''s
    a good moment to introduce you TypeScript.


    Albeit not necessary as a skill for a JavaScript developer, I believe it to be
    extremely useful, especially when working in team on bigger projects.


    As you already know, JavaScript is not a strongly typed language meaning that
    you do not have to define the type of your variables upon declaration.


    That means that they can be more flexible and accept different values but at the
    same time it can make the code more confusing and prone to have bugs.


    Look at this example:


    function  getUserByID(userID){ // perform an api call to your server to retrieve
    a user by its id }


    What is userID ? Is it an integer or a string? We can assume it''s an integer,
    but maybe it''s an alphanumeric string (e.g.: ''A123'').


    Unless we wrote that piece of code, we have no way of knowing what is the type
    of the argument.


    That is where TypeScript comes to help. This is how the same code would look like:


    function  getUserByID(userID:number){ // perform an api call to your server to
    retrieve a user by its id }


    Perfect! Now we know for sure that if we pass a string to the function that will
    cause an error.


    A simple addition made the code easier to use.


    ## What is TypeScript?


    Created just a few year ago by Microsoft, TypeScript is a typed superset of JavaScript
    that compiles to plain JavaScript.


    Being a superset means that you can write plain JavaScript in a TypeScript file
    and that will cause no error.


    Browsers do not understand TypeScript, which means it has to be transpiled to
    plain JavaScript.


    We will now look at how to set up our environment to write TypeScript.


    ## How to use TypeScript


    Getting started with TypeScript takes literally 5 minutes.


    The first thing to do is to install it. Run this command in your terminal:


    npm install -g TypeScript


    Next you can open your code editor and create a file called greeter.ts (NOT .js).


    const greeter = (name:string) =>  { console.log(`hello ${name}`) } greeter(''Alberto'');
    // hello Alberto


    Now what we have to do to generate the JavaScript file is run this command in
    the terminal in the same directory as our file:


    tsc greeter.ts


    Now you should have a greeter.js file with this code inside:


    var greeter =  function (name) { console.log("hello "  + name); }; greeter(''Alberto'');
    // hello Alberto


    Where did name:string go? As we know JavaScript is not strongly typed therefore
    the type declaration get removed when the code is transpiled.


    Typing your code will help YOU to debug it and to cause less errors but it won''t
    create a different JavaScript output than what you would have gotten if you didn''t
    use types.


    ## TypeScript basic types


    In this section we will go over the basic types supported by TypeScript. You should
    already know the meaning of most of them from the Introduction to JavaScript section.


    The basic types supported by TypeScript are:


    1.  boolean


    1.  number


    1.  string


    1.  Array


    1.  object


    1.  Tuple


    1.  enum


    1.  any


    1.  void


    1.  null and undefined


    1.  never


    ### boolean


    Defines a value that can be true or false:


    const active:  boolean  =  true;


    ### number


    The type number supports hexadecimal, decimal, binary and octal literals:


    const decimal:  number  =  9; const hex:  number  =  0xf00d; const binary:  number  =  0b1010;
    const octal:  number  =  0o744;


    ### string


    The type string is used to store textual data:


    const message:  string  =  ''Welcome";


    ### Array


    There are two ways of defining Array types:


    // first way -> type[] const firstArray:  number[]  =  [1,2,3]; // second way
    -> Array<type> const secondArray: Array<number>  =  [4,5,6];


    In simple cases like this one there is no difference between them but if we are
    working with something more complex than a type of number then we won''t be able
    to use the first notation.


    Look at this example:


    // our function accepts an array of objects with a label and a value as its properties
    function  example(arg: Array<{label:string,value:string}> ){ // do something }


    Array<{label:string,value:string}> simply means that the argument is an Array
    of objects with properties of label and value, both of type string.


    ### object


    object represents a value that is not one of the primitives;


    Let''s say our function takes an argument of type object:


    function  greetUser(user:  object){ // property name does not exist on type object
    console.log(`hello ${user.name}`) } greetUser({name:  ''Alberto'', age:27}); //
    hello Alberto


    The Typescript compiler will complain that the property name does not exist on
    the type object.


    Let''s define better the properties of that Object.


    function  greetUser(user:  {name:string,age:number}){ console.log(`hello ${user.name}`)
    } greetUser({name:  ''Alberto'', age:27}); // hello Alberto


    Now we specified all the properties of the user object, making it easier for us
    and for anybody who looks at the code to know what they can and what they cannot
    do with that object.


    ### Tuple


    A Tuple allows you to define the type of the known elements of an Array.


    let myTuple:  [string,number,string]; myTuple =  [''hi'',5,''hello'']; console.log(myTuple);
    // [ ''hi'', 5, ''hello'' ]


    TypeScript will know the type of the elements of the know indexes that we define
    in the tuple but it won''t be able to know the type of additional elements added
    to the array.


    ### enum'
  toc: []
  trans: '


    // 在 `try { ... } catch(error) { ... }` 之前 // ES2019 `try { ... } catch { ...
    }`


    当你想要忽略错误时，这很有用。关于此特性的更多使用场景，我强烈推荐这篇文章：[`2ality.com/2017/08/optional-catch-binding.html`](http://2ality.com/2017/08/optional-catch-binding.html)


    ## Function.prototype.toString()


    `.toString()` 方法返回一个表示函数源代码的字符串。


    ```

    function sum(a, b) { return a + b; } console.log(sum.toString()); // function
    sum(a, b) { // return a + b; // }

    ```


    它也会包含注释。


    ```

    function sum(a, b) { // 执行求和 return a + b; } console.log(sum.toString()); // function
    sum(a, b) { // // 执行求和 // return a + b; // }

    ```


    ## Symbol.prototype.description


    `.description` 返回 Symbol 对象的可选描述。


    ```

    const me = Symbol("Alberto"); me.description; // "Alberto" me.toString() // "Symbol(Alberto)"

    ```


