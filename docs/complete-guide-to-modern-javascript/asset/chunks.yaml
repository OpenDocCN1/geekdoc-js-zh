    The value of `this` depends by how a function is called.


    In the example above the function was called as a method of our `Object`.


    Look at this other example:


    ```

    function  logThis(){ console.log(this); } logThis(); // Window {...}

    ```


    We called this function in the global context, therefore the value of `this` referred
    to the `Window` `Object`.


    We can avoid accidentally referring to the `Window` `Object` by turning on strict
    mode.


    You can do that by writing `''use strict'';` at the beginning of your JavaScript
    file.


    By doing so you will enable a stricter set of rules for JavaScript, among which
    there is one that sets the value of the Global Object to `undefined` instead of
    to the `Window` `Object` causing our `this` keyword to also become `undefined`.


    If we want to manually set the value of `this` to something we can use `.bind`.


    ```

    const myCar =  { color:  ''red'', logColor:  function(){ console.log(this.color)
    } } const unboundGetColor =  myCar.logColor; console.log(unboundGetColor()) //
    undefined const boundGetColor =  unboundGetColor.bind(myCar) console.log(boundGetColor())
    // red

    ```


    Let''s go through what we just did:


    1.  First we created an `Object` similarly to the previous example


    1.  We set `unboundGetColor` equal to the method of `myCar`


    1.  When we try to call `unboundGetColor`, it tries to look for `this.color` but
    since it gets invoked in the global context, the value of `this` is the `Window`
    `Object` and there is no color on it, therefore we get `undefined`


    1.  Lastly we use `.bind` to specifically tell `boundGetColor` that the `this`
    keyword will refer to the `Object` inside of the parenthesis, in this case `myCar`


    1.  When we call `boundGetColor` you can see that this time we get the result
    that we were looking for


    There are two other methods we can use to set the value of the `this` keyword:
    `.call()` and `.apply()`.


    They are both similar in that both methods call a function with a given `this`
    value. The arguments they accept are a bit different.


    `.call()` accepts a list of arguments while `.apply()` accepts a single array
    of arguments.


    Look at this example using `.call()`


    ```

    function  Car(make,color){ this.carMake  = make; this.carColor  = color; } function  MyCar(make,color){
    Car.call(this,make,color) this.age  =  5 } const myNewCar =  new  MyCar(''bmw'',''red'')
    console.log(myNewCar.carMake) // bmw console.log(myNewCar.carColor) // red

    ```


    We are passing our `MyCar` `Object` inside of the `.call()` so that `this.carMake`
    will get set to the make that we passed as an argument of `MyCar`. Same for the
    color.


    Look at this example with `.apply()` to see the differences between the two.


    ```

    function  Car(make,color){ this.carMake  = make; this.carColor  = color; } function  MyCar(make,color){
    Car.apply(this,[make,color]) this.age  =  5 } const myNewCar =  new  MyCar(''bmw'',''red'')
    console.log(myNewCar.carMake) // bmw console.log(myNewCar.carColor) // red

    ```


    As you can see, the result was the same but in this case `.apply()` accepts an
    array with a list of arguments.


    The major difference between the two comes in play when you are writing a function
    that does not need to know, or doesn''t know the number of arguments required.


    In that case, since `.call()` requires you to pass the arguments individually,
    it becomes problematic to do.


    The solution is to use `.apply()`, because you can just pass the array and it
    will get unpacked inside of the function no matter how many arguments it contains.


    ```

    const ourFunction =  function(item, method, args){ method.apply(args) } ourFunction(item,method,
    [''argument1'',  ''argument2'']) ourFunction(item,method, [''argument1'',  ''argument2'',  ''argument3''])

    ```


    No matter how many arguments we pass, they will get applied individually when
    `.apply()` is called.


