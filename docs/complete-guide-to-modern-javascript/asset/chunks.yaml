    # Chapter 9: Spread operator and rest parameters


    ## The Spread operator


    According to MDN:


    Spread syntax allows an iterable such as an array expression or string to be expanded
    in places where zero or more arguments (for function calls) or elements (for array
    literals) are expected, or an object expression to be expanded in places where
    zero or more key-value pairs (for object literals) are expected.


    ### Combine arrays


    const veggie = ["tomato","cucumber","beans"]; const meat = ["pork","beef","chicken"];
    const menu = [...veggie,  "pasta", ...meat]; console.log(menu); // Array [ "tomato",
    "cucumber", "beans", "pasta", "pork", "beef", "chicken" ]


    The ... is the spread syntax, and it allowed us to grab all the individual values
    of the arrays veggie and meat and put them inside the array menu and at the same
    time add a new item in between them.


    ### Copy arrays


    The spread syntax is very helpful if we want to create a copy of an array.


    const veggie = ["tomato","cucumber","beans"]; const newVeggie = veggie; // this
    may seem like we created a copy of the veggie array but look now veggie.push("peas");
    console.log(veggie); // Array [ "tomato", "cucumber", "beans", "peas" ] console.log(newVeggie);
    // Array [ "tomato", "cucumber", "beans", "peas" ]


    Our new array also changed, but why? Because we did not actually create a copy
    but we just referenced our old array in the new one.


    The following is how we would usually make a copy of an array in ES5 and earlier


    const veggie = ["tomato","cucumber","beans"]; // we created an empty array and
    put the values of the old array inside of it const newVeggie = [].concat(veggie);
    veggie.push("peas"); console.log(veggie); // Array [ "tomato", "cucumber", "beans",
    "peas" ] console.log(newVeggie); // Array [ "tomato", "cucumber", "beans" ]


    And this is how we would do the same using the spread syntax:


    const veggie = ["tomato","cucumber","beans"]; const newVeggie = [...veggie]; veggie.push("peas");
    console.log(veggie); // Array [ "tomato", "cucumber", "beans", "peas" ] console.log(newVeggie);
    // Array [ "tomato", "cucumber", "beans" ]


    The syntax for the Spread operator is the following ...YourArray. Since we wanted
    the variable newVeggie to be a copy of the array veggie we assigned it to an Array
    and inside of it we spread all the values from the variable veggie like so: [...veggie].


    ### Spread into a function


    Thanks to the Spread operator we have an easier way of calling a function with
    an Array of arguments.


    // OLD WAY function  doStuff (x, y, z) { console.log(x + y + z); } var args =
    [0,  1,  2]; // Call the function, passing args doStuff.apply(null, args); //
    USE THE SPREAD SYNTAX doStuff(...args); // 3 (0+1+2); console.log(args); // Array
    [ 0, 1, 2 ]


    As you can see, in the example, our doStuff function accepts 3 parameters and
    we are passing them by spreading the array args into the function like so: ...args
    replacing the need of resorting to use .apply().


    Let''s look at another example:


    const name = ["Alberto",  "Montalesi"]; function  greet(first, last) { console.log(`Hello
    ${first} ${last}`); } greet(...name); // Hello Alberto Montalesi


    The two values of the array are automatically assigned to the two arguments of
    our function.


    What if we provide more values than arguments?


    const name = ["Jon",  "Paul",  "Jones"]; function  greet(first, last) { console.log(`Hello
    ${first} ${last}`); } greet(...name); // Hello Jon Paul'
