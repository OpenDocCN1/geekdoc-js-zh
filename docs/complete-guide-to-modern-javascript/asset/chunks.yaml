    If later on you need to reassign one of your `const`, simply make it a `let` and
    it will be enough. I find that for myself, it’s better to make them `const` by
    default. Then I see errors if I accidentally try to reassign them rather than
    having to debug the code later just to find out that I was referencing the wrong
    variable.


    ### A note about naming variables


    There are certain rules to respect when it comes to naming variables. But don''t
    worry, most of them are very easy to remember.


    The following are all forbidden:


    ```

    // variables name cannot start with a number let 1apple =  "one apple"; // variables
    name cannot include any character such as spaces, symbols and punctuation marks
    let hello!  =  "hello!";

    ```


    There are also certain words that are reserved and cannot be used as names for
    variables and functions.


    |   |   |   |   |

    |---|---|---|---|

    | abstract | arguments | await | boolean |

    | break | byte | case | catch |

    | char | class | const | continue |

    | debugger | default | delete | do |

    | double | else | enum | eval |

    | export | extends | false | final |

    | finally | float | for | function |

    | goto | if | implements | import |

    | in | instanceof | int | interface |

    | let | long | native | new |

    | null | package | private | protected |

    | public | return | short | static |

    | super | switch | synchronized | this |

    | throw | throws | transient | true |

    | try | typeof | var | void |

    | volatile | while | with | yield |


    The rule of thumb when it comes to choosing the name for your variable is to make
    them descriptive.


    Avoid using acronyms, abbreviations and meaningless names.


    ```

    // BAD let cid =  12;  // what is a `cid` // GOOD let clientID =  12;  // oh,
    a `client id` // BAD let id =  12  // what id? userID? dogID? catID? // GOOD let
    userID =  12  // be specific

    ```


    If you want your variable names to be as descriptive as possible, chances are
    they are going to be multi-words.


    In that case, the two most common ways of writing variable names are camelCase
    and snake_case.


    ```

    // BAD let lastloggedin =  ''''  // hard to read // GOOD let lastLoggedIn =  ''''  //
    camelCase let last_logged_in =  ''''  // snake_case

    ```


    Whether you choose to use camelCase and capitalize each word of the name after
    the first one, or you choose to use snake_case and put an underscore between each
    word, remember to be consistent and stick to your choice.


    ## Data Types


    JavaScript is a dynamic language, meaning that on the contrary to a static language,
    you don''t have to define the type of your variables when you define them.


    ```

    // is this a string or a number ? var userID; userID =  12;  // now it''s a number
    console.log(typeof userID);  // number userID =  ''user1''  // now it''s a string
    console.log(typeof userID);  // string

    ```


    This may seem convenient at first, but it can be a cause of problems when working
    on bigger projects.


    At the end of this book, after you have mastered the basics of JavaScript I will
    introduce you to TypeScript, which adds strong typing to JavaScript.


    In JavaScript, there are 7 data types: 6 primitives and the `Object`.


    ### Primitives


    A primitive is a value is simply data that is not an `Object` and does not have
    methods.


    They are:


    1. `string`

    1. `number`

    1. `boolean`

    1. `null`

    1. `undefined`

    1. `symbol` (the latest addition)


    Let''s have a quick look at all of them, some of which you may already know if
    you have prior experience in programming.


    `string` is used to represent text data, whether it is a name, an address or a
    chapter of a book.


    ```

    let userName =  "Alberto"; console.log(userName) // Alberto

    ```


    `number` is used to represent numerical values.


    In JavaScript there is no specific type for Integers.


    ```

    let age =  25;

    ```


    `boolean` is used to represent a value that is either `true` or `false`.


    ```

    let married =  false;

    ```


    `null` represents absence of value, while `undefined` represent an undefined value.


    `symbol` represents a value that is unique and immutable. It was added in ES2015,
    making it the most recent addition to this list.


    We will have a better look at it in Chapter 11.


    ### Objects


    While the previous 6 primitives that we discussed can hold only a single thing,
    whether it’s a `null` value, `true`, `false`, etc., `Object`s are used to store
    the collection of properties


    Let''s first look at a simple `Object`


    ```

    const car =  { wheels:  4, color:  "red", }

    ```


    This is a simple `Object` that i use to store properties of my car.


    Each property has a key, in the case of the first line it''s `wheels`, and a value,
    in this case 4.


    Key is of type `string` but the value can be of any type, they can also be functions
    and in that case we call them methods.


    ```

    const car =  { wheels:  4, color:  "red", drive:  function(){ console.log("wroom
    wroom") } } console.log(Object.keys(car)[0]) // wheels console.log(typeof  Object.keys(car)[0])
    // string car.drive(); // wroom wroom

    ```


    As you can see now, we can call the function `drive` on the object `car`.


    Don''t worry, we will look at functions more in the next chapter.


    ### Create an empty Object


    We don''t have to declare properties when we create an `Object`.


    Here are two ways of creating an empty `Object`:


    ```

    const car =  new  Object() const car =  {}

    ```


    The more commonly used syntax is the second one, which is called object literal


    Now that you have a new empty car object, to add new properties to it, you can
    simply do this:


    ```

    car.color  =  ''red''; console.log(car) // {color: "red"}

    ```


    As you can see, we use the dot notation to add a new property to the car `Object`.


    How about accessing properties on the `Object`?


    It''s very simple and we have two choices:


    ```

    const car =  { wheels:  4, color:  "red", } console.log(car.wheels); // 4 console.log(car[''color'']);
    // ''red''

    ```


    We have two different way of doing the same thing? Why?


    Well, they are not completely the same.


    In case of multi-word properties we cannot use the dot notation.


    ```

    const car =  { wheels:  4, color:  "red", "goes fast":  true } console.log(car.goes
    fast); // syntax error console.log(car[''goes fast'']) // true

    ```


    When you want to use multi-word properties, you need to remember to wrap their
    name in quotation marks and you are able to access them only with bracket notation.


    Another use for the bracket notation is to use it to access properties of an `Object`
    by its key.


    Let’s say that our application receives an input from a user, which is then saved
    into a variable that will be used to access our object.


    The user is looking for cars and he/she has been asked to tell us the brand that
    he/she likes. That brand is a key that we will use to display back only the appropriate
    models.


    For simplicity, in the example each brand will have only one model.


    ```

    const cars =  { ferrari:  "california", porsche:  "911", bugatti:  "veyron", }
    // user input const key =  "ferrari" console.log(cars.key); // undefined console.log(cars[''key'']);
    // undefined console.log(cars[key]); // california

    ```


    As you can see, we need to use bracket notation to access the property of the
    `Object` via its key, stored in our variable.


    Be careful, no strings are around `key` as it is a variable name and not a string.


    ### Copying Objects


    In contrast to primitives, objects are copied by reference, meaning that if we
    write:


    ```

    let car =  { color:  ''red'' } let secondCar = car;

    ```


    Our `secondCar` will simply store a reference, an "address", to the `car` and
    not the `Object` itself.


    It''s easier to understand if you look at this:


    ```

    let car =  { color:  ''red'' } let secondCar = car; car.wheels  =  4 console.log(car);
    // {color: ''red'', wheels: 4} console.log(secondCar); // {color: ''red'', wheels:
    4}

    ```


    As you can see, the `secondCar` simply stored a reference to `car`, therefore
    when we modified `car`, `secondCar` also changed.


    If we compare the two objects, we can see something interesting:


    ```

    console.log(car == secondCar); // true console.log(car === secondCar); // true

    ```


    Whether we use equality (`==`) or strict equality (`===`) we get `true` meaning
    that the two objects are the same.


    Only a comparison between the same `Object` will return `true`.

