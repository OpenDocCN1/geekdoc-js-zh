    \n![bullet](images/bullet_nb_square-blk.png)true\n\n### 8.4 What is the correct\
    \ output of the following code:\n\n```javascript\nArray.from([1, 2, 3], x => x\
    \ * x);\n```\n\n![bullet](images/bullet_nb_square-blk.png)[1,2,3]\n\n![bullet](images/bullet_nb_square-blk.png)[1,4,9]\n\
    \n![bullet](images/bullet_nb_square-blk.png)[1,3,5]\n\n# Chapter 9: Spread operator\
    \ and rest parameters\n\n## The Spread operator\n\nAccording to MDN:\n\nSpread\
    \ syntax allows an iterable such as an array expression or string to be expanded\
    \ in places where zero or more arguments (for function calls) or elements (for\
    \ array literals) are expected, or an object expression to be expanded in places\
    \ where zero or more key-value pairs (for object literals) are expected.\n\n###\
    \ Combine arrays\n\n```javascript\nconst veggie = [\"tomato\",\"cucumber\",\"\
    beans\"];\nconst meat = [\"pork\",\"beef\",\"chicken\"];\nconst menu = [...veggie,\
    \ \"pasta\", ...meat];\nconsole.log(menu); // Array [ \"tomato\", \"cucumber\"\
    , \"beans\", \"pasta\", \"pork\", \"beef\", \"chicken\" ]\n```\n\nThe `...` is\
    \ the spread syntax, and it allowed us to grab all the individual values of the\
    \ arrays `veggie` and `meat` and put them inside the array `menu` and at the same\
    \ time add a new item in between them.\n\n### Copy arrays\n\nThe spread syntax\
    \ is very helpful if we want to create a copy of an array.\n\n```javascript\n\
    const veggie = [\"tomato\",\"cucumber\",\"beans\"];\nconst newVeggie = veggie;\
    \ // this may seem like we created a copy of the veggie array but look now\nveggie.push(\"\
    peas\");\nconsole.log(veggie); // Array [ \"tomato\", \"cucumber\", \"beans\"\
    , \"peas\" ]\nconsole.log(newVeggie); // Array [ \"tomato\", \"cucumber\", \"\
    beans\", \"peas\" ]\n```\n\nOur new array also changed, but why? Because we did\
    \ not actually create a copy but we just referenced our old array in the new one.\n\
    \nThe following is how we would usually make a copy of an array in ES5 and earlier\n\
    \n```javascript\nconst veggie = [\"tomato\",\"cucumber\",\"beans\"];\n// we created\
    \ an empty array and put the values of the old array inside of it\nconst newVeggie\
    \ = [].concat(veggie);\nveggie.push(\"peas\");\nconsole.log(veggie); // Array\
    \ [ \"tomato\", \"cucumber\", \"beans\", \"peas\" ]\nconsole.log(newVeggie); //\
    \ Array [ \"tomato\", \"cucumber\", \"beans\" ]\n```\n\nAnd this is how we would\
    \ do the same using the spread syntax:\n\n```javascript\nconst veggie = [\"tomato\"\
    ,\"cucumber\",\"beans\"];\nconst newVeggie = [...veggie];\nveggie.push(\"peas\"\
    );\nconsole.log(veggie); // Array [ \"tomato\", \"cucumber\", \"beans\", \"peas\"\
    \ ]\nconsole.log(newVeggie); // Array [ \"tomato\", \"cucumber\", \"beans\" ]\n\
    ```\n\nThe syntax for the Spread operator is the following `...YourArray`. Since\
    \ we wanted the variable `newVeggie` to be a copy of the array `veggie` we assigned\
    \ it to an Array and inside of it we spread all the values from the variable `veggie`\
    \ like so: `[...veggie]`.\n\n### Spread into a function\n\nThanks to the Spread\
    \ operator we have an easier way of calling a function with an Array of arguments.\n\
    \n```javascript\n// OLD WAY\nfunction doStuff(x, y, z) {\n  console.log(x + y\
    \ + z);\n}\nvar args = [0, 1, 2];\n// Call the function, passing args\ndoStuff.apply(null,\
    \ args);\n// USE THE SPREAD SYNTAX\ndoStuff(...args); // 3 (0+1+2);\nconsole.log(args);\
    \ // Array [ 0, 1, 2 ]\n```\n\nAs you can see, in the example, our `doStuff` function\
    \ accepts 3 parameters and we are passing them by spreading the array `args` into\
    \ the function like so: `...args` replacing the need of resorting to use `.apply()`.\n\
    \nLet's look at another example:\n\n```javascript\nconst name = [\"Alberto\",\
    \ \"Montalesi\"];\nfunction greet(first, last) {\n  console.log(`Hello ${first}\
    \ ${last}`);\n}\ngreet(...name); // Hello Alberto Montalesi\n```\n\nThe two values\
    \ of the array are automatically assigned to the two arguments of our function.\n\
    \nWhat if we provide more values than arguments?\n\n```javascript\nconst name\
    \ = [\"Jon\", \"Paul\", \"Jones\"];\nfunction greet(first, last) {\n  console.log(`Hello\
    \ ${first} ${last}`);\n}\ngreet(...name); // Hello Jon Paul\n```\n"
