    # Chapter 2: Arrow functions


    ## What is an arrow function?


    ES6 introduced fat arrows (=>) as a way to declare functions.


    This is how we would normally declare a function in ES5:


    const greeting =  function(name) { return  "hello "  + name; }


    The new syntax with a fat arrow looks like this:


    var greeting = (name) =>  { return  `hello ${name}`; }


    We can go further, if we only have one parameter we can drop the parenthesis and
    write:


    var greeting = name =>  { return  `hello ${name}`; }


    If we have no parameter at all we need to write empty parenthesis like this:


    var greeting = () =>  { return  "hello"; }


    ## Implicitly return


    With arrow functions we can skip the explicit return and return like this:


    const greeting = name =>  `hello ${name}`;


    Look at a side by side comparison with an old ES5 Function:


    const oldFunction =  function(name){ return  `hello ${name}` } const arrowFunction
    = name =>  `hello ${name}`;


    Both functions achieve the same result, but the new syntax allows you to be more
    concise.


    Beware! Readability is more important than conciseness so you might want to write
    your function like this if you are working in a team and not everybody is totally
    up-to-date with ES6.


    const arrowFunction = (name) =>  { return  `hello ${name}`; }


    Let''s say we want to implicitly return an object literal, we would do it like
    this:


    const race =  "100m dash"; const runners = [ "Usain Bolt",  "Justin Gatlin",  "Asafa
    Powell" ]; const results =  runners.map((runner, i) => ({  name: runner, race,  place:
    i +  1})); console.log(results); // [{name: "Usain Bolt", race: "100m dash", place:
    1} // {name: "Justin Gatlin", race: "100m dash", place: 2} // {name: "Asafa Powell",
    race: "100m dash", place: 3}]


    In this example, we are using the map function to iterate over the array runners.
    The first argument is the current item in the array and the i is the index of
    it. For each item in the array we are then adding into results an Object containing
    the properties name, race, and place.


    To tell JavaScript what''s inside the curly braces is an object literal we want
    to implicitly return, we need to wrap everything inside parenthesis.


    Writing race or race: race is the same.


    ## Arrow functions are anonymous


    As you can see from the previous examples, arrow functions are anonymous.


    If we want to have a name to reference them we can bind them to a variable:


    const greeting = name =>  `hello ${name}`; greeting("Tom");


    ## Arrow function and the this keyword


    You need to be careful when using arrow functions in conjunction with the this
    keyword, as they behave differently from normal functions.


    When you use an arrow function, the this keyword is inherited from the parent
    scope.


    This can be useful in cases like this one:


    <bdi><div class="box open"></bdi> <bdi>This is a box </div></bdi>


    <bdi>.opening {</bdi> <bdi>background-color:red; }</bdi>


    // grab our div with class box const box =  document.querySelector(".box"); //
    listen for a click event box.addEventListener("click",  function() { // toggle
    the class opening on the div this.classList.toggle("opening"); setTimeout(function(){
    // try to toggle again the class this.classList.toggle("opening"); },500); });


    The problem in this case is that the first this is bound to the const box but
    the second one, inside the setTimeout, will be set to the Window object, throwing
    this error:


    Uncaught TypeError: cannot read property "toggle"  of  undefined


    Since we know that arrow functions inherit the value of this from the parent scope,
    we can re-write our function like this:


    const box =  document.querySelector(".box"); // listen for a click event box.addEventListener("click",  function()
    { // toggle the class opening on the div this.classList.toggle("opening"); setTimeout(()=>{
    // try to toggle again the class this.classList.toggle("opening"); },500); });


    Here, the second this will inherit from its parent, and will be set to the const
    box.


    Running the example code you should see our div turning red for just half a second.


    ## When you should avoid arrow functions'
