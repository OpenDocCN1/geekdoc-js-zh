    `this` 的值取决于函数的调用方式。


    在上面的例子中，函数是作为 `Object` 的方法被调用的。


    请看另一个例子：


    ```

    function  logThis(){ console.log(this); } logThis(); // Window {...}

    ```


    我们在全局上下文中调用了这个函数，因此 `this` 的值指向了 `Window` `Object`。


    我们可以通过开启严格模式来避免意外地引用 `Window` `Object`。


    你可以在 JavaScript 文件的开头写上 `''use strict'';` 来实现这一点。


    这样做会启用一套更严格的 JavaScript 规则，其中一条规则是将全局对象的值设置为 `undefined` 而不是 `Window` `Object`，从而导致我们的
    `this` 关键字也变成 `undefined`。


    如果我们想手动将 `this` 的值设置为某个内容，可以使用 `.bind`。


    ```

    const myCar =  { color:  ''red'', logColor:  function(){ console.log(this.color)
    } } const unboundGetColor =  myCar.logColor; console.log(unboundGetColor()) //
    undefined const boundGetColor =  unboundGetColor.bind(myCar) console.log(boundGetColor())
    // red

    ```


    我们来梳理一下刚才的操作：


    1.  首先，我们创建了一个 `Object`，与之前的例子类似。


    1.  我们将 `unboundGetColor` 设置为 `myCar` 的方法。


    1.  当我们尝试调用 `unboundGetColor` 时，它会尝试查找 `this.color`，但由于它在全局上下文中被调用，`this` 的值是
    `Window` `Object`，而它上面没有 color，因此我们得到 `undefined`。


    1.  最后，我们使用 `.bind` 来明确告诉 `boundGetColor`，`this` 关键字将指向括号内的 `Object`，在本例中是 `myCar`。


    1.  当我们调用 `boundGetColor` 时，可以看到这次我们得到了想要的结果。


    还有另外两种方法可以用来设置 `this` 关键字的值：`.call()` 和 `.apply()`。


    它们两者相似之处在于，这两个方法都会使用给定的 `this` 值来调用一个函数。它们接受的参数略有不同。


    `.call()` 接受一个参数列表，而 `.apply()` 接受一个参数数组。


    请看这个使用 `.call()` 的例子：


    ```

    function  Car(make,color){ this.carMake  = make; this.carColor  = color; } function  MyCar(make,color){
    Car.call(this,make,color) this.age  =  5 } const myNewCar =  new  MyCar(''bmw'',''red'')
    console.log(myNewCar.carMake) // bmw console.log(myNewCar.carColor) // red

    ```


    我们将 `MyCar` `Object` 传入 `.call()`，这样 `this.carMake` 就会被设置为传递给 `MyCar` 的参数 make。color
    同理。


    请看这个使用 `.apply()` 的例子，以了解两者之间的区别。


    ```

    function  Car(make,color){ this.carMake  = make; this.carColor  = color; } function  MyCar(make,color){
    Car.apply(this,[make,color]) this.age  =  5 } const myNewCar =  new  MyCar(''bmw'',''red'')
    console.log(myNewCar.carMake) // bmw console.log(myNewCar.carColor) // red

    ```


    如你所见，结果相同，但在这个例子中 `.apply()` 接受一个包含参数列表的数组。


    两者之间的主要区别在于，当你编写一个不需要知道或不知道所需参数数量的函数时，就会体现出来。


    在这种情况下，由于 `.call()` 要求你逐个传递参数，这样做就会变得很麻烦。


    解决方案是使用 `.apply()`，因为你只需传递数组，无论它包含多少个参数，都会在函数内部被解包。


    ```

    const ourFunction =  function(item, method, args){ method.apply(args) } ourFunction(item,method,
    [''argument1'',  ''argument2'']) ourFunction(item,method, [''argument1'',  ''argument2'',  ''argument3''])

    ```


    无论我们传递多少个参数，当调用 `.apply()` 时，它们都会被逐个应用。


