  trans: "\n现在我们可以为字符串添加一些填充，可以在末尾（`.padEnd()`）或开头（`.padStart()`）进行填充。\n\n`\"hello\"\
    .padStart(6);` // \" hello\" `\"hello\".padEnd(6);` // \"hello \"\n\n我们指定了填充长度为\
    \ 6，那么为什么两种情况下都只得到了一个空格呢？\n\n这是因为 `padStart` 和 `padEnd` 会去填充空白位置。在我们的例子中，`\"hello\"\
    ` 有 5 个字母，填充长度为 6，所以只留下 1 个空白位置。\n\n再看这个例子：\n\n`\"hi\".padStart(10);` // 10 -\
    \ 2 = 8 个空白位置 // \" hi\" `\"welcome\".padStart(10);` // 10 - 6 = 4 个空白位置 // \"\
    \ welcome\"\n\n### 使用 padStart 右对齐\n\n如果我们想右对齐某些内容，可以使用 `padStart`。\n\n```\nconst\
    \ strings = [\"short\",  \"medium length\",  \"very long string\"];\nconst longestString\
    \ =  strings.sort(str =>  str.length).map(str =>  str.length)[0];\nstrings.forEach(str\
    \ =>  console.log(str.padStart(longestString)));\n// very long string\n// medium\
    \ length\n// short\n```\n\n首先，我们找出最长的字符串并测量其长度。然后，基于最长字符串的长度，对所有字符串应用 `padStart`，这样它们就完美地右对齐了。\n\
    \n### 为填充添加自定义值\n\n我们不仅限于添加空格作为填充，还可以传入字符串和数字。\n\n`\"hello\".padEnd(13,\" Alberto\"\
    );` // \"hello Alberto\" `\"1\".padStart(3,0);` // \"001\" `\"99\".padStart(3,0);`\
    \ // \"099\"\n\n## Object.entries() 和 Object.values()\n\n首先创建一个对象。\n\n```\nconst\
    \ family =  {\n  father:  \"Jonathan Kent\",\n  mother:  \"Martha Kent\",\n  son:\
    \  \"Clark Kent\",\n}\n```\n\n在旧版本的 JavaScript 中，我们这样访问对象内部的值：\n\n```\nObject.keys(family);\
    \ // [\"father\", \"mother\", \"son\"]\nfamily.father; \"Jonathan Kent\"\n```\n\
    \n`Object.keys()` 只返回对象的键，然后我们必须用这些键来访问值。\n\n现在我们有了另外两种访问对象的方式：\n\n```\nObject.values(family);\
    \ // [\"Jonathan Kent\", \"Martha Kent\", \"Clark Kent\"]\nObject.entries(family);\
    \ // [\"father\", \"Jonathan Kent\"]\n// [\"mother\", \"Martha Kent\"]\n// [\"\
    son\", \"Clark Kent\"]\n```\n\n`Object.values()` 返回所有值的数组，而 `Object.entries()`\
    \ 返回一个包含键和值对的数组的数组。\n\n## Object.getOwnPropertyDescriptors()\n\n这个方法会返回一个对象的所有自身属性描述符。\n\
    \n它可以返回的属性包括 value、writable、get、set、configurable 和 enumerable。\n\n```\nconst myObj\
    \ =  {\n  name:  \"Alberto\",\n  age:  25,\n  greet() { console.log(\"hello\"\
    ); },\n}\nObject.getOwnPropertyDescriptors(myObj);\n// age:{value: 25, writable:\
    \ true, enumerable: true, configurable: true}\n// greet:{value: ƒ, writable: true,\
    \ enumerable: true, configurable: true}\n// name:{value: \"Alberto\", writable:\
    \ true, enumerable: true, configurable: true}\n```\n\n## 尾逗号\n\n这只是语法上的一个小改动。现在，在编写对象时，我们可以在每个参数后面加上一个尾逗号，无论它是不是最后一个参数。\n\
    \n```\n// 从这样\nconst object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\"\n\
    }\n// 变成这样\nconst object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\",\n}\n\
    ```\n\n注意我在第二个属性末尾写了一个逗号。\n\n如果你不写它，也不会抛出任何错误，但遵循这个习惯可以让你的同事或团队成员的工作更轻松。\n\n```\n\
    // 我这样写\nconst object =  {\n  prop1:  \"prop\",\n  prop2:  \"propop\"\n}\n// 我的同事更新代码，添加一个新属性\n\
