    ### Spread in Object Literals (ES 2018 / ES9)


    This feature is not part of ES6, but as we are already discussing this topic,
    it is worth mentioning that ES2018 introduced the Spread operator for Objects.


    Let''s look at an example:


    ```

    let person =  { name :  "Alberto", surname:  "Montalesi", age:  25, } let clone
    =  {...person}; console.log(clone); // Object { name: "Alberto", surname: "Montalesi",
    age: 25 }

    ```


    You can read more about ES2018 in Chapter 20.


    ## The Rest parameter


    The rest syntax looks exactly the same as the spread, 3 dots ... but it is quite
    the opposite of it. Spread expands an array, while rest condenses multiple elements
    into a single one.


    ```

    const runners = ["Tom",  "Paul",  "Mark",  "Luke"]; const [first,second,...losers]
    = runners; console.log(...losers); // Mark Luke

    ```


    We stored the first two values inside the const `first` and `second` and whatever
    was left we put it inside `losers` using the rest parameter.


