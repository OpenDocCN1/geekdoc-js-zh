    ### 2.3 Refactor the following code to use the arrow function syntax:


    function(arg) { console.log(arg); }


    # Chapter 3: Default function arguments


    Prior to ES6, setting default values to function arguments was not so easy. Let''s
    look at an example:


    function  getLocation(city,country,continent){ if(typeof country ===  ''undefined''){
    country =  ''Italy'' } if(typeof continent ===  ''undefined''){ continent =  ''Europe''
    } console.log(continent,country,city) } getLocation(''Milan'') // Europe Italy
    Milan getLocation(''Paris'',''France'') // Europe France Paris


    As you can see our function takes three arguments, a city, a country and a continent.
    In the function body we are checking if either country or continent are undefined
    and in that case we are giving them a default value.


    When calling getLocation(''Milan'') the second and third parameter (country and
    continent) are undefined and get replaced by the default values of our functions.


    But what if we want our default value to be at the beginning and not at the end
    of our list of arguments?


    function  getLocation(continent,country,city){ if(typeof country ===  ''undefined''){
    country =  ''Italy'' } if(typeof continent ===  ''undefined''){ continent =  ''Europe''
    } console.log(continent,country,city) } getLocation(undefined,  undefined,''Milan'')
    // Europe Italy Milan getLocation(undefined,''Paris'',''France'') // Europe Paris
    France


    If we want to replace any of the first arguments with our default we need to pass
    them as undefined, not really a nice looking solution. Luckily ES6 came to the
    rescue with default function arguments.


    ## Default function arguments


    ES6 makes it very easy to set default function arguments. Let''s look at an example:


    function  calculatePrice(total, tax =  0.1, tip =  0.05){ // When no value is
    given for tax or tip, the default 0.1 and 0.05 will be used return total + (total
    * tax) + (total * tip); }


    What if we don''t want to pass the parameter at all, like this:


    // The 0.15 will be bound to the second argument, tax even if in our intention
    it was to set 0.15 as the tip calculatePrice(100,  0.15)


    We can solve by doing this:


    // In this case 0.15 will be bound to the tip calculatePrice(100,  undefined,  0.15)


    It works, but it''s not very nice, how to improve it?


    With destructuring we can write this:


    function  calculatePrice({ total =  0, tax =  0.1, tip =  0.05}  =  {}){ return
    total + (total * tax) + (total * tip); } const bill =  calculatePrice({  tip:  0.15,  total:150  });
    // 187.5


    We made the argument of our function an Object. When calling the function, we
    don’t even have to worry about the order of the parameters because they are matched
    based on their key.


    In the example above the default value for tip was 0.05 and we overwrote it with
    0.15 but we didn''t give a value to tax which remained the default 0.1.


    Notice this detail:


    { total =  0, tax =  0.1, tip =  0.05 }  =  {}


    If we don''t default our argument Object to an empty Object, and we were to try
    and run calculatePrice() we would get:


    Cannot destructure property `total`  of  ''undefined'' or ''null''.


    By writing = {} we default our argument to an Object and no matter what argument
    we pass in the function, it will be an Object:


    calculatePrice({}); // 0 calculatePrice(); // 0 calculatePrice(undefined) // 0


    No matter what we passed, the argument was defaulted to an Object which had three
    default properties of total, tax and tip.


    function  calculatePrice({ total =  0, tax =  0.1, tip =  0.05}){ return total
    + (total * tax) + (total * tip); } calculatePrice({}); // cannot read property
    `total` of ''undefined'' or ''null''. calculatePrice(); // cannot read property
    `total` of ''undefined'' or ''null''. calculatePrice(undefined) // cannot read
    property `total` of ''undefined'' or ''null''.


    Don''t worry about destructuring, we will talk about it in Chapter 10.


    ## End of Chapter 3 Quiz


    ### 3.1 Write the code to accomplish the following task:


    In the following code, change arg1 and arg2 so that the first one represents the
    tax and the second one the tip value.


    Give tax a default value of 0.1 and tip a default value of 0.05.


    function  calculatePrice(total,arg1,arg2) { return total + (total * tax) + (total
    * tip); } calculatePrice(10); // expected result: 11.5


    ### 3.2 What is the correct output of the following code?


    var b =  3; function  multiply(a,b=2){ return a * b; } console.log(multiply(5));


    ![bullet](images/bullet_nb_square-blk.png)2


    ![bullet](images/bullet_nb_square-blk.png)5


    ![bullet](images/bullet_nb_square-blk.png)10


    ![bullet](images/bullet_nb_square-blk.png)15


    # Chapter 4: Template literals


    Prior to ES6 they were called template strings, now we call them template literals.
    Let''s have a look at what changed in the way we interpolate strings in ES6.


    ## Interpolating strings


    In ES5 we used to write this, in order to interpolate strings:


    var name =  "Alberto"; var greeting =  ''Hello my name is ''  + name; console.log(greeting);
    // Hello my name is Alberto


    In ES6 we can use backticks to make our lives easier.


    let name =  "Alberto"; const greeting =  `Hello my name is ${name}`; console.log(greeting);
    // Hello my name is Alberto'
