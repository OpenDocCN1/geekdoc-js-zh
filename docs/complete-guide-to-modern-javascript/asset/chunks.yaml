    }\n```\n\nThe class `Adult` extends the class `Human`, therefore it can access\
    \ the same protected methods.\n\n## Intersection Types and Union Types\n\nWe have\
    \ seen how we can define basic types with TypeScript, now let's dive into more\
    \ advanced types.\n\n### Intersection Types\n\nAs the name implies, Intersection\
    \ Types allow us to join together multiple types. Let's look at how to use them:\n\
    \n```\ninterface Person {\n  sex: 'male' | 'female' | 'N/A'\n  age: number,\n\
    }\ninterface Worker {\n  job: string\n}\ntype Adult = Person & Worker;\nconst\
    \ me: Adult = { sex: 'male', age: 27, job: 'software developer' }\nconsole.log(me);\
    \ // { sex: 'male', age: 27, job: 'software developer' }\n```\n\nAs you can see,\
    \ we have two distinct types, `Person` and `Worker` and we combined them together\
    \ to create the type `Adult` which is a combination of the two.\n\nBe careful\
    \ when combining types that have two properties of the same but of different types\
    \ because that will cause an error in the compiler.\n\n### Union Types\n\n```\n\
    const attendee = string | string[];\n```\n\nThe variable can be either a `string`\
    \ or an array of strings.\n\nAnother example may be:\n\n```\nconst identifier\
    \ = string | number | string[];\n```\n\nWe use the pipe (`|`) symbol to separate\
    \ each type.\n\nRemember that we can only access common members of all types of\
    \ the union.\n\n```\ninterface Kid { age: number }\ninterface Adult { age: number,\
    \ job: string }\nfunction person(): Kid | Adult { return { age: 27 } }\nconst\
    \ me = person();\nme.age  // ok\nme.job  // error\n```\n\nThe property `job` exists\
    \ only on the interface `Adult` and not on the `Kid` one therefore we cannot access\
    \ it in our Union Type.\n\n### Conclusion\n\nThis section showed you why TypeScript\
    \ can be a useful tool when working with JavaScript, especially when working together\
    \ with other people.\n\nWhat is left to do now is to start working on a simple\
    \ project and get familiar with it.\n"
  raw: 'An enum is a way of giving names to a set of numeric values:


    enum Status {deleted, pending, active} const blogPostStatus: Status =  Status.active;
    console.log(blogPostStatus); // 2


    The values inside of an enum start from 0 so in our example before active corresponds
    to 2, pending to 1 and deleted to 0.


    It is much more meaningful to say that the status of a blog post is active rather
    than 2.


    If you want, you can override the starting point of an enum by specifying it like
    this:


    enum Status {deleted =  -1, pending, active} const blogPostStatus: Status =  Status.active;
    console.log(blogPostStatus); // 1


    Now deleted corresponds to -1, pending to 0 and active to 1, much better than
    before.


    We can also access values of an enum based on their value:


    enum Status {deleted =  -1, pending, active} console.log(Status[0]); // pending


    ### any


    As the name implies, any means that the value of a certain variable can be anything.


    We may use it when dealing with 3rd party libraries that do not support TypeScript
    or when upgrading our existing code from plain JavaScript.


    any allows us to access properties and methods that may not exist.


    We can also use any when we only know part of our types:


    let firstUser: Object<any>  =  { name:  ''Alberto'', age:  27 } let secondUser:
    Object<any>  =  { name:  ''Caroline'' }


    We expect both variable to be of type object but we are not sure of their properties,
    therefore we use any.


    ### void


    void, as the name implies, defines the absence of type.


    It is often used in scenarios like this:


    function  storeValueInDatabase(objectToStore):  void  { // store your value in
    the database }


    This function takes an object and stores it in our database but does not return
    anything, that''s why we gave it a return value of void.


    When declaring variables of type void you will only be able to assign values of
    null and undefined to them.


    ### null and undefined


    Similarly to void, it is not very useful to create variables of type null or undefined
    because we would only be able to assign them null and undefined as values.


    When talking about union types you will see the use of these two types.


    ### never


    never is a value that never occur, for example we can use it for a function that
    never returns or that always throws an error.


    function  throwError(error:string):  never{ throw  new Error(error) }


    This function only throws an error, it will never return any value.


    ## Interfaces, Classes and more


    ### Interfaces


    In one of the prior examples I set the type of our variable like this: Array<{label:string,value:string}>


    But what if the shape of our variable is much more complicated and we need to
    reuse it in multiple places?


    We can use an interface to define the shape that that variable should have.


    interface Car { wheels:  number; color:  string; brand:  string; }


    Be careful, an interface is not an object, we use ; and not ,.


    We can also set optional properties like this:


    interface Car { wheels: number; color: string; brand: string; coupe?: boolean;
    }


    The ? defines the property as optional, even if we create a new car object without
    it, TypeScript won''t raise any error.


    Maybe we don''t want certain properties to be editable after the creation of the
    object, in that case we can mark them as readonly.


    interface Car { readonly wheels:  number; color:  string; brand:  string; coupe?:  boolean;
    }


    Upon creation of our car object we will be able to set the number of wheels but
    we won''t be able to change it afterwards.


    With interfaces we can also create the shape for functions, not justs objects.


    interface Greet { (greeting:  string, name:  string):  string } let greetingFunction:
    Greet; greetingFunction = (greeting:  string, name:  string):  string  =>  { console.log(`${greeting}
    ${name}`); return  `${greeting} ${name}`; } greetingFunction(''Bye'',''Alberto'');


    We create the shape that the function should have and then we assign the variable
    to a function of that said shape.


    If we assigned the variable to a function with a different shape that would have
    thrown an error.


    ### Extending Interfaces


    An interface can extend another interface and inherit the members of the previous
    one:


    interface Vehicle { wheels:  number; color:  string; } interface Airplane extends
    Vehicle { wings:  number; rotors:  number; }


    As you can see an object of type airplane will expect to have all four properties,
    not just the two defined in the interface Airplane.


    ### Classes


    TypeScript classes are very similar to ES6 classes and allow us to perform prototypal
    inheritance to build reusable components for our applications.


    Just as a reminder of how they look:


    class Animal { eat = ()=>  { console.log(''gnam gnam''); } sleep = () =>  { console.log(''zzzz'');
    } } class Human extends Animal { work = ()=>  { console.log(''zzzzzzz''); } }
    const me =  new  Human(); me.work(); // zzzzzzz me.eat(); // gnam gnam me.sleep()
    // zzzz


    We have created two classes, the second one inherits two methods from the first
    one.


    A difference with ES6 classes is that TypeScript allows us to define the way that
    class members will be accessed from our application.


    If we want them to be accessible anywhere we need to use the keyword public.


    class Animal { public eat = ()=>  { console.log(''gnam gnam'') } public sleep
    = () =>  { console.log(''zzzz'') } } const dog =  new  Animal(); dog.eat(); //
    gnam gnam


    In JavaScript all class members are public, we cannot restrict access to them.


    TypeScript also offers us to mark a member as private which means that it will
    not be accessible from outside of the class.


    class Animal { public eat = ()=>  { console.log(''gnam gnam'') } public sleep
    = () =>  { console.log(''zzzz'') } } class Human extends Animal { private work
    = ()=>  { console.log(''zzzzzzz'') } } const me =  new  Human(); me.work(); //
    Property ''work'' is private and only accessible within class ''Human''


    We can also mark a member as protected which means that it will be accessible
    only inside the class where it''s declared and the classes extending it.


    class Human { protected work = ()=>  { console.log(''zzzzzzz'') } } class Adult
    extends Human { public doWork = () =>  { console.log(this.work) } }


    The class Adult extends the class Human, therefore it can access the same protected
    methods.


    ## Intersection Types and Union Types


    We have seen how we can define basic types with TypeScript, now let''s dive into
    more advances types.


    ### Intersection Types


    As the name implies, Intersection Types allow us to join togther multiple types.
    Let''s look at how to use them:


    interface Person { sex:  ''male''  |  ''female''  |  ''N/A'' age:number, } interface
    Worker { job:  string } type Adult = Person & Worker; const me: Adult =  { sex:  ''male'',
    age:  27, job:  ''software developer'' } console.log(me); // { sex: ''male'',
    age: 27, job: ''software developer'' }


    As you can see, we have two distinct types, Person and Worker and we combined
    them together to create the type Adult which is a combination of the two.


    Be careful when combining types that have two properties of the same but of different
    types because that will cause an error in the compiler.


    ### Union Types


    const attendee = string | string[];


    The variable can be either a string or an array of strings.


    Another example may be:


    const identifier = string | number | string[];


    We use the pipe (|) symbol to separate each type.


    Remember that we can only access common members of all types of the union.


    interface Kid { age:number } interface Adult { age:  number, job:  string } function  person():
    Kid | Adult { return  { age:  27  } } const me =  person(); me.age  // ok me.job  //
    error


    The property job exists only on the interface Adult and not on the Kid one therefore
    we cannot access it in our Union Type.


    ### Conclusion


    This section showed you why TypeScript can be a useful tool when working with
    JavaScript, especially when working together with other people.


    What is left to do now is to start working on a simple project and get familiar
    with it.'
