    \ to define the shape that that variable should have.\n\n```\ninterface Car {\n\
    \  wheels: number;\n  color: string;\n  brand: string;\n}\n```\n\nBe careful,\
    \ an interface is not an object, we use `;` and not `,`.\n\nWe can also set optional\
