    \ a very simple promise to fetch a user from GitHub and print it to the console.\n\
    \nLet's see a different example:\n\n```javascript\nfunction  walk(amount) {\n\
    \  return  new  Promise((resolve,reject) =>  {\n    if (amount <  500) {\n   \
    \   reject (\"the value is too small\");\n    }\n    setTimeout(() =>  resolve(`you\
    \ walked for ${amount}ms`),amount);\n  });\n}\n\nwalk(1000).then(res =>  {\n \
    \ console.log(res);\n  return  walk(500);\n}).then(res =>  {\n  console.log(res);\n\
    \  return  walk(700);\n}).then(res =>  {\n  console.log(res);\n  return  walk(800);\n\
    }).then(res =>  {\n  console.log(res);\n  return  walk(100);\n}).then(res => \
    \ {\n  console.log(res);\n  return  walk(400);\n}).then(res =>  {\n  console.log(res);\n\
    \  return  walk(600);\n});\n// you walked for 1000ms\n// you walked for 500ms\n\
    // you walked for 700ms\n// you walked for 800ms\n// uncaught exception: the value\
    \ is too small\n```\n\nLet's see how we can rewrite this Promise with the new\
    \ async/await syntax.\n\n## Async and Await\n\n```javascript\nfunction  walk(amount)\
    \ {\n  return  new  Promise((resolve,reject) =>  {\n    if (amount <  500) {\n\
    \      reject (\"the value is too small\");\n    }\n    setTimeout(() =>  resolve(`you\
    \ walked for ${amount}ms`),amount);\n  });\n}\n\n// create an async function\n\
    async  function  go() {\n  // use the keyword `await` to wait for the response\n\
    \  const res =  await  walk(500);\n  console.log(res);\n  const res2 =  await\
    \  walk(900);\n  console.log(res2);\n  const res3 =  await  walk(600);\n  console.log(res3);\n\
    \  const res4 =  await  walk(700);\n  console.log(res4);\n  const res5 =  await\
    \  walk(400);\n  console.log(res5);\n  console.log(\"finished\");\n}\n\ngo();\n\
    // you walked for 500ms\n// you walked for 900ms\n// you walked for 600ms\n//\
    \ you walked for 700ms\n// uncaught exception: the value is too small\n```\n\n\
    Let's break down what we just did:\n\n1.  to create an async function we need\
    \ to put the `async` keyword in front of it\n2.  the keyword will tell JavaScript\
    \ to always return a promise\n3.  if we specify to return `<non-promise>` it will\
    \ return a value wrapped inside a promise\n4.  the `await` keyword only works\
    \ inside an async function\n5.  as the name implies, `await` will tell JavaScript\
    \ to wait until the promise returns its result\n\nLet's see what happens if we\
