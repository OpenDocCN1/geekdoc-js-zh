    Object.values(family); // ["Jonathan Kent", "Martha Kent", "Clark Kent"] Object.entries(family);
    // ["father", "Jonathan Kent"] // ["mother", "Martha Kent"] // ["son", "Clark
    Kent"]


    Object.values() returns an array of all the values whilst Object.entries() returns
