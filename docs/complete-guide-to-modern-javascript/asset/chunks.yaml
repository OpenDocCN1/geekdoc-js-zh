    # 第 16 章：Set、WeakSet、Map 和 WeakMap


    ## 什么是 `Set`？


    `Set` 是一个对象，我们可以在其中存储任何类型的唯一值。


    ```

    // create our set const family =  new  Set(); // add values to it family.add("Dad");
    console.log(family); // Set [ "Dad" ] family.add("Mom"); console.log(family);
    // Set [ "Dad", "Mom" ] family.add("Son"); console.log(family); // Set [ "Dad",
    "Mom", "Son" ] family.add("Dad"); console.log(family); // Set [ "Dad", "Mom",
    "Son" ]

    ```


    如你所见，最后我们尝试再次添加 "Dad"，但 `Set` 仍然保持不变，因为 `Set` 只能包含唯一值。


    让我们继续使用同一个 `Set`，看看我们可以对它使用哪些方法。


