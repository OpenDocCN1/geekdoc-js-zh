    \n# 第 19 章：ES2017 异步与等待\n\nES2017 引入了一种处理 Promise 的新方式，称为“async/await”。\n\n##\
    \ Promise 回顾\n\n在深入探讨这个新语法之前，我们先快速回顾一下通常如何编写 Promise：\n\n```javascript\n// 从 GitHub\
    \ 获取用户\nfetch('api.github.com/user/AlbertoMontalesi').then( res =>  {\n  // 以\
    \ JSON 格式返回数据\n  return  res.json();\n}).then(res =>  {\n  // 如果一切顺利，打印数据\n  console.log(res);\n\
    }).catch( err =>  {\n  // 或者打印错误\n  console.log(err);\n})\n```\n\n这是一个非常简单的 Promise，用于从\
    \ GitHub 获取用户并打印到控制台。\n\n让我们看另一个例子：\n\n```javascript\nfunction  walk(amount) {\n\
    \  return  new  Promise((resolve,reject) =>  {\n    if (amount <  500) {\n   \
    \   reject (\"the value is too small\");\n    }\n    setTimeout(() =>  resolve(`you\
    \ walked for ${amount}ms`),amount);\n  });\n}\n\nwalk(1000).then(res =>  {\n \
    \ console.log(res);\n  return  walk(500);\n}).then(res =>  {\n  console.log(res);\n\
    \  return  walk(700);\n}).then(res =>  {\n  console.log(res);\n  return  walk(800);\n\
    }).then(res =>  {\n  console.log(res);\n  return  walk(100);\n}).then(res => \
    \ {\n  console.log(res);\n  return  walk(400);\n}).then(res =>  {\n  console.log(res);\n\
    \  return  walk(600);\n});\n// you walked for 1000ms\n// you walked for 500ms\n\
    // you walked for 700ms\n// you walked for 800ms\n// uncaught exception: the value\
    \ is too small\n```\n\n让我们看看如何用新的 async/await 语法重写这个 Promise。\n\n## Async 和 Await\n\
    \n```javascript\nfunction  walk(amount) {\n  return  new  Promise((resolve,reject)\
    \ =>  {\n    if (amount <  500) {\n      reject (\"the value is too small\");\n\
    \    }\n    setTimeout(() =>  resolve(`you walked for ${amount}ms`),amount);\n\
    \  });\n}\n\n// 创建一个 async 函数\nasync  function  go() {\n  // 使用关键字 `await` 等待响应\n\
    \  const res =  await  walk(500);\n  console.log(res);\n  const res2 =  await\
    \  walk(900);\n  console.log(res2);\n  const res3 =  await  walk(600);\n  console.log(res3);\n\
    \  const res4 =  await  walk(700);\n  console.log(res4);\n  const res5 =  await\
    \  walk(400);\n  console.log(res5);\n  console.log(\"finished\");\n}\n\ngo();\n\
    // you walked for 500ms\n// you walked for 900ms\n// you walked for 600ms\n//\
    \ you walked for 700ms\n// uncaught exception: the value is too small\n```\n\n\
    让我们分解一下我们刚刚做了什么：\n\n1.  要创建一个 async 函数，我们需要在它前面加上 `async` 关键字\n2.  该关键字会告诉 JavaScript\
    \ 始终返回一个 Promise\n3.  如果我们指定返回 `<non-promise>`，它会返回一个包裹在 Promise 中的值\n4.  `await`\
    \ 关键字只能在 async 函数内部工作\n5.  顾名思义，`await` 会告诉 JavaScript 等待 Promise 返回其结果\n\n让我们看看如果尝试在\
    \ async 函数外部使用 `await` 会发生什么\n\n```javascript\n// 在普通函数中使用 await\nfunction  func()\
    \ {\n  let promise =  Promise.resolve(1);\n  let result =  await promise;\n}\n\
    func();\n// SyntaxError: await is only valid in async functions and async generators\n\
    \n// 在顶层代码中使用 await\nlet response =  Promise.resolve(\"hi\");\nlet result =  await\
    \ response;\n// SyntaxError: await is only valid in async functions and async\
    \ generators\n```\n\n记住：你只能在 async 函数内部使用 `await`。\n\n## 错误处理\n\n在普通的 Promise\
    \ 中，我们会使用 `.catch()` 来捕获 Promise 可能返回的错误。\n\n在这里，它并没有太大区别：\n\n```javascript\n\
