    ### 15.1


    1. 定义基本操作的自定义行为


    来自 MDN：


    `Proxy` 对象用于定义基本操作的自定义行为（例如属性查找、赋值、枚举、函数调用等）。


    ### 15.2


    1. 2


    `Proxy` 可以接受一个处理器和一个目标


    ### 15.3


    1. `Proxy` 的目标参数可以是另一个 `Proxy`


    它可以是任何类型的对象，包括原生数组、函数甚至另一个代理。


