    \ create a clone of our Object so that when we modify the original Object, the\
    \ clone does not get modified, similarly to what we saw when we talked about arrays.\n\
    \n## Asynchronous Iteration\n\nWith Asynchronous Iteration we can iterate asynchronously\
    \ over our data.\n\n[From the documentation:](https://github.com/tc39/proposal-async-iteration)\n\
    \nAn async iterator is much like an iterator, except that its `next()` method\
    \ returns a promise for a `{ value, done }` pair.\n\nTo do so, we will use a `for-await-of`\
    \ loop which works by converting our iterables to a Promise, unless they already\
    \ are one.\n\n```javascript\nconst iterables = [1,2,3];\nasync  function  test()\
    \ {\n  for  await (const value of iterables) {\n    console.log(value);\n  }\n\
    }\ntest();\n// 1\n// 2\n// 3\n```\n\nDuring execution, an async iterator is created\
    \ from the data source using the `[Symbol.asyncIterator]()` method.\n\nEach time\
    \ we access the next value in the sequence, we implicitly await the promise returned\
    \ from the iterator method.\n\n## Promise.prototype.finally()\n\nAfter our promise\
    \ has finished we can invoke a callback.\n\n```javascript\nconst myPromise = \
    \ new  Promise((resolve,reject) =>  {\n  resolve();\n})\n\nmyPromise\n.then( ()\
    \ =>  {\n  console.log('still working');\n})\n.catch( () =>  {\n  console.log('there\
    \ was an error');\n})\n.finally(()=>  {\n  console.log('Done!');\n})\n```\n\n\
    `.finally()` will also return a Promise so we can chain more `then` and `catch`\
    \ after it but those Promises will fulfill based on the Promise they were chained\
    \ onto.\n\n```javascript\nconst myPromise =  new  Promise((resolve,reject) =>\
