    \n```\nlet firstUser: Object<any> = { name: 'Alberto', age: 27 }\nlet secondUser:\
    \ Object<any> = { name: 'Caroline' }\n```\n\nWe expect both variable to be of\
    \ type object but we are not sure of their properties, therefore we use `any`.\n\
    \n### void\n\n`void`, as the name implies, defines the absence of type.\n\nIt\
    \ is often used in scenarios like this:\n\n```\nfunction storeValueInDatabase(objectToStore):\
