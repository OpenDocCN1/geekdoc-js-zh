    \n注意：我们仍然可以冻结 `const` 对象，这样就不会改变对象的内容（但尝试修改对象的值时，JavaScript 不会抛出任何错误）。\n\n```\n\
    const person = { name: 'Alberto', age: 25, }\nperson.age = 26;\nconsole.log(person.age);\
    \ // 26\nObject.freeze(person)\nperson.age = 30;\nconsole.log(person.age); //\
    \ 26\n```\n\n## 暂时性死区\n\n现在我们将探讨一个非常重要的概念，它的名字听起来可能很复杂，但我向你保证并非如此。\n\n首先来看一个简单的例子：\n\
    \n```\nconsole.log(i);\nvar i = \"I am a variable\"; // 预期输出：undefined\nconsole.log(j);\n\
    let j = \"I am a let\"; // 预期输出：ReferenceError: can't access lexical declaration\
    \ `j' before initialization\n```\n\n`var` 可以在定义之前被访问，但我们无法访问它们的值。`let` 和 `const`\
    \ 在定义之前不能被访问。\n\n尽管你可能会在其他资料上看到不同的说法，但 `var` 和 `let`（以及 `const`）都会受到**提升**的影响，这意味着它们在任何代码执行之前就会被处理，并被提升到其作用域（无论是全局还是块级作用域）的顶部。\n\
    \n主要区别在于：`var` 仍然可以在定义之前被访问，这会导致其值为 `undefined`。而 `let` 则会让变量处于**暂时性死区**，直到它们被声明为止。因此，在初始化之前访问它们会引发错误，这比得到\
    \ `undefined` 结果更容易调试代码。\n\n## 何时使用 Var、Let 和 Const\n\n并没有规定必须使用哪一个，人们也有不同的看法。这里我将介绍\
    \ JavaScript 社区中两位知名开发者的观点。\n\n第一个观点来自 [Mathias Bynes：](https://mathiasbynens.be/notes/es6-const)\n\
    \n1. 默认使用 `const`\n2. 仅在需要重新绑定时使用 `let`\n3. 在 ES6 中不应使用 `var`\n\n第二个观点来自 [Kyle\
    \ Simpson：](https://me.getify.com/)\n\n1. 对于跨多个（尤其是较大）作用域共享的顶层变量，使用 `var`\n2.\
    \ 对于较小作用域中的局部变量，使用 `let`\n3. 只有在编写了一些代码后，并且你相当确定不应该有变量重新赋值的情况下，才将 `let` 重构为 `const`\n\
    \n选择哪种观点完全取决于你。一如既往，请自行研究并找出你认为最佳的方式。\n\n我个人观点是默认始终使用 `const`，如果发现需要重新绑定值，再改用\
    \ `let`。\n\n## 第一章小测验\n\n### 1.1 以下代码的正确输出是什么？\n\n```\nvar greeting = \"Hello\"\
    ;\ngreeting = \"Farewell\";\nfor (var i = 0; i < 2; i++) {\n  var greeting = \"\
    Good morning\";\n}\nconsole.log(greeting);\n```\n\n![bullet](img/bullet_nb_square-blk.png)Hello\n\
    \n![bullet](img/bullet_nb_square-blk.png)Good morning\n\n![bullet](img/bullet_nb_square-blk.png)Farewell;\n\
    \n### 1.2 以下代码的正确输出是什么？\n\n```\nlet value = 1;\nif(true) {\n  let value = 2;\n\
    \  console.log(value);\n}\nvalue = 3;\n```\n\n![bullet](img/bullet_nb_square-blk.png)1\n\
    \n![bullet](img/bullet_nb_square-blk.png)2\n\n![bullet](img/bullet_nb_square-blk.png)3\n\
    \n### 1.3 以下代码的正确输出是什么？\n\n```\nlet x = 100;\nif (x > 50) {\n  let x = 10;\n}\n\
    console.log(x);\n```\n\n![bullet](img/bullet_nb_square-blk.png)10\n\n![bullet](img/bullet_nb_square-blk.png)100\n\
    \n![bullet](img/bullet_nb_square-blk.png)50\n\n### 1.4 以下代码的正确输出是什么？\n\n```\n\
    console.log(constant);\nconst constant = 1;\n```\n\n![bullet](img/bullet_nb_square-blk.png)undefined\n\
    \n![bullet](img/bullet_nb_square-blk.png)ReferenceError\n\n![bullet](img/bullet_nb_square-blk.png)1\n\
    \n# 第二章：箭头函数\n\n## 什么是箭头函数？\n\nES6 引入了胖箭头（`=>`）作为声明函数的一种方式。\n\n在 ES5 中，我们通常这样声明函数：\n\
    \n```\nconst greeting = function(name) {\n  return \"hello \" + name;\n}\n```\n\
    \n使用胖箭头的新语法如下：\n\n```\nvar greeting = (name) => {\n  return `hello ${name}`;\n\
    }\n```\n\n我们可以更进一步，如果只有一个参数，可以省略括号，写成：\n\n```\nvar greeting = name => {\n  return\
    \ `hello ${name}`;\n}\n```\n\n如果没有参数，则需要写成空括号，如下：\n\n```\nvar greeting = () =>\
    \ {\n  return \"hello\";\n}\n```\n\n## 隐式返回\n\n使用箭头函数，我们可以省略显式的 `return`，像这样返回：\n\
    \n```\nconst greeting = name => `hello ${name}`;\n```\n\n与旧的 ES5 函数并排比较：\n\n```\n\
    const oldFunction = function(name){\n  return `hello ${name}`\n}\nconst arrowFunction\
    \ = name => `hello ${name}`;\n```\n\n两个函数实现相同的结果，但新语法允许你更简洁。\n\n注意！可读性比简洁性更重要，因此如果你在团队中工作，且并非所有人都完全熟悉\
    \ ES6，你可能希望这样写函数：\n\n```\nconst arrowFunction = (name) => {\n  return `hello ${name}`;\n\
    }\n```\n\n假设我们想隐式返回一个对象字面量，可以这样做：\n\n```\nconst race = \"100m dash\";\nconst runners\
    \ = [ \"Usain Bolt\", \"Justin Gatlin\", \"Asafa Powell\" ];\nconst results =\
    \ runners.map((runner, i) => ({\n  name: runner,\n  race,\n  place: i + 1\n}));\n\
    console.log(results);\n// [{name: \"Usain Bolt\", race: \"100m dash\", place:\
    \ 1}\n// {name: \"Justin Gatlin\", race: \"100m dash\", place: 2}\n// {name: \"\
    Asafa Powell\", race: \"100m dash\", place: 3}]\n```\n\n在这个例子中，我们使用 `map` 函数遍历数组\
    \ `runners`。第一个参数是数组中的当前项，`i` 是它的索引。对于数组中的每一项，我们向 `results` 中添加一个包含属性 `name`、`race`\
    \ 和 `place` 的对象。\n\n为了告诉 JavaScript 花括号内是一个我们想要隐式返回的对象字面量，我们需要将整个内容包裹在括号中。\n\n\
    写 `race` 和 `race: race` 是等价的。\n\n## 箭头函数是匿名的\n\n从之前的例子可以看出，箭头函数是匿名的。\n\n如果我们想给它们一个名字以便引用，可以将它们绑定到一个变量：\n\
    \n```\nconst greeting = name => `hello ${name}`;\ngreeting(\"Tom\");\n```\n\n\
    ## 箭头函数与 `this` 关键字\n\n在使用箭头函数时，需要小心 `this` 关键字，因为它们的行为与普通函数不同。\n\n当你使用箭头函数时，`this`\
    \ 关键字继承自父作用域。\n\n这在以下情况下非常有用：\n\n<bdi><div class=\"box open\"></bdi> <bdi>这是一个盒子\
    \ </div></bdi>\n\n<bdi>.opening {</bdi> <bdi>background-color:red; }</bdi>\n\n\
    ```\n// 获取 class 为 box 的 div\nconst box = document.querySelector(\".box\");\n\
    // 监听点击事件\nbox.addEventListener(\"click\", function() {\n  // 切换 div 上的 opening\
    \ 类\n  this.classList.toggle(\"opening\");\n  setTimeout(function(){\n    // 尝试再次切换类\n\
    \    this.classList.toggle(\"opening\");\n  },500);\n});\n```\n\n这里的问题是，第一个 `this`\
    \ 绑定到了 `const box`，但第二个 `this`（在 `setTimeout` 内部）将指向 Window 对象，从而抛出以下错误：\n\n```\n\
    Uncaught TypeError: cannot read property \"toggle\" of undefined\n```\n\n由于我们知道箭头函数会从父作用域继承\
    \ `this` 的值，我们可以将函数重写如下：\n\n```\nconst box = document.querySelector(\".box\");\n\
    // 监听点击事件\nbox.addEventListener(\"click\", function() {\n  // 切换 div 上的 opening\
    \ 类\n  this.classList.toggle(\"opening\");\n  setTimeout(()=>{\n    // 尝试再次切换类\n\
    \    this.classList.toggle(\"opening\");\n  },500);\n});\n```\n\n这里，第二个 `this`\
    \ 将从其父级继承，并指向 `const box`。\n\n运行示例代码，你应该会看到我们的 div 在半秒内变为红色。\n\n## 何时应避免使用箭头函数\n\
    \n"
- fmt: "\nUsing what we know about the inheritance of the `this` keyword we can define\
    \ some instances where you should not use arrow functions.\n\nThe next two examples\
    \ show when to be careful using `this` inside of arrows.\n\nExample 1\n\n```javascript\n\
    const button = document.querySelector(\"btn\");\nbutton.addEventListener(\"click\"\
    , () => {\n  // error: this refers to the `Window` Object\n  this.classList.toggle(\"\
    on\");\n})\n```\n\nExample 2\n\n```javascript\nconst person1 = {\n  age: 10,\n\
    \  grow: function() {\n    this.age++;\n    console.log(this.age);\n  }\n}\nperson1.grow();\
    \ // 11\nconst person2 = {\n  age: 10,\n  grow: () => {\n    // error: this refers\
    \ to the `Window` Object\n    this.age++;\n    console.log(this.age);\n  }\n}\n\
    person2.grow();\n```\n\nAnother difference between Arrow functions and normal\
    \ functions is the access to the `arguments` object.\n\nThe `arguments` object\
    \ is an array-like object that we can access from inside functions and contains\
    \ the values of the arguments passed to that function.\n\nA quick example:\n\n\
    ```javascript\nfunction example(){\n  console.log(arguments[0])\n}\nexample(1,2,3);\
    \ // 1\n```\n\nAs you can see we accessed the first argument using an array notation\
    \ `arguments[0]`.\n\nSimilarly to what we saw with the `this` keyword, Arrow functions\
    \ inherit the value of the `arguments` object from their parent scope.\n\nLet's\
    \ have a look at this example with our previous list of runners:\n\n```javascript\n\
    const showWinner = () => {\n  const winner = arguments[0];\n  console.log(`${winner}\
    \ was the winner`)\n}\nshowWinner(\"Usain Bolt\", \"Justin Gatlin\", \"Asafa Powell\"\
    )\n```\n\nThis code will return:\n\n`ReferenceError: arguments is not defined`\n\
    \nTo access all the arguments passed to the function we can either use the old\
    \ function notation or the spread syntax (which we will discuss more in Chapter\
    \ 9)\n\nRemember that `arguments` is just a keyword, it's not a variable name.\n\
    \nExample with arrow function:\n\n```javascript\nconst showWinner = (...args)\
    \ => {\n  const winner = args[0];\n  console.log(`${winner} was the winner`)\n\
    }\nshowWinner(\"Usain Bolt\", \"Justin Gatlin\", \"Asafa Powell\") // \"Usain\
    \ Bolt was the winner\"\n```\n\nExample with function:\n\n```javascript\nconst\
    \ showWinner = function() {\n  const winner = arguments[0];\n  console.log(`${winner}\
    \ was the winner`)\n}\nshowWinner(\"Usain Bolt\", \"Justin Gatlin\", \"Asafa Powell\"\
    ) // \"Usain Bolt was the winner\"\n```\n\n## End of Chapter 2 Quiz\n\n### 2.1\
    \ What is the correct syntax for an arrow function?\n\n```javascript\nlet arr\
    \ = [1,2,3];\n//a) let func = arr.map(n -> n+1);\n//b) let func = arr.map(n =>\
    \ n+1);\n//c) let func = arr.map(n ~> n+1);\n```\n\n![bullet](images/bullet_nb_square-blk.png)a\n\
    \n![bullet](images/bullet_nb_square-blk.png)b\n\n![bullet](images/bullet_nb_square-blk.png)c\n\
    \n### 2.2 What is the correct output of the following code?\n\n```javascript\n\
    const person = {\n  age: 10,\n  grow: () => {\n    this.age++;\n  },\n}\nperson.grow();\n\
    console.log(person.age);\n```\n\n![bullet](images/bullet_nb_square-blk.png)10\n\
    \n![bullet](images/bullet_nb_square-blk.png)11\n\n![bullet](images/bullet_nb_square-blk.png)undefined\n\
    \n### 2.3 Refactor the following code to use the arrow function syntax:\n\n```javascript\n\
    function(arg) { console.log(arg); }\n```\n\n# Chapter 3: Default function arguments\n\
    \nPrior to ES6, setting default values to function arguments was not so easy.\
    \ Let's look at an example:\n\n```javascript\nfunction getLocation(city, country,\
    \ continent){\n  if(typeof country === 'undefined'){\n    country = 'Italy'\n\
    \  }\n  if(typeof continent === 'undefined'){\n    continent = 'Europe'\n  }\n\
    \  console.log(continent, country, city)\n}\ngetLocation('Milan') // Europe Italy\
    \ Milan\ngetLocation('Paris','France') // Europe France Paris\n```\n\nAs you can\
    \ see our function takes three arguments, a city, a country and a continent. In\
    \ the function body we are checking if either country or continent are undefined\
    \ and in that case we are giving them a default value.\n\nWhen calling `getLocation('Milan')`\
    \ the second and third parameter (country and continent) are undefined and get\
    \ replaced by the default values of our functions.\n\nBut what if we want our\
    \ default value to be at the beginning and not at the end of our list of arguments?\n\
    \n```javascript\nfunction getLocation(continent, country, city){\n  if(typeof\
    \ country === 'undefined'){\n    country = 'Italy'\n  }\n  if(typeof continent\
    \ === 'undefined'){\n    continent = 'Europe'\n  }\n  console.log(continent, country,\
    \ city)\n}\ngetLocation(undefined, undefined, 'Milan') // Europe Italy Milan\n\
    getLocation(undefined, 'Paris', 'France') // Europe Paris France\n```\n\nIf we\
    \ want to replace any of the first arguments with our default we need to pass\
    \ them as `undefined`, not really a nice looking solution. Luckily ES6 came to\
    \ the rescue with default function arguments.\n\n## Default function arguments\n\
    \nES6 makes it very easy to set default function arguments. Let's look at an example:\n\
    \n```javascript\nfunction calculatePrice(total, tax = 0.1, tip = 0.05){\n  //\
    \ When no value is given for tax or tip, the default 0.1 and 0.05 will be used\n\
    \  return total + (total * tax) + (total * tip);\n}\n```\n\nWhat if we don't want\
    \ to pass the parameter at all, like this:\n\n```javascript\n// The 0.15 will\
    \ be bound to the second argument, tax even if in our intention it was to set\
    \ 0.15 as the tip\ncalculatePrice(100, 0.15)\n```\n\nWe can solve by doing this:\n\
    \n```javascript\n// In this case 0.15 will be bound to the tip\ncalculatePrice(100,\
    \ undefined, 0.15)\n```\n\nIt works, but it's not very nice, how to improve it?\n\
    \nWith destructuring we can write this:\n\n```javascript\nfunction calculatePrice({\
    \ total = 0, tax = 0.1, tip = 0.05 } = {}){\n  return total + (total * tax) +\
    \ (total * tip);\n}\nconst bill = calculatePrice({ tip: 0.15, total:150 }); //\
    \ 187.5\n```\n\nWe made the argument of our function an Object. When calling the\
    \ function, we don’t even have to worry about the order of the parameters because\
    \ they are matched based on their key.\n\nIn the example above the default value\
    \ for tip was 0.05 and we overwrote it with 0.15 but we didn't give a value to\
    \ tax which remained the default 0.1.\n\nNotice this detail:\n\n```javascript\n\
    { total = 0, tax = 0.1, tip = 0.05 } = {}\n```\n\nIf we don't default our argument\
    \ Object to an empty Object, and we were to try and run `calculatePrice()` we\
    \ would get:\n\n```\nCannot destructure property `total` of 'undefined' or 'null'.\n\
    ```\n\nBy writing `= {}` we default our argument to an Object and no matter what\
    \ argument we pass in the function, it will be an Object:\n\n```javascript\ncalculatePrice({});\
    \ // 0\ncalculatePrice(); // 0\ncalculatePrice(undefined) // 0\n```\n\nNo matter\
    \ what we passed, the argument was defaulted to an Object which had three default\
    \ properties of total, tax and tip.\n\n```javascript\nfunction calculatePrice({\
    \ total = 0, tax = 0.1, tip = 0.05}){\n  return total + (total * tax) + (total\
    \ * tip);\n}\ncalculatePrice({}); // cannot read property `total` of 'undefined'\
    \ or 'null'.\ncalculatePrice(); // cannot read property `total` of 'undefined'\
    \ or 'null'.\ncalculatePrice(undefined) // cannot read property `total` of 'undefined'\
    \ or 'null'.\n```\n\nDon't worry about destructuring, we will talk about it in\
    \ Chapter 10.\n\n## End of Chapter 3 Quiz\n\n### 3.1 Write the code to accomplish\
    \ the following task:\n\nIn the following code, change `arg1` and `arg2` so that\
    \ the first one represents the tax and the second one the tip value.\n\nGive tax\
    \ a default value of 0.1 and tip a default value of 0.05.\n\n```javascript\nfunction\
    \ calculatePrice(total, arg1, arg2) {\n  return total + (total * tax) + (total\
    \ * tip);\n}\ncalculatePrice(10); // expected result: 11.5\n```\n\n### 3.2 What\
    \ is the correct output of the following code?\n\n```javascript\nvar b = 3;\n\
    function multiply(a, b=2){\n  return a * b;\n}\nconsole.log(multiply(5));\n```\n\
    \n![bullet](images/bullet_nb_square-blk.png)2\n\n![bullet](images/bullet_nb_square-blk.png)5\n\
    \n![bullet](images/bullet_nb_square-blk.png)10\n\n![bullet](images/bullet_nb_square-blk.png)15\n\
    \n# Chapter 4: Template literals\n\nPrior to ES6 they were called template strings,\
    \ now we call them template literals. Let's have a look at what changed in the\
    \ way we interpolate strings in ES6.\n\n## Interpolating strings\n\nIn ES5 we\
    \ used to write this, in order to interpolate strings:\n\n```javascript\nvar name\
    \ = \"Alberto\";\nvar greeting = 'Hello my name is ' + name;\nconsole.log(greeting);\
    \ // Hello my name is Alberto\n```\n\nIn ES6 we can use backticks to make our\
    \ lives easier.\n\n```javascript\nlet name = \"Alberto\";\nconst greeting = `Hello\
    \ my name is ${name}`;\nconsole.log(greeting); // Hello my name is Alberto\n```\n"
