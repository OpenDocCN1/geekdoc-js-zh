    Array.from(apple);


    ### 8.2


    1.  4


    Array.find() will return the first element that matches our condition.


    ### 8.3


    1.  true


    Array.some() will return true if one element matches the give condition


    ### 8.4


    1.  [1,4,9]


    The map function we passed will return "x * x" for each of the values in the array


    ### End of Chapter 9 Quiz


    ### 9.1


    1.  [...]


    ### 9.2


    const menu = [...veggie,  "pasta", ...meat];


    ### 9.3


    const [first,second,...losers] = runners; console.log(...losers)


    We use the rest operator to grab all the values remaining after the first two


    ### 9.4


    1.  [1, 2, 3, 4, 5]


    ### End of Chapter 10 Quiz


    ### 10.1


    const animal =  { name, age, breed, }


    ### 10.2


    1.  "Alberto"


    ### 10.3


    1.  color is not defined


    since the variable name and the property name don''t match we needed to write:
    color: favoriteColor instead of just color


    ### End of Chapter 11 Quiz


    ### 11.1


    1.  a primitive


    Symbols are a new type of primitive introduced in ES6


    ### 11.2


    1.  they are unique


    Symbols are always unique


    ### 11.3


    1.  Tom Jim


    The second time we assigned "Tom" we overwrote the first "Tom" because we did
    not use a symbol.


    ### 11.4


    1.  Symbol(Tom) Symbol(Jane) Symbol(Tom)


    This time we see all three of them because we stored them in a symbol, keeping
    them unique and avoiding naming collisions.


    ### End of Chapter 12 Quiz


    ### 12.1


    1.  just syntactic sugar


    classes are primarily syntactic sugar over JavaScript’s existing prototype-based
    inheritance. The class syntax does not introduce a new object-oriented inheritance
    model to JavaScript.


    ### 12.2


    1.  const person = class Person {...}


    1.  class Person {...}


    both answer 1 and 3 are correct. The first one is called class expression while
    the second one is called class declaration.


    ### 12.3


    1.  A method that can be accessed only by the class itself


    A static method is A method that can only be accessed by the class itself.


    ### 12.4


    1.  ReferenceError: Must call super constructor in derived class before accessing
    ''this''


    ### 12.5


    class Adult extends Person { constructor(name,age,work){ super(name,age); this.work  =
    work; } }


    Remember to add the keyword super to create the original class before you extend
    it.


    ### End of Chapter 13 Quiz


    ### 13.1


    1.  is an object representing the eventual completion or failure of an asynchronous
    operation


    ### 13.2


    const myPromise =  new  Promise((resolve, reject) =>  { resolve(); console.log("Good
    job!"); });


    ### 13.3


    1.  Promise.some()


    ### 13.4


    1.  3,4


    For the first two .then we did only passed one argument, meaning that we were
    calling console.log only if the promise resolved, but in our example it was being
    rejected. In the case of .catch the first argument is the callback for when a
    promise is being rejected and that is why we can see 3 being logged in the console.
    The latest .then is chained off of the promise created by .catch which resolved
    and therefore we also see 4 being logged.


    ### End of Chapter 14 Quiz


    ### 14.1


    1.  function*(){...}


    ### 14.2


    1.  It can be stopped and restarted


    ### 14.3


    1.  Object { value: "Pomelo", done: false }


    The last output of fruits.next(); is Object { value: "Pomelo", done: false }.
    Be careful that done is set to false and not true.


    ### 14.4


    1.  Object { value: undefined, done: true }'
