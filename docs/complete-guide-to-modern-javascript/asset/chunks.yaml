    As we mentioned, it will return the first element that matches our condition,
    that''s why we only got 4 and not 5.


    ## Array.findIndex()


    Array.findIndex() will return the index of the first element that matches our
    condition.


    const greetings = ["hello","hi","byebye","goodbye","hi"]; let foundIndex =  greetings.findIndex(e
    => e ===  "hi"); console.log(foundIndex); // 1


    Again, only the index of the first element that matches our condition is returned.


    ## Array.some() & Array.every()


    I''m grouping these two together because their use is self-explanatory: .some()
    will search if there are some items matching the condition and stop once it finds
    the first one. Whereas, .every() will check if all items match the given condition
    or not.


    const array = [1,2,3,4,5,6,1,2,3,1]; let arraySome =  array.some( e => e >  2);
    console.log(arraySome); // true let arrayEvery =  array.every(e => e >  2); console.log(arrayEvery);
    // false


    Simply put, the first condition is true, because there are some elements greater
    than 2, but the second is false because not every element is greater than 2.


