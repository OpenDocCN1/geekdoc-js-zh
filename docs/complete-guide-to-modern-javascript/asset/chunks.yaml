    \ await is only valid in async functions and async generators\n```\n\nRemember:\
    \ You can only use `await` inside an async function.\n\n## Error handling\n\n\
    In a normal promise we would use `.catch()` to catch eventual errors returned\
    \ by the promise.\n\nHere, it is not much different:\n\n```javascript\nasync \
