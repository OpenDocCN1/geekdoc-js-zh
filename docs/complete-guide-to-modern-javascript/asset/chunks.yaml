    ### 1.1


    1.  Good morning


    ### 1.2


    1.  2


    ### 1.3


    1.  100


    ### 1.4


    1.  ReferenceError


    ### End of Chapter 2 Quiz


    ### 2.1


    1.  B


    The correct syntax for an arrow function is the so called fat arrow =>


    ### 2.2


    1.  10


    Inside an arrow function, the this keyword inherits from its parent scope which
    in this case it''s the window, therefore the age remains 10.


    ### 2.3


    (arg) =>  { console.log(arg); }


    ### End of Chapter 3 Quiz


    ### 3.1


    function  calculatePrice(total, tax =  0.1, tip =  0.05){ // When no value is
    given for tax or tip, the default 0.1 and 0.05 will be used return total + (total
    * tax) + (total * tip);, }


    ### 3.2


    1.  10


    ### End of Chapter 4 Quiz


    ### 4.1


    let result =  `${a} ${c} ${d} ${b} ${e}`;


    ### 4.2


    let result =  `${a} ${c} ${b} ${e} ${d}`; console.log(result); // 1 plus 2 equals
    3


    ### 4.3


    console.log(`this is a very long text a very long text`); // this is a very long
    text // a very long text


    ### End of Chapter 5 Quiz


    ### 5.1


    1.  true


    it will begin checking after 3 characters


    ### 5.2


    1.  false


    endsWith is case sensitive


    ### 5.3


    let batman =  `${str.repeat(8)} ${bat}`; console.log(batman); // "NaNaNaNaNaNaNaNa
    BatMan"


    ### End of Chapter 6 Quiz


    ### 6.1


    let hungry =  "yes"; let full =  "no"; [hungry, full] = [full, hungry]; console.log(hungry);
    // no console.log(full); // yes


    ### 6.2


    let arr = [ "one",  "two",  "three" ]; // solution: let [one,two,three] = arr;
    console.log(one); // "one" console.log(two); // "two" console.log(three); // "three"


    ### End of Chapter 7 Quiz


    ### 7.1


    1.  for of


    ### 7.2


    1.  Tom Jerry Mickey


    ### End of Chapter 8 Quiz


