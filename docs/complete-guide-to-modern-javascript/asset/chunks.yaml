    如果之后你需要重新赋值某个 `const` 变量，只需将其改为 `let` 即可。就我个人而言，我倾向于默认使用 `const`。这样，如果我意外尝试重新赋值，就会看到错误，而不必在之后调试代码才发现引用了错误的变量。


    ### 关于变量命名的注意事项


    在命名变量时，有一些规则需要遵守。不过别担心，大多数规则都很容易记住。


    以下都是禁止的：


    ```

    // 变量名不能以数字开头 let 1apple =  "one apple"; // 变量名不能包含空格、符号和标点等字符 let hello!  =  "hello!";

    ```


    还有一些保留字不能用作变量名和函数名。


    |   |   |   |   |

    |---|---|---|---|

    | abstract | arguments | await | boolean |

    | break | byte | case | catch |

    | char | class | const | continue |

    | debugger | default | delete | do |

    | double | else | enum | eval |

    | export | extends | false | final |

    | finally | float | for | function |

    | goto | if | implements | import |

    | in | instanceof | int | interface |

    | let | long | native | new |

    | null | package | private | protected |

    | public | return | short | static |

    | super | switch | synchronized | this |

    | throw | throws | transient | true |

    | try | typeof | var | void |

    | volatile | while | with | yield |


    选择变量名时的经验法则是让它们具有描述性。


    避免使用首字母缩写、缩写和无意义的名称。


    ```

    // 不好 let cid =  12;  // `cid` 是什么？ // 好 let clientID =  12;  // 哦，是 `client id`
    // 不好 let id =  12  // 什么 id？userID？dogID？catID？ // 好 let userID =  12  // 具体一点

    ```


    如果你希望变量名尽可能具有描述性，那么它们很可能是由多个单词组成的。


    在这种情况下，最常见的两种变量命名方式是 camelCase 和 snake_case。


    ```

    // 不好 let lastloggedin =  ''''  // 难以阅读 // 好 let lastLoggedIn =  ''''  // camelCase
    let last_logged_in =  ''''  // snake_case

    ```


    无论你选择使用 camelCase（首单词后每个单词首字母大写）还是 snake_case（单词之间用下划线分隔），请记住保持一致并坚持你的选择。


    ## 数据类型


    JavaScript 是一种动态语言，这意味着与静态语言相反，你在定义变量时无需定义其类型。


    ```

    // 这是字符串还是数字？ var userID; userID =  12;  // 现在是数字 console.log(typeof userID);  //
    number userID =  ''user1''  // 现在是字符串 console.log(typeof userID);  // string

    ```


    这起初可能看起来很便捷，但在处理较大项目时可能会引发问题。


    在本书末尾，当你掌握了 JavaScript 的基础知识后，我将向你介绍 TypeScript，它为 JavaScript 增加了强类型。


    在 JavaScript 中，有 7 种数据类型：6 种原始类型和 `Object`。


    ### 原始类型


    原始值是一种简单的数据，它不是 `Object`，也没有方法。


    它们是：


    1. `string`

    1. `number`

    1. `boolean`

    1. `null`

    1. `undefined`

    1. `symbol`（最新添加的）


    让我们快速浏览一下它们，如果你有编程经验，可能已经了解其中一些。


    `string` 用于表示文本数据，无论是名称、地址还是书籍的章节。


    ```

    let userName =  "Alberto"; console.log(userName) // Alberto

    ```


    `number` 用于表示数值。


    在 JavaScript 中，没有专门用于整数的类型。


    ```

    let age =  25;

    ```


    `boolean` 用于表示值为 `true` 或 `false` 的数据。


    ```

    let married =  false;

    ```


    `null` 表示值的缺失，而 `undefined` 表示未定义的值。


    `symbol` 表示唯一且不可变的值。它是在 ES2015 中添加的，是该列表中最新的成员。


    我们将在第 11 章中更详细地了解它。


    ### 对象


    虽然我们之前讨论的 6 种原始类型只能保存单个值（无论是 `null`、`true`、`false` 等），但 `Object` 用于存储属性的集合。


    让我们先看一个简单的 `Object`：


    ```

    const car =  { wheels:  4, color:  "red", }

    ```


    这是一个简单的 `Object`，我用来存储我的汽车的属性。


    每个属性都有一个键（在第一行中是 `wheels`）和一个值（在本例中是 4）。


    键的类型是 `string`，但值可以是任何类型，也可以是函数，在这种情况下我们称它们为方法。


    ```

    const car =  { wheels:  4, color:  "red", drive:  function(){ console.log("wroom
    wroom") } } console.log(Object.keys(car)[0]) // wheels console.log(typeof  Object.keys(car)[0])
    // string car.drive(); // wroom wroom

    ```


    如你所见，我们现在可以在 `car` 对象上调用 `drive` 函数。


    别担心，我们将在下一章中更详细地介绍函数。


    ### 创建空对象


    我们在创建 `Object` 时不必声明属性。


    以下是创建空 `Object` 的两种方法：


    ```

    const car =  new  Object() const car =  {}

    ```


    更常用的语法是第二种，称为对象字面量。


    现在你有了一个新的空汽车对象，要为其添加新属性，只需这样做：


    ```

    car.color  =  ''red''; console.log(car) // {color: "red"}

    ```


    如你所见，我们使用点表示法向 `car` 对象添加新属性。


    如何访问 `Object` 上的属性呢？


    非常简单，我们有两种选择：


    ```

    const car =  { wheels:  4, color:  "red", } console.log(car.wheels); // 4 console.log(car[''color'']);
    // ''red''

    ```


    我们有两种不同的方式来做同一件事？为什么？


    嗯，它们并不完全相同。


    对于多词属性，我们不能使用点表示法。


    ```

    const car =  { wheels:  4, color:  "red", "goes fast":  true } console.log(car.goes
    fast); // 语法错误 console.log(car[''goes fast'']) // true

    ```


    当你想要使用多词属性时，需要记得用引号将它们的名称括起来，并且只能使用方括号表示法来访问它们。


    方括号表示法的另一个用途是通过键来访问 `Object` 的属性。


    假设我们的应用程序接收用户的输入，然后将其保存到一个变量中，该变量将用于访问我们的对象。


    用户正在寻找汽车，并且被要求告诉我们他/她喜欢的品牌。该品牌是一个键，我们将用它来仅显示相应的型号。


    为简单起见，在示例中每个品牌只有一个型号。


    ```

    const cars =  { ferrari:  "california", porsche:  "911", bugatti:  "veyron", }
    // 用户输入 const key =  "ferrari" console.log(cars.key); // undefined console.log(cars[''key'']);
    // undefined console.log(cars[key]); // california

    ```


    如你所见，我们需要使用方括号表示法通过存储在变量中的键来访问 `Object` 的属性。


    注意，`key` 周围没有引号，因为它是一个变量名，而不是字符串。


    ### 复制对象


    与原始类型不同，对象是通过引用复制的，这意味着如果我们写：


    ```

    let car =  { color:  ''red'' } let secondCar = car;

    ```


    我们的 `secondCar` 只会存储一个引用，即 `car` 的“地址”，而不是 `Object` 本身。


    看看这个例子就更容易理解了：


    ```

    let car =  { color:  ''red'' } let secondCar = car; car.wheels  =  4 console.log(car);
    // {color: ''red'', wheels: 4} console.log(secondCar); // {color: ''red'', wheels:
    4}

    ```


    如你所见，`secondCar` 只是存储了对 `car` 的引用，因此当我们修改 `car` 时，`secondCar` 也发生了变化。


    如果我们比较这两个对象，会发现一些有趣的事情：


    ```

    console.log(car == secondCar); // true console.log(car === secondCar); // true

    ```


    无论我们使用相等（`==`）还是严格相等（`===`），都会得到 `true`，这意味着这两个对象是同一个。


    只有对同一个 `Object` 进行比较时才会返回 `true`。


