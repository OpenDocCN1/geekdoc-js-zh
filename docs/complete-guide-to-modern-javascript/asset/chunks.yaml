    \n## What is a Generator?\n\nA generator function is a function that we can start\
    \ and stop, for an indefinite amount of time. And, restart with the possibility\
    \ of passing additional data at a later point in time.\n\nTo create a generator\
    \ function we write like this:\n\n```javascript\nfunction*  fruitList(){ yield\
    \  'Banana'; yield  'Apple'; yield  'Orange'; }\nconst fruits =  fruitList();\n\
    fruits; // Generator\nfruits.next(); // Object { value: \"Banana\", done: false\
    \ }\nfruits.next(); // Object { value: \"Apple\", done: false }\nfruits.next();\
    \ // Object { value: \"Orange\", done: false }\nfruits.next(); // Object { value:\
    \ undefined, done: true }\n```\n\nLet's have a look at the code piece by piece:\n\
    \n1.  we declared the function using `function*`\n2.  we used the keyword `yield`\
    \ before our content\n3.  we start our function using `.next()`\n4.  the last\
    \ time we call `.next()` we receive and empty object and we get `done: true`\n\
    \nOur function is paused between each `.next()` call.\n\n## Looping over an array\
    \ with a generator\n\nWe can use the `for of` loop to iterate over our generator\
    \ and yield the content at each loop.\n\n```javascript\n// create an array of\
    \ fruits\nconst fruitList = ['Banana','Apple','Orange','Melon','Cherry','Mango'];\n\
    // create our looping generator\nfunction*  loop(arr) {\n  for (const item of\
    \ arr) {\n    yield  `I like to eat ${item}s`;\n  }\n}\nconst fruitGenerator =\
    \  loop(fruitList);\nfruitGenerator.next(); // Object { value: \"I like to eat\
    \ Bananas\", done: false }\nfruitGenerator.next(); // Object { value: \"I like\
    \ to eat Apples\", done: false }\nfruitGenerator.next().value; // \"I like to\
    \ eat Oranges\"\n```\n\n1.  Our new generator will loop over the array and print\
