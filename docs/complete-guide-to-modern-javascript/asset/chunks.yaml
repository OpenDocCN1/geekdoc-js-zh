    # 第 5 章：其他字符串方法


    有许多方法可以用于字符串。以下是一些方法的列表：


    `indexOf()`


    获取字符串中指定值第一次出现的位置。


    ```javascript

    const str =  "this is a short sentence"; str.indexOf("short"); // 输出: 10

    ```


    `slice()`


    提取字符串的指定部分作为新字符串。


    ```javascript

    const str =  "pizza, orange, cereals" str.slice(0,  5); // 输出: "pizza"

    ```


    `toUpperCase()`


    将字符串中的所有字符转换为大写。


    ```javascript

    const str =  "i ate an apple" str.toUpperCase() // 输出: "I ATE AN APPLE"

    ```


    `toLowerCase()`


    将字符串中的所有字符转换为小写。


    ```javascript

    const str =  "I ATE AN APPLE" str.toLowerCase() // 输出: "i ate an apple"

    ```


    还有更多方法；这里只是列举了几个作为提醒。请查看 [MDN 文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String%23)
    以获取上述方法的更详细描述。


    ## 其他字符串方法


    ES6 引入了 4 个新的字符串方法：


    1.  `startsWith()`


    1.  `endsWith()`


    1.  `includes()`


    1.  `repeat()`


    ### `startsWith()`


    这个新方法将检查字符串是否以我们传入的值开头：


    ```javascript

    const code =  "ABCDEFG"; code.startsWith("ABB"); // false code.startsWith("abc");
    // false, startsWith 区分大小写 code.startsWith("ABC"); // true

    ```


    我们可以传入一个额外的参数，即方法开始检查的起始位置。


    ```javascript

    const code =  "ABCDEFGHI" code.startsWith("DEF",3); // true, 它将在 3 个字符后开始检查

    ```


    ### `endsWith()`


    与 `startsWith()` 类似，这个新方法将检查字符串是否以我们传入的值结尾：


    ```javascript

    const code =  "ABCDEF"; code.endsWith("DDD"); // false code.endsWith("def"); //
    false, endsWith 区分大小写 code.endsWith("DEF"); // true

    ```


    我们可以传入一个额外的参数，即检查结尾时要考虑的字符数。


    ```javascript

    const code =  "ABCDEFGHI" code.endsWith("EF",  6); // true, 6 表示我们只考虑前 6 个值 ABCDEF，是的，这个字符串以
    EF 结尾，因此我们得到 `true`

    ```


    ### `includes()`


    这个方法将检查我们的字符串是否包含我们传入的值。


    '
- fmt: '

    ```

    const code =  "ABCDEF" code.includes("ABB"); // false code.includes("abc"); //
    false, includes is case sensitive code.includes("CDE"); // true

    ```


    ### `repeat()`


    As the name suggests, this new method will take an argument that specifies the
    number of times it needs to `repeat` the string.


    ```

    let hello =  "Hi"; console.log(hello.repeat(10)); // "HiHiHiHiHiHiHiHiHiHi"

    ```


