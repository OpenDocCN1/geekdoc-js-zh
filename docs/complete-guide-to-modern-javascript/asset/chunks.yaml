    } } person1.grow(); // 11 const person2 =  { age:  10, grow: () =>  { // error:
    *this* refers to the `Window` Object this.age++; console.log(this.age); } } person2.grow();


    Another difference between Arrow functions and normal functions is the access
    to the arguments object.


    The arguments object is an array-like object that we can access from inside functions
    and contains the values of the arguments passed to that function.


    A quick example:


    function  example(){ console.log(arguments[0]) } example(1,2,3); // 1


    As you can see we accessed the first argument using an array notation arguments[0].


    Similarly to what we saw with the this keyword, Arrow functions inherit the value
    of the arguments object from their parent scope.


    Let''s have a look at this example with our previous list of runners:


    const showWinner = () =>  { const winner =  arguments[0]; console.log(`${winner}
    was the winner`) } showWinner( "Usain Bolt",  "Justin Gatlin",  "Asafa Powell"
    )


    This code will return:


    ReferenceError:  arguments is not defined


    To access all the arguments passed to the function we can either use the old function
    notation or the spread syntax(which we will discuss more in Chapter 9)


    Remember that arguments is just a keyword, it''s not a variable name.


    Example with arrow function:


    const showWinner = (...args) =>  { const winner = args[0]; console.log(`${winner}
    was the winner`) } showWinner("Usain Bolt",  "Justin Gatlin",  "Asafa Powell"
    ) // "Usain Bolt was the winner"


    Example with function:


    const showWinner =  function() { const winner =  arguments[0]; console.log(`${winner}
    was the winner`) } showWinner("Usain Bolt",  "Justin Gatlin",  "Asafa Powell")
    // "Usain Bolt was the winner"


    ## End of Chapter 2 Quiz


    ### 2.1 What is the correct syntax for an arrow function?


    let arr = [1,2,3]; //a) let func =  arr.map(n -> n+1); //b) let func =  arr.map(n
    => n+1); //c) let func =  arr.map(n ~> n+1);


