    ## Expression interpolations


    In ES5 we used to write this:


    ```javascript

    var a =  1; var b =  10; console.log(''1 * 10 is ''  + ( a * b)); // 1 * 10 is
    10

    ```


    In ES6 we can use backticks to reduce our typing:


    ```javascript

    var a =  1; var b =  10; console.log(`1 * 10 is ${a * b}`); // 1 * 10 is 10

    ```


    ## Create HTML fragments


    In ES5 we used to do this to write multi-line strings:


    ```javascript

    // We have to include a backslash on each line var text =  "hello, \ my name is
    Alberto \ how are you?\ "

    ```


    In ES6 we simply have to wrap everything inside backticks, no more backslashes
    on each line.


    ```javascript

    const content =  `hello, my name is Alberto how are you?`;

    ```


    ## Nesting templates


    It''s very easy to nest a template inside another one, like this:


    ```javascript

    const people = [{name:  ''Alberto'',age:  27 },{name:  ''Caroline'',age:  27 },{name:  ''Josh'',age:  31
    }]; const markup =  ` <ul> ${people.map(person =>  `<li> ${person.name}</li>`)}
    </ul> `; console.log(markup); // <ul> // <li> Alberto</li>,<li> Caroline</li>,<li>
    Josh</li> // </ul>

    ```


    Here we are using the `map` function to loop over each of our people and display
    a `li` tag containing the name of the person.


    ## Add a ternary operator


    We can easily add some logic inside our template string by using a ternary operator.


    The syntax for a ternary operator looks like this:


    ```javascript

    const isDiscounted =  false function  getPrice(){console.log(isDiscounted ?  "$10"
    : "$20"); } getPrice(); // $20

    ```


    If the condition before the `?` can be converted to `true` then the first value
    is returned, else it''s the value after the `:` that gets returned.


    ```javascript

    // create an artist with name and age const artist =  { name:  "Bon Jovi", age:  56,
    }; // only if the artist object has a song property we then add it to our paragraph,
    otherwise we return nothing const text =  ` <div> <p> ${artist.name} is ${artist.age}
    years old ${artist.song  ?  `and wrote the song ${artist.song}` : ''''  } </p>
    </div> ` // <div> // <p> Bon Jovi is 56 years old // </p> // </div> const artist
    =  { name:  "Trent Reznor", age:  53, song:  ''Hurt'' }; // <div> // <p> Trent
    Reznor is 53 years old and wrote the song Hurt // </p> // </div>

    ```


    ## Pass a function inside a template literal


    Similarly to the example above (line 10 of the code), if we want to, we can pass
    a function inside a template literal.


    ```javascript

    const groceries =  { meat:  "pork chop", veggie:  "salad", fruit:  "apple", others:
    [''mushrooms'',  ''instant noodles'',  ''instant soup''], } // this function will
    map each individual value of our groceries function  groceryList(others) { return  `
    <p> ${others.map( other =>  ` <span>${other}</span>`).join(''\n'')} </p> `; }
    // display all our groceries in a p tag, the last one will include all the one
    from the array **others** const markup =  ` <div> <p>${groceries.meat}</p> <p>${groceries.veggie}</p>
    <p>${groceries.fruit}</p> <p>${groceryList(groceries.others)}</p> <div> ` // <div>
    // <p>pork chop</p> // <p>salad</p> // <p>apple</p> // <p> // <p> // <span>mushrooms</span>
    // <span>instant noodles</span> // <span>instant soup</span> // </p> // </p> //
    <div>

    ```


    Inside of the last `p` tag we are calling our function `groceryList` passing it
    all the others groceries as an argument.


    Inside of the function we are returning a `p` tag and we are using `map` to loop
    over each of our items in the grocery list returning an Array of `span` tags containing
    each grocery. We are then using `.join(''\n'')` to add a new line after each of
    those `span`.


    ## Tagged template literals


    By tagging a function to a template literal we can run the template literal through
    the function, providing it with everything that''s inside of the template.


    The way it works is very simple: you just take the name of your function and put
    it in front of the template that you want to run it against.


    ```javascript

    let person =  "Alberto"; let age =  25; function  myTag(strings,personName,personAge){
    let str = strings[1]; let ageStr; personAge >  50  ? ageStr =  "grandpa" : ageStr
    =  "youngster"; return personName + str + ageStr; } let sentence = myTag`${person}
    is a ${age}`; console.log(sentence); // Alberto is a youngster

    ```


    We captured the value of the variable `age` and used a ternary operator to decide
    what to print. `strings` will take all the strings of our `let sentence` whilst
    the other parameters will hold the variables.


    In our example our string is divided in 3 pieces: `${person}`, `is a` and `${age}`.


    We use array notation to access the string in the middle like this:


    ```javascript

    let str = strings[1];

    ```


    To learn more about use cases of template literals check out [this article](https://codeburst.io/javascript-es6-tagged-template-literals-a45c26e54761)
    ([https://codeburst.io/javascript-es6-tagged-template-literals-a45c26e54761](https://codeburst.io/javascript-es6-tagged-template-literals-a45c26e54761)).


