    We can combine a setTimeout() to wait a certain amount of time before resolving.


    const myPromise =  new  Promise((resolve, reject) =>  { setTimeout(() =>  { resolve("The
    value we get from the promise"); },  2000); }); myPromise.then( data =>  { console.log(data);
    }); // after 2 seconds ... // The value we get from the promise


    These two examples are very simple but promises are very useful when dealing with
    big requests of data.


    In the example above we kept it simple and only resolved our promise but in reality
    you will also encounter errors so let''s see how to deal with them:


    const myPromise =  new  Promise((resolve, reject) =>  { setTimeout(() =>  { reject(Error("this
    is our error")); },  2000); }); myPromise .then(data =>  { console.log(data);
    }) .catch(err =>  { console.error(err); }) // Error: this is our error // Stack
    trace: // myPromise</<@debugger eval code:3:14


    We use .then() to grab the value when the promise resolves and .catch() when the
    promise rejects.


    Looking at our error log you can see that it tells us where the error occurred,
    that is because we wrote reject(Error("this is our error")); and not simply reject("this
    is our error");.


    ### Chaining promises


