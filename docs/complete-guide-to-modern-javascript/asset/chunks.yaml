    // "two" console.log(three); // "three"

    ```


    # 第 7 章：可迭代对象与循环


    ## `for of` 循环


    ES6 引入了一种新的循环类型：`for of` 循环。


    让我们看看它是如何使用的。


    ### 遍历数组


    通常，我们会使用以下方法进行遍历：


    ```

    var fruits = [''apple'',''banana'',''orange'']; for (var i =  0; i <  fruits.length;
    i++){ console.log(fruits[i]); } // apple // banana // orange

    ```


    这是一个普通的循环，每次迭代将 `i` 的值增加 1，直到它小于 `fruits.length`。此时循环停止。


    看看我们如何使用 `for of` 循环实现同样的效果：


    ```

    const fruits = [''apple'',''banana'',''orange'']; for(const fruit of fruits){
    console.log(fruit); } // apple // banana // orange

    ```


    ### 遍历对象


    对象是不可迭代的，那么我们如何遍历它们呢？


    我们必须首先使用类似 `Object.keys()` 或新的 ES6 函数 `Object.entries()` 来获取对象的所有值。


    ```

    const car =  { maker:  "BMW", color:  "red", year :  "2010", } for (const prop
    of  Object.keys(car)){ const value = car[prop]; console.log(prop,value); } //
    maker BMW // color red // year 2010

    ```


    ## `for in` 循环


    尽管它不是 ES6 的新循环，但让我们看看 `for in` 循环，以了解它与 `for of` 循环的区别。


    `for in` 循环略有不同，因为它会以任意顺序遍历对象的所有[可枚举属性](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Enumerability_and_ownership_of_properties)。


    因此，建议不要在迭代期间添加、修改或删除对象的属性。因为无法保证它们会被访问到，或者是在修改之前还是之后被访问。


    ```

    const car =  { maker:  "BMW", color:  "red", year :  "2010", } for (const prop
    in car){ console.log(prop, car[prop]); } // maker BMW // color red // year 2010

    ```


    ## `for of` 与 `for in` 的区别


    通过查看这个例子，我们可以看到第一个区别：


    ```

    let list = [4,  5,  6]; // for...in 返回键的列表 for (let i in list) { console.log(i);  //
    "0", "1", "2", } // for ...of 返回值 for (let i of list) { console.log(i);  // "4",
    "5", "6" }

    ```


    `for in` 会返回键的列表，而 `for of` 会返回被迭代对象数值属性的值的列表。


