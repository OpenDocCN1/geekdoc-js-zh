  md: 'But some applications of XML can make this simple, top-to-bottom approach to


    writing documents impractical.


    For example, you might need to add elements or set attributes near the top of
    a


    document after you generate all the tags that follow. Additionally, writing XML


    requires you to replace correctly special characters such as &, <, and \>, as
    well as


    non-English characters such as Ü, with the appropriate character entities. Attempt-


    ing to achieve these feats simply by manipulating PHP strings is a fast track
    to


    hair loss.


    The DOM XML extension allows you to add, remove, and modify elements


    throughout a document in any order, and will take care of all the character escap-


    ing for you. For example, constructing an RSS feed, most of which is rendered


    straight from database content that’s likely to contain more than a few special


    characters, will be a lot easier if you use the DOM rather than render the XML


    yourself.


    The following example shows the above XML document built using the DOM:


    File: **8.php**


    <?php


    // Instantiate new XML document


    $dom = domxml\_new\_doc(''1.0'');


    // Create the root <example> element


    $example = $dom->create\_element(''example'');


    // Create the date element


    $date = $dom->create\_element(''date'');


    // Create a text node to place the date in


    $dateText = $dom->create\_text\_node(date(''h:ia l jS M Y''));


    // Append the date text node to the <date> element


    $date->append\_child($dateText);


    // Append the <date> element to the <example> element


    $example->append\_child($date);


    // Append the root element to the document


    $dom->append\_child($example);


    // Send the XML MIME type


    header(''Content-Type: text/xml'');


    Chapter 2: XML


