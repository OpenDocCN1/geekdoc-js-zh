  md: "**The Observer Pattern**\n\nThe **observer pattern** is a useful solution for\
    \ triggering events upon a specified\n\noccurrence within your application.\n\n\
    For example, you may have a back end administration tool that allows authorized\n\
    \nusers to add articles to your Website. When an article is published, a number\
    \ of\n\nthings may need to happen in addition to storing the content in the database;\n\
    \nfor instance, you may need to refresh the site’s cached HTML files, send an\
    \ email\n\nto subscribers to inform them of the new content, and perhaps update\
    \ a static\n\nXML document that contains your site’s RSS feed, which others use\
    \ to stay up-\n\nto-date about the content you publish. The observer pattern makes\
    \ triggering\n\nthese additional features easy and modular.\n\nThe terminology\
    \ of the observer pattern is that the object doing the work (in this\n\ncase,\
    \ perhaps it’s a class called Article) is the **observable**, while the objects\
    \ that\n\nrespond to changes in the observable (i.e. the cache-, email-, and RSS-related\n\
    \nclasses) are known as **observers**. The general process of using the observer\
    \ pattern\n\nis to attach the observers to the observable. Then, when changes\
    \ occur in the\n\nobservable, it notifies the observers, leaving them to take\
    \ further action.\n\nUnderstanding how the observer pattern works in practice\
    \ can be a little confusing.\n\nLet’s look at the base classes required to implement\
    \ it, but don’t worry if this\n\ndoesn’t make sense at first glance; using the\
    \ observer pattern is a lot easier that\n\nunderstanding it!\n\nFirst, let’s look\
    \ at the base Observable class:\n\nFile: **Observer/Observable.php**** (in ****SPLIB****)**\n\
    \n<?php\n\n/\\*\\*\n\n \\* Base Observerable class\n\n \\* @abstract\n\n \\*/\n\
    \nclass Observable {\n\n /\\*\\*\n\n \\* Array of Observers\n\n \\* @access private\n\
    \n \\* @var array\n\n \\*/\n\n var $observers;\n\n /\\*\\*\n\n347\n\nThe Observer\
    \ Pattern"
  merge: -1
  pgno: 365
- img_proc: true
  md: " \\* Constructs the Observerable object\n\n \\*/\n\n function Observable()\n\
    \n {\n\n $this->observers = array();\n\n }\n\n /\\*\\*\n\n \\* Calls the update()\
    \ function using the reference to each\n\n \\* registered observer, passing an\
    \ optional argument for the\n\n \\* event - used by children of Observable\n\n\
    \ \\* @return void\n\n \\*/\n\n function notifyObservers($arg = NULL)\n\n {\n\n\
    \ $keys = array\\_keys($this->observers);\n\n foreach ($keys as $key) {\n\n $this->observers\\\
    [$key\\]->update($this, $arg);\n\n }\n\n }\n\n /\\*\\*\n\n \\* Attaches an observer\
    \ to the observable\n\n \\* @return void\n\n \\*/ \n\n function addObserver(&$observer)\n\
    \n {\n\n $this->observers\\[\\] = &$observer;\n\n }\n\n}\n\n?>\n\nLet’s take a\
    \ moment to review the methods here. addObserver is used to register\n\nan observer\
    \ object with the observable, and add it to the internal array of observ-\n\n\
    ers. This is used before the observable class does anything, and sets the scene\
    \ for\n\nthe observers to respond to events.\n\nThe notifyObservers method is\
    \ used by the observable to tell all the observers\n\nthat something has happened.\
    \ It takes an optional argument, so that, if need be,\n\nthe observable can tell\
    \ observers something about the event efficiently. This\n\nmethod calls the update\
    \ method for each observer, passing a reference to the\n\nobservable along with\
    \ the argument:\n\n $this->observers\\[$key\\]->update($this, $arg);\n\nChapter\
    \ 7: Design Patterns\n\n348"
  merge: -1
  pgno: 366
- img_proc: true
  md: "The update method is part of the Observer base class, which all observers must\n\
    \nextend:\n\nFile: **Observer/Observer.php**** (in ****SPLIB****)**\n\n<?php\n\
    \n/\\*\\*\n\n \\* Base Observer class\n\n \\*/\n\nclass Observer {\n\n /\\*\\\
    *\n\n \\* Abstract function implemented by children to respond to\n\n \\* to changes\
    \ in Observable subject\n\n \\* @abstract\n\n \\* @return void\n\n \\*/\n\n function\
    \ update(&$source, $arg) {}\n\n}\n\n?>\n\nThe update method doesn’t do anything\
    \ for the base class, but in subclasses it\n\nshould be overridden to respond\
    \ to events.\n\nWith the base classes in place, let’s see how the pattern works\
    \ with some skeleton\n\nclasses that would allow articles to be published, and\
    \ deal with cache, email noti-\n\nfication and RSS issues.\n\nFile: **12.php****\
    \ (excerpt)**\n\n<?php\n\n// Include the Observable and Observer base classes\n\
    \nrequire\\_once 'Observer/Observable.php';\n\nrequire\\_once 'Observer/Observer.php';\n\
    \nclass Article extends Observable {\n\n // To publish an article\n\n function\
    \ publish()\n\n {\n\n echo 'Publishing article.<br />';\n\n // Perform query here\
    \ that updates the database\n\n $this->notifyObservers('published');\n\n }\n\n\
    \ // To delete an article\n\n function delete()\n\n {\n\n echo 'Deleting article.<br\
    \ />';\n\n // Perform query here that deletes an article\n\n349\n\nThe Observer\
    \ Pattern"
  merge: -1
  pgno: 367
- img_proc: true
  md: " $this->notifyObservers('deleted');\n\n }\n\n}\n\nThe Article class is the\
    \ observable, inheriting from the Observable class. It\n\nprovides two (skeleton)\
    \ methods, which publish and delete an article. After the\n\ndatabase update has\
    \ been performed, each of these methods calls the\n\nnotifyObservers method, passing\
    \ an argument to indicate to the observers the\n\nnature of the event.\n\nHere\
    \ are the observer classes:\n\nFile: **12.php**** (excerpt)**\n\nclass Cache extends\
    \ Observer {\n\n function update(&$source, $arg)\n\n {\n\n switch ($arg) {\n\n\
    \ case 'published':\n\n case 'deleted':\n\n echo 'Refreshing cache<br />';\n\n\
    \ break;\n\n }\n\n }\n\n}\n\nclass Subscribers extends Observer {\n\n function\
    \ update(&$source, $arg)\n\n {\n\n switch ($arg) {\n\n case 'published':\n\n echo\
    \ 'Notifying subscribers by email<br />';\n\n break;\n\n }\n\n }\n\n}\n\nclass\
    \ RSSFeed extends Observer {\n\n function update(&$source, $arg)\n\n {\n\n switch\
    \ ($arg) {\n\n case 'published':\n\n case 'deleted':\n\n echo 'Updating the RSS\
    \ Feed<br />';\n\n break;\n\n }\n\nChapter 7: Design Patterns\n\n350"
