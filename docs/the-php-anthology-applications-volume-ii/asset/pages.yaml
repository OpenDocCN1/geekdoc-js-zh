  md: '**Design Patterns**


    **7**


    With a grasp of object oriented programming under your belt, thanks to Volume


    I, Chapter 2, I’ll bet you’re wide-eyed and wondering what to do with all this


    great new stuff that’s supposed to help you write maintainable, well-designed


    PHP applications, right? This is a common problem for developers coming to


    grips with the object oriented paradigm. It takes a long time to do anything really


    useful with OOP, many of their early attempts being no more than long sections


    of procedural code wrapped in a few class methods.


    Thankfully, object oriented programming has been around for quite some time


    and is supported by many languages; overcoming such problems is well-trodden


    territory. More importantly, our OOP coding ancestors were kind enough to put


    together a catalog of best practices, known as **design patterns**, which worked


    over and over again, and could be readily applied to solving problems in a uniform


    manner. The landmark publication was the book, *Design Patterns* (Addison-Wesley,


    ISBN: 0-201-63361-2) by the “Gang of Four” (Erich Gamma, Richard Helm,


    Ralph Johnson and John Vlissides), which has become a modern classic in IT


    literature—if, indeed, such a thing is possible. Search Amazon for “Design Pat-


    terns,” and you can’t miss it. While you’re browsing Amazon, it’s also worth


    looking at Martin Fowler’s *Patterns of Enterprise Application Architecture* (Addison-


    Wesley, ISBN: 0-321-12742-0), which provides further patterns, many of which


    relate directly to the problems developers encounter when building Web-based


    applications.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'My own opinion of design patterns is that they provide a shortcut to discovering


    the way you’d probably *end up* solving a particular problem, provided you had


    enough time to experiment with all the possible ways you might structure your


    code. In other words, they’re down-to-earth descriptions of how a group of pro-


    grammers found they could best solve the problems they faced.


    Talking about what design patterns *are* is something I generally prefer to avoid.


    It’s like trying to explain the concept of snow to someone who’s grown up in the


    Sahara desert; until you’ve seen snow for yourself, it’s not going to make much


    sense. Reading the solutions in this chapter, which look at specific examples
    using


    real code, is, in my opinion, a far better way to grasp the concepts.


    But, to give you a rough idea of where this chapter is headed, consider this:
    in


    your Web building experience, have you ever had a feeling of *déjà vu*? Have you


    ever said to yourself, “I’ve done this before,” or, “I’m sure I saw a really good


    solution to this problem. Now, where was it?”


    What the Gang of Four did with *Design Patterns* was identify twenty three common


    problems that give developers that *déjà vu* feeling, and provide guidelines for
    how


    we could best solve each. Time has shown that the Gang of Four (GoF) got it


    right; use of their solutions typically helps developers write applications that
    are


    easy to maintain, yet are able to cope with the special cases that occur in the
    real


    world. The adage “design is dead,” often quoted these days in discussions of the


    visual design of Websites, can also be applied to object oriented programming,


    thanks to design patterns. If you can learn to spot the problem in the first place,


    the solution is just a matter of identifying and applying the right pattern.


    A welcome side-effect of studying design patterns is that they often help people


    learn how to get the most out of the object oriented paradigm. In reading this


    chapter, you may find that object oriented PHP becomes much richer, rather


    than feeling overwhelmed by a whole load of new syntax that you have no idea


    what to do with.


    Although the GoF laid out a catalog of twenty three patterns, we’ll only cover


    the five that I’ve found to be used or useful in PHP 4, to give you a taste of
    what


    design patterns are about. A more in depth analysis of object oriented program-


    ming is beyond the scope of this book. This is not to say that other patterns¹


    cannot be usefully applied in PHP, but I’ve included here the patterns that can


    be easily applied to any PHP application, and do not suggest some sort of


    framework that affects the structure of your application.


    1The Model-View-Controller (MVC) pattern, the Command Pattern and the Template
    Method, to


    name a few.


    Chapter 7: Design Patterns


    312'
