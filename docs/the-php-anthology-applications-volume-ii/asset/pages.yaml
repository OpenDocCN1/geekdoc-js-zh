    \n );\n\n }\n\nWhat’s happening here is a little more difficult to explain. First,\
    \ we’ve defined\n\nthe **dispatch map**, which contains a list of the SOAP method\
    \ calls that can be\n\nmade to this server. For each method, we need to define\
    \ the input (arguments\n\nthe method accepts) and the output (the value returned\
    \ from the method). For\n\na primitive type (such as a string or integer value)\
    \ that’s used as input or output,\n\nthis can be defined simply by naming the\
    \ variable type. You can see we’ve specified\n\nthat the article\\_id argument\
    \ of getArticleById must be of type int (an in-\n\nteger).\n\nThe output types\
    \ in this example are a little more tricky and really require some\n\nunderstanding\
    \ of WSDL to be grasped completely. Simply put, because the results\n\nof the\
    \ two methods are complex types—an array of articles and a full article, re-\n\
    \nspectively—we need to use a pointer to the full type definition. The definition\n\
    \nfor the full article type, for example, is provided by this code:\n\n $this->\\\
    _\\_typedef\\['ArticleFull'\\] = array(\n\n 'title' => 'string',\n\n 'author'\
    \ => 'string',\n\n 'body' => 'string'\n\n );\n\nHere, you see the name of the\
    \ complex type, ArticleFull, and a definition of\n\nthe primitive types of which\
    \ it is composed. A complex type definition can also\n\ncontain additional complex\
    \ types. Careful scrutiny of the code will reveal that\n\nwe’ve done this to describe\
    \ the array of articles returned by getArticles.\n\nAll this information enables\
    \ the PEAR::SOAP server to generate a WSDL docu-\n\nment that describes the server,\
    \ allowing clients to benefit from the ease of use\n\nthat WSDL affords. It’s\
    \ worth examining the examples provided with\n\nPEAR::SOAP for further help with\
    \ setting up the dispatch map and type defini-\n\ntions. If you run into trouble,\
    \ the best place to get help is the PHP SOAP Mailing\n\nlist\\[54\\].\n\n\\[54\\\
    ] http://www.php.net/mailing-lists.php\n\nChapter 2: XML\n\n160"
