  md: '**Access Control**


    **1**


    One of the side effects of building your site with PHP, as opposed to plain HTML,


    is that you’ll be building dynamic Web applications rather than static Web pages.


    Your site will let you “do” things that weren’t possible with plain HTML. But


    how can you ensure that only you, or those to whom you give permission, are


    able to “do things,” and prevent the Internet’s raging hordes from running riot


    on your site?


    In this chapter, we’ll be looking at the mechanisms you can employ with PHP


    to build authentication systems and control access to the parts of your site you


    regard as private.


    One word of warning before I go any further: any system you build, which involves


    the transfer of data from a Web page over the Internet, will send that information


    in clear text by default.¹ What this means is that if someone is “listening in”
    on


    the network between the client’s Web browser and the Web server, which is


    possible using a tool known as a **packet sniffer**, they will be able to read
    the user


    name and password sent via your form. The chances of this happening are fairly


    small, as typically only trusted organizations like ISPs have the access require
    to


    intercept packets. However, there is still a risk, and it’s one you should take
    ser-


    iously.


    1Web servers that require **Secure Socket Layer** (SSL) connections will safely
    encrypt the data during


    transit. This is the best way to protect sensitive data in today’s Web applications.'
  merge: -1
  pgno: 19
- img_proc: true
  md: "In addition to strategies for building access control systems for your site,\
    \ in this\n\nchapter you’ll find plenty of references to useful information (there\
    \ are more in\n\nAppendix C). I can’t stress enough the importance of a little\
    \ healthy paranoia in\n\nbuilding Web-based applications. The SitePoint Forums\
    \ frequently receive visits\n\nfrom would-be Website developers who got their\
    \ fingers burned when it came to\n\nsite security.\n\nThis chapter requires the\
    \ following MySQL tables, in addition to the user table\n\nfrom Volume I, Chapter\
    \ 9. Note that you’ll find the SQL code to create all of\n\nthese, along with\
    \ sample data, in the code archive in the sql/ directory.\n\nFirst, you’ll need\
    \ a table for storing temporary sign up information:\n\nCREATE TABLE signup (\n\
    \n signup\\_id INT(11) NOT NULL AUTO\\_INCREMENT,\n\n login VARCHAR(50) NOT NULL\
    \ DEFAULT '',\n\n password VARCHAR(50) NOT NULL DEFAULT '',\n\n email VARCHAR(50)\
    \ DEFAULT NULL,\n\n firstName VARCHAR(50) DEFAULT NULL,\n\n lastName VARCHAR(50)\
    \ DEFAULT NULL,\n\n signature TEXT NOT NULL,\n\n confirm\\_code VARCHAR(40) NOT\
    \ NULL DEFAULT '',\n\n created INT(11) NOT NULL DEFAULT '0',\n\n PRIMARY KEY (signup\\\
    _id),\n\n UNIQUE KEY confirm\\_code (confirm\\_code),\n\n UNIQUE KEY user\\_login\
    \ (login),\n\n UNIQUE KEY email (email)\n\n)\n\nYou’ll need a table for storing\
    \ groups²:\n\nCREATE TABLE collection (\n\n collection\\_id INT(11) NOT NULL auto\\\
    _increment,\n\n name VARCHAR(50) NOT NULL default '',\n\n description TEXT NOT\
    \ NULL,\n\n PRIMARY KEY (collection\\_id)\n\n)\n\nNext, there’s a lookup table\
    \ between users and groups:\n\nCREATE TABLE user2collection (\n\n user\\_id INT(11)\
    \ NOT NULL default '0',\n\n collection\\_id INT(11) NOT NULL default '0',\n\n\
    2Note that I’ve called this table collection. The name “group” would cause problems,\
    \ as GROUP\n\nis a keyword in SELECT query syntax.\n\nChapter 1: Access Control\n\
    \n2"
  merge: -1
  pgno: 20
- img_proc: true
  md: " PRIMARY KEY (user\\_id, collection\\_id)\n\n)\n\nDon’t forget this table for\
    \ storing permissions:\n\nCREATE TABLE permission (\n\n permission\\_id INT(11)\
    \ NOT NULL AUTO\\_INCREMENT,\n\n name VARCHAR(50) NOT NULL DEFAULT '',\n\n description\
    \ TEXT NOT NULL,\n\n PRIMARY KEY (permission\\_id)\n\n)\n\nAnd finally, you’ll\
    \ need this lookup table between groups and permissions:\n\nCREATE TABLE collection2permission\
    \ (\n\n collection\\_id INT(11) NOT NULL DEFAULT '0',\n\n permission\\_id INT(11)\
    \ NOT NULL DEFAULT '0',\n\n PRIMARY KEY (collection\\_id, permission\\_id)\n\n\
    )\n\n**How do I use HTTP authentication with**\n\n**PHP?**\n\nHypertext Transfer\
    \ Protocol\\[1\\] (HTTP) defines its own authentication mechan-\n\nisms, namely\
    \ “Basic” and “Digest” authentication, which are defined in RFC\n\n2617\\[2\\\
    ]. If you run PHP on an Apache server, you can take advantage of the\n\n**basic\
    \ authentication** mechanism (digest authentication is on the list of features\n\
    \nyet to be released) using PHP’s header function and a couple of predefined\n\
    \nvariables. A general discussion of these features is provided in the PHP Manual\\\
    [3\\].\n\n**Heads Up**\n\nThe first thing to understand is what actually happens\
    \ when your browser sends\n\na request to a Web server to give it a Web page.\
    \ HTTP is the protocol for com-\n\nmunication between a browser and a Web server.\
    \ When your Web browser sends\n\na request to a Web server, it uses an HTTP request\
    \ to tell the server which page\n\nit wants. The server then replies with an HTTP\
    \ response that describes the type\n\nand characteristics of the document being\
    \ sent, then delivers the document itself.\n\n\\[1\\] ftp://ftp.isi.edu/in-notes/rfc2616.txt\n\
    \n\\[2\\] ftp://ftp.isi.edu/in-notes/rfc2617.txt\n\n\\[3\\] http://www.php.net/features.http-auth\n\
    \n3\n\nHow do I use HTTP authentication with PHP?"
