  md: "The following tag embeds an SVG image in an HTML document:\n\n<object data=\"\
    image.svg\" width=\"100\" height=\"100\"\n\n type=\"image/svg+xml\" />\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_220_0.png)\n\
    \n**SVG and Netscape 4**\n\nSince Netscape 4 doesn't support the object tag, you\
    \ need to use an embed\n\ntag to display SVG in this antiquated browser:\n\n<embed\
    \ src=\"image.svg\" width=\"100\" height=\"100\"\n\n type=\"image/svg+xml\" />\n\
    \nBe aware that embed is not standards-compliant HTML, and should therefore\n\n\
    be avoided if you can spare Netscape 4 support.\n\nWhat makes SVG a potentially\
    \ powerful tool when combined with PHP is its\n\nability to render fully interactive\
    \ images that not only look good but, with some\n\nhelp from JavaScript, are able\
    \ to “do” things such as communicate with a Website\n\nusing simple HTTP GET/POST\
    \ requests, or even take advantage of the Web\n\nservices protocols XML-RPC and\
    \ SOAP. The implementation of such function-\n\nality relies on the viewer and,\
    \ where Web services are concerned, there is still\n\nsome more work to do. Adobe\
    \ is planning to release version 4 of the viewer, while\n\nthe Batik project is\
    \ making steady progress and will likely reach the same point\n\nas Adobe eventually.\
    \ Mozilla is further ahead, providing SOAP and XML-RPC\n\nsupport courtesy of\
    \ the XPCom library (more on that later). Some early adopters\n\nhave had success\
    \ implementing SOAP and XML-RPC clients in JavaScript.\n\nWhere SVG has really\
    \ taken off, though, is in rendering online maps. An example\n\nthat shows the\
    \ potential is the Open SVG Map Server\\[18\\], which provides some\n\nfascinating\
    \ examples of what SVG and PHP can do together. I’ve also heard of\n\na company\
    \ using PHP and SVG to implement a nationwide IP router monitoring\n\ntool, which\
    \ displays network status against an interactive SVG map from a\n\nWebsite. \n\
    \nFor \n\nan \n\ninteractive \n\nmap \n\nof \n\nCanada, \n\ntry\n\nhttp://www.svgmapper.com/example/example3/North\\\
    _America.htm.\n\n**SVG Network Clock**\n\nTo give you a feel for SVG’s potential,\
    \ here’s an SVG digital clock that gets the\n\ntime from a PHP script:\n\n\\[18\\\
    ] http://www.carto.net/projects/open\\_svg\\_mapserver/\n\nChapter 3: Alternative\
    \ Content Types\n\n202"
  merge: -1
  pgno: 220
- img_proc: true
  md: "File: **6.php**\n\n<?php\n\n// Send SVG header\n\nheader('Content-type: image/svg+xml');\n\
    \necho '<?xml version=\"1.0\" encoding=\"ISO-8859-1\" standalone=\"no\"?>';\n\n\
    // Edit this line\n\n$timeUrl =\n\n 'http://localhost/sitepoint/AlternativeContentTypes/7.php';\n\
    \n?>\n\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 20010904//EN\"\n\n \"http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd\"\
    >\n\n<svg width=\"100%\" height=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"\n\
    \n xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n\n onload=\"init(evt);\">\n\n\
    <script type=\"text/ecmascript\">\n\n<!\\[CDATA\\[\n\n var clock;\n\n function\
    \ init(e) {\n\n if (window.svgDocument == null) {\n\n svgDocument = e.target.ownerDocument;\n\
    \n }\n\n clock = svgDocument.getElementById(\"clock\").firstChild;\n\n getTime();\n\
    \n }\n\n function getTime() {\n\n getURL('<?php echo $timeUrl; ?>', showTime);\n\
    \n }\n\n function showTime(response) {\n\n clock.data = response.content;\n\n\
    \ setTimeout('getTime()', 1000);\n\n }\n\n\\]\\]>\n\n</script>\n\n<text id=\"\
    clock\" x=\"80\" y=\"20\" fill=\"navy\" text-anchor=\"middle\">\n\n Time goes\
    \ here\n\n</text>\n\n</svg>\n\nThe SVG example above uses JavaScript (also known\
    \ as ECMAScript) to fetch\n\nthe contents of a URL using the SVG getUrl function.\
    \ The SVG image updates\n\nitself every second, repeating the fetch from the script:\n\
    \n203\n\nSVG Network Clock"
