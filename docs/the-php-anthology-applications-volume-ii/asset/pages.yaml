  md: "**How do I perform XPath queries with**\n\n**PHP?**\n\n**XPath** is a syntax\
    \ for accessing nodes within an XML document that’s not unlike\n\nmost file naming\
    \ systems. From an XPath expression, PHP’s DOM extension\n\ncan perform an **XPath\
    \ query**, a powerful mechanism for accessing elements\n\nwithin an XML document.\
    \ In this solution, I’ll assume you have some knowledge\n\nof XPath; if you don’t,\
    \ see the section called “Further Reading” at the end of this\n\nchapter for more\
    \ information.\n\nLet’s say you have this XML document:\n\nFile: **articles.xml****\
    \ (excerpt)**\n\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"?>\n\n<sitepoint\
    \ xmlns:spt=\"http://www.sitepoint.com/\">\n\n <spt:article>\n\n <spt:article\\\
    _id>1</spt:article\\_id>\n\n <spt:title>Give me back my MySQL Command Line!</spt:title>\n\
    \n <spt:body><p>One of the essential skills you must acquire to\n\n become proficient\
    \ in the development of PHP/MySQL driven\n\n websites is a good understanding\
    \ of Structured Query\n\n Language (SQL). In Chapter 2 of my article series, Build\n\
    \n your own Database Driven Website using\n\n <a href=\"http://www.php.net/\"\
    >PHP</a> and \n\n <a href=\"http://www.mysql.com/\">MySQL</a>, I focus on getting\n\
    \n beginners comfortable with typing SQL queries on the MySQL\n\n command line.</p>\n\
    \n </spt:body>\n\n <spt:author>KevinY</spt:author>\n\n <spt:published>1013554800</spt:published>\n\
    \n <spt:public>1</spt:public>\n\n </spt:article>\n\n <spt:article>\n\n …\n\n </spt:article>\n\
    \n …\n\nThe document is not unlike a database query result set. Using XPath, we\
    \ have a\n\nmeans to get to the data without multiple loops:\n\n123\n\nHow do\
    \ I perform XPath queries with PHP?"
  merge: -1
  pgno: 141
