  md: 'for WAP-enabled devices is to detect them when they visit the site, and deliver


    them a WML document. They don’t have the option of viewing an HTML page


    from which they could choose to view a WML version, as they would with PDF


    versions of the content. It would be nice if HAWHAW provided a convenient


    API so that you could detect the device yourself, but in its present form, it
    handles


    the client detection internally and needs some modification to be used this way.


    **WML, Sessions and Security**


    One aspect of WAP devices of which you need to be aware is that many are not


    able to save cookies locally, as they’re not backed by a spare gigabyte or two
    of


    available disk space. This presents a problem for sessions, as you won’t be able


    to use the cookie mechanism to allow clients to provide their session ID to you.


    The alternative mechanism PHP provides is to add the session ID as a GET


    variable, rewriting every URL in your page to add a variable typically named


    PHPSESSID. This can be invoked by HAW\_deck’s enable\_session method, but


    comes at a price; non-relative URLs will not have the session ID added to them


    for the sake of security.


    In cases where you need it, you can add the session ID yourself, like this:


    <?php


    session\_start();


    ?>


    <a href="http://www.sitepoint.com/?<?php echo SID;


    ?>">SitePoint</a>


    Be careful not to add the session ID to external links; this will broadcast it
    to


    those linked sites, and can potentially lead to session hijacking.


    Overall, as you can see, building a WML-based site is very easy. Yet, you may


    be wondering whether it’s worth it, given the limited number of people who surf


    that way. Let me just give you a tip—developers working in this area get paid


    almost twice what their HTML-based brethren receive. Enough said.


    Chapter 3: Alternative Content Types


    214'
