  md: "PEAR::DB result object and wraps it in the second class, which adapts fetch\
    \ to\n\nfetchRow.\n\nFile: **Database/PEARDBAdapter.php**** (in ****SPLIB****)\
    \ (excerpt)**\n\n// Include PEAR::DB\n\nrequire 'DB.php';\n\n// Adapter for PEAR::DB\
    \ MySQL connections\n\nclass PEARDBAdapter {\n\n // Instance of PEAR::DB\n\n var\
    \ $db;\n\n function PEARDBAdapter($host, $dbUser, $dbPass, $dbName)\n\n {\n\n\
    \ $dsn = \"mysql://$dbUser:$dbPass@$host/$dbName\";\n\n $this->db = &DB::connect($dsn);\n\
    \n }\n\n // Query factory method\n\n function &query($sql)\n\n {\n\n // Call the\
    \ PEAR::DB query() method\n\n $result = &$this->db->query($sql);\n\n // Wrap the\
    \ result in a PEARDBResultAdapter\n\n return new PEARDBResultAdapter($result);\n\
    \n }\n\n}\n\nThe PEARDBAdapter class acts as a wrapper for the main PEAR::DB class,\
    \ most\n\nimportantly, providing a query method that catches the DB\\_Result object\
    \ created\n\nby a query, and placing it inside a PEARDBResultAdapter (see below).\n\
    \nHere’s the PEARDBResultAdapter class:\n\nFile: **Database/PEARDBAdapter.php****\
    \ (in ****SPLIB****) (excerpt)**\n\n// Adapater for PEAR::DB Result\n\nclass PEARDBResultAdapter\
    \ {\n\n // Instance of PEAR::DB Result\n\n var $result;\n\n function PEARDBResultAdapter(&$result)\n\
    \n {\n\n $this->result = &$result;\n\n }\n\nChapter 7: Design Patterns\n\n344"
