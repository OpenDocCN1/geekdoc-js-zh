  md: 'The benefit of generating documentation this way is that it becomes very easy


    to make your code accessible to other developers with a minimum of hassle and


    effort.


    **How do I set up automated tests of my**


    **code?**


    *“If it’s not tested, it’s broken.”*


    —Bruce Eckel, *Thinking in Java*


    Next time you write some PHP code—even just a small app—for your own in-


    terest, keep a note of how much time you spend bug hunting. I don’t mean


    finding parse errors and the like, but actual situations in which the logic of
    your


    code doesn’t perform as you expected it to. My guess is that you’ll probably find


    yourself horrified by the amount of energy you waste troubleshooting. What if


    I told you that, by putting in a little extra effort up-front, you could more
    or less


    completely eliminate the time you waste on bug hunts, and end up with code


    about which you feel a lot more secure? All you need to become is test infected…


    **Unit Testing** is a practical approach to development advocated by the **Extreme**


    **Programming** (XP) methodology\[16\]. Much of Extreme programming addresses


    issues related to project management, but Unit Testing, in particular, has struck


    a nerve among developers in practically every programming language you care to


    name—and is rapidly becoming a required development practice.


    In the crudest terms, Unit Testing involves writing test code that sticks some


    data into your real code, and examines what it gets back to see if the result
    is


    what it’s supposed to be. Before we go any further with the theory, though, let’s


    put Unit Testing in context.


    The general **testing lifecycle** of a good software project could be characterized


    as follows:


    Unit testing


    testing each piece of code


    System or integration


    testing


    testing the code within the type of environment in


    which it will be used


    Acceptance testing


    testing the application from an end user perspective


    \[16\] http://www.extremeprogramming.org/


    Chapter 6: Development Technique


    298'
  merge: -1
