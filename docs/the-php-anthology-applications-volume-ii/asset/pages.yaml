  md: " // Adapts the PEAR::DB Result fetchRow() method\n\n function &fetch()\n\n\
    \ {\n\n // Call the PEAR::DB Result fetchRow() method\n\n if ($row = &$this->result->fetchRow(DB\\\
    _FETCHMODE\\_ASSOC)) {\n\n return $row;\n\n } else {\n\n return FALSE;\n\n }\n\
    \n }\n\n}\n\n?>\n\nThe DB\\_Result fetchRow method is adapted within the fetch\
    \ method to the\n\nAPI we require.\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_363_0.png)\n\
    \n**Compatibility Note**\n\nMy own MySQL class automatically resets the result\
    \ resource, allowing me\n\nto iterate over the result multiple times. PEAR::DB\
    \ doesn’t support this\n\nfunctionality, because some of the databases it supports\
    \ provide no mechan-\n\nism by which developers can perform multiple iterations\
    \ over the same results.\n\nThe code of this example will ignore this subtlety.\n\
    \nFor full compatibility, we could modify fetch so that it re-executed the\n\n\
    query to obtain a fresh result set for each new iteration, or we could cache\n\
    \nthe results in an array.\n\nNow, let me show you how this adapter class works.\
    \ First, here’s a simple example\n\nthat shows what I usually do with my own MySQL\
    \ class:\n\nFile: **10.php**\n\n<?php\n\n// Include MySQL class\n\nrequire\\_once\
    \ 'Database/MySQL.php';\n\n// Instantiate MySQL connection\n\n$db = &new MySQL('localhost',\
    \ 'harryf', 'secret', 'sitepoint');\n\n// Perform query\n\n$sql = \"SELECT title,\
    \ author FROM articles LIMIT 0,5\";\n\n$result = &$db->query($sql);\n\n// Display\
    \ some results\n\nwhile ($row = $result->fetch()) {\n\n345\n\nThe Adapter Pattern"
