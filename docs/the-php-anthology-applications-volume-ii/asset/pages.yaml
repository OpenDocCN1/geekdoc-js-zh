  md: "class ParseHTML {\n\n /\\*\\*\n\n \\* Stores the parser\n\n \\* @var XML\\\
    _HTMLSax instance of PEAR::XML\\_HTMLSax\n\n \\* @access private\n\n \\*/\n\n\
    \ var $parser;\n\n /\\*\\*\n\n \\* ParseHTML Constructor sets up the parser\n\n\
    \ \\* @access public\n\n \\*/\n\n function ParseHTML()\n\n {\n\n $this->parser\
    \ = &new XML\\_HTMLSax();\n\n $this->parser->set\\_object($this);\n\n $this->parser->set\\\
    _element\\_handler('open', 'close');\n\n $this->parser->set\\_data\\_handler('data');\n\
    \n }\n\nIn the constructor for ParseHTML, we set up XML\\_HTMLSax, telling it\
    \ that we’re\n\nusing the current object instance, $this, as the handler object,\
    \ and the methods\n\nopen, close, and data to act as “listeners” for open and\
    \ closing tags and the data\n\nbetween them.\n\nNext, we’ll define the handler\
    \ methods themselves, as well as the method parse,\n\nwhich simply calls the XML\\\
    _HTMLSax method of the same name:\n\nFile: **XML/ParseHTML.php**** (in ****SPLIB****)\
    \ (excerpt)**\n\n /\\*\\*\n\n \\* Opening tag event \"listener\"\n\n \\* @param\
    \ XML\\_HTMLSax the parser\n\n \\* @param string HTML tag name\n\n \\* @param\
    \ array of tag attributes\n\n \\* @return void\n\n \\* @access private\n\n \\\
    */\n\n function open($parser, $tag, $attr)\n\n {\n\n echo '<hr />Opening Tag:\
    \ ' . $tag . '<br />';\n\n if (count($attr) > 0) {\n\n echo '...has attributes:\
    \ <pre>';\n\n print\\_r($attr);\n\n echo '</pre>';\n\n }\n\n }\n\n179\n\nParsing\
    \ HTML with SAX?!?"
