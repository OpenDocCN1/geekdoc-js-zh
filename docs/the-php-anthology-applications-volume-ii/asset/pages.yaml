  md: '**Development Technique**


    **6**


    In this chapter, we take a step out away from solving particular problems, to
    look


    at general techniques that can make you and me better developers. “Better” may


    mean many things: more productive, more relaxed, able to take on more complex


    projects, able to deliver reliable and maintainable code… or able to sleep at
    night.


    Some of what you read here may be obvious to you. Other parts may seem un-


    usual, and others, completely foreign. In the end, what suits you is a matter
    of


    personal taste, but by trying some of the suggestions here you may find that a


    few things grow on you and become part of your development habits.


    **How do I optimize my code?**


    *“Premature optimization is the root of all evil.”*


    —Donald E. Knuth


    When developing applications, the first stage should be to make design your top


    priority; we should sacrifice performance in favor of a well designed application


    architecture, and allow our code to be flexible and maintainable. When it comes


    to putting your application online, though, performance becomes an issue.


    In general, assuming you haven’t made any critical mistakes in your code, per-


    formance is really a hardware issue (i.e. you have the option to throw memory,'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'faster processors etc. at the problem); it may also be solved with Caching
    (see


    Chapter 5).


    That said, it’s important to know the techniques you can use to optimize your


    code without either breaking it or sacrificing the design. Looking for ways to


    optimize code should be a final stage of design.


    Here, we’ll look at some specific examples that are common to PHP applications,


    and suggest alternative approaches to structure the code and help performance.


    I’ll also be introducing you to the **Xdebug extension**\[1\], which, aside from
    being


    a very handy script debugging tool, also allows you to profile your code—a


    powerful technique for finding bottlenecks in your development. Profiling involves


    examining what your code does at runtime from the perspective of the work the


    PHP engine has to perform in order to execute it. With Xdebug you can generate


    a report of how your code performs; perhaps you’ll format it to show the function


    calls that take the most time to execute first, so you can focus on optimizing


    those functions without breaking your overall design.


    The online documentation does a good job of explaining how to install Xdebug;


    it should be easy to set up on all common operating systems where PHP is


    used—Linux, Windows and MacOS. Note that on Windows systems, Xdebug


    often requires that you have the latest stable release of PHP installed; to this,


    Xdebug can be installed as an extension like any other. For example, you could


    simply add the following to your php.ini file:


    extension = xdebug-4.3.2-1.2.0-win32.dll


    Some of the “common optimizations” suggested here have popped up elsewhere


    in this book, in highlighting mistakes, or in presenting specific solutions for


    problems that, while obscure, yield better performance without requiring radical


    alterations to your code.


    \[1\] http://www.xdebug.org/


    Chapter 6: Development Technique


    270'
