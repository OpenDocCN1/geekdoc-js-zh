  md: "$pdfArticle->display();\n\n?>\n\nWith that class ready, next, we need to put\
    \ together a handler class that will use\n\nXML\\_HTMLSax and listen for HTML\
    \ tags. This class will also use the ArticlePDF\n\nclass and, as it encounters\
    \ HTML tags, will use the ArticlePDF API to generate\n\nthe PDF document. The\
    \ handler itself builds up a text buffer of the HTML it\n\nhas parsed, adding\
    \ any R&OS PDF markup for links, bold, and italic tags as it\n\nfinds them. The\
    \ text buffer will then be committed to the document every time\n\nan opening\
    \ p or br tag is encountered. HTML header tags (e.g. h5) will be treated\n\nas\
    \ a special case, as they’re committed to the document immediately.\n\nHere are\
    \ the key parts of this class from the point of view of how we’d use it.\n\nThe\
    \ constructor takes an instance of the ArticlePDF class as its only parameter.\n\
    \nThis allows us to use ArticlePDF to start creating the document (such as adding\n\
    \nthe title page) *outside* of HTMLtoPDF, then pass it to the constructor in preparation\n\
    \nfor writing HTML content to the PDF. The constructor instantiates XML\\_HTMLSax\n\
    \nas we saw before with the ParseHTML class.\n\nFile: **XML/HTMLtoPDF.php****\
    \ (in ****SPLIB****) (excerpt)**\n\n /\\*\\*\n\n \\* HTMLtoPDF Constructor\n\n\
    \ \\* @param ArticlePDF instance of ArticlePDF\n\n \\* @access public\n\n \\*/\n\
    \n function HTMLtoPDF(&$articlePDF)\n\n {\n\n $this->articlePDF = &$articlePDF;\n\
    \n $this->parser = new XML\\_HTMLSax();\n\n $this->parser->set\\_object($this);\n\
    \n $this->parser->set\\_element\\_handler('open', 'close');\n\n $this->parser->set\\\
    _data\\_handler('data');\n\n }\n\nThe two remaining public methods are the parse\
    \ method, which tells the parser\n\nto begin work, and the getPdf method, which\
    \ returns the completed document\n\nafter parsing is finished.\n\nFile: **XML/HTMLtoPDF.php****\
    \ (in ****SPLIB****) (excerpt)**\n\n /\\*\\*\n\n \\* Triggers parsing and converts\
    \ newlines to &lt;br /%gt;\n\n \\* @param string HTML document\n\n \\* @return\
    \ void\n\n \\* @access public\n\n191\n\nPutting it Together"
