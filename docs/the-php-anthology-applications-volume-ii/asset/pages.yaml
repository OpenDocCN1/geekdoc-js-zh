  md: 'URL. This is no use if the script in question uses the MySQLDump application


    to back up your database—a PHP script executed via Apache will typically


    run as a user, which will not have the correct permissions required for the job.


    **PHP-Related Issues**


    K** Can you see the output of ****phpinfo**** on the server you will actually
    be**


    **assigned to?**


    Some hosts may claim this is a security risk, but expert hosts know that secur-


    ity by obscurity is no substitute for *real* security. The information provided


    by phpinfo is *not* a security risk to hosting providers that know what they’re


    doing, and have Linux, Apache, and firewalls correctly set up. What phpinfo


    tells you is the best way to confirm the facts.


    K** Is PHP installed as an Apache module (not the CGI variant)?**


    This provides much better performance.


    K** Is the Apache setting AllowOverride set to Options or All?**


    This will let you modify php.ini settings with .htaccess files.


    K** Is PHP Safe Mode disabled?**


    The safe\_mode option in php.ini is, in theory, a way to make PHP secure,


    and prevent users from performing certain tasks or using certain functions


    that are security-sensitive. Safe Mode is nothing but a large headache if you’re


    doing any serious work in PHP.


    K** Check the upgrade policy of your host.**


    Ask the host how much warning you will get before upgrades are performed.


    Check that they will provide you with a copy of the php.ini file they’ll be


    using for the upgrade (before it happens). The number of hosts that, overnight,


    switch from register\_globals = on to register\_globals = off is consid-


    erable. Make sure you test your applications on your development system


    against the new version before the host performs the upgrade.


    K** Ask for a list of installed PHP extensions.**


    Confirm that these extensions match the requirements of your applications.


    Few hosts, for example, bother to provide the XSLT extension. Confirm also


    365


    PHP-Related Issues'
