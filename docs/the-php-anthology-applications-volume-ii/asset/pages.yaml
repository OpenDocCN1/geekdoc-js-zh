- img_proc: true
  md: "} else {\n\n // Set modified since to 0\n\n $modifiedSince = 0;\n\n}\n\n//\
    \ Compare time the content was last modified with client cache\n\nif ($lastModified\
    \ <= $modifiedSince) {\n\n // Save on some bandwidth!\n\n header('HTTP/1.1 304\
    \ Not Modified');\n\n exit();\n\n}\n\necho 'The GMT is now ' . gmdate('H:i:s')\
    \ . '<br />';\n\necho '<a href=\"' . $\\_SERVER\\['PHP\\_SELF'\\] .\n\n '\">View\
    \ Again</a><br />';\n\n?>\n\nRemember to use the “View Again” link when you run\
    \ this example (clicking\n\nRefresh usually clears your browser’s cache). If you\
    \ click on the link repeatedly,\n\neventually the cache will be updated; your\
    \ browser will throw out its cached\n\nversion and fetch a new page rendered by\
    \ PHP.\n\nIn the above example we used PEAR::Cache\\_Lite to create a cache file\
    \ that is\n\nupdated randomly. We ascertain the file modification time of the\
    \ cache file with\n\nthis line:\n\n$lastModified = filemtime($cache->\\_file);\n\
    \nTechnically speaking, this *is* a hack, as PEAR::Cache\\_Lite intends its $\\\
    _file\n\nmember variable to be private. However, we must use it to get the name\
    \ of the\n\ncache file so that we can fetch its modification time.\n\nNext, we\
    \ send a Last-Modified header using the modification time of the cache\n\nfile.\
    \ We need to send this for *every* page we render, to cause visiting browsers\
    \ to\n\nsend us the If-Modifed-Since header upon every request.\n\n// Issue an\
    \ HTTP last modified header\n\nheader('Last-Modified: ' .\n\n gmdate('D, d M Y\
    \ H:i:s', $lastModified) . ' GMT');\n\nUse of the getallheaders function ensures\
    \ that PHP gives us all the incoming\n\nrequest headers as an array. We then need\
    \ to check that the If-Modified-Since\n\nheader actually exists; if it does, we\
    \ have to deal with a special case caused by\n\nolder Mozilla browsers (below\
    \ version 6), which appended an (illegal) extra field\n\nto their If-Modified-Since\
