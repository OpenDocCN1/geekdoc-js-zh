  md: '**Figure 3.9. XUL Administration**


    ![](img/a381b8313756f8d5eb75f79b6057b90e_237_0.png)


    The left hand side shows the form generated (as HTML) by QuickForm and


    displayed thanks to the XUL browser element. On the right hand side is the list


    of users, built as an XUL listbox. Whenever we click on the name of a user in


    the list, a new page request is made to the form, showing the details for that
    user,


    while the entire user list remains available on the right hand side.


    The advantage of using XUL here is that we need only perform the query that


    fetches the user list once. It then becomes part of the application running on
    my


    own computer, and does not need to be refreshed repeatedly as I perform routine


    administration tasks. Using other XUL elements like tabpanels, I could easily


    load a large part of the administration interface for the site in one go, which


    would allow me to swap between tabs to access each view available for adminis-


    tering the site.


    A user interface that is part XUL and part HTML (via the browser element) is


    a little crude, but it makes a very adequate quick and dirty solution. As the


    “rendering engine” is effectively my Web browser, I can use sessions to secure


    the interface so that a valid user name and password combination is required to


    load it in the first place. The Mozilla team is also working on support for SOAP


    and WSDL, so, if you needed a more rigorous solution you could build an applic-


    ation that, once loaded, was capable of fetching data from a PHP script acting


    as a SOAP server (see Chapter 2 for details).


    219


    How do I render XUL with PHP?'
