  md: 'long articles on a computer monitor, and PDF provides content in a form that’s


    easily printed.


    PHP has two extensions (PDFlib\[1\] and ClibPDF\[2\]) that make it possible to


    render PDF documents, but, unfortunately, both are commercial and require the


    payment of some kind of license fee if you’re using them in a commercial applic-


    ation. This means that many hosts don’t support them and, as a spoilt PHP coder


    who always wants something for nothing, I’m not going to use them, either.


    Instead, I’m going to work with R&OS PDF Class\[3\], a PDF rendering class


    written purely in PHP. R&OS PDF is one of two respected PDF generating lib-


    raries written in pure PHP, the other being FPDF\[4\]. The drawback to using


    either is that it takes a long time to render the PDF and you may find better


    maturity and features in one of the extensions. Yet, both pure PHP libraries are


    still very capable of rendering an attractive “printable version” of your content,


    and with a little cunning, such as caching the rendered PDF file, the performance


    impact can be negated.


    **PDF To Go…**


    The R&OS PDF library is a truly outstanding piece of open source code. It’s a


    true credit to the author, Wayne Munro, that he’s been so generous as to allow


    others to use it for free. The version used here is 0.9 and, although it’s not
    yet a


    full release, it’s very stable and really only lacks a few “nice to have” features
    such


    as PDF bookmarks. Otherwise, it provides a powerful and fairly friendly interface


    for creating PDF documents, including the ability to add images, links, shapes,


    and much more, not to mention encryption, which requires the reader to provide


    a password in order to view the document. R&OS PDF has everything you need


    to render PDF “on the fly” with PHP.


    The documentation provided with the library is very thorough (and in PDF


    format, naturally). Here, we’ll concentrate on an example that’s specifically
    geared


    to rendering examples; the comments on R&OS PDF’s classes will be minimal


    (you could write a lot about this class), but detailed enough to get you started


    and referring to the documentation for further help.


    Be warned that building a PDF document with this class takes some patience, as


    you’ll need to position some parts of the page (usually, the content you want


    \[1\] http://www.php.net/pdf


    \[2\] http://www.php.net/cpdf


    \[3\] http://www.ros.co.nz/pdf/


    \[4\] http://www.fpdf.org/


    Chapter 3: Alternative Content Types


    170'
