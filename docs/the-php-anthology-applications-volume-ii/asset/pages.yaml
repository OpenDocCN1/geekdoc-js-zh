  md: " $this->colors = array('red', 'green', 'blue');\n\n }\n\n // This method iterates\
    \ over the colors array\n\n function fetch()\n\n {\n\n // Use the each() function\
    \ to get the current value and step\n\n // forward\n\n $color = each($this->colors);\n\
    \n // If $color wasn't false...\n\n if ($color) {\n\n // return the value\n\n\
    \ return $color\\['value'\\];\n\n // $color is false (reached the end of the array)...\n\
    \n } else {\n\n // Reset the colors array\n\n reset($this->colors);\n\n // Return\
    \ false\n\n return FALSE;\n\n }\n\n }\n\n}\n\nNow, although the class doesn’t\
    \ do anything useful, as we’ll see momentarily,\n\nthe fetch method makes it possible\
    \ to iterate over the contents of the $colors\n\narray in a very similar manner\
    \ to a foreach loop.\n\nLet’s take a closer look at the fetch method. The first\
    \ thing we do is use PHP’s\n\neach function to pull the current element from the\
    \ $colors array. The each\n\nfunction automatically moves an array pointer forward\
    \ after it’s returned the\n\ncurrent value, which makes it a very handy function\
    \ for iterating over arrays. The\n\nvalue returned from each is a little unusual,\
    \ though; it’s both an associative array\n\nwith the keys 'key' and 'value', and\
    \ an indexed array in which element 0 is\n\nthe key name and element 1 is the\
    \ value. Here’s what each returns for the first\n\nelement of the $colors array:\n\
    \nArray\n\n(\n\n \\[0\\] => 0\n\n \\[1\\] => red\n\n \\[key\\] => 0\n\n \\[value\\\
    ] => red\n\n)\n\n325\n\nThe Iterator Pattern"
