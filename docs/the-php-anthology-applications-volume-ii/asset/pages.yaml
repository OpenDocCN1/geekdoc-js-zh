    \n(see Volume I, Chapter 10). The third check ensures that the user name and\n\
    \npassword combination in the $users array matches the details sent by the Web\n\
    \nbrowser.\n\nNote that we could also have checked the user name and password\
    \ against a table\n\nin a database—something we’ll look at in “How do I authenticate\
    \ users with\n\nsessions?”.\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_25_0.png)\n\
    \n**When to Send Headers**\n\nIn PHP, the moment your script outputs anything\
    \ that’s meant for display,\n\nthe Web server finishes sending the headers and\
    \ begins to send the content\n\nitself. You cannot send further HTTP headers once\
    \ the body of the HTTP\n\nmessage—the Web page itself—has begun to be sent. This\
    \ means that if you\n\nuse the header function or session\\_start after the body\
    \ has begun, you’ll\n\nget an error message like this:\n\nWarning: Cannot add\
    \ header information - headers already\n\nsent by (output started at…\n\n7\n\n\
    Not by the Hairs of my Chin…"
