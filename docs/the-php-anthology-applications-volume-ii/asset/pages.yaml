    \nThis is a sample article\n\n</textarea><br />\n\n<input type=\"submit\" name=\"\
    publish\" value=\"Publish Article\"><br />\n\n<input type=\"submit\" name=\"delete\"\
    \ value=\"Delete Article\"><br />\n\n</form>\n\n<?php\n\n}\n\n?>\n\nIf we click\
    \ the Publish button, our code executes the Article class’s publish\n\nmethod;\
    \ behind the scenes, the observers respond to the event, displaying:\n\nPublishing\
    \ article.\n\nRefreshing cache\n\nNotifying subscribers by email\n\nUpdating the\
    \ RSS Feed\n\nThe observer pattern is a powerful but easy-to-use mechanism for\
    \ executing\n\nmultiple routines without specifically calling them in our code.\
    \ We can add or\n\nremove observers easily, without making serious modifications\
    \ to the main logic\n\nof the application. More importantly, it’s easy to reuse\
    \ the observers on other\n\nobservables, and add their capabilities to other parts\
    \ of our site, such as a forum.\n\nChapter 7: Design Patterns\n\n352"
