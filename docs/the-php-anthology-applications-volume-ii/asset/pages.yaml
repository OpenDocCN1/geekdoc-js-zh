  md: "File: **3.php**** (excerpt)**\n\n<?php\n\n/\\*\\*\n\n \\* Writes a cache file\n\
    \n \\* @param string contents of the buffer\n\n \\* @param string filename to\
    \ use when creating cache file\n\n \\* @return void\n\n \\*/\n\nfunction writeCache($content,\
    \ $filename)\n\n{\n\n $fp = fopen('./cache/' . $filename, 'w');\n\n fwrite($fp,\
    \ $content);\n\n fclose($fp);\n\n}\n\n/\\*\\*\n\n \\* Checks for cache files\n\
    \n \\* @param string filename of cache file to check for\n\n \\* @param int maximum\
    \ age of the file in seconds\n\n \\* @return mixed either the contents of the\
    \ cache or false\n\n \\*/\n\nfunction readCache($filename, $expiry)\n\n{\n\n if\
    \ (file\\_exists('./cache/' . $filename)) {\n\n if ((time() - $expiry) > filemtime('./cache/'\
    \ . $filename)) {\n\n return FALSE;\n\n }\n\n $cache = file('./cache/' . $filename);\n\
    \n return implode('', $cache);\n\n }\n\n return FALSE;\n\n}\n\nThe first two functions\
    \ we’ve defined, writeCache and readCache, are used to\n\ncreate cache files and\
    \ check for their existence, respectively. The writeCache\n\nfunction takes rendered\
    \ output as its first argument, as well as a filename that\n\nshould be used when\
    \ creating the cache file. The readCache function takes a fi-\n\nlename of a cache\
    \ file as its first argument, along with the time in seconds after\n\nwhich the\
    \ cache file should be regarded as having expired. If it finds a valid cache\n\
    \nfile, the script will return it; otherwise it returns FALSE to instruct the\
    \ calling file\n\nthat either no cache file exists, or it’s out of date.\n\nFor\
    \ the purposes of this example, I used a procedural approach. However, I\n\nwouldn’t\
    \ recommend doing this in practice, as it will result in very messy code\n\n(see\
    \ later solutions for better alternatives) and is likely to cause issues with\
    \ file\n\n249\n\nChunked Buffering"
