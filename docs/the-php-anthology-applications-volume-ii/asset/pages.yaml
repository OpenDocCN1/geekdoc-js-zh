  md: 'K Each layer *must* be able to exist on a physically independent system and
    be


    able to communicate over a network. Having said that, the layers do not *have*


    to be separate systems—they need only be designed in such a way that this


    is *possible*. Communication between layers on separate systems must be able


    to be handled over a network, with the help of some intermediate technology


    like SOAP or XML-RPC. In other words, this principle is something of a


    thought experiment for developers: “Is this layer distributable?” By applying


    this principle, the architecture as a whole becomes scalable, for example, al-


    lowing it to be expanded with load balancing technologies as site traffic in-


    creases.


    K Each layer should exchange information only with the layers above and below


    it. For example, the presentation logic tier may not exchange information


    directly with the data access tier, but must communicate only with the business


    tier; this will act as the interface to the data access tier.


    K Each layer should be replaceable with other equivalent technologies. At the


    presentation layer, this means that Mozilla or Opera should function just as


    well as Internet Explorer when viewing a site. For the presentation logic layer,


    it should be possible to render alternative content types to HTML, such as


    WML (wireless mark up language) or SOAP. Down at the data tier, this might


    mean being able to replace MySQL with PostgreSQL. Two further principles


    stem from this one:


    K Each layer should have a clearly defined interface, or API.


    K Layers should expect nothing of other layers, except that they conform to


    the defined APIs.


    **But What’s the point?**


    The concepts behind N-Tier deliver three key benefits.


    First, by designing in accordance with the N-Tier principles, an application has


    a better chance of coping with future traffic and performance demands, as it’s


    able to scale well within each tier. For example, as traffic increases, you may
    need


    to run multiple MySQL servers with data replication, or use multiple load balanced


    Web servers to serve content. When doing this, the preservation of PHP sessions,


    for example, becomes a problem, but with a reasonable N-Tier design it should


    be possible to adapt the application to the new requirements without any signi-


    ficant code rewriting. Perhaps you simply modify your session handling logic so


    279


    But What’s the point?'
