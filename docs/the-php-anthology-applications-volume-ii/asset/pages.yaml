    \ realm=\"PHP Secured\"');\n\n exit('Unauthorized!');\n\n}\n\n// Is the password\
    \ doesn't match the username, exit\n\nif ($users\\[$\\_SERVER\\['PHP\\_AUTH\\\
    _USER'\\]\\] != $\\_SERVER\\['PHP\\_AUTH\\_PW'\\])\n\n{\n\n header('HTTP/1.1 401\
