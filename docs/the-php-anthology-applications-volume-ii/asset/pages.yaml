  md: "XPath can be an extremely powerful tool. For example, XPath makes it possible\n\
    \nto base a dynamic, hierarchical menu system (such as that as covered in Volume\n\
    \nI, Chapter 9) on an XML configuration file, rather than a database table.\n\n\
    **How do I transform XML with PHP?**\n\nAnother offshoot of the XML specification\
    \ is **Extensible Stylesheet Language**\n\n**Transformations**\\[37\\] (XSLT),\
    \ a standard that lets you transform XML docu-\n\nments. “…Into what?” you ask.\
    \ Well, transforming one XML document type into\n\nanother—such as XHTML—is the\
    \ most common application, but with XSLT\n\nyou can output just about any text-based\
    \ file format you can think of.\n\nXSLT can be useful for solving all sorts of\
    \ problems. You can generate PHP code\n\non the fly from an XML configuration\
    \ file. You can generate documents in differ-\n\nent formations—HTML and Wireless\
    \ Markup Language (WML), for in-\n\nstance—from a single XML source. The possibilities\
    \ are endless!\n\nIn this solution, I’ll assume that you have some experience\
    \ with XSLT, so I’ll\n\nconcentrate on the PHP code. If your knowledge of XSLT\
    \ is lacking, the section\n\ncalled “Further Reading” has reference suggestions.\n\
    \nUsing the XSLT extension\\[38\\] is similar in some ways to using PHP’s SAX\
    \ XML\n\nfunctionality. Let’s look at an example based on the articles.xml document\n\
    \nwe saw in the last solution. First, we have an XSL document:\n\nFile: **articles.xsl****\
    \ (excerpt)**\n\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"?>\n\n<xsl:stylesheet\
    \ version=\"1.0\" \n\n xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\n\n\
    \ xmlns:spt=\"http://www.sitepoint.com/\"\n\n**exclude-result-prefixes=\"spt\"\
    **\\>\n\nIn declaring the root element of the stylesheet, we’ve specified the\
    \ SitePoint\n\nnamespace used in articles.xml, and used the exclude-result-prefixes\
    \ at-\n\ntribute to specify that the namespace prefix should not be added to the\
    \ trans-\n\nformed elements.\n\nNext, we use a template to match each article\
    \ element that has a public element\n\ncontaining the value 1, and display it.\
    \ The articles are placed into HTML table\n\n\\[37\\] http://www.w3.org/TR/xslt\n\
    \n\\[38\\] http://www.php.net/xslt\n\n135\n\nHow do I transform XML with PHP?"
