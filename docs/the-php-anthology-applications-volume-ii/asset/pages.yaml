  md: "**Getting Started**\n\nI hope that introduction hasn’t made you so paranoid\
    \ about using sessions that\n\nyou’ll never touch them. In general, sessions offer\
    \ a mechanism that is both simple\n\nto use and powerful—it’s an essential tool\
    \ for building online applications.\n\nThe first development trick you need to\
    \ know is that you should always access\n\nsession variables using their predefined\
    \ global variable $\\_SESSION, not the func-\n\ntions session\\_register and session\\\
    _unregister. These functions fail to work\n\ncorrectly when PHP’s register\\_globals\
    \ setting has been disabled, which is the\n\nway you should be programming with\
    \ PHP (see Appendix A for details).\n\nTo start off slowly, here’s a simple example\
    \ of how sessions can be used:\n\nFile: **3.php**\n\n<?php\n\nsession\\_start();\n\
    \n// If session variable doesn't exist, register it\n\nif (!isset($\\_SESSION\\\
    ['test'\\])) {\n\n $\\_SESSION\\['test'\\] = 'Hello World!';\n\n echo '$\\_SESSION\\\
    [\\\\'test\\\\'\\] is registered.<br />' .\n\n 'Please refresh page';\n\n} else\
    \ {\n\n // It's registered so display it\n\n echo '$\\_SESSION\\[\\\\'test\\\\\
    '\\] = ' . $\\_SESSION\\['test'\\];\n\n}\n\n?>\n\nThe first order of business\
    \ in a script that uses sessions is to call session\\_start\n\nto load any existing\
    \ session variables.\n\nThis script registers the session variable the first time\
    \ the page is displayed. The\n\nnext time (and all times thereafter, until the\
    \ session times out through inactivity),\n\nthe script will display the value\
    \ of the session variable.\n\nThat’s a simple example of how sessions can be used.\
    \ We’ll use them to store the\n\nvalue of a user name and password shortly, but\
    \ first, we need to put together\n\nsome classes that will collaborate to deal\
    \ with both sessions and authentication.\n\nDon’t panic! The classes themselves\
    \ may get fairly complex, but using them from\n\nan external script will be easy.\n\
    \n11\n\nGetting Started"
