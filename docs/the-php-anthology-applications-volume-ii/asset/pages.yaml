  md: "Here’s a simple example of a PHP script that renders an SVG image (you’ll need\n\
    \na viewer to see it):\n\nFile: **5.php**\n\n<?php\n\nheader('Content-type: image/svg+xml');\n\
    \necho '<?xml version=\"1.0\" encoding=\"ISO-8859-1\" standalone=\"no\"?>';\n\n\
    ?>\n\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 20010904//EN\"\n\n \"http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd\"\
    >\n\n<svg xmlns=\"http://www.w3.org/2000/svg\"\n\n xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
    >\n\n <circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"navy\"/>\n\n</svg>\n\nFirst,\
    \ we send the SVG Content-type header to tell the client browser what it’s\n\n\
    dealing with, then we simply display the SVG document as plain text.\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_219_0.png)\n\
    \n**XML Processing Instructions and PHP**\n\nThe XML specification recommends\
    \ that all XML documents should begin\n\nwith a <?xml ?> processing instruction\
    \ that identifies the version of XML\n\nin use and a number of options, like the\
    \ character set. In the case of XHTML\n\ndocuments, it is currently prudent to\
    \ leave out this optional element, because\n\nit interferes with Internet Explorer\
    \ 6 for Windows’ ability to identify the\n\ndocument type.\n\nIn other documents,\
    \ like the SVG document above, this element should be\n\nincluded, however. Unfortunately,\
    \ the default configuration will cause the\n\nPHP engine to attempt to process\
    \ XML processing instructions as if they\n\ncontain PHP code, producing nasty\
    \ error messages.\n\nTo get around this, you need to write the processing instruction\
    \ with a PHP\n\necho statement, as demonstrated in the example above.\n\nViewing\
    \ this page displays a circle in navy blue with a radius of forty pixels, which\n\
    \nis centered at x = 50, y =50 from the top left of the image, as shown in Figure\
    \ 3.5.\n\n**Figure 3.5. Join the Dots**\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_219_1.png)\n\
    \n201\n\nHow do I render SVG with PHP?"
  merge: -1
  pgno: 219
