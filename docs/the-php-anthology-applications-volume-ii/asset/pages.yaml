  md: "File: **AccessControl/AccountMaintenance.php**** (in ****SPLIB****) (excerpt)**\n\
    \n /\\*\\*\n\n \\* Add a list of words to generate passwords with\n\n \\* @param\
    \ array\n\n \\* @return void\n\n \\* @access public\n\n \\*/\n\n function addWords($words)\n\
    \n {\n\n $this->words = $words;\n\n }\n\n /\\*\\*\n\n \\* Generates a random but\
    \ memorable password\n\n \\* @return string the password\n\n \\* @access private\n\
    \n \\*/\n\n function generatePassword()\n\n {\n\n srand((double)microtime() \\\
    * 1000000);\n\n $seperators = range(0,9);\n\n $seperators\\[\\] = '\\_';\n\n $count\
    \ = count($this->words);\n\n if ($count == 0) {\n\n return FALSE;\n\n }\n\n $password\
    \ = array();\n\n for ($i = 0; $i < 4; $i++) {\n\n if ($i % 2 == 0) {\n\n shuffle($this->words);\n\
    \n $password\\[$i\\] = trim($this->words\\[0\\]);\n\n } else {\n\n shuffle($seperators);\n\
    \n $password\\[$i\\] = $seperators\\[0\\];\n\n }\n\n }\n\n shuffle($password);\n\
    \n return implode('', $password);\n\n }\n\nFirst, we add to the form a new field\
    \ for the user to enter their login name:\n\nFile: **10.php**** (excerpt)**\n\n\
    // Add a field for the login\n\n$form->addElement('text', 'login', 'Enter your\
    \ login name');\n\n53\n\nNew Password"
