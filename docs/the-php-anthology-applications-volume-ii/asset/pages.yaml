  md: "Most work editing SVG documents is likely to be done with tools like Adobe’s\n\
    \nIllustrator or GoLive, but as SVG is, in the end, just text, there’s no reason\
    \ why\n\nyou shouldn’t render a complete SVG using PHP. A solid basis for getting\
    \ started\n\nis Charlie Killian’s SVG classes\\[20\\], which were described in\
    \ some detail in Wrox’s\n\n*Professional PHP 4 XML*. The book has a full chapter\
    \ on SVG, so if you’re inter-\n\nested, grab a copy while they can still be found.\n\
    \n**How do I render WML with PHP?**\n\n**Wireless Markup Language** (WML) is an\
    \ XML format designed to allow hand\n\nheld devices to access content on the Web\
    \ using **Wireless Application Protocol**\n\n(WAP). As the first generations of\
    \ WAP enabled devices use LCD displays and\n\nare usually grayscale, developing\
    \ WML based sites may not seem too exciting,\n\nbut the potential for teams of\
    \ people on the go to work together via a WML-\n\nbased site makes it an interesting\
    \ technology.\n\nThe first problem to overcome when trying to develop WML-based\
    \ sites is finding\n\na browser that displays WML. Obviously, your mobile network\
    \ provider would\n\nlove you to do the testing with your own phone, but that’s\
    \ a fast track to a large\n\nbill. Thankfully, Opera (ideally version 7+) comes\
    \ ripe with WML support and\n\nis perfect for designing a WML-based site. Not\
    \ too far behind is Mozilla with a\n\nWML browser\\[21\\] that’s currently a work\
    \ in progress, but should be fairly handy\n\nin the not too distant future, thanks\
    \ to the ease of developing XUL applications\n\n(see the next solution).\n\nWith\
    \ that problem solved, it’s time to build a WML page with a little help from\n\
    \nPHP:\n\nFile: **9.php**\n\n<?php\n\nheader('Content-type: text/vnd.wap.wml');\n\
    \necho '<?xml version=\"1.0\"?>';\n\n?>\n\n<!DOCTYPE wml PUBLIC \"-//WAPFORUM//DTD\
    \ WML 1.1//EN\"\n\n \"http://www.wapforum.org/DTD/wml\\_1.1.xml\">\n\n<wml>\n\n\
    <card id=\"index\" title=\"PHP and WAP in Action\" newcontext=\"true\">\n\n <big>Menu:</big><br\
    \ />\n\n <a href=\"#news\">News</a><br/>\n\n <a href=\"#products\">Products</a><br/>\n\
    \n\\[20\\] http://www.phpclasses.org/browse.html/package/457.html\n\n\\[21\\]\
    \ http://wmlbrowser.mozdev.org/\n\n205\n\nHow do I render WML with PHP?"
  merge: -1
  pgno: 223
- img_proc: true
  md: "</card>\n\n<card id=\"news\" title=\"News\">\n\n <p align=\"right\"><small><a\
    \ href=\"#index\">Back</a></small></p>\n\n <big>News:</big><br />\n\n <a href=\"\
    #news1\">Something happened</a><br />\n\n <a href=\"#news2\">Something else happened</a><br\
    \ />\n\n</card>\n\n<card id=\"news1\" title=\"Something happened\">\n\n <p align=\"\
    right\"><small><a href=\"#index\">Back</a></small></p>\n\n Yep something happened.\n\
    \n</card>\n\n<card id=\"news2\" title=\"Something else happened\">\n\n <p align=\"\
    right\"><small><a href=\"#index\">Back</a></small></p>\n\n Oh and something else\
    \ happened\n\n</card>\n\n<card id=\"products\" title=\"For Sale\">\n\n <p align=\"\
    right\"><small><a href=\"#index\">Back</a></small></p>\n\n Here are some things\
    \ to buy...\n\n</card>\n\n</wml>\n\nWML is designed to limit the number of requests\
    \ a browser has to make, which\n\nreflects the fact that mobile networks are not\
    \ high speed, and makes using WML-\n\nbased sites friendly on the thumb. Hence,\
    \ a WML document is made up of **cards**,\n\nwhich are separate pages loaded at\
    \ the same time. The above examples should\n\ngive you a feel for the markup,\
    \ which is very similar to HTML for the most part,\n\nthough be warned—WML must\
    \ conform to the rules of well formed XML (e.g.\n\ntags must be closed).\n\n“Internal”\
    \ links can be made between cards using #id\\_name, which points at the\n\nid\
    \ attribute of another card. Links to other WML documents are handled in the\n\
    \nsame way as an HTML link, and there’s even support for forms. An online refer-\n\
    \nence is suggested at the end of this chapter.\n\nFigure 3.7 shows what the front\
    \ page of our simple example looks like in Opera.\n\nChapter 3: Alternative Content\
    \ Types\n\n206"
