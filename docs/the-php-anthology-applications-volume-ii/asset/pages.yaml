  md: '**HAWHAW**


    Now that we understand the basics, it’s time to meet HAWHAW\[22\] (the HTML


    and WML hybrid adapted Webserver), a PHP class library that makes serving


    WML pages easy. Using HAWHAW to construct WML pages is much like using


    the DOM extension to create XML, as we saw in Chapter 2. In the HAWHAW


    document model, the parent of all elements is the HAW\_deck class, to which other


    elements are added, as described in the online documentation\[23\].


    HAWHAW doesn’t make use of multiple cards, but instead places all elements


    within a single card. This is to some extent a shortcoming, but helps HAWHAW


    provide support for older wireless formats, including HDML, as well as other


    formats such as MML, which is used by some Japanese devices.


    The code for this chapter includes the HAWHAW library.²


    At the start of this chapter, we looked at rendering PDF files from the articles


    table. Here’s how we could render WML from the same data:


    File: **10.php**** (excerpt)**


    <?php


    // Switch off error notices - required for HAWHAW


    error\_reporting(E\_ALL ^ E\_NOTICE);


    // Include MySQL, Articles and Article class


    require\_once ''Database/MySQL.php'';


    require\_once ''ExampleApps/Articles.php'';


    // Include the HAWHAW library


    require\_once ''ThirdParty/hawhaw/hawhaw.php'';


    // Define variables for MySQL class


    $host = ''localhost''; // Hostname of MySQL server


    $dbUser = ''harryf''; // Username for MySQL


    $dbPass = ''secret''; // Password for user


    $dbName = ''sitepoint''; // Database name


    // (Modify this) Specify the root URL of the site


    \[22\] http://www.hawhaw.de/


    \[23\] http://www.hawhaw.de/ref/php/


    2I’ve renamed the file from hawhaw.inc to hawhaw.php. Files that Apache doesn’t
    recognize as


    being PHP have a nasty habit of being open to public viewing.


    Chapter 3: Alternative Content Types


    208'
