  md: " PRIMARY KEY (user\\_id, collection\\_id)\n\n)\n\nNotice that the primary key\
    \ for the table uses both columns. In doing so, it makes\n\nsure that no combination\
    \ of user\\_id and collection\\_id can appear more than\n\nonce.\n\nNote that\
    \ I use “collection” to refer to “group” in MySQL; the use of “group”\n\nwould\
    \ confuse the current versions of the mysqldump utility, which, as you know\n\n\
    from Volume I, Chapter 3, is a helpful tool for backing up a database.\n\nTable\
    \ 1.1 presents sample data from the user2group table:\n\n**Table 1.1. Sample data\
    \ from ****user2collection**\n\n**collection\\_id**\n\n**user\\_id**\n\n2\n\n\
    1\n\n1\n\n2\n\n2\n\n2\n\n2\n\n3\n\n2\n\n4\n\nThis tells us that User 1 is a member\
    \ of Group 2, User 2 is a member of Groups\n\n1 and 2, User 3 is a member of Group\
    \ 2, etc.\n\nWith the lookup tables defined (the other being called collection2permission),\n\
    \nwe can now perform queries across the tables to identify the permissions a partic-\n\
    \nular user has been allowed. For example, the following query returns all the\
    \ per-\n\nmissions for the user with user\\_id 1.\n\nSELECT\n\n p.name as permission\n\
    \nFROM\n\n user2collection uc, collection2permission cp, permission p\n\nWHERE\n\
    \n uc.user\\_id = '1' AND\n\n uc.collection\\_id = cp.collection\\_id AND\n\n\
    \ cp.permission\\_id = p.permission\\_id\n\nNote that I’ve used aliases for table\
    \ names, such as user2collection ug, to\n\nmake writing the query easier.\n\n\
