  md: 'Now, you may be fairly underwhelmed by the tests we’ve completed here. Why


    bother testing simple variable assignments like this? The Stamp class is very
    basic,


    after all. While that’s true at the moment, this test script defines how we expect


    the Stamp API to behave, and by having the test written for it, we’ve essentially


    set the API “in concrete.” This is important because other code will depend on


    the Stamp class to perform in a particular way. At some point in the future, we


    could decide to make a few minor modifications to the Stamp constructor which,


    for instance, change the type of the price from an integer to a string; although,


    technically, this won’t *break* the Stamp class, it will change the API (remember


    the tags in the method comments that describe the types), which may cause


    other code using the class to break. Simple Unit Tests like these will catch these


    kinds of mistakes.


    In short, the idea is to *write the simplest set of tests that will ensure that
    the behavior*


    *of the class will exactly match its API documentation*.


    To execute the tests, we finish the script by instantiating the test class, and
    then,


    using an HtmlReporter object (provided by SimpleTest), which displays the test


    results in HTML format, we call the run method to execute the tests.


