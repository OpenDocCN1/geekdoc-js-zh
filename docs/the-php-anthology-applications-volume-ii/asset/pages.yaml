    \n/\\*\\*\n\n \\* Validates a password\n\n \\*/\n\nclass ValidatePassword extends\
    \ Validator {\n\n /\\*\\*\n\n \\* Validates a password\n\n \\* @access private\n\
    \n \\* @return void\n\n \\*/\n\n function validate($passwords)\n\n {\n\n $pass\
    \ = $passwords\\[0\\];\n\n $conf = $passwords\\[1\\];\n\n if ($pass != $conf)\
    \ {\n\n $this->setError('Passwords do not match');\n\n }\n\n if (!preg\\_match('/^\\\
    [a-zA-Z0-9\\_\\]+$/', $pass)) {\n\n $this->setError('Password contains invalid\
