    and you’ll come to realize that all that really matters is letting users know
    what


    goes in, what comes out, and a general idea of how to use the class.


    The writing of API documentation may lead you to one other healthy practice.


    It will encourage you to begin by writing a “blank” class that just defines the


    method and member variable names and documents what they do without filling


    in any code. This makes a useful hands-on design stage that forces you to consider


    your class “from the outside”, that is, from the perspective of the code that
    will


    use it.


    All in all, if you’re writing PHP code that’s intended for consumption by others,


    publishing API documentation is one of those essential steps without which your


    project will be incomplete.


    **Choose your Weapons**


    The first problem is which documentation generation tool to choose. This is im-


    portant, so it’s worth investigating the options to work out which you prefer.


    The documentation syntax used by each tool varies; writing documentation for


    one will, at best, be only partially compatible with another. Of the *actively*
    de-


    veloped alternatives, you have:


    **Doxygen: http://www.doxygen.org/**


    Doxygen is a documentation generation tool for multiple languages, including


    PHP. It’s popular in the Linux community and is used by eZ systems to


    generate the documentation for the eZ publish framework\[12\]. If you program


    with C/C++, Java, or C#, as well as PHP, Doxygen is a great “one size fits


    all” solution, though the learning curve required to grasp it is probably slightly


    steeper than the alternatives.


    **PHP Edit: http://www.phpedit.net/**


    PHP Edit is a Windows IDE for writing PHP code, which comes with a


    documentation generation tool. If Windows is your chosen home, PHP Edit


    is on its way to becoming a very mature PHP development tool, even


    providing support for the generation of XMI (an XML format for UML dia-


    grams).


    \[12\] http://ez.no/developer


    Chapter 6: Development Technique


