- img_proc: true
  md: '// Get the contents of


    $buffer = ob\_get\_contents();


    // Stop buffering and clean out the buffer


    ob\_end\_clean();


    // Echo some text normally


    echo ''2. A normal echo<br />'';


    // Echo the contents from the buffer


    echo $buffer;


    ?>


    The buffer itself stores the output as a string. So, in the above script, we commence


    buffering with ob\_start and use echo to display something. We then use


    ob\_get\_contents to fetch the data the echo statement placed in the buffer, and


    store it in a string. The ob\_end\_clean function stops the output buffer and
    trashes


    the contents; the alternative is ob\_end\_flush, which displays the contents of
    the


    buffer.


    The above script displays:


    2\. A normal echo


    1\. Place this in the buffer


    In other words, we captured the output of the first echo, then sent it to the


    browser after the second echo. As this simple example suggests, output buffering


    can be a very powerful tool when it comes to building your site; it provides a


    solution for caching, as we’ll see in a moment, and is an excellent way to hide


    errors from your site’s visitors (see Volume I, Chapter 10). It even provides
    a


    possible alternative to browser redirection in situations such as user authentication.


    ![](img/a381b8313756f8d5eb75f79b6057b90e_264_0.png)


    **HTTP Headers and Output Buffering**


    Output buffering can help solve the most common problem associated with


    the header function, not to mention session\_start and set\_cookie.


    Normally, if you call any of these functions after page output has begun,


    you’ll get a nasty error message. With output buffering turned on, the only


    output types that can escape the buffer *are* HTTP headers. Using ob\_start


    at the very beginning of your application’s execution, you can send headers


    at whichever point you like, without encountering the usual errors. You can


    then write out the buffered page content all at once, when you’re sure there


    are no more HTTP headers required.


    Chapter 5: Caching


    246'
