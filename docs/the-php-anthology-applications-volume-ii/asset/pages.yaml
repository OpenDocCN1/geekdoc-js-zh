  md: "users to change their email address, you’ll need to examine the registration\
    \ pro-\n\ncedure used earlier in this chapter, and modify the SignUp class. You\
    \ should make\n\nsure that users confirm a new email address before you allow\
    \ them to change it.\n\n**How do I build a permissions system?**\n\nSo far, you’ve\
    \ already got an authentication system, which provides a global se-\n\ncurity\
    \ system for your site. But are all your site’s members equal? You probably\n\n\
    don’t want all of your users to have access to edit and delete articles, for example.\n\
    \nTo deal with this, you need to add to the security system further complexity\
    \ that\n\nallows you to assign “permissions” to limited groups of members, permitting\
    \ only\n\nthese users to perform particular actions.\n\nRather than assigning\
    \ specific permissions to particular accounts, which would\n\nquickly become a\
    \ nightmare to administer, the way we’ll build a permissions\n\nsystem is to think\
    \ in terms of **Users**, **Groups** and **Permissions**. Users (login ac-\n\n\
    counts) will be assigned to Groups, which will have names like “Administrators,”\n\
    \n“Authors,” “Managers,” and so on. Permissions reflect actions that users will\
    \ be\n\nallowed to perform within the site, and they will also be assigned to\
    \ Groups.\n\nFrom an administration perspective, managing all this will be easy,\
    \ as it will be\n\na simple matter to see which Permissions a particular Group\
    \ has, and which users\n\nare assigned to that Group.\n\nTo build the relationships\
    \ I’ve described requires the construction of many-to-\n\nmany relationships between\
    \ tables. This is explained as follows:\n\nK A User can belong to many Groups.\n\
    \nK A Group may have many Users.\n\nK A Permission can be assigned to many Groups.\n\
    \nK A Group may have many Permissions.\n\nIn practical terms, the way to build\
    \ many-to-many relationships in MySQL is to\n\nuse a **lookup table**, which relates\
    \ to two other tables. The lookup table stores a\n\ntwo column index, each column\
    \ being the key of one of the two related tables.\n\nFor example, here’s the definition\
    \ of the user2collection lookup table:\n\nCREATE TABLE user2collection (\n\n user\\\
    _id INT(11) NOT NULL DEFAULT '0',\n\n collection\\_id INT(11) NOT NULL DEFAULT\
    \ '0',\n\n61\n\nHow do I build a permissions system?"
