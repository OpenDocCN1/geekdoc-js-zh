  md: "fileLocking\n\nThis is used to switch the file locking mechanisms on\n\nor\
    \ off. The default is TRUE (enabled).\n\nwriteControl\n\nThis checks that a cache\
    \ file has been written correctly\n\nimmediately after it has been created, and\
    \ throws a\n\nPEAR::Error if it finds a problem. Obviously, this\n\nwould allow\
    \ your code to attempt to rewrite a cache\n\nfile that was created incorrectly,\
    \ but comes at a cost\n\nin terms of performance. The default is TRUE (enabled).\n\
    \nreadControl\n\nThis checks cache files that are being read for corrup-\n\ntion.\
    \ Cache\\_Lite is able to place inside the file a value,\n\nsuch as the string\
    \ length of the file, which can be used\n\nto confirm that the cache file isn’t\
    \ corrupted. There\n\nare three alternative mechanisms for checking that a\n\n\
    file is valid, and they’re specified using the\n\nreadControlType option. These\
    \ mechanisms come at\n\nthe cost of performance, but should help guarantee\n\n\
    your visitors aren’t seeing scrambled pages. The default\n\nvalue is TRUE (enabled).\n\
    \nreadControlType\n\nThis specifies the type of read control mechanism to\n\n\
    use. The available mechanisms are a cyclic redundancy\n\ncheck ('crc32', the default\
    \ value) using PHP’s crc32\n\nfunction, an MD5 hash using PHP’s md5 function\n\
    \n('md5'), or a simple and fast string length check\n\n('strlen'). Note that this\
    \ mechanism is not intended\n\nto provide security from people tampering with\
    \ your\n\ncache files; it’s just a way to spot corrupt files.\n\npearErrorMode\n\
    \nThis tells Cache\\_Lite how it should return PEAR errors\n\nto \n\nthe \n\n\
    calling \n\nscript. \n\nThe \n\ndefault \n\nis\n\nCACHE\\_LITE\\_ERROR\\_RETURN,\
    \ which means Cache\\_Lite\n\nwill return a PEAR::Error object\n\nmemoryCaching\n\
    \nWith memory caching enabled, every time a file is\n\nwritten to the cache, it\
    \ is stored in an array in\n\nCache\\_Lite. The \n\nsaveMemoryCachingState and\n\
    \ngetMemoryCachingState methods can be used to store\n\nand access the memory\
    \ cache data between requests.\n\nThe advantage of this is that the complete set\
    \ of cache\n\nfiles can be stored in a single file, reducing the number\n\nChapter\
    \ 5: Caching\n\n258"
