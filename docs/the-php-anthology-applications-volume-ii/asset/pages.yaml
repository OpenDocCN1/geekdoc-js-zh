  md: 'paradigm: that users of a class should only access objects of that class via
    the


    public doorways—its public methods and variables.


    PHP 4 does not restrict what you can and can’t access inside an object. You’re


    free to “talk” to any method or member variable you want to. Whether you *should*


    access them directly is another question altogether. Often, the developer who


    built the class will provide member variables and methods that are meant for in-


    ternal use only, for example, storing some temporary data about the state of the


    object while it’s in use. As a result, while there’s no enforcement of object
    privacy


    in PHP 4, many developers will use comments to mark a method or class variable


    as private, thereby telling other developers not to use it.


    These access control markers will be spotted by an API documentation parser;


    the generated documentation will indicate which methods and variables are in-


    tended for public use, and which are private.


    ![](img/a381b8313756f8d5eb75f79b6057b90e_305_0.png)


    **Access Control in PHP 5**


    Note that PHP 5 will support the Java convention of being able to declare


    private, protected, and public class members, and will enforce those restric-


    tions.


    **Practice Makes Perfect**


    It’s fine to talk about API documentation, but, unless you’ve got some staring


    you in the face, it’s unlikely to make sense. The best approach is to get your


    hands dirty by picking some well-known PHP classes and examining the docu-


    mentation. Here are some suggestions:


    **PHPMailer**


    In Volume I, Chapter 8, we looked at PHPMailer in detail, as a tool for creating


    advanced emails that can easily be managed using PHP’s mail function. Because


    practically all PHP coders will be very familiar with the issues of sending email


    from PHP, this makes a great project to start learning how to use API document-


    ation and classes in general. PHPMailer also has a fairly simple class hierarchy,


    so you won’t need to worry about issues such as inheritance. Looking at “How


    do I simplify the generation of complex emails?” in Volume I, Chapter 8, we had:


    <?php


    // Include the phpmailer class


    require ''ThirdParty/phpmailer/class.phpmailer.php'';


