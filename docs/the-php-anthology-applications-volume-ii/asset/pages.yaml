  md: 'servers) from caching pages in the first place. The most basic approach to
    doing


    this utilizes HTML meta tags:


    <meta http-equiv="Expires" content="Mon, 26 Jul 1997 05:00:00 GMT"


    />


    <meta http-equiv="Pragma" content="no-cache" />


    By inserting a past date into the Expires meta tag, we can tell the browser that


    the cached copy of the page is always out of date. This means the browser should


    never cache the page. The Pragma: no-cache meta tag is a fairly well-supported


    convention that most Web browsers follow. Upon encountering this tag, they


    usually won’t cache the page (although there’s no guarantee; this is just a conven-


    tion).


    It sounds good, but there are two problems associated with the use of meta tags:


    1.


    If a tag wasn’t present when the page was first requested by a browser, but


    appears later (for example, you modified the included pageheader.php file,


    which contains the top of every Web page), the browser will remain blissfully


    ignorant and keep its cached copy of the original.


    2.


    Proxy servers that cache Web pages, such as those common to ISPs, generally


    will *not* examine the HTML documents themselves. Instead, they rely purely


    on the Web server from which the documents came, and the HTTP protocol.


    In other words, a Web browser might know that it shouldn’t cache the page,


    but the proxy server between the browser and your Web server probably


    doesn’t—it will continue to deliver the same out-of-date page to the client


    A better approach is to use the HTTP protocol itself, with the help of PHP’s


    header function, to produce the equivalent of the two meta tags above:


    <?php


    header(''Expires: Mon, 26 Jul 1997 05:00:00 GMT'');


    header(''Pragma: no-cache'');


    ?>


    We can go one step further, using the Cache-Control header that’s supported


    by HTTP 1.1 capable browsers:


    <?php


    header(''Expires: Mon, 26 Jul 1997 05:00:00 GMT'');


    header(''Cache-Control: no-store, no-cache, must-revalidate'');


    header(''Cache-Control: post-check=0, pre-check=0'', FALSE);


    header(''Pragma: no-cache'');


    ?>


