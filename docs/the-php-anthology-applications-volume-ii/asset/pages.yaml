    \ particular types of data. Here’s how we’d validate user names:\n\nFile: **Validators/ValidateUser.php****\
    \ (in ****SPLIB****)**\n\n<?php\n\nrequire\\_once 'Validators/Validator.php';\n\
    \n/\\*\\*\n\n \\* Validates a username\n\n \\*/\n\nclass ValidateUser extends\
    \ Validator {\n\n /\\*\\*\n\n \\* Validates a username\n\n \\* @access private\n\
    \n \\* @return void\n\n \\*/\n\n function validate($user)\n\n {\n\n if (!preg\\\
    _match('/^\\[a-zA-Z0-9\\_\\]+$/', $user )) {\n\n $this->setError('Username contains\
    \ invalid characters');\n\n }\n\n if (strlen($user) < 6) {\n\n $this->setError('Username\
    \ is too short');\n\n }\n\n if (strlen($user) > 20) {\n\n $this->setError('Username\
    \ is too long');\n\n }\n\n }\n\n}\n\n?>\n\nWhen Validator is instantiated, it\
    \ expects to be given a value to test for validity;\n\nit passes this value to\
    \ the validate method. The work involved in writing sub-\n\nclasses like ValidateUser\
    \ therefore focuses purely on the validate method, al-\n\nlowing you to concentrate\
    \ on the problem at hand, while easily extending your\n\nset of validation classes\
    \ to cater to new data types.\n\nChapter 7: Design Patterns\n\n338"
