  md: "rows. A second template catches all other (i.e. unpublished) articles and suppresses\n\
    \nthem.\n\nNote that implementing within the stylesheet the logic that controls\
    \ which articles\n\nare and aren’t displayed is probably a bad idea, though it\
    \ creates a more interesting\n\nexample here. In fact, this is better handled\
    \ by PHP in a uniform security/permis-\n\nsions system that’s easy to maintain\
    \ and administer. We’ve used the XPath **pre-**\n\n**dicate**³ in the template’s\
    \ condition to demonstrate an interesting capability of\n\nstylesheets, rather\
    \ than to encourage you to take this approach.\n\nFile: **articles.xsl**** (excerpt)**\n\
    \n <xsl:output method=\"html\" indent=\"yes\" encoding=\"iso-8859-1\" />\n\n <!--\
    \ Strip whitespace from original -->\n\n <xsl:strip-space elements=\"\\*\" />\n\
    \n <!-- Match each published article -->\n\n <xsl:template priority=\"1\" match=\"\
    spt:article\\[spt:public='1'\\]\">\n\n <tr>\n\n <td class=\"title\">\n\n <xsl:value-of\
    \ select=\"spt:title\" />\n\n </td>\n\n <td class=\"author\">\n\n <xsl:value-of\
    \ select=\"spt:author\" />\n\n </td>\n\n </tr>\n\n <tr>\n\n <td colspan=\"2\"\
    >\n\n <xsl:value-of select=\"spt:body\"/>\n\n </td>\n\n </tr>\n\n </xsl:template>\n\
    \n <!-- Match and hide unpublished articles -->\n\n <xsl:template match=\"spt:article\"\
    />\n\n</xsl:stylesheet>\n\nOK, let’s use PHP to perform the transformation. First,\
    \ we define the full path\n\nto the XML and XSL documents:\n\nFile: **14.php****\
    \ (excerpt)**\n\n<?php\n\n// Define paths to XML and XSL documents (MODIFY THIS!)\n\
    \n$xml = '*/full/path/to/*XML/articles.xml';\n\n$xsl = '*/full/path/to/*XML/articles.xsl';\n\
    \n3A predicate is a portion of an XPath expression between square brackets that\
    \ filters the nodes ac-\n\ncording to a given condition. In this example, the\
    \ predicate filters out non-public articles.\n\nChapter 2: XML\n\n136"
