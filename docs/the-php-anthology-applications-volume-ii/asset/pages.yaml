  md: "**Cache\\_Lite Options**\n\nWhen instantiating \n\nCache\\_Lite (or any of\
    \ its subclasses, such as\n\nCache\\_Lite\\_Output), there are a number of ways\
    \ to control its behavior. These\n\nshould be placed in an array and passed to\
    \ the constructor as in the previous ex-\n\nample:\n\nFile: **4.php**** (excerpt)**\n\
    \n// Define options for Cache\\_Lite\n\n$options = array(\n\n 'cacheDir' => './cache/',\n\
    \n 'writeControl' => TRUE,\n\n 'readControl' => TRUE,\n\n 'readControlType' =>\
    \ 'md5'\n\n);\n\n// Instantiate Cache\\_Lite\\_Output\n\n$cache = new Cache\\\
    _Lite\\_Output($options);\n\nIn the current version (1.1) the available options\
    \ are:\n\ncacheDir\n\nThis is the directory in which the cache files will be\n\
    \nplaced. This defaults to the current script execution\n\ndirectory.\n\ncaching\n\
    \nThis option switches on or off the caching behavior\n\nof Cache\\_Lite. If you\
    \ have numerous Cache\\_Lite calls\n\nin your code and want to disable the cache\
    \ for debug-\n\nging, for example, this will be important. The default\n\nvalue\
    \ is TRUE (caching enabled).\n\nlifetime\n\nThis represents the default lifetime\
    \ (in seconds) of\n\ncache files. It can be changed using the setLifeTime\n\n\
    method. The default value is 3600 (one hour).\n\nfileNameProtection\n\nWith this\
    \ option activated, Cache\\_Lite uses an MD5\n\nencryption hash to generate the\
    \ filename for the cache\n\nfile. This protects you from error when you try to\
    \ use\n\nIDs or group names containing characters that aren’t\n\nvalid for filenames;\
    \ it must be turned on when you\n\nuse Cache\\_Lite\\_Function. The default is\
    \ TRUE (en-\n\nabled).\n\n257\n\nCache\\_Lite Options"
  merge: -1
