  md: "File: **7.php**** (excerpt)**\n\n<?php\n\n// Include PEAR::Cache\\_Lite\n\n\
    require\\_once 'Cache/Lite.php';\n\n// Define options for Cache\\_Lite\n\n$options\
    \ = array(\n\n 'cacheDir' => './cache/'\n\n);\n\n// Instantiate Cache\\_Lite\n\
    \n$cache = new Cache\\_Lite($options);\n\n// Some dummy data to store\n\n$id =\
    \ 'MyCache';\n\n// Initialize the cache if first time the page is requested\n\n\
    if (!$cache->get($id)) {\n\n $cache->save('Dummy', $id);\n\n}\n\n// A randomizer...\n\
    \n$random = array(0, 1, 1);\n\nshuffle($random);\n\n// Randomly update the cache\n\
    \nif ($random\\[0\\] == 0) {\n\n $cache->save('Dummy', $id);\n\n}\n\n// Get the\
    \ time the cache file was last modified\n\n$lastModified = filemtime($cache->\\\
    _file);\n\n// Issue an HTTP last modified header\n\nheader('Last-Modified: ' .\n\
    \n gmdate('D, d M Y H:i:s', $lastModified) . ' GMT');\n\n// Get client headers\
    \ - Apache only\n\n$request = getallheaders();\n\nif (isset($request\\['If-Modified-Since'\\\
    ])) {\n\n // Split the If-Modified-Since (Netscape < v6 gets this wrong)\n\n $modifiedSince\
    \ = explode(';', $request\\['If-Modified-Since'\\]);\n\n // Turn the client request\
    \ If-Modified-Since into a timestamp\n\n $modifiedSince = strtotime($modifiedSince\\\
    [0\\]);\n\n265\n\nPage Modification Time"
  merge: -1
