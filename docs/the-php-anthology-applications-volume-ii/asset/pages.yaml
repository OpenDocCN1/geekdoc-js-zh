  md: "XPathObject Object\n\n(\n\n \\[type\\] => 1\n\n \\[nodeset\\] => Array\n\n\
    \ (\n\n \\[0\\] => domtext Object\n\n (\n\n \\[type\\] => 3\n\n \\[name\\] =>\
    \ #text\n\n \\[content\\] => Give me back my MySQL Command Lin\n\n \\[0\\] =>\
    \ 5\n\n \\[1\\] => 18318008\n\n )\n\n \\[1\\] => domtext Object\n\n (\n\n \\[type\\\
    ] => 3\n\n \\[name\\] => #text\n\n \\[content\\] => Build your own Database Driven\
    \ We\n\n \\[0\\] => 6\n\n \\[1\\] => 18297520\n\n )\n\nNotice that the data we\
    \ want is contained within a property of the XpathObject\n\ncalled nodeset. Displaying\
    \ a nicely-formatted list of article titles would be a simple\n\nmatter of performing\
    \ a foreach loop on this property.\n\nBut what if you wanted not only the titles\
    \ of the articles, but the author names\n\nas well? Assuming every article has\
    \ a spt:title and spt:author tag, you could\n\nsimply perform two XPath queries—one\
    \ to fetch the titles, and one to fetch the\n\nauthors. But when you’re querying\
    \ a complex XML document, such searches can\n\nbe time-consuming. It could be\
    \ more efficient to find the articles *first*, then fetch\n\nthe title and author\
    \ of each. Here’s how:\n\nFile: **11.php**** (excerpt)**\n\n// Fetch the articles\
    \ with an XPath statement into an XPath object\n\n$articles = &$ctx->xpath\\_eval(\"\
    //spt:article\");\n\necho '<b>Current Articles</b><br />';\n\n// Loop through\
    \ the articles\n\nforeach ($articles->nodeset as $article) {\n\n // Fetch the\
    \ title with the $article object as the context node\n\n $title = &$ctx->xpath\\\
    _eval(\"spt:title/text()\", $article);\n\n125\n\nHow do I perform XPath queries\
    \ with PHP?"
