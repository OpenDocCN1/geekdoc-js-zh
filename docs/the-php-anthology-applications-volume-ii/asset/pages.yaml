  md: 'we looked at how to display an image with a PHP script that had been fetched


    from a database. To execute this script, you would use an ordinary HTML img


    tag:


    <img src="logo.php" />


    logo.php would contain something like the code below, which sends an image


    file to the browser:


    header(''content-type: image/gif'');


    readfile(''/home/username/www/images/logo.gif'');


    But what’s to stop you putting other PHP code in there? Nothing! And if the


    logo is being displayed on every page, it’s also the perfect tool to capture Web


    traffic information.


    Note that it’s a good idea to call PHP’s flush function right after readfile,
    before


    you begin a time consuming number crunching routine. Otherwise, the image


    may only finally be sent to the client Web browser after the script has finished


    execution, which will have people wondering where the logo went. Some cunning


    is needed to allow the “real page” being viewed to pass information to the script


    that displays the image, for example, giving it the REQUEST\_URI data from the


    page on which the image is displayed:


    <img src="logo.php?page=<?php


    echo urlencode($\_SERVER\[''REQUEST\_URI''\]); ?>" />


    An alternative mechanism (that’s less reliable, as it depends upon the browser


    passing on the information), is to use the HTTP\_REFERER value, which should


    contain the URL of the page in which the img tag was used.


    The rest is just a database query to store the information. As this approach will


    have no impact on the rendering of the main page, you might even consider doing


    some of the calculations that create the derived data from the raw data here.
    A


    further advantage of this approach is that it allows you to log statistics from
    any


    type of Web page, including static HTML pages. The only downside is that it


    relies on the browser fetching the image; a PHP or Perl script that is pretending


    to be a browser will generally only load the HTML of the page, and will skip


    fetching the image, which means the statistics-gathering script is never executed.


    Don’t worry too much if this isn’t clear right now. phpOpenTracker\[4\] solves


    most of these problems, allowing you to concentrate on the specifics of your online


    \[4\] http://www.phpopentracker.de/


    227


    Logging Strategy'
