    \ charset=iso-8859-1\" />\n\n</head>\n\n<style type=\"text/css\">\n\nbody {\n\n\
    \ font-family: verdana;\n\n font-size: 13px;\n\n font-weight: bold;\n\n color:\
    \ red;\n\n}\n\n</style>\n\n<body>\n\n<p>The time sponsored by SVG is<br />\n\n\
    <object data=\"6.php\" width=\"200\" height=\"30\"\n\n type=\"image/svg+xml\"\
    \ />\n\n</p>\n\n</body>\n\n</html>\n\nThe result is a clock that updates itself\
    \ from your Web server every second (barring\n\nnetwork delays), as shown in Figure\
    \ 3.6\n\n**Figure 3.6. SVGWatch**\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_222_0.png)\n\
    \nObviously, this is a somewhat irritating example that will have your site’s\
    \ visitors\n\nrunning for miles, but it demonstrates the basic principle nicely.\
    \ What’s more,\n\nAdobe have been sure to implement JavaScript within their viewer\
    \ to a degree\n\nthat’s comparable to Mozilla, so there are no hassles regarding\
    \ browsers that\n\ndon’t support your code.\n\nChapter 3: Alternative Content\
    \ Types\n\n204"
