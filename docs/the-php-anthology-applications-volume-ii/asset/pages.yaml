  md: "Note that if each finds itself at the end of the array, it returns FALSE, which\
    \ ex-\n\nplains this part of the fetch method:\n\n // If $color wasn't false...\n\
    \n if ($color) {\n\n // return the value\n\n return $color\\['value'\\];\n\nThen,\
    \ if we find that each has returned FALSE, we use PHP’s reset function to\n\n\
    set the array pointer back to the start, while returning FALSE so that the code\n\
    \nthat’s using the fetch method knows it has come to an end:\n\n // $color is\
    \ false (reached the end of the array)...\n\n } else {\n\n // Reset the colors\
    \ array\n\n reset($this->colors);\n\n // Return false\n\n return FALSE;\n\n }\n\
    \nHere’s how we can use the fetch method of the Colors class in a script:\n\n\
    File: **4.php**** (excerpt)**\n\n// Instantiate the Colors class\n\n$colors =\
    \ new Colors();\n\n// Iterate over it twice using a while loop and the fetch()\
    \ method\n\necho '<b>First iteration:</b><br />';\n\nwhile ($color = **$colors->fetch()**)\
    \ {\n\n echo $color . '<br />';\n\n}\n\necho '<b>Second iteration:</b><br />';\n\
    \nwhile ($color = **$colors->fetch()**) {\n\n echo $color . '<br />';\n\n}\n\n\
    ?>\n\nAlthough we’re using a while loop here, you can see that using the fetch\
    \ method\n\nis very similar to using the foreach construct.\n\n**But, What’s the\
    \ Point?**\n\nThat example gives you a rough idea of how a particular iterator\
    \ functions. But\n\nyou’re probably wondering, “why bother?” Well, bear with me\
    \ here. In this next\n\nChapter 7: Design Patterns\n\n326"
