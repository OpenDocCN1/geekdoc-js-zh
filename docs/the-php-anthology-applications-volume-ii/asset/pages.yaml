  md: "This shortcoming, along with other requirements, such as being able to move\n\
    \nbackward and forward through the collection or performing multiple iterations\n\
    \nover a collection simultaneously, creates the need for a more complex API. A\n\
    \ngeneral “profile” of a more advanced iterator looks like this:\n\n<?php\n\n\
    class Iterator {\n\n function Iterator() {…}\n\n // Resets the collection\n\n\
    \ function reset() {…}\n\n // Moves the collection point forward one\n\n // (but\
    \ typically returns no value)\n\n function next() {…}\n\n // Sometimes called\
    \ isFinal() or isValid();\n\n // used to check for the end of the collection\n\
    \n function hasMore() {…}\n\n // Gets the current value from the collection\n\n\
    \ function current() {…}\n\n}\n\n?>\n\nThe above class shows the methods commonly\
    \ provided by more advanced iter-\n\nators. The detail (i.e. what actually happens\
    \ inside the class) will vary between\n\niterators, depending on the problem each\
    \ is intended to solve.\n\nIf you’re interested in exploring other types of iterators\
    \ in PHP, the best approach\n\nis to examine open source class libraries that\
    \ use them, such as Eclipse\\[1\\] and\n\neXtremePHP\\[2\\].\n\n**The Strategy\
    \ Pattern**\n\nThe **strategy pattern** is used in situations in which there is\
    \ a common problem\n\nthat can be solved by one of many algorithms. It can help\
    \ eliminate long-winded\n\nif-else or switch structures and, if the problem to\
    \ be solved repeats itself\n\nwithin an application, also removes the need to\
    \ reproduce the same code for each\n\nsolution.\n\n\\[1\\] http://www.students.cs.uu.nl/people/voostind/eclipse/\n\
    \n\\[2\\] https://sourceforge.net/projects/extremephp/\n\nChapter 7: Design Patterns\n\
    \n334"
