  md: "File: **10.php**\n\n<?php\n\n// Get the contents of the XML document\n\n$articles\
    \ = file('articles.xml');\n\n$articles = implode('', $articles);\n\n// Instantiate\
    \ a DOM Document from the file\n\n$dom = domxml\\_open\\_mem($articles); \n\n\
    **// Fetch new XPathContext object**\n\n**$ctx = $dom->xpath\\_new\\_context();\
    \ **\n\n**// Register the SitePoint namespace**\n\n**$ctx->xpath\\_register\\\
    _ns(\"spt\", \"http://www.sitepoint.com/\");**\n\n**// Fetch the titles with an\
    \ XPath statement into an XPath object**\n\n**$titles = &$ctx->xpath\\_eval(\"\
    //spt:title/text()\");**\n\n// Display the data structure\n\necho '<pre>';\n\n\
    print\\_r($titles);\n\necho '</pre>';\n\n?>\n\nFirst, we fetch the XML document\
    \ and create a new instance of DOMDocument,\n\nas usual. Next, we use xpath\\\
    _new\\_context to create a new XpathContextObject;\n\nthis initializes the XPath\
    \ functionality to perform queries from the root of the\n\ndocument. We then have\
    \ to register the namespace defined by the document,\n\nusing the xpath\\_register\\\
    _ns method. If we don’t, the XpathContext object will\n\nfail to recognize the\
    \ prefix, and errors will result.\n\nUsing the xpath\\_eval method, we can execute\
    \ an XPath expression to fetch an\n\nXPathObject containing the data we need.\
    \ Note that we’ve used the & operator\n\nto pass the nodes by reference so that,\
    \ should we need to, we can manipulate\n\nthem with the standard DOM methods and\
    \ have those changes reflected in the\n\nstored document structure.\n\nThe XPath\
    \ statement in this example is //spt:title/text(), which should get\n\nus the\
    \ text inside every spt:title element in the document. Again, the detailed\n\n\
    syntax of this expression is beyond the scope of this book, and resources are\n\
    \nprovided in the section called “Further Reading”.\n\nSo that the format of the\
    \ returned data is clear, we’ll simply print the array as-\n\nis, using print\\\
    _r. Here are the results:\n\nChapter 2: XML\n\n124"
