  md: '![](img/a381b8313756f8d5eb75f79b6057b90e_272_0.png)


    **Nesting Buffers**


    You can **nest** one buffer within another practically *ad infinitum* simply by


    calling ob\_start more than once. This can be useful if you have multiple


    operations that use the output buffer, such as one that catches the PHP error


    messages, and another that deals with caching. Care needs to be taken to


    make sure that ob\_end\_flush or ob\_end\_clean is called every time


    ob\_start is used.


    **How do I implement a simple server side**


    **caching system?**


    Now that we have a grasp of the ideas behind output buffering, it’s time to see


    how we can put this process into action in a manner that will be easy to maintain.


    To do this, we’ll use a little help from PEAR::Cache\_Lite (version 1.1 was used


    in the examples here).


    As I mentioned, in the interests of keeping your code maintainable and having


    a reliable caching mechanism, it’s a good idea to delegate the responsibility
    of


    caching logic to classes you trust. Cache\_Lite provides a solid but easy to use


    library for caching, handling issues such as file locking, creating, checking
    for,


    and deleting cache files, controlling the output buffer, and directly caching
    the


    results from function and class method calls. More to the point, Cache\_Lite


    should be relatively easy to apply to an existing application, requiring only
    minor


    code modifications.


    There are three main classes in Cache\_Lite. First is the base class, Cache\_Lite,


    which deals purely with creating and fetching cache files, but makes no use of


    output buffering. This class can be used alone for caching operations in which


    you have no need for output buffering, such as storing the contents of a template


    you’ve parsed with PHP. The examples here will not use Cache\_Lite directly,


    but will instead focus on the two subclasses. Cache\_Lite\_Function can be used


    to call a function or class method and cache the result; this might prove useful


    for storing a MySQL query result set, for example. The Cache\_Lite\_Output class


    uses PHP’s output control functions to catch the output generated by your script,


    and store it in cache files; it allows you to perform tasks such as those we com-


    pleted in the previous solution.


    Here’s an example of how you might use Cache\_Lite to accomplish the task we


    completed in the last solution. When instantiating any of Cache\_Lite’s classes,


    we must first provide an array of options that determine the behavior of


    Chapter 5: Caching


