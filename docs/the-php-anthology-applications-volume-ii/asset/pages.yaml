  md: '**Alternative Content Types**


    **3**


    As you’re probably aware, (X)HTML is not the only format in which you can


    display content on the Internet. Aside from .gif, .jpeg and .png there are a


    number of other alternative content types which have proven themselves useful


    on the Web, including Adobe’s PDF format and Macromedia’s Flash, as well as


    alternative XML formats such as SVG (Scalable Vector Graphics), WML (wireless


    markup language), and XUL (Mozilla’s XML User interface Language). Each has


    its own arena, through which it can enhance your Website and provide visitors


    with an alternative experience.


    The subject of this chapter is using PHP to render such formats, perhaps as an


    alternative or in addition to your existing (X)HTML based content. What this


    chapter should also emphasize is that using classes and **layering** in your applica-


    tions can help you add new functionality to your site while taking advantage of


    existing code.


    **How do I render PDF documents with**


    **PHP?**


    Adobe’s PDF format has established itself as the *de facto* standard content type


    for displaying documents in a predictable form online. Not all users like to read'
