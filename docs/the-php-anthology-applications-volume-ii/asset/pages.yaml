  md: "Once you’ve done that, the next step is to override some php.ini settings with\n\
    \na .htaccess file⁴ containing:\n\nFile: **mysql\\_session\\_handler/.htaccess**\n\
    \nphp\\_value session.save\\_handler 'user'\n\nphp\\_value session.save\\_path\
    \ 'php\\_sessions'\n\nphp\\_value auto\\_prepend\\_file '/path/to/mysql\\_session\\\
    _handler.php'\n\nThe first line tells PHP that rather than using its default session\
    \ handling mech-\n\nanism, it will be told how to handle sessions by your own\
    \ code. The value ses-\n\nsion.save\\_path refers to the name of the table where\
    \ sessions are stored. The\n\nlast line tells PHP to execute the mysql\\_session\\\
    _handler.php file every time\n\nany other script is executed.\n\nFinally, you\
    \ need to create a table called php\\_sessions with the following\n\nstructure:\n\
    \nCREATE TABLE php\\_sessions (\n\n session\\_id VARCHAR(40) NOT NULL DEFAULT\
    \ '',\n\n last\\_active INT(11) NOT NULL DEFAULT '0',\n\n data TEXT NOT NULL,\n\
    \n PRIMARY KEY (session\\_id)\n\n)\n\nWith the .htaccess file placed in your Web\
    \ root directory, all PHP scripts using\n\nsessions will store the session data\
    \ in MySQL rather than in files.\n\nThe data stored by sessions has a format that\
    \ looks like this:\n\nmyVar|s:11:\"Hello World\";ip\\_address|s:9:\"127.0.0.1\"\
    ;\n\nVariables themselves are separated by either semicolons or {} in the case\
    \ of arrays,\n\nwhile within each variable, the name and value is separated by\
    \ |. The value itself\n\nis stored in a serialized form (see the PHP Manual\\\
    [11\\] for details).\n\nSo the above example corresponds to two variables:\n\n\
    4The PHP configuration setting auto\\_prepend\\_file can only be set in php.ini\
    \ or by a\n\n.htaccess file. If you can’t use .htaccess in that way, you’ll need\
    \ to include mysql\\_ses-\n\nsion\\_handler.php in all your scripts, which is\
    \ best done by adding it to a script which is already\n\nincluded by all others,\
    \ such as that where you keep central configuration information. The configur-\n\
    \nation values session.save\\_handler and session\\_save\\_path can both be controlled\
    \ with\n\nthe ini\\_set function (see Appendix A for more details). These will\
    \ also need to be included in\n\nevery script.\n\n\\[11\\] http://www.php.net/serialize\n\
    \nChapter 1: Access Control\n\n72"
