- img_proc: true
  md: "Notice that the realm value specified in the WWW-Authenticate header is displayed\n\
    \nin the dialog box. A **realm** is a “security space” or “zone” within which\
    \ a partic-\n\nular set of login details are valid. Upon successful authentication,\
    \ the browser\n\nwill remember the correct user name and password combination\
    \ and automatically\n\nre-send it in any future request to that realm. When the\
    \ user navigates to another\n\nrealm, however, the browser displays a fresh prompt\
    \ once again.\n\nIn any case, the user must provide a user name and password to\
    \ get the page.\n\nThe browser then sends those credentials with a second page\
    \ request like this:\n\nGET /admin/ HTTP/1.1\n\nHost: www.sitepoint.com\n\n**Authorization:\
    \ Basic jTSAbT766yN0hGjUi**\n\nThe Authorization header contains the user name\
    \ and password encoded with\n\n**base64 encoding** which, it is worth noting,\
    \ is *not* secure—but at least makes it\n\nunreadable for humans.\n\nThe server\
    \ will check to ensure that the credentials are valid. If they are not, the\n\n\
    server will send the Authorization Required response again, as shown previously.\n\
    \nIf the credentials are valid, the server will send the requested page as normal.\n\
    \n**Not by the Hairs of my Chin…**\n\nNow that you have a rough idea of how HTTP\
    \ authentication works, how might\n\nyou secure a PHP page with it? When PHP receives\
    \ an Authorization header\n\nfrom a Web browser, it automatically decodes the\
    \ user name and password\n\ncombination and stores the values in the variables\
    \ $\\_SERVER\\['PHP\\_AUTH\\_USER'\\]\n\nand $\\_SERVER\\['PHP\\_AUTH\\_PW'\\\
    ] for the user name and password, respectively.\n\nHere’s how you could secure\
    \ a simple page:\n\nFile: **2.php**\n\n<?php\n\n// An array of allowed users and\
    \ their passwords\n\n$users = array(\n\n 'harryf' => 'secret',\n\n 'littlepig'\
    \ => 'chinny'\n\n);\n\n// If there's no Authentication header, exit\n\nif (!isset($\\\
    _SERVER\\['PHP\\_AUTH\\_USER'\\])) {\n\n header('HTTP/1.1 401 Unauthorized');\n\
    \n header('WWW-Authenticate: Basic realm=\"PHP Secured\"');\n\nChapter 1: Access\
    \ Control\n\n6"
