  md: " foreach ($validators as $validator) {\n\n if (!$validator->isValid()) {\n\n\
    \ while ($error = $validator->fetch()) {\n\n $errors\\[\\] = $error;\n\n }\n\n\
    \ }\n\n }\n\n}\n\n?>\n\nThe rest of the page remains unchanged, but we’ve made\
    \ the code that handles\n\nvalidation far more flexible and modular. If we wanted\
    \ to add a Validator to\n\ncheck a credit card number, for example, all we’d need\
    \ to do would be to plug it\n\ninto the $validators array:\n\n $validators\\[\\\
    ] = new ValidateCreditCard($\\_POST\\['creditcard'\\]);\n\nThe rest happens automatically!\n\
    \n**The Adapter Pattern**\n\nOne of PHP’s greatest advantages as a language for\
    \ building Web-based applica-\n\ntions is the size and strength of its community—in\
    \ particular, the wealth of open\n\nsource code available as examples, and for\
    \ use in your own projects. Developers\n\nsimply need to head over to PHP Classes\\\
    [3\\] to find examples of the solutions\n\nothers have created to overcome the\
    \ problem we’re dealing with—perhaps the\n\nsolution even slots neatly into our\
    \ existing code, preventing us from having to\n\nreinvent the wheel.\n\nWhile\
    \ this is a big plus for PHP, it comes with a downside. Companies such as\n\n\
    Sun and Microsoft are able to put together cohesive libraries of classes that\
    \ integ-\n\nrate well, the whole being much greater than the sum of the parts.\
    \ As it’s not\n\nbacked by any large software house, PHP lacks a library of components\
    \ that\n\ncompare with the likes of the Java or .NET class libraries. Much of\
    \ the freely\n\navailable PHP code was designed by developers working in a vacuum;\
    \ a class may\n\nhave been designed to work either alone or as part of a small\
    \ library of classes\n\nthat a particular developer uses. As such, attempting\
    \ to slot someone else’s class\n\ninto your application may well highlight its\
    \ incompatibility with your existing\n\ndesign.\n\n\\[3\\] http://www.phpclasses.org/\n\
    \nChapter 7: Design Patterns\n\n342"
