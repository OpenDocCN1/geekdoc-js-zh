    The only way the user can view this page is to have provided a correct user name


    and password. The moment that the Auth class is instantiated, it performs the


    security check. If valid user name and password values have been submitted via


    a form, they are stored by Auth in a session variable, allowing the visitor to
    con-


    tinue surfing without having to log in again.


    As promised, using the Auth class is very easy. To secure a page with it, all
    you


    need to do is place this at the start:³


    // Instantiate the Auth class


    $auth = &new Auth(&$db, $loginUrl);


    As previously mentioned, $loginUrl is the URL to which the Auth class should


    redirect people who aren’t already logged in.


    **Room for Improvement**


    The basic mechanics of the Auth class are solid, but it’s missing the more involved


    elements that will be necessary to halt the efforts of any serious intruders.


    It’s a good idea to implement a mechanism to keep an eye on the number of


    failed login attempts made from a single client. If your application always responds


    immediately to any login attempt, it will be possible for a potential intruder
    to


    make large numbers of requests in a very short time, trying different user name


    and password combinations. The solution is to build a mechanism that counts


    the number of failed attempts using a session variable. Every time the number


    of failures is divisible by three (i.e. three incorrect passwords are entered),
    use


    PHP’s sleep function to delay the next attempt by, for example, ten seconds.


    You may also decide that, after a certain threshold value (for example, fifteen


    failed attempts), you block all further access from that IP address for a given


    period (such as an hour). Of course, changing an IP address is much easier than


    changing a phone number, but you will at least stall would-be intruders, and may


    perhaps make their life difficult enough to persuade them to go elsewhere.


    Another important ingredient for a good security system is an “event logging”


    mechanism that keeps track of suspicious access. In Chapter 4, you’ll find the


    basic mechanics of logging visitor information, including how to track IP addresses,


