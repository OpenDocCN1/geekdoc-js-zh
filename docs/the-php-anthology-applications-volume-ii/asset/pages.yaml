    \nterms.\n\nTaking a step towards implementing the above code in an N-Tier fashion,\
    \ the\n\nfollowing example moves as many of the layers as possible into separate\
    \ classes.\n\nWe’ll reuse the Articles and Article classes we developed to render\
    \ PDFs in\n\nChapter 3, this time, to render HTML. This is, after all, part of\
