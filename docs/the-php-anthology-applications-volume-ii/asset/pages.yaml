- img_proc: true
  md: 'Using the layering in this application, we were able to take the data delivered


    from the application logic tier and render *both* HTML and PDF at the presentation


    logic tier. For a more detailed discussion of layering and N-Tier applications,
    see


    Chapter 6.


    An alternative, and potentially more powerful approach to that presented here


    would be to take advantage of **XSL Formatting Objects**\[9\] (XSL-FO), an XML


    standard designed to provide page-based formatting for XML documents. By


    using XML\_HTMLSax to convert the stored HTML into XML-FO formatting instruc-


    tions, you could use an XSL-FO processor, such as the Apache FOP\[10\]


    (Formatting Objects Processor) project, to render it directly to PDF format. You


    could even get away from XML\_HTMLSax, thanks to an interesting open source


    project that converts HTML to XSL-FO, HTML2FO\[11\], which is written in


    C++ and is available for most platforms. To use Apache FOP in PHP, you can


    look to PEAR::XML\_fo2pdf\[12\]. This does, however, require use of the PHP Java


    extension as well as the Java SDK, which few hosts offer.


    **How do I render SVG with PHP?**


    **Scalable Vector Graphics**\[13\] (SVG) is a W3C XML standard for describing


    graphics. As a technology, it represents an alternative to animated GIFs or Flash


    movies. Being XML, it is more easily renderable with PHP than are binary formats


    such as Flash. To display your SVG creations, a visitor needs a browser plug-in,


    which today means the Adobe SVG Viewer\[14\]. Adobe is one of the main pro-


    moters of SVG. Mozilla browsers will also have SVG support built right in\[15\]


    relatively soon, and the Apache Group provides a Java-based SVG viewer known


    as Batik\[16\].


    It’s beyond the scope of this book to look at the SVG format in detail, but you’ll


    find an excellent resource listed under the section called “Further Reading” at


    the end of this chapter. A worthwhile, and free, tool for drawing simple SVG


    images is Dia\[17\].


    \[9\] http://www.w3.org/TR/xsl/


    \[10\] http://xml.apache.org/fop/index.html


    \[11\] http://html2fo.sourceforge.net/


    \[12\] http://pear.php.net/XML\_fo2pdf


    \[13\] http://www.w3.org/TR/SVG/


    \[14\] http://www.adobe.com/svg/viewer/install/main.html


    \[15\] http://www.mozilla.org/projects/svg/


    \[16\] http://xml.apache.org/batik/index.html


    \[17\] http://www.lysator.liu.se/~alla/dia/


