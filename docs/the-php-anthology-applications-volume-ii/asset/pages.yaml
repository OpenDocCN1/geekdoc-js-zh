    Iterators make it all so easy. For typical PHP problems, the type of data you
    need


    to display in some form of HTML list (e.g. a table or a select menu) will usually


    be an array of strings, an array of arrays, or an array of objects. Our HTMLTable


    class is already prepared for the first two, so we can use it again and again
    with


    many different data sources.


    The most important aspect of deciding when to apply iterators to your classes


    involves choosing the method naming scheme. In the examples above, we called


    all the iterator methods fetch. In the classes that use your iterators, you must


    also plan for the data types your iterators might return. With practice, you can


    make iterators one of your development habits and save yourself a considerable


    amount of time reproducing HTML-related code to output collections of data.


    **Iterator APIs**


    As anyone who’s worked with Java will know, the iterator API we’ve proposed


    here—namely a single method called fetch—is very simple. I’d estimate that for


    around 90% of situations in which you need to iterate over a collection in PHP,


    this single-method iterator will be all you’ll need. Be warned though—it’s only


    intended for use with particular data structures. In particular, if you use this
    API


    to iterate over an array, some elements of which evaluate to false, the code using


    the iterator will stop prematurely, believing that it has come to the end of the


    collection.


    333


    Iterator APIs'
