  md: 'to be used for. Assuming the API documentation is adequate and the class design


    is acceptable (e.g. it involves no undeclared dependence on global variables),
    API


    documentation should provide all the information you need to use a class—there’s


    no need to worry about what’s happening “behind the scenes” in the source code


    itself.


    This development experience is much the same as most people’s use of the built-


    in PHP functions; when was the last time you looked at the C source code of the


    PHP function you just called? If the code is adequately designed, there’s no need


    to look under the hood.


    The difficult part of dealing with class API documentation is that, if you’re
    un-


    certain of OOP in PHP, it may make you more confused than enlightened. API


    documentation does assume a general knowledge of the use of classes and objects


    (so make sure you’ve read Volume I, Chapter 2), but you don’t need to be an


    OOP guru to be able to benefit from a class someone else has written.


    Once you’ve grasped the basics of OOP, the next step is to understand how classes


    are normally depicted in API documentation. In Figure 6.4 above, for example,


    notice the lines connecting the DoesSomething class to the Something class. This


    represents the fact that DoesSomething extends Something (i.e. it’s a subclass
    of


    Something).


    Also, the API documentation describes class methods similarly to the way func-


    tions are explained in the PHP manual. The getSomeString method in my


    DoesSomething class would be described with a **signature** like this:


    string getSomeString(\[boolean $specialChars = false\])


    The word “string” identifies the type of data the method returns. The information


    inside the parentheses tells us we can pass a Boolean value (TRUE or FALSE) as


    an argument to this method, but that the argument has a default value of FALSE.


    **Private, Protected and Public**


    In programming languages like Java and C++, it’s common to define some class


    methods and member variables as being **private** (or sometimes, as **protected**.


    where Java is concerned). This tells a compiler that any code that accesses object


    instances of the class is not allowed to use these methods or variables directly.


    Attempts to do so will usually generate some kind of error at compile time. This


    enforces the notion of **encapsulation** that’s advocated by the object oriented


    Chapter 6: Development Technique


