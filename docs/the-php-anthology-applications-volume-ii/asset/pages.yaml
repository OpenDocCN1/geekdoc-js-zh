  md: "**The Performance Cost of OOP**\n\nSome people writing PHP applications still\
    \ rail against the idea of using classes and objects\n\nto build applications.\
    \ They’re opposed to this philosophy because of the cost in performance\n\nit\
    \ entails, and yes, it’s true—using an object oriented approach to solve a problem\
    \ will be\n\na little slower than the equivalent procedural code. What is important\
    \ to remember about\n\nOOP is that it improves radically your performance as a\
    \ developer; if you have infinite\n\ntime to waste, lucky you! But for the rest\
    \ of us, the object oriented paradigm far outstrips\n\nprocedural coding in terms\
    \ of reduced development times.\n\n**Most Probable First**\n\nA core aspect of\
    \ any PHP application will typically be some sort of control\n\nstructure, such\
    \ as an if-else statement. Often, these are written in a manner\n\nthat suits\
    \ the way humans think, but this may not produce the most effective\n\ncode in\
    \ terms of speed and performance. By placing the most *probable* condition\n\n\
    first, you can help PHP complete an if-else statement faster.\n\nFor example,\
    \ let’s say we have a function, isBlue, which checks to see if a variable\n\n\
    passed to it has the value 'blue'. If, most of the time, the value is given the\n\
    \nfunction 'red', rather than 'blue', it would be better to react to that condition\n\
    \nfirst.\n\nThe following example serves as a test to prove this:\n\nFile: **1.php****\
    \ (excerpt)**\n\n<?php\n\n// Check Xdebug is installed\n\nif (!extension\\_loaded('xdebug'))\
    \ {\n\n die('<a href=\"http://xdebug.derickrethans.nl/\">Xdebug</a> ' .\n\n 'required');\n\
    \n}\n\n// Start Xdebug profiling\n\nxdebug\\_start\\_profiling();\n\n// A array\
    \ of colors \"weighted\" to red\n\n$colors = array('red', 'red', 'red', 'red',\
    \ 'red', 'red', 'red',\n\n 'blue');\n\n// The slow way\n\nfunction isBlueSlow($color)\n\
    \n{\n\n271\n\nMost Probable First"
