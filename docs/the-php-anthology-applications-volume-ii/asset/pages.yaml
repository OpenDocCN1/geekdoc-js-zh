  md: "With all the callback functions in place, we start up the parser as before,\
    \ and use\n\nthe xml\\_set\\_element\\_handler and xml\\_set\\_character\\_data\\\
    _handler functions\n\nto **register** the callback functions. In other words,\
    \ we tell the parser to call open\n\nwhen it encounters an opening tag, close\
    \ for a closing tag, and data for character\n\ndata.\n\nFile: **2.php**** (excerpt)**\n\
    \n// Create the XML parser\n\n$sax = xml\\_parser\\_create('UTF-8');\n\n// Register\
    \ the open and close callback functions\n\nxml\\_set\\_element\\_handler($sax,\
    \ 'open', 'close');\n\n// Register the character data callback function\n\nxml\\\
    _set\\_character\\_data\\_handler($sax, 'data');\n\nNote that other xml\\_set…\
    \ functions exist for handling things like XML processing\n\ninstructions and\
    \ external entity references, but in the vast majority of cases the\n\ntwo functions\
    \ provided here are all you’ll need.\n\nNow, we’ll fetch the SitePoint RSS feed\
    \ from the Website and loop through the\n\nfile in chunks, parsing each chunk\
    \ as we go. This means the parser will begin\n\nwork before it’s finished receiving\
    \ the complete document! This is great for per-\n\nformance, and means the complete\
    \ XML document never has to be stored in\n\nPHP’s memory.\n\nFile: **2.php****\
    \ (excerpt)**\n\n// Open a connection to SitePoint\n\n$fp = fopen('http://www.sitepoint.com/rss.php',\
    \ 'r');\n\n// Loop until the end of the file\n\nwhile (!feof($fp)) {\n\n // Fetch\
    \ a chunk of data\n\n $data = fgets($fp);\n\n // Parse it\n\n xml\\_parse($sax,\
