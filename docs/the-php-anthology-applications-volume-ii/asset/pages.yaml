  md: " }\n\n exit();\n\n }\n\nUnless you tell it not to, this method will send the\
    \ from variable via the query\n\nstring to the script to which the browser is\
    \ redirected. This allows the login form\n\nto return the users to the location\
    \ from which they came; it saves the users from\n\nhaving to navigate back to\
    \ that point, which might be useful if, for example, a\n\nsession times out. Note\
    \ that in the logout method we specified that redirect\n\nshould *not* provide\
    \ the from variable. If it did, the script might return users to\n\nthe URL they\
    \ used to log out, putting them in a loop from which they couldn’t\n\nlog in.\n\
    \nOne important note to make here is that the redirection URL (which is set by\n\
    \nthe constructor) should be *absolute*, not relative. According to the HTTP specific-\n\
    \nation, an absolute URL must be provided when a Location header is used. Later\n\
    \non, when we put this class into action, I’m going to break that rule and use\
    \ a re-\n\nlative URL, because I can’t guess the script’s location on your server.\
    \ This works\n\nbecause most recent browsers understand it (even though they shouldn’t).\
    \ On a\n\nlive site, make sure you provide a full, absolute URL.\n\nFinally, and\
    \ most importantly, we use exit to terminate all further processing.\n\nThis prevents\
    \ the calling script sending the protected content that follows the\n\nauthentication\
    \ code. Although we’ve sent a header that should redirect the\n\nbrowser, we can’t\
    \ rely on the browser to do what it’s told. If the request were\n\nsent by, for\
    \ instance, a Perl script *pretending* to be a Web browser, whoever was\n\nusing\
    \ the script would, no doubt, have total control over its behavior and could\n\
    \nquite easily ignore the instruction to redirect elsewhere. Hence, the exit statement\n\
    \nis critical.\n\nOverall, this approach helps save us from our own mistakes;\
    \ if a given user is not\n\nvalid, script execution halts and the user is redirected\
    \ to another “safe” page. The\n\nalternative approach might be to build conditional\
    \ statements into a page, like\n\nthis:\n\nif ($auth->login()) {\n\n echo 'You\
    \ are logged in';\n\n} else {\n\n echo 'Invalid login';\n\n}\n\nHowever, this\
    \ isn’t really a good idea. In a more complex scenario, which involves\n\nmultiple\
    \ file inclusions, and has classes take responsibility for different parts of\n\
    \nChapter 1: Access Control\n\n20"
