  md: 'you might tell the browser to refresh the cache. Using this link, you’ll notice
    the


    time updates only once every ten seconds.


    ![](img/a381b8313756f8d5eb75f79b6057b90e_282_0.png)


    **Dates and Times in HTTP**


    HTTP dates are always calculated relative to Greenwich Mean Time (GMT).


    The PHP function gmdate is exactly the same as the date function, except


    it automatically offsets the time to GMT, based on your server’s system clock


    and regional settings.


    When a browser encounters an Expires header, it caches the page. All further


    requests for the page that are made before the specified expiry time use the cached


    version of the page; no request is sent to the Web server.


    The Expires header has the advantage of being easy to implement, but for most


    cases, unless you’re a highly organized person, you won’t know exactly when a


    given page on your site will be updated. Because the browser will only contact


    the server *after* the page has expired, there’s no way to tell browsers that
    the page


    they’ve cached is out of date. You also lose some knowledge of the traffic to
    your


    Website, as the browser will not make contact with the server when requesting


    a page that has been cached.


    **Page Modification Time**


    A more useful approach is to make use of the Last-Modified and If-Modified-


    Since headers, both of which are available in HTTP 1.0. Technically, this is


    known as performing a **conditional GET**; whether you return any content is


    based on the condition of the incoming If-Modified-Since request header.


    Using this approach, you need to send a Last-Modified header *every* time your


    PHP script is accessed. The next time the browser requests the page, it sends
    an


    If-Modified-Since header containing a time; your script can then identify


    whether the page has been updated since the time provided. If it hasn’t, your


    script sends an HTTP 304 status code to indicate that the page has not been


    modified, and exits before sending the body of the page.


    Providing a simple example of conditional GETs is tricky, but PEAR::Cache\_Lite


    is a handy tool to show how this works. Don’t get confused though; this is *not*


    meant to show server side caching; it simply provides a file that’s updated peri-


    odically.


    Here’s the code:


    Chapter 5: Caching


    264'
