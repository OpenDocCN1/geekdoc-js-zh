    \ the\n\nXML-RPC methods available from the server and point them at local methods\n\
    \ndefined in the class. When an XML-RPC client calls an XML-RPC method, the\n\n\
    processing will be handled by a method inside the ArticleServer class.\n\nFile:\
    \ **ExampleApps/XMLRPCArticleServer.php**** (in ****SPLIB****) (excerpt)**\n\n\
    <?php\n\nrequire\\_once 'ThirdParty/xmlrpc/IXR\\_Library.inc.php';\n\n/\\*\\*\n\
    \n \\* XML-RPC Article Server class\n\n \\* Builds an XML-RPC server for the articles\
    \ database using\n\n \\* Simon Wilsons XML-RPC implementation\n\n \\* http://scripts.incutio.com/xmlrpc/\n\
    \n \\* @access public\n\n \\* @package SPLIB\n\n \\*/\n\nclass XMLRPCArticleServer\
    \ extends IXR\\_Server {\n\n /\\*\\*\n\n \\* Database access object\n\n \\* @access\
    \ private\n\n \\* @var object\n\n \\*/\n\n var $db;\n\n /\\*\\*\n\n \\* XMLRPCArticleServer\
    \ constructor\n\n \\* @param object instance of database access class\n\n \\*\
    \ @access public\n\n \\*/\n\n function XMLRPCArticleServer(&$db)\n\n {\n\n $this->db\
    \ = &$db;\n\n // Define the XML-RPC methods\n\n $this->IXR\\_Server(array(\n\n\
    \ 'articles.getArticles' => 'this:getArticles',\n\n 'articles.getArticleById'\
    \ => 'this:getArticleById'\n\n ));\n\n }\n\nThe getArticles method is used to\
    \ fetch a list of articles and return them as an\n\narray, which the IXR\\_Server\
    \ class will automatically wrap in an XML-RPC re-\n\nsponse document. Notice that\
    \ when we check for errors, we use the IXR\\_Error\n\nclass to build an error\
    \ object that’s returned to the XML-RPC client. We’re free\n\nto choose our own\
    \ error code, but it’s a good idea to avoid those defined in the\n\n143\n\nThe\
    \ Server"
