  md: '![](img/a381b8313756f8d5eb75f79b6057b90e_241_0.png)


    **The Golden Rule**


    Remember the golden rule: *never trust anything from the browser.* There are ways


    to “spoof” almost anything that might come from a browser.


    Be especially wary of the $\_SERVER\[''HTTP\_REFERER''\] value. I’ve seen


    some people build security mechanisms based around this—a very bad idea.


    Also be aware, when dealing with these variables, that they are only created


    by PHP if they have a value, so you may need to be careful to check that


    they exist in your code before you do anything with them. In the example


    above, we used the error suppression operator (@) to handle this issue.


    Given the basic information from the above script, we already have a foundation


    for building a stats and tracking system; we can store this information in a data-


    base, then use it later to display a report of what’s been happening on the site.


    The hostname of the visitor, obtained with the gethostbyaddr function¹, can


    be used to tell me the domain from which the visitor came. Running this example


    on my own machine, I’m told that localhost is the host name, but on a live site


    you’ll get values such as ottawa-hse-ppp266908.sympatico.ca. The .ca at the


    end tells us the visitor came from Canada, so we could build a report that tells


    us which countries site visitors come from, with the exception of the .com, .net


    and .org domains, which tend to be used internationally.


    The $\_SERVER\[''HTTP\_USER\_AGENT''\] value tells us about the visitor’s browser.


    In the example above, you’ll notice this value contains information about both


    the Web browser (Opera 7.01 \[en\]) and the operating system (Windows NT


    5.1, which is how Windows XP advertises itself). Of course, if you’ve built a
    site


    that’s compatible with all browsers, you won’t need to worry about this informa-


    tion…


    The $\_SERVER\[''REQUEST\_URI''\] data can be used to determine exactly which


    page a user was viewing. This is important with PHP, where the difference between


    URLs like index.php?view=news and index.php?view=articles can be very


    significant. This is the basis of click path analysis.


    $\_SERVER\[''HTTP\_REFERER''\] tells you whether the visitor followed a link to
    get


    to the current page. Although this information can’t be relied upon, it generally


    does provide useful data about sites that are linked to yours.


    1Please note that gethostbyaddr is quite slow as functions go, as it must contact
    another server


    to perform a reverse DNS lookup. Using this function heavily is one way to quickly
    bog down a


    speedy server.


    223


    What information can I gather about my site’s visitors?'
