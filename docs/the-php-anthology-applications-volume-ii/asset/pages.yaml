    for you to customize and reuse in your own applications.


    First of all, we need to visualize the process of (successfully) signing up a
    new


    user:


    1.


    The user fills in the registration form.


    2.


    On the user’s completion of the form, we insert a record into the signup


    table and send a confirmation email.


    3.


    The visitor follows the link in the email and confirms the account.


    4.


    We copy the details from the signup table to the user table. The account


    is now active.


    We use two tables for handling signups, to separate the “dangerous” data from


    the “safe” data. You’ll want to have a cron job or similar to check the signup


    table on a regular basis and delete any entries that are older than, say, twenty-


    four hours. Separating the tables makes it easier to purge the contents of the


    signup table (avoiding unfortunate errors), and keep the user table trim so


    there’s no unnecessary impact on performance during user authentication.


    The first thing we need is a class to handle the key steps in the signup process.


    To begin, we must define a set of constants for the table and column names used


    by the class. This will allow you to override their values in your scripts, should


    you use a different table structure.


