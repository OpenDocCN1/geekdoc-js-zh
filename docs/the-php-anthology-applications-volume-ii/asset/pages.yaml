  md: 'The XML extension\[25\], which implements SAX, is usually the ideal choice
    in


    cases in which you wish to process an unknown number of tags that have a pre-


    dictable structure. What takes a little getting used to is the way it uses **callback**


    **functions** to deal with the elements it encounters in the XML document. If


    you’ve ever written any JavaScript, you probably already use callback functions


    when you specify a JavaScript function to handle the response to an event, such


    as the user clicking a link. Because of this, callback functions are often called


    **event handlers**.


    Since this is a tricky concept to master, we’ll start with a more familiar approach.


    PHP’s xml\_parse\_into\_struct function lets us avoid using callback functions


    by placing the elements of an XML document into an array.


    To begin with, we load the entire document into a string (Volume I, Chapter 4


    for more details on file-related functions). Here, I’ve used the file function
    so


    you can concentrate on the XML-related code, but be aware that it’s often a


    better idea to use fsockopen so that you can deal with unusual error scenarios,


    such as the site being down or the document having been moved. I provided an


    example of this in Volume I, Chapter 4.


    File: **1.php**** (excerpt)**


    <?php


    // Fetch the entire document


    $rssDoc = file(''http://www.sitepoint.com/rss.php'');


    $rssDoc = implode('''', $rssDoc);


    Next, I use the xml\_parser\_create function to fire up the SAX parser and tell


    it to use UTF-8 character encoding, which the first line of the RSS feed indicates


    is required. Other supported encodings include ISO-8859-1 (the default) and


    US-ASCII.


    File: **1.php**** (excerpt)**


    // Start the xml parser tell it the character encoding


    $sax = xml\_parser\_create(''UTF-8'');


    The xml\_parser\_set\_option function is used to instruct the parser *not* to
    convert


    all element and attribute names to uppercase, which is the default behavior. Note


    that this line is included mainly for the sake of example. When we parse XML


    documents provided by third parties like this, it’s often a *good* idea to have
    all


    tags converted to upper case. If one site owner writes the RSS feed in lower case,


    another in upper case, and a third with a mixture of upper and lower case, you’ll


    \[25\] http://www.php.net/xml


    87


    How do I parse an RSS feed with PHP and SAX?'
