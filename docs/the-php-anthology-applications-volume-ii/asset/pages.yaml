  md: "**How do I deal with members who forget**\n\n**their passwords?**\n\nIn the\
    \ last solution, I was happy to explain just how great human beings are in\n\n\
    comparison to computers. Unfortunately, though, we have a tendency to “age\n\n\
    out” important information such as the password we need to log into a site. A\n\
    \nfeature that allows users to retrieve forgotten passwords is an essential time\
    \ saver.\n\nOverlook this, and you can expect to waste a lot of time changing\
    \ passwords for\n\npeople who have forgotten them.\n\nIf you encrypt the passwords\
    \ in your database, you’ll need a mechanism that\n\ngenerates a new password that,\
    \ preferably, is easy to remember. If you’re storing\n\npasswords as-is, without\
    \ encryption, it’s probably acceptable simply to send the\n\npassword to the user’s\
    \ registered email address. Using an email address that you’ve\n\nalready confirmed\
    \ as valid is more reliable than the “Secret Question” approach.\n\nThis common\
    \ tactic asks users simple questions to refresh their memories, such\n\nas, “Where\
    \ were you born?” and “What’s your date of birth?” Just ask yourself\n\nhow many\
    \ organizations, both on and offline, you’ve given that information to.\n\nSome\
    \ online applications, such as forums, even make your birthday available for\n\
    \nall to see, should you provide it. Details like this may well be common knowledge.\n\
    \nTo solve the problem, we’ll build a general AccountMaintenance class, which\
    \ will\n\ndo some of the maintenance work for us, then supply it with the information\
    \ it\n\nneeds to either fetch an unencrypted password, or generate a new (memorable)\n\
    \npassword. The typical approach used to generate memorable passwords is inspired\n\
    \nby the Secure Memorable Password Generator found at Codewalkers.com\\[8\\].\n\
    \n**Password Reminder**\n\nStarting with the simple password fetching code, the\
    \ AccountMaintenance class\n\nbegins with the usual constants, which allow it\
    \ to be applied to a different table\n\nstructure if need be. Note, in particular,\
    \ the USER\\_LOGIN\\_VAR constant, which\n\nmust contain the same value as that\
    \ defined by the Auth class.\n\nFile: **AccessControl/AccountMaintenance.php****\
    \ (in ****SPLIB****) (excerpt)**\n\n<?php\n\n/\\*\\*\n\n \\* Constants which define\
    \ table and column names\n\n\\[8\\] http://codewalkers.com/seecode/52.html\n\n\
    Chapter 1: Access Control\n\n46"
