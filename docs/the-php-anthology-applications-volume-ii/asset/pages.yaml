    The node creation methods available with the DOM XML extension are all ac-


    cessible via the DOMDocument class, which is why the above code contains state-


    ments like this:


    // Create a text node to place the date in


    $dateText = $dom->create\_text\_node(date(''h:ia l jS M Y''));


    // Append the date text node to the <date> element


    $date->append\_child($dateText);


    Notice that the $dom variable is used to create the $dateText node. Yet, to actually


    add the text, the append\_child method is called via the $date variable, which


    is an instance of DOMElement.


    With PHP 4.3, the following methods are available to create XML nodes:


    **DomDocument->create\_attribute**


    create new attribute


    **DomDocument->create\_cdata\_section**


    create new character data (cdata) node


    **DomDocument->create\_comment**


    create new comment node


    **DomDocument->create\_element\_ns**


    create new element node with an associated namespace


    **DomDocument->create\_element**


    create new element node


    **DomDocument->create\_entity\_reference**


    create new entity reference


    **DomDocument->create\_processing\_instruction**


    create new processing instruction node


    **DomDocument->create\_text\_node**


    create new text node


