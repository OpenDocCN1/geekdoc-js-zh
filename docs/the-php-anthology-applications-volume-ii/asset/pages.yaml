  md: "Before you groan about this meaning yet more work, SimpleTest makes the cre-\n\
    \nation of mock objects extremely easy—in fact, they’re created automatically!\
    \ Let’s\n\nturn back to ourStampCollection class, and I’ll show you how this works.\n\
    \nStampCollection expects us to give it Stamp objects via the add method. To\n\
    \nbreak the dependence of the StampCollection on the Stamp class, we need a\n\n\
    mock object for Stamp. To give you an idea of how this works, here’s an example\n\
    \nthat uses a hack to show you the mock object code generated by SimpleTest:\n\
    \nFile: **10.php**\n\n<?php\n\nif (!defined('SIMPLE\\_TEST')) {\n\n // Modify\
    \ this line to point at your simpletest installation\n\n define('SIMPLE\\_TEST',\
    \ '../../simpletest/');\n\n}\n\nrequire\\_once SIMPLE\\_TEST . 'unit\\_tester.php';\n\
    \nrequire\\_once SIMPLE\\_TEST . 'mock\\_objects.php';\n\nrequire\\_once SIMPLE\\\
    _TEST . 'reporter.php';\n\nrequire\\_once '8.php';\n\necho '<pre>';\n\n// Don't\
    \ try this at home. \\_createClassCode is private!\n\necho Mock::\\_createClassCode('Stamp',\
    \ 'MockStamp');\n\necho '</pre>';\n\n?>\n\nNote that, in this example, I called\
    \ a private method provided by SimpleTest,\n\nnamely \\_createClassCode. I can\
    \ do this because I’m a trained PHP stunt man\n\ndemonstrating how mock objects\
    \ work! In other words, don’t try this when\n\nwriting your own tests—SimpleTest\
    \ provides a public API for creating mock ob-\n\njects that we’ll see in a moment.\n\
    \nHere’s the code for the mock class, as it will be displayed by the above script:\n\
    \nclass MockStamp extends SimpleMock {\n\n function MockStamp(&$test, $wildcard\
    \ = MOCK\\_WILDCARD) {\n\n $this->SimpleMock($test, $wildcard);\n\n $args = func\\\
    _get\\_args();\n\n $this->\\_mockMethod(\"Stamp\", $args);\n\n }\n\n function\
    \ &stamp() {\n\n $args = func\\_get\\_args();\n\n return $this->\\_mockMethod(\"\
    stamp\", $args);\n\n }\n\n}\n\n307\n\nMock Objects"
