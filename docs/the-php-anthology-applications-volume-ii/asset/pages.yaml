  md: 'Thankfully, that’s where the **adapter pattern** comes in very handy. The essential


    purpose of the adapter pattern is to provide on top of an existing class API,
    an


    additional API that makes it compatible with other environments.


    For example, we have a class for accessing MySQL; within this class, the method


    that executes a query is called query. All the code that uses the class expects
    to


    find the query method available for running SQL statements. Then one day,


    your application has to be ported at short notice to a PostgreSQL database; you


    need classes that are capable of dealing with PostgreSQL—fast! And you happen


    to know of a very solid open source library that offers just what you need. Unfor-


    tunately, instead of using a method called query, the library in question provides


    a method called execute for performing SQL statements. What can you do?


    Rewrite all your existing code to use execute instead of query?


    The answer is an **adapter class**, which uses the PostgreSQL class but provides


    an API that’s the same as your existing MySQL class. In other words, it maps


    the execute method to your query method.


    Taking a specific example along the same lines, the MySQL and MySQLResult


    classes we developed in Volume I, Chapter 3 obviously tie you to using a MySQL


    database. This won’t cause many issues if you’re happy with MySQL, but, should


    your application be required to run on a different database server, you may run


    into difficulties. PHP has two well known database abstraction libraries,


    PEAR::DB\[4\] and ADOdb\[5\], with another, PEAR::MDB\[6\] in progress; this may


    become a successor to PEAR::DB eventually.


    Let’s take PEAR::DB as the example. How can we adapt it (without modifying


    the source code, of course—a bad idea, unless you fancy supporting your own


    hybrid version of PEAR::DB) to make it usable with the code that’s currently


    geared to our MySQL class?


    I’ll assume here that you’ve used the PEAR::DB API before (and if you haven’t,


    see the section called “Further Reading”).


    We’re lucky in the way our MySQL class is implemented, as PEAR::DB also has a


    query method from which it returns a result object. Unfortunately, our


    MySQLResult class provides a fetch method, while, in PEAR::DB, the equivalent


    method is fetchRow. To deal with this, we need two adapter classes. The first


    wraps the main PEAR::DB class and provides a query method that “catches” the


    \[4\] http://pear.php.net/package/DB


    \[5\] http://php.weblogs.com/ADOdb


    \[6\] http://pear.php.net/package/MDB


    343


    The Adapter Pattern'
