  md: " $stampCollection = &new StampCollection();\n\n // Add the MockStamp to the\
    \ StampCollection\n\n $stampCollection->add($mockStamp);\n\n // Get a copy of\
    \ the stamp back\n\n $stampCopy = $stampCollection->fetch();\n\n // Compare the\
    \ names of the stamps\n\n $this->assertEqual($stampCopy->name, $mockStamp->name);\n\
    \n }\n\n}\n\nHere, we’re basically performing a “round trip” with an instance\
    \ of\n\nStampCollection. We create a MockStamp object, using the add method to\
    \ add\n\nit to the StampCollection; then, we get a copy back with the fetch method.\n\
    \nFinally, we use the assertEqual SimpleTest method to compare the values of\n\
    \nthe MockStamp and the copy we retrieved from StampCollection. What happens?\n\
    \nTake a look at Figure 6.9.\n\n**Figure 6.9. Forgery Doesn’t Pay**\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_327_0.png)\n\
    \nFailure! How could such a simple operation have gone wrong? Time to take a\n\
    \nclose look at our StampCollection class. Here’s the problem, in the add method:\n\
    \nfunction add($stamp)\n\n{\n\n $this->collection\\[\\] .= $stamp;\n\n}\n\nIt\
    \ looks like we’ve mistakenly used the string append operator (.=) to add the\n\
    \nstamp to the end of the array. We should have used the assignment operator (\\\
    =)\n\ninstead! This is a case where a serious logic bug slips through the cracks\
    \ of PHP’s\n\nerror checking without so much as a warning message, but, thanks\
    \ to SimpleTest,\n\nthe bug could be found and fixed. What’s more, we now have\
    \ test scripts in place\n\n309\n\nMock Objects"
