  md: "Cache\\_Lite, and ties in with database abstraction libraries such as PEAR::DB\\\
    [7\\].\n\nIt also offers advanced features such as caching to shared memory, as\
    \ an altern-\n\native to the file system, or, with help from the Msession PHP\
    \ extension\\[8\\], storing\n\ncache data in load balanced sessions, which is\
    \ particularly useful for load balanced\n\nWeb servers. Further PEAR::Cache reading\
    \ material is recommended for at the\n\nend of this chapter. Cache\\_Lite, however,\
    \ offers more than enough functionality\n\nto meet the requirements of the majority\
    \ of sites.\n\n**How do I control client side caching with**\n\n**PHP?**\n\nHaving\
    \ seen how to disable client side caching and deal with server side caching,\n\
    \nit’s time to look at a mechanism that allows us to take advantage of client\
    \ side\n\ncaches in a way that can be controlled from within a PHP script. This\
    \ approach\n\nwill *only* work if you are running PHP with an Apache Web server,\
    \ because it\n\nrequires use of the function getallheaders to fetch the HTTP headers\
    \ sent by\n\na Web browser. This function only works with Apache.\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_280_0.png)\n\
    \n**New Function Names**\n\nIf you’re using PHP version 4.3.0+ on Apache, HTTP\
    \ headers are available\n\nwith \n\nthe \n\nfunctions \n\napache\\_request\\_headers\\\
    [9\\] \n\nand\n\napache\\_response\\_headers\\[10\\]. The function getallheaders\
    \ has be-\n\ncome an alias for the new apache\\_request\\_headers function.\n\n\
    The mechanism for dealing with Web browser caches is again HTTP. A number\n\n\
    of headers are involved in instructing Web browsers and proxy servers whether\n\
    \nto cache a page; the situation is further complicated by the fact that some\
    \ are\n\nonly available with HTTP 1.1.\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_280_1.png)\n\
    \n**Examine HTTP Headers in your Browser**\n\nA simple but very handy tool for\
    \ examining request and response headers is\n\nLiveHttpHeaders\\[11\\], which\
    \ is an add-on to the Mozilla browser. It’s worth\n\nknowing exactly what headers\
    \ your script is sending, particularly when you’re\n\ndealing with HTTP cache\
    \ headers.\n\n\\[7\\] http://pear.php.net/package/DB\n\n\\[8\\] http://www.php.net/msession\n\
    \n\\[9\\] http://www.php.net/apache\\_request\\_headers\n\n\\[10\\] http://www.php.net/apache\\\
    _response\\_headers\n\n\\[11\\] http://livehttpheaders.mozdev.org/\n\nChapter\
    \ 5: Caching\n\n262"
