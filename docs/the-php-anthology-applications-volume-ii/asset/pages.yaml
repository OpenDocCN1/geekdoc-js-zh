  md: '![](img/a381b8313756f8d5eb75f79b6057b90e_191_0.png)


    **The Origin is at the Bottom Left**


    The position x = 0, y = 0 is at the bottom left side of the page. Make sure


    you remember that—it can be confusing, as we read from top to bottom.


    Next, we create an object and store it in a variable, $headfoot. Objects created


    by the openObject method are used to create elements that will repeat throughout


    the document. On calling the openObject method, the class stops adding content


    to the main document, and adds content to the object instead. Here, we’ve created


    an object that will display the SitePoint logo at the top right of the page, as
    well


    as a horizontal line at the top and bottom of each page. The class will continue


    to add to the object until we call the closeObject method, at which point it re-


    turns to work on the main document.


    File: **1.php**** (excerpt)**


    // Set up header and footer as a recurring object


    $headfoot = $pdf->openObject(); // Create object


    $pdf->saveState(); // Save document state


    $pdf->addJpegFromFile(''sitepoint\_logo.jpg'', 430, 813, 70, 20);


    $pdf->setStrokeColor(0, 0.2, 0.4); // set line color


    $pdf->setLineStyle(2, ''round''); // set line style


    $pdf->line(155.28, 811.89, 505.28, 811.89); // Add top line


    $pdf->line(155.28, 30, 505.28, 30); // Add bottom line


    $pdf->restoreState(); // Restore document state


    $pdf->closeObject(); // Close the object


    Note that I’ve used the saveState method to allow me to make temporary


    changes to colors, fonts and so on. When I’m done, the restoreState method


    lets me return to the original style values automatically.


    Next I’ll create another object which is a link which will appear on the bottom


    right of every even page, showing where the original HTML version can be found.


    Once created, I’ll add both objects to the document with the addObject method.


    File: **1.php**** (excerpt)**


    // Set up bottom link object


    $bottomUrl = $pdf->openObject(); // Create object


    $pdf->saveState(); // Save document state


    $pdf->selectFont(''rospdf/fonts/Helvetica.afm''); // Select font


    $pdf->addText(155.28, 24, 6, ''Found at: '' . $articleUrl);


    $pdf->restoreState(); // Restore document state


    $pdf->closeObject(); // Close the object


    // Add the $headfoot object to every page (all,odd or even)


