  md: 'application. In addition to basic logging functionality, some of the advanced


    features that phpOpenTracker offers are:


    K logging for multiple sites


    K reports are generated as images (with JpGraph\[5\])


    K click path analysis reports (requires Graphviz\[6\] to generate the click path


    diagrams)


    K automatic exit link generation (no need to modify your HTML)


    K tracking the number of users online at a given instant


    K incoming search phrases from search engines


    As it has a solid object oriented design, it’s possible to utilize phpOpenTracker


    in many ways without having to alter radically your site’s code. We’ll focus here


    on the basics of phpOpenTracker to get you started; covering all the advanced


    features are beyond the scope of this book, but I hope you’ve already got the


    (accurate) impression that phpOpenTracker is a very mature package, and one


    of the best you could build your Web traffic logging around.


    **Installing phpOpenTracker**


    The version of phpOpenTracker used here was 1.0.2.


    To install phpOpenTracker, you can use the PEAR package manager (see Ap-


    pendix D), which, assuming you have the PEAR directory in your include path,


    will make phpOpenTracker available to any script on your server. You can also


    install phpOpenTracker manually without too much trouble. The main script,


    phpOpenTracker.php, includes some further files, which it expects will reside,


    by default, in a directory named phpOpenTracker that’s placed in some other


    directory on the include path (typically, the PEAR directory). You can get around


    this in your code by defining the following constant:


    define(''POT\_INCLUDE\_PATH'', ''/home/username/lib/phpOpenTracker/'');


    \[5\] http://www.aditus.nu/jpgraph/


    \[6\] http://www.research.att.com/sw/tools/graphviz/


    Chapter 4: Stats and Tracking


    228'
