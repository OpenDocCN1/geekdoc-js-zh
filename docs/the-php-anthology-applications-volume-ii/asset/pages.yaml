  md: " \\*/\n\n/\\*\\*\n\n \\* Randomizer Class\n\n \\*\n\n \\* Given an array this\
    \ class allows you fetch random\n\n \\* elements from it.\n\n \\*\n\n \\* <code>\n\
    \n \\* $randomizer = new Randomizer($array);\n\n \\* $randomElement = $randomizer->get();\n\
    \n \\* </code>\n\n \\*\n\n \\* @author Joe Bloggs <joe.bloggs@example.com>\n\n\
    \ \\* @access public\n\n \\* @package MyFirstDocumentedPackage\n\n \\*/\n\nclass\
    \ Randomizer {\n\n}\n\n?>\n\nSections of comments are called **DocBlocks**, and\
    \ are identified with a special\n\nform of the /\\* \\*/ PHP comment syntax:\n\
    \n/\\*\\*\n\n \\* DocBlock comment here\n\n \\*/\n\nEach DocBlock is used to describe\
    \ one element of the code within the file (or the\n\nfile itself), such as a class\
    \ member variable or method. Procedural PHP functions,\n\nthe family of include\
    \ functions, constants, and global variables can also be docu-\n\nmented by phpDocumentor.\n\
    \nFirst of all, every PHP source file needs to start with a DocBlock that contains\n\
    \nan @package comment to identify which **package** the file (but not the classes\n\
    \nwithin the file, only the functions, includes and defines) belongs to. In the\
    \ above\n\nexample, the file belongs to the MyFirstDocumentedPackage package.\
    \ A package\n\nis no more than a collection of related classes, and the concept\
    \ of a package is\n\nvirtual in PHP (i.e. PHP doesn’t support packages as a language\
    \ construct). The\n\nidea of grouping classes this way is inspired by Java; you\
    \ might use it, for example,\n\nto group your database abstraction layer under\
