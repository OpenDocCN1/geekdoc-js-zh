    **How do I generate an RSS document**


    **with PHP and DOM?**


    XML documents can easily be generated in much the same way as HTML docu-


    ments; it’s simply a matter of writing strings:


    File: **7.php**


    <?php


    $date = date(''h:ia l jS M Y'');


    $xml=<<<EOD


    <?xml version="1.0"?>


    <example>


    <date>$date</date>


    </example>


    EOD;


    echo $xml;


    ?>


    Viewed in an XML-aware browser like Internet Explorer or Mozilla, this code


    displays a pleasantly rendered XML document, as shown in Figure 2.5.


    **Figure 2.5. XML Time**


    ![](img/a381b8313756f8d5eb75f79b6057b90e_129_0.png)


