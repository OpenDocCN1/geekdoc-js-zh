    \n// Instantiate Cache\\_Lite\\_Output\n\n$cache = new Cache\\_Lite\\_Output($options);\n\
    \nFor each chunk that we want to cache, we need to set a lifetime (in seconds)\
    \ for\n\nwhich the cache should live before it’s refreshed. Next, we use the start\
    \ method,\n\navailable only in the Cache\\_Lite\\_Output class, to turn on output\
    \ buffering. The\n\ntwo arguments passed to the start method are an identifying\
    \ value for this par-\n\nticular cache file, and a **cache group**. This is an\
    \ identifier that allows a collection\n\nof cache files to be acted upon; it’s\
    \ possible to delete all cache files in a given\n\ngroup, for example (more on\
    \ this in a moment). Once the output for this chunk\n\nhas finished, we use the\
    \ end method to stop buffering and store the content as\n\na file.\n\nFile: **4.php****\
    \ (excerpt)**\n\n// Set lifetime for this \"chunk\"\n\n$cache->setLifeTime(604800);\n\
    \n// Start the cache with an id and group for this chunk\n\nif (!$cache->start('header',\
    \ 'Static')) {\n\n ?>\n\n <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\
    \n\n \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n\n <html xmlns=\"\
    http://www.w3.org/1999/xhtml\">\n\n <head>\n\n <title> PEAR::Cache\\_Lite example\
    \ </title>\n\n <meta http-equiv=\"Content-Type\"\n\n content=\"text/html; charset=iso-8859-1\"\
    \ />\n\n </head>\n\n <body>\n\n255\n\nHow do I implement a simple server side\
    \ caching system?"
