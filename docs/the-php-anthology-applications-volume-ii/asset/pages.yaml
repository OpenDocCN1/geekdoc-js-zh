  md: "$myVar = \"Hello World\";\n\n$ip\\_address = \"127.0.0.1\";\n\nBeing able to\
    \ decode this information with PHP will become important in the\n\nnext solution.\n\
    \n**How do I track who is online?**\n\nYou may have seen applications such as\
    \ vBulletin and phpBB, which let visitors\n\nsee how many users are online (and\
    \ sometimes, *which* users are online) at a given\n\nmoment. Now that we have\
    \ an authentication system, and a custom session\n\nhandler that stores sessions\
    \ in MySQL, implementing “Who is Online?” function-\n\nality is a breeze (well,\
    \ almost)!\n\nThe first thing we need is (you guessed it!) a class that we can\
    \ use to read and\n\ninterpret stored session data from MySQL.\n\nThe constructor\
    \ for the class simply initializes an array. This is used as a “first\n\nin first\
    \ out” (FIFO) queue to which raw session data is added, and from which\n\nobjects\
    \ are returned along with properties that correspond to the variables stored\n\
    \nin a given session.\n\nFile: **Session/SessionAnalyzer.php**** (in ****SPLIB****)\
    \ (excerpt)**\n\n/\\*\\*\n\n \\* Session Analyzer\n\n \\* Examines serialized\
    \ session data (as it appears on the file\n\n \\* system or in a database) and\
    \ builds objects into which it\n\n \\* places the data stored in the session\n\
    \n \\* <code>\n\n \\* $sa = new SessionAnalyzer();\n\n \\* $sa->addSession($some\\\
    _serialized\\_session\\_data);\n\n \\* $sessionStore = $sa->fetch();\n\n \\* </code>\n\
    \n \\* @package SPLIB\n\n \\* @access public\n\n \\*/\n\nclass SessionAnalyzer\
    \ {\n\n /\\*\\*\n\n \\* A list of sessions, their data held in SessionStore objects\n\
    \n \\* @var array\n\n \\*/\n\n var $sessions;\n\n /\\*\\*\n\n73\n\nHow do I track\
    \ who is online?"
