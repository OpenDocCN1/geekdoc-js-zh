  md: "Further down, we instantiate the Cache\\_Lite\\_Function class with some options:\n\
    \nFile: **5.php**** (excerpt)**\n\n// Define options for Cache\\_Lite\\_Function\n\
    \n// NOTE: fileNameProtection = TRUE!\n\n$options = array(\n\n 'cacheDir' => './cache/',\n\
    \n 'fileNameProtection' => TRUE,\n\n 'writeControl' => TRUE,\n\n 'readControl'\
    \ => TRUE,\n\n 'readControlType' => 'strlen',\n\n 'defaultGroup' => 'SOAP'\n\n\
    );\n\n// Instantiate Cache\\_Lite\\_Function\n\n$cache = new Cache\\_Lite\\_Function($options);\n\
    \nIt’s important that the fileNameProtection option is set to TRUE (this is in\
    \ fact\n\nthe default value, but in this case I’ve set it manually to emphasize\
    \ the point).\n\nIf it were set to FALSE, the filename will be invalid, so the\
    \ data will not be cached.\n\nHere’s how we make the calls to our SOAP client\
    \ class:\n\nFile: **5.php**** (excerpt)**\n\n $countries = $cache->call('stationInfo->listCountries');\n\
    \nAnd:\n\nFile: **5.php**** (excerpt)**\n\n $country = $cache->call('stationInfo->searchByCountry',\n\
    \n $\\_GET\\['country'\\]);\n\nIf the request is being made for the first time,\
    \ Cache\\_Lite\\_Function stores the\n\nresults as serialized arrays in cache\
    \ files (not that you need to worry about this),\n\nand this file is used for\
    \ future requests until it expires. The setLifeTime method\n\ncan again be used\
    \ to specify how long the cache files should survive before they’re\n\nrefreshed;\
    \ right now, the default value of 3,600 seconds (one hour) is being used.\n\n\
    In general Cache\\_Lite provides a solid, easy-to-implement library for solving\n\
    \ncaching issues. As we move to the “next level” of caching, for sites with particularly\n\
    \nhigh traffic, it’s worth examining PEAR::Cache\\[6\\], Cache\\_Lite’s big brother.\n\
    \nPEAR::Cache is a complete caching framework that offers greater flexibility\
    \ than\n\n\\[6\\] http://pear.php.net/package/CACHE\n\n261\n\nCaching Function\
    \ Calls"
