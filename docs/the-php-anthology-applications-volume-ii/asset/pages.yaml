  md: " \\* SessionAnalyzer constructor\n\n \\* @param object instance of database\
    \ connection\n\n \\* @access public\n\n \\*/\n\n function SessionAnalyzer()\n\n\
    \ {\n\n $this->sessions = array();\n\n }\n\nThe addSession method is used to put\
    \ raw session data in the queue. It calls the\n\nprivate parseSession method,\
    \ which is where the analysis of the raw session\n\ndata actually occurs. The\
    \ fetchSessions method allows us to get objects back\n\nfrom the queue, the properties\
    \ of the object being the variables stored in the raw\n\nsession data. Note that\
    \ the objects returned are *not* related to the Session class\n\nwe worked with\
    \ earlier in this chapter. They are simply data containers—objects\n\nof class\
    \ SessionStore (below)—and have no methods.\n\nFile: **Session/SessionAnalyzer.php****\
    \ (in ****SPLIB****) (excerpt)**\n\n /\\*\\*\n\n \\* Gathers the sessions into\
    \ a local array for analysis\n\n \\* @param string raw serialized session data\
    \ to parse\n\n \\* @return void\n\n \\* @access public\n\n \\*/\n\n function addSession($rawData)\n\
    \n {\n\n $this->sessions\\[\\] = $this->parseSession($rawData);\n\n }\n\n /\\\
    *\\*\n\n \\* Iteraters over the SessionStore array\n\n \\* @return SessionStore\n\
    \n \\* @access public\n\n \\*/\n\n function fetch()\n\n {\n\n $session = each($this->sessions);\n\
    \n if ($session) {\n\n return $session\\['value'\\];\n\n } else {\n\n reset($this->sessions);\n\
    \n return FALSE;\n\n }\n\n }\n\nChapter 1: Access Control\n\n74"
