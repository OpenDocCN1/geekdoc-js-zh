- img_proc: true
  md: 'You can even register a single observer with multiple observables, so that
    it reacts


    to events from any of them!


    A hybrid form of the observer pattern is commonly used when parsing XML


    documents with SAX. Rather than a single update method, the observer classes


    have multiple methods, such as startElementHandler and endElementHandler,


    which are called on the basis of their context within the XML document.


    PEAR::Log\[7\] also uses a form of observer pattern to allow the triggering of
    events


    on log updates.


    It’s likely that the observer pattern will become more widely used in PHP applic-


    ations. Much like Java, PHP 5 provides **interface classes**, which can be **imple-**


    **mented** by a class that already has a parent it extends. This allows the observable


    and observer APIs to be implemented without disturbing an existing class hier-


    archy.


    **Further Reading**


    K* Applied OO PHP*: http://www.horde.org/papers/kongress2002-design\_patterns/


    This paper reports a presentation from the 2002 International PHP Confer-


    ence, discussing the design of APIs and design patterns related to PHP.


    K* Design Patterns in the Real World*:


    http://www.phpconference.com/downloader/downloader.php?CatID=0&NewsID=367


    This presentation from the 2003 International PHP Conference (Spring Edi-


    tion) provided an introduction to design patterns. From this URL you can


    download the slides from the presentation.


    K* PHP Iterator*: http://www.phpbuilder.com/columns/bosanac20030225.php3


    This tutorial looks at a fairly complex iterator that’s demonstrated iterating


    over a collection of objects.


    K* Quick Start Guide to PEAR::DB*: http://vulcanonet.com/soft/?pack=pear\_tut


    This article explains the use of PEAR’s primary database abstraction library.


    \[7\] http://pear.php.net/package/Log


    353


    Further Reading'
