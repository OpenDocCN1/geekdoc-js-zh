  md: "while the observer pattern found in Chapter 7 could be used to “watch” the\
    \ Auth\n\nclass for the number of failed attempts.\n\nYou may want to tie the\
    \ logging to some kind of alert mechanism that will warn\n\nyou if someone attacks\
    \ your site, giving you the chance to respond immediately.\n\nIn critical environments,\
    \ consider using an SMS gateway as your alerting system\n\nso that you’ll receive\
    \ notification even when you’re not online.\n\n**How do I build a user registration**\n\
    \n**system?**\n\nHaving an authentication system is fine, but how do you fill\
    \ it with users in the\n\nfirst place? If only yourself and a few friends will\
    \ access your site, you can probably\n\ncreate accounts for all users through\
    \ your database administration interface.\n\nHowever, for a site that’s intended\
    \ to become a flourishing community to which\n\nanyone and everyone is free to\
    \ sign up, you’ll want to automate this process.\n\nYou’ll want to allow visitors\
    \ to register themselves, but you’ll probably still need\n\nsome level of “screening”\
    \ so that you have at least a little information about the\n\npeople who have\
    \ signed up (such as a way to confirm their identity). A common\n\nand effective\
    \ screening approach is to have the registrants confirm their email\n\naddress.\n\
    \nThe purpose of the screening mechanism is to give you the ability to make it\n\
    \ndifficult for users who have “broken the rules” and lost their account privileges\n\
    \nto create new accounts. You have (at least one of) their email addresses—if\
    \ they\n\ntry to register again using that address, you can deny them access.\
    \ Be warned,\n\nthough; a new type of Internet service is becoming popular. Pioneered\
    \ by Mailin-\n\nator\\[5\\], these services provide users with temporary email\
    \ addresses they can use\n\nfor registrations.\n\nHere, we’ll put together a registration\
    \ system that validates new registrants using\n\ntheir email addresses; they’ll\
    \ receive an email that asks them to confirm their re-\n\ngistration via a URL.\n\
    \n**More Classes!**\n\nA registration system is yet another great opportunity\
