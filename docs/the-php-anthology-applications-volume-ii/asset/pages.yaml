  md: 'The parameters we specify to the phpOpenTracker::get method depend on the


    value of the first array element, api\_call. The parameters include range, as
    seen


    in the example above, which is used to specify a time range (e.g. the current


    month). constraints is itself an array in which you can specify the criteria by


    which the report should be built, such as page or browser. result\_format allows


    you to specify how the data should be output, such as XML, CSV, or GraphViz.


    An additional method, phpOpenTracker::plot is used to generate charts with


    jpGraph.


    Usually, the report API will give you most of the tools you need, but in rare
    cases


    you may have to build your own SQL queries in order to get precisely what you


    want. Make sure you examine the documentation that explains the relationships


    between the tables phpOpenTracker uses.


