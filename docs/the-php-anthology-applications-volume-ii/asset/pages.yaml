    **Xdebug**


    Where Xdebug is particularly useful is in examining applications that are near


    completion. The documentation explains the available reports it can generate,


    which can give an excellent overview of where the main bottlenecks lie, and help


    you focus your effort on specific functions and routines. It also encourages you


    to take a more systematic approach to optimizing your application, rather than


    using educated guesses in an *ad hoc* manner.


    You can also log Xdebug data to a file, which will allow you to gather profile
    in-


    formation while your application is online. Sometimes, problems won’t show up


    until you’re running in a live environment; the impact to a database table which


    now contains many megabytes of data, for example, might make itself clear only


    once your application’s live and online.


    **How do I structure my application into**


    **layers?**


    The term **N-Tier** may or may not be familiar to you, but it’s definitely a concept


    that’s worth being aware of, as it makes a very useful measure of the design of


    your application. The “N” means “some number of”, while “tier” refers to the


    layers in your application being like tiers on a wedding cake.


    Let’s step back into the past for a moment. In the old days of client-server com-


    puting on corporate networks, applications shared by multiple users were generally


    built with two tiers: a central database or file server, and a desktop application


    that accessed the central resource. This worked well for small groups of users,


    but as applications were distributed across regional and international networks


    and user bases grew, all sorts of problems ensued. The database might be over-


    loaded, client side upgrades and maintenance became more expensive, and network


