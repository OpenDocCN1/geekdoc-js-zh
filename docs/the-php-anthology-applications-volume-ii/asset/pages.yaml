    \n}\n\nrequire\\_once SIMPLE\\_TEST . 'unit\\_tester.php';\n\nrequire\\_once SIMPLE\\\
    _TEST . 'mock\\_objects.php';\n\nrequire\\_once SIMPLE\\_TEST . 'reporter.php';\n\
    \nrequire\\_once '8.php';\n\n// Create a MockStamp\n\nMock::generate('Stamp');\n\
    \nUsing the Mock::generate method, the mock object class is generated as above,\n\
