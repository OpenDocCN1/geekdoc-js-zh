- img_proc: true
  md: 'This essentially guarantees that no Web browser or intervening proxy server
    will


    cache the page, so visitors will always receive the latest content. In fact, the
    first


    header should accomplish this on its own; this is the best way to ensure a page


    is not cached. The Cache-Control and Pragma headers are added for “insurance”


    purposes. Though they don’t work on all browsers or proxies, they will catch


    some cases in which the Expires header doesn’t work as intended (e.g. if the


    client computer’s date is set incorrectly).


    Of course, to disallow caching entirely introduces the problems we discussed at


    the start of this chapter. We’ll look at the solution to these issues in just
    a mo-


    ment.


    **Internet Explorer and File Download Caching**


    Our discussion of PDF rendering in Chapter 3 explained that issues can arise when
    you’re


    dealing with caching and file downloads. In serving a file download via a PHP
    script that


    uses headers such as Content-Disposition: attachment, filename=myFile.pdf


    or Content-Disposition: inline, filename=myFile.pdf, you’ll have problems


    with Internet Explorer if you tell the browser not to cache the page.


    Internet Explorer handles downloads in a rather unusual manner, making two requests
    to


    the Website. The first request downloads the file, and stores it in the cache
    before making


    a second request (without storing the response). This request invokes the process
    of deliv-


    ering the file to the end user in accordance with the file’s type (e.g. it starts
    Acrobat


    Reader if the file is a PDF document). This means that, if you send the cache
    headers that


    instruct the browser not to cache the page, Internet Explorer will delete the
    file between


    the first and second requests, with the result that the end user gets nothing.
    If the file


    you’re serving through the PHP script will not change, one solution is simply
    to disable


    the “don’t cache” headers for the download script.


    If the file download will change regularly (i.e. you want the browser to download
    an up-


    to-date version), you’ll need to use the last-modified header, discussed later
    in this


    chapter, and ensure that the time of modification remains the same across the
    two consec-


    utive requests. You should be able to do this without affecting users of browsers
    that


    handle downloads correctly. One final solution is to write the file to your Web
    server and


    simply provide a link to it, leaving it to the Web server to report the cache
    headers for


    you. Of course, this may not be a viable option if the file is supposed to be
    secured by the


    PHP script, which requires a valid session in order to provide users access to
    the file; with


    this solution, the written file can be downloaded directly.


    Chapter 5: Caching


    244'
