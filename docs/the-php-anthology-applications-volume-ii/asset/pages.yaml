  md: "With this trick, you could use XPath to implement a much simpler version of\n\
    \nthe DOM RSS feed parser we saw earlier in this chapter.\n\n**Dynamic Content\
    \ with XPath**\n\nNow that you have a basic grasp of how XPath can be used in\
    \ PHP, it’s time to\n\ndo something interesting with it. Let’s take the articles.xml\
    \ document we’ve\n\nalready used with XPath, and build it a database-like interface\
    \ that displays a list\n\nof articles in brief and a single article in detail,\
    \ depending on the link the visitor\n\nclicks. Before we can get started, we need\
    \ a couple of classes that represent the\n\narticles list, and an individual article,\
    \ respectively. These classes fetch data from\n\nthe articles.xml document.\n\n\
    First, let’s look at the class representing a list of articles. The constructor\
    \ performs\n\nan XPath query to fetch all the spt:article elements *as well as*\
    \ their children:\n\n//spt:article/descendant-or-self::\\*\n\nThis allows us to\
    \ use the spt:article to identify each new “row” in art-\n\nicles.xml, and at\
    \ the same time provides the child nodes, giving us access to\n\nthe content within\
    \ them. With this content, we can build a data structure that\n\nwe can begin\
    \ to use immediately. Each “row” is placed in a new instance of the\n\nArticle\
    \ class (which I’ll be looking at in detail in Chapter 3), then the object is\n\
    \nplaced inside the $articles member variable of the ArticlesXML class. If you\n\
    \ncompare this example with the work we did earlier to parse the RSS feed with\n\
    \nDOM, immediately it becomes clear how much easier XPath makes the extraction\n\
    \nof data from an XML document.\n\nFile: **ExampleApps/ArticlesXML.php**** (in\
    \ ****SPLIB****) (excerpt)**\n\n<?php\n\n/\\*\\*\n\n \\* Articles XML class\n\n\
    \ \\* Fetches data from articles.xml\n\n \\* @access public\n\n \\* @package SPLIB\n\
    \n \\*/\n\nclass ArticlesXML {\n\n /\\*\\*\n\n \\* An array of Article objects\n\
    \n \\* @access private\n\n \\* @var array\n\n \\*/\n\n var $articles;\n\nChapter\
    \ 2: XML\n\n128"
  merge: -1
  pgno: 146
- img_proc: true
  md: " /\\*\\*\n\n \\* ArticlesXML constructor\n\n \\* @param string the articles.xml\
    \ document\n\n \\* @access public\n\n \\*/\n\n function ArticlesXML($articlesDoc)\n\
    \n {\n\n $dom = domxml\\_open\\_mem($articlesDoc);\n\n $xpath = $dom->xpath\\\
    _init(); \n\n $ctx = $dom->xpath\\_new\\_context(); \n\n $ctx->xpath\\_register\\\
    _ns(\"spt\", \"http://www.sitepoint.com/\");\n\n $articles =\n\n &$ctx->xpath\\\
    _eval(\"//spt:article/descendant-or-self::\\*\");\n\n foreach ($articles->nodeset\
    \ as $node) {\n\n switch ($node->tagname) {\n\n case 'article':\n\n if (isset($article))\
    \ {\n\n $this->articles\\[\\] = new Article($article);\n\n }\n\n $article = array();\n\
    \n break;\n\n case 'body':\n\n $article\\['body'\\] = $dom->dump\\_node($node);\n\
    \n break;\n\n default:\n\n $article\\[$node->tagname\\] = $node->get\\_content();\n\
    \n break;\n\n }\n\n }\n\n if (isset($article)) {\n\n $this->articles\\[\\] = new\
    \ Article($article);\n\n }\n\n }\n\nIn the foreach loop above we used the tagname\
    \ property of the $node object to\n\nimplement some switching logic. If the node\
    \ is an article corresponding to a\n\nspt:article tag, we first check to see if\
    \ the variable $article exists (which it\n\nwon’t on the first iteration). If\
    \ it does exist, we pass it to a new instance of the\n\nclass Article, which is\
    \ basically just a data store that provides some methods\n\nfor formatting the\
    \ data, the constructed object being stored in the articles prop-\n\nerty. Once\
    \ any construction has been dealt with, the 'article' section of the\n\nswitch\
    \ re-initializes $article as an empty array.\n\n129\n\nDynamic Content with XPath"
  merge: -1
  pgno: 147
- img_proc: true
  md: "The spt:body is handled as a special case in the switch. Because the content\
    \ of\n\nthe spt:body will be a mix of text and XHTML, and because we want to preserve\n\
    \nthe XHTML, we need to use the dump\\_node method of PHP’s DomDocument class,\n\
    \nwhich converts a given node into an XML string. Strictly speaking, this method\n\
    \nis not part of the W3C DOM specification, but, as this example demonstrates,\n\
    \nlife would be much more difficult without it.\n\nThe final section of the switch\
    \ treats all the remaining child nodes of spt:article\n\nas equals. It stores\
    \ their contents in the $article array, to be placed in an\n\nArticle object the\
    \ next time a spt:article tag is encountered.\n\nAfter the switch, we add the\
    \ final article (if any were found) into the array, as\n\nit will not be caught\
    \ by the start of another spt:article tag.\n\nLet’s continue with the rest of\
    \ the ArticlesXML class. The fetch method is used\n\nto fetch single articles\
    \ from the internal array:\n\nFile: **ExampleApps/ArticlesXML.php**** (in ****SPLIB****)\
    \ (excerpt)**\n\n /\\*\\*\n\n \\* Returns an single ArticleXML object, iterating\
    \ of the\n\n \\* collection of articles\n\n \\* @return object\n\n \\* @access\
    \ public\n\n \\*/\n\n function fetch()\n\n {\n\n $article = each($this->articles);\n\
    \n if ($article) {\n\n return $article\\['value'\\];\n\n } else {\n\n reset($this->articles);\n\
    \n return FALSE;\n\n }\n\n }\n\nThe getArticleByID method allows us to fetch a\
    \ single article by specifying its\n\nunique ID, which was given by the spt:article\\\
    _id child of each spt:article\n\nelement in the XML input.\n\nFile: **ExampleApps/ArticlesXML.php****\
    \ (in ****SPLIB****) (excerpt)**\n\n /\\*\\*\n\n \\* Returns an Article object\
    \ by its article\\_id value\n\n \\* @param int ID of article\n\n \\* @return object\n\
    \nChapter 2: XML\n\n130"
  merge: -1
  pgno: 148
- img_proc: true
  md: " \\* @access public\n\n \\*/\n\n function getArticleById($id)\n\n {\n\n foreach\
    \ ($this->articles as $article) {\n\n if ($article->id() == $id) {\n\n return\
    \ $article;\n\n }\n\n }\n\n return FALSE;\n\n }\n\n}\n\nNow that we’ve defined\
    \ ArticlesXML, here’s how it can be used:\n\nFile: **13.php**** (excerpt)**\n\n\
    <?php\n\n// Include classes for accessing data from articles.xml\n\nrequire\\\
    _once 'ExampleApps/ArticlesXML.php';\n\nrequire\\_once 'ExampleApps/Article.php';\n\
    \n// Get the contents of articles.xml\n\n$articlesDoc = file('articles.xml');\n\
    \n$articlesDoc = implode('', $articlesDoc);\n\n// Instantiate the Articles class\n\
    \n$articles = new ArticlesXML($articlesDoc);\n\n// Begin constructing a table\n\
    \n$table = \"<table>\\\\n\";\n\n// If visitor is viewing a single article...\n\
    \nif (isset($\\_GET\\['id'\\])) {\n\n // Get the article by its id\n\n if ($article\
    \ = $articles->getArticleById($\\_GET\\['id'\\])) {\n\n // Build the body of the\
    \ table\n\n $table .= \"<tr>\\\\n<td class=\\\\\"title\\\\\">\" . $article->title()\
    \ .\n\n \"</td>\\\\n</tr>\\\\n\";\n\n $table .= \"<tr>\\\\n<td class=\\\\\"author\\\
    \\\">by \" .\n\n $article->author() . \"</td>\\\\n</tr>\\\\n\";\n\n $table .=\
    \ \"<tr>\\\\n<td>\" . $article->body() . \"</td>\\\\n</tr>\\\\n\";\n\n }\n\n131\n\
    \nDynamic Content with XPath"
  merge: -1
  pgno: 149
- img_proc: true
  md: "The if statement uses the $\\_GET\\['id'\\] variable to decide whether the\
    \ visitor is\n\nlooking at a single article or should see the full list of articles.\n\
    \nThe following code builds a table for the list of articles. Again, by separating\
    \ the\n\ndata structure we extracted from the XML document from the HTML that’s\
    \ used\n\nto display the data, we can build whatever output we like, while keeping\
    \ the class\n\nitself reusable.\n\nFile: **13.php**** (excerpt)**\n\n// Build\
    \ a list of articles\n\n} else {\n\n $table .= \"<tr>\\\\n<th>Title</th><th>Author</th>\\\
    \\n</tr>\\\\n\";\n\n // Loop through the articles and build into table body\n\n\
    \ while ($article = $articles->fetch()) {\n\n $table .= \"<tr>\\\\n\";\n\n $table\
