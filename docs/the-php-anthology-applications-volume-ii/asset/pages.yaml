  md: "**How do I get reports on my site’s**\n\n**statistics?**\n\nWhat good are all\
    \ the stats if you can’t view them in a useful report? Again,\n\nphpOpenTracker\
    \ makes mining your Web statistics easy; it provides the get\n\nmethod to simplify\
    \ the process of getting the information you need. Provided\n\nwith phpOpenTracker\
    \ is an example that’s useful as a general, simple report much\n\nlike that provided\
    \ by Webalizer, and as a reference for setting up your own reports.\n\nBuilding\
    \ reports can be a little tricky to begin with. In conjunction with other\n\n\
    packages, phpOpenTracker offers a range of features. These include visual click\n\
    \npath analysis, with help from PEAR::Image\\_GraphViz\\[13\\] and the GraphViz\n\
    \nsoftware; XML tree generation, with the aid of PEAR::XML\\_Tree\\[14\\]; and\
    \ chart\n\ngeneration with the assistance of jpGraph, which we examined in Volume\
    \ I,\n\nChapter 7. Providing an in-depth discussion is beyond the scope of this\
    \ book\n\n(and could even become a book in itself, when you consider the statistical\
    \ manip-\n\nulation involved in the creation of detailed reports). Here, I’ll\
    \ give a rough guide\n\nto the reporting API so you know your way around.\n\n\
    All requests to the phpOpenTracker report API are made via the\n\nphpOpenTracker::get\
    \ method; this accepts an array which itself specifies further\n\nmethod calls.\
    \ The generalized form of this array is:\n\narray(\n\n 'api\\_call' => 'method\\\
    _name',\n\n '1st\\_param\\_name' => 'value',\n\n '2nd\\_param\\_name' => 'value',\n\
    \n /\\* etc. \\*/\n\n);\n\nIt’s worth delving into the phpOpenTracker documentation\
    \ to spend some time\n\nexperimenting with what’s on offer. Here are a couple\
    \ of simple examples.\n\nAn easy task is to find out how many visitors are currently\
    \ online:\n\nFile: **8.php**\n\n<?php\n\n// Include phpOpenTracker\n\nrequire\\\
    _once 'phpopentracker.php';\n\n\\[13\\] http://pear.php.net/Image\\_GraphViz\n\
    \n\\[14\\] http://pear.php.net/XML\\_Tree\n\nChapter 4: Stats and Tracking\n\n\
    238"
