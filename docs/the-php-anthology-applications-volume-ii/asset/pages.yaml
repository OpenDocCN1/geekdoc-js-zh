  md: "**How do I track exit links?**\n\nIt’s fine to know where visitors are coming\
    \ from, courtesy of the HTTP\\_REFERER\n\nvalue Apache makes available to PHP,\
    \ but what about where they go when they\n\n*leave* your site? Such information\
    \ can be valuable in building “networks” with\n\nother sites to which you’re providing\
    \ traffic.\n\nThe solution to this problem is to use a script through which all\
    \ external links\n\nare passed. For example, a link to http://www.sitepoint.com/\
    \ might use a URL\n\nlike this:\n\nhttp://www.mydomain.com/exit.php?url=http://www.sitepoint.com/\n\
    \nThe script exit.php first logs the URL of the link to which the visitor is being\n\
    \nsent, then sends an HTTP location header to forward them to the new site, in\n\
    \nthis case http://www.sitepoint.com/.\n\nAmong the example scripts provided with\
    \ phpOpenTracker, the following\n\n(exit.php) demonstrates how this works:\n\n\
    File: **6.php**\n\n<?php\n\n// Include the phpOpenTracker code\n\nrequire\\_once\
    \ 'phpOpenTracker.php';\n\n// The link for forward to is passed using the GET\
    \ variable \"url\"\n\nif (isset($\\_GET\\['url'\\])) {\n\n // Convert HTML entities\
    \ back to URI entities\n\n $exitURL = str\\_replace('&amp;', '&',\n\n base64\\\
    _decode($\\_GET\\['url'\\]));\n\n // Set up the config, database and container\
    \ objects\n\n $config = &phpOpenTracker\\_Config::singleton();\n\n $db = &phpOpenTracker\\\
    _DB::singleton();\n\n $container = &phpOpenTracker\\_Container::singleton(\n\n\
    \ array(\n\n 'initNoSetup' => true\n\n )\n\n );\n\n // Perform the query which\
    \ logs the exit URL\n\n $db->query(\n\n sprintf(\n\n 'UPDATE %s\n\nChapter 4:\
    \ Stats and Tracking\n\n234"
