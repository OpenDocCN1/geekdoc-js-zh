  md: "// Fetch new XPathContext object\n\n$ctx = $dom->xpath\\_new\\_context();\n\
    \n// Register the SitePoint namespace\n\n$ctx->xpath\\_register\\_ns(\"spt\",\
    \ \"http://www.sitepoint.com/\");\n\n// Fetch all link targets\n\n$links = &$ctx->xpath\\\
    _eval(\"//a/@href\");\n\n// Display the links\n\necho '<b>Document contains the\
    \ following links</b><br />';\n\nforeach ($links->nodeset as $link) {\n\n echo\
    \ '- ' . $link->value . '<br />';\n\n}\n\n?>\n\n**A Note on Default Namespaces**\n\
    \nThe XPath 1.0 specification\\[35\\] does not provide a mechanism to single out\
    \ tags\n\nin the **default namespace** specified by the root element. PHP offers\
    \ a work-\n\naround, however.\n\nConsider this very simple RSS feed:\n\n<?xml\
    \ version=\"1.0\"?>\n\n<rdf:RDF\n\n xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\"\
    \n\n**xmlns=\"http://purl.org/rss/1.0/\"**\\>\n\n</rdf:RDF>\n\nHere, the default\
    \ namespace is http://purl.org/rss/1.0/. If I wanted to per-\n\nform an XPath\
    \ query for elements in that default namespace (i.e. tags with no\n\nrdf: prefix),\
    \ I’d need to declare a “dummy” prefix for this namespace. Here’s\n\nhow to do\
    \ it in the case of an RSS feed:\n\n// Register the dummy namespace\n\n$ctx->xpath\\\
    _register\\_ns(\"prl\", \"http://purl.org/rss/1.0/\"); \n\n// Fetch the titles\
    \ using that dummy namespace\n\n$titles = &$ctx->xpath\\_eval(\"//prl:item/prl:title/text()\"\
    );\n\n\\[35\\] http://www.w3.org/TR/1999/REC-xpath-19991116\n\n127\n\nA Note on\
    \ Default Namespaces"
