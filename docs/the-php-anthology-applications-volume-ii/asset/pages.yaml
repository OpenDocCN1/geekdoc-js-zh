  md: '4.3, the DOM extension has undergone substantial improvements, but be


    warned—it complies only loosely with the official DOM specification and is


    missing true support for some important XML features, such as **namespaces**\[8\]


    and **XML Schema**\[9\]. With PHP 5, there are plans afoot to rework PHP’s XML


    tools, and they’re being discussed in the PHP XML development newsgroup\[10\].


    For now, the DOM extension is usable—but don’t expect miracles.


    It’s also worth being aware that all the XML functionality provided by PHP’s


    extensions could also be implemented using pure PHP. For example, the eZ xml


    library\[11\] that comes with eZ publish 3\[12\] is a more complete implementation


    of the DOM standard than that provided by the PHP 4.3 extension.


    PEAR::XML\_HTMLSax\[13\], meanwhile, provides a SAX API for parsing badly


    formed XML (such as HTML). Search around and you’ll find other classes, such


    as PHP.XPath\[14\], which is an implementation of the XPath specification\[15\]
    in


    pure PHP.


    ![](img/a381b8313756f8d5eb75f79b6057b90e_99_0.png)


    **XML and PHP Short Tags**


    When you’re dealing with XML—in particular, when you’re constructing


    XML as PHP strings—it’s a good idea to have short\_open\_tag set to Off


    in php.ini, or to use a .htaccess file with this command:


    php\_flag short\_open\_tag off


    Otherwise, PHP will confuse XML processing instructions (e.g. <?xml …


    ?>) with short form PHP script tags (<? … ?>), which can result in all sorts


    of parse errors. Of course, if you do this, you must ensure that all your PHP


    scripts use full tags (<?php … ?>).


    We’ll begin this chapter by understanding how we can parse documents with


    SAX and DOM and generate XML with DOM. We’ll then look at using XSLT


    with the Sablotron extension\[16\], and Web services in XML-RPC and SOAP.


    Note that a further set of useful XML utilities for PHP can be found at


    http://phpxmlclasses.sourceforge.net/.


    \[8\] http://www.w3.org/TR/REC-xml-names/


    \[9\] http://www.w3.org/XML/Schema


    \[10\] http://news.php.net/group.php?group=php.xml.dev


    \[11\] http://ez.no/developer/ez\_publish\_3/documentation/development/libraries/ez\_xml/


    \[12\] http://ez.no/products/ez\_publish\_3/


    \[13\] http://pear.php.net/XML\_HTMLSax


    \[14\] http://www.carrubbers.org/scripts/php/xpath/


    \[15\] http://www.w3.org/TR/xpath


    \[16\] http://www.php.net/xslt


    81


    SAX, DOM and PHP'
