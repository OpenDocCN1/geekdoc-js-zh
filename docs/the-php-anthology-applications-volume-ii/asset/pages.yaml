  md: "For example, let’s say we want to analyze a text document to ascertain how\
    \ many\n\nvowels and consonants it contains. We might parse the document, then\
    \ create\n\nobjects to represent the elements of the document in which we’re interested.\
    \ We\n\ncan then go back and analyze these objects to get the statistics we’re\
    \ interested\n\nin.\n\nTo start, let’s put together a class, TextStats, which\
    \ will parse documents using\n\na character by character approach, taking advantage\
    \ of PHP’s ability to treat\n\nstrings as arrays:\n\nFile: **1.php**** (excerpt)**\n\
    \n/\\*\\*\n\n \\* Class for Analyzing Text\n\n \\*/\n\nclass TextStats {\n\n /\\\
    *\\*\n\n \\* The document to analyze\n\n \\*/\n\n var $doc;\n\n /\\*\\*\n\n \\\
    * An array of Vowel and Consonant objects\n\n \\*/\n\n var $chars = array();\n\
    \n function TextStats($doc)\n\n {\n\n $this->doc = $doc;\n\n $this->buildStats();\n\
    \n }\n\n /\\*\\*\n\n \\* Calls a factory method to get a Vowel or Consonant\n\n\
    \ \\*/\n\n function buildStats()\n\n {\n\n $length = strlen($this->doc);\n\n for\
    \ ($i=0; $i<$length; $i++) {\n\n // Factory method called here\n\n if ($char =\
    \ **&CharFactory::getChar($this->doc\\[$i\\])**) {\n\n $this->chars\\[\\] = $char;\n\
    \n }\n\n }\n\n }\n\n315\n\nThe Factory Method"
