  md: " {\n\n if (!$specialChars) {\n\n return $this->someString;\n\n } else {\n\n\
    \ return htmlspecialchars($this->someString);\n\n }\n\n }\n\n}\n\n?>\n\nNotice\
    \ the comment lines that begin with the @ symbol? These describe the be-\n\nhavior\
    \ of the class, and are extracted by the **documentation parser** to generate\n\
    \nthe API documentation. For more detail, see “ How do I generate API document-\n\
    \nation? ”\n\nThe upshot is that, passed through the right documentation generation\
    \ tool, the\n\nabove classes can be used to generate documentation like that shown\
