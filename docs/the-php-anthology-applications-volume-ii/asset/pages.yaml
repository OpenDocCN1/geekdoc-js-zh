  md: "API documents automatically. This approach to generating API documentation\n\
    \nfrom source code comments was first introduced to the mainstream by Sun’s\n\n\
    launch of the Javadoc utility, which produces (now famous) API documentation\n\
    \nsuch as the Java API Reference\\[3\\]. Most PHP documentation generation tools\n\
    \nuse a similar approach to Javadoc (there’s even a modified version of Javadoc\
    \ for\n\nPHP, called PHPDoc\\[4\\]).\n\nLet’s look at a simple PHP example:\n\n\
    File: **6.php**\n\n<?php\n\n/\\*\\*\n\n \\* @abstract\n\n \\*/\n\nclass Something\
    \ {\n\n}\n\n/\\*\\*\n\n \\* This class does something.\n\n \\*/\n\nclass DoesSomething\
    \ extends Something {\n\n /\\*\\*\n\n \\* Stores some string\n\n \\* @access private\n\
    \n \\* @var string\n\n \\*/\n\n var $someString;\n\n /\\*\\*\n\n \\* Constructs\
    \ DoesSomething\n\n \\* @param string Some string\n\n \\*/\n\n function DoesSomething($someString)\n\
    \n {\n\n $this->someString = $someString;\n\n }\n\n /\\*\\*\n\n \\* Returns the\
    \ stored someString\n\n \\* @param boolean whether to format XML entities\n\n\
    \ \\* @return string\n\n \\* @access public\n\n \\*/\n\n function getSomeString($specialChars\
    \ = FALSE)\n\n\\[3\\] http://java.sun.com/j2se/1.4.2/docs/api/\n\n\\[4\\] http://www.callowayprints.com/phpdoc/\n\
    \nChapter 6: Development Technique\n\n284"
