    create


    a hole in your security, though. If you’re not checking for existing records in
    the


    user table, a user could sign up for a new account with details that matched an


    existing row in the user table. You’ll then end up changing the email address
    of


    an existing user to that of a new user, which will cause some embarrassing mo-


    ments at the very least.


    **How do I protect my site from auto sign**


    **ups?**


    I hope you’ll never suffer the misfortune of having someone try to put your site


    out of action, but when you expose your application to what is, after all, a global


    network, you need to be prepared for trouble. It’s difficult to prevent malicious


    attacks against your site and still offer genuine users an acceptable service—par-


    ticularly if a malicious user simply decides to flood your site with requests
    for


    pages.


    Where user registration systems are concerned, one common method of attack


    has been to create “robots” (typically Perl or PHP scripts), which act as Web


    browsers and use the forms you’ve built for your registration system to swamp


    your database with false sign ups. Although we’ve built a registration system
    that


    requires email confirmation of the account, the confirmation process can also
    be


    built into the “robot,” assuming it has access to the account to which the email


    confirmations are sent. Both Hotmail and Yahoo!, among many others, have


    been stung by this in the past.


