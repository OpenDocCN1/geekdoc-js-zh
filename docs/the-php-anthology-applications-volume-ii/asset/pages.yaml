  md: '**Appendix C: Security Checklist**


    Given that online PHP applications are exposed to essentially anyone and


    everyone, security should be one of, if not *the* top concern as you develop your


    applications. To some extent, the ease with which PHP applications can be de-


    veloped is also one of its greatest weaknesses, in that, for beginners who aren’t


    aware of the possible dangers, it’s very easy to deploy an application for which


    the line of security resembles swiss cheese.


    Make sure you’re informed, and, if in any doubt, ask. The Open Web Application


    Security Project (OWASP)\[1\] is a corporate-sponsored community focused on


    raising awareness of Web security, and is an excellent source of information on


    potential dangers. They recently published a “Top 10” list of common security


    flaws in Web applications, the relevant points of which I’ve summarized here.


    **The Top Security Vulnerabilities**


    K** Unvalidated data**


    Never trust anything you get from a Web browser. The browser is completely


    outside of your control, and it’s easy to fake values like the HTTP referrer.


    It’s also easy to fake a hidden field in a form.


    More importantly, when dealing with forms, for example, validate the data


    carefully. Use a “deny all, permit a little” policy. For example, if a registration


    form has a field for the user name, allow only alphabetical characters and


    perhaps the numbers 0–9, rather than simply rejecting particular special


    characters. Use regular expressions to limit data to exactly what you require.


    Packages like PEAR::QuickForm, as you saw in Volume I, Chapter 9, provide


    built-in mechanisms for validating forms and do a lot to help cover weaknesses


    you might otherwise neglect.


    Also, where things like include files are concerned, watch out for logic like


    this:


    include($\_GET\[''page''\]);


    Make sure you check the value of $\_GET\[''page''\] against a list of files your


    code is designed to include:


    \[1\] http://www.owasp.org/'
