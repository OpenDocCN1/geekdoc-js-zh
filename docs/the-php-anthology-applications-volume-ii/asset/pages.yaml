    \ that\n\ntranslates any string (such as a password) into a short series of ASCII\
    \ characters, called\n\nan MD5 digest. A particular string will always produce\
    \ the same digest, but it is practically\n\nimpossible to guess a string that\
    \ will produce a given digest. By storing only the MD5 digest\n\nof your users’\
    \ passwords in the database, you can verify their login credentials without\n\n\
    actually storing the passwords on your server! The built-in PHP function md5 lets\
    \ you\n\ncalculate the MD5 digest of any string in PHP.\n\nThe constructor goes\
