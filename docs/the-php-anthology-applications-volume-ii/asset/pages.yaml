    **How do I record search engine queries?**


    Wouldn’t it be nice if you knew which searches being performed on Google lead


    people to your site? Well, the good news is that you can—and, even better,


    phpOpenTracker has a plug-in that takes care of all the work for you.


    The general trick that Webmasters employ when gathering this data is to examine


    the referer field made available from the browser and mine it for the search


    keywords the visitor used to find your site. If you visit Google, for example,
    and


    search for “php and mysql,” the following URL will display your search results:


    http://www.google.com/search?hl=en&lr=&ie=ISO-8859-1**&q=php+and+m**


    **ysql**&btnG=Google+Search


    Hard as it may be to see, in the above URL you’ll find the string


    &q=php+and+mysql, which contains the search string you gave to Google. Now,


    when a user is referred to our site from Google, all we need to do is extract
    that


    information from the URL and store it in our database.


    **Installing the phpOpenTracker Search Engine**


    **Plug-in**


    The Search Engine plug-in is available as a separate download via the same


    SourceForge project space\[11\] from which you downloaded phpOpenTracker itself.


    You can either install it with the PEAR installer (see Appendix D), or manually


    place the files in your phpOpenTracker directory. If you extract the plug-in ZIP


    file, you’ll find that the directory structure is the same as it should be in
    the main


    phpOpenTracker directory; simply copy the files over as you find them. Then,


    \[11\] http://sourceforge.net/projects/phpopencounter/


    Chapter 4: Stats and Tracking


