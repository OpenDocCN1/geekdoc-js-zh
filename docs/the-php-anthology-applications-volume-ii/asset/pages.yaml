    \ API (as the\n\ngenerated code is pretty complex, you may want just to take my\
    \ word for this).\n\nNow, let me show you how to create correctly a mock object\
    \ like this for use in\n\nyour testing:\n\nFile: **11.php**** (excerpt)**\n\n\
    <?php\n\nif (!defined('SIMPLE\\_TEST')) {\n\n // Modify this line to point at\
