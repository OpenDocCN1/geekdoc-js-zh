  md: "the class from having to work directly with the R&OS PDF API. As well as\n\n\
    making it much easier to generate documents to our design, this also helps us\n\
    \nshould we decide we want to switch to FPDF, or one of the native PHP extensions.\n\
    \nWe can use an adapter pattern (see Chapter 7) to deal with the specifics of\
    \ those\n\nlibraries, while still conforming to the ArticlePDF class’s API, which\
    \ means that\n\nany code using ArticlePDF shouldn’t require much modification.\n\
    \nNote that in the case of R&OS PDF, the author provides a special markup for\n\
    \nconstructing links in the PDF document that’s too tempting to ignore, so the\n\
    \nprinciple of building a library-independent API for generating PDF document\n\
    \ndoes not quite hold true here. However, with some further effort you could,\
    \ no\n\ndoubt, make it possible to switch libraries, should you need to, with\
    \ minimal re-\n\nquirement for code modifications.\n\nLet’s take ArticlePDF for\
    \ a little test drive:\n\nFile: **3.php**\n\n<?php\n\n// Include the PdfArticle\
    \ class\n\nrequire\\_once 'ExampleApps/ArticlePDF.php';\n\n// Define font path\
    \ - MODIFY THIS!!!\n\n$fontPath = 'c:/htdocs/phpanth/SPLIB/ThirdParty/rospdf/fonts/';\n\
    \n// Some information about the article\n\n$title = 'Build your own Database Driven\
