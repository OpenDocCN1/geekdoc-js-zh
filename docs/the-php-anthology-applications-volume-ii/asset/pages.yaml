  md: '**Test Infected**


    Using Unit Testing as a development habit involves more than just adding tests


    to a project as an afterthought. In fact, the Extreme Programming methodology


    advocates writing the test scripts *before* you start developing the meat of your


    code. The argument behind this is that writing the test scripts helps you analyze


    the design of your classes’ APIs without having to sit down and decide, “now,


    I’m going to analyze the API.”


    The general process of developing with Unit Tests looks like this:


    1.


    Design your class API, perhaps with blank classes.


    2.


    Create a test suite, modifying your API design as required to take into account


    this deeper insight.


    3.


    Fill in the “blanks” of your class; write the code that does the real work.


    4.


    Execute the test suite.


    5.


    Fix logic errors, then repeat step 4 *ad infinitum*.


    At first glance, this is clearly more work than the sort of development process


    you’ll be used to if you’re not writing Unit Tests today. The mission you have


    to set yourself is to become “test infected” by continually trying it until you
    can’t


    code without the warm glow it gives you. Gradually, this approach will start to


    become a habit and, I promise you, you’ll be wondering how you ever managed


    to code anything without it! If it all goes to plan, you will become so good at


    Unit Testing that it will *save* you time over the old trial-and-error coding
    method!


    **Test Drive**


    Now that we know roughly what Unit Testing is supposed to involve, it’s time


    to put it into practice with an example. The first problem to overcome, though,


    is selecting a Unit Test framework to help you. There are at least five that I’m


    aware of, which can be confusing, as they all have more or less the same name.


    On the list of either “very stable or actively developed” are:


    **PhpUnit: http://phpunit.sourceforge.net/**


    This is probably the most stable test framework in PHP, though seemingly


    no longer being developed.


    Chapter 6: Development Technique


    300'
