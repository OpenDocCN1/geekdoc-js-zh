  md: "Of particular interest in the above section of code is the buildStats method,\n\
    \nwhich statically calls the factory method, getChar, in the CharFactory class.\n\
    \nUsing this approach, we can leave to the factory method the task of working\
    \ out\n\nwhat to do with the current character; this keeps the buildStats method\
    \ very\n\nsimple.\n\nTo finish off the TextStats class, we add a couple of methods\
    \ to determine how\n\nmany vowels and consonants the document contains:\n\nFile:\
    \ **1.php**** (excerpt)**\n\n /\\*\\*\n\n \\* Find out how many Vowels in document\n\
    \n \\*/\n\n function numVowels()\n\n {\n\n $vowels = 0;\n\n reset($this->chars);\n\
    \n foreach ($this->chars as $char) {\n\n if (is\\_a($char, 'Vowel')) {\n\n $vowels++;\n\
    \n }\n\n }\n\n return $vowels;\n\n }\n\n /\\*\\*\n\n \\* Find out how many Consonants\
    \ in document\n\n \\*/\n\n function numConsonants()\n\n {\n\n $consonants = 0;\n\
    \n reset($this->chars);\n\n foreach ($this->chars as $char) {\n\n if (is\\_a($char,\
    \ 'Consonant')) {\n\n $consonants++;\n\n }\n\n }\n\n return $consonants;\n\n }\n\
    \n}\n\nNow, let’s look at the factory method itself. It takes a single character\
    \ as its argu-\n\nment and examines it first with a regular expression. Should\
    \ it decide that the\n\ncharacter is a letter of the alphabet, it then performs\
    \ a second check to see\n\nChapter 7: Design Patterns\n\n316"
