  md: 'Once the session has been established, it will continue until it is specifically
    des-


    troyed by PHP (in response to a user clicking “Log out,” for example), or the


    session has been inactive for longer than a given period of time (24 minutes by


    default), at which point it becomes flagged for garbage collection and will be
    de-


    leted the next time PHP checks for outdated sessions.


    The following HTTP response headers show a server passing a session cookie to


    a browser, as a result of the session\_start function in a PHP script:


    HTTP/1.1 200 OK


    Date: Wed, 26 Feb 2003 02:23:08 GMT


    Server: Apache/1.3.27 (Unix) PHP/4.3.1


    X-Powered-By: PHP/4.3.1


    **Set-Cookie: PHPSESSID=ce558537fb4aefe349bb8d48c5dcc6d3; path=/**


    Connection: close


    Content-Type: text/html


    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"


    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">


    <html xmlns="http://www.w3.org/1999/xhtml">


    …


    Note that I’ve said sessions are stored on the server as files. It’s also possible
    to


    store sessions using other means, such as a database or even shared memory. This


    can be useful for displaying “Who is Online” type information as well as load


    balancing multiple Web servers using a single session repository, allowing visitors


    to (unknowingly) swap servers while maintaining their session.


    **Session Security**


    Sessions are very useful, but there are some important security considerations


    you should take into account when using them in your applications:


    K By default, all a browser has to do to gain control of a session is pass a valid


    session ID to PHP. In an ideal world, you could store the IP address that re-


    gistered the session, and double check it on every new request that used the


    associated session ID. Unfortunately, some ISPs, such as AOL, assign their


    users a new IP on almost every page request, so this type of security mechanism


    would soon start throwing valid users out of the system. As such, it’s important


    to design your application in a manner that assumes that one of your users


    will eventually have his or her session “hijacked.” The user’s account is only


    exposed as long as the session hasn’t expired, so your focus should be on


    preventing the hijackers from doing serious damage while they’re in the system.


    9


    Session Security'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'This means, for example, that for logged-in users to change their accounts’


    passwords, they should be asked to provide their old passwords—obviously,


    hijackers won’t know these. Also, be careful with the personal information


    you make available to users (such as credit card details), and if you give users


    the opportunity to make significant changes to their accounts, for instance,


    changing a shipping address, be sure to send a summary notification to their


    email address (this will alert users whose sessions have been hijacked).


    To keep the session ID *completely* hidden, you’ll need to use SSL to encrypt


    the conversation. What’s more, you should only use the cookie method of


    passing the session ID. If you pass it in the URL, you may give away the ses-


    sion ID upon referring the visitor to another site, thanks to the referrer


    header in the HTTP request.


    K The files PHP creates for the purpose of storing session information are, by


    default, stored in the temporary directory of the operating system under which


    PHP is running. On Unix based systems such as Linux, this will be /tmp. And,


    if you’re on a shared server, this will mean that other users on the server can


    read the files’ contents. They may not be able to identify *which* virtual host


    and PHP script are the owners of the session but, depending on the informa-


    tion you place there, they may be able to guess.


    This is a serious cause for concern on shared PHP systems; the most effective


    solution is to store your sessions in a database, rather than the server’s tem-


    porary directory. We’ll look more closely at custom session handlers later in


    this chapter, but a partial solution is to set the session.save\_path option


    to a directory that’s not available to the public. You’ll need to contact your


    hosting company in order to have set the correct permissions for that directory,


    so that the ‘nobody’ or ‘wwwuser’ user with which PHP runs has access to


    read, write, and delete files in that directory.


    ![](img/a381b8313756f8d5eb75f79b6057b90e_28_0.png)


    **Session IDs and Cross-Site Scripting**


    One final warning: using a common Web security exploit, **cross-site**


    **scripting** (XSS), it’s possible for an attacker to place JavaScript on your
    site


    that will cause visitors to give away their session ID to a remote Website,


    thereby allowing their sessions to be hijacked. If you allow your visitors to


    post *any* HTML, make sure you check and validate it very carefully (see


    Appendix C for more on XSS and Volume I, Chapter 5 for an HTML filtering


    mechanism).


    Remember the golden rules: *never rely on client side technologies (such as JavaS-*


    *cript) to handle security* and *never trust anything you get from a browser*.


    Chapter 1: Access Control


    10'
