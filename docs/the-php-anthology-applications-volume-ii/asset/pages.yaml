    \ ****SPLIB****) (excerpt)**\n\n /\\*\\*\n\n \\* Adds the text to the page\n\n\
    \ \\* @param string text\n\n \\* @param int (optional) size of text\n\n \\* @param\
    \ string (optional) justification\n\n \\* @return void\n\n \\* @access public\n\
    \n \\*/\n\n function addText($text, $size = 10, $justification = 'full')\n\n {\n\
    \n $this->pdf->ezText($text, $size,\n\n array('justification' => $justification));\n\
    \n }\n\nThe display method wraps the ezStream method, which sends the PDF document\n\
    \nto the browser. It provides a filename that will be given to the document once\n\
    \nthe format of that filename is checked.\n\nFile: **ExampleApps/ArticlePDF.php****\
    \ (in ****SPLIB****) (excerpt)**\n\n /\\*\\*\n\n \\* Sends the PDF document to\
    \ the visitors browser\n\n \\* @param string (optional) filename\n\n \\* @return\
    \ void\n\n \\* @access public\n\n \\*/\n\n function display($fileName = 'file.pdf')\n\
    \n {\n\n $fileName = explode(',', chunk\\_split($fileName, 1, ','));\n\n foreach\
    \ ($fileName as $key => $char) {\n\n if (preg\\_match(\"/^\\[A-Za-z0-9\\_\\\\\
    .\\]$/\",\n\n $char, $matches) == 0) {\n\n unset($fileName\\[$key\\]);\n\n }\n\
    \n }\n\n $fileName = implode('', $fileName);\n\n $options = array('Content-Disposition'\
    \ => $fileName);\n\n $this->pdf->ezStream($options);\n\n }\n\nAs you can see,\
    \ the process of building the PDF document is now wrapped up\n\nin three simple\
    \ methods, plus the constructor, and precludes any code that uses\n\n189\n\nPutting\
    \ it Together"
