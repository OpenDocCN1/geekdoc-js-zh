  md: "First, let’s develop a class for sessions. All code will use this class to\
    \ access sessions,\n\nrather than using the $\\_SESSION variable directly. This\
    \ has the advantage that if\n\nwe ever want to switch to an alternative session\
    \ handling mechanism, such as\n\none we’ve built ourselves, we simply need to\
    \ modify the class, rather than rewriting\n\na lot of code. We can provide an\
    \ interface to the $\\_SESSION variable with a few\n\nsimple methods:\n\nFile:\
    \ **Session/Session.php**** (in ****SPLIB****)**\n\n<?php\n\n/\\*\\*\n\n \\* A\
    \ wrapper around PHP's session functions\n\n \\* <code>\n\n \\* $session = new\
    \ Session();\n\n \\* $session->set('message','Hello World!');\n\n \\* echo ( $session->get('message');\
    \ // Displays 'Hello World!'\n\n \\* </code>\n\n \\* @package SPLIB\n\n \\* @access\
    \ public\n\n \\*/\n\nclass Session {\n\n /\\*\\*\n\n \\* Session constructor<br\
    \ />\n\n \\* Starts the session with session\\_start()\n\n \\* <b>Note:</b> that\
    \ if the session has already started,\n\n \\* session\\_start() does nothing\n\
    \n \\* @access public\n\n \\*/\n\n function Session()\n\n {\n\n session\\_start();\n\
    \n }\n\n /\\*\\*\n\n \\* Sets a session variable\n\n \\* @param string name of\
    \ variable\n\n \\* @param mixed value of variable\n\n \\* @return void\n\n \\\
    * @access public\n\n \\*/\n\n function set($name, $value)\n\n {\n\n $\\_SESSION\\\
    [$name\\] = $value;\n\n }\n\n /\\*\\*\n\nChapter 1: Access Control\n\n12"
  merge: -1
