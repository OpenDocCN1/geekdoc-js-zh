  md: "File: **15.php**\n\n<?php\n\n// Define paths to XML and XSL documents (MODIFY\
    \ THIS!)\n\n$xml = '/full/path/to/sitepoint/XML/articles.xml';\n\n$xsl = '/full/path/to/sitepoint/XML/article2sql.xsl';\n\
    \n// Define the XSLT error handler\n\nfunction xslt\\_error\\_handler($xp, $errNo,\
    \ $level, $fields)\n\n{\n\n $errMsg = 'Error #' . $errNo . ', Level ' . $level\
    \ .\n\n ', Fields:<br />';\n\n if (is\\_array($fields)) {\n\n foreach ($fields\
    \ as $key => $value) {\n\n $errMsg .= $key .' => '.$value.'<br />';\n\n }\n\n\
    \ } else {\n\n $errMsg .= $fields.'<br />';\n\n }\n\n trigger\\_error($errMsg);\n\
    \n}\n\n// Instantiate the XSLT processor\n\n$xp = xslt\\_create();\n\n// Set the\
    \ error handler\n\nxslt\\_set\\_error\\_handler($xp, 'xslt\\_error\\_handler');\n\
    \n// An array of params to pass to the processor\n\n**$params = array('tableName'\
    \ => 'articles');**\n\n// Perform the transform using the PHP variables\n\n$result\
    \ = xslt\\_process($xp, $xml, $xsl, null, null, **$params**);\n\n// Display the\
    \ result\n\necho \"<pre>\" . $result . \"</pre>\";\n\n?>\n\nNotice the $params\
    \ array, where we define the variable tableName. This is passed\n\nto the XSLT\
    \ processor, then used in the transformation to render the SQL. Fig-\n\nure 2.10\
    \ shows the output of this script, which simply displays the generated\n\nSQL\
    \ code.\n\nChapter 2: XML\n\n140"
