  md: '1.


    Begin by defining the document margins; take note of the corresponding X


    and Y coordinates defining the edges of the margins, bearing in mind the


    paper size you’re using.


    2.


    Create objects for any elements that will repeat throughout the document.


    Headers and footers will generally appear outside the margins you’ve defined.


    3.


    If you plan to have a title page, it’s likely you won’t want the headers and


    footers to appear there. Make sure you build the title page next, and make


    allowances to start page numbering, for example, afterwards.


    4.


    Add the page numbering first, then start building the body of the document.


    **How do I convert HTML to PDF?**


    Before we can jump into rendering PDF straight from the content in our database,


    there’s a problem we have to overcome. The content we’ve stored contains HTML


    markup that we can’t simply “drop” into a PDF document. At the same time,


    the HTML is there for a good reason; it provides useful formatting for the content,


    positioning text and images correctly, adding links, and so on. We don’t want
    to


    lose this formatting information, so we can’t just strip it out; rather, we need
    to


    use it somehow to lay out the PDF document. For the solution, we turn


    toPEAR::XML\_HTMLSax\[7\]. This is a SAX-like parser for “badly formed” XML


    documents, which will allow us to strip the HTML out of the content and at the


    same time take advantage of the formatting information it contains. The version


    used here was 2.0.2.


    **Parsing HTML with SAX?!?**


    HTML does not obey the rules of XML; by XML standards, most HTML code


    is badly formed. The basic specification allows for tags that are not closed and


    attributes that have no values. Worse still, Web browsers allow us to get away


    with murder, such as violating the tag nesting and case sensitivity rules (e.g.


    <I><b>Text</I></B>). Attempt to parse HTML with a normal XML parser, and


    it will pass you back error messages in disgust. In other words, the native SAX


    XML extension that comes with PHP won’t do.¹


    \[7\] http://pear.php.net/XML\_HTMLSax


    1The good news is that newer incarnations of DOM will be able to parse HTML, but
    right now that’s


    neither stable, nor widely available on common Web hosts.


    177


    How do I convert HTML to PDF?'
