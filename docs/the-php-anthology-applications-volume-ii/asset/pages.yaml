  md: "File: **5.php**\n\n<?php\n\n// Note rand() must be seeded for PHP < 4.2.0\n\
    \n// see: http://www.php.net/rand\n\n$uniqueId = md5('example' . uniqid(rand(),\
    \ TRUE));\n\n// Set the cookie\n\nif (!isset($\\_COOKIE\\['MyIdentifier'\\]))\
    \ {\n\n setcookie('MyIdentifier', $uniqueId,\n\n time() + 60 \\* 60 \\* 24 \\\
    * 120, \"/\");\n\n echo 'Cookie Set';\n\n} else {\n\n echo 'MyIdentifier: ' .\
    \ $\\_COOKIE\\['MyIdentifier'\\];\n\n}\n\n?>\n\nOnce it’s set, the cookie identifier\
    \ can be stored in the raw log data for every page\n\nviewed. This allows you\
    \ to build reports that display an individual visitor’s progress\n\nacross your\
    \ site for current and future visits, and perform queries that order or\n\ngroup\
    \ results by the unique ID; this can prove invaluable for understanding how\n\n\
    visitors use your site.\n\nSetting this up with phpOpenTracker is easy. Modify\
    \ the following section in\n\nyour phpopentracker.ini file:\n\n; Returning Visitors\
    \ Handling\n\ntrack\\_returning\\_visitors = On\n\nreturning\\_visitors\\_cookie\
    \ = \"pot\\_visitor\\_id\"\n\nreturning\\_visitors\\_cookie\\_lifetime = 365\n\
    \nThe track\\_returning\\_visitors setting is used to switch this functionality\
    \ on.\n\nThe returning\\_visitors\\_cookie setting specifies a name for the cookie,\
    \ while\n\nreturning\\_visitors\\_cookie\\_lifetime assigns it a lifetime in seconds.\
    \ With\n\nthe phpOpenTracker database, the pot\\_visitors table will use the same\
    \ ID\n\n(visitor\\_id) to record page views for visitors that have a cookie, so\
    \ reports that\n\nare built from the database will be able to identify a given\
    \ user.\n\nWe’ll be looking at how to take advantage of this later in the chapter.\n\
    \n233\n\nHow do I recognize returning visitors?"
