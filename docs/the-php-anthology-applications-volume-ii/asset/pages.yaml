  md: "Note that on Windows systems, the path to these documents needs to be preceded\n\
    \nby file://. For example:\n\nFile: **14.php**** (excerpt)**\n\n$xml = 'file://c:/htdocs/sitepoint/XML/articles.xml';\n\
    \n$xsl = 'file://c:/htdocs/sitepoint/XML/articles.xsl';\n\nNext, we instantiate\
    \ the XSLT processor with the xslt\\_create function:\n\nFile: **14.php**** (excerpt)**\n\
    \n// Instantiate the XSLT processor\n\n$xp = xslt\\_create();\n\nThe xslt\\_process\
    \ function transforms the XML to HTML according to the\n\ntemplate(s) in the stylesheet.\
    \ Should anything go wrong, we use the xslt\\_errno\n\nand xslt\\_error functions\
    \ to access information about what happened.\n\nFile: **14.php**** (excerpt)**\n\
    \n// Perform the XSL Transformation\n\n$result = xslt\\_process($xp, $xml, $xsl)\
    \ or\n\n // If there's a problem, display the error\n\n \"<tr>\\\\n<td>Error (\"\
    \ . xslt\\_errno($xp) .\n\n \") performing XSLT:\" . xslt\\_error($xp) . \"</td>\\\
    \\n</tr>\\\\n\";\n\n// Embed the result in an HTML table\n\n$table = \"<table>\\\
    \\n\";\n\n$table .= $result;\n\n$table .= \"</table>\\\\n\";\n\nThat’s it! The\
    \ XML document is now transformed into HTML, which we can\n\nembed into a table\
    \ and display as part of a page constructed by PHP. The output\n\nwill look like\
    \ that shown in Figure 2.9.\n\n137\n\nHow do I transform XML with PHP?"
