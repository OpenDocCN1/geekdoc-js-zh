    **Where do I get .afm fonts?**


    Get more .afm fonts from the Adobe FTP site:


    ftp://ftp.adobe.com/pub/adobe/type/win/all/afmfiles/


    Finally, we start up the page number (after adding the title page) and add the


    body text:


    File: **1.php**** (excerpt)**


    // Start the rest of the document


    $pdf->ezStartPageNumbers(505, 24, 6); // Page numbering


    $pdf->selectFont(''rospdf/fonts/Helvetica.afm''); // Change font


    $pdf->ezText($body, 10, array(''justification'' => ''full'')); // Body


    // Display the document


    $pdf->ezStream();


    ?>


    The library respects the new line character, so basic formatting is preserved.
    The


    ezStream method sends the finished PDF document straight to the Web browser,


    taking care to send the right HTTP headers. The alternative is the output


    method, which returns the document as a string that can be saved as a file.


    ![](img/a381b8313756f8d5eb75f79b6057b90e_193_1.png)


    **Programming Tip**


    If your scripts automatically send HTTP headers that tell the browser not


    to cache pages, this causes problems when Internet Explorer renders PDF


    documents on the fly with R&OS PDF. Internet Explorer has a strange way


    of caching downloaded files, which involves making two requests for a file.


    There are two solutions. You can avoid rendering PDF straight to the browser,


    instead using the output method to store it as a file that you can link to


    with HTML. Alternatively, make sure you don’t send any headers that in-


    struct the browser not to cache; rather, send a Last-Modified header set


    to the present time. See Chapter 5 for full details.


    Figure 3.1 shows what the page generated by this example will look like in Acrobat


    Reader.


