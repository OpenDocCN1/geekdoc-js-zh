  md: "**Umbrello UML Modeller: http://uml.sourceforge.net/**\n\nAlthough it’s not\
    \ a tool for generating API documentation per se, Umbrello\n\nis worthy of note\
    \ (if you’re a Linux user), as it’s capable of generating PHP\n\ncode from UML\
    \ diagrams; in other words, it codes by drawing. You put to-\n\ngether UML diagrams\
    \ for your code and specify the APIs, then Umbrello\n\ngenerates “blank” classes\
    \ that you fill with code. The problem with tools like\n\nthis arises when you\
    \ want to go in the other direction—from source code to\n\nUML diagram. However,\
    \ Umbrello can make a very handy first stage in\n\nputting together a whole PHP\
    \ project.\n\n**phpDocumentor: http://www.phpdoc.org/**\n\nphpDocumentor is rapidly\
    \ becoming the standard tool for API documentation\n\nin PHP, and is my own tool\
    \ of choice. What gives it the edge is that the\n\ndocumentation it produces is\
    \ excellent—a very good sign for a tool that’s\n\nsupposed to generate documentation!\
    \ The standard tag library (the @ tags\n\nyou’ve seen in code throughout this\
    \ book) is rich, and there’s also a very\n\nfriendly Web-based interface that\
    \ can have you generating your first API\n\ndocs within minutes of unzipping the\
    \ phpDocumentor download. It’s mature\n\nand stable, and it’s endorsed by PEAR,\
    \ which means the level of effort going\n\ninto further development is higher\
    \ than the average open source project.\n\nWhat’s more, it’s capable of generating\
    \ output in numerous formats, and\n\nprovides a range of HTML documentation styles\
    \ with the base install, as well\n\nas PDF, Windows CHM, and DocBook XML. If you\
    \ don’t like any of those,\n\nno problem—you can create your own output format,\
    \ which entails some\n\ntemplate editing. Finally, the documentation attributes\
    \ production of this\n\ntool to no less than sixteen authors, which means it’s\
    \ a very well supported\n\nproject that’s unlikely to fizzle out in the near future.\n\
    \nFor the rest of this solution, we’ll walk through a quick start guide to using\
    \ php-\n\nDocumentor, to start you generating your own API documentation. This\
    \ isn’t\n\nintended as a comprehensive guide; browsing the phpDocumentor site\
    \ will provide\n\nyou with extensive tutorials and detailed explanations of how\
    \ to use the software.\n\nHere, we’ll cover only the most common **doc tags**,\
    \ so that you can begin using\n\nthem straight away to build a class in stages.\n\
    \nWe’ll start with an empty class definition prefaced by a couple of sizable com-\n\
    \nments:\n\nFile: **7.php**** (excerpt)**\n\n<?php\n\n/\\*\\*\n\n \\* @package\
    \ MyFirstDocumentedPackage\n\n293\n\nChoose your Weapons"
