  md: "But if a Web browser can understand HTML, why shouldn’t you be able to parse\n\
    \nit with PHP? You can! PEAR::XML\\_HTMLSax will let you get away with having\n\
    \na badly formed HTML document. As a parser, the XML\\_HTMLSax class guarantees\n\
    \nto parse anything you give it without a word of complaint. The downside of this\n\
    \nis that there are no warnings should something be seriously wrong with the HTML\n\
    \ncode. This places a greater burden on you to make sure the document is valid\n\
    \nbefore you parse it.\n\nMake sure you read the SAX related solutions in Chapter\
    \ 2 for a general under-\n\nstanding of the principles behind SAX.\n\nTo see XML\\\
    _HTMLSax in action, let’s begin with a chunk of HTML stored in our\n\ndatabase:\n\
    \n<p>If you've ever trawled the PHP listings over at Hotscripts in\n\nsearch of\
    \ a content management system to save you from writing\n\nyour own, you've probably\
    \ run into\n\n<a href=\"http://developer.ez.no/\">eZ publish</a>, a PHP-based\
    \ CMS\n\napplication, and thought <i><b>\"Wow!\"</i></b> Jubilant, you tried\n\
    \nto install it... to no avail. Desperately, you tried reading the\n\ncode, only\
    \ to discover it made no sense whatsoever. Finally, you\n\nskulked away to a quiet\
    \ corner to lick your wounds, resorting to\n\nPHP Nuke instead.\n\n<p>This series\
    \ is all about eZ publish and why it deserves the\n\ntitle of \"PHP's killer app.\"\
    \ We'll start from the ground up:\n\nfirst, we'll install eZ publish in your development\
    \ environment.\n\nYou’ll notice this exhibits two of the classic HTML problems;\
    \ the p tags are not\n\nclosed and we have some incorrectly nested tags here:\n\
    \n<i><b>\"Wow!\"</i></b>\n\nHere’s a simple example of how to parse it with XML\\\
    _HTMLSax. First, as always,\n\nwe need a class to act as the handler for XML\\\
    _HTMLSax:\n\nFile: **XML/ParseHTML.php**** (in ****SPLIB****) (excerpt)**\n\n\
    /\\*\\*\n\n \\* ParseHTML class demonostrates simple parsing of HTML using\n\n\
    \ \\* PEAR::XML\\_HTMLSax\n\n \\* <br />Defines handlers for responding to HTML\
    \ elements<br />\n\n \\* Requires PEAR::XML\\_HTMLSax\n\n \\* @package SPLIB\n\
    \n \\* @access public\n\n \\*/\n\nChapter 3: Alternative Content Types\n\n178"
