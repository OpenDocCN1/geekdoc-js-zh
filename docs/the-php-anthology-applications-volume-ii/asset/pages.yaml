  md: '**How do I render XUL with PHP?**


    **XML User interface Language**\[24\] (XUL) is the innovation of the developers


    working on the Mozilla project\[25\]. (X)HTML is easy, right? The idea behind


    XUL is to make building desktop applications (or **rich clients**) as easy as
    working


    with HTML. What’s more, it allows rich clients to be launched from your Website.


    For an introduction to XUL, try SitePoint’s *Introducing XUL: The Net’s Biggest*


    *Secret*\[26\], which comes as a three-part series and provides plenty of resources
    to


    get you started.


    Now, assuming you have a grasp of what XUL is about, the question is: can it be


    applied to your Website in a useful manner? Given the popularity of Internet


    Explorer, requiring visitors use Mozilla, Firebird, Camino, or one of the other


    Gecko-based browsers is obviously not going to be popular. But for the “back


    end”—the interface you provide for administering your site—there’s much to be


