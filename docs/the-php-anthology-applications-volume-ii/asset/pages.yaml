  md: "From the point of view of keeping it simple, we’ll concentrate here on the\
    \ HTTP\n\n1.0 caching headers only, namely Expires, Last-Modified, and If-Modified-\n\
    \nSince, as well as HTTP status code 304 (Not Modified).\n\nThose headers available\
    \ with HTTP 1.1, such as Cache-Control and ETAG, are\n\nintended to provide an\
    \ advanced mechanism that can be used in conjunction\n\nwith a Web session’s state;\
    \ in other words, the version of a given page displayed\n\nto a visitor who’s\
    \ not logged in may differ vastly from that displayed to a logged-\n\nin user.\
    \ The HTTP 1.1 headers were added primarily to allow the caching of such\n\npages.\n\
    \n**Page Expiry**\n\nThe header that’s easiest to use is the Expires header, which\
    \ sets a date (presum-\n\nably in the future) on which the page will expire. Until\
    \ that time, Web browsers\n\nare allowed to use a cached version of the page.\n\
    \nAn example:\n\nFile: **6.php**\n\n<?php\n\n/\\*\\*\n\n \\* Sends the Expires\
    \ HTTP 1.0 header.\n\n \\* @param int number of seconds from now when page expires\n\
    \n \\*/\n\nfunction setExpires($expires)\n\n{\n\n header('Expires: ' .\n\n gmdate('D,\
    \ d M Y H:i:s', time() + $expires) . 'GMT');\n\n}\n\n// Set the Expires header\n\
    \nsetExpires(10);\n\n// Display a page\n\necho 'This page will self destruct in\
    \ 10 seconds<br />';\n\necho 'The GMT is now ' . gmdate('H:i:s') . '<br />';\n\
    \necho '<a href=\"' . $\\_SERVER\\['PHP\\_SELF'\\] .\n\n '\">View Again</a><br\
    \ />';\n\n?>\n\nThe setExpires function sets the HTTP Expires header to a future\
    \ time, defined\n\nin seconds. The above example shows the current time in GMT\
    \ and provides a\n\nlink that allows you to view the page again. Using your browser’s\
    \ Refresh button,\n\n263\n\nPage Expiry"
