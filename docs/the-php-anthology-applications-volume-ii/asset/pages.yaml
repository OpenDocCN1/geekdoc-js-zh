    **How do I build an XML-RPC service with**


    **PHP?**


    **XML Remote Procedure Calling**\[39\] (XML-RPC) is an XML standard that’s


    commonly used for exchanging data between Web servers on the Internet. It allows


    you to store your data on one server, while displaying it in a Web page on a


    completely separate server. This would allow you to make that data available to


    other Webmasters, for example. Think of it as a generalized variant of an RSS


    feed, and you’re not far off.


    XML-RPC is a complete messaging protocol, where all the requests and responses


    are XML documents. The standard falls under the umbrella buzzword **Web ser-**


    **vices**, and is the forerunner to Simple Object Access Protocol\[40\] (SOAP),
    the


    current “king” of Web services. Here, I’ll assume you have a grasp of what Web


    services are about, if not the actual syntax of XML-RPC. If you’re not sure, you’ll


    find recommended material in the section called “Further Reading” at the end


    of this chapter, including an article that focuses purely on XML-RPC.


    \[39\] http://www.xmlrpc.com/


    \[40\] http://www.w3.org/TR/SOAP/


    141


    How do I build an XML-RPC service with PHP?'
