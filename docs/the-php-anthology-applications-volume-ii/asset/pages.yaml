  md: " <xsl:variable name=\"squote\">'</xsl:variable>\n\n <xsl:output method=\"text\"\
    \ indent=\"yes\" encoding=\"iso-8859-1\" />\n\n <!-- Strip whitespace from original\
    \ -->\n\n <xsl:strip-space elements=\"\\*\" />\n\n <xsl:template match=\"spt:article\"\
    >\n\n INSERT\n\n INTO\n\n <xsl:value-of select=\"$tableName\"/>\n\n SET\n\n article\\\
    _id='<xsl:value-of select=\"spt:article\\_id\"/>',\n\n title=\n\n'<xsl:value-of\
    \ select=\"translate(spt:title,$squote,'')\" />',\n\n author=\n\n'<xsl:value-of\
    \ select=\"translate(spt:author,$squote,'')\" />',\n\n body=\n\n'<xsl:value-of\
    \ select=\"translate(spt:body,$squote,'')\" />',\n\n published='<xsl:value-of\
    \ select=\"spt:published\"/>',\n\n public='<xsl:value-of select=\"spt:public\"\
    />';\n\n </xsl:template>\n\n</xsl:stylesheet>\n\nThe stylesheet is geared to convert\
    \ the document into an SQL query. Note that\n\nwe’ve set the output method to\
    \ text. For this example, we’ve used a crude method\n\nfor solving the problem\
    \ of single quotes inside the SQL statement—we’ve simply\n\nremoved them all with\
    \ the XPath translate function. In a practical situation,\n\nyou’d need to write\
    \ your own escaping template, which you would call as needed\n\nwith a xsl:call-template\
    \ tag. However, as this is a book on PHP, not XSLT,\n\nwe’ll stick to this simple\
    \ solution.\n\nIt’s worth noting the XSL parameter we’ve defined:\n\n <xsl:param\
    \ name=\"tableName\" />\n\nThis parameter needs to hold the name of the table\
    \ for the resulting SQL query\n\nin order to work as intended. As we’ll see in\
    \ a moment, it will be populated by\n\na PHP variable.\n\nNext, we’ll look at\
    \ the code that makes the transformation. This time, we’ll use\n\nXSLT’s error\
    \ handling functionality to implement my own custom function for\n\nreacting to\
    \ errors.\n\n139\n\nXML to SQL"
