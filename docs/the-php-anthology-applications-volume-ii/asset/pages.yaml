  md: 'As you can see, the SOAPArticleServer class does most of the work involved
    in


    providing this Web service. All we need now is a script that will connect to the


    database and create the server:


    File: **20.php**


    <?php


    // Include the MySQL class


    require\_once ''Database/MySQL.php'';


    // Include the SOAP Article Server


    require\_once ''ExampleApps/SOAPArticleserver.php'';


    // Define variables for MySQL class


    $host = ''localhost''; // Hostname of MySQL server


    $dbUser = ''harryf''; // Username for MySQL


    $dbPass = ''secret''; // Password for user


    $dbName = ''sitepoint''; // Database name


    // Instantiate MySQL class


    $db = &new MySQL($host, $dbUser, $dbPass, $dbName);


    // Instantiate ArticleServer class


    $server = new SOAPArticleServer($db);


    ?>


    Now, a server is not much good without a client to access it. As with XML-RPC,


    SOAP is a platform- and language-independent protocol, so you could build a


    client in any language (ideally, though, the language would have a SOAP library


    of some sort so you won’t have to reinvent the wheel). In “How do I consume


    SOAP Web services with PHP?”, you learned how to build a SOAP client in PHP


    automatically from a Web service’s WSDL description. Here’s how that would


    work for this Web service:


    File: **21.php**


    <?php


    // Include PEAR::SOAP Client class


    require\_once ''SOAP/Client.php'';


    // Instantiate the SOAP\_WSDL class


    $wsdl = new SOAP\_WSDL(''http://localhost/XML/20.php?wsdl'');


    // Instantiate the ArticleClient class


    $articleClient = $wsdl->getProxy();


