  md: "**Figure 2.9. Looks Like Normal HTML to Me…**\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_156_0.png)\n\
    \n**XML to SQL**\n\nAnother task we could complete with XSLT is to convert the\
    \ XML document\n\ninto an SQL query, which can then be used to place the data\
    \ into the database.\n\nI’ll take this opportunity to demonstrate how to pass\
    \ PHP variables to the XSLT\n\nprocessor.\n\nHere’s our stylesheet:\n\nFile: **article2sql.xsl**\n\
    \n<?xml version=\"1.0\" encoding=\"iso-8859-1\"?>\n\n<!-- Note the: exclude-result-prefixes\
    \ ... -->\n\n<xsl:stylesheet version=\"1.0\" \n\n xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
    \n\n xmlns:spt=\"http://www.sitepoint.com/\"\n\n exclude-result-prefixes=\"spt\"\
    >\n\n <xsl:param name=\"tableName\" />\n\nChapter 2: XML\n\n138"
