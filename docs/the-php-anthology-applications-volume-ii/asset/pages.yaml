  md: "That’s it. The ArticleServer is ready to begin accepting requests from XML-\n\
    \nRPC clients.\n\nThe script executes on your Web server in exactly the same way\
    \ as would any\n\nPHP script used to deliver (X)HTML to a client Web browser.\
    \ That is, when an\n\nXML-RPC request is received as an HTTP POST request, the\
    \ script is executed,\n\nexamining the incoming request and returning the appropriate\
    \ response in the\n\nsame way a script might respond to a form. The only difference\
    \ between serving\n\nXML-RPC and displaying a normal Web page is that the client\
    \ will not be a Web\n\nbrowser; perhaps it’s another Web server using an XML-RPC\
    \ client to fetch data\n\nfrom your site. This will be clearer once you’ve seen\
    \ a client script access the\n\nabove server, which is exactly what we’re going\
    \ to do next.\n\n**The Client**\n\nThe “client side” is where we’ll render the\
    \ HTML to display the articles. Remem-\n\nber, the client could be placed on a\
    \ Web server on the far side of the world, al-\n\nthough in this example you’ll\
    \ start by running them from the same Web server.\n\nOf course, someone else using\
    \ the XML-RPC server may not want to render exactly\n\nthe same HTML we create,\
    \ so it’s important that we provide a client class that\n\naccesses the service\
    \ without restricting it to any particular output design.\n\nThe constructor takes\
