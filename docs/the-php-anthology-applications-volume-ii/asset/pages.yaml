  md: "such as the $msg variable we’ve used here, to store the name of a PHP script\
    \ for\n\nuse with an include statement.\n\nOtherwise, that’s all there is to it.\
    \ Now, all you need to do is build an administra-\n\ntion interface to control\
    \ Users, Groups and Permissions!\n\n**How do I store sessions in MySQL?**\n\n\
    As discussed earlier in this chapter, the default behavior of sessions in PHP\
    \ on\n\nthe server side is to create a temporary file in which session data is\
    \ stored. This\n\nis usually kept in the temporary directory of the operating\
    \ system and, as such,\n\npresents a security risk to your applications, especially\
    \ if you are using a shared\n\nserver. It’s a good idea to be aware of the alternative;\
    \ using a custom session\n\nhandler provides an alternative data store which is\
    \ fully under your control.\n\nIn this solution, I’ll provide you with a custom\
    \ session handler that will store all\n\nsession data in MySQL in a manner that\
    \ will require no modification of any code.\n\nThe custom handler code is a port\
    \ of the PostgreSQL Session Handler for\n\nPHP\\[10\\], written by Jon Parise,\
    \ and is supplied with the code for this chapter,\n\nin the subdirectory mysql\\\
    _session\\_handler.\n\nTo install it, the first thing you need to do is modify\
    \ the file mysql\\_session\\_hand-\n\nler.php, changing the lines that identify\
    \ your database connection, shown here\n\nin bold:\n\nFile: **mysql\\_session\\\
    _handler/mysql\\_session\\_handler.php**** (excerpt)**\n\nfunction mysql\\_session\\\
    _open($save\\_path, $session\\_name)\n\n{\n\n global $mysql\\_session\\_handle;\n\
    \n /\\* See: http://www.php.net/manual/function.mysql-connect.php \\*/\n\n** $host\
    \ = 'localhost';**\n\n** $user = 'harryf';**\n\n** $pass = 'secret';**\n\n /\\\
    * See: http://www.php.net/manual/function.mysql-select-db.php\\*/\n\n** $dbas\
    \ = 'sitepoint';**\n\n $mysql\\_session\\_handle = mysql\\_connect($host, $user,\
    \ $pass);\n\n mysql\\_select\\_db($dbas, $mysql\\_session\\_handle);\n\n return\
    \ $mysql\\_session\\_handle;\n\n}\n\n\\[10\\] http://www.csh.rit.edu/~jon/projects/pgsql\\\
    _session\\_handler/\n\n71\n\nHow do I store sessions in MySQL?"
