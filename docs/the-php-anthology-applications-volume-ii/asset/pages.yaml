    \nwhich we saw when we registered the methods on the server in the previous sec-\n\
    \ntion.\n\nFile: **ExampleApps/XMLRPCArticleClient.php**** (in ****SPLIB****)\
    \ (excerpt)**\n\n /\\*\\*\n\n \\* Returns an array of articles\n\n \\* @return\
