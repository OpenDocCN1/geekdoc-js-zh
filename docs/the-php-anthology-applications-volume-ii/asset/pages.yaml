  md: "**The ****for**** Loop**\n\nAnother common pattern in PHP code is to use a\
    \ for loop to step through the\n\nelements of an array until the end of the array\
    \ is reached. PHP provides the\n\nfunction count to test the size of an array\
    \ and, although it may look like nice,\n\nclean coding practice to place the count\
    \ function call in the for loop, consider\n\nthe following script:\n\nFile: **2.php**\n\
    \n<?php\n\n// Check Xdebug is installed\n\nif (!extension\\_loaded('xdebug'))\
    \ {\n\n die('<a href=\"http://xdebug.derickrethans.nl/\">Xdebug</a> ' .\n\n 'required');\n\
    \n}\n\n// Create an array with element values from 1 to 50000\n\n$numbers = range(1,\
    \ 50000);\n\n// Start Xdebug profiling\n\nxdebug\\_start\\_profiling();\n\n//\
    \ For with count function call in loop\n\nfor ($i=0; $i < **count($numbers)**;\
    \ $i++) {\n\n // Do something here\n\n}\n\n// Place count() outside for loop\n\
    \n**$size = count($numbers);**\n\nfor ($i=0; $i < **$size**; $i++) {\n\n // Do\
    \ something here\n\n}\n\n// Display the Xdebug line by line report\n\nxdebug\\\
    _dump\\_function\\_profile();\n\n?>\n\nNotice that in the first for loop, the\
    \ count function is called each time the con-\n\ndition in the for loop is checked.\
    \ In the second, we call the function only once\n\nand store the result in the\
    \ variable $size. Xdebug tells me the total time in each\n\ncase; the report from\
    \ my testing is shown in Figure 6.2.\n\nChapter 6: Development Technique\n\n274"
