    \nEvery computer surfing the Internet must have an IP address to be able to com-\n\
    \nmunicate. Although they’re often compared to phone numbers, IP addresses are\n\
    \nfar easier to come by, and make it far more difficult to identify exactly who\
    \ the\n\nuser is (some say this is a very good thing). If you use a dial up Internet\
    \ connection\n\nfrom home, you’ve probably already used *at least* 100 IP addresses,\
    \ before we\n\neven begin to consider the times you surfed from the Internet café\
    \ down the\n\nstreet, the local library, and so on. The story with IP addresses\
    \ becomes even\n\nmore convoluted when you take into account proxy servers, which\
    \ act as “middle\n\nmen” between your browser and a Website, network address translation,\
    \ and\n\nmore. One thing to be aware of is that AOL uses a particularly bizarre\
    \ mechanism;\n\ntheir members are assigned a new IP address upon practically every\
    \ page request,\n\nwhich basically defeats any IP-based security mechanism you\
    \ might care to use\n\n(e.g. confining a user’s session to a single IP address).\n\
    \nThe $\\_SERVER\\['REMOTE\\_ADDR'\\] variable tells you the nearest Internet\
    \ IP address\n\nto the Web browser (i.e. it will not show the local address of\
    \ the computer if it\n\nresides on a private network). What’s important to realize\
    \ is that this could be\n\na \n\nproxy \n\nserver; \n\nshould \n\nthis \n\nbe\
    \ \n\nthe \n\ncase, \n\nyou \n\nneed \n\nto \n\ncheck\n\n$\\_SERVER\\['HTTP\\\
    _X\\_FORWARDED\\_FOR'\\] to obtain the client’s *actual* IP address. Of\n\ncourse,\
    \ life is never that simple! Depending on the type of proxy server clients\n\n\
    use, and whether they’re using network address translation, there are other vari-\n\
    \nables you may need to consider, such as $\\_SERVER\\['HTTP\\_CLIENT\\_IP'\\\
