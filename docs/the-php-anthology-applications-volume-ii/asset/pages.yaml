    \nThis time, what we get back in the $stationInfo variable is an object we can\n\
    \nuse immediately. Note also that we’ve made the Session class available. One\n\
    \ntrick when dealing with Web services is to store fetched data that you can reuse\n\
    \nin a local cache; this avoids the performance delay involved in fetching the\
    \ data\n\nfrom the remote site for each page request.\n\nFile: **19.php**** (excerpt)**\n\
    \n// If the Countries session variable exists, use it\n\nif ($session->get('Countries'))\
    \ {\n\n // Get the data from the local session variable\n\n $countries = $session->get('Countries');\n\
    \n} else {\n\n // Otherwise get a list of countries from the service\n\n $countries\
