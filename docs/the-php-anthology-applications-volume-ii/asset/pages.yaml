- img_proc: true
  md: " \" . USER\\_TABLE\\_PASSW . \"='\" . md5($password) . \"'\n\n WHERE\n\n \"\
    \ . USER\\_TABLE\\_ID . \"='\" . $row\\[USER\\_TABLE\\_ID\\] .\n\n \"'\";\n\n\
    \ $result = $this->dbConn->fetch($sql);\n\n if (!$result->isError()) {\n\n $row\\\
    [USER\\_TABLE\\_PASSW\\] = $password;\n\n return $row;\n\n } else {\n\n return\
    \ FALSE;\n\n }\n\n } else {\n\n return FALSE;\n\n }\n\n } else {\n\n return FALSE;\n\
    \n }\n\n }\n\nThe resetPassword method, when given a combination of a login and\
    \ an email\n\naddress, identifies the corresponding row in the user table, and\
    \ calls the\n\ngeneratePassword method (which we’ll discuss in a moment) to create\
    \ a new\n\npassword. It then updates the user table with the new password (using\
    \ md5 to\n\nencrypt it), and returns the new password in an array containing the\
    \ user details.\n\nIf you’re using a different table structure, you’ll need to\
    \ modify this method.\n\nNote that we use both the login and email to identify\
    \ the row, so it’s a little more\n\ndifficult for other people to reset your members’\
    \ passwords. Although there’s no\n\nrisk in individuals stealing the new password\
    \ (unless they have control over a\n\nmember’s email account), it will certainly\
    \ irritate people if their password was\n\nbeing continually reset. Requiring\
    \ both the login name and email of the user\n\nmakes it a little more complex.\n\
    \nOf the next two methods, addWords is used to supply the class with an indexed\n\
    \narray of words with which to build memorable passwords, while\n\ngeneratePassword\
    \ constructs a random password from this list, adding “separat-\n\nors” that could\
    \ be any number from 0 to 9, or an underscore character. The\n\npassword itself\
    \ will contain two words chosen at random from the list, as well as\n\ntwo random\
    \ separators. The order in which these elements appear in the password\n\nis also\
    \ random. The passwords this system generates look like “7correct9computer”\n\n\
    and “48courtclothes,” which are relatively easy for users to remember.\n\nChapter\
    \ 1: Access Control\n\n52"
