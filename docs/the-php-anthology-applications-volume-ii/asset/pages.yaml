    We test each of the functions with fifty function calls, iterating over the $colors


    array using PHP’s each function. The report generated by Xdebug should look


    something like Figure 6.1, though of course, the absolute times will depend on


    the speed of your server.


    **Figure 6.1. Most Probably Faster**


    ![](img/a381b8313756f8d5eb75f79b6057b90e_291_0.png)


    As you can see, when tested over fifty iterations, isBlueSlow turned out to take


    almost twice as long as isBlueFast. Of course, in a real application, the results


    would be unpredictable; it could be that on a particular run all the values were


    ''blue'', which would make isBlueSlow quicker. But by designing the code to


    reflect the most *probable* input, you can improve the overall performance of
    the


    application on *average*.


    Note that when we called xdebug\_dump\_function\_profile, we passed it the


    constant XDEBUG\_PROFILE\_NC, which tells XDebug to merge all function calls


    from the same line in the script into a single entry in the output. There are
    a


    number of different profiling modes which XDebug provides to give you different


    “views” of what’s actually happening in your PHP script. These modes range


    from a list of slowest function calls in order of execution time, to averages
    for


    each function. See the XDebug documentation for further details.


    Although this example may seem trivial, it’s common for applications to have


    many such “probable conditions”; by weighting all code to the most probable


    outcome, the end effect for a large application can be a significant increase
    in


    performance.


    273


    Most Probable First'
