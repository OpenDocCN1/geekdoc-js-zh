    <img alt="" src="phpOpenTracker/image.php?client\_id=1" />


    **The phpOpenTracker API**


    When you include the phpopentracker.php file in your script, you can use one


    of three methods:


    phpOpenTracker::log()


    As you’ve seen, this method instructs phpOpenTracker


    to log an entry in its database.


    phpOpenTracker::get()


    This method is used to build reports, including click


    path analysis.


    phpOpenTracker::plot()


    This method is used for drawing graphs from


