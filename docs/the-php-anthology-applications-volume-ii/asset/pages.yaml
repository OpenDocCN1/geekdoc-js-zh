  md: '1.


    In the directory on your system in which PHP is installed, you should find


    a subdirectory called dlls. These files need to be available in your system’s


    PATH environment variable, and are required for you to use PHP’s XML


    related functionality. The best approach is to modify your system’s PATH


    environment variable (from Control Panel > System > Advanced > Envir-


    onment Variables), and add the full path to this directory. Once you’ve done


    this, if your Web service is installed as a Windows service, you’ll need to


    restart your system for it to be able to find the DLL files. The alternative


    approach is to copy all the files in the dlls directory to your system32 dir-


    ectory (e.g. c:\\windows\\system32). This approach can be a little messy when


    it comes to upgrading PHP, though.


    2.


    Access your php.ini file and ensure that the extension\_dir is set to point


    to the extensions subdirectory of your PHP installation. Alternatively, copy


    the php\_domxml.dll and php\_xslt.dll files from that directory to the loc-


    ation to which the extension\_dir points.


    3.


    Modify the line containing ;extension=php\_domxml.dll and ;exten-


    sion=php\_xslt.dll under the \[Windows Extensions\] section. Remove the


    semicolons to uncomment those lines.


    4.


    Save the changes to php.ini, then restart your Web server.


    **About DOM**


    The first thing to realize is that the DOM XML extension is used a little differently


    than most of the PHP functions, as it’s object oriented and bears a close resemb-


    lance to the in-built PHP dir class you saw in Volume I, Chapter 4—albeit with


    much more complexity.


    What this means in practice is that, of the functions provided by this extension,


    the ones that will actually be available to you will depend on the part of the
    XML


    document with which you’re working.


    As the DOM extension still has experimental status as of PHP 4.3, the document-


    ation\[23\] in the PHP manual is minimal. So, be warned—you won’t find many


    examples of how to use it in the manual right now. There are also some cases in


    which the documentation is inaccurate, as it hasn’t caught up with the latest


    state of the extension, so you’ll need to stay on your toes when you’re working


    with DOM.


    \[23\] http://www.php.net/domxml


    83


    About DOM'
