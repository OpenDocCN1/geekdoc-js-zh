  md: 'MD5 string to obtain the original data); it’s a message digest algorithm. But


    if you don’t need to decrypt a value then use MD5, which is available through


    PHP’s md5 function. This allows you to compare the encrypted versions of


    two pieces of data (e.g. a stored password and that entered by a user), which


    avoids the risks involved in working with encrypted values that could possibly


    be decrypted by an attacker.


    K** Administration Flaws**


    Allowing an attacker to gain the same access you have to your site is clearly


    bad news. Avoid FTP and telnet in favor of SCP/SFTP and SSH, respectively.


    Linux distributions usually have the required client tools pre-installed. For


    Windows, check out putty\[6\] for SSH access and WinSCP\[7\] for SCP/SFTP.


    FTP and telnet expose your password to network sniffers. Make sure that any


    Web administration tools your host provides are used only over an SSL con-


    nection. If you’re using third party software, such as phpBB, change the default


    administrator password immediately, and stay informed about potential se-


    curity flaws.


    K** Configuration and Patching**


    When installing PHP, the configuration file php.ini-recommended makes


    the best starting point to make sure you’ve got the package configured cor-


    rectly.


    If you’re using a hosting company, they should take care of most of the issues


    for you, such as patching software as vulnerabilities are announced. Still, it’s


    worth staying up to date on your own, using sites like Security Focus\[8\] and


    others listed at DMOZ\[9\].


    More information is available at PHP Advisory\[10\] although, sadly, the site
    is


    no longer being maintained.


    \[6\] http://www.chiark.greenend.org.uk/~sgtatham/putty/


    \[7\] http://winscp.sourceforge.net/eng/


    \[8\] http://www.securityfocus.com/incidents/


    \[9\] http://dmoz.org/Computers/Security/Mailing\_Lists/


    \[10\] http://www.phpadvisory.com/


