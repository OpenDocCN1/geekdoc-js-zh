  md: 'The User class fetches data on a “need to know” basis. That is, it’s fairly
    safe to


    assume that the basic, available user information will be required shortly after


    instantiation; hence, the use of the populate method—otherwise, we wouldn’t


    have created the object in the first place. The data pertaining to permissions,


    however, may *not* be needed every time the User class is instantiated. It’s likely


    that we’ll only check permissions on a restricted number of pages, so we can save


    ourselves a query when the user views public pages, leaving the checkPermission


    method to be called explicitly as needed. This approach is known as **lazy fetching**,


    and can be a useful approach to reducing unnecessary queries and performance


    overhead.


    Having seen the class, let’s consider a demonstration. This login form script


    (13.php) is the same as 11.php, but it sends the post data to a different URL.


    Let’s look at a simple example of the permissions in action: first, we’ll include


    and set up the classes as usual, and put the new User class into action:


    File: **14.php**** (excerpt)**


    <?php


    // Include MySQL class


    require\_once ''Database/MySQL.php'';


    // Include Session class


    require\_once ''Session/Session.php'';


    // Include Auth class


    require\_once ''AccessControl/Auth.php'';


    // Include User class


    require\_once ''AccessControl/User.php'';


    $host = ''localhost''; // Hostname of MySQL server


    $dbUser = ''harryf''; // Username for MySQL


    $dbPass = ''secret''; // Password for user


    $dbName = ''sitepoint''; // Database name


    // Instantiate MySQL connection


    $db = &new MySQL($host, $dbUser, $dbPass, $dbName);


    // Instantiate the Authentication class


    $auth = &new Auth($db, ''13.php'', ''secret'');


    // Instantiate the User class


    $user = &new User($db);


    69


    How do I build a permissions system?'
