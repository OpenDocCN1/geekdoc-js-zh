  md: "There are a couple of factors that you should be aware of when considering\
    \ which\n\ndesign patterns can be applied in PHP 4:\n\nK Some of the problems\
    \ the GoF were aiming to address simply never raise their\n\nheads in the development\
    \ of Web-based applications for the Apache/PHP\n\nenvironment, where an application\
    \ remains memory-resident for only as long\n\nas it takes to build a Web page.\
    \ The Memento pattern is one such example.\n\nK PHP 4 doesn’t support some of\
    \ the features found in other languages (e.g.\n\nJava), such as static class member\
    \ variables. As such, trying to apply some\n\npatterns² results in awkward workarounds\
    \ that often cause more problems\n\nthan they solve. One of the main drivers behind\
    \ PHP 5 was to make PHP\n\nwell suited to design patterns.\n\nEnough said. Time\
    \ for some patterns!\n\n**The Factory Method**\n\nIn most programming languages\
    \ that support the object oriented paradigm, it’s\n\npossible to use class methods\
    \ or functions to create and return new objects. An\n\nexample in PHP might be:\n\
    \n<?php\n\n// A PHP Function which creates an object\n\nfunction &createSomeObject()\n\
    \n{\n\n return new SomeClass();\n\n}\n\n// Get an instance of SomeClass\n\n$someObject\
    \ = &createSomeObject();\n\nIt may be unclear why anyone would want to do what\
    \ we’ve done in this example.\n\nRest assured there are a number of specific problems\
    \ that can be solved with this\n\napproach, which is known as the **factory method**\
    \ pattern. The following situations\n\nand examples should make things clear.\n\
    \nImagine that you’re working on an application. Within it, you create objects\
    \ from\n\na given class in many places—including inside other classes. You’re\
    \ aware, however,\n\nthat there may be a need to use a different class at some\
    \ future time. If you use\n\na function or class method to create the object for\
    \ you, changing the class from\n\n2The Singleton pattern, for instance.\n\n313\n\
    \nThe Factory Method"
  merge: -1
  pgno: 331
- img_proc: true
  md: "which that object is created will require you to modify only the method that\n\
    \ncreates it.\n\nFor example, in Chapter 1 we developed the class Auth, which\
    \ creates an instance\n\nof the Session class:\n\nclass Auth {\n\n function Auth(&$db,\
    \ $redirect, $hashKey, $md5 = TRUE)\n\n {\n\n $this->db = &$db;\n\n $this->redirect\
    \ = $redirect;\n\n $this->hashKey = $hashKey;\n\n $this->md5 = $md5;\n\n**$this->session\
    \ = &new Session(); // Session created**\n\n $this->login();\n\n }\n\nWhat happens\
    \ if, instead, we use a function called createSession, to create the\n\nobject\
    \ for us? In that case, we can replace the Session class with some other class\n\
    \nof a different name without having to modify the Auth class:\n\nclass Auth {\n\
    \n function Auth(&$db, $redirect, $hashKey, $md5 = TRUE)\n\n {\n\n $this->db =\
    \ &$db;\n\n $this->redirect = $redirect;\n\n $this->hashKey = $hashKey;\n\n $this->md5\
    \ = $md5;\n\n**$this->session = &createSession(); // Fetch new object**\n\n $this->login();\n\
    \n }\n\nThis is particularly useful when writing unit tests that use mock objects\
    \ (see\n\nChapter 6). In this case, we can modify the behavior of the createSession\n\
    \nfunction in the test script so that MockSession is used by Auth, rather than\
    \ the\n\nreal Session class.\n\nAnother problem to which the factory method can\
    \ provide a solution occurs when\n\nthe choice of class will depend on *runtime*\
    \ circumstances that you can’t predict\n\nin advance. You might wish to avoid\
    \ writing conditional logic at the point at\n\nwhich the object is created, in\
    \ order to help keep the code maintainable and allow\n\nthe same conditions to\
    \ be used elsewhere in your application. Using a factory\n\nmethod, you can separate\
    \ the task of instantiating the objects from the code that\n\nneeds to use them.\n\
    \nChapter 7: Design Patterns\n\n314"
