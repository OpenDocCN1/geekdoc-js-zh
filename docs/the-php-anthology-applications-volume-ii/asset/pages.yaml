    \nrequire\\_once 'ExampleApps/Articles.php';\n\n// Application Logic Class\n\n\
    require\\_once 'ExampleApps/Article.php';\n\n// Presentation Logic Classes\n\n\
    require\\_once 'ExampleApps/ArticlesView.php';\n\nrequire\\_once 'ExampleApps/ArticleView.php';\n\
    \n$db = &new MySQL('localhost', 'harryf', 'secret', 'sitepoint');\n\nif (isset($\\\
