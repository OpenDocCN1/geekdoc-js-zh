    \ = array();\n\n $validators\\[\\] = new ValidateUser($\\_POST\\['user'\\]);\n\
    \n $validators\\[\\] = new ValidatePassword(array(\n\n $\\_POST\\['pass'\\], $\\\
    _POST\\['conf'\\]));\n\n $validators\\[\\] = new ValidateEmail($\\_POST\\['email'\\\
    ]);\n\n // Iterate over the validators, validating as we go\n\n341\n\nThe Strategy\
