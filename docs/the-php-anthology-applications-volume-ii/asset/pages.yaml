  md: "If you have a central script that’s included in every page a visitor views,\
    \ you can\n\nsimply watch for incoming events (e.g. a variable like $\\_GET\\\
    ['newPost'\\]) and\n\nhave some code respond by deleting the required cache files.\
    \ This keeps the cache\n\nfile removal mechanism central and easier to maintain.\
    \ You might also consider\n\nusing the php.ini setting auto\\_prepend\\_file to\
    \ include this code in every PHP\n\nscript.\n\n**Caching Function Calls**\n\n\
    In Chapter 2, we looked at accessing remote Web services with SOAP and XML-\n\n\
    RPC. Because Web services are accessed over a network, it’s often a very good\n\
    \nidea to cache results so that they can be fetched locally, rather than repeating\n\
    \nthe same slow request multiple times. A simple approach might be to use PHP\n\
    \nsessions, as we considered in that chapter, but as this solution operates on\
    \ a per\n\nvisitor basis, the opening requests for each visitor will still be\
    \ slow. This is where\n\nCache\\_Lite can come in very handy.\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_278_0.png)\n\
    \n**PEAR uses Cache\\_Lite**\n\nThe PEAR Web installer (see Appendix D) takes\
    \ advantage of Cache\\_Lite\n\nby caching the XML-RPC requests it makes to the\
    \ PEAR Web server.\n\nIn “How do I consume SOAP Web services with PHP?” in Chapter\
    \ 2, we built\n\na client for a SOAP Web service based on its WSDL file; the service\
    \ provided\n\nweather information for airports around the world. Here’s the code\
    \ that fetched\n\nthe data from the remote server:\n\n $countries = $stationInfo->listCountries();\n\
    \nand\n\n $country = $stationInfo->searchByCountry($\\_GET\\['country'\\]);\n\n\
    In both cases, these calls correspond to a request for data that’s made over the\n\
    \nnetwork. Using Cache\\_Lite\\_Function, we could cache the results so the data\n\
    \nreturned from the service could be reused; this would avoid unnecessary network\n\
    \ncalls and significantly improve performance. Note that we’re focusing on only\n\
    \nthe relevant code here. At the top, we include Cache\\_Lite\\_Function:\n\n\
    File: **5.php**** (excerpt)**\n\n// Include PEAR::Cache\\_Lite\\_Function\n\n\
    require\\_once 'Cache/Lite/Function.php';\n\nChapter 5: Caching\n\n260"
