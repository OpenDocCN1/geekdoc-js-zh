    \n{\n\n return preg\\_replace(\n\n \"#<a href=(\\\\\"|')http://(\\[^\\\\\"'\\\
    ]+)(\\\\\"|')#ime\",\n\n '\"<a href=\\\\\"$exitScript?url=\" . base64\\_encode(\\\
    \\'\\\\\\\\2\\\\') . \"\\\\\"\"'\n\n , $content);\n\n}\n\n$content = <<<EOD\n\n\
    This is some text containing a <a href=\"http://www.sitepoint.com/\"\n\n\\>link\
    \ to sitepoint.com</a>\n\nEOD;\n\n235\n\nHow do I track exit links?"
