  md: 'K A typical Web server, such as Apache, uses the time of file modification
    to


    correctly inform a Web browser of a requested page’s cache status. With dy-


    namic Web pages, the actual PHP script may change only occasionally, while


    the content it displays, which is perhaps fetched from a database, will change


    frequently. The Web server has no way of knowing about updates to the


    database, however, so it doesn’t send a last modified date. If the client


    (browser) has no indication of how long the data is valid, it will take a guess,


    which usually means it will request the same page again. The Web server will


    always respond with a fresh version of the page, regardless of whether the


    data has changed. To avoid this shortcoming, most Web developers use a


    meta tag or HTTP headers to tell the browser never to use a cached version


    of the page. However, this negates the Web browser’s natural ability to cache


    Web pages, and involves some serious disadvantages. For example, the content


    delivered by a dynamic page may change once a day, so there’s certainly a


    benefit to be gained by having the browser cache a page—even if only for


    twenty four hours.


    It’s usually possible to live with both problems given a small PHP application,


    but as the complexity of, and traffic to, your site increases, you may run into


    difficulties. However, both these issues *can* be solved, the first with **server
    side**


    **caching**, the second, by taking control of **client side caching** from within
    your


    application. The exact approach you use to solve the problem will depend on


    your application, but in this chapter, we’ll see how you can solve both using
    PHP


    and a number of class libraries from PEAR.


    Note that in this chapter’s discussions of caching, we’ll look at only those solutions


    implemented in PHP. These should not be confused with some of the script


    caching solutions that work on the basis of optimizing and caching compiled


    PHP scripts. Included in this group are the Zend Accelerator\[1\], iconCube PHP


    Accelerator\[2\], and Turck MMCache\[3\], the latter being the only accelerator


    that’s ready for use with Windows based PHP installations today.


    **How do I prevent Web browsers caching**


    **a page?**


    Before we look at the approaches you can take to client and server side caching,


    the first thing we need to understand is how to prevent Web browsers (and proxy


    \[1\] http://www.zend.com/store/products/zend-performance-suite.php


    \[2\] http://www.phpaccelerator.co.uk/


    \[3\] http://www.turcksoft.com/en/e\_mmc.htm


    Chapter 5: Caching


