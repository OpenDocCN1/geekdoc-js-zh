  md: " echo '<b>' . $row\\['title'\\] . '</b> by ' . $row\\['author'\\] .\n\n \"\
    <br />\\\\n\";\n\n}\n\n?>\n\nHere’s the same thing, using the PEARDBAdapter class:\n\
    \nFile: **11.php**\n\n<?php\n\n// Include the adapter classes\n\nrequire\\_once\
    \ 'Database/PEARDBAdapter.php';\n\n// Instantiate PEARDBAdapter connection\n\n\
    $db = &new PEARDBAdapter('localhost', 'harryf', 'secret',\n\n 'sitepoint');\n\n\
    // Perform query\n\n$sql = \"SELECT title, author FROM articles LIMIT 0,5\";\n\
    \n$result = &$db->query($sql);\n\n// Display some results\n\nwhile ($row = $result->fetch())\
    \ {\n\n echo '<b>' . $row\\['title'\\] . '</b> by ' . $row\\['author'\\] .\n\n\
    \ \"<br />\\\\n\";\n\n}\n\n?>\n\nNotice that all the code that appears after the\
    \ PEARDBAdapter is instantiated is\n\nexactly the same as it was when I used my\
    \ own MySQL class—even the constructor\n\narguments are the same! All I needed\
    \ to do was modify two lines of code (the\n\ninclude and the object creation);\
    \ the rest of my application could happily keep\n\non running. Now, with the power\
    \ of PEAR::DB at my disposal, I can modify my\n\napplication to run on any database\
    \ it supports.⁴.\n\nAs you can see, the adapter pattern offers a powerful technique\
    \ to help you mould\n\nthird party libraries for use in your own code—without\
    \ your needing to rewrite\n\nanything. Adapters can even be useful if you’re writing\
    \ brand new code that uses\n\na third party library, as they allow you to customize\
    \ the API to your needs. The\n\ntrick to using an adapter pattern is to find the\
    \ commonalities between the API\n\nyour code expects (or needs), and the API that\
    \ the third party library provides,\n\nthen use your adapter class as a translator\
    \ between the two.\n\n4The practical extent of this portability can depend on\
    \ other factors. For example, different databases\n\nsupport different forms of\
    \ SQL. For example, the LIMIT 0,5 in the query is not supported by most\n\ndatabases,\
    \ although recent versions of PostgreSQL do allow it.\n\nChapter 7: Design Patterns\n\
    \n346"
