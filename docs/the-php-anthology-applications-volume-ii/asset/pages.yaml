  md: "**New Password**\n\nAs I mentioned, if you’ve encrypted the password, you have\
    \ a different problem\n\nto solve. PHP’s md5 function provides one-way encryption;\
    \ once it’s scrambled,\n\nthere’s no getting it back! In such cases, if members\
    \ forget their passwords, you’ll\n\nhave to make new ones for them. You could\
    \ simply generate a random string of\n\ncharacters, but it’s important to remember\
    \ that if you make your security systems\n\ntoo unfriendly, you’ll put legitimate\
    \ users off.\n\nHere, we’ll add to the AccountMaintenance class some further methods\
    \ that can\n\ngenerate passwords, and subsequently modify the password stored\
    \ in the database.\n\nI’ve used a list of 1370 words, stored in a text file, to\
    \ build the memorable pass-\n\nwords. Be aware that if anyone knows the list of\
    \ words you’re using, cracking the\n\nnew password will be significantly easier,\
    \ so you should create your own list. First,\n\nlet’s look at the new class methods:\n\
    \nFile: **AccessControl/AccountMaintenance.php**** (in ****SPLIB****) (excerpt)**\n\
    \n /\\*\\*\n\n \\* Given a username / email combination, resets the password\n\
    \n \\* for that user and returns the new password.\n\n \\* @param string login\
    \ name\n\n \\* @param string email address\n\n \\* @return array of user details\
    \ or FALSE if failed\n\n \\* @access public\n\n \\*/\n\n function resetPassword($login,\
    \ $email)\n\n {\n\n $login = mysql\\_escape\\_string($login);\n\n $email = mysql\\\
    _escape\\_string($email);\n\n $sql = \"SELECT \" . USER\\_TABLE\\_ID . \",\n\n\
    \ \" . USER\\_TABLE\\_LOGIN . \", \" . USER\\_TABLE\\_PASSW . \",\n\n \" . USER\\\
    _TABLE\\_FIRST . \", \" . USER\\_TABLE\\_LAST . \"\n\n FROM\n\n \" . USER\\_TABLE\
    \ . \"\n\n WHERE\n\n \" . USER\\_TABLE\\_LOGIN . \"='$login'\n\n AND\n\n \" .\
    \ USER\\_TABLE\\_EMAIL . \"='$email'\";\n\n $result = $this->db->query($sql);\n\
    \n if ($result->size() == 1) {\n\n $row = $result->fetch();\n\n if ($password\
    \ = $this->generatePassword()) {\n\n $sql = \"UPDATE \" . USER\\_TABLE . \"\n\n\
    \ SET\n\n51\n\nNew Password"
