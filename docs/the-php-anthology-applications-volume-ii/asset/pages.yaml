  md: " \\*/\n\n function parse($html)\n\n {\n\n $this->parser->parse(nl2br($html));\n\
    \n }\n\n /\\*\\*\n\n \\* Adds any remaining text in the buffer then\n\n \\* returns\
    \ the ArticlePDF object\n\n \\* @return object instance of ArticlePDF\n\n \\*\
    \ @access public\n\n \\*/\n\n function getPdf()\n\n {\n\n $this->articlePDF->addText($this->buffer);\n\
    \n return $this->articlePDF;\n\n }\n\nThe internals of the class—the handler methods\
    \ themselves—look like this:\n\nFile: **XML/HTMLtoPDF.php**** (in ****SPLIB****)\
    \ (excerpt)**\n\n /\\*\\*\n\n \\* Opening tag event \"listener\"\n\n \\* @param\
    \ XML\\_HTMLSax instance of the parser\n\n \\* @param string HTML tag name\n\n\
    \ \\* @param array of tag attributes\n\n \\* @return void\n\n \\* @access private\n\
    \n \\*/\n\n function open($parser, $tag, $attr)\n\n {\n\n $tag = strtolower($tag);\
    \ // Convert tag to lower case\n\n switch ($tag) {\n\n case 'a':\n\n if (isset($attr\\\
    ['href'\\])) {\n\n $this->open = '<c:alink:' . $attr\\['href'\\] . '>';\n\n $this->close\
    \ = '</c:alink>';\n\n }\n\n break;\n\n case 'b':\n\n $this->open = '<b>';\n\n\
    \ $this->close = '</b>';\n\n break;\n\n case 'br':\n\n $this->articlePDF->addText($this->buffer);\n\
    \n $this->buffer = '';\n\nChapter 3: Alternative Content Types\n\n192"
