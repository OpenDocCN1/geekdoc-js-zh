    \ = 'SitePoint';\n\n$articleUrl = 'http://www.sitepoint.com/article/228';\n\n\
    $date = 'October 1st 2001\";\n\n// Get the intro from a text file\n\n$intro =\
    \ file('intro.txt');\n\n$intro = implode('', $intro);\n\n// Get the body from\
    \ a text file\n\n$body = file('body.txt');\n\n$body = implode('', $body);\n\n\
    $pdfArticle = new ArticlePDF($articleUrl, $fontPath);\n\n$pdfArticle->addInfo($title,\
    \ $author, $producer, $date);\n\n$pdfArticle->addTitlePage($title, $author, $date,\
