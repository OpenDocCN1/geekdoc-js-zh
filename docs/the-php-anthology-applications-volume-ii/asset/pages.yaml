    require\_once ''ThirdParty/rospdf/class.ezpdf.php'';


    Also notice the call to error\_reporting, which is necessary because the R&OS


    PDF library produces a lot of notices if you don’t suppress them (see Volume I,


    Chapter 10 for more on suppressing errors).


