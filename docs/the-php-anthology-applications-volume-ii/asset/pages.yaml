  md: '**XML**


    **2**


    XML, or **Extensible Markup Language**, is becoming an everyday tool for solving


    a whole range of Web-related issues, from exchanging data between sites with


    **RSS feeds**¹ or **Web services**, to new approaches for rendering Web pages,
    such


    as **Extensible Stylesheet Language Transformations** (XSLT).


    What it all boils down to, though, is that XML is simply a set of rules for creating


    structured documents in plain text. The purpose of XML is to provide a platform-


    and language-independent technology for exchanging data between systems. In


    this chapter, we’ll examine some examples in which we’ll generate and read XML


    with PHP. In the process, we’ll solve some of the common problems you’re likely


    to encounter in modern Web development.


    I’ll assume you have a basic understanding of XML. If you’re new to all this,
    I’d


    recommend you read the article, *Introduction to XML*\[1\], and the others listed
    at


    the end of this chapter, to gain the necessary background.


    ![](img/a381b8313756f8d5eb75f79b6057b90e_97_0.png)


    **A Useful Tool**


    An excellent (and free) tool to help you work with XML is Mozilla’s DOM


    Inspector. It’s bundled with the default Mozilla browser distribution, and


    1RSS can stand for RDF Site Summary, Rich Site Summary, or Really Simple Syndication,
    depending


    on who you ask.


    \[1\] http://www.sitepoint.com/article/930'
