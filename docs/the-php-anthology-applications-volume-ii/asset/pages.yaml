  md: '**Caching**


    **5**


    In the good old days, back when building Websites was as easy as knocking up


    a few HTML pages, the delivery of a Web page to a browser was a simple matter


    of having the Web server fetch a file. A site’s visitors would see its small,
    text-


    only pages almost immediately, unless they were using particularly slow modems.


    Once the page was downloaded, the browser would **cache** it somewhere on the


    local computer so that, should the page be requested again, after performing a


    quick check with the server to ensure the page hadn’t been updated, the browser


    could display the locally cached version. Pages were served as quickly and effi-


    ciently as possible, and everyone was happy (except those using 9600 bps mo-


    dems).


    The advent of dynamic Web pages spoiled the party, effectively “breaking” this


    model of serving pages by introducing two problems:


    K When a request for a dynamic Web page is received by the server, some inter-


    mediate processing, such as the parsing of scripts by the PHP engine, must


    be completed. This introduces a delay before the Web server begins to deliver


    the output to the browser. For simple PHP scripts this may not be significant,


    but for a more complex application, the PHP engine may have a lot of work


    to do before the page is finally ready for delivery. This extra work results in


    a noticeable lag between the users’ requests and the actual display of pages


    in their browsers.'
