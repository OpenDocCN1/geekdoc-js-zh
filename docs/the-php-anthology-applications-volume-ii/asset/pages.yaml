  md: "may sound vague, but think of it this way: imagine that you had a class that\
    \ was\n\nable to build HTML tables from a database result set, an XML document,\
    \ a text\n\nfile, a directory, or just a plain old array *without needing to modify\
    \ the code* of the\n\ntable-generating class. Using iterators, such a thing is\
    \ possible. Iterators allow\n\nyou to write a table-generating class that could\
    \ be reused to display many different\n\ntypes of data from different sources.\n\
    \nTo begin with, let’s consider the normal process of looping through an array:\n\
    \nFile: **3.php**\n\n<?php\n\n$colors = array('red', 'green', 'blue');\n\necho\
    \ '<b>First iteration:</b><br />';\n\nforeach ($colors as $color) {\n\n echo $color\
    \ . '<br />';\n\n}\n\necho '<b>Second iteration:</b><br />';\n\nforeach ($colors\
    \ as $color) {\n\n echo $color . '<br />';\n\n}\n\n?>\n\nThe foreach construct,\
    \ which is built into PHP, effectively acts as a simple iter-\n\nator. It steps\
    \ through an array element by element, and, when it reaches the end\n\nof the\
    \ array, it automatically returns to the start. This explains why it’s possible\n\
    \nto use foreach twice without needing to use PHP’s reset function to reset the\n\
    \n**array pointer** in the above example. Unfortunately, this won’t work for an\
    \ object\n\nfor which you’ve defined your own data accessing methods.³\n\nHere’s\
    \ an example that allows me to achieve the same result using a method that\n\n\
    will perform the iteration for me:\n\nFile: **4.php**** (excerpt)**\n\n<?php\n\
    \nclass Colors {\n\n // An array where the colors are stored\n\n var $colors;\n\
    \n function Colors()\n\n {\n\n3At least, not with PHP 4; with PHP 5, a new extension,\
    \ known as the Standard PHP Library (SPL),\n\nwill make it possible to access\
