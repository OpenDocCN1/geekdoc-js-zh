    \ in the rest of the code of this script, you’ll find it in the code\n\narchive\
    \ for this chapter.\n\n**Security and Authentication in Web Services**\n\nOne\
    \ point you should be aware of when dealing with Web services is that you\n\n\
    may well need to consider the security implications. Do you want all users (and\n\
    \ntheir dogs) fetching content from your site and displaying it on theirs? You\n\
    \nprobably want some kind of authentication mechanism so that only permitted\n\
    \nsites can fetch your content. If the content that’s being sent is confidential,\
    \ or\n\nyou’re using an authentication system and you’re worried about a user\
    \ “sniffing”\n\nlogin credentials, you’ll need to make sure that the conversation\
    \ is encrypted.\n\nSolving these problems is best handled using the mechanisms\
    \ that are already\n\navailable with HTTP, namely SSL to encrypt conversations,\
    \ and HTTP authen-\n\ntication (which you saw in Chapter 1) to “wrap up” a Web\
    \ service in an environ-\n\nment that requires authentication.\n\n165\n\nSecurity\
    \ and Authentication in Web Services"
