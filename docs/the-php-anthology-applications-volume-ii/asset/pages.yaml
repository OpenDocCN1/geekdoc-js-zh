  md: " // Fetch the author with the $article object as the context node\n\n $author\
    \ = &$ctx->xpath\\_eval(\"spt:author/text()\", $article);\n\n // Display the content\n\
    \n echo '- ' . $title->nodeset\\[0\\]->content . ' (' .\n\n $author->nodeset\\\
    [0\\]->content . ')<br />';\n\n}\n\nNotice the three separate XPath statements\
    \ here. The first, as before, searches\n\nfrom the root element. This time, it\
    \ fetches all the spt:article nodes in the\n\ndocument. The script then loops\
    \ through this node set, using each spt:article\n\nas the **context** for two\
    \ additional queries: one fetching the text of the spt:title,\n\nthe other, the\
    \ text of the spt:author. As these queries only search a small piece\n\nof the\
    \ XML document (a single article), they’re very quick and efficient when\n\ncompared\
    \ with the relatively laborious whole-document search for articles.\n\nThe result\
    \ is a list of the articles, their titles, and their authors, as shown in Fig-\n\
    \nure 2.6.\n\n**Figure 2.6. Success with XPath**\n\n![](img/a381b8313756f8d5eb75f79b6057b90e_144_0.png)\n\
    \nAs you can see, XPath provides for fetching nodes from an XML document a\n\n\
    more nimble mechanism than the bulky DOM API, thanks in large part to its\n\n\
    ability to perform queries from any location in the document.\n\nIn addition to\
    \ sets of elements and tag contents, XPath can also fetch attribute\n\nvalues.\
    \ For example, this script fetches the href attribute of every a tag in the\n\n\
    document:\n\nFile: **12.php**\n\n<?php\n\n// Get the contents of the XML document\n\
    \n$articles = file('articles.xml');\n\n$articles = implode('', $articles);\n\n\
    // Instantiate a DOM Document from the file\n\n$dom = domxml\\_open\\_mem($articles);\n\
    \nChapter 2: XML\n\n126"
