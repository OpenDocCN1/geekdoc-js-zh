  md: '# # Introducing AmpersandView


    As I mentioned Backbone views are very limited in scope — quite intentionally
    so. The following explanation is pulled straight from the Backbone docs:


    > > Backbone views are almost more convention than they are code — they don''t
    determine anything about your HTML or CSS for you, and can be used with any JavaScript
    templating library. The general idea is to organize your interface into logical
    views, backed by models, each of which can be updated independently when the model
    changes, without having to redraw the page.


    Backbone''s general approach is to provide some simple components and patterns,
    and it''s up to you to apply them as you wish. This non-prescriptive flexibility
    is a big reason why Backbone has become as popular as it has.


    However, as you start to build more and more apps you find yourself solving similar
    problems over and over. In pure Backbone projects we found ourselves always creating
    a `BaseView` that contained a lot of the common helpers and patterns we wanted
    in all our views, and we used that to build all our views in the app. One day
    I found myself copying and pasting one of the `BaseView`s from one project to
    another, and just decided to put in on npm instead.


    That''s how AmpersandView was born. It''s like a Backbone view but it gives us
    a few additional goodies.


    Specifically, it gives us the following:'
  merge: -1
