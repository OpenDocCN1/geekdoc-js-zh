    2. Run the generator and answer its questions: `humanjs`\n3. Run the generated\
    \ app and visit `http://localhost:3000/test` in a browser\n\nAs I mentioned, we\
    \ still have a lot of work to do in making SpaceMonkey a well-structured standalone\
    \ library. But it seemed useful and functional enough to include.\n\nAnd if nothing\
    \ else, the general idea might be enough to tempt you to build it :)\n\n# Unit\
    \ testing modules that require a browser\n\nFor tests that are not QA, but are\
    \ in fact unit tests, you need a way to write tests that will run in a browser\
    \ and ideally, we'd be able to run them from"
  merge: -1
  pgno: 94
- img_proc: true
  md: "the command line.\n\nTurns out, we can. Using a set of tools developed largely\
    \ by [James Halliday](https://github.com/substack), a.k.a “substack”.\n\nHere's\
    \ a sample from ampersand-state:\n\n```\nvar test = require('tape');\nvar State\
    \ = require('../ampersand-state');\n\nvar Person = State.extend({\n    props:\
    \ {\n        name: 'string'\n    }\n});\n\ntest('init with values', function (t)\
    \ {\n    var person = new Person({name: 'henrik'});\n    t.ok(person);\n    t.equal(person.name,\
    \ 'henrik');\n    t.end();\n});\n\ntest('after init, change should be empty until\
    \ a set op', fun\n    var person = new Person({name: 'phil'});\n    t.deepEqual(person._changed,\
    \ {});\n    t.notOk(person.changedAttributes());\n    t.end();\n});\n```\n\nThe\
    \ “tape” module is capable of running in the browser or the server with browserify.\n\
    \nSo, with the help of a few handy dev dependencies, we can run our tests in phantom.js,\
    \ or in a browser.\n\nFirst, run the following to install a few dependencies we’ll\
    \ need:\n\n```\nnpm i --save-dev run-browser browserify tape-run\n```"
  merge: -1
  pgno: 95
- img_proc: true
  md: "This will install them and save them as `devDependencies` in your package.json.\n\
    \nNext, we can add some scripts to our package.json like this:\n\n```\n\"scripts\"\
    : {\n  \"start\": \"run-browser test/index.js\",\n  \"test\": \"browserify test/index.js\
    \ | tape-run\"\n},\n```\n\nWith this setup we can run `npm start` and open `localhost:3000`\
    \ in whatever browser we want to run the tests in.\n\nWe can also just run `npm\
    \ test` and it will run it with phantom.js (which you may have to go install separately\
    \ if you don't already have it) and you should see the same type of output in\
    \ your terminal.\n\nThis output format is a standard test output format called\
    \ [TAP](https://testanything.org/).\n\nAs a result, there are various tools to\
    \ dress up that output. So, if you want prettier terminal output, you can also\
    \ install `tap-spec` from npm and update your “test” script to look like this:\n\
    \n```\n\"test\": \"browserify test/index.js | tape-run | tap-spec\"\n```\n\nBy\
    \ using tape and writing tests in this way, we can also use a service like [testling](https://ci.testling.com/)\
    \ that runs our tests in different browsers for us.\n\nTestling can be configured\
    \ to automatically run our test suite using the list of browsers that we specify\
    \ each time we push to github. This approach is extremely helpful when developing\
    \ small modules for use in a browser. See the [testling quick start guide](https://ci.testling.com/guide/tutorial)\
    \ for more info on how to set this up for your project."
