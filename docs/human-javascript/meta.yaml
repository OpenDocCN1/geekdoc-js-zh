    structure your HTML and often violate separation of concerns.


    +   4. Model state is completely decoupled from view state (no Knockout.js).

    Again, this is to separate concerns.

    5. You should not have to be a JavaScript rockstar to edit templates.

    Templates in separate files with very little logic allows designers to edit

    templates without having to know how everything works.

    6. The DOM is simply a view of the state and reacts to changes in the

    model layer.

    7. Simple, decoupled file structures with lots of components that solve

    one problem.

    8. As little magic as possible (no Ember). Similar to Item 1 this is

    primarily to avoid requiring too much framework-specific knowledge.

    Which brings us to the next point.

    9. People who already know JavaScript should be able to work on the

    app without lots of knowledge about a specific tool or framework.

    10. The inverse of the previous point should also be true in that people

    who learn how the app works, should accidentally learn how JavaScript

    works in the process.

    11. It should play nicely in a team environment using version control (no

    giant files).

    12. Every piece of functionality should have an obvious “home.” Structure,

    structure, structure. This makes it easy to jump into old code to fix

    bugs or to jump from project to project.

    13. The project should have a set of code style standards that are

    enforceable by an automated process. This encourages readability

    and consistency throughout the codebase. It centralizes code style

    arguments around an enforceable standard. We find that this

    minimizes a lot of back-and-forth about code style because it becomes

    a simple automated pass or fail.

    14. It should be flexible enough to really be able to build anything you want

    without sending a bunch of unused code to the browser.'
- md: "# Now let’s dive in.\n\n# Client or server? Go big or go home.\n\nAs someone\
    \ who writes lots of JavaScript, you might think I'd advocate that everything\
    \ should be a single-page app. In short: No.\n\nMake things as simple as you possibly\
    \ can. Programming is complex, expensive, and time consuming. Pragmatism is the\
    \ only way to finish anything.\n\nFor many types of applications, building a single-page\
    \ app is harder and gives you no additional value. I do think there will be a\
    \ day when that's no longer the case. But we're not there yet.\n\nSo, instead,\
    \ think about how you want your app to be used. Is it something that a user is\
    \ going to load once and leave sitting on their desktop all day? Or is it something\
    \ that's quickly referenced and then closed?\n\nAs engineers we over-engineer\
    \ things ALL THE TIME. Just think how many blogs hit a database with each and\
    \ every request when really they could just be static HTML, generated from markdown\
    \ or something (example: Jekyll).\n\nBuilding client-side apps is often more complicated\
    \ than a server-side rendered app. Decide carefully. Ask yourself, is there additional\
    \ benefit for your users? Are you building something that is opened and closed\
    \ frequently, or are you building an experience? How often does the data in the\
    \ application change? Do you care if it changes while the app is open?\n\n# So\
    \ I didn’t talk you out of it? Ok, then go all out!\n\nSo you've heard of \"separation\
    \ of concerns\". We're taught to build tools and components that have a simple\
    \ job and are self-contained. It makes code more reusable and more maintainable,\
    \ and keeps developers more sane.\n\nHOWEVER, the first thing people most commonly\
    \ do when building web apps is render a bunch of HTML on the server, then send\
    \ it to the client and start shuffling it around with a bunch of JavaScript! Just\
    \ like that we've coupled server and client code because both of them now have\
    \ to care about rendering and presentation.\n\nPick one or the other, seriously.\
    \ If you’re building an “app” where a significant portion of the data will be\
    \ rendered on the client, just freakin’ render *all* of it on the client. Don't\
    \ mess around. It's just ugly to have to send a bunch of partially rendered HTML\
    \ to the client and then start mucking around with it.\n\nOne of my favorite things\
    \ to show developers from the And Bang codebase is the HTML we send to the browser.\
    \ Here it is... in its entirety as of this writing:\n\n```\n<!DOCTYPE html>\n\
    <!-- served with <3, &yet -->\n<script>window.times = {start: new Date};</script>\n\
    <link href=\"/&!.css\" rel=\"stylesheet\">\n<script src=\"/&!.js\"></script>\n\
    ```\n\nYup. (And yes, omitting `<html>`, `<head>`, and `<body>` is allowed by\
    \ the HTML specs.)\n\nAm I crazy? Probably.\n\n*But*, if we've decided that we\
    \ want our server to be able to focus on data we might as well transfer as much\
    \ of the rendering and presentation of client, to the client.\n\nOk, I'll admit\
    \ it, some of this extreme minimalism is due to the aesthetic of it. But, it also\
    \ makes it abundantly clear that it's the client's responsibility to render the\
    \ application and manage everything within it, including things like the page\
    \ title and life-cycle of all the document elements.\n\nSome devs advocate partial\
    \ rendering on the server for faster load times, etc. To me, once we recognize\
    \ we're building a “thick” client, we might as well render it all there. Otherwise,\
    \ if part of our page state is rendered on the server, somehow we have to re-translate\
    \ the HTML into state information. Again, I prefer an explicit separation of concerns.\n\
    \nI can hear the screams now, “What about load times and performance?!?!” I'd\
    \ rather optimize how my application runs once it's loaded, than shave milliseconds\
    \ off the time required to download the initial app. Also, let's keep in mind\
    \ that the shiny, retina-ready logo or the the background texture images you used\
    \ is likely to take up as much bandwidth as your entire application. Anyway, if\
    \ your app is contained in a single file (more on that later) it's fairly simple\
    \ to minify, version, and tell the browser to cache it permanently so your app\
    \ only downloads it once per revision.\n\nAlso, if you're pragmatic about this,\
    \ then you'll recognize that at some point you're probably going to render some\
    \ kind of signup or login form. If you're sneaky, you could use the inevitable\
    \ time the user is going to spend on that page the first time to download the\
    \ app so that when users are logged in they'll already hit it with a primed cache,\
    \ even on the first load!\n\nI'll cover some more tools and approaches for this\
    \ in Chapter 4 when discussing code organization.\n\n# Writing code for humans.\n\
    \n- Code is read more often than it's written.\n- If you're too clever, you'll\
    \ forever own the project because no one else will know what the heck you're doing.\
    \ That will suck, and so will your project.\n- As the requirements change and\
    \ evolve (as they most certainly will), your ability to quickly read and understand\
    \ the various pieces of your app will dramatically affect how quickly you can\
    \ change course.\n\nAll of this is to say: WRITE CODE THAT IS EASY TO READ!\n\n\
    # Tools and trickery\n\nYou with me? Ok, but how do you actually do this?\nWell,\
    \ let me give you a silly example:\n\n```\n// Assume this is an array of strings\
    \ from somewhere\nvar myArray = ['hello', 'something', 'awesome'];\nif (~myArray.indexOf('hello'))\
    \ {\n    // Under what circumstances does this get called?\n}\n```\n\nCan you\
    \ explain to me, in plain English, what that tilde does? If you can, good for\
    \ you, but do you think your whole team can?\n\nNow, compare it to this:\n\n```\n\
    // Same array:\nvar myArray = ['hello', 'something', 'awesome'];\nif (myArray.indexOf('hello')\
    \ !== -1) {\n    // Certainly a bit clearer, right?\n}\n```\n\nOr even this, using\
    \ Underscore:\n\n```\n// Same array:\nvar myArray = ['hello', 'something', 'awesome'];\n\
    if (_(myArray).contains('hello')) {\n    // Also pretty freakin' clear!\n}\n```\n\
    \nFrankly, I think the first example looks better, visually. In fact, I sometimes\
    \ use the first when working on a library that isn't meant to be a team project.\
    \ However, if I'm working on an app that other people will be working on with\
    \ me, I will write it the second way, because it's more explicit and requires\
    \ less of the other developers who may not be familiar with the syntax in the\
    \ first example.\n\n# Cleverness is a double edged sword\n\nBeing clever is sometimes\
    \ a good thing. But as was so aptly put by Paddy Foran cleverness for the sake\
    \ of cleverness should be avoided at all costs.\n\nThe goal should always be clarity\
    \ and readability.\n\n# Code Linting\n\nAs with readability, code conventions\
    \ and format should be consistent throughout the project. In practice, if you\
    \ have multiple people involved in a project, this can be hard.\n\nSemicolons,\
    \ tabs, and spaces are contentious things among developers. Every developer I've\
    \ ever met has opinions (usually strongly held) about code style.\n\nIf you're\
    \ building large JS apps and not doing some form of static analysis on your code,\
    \ you're asking for trouble. It helps catch silly errors and forces code style\
    \ consistency. Ideally, no one should be able to tell who wrote what part of your\
    \ app. If you're on a team, it should all be uniform within a project. How do\
    \ you do that? We use a slick tool written by [Nathan LaFreniere](https://github.com/nicholasf)\
    \ on our team called, simply, [precommit-hook](https://github.com/nicholasf/precommit-hook).\
    \ So all we have to do is add \"precommit-hook\" to our list of dependencies (in\
    \ a Node project).\n\nWhat it does is install a git pre-commit hook in the project\
    \ that uses JSHint to check your project for code style consistency before each\
    \ commit. Once upon a time there was a tool called JSLint written by Douglas Crockford.\
    \ Nowadays there's a less strict, more configurable version of the same project\
    \ called [JSHint](http://www.jshint.com/).\n\nThe neat thing about the npm version\
    \ of JSHint is that if you run it from the command line it will look for a configuration\
    \ file (.jshintrc) and an ignore file (.jshintignore), both of which the precommit\
    \ hook will create for you if they don't exist. You can use these files to configure\
    \ JSHint to follow the code style rules that you've defined for the project. This\
    \ means that you can now run `jshint .` at the root of your project and lint the\
    \ entire thing to make sure it follows the code styles you've defined in the `.jshintrc`\
    \ file. Awesome,"
  mdcn: "\n# 现在，让我们深入探讨。\n\n# 选择客户端还是服务器端？要么全力以赴，要么干脆放弃。\n\n作为一名编写大量 JavaScript 的人，你可能认为我会主张一切都应该做成单页应用。简而言之：并非如此。\n\
    \n要尽可能地将事情简化。编程是复杂的、昂贵的、耗时的。实用主义是完成任何事情的唯一途径。\n\n对于许多类型的应用程序来说，构建单页应用更难，而且不会带来额外的价值。我确实相信会有那么一天情况不再如此。但目前还不是。\n\
    \n因此，反过来，想想你希望你的应用如何被使用。它是那种用户加载一次，然后就让它整天停留在桌面上的东西吗？还是那种快速查阅一下然后就关闭的东西？\n\n作为工程师，我们总是在过度设计。想想看，有多少博客在每一次请求时都要查询数据库，而实际上它们完全可以是从\
    \ Markdown 之类的东西生成的静态 HTML（例如：Jekyll）。\n\n构建客户端应用通常比构建服务器端渲染的应用更复杂。请仔细决定。问问自己，这对你的用户有额外的好处吗？你构建的是一个会被频繁打开和关闭的东西，还是在构建一种体验？应用程序中的数据变化频率如何？你是否在意应用打开时数据发生变化？\n\
    \n# 所以我没说服你放弃？好吧，那就全力以赴！\n\n你听说过“关注点分离”。我们被教导要构建功能单一、自包含的工具和组件。这使代码更具可重用性和可维护性，也能让开发者更理智。\n\
    \n然而，人们在构建 Web 应用时最常做的一件事，就是在服务器上渲染一堆 HTML，然后把它发送到客户端，并用一堆 JavaScript 开始摆弄它！就这样，我们将服务器和客户端代码耦合在了一起，因为现在双方都必须关心渲染和呈现。\n\
    \n请选择其中一种，说真的。如果你正在构建一个“应用”，其中很大一部分数据将在客户端渲染，那就直接把*所有*渲染工作都放在客户端完成。别再犹豫了。把一堆部分渲染好的\
    \ HTML 发送到客户端，然后再开始折腾它，这太难看了。\n\n我最喜欢向开发者展示的 And Bang 代码库中的一样东西，就是我们发送给浏览器的 HTML。它就在这里……截至撰写本文时的完整版本：\n\
    \n```\n<!DOCTYPE html>\n<!-- served with <3, &yet -->\n<script>window.times =\
    \ {start: new Date};</script>\n<link href=\"/&!.css\" rel=\"stylesheet\">\n<script\
    \ src=\"/&!.js\"></script>\n```\n\n是的。（而且，是的，HTML 规范允许省略 `<html>`、`<head>` 和 `<body>`\
    \ 标签。）\n\n我疯了吗？可能吧。\n\n*但是*，如果我们已经决定要让服务器能够专注于数据处理，那么我们不妨将尽可能多的渲染和呈现工作转移给客户端。\n\
    \n好吧，我承认，这种极致的简约部分是出于美学考虑。但这也清楚地表明，渲染应用程序并管理其中的所有内容（包括页面标题和所有文档元素的生命周期等）是客户端的职责。\n\
    \n一些开发者提倡在服务器上进行部分渲染，以加快加载速度等。对我来说，一旦我们认识到我们正在构建一个“厚”客户端，我们不如就把它全部放在那里渲染。否则，如果我们的页面状态的一部分是在服务器上渲染的，我们就必须以某种方式将\
    \ HTML 重新转换为状态信息。同样，我更喜欢明确的关注点分离。\n\n我现在就能听到尖叫声了，“加载时间和性能怎么办？！？！？！”我宁愿优化应用程序加载*后*的运行方式，而不是从下载初始应用所需的时间中削减几毫秒。另外，让我们记住，那个闪闪发光的、支持\
    \ Retina 显示的 logo 或者你使用的背景纹理图片，可能和你整个应用占用的带宽一样多。无论如何，如果你的应用包含在一个文件中（后面会详细讨论），那么对其进行压缩、版本控制并告诉浏览器永久缓存它是相当简单的，这样你的应用每个版本只需要下载一次。\n\
    \n此外，如果你对此持实用主义态度，那么你会意识到在某个时候你可能需要渲染某种注册或登录表单。如果你足够机灵，你可以利用用户第一次访问该页面不可避免要花费的时间来下载应用，这样当用户登录时，他们就已经在一个预缓存的版本上访问了，即使是在第一次加载时！\n\
    \n我将在第 4 章讨论代码组织时介绍更多相关工具和方法。\n\n# 为人类编写代码。\n\n- 代码被阅读的次数远多于它被编写的次数。\n- 如果你过于聪明，你将永远拥有这个项目，因为其他人都不知道你到底在做什么。那会很糟糕，你的项目也会很糟糕。\n\
    - 随着需求的变化和演进（这是必然会发生的），你快速阅读和理解应用各个部分的能力将极大地影响你改变方向的速度。\n\n所有这些都意味着：编写易于阅读的代码！\n\
    \n# 工具与技巧\n\n跟上我了吗？好的，但你具体该怎么做呢？\n嗯，让我给你一个简单的例子：\n\n```\n// 假设这是来自某处的字符串数组\nvar\
    \ myArray = ['hello', 'something', 'awesome'];\nif (~myArray.indexOf('hello'))\
    \ {\n    // 什么情况下会调用这里？\n}\n```\n\n你能用通俗的英语解释一下那个波浪号（~）的作用吗？如果你能，那很好，但你认为你的整个团队都能吗？\n\
    \n现在，与这个比较一下：\n\n```\n// 同一个数组：\nvar myArray = ['hello', 'something', 'awesome'];\n\
    if (myArray.indexOf('hello') !== -1) {\n    // 当然更清晰一些，对吧？\n}\n```\n\n或者甚至这个，使用\
    \ Underscore 库：\n\n```\n// 同一个数组：\nvar myArray = ['hello', 'something', 'awesome'];\n\
    if (_(myArray).contains('hello')) {\n    // 同样非常清楚！\n}\n```\n\n坦率地说，我认为第一个例子在视觉上看起来更好。事实上，我有时在开发一个不打算作为团队项目的库时会使用第一个。然而，如果我正在开发一个其他人将与我一起工作的应用，我会用第二种方式编写它，因为它更明确，并且对可能不熟悉第一个例子中语法的其他开发人员要求更低。\n\
    \n# 聪明是一把双刃剑\n\n聪明有时是件好事。但正如 Paddy Foran 精辟指出的，为了聪明而聪明应该不惜一切代价避免。\n\n目标应该始终是清晰和可读性。\n\
    \n# 代码检查\n\n与可读性一样，代码规范和格式应在整个项目中保持一致。在实践中，如果有多人参与一个项目，这可能很难做到。\n\n分号、制表符和空格是开发者们争论不休的事情。我遇到过的每个开发者都对代码风格有意见（通常是强烈坚持的）。\n\
    \n如果你正在构建大型 JS 应用，而没有对代码进行某种形式的静态分析，那你就是在自找麻烦。它有助于捕获愚蠢的错误并强制保持代码风格的一致性。理想情况下，不应该有人能分辨出你的应用的哪个部分是谁写的。如果你在一个团队中，项目内的所有内容都应该是统一的。你该怎么做呢？我们使用一个由我们团队的\
    \ [Nathan LaFreniere](https://github.com/nicholasf) 编写的巧妙工具，简单地命名为 [precommit-hook](https://github.com/nicholasf/precommit-hook)。所以我们只需要在我们的依赖项列表中（在一个\
    \ Node 项目中）添加 “precommit-hook”。\n\n它的作用是在项目中安装一个 git pre-commit 钩子，该钩子使用 JSHint\
    \ 在每次提交前检查你的项目是否符合代码风格一致性。曾经有一个由 Douglas Crockford 编写的工具叫 JSLint。如今，同一项目有一个不那么严格、更可配置的版本叫做\
    \ [JSHint](http://www.jshint.com/)。\n\nnpm 版本的 JSHint 的一个巧妙之处在于，如果你从命令行运行它，它会寻找一个配置文件（.jshintrc）和一个忽略文件（.jshintignore），如果它们不存在，precommit\
    \ hook 会为你创建这两个文件。你可以使用这些文件来配置 JSHint 以遵循你为项目定义的代码风格规则。这意味着你现在可以在项目根目录运行 `jshint\
    \ .`，并对整个项目进行 lint 检查，以确保它遵循你在 `.jshintrc` 文件中定义的代码风格。太棒了，\n"
