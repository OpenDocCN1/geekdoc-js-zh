    the server.


    From now on, when I say “app” or “native HTML5 app” or “browser app” or “client
    app” within these pages, that is what I''m referring to.


    Here''s more food for thought: once you acknowledge that the browser has state,
    you really ought to think about how to keep that state up to date and make it
    a “realtime” application.


    # Realtime apps are human apps


    A lot of people get hung up on the term “realtime.” The way I''m using it here
    is not referring to latency or speed of delivery, it''s about the fact that there
    are multiple sources of data (usually people) doing stuff! People are changing
    the data all the time and our app isn''t passively waiting for the user to refresh.
    Instead the app keeps itself up to date. In reality, no web app is “hard real-time”
    as per computer science. In our case, it''s a term to'
  - '[PAGE 15]


    help describe apps that keep themselves up to date.


    Realtime isn''t about hype and technology – it''s about removing the friction
    of technology on collaboration and overcoming the confusion of keeping track of
    lots of state.


    The future of the web is realtime. Of this I have no doubt.


    The reason I can say this with such certainty is that it''s already happening
    under our noses.


    Facebook, Gmail, Google Talk, and GitHub just to name a few, have all implemented
    some form of automatic page updating. When they have something new to tell you,
    they don''t wait for you to ask for it. They push it out to you, from the server
    to the client.


    In some cases this is as simple as the page automatically polling to see if there''s
    something new. In other cases it''s more advanced, where all the data used to
    build and update the page is coming over an open WebSocket connection. For our
    purposes, the transport mechanism is largely irrelevant; the point is, data comes
    to you.


    This inherently breaks the statelessness of the web. It used to be that I hit
    a URL and got back a webpage. As a user I understood that the information on the
    page was (probably) accurate as of the time it was requested. If I wanted to check
    for something new, I''d go ask for it again and receive another snapshot in time.


    As soon as we make any effort to keep the information on the page in sync with
    the server, we''ve now acknowledged that the webpage has “state.” In some ways,
    the page always *had* state, but it was clear to users that it was snapshotted
    state, not up-to-date-synchronized state. As a result, that static page was more
    like a printed page than a living document.'
- md: 'One of the fundamental advantages that digital media has over print is that
    it''s no longer static. It''s dynamic, it''s fluid, and it can be updated as the
    information changes.


    So, as soon as we as developers decide that we want to do partial updates of the
    page, the only way we can do so is by knowing what information we currently have,
    and comparing it to what''s on the server. State duplication has occurred and
    we''re now maintaining “state” in some form in the client.


    As users get increasingly comfortable with that idea, I believe we''ll reach a
    point where always-current, self-updating information is the *expectation* rather
    than a surprise. Facebook with its chat, live comments, and push notifications
    is already conditioning an entire generation of users to expect realtime updates.
    I believe that knowing how to build realtime apps is a crucial skill for web developers
    who want to stay at the top of their field.


    Anytime you duplicate state, you increase complexity. Rather than worrying about
    just rendering some data correctly, you''re now caring about staleness, caching,
    and conflicts.


    If we step back a bit we start to realize what we''re actually building is a distributed
    system and as a result we''ll face all the same challenges that come with building
    distributed systems.


    I know what you''re probably thinking. Some framework is going to come along that
    solves this problem for me. You may be right, there are many different approaches
    to dealing with the problems of duplicated state. There are several emerging frameworks,
    such as Meteor and Derby, that aim to simplify the process of building apps that
    work this way.


    The challenge with some of those frameworks is that there''s a lot of emphasis
    on trying to share code and logic between the client and the server. In my opinion,
    client and server really should be performing fundamentally different roles. Servers
    are for data, clients are for presentation. It just makes for a clearer separation
    of concerns. A contrast to this is what my friend Owen Barnes was working on with
    SocketStream. It’s funny to see how we both ended up reaching very similar conclusions
    over the last few years. As he mentioned in his talk at RealtimeConf 2012, there
    likely isn’t going to be a “Rails of realtime.” The problems are simply too diverse.
    He’s since moved his focus elsewhere, but the conclusion seems to be building
    loosely coupled modular approaches and patterns that can be substituted as needed.
    Turns out, this is exactly what we ended up building with [Ampersand.js](https://github.com/AmpersandJS).


    Distributed systems, latency compensation, and state duplication are really complex
    problems. The way you solve complex problems is by *not* solving the complex problems.
    Instead, you break them down into smaller, simpler, solvable problems. Those solutions
    in aggregate can represent the complete solution.


    So, why bring the complexity of the server to the client and vice versa? In addition,
    when you try to share too much server code with a browser it’s very easy to fall
    into the trap of tightly coupling your application to that particular client.
    This makes it much harder to build other clients, say, for example, an iOS app
    for your app. While these frameworks are useful for standard desktop web apps,
    they let us down a bit when we want to go beyond that. With more and more talk
    of “the Internet of things” we have good reason to believe that the breadth of
    device types that want to talk to your app will continue to increase.


    ## Misconceptions, FUD and engineering


    We need to stop dumbing down the concept of “frontend” code. It’s getting better,
    but many self-described “real” developers still think browser code is sissy stuff.
    In their minds, the client is easy and it’s what the designer-y, non-developer
    folks do. That’s ridiculous.


    We’re not talking about rendering some HTML on the server and sprinkling on a
    few lines of jQuery. We’re talking about *engineering* a UI here.


    Unfortunately because of those preconceptions, many of the people who are being
    asked to build these kinds of apps don’t have a heavy engineering background and
    approach the task much like they would any other client code: write some jQuery.


    But, jQuery is not an application framework. It’s an abstraction layer and toolkit
    for working with the DOM. I’m not dogging on jQuery at all, in fact, I think it’s
    a great toolkit for DOM manipulation. I use it and am quite happy with it in many
    HTML5 apps. My point is simply that jQuery is a DOM toolkit, not an application
    framework.


    But, inevitably a “frontend” person is asked to build an immersive, complex client
    app and soon they end up with a 3500 line JavaScript file called “app.js” that
    does *everything*. Also, now no one else knows how any of it works, or how it’s
    structured. No one wins.


    To avoid those situations we have to approach it as an engineering task of building
    a performant, well-structured UI.


    ## Picking your tools


    There are more and more tools out there now to build client apps. AngularJS, Ember,
    Backbone, Sencha, Knockout, etc. all have their pros and cons.


    People in charge of development teams seem to agonize over the decision. They
    see these options as long term decisions with huge, long term ramifications and
    they don''t want to pick the wrong one. The awesome thing is this…they''re all
    JavaScript. So it''s not really *that* grave of a decision and switching to something
    else isn''t going to burn your whole business to the ground. The most important
    thing is that your team becomes familiar with building well-structured apps in
    JavaScript. That investment will be well worth it and will translate to new tools,
    if they come along.


    Decisions are time consuming and expensive. At &yet we''ve built and re-built
    applications with all kinds of different tools and approaches. The following pages
    contain the conclusions we''ve reached. They''re probably not for everyone but
    we''ve been quite happy with the results and they have made it possible for us
    to efficiently collaborate on clientside apps as a team. The approaches were picked
    with the following criteria:


    1.  Tools that are “just JavaScript.” Not tools where you describe your app in
    a DSL (no Sencha). This is to avoid requiring too much knowledge of the framework
    itself before being able to contribute. Focusing on JavaScript also offers some
    protection against investing too heavily in framework-specific knowledge.

    2.  Tools where you build the app by writing code in JavaScript files, not by
    trying to declare too much of your app logic in your HTML (no AngularJS, sorry).
    Having to write application logic inside of a template feels like a violation
    of separation of concerns. It has some short-term payoffs and can make simple
    things really easy. However, when you want more control it can be difficult to
    do within the constraints of the framework.

    3.  No monolithic, do-everything widget frameworks (no Sproutcore). These often
    make lots of assumptions about how you want to structure your HTML and often violate
    separation of concerns.

    4.  Model state is completely decoupled from view state (no Knockout.js). Again,
    this is to separate concerns.

    5.  You should not have to be a JavaScript rockstar to edit templates. Templates
    in separate files with very little logic allows designers to edit templates without
    having to know how everything works.

    6.  The DOM is simply a view of the state and reacts to changes in the model layer.

    7.  Simple, decoupled file structures with lots of components that solve one problem.

    8.  As little magic as possible (no Ember). Similar to Item 1 this is primarily
    to avoid requiring too much framework-specific knowledge. Which brings us to the
    next point.

    9.  People who already know JavaScript should be able to work on the app without
    lots of knowledge about a specific tool or framework.

    10. The inverse of the previous point should also be true in that people who learn
    how the app works, should accidentally learn how JavaScript works in the process.

    11. It should play nicely in a team environment using version control (no giant
    files).

    12. Every piece of functionality should have an obvious “home.” Structure, structure,
    structure. This makes it easy to jump into old code to fix bugs or to jump from
    project to project.

    13. The project should have a set of code style standards that are enforceable
    by an automated process. This encourages readability and consistency throughout
    the codebase. It centralizes code style arguments around an enforceable standard.
    We find that this minimizes a lot of back-and-forth about code style because it
    becomes a simple automated pass or fail.

    14. It should be flexible enough to really be able to build anything you want
    without sending a bunch of unused code to the browser.'
  mdcn: '

    数字媒体相对于印刷品的一个根本优势在于它不再是静态的。它是动态的、流动的，并且可以随着信息的更新而更新。


    因此，一旦我们作为开发者决定对页面进行部分更新，我们唯一能做的就是了解我们当前拥有的信息，并将其与服务器上的信息进行比较。状态复制已经发生，我们现在以某种形式在客户端维护着“状态”。


    随着用户对这个概念越来越熟悉，我认为我们会达到这样一个阶段：总是最新的、自动更新的信息是*期望之中的*，而非意外惊喜。Facebook的聊天、实时评论和推送通知已经在培养整整一代用户期待实时更新的习惯。我相信，对于希望保持行业领先地位的Web开发者来说，知道如何构建实时应用是一项至关重要的技能。


    每次你复制状态，你都会增加复杂性。你不再仅仅担心正确地渲染某些数据，现在你还要关心数据的过期、缓存和冲突。


    如果我们稍作退后，开始意识到我们实际上构建的是一个分布式系统，因此我们将面临构建分布式系统时带来的所有相同挑战。


    我知道你可能在想什么。某个框架会出现并为我解决这个问题。你可能是对的，处理状态复制问题有许多不同的方法。有一些新兴的框架，如Meteor和Derby，旨在简化构建此类应用的过程。


    其中一些框架的挑战在于，它们过分强调在客户端和服务器端之间共享代码和逻辑。在我看来，客户端和服务器端确实应该扮演根本不同的角色。服务器端用于数据，客户端用于展示。这有助于实现更清晰的关注点分离。与此形成对比的是我的朋友Owen
    Barnes在SocketStream上的工作。有趣的是，在过去几年里，我们最终得出了非常相似的结论。正如他在2012年RealtimeConf的演讲中提到的，可能不会出现实时的“Rails”。问题实在太多样化了。他后来将关注点转移到了其他地方，但结论似乎是构建松散耦合的模块化方法和模式，以便根据需要进行替换。事实证明，这正是我们最终用[Ampersand.js](https://github.com/AmpersandJS)构建出来的东西。


    分布式系统、延迟补偿和状态复制都是非常复杂的问题。解决复杂问题的方法*不是*直接解决复杂问题。相反，你需要将它们分解成更小、更简单、可解决的问题。这些解决方案的集合可以代表完整的解决方案。


    那么，为什么要把服务器端的复杂性带到客户端，反之亦然？此外，当你试图在浏览器中共享太多服务器代码时，很容易陷入将应用程序与特定客户端紧密耦合的陷阱。这使得构建其他客户端（例如，为你的应用构建一个iOS应用）变得更加困难。虽然这些框架对于标准的桌面Web应用很有用，但当我们想超越这些时，它们就有点力不从心了。随着越来越多关于“物联网”的讨论，我们有充分的理由相信，希望与你的应用通信的设备类型的广度将继续增加。


    ## 误解、担忧和工程化


    我们需要停止贬低“前端”代码的概念。情况正在好转，但许多自诩为“真正的”开发者仍然认为浏览器代码是小儿科。在他们看来，客户端很简单，是那些偏设计、非开发者的人做的事。这太荒谬了。


    我们讨论的不是在服务器上渲染一些HTML然后撒上几行jQuery。我们讨论的是在这里*工程化*一个UI。


    不幸的是，由于这些先入为主的观念，许多被要求构建这类应用的人并没有深厚的工程背景，他们处理任务的方式就像处理其他任何客户端代码一样：写一些jQuery。


    但是，jQuery不是应用框架。它是一个用于处理DOM的抽象层和工具包。我完全不是在贬低jQuery，事实上，我认为它是一个很棒的DOM操作工具包。我在许多HTML5应用中使用它，并且非常满意。我的重点仅仅是jQuery是一个DOM工具包，而不是应用框架。


    但是，不可避免地，“前端”人员会被要求构建一个沉浸式、复杂的客户端应用，很快他们就会得到一个3500行的JavaScript文件，名为“app.js”，它做了*所有*的事情。而且，现在没有其他人知道它是如何工作的，或者它的结构是怎样的。没有赢家。


    为了避免这种情况，我们必须将其作为构建高性能、结构良好的UI的工程任务来对待。


    ## 选择你的工具


    现在有越来越多的工具可用于构建客户端应用。AngularJS、Ember、Backbone、Sencha、Knockout等都有各自的优缺点。


    负责开发团队的人似乎在这个决定上很痛苦。他们将这些选项视为具有巨大、长期影响的长期决策，他们不想选错。最棒的是……它们都是JavaScript。所以这并不是*那么*严重的决定，切换到其他东西也不会让你的整个业务付之一炬。最重要的是，你的团队熟悉使用JavaScript构建结构良好的应用。这项投资将是值得的，并且可以转化到新的工具上（如果它们出现的话）。


    决策既耗时又昂贵。在&yet，我们使用各种不同的工具和方法构建和重建了应用程序。接下来的页面包含我们得出的结论。它们可能并不适合所有人，但我们对结果相当满意，它们使我们能够作为团队高效地协作开发客户端应用。这些方法是根据以下标准选择的：


    1.  工具是“纯粹的JavaScript”。不是那种用特定领域语言（DSL）描述应用的工具（不用Sencha）。这是为了避免在贡献之前需要太多关于框架本身的知识。专注于JavaScript也能在一定程度上防止在框架特定知识上投入过多。

    2.  工具是通过编写JavaScript文件中的代码来构建应用，而不是试图在HTML中声明太多的应用逻辑（不用AngularJS，抱歉）。不得不在模板中编写应用逻辑感觉违反了关注点分离。它有一些短期收益，可以使简单的事情变得非常容易。然而，当你想要更多控制时，在框架的约束下可能很难做到。

    3.  没有庞大的、万能的部件框架（不用Sproutcore）。这些框架通常对你想要如何构建HTML做很多假设，并且经常违反关注点分离。

    4.  模型状态与视图状态完全解耦（不用Knockout.js）。同样，这是为了分离关注点。

    5.  你不应该是一个JavaScript高手才能编辑模板。模板放在单独的文件中，逻辑很少，允许设计师在不知道一切如何运作的情况下编辑模板。

    6.  DOM只是状态的一个视图，并对模型层中的变化做出反应。

    7.  简单、解耦的文件结构，包含大量解决单一问题的组件。

    8.  尽可能少的魔法（不用Ember）。类似于第1点，这主要是为了避免需要太多框架特定的知识。这引出了下一点。

    9.  已经知道JavaScript的人应该能够在没有大量关于特定工具或框架知识的情况下开发应用。

    10. 前一点的逆命题也应该成立，即学习应用如何工作的人，应该在此过程中顺便学习JavaScript如何工作。

    11. 它应该在使用版本控制的团队环境中运行良好（没有巨大的文件）。

    12. 每个功能都应该有一个明显的“归宿”。结构，结构，结构。这使得可以轻松地跳入旧代码修复错误，或在项目之间切换。

    13. 项目应该有一套可以通过自动化流程强制执行的代码风格标准。这鼓励整个代码库的可读性和一致性。它将围绕一个可执行的标准来集中代码风格的争论。我们发现这可以最小化很多关于代码风格的反复争论，因为它变成了简单的自动通过或失败。

    14. 它应该足够灵活，能够真正构建任何你想要的东西，而无需将一堆未使用的代码发送到浏览器。

