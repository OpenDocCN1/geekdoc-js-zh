    # # Testing and QA that doesn’t suck (so your app won’t)


    # ## The problem/challenge of proper interface QA


    We all know we need to test. While in the building phase of a browser app I find
    that building an extensive test suite isn’t necessarily worth the effort. Interfaces
    are inherently hard to test in that the variability of human input is part of
    what makes a good test for an interface.


    Also, there are things that are just a bit hard to test. For example, if you support
    drag and drop actions in your interface it''s not so easy to write a test that
    properly validates that it works well.


    Then there’s the “problem” of CSS changes. The DOM can be in perfect order but
    if the styles are off things can look quite broken, or you can have a layout issue
    where a control is covered or unclickable.


    Some people build really elaborate QA systems that load their app into a'
  - '[PAGE 92]


    headless browser and takes screenshots that are compared against reference images,
    etc. But the amount of effort and setup required for that is simply not practical
    in most cases.


    There are also tools like Selenium that will script a browser for you, but it''s
    a whole lot of work and setup, and then every time you want to change something,
    if your tests are too specific they''ll need to be constantly updated. And if
    they''re too general they''ll miss stuff.


    While headless browser testing is a really cool idea (PhantomJS, etc.), it doesn''t
    really help you know how your app works in other browsers.


    Ultimately, I don''t believe you can actually do proper testing of an interface
    without a human.


    So, there must be a balance that can be struck between human approval and oversight
    and taking advantage of the things computers are good at like process, consistency,
    and automation.


    # Meet the SpaceMonkey


    So we''ve been building one, we''re calling it SpaceMonkey. There wasn''t anything
    out there that did this in a way that was browser-agnostic, simple, and blended
    automation with human approval.


    We''ve still got a lot of work to do on it to make it awesome, but it''s included
    in the app generator if you select the “express” option, and it seemed worth mentioning
    nonetheless.


    It uses QUnit, the clientside testing tool made by the jQuery team. But rather
    than run simple programmatic tests. It loads your app into an `<iframe>`'
- md: "and walks you through the QA process that you've defined for it. You can automate\
    \ high-level tests like filling in and submitting forms, etc. But, in addition,\
    \ at the times you've specified it will stop and ask the user for visual verification\
    \ or to perform some user action such as a drag-and-drop interactions or scrolling-related\
    \ features that may be hard to test programmatically. So some of the unit tests\
    \ are considered a pass or fail based on a human's answer to “did it work?”\n\n\
    This approach makes it possible to define an explicit set of app interactions\
    \ to test. So it's like a partially automated QA checklist.\n\nTesting in other\
    \ browsers will just involve running through the test sequence in those other\
    \ browsers. Using a service like Browserling or BrowserStack lets us walk through\
    \ this process in whatever browsers we're targeting.\n\nSpaceMonkey is still under\
    \ heavy development, but a `clienttests` folder and sample QA workflow is included\
