    \    // extend with emitter\n    Emitter.call(this);\n};\n\n// Inherit from emitter,\
    \ but retain constructor\nAndBang.prototype = Object.create(Emitter.prototype,\
    \ {\n    constructor: {\n        value: AndBang\n    }\n});\n\n// Other methods\n\
    AndBang.prototype.setName = function (newName) {\n    this.name = newName;\n \
    \   // We can trigger arbitrary events\n    // these are just hooks that other\n\
