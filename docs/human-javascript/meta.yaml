    \    \"apiUrl\": \"https://api.andbang.com\",\n    \"trackMetrics\": false\n \
    \ }\n}\n```\n\n*note the “clientAppSettings” section.\n\nNow, in our main server\
    \ file where we handle the requests for single page apps, we then add on our config\
    \ cookie with the data from getconfig using a very simple piece of middleware.\n\
    \n```\n// Set up our app and require getconfig\nvar app = require('express')(),\n\
    \    config = require('getconfig');\n\n// Build a tiny middleware function that\
    \ sets the cookie\nvar configMiddleware = function (req, res, next) {\n  res.setCookie('config',\
    \ JSON.stringify(config.clientAppSettings));\n  next();\n};\n```"
- md: "// In the code that serves our singlepage app, use the middleware\napp.get('/app',\
    \ configMiddleware, function (req, res) {\n    res.send(clientApp.html());\n});\n\
    \nJust like that, we've got a simple unified config file on our server where we\
    \ can store all environment specific settings for the whole app. It becomes very\
    \ painless to pass settings to our clientapp based on our environment without\
    \ having to think about it.\n\nThe other benefit of this approach is that it lets\
    \ us keep our clientside JS app as a completely static file. We don't have to\
    \ do custom builds that write in settings or anything while still avoiding additional\
    \ HTTP requests to fetch settings.\n\n## Security caveats\n\nPlease avoid if sending\
    \ any valuable settings across the wire this way, especially if you're not using\
    \ https. Cookies are just http headers, so it's best to assume that this is not\
    \ secure information and thus, should only be used for non-sensitive data.\n\n\
    ## Caveats/Gotchas\n\n### Function bindings\n\nThe most common thing I see when\
    \ teaching people JavaScript, even people who have been working with jQuery for\
    \ a long time, is understanding how function execution works in JavaScript.\n\n\
    There are 4 ways to call a function in JavaScript:\n\n1. As a stand-alone function:\n\
    \n```javascript\nvar myFunction = function () {\n  console.log(\"this\" is, this);\n\
    };\n\nmyFunction(); // Will log out the `window` object (or global in Node)\n\
    ```\n\n2. As a property of an object:\n\n```javascript\nvar obj = {};\nobj.myFunction\
    \ = function () {\n  console.log(\"this\" is, this);\n};\n\nobj.myFunction();\
    \ // Will log out the 'obj' object\n\n// Now here's where it gets tricky (continuing\
    \ the same code as above)\n\nvar myFunc = obj.myFunction;\n\nmyFunc(); // What\
    \ will this log out as its 'this'?\n\n// the answer is the `window` object\n```\n\
    \n3. Using call\n\n```javascript\nvar myFunc = function () { ... };\n\n// call\
    \ with a specific context and any number of arguments\nmyFunc.call({any: 'object'},\
    \ 'someArgument', 'someOther');\n```\n\n4. Using apply\n\n```javascript\nvar myFunc\
    \ = function () { ... };\n\n// apply an array of arguments\nmyFunc.apply({any:\
    \ 'object'}, ['someArgument', 'someOther']);\n```\n\nSo the question is why?\n\
    \nIn JavaScript “this” isn’t magic. It’s just an object. It’s whatever you tell\
    \ it to be when you’re calling the function. It’s simply the context object for\
    \ that function execution.\n\nSo in the case of the second example where we just\
    \ do `myFunc();` we’re not giving it anything to use as a context, so it uses\
    \ the global object “window” because a function body will always have a “this”\
    \ inside that represents the context of execution.\n\nThese are not problems JS\
    \ developers are used to thinking about when building apps with jQuery. jQuery\
    \ nearly always hands you the current element as the ‘this’ for event handlers,\
    \ etc. But…as soon as we start doing Backbone it trips people up a lot. The following\
    \ is an example of what I see pretty much every person new to Backbone do:\n\n\
    ```javascript\nvar Backbone = require('backbone'),\n    templates = require('templates');\n\
    \nmodule.exports = Backbone.View.extend({\n    initialize: function () {\n   \
    \     // Register a handler so that anytime the model changes,\n        // call\
    \ the render function.\n        // THIS WILL NOT WORK!\n        this.model.on('change',\
    \ this.render);\n    },\n    render: function () {\n        this.$el.html(template.thing());\n\
    \    }\n});\n```\n\nThe problem is that inside the render function, \"this\" won't\
    \ be the Backbone view if it's triggered by a change in the model. You may say,\
    \ \"Well we're specifying it as a property of something.\" In some ways, yes,\
    \ you wrote `this.render` but you're actually just referencing the resulting function\
    \ and giving the specific function, without context to the event registry.\n\n\
    In fact, what you're doing is no different than this:\n\n```javascript\n// Register\
    \ a handler so that anytime the model changes,\n// call the render function.\n\
    // THIS WILL NOT WORK!\nvar render = this.render;\nthis.model.on('change', render);\n\
    ```\n\nSo, the render function doesn't have any context when you just provide\
    \ a pointer to that function (even though the function may 'live' on the view).\n\
    \nSo, here's what you do. You can bind a function to a context before it's run\
    \ like this.\n\n```javascript\n// THIS will work as expected.\n// Backbone's event\
    \ system takes a third argument for the\n// context to execute the function with.\n\
    this.model.on('change', this.render, this);\n```\n\nThis leads into the other\
    \ two ways to execute a function:\n\n```javascript\nvar myFunction = function\
    \ () {\n    console.log(\"\\\"this\\\" is\", this);\n};\n\nvar someOtherContext\
    \ = {\n    name: 'blah'\n};\n\n// Both of these will log out the 'someOtherContext'\
    \ object\nmyFunction.apply(someOtherContext);\nmyFunction.call(someOtherContext);\n\
    \n// In ES5 compliant (read modern) browsers you can also do this\nmyFunction\
    \ = myFunction.bind(someOtherContext);\nmyFunction(); // \"this\" will be someOtherContext\n\
    \n// Or if you're using underscore it doesn't matter if you're\n// in a modern\
    \ browser or not. You can just do this:\n\nmyFunction = _.bind(myFunction, someOtherContext);\n\
    myFunction(); // For the same result\n```\n\nThat’s function binding in a nutshell.\
    \ It’s really just info about how the language works. But it’s such a common issue\
    \ with people who are new to Backbone, or less familiar with JavaScript as a language\
    \ that I figured it was worth explaining.\n\n### Gotchas regarding DOM manipulation\
    \ in views (they may still be detached)\n\nAnother common issue is understanding\
    \ what `this.$()` does in views.\n\nIf you’ve got a div in your template that\
    \ looks like this: `<div id=\"myDiv\"/>` and we do this in the render function\
    \ you’ll have a problem:\n\n```javascript\nvar Backbone = require('backbone');\n\
    \nmodule.exports = Backbone.View.extend({\n    render: function () {\n       \
    \ this.$el.html(templates.myTemplate());\n    }\n});\n\n// Then you try to access\
    \ that div like so:\n$('#myDiv').on('click', this.doSomething);\n\n// ^^ myDiv\
    \ won't be found! If the root element of this\n// view isn't already attached\
    \ to the DOM.\nreturn this;\n}\n});\n```\n\nWhat many people don't know is that\
    \ you can pass a second argument to the jQuery function $(selector) that is the\
    \ DOM tree to look within. So if you did $('#myDiv', this.el) in the example above,\
    \ it would always work.\n\nBackbone tries to make things easy for us, rather than\
    \ having to do that. Remember to always use this.$() instead of just $() within\
    \ views. That's just a helper for passing the view's base element to the jQuery\
    \ function. It's functionally equivalent to passing this.el as the second argument.\n\
    \n### Failed Ajax requests\n\nInevitably with single page apps you have to deal\
    \ with issues of bad connectivity, or issues of stale data and/or expired sessions.\n\
    \nIf we're using RESTful JSON APIs we'll be making requests throughout the application's\
    \ lifecycle. One approach is to stub out a global error handler for all Ajax requests.\
    \ jQuery makes this fairly simple: http://api.jquery.com/ajaxError. Often as part\
    \ of an application's main view, I'll register a handler for global Ajax errors\
    \ that pops up a dialog to show an appropriate message.\n\n## A few closing thoughts\n\
    \n### 1. We're not done\n\nThis book will continue to evolve along with the corresponding\
    \ tools and techniques. We plan to continue publishing updates to keep the contents\
    \ current. That's one of the great things about ebooks. We've even built a continuous\
    \ integration system for the book. Any time we push an update to the master branch\
    \ for the book repository, our CI server generates new ebooks.\n\n### 2. Staying\
    \ up to date\n\nFollow @HenrikJoreteg and @andyet on twitter to hear about updates\
    \ and changes. We'll be turning the site into a jumping off point for finding\
    \ related tools and resources.\n\n### 3. Complimentary Resources\n\nWe've pulled\
    \ out all of our favorite tools into a toolkit we're calling: Ampersand.js\n\n\
    > \"A highly modular, loosely coupled, non-frameworky framework for building advanced\
    \ JavaScript apps.\"\n\nSo there's a lot of resources and detailed documentation\
    \ there.\n\n- [http://ampersandjs.com](http://ampersandjs.com) – Human JavaScript\
    \ related documentation site.\n- [http://tools.ampersandjs.com](http://tools.ampersandjs.com)\
    \ – Fast searchable directory of hand-picked modules.\n\n### 4. Open source is\
    \ a group effort\n\nWe're under no illusions that the approaches in here are perfect.\
    \ All of the tools are open source and hosted on GitHub. If you would like to\
    \ contribute, please get involved.\n\n### 5. Feedback on the book\n\nIf there\
    \ was anything that was unclear, incorrect, missing, or could be improved on the\
    \ book itself, we want to hear about it from you. You can email me directly: henrik@andyet.net\
    \ with any feedback."
  mdcn: "\n// 在服务于我们单页应用的代码中，使用该中间件\napp.get('/app', configMiddleware, function (req,\
    \ res) {\n    res.send(clientApp.html());\n});\n\n就这样，我们在服务器上拥有了一个简单的统一配置文件，可以在其中存储整个应用的所有特定环境设置。基于我们的环境将设置传递给客户端应用程序变得非常简单，无需额外考虑。\n\
    \n这种方法的另一个好处是，它让我们能够将客户端 JavaScript 应用保持为完全静态的文件。我们不必进行自定义构建来写入设置或类似操作，同时还能避免获取设置的额外\
    \ HTTP 请求。\n\n## 安全注意事项\n\n如果通过此方式传输任何有价值的设置，请务必避免，尤其是在未使用 HTTPS 的情况下。Cookie 仅仅是\
    \ HTTP 头，因此最好假设它们不是安全信息，因此应仅用于非敏感数据。\n\n## 注意事项/常见问题\n\n### 函数绑定\n\n我在教授 JavaScript\
    \ 时，最常见的问题是理解 JavaScript 中函数执行的工作方式，即使是那些长期使用 jQuery 的人也是如此。\n\n在 JavaScript 中，有\
    \ 4 种调用函数的方式：\n\n1. 作为独立函数：\n\n```javascript\nvar myFunction = function () {\n\
    \  console.log(\"this\" is, this);\n};\n\nmyFunction(); // 将输出 `window` 对象（或 Node\
    \ 中的全局对象）\n```\n\n2. 作为对象的属性：\n\n```javascript\nvar obj = {};\nobj.myFunction\
    \ = function () {\n  console.log(\"this\" is, this);\n};\n\nobj.myFunction();\
    \ // 将输出 'obj' 对象\n\n// 现在情况变得棘手了（继续使用上面的代码）\n\nvar myFunc = obj.myFunction;\n\
    \nmyFunc(); // 这个 'this' 会输出什么？\n\n// 答案是 `window` 对象\n```\n\n3. 使用 call\n\n```javascript\n\
    var myFunc = function () { ... };\n\n// 使用特定的上下文和任意数量的参数进行调用\nmyFunc.call({any:\
    \ 'object'}, 'someArgument', 'someOther');\n```\n\n4. 使用 apply\n\n```javascript\n\
    var myFunc = function () { ... };\n\n// 应用参数数组\nmyFunc.apply({any: 'object'},\
    \ ['someArgument', 'someOther']);\n```\n\n那么问题来了，为什么呢？\n\n在 JavaScript 中，`this`\
    \ 并不是魔法。它只是一个对象。它是你在调用函数时告诉它的任何东西。它只是该函数执行的上下文对象。\n\n所以在第二个例子中，我们只做 `myFunc();`，我们没有给它任何东西作为上下文，所以它使用全局对象\
    \ \"window\"，因为函数体内总会有一个代表执行上下文的 `this`。\n\n这些问题不是 JavaScript 开发者在使用 jQuery 构建应用时习惯思考的。jQuery\
    \ 几乎总是将当前元素作为事件处理程序等的 'this' 交给你。但是...一旦我们开始使用 Backbone，很多人就会遇到麻烦。以下是我看到的几乎每个\
    \ Backbone 新手都会犯的一个例子：\n\n```javascript\nvar Backbone = require('backbone'),\n\
    \    templates = require('templates');\n\nmodule.exports = Backbone.View.extend({\n\
    \    initialize: function () {\n        // 注册一个处理程序，以便每当模型发生变化时，\n        // 调用\
    \ render 函数。\n        // 这将无法工作！\n        this.model.on('change', this.render);\n\
    \    },\n    render: function () {\n        this.$el.html(template.thing());\n\
    \    }\n});\n```\n\n问题在于，如果 render 函数是由模型变化触发的，那么函数内部的 \"this\" 将不是 Backbone 视图。你可能会说，\"\
    嗯，我们把它指定为某个东西的属性。\" 在某些方面，是的，你写了 `this.render`，但你实际上只是引用了结果函数，并将特定函数（没有上下文）提供给事件注册表。\n\
    \n事实上，你所做的与此并无二致：\n\n```javascript\n// 注册一个处理程序，以便每当模型发生变化时，\n// 调用 render 函数。\n\
    // 这将无法工作！\nvar render = this.render;\nthis.model.on('change', render);\n```\n\
    \n所以，当你只提供指向该函数的指针时，render 函数没有任何上下文（即使该函数可能“存在于”视图上）。\n\n那么，你应该这样做。你可以在函数运行之前将其绑定到一个上下文，如下所示。\n\
    \n```javascript\n// 这将按预期工作。\n// Backbone 的事件系统接受第三个参数作为\n// 执行函数的上下文。\nthis.model.on('change',\
    \ this.render, this);\n```\n\n这引出了执行函数的另外两种方式：\n\n```javascript\nvar myFunction\
    \ = function () {\n    console.log(\"\\\"this\\\" is\", this);\n};\n\nvar someOtherContext\
    \ = {\n    name: 'blah'\n};\n\n// 这两种方式都会输出 'someOtherContext' 对象\nmyFunction.apply(someOtherContext);\n\
    myFunction.call(someOtherContext);\n\n// 在符合 ES5（即现代）的浏览器中，你也可以这样做\nmyFunction\
    \ = myFunction.bind(someOtherContext);\nmyFunction(); // \"this\" 将是 someOtherContext\n\
    \n// 或者如果你使用 underscore，无论你是否在现代浏览器中。\n// 你可以直接这样做：\n\nmyFunction = _.bind(myFunction,\
    \ someOtherContext);\nmyFunction(); // 结果相同\n```\n\n这就是函数绑定的全部内容。它真的只是关于语言如何工作的信息。但这是\
    \ Backbone 新手或对 JavaScript 语言不熟悉的人非常常见的问题，因此我认为值得解释一下。\n\n### 关于视图中 DOM 操作的注意事项（它们可能仍然处于分离状态）\n\
    \n另一个常见问题是理解 `this.$()` 在视图中的作用。\n\n如果你的模板中有一个像这样的 div：`<div id=\"myDiv\"/>`，而我们在\
    \ render 函数中这样做，你会遇到问题：\n\n```javascript\nvar Backbone = require('backbone');\n\
    \nmodule.exports = Backbone.View.extend({\n    render: function () {\n       \
    \ this.$el.html(templates.myTemplate());\n    }\n});\n\n// 然后你尝试这样访问那个 div：\n\
    $('#myDiv').on('click', this.doSomething);\n\n// ^^ 如果该视图的根元素尚未附加到 DOM，则 myDiv\
    \ 将不会被找到！\nreturn this;\n}\n});\n```\n\n许多人不知道的是，你可以向 jQuery 函数 $(selector) 传递第二个参数，该参数是要在其中查找的\
    \ DOM 树。因此，如果你在上面的例子中使用 $('#myDiv', this.el)，它总是有效的。\n\nBackbone 试图为我们简化事情，而不是那样做。请记住，在视图内始终使用\
    \ this.$() 而不是仅使用 $()。这只是一个辅助函数，用于将视图的根元素传递给 jQuery 函数。在功能上等同于将 this.el 作为第二个参数传递。\n\
    \n### Ajax 请求失败\n\n对于单页应用，不可避免地会遇到连接不良或数据过期和/或会话过期的问题。\n\n如果我们使用 RESTful JSON\
    \ API，我们将在应用程序的整个生命周期中发出请求。一种方法是为所有 Ajax 请求存根一个全局错误处理程序。jQuery 使这变得相当简单：http://api.jquery.com/ajaxError。通常，作为应用程序主视图的一部分，我会注册一个全局\
    \ Ajax 错误的处理程序，弹出一个对话框显示适当的消息。\n\n## 一些结束语\n\n### 1. 我们尚未完成\n\n本书将随着相应的工具和技术不断发展。我们计划继续发布更新以保持内容的最新性。这就是电子书的一大优点。我们甚至为本书构建了一个持续集成系统。每当我们向本书的仓库主分支推送更新时，我们的\
    \ CI 服务器就会生成新的电子书。\n\n### 2. 保持更新\n\n在 Twitter 上关注 @HenrikJoreteg 和 @andyet 以了解更新和变化。我们将把该网站转变为查找相关工具和资源的跳板。\n\
    \n### 3. 免费资源\n\n我们已经将我们最喜欢的工具提取到一个工具包中，我们称之为：Ampersand.js\n\n> “一个高度模块化、松散耦合、非框架式框架，用于构建高级\
    \ JavaScript 应用。”\n\n因此，那里有大量的资源和详细的文档。\n\n- [http://ampersandjs.com](http://ampersandjs.com)\
    \ – Human JavaScript 相关文档站点。\n- [http://tools.ampersandjs.com](http://tools.ampersandjs.com)\
    \ – 快速可搜索的精选模块目录。\n\n### 4. 开源是集体努力\n\n我们并不幻想这里的方法是完美的。所有工具都是开源的，并托管在 GitHub 上。如果您愿意贡献，请参与进来。\n\
    \n### 5. 对本书的反馈\n\n如果本书中有任何不清楚、不正确、遗漏或可以改进的地方，我们希望听到您的反馈。您可以直接给我发邮件：henrik@andyet.net\
    \ 提供任何反馈。\n"
