  md: 'tips for staying sane.


    # Refactor early, refactor often


    Entropy is inevitable in a codebase. If we don''t continually modify, simplify
    and unify the existing code along with the new code that''s being written, we
    can easily end up with a really big, messy app.


    Some developers seem hesitant to touch code they''ve already written. But, I believe
    that deleting and updating code is a regular and important part of building an
    app. When you first start building an app, you don''t know how you''re going to
    build everything in it so there''s no reason to treat any of the code you build
    along the way as infallible.


    Code is just text, not an edict. It can be changed easily and should be streamlined
    as you build.


    Don''t be scared of refactoring. Be scared of building an unmaintainable piece
    of crap. I have found that to be much more costly in the long run. Additionally,
    if your app is separated into clean simple modules the risk of accidentally breaking
    something else is dramatically lower.


    # Separating views and state


    This is the biggest lesson I''ve learned building lots of single page apps. Your
    view (the DOM) should just be reacting to the model state of your application.
    For this you could use any number of tools and frameworks. I often recommend reading
    the [Backbone documentation](https://backbonejs.org/) to developers who are new
    to these concepts. It provides a clear "just JavaScript"™ approach'
  merge: -1
