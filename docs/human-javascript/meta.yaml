  md: "# Binding model values to templates\n\nIn order to keep our separation of concerns,\
    \ very rarely do I set style attributes directly from JavaScript. I believe that\
    \ is a job for CSS. So much of what I do is flip classes based on property values\
    \ on the underlying model.\n\nBackbone kind of loosely encourages you to just\
    \ re-render views entirely when something changes. In a lot of cases that’s totally\
    \ fine, but I like only changing the specific thing that needs updating when the\
    \ underlying model changes. Obviously, this can be a bit more tedious because\
    \ you have to bind each thing explicitly somehow.\n\nThis is where AmpersandView\
    \ comes in handy. Much in the same way that we declare event handlers in the `events`\
    \ hash as described above, we can also declare data bindings of various types\
    \ in our views as follows:\n\n```\nvar AmpersandView = require('ampersand-view');\n\
    var templates = require('templates');\n\nmodule.exports = AmpersandView.extend({\n\
    \  template: templates.widget,\n  events: {\n    'click .delete': 'handleDeleteClick',\n\
    \    'keyup input.search': 'handleSearchKeyUp'\n  },\n  // We simply list our\
    \ bindings here\n  bindings: {\n    // This simple text binding means\n    //\
    \ we put the property value of the\n    // model in this view into the\n    //\
    \ element that matches the\n    // '.profileName' selector as text.\n    'model.name':\
    \ '.profileName',\n    // There's a few different binding types\n    // 'booleanClass'\
    \ bindings will add or remove\n    // a class with the name provided based on\n\
    \    // the truthiness of the property.\n    'model.selected': {\n      type:\
    \ 'booleanClass',\n      selector: '.container',\n      name: 'active'\n    }\n\
    \  }\n});\n```"
