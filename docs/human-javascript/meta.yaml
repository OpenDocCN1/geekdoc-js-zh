  - "[PAGE 47]\n\n# If you continue this same approach, you’re in deep doo doo\n\n\
    You can handle adding features to a point. But you will reach a point where you\
    \ start arguing against adding features, not because you don't think they're good\
    \ ideas, but because you're scared to implement them because of the headaches\
    \ and bugs it will inevitably cause.\n\nWelcome to nearly everyone's first single\
    \ page app experience.\n\n# Enter Models\n\nIf you've never used models in clientside\
    \ code, it's not as intimidating as it may sound. The idea is simply that we create\
    \ some data structures in the browser, separate from the DOM, that hold the data\
    \ that we got from the server as well as any client specific data or state.\n\n\
    The “selected” state as described above is a good example of client-specific state,\
    \ meaning when we go to update an entry in the API, we're not going to send `{selected:\
    \ true}` as one of its properties. The server doesn't care about that, it's just\
    \ used to track the state of the user interface.\n\nSo, what is a model anyway?\
    \ What does it give us?\n\nThe fundamental thing a model should provide is observability.\
    \ What do I mean? Well, in the same way you can register an event listener in\
    \ the browser that responds to a form input value changing:\n\n```\ndocument.getElementById('myInput').addEventListener('change',\
    \ function () {\n  // Do something with the value\n});\n```"
  - "[PAGE 48]\n\nA model should let us listen for changes to its properties:\n\n\
    ```\nmodel.on('change:selected', function (newValue) {\n  // Do something with\
    \ the new value\n});\n```\n\nIn addition, models should contain functionality\
    \ that makes it easy for us to work with that data. That means things like exposing\
    \ some processed form of the data, should be a method on the model. Let's say\
    \ one of the model properties represents a date. We may have a method on the model\
    \ for getting a nicely formatted date string built from that date object. Arguably\
    \ this is a presentation issue, but the model ends up being a logical place to\
    \ expose a string version of the date property for maximum re-use and consistency.\n\
    \nIn addition, models are a good place for methods that perform actions on the\
    \ model itself, like updating the server when the model changes.\n\nIn And Bang,\
    \ we do a lot with tasks. You can assign them to each other, \"ship\" them, \"\
    later\" them, \"trash\" them, etc.\n\nSo, each of these actions are represented\
    \ by a method on the task model that sends the correct data to the server, as\
    \ well as updating the appropriate properties on the local model.\n\nFor example,\
    \ here's the `trash` method of a task in And Bang:\n\n```\n... },\ntrash: function\
    \ () {\n  if (this.deleteable) {\n    this.removing = true;\n    this.api('deleteTask');\n\
    \  }\n  return this.deleteable;\n},\n...\n```"
  - '[PAGE 49]


    It includes an upfront check to see whether we even have permission to trash this
    item. In case you''re wondering this isn''t actually used to enforce this permission,
    that''s the API''s job.


    In fact, that''s worth a little tangent to drive home the purpose of an API. It''s
    *always* the API''s job to maintain its own data integrity. You shouldn''t *ever*
    be able to do anything in the client code that puts your API data in a weird or
    broken state. For example, never leave it up to your client code to know that
    if you delete a list you also have to go delete all the items in the list. That''s
    the API''s job.


    Continuing… calling the `trash` method sets a local state property `removing`
    and then calls the API method that sends the command to the server to delete the
    task (in this case via WebSocket, but the transport is irrelevant).


    But the cool thing is, that''s *it*. That''s all we have to do when we want to
    delete a widget. You simply have to look up the widget''s model and call `.trash()`.


    Nowhere in this code do you see anything about removing the item from DOM.


    That happens when we get confirmation from the API that the task was removed.
    It is then removed from the collection, which triggers a `remove` event on the
    collection and the view (which represents the DOM, as described in the next chapter)
    listens for `remove` events and plucks that list item out of the DOM. It may sound
    a bit complex, but only in that you have to describe all those relationships.
    Once you have it''s beautifully simple.


    Assuming we''ve got a view that represents that model, the view would have a click
    handler like this:


    ```

    var Backbone = require(''backbone'');

    ```'
  - "[PAGE 50]\n\n```\nmodule.exports = Backbone.View.extend({\n  // Our events hash\
    \ (explained in the next chapter)\n  events: {\n    'click .delete': 'handleDeleteClick'\n\
    \  },\n  // Our handler simply calls \"trash\", nothing more\n  handleDeleteClick:\
    \ function() {\n    this.model.trash();\n  },\n  ...\n})\n```\n\nAlternately,\
    \ you can simply open the JS console in your browser and type:\n\n```\n> app.currentTeam.tasks.get('someId').trash();\n\
    ```\n\nAnd you'll see that everything still happens exactly the same as if you\
    \ had clicked to delete. The task will be deleted on the server and removed from\
    \ the DOM.\n\n# Using models for everything\n\nAs the app becomes more complex\
    \ the failure to store all state in one (and only one) place in your app will\
    \ be the source of the sorts of bugs that drive you to give up development and\
    \ take up gardening.\n\nSo, what do I mean by storing *all* the state in your\
    \ app? It's quite easy. If you find yourself checking whether something has a\
    \ class or not, and using that to determine a course of action, you're doing it\
    \ wrong.\n\nThere are two simple rules:\n\n+   1. All input, whether from the\
    \ user or from an API, *never* does anything other than call a method or update\
    \ a property of your models.\n2. Always use your models as the \"source of truth\"\
    \ in your app. Never"
  - "[PAGE 51]\n\n“look up” state information anywhere other than your models.\n\n\
    # Applying this approach to our widget example\n\nLet’s think about the data first,\
    \ before we think about the behavior. These items in the list represent something.\
    \ Let’s model *that* before we think about how they’ll be presented. Let’s just\
    \ make a collection of models representing the items in the list.\n\nmodels/widgetCollection.js\n\
    \n```\nvar Backbone = require('backbone');\nvar WidgetModel = require('./models/widget')\n\
    \n// Our main export from this module (just the collection)\nmodule.exports =\
    \ Backbone.Collection.extend({\n  // Specify the model type for this collection\n\
    \  model: WidgetModel,\n  // The RESTful API URL representing this resource\n\
    \  url: '/widgets'\n});\n```\n\nmodels/widget.js\n\n```\nvar AmpersandModel =\
    \ require('ampersand-model');\n\nmodule.exports = AmpersandModel.extend({\n  //\
    \ We give our model a type\n  type: 'widget',\n  // Define properties, these are\
    \ the ones\n  // that live on the server-side\n  props: {\n    id: ['string',\
    \ true],\n    widgetType: ['string', true, 'dooDad']\n  },\n  // Session properties\
    \ are just like props but\n  // exist for the purpose of storing client-side\n\
    \  // state.\n  session: {\n    selected: ['boolean', true, false]\n  }\n});\n\
    ```\n\nAt this point we can do something like this in our application launch code:"
  - "[PAGE 52]\n\n```\nvar WidgetCollection = require('models/widgets');\n\n// Assume\
    \ this is the app's entry point\nmodule.exports = {\n    blastoff: function ()\
    \ {\n        // Create our one global that holds the app\n        window.app =\
    \ this;\n\n        // Attach our widget collection here\n        this.widgets\
    \ = new WidgetCollection();\n        // Assumes you've got things set up so\n\
    \        // this will do an AJAX (or some other type) call\n        // and populate\
    \ the collection.\n        this.widgets.fetch();\n    }\n};\n```\n\nSo now we've\
    \ got a representation of that list of widgets that assumes nothing about how\
    \ it's going to be used.\n\nStop for a second and think about what that does for\
    \ us when requirements change or even when we go build a second application on\
    \ the same API. Nearly *all* the model code will be re-usable with zero changes.\
    \ It simply represents the state that is available in the API, which is the same\
    \ no matter what the interface looks like.\n\nAlso, think about this in a team\
    \ environment. Someone can be working on writing models and making sure they get\
    \ the proper data populated from the API while someone is building the clientside\
    \ router and page views that include and design \"static\" versions of page elements\
    \ that will be rendered by models once the API is hooked up. Because they're all\
    \ in separate files you won't step on each other's toes and merging the combined\
    \ code in git won't result in any major merge conflicts.\n\nJust imagine the sort\
    \ of impact this has for a team to be able to work in parallel and to write code\
    \ that doesn't need to be thrown away the minute someone wants to change the layout\
    \ of the app.\n\nIn fact, that basic model layer and API synchronization can be\
    \ created"
- md: "## Model alternatives\n\nIn order to provide observability, models generally\
    \ provide some sort of event registration system and a way to set and get some\
    \ “protected” attributes.\n\nFor a long time, I used Backbone models for everything.\
    \ The code for them is quite simple and readable (YES!); they’re also flexible\
    \ and easy to use. Also, I’m generally a big fan of Backbone’s principles and\
    \ structure.\n\nYet, you’ll notice the examples all use `AmpersandModel` instead\
    \ of `Backbone.Model`.\n\nDespite our love for Backbone at &yet, a few things\
    \ finally drove us to create [Ampersand.js](http://Ampersand.js).\n\nBackbone\
    \ is brilliantly simple and solves many common problems in developing clientside\
    \ applications. But we missed the focused simplicity of tiny modules in node-land.\n\
    \nWe wanted something similar in style and philosophy, but that fully embraced\
    \ tiny modules, npm, and browserify. For more info on those tools check out the\
    \ [Ampersand.js site](http://Ampersand.js site).\n\nThe specific things we wanted\
    \ from models are:\n\n+   1. Readability\n\nIf the models are the core of our\
    \ application (as they should be), someone should be able to open the code for\
    \ the model and *read* what properties it stores and what types those properties\
    \ have. This is *huge* for enabling people to jump in and contribute to a project.\n\
    \n### 2. Derived properties\n\nSo often, the data you get from the server is not\
    \ in the format you’ll want to present it. The classic example is first and last\
    \ name. Most likely they come as separate fields from the API, but in reality,\
    \ most places you’re going to present a user’s name in the app will be in the\
    \ format: `firstName + ' ' + lastName`. In Backbone you’d perhaps create a method\
    \ called `fullName()` that when called, returned that value to you. The annoying\
    \ thing comes when you want to bind that value to some location in the DOM. You\
    \ have to listen for changes to either `firstName` or `lastName` and then call\
    \ the method again and put the result into the DOM. There are two things I don’t\
    \ like about this:\n\n+   1. It *feels* like `fullName` or even just `name` should\
    \ just be accessible in the same way as first or last name. Why can’t I just go\
    \ `user.name`?\n\n    2. I want to be able to listen for changes in one place.\
    \ So, instead of `model.on('change:firstName change:lastName', doSomething)` it\
    \ seems like I should be able to just listen for changes to `change:name` and\
    \ have the model be smart enough to know that if either first or last name changes,\
    \ call that handler too.\n\n### 3. Direct access to properties\n\nIn a large app,\
    \ you work with models **a lot**. Having to call `get` and `set` everywhere is\
    \ a bit less than ideal, IMO. ECMAScript 5 (a.k.a. the version of the JS spec\
    \ available in modern browsers) allows for `getters` and `setters` which means\
    \ you can actually process simple assignments. This is better illustrated with\
    \ an example:\n\n```\n// Without getters/setters (Backbone Model)\nmodel.set('firstName',\
    \ 'Henrik');\n\n// With getters/setters (AmpersandModel)\nmodel.firstName = 'Henrik';\n\
    ```\n\nWhat do I mean? You can already set whatever properties you want directly\
    \ on an object even without getter/setters, right?!\n\nYES! But not in a way that\
    \ can be observed.\n\nGetters and setters allow us to trigger those `change` events\
    \ even when properties are set directly:\n\n```\nmodel.on('change:firstName',\
    \ function () {\n  console.log('firstName changed!');\n});\n\n// Even when setting\
    \ the attribute directly the callback\n// registered above would still be called.\n\
    model.firstName = 'Henrik';\n```\n\nGetters and setters give us enormous flexibility,\
    \ which can be bad. For example, we can make a getter run whatever code we want\
    \ and return anything whenever we access a property.\n\n```\ntrickyModel.firstName\
    \ = 'Henrik';\n\nconsole.log(trickyModel.firstName);\n// We can make this log\
    \ out *whatever* the heck we want\n// despite it appearing to just have been assigned\
    \ above.\n```\n\nQuick note on how to use getters/setters\n\nBe sure to read the\
    \ warning below, but for those not familiar, it may be useful to have a bit of\
    \ an explanation of how getters and setters are written. There are two syntax\
    \ options.\n\nThe first is using the `get` and `set` operators directly to define\
    \ those methods:\n\n```\nvar myObject: {\n  _properties: {},\n  get name () {\n\
    \    return this._properties.name;\n  },\n  set name (value) {\n    this._properties.name\
    \ = value;\n  }\n}\n```\n\nThe second is using `Object.defineProperty()`:\n\n\
    ```\nvar myObject = {\n  _properties: {}\n};\n\nObject.defineProperty(myObject,\
    \ \"name\", {\n  get: function () {\n    return this._properties.name;\n  },\n\
    \  set: function (value) {\n    this._properties.name = value;\n  }\n});\n\n//\
    \ There's also a defineProperties (plural)\nObject.defineProperties(myObject,\
    \ {\n  lastName: {\n    get: function () { ... },\n    set: function () { ...\
    \ }\n  },\n  fullName: {\n    get: function () { ... },\n    set: function ()\
    \ { ... }\n  }\n})\n```\n\n> Warning!\n\nAs you can imagine this power gives you\
    \ a *lot* of rope to hang yourself with and thus, this capability should be used\
    \ *very* cautiously.\n\nSome argue, and I can see their point, that using this\
    \ is too much magic. If that's how you feel. Luckily, in our happy modular world,\
    \ you can just use plain Backbone models.\n\nHowever, I happen to think that in\
    \ the case of models getters/settings can actually make our code more fault tolerant\
    \ and more readable. But, I *only* use them for model properties and only in predictable\
    \ ways.\n\n### 4. Type enforcement\n\nJavaScript, the language is dynamically\
    \ typed, which is awesome. But we've said we're making our models the *core* of\
    \ the app. Knowing that a given property is a given type is quite useful for eliminating\
    \ silly bugs and protecting ourselves.\n\nLet's compare the two with a simple\
    \ user model. In Backbone there is no standard way to define a property. Instead,\
    \ you simply set a value as if it exists and now it does.\n\n```\n// Backbone\
    \ model, no definition needed.\n// There *is* no standard way to even\n// define\
    \ the properties it should store.\nvar model = new Backbone.Model();\n\nmodel.set({\n\
    \  firstName: 'Henrik',\n  lastName: 'Joreteg'\n});\n\n// Now I can get those\n\
    model.get('firstName'); // logs out 'Henrik'\n```\n\nSimple, elegant, flexible.\
    \ But, assuming I set these values in some view code somewhere in another part\
    \ of a large app, how do I know what attributes I have available to me or what\
    \ they're called?\n\nIf I'm hitting an API to get my data and using the resulting\
    \ data to set attributes on models, I have two options for figuring out what data\
    \ I'm storing and what data I have available to my views. I either inspect the\
    \ request to know what properties I'm supposed to have or inspect it in the console\
    \ at runtime to see what properties my model contains and what their names are.\n\
    \nThat doesn’t seem very developer friendly.\n\nJust think how much information\
    \ I’m missing:\n\n+   1. What properties do I have?\n    2. What type of values\
    \ do those properties contain?\n    3. Can I trust that this property will always\
    \ contain a value?\n    4. Is this a property client state or data we got from\
    \ the server?\n    5. When I go to update the model on the server, which properties\
    \ should be sent?\n    6. Is a property computed from other properties, if so,\
    \ how do I keep it up to date?\n    7. Perhaps most importantly, where do I go\
    \ to find the answers to the questions above?\n\nSure the following example is\
    \ silly, but what if I write some stupid code (as we do sometimes, amirite humans?!).\n\
    \n```\n// There's nothing stopping you from setting\n// the firstName property\
    \ to be a date object.\nmodel.set('firstName', new Date());\n```\n\nSure, you\
    \ may be able to keep it all in your head to a point, but what about when a second\
    \ developer comes and looks at that code? Or what happens when you come back to\
    \ the code after six months (or even two weeks)? Where do you go to see how the\
    \ app is structured? You have to go spelunking into views for answers.\n\nI prefer\
    \ that the model is the explicit documentation on what state is stored.\n\nSee\
    \ how this could be in AmpersandModel:"
  mdcn: "\n## 模型替代方案\n\n为了提供可观测性，模型通常会提供某种事件注册系统，以及一种设置和获取某些“受保护”属性的方法。\n\n很长一段时间里，我凡事都使用\
    \ Backbone 模型。它们的代码相当简单且易读（是的！）；它们也很灵活、易于使用。此外，我总体上非常推崇 Backbone 的原则和架构。\n\n然而，你会注意到所有示例都使用\
    \ `AmpersandModel` 而不是 `Backbone.Model`。\n\n尽管我们 &yet 团队对 Backbone 充满热爱，但有几个因素最终促使我们创建了\
    \ [Ampersand.js](http://Ampersand.js)。\n\nBackbone 的简洁性令人赞叹，并且解决了客户端应用程序开发中的许多常见问题。但我们怀念\
    \ node 领域中微小模块那种专注的简洁性。\n\n我们想要一种风格和理念相似，但能完全拥抱微小模块、npm 和 browserify 的方案。关于这些工具的更多信息，请查看\
    \ [Ampersand.js 网站](http://Ampersand.js site)。\n\n我们希望模型具备的具体特性是：\n\n+   1. 可读性\n\
    \n如果模型是我们应用程序的核心（理应如此），那么某人应该能够打开模型的代码并*阅读*出它存储了哪些属性以及这些属性的类型。这对于让人们快速上手并为项目做出贡献是*至关重要*的。\n\
    \n### 2. 派生属性\n\n很多时候，你从服务器获取的数据格式并非你想要呈现的格式。一个经典的例子是名字和姓氏。很可能它们从 API 以独立字段的形式传来，但实际上，在应用程序中展示用户名的大多数地方，格式都是：`firstName\
    \ + ' ' + lastName`。在 Backbone 中，你可能会创建一个名为 `fullName()` 的方法，调用时返回这个值。当你想将这个值绑定到\
    \ DOM 中的某个位置时，烦人的事情就来了。你必须监听 `firstName` 或 `lastName` 的变化，然后再次调用该方法并将结果放入 DOM。有两件事我不喜欢这样做：\n\
    \n+   1. 从*感觉上*说，`fullName` 或者甚至 `name` 应该能够像访问 `firstName` 或 `lastName` 一样被访问。为什么我不能直接用\
    \ `user.name` 呢？\n\n    2. 我希望能在一个地方监听变化。所以，与其用 `model.on('change:firstName change:lastName',\
    \ doSomething)`，似乎我应该能够只监听 `change:name` 的变化，并且模型足够智能，知道无论是名字还是姓氏变化，都调用那个处理器。\n\
    \n### 3. 直接访问属性\n\n在大型应用程序中，你与模型打交道的次数**非常多**。在我看来，到处都需要调用 `get` 和 `set` 并不太理想。ECMAScript\
    \ 5（也就是现代浏览器中可用的 JS 规范版本）允许使用 `getters` 和 `setters`，这意味着你实际上可以处理简单的赋值。用一个例子来说明会更清楚：\n\
    \n```\n// 没有 getter/setter 的情况（Backbone 模型）\nmodel.set('firstName', 'Henrik');\n\
    \n// 有 getter/setter 的情况（AmpersandModel）\nmodel.firstName = 'Henrik';\n```\n\n\
    我是什么意思？即使没有 getter/setter，你也可以直接在对象上设置任何你想要的属性，对吧？！\n\n是的！但这样设置是无法被观测到的。\n\nGetter\
    \ 和 setter 允许我们即使在属性被直接设置时也能触发那些 `change` 事件：\n\n```\nmodel.on('change:firstName',\
    \ function () {\n  console.log('firstName changed!');\n});\n\n// 即使直接设置属性，上面注册的回调\n\
    // 仍然会被调用。\nmodel.firstName = 'Henrik';\n```\n\nGetter 和 setter 给了我们巨大的灵活性，这可能是坏事。例如，我们可以在访问属性时让\
    \ getter 运行任何我们想要的代码并返回任何值。\n\n```\ntrickyModel.firstName = 'Henrik';\n\nconsole.log(trickyModel.firstName);\n\
    // 尽管上面看起来只是进行了赋值，\n// 我们可以让它输出*任何*我们想要的东西。\n```\n\n关于如何使用 getter/setter 的简要说明\n\
    \n请务必阅读下面的警告，但对于不熟悉的人来说，稍微解释一下 getter 和 setter 的写法可能会有用。有两种语法选项。\n\n第一种是直接使用 `get`\
    \ 和 `set` 操作符来定义这些方法：\n\n```\nvar myObject: {\n  _properties: {},\n  get name\
    \ () {\n    return this._properties.name;\n  },\n  set name (value) {\n    this._properties.name\
    \ = value;\n  }\n}\n```\n\n第二种是使用 `Object.defineProperty()`：\n\n```\nvar myObject\
    \ = {\n  _properties: {}\n};\n\nObject.defineProperty(myObject, \"name\", {\n\
    \  get: function () {\n    return this._properties.name;\n  },\n  set: function\
    \ (value) {\n    this._properties.name = value;\n  }\n});\n\n// 还有 defineProperties（复数形式）\n\
    Object.defineProperties(myObject, {\n  lastName: {\n    get: function () { ...\
    \ },\n    set: function () { ... }\n  },\n  fullName: {\n    get: function ()\
    \ { ... },\n    set: function () { ... }\n  }\n})\n```\n\n> 警告！\n\n可以想象，这种强大的能力给了你*很多*可以让你自缚手脚的绳索，因此，应该*非常*谨慎地使用这个功能。\n\
    \n有些人认为，我理解他们的观点，使用这个特性过于魔幻。如果你有这种感觉。幸运的是，在我们快乐的模块化世界里，你可以直接使用普通的 Backbone 模型。\n\
    \n然而，我碰巧认为在模型的上下文中，getter/setter 实际上可以使我们的代码更健壮、更易读。但是，我*只*将它们用于模型属性，并且只以可预测的方式使用。\n\
    \n### 4. 类型强制\n\nJavaScript 语言是动态类型的，这很棒。但我们已经说过，我们将模型作为应用程序的*核心*。知道某个属性是某个特定类型对于消除愚蠢的错误和保护我们自己非常有用。\n\
    \n让我们用一个简单的用户模型来比较两者。在 Backbone 中，没有定义属性的标准方式。相反，你只需设置一个值，就好像它存在一样，然后它就存在了。\n\n\
    ```\n// Backbone 模型，不需要定义。\n// 甚至没有标准方式来定义它应该存储的属性。\nvar model = new Backbone.Model();\n\
    \nmodel.set({\n  firstName: 'Henrik',\n  lastName: 'Joreteg'\n});\n\n// 现在我可以获取它们\n\
    model.get('firstName'); // 输出 'Henrik'\n```\n\n简单、优雅、灵活。但是，假设我在大型应用程序另一部分的某个视图代码中设置了这些值，我怎么知道我有哪些可用的属性，或者它们叫什么？\n\
    \n如果我是通过调用 API 获取数据，并使用返回的数据来设置模型的属性，那么我有两种选择来弄清楚我存储了什么数据以及我的视图有哪些可用数据。要么检查请求以知道我应该有哪些属性，要么在运行时在控制台中检查它，看看我的模型包含哪些属性以及它们的名称。\n\
    \n这看起来对开发者不太友好。\n\n想想我错过了多少信息：\n\n+   1. 我有哪些属性？\n    2. 这些属性包含什么类型的值？\n    3.\
    \ 我能相信这个属性总是包含一个值吗？\n    4. 这是客户端状态属性还是我们从服务器获得的数据？\n    5. 当我需要将模型更新到服务器时，哪些属性应该被发送？\n\
    \    6. 一个属性是否由其他属性计算得出？如果是，我如何保持它是最新的？\n    7. 也许最重要的是，我到哪里去找上述问题的答案？\n\n当然，下面的例子很蠢，但如果我写了一些愚蠢的代码（我们有时都会这样，对吧，人类？！）怎么办？\n\
    \n```\n// 没有任何阻止你将 firstName 属性\n// 设置为日期对象。\nmodel.set('firstName', new Date());\n\
    ```\n\n当然，你可能能在一定程度上把所有信息都记在脑子里，但当第二个开发者来看这段代码时怎么办？或者当你在六个月（甚至两周）后回来看这段代码时会怎样？你到哪里去看应用程序的结构？你不得不深入挖掘视图来寻找答案。\n\
    \n我更希望模型是存储状态的显式文档。\n\n看看在 AmpersandModel 中这会是怎样的：\n"
