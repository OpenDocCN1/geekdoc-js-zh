  mdcn: "\n## 客户端路由（如果存在的话）\n\n有时，浏览器应用会失去对浏览器“后退”按钮的妥善处理能力，以及“深度链接”到应用特定视图的能力。\n\n\
    好消息是，我们实际上不必做出这些权衡。通过对 Backbone 路由器和 HTML5 push state 的巧妙运用，浏览器应用可以征服世界。下面解释其工作原理……\n\
    \n### 换汤不换药的 URL\n\n从服务器的角度看，我们实际上如何“将路由控制权交给客户端”？嗯……网络的工作方式并非如此，对吧？当用户在浏览器中输入你应用的\
    \ URL 时，服务器必须响应实际的 HTTP GET 请求。\n\n所以我的意思仅仅是你在多个 URL 返回相同的应用 HTML。\n\n例如，无论你访问的是：\n\
    \nhttps://andbang.com/andyet/chat\n\n还是\n\nhttps://andbang.com/basecamp\n\n服务器都会返回这段\
    \ HTML：\n\n```\n<!DOCTYPE html>\n<script src=\"/!.js\"></script>\n```\n\n可以把它理解为一个\
    \ URL 块，它们都只提供该应用，这样可能更容易理解。\n\n如果你使用 Express 和 Node，实现起来相当容易。\n\n```\napp.get('/other/thing',\
    \ function () {\n    // 你仍然可以在特定 URL 提供其他支持页面\n    // 和简单的内容。\n});\n\n// 但你想要某种\
    \ catch-all 来匹配\n// 你希望单页应用可用的 URL 范围：\napp.get('*', function (req, res) {\n \
    \   res.sendFile('sameSh*t.html');\n});\n```\n\n当然，大多数框架都可以做到这一点，甚至通过 nginx 配置也可以。\n\
    \n但最大的区别在于，此时我们已经让浏览器应用而非服务器负责查找/获取正确数据和渲染正确视图。\n\n### 如何处理客户端路由\n\nAnd Bang 为每个任务都有一个详情页，其\
    \ URL 结构如下：\n\nhttps://andbang.com/andyet/tasks/47\n\n因此，如果用户在浏览器中输入该 URL，他们将看到该任务的详情视图。此外，如果他们在应用的其他地方，通过点击列表中的任务导航到该任务视图，页面不会重新加载，但当你查看浏览器中的\
    \ URL 栏时，你就在该页面上。\n\nBackbone 的路由器对于处理所有这些事情非常方便。\n\n但是，为了理解这在实践中如何运作，我们需要稍微谈谈应用的启动序列。\n\
    \n### 3... 2... 1... 发射！\n\n通常，在你准备好“响应”客户端代码中的特定 URL 之前，会有一个相当具体的加载顺序需要完成。\n\n\
    通常，该顺序大致如下：\n\n- 初始化你的主应用对象。（我一直在谈论的“app”全局对象。）\n- 将几个模型集合附加到该 app 全局对象。\n- 初始化并填充一个代表当前登录用户的单一“me”对象，并存储会话特定状态。\n\
    - 在 <body> 标签内渲染应用布局视图。\n- 获取任何需要的应用范围数据。\n- 然后触发客户端路由器\n\n现在用代码表示：\n\n```\nmodule.exports\
    \ = {\n  // 主启动函数。这是\n  // 你应用的入口点。\n  launch: function () {\n    // 显式创建一个名为\
    \ \"app\" 的全局对象。\n    // 首先这样做意味着它*总是*存在\n    // 如果我们需要从视图中访问它。\n    window.app\
    \ = this;\n\n    // 附加一些模型集合\n    this.tasks = new Tasks();\n    this.chatMessages\
    \ = new Messages();\n\n    // 初始化一个 'me' 对象\n    window.me = new Me();\n\n   \
    \ this.fetchStandardData(function (err) {\n        if (err) {\n            //\
    \ 处理错误\n        }\n        // 渲染主视图\n        app.view = new MainView({\n     \
    \       model: me\n        }).render();\n\n        // 启动我们的路由器。\n        // 初始化我们的\
    \ URL 处理器和历史记录跟踪器\n        new Router();\n        app.history = Backbone.history;\n\
    \        // 我们有了所需的一切，现在可以启动路由器并显示适当的页面\n        app.history.start({pushState:\
    \ true, root: '/'});\n    });\n\n  },\n  fetchStandardData: function (mainCallback)\
    \ {\n    var self = this;\n    async.parallel([\n        function (cb) {\n   \
    \         self.tasks.fetch({success: cb});\n        },\n        function (cb)\
    \ {\n            me.fetch({success: cb});\n        }\n    ], mainCallback);\n\
    \  }\n}\n```\n\n如你所见，无论 URL 是什么，我们都会做几件事。一旦我们搞定了这些，我们就初始化路由器并开始历史跟踪（这启用了后退按钮支持）。\n\
    \n客户端路由器大致如下：\n\n```\nvar Backbone = require('backbone');\nvar TaskDetailPage\
    \ = require('pages/taskDetail');\nvar FourOhFourPage = require('pages/fourOhFour');\n\
    \nmodule.exports = Backbone.Router.extend({\n    routes: {\n      '': 'home',\n\
    \      ':slug/:slug/task/:taskid': 'memberTaskDetail',\n      ...\n    },\n\n\
    \    // --------- 路由处理器 ----------\n    home: function () {\n      app.navigate(app.teams.first().chatUrl);\n\
    \    },\n\n    memberTaskDetail: function (teamId, memberId, taskId) {\n     \
    \ var team = app.teams.get(teamId);\n      var member = team && team.members.get(memberId)\n\
    \n      // 确保我们找到了模型，或者发送到内部\n      // “未找到”页面。\n      if (!team || !member) return\
    \ this.fourOhFour();\n\n      // 我们可能有也可能没有任务，所以我们只是传递它并尝试从视图中获取。\n      app.renderPage(new\
    \ TaskDetailPage({\n        team: team,\n        member: member,\n        taskId:\
    \ taskId\n      }));\n    },\n\n    fourOhFour: function () {\n      app.renderPage(new\
    \ FourOhFourPage());\n    }\n});\n```\n\n因此，顶部列出的每个路由都被 Backbone 转换成正则表达式并链接到一个处理函数。\n\
    \n该函数被调用时带有“参数”，即你在路由中指定为动态的那些参数。\n\n我通常将每个处理器的工作视为查找实际的客户端模型对象，然后创建一个“页面”视图，将其传递给应用程序。\n\
    \n应用负责采用该视图并按照应用的约定进行渲染。通常，我们只是让“页面视图”成为一种特殊类型的 Backbone 视图，该视图还具有一些用于“显示”和“隐藏”的标准方法。应用控制器只需对新页面调用“show”，对当前活动页面调用“hide”，视图会从应用布局的主要“页面”容器中添加/移除自身。\n\
    \n从这以后，我们永远不需要再次执行启动序列。我们只需更改路由，然后路由处理器会渲染适当的页面，页面将确保它拥有（或获取）所需的数据。\n\n## 不糟糕的测试与质量保证（这样你的应用才不会糟糕）\n\
    \n### 正确界面质量保证的问题/挑战\n\n我们都知道我们需要测试。在构建浏览器应用时，我发现构建一个广泛的测试套件不一定值得付出努力。界面本质上难以测试，因为人类输入的变异性是界面良好测试的一部分。\n\
    \n此外，有些事情就是有点难测试。例如，如果你的界面支持拖放操作，编写一个能正确验证其工作正常的测试并不容易。\n\n然后还有 CSS 变化“问题”。DOM\
    \ 可能完全正常，但如果样式有误，东西看起来可能非常破碎，或者可能出现布局问题，其中控件被遮盖或无法点击。\n\n有些人构建非常复杂的质量保证系统，将他们的应用加载到无头浏览器中，并截取与参考图像等进行比较的截图。但在大多数情况下，所需的大量工作和设置根本不实用。\n\
    \n还有一些工具，如 Selenium，可以为你编写浏览器脚本，但这需要大量的工作和设置，然后每次你想更改某些内容时，如果你的测试太具体，它们就需要不断更新。而如果它们太笼统，它们又会遗漏一些东西。\n\
    \n虽然无头浏览器测试是一个非常酷的想法（PhantomJS 等），但它并不能真正帮助你了解你的应用在其他浏览器中的工作情况。\n\n最终，我认为如果没有人类，你实际上无法进行适当的界面测试。\n\
    \n因此，必须在人类批准和监督与利用计算机擅长的事物（如流程、一致性、自动化）之间找到平衡点。\n\n### 认识一下 SpaceMonkey\n\n所以我们一直在构建一个，我们称之为\
    \ SpaceMonkey。以前没有这样的工具能以浏览器无关、简单且将自动化与人类批准相融合的方式做到这一点。\n\n我们还有很多工作要做才能让它变得很棒，但它已包含在应用生成器中，如果你选择“express”选项的话，尽管如此，它似乎值得一提。\n\
    \n它使用 QUnit，这是由 jQuery 团队制作的客户端测试工具。但它不是运行简单的程序化测试。它将你的应用加载到一个 `<iframe>` 中\n"
