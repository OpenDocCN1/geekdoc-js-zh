    # Model alternatives


    In order to provide observability, models generally provide some sort of event
    registration system and a way to set and get some “protected” attributes.


    For a long time, I used Backbone models for everything. The code for them is quite
    simple and readable (YES!); they’re also flexible and easy to use. Also, I’m generally
    a big fan of Backbone’s principles and structure.


    Yet, you’ll notice the examples all use `AmpersandModel` instead of `Backbone.Model`.


    Despite our love for Backbone at &yet, a few things finally drove us to create
    [Ampersand.js](http://Ampersand.js).


    Backbone is brilliantly simple and solves many common problems in developing clientside
    applications. But we missed the focused simplicity of tiny modules in node-land.


    We wanted something similar in style and philosophy, but that fully embraced tiny
    modules, npm, and browserify. For more info on those tools check out the [Ampersand.js
    site](http://Ampersand.js site).


    The specific things we wanted from models are:


    +   1. Readability


    If the models are the core of our application (as they should be), someone should
    be able to open the code for the model and *read* what properties it'
  merge: -1
