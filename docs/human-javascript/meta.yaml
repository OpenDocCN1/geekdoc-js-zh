  - "[PAGE 76]\n\n```\nrender: function () {\n  this.renderWithTemplate();\n  this.renderCollection(this.collection,\
    \ ItemView, this.get('.myItemList'));\n}\n});\n```\n\nFor more on AmpersandView,\
    \ or to contribute and make it better, see the documentation and source on [GitHub](https://github.com/AmpersandJS/ampersand-view).\n\
    \n# A bit about defining bindings in templates (à la AngularJS, Ractive)\n\nThere\
    \ are several libraries out there that let you specify in your templates which\
    \ pieces of information go where in your DOM and then they automatically create\
    \ the event bindings for you.\n\nBasically, you'd have a template like this:\n\
    \n```\n<div>\n  <p>Hello {{ name }}</p>\n</div>\n```\n\nThen you mash that together\
    \ with your model and then they're automatically bound. As a paraphrased pseudo-code-y\
    \ example:\n\n```\nvar template = require('compiled-template-from-somewhere');\n\
    var model = require('./models/some-model');\n\ndocument.body.appendChild(template(model));\n\
    \n// Then if you changed the model\nmodel.set('name', 'Sue');\n\n// the DOM would\
    \ be automatically be updated to:\n/*\n<div>\n  <p>Hello Sue</p>\n</div>\n*/\n\
    ```"
  - "[PAGE 77]\n\nIt’s really a matter of preference and luckily it’s easy enough\
    \ to switch it out for whatever method you prefer.\n\nFor simple, put-this-text-here\
    \ bindings, it’s all pretty straightforward.\n\nWhere things can potentially get\
    \ a bit messy is if what you actually want is a bit of logic. Say you want to\
    \ add/remove an item from a list of classes based on a boolean property on a model,\
    \ or say you want to add/remove an entire attribute, like `checked`. In order\
    \ for the template language to know that’s what we want, it has to have some type\
    \ of new syntax to indicate how the binding should behave.\n\nIn my opinion, this\
    \ is where many of these languages go too far. They simply try to do too much\
    \ declared logic in a template. Personally, it doesn’t feel right to be writing\
    \ code within markup.\n\nThe important thing to recognize is that both the template\
    \ language approach and the declarative bindings are *really doing the same thing*.\
    \ They’re just a way of building a set of functions that can turn “Hey, this value\
    \ changed on a model” into the actual DOM method that will update the DOM, for\
    \ example: `someElement.setAttribute('href', '/my-url')`.\n\nIf you’re wanting\
    \ to use a templating language that can also do the bindings for you, I’d strongly\
    \ recommend: Phil Robert’s domthing. It’s a variant of mustache that let’s you\
    \ automatically bind using templates that look like this:\n\n```\n<div class=\"\
    entry\">\n  <h1>{{title}}</h1>\n  <div class=\"body\">\n    {{body}}\n  </div>\n\
    </div>\n```\n\nBut it will also automatically create bindings for those properties\
    \ to the"
