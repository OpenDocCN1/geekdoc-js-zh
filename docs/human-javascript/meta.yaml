    It works like this:\n\n```\nvar AmpersandView = require('ampersand-view');\nvar\
    \ templates = require('templates');\n\nmodule.exports = AmpersandView.extend({\n\
    \  template: templates.widget,\n  events: {\n    // The event + element: the name\
    \ of the handler\n    'click .delete': 'handleDeleteClick',\n    'keyup input.search':\
    \ 'handleSearchKeyUp'\n  },\n  render: function () {\n    // This we inherit from\
    \ ampersand-view\n    this.renderWithTemplate();\n  },\n  handleDeleteClick: function\
    \ () {\n    this.model.delete();\n  },\n  handleSearchKeyUp: function () {\n \
    \   var inputVal = this.$('.search').val();\n    this.collection.each(function\
    \ (model) {\n      model.matchesSearch = this.name.indexOf(inputVal) !== -1;\n\
    \    });\n  }\n});\n```\n\nThat events hash is equivalent to doing the following\
    \ inside the render method.\n\n```\nrender: function () {\n    // This we inherit\
    \ from ampersand-view\n    this.renderWithTemplate();\n    $(this.el).delegate('.delete',\
    \ 'click', _.bind(this.handleDeleteClick, this));\n    $(this.el).delegate('input.search',\
    \ 'keyup', _.bind(this.handleSearchKeyUp, this));\n},\n```\n\nBut the events hash\
    \ is less verbose and arguably more readable."
  - "[PAGE 71]\n\n# Binding model values to templates\n\nIn order to keep our separation\
    \ of concerns, very rarely do I set style attributes directly from JavaScript.\
    \ I believe that is a job for CSS. So much of what I do is flip classes based\
    \ on property values on the underlying model.\n\nBackbone kind of loosely encourages\
    \ you to just re-render views entirely when something changes. In a lot of cases\
    \ that’s totally fine, but I like only changing the specific thing that needs\
    \ updating when the underlying model changes. Obviously, this can be a bit more\
    \ tedious because you have to bind each thing explicitly somehow.\n\nThis is where\
    \ AmpersandView comes in handy. Much in the same way that we declare event handlers\
    \ in the `events` hash as described above, we can also declare data bindings of\
    \ various types in our views as follows:\n\n```\nvar AmpersandView = require('ampersand-view');\n\
    var templates = require('templates');\n\nmodule.exports = AmpersandView.extend({\n\
