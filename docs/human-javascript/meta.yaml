    \    });\n  }\n});\n```\n\n通过这种方式，你可以遵循与 Backbone 类似的风格和模式，来指定哪些属性（或计算属性）需要绑定到哪些\
    \ DOM 元素。\n\n作为额外的好处，所有处理程序都使用 `listenTo()` 方法注册，该方法会在视图销毁时处理这些处理程序的解绑。\n\n[ampersandjs.com\
    \ 文档站点](https://ampersandjs.com/docs) 有所有可用绑定类型的完整列表。\n\n## AmpersandView 的便捷方法\n\
    \n### .renderWithTemplate();\n\nBackbone 文档中提倡的通用模式是使用模板来填充视图根元素的内容。这样，你就永远不必重新注册任何\
    \ DOM 事件处理程序，因为它们附加在视图的根元素上。采用这种方法（对于某些用途来说是完美的），你只需在模型中的任何内容发生变化时调用 `.render()`\
    \ 即可。\n\n如果你有一个渲染单个模型的简单视图，那么绑定视图就会变得非常容易。你只需做类似这样的事情：\n\n```\nvar Backbone =\
    \ require('backbone');\nvar _ = require('underscore');\nvar templates = require('templates');\n\
    \nmodule.exports = Backbone.View.extend({\n  template: templates.user,\n  events:\
    \ {\n    'click .myClass': 'myHandler'\n  },\n  initialize: function () {\n  \
    \  // Register a single change handler for the model\n    this.listenTo(this.model,\
    \ 'change', _.bind(this.render, this));\n  },\n  render: function () {\n    //\
    \ We simply fill the contents of the current element with\n    // the rendered\
    \ HTML using the model's current attributes each time.\n    $(this.el).html(this.template(this.model.toJSON()));\n\
    \  },\n  myHandler: function () {\n    // Do something\n  }\n});\n```\n\n此时，我们对该模型所做的任何更改都将简单地重新渲染整个\
    \ HTML。巧妙、简单、易于实现。\n\n然而，这并不总是你想要的，尤其是在实时应用程序中，当一个传入事件到来并在你未准备好时更改了模型。但也许一个更有说服力的例子是你想使用\
    \ CSS3 过渡和动画的情况。如果我们想添加一个触发过渡的类，简单地重绘整个容器实际上并不会触发它，因为实际上从未有过过渡。\n\n此外，对我来说，编写仅包含视图元素内容的模板感觉不太对：\n\
    \n```\n<h1>My page</h1>\n<p>My content</p>\n```\n\n编写包含根元素本身在内的*整个*视图模板似乎更符合逻辑：\n\
    \n```\n<section class=\"page\">\n  <h1>My page</h1>\n  <p>My content</p>\n</section>\n\
    ```\n\n因为现在，只需查看那个模板，我就能知道它是什么，而无需知道哪个视图将使用它。\n\n此外，如果我想在根元素上包含一些条件类或其他属性，我可以声明式地在模板中与其他内容一起完成，而不必在视图的\
    \ render 方法中执行。\n\n现在，来看 `renderWithTemplate(contextObject)`。这简单地封装了使用 `template`\
    \ 属性渲染视图所需执行的所有操作，同时替换整个现有根元素并确保事件哈希中的所有事件处理程序都已注册。如果你的 `template` 是一个函数，它将使用你调用\
    \ `renderWithTemplate` 时传递的 contextObject 来调用。\n\n最基本的情况是，`template` 可以是一个简单的\
    \ HTML 字符串，但它也可以是一个返回 HTML 字符串的函数，或一个返回 DOM 元素的函数。\n\n### .listenToAndRun();\n\
    \n非常常见的是，当你想监听模型上的某些变化时，你通常希望：\n\n1. 绑定处理程序，以便在调用时，`this` 是视图。\n2. 运行绑定的处理程序一次，以便其效果应用于\
    \ DOM。（这避免了在模板中重复处理程序中已有的逻辑）。\n\n`.listenToAndRun()` **同时为你做了这两件事。**\n\n所以，你不必这样写：\n\
    \n```\n...\ninitialize: function () {\n  this.listenTo(this.model, 'change', _.bind(this.doSomething,\
    \ this));\n  this.doSomething();\n}\n...\n```\n\n你可以直接这样写：\n\n```\n...\ninitialize:\
    \ function () {\n  this.listenToAndRun(this.model, 'change', this.doSomething);\n\
    }\n...\n```\n\n### .renderCollection();\n\n`.renderCollection()` 是一种轻量级的方式，用于在容器内渲染和维护模型集合。\n\
    \n它会监听集合上的 `add`、`remove`、`sort` 事件，并在必要时为每个模型重新排列和重新绘制视图。\n\n你只需将集合、你想要用来渲染每个模型的子视图，以及你想要传递给子视图的选项集传递给它，它就会处理其余的事情。\n\
    \n示例：\n\n```\nvar AmpersandView = require('ampersand-view');\nvar templates =\
    \ require('templates');\nvar ItemView = require('./item');\n\nmodule.exports =\
    \ AmpersandView.extend({\n    template: templates.myPage,\n```\n"
