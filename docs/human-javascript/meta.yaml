    # Separating views and state


    This is the biggest lesson I''ve learned building lots of single page apps. Your
    view (the DOM) should just be reacting to the model state of your application.
    For this you could use any number of tools and frameworks. I often recommend reading
    the [Backbone documentation](https://backbonejs.org/) to developers who are new
    to these concepts. It provides a clear "just JavaScript"™ approach'
  - '[PAGE 32]


    to this and serves as a fantastic primer to the problems of building clientside
    apps.


    Essentially, you''ll populate a set of models and collections of these models
    in memory in the browser. These will store all the application state for your
    app. These models should be completely oblivious to how they''re used; they merely
    store state and broadcast their changes. Then you will have views that listen
    for changes in the models and update the DOM. This core principle of separating
    your views and your application state is vital when building large apps.


    One aspect of this approach that is commonly overlooked is the flexibility it
    provides if you decide the app should have a different UI (<sarcasm>which *never*
    happens, right?*</sarcasm>), or if you build another application on the same API.
    All of the models pretty much without modification are completely reusable.


    # CommonJS Modules


    I''m not going to get into a debate about module styles and script loaders. But
    I can tell you this: I haven''t seen any cleaner, simpler mechanism for splitting
    your code into nice isolated chunks than CommonJS modules.


    Let''s pause for just a second to discuss what modules do for us. JavaScript has
    globals. What I mean is if you don''t put a `var` in front of any variable declaration,
    you''ve just created a global variable that''s accessible from *any* other code
    in your app. While this *can* be used for good it also gives you a lot of rope
    to hang yourself with. Without a way of managing this, as your app grows, knowing
    what global variables you have at what time will become nearly impossible and
    will likely be a big source of bugs.'
  - "[PAGE 33]\n\nWe also want to build our app in tiny pieces of independent code\
    \ (a.k.a. modules). So, how do we make sure each module has access to what it\
    \ needs? By not referencing globals and by having each module explicitly `require`\
    \ other code that it needs. That’s why we need a module system. Very few things\
    \ will have a greater positive impact on your code structure than switching to\
    \ a good module system.\n\nCommonJS is the same style/concept that is used in\
    \ Node. By following this style you get the additional benefit of being able to\
    \ reuse modules written for the client on the server and vice versa (though, the\
    \ overlap is usually not that big).\n\nIf you’re unfamiliar with the CommonJS\
    \ modules style, your files end up looking something like this:\n\n```\n// You\
    \ import things by using the special `require` function and you can\n// assign\
    \ the result to a variable\nvar AmpersandModel = require('ampersand-model');\n\
    var _ = require('underscore');\n\n// You expose functionality to other modules\
    \ by declaring your main export\n// like this.\nmodule.exports = AmpersandModel.extend({\n\
    \    type: 'navItem',\n    props: {\n        active: ['boolean', true, false],\n\
    \        url: ['string', true, ''],\n        position: ['number', true, 200]\n\
    \    },\n    init: function () {\n        // Do something\n    }\n});\n```\n\n\
    That’s it! Super easy. You don’t create any globals. Each file that uses your\
    \ module can name it whatever makes the most sense for use in that module.\n\n\
    You just export a constructor (like above), or a single function, or even a set\
    \ of functions. Generally, however, I’d encourage you to export only one thing\
    \ from each module."
  - '[PAGE 34]


    Of course, browsers don''t have support for these kinds of modules out of the
    box (there is no `window.require`). But, luckily that can be fixed. We use a clever
    little tool called [browserify](https://browserify.org/) that lets you `require`
    whatever modules you need. This also includes being able to declare dependencies
    in a `package.json` file and just installing `require()`-able modules from npm
    into your project. With this approach, no clientside specific package management
    like Bower is required. You simply declare your dependencies in your package file
    and install them.


    Browserify will create a `require` system and starting with the module you specify
    as an entry point it will include each `require`-ed piece of code into an app
    package that can be sent to the browser.


    Browserify is written for Node but even if you''re using something else to build
    your web app, you can use Node and browserify to build your client package. Ultimately,
    you''re just creating a single JS file. So once it''s generated, that file can
    be served just like any other static file by any file server you want.


    # Grab your moonboots


    If you''re used to building apps where each script in your app directory has a
    corresponding `<script>` tag hardcoded in some HTML file somewhere it can be a
    bit confusing when switching to using a script module system like browserify.


    As I touched on in Chapter 2, we really would like our production environment
    to serve a single, minified, `.js` file with a unique file name so that we can
    tell browsers to cache it forever. However, that''s far from ideal in a development
    environment because we don''t want to debug minified'
