    // 这是*很棒*的部分，我_不能_设置一个未定义的属性。\n// 所以如果我输入错误了属性名，它不会生效。\n// *请注意，AmpersandModel在调用`set()`时对未声明属性的行为是可以配置的。\n\
    // 更多信息请参阅 ampersand-model 文档。\nmodel.frstName = 'Henrik';\n```\n\n通过强制执行这种级别的属性定义，我们始终确保我们的模型——作为应用程序的“骨干”（双关语）——是易于理解的代码，有助于记录应用程序的构建方式。\n\
    \n## 5. 更好地处理列表/日期\n\n使用getter/setter处理模型的另一个论点是，它使得观察对象属性的变化成为可能。至少在使用数组和日期作为属性时是这样。\n\
    \n由于数组和日期在JS中是对象，它们是通过引用传递的。\n\n那么，如果我们想将ID列表作为用户的属性来存储，会发生什么？\n\n在Backbone中，我们如何获得change事件？\n\
    \n```javascript\nvar model = new Backbone.Model();\n\nmodel.set('ids', ['23',\
    \ '25', '47']);\n```\n\n```javascript\n// 如果我们想获取它们并进行修改\nvar myIds = model.get('ids');\n\
    \n// 如果我们现在修改它...\nmyIds.reverse();\n\n// ...并把它设置回去\nmodel.set('ids', myIds);\n\
    \n// 我们永远不会从Backbone得到change事件\n```\n\n如果你理解JavaScript，你会意识到这不是Backbone的缺陷，只是因为JavaScript按引用传递对象。\n\
    \n因此，当Backbone收到“set”事件时，它只是比较 `this.get('ids') === newIds`，这将始终为true，因为你在比较同一个对象，而不是它的副本。\n\
    \n对于日期也是如此。如果你获取一个日期对象，在其上调用一个方法，比如`setHours()`，然后再设置回去，你永远不会得到change事件。所以你不知道你需要更新视图。\n\
    \n我们可以在那些*我们*明确希望这种行为的情况下，通过getter/setter来解决这个问题：强制模型在我们访问属性时总是给我们一个新对象。\n\n```javascript\n\
    var AmpersandModel = require('ampersand-model');\n\n// 设置一个简单的模型定义\nvar DemoModel\
    \ = AmpersandModel.extend({\n  props: {\n    ids: ['array', true, []]\n  }\n});\n\
    \n// 然后我们使用它\nvar model = new DemoModel();\n\n// 获取我们的数组\nvar arr = model.ids;\n\
    \n// 修改它\narr.push('something');\n\n// 这现在触发了change事件\nmodel.ids = arr;\n```\n\
    \n## 模型总结\n\n模型应包含以下内容：\n\n1.  我们从API获取的属性\n2.  我们需要用于跟踪客户端状态的属性（selected等）\n\
    3.  验证自身数据完整性的机制\n4.  我们可以调用来更新或删除服务器上相应模型的方法\n5.  用于以某种方式描述或处理属性的便捷访问器（又名派生属性），以便重用\n\
    6.  子集合（如果适用）\n\n模型应*永远不*包含：\n\n1.  任何操作DOM的内容\n2.  任何DOM事件处理程序\n\n你可以在 [Ampersand.js\
    \ 文档](https://docs.ampersandjs.com/) 中阅读更多关于ampersand-model的内容。\n\n## 视图\n\n为了遵循一个非常老套的说法，视图是实践发生的地方。它是你的模型层与DOM相遇的地方。\n\
    \n在深入细节之前，让我们先谈谈为什么我认为视图是一个很好的模式。它们提供给我们的主要是一个干净的方式来封装和存储应用程序如何与DOM交互的所有逻辑。事实上，它比这更具体；我们将它们用于封装DOM中*特定元素*的所有逻辑。每个视图负责单个元素的内容、事件处理和更新，视图中的事件处理程序将用户操作转换为对模型的更改。\n\
    \n正如我在前几章已经暗示的那样，分离应用模型和视图为我们提供了*极大的*灵活性。我们可以更改整个应用程序的布局和HTML结构，而无需更改应用程序从API获取、存储或更新数据的任何方式。因此，就像CSS帮助我们清晰地将文档的样式与HTML内容分开一样，视图帮助我们将DOM创建、更新和事件从我们应用的模型层中分离出来。\n\
    \n视图的另一个*巨大*好处是它们让我们可以将所有事件处理程序（点击处理程序等）干净地捆绑在一起，并与DOM的相关部分关联。如果你曾经尝试过在没有视图的情况下构建单页应用，你就会知道管理大量的事件处理程序往往是bug、内存泄漏和混乱代码的一个主要来源。\n\
    \n有许多工具、框架和方法来处理这一层——都带有不同程度的“魔法”。\n\n因此，为了延续我们追求可读性和关注点分离的主题，我们需要简单、明确、声明式的东西。\n\
    \nBackbone视图为构建视图层提供了一些非常棒的基础模式：\n\n1.  一个由视图控制的根元素，在视图内可通过 `this.el` 访问。\n2.\
    \  一个主要的模型和/或集合，分别通过 `this.model` 和 `this.collection` 访问。\n3.  一个负责用适当内容填充和维护该基础元素的\
    \ `render()` 方法。\n4.  一个可选的 `initialize()` 方法，用于任何必要的设置。\n5.  注册DOM事件处理程序的简写方式（`this.events`\
    \ 哈希）。\n6.  一种处理视图及其注册的任何监听器的方式。\n\n但是，它们*相当*基础，因此，我们将扩展Backbone视图以实现：\n\n1. \
    \ 使用我们在第8章中描述的预编译模板函数进行简单模板化。\n2.  一种声明模型/模板绑定的简单方式。\n"
