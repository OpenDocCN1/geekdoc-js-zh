- img_proc: true
  md: 'Browsers don’t expose a base EventEmitter class we can just use, so for clientside
    code we need to include one in order to take advantage of this pattern.


    We use a slightly modified version of a really awesome and lightweight one that
    was written by the LearnBoost guys: @tjholowaychuk, @rauchg and company. It’s
    wildemitter on my GitHub if you’re curious.


    Beyond standard `on()`, `off()` and `once()` methods it adds two main features:


    +   1. Wildcard event handlers for listening to all events in an object. For example:
    `emitter.on(''*'', function (eventName, event) { ... })` or `emitter.on(''namespace*'',
    function (eventName, event) { ... })`.

    2. Grouped event handlers, meaning you can specify which group the handlers are
    a part of when you register them and then unregister all the handlers in the group
    at once:


    ```

    var WildEmitter = require(''wildemitter'');


    var emitter = new WildEmitter();


    // Register one handler

    emitter.on(''something'', ''group1'', function () { ... });

    // Register another handler in the same group

    emitter.on(''someOtherEvent'', ''group1'', function () { ... });


    // Then release both of them

    emitter.releaseGroup(''group1'');

    ```


    Details and implementations aside the same basic concepts of adding and removing
    handlers are available in all event emitters.


    As an example, here’s a simplified version of the `andbang.js` library which is
    an SDK for talking to the And Bang API.


    ```

    // Require our emitter

    var Emitter = require(''wildemitter'');

    ```'
