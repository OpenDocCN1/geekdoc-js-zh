    \ true);\n    }\n};\n\n// Run our whole app, it all starts here:\nmodule.exports.blastoff();\n\
    ```\n\nNote that very last line that actually calls the `blastoff()` function.\
    \ That's how we kick off the whole thing. That's our main entry point to the app."
  - '[PAGE 41]


    # Using events: Modules talking to modules


    How do you keep your modules cleanly separated? Sometimes modules are dependent
    on other modules but we still want to be able to keep them loosely coupled? One
    good technique is triggering lots of events that can be used as hooks by other
    code. Many of the core components in Node are extensions of the EventEmitter class.
    This means you can register handlers that get called when events happen to that
    object, much like you would do in the browser when you want to register a click
    handler for an element on the page.


    I find that developers often assume that events are kind of magical or special
    things in JavaScript, but they''re not. In fact, building an event emitter from
    scratch is a really great learning exercise. They''re really quite simple. You''re
    just saying: “Please call this function when this thing happens.” Typically, you''ll
    see code like this:


    In browsers:


    ```

    document.getElementById(''something'').addEventListener(''click'', function ()
    { ... }, false);

    ```'
  - '[PAGE 42]


    In jQuery it looks like this:


    ```

    $(''#something'').click(function (event) { ... });

    // or

    $(''#something'').on(''click'', function (event) { ... });

    ```


    In EventEmitter it looks like this:


    ```

    myEventEmitter.on(''someEvent'', function () { ... });

    ```


    But they all do the same thing: they store a reference to the function you handed
    it (usually by adding it to an array of functions internally). Then, when the
    event happens, they call all the functions in the relevant array with information
    about the event. That’s it! No magic.


    This pattern is really useful when building reusable components yourself. Exporting
    objects and classes that inherit from some type of event emitter means that the
    code using your module can specify what they care about, rather than the module
    having to know.


    At points of interest within your module where you think some external source
    may care, you can just call `this.emit(''someEventName'', {some: ''data''})` and
    if there are any handlers for that event, they''ll be called.


    There are lots of implementations of event emitters with various features. Features
    usually involve various ways of registering and unregistering event listeners.
    For example, you may want to register a handler that only gets called the first
    time an event happens. So for this many event handlers have a `once()` method
    alongside the `on()` method. In addition, some event handlers give you a way to
    listen to all events emitted by a certain object, or perhaps all events in a certain
    namespace. These features can be useful for logging out all events (so you can
    debug), or for proxying events from one event source to another object.'
  - '[PAGE 43]


    Browsers don’t expose a base EventEmitter class we can just use, so for clientside
    code we need to include one in order to take advantage of this pattern.


    We use a slightly modified version of a really awesome and lightweight one that
    was written by the LearnBoost guys: @tjholowaychuk, @rauchg and company. It’s
    wildemitter on my GitHub if you’re curious.


    Beyond standard `on()`, `off()` and `once()` methods it adds two main features:


    +   1. Wildcard event handlers for listening to all events in an object. For example:
    `emitter.on(''*'', function (eventName, event) { ... })` or `emitter.on(''namespace*'',
    function (eventName, event) { ... })`.

    2. Grouped event handlers, meaning you can specify which group the handlers are
    a part of when you register them and then unregister all the handlers in the group
    at once:


    ```

    var WildEmitter = require(''wildemitter'');


    var emitter = new WildEmitter();


    // Register one handler

    emitter.on(''something'', ''group1'', function () { ... });

    // Register another handler in the same group

    emitter.on(''someOtherEvent'', ''group1'', function () { ... });


    // Then release both of them

    emitter.releaseGroup(''group1'');

    ```


    Details and implementations aside the same basic concepts of adding and removing
    handlers are available in all event emitters.


    As an example, here’s a simplified version of the `andbang.js` library which is
    an SDK for talking to the And Bang API.


    ```

    // Require our emitter

    var Emitter = require(''wildemitter'');

    ```'
  - "[PAGE 44]\n\n```\n// Our main constructor function\nvar AndBang = function (config)\
    \ {\n    // extend with emitter\n    Emitter.call(this);\n};\n\n// Inherit from\
    \ emitter, but retain constructor\nAndBang.prototype = Object.create(Emitter.prototype,\
    \ {\n    constructor: {\n        value: AndBang\n    }\n});\n\n// Other methods\n\
    AndBang.prototype.setName = function (newName) {\n    this.name = newName;\n \
    \   // We can trigger arbitrary events\n    // these are just hooks that other\n\
    \    // code could chose to listen to.\n    this.emit('nameChanged', newName);\n\
    };\n\n// Export it to the world\nmodule.exports = AndBang;\n```\n\nThen, other\
    \ code that wants to use this module can listen for events like so:\n\n```\nvar\
    \ AndBang = require('andbang');\nvar api = new AndBang();\n\n// Now this handler\
    \ will get called any time the event gets triggered\napi.on('nameChanged',  function\
    \ (newName) { /* do something cool */ });\n```\n\nThis pattern makes it easy to\
    \ expose functionality without needing overly specific knowledge about how it’s\
    \ going to be used."
  - "[PAGE 45]\n\n# Models\n\n# A simple example\n\nLet's say you have a list of items.\
    \ When a user clicks on an item, you want to visually mark it as selected. Someone\
    \ used to building simple apps would probably do something like this:\n\n```\n\
    // Register a click handler on the parent list\n$('ul.theList').delegate('click',\
    \ 'li', function () {\n  // Toggle a class on the clicked item\n  $(this).toggleClass('selected');\n\
    })\n```\n\nSo now, clicking on an item will toggle a class. jQuery's `toggleClass()`\
    \ method will check whether it's already got the class, and add or remove it as\
    \ necessary. Great! We're done!\n\nErr... well typically if you're going to select\
    \ something it's for a reason, right? So our app is going to want to *do* something\
    \ with the selected item or items."
  - "[PAGE 46]\n\nLet's say the user has selected several things and now wants to\
    \ delete them by clicking a delete button. No problem, you say, we just add a\
    \ button handler that find the ones with the selected class and deletes them.\n\
    \n```\n$('button.delete').click(function () {\n  // Get our selectedDOM items,\
    \ loop through them\n  $('ul.theList li.selected').each(function () {\n    //\
    \ But we also have to have a way to figure out what\n    // ID each one of these\
    \ things represent so we can pass\n    // the correct info to the server. So,\
    \ let's assume we use\n    // HTML5 data attributes. Luckily jQuery's data() method\n\
    \    // reads all those and returns them as an object.\n    var id = $(this).data('serverId');\n\
    \    var listId = $(this).data('listId');\n    $.ajax({\n      type: 'delete',\n\
    \      url: '/lists/' + listId + '/widgets/' + id,\n      success: function ()\
    \ {\n        // Do something\n      },\n      error: function () {\n        //\
    \ Let the user know, somehow\n      }\n    })\n  });\n});\n```\n\nOk, not too\
    \ terrible, you say?\n\nWell now what if we've got these additional requirements?\n\
    \n+   1. There isn't just one list, there are several on the page at once. There\
    \ are some actions that can be performed in bulk, but only for some of the items\
    \ in some of the lists.\n2. There are some items you can't delete, because you\
    \ don't have permission to, but you can still select them and annotate them.\n\
    3. Deleting the item is only one of six different possible actions you can take\
    \ with each item.\n4. You have to support full keyboard control, as well as handling\
    \ mouse clicks.\n5. You now want to support selecting the top item, holding shift\
    \ and clicking the bottom one to select a range."
- md: "## If you continue this same approach, you’re in deep doo doo\n\nYou can handle\
    \ adding features to a point. But you will reach a point where you start arguing\
    \ against adding features, not because you don't think they're good ideas, but\
    \ because you're scared to implement them because of the headaches and bugs it\
    \ will inevitably cause.\n\nWelcome to nearly everyone's first single page app\
    \ experience.\n\n## Enter Models\n\nIf you've never used models in client-side\
    \ code, it's not as intimidating as it may sound. The idea is simply that we create\
    \ some data structures in the browser, separate from the DOM, that hold the data\
    \ that we got from the server as well as any client-specific data or state.\n\n\
    The “selected” state as described above is a good example of client-specific state,\
    \ meaning when we go to update an entry in the API, we're not going to send `{selected:\
    \ true}` as one of its properties. The server doesn't care about that, it's just\
    \ used to track the state of the user interface.\n\nSo, what is a model anyway?\
    \ What does it give us?\n\nThe fundamental thing a model should provide is observability.\
    \ What do I mean? Well, in the same way you can register an event listener in\
    \ the browser that responds to a form input value changing:\n\n```\ndocument.getElementById('myInput').addEventListener('change',\
    \ function () {\n  // Do something with the value\n});\n```\n\nA model should\
    \ let us listen for changes to its properties:\n\n```\nmodel.on('change:selected',\
    \ function (newValue) {\n  // Do something with the new value\n});\n```\n\nIn\
    \ addition, models should contain functionality that makes it easy for us to work\
    \ with that data. That means things like exposing some processed form of the data\
    \ should be a method on the model. Let's say one of the model properties represents\
    \ a date. We may have a method on the model for getting a nicely formatted date\
    \ string built from that date object. Arguably this is a presentation issue, but\
    \ the model ends up being a logical place to expose a string version of the date\
    \ property for maximum re-use and consistency.\n\nIn addition, models are a good\
    \ place for methods that perform actions on the model itself, like updating the\
    \ server when the model changes.\n\nIn And Bang, we do a lot with tasks. You can\
    \ assign them to each other, \"ship\" them, \"later\" them, \"trash\" them, etc.\n\
    \nSo, each of these actions are represented by a method on the task model that\
    \ sends the correct data to the server, as well as updating the appropriate properties\
    \ on the local model.\n\nFor example, here's the `trash` method of a task in And\
    \ Bang:\n\n```\n... },\ntrash: function () {\n  if (this.deleteable) {\n    this.removing\
    \ = true;\n    this.api('deleteTask');\n  }\n  return this.deleteable;\n},\n...\n\
    ```\n\nIt includes an upfront check to see whether we even have permission to\
    \ trash this item. In case you're wondering, this isn't actually used to enforce\
    \ this permission, that's the API's job.\n\nIn fact, that's worth a little tangent\
    \ to drive home the purpose of an API. It's *always* the API's job to maintain\
    \ its own data integrity. You shouldn't *ever* be able to do anything in the client\
    \ code that puts your API data in a weird or broken state. For example, never\
    \ leave it up to your client code to know that if you delete a list you also have\
    \ to go delete all the items in the list. That's the API's job.\n\nContinuing…\
    \ calling the `trash` method sets a local state property `removing` and then calls\
    \ the API method that sends the command to the server to delete the task (in this\
    \ case via WebSocket, but the transport is irrelevant).\n\nBut the cool thing\
    \ is, that's *it*. That's all we have to do when we want to delete a widget. You\
    \ simply have to look up the widget's model and call `.trash()`.\n\nNowhere in\
    \ this code do you see anything about removing the item from the DOM.\n\nThat\
    \ happens when we get confirmation from the API that the task was removed. It\
    \ is then removed from the collection, which triggers a `remove` event on the\
    \ collection and the view (which represents the DOM, as described in the next\
    \ chapter) listens for `remove` events and plucks that list item out of the DOM.\
    \ It may sound a bit complex, but only in that you have to describe all those\
    \ relationships. Once you have it, it's beautifully simple.\n\nAssuming we've\
    \ got a view that represents that model, the view would have a click handler like\
    \ this:\n\n```\nvar Backbone = require('backbone');\nmodule.exports = Backbone.View.extend({\n\
    \  // Our events hash (explained in the next chapter)\n  events: {\n    'click\
    \ .delete': 'handleDeleteClick'\n  },\n  // Our handler simply calls \"trash\"\
    , nothing more\n  handleDeleteClick: function() {\n    this.model.trash();\n \
    \ },\n  ...\n})\n```\n\nAlternately, you can simply open the JS console in your\
    \ browser and type:\n\n```\n> app.currentTeam.tasks.get('someId').trash();\n```\n\
    \nAnd you'll see that everything still happens exactly the same as if you had\
    \ clicked to delete. The task will be deleted on the server and removed from the\
    \ DOM.\n\n## Using models for everything\n\nAs the app becomes more complex, the\
    \ failure to store all state in one (and only one) place in your app will be the\
    \ source of the sorts of bugs that drive you to give up development and take up\
    \ gardening.\n\nSo, what do I mean by storing *all* the state in your app? It's\
    \ quite easy. If you find yourself checking whether something has a class or not,\
    \ and using that to determine a course of action, you're doing it wrong.\n\nThere\
    \ are two simple rules:\n\n+   1. All input, whether from the user or from an\
    \ API, *never* does anything other than call a method or update a property of\
    \ your models.\n+   2. Always use your models as the \"source of truth\" in your\
    \ app. Never “look up” state information anywhere other than your models.\n\n\
    ## Applying this approach to our widget example\n\nLet’s think about the data\
    \ first, before we think about the behavior. These items in the list represent\
    \ something. Let’s model *that* before we think about how they’ll be presented.\
    \ Let’s just make a collection of models representing the items in the list.\n\
    \n**models/widgetCollection.js**\n\n```\nvar Backbone = require('backbone');\n\
    var WidgetModel = require('./models/widget')\n\n// Our main export from this module\
    \ (just the collection)\nmodule.exports = Backbone.Collection.extend({\n  // Specify\
    \ the model type for this collection\n  model: WidgetModel,\n  // The RESTful\
    \ API URL representing this resource\n  url: '/widgets'\n});\n```\n\n**models/widget.js**\n\
    \n```\nvar AmpersandModel = require('ampersand-model');\n\nmodule.exports = AmpersandModel.extend({\n\
    \  // We give our model a type\n  type: 'widget',\n  // Define properties, these\
    \ are the ones\n  // that live on the server-side\n  props: {\n    id: ['string',\
    \ true],\n    widgetType: ['string', true, 'dooDad']\n  },\n  // Session properties\
    \ are just like props but\n  // exist for the purpose of storing client-side\n\
    \  // state.\n  session: {\n    selected: ['boolean', true, false]\n  }\n});\n\
    ```\n\nAt this point we can do something like this in our application launch code:\n\
    \n```\nvar WidgetCollection = require('models/widgets');\n\n// Assume this is\
    \ the app's entry point\nmodule.exports = {\n    blastoff: function () {\n   \
    \     // Create our one global that holds the app\n        window.app = this;\n\
    \n        // Attach our widget collection here\n        this.widgets = new WidgetCollection();\n\
    \        // Assumes you've got things set up so\n        // this will do an AJAX\
    \ (or some other type) call\n        // and populate the collection.\n       \
    \ this.widgets.fetch();\n    }\n};\n```\n\nSo now we've got a representation of\
    \ that list of widgets that assumes nothing about how it's going to be used.\n\
    \nStop for a second and think about what that does for us when requirements change\
    \ or even when we go build a second application on the same API. Nearly *all*\
    \ the model code will be re-usable with zero changes. It simply represents the\
    \ state that is available in the API, which is the same no matter what the interface\
    \ looks like.\n\nAlso, think about this in a team environment. Someone can be\
    \ working on writing models and making sure they get the proper data populated\
    \ from the API while someone is building the client-side router and page views\
    \ that include and design \"static\" versions of page elements that will be rendered\
    \ by models once the API is hooked up. Because they're all in separate files,\
    \ you won't step on each other's toes and merging the combined code in git won't\
    \ result in any major merge conflicts.\n\nJust imagine the sort of impact this\
    \ has for a team to be able to work in parallel and to write code that doesn't\
    \ need to be thrown away the minute someone wants to change the layout of the\
    \ app.\n\nIn fact, that basic model layer and API synchronization can be created"
  mdcn: "\n## 如果继续沿用这种方法，你会陷入大麻烦\n\n你能应付一定程度的功能添加。但终有一天，你会开始反对增加新功能——不是因为你认为这些功能不好，而是因为害怕实现它们时必然会带来的麻烦和缺陷。\n\
    \n欢迎来到几乎所有人的首个单页应用体验。\n\n## 模型登场\n\n如果你从未在客户端代码中使用过模型，它可能并不像听起来那么吓人。其核心思想很简单：我们在浏览器中创建一些独立于DOM的数据结构，用于存放从服务器获取的数据以及任何客户端特有的数据或状态。\n\
    \n上文描述的“选中”状态就是一个典型的客户端特有状态的例子——当我们向API更新一条记录时，并不会把 `{selected: true}` 作为其属性之一发送。服务器对此毫不在意，它仅用于追踪用户界面状态。\n\
    \n那么，模型究竟是什么？它能为我们带来什么？\n\n模型应提供的基本功能是**可观察性**。我的意思是？就像你可以在浏览器中注册一个事件监听器来响应表单输入值的变化：\n\
    \n```\ndocument.getElementById('myInput').addEventListener('change', function\
    \ () {\n  // 处理值的变化\n});\n```\n\n模型应该让我们能够监听其属性的变化：\n\n```\nmodel.on('change:selected',\
    \ function (newValue) {\n  // 处理新值\n});\n```\n\n此外，模型应包含便于我们操作数据的功能。这意味着将数据的某些处理形式作为模型的方法暴露出来。假设模型的某个属性代表日期，模型上可能会有一个方法，能基于该日期对象生成格式美观的日期字符串。可以说这是展示层的问题，但模型最终成为暴露日期属性字符串版本的逻辑位置，以实现最大化的重用和一致性。\n\
    \n同时，模型也是对自身执行操作的方法的良好载体，例如在模型更新时通知服务器。\n\n在And Bang项目中，我们大量处理任务。你可以将任务分配给他人、“发送”任务、“稍后处理”任务、“丢弃”任务等等。\n\
    \n因此，每个操作都由任务模型上的一个方法表示，该方法向服务器发送正确的数据，并更新本地模型上的相应属性。\n\n例如，以下是And Bang中任务的`trash`方法：\n\
    \n```\n... },\ntrash: function () {\n  if (this.deleteable) {\n    this.removing\
    \ = true;\n    this.api('deleteTask');\n  }\n  return this.deleteable;\n},\n...\n\
    ```\n\n它首先检查我们是否有权限丢弃此项目。如果你想知道，这实际上并不用于执行该权限，那是API的工作。\n\n事实上，这里值得稍作展开以强调API的目的。维护自身数据完整性*永远*是API的工作。你不应该*能够*在客户端代码中做任何将API数据置于奇怪或损坏状态的操作。例如，绝不应让你的客户端代码知道如果删除一个列表，也必须去删除列表中的所有项目。那是API的工作。\n\
    \n继续……调用`trash`方法会设置本地状态属性`removing`，然后调用API方法向服务器发送删除任务的命令（本例中通过WebSocket，但传输方式无关紧要）。\n\
    \n但酷的是，仅此而已。当我们想要删除一个控件时，只需找到该控件的模型并调用`.trash()`即可。\n\n在这段代码中，你看不到任何关于从DOM中移除项目的内容。\n\
    \n当我们从API收到任务已被移除的确认时，它会从集合中被移除，这会在集合上触发一个`remove`事件，而视图（代表DOM，将在下一章描述）会监听`remove`事件并将该列表项从DOM中移除。听起来可能有点复杂，但那只是因为你需要描述所有这些关系。一旦理解了，它就变得非常简洁。\n\
    \n假设我们有一个代表该模型的视图，该视图会有一个像这样的点击处理程序：\n\n```\nvar Backbone = require('backbone');\n\
    module.exports = Backbone.View.extend({\n  // 我们的事件哈希表（将在下一章解释）\n  events: {\n\
    \    'click .delete': 'handleDeleteClick'\n  },\n  // 我们的处理程序只是调用\"trash\"，仅此而已\n\
    \  handleDeleteClick: function() {\n    this.model.trash();\n  },\n  ...\n})\n\
    ```\n\n或者，你也可以直接在浏览器的JS控制台中输入：\n\n```\n> app.currentTeam.tasks.get('someId').trash();\n\
    ```\n\n你会看到所有事情仍然像你点击删除时一样发生。任务将在服务器上被删除，并从DOM中移除。\n\n## 将模型用于一切\n\n随着应用程序变得越来越复杂，未能将所有状态存储在应用程序中的一个（且唯一一个）位置，将成为那些让你放弃开发、转行园艺的bug的根源。\n\
    \n那么，我说的*在应用程序中存储所有状态*是什么意思？这很简单。如果你发现自己在检查某个元素是否有某个类名，并据此决定行动方向，那你就做错了。\n\n有两条简单的规则：\n\
    \n+   1. 所有输入，无论是来自用户还是API，*永远*只应该调用方法或更新模型的属性。\n+   2. 始终将模型作为应用程序中的“真实来源”。永远不要在模型之外的任何地方“查找”状态信息。\n\
    \n## 将此方法应用于我们的控件示例\n\n在考虑行为之前，我们先考虑数据。列表中的这些项目代表某些东西。在思考它们如何呈现之前，我们先为*那个东西*建模。我们只需创建一个代表列表项目的模型集合。\n\
    \n**models/widgetCollection.js**\n\n```\nvar Backbone = require('backbone');\n\
    var WidgetModel = require('./models/widget')\n\n// 本模块的主输出（仅为集合）\nmodule.exports\
    \ = Backbone.Collection.extend({\n  // 指定此集合的模型类型\n  model: WidgetModel,\n  //\
    \ 代表此资源的RESTful API URL\n  url: '/widgets'\n});\n```\n\n**models/widget.js**\n\
    \n```\nvar AmpersandModel = require('ampersand-model');\n\nmodule.exports = AmpersandModel.extend({\n\
    \  // 我们给模型一个类型\n  type: 'widget',\n  // 定义属性，这些是存在于服务器端的属性\n  props: {\n    id:\
    \ ['string', true],\n    widgetType: ['string', true, 'dooDad']\n  },\n  // 会话属性与props类似，但用于存储客户端状态。\n\
    \  session: {\n    selected: ['boolean', true, false]\n  }\n});\n```\n\n此时，我们可以在应用程序启动代码中执行如下操作：\n\
    \n```\nvar WidgetCollection = require('models/widgets');\n\n// 假设这是应用程序的入口点\n\
    module.exports = {\n    blastoff: function () {\n        // 创建我们持有的应用程序的全局变量\n\
    \        window.app = this;\n\n        // 在此处附加我们的控件集合\n        this.widgets =\
    \ new WidgetCollection();\n        // 假设你已经设置好了，这将执行AJAX（或其他类型）调用\n        //\
    \ 并填充集合。\n        this.widgets.fetch();\n    }\n};\n```\n\n现在，我们有了那个控件列表的表示，它不对其使用方式做任何假设。\n\
    \n停下来想一想，当需求变化，甚至当我们要在同一个API上构建第二个应用程序时，这能为我们带来什么。几乎*所有*的模型代码都将无需任何更改即可重用。它仅仅代表API中可用的状态，无论界面如何，这些状态都是相同的。\n\
    \n另外，想想在团队环境中。有人可以专注于编写模型并确保从API填充正确的数据，而其他人则构建客户端路由器和页面视图，这些视图包含并设计将在模型连接API后被渲染的页面元素的“静态”版本。因为它们都在单独的文件中，你不会互相干扰，合并git中的组合代码也不会导致任何重大的合并冲突。\n\
    \n只需想象一下，团队能够并行工作，编写的代码不需要因为有人想改变应用程序布局而被丢弃，这会产生怎样的影响。\n\n事实上，这个基本的模型层和API同步可以被创建\n"
