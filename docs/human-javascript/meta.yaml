- md: "## Binding model values to templates\n\nIn order to keep our separation of\
    \ concerns, very rarely do I set style attributes directly from JavaScript. I\
    \ believe that is a job for CSS. So much of what I do is flip classes based on\
    \ property values on the underlying model.\n\nBackbone kind of loosely encourages\
    \ you to just re-render views entirely when something changes. In a lot of cases\
    \ that’s totally fine, but I like only changing the specific thing that needs\
    \ updating when the underlying model changes. Obviously, this can be a bit more\
    \ tedious because you have to bind each thing explicitly somehow.\n\nThis is where\
    \ AmpersandView comes in handy. Much in the same way that we declare event handlers\
    \ in the `events` hash as described above, we can also declare data bindings of\
    \ various types in our views as follows:\n\n```\nvar AmpersandView = require('ampersand-view');\n\
    var templates = require('templates');\n\nmodule.exports = AmpersandView.extend({\n\
    \  template: templates.widget,\n  events: {\n    'click .delete': 'handleDeleteClick',\n\
    \    'keyup input.search': 'handleSearchKeyUp'\n  },\n  // We simply list our\
    \ bindings here\n  bindings: {\n    // This simple text binding means\n    //\
    \ we put the property value of the\n    // model in this view into the\n    //\
    \ element that matches the\n    // '.profileName' selector as text.\n    'model.name':\
    \ '.profileName',\n    // There's a few different binding types\n    // 'booleanClass'\
    \ bindings will add or remove\n    // a class with the name provided based on\n\
    \    // the truthiness of the property.\n    'model.selected': {\n      type:\
    \ 'booleanClass',\n      selector: '.container',\n      name: 'active'\n    }\n\
    \  },\n  render: function () {\n    // This we inherit from ampersand-view\n \
    \   this.renderWithTemplate();\n  },\n  handleDeleteClick: function () {\n   \
    \ this.model.delete();\n  },\n  handleSearchKeyUp: function () {\n    var inputVal\
    \ = this.$('.search').val();\n    this.collection.each(function (model) {\n  \
    \    model.matchesSearch = this.name.indexOf(inputVal) !== -1;\n    });\n  }\n\
    });\n```\n\nIn this way, you follow a similar style and pattern to Backbone to\
    \ also specify what properties (or computed properties) you want bound to what\
    \ DOM.\n\nAs an additional bonus, all handlers are registered using the `listenTo()`\
    \ method which handles unbinding those handlers when the view is destroyed.\n\n\
    The [ampersandjs.com docs site](https://ampersandjs.com/docs) has a full listing\
    \ of all the available binding types.\n\n## AmpersandView’s convenience methods\n\
    \n### .renderWithTemplate();\n\nThe general pattern, encouraged in the Backbone\
    \ documentation is to use templates to populate the contents of a view’s root\
    \ element. That way, you never have to re-register any DOM event handlers because\
    \ they’re attached to the view’s root element. With that approach (which is perfect\
    \ for some uses) you can just call `.render()` any time anything changes in the\
    \ model.\n\nIf you have a simple view that renders a single model, binding views\
    \ becomes very easy at that point. You simply do something like this:\n\n```\n\
    var Backbone = require('backbone');\nvar _ = require('underscore');\nvar templates\
    \ = require('templates');\n\nmodule.exports = Backbone.View.extend({\n  template:\
    \ templates.user,\n  events: {\n    'click .myClass': 'myHandler'\n  },\n  initialize:\
    \ function () {\n    // Register a single change handler for the model\n    this.listenTo(this.model,\
    \ 'change', _.bind(this.render, this));\n  },\n  render: function () {\n    //\
    \ We simply fill the contents of the current element with\n    // the rendered\
    \ HTML using the model's current attributes each time.\n    $(this.el).html(this.template(this.model.toJSON()));\n\
    \  },\n  myHandler: function () {\n    // Do something\n  }\n});\n```\n\nAt this\
    \ point, any change we make to that model will simply re-render the HTML for the\
    \ whole thing. Slick, simple, and easy.\n\nHowever, that’s not always what you\
    \ want, especially in realtime apps where an incoming event could come in and\
    \ change a model when you’re not ready for it. But perhaps a more compelling argument\
    \ is where you want to use CSS3 transitions and animations. If we want to add\
    \ a class that triggers a transition, simply re-drawing the whole container won’t\
    \ actually trigger it because there was never really a transition.\n\nAlso, it\
    \ doesn’t quite feel right to me to write templates that only contain the contents\
    \ of the view element:\n\n```\n<h1>My page</h1>\n<p>My content</p>\n```\n\nIt\
    \ seems more logical to write *the entire* template for that view which also includes\
    \ the root element itself:\n\n```\n<section class=\"page\">\n  <h1>My page</h1>\n\
    \  <p>My content</p>\n</section>\n```\n\nBecause now, just by looking at that\
    \ template, I can look at it and know what it is without having to know which\
    \ view is going to use it.\n\nIn addition, if I want to include some conditional\
    \ class or some other property on the root element I can do so declaratively,\
    \ right in the template along with everything else, instead of having to do it\
    \ in the render method of the view.\n\nNow, enter `renderWithTemplate(contextObject)`.\
    \ This simply encapsulates everything you need to do to render the view using\
    \ the `template` property while also replacing the entire existing root element\
    \ and making sure all the event handlers in your event hash are registered. If\
    \ your `template` is a function, it will be called with the contextObject you\
    \ called `renderWithTemplate` with.\n\nAt its most basic, a `template` can simply\
    \ be a string of HTML, but it can be also be a function that returns a string\
    \ of HTML, or a function that returns a DOM element.\n\n### .listenToAndRun();\n\
    \nVery commonly, when you want to listen to some change on a model, you're often\
    \ wanting to:\n\n1. Bind the handler so that when it's called, `this` is the view.\n\
    2. Run the bound handler once so its effect is applied to the DOM. (This avoids\
    \ having to duplicate logic in the template that's already in your handler).\n\
    \n`.listenToAndRun()` **does both of these for you.**\n\nSo instead of:\n\n```\n\
    ...\ninitialize: function () {\n  this.listenTo(this.model, 'change', _.bind(this.doSomething,\
    \ this));\n  this.doSomething();\n}\n...\n```\n\nYou can just do:\n\n```\n...\n\
    initialize: function () {\n  this.listenToAndRun(this.model, 'change', this.doSomething);\n\
    }\n...\n```\n\n### .renderCollection();\n\n`.renderCollection()` is a lightweight\
    \ way to render and maintain a collection of models within a container.\n\nIt\
    \ will listen for `add`, `remove`, `sort` events on the collection and shuffle\
    \ and re-draw views for each model as necessary.\n\nYou simply pass it the collection,\
    \ the subview you want to render each model with, and the set of options you want\
    \ to pass to the subview, and it handles the rest.\n\nExample:\n\n```\nvar AmpersandView\
    \ = require('ampersand-view');\nvar templates = require('templates');\nvar ItemView\
    \ = require('./item');\n\nmodule.exports = AmpersandView.extend({\n    template:\
    \ templates.myPage,\n```"
