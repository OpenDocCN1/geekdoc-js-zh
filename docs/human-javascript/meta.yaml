    \ {\n    // Also pretty freakin' clear!\n}\n```\n\nFrankly, I think the first\
    \ example looks better, visually. In fact, I sometimes use the first when working\
    \ on a library that isn't meant to be a team project. However, if I'm working\
    \ on an app that other people will be working on with me, I will write it the\
