    ```\n\nBy enforcing this level of property definitions we always make sure that\
    \ our models, which is the \"backbone\" of the app (wink), are readable pieces\
    \ of code that help document how the app is put together.\n\n## 5. Better handling\
    \ of lists/dates\n\nAnother argument for using getters/setters for models is that\
    \ it makes it possible to observe change to properties that are Objects. At least\
    \ when using things like arrays and dates as properties.\n\nSince arrays and dates\
    \ are Objects in JS, they're passed by reference.\n\nSo, what happens if we want\
    \ to store a list of IDs as a property of a user?\n\nIn Backbone, how would we\
    \ get a change event?\n\n```javascript\nvar model = new Backbone.Model();\n\n\
    model.set('ids', ['23', '25', '47']);\n```\n\n```javascript\n// If we want to\
    \ get them and change them\nvar myIds = model.get('ids');\n\n// If we now change\
    \ it...\nmyIds.reverse();\n\n// ...and set it back\nmodel.set('ids', myIds);\n\
    \n// we would never get a change event from Backbone\n```\n\nIf you understand\
    \ JavaScript you'll realize this isn't a flaw in Backbone, it's just because JavaScript\
    \ passes objects by reference.\n\nAs a result, when Backbone gets the \"set\"\
    \ event it just compares `this.get('ids') === newIds` which will always be true,\
    \ because you're comparing the same object not a copy of it.\n\nThe same is true\
    \ with dates. If you get a date object, call a method on it, like `setHours()`\
    \ and set it back, you'd never get a change event. So you wouldn't know you need\
    \ to update your view.\n\nWe can solve this with getters/setters in cases where\
    \ we *know* we want this behavior by forcing the model to always give us a new\
    \ object when we access the property.\n\n```javascript\nvar AmpersandModel = require('ampersand-model');\n\
    \n// Set up a simple model definition\nvar DemoModel = AmpersandModel.extend({\n\
    \  props: {\n    ids: ['array', true, []]\n  }\n});\n\n// Then we use it\nvar\
    \ model = new DemoModel();\n\n// Get our array\nvar arr = model.ids;\n\n// Modify\
    \ it back\narr.push('something');\n\n// This now triggers a change event\nmodel.ids\
    \ = arr;\n```\n\n## Summarizing models\n\nModels should contain the following:\n\
    \n1. Properties that we get from the API\n2. Properties that we need in order\
    \ to track client state (selected, etc.)\n3. Mechanisms for validating their own\
    \ data integrity\n4. Methods we can call to update or delete corresponding models\
    \ on the server\n5. Convenient accessors (a.k.a. derived properties) that describe\
    \ or process the properties in some way to allow re-use\n6. Child collections\
    \ (if applicable)\n\nModels should *never* contain:\n\n1. Anything that manipulates\
    \ the DOM\n2. Any DOM event handlers\n\nYou can read a lot more about ampersand-model\
    \ in the [Ampersand.js docs](https://docs.ampersandjs.com/).\n\n## Views\n\nIn\
    \ the interest of being terribly cliché, views are where the rubber hits the road.\
    \ It's where your model layer meets the DOM.\n\nBefore we get into the details,\
    \ let's talk a bit about why I believe views are a great pattern. The main thing\
    \ they give us is a clean way to encapsulate and store all the logic for how your\
    \ application interacts with the DOM. In fact, it's even more specific than that;\
    \ we use them to contain all the logic for a *certain element* within the DOM.\
    \ Each view is responsible for the content, event handling, and updating of a\
    \ single element and the event handlers in views translate user actions into changes\
    \ to models.\n\nAs I've already alluded to in previous chapters, separating application\
    \ models and views buys us a *lot* of flexibility. We can change the layout and\
    \ HTML structure of the whole app without having to change anything about how\
    \ the app gets, stores or updates its data from an API. So in the same way that\
    \ CSS helps us clearly separate the styling of a document from the HTML content,\
    \ views help us separate DOM creation, updates, and events from the model layer\
    \ in our app.\n\nAnother *huge* benefit of views is that they let us keep all\
    \ event handlers (click handlers, etc.) cleanly bundled with the relevant portion\
    \ of the DOM. If you've ever tried to build a single page app without views, you'll\
    \ know that managing large numbers of event handlers tends to be a big source\
    \ of bugs, memory leaks, and messy code.\n\nThere are many tools, frameworks,\
    \ and approaches to handling this layer – all with varying degrees of magic.\n\
    \nSo, continuing our theme of striving for readability and separation of concerns,\
    \ we want something simple, explicit, and declarative.\n\nBackbone views provide\
    \ some really great basic patterns for building the view layer:\n\n1. One root\
    \ element that the view controls, available as `this.el` within the view.\n2.\
    \ One primary model and/or collection, available as `this.model` and `this.collection`\
    \ respectively.\n3. A `render()` method responsible for populating and maintaining\
    \ that base element with the proper contents.\n4. An optional `initialize()` method\
    \ for any necessary setup.\n5. Shorthand way to register DOM event handlers (the\
    \ `this.events` hash).\n6. A way of disposing of the view and any listeners that\
    \ it registered.\n\nBut, they're *quite* basic so in addition, we'll extend Backbone\
    \ views to enable:\n\n1. Simple templating using our precompiled template functions\
    \ described in Chapter 8.\n2. A simple way to declare model/template bindings."
