    \ HTML for the application at all the relevant routes. By simply having the helper\
    \ provide a request handler, you can still add whatever middleware you want first\
    \ (as seen with CSRF in that example).\n\nThe need for the wildcard URL becomes\
    \ more obvious in your application"
  - '[PAGE 37]


    when you open it and navigate to a different URL within an app that uses HTML5
    push state. Say we click a button that takes us to /sample within the app. When
    navigating to that page, the browser won''t make any server requests, but you''ll
    see the URL change. However, now that you''re viewing the /sample page, if you
    refresh the browser, the browser will make a request to /sample. So if your server
    app isn''t set up to serve the same response at that URL, it won''t work.


    # A note on going to production


    Node happens to be pretty good at serving static files. So just serving the production
    file with Node/moonboots is probably sufficient for most apps with moderate traffic.
    In production mode, moonboots will build and serve the app file from memory with
    aggressive cache headers.


    However, a lot of people like to serve static files with a separate process, using
    nginx or using a CDN, etc. In that scenario, you can use moonboots during development
    and then generate the minified file, write it to disk, or put it on something
    like an S3 as part of your deploy process.


    Calling `moonboots.sourceCode(function (source) { ... })` will call your callback
    with the generated source code based on current config, which you could use to
    write it to disk or put it on a CDN as part of a grunt task or whatnot. Those
    details are probably beyond the scope of this book. But, the point is, you can
    certainly do that with these tools if that makes more sense for your app.


    # The structure of the client folder'
  - '[PAGE 38]


    Our client folder usually contains the following folders:


    +   • models (folder): Contains definitions for all models and collections. As
    a sanity check, none of these files should have anything related to DOM elements
    or DOM manipulation.

    • pages (folder): The pages folder is where we store the views that represent
    a page rendered at a specific URL. Generally these are still just “views” but
    since they play a special role to our app, it’s useful to put these in their own
    folder.

    • views (folder): The views folder contains all of our Backbone views (that are
    not pages), so things like the main application view and views for rendering specific
    types of models, etc.

    • helpers (folder): Here is where we put any clientside modules that are application
    specific, but are useful in other modules. For example, we might use this to put
    a helper module for reporting metrics back to our server that we want to do from
    several places in the app.

    • forms: (folder): A place to store any form views we might have. We often want
    to reuse a form for both creating and editing a type of data.

    • app.js (file): This is the main entry point for our application. It creates
    an `app` global variable and instantiates the main models and views.

    • router.js (file): This is our clientside (Backbone) router. It contains a list
    of URL routes at the top and corresponding handlers, whose job it is to instantiate
    the right views with the right data from the url and emit instantiated page views
    that can be rendered into the page container by our main view.

    • libraries (folder): This contains all the libraries we’re using that are *not*'
