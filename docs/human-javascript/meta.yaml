    # Code Linting


    As with readability, code conventions and format should be consistent throughout
    the project. In practice, if you have multiple people involved in a project, this
    can be hard.


    Semicolons, tabs, and spaces are contentious things among developers. Every developer
    I''ve ever met has opinions (usually strongly held) about code style.


    If you''re building large JS apps and not doing some form of static analysis on
    your code, you''re asking for trouble. It helps catch silly errors and forces
    code style consistency. Ideally, no one should be able to tell who wrote what
    part of your app. If you''re on a team, it should all be uniform within a project.
    How do you do that? We use a slick tool written by [Nathan LaFreniere](https://github.com/nicholasf)
    on our team called, simply, [precommit-hook](https://github.com/nicholasf/precommit-hook).
    So all we have to do is add "precommit-hook" to our list of dependencies (in a
    Node project).


    What it does is install a git pre-commit hook in the project that uses JSHint
    to check your project for code style consistency before each commit. Once upon
    a time there was a tool called JSLint written by Douglas Crockford. Nowadays there''s
    a less strict, more configurable version of the same project called [JSHint](http://www.jshint.com/).


    The neat thing about the npm version of JSHint is that if you run it from the
    command line it will look for a configuration file (.jshintrc) and an ignore file
    (.jshintignore), both of which the precommit hook will create for you if they
    don''t exist. You can use these files to configure JSHint to follow the code style
    rules that you''ve defined for the project. This means that you can now run `jshint
    .` at the root of your project and lint the entire thing to make sure it follows
    the code styles you''ve defined in the `.jshintrc` file. Awesome,'
- md: "## right!?!\n\nOur `.jshintrc` files usually looks something like this:\n\n\
    ```json\n{\n  \"asi\": false,\n  \"expr\": true,\n  \"loopfunc\": true,\n  \"\
    curly\": false,\n  \"evil\": true,\n  \"white\": true,\n  \"undef\": true,\n \
    \ \"indent\": 4\n}\n```\n\nThe awesome thing about this approach is that you can\
    \ enforce consistency, the rules for the project are contained, and actually get\
    \ checked into the project repo itself (in the form of the `.jshintrc` file).\
    \ So, if you decide to have a different set of rules for the next project, fine.\
    \ It's not a global setting; it's defined and adjusted by whomever runs the project.\
    \ Optionally, you can also specify your jshint config in `package.json` by adding\
    \ a `jshintConfig` property containing the same type of config as above.\n\nFor\
    \ a more in-depth discussion on style and style guides I highly recommend reading\
    \ Airbnb's [JavaScript style guide](https://github.com/airbnb/javascript). It\
    \ will give you a good overview of the various common style discrepancies and\
    \ the reasoning behind some of their choices. It's also a great starting point\
    \ if you want to fork it and tweak it to be \"the style guide\" for your team.\n\
    \n## No more clientside spaghetti. Organizing your code.\n\nThe single biggest\
    \ challenge you'll have when building complex clientside applications is keeping\
    \ your codebase from becoming a garbled pile of mess.\n\nIf it's a long-running\
    \ project that you plan on maintaining and changing over time, it's even harder.\
    \ Features come and go. You'll experiment with something, only to find it's not\
    \ the right call and leave traces of old code sprinkled throughout.\n\nI absolutely\
    \ *despise* messy code. It's hard to read, hard to maintain, hard to collaborate\
    \ on, and it's just plain ugly to look at. Beyond those pragmatic reasons, I consider\
    \ my code to be my craft. Therefore, I want the care that I put into writing it\
    \ to be obvious to those who read it.\n\nComplexity sneaks up on you. If you don't\
    \ actively fight for simplicity in software, complexity will win.\n\nHere are\
    \ a few techniques, crutches, coping mechanisms, and semi-pro tips for staying\
    \ sane.\n\n## Refactor early, refactor often\n\nEntropy is inevitable in a codebase.\
    \ If we don't continually modify, simplify and unify the existing code along with\
    \ the new code that's being written, we can easily end up with a really big, messy\
    \ app.\n\nSome developers seem hesitant to touch code they've already written.\
    \ But, I believe that deleting and updating code is a regular and important part\
    \ of building an app. When you first start building an app, you don't know how\
    \ you're going to build everything in it so there's no reason to treat any of\
    \ the code you build along the way as infallible.\n\nCode is just text, not an\
    \ edict. It can be changed easily and should be streamlined as you build.\n\n\
    Don't be scared of refactoring. Be scared of building an unmaintainable piece\
    \ of crap. I have found that to be much more costly in the long run. Additionally,\
    \ if your app is separated into clean simple modules the risk of accidentally\
    \ breaking something else is dramatically lower.\n\n## Separating views and state\n\
    \nThis is the biggest lesson I've learned building lots of single page apps. Your\
    \ view (the DOM) should just be reacting to the model state of your application.\
    \ For this you could use any number of tools and frameworks. I often recommend\
    \ reading the [Backbone documentation](https://backbonejs.org/) to developers\
    \ who are new to these concepts. It provides a clear \"just JavaScript\"™ approach\
    \ to this and serves as a fantastic primer to the problems of building clientside\
    \ apps.\n\nEssentially, you'll populate a set of models and collections of these\
    \ models in memory in the browser. These will store all the application state\
    \ for your app. These models should be completely oblivious to how they're used;\
    \ they merely store state and broadcast their changes. Then you will have views\
    \ that listen for changes in the models and update the DOM. This core principle\
    \ of separating your views and your application state is vital when building large\
    \ apps.\n\nOne aspect of this approach that is commonly overlooked is the flexibility\
    \ it provides if you decide the app should have a different UI (which *never*\
    \ happens, right?), or if you build another application on the same API. All of\
    \ the models pretty much without modification are completely reusable.\n\n## CommonJS\
    \ Modules\n\nI'm not going to get into a debate about module styles and script\
    \ loaders. But I can tell you this: I haven't seen any cleaner, simpler mechanism\
    \ for splitting your code into nice isolated chunks than CommonJS modules.\n\n\
    Let's pause for just a second to discuss what modules do for us. JavaScript has\
    \ globals. What I mean is if you don't put a `var` in front of any variable declaration,\
    \ you've just created a global variable that's accessible from *any* other code\
    \ in your app. While this *can* be used for good it also gives you a lot of rope\
    \ to hang yourself with. Without a way of managing this, as your app grows, knowing\
    \ what global variables you have at what time will become nearly impossible and\
    \ will likely be a big source of bugs.\n\nWe also want to build our app in tiny\
    \ pieces of independent code (a.k.a. modules). So, how do we make sure each module\
    \ has access to what it needs? By not referencing globals and by having each module\
    \ explicitly `require` other code that it needs. That's why we need a module system.\
    \ Very few things will have a greater positive impact on your code structure than\
    \ switching to a good module system.\n\nCommonJS is the same style/concept that\
    \ is used in Node. By following this style you get the additional benefit of being\
    \ able to reuse modules written for the client on the server and vice versa (though,\
    \ the overlap is usually not that big).\n\nIf you're unfamiliar with the CommonJS\
    \ modules style, your files end up looking something like this:\n\n```javascript\n\
    // You import things by using the special `require` function and you can\n// assign\
    \ the result to a variable\nvar AmpersandModel = require('ampersand-model');\n\
    var _ = require('underscore');\n\n// You expose functionality to other modules\
    \ by declaring your main export\n// like this.\nmodule.exports = AmpersandModel.extend({\n\
    \    type: 'navItem',\n    props: {\n        active: ['boolean', true, false],\n\
    \        url: ['string', true, ''],\n        position: ['number', true, 200]\n\
    \    },\n    init: function () {\n        // Do something\n    }\n});\n```\n\n\
    That's it! Super easy. You don't create any globals. Each file that uses your\
    \ module can name it whatever makes the most sense for use in that module.\n\n\
    You just export a constructor (like above), or a single function, or even a set\
    \ of functions. Generally, however, I'd encourage you to export only one thing\
    \ from each module.\n\nOf course, browsers don't have support for these kinds\
    \ of modules out of the box (there is no `window.require`). But, luckily that\
    \ can be fixed. We use a clever little tool called [browserify](https://browserify.org/)\
    \ that lets you `require` whatever modules you need. This also includes being\
    \ able to declare dependencies in a `package.json` file and just installing `require()`-able\
    \ modules from npm into your project. With this approach, no clientside specific\
    \ package management like Bower is required. You simply declare your dependencies\
    \ in your package file and install them.\n\nBrowserify will create a `require`\
    \ system and starting with the module you specify as an entry point it will include\
    \ each `require`-ed piece of code into an app package that can be sent to the\
    \ browser.\n\nBrowserify is written for Node but even if you're using something\
    \ else to build your web app, you can use Node and browserify to build your client\
    \ package. Ultimately, you're just creating a single JS file. So once it's generated,\
    \ that file can be served just like any other static file by any file server you\
    \ want.\n\n## Grab your moonboots\n\nIf you're used to building apps where each\
    \ script in your app directory has a corresponding `<script>` tag hardcoded in\
    \ some HTML file somewhere it can be a bit confusing when switching to using a\
    \ script module system like browserify.\n\nAs I touched on in Chapter 2, we really\
    \ would like our production environment to serve a single, minified, `.js` file\
    \ with a unique file name so that we can tell browsers to cache it forever. However,\
    \ that's far from ideal in a development environment because we don't want to\
    \ debug minified"
  mdcn: "\n## 是不是吧？！\n\n我们的 `.jshintrc` 文件通常看起来像这样：\n\n```json\n{\n  \"asi\": false,\n\
    \  \"expr\": true,\n  \"loopfunc\": true,\n  \"curly\": false,\n  \"evil\": true,\n\
    \  \"white\": true,\n  \"undef\": true,\n  \"indent\": 4\n}\n```\n\n这种方法的妙处在于，它能强制执行一致性，项目规则被包含其中，并且实际上会被提交到项目仓库本身（以\
    \ `.jshintrc` 文件的形式）。所以，如果你决定在下一个项目中采用不同的规则集，没问题。这不是一个全局设置；它由运行项目的人定义和调整。你也可以选择在\
    \ `package.json` 中通过添加一个 `jshintConfig` 属性来指定你的 jshint 配置，其包含与上述相同类型的配置。\n\n关于样式和样式指南的更深入讨论，我强烈推荐阅读\
    \ Airbnb 的 [JavaScript 风格指南](https://github.com/airbnb/javascript)。它将让你很好地了解各种常见的风格差异以及他们做出某些选择背后的原因。如果你想\
    \ fork 它并调整为“你们团队的风格指南”，它也是一个绝佳的起点。\n\n## 告别客户端意大利面条式代码。整理你的代码。\n\n在构建复杂的客户端应用程序时，你将面临的最大挑战是防止你的代码库变成一堆混乱不堪的垃圾。\n\
    \n如果这是一个你计划长期维护和修改的长期项目，那就更难了。功能会来来去去。你会尝试一些东西，结果发现那不是正确的选择，然后在代码各处留下旧代码的痕迹。\n\
    \n我绝对*厌恶*混乱的代码。它难以阅读、难以维护、难以协作，而且看起来就是丑陋不堪。除了这些实际原因，我认为我的代码是我的手工艺品。因此，我希望我在编写代码时投入的用心能被阅读代码的人明显地感受到。\n\
    \n复杂性会悄悄向你逼近。如果你不在软件中积极争取简单性，复杂性就会获胜。\n\n这里有一些技巧、拐杖、应对机制和半专业的提示，帮助你保持理智。\n\n##\
    \ 早重构，勤重构\n\n熵在代码库中是不可避免的。如果我们不持续地修改、简化和统一现有代码以及正在编写的新代码，我们很容易最终得到一个非常庞大、混乱的应用程序。\n\
    \n一些开发者似乎不愿意修改他们已经写过的代码。但是，我相信删除和更新代码是构建应用程序的一个常规且重要的部分。当你刚开始构建应用程序时，你不知道你将如何构建其中的所有东西，所以没有理由把你沿途构建的任何代码视为绝对正确。\n\
    \n代码只是文本，不是法令。它可以很容易地被更改，并且应该在你构建过程中被精简。\n\n不要害怕重构。要害怕构建一个无法维护的垃圾。我发现从长远来看，那成本要高得多。此外，如果你的应用程序被分割成干净、简单的模块，意外破坏其他东西的风险会显著降低。\n\
    \n## 分离视图和状态\n\n这是我构建了许多单页应用程序后学到的最重要一课。你的视图（DOM）应该只是对应用程序的模型状态做出反应。为此，你可以使用任何数量的工具和框架。我经常向接触这些概念的新手开发者推荐阅读\
    \ [Backbone 文档](https://backbonejs.org/)。它为这个问题提供了一种清晰的“纯 JavaScript”™ 方法，并作为构建客户端应用程序问题的一个绝佳入门。\n\
    \n本质上，你将在浏览器内存中填充一组模型和模型的集合。这些将存储你的应用程序的所有状态。这些模型应该完全不关心它们如何被使用；它们只是存储状态并广播其变化。然后你会有视图监听模型的变化并更新\
    \ DOM。在构建大型应用程序时，分离视图和应用程序状态这一核心原则至关重要。\n\n这种方法常被忽视的一个方面是，如果你决定应用程序应该有一个不同的 UI（这种情况*从来*不会发生，对吧？），或者如果你在同一个\
    \ API 上构建另一个应用程序，它提供了灵活性。所有的模型基本上无需修改就可以完全重用。\n\n## CommonJS 模块\n\n我不会陷入关于模块风格和脚本加载器的争论。但我可以告诉你：我没有见过比\
    \ CommonJS 模块更干净、更简单的将代码分割成独立模块的机制了。\n\n让我们暂停一下，讨论一下模块为我们做了什么。JavaScript 有全局变量。我的意思是，如果你在变量声明前不加上\
    \ `var`，你就创建了一个全局变量，它可以从你应用程序中的*任何*其他代码访问。虽然这*可以*被用于好的目的，但它也给了你很多自缚手脚的绳索。如果没有方法来管理这个，随着你的应用程序增长，知道你在什么时间有什么全局变量将变得几乎不可能，并且可能成为\
    \ bug 的一个主要来源。\n\n我们也希望将我们的应用程序构建为独立的微小代码块（又名模块）。那么，我们如何确保每个模块都能访问它需要的东西呢？通过不引用全局变量，并让每个模块显式地\
    \ `require` 它需要的其他代码。这就是为什么我们需要一个模块系统。很少有什么比切换到一个好的模块系统对你的代码结构产生更大的积极影响了。\n\n\
    CommonJS 是 Node 中使用的相同风格/概念。遵循这种风格，你可以额外受益于能够在服务器上重用为客户端编写的模块，反之亦然（尽管，重叠通常没那么大）。\n\
    \n如果你不熟悉 CommonJS 模块风格，你的文件最终看起来会像这样：\n\n```javascript\n// 你使用特殊的 `require` 函数来导入东西，并且你可以\n\
    // 将结果赋值给一个变量\nvar AmpersandModel = require('ampersand-model');\nvar _ = require('underscore');\n\
    \n// 你通过像这样声明你的主要导出来向其他模块公开功能。\nmodule.exports = AmpersandModel.extend({\n   \
    \ type: 'navItem',\n    props: {\n        active: ['boolean', true, false],\n\
    \        url: ['string', true, ''],\n        position: ['number', true, 200]\n\
    \    },\n    init: function () {\n        // 做些事情\n    }\n});\n```\n\n就是这样！超级简单。你不会创建任何全局变量。每个使用你模块的文件都可以给它起一个在该模块中最合适的名字。\n\
    \n你只需导出一个构造函数（如上），或一个单独的函数，甚至一组函数。不过，通常我建议你每个模块只导出一个东西。\n\n当然，浏览器本身不支持这些类型的模块（没有\
    \ `window.require`）。但是，幸运的是，这可以被修复。我们使用一个名为 [browserify](https://browserify.org/)\
    \ 的巧妙小工具，它可以让你 `require` 你需要的任何模块。这还包括能够在 `package.json` 文件中声明依赖项，并且只需从 npm 安装可\
    \ `require` 的模块到你的项目中。通过这种方法，不需要像 Bower 这样的客户端特定的包管理。你只需在你的包文件中声明你的依赖项并安装它们。\n\
    \nBrowserify 将创建一个 `require` 系统，并从你指定为入口点的模块开始，将每个 `require` 的代码片段包含到一个可以发送到浏览器的应用程序包中。\n\
    \nBrowserify 是为 Node 编写的，但即使你使用其他东西来构建你的 Web 应用程序，你也可以使用 Node 和 browserify 来构建你的客户端包。最终，你只是创建了一个\
    \ JS 文件。所以一旦它生成，该文件就可以像任何其他静态文件一样，由你想要的任何文件服务器提供。\n\n## 穿上你的月球靴\n\n如果你习惯于构建这样的应用程序：应用目录中的每个脚本都在某个\
    \ HTML 文件中有一个对应的硬编码的 `<script>` 标签，那么当你切换到使用像 browserify 这样的脚本模块系统时，可能会感到有些困惑。\n\
    \n正如我在第 2 章中提到的，我们真的希望我们的生产环境能够提供一个单一的、经过压缩的、具有唯一文件名的 `.js` 文件，这样我们就可以告诉浏览器永远缓存它。然而，在开发环境中，这远非理想，因为我们不想调试压缩过的\n"
