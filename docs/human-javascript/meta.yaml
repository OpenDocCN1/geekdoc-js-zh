  mdcn: "\n在浏览器中调试代码或每次更改都必须重新构建。因此，为了让开发周期保持愉快，我们的目标是：\n\n1.  无需重启服务器或手动重新编译，即可轻松编辑/刷新客户端JavaScript文件。\n\
    2.  能够轻松将浏览器中的代码映射到应用文件夹中未编译版本的正确文件和行号。\n3.  在开发环境中提供未压缩的代码。\n4.  在生产环境中，提供一个压缩过的、具有唯一名称、可永久缓存的文件，其中包含整个应用。\n\
    5.  能够通过一个简单的配置标志在两种状态之间切换。\n6.  能够为所有兼容模块使用browserify，但仍然能够将其他库捆绑到我们的应用文件中。\n\
    7.  能够以同样的方式提供/压缩/缓存CSS。\n\n由于定义这种类型的浏览器应用“包”是一个常见问题，并且我们希望所有应用都能受益，因此我构建了一个辅助工具来使其更容易使用。\n\
    \n它被称为“moonboots”。要使用它，你可以这样定义你的浏览器应用（假设使用Node和Express）：\n\n```javascript\nvar\
    \ Moonboots = require('moonboots');\n\nvar clientapp = new Moonboots({\n  // The\
    \ directory where all the client code is stored\n  main: __dirname + '/clientapp/main.js',\n\
    \n  // Whether or not to build and serve cached/minified version of\n  // the\
    \ application file.\n  // While you're in development mode you don't need to restart\
    \ the\n  // server or do anything other than edit clientside code in your project.\n\
    \  developmentMode: true,\n\n  // These are the regular JavaScript files (not\
    \ written in CommonJS style)\n  // that we want to include in our application.\
    \ These all live in client/libraries\n  // and will be concatenated in the order\
    \ listed.\n  libraries: [\n    __dirname + '/libs/jquery-1.9.1.js',\n    __dirname\
    \ + '/libs/jquery.plugin.js'\n  ],\n\n  // These are our stylesheets. They will\
    \ be concatenated and run through\n  // cssmin to minify them.\n  stylesheets:\
    \ [\n    __dirname + '/public/css/styles.css'\n  ],\n\n  // We pass in the Express\
    \ app here so that it can handle serving files during development\n  server: app\n\
    });\n```\n\n此时，我们可以告诉Express我们希望它提供我们应用程序的路由。如果你不习惯做客户端路由的单页应用程序，这可能有点难以理解。\n\n\
    由于我们发送的是JavaScript应用程序，而不是渲染好的HTML给浏览器，因此需要客户端读取URL、获取相应数据并渲染该URL所代表的页面。因此，我们需要配置我们的服务器，使其在属于我们客户端应用程序的任何URL上始终返回相同的HTML。我们将在第9章更详细地介绍客户端路由的概念。\n\
    \n你可以通过使用通配符处理程序，或者通过传递正则表达式而不是字符串作为路由定义，在Express中实现这一点。如果你查看[示例应用程序](sample application)，你会看到`server.js`中的相关行如下所示：\n\
    \n```javascript\napp.get('*', csrf, clientapp.html());\n```\n\n其中`clientapp`是我们上面定义的应用程序。在其上调用`html()`将返回一个请求处理程序，该处理程序在所有相关路由上提供应用程序的基础HTML。通过让辅助工具提供请求处理程序，你仍然可以添加任何你想要的中间件（如示例中的CSRF）。\n\
    \n当你打开一个使用HTML5 push state的应用程序并在其中导航到不同的URL时，通配符URL的必要性变得更加明显。假设我们点击一个按钮，将我们带到应用程序内的/sample。导航到该页面时，浏览器不会发出任何服务器请求，但你会看到URL发生变化。但是，现在你正在查看/sample页面，如果你刷新浏览器，浏览器将向/sample发出请求。因此，如果你的服务器应用程序没有设置为在该URL上提供相同的响应，它将无法工作。\n\
    \n## 关于投入生产环境的说明\n\nNode恰好非常擅长提供静态文件。因此，仅使用Node/moonboots提供生产文件可能对大多数流量适中的应用程序就足够了。在生产模式下，moonboots将使用激进的缓存头从内存中构建并提供应用程序文件。\n\
    \n然而，许多人喜欢使用单独的进程（如nginx或CDN等）来提供静态文件。在这种情况下，你可以在开发过程中使用moonboots，然后生成压缩文件，将其写入磁盘，或在部署过程中将其放到S3之类的存储上。\n\
    \n调用`moonboots.sourceCode(function (source) { ... })`会将基于当前配置生成的源代码作为参数传递给你的回调函数，你可以使用它将其写入磁盘或在grunt任务中将其放到CDN上。这些细节可能超出了本书的范围。但是，关键是，如果这更符合你的应用需求，你当然可以使用这些工具来实现。\n\
    \n## 客户端文件夹的结构\n\n我们的客户端文件夹通常包含以下文件夹：\n\n-   **models (文件夹)：** 包含所有模型和集合的定义。作为一个健全的检查，这些文件中不应有任何与DOM元素或DOM操作相关的内容。\n\
    -   **pages (文件夹)：** 页面文件夹是我们存储代表在特定URL渲染的页面的视图的地方。通常这些仍然是“视图”，但由于它们在应用程序中扮演着特殊的角色，将它们放在自己的文件夹中是有用的。\n\
    -   **views (文件夹)：** 视图文件夹包含我们所有的Backbone视图（非页面视图），例如主应用程序视图和用于渲染特定类型模型的视图等。\n\
    -   **helpers (文件夹)：** 这里是我们放置任何特定于应用程序但在其他模块中有用的客户端模块的地方。例如，我们可能使用它来放置一个辅助模块，用于从应用程序的多个地方向服务器报告指标。\n\
    -   **forms (文件夹)：** 存放我们可能有的任何表单视图的地方。我们经常希望为创建和编辑一种类型的数据重用同一个表单。\n-   **app.js\
    \ (文件)：** 这是我们应用程序的主入口点。它创建一个`app`全局变量并实例化主模型和视图。\n-   **router.js (文件)：** 这是我们的客户端（Backbone）路由器。它在顶部包含一个URL路由列表和相应的处理程序，其工作是从URL中使用正确的数据实例化正确的视图，并发出可以被我们的主视图渲染到页面容器中的已实例化的页面视图。\n\
    -   **libraries (文件夹)：** 这里包含我们使用的所有*不是*像CommonJS模块那样组织的库。因此，像jQuery和jQuery插件这样的东西会放在这里。\n\
    -   **templates.js (文件)：** 这是从templates文件夹创建的模块（见下文）。它是一个单一的文件，每个客户端模板对应一个函数。这个文件是自动生成的，所以不要试图直接编辑它。将其放在这里也让我们可以在视图中轻松地要求和使用我们的模板函数。每个模板都有一个对应的模板函数。每个函数接受你的上下文对象并只返回一个HTML字符串。\n\
    -   **templates (文件夹)：** 这里是我们存放所有用于客户端应用程序的Jade文件的地方。任何时候你想在应用程序中创建HTML，都可以使用Jade模板并将其放在这里。你可以根据应用程序的需要以任何合理的方式组织这个文件夹。重要的是要理解文件夹会成为template.js模块结构的一部分。例如，在这个模板中，你会看到templates文件夹中有一个pages文件夹，里面有一个名为home.jade的文件。要使用从该文件创建的函数，你可以这样访问：\n\
    \n```javascript\nvar templates = require('./templates');\n\n// Note that 'pages'\
    \ becomes part of the structure of your\n// imported templates object\nvar html\
    \ = templates.pages.home();\n```\n\n有关模板的更深入讨论，请参见第8章。\n\n## 创建应用全局变量\n\n那么什么构成一个模块？理想情况下，我建议每个模块都放在\n"
