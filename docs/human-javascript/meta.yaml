    \n可能变得有点复杂的情况是，当你实际需要的是一些逻辑时。比如说，你想根据模型上的一个布尔属性，从一个类列表中添加或移除一个项；或者说你想添加或移除整个属性，比如\
    \ `checked`。为了让模板语言知道这是我们想要的，它必须有一种新的语法来指示绑定应该如何行为。\n\n在我看来，这就是许多这类语言走得太远的地方。它们试图在模板中声明太多逻辑。就个人而言，在标记语言中编写代码感觉不太对。\n\
    \n重要的是要认识到，模板语言方法和声明式绑定 *实际上是在做同样的事情*。它们只是一种构建函数集合的方式，能够将“嘿，模型上的这个值变了”这样的事件，转换成实际的、更新\
    \ DOM 的 DOM 方法，例如：`someElement.setAttribute('href', '/my-url')`。\n\n如果你想使用一种也能为你处理绑定的模板语言，我强烈推荐：Phil\
    \ Roberts 的 domthing。它是 mustache 的一个变体，允许你使用如下所示的模板自动绑定：\n\n```\n<div class=\"\
    entry\">\n  <h1>{{title}}</h1>\n  <div class=\"body\">\n    {{body}}\n  </div>\n\
    </div>\n```\n\n但它也会自动为这些属性创建到最终 DOM 的绑定。\n\n## 关于可重用性的说明\n\n就个人而言，我希望确保我可能想在另一个项目中重用的任何东西都不依赖于特定的模板语言。\n\
    \n所以，对于任何不特定于我正在构建的应用程序的东西，我建议只使用 HTML 字符串和声明式绑定，以最大化可重用性。\n\n## 别再把模板引擎发往浏览器了！这是一个事后看来显而易见的、能快\
    \ 6 到 10 倍的创建模板的方法。\n\n如今，越来越多的 HTML 是在客户端渲染的，而不是由服务器预渲染后发送的。所以，如果你正在构建一个大量使用客户端\
    \ JavaScript 的 Web 应用程序，你无疑会想在浏览器中创建一些 HTML。\n\n## 我们过去的做法\n\n首先，回顾一下历史。当我第一次写\
    \ ICanHaz 时，我只是想减轻在浏览器中生成大量 HTML 的痛苦。\n\n为什么这很痛苦？主要是因为 JavaScript 并不干净地支持多行字符串，也因为\
    \ JS 中没有内置强大的字符串插值系统。\n\n为了解决这个问题，ICanHaz 和许多其他客户端模板系统一样，使用了一个 hack 来更容易地向浏览器发送任意字符串。事实证明，如果你给\
    \ `<script>` 标签一个不是 `text/javascript` 的 `type` 属性，浏览器会忽略其中的内容。因此，ICanHaz 会读取页面上标记为\
    \ `<script type=\"text/html\">` 的标签内容，这些标签可以包含模板或任何其他多行字符串。然后，ICanHaz 会读取这些模板，并使用\
    \ Jan Lehnardt 出色的 mustache.js 将每个模板转换成一个函数，你可以调用该函数并传入你的数据来渲染字符串。例如：\n\n这段 HTML：\n\
    \n```\n<script id=\"user\" type=\"text/html\">\n  <li>\n    <p class=\"name\"\
    >Hello my name is: {{ name }}</p>\n    <p><a href=\"http://twitter.com/{{ twitter\
    \ }}\">@{{ twitter }}</a></p>\n  </li>\n</script>\n```\n\n被 ICanHaz 读取并转换成一个函数，你可以像这样用自己的数据调用它：\n\
    \n```\n// 你的数据\nvar data = {\n  first_name: \"Henrik\",\n  last_name: \"Joreteg\"\
    \n}\n\n// 我可以 has 一个用户？？\nhtml = ich.user(data)\n```\n\n这效果相当好，比手动构建 HTML 字符串干净得多。显然，很多人也是这么想的，因为它是一个相当流行的库。\n\
    \n## 为什么这并不理想\n\n它完全有效，但仔细想想，这有点傻。我们让客户端做了一堆额外的解析和编译工作，而这些工作实际上我们可以提前完成。当然，在浏览器中进行解析和编译\
    \ *也* 意味着我们必须向浏览器发送一个完整的、能够解析和编译模板的模板引擎。\n\n### 下一个迭代\n\n我最终意识到，在客户端进行模板化时，你真正想要的其实就是\
    \ ICanHaz 提供的最终结果：一个你调用并传入数据就能返回 HTML 的函数。\n\n通常，智能模板引擎，比如新版本的 mustache.js，会为你做这件事。一旦模板被读取，它就会被编译成一个函数，该函数会被缓存并用于后续渲染同一模板。\n\
    \n想到这里，我开始疑惑，为什么我们不直接将 JavaScript 模板函数发送给客户端，而不是在客户端进行所有的模板解析/编译呢？\n\n嗯，坦白说，因为我不知道有什么好方法可以做到这一点。\n\
    \n我开始四处寻找，并意识到 [Jade](https://jade-lang.com/)（我们在 &yet 已经用得很多了）支持作为单独的进程进行编译，结合一个小的运行时代码片段，这使你可以创建只需要一个小型运行时而不需要整个模板引擎就能渲染的\
    \ JS 函数。这真是太棒了！\n\n因此，为了更容易使用，我写了一个小工具：[templatizer](https://github.com/colinwren/templatizer)，你可以在服务器端运行它（使用\
    \ Node），它接受一个包含 Jade 模板的文件夹，并将它们转换成一个 JavaScript 模块，你可以将该模块包含在你的应用程序中，其中包含每个模板文件对应的一个函数。每个模板函数只需接受一个上下对象，并返回一个插入了这些值的字符串。\n\
    \n## 结果\n\n根据我的测试，实际渲染模板的速度 **快了 6 到 10 倍**。此外，你向浏览器发送的代码 *少得多*（因为你没有发送整个模板引擎），而且你没有让浏览器去做一堆你本可以提前完成的工作。\n\
    \n## 我们能更快吗？\n\n可能。一旦你身处浏览器环境中，使用 DOM 方法构建 DOM 元素，比发送必须与值进行插值然后被浏览器解析以创建 DOM 元素的\
    \ HTML 字符串要快。\n\n如今，我们看到越来越多的模板语言编译成 DOM 方法，以获得额外的性能提升。\n\n权衡之处在于，你无法在服务器端（那里没有\
    \ DOM）使用那些同样的编译好的模板，除非你模拟（shim）一大堆 DOM 方法。\n\n此外，正如我在上一章所讨论的，你通常不仅仅想创建 DOM，还想更新它。所以还有整个数据绑定的方面，这可能在模板层就能处理。\n\
    \n同样，如果你对这种方法感兴趣，请查看 [domthing](https://github.com/philroberts/domthing) 或 [htmlbars](https://github.com/tildeio/htmlbars)。\n"
