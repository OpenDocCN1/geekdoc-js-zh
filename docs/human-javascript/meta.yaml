    \ this view into the\n    // element that matches the\n    // '.profileName' selector\
    \ as text.\n    'model.name': '.profileName',\n    // There's a few different\
    \ binding types\n    // 'booleanClass' bindings will add or remove\n    // a class\
    \ with the name provided based on\n    // the truthiness of the property.\n  \
    \  'model.selected': {\n      type: 'booleanClass',\n      selector: '.container',\n\
    \      name: 'active'\n    }\n  },\n  render: function () {\n    // This we inherit\
