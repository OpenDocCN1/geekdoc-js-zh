  md: 'document.getElementById(''pages'')?


    The reason is we can''t assume that the view is attached to the main DOM tree
    when this method is called. If you haven''t yet attached it, the other selector
    queries wouldn''t be able to find the right elements because they''re not in the
    main document tree yet. In fact, often a parent view will call `render()` on a
    subview as part of its own render method, and then attach the result to the DOM.
    This is entirely intentional because it''s much faster for the browser to create
    the DOM elements outside of the main DOM tree, only attaching and painting them
    once.


    So, to deal with this problem, Backbone Views create a method named `$` for each
    view. This method is functionally equivalent to a normal jQuery selector such
    as `$(''.item'')`. *But*, it only looks for matches within the view''s element.
    Not only is it faster (because there''s less DOM to traverse) but more importantly,
    it finds the elements that match your selector within the view''s element *even
    if it''s not yet been attached to the DOM*. Ampersand-View''s `.get()` method
    works similarly in that it just searches *within the view''s root element* to
    retrieve matching items.


    If that was all a bit too complex, just know that you should generally use `this.$(''.yourSelector'')`
    or `this.get` **instead** of `$(''.yourSelector'')` when trying to grab elements
    within a view.


