  md: '# # A few closing thoughts


    # ## 1. We''re not done


    This book will continue to evolve along with the corresponding tools and techniques.
    We plan to continue publishing updates to keep the contents current. That''s one
    of the great things about ebooks. We''ve even built a continuous integration system
    for the book. Any time we push an update to the master branch for the book repository,
    our CI server generates new ebooks.


    # ## 2. Staying up to date


    Follow @HenrikJoreteg and @andyet on twitter to hear about updates and changes.
    We''ll be turning the site into a jumping off point for finding related tools
    and resources.'
