    \ ItemView, this.get('.myItemList'));\n}\n});\n\nFor more on AmpersandView, or\
    \ to contribute and make it better, see the documentation and source on [GitHub](https://github.com/AmpersandJS/ampersand-view).\n\
    \n## A bit about defining bindings in templates (à la AngularJS, Ractive)\n\n\
    There are several libraries out there that let you specify in your templates which\
    \ pieces of information go where in your DOM and then they automatically create\
    \ the event bindings for you.\n\nBasically, you'd have a template like this:\n\
    \n```\n<div>\n  <p>Hello {{ name }}</p>\n</div>\n```\n\nThen you mash that together\
    \ with your model and then they're automatically bound. As a paraphrased pseudo-code-y\
    \ example:\n\n```\nvar template = require('compiled-template-from-somewhere');\n\
    var model = require('./models/some-model');\n\ndocument.body.appendChild(template(model));\n\
    \n// Then if you changed the model\nmodel.set('name', 'Sue');\n\n// the DOM would\
    \ be automatically be updated to:\n/*\n<div>\n  <p>Hello Sue</p>\n</div>\n*/\n\
    ```\n\nIt’s really a matter of preference and luckily it’s easy enough to switch\
    \ it out for whatever method you prefer.\n\nFor simple, put-this-text-here bindings,\
    \ it’s all pretty straightforward.\n\nWhere things can potentially get a bit messy\
    \ is if what you actually want is a bit of logic. Say you want to add/remove an\
    \ item from a list of classes based on a boolean property on a model, or say you\
    \ want to add/remove an entire attribute, like `checked`. In order for the template\
    \ language to know that’s what we want, it has to have some type of new syntax\
    \ to indicate how the binding should behave.\n\nIn my opinion, this is where many\
    \ of these languages go too far. They simply try to do too much declared logic\
    \ in a template. Personally, it doesn’t feel right to be writing code within markup.\n\
    \nThe important thing to recognize is that both the template language approach\
    \ and the declarative bindings are *really doing the same thing*. They’re just\
    \ a way of building a set of functions that can turn “Hey, this value changed\
    \ on a model” into the actual DOM method that will update the DOM, for example:\
    \ `someElement.setAttribute('href', '/my-url')`.\n\nIf you’re wanting to use a\
    \ templating language that can also do the bindings for you, I’d strongly recommend:\
    \ Phil Robert’s domthing. It’s a variant of mustache that lets you automatically\
    \ bind using templates that look like this:\n\n```\n<div class=\"entry\">\n  <h1>{{title}}</h1>\n\
    \  <div class=\"body\">\n    {{body}}\n  </div>\n</div>\n```\n\nBut it will also\
    \ automatically create bindings for those properties to the resulting DOM.\n\n\
    ## A note about re-usability\n\nPersonally, I want to make sure that anything\
    \ I may want to re-use in another project doesn't depend on a certain templating\
    \ language.\n\nSo, for anything that isn't specific to the app I'm building, I'd\
    \ suggest just using HTML strings and declared bindings to maximize re-usability.\n\
    \n## Stop sending template engines to the browser! Here’s a retrospectively obvious\
    \ way to create templates that happen to be 6 to 10 times faster.\n\nThese days,\
    \ more and more HTML is rendered on the client instead of sent pre-rendered by\
    \ the server. So if you’re building a web app that uses a lot of clientside JavaScript\
    \ you’ll doubtlessly want to create some HTML in the browser.\n\n## How we used\
    \ to do it\n\nFirst, a bit of history. When I first wrote ICanHaz I was just trying\
    \ to ease the pain of generating a bunch of HTML in a browser.\n\nWhy is it a\
    \ pain? Primarily because JavaScript doesn’t cleanly support multi-line strings,\
    \ but also because there isn’t an awesome string interpolation system built into\
    \ JS.\n\nTo work around that, ICanHaz, as lots of other template clientside template\
    \ systems do, uses a hack to make it easier to send arbitrary strings to the browser.\
    \ As it turns out, browsers ignore content in `<script>` tags if you give them\
    \ a type attribute that isn’t text/javascript. So, ICanHaz reads the content of\
    \ tags on the page that say: `<script type=\"text/html\">` which can contain templates,\
    \ or any other multi-line strings for that matter. So, ICanHaz will read those\
    \ templates and using Jan Lehnardt’s awesome mustache.js it turns each of them\
    \ into a function that you can call to render that string with your data mixed\
    \ into it. For example:\n\nThis HTML:\n\n```\n<script id=\"user\" type=\"text/html\"\
    >\n  <li>\n    <p class=\"name\">Hello my name is: {{ name }}</p>\n    <p><a href=\"\
    http://twitter.com/{{ twitter }}\">@{{ twitter }}</a></p>\n  </li>\n</script>\n\
    ```\n\nIs read by ICanHaz and turned into a function you call with your own like\
    \ this:\n\n```\n// Your data\nvar data = {\n  first_name: \"Henrik\",\n  last_name:\
    \ \"Joreteg\"\n}\n\n// I can has user??\nhtml = ich.user(data)\n```\n\nThis works\
    \ pretty well and is much cleaner than building HTML strings manually. Clearly,\
    \ lots of people thought the same as it has been quite a popular library.\n\n\
    ## Why that’s less-than-ideal\n\nIt totally works, but if you think about it,\
    \ it’s a bit silly. We’re making the client do a bunch of extra parsing and compiling\
    \ that we could actually just do ahead of time. Of course, doing the parsing and\
    \ compiling in the browser *also* means that we’re having to send the browser\
    \ a whole template engine that can parse and compile templates.\n\n### The next\
    \ iteration\n\nWhat I finally realized is that all you actually want when doing\
    \ templating on the client is the end result that ICanHaz gives you: a function\
    \ that you call with your data that returns your HTML.\n\nTypically, smart template\
    \ engines, like the newer versions of mustache.js, do this for you. Once the template\
    \ has been read, it gets compiled into a function that is cached and used for\
    \ subsequent rendering of that same template.\n\nThinking about this left me wondering,\
    \ why don’t we just send the JavaScript template function to the client instead\
    \ of doing all the template parsing/compiling on the client?\n\nWell, frankly,\
    \ because I didn’t know of a great way to do it.\n\nI started looking around and\
    \ realized that [Jade](https://jade-lang.com/) (which we already use quite a bit\
    \ at &yet) has support for compiling as a separate process and, in combination\
    \ with a small little runtime snippet, this lets you create JS functions that\
    \ only require a small runtime and not the whole template engine to render. Which\
    \ is totally awesome!\n\nSo, to make it easier to work with, I wrote a little\
    \ tool: [templatizer](https://github.com/colinwren/templatizer) that you can run\
    \ on the server-side (using Node) to take a folder full of Jade templates and\
    \ turn them into a JavaScript module that you can include in your app and contains\
    \ a function for each template file. Each template function simply takes a context\
    \ object and returns a string with those values inserted.\n\n## The result\n\n\
    From my tests the actual rendering of templates is **6 to 10 times faster**. In\
    \ addition you're sending *way* less code to the browser (because you're not sending\
    \ a whole templating engine) and you're not making the browser do a bunch of work\
    \ you could have already done ahead of time.\n\n## Can we get even faster?\n\n\
    Possibly. Once you're in a browser it's faster to build DOM elements with DOM\
    \ methods than by sending HTML strings that have to be interpolated with values\
    \ and then parsed by the browser to create DOM elements.\n\nThese days we're seeing\
    \ more template languages that compile to DOM methods instead to get that extra\
    \ performance boost.\n\nThe trade-off is not being able to use those same compiled\
    \ templates on the server-side (where there is no DOM) without shimming a bunch\
    \ of DOM methods.\n\nIn addition, as I discussed in the last chapter, you often\
    \ want to do more than simply create the DOM to begin with, you also want to update\
    \ it. So there’s the whole data-binding aspect that could potentially be handled\
    \ at the template layer.\n\nAgain, if you’re interested in this approach, check\
    \ out [domthing](https://github.com/philroberts/domthing) or [htmlbars](https://github.com/tildeio/htmlbars)."
