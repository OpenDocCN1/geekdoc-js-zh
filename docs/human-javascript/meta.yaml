    \  t.deepEqual(person._changed, {});\n    t.notOk(person.changedAttributes());\n\
    \    t.end();\n});\n```\n\nThe “tape” module is capable of running in the browser\
    \ or the server with browserify.\n\nSo, with the help of a few handy dev dependencies,\
    \ we can run our tests in phantom.js, or in a browser.\n\nFirst, run the following\
    \ to install a few dependencies we’ll need:\n\n```\nnpm i --save-dev run-browser\
    \ browserify tape-run\n```\n\nThis will install them and save them as `devDependencies`\
    \ in your package.json.\n\nNext, we can add some scripts to our package.json like\
    \ this:\n\n```\n\"scripts\": {\n  \"start\": \"run-browser test/index.js\",\n\
    \  \"test\": \"browserify test/index.js | tape-run\"\n},\n```\n\nWith this setup\
    \ we can run `npm start` and open `localhost:3000` in whatever browser we want\
    \ to run the tests in.\n\nWe can also just run `npm test` and it will run it with\
    \ phantom.js (which you may have to go install separately if you don't already\
    \ have it) and you should see the same type of output in your terminal.\n\nThis\
    \ output format is a standard test output format called [TAP](https://testanything.org/).\n\
    \nAs a result, there are various tools to dress up that output. So, if you want\
    \ prettier terminal output, you can also install `tap-spec` from npm and update\
    \ your “test” script to look like this:\n\n```\n\"test\": \"browserify test/index.js\
    \ | tape-run | tap-spec\"\n```\n\nBy using tape and writing tests in this way,\
    \ we can also use a service like [testling](https://ci.testling.com/) that runs\
    \ our tests in different browsers for us.\n\nTestling can be configured to automatically\
    \ run our test suite using the list of browsers that we specify each time we push\
    \ to github. This approach is extremely helpful when developing small modules\
    \ for use in a browser. See the [testling quick start guide](https://ci.testling.com/guide/tutorial)\
    \ for more info on how to set this up for your project.\n\nFor a full working\
    \ example of these tools being used, see [ampersand-view](https://github.com/AmpersandJS/ampersand-view)\
    \ or almost any of the [ampersand.js tools](https://github.com/AmpersandJS).\n\
    \n## App settings and configuration\n\n## The problem\n\nApp configuration and\
    \ environment settings are always a PITA, right? Especially when you've got configuration\
    \ settings you want to pass to your single page app. If we've structured everything\
    \ as building a “static” js file that gets sent, then how do we pass dynamic values\
    \ into it for things like configuration?\n\nWe solve this problem with a simple\
    \ approach and two specific tools:\n\n- getconfig\n- clientconfig\n\nThey're in\
    \ no way dependent on each other but they do play nicely together. (Both are on\
    \ npm, by the way).\n\n## getconfig\n\nFirst, getconfig. This is a tool for configuring\
    \ Node web apps. It follows the same assumptions as [Express](https://expressjs.com/)\
    \ does, in that it looks to an environment variable (NODE_ENV, [reference](https://en.wikipedia.org/wiki/Environment_variable))\
    \ to determine the mode in which it should run.\n\nIt simply uses that to look\
    \ for a JSON config file that matches the name of the environment. For example:\
    \ dev_config.json or production_config.json. It defaults to dev if it doesn't\
    \ find one.\n\nThen, from your Node app you just require “getconfig” and access\
    \ settings directly on the resulting object, which will have pulled it from the\
    \ correct config file. Super clean/simple:\n\n```\n// We just require the module\n\
    var config = require('getconfig');\n\n// Which actually returns our environment-aware\
    \ config\n// from the corresponding config file.\nconfig.mySetting;\n```\n\nIt\
    \ just pulls the right config from the right file, no “if” statements, no mess.\n\
    \n## clientconfig\n\nOn the clientside we do something very similar.\n\n```\n\
    var config = require('clientconfig');\n\nconfig.mySetting;\n```\n\nThis time,\
    \ instead of looking for an environment variable, the module looks for a cookie\
    \ called “config” that contains a JSON encoded config object. It immediately reads,\
    \ then destroys that cookie (to avoid the overhead of sending it around on any\
    \ subsequent requests).\n\nClientconfig reads and returns a “frozen” config object\
    \ (using ES5 Object.freeze, if available) with our settings. So, it’s basically\
    \ the equivalent developer experience as getconfig, but for the client.\n\n##\
    \ Using them together\n\nIn combination, it gets pretty slick:\n\nSay we have\
    \ a dev_config.json that looks like this, on our server.\n\n```json\n{\n  \"myProjectSetting\"\
    : \"someSetting\",\n  \"clientAppSettings\": {\n    \"apiUrl\": \"https://api.andbang.com\"\
    ,\n    \"trackMetrics\": false\n  }\n}\n```\n\n*note the “clientAppSettings” section.*\n\
    \nNow, in our main server file where we handle the requests for single page apps,\
    \ we then add on our config cookie with the data from getconfig using a very simple\
    \ piece of middleware.\n\n```javascript\n// Set up our app and require getconfig\n\
    var app = require('express')(),\n    config = require('getconfig');\n\n// Build\
    \ a tiny middleware function that sets the cookie\nvar configMiddleware = function\
    \ (req, res, next) {\n  res.setCookie('config', JSON.stringify(config.clientAppSettings));\n\
    \  next();\n};\n```"
  mdcn: "\n并引导你完成为此定义的QA流程。你可以自动化高级测试，例如填写和提交表单等。但是，除此之外，在你指定的时间点，它会停下来，要求用户进行视觉验证或执行某些用户操作，比如拖放交互或与滚动相关的功能——这些功能可能很难通过编程进行测试。因此，部分单元测试的通过与否是基于用户对“它工作了吗？”这个问题的回答。\n\
    \n这种方法使得定义一组明确的应用交互来测试成为可能。所以，这就像一个半自动化的QA检查清单。\n\n在其他浏览器中进行测试，只需在那些浏览器中运行测试序列即可。使用像Browserling或BrowserStack这样的服务，我们可以在我们针对的任何浏览器中完成这个过程。\n\
    \nSpaceMonkey仍处于积极开发阶段，但由humanjs应用生成器生成的应用中包含了一个`clienttests`文件夹和示例QA工作流。\n\n\
    你最终编写的测试看起来会像这样：\n\n```\n// 将应用加载到我们的iframe中\nmonkey.loadApp('/', {\n    height:\
    \ 500,\n    width: 600,\n    bugUrl: 'https://github.com/henrikjoreteg/humanjs-sample-app/issues/new'\n\
    });\n\n// 这是一个普通的QUnit测试\ntest('basic app experience', function () {\n    // 这里我们开始一系列交互\n\
    \    monkey\n        // 我们可以向控制台输出消息\n        .log('starting')\n        // 等待元素出现\n\
    \        .waitForVisible('#pages .page')\n        // 请求用户确认\n        .confirm('The\
    \ app loaded to the home page.')\n        .confirm('The \"home\" nav tab is active')\n\
    \        // 导航到不同的URL\n        .goToPage('/collections')\n        .confirm('Collection\
    \ demo page visible')\n        .confirm('List of people are visible each with\
    \ avatars')\n        // 我们也可以提供一组关于即将发生的事情的说明。\n        // 并指示用户寻找特定的行为。\n   \
    \     .instruct('Five users will be added. Please ensure.', [\n            'each\
    \ one is added at the bottom of the list',\n            'each has a readable name\
    \ and an avatar'\n        ])\n        // 模拟点击\n        .click('button.add')\n\
    \        .click('button.add')\n        .click('button.add')\n        .click('button.add')\n\
    \        .click('button.add')\n        .confirm('Everything look ok?')\n     \
    \   .confirm('I can visually re-arrange them by pressing, \"shuffle\"')\n    \
    \    .confirm('I can hit reset and they disappear, and fetch and they come back.')\n\
    \        .confirm('I can delete them by clicking \"delete\"')\n        .goToPage('/info')\n\
    \        .confirm('Info page is visible')\n        // 完成时调用\n        .destroy();\n\
    });\n```\n\n要查看其实际运行效果：\n\n1.  使用npm安装应用生成器：`npm i humanjs -g`\n2.  运行生成器并回答其问题：`humanjs`\n\
    3.  运行生成的应用并在浏览器中访问 `http://localhost:3000/test`\n\n如前所述，我们仍有很多工作要做，以将SpaceMonkey打造成一个结构良好的独立库。但它似乎足够有用和实用，因此我们将其包含了进来。\n\
    \n至少，这个总体思路可能足以吸引你去构建它 :)\n\n## 浏览器中需要的单元测试模块\n\n对于那些不是QA而是实际单元测试的测试，你需要一种方法来编写将在浏览器中运行的测试，理想情况下，我们希望能够在命令行中运行它们。\n\
    \n事实证明，我们可以。使用一套主要由[James Halliday](https://github.com/substack)（又名“substack”）开发的工具。\n\
    \n这里是来自ampersand-state的一个示例：\n\n```\nvar test = require('tape');\nvar State =\
    \ require('../ampersand-state');\n\nvar Person = State.extend({\n    props: {\n\
    \        name: 'string'\n    }\n});\n\ntest('init with values', function (t) {\n\
    \    var person = new Person({name: 'henrik'});\n    t.ok(person);\n    t.equal(person.name,\
    \ 'henrik');\n    t.end();\n});\n\ntest('after init, change should be empty until\
    \ a set op', function (t) {\n    var person = new Person({name: 'phil'});\n  \
    \  t.deepEqual(person._changed, {});\n    t.notOk(person.changedAttributes());\n\
    \    t.end();\n});\n```\n\n“tape”模块可以在浏览器或服务器上通过browserify运行。\n\n所以，在一些便捷的开发依赖项的帮助下，我们可以在phantom.js或浏览器中运行我们的测试。\n\
    \n首先，运行以下命令安装我们需要的一些依赖项：\n\n```\nnpm i --save-dev run-browser browserify tape-run\n\
    ```\n\n这将安装它们并将它们作为`devDependencies`保存在你的package.json中。\n\n接下来，我们可以在package.json中添加一些脚本，像这样：\n\
    \n```\n\"scripts\": {\n  \"start\": \"run-browser test/index.js\",\n  \"test\"\
    : \"browserify test/index.js | tape-run\"\n},\n```\n\n有了这个设置，我们可以运行`npm start`，并在我们想要运行测试的任何浏览器中打开`localhost:3000`。\n\
    \n我们也可以直接运行`npm test`，它将使用phantom.js运行（如果你还没有安装，可能需要单独安装），你应该会在终端中看到相同类型的输出。\n\
    \n这种输出格式是一种名为[TAP](https://testanything.org/)的标准测试输出格式。\n\n因此，有各种工具可以美化该输出。所以，如果你想要更漂亮的终端输出，你也可以从npm安装`tap-spec`，并将你的“test”脚本更新为如下所示：\n\
    \n```\n\"test\": \"browserify test/index.js | tape-run | tap-spec\"\n```\n\n通过使用tape并以这种方式编写测试，我们还可以使用像[testling](https://ci.testling.com/)这样的服务，它可以在不同的浏览器中为我们运行测试。\n\
    \nTestling可以被配置为在我们每次推送到github时，使用我们指定的浏览器列表自动运行我们的测试套件。这种方法在开发用于浏览器的小模块时非常有用。有关如何为你的项目设置此功能的更多信息，请参阅[testling快速入门指南](https://ci.testling.com/guide/tutorial)。\n\
    \n要查看这些工具使用的完整工作示例，请参阅[ampersand-view](https://github.com/AmpersandJS/ampersand-view)或几乎任何[ampersand.js工具](https://github.com/AmpersandJS)。\n\
    \n## 应用设置与配置\n\n## 问题\n\n应用配置和环境设置总是很棘手，对吧？尤其是当你有配置设置要传递给你的单页应用时。如果我们已将所有内容构建为发送“静态”js文件，那么我们如何将动态值传递给它以用于配置等目的？\n\
    \n我们用一个简单的方法和两个特定的工具来解决这个问题：\n\n- getconfig\n- clientconfig\n\n它们之间没有任何依赖关系，但它们确实可以很好地协同工作。（顺便说一句，两者都在npm上）。\n\
    \n## getconfig\n\n首先，getconfig。这是一个用于配置Node web应用的工具。它遵循与[Express](https://expressjs.com/)相同的假设，即它查找一个环境变量（NODE_ENV，[参考](https://en.wikipedia.org/wiki/Environment_variable)）来确定其应运行的模式。\n\
    \n它只是使用该变量来查找与环境名称匹配的JSON配置文件。例如：dev_config.json或production_config.json。如果找不到，它默认为dev。\n\
    \n然后，从你的Node应用中，你只需引入“getconfig”并直接在返回的对象上访问设置，它会从正确的配置文件中提取设置。超级简洁/简单：\n\n```\n\
    // 我们只需引入模块\nvar config = require('getconfig');\n\n// 它实际上返回我们环境感知的配置\n// 来自相应的配置文件。\n\
    config.mySetting;\n```\n\n它只是从正确的文件中提取正确的配置，没有“if”语句，没有混乱。\n\n## clientconfig\n\
    \n在客户端，我们做非常类似的事情。\n\n```\nvar config = require('clientconfig');\n\nconfig.mySetting;\n\
    ```\n\n这一次，该模块不是查找环境变量，而是查找一个名为“config”的cookie，其中包含一个JSON编码的配置对象。它立即读取，然后销毁该cookie（以避免在后续任何请求中发送它的开销）。\n\
    \nClientconfig读取并返回一个“冻结的”配置对象（如果可用，使用ES5 Object.freeze），其中包含我们的设置。因此，它基本上与getconfig具有等效的开发者体验，但适用于客户端。\n\
    \n## 结合使用它们\n\n结合起来，它变得非常简洁：\n\n假设我们在服务器上有这样一个dev_config.json：\n\n```json\n{\n\
    \  \"myProjectSetting\": \"someSetting\",\n  \"clientAppSettings\": {\n    \"\
    apiUrl\": \"https://api.andbang.com\",\n    \"trackMetrics\": false\n  }\n}\n\
    ```\n*注意“clientAppSettings”部分。*\n\n现在，在我们处理单页应用请求的主服务器文件中，我们然后使用一个非常简单的中间件，将配置cookie与来自getconfig的数据一起添加。\n\
    \n```javascript\n// 设置我们的应用并引入getconfig\nvar app = require('express')(),\n   \
    \ config = require('getconfig');\n\n// 构建一个设置cookie的小型中间件函数\nvar configMiddleware\
    \ = function (req, res, next) {\n  res.setCookie('config', JSON.stringify(config.clientAppSettings));\n\
    \  next();\n};\n```\n"
