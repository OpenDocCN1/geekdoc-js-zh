  md: '# Using events: Modules talking to modules


    How do you keep your modules cleanly separated? Sometimes modules are dependent
    on other modules but we still want to be able to keep them loosely coupled? One
    good technique is triggering lots of events that can be used as hooks by other
    code. Many of the core components in Node are extensions of the EventEmitter class.
    This means you can register handlers that get called when events happen to that
    object, much like you would do in the browser when you want to register a click
    handler for an element on the page.


    I find that developers often assume that events are kind of magical or special
    things in JavaScript, but they''re not. In fact, building an event emitter from
    scratch is a really great learning exercise. They''re really quite simple. You''re
    just saying: “Please call this function when this thing happens.” Typically, you''ll
    see code like this:


    In browsers:


    ```

    document.getElementById(''something'').addEventListener(''click'', function ()
    { ... }, false);

    ```'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'In jQuery it looks like this:


    ```

    $(''#something'').click(function (event) { ... });

    // or

    $(''#something'').on(''click'', function (event) { ... });

    ```


    In EventEmitter it looks like this:


    ```

    myEventEmitter.on(''someEvent'', function () { ... });

    ```


    But they all do the same thing: they store a reference to the function you handed
    it (usually by adding it to an array of functions internally). Then, when the
    event happens, they call all the functions in the relevant array with information
    about the event. That’s it! No magic.


    This pattern is really useful when building reusable components yourself. Exporting
    objects and classes that inherit from some type of event emitter means that the
    code using your module can specify what they care about, rather than the module
    having to know.


    At points of interest within your module where you think some external source
    may care, you can just call `this.emit(''someEventName'', {some: ''data''})` and
    if there are any handlers for that event, they''ll be called.


    There are lots of implementations of event emitters with various features. Features
    usually involve various ways of registering and unregistering event listeners.
    For example, you may want to register a handler that only gets called the first
    time an event happens. So for this many event handlers have a `once()` method
    alongside the `on()` method. In addition, some event handlers give you a way to
    listen to all events emitted by a certain object, or perhaps all events in a certain
    namespace. These features can be useful for logging out all events (so you can
    debug), or for proxying events from one event source to another object.'
