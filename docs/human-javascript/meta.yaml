    \ who may not be familiar with the syntax in the first example.\n\n# Cleverness\
    \ is a double edged sword\n\nBeing clever is sometimes a good thing. But as was\
    \ so aptly put by Paddy Foran cleverness for the sake of cleverness should be\
    \ avoided at all costs.\n\nThe goal should always be clarity and readability."
