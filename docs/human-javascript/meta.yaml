  - '[PAGE 53]


    before we even have a final app design.


    # Model alternatives


    In order to provide observability, models generally provide some sort of event
    registration system and a way to set and get some “protected” attributes.


    For a long time, I used Backbone models for everything. The code for them is quite
    simple and readable (YES!); they’re also flexible and easy to use. Also, I’m generally
    a big fan of Backbone’s principles and structure.


    Yet, you’ll notice the examples all use `AmpersandModel` instead of `Backbone.Model`.


    Despite our love for Backbone at &yet, a few things finally drove us to create
    [Ampersand.js](http://Ampersand.js).


    Backbone is brilliantly simple and solves many common problems in developing clientside
    applications. But we missed the focused simplicity of tiny modules in node-land.


    We wanted something similar in style and philosophy, but that fully embraced tiny
    modules, npm, and browserify. For more info on those tools check out the [Ampersand.js
    site](http://Ampersand.js site).


    The specific things we wanted from models are:


    +   1. Readability


    If the models are the core of our application (as they should be), someone should
    be able to open the code for the model and *read* what properties it'
  - '[PAGE 54]


    stores and what types those properties have. This is *huge* for enabling people
    to jump in and contribute to a project.


    # 2. Derived properties


    So often, the data you get from the server is not in the format you’ll want to
    present it. The classic example is first and last name. Most likely they come
    as separate fields from the API, but in reality, most places you’re going to present
    a user’s name in the app will be in the format: `firstName + '' '' + lastName`.
    In Backbone you’d perhaps create a method called `fullName()` that when called,
    returned that value to you. The annoying thing comes when you want to bind that
    value to some location in the DOM. You have to listen for changes to either `firstName`
    or `lastName` and then call the method again and put the result into the DOM.
    There are two things I don’t like about this:


    +   1. It *feels* like `fullName` or even just `name` should just be accessible
    in the same way as first or last name. Why can’t I just go `user.name`?


    2. I want to be able to listen for changes in one place. So, instead of `model.on(''change:firstName
    change:lastName'', doSomething)` it seems like I should be able to just listen
    for changes to `change:name` and have the model be smart enough to know that if
    either first or last name changes, call that handler too.


    # 3. Direct access to properties


    In a large app, you work with models **a lot**. Having to call `get` and `set`
    everywhere is a bit less than ideal, IMO. ECMAScript 5 (a.k.a. the version of
    the JS spec available in modern browsers) allows for `getters` and `setters` which
    means you can actually process simple assignments. This is better illustrated
    with an example:'
  - "[PAGE 55]\n\n```\n// Without getters/setters (Backbone Model)\nmodel.set('firstName',\
    \ 'Henrik');\n\n// With getters/setters (AmpersandModel)\nmodel.firstName = 'Henrik';\n\
    ```\n\nWhat do I mean? You can already set whatever properties you want directly\
    \ on an object even without getter/setters, right?!\n\nYES! But not in a way that\
    \ can be observed.\n\nGetters and setters allow us to trigger those `change` events\
    \ even when properties are set directly:\n\n```\nmodel.on('change:firstName',\
    \ **function** () {\n  console.log('firstName changed!');\n});\n\n// Even when\
    \ setting the attribute directly the callback\n// registered above would still\
    \ be called.\nmodel.firstName = 'Henrik';\n```\n\nGetters and setters give us\
    \ enormous flexibility, which can be bad. For example, we can make a getter run\
    \ whatever code we want and return anything whenever we access a property.\n\n\
    ```\ntrickyModel.firstName = 'Henrik';\n\nconsole.log(trickyModel.firstName);\n\
    // We can make this log out *whatever* the heck we want\n// despite it appearing\
    \ to just have been assigned above.\n```\n\nQuick note on how to use getters/setters\n\
    \nBe sure to read the warning below, but for those not familiar, it may be useful\
    \ to have a bit of an explanation of how getters and setters are written. There\
    \ are two syntax options."
  - "[PAGE 56]\n\nThe first is using the `get` and `set` operators directly to define\
    \ those methods:\n\n```\nvar myObject: {\n  _properties: {},\n  get name () {\n\
    \    return this._properties.name;\n  },\n  set name (value) {\n    this._properties.name\
    \ = value;\n  }\n}\n```\n\nThe second is using `Object.defineProperty()`:\n\n\
    ```\nvar myObject = {\n  _properties: {}\n};\n\nObject.defineProperty(myObject,\
    \ \"name\", {\n  get: function () {\n    return this._properties.name;\n  },\n\
    \  set: function (value) {\n    this._properties.name = value;\n  }\n});\n\n//\
    \ There's also a defineProperties (plural)\nObject.defineProperties(myObject,\
    \ {\n  lastName: {\n    get: function () { ... },\n    set: function () { ...\
    \ }\n  },\n  fullName: {\n    get: function () { ... },\n    set: function ()\
    \ { ... }\n  }\n})\n```\n\n> Warning!\n\nAs you can imagine this power gives you\
    \ a *lot* of rope to hang yourself with and thus, this capability should be used\
    \ *very* cautiously.\n\nSome argue, and I can see their point, that using this\
    \ is too much magic. If that's how you feel. Luckily, in our happy modular world,\
    \ you can just use plain Backbone models."
  - "[PAGE 57]\n\nHowever, I happen to think that in the case of models getters/settings\
    \ can actually make our code more fault tolerant and more readable. But, I *only*\
    \ use them for model properties and only in predictable ways.\n\n# 4. Type enforcement\n\
    \nJavaScript, the language is dynamically typed, which is awesome. But we've said\
    \ we're making our models the *core* of the app. Knowing that a given property\
    \ is a given type is quite useful for eliminating silly bugs and protecting ourselves.\n\
    \nLet's compare the two with a simple user model. In Backbone there is no standard\
    \ way to define a property. Instead, you simply set a value as if it exists and\
    \ now it does.\n\n```\n// Backbone model, no definition needed.\n// There *is*\
    \ no standard way to even\n// define the properties it should store.\nvar model\
    \ = new Backbone.Model();\n\nmodel.set({\n  firstName: 'Henrik',\n  lastName:\
    \ 'Joreteg'\n});\n\n// Now I can get those\nmodel.get('firstName'); // logs out\
    \ 'Henrik'\n```\n\nSimple, elegant, flexible. But, assuming I set these values\
    \ in some view code somewhere in another part of a large app, how do I know what\
    \ attributes I have available to me or what they're called?\n\nIf I'm hitting\
    \ an API to get my data and using the resulting data to set attributes on models,\
    \ I have two options for figuring out what data I'm storing and what data I have\
    \ available to my views. I either inspect the request to know what properties\
    \ I'm supposed to have or inspect it in the console at runtime to see what properties\
    \ my model contains and what"
