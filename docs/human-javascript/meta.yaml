  - '[PAGE 62]


    # Summarizing models


    Models should contain the following:


    +   1. Properties that we get from the API

    2. Properties that we need in order to track client state (selected, etc.)

    3. Mechanisms for validating their own data integrity

    4. Methods we can call to update or delete corresponding models on the server

    5. Convenient accessors (a.k.a. derived properties) that describe or process the
    properties in some way to allow re-use

    6. Child collections (if applicable)


    Models should *never* contain:


    +   1. Anything that manipulates the DOM

    2. Any DOM event handlers


    You can read a lot more about ampersand-model in the [Ampersand.js docs](https://docs.ampersandjs.com/).'
  - '[PAGE 63]


    # # Views


    In the interest of being terribly cliché, views are where the rubber hits the
    road. It’s where your model layer meets the DOM.


    Before we get into the details, let’s talk a bit about why I believe views are
    a great pattern. The main thing they give us is a clean way to encapsulate and
    store all the logic for how your application interacts with the DOM. In fact,
    it’s even more specific than that; we use them to contain all the logic for a
    *certain element* within the DOM. Each view is responsible for the content, event
    handling, and updating of a single element and the event handlers in views translate
    user actions into changes to models.


    As I’ve already alluded to in previous chapters, separating application models
    and views buys us a *lot* of flexibility. We can change the layout and HTML structure
    of the whole app without having to change anything about how the app gets, stores
    or updates its data from an API. So in the same way that CSS helps us clearly
    separate the styling of a document from the HTML content, views help us separate
    DOM creation, updates, and events from the model layer in our app.'
  - '[PAGE 64]


    Another *huge* benefit of views is that they let us keep all event handlers (click
    handlers, etc.) cleanly bundled with the relevant portion of the DOM. If you’ve
    ever tried to build a single page app without views, you’ll know that managing
    large numbers of event handlers tends to be a big source of bugs, memory leaks,
    and messy code.


    There are many tools, frameworks, and approaches to handling this layer – all
    with varying degrees of magic.


    So, continuing our theme of striving for readability and separation of concerns,
    we want something simple, explicit, and declarative.


    Backbone views provide some really great basic patterns for building the view
    layer:


    +   1. One root element that the view controls, available as `this.el` within
    the view.

    2. One primary model and/or collection, available as `this.model` and `this.collection`
    respectively.

    3. A `render()` method responsible for populating and maintaining that base element
    with the proper contents.

    4. An optional `initialize()` method for any necessary setup.

    5. Shorthand way to register DOM event handlers (the `this.events` hash).

    6. A way of disposing of the view and any listeners that it registered.


    But, they’re *quite* basic so in addition, we’ll extend Backbone views to enable:


    +   1. Simple templating using our precompiled template functions described in
    Chapter 8.

    2. A simple way to declare model/template bindings.'
- md: "## Introducing AmpersandView\n\nAs I mentioned, Backbone views are very limited\
    \ in scope — quite intentionally so. The following explanation is pulled straight\
    \ from the Backbone docs:\n\n> Backbone views are almost more convention than\
    \ they are code — they don't determine anything about your HTML or CSS for you,\
    \ and can be used with any JavaScript templating library. The general idea is\
    \ to organize your interface into logical views, backed by models, each of which\
    \ can be updated independently when the model changes, without having to redraw\
    \ the page.\n\nBackbone's general approach is to provide some simple components\
    \ and patterns, and it's up to you to apply them as you wish. This non-prescriptive\
    \ flexibility is a big reason why Backbone has become as popular as it has.\n\n\
    However, as you start to build more and more apps, you find yourself solving similar\
    \ problems over and over. In pure Backbone projects, we found ourselves always\
    \ creating a `BaseView` that contained a lot of the common helpers and patterns\
    \ we wanted in all our views, and we used that to build all our views in the app.\
    \ One day, I found myself copying and pasting one of the `BaseView`s from one\
    \ project to another, and just decided to put it on npm instead.\n\nThat's how\
    \ AmpersandView was born. It's like a Backbone view but it gives us a few additional\
    \ goodies.\n\nSpecifically, it gives us the following:\n\n- 1. Declarative data\
    \ bindings.\n- 2. A `.renderWithTemplate()` method that does several things we\
    \ want to do on every render.\n- 3. A `.listenToAndRun()` convenience method for\
    \ binding view methods to model events, while maintaining the view as the context\
    \ and triggering them right away.\n- 4. A `.renderCollection()` method for rendering\
    \ a view for each item in a collection within a given container element in the\
    \ view.\n\nWe’ll take a look at each of those shortly. But first, let’s figure\
    \ out how we’re going to structure our views within the app.\n\n## A Hierarchy\
    \ of Views\n\nAs you start to build an application with views, you’ll find it\
    \ makes sense to segment things into subviews. Which raises the question, how\
    \ do you determine what portions of the app layout to split into subviews?\n\n\
    I generally start with a single main view, that I put in `views/main.js`. The\
    \ main view has the `<body>` as its root element. It’s only rendered once and\
    \ creates the main layout of the app, often rendering several subviews. It also\
    \ becomes the logical place to register “global” event handlers for things like\
    \ keyboard shortcuts or app-wide click handlers.\n\nThe layout will vary from\
    \ one app to the next, but there are typically some ever-present elements that\
    \ are part of the layout (navigation, etc.) and often I will have some type of\
    \ main content container that swaps out based on the URL. I typically give that\
    \ an `id` of `pages` and then render a `PageView` into that container based on\
    \ the URL using a little helper module called `ampersand-view-switcher`.\n\nThe\
    \ view switcher is just a way to handle swapping out views. By default, it just\
    \ renders and appends the view you give it to the container and removes any existing\
    \ one that may be there currently. But we can also provide custom ways to transition\
    \ those. We may, for example, want the page to be able to set the `<title>` on\
    \ the page.\n\nHere's an example of how a main view might look if we're using\
    \ AmpersandView:\n\n```javascript\nvar AmpersandView = require('ampersand-view');\n\
    var ViewSwitcher = require('ampersand-view-switcher');\nvar templates = require('./templates');\n\
    \nmodule.exports = AmpersandView.extend({\n    // Our template function that returns\
    \ an HTML string\n    // this can also just be a string. Template language\n \
    \   // is irrelevant. It just needs to be a function that\n    // takes an argument\
    \ and returns a string.\n    template: templates.main,\n\n    render: function\
    \ () {\n        // Inherited from AmpersandView, it renders the main template\n\
    \        // and inserts it into the root element.\n        this.renderWithTemplate();\n\
    \        // set up our page switcher for that element\n        this.pageSwitcher\
    \ = new ViewSwitcher(this.get('#pages'), {\n            // here we provide a few\
    \ things we'd like to do each time\n            // we switch pages in the app.\n\
    \            show: function (newView, oldView) {\n                // set our document\
    \ title\n                document.title = newView.pageTitle || 'my awesome app';\n\
    \                // scroll to the top\n                document.body.scrollTop\
    \ = 0;\n                // perhaps store a reference to our current page on our\n\
    \                // app global for easy access from the browser console.\n   \
    \             app.currentPage = view;\n            }\n        });\n    }\n});\n\
    ```\n\nYou will have to make a judgement call on the best way to segment things\
    \ into manageable, logical containers for your application. Generally, a good\
    \ rule of thumb is to try to encapsulate views by the models you'll use to control\
    \ them.\n\nFor example, let’s assume you’ve got a certain URL that represents\
    \ a page that should show a list of items. In this case, you have a page view\
    \ that is rendered inside the main view's page container. That `PageView` would\
    \ render any headings for that page, as well as a basic list container (a `<ul>`\
    \ perhaps) for your list of items.\n\nThat page would take the collection you\
    \ plan to render into that container as its `collection` property, then we could\
    \ use the `renderCollection` method to manage adding/removing individual views\
    \ (one for each model).\n\nIf there isn’t a lot of behavior associated with each\
    \ line item, you may choose to handle the rendering of individual items in the\
    \ view containing the collection. You’ll simply have to make a determination based\
    \ on how much behavior is associated with each item in the list. If it’s fairly\
    \ behavior-less or log-like (say a chat room, for example), you might want to\
    \ render them into the container and be done. If it’s more interactive, like a\
    \ tour scheduling app where you’re dragging items around, editing them, and there’s\
    \ lots of associated data with each one, then you’ll probably want a view to contain\
    \ the behavior of each item.\n\nTake a look at the associated demo app to see\
    \ examples of each approach to handling collections.\n\nYou can find the app on\
    \ my [GitHub account](https://github.com).\n\n## Caveat: understanding `this.$`\
    \ and `this.get`\n\nInside the example above, in the `render` method, you’ll notice\
    \ that we pass: `this.get('#pages')`. In Backbone you’d do `this.$('#pages')[0]`\
    \ as the `el` argument for the subview. You may wonder, why not just pass `$('#pages')`\
    \ or even just `document.getElementById('pages')`?\n\nThe reason is we can't assume\
    \ that the view is attached to the main DOM tree when this method is called. If\
    \ you haven't yet attached it, the other selector queries wouldn't be able to\
    \ find the right elements because they're not in the main document tree yet. In\
    \ fact, often a parent view will call `render()` on a subview as part of its own\
    \ render method, and then attach the result to the DOM. This is entirely intentional\
    \ because it's much faster for the browser to create the DOM elements outside\
    \ of the main DOM tree, only attaching and painting them once.\n\nSo, to deal\
    \ with this problem, Backbone Views create a method named `$` for each view. This\
    \ method is functionally equivalent to a normal jQuery selector such as `$('.item')`.\
    \ *But*, it only looks for matches within the view's element. Not only is it faster\
    \ (because there's less DOM to traverse) but more importantly, it finds the elements\
    \ that match your selector within the view's element *even if it's not yet been\
    \ attached to the DOM*. Ampersand-View's `.get()` method works similarly in that\
    \ it just searches *within the view's root element* to retrieve matching items.\n\
    \nIf that was all a bit too complex, just know that you should generally use `this.$('.yourSelector')`\
    \ or `this.get` **instead** of `$('.yourSelector')` when trying to grab elements\
    \ within a view.\n\n## Registering DOM event handlers\n\nIn wiring up a view to\
    \ the DOM, you'll often want to respond to interactions from the user.\n\nBecause\
    \ registering a handler to a particular method in your view and"
  mdcn: "\n## 介绍 AmpersandView\n\n正如我之前提到的，Backbone 视图的作用范围非常有限——这是有意为之。以下解释直接引自 Backbone\
    \ 文档：\n\n> Backbone 视图几乎更多是一种约定，而非代码——它们不会为你决定 HTML 或 CSS 的任何内容，并且可以与任何 JavaScript\
    \ 模板库一起使用。其核心思想是将你的界面组织成逻辑视图，由模型支撑，每个视图都可以在模型发生变化时独立更新，而无需重绘页面。\n\nBackbone 的总体方法是提供一些简单的组件和模式，由你根据需要进行应用。这种非指令性的灵活性是\
    \ Backbone 如此流行的重要原因之一。\n\n然而，随着你开始构建越来越多的应用程序，你会发现自已在反复解决类似的问题。在纯 Backbone 项目中，我们发现自己总是在创建一个\
    \ `BaseView`，其中包含许多我们希望所有视图都具有的通用辅助函数和模式，我们用它来构建应用中的所有视图。有一天，我发现自己在将一个 `BaseView`\
    \ 从一个项目复制粘贴到另一个项目，于是决定将其发布到 npm 上。\n\n这就是 AmpersandView 的诞生过程。它就像一个 Backbone 视图，但为我们提供了一些额外的便利。\n\
    \n具体来说，它提供了以下功能：\n\n- 1. 声明式数据绑定。\n- 2. 一个 `.renderWithTemplate()` 方法，它在每次渲染时会执行我们想要做的几件事。\n\
    - 3. 一个 `.listenToAndRun()` 便捷方法，用于将视图方法绑定到模型事件，同时保持视图作为上下文并立即触发它们。\n- 4. 一个 `.renderCollection()`\
    \ 方法，用于在视图中的指定容器元素内为集合中的每个项目渲染一个视图。\n\n我们将逐一探讨这些功能。但首先，让我们弄清楚如何在应用中组织我们的视图。\n\n\
    ## 视图层次结构\n\n当你开始使用视图构建应用程序时，你会发现将内容分割为子视图是合理的。这就引出了一个问题：你如何确定将应用布局的哪些部分拆分为子视图？\n\
    \n我通常从一个主视图开始，将其放在 `views/main.js` 中。主视图以 `<body>` 作为其根元素。它只渲染一次，并创建应用的主布局，通常会渲染多个子视图。它也成为注册“全局”事件处理程序（如键盘快捷键或应用范围的点击处理程序）的逻辑位置。\n\
    \n布局会因应用而异，但通常有一些始终存在的元素是布局的一部分（导航等），我通常会有一个主要的内容容器，根据 URL 进行切换。我通常给它一个 `id` 为\
    \ `pages`，然后使用一个名为 `ampersand-view-switcher` 的辅助模块，根据 URL 将 `PageView` 渲染到该容器中。\n\
    \n视图切换器只是一种处理视图切换的方式。默认情况下，它只是渲染你提供的视图并将其附加到容器中，并移除那里可能存在的任何现有视图。但我们也可以提供自定义的过渡方式。例如，我们可能希望页面能够设置页面上的\
    \ `<title>`。\n\n以下是一个使用 AmpersandView 时主视图可能的样子示例：\n\n```javascript\nvar AmpersandView\
    \ = require('ampersand-view');\nvar ViewSwitcher = require('ampersand-view-switcher');\n\
    var templates = require('./templates');\n\nmodule.exports = AmpersandView.extend({\n\
    \    // 我们的模板函数，返回一个 HTML 字符串\n    // 这也可以只是一个字符串。模板语言无关紧要。\n    // 它只需要是一个接受参数并返回字符串的函数。\n\
    \    template: templates.main,\n\n    render: function () {\n        // 继承自 AmpersandView，它渲染主模板\n\
    \        // 并将其插入根元素。\n        this.renderWithTemplate();\n        // 为该元素设置我们的页面切换器\n\
    \        this.pageSwitcher = new ViewSwitcher(this.get('#pages'), {\n        \
    \    // 这里我们提供一些在每次切换应用页面时想要执行的操作。\n            show: function (newView, oldView)\
    \ {\n                // 设置我们的文档标题\n                document.title = newView.pageTitle\
    \ || 'my awesome app';\n                // 滚动到顶部\n                document.body.scrollTop\
    \ = 0;\n                // 也许在我们的应用全局对象上存储当前页面的引用，\n                // 以便从浏览器控制台轻松访问。\n\
    \                app.currentPage = view;\n            }\n        });\n    }\n\
    });\n```\n\n你必须自行判断如何将内容分割为可管理的逻辑容器。通常，一个好的经验法则是尝试根据你将用于控制视图的模型来封装视图。\n\n例如，假设你有一个特定的\
    \ URL，代表一个应显示项目列表的页面。在这种情况下，你有一个页面视图，它被渲染在主视图的页面容器内。该 `PageView` 会渲染该页面的任何标题，以及一个用于项目列表的基本列表容器（可能是一个\
    \ `<ul>`）。\n\n该页面将你计划渲染到该容器中的集合作为其 `collection` 属性，然后我们可以使用 `renderCollection`\
    \ 方法来管理添加/删除单个视图（每个模型一个）。\n\n如果每个列表项没有太多关联的行为，你可能会选择在包含集合的视图中处理单个项目的渲染。你只需根据列表中每个项目关联的行为量来判断。如果它行为相当少或者是日志式的（例如，聊天室），你可能希望将它们渲染到容器中就完事了。如果它更具交互性，比如一个行程安排应用，你需要拖动项目、编辑它们，并且每个项目都有大量关联数据，那么你可能需要一个视图来包含每个项目的行为。\n\
    \n请查看关联的演示应用，以了解处理集合的每种方法的示例。\n\n你可以在我的 [GitHub 账户](https://github.com) 上找到该应用。\n\
    \n## 注意事项：理解 `this.$` 和 `this.get`\n\n在上面的示例中，在 `render` 方法里，你会注意到我们传递了：`this.get('#pages')`。在\
    \ Backbone 中，你会做 `this.$('#pages')[0]` 作为子视图的 `el` 参数。你可能想知道，为什么不直接传递 `$('#pages')`\
    \ 甚至直接传递 `document.getElementById('pages')`？\n\n原因是我们不能假设在调用此方法时视图已附加到主 DOM 树。如果你尚未将其附加，其他选择器查询将无法找到正确的元素，因为它们还不在主文档树中。事实上，通常父视图会在其自身的\
    \ render 方法中调用子视图的 `render()`，然后将结果附加到 DOM。这完全是有意为之，因为在主 DOM 树外部创建 DOM 元素要快得多，只附加和绘制一次即可。\n\
    \n因此，为了解决这个问题，Backbone 视图为每个视图创建了一个名为 `$` 的方法。此方法在功能上等同于普通的 jQuery 选择器，如 `$('.item')`。*但是*，它只在视图的元素内查找匹配项。这不仅更快（因为需要遍历的\
    \ DOM 更少），而且更重要的是，即使视图的元素*尚未附加到 DOM*，它也能在视图的元素内找到与选择器匹配的元素。Ampersand-View 的 `.get()`\
    \ 方法工作原理类似，它只在*视图的根元素内*搜索以检索匹配项。\n\n如果以上内容有点过于复杂，只需知道，当试图获取视图内的元素时，通常应该使用 `this.$('.yourSelector')`\
    \ 或 `this.get` **而不是** `$('.yourSelector')`。\n\n## 注册 DOM 事件处理程序\n\n在将视图连接到 DOM\
    \ 时，你通常希望响应用户的交互。\n\n因为向你视图中的特定方法注册一个处理程序，而\n"
