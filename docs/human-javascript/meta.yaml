    * If you''re too clever, you''ll forever own the project because no one else will
    know what the heck you''re doing. That will suck, and so will your project.

    * As the requirements change and evolve (as they most certainly will), your ability
    to quickly read and understand the various pieces of your app will dramatically
    affect how quickly you can change course.


    All of this is to say: WRITE CODE THAT IS EASY TO READ!


    # Tools and trickery


    You with me? Ok, but how do you actually do this?

    Well, let me give you a silly example:


    ```

    // Assume this is an array of strings from somewhere

    var myArray = [''hello'', ''something'', ''awesome''];

    ```'
