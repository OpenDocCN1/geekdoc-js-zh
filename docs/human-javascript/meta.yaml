    # A note about re-usability


    Personally, I want to make sure that anything I may want to re-use in another
    project doesn''t depend on a certain templating language.


    So, for anything that isn''t specific to the app I''m building, I''d suggest just
    using HTML strings and declared bindings to maximize re-usability.'
  - '[PAGE 79]


    # Stop sending template engines to the browser! Here’s a retrospectively obvious
    way to create templates that happen to be 6 to 10 times faster.


    These days, more and more HTML is rendered on the client instead of sent pre-rendered
    by the server. So if you’re building a web app that uses a lot of clientside JavaScript
    you’ll doubtlessly want to create some HTML in the browser.


    # How we used to do it


    First, a bit of history. When I first wrote ICanHaz I was just trying to ease
    the pain of generating a bunch of HTML in a browser.


    Why is it a pain? Primarily because JavaScript doesn’t cleanly support multi-line
    strings, but also because there isn’t an awesome string'
  - "[PAGE 80]\n\ninterpolation system built into JS.\n\nTo work around that, ICanHaz,\
    \ as lots of other template clientside template systems do, uses a hack to make\
    \ it easier to send arbitrary strings to the browser. As it turns out, browsers\
    \ ignore content in `<script>` tags if you give them a type attribute that isn’t\
    \ text/javascript. So, ICanHaz reads the content of tags on the page that say:\
    \ `<script type=\"text/html\">` which can contain templates, or any other multi-line\
    \ strings for that matter. So, ICanHaz will read those templates and using Jan\
    \ Lehnardt’s awesome mustache.js it turns each of them into a function that you\
    \ can call to render that string with your data mixed into it. For example:\n\n\
    This HTML:\n\n```\n<script id=\"user\" type=\"text/html\">\n  <li>\n    <p class=\"\
    name\">Hello my name is: {{ name }}</p>\n    <p><a href=\"http://twitter.com/{{\
    \ twitter }}\">@{{ twitter }}</a></p>\n  </li>\n</script>\n```\n\nIs read by ICanHaz\
    \ and turned into a function you call with your own like this:\n\n```\n// Your\
    \ data\nvar data = {\n  first_name: \"Henrik\",\n  last_name: \"Joreteg\"\n}\n\
    \n// I can has user??\nhtml = ich.user(data)\n```\n\nThis works pretty well and\
    \ is much cleaner than building HTML strings manually. Clearly, lots of people\
    \ thought the same as it has been quite a popular library."
  - '[PAGE 81]


    # # Why that’s less-than-ideal


    It totally works, but if you think about it, it’s a bit silly. We’re making the
    client do a bunch of extra parsing and compiling that we could actually just do
    ahead of time. Of course, doing the parsing and compiling in the browser *also*
    means that we’re having to send the browser a whole template engine that can parse
    and compile templates.


    # ## The next iteration


    What I finally realized is that all you actually want when doing templating on
    the client is the end result that ICanHaz gives you: a function that you call
    with your data that returns your HTML.


    Typically, smart template engines, like the newer versions of mustache.js, do
    this for you. Once the template has been read, it gets compiled into a function
    that is cached and used for subsequent rendering of that same template.


    Thinking about this left me wondering, why don’t we just send the JavaScript template
    function to the client instead of doing all the template parsing/compiling on
    the client?


    Well, frankly, because I didn’t know of a great way to do it.


    I started looking around and realized that [Jade](https://jade-lang.com/) (which
    we already use quite a bit at &yet) has support for compiling as a separate process
    and, in combination with a small little runtime snippet, this lets you create
    JS functions that only require a small runtime and not the whole template'
  - '[PAGE 82]


    engine to render. Which is totally awesome!


    So, to make it easier to work with, I wrote a little tool: [templatizer](https://github.com/colinwren/templatizer)
    that you can run on the server-side (using Node) to take a folder full of Jade
    templates and turn them into a JavaScript module that you can include in your
    app and contains a function for each template file. Each template function simply
    takes a context object and returns a string with those values inserted.


    # The result


    From my tests the actual rendering of templates is **6 to 10 times faster**. In
    addition you''re sending *way* less code to the browser (because you''re not sending
    a whole templating engine) and you''re not making the browser do a bunch of work
    you could have already done ahead of time.


    # Can we get even faster?


    Possibly. Once you''re in a browser it''s faster to build DOM elements with DOM
    methods than by sending HTML strings that have to be interpolated with values
    and then parsed by the browser to create DOM elements.


    These days we''re seeing more template languages that compile to DOM methods instead
    to get that extra performance boost.


    The trade-off is not being able to use those same compiled templates on the server-side
    (where there is no DOM) without shimming a bunch of DOM methods.'
  - '[PAGE 83]


    In addition, as I discussed in the last chapter, you often want to do more than
    simply create the DOM to begin with, you also want to update it. So there’s the
    whole data-binding aspect that could potentially be handled at the template layer.


    Again, if you’re interested in this approach, check out [domthing](domthing) or
    [htmlbars](htmlbars).'
- md: "## Clientside routing (if there is such a thing)\n\nOne thing you sometimes\
    \ lose with a browser app is the proper handling of the browser’s “back” button\
    \ and the ability to “deep link” into some specific view of the app.\n\nThe good\
    \ news is we don’t actually have to make those tradeoffs. Through the clever use\
    \ of Backbone’s router and HTML5 push state, browser apps can take over the world.\
    \ Here’s how it works…\n\n### Same sh*t different URL\n\nFrom the server perspective,\
    \ how do we actually “hand control of routing to the client”? Ugh… that’s not\
    \ how the web works, right? The server has to answer actual http GET request when\
    \ a user types your app’s URL in their browser.\n\nSo what I mean is simply that\
    \ you return the same app HTML at multiple URLs.\n\nFor example, it doesn't matter\
    \ if you hit:\n\nhttps://andbang.com/andyet/chat\n\nor\n\nhttps://andbang.com/basecamp\n\
    \nEither way, the server will return this HTML:\n\n```\n<!DOCTYPE html>\n<script\
    \ src=\"/!.js\"></script>\n```\n\nIt may be helpful to think about it as a block\
    \ of URLs that all just serve the app.\n\nIf you're using Express and Node it's\
    \ quite easy to do.\n\n```\napp.get('/other/thing', function () {\n    // You\
    \ could still serve other support pages\n    // and simple things at specific\
    \ URLs.\n});\n\n// But then you want some sort of catch all that matches\n// the\
    \ range of URLs you're going to want the single page app\n// to be available at:\n\
    app.get('*', function (req, res) {\n    res.sendFile('sameSh*t.html');\n});\n\
    ```\n\nBut, of course, the same thing can be done in most any framework, or even\
    \ with an nginx config.\n\nBut the big difference is that at this point we've\
    \ made finding/fetching the right data and rendering the right view the responsibility\
    \ of the browser app, not the server.\n\n### How to deal with clientside routes\n\
    \nAnd Bang has a task detail page for every task at a URL structure that looks\
    \ like this:\n\nhttps://andbang.com/andyet/tasks/47\n\nSo, if a user types that\
    \ URL in their browser the user will see a detail view of that task. Also, if\
    \ they're somewhere else in the app and navigate to that task view by clicking\
    \ the task in their list, the page won't reload, but when you look at the URL\
    \ bar in the browser, that's the page you're on.\n\nBackbone's router is really\
    \ handy for handling all of that stuff.\n\nBut, in order to grasp how this works\
    \ in practice, we have to talk a bit about the application launch sequence.\n\n\
    ### 3... 2... 1... Blastoff!\n\nGenerally there's going to be a fairly specific\
    \ load sequence you'll want to go through before you're ready to “respond” to\
    \ the specific URL in your client code.\n\nTypically, that sequence goes something\
    \ like this:\n\n- Init your main application object. (The “app” global I keep\
    \ talking about.)\n- Attach a few model collections to that app global.\n- Init\
    \ and populate a single “me” object that represents the currently logged in user\
    \ and stores session specific state.\n- Render the application layout view inside\
    \ the <body> tag.\n- Fetch any app-wide data that's needed.\n- Then trigger the\
    \ clientside router\n\nNow in code:\n\n```\nmodule.exports = {\n  // The main\
    \ launch function. This is the\n  // entry point into your application.\n  launch:\
    \ function () {\n    // Explicitly create a global called \"app.\"\n    // Doing\
    \ this first means it *always* exists\n    // if we need to access it from a view.\n\
    \    window.app = this;\n\n    // Attach some model collections\n    this.tasks\
    \ = new Tasks();\n    this.chatMessages = new Messages();\n\n    // Init a 'me'\
    \ object\n    window.me = new Me();\n\n    this.fetchStandardData(function (err)\
    \ {\n        if (err) {\n            // Handle errors\n        }\n        // render\
    \ the main view\n        app.view = new MainView({\n            model: me\n  \
    \      }).render();\n\n        // Start our router.\n        // Init our URL handlers\
    \ and the history tracker\n        new Router();\n        app.history = Backbone.history;\n\
    \        // We have what we need, we can now start our router and show the appropriate\
    \ page\n        app.history.start({pushState: true, root: '/'});\n    });\n\n\
    \  },\n  fetchStandardData: function (mainCallback) {\n    var self = this;\n\
    \    async.parallel([\n        function (cb) {\n            self.tasks.fetch({success:\
    \ cb});\n        },\n        function (cb) {\n            me.fetch({success: cb});\n\
    \        }\n    ], mainCallback);\n  }\n}\n```\n\nAs you can tell there's a handful\
    \ of things we do regardless of the URL. Once we've got that sorted, then we init\
    \ our router and start our history tracking (which enables back-button support).\n\
    \nThe client router looks something like this:\n\n```\nvar Backbone = require('backbone');\n\
    var TaskDetailPage = require('pages/taskDetail');\nvar FourOhFourPage = require('pages/fourOhFour');\n\
    \nmodule.exports = Backbone.Router.extend({\n    routes: {\n      '': 'home',\n\
    \      ':slug/:slug/task/:taskid': 'memberTaskDetail',\n      ...\n    },\n\n\
    \    // --------- ROUTE HANDLERS ----------\n    home: function () {\n      app.navigate(app.teams.first().chatUrl);\n\
    \    },\n\n    memberTaskDetail: function (teamId, memberId, taskId) {\n     \
    \ var team = app.teams.get(teamId);\n      var member = team && team.members.get(memberId)\n\
    \n      // make sure we found our models or send to an internal\n      // 'not\
    \ found' page.\n      if (!team || !member) return this.fourOhFour();\n\n    \
    \  // We may or may not have the task, so we just pass it in and try to get it\
    \ from the view.\n      app.renderPage(new TaskDetailPage({\n        team: team,\n\
    \        member: member,\n        taskId: taskId\n      }));\n    },\n\n    fourOhFour:\
    \ function () {\n      app.renderPage(new FourOhFourPage());\n    }\n});\n```\n\
    \nSo, each of the routes listed at the top are turned into regexes by Backbone\
    \ and linked to a handler function.\n\nThat function is called with the “arguments,”\
    \ a.k.a. parameters you specified as being dynamic in your routes.\n\nI typically\
    \ think of each handler’s job as finding actual clientside model objects and then\
    \ creating a “page” view that it passes to the application.\n\nThe app is responsible\
    \ for taking that view and rendering it per conventions of the app. Usually we\
    \ just have a “page view” be a specialized kind of Backbone view that also has\
    \ a few standard methods for “show” and “hide.” The app controller just calls\
    \ “show” on the new one and “hide” on the currently active page, and the views\
    \ add/remove themselves from the application layout’s main “pages” container.\n\
    \nFrom this point forward we never need to do the launch sequence again. We'll\
    \ just change the route, then the route handlers will render the appropriate page,\
    \ and the page will ensure it has (or fetches) the data it needs.\n\n## Testing\
    \ and QA that doesn’t suck (so your app won’t)\n\n### The problem/challenge of\
    \ proper interface QA\n\nWe all know we need to test. While in the building phase\
    \ of a browser app I find that building an extensive test suite isn’t necessarily\
    \ worth the effort. Interfaces are inherently hard to test in that the variability\
    \ of human input is part of what makes a good test for an interface.\n\nAlso,\
    \ there are things that are just a bit hard to test. For example, if you support\
    \ drag and drop actions in your interface it's not so easy to write a test that\
    \ properly validates that it works well.\n\nThen there’s the “problem” of CSS\
    \ changes. The DOM can be in perfect order but if the styles are off things can\
    \ look quite broken, or you can have a layout issue where a control is covered\
    \ or unclickable.\n\nSome people build really elaborate QA systems that load their\
    \ app into a headless browser and takes screenshots that are compared against\
    \ reference images, etc. But the amount of effort and setup required for that\
    \ is simply not practical in most cases.\n\nThere are also tools like Selenium\
    \ that will script a browser for you, but it's a whole lot of work and setup,\
    \ and then every time you want to change something, if your tests are too specific\
    \ they'll need to be constantly updated. And if they're too general they'll miss\
    \ stuff.\n\nWhile headless browser testing is a really cool idea (PhantomJS, etc.),\
    \ it doesn't really help you know how your app works in other browsers.\n\nUltimately,\
    \ I don't believe you can actually do proper testing of an interface without a\
    \ human.\n\nSo, there must be a balance that can be struck between human approval\
    \ and oversight and taking advantage of the things computers are good at like\
    \ process, consistency, and automation.\n\n### Meet the SpaceMonkey\n\nSo we've\
    \ been building one, we're calling it SpaceMonkey. There wasn't anything out there\
    \ that did this in a way that was browser-agnostic, simple, and blended automation\
