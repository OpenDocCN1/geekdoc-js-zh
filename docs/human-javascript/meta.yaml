  md: "We also want to build our app in tiny pieces of independent code (a.k.a. modules).\
    \ So, how do we make sure each module has access to what it needs? By not referencing\
    \ globals and by having each module explicitly `require` other code that it needs.\
    \ That’s why we need a module system. Very few things will have a greater positive\
    \ impact on your code structure than switching to a good module system.\n\nCommonJS\
    \ is the same style/concept that is used in Node. By following this style you\
    \ get the additional benefit of being able to reuse modules written for the client\
    \ on the server and vice versa (though, the overlap is usually not that big).\n\
    \nIf you’re unfamiliar with the CommonJS modules style, your files end up looking\
    \ something like this:\n\n```\n// You import things by using the special `require`\
    \ function and you can\n// assign the result to a variable\nvar AmpersandModel\
    \ = require('ampersand-model');\nvar _ = require('underscore');\n\n// You expose\
    \ functionality to other modules by declaring your main export\n// like this.\n\
    module.exports = AmpersandModel.extend({\n    type: 'navItem',\n    props: {\n\
    \        active: ['boolean', true, false],\n        url: ['string', true, ''],\n\
    \        position: ['number', true, 200]\n    },\n    init: function () {\n  \
    \      // Do something\n    }\n});\n```\n\nThat’s it! Super easy. You don’t create\
    \ any globals. Each file that uses your module can name it whatever makes the\
    \ most sense for use in that module.\n\nYou just export a constructor (like above),\
    \ or a single function, or even a set of functions. Generally, however, I’d encourage\
    \ you to export only one thing from each module."
