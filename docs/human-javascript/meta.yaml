  md: '# App settings and configuration


    # The problem


    App configuration and environment settings are always a PITA, right? Especially
    when you''ve got configuration settings you want to pass to your single page app.
    If we''ve structured everything as building a “static” js file that gets sent,
    then how do we pass dynamic values into it for things like configuration?


    We solve this problem with a simple approach and two specific tools:


    +   - getconfig

    - clientconfig


    They''re in no way dependent on each other but they do play nicely together. (Both
    are on npm, by the way).'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# # getconfig


    First, getconfig. This is a tool for configuring Node web apps. It follows the
    same assumptions as [Express](Express) does, in that it looks to an environment
    variable (NODE_ENV, [reference](reference)) to determine the mode in which it
    should run.


    It simply uses that to look for a JSON config file that matches the name of the
    environment. For example: dev_config.json or production_config.json. It defaults
    to dev if it doesn''t find one.


    Then, from your Node app you just require “getconfig” and access settings directly
    on the resulting object, which will have pulled it from the correct config file.
    Super clean/simple:


    ```

    // We just require the module

    var config = require(''getconfig'');


    // Which actually returns our environment-aware config

    // from the corresponding config file.

    config.mySetting;

    ```


    It just pulls the right config from the right file, no “if” statements, no mess.


    # # clientconfig


    On the clientside we do something very similar.


    ```

    var config = require(''clientconfig'');


    config.mySetting;

    ```'
  merge: -1
  pgno: 99
- img_proc: true
  md: "This time, instead of looking for an environment variable, the module looks\
    \ for a cookie called “config” that contains a JSON encoded config object. It\
    \ immediately reads, then destroys that cookie (to avoid the overhead of sending\
    \ it around on any subsequent requests).\n\nClientconfig reads and returns a “frozen”\
    \ config object (using ES5 Object.freeze, if available) with our settings. So,\
    \ it’s basically the equivalent developer experience as getconfig, but for the\
    \ client.\n\n# Using them together\n\nIn combination, it gets pretty slick:\n\n\
    Say we have a dev_config.json that looks like this, on our server.\n\n```\n{\n\
    \  \"myProjectSetting\": \"someSetting\",\n  \"clientAppSettings\": {\n    \"\
    apiUrl\": \"https://api.andbang.com\",\n    \"trackMetrics\": false\n  }\n}\n\
    ```\n\n*note the “clientAppSettings” section.\n\nNow, in our main server file\
    \ where we handle the requests for single page apps, we then add on our config\
    \ cookie with the data from getconfig using a very simple piece of middleware.\n\
    \n```\n// Set up our app and require getconfig\nvar app = require('express')(),\n\
    \    config = require('getconfig');\n\n// Build a tiny middleware function that\
    \ sets the cookie\nvar configMiddleware = function (req, res, next) {\n  res.setCookie('config',\
    \ JSON.stringify(config.clientAppSettings));\n  next();\n};\n```"
  merge: -1
  pgno: 100
- img_proc: true
  md: "```\n// In the code that serves our singlepage app, use the middleware\napp.get('/app',\
    \ configMiddleware, function (req, res) {\n    res.send(clientApp.html());\n});\n\
    ```\n\nJust like that, we've got a simple unified config file on our server where\
    \ we can store all environment specific settings for the whole app. It becomes\
    \ very painless to pass settings to our clientapp based on our environment without\
    \ having to think about it.\n\nThe other benefit of this approach is that it lets\
    \ us keep our clientside JS app as a completely static file. We don't have to\
    \ do custom builds that write in settings or anything while still avoiding additional\
    \ HTTP requests to fetch settings.\n\n# Security caveats\n\nPlease avoid if sending\
    \ any valuable settings across the wire this way, especially if you're not using\
    \ https. Cookies are just http headers, so it's best to assume that this is not\
    \ secure information and thus, should only be used for non-sensitive data."
  merge: -1
  pgno: 101
- img_proc: true
  md: "# # Caveats/Gotchas\n\n# ## Function bindings\n\nThe most common thing I see\
    \ when teaching people JavaScript, even people who have been working with jQuery\
    \ for a long time, is understanding how function execution works in JavaScript.\n\
    \nThere are 4 ways to call a function in JavaScript:\n\n1. As a stand-alone function:\n\
    \n```\nvar myFunction = function () {\n  console.log(\"this\" is, this);\n};\n\
    \nmyFunction(); // Will log out the `window` object (or global in Node)\n```\n\
    \n2. As a property of an object:\n\n```\nvar obj = {};\nobj.myFunction = function\
    \ () {\n  console.log(\"this\" is, this);\n};\n```"
  merge: -1
  pgno: 102
- img_proc: true
  md: '```

    };


    obj.myFunction(); // Will log out the ''obj'' object


    // Now here''s where it gets tricky (continuing the same code as above)


    var myFunc = obj.myFunction;


    myFunc(); // What will this log out as its ''this''?


    // the answer is the `window` object

    ```


    # 3. Using call


    ```

    var myFunc = function () { ... };


    // call with a specific context and any number of arguments

    myFunc.call({any: ''object''}, ''someArgument'', ''someOther'');

    ```


    # 4. Using apply


    ```

    var myFunc = function () { ... };


    // apply an array of arguments

    myFunc.apply({any: ''object''}, [''someArgument'', ''someOther'']);

    ```


    So the question is why?


    In JavaScript “this” isn’t magic. It’s just an object. It’s whatever you tell
    it to be when you’re calling the function. It’s simply the context object for
    that function execution.


    So in the case of the second example where we just do `myFunc();` we’re not giving
    it anything to use as a context, so it uses the global object “window” because
    a function body will always have a “this” inside that represents the context of
    execution.


    These are not problems JS developers are used to thinking about when building
    apps with jQuery. jQuery nearly always hands you the current element as the ‘this’
    for event handlers, etc. But…as soon as we start'
  merge: -1
  pgno: 103
- img_proc: true
  md: "Caveats/Gotchas\n\ndoing Backbone it trips people up a lot. The following is\
    \ an example of what I see pretty much every person new to Backbone do:\n\n```\n\
    var Backbone = require('backbone'),\n    templates = require('templates');\n\n\
    module.exports = Backbone.View.extend({\n    initialize: function () {\n     \
    \   // Register a handler so that anytime the model changes,\n        // call\
    \ the render function.\n        // THIS WILL NOT WORK!\n        this.model.on('change',\
    \ this.render);\n    },\n    render: function () {\n        this.$el.html(template.thing());\n\
    \    }\n});\n```\n\nThe problem is that inside the render function, \"this\" won't\
    \ be the Backbone view if it's triggered by a change in the model. You may say,\
    \ \"Well we're specifying it as a property of something.\" In some ways, yes,\
    \ you wrote `this.render` but you're actually just referencing the resulting function\
    \ and giving the specific function, without context to the event registry.\n\n\
    In fact, what you're doing is no different than this:\n\n```\n// Register a handler\
    \ so that anytime the model changes,\n// call the render function.\n// THIS WILL\
    \ NOT WORK!\nvar render = this.render;\nthis.model.on('change', render);\n```\n\
    \nSo, the render function doesn't have any context when you just provide a pointer\
    \ to that function (even though the function may 'live' on the view).\n\nSo, here's\
    \ what you do. You can bind a function to a context before it's run like this.\n\
    \n```\n// THIS will work as expected.\n// Backbone's event system takes a third\
    \ argument for the\n// context to execute the function with.\nthis.model.on('change',\
    \ this.render, this);\n```"
  merge: -1
  pgno: 104
- img_proc: true
  md: "This leads into the other two ways to execute a function:\n\n```\nmyFunction\
    \ = var myFunction = function () {\n    console.log(\"\\\"this\\\" is\", this);\n\
    };\n\nvar someOtherContext = {\n    name: 'blah'\n};\n\n// Both of these will\
    \ log out the 'someOtherContext' object\nmyFunction.apply(someOtherContext);\n\
    myFunction.call(someOtherContext);\n\n// In ES5 compliant (read modern) browsers\
    \ you can also do this\nmyFunction = myFunction.bind(someOtherContext);\nmyFunction();\
    \ // \"this\" will be someOtherContext\n\n// Or if you're using underscore it\
    \ doesn't matter if you're\n// in a modern browser or not. You can just do this:\n\
    \nmyFunction = _.bind(myFunction, someOtherContext);\nmyFunction(); // For the\
    \ same result\n```\n\nThat’s function binding in a nutshell. It’s really just\
    \ info about how the language works. But it’s such a common issue with people\
    \ who are new to Backbone, or less familiar with JavaScript as a language that\
    \ I figured it was worth explaining.\n\n# Gotchas regarding DOM manipulation in\
    \ views (they may still be detached)\n\nAnother common issue is understanding\
    \ what `this.$()` does in views.\n\nIf you’ve got a div in your template that\
    \ looks like this: `<div id=\"myDiv\"/>` and we do this in the render function\
    \ you’ll have a problem:\n\n```\nvar Backbone = require('backbone');\n\nmodule.exports\
    \ = Backbone.View.extend({\n    render: function () {\n        this.$el.html(templates.myTemplate());\n\
    \    }\n});\n```"
  merge: -1
  pgno: 105
- img_proc: true
  md: '```

    // Then you try to access that div like so:

    $(''#myDiv'').on(''click'', this.doSomething);


    // ^^ myDiv won''t be found! If the root element of this

    // view isn''t already attached to the DOM.

    return this;

    }

    });

    ```


    What many people don''t know is that you can pass a second argument to the jQuery
    function $(selector) that is the DOM tree to look within. So if you did $(''#myDiv'',
    this.el) in the example above, it would always work.


    Backbone tries to make things easy for us, rather than having to do that. Remember
    to always use this.$() instead of just $() within views. That''s just a helper
    for passing the view''s base element to the jQuery function. It''s functionally
    equivalent to passing this.el as the second argument.


    # Failed Ajax requests


    Inevitably with single page apps you have to deal with issues of bad connectivity,
    or issues of stale data and/or expired sessions.


    If we''re using RESTful JSON APIs we''ll be making requests throughout the application''s
    lifecycle. One approach is to stub out a global error handler for all Ajax requests.
    jQuery makes this fairly simple: http://api.jquery.com/ajaxError. Often as part
    of an application''s main view, I''ll register a handler for global Ajax errors
    that pops up a dialog to show an appropriate message.'
