    # # Foreword


    The first thing I learned to do with JavaScript was swapping images.


    It was 1998 and that was the “state of the art” web application programming that
    I had any access to. It was a time before the web was filled with `MM_swapImage`,
    although I remember Dreamweaver being around. I knew HTML back then and hacking
    some JavaScript was my first foray into programming proper. The fact that the
    `src` of an `<img>` was something that I could programmatically change was a profound
    realisation for me at the time, although that now seems a very long time ago.


    My web hacking went along with what everybody else was doing, maybe with a delay
    of a year or two because I had to wait for stuff to arrive in Germany (the Internet
    was very slow back then). Netscape and IE 4 came out and brought new ways of dynamically
    manipulating and animating HTML content. DHTML was born, and I tried to figure
    it all out until I could swap out content with layers (layers!) and divs that
    worked in *both* browsers.


    It was cool to play with, but at that time building things that worked'
  - '[PAGE 6]


    consistently was not much fun, so I turned to the dark side and got involved with
    backend web development. I could let others worry about all the quirky browser
    differences. The backend is where I found my passion for databases.


    But then 2005 came around and everything changed. Google unveiled Maps and the
    world was a different place. I distinctly remember, to this day, dragging the
    map inside the browser window — and I still get goosebumps thinking about it.
    Google Maps was the Beatles coming to America moment for the web.


    Around the same time, 37signals came along with their web based apps for freelancers
    and small businesses and not only showed the world what can be done on the web,
    they started a year long discussion between supporters of what we call native
    desktop apps and web apps. We now go through the same thing with native mobile
    apps and the web.


    37signals even wrote a book about how to build a bootstrapped business around
    the software as a service model that sparked a whole generation of web app entrepreneurs
    who built great products that touched the world in their own ways.


    Truly inspired, a friend from university and I set out to do our own software
    as a service. We spent a good amount of time on it, but ultimately, it didn''t
    go anywhere. There were a number of issues, but my poor understanding of frontend
    web technologies certainly didn''t help. We managed to build a functional prototype,
    but the code was a mess, bugs were impossible to fix, new features wouldn''t land,
    and refactoring efforts failed multiple times until we gave up. We folded and
    I went back to the backend and database side of things.


    Fast forward to where I start Hoodie and find myself in the company of'
  - '[PAGE 7]


    excellent frontend developers. Now, the best I can do for the project is build
    out all the backend so they don''t have to worry about a thing while they knock
    out the frontend.


    However, I am still longing for a deeper understanding of the frontend world.
    I can dabble, but I want to be confident.


    Computer science is fundamentally about building things. Unlike architecture or
    structural engineering, the what, how, and why of doing our work changes on a
    scale of years, if not weeks sometimes. Stuff we learned last year is proverbially
    obsolete today.


    The flip side of this nature is that it is very hard to build a canon. Sure, we
    have algorithms and data structures as the foundations of modern teaching and
    yes, they are part of everyday work, but programming and building products is
    just *so much more*.


    It is on us to figure how to get the missing pieces into a curriculum that informs
    future generations of web developers.


    When Henrik told me he was working on Human JavaScript I begged to be added to
    the list of reviewers. Not because I thought I could point out all the places
    where he is wrong, but because I am still curious about the field of frontend
    web developers. I also liked the angle, thinking “I’m a human, this book is for
    me!” Joking aside, technical books tend to be very dry. This one promised to have
    a different approach, one that I could relate to.


    I read the draft in one sitting, took lots of notes and at the end of it, this
    whole space of the frontend world that wasn’t accessible to me, became clearer.
    I saw the necessity for more complex MVC frameworks on the client than I had experience
    with. I started to understand why structuring your code in certain ways makes
    it more robust in the face of having multiple people work on it. The book managed
    to illuminate well known'
  - '[PAGE 8]


    concepts in the unfamiliar frontend territory. Human JavaScript made frontend
    development accessible to me.


    Truly inspired again I went on and built a small side project. It isn’t much,
    but it makes me excited about building more web apps.


    Human JavaScript is the collected wisdom of the team at &yet, where Henrik works,
    and all the blood and sweat that goes into their excellent client projects, and
    their own products. It couldn''t come from a better group of people. They care
    about the right technology as much as teaching it. They take it upon themselves
    to fill the gaps of missing canon for web development.


    &yet are the 37signals of our generation and I just can’t wait to see what the
    people they inspire come up with. I can’t wait to see what you come up with.


    — Jan Lehnardt


    Berlin, September 27th 2013


    Jan is an Open Source Software developer from Berlin, Germany. He is the Vice
    President of [Apache CouchDB](http://couchdb.apache.org/), the database that replicates.
    He''s the co-curator of [JSConf EU](http://2013.jsconf.eu/), a partner at [The
    Node Firm](http://thenodefirm.com/) and his one famous JavaScript project is [mustache.js](https://github.com/janl/mustache.js).
    He currently works on [hood.ie](http://hood.ie/), an open source noBackend solution
    that aims to do for frontend development what Rails did for the backend: make
    all the tedious pain go away, and hide it behind an intuitive JavaScript API.'
- md: '## # Human JavaScript


    Code is as much about people as it is about computers. Sure, it’s run by computers,
    but it’s written by, maintained by, and ultimately created for people. People
    are not computers. We are not robots. We are unpredictable, flawed, and irrational.
    The same people with the same tools and instructions won’t produce the same output
    each time. We generally don’t like being alone and we don’t work well in isolation.
    In fact, in order to do our best work we *need* to work with other people. None
    of these traits are bad things, quite the opposite. They’re what makes us who
    we are, they make us, well… human. Yet, as developers it’s easy for us to get
    so focused on optimizing for technology that we forget to optimize for people.


    You can read about JavaScript, the language, elsewhere. Its good parts, bad parts,
    and ugly parts are well documented. This is a book about a specific set of tools,
    patterns, and approaches that we feel are optimized for people. These approaches
    enable our team to quickly build and deliver high-quality JavaScript applications
    for humans.


    **&yet**, the team I’m humbled to be a part of, is a small (~40 person) bootstrapped
    consulting and product company focused heavily on realtime single page web applications.
    We''ve had the opportunity to build a very broad range of single page applications
    for all kinds of purposes and audiences. We''ve built stuff for mobile, desktop,
    browser extensions, PhoneGap, televisions, you name it. From these experiences
    patterns start to emerge. Patterns that enable us to efficiently ship real-life
    applications (with real-life deadlines) as a team.


    As we''ve gone along, we''ve done our best to extract reusable tools out of them.
    So, in some ways we accidentally wrote this book. What I mean is that much of
    its contents are compiled from past blog posts, explanations to teammates and
    clients, and from project README files. This book is primarily an extraction,
    not a creation. We''re sharing our experience, secrets, and tools to hopefully
    give you and your team a solid footing for building great apps and experiences.


    ## Acknowledgements


    Speaking of humans, this book would not exist if not for a giant list of people
    who helped make it a reality. To name a few specifically, a huge thank you to
    Jan Lehnardt, Philip Roberts, Bear (Mike Taylor), Luke Karrys, Jenn Turner, Adam
    Brault, Sara Chipps, Jeff Boyus, Lance Stout, Karolina Szczur, Jon Hjelle, Melanie
    Brown, Stephanie Maier, Beau Sorensen, Michael Garvin, Amy Lynn Augspurger and
    others.


    They helped with technical review, code, editorial feedback, design, writing/producing
    the promotional video and loads of encouragement. Thank you all!


    ## # This Book Will Help You Build Native HTML5 Apps


    Let’s talk about this whole “app” thing for a bit and get on the same page in
    terms of terminology. If you own a smart phone of any sort, you’ve been inundated
    with the word “app” over the past five years or so.


    Rather than pontificate on the meaning of this for three chapters, I’ll explain
    the distinction as I see it for the purposes of this book.


    When most people say they’re building a “web app” they’re talking about writing
    source code that describes an application that will run on the server and send
    rendered HTML to the browser. This definition seems a bit narrow and limiting.
    Plus, when I think of my favorite web apps they don’t fit neatly into that box.
    The best web apps often have multiple interfaces and clients, some native, some
    web. Most play nicely with or completely integrate with other services. Generally
    web apps are good at solving some specific problem or provide some specific benefit
    and use the web to tie it all together.


    The web vs. native debate is a bit worn out. From my perspective the whole debate
    is somewhat misguided. It doesn’t have to be one or the other, I have no problem
    with it being both. It’s no secret that most native apps are even better with
    the web. Why else would classic native Apple apps like iPhoto start integrating
    with Flickr and Facebook? And yet, you can’t write a native app for every platform
    out there.


    Thinking of your “web apps” as an API with a series of clients seems much more
    fitting. It just makes sense. Your API defines your service, connects you to other
    users, and ties in the whole experience. Then you can focus on building clients
    that provide the best experience possible for various environments and uses.


    Let’s talk about browsers for a second. They’re completely freakin’ amazing. Well,
    the modern ones, at least. They are nothing short of extremely capable, *mostly*
    standardized operating systems that are freely available on nearly every platform.
    They keep getting more and more amazing every day. Sadly, the addiction to backwards
    compatibility is crippling perceptions of what that operating system is capable
    of. Too often the web interface ends up being the lowest common denominator in
    terms of experience. That doesn’t have to be the case! Let’s build for the future
    of the web, not its past.


    The types of apps we’re talking about building in this book could really be called
    “Native HTML5 apps” in that they use HTML5 to its full extent without bowing to
    compatibility with crappy old browsers.


    To clarify further:


    -   1. They are separate from the API.

    -   2. They don’t work *at all* if someone has JavaScript turned off.

    -   3. A modern browser with a modern JavaScript engine is a minimum system requirement.

    -   4. We send the application code itself to the browser, not the result of running
    the application code.

    -   5. The app is rendered entirely on the client. We only send the bare minimum
    HTML we need to tell the browser to run our app. Usually just a doctype, a script
    tag and a stylesheet.

    -   6. After loading, the client fetches its own data, as data (typically JSON),
    not as rendered HTML.

    -   7. The app is loaded once and never does a full page reload while you''re
    using it.

    -   8. Actions like clicking on a link to render a new “page” utilizes asynchronous
    JavaScript.

    -   9. The app has and maintains “state” that is cached and maintained separate
    from the server.


    From now on, when I say “app” or “native HTML5 app” or “browser app” or “client
    app” within these pages, that is what I''m referring to.


    Here''s more food for thought: once you acknowledge that the browser has state,
    you really ought to think about how to keep that state up to date and make it
    a “realtime” application.


    ## Realtime apps are human apps


    A lot of people get hung up on the term “realtime.” The way I''m using it here
    is not referring to latency or speed of delivery, it''s about the fact that there
    are multiple sources of data (usually people) doing stuff! People are changing
    the data all the time and our app isn''t passively waiting for the user to refresh.
    Instead the app keeps itself up to date. In reality, no web app is “hard real-time”
    as per computer science. In our case, it''s a term to help describe apps that
    keep themselves up to date.


    Realtime isn''t about hype and technology – it''s about removing the friction
    of technology on collaboration and overcoming the confusion of keeping track of
    lots of state.


    The future of the web is realtime. Of this I have no doubt.


    The reason I can say this with such certainty is that it''s already happening
    under our noses.


    Facebook, Gmail, Google Talk, and GitHub just to name a few, have all implemented
    some form of automatic page updating. When they have something new to tell you,
    they don''t wait for you to ask for it. They push it out to you, from the server
    to the client.


    In some cases this is as simple as the page automatically polling to see if there''s
    something new. In other cases it''s more advanced, where all the data used to
    build and update the page is coming over an open WebSocket connection. For our
    purposes, the transport mechanism is largely irrelevant; the point is, data comes
    to you.


    This inherently breaks the statelessness of the web. It used to be that I hit
    a URL and got back a webpage. As a user I understood that the information on the
    page was (probably) accurate as of the time it was requested. If I wanted to check
    for something new, I''d go ask for it again and receive another snapshot in time.


    As soon as we make any effort to keep the information on the page in sync with
    the server, we''ve now acknowledged that the webpage has “state.” In some ways,
    the page always *had* state, but it was clear to users that it was snapshotted
    state, not up-to-date-synchronized state. As a result, that static page was more
    like a printed page than a living document.'
