  md: 'to this and serves as a fantastic primer to the problems of building clientside
    apps.


    Essentially, you''ll populate a set of models and collections of these models
    in memory in the browser. These will store all the application state for your
    app. These models should be completely oblivious to how they''re used; they merely
    store state and broadcast their changes. Then you will have views that listen
    for changes in the models and update the DOM. This core principle of separating
    your views and your application state is vital when building large apps.


    One aspect of this approach that is commonly overlooked is the flexibility it
    provides if you decide the app should have a different UI (<sarcasm>which *never*
    happens, right?*</sarcasm>), or if you build another application on the same API.
    All of the models pretty much without modification are completely reusable.


    # CommonJS Modules


    I''m not going to get into a debate about module styles and script loaders. But
    I can tell you this: I haven''t seen any cleaner, simpler mechanism for splitting
    your code into nice isolated chunks than CommonJS modules.


    Let''s pause for just a second to discuss what modules do for us. JavaScript has
    globals. What I mean is if you don''t put a `var` in front of any variable declaration,
    you''ve just created a global variable that''s accessible from *any* other code
    in your app. While this *can* be used for good it also gives you a lot of rope
    to hang yourself with. Without a way of managing this, as your app grows, knowing
    what global variables you have at what time will become nearly impossible and
    will likely be a big source of bugs.'
