  - '[PAGE 65]


    # # Introducing AmpersandView


    As I mentioned Backbone views are very limited in scope — quite intentionally
    so. The following explanation is pulled straight from the Backbone docs:


    > > Backbone views are almost more convention than they are code — they don''t
    determine anything about your HTML or CSS for you, and can be used with any JavaScript
    templating library. The general idea is to organize your interface into logical
    views, backed by models, each of which can be updated independently when the model
    changes, without having to redraw the page.


    Backbone''s general approach is to provide some simple components and patterns,
    and it''s up to you to apply them as you wish. This non-prescriptive flexibility
    is a big reason why Backbone has become as popular as it has.


    However, as you start to build more and more apps you find yourself solving similar
    problems over and over. In pure Backbone projects we found ourselves always creating
    a `BaseView` that contained a lot of the common helpers and patterns we wanted
    in all our views, and we used that to build all our views in the app. One day
    I found myself copying and pasting one of the `BaseView`s from one project to
    another, and just decided to put in on npm instead.


    That''s how AmpersandView was born. It''s like a Backbone view but it gives us
    a few additional goodies.


    Specifically, it gives us the following:'
  - '[PAGE 66]


    +   1. Declarative data bindings.

    2. A `.renderWithTemplate()` method that does several things we want to do on
    every render.

    3. A `.listenToAndRun()` convenience method for binding view methods to model
    events, while maintaining the view as the context and triggering them right away.

    4. A `.renderCollection()` method for rendering a view for each item in a collection
    within a given container element in the view.


    We’ll take a look at each of those shortly. But first, let’s figure out how we’re
    going to structure our views within the app.


    # A Hierarchy of Views


    As you start to build an application with views, you’ll find it makes sense to
    segment things into subviews. Which raises the question, how do you determine
    what portions of the app layout to split into subviews?


    I generally start with a single main view, that I put in `views/main.js`. The
    main view has the `<body>` as its root element. It’s only rendered once and creates
    the main layout of the app, often rendering several subviews. It also becomes
    the logical place to register “global” event handlers for things like keyboard
    shortcuts or app-wide click handlers.


    The layout will vary from one app to the next, but there are typically some ever-present
    elements that are part of the layout (navigation, etc.) and often I will have
    some type of main content container that swaps out based on the URL. I typically
    give that an `id` of `pages` and then render a `PageView` into that container
    based on the URL using a little helper module called `ampersand-view-switcher`'
  - "[PAGE 67]\n\nThe view switcher is just a way to handle swapping out views. By\
    \ default it just renders and appends the view you give it to the container and\
    \ removes any existing one that may be there currently. But we can also provide\
    \ custom ways to transition those. We may, for example, want the page to be able\
    \ to set the <title> on the page.\n\nHere's an example of how a main view might\
    \ look if we're using AmpersandView:\n\n```\nvar AmpersandView = require('ampersand-view');\n\
    var ViewSwitcher = require('ampersand-view-switcher');\nvar templates = require('./templates');\n\
    \nmodule.exports = AmpersandView.extend({\n    // Our template function that returns\
    \ an HTML string\n    // this can also just be a string. Template language\n \
    \   // is irrelevant. It just needs to be a function that\n    // takes an argument\
    \ and returns a string.\n    template: templates.main,\n\n    render: function\
    \ () {\n        // Inherited from AmpersandView, it renders the main template\n\
    \        // and inserts it into the root element.\n        this.renderWithTemplate();\n\
    \        // set up our page switcher for that element\n        this.pageSwitcher\
    \ = new ViewSwitcher(this.get('#pages'), {\n            // here we provide a few\
    \ things we'd like to do each time\n            // we switch pages in the app.\n\
    \            show: function (newView, oldView) {\n                // set our document\
    \ title\n                document.title = newView.pageTitle || 'my awesome app';\n\
    \                // scroll to the top\n                document.body.scrollTop\
    \ = 0;\n                // perhaps store a reference to our current page on our\n\
    \                // app global for easy access from the browser console.\n   \
    \             app.currentPage = view;\n            }\n        });\n    }\n});\n\
    ```\n\nYou will have to make a judgement call on the best way to segment things\
    \ into manageable, logical containers for your application. Generally, a good\
    \ rule of thumb is try to encapsulate views by the models you'll use to control\
    \ them."
  - '[PAGE 68]


    For example, let’s assume you’ve got a certain URL that represents a page that
    should show a list of items. In this case you have a page view that is rendered
    inside the main views’ page container. That PageView would render any headings
    for that page, as well as a basic list container (a `<ul>` perhaps) for your list
    of items.


    That page would take the collection you plan to render into that container as
    its `collection` property, then we could use the `renderCollection` method to
    manage adding/removing individual views (one for each model).


    If there isn’t a lot of behavior associated with each line item, you may choose
    to handle the rendering of individual items in the view containing the collection.
    You’ll simply have to make a determination based on how much behavior is associated
    with each item in the list. If it’s fairly behavior-less or log-like (say a chat
    room, for example) you might want to render them into the container and be done.
    If it’s more interactive, like an tour scheduling app where you’re dragging items
    around, editing them, and there’s lots of associated data with each one, then
    you’ll probably want a view to contain the behavior of each item.


    Take a look at the associated demo app to see examples of each approach to handling
    collections.


    You can find the app on my [GitHub account](https://github.com)


