    equivalent to passing this.el as the second argument.


    # Failed Ajax requests


    Inevitably with single page apps you have to deal with issues of bad connectivity,
    or issues of stale data and/or expired sessions.


    If we''re using RESTful JSON APIs we''ll be making requests throughout the application''s
    lifecycle. One approach is to stub out a global error handler for all Ajax requests.
    jQuery makes this fairly simple: http://api.jquery.com/ajaxError. Often as part
    of an application''s main view, I''ll register a handler for global Ajax errors
    that pops up a dialog to show an appropriate message.'
