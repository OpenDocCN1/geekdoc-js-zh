    ')\n        .goToPage('/info')\n        .confirm('Info page is visible')\n   \
    \     // Call this when done\n        .destroy();\n});\n```\n\nTo see it in action:\n\
    \n1.  Install the app generator using npm: `npm i humanjs -g`\n2.  Run the generator\
    \ and answer its questions: `humanjs`\n3.  Run the generated app and visit `http://localhost:3000/test`\
    \ in a browser\n\nAs I mentioned, we still have a lot of work to do in making\
    \ SpaceMonkey a well-structured standalone library. But it seemed useful and functional\
    \ enough to include.\n\nAnd if nothing else, the general idea might be enough\
    \ to tempt you to build it :)\n\n## Unit testing modules that require a browser\n\
    \nFor tests that are not QA, but are in fact unit tests, you need a way to write\
    \ tests that will run in a browser and ideally, we'd be able to run them from\
    \ the command line.\n\nTurns out, we can. Using a set of tools developed largely\
    \ by [James Halliday](https://github.com/substack), a.k.a “substack”.\n\nHere's\
    \ a sample from ampersand-state:\n\n```\nvar test = require('tape');\nvar State\
    \ = require('../ampersand-state');\n\nvar Person = State.extend({\n    props:\
    \ {\n        name: 'string'\n    }\n});\n\ntest('init with values', function (t)\
    \ {\n    var person = new Person({name: 'henrik'});\n    t.ok(person);\n    t.equal(person.name,\
    \ 'henrik');\n    t.end();\n});\n\ntest('after init, change should be empty until\
