  md: '# # Clientside routing (if there is such a thing)


    One thing you sometimes lose with a browser app is the proper handling of the
    browser’s “back” button and the ability to “deep link” into some specific view
    of the app.


    The good news is we don’t actually have to make those tradeoffs. Through the clever
    use of Backbone’s router and HTML5 push state, browser apps can take over the
    world. Here’s how it works…


    # ## Same sh*t different URL


    From the server perspective, how do we actually “hand control of routing to the
    client”? Ugh… that’s not how the web works, right? The server has to answer actual
    http GET request when a user types your app’s URL in their browser.


    So what I mean is simply that you return the same app HTML at multiple URLs.'
  merge: -1
  pgno: 84
- img_proc: true
  md: "For example, it doesn't matter if you hit:\n\nhttps://andbang.com/andyet/chat\n\
    \nor\n\nhttps://andbang.com/basecamp\n\nEither way, the server will return this\
    \ HTML:\n\n```\n<!DOCTYPE html>\n<script src=\"/!.js\"></script>\n```\n\nIt may\
    \ be helpful to think about it as a block of URLs that all just serve the app.\n\
    \nIf you're using Express and Node it's quite easy to do.\n\n```\napp.get('/other/thing',\
    \ function () {\n    // You could still serve other support pages\n    // and\
    \ simple things at specific URLs.\n});\n\n// But then you want some sort of catch\
    \ all that matches\n// the range of URLs you're going to want the single page\
    \ app\n// to be available at:\napp.get('*', function (req, res) {\n    res.sendFile('sameSh*t.html');\n\
    });\n```\n\nBut, of course, the same thing can be done in most any framework,\
    \ or even with an nginx config.\n\nBut the big difference is that at this point\
    \ we've made finding/fetching the right data and rendering the right view the\
    \ responsibility of the browser app, not the server."
