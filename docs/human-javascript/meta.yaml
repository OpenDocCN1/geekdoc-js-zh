  md: '# 3. Complimentary Resources


    We''ve pulled out all of our favorite tools into a toolkit we''re calling: Ampersand.js


    > "A highly modular, loosely coupled, non-frameworky framework for building advanced
    JavaScript apps."


    So there''s a lot of resources and detailed documentation there.


    +   - [http://ampersandjs.com](http://ampersandjs.com) – Human JavaScript related
    documentation site.

    - [http://tools.ampersandjs.com](http://tools.ampersandjs.com) – Fast searchable
    directory of hand-picked modules.


    # 4. Open source is a group effort


    We''re under no illusions that the approaches in here are perfect. All of the
    tools are open source and hosted on GitHub. If you would like to contribute, please
    get involved.


    # 5. Feedback on the book


    If there was anything that was unclear, incorrect, missing, or could be improved
    on the book itself, we want to hear about it from you. You can email me directly:
    henrik@andyet.net with any feedback.'
