- md: "own file and only exporting one piece of functionality. Only having a single\
    \ export helps you keep clear what purpose the module has and keeps it focused\
    \ on just that task. The goal is having lots of modules that do one thing really\
    \ well so that your app combines modules into a coherent story.\n\nWhen I'm building\
    \ an app, I intentionally have one main controller object of sorts. It's attached\
    \ to the window as `app` just for convenience. For modules that I've written specifically\
    \ for this app (stuff that's in the client folder) I allow myself the use of that\
    \ one global to perform app-level actions like navigating, etc.\n\nThe main app\
    \ object doesn't really need to be all that special. Often I create an object\
    \ literal with a main init function (more on that in Chapter 10). But generally\
    \ it will look like this:\n\n```\nmodule.exports = {\n    // Main init function\n\
    \    blastoff: function () {\n        // Attach our app object to the window\n\
    \        window.app = this;\n        // This is where we render our main view,\
    \ get some data,\n        // kick off the history tracking, etc.\n        // See\
    \ Chapter 10 for more detail.\n        ...\n    },\n\n    // Alias to Backbone.history\
    \ object so we can\n    // do app.navigate('/someother/page') from\n    // anywhere\
    \ in the app.\n    navigate: function (url) {\n        app.history.navigate(url,\
    \ true);\n    }\n};\n\n// Run our whole app, it all starts here:\nmodule.exports.blastoff();\n\
    ```\n\nNote that very last line that actually calls the `blastoff()` function.\
    \ That's how we kick off the whole thing. That's our main entry point to the app.\n\
    \n## Using events: Modules talking to modules\n\nHow do you keep your modules\
    \ cleanly separated? Sometimes modules are dependent on other modules but we still\
    \ want to be able to keep them loosely coupled? One good technique is triggering\
    \ lots of events that can be used as hooks by other code. Many of the core components\
    \ in Node are extensions of the EventEmitter class. This means you can register\
    \ handlers that get called when events happen to that object, much like you would\
    \ do in the browser when you want to register a click handler for an element on\
    \ the page.\n\nI find that developers often assume that events are kind of magical\
    \ or special things in JavaScript, but they're not. In fact, building an event\
    \ emitter from scratch is a really great learning exercise. They're really quite\
    \ simple. You're just saying: “Please call this function when this thing happens.”\
    \ Typically, you'll see code like this:\n\nIn browsers:\n\n```\ndocument.getElementById('something').addEventListener('click',\
    \ function () { ... }, false);\n```\n\nIn jQuery it looks like this:\n\n```\n\
    $('#something').click(function (event) { ... });\n// or\n$('#something').on('click',\
    \ function (event) { ... });\n```\n\nIn EventEmitter it looks like this:\n\n```\n\
    myEventEmitter.on('someEvent', function () { ... });\n```\n\nBut they all do the\
    \ same thing: they store a reference to the function you handed it (usually by\
    \ adding it to an array of functions internally). Then, when the event happens,\
    \ they call all the functions in the relevant array with information about the\
    \ event. That’s it! No magic.\n\nThis pattern is really useful when building reusable\
    \ components yourself. Exporting objects and classes that inherit from some type\
    \ of event emitter means that the code using your module can specify what they\
    \ care about, rather than the module having to know.\n\nAt points of interest\
    \ within your module where you think some external source may care, you can just\
    \ call `this.emit('someEventName', {some: 'data'})` and if there are any handlers\
    \ for that event, they'll be called.\n\nThere are lots of implementations of event\
    \ emitters with various features. Features usually involve various ways of registering\
    \ and unregistering event listeners. For example, you may want to register a handler\
    \ that only gets called the first time an event happens. So for this many event\
    \ handlers have a `once()` method alongside the `on()` method. In addition, some\
    \ event handlers give you a way to listen to all events emitted by a certain object,\
    \ or perhaps all events in a certain namespace. These features can be useful for\
    \ logging out all events (so you can debug), or for proxying events from one event\
    \ source to another object.\n\nBrowsers don’t expose a base EventEmitter class\
    \ we can just use, so for clientside code we need to include one in order to take\
    \ advantage of this pattern.\n\nWe use a slightly modified version of a really\
    \ awesome and lightweight one that was written by the LearnBoost guys: @tjholowaychuk,\
    \ @rauchg and company. It’s wildemitter on my GitHub if you’re curious.\n\nBeyond\
    \ standard `on()`, `off()` and `once()` methods it adds two main features:\n\n\
    1. Wildcard event handlers for listening to all events in an object. For example:\
    \ `emitter.on('*', function (eventName, event) { ... })` or `emitter.on('namespace*',\
    \ function (eventName, event) { ... })`.\n2. Grouped event handlers, meaning you\
    \ can specify which group the handlers are a part of when you register them and\
    \ then unregister all the handlers in the group at once:\n\n```\nvar WildEmitter\
    \ = require('wildemitter');\n\nvar emitter = new WildEmitter();\n\n// Register\
    \ one handler\nemitter.on('something', 'group1', function () { ... });\n// Register\
    \ another handler in the same group\nemitter.on('someOtherEvent', 'group1', function\
    \ () { ... });\n\n// Then release both of them\nemitter.releaseGroup('group1');\n\
    ```\n\nDetails and implementations aside the same basic concepts of adding and\
    \ removing handlers are available in all event emitters.\n\nAs an example, here’s\
    \ a simplified version of the `andbang.js` library which is an SDK for talking\
    \ to the And Bang API.\n\n```\n// Require our emitter\nvar Emitter = require('wildemitter');\n\
    \n// Our main constructor function\nvar AndBang = function (config) {\n    //\
    \ extend with emitter\n    Emitter.call(this);\n};\n\n// Inherit from emitter,\
    \ but retain constructor\nAndBang.prototype = Object.create(Emitter.prototype,\
    \ {\n    constructor: {\n        value: AndBang\n    }\n});\n\n// Other methods\n\
    AndBang.prototype.setName = function (newName) {\n    this.name = newName;\n \
    \   // We can trigger arbitrary events\n    // these are just hooks that other\n\
    \    // code could chose to listen to.\n    this.emit('nameChanged', newName);\n\
    };\n\n// Export it to the world\nmodule.exports = AndBang;\n```\n\nThen, other\
    \ code that wants to use this module can listen for events like so:\n\n```\nvar\
    \ AndBang = require('andbang');\nvar api = new AndBang();\n\n// Now this handler\
    \ will get called any time the event gets triggered\napi.on('nameChanged',  function\
    \ (newName) { /* do something cool */ });\n```\n\nThis pattern makes it easy to\
    \ expose functionality without needing overly specific knowledge about how it’s\
    \ going to be used.\n\n## Models\n\n### A simple example\n\nLet's say you have\
    \ a list of items. When a user clicks on an item, you want to visually mark it\
    \ as selected. Someone used to building simple apps would probably do something\
    \ like this:\n\n```\n// Register a click handler on the parent list\n$('ul.theList').delegate('click',\
    \ 'li', function () {\n  // Toggle a class on the clicked item\n  $(this).toggleClass('selected');\n\
    })\n```\n\nSo now, clicking on an item will toggle a class. jQuery's `toggleClass()`\
    \ method will check whether it's already got the class, and add or remove it as\
    \ necessary. Great! We're done!\n\nErr... well typically if you're going to select\
    \ something it's for a reason, right? So our app is going to want to *do* something\
    \ with the selected item or items.\n\nLet's say the user has selected several\
    \ things and now wants to delete them by clicking a delete button. No problem,\
    \ you say, we just add a button handler that find the ones with the selected class\
    \ and deletes them.\n\n```\n$('button.delete').click(function () {\n  // Get our\
    \ selectedDOM items, loop through them\n  $('ul.theList li.selected').each(function\
    \ () {\n    // But we also have to have a way to figure out what\n    // ID each\
    \ one of these things represent so we can pass\n    // the correct info to the\
    \ server. So, let's assume we use\n    // HTML5 data attributes. Luckily jQuery's\
    \ data() method\n    // reads all those and returns them as an object.\n    var\
    \ id = $(this).data('serverId');\n    var listId = $(this).data('listId');\n \
    \   $.ajax({\n      type: 'delete',\n      url: '/lists/' + listId + '/widgets/'\
    \ + id,\n      success: function () {\n        // Do something\n      },\n   \
    \   error: function () {\n        // Let the user know, somehow\n      }\n   \
    \ })\n  });\n});\n```\n\nOk, not too terrible, you say?\n\nWell now what if we've\
    \ got these additional requirements?\n\n1. There isn't just one list, there are\
    \ several on the page at once. There are some actions that can be performed in\
    \ bulk, but only for some of the items in some of the lists.\n2. There are some\
    \ items you can't delete, because you don't have permission to, but you can still\
    \ select them and annotate them.\n3. Deleting the item is only one of six different\
    \ possible actions you can take with each item.\n4. You have to support full keyboard\
    \ control, as well as handling mouse clicks.\n5. You now want to support selecting\
    \ the top item, holding shift and clicking the bottom one to select a range."
  mdcn: "\n每个文件只导出单一功能。单一导出有助于你明确模块的用途，并使其专注于该任务。目标是让大量模块各司其职，从而让应用组合成连贯的整体。\n\n构建应用时，我会有意创建一个主控制器对象。为方便起见，它通过\
    \ `app` 属性挂载到 `window` 对象上。对于专门为该应用编写的模块（位于 `client` 文件夹中的代码），我允许自己使用这个全局变量来执行应用级操作，如导航等。\n\
    \n主应用对象本身无需特殊化。通常我会创建一个对象字面量，包含一个主初始化函数（第10章将详细讲解）。其基本结构如下：\n\n```\nmodule.exports\
    \ = {\n    // 主初始化函数\n    blastoff: function () {\n        // 将应用对象挂载到 window\
    \ 上\n        window.app = this;\n        // 在此渲染主视图、获取数据、\n        // 启动历史记录追踪等\n\
    \        // 详见第10章\n        ...\n    },\n\n    // Backbone.history 的别名，便于在应用任何位置\n\
    \    // 执行 app.navigate('/someother/page')\n    navigate: function (url) {\n \
    \       app.history.navigate(url, true);\n    }\n};\n\n// 运行整个应用，一切从这里开始：\nmodule.exports.blastoff();\n\
    ```\n\n注意最后一行实际调用了 `blastoff()` 函数。这就是启动整个应用的方式，也是应用的主要入口点。\n\n## 使用事件：模块间通信\n\
    \n如何保持模块间的清晰分离？有时模块间存在依赖，但我们仍希望保持松耦合？一个很好的技巧是触发大量事件，供其他代码作为钩子使用。Node 的许多核心组件都是\
    \ `EventEmitter` 类的扩展。这意味着你可以注册处理函数，在对象发生事件时被调用，类似于在浏览器中为页面元素注册点击事件处理函数。\n\n我发现开发者常认为\
    \ JavaScript 中的事件是某种神奇或特殊的东西，但其实不然。实际上，从头构建事件发射器是很好的学习练习。它们非常简单，核心思想是：“当这件事发生时，请调用这个函数。”通常你会看到这样的代码：\n\
    \n浏览器环境：\n\n```\ndocument.getElementById('something').addEventListener('click',\
    \ function () { ... }, false);\n```\n\njQuery 中：\n\n```\n$('#something').click(function\
    \ (event) { ... });\n// 或\n$('#something').on('click', function (event) { ...\
    \ });\n```\n\nEventEmitter 中：\n\n```\nmyEventEmitter.on('someEvent', function\
    \ () { ... });\n```\n\n它们的工作原理相同：存储你传递的函数的引用（通常通过将其添加到内部函数数组实现）。当事件发生时，用事件信息调用相关数组中的所有函数。仅此而已，毫无神奇之处。\n\
    \n当你构建可复用组件时，这种模式非常有用。导出继承自某种事件发射器的对象和类，意味着使用你模块的代码可以指定关心的事件，而无需模块自身知晓。\n\n在模块中你认为外部代码可能关心的触发点，只需调用\
    \ `this.emit('someEventName', {some: 'data'})`，如果存在该事件的处理函数，它们就会被调用。\n\n事件发射器有多种实现，功能各异。主要涉及事件监听器的注册与注销方式。例如，你可能希望注册一个处理函数仅在事件首次发生时被调用，因此许多事件处理函数在\
    \ `on()` 方法外还提供了 `once()` 方法。此外，某些事件处理函数允许你监听特定对象或特定命名空间的所有事件。这些功能可用于记录所有事件（便于调试）或代理事件。\n\
    \n浏览器没有提供可直接使用的 `EventEmitter` 基类，因此客户端代码需要引入一个实现。我们使用的是经过轻微修改的 `wildemitter`（来自\
    \ LearnBoost 团队的优秀轻量级实现：@tjholowaychuk、@rauchg 等）。如果你感兴趣，可以在我的 GitHub 上找到它。\n\n\
    除了标准的 `on()`、`off()` 和 `once()` 方法外，它主要增加了两个特性：\n\n1. 通配符事件处理函数：监听对象的所有事件。例如：`emitter.on('*',\
    \ function (eventName, event) { ... })` 或 `emitter.on('namespace*', function (eventName,\
    \ event) { ... })`。\n2. 分组事件处理函数：注册时可指定处理函数所属分组，然后一次性注销整个分组的处理函数：\n\n```\nvar\
    \ WildEmitter = require('wildemitter');\n\nvar emitter = new WildEmitter();\n\n\
    // 注册一个处理函数\nemitter.on('something', 'group1', function () { ... });\n// 在同一分组注册另一个处理函数\n\
    emitter.on('someOtherEvent', 'group1', function () { ... });\n\n// 同时释放两个处理函数\n\
    emitter.releaseGroup('group1');\n```\n\n抛开具体实现细节，所有事件发射器都支持基本的处理函数添加与移除概念。\n\n\
    例如，以下是 `andbang.js` 库的简化版本，该库是用于与 And Bang API 交互的 SDK：\n\n```\n// 引入我们的发射器\n\
    var Emitter = require('wildemitter');\n\n// 主构造函数\nvar AndBang = function (config)\
    \ {\n    // 扩展发射器功能\n    Emitter.call(this);\n};\n\n// 继承发射器但保留构造函数\nAndBang.prototype\
    \ = Object.create(Emitter.prototype, {\n    constructor: {\n        value: AndBang\n\
    \    }\n});\n\n// 其他方法\nAndBang.prototype.setName = function (newName) {\n   \
    \ this.name = newName;\n    // 可以触发任意事件\n    // 这些只是其他代码可以选择监听的钩子\n    this.emit('nameChanged',\
    \ newName);\n};\n\n// 导出到全局\nmodule.exports = AndBang;\n```\n\n其他代码要使用此模块时，可以监听事件：\n\
    \n```\nvar AndBang = require('andbang');\nvar api = new AndBang();\n\n// 当事件被触发时，此处理函数将被调用\n\
    api.on('nameChanged',  function (newName) { /* 执行有趣操作 */ });\n```\n\n这种模式使得暴露功能变得简单，无需了解其具体使用方式的细节。\n\
    \n## 数据模型\n\n### 简单示例\n\n假设你有一个项目列表。当用户点击项目时，你想在视觉上标记为已选中。习惯构建简单应用的人可能会这样做：\n\n\
    ```\n// 在父列表上注册点击处理函数\n$('ul.theList').delegate('click', 'li', function () {\n\
    \  // 切换点击项目的类名\n  $(this).toggleClass('selected');\n})\n```\n\n现在点击项目会切换类名。jQuery\
    \ 的 `toggleClass()` 方法会检查是否已包含该类，必要时进行添加或移除。完成！\n\n但通常选择某个项目是有原因的，对吧？所以我们的应用需要对已选项目*进行操作*。\n\
    \n假设用户选择了多个项目，现在想通过点击删除按钮来删除它们。没问题，添加一个按钮处理函数，查找带有 `selected` 类的元素并删除它们。\n\n```\n\
    $('button.delete').click(function () {\n  // 获取已选 DOM 项目并遍历\n  $('ul.theList li.selected').each(function\
    \ () {\n    // 但我们还需要获取每个项目的 ID\n    // 以便向服务器传递正确信息\n    // 假设使用 HTML5 data 属性\n\
    \    // jQuery 的 data() 方法可以读取这些属性\n    var id = $(this).data('serverId');\n \
    \   var listId = $(this).data('listId');\n    $.ajax({\n      type: 'delete',\n\
    \      url: '/lists/' + listId + '/widgets/' + id,\n      success: function ()\
    \ {\n        // 执行操作\n      },\n      error: function () {\n        // 以某种方式通知用户\n\
    \      }\n    })\n  });\n});\n```\n\n这还不算太糟，对吧？\n\n但如果需求增加呢？\n\n1. 页面上有多个列表，而不仅是单个。某些操作可以批量执行，但仅适用于部分列表中的部分项目。\n\
    2. 某些项目无法删除（因权限不足），但仍可选择并添加注释。\n3. 删除只是每个项目可执行的六种操作之一。\n4. 必须支持完整的键盘控制，以及鼠标点击处理。\n\
    5. 现在需要支持选择顶部项目后按住 Shift 点击底部项目以选择范围。\n"
