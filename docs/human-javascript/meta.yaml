  md: '# Stop sending template engines to the browser! Here’s a retrospectively obvious
    way to create templates that happen to be 6 to 10 times faster.


    These days, more and more HTML is rendered on the client instead of sent pre-rendered
    by the server. So if you’re building a web app that uses a lot of clientside JavaScript
    you’ll doubtlessly want to create some HTML in the browser.


    # How we used to do it


    First, a bit of history. When I first wrote ICanHaz I was just trying to ease
    the pain of generating a bunch of HTML in a browser.


    Why is it a pain? Primarily because JavaScript doesn’t cleanly support multi-line
    strings, but also because there isn’t an awesome string'
  merge: -1
  pgno: 79
- img_proc: true
  md: "interpolation system built into JS.\n\nTo work around that, ICanHaz, as lots\
    \ of other template clientside template systems do, uses a hack to make it easier\
    \ to send arbitrary strings to the browser. As it turns out, browsers ignore content\
    \ in `<script>` tags if you give them a type attribute that isn’t text/javascript.\
    \ So, ICanHaz reads the content of tags on the page that say: `<script type=\"\
    text/html\">` which can contain templates, or any other multi-line strings for\
    \ that matter. So, ICanHaz will read those templates and using Jan Lehnardt’s\
    \ awesome mustache.js it turns each of them into a function that you can call\
    \ to render that string with your data mixed into it. For example:\n\nThis HTML:\n\
    \n```\n<script id=\"user\" type=\"text/html\">\n  <li>\n    <p class=\"name\"\
    >Hello my name is: {{ name }}</p>\n    <p><a href=\"http://twitter.com/{{ twitter\
    \ }}\">@{{ twitter }}</a></p>\n  </li>\n</script>\n```\n\nIs read by ICanHaz and\
    \ turned into a function you call with your own like this:\n\n```\n// Your data\n\
    var data = {\n  first_name: \"Henrik\",\n  last_name: \"Joreteg\"\n}\n\n// I can\
    \ has user??\nhtml = ich.user(data)\n```\n\nThis works pretty well and is much\
    \ cleaner than building HTML strings manually. Clearly, lots of people thought\
    \ the same as it has been quite a popular library."
  merge: -1
