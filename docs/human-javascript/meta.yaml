- md: "# Human JavaScript\n\nHenrik Joreteg\n\n## Foreword\n\nThe first thing I learned\
    \ to do with JavaScript was swapping images.\n\nIt was 1998 and that was the “state\
    \ of the art” web application programming that I had any access to. It was a time\
    \ before the web was filled with `MM_swapImage`, although I remember Dreamweaver\
    \ being around. I knew HTML back then and hacking some JavaScript was my first\
    \ foray into programming proper. The fact that the `src` of an `<img>` was something\
    \ that I could programmatically change was a profound realisation for me at the\
    \ time, although that now seems a very long time ago.\n\nMy web hacking went along\
    \ with what everybody else was doing, maybe with a delay of a year or two because\
    \ I had to wait for stuff to arrive in Germany (the Internet was very slow back\
    \ then). Netscape and IE 4 came out and brought new ways of dynamically manipulating\
    \ and animating HTML content. DHTML was born, and I tried to figure it all out\
    \ until I could swap out content with layers (layers!) and divs that worked in\
    \ *both* browsers.\n\nIt was cool to play with, but at that time building things\
    \ that worked consistently was not much fun, so I turned to the dark side and\
    \ got involved with backend web development. I could let others worry about all\
    \ the quirky browser differences. The backend is where I found my passion for\
    \ databases.\n\nBut then 2005 came around and everything changed. Google unveiled\
    \ Maps and the world was a different place. I distinctly remember, to this day,\
    \ dragging the map inside the browser window — and I still get goosebumps thinking\
    \ about it. Google Maps was the Beatles coming to America moment for the web.\n\
    \nAround the same time, 37signals came along with their web based apps for freelancers\
    \ and small businesses and not only showed the world what can be done on the web,\
    \ they started a year long discussion between supporters of what we call native\
    \ desktop apps and web apps. We now go through the same thing with native mobile\
    \ apps and the web.\n\n37signals even wrote a book about how to build a bootstrapped\
    \ business around the software as a service model that sparked a whole generation\
    \ of web app entrepreneurs who built great products that touched the world in\
    \ their own ways.\n\nTruly inspired, a friend from university and I set out to\
    \ do our own software as a service. We spent a good amount of time on it, but\
    \ ultimately, it didn't go anywhere. There were a number of issues, but my poor\
    \ understanding of frontend web technologies certainly didn't help. We managed\
    \ to build a functional prototype, but the code was a mess, bugs were impossible\
    \ to fix, new features wouldn't land, and refactoring efforts failed multiple\
    \ times until we gave up. We folded and I went back to the backend and database\
    \ side of things.\n\nFast forward to where I start Hoodie and find myself in the\
    \ company of excellent frontend developers. Now, the best I can do for the project\
    \ is build out all the backend so they don't have to worry about a thing while\
    \ they knock out the frontend.\n\nHowever, I am still longing for a deeper understanding\
    \ of the frontend world. I can dabble, but I want to be confident.\n\nComputer\
    \ science is fundamentally about building things. Unlike architecture or structural\
    \ engineering, the what, how, and why of doing our work changes on a scale of\
    \ years, if not weeks sometimes. Stuff we learned last year is proverbially obsolete\
    \ today.\n\nThe flip side of this nature is that it is very hard to build a canon.\
    \ Sure, we have algorithms and data structures as the foundations of modern teaching\
    \ and yes, they are part of everyday work, but programming and building products\
    \ is just *so much more*.\n\nIt is on us to figure how to get the missing pieces\
    \ into a curriculum that informs future generations of web developers.\n\nWhen\
    \ Henrik told me he was working on Human JavaScript I begged to be added to the\
    \ list of reviewers. Not because I thought I could point out all the places where\
    \ he is wrong, but because I am still curious about the field of frontend web\
    \ developers. I also liked the angle, thinking “I’m a human, this book is for\
    \ me!” Joking aside, technical books tend to be very dry. This one promised to\
    \ have a different approach, one that I could relate to.\n\nI read the draft in\
    \ one sitting, took lots of notes and at the end of it, this whole space of the\
    \ frontend world that wasn’t accessible to me, became clearer. I saw the necessity\
    \ for more complex MVC frameworks on the client than I had experience with. I\
    \ started to understand why structuring your code in certain ways makes it more\
    \ robust in the face of having multiple people work on it. The book managed to\
    \ illuminate well known concepts in the unfamiliar frontend territory. Human JavaScript\
    \ made frontend development accessible to me.\n\nTruly inspired again I went on\
    \ and built a small side project. It isn’t much, but it makes me excited about\
    \ building more web apps.\n\nHuman JavaScript is the collected wisdom of the team\
    \ at &yet, where Henrik works, and all the blood and sweat that goes into their\
    \ excellent client projects, and their own products. It couldn't come from a better\
    \ group of people. They care about the right technology as much as teaching it.\
    \ They take it upon themselves to fill the gaps of missing canon for web development.\n\
    \n&yet are the 37signals of our generation and I just can’t wait to see what the\
    \ people they inspire come up with. I can’t wait to see what you come up with.\n\
    \n— Jan Lehnardt\n\nBerlin, September 27th 2013\n\nJan is an Open Source Software\
    \ developer from Berlin, Germany. He is the Vice President of [Apache CouchDB](http://couchdb.apache.org/),\
    \ the database that replicates. He's the co-curator of [JSConf EU](http://2013.jsconf.eu/),\
    \ a partner at [The Node Firm](http://thenodefirm.com/) and his one famous JavaScript\
    \ project is [mustache.js](https://github.com/janl/mustache.js). He currently\
    \ works on [hood.ie](http://hood.ie/), an open source noBackend solution that\
    \ aims to do for frontend development what Rails did for the backend: make all\
    \ the tedious pain go away, and hide it behind an intuitive JavaScript API.\n\n\
    ## Acknowledgements\n\n## This Book Will Help You Build Native HTML5 Apps\n\n\
    - Realtime apps are human apps\n- Misconceptions, FUD and engineering\n- Picking\
    \ your tools\n\n## Client or server? Go big or go home.\n\n- So I didn't talk\
    \ you out of it? Ok, then go all out!\n\n## Writing code for humans.\n\n- Tools\
    \ and trickery\n- Cleverness is a double edged sword\n- Code Linting\n\n## No\
    \ more clientside spaghetti. Organizing your code.\n\n- Refactor early, refactor\
    \ often\n- Separating views and state\n- CommonJS Modules\n- Grab your moonboots\n\
    \  - A note on going to production\n  - The structure of the client folder\n-\
    \ Creating an app global\n\n## Using events: Modules talking to modules\n\n##\
    \ Models\n\n- A simple example\n  - If you continue this same approach, you're\
    \ in deep doo doo\n  - Enter Models\n- Using models for everything\n  - Applying\
    \ this approach to our widget example\n  - Model alternatives\n  - Summarizing\
    \ models\n\n## Views\n\n### Introducing AmpersandView\n\n- A Hierarchy of Views\n\
    - Caveat: understanding this.$ and this.get\n- Registering DOM event handlers\n\
    - Binding model values to templates\n- AmpersandView’s convenience methods\n-\
    \ A bit about defining bindings in templates (à la AngularJS, Ractive)\n- A note\
    \ about re-usability\n\n### Stop sending template engines to the browser! Here’s\
    \ a retrospectively obvious way to create templates that happen to be 6 to 10\
    \ times faster.\n\n- How we used to do it\n- Why that’s less-than-ideal\n- The\
    \ next iteration\n- The result\n- Can we get even faster?\n\n### Clientside routing\
    \ (if there is such a thing)\n\n- Same sh*t different URL\n- How to deal with\
    \ clientside routes\n\n### 3... 2... 1... Blastoff!\n\n### Testing and QA that\
    \ doesn’t suck (so your app won’t)\n\n- The problem/challenge of proper interface\
    \ QA\n- Meet the SpaceMonkey\n- Unit testing modules that require a browser\n\n\
    ### App settings and configuration\n\n- The problem\n- getconfig\n- clientconfig\n\
    - Using them together\n- Security caveats\n\n### Caveats/Gotchas\n\n- Function\
    \ bindings\n\n## Gotchas regarding DOM manipulation in views (they may still be\
    \ detached)\n\nFailed Ajax requests\n\n## A few closing thoughts\n\n1. We're not\
    \ done\n2. Staying up to date\n3. Complimentary Resources\n4. Open source is a\
    \ group effort\n5. Feedback on the book\n6. Thank you, thank you, thank you"
  mdcn: "\n# 人性化的 JavaScript\n\nHenrik Joreteg\n\n## 前言\n\n我学会用 JavaScript 做的第一件事是切换图片。\n\
    \n那是 1998 年，那是我所能接触到的“最先进”的网络应用编程技术。那是一个网络尚未充斥 `MM_swapImage` 的时代，不过我记得 Dreamweaver\
    \ 已经出现了。当时我懂 HTML，而捣鼓一些 JavaScript 是我第一次涉足真正的编程。当时，`<img>` 的 `src` 属性可以通过编程方式修改，这对我而言是一个深刻的领悟，尽管现在看来那似乎是很久以前的事了。\n\
    \n我的网络技术探索之路与其他人同步，可能因为我要等待东西运到德国而有一两年的延迟（那时的互联网非常慢）。Netscape 和 IE 4 发布了，带来了新的动态操作和动画化\
    \ HTML 内容的方法。DHTML 诞生了，我试图理解这一切，直到我能够用层（layers!）和 div 在*两个*浏览器中替换内容。\n\n玩这个很酷，但在那时，构建能一致运行的东西并不怎么有趣，所以我转投了“黑暗面”，参与了后端网络开发。我可以让别人去担心那些古怪的浏览器差异。在后端，我找到了自己对数据库的热情。\n\
    \n但后来，2005 年到来了，一切都变了。谷歌推出了地图，世界变得不同了。直到今天，我仍清晰地记得在浏览器窗口中拖动地图的情景——想到这个我依然会起鸡皮疙瘩。谷歌地图是网络世界的“披头士登陆美国”时刻。\n\
    \n大约在同一时期，37signals 推出了面向自由职业者和小型企业的基于网络的应用程序，不仅向世界展示了网络能做什么，还引发了我们所谓的原生桌面应用与网络应用支持者之间长达一年的讨论。我们现在正在经历原生移动应用和网络应用之间的同样的事情。\n\
    \n37signals 甚至写了一本书，讲述如何围绕软件即服务模式构建自举业务，这催生了一代网络应用企业家，他们以自己的方式构建了触及世界的产品。\n\n\
    深受启发，我和一位大学朋友着手开展我们自己的软件即服务。我们投入了大量时间，但最终，它没有成功。存在许多问题，而我对于前端网络技术理解不足肯定也没帮上忙。我们设法构建了一个功能原型，但代码一团糟，bug\
    \ 不可能修复，新功能无法实现，重构工作多次失败，直到我们放弃。我们关掉了项目，我回到了后端和数据库领域。\n\n快进到我创立 Hoodie 的时候，发现自己置身于优秀的前端开发者之中。现在，我能为这个项目做的最好的事情就是构建所有的后端，这样他们在集中精力搞定前端时，就无需担心任何事情。\n\
    \n然而，我仍然渴望更深入地理解前端世界。我可以涉猎，但我想要自信地掌握它。\n\n计算机科学从根本上说是关于构建事物。与建筑或结构工程不同，我们工作的内容、方式和原因，其变化尺度是年，有时甚至是周。我们去年学到的东西，用一句老话说，今天就过时了。\n\
    \n这种性质的另一面是，构建一个经典体系非常困难。当然，我们有算法和数据结构作为现代教学的基础，而且它们确实是日常工作的组成部分，但编程和构建产品*远不止*于此。\n\
    \n我们有责任弄清楚如何将缺失的部分纳入课程体系，以培养未来的网络开发者。\n\n当 Henrik 告诉我他正在写《人性化的 JavaScript》时，我恳求被加入评审名单。不是因为我认为我能指出他所有错误的地方，而是因为我仍然对前端网络开发者这个领域充满好奇。我也喜欢这个角度，想着“我是个人类，这本书就是为我写的！”开个玩笑，技术书籍往往非常枯燥。而这本承诺采用不同的方法，一种我能产生共鸣的方法。\n\
    \n我一口气读完了初稿，做了很多笔记，读完之后，对我来说一直无法触及的整个前端世界，变得清晰了。我看到了客户端上比我所经历过的更复杂的 MVC 框架的必要性。我开始理解为什么以特定方式组织代码，能使其在多人协作时更具健壮性。这本书成功地在陌生的前端领域阐明了众所周知的概念。《人性化的\
    \ JavaScript》让我能够接触到前端开发。\n\n再次深受启发，我接着做了一个小的副项目。它虽然没什么大不了的，但它让我对构建更多网络应用感到兴奋。\n\
    \n《人性化的 JavaScript》是 &yet（Henrik 工作的公司）团队的智慧结晶，是他们投入到优秀客户项目和自身产品中的所有心血和汗水。没有比他们更好的一群人了。他们既关心正确的技术，也关心如何教授它。他们自觉承担起填补网络开发经典体系缺失的空白。\n\
    \n&yet 是我们这一代的 37signals，我迫不及待地想看看他们激励的人会创造出什么。我迫不及待地想看看你会创造出什么。\n\n— Jan Lehnardt\n\
    柏林，2013年9月27日\n\nJan 是来自德国柏林的开源软件开发者。他是 [Apache CouchDB](http://couchdb.apache.org/)（可复制的数据库）的副主席。他是\
    \ [JSConf EU](http://2013.jsconf.eu/) 的联合策展人，[The Node Firm](http://thenodefirm.com/)\
    \ 的合伙人，他著名的一个 JavaScript 项目是 [mustache.js](https://github.com/janl/mustache.js)。他目前从事\
    \ [hood.ie](http://hood.ie/) 的工作，这是一个开源的无后端解决方案，旨在为前端开发做 Rails 为后端所做的事情：消除所有繁琐的痛苦，并将其隐藏在一个直观的\
    \ JavaScript API 后面。\n\n## 致谢\n\n## 本书将帮助你构建原生 HTML5 应用\n\n- 实时应用就是人性化的应用\n- 误解、恐惧和工程学\n\
    - 选择你的工具\n\n## 客户端还是服务器端？全力以赴还是回家。\n\n- 所以我没能说服你放弃？好吧，那就全力以赴！\n\n## 为人类编写代码。\n\
    \n- 工具和技巧\n- 聪明是双刃剑\n- 代码检查\n\n## 告别客户端意大利面条式代码。组织你的代码。\n\n- 尽早重构，经常重构\n- 分离视图和状态\n\
    - CommonJS 模块\n- 穿上你的月球靴\n  - 关于投入生产的说明\n  - 客户端文件夹的结构\n- 创建一个应用全局变量\n\n## 使用事件：模块之间的通信\n\
    \n## 模型\n\n- 一个简单的例子\n  - 如果你继续这种方法，你会陷入大麻烦\n  - 引入模型\n- 将模型用于一切\n  - 将此方法应用于我们的小部件示例\n\
    \  - 模型的替代方案\n  - 总结模型\n\n## 视图\n\n### 介绍 AmpersandView\n\n- 视图的层级结构\n- 注意：理解\
    \ this.$ 和 this.get\n- 注册 DOM 事件处理器\n- 将模型值绑定到模板\n- AmpersandView 的便捷方法\n- 关于在模板中定义绑定（类似于\
    \ AngularJS，Ractive）的说明\n- 关于可重用性的说明\n\n### 停止将模板引擎发送到浏览器！这是一个事后看来显而易见的创建模板的方法，而且速度要快\
    \ 6 到 10 倍。\n\n- 我们过去的做法\n- 为什么那不理想\n- 下一次迭代\n- 结果\n- 我们能更快吗？\n\n### 客户端路由（如果存在的话）\n\
    \n- 同样的垃圾，不同的 URL\n- 如何处理客户端路由\n\n### 3... 2... 1... 发射！\n\n### 不糟糕的测试和质量保证（这样你的应用也不会糟糕）\n\
    \n- 正确界面质量保证的问题/挑战\n- 认识 SpaceMonkey\n- 测试需要浏览器的模块\n\n### 应用设置和配置\n\n- 问题\n- getconfig\n\
    - clientconfig\n- 结合使用它们\n- 安全注意事项\n\n### 注意事项/陷阱\n\n- 函数绑定\n\n## 关于视图中 DOM 操作的注意事项（它们可能仍然处于分离状态）\n\
    \n失败的 Ajax 请求\n\n## 一些结束语\n\n1. 我们还没完成\n2. 保持更新\n3. 补充资源\n4. 开源是团队努力的结果\n5. 关于本书的反馈\n\
    6. 谢谢，谢谢，谢谢\n"
