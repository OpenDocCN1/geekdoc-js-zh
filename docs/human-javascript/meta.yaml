    to declare too much of your app logic in your HTML (no AngularJS, sorry). Having
    to write application logic inside of a template feels like a violation of separation
    of concerns. It has some short-term payoffs and can make simple things really
    easy. However, when you want more control it can be difficult to do within the
    constraints of the framework.

