  md: '# # Why that’s less-than-ideal


    It totally works, but if you think about it, it’s a bit silly. We’re making the
    client do a bunch of extra parsing and compiling that we could actually just do
    ahead of time. Of course, doing the parsing and compiling in the browser *also*
    means that we’re having to send the browser a whole template engine that can parse
    and compile templates.


    # ## The next iteration


    What I finally realized is that all you actually want when doing templating on
    the client is the end result that ICanHaz gives you: a function that you call
    with your data that returns your HTML.


    Typically, smart template engines, like the newer versions of mustache.js, do
    this for you. Once the template has been read, it gets compiled into a function
    that is cached and used for subsequent rendering of that same template.


    Thinking about this left me wondering, why don’t we just send the JavaScript template
    function to the client instead of doing all the template parsing/compiling on
    the client?


    Well, frankly, because I didn’t know of a great way to do it.


    I started looking around and realized that [Jade](https://jade-lang.com/) (which
    we already use quite a bit at &yet) has support for compiling as a separate process
    and, in combination with a small little runtime snippet, this lets you create
    JS functions that only require a small runtime and not the whole template'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'engine to render. Which is totally awesome!


    So, to make it easier to work with, I wrote a little tool: [templatizer](https://github.com/colinwren/templatizer)
    that you can run on the server-side (using Node) to take a folder full of Jade
    templates and turn them into a JavaScript module that you can include in your
    app and contains a function for each template file. Each template function simply
    takes a context object and returns a string with those values inserted.


    # The result


    From my tests the actual rendering of templates is **6 to 10 times faster**. In
    addition you''re sending *way* less code to the browser (because you''re not sending
    a whole templating engine) and you''re not making the browser do a bunch of work
    you could have already done ahead of time.


    # Can we get even faster?


    Possibly. Once you''re in a browser it''s faster to build DOM elements with DOM
    methods than by sending HTML strings that have to be interpolated with values
    and then parsed by the browser to create DOM elements.


    These days we''re seeing more template languages that compile to DOM methods instead
    to get that extra performance boost.


    The trade-off is not being able to use those same compiled templates on the server-side
    (where there is no DOM) without shimming a bunch of DOM methods.'
