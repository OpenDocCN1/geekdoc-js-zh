- "# JavaScript 精粹 第3版\n\n\n\n![](img/9781593279516.jpg)\n\n![Image](img/9781593279516.jpg)\n\
  \n对《JavaScript 编程精解》第一版和第二版的赞誉\n\n“这是我读过的最好的编程概念解释之一。”\n\n—桑德拉·亨利-斯托克，IT World\n\
  \n“如果你选择用这本书开始你的 JavaScript 之旅，它能快速教会你大量技术知识以及编程智慧。”\n\n—迈克尔·J·罗斯，Web 开发者及 Slashdot\
  \ 贡献者\n\n“因为这本书，我成为了更好的架构师、作者、导师和开发者。它值得与 Flannagan 和 Crockford 的作品并列书架。”\n\n—安格斯·克罗尔，Twitter\
  \ 开发者\n\n“对任何编程语言乃至整个编程领域的最佳入门介绍。句号。”\n\n—扬·莱恩哈特，Hoodie 联合创始人及 JSCONF EU 组织者\n\n\
  “当人们问我如何学习真正的 JavaScript 时，我会把这本书给他们。”\n\n—克里斯·威廉姆斯，JSCONF US 组织者\n\n“这是我读过的最好的\
  \ JavaScript 书籍之一。”\n\n—雷·班戈，jQuery 团队成员及微软客户端 Web 社区项目经理\n\n“一本非常好的 JavaScript\
  \ 指南；但不仅如此，这本书还是一本出色的编程指南。”\n\n—本·纳德尔，Epicenter Consulting 首席软件工程师\n\n“一本好书，适合没有\
  \ JavaScript 经验甚至没有编程经验的人。”\n\n—尼古拉斯·扎卡斯，《高性能 JavaScript》和《面向对象的 JavaScript》作者\n\
  \n“如果你是 JavaScript 新手，我首先推荐你访问《JavaScript 编程精解》，看看 Marijn Haverbeke 对这门语言的介绍。”\n\
  \n—CNET UK\n\n\n\n献给洛特和扬\n\n“我们以为我们是在为自己的目的创造系统。我们相信我们是在按照自己的形象制造它……但计算机并不真正像我们。它只是我们自身极微小一部分的投影：那部分致力于逻辑、秩序、规则和清晰。”\n\
  \n—— 埃伦·厄尔曼，*贴近机器：技术狂热及其不满*\n\n![Image](img/f0000-01.jpg)\n\n## 引言\n\n这是一本关于指令计算机的书。如今计算机和螺丝刀一样常见，但它们要复杂得多，要让它们按你的意愿行事并不总是那么容易。\n\
  \n如果你的计算机任务是一个常见且易于理解的任务，比如查看电子邮件或充当计算器，你可以打开相应的应用程序并开始工作。但对于独特或开放式的任务，可能没有现成的应用程序。\n\
  \n这时编程就派上用场了。*编程*是构建*程序*的行为——一组精确的指令，告诉计算机该做什么。由于计算机是愚蠢、迂腐的野兽，编程从根本上来说是繁琐且令人沮丧的。\n\
  \n幸运的是，如果你能克服这一点，甚至享受以笨机器能理解的方式进行严谨思考，编程会带来回报。它让你在几秒钟内完成手工需要*永远*才能完成的事情。它能让你的计算机工具做以前做不到的事情。并且它提供了极好的抽象思维训练。\n\
  \n大多数编程是用编程语言完成的。*编程语言*是一种人工构造的语言，用于指令计算机。有趣的是，我们发现与计算机通信的最有效方式在很大程度上借鉴了人类相互交流的方式。像人类语言一样，计算机语言允许以新的方式组合单词和短语，从而能够表达不断涌现的新概念。\n\
  \n曾几何时，基于语言的界面，如 20 世纪 80 年代和 90 年代的 BASIC 和 DOS 提示符，是与计算机交互的主要方式。它们很大程度上已被视觉界面取代，视觉界面更容易学习，但提供的自由度更少。计算机语言仍然存在，只要你知道去哪里找。其中一种语言\
  \ JavaScript 内置于每个现代网络浏览器中，因此几乎在每个设备上都可用。\n\n本书将努力让你熟悉这门语言，以便用它做有用且有趣的事情。\n\n###\
  \ 关于编程\n\n除了解释 JavaScript，我还会介绍编程的基本原则。事实证明，编程很难。基本规则简单明了，但基于这些规则构建的程序往往会变得足够复杂，从而引入自身的规则和复杂性。从某种意义上说，你是在建造自己的迷宫，而且可能会迷失其中。\n\
  \n有时阅读这本书会感到非常沮丧。如果你是编程新手，会有大量新内容需要消化。其中许多内容还会以需要你建立额外联系的方式*组合*起来。\n\n你需要付出必要的努力。当你难以跟上本书时，不要对自己的能力妄下结论。你没问题——你只需要坚持下去。休息一下，重读一些材料，确保你阅读并理解了示例程序和练习。学习是艰苦的工作，但你学到的一切都是你的，并且会让后续学习更容易。\n\
  \n当行动变得无利可图时，收集信息；\n当信息变得无利可图时，睡觉。\n\n——厄休拉·K·勒古恩，*黑暗的左手*\n\n程序是多方面的。它是程序员输入的一段文本，是让计算机执行其操作的指挥力量，是计算机内存中的数据，同时又控制着对同一内存执行的操作。试图将程序与我们熟悉的物体进行类比往往不够贴切。一个表面上合适的类比是机器——通常涉及许多独立部件，为了让整个机器运转，我们必须考虑这些部件如何相互连接并共同作用于整体运作。\n\
  \n计算机是一台物理机器，充当这些非物质机器的宿主。计算机本身只能做愚蠢而直接的事情。它们之所以如此有用，是因为它们以难以置信的高速完成这些事情。程序可以巧妙地将大量这些简单动作组合起来，完成非常复杂的事情。\n\
  \n程序是思想的建筑。它建造起来没有成本，没有重量，而且在我们打字的手指下轻松生长。\n\n但如果不加注意，程序的规模和复杂性会失控，甚至让创建者感到困惑。控制程序是编程的主要问题。当一个程序正常工作时，它是美丽的。编程的艺术是控制复杂性的技能。伟大的程序是克制的——在复杂性中变得简单。\n\
  \n一些程序员认为，最好通过在程序中只使用一小套经过充分理解的技术来管理这种复杂性。他们制定了严格的规则（“最佳实践”），规定了程序应有的形式，并小心翼翼地待在自己安全的小区域内。\n\
  \n这不仅无聊，而且无效。新问题往往需要新解决方案。编程领域还很年轻，仍在快速发展，并且足够多样化，可以容纳截然不同的方法。在程序设计中可能会犯许多可怕的错误，你应该去犯这些错误，以便理解它们。对好程序样子的感觉是在实践中培养出来的，而不是从规则列表中学会的。\n\
  \n### 为什么语言重要\n\n起初，在计算机诞生之初，没有编程语言。程序看起来像这样：\n\n```\n00110001   00000000   00000000\n\
  00110001   00000001   00000001\n00110011   00000001   00000010\n01010001   00001011   00000010\n\
  00100010   00000010   00001000\n01000011   00000001   00000000\n01000001   00000001   00000001\n\
  00010000   00000010   00000000\n01100010   00000000   00000000\n```\n\n\n\n这是一个将数字\
  \ 1 到 10 相加并输出结果的程序：1 + 2 + ... + 10 = 55。它可以在一个简单的假想机器上运行。为了给早期计算机编程，必须将大量开关设置到正确位置，或者在纸板上打孔并将它们送入计算机。你大概可以想象这个过程是多么繁琐且容易出错。即使是编写简单的程序也需要大量的巧思和严谨。复杂的程序几乎无法想象。\n\
  \n当然，手动输入这些神秘的比特模式（0 和 1）确实让程序员有一种成为强大巫师的感觉。这在工作满意度方面肯定是有价值的。\n\n前面程序的每一行都包含一条指令。用英文可以这样写：\n\
  \n1.  将数字 0 存储到内存位置 0。\n2.  将数字 1 存储到内存位置 1。\n3.  将内存位置 1 的值存储到内存位置 2。\n4.  从内存位置\
  \ 2 的值中减去数字 11。\n5.  如果内存位置 2 的值是数字 0，则继续执行指令 9。\n6.  将内存位置 1 的值加到内存位置 0。\n7.  将数字\
  \ 1 加到内存位置 1 的值上。\n8.  继续执行指令 3。\n9.  输出内存位置 0 的值。\n\n虽然这已经比那一堆比特更易读了，但仍然相当晦涩。为指令和内存位置使用名称而不是数字会有所帮助。\n\
  \n将 `total` 设为 0。\n\n将 `count` 设为 1。\n\n`[loop]`\n\n将 `compare` 设为 `count`。\n\n\
  从 `compare` 中减去 11。\n\n如果 `compare` 为零，则继续执行 `[end]`。\n\n将 `count` 加到 `total`。\n\
  \n将 `count` 加 1。\n\n继续执行 `[loop]`。\n\n`[end]`\n\n输出 `total`。\n\n现在你能看出程序是如何工作的吗？前两行给两个内存位置赋予了初始值：`total`\
  \ 将用于累加计算结果，`count` 将记录当前正在处理的数字。使用 `compare` 的那几行可能是最奇怪的。程序想要检查 `count` 是否等于 11，以决定是否停止运行。由于我们的假想机器相当原始，它只能测试一个数字是否为零，并据此做出决策。因此，它使用标记为\
  \ `compare` 的内存位置来计算 `count - 11` 的值，并基于该值做出决策。接下来的两行将 `count` 的值加到结果中，并在程序判定 `count`\
  \ 尚未达到 11 时，每次将 `count` 增加 1。\n\n以下是相同的 JavaScript 程序：\n\n```\nlet total = 0, count\
  \ = 1;\nwhile (count <= 10) {\n  total += count;\n  count += 1;\n}\nconsole.log(total);\n\
  // → 55\n```\n\n这个版本给我们带来了一些改进。最重要的是，不再需要指定程序如何来回跳转的方式。`while` 结构负责处理这一点。只要给定的条件成立，它就会继续执行下面的块（用花括号括起来）。这个条件是\
  \ `count <= 10`，意思是“`count` 小于或等于 10”。我们不再需要创建一个临时值并将其与零比较，这只是一个无关紧要的细节。编程语言的部分力量在于它们可以为我们处理这些无关紧要的细节。\n\
  \n在程序末尾，`while` 结构执行完毕后，使用 `console.log` 操作输出结果。\n\n最后，如果我们碰巧有方便的操作 `range` 和 `sum`\
  \ 可用，它们分别用于创建一个范围内的数字集合和计算数字集合的总和，那么程序可能看起来像这样：\n\n```\nconsole.log(sum(range(1,\
  \ 10)));\n// → 55\n```\n\n这个故事告诉我们，同一个程序可以用冗长或简短、难以阅读或易于阅读的方式表达。程序的第一个版本极其晦涩，而最后一个版本几乎就是英语：输出从\
  \ 1 到 10 的数字范围的总和。（我们将在后面的章节中看到如何定义像 `sum` 和 `range` 这样的操作。）\n\n一个好的编程语言通过允许程序员在更高层次上描述计算机必须执行的操作来帮助他们。它有助于省略细节，提供方便的构建块（如\
  \ `while` 和 `console.log`），允许你定义自己的构建块（如 `sum` 和 `range`），并使这些块易于组合。\n\n### 什么是\
  \ JavaScript？\n\nJavaScript 于 1995 年推出，作为一种在 Netscape Navigator 浏览器中向网页添加程序的方式。此后，该语言已被所有其他主要图形化网页浏览器采用。它使现代网络应用成为可能——这些应用允许你直接与之交互，而无需每次操作都重新加载页面。JavaScript\
  \ 也用于更传统的网站，以提供各种形式的交互性和巧妙功能。\n\n需要注意的是，JavaScript 与名为 Java 的编程语言几乎没有任何关系。相似的名称是出于营销考虑而非明智判断。在\
  \ JavaScript 推出时，Java 语言正在被大力推广并逐渐流行。有人认为借助这股成功浪潮是个好主意。于是我们就有了这个名字。\n\n在 Netscape\
  \ 之外被采用后，人们编写了一份标准文档来描述 JavaScript 语言的工作方式，以便那些声称支持 JavaScript 的各种软件实际上是在谈论同一种语言。这被称为\
  \ ECMAScript 标准，以进行标准化的 Ecma International 组织命名。实际上，术语 ECMAScript 和 JavaScript 可以互换使用——它们是同一种语言的两个名称。\n\
  \n有些人会对 JavaScript 说一些*可怕*的话。其中很多都是真的。当我第一次被要求用 JavaScript 写点东西时，我很快就讨厌它了。它几乎接受我输入的任何内容，但解释方式却与我的本意完全不同。当然，这很大程度上是因为我根本不知道自己在做什么，但这里确实存在一个问题：JavaScript\
  \ 在允许的内容上过于宽松。这种设计背后的想法是让初学者更容易用 JavaScript 编程。实际上，这主要使得在程序中查找问题变得更加困难，因为系统不会向你指出它们。\n\
  \n不过，这种灵活性也有其优势。它为许多在更严格的语言中无法实现的技术留下了空间，而且正如你将看到的（例如在第 10 章中），它可以用来克服 JavaScript\
  \ 的一些缺点。在正确学习该语言并与之合作一段时间后，我学会了真正*喜欢* JavaScript。\n\nJavaScript 有几个版本。ECMAScript\
  \ 第 3 版是 JavaScript 崛起并占据主导地位期间（大约在 2000 年至 2010 年之间）广泛支持的版本。在此期间，一个雄心勃勃的第 4 版正在开发中，计划对语言进行许多根本性的改进和扩展。以如此激进的方式改变一种活跃且广泛使用的语言在政治上变得困难，第\
  \ 4 版的工作于 2008 年放弃，导致了一个远没有那么雄心勃勃的第 5 版。第 5 版于 2009 年发布，只进行了一些无争议的改进。然后在 2015 年，第\
  \ 6 版发布，这是一次重大更新，包含了第 4 版计划中的一些想法。从那以后，我们每年都有新的小更新。\n\n语言在不断演变意味着浏览器必须不断跟上，如果你使用的是较旧的浏览器，它可能不支持所有功能。语言设计者谨慎地避免做出任何可能破坏现有程序的更改，因此新浏览器仍然可以运行旧程序。在本书中，我使用的是\
  \ 2017 版本的 JavaScript。\n\n\n\nWeb 浏览器并非 JavaScript 唯一运行的平台。某些数据库，如 MongoDB 和 CouchDB，将\
  \ JavaScript 用作其脚本和查询语言。多个桌面和服务器编程平台，最著名的是 Node.js 项目（第 20 章的主题），为在浏览器之外进行 JavaScript\
  \ 编程提供了环境。\n\n### 代码及其用途\n\n*代码*是构成程序的文本。本书大部分章节都包含大量代码。我相信阅读代码和编写代码是学习编程不可或缺的部分。不要只是匆匆浏览示例——请仔细阅读并理解它们。起初这可能会很慢且令人困惑，但我保证你很快就能掌握要领。练习也是如此。除非你真正编写出一个可行的解决方案，否则不要以为自己已经理解了。\n\
  \n我建议你在实际的 JavaScript 解释器中尝试练习的解决方案。这样，你就能立即得到反馈，了解自己正在做的事情是否有效，并且我希望你会受到诱惑去尝试并超越练习本身。\n\
  \n运行本书示例代码并进行实验的最简单方法是查阅本书的在线版本，网址为 *[`eloquentjavascript.net`](https://eloquentjavascript.net)*。在那里，你可以点击任何代码示例进行编辑和运行，并查看其输出结果。要完成练习，请访问\
  \ *[`eloquentjavascript.net/code`](https://eloquentjavascript.net/code)*，该网站为每个编程练习提供了起始代码，并允许你查看解决方案。\n\
  \n如果你想在本书网站之外运行本书中定义的程序，则需要多加小心。许多示例是独立的，应该能在任何 JavaScript 环境中运行。但后面章节中的代码通常是为特定环境（浏览器或\
  \ Node.js）编写的，只能在该环境中运行。此外，许多章节定义了较大的程序，其中出现的代码片段相互依赖或依赖外部文件。网站上的沙盒提供了指向 Zip 文件的链接，其中包含运行特定章节代码所需的所有脚本和数据文件。\n\
  \n### 本书概述\n\n本书包含三个部分。前 12 章讨论 JavaScript 语言。接下来的七章介绍 Web 浏览器以及如何使用 JavaScript\
  \ 对其进行编程。最后两章专门介绍 Node.js，这是另一种 JavaScript 编程环境。\n\n全书共有五个*项目章节*，描述了较大的示例程序，让你体验实际编程。按出现顺序，我们将构建一个送货机器人、一种编程语言、一个平台游戏、一个像素画图程序和一个动态网站。\n\
  \n本书的语言部分从四章开始，介绍 JavaScript 语言的基本结构。它们介绍了控制结构（例如你在本引言中看到的 `while` 关键字）、函数（编写你自己的构建块）和数据结构。之后，你将能够编写基本程序。接下来，第\
  \ 5 章和第 6 章介绍了使用函数和对象编写更*抽象*代码并控制复杂性的技术。\n\n在第一个项目章节之后，本书的语言部分继续介绍错误处理和 bug 修复、正则表达式（处理文本的重要工具）、模块化（对抗复杂性的另一种手段）以及异步编程（处理需要时间的事件）。第二个项目章节结束了本书的第一部分。\n\
  \n第二部分，第 13 章到第 19 章，描述了浏览器 JavaScript 可以使用的工具。你将学习在屏幕上显示内容（第 14 章和第 17 章）、响应用户输入（第\
  \ 15 章）以及通过网络通信（第 18 章）。这部分又有两个项目章节。\n\n之后，第 20 章介绍了 Node.js，第 21 章使用该工具构建了一个小型网站。\n\
  \n最后，第 22 章描述了在优化 JavaScript 程序速度时出现的一些考虑因素。\n\n### 排版约定\n\n在本书中，等宽字体书写的文本将表示程序的元素——有时它们是独立的片段，有时它们仅指附近程序的一部分。程序（你已经看到了一些）的书写方式如下：\n\
  \n```\nfunction factorial(n) {\n  if (n == 0) {\n    return 1;\n  } else {\n   \
  \ return factorial(n - 1) * n;\n  }\n}\n```\n\n有时，为了显示程序产生的输出，预期输出会写在程序之后，前面带有两个斜杠和一个箭头。\n\
  \n```\nconsole.log(factorial(8));\n// → 40320\n```\n\n祝你好运！\n\n# 第一部分\n\n# 语言\n\n\
  “在机器的表面之下，程序在运行。它毫不费力地伸缩。在伟大的和谐中，电子散射并重组。显示器上的形态不过是水面的涟漪。本质始终无形地潜藏于下。”\n\n—— 袁马大师，《编程之书》\n\
  \n![Image](img/f0010-01.jpg)\n\n## 1\n\n值、类型和运算符\n\n在计算机的世界里，只有数据。你可以读取数据、修改数据、创建新数据——但那些不是数据的东西则无法提及。所有这些数据都以长串的比特形式存储，因此本质上是相似的。\n\
  \n*比特*是任何具有两种值的事物，通常描述为 0 和 1。在计算机内部，它们表现为高或低的电荷、强或弱的信号，或者 CD 表面上的亮点或暗点。任何离散信息都可以简化为\
  \ 0 和 1 的序列，从而用比特表示。\n\n例如，我们可以用比特表示数字 13。其原理与十进制数字相同，但你不是有 10 个不同的数字，而是只有 2 个，并且从右到左每个数字的权重乘以\
  \ 2。以下是组成数字 13 的比特，其数字权重显示在下方：\n\n```\n  0    0    0    0   1   1   0   1\n128 \
  \  64   32   16   8   4   2   1\n```\n\n所以这就是二进制数 00001101。其非零数字代表 8、4 和 1，加起来等于\
  \ 13。\n\n### 值\n\n想象一片比特的海洋——一片浩瀚的比特之海。一台典型的现代计算机在其易失性数据存储（工作内存）中拥有超过 300 亿个比特。非易失性存储（硬盘或类似设备）通常还要多几个数量级。\n\
  \n为了能够处理如此大量的比特而不迷失方向，我们必须将它们分成代表信息片段的块。在 JavaScript 环境中，这些块被称为*值*。尽管所有值都由比特组成，但它们扮演着不同的角色。每个值都有一个决定其角色的类型。有些值是数字，有些值是文本片段，有些值是函数，等等。\n\
  \n要创建一个值，你只需调用它的名字。这很方便。你不需要为你的值收集建筑材料或付费。你只需召唤一个，然后“嗖”的一声，你就拥有了它。当然，它们并非真的凭空产生。每个值都必须存储在某个地方，如果你同时使用大量的值，可能会耗尽内存。幸运的是，只有当你同时需要它们时，这才是一个问题。一旦你不再使用某个值，它就会消散，留下它的比特被回收，作为下一代值的建筑材料。\n\
  \n本章介绍 JavaScript 程序的原子元素，即简单的值类型以及可以对这些值进行操作的运算符。\n\n### 数字\n\n*数字*类型的值，毫不意外，就是数值。在\
  \ JavaScript 程序中，它们书写如下：\n\n```\n13\n```\n\n\n\n\n在程序中使用它，会导致数字 13 的位模式出现在计算机内存中。\n\
  \nJavaScript 使用固定数量的位（64 位）来存储单个数值。64 位只能产生有限数量的模式，这意味着可以表示的不同数字的数量是有限的。用 `N` 个十进制数字，你可以表示\
  \ `10^N` 个数。类似地，给定 64 个二进制位，你可以表示 2⁶⁴ 个不同的数，大约是 18 京（18 后面跟 18 个零）。这已经很多了。\n\n计算机内存曾经小得多，人们倾向于使用\
  \ 8 位或 16 位组来表示数字。很容易意外地*溢出*这样小的数字——最终得到一个无法放入给定位数中的数字。如今，即使是能放进口袋的计算机也有足够的内存，所以你可以自由使用\
  \ 64 位块，只有在处理真正天文数字时才需要担心溢出问题。\n\n不过，并非所有小于 18 京的整数都能放入 JavaScript 数字中。这些位还要存储负数，因此有一位表示数字的符号。更大的问题是还必须表示非整数。为此，一些位用于存储小数点的位置。实际能存储的最大整数大约在\
  \ 9 千兆（15 个零）的范围内——这仍然大得令人愉快。\n\n分数数字用点号书写。\n\n`9.81`\n\n对于非常大或非常小的数字，你还可以使用科学记数法，添加一个\
  \ `e`（代表*指数*），后跟数字的指数。\n\n`2.998e8`\n\n即 2.998 × 10⁸ = 299,800,000。\n\n对小于上述 9 千兆的整数（也称为*整数*）进行计算，保证始终精确。遗憾的是，对分数数字的计算通常不精确。就像\
  \ `π`（圆周率）无法用有限位十进制数字精确表示一样，许多数字在只有 64 位可用时也会损失一些精度。这很遗憾，但只在特定情况下才会引起实际问题。重要的是要意识到这一点，并将分数数字视为近似值，而非精确值。\n\
  \n#### 算术\n\n数字的主要用途是算术。算术运算（如加法或乘法）接受两个数值，并从中产生一个新数值。在 JavaScript 中它们是这样的：\n\n\
  `100 + 4 * 11`\n\n`+` 和 `*` 符号被称为*运算符*。前者代表加法，后者代表乘法。将运算符放在两个值之间，就会对这两个值应用该运算符并产生一个新值。\n\
  \n但上面的例子是表示“将 4 和 100 相加，然后将结果乘以 11”，还是先做乘法再做加法？你可能已经猜到，乘法先进行。但和数学中一样，你可以通过将加法括在括号中来改变顺序。\n\
  \n`(100 + 4) * 11`\n\n对于减法，有 `-` 运算符；除法可以用 `/` 运算符。\n\n当运算符一起出现而没有括号时，它们的应用顺序由运算符的*优先级*决定。上面的例子显示乘法优先于加法。`/`\
  \ 运算符与 `*` 具有相同的优先级。`+` 和 `-` 也是如此。当多个相同优先级的运算符相邻出现时，例如 `1 - 2 + 1`，它们从左到右应用：`(1\
  \ - 2) + 1`。\n\n这些优先级规则你不必担心。有疑问时，只需添加括号即可。\n\n还有一个算术运算符，你可能不会立刻认出。`%` 符号用于表示*取余*运算。`X\
  \ % Y` 是 X 除以 Y 的余数。例如，`314 % 100` 得到 14，`144 % 12` 得到 0。取余运算符的优先级与乘法和除法相同。你也会经常看到这个运算符被称为*模运算*。\n\
  \n#### 特殊数字\n\nJavaScript 中有三个特殊值，它们被视为数字，但行为与普通数字不同。\n\n前两个是 `Infinity` 和 `-Infinity`，分别代表正无穷和负无穷。`Infinity\
  \ - 1` 仍然是 `Infinity`，以此类推。不过，不要过于信任基于无穷的计算。它在数学上不严谨，并且会很快导致下一个特殊数字：`NaN`。\n\n`NaN`\
  \ 代表“不是数字”（not a number），尽管它*是*数字类型的一个值。当你尝试计算 `0 / 0`（零除以零）、`Infinity - Infinity`\
  \ 或任何其他没有有意义结果的数值运算时，就会得到这个结果。\n\n### 字符串\n\n下一个基本数据类型是*字符串*。字符串用于表示文本。它们通过将内容括在引号中来书写。\n\
  \n`Down on the sea`   \n`\"Lie on the ocean\"`  \n`'Float on the ocean'`\n\n你可以使用单引号、双引号或反引号来标记字符串，只要字符串开头和结尾的引号匹配即可。\n\
  \n几乎任何内容都可以放在引号之间，JavaScript 会将其转换为字符串值。但有些字符比较麻烦。你可以想象在引号内再放引号会有多难。*换行符*（按下 ENTER\
  \ 键得到的字符）只有在字符串用反引号（`` ` ``）括起来时才能不加转义地包含。\n\n为了能够将这类字符包含在字符串中，使用了以下表示法：每当在引号文本中发现反斜杠（`\\\
  `）时，它表示后面的字符具有特殊含义。这被称为*转义*该字符。前面有反斜杠的引号不会结束字符串，而是成为字符串的一部分。当反斜杠后面跟着 `n` 字符时，它被解释为换行符。类似地，反斜杠后的\
  \ `t` 表示制表符。请看下面的字符串：\n\n`\"This is the first line\\nAnd this is the second\"`\n\
  \n实际包含的文本是：\n\nThis is the first line\n\nAnd this is the second\n\n当然，有些情况下你希望字符串中的反斜杠只是一个反斜杠，而不是特殊代码。如果两个反斜杠连续出现，它们会合并，最终字符串值中只留下一个。这就是字符串\
  \ `\"A newline character is written like \\\"\\\\n\\\".\"` 的表达方式：\n\n`\"A newline\
  \ character is written like \\\"\\\\n\\\".\"`\n\n字符串也必须建模为一系列位才能存在于计算机中。JavaScript\
  \ 的做法基于 *Unicode* 标准。该标准为几乎所有你可能需要的字符分配了一个数字，包括希腊语、阿拉伯语、日语、亚美尼亚语等字符。如果我们为每个字符都有一个数字，那么字符串就可以用一系列数字来描述。\n\
  \nJavaScript 正是这样做的。但有一个复杂之处：JavaScript 的表示法每个字符串元素使用 16 位，这可以描述多达 2¹⁶ 个不同的字符。但\
  \ Unicode 定义的字符比这更多——目前大约多一倍。因此，某些字符（例如许多表情符号）在 JavaScript 字符串中占据两个“字符位置”。我们将在第\
  \ 92 页的“字符串与字符编码”中回到这一点。\n\n字符串不能进行除法、乘法或减法，但 `+` 运算符*可以*用于它们。它不做加法，而是*拼接*——将两个字符串粘在一起。下面这行将产生字符串\
  \ `\"concatenate\"`：\n\n`\"con\" + \"cat\" + \"e\" + \"nate\"`\n\n字符串值有许多关联的函数（*方法*），可用于对它们执行其他操作。我将在第\
  \ 62 页的“方法”中进一步介绍。\n\n\n\n\n用单引号或双引号书写的字符串行为非常相似——唯一的区别在于你需要转义哪种引号。反引号引用的字符串，通常称为`模板字面量`，还能玩出更多花样。除了可以跨行，它们还能嵌入其他值。\n\
  \n`half of 100 is ${100 / 2}`\n\n当你在模板字面量的`${}`中写入内容时，其结果会被计算、转换为字符串，并插入到该位置。上面的例子会输出`half\
  \ of 100 is 50`。\n\n### 一元运算符\n\n并非所有运算符都是符号。有些以单词形式出现。一个例子是`typeof`运算符，它会生成一个字符串值，指明你给它的值的类型。\n\
  \n```\nconsole.log(typeof 4.5)\n// → number\nconsole.log(typeof \"x\")\n// → string\n\
  ```\n\n我们将在示例代码中使用`console.log`来表示我们想看到某个表达式求值的结果。下一章会详细介绍。\n\n前面展示的其他运算符都作用于两个值，但`typeof`只接受一个值。使用两个值的运算符称为`二元`运算符，而只接受一个值的称为`一元`运算符。减号运算符既可以作为二元运算符，也可以作为一元运算符。\n\
  \n```\nconsole.log(- (10 - 2))\n// → -8\n```\n\n### 布尔值\n\n有时，拥有一个只能区分两种可能性的值非常有用，比如“是”和“否”或“开”和“关”。为此，JavaScript\
  \ 有一个`布尔`类型，它只有两个值：`true`和`false`，它们就写作这些单词。\n\n#### 比较\n\n以下是产生布尔值的一种方式：\n\n```\n\
  console.log(3 > 2)\n// → true\nconsole.log(3 < 2)\n// → false\n```\n\n`>`和`<`符号分别是“大于”和“小于”的传统符号。它们是二元运算符。应用它们会得到一个布尔值，指示它们在此情况下是否成立。\n\
  \n字符串也可以以同样的方式进行比较。\n\n```\nconsole.log(\"Aardvark\" < \"Zoroaster\")\n// → true\n\
  ```\n\n字符串的排序大致按字母顺序，但并不完全像你在字典中期望的那样：大写字母总是“小于”小写字母，因此`\"Z\" < \"a\"`，非字母字符（`!`、`-`等）也包含在排序中。当比较字符串时，JavaScript\
  \ 从左到右遍历字符，逐个比较 Unicode 编码。\n\n其他类似的运算符有`>=`（大于等于）、`<=`（小于等于）、`==`（等于）和`!=`（不等于）。\n\
  \n```\nconsole.log(\"Itchy\" != \"Scratchy\")\n// → true\nconsole.log(\"Apple\"\
  \ == \"Orange\")\n// → false\n```\n\nJavaScript 中只有一个值不等于它自身，那就是`NaN`（“不是一个数字”）。\n\
  \n```\nconsole.log(NaN == NaN)\n// → false\n```\n\n`NaN` 用于表示无意义计算的结果，因此它不等于任何*其他*无意义计算的结果。\n\
  \n#### 逻辑运算符\n\n还有一些操作可以应用于布尔值本身。JavaScript 支持三个逻辑运算符：`and`、`or` 和 `not`。它们可以用来对布尔值进行“推理”。\n\
  \n`&&` 运算符表示逻辑 `and`。它是一个二元运算符，只有当两个给定的值都为 `true` 时，其结果才为 `true`。\n\n```\nconsole.log(true\
  \ && false)\n// → false\nconsole.log(true && true)\n// → true\n```\n\n`||` 运算符表示逻辑\
  \ `or`。如果两个给定值中有一个为 `true`，则结果为 `true`。\n\n```\nconsole.log(false || true)\n// →\
  \ true\nconsole.log(false || false)\n// → false\n```\n\n`Not` 写作感叹号（`!`）。它是一个一元运算符，会翻转给定的值——`!true`\
  \ 产生 `false`，`!false` 产生 `true`。\n\n当将这些布尔运算符与算术运算符和其他运算符混合使用时，有时并不清楚何时需要括号。实际上，你通常只需知道，在我们目前见过的运算符中，`||`\
  \ 的优先级最低，然后是 `&&`，接着是比较运算符（`>`、`==` 等），最后是其余运算符。这种顺序的选择是为了在像下面这样的典型表达式中，尽可能少用括号：\n\
  \n```\n1 + 1 == 2 && 10 * 10 > 50\n```\n\n我要讨论的最后一个逻辑运算符既不是一元也不是二元，而是`三元`运算符，它作用于三个值。它用问号和冒号书写，像这样：\n\
  \n```\nconsole.log(true ? 1 : 2);\n// → 1\nconsole.log(false ? 1 : 2);\n// → 2\n\
  ```\n\n这个运算符被称为`条件`运算符（有时也简称为`三元`运算符，因为它是该语言中唯一的此类运算符）。问号左边的值“挑选”另外两个值中的哪一个会输出。当它为\
  \ `true` 时，选择中间的值；当它为 `false` 时，选择右边的值。\n\n### 空值\n\n有两个特殊值，写作 `null` 和 `undefined`，用于表示缺少*有意义*的值。它们本身也是值，但不携带任何信息。\n\
  \n语言中许多不产生有意义值的操作（你稍后会看到一些）都会产生 `undefined`，仅仅是因为它们必须产生*某个*值。\n\n`undefined` 和 `null`\
  \ 之间的含义差异是 JavaScript 设计中的一个意外，大多数时候无关紧要。在确实需要关注这些值的情况下，我建议将它们视为基本可互换。\n\n### 自动类型转换\n\
  \n在引言中，我提到 JavaScript 会尽力接受你提供的几乎任何程序，即使是那些行为怪异的程序。下面的表达式很好地展示了这一点：\n\n```\nconsole.log(8\
  \ * null)\n// → 0\nconsole.log(\"5\" - 1)\n// → 4\nconsole.log(\"5\" + 1)\n// →\
  \ 51\nconsole.log(\"five\" * 2)\n// → NaN\nconsole.log(false == 0)\n// → true\n\
  ```\n\n当运算符应用于“错误”类型的值时，JavaScript 会悄悄地将该值转换为其所需的类型，使用的规则往往不是你想要的或期望的。这被称为`类型强制转换`。第一个表达式中的\
  \ `null` 变成了 `0`，第二个表达式中的 `\"5\"` 变成了 `5`（从字符串到数字）。然而在第三个表达式中，`+` 在数值加法之前尝试了字符串拼接，因此\
  \ `1` 被转换为 `\"1\"`（从数字到字符串）。\n\n当某些无法明显映射为数字的内容（如 `\"five\"` 或 `undefined`）被转换为数字时，你会得到值\
  \ `NaN`。对 `NaN` 进行进一步的算术运算会持续产生 `NaN`，所以如果你在意外的地方遇到了 `NaN`，请寻找意外的类型转换。\n\n当使用 `==`\
  \ 比较相同类型的值时，结果很容易预测：当两个值相同时，你应该得到 `true`，但 `NaN` 的情况除外。但当类型不同时，JavaScript 会使用一套复杂且令人困惑的规则来决定如何处理。大多数情况下，它只是尝试将其中一个值转换为另一个值的类型。然而，当运算符的任一侧出现\
  \ `null` 或 `undefined` 时，只有当两侧都是 `null` 或 `undefined` 时，才会产生 `true`。\n\n```\nconsole.log(null\
  \ == undefined);\n// → true\nconsole.log(null == 0);\n// → false\n```\n\n这种行为通常很有用。当你想要测试一个值是否具有实际值而不是\
  \ `null` 或 `undefined` 时，你可以使用 `==`（或 `!=`）运算符将其与 `null` 进行比较。\n\n但如果你想要测试某个东西是否指向精确的值\
  \ `false` 呢？像 `0 == false` 和 `\"\" == false` 这样的表达式是 `true`。当你*不*希望发生任何自动类型转换时，还有两个额外的运算符：`===`\
  \ 和 `!==`。第一个测试一个值是否*精确*等于另一个，第二个测试是否不精确相等。因此 `\"\" === false` 如预期那样是 `false`。\n\
  \n我建议防御性地使用三个字符的比较运算符，以防止意外的类型转换给你带来麻烦。但当你确定两侧的类型相同时，使用较短的运算符也没有问题。\n\n#### 逻辑运算符的短路求值\n\
  \n\n\n\n\n逻辑运算符 `&&` 和 `||` 以一种特殊的方式处理不同类型的值。它们会将左侧的值转换为 `Boolean` 类型，以决定下一步操作，但根据运算符和转换结果的不同，它们会返回左侧的*原始*值或右侧的值。\n\
  \n例如，`||` 运算符会在左侧的值可以转换为 `true` 时返回该值，否则返回右侧的值。当值为 `Boolean` 类型时，这会产生预期的效果，而对于其他类型的值，其行为也类似。\n\
  \n```\nconsole.log(null || \"user\")\n\n// → user\n\nconsole.log(\"Agnes\" || \"\
  user\")\n\n// → Agnes\n```\n\n我们可以利用这一特性来设置默认值。如果你有一个可能为空的值，可以在其后加上 `||` 和一个替代值。如果初始值可以转换为\
  \ `false`，你就会得到替代值。将字符串和数字转换为 `Boolean` 值的规则规定：`0`、`NaN` 和空字符串（`\"\"`）被视为 `false`，而其他所有值都被视为\
  \ `true`。因此 `0 || -1` 产生 `-1`，`\"\" || \"!?\"` 产生 `\"!?\"`。\n\n`&&` 运算符的工作方式类似，但方向相反。当左侧的值可以转换为\
  \ `false` 时，它返回该值，否则返回右侧的值。\n\n这两个运算符的另一个重要特性是：仅在必要时才会计算右侧的部分。对于 `true || X`，无论\
  \ `X` 是什么——即使它是一个会执行*可怕*操作的代码片段——结果都是 `true`，并且 `X` 永远不会被计算。`false && X` 也是如此，结果为\
  \ `false`，并忽略 `X`。这被称为*短路求值*。\n\n条件运算符的工作方式类似。在第二和第三个值中，只有被选中的那个会被计算。\n\n### 本章小结\n\
  \n本章我们研究了四种 JavaScript 值类型：数字、字符串、`Boolean` 和 `undefined` 值。\n\n这些值通过输入其名称（`true`、`null`）或值（`13`、`\"\
  abc\"`）来创建。你可以使用运算符组合和转换值。我们看到了用于算术（`+`、`-`、`*`、`/` 和 `%`）、字符串拼接（`+`）、比较（`==`、`!=`、`===`、`!==`、`<`、`>`、`<=`、`>=`）和逻辑（`&&`、`||`）的二元运算符，以及几个一元运算符（`-`\
  \ 用于取反数字，`!` 用于逻辑取反，`typeof` 用于查找值的类型）和一个三元运算符（`?:`），用于根据第三个值从两个值中选择一个。\n\n这些信息足以让你把\
  \ JavaScript 当作袖珍计算器来使用，但仅此而已。下一章将开始把这些表达式组合成基本的程序。\n\n“在我那薄而透明的皮肤下，我的心闪烁着鲜红的光芒，他们必须给我注射\
  \ 10cc 的 JavaScript 才能让我恢复过来。（我对血液中的毒素反应良好。）天哪，那玩意儿能把你的鱼鳃里的桃子都踢出来！”\n\n——_why，*《Why's（感人）Ruby\
  \ 指南》*\n\n![Image](img/f0022-01.jpg)\n\n## 2 程序结构\n\n在本章中，我们将开始做一些真正可以称为*编程*的事情。我们将扩展对\
  \ JavaScript 语言的掌握，超越目前所见的名词和句子片段，达到能够表达有意义篇章的程度。\n\n### 表达式与语句\n\n在第 1 章中，我们创建了值，并对它们应用运算符以得到新值。像这样创建值是任何\
  \ JavaScript 程序的主要内容。但为了有用，这些内容必须被组织在更大的结构中。这就是我们接下来要讨论的内容。\n\n产生值的代码片段称为*表达式*。直接书写的每个值（例如\
  \ `22` 或 `\"psychoanalysis\"`）都是一个表达式。括号内的表达式也是表达式，应用于两个表达式的二元运算符或应用于一个表达式的一元运算符也是如此。\n\
  \n这展示了基于语言的接口之美。表达式可以包含其他表达式，就像人类语言中的子句可以嵌套一样——一个子句可以包含它自己的子句，依此类推。这使我们能够构建描述任意复杂计算的表达式。\n\
  \n如果表达式对应一个句子片段，那么 JavaScript *语句*就对应一个完整的句子。程序就是一系列语句。\n\n最简单的语句是表达式后跟一个分号。这是一个程序：\n\
  \n```\n1;\n\n!false;\n```\n\n不过，这是一个无用的程序。表达式可以仅仅产生一个值，然后被外层代码使用。而语句是独立的，因此只有在对世界产生影响时才有意义。它可以在屏幕上显示某些内容——这算是对世界的改变——或者它可以改变机器的内部状态，从而影响后续的语句。这些改变被称为*副作用*。前面例子中的语句只是产生了值\
  \ `1` 和 `true`，然后立即丢弃了它们。这对世界完全没有留下任何印象。当你运行这个程序时，不会观察到任何东西。\n\n在某些情况下，JavaScript\
  \ 允许你省略语句末尾的分号。在其他情况下，则必须加上分号，否则下一行会被视为同一语句的一部分。关于何时可以安全省略分号的规则有些复杂且容易出错。因此，在本书中，每个需要分号的语句都会加上分号。我建议你也这样做，至少在你对省略分号的微妙之处有更多了解之前。\n\
  \n### 绑定\n\n程序如何保持内部状态？它如何记住事物？我们已经看到如何从旧值产生新值，但这并不会改变旧值，而且新值必须立即使用，否则就会消失。为了捕获和保存值，JavaScript\
  \ 提供了一种称为*绑定*（或*变量*）的东西：\n\n```\nlet caught = 5 * 5;\n```\n\n这是第二种语句。特殊关键字（*keyword*）`let`\
  \ 表示这条语句将要定义一个绑定。它后面跟着绑定的名称，如果我们想立即给它一个值，则加上 `=` 运算符和一个表达式。\n\n前面的语句创建了一个名为 `caught`\
  \ 的绑定，并用它来抓住 `5` 乘以 `5` 产生的数字。\n\n绑定定义之后，它的名称可以用作表达式。这种表达式的值就是绑定当前持有的值。下面是一个例子：\n\
  \n```\nlet ten = 10;\n\nconsole.log(ten * ten);\n\n// → 100\n```\n\n当一个绑定指向一个值时，并不意味着它永远与该值绑定。`=`\
  \ 运算符可以随时用于现有的绑定，使它们断开与当前值的连接，并指向一个新值。\n\n```\nlet mood = \"light\";\n\nconsole.log(mood);\n\
  \n// → light\n\nmood = \"dark\";\n\nconsole.log(mood);\n\n// → dark\n```\n\n你应该把绑定想象成触手，而不是盒子。它们并不*包含*值，而是*抓住*值——两个绑定可以引用同一个值。程序只能访问它仍然持有引用的值。当你需要记住某件事时，你就长出一条触手来抓住它，或者将你现有的某条触手重新连接到它上面。\n\
  \n让我们看另一个例子。为了记住路易吉还欠你多少美元，你创建了一个绑定。然后当他偿还 35 美元时，你给这个绑定赋予一个新值。\n\n```\nlet luigisDebt\
  \ = 140;\n\nluigisDebt = luigisDebt - 35;\n\nconsole.log(luigisDebt);\n\n// → 105\n\
  ```\n\n当你定义一个绑定而不给它赋值时，触手就没有东西可抓，因此它悬在空中。如果你询问一个空绑定的值，你会得到值 `undefined`。\n\n一条 `let`\
  \ 语句可以定义多个绑定。定义之间必须用逗号分隔。\n\n```\nlet one = 1, two = 2;\n\nconsole.log(one + two);\n\
  \n// → 3\n```\n\n关键字 `var` 和 `const` 也可以用来创建绑定，方式与 `let` 类似。\n\n```\nvar name =\
  \ \"Ayda\";\n\nconst greeting = \"Hello \";\n\nconsole.log(greeting + name);\n\n\
  // → Hello Ayda\n```\n\n\n\n\n\n第一个是 `var`（“variable”的缩写），它是 2015 年之前的 JavaScript\
  \ 中声明绑定的方式。我将在下一章详细说明它与 `let` 的具体区别。现在，只需记住它大部分功能相同，但本书中很少使用它，因为它有一些令人困惑的特性。\n\n\
  `const` 一词代表 *常量*。它定义了一个常量绑定，在其生命周期内始终指向同一个值。这对于给值起个名字以便后续轻松引用非常有用。\n\n### 绑定名称\n\
  \n绑定名称可以是任何单词。数字可以作为绑定名称的一部分——例如 `catch22` 是一个有效的名称——但名称不能以数字开头。绑定名称可以包含美元符号（`$`）或下划线（`_`），但不能包含其他标点符号或特殊字符。\n\
  \n具有特殊含义的单词，如 `let`，是 *关键字*，不能用作绑定名称。还有一些单词被“保留供未来版本的 JavaScript 使用”，也不能用作绑定名称。关键字和保留字的完整列表相当长。\n\
  \n```\nbreak case catch class const continue debugger default\ndelete do else enum\
  \ export extends false finally for\nfunction if implements import interface in instanceof\
  \ let\nnew package private protected public return static super\nswitch this throw\
  \ true try typeof var void while with yield\n```\n\n不必担心记住这个列表。当创建绑定时出现意外的语法错误，请检查是否试图定义一个保留字。\n\
  \n### 环境\n\n在特定时刻存在的绑定及其值的集合称为 *环境*。当程序启动时，这个环境并非空无一物。它始终包含语言标准中的绑定，并且大多数情况下，它还包含提供与周围系统交互方式的绑定。例如，在浏览器中，有用于与当前加载的网站交互以及读取鼠标和键盘输入的函数。\n\
  \n### 函数\n\n默认环境中提供的许多值都具有 *函数* 类型。函数是一段包装在值中的程序。这样的值可以被 *应用* 以运行包装的程序。例如，在浏览器环境中，绑定\
  \ `prompt` 持有一个函数，该函数显示一个要求用户输入的小对话框。它的使用方式如下：\n\n```\nprompt(\"Enter passcode\"\
  );\n```\n\n![Image](img/f0027-01.jpg)\n\n执行一个函数称为 *调用*、*调用* 或 *应用* 它。你可以通过将括号放在产生函数值的表达式后面来调用函数。通常你会直接使用持有该函数的绑定的名称。括号之间的值被传递给函数内部的程序。在示例中，`prompt`\
  \ 函数使用我们提供的字符串作为对话框中显示的文本。传递给函数的值称为 *参数*。不同的函数可能需要不同数量或不同类型的参数。\n\n`prompt` 函数在现代\
  \ Web 编程中并不常用，主要是因为你无法控制结果对话框的外观，但在玩具程序和实验中它可能很有用。\n\n### console.log 函数\n\n在示例中，我使用\
  \ `console.log` 来输出值。大多数 JavaScript 系统（包括所有现代 Web 浏览器和 Node.js）都提供了一个 `console.log`\
  \ 函数，它将参数写入 *某个* 文本输出设备。在浏览器中，输出会显示在 JavaScript 控制台中。浏览器界面的这一部分默认是隐藏的，但大多数浏览器在按下\
  \ F12 或 Mac 上的 COMMAND-OPTION-I 时会打开它。如果不起作用，请在菜单中搜索名为“开发者工具”或类似的项目。\n\n尽管绑定名称不能包含句点字符，但\
  \ `console.log` 确实包含一个。这是因为 `console.log` 不是一个简单的绑定。它实际上是一个表达式，从 `console` 绑定持有的值中检索\
  \ `log` 属性。我们将在第 61 页的“属性”中详细了解这意味着什么。\n\n### 返回值\n\n显示对话框或向屏幕写入文本是一种 *副作用*。许多函数因其产生的副作用而有用。函数也可以产生值，在这种情况下，它们不需要有副作用就能发挥作用。例如，函数\
  \ `Math.max` 接受任意数量的数字参数并返回最大值。\n\n```\nconsole.log(Math.max(2, 4));\n// → 4\n```\n\
  \n当一个函数产生一个值时，我们说它 *返回* 该值。任何产生值的东西在 JavaScript 中都是一个表达式，这意味着函数调用可以在更大的表达式中使用。这里，`Math.min`（与\
  \ `Math.max` 相反）的调用被用作加法表达式的一部分：\n\n```\nconsole.log(Math.min(2, 4) + 100);\n//\
  \ → 102\n```\n\n下一章将解释如何编写自己的函数。\n\n### 控制流\n\n当你的程序包含多个语句时，这些语句会像故事一样从上到下依次执行。这个示例程序有两个语句。第一个语句要求用户输入一个数字，第二个语句（在第一个之后执行）显示该数字的平方。\n\
  \n```\nlet theNumber = Number(prompt(\"Pick a number\"));\nconsole.log(\"Your number\
  \ is the square root of \" +\n            theNumber * theNumber);\n```\n\n函数 `Number`\
  \ 将一个值转换为数字。我们需要这种转换，因为 `prompt` 的结果是一个字符串值，而我们想要一个数字。还有类似的函数 `String` 和 `Boolean`，它们将值转换为相应的类型。\n\
  \n以下是直线控制流的相当简单的示意图：\n\n![Image](img/f0028-01.jpg)\n\n### 条件执行\n\n并非所有程序都是直线道路。例如，我们可能想要创建一条分支路径，程序根据当前情况选择合适的分支。这称为\
  \ *条件执行*。\n\n![Image](img/f0028-02.jpg)\n\n条件执行在 JavaScript 中通过 `if` 关键字创建。在简单情况下，我们希望仅在某个条件成立时执行某些代码。例如，我们可能只想在输入确实是数字时才显示输入的平方。\n\
  \n```\nlet theNumber = Number(prompt(\"Pick a number\"));\nif (!Number.isNaN(theNumber))\
  \ {\n  console.log(\"Your number is the square root of \" +\n              theNumber\
  \ * theNumber);\n}\n```\n\n经过这样的修改，如果你输入“parrot”，则不会显示任何输出。\n\n`if` 关键字根据布尔表达式的值执行或跳过一条语句。决定性的表达式写在关键字之后、括号之间，后面跟着要执行的语句。\n\
  \n`Number.isNaN` 函数是一个标准的 JavaScript 函数，仅当传递给它的参数是 `NaN` 时才返回 `true`。当你给 `Number`\
  \ 函数一个不代表有效数字的字符串时，它恰好会返回 `NaN`。因此，条件翻译为“除非 `theNumber` 不是数字，否则执行此操作”。\n\n在这个例子中，`if`\
  \ 后面的语句被包裹在花括号（`{` 和 `}`）中。花括号可用于将任意数量的语句分组为单个语句，称为 *块*。在这种情况下，你也可以省略它们，因为它们只包含一个语句，但为了避免考虑是否需要它们，大多数\
  \ JavaScript 程序员都会像这样在每个包裹的语句中使用它们。本书将主要遵循这一约定，除了偶尔的单行语句。\n\n```\nif (1 + 1 == 2)\
  \ console.log(\"It's true\");\n// → It's true\n```\n\n你通常不仅会有在条件成立时执行的代码，还会有处理另一种情况的代码。这个替代路径在图中由第二个箭头表示。你可以使用\
  \ `else` 关键字与 `if` 一起创建两个独立的、可选的执行路径。\n\n```\nlet theNumber = Number(prompt(\"Pick\
  \ a number\"));\nif (!Number.isNaN(theNumber)) {\n  console.log(\"Your number is\
  \ the square root of \" +\n              theNumber * theNumber);\n} else {\n```\n\
  \n\n\n\n\n```\n  console.log(\"嘿，你怎么不给我一个数字？\");\n}\n```\n\n如果你有两条以上的路径可以选择，可以将多个\
  \ `if/else` 对“链”在一起。下面是一个例子：\n\n```\nlet num = Number(prompt(\"选一个数字\"));\n\nif\
  \ (num < 10) {\n  console.log(\"小\");\n} else if (num < 100) {\n  console.log(\"\
  中\");\n} else {\n  console.log(\"大\");\n}\n```\n\n程序会先检查 `num` 是否小于 10。如果是，就选择那个分支，显示“小”，然后结束。如果不是，则进入\
  \ `else` 分支，而该分支本身又包含一个 `if`。如果第二个条件（`< 100`）成立，说明数字在 10 到 100 之间，显示“中”。如果不成立，则选择第二个也是最后一个\
  \ `else` 分支。\n\n这个程序的流程示意图大致如下：\n\n![图片](img/f0030-01.jpg)\n\n### while 和 do 循环\n\
  \n考虑一个输出 0 到 12 之间所有偶数的程序。一种写法如下：\n\n```\nconsole.log(0);\nconsole.log(2);\nconsole.log(4);\n\
  console.log(6);\nconsole.log(8);\nconsole.log(10);\nconsole.log(12);\n```\n\n这样可行，但编写程序的本意是让工作*更少*，而不是更多。如果我们需要所有小于\
  \ 1000 的偶数，这种方法就行不通了。我们需要一种能多次运行一段代码的方式。这种控制流形式称为*循环*。\n\n![图片](img/f0030-02.jpg)\n\
  \n循环控制流允许我们回到程序中之前某个点，并利用当前程序状态重复执行。如果结合一个用于计数的绑定，我们可以这样做：\n\n```\nlet number =\
  \ 0;\nwhile (number <= 12) {\n  console.log(number);\n  number = number + 2;\n}\n\
  // → 0\n// → 2\n// ... 等等\n```\n\n以关键字 `while` 开头的语句创建了一个循环。`while` 后面跟着括号中的表达式和一个语句，很像\
  \ `if`。只要表达式产生的值在转换为布尔值后为 `true`，循环就会不断执行该语句。\n\n`number` 绑定展示了绑定如何跟踪程序的进度。每次循环重复时，`number`\
  \ 的值都比之前增加 2。每次重复开始时，它会与数字 12 比较，以决定程序的工作是否完成。\n\n作为一个实际有用的例子，我们现在可以编写一个程序来计算并显示\
  \ 2¹⁰（2 的 10 次方）的值。我们使用两个绑定：一个用于跟踪 `result`，另一个用于计数我们已将这个结果乘以 2 的次数。循环测试第二个绑定是否已达到\
  \ 10，如果没有，则更新两个绑定。\n\n```\nlet result = 1;\nlet counter = 0;\nwhile (counter < 10)\
  \ {\n  result = result * 2;\n  counter = counter + 1;\n}\nconsole.log(result);\n\
  // → 1024\n```\n\n计数器也可以从 1 开始并检查 `<= 10`，但出于将在第 4 章中明确的原因，最好习惯从 0 开始计数。\n\n`do`\
  \ 循环是一种类似于 `while` 循环的控制结构。它只有一点不同：`do` 循环至少执行一次其主体，并且只在第一次执行之后才开始测试是否应该停止。为了体现这一点，测试出现在循环主体之后。\n\
  \n```\nlet yourName;\ndo {\n  yourName = prompt(\"你是谁？\");\n} while (!yourName);\n\
  console.log(yourName);\n```\n\n这个程序会强制你输入一个名字。它会一遍又一遍地询问，直到得到非空字符串。应用 `!` 运算符会在取反之前将值转换为\
  \ `Boolean` 类型，所有非空字符串都会转换为 `true`。这意味着循环会一直进行，直到你提供一个非空的名字。\n\n### 缩进代码\n\n在示例中，我一直在属于某个更大语句的语句前面添加空格。这些空格不是必需的——即使没有它们，计算机也能正常接受程序。实际上，程序中的换行也是可选的。如果你愿意，可以把程序写成一行很长的代码。\n\
  \n块内缩进的作用是让代码的结构更加突出。在块内又打开新块的代码中，很难看出一个块在哪里结束、另一个块在哪里开始。通过适当的缩进，程序的视觉形状与其内部块的形状相对应。我喜欢为每个打开的块使用两个空格，但个人喜好不同——有些人用四个空格，有些人用制表符。重要的是每个新块都添加相同数量的空格。\n\
  \n```\nif (false != true) {\n  console.log(\"这说得通。\");\n  if (1 < 2) {\n    console.log(\"\
  这并不意外。\");\n  }\n}\n```\n\n大多数代码编辑器程序会自动以适当的缩进量缩进新行，从而提供帮助。\n\n### for 循环\n\n许多循环遵循\
  \ while 示例中展示的模式。首先创建一个“计数器”绑定来跟踪循环的进度。然后是一个 while 循环，通常带有一个测试表达式，检查计数器是否已达到其结束值。在循环主体末尾，更新计数器以跟踪进度。\n\
  \n由于这种模式非常常见，JavaScript 和类似语言提供了一种更简短、更全面的形式：`for` 循环。\n\n```\nfor (let number =\
  \ 0; number <= 12; number = number + 2) {\n  console.log(number);\n}\n// → 0\n//\
  \ → 2\n// ... 等等\n```\n\n这个程序与之前的偶数打印示例（第 30 页）完全等价。唯一的变化是，所有与循环“状态”相关的语句都分组在 `for`\
  \ 后面。\n\n`for` 关键字后面的括号必须包含两个分号。第一个分号之前的部分*初始化*循环，通常通过定义一个绑定。第二部分是*检查*循环是否必须继续的表达式。最后一部分在每次迭代后*更新*循环的状态。在大多数情况下，这比\
  \ `while` 结构更简短、更清晰。\n\n以下是使用 `for` 而不是 `while` 计算 2¹⁰ 的代码：\n\n```\nlet result =\
  \ 1;\nfor (let counter = 0; counter < 10; counter = counter + 1) {\n  result = result\
  \ * 2;\n}\nconsole.log(result);\n// → 1024\n```\n\n### 跳出循环\n\n循环条件产生 `false` 并不是循环结束的唯一方式。有一个特殊的语句叫做\
  \ `break`，它的作用是立即跳出当前所在的循环。\n\n这个程序演示了 `break` 语句。它找到第一个既大于等于 20 又能被 7 整除的数字。\n\n\
  ```\nfor (let current = 20; ; current = current + 1) {\n  if (current % 7 == 0)\
  \ {\n    console.log(current);\n    break;\n  }\n}\n// → 21\n```\n\n使用取余（`%`）运算符是测试一个数是否能被另一个数整除的简单方法。如果能整除，它们的余数为零。\n\
  \n示例中的 `for` 结构没有检查循环结束的部分。这意味着除非执行内部的 `break` 语句，否则循环永远不会停止。\n\n如果你删除了那个 `break`\
  \ 语句，或者不小心写了一个总是产生 `true` 的结束条件，你的程序就会陷入*无限循环*。陷入无限循环的程序永远不会结束运行，这通常是一件坏事。\n\n`continue`\
  \ 关键字与 `break` 类似，它会影响循环的进度。当在循环主体中遇到 `continue` 时，控制会跳出主体，并继续执行循环的下一次迭代。\n\n###\
  \ 简洁地更新绑定\n\n特别是在循环中，程序经常需要“更新”一个绑定，使其基于该绑定的先前值保存一个新值。\n\n```\ncounter = counter\
  \ + 1;\n```\n\nJavaScript 为此提供了一个快捷方式。\n\n```\ncounter += 1;\n```\n\n类似的快捷方式适用于许多其他运算符，例如\
  \ `result *= 2` 用于将 result 加倍，或 `counter -= 1` 用于向下计数。\n\n这让我们可以进一步简化计数示例。\n\n```\n\
  for (let number = 0; number <= 12; number += 2) {\n  console.log(number);\n}\n```\n\
  \n\n\n\n\n对于 `counter += 1` 和 `counter -= 1`，还有更短的等价写法：`counter++` 和 `counter--`。\n\
  \n### 使用 switch 进行值分派\n\n代码中出现类似下面的情况并不少见：\n\n```\nif (x == \"value1\") action1();\n\
  else if (x == \"value2\") action2();\nelse if (x == \"value3\") action3();\nelse\
  \ defaultAction();\n```\n\n有一种名为 `switch` 的结构，旨在以更直接的方式表达这种“分派”。不幸的是，JavaScript\
  \ 为此使用的语法（继承自 C/Java 编程语言系列）有些笨拙——一串 `if` 语句可能看起来更好。下面是一个例子：\n\n```\nswitch (prompt(\"\
  What is the weather like?\")) {\n  case \"rainy\":\n    console.log(\"Remember to\
  \ bring an umbrella.\");\n    break;\n  case \"sunny\":\n    console.log(\"Dress\
  \ lightly.\");\n  case \"cloudy\":\n    console.log(\"Go outside.\");\n    break;\n\
  \  default:\n    console.log(\"Unknown weather type!\");\n    break;\n}\n```\n\n\
  你可以在 `switch` 打开的块内放置任意数量的 `case` 标签。程序将从与 `switch` 给定的值相对应的标签处开始执行，如果没有找到匹配的值，则从\
  \ `default` 开始执行。它会继续执行，甚至跨越其他标签，直到遇到 `break` 语句。在某些情况下，例如示例中的 `\"sunny\"` 情况，这可以用来在多个情况之间共享一些代码（它建议在晴天和阴天都外出）。但要小心——很容易忘记写这样的\
  \ `break`，这会导致程序执行你不希望执行的代码。\n\n### 大小写命名\n\n绑定名称不能包含空格，但使用多个单词来清晰描述绑定的含义通常很有帮助。以下是几种用多个单词编写绑定名称的选择：\n\
  \n`fuzzylittleturtle`\n\n`fuzzy_little_turtle`\n\n`FuzzyLittleTurtle`\n\n`fuzzyLittleTurtle`\n\
  \n第一种风格可能难以阅读。我比较喜欢下划线的外观，尽管这种风格输入起来有点麻烦。标准的 JavaScript 函数以及大多数 JavaScript 程序员都遵循最后一种风格——除了第一个单词外，每个单词的首字母都大写。习惯这样的小事并不难，而混合命名风格的代码读起来可能会很刺眼，因此我们遵循这一约定。\n\
  \n在少数情况下，例如 `Number` 函数，绑定的首字母也大写。这样做是为了将此函数标记为构造函数。构造函数是什么将在第 6 章中明确。目前，重要的是不要被这种明显的不一致性所困扰。\n\
  \n### 注释\n\n通常，原始代码并不能传达你希望程序向人类读者传达的所有信息，或者它以某种晦涩的方式传达，以至于人们可能无法理解。有时，你可能只想在程序中包含一些相关的想法。这就是*注释*的用途。\n\
  \n注释是程序的一部分文本，但被计算机完全忽略。JavaScript 有两种编写注释的方式。要编写单行注释，你可以使用两个斜杠字符（`//`），然后在其后写上注释文本。\n\
  \n```\nlet accountBalance = calculateBalance(account);\n// It's a green hollow where\
  \ a river sings\naccountBalance.adjust();\n// Madly catching white tatters in the\
  \ grass.\nlet report = new Report();\n// Where the sun on the proud mountain rings:\n\
  addToReport(accountBalance, report);\n// It's a little valley, foaming like light\
  \ in a glass.\n```\n\n`//` 注释只到行尾。`/*` 和 `*/` 之间的文本段将被完全忽略，无论其中是否包含换行符。这对于添加关于文件或程序块的信息块很有用。\n\
  \n```\n/*\n  I first found this number scrawled on the back of\n  an old notebook.\
  \ Since then, it has often dropped by,\n  showing up in phone numbers and the serial\
  \ numbers of\n  products that I've bought. It obviously likes me, so I've\n  decided\
  \ to keep it.\n*/\nconst myNumber = 11213;\n```\n\n### 总结\n\n现在你知道程序是由语句构成的，而语句本身有时又包含更多语句。语句往往包含表达式，而表达式本身又可由更小的表达式构成。\n\
  \n将语句一个接一个地放置，就得到了一个从上到下执行的程序。你可以通过使用条件语句（`if`、`else` 和 `switch`）和循环语句（`while`、`do`\
  \ 和 `for`）来引入控制流的中断。\n\n绑定可用于将数据片段以名称归档，它们对于跟踪程序中的状态很有用。环境是已定义的绑定的集合。JavaScript\
  \ 系统总是将许多有用的标准绑定放入你的环境中。\n\n函数是封装了一段程序的特珠值。你可以通过编写 `functionName(argument1, argument2)`\
  \ 来调用它们。这样的函数调用是一个表达式，并且可能产生一个值。\n\n### 练习\n\n如果你不确定如何测试练习的解决方案，请参考引言部分。\n\n每个练习都以问题描述开始。阅读此描述并尝试解决练习。如果遇到问题，请考虑阅读本书末尾的提示。本书不包含练习的完整解决方案，但你可以在\
  \ *[`eloquentjavascript.net/code`](https://eloquentjavascript.net/code)* 在线找到它们。如果你想从练习中学到东西，我建议只在解决练习之后，或者至少在你长时间努力攻克它以至于有点头疼之后，再查看解决方案。\n\
  \n#### *循环三角形*\n\n编写一个循环，调用七次 `console.log` 来输出以下三角形：\n\n```\n#\n##\n###\n####\n\
  #####\n######\n#######\n```\n\n了解以下内容可能很有用：你可以通过在字符串后面写 `.length` 来获取字符串的长度。\n\n\
  ```\nlet abc = \"abc\";\nconsole.log(abc.length);\n// → 3\n```\n\n#### *FizzBuzz*\n\
  \n编写一个程序，使用 `console.log` 打印从 1 到 100 的所有数字，但有两个例外。对于能被 3 整除的数字，打印 `\"Fizz\"` 而不是数字；对于能被\
  \ 5 整除（但不能被 3 整除）的数字，打印 `\"Buzz\"` 而不是数字。\n\n完成之后，修改你的程序，对于既能被 3 整除又能被 5 整除的数字，打印\
  \ `\"FizzBuzz\"`（而对于只能被其中一个整除的数字，仍然打印 `\"Fizz\"` 或 `\"Buzz\"`）。\n\n（这实际上是一个面试问题，据称能淘汰相当大比例的应聘程序员。所以如果你解决了它，你的劳动力市场价值就上升了。）\n\
  \n#### *棋盘*\n\n编写一个程序，创建一个表示 8×8 网格的字符串，使用换行符分隔行。网格的每个位置要么是一个空格，要么是一个 `#` 字符。这些字符应构成一个棋盘。\n\
  \n将这个字符串传递给 `console.log` 应该显示如下内容：\n\n```\n # # # #\n# # # #\n # # # #\n# # # #\n\
  \ # # # #\n# # # #\n # # # #\n# # # #\n```\n\n当你有了生成此模式的程序后，定义一个绑定 `size = 8`，并修改程序使其适用于任何大小，输出给定宽度和高度的网格。\n\
  \n“人们认为计算机科学是天才的艺术，但实际情况恰恰相反，只是许多人在做相互叠加的事情，就像一堵由小石子砌成的墙。”\n\n—— 唐纳德·克努特\n\n![Image](img/f0040-01.jpg)\n\
  \n## 3\n\n函数\n\n函数是 JavaScript 编程的基石。将一段程序包装成一个值的概念有很多用途。它为我们提供了一种组织大型程序、减少重复、将名称与子程序关联以及将这些子程序相互隔离的方法。\n\
  \n函数最明显的应用是定义新的词汇。在散文中创造新词通常是不好的风格。但在编程中，这是不可或缺的。\n\n\n\n\n\n典型的成年英语使用者词汇量大约有 2\
  \ 万个单词。很少有编程语言内置 2 万条命令。而且，可用的词汇往往比人类语言定义得更精确，因此灵活性也更低。因此，我们通常*必须*引入新概念，以避免过多重复自己。\n\
  \n### 定义函数\n\n函数定义是一种常规的绑定，其中绑定的值是一个函数。例如，以下代码定义了`square`，它指向一个计算给定数字平方的函数。\n\n\
  ```\nconst square = function(x) {\n  return x * x;\n};\nconsole.log(square(12));\n\
  // → 144\n```\n\n函数是通过以关键字`function`开头的表达式创建的。函数有一组*参数*（本例中只有`x`）和一个*函数体*，其中包含调用函数时要执行的语句。以这种方式创建的函数的函数体必须始终用花括号括起来，即使它只包含一条语句。\n\
  \n一个函数可以有多个参数，也可以没有参数。在下面的例子中，`makeNoise`没有列出任何参数名，而`power`列出了两个：\n\n```\nconst\
  \ makeNoise = function() {\n  console.log(\"Pling!\");\n};\nmakeNoise();\n// → Pling!\n\
  \nconst power = function(base, exponent) {\n  let result = 1;\n  for (let count\
  \ = 0; count < exponent; count++) {\n    result *= base;\n  }\n  return result;\n\
  };\nconsole.log(power(2, 10));\n// → 1024\n```\n\n有些函数会产生一个值，比如`power`和`square`，而有些则不会，比如`makeNoise`，它的唯一结果是副作用。`return`语句决定了函数返回的值。当控制流遇到这样的语句时，它会立即跳出当前函数，并将返回的值交给调用该函数的代码。`return`关键字后面如果没有表达式，会导致函数返回`undefined`。根本没有`return`语句的函数（如`makeNoise`）同样返回`undefined`。\n\
  \n函数的参数行为类似于常规绑定，但它们的初始值由函数的*调用者*提供，而不是函数本身的代码。\n\n### 绑定和作用域\n\n每个绑定都有一个*作用域*，即程序中该绑定可见的部分。对于在任何函数或块外部定义的绑定，其作用域是整个程序——你可以在任何地方引用这些绑定。这些被称为*全局*绑定。\n\
  \n但是，为函数参数创建的绑定或在函数内部声明的绑定只能在该函数内被引用，因此它们被称为*局部*绑定。每次调用函数时，都会创建这些绑定的新实例。这为函数之间提供了一定的隔离——每个函数调用都在自己的小世界（其局部环境）中运行，通常无需了解全局环境中发生了什么就能理解。\n\
  \n用`let`和`const`声明的绑定实际上局限于它们被声明的*块*，因此如果你在循环内部创建了这样的绑定，循环前后的代码无法“看到”它。在 2015 年之前的\
  \ JavaScript 中，只有函数会创建新作用域，因此使用`var`关键字创建的旧式绑定在整个函数内都是可见的——如果它们不在函数内，则在整个全局作用域内可见。\n\
  \n```\nlet x = 10;\nif (true) {\n  let y = 20;\n  var z = 30;\n  console.log(x +\
  \ y + z);\n  // → 60\n}\n// y 在这里不可见\nconsole.log(x + z);\n// → 40\n```\n\n每个作用域可以“向外”查看其周围的作用域，因此示例中`x`在块内部是可见的。例外情况是当多个绑定具有相同名称时——在这种情况下，代码只能看到最内层的绑定。例如，当`halve`函数内部的代码引用`n`时，它看到的是它*自己的*`n`，而不是全局的`n`。\n\
  \n```\nconst halve = function(n) {\n   return n / 2;\n};\nlet n = 10;\nconsole.log(halve(100));\n\
  // → 50\nconsole.log(n);\n// → 10\n```\n\n#### 嵌套作用域\n\nJavaScript 不仅区分*全局*和*局部*绑定。块和函数可以在其他块和函数内部创建，从而产生多级局部性。\n\
  \n例如，这个函数——它输出制作一批鹰嘴豆泥所需的配料——内部包含了另一个函数：\n\n```\nconst hummus = function(factor)\
  \ {\n  const ingredient = function(amount, unit, name) {\n    let ingredientAmount\
  \ = amount * factor;\n    if (ingredientAmount > 1) {\n      unit += \"s\";\n  \
  \  }\n    console.log(`${ingredientAmount} ${unit} ${name}`);\n   };\n   ingredient(1,\
  \ \"can\", \"chickpeas\");\n   ingredient(0.25, \"cup\", \"tahini\");\n   ingredient(0.25,\
  \ \"cup\", \"lemon juice\");\n   ingredient(1, \"clove\", \"garlic\");\n   ingredient(2,\
  \ \"tablespoon\", \"olive oil\");\n   ingredient(0.5, \"teaspoon\", \"cumin\");\n\
  };\n```\n\n`ingredient`函数内部的代码可以看到外部函数中的`factor`绑定。但它的局部绑定（如`unit`或`ingredientAmount`）在外部函数中是不可见的。\n\
  \n块内可见的绑定集合由该块在程序文本中的位置决定。每个局部作用域还可以看到包含它的所有局部作用域，并且所有作用域都可以看到全局作用域。这种绑定可见性的方法称为*词法作用域*。\n\
  \n### 函数作为值\n\n函数绑定通常只是作为程序中特定部分的名称。这样的绑定被定义一次，并且永远不会改变。这很容易让人混淆函数及其名称。\n\n但两者是不同的。函数值可以执行其他值能做的所有事情——你可以在任意表达式中使用它，而不仅仅是调用它。可以将函数值存储在新的绑定中，将其作为参数传递给函数，等等。类似地，持有函数的绑定仍然只是一个常规绑定，如果不是常量，它可以被赋予新值，如下所示：\n\
  \n```\nlet launchMissiles = function() {\n  missileSystem.launch(\"now\");\n};\n\
  if (safeMode) {\n  launchMissiles = function() {/* 什么都不做 */};\n}\n```\n\n在第 5 章中，我们将讨论将函数值传递给其他函数所能做的有趣事情。\n\
  \n### 声明符号\n\n有一种稍微简短的方式来创建函数绑定。当`function`关键字用在语句的开头时，它的工作方式不同。\n\n```\nfunction\
  \ square(x) {\n  return x * x;\n}\n```\n\n这是一个函数*声明*。该语句定义了绑定`square`，并将其指向给定的函数。它写起来稍微容易一些，并且不需要在函数后面加分号。\n\
  \n这种函数定义形式有一个微妙之处。\n\n```\nconsole.log(\"The future says:\", future());\n\nfunction\
  \ future() {\n  return \"You'll never have flying cars\";\n}\n```\n\n上面的代码可以工作，尽管函数是在使用它的代码*下面*定义的。函数声明不属于常规的自上而下的控制流。它们在概念上被移动到其作用域的顶部，并且可以被该作用域中的所有代码使用。这有时很有用，因为它提供了以有意义的方式排列代码的自由，而无需担心在使用所有函数之前必须定义它们。\n\
  \n### 箭头函数\n\n还有第三种函数表示法，它看起来与其他表示法截然不同。它不使用`function`关键字，而是使用由等号和大于号组成的箭头（`=>`）（不要与大于等于运算符`>=`混淆）。\n\
  \n```\nconst power = (base, exponent) => {\n  let result = 1;\n  for (let count\
  \ = 0; count < exponent; count++) {\n    result *= base;\n  }\n  return result;\n\
  };\n```\n\n箭头位于参数列表*之后*，后面跟着函数体。它表达的意思类似于“这个输入（参数）产生这个结果（函数体）”。\n\n\n\n\n\n当只有一个参数名时，可以省略参数列表周围的圆括号。如果函数体是一个单一表达式，而不是花括号内的代码块，那么该表达式将作为函数的返回值。因此，以下两个\
  \ `square` 的定义效果相同：\n\n```\nconst square1 = (x) => { return x * x; };\nconst square2\
  \ = x => x * x;\n```\n\n当箭头函数没有任何参数时，其参数列表就是一对空圆括号。\n\n```\nconst horn = () => {\n\
  \  console.log(\"Toot\");\n};\n```\n\n语言中同时存在箭头函数和函数表达式并没有深层次的原因。除了一个我们将在第 6 章讨论的小细节外，它们的功能相同。箭头函数是在\
  \ 2015 年添加的，主要是为了能够以更简洁的方式编写小型函数表达式。我们将在第 5 章中大量使用它们。\n\n### 调用栈\n\n控制流在函数间的传递方式有些复杂。让我们仔细看看。下面是一个简单的程序，它进行了几次函数调用：\n\
  \n```\nfunction greet(who) {\n  console.log(\"Hello \" + who);\n}\ngreet(\"Harry\"\
  );\nconsole.log(\"Bye\");\n```\n\n这个程序的运行过程大致如下：调用 `greet` 导致控制跳转到该函数的开头（第 2 行）。该函数调用\
  \ `console.log`，后者接管控制，完成工作，然后将控制权返回给第 2 行。在那里，`greet` 函数到达末尾，因此它返回到调用它的位置，即第 4\
  \ 行。下一行再次调用 `console.log`。返回后，程序结束。\n\n我们可以用示意图表示控制流如下：\n\n```\n不在函数中\n   在 greet\
  \ 中\n        在 console.log 中\n   在 greet 中\n不在函数中\n   在 console.log 中\n不在函数中\n```\n\
  \n因为函数在返回时必须跳回到调用它的位置，所以计算机必须记住调用发生的上下文。在一种情况下，`console.log` 完成后必须返回到 `greet` 函数。在另一种情况下，它返回到程序的末尾。\n\
  \n计算机存储此上下文的地方称为*调用栈*。每次调用函数时，当前上下文都会被存储在此栈的顶部。当函数返回时，它会从栈中移除顶部上下文，并使用该上下文继续执行。\n\
  \n存储这个栈需要计算机内存空间。当栈变得太大时，计算机会失败并显示类似“栈空间不足”或“递归过深”的消息。以下代码通过向计算机提出一个非常困难的问题来演示这一点，该问题导致两个函数之间无限来回调用。实际上，如果计算机有无限的栈，它*将*是无限的。但现实是，我们会耗尽空间，或者说“栈溢出”。\n\
  \n```\nfunction chicken() {\n  return egg();\n}\nfunction egg() {\n  return chicken();\n\
  }\nconsole.log(chicken() + \" came first.\");\n// → ??\n```\n\n### 可选参数\n\n以下代码是允许的，并且可以毫无问题地执行：\n\
  \n```\nfunction square(x) { return x * x; }\nconsole.log(square(4, true, \"hedgehog\"\
  ));\n// → 16\n```\n\n我们定义 `square` 时只有一个参数。然而，当我们用三个参数调用它时，语言并不会报错。它会忽略多余的参数，并计算第一个参数的平方。\n\
  \nJavaScript 对于传递给函数的参数数量非常宽容。如果你传递了太多参数，多余的部分会被忽略。如果你传递的参数太少，缺失的参数会被赋值为 `undefined`。\n\
  \n这样做的缺点是，你有可能——甚至很可能——不小心向函数传递了错误数量的参数，而没有人会告诉你。\n\n优点是，这种行为可以用来允许函数接受不同数量的参数。例如，下面的\
  \ `minus` 函数试图通过处理一个或两个参数来模仿 `-` 运算符：\n\n```\nfunction minus(a, b) {\n  if (b ===\
  \ undefined) return -a;\n  else return a - b;\n}\nconsole.log(minus(10));\n// →\
  \ -10\nconsole.log(minus(10, 5));\n// → 5\n```\n\n如果你在参数后面写一个 `=` 运算符，后跟一个表达式，那么当该参数未提供时，该表达式的值将替换该参数。\n\
  \n例如，这个版本的 `power` 使其第二个参数成为可选的。如果你不提供它或传递 `undefined`，它将默认为 2，并且该函数的行为将类似于 `square`。\n\
  \n```\nfunction power(base, exponent = 2) {\n  let result = 1;\n  for (let count\
  \ = 0; count < exponent; count++) {\n    result *= base;\n  }\n  return result;\n\
  }\nconsole.log(power(4));\n// → 16\nconsole.log(power(2, 6));\n// → 64\n```\n\n\
  在下一章中，我们将看到一种方法，函数体可以获取传递给它的整个参数列表（参见第 74 页的“剩余参数”）。这很有用，因为它使得函数可以接受任意数量的参数。例如，`console.log`\
  \ 就是这样做的——它会输出所有传递给它的值。\n\n```\nconsole.log(\"C\", \"O\", 2);\n// → C O 2\n```\n\
  \n### 闭包\n\n将函数视为值的能力，加上每次调用函数时局部绑定都会被重新创建的事实，引发了一个有趣的问题。当创建它们的函数调用不再活跃时，局部绑定会发生什么？\n\
  \n以下代码展示了这样一个例子。它定义了一个函数 `wrapValue`，该函数创建了一个局部绑定。然后它返回一个访问并返回该局部绑定的函数。\n\n```\n\
  function wrapValue(n) {\n  let local = n;\n  return () => local;\n}\nlet wrap1 =\
  \ wrapValue(1);\nlet wrap2 = wrapValue(2);\nconsole.log(wrap1());\n// → 1\nconsole.log(wrap2());\n\
  // → 2\n```\n\n这是允许的，并且按你期望的方式工作——绑定的两个实例仍然可以访问。这种情况很好地证明了局部绑定在每次调用时都会重新创建，并且不同的调用不会相互干扰彼此的局部绑定。\n\
  \n这种特性——能够引用封闭作用域中局部绑定的特定实例——被称为*闭包*。一个引用其周围局部作用域中绑定的函数被称为*闭包*。这种行为不仅让你不必担心绑定的生命周期，还使得以一些创造性的方式使用函数值成为可能。\n\
  \n稍作修改，我们可以将前面的例子变成一种创建函数的方法，这些函数可以将任意数值相乘。\n\n```\nfunction multiplier(factor)\
  \ {\n  return number => number * factor;\n}\nlet twice = multiplier(2);\nconsole.log(twice(5));\n\
  // → 10\n```\n\n`wrapValue` 示例中的显式局部绑定实际上并不需要，因为参数本身就是一个局部绑定。\n\n思考这样的程序需要一些练习。一个好的心智模型是将函数值视为包含其函数体中的代码以及创建它们时的环境。当被调用时，函数体看到的是它被创建时的环境，而不是它被调用时的环境。\n\
  \n在示例中，`multiplier` 被调用并创建了一个环境，其中它的 `factor` 参数被绑定为 2。它返回的函数值（存储在 `twice` 中）记住了这个环境。因此，当该函数被调用时，它会将其参数乘以\
  \ 2。\n\n### 递归\n\n函数调用自身是完全允许的，只要它不会频繁到导致栈溢出。调用自身的函数被称为*递归*。递归允许某些函数以不同的风格编写。例如，下面是\
  \ `power` 的另一种实现：\n\n```\nfunction power(base, exponent) {\n  if (exponent == 0)\
  \ {\n    return 1;\n  } else {\n    return base * power(base, exponent - 1);\n \
  \ }\n}\nconsole.log(power(2, 3));\n// → 8\n```\n\n这非常接近数学家定义幂运算的方式，并且可以说比循环版本更清晰地描述了概念。该函数以越来越小的指数多次调用自身，以实现重复乘法。\n\
  \n\n\n\n但这个实现有一个问题：在典型的 JavaScript 实现中，它比循环版本慢大约三倍。运行一个简单的循环通常比多次调用函数开销更小。\n\n速度与优雅之间的两难选择很有趣。你可以将其视为人类友好性与机器友好性之间的一个连续谱。几乎任何程序都可以通过变得更大、更复杂来变得更快。程序员必须决定一个适当的平衡点。\n\
  \n就幂函数而言，不优雅的（循环）版本仍然相当简单且易于阅读。用递归版本替换它并没有太大意义。然而，程序常常处理如此复杂的概念，以至于牺牲一些效率来使程序更直接是有帮助的。\n\
  \n担心效率可能会分散注意力。这是使程序设计复杂化的另一个因素，当你在做已经困难的事情时，这个额外的担忧可能会让你束手无策。\n\n因此，始终从编写正确且易于理解的内容开始。如果你担心它太慢——通常不会，因为大多数代码根本不会频繁执行到需要大量时间——你可以在事后进行测量，并在必要时进行改进。\n\
  \n递归并不总是循环的低效替代品。有些问题用递归解决确实比用循环更容易。最常见的是那些需要探索或处理多个“分支”的问题，每个分支又可能进一步分支成更多分支。\n\
  \n考虑这个谜题：从数字 1 开始，反复进行加 5 或乘以 3 的操作，可以产生无限多的数字。如何编写一个函数，给定一个数字，尝试找到一系列这样的加法和乘法操作，最终得到该数字？\n\
  \n例如，数字 13 可以通过先乘以 3，然后加两次 5 得到，而数字 15 则根本无法得到。\n\n下面是一个递归解法：\n\n```\nfunction findSolution(target)\
  \ {\n  function find(current, history) {\n    if (current == target) {\n      return\
  \ history;\n    } else if (current > target) {\n      return null;\n    } else {\n\
  \      return find(current + 5, `(${history} + 5)`) ||\n             find(current\
  \ * 3, `(${history} * 3)`);\n    }\n  }\n  return find(1, \"1\");\n}\n\nconsole.log(findSolution(24));\n\
  // → (((1 * 3) + 5) * 3)\n```\n\n请注意，这个程序不一定能找到*最短*的操作序列。只要找到任何序列，它就满足了。\n\n如果你不能立刻理解它是如何工作的，也没关系。让我们逐步分析，因为这对于递归思维来说是一个很好的练习。\n\
  \n内部函数 `find` 执行实际的递归。它接受两个参数：当前数字和一个记录我们如何到达这个数字的字符串。如果找到解，它返回一个显示如何到达目标的字符串。如果从这个数字出发找不到解，则返回\
  \ `null`。\n\n为此，该函数执行三种操作之一。如果当前数字等于目标数字，则当前历史就是到达目标的方式，因此返回它。如果当前数字大于目标数字，则进一步探索这个分支没有意义，因为加法和乘法都只会使数字变大，所以返回\
  \ `null`。最后，如果我们仍然低于目标数字，函数会尝试从当前数字出发的两条可能路径，通过调用自身两次，一次用于加法，一次用于乘法。如果第一次调用返回非 `null`\
  \ 值，则返回该值。否则，返回第二次调用的结果，无论它产生的是字符串还是 `null`。\n\n为了更好地理解这个函数如何产生我们想要的效果，让我们看看在搜索数字\
  \ 13 的解时所有对 `find` 的调用。\n\n```\nfind(1, \"1\")\n  find(6, \"(1 + 5)\")\n    find(11,\
  \ \"((1 + 5) + 5)\")\n      find(16, \"(((1 + 5) + 5) + 5)\")\n        too big\n\
  \      find(33, \"(((1 + 5) + 5) * 3)\")\n        too big\n    find(18, \"((1 +\
  \ 5) * 3)\")\n      too big\n  find(3, \"(1 * 3)\")\n    find(8, \"((1 * 3) + 5)\"\
  )\n      find(13, \"(((1 * 3) + 5) + 5)\")\n        found!\n```\n\n缩进表示调用栈的深度。第一次调用\
  \ `find` 时，它首先调用自身来探索以 `(1 + 5)` 开头的解。该调用将进一步递归，探索所有产生小于或等于目标数字的连续解。由于没有找到命中目标的解，它向第一次调用返回\
  \ `null`。在那里，`||` 运算符导致探索 `(1 * 3)` 的调用发生。这次搜索运气更好——它的第一次递归调用，通过*另一个*递归调用，命中了目标数字。最内层的调用返回一个字符串，中间调用中的每个\
  \ `||` 运算符都会传递该字符串，最终返回解。\n\n### 函数增长\n\n函数被引入程序有两种或多或少自然的方式。\n\n第一种是你发现自己多次编写类似的代码。你宁愿不这样做。更多的代码意味着更多的隐藏错误空间，以及更多需要阅读的材料，以便人们理解程序。因此，你提取重复的功能，为它找一个好名字，并将其放入一个函数中。\n\
  \n第二种方式是你发现自己需要一些尚未编写的功能，并且听起来它应该有自己的函数。你会先给函数命名，然后编写它的主体。你甚至可能在定义函数本身之前就开始编写使用该函数的代码。\n\
  \n为函数找到一个好名字的难度，很好地说明了你要封装的概念有多清晰。让我们看一个例子。\n\n我们想编写一个程序，打印两个数字：农场中奶牛和鸡的数量，后面跟着单词\
  \ Cows 和 Chickens，并在两个数字前面补零，使它们始终是三位数。\n\n007 Cows\n\n011 Chickens\n\n这需要一个接受两个参数的函数——奶牛数量和鸡的数量。让我们开始编码。\n\
  \n```\nfunction printFarmInventory(cows, chickens) {\n  let cowString = String(cows);\n\
  \  while (cowString.length < 3) {\n    cowString = \"0\" + cowString;\n  }\n  console.log(`${cowString}\
  \ Cows`);\n  let chickenString = String(chickens);\n  while (chickenString.length\
  \ < 3) {\n    chickenString = \"0\" + chickenString;\n  }\n  console.log(`${chickenString}\
  \ Chickens`);\n}\n\nprintFarmInventory(7, 11);\n```\n\n在字符串表达式后写 `.length` 会得到该字符串的长度。因此，`while`\
  \ 循环会在数字字符串前面不断添加零，直到它们至少有三个字符长。\n\n任务完成！但就在我们准备将代码（连同高额发票）发送给农民时，她打电话告诉我们，她开始养猪了，我们能否扩展软件以同时打印猪的数量？\n\
  \n当然可以。但就在我们准备再次复制粘贴那四行代码时，我们停下来重新思考。一定有更好的方法。这是第一次尝试：\n\n```\nfunction printZeroPaddedWithLabel(number,\
  \ label) {\n  let numberString = String(number);\n  while (numberString.length <\
  \ 3) {\n    numberString = \"0\" + numberString;\n  }\n  console.log(`${numberString}\
  \ ${label}`);\n}\n\nfunction printFarmInventory(cows, chickens, pigs) {\n  printZeroPaddedWithLabel(cows,\
  \ \"Cows\");\n  printZeroPaddedWithLabel(chickens, \"Chickens\");\n  printZeroPaddedWithLabel(pigs,\
  \ \"Pigs\");\n}\n\nprintFarmInventory(7, 11, 3);\n```\n\n它起作用了！但那个名字 `printZeroPaddedWithLabel`\
  \ 有点别扭。它将三件事——打印、补零和添加标签——混入了一个函数中。\n\n\n\n\n与其整体提取程序中重复的部分，不如尝试挑出一个*概念*。\n\n```\n\
  function zeroPad(number, width) {\n  let string = String(number);\n  while (string.length\
  \ < width) {\n    string = \"0\" + string;\n  }\n  return string;\n}\n\nfunction\
  \ printFarmInventory(cows, chickens, pigs) {\n  console.log(`${zeroPad(cows, 3)}\
  \ Cows`);\n  console.log(`${zeroPad(chickens, 3)} Chickens`);\n  console.log(`${zeroPad(pigs,\
  \ 3)} Pigs`);\n}\n\nprintFarmInventory(7, 16, 3);\n```\n\n一个像 `zeroPad` 这样名称清晰明了的函数，能让阅读代码的人更容易理解它的作用。而且这样的函数不仅限于这个特定程序，在更多场景下也很有用。例如，你可以用它来打印对齐良好的数字表格。\n\
  \n我们的函数应该有多智能、多通用？我们可以编写各种函数，从只能将数字填充为三个字符宽度的极其简单的函数，到处理小数、负数、小数点对齐、不同字符填充等复杂功能的通用数字格式化系统。\n\
  \n一个有用的原则是：除非你绝对确定将来会用到，否则不要添加花哨的功能。你可能会忍不住为你遇到的每一个功能都编写通用的“框架”。请抵制这种冲动。你无法完成任何实际工作——你只会编写一些永远不会用到的代码。\n\
  \n### 函数与副作用\n\n函数大致可以分为两类：一类是为了其副作用而调用的，另一类是为了其返回值而调用的。（当然，也有可能同时具有副作用和返回值。）\n\n\
  农场示例中的第一个辅助函数 `printZeroPaddedWithLabel` 是为了其副作用而调用的：它打印一行。第二个版本 `zeroPad` 是为了其返回值而调用的。第二个函数比第一个函数在更多场景下有用，这并非巧合。创建值的函数比直接执行副作用的函数更容易以新的方式组合。\n\
  \n*纯*函数是一种特定的生成值的函数，它不仅没有副作用，而且也不依赖其他代码的副作用——例如，它不会读取值可能发生变化的全局绑定。纯函数有一个令人愉快的特性：当用相同的参数调用时，它总是产生相同的值（并且不做其他任何事情）。对这样一个函数的调用可以用它的返回值替换，而不会改变代码的含义。当你不确定一个纯函数是否正常工作时，你可以通过简单地调用它来测试，并且知道如果它在那个上下文中有效，那么它在任何上下文中都会有效。非纯函数通常需要更多的脚手架来测试。\n\
  \n不过，在编写非纯函数时，也不必感到内疚，或者发动一场圣战来将它们从代码中清除。副作用通常是有用的。例如，不可能写出 `console.log` 的纯函数版本，而\
  \ `console.log` 是很有用的。有些操作在使用副作用时也更容易高效地表达，因此计算速度可能成为避免纯函数的一个理由。\n\n### 总结\n\n本章教你如何编写自己的函数。`function`\
  \ 关键字作为表达式使用时，可以创建一个函数值。作为语句使用时，可以用来声明一个绑定，并为其赋予一个函数作为值。箭头函数是另一种创建函数的方式。\n\n```\n\
  // 定义 f 来保存一个函数值\nconst f = function(a) {\n   console.log(a + 2);\n};\n\n// 声明 g\
  \ 为一个函数\nfunction g(a, b) {\n  return a * b * 3.5;\n}\n\n// 一种更简洁的函数值写法\nlet h =\
  \ a => a % 3;\n```\n\n理解函数的一个关键方面是理解作用域。每个块都会创建一个新的作用域。在给定作用域中声明的参数和绑定是局部的，外部不可见。用\
  \ `var` 声明的绑定行为不同——它们最终会出现在最近的函数作用域或全局作用域中。\n\n将程序执行的任务分离到不同的函数中是有帮助的。你不需要重复自己太多，函数可以通过将代码分组为执行特定功能的片段来帮助组织程序。\n\
  \n### 练习\n\n#### *最小值*\n\n第 2 章 介绍了标准函数 `Math.min`，它返回最小的参数（参见第 27 页 的“返回值”）。现在我们可以构建类似的东西。编写一个函数\
  \ `min`，它接受两个参数并返回它们的最小值。\n\n#### *递归*\n\n我们已经看到，`%`（取余运算符）可以通过 `% 2` 来测试一个数是偶数还是奇数，即检查它是否能被\
  \ 2 整除。下面是另一种定义正整数是偶数还是奇数的方法：\n\n*   零是偶数。\n*   一是奇数。\n*   对于任何其他数 *N*，其奇偶性与 *N*\
  \ – 2 相同。\n\n定义一个递归函数 `isEven`，与上述描述对应。该函数应接受一个参数（一个正整数）并返回一个布尔值。\n\n在 50 和 75 上测试它。看看它在\
  \ –1 上的表现。为什么？你能想到修复这个问题的方法吗？\n\n#### *数豆子*\n\n你可以通过 `\"string\"[N]` 从字符串中获取第 N\
  \ 个字符或字母。返回的值将是一个只包含一个字符的字符串（例如 `\"b\"`）。第一个字符的位置是 0，因此最后一个字符的位置是 `string.length\
  \ - 1`。换句话说，一个两个字符的字符串长度为 2，其字符位置分别为 0 和 1。\n\n编写一个函数 `countBs`，它接受一个字符串作为唯一参数，并返回一个数字，表示该字符串中有多少个大写字母“B”。\n\
  \n接下来，编写一个名为 `countChar` 的函数，其行为类似于 `countBs`，但它接受第二个参数，表示要计数的字符（而不是只计数大写字母“B”）。重写\
  \ `countBs` 以使用这个新函数。\n\n“我曾两次被问到：‘请问，巴贝奇先生，如果你把错误的数字输入机器，正确的答案会出来吗？’……我无法正确理解那种能引发如此问题的混乱思想。”\n\
  \n——查尔斯·巴贝奇，《一位哲学家的生活片段》（1864）\n\n![Image](img/f0058-01.jpg)\n\n## 4\n\n数据结构：对象和数组\n\
  \n数字、布尔值和字符串是构建数据结构的原子。然而，许多类型的信息需要不止一个原子。*对象*允许我们将值（包括其他对象）分组，以构建更复杂的结构。\n\n到目前为止，我们构建的程序受到限制，因为它们只操作简单的数据类型。本章将介绍基本的数据结构。学完本章后，你将掌握足够的知识来开始编写有用的程序。\n\
  \n本章将通过一个或多或少现实的编程示例来展开，在解决手头问题的过程中引入相关概念。示例代码通常会建立在文本前面介绍的函数和绑定之上。\n\n本书的在线编码沙盒（*[`eloquentjavascript.net/code`](https://eloquentjavascript.net/code)*）提供了在特定章节上下文中运行代码的方式。如果你决定在其他环境中完成示例，请务必先从沙盒页面下载本章的完整代码。\n\
  \n### 狼人松鼠\n\n时不时地，通常在晚上 8 点到 10 点之间，雅克发现自己变成了一只毛茸茸的、尾巴蓬松的小型啮齿动物。\n\n\n\n\n一方面，雅克很高兴自己没有患上经典的狼人症。变成松鼠确实比变成狼带来的问题少。他不必担心不小心吃掉邻居（那会很尴尬），而是担心被邻居的猫吃掉。在两次从橡树树冠中一根摇摇欲坠的细枝上醒来，赤身裸体、迷失方向之后，他养成了晚上锁好房间门窗的习惯，并在地板上放几个核桃让自己有事可做。\n\
  \n这样就解决了猫和树的问题。但雅克更希望彻底摆脱这种状况。变身的不定期发生让他怀疑可能是由某种因素触发的。有一段时间，他相信只有在靠近橡树的日子里才会发生。但避开橡树并没有解决问题。\n\
  \n改用更科学的方法后，雅克开始每天记录自己当天所做的一切，以及是否变了形。有了这些数据，他希望缩小触发变身的条件范围。\n\n他首先需要的是一个用于存储这些信息的数据结构。\n\
  \n### 数据集\n\n要处理数字数据块，我们首先得找到一种在机器内存中表示它的方法。例如，假设我们想表示数字 2、3、5、7 和 11 的集合。\n\n我们可以用字符串来发挥创意——毕竟字符串可以有任意长度，所以我们可以把大量数据放入其中——并使用\
  \ `\"2 3 5 7 11\"` 作为表示。但这很麻烦。你必须以某种方式提取数字并将它们转换回数字才能访问。\n\n幸运的是，JavaScript 提供了一种专门用于存储值序列的数据类型。它被称为\
  \ `array`，写作方括号内用逗号分隔的值列表。\n\n```\nlet listOfNumbers = [2, 3, 5, 7, 11];\n\nconsole.log(listOfNumbers[2]);\n\
  \n// → 5\n\nconsole.log(listOfNumbers[0]);\n\n// → 2\n\nconsole.log(listOfNumbers[2\
  \ - 1]);\n\n// → 3\n```\n\n获取数组元素的表示法也使用方括号。表达式后面紧跟一对方括号，里面包含另一个表达式，会查找左侧表达式中与方括号内表达式给出的\
  \ `index` 对应的元素。\n\n数组的第一个索引是零，而不是一。因此第一个元素通过 `listOfNumbers[0]` 获取。基于零的计数在技术领域有着悠久的传统，并且在某些方面很有意义，但需要一些时间来适应。将索引视为从数组开头开始要跳过的元素数量。\n\
  \n### 属性\n\n在前几章中，我们看到了一些看起来可疑的表达式，比如 `myString.length`（获取字符串长度）和 `Math.max`（最大值函数）。这些表达式访问某个值的\
  \ `property`。在第一个例子中，我们访问了 `myString` 中值的 `length` 属性。在第二个例子中，我们访问了 `Math` 对象（一个数学相关常量和函数的集合）中名为\
  \ `max` 的属性。\n\n几乎所有 JavaScript 值都有属性。例外是 `null` 和 `undefined`。如果你试图访问这些非值上的属性，会得到一个错误。\n\
  \n```\nnull.length;\n\n// → TypeError: null has no properties\n```\n\n在 JavaScript\
  \ 中访问属性的两种主要方式是使用点号和方括号。`value.x` 和 `value[x]` 都访问 `value` 上的属性——但不一定是同一个属性。区别在于\
  \ `x` 的解释方式。使用点号时，点号后的单词是属性的字面名称。使用方括号时，方括号内的表达式会被 `evaluated` 以获取属性名称。`value.x`\
  \ 获取 `value` 中名为 `\"x\"` 的属性，而 `value[x]` 会尝试计算表达式 `x`，并将结果（转换为字符串）用作属性名称。\n\n因此，如果你知道感兴趣的属性叫做\
  \ `color`，就写 `value.color`。如果你想提取由绑定 `i` 中保存的值命名的属性，就写 `value[i]`。属性名称是字符串。它们可以是任何字符串，但点号表示法只适用于看起来像有效绑定名称的名称。所以如果你想访问名为\
  \ `2` 或 `John Doe` 的属性，必须使用方括号：`value[2]` 或 `value[\"John Doe\"]`。\n\n数组中的元素作为数组的属性存储，使用数字作为属性名称。由于不能对数字使用点号表示法，而且通常你想使用一个保存索引的绑定，所以必须使用方括号表示法来获取它们。\n\
  \n数组的 `length` 属性告诉我们它有多少个元素。这个属性名称是一个有效的绑定名称，而且我们事先知道它的名称，所以为了获取数组的长度，通常写 `array.length`，因为比写\
  \ `array[\"length\"]` 更容易。\n\n### 方法\n\n字符串和数组对象除了 `length` 属性外，还包含许多保存函数值的属性。\n\
  \n```\nlet doh = \"Doh\";\n\nconsole.log(typeof doh.toUpperCase);\n\n// → function\n\
  \nconsole.log(doh.toUpperCase());\n\n// → DOH\n```\n\n每个字符串都有一个 `toUpperCase` 属性。调用时，它会返回字符串的一个副本，其中所有字母都已转换为大写。还有\
  \ `toLowerCase`，作用相反。\n\n有趣的是，尽管对 `toUpperCase` 的调用没有传递任何参数，但该函数 somehow 可以访问字符串\
  \ `\"Doh\"`，即我们调用其属性的那个值。这是如何工作的，在第 98 页的“方法”中描述。\n\n包含函数的属性通常被称为它们所属值的 `methods`，例如“`toUpperCase`\
  \ 是字符串的一个方法”。\n\n这个例子演示了两种可用于操作数组的方法：\n\n```\nlet sequence = [1, 2, 3];\n\nsequence.push(4);\n\
  \nsequence.push(5);\n\nconsole.log(sequence);\n\n// → [1, 2, 3, 4, 5]\n\nconsole.log(sequence.pop());\n\
  \n// → 5\n\nconsole.log(sequence);\n\n// → [1, 2, 3, 4]\n```\n\n`push` 方法将值添加到数组末尾，而\
  \ `pop` 方法则相反，移除数组中的最后一个值并返回它。\n\n这些有点傻的名字是对 `stack` 操作的传统术语。在编程中，栈是一种数据结构，允许你将值推入其中，然后以相反的顺序弹出，这样最后添加的东西最先被移除。这在编程中很常见——你可能还记得第\
  \ 46 页的“调用栈”中的函数调用栈，它是同一思想的一个实例。\n\n### 对象\n\n回到松鼠人。一组每日日志条目可以用数组表示。但条目不仅仅由一个数字或字符串组成——每个条目需要存储一个活动列表和一个布尔值，指示雅克是否变成了松鼠。理想情况下，我们希望将这些分组到一个单一值中，然后将这些分组后的值放入日志条目的数组中。\n\
  \n`object` 类型的值是属性的任意集合。创建对象的一种方法是使用花括号作为表达式。\n\n```\nlet day1 = {\n   squirrel:\
  \ false,\n   events: [\"work\", \"touched tree\", \"pizza\", \"running\"]\n};\n\n\
  console.log(day1.squirrel);\n\n// → false\n\nconsole.log(day1.wolf);\n\n// → undefined\n\
  \nday1.wolf = false;\n\nconsole.log(day1.wolf);\n\n// → false\n```\n\n在花括号内，有一个用逗号分隔的属性列表。每个属性都有一个名称，后跟冒号和值。当对象跨多行书写时，像示例中那样缩进有助于提高可读性。名称不是有效绑定名称或有效数字的属性必须用引号括起来。\n\
  \n```\nlet descriptions = {\n   work: \"Went to work\",\n   \"touched tree\": \"\
  Touched a tree\"\n};\n```\n\n\n\n这意味着花括号在 JavaScript 中具有*两*种含义。在语句开头，它们表示一个语句块。在其他任何位置，它们描述一个对象。幸运的是，很少有用花括号中的对象作为语句开头的情况，因此这两者之间的歧义并不构成大问题。\n\
  \n读取一个不存在的属性会得到值 `undefined`。\n\n可以使用 `=` 运算符为属性表达式赋值。如果该属性已存在，则会替换其值；如果不存在，则会在对象上创建一个新属性。\n\
  \n简单回顾一下我们关于绑定的触手模型——属性绑定与之类似。它们*抓住*值，但其他绑定和属性可能也持有这些相同的值。你可以把对象想象成拥有任意数量触手的章鱼，每条触手上都纹着一个名字。\n\
  \n`delete` 运算符会切断这样一只章鱼的一条触手。它是一个一元运算符，当应用于对象属性时，会从对象中移除该命名属性。这并不常见，但却是可行的。\n\n\
  ```\nlet anObject = {left: 1, right: 2};\n\nconsole.log(anObject.left);\n\n// →\
  \ 1\n\ndelete anObject.left;\n\nconsole.log(anObject.left);\n\n// → undefined\n\n\
  console.log(\"left\" in anObject);\n\n// → false\n\nconsole.log(\"right\" in anObject);\n\
  \n// → true\n```\n\n二元运算符 `in` 应用于一个字符串和一个对象时，会告诉你该对象是否具有该名称的属性。将属性设置为 `undefined`\
  \ 与实际删除它的区别在于：在第一种情况下，对象仍然*拥有*该属性（只是它的值没什么意思），而在第二种情况下，该属性不再存在，`in` 会返回 `false`。\n\
  \n要找出一个对象有哪些属性，可以使用 `Object.keys` 函数。给它一个对象，它会返回一个字符串数组——即对象的属性名。\n\n```\nconsole.log(Object.keys({x:\
  \ 0, y: 0, z: 2}));\n\n// → [\"x\", \"y\", \"z\"]\n```\n\n有一个 `Object.assign` 函数，可以将一个对象的所有属性复制到另一个对象中。\n\
  \n```\nlet objectA = {a: 1, b: 2};\n\nObject.assign(objectA, {b: 3, c: 4});\n\n\
  console.log(objectA);\n\n// → {a: 1, b: 3, c: 4}\n```\n\n那么，数组只是一种专门用于存储序列的对象。如果你计算\
  \ `typeof []`，它会得到 `\"object\"`。你可以把它们看作长长的、扁平的章鱼，所有触手整齐地排成一排，并用数字标记。\n\n我们将把雅克记录的日志表示为一个对象数组。\n\
  \n```\nlet journal = [\n\n   {events: [\"work\", \"touched tree\", \"pizza\",\n\n\
  \             \"running\", \"television\"],\n\n    squirrel: false},\n\n   {events:\
  \ [\"work\", \"ice cream\", \"cauliflower\",\n\n             \"lasagna\", \"touched\
  \ tree\", \"brushed teeth\"],\n\n    squirrel: false},\n\n   {events: [\"weekend\"\
  , \"cycling\", \"break\", \"peanuts\",\n\n             \"beer\"],\n\n    squirrel:\
  \ true},\n\n   /* 等等... */\n\n];\n```\n\n### 可变性\n\n我们很快就要开始*真正*的编程了。但首先还需要理解一点理论。\n\
  \n我们看到对象值是可以修改的。前面章节讨论的值类型，如数字、字符串和布尔值，都是*不可变的*——无法改变这些类型的值。你可以组合它们并从它们派生新值，但当你拿到一个特定的字符串值时，该值将始终保持不变。它内部的文本无法更改。如果你有一个包含\
  \ \"cat\" 的字符串，其他代码不可能更改你字符串中的字符使其变成 \"rat\"。\n\n对象的工作方式不同。你*可以*更改它们的属性，使得同一个对象值在不同时间拥有不同的内容。\n\
  \n当我们有两个数字 120 和 120 时，无论它们是否指向相同的物理位，我们都可以认为它们是同一个数字。而对于对象，拥有对同一个对象的两个引用与拥有两个包含相同属性的不同对象之间是有区别的。考虑以下代码：\n\
  \n```\nlet object1 = {value: 10};\n\nlet object2 = object1;\n\nlet object3 = {value:\
  \ 10};\n\nconsole.log(object1 == object2);\n\n// → true\n\nconsole.log(object1 ==\
  \ object3);\n\n// → false\n\nobject1.value = 15;\n\nconsole.log(object2.value);\n\
  \n// → 15\n\nconsole.log(object3.value);\n\n// → 10\n```\n\n`object1` 和 `object2`\
  \ 这两个绑定抓住了*同一个*对象，这就是为什么改变 `object1` 也会改变 `object2` 的值。它们被称为具有相同的*标识*。绑定 `object3`\
  \ 指向一个不同的对象，该对象最初包含与 `object1` 相同的属性，但过着独立的生活。\n\n绑定也可以是可变的或常量，但这与它们值的行为是分开的。尽管数字值不会改变，但你可以使用\
  \ `let` 绑定通过改变绑定指向的值来跟踪一个变化的数字。类似地，尽管一个指向对象的 `const` 绑定本身不能被改变，并且会继续指向同一个对象，但该对象的*内容*可能会改变。\n\
  \n```\nconst score = {visitors: 0, home: 0};\n\n// 这是可以的\n\nscore.visitors = 1;\n\
  \n// 这是不允许的\n\nscore = {visitors: 1, home: 1};\n```\n\n当你用 JavaScript 的 `==` 运算符比较对象时，它是按标识进行比较的：只有当两个对象是完全相同的值时，它才会返回\
  \ `true`。比较不同的对象会返回 `false`，即使它们具有完全相同的属性。JavaScript 中没有内置的“深度”比较操作来按内容比较对象，但你可以自己编写（这是本章末尾的练习之一）。\n\
  \n### 狼人的日志\n\n于是，雅克启动了他的 JavaScript 解释器，并设置了他记录日志所需的环境。\n\n```\nlet journal = [];\n\
  \nfunction addEntry(events, squirrel) {\n\n  journal.push({events, squirrel});\n\
  \n}\n```\n\n注意，添加到日志中的对象看起来有点奇怪。它没有像 `events: events` 那样声明属性，而是只给出了属性名。这是一种简写，意思相同——如果花括号表示法中的属性名后面没有跟值，则其值取自同名的绑定。\n\
  \n于是，每天晚上 10 点——或者有时是第二天早上，从书架顶层爬下来之后——雅克记录下当天的情况。\n\n```\naddEntry([\"work\", \"\
  touched tree\", \"pizza\", \"running\",\n\n          \"television\"], false);\n\n\
  addEntry([\"work\", \"ice cream\", \"cauliflower\", \"lasagna\",\n\n          \"\
  touched tree\", \"brushed teeth\"], false);\n\naddEntry([\"weekend\", \"cycling\"\
  , \"break\", \"peanuts\",\n\n          \"beer\"], true);\n```\n\n一旦他收集了足够的数据点，他打算用统计学来找出哪些事件可能与松鼠化有关。\n\
  \n*相关性*是衡量统计变量之间依赖关系的指标。统计变量与编程变量并不完全相同。在统计学中，你通常有一组*测量值*，每个变量都会针对每次测量进行测量。变量之间的相关性通常用一个从\
  \ –1 到 1 的值来表示。零相关意味着变量之间没有关系。相关性为 1 表示两者完全相关——如果你知道其中一个，也就知道了另一个。相关性为 –1 也表示变量完全相关，但它们是相反的——当一个为真时，另一个为假。\n\
  \n要计算两个布尔变量之间的相关性度量，我们可以使用*phi 系数*（*ϕ*）。这是一个公式，其输入是一个频率表，包含观察到的变量不同组合的次数。公式的输出是一个介于\
  \ –1 和 1 之间的数字，描述相关性。\n\n我们可以把吃披萨的事件放在这样一个频率表中，其中每个数字表示该组合在我们的测量中出现的次数：\n\n![Image](img/f0067-01.jpg)\n\
  \n如果我们把这个表称为 *n*，我们可以用以下公式计算 *ϕ*：\n\n![Image](img/equ4_1.jpg)\n\n\n\n（如果你现在正放下书，回想起十年级数学课的可怕经历——别急！我无意用一页页晦涩的符号折磨你——目前只有这一个公式。而且即便是这个公式，我们也不过是将它转换成\
  \ JavaScript 代码。）\n\n符号 `n[01]` 表示第一个变量（松鼠化）为假（0）且第二个变量（披萨）为真（1）的测量次数。在披萨表格中，`n[01]`\
  \ 等于 9。\n\n值 `n[1•]` 指的是第一个变量为真的所有测量次数之和，在示例表格中为 5。类似地，`n[•0]` 指的是第二个变量为假的测量次数之和。\n\
  \n因此对于披萨表格，除法线上方的部分（被除数）为 1 × 76 – 4 × 9 = 40，下方的部分（除数）为 5 × 85 × 10 × 80 的平方根，即\
  \ ![Image](img/c0067-01.jpg)。计算结果为 `ϕ ≈ 0.069`，非常小。吃披萨似乎对变形没有影响。\n\n### 计算相关性\n\n\
  我们可以用包含四个元素的数组（`[76, 9, 4, 1]`）在 JavaScript 中表示一个二乘二表格。也可以使用其他表示方式，例如包含两个二元数组的数组（`[[76,\
  \ 9], [4, 1]]`）或一个属性名为 `\"11\"` 和 `\"01\"` 的对象，但扁平数组更简单，且访问表格的表达式也简洁明了。我们将数组的索引解释为两位二进制数，其中最高位（最左边）代表松鼠变量，最低位（最右边）代表事件变量。例如，二进制数\
  \ `10` 表示 Jacques 确实变成了松鼠，但事件（比如“披萨”）没有发生。这种情况发生了四次。由于二进制 `10` 在十进制中是 2，我们将这个数字存储在数组的索引\
  \ 2 处。\n\n以下是从这样一个数组计算 `ϕ` 系数的函数：\n\n```javascript\nfunction phi(table) {\n  return\
  \ (table[3] * table[0] - table[2] * table[1]) /\n    Math.sqrt((table[2] + table[3])\
  \ *\n              (table[0] + table[1]) *\n              (table[1] + table[3])\
  \ *\n              (table[0] + table[2]));\n}\n\nconsole.log(phi([76, 9, 4, 1]));\n\
  // → 0.068599434\n```\n\n这是将 `ϕ` 公式直接翻译成 JavaScript。`Math.sqrt` 是平方根函数，由标准 JavaScript\
  \ 环境中的 `Math` 对象提供。我们需要将表格中的两个字段相加才能得到像 `n[1•]` 这样的值，因为行或列的总和并未直接存储在我们的数据结构中。\n\n\
  Jacques 记了三个月的日记。最终的数据集可在本章的编码沙箱（`https://eloquentjavascript.net/code#4`）中找到，它存储在\
  \ `JOURNAL` 绑定中，也可作为可下载文件获取。\n\n要从日记中提取某个特定事件的二乘二表格，我们需要遍历所有条目，统计该事件与松鼠变形同时发生的次数。\n\
  \n```javascript\nfunction tableFor(event, journal) {\n  let table = [0, 0, 0, 0];\n\
  \  for (let i = 0; i < journal.length; i++) {\n    let entry = journal[i], index\
  \ = 0;\n    if (entry.events.includes(event)) index += 1;\n    if (entry.squirrel)\
  \ index += 2;\n    table[index] += 1;\n  }\n  return table;\n}\n\nconsole.log(tableFor(\"\
  pizza\", JOURNAL));\n// → [76, 9, 4, 1]\n```\n\n数组有一个 `includes` 方法，用于检查给定值是否存在于数组中。该函数利用它来确定感兴趣的事件名称是否属于某一天的事件列表。\n\
  \n`tableFor` 中的循环体通过检查条目是否包含特定事件以及该事件是否与松鼠事件同时发生，来确定每个日记条目在表格中属于哪个格子。然后循环将表格中对应格子的值加一。\n\
  \n现在我们有了计算单个相关性所需的工具。剩下的唯一一步是找出记录中每种事件的相关性，看看是否有异常。\n\n### 数组循环\n\n在 `tableFor`\
  \ 函数中，有一个这样的循环：\n\n```javascript\nfor (let i = 0; i < JOURNAL.length; i++) {\n \
  \ let entry = JOURNAL[i];\n  // 对 entry 进行操作\n}\n```\n\n这种循环在经典 JavaScript 中很常见——逐个遍历数组元素是经常遇到的需求，为此你需要用一个计数器遍历数组长度，并依次取出每个元素。\n\
  \n在现代 JavaScript 中，有一种更简单的写法。\n\n```javascript\nfor (let entry of JOURNAL) {\n \
  \ console.log(`${entry.events.length} 个事件。`);\n}\n```\n\n当 `for` 循环写成这样，在变量定义后跟\
  \ `of` 关键字时，它会遍历 `of` 后面给出的值的元素。这不仅适用于数组，也适用于字符串和其他一些数据结构。我们将在第 6 章中讨论它的*工作原理*。\n\
  \n### 最终分析\n\n我们需要计算数据集中出现的每种事件的相关性。为此，我们首先需要*找出*所有事件类型。\n\n```javascript\nfunction\
  \ journalEvents(journal) {\n  let events = [];\n  for (let entry of journal) {\n\
  \    for (let event of entry.events) {\n      if (!events.includes(event)) {\n \
  \       events.push(event);\n      }\n    }\n  }\n  return events;\n}\n\nconsole.log(journalEvents(JOURNAL));\n\
  // → [\"carrot\", \"exercise\", \"weekend\", \"bread\", ...]\n```\n\n通过遍历所有事件，并将尚未出现在\
  \ `events` 数组中的事件添加进去，该函数收集了所有事件类型。\n\n利用这个，我们可以查看所有相关性。\n\n```javascript\nfor (let\
  \ event of journalEvents(JOURNAL)) {\n  console.log(event + \":\", phi(tableFor(event,\
  \ JOURNAL)));\n}\n// → carrot: 0.0140970969\n// → exercise: 0.0685994341\n// → weekend:\
  \ 0.1371988681\n// → bread: -0.0757554019\n// → pudding: -0.0648203724\n// 等等...\n\
  ```\n\n大多数相关性似乎都接近零。吃胡萝卜、面包或布丁显然不会触发松鼠狼人化。但周末似乎更常发生。让我们过滤结果，只显示大于 0.1 或小于 –0.1 的相关性。\n\
  \n```javascript\nfor (let event of journalEvents(JOURNAL)) {\n  let correlation\
  \ = phi(tableFor(event, JOURNAL));\n  if (correlation > 0.1 || correlation < -0.1)\
  \ {\n    console.log(event + \":\", correlation);\n  }\n}\n// → weekend:       \
  \   0.1371988681\n// → brushed teeth: -0.3805211953\n// → candy:            0.1296407447\n\
  // → work:            -0.1371988681\n// → spaghetti:        0.2425356250\n// → reading:\
  \          0.1106828054\n// → peanuts:          0.5902679812\n```\n\n啊哈！有两个因素的相关性明显强于其他因素。吃花生对变成松鼠的概率有很强的正向影响，而刷牙则有显著的负向影响。\n\
  \n有趣。让我们试试这个。\n\n```javascript\nfor (let entry of JOURNAL) {\n  if (entry.events.includes(\"\
  peanuts\") &&\n     !entry.events.includes(\"brushed teeth\")) {\n    entry.events.push(\"\
  peanut teeth\");\n  }\n}\n\nconsole.log(phi(tableFor(\"peanut teeth\", JOURNAL)));\n\
  // → 1\n```\n\n结果非常显著。这种现象恰好发生在 Jacques 吃了花生却没有刷牙的时候。要是他没那么邋遢，注意口腔卫生，他可能永远都不会注意到自己的怪病。\n\
  \n得知这一点后，Jacques 彻底戒掉了花生，并且发现他的变形不再出现了。\n\n几年里，Jacques 的日子过得不错。但后来他失业了。因为他住在一个糟糕的国家，没有工作就意味着没有医疗服务，他被迫去马戏团打工，扮演*不可思议的松鼠人*，每次表演前都要往嘴里塞满花生酱。\n\
  \n有一天，Jacques 厌倦了这种悲惨的生活，他没有变回人形，而是从马戏团帐篷的裂缝中跳了出去，消失在森林里。再也没有人见过他。\n\n### 更多数组知识\n\
  \n\n\n\n\n在结束本章之前，我想向你介绍几个与对象相关的概念。首先，我会介绍一些常用的数组方法。\n\n我们在第 62 页的“方法”一节中看到了`push`和`pop`，它们用于在数组末尾添加和删除元素。在数组开头添加和删除元素的对应方法叫做`unshift`和`shift`。\n\
  \n```\nlet todoList = [];\n\nfunction remember(task) {\n  todoList.push(task);\n\
  }\n\nfunction getTask() {\n  return todoList.shift();\n}\n\nfunction rememberUrgently(task)\
  \ {\n  todoList.unshift(task);\n}\n```\n\n这段程序管理着一个任务队列。你可以通过调用`remember(\"groceries\"\
  )`将任务添加到队列末尾，当你准备好做某事时，调用`getTask()`从队列前端获取（并移除）任务。`rememberUrgently`函数也会添加任务，但它是将任务添加到队列前端而非末尾。\n\
  \n为了搜索特定值，数组提供了`indexOf`方法。该方法从数组开头搜索到末尾，返回所请求值首次出现的索引——如果未找到则返回–1。如果要从末尾而非开头搜索，有一个类似的方法叫`lastIndexOf`。\n\
  \n```\nconsole.log([1, 2, 3, 2, 1].indexOf(2));\n// → 1\nconsole.log([1, 2, 3, 2,\
  \ 1].lastIndexOf(2));\n// → 3\n```\n\n`indexOf`和`lastIndexOf`都接受一个可选的第二个参数，用于指定搜索的起始位置。\n\
  \n另一个基本的数组方法是`slice`，它接受起始和结束索引，并返回一个仅包含两者之间元素的数组。起始索引包含在内，结束索引不包含在内。\n\n```\nconsole.log([0,\
  \ 1, 2, 3, 4].slice(2, 4));\n// → [2, 3]\nconsole.log([0, 1, 2, 3, 4].slice(2));\n\
  // → [2, 3, 4]\n```\n\n当未指定结束索引时，`slice`会取起始索引之后的所有元素。你也可以省略起始索引来复制整个数组。\n\n`concat`方法可用于将数组拼接在一起以创建新数组，类似于`+`运算符对字符串的作用。\n\
  \n下面的示例展示了`concat`和`slice`的实际应用。它接受一个数组和一个索引，并返回一个新数组，该数组是原数组的副本，但移除了给定索引处的元素。\n\
  \n```\nfunction remove(array, index) {\n  return array.slice(0, index)\n    .concat(array.slice(index\
  \ + 1));\n}\nconsole.log(remove([\"a\", \"b\", \"c\", \"d\", \"e\"], 2));\n// →\
  \ [\"a\", \"b\", \"d\", \"e\"]\n```\n\n如果你向`concat`传递一个非数组参数，该值将被添加到新数组中，就像它是一个单元素数组一样。\n\
  \n### 字符串及其属性\n\n我们可以从字符串值中读取`length`和`toUpperCase`等属性。但如果你尝试添加一个新属性，它不会保留。\n\n\
  ```\nlet kim = \"Kim\";\nkim.age = 88;\nconsole.log(kim.age);\n// → undefined\n\
  ```\n\n`string`、`number`和`Boolean`类型的值不是对象，尽管语言不会在你尝试为它们设置新属性时报错，但它实际上并不会存储这些属性。如前所述，这些值是不可变的，无法更改。\n\
  \n但这些类型确实有内置属性。每个字符串值都有许多方法。其中一些非常有用的方法是`slice`和`indexOf`，它们与同名的数组方法类似。\n\n```\n\
  console.log(\"coconuts\".slice(4, 7));\n// → nut\nconsole.log(\"coconut\".indexOf(\"\
  u\"));\n// → 5\n```\n\n一个区别是字符串的`indexOf`可以搜索包含多个字符的字符串，而对应的数组方法只查找单个元素。\n\n```\n\
  console.log(\"one two three\".indexOf(\"ee\"));\n// → 11\n```\n\n`trim`方法会移除字符串开头和结尾的空白字符（空格、换行符、制表符等）。\n\
  \n```\nconsole.log(\"   okay \\n \".trim());\n// → okay\n```\n\n上一章中的`zeroPad`函数也以方法的形式存在。它叫做`padStart`，接受所需长度和填充字符作为参数。\n\
  \n```\nconsole.log(String(6).padStart(3, \"0\"));\n// → 006\n```\n\n你可以使用`split`将字符串按另一个字符串的每次出现进行拆分，并使用`join`将其重新连接。\n\
  \n```\nlet sentence = \"Secretarybirds specialize in stomping\";\nlet words = sentence.split(\"\
  \ \");\nconsole.log(words);\n// → [\"Secretarybirds\", \"specialize\", \"in\", \"\
  stomping\"]\nconsole.log(words.join(\". \"));\n// → Secretarybirds. specialize.\
  \ in. stomping\n```\n\n字符串可以使用`repeat`方法重复，该方法创建一个新字符串，其中包含原始字符串的多个副本，并拼接在一起。\n\n\
  ```\nconsole.log(\"LA\".repeat(3));\n// → LALALA\n```\n\n我们已经见过字符串类型的`length`属性。访问字符串中的单个字符看起来像访问数组元素（但有一个注意事项，我们将在第\
  \ 92 页的“字符串与字符编码”中讨论）。\n\n```\nlet string = \"abc\";\nconsole.log(string.length);\n\
  // → 3\nconsole.log(string[1]);\n// → b\n```\n\n### 剩余参数\n\n函数接受任意数量的参数有时会很有用。例如，`Math.max`计算它收到的*所有*参数的最大值。\n\
  \n要编写这样的函数，你需要在函数的最后一个参数前加上三个点，像这样：\n\n```\nfunction max(...numbers) {\n  let result\
  \ = -Infinity;\n  for (let number of numbers) {\n    if (number > result) result\
  \ = number;\n  }\n  return result;\n}\nconsole.log(max(4, 1, 9, -2));\n// → 9\n\
  ```\n\n当调用这样的函数时，*剩余参数*会被绑定到一个包含所有剩余参数的数组上。如果它前面还有其他参数，这些参数的值不会包含在该数组中。当像`max`那样它是唯一参数时，它将包含所有参数。\n\
  \n你可以使用类似的三点符号来*调用*一个函数，并传入一个参数数组。\n\n```\nlet numbers = [5, 1, 7];\nconsole.log(max(...numbers));\n\
  // → 7\n```\n\n这会将数组“展开”到函数调用中，将其元素作为单独的参数传递。也可以像`max(9, ...numbers, 2)`这样将数组与其他参数一起包含进来。\n\
  \n方括号数组表示法同样允许使用三点运算符将另一个数组展开到新数组中。\n\n```\nlet words = [\"never\", \"fully\"];\n\
  console.log([\"will\", ...words, \"understand\"]);\n// → [\"will\", \"never\", \"\
  fully\", \"understand\"]\n```\n\n### Math 对象\n\n正如我们所见，`Math`是一个包含许多与数字相关的实用函数的集合，例如`Math.max`（最大值）、`Math.min`（最小值）和`Math.sqrt`（平方根）。\n\
  \n`Math`对象被用作一个容器来分组一系列相关功能。只有一个`Math`对象，它几乎从不作为值使用。相反，它提供了一个*命名空间*，这样所有这些函数和值就不必成为全局绑定。\n\
  \n拥有太多全局绑定会“污染”命名空间。被占用的名称越多，你意外覆盖某个现有绑定值的可能性就越大。例如，你很可能想在某个程序中命名一个`max`。由于 JavaScript\
  \ 内置的`max`函数被安全地封装在`Math`对象中，我们不必担心覆盖它。\n\n许多语言会在你定义一个已被占用的名称的绑定时阻止你，或者至少警告你。JavaScript\
  \ 对于你用`let`或`const`声明的绑定会这样做，但——反常地——对于标准绑定以及用`var`或`function`声明的绑定则不会。\n\n回到`Math`对象。如果你需要做三角学计算，`Math`可以帮忙。它包含`cos`（余弦）、`sin`（正弦）和`tan`（正切），以及它们的反函数`acos`、`asin`和`atan`。数字*π*（圆周率）——至少是\
  \ JavaScript 数字能表示的最接近的近似值——以`Math.PI`的形式提供。有一个古老的编程传统，即用全大写字母书写常量名称。\n\n```\nfunction\
  \ randomPointOnCircle(radius) {\n  let angle = Math.random() * 2 * Math.PI;\n  return\
  \ {x: radius * Math.cos(angle),\n          y: radius * Math.sin(angle)};\n}\nconsole.log(randomPointOnCircle(2));\n\
  // → {x: 0.3667, y: 1.966}\n```\n\n\n\n\n\n如果你对正弦和余弦不熟悉，也不用担心。当它们在本书的第 14 章中出现时，我会进行解释。\n\
  \n前面的例子使用了 `Math.random`。这是一个函数，每次调用时都会返回一个介于 0（包含）和 1（不包含）之间的新的伪随机数。\n\n```\nconsole.log(Math.random());\n\
  // → 0.36993729369714856\nconsole.log(Math.random());\n// → 0.727367032552138\n\
  console.log(Math.random());\n// → 0.40180766698904335\n```\n\n尽管计算机是确定性的机器——给定相同的输入，它们总是以相同的方式响应——但让它们产生看似随机的数字是可能的。为此，机器会保留一些隐藏的值，每当你请求一个新的随机数时，它会对这个隐藏值执行复杂的计算以生成一个新值。它存储新值，并返回从该值派生出的某个数字。这样，它就能以一种*看似*随机的方式不断产生新的、难以预测的数字。\n\
  \n如果我们想要一个整数随机数而不是小数，可以在 `Math.random` 的结果上使用 `Math.floor`（它会向下取整到最近的整数）。\n\n```\n\
  console.log(Math.floor(Math.random() * 10));\n// → 2\n```\n\n将随机数乘以 10 会得到一个大于等于\
  \ 0 且小于 10 的数。由于 `Math.floor` 向下取整，这个表达式会以相等的概率产生 0 到 9 之间的任意数字。\n\n还有函数 `Math.ceil`（表示“天花板”，向上取整到整数）、`Math.round`（四舍五入到最近的整数）和\
  \ `Math.abs`，它返回一个数的绝对值，即负数变为正数，正数保持不变。\n\n### 解构\n\n让我们暂时回到 phi 函数。\n\n```\nfunction\
  \ phi(table) {\n  return (table[3] * table[0] - table[2] * table[1]) /\n    Math.sqrt((table[2]\
  \ + table[3]) *\n              (table[0] + table[1]) *\n              (table[1]\
  \ + table[3]) *\n              (table[0] + table[2]));\n}\n```\n\n这个函数难以阅读的原因之一是，我们有一个绑定指向数组，但我们更希望有绑定指向数组的*元素*，即\
  \ `let n00 = table[0]` 等等。幸运的是，在 JavaScript 中有一种简洁的方法可以做到这一点。\n\n```\nfunction phi([n00,\
  \ n01, n10, n11]) {\n  return (n11 * n00 - n10 * n01) /\n    Math.sqrt((n10 + n11)\
  \ * (n00 + n01) *\n              (n01 + n11) * (n00 + n10));\n}\n```\n\n这也适用于使用\
  \ `let`、`var` 或 `const` 创建的绑定。如果你知道要绑定的值是一个数组，你可以使用方括号来“窥视”该值的内部，从而绑定其内容。\n\n类似的方法也适用于对象，只不过使用花括号代替方括号。\n\
  \n```\nlet {name} = {name: \"Faraji\", age: 23};\nconsole.log(name);\n// → Faraji\n\
  ```\n\n请注意，如果你尝试解构 `null` 或 `undefined`，会得到一个错误，就像你直接尝试访问这些值的属性一样。\n\n### JSON\n\
  \n由于属性只是*抓取*它们的值，而不是包含它们，对象和数组在计算机内存中存储为一系列比特位，这些比特位保存着其内容的*地址*（即内存中的位置）。因此，一个包含另一个数组的数组由（至少）两个内存区域组成：一个用于内部数组，另一个用于外部数组，外部数组包含（除其他内容外）一个表示内部数组位置的二进制数。\n\
  \n如果你想将数据保存到文件中以便以后使用，或者通过网络发送到另一台计算机，你必须以某种方式将这些内存地址的纠缠转换为可以存储或发送的描述。我猜，你可以将整个计算机内存连同你感兴趣值的地址一起发送过去，但这似乎不是最好的方法。\n\
  \n我们可以做的是对数据进行*序列化*。这意味着将其转换为一种扁平的描述。一种流行的序列化格式称为 *JSON*（发音为“Jason”），它代表 JavaScript\
  \ 对象表示法。它被广泛用作 Web 上的数据存储和通信格式，甚至用于 JavaScript 以外的语言。\n\nJSON 看起来类似于 JavaScript\
  \ 编写数组和对象的方式，但有一些限制。所有属性名称都必须用双引号括起来，并且只允许简单的数据表达式——不允许函数调用、绑定或任何涉及实际计算的内容。JSON\
  \ 中不允许有注释。\n\n一个日记条目在表示为 JSON 数据时可能如下所示：\n\n```\n{\n    \"squirrel\": false,\n \
  \   \"events\": [\"work\", \"touched tree\", \"pizza\", \"running\"]\n}\n```\n\n\
  JavaScript 提供了函数 `JSON.stringify` 和 `JSON.parse` 来在数据和这种格式之间进行转换。第一个函数接受一个 JavaScript\
  \ 值并返回一个 JSON 编码的字符串。第二个函数接受这样一个字符串并将其转换为它所编码的值。\n\n```\nlet string = JSON.stringify({squirrel:\
  \ false,\n                             events: [\"weekend\"]});\nconsole.log(string);\n\
  // → {\"squirrel\":false,\"events\":[\"weekend\"]}\nconsole.log(JSON.parse(string).events);\n\
  // → [\"weekend\"]\n```\n\n### 总结\n\n对象和数组（数组是一种特殊的对象）提供了将多个值组合成单个值的方法。从概念上讲，这允许我们将一堆相关的东西放进一个袋子里，然后带着袋子到处跑，而不是用胳膊搂住所有单个的东西并试图分别抓住它们。\n\
  \nJavaScript 中的大多数值都有属性，例外是 `null` 和 `undefined`。属性通过 `value.prop` 或 `value[\"prop\"\
  ]` 访问。对象倾向于为属性使用名称，并存储或多或少固定的一组属性。另一方面，数组通常包含数量可变的、概念上相同的值，并使用数字（从 0 开始）作为其属性的名称。\n\
  \n数组中确实有一些命名属性，例如 `length` 和许多方法。方法是存在于属性中的函数，并且（通常）作用于它们所属的值。\n\n你可以使用一种特殊的 for\
  \ 循环来遍历数组——`for (let element of array)`。\n\n### 练习\n\n#### *范围求和*\n\n本书的引言中提到了一种计算数字范围之和的好方法：\n\
  \n`console.log(sum(range(1, 10)));`\n\n编写一个 `range` 函数，它接受两个参数 `start` 和 `end`，并返回一个包含从\
  \ `start` 到 `end`（包括 `end`）所有数字的数组。\n\n接下来，编写一个 `sum` 函数，它接受一个数字数组并返回这些数字的总和。运行示例程序，看看它是否确实返回\
  \ 55。\n\n作为附加任务，修改你的 `range` 函数，使其接受一个可选的第三个参数，该参数指示构建数组时使用的“步长”值。如果没有给出步长，元素按增量\
  \ 1 递增，对应于旧的行为。函数调用 `range(1, 10, 2)` 应返回 `[1, 3, 5, 7, 9]`。确保它也能处理负的步长值，以便 `range(5,\
  \ 2, -1)` 产生 `[5, 4, 3, 2]`。\n\n#### *反转数组*\n\n数组有一个 `reverse` 方法，通过反转元素出现的顺序来改变数组。对于这个练习，编写两个函数：`reverseArray`\
  \ 和 `reverseArrayInPlace`。第一个函数 `reverseArray` 接受一个数组作为参数，并生成一个*新*数组，该数组包含相同元素但顺序相反。第二个函数\
  \ `reverseArrayInPlace` 执行与 `reverse` 方法相同的操作：它通过反转元素来*修改*作为参数给出的数组。两者都不能使用标准的 `reverse`\
  \ 方法。\n\n回想一下第 54 页“函数与副作用”中关于副作用和纯函数的笔记，你认为哪种变体在更多情况下更有用？哪种运行速度更快？\n\n#### *列表*\n\
  \n对象作为通用的值块，可以用来构建各种数据结构。一种常见的数据结构是*列表*（不要与数组混淆）。列表是一组嵌套的对象，第一个对象持有对第二个对象的引用，第二个对象持有对第三个对象的引用，依此类推。\n\
  \n```\nlet list = {\n   value: 1,\n   rest: {\n```\n\n\n\n\n```\n{\n  value: 2,\n\
  \  rest: {\n    value: 3,\n    rest: null\n  }\n}\n```\n\n生成的对象形成一个链，就像这样：\n\n![图片](img/f0079-01.jpg)\n\
  \n列表的一个好处是它们可以共享部分结构。例如，如果我创建两个新值 `{value: 0, rest: list}` 和 `{value: -1, rest:\
  \ list}`（其中 `list` 指向之前定义的绑定），它们都是独立的列表，但共享构成最后三个元素的结构。原始列表仍然是一个有效的三元素列表。\n\n编写一个函数\
  \ `arrayToList`，当给定 `[1, 2, 3]` 作为参数时，构建出类似上面所示的列表结构。同时编写一个 `listToArray` 函数，从列表生成数组。然后添加一个辅助函数\
  \ `prepend`，它接受一个元素和一个列表，并创建一个新列表，将该元素添加到输入列表的前面；以及 `nth`，它接受一个列表和一个数字，并返回列表中给定位置的元素（零表示第一个元素），如果不存在这样的元素则返回\
  \ `undefined`。\n\n如果你还没有这样做，也请编写一个递归版本的 `nth`。\n\n#### 深度比较\n\n`==` 运算符通过标识比较对象。但有时你更希望比较它们实际属性的值。\n\
  \n编写一个函数 `deepEqual`，它接受两个值，只有当它们是同一个值，或者是具有相同属性的对象，并且这些属性的值通过递归调用 `deepEqual` 比较相等时，才返回\
  \ `true`。\n\n要判断值是应该直接比较（使用 `===` 运算符）还是应该比较它们的属性，你可以使用 `typeof` 运算符。如果它对两个值都产生\
  \ `\"object\"`，那么你应该进行深度比较。但你必须考虑一个愚蠢的例外：由于历史原因，`typeof null` 也会产生 `\"object\"`。\n\
  \n当你需要遍历对象的属性进行比较时，`Object.keys` 函数会很有用。\n\n“有两种构建软件设计的方法：一种是使其简单到明显没有缺陷，另一种是使其复杂到没有明显的缺陷。”\n\
  \n—— C.A.R. Hoare，*1980 年 ACM 图灵奖演讲*\n\n![图片](img/f0082-01.jpg)\n\n## 5 高阶函数\n\n\
  大型程序是昂贵的程序，不仅仅是因为构建它所花费的时间。规模几乎总是伴随着复杂性，而复杂性会让程序员感到困惑。困惑的程序员反过来会在程序中引入错误（*bug*）。大型程序为这些\
  \ bug 提供了大量隐藏空间，使它们难以被发现。\n\n让我们简要回顾一下引言中的最后两个示例程序。第一个是自包含的，有六行代码。\n\n```\nlet total\
  \ = 0, count = 1;\nwhile (count <= 10) {\n  total += count;\n  count += 1;\n}\n\
  console.log(total);\n```\n\n第二个依赖于两个外部函数，只有一行代码。\n\n```\nconsole.log(sum(range(1,\
  \ 10)));\n```\n\n哪一个更可能包含 bug？\n\n如果我们计算 `sum` 和 `range` 定义的大小，第二个程序也很大——甚至比第一个还大。但我仍然认为它更可能是正确的。\n\
  \n它更可能是正确的，因为解决方案是用与所解决问题相对应的词汇表达的。对一系列数字求和与循环和计数器无关，而是关于范围和求和。\n\n这些词汇的定义（函数 `sum`\
  \ 和 `range`）仍然会涉及循环、计数器和其他附带细节。但由于它们表达的概念比整个程序更简单，因此更容易做到正确。\n\n### 抽象\n\n在编程语境中，这类词汇通常被称为*抽象*。抽象隐藏了细节，使我们能够在更高（或更抽象）的层面上讨论问题。\n\
  \n作为类比，比较一下豌豆汤的两种食谱。第一种是这样的：\n\n将每人 1 杯干豌豆放入容器中。加水直到豌豆完全被覆盖。将豌豆在水中浸泡至少 12 小时。将豌豆从水中取出，放入烹饪锅中。每人加\
  \ 4 杯水。盖上锅盖，让豌豆慢炖两小时。每人取半个洋葱。用刀切成块。加入豌豆中。每人取一根芹菜茎。用刀切成块。加入豌豆中。每人取一根胡萝卜。切成块。用刀！加入豌豆中。再煮\
  \ 10 分钟。\n\n这是第二种食谱：\n\n每人：1 杯干裂豌豆，半个切碎的洋葱，一根芹菜茎，一根胡萝卜。\n\n将豌豆浸泡 12 小时。在 4 杯水（每人）中慢炖\
  \ 2 小时。切碎并加入蔬菜。再煮 10 分钟。\n\n第二种更简短，更容易理解。但你需要理解更多与烹饪相关的词汇，例如*浸泡、慢炖、切碎*，以及，我想，*蔬菜*。\n\
  \n在编程时，我们不能指望所有需要的词汇都在字典里等着我们。因此，我们可能会陷入第一种食谱的模式——逐一计算出计算机必须执行的精确步骤，而对它们所表达的更高层次概念视而不见。\n\
  \n在编程中，注意到自己正在过低的抽象层次上工作是一项有用的技能。\n\n### 抽象重复\n\n到目前为止，我们看到的普通函数是构建抽象的好方法。但有时它们也有不足。\n\
  \n程序经常需要重复执行某个操作一定次数。你可以为此编写一个 `for` 循环，就像这样：\n\n```\nfor (let i = 0; i < 10; i++)\
  \ {\n  console.log(i);\n}\n```\n\n我们能否将“执行某事 *N* 次”抽象为一个函数？嗯，编写一个调用 `console.log`\
  \ *N* 次的函数很容易。\n\n```\nfunction repeatLog(n) {\n  for (let i = 0; i < n; i++) {\n\
  \    console.log(i);\n  }\n}\n```\n\n但如果我们想做的不仅仅是记录数字呢？由于“做某事”可以表示为一个函数，而函数只是值，我们可以将我们的动作作为函数值传递。\n\
  \n```\nfunction repeat(n, action) {\n  for (let i = 0; i < n; i++) {\n    action(i);\n\
  \  }\n}\n\nrepeat(3, console.log);\n// → 0\n// → 1\n// → 2\n```\n\n我们不必向 `repeat`\
  \ 传递预定义的函数。通常，当场创建一个函数值更容易。\n\n```\nlet labels = [];\nrepeat(5, i => {\n  labels.push(`Unit\
  \ ${i + 1}`);\n});\nconsole.log(labels);\n// → [\"Unit 1\", \"Unit 2\", \"Unit 3\"\
  , \"Unit 4\", \"Unit 5\"]\n```\n\n这有点像 `for` 循环的结构——它首先描述了循环的类型，然后提供了一个主体。然而，主体现在被写成一个函数值，它被包裹在对\
  \ `repeat` 调用的括号中。这就是为什么它必须用右花括号*和*右括号闭合。在像这个例子这样主体是一个小表达式的情况下，你也可以省略花括号，将循环写在一行上。\n\
  \n### 高阶函数\n\n操作其他函数的函数，无论是通过将它们作为参数还是返回它们，都被称为*高阶函数*。既然我们已经看到函数是常规值，那么存在这样的函数并没有什么特别值得注意的。这个术语来自数学，在数学中，函数和其他值之间的区别被更严格地对待。\n\
  \n高阶函数允许我们抽象*动作*，而不仅仅是值。它们有多种形式。例如，我们可以有创建新函数的函数。\n\n```\nfunction greaterThan(n)\
  \ {\n  return m => m > n;\n}\nlet greaterThan10 = greaterThan(10);\nconsole.log(greaterThan10(11));\n\
  // → true\n```\n\n我们还可以有改变其他函数的函数。\n\n```\nfunction noisy(f) {\n  return (...args)\
  \ => {\n    console.log(\"calling with\", args);\n    let result = f(...args);\n\
  \    console.log(\"called with\", args, \", returned\", result);\n    return result;\n\
  \  };\n}\nnoisy(Math.min)(3, 2, 1);\n// → calling with [3, 2, 1]\n```\n\n\n\n\n\n\
  // → 使用 [3, 2, 1] 调用，返回 1\n\n我们甚至可以编写提供新型控制流的函数。\n\n```\nfunction unless(test, then)\
  \ {\n  if (!test) then();\n}\n\nrepeat(3, n => {\n  unless(n % 2 == 1, () => {\n\
  \    console.log(n, \"is even\");\n  });\n});\n// → 0 is even\n// → 2 is even\n\
  ```\n\n有一个内置的数组方法 `forEach`，它提供了一种类似 `for/of` 循环的高阶函数形式。\n\n```\n[\"A\", \"B\"].forEach(l\
  \ => console.log(l));\n// → A\n// → B\n```\n\n### 脚本数据集\n\n高阶函数大放异彩的一个领域是数据处理。要处理数据，我们需要一些实际的数据。本章将使用一个关于脚本的数据集——即书写系统，如拉丁文、西里尔文或阿拉伯文。\n\
  \n还记得第 1 章中的 Unicode 吗？那个为书面语言中的每个字符分配一个数字的系统。这些字符中的大多数都与特定的脚本相关联。该标准包含 140 种不同的脚本——其中\
  \ 81 种至今仍在使用，59 种是历史性的。\n\n虽然我只能流利地阅读拉丁字符，但我很欣赏人们至少使用 80 种其他书写系统进行写作，其中许多我甚至认不出来。例如，这是一段泰米尔语手写样本：\n\
  \n![图片](img/f0087-01.jpg)\n\n示例数据集包含关于 Unicode 中定义的 140 种脚本的一些信息。它可以在本章的编码沙盒（*[`eloquentjavascript.net/code#5`](https://eloquentjavascript.net/code#5)*）中以\
  \ `SCRIPTS` 绑定的形式获得。该绑定包含一个对象数组，每个对象描述一个脚本。\n\n```\n{\n   name: \"Coptic\",\n  \
  \ ranges: [[994, 1008], [11392, 11508], [11513, 11520]],\n   direction: \"ltr\"\
  ,\n   year: -200,\n   living: false,\n   link: \"https://en.wikipedia.org/wiki/Coptic_alphabet\"\
  \n}\n```\n\n这样的对象告诉我们脚本的名称、分配给它的 Unicode 范围、书写方向、（大约）起源时间、是否仍在使用以及更多信息的链接。方向可以是\
  \ `\"ltr\"`（从左到右）、`\"rtl\"`（从右到左，阿拉伯语和希伯来语文本的书写方式）或 `\"ttb\"`（从上到下，如蒙古文书写）。\n\n\
  `ranges` 属性包含一个 Unicode 字符范围数组，每个范围是一个包含下限和上限的双元素数组。这些范围内的任何字符代码都分配给该脚本。下限是包含的（代码\
  \ 994 是一个科普特字符），上限是不包含的（代码 1008 不是）。\n\n### 过滤数组\n\n要找出数据集中仍在使用的脚本，以下函数可能会有所帮助。它过滤掉数组中未通过测试的元素。\n\
  \n```\nfunction filter(array, test) {\n  let passed = [];\n  for (let element of\
  \ array) {\n    if (test(element)) {\n      passed.push(element);\n    }\n  }\n\
  \  return passed;\n}\n\nconsole.log(filter(SCRIPTS, script => script.living));\n\
  // → [{name: \"Adlam\", ...}, ...]\n```\n\n该函数使用名为 `test` 的参数（一个函数值）来填充计算中的“空白”——即决定收集哪些元素的过程。\n\
  \n注意 `filter` 函数不是从现有数组中删除元素，而是构建一个仅包含通过测试的元素的新数组。这个函数是*纯*的。它不会修改给定的数组。\n\n与 `forEach`\
  \ 一样，`filter` 是一个标准的数组方法。示例中定义该函数只是为了展示其内部工作原理。从现在开始，我们将这样使用它：\n\n```\nconsole.log(SCRIPTS.filter(s\
  \ => s.direction == \"ttb\"));\n// → [{name: \"Mongolian\", ...}, ...]\n```\n\n\
  ### 使用 map 进行转换\n\n假设我们有一个表示脚本的对象数组，是通过某种方式过滤 `SCRIPTS` 数组得到的。但我们想要一个名称数组，这样更容易检查。\n\
  \n`map` 方法通过将一个函数应用于所有元素，并根据返回的值构建一个新数组来转换数组。新数组的长度与输入数组相同，但其内容已被函数*映射*为新的形式。\n\n\
  ```\nfunction map(array, transform) {\n  let mapped = [];\n  for (let element of\
  \ array) {\n    mapped.push(transform(element));\n  }\n  return mapped;\n}\n\nlet\
  \ rtlScripts = SCRIPTS.filter(s => s.direction == \"rtl\");\nconsole.log(map(rtlScripts,\
  \ s => s.name));\n// → [\"Adlam\", \"Arabic\", \"Imperial Aramaic\", ...]\n```\n\
  \n与 `forEach` 和 `filter` 一样，`map` 是一个标准的数组方法。\n\n### 使用 reduce 进行汇总\n\n对数组进行的另一个常见操作是从中计算单个值。我们反复出现的例子——对一组数字求和——就是这种情况的一个实例。另一个例子是找出字符最多的脚本。\n\
  \n表示这种模式的高阶操作称为 *reduce*（有时也称为 *fold*）。它通过反复从数组中取出单个元素并将其与当前值组合来构建一个值。在对数字求和时，你会从数字零开始，然后对每个元素将其加到总和上。\n\
  \n`reduce` 的参数除了数组之外，还有一个组合函数和一个起始值。这个函数比 `filter` 和 `map` 稍微复杂一些，所以请仔细看看：\n\n```\n\
  function reduce(array, combine, start) {\n  let current = start;\n  for (let element\
  \ of array) {\n    current = combine(current, element);\n  }\n  return current;\n\
  }\n\nconsole.log(reduce([1, 2, 3, 4], (a, b) => a + b, 0));\n// → 10\n```\n\n标准的数组方法\
  \ `reduce`（当然与这个函数对应）有一个额外的便利之处。如果你的数组至少包含一个元素，你可以省略 `start` 参数。该方法会将数组的第一个元素作为起始值，并从第二个元素开始归约。\n\
  \n```\nconsole.log([1, 2, 3, 4].reduce((a, b) => a + b));\n// → 10\n```\n\n要使用 `reduce`（两次）来找出字符最多的脚本，我们可以这样写：\n\
  \n```\nfunction characterCount(script) {\n  return script.ranges.reduce((count,\
  \ [from, to]) => {\n    return count + (to - from);\n  }, 0);\n}\n\nconsole.log(SCRIPTS.reduce((a,\
  \ b) => {\n  return characterCount(a) < characterCount(b) ? b : a;\n}));\n// → {name:\
  \ \"Han\", ...}\n```\n\n`characterCount` 函数通过求和范围的大小来归约分配给脚本的范围。注意在归约函数的参数列表中使用了解构。然后第二次调用\
  \ `reduce` 通过反复比较两个脚本并返回较大的那个来找出最大的脚本。\n\n汉字脚本在 Unicode 标准中分配了超过 89,000 个字符，使其成为数据集中最大的书写系统。汉字是一种（有时）用于中文、日文和韩文文本的脚本。这些语言共享许多字符，尽管它们往往以不同的方式书写。（位于美国的）Unicode\
  \ 联盟决定将它们视为一个单一的书写系统以节省字符编码。这被称为*汉字统一*，至今仍让一些人非常恼火。\n\n### 可组合性\n\n考虑一下如果没有高阶函数，我们将如何编写前面的示例（找出最大的脚本）。代码并没有差太多。\n\
  \n```\nlet biggest = null;\nfor (let script of SCRIPTS) {\n  if (biggest == null\
  \ ||\n      characterCount(biggest) < characterCount(script)) {\n    biggest = script;\n\
  \  }\n}\nconsole.log(biggest);\n// → {name: \"Han\", ...}\n```\n\n多了几个绑定，程序也长了四行。但它仍然非常易读。\n\
  \n当你需要*组合*操作时，高阶函数开始大放异彩。举个例子，让我们编写代码来找出数据集中现存和已消亡脚本的平均起源年份。\n\n```\nfunction average(array)\
  \ {\n  return array.reduce((a, b) => a + b) / array.length;\n}\n\nconsole.log(Math.round(average(\n\
  \  SCRIPTS.filter(s => s.living).map(s => s.year))));\n// → 1165\n\nconsole.log(Math.round(average(\n\
  \  SCRIPTS.filter(s => !s.living).map(s => s.year))));\n// → 188\n```\n\n\n\n\n\
  因此，Unicode 中的已消亡文字平均比现存文字更古老。这并非一个特别有意义或令人惊讶的统计数据。但我希望你会同意，用于计算它的代码并不难读懂。你可以将其视为一个管道：我们从所有文字开始，过滤出现存（或已消亡）的文字，从中提取年份，计算平均值，然后四舍五入得到结果。\n\
  \n你当然也可以将这个计算写成一个大的循环。\n\n```\nlet total = 0, count = 0;\n\nfor (let script of SCRIPTS)\
  \ {\n\n  if (script.living) {\n\n    total += script.year;\n\n    count += 1;\n\n\
    }\n\n}\n\nconsole.log(Math.round(total / count));\n\n// → 1188\n```\n\n但这样更难看出计算的内容和方式。而且由于中间结果没有表示为连贯的值，要将类似平均值这样的计算提取为单独的函数会麻烦得多。\n\
  \n从计算机实际执行的角度来看，这两种方法也相当不同。第一种方法在运行 `filter` 和 `map` 时会构建新数组，而第二种方法只计算一些数字，工作量更少。通常你可以采用更易读的方式，但如果你要处理巨大的数组，并且多次这样做，那么较不抽象的写法可能值得换取额外的速度。\n\
  \n### 字符串与字符代码\n\n该数据集的一个用途是判断一段文本使用了哪种文字。让我们来看一个实现此功能的程序。\n\n请记住，每种文字都关联着一个字符代码范围数组。因此，给定一个字符代码，我们可以使用类似下面的函数来找到对应的文字（如果有的话）：\n\
  \n```\nfunction characterScript(code) {\n\n  for (let script of SCRIPTS) {\n\n    if\
  \ (script.ranges.some(([from, to]) => {\n\n      return code >= from && code < to;\n\
  \n    })) {\n\n      return script;\n\n    }\n\n  }\n\n  return null;\n\n}\n\nconsole.log(characterScript(121));\n\
  \n// → {name: \"Latin\", ...}\n```\n\n`some` 方法是另一个高阶函数。它接受一个测试函数，并告诉你该函数是否对数组中的任意一个元素返回\
  \ true。\n\n但是，我们如何获取字符串中的字符代码呢？\n\n在第 1 章中，我提到 JavaScript 字符串被编码为一系列 16 位数字。这些数字被称为*码元*。最初，一个\
  \ Unicode 字符代码应该能容纳在一个这样的单元中（这给你大约 65,000 个字符）。当人们意识到这不够用时，许多人反对每个字符使用更多内存。为了解决这些问题，JavaScript\
  \ 字符串使用的格式 UTF-16 被发明出来。它用单个 16 位码元描述大多数常见字符，但对其他字符则使用两个这样的码元。\n\n如今，UTF-16 通常被认为是一个糟糕的主意。它似乎几乎是故意设计来引发错误的。很容易写出将码元和字符视为同一事物的程序。如果你的语言不使用双码元字符，那么程序看起来运行得很好。但一旦有人尝试用这样的程序处理一些不常见的汉字，它就会崩溃。幸运的是，随着表情符号的出现，每个人都开始使用双码元字符，处理这类问题的负担也得以更公平地分配。\n\
  \n不幸的是，JavaScript 字符串上的常见操作，例如通过 `length` 属性获取长度以及使用方括号访问其内容，都只处理码元。\n\n```\n//\
  \ 两个表情符号字符，马和鞋\n\nlet horseShoe = \"![Image](img/c0093-04.jpg)\";\n\nconsole.log(horseShoe.length);\n\
  \n// → 4\n\nconsole.log(horseShoe[0]);\n\n// → (无效的半字符)\n\nconsole.log(horseShoe.charCodeAt(0));\n\
  \n// → 55357 (半字符的代码)\n\nconsole.log(horseShoe.codePointAt(0));\n\n// → 128052 (马表情符号的实际代码)\n\
  ```\n\nJavaScript 的 `charCodeAt` 方法返回一个码元，而不是完整的字符代码。后来添加的 `codePointAt` 方法则返回完整的\
  \ Unicode 字符。因此我们可以用它从字符串中获取字符。但传递给 `codePointAt` 的参数仍然是码元序列中的索引。所以，要遍历字符串中的所有字符，我们仍然需要处理一个字符占用一个还是两个码元的问题。\n\
  \n在第 69 页的“数组循环”中，我提到 `for/of` 循环也可以用于字符串。与 `codePointAt` 一样，这种循环是在人们深刻意识到 UTF-16\
  \ 问题的时候引入的。当你用它遍历字符串时，它返回的是真正的字符，而不是码元。\n\n```\nlet roseDragon = \"![Image](img/c0093-01.jpg)\"\
  ;\n\nfor (let char of roseDragon) {\n\n  console.log(char);\n\n}\n\n// → ![Image](img/c0093-02.jpg)\n\
  \n// → ![Image](img/c0093-03.jpg)\n```\n\n如果你有一个字符（它将是一个由一个或两个码元组成的字符串），你可以使用 `codePointAt(0)`\
  \ 来获取它的代码。\n\n### 识别文本\n\n我们有了 `characterScript` 函数和正确遍历字符的方法。下一步是统计属于每种文字的字符数量。下面的计数抽象将很有用：\n\
  \n```\nfunction countBy(items, groupName) {\n\nlet counts = [];\n\nfor (let item\
  \ of items) {\n\n  let name = groupName(item);\n\n  let known = counts.findIndex(c\
  \ => c.name == name);\n\n  if (known == -1) {\n\n    counts.push({name, count: 1});\n\
  \n  } else {\n\n    counts[known].count++;\n\n  }\n\n}\n\n   return counts;\n\n\
  }\n\nconsole.log(countBy([1, 2, 3, 4, 5], n => n > 2));\n\n// → [{name: false, count:\
  \ 2}, {name: true, count: 3}]\n```\n\n`countBy` 函数接受一个集合（任何可以用 `for/of` 循环遍历的东西）和一个为给定元素计算组名的函数。它返回一个对象数组，每个对象命名一个组并告诉你该组中找到了多少个元素。\n\
  \n它使用了另一个数组方法——`findIndex`。这个方法有点像 `indexOf`，但它不是查找特定值，而是找到第一个使给定函数返回 true 的值。与\
  \ `indexOf` 一样，如果没有找到这样的元素，它返回 –1。\n\n使用 `countBy`，我们可以编写一个函数，告诉我们一段文本中使用了哪些文字。\n\
  \n```\nfunction textScripts(text) {\n\n  let scripts = countBy(text, char => {\n\
  \n    let script = characterScript(char.codePointAt(0));\n\n    return script ?\
  \ script.name : \"none\";\n\n  }).filter(({name}) => name != \"none\");\n\n  let\
  \ total = scripts.reduce((n, {count}) => n + count, 0);\n\n  if (total == 0) return\
  \ \"No scripts found\";\n\n  return scripts.map(({name, count}) => {\n\n    return\
  \ `${Math.round(count * 100 / total)}% ${name}`;\n\n  }).join(\", \");\n\n}\n\n\
  console.log(textScripts(![Image](img/c0094-01.jpg)));\n\n// → 61% Han, 22% Latin,\
  \ 17% Cyrillic\n```\n\n该函数首先按名称统计字符，使用 `characterScript` 为它们分配名称，对于不属于任何文字的字符则回退到字符串\
  \ \"none\"。`filter` 调用从结果数组中删除 \"none\" 条目，因为我们不关心这些字符。\n\n为了能够计算百分比，我们首先需要属于某种文字的字符总数，这可以通过\
  \ `reduce` 计算。如果没有找到这样的字符，函数返回一个特定字符串。否则，它使用 `map` 将计数条目转换为可读的字符串，然后用 `join` 将它们组合起来。\n\
  \n### 总结\n\n能够将函数值传递给其他函数是 JavaScript 一个非常实用的特性。它允许我们编写带有“缺口”的计算模型函数。调用这些函数的代码可以通过提供函数值来填补这些缺口。\n\
  \n\n\n\n\n`Arrays` 提供了一系列有用的高阶方法。你可以使用 `forEach` 遍历数组中的元素。`filter` 方法返回一个新数组，其中只包含通过谓词函数的元素。通过\
  \ `map` 可以将每个元素传入一个函数来转换数组。你可以使用 `reduce` 将数组中的所有元素合并为单个值。`some` 方法测试是否有任何元素匹配给定的谓词函数。而\
  \ `findIndex` 则找到第一个匹配谓词的元素的索引。\n\n### 练习\n\n#### *扁平化*\n\n结合使用 `reduce` 方法和 `concat`\
  \ 方法，将嵌套数组“扁平化”为一个包含所有原始数组元素的单一数组。\n\n#### *你自己的循环*\n\n编写一个高阶函数 `loop`，它提供类似 `for`\
  \ 循环语句的功能。该函数接受一个值、一个测试函数、一个更新函数和一个主体函数。每次迭代，它首先对当前循环值运行测试函数，如果返回 `false` 则停止。然后调用主体函数，传入当前值。最后，调用更新函数创建一个新值，并从开头重新开始。\n\
  \n在定义该函数时，你可以使用常规循环来实现实际的循环。\n\n#### *一切*\n\n与 `some` 方法类似，数组也有一个 `every` 方法。当给定函数对数组中的*每一个*元素都返回\
  \ `true` 时，该方法返回 `true`。从某种意义上说，`some` 是作用于数组的 `||` 运算符版本，而 `every` 则类似于 `&&` 运算符。\n\
  \n将 `every` 实现为一个函数，它接受一个数组和一个谓词函数作为参数。编写两个版本：一个使用循环，另一个使用 `some` 方法。\n\n#### *主导书写方向*\n\
  \n编写一个函数，计算文本字符串中的主导书写方向。请记住，每个脚本对象都有一个 `direction` 属性，其值可以是 `\"ltr\"`（从左到右）、`\"\
  rtl\"`（从右到左）或 `\"ttb\"`（从上到下）。\n\n主导方向是指大多数具有关联脚本的字符的方向。本章前面定义的 `characterScript`\
  \ 和 `countBy` 函数可能在此处有用。\n\n“抽象数据类型是通过编写一种特殊程序来实现的……该程序根据可对其执行的操作来定义类型。”\n\n——芭芭拉·利斯科夫，《使用抽象数据类型编程》\n\
  \n![图片](img/f0096-01.jpg)\n\n## 6\n\n对象的秘密生活\n\n第 4 章 介绍了 JavaScript 的对象。在编程文化中，有一种称为*面向对象编程*的东西，它是一组使用对象（及相关概念）作为程序组织核心原则的技术。\n\
  \n尽管没有人对其精确定义达成一致，但面向对象编程已经塑造了许多编程语言的设计，包括 JavaScript。本章将描述如何将这些思想应用于 JavaScript。\n\
  \n### 封装\n\n面向对象编程的核心思想是将程序划分为较小的部分，并使每个部分负责管理自己的状态。这样，关于程序某一部分工作方式的一些知识可以保持*局部*于该部分。处理程序其余部分的人不必记住甚至不必知道这些知识。每当这些局部细节发生变化时，只需要更新直接围绕它的代码。\n\
  \n程序的这些不同部分通过*接口*相互交互，接口是有限的函数或绑定集合，它们在更抽象的层面上提供有用的功能，隐藏其具体实现。\n\n这样的程序片段使用对象进行建模。它们的接口由一组特定的方法和属性组成。属于接口的属性称为*公共*属性。其他外部代码不应触及的属性称为*私有*属性。\n\
  \n许多语言提供了区分公共和私有属性的方法，并完全阻止外部代码访问私有属性。JavaScript 再次采取了极简主义的方法，至少目前还没有这样做。目前正在努力将其添加到语言中。\n\
  \n尽管语言本身没有内置这种区分，但 JavaScript 程序员*确实*成功地使用了这一思想。通常，可用的接口会在文档或注释中描述。常见的做法是在属性名称的开头添加下划线字符（`_`）以表示这些属性是私有的。\n\
  \n将接口与实现分离是一个好主意。这通常被称为*封装*。\n\n### 方法\n\n方法不过是保存函数值的属性。这是一个简单的方法：\n\n```\nlet rabbit\
  \ = {};\nrabbit.speak = function(line) {\n  console.log(`The rabbit says '${line}'`);\n\
  };\nrabbit.speak(\"I'm alive.\");\n// → The rabbit says 'I'm alive.'\n```\n\n通常，方法需要对其调用的对象执行某些操作。当函数作为方法调用时——即作为属性查找并立即调用，如\
  \ `object.method()`——其主体中名为 `this` 的绑定会自动指向调用它的对象。\n\n```\nfunction speak(line)\
  \ {\n  console.log(`The ${this.type} rabbit says '${line}'`);\n}\nlet whiteRabbit\
  \ = {type: \"white\", speak};\nlet hungryRabbit = {type: \"hungry\", speak};\nwhiteRabbit.speak(\"\
  Oh my ears and whiskers, \" +\n                  \"how late it's getting!\");\n\
  // → The white rabbit says 'Oh my ears and whiskers, how\n// late it's getting!'\n\
  hungryRabbit.speak(\"I could use a carrot right now.\");\n// → The hungry rabbit\
  \ says 'I could use a carrot right now.'\n```\n\n你可以将 `this` 视为一个以不同方式传递的额外参数。如果你想显式传递它，可以使用函数的\
  \ `call` 方法，该方法将 `this` 值作为第一个参数，并将后续参数视为普通参数。\n\n```\nspeak.call(hungryRabbit,\
  \ \"Burp!\");\n// → The hungry rabbit says 'Burp!'\n```\n\n由于每个函数都有自己的 `this` 绑定，其值取决于调用方式，因此你不能在使用\
  \ `function` 关键字定义的常规函数中引用包装作用域的 `this`。\n\n箭头函数则不同——它们不绑定自己的 `this`，但可以看到周围作用域的\
  \ `this` 绑定。因此，你可以像下面的代码那样，在局部函数内部引用 `this`：\n\n```\nfunction normalize() {\n  console.log(this.coords.map(n\
  \ => n / this.length));\n}\nnormalize.call({coords: [0, 2, 3], length: 5});\n//\
  \ → [0, 0.4, 0.6]\n```\n\n如果我在 `map` 的参数中使用 `function` 关键字编写，代码将无法工作。\n\n### 原型\n\
  \n仔细观察。\n\n```\nlet empty = {};\nconsole.log(empty.toString);\n// → function toString(){...}\n\
  console.log(empty.toString());\n// → [object Object]\n```\n\n我从一个空对象中提取了一个属性。神奇！\n\
  \n好吧，其实不然。我只是之前隐瞒了关于 JavaScript 对象工作方式的信息。除了它们自己的属性集之外，大多数对象还有一个*原型*。原型是另一个对象，用作属性的后备来源。当对象请求一个它没有的属性时，会搜索其原型，然后是原型的原型，依此类推。\n\
  \n那么那个空对象的原型是谁？它是伟大的祖先原型，几乎所有对象背后的实体——`Object.prototype`。\n\n```\nconsole.log(Object.getPrototypeOf({})\
  \ ==\n            Object.prototype);\n// → true\nconsole.log(Object.getPrototypeOf(Object.prototype));\n\
  // → null\n```\n\n正如你所猜测的，`Object.getPrototypeOf` 返回一个对象的原型。\n\nJavaScript 对象的原型关系形成树状结构，其根是\
  \ `Object.prototype`。它提供了一些在所有对象中都出现的方法，例如 `toString`，它将对象转换为字符串表示。\n\n\n\n\n\n\
  许多对象并不直接以 `Object.prototype` 作为原型，而是以另一个提供不同默认属性集的对象作为原型。函数派生自 `Function.prototype`，数组派生自\
  \ `Array.prototype`。\n\n```\nconsole.log(Object.getPrototypeOf(Math.max) ==\n  \
  \          Function.prototype);\n// → true\nconsole.log(Object.getPrototypeOf([])\
  \ ==\n            Array.prototype);\n// → true\n```\n\n这样的原型对象本身也会有一个原型，通常是 `Object.prototype`，因此它仍然间接提供了像\
  \ `toString` 这样的方法。\n\n你可以使用 `Object.create` 来创建一个具有特定原型的对象。\n\n```\nlet protoRabbit\
  \ = {\n   speak(line) {\n     console.log(`The ${this.type} rabbit says '${line}'`);\n\
  \   }\n};\nlet killerRabbit = Object.create(protoRabbit);\nkillerRabbit.type = \"\
  killer\";\nkillerRabbit.speak(\"SKREEEE!\");\n// → The killer rabbit says 'SKREEEE!'\n\
  ```\n\n对象表达式中的 `speak(line)` 这样的属性是定义方法的简写形式。它会创建一个名为 `speak` 的属性，并赋予它一个函数作为值。\n\
  \n“proto”兔子充当了所有兔子共享属性的容器。单个兔子对象（比如杀手兔）包含仅适用于自身的属性——在本例中是它的 `type`——并从其原型中派生共享属性。\n\
  \n### 类\n\nJavaScript 的原型系统可以被解释为一种对面向对象概念——*类*——的非正式实现。类定义了一种对象类型的形状——它拥有哪些方法和属性。这样的对象被称为类的*实例*。\n\
  \n原型对于定义类中所有实例共享相同值的属性（如方法）非常有用。每个实例不同的属性（比如我们兔子的 `type` 属性）则需要直接存储在对象本身中。\n\n因此，要创建给定类的实例，你必须创建一个从正确原型派生的对象，但*同时*还要确保它自身拥有该类实例应有的属性。这就是*构造函数*的作用。\n\
  \n```\nfunction makeRabbit(type) {\n  let rabbit = Object.create(protoRabbit);\n\
  \  rabbit.type = type;\n  return rabbit;\n}\n```\n\nJavaScript 提供了一种更简单的方式来定义这种类型的函数。如果你在函数调用前加上关键字\
  \ `new`，该函数就会被视为构造函数。这意味着会自动创建一个具有正确原型的对象，在函数中绑定到 `this`，并在函数末尾返回。\n\n构造对象时使用的原型对象是通过获取构造函数的\
  \ `prototype` 属性找到的。\n\n```\nfunction Rabbit(type) {\n   this.type = type;\n}\n\
  Rabbit.prototype.speak = function(line) {\n   console.log(`The ${this.type} rabbit\
  \ says '${line}'`);\n};\nlet weirdRabbit = new Rabbit(\"weird\");\n```\n\n构造函数（实际上所有函数）都会自动获得一个名为\
  \ `prototype` 的属性，默认情况下它持有一个从 `Object.prototype` 派生的普通空对象。如果你愿意，可以用一个新对象覆盖它。或者像示例那样，向现有对象添加属性。\n\
  \n按照惯例，构造函数的名称首字母大写，以便与其他函数区分。\n\n理解原型与构造函数关联的方式（通过其 `prototype` 属性）和对象*拥有*原型的方式（可以通过\
  \ `Object.getPrototypeOf` 找到）之间的区别非常重要。构造函数的实际原型是 `Function.prototype`，因为构造函数是函数。它的\
  \ `prototype` *属性*保存了用于通过它创建的实例的原型。\n\n```\nconsole.log(Object.getPrototypeOf(Rabbit)\
  \ ==\n            Function.prototype);\n// → true\nconsole.log(Object.getPrototypeOf(weirdRabbit)\
  \ ==\n            Rabbit.prototype);\n// → true\n```\n\n### 类表示法\n\n因此，JavaScript\
  \ 的类就是带有 `prototype` 属性的构造函数。它们就是这样工作的，直到 2015 年，你都必须这样编写它们。如今，我们有了更简洁的表示法。\n\n\
  ```\nclass Rabbit {\n  constructor(type) {\n    this.type = type;\n  }\n  speak(line)\
  \ {\n    console.log(`The ${this.type} rabbit says '${line}'`);\n  }\n}\nlet killerRabbit\
  \ = new Rabbit(\"killer\");\nlet blackRabbit = new Rabbit(\"black\");\n```\n\n`class`\
  \ 关键字开始一个类声明，它允许我们在一个地方定义构造函数和一组方法。在声明的大括号内可以编写任意数量的方法。名为 `constructor` 的方法会被特殊对待。它提供了实际的构造函数，该函数将绑定到名称\
  \ `Rabbit`。其他方法则被打包到该构造函数的 `prototype` 中。因此，前面的类声明等价于上一节中的构造函数定义。只是看起来更美观。\n\n目前，类声明只允许将*方法*（持有函数的属性）添加到原型中。当你想在那里保存一个非函数值时，这可能会有些不方便。该语言的下一版本可能会改进这一点。目前，你可以在定义类之后直接操作\
  \ `prototype` 来创建这样的属性。\n\n与 `function` 一样，`class` 既可以用在语句中，也可以用在表达式中。当用作表达式时，它不会定义绑定，而只是将构造函数作为值产生。在类表达式中，你可以省略类名。\n\
  \n```\nlet object = new class { getWord() { return \"hello\"; } };\nconsole.log(object.getWord());\n\
  // → hello\n```\n\n### 覆盖派生属性\n\n当你向对象添加一个属性时，无论该属性是否存在于原型中，该属性都会被添加到对象*本身*。如果原型中已经存在同名的属性，该属性将不再影响该对象，因为它现在被对象自身的属性隐藏了。\n\
  \n```\nRabbit.prototype.teeth = \"small\";\nconsole.log(killerRabbit.teeth);\n//\
  \ → small\nkillerRabbit.teeth = \"long, sharp, and bloody\";\nconsole.log(killerRabbit.teeth);\n\
  // → long, sharp, and bloody\nconsole.log(blackRabbit.teeth);\n// → small\nconsole.log(Rabbit.prototype.teeth);\n\
  // → small\n```\n\n下图描绘了这段代码运行后的情况。`Rabbit` 和 `Object` 原型位于 `killerRabbit` 之后，作为一种背景，可以在其中查找对象本身未找到的属性。\n\
  \n![Image](img/f0103-01.jpg)\n\n覆盖原型中存在的属性可能是一件有用的事情。正如兔子牙齿的例子所示，覆盖可用于在更通用的对象类实例中表达特殊属性，同时让非特殊对象从其原型中获取标准值。\n\
  \n覆盖也用于让标准函数和数组原型拥有与基本对象原型不同的 `toString` 方法。\n\n```\nconsole.log(Array.prototype.toString\
  \ ==\n            Object.prototype.toString);\n// → false\nconsole.log([1, 2].toString());\n\
  // → 1,2\n```\n\n在数组上调用 `toString` 得到的结果类似于调用 `.join(\",\")`——它会在数组的值之间插入逗号。直接使用数组调用\
  \ `Object.prototype.toString` 会产生不同的字符串。该函数不了解数组，因此它只是将单词 *object* 和类型名称放在方括号之间。\n\
  \n```\nconsole.log(Object.prototype.toString.call([1, 2]));\n// → [object Array]\n\
  ```\n\n### 映射\n\n我们在第 88 页的“用 Map 进行转换”中看到了 *map* 这个词，它指的是一种通过对数据结构的元素应用函数来转换该结构的操作。令人困惑的是，在编程中，同一个词也用于一个相关但相当不同的事物。\n\
  \n*映射*（名词）是一种将值（键）与其他值关联起来的数据结构。例如，你可能想将名字映射到年龄。可以使用对象来实现这一点。\n\n```\nlet ages \
  \   = {\n   Boris:   39,\n   Liang:   22,\n   Júlia:   62\n};\n```\n\n\n\n\n`console.log(\\\
  `Júlia is ${ages[\"Júlia\"]}\\`);`\n\n`// → Júlia is 62`\n\n`console.log(\"Is Jack's\
  \ age known?\", \"Jack\" in ages);`\n\n`// → Is Jack's age known? false`\n\n`console.log(\"\
  Is toString's age known?\", \"toString\" in ages);`\n\n`// → Is toString's age known?\
  \ true`\n\n这里，对象的属性名是人的名字，属性值是他们的年龄。但我们当然没有在映射中列出任何名为 `toString` 的人。然而，由于普通对象继承自\
  \ `Object.prototype`，所以看起来这个属性是存在的。\n\n因此，使用普通对象作为映射是危险的。有几种方法可以避免这个问题。首先，可以创建**没有**原型的对象。如果你将\
  \ `null` 传递给 `Object.create`，生成的对象将不会继承自 `Object.prototype`，并且可以安全地用作映射。\n\n`console.log(\"\
  toString\" in Object.create(null));`\n\n`// → false`\n\n对象的属性名必须是字符串。如果你需要一个键不能轻易转换为字符串（例如对象）的映射，你就不能使用对象作为映射。\n\
  \n幸运的是，JavaScript 提供了一个名为 `Map` 的类，正是为此目的而编写的。它存储映射关系，并允许任何类型的键。\n\n```\nlet ages\
  \ = new Map();\nages.set(\"Boris\", 39);\nages.set(\"Liang\", 22);\nages.set(\"\
  Júlia\", 62);\nconsole.log(`Júlia is ${ages.get(\"Júlia\")}`);\n// → Júlia is 62\n\
  console.log(\"Is Jack's age known?\", ages.has(\"Jack\"));\n// → Is Jack's age known?\
  \ false\nconsole.log(ages.has(\"toString\"));\n// → false\n```\n\n方法 `set`、`get`\
  \ 和 `has` 是 `Map` 对象接口的一部分。编写一个能够快速更新和搜索大量值的数据结构并不容易，但我们不必担心这一点。别人已经为我们做好了，我们可以通过这个简单的接口来使用他们的成果。\n\
  \n如果你确实有一个普通对象，并且出于某种原因需要将其视为映射，那么知道 `Object.keys` 只返回对象**自身**的键，而不是原型中的键，会很有用。作为\
  \ `in` 运算符的替代，你可以使用 `hasOwnProperty` 方法，它会忽略对象的原型。\n\n```\nconsole.log({x: 1}.hasOwnProperty(\"\
  x\"));\n// → true\nconsole.log({x: 1}.hasOwnProperty(\"toString\"));\n// → false\n\
  ```\n\n### 多态\n\n当你对对象调用 `String` 函数（将值转换为字符串）时，它会调用该对象的 `toString` 方法，试图从中创建一个有意义的字符串。我之前提到过，一些标准原型定义了它们自己的\
  \ `toString` 版本，以便创建包含比 `\"[object Object]\"` 更有用信息的字符串。你也可以自己这样做。\n\n```\nRabbit.prototype.toString\
  \ = function() {\n   return `a ${this.type} rabbit`;\n};\nconsole.log(String(blackRabbit));\n\
  // → a black rabbit\n```\n\n这是一个强大思想的简单实例。当一段代码被编写为与具有特定接口的对象一起工作时——在本例中是 `toString`\
  \ 方法——任何恰好支持该接口的对象都可以插入到代码中，并且它就能正常工作。\n\n这种技术被称为*多态*。多态代码可以处理不同形状的值，只要它们支持它期望的接口。\n\
  \n我在第 69 页的“数组循环”中提到，`for/of` 循环可以遍历多种数据结构。这是多态的另一个例子——这种循环期望数据结构暴露一个特定的接口，数组和字符串都做到了。我们也可以将这个接口添加到我们自己的对象中！但在那之前，我们需要知道什么是符号。\n\
  \n### 符号\n\n多个接口可能对不同的东西使用相同的属性名。例如，我可以定义一个接口，其中 `toString` 方法应该将对象转换成一团纱线。一个对象不可能同时符合该接口和\
  \ `toString` 的标准用法。\n\n那将是一个坏主意，而且这个问题并不常见。大多数 JavaScript 程序员根本不会考虑它。但语言设计者——他们的*工作*就是考虑这些事情——还是为我们提供了解决方案。\n\
  \n当我声称属性名是字符串时，那并不完全准确。它们通常是字符串，但也可以是*符号*。符号是用 `Symbol` 函数创建的值。与字符串不同，新创建的符号是唯一的——你不能创建两个相同的符号。\n\
  \n```\nlet sym = Symbol(\"name\");\nconsole.log(sym == Symbol(\"name\"));\n// →\
  \ false\nRabbit.prototype[sym] = 55;\nconsole.log(blackRabbit[sym]);\n// → 55\n\
  ```\n\n你传递给 `Symbol` 的字符串在将其转换为字符串时会被包含在内，并且可以使符号更容易识别，例如在控制台中显示时。但除此之外它没有其他意义——多个符号可以有相同的名称。\n\
  \n符号既唯一又可用作属性名，这使得它们适合定义可以与其他属性和平共存的接口，无论这些属性叫什么名字。\n\n```\nconst toStringSymbol\
  \ = Symbol(\"toString\");\nArray.prototype[toStringSymbol] = function() {\n   return\
  \ `${this.length} cm of blue yarn`;\n};\nconsole.log([1, 2].toString());\n// → 1,2\n\
  console.log([1, 2][toStringSymbol]());\n// → 2 cm of blue yarn\n```\n\n通过在属性名周围使用方括号，可以在对象表达式和类中包含符号属性。这会导致属性名被求值，就像方括号属性访问表示法一样，它允许我们引用持有该符号的绑定。\n\
  \n```\nlet stringObject = {\n   [toStringSymbol]() { return \"a jute rope\"; }\n\
  };\nconsole.log(stringObject[toStringSymbol]());\n// → a jute rope\n```\n\n### 迭代器接口\n\
  \n提供给 `for/of` 循环的对象应该是*可迭代的*。这意味着它有一个以 `Symbol.iterator` 符号（语言定义的一个符号值，作为 `Symbol`\
  \ 函数的属性存储）命名的方法。\n\n调用该方法时，它应该返回一个提供第二个接口的对象，即*迭代器*。这是实际进行迭代的东西。它有一个 `next` 方法，返回下一个结果。该结果应该是一个对象，包含一个\
  \ `value` 属性（提供下一个值，如果有的话）和一个 `done` 属性（当没有更多结果时为 `true`，否则为 `false`）。\n\n注意，`next`、`value`\
  \ 和 `done` 属性名是普通字符串，而不是符号。只有 `Symbol.iterator`（它很可能被添加到*许多*不同的对象中）才是一个真正的符号。\n\n\
  我们可以直接使用这个接口。\n\n```\nlet okIterator = \"OK\"[Symbol.iterator]();\nconsole.log(okIterator.next());\n\
  // → {value: \"O\", done: false}\nconsole.log(okIterator.next());\n// → {value:\
  \ \"K\", done: false}\nconsole.log(okIterator.next());\n// → {value: undefined,\
  \ done: true}\n```\n\n让我们实现一个可迭代的数据结构。我们将构建一个*矩阵*类，充当二维数组。\n\n```\nclass Matrix\
  \ {\n  constructor(width, height, element = (x, y) => undefined) {\n    this.width\
  \ = width;\n    this.height = height;\n    this.content = [];\n    for (let y =\
  \ 0; y < height; y++) {\n      for (let x = 0; x < width; x++) {\n        this.content[y\
  \ * width + x] = element(x, y);\n      }\n    }\n  }\n  get(x, y) {\n    return\
  \ this.content[y * this.width + x];\n  }\n  set(x, y, value) {\n    this.content[y\
  \ * this.width + x] = value;\n  }\n}\n```\n\n该类将其内容存储在一个大小为 *width* × *height* 的单一数组中。元素按行存储，例如，第五行的第三个元素（使用从零开始的索引）存储在位置\
  \ 4 × *width* + 2。\n\n构造函数接受宽度、高度和一个可选的初始内容函数，该函数用于填充初始值。有 `get` 和 `set` 方法来检索和更新矩阵中的元素。\n\
  \n当遍历矩阵时，你通常既关心元素的位置，也关心元素本身，因此我们将让迭代器生成包含 `x`、`y` 和 `value` 属性的对象。\n\n```\nclass\
  \ MatrixIterator {\n  constructor(matrix) {\n    this.x = 0;\n```\n\n\n\n\n```\n\
  this.y = 0;\n\nthis.matrix = matrix;\n\n}\n\nnext() {\n\nif (this.y == this.matrix.height)\
  \ return {done: true};\n\nlet value = {x: this.x,\n\ny: this.y,\n\nvalue: this.matrix.get(this.x,\
  \ this.y)};\n\nthis.x++;\n\nif (this.x == this.matrix.width) {\n\nthis.x = 0;\n\n\
  this.y++;\n\n}\n\nreturn {value, done: false};\n\n}\n\n}\n```\n\n该类通过其`x`和`y`属性跟踪遍历矩阵的进度。`next`方法首先检查是否已到达矩阵底部。如果未到达，它*首先*创建包含当前值的对象，*然后*更新其位置，必要时移动到下一行。\n\
  \n让我们将`Matrix`类设置为可迭代的。在本书中，我偶尔会使用事后原型操作来向类添加方法，以便各个代码片段保持小巧且自包含。在常规程序中，如果不需要将代码拆分成小块，你可以直接在类中声明这些方法。\n\
  \n```\nMatrix.prototype[Symbol.iterator] = function() {\n   return new MatrixIterator(this);\n\
  };\n```\n\n现在我们可以使用`for/of`遍历矩阵。\n\n```\nlet matrix = new Matrix(2, 2, (x, y) =>\
  \ `value ${x},${y}`);\nfor (let {x, y, value} of matrix) {\n  console.log(x, y,\
  \ value);\n}\n// → 0 0 value 0,0\n// → 1 0 value 1,0\n// → 0 1 value 0,1\n// → 1\
  \ 1 value 1,1\n```\n\n### 获取器、设置器与静态方法\n\n接口通常主要由方法组成，但也可以包含保存非函数值的属性。例如，`Map`对象有一个`size`属性，告诉你其中存储了多少个键。\n\
  \n这样的对象甚至不需要直接在实例中计算和存储这样的属性。即使是直接访问的属性也可能隐藏方法调用。这样的方法被称为*获取器*，它们通过在对象表达式或类声明中的方法名前写`get`来定义。\n\
  \n```\nlet varyingSize = {\n  get size() {\n       return Math.floor(Math.random()\
  \ * 100);\n     }\n};\nconsole.log(varyingSize.size);\n// → 73\nconsole.log(varyingSize.size);\n\
  // → 49\n```\n\n每当有人读取该对象的`size`属性时，关联的方法就会被调用。当属性被写入时，你可以使用*设置器*做类似的事情。\n\n```\n\
  class Temperature {\n  constructor(celsius) {\n    this.celsius = celsius;\n  }\n\
  \  get fahrenheit() {\n    return this.celsius * 1.8 + 32;\n  }\n  set fahrenheit(value)\
  \ {\n    this.celsius = (value - 32) / 1.8;\n  }\n  static fromFahrenheit(value)\
  \ {\n    return new Temperature((value - 32) / 1.8);\n  }\n}\nlet temp = new Temperature(22);\n\
  console.log(temp.fahrenheit);\n// → 71.6\ntemp.fahrenheit = 86;\nconsole.log(temp.celsius);\n\
  // → 30\n```\n\n`Temperature`类允许你以摄氏度或华氏度读取和写入温度，但内部只存储摄氏度，并在`fahrenheit`获取器和设置器中自动进行摄氏度和华氏度之间的转换。\n\
  \n有时你想将一些属性直接附加到构造函数上，而不是原型上。这样的方法无法访问类实例，但可以用于提供额外的创建实例的方式。\n\n在类声明中，名称前写有`static`的方法存储在构造函数上。因此，`Temperature`类允许你编写`Temperature.fromFahrenheit(100)`来使用华氏度创建温度。\n\
  \n### 继承\n\n有些矩阵被称为*对称矩阵*。如果你将对称矩阵沿其左上到右下的对角线镜像，它保持不变。换句话说，存储在`x`,`y`处的值总是与`y`,`x`处的值相同。\n\
  \n假设我们需要一个像`Matrix`这样的数据结构，但要求矩阵是且保持对称。我们可以从头开始编写，但这会重复一些与我们已编写的代码非常相似的代码。\n\nJavaScript\
  \ 的原型系统使得创建*新*类成为可能，该类与旧类非常相似，但对其某些属性有新的定义。新类的原型派生自旧原型，但添加了例如`set`方法的新定义。\n\n用面向对象编程的术语来说，这被称为*继承*。新类从旧类继承属性和行为。\n\
  \n```\nclass SymmetricMatrix extends Matrix {\n  constructor(size, element = (x,\
  \ y) => undefined) {\n    super(size, size, (x, y) => {\n      if (x < y) return\
  \ element(y, x);\n      else return element(x, y);\n    });\n  }\n  set(x, y, value)\
  \ {\n    super.set(x, y, value);\n    if (x != y) {\n      super.set(y, x, value);\n\
  \    }\n  }\n}\nlet matrix = new SymmetricMatrix(5, (x, y) => `${x},${y}`);\nconsole.log(matrix.get(2,\
  \ 3));\n// → 3,2\n```\n\n使用`extends`关键字表明这个类不应直接基于默认的`Object`原型，而应基于其他某个类。这被称为*超类*。派生类就是*子类*。\n\
  \n为了初始化`SymmetricMatrix`实例，构造函数通过`super`关键字调用其超类的构造函数。这是必要的，因为如果这个新对象要（大致）像`Matrix`一样行为，它需要矩阵所具有的实例属性。为了确保矩阵对称，构造函数包装了`element`方法，以交换对角线以下值的坐标。\n\
  \n`set`方法再次使用`super`，但这次不是调用构造函数，而是调用超类方法集中的特定方法。我们正在重新定义`set`，但希望使用原始行为。因为`this.set`指向*新*的`set`方法，调用它不会起作用。在类方法内部，`super`提供了一种调用超类中定义的方法的方式。\n\
  \n继承允许我们以相对较少的工作从现有数据类型构建略有不同的数据类型。它是面向对象传统的基本组成部分，与封装和多态并列。然而，尽管后两者现在被普遍认为是绝妙的想法，但继承更具争议性。\n\
  \n封装和多态可用于*分离*代码片段，减少整体程序的混乱程度，而继承从根本上将类绑定在一起，造成*更多*的混乱。当继承一个类时，你通常需要比单纯使用它时更了解它的工作原理。继承可以是一个有用的工具，我在自己的程序中偶尔也会使用它，但它不应该是你首先想到的工具，而且你可能不应该主动寻找构建类层次结构（类的族谱）的机会。\n\
  \n### instanceof 运算符\n\n有时知道一个对象是否派生自特定类是有用的。为此，JavaScript 提供了一个名为`instanceof`的二元运算符。\n\
  \n```\nconsole.log(\n  new SymmetricMatrix(2) instanceof SymmetricMatrix);\n// →\
  \ true\nconsole.log(new SymmetricMatrix(2) instanceof Matrix);\n// → true\nconsole.log(new\
  \ Matrix(2, 2) instanceof SymmetricMatrix);\n// → false\nconsole.log([1] instanceof\
  \ Array);\n// → true\n```\n\n该运算符会穿透继承类型，因此`SymmetricMatrix`是`Matrix`的实例。该运算符也可以应用于像`Array`这样的标准构造函数。几乎每个对象都是`Object`的实例。\n\
  \n### 总结\n\n因此，对象不仅仅持有自己的属性。它们还有原型，原型是其他对象。只要它们的原型拥有某个属性，它们就会表现得好像拥有该属性一样。简单对象以`Object.prototype`作为其原型。\n\
  \n\n\n构造函数（其名称通常以大写字母开头）可以与 `new` 运算符一起使用来创建新对象。新对象的原型将是构造函数 `prototype` 属性中的对象。你可以充分利用这一点，将给定类型的所有值共享的属性放入它们的原型中。有一种\
  \ `class` 表示法，它提供了一种清晰的方式来定义构造函数及其原型。\n\n你可以定义 getter 和 setter，以便在每次访问对象的属性时秘密调用方法。静态方法是存储在类构造函数中（而非其原型）的方法。\n\
  \n给定一个对象和一个构造函数，`instanceof` 运算符可以告诉你该对象是否是此构造函数的实例。\n\n对对象做的一件有用的事情是为它们指定一个接口，并告诉所有人他们应该只通过该接口与你的对象交互。构成你的对象的其余细节现在被*封装*起来，隐藏在接口后面。\n\
  \n多个类型可以实现同一个接口。为使用接口而编写的代码会自动知道如何与任何提供该接口的不同对象协同工作。这被称为*多态*。\n\n当实现仅在部分细节上有所不同的多个类时，将新类编写为现有类的*子类*，并*继承*其部分行为会很有帮助。\n\
  \n### 练习\n\n#### *向量类型*\n\n编写一个表示二维空间中向量的类 `Vec`。它接受 `x` 和 `y` 参数（数字），并将它们保存到同名属性中。\n\
  \n为 `Vec` 的原型提供两个方法：`plus` 和 `minus`，它们接受另一个向量作为参数，并返回一个新向量，该向量是两个向量（当前向量和参数）的 *x*\
  \ 和 *y* 值的和或差。\n\n为原型添加一个 getter 属性 `length`，用于计算向量的长度——即点 (*x, y*) 到原点 (0, 0) 的距离。\n\
  \n#### *组*\n\n标准 JavaScript 环境提供了另一种名为 `Set` 的数据结构。与 `Map` 的实例类似，集合保存一组值。与 `Map`\
  \ 不同，它不将这些值与其他值关联——它只跟踪哪些值属于该集合。一个值只能属于集合一次——再次添加它不会产生任何效果。\n\n编写一个名为 `Group` 的类（因为\
  \ `Set` 已被占用）。与 `Set` 类似，它具有 `add`、`delete` 和 `has` 方法。其构造函数创建一个空组，`add` 将一个值添加到组中（但仅当它还不是成员时），`delete`\
  \ 从组中移除其参数（如果它是成员），`has` 返回一个布尔值，指示其参数是否为组的成员。\n\n使用 `===` 运算符或等效方法（如 `indexOf`）来确定两个值是否相同。\n\
  \n为类提供一个静态方法 `from`，它接受一个可迭代对象作为参数，并创建一个包含迭代该对象所产生的所有值的组。\n\n#### *可迭代组*\n\n使上一个练习中的\
  \ `Group` 类可迭代。如果你对接口的确切形式还不清楚，请参考本章前面关于迭代器接口的部分。\n\n如果你使用数组来表示组的成员，不要仅仅返回通过调用数组的\
  \ `Symbol.iterator` 方法创建的迭代器。那样做虽然可行，但违背了本练习的目的。\n\n如果在迭代过程中修改了组，你的迭代器行为异常是可以接受的。\n\
  \n#### *借用方法*\n\n在本章前面，我提到当你想要忽略原型的属性时，对象的 `hasOwnProperty` 可以作为 `in` 运算符的更健壮的替代方案。但是，如果你的映射需要包含单词\
  \ `\"hasOwnProperty\"` 呢？你将无法再调用该方法，因为对象自身的属性隐藏了该方法的值。\n\n你能想到一种方法，在拥有同名自身属性的对象上调用\
  \ `hasOwnProperty` 吗？\n\n“机器能否思考的问题……与潜艇能否游泳的问题同样相关。”\n\n—— 艾兹格·迪杰斯特拉，《对计算机科学的威胁》\n\
  \n![Image](img/f0116-01.jpg)\n\n## 7\n\n项目：机器人\n\n在“项目”章节中，我将暂时停止向你灌输新理论，而是我们一起编写一个程序。理论对于学习编程是必要的，但阅读和理解实际程序同样重要。\n\
  \n本章的项目是构建一个自动机，一个在虚拟世界中执行任务的小程序。我们的自动机将是一个邮件投递机器人，负责取件和送件。\n\n### 草甸原野\n\n草甸原野村并不大。它由\
  \ 11 个地点和它们之间的 14 条道路组成。可以用以下道路数组来描述：\n\n```\nconst roads = [\n  \"Alice's House-Bob's\
  \ House\",     \"Alice's House-Cabin\",\n  \"Alice's House-Post Office\",     \"\
  Bob's House-Town Hall\",\n  \"Daria's House-Ernie's House\",   \"Daria's House-Town\
  \ Hall\",\n  \"Ernie's House-Grete's House\",   \"Grete's House-Farm\",\n  \"Grete's\
  \ House-Shop\",            \"Marketplace-Farm\",\n  \"Marketplace-Post Office\"\
  ,       \"Marketplace-Shop\",\n  \"Marketplace-Town Hall\",         \"Shop-Town\
  \ Hall\"\n];\n```\n\n![Image](img/f0118-01.jpg)\n\n村庄中的道路网络形成了一个*图*。图是由点（村庄中的地点）和它们之间的线（道路）组成的集合。这个图将是我们的机器人移动的世界。\n\
  \n字符串数组不太容易处理。我们感兴趣的是从给定地点可以到达的目的地。让我们将道路列表转换为一个数据结构，对于每个地点，它告诉我们从那里可以到达哪些地方。\n\n\
  ```\nfunction buildGraph(edges) {\n  let graph = Object.create(null);\n  function\
  \ addEdge(from, to) {\n    if (graph[from] == null) {\n      graph[from] = [to];\n\
  \    } else {\n      graph[from].push(to);\n    }\n  }\n  for (let [from, to] of\
  \ edges.map(r => r.split(\"-\"))) {\n    addEdge(from, to);\n    addEdge(to, from);\n\
  \  }\n  return graph;\n}\n\nconst roadGraph = buildGraph(roads);\n```\n\n给定一个边数组，`buildGraph`\
  \ 创建一个映射对象，对于每个节点，它存储一个相连节点的数组。\n\n它使用 `split` 方法将形式为 `\"Start-End\"` 的道路字符串转换为包含起点和终点（作为单独字符串）的二元数组。\n\
  \n### 任务\n\n我们的机器人将在村庄中移动。各个地方都有包裹，每个包裹都寄往另一个地方。机器人到达包裹所在位置时拾取它们，并在到达目的地时投递它们。\n\
  \n自动机必须在每个时刻决定下一步去哪里。当所有包裹都投递完毕时，它的任务就完成了。\n\n为了能够模拟这个过程，我们必须定义一个可以描述它的虚拟世界。这个模型告诉我们机器人在哪里，包裹在哪里。当机器人决定移动到某个地方时，我们需要更新模型以反映新情况。\n\
  \n如果你以面向对象编程的角度思考，你的第一反应可能是开始为世界中的各种元素定义对象：一个机器人类，一个包裹类，也许还有地点类。这些类可以包含描述其当前状态的属性，例如某个位置的包裹堆，我们可以在更新世界时更改它。\n\
  \n这是错误的。\n\n至少，通常是错误的。某件事听起来像对象，并不自动意味着它应该成为程序中的对象。为应用程序中的每个概念都反射性地编写类，往往会让你得到一堆相互连接的对象，每个对象都有自己的内部变化状态。这样的程序通常难以理解，因此容易出错。\n\
  \n\n\n相反，让我们将村庄的状态浓缩为定义它的最小值集合。这里有机器人的当前位置和未投递包裹的集合，每个包裹都有当前位置和目的地地址。仅此而已。\n\n同时，我们不妨让机器人在移动时不再*改变*这个状态，而是为移动后的情况计算一个*新*状态。\n\
  \n```\nclass VillageState {\n  constructor(place, parcels) {\n    this.place = place;\n\
  \    this.parcels = parcels;\n  }\n\n  move(destination) {\n    if (!roadGraph[this.place].includes(destination))\
  \ {\n      return this;\n    } else {\n      let parcels = this.parcels.map(p =>\
  \ {\n        if (p.place != this.place) return p;\n        return {place: destination,\
  \ address: p.address};\n      }).filter(p => p.place != p.address);\n      return\
  \ new VillageState(destination, parcels);\n    }\n  }\n}\n```\n\n`move` 方法是动作发生的地方。它首先检查从当前位置到目的地是否有道路，如果没有，则返回旧状态，因为这不是一个有效的移动。\n\
  \n然后它创建一个新状态，将目的地作为机器人的新位置。但它还需要创建一组新的包裹——机器人携带的包裹（即位于机器人当前位置的包裹）需要被移动到新位置。而地址指向新位置的包裹需要被投递——也就是说，它们需要从未投递包裹集合中移除。对\
  \ `map` 的调用处理了移动，对 `filter` 的调用则处理了投递。\n\n包裹对象在移动时不会被修改，而是被重新创建。`move` 方法给我们一个新的村庄状态，但完全保留旧状态不变。\n\
  \n```\nlet first = new VillageState(\n   \"Post Office\",\n   [{place: \"Post Office\"\
  , address: \"Alice's House\"}]\n);\nlet next = first.move(\"Alice's House\");\n\
  console.log(next.place);\n// → Alice's House\nconsole.log(next.parcels);\n// → []\n\
  console.log(first.place);\n// → Post Office\n```\n\n`move` 导致包裹被投递，这反映在下一个状态中。但初始状态仍然描述了机器人位于邮局且包裹未投递的情况。\n\
  \n### 持久化数据\n\n不会改变的数据结构被称为*不可变*或*持久化*。它们的行为很像字符串和数字，即它们就是它们自己，并且保持原样，而不是在不同时间包含不同的内容。\n\
  \n在 JavaScript 中，几乎任何东西*都可以*被改变，因此使用本应持久化的值需要一些克制。有一个名为 `Object.freeze` 的函数，它可以改变一个对象，使得对其属性的写入被忽略。如果你想要小心谨慎，可以使用它来确保你的对象不被改变。冻结确实需要计算机做一些额外的工作，而忽略更新与让它们做错误的事情一样容易让人困惑。所以我通常更倾向于直接告诉人们某个给定的对象不应该被乱动，并希望他们能记住。\n\
  \n```\nlet object = Object.freeze({value: 5});\nobject.value = 10;\nconsole.log(object.value);\n\
  // → 5\n```\n\n为什么当语言显然期望我改变对象时，我却要费尽心思不去改变它们呢？\n\n因为这有助于我理解我的程序。这又是关于复杂性管理。当我的系统中的对象是固定、稳定的事物时，我可以孤立地考虑对它们的操作——从给定的起始状态移动到\
  \ Alice 的房子总是产生相同的新状态。当对象随时间变化时，这给这种推理增加了一个全新的复杂性维度。\n\n对于像我们在本章中构建的小型系统，我们可以处理那一点额外的复杂性。但限制我们能构建何种系统的最重要因素是我们能理解多少。任何能让你的代码更容易理解的东西，都使得构建一个更雄心勃勃的系统成为可能。\n\
  \n不幸的是，虽然理解基于持久化数据结构的系统更容易，但*设计*一个这样的系统，尤其是当你的编程语言不提供帮助时，可能会稍微困难一些。在本书中，我们将寻找使用持久化数据结构的机会，但也会使用可变的数据结构。\n\
  \n### 模拟\n\n一个送货机器人观察世界并决定它想要移动的方向。因此，我们可以说机器人是一个函数，它接收一个 `VillageState` 对象并返回一个附近地点的名称。\n\
  \n因为我们希望机器人能够记住东西，以便它们可以制定和执行计划，所以我们也会传递它们的记忆，并允许它们返回一个新的记忆。因此，机器人返回的东西是一个对象，包含它想要移动的方向以及一个记忆值，该值将在下次调用时返回给它。\n\
  \n```\nfunction runRobot(state, robot, memory) {\n  for (let turn = 0;; turn++)\
  \ {\n    if (state.parcels.length == 0) {\n      console.log(`Done in ${turn} turns`);\n\
  \      break;\n    }\n    let action = robot(state, memory);\n    state = state.move(action.direction);\n\
  \    memory = action.memory;\n    console.log(`Moved to ${action.direction}`);\n\
  \  }\n}\n```\n\n考虑一个机器人要“解决”一个给定状态必须做什么。它必须通过访问每个有包裹的位置来拾取所有包裹，并通过访问每个包裹地址指向的位置来投递它们，但必须在拾取包裹之后。\n\
  \n什么是最笨但可能有效的策略？机器人可以每回合随机朝一个方向走。这意味着，它极有可能最终会碰到所有包裹，然后也会在某个时刻到达它们应该被投递的地方。\n\n\
  以下是可能的样子：\n\n```\nfunction randomPick(array) {\n  let choice = Math.floor(Math.random()\
  \ * array.length);\n  return array[choice];\n}\n\nfunction randomRobot(state) {\n\
  \  return {direction: randomPick(roadGraph[state.place])};\n}\n```\n\n记住 `Math.random()`\
  \ 返回一个介于 0 和 1 之间的数字——但总是小于 1。将这个数字乘以数组的长度，然后应用 `Math.floor`，就得到了数组的一个随机索引。\n\n\
  由于这个机器人不需要记住任何东西，它忽略了第二个参数（记住 JavaScript 函数可以用额外参数调用而不会产生不良影响），并在返回的对象中省略了 `memory`\
  \ 属性。\n\n为了让这个高级机器人工作，我们首先需要一种方法来创建一个带有一些包裹的新状态。静态方法（这里通过直接向构造函数添加属性来编写）是放置该功能的好地方。\n\
  \n```\nVillageState.random = function(parcelCount = 5) {\n   let parcels = [];\n\
  \   for (let i = 0; i < parcelCount; i++) {\n     let address = randomPick(Object.keys(roadGraph));\n\
  \     let place;\n     do {\n       place = randomPick(Object.keys(roadGraph));\n\
  \     } while (place == address);\n     parcels.push({place, address});\n   }\n\
  \   return new VillageState(\"Post Office\", parcels);\n};\n```\n\n我们不希望有任何包裹是从与它们地址相同的地方发出的。因此，do\
  \ 循环在得到与地址相等的位置时会继续选择新位置。\n\n让我们启动一个虚拟世界。\n\n```\nrunRobot(VillageState.random(),\
  \ randomRobot);\n// → Moved to Marketplace\n// → Moved to Town Hall\n// → ...\n\
  // → Done in 63 turns\n```\n\n机器人花了很多回合才投递完包裹，因为它没有很好地提前规划。我们很快就会解决这个问题。\n\n###\
  \ 邮车的路线\n\n我们应该能比随机机器人做得好得多。一个简单的改进是借鉴现实世界邮件投递的方式。如果我们找到一条经过村庄所有地点的路线，机器人可以运行该路线两次，这样它保证能完成。以下是这样一条路线（从邮局开始）：\n\
  \n```\nconst mailRoute = [\n   \"Alice's House\", \"Cabin\", \"Alice's House\",\
  \ \"Bob's House\",\n   \"Town Hall\", \"Daria's House\", \"Ernie's House\",\n```\n\
  \n\n\n\"格雷特的家\", \"商店\", \"格雷特的家\", \"农场\",\n\"市场\", \"邮局\"\n];\n\n为了实现路线跟随机器人，我们需要利用机器人的记忆。机器人将剩余路线保存在记忆中，并在每一轮中丢弃第一个元素。\n\
  \n```\nfunction routeRobot(state, memory) {\n  if (memory.length == 0) {\n    memory\
  \ = mailRoute;\n  }\n  return {direction: memory[0], memory: memory.slice(1)};\n\
  }\n```\n\n这个机器人已经快了很多。它最多需要 26 轮（13 步路线的两倍），但通常更少。\n\n### 寻路\n\n不过，我并不会真的把盲目遵循固定路线称为智能行为。如果机器人能根据实际需要完成的工作调整自己的行为，它就能更高效地工作。\n\
  \n要做到这一点，它必须能够有目的地向某个包裹移动，或者向包裹需要送达的位置移动。即使目标距离不止一步，这也需要某种寻路功能。\n\n在图中寻找路线的问题是一个典型的*搜索问题*。我们可以判断一个给定的解（一条路线）是否有效，但不能像计算`2\
  \ + 2`那样直接计算出解。相反，我们必须不断创建潜在的解，直到找到一个可行的。\n\n图中可能的路线数量是无限的。但在搜索从`A`到`B`的路线时，我们只关心那些从`A`开始的路线。我们也不关心重复访问同一地点的路线——这些肯定不是最有效的路线。因此，这减少了路线查找器需要考虑的路线数量。\n\
  \n事实上，我们最关心的是*最短*路线。因此，我们希望确保先查看短路线，再查看长路线。一个好的方法是，从起点“生长”路线，探索每一个尚未访问过的可达地点，直到某条路线到达目标。这样，我们只会探索可能有趣的路线，并找到通往目标的最短路线（如果有多条，则找到其中一条）。\n\
  \n下面是一个实现此功能的函数：\n\n```\nfunction findRoute(graph, from, to) {\n  let work = [{at:\
  \ from, route: []}];\n  for (let i = 0; i < work.length; i++) {\n    let {at, route}\
  \ = work[i];\n    for (let place of graph[at]) {\n      if (place == to) return\
  \ route.concat(place);\n      if (!work.some(w => w.at == place)) {\n        work.push({at:\
  \ place, route: route.concat(place)});\n      }\n    }\n  }\n}\n```\n\n探索必须按正确的顺序进行——首先到达的地点必须首先探索。我们不能一到达某个地点就立即探索它，因为那意味着从那里*到达*的地点也会被立即探索，依此类推，尽管可能存在其他尚未探索的更短路径。\n\
  \n因此，该函数维护一个*工作列表*。这是一个数组，包含接下来要探索的地点以及到达那里的路线。它从起始位置和空路线开始。\n\n然后，搜索通过取出列表中的下一个项目并探索它来运行，这意味着会查看从该地点出发的所有道路。如果其中一条是目标，则可以返回一条完整的路线。否则，如果我们之前没有查看过这个地点，则向列表中添加一个新项目。如果我们之前查看过它，由于我们优先查看短路线，那么我们已经找到了一条通往该地点的更长路线或与现有路线一样长的路线，因此不需要再探索它。\n\
  \n你可以形象地将其想象为一张已知路线的网，从起始位置向外爬行，均匀地向各个方向生长（但从不缠绕回自身）。一旦第一条线到达目标位置，这条线就会被回溯到起点，从而得到我们的路线。\n\
  \n我们的代码没有处理工作列表中没有更多工作项的情况，因为我们知道我们的图是*连通的*，这意味着每个位置都可以从其他所有位置到达。我们总是能够找到两点之间的路线，搜索不会失败。\n\
  \n```\nfunction goalOrientedRobot({place, parcels}, route) {\n  if (route.length\
  \ == 0) {\n    let parcel = parcels[0];\n    if (parcel.place != place) {\n    \
  \  route = findRoute(roadGraph, place, parcel.place);\n    } else {\n      route\
  \ = findRoute(roadGraph, place, parcel.address);\n    }\n  }\n  return {direction:\
  \ route[0], memory: route.slice(1)};\n}\n```\n\n这个机器人像路线跟随机器人一样，将其记忆值用作移动方向的列表。每当该列表为空时，它必须决定下一步做什么。它取集合中第一个未送达的包裹，如果该包裹尚未被拾取，则规划一条前往它的路线。如果包裹*已经*被拾取，它仍然需要被送达，因此机器人改为创建一条前往送达地址的路线。\n\
  \n这个机器人通常在大约 16 轮内完成送达 5 个包裹的任务。这比`routeRobot`稍好，但肯定还不是最优的。\n\n### 练习\n\n#### *测量机器人*\n\
  \n仅仅让机器人解决几个场景很难客观地比较它们。也许一个机器人恰好得到了更简单的任务或它擅长的任务，而另一个则没有。\n\n编写一个函数`compareRobots`，它接受两个机器人（以及它们的初始记忆）。它应该生成\
  \ 100 个任务，并让每个机器人解决每个任务。完成后，它应该输出每个机器人每个任务的平均步数。\n\n为了公平起见，确保将每个任务分配给两个机器人，而不是为每个机器人生成不同的任务。\n\
  \n#### *机器人效率*\n\n你能编写一个比`goalOrientedRobot`更快完成任务的机器人吗？如果你观察那个机器人的行为，它做了哪些明显愚蠢的事情？如何改进这些？\n\
  \n如果你解决了上一个练习，你可能想使用你的`compareRobots`函数来验证你是否改进了机器人。\n\n#### *持久化组*\n\n标准 JavaScript\
  \ 环境中提供的大多数数据结构并不非常适合持久化使用。数组有`slice`和`concat`方法，允许我们轻松创建新数组而不损坏旧数组。但例如`Set`，没有用于创建添加或删除元素后的新集合的方法。\n\
  \n编写一个新类`PGroup`，类似于第 113 页的“组”中的`Group`类，它存储一组值。像`Group`一样，它有`add`、`delete`和`has`方法。\n\
  \n然而，它的`add`方法应该返回一个*新*的`PGroup`实例，其中添加了给定成员，并保持旧实例不变。类似地，`delete`创建一个不包含给定成员的新实例。\n\
  \n该类应该适用于任何类型的值，而不仅仅是字符串。它*不*需要在使用大量值时高效。\n\n构造函数不应成为类接口的一部分（尽管你肯定会在内部使用它）。相反，有一个空实例`PGroup.empty`，可以用作起始值。\n\
  \n为什么只需要一个`PGroup.empty`值，而不是有一个每次创建新的空映射的函数？\n\n“调试的难度是编写代码的两倍。因此，如果你尽可能巧妙地编写代码，那么按定义，你就不够聪明来调试它。”\n\
  \n—— 布莱恩·克尼汉和 P. J. 普劳格，《编程风格要素》\n\n![图片](img/f0128-01.jpg)\n\n## 8 错误与缺陷\n\n计算机程序中的缺陷通常被称为*错误*。把它们想象成偶然爬进我们工作中的小东西，会让程序员感觉良好。当然，实际上是我们自己把它们放进去的。\n\
  \n\n\n\n如果程序是结晶化的思想，那么你可以大致将 bug 分为两类：一类是由思想混乱引起的，另一类是由将思想转化为代码时引入的错误引起的。前者通常比后者更难诊断和修复。\n\
  \n### 语言\n\n如果计算机足够了解我们试图做什么，许多错误本可以自动被指出。但在这里，JavaScript 的松散性成了一个障碍。它对绑定和属性的概念非常模糊，以至于在实际运行程序之前很少能捕捉到拼写错误。而且即使运行时，它也允许你做一些明显无意义的事情而不报错，比如计算\
  \ `true * \"monkey\"`。\n\nJavaScript 确实会对某些事情报错。编写不符合语言语法的程序会立即让计算机报错。其他事情，比如调用一个不是函数的东西，或者访问一个\
  \ `undefined` 值上的属性，会在程序尝试执行该操作时报告错误。\n\n但通常，你的无意义计算只会产生 `NaN`（非数字）或 `undefined`\
  \ 值，而程序却愉快地继续运行，自以为在做有意义的事情。错误只会在之后显现，当这个虚假的值经过多个函数之后。它可能根本不会触发错误，而是悄无声息地导致程序输出错误。找到这类问题的根源可能很困难。\n\
  \n在程序中寻找错误（bug）的过程被称为*调试*。\n\n### 严格模式\n\n通过启用*严格模式*，可以让 JavaScript 变得*稍微*严格一些。这可以通过在文件或函数体的顶部放置字符串\
  \ `\"use strict\"` 来实现。下面是一个例子：\n\n```\nfunction canYouSpotTheProblem() {\n  \"\
  use strict\";\n  for (counter = 0; counter < 10; counter++) {\n    console.log(\"\
  Happy happy\");\n  }\n}\ncanYouSpotTheProblem();\n// → ReferenceError: counter is\
  \ not defined\n```\n\n通常，当你忘记在绑定前加上 `let` 时（如示例中的 `counter`），JavaScript 会静默地创建一个全局绑定并使用它。在严格模式下，则会报告一个错误。这非常有帮助。不过需要注意的是，如果该绑定已经作为全局绑定存在，则此方法无效。在这种情况下，循环仍然会静默地覆盖该绑定的值。\n\
  \n严格模式的另一个变化是，在未作为方法调用的函数中，`this` 绑定持有 `undefined` 值。在非严格模式下进行此类调用时，`this` 指向全局作用域对象，该对象的属性就是全局绑定。因此，如果在严格模式下错误地调用了方法或构造函数，JavaScript\
  \ 会在尝试从 `this` 读取内容时立即产生错误，而不是愉快地写入全局作用域。\n\n例如，考虑以下代码，它调用了一个构造函数但没有使用 `new` 关键字，因此其\
  \ `this` 将*不*指向一个新构造的对象：\n\n```\nfunction Person(name) { this.name = name; }\nlet\
  \ ferdinand = Person(\"Ferdinand\"); // 哎呀\nconsole.log(name);\n// → Ferdinand\n\
  ```\n\n因此，对 `Person` 的错误调用成功了，但返回了 `undefined` 值，并创建了全局绑定 `name`。在严格模式下，结果不同：\n\n\
  ```\n\"use strict\";\nfunction Person(name) { this.name = name; }\nlet ferdinand\
  \ = Person(\"Ferdinand\"); // 忘了 new\n// → TypeError: Cannot set property 'name'\
  \ of undefined\n```\n\n我们立即被告知出了问题。这很有帮助。幸运的是，使用 `class` 表示法创建的构造函数在未使用 `new` 调用时总会报错，这使得即使在非严格模式下，这个问题也不那么严重。\n\
  \n严格模式还做了其他一些事情。它禁止函数拥有多个同名参数，并移除了某些有问题的语言特性（例如 `with` 语句，它非常糟糕，本书不再进一步讨论）。\n\n\
  简而言之，在程序顶部加上 `\"use strict\"` 几乎不会造成伤害，而且可能帮助你发现问题。\n\n### 类型\n\n有些语言希望在运行程序之前就知道所有绑定和表达式的类型。它们会在类型使用不一致时立即告诉你。而\
  \ JavaScript 只在实际运行程序时才考虑类型，而且即使在那时，它也常常试图隐式地将值转换为它期望的类型，所以帮助不大。\n\n尽管如此，类型为讨论程序提供了一个有用的框架。许多错误源于对函数输入或输出的值类型感到困惑。如果你把这些信息写下来，就不太容易混淆了。\n\
  \n你可以在上一章的 `goalOrientedRobot` 函数之前添加如下注释来描述其类型：\n\n```\n// (VillageState, Array)\
  \ → {direction: string, memory: Array}\nfunction goalOrientedRobot(state, memory)\
  \ {\n  // ...\n}\n```\n\n有几种不同的约定用于为 JavaScript 程序添加类型注释。\n\n关于类型的一点是，它们需要引入自身的复杂性才能描述足够多的代码以发挥作用。你认为\
  \ `randomPick` 函数（从数组中返回一个随机元素）的类型是什么？你需要引入一个*类型变量 T*，它可以代表任何类型，这样你就可以给 `randomPick`\
  \ 一个像 `([T]) → T` 这样的类型（从 T 的数组到 T 的函数）。\n\n当程序的类型已知时，计算机可以为你*检查*它们，在程序运行之前指出错误。有几种\
  \ JavaScript 方言为语言添加了类型并进行检查。最流行的一种叫做 TypeScript。如果你有兴趣为你的程序增加严谨性，我建议你尝试一下。\n\n\
  在本书中，我们将继续使用原始的、危险的、无类型的 JavaScript 代码。\n\n### 测试\n\n如果语言不能帮助我们找到错误，我们就得用笨办法：运行程序，看看它是否做了正确的事情。\n\
  \n一遍又一遍地手动这样做是一个非常糟糕的主意。不仅烦人，而且往往效率低下，因为每次修改后都要花太多时间进行全面测试。\n\n计算机擅长重复性任务，而测试正是理想的重复性任务。自动化测试是编写一个程序来测试另一个程序的过程。编写测试比手动测试要多花一点功夫，但一旦你完成了，你就获得了一种超能力：只需几秒钟就能验证你的程序在你编写测试的所有情况下仍然表现正常。当你破坏了某些东西时，你会立即注意到，而不是在之后的某个时间随机遇到它。\n\
  \n测试通常采用小型标记程序的形式，用于验证代码的某些方面。例如，一组针对（标准的、可能已经被别人测试过的）`toUpperCase` 方法的测试可能如下所示：\n\
  \n```\nfunction test(label, body) {\n  if (!body()) console.log(`Failed: ${label}`);\n\
  }\ntest(\"convert Latin text to uppercase\", () => {\n  return \"hello\".toUpperCase()\
  \ == \"HELLO\";\n});\ntest(\"convert Greek text to uppercase\", () => {\n  return\
  \ \"\".toUpperCase() == \"\";\n});\ntest(\"don't convert case-less characters\"\
  , () => {\n  return \"    \".toUpperCase() == \"    \";\n});\n```\n\n像这样编写测试往往会产生相当重复、笨拙的代码。幸运的是，有一些软件可以通过提供适合表达测试的语言（以函数和方法的形式）以及在测试失败时输出信息性信息，来帮助你构建和运行测试集合（*测试套件*）。这些通常被称为*测试运行器*。\n\
  \n\n\n\n有些代码比其他代码更容易测试。通常，代码与外部对象交互得越多，设置测试上下文就越困难。上一章展示的编程风格，使用自包含的持久值而非可变对象，往往更容易测试。\n\
  \n### 调试\n\n一旦你注意到程序因行为异常或产生错误而出现问题，下一步就是弄清楚问题*是什么*。\n\n有时问题很明显。错误信息会指向程序中的特定行，如果你查看错误描述和那行代码，通常就能发现问题。\n\
  \n但并非总是如此。有时触发问题的行只是某个其他地方产生的不可靠值被以无效方式使用的第一个位置。如果你之前解决过前面章节的练习，可能已经遇到过这种情况。\n\n\
  下面的示例程序试图通过反复提取最后一位数字，然后除以该数字来去掉这一位，从而将一个整数转换为给定进制（十进制、二进制等）的字符串。但它当前产生的奇怪输出表明存在一个\
  \ bug。\n\n```\nfunction numberToString(n, base = 10) {\n  let result = \"\", sign\
  \ = \"\";\n  if (n < 0) {\n    sign = \"-\";\n    n = -n;\n  }\n  do {\n    result\
  \ = String(n % base) + result;\n    n /= base;\n  } while (n > 0);\n  return sign\
  \ + result;\n}\nconsole.log(numberToString(13, 10));\n// → 1.5e-3231.3e-3221.3e-3211.3e-3201.3e-3191.3e-3181.3...\n\
  ```\n\n即使你已经看到了问题，暂时假装没看到。我们知道程序运行不正常，想要找出原因。\n\n这时你必须克制住冲动，不要随意修改代码看看是否能改善。相反，要*思考*。分析正在发生的事情，并提出一个可能的原因理论。然后，进行额外的观察来检验这个理论——或者，如果你还没有理论，就进行额外的观察来帮助你提出一个。\n\
  \n在程序中加入几个策略性的 `console.log` 调用是获取程序运行额外信息的好方法。在这个例子中，我们希望 `n` 依次取值为 13、1 和 0。让我们在循环开始时输出它的值。\n\
  \n```\n13\n1.3\n0.13\n0.013\n...\n1.5e-323\n```\n\n*没错*。13 除以 10 并不会得到一个整数。我们需要的不是\
  \ `n /= base`，而是 `n = Math.floor(n / base)`，这样数字才能正确地“右移”。\n\n除了使用 `console.log`\
  \ 来窥探程序行为之外，另一种方法是使用浏览器的*调试器*功能。浏览器可以让你在代码的特定行设置*断点*。当程序执行到带有断点的行时，它会暂停，你可以检查此时绑定的值。我不打算详细说明，因为不同浏览器的调试器各不相同，但你可以查看浏览器的开发者工具或搜索网络获取更多信息。\n\
  \n另一种设置断点的方法是在程序中包含一条 `debugger` 语句（仅由该关键字组成）。如果浏览器的开发者工具处于活动状态，程序在遇到该语句时会暂停。\n\n\
  ### 错误传播\n\n不幸的是，并非所有问题都能由程序员预防。如果你的程序以任何方式与外部世界通信，就有可能收到格式错误的输入、工作过载或网络故障。\n\n\
  如果你只是为自己编程，你可以忽略这些问题直到它们发生。但如果你构建的东西要给别人使用，你通常希望程序做得比崩溃更好。有时正确的做法是坦然接受错误输入并继续运行。在其他情况下，最好向用户报告出了什么问题，然后放弃。但无论哪种情况，程序都必须主动对问题做出反应。\n\
  \n假设你有一个函数 `promptNumber`，它要求用户输入一个数字并返回它。如果用户输入“orange”，它应该返回什么？\n\n一种选择是让它返回一个特殊值。这类值的常见选择是\
  \ `null`、`undefined` 或 -1。\n\n```\nfunction promptNumber(question) {\n  let result\
  \ = Number(prompt(question));\n  if (Number.isNaN(result)) return null;\n  else\
  \ return result;\n}\nconsole.log(promptNumber(\"How many trees do you see?\"));\n\
  ```\n\n现在，任何调用 `promptNumber` 的代码都必须检查是否读取到了实际数字，如果没有，就必须以某种方式恢复——可能是再次询问，或者填入一个默认值。或者它也可以再次向*它的*调用者返回一个特殊值，以表明它未能完成要求。\n\
  \n在许多情况下，主要是当错误很常见且调用者应该明确考虑它们时，返回一个特殊值是表示错误的好方法。然而，它也有缺点。首先，如果函数已经可以返回所有可能的值怎么办？在这样的函数中，你必须将结果包装在一个对象中，以便能够区分成功和失败。\n\
  \n```\nfunction lastElement(array) {\n  if (array.length == 0) {\n    return {failed:\
  \ true};\n  } else {\n    return {element: array[array.length - 1]};\n  }\n}\n```\n\
  \n返回特殊值的第二个问题是它可能导致笨拙的代码。如果一段代码调用了 10 次 `promptNumber`，它就必须检查 10 次是否返回了 `null`。而如果它对发现\
  \ `null` 的响应是简单地返回 `null` 本身，那么该函数的调用者又必须检查它，依此类推。\n\n### 异常\n\n当一个函数无法正常进行时，我们*想要*做的就是停止当前操作，立即跳转到知道如何处理问题的地方。这就是*异常处理*所做的。\n\
  \n异常是一种机制，它允许遇到问题的代码*引发*（或*抛出*）一个异常。异常可以是任何值。引发异常有点像从函数中超级增强的返回：它不仅跳出当前函数，还跳出它的调用者，一直向下到启动当前执行的第一个调用。这被称为*展开堆栈*。你可能还记得第\
  \ 46 页“调用栈”中提到的函数调用栈。异常沿着这个堆栈向下飞驰，丢弃它遇到的所有调用上下文。\n\n如果异常总是直接飞驰到堆栈底部，那它们就没多大用处了。它们只会提供一种新颖的方式来炸毁你的程序。它们的力量在于，你可以在堆栈上设置“障碍物”，在异常飞驰下来时*捕获*它。一旦捕获了异常，你就可以对它进行处理以解决问题，然后继续运行程序。\n\
  \n下面是一个例子：\n\n```\nfunction promptDirection(question) {\n  let result = prompt(question);\n\
  \  if (result.toLowerCase() == \"left\") return \"L\";\n  if (result.toLowerCase()\
  \ == \"right\") return \"R\";\n  throw new Error(\"Invalid direction: \" + result);\n\
  }\n\nfunction look() {\n  if (promptDirection(\"Which way?\") == \"L\") {\n    return\
  \ \"a house\";\n  } else {\n    return \"two angry bears\";\n  }\n}\n\ntry {\n \
  \ console.log(\"You see\", look());\n} catch (error) {\n  console.log(\"Something\
  \ went wrong: \" + error);\n}\n```\n\n`throw` 关键字用于引发异常。捕获异常的方法是将一段代码包裹在 `try` 块中，后跟关键字\
  \ `catch`。当 `try` 块中的代码导致引发异常时，会执行 `catch` 块，括号中的名称绑定到异常值。在 `catch` 块执行完毕后——或者如果\
  \ `try` 块没有出现问题就执行完毕——程序会在整个 `try`/`catch` 语句之后继续执行。\n\n\n\n\n\n在这种情况下，我们使用 `Error`\
  \ 构造函数来创建异常值。这是一个标准的 JavaScript 构造函数，用于创建一个带有 `message` 属性的对象。在大多数 JavaScript 环境中，该构造函数的实例还会收集异常创建时存在的调用栈信息，即所谓的*堆栈跟踪*。这些信息存储在\
  \ `stack` 属性中，在调试问题时非常有用：它能告诉我们问题发生在哪个函数中，以及哪些函数导致了失败的调用。\n\n请注意，`look` 函数完全忽略了\
  \ `promptDirection` 可能出错的可能性。这就是异常的一大优势：错误处理代码只需要在错误发生的地方和错误被处理的地方存在。中间的函数可以完全忽略它。\n\
  \n嗯，几乎是这样……\n\n### 异常后的清理\n\n异常的影响是另一种控制流。每个可能引发异常的操作（几乎每个函数调用和属性访问）都可能导致控制权突然离开你的代码。\n\
  \n这意味着当代码有多个副作用时，即使其“常规”控制流看起来它们总会发生，异常也可能阻止其中一些副作用的执行。\n\n下面是一些非常糟糕的银行代码。\n\n```javascript\n\
  const accounts = {\n  a: 100,\n  b: 0,\n  c: 20\n};\n\nfunction getAccount() {\n\
  \  let accountName = prompt(\"Enter an account name\");\n  if (!accounts.hasOwnProperty(accountName))\
  \ {\n    throw new Error(`No such account: ${accountName}`);\n  }\n  return accountName;\n\
  }\n\nfunction transfer(from, amount) {\n  if (accounts[from] < amount) return;\n\
  \  accounts[from] -= amount;\n  accounts[getAccount()] += amount;\n}\n```\n\n`transfer`\
  \ 函数将一笔钱从一个给定账户转移到另一个账户，过程中会询问另一个账户的名称。如果给定的账户名无效，`getAccount` 会抛出一个异常。\n\n但 `transfer`\
  \ *首先*从账户中扣除金额，*然后*在将金额添加到另一个账户之前调用 `getAccount`。如果此时被异常中断，钱就会凭空消失。\n\n这段代码本可以写得更加明智一些，例如在开始转账之前先调用\
  \ `getAccount`。但这类问题往往以更微妙的方式出现。即使是看起来不会抛出异常的函数，在特殊情况下或包含程序员错误时也可能抛出异常。\n\n解决这个问题的一种方法是减少副作用。同样，一种计算新值而不是修改现有数据的编程风格会有所帮助。如果一段代码在创建新值的过程中停止运行，没有人会看到半成品值，也就没有问题。\n\
  \n但这并不总是可行的。因此，`try` 语句还有另一个特性。它们可以后跟一个 `finally` 块，代替或补充 `catch` 块。`finally` 块的意思是“无论*发生什么*，在尝试运行\
  \ `try` 块中的代码之后，都要运行这段代码。”\n\n```javascript\nfunction transfer(from, amount) {\n\
  \  if (accounts[from] < amount) return;\n  let progress = 0;\n  try {\n    accounts[from]\
  \ -= amount;\n    progress = 1;\n    accounts[getAccount()] += amount;\n    progress\
  \ = 2;\n  } finally {\n    if (progress == 1) {\n      accounts[from] += amount;\n\
  \    }\n  }\n}\n```\n\n这个版本的函数会跟踪其进度，如果在退出时发现它在一个导致程序状态不一致的点被中止，它会修复所造成的损害。\n\n\
  请注意，即使在 `try` 块中抛出异常时 `finally` 代码会运行，它也不会干扰异常。`finally` 块运行后，堆栈继续展开。\n\n编写即使在意外位置出现异常也能可靠运行的程序是很困难的。许多人干脆不理会，因为异常通常只用于特殊情况，问题可能很少发生，甚至从未被注意到。这是好事还是坏事，取决于软件在失败时会造成多大的损害。\n\
  \n### 选择性捕获\n\n当异常一直传播到堆栈底部而未被捕获时，它会被环境处理。这意味着什么因环境而异。在浏览器中，错误的描述通常会被写入 JavaScript\
  \ 控制台（可通过浏览器的“工具”或“开发者”菜单访问）。Node.js（我们将在第 20 章中讨论的无浏览器 JavaScript 环境）对数据损坏更加谨慎。当发生未处理的异常时，它会中止整个进程。\n\
  \n对于程序员错误，通常最好的做法就是让错误继续传播。未处理的异常是表示程序出现问题的合理方式，在现代浏览器中，JavaScript 控制台会提供一些信息，告诉你问题发生时哪些函数调用在堆栈上。\n\
  \n对于在常规使用中*预期*会发生的问题，用未处理的异常导致崩溃是一种糟糕的策略。\n\n对语言的不当使用，例如引用不存在的绑定、在 `null` 上查找属性或调用非函数的内容，也会导致抛出异常。这些异常也可以被捕获。\n\
  \n当进入 `catch` 块时，我们只知道 `try` 块中的*某些东西*导致了异常。但我们不知道*是什么*导致了异常，也不知道它导致了*哪个*异常。\n\n\
  JavaScript（在一个相当明显的遗漏中）不直接支持选择性捕获异常：要么捕获所有异常，要么一个也不捕获。这使得人们很容易*假设*你得到的异常就是你在编写 `catch`\
  \ 块时想到的那个异常。\n\n但事实可能并非如此。某些其他假设可能被违反，或者你可能引入了一个导致异常的 bug。下面是一个*尝试*不断调用 `promptDirection`\
  \ 直到获得有效答案的示例：\n\n```javascript\nfor (;;) {\n  try {\n    let dir = promtDirection(\"\
  Where?\"); // → 拼写错误！\n    console.log(\"You chose \", dir);\n    break;\n  } catch\
  \ (e) {\n    console.log(\"Not a valid direction. Try again.\");\n  }\n}\n```\n\n\
  `for (;;)` 结构是一种有意创建不会自行终止的循环的方式。只有在给出有效方向时我们才会跳出循环。*但是*我们拼写错了 `promptDirection`，这会导致“未定义变量”错误。由于\
  \ `catch` 块完全忽略了它的异常值（`e`），假设它知道问题所在，它错误地将绑定错误视为输入错误。这不仅会导致无限循环，还会“掩埋”关于拼写错误绑定的有用错误消息。\n\
  \n作为一般规则，不要全面捕获异常，除非是为了将它们“路由”到某个地方——例如，通过网络告诉另一个系统我们的程序崩溃了。即使如此，也要仔细考虑你可能隐藏了哪些信息。\n\
  \n因此，我们希望捕获*特定*类型的异常。我们可以通过在 `catch` 块中检查我们得到的异常是否是我们感兴趣的异常，如果不是则重新抛出它来实现。但如何识别异常呢？\n\
  \n我们可以将其 `message` 属性与我们期望的错误消息进行比较。但这不是一种可靠的编码方式——我们使用本应供人类阅读的信息（消息）来做出程序性决策。一旦有人更改（或翻译）了消息，代码就会失效。\n\
  \n相反，让我们定义一种新的错误类型，并使用 `instanceof` 来识别它。\n\n```javascript\nclass InputError extends\
  \ Error {}\n\nfunction promptDirection(question) {\n  let result = prompt(question);\n\
  \  if (result.toLowerCase() == \"left\") return \"L\";\n  if (result.toLowerCase()\
  \ == \"right\") return \"R\";\n  throw new InputError(\"Invalid direction: \" +\
  \ result);\n}\n```\n\n\n\n\n\n新的错误类扩展了 `Error`。它没有定义自己的构造函数，这意味着它继承了 `Error` 构造函数，该构造函数需要一个字符串消息作为参数。实际上，它根本没有定义任何东西——这个类是空的。`InputError`\
  \ 对象的行为与 `Error` 对象类似，只是它们有一个不同的类，我们可以通过这个类来识别它们。\n\n现在循环可以更仔细地捕获这些错误。\n\n```\n\
  for (;;) {\n  try {\n    let dir = promptDirection(\"Where?\");\n    console.log(\"\
  You chose \", dir);\n    break;\n  } catch (e) {\n    if (e instanceof InputError)\
  \ {\n      console.log(\"Not a valid direction. Try again.\");\n    } else {\n \
  \     throw e;\n    }\n  }\n}\n```\n\n这将只捕获 `InputError` 的实例，并让不相关的异常通过。如果你重新引入拼写错误，`undefined`\
  \ 绑定错误将被正确报告。\n\n### 断言\n\n*断言* 是程序内部的检查，用于验证某些事物是否符合预期。它们不是用来处理正常操作中可能出现的情况，而是用来发现程序员的错误。\n\
  \n例如，如果 `firstElement` 被描述为一个永远不应该在空数组上调用的函数，我们可以这样写：\n\n```\nfunction firstElement(array)\
  \ {\n  if (array.length == 0) {\n    throw new Error(\"firstElement called with\
  \ []\");\n  }\n  return array[0];\n}\n```\n\n现在，它不会静默地返回 `undefined`（当你读取一个不存在的数组属性时会得到这个值），而是会在你误用时立即让你的程序崩溃。这使得这类错误更不容易被忽视，并且在发生时更容易找到原因。\n\
  \n我不建议尝试为每一种可能的错误输入编写断言。那会做很多工作，并且会导致代码非常嘈杂。你应该只把它们保留给那些容易犯的错误（或者你发现自己经常犯的错误）。\n\
  \n### 总结\n\n错误和错误输入是生活中的常态。编程的一个重要部分是发现、诊断和修复错误。如果你有自动化测试套件或在程序中添加断言，问题会更容易被发现。\n\
  \n由程序外部因素引起的问题通常应该优雅地处理。有时，当问题可以在本地处理时，特殊的返回值是跟踪它们的好方法。否则，异常可能是更好的选择。\n\n抛出异常会导致调用栈展开，直到遇到下一个封闭的\
  \ try/catch 块或栈底。异常值将被传递给捕获它的 catch 块，该块应验证它是否确实是预期的异常类型，然后对其进行处理。为了应对异常引起的不可预测的控制流，可以使用\
  \ finally 块来确保一段代码在块结束时*始终*运行。\n\n### 练习\n\n#### *重试*\n\n假设你有一个函数 `primitiveMultiply`，它在\
  \ 20% 的情况下将两个数相乘，而在另外 80% 的情况下会抛出一个 `MultiplicatorUnitFailure` 类型的异常。编写一个函数来包装这个笨拙的函数，并不断重试，直到调用成功，然后返回结果。\n\
  \n确保你只处理你想要处理的异常。\n\n#### *锁定的盒子*\n\n考虑以下（相当牵强的）对象：\n\n```\nconst box = {\n   locked:\
  \ true,\n   unlock() { this.locked = false; },\n   lock() { this.locked = true;\
  \ },\n   _content: [],\n   get content() {\n     if (this.locked) throw new Error(\"\
  Locked!\");\n     return this._content;\n   }\n};\n```\n\n这是一个带锁的盒子。盒子里有一个数组，但只有在盒子解锁时才能访问它。直接访问私有的\
  \ `_content` 属性是被禁止的。\n\n编写一个名为 `withBoxUnlocked` 的函数，它接受一个函数值作为参数，解锁盒子，运行该函数，然后确保在返回之前盒子再次被锁定，无论参数函数是正常返回还是抛出了异常。\n\
  \n```\nconst box = {\n   locked: true,\n   unlock() { this.locked = false; },\n\
  \   lock() { this.locked = true; },\n   _content: [],\n   get content() {\n    \
  \ if (this.locked) throw new Error(\"Locked!\");\n     return this._content;\n \
  \  }\n};\n\nfunction withBoxUnlocked(body) {\n   // 你的代码写在这里。\n}\n\nwithBoxUnlocked(function()\
  \ {\n   box.content.push(\"gold piece\");\n});\n\ntry {\n   withBoxUnlocked(function()\
  \ {\n     throw new Error(\"Pirates on the horizon! Abort!\");\n   });\n} catch\
  \ (e) {\n  console.log(\"Error raised:\", e);\n}\n\nconsole.log(box.locked);\n//\
  \ → true\n```\n\n额外加分：确保如果你在盒子已经解锁的情况下调用 `withBoxUnlocked`，盒子保持解锁状态。\n\n“有些人遇到问题时会想：‘我知道了，我要用正则表达式。’现在他们有两个问题了。”\n\
  \n—— 杰米·扎温斯基\n\n![Image](img/f0144-01.jpg)\n\n## 9 正则表达式\n\n编程工具和技术以一种混乱的、进化的方式生存和传播。胜出的往往不是那些漂亮或出色的工具，而是那些在合适生态位中运行得足够好，或者恰好与另一项成功技术集成的工具。\n\
  \n在本章中，我将讨论这样一种工具：*正则表达式*。正则表达式是一种描述字符串数据模式的方式。它们形成了一种小型、独立的语言，是 JavaScript 以及许多其他语言和系统的一部分。\n\
  \n正则表达式既非常笨拙又极其有用。它们的语法晦涩难懂，JavaScript 为它们提供的编程接口也很笨拙。但它们是检查和操作字符串的强大工具。正确理解正则表达式将使你成为更高效的程序员。\n\
  \n### 创建正则表达式\n\n正则表达式是一种对象类型。它可以通过 `RegExp` 构造函数构造，也可以通过将模式放在正斜杠（/）字符之间作为字面量值来编写。\n\
  \n```\nlet re1 = new RegExp(\"abc\");\nlet re2 = /abc/;\n```\n\n这两个正则表达式对象都表示相同的模式：一个\
  \ *a* 字符后跟一个 *b*，再后跟一个 *c*。\n\n当使用 `RegExp` 构造函数时，模式被写成普通字符串，因此反斜杠的常规规则适用。\n\n第二种表示法，即模式出现在斜杠字符之间，对反斜杠的处理略有不同。首先，由于正斜杠会结束模式，我们需要在想要成为模式*一部分*的任何正斜杠前加上反斜杠。此外，不属于特殊字符代码（如\
  \ \\n）的反斜杠将被*保留*，而不是像在字符串中那样被忽略，并且会改变模式的含义。某些字符，如问号和加号，在正则表达式中有特殊含义，如果它们要表示字符本身，则必须在前面加上反斜杠。\n\
  \n```\nlet eighteenPlus = /eighteen\\+/;\n```\n\n### 测试匹配\n\n正则表达式对象有许多方法。最简单的是\
  \ `test`。如果你向它传递一个字符串，它将返回一个布尔值，告诉你该字符串是否包含与表达式模式匹配的内容。\n\n```\nconsole.log(/abc/.test(\"\
  abcde\"));\n// → true\nconsole.log(/abc/.test(\"abxde\"));\n// → false\n```\n\n\
  一个仅由非特殊字符组成的正则表达式简单地表示该字符序列。如果 *abc* 出现在我们测试的字符串中的任何位置（不仅仅是开头），`test` 将返回 true。\n\
  \n### 字符集合\n\n判断一个字符串是否包含 *abc* 也可以通过调用 `indexOf` 来完成。正则表达式允许我们表达更复杂的模式。\n\n假设我们想匹配任何数字。在正则表达式中，将一组字符放在方括号之间，会使表达式的该部分匹配括号内的任何字符。\n\
  \n以下两个表达式都匹配包含数字的所有字符串：\n\n```\nconsole.log(/[0123456789]/.test(\"in 1992\"));\n\
  // → true\nconsole.log(/[0-9]/.test(\"in 1992\"));\n// → true\n```\n\n\n\n\n\n在方括号内，两个字符之间的连字符（`-`）可用于表示字符范围，其顺序由字符的\
  \ Unicode 编号决定。字符 0 到 9 在此顺序中紧邻（编码 48 到 57），因此 `[0-9]` 覆盖了所有这些字符，并匹配任何数字。\n\n许多常见字符组都有内置的快捷方式。数字就是其中之一：`\\\
  d` 与 `[0-9]` 含义相同。\n\n| `\\d` | 任意数字字符 |\n| `\\w` | 字母数字字符（“单词字符”） |\n| `\\s` |\
  \ 任意空白字符（空格、制表符、换行符等） |\n| `\\D` | *非*数字字符 |\n| `\\W` | 非字母数字字符 |\n| `\\S` | 非空白字符\
  \ |\n| `.` | 除换行符外的任意字符 |\n\n因此，你可以用以下表达式匹配像 01-30-2003 15:20 这样的日期和时间格式：\n\n```\n\
  let dateTime = /\\d\\d-\\d\\d-\\d\\d\\d\\d \\d\\d:\\d\\d/;\nconsole.log(dateTime.test(\"\
  01-30-2003 15:20\"));\n// → true\nconsole.log(dateTime.test(\"30-jan-2003 15:20\"\
  ));\n// → false\n```\n\n看起来非常糟糕，不是吗？其中一半是反斜杠，产生了背景噪音，使得很难看清实际表达的模式。我们将在下一节看到这个表达式的略微改进版本。\n\
  \n这些反斜杠代码也可以在方括号内使用。例如，`[\\d.]` 表示任意数字或句点字符。但句点本身在方括号内会失去其特殊含义。其他特殊字符也是如此，例如 `+`。\n\
  \n要*反转*一组字符——即表示你想匹配除集合中字符之外的*任何*字符——你可以在左方括号后写一个脱字符（`^`）。\n\n```\nlet notBinary\
  \ = /[⁰¹]/;\nconsole.log(notBinary.test(\"1100100010100110\"));\n// → false\nconsole.log(notBinary.test(\"\
  1100100010200110\"));\n// → true\n```\n\n### 重复模式的部分\n\n我们现在知道如何匹配单个数字。如果我们想匹配一个完整的数字——一个或多个数字的序列呢？\n\
  \n当你在正则表达式中的某个元素后面加上加号（`+`）时，表示该元素可以重复一次或多次。因此，`/\\d+/` 匹配一个或多个数字字符。\n\n```\nconsole.log(/'\\\
  d+'/.test(\"'123'\"));\n// → true\nconsole.log(/'\\d+'/.test(\"''\"));\n// → false\n\
  console.log(/'\\d*'/.test(\"'123'\"));\n// → true\nconsole.log(/'\\d*'/.test(\"\
  ''\"));\n// → true\n```\n\n星号（`*`）具有类似含义，但允许模式匹配零次。后面带有星号的元素永远不会阻止模式匹配——如果找不到任何合适的文本进行匹配，它只会匹配零次。\n\
  \n问号使模式的一部分变为*可选*，意味着它可以出现零次或一次。在以下示例中，*u* 字符允许出现，但模式在缺少它时也能匹配。\n\n```\nlet neighbor\
  \ = /neighbou?r/;\nconsole.log(neighbor.test(\"neighbour\"));\n// → true\nconsole.log(neighbor.test(\"\
  neighbor\"));\n// → true\n```\n\n要表示模式应出现精确的次数，请使用花括号。例如，在元素后加上 `{4}` 要求它恰好出现四次。也可以这样指定范围：`{2,4}`\
  \ 表示元素必须至少出现两次，最多四次。\n\n这是日期和时间模式的另一个版本，允许日和月以及小时为一位或两位数字。它也更易于解读。\n\n```\nlet dateTime\
  \ = /\\d{1,2}-\\d{1,2}-\\d{4} \\d{1,2}:\\d{2}/;\nconsole.log(dateTime.test(\"1-30-2003\
  \ 8:45\"));\n// → true\n```\n\n你还可以通过省略逗号后的数字来指定开放范围。因此，`{5,}` 表示五次或更多次。\n\n###\
  \ 分组子表达式\n\n要同时对多个元素使用像 `*` 或 `+` 这样的运算符，你必须使用括号。正则表达式中用括号括起来的部分，对于其后的运算符而言，被视为一个单一元素。\n\
  \n```\nlet cartoonCrying = /boo+(hoo+)+/i;\nconsole.log(cartoonCrying.test(\"Boohoooohoohooo\"\
  ));\n// → true\n```\n\n第一个和第二个 `+` 字符分别仅应用于 *boo* 和 *hoo* 中的第二个 *o*。第三个 `+` 应用于整个组\
  \ (`hoo+`)，匹配一个或多个这样的序列。\n\n示例中表达式末尾的 `i` 使此正则表达式不区分大小写，允许它匹配输入字符串中的大写 *B*，尽管模式本身全是小写。\n\
  \n### 匹配与分组\n\n`test` 方法是匹配正则表达式的最简单方式。它只告诉你是否匹配，没有其他信息。正则表达式还有一个 `exec`（执行）方法，如果没有找到匹配则返回\
  \ `null`，否则返回一个包含匹配信息的对象。\n\n```\nlet match = /\\d+/.exec(\"one two 100\");\nconsole.log(match);\n\
  // → [\"100\"]\nconsole.log(match.index);\n// → 8\n```\n\n`exec` 返回的对象有一个 `index`\
  \ 属性，告诉我们成功匹配在字符串中的*位置*。除此之外，该对象看起来像（实际上就是）一个字符串数组，其第一个元素是匹配到的字符串。在前面的例子中，这就是我们寻找的数字序列。\n\
  \n字符串值有一个 `match` 方法，其行为类似。\n\n```\nconsole.log(\"one two 100\".match(/\\d+/));\n\
  // → [\"100\"]\n```\n\n当正则表达式包含用括号分组的子表达式时，匹配这些组的文本也会出现在数组中。整个匹配始终是第一个元素。下一个元素是由第一个组（表达式中左括号最先出现的那个）匹配的部分，然后是第二个组，依此类推。\n\
  \n```\nlet quotedText = /'([^']*)'/;\nconsole.log(quotedText.exec(\"she said 'hello'\"\
  ));\n// → [\"'hello'\", \"hello\"]\n```\n\n当一个组最终没有匹配到任何内容时（例如，后面跟着问号时），它在输出数组中的位置将包含\
  \ `undefined`。类似地，当一个组被多次匹配时，只有最后一次匹配会出现在数组中。\n\n```\nconsole.log(/bad(ly)?/.exec(\"\
  bad\"));\n// → [\"bad\", undefined]\nconsole.log(/(\\d)+/.exec(\"123\"));\n// →\
  \ [\"123\", \"3\"]\n```\n\n组对于提取字符串的一部分很有用。如果我们不仅想验证字符串是否包含日期，还想提取它并构造一个表示日期的对象，我们可以将括号包裹在数字模式周围，并直接从\
  \ `exec` 的结果中提取日期。\n\n但首先，我们将简短地绕个弯，讨论 JavaScript 中表示日期和时间值的内置方式。\n\n### Date 类\n\
  \nJavaScript 有一个用于表示日期的标准类——或者更准确地说，表示时间点。它叫做 `Date`。如果你简单地使用 `new` 创建一个日期对象，你会得到当前的日期和时间。\n\
  \n```\nconsole.log(new Date());\n// → Sat Sep 01 2018 15:24:32 GMT+0200 (CEST)\n\
  ```\n\n你也可以为特定时间创建一个对象。\n\n```\nconsole.log(new Date(2009, 11, 9));\n// → Wed Dec\
  \ 09 2009 00:00:00 GMT+0100 (CET)\nconsole.log(new Date(2009, 11, 9, 12, 59, 59,\
  \ 999));\n// → Wed Dec 09 2009 12:59:59 GMT+0100 (CET)\n```\n\nJavaScript 使用一种约定，月份编号从零开始（因此\
  \ 12 月是 11），而日期编号从 1 开始。这令人困惑且愚蠢。请小心。\n\n最后四个参数（小时、分钟、秒和毫秒）是可选的，未提供时视为零。\n\n时间戳存储为自\
  \ 1970 年初以来经过的毫秒数，采用 UTC 时区。这遵循了大约那时发明的“Unix 时间”所设定的约定。对于 1970 年之前的时间，你可以使用负数。日期对象上的\
  \ `getTime` 方法返回这个数字。可以想象，它很大。\n\n```\nconsole.log(new Date(2013, 11, 19).getTime());\n\
  // → 1387407600000\nconsole.log(new Date(1387407600000));\n// → Thu Dec 19 2013\
  \ 00:00:00 GMT+0100 (CET)\n```\n\n\n\n\n如果你给 `Date` 构造函数传入一个参数，该参数会被视为毫秒数。你可以通过创建一个新的\
  \ `Date` 对象并调用其 `getTime` 方法，或者直接调用 `Date.now` 函数来获取当前的毫秒数。\n\n`Date` 对象提供了诸如 `getFullYear`、`getMonth`、`getDate`、`getHours`、`getMinutes`\
  \ 和 `getSeconds` 等方法来提取其组成部分。除了 `getFullYear`，还有 `getYear`，它返回的是年份减去 1900（例如 98\
  \ 或 119），这个函数基本没什么用。\n\n将我们感兴趣的表达式部分用括号括起来，就可以从字符串中创建日期对象了。\n\n```\nfunction getDate(string)\
  \ {\n\n  let [_, month, day, year] =\n\n    /(\\d{1,2})-(\\d{1,2})-(\\d{4})/.exec(string);\n\
  \n  return new Date(year, month - 1, day);\n\n}\n\nconsole.log(getDate(\"1-30-2003\"\
  ));\n\n// → Thu Jan 30 2003 00:00:00 GMT+0100 (CET)\n```\n\n`_`（下划线）绑定被忽略，仅用于跳过\
  \ `exec` 返回的数组中的完整匹配元素。\n\n### 单词边界与字符串边界\n\n遗憾的是，`getDate` 也会愉快地从字符串 \"100-1-30000\"\
  \ 中提取出无意义的日期 00-1-3000。匹配可能发生在字符串中的任何位置，因此在这种情况下，它会从第二个字符开始，到倒数第二个字符结束。\n\n如果我们希望强制匹配必须覆盖整个字符串，可以添加标记\
  \ `^` 和 `$`。脱字符 `^` 匹配输入字符串的开头，而美元符号 `$` 匹配结尾。因此，`/^\\d+$/` 匹配完全由一个或多个数字组成的字符串，`/^!/`\
  \ 匹配任何以感叹号开头的字符串，而 `/x^/` 不匹配任何字符串（因为字符串开头之前不可能有 `x`）。\n\n另一方面，如果我们只想确保日期在单词边界处开始和结束，可以使用标记\
  \ `\\b`。单词边界可以是字符串的开头或结尾，也可以是字符串中一侧是单词字符（如 `\\w` 所定义）、另一侧是非单词字符的任意位置。\n\n```\nconsole.log(/cat/.test(\"\
  concatenate\"));\n// → true\n\nconsole.log(/\\bcat\\b/.test(\"concatenate\"));\n\
  // → false\n```\n\n注意，边界标记并不匹配实际字符。它只是强制正则表达式仅在模式中该位置满足特定条件时才进行匹配。\n\n### 选择模式\n\
  \n假设我们想知道一段文本是否不仅包含一个数字，而且该数字后面跟着单词 *pig*、*cow* 或 *chicken* 之一，或者它们的复数形式。\n\n我们可以编写三个正则表达式并依次测试它们，但有一种更好的方法。管道字符（`|`）表示其左侧模式与右侧模式之间的选择。因此可以这样写：\n\
  \n```\nlet animalCount = /\\b\\d+ (pig|cow|chicken)s?\\b/;\n\nconsole.log(animalCount.test(\"\
  15 pigs\"));\n// → true\n\nconsole.log(animalCount.test(\"15 pigchickens\"));\n\
  // → false\n```\n\n括号可用于限制管道运算符所作用的模式部分，并且可以将多个这样的运算符相邻放置，以表达在多于两个备选项之间的选择。\n\n\
  ### 匹配的机制\n\n从概念上讲，当你使用 `exec` 或 `test` 时，正则表达式引擎会尝试在字符串中寻找匹配：首先从字符串开头尝试匹配表达式，然后从第二个字符开始，依此类推，直到找到匹配或到达字符串末尾。它要么返回找到的第一个匹配，要么根本找不到任何匹配。\n\
  \n为了进行实际的匹配，引擎将正则表达式视为某种流程图。以下是前面示例中牲畜表达式的流程图：\n\n![Image](img/f0152-01.jpg)\n\n\
  如果我们能找到一条从图表左侧到右侧的路径，那么表达式就匹配成功。我们会在字符串中保持一个当前位置，每次经过一个方框时，都会验证当前位置之后的字符串部分是否与该方框匹配。\n\
  \n因此，如果我们尝试从位置 4 匹配 \"the 3 pigs\"，在流程图中的进展如下：\n\n*   在位置 4，有一个单词边界，因此我们可以通过第一个方框。\n\
  *   仍在位置 4，我们找到一个数字，因此也可以通过第二个方框。\n*   在位置 5，一条路径循环回到第二个（数字）方框之前，而另一条路径则向前通过包含单个空格字符的方框。这里有一个空格，而不是数字，因此我们必须走第二条路径。\n\
  *   现在我们位于位置 6（*pigs* 的开头），并处于图表中的三叉分支处。这里没有看到 *cow* 或 *chicken*，但确实看到了 *pig*，因此我们走那条分支。\n\
  *   在位置 9，经过三叉分支后，一条路径跳过 *s* 方框直接到达最后的单词边界，而另一条路径匹配一个 *s*。这里有一个 *s* 字符，而不是单词边界，因此我们通过\
  \ *s* 方框。\n*   我们位于位置 10（字符串末尾），只能匹配一个单词边界。字符串的末尾算作一个单词边界，因此我们通过最后一个方框，成功匹配了这个字符串。\n\
  \n### 回溯\n\n正则表达式 `/\\b([01]+b|[\\da-f]+h|\\d+)\\b/` 匹配一个二进制数后跟 `b`，或一个十六进制数（即基数为\
  \ 16，字母 `a` 到 `f` 代表数字 10 到 15）后跟 `h`，或一个不带后缀字符的普通十进制数。这是对应的流程图：\n\n![Image](img/f0153-02.jpg)\n\
  \n在匹配这个表达式时，经常会发生这样的情况：即使输入实际上不包含二进制数，也会进入顶部（二进制）分支。例如，当匹配字符串 \"103\" 时，直到遇到字符 3\
  \ 才意识到我们走错了分支。该字符串*确实*匹配这个表达式，只是不匹配当前所在的分支。\n\n因此，匹配器会*回溯*。当进入一个分支时，它会记住当前位置（在此例中，是字符串的开头，刚经过图表中的第一个边界方框），以便在当前分支不成功时能够返回并尝试另一个分支。对于字符串\
  \ \"103\"，在遇到字符 3 后，它会开始尝试十六进制数分支，但由于数字后面没有 `h`，该分支再次失败。于是它尝试十进制数分支。这个分支匹配，最终报告匹配成功。\n\
  \n匹配器一旦找到完整匹配就会停止。这意味着如果多个分支都可能匹配一个字符串，则只会使用第一个分支（按分支在正则表达式中出现的顺序）。\n\n回溯也会发生在重复运算符（如\
  \ `+` 和 `*`）上。如果你用 `/^.*x/` 匹配 \"abcxe\"，`.*` 部分会首先尝试消耗整个字符串。然后引擎会意识到它需要一个 `x` 来匹配模式。由于字符串末尾之后没有\
  \ `x`，星号运算符会尝试少匹配一个字符。但匹配器在 \"abcx\" 之后也没有找到 `x`，因此它再次回溯，将星号运算符匹配为仅 \"abc\"。*现在*它在需要的位置找到了\
  \ `x`，并报告从位置 0 到 4 匹配成功。\n\n有可能编写出需要进行*大量*回溯的正则表达式。当某个模式可以以多种不同方式匹配一段输入时，就会出现这个问题。例如，如果在编写二进制数正则表达式时搞混了，可能会不小心写出类似\
  \ `/([01]+)+b/` 这样的表达式。\n\n![Image](img/f0154-01.jpg)\n\n如果它试图匹配一长串 0 和 1 但没有结尾的\
  \ `b` 字符，匹配器会先经过内层循环直到数字耗尽。然后它注意到没有 `b`，于是回溯一个位置，经过外层循环一次，再次放弃，并尝试再次从内层循环中回溯。它会继续尝试通过这两个循环的所有可能路径。这意味着每增加一个字符，工作量就会*翻倍*。即使只有几十个字符，最终的匹配也会花费几乎无限长的时间。\n\
  \n### replace 方法\n\n\n\n\n`String` 值有一个 `replace` 方法，可用于将字符串的一部分替换为另一个字符串。\n\n```\n\
  console.log(\"papa\".replace(\"p\", \"m\"));\n// → mapa\n```\n\n第一个参数也可以是一个正则表达式，在这种情况下，正则表达式的第一个匹配项会被替换。当在正则表达式中添加\
  \ `g` 选项（表示 `global`）时，字符串中的 `所有` 匹配项都会被替换，而不仅仅是第一个。\n\n```\nconsole.log(\"Borobudur\"\
  .replace(/[ou]/, \"a\"));\n// → Barobudur\n\nconsole.log(\"Borobudur\".replace(/[ou]/g,\
  \ \"a\"));\n// → Barabadar\n```\n\n如果替换一个匹配项还是所有匹配项的选择是通过 `replace` 的额外参数或通过提供另一个方法\
  \ `replaceAll` 来决定的，那会更合理。但出于某些不幸的原因，这个选择依赖于正则表达式的一个属性。\n\n将正则表达式与 `replace` 结合使用的真正威力在于，我们可以在替换字符串中引用匹配的组。例如，假设我们有一个大字符串，其中包含人名，每行一个名字，格式为\
  \ `Lastname, Firstname`。如果我们想交换这些名字并去掉逗号，得到 `Firstname Lastname` 格式，可以使用以下代码：\n\n\
  ```\nconsole.log(\n  \"Liskov, Barbara\\nMcCarthy, John\\nWadler, Philip\"\n   \
  \ .replace(/(\\w+), (\\w+)/g, \"$2 $1\"));\n// → Barbara Liskov\n// John McCarthy\n\
  // Philip Wadler\n```\n\n替换字符串中的 `$1` 和 `$2` 引用模式中的括号分组。`$1` 被替换为与第一个组匹配的文本，`$2`\
  \ 被替换为与第二个组匹配的文本，依此类推，直到 `$9`。整个匹配项可以用 `$&` 引用。\n\n可以将一个函数（而不是字符串）作为第二个参数传递给 `replace`。对于每次替换，该函数将以匹配的组（以及整个匹配项）作为参数被调用，其返回值将被插入到新字符串中。\n\
  \n这是一个小例子：\n\n```\nlet s = \"the cia and fbi\";\nconsole.log(s.replace(/\\b(fbi|cia)\\\
  b/g,\n                str => str.toUpperCase()));\n// → the CIA and FBI\n```\n\n\
  这是一个更有趣的例子：\n\n```\nlet stock = \"1 lemon, 2 cabbages, and 101 eggs\";\nfunction\
  \ minusOne(match, amount, unit) {\n  amount = Number(amount) - 1;\n  if (amount\
  \ == 1) { // 只剩一个，去掉 's'\n    unit = unit.slice(0, unit.length - 1);\n  } else if\
  \ (amount == 0) {\n    amount = \"no\";\n  }\n  return amount + \" \" + unit;\n\
  }\nconsole.log(stock.replace(/(\\d+) (\\w+)/g, minusOne));\n// → no lemon, 1 cabbage,\
  \ and 100 eggs\n```\n\n这段代码接收一个字符串，找到所有数字后跟一个字母数字单词的出现，并返回一个字符串，其中每个这样的出现都减一。\n\n\
  `(\\d+)` 组最终成为函数的 `amount` 参数，而 `(\\w+)` 组绑定到 `unit`。函数将 `amount` 转换为数字——这总是可行的，因为它匹配了\
  \ `\\d+`——并在只剩一个或零个时进行一些调整。\n\n### 贪婪\n\n可以使用 `replace` 编写一个函数，从一段 JavaScript 代码中删除所有注释。这是第一次尝试：\n\
  \n```\nfunction stripComments(code) {\n  return code.replace(/\\/\\/.*|\\/\\*[^]*\\\
  *\\//g, \"\");\n}\nconsole.log(stripComments(\"1 + /* 2 */3\"));\n// → 1 + 3\nconsole.log(stripComments(\"\
  x = 10;// ten!\"));\n// → x = 10;\nconsole.log(stripComments(\"1 /* a */+/* b */\
  \ 1\"));\n// → 1 1\n```\n\n`or` 运算符之前的部分匹配两个斜杠字符后跟任意数量的非换行字符。多行注释的部分更复杂。我们使用 `[^]`（任何不在空字符集中的字符）来匹配任意字符。这里不能只使用点号，因为块注释可以跨行，而点号不匹配换行符。\n\
  \n但最后一行的输出似乎出错了。为什么？\n\n正如我在回溯部分所描述的，表达式中的 `[^]*` 部分首先会尽可能多地匹配。如果这导致模式的下一部分失败，匹配器会回退一个字符并重新尝试。在示例中，匹配器首先尝试匹配字符串的剩余部分，然后从那里回退。它会在回退四个字符后找到\
  \ `*/` 的出现并匹配它。这不是我们想要的——我们的意图是匹配单个注释，而不是一直走到代码末尾并找到最后一个块注释的结尾。\n\n由于这种行为，我们说重复运算符（`+`、`*`、`?`\
  \ 和 `{}`）是 `贪婪` 的，意思是它们尽可能多地匹配，然后从那里回溯。如果在它们后面加上问号（`+?`、`*?`、`??`、`{}?`），它们就变成非贪婪的，并开始尽可能少地匹配，只有当剩余模式无法匹配较小的匹配时才匹配更多。\n\
  \n这正是我们在这个案例中想要的。通过让星号匹配最小的字符跨度，使我们到达 `*/`，我们只消耗一个块注释，而不会更多。\n\n```\nfunction stripComments(code)\
  \ {\n  return code.replace(/\\/\\/.*|\\/\\*[^]*?\\*\\//g, \"\");\n}\nconsole.log(stripComments(\"\
  1 /* a */+/* b */ 1\"));\n// → 1 + 1\n```\n\n正则表达式程序中的许多错误都可以追溯到无意中使用了贪婪运算符，而实际上非贪婪运算符效果更好。当使用重复运算符时，首先考虑非贪婪变体。\n\
  \n### 动态创建 RegExp 对象\n\n在某些情况下，你在编写代码时可能不知道需要匹配的确切模式。假设你想在一段文本中查找用户的名字，并用下划线字符将其括起来以突出显示。由于只有在程序实际运行时才知道名字，因此不能使用基于斜杠的表示法。\n\
  \n但你可以构建一个字符串，并在其上使用 `RegExp` 构造函数。这是一个例子：\n\n```\nlet name = \"harry\";\nlet text\
  \ = \"Harry is a suspicious character.\";\nlet regexp = new RegExp(\"\\\\b(\" +\
  \ name + \")\\\\b\", \"gi\");\nconsole.log(text.replace(regexp, \"_$1_\"));\n//\
  \ → _Harry_ is a suspicious character.\n```\n\n在创建 `\\b` 边界标记时，我们必须使用两个反斜杠，因为我们是在普通字符串中编写它们，而不是在斜杠包围的正则表达式中。`RegExp`\
  \ 构造函数的第二个参数包含正则表达式的选项——在本例中，`\"gi\"` 表示全局且不区分大小写。\n\n但如果名字是 `\"dea+hl[]rd\"`，因为我们的用户是一个书呆子青少年呢？那将导致一个无意义的正则表达式，实际上无法匹配用户的名字。\n\
  \n为了解决这个问题，我们可以在任何具有特殊含义的字符前添加反斜杠。\n\n```\nlet name = \"dea+hl[]rd\";\nlet text\
  \ = \"This dea+hl[]rd guy is super annoying.\";\nlet escaped = name.replace(/[\\\
  \\[.+*?(){|^$]/g, \"\\\\$&\");\nlet regexp = new RegExp(\"\\\\b\" + escaped + \"\
  \\\\b\", \"gi\");\nconsole.log(text.replace(regexp, \"_$&_\"));\n// → This _dea+hl[]rd_\
  \ guy is super annoying.\n```\n\n### search 方法\n\n字符串的 `indexOf` 方法不能与正则表达式一起调用。但还有另一个方法\
  \ `search`，它确实期望一个正则表达式。与 `indexOf` 类似，它返回表达式首次出现的索引，如果未找到则返回 `−1`。\n\n```\nconsole.log(\"\
  \   word\".search(/\\S/));\n// → 2\nconsole.log(\"     \".search(/\\S/));\n// →\
  \ -1\n```\n\n不幸的是，没有办法指示匹配应从给定的偏移量开始（就像我们可以用 `indexOf` 的第二个参数那样），这通常很有用。\n\n###\
  \ lastIndex 属性\n\n`exec` 方法同样没有提供从字符串中给定位置开始搜索的便捷方式。但它确实提供了一种 `不` 便捷的方式。\n\n正则表达式对象具有属性。其中一个属性是\
  \ `source`，它包含创建该表达式所用的字符串。另一个属性是 `lastIndex`，它在某些有限的情况下控制下一个匹配将从哪里开始。\n\n\n\n\n\
  \n这些情况是：正则表达式必须启用全局（`g`）或粘性（`y`）选项，并且匹配必须通过 `exec` 方法进行。同样，一个更少混淆的解决方案本可以是允许向 `exec`\
  \ 传递一个额外参数，但混淆是 JavaScript 正则表达式接口的一个基本特征。\n\n```\nlet pattern = /y/g;\n\npattern.lastIndex\
  \ = 3;\n\nlet match = pattern.exec(\"xyzzy\");\n\nconsole.log(match.index);\n\n\
  // → 4\n\nconsole.log(pattern.lastIndex);\n\n// → 5\n```\n\n如果匹配成功，对 `exec` 的调用会自动将\
  \ `lastIndex` 属性更新为匹配结束后的位置。如果没有找到匹配，`lastIndex` 会被重置为零，这也是新构造的正则表达式对象中该属性的值。\n\n\
  全局选项和粘性选项的区别在于：当启用粘性时，匹配仅当它从 `lastIndex` 处直接开始时才会成功；而使用全局选项时，它会向前搜索一个可以开始匹配的位置。\n\
  \n```\nlet global = /abc/g;\n\nconsole.log(global.exec(\"xyz abc\"));\n\n// → [\"\
  abc\"]\n\nlet sticky = /abc/y;\n\nconsole.log(sticky.exec(\"xyz abc\"));\n\n// →\
  \ null\n```\n\n当对多个 `exec` 调用使用同一个正则表达式值时，这些对 `lastIndex` 属性的自动更新可能会引发问题。你的正则表达式可能会意外地从上一次调用遗留的索引处开始。\n\
  \n```\nlet digit = /\\d/g;\n\nconsole.log(digit.exec(\"here it is: 1\"));\n\n//\
  \ → [\"1\"]\n\nconsole.log(digit.exec(\"and now: 1\"));\n\n// → null\n```\n\n全局选项的另一个有趣效果是，它改变了字符串上\
  \ `match` 方法的工作方式。当使用全局表达式调用时，`match` 不会返回类似于 `exec` 返回的数组，而是会找到字符串中模式的所有匹配项，并返回一个包含匹配字符串的数组。\n\
  \n```\nconsole.log(\"Banana\".match(/an/g));\n\n// → [\"an\", \"an\"]\n```\n\n因此，使用全局正则表达式时要谨慎。它们必要的情况——调用\
  \ `replace` 以及你想显式使用 `lastIndex` 的地方——通常是你唯一需要使用它们的地方。\n\n#### *遍历匹配项*\n\n一种常见的做法是扫描字符串中模式的所有出现位置，以便在循环体中访问匹配对象。我们可以通过使用\
  \ `lastIndex` 和 `exec` 来实现这一点。\n\n```\nlet input = \"A string with 3 numbers in\
  \ it... 42 and 88.\";\n\nlet number = /\\b\\d+\\b/g;\n\nlet match;\n\nwhile (match\
  \ = number.exec(input)) {\n\n  console.log(\"Found\", match[0], \"at\", match.index);\n\
  \n}\n\n// → Found 3 at 14\n\n// Found 42 at 33\n\n// Found 88 at 40\n```\n\n这利用了赋值表达式（`=`）的值就是所赋的值这一事实。因此，通过在\
  \ `while` 语句中使用 `match = number.exec(input)` 作为条件，我们在每次迭代开始时执行匹配，将结果保存到一个绑定中，并在找不到更多匹配时停止循环。\n\
  \n### 解析 INI 文件\n\n为了结束本章，我们将看一个需要正则表达式的问题。假设我们正在编写一个程序，从互联网上自动收集关于我们敌人的信息。（我们实际上不会在这里编写那个程序，只编写读取配置文件的部分。抱歉。）配置文件看起来像这样：\n\
  \n```\nsearchengine=https://duckduckgo.com/?q=$1\n\nspitefulness=9.7\n\n; 注释以分号开头...\n\
  \n; 每个部分涉及一个单独的敌人\n\n[larry]\n\nfullname=Larry Doe\n\ntype=kindergarten bully\n\n\
  website=http://www.geocities.com/CapeCanaveral/11451\n\n[davaeorn]\n\nfullname=Davaeorn\n\
  \ntype=evil wizard\n\noutputdir=/home/marijn/enemies/davaeorn\n```\n\n这种格式（一种广泛使用的格式，通常称为\
  \ *INI* 文件）的确切规则如下：\n\n*   空行和以分号开头的行被忽略。\n*   用 `[` 和 `]` 包裹的行开始一个新部分。\n*   包含字母数字标识符后跟\
  \ `=` 字符的行，向当前部分添加一个设置。\n*   其他任何内容都是无效的。\n\n我们的任务是将这样一个字符串转换为一个对象，该对象的属性保存第一个部分标题之前设置的字符串，以及用于部分的子对象，这些子对象保存该部分的设置。\n\
  \n由于格式需要逐行处理，将文件拆分为单独的行是一个好的开始。我们在第 72 页的“字符串及其属性”中看到了 `split` 方法。然而，某些操作系统不仅使用换行符来分隔行，还使用回车符后跟换行符（`\"\
  \\r\\n\"`）。鉴于 `split` 方法也允许正则表达式作为其参数，我们可以使用像 `/\\r?\\n/` 这样的正则表达式来拆分，从而允许行之间同时存在\
  \ `\"\\n\"` 和 `\"\\r\\n\"`。\n\n```\nfunction parseINI(string) {\n\n  // 从一个保存顶级字段的对象开始\n\
  \n  let result = {};\n\n  let section = result;\n\n  string.split(/\\r?\\n/).forEach(line\
  \ => {\n\n    let match;\n\n    if (match = line.match(/^(\\w+)=(.*)$/)) {\n\n      section[match[1]]\
  \ = match[2];\n\n    } else if (match = line.match(/^\\[(.*)\\]$/)) {\n\n      section\
  \ = result[match[1]] = {};\n\n    } else if (!/^\\s*(;.*)?$/.test(line)) {\n\n      throw\
  \ new Error(\"Line '\" + line + \"' is not valid.\");\n\n    }\n\n  });\n\n  return\
  \ result;\n\n}\n```\n\n```\nconsole.log(parseINI(`\n\nname=Vasilis\n\n[address]\n\
  \ncity=Tessaloniki`));\n\n// → {name: \"Vasilis\", address: {city: \"Tessaloniki\"\
  }}\n```\n\n代码遍历文件的行并构建一个对象。顶层的属性直接存储到该对象中，而在部分中找到的属性则存储在一个单独的部分对象中。`section` 绑定指向当前部分的对象。\n\
  \n有两种重要的行——部分标题或属性行。当一行是常规属性时，它被存储在当前部分中。当它是部分标题时，会创建一个新的部分对象，并将 `section` 设置为指向它。\n\
  \n注意反复使用 `^` 和 `$` 来确保表达式匹配整行，而不仅仅是部分行。省略它们会导致代码大部分情况下能工作，但对于某些输入行为异常，这可能是一个难以追踪的\
  \ bug。\n\n模式 `if (match = string.match(...))` 类似于将赋值用作 `while` 条件的技巧。你通常不确定对 `match`\
  \ 的调用是否会成功，因此你只能在测试这一点的 `if` 语句内部访问结果对象。为了不破坏 `else if` 形式的愉快链条，我们将匹配的结果赋值给一个绑定，并立即将该赋值用作\
  \ `if` 语句的测试。\n\n如果一行既不是部分标题也不是属性，函数会使用表达式 `/^\\s*(;.*)?$/` 检查它是否是注释或空行。你明白它是如何工作的吗？括号内的部分会匹配注释，而\
  \ `?` 确保它也匹配仅包含空白字符的行。当一行不匹配任何预期形式时，函数会抛出一个异常。\n\n### 国际字符\n\n由于 JavaScript 最初的简单实现，以及后来这种简单方法被固定为标准行为，JavaScript\
  \ 的正则表达式对于英语中不出现的字符相当不智能。例如，就 JavaScript 的正则表达式而言，“单词字符”仅指拉丁字母表中的 26 个字符（大写或小写）、十进制数字，以及（出于某种原因）下划线字符。像\
  \ *é* 或 *β* 这样绝对是单词字符的字符，不会匹配 `\\w`（并且会匹配大写 `\\W`，即非单词类别）。\n\n由于一个奇怪的历史偶然，`\\s`（空白字符）没有这个问题，它会匹配\
  \ Unicode 标准认为是空白字符的所有字符，包括不间断空格和蒙古语元音分隔符等。\n\n\n\n\n另一个问题是，默认情况下，正则表达式作用于代码单元（如第\
  \ 92 页的“字符串与字符编码”所述），而非实际字符。这意味着由两个代码单元组成的字符会表现异常。\n\n```\nconsole.log(/![Image](img/c0162-01.jpg){3}/.test(\"\
  ![Image](img/c0162-02.jpg)\"));\n// → false\nconsole.log(/<.>/.test(\"<![Image](img/c0162-03.jpg)>\"\
  ));\n// → false\nconsole.log(/<.>/u.test(\"<![Image](img/c0162-03.jpg)>\"));\n//\
  \ → true\n```\n\n问题在于第一行中的![Image](img/c0162-01.jpg)被视为两个代码单元，而`{3}`部分仅应用于第二个代码单元。类似地，点号匹配单个代码单元，而不是构成玫瑰表情的两个代码单元。\n\
  \n你必须为正则表达式添加`u`选项（Unicode）才能正确处理此类字符。不幸的是，错误行为仍然是默认行为，因为更改它可能会破坏依赖此行为的现有代码。\n\n\
  尽管这刚刚标准化，并且在撰写本文时尚未广泛支持，但可以在正则表达式（必须启用 Unicode 选项）中使用`\\p`来匹配 Unicode 标准分配了给定属性的所有字符。\n\
  \n```\nconsole.log(/\\p{Script=Greek}/u.test(\"\"));\n// → true\nconsole.log(/\\\
  p{Script=Arabic}/u.test(\"\"));\n// → false\nconsole.log(/\\p{Alphabetic}/u.test(\"\
  \"));\n// → true\nconsole.log(/\\p{Alphabetic}/u.test(\"!\"));\n// → false\n```\n\
  \nUnicode 定义了许多有用的属性，但找到你需要的属性可能并不总是那么容易。你可以使用`\\p{Property=Value}`表示法来匹配任何具有该属性给定值的字符。如果省略属性名称，如`\\\
  p{Name}`，则假定该名称是二进制属性（如`Alphabetic`）或类别（如`Number`）。\n\n### 总结\n\n正则表达式是表示字符串中模式的对象。它们使用自己的语言来表达这些模式。\n\
  \n- `/abc/` 字符序列\n- `/[abc]/` 字符集中的任意字符\n- `/[^abc]/` 不在字符集中的任意字符\n- `/[0-9]/` 字符范围内的任意字符\n\
  - `/x+/` 模式 x 出现一次或多次\n- `/x+?/` 出现一次或多次，非贪婪\n- `/x*/` 出现零次或多次\n- `/x?/` 出现零次或一次\n\
  - `/x{2,4}/` 出现二到四次\n- `/(abc)/` 分组\n- `/a|b|c/` 多个模式中的任意一个\n- `/\\d/` 任意数字字符\n\
  - `/\\w/` 字母数字字符（“单词字符”）\n- `/\\s/` 任意空白字符\n- `/./` 除换行符外的任意字符\n- `/\\b/` 单词边界\n\
  - `/^/` 输入开头\n- `/$/` 输入结尾\n\n正则表达式有一个`test`方法，用于测试给定字符串是否匹配。它还有一个`exec`方法，当找到匹配时，返回一个包含所有匹配组的数组。这样的数组有一个`index`属性，指示匹配开始的位置。\n\
  \n字符串有`match`方法用于匹配正则表达式，以及`search`方法用于搜索，只返回匹配的起始位置。它们的`replace`方法可以用替换字符串或函数替换模式的匹配项。\n\
  \n正则表达式可以有选项，写在结束斜杠之后。`i`选项使匹配不区分大小写。`g`选项使表达式成为全局的，这会导致`replace`方法替换所有实例，而不仅仅是第一个。`y`选项使其粘性，这意味着在查找匹配时不会向前搜索并跳过字符串的一部分。`u`选项启用\
  \ Unicode 模式，修复了处理占用两个代码单元的字符时的一些问题。\n\n正则表达式是一种锋利的工具，但手柄却很笨拙。它们极大地简化了某些任务，但在应用于复杂问题时很快就会变得难以管理。学会使用它们的一部分是抵制试图将无法清晰表达的东西硬塞进去的冲动。\n\
  \n### 练习\n\n在完成这些练习的过程中，你几乎不可避免地会被某些正则表达式莫名其妙的行为所困惑和沮丧。有时，将表达式输入到在线工具（如[`debuggex.com`](https://debuggex.com)）中，查看其可视化是否与你的意图相符，并试验它对各种输入字符串的响应方式，会有所帮助。\n\
  \n#### 正则表达式高尔夫\n\n代码高尔夫是一个术语，用于尝试用尽可能少的字符表达特定程序的游戏。类似地，正则表达式高尔夫是编写尽可能小的正则表达式来匹配给定模式，并且*只*匹配该模式的实践。\n\
  \n对于以下每一项，编写一个正则表达式来测试给定的子字符串是否出现在字符串中。正则表达式应仅匹配包含所描述子字符串之一的字符串。除非明确提及，否则不要担心单词边界。当你的表达式有效时，看看能否让它更小。\n\
  \n1. car 和 cat\n2. pop 和 prop\n3. ferret、ferry 和 ferrari\n4. 以 ious 结尾的任意单词\n5.\
  \ 空白字符后跟句点、逗号、冒号或分号\n6. 长度超过六个字母的单词\n7. 不含字母 e（或 E）的单词\n\n参考本章总结中的表格。用几个测试字符串测试每个解决方案。\n\
  \n#### 引号样式\n\n假设你写了一个故事，并全程使用单引号标记对话片段。现在你想将所有对话引号替换为双引号，同时保留像 aren’t 这样的缩略词中使用的单引号。\n\
  \n想出一个区分这两种引号用法的模式，并编写一个调用`replace`方法进行正确替换的代码。\n\n#### 数字再次\n\n编写一个仅匹配 JavaScript\
  \ 风格数字的表达式。它必须支持数字前的可选减号或加号、小数点以及指数表示法——`5e-3`或`1E10`——指数前同样带有可选符号。还要注意，小数点前后不一定需要有数字，但数字不能只是一个点。也就是说，`.5`和`5.`是有效的\
  \ JavaScript 数字，但单独的点不是。\n\n“编写易于删除的代码，而不是易于扩展的代码。”\n\n—— Tef，《编程很糟糕》\n\n![Image](img/f0166-01.jpg)\n\
  \n## 10 模块\n\n理想的程序具有水晶般清晰的结构。它的工作方式易于解释，每个部分都扮演着明确的角色。\n\n典型的真实程序是有机生长的。随着新需求的出现，新的功能被添加进来。结构化——以及保持结构——是额外的工作。这是一项只有在未来，当其他人再次处理该程序时才会得到回报的工作。因此，很容易忽视它，并允许程序的各个部分变得深度纠缠。\n\
  \n这会导致两个实际问题。首先，理解这样的系统很困难。如果一切都可以相互影响，那么很难孤立地看待任何给定的部分。你被迫对整个事物建立整体理解。其次，如果你想在其他情况下使用该程序中的任何功能，重写它可能比试图将其从上下文中解脱出来更容易。\n\
  \n“大泥球”这个短语经常用于这种大型、无结构的程序。所有东西都粘在一起，当你试图挑出一块时，整个东西就会散架，你的手也会变脏。\n\n### 模块作为构建块\n\
  \n模块是为了避免这些问题而做出的尝试。模块是一段程序，它指定了它依赖的其他部分以及它为其他模块提供的功能（其接口）。\n\n\n\n\n\n模块接口与我们在第\
  \ 97 页“封装”一节中看到的对象接口有很多共同之处。它们将模块的一部分暴露给外部世界，而将其余部分保持私有。通过限制模块之间的交互方式，系统变得更像乐高积木，各个部件通过定义良好的连接器进行交互，而不是像泥巴那样所有东西都混在一起。\n\
  \n模块之间的关系被称为*依赖关系*。当一个模块需要另一个模块中的某个部分时，就称它依赖于该模块。如果这一事实在模块本身中明确指定，就可以用来确定需要哪些其他模块才能使用给定模块，并自动加载依赖项。\n\
  \n要以这种方式分离模块，每个模块都需要有自己的私有作用域。\n\n仅仅将 JavaScript 代码放入不同的文件并不能满足这些要求。这些文件仍然共享同一个全局命名空间。它们可能有意或无意地干扰彼此的绑定。而且依赖关系结构仍然不清晰。我们可以做得更好，正如我们将在本章后面看到的那样。\n\
  \n为程序设计合适的模块结构可能很困难。在你还处于探索问题、尝试不同方法以找出可行方案的阶段时，你可能不想过多担心这个问题，因为它可能会造成很大的干扰。一旦你有了感觉稳固的东西，那就是退后一步并组织它的好时机。\n\
  \n### 包\n\n将程序构建成独立的部分，并且能够真正独立运行这些部分的好处之一是，你可以在不同的程序中应用相同的部分。\n\n但是如何实现这一点呢？假设我想在另一个程序中使用第\
  \ 160 页“解析 INI 文件”中的`parseINI`函数。如果该函数依赖什么很清楚（这里没有依赖），我可以直接将所有必要的代码复制到我的新项目中使用。但是，如果我在该代码中发现了一个错误，我可能会在我当时正在处理的任何程序中修复它，而忘记在另一个程序中也修复它。\n\
  \n一旦你开始复制代码，你会很快发现自己浪费时间和精力来移动副本并保持它们同步。\n\n这就是*包*的用武之地。包是可以分发（复制和安装）的代码块。它可以包含一个或多个模块，并包含关于它依赖哪些其他包的信息。包通常还附带文档，解释它的功能，以便没有编写它的人也能使用它。\n\
  \n当包中发现一个问题或添加了一个新功能时，包会被更新。现在依赖于它的程序（也可能是包）可以升级到新版本。\n\n以这种方式工作需要基础设施。我们需要一个地方来存储和查找包，以及一种方便的方式来安装和升级它们。在\
  \ JavaScript 世界中，这个基础设施由 NPM（*[`npmjs.org`](https://npmjs.org)*）提供。\n\nNPM 包含两部分：一个在线服务，可以下载（和上传）包；以及一个程序（与\
  \ Node.js 捆绑在一起），帮助你安装和管理它们。\n\n在撰写本文时，NPM 上有超过五十万个不同的包可用。我应该提到，其中很大一部分是垃圾，但几乎所有有用的、公开可用的包都可以在那里找到。例如，一个类似于我们在第\
  \ 9 章中构建的 INI 文件解析器，以包名`ini`提供。\n\n第 20 章将展示如何使用`npm`命令行程序在本地安装此类包。\n\n拥有可供下载的高质量包非常有价值。这意味着我们通常可以避免重新发明一个已经被\
  \ 100 个人编写过的程序，只需按几个键就能获得一个可靠、经过充分测试的实现。\n\n软件复制成本很低，所以一旦有人编写了它，将其分发给其他人就是一个高效的过程。但首先编写它*是*一项工作，而回应那些在代码中发现问题或想要提出新功能的人，则是更多的工作。\n\
  \n默认情况下，你拥有所编写代码的版权，其他人只有在获得你的许可后才能使用它。但由于有些人只是出于善意，并且发布好的软件可以帮助你在程序员中稍微出名，许多包都是在明确允许其他人使用的许可证下发布的。\n\
  \nNPM 上的大多数代码都是这样授权的。有些许可证要求你也以相同的许可证发布基于该包构建的代码。其他许可证则不那么严格，只要求你在分发代码时保留许可证。JavaScript\
  \ 社区主要使用后一种类型的许可证。在使用他人的包时，请确保你了解他们的许可证。\n\n### 临时模块\n\n直到 2015 年，JavaScript 语言还没有内置的模块系统。然而，人们已经用\
  \ JavaScript 构建大型系统超过十年了，他们*需要*模块。\n\n因此，他们在语言之上设计了自己的模块系统。你可以使用 JavaScript 函数创建局部作用域，并使用对象来表示模块接口。\n\
  \n这是一个用于在日期名称和数字（由`Date`的`getDay`方法返回）之间转换的模块。它的接口由`weekDay.name`和`weekDay.number`组成，并将局部绑定名称隐藏在立即调用的函数表达式的作用域内。\n\
  \n```\nconst weekDay = function() {\n  const names = [\"Sunday\", \"Monday\", \"\
  Tuesday\", \"Wednesday\",\n                 \"Thursday\", \"Friday\", \"Saturday\"\
  ];\n  return {\n    name(number) { return names[number]; },\n    number(name) {\
  \ return names.indexOf(name); }\n  };\n}();\n\nconsole.log(weekDay.name(weekDay.number(\"\
  Sunday\")));\n// → Sunday\n```\n\n这种模块风格在一定程度上提供了隔离，但它没有声明依赖关系。相反，它只是将接口放入全局作用域，并期望其依赖项（如果有的话）也这样做。很长一段时间内，这是\
  \ Web 编程中使用的主要方法，但现在基本上已经过时了。\n\n如果我们想让依赖关系成为代码的一部分，就必须控制依赖项的加载。要做到这一点，需要能够将字符串作为代码执行。JavaScript\
  \ 可以做到这一点。\n\n### 将数据作为代码求值\n\n有几种方法可以将数据（代码字符串）作为当前程序的一部分来运行。\n\n最明显的方式是特殊运算符`eval`，它会在*当前*作用域中执行一个字符串。这通常是一个坏主意，因为它破坏了作用域通常具有的一些属性，例如容易预测给定名称引用哪个绑定。\n\
  \n```\nconst x = 1;\nfunction evalAndReturnX(code) {\n  eval(code);\n  return x;\n\
  }\nconsole.log(evalAndReturnX(\"var x = 2\"));\n// → 2\nconsole.log(x);\n// → 1\n\
  ```\n\n一种不那么可怕的数据解释为代码的方法是使用`Function`构造函数。它接受两个参数：一个包含逗号分隔的参数名称列表的字符串，以及一个包含函数体的字符串。它将代码包装在一个函数值中，这样它就有了自己的作用域，并且不会对其他作用域做出奇怪的事情。\n\
  \n```\nlet plusOne = Function(\"n\", \"return n + 1;\");\nconsole.log(plusOne(4));\n\
  // → 5\n```\n\n这正是我们模块系统所需要的。我们可以将模块的代码包装在一个函数中，并使用该函数的作用域作为模块作用域。\n\n### CommonJS\n\
  \n最广泛使用的附加 JavaScript 模块方法称为*CommonJS 模块*。Node.js 使用它，并且是 NPM 上大多数包使用的系统。\n\nCommonJS\
  \ 模块的主要概念是一个名为`require`的函数。当你使用依赖项的模块名称调用它时，它会确保模块被加载并返回其接口。\n\n\n\n\n\n由于加载器将模块代码包装在一个函数中，模块会自动获得自己的局部作用域。它们只需调用\
  \ `require` 来访问依赖项，并将接口放入绑定到 `exports` 的对象中。\n\n这个示例模块提供了一个日期格式化函数。它使用了两个 NPM 包——`ordinal`\
  \ 用于将数字转换为像 \"1st\" 和 \"2nd\" 这样的字符串，以及 `date-names` 用于获取星期和月份的英文名称。它导出了一个函数 `formatDate`，该函数接受一个\
  \ `Date` 对象和一个模板字符串。\n\n模板字符串可以包含指示格式的代码，例如 YYYY 表示完整年份，Do 表示月份的序数日。你可以给它一个像 \"\
  MMMM Do YYYY\" 这样的字符串，以得到类似 \"November 22nd 2019\" 的输出。\n\n```\nconst ordinal =\
  \ require(\"ordinal\");\n\nconst {days, months} = require(\"date-names\");\n\nexports.formatDate\
  \ = function(date, format) {\n\n  return format.replace(/YYYY|M(MMM)?|Do?|dddd/g,\
  \ tag => {\n\n    if (tag == \"YYYY\") return date.getFullYear();\n\n    if (tag\
  \ == \"M\") return date.getMonth();\n\n    if (tag == \"MMMM\") return months[date.getMonth()];\n\
  \n    if (tag == \"D\") return date.getDate();\n\n    if (tag == \"Do\") return\
  \ ordinal(date.getDate());\n\n    if (tag == \"dddd\") return days[date.getDay()];\n\
  \n  });\n\n};\n```\n\n`ordinal` 的接口是一个单一函数，而 `date-names` 导出了一个包含多个东西的对象——`days`\
  \ 和 `months` 是名称数组。在为导入的接口创建绑定时，解构非常方便。\n\n模块将其接口函数添加到 `exports` 中，以便依赖它的模块能够访问它。我们可以像这样使用该模块：\n\
  \n```\nconst {formatDate} = require(\"./format-date\");\n\nconsole.log(formatDate(new\
  \ Date(2019, 8, 13),\n\n                       \"dddd the Do\"));\n\n// → Friday\
  \ the 13th\n```\n\n我们可以以最简形式定义 `require`，如下所示：\n\n```\nrequire.cache = Object.create(null);\n\
  \nfunction require(name) {\n\n  if (!(name in require.cache)) {\n\n    let code\
  \ = readFile(name);\n\n    let module = {exports: {}};\n\n    require.cache[name]\
  \ = module;\n\n    let wrapper = Function(\"require, exports, module\", code);\n\
  \n    wrapper(require, module.exports, module);\n\n  }\n\n  return require.cache[name].exports;\n\
  \n}\n```\n\n在这段代码中，`readFile` 是一个虚构的函数，用于读取文件并将其内容作为字符串返回。标准 JavaScript 不提供这样的功能——但不同的\
  \ JavaScript 环境，如浏览器和 Node.js，提供了各自访问文件的方式。这个示例只是假设 `readFile` 存在。\n\n为了避免多次加载同一个模块，`require`\
  \ 维护了一个已加载模块的存储（缓存）。当被调用时，它首先检查请求的模块是否已加载，如果没有，则加载它。这包括读取模块的代码，将其包装在一个函数中，并调用它。\n\
  \n我们之前看到的 `ordinal` 包的接口不是一个对象，而是一个函数。CommonJS 模块的一个特点是，尽管模块系统会为你创建一个空的接口对象（绑定到\
  \ `exports`），但你可以通过覆盖 `module.exports` 将其替换为任何值。许多模块这样做是为了导出一个单一值，而不是一个接口对象。\n\n\
  通过将 `require`、`exports` 和 `module` 定义为生成的包装函数的参数（并在调用时传递适当的值），加载器确保这些绑定在模块的作用域中可用。\n\
  \n`require` 中给定的字符串如何转换为实际文件名或网址，在不同系统中有所不同。当它以 `\"./\"` 或 `\"../\"` 开头时，通常被解释为相对于当前模块的文件名。因此\
  \ `\"./format-date\"` 就是同一目录下名为 `format-date.js` 的文件。\n\n当名称不是相对路径时，Node.js 会按该名称查找已安装的包。在本章的示例代码中，我们将此类名称解释为指向\
  \ NPM 包。我们将在第 20 章中更详细地介绍如何安装和使用 NPM 模块。\n\n现在，我们可以使用 NPM 上的一个包，而不是自己编写 INI 文件解析器。\n\
  \n```\nconst {parse} = require(\"ini\");\n\nconsole.log(parse(\"x = 10\\ny = 20\"\
  ));\n\n// → {x: \"10\", y: \"20\"}\n```\n\n### ECMAScript 模块\n\nCommonJS 模块运行得相当好，并且与\
  \ NPM 结合，使得 JavaScript 社区能够大规模地共享代码。\n\n但它们仍然有点像胶带式的临时方案。符号略显笨拙——例如，你添加到 `exports`\
  \ 中的东西在局部作用域中不可用。而且，由于 `require` 是一个普通的函数调用，可以接受任何类型的参数，而不仅仅是字符串字面量，因此在不运行代码的情况下很难确定模块的依赖关系。\n\
  \n这就是为什么 2015 年的 JavaScript 标准引入了自己不同的模块系统。它通常被称为 *ES 模块*，其中 *ES* 代表 ECMAScript。依赖关系和接口的主要概念保持不变，但细节有所不同。首先，符号现在已集成到语言中。你不再需要调用函数来访问依赖项，而是使用特殊的\
  \ `import` 关键字。\n\n```\nimport ordinal from \"ordinal\";\n\nimport {days, months}\
  \ from \"date-names\";\n\nexport function formatDate(date, format) { /* ... */ }\n\
  ```\n\n类似地，`export` 关键字用于导出东西。它可以出现在函数、类或绑定定义（`let`、`const` 或 `var`）之前。\n\nES 模块的接口不是单一值，而是一组命名的绑定。前面的模块将\
  \ `formatDate` 绑定到一个函数。当你从另一个模块 `import` 时，你导入的是 *绑定*，而不是值，这意味着导出模块可以随时更改绑定的值，而导入它的模块将看到其新值。\n\
  \n当存在名为 `default` 的绑定时，它被视为模块的主要导出值。如果你像示例中的 `ordinal` 那样导入一个模块，且绑定名称周围没有花括号，你将获得它的\
  \ `default` 绑定。这样的模块仍然可以在其 `default` 导出之外，以不同的名称导出其他绑定。\n\n要创建默认导出，你可以在表达式、函数声明或类声明之前编写\
  \ `export default`。\n\n```\nexport default [\"Winter\", \"Spring\", \"Summer\",\
  \ \"Autumn\"];\n```\n\n可以使用 `as` 关键字重命名导入的绑定。\n\n```\nimport {days as dayNames}\
  \ from \"date-names\";\n\nconsole.log(dayNames.length);\n\n// → 7\n```\n\n另一个重要的区别是，ES\
  \ 模块的导入发生在模块脚本开始运行之前。这意味着 `import` 声明不能出现在函数或块内部，并且依赖项的名称必须是带引号的字符串，而不能是任意表达式。\n\
  \n在撰写本文时，JavaScript 社区正在逐步采用这种模块风格。但这是一个缓慢的过程。在格式规范制定之后，浏览器和 Node.js 花了几年时间才开始支持它。尽管现在它们大多支持，但这种支持仍然存在问题，关于如何通过\
  \ NPM 分发此类模块的讨论仍在进行中。\n\n许多项目使用 ES 模块编写，然后在发布时自动转换为其他格式。我们正处于一个过渡时期，两种不同的模块系统同时使用，能够阅读和编写其中任何一种代码都是有用的。\n\
  \n### 构建与打包\n\n事实上，许多 JavaScript 项目从技术上讲甚至不是用 JavaScript 编写的。有一些扩展，例如第 131 页“类型”中提到的类型检查方言，被广泛使用。人们也经常在计划中的语言扩展被添加到实际运行\
  \ JavaScript 的平台之前就开始使用它们。\n\n为了实现这一点，他们*编译*代码，将其从选定的 JavaScript 方言转换为普通的旧 JavaScript——甚至转换为过去版本的\
  \ JavaScript——以便旧浏览器能够运行它。\n\n\n\n\n在网页中包含一个由 200 个不同文件组成的模块化程序会带来自身的问题。如果通过网络获取单个文件需要\
  \ 50 毫秒，那么加载整个程序就需要 10 秒，或者如果你能同时加载多个文件，可能只需要一半的时间。这浪费了大量时间。由于获取单个大文件往往比获取许多小文件更快，Web\
  \ 程序员开始使用工具，在将程序发布到 Web 之前，将原本费心拆分成模块的程序重新合并成单个大文件。这类工具被称为*打包工具*。\n\n我们还可以更进一步。除了文件数量，文件的*大小*也决定了它们通过网络传输的速度。因此，JavaScript\
  \ 社区发明了*压缩工具*。这些工具能够处理 JavaScript 程序，通过自动删除注释和空白、重命名绑定以及用占用空间更小的等效代码替换代码片段来使其变得更小。\n\
  \n因此，你在 NPM 包中或网页上运行的代码，很可能经历了*多个*阶段的转换——从现代 JavaScript 转换为历史 JavaScript，从 ES 模块格式转换为\
  \ CommonJS，再经过打包和压缩。本书不会深入探讨这些工具的细节，因为它们往往枯燥且变化迅速。只需知道，你运行的 JavaScript 代码通常不是最初编写的代码。\n\
  \n### 模块设计\n\n程序的结构化是编程中较为微妙的方面之一。任何非平凡的功能都可以用多种方式建模。\n\n良好的程序设计是主观的——其中涉及权衡和品味问题。学习良好结构化设计价值的最佳方式是阅读或处理大量程序，并注意哪些有效、哪些无效。不要认为一团糟就是“本该如此”。通过投入更多思考，你几乎可以改进任何事物的结构。\n\
  \n模块设计的一个方面是易用性。如果你设计的东西打算供多人使用——甚至是你自己在三个月后，当你不再记得所做事情的具体细节时——那么你的接口简单且可预测会很有帮助。\n\
  \n这可能意味着遵循现有惯例。一个很好的例子是`ini`包。该模块通过提供`parse`和`stringify`（用于编写 INI 文件）函数来模仿标准的`JSON`对象，并且像`JSON`一样，在字符串和普通对象之间进行转换。因此，接口小巧且熟悉，一旦你使用过它，很可能就会记住如何使用。\n\
  \n即使没有标准函数或广泛使用的包可以模仿，你也可以通过使用简单的数据结构并执行单一、专注的任务来保持模块的可预测性。例如，NPM 上的许多 INI 文件解析模块都提供了一个函数，可以直接从硬盘读取此类文件并解析它。这使得此类模块无法在浏览器中使用（因为浏览器没有直接的文件系统访问权限），并且增加了复杂性，而本可以通过将模块与某个文件读取函数*组合*来更好地解决。\n\
  \n这指向了模块设计的另一个有益方面——与其他代码组合的容易程度。专注于计算值的模块比执行带有副作用的复杂操作的大型模块适用于更广泛的程序。一个坚持从磁盘读取文件的\
  \ INI 文件读取器，在文件内容来自其他来源的场景中毫无用处。\n\n与此相关，有状态的对象有时是有用的，甚至是必要的，但如果某件事可以用函数完成，那就使用函数。NPM\
  \ 上的几个 INI 文件读取器提供了一种接口风格，要求你先创建一个对象，然后将文件加载到对象中，最后使用专门的方法来获取结果。这类事情在面向对象传统中很常见，而且很糟糕。你不需要进行一次函数调用然后继续，而是必须执行将对象在各种状态间移动的仪式。而且，由于数据现在被包装在专门的对象类型中，所有与之交互的代码都必须了解该类型，从而造成不必要的相互依赖。\n\
  \n通常，定义新的数据结构是不可避免的——语言标准只提供了少数基本数据结构，而许多类型的数据比数组或映射更复杂。但当数组足够时，就使用数组。\n\n一个稍微复杂的数据结构的例子是第\
  \ 7 章中的图。在 JavaScript 中，没有单一明显的方法来表示图。在那章中，我们使用了一个对象，其属性保存着字符串数组——从该节点可达的其他节点。\n\
  \nNPM 上有几个不同的寻路包，但没有一个使用这种图格式。它们通常允许图的边具有权重，即与之相关的成本或距离。这在我们的表示中是不可能的。\n\n例如，有`dijkstrajs`包。一种著名的寻路方法，与我们的`findRoute`函数非常相似，被称为*迪杰斯特拉算法*，以首次写下该算法的\
  \ Edsger Dijkstra 命名。`js`后缀通常添加到包名中，以表明它们是用 JavaScript 编写的。这个`dijkstrajs`包使用的图格式与我们的类似，但它不使用数组，而是使用属性值为数字（边的权重）的对象。\n\
  \n因此，如果我们想使用那个包，就必须确保我们的图以它期望的格式存储。所有边都获得相同的权重，因为我们的简化模型将每条道路视为具有相同的成本（一次转弯）。\n\n\
  ```\nconst {find_path} = require(\"dijkstrajs\");\n\nlet graph = {};\n\nfor (let\
  \ node of Object.keys(roadGraph)) {\n  let edges = graph[node] = {};\n  for (let\
  \ dest of roadGraph[node]) {\n    edges[dest] = 1;\n  }\n}\n\nconsole.log(find_path(graph,\
  \ \"Post Office\", \"Cabin\"));\n// → [\"Post Office\", \"Alice's House\", \"Cabin\"\
  ]\n```\n\n这可能会成为组合的障碍——当不同的包使用不同的数据结构来描述类似的事物时，将它们组合起来很困难。因此，如果你想设计可组合性，请找出其他人使用的数据结构，并在可能的情况下遵循他们的示例。\n\
  \n### 总结\n\n模块通过将代码分割成具有清晰接口和依赖关系的部分，为大型程序提供了结构。接口是模块中其他模块可见的部分，而依赖关系是它使用的其他模块。\n\
  \n由于 JavaScript 历史上没有提供模块系统，CommonJS 系统是在其之上构建的。后来，它*确实*有了一个内置系统，现在与 CommonJS 系统不太和谐地共存。\n\
  \n包是可以独立分发的代码块。NPM 是一个 JavaScript 包仓库。你可以从中下载各种有用（和无用）的包。\n\n### 练习\n\n#### *模块化机器人*\n\
  \n以下是第 7 章项目创建的绑定：\n\n`roads`\n\n`buildGraph`\n\n`roadGraph`\n\n`VillageState`\n\
  \n`runRobot`\n\n`randomPick`\n\n`randomRobot`\n\n`mailRoute`\n\n`routeRobot`\n\n\
  `findRoute`\n\n`goalOrientedRobot`\n\n如果你要将该项目编写为模块化程序，你会创建哪些模块？哪个模块依赖于哪个其他模块，它们的接口会是什么样子？\n\
  \n哪些部分可能已经在 NPM 上预先编写好了？你更愿意使用 NPM 包还是自己编写？\n\n#### *道路模块*\n\n\n\n\n编写一个 CommonJS\
  \ 模块，基于第 7 章的示例，该模块包含道路数组，并导出表示这些道路的图数据结构为 `roadGraph`。它应依赖于一个 `./graph` 模块，该模块导出一个用于构建图的函数\
  \ `buildGraph`。该函数期望接收一个由二元数组（道路的起点和终点）组成的数组。\n\n#### *循环依赖*\n\n循环依赖是指模块 A 依赖于 B，而\
  \ B 也直接或间接地依赖于 A 的情况。许多模块系统直接禁止这种情况，因为无论你选择何种顺序加载这些模块，都无法确保每个模块的依赖项在其运行之前已被加载。\n\
  \nCommonJS 模块允许有限形式的循环依赖。只要模块不替换其默认导出对象，并且在完成加载之前不访问彼此的接口，循环依赖就是可以接受的。\n\n第 171\
  \ 页“CommonJS”中给出的 `require` 函数支持这种类型的依赖循环。你能看出它是如何处理循环的吗？当循环中的某个模块*确实*替换了其默认导出对象时，会出现什么问题？\n\
  \n“谁能安于混沌，静待其澄清？谁能安于静止，直到行动的时刻？”\n\n——老子，《道德经》\n\n![Image](img/f0180-01.jpg)\n\n\
  ## 11 异步编程\n\n计算机的核心部分，即执行构成我们程序的各个步骤的部分，被称为*处理器*。到目前为止，我们看到的程序都是让处理器一直忙碌直到完成工作。像操作数字的循环这类任务的执行速度，几乎完全取决于处理器的速度。\n\
  \n但许多程序会与处理器之外的事物交互。例如，它们可能通过计算机网络通信，或从硬盘请求数据——这比从内存中获取数据要慢得多。\n\n当这种情况发生时，让处理器闲置是很可惜的——它可能在此期间做一些其他工作。这部分由操作系统处理，它会在多个运行的程序之间切换处理器。但这对于我们希望*单个*程序在等待网络请求时仍能继续推进的情况并无帮助。\n\
  \n### 异步性\n\n在*同步*编程模型中，事情一次只发生一件。当你调用一个执行长时间操作的函数时，它只有在操作完成并返回结果后才会返回。这会在操作期间暂停你的程序。\n\
  \n*异步*模型允许多件事情同时发生。当你启动一个操作时，你的程序继续运行。当操作完成时，程序会收到通知并获取结果（例如，从磁盘读取的数据）。\n\n我们可以通过一个小例子来比较同步和异步编程：一个从网络获取两个资源然后合并结果的程序。\n\
  \n在同步环境中，请求函数只有在完成工作后才会返回，执行此任务最简单的方式是依次发出请求。这样做的缺点是第二个请求只有在第一个完成后才会开始。总耗时至少是两个响应时间之和。\n\
  \n在同步系统中，解决这个问题的方法是启动额外的控制线程。*线程*是另一个运行中的程序，其执行可能由操作系统与其他程序交错进行——由于大多数现代计算机包含多个处理器，多个线程甚至可以在不同处理器上同时运行。第二个线程可以启动第二个请求，然后两个线程都等待结果返回，之后它们重新同步以合并结果。\n\
  \n![Image](img/f0182-01.jpg)\n\n另一种描述差异的方式是：在同步模型中，等待操作完成是*隐式*的，而在异步模型中，它是*显式*的，受我们控制。\n\
  \n异步性是一把双刃剑。它使得表达不符合直线控制模型的程序更容易，但也可能使表达遵循直线模型的程序更别扭。我们将在本章后面看到一些解决这种别扭的方法。\n\n\
  两个重要的 JavaScript 编程平台——浏览器和 Node.js——都将可能耗时的操作设为异步，而不是依赖线程。由于使用线程编程是出了名的困难（当程序同时做多件事时，理解其行为要困难得多），这通常被认为是一件好事。\n\
  \n### 乌鸦科技\n\n大多数人都知道乌鸦是非常聪明的鸟类。它们会使用工具、提前计划、记住事情，甚至在这些事情之间相互交流。\n\n大多数人不知道的是，它们还有许多能力，这些能力被它们很好地隐藏起来，不让我们知道。一位声誉良好（虽然有点古怪）的鸦科专家告诉我，乌鸦的技术并不落后于人类技术，而且它们正在迎头赶上。\n\
  \n例如，许多乌鸦文化有能力构建计算设备。这些设备不像人类计算设备那样是电子的，而是通过微小昆虫的活动来运作，这种昆虫与白蚁关系密切，并与乌鸦形成了共生关系。鸟类为它们提供食物，作为回报，昆虫建造并运营其复杂的群落，借助其中的生物体进行计算。\n\
  \n这样的群落通常位于大型、持久的巢穴中。鸟类和昆虫共同合作，在巢穴的树枝之间建造一个由球状黏土结构组成的网络，昆虫在其中生活和劳作。\n\n为了与其他设备通信，这些机器使用光信号。乌鸦将反光材料嵌入特殊的通信茎中，昆虫则将这些材料对准另一个巢穴反射光线，将数据编码为一系列快速闪烁。这意味着只有具有无障碍视觉连接的巢穴才能通信。\n\
  \n我们的鸦科专家朋友绘制了位于罗讷河畔的伊耶尔-叙尔-昂比村乌鸦巢穴的网络地图。下图显示了巢穴及其连接。\n\n![Image](img/f0184-01.jpg)\n\
  \n在趋同进化的一个惊人例子中，乌鸦计算机运行 JavaScript。在本章中，我们将为它们编写一些基本的网络功能。\n\n### 回调\n\n异步编程的一种方法是让执行慢速操作的函数接受一个额外的参数，即*回调函数*。操作启动，当它完成时，回调函数被调用并传入结果。\n\
  \n例如，`setTimeout` 函数（在 Node.js 和浏览器中均可使用）等待给定的毫秒数（一秒等于一千毫秒），然后调用一个函数。\n\n```\nsetTimeout(()\
  \ => console.log(\"Tick\"), 500);\n```\n\n等待通常不是一种非常重要的工作类型，但在做诸如更新动画或检查某件事是否耗时超过给定时间之类的事情时，它可能很有用。\n\
  \n使用回调连续执行多个异步操作意味着你必须不断传递新函数来处理操作之后计算的继续。\n\n\n\n\n大多数乌鸦巢穴计算机都有一个长期数据存储灯泡，信息片段被刻录在树枝上，以便日后检索。刻录或查找一条数据需要一点时间，因此长期存储的接口是异步的，并使用回调函数。\n\
  \n存储灯泡以名称存储 JSON 可编码的数据片段。乌鸦可能会将藏食物地点的信息存储在名为 `\"food caches\"` 的名称下，该名称可以包含一个指向其他数据片段的名称数组，用于描述实际的藏匿点。要在大橡树巢穴的存储灯泡中查找一个食物缓存，乌鸦可以运行如下代码：\n\
  \n```\nimport {bigOak} from \"./crow-tech\";\n\nbigOak.readStorage(\"food caches\"\
  , caches => {\n  let firstCache = caches[0];\n  bigOak.readStorage(firstCache, info\
  \ => {\n    console.log(info);\n  });\n});\n```\n\n（所有绑定名称和字符串已从乌鸦语言翻译成英语。）\n\n\
  这种编程风格是可行的，但每次异步操作都会增加缩进层级，因为你最终会进入另一个函数。执行更复杂的操作，比如同时运行多个动作，可能会变得有些笨拙。\n\n乌鸦巢穴计算机被设计为使用请求-响应对进行通信。这意味着一个巢穴向另一个巢穴发送消息，后者立即回复一条消息，确认收到，并可能包含对消息中问题的答复。\n\
  \n每条消息都带有一个*类型*标签，该标签决定了如何处理它。我们的代码可以为特定的请求类型定义处理程序，当这样的请求到来时，处理程序被调用来生成响应。\n\n\
  `\"./crow-tech\"` 模块导出的接口提供了基于回调的通信函数。巢穴有一个 `send` 方法用于发送请求。它期望目标巢穴的名称、请求类型和请求内容作为前三个参数，并期望一个在收到响应时调用的函数作为第四个也是最后一个参数。\n\
  \n```\nbigOak.send(\"Cow Pasture\", \"note\", \"Let's caw loudly at 7PM\",\n   \
  \         () => console.log(\"Note delivered.\"));\n```\n\n但为了让巢穴能够接收该请求，我们首先必须定义一个名为\
  \ `\"note\"` 的请求类型。处理请求的代码不仅需要在这个巢穴计算机上运行，还需要在所有能接收此类消息的巢穴上运行。我们假设一只乌鸦飞过，并将我们的处理程序代码安装到所有巢穴上。\n\
  \n```\nimport {defineRequestType} from \"./crow-tech\";\n\ndefineRequestType(\"\
  note\", (nest, content, source, done) => {\n  console.log(`${nest.name} received\
  \ note: ${content}`);\n  done();\n});\n```\n\n`defineRequestType` 函数定义了一种新的请求类型。该示例增加了对\
  \ `\"note\"` 请求的支持，该请求只是向指定巢穴发送一条便条。我们的实现调用了 `console.log`，以便验证请求已到达。巢穴有一个 `name`\
  \ 属性，用于保存其名称。\n\n处理程序的第四个参数 `done` 是一个回调函数，处理程序在完成请求时必须调用它。如果我们使用处理程序的返回值作为响应值，那就意味着请求处理程序本身无法执行异步操作。执行异步工作的函数通常在工作完成之前就返回，并安排一个回调在完成时被调用。因此，我们需要某种异步机制——在本例中是另一个回调函数——来指示响应何时可用。\n\
  \n从某种意义上说，异步性是*具有传染性的*。任何调用异步工作函数的函数本身也必须是异步的，使用回调或类似机制来传递其结果。调用回调比简单地返回一个值更复杂且更容易出错，因此需要以这种方式组织程序的大部分内容并不理想。\n\
  \n### 期约\n\n当抽象概念可以用值来表示时，处理它们通常更容易。对于异步操作，你可以返回一个代表未来事件的对象，而不是安排一个函数在未来的某个时刻被调用。\n\
  \n这正是标准类 `Promise` 的用途。一个*期约*是一个异步操作，它可能在某个时刻完成并产生一个值。它能够在其值可用时通知任何感兴趣的人。\n\n创建期约的最简单方法是调用\
  \ `Promise.resolve`。该函数确保你提供的值被包装在一个期约中。如果它已经是一个期约，则直接返回；否则，你会得到一个立即以你的值作为结果完成的新期约。\n\
  \n```\nlet fifteen = Promise.resolve(15);\nfifteen.then(value => console.log(`Got\
  \ ${value}`));\n// → Got 15\n```\n\n要获取期约的结果，你可以使用它的 `then` 方法。这会注册一个回调函数，当期约解析并产生一个值时被调用。你可以向同一个期约添加多个回调，即使你在期约已经*解析*（完成）之后添加它们，它们也会被调用。\n\
  \n但这并不是 `then` 方法的全部功能。它返回另一个期约，该期约解析为处理函数返回的值，或者如果处理函数返回一个期约，则等待该期约，然后解析为其结果。\n\
  \n将期约视为将值移入异步现实的一种设备是很有用的。普通值就在那里。期约值是一个*可能*已经存在，也可能在未来的某个时刻出现的值。以期约定义的计算作用于这些包装后的值，并在值可用时异步执行。\n\
  \n要创建一个期约，你可以将 `Promise` 用作构造函数。它有一个有点奇怪的接口——构造函数期望一个函数作为参数，并立即调用它，同时传递一个可用于解析期约的函数。它之所以这样工作，而不是例如通过一个\
  \ `resolve` 方法，是为了只有创建期约的代码才能解析它。\n\n以下是为 `readStorage` 函数创建基于期约的接口的方法：\n\n```\n\
  function storage(nest, name) {\n  return new Promise(resolve => {\n    nest.readStorage(name,\
  \ result => resolve(result));\n  });\n}\n\nstorage(bigOak, \"enemies\")\n.then(value\
  \ => console.log(\"Got\", value));\n```\n\n这个异步函数返回一个有意义的值。这是期约的主要优势——它们简化了异步函数的使用。不必传递回调，基于期约的函数看起来与常规函数类似：它们接受输入作为参数，并返回输出。唯一的区别是输出可能还不可用。\n\
  \n### 失败\n\n常规的 JavaScript 计算可以通过抛出异常来失败。异步计算通常也需要类似的东西。网络请求可能失败，或者异步计算中的某些代码可能抛出异常。\n\
  \n回调式异步编程最紧迫的问题之一是，它使得确保失败被正确报告给回调变得极其困难。\n\n一个广泛使用的约定是，回调的第一个参数用于指示操作失败，第二个参数包含操作成功时产生的值。这样的回调函数必须始终检查是否收到了异常，并确保它们引起的任何问题，包括它们调用的函数抛出的异常，都被捕获并传递给正确的函数。\n\
  \n\n\n\nPromise 让这一切变得更简单。它们可以被解决（即操作成功完成）或被拒绝（即操作失败）。解决处理程序（通过 `then` 注册）仅在操作成功时被调用，而拒绝会自动传播到\
  \ `then` 返回的新 Promise 中。当处理程序抛出异常时，这也会自动导致其 `then` 调用产生的 Promise 被拒绝。因此，如果异步操作链中的任何一个元素失败，整个链的结果就会被标记为拒绝，并且失败点之后的所有成功处理程序都不会被调用。\n\
  \n与 Promise 被解决时会提供一个值类似，被拒绝时也会提供一个值，通常称为拒绝的 `reason`。当处理函数中的异常导致拒绝时，异常值就作为拒绝原因。同样，当处理程序返回一个被拒绝的\
  \ Promise 时，该拒绝会流入下一个 Promise。有一个 `Promise.reject` 函数可以创建一个新的、立即被拒绝的 Promise。\n\n\
  为了显式处理这类拒绝，Promise 有一个 `catch` 方法，用于注册一个在 Promise 被拒绝时调用的处理程序，类似于 `then` 处理程序处理正常解决的方式。它也与\
  \ `then` 非常相似，会返回一个新的 Promise：如果原 Promise 正常解决，则新 Promise 解决为原 Promise 的值；否则解决为\
  \ `catch` 处理程序的结果。如果 `catch` 处理程序抛出错误，新 Promise 也会被拒绝。\n\n作为简写，`then` 也接受一个拒绝处理程序作为第二个参数，因此你可以在一次方法调用中同时安装两种类型的处理程序。\n\
  \n传递给 `Promise` 构造函数的函数除了 `resolve` 函数外，还会收到第二个参数，它可以用这个参数来拒绝新的 Promise。\n\n通过调用\
  \ `then` 和 `catch` 创建的 Promise 值链可以看作一个管道，异步值或失败在其中流动。由于这种链是通过注册处理程序创建的，每个环节都有一个成功处理程序或拒绝处理程序（或两者都有）。与结果类型（成功或失败）不匹配的处理程序会被忽略。但匹配的处理程序会被调用，它们的结果决定了下一个值的类型——如果返回非\
  \ Promise 值则为成功，如果抛出异常则为拒绝，如果返回一个 Promise 则为其结果。\n\n```\nnew Promise((_, reject)\
  \ => reject(new Error(\"Fail\")))\n  .then(value => console.log(\"Handler 1\"))\n\
  \  .catch(reason => {\n    console.log(\"Caught failure \" + reason);\n    return\
  \ \"nothing\";\n  })\n  .then(value => console.log(\"Handler 2\", value));\n// →\
  \ Caught failure Error: Fail\n// → Handler 2 nothing\n```\n\n就像未捕获的异常由环境处理一样，JavaScript\
  \ 环境可以检测到 Promise 拒绝未被处理的情况，并将其报告为错误。\n\n### 网络是困难的\n\n有时，乌鸦的镜面系统没有足够的光线来传输信号，或者有东西阻挡了信号的路径。信号可能被发送出去但从未被接收。\n\
  \n目前，这只会导致传递给 `send` 的回调永远不会被调用，这可能会使程序停止运行，甚至没有注意到问题的存在。如果在一段时间内没有收到响应，请求能够 `time\
  \ out` 并报告失败，那就好了。\n\n通常，传输失败是随机事故，比如汽车前灯干扰了光信号，简单地重试请求可能就会成功。因此，趁此机会，让我们让请求函数在放弃之前自动重试几次发送请求。\n\
  \n而且，既然我们已经确定 Promise 是好事，我们也会让请求函数返回一个 Promise。就表达能力而言，回调和 Promise 是等价的。基于回调的函数可以包装成暴露基于\
  \ Promise 的接口，反之亦然。\n\n即使请求及其响应成功送达，响应也可能指示失败——例如，如果请求尝试使用未定义的请求类型，或者处理程序抛出错误。为了支持这一点，`send`\
  \ 和 `defineRequestType` 遵循之前提到的约定：传递给回调的第一个参数是失败原因（如果有），第二个参数是实际结果。\n\n这些可以通过我们的包装器转换为\
  \ Promise 的解决和拒绝。\n\n```\nclass Timeout extends Error {}\n\nfunction request(nest,\
  \ target, type, content) {\n  return new Promise((resolve, reject) => {\n    let\
  \ done = false;\n    function attempt(n) {\n      nest.send(target, type, content,\
  \ (failed, value) => {\n        done = true;\n        if (failed) reject(failed);\n\
  \        else resolve(value);\n      });\n      setTimeout(() => {\n        if (done)\
  \ return;\n        else if (n < 3) attempt(n + 1);\n        else reject(new Timeout(\"\
  Timed out\"));\n      }, 250);\n    }\n    attempt(1);\n  });\n}\n```\n\n由于 Promise\
  \ 只能被解决（或拒绝）一次，所以这样是可行的。第一次调用 `resolve` 或 `reject` 决定了 Promise 的结果，任何后续调用（例如请求完成后超时到达，或另一个请求完成后返回的请求）都会被忽略。\n\
  \n为了构建异步循环（用于重试），我们需要使用递归函数——常规循环不允许我们停下来等待异步操作。`attempt` 函数尝试发送一次请求。它还设置了一个超时：如果在\
  \ 250 毫秒后没有收到响应，则开始下一次尝试；如果这是第三次尝试，则用 `Timeout` 实例作为原因拒绝 Promise。\n\n每四分之一秒重试一次，并在四分之三秒后没有收到响应时放弃，这显然有些随意。甚至有可能请求确实通过了，但处理程序只是需要更长时间，导致请求被多次送达。我们会考虑到这个问题来编写处理程序——重复的消息应该是无害的。\n\
  \n总的来说，我们今天不会构建一个世界级的、健壮的网络。但这没关系——乌鸦在计算方面还没有很高的期望。\n\n为了完全隔离回调，我们还将为 `defineRequestType`\
  \ 定义一个包装器，允许处理函数返回一个 Promise 或普通值，并将其连接到回调中。\n\n```\nfunction requestType(name,\
  \ handler) {\n  defineRequestType(name, (nest, content, source,\n              \
  \             callback) => {\n    try {\n      Promise.resolve(handler(nest, content,\
  \ source))\n        .then(response => callback(null, response),\n              failure\
  \ => callback(failure));\n    } catch (exception) {\n      callback(exception);\n\
  \    }\n  });\n}\n```\n\n`Promise.resolve` 用于将 `handler` 返回的值转换为 Promise（如果它还不是\
  \ Promise 的话）。\n\n注意，对 `handler` 的调用必须包装在 `try` 块中，以确保它直接抛出的任何异常都能传递给回调。这很好地说明了使用原始回调正确处理错误的困难——很容易忘记像这样正确地路由异常，如果不这样做，失败就不会报告给正确的回调。Promise\
  \ 使这基本上是自动的，因此更不容易出错。\n\n### Promise 集合\n\n每个巢穴计算机在其 `neighbors` 属性中维护一个传输距离内其他巢穴的数组。为了检查哪些巢穴当前可达，你可以编写一个函数，尝试向每个巢穴发送一个\
  \ `\"ping\"` 请求（一个只要求响应的请求），并查看哪些返回了响应。\n\n\n\n\n\n当同时处理多个 Promise 集合时，`Promise.all`\
  \ 函数会很有用。它返回一个 Promise，该 Promise 会等待数组中的所有 Promise 完成，然后解析为一个包含这些 Promise 产生的值的数组（顺序与原始数组相同）。如果任何一个\
  \ Promise 被拒绝，`Promise.all` 的结果也会被拒绝。\n\n```\nrequestType(\"ping\", () => \"pong\"\
  );\n\nfunction availableNeighbors(nest) {\n\n  let requests = nest.neighbors.map(neighbor\
  \ => {\n\n    return request(nest, neighbor, \"ping\")\n\n      .then(() => true,\
  \ () => false);\n\n  });\n\n  return Promise.all(requests).then(result => {\n\n\
      return nest.neighbors.filter((_, i) => result[i]);\n\n  });\n\n}\n```\n\n当某个邻居不可用时，我们不希望整个组合\
  \ Promise 失败，因为那样我们就无法得知任何信息。因此，映射到邻居集合以将其转换为请求 Promise 的函数会附加处理程序，使成功的请求产生 `true`，被拒绝的请求产生\
  \ `false`。\n\n在组合 Promise 的处理程序中，使用 `filter` 从邻居数组中移除对应值为 `false` 的元素。这利用了 `filter`\
  \ 将当前元素的数组索引作为第二个参数传递给其过滤函数的事实（`map`、`some` 以及类似的高阶数组方法也是如此）。\n\n### 网络泛洪\n\n巢穴只能与它们的邻居通信，这一事实极大地限制了该网络的实用性。\n\
  \n为了向整个网络广播信息，一种解决方案是设置一种自动转发给邻居的请求类型。这些邻居随后又会将其转发给它们的邻居，直到整个网络都收到该消息。\n\n```\n\
  import {everywhere} from \"./crow-tech\";\n\neverywhere(nest => {\n\n  nest.state.gossip\
  \ = [];\n\n});\n\nfunction sendGossip(nest, message, exceptFor = null) {\n\n  nest.state.gossip.push(message);\n\
  \n  for (let neighbor of nest.neighbors) {\n\n    if (neighbor == exceptFor) continue;\n\
  \n    request(nest, neighbor, \"gossip\", message);\n\n  }\n\n}\n\nrequestType(\"\
  gossip\", (nest, message, source) => {\n\n  if (nest.state.gossip.includes(message))\
  \ return;\n\n  console.log(`${nest.name} received gossip '${\n\n               message}'\
  \ from ${source}`);\n\n  sendGossip(nest, message, source);\n\n});\n```\n\n为了避免消息在网络中无限传播，每个巢穴都维护一个已见过的八卦字符串数组。为了定义这个数组，我们使用\
  \ `everywhere` 函数——它在每个巢穴上运行代码——来向巢穴的状态对象添加一个属性，我们将在其中保存巢穴的本地状态。\n\n当某个巢穴收到重复的八卦消息时（由于每个人都在盲目地转发，这种情况很可能发生），它会忽略它。但当它收到新消息时，它会兴奋地告诉所有邻居，除了发送该消息的那个邻居。\n\
  \n这会导致一条新的八卦消息像水中的墨渍一样在网络中扩散。即使某些连接当前不可用，只要存在通往某个巢穴的替代路径，八卦消息就会通过该路径到达。\n\n这种网络通信风格被称为\
  \ `泛洪`——它用一条信息淹没网络，直到所有节点都拥有它。\n\n### 消息路由\n\n如果某个节点想要与另一个节点通信，`泛洪` 并不是一种非常高效的方法。尤其是当网络规模很大时，这会导致大量无用的数据传输。\n\
  \n另一种方法是建立一种方式，让消息在节点之间跳跃，直到到达目的地。其难点在于需要了解网络的布局。为了向远处的巢穴发送请求，必须知道哪个邻居巢穴能使其更接近目的地。将消息发送到错误的方向不会有太大帮助。\n\
  \n由于每个巢穴只知道其直接邻居，它没有计算路由所需的信息。我们必须以某种方式将这些连接信息传播到所有巢穴，最好是以一种允许其随时间变化的方式，当巢穴被废弃或新建巢穴时。\n\
  \n我们可以再次使用 `泛洪`，但这次不是检查是否已经收到某条消息，而是检查某个巢穴的新邻居集合是否与我们当前拥有的集合匹配。\n\n```\nrequestType(\"\
  connections\", (nest, {name, neighbors},\n\n                            source)\
  \ => {\n\n  let connections = nest.state.connections;\n\n  if (JSON.stringify(connections.get(name))\
  \ ==\n\n     JSON.stringify(neighbors)) return;\n\n  connections.set(name, neighbors);\n\
  \n  broadcastConnections(nest, name, source);\n\n});\n\nfunction broadcastConnections(nest,\
  \ name, exceptFor = null) {\n\n  for (let neighbor of nest.neighbors) {\n\n    if\
  \ (neighbor == exceptFor) continue;\n\n    request(nest, neighbor, \"connections\"\
  , {\n\n      name,\n\n      neighbors: nest.state.connections.get(name)\n\n    });\n\
  \n  }\n\n}\n\neverywhere(nest => {\n\n   nest.state.connections = new Map();\n\n\
     nest.state.connections.set(nest.name, nest.neighbors);\n\n   broadcastConnections(nest,\
  \ nest.name);\n\n});\n```\n\n比较使用了 `JSON.stringify`，因为 `==` 在对象或数组上只有在两者是完全相同的值时才会返回\
  \ `true`，而这并不是我们需要的。比较 JSON 字符串是一种粗糙但有效的内容比较方式。\n\n节点立即开始广播它们的连接，除非某些巢穴完全不可达，否则这应该会很快为每个巢穴提供当前网络图的地图。\n\
  \n你可以用图来做的一件事是查找路由，正如我们在第 7 章中看到的那样。如果我们有一条通往消息目的地的路由，我们就知道该往哪个方向发送。\n\n这个 `findRoute`\
  \ 函数与第 7 章中的 `findRoute` 函数非常相似，它搜索到达网络中给定节点的方法。但它不是返回整个路由，而是只返回下一步。下一个巢穴将根据其当前的网络信息决定\
  \ *它* 将消息发送到哪里。\n\n```\nfunction findRoute(from, to, connections) {\n\n  let work\
  \ = [{at: from, via: null}];\n\n  for (let i = 0; i < work.length; i++) {\n\n    let\
  \ {at, via} = work[i];\n\n    for (let next of connections.get(at) || []) {\n\n\
        if (next == to) return via;\n\n      if (!work.some(w => w.at == next)) {\n\
  \n        work.push({at: next, via: via || next});\n\n      }\n\n    }\n\n  }\n\n\
    return null;\n\n}\n```\n\n现在我们可以构建一个能够发送长距离消息的函数。如果消息是发给直接邻居的，则按常规方式传递。如果不是，则将其打包成一个对象，并使用\
  \ `route` 请求类型发送给一个更接近目标的邻居，这将导致该邻居重复相同的行为。\n\n```\nfunction routeRequest(nest,\
  \ target, type, content) {\n\n  if (nest.neighbors.includes(target)) {\n\n    return\
  \ request(nest, target, type, content);\n\n  } else {\n\n    let via = findRoute(nest.name,\
  \ target,\n\n                        nest.state.connections);\n\n    if (!via) throw\
  \ new Error(`No route to ${target}`);\n\n    return request(nest, via, \"route\"\
  ,\n\n                   {target, type, content});\n\n  }\n\n}\n\nrequestType(\"\
  route\", (nest, {target, type, content}) => {\n\n  return routeRequest(nest, target,\
  \ type, content);\n\n});\n```\n\n我们在一个原始通信系统之上构建了多个功能层，使其使用起来更加方便。这是一个很好的（尽管简化了）真实计算机网络工作方式的模型。\n\
  \n计算机网络的一个显著特性是它们并不可靠——建立在它们之上的抽象可以提供帮助，但你无法完全抽象掉网络故障。因此，网络编程通常非常注重预测和处理故障。\n\n\
  ### 异步函数\n\n为了存储重要信息，乌鸦们已知的做法是在多个巢穴之间复制信息。这样，当一只鹰摧毁了一个巢穴时，信息不会丢失。\n\n\n\n\n\n为了检索自身存储球中没有的某条信息，巢计算机可能会询问网络中的其他随机巢，直到找到拥有该信息的巢。\n\
  \n```\nrequestType(\"storage\", (nest, name) => storage(nest, name));\n\nfunction\
  \ findInStorage(nest, name) {\n  return storage(nest, name).then(found => {\n  \
  \  if (found != null) return found;\n    else return findInRemoteStorage(nest, name);\n\
  \    });\n}\n\nfunction network(nest) {\n  return Array.from(nest.state.connections.keys());\n\
  }\n\nfunction findInRemoteStorage(nest, name) {\n  let sources = network(nest).filter(n\
  \ => n != nest.name);\n  function next() {\n    if (sources.length == 0) {\n   \
  \   return Promise.reject(new Error(\"Not found\"));\n    } else {\n      let source\
  \ = sources[Math.floor(Math.random() *\n                           sources.length)];\n\
  \      sources = sources.filter(n => n != source);\n      return routeRequest(nest,\
  \ source, \"storage\", name)\n        .then(value => value != null ? value : next(),\n\
  \              next);\n    }\n  }\n  return next();\n}\n```\n\n因为 `connections`\
  \ 是一个 `Map`，所以 `Object.keys` 对它不起作用。它有一个 `keys` 方法，但返回的是迭代器而非数组。迭代器（或可迭代值）可以通过 `Array.from`\
  \ 函数转换为数组。\n\n即使使用了 Promise，这段代码仍然相当笨拙。多个异步操作以不明显的方式串联在一起。我们再次需要一个递归函数（`next`）来模拟遍历巢的过程。\n\
  \n而代码实际做的事情完全是线性的——它总是等待前一个操作完成后再开始下一个。在同步编程模型中，表达起来会更简单。\n\n好消息是，JavaScript 允许你编写伪同步代码来描述异步计算。`async`\
  \ 函数是一个隐式返回 Promise 的函数，并且在其函数体内可以以看似同步的方式 `await` 其他 Promise。\n\n我们可以像这样重写 `findInStorage`：\n\
  \n```\nasync function findInStorage(nest, name) {\n  let local = await storage(nest,\
  \ name);\n  if (local != null) return local;\n  let sources = network(nest).filter(n\
  \ => n != nest.name);\n  while (sources.length > 0) {\n    let source = sources[Math.floor(Math.random()\
  \ *\n                       sources.length)];\n    sources = sources.filter(n =>\
  \ n != source);\n    try {\n      let found = await routeRequest(nest, source, \"\
  storage\",\n                                     name);\n      if (found != null)\
  \ return found;\n    } catch (_) {}\n  }\n  throw new Error(\"Not found\");\n}\n\
  ```\n\n`async` 函数通过在 `function` 关键字前加上 `async` 来标记。方法也可以通过在其名称前写 `async` 来变为 `async`。当调用这样的函数或方法时，它会返回一个\
  \ Promise。一旦函数体返回某个值，该 Promise 就会被解决。如果它抛出异常，Promise 就会被拒绝。\n\n在 `async` 函数内部，可以在表达式前加上\
  \ `await` 来等待一个 Promise 解决，然后才继续执行函数。\n\n这样的函数不再像常规的 JavaScript 函数那样一次性从头运行到尾。相反，它可以在任何包含\
  \ `await` 的位置被冻结，并在稍后恢复执行。\n\n对于非平凡的异步代码，这种表示法通常比直接使用 Promise 更方便。即使你需要做一些不符合同步模型的事情，比如同时执行多个操作，也很容易将\
  \ `await` 与直接使用 Promise 结合起来。\n\n### 生成器\n\n函数能够暂停然后恢复执行的能力并非 `async` 函数独有。JavaScript\
  \ 还有一个称为生成器函数的特性。它们类似，但没有 Promise。\n\n当你用 `function*`（在 `function` 关键字后加一个星号）定义函数时，它就变成了生成器。当你调用生成器时，它会返回一个迭代器，我们在第\
  \ 6 章中已经见过。\n\n```\nfunction* powers(n) {\n  for (let current = n;; current *= n)\
  \ {\n    yield current;\n  }\n}\n\nfor (let power of powers(3)) {\n  if (power >\
  \ 50) break;\n  console.log(power);\n}\n// → 3\n// → 9\n// → 27\n```\n\n最初，当你调用\
  \ `powers` 时，函数在其起始处被冻结。每次你在迭代器上调用 `next` 时，函数会一直运行到遇到 `yield` 表达式，该表达式会暂停它，并使 yield\
  \ 的值成为迭代器产生的下一个值。当函数返回时（示例中的函数永远不会返回），迭代器就结束了。\n\n使用生成器函数编写迭代器通常要容易得多。`Group` 类（来自第\
  \ 114 页“可迭代的组”练习）的迭代器可以用这个生成器编写：\n\n```\nGroup.prototype[Symbol.iterator] = function*()\
  \ {\n   for (let i = 0; i < this.members.length; i++) {\n     yield this.members[i];\n\
  \   }\n};\n```\n\n不再需要创建一个对象来保存迭代状态——生成器在每次 `yield` 时会自动保存其局部状态。\n\n这样的 `yield`\
  \ 表达式只能直接出现在生成器函数本身中，而不能出现在你在其中定义的内部函数中。生成器在 yield 时保存的状态仅是其局部环境和 yield 的位置。\n\n\
  `async` 函数是一种特殊类型的生成器。它在被调用时产生一个 Promise，当它返回（完成）时该 Promise 被解决，当它抛出异常时被拒绝。每当它 yield（await）一个\
  \ Promise 时，该 Promise 的结果（值或抛出的异常）就是 `await` 表达式的结果。\n\n### 事件循环\n\n异步程序是逐段执行的。每一段可能会启动一些动作，并安排代码在动作完成或失败时执行。在这些段之间，程序处于空闲状态，等待下一个动作。\n\
  \n因此，回调并非由安排它们的代码直接调用。如果我在一个函数内部调用 `setTimeout`，那么当回调函数被调用时，那个函数已经返回了。而当回调返回时，控制权不会回到安排它的函数。\n\
  \n异步行为发生在它自己的空函数调用栈上。这也是为什么在没有 Promise 的情况下，跨异步代码管理异常很困难的原因之一。由于每个回调开始时栈几乎是空的，当它们抛出异常时，你的\
  \ `catch` 处理程序不会在栈上。\n\n```\ntry {\n  setTimeout(() => {\n    throw new Error(\"\
  Woosh\");\n  }, 20);\n} catch (_) {\n  // 这不会运行\n  console.log(\"Caught!\");\n}\n\
  ```\n\n无论事件（如超时或传入请求）发生得多么紧密，JavaScript 环境一次只运行一个程序。你可以将其视为在你的程序周围运行一个大的循环，称为事件循环。当无事可做时，该循环会停止。但随着事件到来，它们被添加到队列中，其代码一个接一个地执行。由于没有两件事同时运行，运行缓慢的代码可能会延迟其他事件的处理。\n\
  \n这个示例设置了一个超时，但随后拖延到超时预定时间之后，导致超时延迟。\n\n```\nlet start = Date.now();\nsetTimeout(()\
  \ => {\n  console.log(\"Timeout ran at\", Date.now() - start);\n}, 20);\nwhile (Date.now()\
  \ < start + 50) {}\nconsole.log(\"Wasted time until\", Date.now() - start);\n//\
  \ → Wasted time until 50\n// → Timeout ran at 55\n```\n\nPromise 总是作为新事件解决或拒绝。即使一个\
  \ Promise 已经解决，等待它也会导致你的回调在当前脚本完成后运行，而不是立即运行。\n\n```\nPromise.resolve(\"Done\").then(console.log);\n\
  console.log(\"Me first!\");\n// → Me first!\n// → Done\n```\n\n在后续章节中，我们将看到在事件循环上运行的各种其他类型的事件。\n\
  \n### 异步 Bug\n\n\n\n\n\n当你的程序同步运行时，一次性执行完毕，除了程序自身所做的更改外，不会发生任何状态变化。对于异步程序则不同——它们的执行过程中可能存在*间隙*，在此期间其他代码可以运行。\n\
  \n让我们看一个例子。我们的乌鸦的爱好之一是统计每年整个村庄孵化的小鸡数量。巢穴将这些计数存储在其存储球中。以下代码尝试枚举给定年份所有巢穴的计数：\n\n```\n\
  function anyStorage(nest, source, name) {\n  if (source == nest.name) return storage(nest,\
  \ name);\n  else return routeRequest(nest, source, \"storage\", name);\n}\n\nasync\
  \ function chicks(nest, year) {\n  let list = \"\";\n  await Promise.all(network(nest).map(async\
  \ name => {\n    list += `${name}: ${\n       await anyStorage(nest, name, `chicks\
  \ in ${year}`)\n    }\\n`;\n  }));\n  return list;\n}\n```\n\n`async name =>` 部分表明，通过在箭头函数前加上\
  \ `async` 关键字，也可以使其成为异步函数。\n\n这段代码乍看之下并无问题……它遍历巢穴集合，对每个巢穴应用 `async` 箭头函数，创建了一个 Promise\
  \ 数组，然后使用 `Promise.all` 等待所有这些 Promise 完成，最后返回它们构建的 `list`。\n\n但它存在严重缺陷。它始终只返回一行输出，列出响应最慢的那个巢穴。\n\
  \n你能找出原因吗？\n\n问题出在 `+=` 运算符上。该运算符在语句开始执行时获取 `list` 的*当前*值，然后在 `await` 完成后，将 `list`\
  \ 绑定设置为该值加上追加的字符串。\n\n但在语句开始执行到完成之间有一个异步间隙。`map` 表达式在 `list` 被添加任何内容之前运行，因此每个 `+=`\
  \ 运算符都从一个空字符串开始，当存储检索完成时，最终将 `list` 设置为单行列表——即将其行追加到空字符串的结果。\n\n通过从映射的 Promise 中返回各行，并对\
  \ `Promise.all` 的结果调用 `join`，而不是通过修改绑定来构建 `list`，可以轻松避免这个问题。通常，计算新值比修改现有值更不容易出错。\n\
  \n```\nasync function chicks(nest, year) {\n  let lines = network(nest).map(async\
  \ name => {\n    return name + \": \" +\n      await anyStorage(nest, name, `chicks\
  \ in ${year}`);\n  });\n  return (await Promise.all(lines)).join(\"\\n\");\n}\n\
  ```\n\n这类错误很容易犯，尤其是在使用 `await` 时，你应该清楚代码中的间隙出现在哪里。JavaScript 的*显式*异步性（无论是通过回调、Promise\
  \ 还是 `await`）的一个优点是，发现这些间隙相对容易。\n\n### 总结\n\n异步编程使得在等待长时间运行的操作时，无需冻结程序即可表达等待。JavaScript\
  \ 环境通常使用回调（操作完成时调用的函数）来实现这种编程风格。事件循环会按顺序在适当的时候调度这些回调，使它们的执行不会重叠。\n\nPromise 和 `async`\
  \ 函数使异步编程变得更加容易。Promise 是表示未来可能完成的操作的对象，而 `async` 函数允许你像编写同步程序一样编写异步程序。\n\n### 练习\n\
  \n#### *追踪手术刀*\n\n村庄的乌鸦拥有一把旧手术刀，偶尔会在特殊任务中使用——比如割开纱门或包装。为了能够快速追踪它，每次手术刀被移动到另一个巢穴时，都会在原先拥有它的巢穴和拿走它的巢穴的存储中添加一条记录，名称为\
  \ \"scalpel\"，值为新位置。\n\n这意味着找到手术刀就像沿着存储条目的面包屑轨迹追踪，直到找到一个指向自身的巢穴。\n\n编写一个 `async`\
  \ 函数 `locateScalpel` 来完成此任务，从它运行的巢穴开始。你可以使用之前定义的 `anyStorage` 函数来访问任意巢穴的存储。手术刀已经流传了足够久，你可以假设每个巢穴的数据存储中都有一个\
  \ \"scalpel\" 条目。\n\n接下来，在不使用 `async` 和 `await` 的情况下再次编写相同的函数。\n\n在这两个版本中，请求失败是否都能正确地作为返回\
  \ Promise 的拒绝（rejection）体现出来？如何实现？\n\n#### *构建 `Promise.all`*\n\n给定一个 Promise 数组，`Promise.all`\
  \ 返回一个 Promise，该 Promise 等待数组中的所有 Promise 完成。然后它成功，并生成一个结果值数组。如果数组中的某个 Promise 失败，则\
  \ `Promise.all` 返回的 Promise 也会失败，失败原因来自失败的 Promise。\n\n自己实现一个类似的功能，作为一个名为 `Promise_all`\
  \ 的普通函数。\n\n请记住，Promise 在成功或失败后，不能再成功或失败，并且后续对解析它的函数的调用将被忽略。这可以简化处理 Promise 失败的方式。\n\
  \n“解释器，即确定编程语言中表达式含义的程序，不过是另一个程序。”\n\n—— 哈尔·阿贝尔森和杰拉尔德·萨斯曼，《计算机程序的构造和解释》\n\n![Image](img/f0202-01.jpg)\n\
  \n## 12\n\n项目：一门编程语言\n\n构建你自己的编程语言出奇地容易（只要你的目标不是太高），而且非常具有启发性。\n\n本章我想展示的主要内容是，构建自己的语言并不涉及任何魔法。我常常觉得某些人类发明如此巧妙和复杂，以至于我永远无法理解它们。但通过一些阅读和实验，它们往往显得相当平凡。\n\
  \n我们将构建一门名为 Egg 的编程语言。它将是一门小巧、简单的语言——但足够强大，能够表达你能想到的任何计算。它将允许基于函数的简单抽象。\n\n### 解析\n\
  \n编程语言最直观的部分是其*语法*或表示法。*解析器*是一个程序，它读取一段文本并生成一个数据结构，该结构反映了该文本中包含的程序结构。如果文本不构成有效程序，解析器应指出错误。\n\
  \n我们的语言将具有简单且统一的语法。Egg 中的一切都是表达式。表达式可以是绑定的名称、数字、字符串或*应用*。应用用于函数调用，也用于诸如 `if` 或 `while`\
  \ 之类的结构。\n\n为了保持解析器简单，Egg 中的字符串不支持反斜杠转义之类的功能。字符串只是一系列不包含双引号的字符，用双引号括起来。数字是一系列数字。绑定名称可以由任何不是空白字符且在语法中没有特殊含义的字符组成。\n\
  \n应用的写法与 JavaScript 中相同，在表达式后面加上括号，括号内可以有任意数量的参数，用逗号分隔。\n\n```\ndo(define(x, 10),\n\
  \   if(>(x, 5),\n      print(\"large\"),\n      print(\"small\")))\n```\n\nEgg 语言的统一性意味着，在\
  \ JavaScript 中是运算符的东西（例如 `>`）在此语言中是普通的绑定，像其他函数一样被应用。而且由于语法没有块的概念，我们需要一个 `do` 结构来表示按顺序执行多个操作。\n\
  \n解析器用于描述程序的数据结构由表达式对象组成，每个对象都有一个 `type` 属性，指示表达式的类型，以及其他属性来描述其内容。\n\n\n\n\n类型为\
  \ `\"value\"` 的表达式表示字面字符串或数字。它们的 `value` 属性包含所表示的字符串或数字值。类型为 `\"word\"` 的表达式用于标识符（名称）。这类对象有一个\
  \ `name` 属性，以字符串形式保存标识符的名称。最后，`\"apply\"` 表达式表示应用。它们有一个 `operator` 属性，指向被应用的表达式，以及一个\
  \ `args` 属性，保存参数表达式的数组。\n\n上一个程序中的 `>(x, 5)` 部分会表示为如下形式：\n\n```\n{\n  type: \"apply\"\
  ,\n  operator: {type: \"word\", name: \">\"},\n  args: [\n    {type: \"word\", name:\
  \ \"x\"},\n    {type: \"value\", value: 5}\n  ]\n}\n```\n\n这种数据结构称为**语法树**。如果你把对象想象成点，把对象之间的链接想象成点之间的连线，它就会呈现出树状结构。表达式包含其他表达式，而这些表达式又可能包含更多表达式，这与树枝分叉再分叉的方式类似。\n\
  \n![Image](img/f0205-01.jpg)\n\n与此对比，我们在第 160 页的“解析 INI 文件”中为配置文件格式编写的解析器结构简单：它将输入拆分为行，并逐行处理。每行只允许少数几种简单形式。\n\
  \n在这里，我们必须采用不同的方法。表达式不是按行分隔的，而且具有递归结构。应用表达式*包含*其他表达式。\n\n幸运的是，通过编写一个递归的解析器函数，可以很好地解决这个问题，该函数的递归方式反映了语言的递归特性。\n\
  \n我们定义了一个函数 `parseExpression`，它接收一个字符串作为输入，并返回一个对象，该对象包含字符串开头的表达式数据结构，以及解析该表达式后剩余的字符串部分。在解析子表达式（例如应用的参数）时，可以再次调用此函数，从而得到参数表达式以及剩余的文本。这个文本可能包含更多参数，也可能是结束参数列表的右括号。\n\
  \n这是解析器的第一部分：\n\n```javascript\nfunction parseExpression(program) {\n  program =\
  \ skipSpace(program);\n  let match, expr;\n  if (match = /^\"([^\"]*)\"/.exec(program))\
  \ {\n    expr = {type: \"value\", value: match[1]};\n  } else if (match = /^\\d+\\\
  b/.exec(program)) {\n    expr = {type: \"value\", value: Number(match[0])};\n  }\
  \ else if (match = /^[^\\s(),#\"]+/.exec(program)) {\n    expr = {type: \"word\"\
  , name: match[0]};\n  } else {\n    throw new SyntaxError(\"Unexpected syntax: \"\
  \ + program);\n  }\n  return parseApply(expr, program.slice(match[0].length));\n\
  }\n\nfunction skipSpace(string) {\n  let first = string.search(/\\S/);\n  if (first\
  \ == -1) return \"\";\n  return string.slice(first);\n}\n```\n\n由于 Egg 和 JavaScript\
  \ 一样，允许元素之间任意数量的空白，我们必须反复从程序字符串的开头去除空白。这就是 `skipSpace` 函数的作用。\n\n在跳过前导空白后，`parseExpression`\
  \ 使用三个正则表达式来识别 Egg 支持的三种原子元素：字符串、数字和单词。解析器根据匹配到的类型构造不同的数据结构。如果输入不匹配这三种形式中的任何一种，则不是有效的表达式，解析器会抛出错误。我们使用\
  \ `SyntaxError` 而不是 `Error` 作为异常构造函数，这是另一种标准错误类型，因为它更具体一些——当尝试运行无效的 JavaScript 程序时，也会抛出这种错误类型。\n\
  \n然后我们从程序字符串中截掉匹配的部分，并将其与表达式对象一起传递给 `parseApply`，后者检查该表达式是否是一个应用。如果是，则解析一个带括号的参数列表。\n\
  \n```javascript\nfunction parseApply(expr, program) {\n  program = skipSpace(program);\n\
  \  if (program[0] != \"(\") {\n    return {expr: expr, rest: program};\n  }\n  program\
  \ = skipSpace(program.slice(1));\n  expr = {type: \"apply\", operator: expr, args:\
  \ []};\n  while (program[0] != \")\") {\n    let arg = parseExpression(program);\n\
  \    expr.args.push(arg.expr);\n    program = skipSpace(arg.rest);\n    if (program[0]\
  \ == \",\") {\n      program = skipSpace(program.slice(1));\n    } else if (program[0]\
  \ != \")\") {\n      throw new SyntaxError(\"Expected ',' or ')'\");\n    }\n  }\n\
  \  return parseApply(expr, program.slice(1));\n}\n```\n\n如果程序中的下一个字符不是左括号，则这不是一个应用，`parseApply`\
  \ 返回它接收到的表达式。\n\n否则，它会跳过左括号，并为这个应用表达式创建语法树对象。然后它递归调用 `parseExpression` 来解析每个参数，直到找到右括号。这种递归是间接的，通过\
  \ `parseApply` 和 `parseExpression` 相互调用实现。\n\n因为一个应用表达式本身也可以被应用（例如在 `multiplier(2)(1)`\
  \ 中），所以 `parseApply` 在解析完一个应用后，必须再次调用自身，以检查后面是否还有另一对括号。\n\n这就是解析 Egg 所需的全部内容。我们将其包装在一个方便的\
  \ `parse` 函数中，该函数在解析表达式后验证是否已到达输入字符串的末尾（一个 Egg 程序就是一个单独的表达式），并返回程序的数据结构。\n\n```javascript\n\
  function parse(program) {\n  let {expr, rest} = parseExpression(program);\n  if\
  \ (skipSpace(rest).length > 0) {\n    throw new SyntaxError(\"Unexpected text after\
  \ program\");\n  }\n  return expr;\n}\n\nconsole.log(parse(\"+(a, 10)\"));\n// →\
  \ {type: \"apply\",\n//    operator: {type: \"word\", name: \"+\"},\n//    args:\
  \ [{type: \"word\", name: \"a\"},\n//           {type: \"value\", value: 10}]}\n\
  ```\n\n它起作用了！当解析失败时，它不会提供非常有用的信息，也不会存储每个表达式开始的行号和列号（这在以后报告错误时可能有用），但对于我们的目的来说已经足够好了。\n\
  \n### 求值器\n\n对于程序的语法树，我们能做什么？当然是运行它！这就是求值器的工作。你给它一个语法树和一个将名称与值关联的作用域对象，它会计算树所代表的表达式，并返回产生的值。\n\
  \n```javascript\nconst specialForms = Object.create(null);\n\nfunction evaluate(expr,\
  \ scope) {\n  if (expr.type == \"value\") {\n    return expr.value;\n  } else if\
  \ (expr.type == \"word\") {\n    if (expr.name in scope) {\n      return scope[expr.name];\n\
  \    } else {\n      throw new ReferenceError(\n        `Undefined binding: ${expr.name}`);\n\
  \    }\n  } else if (expr.type == \"apply\") {\n    let {operator, args} = expr;\n\
  \    if (operator.type == \"word\" &&\n        operator.name in specialForms) {\n\
  \      return specialFormsoperator.name;\n    } else {\n      let op = evaluate(operator,\
  \ scope);\n      if (typeof op == \"function\") {\n        return op(...args.map(arg\
  \ => evaluate(arg, scope)));\n      } else {\n        throw new TypeError(\"Applying\
  \ a non-function.\");\n      }\n    }\n  }\n}\n```\n\n求值器为每种表达式类型都提供了代码。字面值表达式产生其值（例如，表达式\
  \ `100` 直接求值为数字 `100`）。对于绑定，我们必须检查它是否确实在作用域中定义，如果是，则获取该绑定的值。\n\n应用则更复杂一些。如果它们是特殊形式（如\
  \ `if`），我们不会求值任何东西，而是将参数表达式和作用域一起传递给处理该形式的函数。如果是普通调用，我们求值运算符，验证它是一个函数，然后用求值后的参数调用它。\n\
  \n\n\n我们使用普通的 JavaScript 函数值来表示 Egg 的函数值。当在第 211 页定义名为 `fun` 的特殊形式时，我们会回到这一点。\n\n\
  `evaluate` 的递归结构与解析器的类似结构相似，两者都反映了语言本身的结构。也可以将解析器与求值器集成，在解析过程中进行求值，但这样分开处理会使程序更清晰。\n\
  \n这就是解释 Egg 所需的全部内容。它就是这么简单。但如果不定义一些特殊形式并向环境中添加一些有用的值，你目前还无法用这门语言做太多事情。\n\n### 特殊形式\n\
  \n`specialForms` 对象用于定义 Egg 中的特殊语法。它将单词与对这些形式进行求值的函数关联起来。目前它是空的。让我们添加 `if`。\n\n\
  ```\nspecialForms.if = (args, scope) => {\n  if (args.length != 3) {\n    throw\
  \ new SyntaxError(\"Wrong number of args to if\");\n  } else if (evaluate(args[0],\
  \ scope) !== false) {\n    return evaluate(args[1], scope);\n  } else {\n    return\
  \ evaluate(args[2], scope);\n  }\n};\n```\n\nEgg 的 `if` 结构恰好需要三个参数。它会求值第一个参数，如果结果不是值\
  \ `false`，则求值第二个参数；否则求值第三个参数。这个 `if` 形式更类似于 JavaScript 的三元 `?:` 运算符，而不是 JavaScript\
  \ 的 `if`。它是一个表达式，而不是语句，并且会产生一个值，即第二个或第三个参数的结果。\n\nEgg 在处理 `if` 的条件值时也与 JavaScript\
  \ 不同。它不会将零或空字符串等视为 `false`，只有精确的值 `false` 才被视为假。\n\n我们需要将 `if` 表示为特殊形式而不是普通函数的原因是，函数的所有参数在调用前都会被求值，而\
  \ `if` 应该只根据第一个参数的值求值*要么*第二个参数，*要么*第三个参数。\n\n`while` 形式类似。\n\n```\nspecialForms.while\
  \ = (args, scope) => {\n  if (args.length != 2) {\n    throw new SyntaxError(\"\
  Wrong number of args to while\");\n  }\n  while (evaluate(args[0], scope) !== false)\
  \ {\n    evaluate(args[1], scope);\n  }\n  // Since undefined does not exist in\
  \ Egg, we return false,\n  // for lack of a meaningful result.\n  return false;\n\
  };\n```\n\n另一个基本构建块是 `do`，它从上到下执行所有参数。它的值是最后一个参数产生的值。\n\n```\nspecialForms.do =\
  \ (args, scope) => {\n   let value = false;\n   for (let arg of args) {\n     value\
  \ = evaluate(arg, scope);\n   }\n   return value;\n};\n```\n\n为了能够创建绑定并赋予它们新值，我们还创建了一个名为\
  \ `define` 的形式。它期望第一个参数是一个单词，第二个参数是一个表达式，用于产生要赋给该单词的值。由于 `define` 和其他所有东西一样是一个表达式，它必须返回一个值。我们将让它返回被赋的值（就像\
  \ JavaScript 的 `=` 运算符一样）。\n\n```\nspecialForms.define = (args, scope) => {\n  \
  \ if (args.length != 2 || args[0].type != \"word\") {\n     throw new SyntaxError(\"\
  Incorrect use of define\");\n   }\n   let value = evaluate(args[1], scope);\n  \
  \ scope[args[0].name] = value;\n   return value;\n};\n```\n\n### 环境\n\n`evaluate`\
  \ 接受的 `scope` 是一个对象，其属性名对应绑定名称，属性值对应这些绑定所绑定的值。让我们定义一个对象来表示全局作用域。\n\n为了能够使用我们刚刚定义的\
  \ `if` 结构，我们必须能够访问布尔值。由于只有两个布尔值，我们不需要为它们提供特殊语法。我们只需将两个名称绑定到值 `true` 和 `false` 并使用它们。\n\
  \n```\nconst topScope = Object.create(null);\ntopScope.true = true;\ntopScope.false\
  \ = false;\n```\n\n现在我们可以求值一个简单的表达式，该表达式对布尔值取反。\n\n```\nlet prog = parse(`if(true,\
  \ false, true)`);\nconsole.log(evaluate(prog, topScope));\n// → false\n```\n\n为了提供基本的算术和比较运算符，我们还将向作用域中添加一些函数值。为了保持代码简短，我们将使用\
  \ `Function` 在循环中合成一组运算符函数，而不是逐个定义它们。\n\n```\nfor (let op of [\"+\", \"-\", \"*\"\
  , \"/\", \"==\", \"<\", \">\"]) {\n  topScope[op] = Function(\"a, b\", `return a\
  \ ${op} b;`);\n}\n```\n\n输出值的方法也很有用，因此我们将 `console.log` 包装在一个函数中，并将其命名为 `print`。\n\
  \n```\ntopScope.print = value => {\n   console.log(value);\n   return value;\n};\n\
  ```\n\n这为我们提供了足够的基本工具来编写简单的程序。以下函数提供了一种便捷的方式，用于解析程序并在新的作用域中运行它：\n\n```\nfunction\
  \ run(program) {\n  return evaluate(parse(program), Object.create(topScope));\n\
  }\n```\n\n我们将使用对象原型链来表示嵌套作用域，这样程序就可以向局部作用域添加绑定，而不会改变顶层作用域。\n\n```\nrun(`\ndo(define(total,\
  \ 0),\n   define(count, 1),\n   while(<(count, 11),\n         do(define(total, +(total,\
  \ count)),\n            define(count, +(count, 1)))),\n   print(total))\n`);\n//\
  \ → 55\n```\n\n这是我们之前多次见过的程序，它计算数字 1 到 10 的和，用 Egg 表达。它显然比等效的 JavaScript 程序更丑陋——但对于一个用不到\
  \ 150 行代码实现的语言来说，已经不错了。\n\n### 函数\n\n没有函数的编程语言确实是一种糟糕的编程语言。\n\n幸运的是，添加一个 `fun` 结构并不难，它将最后一个参数视为函数体，并将之前的所有参数用作函数参数的名称。\n\
  \n```\nspecialForms.fun = (args, scope) => {\n  if (!args.length) {\n    throw new\
  \ SyntaxError(\"Functions need a body\");\n  }\n  let body = args[args.length -\
  \ 1];\n  let params = args.slice(0, args.length - 1).map(expr => {\n     if (expr.type\
  \ != \"word\") {\n       throw new SyntaxError(\"Parameter names must be words\"\
  );\n     }\n     return expr.name;\n   });\n   return function() {\n     if (arguments.length\
  \ != params.length) {\n       throw new TypeError(\"Wrong number of arguments\"\
  );\n     }\n     let localScope = Object.create(scope);\n     for (let i = 0; i\
  \ < arguments.length; i++) {\n       localScope[params[i]] = arguments[i];\n   \
  \  }\n     return evaluate(body, localScope);\n  };\n};\n```\n\nEgg 中的函数拥有自己的局部作用域。由\
  \ `fun` 形式产生的函数会创建这个局部作用域，并向其中添加参数绑定。然后它在这个作用域中求值函数体并返回结果。\n\n```\nrun(`\ndo(define(plusOne,\
  \ fun(a, +(a, 1))),\n   print(plusOne(10)))\n`);\n// → 11\n```\n\n```\nrun(`\ndo(define(pow,\
  \ fun(base, exp,\n      if(==(exp, 0),\n         1,\n         *(base, pow(base,\
  \ -(exp, 1)))))),\n    print(pow(2, 10)))\n`);\n// → 1024\n```\n\n### 编译\n\n我们构建的是一个解释器。在求值过程中，它直接作用于解析器产生的程序表示。\n\
  \n*编译*是在解析和运行程序之间增加一个步骤的过程，它通过尽可能多地提前完成工作，将程序转换为可以更高效求值的形式。例如，在精心设计的语言中，对于每个绑定的使用，无需实际运行程序就能明显看出引用的是哪个绑定。这可以用来避免每次访问绑定时按名称查找，而是直接从某个预定的内存位置获取。\n\
  \n传统上，编译涉及将程序转换为机器码，即计算机处理器可以执行的原始格式。但任何将程序转换为不同表示形式的过程都可以被视为编译。\n\n\n\n\n我们可以为\
  \ Egg 编写另一种求值策略：先将程序转换为 JavaScript 程序，然后使用 `Function` 调用 JavaScript 编译器来编译它，最后运行结果。如果实现得当，这种方法能让\
  \ Egg 运行得非常快，同时实现起来仍然相当简单。\n\n如果你对这个话题感兴趣，并且愿意花些时间，我鼓励你尝试将这样的编译器作为练习来实现。\n\n###\
  \ 偷懒\n\n当我们定义 `if` 和 `while` 时，你可能已经注意到它们或多或少只是 JavaScript 自身 `if` 和 `while` 的简单包装。同样，Egg\
  \ 中的值也只是普通的 JavaScript 值。\n\n如果将基于 JavaScript 构建的 Egg 实现与直接利用机器提供的原始功能来构建编程语言所需的工作量和复杂性相比，差异是巨大的。尽管如此，这个例子理想地让你对编程语言的工作方式有了一个印象。\n\
  \n而在完成某件事时，偷懒比亲力亲为更有效。尽管本章中的玩具语言不能做任何在 JavaScript 中无法做得更好的事情，但确实存在一些情况，编写小型语言有助于完成实际工作。\n\
  \n这样的语言不必像典型的编程语言。例如，如果 JavaScript 没有自带正则表达式，你可以自己编写正则表达式的解析器和求值器。\n\n或者想象你正在建造一个巨大的机器恐龙，需要编程控制它的行为。JavaScript\
  \ 可能不是最有效的方式。你可能会选择一种看起来像这样的语言：\n\n```\nbehavior walk\n  perform when\n    destination\
  \ ahead\n  actions\n    move left-foot\n    move right-foot\n\nbehavior attack\n\
  \  perform when\n    Godzilla in-view\n  actions\n    fire laser-eyes\n    launch\
  \ arm-rockets\n```\n\n这就是通常所说的*领域特定语言*，一种为表达狭窄领域知识而量身定制的语言。这种语言可以比通用语言更具表现力，因为它被设计用来精确描述其领域中需要描述的事物，而不是其他。\n\
  \n### 练习\n\n#### *数组*\n\n通过向顶层作用域添加以下三个函数来为 Egg 添加对数组的支持：`array(...values)` 用于构造包含参数值的数组，`length(array)`\
  \ 用于获取数组长度，以及 `element(array, n)` 用于从数组中获取第 n 个元素。\n\n#### *闭包*\n\n我们定义 `fun` 的方式允许\
  \ Egg 中的函数引用周围的作用域，使得函数体可以使用函数定义时可见的局部值，就像 JavaScript 函数一样。\n\n下面的程序说明了这一点：函数 `f`\
  \ 返回一个函数，该函数将其参数加到 `f` 的参数上，这意味着它需要访问 `f` 内部的局部作用域才能使用绑定 `a`。\n\n```\nrun(`\ndo(define(f,\
  \ fun(a, fun(b, +(a, b)))),\n   print(f(4)(5)))\n`);\n// → 9\n```\n\n回到 `fun` 形式的定义，解释是哪种机制使其生效。\n\
  \n#### *注释*\n\n如果我们能在 Egg 中编写注释就好了。例如，每当我们找到一个井号（`#`）时，我们可以将行的其余部分视为注释并忽略它，类似于 JavaScript\
  \ 中的 `//`。\n\n我们不需要对解析器进行大的修改来支持这一点。我们可以简单地修改 `skipSpace`，使其像跳过空白一样跳过注释，这样所有调用 `skipSpace`\
  \ 的地方现在也会跳过注释。进行此修改。\n\n#### *修复作用域*\n\n目前，给绑定赋值的唯一方式是 `define`。这个构造既用于定义新绑定，也用于给现有绑定赋予新值。\n\
  \n这种歧义导致了一个问题。当你试图给一个非局部绑定赋予新值时，你最终会在局部定义一个同名的绑定。有些语言在设计上就是这样工作的，但我一直觉得这是一种笨拙的作用域处理方式。\n\
  \n添加一个特殊形式 `set`，类似于 `define`，它给绑定赋予新值，如果绑定在内部作用域中不存在，则更新外部作用域中的绑定。如果绑定根本没有定义，则抛出一个\
  \ `ReferenceError`（另一种标准错误类型）。\n\n到目前为止，将作用域表示为简单对象的技术一直很方便，但在这一点上会给你带来一些麻烦。你可能需要使用\
  \ `Object.getPrototypeOf` 函数，它返回对象的原型。还要记住，作用域并不继承自 `Object.prototype`，所以如果你想在它们上面调用\
  \ `hasOwnProperty`，你必须使用这个笨拙的表达式：\n\n```\nObject.prototype.hasOwnProperty.call(scope,\
  \ name);\n```\n\n# 第二部分\n\n# 浏览器\n\n“Web 背后的梦想是一个共同的信息空间，我们通过共享信息进行交流。它的普遍性至关重要：超文本链接可以指向任何东西，无论是个人、本地还是全球，无论是草稿还是精雕细琢。”\n\
  \n—— 蒂姆·伯纳斯-李，《万维网：一段非常简短的个人历史》\n\n![Image](img/f0218-01.jpg)\n\n## 13\n\nJavaScript\
  \ 与浏览器\n\n本书接下来的章节将讨论 Web 浏览器。没有 Web 浏览器，就不会有 JavaScript。即使有，也不会有人关注它。\n\nWeb 技术从一开始就是去中心化的，不仅在技术上，而且在演变方式上也是如此。各种浏览器供应商以临时且有时考虑不周的方式添加新功能，这些功能有时会被其他供应商采用，并最终被确立为标准。\n\
  \n这既是福也是祸。一方面，没有中央机构控制系统，而是由多个松散协作（偶尔公开敌对）的各方改进系统，这令人振奋。另一方面，Web 发展的随意方式意味着最终的系统并非内部一致性的典范。它的某些部分令人困惑且构思不佳。\n\
  \n### 网络与互联网\n\n计算机网络自 20 世纪 50 年代就已存在。如果你在两台或多台计算机之间铺设电缆，并允许它们通过这些电缆来回发送数据，你就可以做各种奇妙的事情。\n\
  \n如果连接同一栋建筑中的两台机器就能让我们做奇妙的事情，那么连接全球的机器应该会更好。实现这一愿景的技术在 20 世纪 80 年代得到发展，由此产生的网络被称为*互联网*。它没有辜负它的承诺。\n\
  \n计算机可以利用这个网络向另一台计算机发送比特。为了从这种比特发送中产生有效的通信，两端的计算机必须知道这些比特应该代表什么。任何给定比特序列的含义完全取决于它试图表达的事物类型以及所使用的编码机制。\n\
  \n*网络协议*描述了一种通过网络进行通信的方式。有用于发送电子邮件、获取电子邮件、共享文件，甚至控制被恶意软件感染的计算机的协议。\n\n例如，*超文本传输协议*（HTTP）是一种用于检索命名资源（信息块，如网页或图片）的协议。它规定发起请求的一方应以如下一行开始，命名资源以及它试图使用的协议版本：\n\
  \n```\nGET /index.html HTTP/1.1\n```\n\n关于请求方如何在请求中包含更多信息，以及返回资源的一方如何打包其内容，还有更多规则。我们将在第\
  \ 18 章中更详细地介绍 HTTP。\n\n\n\n\n大多数协议都构建在其他协议之上。HTTP 将网络视为一种流式设备，你可以向其中放入比特，它们会按正确顺序到达正确的目的地。正如我们在第\
  \ 11 章中所见，确保这些事情已经是一个相当困难的问题。\n\n*传输控制协议*（TCP）就是解决这个问题的协议。所有联网设备都“说”这种协议，互联网上的大多数通信都构建在它之上。\n\
  \nTCP 连接的工作方式如下：一台计算机必须等待（或*监听*）其他计算机开始与它通信。为了能够在一台机器上同时监听不同类型的通信，每个监听器都有一个与之关联的编号（称为*端口*）。大多数协议会指定默认使用的端口。例如，当我们想使用\
  \ SMTP 协议发送电子邮件时，发送邮件的机器应监听端口 25。\n\n然后，另一台计算机可以通过使用正确的端口号连接到目标机器来建立连接。如果目标机器可达并且正在监听该端口，则连接成功创建。监听的计算机称为*服务器*，连接的计算机称为*客户端*。\n\
  \n这样的连接就像一个双向管道，比特可以在其中流动——两端的机器都可以向其中放入数据。一旦比特成功传输，另一端的机器就可以再次读取它们。这是一个方便的模型。可以说\
  \ TCP 提供了网络的抽象。\n\n### 万维网\n\n*万维网*（不要与整个互联网混淆）是一组协议和格式，允许我们在浏览器中访问网页。名称中的“Web”部分指的是这些页面可以轻松地相互链接，从而连接成一个巨大的网状结构，用户可以在其中浏览。\n\
  \n要成为万维网的一部分，你只需将一台机器连接到互联网，并让它使用 HTTP 协议监听端口 80，这样其他计算机就可以向它请求文档。\n\n万维网上的每个文档都由一个*统一资源定位符*（URL）命名，它看起来像这样：\n\
  \n```\n  http://eloquentjavascript.net/13_browser.html\n  |       |            \
  \          |                |\n 协议        服务器                  路径\n```\n\n第一部分告诉我们这个\
  \ URL 使用 HTTP 协议（与加密的 HTTP 相对，后者会是 *https://*）。接下来是标识我们请求文档的服务器部分。最后是一个路径字符串，标识我们感兴趣的特定文档（或*资源*）。\n\
  \n连接到互联网的机器会获得一个*IP 地址*，这是一个可用于向该机器发送消息的数字，看起来像 149.210.142.219 或 2001:4860:4860::8888。但一串或多或少随机的数字很难记住且输入不便，因此你可以为特定地址或地址集注册一个*域名*。我注册了域名\
  \ *eloquentjavascript.net*，指向我控制的一台机器的 IP 地址，因此可以使用该名称来提供网页服务。\n\n如果你在浏览器的地址栏中输入这个\
  \ URL，浏览器会尝试检索并显示该 URL 处的文档。首先，你的浏览器必须找出 *eloquentjavascript.net* 对应的地址。然后，使用 HTTP\
  \ 协议，它会连接到该地址的服务器，并请求资源 `/13_browser.html`。如果一切顺利，服务器会返回一个文档，然后你的浏览器将其显示在屏幕上。\n\n\
  ### HTML\n\nHTML，全称为*超文本标记语言*，是用于网页的文档格式。HTML 文档包含文本，以及为文本提供结构的*标签*，描述诸如链接、段落和标题等内容。\n\
  \n一个简短的 HTML 文档可能如下所示：\n\n```html\n<!doctype html>\n<html>\n  <head>\n    <meta\
  \ charset=\"utf-8\">\n    <title>我的主页</title>\n  </head>\n  <body>\n    <h1>我的主页</h1>\n\
  \    <p>你好，我是 Marijn，这是我的主页。</p>\n    <p>我还写了一本书！请点击\n       <a href=\"http://eloquentjavascript.net\"\
  >这里</a>阅读。</p>\n  </body>\n</html>\n```\n\n这就是这样的文档在浏览器中的样子：\n\n![Image](img/f0222-01.jpg)\n\
  \n标签用尖括号（< 和 >，即*小于*和*大于*符号）包裹，提供文档结构的信息。其他文本只是纯文本。\n\n文档以 `<!doctype html>` 开头，它告诉浏览器将页面解释为*现代*\
  \ HTML，而不是过去使用的各种方言。\n\nHTML 文档有头部和主体。头部包含*关于*文档的信息，主体包含文档本身。在这个例子中，头部声明了文档的标题是“我的主页”，并且它使用\
  \ UTF-8 编码，这是一种将 Unicode 文本编码为二进制数据的方式。文档的主体包含一个标题（`<h1>`，意为“标题 1”——`<h2>` 到 `<h6>`\
  \ 产生子标题）和两个段落（`<p>`）。\n\n标签有多种形式。一个元素（如主体、段落或链接）由*开始标签*（如 `<p>`）开始，并由*结束标签*（如 `</p>`）结束。某些开始标签（如链接的\
  \ `<a>`）包含额外的信息，形式为 `name=\"value\"` 对。这些被称为*属性*。在这个例子中，链接的目标由 `href=\"http://eloquentjavascript.net\"\
  ` 指示，其中 href 代表“超文本引用”。\n\n某些类型的标签不包含任何内容，因此不需要闭合。元数据标签 `<meta charset=\"utf-8\"\
  >` 就是一个例子。\n\n为了能够在文档文本中包含尖括号，尽管它们在 HTML 中有特殊含义，还需要引入另一种特殊符号形式。一个普通的左尖括号写作 `&lt;`（“小于”），右尖括号写作\
  \ `&gt;`（“大于”）。在 HTML 中，一个 & 符号（`&`）后跟名称或字符代码以及分号（`;`）被称为*实体*，并会被替换为它所编码的字符。\n\n\
  这类似于 JavaScript 字符串中使用反斜杠的方式。由于这种机制也使 & 符号具有特殊含义，因此它们需要被转义为 `&amp;`。在属性值内部（用双引号包裹），可以使用\
  \ `&quot;` 来插入一个实际的引号字符。\n\nHTML 的解析方式具有惊人的容错性。当应该存在的标签缺失时，浏览器会重建它们。这种重建方式已经标准化，你可以信赖所有现代浏览器都会以相同的方式处理。\n\
  \n以下文档将被视为与之前展示的文档相同：\n\n```html\n<!doctype html>\n<meta charset=utf-8>\n<title>我的主页</title>\n\
  <h1>我的主页</h1>\n<p>你好，我是 Marijn，这是我的主页。\n<p>我还写了一本书！请点击\n  <a href=http://eloquentjavascript.net>这里</a>。\n\
  ```\n\n`<html>`、`<head>` 和 `<body>` 标签完全消失了。浏览器知道 `<meta>` 和 `<title>` 属于头部，而 `<h1>`\
  \ 表示主体已开始。此外，我不再显式关闭段落，因为打开新段落或结束文档会隐式关闭它们。属性值周围的引号也消失了。\n\n本书通常会在示例中省略 `<html>`、`<head>`\
  \ 和 `<body>` 标签，以保持简洁且不杂乱。但我*会*闭合标签并在属性周围加上引号。\n\n我通常也会省略文档类型和字符集声明。这不应被理解为鼓励你在\
  \ HTML 文档中省略它们。当你忘记它们时，浏览器常常会做出荒谬的事情。你应该认为示例中隐式包含了文档类型和字符集元数据，即使它们没有在文本中实际显示。\n\n\
  ### HTML 与 JavaScript\n\n\n\n\n\n在本书的语境中，最重要的 HTML 标签是 `<script>`。这个标签允许我们在文档中包含一段\
  \ JavaScript 代码。\n\n```\n<h1>Testing alert</h1>\n<script>alert(\"hello!\");</script>\n\
  ```\n\n当浏览器读取 HTML 时，一旦遇到 `<script>` 标签，这段脚本就会立即运行。打开这个页面时，会弹出一个对话框——`alert` 函数与\
  \ `prompt` 类似，都会弹出一个窗口，但 `alert` 只显示一条消息，不要求输入。\n\n将大型程序直接嵌入 HTML 文档通常不切实际。`<script>`\
  \ 标签可以添加 `src` 属性，用于从 URL 获取脚本文件（包含 JavaScript 程序的文本文件）。\n\n```\n<h1>Testing alert</h1>\n\
  <script src=\"code/hello.js\"></script>\n```\n\n这里包含的 `code/hello.js` 文件包含相同的程序——`alert(\"\
  hello!\")`。当 HTML 页面引用其他 URL 作为自身的一部分时（例如图片文件或脚本），浏览器会立即检索它们并将其包含在页面中。\n\n脚本标签必须始终以\
  \ `</script>` 结束，即使它引用的是脚本文件且不包含任何代码。如果忘记这一点，页面的其余部分将被解释为脚本的一部分。\n\n你可以通过为脚本标签添加\
  \ `type=\"module\"` 属性，在浏览器中加载 ES 模块（参见第 173 页的“ECMAScript 模块”）。这些模块可以依赖其他模块，方法是在\
  \ import 声明中使用相对于自身的 URL 作为模块名称。\n\n某些属性也可以包含 JavaScript 程序。下面展示的 `<button>` 标签（显示为一个按钮）有一个\
  \ `onclick` 属性。每当按钮被点击时，该属性的值就会运行。\n\n```\n<button onclick=\"alert('Boom!');\">DO\
  \ NOT PRESS</button>\n```\n\n注意，我必须在 `onclick` 属性中使用单引号来包裹字符串，因为双引号已经用于包裹整个属性。我也可以使用\
  \ `&quot;`。\n\n### 沙盒中\n\n运行从互联网下载的程序存在潜在危险。你对你访问的大多数网站背后的人了解不多，他们未必心怀善意。运行不怀好意的人编写的程序，可能会导致你的计算机感染病毒、数据被盗、账户被黑。\n\
  \n然而，网络的吸引力在于，你可以在不信任所有访问页面的情况下浏览它。这就是为什么浏览器严格限制 JavaScript 程序能做的事情：它不能查看你计算机上的文件，也不能修改与嵌入它的网页无关的任何内容。\n\
  \n以这种方式隔离编程环境被称为*沙盒化*，其理念是程序在沙盒中无害地玩耍。但你应该想象这种沙盒上面有一个厚钢条制成的笼子，这样在里面玩耍的程序实际上无法逃出。\n\
  \n沙盒化的难点在于，既要给程序足够的空间使其有用，同时又要限制它们做任何危险的事情。许多有用的功能，例如与其他服务器通信或读取剪贴板内容，也可能被用来做有问题的、侵犯隐私的事情。\n\
  \n时不时地，有人会想出新的方法来绕过浏览器的限制并做一些有害的事情，从泄露轻微的私人信息到完全控制浏览器运行的整个机器。浏览器开发者通过修复漏洞来回应，一切又恢复平静——直到下一个问题被发现，并希望被公开，而不是被某个政府机构或黑手党秘密利用。\n\
  \n### 兼容性与浏览器大战\n\n在 Web 早期，一款名为 Mosaic 的浏览器主导了市场。几年后，平衡转向了 Netscape，随后它又被微软的 Internet\
  \ Explorer 大量取代。在任何单一浏览器占据主导地位的时期，该浏览器的供应商都会觉得有权单方面为 Web 发明新功能。由于大多数用户使用最流行的浏览器，网站就会开始使用这些功能——其他浏览器则被忽略。\n\
  \n这是兼容性的黑暗时代，通常被称为*浏览器大战*。Web 开发者面对的并非统一的 Web，而是两三个不兼容的平台。更糟糕的是，2003 年左右使用的浏览器都充满了\
  \ bug，而且每个浏览器的 bug 各不相同。编写网页的人生活艰难。\n\nMozilla Firefox（Netscape 的非营利分支）在 2000 年代末挑战了\
  \ Internet Explorer 的地位。由于微软当时对保持竞争力不太感兴趣，Firefox 从它手中夺走了大量市场份额。大约在同一时间，谷歌推出了 Chrome\
  \ 浏览器，苹果的 Safari 浏览器也获得了 popularity，导致市场上出现了四个主要参与者，而不是一个。\n\n新参与者对标准持有更严肃的态度，并采用了更好的工程实践，从而减少了不兼容性和\
  \ bug。微软看到自己的市场份额崩溃，也转而采用这些态度，推出了取代 Internet Explorer 的 Edge 浏览器。如果你现在开始学习 Web 开发，请认为自己很幸运。主要浏览器的最新版本行为相当统一，且\
  \ bug 相对较少。\n\n“太糟糕了！老一套！等你把房子建好，你才意识到自己无意中学会了在开始之前就应该知道的东西。”\n\n——弗里德里希·尼采，《善恶的彼岸》\n\
  \n![图片](img/f0226-01.jpg)\n\n## 14\n\n文档对象模型\n\n当你在浏览器中打开一个网页时，浏览器会检索该页面的 HTML 文本并解析它，就像我们在第\
  \ 12 章中的解析器解析程序一样。浏览器构建文档结构的模型，并使用该模型在屏幕上绘制页面。\n\n文档的这种表示是 JavaScript 程序在其沙盒中可用的玩具之一。它是一个你可以读取或修改的数据结构。它作为一个*实时*数据结构：当它被修改时，屏幕上的页面会更新以反映变化。\n\
  \n### 文档结构\n\n你可以将 HTML 文档想象为一组嵌套的盒子。像 `<body>` 和 `</body>` 这样的标签包围着其他标签，而这些标签又包含其他标签或文本。以下是上一章的示例文档：\n\
  \n```\n<!doctype html>\n<html>\n  <head>\n    <title>My home page</title>\n</head>\n\
  <body>\n  <h1>My home page</h1>\n  <p>Hello, I am Marijn and this is my home page.</p>\n\
    <p>I also wrote a book! Read it\n     <a href=\"http://eloquentjavascript.net\"\
  >here</a>.</p>\n  </body>\n</html>\n```\n\n该页面具有以下结构：\n\n![图片](img/f0228-01.jpg)\n\
  \n浏览器用来表示文档的数据结构遵循这种形状。对于每个盒子，都有一个对象，我们可以与之交互以找出诸如它代表什么 HTML 标签以及它包含哪些盒子和文本等信息。这种表示被称为*文档对象模型*，简称\
  \ DOM。\n\n全局绑定 `document` 让我们可以访问这些对象。它的 `documentElement` 属性指向代表 `<html>` 标签的对象。由于每个\
  \ HTML 文档都有 head 和 body，因此它也有 `head` 和 `body` 属性，指向这些元素。\n\n### 树\n\n回想一下第 203 页的“解析”中的语法树。它们的结构与浏览器文档的结构惊人地相似。每个*节点*可以引用其他节点（*子节点*），而这些子节点又可能拥有自己的子节点。这种形状是嵌套结构的典型特征，其中元素可以包含与自身相似的子元素。\n\
  \n\n\n\n\n我们称一个数据结构为`树`，当它具有分支结构、没有环（节点不能直接或间接包含自身），并且有一个单一的、明确定义的`根`。在 DOM 中，`document.documentElement`\
  \ 充当根节点。\n\n树在计算机科学中经常出现。除了表示递归结构（如 HTML 文档或程序）之外，它们还常用于维护有序的数据集，因为在树中查找或插入元素通常比在平面数组中更高效。\n\
  \n典型的树有不同类型的节点。Egg 语言的语法树包含标识符、值和应用节点。应用节点可以有子节点，而标识符和值是`叶子`，即没有子节点的节点。\n\nDOM 也是如此。表示\
  \ HTML 标签的`元素`节点决定了文档的结构。这些节点可以有子节点。例如，`document.body` 就是这样一个节点。其中一些子节点可以是叶子节点，比如文本片段或注释节点。\n\
  \n每个 DOM 节点对象都有一个 `nodeType` 属性，其中包含一个标识节点类型的代码（数字）。元素的代码为 1，这也被定义为常量属性 `Node.ELEMENT_NODE`。表示文档中一段文本的文本节点，其代码为\
  \ 3（`Node.TEXT_NODE`）。注释的代码为 8（`Node.COMMENT_NODE`）。\n\n另一种可视化文档树的方式如下：\n\n![Image](img/f0229-01.jpg)\n\
  \n叶子是文本节点，箭头表示节点之间的父子关系。\n\n### 标准\n\n使用晦涩的数字代码来表示节点类型并不是一种很符合 JavaScript 风格的做法。在本章后面，我们会看到\
  \ DOM 接口的其他部分也显得笨拙且陌生。原因是 DOM 并非仅为 JavaScript 设计。相反，它试图成为一种语言无关的接口，也可以用于其他系统——不仅用于\
  \ HTML，还用于 XML，这是一种具有类似 HTML 语法的通用数据格式。\n\n这很不幸。标准通常是有用的。但在这种情况下，其优势（跨语言一致性）并不那么有说服力。拥有一个与你所使用的语言良好集成的接口，比拥有一个跨语言熟悉的接口更能节省时间。\n\
  \n作为这种糟糕集成的一个例子，考虑 DOM 中元素节点的 `childNodes` 属性。这个属性持有一个类数组对象，具有 `length` 属性和按数字标记的属性来访问子节点。但它是\
  \ `NodeList` 类型的实例，而不是真正的数组，因此它没有 `slice` 和 `map` 等方法。\n\n还有一些问题纯粹是设计不佳。例如，没有办法创建一个新节点并立即添加子节点或属性。相反，你必须先创建它，然后通过副作用逐个添加子节点和属性。与\
  \ DOM 频繁交互的代码往往会变得冗长、重复且丑陋。\n\n但这些缺陷并非致命。由于 JavaScript 允许我们创建自己的抽象，因此可以设计出更好的方式来表达正在执行的操作。许多用于浏览器编程的库都提供了这样的工具。\n\
  \n### 遍历树\n\nDOM 节点包含大量指向其他附近节点的链接。下图说明了这些链接：\n\n![Image](img/f0230-01.jpg)\n\n\
  虽然图中只显示了每种类型的一个链接，但每个节点都有一个 `parentNode` 属性，指向它所属的节点（如果有的话）。同样，每个元素节点（节点类型 1）都有一个\
  \ `childNodes` 属性，指向一个包含其子节点的类数组对象。\n\n理论上，你可以仅使用这些父节点和子节点链接在树中任意移动。但 JavaScript\
  \ 还为你提供了许多额外的便捷链接。`firstChild` 和 `lastChild` 属性指向第一个和最后一个子元素，对于没有子节点的节点，其值为 `null`。类似地，`previousSibling`\
  \ 和 `nextSibling` 指向相邻节点，即具有相同父节点且紧邻该节点之前或之后的节点。对于第一个子节点，`previousSibling` 为 `null`；对于最后一个子节点，`nextSibling`\
  \ 为 `null`。\n\n还有一个 `children` 属性，它类似于 `childNodes`，但只包含元素（类型 1）子节点，而不包含其他类型的子节点。当你对文本节点不感兴趣时，这会很有用。\n\
  \n当处理像这样的嵌套数据结构时，递归函数通常很有用。以下函数扫描文档中包含给定字符串的文本节点，并在找到时返回 `true`：\n\n```\nfunction\
  \ talksAbout(node, string) {\n  if (node.nodeType == Node.ELEMENT_NODE) {\n    for\
  \ (let child of node.childNodes) {\n       if (talksAbout(child, string)) {\n  \
  \      return true;\n      }\n    }\n    return false;\n  } else if (node.nodeType\
  \ == Node.TEXT_NODE) {\n    return node.nodeValue.indexOf(string) > -1;\n  }\n}\n\
  \nconsole.log(talksAbout(document.body, \"book\"));\n// → true\n```\n\n文本节点的 `nodeValue`\
  \ 属性保存它所表示的文本字符串。\n\n### 查找元素\n\n在父节点、子节点和兄弟节点之间导航这些链接通常很有用。但如果我们想找到文档中的特定节点，从 `document.body`\
  \ 开始并沿着固定的属性路径到达它并不是一个好主意。这样做会将关于文档精确结构的假设硬编码到程序中——而你可能以后会更改这种结构。另一个复杂因素是，即使节点之间的空白也会创建文本节点。示例文档的\
  \ `<body>` 标签不仅仅有三个子节点（`<h1>` 和两个 `<p>` 元素），实际上有七个：这三个，加上它们之前、之后和之间的空格。\n\n因此，如果我们想获取该文档中链接的\
  \ `href` 属性，我们不想说“获取文档 body 的第六个子节点的第二个子节点”。更好的方式是“获取文档中的第一个链接”。而我们可以做到。\n\n```\n\
  let link = document.body.getElementsByTagName(\"a\")[0];\nconsole.log(link.href);\n\
  ```\n\n所有元素节点都有一个 `getElementsByTagName` 方法，它会收集该节点后代（直接或间接子节点）中所有具有给定标签名的元素，并将它们作为类数组对象返回。\n\
  \n要查找特定的单个节点，你可以为其赋予一个 `id` 属性，然后使用 `document.getElementById`。\n\n```\n<p>My ostrich\
  \ Gertrude:</p>\n<p><img id=\"gertrude\" src=\"img/ostrich.png\"></p>\n<script>\n\
  \  let ostrich = document.getElementById(\"gertrude\");\n  console.log(ostrich.src);\n\
  </script>\n```\n\n第三种类似的方法是 `getElementsByClassName`，它与 `getElementsByTagName` 类似，会搜索元素节点的内容，并检索所有在其\
  \ `class` 属性中包含给定字符串的元素。\n\n### 修改文档\n\nDOM 数据结构几乎所有的内容都可以更改。文档树的形状可以通过改变父子关系来修改。节点有一个\
  \ `remove` 方法，用于将其从当前父节点中移除。要向元素节点添加子节点，我们可以使用 `appendChild`，它会将子节点放在子节点列表的末尾，或者使用\
  \ `insertBefore`，它会将第一个参数指定的节点插入到第二个参数指定的节点之前。\n\n```\n<p>One</p>\n<p>Two</p>\n\
  <p>Three</p>\n<script>\n  let paragraphs = document.body.getElementsByTagName(\"\
  p\");\n  document.body.insertBefore(paragraphs[2], paragraphs[0]);\n</script>\n\
  ```\n\n一个节点在文档中只能存在于一个位置。因此，将段落 *Three* 插入到段落 *One* 之前，会先将其从文档末尾移除，然后插入到开头，结果顺序为\
  \ *Three*/*One*/*Two*。所有将节点插入某处的操作，都会作为副作用导致该节点从其当前位置（如果有的话）被移除。\n\n\n\n\n`replaceChild`\
  \ 方法用于将一个子节点替换为另一个节点。它接受两个节点作为参数：一个新节点和要被替换的节点。被替换的节点必须是调用该方法的元素的子节点。请注意，`replaceChild`\
  \ 和 `insertBefore` 都将*新*节点作为它们的第一个参数。\n\n### 创建节点\n\n假设我们要编写一个脚本，将文档中的所有图像（`<img>`\
  \ 标签）替换为其 `alt` 属性中的文本，该属性指定了图像的替代文本表示。\n\n这不仅涉及移除图像，还需要添加一个新的文本节点来替换它们。文本节点通过 `document.createTextNode`\
  \ 方法创建。\n\n```\n<p>The <img src=\"img/cat.png\" alt=\"Cat\"> in the\n\n  <img src=\"\
  img/hat.png\" alt=\"Hat\">.</p>\n\n<p><button onclick=\"replaceImages()\">Replace</button></p>\n\
  \n<script>\n\n  function replaceImages() {\n\n    let images = document.body.getElementsByTagName(\"\
  img\");\n\n    for (let i = images.length - 1; i >= 0; i--) {\n\n      let image\
  \ = images[i];\n\n      if (image.alt) {\n\n         let text = document.createTextNode(image.alt);\n\
  \n         image.parentNode.replaceChild(text, image);\n\n      }\n\n    }\n\n  }\n\
  \n</script>\n```\n\n给定一个字符串，`createTextNode` 会返回一个文本节点，我们可以将其插入文档中，使其显示在屏幕上。\n\n\
  遍历图像的循环从列表末尾开始。这是必要的，因为 `getElementsByTagName`（或像 `childNodes` 这样的属性）返回的节点列表是*实时的*。也就是说，它会随着文档的变化而更新。如果我们从前面开始，移除第一个图像会导致列表失去第一个元素，这样当循环第二次重复时，`i`\
  \ 为 1，但由于集合的长度现在也变成了 1，循环就会停止。\n\n如果你想要一个*静态的*节点集合，而不是实时的，可以通过调用 `Array.from` 将集合转换为真正的数组。\n\
  \n```\nlet arrayish = {0: \"one\", 1: \"two\", length: 2};\n\nlet array = Array.from(arrayish);\n\
  \nconsole.log(array.map(s => s.toUpperCase()));\n\n// → [\"ONE\", \"TWO\"]\n```\n\
  \n要创建元素节点，可以使用 `document.createElement` 方法。该方法接受一个标签名，并返回一个给定类型的新空节点。\n\n下面的示例定义了一个工具函数\
  \ `elt`，它创建一个元素节点，并将其余参数视为该节点的子节点。然后使用该函数为一段引用添加署名。\n\n```\n<blockquote id=\"quote\"\
  >\n\n  No book can ever be finished. While working on it we learn\n\n  just enough\
  \ to find it immature the moment we turn away\n\n  from it.\n\n</blockquote>\n\n\
  <script>\n\n  function elt(type, ...children) {\n\n    let node = document.createElement(type);\n\
  \n    for (let child of children) {\n\n      if (typeof child != \"string\") node.appendChild(child);\n\
  \n      else node.appendChild(document.createTextNode(child));\n\n    }\n\n    return\
  \ node;\n\n  }\n\n  document.getElementById(\"quote\").appendChild(\n\n    elt(\"\
  footer\", \"--\",\n\n        elt(\"strong\", \"Karl Popper\"),\n\n        \", preface\
  \ to the second edition of \",\n\n        elt(\"em\", \"The Open Society and Its\
  \ Enemies\"),\n\n        \", 1950\"));\n\n</script>\n```\n\n最终文档看起来像这样：\n\n没有一本书是能够真正完成的。在写作过程中，我们学到的刚好足以让我们在放下它的那一刻发现它的不成熟。\n\
  \n——**卡尔·波普尔**，《开放社会及其敌人》第二版序言，1950 年\n\n### 属性\n\n某些元素属性，例如链接的 `href`，可以通过元素 DOM\
  \ 对象上同名的属性来访问。大多数常用的标准属性都是如此。\n\n但 HTML 允许你在节点上设置任何你想要的属性。这很有用，因为它允许你在文档中存储额外信息。不过，如果你自己定义属性名，这些属性不会作为元素节点的属性存在。相反，你必须使用\
  \ `getAttribute` 和 `setAttribute` 方法来处理它们。\n\n```\n<p data-classified=\"secret\"\
  >The launch code is 00000000.</p>\n\n<p data-classified=\"unclassified\">I have\
  \ two feet.</p>\n\n<script>\n\n  let paras = document.body.getElementsByTagName(\"\
  p\");\n\n  for (let para of Array.from(paras)) {\n\n    if (para.getAttribute(\"\
  data-classified\") == \"secret\") {\n\n      para.remove();\n\n    }\n\n  }\n\n\
  </script>\n```\n\n建议将这类自定义属性的名称加上 `data-` 前缀，以确保它们不会与其他属性冲突。\n\n有一个常用的属性 `class`，它是\
  \ JavaScript 语言中的关键字。由于历史原因——一些旧的 JavaScript 实现无法处理与关键字匹配的属性名——用于访问该属性的属性名是 `className`。你也可以通过\
  \ `getAttribute` 和 `setAttribute` 方法使用其真实名称 `\"class\"` 来访问它。\n\n### 布局\n\n你可能已经注意到，不同类型的元素布局方式不同。有些元素，如段落（`<p>`）或标题（`<h1>`），占据文档的整个宽度，并显示在单独的行上。这些被称为*块级*元素。其他元素，如链接（`<a>`）或\
  \ `<strong>` 元素，则与周围的文本显示在同一行上。这类元素被称为*内联*元素。\n\n对于任何给定的文档，浏览器能够计算出一个布局，根据元素的类型和内容为每个元素赋予大小和位置。然后使用这个布局来实际绘制文档。\n\
  \n元素的大小和位置可以从 JavaScript 中获取。`offsetWidth` 和 `offsetHeight` 属性给出了元素占据的空间，单位为*像素*。像素是浏览器中的基本度量单位。传统上，它对应于屏幕能绘制的最小点，但在现代显示器上，可以绘制*非常*小的点，情况可能不再如此，一个浏览器像素可能跨越多个显示点。\n\
  \n类似地，`clientWidth` 和 `clientHeight` 给出了元素*内部*空间的大小，忽略边框宽度。\n\n```\n<p style=\"\
  border: 3px solid red\">\n\n  I'm boxed in\n\n</p>\n\n<script>\n\n  let para = document.body.getElementsByTagName(\"\
  p\")[0];\n\n  console.log(\"clientHeight:\", para.clientHeight);\n\n  console.log(\"\
  offsetHeight:\", para.offsetHeight);\n\n</script>\n```\n\n给段落添加边框会在其周围绘制一个矩形。\n\n\
  ![Image](img/f0236-01.jpg)\n\n查找元素在屏幕上精确位置的最有效方法是使用 `getBoundingClientRect` 方法。它返回一个包含\
  \ `top`、`bottom`、`left` 和 `right` 属性的对象，表示元素各边相对于屏幕左上角的像素位置。如果你希望它们相对于整个文档，则必须加上当前的滚动位置，你可以在\
  \ `pageXOffset` 和 `pageYOffset` 绑定中找到它。\n\n布局文档可能是一项相当繁重的工作。为了速度，浏览器引擎不会在每次更改文档时立即重新布局，而是尽可能等待。当修改了文档的\
  \ JavaScript 程序运行完毕后，浏览器必须计算新的布局，以便将更改后的文档绘制到屏幕上。当程序通过读取诸如 `offsetHeight` 之类的属性或调用\
  \ `getBoundingClientRect` 来*询问*某个元素的位置或大小时，提供正确信息也需要计算布局。\n\n一个反复交替读取 DOM 布局信息和更改\
  \ DOM 的程序会导致大量布局计算，从而运行得非常缓慢。以下代码就是一个例子。它包含两个不同的程序，分别构建一行宽度为 2000 像素的 *X* 字符，并测量每个程序所花费的时间。\n\
  \n```\n<p><span id=\"one\"></span></p>\n\n<p><span id=\"two\"></span></p>\n\n<script>\n\
  \n  function time(name, action) {\n\n    let start = Date.now(); // Current time\
  \ in milliseconds\n\n    action();\n\n    console.log(name, \"took\", Date.now()\
  \ - start, \"ms\");\n\n  }\n\n    time(\"naive\", () => {\n\n      let target =\
  \ document.getElementById(\"one\");\n\n      while (target.offsetWidth < 2000) {\n\
  ```\n\n\n\n\n```\n        target.appendChild(document.createTextNode(\"X\"));\n\n\
  \      }\n\n    });\n\n    // → naive took 32 ms\n\n    time(\"clever\", function()\
  \ {\n\n      let target = document.getElementById(\"two\");\n\n      target.appendChild(document.createTextNode(\"\
  XXXXX\"));\n\n      let total = Math.ceil(2000 / (target.offsetWidth / 5));\n\n\
  \      target.firstChild.nodeValue = \"X\".repeat(total);\n\n   });\n\n   // → clever\
  \ took 1 ms\n\n</script>\n```\n\n### 样式\n\n我们已经看到不同的 HTML 元素有不同的绘制方式。有些以块状显示，有些以内联方式显示。有些添加了样式——`<strong>`\
  \ 使其内容加粗，`<a>` 使其变蓝并加下划线。\n\n`<img>` 标签显示图像的方式，或者 `<a>` 标签在点击时触发链接跳转的方式，都与元素类型紧密相关。但我们可以更改与元素关联的样式，例如文本颜色或下划线。下面是一个使用\
  \ `style` 属性的示例：\n\n```\n<p><a href=\".\">普通链接</a></p>\n\n<p><a href=\".\" style=\"\
  color: green\">绿色链接</a></p>\n```\n\n第二个链接将显示为绿色，而不是默认的链接颜色。\n\n![图片](img/f0236-02.jpg)\n\
  \n一个 `style` 属性可以包含一个或多个*声明*，每个声明由一个属性（如 `color`）后跟冒号和值（如 `green`）组成。当有多个声明时，必须用分号分隔，例如\
  \ `\"color: red; border: none\"`。\n\n文档的许多方面都可以通过样式来影响。例如，`display` 属性控制元素是显示为块级元素还是内联元素。\n\
  \n```\n这段文本显示为 <strong>内联</strong>，\n\n<strong style=\"display: block\">块级</strong>，以及\n\
  \n<strong style=\"display: none\">完全不显示</strong>。\n```\n\n块级标签会单独占据一行，因为块级元素不会与周围的文本内联显示。最后一个标签完全不显示——`display:\
  \ none` 阻止元素在屏幕上显示。这是一种隐藏元素的方式。它通常比完全从文档中移除元素更可取，因为这样以后可以轻松地再次显示它们。\n\n![图片](img/f0238-01.jpg)\n\
  \nJavaScript 代码可以通过元素的 `style` 属性直接操作元素的样式。该属性包含一个对象，该对象拥有所有可能的样式属性。这些属性的值是字符串，我们可以通过写入这些字符串来更改元素样式的特定方面。\n\
  \n```\n<p id=\"para\" style=\"color: purple\">\n\n  漂亮的文本\n\n</p>\n\n<script>\n\n\
    let para = document.getElementById(\"para\");\n\n  console.log(para.style.color);\n\
  \n  para.style.color = \"magenta\";\n\n</script>\n```\n\n有些样式属性名包含连字符，例如 `font-family`。由于在\
  \ JavaScript 中处理这样的属性名比较麻烦（你必须写成 `style[\"font-family\"]`），因此 `style` 对象中这些属性的属性名会去掉连字符，并将连字符后的字母大写（`style.fontFamily`）。\n\
  \n### 层叠样式\n\nHTML 的样式系统称为 CSS，即*层叠样式表*。*样式表*是一组规则，用于定义文档中元素的样式。它可以放在 `<style>`\
  \ 标签内。\n\n```\n<style>\n\n  strong {\n\n    font-style: italic;\n\n    color: gray;\n\
  \n  }\n\n</style>\n\n<p>现在 <strong>加粗文本</strong> 变为斜体且灰色。</p>\n```\n\n名称中的*层叠*指的是多个这样的规则组合起来，为元素生成最终样式。在示例中，`<strong>`\
  \ 标签的默认样式（赋予 `font-weight: bold`）被 `<style>` 标签中的规则覆盖，该规则添加了 `font-style` 和 `color`。\n\
  \n当多个规则为同一属性定义值时，最近读取的规则具有更高优先级并胜出。因此，如果 `<style>` 标签中的规则包含 `font-weight: normal`，与默认的\
  \ `font-weight` 规则冲突，那么文本将显示为正常，*而不是*加粗。直接应用于节点的 `style` 属性中的样式具有最高优先级，并且总是胜出。\n\
  \n在 CSS 规则中，可以针对标签名以外的目标。针对 `.abc` 的规则适用于所有 `class` 属性中包含 `\"abc\"` 的元素。针对 `#xyz`\
  \ 的规则适用于 `id` 属性为 `\"xyz\"` 的元素（该属性在文档中应唯一）。\n\n```\n.subtle {\n\n  color: gray;\n\
  \n  font-size: 80%;\n\n}\n\n#header {\n\n  background: blue;\n\n  color: white;\n\
  \n}\n\n/* 具有 id main 且类为 a 和 b 的 p 元素 */\n\np#main.a.b {\n\n  margin-bottom: 20px;\n\
  \n}\n```\n\n优先选择最近定义规则的规则仅适用于这些规则具有相同*特异性*的情况。规则的特异性是衡量它描述匹配元素的精确程度的指标，由它要求的元素方面的数量和种类（标签、类或\
  \ ID）决定。例如，针对 `p.a` 的规则比针对 `p` 或仅针对 `.a` 的规则更具体，因此会优先于它们。\n\n符号 `p > a {...}` 将给定样式应用于所有直接作为\
  \ `<p>` 标签子元素的 `<a>` 标签。类似地，`p a {...}` 应用于所有位于 `<p>` 标签内部的 `<a>` 标签，无论它们是直接子元素还是间接子元素。\n\
  \n### 查询选择器\n\n本书中我们不会大量使用样式表。在浏览器编程时理解它们很有帮助，但它们足够复杂，值得单独写一本书。\n\n我介绍*选择器*语法（样式表中用于确定一组样式应用于哪些元素的表示法）的主要原因，是我们可以使用这种相同的迷你语言作为查找\
  \ DOM 元素的有效方式。\n\n`querySelectorAll` 方法定义在 `document` 对象和元素节点上，它接受一个选择器字符串，并返回一个包含所有匹配元素的\
  \ `NodeList`。\n\n```\n<p>如果你追逐\n\n   <span class=\"animal\">兔子</span></p>\n\n<p>你知道你会跌倒</p>\n\
  \n<p>告诉他们一个 <span class=\"character\">抽水烟的\n\n   <span class=\"animal\">毛毛虫</span></span></p>\n\
  \n<p>给了你召唤</p>\n\n<script>\n\n  function count(selector) {\n\n    return document.querySelectorAll(selector).length;\n\
  \n  }\n\n  console.log(count(\"p\"));           // 所有 <p> 元素\n\n  // → 4\n\n  console.log(count(\"\
  .animal\"));     // 类 animal\n\n  // → 2\n\n  console.log(count(\"p .animal\"));\
  \ // <p> 内部的 animal\n\n  // → 2\n\n  console.log(count(\"p > .animal\")); // <p>\
  \ 的直接子元素 animal\n\n  // → 1\n\n</script>\n```\n\n与 `getElementsByTagName` 等方法不同，`querySelectorAll`\
  \ 返回的对象*不是*实时的。当你更改文档时，它不会改变。不过它仍然不是真正的数组，因此如果你想将其视为数组，仍然需要调用 `Array.from`。\n\n\
  `querySelector` 方法（不带 All 部分）的工作方式类似。当你想要一个特定的单个元素时，这个方法很有用。它只返回第一个匹配的元素，如果没有元素匹配则返回\
  \ `null`。\n\n### 定位与动画\n\n`position` 样式属性对布局有强大的影响。默认情况下，它的值为 `static`，意味着元素位于文档中的正常位置。当设置为\
  \ `relative` 时，元素仍然占据文档中的空间，但现在可以使用 `top` 和 `left` 样式属性将其相对于正常位置移动。当 `position`\
  \ 设置为 `absolute` 时，元素会从正常的文档流中移除——也就是说，它不再占据空间，并且可能与其他元素重叠。此外，它的 `top` 和 `left`\
  \ 属性可用于将其绝对定位到最近的、`position` 属性不为 `static` 的父元素的左上角，或者如果没有这样的父元素，则相对于文档定位。\n\n我们可以利用这一点来创建动画。以下文档显示了一张猫的图片，它沿着椭圆轨迹移动：\n\
  \n```\n<p style=\"text-align: center\">\n\n  <img src=\"img/cat.png\" style=\"position:\
  \ relative\">\n\n</p>\n\n<script>\n\n  let cat = document.querySelector(\"img\"\
  );\n\n  let angle = Math.PI / 2;\n\n  function animate(time, lastTime) {\n\n    if\
  \ (lastTime != null) {\n\n      angle += (time - lastTime) * 0.001;\n\n    }\n\n\
      cat.style.top = (Math.sin(angle) * 20) + \"px\";\n```\n\n\n\n\n\n```\n    cat.style.left\
  \ = (Math.cos(angle) * 200) + \"px\";\n\n    requestAnimationFrame(newTime => animate(newTime,\
  \ time));\n\n  }\n\n  requestAnimationFrame(animate);\n\n</script>\n```\n\n灰色箭头显示了图像移动的路径。\n\
  \n![Image](img/f0241-01.jpg)\n\n我们的图片在页面上居中，并设置了相对定位。我们将反复更新该图片的 `top` 和 `left`\
  \ 样式来移动它。\n\n脚本使用 `requestAnimationFrame` 来调度 `animate` 函数，使其在浏览器准备好重绘屏幕时运行。`animate`\
  \ 函数本身再次调用 `requestAnimationFrame` 来安排下一次更新。当浏览器窗口（或标签页）处于活动状态时，这将导致更新以大约每秒 60 次的频率发生，从而产生美观的动画效果。\n\
  \n如果我们只是在一个循环中更新 DOM，页面将会冻结，屏幕上什么也不会显示。浏览器在 JavaScript 程序运行时不会更新显示，也不允许与页面进行任何交互。这就是为什么我们需要\
  \ `requestAnimationFrame`——它让浏览器知道我们暂时完成了，浏览器可以继续执行它该做的事情，比如更新屏幕和响应用户操作。\n\n动画函数接收当前时间作为参数。为了确保猫每毫秒的运动是稳定的，它根据当前时间与函数上次运行时间之间的差值来决定\
  \ `angle` 变化的速度。如果它只是每步将 `angle` 移动一个固定量，那么当同一台计算机上运行的其他繁重任务导致函数暂停一小段时间时，运动就会卡顿。\n\
  \n圆周运动是通过三角函数 `Math.cos` 和 `Math.sin` 实现的。对于那些不熟悉这些函数的人，我将简要介绍一下，因为我们在本书中会偶尔用到它们。\n\
  \n`Math.cos` 和 `Math.sin` 对于寻找位于以点 (0,0) 为圆心、半径为 1 的圆上的点非常有用。这两个函数都将它们的参数解释为圆上的位置，其中\
  \ 0 表示圆的最右侧点，顺时针方向移动，直到 2*π*（约 6.28）绕完整圆一周。`Math.cos` 返回与给定位置对应的点的 x 坐标，`Math.sin`\
  \ 返回 y 坐标。大于 2*π* 或小于 0 的位置（或角度）也是有效的——旋转会重复，因此 `a` + 2*π* 与 `a` 表示相同的角度。\n\n这种测量角度的单位称为弧度——一个完整的圆是\
  \ 2*π* 弧度，类似于用度数测量时是 360 度。常数 *π* 在 JavaScript 中可用作 `Math.PI`。\n\n![Image](img/f0242-01.jpg)\n\
  \n猫动画代码维护一个计数器 `angle`，用于记录动画的当前角度，并在每次调用 `animate` 函数时递增它。然后它可以使用这个 `angle` 来计算图像元素的当前位置。`top`\
  \ 样式通过 `Math.sin` 计算并乘以 20，这是椭圆垂直方向的半径。`left` 样式基于 `Math.cos` 并乘以 200，这样椭圆在水平方向上比垂直方向上宽得多。\n\
  \n请注意，样式通常需要*单位*。在这种情况下，我们必须在数字后面加上 \"px\"，以告诉浏览器我们是以像素为单位计数的（而不是厘米、\"em\" 或其他单位）。这一点很容易忘记。使用不带单位的数字会导致样式被忽略——除非数字是\
  \ 0，因为 0 无论单位如何都表示相同的意思。\n\n### 小结\n\nJavaScript 程序可以通过一种称为 DOM 的数据结构来检查和干预浏览器显示的文档。这种数据结构代表了浏览器对文档的模型，JavaScript\
  \ 程序可以修改它以改变可见的文档。\n\nDOM 的组织形式类似于树，元素根据文档的结构按层次排列。表示元素的对象具有诸如 `parentNode` 和 `childNodes`\
  \ 之类的属性，可用于遍历这棵树。\n\n文档的显示方式可以通过*样式*来影响，既可以直接为节点附加样式，也可以定义匹配特定节点的规则。有许多不同的样式属性，例如\
  \ color 或 display。JavaScript 代码可以通过元素的 `style` 属性直接操作其样式。\n\n### 练习\n\n#### *构建一个表格*\n\
  \nHTML 表格由以下标签结构构建：\n\n```\n<table>\n\n  <tr>\n\n    <th>name</th>\n\n    <th>height</th>\n\
  \n    <th>place</th>\n\n  </tr>\n\n  <tr>\n\n    <td>Kilimanjaro</td>\n\n    <td>5895</td>\n\
  \n    <td>Tanzania</td>\n\n  </tr>\n\n</table>\n```\n\n对于每一*行*，`<table>` 标签包含一个\
  \ `<tr>` 标签。在这些 `<tr>` 标签内部，我们可以放置单元格元素：要么是标题单元格（`<th>`），要么是普通单元格（`<td>`）。\n\n给定一个山脉数据集，即一个包含\
  \ name、height 和 place 属性的对象数组，生成一个枚举这些对象的表格的 DOM 结构。它应该每个键一列，每个对象一行，外加一个顶部带有 `<th>`\
  \ 元素的标题行，列出列名。\n\n编写代码，使得列自动从对象中派生，即取数据中第一个对象的属性名。\n\n将生成的表格添加到 id 属性为 \"mountains\"\
  \ 的元素中，使其在文档中可见。\n\n完成此操作后，将包含数值的单元格右对齐，方法是将其 `style.textAlign` 属性设置为 \"right\"\
  。\n\n#### *按标签名查找元素*\n\n`document.getElementsByTagName` 方法返回所有具有给定标签名的子元素。请实现你自己的版本，作为一个函数，该函数接受一个节点和一个字符串（标签名）作为参数，并返回一个包含所有具有给定标签名的后代元素节点的数组。\n\
  \n要查找元素的标签名，请使用其 `nodeName` 属性。但请注意，这将返回全大写的标签名。使用 `toLowerCase` 或 `toUpperCase`\
  \ 字符串方法来补偿这一点。\n\n#### *猫的帽子*\n\n扩展第 240 页 “定位与动画” 中定义的猫动画，使猫和它的帽子（`<img src=\"\
  img/hat.png\">`）在椭圆的两侧相对轨道上运行。\n\n或者让帽子围绕猫旋转。或者以其他有趣的方式改变动画。\n\n为了更容易地定位多个对象，最好切换到绝对定位。这意味着\
  \ `top` 和 `left` 是相对于文档左上角计算的。为了避免使用负坐标（这会导致图像移出可见页面），你可以向位置值添加一个固定的像素数。\n\n“你拥有掌控自己思想的力量——而非外界事件。认识到这一点，你将找到力量。”\n\
  \n—— 马可·奥勒留，《沉思录》\n\n![Image](img/f0246-01.jpg)\n\n## 15 事件处理\n\n有些程序需要处理直接的用户输入，例如鼠标和键盘操作。这类输入并非以组织良好的数据结构形式提供——它是实时、逐条到达的，程序需要即时响应。\n\
  \n### 事件处理器\n\n想象一个界面，其中判断键盘上某个键是否被按下的唯一方法是读取该键的当前状态。为了能够对按键做出反应，你必须不断读取键的状态，以便在它被释放之前捕捉到它。执行其他耗时计算会很危险，因为你可能会错过一次按键。\n\
  \n一些原始机器确实以这种方式处理输入。比这更高级的做法是让硬件或操作系统注意到按键并将其放入队列中。然后程序可以定期检查队列中的新事件并对其做出反应。\n\n\
  \n\n\n当然，它必须记得查看队列，并且要经常这样做，因为从按键按下到程序注意到事件之间的任何时间都会让软件感觉反应迟钝。这种方法被称为*轮询*。大多数程序员都倾向于避免使用它。\n\
  \n更好的机制是让系统在事件发生时主动通知我们的代码。浏览器通过允许我们注册函数作为特定事件的*处理程序*来实现这一点。\n\n点击此文档以激活处理程序。\n\n\
  ```\nwindow.addEventListener(\"click\", () => {\n  console.log(\"You knocked?\"\
  );\n});\n```\n\n`window` 绑定指向浏览器提供的一个内置对象。它代表包含文档的浏览器窗口。调用其 `addEventListener` 方法会注册第二个参数，以便在第一个参数描述的事件发生时调用它。\n\
  \n### 事件与 DOM 节点\n\n每个浏览器事件处理程序都在一个上下文中注册。在前面的示例中，我们在 `window` 对象上调用了 `addEventListener`，以便为整个窗口注册一个处理程序。这种方法同样适用于\
  \ DOM 元素和其他一些类型的对象。事件监听器仅在事件发生在它们所注册的对象的上下文中时才会被调用。\n\n<button>点击我</button>\n\n\
  <p>这里没有处理程序。</p>\n\n```\nlet button = document.querySelector(\"button\");\nbutton.addEventListener(\"\
  click\", () => {\n  console.log(\"Button clicked.\");\n});\n```\n\n该示例将一个处理程序附加到按钮节点上。点击按钮会触发该处理程序，但点击文档的其他部分则不会。给节点添加一个\
  \ `onclick` 属性也有类似的效果。这对大多数类型的事件都适用——你可以通过属性名（事件名前加上 `on`）来附加处理程序。\n\n但一个节点只能有一个\
  \ `onclick` 属性，因此通过这种方式每个节点只能注册一个处理程序。而 `addEventListener` 方法允许你添加任意数量的处理程序，因此即使元素上已有其他处理程序，添加新的处理程序也是安全的。\n\
  \n`removeEventListener` 方法，其参数与 `addEventListener` 类似，用于移除处理程序。\n\n<button>只触发一次的按钮</button>\n\
  \n```\nlet button = document.querySelector(\"button\");\nfunction once() {\n  console.log(\"\
  Done.\");\n  button.removeEventListener(\"click\", once);\n}\nbutton.addEventListener(\"\
  click\", once);\n```\n\n传递给 `removeEventListener` 的函数必须与之前传递给 `addEventListener`\
  \ 的函数是同一个函数值。因此，要注销一个处理程序，你需要给该函数一个名字（示例中的 `once`），以便能够将同一个函数值传递给这两个方法。\n\n### 事件对象\n\
  \n尽管我们之前忽略了它，但事件处理函数会接收一个参数：*事件对象*。该对象包含关于事件的额外信息。例如，如果我们想知道*哪个*鼠标按钮被按下，可以查看事件对象的\
  \ `button` 属性。\n\n<button>用任何方式点击我</button>\n\n```\nlet button = document.querySelector(\"\
  button\");\nbutton.addEventListener(\"mousedown\", event => {\n  if (event.button\
  \ == 0) {\n    console.log(\"Left button\");\n  } else if (event.button == 1) {\n\
  \    console.log(\"Middle button\");\n  } else if (event.button == 2) {\n    console.log(\"\
  Right button\");\n  }\n});\n```\n\n事件对象中存储的信息因事件类型而异。我们将在本章后面讨论不同类型的事件。对象的 `type`\
  \ 属性始终包含一个标识事件的字符串（例如 `\"click\"` 或 `\"mousedown\"`）。\n\n### 传播\n\n对于大多数事件类型，注册在包含子节点的节点上的处理程序也会接收到发生在子节点上的事件。如果点击段落内的一个按钮，段落上的事件处理程序也会看到该点击事件。\n\
  \n但如果段落和按钮都有处理程序，那么更具体的处理程序（即按钮上的处理程序）会先执行。事件会向外*传播*，从它发生的节点到该节点的父节点，一直传播到文档的根节点。最后，在特定节点上注册的所有处理程序都执行完毕后，注册在整个窗口上的处理程序才有机会响应事件。\n\
  \n在任何时候，事件处理程序都可以调用事件对象的 `stopPropagation` 方法来阻止更上层的处理程序接收该事件。例如，当你有一个按钮位于另一个可点击元素内部，并且不希望点击按钮时激活外部元素的点击行为时，这会很有用。\n\
  \n下面的示例在一个按钮及其周围的段落上都注册了 `\"mousedown\"` 处理程序。当用鼠标右键点击时，按钮的处理程序会调用 `stopPropagation`，从而阻止段落上的处理程序运行。当用其他鼠标按钮点击按钮时，两个处理程序都会运行。\n\
  \n<p>一个包含<button>按钮</button>的段落。</p>\n\n```\nlet para = document.querySelector(\"\
  p\");\nlet button = document.querySelector(\"button\");\npara.addEventListener(\"\
  mousedown\", () => {\n  console.log(\"Handler for paragraph.\");\n});\nbutton.addEventListener(\"\
  mousedown\", event => {\n  console.log(\"Handler for button.\");\n  if (event.button\
  \ == 2) event.stopPropagation();\n});\n```\n\n大多数事件对象都有一个 `target` 属性，指向事件起源的节点。你可以使用这个属性来确保不会意外处理从你不希望处理的节点传播上来的事件。\n\
  \n也可以利用 `target` 属性来为特定类型的事件撒下一张大网。例如，如果你有一个包含一长串按钮的节点，那么在外层节点上注册一个点击处理程序，并通过 `target`\
  \ 属性来判断是否点击了按钮，可能比在所有按钮上分别注册处理程序更方便。\n\n<button>A</button>\n<button>B</button>\n\
  <button>C</button>\n\n```\ndocument.body.addEventListener(\"click\", event => {\n\
  \  if (event.target.nodeName == \"BUTTON\") {\n    console.log(\"Clicked\", event.target.textContent);\n\
  \  }\n});\n```\n\n### 默认行为\n\n许多事件都有与之关联的默认行为。如果你点击一个链接，你会被带到链接的目标地址。如果你按下向下箭头，浏览器会向下滚动页面。如果你右键点击，会出现一个上下文菜单。等等。\n\
  \n对于大多数类型的事件，JavaScript 事件处理程序会在默认行为发生*之前*被调用。如果处理程序不希望发生这种正常行为（通常是因为它已经处理了该事件），它可以调用事件对象的\
  \ `preventDefault` 方法。\n\n这可以用来实现你自己的键盘快捷键或上下文菜单。也可以用来令人讨厌地干扰用户期望的行为。例如，下面是一个无法被点击的链接：\n\
  \n<a href=\"https://developer.mozilla.org/\">MDN</a>\n\n```\nlet link = document.querySelector(\"\
  a\");\nlink.addEventListener(\"click\", event => {\n  console.log(\"Nope.\");\n\
  \  event.preventDefault();\n});\n```\n\n除非你有非常充分的理由，否则尽量不要做这种事情。当预期的行为被破坏时，使用你页面的人会感到不愉快。\n\
  \n根据浏览器的不同，有些事件根本无法被拦截。例如，在 Chrome 上，关闭当前标签页的键盘快捷键（CTRL-W 或 COMMAND-W）无法被 JavaScript\
  \ 处理。\n\n### 键盘事件\n\n当键盘上的一个键被按下时，浏览器会触发一个 `\"keydown\"` 事件。当它被释放时，你会得到一个 `\"keyup\"\
  ` 事件。\n\n<p>当你按住 V 键时，此页面会变成紫色。</p>\n\n```\nwindow.addEventListener(\"keydown\"\
  , event => {\n  if (event.key == \"v\") {\n    document.body.style.background =\
  \ \"violet\";\n  }\n});\nwindow.addEventListener(\"keyup\", event => {\n  if (event.key\
  \ == \"v\") {\n    // (不完整)\n  }\n});\n```\n\n\n\n\n`document.body.style.background\
  \ = \"\";`\n\n```\n    }\n\n  });\n\n</script>\n```\n\n尽管名为 `\"keydown\"`，但该事件不仅在按键被物理按下时触发。当按键被按住不放时，事件会在每次按键*重复*时再次触发。有时你需要对此保持警惕。例如，如果你在按键按下时向\
  \ DOM 添加一个按钮，并在按键释放时将其移除，那么当按键被长时间按住时，你可能会意外地添加数百个按钮。\n\n该示例查看了事件对象的 `key` 属性，以确定事件涉及哪个按键。该属性包含一个字符串，对于大多数按键，该字符串对应于按下该键时输入的内容。对于特殊按键（如\
  \ ENTER），它包含一个命名该键的字符串（本例中为 `\"Enter\"`）。如果在按下按键的同时按住 SHIFT，这也会影响键的名称——`\"v\"` 变成\
  \ `\"V\"`，`\"1\"` 可能变成 `\"!\"`，前提是按下 SHIFT-1 在你的键盘上产生这样的结果。\n\n修饰键（如 SHIFT、CTRL、ALT\
  \ 和 meta（Mac 上的 COMMAND））会像普通键一样生成按键事件。但在查找组合键时，你也可以通过查看键盘和鼠标事件的 `shiftKey`、`ctrlKey`、`altKey`\
  \ 和 `metaKey` 属性来判断这些键是否被按住。\n\n<p>按 Control-Space 继续。</p>\n\n```\n<script>\n\n\
  \  window.addEventListener(\"keydown\", event => {\n\n    if (event.key == \" \"\
  \ && event.ctrlKey) {\n\n      console.log(\"Continuing!\");\n\n    }\n\n  });\n\
  \n</script>\n```\n\n按键事件起源的 DOM 节点取决于按键按下时拥有焦点的元素。大多数节点无法获得焦点，除非你为它们指定 `tabindex`\
  \ 属性，但链接、按钮和表单字段等元素可以。我们将在第 18 章中回到表单字段。当没有特定元素获得焦点时，`document.body` 将作为按键事件的目标节点。\n\
  \n当用户输入文本时，使用按键事件来确定输入的内容是有问题的。某些平台，尤其是安卓手机上的虚拟键盘，不会触发按键事件。但即使你使用的是传统键盘，某些类型的文本输入也无法直接与按键按下匹配，例如*输入法编辑器*（IME）软件——那些使用键盘无法直接输入的字符的人会使用这种软件，它通过组合多次按键来创建字符。\n\
  \n要检测何时输入了内容，你可以输入内容的元素（如 `<input>` 和 `<textarea>` 标签）会在用户更改其内容时触发 `\"input\"` 事件。要获取实际输入的内容，最好直接从获得焦点的字段中读取。第\
  \ 317 页的“表单字段”将展示具体方法。\n\n### 指针事件\n\n目前有两种广泛使用的在屏幕上指向内容的方式：鼠标（包括类似鼠标的设备，如触摸板和轨迹球）和触摸屏。它们会产生不同类型的事件。\n\
  \n#### *鼠标点击*\n\n按下鼠标按钮会触发多个事件。`\"mousedown\"` 和 `\"mouseup\"` 事件类似于 `\"keydown\"\
  ` 和 `\"keyup\"`，在按钮按下和释放时触发。这些事件发生在事件发生时鼠标指针正下方的 DOM 节点上。\n\n在 `\"mouseup\"` 事件之后，`\"\
  click\"` 事件会在同时包含按下和释放按钮的最具体节点上触发。例如，如果我在一个段落上按下鼠标按钮，然后将指针移动到另一个段落并释放按钮，`\"click\"\
  ` 事件将在包含这两个段落的元素上触发。\n\n如果两次点击发生得很近，在第二次点击事件之后还会触发 `\"dblclick\"`（双击）事件。\n\n要获取鼠标事件发生位置的精确信息，你可以查看其\
  \ `clientX` 和 `clientY` 属性，它们包含事件相对于窗口左上角的坐标（以像素为单位）；或者 `pageX` 和 `pageY`，它们相对于整个文档的左上角（当窗口滚动时可能不同）。\n\
  \n以下实现了一个简单的绘图程序。每次你点击文档，它都会在鼠标指针下方添加一个点。更复杂的绘图程序请参见第 19 章。\n\n```\n<style>\n\n\
  \  body {\n\n    height: 200px;\n\n    background: beige;\n\n  }\n\n  .dot {\n\n\
  \    height: 8px; width: 8px;\n\n    border-radius: 4px; /* 圆角 */\n\n    background:\
  \ blue;\n\n    position: absolute;\n\n  }\n\n</style>\n\n<script>\n\n  window.addEventListener(\"\
  click\", event => {\n\n    let dot = document.createElement(\"div\");\n\n    dot.className\
  \ = \"dot\";\n\n    dot.style.left = (event.pageX - 4) + \"px\";\n\n    Handling\
  \ Events   253\n\n    dot.style.top = (event.pageY - 4) + \"px\";\n\n    document.body.appendChild(dot);\n\
  \n  });\n\n</script>\n```\n\n#### *鼠标移动*\n\n每当鼠标指针移动时，都会触发 `\"mousemove\"` 事件。该事件可用于跟踪鼠标的位置。一个常见的应用场景是实现某种形式的鼠标拖拽功能。\n\
  \n例如，以下程序显示一个条，并设置事件处理程序，使得在该条上向左或向右拖拽可以使其变窄或变宽：\n\n<p>拖拽该条以改变其宽度：</p>\n\n<div style=\"\
  background: orange; width: 60px; height: 20px\">\n\n</div>\n\n```\n<script>\n\n\
  \  let lastX; // 记录上一次观察到的鼠标 X 位置\n\n  let bar = document.querySelector(\"div\"\
  );\n\n  bar.addEventListener(\"mousedown\", event => {\n\n    if (event.button ==\
  \ 0) {\n\n       lastX = event.clientX;\n\n       window.addEventListener(\"mousemove\"\
  , moved);\n\n       event.preventDefault(); // 防止选中\n\n    }\n\n  });\n\n  function\
  \ moved(event) {\n\n    if (event.buttons == 0) {\n\n      window.removeEventListener(\"\
  mousemove\", moved);\n\n    } else {\n\n      let dist = event.clientX - lastX;\n\
  \n      let newWidth = Math.max(10, bar.offsetWidth + dist);\n\n      bar.style.width\
  \ = newWidth + \"px\";\n\n      lastX = event.clientX;\n\n    }\n\n  }\n\n</script>\n\
  ```\n\n结果页面如下所示：\n\n![Image](img/f0254-01.jpg)\n\n注意，`\"mousemove\"` 处理程序注册在整个窗口上。即使鼠标在调整大小过程中移出了条的范围，只要按钮仍被按住，我们仍然希望更新其大小。\n\
  \n当鼠标按钮释放时，我们必须停止调整条的大小。为此，我们可以使用 `buttons` 属性（注意是复数形式），它告诉我们当前按下的按钮。当该值为零时，表示没有按钮被按下。当有按钮被按下时，其值是这些按钮代码的总和——左按钮代码为\
  \ 1，右按钮为 2，中键为 4。例如，如果同时按住左键和右键，`buttons` 的值将为 3。\n\n注意，这些代码的顺序与 `button` 属性使用的顺序不同，后者中中键排在右键之前。如前所述，一致性并非浏览器编程接口的强项。\n\
  \n#### *触摸事件*\n\n我们使用的图形浏览器风格最初是为鼠标界面设计的，当时触摸屏还很罕见。为了让网页在早期的触摸屏手机上“工作”，这些设备的浏览器在一定程度上将触摸事件伪装成鼠标事件。如果你点击屏幕，你会得到\
  \ `\"mousedown\"`、`\"mouseup\"` 和 `\"click\"` 事件。\n\n但这种假象并不十分可靠。触摸屏的工作方式与鼠标不同：它没有多个按钮，当手指不在屏幕上时你无法跟踪手指（以模拟\
  \ `\"mousemove\"`），并且它允许多个手指同时触摸屏幕。\n\n鼠标事件仅在简单情况下覆盖触摸交互——如果你为按钮添加了 `\"click\"`\
  \ 处理程序，触摸用户仍然可以使用它。但像前面示例中的可调整大小的条在触摸屏上就无法工作。\n\n\n\n\n触摸交互会触发特定的事件类型。当手指开始接触屏幕时，你会收到一个\
  \ `\"touchstart\"` 事件。当手指在接触状态下移动时，会触发 `\"touchmove\"` 事件。最后，当手指离开屏幕时，你会看到 `\"touchend\"\
  ` 事件。\n\n由于许多触摸屏可以同时检测多根手指，这些事件并不关联单一的坐标集。相反，它们的事件对象有一个 `touches` 属性，该属性包含一个类数组的点对象，每个点都有自己的\
  \ `clientX`、`clientY`、`pageX` 和 `pageY` 属性。\n\n你可以像下面这样做，在每个触摸的手指周围显示红色圆圈：\n\n```html\n\
  <style>\n  dot { position: absolute; display: block;\n        border: 2px solid\
  \ red; border-radius: 50px;\n        height: 100px; width: 100px; }\n</style>\n\
  <p>Touch this page</p>\n<script>\n  function update(event) {\n     for (let dot;\
  \ dot = document.querySelector(\"dot\");) {\n       dot.remove();\n     }\n    \
  \ for (let i = 0; i < event.touches.length; i++) {\n       let {pageX, pageY} =\
  \ event.touches[i];\n       let dot = document.createElement(\"dot\");\n       dot.style.left\
  \ = (pageX - 50) + \"px\";\n       dot.style.top = (pageY - 50) + \"px\";\n    \
  \   document.body.appendChild(dot);\n     }\n   }\n   window.addEventListener(\"\
  touchstart\", update);\n   window.addEventListener(\"touchmove\", update);\n   window.addEventListener(\"\
  touchend\", update);\n</script>\n```\n\n你通常需要在触摸事件处理程序中调用 `preventDefault` 来覆盖浏览器的默认行为（可能包括滑动时滚动页面），并阻止鼠标事件被触发，为此你可能*也*有一个处理程序。\n\
  \n### 滚动事件\n\n每当一个元素被滚动时，它上面会触发一个 `\"scroll\"` 事件。这有多种用途，例如了解用户当前正在查看的内容（用于禁用屏幕外动画或向你的邪恶总部发送间谍报告），或者显示一些进度指示（通过高亮目录的一部分或显示页码）。\n\
  \n下面的示例在文档上方绘制了一个进度条，并在你向下滚动时更新它，使其逐渐填满：\n\n```html\n<style>\n  #progress {\n  \
  \  border-bottom: 2px solid blue;\n    width: 0;\n    position: fixed;\n    top:\
  \ 0; left: 0;\n  }\n</style>\n<div id=\"progress\"></div>\n<script>\n  // Create\
  \ some content\n  document.body.appendChild(document.createTextNode(\n    \"supercalifragilisticexpialidocious\
  \ \".repeat(1000)));\n    let bar = document.querySelector(\"#progress\");\n   \
  \ window.addEventListener(\"scroll\", () => {\n      let max = document.body.scrollHeight\
  \ - innerHeight;\n      bar.style.width = `${(pageYOffset / max) * 100}%`;\n  });\n\
  </script>\n```\n\n给元素设置 `fixed` 定位，其行为类似于绝对定位，但还能防止它随文档的其余部分一起滚动。效果是让我们的进度条保持在顶部。通过改变它的宽度来指示当前进度。设置宽度时，我们使用\
  \ `%` 而不是 `px` 作为单位，这样元素的大小会相对于页面宽度进行调整。\n\n全局绑定 `innerHeight` 提供了窗口的高度，我们需要从总可滚动高度中减去它——当你滚动到文档底部时，就无法继续滚动了。还有一个\
  \ `innerWidth` 用于窗口宽度。通过将当前滚动位置 `pageYOffset` 除以最大滚动位置，再乘以 100，我们就得到了进度条的百分比。\n\n\
  在滚动事件上调用 `preventDefault` 并不能阻止滚动发生。实际上，事件处理程序只在滚动*之后*才被调用。\n\n### 焦点事件\n\n当一个元素获得焦点时，浏览器会在它上面触发一个\
  \ `\"focus\"` 事件。当它失去焦点时，该元素会收到一个 `\"blur\"` 事件。\n\n与之前讨论的事件不同，这两个事件不会传播。当子元素获得或失去焦点时，父元素上的处理程序不会收到通知。\n\
  \n下面的示例为当前获得焦点的文本字段显示帮助文本：\n\n```html\n<p>Name: <input type=\"text\" data-help=\"\
  Your full name\"></p>\n<p>Age: <input type=\"text\" data-help=\"Age in years\"></p>\n\
  <p id=\"help\"></p>\n<script>\n  let help = document.querySelector(\"#help\");\n\
  \  let fields = document.querySelectorAll(\"input\");\n  for (let field of Array.from(fields))\
  \ {\n    field.addEventListener(\"focus\", event => {\n      let text = event.target.getAttribute(\"\
  data-help\");\n      help.textContent = text;\n    });\n    field.addEventListener(\"\
  blur\", event => {\n      help.textContent = \"\";\n    });\n  }\n</script>\n```\n\
  \n这张截图显示了年龄字段的帮助文本。\n\n![图片](img/f0258-01.jpg)\n\n当用户从显示文档的浏览器标签页或窗口移开或移入时，window\
  \ 对象会收到 `\"focus\"` 和 `\"blur\"` 事件。\n\n### 加载事件\n\n当页面加载完成时，`\"load\"` 事件会在 window\
  \ 和 document body 对象上触发。这通常用于安排需要整个文档构建完成的初始化操作。请记住，`<script>` 标签的内容在遇到该标签时会立即执行。这可能太早了，例如当脚本需要对\
  \ `<script>` 标签之后出现的文档部分进行操作时。\n\n加载外部文件的元素（如图像和脚本标签）也有一个 `\"load\"` 事件，表示它们引用的文件已加载。与焦点相关的事件类似，加载事件不会传播。\n\
  \n当页面被关闭或导航离开时（例如通过点击链接），会触发一个 `\"beforeunload\"` 事件。该事件的主要用途是防止用户因关闭文档而意外丢失工作。如果你阻止此事件的默认行为，*并且*将事件对象的\
  \ `returnValue` 属性设置为一个字符串，浏览器将向用户显示一个对话框，询问他们是否真的想离开页面。该对话框可能会包含你的字符串，但由于一些恶意网站试图利用这些对话框来迷惑用户留在页面上查看可疑的减肥广告，大多数浏览器已不再显示它们。\n\
  \n### 事件与事件循环\n\n在第 11 章讨论的事件循环上下文中，浏览器事件处理程序的行为与其他异步通知类似。它们在事件发生时被调度，但必须等待其他正在运行的脚本完成后才能获得执行机会。\n\
  \n事件只有在没有其他代码运行时才能被处理，这意味着如果事件循环被其他工作占用，任何与页面的交互（通过事件发生）都将被延迟，直到有时间处理它。因此，如果你安排了太多工作，无论是通过长时间运行的事件处理程序还是大量短时间运行的处理程序，页面都会变得缓慢且难以使用。\n\
  \n对于那些你*确实*想在后台执行一些耗时操作而不冻结页面的情况，浏览器提供了一种称为 *web workers* 的东西。Worker 是一个与主脚本并行运行的\
  \ JavaScript 进程，拥有自己的时间线。\n\n假设计算一个数的平方是一个繁重且耗时的计算，我们想在一个单独的线程中执行。我们可以编写一个名为 `code/squareworker.js`\
  \ 的文件，它通过计算平方并发送消息来响应消息。\n\n```javascript\naddEventListener(\"message\", event =>\
  \ {\n  postMessage(event.data * event.data);\n});\n```\n\n为了避免多个线程接触相同数据的问题，Worker\
  \ 不与主脚本的环境共享其全局作用域或任何其他数据。相反，你必须通过来回发送消息来与它们通信。\n\n以下代码生成一个运行该脚本的 Worker，向它发送几条消息，并输出响应。\n\
  \n```javascript\nlet squareWorker = new Worker(\"code/squareworker.js\");\nsquareWorker.addEventListener(\"\
  message\", event => {\n  console.log(\"The worker responded:\", event.data);\n});\n\
  squareWorker.postMessage(10);\nsquareWorker.postMessage(24);\n```\n\n\n\n\n`postMessage`\
  \ 函数用于发送消息，这会导致接收方触发一个 \"message\" 事件。创建 worker 的脚本通过 `Worker` 对象发送和接收消息，而 worker\
  \ 则通过在其全局作用域上直接发送和监听来与创建它的脚本通信。只有能够表示为 `JSON` 的值才能作为消息发送——接收方将收到这些值的*副本*，而非原始值本身。\n\
  \n### 定时器\n\n我们在第 11 章中见过 `setTimeout` 函数。它用于安排另一个函数在给定的毫秒数之后被调用。\n\n有时你需要取消已安排好的函数。这可以通过存储\
  \ `setTimeout` 返回的值，并对其调用 `clearTimeout` 来实现。\n\n```javascript\nlet bombTimer =\
  \ setTimeout(() => {\n  console.log(\"BOOM!\");\n}, 500);\nif (Math.random() < 0.5)\
  \ { // 50% 概率\n  console.log(\"Defused.\");\n  clearTimeout(bombTimer);\n}\n```\n\
  \n`cancelAnimationFrame` 函数的工作方式与 `clearTimeout` 相同——对 `requestAnimationFrame` 返回的值调用它，将取消该帧（假设它尚未被调用）。\n\
  \n另一组类似的函数 `setInterval` 和 `clearInterval` 用于设置每隔 *X* 毫秒*重复*执行的定时器。\n\n```javascript\n\
  let ticks = 0;\nlet clock = setInterval(() => {\n  console.log(\"tick\", ticks++);\n\
  \  if (ticks == 10) {\n    clearInterval(clock);\n    console.log(\"stop.\");\n\
  \  }\n}, 200);\n```\n\n### 防抖\n\n某些类型的事件可能会快速连续触发多次（例如 `\"mousemove\"` 和 `\"scroll\"\
  ` 事件）。处理此类事件时，必须小心不要执行过于耗时的操作，否则处理程序会占用太多时间，导致与文档的交互变得缓慢。\n\n如果你确实需要在这样的处理程序中执行一些非平凡的操作，可以使用\
  \ `setTimeout` 来确保不会过于频繁地执行。这通常被称为事件的*防抖*。有几种略有不同的方法可以实现这一点。\n\n在第一个示例中，我们希望在用户输入某些内容时做出反应，但不想对每个输入事件都立即执行操作。当用户快速输入时，我们只想等待出现暂停。我们不在事件处理程序中立即执行操作，而是设置一个超时。同时，我们清除之前的超时（如果有的话），这样当事件密集发生时（间隔小于我们的超时延迟），前一个事件的超时将被取消。\n\
  \n```html\n<textarea>Type something here...</textarea>\n<script>\n  let textarea\
  \ = document.querySelector(\"textarea\");\n  let timeout;\n  textarea.addEventListener(\"\
  input\", () => {\n    clearTimeout(timeout);\n    timeout = setTimeout(() => console.log(\"\
  Typed!\"), 500);\n  });\n</script>\n```\n\n向 `clearTimeout` 传递 `undefined` 值，或者对已经触发的超时调用它，都不会产生任何效果。因此，我们不必担心何时调用它，只需对每个事件都这样做即可。\n\
  \n如果我们希望将响应间隔至少一定的时间长度，但又希望在一系列事件*期间*（而不仅仅是之后）触发它们，我们可以使用略有不同的模式。例如，我们可能希望响应 `\"\
  mousemove\"` 事件，显示鼠标的当前坐标，但每 250 毫秒只显示一次。\n\n```javascript\n<script>\n  let scheduled\
  \ = null;\n  window.addEventListener(\"mousemove\", event => {\n    if (!scheduled)\
  \ {\n      setTimeout(() => {\n        document.body.textContent =\n          `Mouse\
  \ at ${scheduled.pageX}, ${scheduled.pageY}`;\n        scheduled = null;\n     \
  \ }, 250);\n    }\n    scheduled = event;\n  });\n</script>\n```\n\n### 总结\n\n事件处理程序使我们能够检测并响应网页中发生的事件。`addEventListener`\
  \ 方法用于注册此类处理程序。\n\n每个事件都有一个类型（例如 `\"keydown\"`、`\"focus\"` 等）来标识它。大多数事件会在特定的 DOM\
  \ 元素上被调用，然后*传播*到该元素的祖先节点，从而允许与这些祖先节点关联的处理程序来处理它们。\n\n当事件处理程序被调用时，会传递一个事件对象，其中包含有关该事件的附加信息。该对象还包含一些方法，允许我们停止进一步传播（`stopPropagation`）以及阻止浏览器对该事件的默认处理（`preventDefault`）。\n\
  \n按下按键会触发 `\"keydown\"` 和 `\"keyup\"` 事件。按下鼠标按钮会触发 `\"mousedown\"`、`\"mouseup\"\
  ` 和 `\"click\"` 事件。移动鼠标会触发 `\"mousemove\"` 事件。触摸屏交互会产生 `\"touchstart\"`、`\"touchmove\"\
  ` 和 `\"touchend\"` 事件。\n\n滚动可以通过 `\"scroll\"` 事件检测，焦点变化可以通过 `\"focus\"` 和 `\"blur\"\
  ` 事件检测。当文档加载完成时，会在 window 上触发 `\"load\"` 事件。\n\n### 练习\n\n#### *气球*\n\n编写一个页面，显示一个气球（使用气球表情符号，![Image](img/c0262-01.jpg)）。当按下上箭头键时，气球应膨胀（变大）10%；当按下下箭头键时，气球应收缩（变小）10%。\n\
  \n你可以通过在其父元素上设置 CSS 属性 `font-size`（`style.fontSize`）来控制文本（表情符号也是文本）的大小。记得在值中包含单位——例如像素（`10px`）。\n\
  \n箭头键的键名是 `\"ArrowUp\"` 和 `\"ArrowDown\"`。确保这些按键只改变气球，而不滚动页面。\n\n当上述功能实现后，添加一个特性：如果你将气球吹大到超过某个尺寸，它会爆炸。在这种情况下，爆炸意味着它被替换为\
  \ ![Image](img/c0262-02.jpg) 表情符号，并且事件处理程序被移除（这样你就无法再膨胀或收缩爆炸后的气球了）。\n\n#### *鼠标轨迹*\n\
  \n在 JavaScript 的早期，那是充满大量动画图像的华丽主页的鼎盛时期，人们想出了一些真正令人惊叹的方式来使用这门语言。\n\n其中之一就是*鼠标轨迹*——一系列元素，当你将鼠标指针在页面上移动时，它们会跟随鼠标指针。\n\
  \n在这个练习中，我希望你实现一个鼠标轨迹。使用绝对定位的 `<div>` 元素，具有固定的大小和背景颜色（参考第 253 页 “鼠标点击”中的代码示例）。创建一组这样的元素，当鼠标移动时，将它们显示在鼠标指针的尾迹中。\n\
  \n这里有多种可能的方法。你可以根据自己的意愿使解决方案简单或复杂。一个简单的入门方案是保持固定数量的轨迹元素并循环使用它们，每次发生 `\"mousemove\"\
  ` 事件时，将下一个元素移动到鼠标的当前位置。\n\n#### *标签页*\n\n标签面板在用户界面中被广泛使用。它们允许你通过选择元素上方“突出”的多个标签之一来选择一个界面面板。\n\
  \n在这个练习中，你必须实现一个简单的标签页界面。编写一个函数 `asTabs`，它接受一个 DOM 节点，并创建一个标签页界面，显示该节点的子元素。它应该在该节点的顶部插入一个\
  \ `<button>` 元素列表，每个子元素对应一个按钮，按钮文本从子元素的 `data-tabname` 属性中获取。除了一个子元素外，其他所有原始子元素都应被隐藏（设置\
  \ `display` 样式为 `none`）。当前可见的节点可以通过点击按钮来选择。\n\n当上述功能实现后，扩展它，使当前选中标签的按钮样式有所不同，以便清楚地显示哪个标签被选中。\n\
  \n“所有现实都是一场游戏。”——伊恩·班克斯，《游戏玩家》\n\n![Image](img/f0264-01.jpg)\n\n## 16 项目：一个平台游戏\n\
  \n我最初对计算机的迷恋，就像许多书呆子孩子一样，很大程度上与电脑游戏有关。我被那些我可以操控的小型模拟世界所吸引，在这些世界里，故事（某种程度上）会展开——我想，更多是因为我将自己的想象力投射到其中，而不是因为它们实际提供的可能性。\n\
  \n\n\n\n我不希望任何人从事游戏编程的职业。就像音乐行业一样，渴望从事这一行的年轻人数量与实际需求之间的差距，造成了一种相当不健康的环境。但为了乐趣而编写游戏还是很有趣的。\n\
  \n本章将逐步实现一个小型平台游戏。平台游戏（或称“跳跃与奔跑”游戏）要求玩家操控一个角色在二维世界中移动，通常是从侧面视角观察，同时跳跃越过或踩上各种物体。\n\
  \n### 游戏\n\n我们的游戏将大致基于托马斯·帕莱夫（Thomas Palef）的《暗蓝》（*[www.lessmilk.com/games/10](http://www.lessmilk.com/games/10)*）。我选择这个游戏是因为它既有趣又极简，而且不需要太多代码就能构建。\n\
  \n它看起来像这样：\n\n![Image](img/f0266-01.jpg)\n\n深色方块代表玩家，其任务是收集小方块（金币），同时避开熔岩。当所有金币都被收集后，关卡完成。\n\
  \n玩家可以使用左右箭头键行走，使用上箭头键跳跃。跳跃是这个游戏角色的特色。它可以跳到自身高度的数倍，并且可以在空中改变方向。这可能不完全符合现实，但有助于让玩家感觉直接控制着屏幕上的角色。\n\
  \n游戏由静态背景组成，背景呈网格状布局，移动元素叠加在背景之上。网格中的每个字段要么是空的，要么是实心的，要么是熔岩。移动元素包括玩家、金币和某些熔岩块。这些元素的位置不受网格限制——它们的坐标可以是小数，从而实现平滑运动。\n\
  \n### 技术\n\n我们将使用浏览器 DOM 来显示游戏，并通过处理键盘事件来读取用户输入。\n\n与屏幕和键盘相关的代码只是构建这个游戏所需工作的一小部分。由于所有东西看起来都是彩色方块，绘制起来并不复杂：我们创建\
  \ DOM 元素，并使用样式为它们设置背景颜色、大小和位置。\n\n我们可以将背景表示为表格，因为它是一个不变的方格网格。自由移动的元素可以使用绝对定位的元素叠加在上面。\n\
  \n在需要动画图形并对用户输入做出无延迟响应的游戏和其他程序中，效率至关重要。尽管 DOM 最初并非为高性能图形而设计，但它实际上比预期的表现更好（你在第 14\
  \ 章中看到过一些动画）。在现代机器上，即使我们不太担心优化，像这样的简单游戏也能运行良好。\n\n在下一章中，我们将探讨另一种浏览器技术——`<canvas>`标签，它提供了一种更传统的绘图方式，基于形状和像素而非\
  \ DOM 元素。\n\n### 关卡\n\n我们希望有一种人类可读、可编辑的方式来指定关卡。由于所有内容最初都可以放在网格上，我们可以使用大字符串，其中每个字符代表一个元素——要么是背景网格的一部分，要么是移动元素。\n\
  \n一个小关卡的规划可能如下所示：\n\n```\nlet simpleLevelPlan = `\n\n......................\n\n\
  ..#................#..\n\n..#..............=.#..\n\n..#.........o.o....#..\n\n..#.@......#####...#..\n\
  \n..#####............#..\n\n......#++++++++++++#..\n\n......##############..\n\n\
  ......................`;\n```\n\n句点代表空位，井号（`#`）代表墙壁，加号代表熔岩。玩家的起始位置是 at 符号（`@`）。每个\
  \ `o` 字符是一枚金币，顶部的等号（`=`）是一块水平来回移动的熔岩。\n\n我们将支持另外两种移动熔岩：竖线字符（`|`）创建垂直移动的熔岩块，而 `v`\
  \ 表示*滴落*熔岩——垂直移动但不来回反弹，只向下移动，当碰到地面时跳回起始位置。\n\n整个游戏由多个关卡组成，玩家必须完成这些关卡。当所有金币都被收集后，关卡完成。如果玩家碰到熔岩，当前关卡将重置到起始位置，玩家可以重试。\n\
  \n### 读取关卡\n\n以下类存储一个关卡对象。其参数应为定义关卡的字符串。\n\n```\nclass Level {\n  constructor(plan)\
  \ {\n    let rows = plan.trim().split(\"\\n\").map(l => [...l]);\n    this.height\
  \ = rows.length;\n    this.width = rows[0].length;\n    this.startActors = [];\n\
  \    this.rows = rows.map((row, y) => {\n      return row.map((ch, x) => {\n   \
  \     let type = levelChars[ch];\n        if (typeof type == \"string\") return\
  \ type;\n        this.startActors.push(\n          type.create(new Vec(x, y), ch));\n\
  \        return \"empty\";\n      });\n    });\n  }\n}\n```\n\n`trim` 方法用于移除规划字符串开头和结尾的空白。这样我们的示例规划就可以以换行符开头，使所有行直接上下对齐。剩余的字符串按换行符分割，每行展开成一个数组，从而得到字符数组。\n\
  \n因此，`rows` 保存了一个字符数组的数组，即规划的每一行。我们可以从中推导出关卡的宽度和高度。但我们仍需将移动元素与背景网格分开。我们将移动元素称为*角色*。它们将存储在一个对象数组中。背景将是一个字符串数组的数组，包含字段类型，如\
  \ `\"empty\"`、`\"wall\"` 或 `\"lava\"`。\n\n为了创建这些数组，我们遍历行，然后遍历每行的内容。记住，`map` 会将数组索引作为第二个参数传递给映射函数，这告诉我们给定字符的\
  \ x 和 y 坐标。游戏中的位置将存储为坐标对，左上角为 `0,0`，每个背景方块高和宽均为 1 个单位。\n\n为了解释规划中的字符，`Level` 构造函数使用了\
  \ `levelChars` 对象，该对象将背景元素映射为字符串，将角色字符映射为类。当 `type` 是一个角色类时，使用其静态 `create` 方法来创建一个对象，并将其添加到\
  \ `startActors` 中，同时映射函数为该背景方块返回 `\"empty\"`。\n\n角色的位置存储为 `Vec` 对象。这是一个二维向量，包含 `x`\
  \ 和 `y` 属性，如第 6 章练习中所示。\n\n随着游戏运行，角色会移动到不同位置，甚至完全消失（例如金币被收集时）。我们将使用 `State` 类来跟踪运行中游戏的状态。\n\
  \n```\nclass State {\n  constructor(level, actors, status) {\n    this.level = level;\n\
  \    this.actors = actors;\n    this.status = status;\n  }\n  static start(level)\
  \ {\n    return new State(level, level.startActors, \"playing\");\n  }\n  get player()\
  \ {\n    return this.actors.find(a => a.type == \"player\");\n  }\n}\n```\n\n当游戏结束时，`status`\
  \ 属性将切换为 `\"lost\"` 或 `\"won\"`。\n\n这又是一个持久化数据结构——更新游戏状态会创建一个新状态，并保持旧状态不变。\n\n###\
  \ 角色\n\n角色对象表示游戏中某个移动元素的当前位置和状态。所有角色对象都遵循相同的接口。它们的 `pos` 属性保存元素左上角的坐标，`size` 属性保存其大小。\n\
  \n它们还有一个 `update` 方法，用于计算在给定时间步长后的新状态和位置。它模拟角色的行为——玩家根据箭头键移动，熔岩来回反弹——并返回一个新的、更新后的角色对象。\n\
  \n`type` 属性包含一个字符串，用于标识角色类型——`\"player\"`、`\"coin\"` 或 `\"lava\"`。这在绘制游戏时很有用——为角色绘制的矩形外观基于其类型。\n\
  \n\n\nActor 类有一个静态的 `create` 方法，`Level` 构造函数会使用它来根据关卡地图中的字符创建 actor。该方法接收字符的坐标和字符本身，因为\
  \ `Lava` 类需要处理多个不同的字符。\n\n这是我们用于二维数值（例如 actor 的位置和大小）的 `Vec` 类：\n\n```\nclass Vec\
  \ {\n  constructor(x, y) {\n    this.x = x; this.y = y;\n  }\n  plus(other) {\n\
  \    return new Vec(this.x + other.x, this.y + other.y);\n  }\n  times(factor) {\n\
  \    return new Vec(this.x * factor, this.y * factor);\n  }\n}\n```\n\n`times` 方法将向量乘以一个给定的数值。当我们需要将速度向量乘以时间间隔以得到该时间内移动的距离时，这个方法会很有用。\n\
  \n不同类型的 actor 拥有各自的类，因为它们的行为差异很大。我们来定义这些类。稍后会介绍它们的更新方法。\n\n`Player` 类有一个 `speed`\
  \ 属性，用于存储当前速度，以模拟动量和重力。\n\n```\nclass Player {\n  constructor(pos, speed) {\n  \
  \  this.pos = pos;\n    this.speed = speed;\n  }\n  get type() { return \"player\"\
  ; }\n  static create(pos) {\n    return new Player(pos.plus(new Vec(0, -0.5)),\n\
  \                     new Vec(0, 0));\n  }\n}\nPlayer.prototype.size = new Vec(0.8,\
  \ 1.5);\n```\n\n由于玩家角色高度为一个半方格，其初始位置被设置为 `@` 字符出现位置上方半个方格处。这样，它的底部就会与它出现的方格的底部对齐。\n\
  \n`size` 属性对于 `Player` 的所有实例都是相同的，因此我们将其存储在原型上，而不是实例本身。我们本可以使用像 `type` 那样的 getter，但那样每次读取属性时都会创建并返回一个新的\
  \ `Vec` 对象，这会造成浪费。（字符串是不可变的，因此每次求值时不必重新创建。）\n\n在构造 `Lava` actor 时，我们需要根据它所基于的字符来以不同方式初始化对象。动态熔岩会以当前速度移动，直到碰到障碍物。此时，如果它有\
  \ `reset` 属性，它会跳回起始位置（滴落）。如果没有，它会反转速度并继续向另一个方向移动（弹跳）。\n\n`create` 方法会查看 `Level`\
  \ 构造函数传递的字符，并创建相应的熔岩 actor。\n\n```\nclass Lava {\n  constructor(pos, speed, reset)\
  \ {\n    this.pos = pos;\n    this.speed = speed;\n    this.reset = reset;\n  }\n\
  \  get type() { return \"lava\"; }\n  static create(pos, ch) {\n    if (ch == \"\
  =\") {\n      return new Lava(pos, new Vec(2, 0));\n    } else if (ch == \"|\")\
  \ {\n        return new Lava(pos, new Vec(0, 2));\n    } else if (ch == \"v\") {\n\
  \      return new Lava(pos, new Vec(0, 3), pos);\n    }\n  }\n}\nLava.prototype.size\
  \ = new Vec(1, 1);\n```\n\n`Coin` actor 相对简单。它们大多只是待在原地。但为了让游戏更生动，它们被赋予了“摆动”效果，即轻微的垂直来回运动。为了追踪这个效果，硬币对象存储了一个基础位置以及一个\
  \ `wobble` 属性，用于追踪弹跳运动的相位。这两者共同决定了硬币的实际位置（存储在 `pos` 属性中）。\n\n```\nclass Coin {\n\
  \  constructor(pos, basePos, wobble) {\n    this.pos = pos;\n    this.basePos =\
  \ basePos;\n    this.wobble = wobble;\n  }\n  get type() { return \"coin\"; }\n\
  \  static create(pos) {\n    let basePos = pos.plus(new Vec(0.2, 0.1));\n    return\
  \ new Coin(basePos, basePos,\n                    Math.random() * Math.PI * 2);\n\
  \  }\n}\nCoin.prototype.size = new Vec(0.6, 0.6);\n```\n\n在第 240 页的“定位与动画”中，我们看到\
  \ `Math.sin` 给出了圆上一点的 y 坐标。当我们沿着圆移动时，该坐标会以平滑的波形来回变化，这使得正弦函数非常适合用于模拟波浪运动。\n\n为了避免所有硬币同步上下移动，每个硬币的起始相位是随机化的。`Math.sin`\
  \ 波的*周期*（即它产生的波的宽度）是 2*π*。我们将 `Math.random` 返回的值乘以这个数，从而为硬币在波上赋予一个随机的起始位置。\n\n现在我们可以定义\
  \ `levelChars` 对象，它将地图字符映射到背景网格类型或 actor 类。\n\n```\nconst levelChars = {\n   \"\
  .\": \"empty\", \"#\": \"wall\", \"+\": \"lava\",\n   \"@\": Player, \"o\": Coin,\n\
  \   \"=\": Lava, \"|\": Lava, \"v\": Lava\n};\n```\n\n这样我们就拥有了创建 `Level` 实例所需的所有部分。\n\
  \n```\nlet simpleLevel = new Level(simpleLevelPlan);\nconsole.log(`${simpleLevel.width}\
  \ by ${simpleLevel.height}`);\n// → 22 by 9\n```\n\n接下来的任务是在屏幕上显示这样的关卡，并在其中模拟时间和运动。\n\
  \n### 封装是一种负担\n\n本章中的大部分代码并没有过多考虑封装，原因有二。首先，封装需要额外的努力。它会使程序变大，并且需要引入额外的概念和接口。由于读者能接受的代码量有限，我努力让程序保持小巧。\n\
  \n其次，游戏中的各种元素紧密耦合，以至于如果其中一个元素的行为发生变化，其他元素很可能无法保持不变。元素之间的接口最终会编码大量关于游戏工作方式的假设。这使得它们的效果大打折扣——当你改变系统的一部分时，你仍然需要担心它如何影响其他部分，因为它们的接口无法覆盖新的情况。\n\
  \n系统中的某些*切分点*适合通过严格的接口进行分离，但其他点则不然。试图封装一个不适合的边界，肯定会浪费大量精力。当你犯这个错误时，你通常会注意到你的接口变得异常庞大和详细，并且随着程序的演变，它们需要频繁更改。\n\
  \n有一件事我们*会*封装，那就是绘图子系统。原因是在下一章中，我们将以不同的方式显示同一个游戏。通过将绘图放在接口后面，我们可以在那里加载相同的游戏程序，并插入一个新的显示模块。\n\
  \n### 绘图\n\n绘图代码的封装是通过定义一个*显示*对象来实现的，该对象显示给定的关卡和状态。我们在本章中定义的显示类型称为 `DOMDisplay`，因为它使用\
  \ DOM 元素来显示关卡。\n\n我们将使用样式表来设置构成游戏的元素的实际颜色和其他固定属性。当然，也可以在创建元素时直接将这些属性赋值给元素的 style\
  \ 属性，但这会使程序更加冗长。\n\n以下辅助函数提供了一种简洁的方式来创建元素并为其添加一些属性和子节点：\n\n```\nfunction elt(name,\
  \ attrs, ...children) {\n  let dom = document.createElement(name);\n  for (let attr\
  \ of Object.keys(attrs)) {\n    dom.setAttribute(attr, attrs[attr]);\n  }\n  for\
  \ (let child of children) {\n    dom.appendChild(child);\n  }\n  return dom;\n}\n\
  ```\n\n创建显示对象时，需要提供一个父元素（显示对象会将自己附加到该元素上）和一个关卡对象。\n\n```\nclass DOMDisplay {\n \
  \ constructor(parent, level) {\n    this.dom = elt(\"div\", {class: \"game\"}, drawGrid(level));\n\
  \    this.actorLayer = null;\n    parent.appendChild(this.dom);\n  }\n  clear()\
  \ { this.dom.remove(); }\n}\n```\n\n关卡的背景网格是固定不变的，只需绘制一次。每次使用给定状态更新显示时，都会重新绘制 actor。`actorLayer`\
  \ 属性用于跟踪包含 actor 的元素，以便可以轻松地移除和替换它们。\n\n\n\n\n我们的坐标和尺寸以网格单位进行追踪，其中大小为 1 或距离为 1 表示一个网格块。在设置像素大小时，我们需要对这些坐标进行缩放——如果每个方格只有一个像素，游戏中的所有内容都会小得离谱。缩放常数定义了单个单位在屏幕上占据的像素数。\n\
  \n```\nconst scale = 20;\n\nfunction drawGrid(level) {\n  return elt(\"table\",\
  \ {\n    class: \"background\",\n    style: `width: ${level.width * scale}px`\n\
  \  }, ...level.rows.map(row =>\n    elt(\"tr\", {style: `height: ${scale}px`},\n\
  \        ...row.map(type => elt(\"td\", {class: type})))\n  ));\n}\n```\n\n如前所述，背景是用`<table>`元素绘制的。这与`level`的`rows`属性的结构完美对应——网格的每一行都转换为表格行（`<tr>`元素）。网格中的字符串用作表格单元格（`<td>`元素）的类名。展开（三点）运算符用于将子节点数组作为单独的参数传递给`elt`。\n\
  \n以下 CSS 使表格看起来像我们想要的背景：\n\n```\n.background    { background: rgb(52, 166, 251);\n\
  \                 table-layout: fixed;\n                 border-spacing: 0;    \
  \            }\n.background td { padding: 0;                       }\n.lava    \
  \      { background: rgb(255, 100, 100);   }\n.wall          { background: white;\
  \                }\n```\n\n其中一些属性（`table-layout`、`border-spacing`和`padding`）用于抑制不需要的默认行为。我们不希望表格的布局依赖于其单元格的内容，也不希望表格单元格之间有间距或内部有内边距。\n\
  \n`background`规则设置了背景颜色。CSS 允许颜色以单词（如`white`）或`rgb(R, G, B)`等格式指定，其中颜色的红、绿、蓝分量分别用\
  \ 0 到 255 的三个数字表示。因此，在`rgb(52, 166, 251)`中，红色分量为 52，绿色为 166，蓝色为 251。由于蓝色分量最大，最终颜色会偏蓝。你可以看到在`.lava`规则中，第一个数字（红色）是最大的。\n\
  \n我们通过为每个角色创建一个 DOM 元素，并根据角色的属性设置该元素的位置和大小来绘制每个角色。这些值必须乘以`scale`，才能从游戏单位转换为像素。\n\
  \n```\nfunction drawActors(actors) {\n  return elt(\"div\", {}, ...actors.map(actor\
  \ => {\n    let rect = elt(\"div\", {class: `actor ${actor.type}`});\n    rect.style.width\
  \ = `${actor.size.x * scale}px`;\n    rect.style.height = `${actor.size.y * scale}px`;\n\
  \    rect.style.left = `${actor.pos.x * scale}px`;\n    rect.style.top = `${actor.pos.y\
  \ * scale}px`;\n    return rect;\n  }));\n}\n```\n\n要给一个元素添加多个类，我们用空格分隔类名。在接下来展示的\
  \ CSS 代码中，`actor`类为角色提供了绝对定位。它们的类型名被用作额外的类来赋予颜色。我们不需要再次定义`lava`类，因为我们复用了之前为熔岩网格方块定义的类。\n\
  \n```\n.actor { position: absolute;           }\n.coin { background: rgb(241, 229,\
  \ 89); }\n.player { background: rgb(64, 64, 64); }\n```\n\n`syncState`方法用于使显示呈现给定的状态。它首先移除旧的角色图形（如果有的话），然后在新位置重新绘制角色。可能会有人想尝试重用角色的\
  \ DOM 元素，但要做到这一点，我们需要大量的额外簿记工作来将角色与 DOM 元素关联，并确保在角色消失时移除元素。由于游戏中通常只有少数几个角色，重新绘制所有角色并不昂贵。\n\
  \n```\nDOMDisplay.prototype.syncState = function(state) {\n   if (this.actorLayer)\
  \ this.actorLayer.remove();\n   this.actorLayer = drawActors(state.actors);\n  \
  \ this.dom.appendChild(this.actorLayer);\n   this.dom.className = `game ${state.status}`;\n\
  \   this.scrollPlayerIntoView(state);\n};\n```\n\n通过将关卡的当前状态作为类名添加到包装器中，我们可以通过添加一个\
  \ CSS 规则来在游戏获胜或失败时对玩家角色进行略微不同的样式设置，该规则仅在玩家具有给定类的祖先元素时生效。\n\n```\n.lost .player {\n\
  \  background: rgb(160, 64, 64);\n}\n.won .player {\n  box-shadow: -4px -7px 8px\
  \ white, 4px -7px 8px white;\n}\n```\n\n在接触熔岩后，玩家的颜色变为暗红色，暗示灼烧。当最后一枚硬币被收集时，我们添加两个模糊的白色阴影——一个在左上角，一个在右上角——以产生白色光晕效果。\n\
  \n我们不能假设关卡总是适合*视口*——即我们绘制游戏的元素。这就是为什么需要调用`scrollPlayerIntoView`。它确保如果关卡超出视口，我们会滚动视口，使玩家靠近其中心。以下\
  \ CSS 为游戏的包装 DOM 元素设置了最大尺寸，并确保任何超出元素框的内容都不可见。我们还为其设置了相对定位，以便其中的角色相对于关卡的左上角定位。\n\n\
  ```\n.game {\n  overflow: hidden;\n  max-width: 600px;\n  max-height: 450px;\n \
  \ position: relative;\n}\n```\n\n在`scrollPlayerIntoView`方法中，我们找到玩家的位置并更新包装元素的滚动位置。当玩家太靠近边缘时，我们通过操作该元素的`scrollLeft`和`scrollTop`属性来改变滚动位置。\n\
  \n```\nDOMDisplay.prototype.scrollPlayerIntoView = function(state) {\n  let width\
  \ = this.dom.clientWidth;\n  let height = this.dom.clientHeight;\n  let margin =\
  \ width / 3;\n  // The viewport\n  let left = this.dom.scrollLeft, right = left\
  \ + width;\n  let top = this.dom.scrollTop, bottom = top + height;\n  let player\
  \ = state.player;\n  let center = player.pos.plus(player.size.times(0.5))\n    \
  \                     .times(scale);\n  if (center.x < left + margin) {\n    this.dom.scrollLeft\
  \ = center.x - margin;\n  } else if (center.x > right - margin) {\n    this.dom.scrollLeft\
  \ = center.x + margin - width;\n  }\n  if (center.y < top + margin) {\n    this.dom.scrollTop\
  \ = center.y - margin;\n  } else if (center.y > bottom - margin) {\n    this.dom.scrollTop\
  \ = center.y + margin - height;\n  }\n};\n```\n\n找到玩家中心的方式展示了我们`Vec`类型上的方法如何使对象计算以相对可读的方式编写。要找到角色的中心，我们将它的位置（左上角）加上它的一半大小。这是关卡坐标中的中心，但我们需要像素坐标，因此我们将结果向量乘以显示缩放比例。\n\
  \n接下来，一系列检查验证玩家位置是否超出允许范围。请注意，有时这会设置无意义的滚动坐标，例如低于零或超出元素的可滚动区域。这没问题——DOM 会将其限制在可接受的值内。将`scrollLeft`设置为-10\
  \ 会导致它变为 0。\n\n如果总是尝试将玩家滚动到视口中心，实现起来会稍微简单一些。但这会产生相当刺眼的效果。当你跳跃时，视口会不断上下移动。在屏幕中间有一个“中性”区域，你可以在其中移动而不引起任何滚动，这样会更舒适。\n\
  \n现在我们可以显示我们的小关卡了。\n\n```\n<link rel=\"stylesheet\" href=\"css/game.css\">\n<script>\n\
  \  let simpleLevel = new Level(simpleLevelPlan);\n  let display = new DOMDisplay(document.body,\
  \ simpleLevel);\n  display.syncState(State.start(simpleLevel));\n</script>\n```\n\
  \n![图片](img/f0277-01.jpg)\n\n`<link>`标签与`rel=\"stylesheet\"`一起使用时，是一种将 CSS 文件加载到页面中的方式。文件`game.css`包含了我们游戏所需的样式。\n\
  \n### 运动与碰撞\n\n\n\n\n\n现在我们到了可以开始添加运动的部分——这是游戏中最有趣的方面。大多数此类游戏采用的基本方法是将时间分割成小步，对于每一步，根据角色速度乘以时间步长的大小来移动角色。我们以秒为单位测量时间，因此速度以每秒单位数表示。\n\
  \n移动物体很简单。困难的部分在于处理元素之间的交互。当玩家撞到墙壁或地板时，他们不应该直接穿过去。游戏必须注意到给定的运动何时导致物体撞到另一个物体，并做出相应反应。对于墙壁，运动必须停止。当碰到金币时，金币必须被收集。当碰到熔岩时，游戏应该失败。\n\
  \n解决一般情况下的这个问题是一项大任务。你可以找到通常称为*物理引擎*的库，它们模拟二维或三维物理对象之间的交互。在本章中，我们将采取更简单的方法，只处理矩形对象之间的碰撞，并以相当简单的方式处理它们。\n\
  \n在移动玩家或熔岩块之前，我们测试该运动是否会将其带入墙壁内部。如果是，我们直接取消整个运动。对这种碰撞的响应取决于角色的类型——玩家会停止，而熔岩块会反弹回来。\n\
  \n这种方法要求我们的时间步长相当小，因为它会在物体实际接触之前停止运动。如果时间步长（以及运动步长）太大，玩家最终会悬停在地面上方一个明显的距离。另一种方法，可以说更好但更复杂，是找到精确的碰撞点并移动到那里。我们将采用简单的方法，并通过确保动画以小步进行来隐藏其问题。\n\
  \n该方法告诉我们一个矩形（由位置和大小指定）是否接触到给定类型的网格元素。\n\n```javascript\nLevel.prototype.touches\
  \ = function(pos, size, type) {\n  let xStart = Math.floor(pos.x);\n  let xEnd =\
  \ Math.ceil(pos.x + size.x);\n  let yStart = Math.floor(pos.y);\n  let yEnd = Math.ceil(pos.y\
  \ + size.y);\n  for (let y = yStart; y < yEnd; y++) {\n    for (let x = xStart;\
  \ x < xEnd; x++) {\n      let isOutside = x < 0 || x >= this.width ||\n        \
  \              y < 0 || y >= this.height;\n      let here = isOutside ? \"wall\"\
  \ : this.rows[y][x];\n      if (here == type) return true;\n    }\n  }\n  return\
  \ false;\n};\n```\n\n该方法通过对其坐标使用 `Math.floor` 和 `Math.ceil` 来计算物体所覆盖的网格方块集合。请记住，网格方块的大小是\
  \ 1×1 单位。通过将盒子的边向上和向下取整，我们得到了盒子所接触的背景方块的范围。\n\n![Image](img/f0278-01.jpg)\n\n我们遍历通过坐标取整找到的网格方块块，当找到匹配的方块时返回\
  \ `true`。关卡外的方块始终被视为 `\"wall\"`，以确保玩家无法离开世界，并且我们不会意外尝试读取 `rows` 数组边界之外的内容。\n\n状态更新方法使用\
  \ `touches` 来判断玩家是否接触到熔岩。\n\n```javascript\nState.prototype.update = function(time,\
  \ keys) {\n  let actors = this.actors\n    .map(actor => actor.update(time, this,\
  \ keys));\n  let newState = new State(this.level, actors, this.status);\n  if (newState.status\
  \ != \"playing\") return newState;\n  let player = newState.player;\n  if (this.level.touches(player.pos,\
  \ player.size, \"lava\")) {\n    return new State(this.level, actors, \"lost\");\n\
  \  }\n  for (let actor of actors) {\n    if (actor != player && overlap(actor, player))\
  \ {\n      newState = actor.collide(newState);\n    }\n  }\n  return newState;\n\
  };\n```\n\n该方法接收一个时间步长和一个数据结构，该结构告诉它哪些键被按住。它首先对所有角色调用 `update` 方法，生成一个更新后的角色数组。角色也会获得时间步长、按键和状态，以便它们可以基于这些进行更新。只有玩家会实际读取按键，因为这是唯一由键盘控制的角色。\n\
  \n如果游戏已经结束，则无需进一步处理（游戏输了之后不能赢，反之亦然）。否则，该方法测试玩家是否接触到背景熔岩。如果是，则游戏失败，我们就完成了。最后，如果游戏确实仍在进行中，它会检查是否有其他角色与玩家重叠。\n\
  \n角色之间的重叠通过 `overlap` 函数检测。它接收两个角色对象，当它们接触时返回 `true`——即它们在 x 轴和 y 轴上都有重叠。\n\n```javascript\n\
  function overlap(actor1, actor2) {\n  return actor1.pos.x + actor1.size.x > actor2.pos.x\
  \ &&\n         actor1.pos.x < actor2.pos.x + actor2.size.x &&\n         actor1.pos.y\
  \ + actor1.size.y > actor2.pos.y &&\n         actor1.pos.y < actor2.pos.y + actor2.size.y;\n\
  }\n```\n\n如果有任何角色重叠，其 `collide` 方法将有机会更新状态。接触熔岩角色会将游戏状态设置为 `\"lost\"`。金币在你接触时会消失，并且当它们是关卡中最后一枚金币时，将状态设置为\
  \ `\"won\"`。\n\n```javascript\nLava.prototype.collide = function(state) {\n   return\
  \ new State(state.level, state.actors, \"lost\");\n};\n\nCoin.prototype.collide\
  \ = function(state) {\n   let filtered = state.actors.filter(a => a != this);\n\
  \   let status = state.status;\n   if (!filtered.some(a => a.type == \"coin\"))\
  \ status = \"won\";\n   return new State(state.level, filtered, status);\n};\n```\n\
  \n### 角色更新\n\n角色对象的 `update` 方法接收时间步长、状态对象和一个 `keys` 对象作为参数。`Lava` 角色类型的 `update`\
  \ 方法忽略了 `keys` 对象。\n\n```javascript\nLava.prototype.update = function(time, state)\
  \ {\n  let newPos = this.pos.plus(this.speed.times(time));\n  if (!state.level.touches(newPos,\
  \ this.size, \"wall\")) {\n    return new Lava(newPos, this.speed, this.reset);\n\
  \  } else if (this.reset) {\n    return new Lava(this.reset, this.speed, this.reset);\n\
  \  } else {\n    return new Lava(this.pos, this.speed.times(-1));\n  }\n};\n```\n\
  \n这个 `update` 方法通过将时间步长与当前速度的乘积加到旧位置上来计算新位置。如果没有障碍物阻挡该新位置，它就移动到那里。如果有障碍物，行为取决于熔岩块的类型——滴落的熔岩有一个\
  \ `reset` 位置，当它碰到东西时会跳回该位置。反弹的熔岩通过将速度乘以 -1 来反转速度，从而开始向相反方向移动。\n\n金币使用它们的 `update`\
  \ 方法来摆动。它们忽略与网格的碰撞，因为它们只是在各自的方块内摆动。\n\n```javascript\nconst wobbleSpeed = 8, wobbleDist\
  \ = 0.07;\n\nCoin.prototype.update = function(time) {\n   let wobble = this.wobble\
  \ + time * wobbleSpeed;\n   let wobblePos = Math.sin(wobble) * wobbleDist;\n   return\
  \ new Coin(this.basePos.plus(new Vec(0, wobblePos)),\n                  this.basePos,\
  \ wobble);\n};\n```\n\n`wobble` 属性递增以跟踪时间，然后用作 `Math.sin` 的参数来找到波上的新位置。然后根据其基础位置和基于该波的偏移量计算金币的当前位置。\n\
  \n剩下的就是玩家本身。玩家的运动按轴分别处理，因为撞到地板不应阻止水平运动，而撞到墙壁不应阻止下落或跳跃运动。\n\n```javascript\nconst\
  \ playerXSpeed = 7;\nconst gravity = 30;\nconst jumpSpeed = 17;\n\nPlayer.prototype.update\
  \ = function(time, state, keys) {\n  let xSpeed = 0;\n  if (keys.ArrowLeft) xSpeed\
  \ -= playerXSpeed;\n  if (keys.ArrowRight) xSpeed += playerXSpeed;\n  let pos =\
  \ this.pos;\n  let movedX = pos.plus(new Vec(xSpeed * time, 0));\n  if (!state.level.touches(movedX,\
  \ this.size, \"wall\")) {\n    pos = movedX;\n  }\n  let ySpeed = this.speed.y +\
  \ time * gravity;\n  let movedY = pos.plus(new Vec(0, ySpeed * time));\n```\n\n\n\
  \n\n\n```\n  if (!state.level.touches(movedY, this.size, \"wall\")) {\n    pos =\
  \ movedY;\n  } else if (keys.ArrowUp && ySpeed > 0) {\n    ySpeed = -jumpSpeed;\n\
  \  } else {\n    ySpeed = 0;\n  }\n  return new Player(pos, new Vec(xSpeed, ySpeed));\n\
  };\n```\n\n水平运动根据左、右箭头键的状态计算。如果该运动产生的新位置没有被墙壁阻挡，则使用该位置；否则，保留原位置。\n\n垂直运动的工作方式类似，但需要模拟跳跃和重力。玩家的垂直速度（`ySpeed`）首先因重力而加速。\n\
  \n我们再次检查墙壁。如果没有碰到任何墙壁，则使用新位置。如果*确实*碰到了墙壁，则有两种可能的结果：当按下上箭头键*并且*玩家正在向下移动（即碰到的东西在下方）时，速度被设置为一个较大的负值，这会使玩家跳跃；如果不是这种情况，则玩家只是撞到了什么东西，速度被设置为零。\n\
  \n重力强度、跳跃速度以及游戏中几乎所有其他常量都是通过反复试验设定的。我测试了各种数值，直到找到我喜欢的组合。\n\n### 跟踪按键\n\n对于这样的游戏，我们不希望按键每次按下只生效一次。相反，我们希望只要按住按键，其效果（移动玩家角色）就持续生效。\n\
  \n我们需要设置一个按键处理器，用于存储左、右、上箭头键的当前状态。我们还需要对这些按键调用 `preventDefault`，以防止它们滚动页面。\n\n以下函数在给定一组按键名称数组时，会返回一个跟踪这些按键当前位置的对象。它会为\
  \ `\"keydown\"` 和 `\"keyup\"` 事件注册事件处理器，并且当事件中的按键代码存在于它正在跟踪的代码集合中时，更新该对象。\n\n```\n\
  function trackKeys(keys) {\n  let down = Object.create(null);\n  function track(event)\
  \ {\n    if (keys.includes(event.key)) {\n      down[event.key] = event.type ==\
  \ \"keydown\";\n      event.preventDefault();\n    }\n  }\n  window.addEventListener(\"\
  keydown\", track);\n  window.addEventListener(\"keyup\", track);\n  return down;\n\
  }\n```\n\n```\nconst arrowKeys = trackKeys([\"ArrowLeft\", \"ArrowRight\", \"ArrowUp\"\
  ]);\n```\n\n同一个处理器函数用于两种事件类型。它通过事件对象的 `type` 属性来判断按键状态应更新为 `true`（`\"keydown\"`）还是\
  \ `false`（`\"keyup\"`）。\n\n### 运行游戏\n\n我们在第 14 章中看到的 `requestAnimationFrame` 函数为游戏动画提供了一种很好的方式。但它的接口相当原始——使用它需要跟踪上次调用函数的时间，并在每一帧之后再次调用\
  \ `requestAnimationFrame`。\n\n让我们定义一个辅助函数，将这些繁琐的部分封装在一个方便的接口中，允许我们简单地调用 `runAnimation`，并传入一个期望时间差作为参数并绘制单帧的函数。当帧函数返回\
  \ `false` 时，动画停止。\n\n```\nfunction runAnimation(frameFunc) {\n  let lastTime = null;\n\
  \  function frame(time) {\n    if (lastTime != null) {\n      let timeStep = Math.min(time\
  \ - lastTime, 100) / 1000;\n      if (frameFunc(timeStep) === false) return;\n \
  \   }\n    lastTime = time;\n    requestAnimationFrame(frame);\n  }\n  requestAnimationFrame(frame);\n\
  }\n```\n\n我将最大帧步长设置为 100 毫秒（十分之一秒）。当包含我们页面的浏览器标签页或窗口被隐藏时，`requestAnimationFrame`\
  \ 调用将被暂停，直到标签页或窗口再次显示。在这种情况下，`lastTime` 和 `time` 之间的差值将是页面被隐藏的整个时间。在单步中让游戏前进那么多时间会显得很愚蠢，并且可能导致奇怪的副作用，例如玩家掉穿地板。\n\
  \n该函数还将时间步长转换为秒，这比毫秒更容易思考。\n\n`runLevel` 函数接受一个 `Level` 对象和一个显示构造函数，并返回一个 promise。它显示关卡（在\
  \ `document.body` 中）并让玩家进行游戏。当关卡结束（失败或胜利）时，`runLevel` 会再等待一秒钟（让用户看到发生了什么），然后清除显示、停止动画，并将\
  \ promise 解析为游戏的结束状态。\n\n```\nfunction runLevel(level, Display) {\n  let display\
  \ = new Display(document.body, level);\n  let state = State.start(level);\n  let\
  \ ending = 1;\n  return new Promise(resolve => {\n    runAnimation(time => {\n \
  \     state = state.update(time, arrowKeys);\n      display.syncState(state);\n\
  \      if (state.status == \"playing\") {\n        return true;\n      } else if\
  \ (ending > 0) {\n        ending -= time;\n        return true;\n      } else {\n\
  \        display.clear();\n        resolve(state.status);\n        return false;\n\
  \      }\n   });\n  });\n}\n```\n\n游戏是一系列关卡。每当玩家死亡时，当前关卡会重新开始。当一个关卡完成时，我们进入下一个关卡。这可以通过以下函数来表达，该函数接受一个关卡计划数组（字符串）和一个显示构造函数：\n\
  \n```\nasync function runGame(plans, Display) {\n  for (let level = 0; level < plans.length;)\
  \ {\n    let status = await runLevel(new Level(plans[level]),\n                \
  \                Display);\n    if (status == \"won\") level++;\n  }\n  console.log(\"\
  You've won!\");\n}\n```\n\n因为我们让 `runLevel` 返回一个 promise，所以 `runGame` 可以使用 `async`\
  \ 函数编写，如第 11 章所示。它返回另一个 promise，当玩家完成游戏时解析。\n\n本章沙盒（*[`eloquentjavascript.net/code#16`](https://eloquentjavascript.net/code#16)*）中的\
  \ `GAME_LEVELS` 绑定提供了一组关卡计划。此页面将它们传递给 `runGame`，从而启动一个实际的游戏。\n\n```\n<link rel=\"\
  stylesheet\" href=\"css/game.css\">\n<body>\n  <script>\n    runGame(GAME_LEVELS,\
  \ DOMDisplay);\n  </script>\n</body>\n```\n\n### 练习\n\n#### *游戏结束*\n\n平台游戏的传统是让玩家开始时拥有有限数量的*生命*，每次死亡减少一条生命。当玩家生命耗尽时，游戏从头开始。\n\
  \n调整 `runGame` 以实现生命机制。让玩家从三条生命开始。每次关卡开始时，输出当前生命数量（使用 `console.log`）。\n\n#### *暂停游戏*\n\
  \n通过按下 ESC 键实现暂停（挂起）和恢复游戏。\n\n这可以通过修改 `runLevel` 函数，使用另一个键盘事件处理器，并在按下 ESC 键时中断或恢复动画来实现。\n\
  \n`runAnimation` 接口乍一看可能不适合这个需求，但如果你重新安排 `runLevel` 调用它的方式，它是可行的。\n\n当这个功能实现后，你还可以尝试其他事情。我们注册键盘事件处理器的方式有些问题。`arrowKeys`\
  \ 对象目前是一个全局绑定，即使没有游戏运行，其事件处理器也一直存在。可以说它们*泄漏*到了系统之外。扩展 `trackKeys` 以提供一种注销其处理器的方法，然后修改\
  \ `runLevel`，使其在开始时注册处理器，并在结束时再次注销它们。\n\n#### *怪物*\n\n平台游戏的传统是拥有敌人，你可以跳到它们上面来击败它们。这个练习要求你向游戏中添加这样一个角色类型。\n\
  \n我们称之为怪物。怪物只水平移动。你可以让它们朝玩家的方向移动，像水平熔岩一样来回反弹，或者采用任何你想要的移动模式。该类不需要处理下落，但应确保怪物不会穿过墙壁。\n\
  \n\n\n\n当怪物碰到玩家时，效果取决于玩家是否踩在怪物上方。你可以通过检查玩家的底部是否接近怪物的顶部来近似判断。如果是这种情况，怪物消失。如果不是，游戏结束。\n\
  \n“绘画即是欺骗。”\n\n—— M.C. 埃舍尔，引自布鲁诺·恩斯特\n《M.C. 埃舍尔的魔镜》\n\n![Image](img/f0286-01.jpg)\n\
  \n## 17\n\n在画布上绘图\n\n浏览器为我们提供了几种显示图形的方式。最简单的方法是使用样式来定位和着色常规的 DOM 元素。正如上一章的游戏所示，这种方法可以让你走得很远。通过为节点添加半透明的背景图像，我们可以让它们看起来完全符合我们的要求。甚至可以使用\
  \ `transform` 样式来旋转或倾斜节点。\n\n但我们这样做是在用 DOM 做它最初并非设计用于的事情。某些任务，例如在任意两点之间画一条线，用常规的\
  \ HTML 元素来做会极其笨拙。\n\n有两种替代方案。第一种是基于 DOM 的，但使用的是*可缩放矢量图形*（SVG），而不是 HTML。可以把 SVG 看作一种专注于形状而非文本的文档标记方言。你可以将\
  \ SVG 文档直接嵌入 HTML 文档中，或者通过 `<img>` 标签引入。\n\n第二种替代方案称为*画布*（canvas）。画布是一个封装了图片的单一\
  \ DOM 元素。它提供了一个编程接口，用于在节点占据的空间上绘制形状。画布和 SVG 图片的主要区别在于，在 SVG 中，形状的原始描述会被保留，因此可以随时移动或调整大小。而画布则会在形状绘制时立即将其转换为像素（光栅上的彩色点），并且不记得这些像素代表什么。在画布上移动形状的唯一方法是清除画布（或形状周围的画布区域），然后在新位置重新绘制该形状。\n\
  \n### SVG\n\n本书不会详细讲解 SVG，但我会简要说明其工作原理。在第 305 页的“选择图形界面”一节中，我会回过头来讨论在决定哪种绘图机制适合特定应用时必须考虑的权衡。\n\
  \n这是一个包含简单 SVG 图片的 HTML 文档：\n\n<p>这里是普通 HTML。</p>\n\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
  >\n\n  <circle r=\"50\" cx=\"50\" cy=\"50\" fill=\"red\"/>\n\n  <rect x=\"120\"\
  \ y=\"5\" width=\"90\" height=\"90\"\n\n        stroke=\"blue\" fill=\"none\"/>\n\
  \n</svg>\n\n`xmlns` 属性将元素（及其子元素）切换到一个不同的 *XML 命名空间*。这个由 URL 标识的命名空间指定了我们当前使用的方言。`<circle>`\
  \ 和 `<rect>` 标签在 HTML 中不存在，但在 SVG 中有意义——它们根据属性指定的样式和位置绘制形状。\n\n文档显示如下：\n\n这里是普通\
  \ HTML。\n\n![Image](img/f0288-01.jpg)\n\n这些标签会创建 DOM 元素，就像 HTML 标签一样，脚本可以与它们交互。例如，以下代码将\
  \ `<circle>` 元素改为青色：\n\n```\nlet circle = document.querySelector(\"circle\");\n\
  circle.setAttribute(\"fill\", \"cyan\");\n```\n\n### 画布元素\n\n画布图形可以绘制在 `<canvas>`\
  \ 元素上。你可以为该元素指定 `width` 和 `height` 属性来确定其像素大小。\n\n新的画布是空的，意味着它完全透明，因此在文档中显示为空白区域。\n\
  \n`<canvas>` 标签旨在支持不同的绘图风格。要获得实际的绘图接口，我们首先需要创建一个*上下文*（context），这是一个对象，其方法提供了绘图接口。目前有两种广泛支持的绘图风格：用于二维图形的\
  \ `\"2d\"` 和通过 OpenGL 接口用于三维图形的 `\"webgl\"`。\n\n本书不会讨论 WebGL——我们将专注于二维图形。但如果你对三维图形感兴趣，我鼓励你研究一下\
  \ WebGL。它提供了对图形硬件的直接接口，并允许你使用 JavaScript 高效地渲染甚至复杂的场景。\n\n你可以通过 `<canvas>` DOM 元素上的\
  \ `getContext` 方法创建上下文。\n\n<p>画布之前。</p>\n\n<canvas width=\"120\" height=\"60\"></canvas>\n\
  \n<p>画布之后。</p>\n\n<script>\n\n  let canvas = document.querySelector(\"canvas\");\n\
  \n  let context = canvas.getContext(\"2d\");\n\n  context.fillStyle = \"red\";\n\
  \n  context.fillRect(10, 10, 100, 50);\n\n</script>\n\n创建上下文对象后，示例绘制了一个红色矩形，宽 100\
  \ 像素，高 50 像素，其左上角位于坐标 (10,10)。\n\n![Image](img/f0289-01.jpg)\n\n与 HTML（和 SVG）一样，画布使用的坐标系将\
  \ (0,0) 放在左上角，y 轴正方向向下。因此 (10,10) 位于左上角下方 10 像素、右侧 10 像素处。\n\n### 线条与表面\n\n在画布接口中，形状可以被*填充*（filled），即其区域被赋予某种颜色或图案，也可以被*描边*（stroked），即沿着其边缘绘制一条线。SVG\
  \ 也使用相同的术语。\n\n`fillRect` 方法填充一个矩形。它首先接收矩形左上角的 x 和 y 坐标，然后是宽度，最后是高度。类似的方法 `strokeRect`\
  \ 绘制矩形的轮廓。\n\n这两个方法都不接受任何其他参数。填充的颜色、描边的粗细等，不是由方法的参数决定的（你可能合理预期如此），而是由上下文对象的属性决定的。\n\
  \n`fillStyle` 属性控制形状的填充方式。它可以设置为一个指定颜色的字符串，使用 CSS 使用的颜色表示法。\n\n`strokeStyle` 属性类似，但决定描边线条的颜色。线条的宽度由\
  \ `lineWidth` 属性决定，该属性可以包含任何正数。\n\n<canvas></canvas>\n\n<script>\n\n  let cx = document.querySelector(\"\
  canvas\").getContext(\"2d\");\n\n  cx.strokeStyle = \"blue\";\n\n  cx.strokeRect(5,\
  \ 5, 50, 50);\n\n  cx.lineWidth = 5;\n\n  cx.strokeRect(135, 5, 50, 50);\n\n</script>\n\
  \n这段代码绘制了两个正方形，第二个使用了更粗的线条。\n\n![Image](img/f0290-01.jpg)\n\n当没有指定 `width` 或 `height`\
  \ 属性时（如本例所示），画布元素默认宽度为 300 像素，高度为 150 像素。\n\n### 路径\n\n路径是一系列线条。2D 画布接口采用了一种独特的方法来描述这样的路径。它完全通过副作用来完成。路径不是可以存储和传递的值。相反，如果你想对路径进行操作，你需要通过一系列方法调用来描述其形状。\n\
  \n<canvas></canvas>\n\n<script>\n\n  let cx = document.querySelector(\"canvas\"\
  ).getContext(\"2d\");\n\n  cx.beginPath();\n\n  for (let y = 10; y < 100; y += 10)\
  \ {\n\n    cx.moveTo(10, y);\n\n    cx.lineTo(90, y);\n\n  }\n\n  cx.stroke();\n\
  \n</script>\n\n这个示例创建了一个包含多条水平线段的路径，然后使用 `stroke` 方法对其进行描边。每个用 `lineTo` 创建的线段都从路径的*当前*位置开始。该位置通常是上一段的终点，除非调用了\
  \ `moveTo`。在这种情况下，下一段将从传递给 `moveTo` 的位置开始。\n\n上一个程序描述的路径如下所示：\n\n![Image](img/f0291-01.jpg)\n\
  \n当填充路径时（使用 `fill` 方法），每个形状会被单独填充。一个路径可以包含多个形状——每次 `moveTo` 动作都会开始一个新形状。但路径需要是*闭合*的（即起点和终点在同一位置）才能被填充。如果路径尚未闭合，则会从其终点到起点添加一条线，然后填充由完整路径包围的形状。\n\
  \n<canvas></canvas>\n\n<script>\n\n  let cx = document.querySelector(\"canvas\"\
  ).getContext(\"2d\");\n\n  cx.beginPath();\n\n  cx.moveTo(50, 10);\n\n  cx.lineTo(10,\
  \ 70);\n\n\n\n```\n  cx.lineTo(90, 70);\n  cx.fill();\n</script>\n```\n\n此示例绘制了一个填充三角形。请注意，三角形的两条边是显式绘制的。第三条边（从右下角回到顶部）是隐含的，当你描边路径时不会出现。\n\
  \n![图片](img/f0291-02.jpg)\n\n你也可以使用 `closePath` 方法，通过添加一条实际线段回到路径起点来显式闭合路径。这条线段在描边路径时*会*被绘制。\n\
  \n### 曲线\n\n路径也可以包含曲线。遗憾的是，绘制曲线稍微复杂一些。\n\n`quadraticCurveTo` 方法绘制一条到给定点的曲线。为了确定曲线的弯曲程度，该方法需要提供一个控制点和一个目标点。可以将这个控制点想象为*吸引*线条，使其产生弯曲。线条不会穿过控制点，但其起点和终点的方向会使得该方向上的直线指向控制点。以下示例说明了这一点：\n\
  \n<canvas></canvas>\n\n```javascript\n  let cx = document.querySelector(\"canvas\"\
  ).getContext(\"2d\");\n  cx.beginPath();\n  cx.moveTo(10, 90);\n  // control=(60,10)\
  \ goal=(90,90)\n  cx.quadraticCurveTo(60, 10, 90, 90);\n  cx.lineTo(60, 10);\n  cx.closePath();\n\
    cx.stroke();\n```\n\n它生成的路径如下所示：\n\n![图片](img/f0292-01.jpg)\n\n我们从左到右绘制一条二次曲线，以\
  \ (60,10) 为控制点，然后绘制两条线段，分别经过该控制点并回到线条起点。结果有点像*星际迷航*的徽章。你可以看到控制点的效果：从下方角落出发的线条起始方向指向控制点，然后弯曲向目标。\n\
  \n`bezierCurveTo` 方法绘制一种类似的曲线。它有两个控制点，而不是一个——每个端点各一个。下面是一个类似的草图，用于说明这种曲线的行为：\n\n\
  <canvas></canvas>\n\n```javascript\n  let cx = document.querySelector(\"canvas\"\
  ).getContext(\"2d\");\n  cx.beginPath();\n  cx.moveTo(10, 90);\n  // control1=(10,10)\
  \ control2=(90,10) goal=(50,90)\n  cx.bezierCurveTo(10, 10, 90, 10, 50, 90);\n  cx.lineTo(90,\
  \ 10);\n  cx.lineTo(10, 10);\n  cx.closePath();\n  cx.stroke();\n```\n\n两个控制点指定了曲线两端的方向。它们离对应点越远，曲线在该方向上的“凸起”就越明显。\n\
  \n![图片](img/f0293-01.jpg)\n\n这类曲线可能难以处理——通常不太容易找到能提供所需形状的控制点。有时你可以计算它们，有时则只能通过反复试验找到合适的值。\n\
  \n`arc` 方法是一种绘制沿圆边缘弯曲的线条的方式。它需要弧心的坐标、半径，以及起始角度和结束角度。\n\n最后两个参数使得只绘制圆的一部分成为可能。角度以弧度为单位，而非度数。这意味着一个完整的圆的角度为\
  \ 2*π*，即 `2 * Math.PI`，约为 6.28。角度从圆心右侧的点开始计数，并沿顺时针方向增加。你可以使用起始角度 0 和大于 2*π* 的结束角度（例如\
  \ 7）来绘制一个完整的圆。\n\n<canvas></canvas>\n\n```javascript\n  let cx = document.querySelector(\"\
  canvas\").getContext(\"2d\");\n  cx.beginPath();\n  // center=(50,50) radius=40\
  \ angle=0 to 7\n  cx.arc(50, 50, 40, 0, 7);\n  // center=(150,50) radius=40 angle=0\
  \ to 1/2 pi\n  cx.arc(150, 50, 40, 0, 0.5 * Math.PI);\n  cx.stroke();\n```\n\n生成的图片包含一条从完整圆的右侧（第一次调用\
  \ `arc`）到四分之一圆的右侧（第二次调用）的线条。与其他路径绘制方法一样，使用 `arc` 绘制的线条会连接到前一个路径段。你可以调用 `moveTo`\
  \ 或开始一个新路径来避免这种情况。\n\n![图片](img/f0294-01.jpg)\n\n### 绘制饼图\n\n假设你刚刚在 EconomiCorp\
  \ 公司找到一份工作，你的第一个任务是绘制其客户满意度调查结果的饼图。\n\n`results` 绑定包含一个对象数组，代表调查回复。\n\n```javascript\n\
  const results = [\n   {name: \"Satisfied\", count: 1043, color: \"lightblue\"},\n\
     {name: \"Neutral\", count: 563, color: \"lightgreen\"},\n   {name: \"Unsatisfied\"\
  , count: 510, color: \"pink\"},\n   {name: \"No comment\", count: 175, color: \"\
  silver\"}\n];\n```\n\n要绘制饼图，我们绘制多个扇形，每个扇形由一条弧和两条到弧心的线段组成。我们可以通过将完整圆（2*π*）除以总回复数，然后将该数值（每个回复的角度）乘以选择某个选项的人数来计算每个弧所占的角度。\n\
  \n<canvas width=\"200\" height=\"200\"></canvas>\n\n```javascript\n  let cx = document.querySelector(\"\
  canvas\").getContext(\"2d\");\n  let total = results\n    .reduce((sum, {count})\
  \ => sum + count, 0);\n  // Start at the top\n  let currentAngle = -0.5 * Math.PI;\n\
    for (let result of results) {\n    let sliceAngle = (result.count / total) * 2\
  \ * Math.PI;\n    cx.beginPath();\n    // center=100,100, radius=100\n    // from\
  \ current angle, clockwise by slice's angle\n    cx.arc(100, 100, 100,\n           currentAngle,\
  \ currentAngle + sliceAngle);\n    currentAngle += sliceAngle;\n    cx.lineTo(100,\
  \ 100);\n    cx.fillStyle = result.color;\n    cx.fill();\n  }\n```\n\n这将绘制出以下图表：\n\
  \n![图片](img/f0295-01.jpg)\n\n但一个不告诉我们扇形含义的图表并没有太大帮助。我们需要一种在画布上绘制文本的方法。\n\n### 文本\n\
  \n2D 画布绘图上下文提供了 `fillText` 和 `strokeText` 方法。后者可用于勾勒字母轮廓，但通常你需要的是 `fillText`。它会用当前的\
  \ `fillStyle` 填充给定文本的轮廓。\n\n<canvas></canvas>\n\n```javascript\n  let cx = document.querySelector(\"\
  canvas\").getContext(\"2d\");\n  cx.font = \"28px Georgia\";\n  cx.fillStyle = \"\
  fuchsia\";\n  cx.fillText(\"I can draw text, too!\", 10, 50);\n```\n\n你可以使用 `font`\
  \ 属性指定文本的大小、样式和字体。此示例仅给出了字体大小和字体族名称。还可以在字符串开头添加斜体或粗体来选择样式。\n\n`fillText` 和 `strokeText`\
  \ 的最后两个参数提供了绘制字体的位置。默认情况下，它们表示文本字母基线（字母“站立”的线，不包括如 *j* 或 *p* 等字母的悬挂部分）的起始位置。你可以通过将\
  \ `textAlign` 属性设置为 `\"end\"` 或 `\"center\"` 来改变水平位置，通过将 `textBaseline` 设置为 `\"\
  top\"`、`\"middle\"` 或 `\"bottom\"` 来改变垂直位置。\n\n我们将在本章末尾的练习中回到饼图以及标记扇形的问题。\n\n###\
  \ 图像\n\n在计算机图形学中，通常区分*矢量*图形和*位图*图形。前者是本章到目前为止一直在做的——通过给出形状的逻辑描述来指定图片。而位图图形则不指定实际形状，而是处理像素数据（彩色点的光栅）。\n\
  \n`drawImage` 方法允许我们将像素数据绘制到画布上。这些像素数据可以来自 `<img>` 元素或另一个画布。以下示例创建了一个独立的 `<img>`\
  \ 元素并将图像文件加载到其中。但它不能立即开始从此图片绘制，因为浏览器可能尚未加载它。为了解决这个问题，我们注册一个 `\"load\"` 事件处理程序，并在图像加载完成后进行绘制。\n\
  \n<canvas></canvas>\n\n```javascript\n  let cx = document.querySelector(\"canvas\"\
  ).getContext(\"2d\");\n  let img = document.createElement(\"img\");\n  img.src =\
  \ \"img/hat.png\";\n  img.addEventListener(\"load\", () => {\n    for (let x = 10;\
  \ x < 200; x += 30) {\n```\n\n\n\n\n\n```\n      cx.drawImage(img, x, 10);\n\n \
  \   }\n\n  });\n\n</script>\n```\n\n默认情况下，`drawImage` 会以原始尺寸绘制图像。你也可以传入两个额外参数来设置不同的宽度和高度。\n\
  \n当 `drawImage` 被传入*九个*参数时，它可以用来仅绘制图像的一部分。第二到第五个参数指定源图像中要复制的矩形区域（`x`、`y`、`width`\
  \ 和 `height`），第六到第九个参数指定画布上要复制到的矩形区域。\n\n这可以用来将多个*精灵图*（图像元素）打包到单个图像文件中，然后只绘制需要的部分。例如，我们有一张包含多个姿势的游戏角色图片：\n\
  \n![图像](img/f0296-01.jpg)\n\n通过交替绘制不同的姿势，我们可以展示一个看起来像行走角色的动画。\n\n要在画布上为图片制作动画，`clearRect`\
  \ 方法非常有用。它类似于 `fillRect`，但不是给矩形着色，而是使其透明，从而移除之前绘制的像素。\n\n我们知道每个*精灵图*（每个子图片）宽 24\
  \ 像素，高 30 像素。以下代码加载图像，然后设置一个间隔（重复定时器）来绘制下一帧：\n\n```\n<canvas></canvas>\n\n<script>\n\
  \  let cx = document.querySelector(\"canvas\").getContext(\"2d\");\n  let img =\
  \ document.createElement(\"img\");\n  img.src = \"img/player.png\";\n  let spriteW\
  \ = 24, spriteH = 30;\n  img.addEventListener(\"load\", () => {\n    let cycle =\
  \ 0;\n    setInterval(() => {\n      cx.clearRect(0, 0, spriteW, spriteH);\n   \
  \   cx.drawImage(img,\n                   // 源矩形\n                  cycle * spriteW,\
  \ 0, spriteW, spriteH,\n                   // 目标矩形\n                  0,       \
  \        0, spriteW, spriteH);\n     cycle = (cycle + 1) % 8;\n   }, 120);\n  });\n\
  </script>\n```\n\n`cycle` 绑定跟踪我们在动画中的位置。每一帧，它都会递增，然后通过取余运算符将其限制在 0 到 7 的范围内。然后使用这个绑定来计算当前姿势的精灵图在图片中的\
  \ x 坐标。\n\n### 变换\n\n但如果我们希望角色向左走而不是向右走呢？当然，我们可以绘制另一组精灵图。但我们也可以指示画布以相反方向绘制图片。\n\n\
  调用 `scale` 方法会导致其后绘制的所有内容按比例缩放。该方法接受两个参数，一个设置水平缩放，一个设置垂直缩放。\n\n```\n<canvas></canvas>\n\
  \n<script>\n  let cx = document.querySelector(\"canvas\").getContext(\"2d\");\n\
  \  cx.scale(3, .5);\n  cx.beginPath();\n  cx.arc(50, 50, 40, 0, 7);\n  cx.lineWidth\
  \ = 3;\n  cx.stroke();\n</script>\n```\n\n由于调用了 `scale`，圆被绘制成三倍宽、一半高。\n\n![图像](img/f0297-01.jpg)\n\
  \n缩放会导致绘制图像的所有属性（包括线宽）按指定方式拉伸或压缩。负值缩放会翻转图片。翻转发生在点 (0,0) 处，这意味着它也会翻转坐标系的方向。当应用水平缩放\
  \ –1 时，在 x 位置 100 处绘制的形状最终会出现在原来的位置 –100 处。\n\n因此，要翻转图片，我们不能简单地在调用 `drawImage` 之前添加\
  \ `cx.scale(-1, 1)`，因为那样会将图片移出画布，使其不可见。你可以调整传递给 `drawImage` 的坐标来补偿，例如在 x 位置 –50\
  \ 而不是 0 处绘制图像。另一种不需要绘制代码了解缩放变化的解决方案是调整缩放发生的轴。\n\n除了 `scale` 之外，还有其他几种方法会影响画布的坐标系。你可以使用\
  \ `rotate` 方法旋转随后绘制的形状，使用 `translate` 方法移动它们。有趣且令人困惑的是，这些变换会*叠加*，意味着每个变换都相对于之前的变换发生。\n\
  \n因此，如果我们两次 `translate` 水平 10 像素，所有内容都会向右绘制 20 像素。如果我们先将坐标系中心移动到 (50,50)，然后 `rotate`\
  \ 20 度（约 0.1*π* 弧度），那么旋转将*围绕*点 (50,50) 发生。\n\n![图像](img/f0298-01.jpg)\n\n但如果我们*先*\
  \ `rotate` 20 度，*然后* `translate` (50,50)，那么平移将在旋转后的坐标系中发生，从而产生不同的方向。变换应用的顺序很重要。\n\
  \n要围绕给定 x 位置的垂直线翻转图片，我们可以执行以下操作：\n\n```\nfunction flipHorizontally(context, around)\
  \ {\n  context.translate(around, 0);\n  context.scale(-1, 1);\n  context.translate(-around,\
  \ 0);\n}\n```\n\n我们将 y 轴移动到镜像所在的位置，应用镜像，最后将 y 轴移回镜像宇宙中的正确位置。下图解释了为什么这样有效。\n\n![图像](img/f0299-01.jpg)\n\
  \n这显示了在中心线镜像前后的坐标系。三角形用数字编号以说明每一步。如果我们在正 x 位置绘制一个三角形，默认情况下它会位于三角形 1 的位置。调用 `flipHorizontally`\
  \ 首先执行向右的 `translate`，到达三角形 2。然后执行 `scale`，将三角形翻转到位置 3。如果它要在给定线上镜像，这还不是它应该在的位置。第二次\
  \ `translate` 调用解决了这个问题——它“取消”了初始平移，使三角形 4 恰好出现在它应该在的位置。\n\n现在，我们可以通过围绕角色的垂直中心翻转世界，在位置\
  \ (100,0) 处绘制一个镜像角色。\n\n```\n<canvas></canvas>\n\n<script>\n  let cx = document.querySelector(\"\
  canvas\").getContext(\"2d\");\n  let img = document.createElement(\"img\");\n  img.src\
  \ = \"img/player.png\";\n  let spriteW = 24, spriteH = 30;\n  img.addEventListener(\"\
  load\", () => {\n    flipHorizontally(cx, 100 + spriteW / 2);\n    cx.drawImage(img,\
  \ 0, 0, spriteW, spriteH,\n                 100, 0, spriteW, spriteH);\n  });\n\
  </script>\n```\n\n### 存储与清除变换\n\n变换会持续存在。在绘制镜像角色之后绘制的其他所有内容也会被镜像。这可能不方便。\n\n可以保存当前变换，进行一些绘制和变换，然后恢复旧的变换。对于需要临时变换坐标系的函数来说，这通常是正确的做法。首先，我们保存调用该函数的代码所使用的任何变换。然后函数执行其操作，在当前变换之上添加更多变换。最后，我们恢复到开始时的变换。\n\
  \n2D 画布上下文上的 `save` 和 `restore` 方法负责这种变换管理。它们在概念上维护一个变换状态栈。当你调用 `save` 时，当前状态被压入栈中；当你调用\
  \ `restore` 时，栈顶的状态被取出并用作上下文的当前变换。你也可以调用 `resetTransform` 来完全重置变换。\n\n以下示例中的 `branch`\
  \ 函数说明了你可以用改变变换然后调用函数（此处是自身）的函数做什么，该函数继续使用给定的变换进行绘制。\n\n该函数通过绘制一条线，然后将坐标系中心移动到线的末端，然后调用自身两次——先向左旋转，再向右旋转——来绘制一个树状形状。每次调用都会减少绘制的分支长度，当长度小于\
  \ 8 时递归停止。\n\n```\n<canvas width=\"600\" height=\"300\"></canvas>\n\n<script>\n\
  \  let cx = document.querySelector(\"canvas\").getContext(\"2d\");\n  function branch(length,\
  \ angle, scale) {\n```\n\n\n\n\n```\n    cx.fillRect(0, 0, 1, length);\n\n    if\
  \ (length < 8) return;\n\n    cx.save();\n\n    cx.translate(0, length);\n\n   \
  \ cx.rotate(-angle);\n\n    branch(length * scale, angle, scale);\n\n    cx.rotate(2\
  \ * angle);\n\n    branch(length * scale, angle, scale);\n\n    cx.restore();\n\n\
  \  }\n\n  cx.translate(300, 0);\n\n  branch(60, 0.5, 0.8);\n\n</script>\n```\n\n\
  结果是一个简单的分形。\n\n![Image](img/f0300-01.jpg)\n\n如果没有调用 `save` 和 `restore`，那么对 `branch`\
  \ 的第二次递归调用将沿用第一次调用所产生的位置和旋转。它不会连接到当前分支，而是连接到第一次调用所绘制的最内层、最右侧的分支。最终形状可能也很有趣，但肯定不是一棵树。\n\
  \n### 回到游戏\n\n我们现在对画布绘制有了足够的了解，可以开始为上一章的游戏开发一个基于画布的显示系统了。新的显示将不再仅仅显示彩色方块。相反，我们将使用\
  \ `drawImage` 来绘制代表游戏元素的图片。\n\n我们定义了另一种显示对象类型 `CanvasDisplay`，它支持与第 273 页“绘制”中 `DOMDisplay`\
  \ 相同的接口，即 `syncState` 和 `clear` 方法。\n\n该对象比 `DOMDisplay` 保存了更多信息。它不使用 DOM 元素的滚动位置，而是跟踪自己的视口，告诉我们当前正在查看关卡的哪一部分。最后，它还保留了一个\
  \ `flipPlayer` 属性，这样即使玩家静止不动，它也会保持上次移动的方向。\n\n```javascript\nclass CanvasDisplay\
  \ {\n\n  constructor(parent, level) {\n\n    this.canvas = document.createElement(\"\
  canvas\");\n\n    this.canvas.width = Math.min(600, level.width * scale);\n\n  \
  \  this.canvas.height = Math.min(450, level.height * scale);\n\n    parent.appendChild(this.canvas);\n\
  \n    this.cx = this.canvas.getContext(\"2d\");\n\n    this.flipPlayer = false;\n\
  \n    this.viewport = {\n\n      left: 0,\n\n      top: 0,\n\n      width: this.canvas.width\
  \ / scale,\n\n      height: this.canvas.height / scale\n\n    };\n\n  }\n\n  clear()\
  \ {\n\n    this.canvas.remove();\n\n }\n\n}\n```\n\n`syncState` 方法首先计算新的视口，然后在适当的位置绘制游戏场景。\n\
  \n```javascript\nCanvasDisplay.prototype.syncState = function(state) {\n\n   this.updateViewport(state);\n\
  \n   this.clearDisplay(state.status);\n\n   this.drawBackground(state.level);\n\n\
  \   this.drawActors(state.actors);\n\n};\n```\n\n与 `DOMDisplay` 相反，这种显示样式*确实*需要在每次更新时重新绘制背景。因为画布上的形状只是像素，绘制后没有好的方法移动它们（或删除它们）。更新画布显示的唯一方法是清除它并重新绘制场景。我们可能还进行了滚动，这需要背景位于不同的位置。\n\
  \n`updateViewport` 方法类似于 `DOMDisplay` 的 `scrollPlayerIntoView` 方法。它检查玩家是否太靠近屏幕边缘，并在必要时移动视口。\n\
  \n```javascript\nCanvasDisplay.prototype.updateViewport = function(state) {\n\n\
  \  let view = this.viewport, margin = view.width / 3;\n\n  let player = state.player;\n\
  \n  let center = player.pos.plus(player.size.times(0.5));\n\n  if (center.x < view.left\
  \ + margin) {\n\n    view.left = Math.max(center.x - margin, 0);\n\n  } else if\
  \ (center.x > view.left + view.width - margin) {\n\n    view.left = Math.min(center.x\
  \ + margin - view.width,\n\n                         state.level.width - view.width);\n\
  \n  }\n\n  if (center.y < view.top + margin) {\n\n    view.top = Math.max(center.y\
  \ - margin, 0);\n\n  } else if (center.y > view.top + view.height - margin) {\n\n\
  \    view.top = Math.min(center.y + margin - view.height,\n\n                  \
  \      state.level.height - view.height);\n\n  }\n\n};\n```\n\n对 `Math.max` 和 `Math.min`\
  \ 的调用确保视口不会显示关卡之外的空间。`Math.max(x, 0)` 确保结果数字不小于零。`Math.min` 同样保证值保持在给定边界以下。\n\n\
  清除显示时，我们将根据游戏是获胜（更亮）还是失败（更暗）使用略有不同的颜色。\n\n```javascript\nCanvasDisplay.prototype.clearDisplay\
  \ = function(status) {\n\n   if (status == \"won\") {\n\n     this.cx.fillStyle\
  \ = \"rgb(68, 191, 255)\";\n\n   } else if (status == \"lost\") {\n\n     this.cx.fillStyle\
  \ = \"rgb(44, 136, 214)\";\n\n   } else {\n\n     this.cx.fillStyle = \"rgb(52,\
  \ 166, 251)\";\n\n   }\n\n   this.cx.fillRect(0, 0,\n\n                    this.canvas.width,\
  \ this.canvas.height);\n\n};\n```\n\n为了绘制背景，我们遍历当前视口中可见的瓦片，使用与上一章 `touches` 方法相同的技巧。\n\
  \n```javascript\nlet otherSprites = document.createElement(\"img\");\n\notherSprites.src\
  \ = \"img/sprites.png\";\n\nCanvasDisplay.prototype.drawBackground = function(level)\
  \ {\n\n  let {left, top, width, height} = this.viewport;\n\n  let xStart = Math.floor(left);\n\
  \n  let xEnd = Math.ceil(left + width);\n\n  let yStart = Math.floor(top);\n\n \
  \ let yEnd = Math.ceil(top + height);\n\n  for (let y = yStart; y < yEnd; y++) {\n\
  \n    for (let x = xStart; x < xEnd; x++) {\n\n      let tile = level.rows[y][x];\n\
  \n      if (tile == \"empty\") continue;\n\n      let screenX = (x - left) * scale;\n\
  \n      let screenY = (y - top) * scale;\n\n      let tileX = tile == \"lava\" ?\
  \ scale : 0;\n\n      this.cx.drawImage(otherSprites,\n\n                      \
  \  tileX,        0, scale, scale,\n\n                        screenX, screenY, scale,\
  \ scale);\n\n    }\n\n   }\n\n};\n```\n\n非空的瓦片使用 `drawImage` 绘制。`otherSprites` 图片包含用于玩家之外的其他元素的图片。从左到右依次是墙壁瓦片、熔岩瓦片和硬币的精灵图。\n\
  \n![Image](img/f0303-01.jpg)\n\n背景瓦片是 20×20 像素，因为我们使用与 `DOMDisplay` 相同的缩放比例。因此，熔岩瓦片的偏移量为\
  \ 20（`scale` 绑定的值），墙壁的偏移量为 0。\n\n我们不需要等待精灵图片加载完成。使用尚未加载的图片调用 `drawImage` 将什么也不做。因此，在图片仍在加载的前几帧中，我们可能无法正确绘制游戏，但这并不是一个严重的问题。由于我们不断更新屏幕，一旦加载完成，正确的场景就会出现。\n\
  \n前面展示的行走角色将用于表示玩家。绘制它的代码需要根据玩家当前的运动选择正确的精灵和方向。前八个精灵包含行走动画。当玩家在地面上移动时，我们根据当前时间循环显示它们。我们希望每\
  \ 60 毫秒切换一帧，因此先将时间除以 60。当玩家静止时，我们绘制第九个精灵。在跳跃期间（通过垂直速度不为零来识别），我们使用第十个（最右侧的）精灵。\n\n\
  由于精灵比玩家对象稍宽——24 像素而不是 16 像素，以便为脚和手臂留出空间——该方法必须按给定数量（`playerXOverlap`）调整 x 坐标和宽度。\n\
  \n```javascript\nlet playerSprites = document.createElement(\"img\");\n\nplayerSprites.src\
  \ = \"img/player.png\";\n\nconst playerXOverlap = 4;\n\nCanvasDisplay.prototype.drawPlayer\
  \ = function(player, x, y,\n\n                                              width,\
  \ height){\n\n  width += playerXOverlap * 2;\n\n  x -= playerXOverlap;\n\n  if (player.speed.x\
  \ != 0) {\n\n    this.flipPlayer = player.speed.x < 0;\n\n  }\n\n  let tile = 8;\n\
  \n  if (player.speed.y != 0) {\n\n    tile = 9;\n\n  } else if (player.speed.x !=\
  \ 0) {\n\n    tile = Math.floor(Date.now() / 60) % 8;\n\n  }\n\n  this.cx.save();\n\
  \n  if (this.flipPlayer) {\n\n    flipHorizontally(this.cx, x + width / 2);\n\n\
  \  }\n\n  let tileX = tile * width;\n\n  this.cx.drawImage(playerSprites, tileX,\
  \ 0, width, height,\n\n                                   x,     y, width, height);\n\
  \n  this.cx.restore();\n\n};\n```\n\n\n\n`drawPlayer` 方法由 `drawActors` 调用，后者负责绘制游戏中的所有角色。\n\
  \n```javascript\nCanvasDisplay.prototype.drawActors = function(actors) {\n\n  for\
  \ (let actor of actors) {\n\n    let width = actor.size.x * scale;\n\n    let height\
  \ = actor.size.y * scale;\n\n    let x = (actor.pos.x - this.viewport.left) * scale;\n\
  \n    let y = (actor.pos.y - this.viewport.top) * scale;\n\n    if (actor.type ==\
  \ \"player\") {\n\n      this.drawPlayer(actor, x, y, width, height);\n\n    } else\
  \ {\n\n      let tileX = (actor.type == \"coin\" ? 2 : 1) * scale;\n\n      this.cx.drawImage(otherSprites,\n\
  \n                        tileX, 0, width, height,\n\n                        x,\
  \     y, width, height);\n\n    }\n\n  }\n\n};\n```\n\n当绘制非玩家角色时，我们根据其类型查找正确精灵的偏移量。熔岩瓦片位于偏移量\
  \ 20 处，硬币精灵位于 40 处（两倍缩放）。\n\n在计算角色位置时，我们必须减去视口的位置，因为画布上的 (0,0) 对应的是视口的左上角，而非关卡的左上角。我们也可以使用\
  \ `translate` 来实现这一点。两种方法都可行。\n\n至此，新的显示系统介绍完毕。最终的游戏效果如下图所示：\n\n![Image](img/f0305-01.jpg)\n\
  \n### 选择图形接口\n\n因此，当需要在浏览器中生成图形时，你可以选择纯 HTML、SVG 或 canvas。没有一种适用于所有情况的*最佳*方法。每种方案都有其优缺点。\n\
  \n纯 HTML 的优势在于简单，并且与文本集成良好。SVG 和 canvas 都可以绘制文本，但它们不会帮助你定位文本或在文本超过一行时自动换行。在基于 HTML\
  \ 的图片中，包含文本块要容易得多。\n\nSVG 可以生成在任何缩放级别下都清晰锐利的图形。与 HTML 不同，它专为绘图而设计，因此更适合此目的。\n\n\
  SVG 和 HTML 都会构建一个表示图片的数据结构（DOM）。这使得在绘制元素后可以修改它们。如果你需要根据用户操作或作为动画的一部分反复更改大图片中的一小部分，使用\
  \ canvas 可能会产生不必要的开销。DOM 还允许我们在图片中的每个元素上注册鼠标事件处理程序（甚至包括用 SVG 绘制的形状）。而 canvas 无法做到这一点。\n\
  \n但是，当绘制大量微小元素时，canvas 的像素导向方法可能是一个优势。它不构建数据结构，而是反复在同一像素表面上绘制，这使得每个形状的成本更低。\n\n\
  还有一些效果，例如逐像素渲染场景（例如使用光线追踪器）或使用 JavaScript 对图像进行后处理（模糊或扭曲），这些效果只能通过基于像素的方法来实现。\n\n\
  在某些情况下，你可能希望结合使用这些技术。例如，你可以用 SVG 或 canvas 绘制图表，但通过在图片上方定位一个 HTML 元素来显示文本信息。\n\n\
  对于要求不高的应用，选择哪种接口其实并不重要。我们在本章中为游戏构建的显示系统可以使用这三种图形技术中的任何一种来实现，因为它不需要绘制文本、处理鼠标交互或处理数量极其庞大的元素。\n\
  \n### 总结\n\n在本章中，我们讨论了在浏览器中绘制图形的技术，重点介绍了 `<canvas>` 元素。\n\ncanvas 节点代表文档中的一个区域，我们的程序可以在该区域上绘制。这种绘制是通过使用\
  \ `getContext` 方法创建的绘图上下文对象来完成的。\n\n2D 绘图接口允许我们填充和描边各种形状。上下文的 `fillStyle` 属性决定了形状的填充方式。`strokeStyle`\
  \ 和 `lineWidth` 属性控制线条的绘制方式。\n\n矩形和文本片段可以通过单个方法调用绘制。`fillRect` 和 `strokeRect` 方法绘制矩形，`fillText`\
  \ 和 `strokeText` 方法绘制文本。要创建自定义形状，我们必须首先构建一条路径。\n\n调用 `beginPath` 开始一条新路径。许多其他方法会向当前路径添加直线和曲线。例如，`lineTo`\
  \ 可以添加一条直线。路径完成后，可以使用 `fill` 方法填充，或使用 `stroke` 方法描边。\n\n使用 `drawImage` 方法可以将图像或其他\
  \ canvas 中的像素移动到我们的 canvas 上。默认情况下，此方法绘制整个源图像，但通过提供更多参数，你可以复制图像的特定区域。我们在游戏中使用了这一点，从包含多个游戏角色姿势的图像中复制单个姿势。\n\
  \n变换允许你以多种方向绘制形状。2D 绘图上下文有一个当前变换，可以通过 `translate`、`scale` 和 `rotate` 方法更改。这些方法会影响所有后续的绘制操作。变换状态可以通过\
  \ `save` 方法保存，并通过 `restore` 方法恢复。\n\n在 canvas 上显示动画时，可以使用 `clearRect` 方法在重新绘制之前清除\
  \ canvas 的一部分。\n\n### 练习\n\n#### 形状\n\n编写一个程序，在 canvas 上绘制以下形状：\n\n1.  一个梯形（一边较宽的矩形）\n\
  \n2.  一个红色菱形（旋转 45 度或 ¼*π* 弧度的矩形）\n\n3.  一条锯齿线\n\n4.  由 100 条直线段组成的螺旋线\n\n5.  一颗黄色星星\n\
  \n![Image](img/f0307-01.jpg)\n\n在绘制最后两个形状时，你可能需要参考第 240 页“定位与动画”中对 `Math.cos` 和\
  \ `Math.sin` 的解释，该部分描述了如何使用这些函数获取圆上的坐标。\n\n我建议为每个形状创建一个函数。将位置以及可选的属性（如大小或点数）作为参数传递。另一种方法是在代码中硬编码数字，这往往会使代码难以阅读和修改。\n\
  \n#### 饼图\n\n在第 294 页“绘制饼图”中，我们看到了一个绘制饼图的示例程序。修改此程序，使每个类别的名称显示在其对应扇区旁边。尝试找到一种美观的方式来自动定位这些文本，使其也适用于其他数据集。你可以假设类别足够大，可以为标签留出充足的空间。\n\
  \n你可能再次需要 `Math.sin` 和 `Math.cos`，它们在第 240 页“定位与动画”中有描述。\n\n#### 弹跳球\n\n使用我们在第 14\
  \ 章和第 16 章中看到的 `requestAnimationFrame` 技术，绘制一个带有弹跳球的盒子。球以恒定速度移动，并在碰到盒子边缘时反弹。\n\n\
  #### 预计算镜像\n\n变换的一个缺点是它们会减慢位图的绘制速度。每个像素的位置和大小都需要进行变换，尽管浏览器未来可能会在变换方面变得更智能，但目前它们会导致绘制位图所需的时间明显增加。\n\
  \n在我们这样的游戏中，我们只绘制单个变换后的精灵，这不成问题。但想象一下，我们需要绘制数百个角色或数千个来自爆炸的旋转粒子。\n\n思考一种方法，使我们能够在不加载额外图像文件且不必每帧都进行变换后的\
  \ `drawImage` 调用的情况下，绘制一个反转的角色。\n\n“通信本质上必须是无状态的……这样每个从客户端到服务器的请求都必须包含理解该请求所需的所有信息，并且不能利用服务器上任何存储的上下文。”\n\
  \n—— 罗伊·菲尔丁，《架构风格与设计》\n\n\n\n基于网络的软件架构*\n\n![Image](img/f0310-01.jpg)\n\n## 18\n\
  \nHTTP 与表单\n\n*超文本传输协议*（已在第 13 章中提及）是万维网上请求和提供数据的机制。本章将更详细地描述该协议，并解释浏览器 JavaScript\
  \ 如何访问它。\n\n### 协议\n\n如果你在浏览器的地址栏中输入 `*eloquentjavascript.net/18_http.html*`，浏览器首先会查找与\
  \ `*eloquentjavascript.net*` 关联的服务器地址，并尝试在端口 80（HTTP 流量的默认端口）上打开一个 TCP 连接。如果服务器存在并接受连接，浏览器可能会发送类似这样的内容：\n\
  \n```\nGET /18_http.html HTTP/1.1\nHost: eloquentjavascript.net\nUser-Agent: Your\
  \ browser's name\n```\n\n然后，服务器通过同一连接响应：\n\n```\nHTTP/1.1 200 OK\nContent-Length:\
  \ 65585\nContent-Type: text/html\nLast-Modified: Mon, 07 Jan 2019 10:29:45 GMT\n\
  \n<!doctype html>\n... 文档的其余部分\n```\n\n浏览器会获取响应中空白行之后的部分，即其*主体*（不要与 HTML 的 `<body>`\
  \ 标签混淆），并将其作为 HTML 文档显示。\n\n客户端发送的信息称为*请求*。它以这一行开头：\n\n```\nGET /18_http.html HTTP/1.1\n\
  ```\n\n第一个词是请求的*方法*。`GET` 表示我们想要*获取*指定的资源。其他常见的方法有 `DELETE`（删除资源）、`PUT`（创建或替换资源）和\
  \ `POST`（向资源发送信息）。请注意，服务器没有义务执行它收到的每一个请求。如果你随便访问一个网站并告诉它 `DELETE` 其主页，它很可能会拒绝。\n\
  \n方法名之后的部分是请求所针对的*资源*路径。在最简单的情况下，资源就是服务器上的一个文件，但协议并不要求如此。资源可以是任何可以*像*文件一样传输的东西。许多服务器会动态生成它们产生的响应。例如，如果你打开\
  \ `[`github.com/marijnh`](https://github.com/marijnh)`，服务器会在其数据库中查找名为 `marijnh`\
  \ 的用户，如果找到，就会为该用户生成一个个人资料页面。\n\n在资源路径之后，请求的第一行提到了 `HTTP/1.1`，以表明它使用的 HTTP 协议版本。\n\
  \n实际上，许多网站使用 HTTP 版本 2，它支持与版本 1.1 相同的概念，但复杂得多，因此可以更快。浏览器在与特定服务器通信时会自动切换到适当的协议版本，无论使用哪个版本，请求的结果都是相同的。由于版本\
  \ 1.1 更直接且更容易操作，我们将重点介绍它。\n\n服务器的响应也会以版本号开头，然后是响应的状态，首先是一个三位数的状态码，接着是一个人类可读的字符串。\n\
  \n```\nHTTP/1.1 200 OK\n```\n\n以 2 开头的状态码表示请求成功。以 4 开头的状态码表示请求有问题。`404` 可能是最著名的\
  \ HTTP 状态码——它表示找不到资源。以 5 开头的状态码表示服务器发生了错误，而不是请求的问题。\n\n请求或响应的第一行后面可以跟任意数量的*标头*。这些是形如\
  \ `name: value` 的行，用于指定关于请求或响应的额外信息。以下标头是示例响应的一部分：\n\n```\nContent-Length: 65585\n\
  Content-Type: text/html\nLast-Modified: Thu, 04 Jan 2018 14:05:30 GMT\n```\n\n这告诉我们响应文档的大小和类型。在这种情况下，它是一个\
  \ 65,585 字节的 HTML 文档。它还告诉我们该文档的最后修改时间。\n\n对于大多数标头，客户端和服务器可以自由决定是否将其包含在请求或响应中。但有些是必需的。例如，指定主机名的\
  \ `Host` 标头应包含在请求中，因为一个服务器可能在一个 IP 地址上服务多个主机名，如果没有该标头，服务器将不知道客户端试图与哪个主机名通信。\n\n\
  在标头之后，请求和响应都可能包含一个空行，后面跟着主体，其中包含正在发送的数据。`GET` 和 `DELETE` 请求不发送任何数据，但 `PUT` 和 `POST`\
  \ 请求会发送。同样，某些响应类型（如错误响应）不需要主体。\n\n### 浏览器与 HTTP\n\n正如我们在示例中看到的，当我们在地址栏中输入 URL 时，浏览器会发出一个请求。当生成的\
  \ HTML 页面引用其他文件（如图像和 JavaScript 文件）时，这些文件也会被检索。\n\n一个中等复杂的网站很容易包含 10 到 200 个资源。为了能够快速获取这些资源，浏览器会同时发出多个\
  \ `GET` 请求，而不是逐个等待响应。\n\nHTML 页面可能包含*表单*，允许用户填写信息并将其发送到服务器。这是一个表单示例：\n\n```html\n\
  <form method=\"GET\" action=\"example/message.html\">\n  <p>Name: <input type=\"\
  text\" name=\"name\"></p>\n  <p>Message:<br><textarea name=\"message\"></textarea></p>\n\
  \  <p><button type=\"submit\">Send</button></p>\n</form>\n```\n\n这段代码描述了一个包含两个字段的表单：一个用于输入姓名的小字段，另一个用于编写消息的大字段。当你点击发送按钮时，表单会被*提交*，这意味着其字段的内容会被打包成一个\
  \ HTTP 请求，浏览器会导航到该请求的结果。\n\n当 `<form>` 元素的 `method` 属性为 `GET`（或省略）时，表单中的信息会作为*查询字符串*附加到\
  \ action URL 的末尾。浏览器可能会向这个 URL 发出请求：\n\n```\nGET /example/message.html?name=Jean&message=Yes%3F\
  \ HTTP/1.1\n```\n\n问号表示 URL 路径部分的结束和查询的开始。后面跟着名称和值的配对，分别对应表单字段元素的 `name` 属性和这些元素的内容。使用与号（`&`）分隔这些配对。\n\
  \nURL 中编码的实际消息是 `Yes?`，但问号被一个奇怪的代码替换了。查询字符串中的某些字符必须被转义。问号（表示为 `%3F`）就是其中之一。似乎有一条不成文的规则，即每种格式都需要自己的字符转义方式。这种称为*URL\
  \ 编码*的方式使用百分号后跟两个十六进制（基数为 16）数字来编码字符代码。在这种情况下，`3F`（十进制为 63）是问号字符的代码。JavaScript 提供了\
  \ `encodeURIComponent` 和 `decodeURIComponent` 函数来编码和解码这种格式。\n\n```javascript\nconsole.log(encodeURIComponent(\"\
  Yes?\"));\n// → Yes%3F\nconsole.log(decodeURIComponent(\"Yes%3F\"));\n// → Yes?\n\
  ```\n\n如果我们把之前看到的 HTML 表单的 `method` 属性改为 `POST`，那么提交表单的 HTTP 请求将使用 `POST` 方法，并将查询字符串放在请求的主体中，而不是添加到\
  \ URL 中。\n\n```\nPOST /example/message.html HTTP/1.1\nContent-length: 24\nContent-type:\
  \ application/x-www-form-urlencoded\n\nname=Jean&message=Yes%3F\n```\n\n`GET` 请求应用于没有副作用、仅请求信息的请求。那些会改变服务器上内容的请求（例如创建新账户或发布消息）应使用其他方法（如\
  \ `POST`）来表达。客户端软件（如浏览器）知道不应盲目地发出 `POST` 请求，但通常会隐式地发出 `GET` 请求——例如，预取它认为用户很快会需要的资源。\n\
  \n我们将在第 317 页的“表单字段”中回到表单以及如何从 JavaScript 与它们交互。\n\n### Fetch\n\n\n\n\n浏览器 JavaScript\
  \ 发起 HTTP 请求的接口叫做 `fetch`。由于它相对较新，方便地使用了 Promise（这在浏览器接口中很少见）。\n\n```\nfetch(\"\
  example/data.txt\").then(response => {\n\n  console.log(response.status);\n\n  //\
  \ → 200\n\n  console.log(response.headers.get(\"Content-Type\"));\n\n  // → text/plain\n\
  \n});\n```\n\n调用 `fetch` 会返回一个 Promise，该 Promise 解析为一个 `Response` 对象，其中包含关于服务器响应的信息，例如状态码和标头。标头被封装在一个类似\
  \ Map 的对象中，该对象将其键（标头名称）视为不区分大小写，因为标头名称本就不应区分大小写。这意味着 `headers.get(\"Content-Type\"\
  )` 和 `headers.get(\"content-TYPE\")` 会返回相同的值。\n\n请注意，即使服务器返回了错误码，`fetch` 返回的 Promise\
  \ 也会成功解析。如果出现网络错误或无法找到请求所指向的服务器，它*可能*会被拒绝。\n\n`fetch` 的第一个参数是要请求的 URL。当该 URL 不以协议名称（如\
  \ `http:`）开头时，它被视为`相对` URL，这意味着它是相对于当前文档进行解释的。当它以斜杠（`/`）开头时，它会替换当前路径（即服务器名称之后的部分）。当它不以斜杠开头时，当前路径中直到并包括最后一个斜杠字符的部分会被放在相对\
  \ URL 的前面。\n\n要获取响应的实际内容，可以使用其 `text` 方法。由于初始 Promise 在收到响应标头时就会解析，并且读取响应正文可能需要更长时间，因此该方法会再次返回一个\
  \ Promise。\n\n```\nfetch(\"example/data.txt\")\n\n  .then(resp => resp.text())\n\
  \n  .then(text => console.log(text));\n\n// → This is the content of data.txt\n\
  ```\n\n一个类似的方法叫做 `json`，它返回一个 Promise，该 Promise 解析为将正文解析为 JSON 后得到的值，如果 JSON 无效则拒绝。\n\
  \n默认情况下，`fetch` 使用 `GET` 方法发起请求，并且不包含请求正文。你可以通过传递一个包含额外选项的对象作为第二个参数来进行不同配置。例如，以下请求尝试删除\
  \ `example/data.txt`：\n\n```\nfetch(\"example/data.txt\", {method: \"DELETE\"}).then(resp\
  \ => {\n\n  console.log(resp.status);\n\n  // → 405\n\n});\n```\n\n状态码 405 表示“方法不允许”，这是\
  \ HTTP 服务器表达“我做不到”的方式。\n\n要添加请求正文，可以包含一个 `body` 选项。要设置标头，可以使用 `headers` 选项。例如，以下请求包含一个\
  \ `Range` 标头，指示服务器仅返回响应的一部分。\n\n```\nfetch(\"example/data.txt\", {headers: {Range:\
  \ \"bytes=8-19\"}})\n\n  .then(resp => resp.text())\n\n  .then(console.log);\n\n\
  // → the content\n```\n\n浏览器会自动添加一些请求标头，例如 `Host` 以及服务器确定正文大小所需的标头。但添加自己的标头通常很有用，例如包含身份验证信息或告诉服务器你希望接收哪种文件格式。\n\
  \n### HTTP 沙箱\n\n在网页脚本中发起 HTTP 请求再次引发了安全问题。控制脚本的人可能与运行脚本的计算机用户利益不一致。更具体地说，如果我访问\
  \ `themafia.org`，我不希望它的脚本能够使用我浏览器中的身份信息向 [`mybank.com`](http://mybank.com) 发起请求，并指示将我所有的钱转移到某个随机账户。\n\
  \n因此，浏览器通过禁止脚本向其他域（例如 `themafia.org` 和 `mybank.com` 这样的名称）发起 HTTP 请求来保护我们。\n\n当构建需要合法访问多个域的系统时，这可能是一个令人烦恼的问题。幸运的是，服务器可以在其响应中包含如下标头，以明确向浏览器表明允许来自其他域的请求：\n\
  \n`Access-Control-Allow-Origin: *`\n\n### 理解 HTTP\n\n当构建一个需要浏览器中运行的 JavaScript 程序（客户端）与服务器上的程序（服务器端）进行通信的系统时，有几种不同的方式来建模这种通信。\n\
  \n一种常用的模型是*远程过程调用*。在这种模型中，通信遵循普通函数调用的模式，只是函数实际上运行在另一台机器上。调用它涉及向服务器发起一个包含函数名称和参数的请求。该请求的响应包含返回值。\n\
  \n从远程过程调用的角度思考时，HTTP 只是一种通信载体，你很可能会编写一个完全隐藏它的抽象层。\n\n另一种方法是围绕资源和 HTTP 方法的概念来构建通信。不是使用名为\
  \ `addUser` 的远程过程，而是使用 `PUT` 请求到 `/users/larry`。不是将用户的属性编码为函数参数，而是定义一个表示用户的 JSON\
  \ 文档格式（或使用现有格式）。用于创建新资源的 `PUT` 请求的正文就是这样一个文档。通过向资源的 URL（例如 `/user/larry`）发起 `GET`\
  \ 请求来获取资源，该请求同样返回表示该资源的文档。\n\n第二种方法更容易利用 HTTP 提供的一些特性，例如支持缓存资源（在客户端保留副本以便快速访问）。HTTP\
  \ 中使用的概念设计良好，可以为设计服务器接口提供一套有用的原则。\n\n### 安全与 HTTPS\n\n通过互联网传输的数据往往要经过漫长而危险的道路。为了到达目的地，它必须经过从咖啡店\
  \ Wi-Fi 热点到各种公司和政府控制的网络。在路径上的任何一点，它都可能被检查甚至被修改。\n\n如果某些内容需要保密（例如电子邮件账户的密码），或者需要原封不动地到达目的地（例如通过银行网站转账的账号），那么普通的\
  \ HTTP 就不够安全。\n\n安全 HTTP 协议用于以 `https://` 开头的 URL，它以一种更难读取和篡改的方式封装 HTTP 流量。在交换数据之前，客户端会验证服务器是否是其声称的身份，要求服务器证明其拥有由浏览器认可的证书颁发机构颁发的加密证书。然后，所有通过连接传输的数据都会以阻止窃听和篡改的方式进行加密。\n\
  \n因此，当正常工作时，HTTPS 可以防止他人冒充你试图访问的网站，并防止他们窥探你的通信。它并不完美，也曾发生过由于伪造或被盗的证书以及有缺陷的软件导致 HTTPS\
  \ 失效的各种事件，但它比普通 HTTP *安全得多*。\n\n### 表单字段\n\n表单最初是为前 JavaScript 时代的 Web 设计的，允许网站通过\
  \ HTTP 请求发送用户提交的信息。这种设计假设与服务器的交互总是通过导航到新页面来进行的。\n\n但表单元素与页面其他部分一样是 DOM 的一部分，而表示表单字段的\
  \ DOM 元素支持其他元素不具备的许多属性和事件。这使得我们可以用 JavaScript 程序检查和控制这些输入字段，并执行诸如为表单添加新功能或将表单和字段用作\
  \ JavaScript 应用程序的构建块等操作。\n\n\n\n\n一个网页表单由任意数量的输入字段组成，这些字段被分组在 `<form>` 标签内。HTML\
  \ 支持多种不同风格的字段，从简单的开/关复选框到下拉菜单和文本输入字段。本书不会试图全面讨论所有字段类型，但我们会先做一个粗略的概述。\n\n许多字段类型使用\
  \ `<input>` 标签。这个标签的 `type` 属性用于选择字段的风格。以下是一些常用的 `<input>` 类型：\n\n| `text` | 单行文本字段\
  \ |\n| `password` | 与 `text` 相同，但隐藏输入的文本 |\n| `checkbox` | 开/关切换 |\n| `radio` |\
  \ （部分）多项选择字段 |\n| `file` | 允许用户从计算机中选择文件 |\n\n表单字段不一定非要出现在 `<form>` 标签中。你可以将它们放在页面的任何位置。这种无表单的字段无法被提交（只有整个表单才能提交），但在使用\
  \ JavaScript 响应输入时，我们通常不希望以常规方式提交字段。\n\n`<input type=\"text\" value=\"abc\">`（文本）\n\
  \n`<input type=\"password\" value=\"abc\">`（密码）\n\n`<input type=\"checkbox\" checked>`（复选框）\n\
  \n`<input type=\"radio\" value=\"A\" name=\"choice\">`<br/>\n`<input type=\"radio\"\
  \ value=\"B\" name=\"choice\" checked>`<br/>\n`<input type=\"radio\" value=\"C\"\
  \ name=\"choice\">`（单选按钮）\n\n`<input type=\"file\">`（文件）\n\n用这段 HTML 代码创建的字段看起来像这样：\n\
  \n![图片](img/f0318-01.jpg)\n\n这些元素的 JavaScript 接口因元素类型而异。\n\n多行文本字段有自己的标签 `<textarea>`，这主要是因为使用属性来指定多行初始值会很别扭。`<textarea>`\
  \ 标签需要一个匹配的 `</textarea>` 结束标签，并使用这两个标签之间的文本（而不是 `value` 属性）作为初始文本。\n\n```\n<textarea>\n\
  one\ntwo\nthree\n</textarea>\n```\n\n最后，`<select>` 标签用于创建一个允许用户从多个预定义选项中选择的字段。\n\
  \n```\n<select>\n  <option>Pancakes</option>\n  <option>Pudding</option>\n  <option>Ice\
  \ cream</option>\n</select>\n```\n\n这样的字段看起来像这样：\n\n![图片](img/f0319-01.jpg)\n\n\
  每当表单字段的值发生变化时，它会触发一个 `\"change\"` 事件。\n\n### 焦点\n\n与 HTML 文档中的大多数元素不同，表单字段可以获得*键盘焦点*。当被点击或以其他方式激活时，它们会成为当前活动元素，并接收键盘输入。\n\
  \n因此，你只能在文本字段获得焦点时才能在其中输入。其他字段对键盘事件的响应方式不同。例如，`<select>` 菜单会尝试移动到包含用户输入文本的选项，并通过上下箭头键移动其选择。\n\
  \n我们可以通过 JavaScript 的 `focus` 和 `blur` 方法来控制焦点。前者将焦点移动到调用它的 DOM 元素上，后者则移除焦点。`document.activeElement`\
  \ 的值对应于当前获得焦点的元素。\n\n```\n<input type=\"text\">\n<script>\n  document.querySelector(\"\
  input\").focus();\n  console.log(document.activeElement.tagName);\n  // → INPUT\n\
  \  document.querySelector(\"input\").blur();\n  console.log(document.activeElement.tagName);\n\
  \  // → BODY\n</script>\n```\n\n对于某些页面，用户可能希望立即与表单字段进行交互。JavaScript 可以在文档加载时聚焦该字段，但\
  \ HTML 也提供了 `autofocus` 属性，它产生相同的效果，同时让浏览器知道我们想要实现什么。这样，浏览器可以在不适当的情况下禁用该行为，例如当用户已经将焦点放在其他地方时。\n\
  \n传统上，浏览器还允许用户通过按 TAB 键在文档中移动焦点。我们可以使用 `tabindex` 属性影响元素获得焦点的顺序。下面的示例文档将让焦点从文本输入直接跳到“确定”按钮，而不是先经过帮助链接：\n\
  \n```\n<input type=\"text\" tabindex=1> <a href=\".\">(help)</a>\n<button onclick=\"\
  console.log('ok')\" tabindex=2>OK</button>\n```\n\n默认情况下，大多数类型的 HTML 元素无法获得焦点。但你可以为任何元素添加\
  \ `tabindex` 属性，使其可以获得焦点。`tabindex` 为 -1 会使 Tab 键跳过该元素，即使它通常可以获得焦点。\n\n### 禁用字段\n\
  \n所有表单字段都可以通过其 `disabled` 属性被*禁用*。这是一个可以不带值指定的属性——只要它存在，就会禁用该元素。\n\n```\n<button>I'm\
  \ all right</button>\n<button disabled>I'm out</button>\n```\n\n禁用的字段无法获得焦点或更改，浏览器会使其显示为灰色和褪色。\n\
  \n![图片](img/f0320-01.jpg)\n\n当程序正在处理由某个按钮或其他控件触发的操作（可能需要与服务器通信，因此需要一段时间）时，最好在操作完成前禁用该控件。这样，当用户不耐烦并再次点击时，就不会意外重复操作。\n\
  \n### 表单整体\n\n当一个字段包含在 `<form>` 元素中时，其 DOM 元素会有一个 `form` 属性，指向表单的 DOM 元素。反过来，`<form>`\
  \ 元素有一个名为 `elements` 的属性，其中包含一个类似数组的集合，包含其中的所有字段。\n\n表单字段的 `name` 属性决定了在提交表单时其值的标识方式。它也可以作为访问表单\
  \ `elements` 属性时的属性名，该属性既充当类似数组的对象（按数字访问），又充当映射（按名称访问）。\n\n```\n<form action=\"\
  example/submit.html\">\n  Name: <input type=\"text\" name=\"name\"><br>\n  Password:\
  \ <input type=\"password\" name=\"password\"><br>\n  <button type=\"submit\">Log\
  \ in</button>\n</form>\n<script>\n  let form = document.querySelector(\"form\");\n\
  \  console.log(form.elements[1].type);\n  // → password\n  console.log(form.elements.password.type);\n\
  \  // → password\n  console.log(form.elements.name.form == form);\n  // → true\n\
  </script>\n```\n\n带有 `type` 属性为 `submit` 的按钮，在按下时会提交表单。当表单字段获得焦点时按下回车键也会产生相同的效果。\n\
  \n提交表单通常意味着浏览器会导航到表单 `action` 属性指示的页面，使用 GET 或 POST 请求。但在那之前，会触发一个 `\"submit\"`\
  \ 事件。你可以用 JavaScript 处理这个事件，并通过在事件对象上调用 `preventDefault` 来阻止默认行为。\n\n```\n<form\
  \ action=\"example/submit.html\">\n  Value: <input type=\"text\" name=\"value\"\
  >\n  <button type=\"submit\">Save</button>\n</form>\n<script>\n  let form = document.querySelector(\"\
  form\");\n  form.addEventListener(\"submit\", event => {\n    console.log(\"Saving\
  \ value\", form.elements.value.value);\n    event.preventDefault();\n  });\n</script>\n\
  ```\n\n在 JavaScript 中拦截 `\"submit\"` 事件有多种用途。我们可以编写代码来验证用户输入的值是否合理，并立即显示错误消息，而不是提交表单。或者，我们可以完全禁用常规的提交方式（如示例所示），让程序处理输入，可能使用\
  \ `fetch` 将其发送到服务器而无需重新加载页面。\n\n### 文本字段\n\n由 `<textarea>` 标签或 `type` 为 `text` 或\
  \ `password` 的 `<input>` 标签创建的字段共享一个通用接口。它们的 DOM 元素有一个 `value` 属性，以字符串形式保存当前内容。将此属性设置为另一个字符串会更改字段的内容。\n\
  \n\n\n\n文本字段的 `selectionStart` 和 `selectionEnd` 属性提供了关于文本中光标和选区位置的信息。当没有选中任何内容时，这两个属性值相同，表示光标的位置。例如，0\
  \ 表示文本开头，10 表示光标在第 10 个字符之后。当字段中的部分内容被选中时，这两个属性值会不同，分别表示选中文本的起始和结束位置。与 `value` 类似，这些属性也可以被写入。\n\
  \n假设你正在写一篇关于哈塞海姆威（Khasekhemwy）的文章，但拼写他的名字有些困难。下面的代码将一个 `<textarea>` 标签与一个事件处理程序关联起来，当你按下\
  \ F2 键时，它会自动插入字符串 \"Khasekhemwy\"。\n\n```\n<textarea></textarea>\n\n<script>\n  let\
  \ textarea = document.querySelector(\"textarea\");\n  textarea.addEventListener(\"\
  keydown\", event => {\n    // F2 的键码恰好是 113\n    if (event.keyCode == 113) {\n      replaceSelection(textarea,\
  \ \"Khasekhemwy\");\n      event.preventDefault();\n    }\n  });\n  function replaceSelection(field,\
  \ word) {\n    let from = field.selectionStart, to = field.selectionEnd;\n    field.value\
  \ = field.value.slice(0, from) + word +\n                  field.value.slice(to);\n\
      // 将光标放在单词之后\n    field.selectionStart = from + word.length;\n    field.selectionEnd\
  \ = from + word.length;\n  }\n</script>\n```\n\n`replaceSelection` 函数将文本字段当前选中的部分替换为给定的单词，然后将光标移动到该单词之后，以便用户继续输入。\n\
  \n文本字段的 `\"change\"` 事件并非在每次输入时触发，而是在字段内容改变后失去焦点时触发。为了即时响应文本字段的变化，你应该注册一个 `\"input\"\
  ` 事件的处理程序，该事件在用户每次输入字符、删除文本或以其他方式操作字段内容时触发。\n\n下面的示例展示了一个文本字段和一个计数器，用于显示字段中文本的当前长度：\n\
  \n```\n<input type=\"text\"> length: <span id=\"length\">0</span>\n\n<script>\n\
    let text = document.querySelector(\"input\");\n  let output = document.querySelector(\"\
  #length\");\n  text.addEventListener(\"input\", () => {\n    output.textContent\
  \ = text.value.length;\n  });\n</script>\n```\n\n### 复选框和单选按钮\n\n复选框字段是一个二元开关。它的值可以通过其\
  \ `checked` 属性获取或更改，该属性保存一个布尔值。\n\n```\n<label>\n  <input type=\"checkbox\" id=\"\
  purple\"> 将此页面变为紫色\n</label>\n\n<script>\n  let checkbox = document.querySelector(\"\
  #purple\");\n  checkbox.addEventListener(\"change\", () => {\n    document.body.style.background\
  \ =\n      checkbox.checked ? \"mediumpurple\" : \"\";\n  });\n</script>\n```\n\n\
  `<label>` 标签将文档的一部分与输入字段关联起来。点击标签上的任意位置都会激活该字段，使其获得焦点，并在字段是复选框或单选按钮时切换其值。\n\n单选按钮与复选框类似，但它会隐式地与具有相同\
  \ `name` 属性的其他单选按钮关联，因此同一时间只能有一个处于激活状态。\n\n颜色：\n\n```\n<label>\n  <input type=\"\
  radio\" name=\"color\" value=\"orange\"> 橙色\n</label>\n<label>\n  <input type=\"\
  radio\" name=\"color\" value=\"lightgreen\"> 绿色\n</label>\n<label>\n  <input type=\"\
  radio\" name=\"color\" value=\"lightblue\"> 蓝色\n</label>\n\n<script>\nlet buttons\
  \ = document.querySelectorAll(\"[name=color]\");\n   for (let button of Array.from(buttons))\
  \ {\n     button.addEventListener(\"change\", () => {\n        document.body.style.background\
  \ = button.value;\n   });\n   }\n</script>\n```\n\n在 `querySelectorAll` 的 CSS 查询中，方括号用于匹配属性。它选择\
  \ `name` 属性为 `\"color\"` 的元素。\n\n### 选择字段\n\n选择字段在概念上与单选按钮类似——它们也允许用户从一组选项中进行选择。但单选按钮的布局由我们控制，而\
  \ `<select>` 标签的外观则由浏览器决定。\n\n选择字段还有一种变体，它更类似于复选框列表，而非单选按钮组。当添加 `multiple` 属性时，`<select>`\
  \ 标签允许用户选择任意数量的选项，而不仅仅是单个选项。在大多数浏览器中，这看起来与普通的选择字段不同，后者通常显示为一个*下拉*控件，只有在打开时才会显示选项。\n\
  \n每个 `<option>` 标签都有一个值。该值可以通过 `value` 属性定义。如果未指定，则选项内的文本将作为其值。`<select>` 元素的 `value`\
  \ 属性反映当前选中的选项。但对于多选字段，该属性意义不大，因为它只给出当前选中选项*之一*的值。\n\n`<select>` 字段的 `<option>` 标签可以通过字段的\
  \ `options` 属性以类数组对象的形式访问。每个选项都有一个名为 `selected` 的属性，指示该选项当前是否被选中。该属性也可以被写入，以选中或取消选中某个选项。\n\
  \n此示例从多选字段中提取选中的值，并用它们从各个位组成一个二进制数。按住 CTRL（在 Mac 上是 COMMAND）可选择多个选项。\n\n```\n<select\
  \ multiple>\n  <option value=\"1\">0001</option>\n  <option value=\"2\">0010</option>\n\
    <option value=\"4\">0100</option>\n  <option value=\"8\">1000</option>\n</select>\
  \ = <span id=\"output\">0</span>\n\n<script>\n   let select = document.querySelector(\"\
  select\");\n   let output = document.querySelector(\"#output\");\n   select.addEventListener(\"\
  change\", () => {\n     let number = 0;\n     for (let option of Array.from(select.options))\
  \ {\n     if (option.selected) {\n       number += Number(option.value);\n     }\n\
      }\n    output.textContent = number;\n   });\n</script>\n```\n\n### 文件字段\n\n\
  文件字段最初设计用于通过表单从用户机器上传文件。在现代浏览器中，它们还提供了一种从 JavaScript 程序读取此类文件的方式。该字段充当一种守门员的角色。脚本不能简单地开始读取用户计算机上的私有文件，但如果用户在该字段中选择了一个文件，浏览器会将该操作解释为脚本可以读取该文件。\n\
  \n文件字段通常看起来像一个标有“选择文件”或“浏览”等字样的按钮，旁边会显示所选文件的信息。\n\n```\n<input type=\"file\">\n\n\
  <script>\n  let input = document.querySelector(\"input\");\n  input.addEventListener(\"\
  change\", () => {\n    if (input.files.length > 0) {\n      let file = input.files[0];\n\
        console.log(\"你选择了\", file.name);\n      if (file.type) console.log(\"它的类型是\"\
  , file.type);\n    }\n  });\n</script>\n```\n\n文件字段元素的 `files` 属性是一个类数组对象（同样，不是真正的数组），包含该字段中选择的文件。它最初是空的。之所以不简单地使用一个文件属性，是因为文件字段还支持\
  \ `multiple` 属性，这使得可以同时选择多个文件。\n\n`files` 对象中的对象具有 `name`（文件名）、`size`（文件大小，以字节为单位，每个字节是\
  \ 8 位）和 `type`（文件的媒体类型，例如 `text/plain` 或 `image/jpeg`）等属性。\n\n但它没有包含文件内容的属性。获取文件内容稍微复杂一些。由于从磁盘读取文件可能需要时间，因此接口必须是异步的，以避免冻结文档。\n\
  \n```\n<input type=\"file\" multiple>\n\n<script>\n  let input = document.querySelector(\"\
  input\");\n  input.addEventListener(\"change\", () => {\n    for (let file of Array.from(input.files))\
  \ {\n      let reader = new FileReader();\n      reader.addEventListener(\"load\"\
  , () => {\n        console.log(\"文件\", file.name, \"的开头是\",\n\n\n\n\n\n```javascript\n\
  reader.result.slice(0, 20));\n});\nreader.readAsText(file);\n}\n});\n</script>\n\
  ```\n\n读取文件是通过创建一个`FileReader`对象，为其注册一个`\"load\"`事件处理程序，然后调用其`readAsText`方法，并将要读取的文件传递给它。加载完成后，读取器的`result`属性将包含文件的内容。\n\
  \n`FileReader`在读取文件因任何原因失败时也会触发一个`\"error\"`事件。错误对象本身会出现在读取器的`error`属性中。这个接口是在 Promise\
  \ 成为语言一部分之前设计的。你可以像这样将其包装在 Promise 中：\n\n```javascript\nfunction readFileText(file)\
  \ {\n  return new Promise((resolve, reject) => {\n    let reader = new FileReader();\n\
  \    reader.addEventListener(\n      \"load\", () => resolve(reader.result));\n\
  \    reader.addEventListener(\n      \"error\", () => reject(reader.error));\n \
  \   reader.readAsText(file);\n  });\n}\n```\n\n### 在客户端存储数据\n\n带有少量 JavaScript 的简单\
  \ HTML 页面可以成为“迷你应用”的绝佳格式——这些小型辅助程序可以自动化基本任务。通过将几个表单字段与事件处理程序连接起来，你可以做任何事情，从厘米和英寸之间的转换，到根据主密码和网站名称计算密码。\n\
  \n当这样的应用需要在会话之间记住某些内容时，你不能使用 JavaScript 绑定——这些绑定在每次页面关闭时都会被丢弃。你可以设置一个服务器，将其连接到互联网，并让你的应用在那里存储一些内容。我们将在第\
  \ 20 章中看到如何做到这一点。但这会带来很多额外的工作和复杂性。有时，只需将数据保存在浏览器中就足够了。\n\n`localStorage`对象可用于以在页面重新加载后仍然存在的方式存储数据。该对象允许你按名称存储字符串值。\n\
  \n```javascript\nlocalStorage.setItem(\"username\", \"marijn\");\nconsole.log(localStorage.getItem(\"\
  username\"));\n// → marijn\nlocalStorage.removeItem(\"username\");\n```\n\n`localStorage`中的值会一直存在，直到被覆盖、通过`removeItem`移除，或者用户清除其本地数据。\n\
  \n来自不同域名的网站获得不同的存储分区。这意味着，原则上，给定网站存储在`localStorage`中的数据只能被同一站点上的脚本读取（和覆盖）。\n\n浏览器确实对站点可以在`localStorage`中存储的数据大小施加了限制。这一限制，加上用垃圾填满人们硬盘并不真正有利可图的事实，防止了该功能占用过多空间。\n\
  \n以下代码实现了一个简单的笔记应用。它保存一组有名称的笔记，并允许用户编辑笔记和创建新笔记。\n\n```html\nNotes: <select></select>\
  \ <button>Add</button><br>\n<textarea style=\"width: 100%\"></textarea>\n\n<script>\n\
  \  let list = document.querySelector(\"select\");\n  let note = document.querySelector(\"\
  textarea\");\n  let state;\n\n  function setState(newState) {\n    list.textContent\
  \ = \"\";\n    for (let name of Object.keys(newState.notes)) {\n      let option\
  \ = document.createElement(\"option\");\n      option.textContent = name;\n    \
  \  if (newState.selected == name) option.selected = true;\n      list.appendChild(option);\n\
  \    }\n    note.value = newState.notes[newState.selected];\n    localStorage.setItem(\"\
  Notes\", JSON.stringify(newState));\n    state = newState;\n  }\n\n  setState(JSON.parse(localStorage.getItem(\"\
  Notes\")) || {\n    notes: {\"shopping list\": \"Carrots\\nRaisins\"},\n    selected:\
  \ \"shopping list\"\n  });\n\n  list.addEventListener(\"change\", () => {\n    setState({notes:\
  \ state.notes, selected: list.value});\n  });\n\n  note.addEventListener(\"change\"\
  , () => {\n    setState({\n       notes: Object.assign({}, state.notes,\n      \
  \                     {[state.selected]: note.value}),\n       selected: state.selected\n\
  \    });\n  });\n\n  document.querySelector(\"button\")\n    .addEventListener(\"\
  click\", () => {\n      let name = prompt(\"Note name\");\n      if (name) setState({\n\
  \        notes: Object.assign({}, state.notes, {[name]: \"\"}),\n        selected:\
  \ name\n      });\n    });\n</script>\n```\n\n该脚本从存储在`localStorage`中的`\"Notes\"\
  `值获取其初始状态，如果该值不存在，则创建一个仅包含购物清单的示例状态。从`localStorage`读取不存在的字段将返回`null`。将`null`传递给`JSON.parse`将使其解析字符串`\"\
  null\"`并返回`null`。因此，在这种情况下，可以使用`||`运算符来提供默认值。\n\n`setState`方法确保 DOM 显示给定的状态，并将新状态存储到`localStorage`中。事件处理程序调用此函数以切换到新状态。\n\
  \n示例中使用`Object.assign`是为了创建一个新对象，该对象是旧`state.notes`的克隆，但添加或覆盖了一个属性。`Object.assign`接受其第一个参数，并将后续所有参数中的属性添加到其中。因此，给它一个空对象将使其填充一个新对象。第三个参数中的方括号表示法用于创建一个名称基于某个动态值的属性。\n\
  \n还有另一个类似于`localStorage`的对象，叫做`sessionStorage`。两者的区别在于，`sessionStorage`的内容在每个*会话*结束时被遗忘，对于大多数浏览器来说，这意味着每当浏览器关闭时。\n\
  \n### 总结\n\n在本章中，我们讨论了 HTTP 协议的工作原理。*客户端*发送一个请求，其中包含一个方法（通常是 GET）和一个标识资源的路径。*服务器*然后决定如何处理该请求，并以状态码和响应体进行响应。请求和响应都可能包含提供额外信息的头部。\n\
  \n浏览器 JavaScript 可以通过其发出 HTTP 请求的接口称为`fetch`。发出请求如下所示：\n\n```javascript\nfetch(\"\
  /18_http.html\").then(r => r.text()).then(text => {\n  console.log(`The page starts\
  \ with ${text.slice(0, 15)}`);\n});\n```\n\n浏览器发出 GET 请求以获取显示网页所需的资源。页面还可能包含表单，这些表单允许用户输入的信息在表单提交时作为新页面的请求发送。\n\
  \nHTML 可以表示各种类型的表单字段，例如文本字段、复选框、多选字段和文件选择器。\n\n这些字段可以通过 JavaScript 进行检查和操作。当它们发生变化时，会触发`\"\
  change\"`事件；当输入文本时，会触发`\"input\"`事件；当它们获得键盘焦点时，会接收键盘事件。像`value`（用于文本和选择字段）或`checked`（用于复选框和单选按钮）这样的属性用于读取或设置字段的内容。\n\
  \n当表单提交时，会触发一个`\"submit\"`事件。JavaScript 处理程序可以对该事件调用`preventDefault`来禁用浏览器的默认行为。表单字段元素也可以出现在\
  \ form 标签之外。\n\n当用户在文件选择器字段中从本地文件系统选择了文件时，可以使用`FileReader`接口从 JavaScript 程序中访问该文件的内容。\n\
  \n`localStorage`和`sessionStorage`对象可用于以在页面重新加载后仍然存在的方式保存信息。第一个对象永久保存数据（或直到用户决定清除它），第二个对象保存数据直到浏览器关闭。\n\
  \n### 练习\n\n#### *内容协商*\n\nHTTP 能够做的事情之一称为*内容协商*。`Accept`请求头用于告诉服务器客户端希望获取什么类型的文档。许多服务器忽略此头部，但当服务器知道多种编码资源的方式时，它可以查看此头部并发送客户端偏好的那种。\n\
  \n\n\n\n\nURL *[`eloquentjavascript.net/author`](https://eloquentjavascript.net/author)*\
  \ 被配置为根据客户端的请求以纯文本、HTML 或 JSON 格式响应。这些格式通过标准化的*媒体类型* text/plain、text/html 和 application/json\
  \ 来标识。\n\n向 `fetch` 发送请求，获取该资源的全部三种格式。在传递给 `fetch` 的选项对象中使用 `headers` 属性，将名为 `Accept`\
  \ 的头部设置为所需的媒体类型。\n\n最后，尝试请求媒体类型 `application/rainbows+unicorns`，看看会产生哪个状态码。\n\n\
  #### *JavaScript 工作台*\n\n构建一个允许用户输入并运行 JavaScript 代码片段的界面。\n\n在 `<textarea>` 字段旁边放置一个按钮，当按下时，使用我们在第\
  \ 170 页的“将数据作为代码求值”中看到的 `Function` 构造函数将文本包装成一个函数并调用它。将函数的返回值或它引发的任何错误转换为字符串，并显示在文本字段下方。\n\
  \n#### *康威生命游戏*\n\n康威生命游戏是一种简单的模拟，它在网格上创造人工“生命”，每个格子要么存活要么死亡。每一代（回合），应用以下规则：\n\n\
  *   任何存活且邻居少于两个或多于三个的格子死亡。\n*   任何存活且邻居为两个或三个的格子存活到下一代。\n*   任何死亡且恰好有三个存活邻居的格子变为存活。\n\
  \n*邻居*定义为任何相邻的格子，包括对角线相邻的格子。\n\n注意，这些规则是同时应用于整个网格，而不是一次一个方格。这意味着邻居的计数基于该代开始时的状态，并且在该代期间邻居格子的变化不应影响给定格子的新状态。\n\
  \n使用你认为合适的数据结构实现这个游戏。使用 `Math.random` 初始随机填充网格。将其显示为复选框字段的网格，旁边有一个按钮用于前进到下一代。当用户勾选或取消勾选复选框时，他们的更改应在计算下一代时被包含。\n\
  \n“我看着眼前五彩斑斓的色彩。我看着空白的画布。然后，我尝试像用词语塑造诗歌、用音符塑造音乐一样运用色彩。”\n\n—— 胡安·米罗\n\n![Image](img/f0332-01.jpg)\n\
  \n## 19\n\n项目：像素艺术编辑器\n\n前几章的内容为你提供了构建基本 Web 应用所需的所有元素。在本章中，我们将实际构建这样一个应用。\n\n我们的应用将是一个像素绘图程序，你可以通过操作放大视图（显示为彩色方格的网格）来逐像素修改图片。你可以使用该程序打开图像文件，用鼠标或其他指针设备在上面涂鸦，并保存它们。它将如下所示：\n\
  \n![Image](img/f0333-01.jpg)\n\n在电脑上绘画很棒。你无需担心材料、技巧或天赋。只需开始涂抹。\n\n### 组件\n\n应用的界面顶部显示一个大的\
  \ `<canvas>` 元素，下方有若干表单字段。用户通过从 `<select>` 字段中选择工具，然后点击、触摸或拖拽画布来绘制图片。有用于绘制单个像素或矩形、填充区域以及从图片中选取颜色的工具。\n\
  \n我们将编辑器界面结构化为多个*组件*，这些对象负责 DOM 的一部分，并且内部可能包含其他组件。\n\n应用的状态由当前的 `picture`、选中的 `tool`\
  \ 和选中的 `color` 组成。我们将设置成 `state` 存在于单个值中，并且界面组件始终基于当前状态来呈现自身。\n\n为了理解这为何重要，让我们考虑另一种方案——将状态分散到界面各处。在某种程度上，这样编程更容易。我们可以直接放置一个颜色字段，并在需要知道当前颜色时读取它的值。\n\
  \n但随后我们添加了颜色选择器——一种允许你点击图片以选取给定像素颜色的工具。为了让颜色字段显示正确的颜色，该工具必须知道颜色字段的存在，并在选取新颜色时更新它。如果你再添加另一个显示颜色的地方（比如鼠标光标可能显示它），你就必须更新颜色更改代码以保持同步。\n\
  \n实际上，这导致了一个问题：界面的每个部分都需要了解所有其他部分，这非常不模块化。对于像本章这样的小型应用，这可能不是问题。但对于更大的项目，它可能变成真正的噩梦。\n\
  \n为了避免这种噩梦，我们原则上要严格遵循*数据流*。存在一个状态，界面基于该状态绘制。界面组件可以通过更新状态来响应用户操作，此时组件有机会与这个新状态同步。\n\
  \n在实践中，每个组件被设置成：当它被赋予新状态时，它也会通知其子组件（只要这些子组件需要更新）。设置这一点有些麻烦。使这更方便是许多浏览器编程库的主要卖点。但对于像这样的小型应用，我们可以在没有此类基础设施的情况下完成。\n\
  \n对状态的更新被表示为对象，我们称之为*动作*。组件可以创建这样的动作并*分发*它们——将它们交给一个中心状态管理函数。该函数计算下一个状态，之后界面组件将自身更新到这个新状态。\n\
  \n我们正在处理运行用户界面这一混乱任务，并为其应用一些结构。尽管与 DOM 相关的部分仍然充满副作用，但它们由一个概念上简单的骨干支撑：状态更新循环。状态决定了\
  \ DOM 的样子，而 DOM 事件改变状态的唯一方式是通过向状态分发动作。\n\n这种方法有*许多*变体，各有优缺点，但它们的核心思想相同：状态更改应通过一个定义良好的单一通道进行，而不是到处发生。\n\
  \n我们的组件将是符合接口的类。它们的构造函数接收一个状态——可能是整个应用状态，或者如果不需要访问所有内容则是一个较小的值——并用它来构建一个 `dom` 属性。这是代表该组件的\
  \ DOM 元素。大多数构造函数还会接收一些不会随时间变化的其他值，例如它们可以用来 `dispatch` 动作的函数。\n\n每个组件都有一个 `syncState`\
  \ 方法，用于将其与新的状态值同步。该方法接受一个参数 `state`，其类型与构造函数第一个参数相同。\n\n### 状态\n\n应用状态将是一个包含 `picture`、`tool`\
  \ 和 `color` 属性的对象。`picture` 本身是一个存储图片的 `width`、`height` 和像素内容的对象。`pixels` 存储在一个数组中，方式与第\
  \ 6 章中的矩阵类相同——逐行从上到下。\n\n```\nclass Picture {\n\n  constructor(width, height, pixels)\
  \ {\n\n    this.width = width;\n\n    this.height = height;\n\n    this.pixels =\
  \ pixels;\n\n  }\n\n  static empty(width, height, color) {\n\n    let pixels = new\
  \ Array(width * height).fill(color);\n\n    return new Picture(width, height, pixels);\n\
  \n  }\n\n  pixel(x, y) {\n\n    return this.pixels[x + y * this.width];\n\n  }\n\
  \n  draw(pixels) {\n\n    let copy = this.pixels.slice();\n\n    for (let {x, y,\
  \ color} of pixels) {\n\n      copy[x + y * this.width] = color;\n\n    }\n\n    return\
  \ new Picture(this.width, this.height, copy);\n\n  }\n\n}\n```\n\n\n\n\n我们希望将图片视为不可变值，原因将在本章后面讨论。但有时我们也需要一次性更新大量像素。为此，该类提供了一个\
  \ `draw` 方法，该方法接收一个更新后的像素数组——每个像素对象包含 `x`、`y` 和 `color` 属性——并创建一个覆盖这些像素的新图片。该方法使用不带参数的\
  \ `slice` 来复制整个像素数组——`slice` 的起始位置默认为 `0`，结束位置默认为数组长度。\n\n`empty` 方法使用了我们之前未接触过的两个数组功能。`Array`\
  \ 构造函数可以传入一个数字来创建指定长度的空数组。然后可以使用 `fill` 方法用给定值填充该数组。这些方法用于创建一个所有像素颜色相同的数组。\n\n颜色以字符串形式存储，包含传统的\
  \ CSS 颜色代码，由井号（`#`）后跟六个十六进制（基数为 16）数字组成——前两位表示红色分量，中间两位表示绿色分量，最后两位表示蓝色分量。这种写法有些晦涩且不便，但它是\
  \ HTML 颜色输入字段使用的格式，并且可以在画布绘图上下文的 `fillStyle` 属性中使用，因此对于本程序中颜色的使用方式来说，它足够实用。\n\n\
  黑色（所有分量为零）写作 `\"#000000\"`，亮粉色写作 `\"#ff00ff\"`，其中红色和蓝色分量的最大值为 255，用十六进制数字写作 `ff`（十六进制使用\
  \ *a* 到 *f* 表示数字 10 到 15）。\n\n我们将允许界面将动作分派为对象，这些对象的属性会覆盖先前状态的属性。当用户更改颜色字段时，可以分派一个像\
  \ `{color: field.value}` 这样的对象，更新函数可以根据该对象计算新状态。\n\n```\nfunction updateState(state,\
  \ action) {\n  return Object.assign({}, state, action);\n}\n```\n\n这种相当繁琐的模式——使用\
  \ `Object.assign` 先将 `state` 的属性添加到空对象中，然后用 `action` 的属性覆盖其中一些——在使用不可变对象的 JavaScript\
  \ 代码中很常见。一种更便捷的表示法（使用三个点运算符将另一个对象的所有属性包含到对象表达式中）正处于标准化最后阶段。有了这个特性，你可以写成 `{...state,\
  \ ...action}` 代替。在撰写本文时，这尚未在所有浏览器中生效。\n\n### DOM 构建\n\n界面组件的主要工作之一是创建 DOM 结构。我们同样不想直接使用冗长的\
  \ DOM 方法，因此这里有一个稍作扩展的 `elt` 函数：\n\n```\nfunction elt(type, props, ...children) {\n\
  \  let dom = document.createElement(type);\n  if (props) Object.assign(dom, props);\n\
  \  for (let child of children) {\n    if (typeof child != \"string\") dom.appendChild(child);\n\
  \    else dom.appendChild(document.createTextNode(child));\n  }\n  return dom;\n\
  }\n```\n\n此版本与我们在第 273 页“绘图”一章中使用的版本的主要区别在于，此版本将*属性*分配给 DOM 节点，而不是*特性*。这意味着我们不能用它来设置任意特性，但*可以*用它来设置值不是字符串的属性，例如\
  \ `onclick`，可以将其设置为函数以注册点击事件处理程序。\n\n这允许以下注册事件处理程序的风格：\n\n```\n<body>\n  <script>\n\
  \    document.body.appendChild(elt(\"button\", {\n       onclick: () => console.log(\"\
  click\")\n    }, \"The button\"));\n  </script>\n</body>\n```\n\n### 画布\n\n我们要定义的第一个组件是界面的部分，它将图片显示为彩色方块的网格。该组件负责两件事：显示图片，并将该图片上的指针事件传递给应用程序的其他部分。\n\
  \n因此，我们可以将其定义为一个只了解当前图片、不了解整个应用程序状态的组件。由于它不知道应用程序的整体工作方式，因此不能直接分派动作。相反，在响应指针事件时，该组件会调用创建它的代码提供的回调函数，该函数将处理特定于应用程序的部分。\n\
  \n```\nconst scale = 10;\n\nclass PictureCanvas {\n  constructor(picture, pointerDown)\
  \ {\n    this.dom = elt(\"canvas\", {\n      onmousedown: event => this.mouse(event,\
  \ pointerDown),\n      ontouchstart: event => this.touch(event, pointerDown)\n \
  \   });\n    this.syncState(picture);\n   }\n   syncState(picture) {\n     if (this.picture\
  \ == picture) return;\n   this.picture = picture;\n   drawPicture(this.picture,\
  \ this.dom, scale);\n   }\n }\n```\n\n我们将每个像素绘制为 10×10 的方块，由 `scale` 常量决定。为了避免不必要的工作，该组件会跟踪当前图片，并且仅在\
  \ `syncState` 接收到新图片时才重新绘制。\n\n实际的绘制函数根据缩放比例和图片大小设置画布尺寸，并用一系列方块填充画布，每个像素对应一个方块。\n\
  \n```\nfunction drawPicture(picture, canvas, scale) {\n  canvas.width = picture.width\
  \ * scale;\n  canvas.height = picture.height * scale;\n  let cx = canvas.getContext(\"\
  2d\");\n  for (let y = 0; y < picture.height; y++) {\n    for (let x = 0; x < picture.width;\
  \ x++) {\n      cx.fillStyle = picture.pixel(x, y);\n      cx.fillRect(x * scale,\
  \ y * scale, scale, scale);\n    }\n   }\n}\n```\n\n当鼠标位于图片画布上且按下左键时，该组件会调用 `pointerDown`\
  \ 回调，并传入被点击像素的位置（以图片坐标表示）。这将用于实现与图片的鼠标交互。回调可以返回另一个回调函数，以便在按住按钮并将指针移动到不同像素时得到通知。\n\
  \n```\nPictureCanvas.prototype.mouse = function(downEvent, onDown) {\n   if (downEvent.button\
  \ != 0) return;\n   let pos = pointerPosition(downEvent, this.dom);\n   let onMove\
  \ = onDown(pos);\n   if (!onMove) return;\n   let move = moveEvent => {\n     if\
  \ (moveEvent.buttons == 0) {\n       this.dom.removeEventListener(\"mousemove\"\
  , move);\n     } else {\n       let newPos = pointerPosition(moveEvent, this.dom);\n\
  \       if (newPos.x == pos.x && newPos.y == pos.y) return;\n       pos = newPos;\n\
  \       onMove(newPos);\n     }\n   };\n   this.dom.addEventListener(\"mousemove\"\
  , move);\n};\n\nfunction pointerPosition(pos, domNode) {\n  let rect = domNode.getBoundingClientRect();\n\
  \  return {x: Math.floor((pos.clientX - rect.left) / scale),\n          y: Math.floor((pos.clientY\
  \ - rect.top) / scale)};\n}\n```\n\n由于我们知道像素的大小，并且可以使用 `getBoundingClientRect` 找到画布在屏幕上的位置，因此可以从鼠标事件坐标（`clientX`\
  \ 和 `clientY`）转换为图片坐标。这些坐标总是向下取整，以便指向特定的像素。\n\n对于触摸事件，我们必须做类似的事情，但必须使用不同的事件，并确保在\
  \ `\"touchstart\"` 事件上调用 `preventDefault` 以防止页面滚动。\n\n```\nPictureCanvas.prototype.touch\
  \ = function(startEvent,\n                                        onDown) {\n  let\
  \ pos = pointerPosition(startEvent.touches[0], this.dom);\n  let onMove = onDown(pos);\n\
  \  startEvent.preventDefault();\n  if (!onMove) return;\n  let move = moveEvent\
  \ => {\n     let newPos = pointerPosition(moveEvent.touches[0],\n              \
  \                    this.dom);\n     if (newPos.x == pos.x && newPos.y == pos.y)\
  \ return;\n     pos = newPos;\n     onMove(newPos);\n   };\n   let end = () => {\n\
  \     this.dom.removeEventListener(\"touchmove\", move);\n     this.dom.removeEventListener(\"\
  touchend\", end);\n   };\n   this.dom.addEventListener(\"touchmove\", move);\n \
  \  this.dom.addEventListener(\"touchend\", end);\n};\n```\n\n\n\n对于触摸事件，`clientX`\
  \ 和 `clientY` 无法直接从事件对象上获取，但我们可以使用 `touches` 属性中第一个触摸对象的坐标。\n\n### 应用程序\n\n为了能够逐步构建应用程序，我们将主组件实现为一个外壳，其中包含一个图片画布以及一组动态的工具和控件，这些工具和控件会传递给它的构造函数。\n\
  \n`controls` 是显示在图片下方的界面元素。它们将以组件构造函数数组的形式提供。\n\n`tools` 负责执行诸如绘制像素或填充区域等操作。应用程序将可用工具集显示为一个\
  \ `<select>` 字段。当前选中的工具决定了用户通过指针设备与图片交互时发生的行为。可用工具集以一个对象的形式提供，该对象将下拉字段中显示的名称映射到实现这些工具的函数。这些函数接收一个图片位置、当前应用程序状态以及一个\
  \ dispatch 函数作为参数。它们可能会返回一个移动处理函数，当指针移动到不同像素时，该函数会以新位置和当前状态被调用。\n\n```\nclass PixelEditor\
  \ {\n  constructor(state, config) {\n    let {tools, controls, dispatch} = config;\n\
  \    this.state = state;\n    this.canvas = new PictureCanvas(state.picture, pos\
  \ => {\n      let tool = tools[this.state.tool];\n      let onMove = tool(pos, this.state,\
  \ dispatch);\n      if (onMove) return pos => onMove(pos, this.state);\n    });\n\
  \    this.controls = controls.map(\n      Control => new Control(state, config));\n\
  \    this.dom = elt(\"div\", {}, this.canvas.dom, elt(\"br\"),\n               \
  \    ...this.controls.reduce(\n                     (a, c) => a.concat(\" \", c.dom),\
  \ []));\n  }\n  syncState(state) {\n    this.state = state;\n    this.canvas.syncState(state.picture);\n\
  \    for (let ctrl of this.controls) ctrl.syncState(state);\n  }\n}\n```\n\n传递给\
  \ `PictureCanvas` 的指针处理函数会使用适当的参数调用当前选中的工具，如果该工具返回了一个移动处理函数，则将其适配为同时接收状态。\n\n所有控件都会被构造并存储在\
  \ `this.controls` 中，以便在应用程序状态发生变化时能够更新它们。`reduce` 调用会在控件的 DOM 元素之间插入空格，这样它们看起来就不会挤在一起。\n\
  \n第一个控件是工具选择菜单。它创建一个 `<select>` 元素，为每个工具提供一个选项，并设置一个 `\"change\"` 事件处理函数，当用户选择不同的工具时，该函数会更新应用程序状态。\n\
  \n```\nclass ToolSelect {\n  constructor(state, {tools, dispatch}) {\n    this.select\
  \ = elt(\"select\", {\n      onchange: () => dispatch({tool: this.select.value})\n\
  \    }, ...Object.keys(tools).map(name => elt(\"option\", {\n      selected: name\
  \ == state.tool\n    }, name)));\n    this.dom = elt(\"label\", null, \" Tool: \"\
  , this.select);\n  }\n  syncState(state) { this.select.value = state.tool; }\n}\n\
  ```\n\n通过将标签文本和字段包裹在 `<label>` 元素中，我们告诉浏览器该标签属于该字段，这样你就可以通过点击标签来聚焦该字段。\n\n我们还需要能够更改颜色，因此让我们添加一个用于此目的的控件。一个带有\
  \ `type` 属性为 `color` 的 HTML `<input>` 元素为我们提供了一个专门用于选择颜色的表单字段。这种字段的值始终是 `\"#RRGGBB\"\
  ` 格式的 CSS 颜色代码（红色、绿色和蓝色分量，每种颜色两位数字）。当用户与之交互时，浏览器会显示一个颜色选择器界面。\n\n根据浏览器的不同，颜色选择器可能看起来像这样：\n\
  \n![Image](img/f0341-01.jpg)\n\n这个控件创建了这样一个字段，并将其与应用程序状态的 `color` 属性保持同步。\n\n```\n\
  class ColorSelect {\n  constructor(state, {dispatch}) {\n    this.input = elt(\"\
  input\", {\n      type: \"color\",\n      value: state.color,\n      onchange: ()\
  \ => dispatch({color: this.input.value})\n    });\n    this.dom = elt(\"label\"\
  , null, \" Color: \", this.input);\n  }\n  syncState(state) { this.input.value =\
  \ state.color; }\n}\n```\n\n### 绘图工具\n\n在我们可以绘制任何东西之前，需要实现控制画布上鼠标或触摸事件功能的工具。\n\n\
  最基本的工具是绘图工具，它会将你点击或触摸的任何像素更改为当前选中的颜色。它分发一个动作，将图片更新为指向的像素被赋予当前选中颜色的版本。\n\n```\nfunction\
  \ draw(pos, state, dispatch) {\n  function drawPixel({x, y}, state) {\n    let drawn\
  \ = {x, y, color: state.color};\n    dispatch({picture: state.picture.draw([drawn])});\n\
  \  }\n  drawPixel(pos, state);\n  return drawPixel;\n}\n```\n\n该函数立即调用 `drawPixel`\
  \ 函数，但随后也返回它，以便当用户在图片上拖动或滑动时，它会被再次调用以处理新触摸的像素。\n\n为了绘制更大的形状，快速创建矩形会很有用。矩形工具会在你开始拖动的点和拖动到的点之间绘制一个矩形。\n\
  \n```\nfunction rectangle(start, state, dispatch) {\n  function drawRectangle(pos)\
  \ {\n    let xStart = Math.min(start.x, pos.x);\n    let yStart = Math.min(start.y,\
  \ pos.y);\n    let xEnd = Math.max(start.x, pos.x);\n    let yEnd = Math.max(start.y,\
  \ pos.y);\n    let drawn = [];\n    for (let y = yStart; y <= yEnd; y++) {\n   \
  \   for (let x = xStart; x <= xEnd; x++) {\n        drawn.push({x, y, color: state.color});\n\
  \      }\n    }\n    dispatch({picture: state.picture.draw(drawn)});\n  }\n  drawRectangle(start);\n\
  \  return drawRectangle;\n}\n```\n\n这个实现中的一个重要细节是，在拖动时，矩形会从*原始*状态重新绘制到图片上。这样，在创建矩形时，你可以使其变大或变小，而中间矩形不会保留在最终图片中。这是不可变图片对象有用的原因之一——稍后我们会看到另一个原因。\n\
  \n实现泛洪填充稍微复杂一些。该工具会填充指针下方的像素以及所有具有相同颜色的相邻像素。“相邻”指的是水平或垂直相邻，而不是对角线相邻。下图说明了在标记像素处使用泛洪填充工具时被着色的像素集：\n\
  \n![Image](img/f0343-01.jpg)\n\n有趣的是，我们实现它的方式看起来有点像第 7 章中的寻路代码。那段代码在图中搜索路径，而这段代码在网格中搜索所有“相连”的像素。跟踪一组分支可能路径的问题是相似的。\n\
  \n```\nconst around = [{dx: -1, dy: 0}, {dx: 1, dy: 0},\n                {dx: 0,\
  \ dy: -1}, {dx: 0, dy: 1}];\n\nfunction fill({x, y}, state, dispatch) {\n  let targetColor\
  \ = state.picture.pixel(x, y);\n  let drawn = [{x, y, color: state.color}];\n  for\
  \ (let done = 0; done < drawn.length; done++) {\n    for (let {dx, dy} of around)\
  \ {\n      let x = drawn[done].x + dx, y = drawn[done].y + dy;\n      if (x >= 0\
  \ && x < state.picture.width &&\n          y >= 0 && y < state.picture.height &&\n\
  \          state.picture.pixel(x, y) == targetColor &&\n          !drawn.some(p\
  \ => p.x == x && p.y == y)) {\n        drawn.push({x, y, color: state.color});\n\
  \      }\n    }\n  }\n  dispatch({picture: state.picture.draw(drawn)});\n}\n```\n\
  \n已绘制像素的数组同时充当函数的工作列表。对于每个到达的像素，我们需要检查是否有任何相邻像素具有相同的颜色且尚未被绘制覆盖。循环计数器落后于 `drawn`\
  \ 数组的长度，因为新像素会被添加。任何位于它前面的像素仍需探索。当它追上长度时，就没有未探索的像素了，函数完成。\n\n最后一个工具是颜色选择器，它允许你指向图片中的一种颜色，将其用作当前绘图颜色。\n\
  \n```\nfunction pick(pos, state, dispatch) {\n```\n\n\n\n\n```\ndispatch({color:\
  \ state.picture.pixel(pos.x, pos.y)});\n}\n```\n\n### 保存与加载\n\n当我们绘制完杰作后，会希望将其保存下来以备后用。我们应该添加一个按钮，用于将当前图片下载为图像文件。这个控件提供了该按钮：\n\
  \n```\nclass SaveButton {\n  constructor(state) {\n    this.picture = state.picture;\n\
  \    this.dom = elt(\"button\", {\n      onclick: () => this.save()\n    }, \"![图片](img/c0344-01.jpg)\
  \ 保存\");\n  }\n  save() {\n    let canvas = elt(\"canvas\");\n    drawPicture(this.picture,\
  \ canvas, 1);\n    let link = elt(\"a\", {\n      href: canvas.toDataURL(),\n  \
  \    download: \"pixelart.png\"\n    });\n    document.body.appendChild(link);\n\
  \    link.click();\n    link.remove();\n  }\n  syncState(state) { this.picture =\
  \ state.picture; }\n}\n```\n\n该组件会跟踪当前图片，以便在保存时能够访问它。为了创建图像文件，它使用一个 `<canvas>` 元素，并在其上绘制图片（比例为每个像素对应一个像素）。\n\
  \ncanvas 元素上的 `toDataURL` 方法会创建一个以 `data:` 开头的 URL。与 `http:` 和 `https:` URL 不同，数据\
  \ URL 将整个资源包含在 URL 中。它们通常非常长，但允许我们在浏览器中直接创建指向任意图片的有效链接。\n\n为了让浏览器实际下载图片，我们随后创建一个指向该\
  \ URL 并带有 `download` 属性的链接元素。点击此类链接时，浏览器会显示文件保存对话框。我们将该链接添加到文档中，模拟点击它，然后再次将其移除。\n\
  \n你可以用浏览器技术做很多事情，但实现方式有时相当奇特。\n\n而且情况会更复杂。我们还希望能够将现有的图像文件加载到应用程序中。为此，我们再次定义一个按钮组件。\n\
  \n```\nclass LoadButton {\n  constructor(_, {dispatch}) {\n    this.dom = elt(\"\
  button\", {\n      onclick: () => startLoad(dispatch)\n    }, \"![图片](img/c0345-01.jpg)\
  \ 加载\");\n  }\n  syncState() {}\n}\n\nfunction startLoad(dispatch) {\n  let input\
  \ = elt(\"input\", {\n    type: \"file\",\n    onchange: () => finishLoad(input.files[0],\
  \ dispatch)\n  });\n  document.body.appendChild(input);\n  input.click();\n  input.remove();\n\
  }\n```\n\n要访问用户计算机上的文件，我们需要用户通过文件输入字段选择文件。但我不希望加载按钮看起来像一个文件输入字段，因此我们在按钮被点击时创建文件输入，然后假装这个文件输入本身被点击了。\n\
  \n当用户选择了一个文件后，我们可以使用 `FileReader` 来访问其内容，同样以数据 URL 的形式。该 URL 可用于创建 `<img>` 元素，但由于我们无法直接访问此类图像中的像素，因此无法从中创建\
  \ `Picture` 对象。\n\n```\nfunction finishLoad(file, dispatch) {\n  if (file == null)\
  \ return;\n  let reader = new FileReader();\n  reader.addEventListener(\"load\"\
  , () => {\n    let image = elt(\"img\", {\n      onload: () => dispatch({\n    \
  \    picture: pictureFromImage(image)\n      }),\n      src: reader.result\n   \
  \ });\n  });\n  reader.readAsDataURL(file);\n}\n```\n\n要访问像素，我们必须先将图片绘制到 `<canvas>`\
  \ 元素上。canvas 上下文有一个 `getImageData` 方法，允许脚本读取其像素。因此，一旦图片在 canvas 上，我们就可以访问它并构造一个\
  \ `Picture` 对象。\n\n```\nfunction pictureFromImage(image) {\n  let width = Math.min(100,\
  \ image.width);\n  let height = Math.min(100, image.height);\n  let canvas = elt(\"\
  canvas\", {width, height});\n  let cx = canvas.getContext(\"2d\");\n  cx.drawImage(image,\
  \ 0, 0);\n  let pixels = [];\n  let {data} = cx.getImageData(0, 0, width, height);\n\
  \  function hex(n) {\n    return n.toString(16).padStart(2, \"0\");\n  }\n  for\
  \ (let i = 0; i < data.length; i += 4) {\n    let [r, g, b] = data.slice(i, i +\
  \ 3);\n    pixels.push(\"#\" + hex(r) + hex(g) + hex(b));\n  }\n  return new Picture(width,\
  \ height, pixels);\n}\n```\n\n我们将图像大小限制为 100×100 像素，因为任何更大的图像在我们的显示器上都会显得*巨大*，并且可能拖慢界面。\n\
  \n`getImageData` 返回的对象的 `data` 属性是一个颜色分量数组。对于参数指定的矩形中的每个像素，它包含四个值，分别表示像素颜色的红色、绿色、蓝色和\
  \ *alpha* 分量，取值范围为 0 到 255。alpha 部分表示不透明度——当它为 0 时，像素完全透明；当它为 255 时，完全不透明。出于我们的目的，可以忽略它。\n\
  \n每个分量的两位十六进制数字（如我们的颜色表示法中所用）正好对应 0 到 255 的范围——两位基数为 16 的数字可以表示 16² = 256 个数。数字的\
  \ `toString` 方法可以接受一个基数作为参数，因此 `n.toString(16)` 会生成一个基数为 16 的字符串表示。我们必须确保每个数字占两位，因此\
  \ `hex` 辅助函数在必要时调用 `padStart` 来添加前导零。\n\n现在我们可以加载和保存了！在完成之前，还有一个功能需要实现。\n\n### 撤销历史\n\
  \n编辑过程的一半是犯小错误并纠正它们。因此，绘图程序中的一个重要功能是撤销历史。\n\n为了能够撤销更改，我们需要存储图片的先前版本。由于它是一个不可变值，这很容易。但这确实需要在应用程序状态中添加一个额外的字段。\n\
  \n我们将添加一个 `done` 数组来保存图片的先前版本。维护此属性需要一个更复杂的状态更新函数，该函数会将图片添加到数组中。\n\n但我们不想存储*每一次*更改，只存储相隔一定时间的更改。为此，我们需要第二个属性\
  \ `doneAt`，用于跟踪我们上次在历史中存储图片的时间。\n\n```\nfunction historyUpdateState(state, action)\
  \ {\n  if (action.undo == true) {\n    if (state.done.length == 0) return state;\n\
  \    return Object.assign({}, state, {\n      picture: state.done[0],\n      done:\
  \ state.done.slice(1),\n      doneAt: 0\n    });\n  } else if (action.picture &&\n\
  \             state.doneAt < Date.now() - 1000) {\n    return Object.assign({},\
  \ state, action, {\n      done: [state.picture, ...state.done],\n      doneAt: Date.now()\n\
  \    });\n  } else {\n    return Object.assign({}, state, action);\n  }\n}\n```\n\
  \n当动作是撤销动作时，该函数从历史中取出最近的图片，并将其设为当前图片。它将 `doneAt` 设置为 0，以确保下一次更改一定会将图片存回历史，这样如果你愿意，以后还可以再次恢复到它。\n\
  \n否则，如果动作包含一张新图片，并且上次存储的时间距离现在超过一秒（1000 毫秒），则更新 `done` 和 `doneAt` 属性以存储之前的图片。\n\n\
  撤销按钮组件做的事情不多。它在被点击时调度撤销动作，并在没有可撤销内容时禁用自身。\n\n```\nclass UndoButton {\n  constructor(state,\
  \ {dispatch}) {\n    this.dom = elt(\"button\", {\n      onclick: () => dispatch({undo:\
  \ true}),\n      disabled: state.done.length == 0\n    }, \"![图片](img/c0347-01.jpg)\
  \ 撤销\");\n  }\n  syncState(state) {\n    this.dom.disabled = state.done.length ==\
  \ 0;\n  }\n}\n```\n\n### 开始绘制\n\n为了设置应用程序，我们需要创建一个状态、一组工具、一组控件和一个调度函数。我们可以将它们传递给\
  \ `PixelEditor` 构造函数来创建主组件。由于我们将在练习中创建多个编辑器，因此首先定义一些绑定。\n\n```\nconst startState\
  \ = {\n   tool: \"draw\",\n   color: \"#000000\",\n   picture: Picture.empty(60,\
  \ 30, \"#f0f0f0\"),\n   done: [],\n   doneAt: 0\n};\n\nconst baseTools = {draw,\
  \ fill, rectangle, pick};\n\nconst baseControls = [\n   ToolSelect, ColorSelect,\
  \ SaveButton, LoadButton, UndoButton\n];\n\nfunction startPixelEditor({state = startState,\n\
  \                           tools = baseTools,\n```\n\n\n\n\n\n```\ncontrols = baseControls})\
  \ {\n\n let app = new PixelEditor(state, {\n\n   tools,\n\n   controls,\n\n   dispatch(action)\
  \ {\n\n     state = historyUpdateState(state, action);\n\n     app.syncState(state);\n\
  \n   }\n\n });\n\n return app.dom;\n\n}\n```\n\n当解构对象或数组时，可以在绑定名称后使用 `=` 来为绑定提供默认值，当属性缺失或值为\
  \ `undefined` 时使用该默认值。`startPixelEditor` 函数利用这一点，接受一个包含多个可选属性的对象作为参数。例如，如果你没有提供\
  \ `tools` 属性，那么 `tools` 将被绑定为 `baseTools`。\n\n这就是我们如何在屏幕上获得一个实际的编辑器：\n\n```\n<div></div>\n\
  \n<script>\n  document.querySelector(\"div\")\n    .appendChild(startPixelEditor({}));\n\
  </script>\n```\n\n### 为什么这么难？\n\n浏览器技术令人惊叹。它提供了一套强大的界面构建模块、样式化和操作它们的方法，以及检查和调试应用程序的工具。你为浏览器编写的软件几乎可以在全球任何一台电脑或手机上运行。\n\
  \n与此同时，浏览器技术也很荒谬。你必须学习大量愚蠢的技巧和晦涩的知识才能掌握它，而且它提供的默认编程模型问题重重，以至于大多数程序员宁愿用多层抽象来掩盖它，也不愿直接处理。\n\
  \n尽管情况确实在改善，但改善的方式大多是增加更多元素来弥补缺陷——从而制造出更多的复杂性。一个被数百万网站使用的功能实际上无法被替换。即使可以，也很难决定用什么来替换它。\n\
  \n技术从来不会存在于真空中——我们受到工具以及产生这些工具的社会、经济、历史因素的约束。这可能会令人烦恼，但通常更有成效的做法是努力理解*现有*技术现实是如何运作的——以及它为什么会是现在这个样子——而不是对它发怒或期待另一种现实。\n\
  \n新的抽象*可以*是有帮助的。我在本章中使用的组件模型和数据流约定就是这种抽象的一种粗糙形式。如前所述，有一些库试图让用户界面编程更愉快。在撰写本文时，React\
  \ 和 Angular 是流行的选择，但这类框架还有一整个小产业。如果你对编程 Web 应用程序感兴趣，我建议研究其中几个，以了解它们的工作原理以及它们提供的好处。\n\
  \n### 练习\n\n我们的程序仍有改进空间。让我们以练习的形式添加一些功能。\n\n#### *键盘绑定*\n\n为应用程序添加键盘快捷键。工具名称的首字母选择该工具，CTRL-Z\
  \ 或 COMMAND-Z 激活撤销。\n\n通过修改 `PixelEditor` 组件来实现。在包裹的 `<div>` 元素上添加一个值为 0 的 `tabIndex`\
  \ 属性，以便它可以接收键盘焦点。注意，与 `tabindex` *属性*对应的*属性*名为 `tabIndex`，其中 I 是大写的，而我们的 `elt` 函数期望的是属性名。直接在该元素上注册键盘事件处理程序。这意味着你必须先点击、触摸或\
  \ Tab 到应用程序，然后才能用键盘与之交互。\n\n请记住，键盘事件具有 `ctrlKey` 和 `metaKey`（用于 Mac 上的 COMMAND 键）属性，你可以用它们来检查这些键是否被按下。\n\
  \n#### *高效绘制*\n\n在绘制过程中，我们的应用程序完成的大部分工作都在 `drawPicture` 中。创建新状态并更新 DOM 的其余部分并不昂贵，但重新绘制画布上的所有像素则相当耗费工作。\n\
  \n找到一种方法，通过只重新绘制实际发生变化的像素来加快 `PictureCanvas` 的 `syncState` 方法。\n\n请记住，`drawPicture`\
  \ 也被保存按钮使用，因此如果你更改它，要么确保更改不会破坏旧用途，要么创建一个不同名称的新版本。\n\n另外请注意，更改 `<canvas>` 元素的大小（通过设置其\
  \ `width` 或 `height` 属性）会清除它，使其再次完全透明。\n\n#### *圆形*\n\n定义一个名为 circle 的工具，当拖动时绘制一个实心圆。圆的中心位于拖动或触摸手势开始的位置，半径由拖动的距离决定。\n\
  \n#### *合适的线条*\n\n这是一个比前两个更高级的练习，它要求你为一个不简单的问题设计解决方案。在开始这个练习之前，请确保你有足够的时间和耐心，并且不要因最初的失败而气馁。\n\
  \n在大多数浏览器中，当你使用绘制工具并快速在图片上拖动时，你不会得到一条连续的线。相反，你会得到带有间隙的点，因为 `mousemove` 或 `touchmove`\
  \ 事件触发得不够快，无法覆盖每个像素。\n\n改进绘制工具，使其绘制一条完整的线。这意味着你必须让运动处理函数记住上一个位置，并将其连接到当前位置。为此，由于像素之间可能相距任意距离，你需要编写一个通用的线条绘制函数。\n\
  \n两个像素之间的线是一条尽可能直的连续像素链。对角相邻的像素也算作连接，因此斜线应该看起来像左图，而不是右图。\n\n![图片](img/f0350-01.jpg)\n\
  \n最后，如果我们有代码可以在任意两点之间绘制一条线，我们不妨用它来定义一个线条工具，该工具在拖动的起点和终点之间绘制一条直线。\n\n# 第三部分\n\n#\
  \ NODE\n\n“一个学生问：‘古代的程序员只用简单的机器，没有编程语言，却能写出优美的程序。为什么我们要用复杂的机器和编程语言？’傅子回答说：‘古代的建造者只用棍棒和黏土，却能建造出美丽的小屋。’”\n\
  \n—— 袁马大师，《编程之道》\n\n![图片](img/f0352-01.jpg)\n\n## 20 NODE.JS\n\n到目前为止，我们只在单一环境中使用了\
  \ JavaScript 语言：浏览器。本章和下一章将简要介绍 Node.js，这是一个让你在浏览器之外应用 JavaScript 技能的程序。使用 Node.js，你可以构建从小型命令行工具到驱动动态网站的\
  \ HTTP 服务器等各种东西。\n\n这些章节旨在教你 Node.js 使用的主要概念，并为你提供足够的信息来编写有用的程序。它们并不试图成为对该平台的完整或详尽的论述。\n\
  \n如果你想跟着做并运行本章中的代码，你需要安装 Node.js 10.1 或更高版本。为此，请访问 *[`nodejs.org`](https://nodejs.org)*\
  \ 并按照你操作系统的安装说明进行操作。你也可以在那里找到 Node.js 的更多文档。\n\n### 背景\n\n编写通过网络通信的系统时，一个比较困难的问题是管理输入和输出——即从网络和硬盘读取和写入数据。移动数据需要时间，而巧妙地调度数据可以极大地影响系统对用户或网络请求的响应速度。\n\
  \n在这类程序中，异步编程通常很有帮助。它允许程序同时从多个设备发送和接收数据，而无需复杂的线程管理和同步。\n\n\n\n\nNode 最初的设计目的是让异步编程变得简单便捷。JavaScript\
  \ 非常适合像 Node 这样的系统。它是少数几种没有内置输入输出方式的编程语言之一。因此，JavaScript 能够适应 Node 那种相当独特的输入输出方式，而不会产生两个不一致的接口。2009\
  \ 年，当 Node 被设计时，人们已经在浏览器中基于回调进行编程，因此该语言社区已经习惯了异步编程风格。\n\n### node 命令\n\n当 Node.js\
  \ 安装在系统上时，它会提供一个名为 `node` 的程序，用于运行 JavaScript 文件。假设你有一个 `hello.js` 文件，包含以下代码：\n\n\
  ```\nlet message = \"Hello world\";\n\nconsole.log(message);\n```\n\n然后你可以像这样从命令行运行\
  \ `node` 来执行程序：\n\n```\n$ node hello.js\n\nHello world\n```\n\nNode 中的 `console.log`\
  \ 方法与浏览器中的功能类似。它会输出一段文本。但在 Node 中，文本会输出到进程的标准输出流，而不是浏览器的 JavaScript 控制台。当从命令行运行\
  \ `node` 时，这意味着你会在终端中看到输出的值。\n\n如果你运行 `node` 而不指定文件，它会提供一个提示符，你可以在其中输入 JavaScript\
  \ 代码并立即看到结果。\n\n```\n$ node\n\n> 1 + 1\n\n2\n\n> [-1, -2, -3].map(Math.abs)\n\n\
  [1, 2, 3]\n\n> process.exit(0)\n\n$\n```\n\n`process` 绑定与 `console` 绑定一样，在 Node\
  \ 中是全局可用的。它提供了多种检查和操作当前程序的方法。`exit` 方法用于结束进程，并可以传入一个退出状态码，该状态码告诉启动 `node` 的程序（本例中是命令行\
  \ shell）程序是否成功完成（状态码 0）或遇到错误（任何其他状态码）。\n\n要查找传递给脚本的命令行参数，你可以读取 `process.argv`，它是一个字符串数组。注意，它还包括\
  \ `node` 命令的名称和你的脚本名称，因此实际参数从索引 2 开始。如果 `showargv.js` 包含语句 `console.log(process.argv)`，你可以像这样运行它：\n\
  \n```\n$ node showargv.js one --and two\n\n[\"node\", \"/tmp/showargv.js\", \"one\"\
  , \"--and\", \"two\"]\n```\n\n所有标准的 JavaScript 全局绑定，例如 `Array`、`Math` 和 `JSON`，在\
  \ Node 环境中也存在。但与浏览器相关的功能，如 `document` 或 `prompt`，则不存在。\n\n### 模块\n\n除了我提到的绑定（如 `console`\
  \ 和 `process`）之外，Node 在全局作用域中只添加了少量其他绑定。如果你想访问内置功能，必须通过模块系统来获取。\n\n基于 `require`\
  \ 函数的 CommonJS 模块系统在第 171 页的“CommonJS”一节中已有描述。该系统内置于 Node 中，用于加载从内置模块到下载的包，再到属于你自己程序的文件等各种内容。\n\
  \n当调用 `require` 时，Node 必须将给定的字符串解析为可以加载的实际文件。以 `/`、`./` 或 `../` 开头的路径名会相对于当前模块的路径进行解析，其中\
  \ `./` 表示当前目录，`../` 表示上一级目录，`/` 表示文件系统的根目录。因此，如果你从文件 `/tmp/robot/robot.js` 中请求 `\"\
  ./graph\"`，Node 将尝试加载文件 `/tmp/robot/graph.js`。\n\n`.js` 扩展名可以省略，如果存在这样的文件，Node 会自动添加。如果请求的路径指向一个目录，Node\
  \ 将尝试加载该目录中名为 `index.js` 的文件。\n\n当传递给 `require` 的字符串看起来不像相对路径或绝对路径时，它会被假定为引用一个内置模块或安装在\
  \ `node_modules` 目录中的模块。例如，`require(\"fs\")` 会提供 Node 的内置文件系统模块。而 `require(\"robot\"\
  )` 可能会尝试加载 `node_modules/robot/` 中的库。安装此类库的常用方法是使用 NPM，我们稍后会回到这个话题。\n\n让我们建立一个由两个文件组成的小项目。第一个文件名为\
  \ `main.js`，定义了一个可以从命令行调用的脚本，用于反转字符串。\n\n```\nconst {reverse} = require(\"./reverse\"\
  );\n\n// 索引 2 保存第一个实际命令行参数\n\nlet argument = process.argv[2];\n\nconsole.log(reverse(argument));\n\
  ```\n\n文件 `reverse.js` 定义了一个用于反转字符串的库，该库既可以被这个命令行工具使用，也可以被其他需要直接访问字符串反转函数的脚本使用。\n\
  \n```\nexports.reverse = function(string) {\n\n   return Array.from(string).reverse().join(\"\
  \");\n\n};\n```\n\n记住，向 `exports` 添加属性会将这些属性添加到模块的接口中。由于 Node.js 将文件视为 CommonJS\
  \ 模块，`main.js` 可以从 `reverse.js` 中获取导出的 `reverse` 函数。\n\n现在我们可以像这样调用我们的工具：\n\n```\n\
  $ node main.js JavaScript\n\ntpircSavaJ\n```\n\n### 使用 NPM 安装\n\nNPM 在第 10 章中介绍过，它是一个\
  \ JavaScript 模块的在线仓库，其中许多模块是专门为 Node 编写的。当你在计算机上安装 Node 时，你也会获得 `npm` 命令，你可以用它来与这个仓库交互。\n\
  \nNPM 的主要用途是下载包。我们在第 10 章中看到了 `ini` 包。我们可以使用 NPM 来获取并将该包安装到我们的计算机上。\n\n```\n$ npm\
  \ install ini\n\nnpm WARN enoent ENOENT: no such file or directory,\n\n        \
  \ open '/tmp/package.json'\n\n+ ini@1.3.5\n\nadded 1 package in 0.552s\n```\n\n\
  ```\n$   node\n\n>   const {parse} = require(\"ini\");\n\n>   parse(\"x = 1\\ny\
  \ = 2\");\n\n{   x: '1', y: '2' }\n```\n\n运行 `npm install` 后，NPM 会创建一个名为 `node_modules`\
  \ 的目录。在该目录中会有一个 `ini` 目录，其中包含该库。你可以打开它并查看代码。当我们调用 `require(\"ini\")` 时，这个库会被加载，我们可以调用它的\
  \ `parse` 属性来解析配置文件。\n\n默认情况下，NPM 将包安装到当前目录下，而不是集中存放。如果你习惯了其他包管理器，这可能会显得不寻常，但它有优点——它让每个应用程序完全控制其安装的包，并且更容易管理版本以及在删除应用程序时进行清理。\n\
  \n#### *包文件*\n\n在 `npm install` 示例中，你可以看到一条关于 `package.json` 文件不存在的警告。建议为每个项目创建这样一个文件，可以手动创建，也可以通过运行\
  \ `npm init` 创建。它包含一些关于项目的信息，例如名称和版本，并列出其依赖项。\n\n第 7 章中的机器人模拟，如第 177 页练习“模块化机器人”中所模块化的那样，可能有一个像这样的\
  \ `package.json` 文件：\n\n```\n{\n\n  \"author\": \"Marijn Haverbeke\",\n\n  \"name\"\
  : \"eloquent-javascript-robot\",\n\n  \"description\": \"Simulation of a package-delivery\
  \ robot\",\n\n  \"version\": \"1.0.0\",\n\n  \"main\": \"run.js\",\n\n  \"dependencies\"\
  : {\n\n    \"dijkstrajs\": \"¹.0.1\",\n\n    \"random-item\": \"¹.0.0\"\n\n  },\n\
  \n  \"license\": \"ISC\"\n\n}\n```\n\n当你运行 `npm install` 而不指定要安装的包时，NPM 会安装 `package.json`\
  \ 中列出的依赖项。当你安装一个尚未列为依赖项的特定包时，NPM 会将其添加到 `package.json` 中。\n\n#### *版本*\n\n`package.json`\
  \ 文件既列出了程序自身的版本，也列出了其依赖项的版本。版本是一种处理包独立演进的方式，针对某个包在某个时间点编写的代码可能无法与该包的后续修改版本兼容。\n\n\
  NPM 要求其包遵循一种称为*语义化版本控制*的规范，该规范在版本号中编码了关于哪些版本是*兼容的*（不破坏旧接口）的信息。语义化版本由三个数字组成，用句点分隔，例如\
  \ `2.3.0`。每当添加新功能时，中间的数字必须递增。\n\n\n\n\n每次兼容性被破坏，导致使用该包的现有代码可能无法与新版本兼容时，第一个版本号必须递增。\n\
  \n`package.json` 中依赖项版本号前的脱字符（`^`）表示可以安装与给定版本兼容的任何版本。例如，`\"².3.0\"` 表示允许安装任何大于等于\
  \ 2.3.0 且小于 3.0.0 的版本。\n\n`npm` 命令也用于发布新包或包的新版本。如果你在包含 `package.json` 文件的目录中运行 `npm\
  \ publish`，它会将该 JSON 文件中列出的名称和版本的包发布到注册表。任何人都可以向 `NPM` 发布包——但只能使用尚未被占用的包名，因为如果任何人都能随意更新现有包，那将相当可怕。\n\
  \n由于 `npm` 程序是一个与开放系统（包注册表）通信的软件，它所做的事情并无独特之处。另一个程序 `yarn`（可以从 `NPM` 注册表安装）使用略有不同的界面和安装策略，扮演着与\
  \ `npm` 相同的角色。\n\n本书不会深入探讨 `NPM` 使用的细节。请参阅 [`npmjs.org`](https://npmjs.org) 获取更多文档和搜索包的方法。\n\
  \n### 文件系统模块\n\nNode 中最常用的内置模块之一是 `fs` 模块，它代表 *文件系统*。它导出了用于处理文件和目录的函数。\n\n例如，名为\
  \ `readFile` 的函数会读取一个文件，然后使用文件内容调用回调函数。\n\n```\nlet {readFile} = require(\"fs\"\
  );\n\nreadFile(\"file.txt\", \"utf8\", (error, text) => {\n\n  if (error) throw\
  \ error;\n\n  console.log(\"The file contains:\", text);\n\n});\n```\n\n`readFile`\
  \ 的第二个参数表示用于将文件解码为字符串的 *字符编码*。文本可以通过多种方式编码为二进制数据，但大多数现代系统使用 UTF-8。因此，除非你有理由相信使用了其他编码，否则在读取文本文件时应传递\
  \ `\"utf8\"`。如果不传递编码，Node 会假定你对二进制数据感兴趣，并返回一个 `Buffer` 对象而不是字符串。这是一个类似数组的对象，包含表示文件中字节（8\
  \ 位数据块）的数字。\n\n```\nconst {readFile} = require(\"fs\");\n\nreadFile(\"file.txt\"\
  , (error, buffer) => {\n\n  if (error) throw error;\n\n  console.log(\"The file\
  \ contained\", buffer.length, \"bytes.\",\n\n           \"The first byte is:\",\
  \ buffer[0]);\n\n});\n```\n\n类似的函数 `writeFile` 用于将文件写入磁盘。\n\n```\nconst {writeFile}\
  \ = require(\"fs\");\n\nwriteFile(\"graffiti.txt\", \"Node was here\", err => {\n\
  \n  if (err) console.log(`Failed to write file: ${err}`);\n\n  else console.log(\"\
  File written.\");\n\n});\n```\n\n这里无需指定编码——`writeFile` 会假定，当给它一个要写入的字符串（而不是 `Buffer`\
  \ 对象）时，它应使用默认字符编码（即 UTF-8）将其作为文本写出。\n\n`fs` 模块包含许多其他有用的函数：`readdir` 会以字符串数组形式返回目录中的文件，`stat`\
  \ 会检索文件信息，`rename` 会重命名文件，`unlink` 会删除文件，等等。具体细节请参阅 [`nodejs.org`](https://nodejs.org)\
  \ 上的文档。\n\n这些函数大多将回调函数作为最后一个参数，回调函数会接收一个错误（第一个参数）或成功结果（第二个参数）。正如我们在第 11 章中看到的，这种编程风格存在缺点——最大的缺点是错误处理变得冗长且容易出错。\n\
  \n尽管 Promise 已经成为 JavaScript 的一部分有一段时间了，但在撰写本文时，它们与 Node.js 的集成仍在进行中。自版本 10.1 起，`fs`\
  \ 包导出了一个 `promises` 对象，其中包含与 `fs` 大部分相同的函数，但使用 Promise 而不是回调函数。\n\n```\nconst {readFile}\
  \ = require(\"fs\").promises;\n\nreadFile(\"file.txt\", \"utf8\")\n\n  .then(text\
  \ => console.log(\"The file contains:\", text));\n```\n\n有时你不需要异步，它反而会碍事。`fs` 中的许多函数也有同步变体，其名称末尾添加了\
  \ `Sync`。例如，`readFile` 的同步版本称为 `readFileSync`。\n\n```\nconst {readFileSync} = require(\"\
  fs\");\n\nconsole.log(\"The file contains:\",\n\n            readFileSync(\"file.txt\"\
  , \"utf8\"));\n```\n\n请注意，在执行此类同步操作时，你的程序会完全停止。如果它需要响应用户或网络上的其他机器，卡在同步操作上可能会导致令人烦恼的延迟。\n\
  \n### HTTP 模块\n\n另一个核心模块是 `http`。它提供了运行 HTTP 服务器和发起 HTTP 请求的功能。\n\n启动一个 HTTP 服务器只需以下代码：\n\
  \n```\nconst {createServer} = require(\"http\");\n\nlet server = createServer((request,\
  \ response) => {\n\n  response.writeHead(200, {\"Content-Type\": \"text/html\"});\n\
  \n  response.write(`\n\n    <h1>Hello!</h1>\n\n    <p>You asked for <code>${request.url}</code></p>`);\n\
  \n  response.end();\n\n});\n\nserver.listen(8000);\n\nconsole.log(\"Listening! (port\
  \ 8000)\");\n```\n\n如果你在自己的机器上运行此脚本，可以将浏览器指向 [`localhost:8000/hello`](http://localhost:8000/hello)\
  \ 向你的服务器发起请求。它会返回一个小的 HTML 页面。\n\n作为参数传递给 `createServer` 的函数会在每次客户端连接到服务器时被调用。`request`\
  \ 和 `response` 绑定是表示传入和传出数据的对象。第一个包含有关请求的信息，例如其 `url` 属性，它告诉我们请求是针对哪个 URL 的。\n\n\
  因此，当你在浏览器中打开该页面时，它会向你的计算机发送一个请求。这会导致服务器函数运行并发送回一个响应，然后你可以在浏览器中看到它。\n\n要发送回一些内容，你需要调用\
  \ `response` 对象上的方法。第一个方法 `writeHead` 会写出响应头（参见第 18 章）。你需要提供状态码（本例中为 200，表示“OK”）和一个包含头信息的对象。该示例设置了\
  \ `Content-Type` 头，以告知客户端我们将发送回一个 HTML 文档。\n\n接下来，实际的响应体（文档本身）通过 `response.write`\
  \ 发送。如果你希望逐段发送响应，例如在数据可用时将其流式传输到客户端，可以多次调用此方法。最后，`response.end` 表示响应结束。\n\n调用 `server.listen`\
  \ 会使服务器开始监听端口 8000 上的连接。这就是为什么你必须连接到 *localhost:8000* 才能与该服务器通信，而不是仅仅 *localhost*（后者会使用默认端口\
  \ 80）。\n\n当你运行此脚本时，进程会一直等待。当脚本正在监听事件（本例中为网络连接）时，Node 不会在脚本结束时自动退出。要关闭它，请按 CTRL-C。\n\
  \n一个真正的 Web 服务器通常比示例中的功能更多——它会查看请求的 `method`（`method` 属性）以了解客户端试图执行的操作，并查看请求的 URL\
  \ 以确定该操作针对哪个资源。我们将在第 363 页的“文件服务器”中看到一个更高级的服务器。\n\n要充当 HTTP *客户端*，我们可以使用 `http`\
  \ 模块中的 `request` 函数。\n\n```\nconst {request} = require(\"http\");\n\nlet requestStream\
  \ = request({\n\n  hostname: \"eloquentjavascript.net\",\n\n  path: \"/20_node.html\"\
  ,\n\n  method: \"GET\",\n\n  headers: {Accept: \"text/html\"}\n\n}, response =>\
  \ {\n\n  console.log(\"Server responded with status code\",\n\n              response.statusCode);\n\
  \n});\n\nrequestStream.end();\n```\n\n\n\n\n`request`的第一个参数用于配置请求，告诉 Node 要连接哪个服务器、请求该服务器的哪个路径、使用哪种方法等。第二个参数是一个函数，当收到响应时会被调用。该函数接收一个对象，允许我们检查响应，例如查看其状态码。\n\
  \n就像我们在服务器中看到的响应对象一样，`request`返回的对象允许我们使用`write`方法将数据流式写入请求，并使用`end`方法结束请求。示例中没有使用`write`，因为`GET`请求的请求体不应包含数据。\n\
  \n`https`模块中也有一个类似的`request`函数，可用于向`https:` URL 发起请求。\n\n使用 Node 的原生功能发起请求相当冗长。NPM\
  \ 上有更便捷的封装包。例如，`node-fetch`提供了基于 Promise 的`fetch`接口，与浏览器中的用法相同。\n\n### 流\n\n我们在\
  \ HTTP 示例中已经看到了两个可写流的实例——即服务器可以写入的响应对象，以及`request`返回的请求对象。\n\n`可写流`是 Node 中广泛使用的概念。这类对象有一个`write`方法，可以传入字符串或`Buffer`对象来向流中写入内容。它们的`end`方法会关闭流，并可选地在关闭前向流写入一个值。这两个方法还可以接受一个回调作为额外参数，当写入或关闭完成时会调用该回调。\n\
  \n可以使用`fs`模块的`createWriteStream`函数创建一个指向文件的可写流。然后，你可以使用结果对象的`write`方法逐块写入文件，而不是像`writeFile`那样一次性写入。\n\
  \n可读流则稍微复杂一些。传递给 HTTP 服务器回调的`request`绑定和传递给 HTTP 客户端回调的`response`绑定都是可读流——服务器读取请求然后写入响应，而客户端先写入请求然后读取响应。从流中读取是通过事件处理程序完成的，而不是通过方法。\n\
  \n在 Node 中，触发事件的对象有一个名为`on`的方法，类似于浏览器中的`addEventListener`方法。你给它一个事件名称和一个函数，它就会注册该函数，以便在给定事件发生时调用。\n\
  \n可读流有`\"data\"`和`\"end\"`事件。第一个事件在每次数据到达时触发，第二个事件在流结束时调用。这种模型最适合`流式`处理可以立即处理的数据，即使整个文档尚未可用。可以使用`fs`的`createReadStream`函数将文件作为可读流读取。\n\
  \n以下代码创建了一个服务器，它读取请求体并将其以全大写文本的形式流式返回给客户端：\n\n```\nconst {createServer} = require(\"\
  http\");\n\ncreateServer((request, response) => {\n  response.writeHead(200, {\"\
  Content-Type\": \"text/plain\"});\n  request.on(\"data\", chunk =>\n    response.write(chunk.toString().toUpperCase()));\n\
  \  request.on(\"end\", () => response.end());\n}).listen(8000);\n```\n\n传递给`data`处理程序的`chunk`值是一个二进制`Buffer`。我们可以通过其`toString`方法将其解码为\
  \ UTF-8 编码的字符，从而转换为字符串。\n\n以下代码在运行大写转换服务器时，会向该服务器发送一个请求并输出收到的响应：\n\n```\nconst {request}\
  \ = require(\"http\");\n\nrequest({\n  hostname: \"localhost\",\n  port: 8000,\n\
  \  method: \"POST\"\n}, response => {\n  response.on(\"data\", chunk =>\n    process.stdout.write(chunk.toString()));\n\
  }).end(\"Hello server\");\n// → HELLO SERVER\n```\n\n该示例向`process.stdout`（进程的标准输出，是一个可写流）写入，而不是使用`console.log`。我们不能使用`console.log`，因为它会在写入的每段文本后添加一个额外的换行符，而这里并不合适，因为响应可能以多个块的形式到达。\n\
  \n### 文件服务器\n\n让我们将新学到的 HTTP 服务器知识与文件系统操作结合起来，创建一个连接两者的桥梁：一个允许远程访问文件系统的 HTTP 服务器。这样的服务器有多种用途——它允许\
  \ Web 应用程序存储和共享数据，或者可以让一组人共享访问一组文件。\n\n当我们将文件视为 HTTP 资源时，HTTP 方法`GET`、`PUT`和`DELETE`可以分别用于读取、写入和删除文件。我们将请求中的路径解释为请求所引用的文件路径。\n\
  \n我们可能不想共享整个文件系统，因此我们将这些路径解释为从服务器的工作目录开始，即服务器启动时所在的目录。如果我从`/tmp/public/`（或在 Windows\
  \ 上为`C:\\tmp\\public\\`）运行服务器，那么对`/file.txt`的请求应指向`/tmp/public/file.txt`（或`C:\\\
  tmp\\public\\file.txt`）。\n\n我们将逐步构建程序，使用一个名为`methods`的对象来存储处理各种 HTTP 方法的函数。方法处理程序是异步函数，接收请求对象作为参数，并返回一个解析为描述响应的对象的\
  \ Promise。\n\n```\nconst {createServer} = require(\"http\");\nconst methods = Object.create(null);\n\
  \ncreateServer((request, response) => {\n  let handler = methods[request.method]\
  \ || notAllowed;\n  handler(request)\n    .catch(error => {\n       if (error.status\
  \ != null) return error;\n       return {body: String(error), status: 500};\n  \
  \  })\n    .then(({body, status = 200, type = \"text/plain\"}) => {\n        response.writeHead(status,\
  \ {\"Content-Type\": type});\n        if (body && body.pipe) body.pipe(response);\n\
  \        else response.end(body);\n    });\n}).listen(8000);\n\nasync function notAllowed(request)\
  \ {\n   return {\n     status: 405,\n     body: `Method ${request.method} not allowed.`\n\
  \   };\n}\n```\n\n这将启动一个仅返回 405 错误响应的服务器，该状态码用于表示服务器拒绝处理给定的方法。\n\n当请求处理程序的 Promise\
  \ 被拒绝时，`catch`调用会将错误转换为响应对象（如果还不是的话），以便服务器可以发送错误响应，通知客户端处理请求失败。\n\n响应描述中的`status`字段可以省略，此时默认为\
  \ 200（OK）。`type`属性中的内容类型也可以省略，此时响应默认为纯文本。\n\n当`body`的值是一个可读流时，它将有一个`pipe`方法，用于将所有内容从可读流转发到可写流。如果不是，则假定为`null`（无主体）、字符串或缓冲区，并直接传递给响应的`end`方法。\n\
  \n为了确定哪个文件路径对应于请求 URL，`urlPath`函数使用 Node 内置的`url`模块来解析 URL。它获取`pathname`（类似于`\"\
  /file.txt\"`），解码以去除`%20`风格的转义码，然后相对于程序的工作目录进行解析。\n\n```\nconst {parse} = require(\"\
  url\");\nconst {resolve, sep} = require(\"path\");\n\nconst baseDirectory = process.cwd();\n\
  \nfunction urlPath(url) {\n  let {pathname} = parse(url);\n  let path = resolve(decodeURIComponent(pathname).slice(1));\n\
  \  if (path != baseDirectory &&\n      !path.startsWith(baseDirectory + sep)) {\n\
  \    throw {status: 403, body: \"Forbidden\"};\n  }\n  return path;\n}\n```\n\n\
  一旦你设置了一个程序来接受网络请求，就必须开始担心安全性。在这种情况下，如果我们不小心，很可能会意外地将整个文件系统暴露给网络。\n\n\n\n文件路径在 `Node`\
  \ 中是字符串。要将这样的字符串映射到实际文件，需要进行相当多的解释工作。例如，路径可能包含 `../` 来引用父目录。因此，一个明显的问题来源是对类似 `/../secret_file`\
  \ 的路径的请求。\n\n为了避免此类问题，`urlPath` 使用了 `path` 模块中的 `resolve` 函数，该函数可以解析相对路径。然后它会验证结果是否*位于*工作目录之下。`process.cwd`\
  \ 函数（其中 `cwd` 代表*当前工作目录*）可用于查找此工作目录。`path` 包中的 `sep` 绑定是系统的路径分隔符——在 Windows 上是反斜杠，在大多数其他系统上是正斜杠。当路径不以基础目录开头时，该函数会抛出一个错误响应对象，并使用\
  \ HTTP 状态码指示禁止访问该资源。\n\n我们将设置 `GET` 方法，在读取目录时返回文件列表，在读取普通文件时返回文件内容。\n\n一个棘手的问题是，在返回文件内容时，我们应该设置哪种\
  \ `Content-Type` 头。由于这些文件可能是任何类型，我们的服务器不能简单地返回相同的内容类型。`NPM` 可以再次帮助我们。`mime` 包（内容类型指示符如\
  \ `text/plain` 也称为 *MIME 类型*）知道大量文件扩展名的正确类型。\n\n以下 `npm` 命令，在服务器脚本所在的目录中，安装特定版本的\
  \ `mime`：\n\n```\n$ npm install mime@2.2.0\n```\n\n当请求的文件不存在时，要返回的正确 HTTP 状态码是 `404`。我们将使用\
  \ `stat` 函数（该函数查找文件的信息）来查明文件是否存在以及它是否是一个目录。\n\n```\nconst {createReadStream} = require(\"\
  fs\");\n\nconst {stat, readdir} = require(\"fs\").promises;\n\nconst mime = require(\"\
  mime\");\n\nmethods.GET = async function(request) {\n\n   let path = urlPath(request.url);\n\
  \n   let stats;\n\n   try {\n\n     stats = await stat(path);\n\n   } catch (error)\
  \ {\n\n     if (error.code != \"ENOENT\") throw error;\n\n     else return {status:\
  \ 404, body: \"File not found\"};\n\n   }\n\n   if (stats.isDirectory()) {\n\n \
  \    return {body: (await readdir(path)).join(\"\\n\")};\n\n   } else {\n\n    \
  \ return {body: createReadStream(path),\n\n              type: mime.getType(path)};\n\
  \n   }\n\n};\n```\n\n由于它必须访问磁盘，因此可能需要一些时间，`stat` 是异步的。因为我们使用的是 promise 而不是回调风格，所以它必须从\
  \ `promises` 导入，而不是直接从 `fs` 导入。\n\n当文件不存在时，`stat` 会抛出一个错误对象，其 `code` 属性为 `\"ENOENT\"\
  `。这些有些晦涩、源自 Unix 的错误码是你在 `Node` 中识别错误类型的方式。\n\n`stat` 返回的 `stats` 对象告诉我们关于文件的一些信息，例如其大小（`size`\
  \ 属性）和修改日期（`mtime` 属性）。这里我们关心的是它是目录还是普通文件，`isDirectory` 方法可以告诉我们。\n\n我们使用 `readdir`\
  \ 读取目录中的文件数组并将其返回给客户端。对于普通文件，我们使用 `createReadStream` 创建一个可读流，并将其作为主体返回，同时返回 `mime`\
  \ 包根据文件名给出的内容类型。\n\n处理 `DELETE` 请求的代码稍微简单一些。\n\n```\nconst {rmdir, unlink} = require(\"\
  fs\").promises;\n\nmethods.DELETE = async function(request) {\n\n   let path = urlPath(request.url);\n\
  \n   let stats;\n\n   try {\n\n     stats = await stat(path);\n\n   } catch (error)\
  \ {\n\n     if (error.code != \"ENOENT\") throw error;\n\n     else return {status:\
  \ 204};\n\n   }\n\n   if (stats.isDirectory()) await rmdir(path);\n\n   else await\
  \ unlink(path);\n\n   return {status: 204};\n\n};\n```\n\n当 HTTP 响应不包含任何数据时，可以使用状态码\
  \ `204`（“无内容”）来表示。由于对删除操作的响应除了操作是否成功之外不需要传输任何信息，因此这里返回这个状态码是合理的。\n\n你可能会想，为什么尝试删除一个不存在的文件会返回成功状态码，而不是错误。当要删除的文件不存在时，可以说请求的目标已经实现了。HTTP\
  \ 标准鼓励我们使请求*幂等*，这意味着多次发出相同的请求会产生与一次请求相同的结果。从某种意义上说，如果你试图删除一个已经不存在的东西，你试图达到的效果已经实现了——那个东西已经不在了。\n\
  \n这是 `PUT` 请求的处理程序：\n\n```\nconst {createWriteStream} = require(\"fs\");\n\nfunction\
  \ pipeStream(from, to) {\n\n  return new Promise((resolve, reject) => {\n\n    from.on(\"\
  error\", reject);\n\n    to.on(\"error\", reject);\n\n    to.on(\"finish\", resolve);\n\
  \n    from.pipe(to);\n\n  });\n\n}\n\nmethods.PUT = async function(request) {\n\n\
  \   let path = urlPath(request.url);\n\n   await pipeStream(request, createWriteStream(path));\n\
  \n   return {status: 204};\n\n};\n```\n\n这次我们不需要检查文件是否存在——如果存在，我们只需覆盖它。我们再次使用 `pipe`\
  \ 将数据从可读流移动到可写流，这里是从请求到文件。但由于 `pipe` 不是为返回 promise 而编写的，我们必须编写一个包装器 `pipeStream`，它在调用\
  \ `pipe` 的结果周围创建一个 promise。\n\n当打开文件时出现问题，`createWriteStream` 仍然会返回一个流，但该流会触发一个\
  \ `\"error\"` 事件。输出到请求的流也可能失败，例如如果网络断开。因此，我们连接两个流的 `\"error\"` 事件来拒绝 promise。当 `pipe`\
  \ 完成时，它会关闭输出流，从而触发一个 `\"finish\"` 事件。此时我们可以成功解决 promise（不返回任何内容）。\n\n服务器的完整脚本可在\
  \ [`eloquentjavascript.net/code/file_server.js`](https://eloquentjavascript.net/code/file_server.js)\
  \ 获取。你可以下载它，并在安装其依赖项后，使用 `Node` 运行它来启动你自己的文件服务器。当然，你也可以修改和扩展它来解决本章的练习或进行实验。\n\n\
  命令行工具 `curl` 广泛用于类 Unix 系统（如 macOS 和 Linux），可用于发出 HTTP 请求。以下会话简要测试了我们的服务器。`-X` 选项用于设置请求的方法，`-d`\
  \ 用于包含请求体。\n\n```\n$ curl http://localhost:8000/file.txt\n\nFile not found\n\n$\
  \ curl -X PUT -d hello http://localhost:8000/file.txt\n\n$ curl http://localhost:8000/file.txt\n\
  \nhello\n\n$ curl -X DELETE http://localhost:8000/file.txt\n\n$ curl http://localhost:8000/file.txt\n\
  \nFile not found\n```\n\n第一次请求 `file.txt` 失败，因为该文件尚不存在。`PUT` 请求创建了文件，瞧，下一个请求成功获取了它。在用\
  \ `DELETE` 请求删除它之后，该文件再次丢失。\n\n### 总结\n\n`Node` 是一个小巧、优秀的系统，让我们可以在非浏览器环境中运行 JavaScript。它最初是为网络任务设计的，扮演网络中*节点*的角色。但它也适用于各种脚本任务，如果你喜欢编写\
  \ JavaScript，那么使用 `Node` 来自动化任务会很不错。\n\n`NPM` 提供了你能想到的所有包（以及许多你可能永远想不到的包），并且允许你使用\
  \ `npm` 程序获取和安装这些包。`Node` 附带了许多内置模块，包括用于处理文件系统的 `fs` 模块和用于运行 HTTP 服务器及发出 HTTP 请求的\
  \ `http` 模块。\n\n`Node` 中的所有输入和输出都是异步完成的，除非你显式使用函数的同步变体，例如 `readFileSync`。在调用此类异步函数时，你需要提供回调函数，`Node`\
  \ 会在准备好时使用错误值和（如果有）结果来调用它们。\n\n### 练习\n\n#### *搜索工具*\n\n\n\n\n在 Unix 系统上，有一个名为 `grep`\
  \ 的命令行工具，可用于快速搜索文件中匹配正则表达式的内容。\n\n编写一个可从命令行运行的 Node 脚本，其行为类似于 `grep`。它将第一个命令行参数视为正则表达式，并将后续参数视为要搜索的文件。它应输出内容匹配该正则表达式的所有文件名。\n\
  \n完成上述功能后，对其进行扩展，使得当某个参数是目录时，它会搜索该目录及其所有子目录中的所有文件。\n\n你可以根据需要使用异步或同步的文件系统函数。同时发起多个异步操作可能会稍微加快速度，但提升幅度不大，因为大多数文件系统一次只能读取一个文件。\n\
  \n### 创建目录\n\n尽管我们的文件服务器中的 `DELETE` 方法能够删除目录（使用 `rmdir`），但该服务器目前不提供任何*创建*目录的方式。\n\
  \n为 `MKCOL` 方法（“创建集合”）添加支持，该方法应通过调用 `fs` 模块中的 `mkdir` 来创建目录。`MKCOL` 并不是一种广泛使用的 HTTP\
  \ 方法，但它确实存在于 *WebDAV* 标准中，用于相同的目的，该标准在 HTTP 之上定义了一套约定，使其适合创建文档。\n\n### 网络上的公共空间\n\
  \n由于文件服务器可以提供任何类型的文件，甚至包含正确的 `Content-Type` 头部，你可以用它来托管一个网站。由于它允许任何人删除和替换文件，这将是一种有趣的网站：一个可以被任何花时间构造正确\
  \ HTTP 请求的人修改、改进甚至破坏的网站。\n\n编写一个基本的 HTML 页面，其中包含一个简单的 JavaScript 文件。将这些文件放在文件服务器提供的目录中，并在浏览器中打开它们。\n\
  \n接下来，作为一项高级练习，甚至是一个周末项目，结合你从本书中学到的所有知识，构建一个更友好的用户界面，用于从*网站内部*修改网站。\n\n使用 HTML 表单来编辑构成网站的文件内容，允许用户通过\
  \ HTTP 请求在服务器上更新它们，如第 18 章所述。\n\n首先只让一个文件可编辑。然后让用户可以选择要编辑哪个文件。利用我们的文件服务器在读取目录时会返回文件列表这一特性。\n\
  \n不要直接在文件服务器暴露的代码中工作，因为如果出错，你很可能会损坏那里的文件。相反，将你的工作保存在公共可访问目录之外，并在测试时将其复制到那里。\n\n\
  “如果你有知识，就让别人借此点亮他们的蜡烛。”\n\n—— 玛格丽特·富勒\n\n![图片](img/f0370-01.jpg)\n\n## 21 项目：技能分享网站\n\
  \n*技能分享*聚会是一种活动，有共同兴趣的人聚在一起，就他们了解的事物进行简短的非正式演讲。在园艺技能分享聚会上，有人可能会讲解如何种植芹菜。或者在一个编程技能分享小组中，你可以顺便去讲讲\
  \ Node.js。\n\n这类聚会——当涉及计算机时也常被称为*用户组*——是拓宽视野、了解新进展或仅仅结识志同道合之人的绝佳方式。许多大城市都有 JavaScript\
  \ 聚会。它们通常免费参加，我发现我去过的那些聚会都友好而热情。\n\n在这个最终项目章节中，我们的目标是建立一个网站，用于管理技能分享聚会中的演讲。想象一下，一小群人定期在某个成员的办公室聚会，讨论独轮车。之前的聚会组织者搬到了另一个城镇，没有人站出来接替这项任务。我们需要一个系统，让参与者能够自行提议和讨论演讲，而无需中央组织者。\n\
  \n该项目的完整代码可以从本书网站下载：*[`eloquentjavascript.net/code/skillsharing.zip`](https://eloquentjavascript.net/code/skillsharing.zip)*。\n\
  \n### 设计\n\n该项目有一个*服务器*部分，用 Node.js 编写，以及一个*客户端*部分，用浏览器编写。服务器存储系统的数据并将其提供给客户端。它还提供实现客户端系统的文件。\n\
  \n服务器保存为下一次聚会提议的演讲列表，客户端显示此列表。每个演讲都有一个演讲者姓名、标题、摘要以及与之关联的评论数组。客户端允许用户提议新演讲（将其添加到列表中）、删除演讲以及对现有演讲进行评论。每当用户进行此类更改时，客户端都会发出\
  \ HTTP 请求以告知服务器。\n\n![图片](img/f0372-01.jpg)\n\n该应用程序将设置为显示当前提议的演讲及其评论的*实时*视图。每当某人在某处提交新演讲或添加评论时，所有在浏览器中打开该页面的人都应立即看到更改。这带来了一些挑战——网络服务器无法打开与客户端的连接，也无法很好地知道哪些客户端当前正在查看某个网站。\n\
  \n解决此问题的一种常见方法称为*长轮询*，这恰好是 Node 设计动机之一。\n\n### 长轮询\n\n为了能够立即通知客户端有变化，我们需要与客户端建立连接。由于传统上\
  \ Web 浏览器不接受连接，并且客户端通常位于会阻止此类连接的路由器后面，因此让服务器发起连接并不实际。\n\n我们可以安排客户端打开连接并保持它，以便服务器在需要时可以将其用于发送信息。\n\
  \n但 HTTP 请求只允许简单的信息流：客户端发送请求，服务器返回单个响应，仅此而已。有一种称为 *WebSockets* 的技术，现代浏览器支持它，可以打开连接进行任意数据交换。但正确使用它们有些棘手。\n\
  \n在本章中，我们使用一种更简单的技术——长轮询——客户端使用常规 HTTP 请求持续向服务器询问新信息，而服务器在没有新内容可报告时会延迟其响应。\n\n只要客户端确保始终有一个轮询请求处于打开状态，它就能在信息可用后很快从服务器接收到信息。例如，如果\
  \ Fatma 在浏览器中打开了我们的技能分享应用程序，那么该浏览器将发出一个更新请求，并等待该请求的响应。当 Iman 提交一个关于“极限下坡独轮车”的演讲时，服务器会注意到\
  \ Fatma 正在等待更新，并发送一个包含新演讲的响应给她的待处理请求。Fatma 的浏览器将接收数据并更新屏幕以显示该演讲。\n\n为了防止连接超时（因缺乏活动而中止），长轮询技术通常为每个请求设置一个最长时间，超过该时间后，即使没有内容可报告，服务器也会响应，之后客户端将启动一个新请求。定期重启请求也使该技术更加健壮，允许客户端从临时连接故障或服务器问题中恢复。\n\
  \n使用长轮询的繁忙服务器可能有数千个等待请求，因此也有数千个 TCP 连接处于打开状态。Node 使得在不创建单独控制线程的情况下轻松管理许多连接，非常适合此类系统。\n\
  \n### HTTP 接口\n\n在我们开始设计服务器或客户端之前，先考虑一下它们的接触点：它们通信所用的 HTTP 接口。\n\n\n\n\n我们将使用 JSON\
  \ 作为请求和响应体的格式。与第 20 章中的文件服务器类似，我们将尝试充分利用 HTTP 方法和头部。接口以`/talks`路径为中心。不以`/talks`开头的路径将用于提供静态文件——客户端系统的\
  \ HTML 和 JavaScript 代码。\n\n对`/talks`的`GET`请求返回如下 JSON 文档：\n\n```json\n[{\"title\"\
  : \"Unituning\",\n  \"presenter\": \"Jamal\",\n  \"summary\": \"Modifying your cycle\
  \ for extra style\",\n  \"comments\": []}]\n```\n\n创建新演讲是通过向类似`/talks/Unituning`的\
  \ URL 发送`PUT`请求完成的，其中第二个斜杠后的部分是演讲的标题。`PUT`请求的正文应包含一个具有`presenter`和`summary`属性的 JSON\
  \ 对象。\n\n由于演讲标题可能包含空格和其他在 URL 中通常不会出现的字符，因此在构建此类 URL 时，必须使用`encodeURIComponent`函数对标题字符串进行编码。\n\
  \n```javascript\nconsole.log(\"/talks/\" + encodeURIComponent(\"How to Idle\"));\n\
  // → /talks/How%20to%20Idle\n```\n\n创建关于空闲的演讲的请求可能如下所示：\n\n```http\nPUT /talks/How%20to%20Idle\
  \ HTTP/1.1\nContent-Type: application/json\nContent-Length: 92\n\n{\"presenter\"\
  : \"Maureen\",\n\"summary\": \"Standing still on a unicycle\"}\n```\n\n此类 URL 还支持`GET`请求以获取演讲的\
  \ JSON 表示，以及`DELETE`请求以删除演讲。\n\n向演讲添加评论是通过向类似`/talks/Unituning/comments`的 URL 发送`POST`请求完成的，其\
  \ JSON 正文包含`author`和`message`属性。\n\n```http\nPOST /talks/Unituning/comments HTTP/1.1\n\
  Content-Type: application/json\nContent-Length: 72\n\n{\"author\": \"Iman\",\n\"\
  message\": \"Will you talk about raising a cycle?\"}\n```\n\n为了支持长轮询，对`/talks`的`GET`请求可能包含额外的头部，告知服务器如果没有新信息则延迟响应。我们将使用一对通常用于管理缓存的头部：`ETag`和`If-None-Match`。\n\
  \n服务器可以在响应中包含`ETag`（“实体标签”）头部。其值是一个标识资源当前版本的字符串。客户端稍后再次请求该资源时，可以通过包含一个`If-None-Match`头部（其值持有相同的字符串）来发出`条件请求`。如果资源没有变化，服务器将响应状态码\
  \ 304，表示“未修改”，告知客户端其缓存版本仍然是最新的。当标签不匹配时，服务器正常响应。\n\n我们需要类似这样的机制：客户端可以告知服务器它拥有的演讲列表版本，服务器仅在列表发生变化时才响应。但不是立即返回\
  \ 304 响应，服务器应延迟响应，直到有新内容可用或经过给定时间后才返回。为了区分长轮询请求和普通条件请求，我们给它们添加另一个头部`Prefer: wait=90`，告知服务器客户端愿意等待最多\
  \ 90 秒的响应。\n\n服务器将维护一个版本号，每次演讲发生变化时更新，并将其用作`ETag`值。客户端可以发出如下请求，以便在演讲发生变化时得到通知：\n\
  \n```http\nGET /talks HTTP/1.1\nIf-None-Match: \"4\"\nPrefer: wait=90\n\n(time passes)\n\
  \nHTTP/1.1 200 OK\nContent-Type: application/json\nETag: \"5\"\nContent-Length:\
  \ 295\n\n[....]\n```\n\n这里描述的协议没有进行任何访问控制。每个人都可以评论、修改甚至删除演讲。（由于互联网上充满了恶棍，在没有进一步保护的情况下将这样的系统上线可能不会有好结果。）\n\
  \n### 服务器\n\n让我们开始构建程序的服务器端部分。本节中的代码运行在 Node.js 上。\n\n#### *路由*\n\n我们的服务器将使用`createServer`启动一个\
  \ HTTP 服务器。在处理新请求的函数中，我们必须区分我们支持的各种请求类型（由方法和路径决定）。这可以通过一长串`if`语句来完成，但有一种更好的方法。\n\
  \n`路由器`是一个帮助将请求分派到能够处理它的函数的组件。例如，你可以告诉路由器，路径匹配正则表达式`/^\\/talks\\/([^\\/]+)$/`（`/talks/`后跟演讲标题）的`PUT`请求可以由给定函数处理。此外，它还可以帮助提取路径中有意义的部分（本例中为演讲标题），这些部分在正则表达式中用括号包裹，并传递给处理函数。\n\
  \nNPM 上有许多好的路由器包，但这里我们将自己编写一个来说明原理。\n\n这是`router.js`，稍后我们将从服务器模块中引入它：\n\n```javascript\n\
  const {parse} = require(\"url\");\n\nmodule.exports = class Router {\n  constructor()\
  \ {\n    this.routes = [];\n  }\n\n  add(method, url, handler) {\n    this.routes.push({method,\
  \ url, handler});\n  }\n\n  resolve(context, request) {\n    let path = parse(request.url).pathname;\n\
  \    for (let {method, url, handler} of this.routes) {\n      let match = url.exec(path);\n\
  \      if (!match || request.method != method) continue;\n      let urlParts = match.slice(1).map(decodeURIComponent);\n\
  \      return handler(context, ...urlParts, request);\n    }\n    return null;\n\
  \  }\n};\n```\n\n该模块导出了`Router`类。路由器对象允许通过`add`方法注册新的处理程序，并可以通过其`resolve`方法解析请求。\n\
  \n后者在找到处理程序时返回响应，否则返回`null`。它逐个尝试路由（按定义顺序），直到找到匹配的路由。\n\n处理函数被调用时，会传入上下文值（在我们的例子中是服务器实例）、正则表达式中定义的任何组的匹配字符串以及请求对象。这些字符串必须进行\
  \ URL 解码，因为原始 URL 可能包含`%20`风格的编码。\n\n#### *提供文件服务*\n\n当请求与路由器中定义的任何请求类型都不匹配时，服务器必须将其解释为对`public`目录中文件的请求。可以使用第\
  \ 20 章中定义的文件服务器来提供此类文件，但我们既不需要也不希望支持对文件的`PUT`和`DELETE`请求，并且我们希望拥有诸如缓存支持等高级功能。因此，让我们改用\
  \ NPM 上一个可靠且经过充分测试的静态文件服务器。\n\n我选择了`ecstatic`。这不是 NPM 上唯一的此类服务器，但它运行良好且符合我们的目的。`ecstatic`包导出一个函数，可以用配置对象调用该函数以生成请求处理函数。我们使用`root`选项告诉服务器在哪里查找文件。处理函数接受`request`和`response`参数，可以直接传递给`createServer`以创建一个仅提供文件的服务器。不过，我们想先检查应该特殊处理的请求，因此我们将其包装在另一个函数中。\n\
  \n```javascript\nconst {createServer} = require(\"http\");\nconst Router = require(\"\
  ./router\");\nconst ecstatic = require(\"ecstatic\");\n\nconst router = new Router();\n\
  const defaultHeaders = {\"Content-Type\": \"text/plain\"};\n\nclass SkillShareServer\
  \ {\n  constructor(talks) {\n    this.talks = talks;\n    this.version = 0;\n  \
  \  this.waiting = [];\n\n    let fileServer = ecstatic({root: \"./public\"});\n\n\
  \    this.server = createServer((request, response) => {\n      let resolved = router.resolve(this,\
  \ request);\n      if (resolved) {\n        resolved.catch(error => {\n        \
  \  if (error.status != null) return error;\n          return {body: String(error),\
  \ status: 500};\n        }).then(({body,\n                  status = 200,\n    \
  \              headers = defaultHeaders}) => {\n          response.writeHead(status,\
  \ headers);\n          response.end(body);\n        });\n      } else {\n      \
  \  fileServer(request, response);\n      }\n    });\n  }\n\n  start(port) {\n  \
  \  this.server.listen(port);\n  }\n}\n```\n\n\n\n```\n    }\n\n    stop() {\n\n\
  \      this.server.close();\n\n    }\n}\n\n这与前一章的文件服务器使用类似的约定来处理响应——处理程序返回解析为描述响应的对象的\
  \ Promise。它将服务器包装在一个也保存其状态的对象中。\n\n### 将演讲视为资源\n\n已提议的演讲存储在服务器的 `talks` 属性中，该属性是一个对象，其属性名是演讲标题。这些演讲将作为\
  \ HTTP 资源暴露在 `/talks/[title]` 下，因此我们需要向路由器添加处理程序，以实现客户端可用于处理它们的各种方法。\n\n处理 GET 单个演讲请求的处理程序必须查找该演讲，并返回演讲的\
  \ JSON 数据或 404 错误响应。\n\n```\nconst talkPath = /^\\/talks\\/([^\\/]+)$/;\n\nrouter.add(\"\
  GET\", talkPath, async (server, title) => {\n  if (title in server.talks) {\n  \
  \  return {body: JSON.stringify(server.talks[title]),\n            headers: {\"\
  Content-Type\": \"application/json\"}};\n  } else {\n    return {status: 404, body:\
  \ `No talk '${title}' found`};\n  }\n});\n```\n\n删除演讲是通过将其从 `talks` 对象中移除来完成的。\n\
  \n```\nrouter.add(\"DELETE\", talkPath, async (server, title) => {\n  if (title\
  \ in server.talks) {\n    delete server.talks[title];\n    server.updated();\n \
  \ }\n  return {status: 204};\n});\n```\n\n`updated` 方法（我们将在下一节中定义）会通知等待的长轮询请求有关更改的信息。\n\
  \n为了获取请求体的内容，我们定义了一个名为 `readStream` 的函数，它从可读流中读取所有内容，并返回一个解析为字符串的 Promise。\n\n```\n\
  function readStream(stream) {\n  return new Promise((resolve, reject) => {\n   \
  \ let data = \"\";\n    stream.on(\"error\", reject);\n    stream.on(\"data\", chunk\
  \ => data += chunk.toString());\n    stream.on(\"end\", () => resolve(data));\n\
  \  });\n}\n```\n\n需要读取请求体的处理程序之一是 PUT 处理程序，它用于创建新的演讲。它必须检查给定的数据是否具有 `presenter`\
  \ 和 `summary` 属性，并且这些属性是字符串。来自系统外部的任何数据都可能是无意义的，我们不希望破坏内部数据模型或在收到错误请求时崩溃。\n\n如果数据看起来有效，处理程序会将表示新演讲的对象存储在\
  \ `talks` 对象中，可能会覆盖具有相同标题的现有演讲，并再次调用 `updated`。\n\n```\nrouter.add(\"PUT\", talkPath,\n\
  \           async (server, title, request) => {\n  let requestBody = await readStream(request);\n\
  \  let talk;\n  try { talk = JSON.parse(requestBody); }\n  catch (_) { return {status:\
  \ 400, body: \"Invalid JSON\"}; }\n  if (!talk ||\n      typeof talk.presenter !=\
  \ \"string\" ||\n      typeof talk.summary != \"string\") {\n    return {status:\
  \ 400, body: \"Bad talk data\"};\n  }\n  server.talks[title] = {title,\n       \
  \                  presenter: talk.presenter,\n                         summary:\
  \ talk.summary,\n                         comments: []};\n  server.updated();\n\
  \  return {status: 204};\n});\n```\n\n向演讲添加评论的工作方式类似。我们使用 `readStream` 获取请求内容，验证结果数据，并在数据看起来有效时将其存储为评论。\n\
  \n```\nrouter.add(\"POST\", /^\\/talks\\/([^\\/]+)\\/comments$/,\n           async\
  \ (server, title, request) => {\n  let requestBody = await readStream(request);\n\
  \  let comment;\n  try { comment = JSON.parse(requestBody); }\n  catch (_) { return\
  \ {status: 400, body: \"Invalid JSON\"}; }\n  if (!comment ||\n      typeof comment.author\
  \ != \"string\" ||\n      typeof comment.message != \"string\") {\n    return {status:\
  \ 400, body: \"Bad comment data\"};\n  } else if (title in server.talks) {\n   \
  \ server.talks[title].comments.push(comment);\n    server.updated();\n    return\
  \ {status: 204};\n  } else {\n    return {status: 404, body: `No talk '${title}'\
  \ found`};\n  }\n});\n```\n\n尝试向不存在的演讲添加评论会返回 404 错误。\n\n### 长轮询支持\n\n服务器最有趣的方面是处理长轮询的部分。当对\
  \ `/talks` 的 GET 请求到来时，它可能是常规请求，也可能是长轮询请求。\n\n我们会有多个地方需要向客户端发送演讲数组，因此我们首先定义一个辅助方法，该方法构建这样一个数组，并在响应中包含一个\
  \ ETag 头。\n\n```\nSkillShareServer.prototype.talkResponse = function() {\n  let\
  \ talks = [];\n  for (let title of Object.keys(this.talks)) {\n    talks.push(this.talks[title]);\n\
  \  }\n  return {\n    body: JSON.stringify(talks),\n    headers: {\"Content-Type\"\
  : \"application/json\",\n              \"ETag\": `\"${this.version}\"`}\n  };\n\
  };\n```\n\n处理程序本身需要查看请求头，以确定是否存在 `If-None-Match` 和 `Prefer` 头。Node 将名称指定为不区分大小写的头存储在其小写名称下。\n\
  \n```\nrouter.add(\"GET\", /^\\/talks$/, async (server, request) => {\n  let tag\
  \ = /\"(.*)\"/.exec(request.headers[\"if-none-match\"]);\n  let wait = /\\bwait=(\\\
  d+)/.exec(request.headers[\"prefer\"]);\n  if (!tag || tag[1] != server.version)\
  \ {\n    return server.talkResponse();\n  } else if (!wait) {\n    return {status:\
  \ 304};\n  } else {\n    return server.waitForChanges(Number(wait[1]));\n  }\n});\n\
  ```\n\n如果没有给出标签，或者给出的标签与服务器的当前版本不匹配，处理程序会返回演讲列表。如果请求是有条件的且演讲没有变化，我们会检查 `Prefer`\
  \ 头，以确定是延迟响应还是立即响应。\n\n延迟请求的回调函数存储在服务器的 `waiting` 数组中，以便在发生某些事情时通知它们。`waitForChanges`\
  \ 方法还会立即设置一个计时器，当请求等待足够长时间后，以 304 状态响应。\n\n```\nSkillShareServer.prototype.waitForChanges\
  \ = function(time) {\n  return new Promise(resolve => {\n    this.waiting.push(resolve);\n\
  \    setTimeout(() => {\n      if (!this.waiting.includes(resolve)) return;\n  \
  \    this.waiting = this.waiting.filter(r => r != resolve);\n      resolve({status:\
  \ 304});\n    }, time * 1000);\n  });\n};\n```\n\n通过 `updated` 注册更改会增加 `version`\
  \ 属性并唤醒所有等待的请求。\n\n```\nSkillShareServer.prototype.updated = function() {\n  this.version++;\n\
  \  let response = this.talkResponse();\n  this.waiting.forEach(resolve => resolve(response));\n\
  \  this.waiting = [];\n};\n```\n\n至此，服务器代码结束。如果我们创建一个 `SkillShareServer` 实例并在端口\
  \ 8000 上启动它，生成的 HTTP 服务器将从子目录 `public` 提供文件，并在 `/talks` URL 下提供演讲管理界面。\n\n```\n\
  new SkillShareServer(Object.create(null)).start(8000);\n```\n\n### 客户端\n\n技能分享网站的客户端部分由三个文件组成：一个小的\
  \ HTML 页面、一个样式表和一个 JavaScript 文件。\n\n#### HTML\n\nWeb 服务器有一个广泛使用的约定：当直接请求对应于目录的路径时，会尝试提供名为\
  \ `index.html` 的文件。我们使用的文件服务器模块 `ecstatic` 支持此约定。当请求路径 `/` 时，服务器会查找文件 `./public/index.html`（`./public`\
  \ 是我们指定的根目录），如果找到则返回该文件。\n\n因此，如果我们希望浏览器指向我们的服务器时显示一个页面，我们应该将其放在 `public/index.html`\
  \ 中。这是我们的索引文件：\n\n```\n<!doctype html>\n<meta charset=\"utf-8\">\n<title>Skill Sharing</title>\n\
  <link rel=\"stylesheet\" href=\"skillsharing.css\">\n<h1>Skill Sharing</h1>\n<script\
  \ src=\"skillsharing_client.js\"></script>\n```\n\n它定义了文档标题，并包含一个样式表，该样式表定义了一些样式，以确保演讲之间有一些间距。\n\
  \n在底部，它在页面顶部添加了一个标题，并加载了包含客户端应用程序的脚本。\n\n#### 操作\n\n\n\n\n应用程序状态由演讲列表和用户名组成，我们将它存储在一个\
  \ `{talks, user}` 对象中。我们不允许用户界面直接操作状态或发送 HTTP 请求。相反，它可以发出描述用户意图的 `actions`。\n\n\
  `handleAction` 函数接收这样一个动作并执行它。由于我们的状态更新非常简单，状态变更在同一个函数中处理。\n\n```\nfunction handleAction(state,\
  \ action) {\n\n  if (action.type == \"setUser\") {\n\n    localStorage.setItem(\"\
  userName\", action.user);\n\n    return Object.assign({}, state, {user: action.user});\n\
  \n  } else if (action.type == \"setTalks\") {\n\n    return Object.assign({}, state,\
  \ {talks: action.talks});\n\n  } else if (action.type == \"newTalk\") {\n\n    fetchOK(talkURL(action.title),\
  \ {\n\n      method: \"PUT\",\n\n      headers: {\"Content-Type\": \"application/json\"\
  },\n\n      body: JSON.stringify({\n\n         presenter: state.user,\n\n      \
  \   summary: action.summary\n\n      })\n\n    }).catch(reportError);\n\n  } else\
  \ if (action.type == \"deleteTalk\") {\n\n    fetchOK(talkURL(action.talk), {method:\
  \ \"DELETE\"})\n\n      .catch(reportError);\n\n  } else if (action.type == \"newComment\"\
  ) {\n\n    fetchOK(talkURL(action.talk) + \"/comments\", {\n\n      method: \"POST\"\
  ,\n\n      headers: {\"Content-Type\": \"application/json\"},\n\n      body: JSON.stringify({\n\
  \n        author: state.user,\n\n        message: action.message\n\n      })\n\n\
  \    }).catch(reportError);\n\n  }\n\n  return state;\n\n}\n```\n\n我们将用户名存储在 `localStorage`\
  \ 中，以便在页面加载时恢复。\n\n需要与服务器交互的动作会使用 `fetch` 向之前描述的 HTTP 接口发起网络请求。我们使用一个包装函数 `fetchOK`，它确保当服务器返回错误码时，返回的\
  \ promise 会被拒绝。\n\n```\nfunction fetchOK(url, options) {\n\n  return fetch(url,\
  \ options).then(response => {\n\n    if (response.status < 400) return response;\n\
  \n    else throw new Error(response.statusText);\n\n  });\n\n}\n```\n\n这个辅助函数用于构建给定标题的演讲\
  \ URL。\n\n```\nfunction talkURL(title) {\n\n  return \"talks/\" + encodeURIComponent(title);\n\
  \n}\n```\n\n当请求失败时，我们不希望页面只是停留在那里，毫无解释地什么都不做。因此我们定义了一个函数 `reportError`，它至少会向用户显示一个对话框，告知他们出了问题。\n\
  \n```\nfunction reportError(error) {\n\n  alert(String(error));\n\n}\n```\n\n####\
  \ *渲染组件*\n\n我们将采用与第 19 章类似的方法，将应用程序拆分为组件。但由于某些组件要么永远不需要更新，要么在更新时总是完全重绘，我们将它们定义为直接返回\
  \ DOM 节点的函数，而不是类。例如，下面是一个显示用户输入姓名字段的组件：\n\n```\nfunction renderUserField(name, dispatch)\
  \ {\n\n  return elt(\"label\", {}, \"Your name: \", elt(\"input\", {\n\n    type:\
  \ \"text\",\n\n    value: name,\n\n    onchange(event) {\n\n      dispatch({type:\
  \ \"setUser\", user: event.target.value});\n\n    }\n\n  }));\n\n}\n```\n\n用于构建\
  \ DOM 元素的 `elt` 函数与我们在第 19 章中使用的相同。\n\n类似的函数用于渲染演讲，其中包含评论列表和添加新评论的表单。\n\n```\nfunction\
  \ renderTalk(talk, dispatch) {\n\n  return elt(\n\n    \"section\", {className:\
  \ \"talk\"},\n\n    elt(\"h2\", null, talk.title, \" \", elt(\"button\", {\n\n \
  \     type: \"button\",\n\n      onclick() {\n\n         dispatch({type: \"deleteTalk\"\
  , talk: talk.title});\n\n      }\n\n    }, \"Delete\")),\n\n    elt(\"div\", null,\
  \ \"by \",\n\n         elt(\"strong\", null, talk.presenter)),\n\n    elt(\"p\"\
  , null, talk.summary),\n\n    ...talk.comments.map(renderComment),\n\n    elt(\"\
  form\", {\n\n      onsubmit(event) {\n\n        event.preventDefault();\n\n    \
  \    let form = event.target;\n\n        dispatch({type: \"newComment\",\n\n   \
  \               talk: talk.title,\n\n                  message: form.elements.comment.value});\n\
  \n        form.reset();\n\n      }\n\n    }, elt(\"input\", {type: \"text\", name:\
  \ \"comment\"}), \" \",\n\n       elt(\"button\", {type: \"submit\"}, \"Add comment\"\
  )));\n\n}\n```\n\n`\"submit\"` 事件处理器在创建 `\"newComment\"` 动作后调用 `form.reset` 来清除表单内容。\n\
  \n当创建中等复杂度的 DOM 片段时，这种编程风格开始显得相当混乱。有一种广泛使用的（非标准）JavaScript 扩展叫做 `JSX`，它允许你在脚本中直接编写\
  \ HTML，这可以使此类代码更美观（取决于你对美观的定义）。在实际运行此类代码之前，你需要在脚本上运行一个程序，将伪 HTML 转换为类似于我们这里使用的 JavaScript\
  \ 函数调用。\n\n评论的渲染更简单。\n\n```\nfunction renderComment(comment) {\n\n  return elt(\"\
  p\", {className: \"comment\"},\n\n             elt(\"strong\", null, comment.author),\n\
  \n             \": \", comment.message);\n\n}\n```\n\n最后，用户用来创建新演讲的表单渲染如下：\n\n```\n\
  function renderTalkForm(dispatch) {\n\n  let title = elt(\"input\", {type: \"text\"\
  });\n\n  let summary = elt(\"input\", {type: \"text\"});\n\n  return elt(\"form\"\
  , {\n\n    onsubmit(event) {\n\n      event.preventDefault();\n\n      dispatch({type:\
  \ \"newTalk\",\n\n                title: title.value,\n\n                summary:\
  \ summary.value});\n\n      event.target.reset();\n\n    }\n\n  }, elt(\"h3\", null,\
  \ \"Submit a Talk\"),\n\n     elt(\"label\", null, \"Title: \", title),\n\n    \
  \ elt(\"label\", null, \"Summary: \", summary),\n\n     elt(\"button\", {type: \"\
  submit\"}, \"Submit\"));\n\n}\n```\n\n#### *轮询*\n\n要启动应用程序，我们需要当前的演讲列表。由于初始加载与长轮询过程密切相关——轮询时必须使用加载时的\
  \ `ETag`——我们将编写一个函数，持续轮询服务器的 `/talks`，并在有新的一组演讲可用时调用回调函数。\n\n```\nasync function\
  \ pollTalks(update) {\n\n  let tag = undefined;\n\n  for (;;) {\n\n    let response;\n\
  \n    try {\n\n      response = await fetchOK(\"/talks\", {\n\n        headers:\
  \ tag && {\"If-None-Match\": tag,\n\n                         \"Prefer\": \"wait=90\"\
  }\n\n      });\n\n    } catch (e) {\n\n      console.log(\"Request failed: \" +\
  \ e);\n\n      await new Promise(resolve => setTimeout(resolve, 500));\n\n     \
  \ continue;\n\n    }\n\n    if (response.status == 304) continue;\n\n    tag = response.headers.get(\"\
  ETag\");\n\n    update(await response.json());\n\n  }\n\n}\n```\n\n这是一个异步函数，以便更容易地进行循环和等待请求。它运行一个无限循环，每次迭代都会获取演讲列表——要么正常获取，要么（如果不是第一次请求）包含使其成为长轮询请求的头部。\n\
  \n当请求失败时，函数会等待片刻然后重试。这样，如果你的网络连接暂时断开然后恢复，应用程序可以恢复并继续更新。通过 `setTimeout` 解决的 promise\
  \ 是一种强制异步函数等待的方式。\n\n当服务器返回 304 响应时，意味着长轮询请求超时，因此函数应立即开始下一个请求。如果响应是正常的 200 响应，则将其主体作为\
  \ JSON 读取并传递给回调，同时将其 `ETag` 头部值存储起来用于下一次迭代。\n\n#### *应用程序*\n\n以下组件将整个用户界面整合在一起：\n\
  \n```\nclass SkillShareApp {\n\n  constructor(state, dispatch) {\n\n    this.dispatch\
  \ = dispatch;\n\n    this.talkDOM = elt(\"div\", {className: \"talks\"});\n\n  \
  \  this.dom = elt(\"div\", null,\n\n                   renderUserField(state.user,\
  \ dispatch),\n\n                   this.talkDOM,\n\n                   renderTalkForm(dispatch));\n\
  \n    this.syncState(state);\n\n  }\n\n  syncState(state) {\n\n    if (state.talks\
  \ != this.talks) {\n\n      this.talkDOM.textContent = \"\";\n\n      for (let talk\
  \ of state.talks) {\n\n        this.talkDOM.appendChild(\n\n          renderTalk(talk,\
  \ this.dispatch));\n\n      }\n```\n\n\n\n```\n      this.talks = state.talks;\n\
  \n    }\n\n  }\n\n}\n```\n\n当 talks 发生变化时，该组件会重新绘制所有 talks。这很简单，但也很浪费资源。我们将在练习中回到这个问题。\n\
  \n我们可以像这样启动应用程序：\n\n```\nfunction runApp() {\n\n  let user = localStorage.getItem(\"\
  userName\") || \"Anon\";\n\n  let state, app;\n\n  function dispatch(action) {\n\
  \n    state = handleAction(state, action);\n\n    app.syncState(state);\n\n  }\n\
  \n  pollTalks(talks => {\n\n    if (!app) {\n\n      state = {user, talks};\n\n\
  \      app = new SkillShareApp(state, dispatch);\n\n      document.body.appendChild(app.dom);\n\
  \n    } else {\n\n      dispatch({type: \"setTalks\", talks});\n\n    }\n\n  }).catch(reportError);\n\
  \n}\n\nrunApp();\n```\n\n如果你运行服务器，并在两个浏览器窗口中并排打开 [`localhost:8000`](http://localhost:8000)，你会看到在一个窗口中执行的操作会立即在另一个窗口中显示出来。\n\
  \n### 练习\n\n以下练习将涉及修改本章中定义的系统。要完成这些练习，请确保首先下载代码（[`eloquentjavascript.net/code/skillsharing.zip`](https://eloquentjavascript.net/code/skillsharing.zip)），安装\
  \ Node（[`nodejs.org`](https://nodejs.org)），并通过 `npm install` 安装项目的依赖项。\n\n#### 磁盘持久化\n\
  \n技能分享服务器将其数据完全保存在内存中。这意味着当它崩溃或因任何原因重启时，所有 talks 和评论都会丢失。\n\n扩展服务器，使其将 talk 数据存储到磁盘，并在重启时自动重新加载数据。不必担心效率问题——用最简单的方式实现即可。\n\
  \n#### 评论字段重置\n\n批量重新绘制 talks 效果很好，因为你通常无法区分 DOM 节点与其完全相同的替换之间的差异。但也有例外。如果你在一个浏览器窗口的\
  \ talk 评论字段中开始输入内容，然后在另一个窗口中为该 talk 添加一条评论，第一个窗口中的字段将被重新绘制，从而清除其内容和焦点。\n\n在激烈的讨论中，当多人同时添加评论时，这会令人烦恼。你能想出一个解决方法吗？\n\
  \n“最大的优化来自于改进高层设计，而不是单个例程。”\n\n——史蒂夫·麦康奈尔，《代码大全》\n\n![Image](img/f0390-01.jpg)\n\
  \n## 22 JavaScript 与性能\n\n在机器上运行计算机程序需要弥合编程语言与机器自身指令格式之间的差距。这可以通过编写一个*解释*其他程序的程序来实现，就像我们在第\
  \ 11 章中所做的那样，但通常是通过*编译*（翻译）程序为机器代码来完成。\n\n有些语言，例如 C 和 Rust 编程语言，被设计用来精确表达机器擅长处理的内容。这使得它们易于高效编译。JavaScript\
  \ 的设计方式则截然不同，侧重于简单性和易用性。它的特性几乎没有一个直接对应机器的特性。这使得 JavaScript 的编译难度大大增加。\n\n然而，现代 JavaScript\
  \ *引擎*（编译和运行 JavaScript 的程序）确实能够以惊人的速度运行脚本。可以编写出速度约为等效 C 或 Rust 程序 10% 的 JavaScript\
  \ 程序。这听起来仍然是一个巨大的差距，但较老的 JavaScript 引擎（以及类似设计的语言的当代实现，如 Python 和 Ruby）的速度往往接近 C\
  \ 语言的 1%。与这些语言相比，现代 JavaScript 快得惊人——快到你很少会因为性能问题而被迫切换到其他语言。\n\n尽管如此，你偶尔可能还是需要重写代码，以避免\
  \ JavaScript 中较慢的方面。作为这一过程的示例，本章将处理一个对速度要求较高的程序，并使其运行得更快。在此过程中，我们将讨论 JavaScript\
  \ 引擎如何编译你的程序。\n\n### 分阶段编译\n\n首先，你必须理解 JavaScript 编译器并不像传统编译器那样只编译一次程序。相反，代码会在程序运行时根据需要被编译和重新编译。\n\
  \n对于大多数语言来说，编译大型程序需要一段时间。这通常是可以接受的，因为程序是提前编译并以编译形式分发的。\n\n对于 JavaScript 来说，情况则不同。一个网站可能包含大量以文本形式获取的代码，并且每次打开网站时都必须编译这些代码。如果这需要五分钟，用户会很不高兴。JavaScript\
  \ 编译器必须能够几乎瞬间开始运行程序——即使是大型程序。\n\n为此，JavaScript 编译器拥有多种编译策略。当打开一个网站时，脚本首先以廉价、浅层的方式编译。这不会导致非常快速的执行，但允许脚本快速启动。函数可能直到第一次被调用时才会被编译。\n\
  \n在典型的程序中，大多数代码只运行几次（或者根本不运行）。对于程序的这些部分，廉价的编译策略就足够了——它们无论如何都不会花费太多时间。但是，那些被频繁调用的函数或包含大量工作的循环的函数必须区别对待。在运行程序时，JavaScript\
  \ 引擎会观察每段代码运行的频率。当某段代码看起来可能消耗大量时间时（这通常被称为*热代码*），它会使用更高级但更慢的编译器重新编译。这个编译器会执行更多的*优化*以生成更快的代码。甚至可能有超过两种编译策略，对*非常*热的代码应用更昂贵的优化。\n\
  \n将运行和编译代码交错进行意味着，当聪明的编译器开始处理一段代码时，它已经运行了多次。这使得可以*观察*正在运行的代码并收集关于它的信息。在本章后面，我们将看到这如何使编译器能够创建更高效的代码。\n\
  \n### 图布局\n\n本章的示例问题再次涉及图。图的图片可用于描述道路系统、网络、计算机程序中的控制流等。下图展示了一个表示中东某些国家的图，边连接了共享陆地边界的国家：\n\
  \n![Image](img/f0393-01.jpg)\n\n从图的定义推导出这样的图片称为*图布局*。它涉及为每个节点分配一个位置，使得相连的节点彼此靠近，同时节点之间不会相互拥挤。同一张图的随机布局则更难解读。\n\
  \n![Image](img/f0393-02.jpg)\n\n为给定图找到美观的布局是一个出了名的难题。目前没有已知的解决方案能够可靠地为任意图做到这一点，而大型、密集连接的图尤其困难。但对于某些特定类型的图，例如*平面*图（可以绘制成边不相交的图），存在有效的方法。\n\
  \n为了布局一个不太混乱的小型图（例如，最多 200 个节点），我们可以采用一种称为*力导向图布局*的方法。该方法对图的节点运行一个简化的物理模拟，将边视为弹簧，并让节点本身像带电一样相互排斥。\n\
  \n\n\n\n在本章中，我们将实现一个力导向图布局系统，并观察其性能。我们可以通过反复计算作用于每个节点的力，并根据这些力移动节点来运行这样的模拟。这类程序的性能很重要，因为可能需要大量迭代才能达到美观的布局，而每次迭代都要计算大量力。\n\
  \n### 定义图\n\n我们可以将图布局表示为一个 `GraphNode` 对象数组，每个对象携带其当前位置以及与之相连的节点数组。我们将随机化它们的起始位置。\n\
  \n```\nclass GraphNode {\n\n  constructor() {\n\n    this.pos = new Vec(Math.random()\
  \ * 1000,\n\n                        Math.random() * 1000);\n\n    this.edges =\
  \ [];\n\n  }\n\n  connect(other) {\n\n    this.edges.push(other);\n\n    other.edges.push(this);\n\
  \n  }\n\n  hasEdge(other) {\n\n    return this.edges.includes(other);\n\n  }\n\n\
  }\n```\n\n这里使用了前几章中熟悉的 `Vec` 类来表示位置和力。\n\n`connect` 方法用于在构建图时将节点连接到另一个节点。要判断两个节点是否相连，我们会调用\
  \ `hasEdge` 方法。\n\n为了构建用于测试程序的图，我们将使用一个名为 `treeGraph` 的函数。它接受两个参数，分别指定树的深度和每个分支的分支数，并递归地构建一个具有指定形状的树形图。\n\
  \n```\nfunction treeGraph(depth, branches) {\n\n  let graph = [new GraphNode()];\n\
  \n  if (depth > 1) {\n\n    for (let i = 0; i < branches; i++) {\n\n      let subGraph\
  \ = treeGraph(depth - 1, branches);\n\n      graph[0].connect(subGraph[0]);\n\n\
  \      graph = graph.concat(subGraph);\n\n    }\n\n  }\n\n  return graph;\n\n}\n\
  ```\n\n树形图不包含环，这使得它们相对容易布局，甚至本章中构建的简单程序也能产生美观的形状。\n\n由 `treeGraph(3, 5)` 创建的图将是一个深度为\
  \ 3、有 5 个分支的树。\n\n![Image](img/f0395-01.jpg)\n\n为了让我们能够检查代码生成的布局，我定义了一个 `drawGraph`\
  \ 函数，用于在画布上绘制图形。该函数定义在 *[eloquentjavascript.net/code/draw_layout.js](http://eloquentjavascript.net/code/draw_layout.js)*\
  \ 的代码中，并可在在线沙盒中使用。\n\n### 力导向布局\n\n我们将一次移动一个节点，计算作用于当前节点的力，并立即将该节点沿这些力的合力方向移动。\n\
  \n（理想化）弹簧施加的力可以用胡克定律近似，该定律指出该力与弹簧的静止长度和当前长度之差成正比。绑定 `springLength` 定义了边弹簧的静止长度。弹簧的刚度由\
  \ `springStrength` 定义，我们将乘以长度差来确定产生的力。\n\n```\nconst springLength = 40;\nconst springStrength\
  \ = 0.1;\n```\n\n为了模拟节点之间的斥力，我们使用另一个物理公式——库仑定律——该定律指出两个带电粒子之间的斥力与它们之间距离的平方成反比。当两个节点几乎重叠时，距离的平方很小，产生的力巨大。随着节点远离，距离的平方迅速增大，斥力迅速减弱。\n\
  \n我们再次乘以一个实验确定的常数 `repulsionStrength`，它控制节点相互排斥的强度。\n\n```\nconst repulsionStrength\
  \ = 1500;\n```\n\n作用于给定节点的力是通过遍历所有其他节点并对每个节点施加斥力来计算的。当另一个节点与当前节点共享一条边时，还会施加弹簧产生的力。\n\
  \n这两种力都取决于两个节点之间的距离。对于每对节点，我们的函数将计算一个名为 `apart` 的向量，表示从当前节点到另一个节点的路径。然后函数取该向量的长度来找到实际距离。当距离小于\
  \ 1 时，我们将其设置为 1，以防止除以零或非常小的数，因为那会产生 `NaN` 值或巨大的力，从而将节点弹到外太空。\n\n利用这个距离，我们可以计算作用于这两个给定节点之间的力的大小。要从大小得到力向量，我们必须将大小乘以\
  \ `apart` 向量的归一化版本。*归一化*向量意味着创建一个方向相同但长度为 1 的向量。我们可以通过将向量除以其自身长度来实现。\n\n```\nfunction\
  \ forceDirected_simple(graph) {\n\n  for (let node of graph) {\n\n    for (let other\
  \ of graph) {\n\n      if (other == node) continue;\n\n      let apart = other.pos.minus(node.pos);\n\
  \n      let distance = Math.max(1, apart.length);\n\n      let forceSize = -repulsionStrength\
  \ / (distance * distance);\n\n      if (node.hasEdge(other)) {\n\n        forceSize\
  \ += (distance - springLength) * springStrength;\n\n      }\n\n      let normalized\
  \ = apart.times(1 / distance);\n\n      node.pos = node.pos.plus(normalized.times(forceSize));\n\
  \n    }\n\n  }\n\n}\n```\n\n我们将使用以下函数来测试图布局系统的给定实现。它运行模型 4000 步，并跟踪所需时间。为了在代码运行时提供一些可视内容，它每\
  \ 100 步绘制一次图的当前布局。\n\n```\nfunction runLayout(implementation, graph) {\n\n  function\
  \ run(steps, time) {\n\n    let startTime = Date.now();\n\n    for (let i = 0; i\
  \ < 100; i++) {\n\n      implementation(graph);\n\n    }\n\n    time += Date.now()\
  \ - startTime;\n\n    drawGraph(graph);\n\n      if (steps == 0) console.log(time);\n\
  \n      else requestAnimationFrame(() => run(steps - 100, time));\n\n    }\n\n \
  \   run(4000, 0);\n\n  }\n```\n\n现在我们可以运行第一个实现，看看需要多少时间。\n\n```\n<script>\n  runLayout(forceDirected_simple,\
  \ treeGraph(4, 4));\n</script>\n```\n\n在我的机器上，使用 Firefox 浏览器 58 版本，这 4000 次迭代花费了大约两秒多一点，也就是每毫秒两次迭代。这很多。让我们看看能否做得更好。\n\
  \n### 避免重复工作\n\n做某事最快的方法就是避免去做——或者至少避免部分工作。通过思考代码在做什么，你常常能发现不必要的冗余或可以更快完成的事情。\n\n\
  在我们的示例项目中，就有这样一个减少工作量的机会。每对节点之间的力被计算了两次，一次在移动第一个节点时，一次在移动第二个节点时。由于节点 *X* 对节点 *Y*\
  \ 施加的力正好与节点 *Y* 对节点 *X* 施加的力相反，我们不需要计算两次这些力。\n\n函数的下一版本将内层循环改为只遍历当前节点之后的节点，这样每对节点只被查看一次。在计算一对节点之间的力之后，函数会更新两个节点的位置。\n\
  \n```\nfunction forceDirected_noRepeat(graph) {\n\n  for (let i = 0; i < graph.length;\
  \ i++) {\n\n    let node = graph[i];\n\n    for (let j = i + 1; j < graph.length;\
  \ j++) {\n\n      let other = graph[j];\n\n      let apart = other.pos.minus(node.pos);\n\
  \n      let distance = Math.max(1, apart.length);\n\n      let forceSize = -repulsionStrength\
  \ / (distance * distance);\n\n      if (node.hasEdge(other)) {\n\n        forceSize\
  \ += (distance - springLength) * springStrength;\n\n      }\n\n      let applied\
  \ = apart.times(forceSize / distance);\n\n      node.pos = node.pos.plus(applied);\n\
  \n      other.pos = other.pos.minus(applied);\n\n    }\n\n  }\n\n}\n```\n\n测量这段代码显示出显著的性能提升。在\
  \ Firefox 58 上快了两倍，在 Chrome 63 上快了约 30%，在 Edge 6 上快了 75%。\n\n\n\n\nFirefox 和 Edge\
  \ 上的大幅提升只是实际优化的一部分结果。因为我们需要内层循环只遍历数组的一部分，新函数用常规的 `for` 循环替换了 `for/of` 循环。在 Chrome\
  \ 上，这对程序速度没有可测量的影响，但在 Firefox 上，仅仅不使用迭代器就让代码快了 20%——而在 Edge 上，差异达到了 50%。\n\n因此，不同的\
  \ JavaScript 引擎工作方式不同，运行程序的速度也可能不同。让代码在一个引擎上运行更快的改动，在另一个引擎上可能没有帮助（甚至可能拖慢速度）——甚至在同一引擎的不同版本中也是如此。\n\
  \n有趣的是，Chrome 的引擎名为 `V8`，也是 `Node.js` 使用的引擎，它能够优化数组上的 `for/of` 循环，使其速度不亚于按索引循环。请记住，迭代器接口涉及一个方法调用，该方法为迭代器中的每个元素返回一个对象。不知何故，`V8`\
  \ 成功地将大部分开销优化掉了。\n\n再仔细看看我们的程序在做什么，可能通过调用 `console.log` 输出 `forceSize`，就会发现大多数节点对之间产生的力非常微小，实际上对布局几乎没有影响。具体来说，当节点没有连接且彼此相距很远时，它们之间的力几乎可以忽略不计。然而，我们仍然为它们计算向量，并稍微移动节点。如果我们干脆不这样做呢？\n\
  \n下一个版本定义了一个距离阈值，超过该阈值的（未连接）节点对将不再计算和施加力。将该距离设为 175 后，小于 0.05 的力将被忽略。\n\n```\nconst\
  \ skipDistance = 175;\n\nfunction forceDirected_skip(graph) {\n\n  for (let i =\
  \ 0; i < graph.length; i++) {\n\n    let node = graph[i];\n\n    for (let j = i\
  \ + 1; j < graph.length; j++) {\n\n      let other = graph[j];\n\n      let apart\
  \ = other.pos.minus(node.pos);\n\n      let distance = Math.max(1, apart.length);\n\
  \n      let hasEdge = node.hasEdge(other);\n\n      if (!hasEdge && distance > skipDistance)\
  \ continue;\n\n      let forceSize = -repulsionStrength / (distance * distance);\n\
  \n      if (hasEdge) {\n\n        forceSize += (distance - springLength) * springStrength;\n\
  \n      }\n\n      let applied = apart.times(forceSize / distance);\n\n      node.pos\
  \ = node.pos.plus(applied);\n\n      other.pos = other.pos.minus(applied);\n\n    }\n\
  \n  }\n\n}\n```\n\n这又带来了 50% 的速度提升，且布局质量没有明显下降。我们走了一个捷径，并且成功了。\n\n### 性能分析\n\n我们仅通过推理就大幅加快了程序的速度。但说到*微优化*——即通过细微调整来提升速度的过程——通常很难预测哪些改动会有效，哪些不会。这时我们不能再依赖推理，而必须*观察*。\n\
  \n我们的 `runLayout` 函数测量了程序当前所需的时间。这是一个好的开始。要改进某件事，你必须先测量它。没有测量，你就无法知道你的改动是否达到了预期效果。\n\
  \n现代浏览器的开发者工具提供了更好的程序速度测量方式。这个工具叫做*性能分析器*。它会在程序运行时收集程序各个部分所消耗的时间信息。\n\n如果你的浏览器有性能分析器，它通常可以在开发者工具界面中找到，可能在一个名为“性能”（Performance）的标签页下。当我让\
  \ Chrome 的性能分析器记录当前程序运行 4000 次迭代时，它输出了以下表格：\n\n```\nSelf time                Total\
  \ time          Function\n\n 816.6 ms 75.4 %         1030.4 ms 95.2  %   forceDirected_skip\n\
  \n 194.1 ms 17.9 %          199.8 ms 18.5  %   includes\n\n  32.0 ms  3.0 %    \
  \       32.0 ms 3.0   %   Minor GC\n\n   2.1 ms  0.2 %         1043.6 ms 96.4  %\
  \   run\n```\n\n这里列出了消耗大量时间的函数（或其他任务）。对于每个函数，它报告了执行该函数所花费的时间，包括毫秒数和占总时间的百分比。第一列仅显示控制权实际在该函数内部的时间，而第二列则包括该函数调用的其他函数所花费的时间。\n\
  \n就性能分析而言，这是一个*非常*简单的例子，因为程序本身*没有*很多函数。对于更复杂的程序，列表会非常非常长。但由于耗时最多的函数显示在顶部，通常仍然很容易找到感兴趣的信息。\n\
  \n从这个表格中，我们可以看出，绝大多数时间都花在了物理模拟函数上。这并不意外。但在第二行，我们看到 `includes` 数组方法（在 `GraphNode.hasEdge`\
  \ 中使用）占用了程序约 18% 的时间。\n\n这*确实*比我预期的要多一些。我们调用了它很多次——在一个 85 个节点的图（通过 `treeGraph(4,\
  \ 4)` 得到）中，有 3570 对节点。因此，在 4000 次迭代中，`hasEdge` 被调用了超过 1400 万次。\n\n让我们看看能否做得更好。我们在\
  \ `GraphNode` 类中添加了 `hasEdge` 方法的另一个变体，并创建了一个新的模拟函数变体，该变体调用这个新方法而不是 `hasEdge`。\n\
  \n```\nGraphNode.prototype.hasEdgeFast = function(other) {\n\n  for (let i = 0;\
  \ i < this.edges.length; i++) {\n\n    if (this.edges[i] === other) return true;\n\
  \n  }\n\n  return false;\n\n};\n```\n\n在 Chrome 上，这使计算布局所需的时间减少了约 17%，这大致相当于性能分析中\
  \ `includes` 所花费的时间。在 Edge 上，它使程序快了 40%。但在 Firefox 上，它反而稍微慢了一点（约 3%）。因此，在这种情况下，Firefox\
  \ 的引擎（名为 `SpiderMonkey`）在优化 `includes` 调用方面做得更好。\n\n性能分析中标记为 `Minor GC` 的行显示了清理不再使用的内存所花费的时间。考虑到我们的程序创建了大量向量对象，3%\
  \ 的内存回收时间低得惊人。JavaScript 引擎通常拥有非常高效的垃圾回收器。\n\n### 函数内联\n\n在我们看到的性能分析中，没有出现任何向量方法（如\
  \ `times`），尽管它们被大量使用。这是因为编译器对它们进行了*内联*。编译器没有让内层函数调用实际的方法来乘以向量，而是将向量乘法代码直接放入函数内部，因此在编译后的代码中不会发生实际的方法调用。\n\
  \n内联有多种方式有助于提高代码速度。在机器层面，函数和方法通过一种协议调用，该协议要求将参数和返回地址（函数返回后执行继续的位置）放在函数可以找到的地方。函数调用将控制权交给程序的另一部分，这通常还需要保存处理器的某些状态，以便被调用的函数可以使用处理器而不干扰调用者仍需要的数据。当函数被内联时，所有这些都变得不必要。\n\
  \n此外，一个好的编译器会尽力寻找简化生成代码的方法。如果函数被视为可能做任何事的黑盒，编译器就没有太多可操作的空间。另一方面，如果编译器能够看到并包含函数体进行分析，它可能会找到额外的优化机会。\n\
  \n例如，JavaScript 引擎可以完全避免创建我们代码中的某些向量对象。在像下面这样的表达式中，如果我们能看透这些方法，就会清楚地发现，结果向量的坐标是\
  \ force 的坐标加上 normalized 的坐标与 `forceSize` 绑定的乘积。因此，不需要创建 `times` 方法产生的中间对象。\n\n\
  ```\npos.plus(normalized.times(forceSize))\n```\n\n\n\n\n\n但 JavaScript 允许我们随时替换方法。编译器如何确定\
  \ `this.times` 方法实际指向哪个函数？如果之后有人修改了 `Vec.prototype.times` 中存储的值呢？下次运行内联了该函数的代码时，它可能会继续使用旧的定义，从而违背程序员对程序行为的预期。\n\
  \n这正是执行与编译交错进行开始显现优势的地方。当一个热点函数被编译时，它已经运行了多次。如果在这几次运行中，它始终调用同一个函数，那么尝试内联该函数是合理的。代码会以乐观的方式编译，假设未来这里仍会调用同一个函数。\n\
  \n为了处理悲观情况（即最终调用了另一个函数），编译器会插入一个测试，将实际调用的函数与内联的函数进行比较。如果两者不匹配，则乐观编译的代码是错误的，JavaScript\
  \ 引擎必须执行 `deoptimize`（去优化），即回退到优化程度较低的代码版本。\n\n### 减少垃圾对象\n\n尽管我们创建的一些向量对象可能会被某些引擎完全优化掉，但创建所有这些对象仍然可能带来成本。为了估算这种成本的大小，让我们编写一个“手动”进行向量计算的代码版本，对两个维度都使用局部绑定。\n\
  \n```\nfunction forceDirected_noVector(graph) {\n\n  for (let i = 0; i < graph.length;\
  \ i++) {\n\n    let node = graph[i];\n\n    for (let j = i + 1; j < graph.length;\
  \ j++) {\n\n      let other = graph[j];\n\n      let apartX = other.pos.x - node.pos.x;\n\
  \n      let apartY = other.pos.y - node.pos.y;\n\n      let distance = Math.max(1,\
  \ Math.sqrt(apartX * apartX +\n\n                                           apartY\
  \ * apartY));\n\n      let hasEdge = node.hasEdgeFast(other);\n\n      if (!hasEdge\
  \ && distance > skipDistance) continue;\n\n      let forceSize = -repulsionStrength\
  \ / (distance * distance);\n\n      if (hasEdge) {\n\n        forceSize += (distance\
  \ - springLength) * springStrength;\n\n      }\n\n      let forceX = apartX * forceSize\
  \ / distance;\n\n      let forceY = apartY * forceSize / distance;\n\n      node.pos.x\
  \ += forceX; node.pos.y += forceY;\n\n      other.pos.x -= forceX; other.pos.y -=\
  \ forceY;\n\n    }\n\n  }\n\n}\n```\n\n新代码更冗长、更重复，但根据我的测量，改进幅度很大，足以考虑在性能敏感的代码中采用这种手动对象扁平化方式。在\
  \ Firefox 和 Chrome 上，新版本比之前的版本快约 30%。在 Edge 上则快约 60%。\n\n综合所有这些步骤，我们在 Chrome 和 Firefox\
  \ 上使程序比初始版本快了约 5 倍，在 Edge 上快了 20 倍以上。这是相当大的改进。但请记住，这种优化只对实际消耗大量时间的代码有用。试图立即优化所有内容只会拖慢你的速度，并留下大量不必要的复杂代码。\n\
  \n### 垃圾回收\n\n那么，为什么避免创建对象的代码会更快呢？有几个原因。引擎需要找到存储对象的位置，需要确定它们何时不再使用并回收它们，并且在访问它们的属性时，需要确定这些属性在内存中的位置。JavaScript\
  \ 引擎在这些方面都很擅长，但通常还没有好到可以忽略成本的程度。\n\n再次将内存想象成一长串比特位。当程序启动时，它可能会收到一块空的内存，然后开始将创建的对象一个接一个地放入其中。但到了某个时刻，空间满了，其中一些对象不再被使用。JavaScript\
  \ 引擎必须确定哪些对象在使用，哪些没有，以便重用未使用的内存片段。\n\n此时程序的内存空间变得有些混乱，包含活着的对象和空闲空间交错在一起。创建新对象需要找到一块足够大的空闲空间来容纳该对象，这可能需要一些搜索。或者，引擎可以将所有活着的对象移动到内存空间的起始位置，这样创建新对象会更便宜（可以再次一个接一个地放置），但移动旧对象时需要更多工作。\n\
  \n原则上，确定哪些对象仍在使用需要从全局作用域和当前活动的局部作用域开始，追踪所有可达对象。从这些作用域直接或间接引用的任何对象都仍然存活。如果你的程序在内存中有大量数据，这将是一项相当大的工作。\n\
  \n一种称为 `generational garbage collection`（分代垃圾回收）的技术有助于降低这些成本。这种方法利用了大多数对象生命周期较短的特点。它将\
  \ JavaScript 程序可用的内存分成两个或多个 `generations`（代）。新对象在年轻代（young generation）的保留空间中创建。当这个空间满了时，引擎会确定其中哪些对象仍然存活，并将它们移动到下一代。如果此时年轻代中只有一小部分对象存活，那么移动它们所需的工作量就很小。\n\
  \n当然，确定哪些对象存活确实需要知道对存活代中对象的所有引用。垃圾回收器希望避免每次回收年轻代时都遍历所有老年代的对象。因此，当从旧对象创建到新对象的引用时，必须记录这个引用，以便在下一次回收时考虑它。这使得写入旧对象的成本略高，但这一成本远低于垃圾回收所节省的时间。\n\
  \n### 动态类型\n\n像 `node.pos` 这样的 JavaScript 表达式（从对象中获取属性）编译起来远非易事。在许多语言中，`bindings`（绑定）具有类型，因此当你对它们持有的值执行操作时，编译器已经知道你需要哪种操作。在\
  \ JavaScript 中，只有 `values`（值）具有类型，而一个绑定最终可能持有不同类型的值。\n\n这意味着最初编译器对代码可能试图访问的属性知之甚少，必须生成处理所有可能类型的代码。如果\
  \ `node` 持有 `undefined` 值，代码必须抛出错误。如果它持有字符串，则必须在 `String.prototype` 中查找 `pos`。如果它持有对象，则从中提取\
  \ `pos` 属性的方式取决于对象的形状（shape）。等等。\n\n幸运的是，尽管 JavaScript 并不要求，但大多数程序中的绑定*确实*具有单一类型。如果编译器知道这个类型，它就可以利用该信息生成更高效的代码。如果到目前为止\
  \ `node` 一直是一个具有 `pos` 和 `edges` 属性的对象，那么优化编译器可以创建代码，从该对象中已知的位置获取属性，这既简单又快速。\n\n\
  但过去观察到的事件并不能保证未来会发生的事件。尚未运行的某段代码可能仍然会向我们的函数传递另一种类型的值——例如，另一种节点对象，它也具有 `id` 属性。\n\
  \n因此，编译后的代码仍然必须*检查*其假设是否成立，并在不成立时采取适当的行动。引擎可以完全去优化，回退到函数的未优化版本。或者它可以编译一个新版本的函数，同时处理新观察到的类型。\n\
  \n你可以通过故意破坏图布局函数输入对象的统一性来观察因无法预测对象类型而导致的性能下降，如下例所示：\n\n```\nlet mangledGraph = treeGraph(4,\
  \ 4);\n\nfor (let node of mangledGraph) {\n```\n\n\n\n\n\n```\n  node[`p${Math.floor(Math.random()\
  \ * 999)}`] = true;\n\n}\n\nrunLayout(forceDirected_noVector, mangledGraph);\n```\n\
  \n每个节点都会获得一个带有随机名称的额外属性。如果我们在生成的图上运行快速模拟代码，它在 Chrome 63 上的速度会慢 5 倍，在 Firefox 58\
  \ 上则会慢 10 (!) 倍。由于对象类型变得多样化，代码必须在没有预先了解对象形状的情况下查找属性，这会导致更高的开销。\n\n有趣的是，运行这段代码后，即使是在普通的、未经篡改的图上运行\
  \ `forceDirected_noVector`，它也会变慢。混乱的类型“污染”了编译后的代码，至少在一段时间内如此——在某些时候，浏览器会丢弃编译后的代码并重新从头编译，从而消除这种影响。\n\
  \n类似的技术也用于属性访问之外的其他场景。例如，`+` 运算符根据其操作数的类型具有不同的含义。智能的 JavaScript 编译器不会总是运行处理所有这些含义的完整代码，而是利用先前的观察结果来建立对运算符可能应用类型的预期。如果它只应用于数字，则可以生成更简单的机器代码来处理。但同样，每次函数运行时都必须检查这些假设。\n\
  \n这个故事告诉我们，如果一段代码需要快速运行，可以通过提供一致的类型来帮助它。JavaScript 引擎可以很好地处理少数几种不同类型的情况——它们会生成处理所有这些类型的代码，并且只有在遇到新类型时才会进行去优化。但即便如此，生成的代码也比单一类型的情况要慢。\n\
  \n### 总结\n\n得益于投入在 Web 上的巨额资金以及不同浏览器之间的竞争，JavaScript 编译器擅长于它们的工作：让代码快速运行。\n\n但有时你需要稍微帮助它们，重写内部循环以避免更昂贵的\
  \ JavaScript 特性。创建更少的对象（以及数组和字符串）通常会有所帮助。\n\n在开始为了速度而篡改代码之前，先思考如何让它做更少的工作。优化的最大机会往往就在这个方向上。\n\
  \nJavaScript 引擎会多次编译热代码，并利用先前执行过程中收集的信息来编译更高效的代码。你可以通过为绑定提供一致的类型来提供帮助。\n\n### 练习\n\
  \n#### *寻路*\n\n编写一个函数 `findPath`，类似于你在第 7 章中看到的函数，尝试在图中的两个节点之间找到最短路径。它接受两个 `GraphNode`\
  \ 对象（如本章所用）作为参数，如果找不到路径则返回 `null`，否则返回一个表示图中路径的节点数组。该数组中相邻的节点之间应该有一条边。\n\n在图中寻找路径的一个好方法如下：\n\
  \n1.  创建一个工作列表，其中包含一条仅包含起始节点的路径。\n2.  从工作列表中的第一条路径开始。\n3.  如果当前路径末尾的节点是目标节点，则返回该路径。\n\
  4.  否则，对于路径末尾节点的每个邻居，如果该节点之前没有被查看过（即不在工作列表中任何路径的末尾），则通过将该邻居添加到当前路径来创建一条新路径，并将其加入工作列表。\n\
  5.  如果工作列表中还有更多路径，则转到下一条路径并继续执行步骤 3。\n6.  否则，不存在路径。\n\n通过从起始节点“扩散”路径，这种方法确保总是通过最短路径到达给定的其他节点，因为只有在尝试了所有较短路径之后才会考虑更长的路径。\n\
  \n实现这个程序，并在一些简单的树形图上进行测试。构造一个包含环的图（例如，使用 `connect` 方法向树形图添加边），并查看你的函数在存在多种可能性时是否能找到最短路径。\n\
  \n#### *计时*\n\n使用 `Date.now()` 来测量你的 `findPath` 函数在更复杂的图中找到路径所需的时间。由于 `treeGraph`\
  \ 总是将根节点放在图数组的开头，将叶子节点放在末尾，你可以通过类似下面的方式为函数分配一个非平凡的任务：\n\n```\nlet graph = treeGraph(6,\
  \ 6);\n\nconsole.log(findPath(graph[0], graph[graph.length - 1]).length);\n\n//\
  \ → 6\n```\n\n创建一个运行时间大约为半秒的测试用例。注意不要向 `treeGraph` 传递过大的数字——图的大小呈指数增长，因此很容易使图变得过大，从而需要大量时间和内存才能找到路径。\n\
  \n#### *优化*\n\n现在你已经有了一个可测量的测试用例，想办法让你的 `findPath` 函数更快。\n\n同时考虑宏观优化（做更少的工作）和微观优化（以更廉价的方式完成给定的工作）。此外，考虑如何减少内存使用，以及分配更少或更小的数据结构。\n\
  \n## 练习提示\n\n以下提示可能在你遇到本书中某个练习的困难时提供帮助。它们不会透露整个解决方案，而是试图帮助你自行找到答案。\n\n### 第 2 章：程序结构\n\
  \n#### *循环三角形*\n\n你可以从一个打印数字 1 到 7 的程序开始，这个程序可以通过对第 30 页“while 和 do 循环”中介绍 for 循环的偶数打印示例进行少量修改得到。\n\
  \n现在考虑数字与井号字符串之间的等价关系。你可以通过加 1（`+= 1`）从 1 到 2。你可以通过添加一个字符（`+= \"#\"`）从 `\"#\"` 到\
  \ `\"##\"`。因此，你的解决方案可以紧密跟随数字打印程序。\n\n#### *FizzBuzz*\n\n遍历数字显然是一个循环任务，而选择打印什么则是条件执行的问题。记住使用取余（`%`）运算符来检查一个数是否能被另一个数整除（余数为零）。\n\
  \n在第一个版本中，每个数字有三种可能的结果，因此你需要创建一个 `if/else if/else` 链。\n\n程序的第二个版本有一个直接的解决方案和一个巧妙的解决方案。简单的解决方案是添加另一个条件“分支”来精确测试给定的条件。对于巧妙的解决方案，构建一个包含要输出的单词或单词的字符串，然后打印这个单词或如果没有单词则打印数字，可能通过巧妙使用\
  \ `||` 运算符来实现。\n\n#### *棋盘*\n\n你可以从一个空字符串（`\"\"`）开始，然后重复添加字符来构建字符串。换行符写作 `\"\\n\"\
  `。\n\n要处理二维，你需要一个循环嵌套在另一个循环中。在两个循环体周围加上花括号，以便于看清它们的开始和结束。尝试正确缩进这些循环体。循环的顺序必须遵循我们构建字符串的顺序（逐行，从左到右，从上到下）。因此，外层循环处理行，内层循环处理行中的字符。\n\
  \n你需要两个绑定来跟踪进度。要知道在某个位置放置空格还是井号，你可以测试两个计数器的和是否为偶数（`% 2`）。\n\n在构建完一行后，必须通过添加换行符来终止该行，因此在内层循环之后、外层循环内部执行此操作。\n\
  \n### 第 3 章：函数\n\n#### *最小值*\n\n如果你在正确放置花括号和圆括号以定义有效函数时遇到困难，请先复制本章中的一个示例并进行修改。\n\
  \n一个函数可以包含多个 `return` 语句。\n\n#### *递归*\n\n\n\n\n你的函数很可能与第 3 章中递归的`findSolution`示例里的内部`find`函数有些相似，其中包含一个`if/else\
  \ if/else`链，用于测试三种情况中的哪一种适用。最后的`else`对应第三种情况，进行递归调用。每个分支都应包含一个`return`语句，或以其他方式安排返回特定值。\n\
  \n当给定一个负数时，函数会不断递归，传入越来越小的负数，从而离返回结果越来越远。它最终会耗尽栈空间并中止。\n\n#### 数豆子\n\n你的函数需要一个循环来检查字符串中的每个字符。它可以运行一个索引，从零到字符串长度减一（`<\
  \ string.length`）。如果当前位置的字符与函数正在查找的字符相同，则向计数器变量加 1。循环结束后，返回该计数器。\n\n注意，通过使用`let`或`const`关键字正确声明，确保函数中使用的所有绑定都是函数*局部*的。\n\
  \n### 第 4 章：数据结构：对象与数组\n\n#### 范围求和\n\n构建数组最简单的方法是先初始化一个绑定为`[]`（一个全新的空数组），然后反复调用其`push`方法来添加值。别忘了在函数末尾返回该数组。\n\
  \n由于结束边界是包含的，你需要使用`<=`运算符而不是`<`来检查循环是否结束。\n\n`step`参数可以是一个可选参数，默认值（使用`=`运算符）为 1。\n\
  \n让`range`理解负步长值，最好通过编写两个独立的循环来实现——一个用于递增计数，一个用于递减计数——因为检查循环是否结束的比较在递减计数时需要是`>=`而不是`<=`。\n\
  \n当范围的结束值小于起始值时，使用不同的默认步长（即-1）可能也是值得的。这样，`range(5, 2)`会返回有意义的结果，而不是陷入无限循环。可以在参数的默认值中引用前面的参数。\n\
  \n#### 反转数组\n\n实现`reverseArray`有两种明显的方法。第一种是简单地从前往后遍历输入数组，并使用新数组的`unshift`方法将每个元素插入到开头。第二种是反向遍历输入数组，并使用`push`方法。反向遍历数组需要一个（有点别扭的）`for`规范，例如`(let\
  \ i = array.length - 1; i >= 0; i--)`。\n\n原地反转数组更难。你必须小心不要覆盖以后需要的元素。使用`reverseArray`或以其他方式复制整个数组（`array.slice(0)`是复制数组的好方法）虽然可行，但属于作弊。\n\
  \n技巧是*交换*第一个和最后一个元素，然后交换第二个和倒数第二个，依此类推。你可以通过循环数组长度的一半（使用`Math.floor`向下取整——对于奇数个元素的数组，你不需要触碰中间的元素）并交换位置`i`和位置`array.length\
  \ - 1 - i`的元素来实现。你可以使用一个局部绑定来临时保存其中一个元素，用其镜像元素覆盖它，然后将局部绑定中的值放到镜像元素原来的位置。\n\n####\
  \ 列表\n\n从后往前构建列表更容易。因此`arrayToList`可以反向遍历数组（参见上一个练习），并为每个元素向列表中添加一个对象。你可以使用一个局部绑定来保存已构建的部分列表，并使用类似`list\
  \ = {value: X, rest: list}`的赋值来添加元素。\n\n要遍历列表（在`listToArray`和`nth`中），可以使用如下`for`循环规范：\n\
  \n```\nfor (let node = list; node; node = node.rest) {}\n```\n\n你能看出这是如何工作的吗？循环的每次迭代中，`node`指向当前子列表，循环体可以读取其`value`属性来获取当前元素。在迭代结束时，`node`移动到下一个子列表。当它为`null`时，我们就到达了列表末尾，循环结束。\n\
  \n递归版本的`nth`类似地会查看列表“尾部”越来越小的部分，同时递减索引直到它达到零，此时它可以返回所查看节点的`value`属性。要获取列表的第零个元素，你只需取其头节点的`value`属性。要获取第*N*\
  \ + 1 个元素，你取该列表的`rest`属性中列表的第*N*个元素。\n\n#### 深度比较\n\n你判断是否在处理一个真实对象的测试看起来像`typeof\
  \ x == \"object\" && x != null`。注意仅在*两个*参数都是对象时才比较属性。在所有其他情况下，你可以直接返回应用`===`的结果。\n\
  \n使用`Object.keys`来遍历属性。你需要测试两个对象是否具有相同的属性名集合，以及这些属性是否具有相同的值。一种方法是确保两个对象具有相同数量的属性（属性列表的长度相同）。然后，在遍历其中一个对象的属性进行比较时，始终先确保另一个对象确实具有该名称的属性。如果它们具有相同数量的属性，并且一个对象中的所有属性也存在于另一个对象中，那么它们就具有相同的属性名集合。\n\
  \n从函数返回正确值的最佳方法是，一旦发现不匹配就立即返回`false`，并在函数末尾返回`true`。\n\n### 第 5 章：高阶函数\n\n#### 全部\n\
  \n与`&&`运算符类似，`every`方法一旦发现一个不匹配的元素就可以停止评估后续元素。因此，基于循环的版本可以在遇到谓词函数返回`false`的元素时立即跳出循环——使用`break`或`return`。如果循环运行到结束都没有找到这样的元素，我们就知道所有元素都匹配，应该返回`true`。\n\
  \n要在`some`的基础上构建`every`，我们可以应用*德摩根定律*，该定律指出`a && b`等于`!(!a || !b)`。这可以推广到数组：如果数组中没有不匹配的元素，那么数组中的所有元素都匹配。\n\
  \n#### 主导书写方向\n\n你的解决方案可能看起来很像`textScripts`示例的前半部分。你再次需要根据`characterScript`的标准来统计字符，然后过滤掉结果中涉及无趣（无脚本）字符的部分。\n\
  \n找到字符计数最高的方向可以使用`reduce`。如果不清楚如何操作，请参考本章前面的示例，其中使用`reduce`来查找字符最多的脚本。\n\n### 第\
  \ 6 章：对象的秘密生活\n\n#### 向量类型\n\n如果你不确定类声明的写法，请回顾`Rabbit`类示例。\n\n向构造函数添加 getter 属性可以通过在方法名前加上`get`关键字来实现。要计算从(0,\
  \ 0)到(x, y)的距离，你可以使用勾股定理，该定理指出我们寻找的距离的平方等于 x 坐标的平方加上 y 坐标的平方。因此，![Image](img/c0411-01.jpg)就是你想要的数字，而`Math.sqrt`是在\
  \ JavaScript 中计算平方根的方法。\n\n#### 组\n\n最简单的方法是将组成员数组存储在一个实例属性中。可以使用`includes`或`indexOf`方法来检查给定值是否在数组中。\n\
  \n\n\n你的类的构造函数可以将成员集合设置为空数组。当调用 `add` 时，它必须检查给定值是否已在数组中，否则将其添加（例如使用 `push`）。\n\n\
  在 `delete` 中从数组中删除元素不那么直接，但你可以使用 `filter` 创建一个不包含该值的新数组。别忘了用新过滤后的数组覆盖保存成员的属性。\n\n\
  `from` 方法可以使用 `for/of` 循环从可迭代对象中获取值，并调用 `add` 将它们放入新创建的组中。\n\n#### *可迭代组*\n\n定义一个名为\
  \ `GroupIterator` 的新类可能是值得的。迭代器实例应该有一个属性来跟踪当前在组中的位置。每次调用 `next` 时，它会检查是否已完成，如果未完成，则越过当前值并返回它。\n\
  \n`Group` 类本身获得一个名为 `Symbol.iterator` 的方法，当调用时，它会为该组返回迭代器类的一个新实例。\n\n#### *借用方法*\n\
  \n请记住，普通对象上的方法来自 `Object.prototype`。\n\n还要记住，你可以通过使用 `call` 方法以特定的 `this` 绑定来调用函数。\n\
  \n### 第 7 章：项目：机器人\n\n#### *测量机器人*\n\n你需要编写一个 `runRobot` 函数的变体，该变体不是将事件记录到控制台，而是返回机器人完成任务所需的步数。\n\
  \n然后，你的测量函数可以在循环中生成新状态，并计算每个机器人所走的步数。当函数生成了足够的测量数据后，它可以使用 `console.log` 输出每个机器人的平均值，即总步数除以测量次数。\n\
  \n#### *机器人效率*\n\n`goalOrientedRobot` 的主要限制是它一次只考虑一个包裹。它经常会在村庄里来回走动，因为它碰巧正在查看的包裹恰好在地图的另一边，即使有其他包裹更近。\n\
  \n一种可能的解决方案是计算所有包裹的路线，然后选择最短的路线。如果有多个最短路线，通过优先选择去取包裹而不是送包裹的路线，可以获得更好的结果。\n\n####\
  \ *持久化组*\n\n表示成员值集合的最便捷方式仍然是数组，因为数组易于复制。\n\n当向组中添加一个值时，你可以创建一个新组，其中包含原始数组的副本并添加了该值（例如，使用\
  \ `concat`）。当删除一个值时，你可以从数组中过滤掉它。\n\n类的构造函数可以将这样的数组作为参数，并将其存储为实例的（唯一）属性。这个数组永远不会被更新。\n\
  \n要向构造函数添加一个不是方法的属性（`empty`），你必须在类定义之后将其作为常规属性添加到构造函数中。\n\n你只需要一个空实例，因为所有空组都是相同的，并且类的实例不会改变。你可以从那个单一的空组创建许多不同的组，而不会影响它。\n\
  \n### 第 8 章：错误与异常\n\n#### *重试*\n\n对 `primitiveMultiply` 的调用应该放在 `try` 块中。相应的 `catch`\
  \ 块应该在异常不是 `MultiplicatorUnitFailure` 的实例时重新抛出该异常，并确保在是其实例时重试调用。\n\n为了进行重试，你可以使用一个循环，该循环仅在调用成功时停止——如第\
  \ 135 页“异常”中的循环示例所示——或者使用递归，并希望你不会遇到一连串的失败导致栈溢出（这相当安全）。\n\n#### *锁定的盒子*\n\n这个练习需要一个\
  \ `finally` 块。你的函数应该首先解锁盒子，然后在 `try` 体内调用参数函数。之后的 `finally` 块应该再次锁定盒子。\n\n为了确保我们不会在盒子未锁定时锁定它，请在函数开始时检查其锁定状态，并且仅当它最初是锁定时才解锁和锁定它。\n\
  \n### 第 9 章：正则表达式\n\n#### *引用风格*\n\n最明显的解决方案是只替换至少一侧带有非单词字符的引号——例如 `/\\W'|'\\W/`。但你还必须考虑行的开头和结尾。\n\
  \n此外，你必须确保替换也包括由 `\\W` 模式匹配的字符，这样它们就不会被丢弃。这可以通过将它们括在括号中并将它们的组包含在替换字符串中（`$1`、`$2`）来实现。未匹配的组将被替换为空。\n\
  \n#### *数字再次*\n\n首先，不要忘记句点前的反斜杠。\n\n匹配数字前的可选符号以及指数前的可选符号，可以使用 `[+\\-]?` 或 `(\\+|-|)`（加号、减号或空）。\n\
  \n练习中更复杂的部分是匹配 `\"5.\"` 和 `\".5\"` 而不匹配 `\".\"` 的问题。为此，一个好的解决方案是使用 `|` 运算符来分隔两种情况——要么是一个或多个数字，可选地后跟一个句点和零个或多个数字，*或者*是一个句点后跟一个或多个数字。\n\
  \n最后，为了使 `e` 不区分大小写，要么在正则表达式中添加 `i` 选项，要么使用 `[eE]`。\n\n### 第 10 章：模块\n\n#### *模块化机器人*\n\
  \n我会采用以下方法（但同样，没有单一的*正确*方式来设计给定的模块）。\n\n用于构建道路图的代码位于 `graph` 模块中。我宁愿使用 NPM 的 `dijkstrajs`\
  \ 而不是我们自己的寻路代码，因此我们将构建 `dijkstrajs` 所期望的那种图数据。该模块导出一个函数 `buildGraph`。我会让 `buildGraph`\
  \ 接受一个包含两个元素的数组的数组，而不是包含连字符的字符串，以使模块对输入格式的依赖更少。\n\n`roads` 模块包含原始道路数据（`roads` 数组）和\
  \ `roadGraph` 绑定。该模块依赖于 `./graph` 并导出道路图。\n\n`VillageState` 类位于 `state` 模块中。它依赖于\
  \ `./roads` 模块，因为它需要能够验证给定的道路是否存在。它还需要 `randomPick`。由于这是一个三行函数，我们可以将其作为内部辅助函数放入\
  \ `state` 模块中。但 `randomRobot` 也需要它。因此，我们要么复制它，要么将其放入自己的模块中。由于这个函数恰好存在于 NPM 的 `random-item`\
  \ 包中，一个好的解决方案是让两个模块都依赖于它。我们也可以将 `runRobot` 函数添加到这个模块中，因为它很小且与状态管理密切相关。该模块导出 `VillageState`\
  \ 类和 `runRobot` 函数。\n\n最后，机器人以及它们所依赖的值（如 `mailRoute`）可以放入 `example-robots` 模块中，该模块依赖于\
  \ `./roads` 并导出机器人函数。为了使 `goalOrientedRobot` 能够进行路径查找，该模块还依赖于 `dijkstrajs`。\n\n\
  通过将一些工作外包给 NPM 模块，代码变得稍微小了一些。每个单独的模块都做相当简单的事情，并且可以独立阅读。将代码划分为模块也常常暗示着程序设计的进一步改进。在这种情况下，`VillageState`\
  \ 和机器人依赖于特定的道路图似乎有点奇怪。更好的做法可能是将图作为状态构造函数的参数，并让机器人从状态对象中读取它——这减少了依赖关系（这总是好的），并且使得可以在不同的地图上运行模拟（这甚至更好）。\n\
  \n\n\n对于本可以自己编写的内容，使用 NPM 模块是否是个好主意？原则上，是的——对于像寻路函数这样非琐碎的任务，自己编写很可能会犯错并浪费时间。而对于像\
  \ `random-item` 这样的小函数，自己编写就足够简单了。但在需要的地方都添加它们，确实会让你的模块变得杂乱。\n\n然而，你也不应低估*寻找*合适的\
  \ NPM 包所需的工作量。即使找到了一个，它可能运行不佳，或者缺少你需要的某些功能。除此之外，依赖 NPM 包意味着你必须确保它们已安装，必须将它们与程序一起分发，并且可能还需要定期升级它们。\n\
  \n所以，这又是一个权衡，你可以根据这些包对你的帮助程度来决定采用哪种方式。\n\n#### *Roads 模块*\n\n由于这是一个 CommonJS 模块，你必须使用\
  \ `require` 来导入图模块。该模块被描述为导出一个 `buildGraph` 函数，你可以通过解构的 `const` 声明从其接口对象中取出该函数。\n\
  \n要导出 `roadGraph`，你需要向 `exports` 对象添加一个属性。因为 `buildGraph` 接受的数据结构与道路不完全匹配，所以道路字符串的分割必须在你的模块中完成。\n\
  \n#### *循环依赖*\n\n诀窍在于，`require` 在开始加载模块*之前*就将模块添加到其缓存中。这样，如果在加载过程中任何 `require` 调用试图加载该模块，它已经被识别，并且会返回当前的接口，而不是再次开始加载该模块（这最终会导致栈溢出）。\n\
  \n如果一个模块覆盖了它的 `module.exports` 值，那么任何在其完成加载之前已经接收到其接口值的其他模块，将获得默认的接口对象（很可能是空的），而不是预期的接口值。\n\
  \n### 第 11 章：异步编程\n\n#### *追踪手术刀*\n\n这可以通过一个简单的循环来完成，该循环搜索各个巢穴，当发现一个值与当前巢穴名称不匹配时，就向前移动到下一个，当找到匹配的值时返回该名称。在异步函数中，可以使用常规的\
  \ `for` 或 `while` 循环。\n\n要在普通函数中实现同样的功能，你需要使用递归函数来构建循环。最简单的方法是在检索存储值的 promise 上调用\
  \ `then`，让该函数返回一个 promise。根据该值是否与当前巢穴的名称匹配，处理程序返回该值，或者通过再次调用循环函数创建的另一个 promise。\n\
  \n别忘了在主函数中调用一次递归函数来启动循环。\n\n在异步函数中，被拒绝的 promise 会通过 `await` 转换为异常。当异步函数抛出异常时，它的\
  \ promise 会被拒绝。所以这样是可行的。\n\n如果你按照前面概述的方式实现了非异步函数，那么 `then` 的工作方式也会自动导致失败最终进入返回的\
  \ promise。如果请求失败，传递给 `then` 的处理程序不会被调用，并且它返回的 promise 会以相同的原因被拒绝。\n\n#### *构建 Promise.all*\n\
  \n传递给 `Promise` 构造函数的函数必须对给定数组中的每个 promise 调用 `then`。当其中一个成功时，需要做两件事：将结果值存储在结果数组的正确位置，并且我们必须检查这是否是最后一个待处理的\
  \ promise，如果是，则完成我们自己的 promise。\n\n后者可以通过一个计数器来实现，该计数器初始化为输入数组的长度，每次 promise 成功时减\
  \ 1。当它达到 0 时，我们就完成了。确保考虑到输入数组为空的情况（此时没有 promise 会 resolve）。\n\n处理失败需要一些思考，但实际上非常简单。只需将包装\
  \ promise 的 `reject` 函数作为 `catch` 处理程序或作为 `then` 的第二个参数传递给数组中的每个 promise，这样其中一个\
  \ promise 的失败就会触发整个包装 promise 的拒绝。\n\n### 第 12 章：项目：一门编程语言\n\n#### *数组*\n\n最简单的方法是用\
  \ JavaScript 数组来表示 Egg 数组。\n\n添加到顶层作用域的值必须是函数。通过使用剩余参数（使用三点表示法），`array` 的定义可以*非常*简单。\n\
  \n#### *闭包*\n\n同样，我们借助 JavaScript 机制来在 Egg 中获得等效特性。特殊形式会传入它们被求值时的局部作用域，以便它们可以在该作用域中求值其子形式。由\
  \ `fun` 返回的函数可以访问其外层函数的作用域参数，并在调用时使用该参数来创建函数的局部作用域。\n\n这意味着局部作用域的原型将是创建该函数时所在的作用域，这使得从该函数访问该作用域中的绑定成为可能。这就是实现闭包的全部内容（不过要以高效的方式编译它，你还需要做更多工作）。\n\
  \n#### *注释*\n\n确保你的解决方案能处理连续多个注释，以及它们之间或之后可能存在的空白。\n\n正则表达式可能是解决这个问题的最简单方法。编写一个匹配“空白或注释，零次或多次”的模式。使用\
  \ `exec` 或 `match` 方法，并查看返回数组第一个元素（整个匹配）的长度，以确定要切掉多少个字符。\n\n#### *修复作用域*\n\n你需要一次遍历一个作用域，使用\
  \ `Object.getPrototypeOf` 进入下一个外层作用域。对于每个作用域，使用 `hasOwnProperty` 来检查由 `set` 的第一个参数的\
  \ `name` 属性指示的绑定是否存在于该作用域中。如果存在，则将其设置为求值 `set` 的第二个参数的结果，然后返回该值。\n\n如果到达最外层作用域（`Object.getPrototypeOf`\
  \ 返回 `null`）并且尚未找到该绑定，则该绑定不存在，应抛出错误。\n\n### 第 14 章：文档对象模型\n\n#### *构建表格*\n\n你可以使用\
  \ `document.createElement` 创建新的元素节点，使用 `document.createTextNode` 创建文本节点，以及使用 `appendChild`\
  \ 方法将节点放入其他节点中。\n\n你需要遍历键名一次以填充顶行，然后为数组中的每个对象再次遍历以构建数据行。要从第一个对象获取键名数组，`Object.keys`\
  \ 会很有用。\n\n要将表格添加到正确的父节点，你可以使用 `document.getElementById` 或 `document.querySelector`\
  \ 来查找具有正确 `id` 属性的节点。\n\n#### *按标签名查找元素*\n\n解决方案最容易用递归函数来表达，类似于本章前面定义的 `talksAbout`\
  \ 函数。\n\n你可以递归地调用 `byTagname` 本身，连接结果数组以生成输出。或者，你可以创建一个内部函数，该函数递归调用自身，并可以访问外部函数中定义的数组绑定，将找到的匹配元素添加到该数组中。别忘了从外部函数中调用一次内部函数来启动该过程。\n\
  \n递归函数必须检查节点类型。这里我们只对节点类型 1（`Node.ELEMENT_NODE`）感兴趣。对于此类节点，我们必须遍历它们的子节点，并对每个子节点检查它是否匹配查询，同时还要对其递归调用以检查它自己的子节点。\n\
  \n#### *猫的帽子*\n\n`Math.cos` 和 `Math.sin` 以弧度为单位测量角度，一个完整的圆是 2*π*。对于给定的角度，你可以通过加上一半的圆（即\
  \ `Math.PI`）来得到相反的角度。这对于将帽子放在轨道的另一侧很有用。\n\n\n\n\n\n### 第 15 章：处理事件\n\n#### 气球\n\n\
  你需要为`\"keydown\"`事件注册一个处理函数，并查看`event.key`来判断按下的是上箭头键还是下箭头键。\n\n当前大小可以保存在一个绑定中，以便你可以基于它来设置新大小。定义一个更新大小的函数会很有帮助——该函数同时更新绑定和\
  \ DOM 中气球的样式——这样你就可以从事件处理函数中调用它，也可以在启动时调用一次来设置初始大小。\n\n你可以通过将文本节点替换为另一个节点（使用`replaceChild`）或将其父节点的`textContent`属性设置为新字符串，将气球变为爆炸效果。\n\
  \n#### 鼠标轨迹\n\n创建元素最好使用循环。将它们附加到文档中以使其显示。为了以后能够访问它们来改变位置，你需要将这些元素存储在一个数组中。\n\n可以通过维护一个计数器变量，并在每次`\"\
  mousemove\"`事件触发时将其加 1 来实现循环遍历。然后使用取余运算符（`% elements.length`）来获取有效的数组索引，从而在给定事件中选择要定位的元素。\n\
  \n另一种有趣的效果可以通过模拟一个简单的物理系统来实现。仅使用`\"mousemove\"`事件来更新一对跟踪鼠标位置的绑定。然后使用`requestAnimationFrame`来模拟尾部元素被鼠标指针位置吸引的效果。在每个动画步骤中，根据它们相对于指针的位置（以及可选的每个元素存储的速度）来更新它们的位置。如何找到一个好的方法来实现这一点取决于你。\n\
  \n#### 标签页\n\n你可能遇到的一个陷阱是，你不能直接使用节点的`childNodes`属性作为标签节点的集合。首先，当你添加按钮时，它们也会成为子节点并出现在这个对象中，因为它是一个实时的数据结构。其次，节点之间空白符创建的文本节点也在`childNodes`中，但不应拥有自己的标签页。你可以使用`children`代替`childNodes`来忽略文本节点。\n\
  \n你可以先构建一个标签页数组，以便轻松访问它们。为了实现按钮的样式，你可以存储包含标签面板及其按钮的对象。\n\n我建议编写一个单独的函数来切换标签页。你可以存储之前选中的标签页，并仅更改隐藏它和显示新标签页所需的样式，或者每次选中新标签页时更新所有标签页的样式。\n\
  \n你可能希望立即调用此函数，以使界面在启动时显示第一个标签页。\n\n### 第 16 章：项目：一个平台游戏\n\n#### 暂停游戏\n\n可以通过从传递给`runAnimation`的函数中返回`false`来中断动画。可以通过再次调用`runAnimation`来继续动画。\n\
  \n因此，我们需要将暂停游戏的事实传达给传递给`runAnimation`的函数。为此，你可以使用一个事件处理函数和该函数都能访问的绑定。\n\n当取消注册由`trackKeys`注册的处理函数时，请记住，必须将传递给`addEventListener`的*完全相同*的函数值传递给`removeEventListener`才能成功移除处理函数。因此，在`trackKeys`中创建的处理函数值必须对取消注册处理函数的代码可用。\n\
  \n你可以向`trackKeys`返回的对象添加一个属性，该属性包含该函数值或直接处理取消注册的方法。\n\n#### 怪物\n\n如果你想实现一种有状态的运动类型，例如弹跳，请确保将必要的状态存储在\
  \ actor 对象中——将其作为构造函数参数包含，并作为属性添加。\n\n请记住，`update`返回一个*新*对象，而不是更改旧对象。\n\n处理碰撞时，在`state.actors`中找到玩家，并将其位置与怪物的位置进行比较。要获取玩家的*底部*，你需要将其垂直大小加到其垂直位置上。根据玩家的位置，更新后的状态的创建将类似于`Coin`的`collide`方法（移除\
  \ actor）或`Lava`的方法（将状态更改为`\"lost\"`）。\n\n### 第 17 章：在画布上绘图\n\n#### 形状\n\n梯形（1）最容易使用路径绘制。选择合适的中心坐标，并在中心周围添加四个角。\n\
  \n菱形（2）可以直接用路径绘制，也可以用`rotate`变换以有趣的方式绘制。要使用旋转，你必须应用一个类似于我们在`flipHorizontally`函数中所做的技巧。因为你希望围绕矩形的中心旋转，而不是围绕点(0,0)，所以你必须先`translate`到那里，然后`rotate`，最后再`translate`回来。\n\
  \n确保在绘制任何创建变换的形状后重置变换。\n\n对于锯齿线（3），为每个线段编写一个新的`lineTo`调用变得不切实际。相反，你应该使用循环。你可以让每次迭代绘制两个线段（向右然后向左）或一个线段，在这种情况下，你必须使用循环索引的奇偶性（`%\
  \ 2`）来决定向左还是向右。\n\n螺旋线（4）也需要一个循环。如果你绘制一系列点，每个点沿着围绕螺旋中心的圆移动得更远，你会得到一个圆。如果在循环过程中，你改变当前点所在圆的半径，并绕行多次，结果就是螺旋线。\n\
  \n图中所示的星形（5）由`quadraticCurveTo`线条构成。你也可以用直线绘制。将一个圆分成八份，得到一个八角的星形，或者任意你想要的份数。在这些点之间画线，使它们向星形中心弯曲。使用`quadraticCurveTo`，你可以将中心作为控制点。\n\
  \n#### 饼图\n\n你需要调用`fillText`并设置上下文的`textAlign`和`textBaseline`属性，以使文本出现在你想要的位置。\n\
  \n一种合理的标签定位方式是将文本放在从饼图中心穿过扇形中点的线上。你不希望将文本直接放在饼图边缘，而是将文本向外移动一定像素数。\n\n这条线的角度是`currentAngle\
  \ + 0.5 * sliceAngle`。以下代码找到这条线上距离中心 120 像素的位置：\n\n```\nlet middleAngle = currentAngle\
  \ + 0.5 * sliceAngle;\nlet textX = Math.cos(middleAngle) * 120 + centerX;\nlet textY\
  \ = Math.sin(middleAngle) * 120 + centerY;\n```\n\n对于`textBaseline`，使用这种方法时，值`\"\
  middle\"`可能比较合适。`textAlign`使用什么取决于我们在圆的哪一侧。在左侧，应该是`\"right\"`，在右侧，应该是`\"left\"`，这样文本就会远离饼图。\n\
  \n如果你不确定如何判断给定角度在圆的哪一侧，请参阅第 240 页“定位与动画”中对`Math.cos`的解释。一个角度的余弦告诉我们它对应的 x 坐标，这反过来又告诉我们它正好在圆的哪一侧。\n\
  \n#### 弹跳的球\n\n使用`strokeRect`很容易绘制一个盒子。定义一个绑定来保存其大小，或者如果盒子的宽度和高度不同，则定义两个绑定。要创建一个圆球，启动一个路径并调用`arc(x,\
  \ y, radius, 0, 7)`，这将创建一个从零到超过整个圆的弧。然后填充路径。\n\n\n\n\n\n要模拟球的位置和速度，你可以使用第 269 页“角色”中的`Vec`类。给它一个初始速度，最好不是纯垂直或水平的，然后每帧将该速度乘以经过的时间。当球离垂直墙壁太近时，反转其速度的\
  \ x 分量。同样，当它碰到水平墙壁时，反转 y 分量。\n\n找到球的新位置和速度后，使用`clearRect`清除场景，并用新位置重新绘制。\n\n####\
  \ *预计算镜像*\n\n解决方案的关键在于，使用`drawImage`时，我们可以将 canvas 元素作为源图像。可以创建一个额外的`<canvas>`元素，而不将其添加到文档中，并一次性将反转后的精灵绘制到该元素上。在绘制实际帧时，只需将已反转的精灵复制到主\
  \ canvas 上。\n\n需要注意，图像不会立即加载。我们只执行一次反转绘制，如果在图像加载前进行，则不会绘制任何内容。可以使用图像上的`\"load\"\
  `处理程序将反转后的图像绘制到额外的 canvas 上。该 canvas 可以立即用作绘制源（在我们将角色绘制到其上之前，它只是空白的）。\n\n### 第 18\
  \ 章：HTTP 与表单\n\n#### *内容协商*\n\n将你的代码基于第 315 页“Fetch”中的`fetch`示例。\n\n请求一个虚假的媒体类型将返回状态码\
  \ 406“不可接受”，这是服务器在无法满足`Accept`头时应返回的代码。\n\n#### *JavaScript 工作台*\n\n使用`document.querySelector`或`document.getElementById`获取\
  \ HTML 中定义的元素。按钮上的`\"click\"`或`\"mousedown\"`事件的事件处理程序可以获取文本字段的`value`属性，并对其调用`Function`。\n\
  \n确保将对`Function`的调用及其结果的调用都包裹在`try`块中，以便捕获它产生的异常。在这种情况下，我们实际上不知道要捕获哪种类型的异常，因此捕获所有异常。\n\
  \n输出元素的`textContent`属性可用于填充字符串消息。或者，如果你想保留旧内容，可以使用`document.createTextNode`创建一个新的文本节点，并将其追加到元素中。记得在末尾添加换行符，这样所有输出就不会出现在同一行。\n\
  \n#### *康威生命游戏*\n\n为了解决变化在概念上同时发生的问题，尝试将一代的计算视为一个纯函数，该函数接受一个网格并生成代表下一轮的新网格。\n\n\
  矩阵的表示可以采用第 107 页“迭代器接口”中所示的方式。你可以使用两个嵌套循环来统计活邻居的数量，在两个维度上循环相邻坐标。注意不要统计场外的单元格，并忽略我们正在统计邻居的中心单元格。\n\
  \n确保对复选框的更改在下一代生效可以通过两种方式实现。事件处理程序可以注意到这些更改并更新当前网格以反映它们，或者你可以在计算下一轮之前从复选框的值生成一个新网格。\n\
  \n如果选择使用事件处理程序，你可能希望附加标识每个复选框对应位置的属性，以便轻松找出要更改的单元格。\n\n要绘制复选框网格，你可以使用`<table>`元素（参见第\
  \ 243 页“构建表格”），或者简单地将它们全部放在同一个元素中，并在行之间放置`<br>`（换行）元素。\n\n### 第 19 章：项目：像素艺术编辑器\n\
  \n#### *键盘绑定*\n\n对于字母键，如果未按住`SHIFT`，事件的`key`属性将是小写字母本身。我们这里对带有`SHIFT`的按键事件不感兴趣。\n\
  \n`\"keydown\"`处理程序可以检查其事件对象，看是否匹配任何快捷键。你可以自动从工具对象中获取首字母列表，这样就不必手动写出它们。\n\n当按键事件匹配快捷键时，对其调用`preventDefault`并调度相应的操作。\n\
  \n#### *高效绘制*\n\n这个练习是展示不可变数据结构如何使代码*更快*的好例子。因为我们同时拥有旧图片和新图片，所以可以比较它们，只重新绘制颜色发生变化的像素，在大多数情况下可以节省超过\
  \ 99%的绘制工作。\n\n你可以编写一个新函数`updatePicture`，或者让`drawPicture`接受一个额外参数，该参数可以是`undefined`或之前的图片。对于每个像素，函数检查是否传入了之前图片且该位置颜色相同，如果是则跳过该像素。\n\
  \n由于改变 canvas 大小会清除它，因此当旧图片和新图片大小相同时，应避免修改其`width`和`height`属性。如果它们不同（例如加载了新图片时），你可以在更改\
  \ canvas 大小后将保存旧图片的绑定设置为`null`，因为更改 canvas 大小后不应跳过任何像素。\n\n#### *圆形*\n\n你可以从矩形工具中汲取一些灵感。与该工具类似，当指针移动时，你希望继续在*起始*图片上绘制，而不是当前图片。\n\
  \n要确定哪些像素需要着色，可以使用勾股定理。首先通过计算 x 坐标差值的平方（`Math.pow(x, 2)`）与 y 坐标差值的平方之和的平方根（`Math.sqrt`）来求出当前指针位置与起始位置之间的距离。然后围绕起始位置循环一个正方形区域内的像素，该正方形的边长至少为半径的两倍，并使用勾股公式计算它们与中心的距离，对位于圆半径内的像素进行着色。\n\
  \n确保不要尝试对图片边界之外的像素进行着色。\n\n#### *正确的线条*\n\n绘制像素化线条的问题在于，它实际上是四个相似但略有不同的问题。从左到右绘制水平线很容易——你循环遍历\
  \ x 坐标，每一步都着色一个像素。如果线条有轻微斜率（小于 45 度或¼*π*弧度），你可以沿斜率插值 y 坐标。每个`x`位置仍然需要一个像素，这些像素的`y`位置由斜率决定。\n\
  \n但是，一旦斜率超过 45 度，就需要切换处理坐标的方式。现在每个`y`位置需要一个像素，因为线条向上移动多于向左移动。然后，当超过 135 度时，必须回到循环遍历\
  \ x 坐标，但从右到左。\n\n实际上不必编写四个循环。由于从`A`到`B`画线与从`B`到`A`画线相同，因此对于从右到左的线条，可以交换起始和结束位置，并将其视为从左到右。\n\
  \n因此你需要两个不同的循环。线条绘制函数首先要做的是检查 x 坐标之差是否大于 y 坐标之差。如果是，则为水平方向线条，否则为垂直方向线条。\n\n确保比较的是`x`和`y`差值的*绝对值*，可以使用`Math.abs`获取。\n\
  \n一旦知道将沿哪个轴循环，就可以检查起始点在该轴上的坐标是否高于终点，如果是则交换它们。在 JavaScript 中，一种简洁的交换两个绑定值的方法是使用解构赋值，如下所示：\n\
  \n```\n[start, end] = [end, start];\n```\n\n\n\n\n然后你可以计算直线的斜率，它决定了沿着主轴每移动一步时，另一轴坐标的变化量。有了这个，你可以沿着主轴运行一个循环，同时跟踪另一轴上的对应位置，并在每次迭代中绘制像素。确保对非主轴坐标进行四舍五入，因为它们很可能是小数，而`draw`方法对小数坐标处理不佳。\n\
  \n### 第 20 章：Node.js\n\n#### *搜索工具*\n\n你的第一个命令行参数，即正则表达式，可以在`process.argv[2]`中找到。输入文件紧随其后。你可以使用`RegExp`构造函数将字符串转换为正则表达式对象。\n\
  \n使用`readFileSync`同步执行更直接，但如果你再次使用`fs.promises`来获取返回 promise 的函数并编写`async`函数，代码看起来类似。\n\
  \n要判断某个路径是否为目录，你可以再次使用`stat`（或`statSync`）以及`stats`对象的`isDirectory`方法。\n\n探索目录是一个分支过程。你可以通过递归函数或维护一个工作数组（仍需探索的文件）来实现。要查找目录中的文件，可以调用`readdir`或`readdirSync`。这种奇怪的大小写——Node\
  \ 的文件系统函数命名松散地基于标准 Unix 函数，如全小写的`readdir`，然后添加了大写字母开头的`Sync`。\n\n要从`readdir`读取的文件名得到完整路径，你需要将其与目录名组合，并在它们之间加上斜杠字符（`/`）。\n\
  \n#### *目录创建*\n\n你可以将实现`DELETE`方法的函数作为`MKCOL`方法的蓝图。当未找到文件时，尝试使用`mkdir`创建目录。当该路径下已存在目录时，可以返回`204`响应，使目录创建请求具有幂等性。如果存在非目录文件，则返回错误码。代码`400`（“错误请求”）是合适的。\n\
  \n#### *网络公共空间*\n\n你可以创建一个`<textarea>`元素来保存正在编辑的文件内容。使用`fetch`发送`GET`请求可以检索文件的当前内容。你可以使用相对\
  \ URL，如`index.html`，而不是`http://localhost:8000/index.html`，来引用与运行脚本同一服务器上的文件。\n\n\
  然后，当用户点击按钮（你可以使用`<form>`元素和`\"submit\"`事件）时，向同一 URL 发送`PUT`请求，将`<textarea>`的内容作为请求体，以保存文件。\n\
  \n接着，你可以添加一个`<select>`元素，通过添加包含`GET`请求到 URL `/` 返回的行的`<option>`元素，来包含服务器顶层目录中的所有文件。当用户选择另一个文件（字段上的`\"\
  change\"`事件）时，脚本必须获取并显示该文件。保存文件时，使用当前选中的文件名。\n\n### 第 21 章：项目：技能分享网站\n\n#### *磁盘持久化*\n\
  \n我能想到的最简单的解决方案是将整个`talks`对象编码为 JSON，并使用`writeFile`将其转储到文件中。服务器数据每次变化时都会调用一个方法（`updated`）。可以扩展该方法，将新数据写入磁盘。\n\
  \n选择一个文件名，例如`./talks.json`。当服务器启动时，它可以尝试使用`readFile`读取该文件，如果成功，服务器可以将文件内容作为初始数据使用。\n\
  \n但要注意。`talks`对象最初是一个无原型的对象，以便可靠地使用`in`运算符。`JSON.parse`将返回以`Object.prototype`为原型的普通对象。如果你使用\
  \ JSON 作为文件格式，则必须将`JSON.parse`返回的对象的属性复制到一个新的无原型对象中。\n\n#### *评论字段重置*\n\n最好的方法可能是将演讲制作成组件对象，并带有`syncState`方法，以便它们可以更新以显示演讲的修改版本。在正常操作中，演讲唯一可能的变化是添加更多评论，因此`syncState`方法可以相对简单。\n\
  \n困难的部分在于，当收到更改后的演讲列表时，我们必须将现有的 DOM 组件列表与新列表中的演讲进行协调——删除其演讲已被删除的组件，并更新其演讲已更改的组件。\n\
  \n为此，保留一个数据结构，将演讲组件存储在演讲标题下可能会有所帮助，这样你可以轻松判断某个演讲是否存在对应的组件。然后你可以遍历新的演讲数组，对每个演讲，要么同步现有组件，要么创建新组件。要删除已删除演讲的组件，你还必须遍历组件并检查相应的演讲是否仍然存在。\n\
  \n### 第 22 章：JavaScript 与性能\n\n#### *寻路*\n\n工作列表可以是一个数组，你可以使用`push`方法向其中添加路径。如果你使用数组来表示路径，可以使用`concat`方法扩展它们，例如`path.concat([node])`，这样旧值保持不变。\n\
  \n要判断一个节点是否已被访问，你可以遍历现有工作列表或使用`some`方法。\n\n#### *优化*\n\n宏优化的主要机会是消除判断节点是否已被查看的内层循环。在地图中查找比遍历工作列表搜索节点快得多。由于我们的键是节点对象，我们必须使用`Set`或`Map`实例，而不是普通对象，来存储已到达节点的集合。\n\
  \n另一个改进可以通过改变路径的存储方式来实现。在不修改现有数组的情况下向数组添加新元素需要复制整个数组。像第 4 章中的*列表*这样的数据结构没有这个问题——它允许列表的多次扩展共享它们共同拥有的数据。\n\
  \n你可以让你的函数内部将路径存储为具有`at`和`via`属性的对象，其中`at`是路径中的最后一个节点，`via`是`null`或另一个包含路径其余部分的此类对象。这样，扩展路径只需要创建一个具有两个属性的对象，而不是复制整个数组。确保在返回之前将列表转换为实际数组。\n\
