  \n[WWW.NOSTARCH.COM](http://WWW.NOSTARCH.COM)\n\n## 掌握网络语言\n\nJavaScript 几乎是所有现代网络应用的核心，从\
  \ Twitter 这样的社交应用到基于浏览器的游戏框架。虽然初学者容易上手，但 JavaScript 是一种灵活、复杂的语言，可用于构建全尺寸应用。\n\n\
  这本 ***Eloquent JavaScript*** 的第三版深入探讨了 JavaScript 语言，教你如何编写优美、高效的代码。更新内容包括关于类表示法、箭头函数、迭代器、异步函数、模板字符串和块作用域的全新材料。\n\
  \n哈弗贝克从一开始就让你沉浸在代码中，并通过大量示例进行教学，同时练习和整章项目让你亲手编写自己的程序。首先，你将学习 JavaScript 语言的基本结构，以及控制结构、函数和数据结构。然后，你将学习错误处理与调试、模块化和异步编程，接着进入浏览器编程。在构建诸如浏览器游戏、简单编程语言和绘图程序等项目时，你将学会如何：\n\
  \n![Image](img/com.jpg) 理解编程的基本要素，包括语法、控制和数据\n\n![Image](img/com.jpg) 通过面向对象和函数式编程技术组织并清晰化代码\n\
  \n![Image](img/com.jpg) 编写脚本控制浏览器，制作基本的网络应用\n\n![Image](img/com.jpg) 有效使用 DOM 与浏览器交互\n\
  \n![Image](img/com.jpg) 利用 Node.js 构建服务器和工具\n\n是时候让你流利掌握网络语言了吗？\n\n## 关于作者\n\nMarijn\
