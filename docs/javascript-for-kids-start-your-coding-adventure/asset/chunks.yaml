- fmt: "\n![](cover.jpeg)\n\nJavaScript for Kids\n\nStart Your Coding Adventure\n\n\
    Abdelfattah Ragab\n\n# Introduction\n\nWelcome to the book “JavaScript for Kids:\
    \ Start your Coding Adventure”.\n\nThis book is your introduction to the world\
    \ of JavaScript. It's your first step towards developing websites and mobile applications.\
    \ With JavaScript, you can turn your ideas into reality. Learning should be fun,\
    \ so you will feel like you are reading a story.\n\nBy the end of this book, you\
    \ will have a good understanding of JavaScript. You will have taken the first\
    \ steps in your modern web programming adventure.\n\nHave fun programming!\n\n\
    # Move forward\n\nWhen you start a new topic, you should explore it broadly and\
    \ focus on moving forward without getting lost in the details. I also recommend\
    \ that you gather information on the same topic from different sources.\n\nTake\
    \ breaks from time to time, look for short answers to questions, and use different\
    \ sources to get different perspectives. Don´t worry if you still don't understand\
    \ after many attempts, just keep going because you will come across it again later.\n\
    \n# Java vs JavaScript\n\nJava and JavaScript are different programming languages\
    \ with different goals: Java is a general-purpose, object-oriented language used\
    \ for developing applications for various platforms, while JavaScript is a scripting\
    \ language used mainly for creating interactive content on websites.\n\n# What\
    \ is JavaScript?\n\nJavaScript is a programming language that is mainly used to\
    \ create interactive content on websites. It allows developers to implement features\
    \ on web pages, such as interactive forms and real-time updates, without having\
    \ to reload the page.\n\nJavaScript was primarily developed for execution by the\
    \ web browser. You are familiar with web browsers because we use them all the\
    \ time. The most popular browsers include Google Chrome, Microsoft Edge, Mozilla\
    \ Firefox, Opera and Safari.\n\nJavaScript is a programming language that mainly\
    \ exists and is executed within the web browser. This was the case for many years\
    \ before the release of `Node.js`. With `Node.js`, you can use JavaScript for\
    \ server-side programming outside the web browser. Now we use JavaScript for all\
    \ types of programming.\n\n# How do web browsers work?\n\nWhen you visit a website\
    \ in the browser, it goes to the specified `URL`, downloads the files and displays\
    \ them on the screen. Websites are made up of three types of files that together\
    \ make up the page you see online.\n\nFirst, there is the HTML code, which is\
    \ responsible for the content of the website, with no styles or programming, just\
    \ the content.\n\nLet's say we have a web page for a product on Amazon.com. The\
    \ HTML consists of the product name, price, images, description and shipping details.\n\
    \nEverything is written in plain text, line by line. And the images are displayed\
    \ one after the other, each on a separate line.\n\nImagine I give you some information\
    \ and ask you to write it down in your notebook.\n\nYou write the product name\
    \ on the first line, the price on the second line and so on.\n\nJust the information\
    \ without any design or programming.\n\n![Image](images/image18.jpeg)\n\nThat's\
    \ what HTML does: it displays the information in a semantic way. Accessibility\
    \ devices read their information from the HTML. They are mainly interested in\
    \ the information. If you use a screen reader for a blind user, it will read the\
    \ content of the page. All styles are ignored.\n\nHowever, for sighted people\
    \ who can see and interact with the website, the styles are important.\n\nFor\
    \ example, if we apply styles to a product page on Amazon, we can make the title\
    \ bigger and put the images on the left-hand side in a separate area. We can also\
    \ hide all the images and only show the first image in a carousel or slider. We\
    \ can change colors, fonts, spacing and borders, draw shapes and do all sorts\
    \ of things with CSS.\n\n![Image](images/image17.png)\n\nSo, now you know HTML\
    \ and CSS, but there's a third component: JavaScript.\n\n# What is programming?\n\
    \nProgramming is the process of creating a set of instructions that a computer\
    \ can follow to perform specific tasks.\n\n# Create a small application\n\nLet\
    \ us create a small application so that you understand what programming means.\n\
    \nThe application takes two numbers and should return the sum of the two.\n\n\
    I will create a variable called `firstNumber` and a second one called `secondNumber`.\n\
    \nYou can define the variables `x` and `y`, but professional programmers recommend\
    \ giving the variables a meaningful name that clarifies the purpose of the creation.\
    \ This is very useful when sharing your code with others so that they can easily\
    \ understand what you are trying to do.\n\n```javascript\nlet firstNumber;\nlet\
    \ secondNumber;\nreturn firstNumber + secondNumber;\n```\n\nIn JavaScript, we\
    \ use the word `let` to declare a variable. You can then refer to the variable\
    \ name to perform calculations.\n\nWe use the word `return` to return the final\
    \ result once the calculations are complete.\n\nTo be able to call this, it is\
    \ inserted into a function.\n\n```javascript\nfunction sum(firstNumber, secondNumber)\
    \ {\n  return firstNumber + secondNumber;\n}\n```\n\nYou can then call it as follows:\n\
    \n```javascript\nconst result = sum(1, 2);\nconsole.log('Result is: ', result)\n\
    ```\n\n`const` is similar to `let`, but is used for constants that will not change.\
    \ We can still use `let`, but we use `const` to save memory and prevent others\
    \ from changing it.\n\n`console.log` is used to display a message in the browser\
    \ console. You can display multiple values with commas in between like I did.\
    \ I show the statement 'Result is: ' followed by the actual result.\n\n# Try it\
    \ yourself\n\nSearch for “online javascript compiler” and choose your favorite\
    \ online JavaScript compiler.\n\nWrite the code in the online compiler and run\
    \ it.\n\n```javascript\nfunction sum(firstNumber, secondNumber) {\n  return firstNumber\
    \ + secondNumber;\n}\n\nconst result = sum(1, 2);\nconsole.log('Result is: ',\
    \ result)\n```\n\n![Image](images/image11.png)\n\n![Image](images/image7.png)\n\
    \n**Congratulations!** You have created your first JavaScript program. All that\
    \ comes next are variations of what you have done.\n\n# DOM (Document Object Model)\n\
    \nWhen a web page is loaded in a browser, the browser creates a DOM of the page,\
    \ which is essentially a tree-like structure where each node corresponds to a\
    \ part of the document, such as elements, attributes, and text.\n\n# JavaScript\
    \ and DOM\n\nJavaScript allows you to access the `dom`, so you can modify the\
    \ web page programmatically at run time.\n\nThe browser window is represented\
    \ by the `window` object, which you can access in JavaScript to get information\
    \ about things such as location and so on.\n\nThe other important object which\
    \ is available for you in JavaScript is the `document` object, which represents\
    \ the entire HTML document loaded in the browser. It provides methods to access\
    \ and manipulate the content of the document.\n\n# document.querySelector()\n\n\
    The `document.querySelector()` method is a powerful function in JavaScript that\
    \ allows you to select HTML elements using CSS selectors.\n\nThe string passed\
    \ to `querySelector()` must be a valid CSS selector. This is related to CSS, so\
    \ here are some examples on CSS selectors.\n\nLet’s say you have the following\
    \ HTML in your web page:\n\n```html\n<div id=\"myDiv\" class=\"container\">\n\
    \  <p class=\"text\">Hello, World!</p>\n</div>\n```\n\n# Select element by tag\
    \ name\n\nTo select the first paragraph:\n\n```javascript\nlet firstParagraph\
    \ = document.querySelector(\"p\");\n```\n\nThis will select the bolded paragraph\
    \ element\n\n```html\n<div id=\"myDiv\" class=\"container\">\n  <p class=\"text\"\
    >Hello, World!</p>\n</div>\n```\n\nThere is another method called `querySelectorAll`,\
    \ that you can use if you want to select all the paragraphs in the document.\n\
    \n# Select element by id\n\nTo select the element with the id `myDiv`:\n\n```javascript\n\
    let myDivElement = document.querySelector(\"#myDiv\");\n```\n\nNote the `#` in\
    \ front of the id.\n\nThis will select the bolded div element.\n\n```html\n<div\
    \ id=\"myDiv\" class=\"container\">\n  <p class=\"text\">Hello, World!</p>\n</div>\n\
    ```\n\n# Select element by class name\n\nTo select the element with the class\
    \ `container`:\n\n```javascript\nlet myDivElement = document.querySelector(\"\
    .container\");\n```\n"
