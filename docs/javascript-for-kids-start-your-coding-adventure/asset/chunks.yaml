  trans: "\n\n![](img/cover.jpeg)\n\n少儿 JavaScript\n\n开启你的编程冒险\n\nAbdelfattah Ragab\n\
    \n# 引言\n\n欢迎阅读《少儿 JavaScript：开启你的编程冒险》。\n\n这本书将带你进入 JavaScript 的世界。它是迈向开发网站和移动应用程序的第一步。通过\
    \ JavaScript，你可以将你的想法变为现实。学习应该是乐趣的，所以你会觉得像在读一个故事一样。\n\n读完这本书，你将对 JavaScript 有了良好的理解。你已经在现代网页编程的冒险中迈出了第一步。\n\
    \n祝编程愉快！\n\n# 向前进\n\n当你开始学习新主题时，应该对其进行广泛探索，并专注于前进，而不是迷失在细节中。我建议你从不同的来源收集关于同一主题的信息。\n\
    \n时不时休息，寻找问题的简短答案，并使用不同的来源获取不同的观点。如果尝试多次后仍然不理解也不要担心，继续坚持，因为你以后会再次遇到它。\n\n# Java\
    \ vs JavaScript\n\nJava 和 JavaScript 是不同的编程语言，目标也不同：Java 是一种通用面向对象的语言，用于开发各种平台的应用程序；而\
    \ JavaScript 是一种脚本语言，主要用于在网站上创建交互式内容。\n\n# 什么是 JavaScript？\n\nJavaScript 是一种主要用于在网站上创建交互式内容的编程语言。它允许开发者在网页上实现功能，如交互式表单和实时更新，而无需重新加载页面。\n\
    \nJavaScript 最初主要是为了浏览器执行而开发的。你对浏览器熟悉，因为我们一直在使用它们。最流行的浏览器包括 Google Chrome、Microsoft\
    \ Edge、Mozilla Firefox、Opera 和 Safari。\n\nJavaScript 是一种主要存在并运行在网页浏览器中的编程语言。在\
    \ `Node.js` 发布之前情况一直是如此。有了 `Node.js`，你可以在浏览器之外使用 JavaScript 进行服务器端编程。现在我们使用 JavaScript\
    \ 进行所有类型的编程。\n\n# 网页浏览器是如何工作的？\n\n当你在浏览器中访问网站时，它会访问指定的 `URL`，下载文件并将它们显示在屏幕上。网站由三类型的文件组成，共同构成了你在网上看到的页面。\n\
    \n首先是 HTML 代码，它负责网站的内容，没有样式或编程，只有内容。\n\n假设我们在 Amazon.com 上有一个产品产品页。HTML 包含了产品名称、价格、图片、描述和运费详情。\n\
    \n所有内容都以纯文本形式逐行编写。图像一个接一个地显示，每个图像单独占一行。\n\n想象我给了你一些信息，并让你把它写在笔记本上。\n\n你在第一行写下产品名称，第二行写下价格，以此此类推。\n\
    \n只有信息，没有任何设计或编程。\n\n![Image](img/image18.jpeg)\n\n这正是 HTML 的作用：它以语义化的方式显示信息。无障碍设备从\
    \ HTML 中读取信息。它们主要对信息感兴趣。如果你为盲障用户使用屏幕阅读器，它会读取页面的内容。所有的样式都会被忽略。\n\n然而，对于可以看到网站并与网站交互的视力人士来说，样式是重要的。\n\
    \n例如，如果我们对 Amazon 的产品页应用样式，我们可以让标题变大，并将图片放在左侧的独立区域。我们还可以隐藏所有图片，只在轮播图或滑块中显示第一张图片。我们可以使用\
    \ CSS 颜色、字体、间距和边框，绘制形状并进行各种事情。\n\n![Image](img/image17.png)\n\n所以，现在你了解了 HTML\
    \ 和 CSS，但还有第三个组件：JavaScript。\n\n# 什么是编程？\n\n编程是创建一组计算机可以遵循以执行特定任务指令的过程。\n\n# 创建一个小型应用程序\n\
    \n让我们创建一个小型应用程序，以便你理解编程的含义。\n\n该应用程序接收两个数字并应该返回这两个数字之和。\n\n我将创建一个名为 `firstNumber`\
    \ 的变量和第二个名为 `secondNumber` 的变量。\n\n你可以定义变量 `x` 和 `y`，但专业程序员建议给变量起有意义的名称，以明确创建的目的。当你与他人分享代码时，这非常有用，让他们能够轻松理解你正在尝试做什么。\n\
    \n```javascript\nlet firstNumber;\nlet secondNumber;\nreturn firstNumber + secondNumber;\n\
    ```\n\n在 JavaScript 中，我们使用单词 `let` 来声明变量。然后你可以引用变量名来执行计算。\n\n我们使用单词 `return` 在计算完成后返回最终结果。\n\
    \n为了能够调用它，我们将其插入到函数函数中。\n\n```javascript\nfunction sum(firstNumber, secondNumber)\
    \ {\n  return firstNumber + secondNumber;\n}\n```\n\n然后你可以这样调用它：\n\n```javascript\n\
    const result = sum(1, 2);\nconsole.log('Result is: ', result)\n```\n\n`const`\
    \ 与 `let` 类似，但用于不会改变的常量。我们仍然可以使用 `let`，但我们使用 `const` 来节省内存并防止他人更改它。\n\n`console.log`\
    \ 用于在浏览器控制台中显示消息。你可以像我做的那样用逗号分隔多个值。我显示了字符串 'Result is: '，后面跟着实际结果。\n\n# 亲自尝试一下\n\
    \n搜索“online javascript compiler”并选择你最喜欢的在线 JavaScript 编译器。\n\n在在线编译器中编写代码并运行。\n\
    \n```javascript\nfunction sum(firstNumber, secondNumber) {\n  return firstNumber\
    \ + secondNumber;\n}\n\nconst result = sum(1, 2);\nconsole.log('Result is: ',\
    \ result)\n```\n\n![Image](img/image11.png)\n\n![Image](img/image7.png)\n\n**恭喜你！**\
    \ 你创建了自己的第一个 JavaScript 程序。接下来的所有的都是你所做内容的变体。\n\n# DOM (文档对象模型)\n\n当网页在浏览器中加载时，浏览器会创建页面的\
    \ DOM，这本质上是一个树形结构，其中每个节点对应文档的一部分，例如元素、属性和文本。\n\n# JavaScript 和 DOM\n\nJavaScript\
    \ 允许你访问 `dom`，因此你可以在运行时通过程序化修改网页。\n\n浏览器窗口由 `window` 对象表示，你可以在 JavaScript 中访问它以获取有关位置等信息。\n\
    \n在 JavaScript 中可供使用的另一个重要对象是 `document` 对象，它代表在浏览器中加载的整个 HTML 文档。它提供了访问和操作文档内容的方法。\n\
    \n# document.querySelector()\n\n`document.querySelector()` 方法是 JavaScript 中一个强大的函数，允许你使用\
    \ CSS 选择器选择 HTML 元素。\n\n传递给 `querySelector()` 的字符串必须是有效的 CSS 选择器。这与 CSS 有关，所以这里有一些\
    \ CSS 选择器的示例。\n\n假设你的网页中有以下 HTML：\n\n```html\n<div id=\"myDiv\" class=\"container\"\
    >\n  <p class=\"text\">Hello, World!</p>\n</div>\n```\n\n# 按标签名选择元素\n\n要选择第一个段落：\n\
    \n```javascript\nlet firstParagraph = document.querySelector(\"p\");\n```\n\n\
    这将选择加粗的段落元素\n\n```html\n<div id=\"myDiv\" class=\"container\">\n  <p class=\"\
    text\">Hello, World!</p>\n</div>\n```\n\n还有一种名为 `querySelectorAll` 的方法，如果你想选择文档中的所有段落，可以使用它。\n\
    \n# 按 id 选择元素\n\n要选择 id 为 `myDiv` 的元素：\n\n```javascript\nlet myDivElement = document.querySelector(\"\
    #myDiv\");\n```\n\n注意 id 前面的 `#`。\n\n这将选择加粗的 div 元素。\n\n```html\n<div id=\"myDiv\"\
    \ class=\"container\">\n  <p class=\"text\">Hello, World!</p>\n</div>\n```\n\n\
    # 按类名选择元素\n\n要选择类名为 `container` 的元素：\n\n```javascript\nlet myDivElement = document.querySelector(\"\
    .container\");\n```\n"
