    # Primitive types vs Reference types


    We categorize data types into two main groups: primitive types and reference types.


    **Primitive types** are the most basic data types and represent single values.


    **Reference types** are more complex data types that can hold collections of values.


    # Primitive types


    **Number:** Represents both integer and floating-point numbers


    let num = 42;


    **String:** Represents a sequence of characters.


    let str = "Hello, World!";


    **Boolean:** Represents a logical entity and can be either true or false.


    let isActive = true;


    # Reference types


    Reference types are more complex data structures that can hold collections of
    values.


    **Object:** An object is a collection of key-value pairs that can store multiple
    values of different types and are used to represent real-world entities.


    let person = {


    name: "Alice",


    age: 30,


    isActive: true


    };


    **Array:** An array is a special type of object that is used to store ordered
    collections of values. Arrays can hold elements of any type, including other arrays
    or objects.


    let colors = ["red", "green", "blue"];


    # Default value


    When you declare a variable it will have the value undefined by default.


    # Operators


    Operators are special symbols that perform operations on one or more values or
    variables. They are fundamental to programming as they allow developers to perform
    calculations and control the flow of the program.


    Arithmetic Operators:


    Arithmetic operators are used to perform mathematical calculations.


    ● + : Addition.● - : Subtraction.● * : Multiplication.● / : Division.


    Comparison Operators:


    Comparison operators are used to compare two values and return a Boolean result
    (true or false).


    ● == : Equal● != : Not Equal● > : Greater Than● < : Less Than


    # Conditional Statements


    Conditional statements control the flow of execution in your code based on specific
    conditions. They allow you to execute different blocks of code depending on whether
    a condition evaluates to true or false.


    let score = 80;


    if (score > 60) {


    console.log("You passed!");


    } else {


    console.log("You failed.");


    }


    The if statement executes a block of code if the specified condition is true.


    The else statement executes when the condition is false.


    # Ternary Operator


    The ternary operator is a shorthand for the if...else statement.


    condition **?** expression If True **:** expression If False;


    let score = 80;


    const result = score > 60 **?** "You passed!" **:** "You failed.";


    console.log(result);


    // Outputs: You passed!


    # Loops


    Loops allow you to execute a block of code repeatedly based on a specified condition.


    for (let i = 0; i < 5; i++) {


    console.log(i);


    }


    // Outputs: 0, 1, 2, 3, 4


    You can write loops using the while loop


    let count = 0;


    while (count < 5) {


    console.log(count);


    count++;


    }


    // Outputs: 0, 1, 2, 3, 4


    # Events


    Events are notifications that something has happened in the system. When an event
    occurs, it can trigger a specific reaction in your JavaScript code. For example,
    when a user clicks a button, an event is triggered and you can write code that
    executes in response to that click.


    There are many types of events for the mouse (e.g. click), for the keyboard (e.g.
    key press), for the window (e.g. resize) and many more.


    For example, we have the HTML button with the ID myButton:


    <button id=”myButton”>Click Me</button>


    We can attach an event handler to the click action using JavaScript as follows:


    const myButtonElement = document.querySelector(''#myButton'');


    myButtonElement.addEventListener(''click'',() => {


    console.log(''Button clicked!'');


    });


    # Arrow functions


    Arrow functions are a concise way to write function expressions in JavaScript,
    introduced in ES6. They provide a more streamlined syntax compared to traditional
    function expressions.


    Old way:


    function sum(firstNumber, secondNumber) {


    return firstNumber + secondNumber;


    }


    Arrow function:


    const sum = (firstNumber, secondNumber) => {


    return firstNumber + secondNumber;


    }


    They are particularly useful for writing cleaner code when dealing with callbacks.


