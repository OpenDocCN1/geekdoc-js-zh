    # What to do Next?


    The aim of this book is to make it easier for you to get started with JavaScript.
    I have given you an overview of everything, but there are more details you will
    learn as you continue to work with JavaScript. Try to familiarise yourself with
    HTML and CSS and keep practicing JavaScript.


    Do not try to create real applications using only JavaScript, because that will
    cost you a lot of time.


    Once you are confident with JavaScript and ready to build a real application,
    you should learn new JavaScript frameworks. I am talking about Angular, React
    and Vue.


    They all do the same thing, building client-side applications. In web development,
    there are two types of applications, server-side applications and client-side
    applications. The server-side applications are responsible for the business logic,
    security, database communication and so on, while the client-side applications
    are responsible for the user interface.


    They collect the user''s input, send it to the backend server and display the
    results to the end user as soon as they are returned by the backend server. They
    do not perform sensitive operations such as security, business logic or communication
    with the database.


    There are many programming languages for creating backend applications such as
    C#, Java, PHP, Node.JS (JavaScript), Python, etc.


    For the frontend, it is mainly JavaScript and TypeScript with frameworks such
    as Angular, React and Vue.


    Mobile applications are another type of application that are more similar to client-side
    applications and also connect to the backend server.


    Most backend servers today are built on the principle of REST APIs. The server
    provides endpoints that the client can use to send and receive data.


    You will learn everything over time, don’t worry.


    It may take you several attempts to understand a topic, so just keep going, because
    you will come across these topics again and again.


    Over time, you will build up your understanding of the subject and approach things
    professionally.


    Good luck with your learning and I will see you again on another topic!


    — Abdelfattah Ragab


    # Conclusion


    **Congratulations!** You have read the book "JavaScript for Kids: Start Your Coding
    Adventure". Now you have a good understanding of JavaScript. Remember that learning
    JavaScript is an ongoing process. Practice makes perfect — build your own projects,
    experiment with the features you have learned, and delve into the extensive online
    resources.


    Thank you for joining me in my exploration of JavaScript. I wish you the best
    of luck on your programming journey. Have fun programming and good luck with your
    applications!


