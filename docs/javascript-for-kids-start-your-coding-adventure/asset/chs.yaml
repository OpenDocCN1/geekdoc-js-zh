- "# 少儿 JavaScript：开启你的编程冒险\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n## 引言\n\n欢迎阅读《少儿 JavaScript：开启你的编程冒险》。\n\
  \n这本书将带你进入 JavaScript 的世界。它是迈向开发网站和移动应用程序的第一步。通过 JavaScript，你可以将你的想法变为现实。学习应该是乐趣的，所以你会觉得像在读一个故事一样。\n\
  \n读完这本书，你将对 JavaScript 有了良好的理解。你已经在现代网页编程的冒险中迈出了第一步。\n\n祝编程愉快！\n\n## 向前进\n\n当你开始学习新主题时，应该对其进行广泛探索，并专注于前进，而不是迷失在细节中。我建议你从不同的来源收集关于同一主题的信息。\n\
  \n时不时休息，寻找问题的简短答案，并使用不同的来源获取不同的观点。如果尝试多次后仍然不理解也不要担心，继续坚持，因为你以后会再次遇到它。\n\n## Java\
  \ vs JavaScript\n\nJava 和 JavaScript 是不同的编程语言，目标也不同：Java 是一种通用面向对象的语言，用于开发各种平台的应用程序；而\
  \ JavaScript 是一种脚本语言，主要用于在网站上创建交互式内容。\n\n## 什么是 JavaScript？\n\nJavaScript 是一种主要用于在网站上创建交互式内容的编程语言。它允许开发者在网页上实现功能，如交互式表单和实时更新，而无需重新加载页面。\n\
  \nJavaScript 最初主要是为了浏览器执行而开发的。你对浏览器熟悉，因为我们一直在使用它们。最流行的浏览器包括 Google Chrome、Microsoft\
  \ Edge、Mozilla Firefox、Opera 和 Safari。\n\nJavaScript 是一种主要存在并运行在网页浏览器中的编程语言。在 `Node.js`\
  \ 发布之前情况一直是如此。有了 `Node.js`，你可以在浏览器之外使用 JavaScript 进行服务器端编程。现在我们使用 JavaScript 进行所有类型的编程。\n\
  \n## 网页浏览器是如何工作的？\n\n当你在浏览器中访问网站时，它会访问指定的 `URL`，下载文件并将它们显示在屏幕上。网站由三类型的文件组成，共同构成了你在网上看到的页面。\n\
  \n首先是 HTML 代码，它负责网站的内容，没有样式或编程，只有内容。\n\n假设我们在 Amazon.com 上有一个产品产品页。HTML 包含了产品名称、价格、图片、描述和运费详情。\n\
  \n所有内容都以纯文本形式逐行编写。图像一个接一个地显示，每个图像单独占一行。\n\n想象我给了你一些信息，并让你把它写在笔记本上。\n\n你在第一行写下产品名称，第二行写下价格，以此此类推。\n\
  \n只有信息，没有任何设计或编程。\n\n![Image](img/image18.jpeg)\n\n这正是 HTML 的作用：它以语义化的方式显示信息。无障碍设备从\
  \ HTML 中读取信息。它们主要对信息感兴趣。如果你为盲障用户使用屏幕阅读器，它会读取页面的内容。所有的样式都会被忽略。\n\n然而，对于可以看到网站并与网站交互的视力人士来说，样式是重要的。\n\
  \n例如，如果我们对 Amazon 的产品页应用样式，我们可以让标题变大，并将图片放在左侧的独立区域。我们还可以隐藏所有图片，只在轮播图或滑块中显示第一张图片。我们可以使用\
  \ CSS 颜色、字体、间距和边框，绘制形状并进行各种事情。\n\n![Image](img/image17.png)\n\n所以，现在你了解了 HTML 和\
  \ CSS，但还有第三个组件：JavaScript。\n\n## 什么是编程？\n\n编程是创建一组计算机可以遵循以执行特定任务指令的过程。\n\n## 创建一个小型应用程序\n\
  \n让我们创建一个小型应用程序，以便你理解编程的含义。\n\n该应用程序接收两个数字并应该返回这两个数字之和。\n\n我将创建一个名为 `firstNumber`\
  \ 的变量和第二个名为 `secondNumber` 的变量。\n\n你可以定义变量 `x` 和 `y`，但专业程序员建议给变量起有意义的名称，以明确创建的目的。当你与他人分享代码时，这非常有用，让他们能够轻松理解你正在尝试做什么。\n\
  \n```javascript\nlet firstNumber;\nlet secondNumber;\nreturn firstNumber + secondNumber;\n\
  ```\n\n在 JavaScript 中，我们使用单词 `let` 来声明变量。然后你可以引用变量名来执行计算。\n\n我们使用单词 `return` 在计算完成后返回最终结果。\n\
  \n为了能够调用它，我们将其插入到函数函数中。\n\n```javascript\nfunction sum(firstNumber, secondNumber)\
  \ {\n  return firstNumber + secondNumber;\n}\n```\n\n然后你可以这样调用它：\n\n```javascript\n\
  const result = sum(1, 2);\nconsole.log('Result is: ', result)\n```\n\n`const` 与\
  \ `let` 类似，但用于不会改变的常量。我们仍然可以使用 `let`，但我们使用 `const` 来节省内存并防止他人更改它。\n\n`console.log`\
  \ 用于在浏览器控制台中显示消息。你可以像我做的那样用逗号分隔多个值。我显示了字符串 'Result is: '，后面跟着实际结果。\n\n### 亲自尝试一下\n\
  \n搜索“online javascript compiler”并选择你最喜欢的在线 JavaScript 编译器。\n\n在在线编译器中编写代码并运行。\n\n\
  ```javascript\nfunction sum(firstNumber, secondNumber) {\n  return firstNumber +\
  \ secondNumber;\n}\n\nconst result = sum(1, 2);\nconsole.log('Result is: ', result)\n\
  ```\n\n![Image](img/image11.png)\n\n![Image](img/image7.png)\n\n**恭喜你！** 你创建了自己的第一个\
  \ JavaScript 程序。接下来的所有的都是你所做内容的变体。\n\n## DOM (文档对象模型)\n\n当网页在浏览器中加载时，浏览器会创建页面的 DOM，这本质上是一个树形结构，其中每个节点对应文档的一部分，例如元素、属性和文本。\n\
  \n### JavaScript 和 DOM\n\nJavaScript 允许你访问 `dom`，因此你可以在运行时通过程序化修改网页。\n\n浏览器窗口由 `window`\
  \ 对象表示，你可以在 JavaScript 中访问它以获取有关位置等信息。\n\n在 JavaScript 中可供使用的另一个重要对象是 `document`\
  \ 对象，它代表在浏览器中加载的整个 HTML 文档。它提供了访问和操作文档内容的方法。\n\n### document.querySelector()\n\n\
  `document.querySelector()` 方法是 JavaScript 中一个强大的函数，允许你使用 CSS 选择器选择 HTML 元素。\n\n\
  传递给 `querySelector()` 的字符串必须是有效的 CSS 选择器。这与 CSS 有关，所以这里有一些 CSS 选择器的示例。\n\n假设你的网页中有以下\
  \ HTML：\n\n```html\n<div id=\"myDiv\" class=\"container\">\n  <p class=\"text\"\
  >Hello, World!</p>\n</div>\n```\n\n### 按标签名选择元素\n\n要选择第一个段落：\n\n```javascript\n\
  let firstParagraph = document.querySelector(\"p\");\n```\n\n这将选择加粗的段落元素\n\n```html\n\
  <div id=\"myDiv\" class=\"container\">\n  <p class=\"text\">Hello, World!</p>\n\
  </div>\n```\n\n还有一种名为 `querySelectorAll` 的方法，如果你想选择文档中的所有段落，可以使用它。\n\n### 按 id 选择元素\n\
  \n要选择 id 为 `myDiv` 的元素：\n\n```javascript\nlet myDivElement = document.querySelector(\"\
  #myDiv\");\n```\n\n注意 id 前面的 `#`。\n\n这将选择加粗的 div 元素。\n\n```html\n<div id=\"myDiv\"\
  \ class=\"container\">\n  <p class=\"text\">Hello, World!</p>\n</div>\n```\n\n###\
  \ 按类名选择元素\n\n要选择类名为 `container` 的元素：\n\n```javascript\nlet myDivElement = document.querySelector(\"\
  .container\");\n```\n\n\n\n\n注意类名前的点。\n\n这将选取加粗的 div 元素。\n\n```html\n<div id=\"\
  myDiv\" class=\"container\">\n  <p class=\"text\">Hello, World!</p>\n</div\n```\n\
  \n### 操作 DOM\n\n一旦你选取了元素，就可以对它进行任何操作。你可以读取它的内容，修改它的属性（如颜色、大小等）……或者你甚至可以将其从页面上删除，或者进行任何你喜欢的的操作。\n\
  \n### 其他选择器\n\n`document.querySelector` 和 `document.querySelectorAll` 是最近随着 DOM\
  \ Level 3 规范发布添加的新方法；在它们之前还有其他选择元素的方法，这些方法在今天仍然有效。\n\n- `document.getElementById()`\n\
  - `document.getElementsByClassName()`\n- `document.getElementsByTagName()`\n\n##\
  \ 基本数据类型 vs 引用类型\n\n我们将数据类型分为两大类：基本类型和引用类型。\n\n`Primitive types` 是最基础的数据类型，代表单个值。\n\
  \n`Reference types` 是更复杂的数据类型，可以持有值的集合。\n\n### 基本数据类型\n\n- **Number：** 代表整数和浮点数。\n\
  ```javascript\nlet num = 42;\n```\n- **String：** 代表字符序列。\n```javascript\nlet str\
  \ = \"Hello, World!\";\n```\n- **Boolean：** 代表逻辑实体，可以是 true 或 false。\n```javascript\n\
  let isActive = true;\n```\n\n### 引用类型\n\n引用类型是更复杂的数据结构，可以持有值的集合。\n\n- **Object（对象）：**\
  \ 对象是键值对的集合，可以存储不同类型的多个值，并用于表示现实世界中的实体。\n```javascript\nlet person = {\n  name:\
  \ \"Alice\",\n  age: 30,\n  isActive: true\n};\n```\n- **Array（数组）：** 数组是一种特殊的对象，用于存储有序的值集合。数组可以包含任何类型的元素，包括其他数组或对象。\n\
  ```javascript\nlet colors = [\"red\", \"green\", \"blue\"];\n```\n\n### 默认值\n\n\
  当你声明一个变量时，它的默认值是 `undefined`。\n\n### 运算符\n\n运算符是用于对或多个值或变量执行操作的特殊符号。它们是编程的基础，因为它们允许开发者执行计算并控制程序的流。\n\
  \n#### 算术运算符\n\n算术运算符用于执行数学计算。\n- `+`：加法。\n- `-`：减法。\n- `*`：乘法。\n- `/`：除法。\n\n####\
  \ 比较运算符\n\n比较运算符用于比较两个值并返回布尔结果（true 或 false）。\n- `==`：相等\n- `!=`：不相等\n- `>`：大于\n\
  - `<`：小于\n\n## 条件语句\n\n条件语句根据特定条件控制代码的执行流。它们允许你根据条件的求真值假来执行不同的代码块。\n\n```javascript\n\
  let score = 80;\nif (score > 60) {\n  console.log(\"You passed!\");\n} else {\n\
  \  console.log(\"You failed.\");\n}\n```\n\n`if` 语句在指定条件为真时执行一个代码块。\n`else` 语句在条件为假时执行。\n\
  \n## 三元运算符\n\n三元运算符是 `if...else` 语句的简写形式。\n\n`condition ? expression If True : expression\
  \ If False;`\n\n```javascript\nlet score = 80;\nconst result = score > 60 ? \"You\
  \ passed!\" : \"You failed.\";\nconsole.log(result);\n// 输出: You passed!\n```\n\n\
  ## 循环\n\n循环允许你根据指定的条件重复执行一个代码块。\n\n```javascript\nfor (let i = 0; i < 5; i++) {\n\
  \  console.log(i);\n}\n// 输出: 0, 1, 2, 3, 4\n```\n\n你可以使用 `while` 循环编写循环：\n\n```javascript\n\
  let count = 0;\nwhile (count < 5) {\n  console.log(count);\n  count++;\n}\n// 输出:\
  \ 0, 1, 2, 3, 4\n```\n\n## 事件\n\n事件是系统中发生了某些事的通知。当事件发生时，它可以触发代码中的反应。有许多类型的事件，如鼠标点击、按键按下、窗口大小调整。\n\
  \n例如，我们可以如下所示为按钮绑定事件处理器：\n\n```html\n<button id=\"myButton\">Click Me</button>\n\
  ```\n\n```javascript\nconst myButton = document.querySelector('#myButton');\nmyButton.addEventListener('click',\
  \ () => {\n  console.log('Button clicked!');\n});\n```\n\n## 箭头函数\n\n箭头函数是在 ES6\
  \ 中引入的。与传统的函数表达式相比，它们提供了更简洁的语法，在处理回调时特别有用。\n\n旧方法：\n```javascript\nfunction sum(a,\
  \ b) {\n  return a + b;\n}\n```\n\n箭头函数：\n```javascript\nconst sum = (a, b) => a\
  \ + b;\n```\n\n\n\n\n\n```javascript\nmyDiv.style.backgroundColor = \"green\";\n\
  \n});\n\n</script>\n```\n\n这里是完整代码，完整的 HTML 文件。你可以将其复制并粘贴到 `index.html` 文件中，并启动本地服务器查看效果。\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
  \ />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  \ />\n<title>JavaScript 示例</title>\n<script src=\"scripts.js\"></script>\n</head>\n\
  <body>\n<button id=\"myButton\">变色</button>\n<div id=\"myDiv\" style=\"width: 300px;\
  \ height: 200px; background-color: red\"></div>\n<script>\nconst myButton = document.querySelector(\"\
  #myButton\");\nmyButton.addEventListener(\"click\", () => {\nconst myDiv = document.querySelector(\"\
  #myDiv\");\nmyDiv.style.backgroundColor = \"green\";\n});\n</script>\n</body>\n\
  </html>\n```\n\n![Image](img/image15.png)\n\n![Image](img/image14.png)\n\n**恭喜你！**\
  \ 你已经在现实生活中完成了你的第一个 JavaScript 应用程序。\n\n## 接下来做什么？\n\n本书的目标是让你更轻松地上手 JavaScript。我已经为你提供了所有内容的概览，但随着你继续学习\
  \ JavaScript，你将学到更多细节。尝试熟悉 HTML 和 CSS，并坚持练习 JavaScript。\n\n不要尝试仅用 JavaScript 就创建真实的应用程序，因为那将花费你大量的时间。\n\
  \n一旦你对 JavaScript 有了信心并准备好构建一个真实的应用程序，你就应该学习新的 JavaScript 框架。我指的是 Angular、React\
  \ 和 Vue。\n\n它们的作用都是相同的，即构建客户端应用程序。在 Web 开发中，应用程序有两种：服务端应用程序和客户端应用程序。服务端应用程序负责业务逻辑、安全、数据库通信等，而客户端应用程序负责用户界面。\n\
  \n它们收集用户的输入，将其发送到后端服务器，并在后端服务器返回结果后立即显示给终端用户。它们不执行敏感操作，如安全、业务逻辑或与数据库的通信。\n\n有许多编程语言可以创建后端应用程序，如\
  \ C#、Java、PHP、Node.JS (JavaScript)、Python 等。\n\n对于前端，主要是 JavaScript 和 TypeScript，配合\
  \ Angular、React 和 Vue 等框架。\n\n移动端应用程序是另一种类型，它们与客户端应用程序更相似，并且连接到后端服务器。\n\n今天大多数后端服务器都是基于\
  \ REST API 原构建的。服务器提供客户端用于发送和接收数据的端点。\n\n随着时间的推移你会学会一切，不要担心。\n\n你可能需要多次尝试才能理解一个主题，所以请坚持下去，因为你会反复遇到这些主题。\n\
  \n随着时间的推移，你将对该领域建立理解，并以专业的方式处理问题。\n\n祝你学习顺利，我们下个话题再见！\n\n— Abdelfattah Ragab\n\n\
  ## 结语\n\n**恭喜你！** 你读完了《儿童少 JavaScript：开启你的编程之旅》。现在你对 JavaScript 有了良好的理解。记住，学习 JavaScript\
  \ 是一个持续的过程。实践出精兵——构建你自己的项目，尝试你学过的功能，并深入研究在线资源。\n\n感谢你与我一起探索 JavaScript。祝你的编程之旅好运连连。祝编程愉快，祝你的应用程序取得成功！\n\
