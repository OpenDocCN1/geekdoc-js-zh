  md: 'NOTE: The list of frameworks that we looked at in this book is not exhaustive,
    and there are some excellent frameworks in addition to these. If you are interested
    in other frameworks that are available, or don''t find a framework to fit your
    needs in this chapter, then the following URL may be worth a look: www.xpmobi.org/mobile-ui-frameworks.


    # Similarities and Differences Between Frameworks


    In this chapter, we will be taking a look at Jo, jTouch, jQuery Mobile, and Sencha
    Touch. For each of these frameworks, we will take a simplified version of the
    Moundz application and modify it to suit the framework. As mentioned in the introduction,
    this will give you a good feel for the differences between each of the frameworks,
    and should assist you in choosing a framework that suits you in your future Android
    web app projects.


    At a conceptual level, each of the frameworks is fairly similar:


    +   - Each provides a mechanism for supporting multiple application "pages" without
    the need for reloading these pages from the server. Given the limited screen real
    estate on a mobile device, it is normal for mobile applications to contain twice
    as many application pages as a desktop equivalent.


    +   - When you consider the preceding point combined with the higher latency of
    mobile broadband, one of the most important things that a mobile UI framework
    can provide is an effective way to assist you in managing high-latency situations.


    +   - Each provides a level of UI customization to help mobile web apps feel more
    native apps. The challenge is making a web application feel consistent with the
    native feel of a multitude of devices.


    When it comes to how each of the frameworks is implemented, however, things start
    to differ. The biggest difference is around whether a framework uses a markup-based
    approach or is more declarative in the way the UI is created. We''ll briefly explore
    these two concepts before looking at each of the frameworks individually.


    # Markup-Based UI Frameworks


    In a markup-based framework, commonly define the UI layout using pure HTML with
    CSS classes (or alternative attributes in the HTML) that influence the behavior
    of the frameworks.


    In the cases where CSS is used to control this behavior (jTouch, for example),
    the CSS classes serve to influence the look and feel of the application through
    stylesheets, and additionally to provide guidance to the accompanying JavaScript
    on how to handle those elements programmatically.'
