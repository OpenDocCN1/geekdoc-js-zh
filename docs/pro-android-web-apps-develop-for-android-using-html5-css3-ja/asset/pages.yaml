    Things are starting to make sense now–the included script passes data back through
    a function call. However this is not how we have defined, but a function that
    has been created by jQuery with the specific purpose of receiving the JSONP call.
    Once the jQuery function has received the data, it simply passes the information
    to the callback that we provided when we made $.ajax call.


    > NOTE: In general, you are better off using a JavaScript library like jQuery
    to handle your JSONP calls, given the steps that are in working. While we have
    covered some of what goes on behind the scenes here, it is far from an exhaustive
    list of the work that needs to be done. For further information, the blog post
    provides a lightweight script that shows how JSONP works, and also provides an
    alternative to some of the heavyweight implementations in jQuery and the like:

    www.nobrustive.com/2010/05/20/lightweight-jsonp-without-any-3rd-party-libraries.'
