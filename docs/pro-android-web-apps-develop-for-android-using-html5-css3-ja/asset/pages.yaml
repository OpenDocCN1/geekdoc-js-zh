  md: "# CHAPTER 11: Mobile UI Frameworks Compared\n\n```\n<h1>Location Detail</h1>\n\
    <div>\n  <div data-role='content'>\n</div>\n</div>\n<body>\n</html>\n```\n\nIn\
    \ the preceding code, we created two separate pages for our application display.\
    \ First, we have our main application page, which will contain the map, and second,\
    \ we have the page that will display the detail from the selected location (as\
    \ per our non-framework version).\n\nIn jQuery Mobile, the data-role attribute\
    \ in an HTML element is used to provide jQuery Mobile with information regarding\
    \ its purpose. Pages have a data page role, and inside each page we have multiple\
    \ divs with different values for the data-role attribute. jQuery Mobile makes\
    \ extensive use of data-* attributes to specify how UI elements should behave;\
    \ while not exhaustive, Table 11–1 lists a few that we will encounter in our sample.\n\
    \n# Table 11–1. Some of the Common jQuery Mobile Data Attributes\n\n| Attribute\
    \ | Description |\n|---|---|\n| data-role | The data-role attribute defines the\
    \ type of UI element that will be created the HTML has been processed by jQuery\
    \ Mobile. Primarily, UI elements are transformed by the jQuery Mobile library\
    \ at runtime by adding relevant CSS classes which influence the look and feel\
    \ of the original HTML. In some cases, jQuery Mobile will add additional HTML\
    \ elements to the DOM to create the relevant mobile page. |\n| data-id | The data-id\
    \ element is used to specify a unique identifier for the UI control. This ID can\
    \ be used to tell jQuery Mobile that a particular element should remain consistent\
    \ between different pages in the UI. |\n| data-icon | Some UI elements (as the\
    \ button) can contain icons to help represent the purpose of the control. Icons\
    \ are specified using a name that relates to a particular icon. There are a number\
    \ of built-in icons that can be used, such as the one in our sample. Additionally,\
    \ you can use custom icons by specifying a unique identifier and then defining\
    \ some custom CSS for icon. More information can be found at the following URL:\
    \ http://jquerymobile.com/demos/1.02/#buttons-icons.html |\n\nWith our modified\
    \ HTML with the data-role attributes in place, jQuery Mobile can begin to work\
    \ with our application layout. Figure 11–14 shows an example of the UI generated\
    \ from the preceding index.html file."
