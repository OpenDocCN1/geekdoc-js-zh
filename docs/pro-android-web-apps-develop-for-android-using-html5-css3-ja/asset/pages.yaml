    Once Moundz is wrapped in a native application, the process fails at step 3 due
    to the way opening a new window is handled from within a PhoneGap application.
    Essentially, the WebView that you use in a PhoneGap application represents a single
    browser window, and, if any links are opened that require a new window, the native
    browser (not the application itself) handles this. This is understandable and
    the right way to handle such requests; however, it does have an impact when Google
    attempts to close the browser window in step 3. Essentially, it fails, and the
    user is left in the native browser on the authentication screen with no obvious
