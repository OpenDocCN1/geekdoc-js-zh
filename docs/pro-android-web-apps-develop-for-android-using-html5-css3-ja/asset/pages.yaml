- img_proc: true
  md: 'an application using YQL (using the yahooer tools of course), as it will be
    routing requests through http://query.yahooapis.com/v1/public/.


    While it would be great to go into more depth on YQL, we won''t be able to solve
    our current issue for using Foursquare or Gowalla (the reasons for this will be
    outlined very soon), so that would be counterproductive. However, it is definitely
    worth a look when you have the time, as it can be extremely useful.


    # # PhoneGap Native App


    As strange as it seem, PhoneGap as a native wrapper actually provides you some
    additional advantages over what we have been talking about so far. PhoneGap accesses
    the HTML, CSS, and JS for the mobile application using the file scheme (http://en.wikipedia.org/wiki/File_URI_scheme)
    rather than HTTP (or HTTPS). In doing this, PhoneGap actually circumvents most
    of the security restrictions that are placed on web applications and pages that
    are loaded from a web server.


    This is more of a side effect than a design feature, and it is not something that
    will be available in all bridging frameworks. As such, it is recommended that
    you only use this workaround when you are sure that you will be deploying your
    mobile web application via PhoneGap.


    # # Introducing the Geominer API


    In the previous section, we looked at a number of different strategies for dealing
    with an API that doesn''t support JSONP. We have to decide which one we want to
    use. Before we do, let''s consider our available tools and design goals for the
    project:


    +   - The YQL solution is elegant, the preferred geospatial API is Gowalla (given
    some excellent API features), and the current YQL community datatables (www.datatables.org)
    for Gowalla doesn''t cover all of the Gowalla API features.


    +   - Moundz, we will be using Twitter for authenticating users rather than writing
    our own login system. We will go into this process in detail soon, but for now
    let''s say that, at the time of writing, Twitter does a better job of offering
    mobile-friendly experiences through it. While it recently released a JavaScript
    toolkit called Twitter Anywhere (http://dev.twitter.com/anyone), login features
    are still very desktop oriented.


    +   - Our primary focus in this book is building Android web apps, which means
    that, while using PhoneGap would be a suitable workaround, the deployment of the
    app as a standalone web application would not be an option. This is less ideal.'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'Based on these factors, it is probably best for us to implement our server-side
    API that will handle the interaction with other application APIs for us, and provide
    a single JSONP-enabled API that both our mobile web application and others could
    deal with. Figure 10–7 shows how this API provides some "middleware" for building
    the geospatial game.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_241_0.png)


    Figure 10–7. The Moundz API aggregates our multiple external APIs into a single
    interface.


    Given that the title of this book is not Building API Mashups with Google App
    Engine, we won''t be going into great depth about the work required on the server
    side. We will instead be focusing on how to use the API to build our mobile application
    on the client side.


    Additionally, rather than build an API that is suited only to the needs of the
    Moundz sample application, we will build the Geominer API as generically as possible.
    This way, if you feel inspired to write an application similar to the Moundz,
    you should be able to use the information in these last few chapters of the book
    and the Geominer API to create your masterpiece.


    For more information on the Geominer API and an inside look at the source code
    showing how it was built, check out the source code on GitHub, at http://github.com/sidelab/geominer.


    Well, that''s enough talk—let''s write some code.'
