  md: '# Chapter 9


    # # Native Bridging with PhoneGap


    In the previous chapter, we looked at working with mobile maps in preparation
    for writing our geosacial game. In this chapter, we will have a look at PhoneGap
    (http://phonegap.com) as a tool to assist us in deploying our web applications
    as native apps. This will give us the ability to deploy our applications to the
    Android marketplace, while letting us continue to build the core of the application
    using web technologies.


    We will investigate some good reasons that we might want to do in this next section.
    First, it will allow our geosacial game to give native applications a run for
    their money, and it will make it difficult for consumers to distinguish between
    a native app and a web application deployed as native.


    Essentially, we are going to be learning how to have our cake and eat it too—which
    in our opinion is always a good thing.


    # ## Introducing Bridging Frameworks


    PhoneGap is a framework/tool for packaging a mobile web application for native
    distribution. Additionally, frameworks like PhoneGap provide capabilities for
    pure web applications to access functionality of the mobile device. This is achieved
    by the native wrapper application providing a bridge to the web application, and
    in the case of PhoneGap this is done using a JavaScript library (on the surface
    at least).


    PhoneGap is just one of many bridging frameworks. While the term *bridging framework*
    isn''t in wide usage at present, it represents very well what they are designed
    to do. At its core, PhoneGap is the purest of these frameworks, offering just
    the bare bones to access the native features, without making any suppositions
    about other parts of your application build.


    Another bridging framework that is worth a look is a product from Rhomobile called
    Rhodes (http://rhomobile.com/products/rhodes). Rhodes provides an application'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'stack designed for building data-driven mobile web applications. If you are
    a user or fan of Rails (http://rubyonrails.org), then you are likely to find a
    comfortable fit with Rhodes.


    One last framework that has gained a bit of attention (but wouldn''t actually
    class as a bridging framework) is product Appcelerator Titanium (www.appcelerator.com).
    The Appcelerator approach is quite different from both PhoneGap and Rhodes. Rather
    than building an application that wraps a mobile UI with a simple native wrapper
    application, Appcelerator builds a native app from JavaScript code. As more web-enabled
    mobile devices gain market share, approach show some limitations; however, it
    is worth a look all same.


    In terms of where to start with all these different options, PhoneGap is an excellent
    choice—which is why we are using it in the book. There isn''t much that you can''t
    with PhoneGap, and you always have the choice of what you will mix and match with
    it. Most other solutions won''t give you the same scope to explore.


    # When to Use PhoneGap


    There are two basic situations that would justify the use of a bridging framework
    such as PhoneGap:


    +   - When a mobile web application that you are writing needs access to device
    functionality not currently exposed through an implemented web API. A good example
    is accessing the accelerometer or the camera.


    +   - When you want to package the application for native distribution in the
    Android marketplace (or equivalent device app store). With the various mobile
    application stores being common places for people to look for their applications,
    this is something always worth considering.


    The second of these situations is probably the more common. One of the advantages
    of developing PhoneGap (instead of another bridging framework) is that, even if
    this hasn''t been considered when writing a mobile web app, it is very simple
    to package an application with PhoneGap at a later stage.


    # Downloading PhoneGap


    At the time of writing, the current release state of PhoneGap is 0.9.3, which
    can be downloaded by going to the following URL and obtaining the release archive:
    www.phonegap.com/download.


    Once you have downloaded the ZIP file, extract it and place it where you normally
    keep your developer tools. The distribution contains a number of folders with
    template projects designed to help you to build and deploy mobile applications
    for a variety of platforms using PhoneGap. The files for Android are sensibly
    located in the Android directory.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '+   phonegap-0.9.3-.jar: This is a Java archive containing the compiled classes
    that are used to make PhoneGap function on Android. If you''re interested in how
    pieces of PhoneGap work (and you''re comfortable reading Java source code), then
    you can have a look at the phonegap-android project on GitHub (http://github.com/phonegap/phonegap-android).
    This is purely optional, though, it is not required to build using PhoneGap.


    +   phonegap-0.9.3-.js: This is the JavaScript file that provides the JavaScript
    stuff that manage the communication between the web application and the native
    wrapper. We''ll take a look at some of the functionality offered by this JavaScript
    library later in the chapter.


    +   Sample: This is a sample project directory. We will use it as a base for creating
    our application using PhoneGap, and in the next section we''ll look at the internals
    of the sample to gain an understanding of the capabilities of the PhoneGap framework.


