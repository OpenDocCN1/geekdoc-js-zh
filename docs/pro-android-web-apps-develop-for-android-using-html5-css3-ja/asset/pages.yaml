  md: "# What Is JSONP?\n\nEssentially, JSONP is a workaround to a problem we will\
    \ look throughout this section. It involves a complex technique that web developers\
    \ started using to get around what is known as the **same-origin policy** (http://en.wikipedia.org/wiki/Same_origin_policy),\
    \ which is enforced in browsers. With the same-origin policy in place, JavaScript\
    \ code running in a browser prevents making an XMLHttpRequest (http://en.wikipedia.org/wiki/XMLHttpRequest)\
    \ to a URL that is different from the domain the script is running on. Therefore,\
    \ if you attempt to access an application's API from a client-side script running\
    \ on a separate domain, the browser will step in and prevent it from harming.\n\
    \nTo illustrate the problem, we will work through a small example. For example,\
    \ consider the following code, which accesses the public Twitter API (see http://dev.twitter.com\
    \ for more information) and displays the tweets on the pages.\n\n```\n<html>\n\
    <script src=\"../js/query-1.4.2.min.js\"></script>\n<script>\nfunction showData(data)\
    \ {\n  var tweets = '';\n\n  if (!data) {\n    tweets = '<li><strong>Could not\
    \ retrieve tweets.</strong></li>';\n  } else {\n    for (var ii = 0; ii < data.length;\
    \ ii++) {\n      tweets += '<li>' + data[ii].text + '</li>';\n    } // for\n \
    \ }\n}\n$('#tweets').html(tweets);\n// showData\n$(document).ready(function()\
    \ {\n  // make the request to the geonames server\n  $.ajax({\n    url: 'http://api.twitter.com/1/statuses/public_timeline.json',\n\
    \    dataType: 'json',\n    success: showData\n  });\n});\n</script>\n<body>\n\
    <ul id=\"tweets\">\n</ul>\n</body>\n</html>\n```\n\nThe sample itself is simple\
    \ enough—we make a request to the endpoint for the Twitter public timeline and\
    \ then parse the response, filling the #tweets element with the tweets retrieved."
  merge: -1
  pgno: 232
- img_proc: true
