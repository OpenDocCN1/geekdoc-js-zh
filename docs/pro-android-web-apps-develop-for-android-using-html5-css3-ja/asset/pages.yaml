  md: "# Sending Your Offline Data to jsonengine\n\nAs jsonengine expects input in\
    \ JSON format, we have to convert our offline SQL data to JSON format. The global\
    \ flow is quite simple:\n\n+   1. Select all the records.\n\n+   2. Parse them\
    \ to JSON format.\n\n+   3. Send them to jsonengine.\n\nSelecting all the database\
    \ records is something we have already done before, so we can copy and paste it\
    \ using an existing function, clean it up, and finally send the data to our online\
    \ storage service, as follows:\n\n```\nfunction synchronizeOnline(callback) {\n\
    \  db.transaction(function(transaction) {\n    transaction.executeSql(\n     \
    \ \"SELECT id * FROM tasks\",\n      function (transaction, results) {\n     \
    \   var tasksSynchronized = 0;\n\n        // initialise an array to hold the tasks\n\
    \        // read each of the rows from the db, and create tasks\n        for (var\
    \ ii = 0; ii < results.rows.length; ii++) {\n          var task = new module.Task(results.rows.item(ii));\n\
    \          taskJson = JSON.stringify(task);\n\n          $.post(\"/je/tasks\"\
    , {doc:taskJson, docId:task.id}, function() {\n            // once the post has\
    \ completed, increment the counter\n            tasksSynchronized += 1;\n\n  \
    \          // and check to see if we have finished the sync operation\n      \
    \      if (callback && (tasksSynchronized === results.rows.length)) {\n      \
    \        callback(tasksSynchronized, true);\n            }\n          });\n  \
    \      }\n        } //\n\n        // fire the callback and provide information\
    \ on the number\n        // of tasks that were updated\n        if (callback)\
    \ {\n          callback(results.rows.length, false);\n        }\n      }\n   \
    \ }\n  });\n});\n```\n\nLet's focus on the loop for, where the interesting stuff\
    \ happens. Firstly, we use the JSON library to serialize a Task object that we\
    \ have retrieved from the database to a JSON string. Next, we use the jQuery post\
    \ function to send serialized data (using a POST request) to jsonengine for storage."
  merge: -1
  pgno: 113
- img_proc: true
  md: "# CHAPTER 5: Synchronizing with the Cloud\n\nYou can see that our post call\
    \ takes three arguments:\n\n+   - The first argument is the url that we are making\
    \ the POST request to. In this case, our storage URL is the same as our application;\
    \ we just prefix it with _je (for \"JSON storage\")—this is simply a jsonengine\
    \ convention.\n- Our next argument contains the data that we are sending through\
    \ the jsonengine. For jsonengine to be able to save our data effectively, it needs\
    \ two things:\n  - A document (_doc)—this is the data that is going to be stored.\n\
    \  - A document id (_docid)—the unique key of our document that we are storing.\
    \ As jsonengine is smart enough to detect whether the docid already exists, and\
    \ will either create a new record or update the existing record.\n- Finally, we\
    \ supply a success callback for the post function and this is called once the\
    \ request has been successfully completed.\n\nWhat is happening here? First, we're\
    \ using jQuery's post function. This is one of jQuery's most powerful functions\
    \ when we have to deal with network communication. This function will perform\
    \ a HTTP POST request, and of course we pass an array of parameters: (`/je/tasks`,\
    \ `{taskid,docid:task.id}, success callback).\n\nThe first parameter is the URL\
    \ to which we are posting our request. In this case, our storage URL is the same\
    \ as our application; we just prefix it with _js (for \"JSON storage\")—this is\
    \ simply a jsonengine convention.\n\nThe second parameter, `{taskid,docid:task.id}`,\
    \ is more jsonengine specific. It's a nested parameter's map which defines the\
    \ name of our storage record, and it can be compared to a database table name.\
    \ The value we provide is the freshly JSONconverted string, in jsonengine terms,\
    \ it's called the JSON document. Then, _docid represents the unique key of our\
    \ request. As you can see, we use the index of our for loop because it's the same\
    \ index as the ID of the offline task's entries.\n\n> NOTE: Where does the submitted\
    \ JSON strings? It's Google App Engine's data store. As Google's online storage\
    \ solution, Google App Engine takes care of all the distribution, replication,\
    \ and load balancing of data. In fact, jsonengine is just an abstraction layer\
    \ above the data store to perform the storage of JSON documents transparently."
  merge: -1
