  md: "Cleaning up the alignment of the bottom buttons to achieve a nice,\ncentered\
    \ alignment and prevent wrapping\n\nAdding the ability for a user to collect resources\n\
    \n# # Improving Navigation Layout\n\nWhile we won't spend too much time on it,\
    \ it is worth having a quick look at ways that\ncan improve how navigation controls\
    \ format. As shown in Figure 12–3, the\nalignment of the controls is not optimal;\
    \ also, it is possible for the Next button to wrap\nover the next line when a\
    \ large name is found.\n\nThe good news is that half the work is already taken\
    \ care of thanks to the CSS\nthat is packaged with jQuery Mobile—any text that\
    \ cannot fit into a button of a particular\nfixed width (or maximum width) will\
    \ be shortened with an ellipsis (series of three dots);\nsee http://en.wikipedia.org/wiki/Ellipsis).\
    \ All we have to do is appropriately limit\nthe button sizes.\n\nTo achieve this,\
    \ we will use another CSS33 feature—the flexible box layout (see\nwww.w3.org/TR/css3-flexbox)—combined\
    \ with standard CSS rules to control\nHTML element width.\n\nNo changes are required\
    \ to our HTML, so simply adding the following CSS to the end of\nmoundz.css file:\n\
    \n```\n/* navigation control visual treatment */\n\n#marker-nav a {\n  max-width:\
    \ 32%;\n}\n\n#marker-nav a.left, #marker-nav a.right {\n  width: 90px;\n}\n\n\
    #marker-nav {\n  display: -webkit-box;\n  -webkit-box-pack: center;\n}\n```\n\n\
    Now, there is nothing overly complicated here. We have a CSS class that tells\
    \ anchor\ntags within the #marker-nav to have a width no greater than 32 percent\
    \ (of the\\parent element). We override that style for any anchors with left or\
    \ right classes\nto set their width manually to 90px.\n\nFinally, we specify a\
    \ rule that implements some CSS3 flex magic for the #marker-nav\nelement. First,\
    \ we modify the display to -webkit-box (as per the previous CSS3,\nprepend the\
    \ proprietary webkit prefix) and then tell the element that we want to display\n\
    any child elements in the center of the control. This is done using the -webkit-box-pack\n\
    rule, and it is set to the value of center."
