  md: 'NOTE: You might be wondering why we are reimplementing functionality that we
    have already covered in our previous to-do list application. This is because the
    navigation code implemented as part of our to-do list application doesn''t work
    well with the recommended Google Maps layout. Rather than attempt to retrofit
    the Google Maps code, it was a simpler exercise to create a simpler mapping boilerplate.


    As mentioned earlier in the book, the mobile web app is crying out for a mature,
    mobile JavaScript framework that will take care of some of grunt work that is
    involved with writing a mobile web.


    There are already some good contenders out there, but Android and other mobile
    device support isn''t very extensive. My money is definitely on jQuery Mobile
    in the long run. This will hopefully be released shortly before this book, but
    not at the time of writing unfortunately.


