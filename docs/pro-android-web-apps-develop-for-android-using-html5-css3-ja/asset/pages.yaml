  md: "# Making Your Application Location-Aware\n\nOne of the things that make mobile\
    \ applications unique is that they can detect and make use of your physical location.\
    \ One of the most famous applications that use this information is foursquare,\
    \ which allows people to \"check into\" particular places and share this information\
    \ with others.\n\nFor a long time, these features were only possible with native\
    \ applications, which had access to lower-level hardware such as the GPS sensor.\
    \ Again, W3C's HTML5 team came with a revolutionary proposal by allowing the browser\
    \ to access the GPS of your device and expose it through a JavaScript Library.\
    \ In other words, mobile web applications can now be location-aware, thus bridging\
    \ a huge gap between native and web-based applications. This topic will be central\
    \ to the discussion in this chapter.\n\n> NOTE: For a long time, mobile web applications\
    \ didn't have access to low-level hardware, such as the camera or the GPS sensor.\
    \ However, things are changing—the browser is a native application and has access\
    \ to low-level hardware APIs, and can expose them to web applications by providing\
    \ extra JavaScript functions. For the moment, only a few low-level APIs are exposed\
    \ (e.g., Geolocation and DeviceOrientation events) Camera and contact list access\
    \ are still unavailable, but with the growing popularity of mobile web applications,\
    \ it's likely that such access will be added in the future.\n\n# The W3C Geolocation\
    \ API Specification\n\nThe entry point of the W3C Geolocation API is a simple\
    \ JavaScript function with its callback function:\n\n```\nnavigator.geolocation.getCurrentPosition(showMap);\n\
    \nfunction showMap(position) {\n  // handle position variable\n}\n```\n\nThis\
    \ will be sufficient to retrieve your current location; the callback function\
    \ showMap takes a position parameter that contains all the information we need\
    \ to make your application location-aware. Tables 6–1 and 6–2 outline the Position\
    \ object and its associated Coordinates object.\n\nTable 6–1. The Position Object\n\
    \n| Property Name | Type |\n|---|---|\n| coords | Coordinates |\n| timestamp |\
    \ DOMTimestamp |"
  merge: -1
  pgno: 130
