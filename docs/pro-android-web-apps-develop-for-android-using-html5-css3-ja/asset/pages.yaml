  md: 'enable us to make our form look very nice without requiring the use of external
    image resources.


    > NOTE: The CSS3 specification (like the HTML5 specification) is not yet finalized.
    For this reason, the CSS3 definitions here are implemented using the proprietary
    -webkit prefix (for the WebKit browser family, other browsers will implement their
    own proprietary prefix). This indicates that the folks at WebKit are confident
    that these sections of the CSS3 spec make the final cut. Once the CSS3 specification
    is locked down, then the -webkit prefix will be dropped and replaced by the standard
    name.


    As an example, -webkit-box-shadow will simply become box-shadow. This is worthy
    keeping in mind when building your mobile application—especially given that there
    is nothing someone from installing a different mobile browser on their Android
    device. If you want your web app in browsers other than WebKit, try to use proprietary
    CSS3 extensions for eye candy only. Or include definitions for the other browser-rendering
    engines that you want to support in the style definitions alike.


    Let''s have a brief look through the CSS3 extensions used in this example (more
    detail is provided in the Appendix of the book).


    # appearance (-webkit-appearance)


    This CSS3 property is used to tell the browser what type of native control we
    would like to be displayed. There are many different control types that can be
    specified. For this example and many other instances, it is simplest to set the
    appearance to none and to apply the look and feel through surrounding elements.


    # border-radius (-webkit-border-radius)


    The border-radius property provides a very simple and nice way of applying a border
    to your HTML elements. In addition to being able to specify the corner radius
    for all corners of your element with this property, you can specify specific and
    different radii for each individual corner using the following properties:


    +   - border-bottom-left-radius

    - border-bottom-right-radius

    - border-top-left-radius

    - border-top-right-radius


    A radius property will take either one parameter that specifies the overall corner
    radius, or two parameters, specifying the horizontal radius and vertical radius
    for the corner(s), respectively.'
