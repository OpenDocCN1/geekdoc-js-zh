    # Introducing the viewport Meta Tag


    The HTML viewport meta tag was introduced by Apple for use in Mobile Safari on
    iPhone, and is used to tell the mobile browser exactly what it is seeing. Without
    a viewport meta tag, the browser will assume it is looking at a web page that
    is built for desktop browsing and thus scale the display to fit. An example viewport
    meta tag definition follows:


    ```

    <meta name="viewport" content="width=device-width; user-scalable=0; />

    ```


    In this particular instance, we are telling the browser that we wish to have the
    page displayed at the screen width of the device, and that the user should not
    be permitted to zoom in and out the viewport. Zooming in and out the display is
    generally pretty handy when looking at a site that hasn''t been optimized for
    mobile: however, when viewing a mobile-ready page, it''s not generally required,
    and can sometimes be a hindrance to other functionality that you want to offer
    in your app.


    > NOTE: While the viewport meta tag is something you would expect to be part of
    the HTML5 specification, this is not the case at this stage However, both WebKit
    and Mozilla browsers are actively using the tag, and will be working with the
    W3C to have it incorporated as part of the specification.


    While this viewport meta tag is sufficient for telling the WebKit browser on Android
    how you would like the page sized, other mobile devices may require some extra
    information to configure the display properly. To help with constructing a viewport
    meta tag that will work on the majority of mobile devices, I''ve included a quick
    reference table. Table 2–1 outlines the various parameters you can include in
    the content section of the meta tag and a brief explanation of each.'
