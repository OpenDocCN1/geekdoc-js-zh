    # # Coding for Different Screen Sizes


    Devices powered by the Android OS can come in with a variety of screen sizes,
    which means that we really want to build our forms and apps to be able to adjust
    their appearance to make the best use of the available screen real estate. In
    most cases, this is done by using responsive dimensioning specifications (i.e.,
    percentages) rather than specific, absolute values (i.e., pixels).


    While this might be enough enough to ensure that a form looks presentable for
    all screen sizes, it certainly won''t guarantee that it''s going to look good.
    For these situations, we need to provide customized stylesheets for the varying
    device sizes. This is surprisingly simple, and can be done by specifying the appropriate
    device widths in the media attribute of the link tag. For instance, the following
    code would include the stylesheet smallscreen.css for devices with a width of
    480 pixels and the stylesheet largescreen.css for larger sizes.


    ```

    <link media="only screen and (max-device-width: 480px)" href="smallscreen.css"
    type="text/css" rel="stylesheet" />

    <link media="only screen and (min-device-width: 481px)" href="largescreen.css"
    type="text/css" rel="stylesheet" />

    ```'
