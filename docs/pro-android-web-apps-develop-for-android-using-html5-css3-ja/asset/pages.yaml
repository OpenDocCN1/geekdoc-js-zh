    Hmm, that can''t be right—we should have seen a more meaningful message that.
    While the sample project is quite complete in terms of everything required to
    create a PhoneGap project, it doesn''t know the location of the Android SDK, and
    as a result the Ant fails. This can be rectified by using the android command-line
    tool (one of the core tools in the Android SDK; it was introduced in Chapter 1)
    to generate a `local.properties` file for the build.


    Simply run the following from the command line, with the copied sample directory
    as the current directory:


    ```

    android update project -p ./

    ```


    This creates a local.properties file for the project that contains a single property,
    `sdk.dir`. This tells Ant where it can find the Android SDK, and consequently
    the required build tools to build the sample application.


    Attempting to run Ant again once the `local.properties` file has been created
    will generate output similar to that shown in Figure 9–3.'
