  md: "2. Clear the background. The first step in drawing an animation frame usually\
    \ involves clearing the background from what has been drawn in the previous frame.\
    \ As you become more comfortable with drawing to the canvas, however, you may\
    \ want to limit doing this to squeeze performance out of your animations. For\
    \ what we are doing here, though, clearing the background is ideal.\n\n3. Adjust\
    \ canvas parameters. Before drawing to the canvas, you may want to change parameters\
    \ such as stroke or style, and also colors.\n\n4. Draw the animation frame. Draw\
    \ the animation frame using the canvas methods provided. We'll look at an example\
    \ shortly that touches on a few elements of this, but for further information,\
    \ the Mozilla Developer Center Canvas (https://developer.mozilla/en/Canvas/tutorial).\n\
    \n5. Perform animation logic. It is likely that, to affect any kind of animation,\
    \ you will need to update variables, perform calculations, and so on. Generally,\
    \ within the animation loop is an effective way to perform this kind of logic.\n\
    \n6. Restore the canvas state. Once the animation loop has been completed, restore\
    \ the canvas state to prevent modifications that have been made to the canvas\
    \ within the loop (such as changes to fill or stroke style) being used in other\
    \ parts of the application.\n\n> NOTE: While some would suggest saving and restoring\
    \ the canvas state is optional depending on your implementation\n\n# A Working\
