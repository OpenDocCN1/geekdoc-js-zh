  md: '# Preparing the Development Environment


    Now that you have a high-level understanding of what you can do on the Android
    platform with regard to web apps, let''s move on to getting our development environment
    set up we can start developing applications in the next chapter.


    There are multiple approaches that can be taken when putting together an effective
    development environment for mobile web apps on Android. The basic components of
    setup outlined in this section are a text editor, a web server, and an Android
    emulator (handset). You, however, choose to use an IDE like Eclipse instead (see
    http://eclipse.org).


    Eclipse is an IDE that is tailored for Java development, and the Android team
    offers native Android tools for Eclipse. If you are working with both and native
    Android development, you may prefer to continue with the Eclipse environment and
    if this is the case, there is nothing in this book that will prevent you from
    doing so.


    > NOTE: There are many merits to using a full-featured IDE for development, I
    personally prefer using lightweight and separate tools. In a standalone web server
    and accessing the content from your device''s browser will allow you to easily
    test multiple devices simultaneously without the overhead that might be imposed
    by using tools provided within the IDE.

    Additionally, if I decide to focus on another mobile device as a primary development
    target, I can continue to use the same tool set to develop for that platform.
    I anticipate that we will see two or three dominant players and a long trail of
    ten-plus platforms in the mobile space, so having an approach that works across
    devices is definitely appealing.


    # Text Editors and Working Directories


    Any text editor that you are comfortable with will serve you more than adequately
    writing web apps for Android. If you really are unsure which text editor you want
    to use, then Wikipedia (usually) has an excellent comparison list (see http://en.wikipedia.org/wiki/Comparison_of_text_editors).


    With your trusty text editor now beside you, it''s time to set up the directory
    that you are going to work from as you progress through this book. The actual
    location of the directory is completely up to you, but I would recommend building
    a folder structure similar to the following, as this will assist you in working
    through the examples:


    +   - PROJECT_WORKING_DIR

    - img

    - js

    - snippets'
