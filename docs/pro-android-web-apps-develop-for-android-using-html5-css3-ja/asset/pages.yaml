  md: "# Application Cache Progress event (7 of 7)\nApplication Cache Cached event\n\
    \nIf you turn off your Internet connection, the application will still work because\
    \ the browser will retrieve the files from the local cache instead of the server.\
    \ Going back to our scientist example from Chapter 5, the scientist will be able\
    \ to use this application everywhere, even if he plans collecting data on the\
    \ month!\n\nBut what happens if a resource is modified? The cache mechanism uses\
    \ a byte-to-byte comparison between the remote and cache manifest, so any change\
    \ will be detected.\n\n# Exploring Hidden Offline-Caching Features\n\nThe offline-caching\
    \ file also provides two other useful features: keywords NETWORK and FALLBACK.\
    \ NETWORK can define resources that will always skip the cached resources and\
    \ always try to retrieve them from the server. FALLBACK comes in handy when you\
    \ want to supply an additional cache resource to a resource that always has been\
    \ retrieved online when your connection is down.\n\nTo illustrate this feature,\
    \ let's imagine we can want an icon showing whether we are online or offline,\
