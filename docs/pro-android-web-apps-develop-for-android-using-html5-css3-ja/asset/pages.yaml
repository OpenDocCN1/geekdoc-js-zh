    # ## HTML for the Mobile Web


    HTML for the mobile web is the same as it is for the desktop–just with smaller
    screen sizes (in most cases at this stage). Additionally, there is an increased
    focus on optimizing for performance given the reduced bandwidth that a mobile
    device has access to when browsing via a mobile broadband connection.


    The focus in this chapter is on the techniques and tools required to make the
    jump into mobile web app development, primarily from an application presentation
    perspective.


