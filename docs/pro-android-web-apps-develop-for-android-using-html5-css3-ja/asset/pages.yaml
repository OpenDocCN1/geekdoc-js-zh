  md: "# Advanced Animation Techniques\n\nOur previous animation examples have been\
    \ a good introduction to implementing simple animation with the HTML5 canvas,\
    \ but the animations obviously weren't smooth. In this section, we will investigate\
    \ techniques that will help to make the animation smoother and more believable.\n\
    \n# Creating Realistic Movement in Animations\n\nIn both of the previous examples,\
    \ we implemented primitive techniques for animating our display. For instance,\
    \ the car animation loop simply increased the x position of the car by 3 pixels\
    \ each time the function was called. Did anyone think that looked believable?\
    \ No, we didn't think so. Let's fix that for all.\n\nTo do this, we will use easing\
    \ to smooth the start or end of the animation (or both). For instance, applying\
    \ some appropriate easing to our animation would make the car accelerate to speed\
    \ or break to a stop.\n\nAs this isn't a book specifically focused on animation,\
    \ we won't go into depth on what is involved in creating an easing effect not\
    \ to write code from the ground up. Rather, we will use some of Robert Penner's\
    \ easing equations (www.robertner.com/easing) to create a more realistic effect\
    \ of motion for our car. These equations were written for Flash, but use JavaScript\
    \ libraries that implement easing and you will find a reference to Robert's excellent\
    \ work.\n\nIt's likely we will make use of these easing equations again, so let's\
    \ add them to our probewaps.js file:\n\n```\nPROWEBAPPS = (function() {\n\nvar\
    \ module = {\n  ...\n  Easing: (function() {\n    var subModule = {\n      Linear:\
    \ function(t, b, c, d) {\n        return c*t/d + b;\n      },\n      Sine: function(t,\
    \ b, c, d) {\n        return -c * Math.cos(t/d) * (Math.PI/2) + c + b;\n     \
    \ },\n      Out: function(t, b, c, d) {\n        return c * Math.sin(t/d) * (Math.PI/2)\
    \ + b;\n      },\n      InOut: function(t, b, c, d) {\n        return -c/2 * (Math.cos(Math.PI*t/d)\
    \ - 1) + b;\n      }\n    };\n```"
