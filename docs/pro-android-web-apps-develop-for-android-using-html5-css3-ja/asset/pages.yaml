    To sign our application, the first thing you do is generate a private key. This
    can be achieved by running the following command (however, you should change both
    the keystore and alias to something more appropriate for your configuration):


    ```

    keytool -genkey -v my-release-key.keystore -alias alias_name -keyalg RSA

    keystore 2048 -validity 10000

    ```


    Running this command shows output similar to that shown in Figure 12–19.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_343_0.png)


    Figure 12–19. If you don''t already have one, you will need to generate a private
    key to sign your application.


    With your keystore created, we can now modify your build.properties file and specify
    its location so the build script can sign your application as part of the build
    process. With your application requirements, there are no additional settings
    required in this file, after the key.store and key.alias properties are added,
    our build.properties file should look like the following:


    ```

    key.store=/path/to/release-key.keystore

    key.alias=your_alias

