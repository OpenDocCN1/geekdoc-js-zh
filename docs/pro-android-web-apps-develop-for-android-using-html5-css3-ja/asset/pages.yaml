    \ App Engine command:\n\n```\ndev_appserver location=/to/you/war/folder\n```\n\
    \nThis will start the Google App Engine server locally, open your favorite browser,\
    \ and go to http://localhost:8080/samples/bbs.hbs.html. You should not be able\
