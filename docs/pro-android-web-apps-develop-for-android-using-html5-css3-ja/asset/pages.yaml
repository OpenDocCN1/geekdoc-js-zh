  md: "# Table 6–2. The Coordinates Object\n\n| Property Name | Type |\n| --- | ---\
    \ |\n| longitude | double |\n| latitude | double |\n| altitude | double |\n| accuracy\
    \ | double |\n| altitudeAccuracy | double |\n| heading | double |\n| speed | double\
    \ |\n\nThat may seem like a lot of information, but for now we are really interested\
    \ in two attributes: longitude and latitude, which will be enough to determine\
    \ geolocation and eventually display it on a map. So, position.coords.longitude\
    \ and position.coords.latitude are the properties we want to handle.\n\nLet's\
    \ take advantage of the local storage feature discussed previously, and to store\
    \ our position on the browser side when we start our application so we will be\
    \ able to access this information whenever we want. First, we have to retrieve\
    \ our location—let's do that inside the ready function and store the location\
    \ in the callback function:\n\n```\n$(document).ready(function() {\n  [..]\n \
    \ navigator.geolocation.getCurrentPosition(\n    storePosition(position) {\n \
    \ });\nlocalStorage.setItem('longitude',position.coords.longitude);\nlocalStorage.setItem('latitude',position.coords.latitude);\n\
    \  .html(\"Your position : \" + position.coords.latitude +\n    +\" + position.coords.longitude);\n\
    \  .css(\"display\", \"block\");\n});\n```\n\nNotice that at the end of the function\
    \ we manipulate the geolocation DOM element; this will be an information banner\
    \ displayed on the main screen that shows our current position. So we also add\
    \ a geolocation id=\"geolocation\" element on the main screen:\n\n```\n<div id=\"\
    geolocation\"></div>\n```\n\nNext, we apply some styling:\n\n```\n#geolocation\
    \ {\n  margin: 8px 6px 2px 6px;\n  padding: 6px 14px;\n```"
