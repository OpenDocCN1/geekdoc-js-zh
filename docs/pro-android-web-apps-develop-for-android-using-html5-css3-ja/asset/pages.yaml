  md: 'By adding these parameters, Google App Engine will take care of setting the
    right content type for files with a manifest extension. Now that the server is
    configured, it''s time to create our cache manifest. Create an empty text file
    named cache.manifest that starts with this line: CACHE MANIFEST. We will place
    this file at the root of the web application (i.e., directly under the war folder).


    The next step is to list all the resources we want to cache—for us that will be
    the following:


    +   - snippets/06/todolist.html

    - snippets/06/css/proui.css

    - snippets/06/todolist.css

    - js/jquery-1.4.2.min.js

    - js/jquery.validate.js

    - js/prowebapps.js

    - snippets/06/iscroll.js

    - snippets/06/todolist.js


    These are all the static resources we need to run the application; we just have
    to add them to the cache manifest file (except the todolist.html file, which will
    be cached implicitly):


    ```

    CACHE MANIFEST

    css/proui.css

    snippets/06/todolist.css

    js/jquery-1.4.2.min.js

    js/jquery.validate.js

    js/prowebapps.js

    snippets/06/iscroll.js

    snippets/06/todolist.js

    ```


    The paths are relative to the location of the manifest file, but you could also
    use the absolute paths. Now finally have to declare the manifest file in our application,
    which we do by adding an entry inside the HTML tag of the application page:


    ```

    <html manifest="cache.manifest">

    ```


    That''s it! The application is ready to be cached the next time we access it (online,
    of course). To check out that the files are properly cached, we will use Chrome''s
    web console:


    Creating Cache with manifest: localhost:8080/cache.manifest

