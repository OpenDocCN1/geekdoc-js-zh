    \ what the valid items for each screen, and, additionally, what action should\
    \ be taken for any given menu item.\n\n# Creating a View Manager\n\nThere are\
    \ a variety of different approaches that could be used to prevent our having to\
    \ write static HTML over and over again. For instance, we could use CSS classes\
    \ as the jQuery validation plug-in that was used in the previous chapter, and\
    \ then build JavaScript code to read the information out of the CSS classes and\
    \ configure our application. In this particular case, however, we are going to\
    \ write a ViewManager submodule for prowebapps.js file that we will configure\
    \ from our application JavaScript file.\n\nThe outline of the PROWEBAPPS.ViewManager\
    \ module is shown here:\n\n```\nViewManager: function() {\n  views = {};\n  activeView\
    \ = null;\n}\n\nfunction switchView(oldView, newView) {\n  // switch views here\n\
    }\n\nvar subModule = {\n  activate: function(viewId) {\n    // save the old view\n\
    \    oldView = activeView;\n\n    if a view id has been specified, but doesn't\
    \ exist in the views, check\n    for a div\n    if (viewId && (!views[viewId]\
    \ && (jQuery(\"#\" + viewId).get(0))) {\n      subModule.define({\n        id:\
    \ viewId\n      });\n    } if\n\n    // update the active view\n    activeView\
    \ = viewId ? views[viewId] : null;\n\n    // update the associated ui elements\n\
    \    switchView(oldView, activeView);\n  },\n\n  getActiveView: function() {\n\
    \    return activeView ? jQuery(\"#\" + activeView.id) : null;\n  },\n\ndefine:\
    \ function(args) {\n    args = jQuery.extend({\n      id: '',\n      actions:\
    \ []\n    });\n```"
