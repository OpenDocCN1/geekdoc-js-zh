  md: "While we won't go through the code in detail here, if you are interested in\
    \ working through our previous example of saving objects would like using the\
    \ Web SQL Database of Web Storage, we have provided an example implementation\
    \ at the following location:\n://sidelab.com/pawa/snippets/03/webstorage-test-webdb.js.\n\
    \nGiven the amount of material there is to, we will focus on implementing a local\
    \ database reading and using the Web SQL Database API. This will be covered in\
    \ the next example.\n\n# Saving To-Do List Items with a Client-Side Database\n\
    \nIn this exercise, we will use the Web SQL Database API to save-do list items\
    \ to a client-side database for later use. We will work with the methods outlined\
    \ previously to do this.\n\nBy creating a submodule TODOLIST.Storage in your JavaScript\
    \ application code, you will be responsible for handling interaction with the\
    \ database for the application. It is important to encapsulate this functionality,\
    \ as it gives you the option to use an alternative storage mechanism (e.g., the\
    \ Web Storage API) at a later date without affecting the rest of the application\
    \ code.\n\nThe following code should be added to the module definition in the\
    \ todolist.js file (remember to include a comma if this isn't the last member\
    \ of the module array):\n\n```\nStorage: function() {\n  // open/create a database\
    \ for the application (expected size ~ 100K)\n  var db = openDatabase(\"todolist\"\
    , \"1.0\", \"To Do List Database\", 100 * 1024);\n\n  // check that we have the\
    \ required tables created\n  db.transaction(function(transaction) {\n    transaction.executeSql(\n\
    \      \"CREATE TABLE IF NOT EXISTS task(\" + \n        \" name NOT NULL, \" +\
    \ \n        \" description TEXT, \" + \n        \" due DATETIME);\");\n    );\n\
    \n    return {\n    saveTask: function(task, callback) {\n      db.transaction(function(transaction)\
    \ {\n        transaction.executeSql(\n          \"INSERT INTO task(name, description,\
    \ due) VALUES (?, ?, ?);\",\\ \n          [task.name, task.description, task.due]\n\
    \        );\n      });\n    }\n    };\n  });\n}();\n```\n\nAt this stage, TODOLIST.Storage\
    \ has only two functions:"
