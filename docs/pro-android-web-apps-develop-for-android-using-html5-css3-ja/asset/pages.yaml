  md: "```\n));\n\n$(\"clear\").click(function() {\n  items = null;\n  PROEBAPPS.Storage.remove(\"\
    listitems\");\n  displayItems();\n});\n```\n\nOnce again, this is very simple\
    \ code. In the case of the add handler, we push a new\nobject onto the array using\
    \ the title of the item and the current date time (represented in\nmilliseconds),\
    \ save the items to storage, and refresh the display.\n\nThe clear handler is\
    \ even simpler. We reset the items variable back to null,\nremove listitems from\
    \ local storage, and update the display.\n\n# Local vs. Session Storage\n\nAs\
    \ shown in the code previously, there is no difference between localStorage and\n\
    sessionStorage—not in terms of the actual interaction at least. In fact, the only\n\
    difference is the length of time the data is actually stored and what the data\
    \ considers to\n its owner.\n\nIn the case of local storage, the data is persistent\
    \ and will not be removed unless it's\nrequested to be removed by the user (e.g.,\
    \ by browser settings).\n\nIn the case of session storage, the data lasts only\
    \ as long as the browsing context\n(which is usually terminated when the browser\
    \ window closes). Additionally, browsers\nmaintain separate sessionStorage objects\
    \ for windows or tabs; local\nstorage, on the other hand, will be shared between\
    \ windows and tabs.\n\n> NOTE: In some detailed analysis of how multiple windows/tabs\
    \ interact with Web Storage,\nit became clear that the implementation of the PROEBAPPS.Storage\
    \ module currently\\contains a flaw. It is possible for two windows to overwrite\
    \ each other's changes in\nlocalStorage. In sessionStorage, however, there are\
    \ no collisions.\n\nFor both localStorage and sessionStorage, data is stored on\
    \ a per-origin basis. An origin\nrefers to the site when the page was loaded,\
    \ and basically means that site B will\not be able to access client-side data\
    \ created by site A (which makes sense).\n\n# The Web SQL Database\n\nNow that\
    \ we have worked with the Web Storage API, it's appropriate that we get\nacquainted\
    \ with Web Storage's cousin—the Web SQL Database. Given the more\ncomplicated\
    \ nature of this storage API, we will cover it here and then run through\nmore\
    \ concrete examples when we build the GeoMiner application later in the book."
