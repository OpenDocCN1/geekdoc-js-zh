  md: '# Table 2-1. viewport Meta Tag Parameters and Their Effects


    | Parameter | Overview | Valid Values |

    | --- | --- | --- |

    | width | Specifies the width of the viewport. This can be a specific value in
    pixels (not recommended) or keywords that describe the required display width.
    | device-width: The screen width of the device. A numerical value for the absolute
    width of the viewport. |

    | height | Specifies the height of the viewport. | device-height: The screen height
    of the device. A numerical value for the absolute height of the viewport. |

    | user-scalable | Specifies whether the user is permitted to adjust the scaling
    of the screen. | 1, yes, or true: User scaling is permitted. 0, no, or false:
    User scaling is not allowed. |

    | initial-scale | Specifies the initial scaling value for the display. | A value
    that indicates the scaling will be applied when the page is initially loaded.
    A value of 1.0 indicates that 1 viewport pixel equates to 1 screen pixel. |

    | minimum-scale | Specifies the minimum scaling that can be applied to the display.
    | A value in the range of 0 to 10.0. |

    | maximum-scale | Specifies the maximum scaling that can be applied to the display.
    | A value in the range of 0 to 10.0. |

    | target-dpi | Informs the device exactly what screen density web page/application
    was designed for. | device-dpi: Set the viewport density to match the dpi density
    of the device. high-dpi, medium-dpi, or low-dpi. A value in the range of 70 to
    400 specifying the specific pixel density of the device. |


    # Android-Specific Meta Tag Parameters


    > * dpi (dots per inch) is a measure of screen pixels per inch (DPI stands for
    Dots Per Inch). The Android platform caters for devices of varying pixel densities
    and broadly categorizes those into high, medium, and low.'
