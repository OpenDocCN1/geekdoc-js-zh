    \ required\n\n+   - To save a to-do list item in the task table\n\nWe then create\
    \ what might be called a DTO (data transfer object) POJO (plain-old Java object)\
    \ in other languages to capture the details of a to-do list item. In future exercises,\
    \ we will refer to these as POJOs, since the acronym almost as well for JavaScript\
    \ as it does for Java.\n\nAs per the preceding Storage code, Task is added to\
