    ```\n\n# Running Your Application Offline\n\nWith all of the design work we've\
    \ done, it will be hard for the average user to tell\nour application is native\
    \ or web-based. However, there is still one big\ndifference: cut off your Internet\
    \ connection (or put your device in airplane mode) and\nrefresh your application,\
    \ and you'll probably get a \"page not found\" error. What we need\nis now a way\
    \ of running our application offline!\n\nAgain, the new HTML5 standard will come\
    \ to rescue with its offline application\ncache. The new HTML5 feature will cache\
    \ for us on the client side all the static\nresources: HTML, images, CSS, and\
    \ JavaScript. The next time the user navigates to\nour application, the browser\
    \ will use cache instead of retrieving the files from the\nserver, regardless\
    \ of the connection status.\n\n# The Offline Cache Manifest File\n\nHow does it\
    \ work? Offline caching the cache manifest file that is hosted on the\nweb server.\
    \ It is a simple text document containing all the resources that have to be\n\
    cached. The first important thing is the content type of your file. It has to\
    \ be served with\nthe MIME type/cache-manifest. So, let's see how we can configure\
    \ Google App\nEngine (in the previous chapter) to set the right MIME type for\
    \ your cache file.\nExtra MIME type definitions are specified in the web.xml file\
    \ that you will find under your\nwar/web-inf folder:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<web-app xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \ version=\"2.5\">\n  <mime-mapping>\n    <extension>manifest</extension>\n  \
    \  <mime-type>text/cache-manifest</mime-type>\n  </mime-mapping>\n</web-app>\n\
    ```\n\n*"
