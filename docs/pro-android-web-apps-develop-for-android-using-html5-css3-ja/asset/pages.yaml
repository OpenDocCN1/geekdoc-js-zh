    # # Web Server


    Having a web server serving your application code as you develop it really helps
    streamline your development process. Throughout the book we will be working primarily
    with client-side technologies, so our requirements for a web server are quite
    lightweight. This means pretty much any web server will do the job, if you already
    have a web server that you wish to work with, that is absolutely fine.


    For those who don''t, however, we will quickly walk through a lightweight server
    called Mongoose running on Windows, Mac OS, and Linux. Mongoose is extremely simple
    to get running; just follow the installation guide for your platform as described
    (there may be some differences depending on your individual configuration).


    # # Mongoose on Windows


    Firstly, download the Mongoose standalone executable (mongoose-2.8.exe at the
    time of writing) from the project downloads page: http://code.google.com/p/mongoose/downloads/list.


    There is an installer package available, but installing Mongoose as a service
    will be as simple as installing the standalone executable. Once the file has been
    downloaded, put the executable file somewhere on your path (recommended but not
    required), and then skip to the “Running Mongoose” section of this chapter.


    # # Mongoose on Mac OS


    The simplest way to install Mongoose on Mac OS is by using MacPorts (www.macports.org).
    If you don''t have MacPorts installed, install it now by following the simple
    instructions provided on the MacPorts web site.


    With MacPorts installed, to install Mongoose run the following command:


    ```

    sudo port install mongoose

    ```


    If MacPorts is installed correctly, this should download, build, and install Mongoose,
    after which it should be ready for your immediate use. Proceed to the “Running
    Mongoose” section of this chapter.


    # # Mongoose on Linux


    With Mongoose being so lightweight, it is actually very simple to build Mongoose
    from source on Linux systems. The following instructions are for systems running'
