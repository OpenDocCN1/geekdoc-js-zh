- img_proc: true
  md: '# Chapter 8


    # # Location-Based Services and Mobile Mapping


    The focus of the next four chapters will be on location-based services and building
    a geosocial game utilizing data from the geosocial network Gowalla (http://gowalla.com).
    If the terms location-based service and geosocial network mean little to you now
    (or if you''ve never heard of Gowalla), don''t worry—they will be explained soon.


    As far as coding in this chapter, we will be looking at a couple of different
    mobile-friendly mapping APIs (Google Maps and Tile5) and how to render a simple
    map using them. We will go deeper into the Google Maps API and look at how to
    display markers and interact with the map. While it would be great to do focus
    on a single solution to get through all the content. Additionally, Google presently
    presents one of the most robust mapping solutions for mobile, so it makes sense
    to use its API in this book.


    # ## Location-Based Services


    The term location-based service is generally used to define an information service
    that provides data based on geographical position (see http://en.wikipedia.org/wiki/location-based_service
    for more information). Location-based services have risen in popularity recently
    and will continue to do so as more consumers acquire location-aware mobile devices.


    One excellent example of using a location-based service is searching for an ATM
    (automated teller machine) that is close to your current location. Figure 8–1
    shows an example of the native Google Maps application on Android showing that
    kind of information.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '![](img/6c8091bf3a3d21ca91f25f8caed8840f_173_0.png)


    **Figure 8–1.** Google Maps providing nearby ATM locations is one example of a
    location-based service.


    Another example is an application called Urbanspoon (www.urbanspoon.com), which
    offers information on restaurants, including user reviews. A mobile screen capture
    from the Urbanspoon application "Near Me" is shown in Figure 8–2.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_173_1.png)


    **Figure 8–2.** Urbanspoon offers restaurant suggestions for nearby locations,
    complete with user ratings.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'An interesting point about the Urbanspoon application is that, while the application
    is deployed as a native app, both of the results shown here were pulled down from
    the Web and embedded into the native application using a WebView (see http://developer.android.com/reference/android/webkit/WebView.html).
    This is a similar technique to what we will be looking at in the next chapter
    PhoneGap (see://phonegap.com), and is an excellent way to deploy an application
    to the Android marketplace using web technologies for building most of the application.


    There are many examples of location-based applications available both on the Web
    and in the Android marketplace.


    # Geosocial Networking


    Geosocial networks (see http://en.wikipedia.org/wiki/Geosocial_networking for
    more info) have started to evolve over the last couple of years; they''re essentially
    a result of the combination of location-based services and social networks (see
    http://en.wikipedia.org/wiki/Social_network for social networks). The current
    geospatial networks have fewer participants than the leading social networks,
    but with the rollout of Facebook Places (www.facebook.com/pplaces) geospatial
    networking is starting to hit the online mainstream.


    Geosocial networking revolves around the concept of check-ins. A check-in is at
    a particular place, spot, or venue (different geospatial networks use different
    terminology). In addition to registering that they are at a particular place,
    a user can also perform other actions that are associated with the venue. Depending
    on the social network, tips, tasks, or photos can be left by a user for others
    on the geospatial network to see.


    A very interesting part of geosocial networks is the way in which the real world
    and virtual world interact. For instance, most social networks give rewards to
    users for regular check-ins or for having the most check-ins for a particular
    place (Foursquare calls the person with the most check-ins the mayor). Some businesses
    that have registered as places in the geospatial networks can use those geospatial
    rewards to provide discounts to regular customers. In this turn incentivizes geosocial
    users to regularly visit and check into venues, and also to participate in the
    geospatial network.


    Figure 8–3 shows the screen captures from two major geosocial networks: Foursquare
    and Gowalla.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# CHAPTER 8: Location-Based Services and Mobile Mapping


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_175_0.png)


    **Figure B–3.** Foursquare and Gowalla are two of the larger geospatial networks.


    A concept in geospatial networks is that the locations (places, spots, or venues)
    are user contributed. For instance, if you used Foursquare you went to a new restaurant
    and wanted to check in there, but couldn''t find it in the list of places, you
    could create it, which would allow both you and others to check in at that location.
    Using this technique, a geospatial network with an active community can quickly
    gather a large list of places.


    Hopefully that provides some background information on how location-based services
    and geospatial networking. Let''s get back to coding using some maps.


    # Mobile Mapping


    While there are quite few dozen JavaScript mapping APIs available, very few of
    those have been optimized for (or even work on) mobile devices. At the time of
    writing, the primary thing is lacking in most of the existing mapping APIs is
    support for mobile devices. Thankfully, this is not the case with the Google Maps
    API, so we will be able to run through some sample code using that API.


    In this section, we will have a look at implementing mobile maps for both Google
    Maps and a fairly new HTML5 mapping API called Tile5 (www.tile5.org). For both
    APIs, we will walk through the process of displaying a simple map, and then we
    will go on with the Google API to work through some samples in more detail.'
