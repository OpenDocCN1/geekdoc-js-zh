  md: "# Database Versioning and Upgrades\n\nThe Html implementation of the Web SQL\
    \ Database has already been quite well thought through, and provides a mechanism\
    \ to apply version changes to our client-side databases when a new version of\
    \ our application is deployed. This involves the use of the changeVersion method\
    \ on specify the old version, the new version, and a transaction callback to execute,\
    \ in order to apply any updates required to move from one version to the next.\
    \ Additionally, optional error and success callbacks can be utilized to monitor\
    \ and respond to particular response conditions.\n\nFor instance, in the next\
    \ chapter we are going to add some functionality to our to-do list application\
    \ to allow user to mark items as complete. This is obviously a good idea, but\
    \ the database is clearly lacking a place to store a completed flag or date. Time\
    \ to fix and create version 1.1 of our database.\n\nThe following code shows how\
    \ we can replace our original openDatabase call in the TODOlistStorage module\
    \ with one that can handle either version 1.1 or version 1.0 of the database,\
    \ and upgrade version 1.0 appropriately:\n\n```\nvar db = null;\nntry {\n  db\
    \ = openDatabase(\"todolist\", \"1.1\", \"To Do List Database\", 100 * 1024);\n\
    \n// check that we have the required tables created\ndb.transaction(function(transaction)\
    \ {\n  transaction.executeSql(\n    \"CREATE TABLE IF NOT EXISTS task(\" +\n \
    \   name TEXT NOT NULL, \" + +\n    description TEXT, \" + +\n    due DATETIME,\"\
    );\\n  );\n});\ncatch (e) {\n  db = openDatabase(\"todolist\", \"1.0\", \"To Do\
    \ List Database\", 100 * 1024);\n\n// check that we have the required tables created\n\
    db.transaction(function(transaction) {\n  transaction.executeSql(\n    \"CREATE\
    \ TABLE IF NOT EXISTS task(\" +\n    name TEXT NOT NULL, \" + +\n    description\
    \ TEXT, \" + +\n    due DATETIME,\");\\n  );\n});\n\ndb.changeVersion(\"1.0\"\
    , \"1.1\", function(transaction) {\n  transaction.executeSql(\"ALTER TABLE item\
    \ add completed DATETIME;\");\n});});\n```\n\nWe'll be honest again and say that\
    \ we're not huge fans of this implementation. It works, but we wonder how scalable\
    \ it is when you are rolling out your 13th application update"
