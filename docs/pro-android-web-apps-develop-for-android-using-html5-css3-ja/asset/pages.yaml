  md: 'and corresponding database change. (Of course, one database change per app
    update would be very bad planning, but you get our point.)


    # Summary


    We have explored two powerful mechanisms for storing data on the client side in
    this chapter. While not one of the shiniest toys in the HTML5 bag of tricks, it''s
    certainly one of the game changers. Being able to store different types of data
    on the client side is going to create many opportunities for mobile web apps over
    the next few years.


    In addition to the actual mechanics of Web Storage and the Web SQL Database, we
    also investigated ways of effectively encapsulating that and other functionality
    in web apps using the JavaScript pattern. You can probably tell how important
    we think it is for building serious apps using JavaScript, but we promise''ll
    back off a little in the following chapters.


    In the next chapter, we will finish our to-do list application by adding a view
    to display our to-do list items, and also a way to mark them as complete. At this
    point, we will go beyond single-page examples into a multiple-view/screen application.
    We will investigate ways to build this kind of functionality as well as briefly
    explore libraries that offer this functionality already.'
