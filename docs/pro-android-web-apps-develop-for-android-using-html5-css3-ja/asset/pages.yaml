    \ an up-and-running, ultra-scalable online storage solution, we can go back to\
    \ our de-application to start implementing the synchronization process.\n\nSince\
    \ jasonengine is a web application, not just a storage client, it can serve content,\
    \ making it ideal for the mobile web application we're built. All the code we've\
    \ implemented (HTML, JavaScript, and CSS) can be hosted inside jasonengine's instance.\n\
    \nTake a look at jasonengine's distribution. It has a war folder containing a\
    \ classic web application structure (CSS, JS, etc.). If you have all your resources\
    \ inside the right folders, with a single command from the App Engine SDK, you\
    \ can actually deploy your application—which is pretty neat. When you deploy your\
    \ application, the folder is packaged in a WAR archive. (A WAR archive is simply\
    \ the enterprise version of a JAR (Java archive format); it functions just like\
    \ a ZIP file).\n\nLet's perform a quick test to ensure that jasonengine does indeed\
    \ serve web assets in addition to JSON data. Take the sample code from Chapter\
