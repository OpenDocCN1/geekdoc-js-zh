  md: '# CHAPTER 7: Exploring Interactivity


    +   - The "constant" ANIMATION_DURATION is used to set the time that the animation
    will run.


    +   - Each time the animate function is called, and when the animation is first
    triggered (in the touchstart handler), we use a call to new Date().getTime() to
    determine the time in milliseconds. In the context of the animate function, we
    use that figure to determine how much time has elapsed since the animation started.


    +   - The calculation of the car variable has changed to use the PROWEBAPPS.Easing.Linear
    function. This variable can now be declared locally in that function. The Linear
    easing doesn''t actually perform any easing. Once we have validated our modifications,
    we will drop the Sine easing functions to replace the Linear easing.


    +   - Determining that the animation has reached its final value is now done based
    on elapsedTime and the animation duration. This is done as some easing functions
    return higher values than the destination on the way to the end value (sounds
    confusing, but you''ll see).


    Running this sample should display the car animating, but still show an animation
    that doesn''t look any smoother—the car stops very abruptly. Let''s fix that now.
    Replace the reference to PROWEBAPPS.Easing.Linear with PROWEBAPPS.Easing.Sine.Out,
    and you should see the car slow down as it approaches the x coordinate of your
    touch start point.


    > NOTE: The majority of Penner''s easing equations come in three variants: In,
    Out, and InOut. The In variant will apply the easing at the beginning of the animation,
    and in case of our car, this means it will start slow and speed up. Easing means
    values will have easing applied as the animation approaches its final value, which
    is exactly what we want with our car—for it to slow to a stop. An InOut easing
    function applies easing at both the start and end of the animation. We''d recommend
    playing around with the different variants to get a feel for how they work.'
