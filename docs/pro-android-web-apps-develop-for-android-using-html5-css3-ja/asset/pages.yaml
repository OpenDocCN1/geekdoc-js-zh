  md: "```\nfunction synchronizeOnline() {\n  $(\"spinner\").show();\n  ...\n  $(\"\
    spinner\").hide();\n}\n```\n\nThat's all we have to do. Notice the jQuery's hide\
    \ and show functions, which encapsulate CSS manipulation for us.\n\n# Adding Scrollable\
    \ Content\n\nAs our tasks continues to grow, we will not end up fitting on the\
    \ screen anymore. Of course, the browser will naturally initialize a vertical\
    \ scrollbar, but when you scroll down, your top bar containing the title will\
    \ disappear. Remember, we are competing with native apps, and this kind of behavior\
    \ is not exactly what we are hoping for.\n\nFortunately, there is a JavaScript\
    \ library that will help us fix this visual problem: iScroll (http://cubic.org/isccroll).\
    \ This piece of JavaScript can make a particular container scrollable. When you\
    \ import your script into the page, you will have to declare a scrollable instance\
    \ variable: myScroll = new iScroll('scroller');\n\nLet's see how we integrate\
    \ this in our application. The only part where we need this is in the All Tasks\
    \ screen, so let's see how we refactor this element:\n\n```\n<div id=\"alltasks\"\
    \ class=\"view\">\n  <h1 class=\"fancy\">All Tasks</h1>\n  <div id=\"wrapper\"\
    >\n    <div id=\"scroller\">\n      <ul id=\"tasklist\"></ul>\n    </div>\n  </div>\n\
    </div>\n```\n\nNotice how the div is scrolled by another div that will have a\
    \ fixed size. Here is the CSS of the wrapper div:\n\n```\n#wrapper {\n  position:relative;\n\
    \  z-index:1;\n  width:auto;\n  overflow:hidden;\n}\n```\n\nYou may wonder why\
    \ we are not setting the height, since the wrapping container must have a fixed\
    \ height. That's because we will set the height programmatically, ensuring it\
    \ will be correct when the screen size changes. This brings us to the JavaScript\
    \ part—we just have to fire an iScroll instance and set the height. We put that\
    \ in the ready function because it is initialized when the page loads.\n\n```\n\
    $(document).ready(function() {\n  ...\n  myScroll = new iScroll('scroller', [desktopCompatibility:true]);\n\
    \  var wrapperH = window.innerHeight - 35;\n  document.getElementById('wrapper').style.height\
    \ = wrapperH;\n});\n```"
