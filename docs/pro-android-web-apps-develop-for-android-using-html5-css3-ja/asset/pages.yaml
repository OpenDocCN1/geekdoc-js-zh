  md: '# Tile5: An Alternative HTML5 Mapping API


    While in cases the Google Maps API is the best choice for your application, there
    are times it just isn''t an option—perhaps due to licensing restrictions (you
    may want to display advertising over Google ads) or a particular client''s needs.
    One example of this would be a client that wants to use its own mapping server
    for maps—it''s more common than you think.


    Tile5 (http://tile5.org) is an open source JavaScript library developed to provide
    a mobile device-friendly mapping solution that can support multiple map providers.
    Presently, the majority of mapping APIs you tie to a particular map provider (OpenLayers—http://openlayers.org—is
    a notable exception on the desktop). For some users, this restriction is completely
    acceptable, while others regularly need to work with different mapping services,
    and having to change between APIs can be quite frustrating. This is where Tile5
    on mobile, and OpenLayers on the desktop, come into their own.


    As Tile5 is targeted at modern smartphone devices (at the time of writing, Android
    support is in progress but not yet stable), it is able to make use of HTML5. While,
    at this stage, the use of HTML5 only provides an experience comparable with other
    non-HTML5 mapping, we are likely to see hardware-accelerated HTML5 implementations
    soon, and that is to make things very exciting.


    The following code sample shows the equivalent code required to display a map
    in a similar fashion to the previous example using Google Maps. For this example,
    Tile5 connects to the CloudMap (http://cloud.com) mapping servers, which serve
    image tiles generated from OpenStreetMap data. If you''re not already familiar
    with the OpenStreetMap (http://openstreetmap.org) initiative, then it''s definitely
    worth taking a look at. In its own words, it is "free editable map of the whole
    world." Essentially as we have the ability to add and update information on the
    map the same way that Wikipedia is an encyclopedia that is maintained by all people
    over the world, OpenStreetMap is a street map and with many masters.


    ```

    <!DOCTYPE html>

    <html>

    <title>Simple Tile Maps | Pro Web Apps</title>

    <meta name="viewport" content="width=device-width;initial-scale=1.0; maximum-scale=1.0,user-scalable=0"/>

    <link rel="stylesheet" media="screen" href="../css/poiui.css" />

    <style type="text/css">

    html { height: 100% }

    body { height: 100%; margin: 0px; padding: 0px }

    </style>

    <script type="text/javascript" src="../js/jquery-1.4.2.min.js"></script>

    <script type="text/javascript" src="../js/powebapps.js"></script>

    <script type="text/javascript" src="http://www.tiles.org/jsapi/0.9.1/tile5.js"></script>

    <script type="text/javascript" src="http://www.tiles.org/jsapi/0.9.1/tile5.osm.js"></script>

    ```'
