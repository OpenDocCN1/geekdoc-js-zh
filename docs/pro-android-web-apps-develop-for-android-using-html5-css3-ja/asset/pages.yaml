  md: "More important than how the preceding code works (which is relatively simple\
    \ once you break down) is how we will be able to use it. Basically, we now have\
    \ three functions that permit more complex storage at our disposal for interacting\
    \ with the HTML5 Web Storage functionality:\n\n+   - PROEBAPPS.Storage.get(key,\
    \ scope)\n  - key is a string value to identify the entry.\n  - scope can be optionally\
    \ specified as \"session\" (i.e., as a string) if you want to store in session\
    \ storage instead of local storage.\n- PROEBAPPS.Storage.set(key, value, scope)\n\
    \  - As per the get method, the key is a string value to identify the entry.\n\
    \  - value is the data that we wish to save to Web Storage. (This can be a simple\
    \ value, array, object, etc.) Arrays and objects are serialized using JSON and\
    \ then stored as strings\n  - scope (optional) specifies which key value will\
    \ be saved to session or local storage. Passing no value to this parameter means\
    \ that the value will be saved to local storage.\n- PROEBAPPS.Storage.remove(key,\
    \ scope)\n  - key is a string value used to specify the entry that will be removed\
    \ from storage.\n  - The scope parameter (if supplied) will specify whether session\
    \ or local storage should be used. If no value is supplied, then local storage\
    \ is used by default.\n\nNow we have this functionality at our disposal, let's\
    \ have a look at storing JavaScript objects and arrays using our PROEBAPPS.Storage\
    \ functions. We will do this by creating our web-test.js file, which will be used\
    \ to power this local test application:\n\n```\n$(document).ready(function() {\n\
    \  // read the data from local storage for the items\n  var items = PROEBAPPS.Storage.get(\"\
    listitems\");\n  var loadTicks = new Date().getTime();\n\nfunction displayItems()\
    \ {\n  loadTicks = new Date().getTime();\n\n  $(\"items li[class!header\").remove();\n\
    \  if (items) {\n    // create list items to display the current items\n    for\
    \ (var i = 0; i < items.length; i++) {\n      var itemAge = Math.floor(loadTicks\
    \ - items[i].created) / 1000;\n      $(\"items\").append(\"<li>\" + items[i].title\
    \ + \" (created \" + itemAge + \"s ago)</li>\");\n    }\n  } //\n```"
