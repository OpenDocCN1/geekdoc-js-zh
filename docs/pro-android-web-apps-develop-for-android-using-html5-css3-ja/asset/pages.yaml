  md: "```\n}\n);\\ // getTasks\n} getTasks\n```\n\nThis function requests all the\
    \ data stored in the task table of the database and populates an array with Task\
    \ objects. This array is then passed through the getTasks function call. The method\
    \ is also written so that it accepts an optional parameter, extraClauses, which\
    \ allows the function to add extra SELECT statement. This could include WHERE\
    \ statements (as per the code following) or additionally ORDER BY statements that\
    \ would then help sort the tasks in a particular order.\n\n> CAUTION: The reference\
    \ here to results.rows.item(index) is not consistent with the current draft of\
    \ the Web SQL database specification. It is, however, the behavior that is implemented\
    \ in most browsers presently. While we would have expected that browsers change\
    \ to match the specification, the way by the W3C to deprecate the specification\
    \ probably mean that the functionality will remain as is.\n\nLet's add some methods\
    \ to the Storage module that will allow those using the module to access the saved\
    \ tasks:\n\n```\nStorage: (function() {\n\nvar submodule = {\n  getIncompleteTasks:\
    \ function(callback) {\n    getTasks(callback, \"WHERE completed IS NULL\");\n\
    \  },\n\ngetTasksInPriorityOrder: function(callback) {\n    subModule.getIncompleteTasks(function(tasks)\
    \ {\n      callback(tasks.sort(function(taskA, taskB) {\n        return taskA.due\
    \ - taskB.due;\n      }));\n    });\n  },\n\ngetMostImportantTask: function(callback)\
    \ {\n    subModule.getTasksInPriorityOrder(function(tasks) {\n      callback(tasks.length\
    \ > 0 ? tasks[0] : null);\n    });\n  }\n};\n\nreturn submodule;\n})();\n```\n\
    \nHere we have added three methods:"
