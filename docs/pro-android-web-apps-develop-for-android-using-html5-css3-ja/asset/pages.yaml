    a mobile web app. It Included a look at the viewport meta tag, and explored some
    of the CSS3 styles that can be used in Android''s WebKit browser to create a clean
    user interface. It also covered some of the extra things to be considered when
    creating web apps for mobile devices, including device orientation changes and
    the extra constraints applied when designing an app limited screen real estate.
    Finally, we made the jQuery validate plug-in to bring robust forms validation
    into our application without having to write it from the ground up.


