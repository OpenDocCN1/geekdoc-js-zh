  md: 'With the preceding code implemented, you should be able to draw using touch
    on your Android device and simulate touch events in the emulator. Figure 7–3 shows
    an example.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_147_0.png)


    **Figure 7–3.** More advanced drawings are possible given the intuitive nature
    of the touch interface.


    The primary differences between this code and the mousecanvas.js file are:


    +   - With mouse events, mouse button information is included to signify whether
    the left, right, or other button was pressed. When it comes to touch events, we
    have no concept of varying buttons, and as such there is no need to monitor button
    states. Given this situation, the touchstart handler has no code to do this, and
    the touchend event handler does nothing and could quite simply be removed.


    +   - References to evt.pageX and evt.pageY are replaced with references to the
    touches array of the event object. In our example, we reference evt.touches[0].pageX
    and evt.touches[0].pageY to get the screen coordinates of the first touch.


    +   - The touchstart handler makes a call to the preventDefault method of the
    event object to tell the browser not to take any further action with this event.
    Without this call, the browser will initiate scrolling on the window; this is
    not desirable behavior, as it would interfere with our attempts to draw in the
    canvas area.


    With the canvas example complete, you should now have a basic understanding of
    how to use both the HTML5 canvas and touch interactivity to create some simple
    interactive mobile web apps. Time now to take this further.'
