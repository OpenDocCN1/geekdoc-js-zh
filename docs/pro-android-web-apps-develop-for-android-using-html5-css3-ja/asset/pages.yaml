  md: "# Drawing Interactively to the Canvas\n\nNow that we at least know how to create\
    \ a simple canvas, let's look at how we can do interactively to create some unique\
    \ mobile web apps. While jumping in and working with touch events would be great,\
    \ it's worth a little time to investigate how this is done using mouse events\
    \ first—given that this is probably more familiar to us.\n\nOnce we have the interactivity\
    \ built using mouse events in a desktop browser, we will then explore how similar\
    \ functionality would be implemented using touch events. By working with mouse\
    \ events in the first instance and moving to touch events, we will gain an understanding\
    \ of some important differences between mobile interactivity and desktop interactivity.\n\
    \n# Interactivity: The Way of the Mouse\n\nStart by copying the previous simplecanvas.html\
    \ to a new HTML file called mousecanvas.html, and change the script tag to reference\
    \ mousecanvas.js instead of simplecanvas.js.\n\nNext, let's create our mousecanvas.js\
    \ file. We'll start with the simplecanvas.js file as a base and make modifications\
    \ so that we are drawing in response to the mouse events rather than once the\
    \ document loads.\n\n```\nfunction() {\n  var canvas = null,\n  context = null,\n\
    \  buttonDown = 0;\n}\n\nfunction resetCanvas() {\n  canvas = document.getElementById(\"\
    simple\");\n\n  // set the canvas height to the window height\n  canvas.width\
    \ = window.innerWidth;\n  canvas.height = window.innerHeight;\n\n  // get a reference\
    \ to our drawing context\n  context = canvas.getContext(\"2d\");\n} // resetContext\n\
    }\n\n$(window).bind(\"resize\", resetCanvas).bind(\"orient\", resetCanvas);\n\n\
    $(document).ready(function() {\n  window.scrollTo(0, 1);\n  resetCanvas();\n})\n\
    \ndocument.body.addEventListener(\"mousedown\", function(evt) {\n  if (buttonDown\
    \ === 0) {\n    context.moveTo(evt.pageX, evt.pageY);\n  } // if\n\n  ++buttonDown;\n\
    }, false);\n```"
