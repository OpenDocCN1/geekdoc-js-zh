    # Jo


    The first framework that we will be having a look at Jo. Jo follows a declarative
    style and offers a lightweight framework for developing mobile applications. The
    following list gives some important information about Jo:


    +   - Framework: Jo

    - Style: Declarative

    - Web site: http://joapp.com

    - License: Open source (OpenBSD)

    - Source code: https://github.com/davebalmer/jo

    - Requirements: None


    The following list describes some of Jo''s strengths:


    +   - Jo comes with excellent documentation. In fact, the author of Jo (Dave Balmer;
    http://twitter.com/balmer) created a specialized documentation tool (JoDoc) for
    creating higher-quality JavaScript API documentation.

    - Jo is built for a multdevice environment. It has been built and tested on a
    wide variety of devices that support HTML5 and CSS3 (iOS, Android, webOS, and
    Symbian).

    - Jo is extremely lightweight with regard to size, and, since Jo has no dependencies
    on other JavaScript libraries, your application will probably be smaller using
    Jo than any other mobile UI framework.

    - Jo plays nicely with other JavaScript libraries (including JQuery).


    The following are some of its weaknesses:'
