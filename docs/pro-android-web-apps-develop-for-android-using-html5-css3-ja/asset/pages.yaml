- img_proc: true
  md: 'minimizing the amount of work you have to do cater for another platform is
    always a good thing.


    # Mobile Technology Predictions


    The future is far from certain, but it is likely that mobile device development
    and architecture will play out in a similar way to desktop computing. This being
    the case, we can probably brave and make a few predictions.


    > NOTE: While there is an obsession with mobile development using native technology
    at present, we strongly believe that history will repeat itself in mobile the
    same way it did for desktop devices.


    This is definitely a risk-vs-reward situation though, as many roadblocks stand
    in the way of web-oriented mobile development. We believe the community has sent
    device manufacturers a message, though, and that is development for mobile is
    important and something that needs to be prioritized. We also believe they have
    heard this message, and things are starting to change for the better.


    # Improvements in Tools and Libraries


    The maturity and availability of both tools and libraries to streamline mobile
    web development is quite limited at the moment. This is changing, though, and
    we will certainly see a lot more options become available over the next year.
    One of the most promising libraries under development (at the time of writing)
    is the jQuery mobile framework (http://jquerymobile.com).


    The research that has gone into this library and the focus on broad-spectrum mobile
    device support is very encouraging. From this research, the jQuery team has produced
    what is called the graded browser support (http://jquerymobile.com/gbs), shown
    in Figure 13-4.'
  merge: -1
  pgno: 352
