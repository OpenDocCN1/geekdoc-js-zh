    Change directory to the Mongoose source directory:


    ```

    cd mongoose

    ```


    And then run make Linux:


    ```

    make linux

    ```


    You will be able to run Mongoose using the full path of the Mongoose executable.
    If you would prefer to be able to run Mongoose without specifying the full path,
    then copy the Mongoose executable into a path such as /usr/local/bin:


    ```

    sudo cp mongoose /usr/local/bin/

    ```


    That''s —you can now run Mongoose.


    # Running Mongoose


    Running Mongoose is refreshingly simple. Configuration defaults are sensible,
    running mongoose from the command line produces a web server that runs and serves
    that folder as the web root.


    Additionally, Mongoose will bind to all of the IP addresses assigned to your computer,
    which means you will be able to browse from other devices on your network using
    the IP address (or one of the IP addresses) of the machine you are running Mongoose


    Let''s try running Mongoose. Open up a prompt/terminal window and change directory
    to PROJECT_WORKING_DIR, which you set up in the previous step. If Mongoose is
    located on your path, you will be able to run mongoose from the command line;
    and if not, you will need to run it using its absolute path. Either way, once
    you have run the command (no command-line options required), you should then be
    able to browse to http://localhost:8080/ and see the directory file list of the
    folders you set up earlier (as shown in Figure 1–1).'
