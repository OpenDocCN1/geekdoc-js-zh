    Then copy the Sample directory from the Android directory located within the PhoneGap
    download to that new directory.


    This will provide us with a skeleton PhoneGap native Android project in the bridges/Sample
    folder. The directory structure for this skeleton project is displayed in Figure
    9–1.'
