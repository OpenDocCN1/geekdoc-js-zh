    means that the path you will use to browse the majority of future examples will
    match the pattern: http://YOURIP:8080/snippets/CHAPTER/SAMPLE.html.


    # Summary


    This chapter covered the basic capabilities of an Android device and what can
    be achieved in web apps as opposed to native apps. This included looking at what
    is available via standard browser support, as well as through using bridging frameworks
    to extend native functionality to a web browser embedded in a native application.


    We also walked through the very simple requirements for running a development
    environment for building Android web apps. Additionally, we took a preliminary
    look at some of the tools that will help you debug your code as you work through
    the samples in this book and let you create your own applications.


    In the next chapter, we will look at some of the simple techniques that are used
    to create mobile-friendly web pages and the foundation pieces of a mobile web
    app. We''ll begin with some simple standalone examples, and quickly move on to
    working through a practical example: building a simple-to-do list application.
    We will continue to explore and build this in Chapters 3 and 4 also.'
