- img_proc: true
  md: 'matches the one that is defined in your local application. To do this, open
    the war/web-ipping-web.xml file and check this line:

    <application>jsonengine</application>


    Replace jsonengine with the application ID you just chose before. Now you''re
    ready to deploy your application—go to the folder of your Google App Engine SDK
    and type the following command (on Windows):


    ```

    appcfg.cmd update location/to/you/war/folder

    ```


    On the Mac and Linux, type the following:


    ```

    appcfg.sh update location/to/you/war/folder

    ```


    Enter your Google username and password at the prompts. If the upload process
    is successful, you will see “Update completed successfully.” That''s it! Our application
    is in the cloud—navigate to your page: http://my-app-id.appspot.com/snippets/05/todolist-readonly.html.


    # Summary


    We have achieved some interesting things so far: we have a mobile web application
    with powerful features that can store data offline and synchronize it with an
    online environment. Synchronizing offline data for a mobile app with a powerful
    online storage mechanism is a very new and innovative concept.


    What we need now are some features to compete with native applications. In the
    next chapter, we will add some tasty user interface elements and deal with offline
    conditions.'
