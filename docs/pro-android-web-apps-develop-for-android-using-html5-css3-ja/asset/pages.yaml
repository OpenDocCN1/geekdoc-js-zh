    One of the really nice things about YQL is its use of data tables. These data
    tables provide information on how to interact and obtain information from various
    services around the Web. When you first load the YQL console, you will probably
    see around 160 data tables initially available, and relate mostly to tables that
    interface with other Yahoo!. By accessing the community tables (which you can
    do by selecting the Show Community Tables link on the right), you gain access
    to almost 1,000 different tables that you can interact with, both Foursquare and
    Gowalla are included in this.


    In Foursquare''s case, the following is a YQL query that designed to interact
    with venues api endpoint:


    ```

    select *

    from foursquare.venues

    where geolat="33.7722869"

    and geolong="-84.3970668"

    ```


    In addition to requests through the console, you can execute YQL through a set
    of published web services. In each case, a REST query for the information is displayed
    at the bottom of the console interface. This REST query can be copied and pasted
    into your own client-side JavaScript—for instance, directly into a jQuery ajax
    call. We won''t include a sample URL here, as these are fairly unreadable, since
    they contain the escaped SQL statement as part of the query. It is fairly to recognize'
