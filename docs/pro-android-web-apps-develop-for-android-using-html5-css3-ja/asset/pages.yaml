  md: '# CHAPTER 5: Synchronizing with the Cloud


    As you can see, all the data inside the offline database is now available online—at
    least on the server, that is; we haven''t yielded our application to the cloud.
    Before doing that, we have to add more security to the storage solution; if we
    leave it as it is, fortunately, jsonengine comes with a security admin page where
    you can set the access level for your storage documents, as shown in Figure 5–4.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_121_0.png)


    Figure 5–4. The jsonengine security admin page


    Here, we can add our JSON "tasks" document and set the read level to "protected,"
    so that users will be able to view the data if they are connected with their Google
    or OpenID accounts.


    # Deploying Your Application on the Cloud


    OK, it''s time to go live so that the whole world will be able to use your mobile
    application. But first you will need a Google account (or Gmail account). Once
    you have that, you can access Google App Engine by logging in. https://appengine.google.com.
    From there, you can create a new application, and choose an application identifier—which
    will also be the URL to access your app—and a title. Before you upload our application,
    you must be sure that the application identifier'
  merge: -1
