    # # Summary


    This brings us to the end of our look at four different mobile frameworks. As
    we have seen, each of the four frameworks discussed in this chapter is quite different
    in its approach, and each has strengths and weaknesses in different areas.


    As mentioned, there really is no best framework. jQuery Mobile and Sencha Touch
    are definitely going to be heavy hitters over the next couple of years, and it''s
    likely that fans of one framework will dislike the other due to the different
    approaches. Additionally, jQuery is gaining popularity and jQuery has a loyal
    community behind it (how it connects with jQuery Mobile in the long run, though
    it will be interesting).


    Hopefully, this chapter has assisted you in identifying a mobile UI framework
    that sits well with your own personal style. Or perhaps you''d prefer to construct
    your own application interface due to particular requirements that you have.


    For our sample game application, we will take the jQuery Mobile interface that
    we worked through and polish it in the next chapter. We''re using jQuery Mobile
    primarily because we have worked extensively with jQuery throughout the book.'
