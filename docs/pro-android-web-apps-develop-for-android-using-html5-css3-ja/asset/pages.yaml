  md: "Now that we have looked at how simple it is to have jQuery issue a JSONP request\
    \ for, let's take a quick look at what is going on behind the scenes. To achieve\
    \ this, we will make a copy of our twitter-test.html file and replace the previous\
    \ showData function with the following code:\n\n```\nfunction showData() {\n \
    \ var tweetItems = '';\n\n  for (var i = 0; i < document.scripts.length; i++)\
    \ {\n    var script = document.scripts[i];\n\n    if (script.src) {\n      tweetItems\
    \ += '<li>' + script.src + '</li>';\n    } // if\n  } // for\n\n  $('#tweets').html(tweetItems);\n\
    }\n```\n\nSo, rather than outputting the text of the tweets to the HTML, we are\
    \ now writing out the source file location of any scripts that are currently included\
    \ in the page. Figure 10–4 shows an example of what this looks\n\n![](img/6c8091bf3a3d21ca91f25f8caed8840f_236_0.png)\n\
