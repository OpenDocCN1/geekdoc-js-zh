    in the following location: /snippets/01/helloworld.html.


    This is the kind of directory structure that will be used for the rest of the
    book, with each chapter''s code snippets being stored within a directory under
    the snippets. Some larger examples, such as the geospatial game covered in Chapters
    9 through 11, will use a variation on this, but this is the general rule.


