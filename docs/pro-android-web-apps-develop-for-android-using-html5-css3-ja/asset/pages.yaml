  md: '# Chapter 12


    # # Polishing and Packaging an App for Release


    One of the great things about developing mobile application using web technologies
    is that you have a choice about how you package and deploy your application. If
    you build with native tools, then you have only one option. Admitted, it''s a
    very good option, but you still don''t have a choice.


    By using web technologies coupled with tools like PhoneGap, you can choose to
    deploy you application for consumption via a web browser, or wrap your web application
    for native marketplace distribution.


    In this chapter, we will finish writing our geospatial game app, Moundz, using
    the jQuery Mobile sample that we compiled in the previous chapter. Once coding
    is complete (we still have a bit to do), we will package that for marketplace
    distribution.


    # ## Continuing on jquery Mobile


    In the last chapter, we looked at four different mobile UI frameworks, one of
    which was jQuery Mobile. Given throughout the book we have used jQuery extensively,
    it makes sense that we carry the jQuery Mobile sample forward to completion.


    > NOTE: At the time of writing, jQuery Mobile is still in an alpha release status,
    so minor tweaks may be required to make the samples work on the latest stable
    version that is presently available.


