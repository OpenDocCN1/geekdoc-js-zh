  md: '# # Locating Resources in Moundz


    The first step to world domination in Moundz is collecting resources with which
    to start build your ant mound. Your mound is essentially your base, which you
    will build over time, and you will need to mine resources from locations around
    your area and bring them back to your base. This is where the geospatial network
    data comes in—it supplies the base data that the Geomer API uses to feed the game
    data.


    Essentially, the process is follows:


    +   1. Moundz requests resource data for resources near the current position from
    the Geomer API.

    2. Geomer passes the request to the Gowalla API and receives a list of Gowalla
    "spots" back for the specified position. This includes the total number of check-ins
    that have been made for each spot. If you are interested, have a look at the Gowalla
    API Explorer (http://gowalla.com/api/explorer)—we are using the list method of
    the spots endpoint.

    3. Geomer returns a subset of the information received from Gowalla, with a value
    for resources available. This value is equal to the total number of check-ins
    for the spot, less any resources already mined from that location since the game
    started.

    4. Moundz displays the information received.


    With that in mind, let''s start putting the skeleton of the Moundz application
    together and implement a Nearby Resources screen. We will base the general structure
    for the Moundz application on our mapping application boilerplate, so let''s create
    a new directory for Moundz and copy the boilerplate files there.


    The simplest place to take a copy of the files will be the directory that we were
    working in when implementing our PhoneGap wrapper in the previous chapter. So,
    copy the files from /bridges/maptest/assets/www to /moundz. Once you have done
    this, you should have a directory structure that looks similar to Figure 10–8.'
