  md: "# Adding a Simple Loading Spinner\n\nIn the previous chapter, we implemented\
    \ an online synchronization function. The only visual feedback we had was an info\
    \ banner telling the process was successful. But what about during the process\
    \ itself? For example, if we have thousands of records to synchronize, it will\
    \ take some time before this process is done. In this case, it would be to have\
    \ some visual feedback during the synchronization, a loading spinner.\n\nIn the\
    \ old-fashioned way, you would use a semitparent animated GIF and control it with\
    \ some JavaScript. The downside of this approach is that it requires an extra\
    \ resource with a limited number of frames (to keep the image size as small as\
    \ possible), which reduces the smoothness of the animation; and, because the image\
    \ is semitransparent with hard foreground and background color, you also add a\
    \ dependency to the application' color chart. If you decide to change the background\
    \ color of your application, you also have to generate your animated GIF again.\n\
    \nFor these reasons, we won't use an image; instead, we'll \"draw\" and animate\
    \ the spinner using CSS3 animations and transitions. The spinner will consist\
    \ of 12 bars rotating around and fading out. Let's first define the main spinner\
    \ style:\n\n```\ndiv.spinner {\n  position: absolute;\n  top: 50%;\n  left: 70%;\n\
    \  margin: -100px 0 -100px;\n  height: 54px;\n  width: 54px;\n  text-indent: 250px;\n\
    \  white-space: nowrap;\n  overflow: hide;\n}\n```\n\nThen we define the inner\
    \ div style. Here, we set the common styles that will be shared by all the bars.\
    \ Basically, we create a bar by styling a div, with the corner radius and shadow\
    \ properties. We also attach an animation to a bar—a fade animation that will\
    \ be defined later.\n\n```\ndiv.spinner div {\n  width: 12%;\n  height: 26%;\n\
    \  background: #000;\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  opacity:\
    \ 0;\n  -webkit-animation: fade 1s linear infinite;\n  -webkit-border-radius:\
    \ 50px;\n  -webkit-box-shadow: 0 0 3px rgba(0,0,0,0.2);\n}\n```\n\nFinally, we\
    \ define the 12 bars that will be used in the animation, increasing the rotation\
    \ angle for each of them by 30 degrees using the -webkit-transform:rotate attribute,\
    \ combined with a different start delay using the -webkit-animation-delay attribute\
    \ for each bar, will create the illusion of a rotation effect."
  merge: -1
  pgno: 124
- img_proc: true
  md: "```\ndiv.spinner div.bari1 {\n  -webkit-transform:rotate(0deg) translate(0,\
    \ -142%);\n  -webkit-animation-delay: 0s;\n}\n```\n\n```\ndiv.spinner div.bari2\
    \ {\n  -webkit-transform:rotate(30deg) translate(0, -142%);\n  -webkit-animation-delay:\
    \ 0.9176s;\n}\n```\n\n```\n[...]\ndiv.spinner div.bari12 {\n  -webkit-transform:rotate(33deg)\
    \ translate(0, -142%);\n  -webkit-animation-delay: -0.0833s;\n}\n```\n\nWe define\
    \ our fade animation:\n\n```\n@-webkit-keyframes fade {\n  from {opacity: 1};\n\
    \  to {opacity: 0.25};\n}\n```\n\nBefore we test the spinner, let's introduce\
    \ some new CSS3 selectors:\n\n+   - -webkit-animation: Defines the name of your\
    \ animation, which will be declared in a separate style block starting with @-webkit-keyframes.\
    \ Notice the values that follow the name of the animation: we have a duration\
    \ value, a transition-timing function that defines how the animation should proceed\
    \ over the duration (here we are using a linear function, but there are lot of\
    \ different options—ease-in, ease-out, etc.), and a finally value defining the\
    \ animation's frequency (the animation will run infinitely in our case).\n\n+\
    \   - -webkit-transform: Can transform any HTML element. Its possible values are\
    \ translate, rotate, and scale. Notice that you can transform values like we did\
    \ in the previous code sample—first rotate the div and translate it to the upper-left\
    \ corner to make it rotate around an axis.\n\n+   - -webkit-animation-delay-count:\
    \ Defines the delay before your animation starts. This is useful when you want\
    \ to chain a lot of different animations, like our 12 bars.\n\n> NOTE: A linear\
    \ transition function will time your animation equally over the duration you provide;\
    \ for example, if you are moving an object by 200 pixels with a duration of 2\
    \ seconds, after 1 second your image will have moved by 100 pixels. But there\
    \ may be situations where you want to have another type of timing, like rotating\
    \ an very slowly in the beginning and finishing with a fast rotation.\n\nTo be\
    \ able to test our loading spinner, we have a div containing all the bars' divs\
    \ on the main page:"
