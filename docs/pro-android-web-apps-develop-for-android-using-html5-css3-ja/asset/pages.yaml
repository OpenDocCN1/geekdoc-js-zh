    In the preceding code, the showScreen function does most of the legwork. When
    it is passed a string parameter (which checks for using a JavaScript typeof operator),
    it uses JQuery to bring HTML element into view by adjusting its left position.
    This works in conjunction with the previously defined CSS to bring in and hide
    views in the main viewing area. To the end user, this provides a similar experience
    to what we coded in the earlier-to-do list application. In this case, we are using
    absolute positioning based on the presence and requirements of the marker component.


    Another notable part of the code is the watchHash function, which is called at
    regular intervals (courtesy of the JavaScript setInterval function). The purpose
    of the function is to monitor the window.location.hash property and keep the application
    UI sync. This means that the user will be able to use the back button on the browser,
    in addition to the Close button, which is placed in a child view to navigate back
    to the main screen.


    Finally, we update the addMarker function to save the marker content into the
    markerContent object for each of the markers, and also call a new function (activateMarker)
    when a marker is clicked—rather than simply updating the title. At first glance,
    the activateMarker code may appear a little complicated, but it''s reasonably
    simple once we break it down:


    +   1. First, HTML elements with the marker-title class are updated with the title
    of the marker (retrieved using the marker.getTitle method). At the same time,
    the has-detail class is removed, and we unbind the click event handler, as the
    marker may not have any content and therefore no detail screen. The has-detail
    class was defined in the previous section''s boilerplate CSS to simply show an
    underline under the text, thereby simulating a link.


    +   2. Second, if the marker has content associated, we add the has-detail class
    and bind a click handler to the marker title. Now, when the user clicks the marker
    title, they will be taken to the marker-detail screen and shown the HTML content
    that was specified for the marker.


    With these modifications complete, we will be able to navigate to our placeholder
    child view by clicking the marker title that will be displayed underlined in the
    navigation bar. Figure 8–10 illustrates this.'
