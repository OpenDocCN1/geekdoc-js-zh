    # Sencha Touch


    Sencha Touch is the last of the frameworks that we will look at in this chapter
    with our Moundz conversion challenge. In some respects, Sencha Touch could be
    considered the next evolution of jTouch, considering that jTouch''s creator (David
    Kaneda) joined Sencha and became part of the team that eventually released Sencha
    Touch. Like Jo, Sencha Touch follows a declarative style.


    +   - Framework: Sencha Touch

    - Style: Declarative

    - Web: www.sencha.com/products/touch

    - License: Dual-licensed (GPL and commercial—currently free)

    - Source code: Available in download

    - Requirements: None


    The following are some of Sencha Touch’s strengths:


    +   - Sencha Touch has an extremely robust and well-tested framework, so, building
    a mobile web UI for Android, it will also work well on iOS devices.

    - The framework also has user interface elements that cater for larger mobile
    device screens (such as tablet devices)..

    - It has excellent touch support, so it’s a great choice for building touch- and
    canvas-oriented applications.

    - It has the most complete suite of UI widgets of any of the frameworks covered
    in this chapter.

    - It has very solid documentation.


    The following are some of its weaknesses:


    +   - Sencha Touch is the most heavyweight of the frameworks we''ve looked at
    (by quite a bit). Its large library size is mitigated by the ability to customize
    the build of the library, but it is inconvenient.'
