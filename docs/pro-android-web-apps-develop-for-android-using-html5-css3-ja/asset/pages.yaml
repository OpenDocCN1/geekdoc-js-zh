  md: 'Fortunately, the dev_appserver command comes with an option parameter to make
    the server listen on all the IPs (0.0.0.0) of your local machine.


    Stop your server and restart it by adding the following parameter -a 0.0.0.0 after
    your command and before the path to your war folder. Once you have done, you will
    be able to access the application from the emulator or mobile device using the
    IP of your local machine.


    > NOTE: If you have Mongoose running in the background, the AppEngine server will
    not be able to bind to the alternative address. In this case, simply close down
    the Mongoose server and then start the AppEngine dev server again.


    At the end of the day, you will see how to deploy the application on the cloud;
    it''s not very complicated and can be done in one single command. The deployed
    application will have the exact same behavior as your local server—there is nothing
    to configure and it''s definitely a huge time-saver.


    # Choosing a Suitable Synchronization Mode


    Ideally, synchronization is bidirectional, which means that, for example, system
    A creates/updates records that will be reflected on system B, which can also update/create
    data. However, that brings a lot of integrity issues. For example, what if system
    A is updating a system B is deleting? With a legacy storage system like Oracle
    or MySQL, you can use locks, rollbacks, and other similar features to deal with
    these kinds of issues. But now we are using a quite different and innovative approach,
    and to keep things on a reasonable level we will choose a simple but still powerful
    synchronization mode.


    We will use a one-way synchronization, in which the offline database will be the
    master and the online storage will be the slave. This means that each new record
    will always be stored initially in the offline database, and will be synchronized
    with the online storage only after the user decides to do so. Inserting new records
    into jsononline will be impossible.


    To illustrate this, let''s imagine the following case: our-to-web application
    has become popular and is being used by a famous scientist collecting data in
    the middle of the jungle. All long day, the data is stored offline, but, when
    the scientist returns to his headquarters at the end of the day, he wants to share
    his collected information with the other scientists working in the main office
    in Amsterdam. His colleagues have read-only permissions, but there are also batch
    processes that will output very interesting statistics for all scientists around
    the world.'
