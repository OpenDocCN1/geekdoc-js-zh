    \ application to the point that it can actually be used for creating, viewing,\
    \ and completing tasks.\n\nWith data now being saved to the client-side database,\
    \ let's create a display screen so that we can keep track of all things we have\
    \ to do (sigh). We are going to be working toward building a display that shows\
    \ the next five things that need to be done (in order date).\n\nOnce we have done\
    \ this, we will be at a point where our to-do list application has multiple screens.\
    \ While we could implement these using separate HTML pages, that would result\
    \ in page loads that aren't required. This is best avoided, so we will implement\
    \ some using the likes of jqTouch (http://jqtouch.com) and IUI (http://code.google.com/p/jui)\
    \ for creating a single HTML document that contains multiple application screens.\n\
    \n# ## Single HTML File, Multiple App Pages\n\nBefore we get into building our\
    \ main to-do list application page, let's work through adding additional styles\
    \ to our proui.css file to handle setting up divs for display and also showing\
    \ a simple application menu at the base of the screen.\n\nFirstly, let's look\
    \ at what is required to correctly display only one page when the application\
    \ page loads:\n\n```\ndiv.view {\n  display: none;\n  padding: 0 6px;\n}\ndiv#main\
    \ {\n```"
