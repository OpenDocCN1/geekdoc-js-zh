  md: '# CHAPTER 10: Integrating with Social APIs


    While the watchPosition method differs in the number of times that the callback
    passed to it is executed, the data returned in the callback is identical to the
    getCurrentPosition method, which we investigated previously. Basically, the watchPosition
    method will be called until the clearWatch method is called, whereas getCurrentPosition
    will execute once and only once. For instance, in the preceding code, the value
    that we assign to the watchID variable could be passed to the clearWatch function,
    and we would stop receiving location updates.


    Additionally, the error callback and options parameters are the same. In this
    particular case, we supply the enableHighAccuracy option as true to indicate to
    the device that we would like to use the GPS in the device, rather than just using
    network triangulation.


    In the callback within our run function, we simply map the returned latitude and
    longitude to a google.maps.LatLng object, and then pass that to our map as the
    position that we wish to use. As findResources function works with the current
    center position of the map, we have to call it if the position changes (and we
    have updated our map to match position), and relevant resources will be returned
    for our current location.


    > NOTE: While building location-based services and applications is interesting,
    testing them can be a challenge. It is a case of writing some code, and then taking
    a device out into the field to ensure that the code is behaving as expected. If
    you find a problem, then it''s back to the desk to tweak the code. You will rinse
    and repeat until everything works as expected.


    Android actually offers better-than-average tool support for building and testing
    geolocation-based applications. For more information on how to use the Android
