  md: '# CHAPTER 9: Native Bridging with PhoneGap


    adb devices


    The adb command (which stands for Android Debug Bridge) is one of the tools installed
    with the Android SDK. This particular command provides information on the Android
    emulators and devices that are currently connected. Any Android device that is
    currently connected can be interfaced with using a variety of developer tools.
    For more information regarding debugging Android web apps, see Appendix A.


    If you have a valid emulator running, then you should see output similar to Figure
    9–4. If not, then you will need to start an emulator instance or attach an Android
    device via USB.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_211_0.png)


    Figure 9–4. If an emulator is running (or a device is attached), then it will
    be shown by running "adb devices."


    An emulator can be started by following the instructions outlined in Chapter 1.
    Alternatively, you can run the following command:


    emulator @android_web_apps


    The emulator executable is used to start the Android emulator directly from the
    command line. You specify which of the Android Virtual Device (AVD) images to
    use by providing a single parameter that has the ID of the AVD image with an @
    symbol preceding it.'
