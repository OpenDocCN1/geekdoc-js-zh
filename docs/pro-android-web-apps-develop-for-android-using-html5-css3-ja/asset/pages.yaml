  md: "The naming of these functions gives us a clue to the differences between working\
    \ with touch and mouse events. Both mouse and touch events have \"down\" and \"\
    up\" events to signify that interaction has started and ended, respectively.\n\
    \nThe primary difference, however, is between the mouseover and touchmove events.\
    \ touch event has no concept of hovering and we have no hover event, so it is\
    \ replaced with the touchmove event, signifying that a touch event has started\
    \ and the touch points are changing. This is an important point to note, as familiar\
    \ web concepts such as \"hover states\" have no effect on mobile devices, so it's\
    \ important to consider alternative mechanisms to provide feedback to your user\
    \ apps.\n\nWe will now create our touchcanvas.html and touchcanvas.js files. As\
    \ the mouse canvas example, the HTML file is very simple, so just make a copy\
    \ of the previous mousecanvas.html file and tweak the references.\n\nOur touchcanvas.js\
    \ file is more or less a replacement of the mouse event handlers the relevant\
    \ touch event handlers:\n\n```\nfunction() {\n  var canvas = null,\n  context\
    \ = null;\n\n  function resetCanvas() {\n    canvas = document.getElementById(\"\
    simple\");\n\n    // set the canvas height to the window width and height\n  \
    \  canvas.width = window.innerWidth;\n    canvas.height = window.innerHeight;\n\
    \n    // get a reference to our drawing context\n    context = canvas.getContext(\"\
    2d\");\n  }\n  resetCanvas();\n}\n\n$(window).bind(\"resize\", canvas).bind(\"\
    reorient\", resetCanvas);\n\n$(document).ready(function() {\n  window.scrollTo(0,\
    \ 1);\n  resetCanvas();\n\n  document.body.addEventListener(\"touchstart\", function(evt)\
    \ {\n    context.beginPath();\n    context.moveTo(evt.touches[0].pageX, evt.touches[0].pageY);\n\
    \n    evt.preventDefault();\n  }, false);\n\n  document.body.addEventListener(\"\
    touchmove\", function(evt) {\n    context.lineTo(evt.touches[0].pageX, evt.touches[0].pageY);\n\
    \    context.stroke();\n  }, false);\n\n  document.body.addEventListener(\"touchend\"\
    , function(evt) {\n  }, false);\n});\n)();\n```"
