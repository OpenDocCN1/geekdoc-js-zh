  md: '# Summary


    In this chapter, we covered a lot of material, ranging from some additional information
    on jQuery Mobile and visual tweaks to our application, to information on how to
    package an Android web app using PhoneGap for release to the Android Market.


    In the next chapter, we will finish the book by looking at some potential future
    trends in mobile computing. Hopefully, these will provide some food for thought,
    and perhaps even give you some ideas of things you might possibly like to explore
    in the world of mobile web application development.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Chapter 13


    # The Future of Mobile Computing


    Through the course of the book, we have looked at some code examples and exercises
    that will enable you to build web apps for Android and Chrome OS using the features
    available both on the phone and in the cloud. What''s coming though? How are new
    technologies and trends going to change our development approach?


    What is presented in this chapter is a developer''s perspective on the potential
    future of mobile applications. Of course, the contents of this chapter represent
    only one view of the mobile future, and many possibilities exist. Given current
    trends in both desktop and mobile computing, though, we certainly believe that
    we will see components of this chapter implemented over the next few years.


    # The Era of Mobile Computing


    The era of mobile computing is upon us. The adoption of web-connected mobile devices
    is one of the fastest-moving trends worldwide. Consumers have become accustomed
    to mobile technology, and for most of us that now includes mobile web access.


    This turn affects the way we will choose to consume and produce information. For
    instance, rather than making sure we are prepared before leaving the house or
    for things like appointments, we can now get up and go. We can access the information
    that we need via our mobile device of choice when we need it, whether that is
    checking the exact time of the meeting or accessing driving directions on how
    to get there. We are definitely becoming accustomed to getting information “just
    in time”— assuming we have good connectivity.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# A Worldwide Phenomenon


    The take-up of mobile computing is not limited to established markets. In fact,
    for emerging markets and nations, mobile broadband technologies are being rolled
    out in favor of traditional "landlines" due to the cost-effectiveness of the solution.
    Figure 13-1 helps demonstrate this point by showing a graph of monthly traffic
    for a mobile Twitter client, Tweete (http://m.tweete.net). In this particular
    graph, we can see that the majority of traffic for Tweete comes from Indonesia.
    The primary reason for this is to mobile broadband being more prolific than fixed
    broadband in countries like Indonesia, and thus lightweight mobile clients can
    get very good traction over heavyweight desktop (and nonoptimized) mobile) clients.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_348_0.png)


    **Figure 13-1.** Emerging markets can provide unexpected opportunities for mobile
    development.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '**TIP**: Many of you may look at the above graph and think—so what? We would
    like to challenge thinking and recommend considering how you could build mobile
    applications for emerging markets (http://en.wikipedia.org/wiki/Emerging_market)
    as well as established markets. When doing this, you will also have to consider
    that these nations still have large numbers of simpler mobile devices in circulation.
    These devices often have web connectivity, but don''t have the HTML5 support we
    have been looking at using over the course of the book.


    Effectively implement your web application or site with *progressive enhancement*
    (discussed in the section titled "Embracing Progressive Enhancement") and you
    may be able to start making inroads into these markets now, and still offer a
    rich experience with HTML5 features for more advanced devices.


    # Death of the Desktop?


    Smartphones and tablets are really just the tip of the iceberg when it comes to
    mobile computing. The Mobile Internet Report (www.morganstanley.com/institutional/techresearch/mobile_internet_report2209.html)
    delivered by Mary Meeker (http://en.wikipedia.org/wiki/Mary_meeker) of financial
    services firm Morgan Stanley makes a number of predictions with regard to mobile
    device penetration and Internet usage of mobile platforms compared with desktop
    platforms.


    Without going into the detail of the report, it suggests that mobile devices will
    likely be the platform of choice for Internet connectivity by about 2014. If this
    turns out to be an accurate estimate, then we need to start designing both sites
    and applications for the mobile web now.


    # Embracing Progressive Enhancement


    Progressive enhancement (www.alistapart.com/articles/understandingprogressiveenhancement)
    is a web design strategy in which web designers and coders design web sites and
    interfaces for the lowest denominator (within reason) first and foremost. The
    application site is then enhanced if the visitor’s browser is able to support
    more advanced features. JavaScript libraries such as Modernizr (www.modernizr.com)
    are very useful here.


    As to why this is important, take a look at Figure 13-2, which shows the breakdown
    of mobile-browser market share from August 2009 until August 2010.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# CHAPTER 13: The Future of the Mobile Computing


