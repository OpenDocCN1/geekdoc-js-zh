- img_proc: true
  md: 'Additionally, PhoneGap is an open source framework, and the ability to write
    plug-ins is provided (although hard to find good information on), so it''s definitely
    possible to access additional sensors.


    # Local Databases and Storage


    Mobile devices have for a long time supported local storage in one form or another,
    and in more recent times we have started to see standardized techniques (and technology
    selection) for implementing SQLite. Certainly at a native API level, Android implements
    support for SQLite (http://sqlite.org/) through the android.database.sqlite package
    (see http://developer.android.com/reference/android/database/sqlite/package-summary.html).


    SQLite is quickly becoming the facto standard for embedded databases, and this
    is when it comes to local storage and databases for web technologies. Having access
    to a lightweight database such as SQLite on the client makes it possible to create
    applications that both store and cache location copies of information that might
    never be stored on a remote server.


    New, in-progress HTML5 standards provide mechanisms for persisting data needing
    to interact with external services apart from JavaScript. These new APIs, HTML5
    Web Storage (http://dev.w3.org/html5/webstorage) and Web SQL Database (http://dev.w3.org/html5/webdatabase),
    provide some excellent tools to help make your applications work in offline sessions.
    We explore these APIs in some depth in Chapter 3.


    # Camera Support


    Before touch became one of the prime sought-after features for mobile devices,
    having a reasonable camera was certainly something that influenced a decision.
    This is reflected in the variety of native applications that actually make use
    of the camera. At a native level, access to the camera is implemented through
    the android.hardware.camera class (see http://developer.android.com/reference/android/hardware/Camera.html);
    however, it is not accessible in the browser—the HTML Media Capture is in progress
    (see www.w3.org/TR/capture-api).


    Until such time that the specification is finalized, however bridging frameworks
    provide web applications access to the camera and picture library on the device.


    # Messaging and Push Notifications


    In Android 2.2, a service called Cloud to Device Messaging (C2DM) (http://code.google.com/android/c2dm/index.html)
    has been implemented at the native level. This service allows native developers
    to register their applications for what'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'are commonly known as push notifications, whereby a mobile user will be notified
    when something is new or has changed.


    It will be some time before notifications are implemented in browsers, as a working
    group has only recently been announced to discuss and provide a recommendation
    on this particular area (see www.w3.org/2010/06/notification-charter).


    Unfortunately, with C2DM being reasonably new, it will probably be some time before
    the bridging frameworks implement this for Android.


    # WebKit Browser


    The Android OS implements a WebKit-based browser. WebKit (http://webkit.org/)
    is an open source browser engine that has reached a level of adoption for desktop
    and mobile browsers alike. The WebKit engine powers popular browsers like Chrome
    and Safari on the desktop, mobile Safari and the native Android browser (mobile
    to a name). This alone is a great reason to build applications for mobile rather
    than native applications. As both Android and the iPhone implement a native WebKit
    browser (Mobile Safari is WebKit at its core), you can target both devices simply
    if you consider WebKit as your common denominator.


    Why is WebKit in common so important? Given HTML5 and CSS3 are both still emerging
    technologies, it will probably be a couple of years before standards are concrete
    and mobile browsers behave in a consistent way. Now, having WebKit as a common
    element between the two dominant consumer smartphone platforms is a huge advantage.
    As developers, we can build applications that make use of the components of HTML5
    that are starting to stabilize (and are thus being implemented in more progressive
    browser engines, such as WebKit), and actually have a good chance of making those
    applications work on both an Android handset and an iPhone. Try with native Android
    Java code or iPhone Objective-C code.


    > NOTE: Adoption of WebKit as the "mobile browser of choice" appears to be gaining
    momentum. Research In Motion (RIM), the company responsible for BlackBerry, has
    adopted WebKit and HTML5 in its new BlackBerry Torch. This is good for mobile
    web application developers, and I believe the future is in cross-platform web
    development rather than the current trend of development.


