    +   - We add a drawwheel function that is responsible for rotating the canvas\
    \ around a particular point and drawing the wheel image so it is centered on that\
    \ point. We use the same technique that we used in the earlier rotation sample—we\
    \ translate the origin of the canvas to the center point where the wheel was drawn,\
    \ apply the rotation, and then can drawImage to draw the wheel image at the appropriate\
    \ position.\n\n+   - Inside the animate function, we calculate the angle that\
    \ we should rotate the wheel. We do this by applying the same tween that we are\
    \ animating the x position of the car image. This means that the wheels move in\
    \ sync with the car. The example uses PROWEBAPPS.Easing.BackOut but if you chose\
    \ not to implement any additional easing equations, you can obtain the source\
    \ code from the GitHub repository at http://github.com/sidelab/prowebapps-js.\
    \ Alternatively, feel free to use one of the easing equations implemented earlier\
    \ that is preferred.\n\n+   - The drawwheel function is called twice in the animate\
    \ function—once for each wheel.\n\n+   - In startCar(which is essentially the\
    \ functionality that used to be contained within the touchstart handlers), a variable\
    \ endAngle is initialized. This variable is used in the wheel-easing calculation,\
    \ and is set relative to the distance of the x position that we are sending the\
    \ car to. By calculating this relative value to the end position of the car, the\
    \ wheels move at a speed appropriate for the distance the car has to move.\n\n\
    +   - Finally, the wheel image is loaded after the car image. For the wheel image\
    \ load, we attach an onload handler so the wheel1offset be calculated for an accurate\
    \ wheel-imagining position in the drawwheel function."
