  md: "# CHAPTER 11: Mobile UI Frameworks Compared 257\n\nWhen an alternative attribute\
    \ is used (jQuery Mobile adopts a suite of data attributes — see www.w3.org/TR/html/elements.html\
    \ for more information), these attributes are postprocessed by the JavaScript,\
    \ and the appropriate CSS classes are applied (where required).\n\n# Declarative\
    \ UI Frameworks\n\nUsing a declarative UI framework is quite different from the\
    \ markup-based experience. Whereas in the markup-based approach you would start\
    \ first with your HTML (and possibly CSS), in a declarative framework it's all\
    \ about the code. The UI elements are declared and defined, and programmatically\
    \ added to the UI.\n\n# Finding Your Best Fit\n\nThe choice between a markup-based\
    \ or declarative UI framework varies much comes down to personal preference. For\
    \ this reason, we will really try to avoid strong recommendations for one framework\
    \ over another. If you haven't done a lot of work with JavaScript before, then\
    \ it is likely you will be open to different approaches; in this case, we would\
    \ recommend trying a few and seeing what is a better fit for you.\n\nIf, however,\
    \ you have worked with HTML and JavaScript previously, then you might have a preference\
    \ one or another. In this case, you can focus on the two frameworks that match\
    \ your preferred style, and, if you don't find a good fit there, you can take\
    \ a look at the other.\n\nGiven our extensive use of jQuery throughout the book\
    \ already, it will probably come as no surprise that beyond this chapter we will\
    \ continue to work with jQuery Mobile. This the framework looked at here—rather\
    \ should not be taken as a rubber-stamping of jQuery Mobile as the best framework,\
