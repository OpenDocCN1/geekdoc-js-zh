  md: "```\ndocument.getElementById('y').innerHTML = roundNumber(a.y);\ndocument.getElementById('z').innerHTML\
    \ = roundNumber(a.z);\n}\n```\n\nThe preceding code defines a function toggleAccel,\
    \ which is called on the click of the Toggle Accelerometer button (shown in Figure\
    \ 9–7). As you can see, the code is reasonably trivial, and data is retrieved\
    \ from the accelerometer by the JavaScript making a call to the accelerometer.watchAcceleration\
    \ method, which has been attached to the global navigator object.\n\nThe method\
    \ takes three parameters:\n\n+   * The first parameter is for a success callback;\
    \ it is called when an accelerometer reading has been obtained from the device.\
    \ When executed, the callback function is passed a single object parameter that\
    \ has values in x, y, and z attributes. In the sample application, these values\
    \ are simply updated on the display via the updateAcceleration function.\n* The\
    \ second parameter is for a failure callback, that is triggered if PhoneGap receives\
    \ an error while attempting to obtain accelerometer data.\n* The third and final\
    \ parameter specifies options that can be used to influence the retrieval of the\
    \ accelerometer data. In the sample application, we can see that the frequency\
    \ of reporting data is set to 1000 milliseconds through the frequency option.\n\
    \nWe can also see that, if we call the toggleAccel a second time (when the accelerometer\
    \ is being monitored), monitoring the accelerometer is cancelled by the accelerometer.clearWatch\
    \ function.\n\n# Camera and Photo Library\n\nAnother useful bridging feature of\
