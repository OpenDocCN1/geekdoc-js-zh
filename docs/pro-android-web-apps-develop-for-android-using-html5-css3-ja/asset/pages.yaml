  md: '# About the Authors


    Damon Oehman is an experienced software developer and technical manager who currently
    lives in Brisbane, Australia. Having developed for a variety of platforms, from
    Windows to web development and now mobile, Damon has a unique perspective which
    fuels his passion for the "write once, run anywhere" promise of web development.


    Seeing the growing trend toward mobile development, Damon left the stable environment
    of the corporate world and co-founded mobile development company Sidelab (www.sidelab.com).
    Sidelab offers professional development services for mobile web apps with particular
    expertise in mapping, location-based services and data visualization. Damon also
    maintains a technical blog, Distractable (www.distractable.net) and created the
    HTML5 mobile mapping JavaScript Library Tiles (www.tiles.org).


    When not coding or writing, Damon enjoys spending time with his wife and kids,
    who help him to remember that there is more than life writing software.


    Sébastien Blanc is a senior JEE software engineer. He works for E-id (www.e-id.nl),
    a Dutch IT company. Additionally, Sébastien spends a lot of time providing expertise
    for mobile web apps. He is a regular conference speaker and really believes in
    the success of web-based mobile applications. Like Damon, when not coding, Seb
    enjoys spending time with his family.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_10_0.png)


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_10_1.png)'
