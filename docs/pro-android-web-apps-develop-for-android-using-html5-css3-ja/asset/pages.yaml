  md: 'Internet somewhere, we need some identity information attached to it we can
    retrieve

    from a second or third device.


    Because we are building a web-based application, not a native application, we
    are not

    able to use the unique IMEI (International Mobile Equipment Identity) number of
    the

    device, or any other low-level information. This is because mobile web browsers
    have no

    access to this information. Unfortunately, there are many options available on
    the web side

    to manage your identity. That identity could be many things—an OpenID (see

    http://openid.net), a Google account, or a Twitter account, to name but a few.
    It

    should, not be a new account that people have to create for this particular

    application and then again for another application, as this does not constitute
    a reusable

    (and thus efficient) solution.


    # JavaScript Synchronization Library


    Ideally, we are looking for a solution that can take our locally stored data and
    do some

    convention-based synchronization to push our data to the cloud. Once this

    data online, we would be able to use it from a desktop application, or maybe a

    table running either Android or Chrome.


    At this stage, offering in this space are especially hard to find, as cross-platform
    web apps

    are pretty new on most people’s readers. Another option is to write your own synchronization

    library. This shouldn''t be too difficult, as our needs are quite simple, and
    you have already

    seen in the previous chapter how to communicate with an offline database.


    # Possible Synchronization Solutions


    One solution that does a good job of our needs is jsonengine (see

    http://code.google.com/p/jsonengine). The following are some of its most valuable

    features:


    +   - It runs on Google App Engine (a cloud-based solution).


    +   - It requires no-back end scripting.


    +   - It provides identity management using the Google account mechanism

    an OpenID.


    +   - Besides being a data storage solution, it''s also possible to host and

    serve the application code from within jsonengine itself.


    As name suggests, jsonengine uses the JSON format to store its data. This is useful,

    since our application is heavily based on JavaScript, and it’s easy to manipulate
    JSON

    objects using the JSON2 library.


    Additionally, jsonengine provides a robust mechanism for inserting data via a
    REST

    (http://en.wikipedia.org/wiki/Representational_State_Transfer) API. The API

    endpoints provide the ability to read, insert, update, and delete data using standard

    HTTP methods (GET, POST, PUT and DELETE respectively).**'
