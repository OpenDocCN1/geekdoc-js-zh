  md: '# Chapter 11


    # Mobile UI Frameworks Compared


    Before we get into the final stages of preparing our application for packaging
    for the Android marketplace, it''s worth taking some time to practically compare
    the various mobile frameworks that are available right now. During the time it
    has taken to write this book, about three new frameworks have come onto the scene,
    and without doubt there will be others.


    While it has been important to understand the fundamental building blocks for
    building web applications, it is also important to consider what tools and frameworks
    are available that make our lives easier.


    In this chapter, we will look at some of the mobile UI frameworks that are popular.
    We will do this by taking the current Moundz UI and converting it to each of the
    frameworks, which should provide a feel for how the various UI frameworks operate
    and how they differ from working with a bare-bones HTML UI.


    # Mobile UI Frameworks Overview


    Getting started with mobile frameworks can be a little overwhelming, and choosing
    the right one can feel like a mammoth task. This is definitely compounded by the
    fact that, when building an app for the mobile Web, you may focus on building
    your application for one device without really knowing what other devices might
    end up using it. So, when you choose a framework, you want one that is going to
    work well on as many of those devices as possible.


    The world of mobile UI frameworks is moving pretty fast at the moment. When we
