    The HTML5 canvas is extremely cool addition to the tools that you have at disposal
    for building web applications in general. The canvas element provides developers
    a way to integrate a custom drawing area into their HTML layouts. This can be
    particularly useful and gives developers the ability to do more with their pages,
    whether that adding some interactivity or displaying a graph.


    While all browsers support for the canvas tag, Android''s WebKit browser does.
    This gives us the opportunity to explore it in our applications, and possibly
    writing simple games for Android purely using web technologies. While Flash (www.adobe.com/products/flashplayer)
    is normally the tool for writing simple games for the Web, the HTML5 canvas and
    JavaScript provide a compelling'
