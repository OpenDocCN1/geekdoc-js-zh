  md: "# Detecting Your Connection Status\n\nBeyond its caching capabilities, HTML5's\
    \ offline-caching feature can provide some extra utilities to deal with offline\
    \ mode. But these usually involve some advanced use where offline caching is not\
    \ enough. For instance, when you are offline, the synchronize function is quite\
    \ useless, and it would be better if you could hide the Synchronize button in\
    \ this case.\n\nLet's see how we implement this. First, we must be able to detect\
    \ whether we're online or not when we start the application. This might sound\
    \ quite simple, but is actually more complicated than it seems. HTML5 has specified\
    \ a feature that enables a application to check the connection status: navigator.online,\
    \ which should return a Boolean value. Unfortunately, Chrome doesn't support this\
    \ feature yet, and we have to use a workaround to simulate this behavior.\n\n\
    > NOTE: The HTML5 specification defines that the browser should be able to detect\
    \ its connection status by using JavaScript navigator.online. This function returns\
    \ a Boolean value that can be used to change your application behavior for offline\
    \ vs. online scenarios.\n\nUnfortunately, this is still not supported on the current\
    \ Android browsers—but it will be in the next release. Even better, the browser\
    \ that ships with Android 2.2 Froyo gives you more details about your connection\
    \ type and speed. That gives you the option to adapt your resources depending\
    \ on your bandwidth. For more details, see\nhttp://davidbcalhoun.com/2010/using-navigator-connection-android.\n\
    \nWhat we are going to do is make an HTTP request to a site, and if we don't receive\
    \ an answer after a configurable timeout, we can consider that we offline. For\
    \ strange reasons, Ajax's jQuery function doesn't trigger a timeout event or an\
    \ error event when you have no connection—for these reasons, we have to work around\
    \ this by using jQuery's Timer plug-in; after tweaking it bit, we end up with\
    \ something like this:\n\n```\n$('synchrize').oneTime(3000, function() {\n  $('synchrize').css(\"\
    display\", \"block\");\n});\n\n$.ajax({\n  url: 'query.yahoo.com/v1/public/yql?select=%20*%20format=json%20where%21%3D%22'\
    \ + encodeURIComponent(url),\n  '%22format=xml&callback=%22',\n  dataType: 'json',\n\
    \  timeout: 3000,\n  complete: function() {\n    $('messages').stopTime();\n \
    \ }\n});\n```"
  merge: -1
