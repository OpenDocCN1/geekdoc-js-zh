  md: '# CHAPTER 9: Native Bridging with PhoneGap


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_219_0.png)


    **NOTE**: Previously, we made reference to the use of data and file URLs. Typically,
    images in HTML are loaded from either a file or an HTTP URI string—for example,
    file://resources/test.jpg and http://test.com/test.jpg are examples of a file
    and an HTTP URI, respectively. While these are the most common ways to load an
    image (or other resources) into an HTML document, they are not the only way to
    do so.


    Data URIs offer an alternative to referencing an external resource, and are able
    to encapsulate the actual data that should be displayed. Data URIs can be particularly
    useful when developing mobile web apps, as resource data can be included within
    CSS, or copied to local storage for caching purposes. This in turn reduces the
    number of remote requests that need to be made to display a page, which can go
    a long way toward speeding up a mobile web application.


    For more information on the data URI format, the Mozilla Developer Center offers
    a nice explanation (see https://developer.mozilla.org/en/The_data_URL_scheme).'
  merge: -1
