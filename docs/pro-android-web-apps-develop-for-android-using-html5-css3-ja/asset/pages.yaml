  md: '# Getting Started with Google App Engine


    A jsonengine instance is hosted on Google App Engine (http://appengine.google.com/),
    which deserves a short introduction. Google App Engine is Google''s cloud-computing
    technology. It virtualizes applications across multiple servers and data centers.
    In simple terms, that means that your application is not running in one single
    place (like a data center in Silicon Valley), but is replicated across the world
    using Google App Engine''s immersive data center coverage.


    Google App Engine is a Platform-as-a-Service (PaaS) solution, and differs from
    the other cloud-computing services (such as Amazon Web Services). The main difference
    is that Google App Engine provides a complete set of services and tools based
    on conventions rather than configuration, which allows applications to be deployed
    very quickly. Another advantage of Google App Engine is its pricing—it''s free
    up to a certain level of used resources.


    > NOTE: PaaS is like any other type of hosting service, except that instead of
    providing you with a blank, "wildcard" server, it offers a predefined set of services
    and hardware solutions. It encapsulates a lot of complexity and configuration
    for you. The catch is that you''ll have less freedom, and you''ll have to follow
    the solution provider''s guidelines.


    So, before you use jsonengine, you have to set up Google App Engine. The first
    thing you have to do is download the Google App Engine framework, so you can test
    and deploy your application locally before putting it into the cloud. Google App
    Engine proposes two different kinds of framework:


    +   * A Python-based SDK

    * A Java-based SDK


    As jsonengine is based on Java, we are going to use the Java-based version. Don''t
    worry if you don''t have any knowledge about Java—it won''t be necessary. We simply
    need to deploy jsonengine, so you won''t have to do anything to configure or implement
    it.


    Let''s start by installing Google App Engine. First, download the binaries, which
    you can find here:


    ```

    http://code.google.com/appengine/downloads.html

    ```


    Then follow the installation instructions here:


    ```

    http://code.google.com/appengine/docs/java/gettingstarted/installing.html

    ```


    An useful guide for installing the App Engine SDK can be found on the jsonengine
    site:


    ```

    http://code.google.com/p/jsonengine/wiki/HowToInstall

    ```'
  merge: -1
