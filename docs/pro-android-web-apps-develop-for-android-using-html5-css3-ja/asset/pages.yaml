    **Figure 13-2.** Mobile browser market share from August 2009 to August 2010


    This data (sourced from StatCounter: http://gs.statcounter.com) shows a few things:


    +   - Android device usage is on the rise, but is still a small part of the market.


    +   - While the most popular mobile platform for browsing the web is iOS (iPhone,
