  md: "# CHAPTER 3: HTML5 Storage APIs\n\nThe implementation of the Web SQL Database\
    \ feels much like interacting with a typical Ajax handler (the SQL aside), as\
    \ interactions with the API are primarily asynchronous operations. Web workers\
    \ (which only have sparse support on mobile browsers) also have access to a synchronous\
    \ implementation—which is appropriate given their threaded execution context.\n\
    \nAt a high level, we can summarize the HTML5 Web SQL Database implementation\
    \ in about three methods:\n\n+   - openDatabase: Used to open/create a database.\
    \ This method takes five arguments:\n  - databaseID: The ID of the database.\n\
    \  - version: A string identifying the version of the database. This can be used\
    \ to implement this particular version-update scripts (more information on this\
    \ is provided in Chapter 4).\n  - description: A human-readable description of\
    \ the database.\n  - estimatedSize: The estimated size of the database (in bytes).\n\
    \  - creationCallback: A callback that will be executed once the database has\
    \ been opened/created (not implemented in all browsers).\n- transaction/readTransaction:\
    \ Used to open a transaction for the execution of one or more SQL statements.\
    \ The transaction method is used for INSERT/UPDATE/DELETE operations, and the\
    \ readTransaction is used for SELECT statements. This method only accepts one\
    \ argument:\n  - callback: The callback function that will be called when the\
    \ transaction has been opened. When the callback is executed, it passes in a single\
    \ argument for the transaction instance.\n- executeSql: Used to run an SQL statement\
    \ within a transaction. This method takes four arguments:\n  - sqlText: The SQL\
    \ statement to execute against the database.\n  - sqlParameters: An array of values\
    \ for the parameters included in sqlText statement. Parameters are specified in\
    \ the SQL using a question mark (?).\n  - completionCallback: A callback that\
    \ will be invoked when the SELECT statement has been successfully executed. In\
    \ the case of a SELECT statement, results will be returned as a second argument\
    \ in the callback. A transaction argument is returned as the first argument in\
    \ all cases if the callback is specified.\n  - error: A callback that will be\
    \ invoked if there are issues with the SQL statement or database."
  merge: -1
