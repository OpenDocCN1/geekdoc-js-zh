    # A Tale of Three Androids


    One of the primary criticisms of Android to date has been around the fragmentation
    of the OS versions that are "in the wild." This problem primarily because different
    versions of the OS may do something different from another version—yielding unexpected
    results. While this can be frustrating to work with as a developer, it is worth
    persevering, as you are ultimately writing code that will work (with minor modification)
    on any mobile device with a WebKit browser.


    We find ourselves in situation when we compare the techniques required to position
    images in high DPI devices for versions of Android up to and including 2.1 with
    those required for versions 2.2 and beyond. Figure 7-8 illustrates the difference
    in image positioning when compensating for devicePixelRatio the same way across
    three different versions of the Android OS. In each of the images, the touch start
    position was the center of the screen, but you can see the resulting image position
    in 2.2 no longer requires the compensation applied for previous versions.'
