  md: '# Chapter 3


    # # HTML5 Storage APIs


    In the last chapter, we looked at creating a simple mobile web page and a simple
    Create Task form for our to-do list application. In this chapter, we will look
    at options for being able to store data locally on the device. HTML5 introduces
    a couple of APIs that permit this kind of client-side storage.


    Previously when writing a web app, if you needed to save data to a database, you
    would need to use a server-side script (PHP, Python, Ruby, etc.) to do this for.
    Some emerging elements of the HTML5 API offer a client-side alternative for this,
    and investigating these and how to effectively use them will be the primary focus
    of this chapter.


    Essentially, three different types of client-side storage mechanisms are implemented
    as part of the HTML5 specification:


    +   * Web storage: Often referred to as HTML5 local storage, this is a clientside
    mechanism for storing key/value pairs. It''s simple, but very powerful (see http://www.w3.org/TR/webstorage/).

    * SQL database: This provides access to a SQLite-like database, which is a client-side
    alternative to a traditional RDBMS that you might find on a server (see http://www.w3.org/TR/webdatabase/).

    * Indexed database: A draft specification that has been proposed by the W3C to
    replace the currently implemented Web SQL specification, geared towards providing
    “database of records holding simple values and hierarchical objects” (see http://www.w3.org/TR/IndexedDB/).


    In this chapter, we will be focusing on the first two storage APIs listed above,
    providing an overview and sample code for both.


    Although the Indexed DB API has been put forward by the W3C to replace the Web
    SQL database, currently no versions of Android have shipped with support for the
    specification. For this reason, we have focused on the two that you can implement
    and right now—Web Storage and Web SQL database.'
