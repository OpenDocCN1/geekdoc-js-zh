  md: "Let's take a look at what we can do with translate and rotate methods in a\
    \ simple example. Create another HTML file for this example, rotation.html, and\
    \ base it on one of our earlier examples. Create a rotation.js file and include\
    \ that in the HTML:\n\n```\nfunction() {\n  var canvas = null,\n  context = null,\n\
    \  angle = 0;\n\n  function resetCanvas() {\n    // resetContext\n  }\n\n  function\
    \ animate() {\n    context.save();\n    try {\n      // clear the drawing surface\n\
    \      context.clearRect(0, 0, canvas.width, canvas.height);\n\n      // set the\
