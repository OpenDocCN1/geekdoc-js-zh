  md: "addMarker: addMarker,\nclearMarkers: clearMarkers,\n\nfindResources: findResources,\n\
    \n...\n\n};\n\nreturn module;\n\n)();\n\nThe preceding code shows that the modifications\
    \ required. We are adding a findResources function to the MOUNDZ module that will\
    \ find resources on the current map center position. The majority of this function\
    \ is a Ajax call using JSONP, as we used earlier to access the GeoNames data when\
    \ first getting an understanding of JSONP. When we receive successful results\
    \ from Geomier, these are passed to the processResourceSearch function. Let's\
    \ have a look at this function and its associated code.\n\n```\nfunction markResourceSearch(resource,\
    \ deposits) {\n  for (var i = 0; i < deposits.length; i++) {\n    // add the marker\
    \ for the resource deposit\n    addMarker(\n      new google.maps.LatLng(deposits[ii].lat,\
    \ deposits[ii].lng),\n      deposits[i].name,\n      '<div class=\"resinfo\">'\
    \ + deposits[i].total +\n      ' resources at this location</div>'\n    );\n \
    \ }\n}\n\n // markResources\n```\n\n```\nfunction processResourceSearch(data)\
    \ {\n  // clear any existing markers\n  clearMarkers();\n\n  // iterate through\
    \ the resource types and pin\n  for (var i = 0; i < data.resourceTypes.length;\
    \ i++) {\n    var resType = data.resourceTypes[i];\n\n    // mark the resources\n\
    \    markResources(resType.typeName, resType.deposits);\n  }\n} // processResourceSearch\n\
    ```\n\nThe two functions in this code are included in the MOUND module as internal\
    \ functions. As you saw in the findResources function, processResourceSearch is\
    \ called when we have received a successful response from the Geomier API. When\
    \ this happens, existing markers are removed, and new markers are added for each\
    \ of the different resource types that have been retrieved from the API.\n\nIn\
    \ the case of Moundz, we have only one type of resource for the sake of simplicity,\
    \ but we have implemented a loop here to enable us to support additional resource\
    \ types with relative ease if that is what is desired at a later stage.\n\nFor\
    \ each of the resource types, the markResources function is called to display\
    \ markers on the map as per the boilerplate mapping application that we explored\
    \ in Chapter 8."
