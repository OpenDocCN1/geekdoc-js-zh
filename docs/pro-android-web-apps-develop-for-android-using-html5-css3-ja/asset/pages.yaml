    One aspect that we haven''t looked at, however, is the use of the hsl color function
    to specify coloring for various elements on the page.


    The hsl function takes values for hue, saturation, lightness, and alpha, and offers
    an alternative to specifying colors using the more common rgba (for red, green,
    blue, alpha) function. We won''t go into great depth about how to use the hsl
    scheme, there definitely are some great benefits to using it, so it''s well worth
    if you have the time. For more information on the topic, the article at the following
    URL provides a great introduction: http://css-tricks.com/yay-for-hsl.


    # Twitter Anywhere and the Login Process


    The process for adding a third-party authentication service to your application
    is easy in some respects, but can also be painful at without. With mobile web
    apps being much a minority group at the moment, we don''t exactly have solutions
    that are tailor-made for our requirements.


    The current mechanism for providing authentication to an API which centers around
    a called OAuth (http://oauth.net). OAuth provides a robust authentication mechanism
    that prevents users from having to supply their username and password to the application
    using the service. It does, however, come with some complexity. The process of
    authenticating via OAuth involves directing users to the third-party service,
    which then asks the user to grant permission to your application.


    In the case of Mundz, we will not ask users to provide Mundz with a username and
    password, but rather direct them to Twitter. If they are already logged into Twitter,
    then they will be asked permission for Mundz to use their Twitter account. If
    they accept, then''ll be logged into Mundz successfully.


    Let''s look at implementing using the Twitter Anywhere Libraries (http://dev.twitter.com/anywhere).
    Following the instructions in the Twitter Anywhere Getting Started documentation
    (http://dev.twitter.com/anywhere/begin), the first thing to do is to create an
    application. This can be done by visiting the following URL: http://dev.twitter.com/anywhere/new.


    The registration screen is shown in Figure 10-14, and you can see that most of
    the details asked are for pretty obvious, with the exception of the callback URL.
    For this field, supply the domain that you think you will deploy the application
    to eventually. The information is used as part of the authentication process.


    > NOTE: If you like, you can avoid creating a new application for now, and instead
    use the existing Mundz key that has been created to work through the sample code.
    Then you can create your own application later.'
