    check-in data. For the moment, Twitter provides a good middle ground in terms
    of an easy-to-implement solution with a reasonably strong existing user base.


    > NOTE: You may be wondering why Twitter was chosen as the authentication provider
    when the Geominer API presumably already talks to geospatial networks such as
    Gowalla and Foursquare. This is a fair question, given that those of networks
    offer authentication support through their APIs. Primarily, this is because these
    geospatial networks still do not have as large a user base as Twitter.


    Geosacial calls Moundz might interest users of the current geospatial networking
    users, so it is desirable for them to be able to access the game without needing
    a user account on a specific geospatial network. In many respects, Twitter is
    neutral.


    We have a design decision to make: do we ask some to log in that authentication
    is required (i.e., when they start to collect resources), or do we create a welcome
    page and ask them to log in from the start? There are definite merits to both
    solutions, and many would argue that for a usability perspective it would be better
    leaving only until required, for the sake of simplicity we will build a simple
    application splash screen with a very clear "Sign in with Twitter" button.


