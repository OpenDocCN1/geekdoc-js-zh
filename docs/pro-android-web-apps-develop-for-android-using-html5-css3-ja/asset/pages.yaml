    section later in the chapter.


    # Adding Form Elements


    In terms of the actual HTML code, form elements are the same for mobile devices
    as they are for desktop browsers. It''s just the interaction with those controls
    that changes for a mobile device, and thankfully Android takes care of all for
    you. This is not surprising given that a HTML form element is simply an instruction
    to the browser saying, "Put native control here."


    For the sake of simplicity, we will initially set a "task" in our to-do list application
    to have three properties:


    +   - Name

    - Description

    - Due date (and time)


