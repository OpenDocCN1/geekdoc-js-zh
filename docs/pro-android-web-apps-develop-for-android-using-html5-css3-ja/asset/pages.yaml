  md: '# Chapter 6


    # # Competing with Native Apps


    It''s quite impressive that we can produce powerful and scalable mobile web applications
    just using HTML, CSS, and JavaScript. However, so far we haven''t achieved the
    look and feel that we would with a native application. Also, if our Internet connection
    goes down, our application will probably stop working, despite the fact that we’re
    using a local database.


    In this chapter, you will learn how to go step further in polishing your web app,
    first by adding user interface enhancements. We’ll use CSS3’s amazing animation
    and transition capabilities, and we’ll use robust and popular JavaScript libraries.
    Next, we’ll add geolocation and offline support using the latest HTML5 specifications
    and the Chrome browser. At the end of this chapter, we will have a fully standalone
    application that will be very similar to a native application.


    # ## Adding Lightweight Animations and Native-Like Layouts


    One of the big differences between native and web applications is that web applications
    often lack the great-looking user interfaces that native apps can offer. The good
    news is that technologies like HTML5, CSS3, and JavaScript can now offer solutions
    to compete with native technologies—for example, providing native browser animation
    features and ensuring that specific visual elements have a fixed position, such
    as a top bar menu.


    One of these new technologies, CSS3, adds a lot of improvements, including shadows,
    rotations, and gradients. But for this part we will focus on two very interesting
    features: CSS transitions and CSS animations.'
