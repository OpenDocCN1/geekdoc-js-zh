    While it is all well and good to talk about how not to display marker detail,
    obviously this doesn''t help build a mobile web app that includes mobile mapping.
    So let''s have a look at some alternative possibilities:


    +   - We could take the user to a detail page for that marker as soon as it''s
    tapped.

    - We would try to create a smaller custom info window that takes up screen estate
    and doesn''t require a Close button-the window automatically close when another
    pin has been tapped.

    - We could rework the interface to display marker detail at either the top or
    the bottom of the display, and perhaps provide a More Details button to take the
    user to the full detail page for the marker.


    Given these options, the third one is probably the best, so we will go with that
    option and see what can be done to restructure the interface and provide a foundation
    to move forward with our application build.


    # A Mobile-Optimized Mapping UI


