    Hopefully, this will provide a mobile web UI that can be used across devices,
    presenting a web UI in a device-neutral sense (rather than styling all UI elements
    with an iPhone look and feel).


    Additionally, as developers, we can only hope for the future of mobile web development
    tools to improve. While integrated development environments (IDEs) tend to get
    in the way of web development in general, having suitable testing and debugging
    tools for mobile devices will be important for mobile web development forward
    (in the same way that Firebug contributed to moving web development). There'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'is a lot that can be done using desktop browsers such as Chrome, but there
    really is no substitute for device-targeted development tools.


    # Changes in Device Architecture


    While Palm is not a dominant market player at the moment, there is a lot that
    can be learned from the way it architected its webOS (http://developer.palm.com).
    From the ground up, webOS has been built with a strong web technology focus, providing
    developers a first-class variety of building applications for the platform with
    HTML, CSS, and JavaScript.


    Given this is an Android web development book, that might be considered to be
    a strange comment, but let''s look at a couple of industry trends around both
    mobile and desktop computing:


    +   There is a lot of interest with regards to web operating systems as a replacement
    for current desktop operating systems. The implementation of a web operating system
    is generally achieved by using something like Linux to manage the interaction
    with the hardware, and then a web presentation layer providing the operating system
    "desktop" to the user. Two examples of web operating systems are Google’s Chrome/Chromium
    OS (www.chromium.org/chromium-os) and Joyent’s Jolicloud (www.jolicicloud.com).

    Modern mobile operating systems are demonstrating continued innovation, and they
    could quite possibly move to implementing web operating systems (as Palm has demonstrated)
    before broader adoption on desktop platforms.


    With those trends and the current Palm webOS architecture in mind, what will mobile
    device architectures look like in the future? Certainly one possibility is a device
    architecture that has a very strong web flavor to it, and this is shown in Figure
    13-5.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '![](img/6c8091bf3a3d21ca91f25f8caed8840f_355_0.png)


    Figure **13-5.** More mobile devices may incorporate services layer that exposed
    to a web-centric architectures in the future.


    In this architecture we see a services layer that is exposed to a web UI. This
    services layer would expose functionality of the device, very similar to the way
    that existing web applications expose RESTful web services.


    Using this technique for interacting with the device, combined with the fact that
    client-side web technologies are becoming more powerful, the need to build a mobile
    application interface with native languages should definitely become the exception
    rather than the rule.


    This will probably first be evident in an increasing number of mobile applications
    being implemented using web technologies as opposed to native technologies. Once
    mobile web applications are predominant, removing some of the intermediate layers
    to more tightly couple the web UI to the underlying system layers will likely
    be the next step.'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'NOTE: It is doubtful that this will occur on all mobile operating systems,
    as some will likely remain as natively development platforms. We would estimate,
    however, that by 2013 around 30 to 50 percent of mobile operating system vendors
    will either release or announce a mobile web operating system and complementary
    dashboard UI.


    Interestingly, some momentum is already building in this area, the European Union
    announcing a project called Webinos (http://webinos.org), which appears to be
    designed exactly what was suggested above.


    # Coding for Future Architectures


    If doings continue to progress in a web-oriented direction, then there will be
    very little that experienced mobile web developers will have to change. One exception
    to that may be the way we interact with client-side storage. For instance, while
    HTML5 offers three very interesting APIs for working with local data, we discovered
    in Chapter 5 that synchronization with online services was not available of the
    box.


    Given that mobile devices currently have (and may always have) less reliable connections
    than their desktops, it is expected that data synchronization will become a consumer
    requirement in the not-to-distant future. Therefore, either the HTML5 APIs will
    have to support this requirement, or some alternative options will need to be
    investigated. A very interesting possibility is the use of an embedded CouchDB
    (http://couchdb.apache.org/) instance within the mobile device, which would serve
    both the mobile app code and data, and keep that synchronized with the cloud automatically.


    Imagine—an embedded database capable of saving local web applications and supporting
    data, and keeping that in sync with the cloud so when you use the application
    from your desktop everything synchronized.


    # The Internet of Things


    As the number of web-connected mobile devices increases, but not only the number
    of potential consumers of information increase, but also the number of potential
    producers. As discussed back in Chapter 1, the modern smartphone already features
    a large number of hardware sensors, and this opens up quite some amazing possibilities.


    The increasing number of web-connected devices that are present in our society
    (mobile phones and tablets are part of that larger group) has resulted in the
    creation of some interesting research projects and applications that could influence
    the way our society and as individuals operate in the future.


    The collection of these web-connected devices has been termed the Internet of
    Things (http://en.wikipedia.org/wiki/Internet_of_Things), and is well worth getting
    involved if you are interested in building some really cool mobile apps.'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'Another term that is sometimes used to describe this connected network of devices
    is the Web of Things (http://en.wikipedia.org/wiki/Web_of_Things). The Web of
    Things and Internet of Things are very similar in that both involve a massive
    number of interconnected devices feeding real-time information between each other
    and centralized systems. The Web of Things, however, specifies the use of existing
    web communication standards such as HTTP, REST (http://en.wikipedia.org/wiki/Representational_state_Transfer),
    and RSS to enable that communication.


    >  > **NOTE**: From our observations, few things that happen on the Internet are
    planned and executed in a way that people expect. We believe that the evolution
    of the Internet of Things will be different, and that will begin with mobile devices
    communicating to web applications and sites. This will in turn probably mean that
    the Web of Things implementation will be the one that eventuates, rather than
    a new way of doing things. Whether that is a good thing or not is another concern,
    but to say there will be a significant increase in active web clients (desktop
    plus mobile plus embedded devices) in coming years. It will be interesting to
    see how the current way of doing things scales to that volume of information.


    # # Hardware Sensor Networks


    As stated previously, mobile devices can have many hardware sensors. Picture those
    sensors being able to (through appropriate privacy controls) share information
    with centralized systems. This could include data such as weather and traffic
    information at particular locations.


    A couple of examples of existing mobile applications and companion web sites that
    have already created sensor networks are Waze (http://waze.com) and NoiseTube
    (www.noisetube.net). Waze is a mobile application that collects GPS readings as
    you drive around your local area. That information is fed back into Waze and used
    to generate mapping information that can be shared among all users. Figure 13-6
    shows a screenshot of the Waze mobile interface, which is currently implemented
    as a native interface, but could easily be implemented as a mobile web application
    in the future.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '![](img/6c8091bf3a3d21ca91f25f8caed8840f_358_0.png)


    **Figure 13-6. The Waze mobile interface—not a web UI, but with HTML5 it could
    be.**


    Waze is an excellent example of an application that makes use of sensors to collect
    information. A more generic example of a platform that supports sensor networks
    is a site/application network called Pachube (www.pachube.com). Figure 13-7 shows
    a screenshot of the front page of Pachube displaying the number of sensors contributing
    information back into the network. These sensors are typically small embedded
    devices, but could be mobile devices just as easily.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# The Human Sensor


    In addition to the applications that focus on using device sensors to collect
    and communicate information, consider the phenomenon known as the Human Sensor.
    This is where individuals are reporting information about their surroundings back
    into a central system for processing.


    An excellent example of this is a mobile application and supporting web site called
    Ushidi (www.ushahidi.com). This application is designed to allow individuals to
    submit location-specific reports to a central Ushidi server. Figure 13-8 shows
    some device shots from the current Ushidi Android application, which like Waze
    is currently a native application.


    Figure 13-7. Pachube is a site with API-supporting distributed sensor networks.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# CHAPTER 13: The Future of Mobile Computing


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_360_0.png)


    **Figure 13-8.** Ushahidi is a crowdsourcing crisis information system with mobile
    clients.


    As can be seen in the device shots of Ushahidi, it markets itself as an application
    that does a particularly good job of collecting crisis information. In fact, the
    Ushahidi platform was used to assist with the relief efforts after the earthquakes
    in Haiti.


    In addition to specialized applications like Ushahidi, things like geosocial networking
    (as covered in Chapter 10) are also good examples of sensor networks driven by
    human interaction.


    # Summary


    In this chapter, we have had a look at some trends in mobile computing and how
    mobile web development fits into the picture. There are many opportunities opening
    up in the mobile space, both in established and emerging markets.


    Additionally, with more and more devices coming online, there are some very interesting
    projects that can be explored for mobile app development and in the cloud.


    The best thing any developer can do right now is to get involved, and we would
    highly recommend working with mobile web technologies, the more important thing
    is to get started somewhere. Hopefully, over the course of the book you have been
    exposed to both the basics of mobile web development and some more advanced topics,
    plus some ideas about the kinds of applications you could build.


    Now, get out there and build great mobile apps.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Appendix


    # Debugging Android Web Apps


    Debugging JavaScript applications and libraries is something that traditionally
    haunts web developers. You may have read forum comments or articles by people
    who have been less than enthusiastic about going down this mobile web application
    path. We will admit that it is more difficult than debugging an application that
    has a nice, shiny IDE; however, with the right tools and techniques, you can learn
    to track and fix JavaScript errors with relative ease. Before you debug your scripts,
    though, you can use certain tools to scan and check your code and report any issues.
    This is a huge saver in the development process. In this appendix, we will see
    how we can increase our productivity and at the same time improve our quality.
    This is an essential aspect of software engineering, especially when you start
    to work on bigger projects. A good starting point is the JSLint tool.


    # JSLint: Prevention Is Better Than Cure


    JSLint(http://jslint.com/) is a tool created by Douglas Crockford to assist developers
    in writing their JavaScript code consistently. JSLint is a quality tool, and it
    can run online at the JSLint web page or from the command line. Depending on the
    text editor you use, you may even be able to get a plug-in/extension that automatically
    runs JSLint over your code each time you save—which is very handy.


    JSLint checks for common mistakes that occur during coding, such as missing semicolons
    and patterns of "dead code," which is code that will never be executed because
    it is unreachable. It will also warn you code that runs without errors but is
    considered bad practice or violates a style convention, and it will produce a
    report for you that lists all the problems. In general, JSLint will help you fix
    code errors faster, as well as learn JavaScript practices, especially if you are
    a novice.


    In most cases, using the online JSLint tool is sufficient, and it''s recommended
    when working through the sample code in this book. In the online JSLint tool,
    you paste your'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# APPENDIX: Debugging Android Web Apps


    code into an input area and then just press a button to generate the report. But,
    if you are working on a big project with a team, at a certain point you may want
    to provide some automation in your build and release process, instead of checking
    manually each time by putting it into the online. For this type of situation,
    there are options available, including a plug-in for Hudson, a continuous-build
    server that automatically retrieves your source control, tests and distributes
    your code (see http://github-ci.org), and more basic scripts that can be integrated
    into cron for instance. Another option is to use Mozilla Rhino, which is a Java-based
    JavaScript interpreter (see www.mozilla.org/rhino). You can parse your script
    and use JSLint library to Rhino as arguments, and Rhino will run JSLint''s check.
    Because it''s a Java program, Rhino is very easy to integrate with other Java-based
    frameworks, including the famous Ant tool (discussed in more detail in Chapter
    9; see http://ant.apache.org). Check this blog post to see how Ant and JSLint
    can be combined: www.ifisgeek.com/2009/05/05/running-jslint-in-automated-build.


    Even if you take all these precautions to produce well-written, robust code, you''ll
    still have to confront the debug process at some point, especially the complexity
    of your script is growing or you''re dealing with third-party libraries where
    the implementation is unknown by you. The following sections discuss some of your
    debugging options.


    # Debugging with the Google Chrome Developer Tools


    The maturity of tools for working with JavaScript has improved dramatically over
    the last few years. The first notable mention goes to Firebug enabling the debugging
    of so much brilliant code during the course of the Ajax movement (see http://getfirebug.com).
    Second, and most important for us working in the Android mobile space, Chrome
    and the Chromium project (http://chromium.org) are taking that maturity further.


    The main advantage of working with the Chrome developer tools (www.chromium.org/devtools)
    in Chrome or Chromium is that you''ll be once again with the WebKit rendering
    engine, which means that your JavaScript code will be interpreted the same way.
    This provides developers with some common ground between the desktop and mobile
    platforms for identifying and debugging problems.


    We will have a look at some of the most useful tools now. The suite is integrated
    with the Chrome browser (www.google.com/chrome), but just be sure to have it installed
    before moving on.


    # Catching Messages and Errors in the Console


    The developer tools console is probably the least advanced of the tools available
    in the suite, but almost certainly the most useful. Simply put, the console is
    a reporting interface and a manual code execution tool. Figure A-1 shows an example
    of how the developer tools console appears after running the following snippet
    of code:'
  merge: -1
  pgno: 362
- img_proc: true
  md: '```

    <html>

    <body>

    <script type="text/javascript">

    // write some console messages

    console.debug("debug message");

    console.info("info message");

    console.warn("warning message");

    console.error("error message");


    // throw an exception

    throw new Error("This is a test exception");

    </script>

    </body>

    </html>

    ```


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_363_0.png)


    Figure A-1. The Chrome developer tools console after running our console test
    snippet


    The console displays messages that you placed in JavaScript code using console
    debugging. Additionally, it shows the location of any uncaught exceptions that
    have been raised while executing a script.


    To see an error in the context of the code that it was running against, simply
    click one of the underlined files displayed on the right of the screen. You will
    then be taken to the Resources section, which shows where the warnings/errors
    were generated from.'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'Debug and info messages aren''t displayed. Figure-2 shows an example of the
    Resources screen.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_364_0.png)


    **Figure A-2.** *The resources of the developer tools shows warnings, errors,
    and exceptions in context.*


    For the most part, the functionality provided by the console and Resources view
    is adequate for catching the small and frustrating errors that can occur when
    using JavaScript. For example, to insert your console statements at strategic
    places and using the right type ("warning," "info," "error" or "debug"). Your
    catch closure should always log the reason why it caught. Good log output is always
    instructive and helpful before using heavier tools as the debugger,


    # # Script Debugging


    Every now and again, you may hit a problem that is either difficult or inefficient
    to solve using logging to the console in isolation. For a long time, the console
    method was the best that JavaScript developers could hope for, but more recently
    Firebug and the Chrome developer tools have provided interactive debugging features.
    This enables the creation of breakpoints, watches, and other goodies that are
    usually reserved for IDEs and compiled code. Figure A-3 shows the script debugger,
    and, while we won''t go into an in-depth tutorial on its use here, we will just
    explain the basic concept of a breakpoint.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# APPENDIX: Debugging Web Apps 355


    A breakpoint functions just like the Pause button on your DVD player. It stops
    the code from running at whatever you set it. You can set a breakpoint anywhere—just
    click the line number, and the code will pause when it reaches the line. Why is
    it useful to pause code execution? Well, the moment you enter a breakpoint, you
    get an instant picture of your script, including all the variables. This is very
    useful, for example, to see whether a variable has been set or is still null.
    You can even change the value of a variable at runtime. You can also check the
    call stack, which be handy when you''re working with complicated functions and
    to know exactly who is calling whom. For example, if you set a breakpoint inside
    the function retrieveTaskDetails() which was called by the function getNewTask(),
    you will be able to see this arborescence in the debug tool.


    After inspecting your script, you have different options: step over, step in,
    and stop. Stepping over is like hitting the Play button on your DVD player after
    a video has been paused—your script will continue until it reaches the end or
    another breakpoint. Stepping in can be used if your breakpoint is on a line that
    calls another function. You can step into this function, and the script will freeze
    at the first statement of this function. Of course, you can stop the script at
    any time by clicking the Stop.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_365_0.png)


    Figure A-3. The script debugger provides breakpoints and variable variables for
    trying times.'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'NOTE: You''ll often hear the statement "Smart developers don''t use the debugger."
    The idea behind this is, if you put your console logs in the right places and
    trace the trace info, it won''t be necessary to use the debugger, and you''ll
    be spared a lot of time (checking your console output is quicker than injecting
    into your code). The fact is, however, that you won''t always be testing your
    code, and you''ll sometimes have to test code that you wrote a long time ago and
    don''t remember the details of—in these cases, the debugger offers some flexibility
    for seeing exactly what''s happening.


    # Inspecting the DOM with the Elements Tab


    It is pretty easy to end with typos in HTML, and sometimes strange things happen
    in your layout—especially when you are modifying the DOM (Document Object Model)
    at runtime. To see what the current state of your HTML is, the Elements tab in
    the developer tools is invaluable. Figure A-4 shows an example of the Elements


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_366_0.png)


    Figure A-4. The Elements tab shows the current state of the mobile app''s HTML.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# APPENDIX: Debugging Android Web Apps


    When an element is selected in the HTML pane on, the details of the element (including
    applied styles, bound event listeners, etc.) are displayed on the right.

    Additionally, (http://en.wikipedia.org/wiki/DOM_Inspector) to dynamically apply
    styles and change properties at runtime to experiment with what might have before
    implementing it. If you change a property at runtime, be aware that it will only
    be temporary; when your page is reloaded, this property will return to its original
    value, so don''t forget to update and save your source file if you find a suitable
    property for an element.


    # Debugging with the Android Debug Bridge


    While Chrome is invaluable for testing your web apps, spending time in the Android
    emulator is crucial to seeing how the application will act after deployed on device.


    > NOTE: In addition to running tests in the emulator, it is also important to
    test your application on an actual device before deploying either to a publicly
    accessible web site or the Android marketplace (if you are using a bridging framework).
    Information on how to configure USB debugging to gain similar debugging features
    as described below can be found at the web page: http://developer.android.com/guide/developing/device.html.


    Once you start working with the browser in the emulator or on an actual device,
    and you attempt to debug your application, it will start like you are working
    back in the early versions of Internet Explorer. JavaScript errors occur silently,
    and the Android browser doesn''t even have a console to mobile Safari on the iPhone.


    That''s certainly how it appears on the surface, but it''s not as bad as it seems.
    By using the ad tool that comes packaged with the Android SDK, you can actually
    see JavaScript errors that occur within the browser on the emulator.


    Running adb logcat will generate output similar to that displayed in Figure A-5.
    In this particular example, the events pertaining to JavaScript console events
    have been sent from the WebCore application. It can be useful to see what other
    events are going on the emulator, though–such when garbage collection and other
    system-level events are occurring.'
