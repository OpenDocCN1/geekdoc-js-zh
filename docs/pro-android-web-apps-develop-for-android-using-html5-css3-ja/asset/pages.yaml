  md: '# CHAPTER 1: Getting Started


    > NOTE: To keep things simple, in this example we ran Mongoose from the same directory
    that the helloworld.html file was stored in. For the remainder of the examples,
    we will be working in a slightly complicated directory structure to ensure that
    we can reuse files between chapters. For instance, in the example source code
