    # # Summary


    You saw in this chapter that the look and feel of web-based applications can,
    in fact, compete with native applications. CSS3 and HTML5 are really beginning
    to break new ground in these areas. In this chapter, you learned how to enhance
    the user interface by adding animations and complex layouts, and you also learned
    how to deal with situations where no connection is available by implementing mechanisms
    that make web applications behave like native ones.


    In the next chapter, we''ll focus on one of the features just introduced: working
    with location information—commonly called location-based services.'
