  md: '# ADDING AN ADDITIONAL EASING FUNCTION TO PROWEBURTS


    As mentioned previously, we really implemented one of Penner''s easing functions
    for our animation, and there are many more useful easing functions in its library.
    It is a reasonably simple exercise to take another of his existing samples from
    ActionScript and port it to JavaScript and into the probeapps.js file. One that
    would look good with the car animation (and a personal favorite of mine) would
    be the "Back Out" easing function.


    The Back Out easing function is a good pick for this particular situation as the
    effect is to slightly overshoot the actual animation end point, and then slowly
    reverse to the target point. In the case of a car, this looks quite believable.
    We don''t think you''ll be disappointed with whichever additional easing function(s)
    you may choose. Trust us, it''s hard to stop applying easing to your animations
    once you start.


    # Canvas Transformations and Animation


    It is impressive how powerful the HTML5 canvas is, and what can be achieved with
    using minimal code can give you a buzz. In this next section, we will introduce
    some transformation operations that we can use to provide additional animation
    to our car.


    Before we get into that, though, we''ll have a look at a simple example to get
    an overview of how transformations operate. There are a number of different transformation
    operations that are available to you when using the canvas; however, since this
    isn''t a book on the HTML5 canvas specifically, we will only touch on two operations
    that we require to expand on our sample:


    +   translate: The translate method shifts the origin of the canvas to the specified
    position. By default


    +   rotate: The rotate method rotates the canvas around the origin. In combination
    with the translate method, it can do some very cool things.


    > NOTE: Once you start transformation operations, you won''t have to reverse changes
    to the context state all the time. This is why we recommend getting into the habit
    of using the save and restore methods of the canvas, as they will prevent you
    from having to keep track of the various transformations and state you make.


    For more information on canvas transformations and the importance of the save
    and restore methods, we highly recommend the Mozilla Developer Center''s information
    on the topic, at https://developer.mozilla.org/Canvas_tutorial/Transformations.'
