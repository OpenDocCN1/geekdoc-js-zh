- img_proc: true
  md: 'The preceding code sample demonstrates how little JavaScript is required to
    get a simple map displayed in a web app. Essentially, it is a three-step process:


    +   1. Include the Google Maps API in your web application. The required script
    is located at https://maps.google.com/maps/api/js, and takes a sensor parameter.
    In the sample, we passed through a value of false for the sensor parameter, but
    if we had detected the user''s location using the Geolocation API as in Chapter
    6, we would have needed to pass this value as true.


    +   2. Define a function to initialize the map. This primary purpose is to create
    a new instance of google.maps.Map class. The constructor takes two arguments:
    first, the div that will contain the map once it is created; and second, an object
    of options that influence the map initialization. In the preceding sample, the
    map was instructed to zoom to level 8, positioned at a latitude and longitude
    near Sydney, Australia, and showing the map with a “Road Map” style.


    +   3. Finally, hook the function (initMap) up to the onload event of the document
    body.


    Once that is all done (combined with our standard boilerplate template), a screen
    similar to Figure 8–4 will be displayed.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_177_0.png)


    Figure 8–4. Displaying a mobile-friendly Google map is a simple exercise.'
