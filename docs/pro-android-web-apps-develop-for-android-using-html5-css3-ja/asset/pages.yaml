  md: '# CHAPTER 3: HTML5 Storage APIs


    It is our belief that WebKit browsers (as used natively on Android) will continue
    to support the Web SQL database for some time to come so you should feel comfortable
    using that specification even though the W3 have indicated that they will not
    be creating any revisions to the standard.


    # The Web Storage API


    Both the localStorage and sessionStorage objects implement the Storage interface,
    and this provides the following methods:


    +   - getItem

    - setState

    - removeItem

    - clear


    These methods capture pretty much the entire functionality of the Storage API,
    and while they appear simple, they open up some great opportunities. The magic
    lies in the fact that you can save any object into Storage. You just provide a
    key to access the value later, and away you go.


    In a simple case, you might simply save a string or other simple type values into
    storage. Consider the following code:


    ```

    localStorage.setItem("preferences-bgcolor", "#333333");

    localStorage.setItem("preferences-textcolor", "#FFFFFF");

    ```


    This creates two values in localStorage for tracking application preferences for
    a background and text color. You could, however, achieve the same result by storing
    a single object in localStorage with the following code:


    ```

    localStorage.setItem("preferences", {

    bgcolor: "#333333",

    textcolor: "#FFFFFF"

    });

    ```


    You can retrieve your preferences object by using a simple call to getItem:


    ```

    var preferences = localStorage.getItem("preferences");

    ```


    You should then be able to access the background color and text color preferences
    from the preferences object. Let''s try that now. Just show an alert to display
    the background color:


    ```

    alert(preferences.bgcolor);

    ```


    Um, well, that''s of embarrassing. Depending on the implementation of the Web
    Storage API browsers are using when you are reading this book, you may well find
    that the preceding call just shows you a message as the JavaScript alert displayed
    in Figure 3–1.'
