    # # Making a Desktop Interface


    One of the benefits of building a web-based application is that you can easily
    provide access to your data in web-based formats—for example, tablet devices and
    more standard desktop browsers. First, let''s focus on the latter and see how
    we can connect our storage to a “regular” desktop web application.


    Creating a desktop interface from an existing mobile interface is far simpler
    than trying to create a mobile interface from an existing desktop web application.
    To see evidence of this, look at the way the mobile application interfaces have
    affected the interfaces of their various big brothers. The recent revisions to
    the Twitter web interface are example of how user interface paradigms can affect
    desktop interfaces to create a better user experience (http://twitter.com).


    As we have one-way synchronization only, the desktop application will be read-only
    (and, building a desktop interface is not really in the scope of this book, we''ll
    keep it minimal). If we go back to the example of our scientist collecting data,
    consider the desktop application as a reporting tool for his colleagues all around
    the world who want to keep informed about his latest findings.


    What you''ll learn in this section is that building a mobile web application relying
    on robust and standard web technologies allows you to extend its features to other
    web-'
