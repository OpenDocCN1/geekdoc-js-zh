    release of iOS 4; however, prior to there was a fairly significant difference
    between the way Android and iPhone applications behaved when a user "exit" them.
    On the iPhone, once you left an application, it essentially stopped running—which
    meant really wasn''t any ability to do anything in the background. On Android,
    if a user'
