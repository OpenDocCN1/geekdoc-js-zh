  md: 'The context.save method is called to save the canvas state as step 1. We open
    a try..finally block to implement steps 2 through 5.


    The first call in the inner block is then calling the context.clearRect to clear
    the canvas background. This covers step 2 in our process, but as mentioned earlier,
    in some cases you may want to remove this to optimize performance.


    We now move to step 3, which is adjusting the canvas parameters for drawing the
    display. In our sample, we are adjusting the strokeStyle and lineWidth parameters
    of the canvas context. Additionally, note our use of the CSS3 rgba function to
    specify the strokeStyle(see www.w3.org/TR/css3-color/#rgba-for more info on the
    rgba function). The rgba function allows us to provide the red, green, blue, and
    finally alpha values for the color of the stroke (or fill). This provides us with
    the ability to create semitransparent lines and fill, which can provide visually
    appealing effects.


    Then step 4—we draw. In the case of our example, steps 4 and 5 are very much intertwined,
