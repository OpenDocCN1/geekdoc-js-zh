- img_proc: true
  md: '# box-shadow (-webkit-box-shadow)


    The box-shadow property is used to apply a shadow to HTML elements without requiring
    external image resources—very nice. The property property takes four parameters
    that allow you to specify how the shadow should appear:


    +   - Horizontal offset: This defines where the shadow should be positioned relative
    to the control in the horizontal direction. Positive values position the shadow
    to the right of the control, and negative values position it to the left.

    - Vertical offset: This specifies the radius for the vertical axis. Positive values
    position the shadow below, and negative values position it above.

    - Blur radius: This specifies the radius for the blur effect. Basically, bigger
    numbers mean a larger shadow that fades out gradually; smaller numbers mean a
    smaller, crisper shadow.

    - Shadow color: This specifies the color of the shadow—pretty self explanatory,
    rarely. Most commonly, you''ll be using shades of gray here, but colors can be
    used to create glow effects.


    # gradient fill style (-webkit-gradient)


    So we''ve used shadows and rounded corners in our form; now we''ll take a look
    at gradients, which can capture the visual appeal of many current mobile apps.
    Gradients in CSS3 are not implemented as a CSS3 property, but rather as a fill
    style—and they are very powerful and quite configurable. I''m sure there are whole
    chapters dedicated to gradients in a CSS3 book, so I won''t attempt to cover all
    the detail. Essentially, there are two types of gradients: linear and radial.
    This chapter''s example uses a linear gradient, so I''ll cover that here. Specifying
    a linear gradient requires a minimum of five parameters (to actually make a gradient
    effect occur), but more can be used to specify additional colors.


    +   - Gradient type: This is the type of gradient you are going to display—linear
    or radial.

    - Point 1: This is the starting point of the gradient. It''s a pair of space-separated
    values that specify the position. We used names in our example (left top and left
    bottom), but additionally numeric values (in the range of 0.0 to 1.0) or percentages
    can be used.

    - Point 2: This is the ending point of the gradient.'
