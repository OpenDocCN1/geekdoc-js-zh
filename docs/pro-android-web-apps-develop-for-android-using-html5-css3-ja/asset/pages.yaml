  md: '# Introduction


    As we move into a world where mobile devices are becoming the primary mechanism
    for people to connect with the Internet, it should come as soon as no surprise
    that the ability to develop applications for mobile devices is becoming a sought
    after skill. We also have very strong vendor competition in the space, resulting
    in a marketplace filled with a variety of devices.


    We see vendors promoting development tools and marketplaces for their own devices,
    attempting to create ecosystems around their products. For the most part, the
    strategy is working too (for some vendors more than others). Developers are using
    these tools and creating ''native'' applications and having to rebuild large portions
    of their applications to target each different device. I venture not. There must
    be a better way.


    For companies building mobile applications, this is an acceptable approach. It
    is, however, one that is entirely unsustainable for the longer term. Consider
    that each company with a web product will be expected to provide both a desktop
    application and suitable mobile clients for multiple devices. Then consider the
    number of software developers - people like you and me, and that are there in
    the world. Do we have the required resources to meet this demand?


    Building mobile web apps is this better. It is an approach to mobile development
    that when done right, will have you writing a lot less to catch the variety of
    devices that exist in the marketplace. This book focuses on writing mobile web
    apps for Android, but in reality many of the concepts can be easily ported to
    other mobile devices (which is the whole point).


    # What’s a Mobile Web App?


    A mobile web app is an application that is built with the core web technologies
    of HTML, CSS, and JavaScript, and is specifically designed for mobile devices.
    Helping mobile web apps gets a bit of attention as the trend towards HTML5 and
    CSS3—the latest “versions” of the two technologies. We explore HTML5 and CSS3
    in detail in the book along with a lot of JavaScript.


    JavaScript is the language that many developers love to hate. Some don’t even
    regard it as a programming language at all. However, JavaScript is here for the
    long haul, and is likely to be the most in demand skillset for the next five years.


    # Which Technologies Are Used in This Book?


    In the book, we work through lots (and lots) of JavaScript code. There’s obviously
    quite a bit of HTML and CSS too, but JavaScript is really the language of mobile
    web app development.

    If you haven’t worked with JavaScript in the past, we don’t completely drop you
    in the deep end, but we would recommend getting hold of some learning materials,
    as this isn’t'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'JavaScript fundamentals book. We also make extensive use of the excellent jQuery
    JavaScript library to make life generally easier during development. If that is
    something that is new to you, we recommend having a jQuery tutorial or two handy
    as well. If you have experience with PrototypeTools, or another of jQuery’s “competitors”,
    then you should be able to adapt the sample code in the book with relative ease.


    In terms of mobile web apps (and other JavaScript-rich web apps), learning how
    to structure your applications for readability and maintainability is important.
    This is one of the reasons we have chosen to work through a couple of small application-sized
    projects in the book rather than code snippets for various functions. This will
    allow you to become familiar with the different technical aspects of mobile web
    app development, and also gain an understanding of how you could effectively put
    a real-world mobile web application together.


    If you are already familiar with web application development, this book should
    make the transition to mobile web app development simple. If, however, you are
    coming from a mobile application development perspective, and are looking to explore
    the web app approach, having those extra learning materials will make a big difference.


    # What’s in This Book


    This book is structured around two application samples that will teach you the
    various aspects of mobile web app development. Chapters 2-6 deal with the first
    mini application of a simple “To Do List”, and Chapters 8-12 guide you through
    the beginnings of building a simple location-aware game.


    In around these two “main meals” we have three “snack” chapters. Chapter 1 is
    focused on getting you up and running with the basic concepts for writing Android
    web apps. Chapter 7 is a short look at working with interactivity and the HTML5
    canvas. And finally, Chapter 13 takes a look at some of the things that might
    be coming our way in the world of mobile apps.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# # Chapter 1


    # ## Getting Started


    Welcome to the wonderful world of web app development for Android. Over the course
    of the book we will walk through the process of building mobile web apps. While
    targeted primarily at Android, most (if not all) of the code will work just as
    well on Chrome OS–the reusability of the application code will go beyond Chrome
    OS–the code from this book should be able to run on any device that provides a
    WebKit-based browser. If you aren''t familiar with WebKit or Chrome OS at this
    stage, don''t worry–you will be by the end of the book.


    In this chapter, we will go through a few topics at a high level so you can start
    building applications as quickly as possible:


    +   - An overview of the platform capabilities of Android

    - Which of those capabilities can we access through the web browser (either by
    default or by bridging frameworks such as PhoneGap)

    - Configuring a development environment for coding the samples in your book and
    your own applications

    - An overview of the tools that come with the Android development kit, and some
    supporting tools to assist you in building web apps


    # ## Understanding Android Platform Capabilities


    The Android operating system (OS) was designed as a generic OS for mobile devices
    (including smartphones and tablet PCs). The plan was that Android would serve
    multiple device manufacturers as which the manufacturers could customize and build
    upon. For the most of this vision has been realized, and a number of manufacturers
    have built devices that ship with Android installed and have also become part
    of the Open Handset Alliance (http://openhandsetalliance.com).


    Android, however is not the only OS available, and this means that a native Android
    application would have to be rewritten to support another (non-Android) mobile
    device. This leads to having to manage the ongoing development of mobile applications
    for each of the platforms that you wish to support. While the large companies
    of the'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# CHAPTER 1: Getting Started


    world can afford to do this, it can be difficult for a smaller organization or
    startup. Here lies the attraction of developing mobile web apps—write the application
    once and have it work on multiple devices.


    This section of the book will outline the current features of the Android OS,
    and relevant whether you can access that functionality when building web applications.


    For those who would prefer a summary of the system capabilities and what you can
    actually access it via the browser or a bridging framework, then head straight
    to Table 1– toward the end of this section.


    # BRIDGING FRAMEWORKS


    A bridging framework provides developers a technique for building web applications
    that can be deployed to mobile devices. The framework also provides access to
    portions of the native device capabilities (such as the accelerometer and camera)
    through a wrapper (usually JavaScript) to the native API.


    During the course of the book, we will work through some examples that use PhoneGap
    (http://phonegap.com) to bridge to some of this native functionality. While PhoneGap
    was one of the first, there are many more bridging frameworks. In this book, though,
    we focus on PhoneGap, as it provides a stable and lightweight approach for wrapping
    a mobile web application for native deployment.


    For more information on the mobile web app frameworks, I have written a couple
    of different blog posts on the topic. In particular, the following post has some
    comments from contributors on the projects that help to show their areas of strength:
    http://distractable.net/coding/iphone-android-web-app-frameworks.


    While I would have to talk more about each in this book, the focus here is on
    building mobile web applications. From my perspective, these are applications
    that can be deployed to the Web and accessed via a device''s browser. The addition
    of a bridging framework should be an optional extra rather than a requirement.
    Given this particular use case, PhoneGap is a clear winner.


    # Device Connectivity


    While we are all probably starting to take the connectivity options of our own
    mobile devices for granted, it''s important not to do this as a mobile developer
    (web app or native). If mobile applications are built assuming that a connection
    to the Web is always available, this limits the usefulness of an application when
    connectivity is limited—which is more than you might think.


    Understanding that your application will have varying levels of connectivity at
    different times is very important for creating an application that gives a satisfying
    user experience at all times.


    In very simple terms, a mobile device can have three levels of connectivity from
    a web perspective:'
  merge: -1
