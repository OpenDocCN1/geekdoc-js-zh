  md: "# CHAPTER 10: Integrating with Social APIs\n\n![](img/6c8091bf3a3d21ca91f25f8caed8840f_234_0.png)\n\
    \n**Figure 10-2.** The network view of the developer tools shows us where the\
    \ problem exists.\n\nThe network view in the developer tools confirms that the\
    \ browser has indeed blocked the cross-domain request in accordance with the same-origin\
    \ policy.\n\nThis is where a JSONP workaround comes in. JSONP works within the\
    \ bounds of the same-origin policy, using rules that permit script includes from\
    \ other domains. So, whereas a JSON request occurs via the XMLHttpRequest mechanism,\
    \ a JSONP request is inserted and runs as a script. This may sound a little confusing\
    \ and take some time to get your head around if you haven't come across JSON before.\n\
    \nWell, let's update our Twitter sample to use JSONP and see if we can gain an\
    \ understanding of what's going on.\n\n```\n<html>\n<script src=\"../js/jquery-1.4.2.min.js\"\
    ></script>\n<script>\nfunction showData(data) {\n  var tweetItems = '';\n\nif\
    \ (data) {\n  tweetItems = '<li><strong>Count not retrieve tweets.</strong></li>';\n\
    } else {\n  for (var ii = 0; ii < data.length; ii++) {\n  tweetItems = '<li>'\
    \ + data[ii].text + '</li>';\n  }\n} // for\n```"
