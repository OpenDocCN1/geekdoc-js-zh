  md: '+   - A high-bandwidth connection (e.g., WiFi)

    - A lower-bandwidth connection (e.g., 3G)

    - Limited or no connection (offline)


    At present, when building a pure web app, you can only detect whether you have
    connectivity or not (without actually attempting downloads or the like to test
    connection speed). This is different from building native Android applications,
    as these applications can access native APIs that provide information regarding
    the device''s current connection type and quality.


    In Chapter 5, we will investigate features in the HTML5 API for enabling your
    applications to work well offline, and in Chapter 9 we''ll explore examples using
    bridging frameworks to access some of the native connectivity detection.


    # Touch


    One of the features that helped the current breed of mobile devices break away
    from the old is the touch interface. Depending on the version of Android, at a
    native level you will either have access to multitouch events or just single-touch
    events. Web apps, on the other hand, only allow access to single-touch events
    at this stage.


    > NOTE: Not having multitouch support for web apps certainly gives native applications
    an edge when it comes to application UI implementation. This will almost certainly
    change in the future, but for some time we will likely have a situation where
    Android devices support multitouch for web apps and others don''t.


    It will be important for the next couple of years to always code primarily for
    single-touch, and offer improved functionality (time permitting) for devices that
    support multitouch events in the browser.


    We will start exploring touch events in some depth in Chapter 7.


    # Geolocation


    The Android OS supports geographical location detection through different implementations,
    including GPS (Global Positioning System) and cell-tower triangulation, and additionally
    Internet services that use techniques as IP sniffing to determine location. At
    a native API level, geolocation is implemented in the android.location package
    (ee)


    ```

    http://developer.android.com/reference/android/location/package-summary.html,
    and most bridging frameworks expose this functionality from the native API.

    ```


    Since HTML5 is gaining acceptance and has been partially implemented (full implementation
    will come once the specification is finalized in the next couple of years),'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'we can also access location information directly in the browser, without the
    need for a bridging framework. This is done by using the HTML5 Geolocation API
    (https://www.w3.org/TR/geolocation-API). For more information on the HTML5 Geolocation
    API, see Chapter 6.


    # Hardware Sensors


    One of the coolest things about modern smartphones is that they come equipped
    with a range of sensors, and as technology becomes more pervasive this is only
    going to increase. One of the most widespread sensors currently is the three-axis
    accelerometer, which allows developers to write software that tracks user interaction
    in innovative ways. The list of sensors that the Android OS can interact interact
    goes beyond the accelerometer, however, and a quick visit to the current hardware
    sensor API reference for native development reveals an impressive list of sensors
    that are already supported in the native API (http://developer.android.com/reference/android/hardware/Sensor.html).
    Table 1-1 lists the various sensors and provides information on whether the sensor
    is currently supported by the bridging framework PhoneGap. If you are not familiar
    with one of the sensors listed, then Wikipedia has excellent information - simply
    search for the sensor name. Note that while the Android SDK (software development
    kit) supports a number of sensors, most are not accessible via mobile web apps
    (yet).


    **Table 1–1. Sensors Supported by the Android SDK**


    | Sensor | PhoneGap Support |

    | --- | --- |

    | Accelerometer | Yes |

    | Gyroscope | No |

    | Light | No |

    | Magnetic field | No |

    | Orientation | Yes |

    | Pressure | No |

    | Proximity | No |

    | Temperature | Yes |


    One of the most compelling arguments to go native development over web development
    is to gain access to the vast array of sensors that will continue to be added
    to mobile devices as technology progresses. While definitely a valid argument,
    building a web app in conjunction with a bridging framework can allow you to access
    some of the more commonly used and available sensors.'
  merge: -1
