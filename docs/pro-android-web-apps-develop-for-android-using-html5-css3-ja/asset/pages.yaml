    # # Summary


    This chapter covered a lot of material in the areas of mapping and location-based
    services. We looked at two different mapping APIs that are currently available,
    and looked in some depth how to create a web-mapping application that uses the
    Google APIs and feels good in the Android browser.


    Like most mobile web app development, this has involved being selective about
    the tools that we used and applying some different usability principles that might
    be used for building a desktop web application.


    In the next chapter, we will take this boilerplate code and use it as the basis
    for our geospatial app. In addition to working through parts of the application,
    you will also get an introduction to PhoneGap as we wrap the web app in native
    code. By the end of the build, we''ll have a product that can be deployed to the
    Android marketplace.'
