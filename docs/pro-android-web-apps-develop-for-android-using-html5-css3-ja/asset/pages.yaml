  md: '# Dealing with APIs That Lack JSON Support


    In the instances where an API does not provide JSON access, what are the options?

    This is a pretty important question in our case, as at the time of writing neither
    Gowalla

    or Foursquare supports JSON-style calls in its API.


    We will briefly look at three different options that will provide access to web
    services

    that do not provide JSON-style access.


    # Writing a Server-Side Proxy


    Before JSON became a popular option for writing client-side "mashups," developers

    would traditionally write their own set of web services that would proxy the remote

    services. These web services would be deployed to the same domain that would serve

    t application, and this would mean no calls violated the same-origin policy.

    implementation of such a solution will vary depending on the language you are
    working

    with, and the implementation details are beyond the scope of this book, but there
    is a lot

    of good information out if there is something that you require.


    Another alternative is to writing your own server-side proxy, given that JSON
    is now

    available to you, is to use a third-party service to wrap web services that provide
    only a

    JSON implementation with JSON. A couple of good examples of this are the following:


    +   - http://jsonify.heroku.com

    - http://jsonproxy.appspot.com


    Both services have source code available and are hosted in cloud-hosting services,
    so

    y can modify them to suit your own requirements.


    # Yahoo Query Language


    Yahoo Query Language (YQL) is fantastic; really aren''t enough nice things that
    can

    be said about it. It is essentially very robust and generic proxy that can be
    used to

    request data from varying sources and return it in a standardized XML or JSON
    with

    (JSON support) format.


    Interacting with YQL does through the use of an SQL-like syntax, screenshot is
    where the

    QL part of the name comes from. Figure 10–6 shows a screenshot of the developer

    console, which is one of the core tools of the YQL suite. The console can be found
    at

    http://developer.yahoo.com/yql/console.'
