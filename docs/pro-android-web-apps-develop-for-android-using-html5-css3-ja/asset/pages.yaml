  md: "+   quality (default: 80): A numeric value in the range of 1 to 100 that specifies\
    \ the quality of the image that should be returned. While you may be thinking\
    \ that you should set the image quality to 100 so you get the best image, images\
    \ with quality values above 90 or so can get large very quickly. It is recommended\
    \ that the default setting be used.\n\n+   destinationType (default: DATA URL):\
    \ An enumerated value for how the image data should be returned. The two valid\
    \ JavaScript values that can be specified for this option are Camera.DestinationType.DATA_URI\
    \ and Camera.DestinationType.FILE_URI (A comparison between data URLs and file\
    \ URIs [uniform resource identifiers] can be found in the following note.)\n\n\
    +   sourceType (default: CAMERA): For Android, this can be specified as one of\
    \ two values. One is Camera.Picturesourcetype.CAMERA, which specifies retrieving\
    \ a new image from the camera, and the other is Camera.PictureSourceType.PHOTOLIBRARY,\
    \ which specifies retrieving an image from the photo library on the device.\n\n\
    With in mind, if we wanted to retrieve an image from our Android device's photo\
    \ library rather than the camera, and then wanted to return the file URI for the\
    \ image, the following code would do the trick:\n\n```\nnavigator.camera.getPicture(successHandler,\
    \ failureHandler, {\n  quality: 50,\n  destinationType: Camera.DestinationType.FILE_URI,\n\
    \  sourceType: Camera.PictureSourceType.PHOTOLIBRARY\n});\n```\n\nThe result of\
    \ calling the preceding code would yield a display similar to that shown in Figure\
