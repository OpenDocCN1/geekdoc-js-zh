  md: '# Chapter 7


    # # Exploring Interactivity


    In previous chapters, we explored building an Android web app similar to any desktop
    web app. Our experience of mobile development so far has been catering for a smaller
    display and taking advantage of some of the HTML5 API features implemented in
    mobile WebKit.


    In this chapter, we will take a slight break from building complete mobile web
    apps and explore interactivity through touch events and the HTML5 canvas. Throughout
    the chapter, we will look at:


    +   - Touch events and where they are both similar and different from mouse events
    for desktop browsers


    +   - HTML5 canvas drawing and animation, including some simple best practices
    when working with canvas and animation


    +   - Some more advanced animation techniques, such as how to produce more realistic
    animation through various techniques


    +   - Some of the current things to watch out for working with the canvas on Android,
    which also includes differences in the way the canvas behaves between different
    versions of the Android OS


