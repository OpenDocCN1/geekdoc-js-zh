    otherwise, they will not be transferred as part of the native bundle. When working
    with larger projects, we would additionally recommend implementing some kind of
    build script to handle transferring the required resources into your bridge application.
    This will make it simpler to work on a central code base that is able to be deployed
    directly to the Web and also through native wrappers like PhoneGap.


