  md: '# Chapter 10


    # # Integrating with Social APIs


    Now that we''ve put many of the foundations in place, we can start putting together
    our geosocial game application. In this chapter, we''ll build a game called Moundz.
    Moundz is a geosocial game that piggybacks off existing geosocial networks as
    Foursquare and Gowalla. The general concept is that geosocial check-ins of people
    around the world become resources. These resources are collected and redeployed
    in a quest for virtual world domination. In Moundz, players help to build ant
    mounds that become their strengths, from which they can launch an assault on enemy
    territory. Only the strong and diligent will survive.


    Interested? Well, let''s get started.


    # ## Connecting to Web APIs


    The best things you can do as an application developer is consider what other
    existing web applications you can hook into to service some of the needs of your
    app. This will not save a significant amount of development to build your application,
    but will likely provide you access to an established group of users that are actively
    using another application.


    For instance, in Moundz we are going to need some kind of geographically located
    resources that playing the game can "mine" to build their "bases." Rather than
    building our own database of locations, we are much better served by tapping into
    an existing application that provides that kind of data already.


    As turns out, geosocial networks like Gowalla and Foursquare have exactly the
    kind of information we need, and they both provide an API that exposes their data.
    Most things in life, though, it''s not quite that easy. The majority of APIs that
    have been built usually offer integration via XML and sometimes JSON, but when
    you are building an application that is going to be "mashed up" at the client,
    you often need something called JSONP support. The next section gives an overview
    as to why.'
