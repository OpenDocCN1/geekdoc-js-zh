    In the case you are building an application that will be deployed online and primarily
    accessed through the mobile browser, a workaround is going to be required. Currently,
    the most effective workaround is to tell the browser to scroll to the top of the
    screen once it has finished loading the page. This works because the vertical
    scrolling behavior for the browser when viewing pages is to scroll off the URL
