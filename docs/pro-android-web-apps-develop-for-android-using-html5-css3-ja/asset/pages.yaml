  md: '# Chapter 5


    # # Synchronizing with the Cloud


    In this chapter, we will explore using a variety of hosted (or cloud) services
    that are available to us for synchronizing our tasks from our to-do list with
    online storage. Although offline storage is a very handy and powerful feature,
    we cannot deny the fact we are in a connected world. Data should be shared and
    made available online. To achieve this, all the data we are collecting locally
    has to be synchronized with an online solution.


    What you will learn is using leading-edge technologies, such as NoSQL cloud-hosted
    solutions, which are storage systems that don''t rely on the classic relational
    form, and instead provide a new way to deal with storing data. We currently have
    a lot of solutions that encapsulate the complexity of these new technologies for
    you and let you focus on the core development of your application.


    But that''s not all—using an online storage framework provides a way of hosting
    your mobile application in the cloud, making application available for the entire
    world. While native applications live inside a device, mobile web applications
    need to be hosted. That is, their pages are served from a remote location—a server
    that communicates with the mobile native browser. While you could host your applications
    on one of the classic web-hosting providers that are available, in this chapter
    we will look at a powerful and affordable alternative cloud-hosting solution.
    This solution will permit you to host both your storage mechanism and the application
    itself.


    # Exploring Online Storage Options


    At present, the options for synchronizing locally stored data with centralized
    storage in the cloud are somewhat limited. This situation is slowly changing,
    though, and in the future we may be spoiled for choice. For the purposes of this
    chapter, however, our primary need is something that works well from the client
    side, and in particular JavaScript; for that reason, JSON (JavaScript Object Notation)
    will be the format we''ll'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'use to bother and store the data. JSON is also useful because it''s the most
    common data interchange format (besides XML) in web-based architectures in which
    the client side relies heavily on JavaScript. Let''s take a look at the requirements
    for a suitable online data synchronization store that will ensure our offline
    data will be mirrored on the Web (and thus accessible to other people).


    # # Online Synchronization Store Requirements


    What exactly are we looking for in an online storage solution? A solution that
    would serve us for a general synchronization solution will require the following
    features:


    +   - Avoiding a complex and somewhat old-school three-tier architecture (front
    end, back end, and database)

    - Some flavor of user authentication

    - A supporting JavaScript library that makes synchronizing data stored on the
    device snap


    Additionally, given that we want to focus on giving users of our application the
    best experience possible, our online storage solution shouldn''t take another
    person/team to create or maintain. It should be simple and scalable.


    Bearing the requirement of simplicity in mind, we will explore the features just
    outlined in a little more depth.


    # # Avoiding a Three-Tier Architecture


    Classic web applications are based on three-tier architecture, made up of:


    +   - A front-end layer, containing the HTML pages, styles, and other assets

    - A back-end layer, hosted by an application server (such as Tomcat or JBoss for
    enterprise Java solutions, or IIS for .NET applications)

    - A database provider, such as MySQL, Oracle, or Microsoft SQL Server


    This kind of architecture requires at least three kinds of development skills:
    front-end, server-side, and database skills. This is far beyond the scope of this
    book, as we want to put the focus on building web applications—especially on the
    front-end aspects. Modern frameworks allow us to abstract much of this formerly
    problematic business logic and storage.


    # # User Authentication


    Our mobile application as we have built it now works very well for a user running
    from a single device. Having all the information contained within storage on a
    single device, however, is not a great solution. If instead that information is
    going to be stored on the'
