  md: "# CHAPTER 4: Constructing a Multipage App\n\n+   getInTasks: Used to return\
    \ tasks that have not been marked as complete. Notice that we make use of the\
    \ extraClauses parameter of the getTasks to restrict the result set.\n\n+   getTasksInPriorityOrder:\
    \ Used to return incomplete tasks in due date order. Note the use of the JavaScript\
    \ Array.sort method here to sort the results. While we would normally implement\
    \ this using an ORDER BY statement in SQL, some of the datetime mismatches make\
    \ it simpler (but probably less efficient) to implement in JavaScript.\n\n+  \
    \ getMostImportantTask: Used to return the first of our tasks from the getTasksInPriorityOrder\
    \ method.\n\nWe need to modify the saveTask method to allow us to update existing\
    \ tasks, in addition to creating new tasks.\n\nAdditionally, the saveTask method\
    \ is modified to support both creating new tasks and updating existing tasks:\n\
    \n```\nsaveTask: function(task, callback) {\n  db.transaction(function(transaction)\
    \ {\n    // if the task is not assigned, then insert\n    if (!task.id) {\n  \
    \    transaction.executeSql(\n        \"INSERT INTO task(name, description, due)\
    \ VALUES (?, ?, ?);\",\n        [task.name, task.description, task.due],\n   \
    \     function(tx) {\n          transaction.executeSql(\n            \"SELECT\
    \ MAX(rowid) AS id from task\",\n            [],\n            function(tx, results)\
    \ {\n              task.id = results.rows.item(0).id;\n              if (callback)\
    \ {\n                callback();\n              } // if\n            }\n     \
    \     );\n        }\n      );\n    } // otherwise, update\n    else {\n      transaction.executeSql(\n\
    \        \"UPDATE task SET name = ?, description = ?, due = ?, completed = ? +\n\
    \        \"WHERE rowid = ?;\",\n        [task.name, task.description, task.due,\
    \ task.completed, task.id],\n        function(tx) {\n          if (callback) {\n\
    \            callback();\n          } // if\n        }\n      );\n    } // if..else\n\
    \  });\n});\n```"
