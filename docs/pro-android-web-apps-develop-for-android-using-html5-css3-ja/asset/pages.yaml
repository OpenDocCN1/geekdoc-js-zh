    # Our Previous Web Authentication Flow


    Our final authentication process involved opening a new browser window, which
    is we let Geomer and Twitter work through the authentication process before passing
    control back to our main Moundz web application. This worked seamlessly in a browser
    environment, it doesn''t work as effectively when we have our web application
    wrapped in a native application. Why? That''s an excellent question—let''s take
    a look.


    In our application, our authentication flow went like this:


    +   1. The user clicks the "Sign with Twitter" button, a session ID is created
    within Moundz, and a new browser window is opened to the Geomer session initialization
    script.


    +   2. Geomer handles the "OAuth dance" with Twitter, at which point the user
    may be asked to validate that they are OK with allowing Geomer to log them in.


    +   3. Once the authentication process is completed, the new browser window is
    closed.'
