  md: '![](img/6c8091bf3a3d21ca91f25f8caed8840f_166_0.png)


    **Figure 7–9.** A rotating animation can be created simply by using various canvas
    transformation operations.


    Just quickly, we will walk through the code from this implementation of the animate
    function:


    +   1. The translate method is called shortly after the canvas is cleared, and
    we set the origin of the canvas to the center of the canvas.

    2. The rotate method is then called, passing the angle of rotation (in radians)
    that should be applied.

    3. Next, a canvas fillStyle is specified, and the fillRect method is called to
    draw a solid-red square at the center of the canvas.

    4. The value of the angle variable is then incremented for the next time the square
    is drawn.


    When working with transformations on the canvas, it is important to remember a
    few things:


    +   * The translate method shifts the origin of the canvas, which means that both
    of its subsequent transformation operations and any draw operations are now relative
    to the point you translated.

    * Calling context.save() prior to performing the transformation, and then using
    context.restore() after, will help to make using transformations manageable. Although
    not always appropriate, having the origin shift back to a constant point after
    transformation operations will make your draw code easier to manage and keep track
    of.'
