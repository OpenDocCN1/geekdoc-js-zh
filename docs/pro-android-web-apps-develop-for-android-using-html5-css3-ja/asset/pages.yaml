    to work at a native level to do this. Don''t worry, though—the process is quite
    simple and won''t involve writing any Java code.


    # An Overview of Android Intents


    Android intents are structured mechanisms for passing messages between applications
    on the Android platform. Essentially, each application runs in its sandbox and
    doesn''t have access to another application''s data—which is fair enough. To communicate
    with another application, an intent is sent to the Android OS itself, and if one
    or more applications are configured to respond to that intent, the OS provides
    them an opportunity to do so.


    While intents are a native application concept, they make a lot of sense from
    a web developer''s perspective, primarily because they respect the web URI scheme
    (http://en.wikipedia.org/wiki/URI_scheme) naming conventions. While we aren''t
    interested in how to use intents from the perspective of native application development,
    using intents can provide us with an almost seamless transition from a web page
    back into our native application. In our particular case, we are providing transition
    from the Twitter authentication process, back into the PhoneGap wrapper for Moundz.


    If you use an Android device, then you have probably experienced this—for example,
    if you were browsing a web page, and after clicking a link you were taken to one
    of the native Android apps, as if by magic. Both the Android Market and YouTube
    use intents in this way.


    So, let''s see how complicated it is to make Moundz respond to intents. The first
    thing we need to do is modify the MoundzManifest.xml file that resides in the
    root directory of the Android PhoneGap project. In this file, we will be adding
    an additional intent-filter to the application definition:


    ```

    <application android:icon="drawable/icon" android:label="app_name"

    ```'
