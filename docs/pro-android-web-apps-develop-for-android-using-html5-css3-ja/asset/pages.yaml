    # ## Implementing a User Login


    Up until now, nothing in the game has required any knowledge of the user, but
    we are getting to the point where the user will probably want to mine some resources
    to start building their base.


    Additionally, it''s unlikely we will want to allow a user to walk around with
    a limitless amount of resources, we are going to implement some limits. While
    the Geomer API will take care of most of the work for us, we are going to maintain
    a session key on the client, which we will include in any requests that need information
    on what the current user is.


    While the Geomer suite of tools could implement its own username and password
    management to meet this need, it''s definitely not the optimal solution. A much
    better solution is to integrate with an existing API that many users find themselves
    using a day-to-day basis. As previously shown in Figure 10–7, the Twitter API
    (http://dev.twitter.com) has been chosen to meet this need in version 1 of Geomer.


    In the future, additional authentication options will most likely be added, including
    other social networks such as Facebook and the geosocial networks that actually
    provide the'
