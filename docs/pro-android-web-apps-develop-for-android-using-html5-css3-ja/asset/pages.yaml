  md: "```\njQuery(\".achangeview\").each(function() {\n  jQuery(this).click(function(evt)\
    \ {\n    subModule.activate(this.href.replace(/^\\.#(.*)\\$/, \"$1\"));\n    evt.preventDefault();\n\
    \  }); // click\n});\n});\n\nreturn subModule;\n})()\n```\n\nIf you are not familiar\
    \ with the jQuery each method, it calls the supplied callback for each element\
    \ that matches the selector. At this stage, the callback will be fired twice (once\
    \ for each of the buttons in the list), and a click event will be attached to\
    \ the matching handler. For the handler click event calls the ViewManager.activate\
    \ method to change to that view. We additionally call preventDefault on the event\
    \ object to prevent the browser from attempting to navigate to the referenced\
    \ anchor name. This stops the screen from scrolling back to the top, which would\
    \ reveal the URL bar (which is not what we want).\n\n# Home Storage Requirements\n\
    \nFrom here we will write the code to read the task data back out of the local\
    \ database we created in the previous chapter. This is going to involve adding\
    \ some methods to our storage wrapper. Once we have created the required methods\
    \ for reading task data, we will add a method that will enable us to mark a task\
    \ as complete.\n\n> NOTE: Given some of the data typing experienced in the previous\
    \ chapter, we are going to have to implement things a little differently. Normally,\
    \ we would ask the SQL database to sort the tasks by their due date for us, as\
    \ we are actually dealing with strings, that isn't going to be possible. There\
    \ are ways you can use SQLite to do this, but it is quite complicated.\n\nFirst,\
    \ add a getTasks private function to the TODOListStorage module:\n\n```\nfunction\
    \ getTasks(callback, extraClauses) {\n  db.transaction(function(transaction) {\n\
    \    transaction.executeSql(\"SELECT row as id, * FROM task \" + (extraClauses\
    \ ? extraClauses : \"\"), [], function (transaction, results) {\n      // initialize\
    \ an array to hold the tasks\n      var rows = [];\n\n      // read each rows\
    \ from the db, and create task objects\n      for (var ii = 0; ii < results.rows.length;\
    \ ii++) {\n        tasks.push(new module.Task(results.rows.item(ii)));\n     \
    \ } // for\n\n      callback(tasks);\n  });\n```"
