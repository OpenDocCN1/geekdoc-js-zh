  md: '# jQuery Mobile


    While during our list of mobile frameworks, jQuery Mobile is one of the frameworks
    that has probably attracted the most attention. This is due in part to the popularity
    of the jQuery library, and in part to the amount of planning that has gone into
    the library.


    +   - Framework: jQuery Mobile

    - Style: Markup based

    - Web site: http://jqueryymobile.com

    - License: Open source (MIT or GPL)

    - Source code: https://github.com/jquery/jquery-mobile

    - Requirements:jQuery (1.4.4)


    The following are some of jQuery Mobile''s strengths:


    +   - A great deal of research into the state of mobile device browsers before
    any work commenced on the library. An excellent resource created as part of this
    research is the Mobile Graded Browser Support chart, available at http://jquerymobile.com/hbs.

    - There are sponsors and a very strong team behind this library.

    - jQuery Mobile is based on and well integrated with jQuery.

    - jQuery Mobile provides great documentation.

    - It''s likely to be considered a quality solution by tech-savvy clients when
    building mobile applications, given that it is an official jQuery Foundation product.
    Thus, there''s little need to justify its use when building a mobile web application.


    The following are some of its weaknesses:


    +   - At the time of writing, it''s still only in an alpha release.

    - For some, the tight integration with jQuery will be considered a weakness.


    > NOTE: While the Mobile Graded Browser Support data was primarily developed to
    assist the development of the jQuery Mobile library, this is an excellent resource
    when building mobile web applications in general. This chart is invaluable for
    making quick determinations of where particular mobile applications may or may
    not run. Theoretically, the code that we have worked on throughout the course
    of the book should work on any WebKit-powered device that is rated with A-class
    support.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Getting Started with jQuery Mobile


    At the time of writing, jQuery Mobile is in its 1.0 alpha 2 release. While there
    are likely to be changes between this version and the eventual release of 1.0,
    things should work more or less the same way. As, it''s probably best to download
    the latest stable release, which can be obtained from http://jquerymobile.com/download.


    While page include information on how to include jQuery from a CDN (content delivery
    network—see http://en.wikipedia.org/wiki/Content_delivery_network for more information),
    it is recommended that you download the ZIP file so wrapping the application with
    PhoneGap is still an option.


    > NOTE: A CDN offers an effective way for sites to optimize load times for scripts
    by making use of a distributed network of servers, this does prevent applications
    from being wrapped effectively for offline distribution. Carefully consider the
    type of application before using a CDN in mobile web application code.


    After you have downloaded the jQuery Mobile distribution, you should have a set
    of files similar to that in Figure 11–12.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_289_0.png)


    Figure 11–12. Currently, the jQuery Mobile distribution is very simple and light.'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'The distribution does not contain any samples, these can be viewed online.
    For the instance, the 1.0 alpha 2 demos are available at http://jquerymobile.com/demos/1.0az2.


    In addition to the jQuery Mobile library files, we will also need to obtain jQuery1.4.4,
    as this is a prerequisite for the jQuery Mobile framework. One of the simplest
    ways to get jQuery 1.4.4 is to download it from the CDN location, at `http://code.jquery/jquery-1.4.4.min.js`.


    Now that we have the files that we need, let''s copy them into our jQuery Mobile
    Mundz project. From the jQuery Mobile distribution, copy all the files into the
    Mundz directory, and copy the `jquery-1.4.4.min.js` file there also. After you
    have done this, the Mundz application directory should resemble Figure 11–13.


    ![](img/6c8091bf3a3d21ca91f25f8caed8840f_290_0.png)


    Figure 11–13. Mundz application folder structure after adding required jQuery
    Mobile files


