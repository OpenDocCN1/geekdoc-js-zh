  md: "# Notification Events\n\nThe example from the PhoneGap sample project that\
    \ we will work through involves how it exposes functions that allow you to make\
    \ the phone beep or vibrate. It's reasonably trivial, and the code to make it\
    \ work is nice and simple too. Let's take a look:\n\n```\nvar beep = function()\
    \ {\n  navigator.notification.beep(2);\n}\n\nvar vibrate = function() {\n  navigator.notification.vibrate(0);\n\
    }\n```\n\nHoray for simplicity! In the preceding code, PhoneGap attaches a notification\
    \ object to the global navigator object, and provides a number of methods. The\
    \ two that we are accessing here are beep and vibrate.\n\nThe beep method takes\
    \ a single parameter that specifies the number of times that we would like the\
    \ phone to beep. The vibrate method also takes a single parameter; however, in\
    \ this instance we are specifying the length of time (in milliseconds) that we\
    \ would like the phone to vibrate for. While this example is quite trivial, we\
    \ should not discount the usefulness of being able to perform these operations\
    \ using the device. When coupled with the ability to track a user's position and\
    \ run applications in the background, there are pretty useful things that we can\
    \ implement in our applications—especially if we happen to be writing a geosocial\
    \ game. We will start to look at our game in the next chapter.\n\n# A Simple PhoneGap\
    \ Mapping App\n\nIn the last chapter, we worked through a number of examples involving\
    \ mapping. Let's now look at how we take our final sample from the chapter and\
    \ embed in a PhoneGap native wrapper.\n\nAs we already have a sample project that\
    \ has been configured to build correctly, let's copy that directory and create\
    \ a new project called MapTest.\n\n# Tweaking the Sample PhoneGap Project\n\n\
    While the sample project provides us all the basic building blocks that we need\
    \ to build our application, there are some things we need to do if we want to\
    \ actually build a production application.\n\nIdeally, this would involve all\
    \ references to \"Sample\" being replaced with something more meaningful. This\
    \ is actually a little trickier than you might expect, but if you have worked\
    \ with native Android applications in the past, you should be comfortable with\
    \ the process. If you haven't, don't worry—we'll walk you through what is required\
    \ step by step."
