    \ canvas.height * 0.5);\n\n      // rotate the canvas around the origin (canvas\
    \ center)\n      context.rotate(angle);\n\n      // draw a rectangle at the specified\
    \ position\n      context.fillStyle = \"#FF0000\";\n      context.fillRect(-30,\
    \ -30, 60, 60);\n\n      // increment the angle\n      angle += 0.05 * Math.PI;\n\
