  md: '# Chapter 7 Formatting Style Sheets Under JQuery


    In normal jQuery programming, you are unlikely to need this feature very often,
    if ever.


    The formatting with style sheets under jQuery does not mean that you should not
    convention-ally integrate style attributes, internal style containers, or—which
    is usually recommended—references to external CSS files into the HTML site when
    using jQuery. On the contrary, you are always going to do so. This chapter, however,
    focuses on dynamically accessing CSS formatting from within JavaScript (in other
    words, in combination with a certain programming logic).


    With pure HTML, you can access CSS properties easily via the style object, but
    if you choose this approach you will have to deal with the problems described
    earlier. Plus you have to deal with the fact that the properties for the style
    object differ from the notation of CSS properties regarding the use of uppercase
    and lowercase spelling and usage of the dash. These are only small difficulties,
    but it adds up.


    By using jQuery, you can normalize the properties, and they are then available
    in identical form on all supported browsers (including the opacity). I believe
    this constitutes the main benefit. The CSS methods in jQuery allow easy access
    to style sheets and integrate the access into the general framework philosophy
    (including the option of chaining).


    > Note

    The jQuery methods are, of course, based directly on the classic applications
    of CSS or the style object.


    # 7.1 The css() Method


    The most fundamental, most general, and probably most important method for accessing
    style sheets in jQuery is css().


    # 7.1.1 Getting Style Properties


    Via the method css(), you can easily get the value of a CSS property. You simply
    specify the property as a string parameter. For example, you can get the specific
    value of a single property like this.


    Listing 7.1 Getting the Background Color


    ```

    var color = $(this).css("background-color");

    ```


    For the names of the CSS properties, you can also use the notations offered by
    the style object. The framework is easy going here and simply accepts both notations;
    for example, you could write backgroundColor. (Note that the words must be written
    together and that the second word starts with a capital letter; this is required.)


    We have already used it a few times.'
