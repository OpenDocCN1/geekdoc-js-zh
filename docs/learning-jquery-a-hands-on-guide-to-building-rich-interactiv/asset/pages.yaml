  md: '# 3.1 The Web, Web 2.0, and the Client/Server Principle on the Internet


    For start with, let''s take a brief look around the WWW. At its core, the Web
    is based on the service protocol Hypertext Transfer Protocol (HTTP) for communication,
    the document description language HTML, and its strict XML-based twin XHTML plus
    the programs web server and browser.


    Just like all services available on the Internet, the Web is a classic client/server
    system, where more specifically, this means that on the Web it is practically
    a situation of a browser (the client) requesting a file (usually a web page or
    content that is to be integrated into a web page) and in some cases sending further
    requests for external resources referenced within this site (for example, graphics,
    videos, flash animations, or external JavaScript or CSS files). These are displayed
    in the browser with the web page or are otherwise processed. The central control
    mechanism is always the (X)HTML file.


    # 3.1.1 Programming on the Web


    Over the years, the Web has evolved into a system where you can both on the server
    and on the client in terms of offering content. The hysteria about the dangers
    of client-side programming seems to have calmed in recent years, and nearly all
    modern websites use client-side programming for that part of the business logic
    that should sensibly be taken care of in the client. After all these years, the
    only relevant representative of the client-side field that is still around is
    JavaScript, but by now it is used and accepted widely. Just take a look at some
    popular websites on the Internet. Not one of these sites can manage without JavaScript.
    Almost all users on the Web have JavaScript enabled in their browser. After all,
    who would without the full and unlimited use of popular websites such as Google,
    Amazon, eBay, Facebook, Twitter, Wikipedia, or Yahoo! As a creator of websites,
    you can, in turn, assume that most clients have JavaScript plus its associated
    techniques.¹1 This means many arguments against using JavaScript frameworks such
    as jQuery or Dojo Toolkit, Prototype, YUI, and some are no longer valid.


    > As mentioned earlier in this book, various manufacturers are trying to establish
    proprietary techniques as Silverlight in the client system to break through the
    limitations of JavaScript and web browsers as clients. But it will take some time
    before these are supported and accepted on a wide scale. It is unclear at what
    point, whether these proprietary efforts will succeed.


    +   1. According to the statistics I consulted, the support for JavaScript fluctuating
    massively. Some statistics assume 99.9% availability, others perceive "only" 99.1%
    availability. I hope you are aware of the irony in my statement to spell it out,
    you can currently assume that there is almost unlimited availability.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# 3.2 JavaScript and Its Relationship to jQuery


    # 3.1.2 The Web 2.0


    As ingenious and fundamentally simple as the concept of the Web is, there is a
    basic and serious problem with HTTP, HTML, and the concept of classic web browsers.
    When the browser requests data from a web server, the latter always has to send
    a complete web page in response. Or to be more precise, the browser interprets
    the response in such a way that it replaces the site previously displayed in the
    browser with this new content. Obviously, this is very inefficient. This is where
    AJAX enters the stage. (You will read more about its technical background shortly.)


    Generally, this is a procedure that ensures a reaction from a (almost) real time,
    although new data is being requested from the web server. Instead of requesting
    a complete web page with data that is in principle already present in the browser,
    an AJAX data request will result in only the newly data being sent by the web
    server and then using HTML methods to "build it in" the web page that is already
    loaded in the client. This does not usually interrupt the normal user interaction
    with the web application by loading new data. Therefore, you can now create sites
    on the web that are much more focused on interaction with the user. Thanks to
    Google, in particular, AJAX has become established as standard procedure for interactive
