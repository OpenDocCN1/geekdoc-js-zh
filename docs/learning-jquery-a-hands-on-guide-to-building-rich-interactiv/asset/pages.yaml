  md: '# 7.2.1 Adding Classes: addClass()


    As the name of the method addClass() indicates, calling this method assigns one
    or several style classes to the previously specified elements. This happens dynamically,
    but without the web page being reloaded or updated in any form. The CSS class
    must, of course, be available in some form in the web page.


    > > Tip Via this method and the other methods for accessing CSS classes, you can
    ensure the separation of layout and functionality. The layout is prepared in the
    classical way in a CSS file via the static specification of classes and only the
    specific assignment (the logic) is implemented in JavaScript.


    # Direct Specification of Classname


    The class to be assigned can be specified directly as parameter.


    ```

    Listing 7.7 Adding a CSS Class

    $("e").addClass("myClass1");

    ```


    Several classes in the string are separated by spaces.


    ```

    Listing 7.8 Adding Three CSS Classes

    $("e").addClass("myClass1 myClass2 myClass3");

    ```


    # Using a Callback Function


    As of jQuery 1.4, you can also write a callback function as parameter for all
    methods that manipulate classes. This should (or better, must) return one or several
    classnames, separated by spaces, that are assigned to the elements in the previously
    specified jQuery object.


    ```

    Listing 7.9 Specifying a Callback Function That Is Intended to Return One or Several
    Classes

    $("div").addClass(function(){});

    ```


    The callback function has two optional standard parameters. The first optional
    parameter represents the index position of the currently accessed element in a
    set of previously specified elements. When the different elements are passed through
    while the method is processing, you can decide based on the index you want to
    do with each specific element (for example, return an individual class, as we
    will do in our next example).


    4. If it is to be useful.'
