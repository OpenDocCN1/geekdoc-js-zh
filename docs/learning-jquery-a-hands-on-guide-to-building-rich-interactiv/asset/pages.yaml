    # 10.2.5 Avoiding Caching


    With AJAX requests, a fundamental problem exists with regard to caching in a GET
    request. Unfortunately, it happens quite often that data is not re-requested by
    the server in an AJAX request, even though this would be necessary. The browser
    simply fetches the data from the local cache.¹17 This concerns above all Internet
    Explorer. In manual programming, it is therefore a good idea to use the workaround
    of the query string a random value or time stamp if generated via JavaScript and
    basically not used further, on the server not on the client. It is just intended
    to send to the browser that the data has been reloaded. In fact, this trick is
    currently the only yet reliable way of preventing this caching behavior (a behavior
    that is used well in traditional web data requests). Those frameworks that offer
    an explicit mechanism for this (such as UI) do nothing in the background. In jQuery,
    you currently have to create an extra parameter manually in this situation for
    most methods and append this parameter to the URL. The ajax() method offers a
    corresponding option for preventing caching via a special parameter.


