    # 3.4 DOM and Objects


    The previous examples with JavaScript have already confronted you with objects.
    JavaScript is partly an object-oriented language. Strictly speaking, it is referred
    to as object base because certain qualities that are required for a true object-oriented
    language are absent.


    The term object in programming refers to a software model that is intended to
    describe an object from the real world with all its properties and behaviors.
    For example, a printer, a monitor, or the keyboard is an object. Parts of the
    software itself can also be an object: the browser, or a part of it—such as a
    frame, the status line in the browser or the browser window, or just part of a
    document—a heading in a web page, a paragraph, a graphic, and so on. The object-oriented
    approach sees everything as an object that can be independently grasped, described,
    and addressed.


    Object-oriented programming can be defined by the fact that related statements
    and data form a related, self-contained, and independent unit (an object) that
    provides properties and methods (abilities) and can have a certain state. Properties
    and methods form what is referred to as members of an object.'
