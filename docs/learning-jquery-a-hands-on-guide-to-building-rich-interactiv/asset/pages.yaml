    # 13.4 Linking Mobile Pages


    Fundamentally, the Mobile framework supports all standard link types of HTML.
    When linking pages, you need distinguish in the framework between external and
    internal links, which result from the different interpretation of what constitutes
    a page.


    # 13.4.1 External Links via Hijaj


    In the default setting, jQuery Mobile works with AJAX (Hijaj) in case of links
    to external pages, as long as the reference is to the same domain. In contrast
    to a desktop application, the cursor in mobile apps is changed so that you can
    see when files are loaded later (the rotating timer or spinner). If the request
    was successful, the new data is integrated into the Document Object Model (DOM),
    and the mobile widgets are reinitialized. Then the new page is displayed in animation.


