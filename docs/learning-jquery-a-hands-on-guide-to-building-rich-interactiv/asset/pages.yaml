  md: '# 12


    # Plug-Ins


    The entire jQuery framework consists of the jQuery core and the jQuery UI. Essentially,
    however, the framework can be expanded as much as you like. The expansions are
    referred to as plug-ins. they are pure JavaScript and Cascading Style Sheets (CSS)
    libraries, but they have to conform to certain predefined rules. By now, there
    is a huge number of plug-ins, which are often available for free (and sometimes
    commercial) use via the jQuery website. Basically, any jQuery developer can publish
    plug-ins there. And you, as a website designer or user of the jQuery framework,
    can use these plug-ins if they offer a functionality that you do not want to create
    yourself and that the native framework does not offer. In this chapter, we take
    a closer look at these plug-ins and demonstrate how you can both use foreign plug-ins
    and write and publish your own plug-ins.


    # 12.1 The jQuery Plug-In Page


    To get a better idea what the topic is all about, you should look at some plug-ins
    on the Web. At http://plugins.jquery.com/, you will find the official jQuery plug-in
    page. You can also get there from the normal jQuery website via the Plugins link
    at the very top of the page. You will find the published plug-ins by numerous
    programmers in various categories. And, of course, search functions enable you
    to search for a specific plug-in.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# 394 Chapter 12 Plug-Ins


    ![](img/739ab7ef0a667848dd801c2d368bbc59_411_0.png)


    # 12.1.1 Searching For and Using an Existing Plug-In


    Let''s say you want to use a plug-in that is presumably available with this jQuery
    plug-ins. Suppose that you are looking for a navigation menu with a tree structure.
    Currently, neither the jQuery UI nor jQuery offers anything like this. You are
    probably aware that such an interactive navigation tree should belong in the Navigation
    category.¹ If you search the plugins listed here, you will sooner or later find
    a suitable plug-in. Or you can search directly via the corresponding input field
    in the web page.


    For example, you might decide to enter the search term *Treeview*. From the list
    of hits, then select the most promising plug-in by clicking the corresponding
    hyperlink.


    The next web page describes everything you need for using the plug-in—provided
    the programmer has made such a useful documentation available; starting with a
    description of the download, the dependencies, potential license conditions, right
    up to the required version of jQuery or the jQuery UI. You will usually also find
    a preview with a demo for this plug-in (Try Out a Demonstration), at least if
    the programmer of the plug-in has made such a page available. The documentation
    of the plug-in is integrated fully into the usual jQuery documentation, so it
    includes a description in an overview, lists the available options, and so on.


    +   1. Strictly speaking, the programmer of a plug-in has to sort it logically
    into the appropriate category. Otherwise, only a few users will be able to find
    the plug-in.

    2. Search terms should generally be in English.'
