    # 5.3.3 Visibility Filters


    Table 5.5 Visibility Filters


    | Name | Type |

    | --- | --- |

    | :hidden | Selects all hidden elements in a web page. At first glance, this is
    a rather simple description, but you want to watch out for some finer points.
    Elements can be hidden within a web page for various reasons:

    * The CSS property display can have the value none.

    * There are hidden form fields (type="hidden").

    * The width and height are set to the value 0.

    * An ancestor element can be hidden, and then all children contained in it are
    also not displayed. |


    Plus there is the CSS property visibility: hidden and setting the transparency
    via opacity: 0. Watch out, these are not counted as hidden in jQuery, contrary
    to what you might expect, because they still take up the same space in the web
    page as they do in the visible state. An element only counts as hidden in the
    sense of this filter or jQuery if it does not take up any space in the web page.^11


    Then you also need to take into account how elements can be classed if they are
    hidden via an animation. They are considered visible so long as the end of the
    animation has not yet reached. Vice versa, in case of an animation for showing
    a hidden element: The element counts as visible or no longer hidden immediately
    after the animation starts.


    :visible All visible elements in exactly the opposite sense of the explanation
    for hidden.


    Let''s take a look at an example (ch5_17.html).


    11. In jQuery versions prior to 1.3.2, it was handled differently.'
