    | queue | A Boolean value with a default value true. This specification has an
    effect if animations are to be added to a queue of animations. If the value is
    set to false, the animation skips the queue and starts immediately. This is the
    same as if you were to set several window.setTimeout() calls simultaneously. |

    | specialEasing | An object of type Map with CSS properties and assigned easing
