    jquery(), the framework also offers various filter methods. The fundamental difference
    with filters/selectors is in the way they are applied. These are methods, and
    they are called via dot notation and the preceding object, not passed to jquery()
    as parameters in the selector. Otherwise, the effect of the filter methods usually
    derives clearly from the filters listed here. So, we do not provide examples for
    the majority of these methods.


