    The other animation methods, the animate() method is based on the fact that style
    sheets can be changed in a time-controlled way. In particular, you need to specify
    a target value for a specific style property. You also do so, for example, with
    the fadeTo() method. By calling the animate(), the whole process is much more
    flexible because basically you can change any style properties in this way. You
    specify this style property in the form of an object as a first parameter, where
    each key in the object represents a property that you want to animate (for, height,
    left, or opacity).


    The value assigned to a property represents the relation to which the property
    is changed animated, setting out from a certain state. In case of a numeric value,
    the animation adjusts the value using the easing function. If the value for a
    property is specified via a string as "hide", "show", or "toggle", jQuery automatically
    constructs a default animation for reaching this target state of the property.
    However, remember that all supported properties have to be represented in one
    form or another by numeric values. Properties such as backgroundColor(or also
    foreground colors) are not represented in a numeric form and are therefore not
    supported in the current version of jQuery.


    As of jQuery 1.2, however, you can work with some properties (for example, the
    unit em for sizes or). You can also work with relative animations from that version
    of jQuery onward. You have to precede a value using the JavaScript tokens += or
    -= to change it relative to its current value in positive or negative direction.


    jQuery 1.3 has new features, as if you specify a time period for an animation,
    the animation will synchronously set the elements concerned to their final state.


