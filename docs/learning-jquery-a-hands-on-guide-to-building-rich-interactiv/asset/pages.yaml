    In addition to the tweets themselves, we also want to discuss and display some
    information about the author of the tweets in the web page. Each tweet contains
    this information in the form of an array with the name user. So, the information
    is redundant, this data does not change. But a user can also update his profile.
    For example, he can upload his picture or replace it. The sequential structure
    of the JSON tweets ensures that the most recent messages appear at the top of
    the JSON structure. And if you iterate over the tweets with a loop, the first
    tweet contains the most-to-date information on the author. We make use of this
    fact in our program.


    We are working with different variables for the author data that interests us.
    This includes the name of the author, his screen name (alias), his ID, and his
    picture. In lines 10-28, we look for search the tweet (data[0]) because this contains
    the most recent data on the author. But our universal approach makes us to search
    order tweets, as well, if required and process any changes of the author data
    (which we are not doing in our example). But the chronological structure poses
    a problem: We have to be careful not to overwrite the most recent information
    with the older information while iterating over all tweets. So, we check whether
    the value of a variable we are interested in is already filled, only if it is
    not yet filled, we assign the specific value of the property from the object user.


