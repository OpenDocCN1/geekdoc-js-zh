    # 6.3 Content of Form Fields: val()


    In practice, accessing forms is still one of the most important applications of
    JavaScript. And, of course, jQuery also offers support here, too. With html()
    and text(), you can get or set the content of nodes that make values available
    via innerHTML and innerText. But this is explicitly not the case with form fields.
    And in jQuery, too, you have to use a separate method for getting the content
    of form fields: val(). Passing an argument into val() will set the value of the
    field. If you do not pass an argument into val(), then the value of the field
    is returned.


    +   List 6.3 Accessing Form Fields (ch6_2.html)


