    # 6.15 A More Comprehensive Example at the End: A Date Component


    To conclude this chapter, we create a more elaborate example and practice using
    selectors and methods for iterating over manipulating elements in a more complex
    context. First we need to skip ahead a little and use CSS techniques that are
    only discussed in detail in the next chapter. But these should not cause any serious
    problems here, and we have already worked through the other techniques involved.


    More precisely, we create an automatic date component. That is not necessarily
    a new feature on the Web$^{21}$ but it''s good to practice techniques on a very
    useful application that can be applied in many other situations in this form.


    We want to complete the following tasks when creating the component:


    +   - Determine and display the current month automatically.

    - Depending on the current date, the calendar should start with the appropriate
    date of the week or highlight the first day of each month.

    - Format the days of the current month differently than the days of the previous
    and next month, if these need to be displayed to fill up space in the calendar.

    - Apply special formatting for Sundays.

    - Highlight the current day.

    - Use a zebra stripe pattern for the various calendar lines.


    21. There may already be one or two solutions around (even in the jQuery UI).'
