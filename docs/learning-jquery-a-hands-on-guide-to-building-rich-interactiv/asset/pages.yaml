  md: '# Note


    An AJAX request requires almost always that you are working with a web server.
    After all, you want to request data from a web server and integrate it into the
    existing website. To do this, you are reloading the data via HTTP. For a test,
    you also have to load both the web page and the requested data via a²¹ web server.
    Simply opening the web page from the file-sm system is not necessarily possible.
    So as soon as you have launched your local web server, it is usually available
    via the URL localhost. Otherwise, you simply enter in the address line IP number
    or name of the computer where the web server is running. If you execute the page
    as JavaScript Web Application with an IDE such as Aptana, the page is always requested
    via the web server.


    # 10.3.2 Sending Data to the Web Server via $.get() and $.post()


    Let''s now look how data is sent to the web server during an AJAX request. This
    will mainly be user input, either data that the user enters in a web form or data
    based on actions that the user carries out with the mouse.²² you will see that
    significantly simplifies and standardizes the sending objects of the type Map.


    # Tip


    In the default setting, AJAX requests are sent via GET. If you using POST, the
    sent data is encoded with UTF-8. If you want to send a query string, the data
    is converted to a suitable form with the method . If you do not want this to happen,
    you can set the parameterData to false. That can make sense if you want to send
    an XML object to the server. In that case, you should change the contentType option
    of application/x-www-form-urlencoded to a more suitable MIME type.


    # Note


    The data that is sent from the client to the web server also has to be processed
    there. Then it no longer makes sense for you to specify a pure type file on the
    server as a URL. You need to call a script or program on the server that receives
    and processes the data. This script or program can then, of course, generate pure
    plain text in the client, or a response with any structure. It does not matter.
    We are not going to go into more detail with the server side here (as is explicitly
    not our topic), but instead look at a script that represents a black box for us
    that sends data. On the companion website, you will find the PHP files used in
    the example: ch10_3_get.php and ch10_3_post.php.


    +   21. Strictly speaking, the same web server as the web page itself (keyword
    sandbox principle).

    22. Mouse actions form the basis for one of the most widely known AJAX applications:
    Google Maps. Here, dragging a map or scrolling the mouse wheel is sent to the
    Google web servers in the back-ground, and based on this data, the user receives
    new images that show a different map section.'
