    Time-controlled showing and hiding of elements on a web page are elementary animation
    techniques. With jQuery, you can do so easily.


    The show() method, without a parameter, shows all matching elements directly if
    they are hidden. If they are already visible, calling the method changes nothing.
    Alternatively, you can also use the method with parameters, just as with all methods
    in this category. In this case, you specify as the first parameter the speed with
