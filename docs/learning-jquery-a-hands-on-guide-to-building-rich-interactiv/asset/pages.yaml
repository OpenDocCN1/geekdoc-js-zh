  md: '# Accessing the Elements of a Web Page


    jQuery offers numerous methods for accessing the web page or manipulating its
    content/structure. Manipulating in the context of this chapter means inserting
    nodes into the site or removing them or changing the content or structure of a
    node. In addition, you can traverse a web page to find specific nodes and contents
    quite well in jQuery with various methods. This long in part somewhat theoretical
    but immensely important foundation chapter introduces these techniques, which
    are strongly based on the already discussed navigation on trees plus filters and
    selectors. After all, accessing the elements of the web page is the basis of all
    dynamic effects that you want to program in the web page, be it animations, dynamically
    changing content, or processing user input.


    # 6.1 General Info on Checking, Changing, Adding, and Removing Nodes


    As already mentioned in various places, the Document Object Model (DOM) concept
    interprets a web page as a tree with nodes and axes that differ from a single
    root. Depending on the type of node, the DOM concept offers different methods
    and above all properties for inserting nodes into the tree or removing them from
    the tree, or for changing nodes (especially their content). However, these access
    techniques are sometimes not quite straightforward and are potentially unreliable
    in certain browsers. jQuery makes these processes more abstract or normal ensures
    that they are available across all browsers in the helpful and secure way.


    > Caution\If you access elements in the web page via a jQuery object,the normal
    DOM properties and methods are not directly available. You can use get() to get
    the native DOM node, but then you are explicitly foregoing the advantages offered
    by the jQuery namespace with its homogenous syntax and its protection against
    browser errors.


    +   1. In other words, via the namespace jQuery.'
  merge: -1
  pgno: 148
- img_proc: true
  md: "# 6.2 Checking and Changing Node Contents: html() and text()\n\nLet's start\
    \ with two of the most important methods for accessing the web page. Accessing\
    \ the contents of a node, course, comes under the changing of a node, because\
    \ in the DOM concept contents (texts) are also independent nodes. They are nodes,\
    \ as you can see quite well in the DOM Inspector. With the method html(), you\
    \ can check the content of a text node that is available in the classic DOM access\
    \ via innerHTML. The method returns the content of the first matched element.\n\
    \n> Note\nTo clarify, we are also talking about the text-based content of elements\
    \ (for example, headings of div areas) because we usually perceive as content\
    \ of such container elements is a subordinate, independent node in the DOM (in\
    \ other words, a text node). The text that you see in a heading or a div area\
    \ has been retrieved via this subordinate node. That is exactly what html() (or\
    \ in the DOM concept HTML) does, via an encapsulated access. But if you operate\
    \ directly on a node object, you first need to select the text node (for example,\
    \ viafirstChild, and then a property for such the data).\n\nThe method text()\
    \ works in the same way (or more precisely, almost in the same way). Unlike html(),\
    \ the returned content is not interpreted. In other words, the contained HTML\
    \ tags are not returned. This corresponds to innerText in the class DOM programming.\n\
    \nIf you specify a string parameter for both methods, the content is transferred\
    \ to all² matched text nodes. So, it is an assignment of the relevant property\
    \ or properties, with the usual effects of the corresponding DOM property. For\
    \ html(), the passed content is interpreted in the web page. This HTML tags are\
    \ processed. For text(), however, the pointed brackets are masked internally,\
    \ and so the tags are displayed in the web page.\n\nLet's look at the two methods\
    \ in an example, in which we both get and set content (ch6_1.html).\n\n# 6.1 Getting\
    \ and Setting Content of Text Nodes\n\n```\n...\n<script type=\"text/javascript\"\
    >\n  src=\"lib/jquery-1.8.2.min.js\"></script>\n<script type=\"text/javascript\"\
    >\n  src=\"lib/ch6_1_ready.js\"></script>\n</head>\n<body>\n  <h1>html() and text()</h1>\n\
    ```\n\n2. Note conveniently you can assign the same content to various nodes.\
    \ Instead of having to painstakingly use a loop, you can do it in one statement\
    \ by cleverly using the right selectors."
  merge: -1
  pgno: 149
