    # 13.10 Form Elements


    Essential interaction components in a graphical user interface (GUI) are based
    on form elements. The framework jQuery Mobile offers all common form elements
    in optimized control for the mobile devices. In particular, it is explicitly geared
    toward finger control. But basically, all form elements are based on the usual
    native HTML form elements that the framework initializes and adapts in the background.


    > Tip

    If you do not want the framework to adapt a form element, set the attribute for
    this element to data-role="none".'
