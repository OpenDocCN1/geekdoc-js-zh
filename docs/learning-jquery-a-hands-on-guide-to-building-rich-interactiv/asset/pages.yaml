  md: "# 13.9 Lists\n\nFigure 13.12 Tapping/clicking the screen toggles the visibility\
    \ of the header.\n\nLists enable clear presentation of data, which is all the\
    \ more important for the small screens in the mobile environment. The navigation\
    \ can also be designed with lists. The framework offers a large number of default\
    \ lists that can be formatted in many ways. The framework supports nested lists,\
    \ numbered lists, noninteractive (read-only) lists, lists with icons, indented\
    \ lists, and several other variations.\n\nEssentially, you only need to use the\
    \ usual HTML tags to build a list and add the attribute data-role=\"listview\"\
    \ to the parent element. The framework automatically adds required styles and\
    \ the support for events. Entirely in the background, it organizes (when necessary)\
    \ AJAX requests for new content and integrates it into the Document Object Model\
    \ (DOM) and so a basic list could look like Listing 13.19.\n\n# 13.19 A List\n\
    \n```\n<ul data-role=\"listview\" data-theme=\"g\">\n  <li><a href=\"http://rjs.de\"\
    >Home</a></a></li>\n  <li><a href=\"http://blog.rjs.de\">Blog</a></a></li>\n \
    \ <li><a href=\"http://www.ajax-net.de\">AJAX-Net.de</a></a></li>\n  <li><a href=\"\
    http://safety-first-rock.de\"></a></li>\n  jQuery Examples</a></li>\n</ul>\n```\n\
    \nLet's expand our mobile reference app again. We add a third page and use another\
    \ plug-in on this third page, the plug-in rjsTwitter that you will find on the\
