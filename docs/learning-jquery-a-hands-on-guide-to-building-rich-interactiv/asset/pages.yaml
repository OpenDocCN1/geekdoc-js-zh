    # 7.3 Positioning Methods


    One of the biggest problems when designing and dynamically changing a web page
    is the positioning of elements. Via CSS, you can control the positioning of elements
    in a web page quite well with the properties position in combination with left
    and top.9


    > Note The specifications right and bottom are still not supported by various
    browsers. It is best to avoid working with them.


    The positioning data is based on the offset of an element. The null point of the
    coordinate system is placed into the top-left corner of the offset element. The
    jQuery positioning methods use these properties and coordinates as reference point.


    > Note Although we are assuming basic knowledge of CSS in this book, the explanations
    on positioning, text flow, and the significance of offset will go into a more
    detail than would be necessary for the pure—rather primitive—application of most
    jQuery methods in this area. My experience in training seminars, knowledge on
    these matters is in many cases quite rudimentary, despite otherwise good experience
    in CSS.


    +   9. Note that elements absolutely positioned via CSS are taken out of the “normal”
    text flow or element flow of the site. For example, if there are three headings
    written down subsequently in HTML and the second heading is positioned absolutely
    via CSS, the normal flow of the site shows the third heading as directly following
    the first heading. But this should be already familiar to you from CSS.'
