    # 12.2 Creating Custom Plug-Ins


    Let''s move on to how you can create your own custom plug-ins. But first you need
    to understand why you might want to do this in the first phase.


    # 12.2.1 Why Create Custom Plug-Ins?


    If you require certain functionalities more often, you will usually create a function.
    In certain circumstances, you would also create classes or objects, provided this
    is possible within a technology such as JavaScript. The same idea also lies behind
    plug-ins:


    > Reusability of existing functionalities plus universal application to the widest
    possible extent


    As you have seen with the foreign plug-ins, highly complex functionalities can
    be made available in such a way that you can use them easily and simply. Creating
    plug-ins has much to do with with the idea of object-oriented programming or modularization,
    where inner structures are encapsulated and made available via a call that is
