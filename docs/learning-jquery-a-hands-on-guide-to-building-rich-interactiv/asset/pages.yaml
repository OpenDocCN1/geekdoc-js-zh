    must not be divided up into several.


    # 1.3 Who Is the Target Audience for This Book?


    It is always tricky to anticipate who may be interested in a particular topic.
    But I have certain ideas and now quite a lot of experience from jQuery seminars
    about who would be interested in finding out more RIAs in the context of jQuery,
    their potential rewards, and the most likely readership of this book. If you have
    already created websites and have already been programming in one form or other,
    JavaScript would be a great basis, but other programming techniques are just as
    welcome, although your learning curve will be slightly sleier as you go along.
    Style sheets should also be a familiar concept to you. If you do not have any
    experience with creating websites or working with HTML or programming, this will
    probably pose a challenge for you (but this should not discourage you from reading
    it). I also assume that you are tired of the limitations of a static HTML site.
    Perhaps you would probably like to find an easy way to create such interactive
    modern sites. jQuery is a fantastic method for achieving this.


    More and more programmers of powerful techniques and environments such as Java
    or .NET are pressing into the area of web programming. Correspondingly, I want
    to also address readers with this type of background knowledge. For programmers
    who switch over from such power-full and strict worlds, it is often hard to find
    their way in the seemingly trivial (but, in fact, rather distinctive) world of
    web programming.


    # 1.4 What Do You Need?


    Let''s turn to the requirements you should meet for working with this book and
    jQuery.


    # 1.4.1 Hardware and Operating System


    We are dealing with the Internet. So, of course, you need to have a computer with
    Internet access. No special requirements apply as far as the computer itself is
    concerned, but your hard-ware should be at least reasonable quality. The requirements
    of modern operating systems already determine the minimum level of the required
    hardware. All graphic operating systems such as Linux, Windows, or OS X will work
    fine as long as they are relatively up-to-date. The'
