    jQuery UI is the beautiful swan. Purely in terms of visual appearance, the jQuery
    UI offers more than jQuery itself, even though using it is easier—as long as you
    understand jQuery. jQuery is the basis that makes life easier source code programming,
    and the jQuery UI builds it on an independent framework with visually advanced
    interface components and a CSS framework. Of course, we also take a closer look
    at the jQuery UI in this book and work through many examples with the various
    widgets it offers. In addition, you will learn in detail how to use options, events,
    methods, and then to adapt it for them. The framework and the ThemeRoller of the
    jQuery UI are also covered in detail.


    Then there are also plug-ins in jQuery, as extensions of the framework. You will
    learn how to use foreign plug-ins in case you cannot find a certain function in
    the jQuery and the jQuery UI core libraries, and you will learn how to create
    and publish your own plug-ins.


    Last but not least, this book describes how you can create mobile apps based on
    jQuery. This involves using the mobile framework that is directly based on native
    jQuery (just as the jQuery UI is).


    > Note

    To make things clearer, we often work with code examples in this book. You should
    type in the complete code examples yourself (and, of course, you can then also
    modify and experiment with them if you like). However, you will also find the
    listings on the companion website for this book.


    # 1.2 Writing Conventions


    This book uses various writing conventions intended to help you keep track of
    things more easily. Important terms are **emphasized in bold**. Sometimes others
    are in *italics*. Above all, you are meant to be able to see if it is normal text
    or program code. Keyboard shortcuts and other special things are also highlighted.
    This formatting is used consistently throughout this book.'
