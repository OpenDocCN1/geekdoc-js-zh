    # 10.10.5 Extended Techniques for $.ajax()


    In jQuery 1.5, three interesting extended functions for $.ajax() were introduced
    (mentioned

    briefly earlier and discussed in more detail here).


    # Prefilters


    The term prefilter refers to a callback function that is executed before any AJAX
    request is sent

    and before any option is handled by $.ajax().


    It usually looks something like Listing 10.39.


    Listing 10.39 The Prefilter Callback Function


    ```

    $.ajaxPrefilter(

    function( requestOptions, originalOptions, jqXHR ) {

    /* Modify options, control the original options, store jqXHR object etc */

    });

    ```


    # Converters


    Converters also refer to a new kind of callback function. A converter is called
    when the server

    sends response data in another data type than is expected. You can then take corresponding

    countermeasures within the callback function; either convert a data type or introduce
    your own

    data types. Converters are stored in the ajaxSettings and can be added globally,
    as shown in

    Listing 10.40.'
