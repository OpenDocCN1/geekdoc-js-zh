  md: '# 13.7.1 Buttons with Icons


    You can easily add graphical symbols to the buttons. The jQuery Mobile framework
    offers a set of frequently used icons for mobile apps. These are optimized in
    terms of minimal size and maximum contrast. You just add the data-icon attribute
    to a button.


    # 13.10 A Button with Icon


    ```

    <a href="index.html" data-role="button" data-icon="delete">Delete</a>

    ```


    The following icons are currently available.


    | Table 13.1 Icons for Buttons |

    | Icon | Description |

    |---|---|

    | arrow-l, arrow-r, arrow-u, arrow-d | Arrows pointing left, right, up, and down
    |

    | delete | Delete |

    | plus, minus | Plus and minus icon |

    | check | Checkmark |

    | gear | Gear icon |

    | refresh | Refresh |

    | forward, back | Forward and back |

    | grid | Hash |

    | star | Star |

    | alert | Alert icon |

    | info | Info icon i |

    | home | Home |

    | search | Search magnifying glass |


    > You can even define your own custom icons and use them in the framework. You
    need a unique name as an attribute value, and then the framework generates a new
    CSS class from it that starts with ui-icon-. This is assigned to the button. Then
    you modify this class body in such a way that it points to an individual image.
    As the format, you should use 18 x 18 pixels in the PNG-8 format (with alpha transparency).'
