  md: '# 13

    jQuery Mobile


    Web technologies on mobile devices are now totally ready to face the competition,
    not least thanks to Hypertext Markup Language 5 (HTML5), but also due to Cascading
    Style Sheets 3 (CSS3), particularly in combination with JavaScript and a powerful
    framework. It is rather charming to transfer traditional Rich Internet Applications
    (RIAs) for normal web browsers on PC platforms and related worlds to mobile devices
    or adapt them accordingly (because most modern cell phones, tablets, and smartphones
    are Internet capable and have a standard browser). You can simply save the app
    in the mobile device, load it from there, and use it offline, you do not even
    save online to be able to use such apps while on the move, provided it is set
    up accordingly. In our environment, there is a framework to facilitate developing
    such mobile apps based on RIA techniques: jQuery Mobile. In this final chapter
    of our book, we take a closer look at it. The potential is enormous, especially
    if you consider that you can, of course, also use the numerous jQuery plug-ins
    in the mobile category as well.


    # 13.1 Basics


    You can access the website of the jQuery Mobile framework at http://jqymobile.com/.
    You can also find the link to the jQuery Mobile site at the top of jQuery and
    jQuery UI website.


    > Note

    At the time of writing, the latest stable version is jQuery Mobile 1.2.0. It is
    not to be expected that there will be major changes in the near future, but to
    be on the safe side, you can always check the website for details of the latest
    version.'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# Chapter 13 jQuery Mobile


    ![](img/739ab7ef0a667848dd801c2d368bbc59_435_0.png)


    Figure 13.1 The jQuery Mobile website.


    Basically, the idea behind the mobile framework is simple and follows the pattern
    of normal RIAs: Based on JavaScript, a unified user interface (UI) is constructed
    that works on the most important tablets, cell phones, and smartphones or their
    browsers. The main problem of jQuery Mobile (and other technologies aimed at devices)
    is accommodating the huge range of mobile platforms. You need to take into account
    the smaller screen sizes and lower resolutions plus low color depth on most devices.
    On top of that, we face different inputs and special features such as reacting
    to rotating a device by automatically rotating the screen.


    To stand against all purely web technologies, you need to work with pure, semantic
    HTML as the basis of mobile RIAs. In terms of logic, only JavaScript will operate,
    whereas CSS takes on formatting (just as should be with RIAs on desktops). Although
    you could also create workarounds on the desktop that diverge from this rule or
    simply do it the way, this would prove absolutely fatal in the mobile world. The
    Mobile jQuery framework takes a radical approach and explicitly requires support
    of HTML5 and CSS3 to ensure error-free use. In particular, the web page should
    be created based on HTML5^2 because the framework uses this constantly so that
    the dynamic features and widgets can be implemented in the first place. And it
    builds consistently on jQuery itself.


    +   1. Even then, there is still plenty of work to be done for the large number
    of different platforms; just think of the varying screen sizes or different input
    and control options.


    +   2. At least you should avoid using obsolete tags, in particular for specifying
    layout formatting.'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# 13.1.1 The Platforms


    jQuery is a touch-optimized web framework based on graphical widgets that attempts
    to offer a unified UI across all popular platforms for mobile devices. Instead
    of developing different applications for different devices and operating systems,
    the aim is to need just one application. Currently, the following mobile operating
    systems are supported:


    +   * iOS

    * Android

    * BlackBerry

    * Bada

    * Windows Phone/Mobile

    * Firefox Mobile

    * Chrome for Android

    * Opera Mobile

    * Kindle 3 and Fire

    * Nook Color

    * Tizen

    * Palm webOS

    * Symbian

    * MeeGo


    With Opera, the browser supports arguably the most important browser in the mobile
    area, also Fennec, Ozone, Netfront, and Phonegap. The fully supported browsers
    are referred to as A-grade browsers (here, for the mobile domain), and the partially
    supported versions as B-grade or C-grade browsers; course, the specific version
    is relevant. At http://jquery.com/gbs/, you can find a complete list that tells
    you platforms are supported and to what degree. Note that new devices offer better
    support for HTML5 and CSS3, so the framework''s widgets are likely to run better
    on more recent devices than on older versions.


    Caution

    When creating mobile RIAs, remember that many cell phones and smartphones that
    are by means outdated or if a mobile device does not support the required standards
    or not use an A-grade browser, the web pages will display according to the principle
    of error tolerance. In the worst case, you will see a web page without the widgets
    that were intended by the web page creator. This web page will generally still
    work in part, but the user will have to scroll a lot and it will not look good.
    There are still some mobile devices that do not fully support CSS3 but otherwise
    manage quite well with the framework. In that case, rounded corners might not
    be displayed or animation effects may not run properly, but the widgets will otherwise
    work fine.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# Chapter 13 jQuery Mobile


    ![](img/739ab7ef0a667848dd801c2d368bbc59_437_0.png)


    The currently supported browsers offer the familiar components from jQuery UI
    systems.


    In terms of widgets, the Mobile framework offers the familiar components from
    jQuery UI as long as they are appropriate for mobile devices. They are optimized
    for use on touch-screens, plus there are some new events. The CSS framework of
    jQuery UI has been extended and adapted to the Mobile target platform. Mobile
    jQuery works intensively with CSS3, as mentioned previously. Via special data-role
    attributes, an automatic internalization takes place in the background, which
    you should not underestimate. Accessibility features such as WAI-ARIA are offered
    to support screen readers. The performance limitations in the mobile environment
    are also taken into account throughout the design of the framework. This is reflected
    by the file size of the files you need to download. The entire framework has a
    remarkably small size: the entire mobile functionality is contained in about 24
    KB in the compressed version.


    # 13.1.2 Downloading and Integrating the Framework


    You can download the current version of the framework from http://jquerymobile.com/download/.
    The Zip file contains all necessary resources, but jQuery Mobile is also offered
    via CDN, plus there is now a new Download Builder tool that lets you build a custom
    bundle with just the components you need.


    For a mobile application, you just have to make the CSS file and the JavaScript
    file available on the web server and integrate it in accordance with the rules
    for jQuery UI. We will shortly take a look at some application examples.'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# 13.1.3 Alternatives


    Of course, there are also alternatives for the Mobile framework. We do not list
    them all here, but want to briefly mention some of them nonetheless. JTouch,³
    for example, is a very interesting plug-in for jQuery that is specially geared
    towards mobile devices with the WebKit browser. This includes the iPhone, Palm
    Pre, and smartphones with Google''s Android, such as G1.


    At the time of this writing, the plug-in is still in the beta version, but this
    already shows where it is heading. With JTouch and jQuery, the applications based
    on HTML, CSS, and JavaScript are intended to support in particular specific properties
    of the WebKit browser and the telephone hardware itself (including motion sensors
    and smartphone touchscreens, as also loading images in advance and page transitions
    and new options for full-screen mode). As a result, orientation changes in a web
    application can be processed just well as multitouches gestures.


    For both, jTouch also offers suitable events to which you can bind callbacks as
    usual in jQuery. In addition, special CSS selectors in JTouch support gestures.
    For example, such a selector ensures that a link within a list element reacts
    to the pushing finger gesture. Selectors such as .back, .cancel, or .goback with
    hardware components such as the Back button under Apple.


    ![](img/739ab7ef0a667848dd801c2d368bbc59_438_0.png)


    Figure 13.3 The project website of jTouch.


    +   3. jTouch is open source under the MIT license and hosted at http://jqtouch.com/'
