  md: '# 13.7 Buttons


    # Position of Icons


    The default position of the icons is to the left of the button text. If you want
    to override this, you can use the attribute data-icon on the right (right), on
    of top (top), or below (bottom) the text. With data-iconpos="notext", you can
    do away with text on the button altogether.


    Listing 13.11 Grouping a Graphic in the Button


    ```

    <a href="index.html" data-role="button" data-icon="delete"

    data-iconpos="right">Delete</a>

    ```


    # 13.7.2 Block Element or Inline Element


    In the default setting, all buttons are generated as block elements (at least
    in the central content area of the page).9 Therefore, they take up the whole page
    width10 and generate a line break. If you set the attribute data-inline="true"
    for the button, you are creating an inline element that takes up only the space
    that the content pleases. Plus line breaks are prevented. Correspondingly, the
    value false generates a block element.


    # 13.7.3 Grouping


    You can also visually combine buttons into groups. They get packed into a container
    that is assigned the attribute data-role="controlgroup". In the default setting,
    the buttons are grouped vertically, and all spaces between the buttons are removed.
    The shadow effects are redesigned so that the group forms a visual unit.


    Listing 13.12 Grouping Buttons


    ```

    <div data-role="controlgroup">

    <a href="one.html" data-role="button">Yes</a>

    <a href="two.html" data-role="button">No</a>

    <a href="#" data-role="button">Cancel</a>

    </div>

    ```


    > Tip

    Via data-type="horizontal", you can also arrange the elements horizontally. The
    buttons are formatted as inline elements.


    9. In the footer of the page, this can also differ in the default setting, depending
    on the selected theme.


    10. Please remember that a page refers to the often quite small screen of the
    mobile device, and (in case of a touchscreen) this sensitive button has to be
    operated with a finger. A "large" button is therefore advisable.'
