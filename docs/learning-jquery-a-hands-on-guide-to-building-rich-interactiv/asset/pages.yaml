  md: '# A.1 Overview of Basic Information on JavaScript 463


    # Class Elements


    In JavaScript, there are also class elements. You can use these with the preceding
    class name without first creating an JavaScript constructor. For example, various
    properties and methods of the JavaScript Math class are class elements.


    # Prototyping, Extensions, and Creating New Data Types


    JavaScript is not a completely object-oriented language, and there is no provision
    for writing classes in the strict sense of object-oriented programming and the
    mechanism of inheritance. However, you can write your object definitions and create
    custom objects with these. Creating your object in JavaScript effectively requires
    two steps:


    +   1. You have to create your object declaration as described earlier.

    2. Via this object declaration, you can then create a specific object instance,
    just as with predefined object declarations.


    That approach is possible one pillar of the jQuery framework. With jQuery, the
    functionality of pure JavaScript is expanded by adding numerous own objects, which
    in many cases means programming new object declarations.


    Plus there is another pillar, which is referred to as prototyping. With it, you
    can create new data types based on existing data types. But what exactly is it,
    and how does it work? The answer first of all leads to the mechanism of inheritance,
    which you should know and understand in order to apply prototyping. The details
    are beyond the scope of this book. And although you do not need to completely
    understand prototyping and creating new data types just to use jQuery, it can
    still prove helpful if you have a bit more insight into this area.


    # A.1.5 Arrays


    Data fields or arrays refer only to a collection of variables that can be addressed
    via a name. An array is always a great advantage if you want to save a number
    of pieces of information of the same type. The special feature is that you can
    access the contained elements via a name and an index. This is done by placing
    the index in square brackets after the identifier.


    # Listing A.6 Accessing Array Elements


    ```

    x[0] = 1;

    document.write(x[2]);

    ```


    As you have seen earlier, you can also create associated data fields in JavaScript
    via a text index..


    # Declaration


    In the classic way, an array is created in JavaScript via an instance of the class
    Array (in other words, using the corresponding constructor).'
