  md: '# Effects and Animations


    This chapter discusses the effects and animations that jQuery offers for your
    web applications. Essentially, animations are based on a change of the web page
    or a part of the web page happening evenly or following a certain algorithm over
    a defined time period. This means all the jQuery techniques for creating animations
    are time dependent. To create a special effect, you can also use some non-time-dependent
    methods. The effect (for example, displaying an element) then occurs immediately
    when calling the method. You have already come across various effects and animations
    in the course of this book.


    # 9.1 Basic Use


    jQuery animations and effects are impressive (particularly for laypeople), but
    they belong in the category of simple techniques once you understand the basic
    functioning of jQuery. So, we just need to examine the various methods briefly
    without too many examples. For this reason, this chapter is one of the shorter
    ones in this book, contrary to what you might expect, and it is one of the easiest
    ones, at least from your point of view.


    # 9.1.1 Speed Is All You Need


    Essentially, jQuery animation techniques are based on the fact that the style
    sheet events of components of the web page are changed in a time-controlled way.
    For a time-dependent effect, the change happens immediately, here, too, Cascading
    Style Sheets (CSS) properties are changed in a targeted way. From this point of
    view, you can easily program animation techniques of the framework manually by
    recursively manipulating the object. By the jQuery simplify the whole thing significantly
    and encapsulate the underlying processes. As usual, the jQuery techniques are
    compatible with all browsers.


    If you want to use effects in form of animations, you usually need to specify
    a time period for the length of these animations. In jQuery, there are three default
    tokens (strings) for that purpose, with predefined time values that you can use
    whenever such a time specification is necessary (generally as parameter of methods):'
