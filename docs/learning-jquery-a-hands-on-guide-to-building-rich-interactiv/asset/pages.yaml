    The name says it all: This widget is a progress bar. The widget itself is straightforward.
    The crucial point for the progress bar is the option value or the corresponding
    parameter of the method. This value should be connected to some kind of process
    in practice for the progress bar to make sense. Data binding is ideal for this.
    We take a look at example later, in combination with the slider.


