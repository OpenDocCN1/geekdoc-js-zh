    # XML


    XML describes a platform-neutral text standard based on Unicode for creating machine-and
    human-readable documents to exchange any kind of information. XML documents have
    a tree structure that allows navigating to the individual branches of the tree.
    Just like HTML, XML is a markup language for offering a structure of the information
    beyond the text information. The information contained in a document is structured
    via tags that are enclosed by brackets both in HTML and XML. The elements in XML
    are not predetermined, unlike HTML. There is no ready-made, limited vocabulary
    of elements. There are no predetermined tags in the sense as most users know it
    for HTML tags. XML is merely a description of the syntax for elements and structures.
    Therefore, XML can be expanded indefinitely. The XML specification only describes
    the rules you need to follow in defining tags.


    In contrast to HTML, XML is a strict language in using syntax, and no principle
    of error tolerance exists (whereas it is a central axis in using HTML). The XML
    specification is strictly formal and does not permit any exceptions or unclear
    structures. But it means that XML can be easily and automatically validated and
    interpreted. So, XML is predetermined for data exchange.'
