  md: 'In slightly different form since about 1998. Only the term AJAX is relatively
    new; it became established around 2005, together with the buzzword Web 2.0. For
    supporting this asynchronous communication between client and web server, all
    modern browsers offer the XMLHttpRequest (integrated as an extension of the JavaScript
    object model), an integrated interface for controlling HTTP transactions from
    client-side programming languages (mainly JavaScript). These transactions take
    place independently of the “normal” data request by the web browser. XHR or XMLHttpRequest
    are based directly on the internal structure of HTTP and the backbone of any AJAX
    request. They are made available in one form or another in frameworks and toolkits
    that claim the title AJAX.


    For the asynchronous communication between browser and web server, the XHR object
    permits the registration of callback functions via return references. These callback
    functions are assessed with every change of the transaction state. Plus, you can
    access all HTTP header fields of an AJAX request or response via an XHR object.


    # 10.1.1 Creating an XMLHttpRequest Object Manually


    To work with an XHR object, this has to be created in accordance with the rules
    of the programming language used. In JavaScript, you do so via a suitable constructor.
    An object of the type XMLHttpRequest makes all available methods and properties
    for asynchronous communication with AJAX. Based on the common transfer methods,
    data can be sent or information be requested, plus the request header be set and
    evaluated.


    > Note

    That for security reasons you can generally only use AJAX to request data from
    the same domain as the requesting page. This is a commonly used sandbox principle.
    Otherwise, you would be referred to as cross domain access, and this entails the
    risk of potential misuse and manipulation. This sandbox principle constitutes
    a considerable limitation, and both web designers and browser manufacturers are
    working hard to find solutions to remove these limitations without endangering
    security. In Internet Explorer 8, for example, Microsoft offers a proprietary
    XMLHttpRequest, whereas Mozilla and related W3C forming browsers attempt to extend
    the XHR object. In jQuery, the method getScript is an extension of JSON that allows
    you to load a script from another domain. The basis is JSON with the name JSONP
    that we come back to later and with which JSON data can be loaded from any address.


    The various browser incompatibilities force us to create the XHR object in different
    ways to ensure that the procedure works in all relevant browsers. The basic approach
    looks like Listing 10.1


    +   1. Most asynchronously, which as mentioned earlier, explains part of the AJAX
    abbreviation.


    +   2. In practice, only POST or GET are generally used. Other methods such as
    PUT or DELETE are theoretically possible, but they are not supported by all browsers,
