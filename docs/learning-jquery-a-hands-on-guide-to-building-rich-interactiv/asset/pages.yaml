    # 5.3.6 Filters for Form Elements and Form Filters


    The names of these filters show what we discuss next: With these filters you can
    set special criteria for form elements. In earlier versions of jQuery, the two
    types of filters were listed separately. This distinction has now been removed
    in the documentation for the current version, but for the sake of clarity we still
    discuss them under separate headers here.


    Filters for form elements serve to select one element or a group of elements based
    on the type of the form element, whereas form filters filter the element via its
    state.


    # Filters for Form Elements


    To select a form element, you could, of course, in many cases use a filter on
    the input element and a more precise specification by the attribute type and attribute
    filters. But in jQuery, special filters allow an even more compact notation.


