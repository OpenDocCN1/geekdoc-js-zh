  md: '# Chapter 11 jQuery UI


    itself² (explicitly supported by Internet Explorer 6.0+, Firefox 3+, Safari 3.1+,
    Opera 9.6+, and Google Chrome).


    jQuery UI is not present in the normal jQuery JavaScript library, as jQuery UI
    is managed as a separate project within the overall jQuery framework. You can
    find the home page of the project at http://jqueryui.com.


    # 11.1.1 Components for Supporting Interaction


    The framework comprises a number of components for supporting complex interaction
    such as drag and drop (draggable() and droppable()), resizing (resizable()), selection
    (selectable()), and sorting (sortable()). This makes processes significantly easier.
    Generally, you need just one line of source code to implement the desired support
    for an element or a group of elements, as discussed shortly.


    # 11.1.2 Widgets


    Widgets are generally complex elements that you can use to compose a graphical
    user interface (GUI). With Hypertext Markup Language (HTML) or Extensible HTML
    (XHTML), you can easily generate simple elements as buttons, input fields, labels,
    headings, and tables. But particularly in the area of desktop applications, there
    are more complex UI elements that are not supported by a browser without CSS/JavaScript
    or additional libraries. All these UI components have to be rendered into HTML
    and CSS and can implement the logic exclusively on JavaScript. This is definitively
    not trivial, especially if you consider the different reactions in various browsers.
    Via widgets, these more complex elements for Rich Internet Applications (RIAs)
    are easily made available for web page developers. jQuery offers, among other
    things, the following widgets:


    +   - Accordion

    - Autocomplete

    - Button

    - Datepicker

    - Dialog

    - Progressbar

    - Slider


    2. Which used to be the other way previously. But this and will probably change
    again when new versions of jQuery UI are released.


    3. Yet Internet Explorer is not fully supported (in particular, in the CSS themes
    of the framework). For example, the present CSS themes do not support rounded
    corners for Internet Explorer nor the tools for creating custom CSS themes.'
