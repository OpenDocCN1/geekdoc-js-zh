    # 13.10.3 Plug-In Methods for Form Elements


    After jQuery Mobile has generated or adapted the form elements accordingly, you
    can check them with several integrated methods.


    With .selectmenu(''open'') you can open a menu, with .selectmenu(''close'') you
    can close it again, with .selectmenu(''refresh'') you can refresh it, with .selectmenu(''disable'')
    you can disable it, and with .selectmenu(''enable'') you can enable it.'
