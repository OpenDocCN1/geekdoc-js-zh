    # Dialog


    Dialog elements are becoming more and more important in RIAs. They increasingly
    take on the task that used to be fulfilled by pop-ups in the past. These represent
    new window instances of the browser and are frequently blocked by pop-up blockers,
    web page designers now tend to use dialog elements instead that are based internally
    purely on dynamically generated and formatted div structures and do not represent
    new windows (so that they are not blocked by pop-up blockers).'
