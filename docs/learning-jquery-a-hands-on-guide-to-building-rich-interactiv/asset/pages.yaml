    # JSON


    In case of request for additional data via AJAX, XML enables shifting lot of logic
    into the transmission format, but it is very unwieldy and often oversized for
    AJAX requests.

    Also, various problems arise during processing in different browsers, although
    jQuery compensates for many of these problems. Yet there is an alternative in-between
    the extremes, if plain text format offers insufficient logic and XML is too complex
    and too heavyweight. With JSON, you have a structure for transmission format that
    is simpler than XML and above all gets processed more consistently in web browsers.


    Like XML, JSON is a machine-readable plain-text format for data interchange that
    is considerably less flexible than XML but more compact. And JSON contains structures
    of data types that are directly based on JavaScript (objects, arrays, strings,
    numbers, the Boolean values true and false, plus the value null) that are nested
    and can be structured as needed with whitespaces characters.


    The concept of JSON is based on two central structures:


    +   - Name-value pairs: Such combinations can be found in almost all modern programming
    languages. They are usually implemented as object, record, structure, dictionary,
    hash table, key list, or associative array.'
