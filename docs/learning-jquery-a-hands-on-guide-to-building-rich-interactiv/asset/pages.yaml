  md: '# 13.12 The Theme Framework and General Content Design


    Fundamentals, you would do best in jQuery Mobile to leave the design of the content
    largely up to the browser and to transmit as little layout overhead as possible
    or even force uniform design, wholly in the tradition of the first versions of
    HTML. In the default setting, the framework uses the standard styles and size
    specifications of HTML. As mentioned earlier, you should avoid troublesome design-oriented
    tags such as <font>. Basically, the framework only adds a few styles on this for
    tables and field sets to make them a bit more manageable. Anything else is relocated
    to streamlined CSS classes.


    Under jQuery Mobile, there is also a rich Theme Framework. The central assignment
    of CSS rules takes place via the data-theme attribute. You can assign this to
    the header or footer to adapt the display. You can also assign this attribute
    to the actual content of a page, but the documentation of the framework recommends
    assigning the attribute to individual pages instead—in other words, all containers
    that are marked with data-role="page". But you can also design other widgets with
    it individually.


    > Note

    The framework''s default theme is aimed at optimal contrast.


    The entire concept of the mobile CSS Theme framework is based on the ThemeRoller
    of jQuery UI but adds a few more extensions that result from the special mobile
    conditions. In particular, it intensively uses properties of CSS3 (for example,
    to implement rounded corners and gradients and maximally compressed icons). This
    considerably reduces the amount of data to be transferred, if you compare it to
    implementation using graphics. Plus, every theme offers multiple color combinations
    and various designs.


    The mobile system separates color and text of structure styles such as dimensions
    and buffering. So, you can define these rules once and then merge or recombine
    them at your leisure.


    Each theme in the framework contains global settings for font, shadow effects,
    colors, the radius of rounded corners, and so on.


    > Tip

    jQuery Mobile 1.2 provides a separate ThemeRoller tool that allows you to build
    a theme and then download the custom CSS file that can be easily dropped into
    a project.


    And although it is not recommended, you can also create grid layouts purely based
    on CSS using the framework. Separate classes for this start with ui-grid. You
    can find more details in the documentation.'
  merge: -1
