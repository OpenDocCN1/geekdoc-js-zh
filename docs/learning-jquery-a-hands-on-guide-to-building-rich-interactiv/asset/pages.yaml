  md: "# 8.1 Basic Information on Events, Event Handlers, Triggers, and Data Binding\
    \ 251\n\n# 8.1.6 Bubbling\n\nIn connection with the event object, you will come\
    \ across the term bubble events or bubble phase. As previously mentioned, a browser\
    \ is constantly generating event objects (and not from those few events such as\
    \ clicking the mouse). Moving the mouse over the browser area happens more or\
    \ less constantly, so thousands of event objects can be generated in the shortest\
    \ period of time, or thinking of scrolling text. Most of these events are not\
    \ processed by the application at all but are simply ignored. After all, why would\
    \ you want to reach each single millimetre of a mouse movement, except in a few\
    \ special instances?\n\nIf an event occurs for a node in the tree (such as an\
    \ image or a paragraph), the question is which of these objects is responsible\
    \ for the relevant event. After all, nodes are deeply nested in the tree. What\
    \ would happen if several objects have the same event handler and would therefore\
    \ be to react to the event?\n\nThe problems are solved via event bubbling. This\
    \ means the event is always treated in the innermost element where it occurred—if\
    \ there is a suitable event handler there. The innermost element is furthest away\
    \ from the root in the hierarchy. If this element does not have a suitable event\
    \ handler, the event object is passed on in the tree to the next higher object\
    \ in the Document Object Model (DOM) and so on. It rises up like a bubble until\
    \ it reaches the root, the event object is destroyed.$^9\text{}$ And this unintended\
    \ destruction of an event object is the rule, not the exception (simply because\
    \ of the fact that most events, such as moving the mouse pointer by just a few\
    \ millimeters, do not force a specific reaction by the application).\n\n# 8.1.7\
    \ Data Binding\n\nTo react to events you can also use the mechanism of data binding.\
    \ With this, you can create a direct relationship between two variables or expressions.$^{10}$\
    \ You associate the value of a target with the value of a bound expression. Such\
    \ a bound expression can be a simple value of any type, an object, the result\
    \ of a function, or an expression. The process is similar to reference relationships\
    \ between cells in a table or a spreadsheet such as OpenOffice Calc or Microsoft\
    \ Excel (in particular if these are used in formulas and these formulas relate\
    \ to other cells).\n\n| A3 | B C D D E =A1+A2 |\n| 1 | | | | | |\n| 2 | | | |\
    \ | |\n| 3 | | | | | |\n| 4 | | | | | |\n\nFigure 8.1 Classic data binding in\
    \ a spreadsheet program.\n\n9. Although there are also models where the event\
    \ object is returned back to the triggering element and then destroyed only if\
    \ no handling occurs on the way back.\n\n10. The key for data binding in jQuery\
    \ is bind(), as you will see later."
