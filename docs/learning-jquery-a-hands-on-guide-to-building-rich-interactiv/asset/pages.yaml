    Figure 11.9 Details on cursor and delay.


    # Setting Option Values


    You can use creating components or widgets if you want to modify the default.
    Generally, you just declare the options on generating the component object with
    a parameter such as Map as usual in jQuery (particularly if you want to specify
    several options).


    Alternatively, you use with three parameters. As the first parameter, you specify
    "option", the second parameter is the name of the desired option as a string,
    and the third is the desired value. This notation makes sense as a setter when
    specifying only one option.¹15


    # Getting Option Values


    The getter is structured in a similar way as the setter with three parameters;
    you simply omit the third parameter, and as return value you get the value of
    the specified option.


    > TipnAlternatively, some methods give you return values of option values or current
    values of properties for some components and widgets. We take a closer look at
    this next.


    15. The notation with three parameters showed a strangely unreliable behavior
    in my experiments, but I was not able to determine the reasons, so it may only
    occur in certain constellations. I would advise you to set options always as Map
    (even if you only have one option).'
