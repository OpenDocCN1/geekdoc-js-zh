  md: "# 10.4 Getting and Parsing JSON Data: getJSON() and parseJSON()\n\nAs mentioned\
    \ previously, JSON offers the same functionality and flexibility as XML, without\
    \ the later's complexity and problematic evaluation in various browsers getting\
    \ in the way. For that reason, JSON has become established as the standard format\
    \ for AJAX applications if a certain functionality for processing the response\
    \ in the client is needed. In principle, you could use .get or .post to request\
    \ JSON data from the server. Then you would have to process this data before you\
    \ can use it. For example, use a native JavaScript function eval() to turn JSON\
    \ into a JavaScript object. But this method is very slow, forces browsers to turn\
    \ off their just-in-time-compilers, and has the reputation of being extremely\
    \ unreliable. Alternatively, you can work with the native JavaScript class Function\
    \ or use jQuery 1.4.1 and convert a JSON string into a Function object (provided\
    \ the browser supports this).\n\nBut in case of an AJAX request, this effort is\
    \ not even required. The AJAX method get() from the jQuery framework is specialized\
    \ for this file format and dealing with JSON almost child's play.\n\n# 10.4.1\
    \ A Simple Application with JSON\n\nAs basis, we use the JSON structure as you\
    \ see in Listing 10.4 on page 303. The details of how the JSON structure is made\
    \ available on the web page again not relevant for our purposes. We are only looking\
    \ at how it is processed in the client (ch10_6_ready.js).\n\n> Listing 10.12 Requesting\
    \ and Processing JSON\n\n```\n01 $(function() {\n02   $(\"button:first\").click(function()\
    \ {\n03     $.getJSON(\"ch10.json\", function(data) {\n04       $(\"#output\"\
    ).append(data.name + \", \" + \n05         data.websites.url1]);\n06     });\n\
    07   });\n08 }););\n```\n\nWe are requesting data in the form of JSON, and the\
    \ response from the server is again available via data (the first parameter of\
    \ the callback function). The extremely comfortable situation is that the method\
