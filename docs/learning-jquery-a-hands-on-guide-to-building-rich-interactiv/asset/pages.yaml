  md: '# Chapter 8 Event Handling under jQuery


    Although you could also use a named function here, it is most common to use an
    anonymous function in practice.6 In general, you could also use a callback function
    here that has to give a given return as return value.


    # 8.1.5 The Event Object


    Behind event handling in JavaScript is a special object: the event object. The
    user constantly7 produces event objects, and you can use them in a targeted way
    to react to events. The event object offers a range of interesting properties
    to purpose. Let''s use as an example the situation that the user clicks anywhere
    in the web page with the mouse. Each mouse click causes the browser to create
    an event object that contains, among others, the following information:


    +   * The mouse button used

    * Any keys pressed in down (Ctrl, Alt, CapsLock)

    * The coordinates of the click


    Other event objects that are created for further events will, of course, contain
    information that corresponds to the event. For example, if a key is pressed, you
    can get information about which key was pressed. Generally, an event object contains
    numerous pieces of useful information that you can use for creating well-adapted
    applications.


    This leads to the question of how you can use the event object. The answer is
    simple and ever complicated at the same time. The simple part of the solution
    is to access the properties of an event, you specify the object as usual dot notation.
    The complicated part is for the name of the event object or its availability,
    you need to distinguish between the Microsoft world and the concept in other browsers,
    and there is a difference regarding the visibility of the object. Microsoft uses
    a proprietary naming convention for the properties of the event object. jQuery
    compensates for the differences by encapsulating the event object and permits
    using the standardized syntax even for Internet Explorer.


    > Caution

    Most events within a web application are supported by all modern browsers. But
    some events are browser specific, and in particular differences exist even with
    HTML handlers regarding the tags for which an event is supported. It gets really
    complicated dealing with the event object, on top of all the trouble with the
    different identifiers and access levels, even identical properties of the event
    object are named differently in the different browser concepts, as mentioned earlier.8
    Without separating the browser worlds between Microsoft and the rest, nothing
    will work, but then the whole thing is extremely difficult.


    +   6. You need the identifier of this callback function anyway.


    +   7. As you move the mouse pointer over the browser area, you create a multitude
    of event objects, not just one.


    +   8. These are the results of the unfortunate wars of the ''90s. "If you are
    going to name that property which, then I definitely won''t. What name could I
    use that is as different as possible? Hmm, how about keyCode? That will give your
    developers something to puzzle over.'
