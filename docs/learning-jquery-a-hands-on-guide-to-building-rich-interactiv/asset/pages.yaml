  md: '# 402 Chapter 12 Plug-Ins


    ![](img/739ab7ef0a667848dd801c2d368bbc59_419_0.png)


    Figure 12.8 Now the plug-in is satisfied.


    > Note

    If you want to send the form data and several errors are detected, all errors
    will be indicated. The first invalid field then usually gets the focus. Incidentally,
    the validation check occurs only at the first attempt to send the data. So long
    as a user has not tried to send the form, he can jump around the fields without
    triggering error notices, even if he enters invalid data. But once errors have
    been detected and indicated during an attempt to send, each field is checked immediately
    after a value is entered, and the error message is updated or deleted accordingly
    to what input has been entered. This dynamic behavior of the validation check
    is explicitly intended to offer the user appropriate usability using a form.


    The validate() method is the code of the entire plug-in.It works effectively already
    in the default configuration—as you have seen. If you want, you can assign a whole
    number of options to the form, as described in Table 12.1.


    Table 12.1 A Small Selection of Possible Options for validate()

    | Option | Description |

    | --- | --- |

    | rules | A definition of rules in the form of key-value pairs. The key is the
    name of an element or a group of check boxes or option boxes. The value is an
    object with rules or parameter pairs or a string. |

    | messages | Key-value pairs with adapted error messages. |

    | Various events | For various events, validations can be triggered. This includes
    onsubmit, onfocus, onkeyup, and onclick. You assign callback functions in the
    form as usual. |

    | errorClass | Specifying an individual error class. |

    | highlight | Specifying how invalid fields should be highlighted. |


    If you now want to specify the validation further, the plug-in offers two central
    elements for this:


