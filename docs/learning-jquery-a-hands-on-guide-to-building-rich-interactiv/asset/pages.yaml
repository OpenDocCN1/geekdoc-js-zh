  md: 'In principle, you can use the DOM further in the client, but that is beyond
    the scope of this discussion and not very sensible in many cases, because an easier
    alternative exists with JSON. However, let''s briefly summarize how you can proceed.


    For navigating the response from the web server, you can essentially work with
    the usual methods: getElementById(), getElementsByName(), getElementTagName(),
    or getElementsByClassName(); of course, you can also use all jQuery techniques
    for selecting, traversing, and navigating a tree. In terms of data requests via
    AJAX, this also enables you to navigate to any part of the response in a very
    targeted way.


    You just have to be really careful because the DOM is constructed differently
    in different browsers, as mentioned earlier. The crucial point is always that
    for selecting an element you try to get close to the target node as possible via
    a suitable method. If you traverse the depths of the tree from the root of the
    response, you might get different results in the various browsers.


