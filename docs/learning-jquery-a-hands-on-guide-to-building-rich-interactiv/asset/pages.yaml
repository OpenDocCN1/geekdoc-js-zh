  md: '# 8.2.2 The Properties of the Event Object jQuery.Event


    The event object in jQuery has a number of properties that are, of course, based
    on the attributes of the classic event object.


    event.type

    With this attribute, the type of the event is described (for example, if a mouse
    click happened or keyboard input or something similar).


    event.target

    Via this attribute, you can get the DOM element that triggered the event. This
    can be the element that is registered for this event or one of its children.


    event.data

    This attribute is immensely important because event.data offers optional data
    if this has been passed to bind() and the current execution handler has bound.


    event.relatedTarget

    In case of mouse movements, this property contains the DOM element where the mouse
    pointer was previously if the mouse pointer is moved to another element or away
    from another element. This is the involved node.


    event.currentTarget

    Via this property you get the current DOM element within the bubble phase. This
    attribute is always equivalent to the value of this in the function.


    event.pageX/event.pageY

    The X and Y coordinates where a mouse event has occurred. The coordinates are
    seen in relation-to the document. The properties also fix the divergence of Internet
    Explorer regarding the standard notation for the coordinates.


    event.screenX/event.screenYnThe screen coordinates.


    event.resultnThe last value that was returned by an event handler.


    event.timeStamp

    The time stamp in milliseconds when the event was created.'
