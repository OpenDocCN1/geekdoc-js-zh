  md: '# # Appendix


    #  A.1 Overview of Basic Information on JavaScript


    Effective programming with jQuery requires knowledge of the syntax and concepts
    of JavaScript. This appendix provides a brief introduction to the most important
    JavaScript techniques so that you can understand how jQuery works and how to use
    its methods. For a fuller understanding of JavaScript, you should seek additional
    JavaScript resources.


    #  A.1.1 Case Sensitivity


    JavaScript distinguishes between uppercase and lowercase for variables, keywords,
    function identifiers, and method identifiers.


    #  A.1.2 Variables, Literals, and Data Types


    Of course, JavaScript has variables, data types, and literals. However, some particularities
    of JavaScript differ from most “true” programming languages.


    > Note

    A **literal** is a representation of a clearly defined and unchanging value, such
    as a number or text. A **variable**, represents a name in the main memory where
    values (literals) can be temporarily stored. Both a literal and a variable require
    a **data type**. This specifies the size of the variable or literal in the main
    memory, which of information it is, and how to proceed with it in an operation.


    In JavaScript, a data type is not explicitly specified via a keyword in the declaration
    (meaning the first introduction) of a variable. The data type is specified **implicitly**
    via the type of value that is assigned to the variable. If a different type of
    value is later assigned, the data type of the variable even changes during the
    runtime of the script. The data types are managed internally by JavaScript. So,
    JavaScript is a loosely typed language that has only a few data types.


    But although JavaScript is a loosely typed language, it still has several implemented
    data types (referred to as built-in data types). These data types have nearly
    the functionality of data types available in more powerful programming languages
    such as Java or C#.'
  merge: -1
  pgno: 474
- img_proc: true
  md: '> jQuery extends the scope of data types in JavaScript by adding its own data
    types. These are referred to as virtual types and pseudo-types.


    # The Classic JavaScript Data Types


    Of course, in jQuery you can use all the data types available in classic JavaScript.
    We do not discuss these in detail, but instead consider them briefly here.


    # String


    A string is text enclosed in double or single quotation marks. Thanks to the two
    variations for specifying a string, you can nest strings within each other. In
    JavaScript, a string is also seen as an object, and so this object offers interesting
    methods (for example, for converting to uppercase letters and searching for text).


    > Beyond the normal methods of a native string, jQuery offers several string-handling
    methods. The method jquery.trim(), for example, removes superfluous whitespace
    at the beginning and end of a string.


    # Number, Integer, Float, and the Math Class


    The data type Number represents numbers in JavaScript. Integer is a subtype that
    represents whole numbers, and Float represents floating-point numbers. You can
    apply the usual mathematical operations to variables and literals of these types.
    And the representation also does not require any special explanation here. Beyond
    the pure data type, JavaScript offers several utilities (properties and methods)
    in form of the Math class for dealing with numbers. With these, you can calculate
    the sine or generate a random number, for example.


    When processing the variables or literals, sometimes the result is not a number
    or it represents infinity. For these two cases, JavaScript offers the defined
    tokens NaN (not a number) and Infinity.


    # Object


    The data type Object represents an object. In JavaScript, such an object can be
    created with a constructor or declaratively, or it is available based on the environment.


    # Boolean


    A Boolean value in JavaScript is represented either by the token true or false.'
