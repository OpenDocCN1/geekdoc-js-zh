  md: '# 1


    # Introduction


    Rich Internet Applications (RIAs), with their somewhat vaguely worded rich opportunities,
    have significantly changed the way we use the Web over the past few years. And
    the speed of this change keeps increasing. The significance of classic desktop
    applications is being repositioned. Many types of programs that were traditionally
    used only as desktop application suddenly appear on the Web, be it personal calendars,
    entire office programs, games, route planners, or communication programs. But
    apps for cell phones or smartphones are increasingly based on web technology.
    This changes both the user behavior and the user expectation for Internet applications
    in general and the availability of services. As classic web applications, but
    with a certain extra value, RIAs are, on the one hand, always available if you
    have a halfway decent Internet access and a modern browser. On the other hand,
    they are hardly distinguishable more from classic desktop or mobile apps in terms
    of operation, performance, and visual appearance.


    The most effective way to ensure that these rich opportunities are available usually
    involves using an appropriate web framework. Be aware, however, that if you use
    a framework, you become significantly dependent on a manufacturer or a project,
    and that you no longer have complete control over the source code in any case,
    using frameworks requires familiarizing yourself sufficiently with the relevant
    functions and working methods of the system. In contrast to grandiose advertising
    claims of some frameworks (and some tools), you can use them effectively after
    you understand web programming concepts and have at least a basic knowledge of
    the underlying technology. Strictly speaking, you will profit from most frameworks
    the less you actually need and the more you master the basics.


    Regardless of these problems and disadvantages, however, there is much to be said
    for making use of frameworks and toolkits. They will certainly help you develop
    and maintain sophisticated websites more quickly, efficiently; and they will offer
    to you a richer and more robust system.


    +   1. The browser becomes a multifunctional access instrument for a specific
    task and thus replaces classic application types. In the future, users might only
    need a browser as application, or the operating system and the browser may merge
    so that they become indistinguishable.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 1 Introduction


    Note

    The preceding text included the terms framework and toolkit a few times. There
    is no standard definition for exactly what a framework is and how it differs from
    a toolkit. In fact, a reliable definition and differentiation is not very straightforward.
    But generally, the term framework implies a programming framework that already
    offers certain functionalities. A framework is not yet a finished product in itself,
    but merely a frame within which one or several programmers can create an application.
    A framework usually contains a library with useful predefined code structures,
    but also (in contrast to a pure library) specifies a certain control of the behavior
    involved in using it (for example, a syntax or grammar). With a toolkit, the main
    focus is on a collection of programs (tools), but these can also be based on specific
    libraries or a syntax concept. Both a framework and, in particular, toolkit often
    provides widgets or components—in other words, elements that constitute a graphical
    user interface (GUI).


    # 1.1 What Is This Book About?


    This book provides an easy introduction to web programming with jQuery, jQuery
    UI and Mobile jQuery. jQuery is a free and comprehensive framework built on top
    of the JavaScript language. It was originally developed by John Resig and released
    in January 2006 at BarCamp (NYC). It now consistently developed as an open source
    project. jQuery UI is built on top of jQuery and extends the jQuery framework
    with UI components. Similarly, jQuery Mobile is also built on top of jQuery and
    extends the jQuery framework with mobile device-specific components.


    The framework offers a wide range of very helpful features (for example, easy-to-use
    functions for DOM manipulation and navigation, as well as basic AJAX support).
    Beyond this, the framework offers support for Cascading Style Sheets (CSS), an
    expanded event system, impressive effects and animations, various auxiliary functions,
    and numerous free plug-ins.


    But jQuery particularly excels the seamless integration of the framework in many
    web platforms by large industry providers or their official support. For example,
    Microsoft uses jQuery in the development environment Visual Studio in combination
    with the ASP.NET MVC framework and Microsoft Asynchronous JavaScript and XML (AJAX).
    For example, if you create a new ASP.NET project, you can also integrate jQuery
    automatically (although not necessarily in the latest version).


    In an ASP.NET MVC 3 or later web application in Visual Studio, you can even choose
    to integrate some jQuery plug-ins (such as jquery.validate.js for validating user
    input).'
  merge: -1
  pgno: 19
