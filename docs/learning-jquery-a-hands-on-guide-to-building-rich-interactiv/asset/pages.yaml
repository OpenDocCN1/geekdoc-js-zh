    # Caution


    Moving logic in a web application to the client can sometimes prove tricky. You
    should consider carefully whether this is the right way to go for your application.


    Regardless of whether this distribution of business logic between web server and
    client is sensible, the processing of XML in the client via pure JavaScript is
    problematic. XML is only a description of the syntax for elements and structures.
    In principle, the rules allow all such documents to be easily validated and processed
    in an automated way. At first glance, this predestines XML for data exchange.
    But unfortunately, the implementation of these rules is insufficient in various
    platforms. It is also hard to understand why this might be-unless driven by market
    objectives—there are serious differences in how XML is processed in different
    browsers. The jQuery methods reduce these problems and at least theoretically
    make such a distribution of business logic possible. But JSON is the better choice
    in practice for a structured response of the web server. Because if plain text
    appears too difficult, JSON is an alternative between the two extremes. With JSON,
    you have a structure for the transfer format that is simpler than XML and all
