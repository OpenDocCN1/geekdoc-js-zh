    crossDomain


    As of jQuery 1.5, you can specify if you want to allow cross-domain access.

    The default is false, which only permits access to the same domain.


    data


    The data that is sent to the server in form of a query string. This query string
    is a string with a special structure, which you have already seen several times.
    The data is transmitted to a processing script or program on the server as a set
    of name-value pairs. The name represents a variable, and the value is the value
    that the variable should transmit to the server. This can, for example, be a user
    input. Such query string is structured roughly like this:


    If an array is passed, jQuery serializes multiple values with the same key. For
    example,


    ```

    {names:"Steven", "Phil"}

    ```


    is turned into the following query string:


    ```

    info%5D%5B=Steven&amp;info%5D%5B=Phil

    ```


    dataFilter


    With this, you can specify a function for directly dealing with the reply of an
    XHR object. As parameters, the function accepts the data from the server and a
    parameter of the type dataType.


    dataType


    If you receive a response from the server in an AJAX request, the response is
    sent twice, as mentioned earlier. Or more precisely, it is available in properties
    of XHR object. The property responseText contains the data sent by the server
    as text and responseXML as XML data (in other words, as a tree that you can navigate
    on). This dataType parameter enables you to control how the client should make
    the assignment. As mentioned before, the default setting in jQuery is "intelligent".
    In this case, jQuery will decide based on the recognized MIME type of the response
    to use responseText or responseXML. You are already familiar with the available
    types (xml, html, script, json, jsonp, and text) and how to use them.


    error


    Here you specify a special callback function that is called in case of an error
    (in other words, if the AJAX request has failed). As a parameter, you specify
    three arguments: the XHR or now xhr object, a descriptive string for the error
    that has occurred, and an optional exception object if one occurs. Possible values
    for the second argument are null, as well as timeout, error, unmodified, and parsererror.
    As of jQuery 1.5, you can also specify an array with functions for the settings.
