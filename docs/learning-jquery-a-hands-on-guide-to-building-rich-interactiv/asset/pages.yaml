  md: '# Available DOM Objects


    Under the DOM concept, the following objects are available, among others. Note
    that not all browsers support all objects and there are various differences in
    the type of support, even in the DOM concept.


    Table A.1 Important DOM Objects


    | Object/Class | Description |

    | --- | --- |

    | all | An object of this type enables in principle directly accessing all elements
    of a web page. Yet it is not part of the official DOM standard but is a proprietary
    implementation for Internet Explorer. The object is now replaced entirely by the
    most recent object node, which is much better supported in modern browsers. You
    should avoid using the object. |

    | document | This object represents the web page itself and contains the components
    of the web page as subobjects. In particular, you can write into a web page and
    select elements via methods of this object. |

    | event | An object that is created with events in a web page and can be used
    for the (central) event handling under JavaScript. But this event handling under
    JavaScript is implemented inconsistently in various browser worlds. Here, frameworks
    such as jQuery provide considerable help. |

    | element | An element in a web form is represented via an object of this type.
    |

    | form | The object contains a reference to an object that represents a form in
    HTML page. |

    | frame | An object representation of a frame below window. |

    | history | Via history (a direct subobject of window), you can access the previously
    loaded pages in the user''s browser. |

    | image | The object contains a reference to an image in a web page. |

    | location | The location object (a direct subobject of window) represents the
    complete URL that is linked to a window object (in other words, the browser''s
    address line). |

    | navigator | Via navigator, you can access information on the user''s browser.
    |'
