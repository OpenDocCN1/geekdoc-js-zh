    # 10.5 Loading a Script via AJAX: jQuery.get()


    You usually load a JavaScript script immediately after loading with the web page
    if you are going to require functionality from the library at some point. But
    you do not generally need all the functionality of the JavaScript library. It
    would certainly make sense to be able to divide up functionalities between several
    libraries so that you can load specific functions later if and when required.
    You can load script instructions via AJAX easily in almost any browser simply
    by writing a script statement into an HTML fragment, as shown in 10.15.


