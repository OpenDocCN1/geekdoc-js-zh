  md: 'With next(), you get the directly following heading of the type h3. Via nextAll(),
    you select all following headings of the type h3 and accordingly with prev() the
    preceding ones. With prevAll(), you get the two headings that are before the selected
    element. And with siblings(), you select all headings of the type h3 except for
    the selected element from which you are acting.


    # The...Until Variants


    Since jQuery 1.4, there are variations of nextAll() and prevAll() in the form
    of nextUntil() and prevUntil(). These work exactly the same as their two sister
    methods, but you specify as parameter a selector that indicates a stop of the
    sibling selection. The element specified via the selector is specifically not
    selected any more.


    Listing 6.50 The Siblings Are Selected Up to the Class k1


    ```

    $$(div'').nextUntil(''.k1'')

    ```


    If the selector does not have a match, all siblings in the specified direction
    are selected.


    # 6.11.4 Searching Descendants with has()


    Since jQuery 1.4, there is the has() method, for which you can specify a selector
    or a DOM element as a parameter. This element has to be a descendant of the preceding
    element in the tree, so the element is selected.


    Listing 6.51 A Descendant Rule


    ```

    $$(div).has(''p'').css(''background-color'', ''red'');

    ```


    In this example, only the div elements that have a descendant of the type p would
    be selected.


    # 6.12 Finding with find() and contents()


    Two interesting methods for finding elements and contents of a web page are find()
    with a filter expression as parameter and contents().


    With find(), you can search descendant elements of an element to see if they match
    the filter expression.


    > Caution

    The current element is not searched! That is what the method filter() is for.'
