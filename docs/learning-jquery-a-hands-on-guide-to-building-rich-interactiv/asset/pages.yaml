  md: '# Formatting with Style Sheets

    Under jQuery


    Selectors and filters, plus the corresponding filter methods, are the basis of
    dynamically creating and web pages based on style sheets. On the Web, such style
    sheets in the form of Cascading Style Sheets (CSS) are the standard. Purely with
    regard to web pages, other style sheet languages do not play any important role.
    And the times when we were using Hypertext Markup Language (HTML) command specifying
    to visually enhance via web page are now over. Using tags such as <font> or the
    general specifying of colors or alignment via HTML attributes is now only appropriate
    for quick and dirty sites that do not fulfill any particular expectations. This
    is not really worth mentioning, from the fact that it already applied more than
    10 years ago.


    However, web designers continued to use HTML tags for the visual design of web
    pages until recently. In some situations, this persistence may have had its merits
    even though CSS has been standardized for many years, there are still problems
    with it in browsers for certain effects, even today. You can assume CSS version
    1 is supported by all browsers, but rules from CSS 2 still do not work everywhere—even
    more than 12 years after the 3WC standardized it. Let''s not mention CSS 3 and
    certain expanded properties that have actually been around for ages. Just think
    of the property opacity that is not supported by Internet Explorer, which instead
    requires a notation that does not conform to the standard.¹ Or the strict refusal
    of Internet Explorer to support rounded corners for block elements.²


    > Note

    As version 1.4.3 of jQuery, there are cssooks. These are intended for hooking
    directly into the jQuery framework to overwrite CSS properties. Primarily this
    is intended for creating adapted and browser-optimized properties of the CSS 3
    properties.


    +   1. Microsoft uses the proprietary method filter(), but jQuery uses this in
    the background automatically.


    +   2. Even jQuery fails to succeed regarding support for rounded corners by Internet
    Explorer. Or rather, jQuery consistently uses CSS3, and anyone who chooses not
    to implement this standard will have to live with the consequences.'
  merge: -1
