    # 6.14 The add() Method


    The add() method is easy to misunderstand, in my opinion, because its name suggests
    adding nodes or elements to a web page or the DOM. But this is not what the method
    does. With the add() method, you can instead add elements to a set of already
    selected elements. In other words, you are only expanding a previously made selection.
    This proves most useful when using chained expressions.'
