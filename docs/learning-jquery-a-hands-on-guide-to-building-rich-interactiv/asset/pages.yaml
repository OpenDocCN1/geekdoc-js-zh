  md: '# 4.8 Using jQuery in Combination with Other Frameworks


    In jQuery, all global objects are saved within the jquery namespace. So, you should
    not run problems if using it in combination with other libraries like Prototype,
    MooTools, or YUI.


    # 4.8.1 The Function noConflict()


    But in cases, there can still be a conflict. The identifier is $, as mentioned
    previously, a shortcut for the jquery namespace (more precisely—the variable or
    object jquery). Note that $ is also used, for example, in the Prototype framework.
    So, if both frameworks are used in combination with a website, we have a case
    where the pure concept of namespaces as they are possible in JavaScript is not
    going to resolve all conflicts. The identifier is not unique if both frameworks
    are used in combination because the root of (added on) namespace system in JavaScript
    will conflict both identifiers with different meanings.


    For that reason the core area of jQuery offers the jquery.noConflict() function,
    which is intended to provide protection against such conflicts when you are using
    multiple libraries in combination. If you are using it, the $ is assigned the
    name of the library that is first implemented in the website. For the other library,
    this identifier is no longer available, but this resolves the ambiguity of meaning
    and therefore the conflict.


    If $ is no longer available in jQuery, you can still address the jQuery namespace
    via the synonymous variable jquery. This alias of $ is not turned off by jquery.noConflict().
    With a Boolean parameter, you can remove all jQuery variables, including the synonymous
    variable jQuery.


    > Caution The function jquery.noConflict() has to be called after the jQuery library
    is integrated before integrating and using the additional library that causes
    the conflict.


    The jQuery.noConflict() returns the jquery object, and so you can also assign
    it to a separate variable. This can then be used as your alias for $, as shown
    in Listing 4.23 (ch4_12.html).


    +   Listing 4.23 Defining Your Own Alias for $


    ```

    ...

    <script type="text/javascript">

    src="lib/jquery-1.8.2.js"></script>

    <script type="text/javascript">

    var $ = jQuery.noConflict();

    $(function() {

    alert($("img").get().length);

    });

    </script>

    </head>

    ```'
