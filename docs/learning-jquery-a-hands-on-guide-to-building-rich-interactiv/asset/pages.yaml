    # attr(), prop(), and removeProp()


    Also, the internal workings of the attr() method have been rewritten. Since jQuery
    1.6, the handling of DOM attributes and properties is separated. For the latter,
    jQuery 1.6 introduced the prop() and removeProp() methods. The new method prop()
    sets the properties (hence, the name of) DOM elements or returns the corresponding
    values. Correspondingly, removeProp() removes properties.


    The background is this: In the previous versions, jQuery did not separate attributes
    and properties clearly. There are small differences. Generally, DOM attributes
    represent the status of a DOM information that is delivered by the document (for
    example, the value of the attribute value in `<input type="text" value="abc">`).
    So, this is the static value of the HTML markup. DOM properties, in contrast,
    represent the status of the document. And this can differ from the static preset
    value, as the example shows. If the user enters a value in the form, the method
    prop("value") returns the input of the user rather than the preset value. Up to
    now you should have been working with the val() method anyway in case of form
