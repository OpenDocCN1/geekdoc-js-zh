  md: '# Event Handling Under jQuery


    In this chapter, we move on to event handling with jQuery. In other words, we
    look at the circumstances in which certain actions are triggers within the web
    page. This is certainly one of the most important areas of application of a framework
    as jQuery because the reaction to events within a web page is not at trivial with
    JavaScript instruments, contrary to what you would expect. The alternative reaction
    with Hypertext Markup Language (HTML) event handlers, which even people without
    any knowledge of JavaScript know from web pages, is rather well, apart from a
    few exceptions, but is less powerful and incomplete. Even worse, structure and
    functionality are mixed up in it, and that is what we should avoid for elaborate
    web applications. With jQuery, you have a very powerful instrument at hand for
    dealing with this complex topic successfully and safely.


    # 8.1 Basic Information on Events, Event Handlers, Triggers, and Data Binding


    You are probably aware that JavaScript statements and function calls are executed
    simply loading the web page in the browser if you write these calls directly in
    a script container or an external script. As soon as the relevant script line
    loaded by the browser, the corresponding statement is executed. This is the most
    primitive constellation in which a JavaScript is executed. But usually it is only
    used for initializing. And, of course, there are also other situations where you
    might want to call a function or statement, apart from just loading the web page.


    # 8.1.1 Events


    Here, the term event enters the stage, referring to anything that can happen while
    the web page is active in the browser. This can include loading the page into
    the browser or removing the page from the browser, but also actions executed by
    a user (for example, clicking a button,'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Chapter 8 Event Handling under jQuery


    sending form data, or moving the mouse pointer over part of the web page). Such
    events are ideally suited for calls based statements.


    # 8.1.2 General Information on Event Handlers


    So, we need a mechanism via which we can react to such events and can trigger
    a state-function, or object method which are appropriate. This mechanism is referred
    to as an handler. Different event handlers can be used to react to various events
    that the event handler mechanism identifies via predefined names.


    Event handlers are available both in pure HTML and JavaScript.^1 So they exist
    in both worlds and are the most important link between (X)HTML and JavaScript.^2
    Essential is also that the triggering events are present in HTML (version 4 and
    later) and in JavaScript and functionally identical. A few event handlers in the
    JavaScript environment do not have a direct counterpart in HTML.^3


    # 8.1.3 HTML Event Handlers


    In HTML, event handlers simply constitute attributes of a tag. You can specify
    event handlers for most tags.^4


    > Note

    The W3 consortium has officially included event handlers in the HTML language
    standard. This is particularly important because it means that uppercase and lowercase
    spelling does not play a role if event handlers are written as HTML attributes.
    In JavaScript and XHTML, event handlers always have to be written entirely in
    lowercase.


    The name of an event handler generally starts with the syllable on, followed by
    a self-explanatory description of the event. I am sure that you are familiar with
    the concept.


    Listing 8.1 Different Event Handlers in HTML


    ```

    onmouseover

    onload

    onclick

    ```


    +   1. Strictly speaking, in the DOM concept, let''s not split hairs.

    2. As mentioned previously, the link can be made from either side.

    3. One such case is onreadystatechange, which exists only within the JavaScript
    environment for implementing an AJAX request.

    4. Essentially for all tags, but with some it simply does not make any.'
