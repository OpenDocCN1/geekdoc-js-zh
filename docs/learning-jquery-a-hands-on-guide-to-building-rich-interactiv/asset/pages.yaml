    # Tabs


    Currently, we see many web pages with pages that are subdivided via tabs. This
    structure is also easy to implement via jQuery UI. Interestingly, it is even easier
    if you load the content with AJAX. Of course, you can also configure this widget
    widely, but in particular connection with AJAX, the basic setting is already powerful
    that you will rarely need to configure it further.


    Similar to the Accordion component, tabs are based on a nested div structure.
    Inside it, you will first find a list. This takes care of labeling the tabs and
    interactively displays the content so the user can switch between contents simply
    by clicking the tabs. This involves hyperlinks that are specified as content of
    the list items. There are two situations to distinguish:


    +   - We want to display content that is already present in the web page and currently
    not visible. This content is located within an inner div area that is marked with
    an ID. This link uses an anchor reference to refer to this ID.'
