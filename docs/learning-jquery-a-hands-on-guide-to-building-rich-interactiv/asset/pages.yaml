  md: '# 10


    # AJAX


    Around the year 2005, AJAX revolutionized the Web. Since then, hardly anything
    is as it is used to be on the Web hit like a bomb, although it is in fact just
    a fashion term. Many frameworks for developing applications on the Web occasionally
    explicitly referred to themselves as AJAX frameworks, although the pure AJAX functionalities
    often consisted in only a few percent of their performance range. This small part
    is immensely important because it forms the basis for modern Rich Internet Applications
    (RIAs). Just think of the many special Google features that are all based on AJAX.
    Of course, a high-end framework such as jQuery offers all the required functions
    for simplifying the creation of AJAX applications. These AJAX functions in jQuery
    are what we focus on in this chapter.


    If you compare the source code of handwritten AJAX applications with the source
    code you need to create for an application of the same functionality and quality
    by using jQuery, you will see that your code is much simpler and of better quality.
    Above all, the required code is massively reduced. You do not constantly have
    to reinvent the wheel for many repeated steps in the AJAX communication, but can
    instead use of the sophisticated jQuery techniques. With jQuery much clearer and
    more compact. At the very least, you can prevent many complications you might
