  md: 'Here is a list of AJAX events that can occur in an AJAX communication. Apart
    from ajaxStart and ajaxStop, all events are triggered for all AJAX requests (unless
    a global option was set). The events ajaxStart and ajaxStop refer to all AJAX
    requests together.


    Table 10.2 The Global AJAX Events In jQuery

    | Event | Description |

    | ajaxComplete | This global event behaves exactly the same way as the complete
    event and is triggered whenever an AJAX request completes. |

    | ajaxError | This global behaves analogue to the local error event. It is triggered
    if an error occurs. |

    | ajaxSend | This global event is triggered before the request is sent. |

    | ajaxStart | The central global event on starting an AJAX request. The event
    is triggered when the AJAX request starts and no other AJAX requests are currently
    running. |

    | ajaxStop | The global event is triggered if no other AJAX requests are carried
    out. |

    | ajaxSuccess | This global event only occurs if the call has been successful.
    |


    You can see complete examples for the $.ajax() method in the jQuery documentation
    at jquery.com.


    # 10.10 Complete Control


    The previously discussed jQuery methods for AJAX requests are generally very helpful
    and often easy to use; they handle much in the background that we need to take
    care of in AJAX. They are also seen as abstraction on a higher level in the jQuery
    documentation and keep the details of an AJAX communication mostly away from the
    programmer. However, you might-times be interested in these details of an AJAX
    communication, and jQuery offers a suitable method for this, as: jquery.ajax().


    # 10.10.1 jQuery.ajax()


    The jQuery.ajax() method gives you complete control over the AJAX communication
    required, with all details that specify this data exchange in vary. With jquery.ajax(),
    you get as a direct return object of the type xhr with all the properties and
    methods thus far. It represents jQuery low-level AJAX implementation. Among other
    things, you get qualified error callbacks, but also access to character sets and
    MIME types. Most of the AJAX methods discussed so far are nothing but shorthand
    notations of a specially configured variant of this method.


    37. in earlier versions of jQuery, an object of the type XMLHttpRequest was returned.'
