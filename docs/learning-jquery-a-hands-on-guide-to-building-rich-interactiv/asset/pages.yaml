  md: 'The topic of CSS, applications can also be visually adapted via themes in the
    style of jQuery, and the plug-in contains its own themes.


    One interesting aspect of the plug-in, particularly regarding the iPhone, is that
    you can easily create innovative services without being held by the hurdle of
    the App Store.


    # 13.2 The Role System and data-role


    Let''s get back to the framework that we are devoting this final chapter. In HTML5,
    you free concentrate completely on the structure of a page and leave the design
    entirely to style sheets. In modern pages, you limit yourself to few tags as possible
    that only may describe the structure. Of crucial importance is, apart from new
    elements, the good old div element that is supported by new special blocks with
    specialized tasks or roles in HTML5. And this thought is also consistently reflected
    by the framework, although it limits itself mostly to establish elements (div).


    The Mobile jQuery framework works with a role system for elements of a web page
    to tag widgets. Via the attribute data-role, each element that is supposed to
    fulfill a particular task is tagged with standardized values. For example, as
    the you do not need to program directly when tagging a widget, as is the case
    with jQuery UI.4 You can turn a div element, for example, into a simple button
    by tagging it with the attribute and a specific value. Therefore, you do not need
    an explicit area and considering responding statement as you do in jQuery UI.
    All widgets that you want to use in the framework can be created in this way.
    You can also create page transitions, links, and pages entirely without manual
    programming via this approach.


    # 13.3 The Basic Structure of a Mobile Web Page


    The basic structure of a web page that you want to profit from jQuery Mobile will
    generally follow the same pattern. Mentioned earlier, you use the data-role attribute
    throughout the framework and explicitly in a DOCTYPE statement that you are using
    HTML as the basic. Any web page in the vocabulary of the framework can mean one
    page, but the term page generally refers to something else. It indicates a separate
    segment within the web page. The typical site structure represents each individual
    page (if there is not much content) or internally linked pages.


    In the body of a HTML file, each view or element that you want to serve as a page
    in terms of the mobile screen (normally a div element) is the attribute data-role="page".
    Within this container, you can use any HTML statements (except for the statements
    of the basic framework itself). You would usually structure this page segment
    with a separate header, content, and footer area, an idea that is also behind
    separate new elements in HTML5. These areas are in marked with specific values
    of data-role within the framework (in other words, with attributes, not with separate
    elements such as footer or header, in contrast to HTML).


    +   4. Although largely the same happens in the background as using a method of
    jQuery UI.'
