  md: '# 11


    # jQuery UI


    In this chapter, we discuss the visual control elements that the jQuery framework
    (or more precisely—an extension based on it) offers. These are summarily referred
    to as the jQuery UI. These are range of powerful interaction plug-ins that supplement
    jQuery, plus widgets for building a graphic interface that are additionally expanded
    by a Cascading Style Sheets (CSS) library with predesigned themes. the jQuery
    UI offers various extensions of the jQuery default effects. Most of these components
    are widely configurable.


    > Note

    On one hand, the components of jQuery UI are powerful and impressive. On the other
    hand, this library only offers the features currently available in all major web
    frameworks. In this respect, the familiar frameworks such as Dojo, YUI, or jQuery
    are very similar.


    Even though the features of jQuery UI are so powerful, using these designed structures
    is really simple and self-explanatory.

    Plus within the framework there are some web-based tools that make it easier to
    use. Like to put it this way: The more you get, the less you need to pay for.
    In this world, we do not need to discuss every single component in detail this
    chapter, but instead just take a brief look at the most important elements in
    addition to the basic use of jQuery UI, and then we take a closer look at a few
    selected components and approaches.


    # 11.1 What Is jQuery UI?


    The library that is summary referred to as jQuery UI offers a level of abstraction
    for interaction (as drag and drop, sorting, and selecting) and animations on a
    low-level basis. Plus you will find effective and adaptive widgets on a high level
    here; these are explicitly based on the normal jQuery JavaScript library. The
    features under jQuery UI are highly configurable and supported in most modern
    browsers. Interestingly, at the time of this writing, the browser requirements
    for jQuery UI (1.8.24) are lower than the current version of jQuery


    +   1. UI, user interface.'
  merge: -1
  pgno: 362
