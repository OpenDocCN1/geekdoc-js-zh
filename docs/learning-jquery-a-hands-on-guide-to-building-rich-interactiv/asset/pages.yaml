  md: '# 13.7 Buttons


    > Note

    Once again, to make it clearer, the fact that a page is a dialog is not determined
    in the page,

    but in the opening link. This is an unusual concept, and you really need to make
    yourself aware

    of it.


    The transitions between a page and a dialog can be specified in the same way as
    changing-

    between standard pages. The framework converts dialogs automatically if a link
    in the dialog

    is clicked. This enables you to easily create a Close button; you will need to
    place a link to the

    page from which the dialog was opened (for example, via data-rel="back" in the
    link).

    Alternatively, you can also use the close parameter in the dialog() method to
    close the

    dialog from the outside.


    +   Listing 13.8 Closing a Dialog

    $(''#myDialog'').dialog(''close'').


    # 13.7 Buttons


    While controlling web applications on the PC is strongly based on the mouse pointer,

    mobile apps increasingly use finger controls (keyword touchscreens). These make
    it much

    harder or less to hit the narrow sensitive area of a classical hyperlink in text
    form. But

    even if you control the cursor on the mobile device with special keys, the control
    is usually

    rather fiddly. This means you need to make sensitive elements bigger to comfortable

    control for the mobile user. Buttons are ideal for this purpose. In addition to
    the usual tasks

    they fulfill in PC apps, they can also largely take on the job of text-based hyperlinks.


    Buttons are just as easy to create as dialogs. You do no more than assign the
    value button

    to the attribute data-role in a link.


    +   Listing 13.9 A button

    <a href="index.html" data-role="button">Click</</a>


    Alternatively, the framework converts elements of the type input with the type

    attribute value submit, reset, button, or image into a customized button.


    > Note

    Note the conceptual difference between dialogs and buttons. Although a page that
    represents a

    dialog does not have explicit markup, the hyperlink is specifically transformed
    to a button in the

    case of buttons. (This is also the case in other widgets.)'
