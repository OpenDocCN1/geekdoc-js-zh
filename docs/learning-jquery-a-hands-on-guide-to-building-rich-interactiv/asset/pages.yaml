    # 12.1.2 Validation Plug-Ins


    Validation plug-ins have a special position in my eyes. These are plug-ins that
    validate a user input following certain rules. The plug-in that you can load at
    http://jquery.bassistance.de/jquery-plugin-validation/ is even more special. This
    plug-in is used, among others, by Microsoft Visual Studio for client-side validation,
    and in my eyes it is more than just a plug-in; you could even consider it a separate
    mini framework.'
