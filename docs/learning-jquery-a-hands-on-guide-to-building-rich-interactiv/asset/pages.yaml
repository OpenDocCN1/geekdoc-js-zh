    # 11.7 A Complete Website Based on jQuery UI


    To finish this chapter, we address a basic approach of how you could create a
    complete web page with jQuery UI. In other words, I am suggesting a possible structure
    for your web page that uses components and widgets of jQuery UI. The specific
    layout is only to be seen as a suggestion, and I highly recommend that you put
    your own ideas into practice.


    I want to construct a page that is essentially based on nested tabs with AJAX
    in the background and the accordion component. As I said, this is only one of
    many possibilities, but at least an approach that could serve as a starting point
    for you.


    Let''s look at a possible complete web page (ch11_14.html).


    # Listing 11.36 A Basic Template


    ```

    01 <html xmlns="http://www.w3.org/1999/xhtml">

    02 <Head>

    03 <meta http-equiv="Content-Type"

