  md: '# A.1 Overview of Basic Information on JavaScript 461


    parameter. As you can see, some callbacks are simply events that are triggered
    if a certain state occurs.


    > Note The event system of jQuery uses callbacks throughout (very often and consistently).


    Most callbacks offer arguments and a context. For most event callbacks, the argument
    is an event object, and the context is set to the handling element.


    # Recursive Function Calls


    JavaScript supports recursion, also referred to as recursive calls. This means
    a function calls itself again at some point of execution.


    # A.1.4 Objects in JavaScript


    Almost the entire capacity of native programming with JavaScript is based on the
    fact that you can use objects with it that offer a certain functionality. Think
    of the Document Object Model (DOM) concept. The potential of frameworks such as
    jQuery is based entirely on objects.


    To be able to use object with JavaScript, you can follow different approaches.
    Objects can be directly available to you in JavaScript. These are either standard
    objects of the runtime environment or objects that are automatically created and
    offered by the browser loading the web page as a result of the (X)HTML structure
    of the web page. The latter explicitly applies to the DOM concept. Or a library
    such as jQuery can also offer object in various ways.


    # The Constructor


    The other situation is that you have to create an object explicitly yourself.
    To explicitly create a new object instance in JavaScript from the description
    of properties and abilities of an object (class), you usually use the reserved
    keyword new, followed by the class identifier, and then a pair of brackets (with
    parameters within them, if applicable). An object declaration or constructor method
    (or constructor, for short) is also used. Using a constructor to create an object
    usually looks like Listing A.3 in JavaScript terms of syntax.


    +   Listing A.3 Using a Constructor in JavaScript


    ```

    new [object declaration]((optional parameters));

    ```


    > Note You can use a great number of default classes with JavaScript. In many
    cases, however, it is helpful if you describe certain functionalities of your
    script yourself via an object declaration. And you can also create your own constructor
    or object declaration in JavaScript, even if JavaScript is not really object oriented.'
  merge: -1
  pgno: 478
- img_proc: true
  md: "# Declarative Object Creation via an Object Literal\n\nAs an alternative to\
    \ creating an object with a constructor method, you can also create an object\
    \ declaratively in JavaScript via an object literal. Then you do not need constructor\
    \ method. This simplifies creating objects, in particular for beginners.\n\nListing\
    \ A.4 Declarative Object Creation via an Object Literal Plus Directly Initializing\
    \ Two Properties\n\n```\nvar x = {\n  name: \"Felix\", age: 11\n};\n```\n\n> Note\n\
    This variation of creating objects is the preferred option when using jQuery methods.\n\
    \nWhile you are creating the object declaratively, you simply specify all properties\
    \ and methods you want the object to have. But because you do not have a constructor\
    \ in this case, you cannot create another object from an object description, but\
    \ will instead have to describe another object, even if it is structurally identical.\n\
    \n> Caution\nNote that the object literal has a colon for assigning the value\
    \ and a comma for separating the properties. As mentioned earlier, this is declarative\
    \ syntax, not the classic value assignment.\n\n# Accessing Object Components\n\
    \nTo access components of an object, you usually use dot notation. Alternatively,\
    \ you can use array notation. This involves writing or reading properties via\
    \ data field notation. This enables using meaningful names for the indexes.\n\n\
    Listing A.5 Access via Array Notation\n\n```\nvar x = {\n  name: \"Thomas\",\n\
    \  age: 11\n}\nvar index = \"name\"\ndocument.write(x[index]); // \"Thomas\"\n\
    ```\n\nThis approach is also referred to as associative arrays. In JavaScript,\
    \ these are not directly available, but here you can see that this access method\
    \ can easily be re-created if necessary."
