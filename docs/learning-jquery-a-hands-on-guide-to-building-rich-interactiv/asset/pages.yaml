    All methods return an object of the type jquery as return value.


    Table 8.1 describes the event helpers offered by jQuery.


    | Table 8.1 The jQuery Event Helpers |

    | Name | Description |

    | blur() | Without parameters, calling the method means triggering the blur event
    (exiting an element) for each matching element. With a parameter, the event helper
    binds a function to the blur event for each matching element. |

    | change() | Without a specified parameter, calling the method represents triggering
    the change event (changing an element; for example, a input field) for each matching
    element. With a parameter, the event helper binds a function to the change event
    for each matching element. |

    | click() | Surely one the most important event helpers supports the click on
    an element. Without a parameter, this means triggering the click event for each
    matching element. With a parameter, the event helper binds a function to the click
    event for each matching element. |

    | dblclick() | Although the double-click does not have tradition with classic
    web applications, the double-click will probably play a bigger role in rich Internet
    Applications (RIAs). After all, it is desirable for RIAs to behave like desktop
    applications. This jQuery helper for an event serves for triggering the dblclick
    event for each matching element. With a parameter, the event helper binds a function
    to the dblclick event for each matching element. |

    | error() | Without a parameter, calling the method represents triggering the
    error event for each matching element, so it represents an error that has happened
    (for example, requesting data or resources). With a parameter, the event helper
    binds a function to the error event for each matching element. |

    | focus() | Without specifying a parameter, calling the method is equivalent to
    triggering the focus event (getting the focus; for example, for a button or an
    input field in a form) for each matching element. With a parameter, the event
    helper binds a function to the focus event for each matching element. |'
