  md: '# Chapter 8 Event Handling Under jQuery


    die() and undelegate()

    To remove a event from the event system, you should use the die() method. This
    method was also introduced in jQuery 1.3 as a counter to the method live(), and
    it simply removes a bound live event. As optional parameters, you again specify
    the type and the callback function. Without a parameter, all live events are removed.
    If the type is specified, all live events of the specified type are removed. If
    you specify a function as a second parameter, only the specified event handler
    is removed. If you are working with delegate() instead of live(), you can unbind
    correspondingly with undelegate().


    # 8.5.6 Auxiliary Functions for Interaction


    The jQuery framework offers two interesting auxiliary functions to support common
    interaction techniques.


    The hover() Function

    As the indicates, the hover() function mimics the usual hover effect that enables
    a reaction to reaching the area of an element with the mouse pointer and exiting
    this area. As a parameter, you specify two function references. This gives you
    more options than just changing the CSS properties of an element (which you can,
    of course, do as well).

    Whenever the mouse pointer moves over a matching element, the first specified
    function fires. If the mouse pointer enters that area, the second specified function
    fires (ch8_7.html).


