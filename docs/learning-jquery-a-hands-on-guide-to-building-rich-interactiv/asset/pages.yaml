  md: "# A.1 Overview of Basic Information on JavaScript\n\n# Caution\n\nIn JavaScript,\
    \ other data types can also represent Boolean values, in contrast to stable professional\
    \ or type-secure languages as Java or C#. For example, an empty string or the\
    \ numeric zero are interpreted as false; correspondingly, other values are interpreted\
    \ as true. But an object can be interpreted as false. It always represents true.\
    \ The latter is often used in messy programming for browser sniffing. (It is used\
    \ to test whether an object is available; if it isn't available, it is interpreted\
    \ as false.)\n\n# A.1.3 Functions and Methods\n\nFunctions and methods involve\
    \ placing one or more instructions into a block (or subroutine) that gets a name\
    \ or identifier. An important aspect in JavaScript is that forming a subroutine\
    \ protects certain command steps from being executed when loading a script within\
    \ the web page. This would otherwise be the case if you simply write statements\
    \ in a <script> area of the web page, due to the sequential processing. Often,\
    \ this is neither desirable nor appropriate. If only certain conditions exist\
    \ (for example, if the user clicks somewhere, leaves the web page, or finishes\
    \ entering data) will the function or method be called via its identifier and\
    \ the command sequence executed. But last not least, forming functions enables\
    \ you to create libraries, which use the jQuery library.\n\nYou can define functions\
    \ and methods by introducing the declaration with the JavaScript keyword function,\
    \ followed by the identifier of the function or method, and finally a pair of\
    \ parentheses () which you can pass any required parameters to the function. These\
    \ are variables that can be used locally in the function. If you need several\
    \ parameters, they are separated by commas in the brackets. The block of instructions\
    \ enclosed in pointed brackets, without a preceding semicolon. Optionally, you\
    \ can specify a return value by the keyword return.\n\nListing A.1 shows a typical\
    \ declaration of a function or method in JavaScript.\n\n# Listing A.1 A Typical\
    \ Function Declaration\n\n```\nfunction [function identifier]([optional parameters)]\
    \ {\n..any statements\n  return [return value];\n}\n```\n\n> Note\nFor experts,\
    \ a function in JavaScript becomes a method purely by being anchored via this\
    \ and a function reference in the object declaration of a type or an anonymous\
    \ notation in the constructor. Note that in the first case it can still be called\
    \ as pure function (without a preceding object), which is not possible in strictly\
