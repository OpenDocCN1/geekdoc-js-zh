  md: "# Chapter 13 jQuery Mobile\n\nline. The footer concludes the page. It is quite\
    \ convenient to add a horizontal navigation or subdivision in these areas. The\
    \ framework contains a navigation bar widget (data-role=\"navbar\") for this,\
    \ to change an unsorted list with links to a horizontal bar with buttons. To set\
    \ one of the links as preselected (active), you add class=\"ui-btn-active\" to\
    \ the anchor element.\n\n# Listing 13.16 A Navigation Bar with a Preselected Register\n\
    \n```\n<div data-role=\"footer\">\n<div data-role=\"navbar\">\n  <ul>\n    <li><a\
    \ href=\"http://rjs.de\"\n      class=\"ui-btn-active\">Home</a></li>\n    <li><a\
    \ href=\"http://rjs.de\">Blog</a></li>\n  </ul>\n</div>\n</div>\n```\n\n> Tip\n\
    Navigation bars are also suitable for nesting elements, provided this is appropriate\
    \ on the small screen.\n\nPositioning of the header and footer areas is done inline\
    \ in the default setting. This means that these elements are in the normal flow\
    \ of the web page. The advantage is that they are then visible on practically\
    \ all devices (because it's independent of positioning via JavaScript/CSS). The\
    \ elements are simply arranged in accordance with the available space. This is\
    \ an advantage, particularly in the context of the many different resolutions\
    \ in the mobile environment.\n\nIn some cases, fixed positioning can also be appropriate.\
    \ In that case, the toolbars stay in positions at the beginning and end of the\
    \ screen area the user scrolls. To have more room for the actual content when\
    \ required, the framework ensures that tapping/clicking the scroll toggles the\
    \ visibility of the toolbars. To achieve this behavior, you specify data-position=\"\
    fixed\" for the container of the toolbar.\n\n# Listing 13.17 A Fixed Footer\n\n\
    ```\n<div data-role=\"footer\" data-position=\"fixed\">\n<a href=\"http://rjs.de\"\
    \ data-role=\"button\">(c) www.rjs.de</</a>\n</div>\n```\n\nThere is also full-screen\
    \ position (data-fullscreen=\"true\") that behaves like the fixed position, except\
    \ that the toolbars are only displayed if the page is clicked."
