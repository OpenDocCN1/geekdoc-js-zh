  md: '# Tip


    At https://docs.jquery.com/Plugins/Validation, you will find complete documentation
    plus numerous examples. Because of space limitations here, this text provides
    only a very brief overview of what this plug-in can offer.


    Validation or checking the plausibility of user input is one of the most important
    ways of JavaScript. Checking the plausibility of a web form verifies whether the
    user input makes sense before the data is sent. If it does not make sense in accordance
    with the preset data, measures are taken to correct this. Since Dynamic Hypertext
    Markup Language (HTML) and Asynchronous JavaScript and XML (AJAX) are now widely
    used, the input is sometimes also checked immediately after the user enters an
    input field or sometimes directly after entering a character. The whole procedure
    is rather complicated, and the important point is not the programming itself.
    Validating a web form is only useful as a concept that has to also include the
    data after sending and various other factors. When validating a web form, you
    have to be aware of numerous potential problems. These can be summarized with
    a few general questions:


    +   - What needs to be validated? You will need to create rules that will be reflected
    in the plug-in via options.

    - Which dependencies exist between user input and form fields?


    +   - How does it need to be validated? This includes questions as whether it
    is sufficient for a field to be filled in (a required field) or if the content
    has to have a specific form (for example, it must be numeric)? This also needs
    to be explicitly set out in rules or more precisely assigned methods.


    +   - When will it be validated? For example, you check the user input directly
    on an input field or when the form is sent? Or on leaving a web page, if the data
    is collected across several web pages before it is sent to the server?


    +   - When and how will it be validated? On the server or on the client? Or redundantly
    in both places? Mostly, a redundant check is indispensable, and we are concentrating
    exclusively on the client-side in the context of jQuery.


    As you can see, you have much to think about in the context of a validation concept.
    The task of weighing the required checks against the difficulty of implementing
    them in practice and the effort involved is not at all easy. In any case, planning
    a web page with user interaction plus a plausibility check invariably takes a
    lot more time than eventually putting it into practice.


    Ultimately, it is up to you to react when the user enters the wrong information.
    Usually, you will want to prevent the form data being sent until the error is
    corrected, and it makes sense to give the user appropriate feedback to that purpose.
    And for providing this feedback, there are again certain jQuery techniques or
    jQuery UI widgets that are particularly well suited to the task.


    3. But the latter is rarely appropriate.'
