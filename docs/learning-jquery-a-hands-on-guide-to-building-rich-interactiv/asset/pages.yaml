  md: '# 1.4.6 The Development Tools


    As backbone of RIA, as any website, you will mill always be using an HTML or XHTML
    frame. for creating the HTML source text and for all other techniques you use
    such as CSS, JavaScript, and so on, the minimum is a pure text editor, as included
    with any operating system.


    In practice, though you will probably use more powerful programming tools that
    support you in creating and analyzing the source text. Such programs know some
    components of a programming or description language (such as HTML, CSS, or JavaScript)
    and support simple and sometimes even more complex standard structures, such as
    masking (the coded representation) of special processes, inserting source code
    templates, and aids for providing greater clarity by color-coding known commands.
    Some editors also offer the commands of a used language directly, which means
    the programmer can use menus or toolbars to choose them (with the mouse). Notepad++
    (http://notepad-plus.org/), for example, is an excellent editor offering this
    kind of support.


    Another feature offered by some programs is different document views. This is
    often the case with pure HTML editors. You then have the choice of switching between
    the preview of a website (as it will look in the browser), a graphic editing mode,
    and above all a view of the HTML code itself.


    Even in web programming, you can now make use of some proper integrated development
    environments (IDEs). These allow programming and executing from an integrated,
    common interface. A free yet very powerful IDE is Aptana (http://aptana.com/).
    It is based directly on the powerful development environment Eclipse (http://www.eclipse.org/).
    Aptana offers a source code editor and has many features to directly support JavaScript,
    HTML, and CSS plus to the DOM object model and even an AJAX itself. The Code Assist
    tries to autocomplete various user inputs, and syntax is marked with syntax highlighting
    (highlighting key terms and syntax structures in different colors). The option
    of displaying the properties and methods of objects is particularly interesting.
    The program even offers a debugger for JavaScript. Aptana also contains its own
    little web server (Jetty), which you can test an AJAX application without installing
    an independent web server. If you create a project with Aptana, you will see that
    various popular JavaScript libraries are already integrated, among others jQuery,
    although there are usually most recent versions available on the Internet.'
  merge: -1
