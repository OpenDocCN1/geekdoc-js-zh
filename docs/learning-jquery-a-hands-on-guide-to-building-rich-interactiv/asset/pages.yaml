  md: "# 6.14.1 The end() andSelf() Methods\n\nFor the sake of completeness, I want\
    \ to mention two other methods to conclude this chapter, but I do not consider\
    \ them quite important. Most methods in jQuery for selecting or filtering-elements\
    \ operate on an instance of a `jQuery` object and produce a new instance if they\
    \ encounter a diverging set of DOM elements. In this situation, it is like writing\
    \ a new set of elements onto the stack. So, if you still need these older elements,\
    \ you can use end() to get them back from the end of the stack. But as I said,\
    \ this method is very specific, and I do not think you will need it often.\n\n\
    andSelf() method belongs to the same category. If a jQuery method has written\
    \ a new set of elements to the stack, you can use this method to fetch back the\
    \ previous set of elements.\n\nLet's assume you have the following structure.\n\
    \n+   <ul>\n  <li>Ice Cream/</li>\n  <li>Beer/</li>\n  <li>Candy/</li>\n  <li>Chocolate/</li>\n\
    \  <li>Peanuts/</li>\n</ul>\n\nNow we want to format all list entries from the\
    \ third list item onward. We do it like this:\n\n# Listing 6.63 Formatting from\
    \ the Third List Item Onward\n\n```\n$function() {\n$('li:eq(1)').nextAll().css({\n\
    \    'background-color': 'red',\n    'color': 'yellow'\n  });\n});\n```\n\nOr\
    \ this is another alternative.\n\n# Listing 6.64 Formatting from the Third List\
    \ Item Onward Using andSelf()\n\n```\n$function() {\n$('li:eq(2)').nextAll().andSelf().css({\n\
    \    'background-color': 'red',\n    'color': 'yellow'\n  });\n});\n```"
