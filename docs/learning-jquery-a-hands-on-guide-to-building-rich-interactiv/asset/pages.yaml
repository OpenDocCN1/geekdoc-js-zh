  md: '# 6.11.3 Siblings


    Finding elements via relationships in the tree is possible with a few methods
    beyond the parent-child relationship. These methods basically can be applied in
    the same way as children() or parent(), so we discuss them briefly here. These
    are sibling relationships; in other words, we are specifically looking for elements
    that are on the same level as the element.


    The next() method returns a jQuery object with the next direct sibling of an element
    or the next direct siblings of a group of elements that follow the basic element.
    The nextAll() method works almost the same, but all sibling elements after the
    current element are returned.


    You also get the direct preceding the current element with prev() and all sibling
    elements preceding the current element with prevAll().


    With siblings(), you get all siblings before and after the current element or
    group of elements.


    > Tip

    With an optional filter expression as a parameter, you can limit the selection
    for all methods, as described earlier.


    # 6.48 Sibling Relationships (ch6_20.javascript)


    ```

    ...

    08 <script type="javascript">

    09  src="lib/ch6_20_ready.js"></script>

    10 </head>

    11 <body>

    12 <div>

    13 <h3>Tiger, burning bright!</h3>

    14 <h3>In the forests of the night</h3>

    15 <h3>What immortal hand or eye?</h3>

