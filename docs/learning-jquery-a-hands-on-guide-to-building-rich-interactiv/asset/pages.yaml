    # 7.6 Inner and Outer Dimensions


    With many visual elements in web pages, certain elements often influence the space
    the element requires beyond the "natural" size of the element. In particular,
    this concerns the margin (margin), border (border), and padding (padding).¹⁵ So,
    you also need to take the inner and outer dimensions of an element into account.
    This is the classic block model.


    With inner(), you get the inner height of the first matching element (without
    the border, including the padding), and with innerWidth() the corresponding inner
    width. And outerHeight() gives you the outer height of the first matching element
    (including the border and padding), and outerWidth(), accordingly, gives you the
    outer width of the first element. You can use an optional Boolean parameter for
    the outer dimensions to specify whether the margin should be taken into account.
    (If yes, specify true; no parameter false).


