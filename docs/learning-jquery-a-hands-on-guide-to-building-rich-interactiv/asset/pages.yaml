  md: '# Access Verification as a Specific Example


    As a specific example, we want to program the following situation: We are creating
    an AJAX application that verifies the user login for a closed area of a web application(access
    verification or access control). To do this, we use a web form with a one-line
    input field and a password-field. In addition, the web page requires a button
    so the user can log in. This click is to trigger the AJAX request.


    But we do not want to send the data of the web form to the server in the conventional
    way; instead, we want to use an AJAX request. Depending on whether the access
    data is correct or not, the user can use a different response in a section of
    the web page. We want the server response to be displayed without reloading the
    web page. This is, after all, an essential criterion of AJAX and distinguishes
    our application from a traditional web application that would display the web
    response in a completely new web page.


    For the button in the web form, you therefore cannot work with a submit button,
    but instead you have to use a normal button or a link that does not send the data
    of the web form submit. You must prevent this "normal" sending of the form data.
    Otherwise, a new web page is requested. Also, the normal data for action and method
    is written not in the form but in AJAX methods.


    > Tip

    Server-side, you can, of course, store the access data hard-coded in the script
    or program that you call via AJAX. A database table access is more sensible. If
    you are working with XAMPP, you use MySQL and the administration tool phpMyAdmin.
    You can create such a table with phpMyAdmin in a MySQL database. This table has
    to contain at least two fields, one for the user ID and one for the associated
    password. You have to check for both pieces of data. Note that the combination
    of the two values always has to match. You can find the SQL script for creating
    such table on the companion website (ch10.sql).


    Let''s now see what the web page with the AJAX functionality looks like. For this
    example, we need a slightly different structure than in most other examples in
    this chapter (ch10_3.html).


    # Listing 10.7 Web Page for Verifying User Input via AJAX


    ```


    <script src="lib/ch10_3_ready.js"></script>

