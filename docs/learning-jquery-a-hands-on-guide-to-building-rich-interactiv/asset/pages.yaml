    # 4.6 Creating an Element with jquery() and Inserting It into the Web Page


    Interesting possibility for jQuery() and $() is the creation of DOM elements on-the-fly.
    These can then be dynamically and reliably inserted into a web page. Internally,
    you use either .html() or the property innerHTML, depending on the element type.
    But you need not worry about exactly how this works. After all, the essence of
    a framework such as jQuery is that these things stay hidden from the programmer
    and all that they work reliably in all supported browsers and save you the trouble
    of adapting to various browsers and different element types.


    You should not overlook that an element you want to create and insert, of course,
    has to fit into the context. For example, you cannot insert a body element into
    a div container. Also the entire HTML content has to be well formed. You cannot
    rely on the principle of error tolerance, as you would usually with pure HTML.
    In particular, you must ensure that you correctly close the elements to be created.
    For example, an instruction such as `<span>` will not work in some browsers, whereas
    the correct XHTML syntax `<span></span>` works fine.


    > Tip

    Optionally, you can specify a second parameter a document where the new element
    is created (the context).


    Now, creating an element does not mean that it has already been added to the web
    page. You can do this for example, with the jQuery method appendTo().'
