  md: 'Unlike methods of jQuery, methods for creating components and widgets cannot
    be chained via dot notation. The individual objects are too complex and in general
    it will make little sense.


    When creating a component or widgets with the default setting, you use the corresponding
    method for creating without parameters.


    Several UI widgets should be applied to div elements. This will result in fewer
    spillover effects from HTML.12 as possible. Where necessary, methods adapt the
    elements in the background. Usually, however, you can use other basic elements,
    although this is not recommended.


    +   Widgets explicitly use the default CSS files on download with the ThemeRoller
    tool. You generally create the CSS files on demand if you want or to make individual
    changes,13 there is a CSS file for each widget that starts with jquery.ui followed
    by the name of the relevant widget (for example, jquery.ui.slider). In it, you
    will find the classes that you can customize with an editor and start with ui-[name
    of widget/super-class] (for example ui-slider, ui-slider-horizontal, ui-widget,
    ui-widget-content, and ui-corner-all). You can also view these classes explicitly
    in Firefox if you analyze the generated code of a widget.14 For more details,
    refer to the description of each widget under the Theming tab. But of course,
    you can also influence the widgets and components with custom CSS rules.


    # 11.4.3 Properties/Options of Components


    As you have already seen in the first example, using the UI components of jQuery
    is often easy. If you are happy with the default settings, you can manage with
    just a single line of code. If you want to adapt components, you just need to
    override the desired properties or options. This gets us to the fact that you
    need to know which options a specific component offers. We could now list and
    describe these properties for all UI components, but I consider this superfluous
    because you can find it for each at http://jquery.com/demos/. You just click the
    Options tab and then you can see at a glance which options can be specified for
    a component or widgets. You just need to specify the desired options for the relevant
    component or widget when you create the component.


    12. For example, for a dialog, button, progress bar, or slider.


    13. But this should rarely be necessary.


    14. There will also find the information required for identifying those classes
    that you might want to apply to nonwidgets to achieve a more uniform design.'
