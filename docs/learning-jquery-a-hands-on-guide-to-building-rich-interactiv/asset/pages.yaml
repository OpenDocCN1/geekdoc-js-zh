    # 13.10.4 Sending the Form Data


    In jQuery, sending form data will be done via AJAX when possible. But the resulting

    data can be saved as bookmarks through appropriate background actions of the framework
    if

    t data is sent via GET. The URL is modified accordingly when the data arrives.


    # 13.11 Special Events


    The Mobile framework provides support for a number of special events. These are
    created based

    on native events but are not completely available on all mobile devices. The events
    can be used

    as usual with bind() and live().


    # 13.11.1 Touch Events


    Table 13.2 describes the events that are particularly geared toward different
    kinds of touch

    touchscreens.


    | Event | Description |

    |---|---|

    | tap | A tap is a quick, complete touch |

    | taphold | Touch and hold |

    | swipe | Horizontal drag of 30 or more pixels and less than 75 pixels vertically
    within

    a second |

    | swipeleft | A swipe event to the left |

    | swiperight | A swipe event to the right |


    # 13.11.2 Orientation Change


    Many mobile devices react to whether you are holding them horizontally or vertically.
    This, of

    course, triggers an event to which you can react.'
  merge: -1
  pgno: 465
