    | Name | Type |

    | :button | An array with all buttons (the element button and input elements of
    the type button) |

    | :checkbox | An array with all input elements of the type checkbox |

    | :file | An array with all input elements of the type file |

    | :image | An array with all input elements of the type image |

    | :input | An array with all input elements (all form elements of the type input,
    textarea, select, and button) |'
