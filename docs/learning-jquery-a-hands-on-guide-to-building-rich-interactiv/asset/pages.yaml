    when a user enters characters into an input field.


    In the default version, the method works with a JavaScript array that provides
    the acceptable values to be automatically suggested. However, the widget is highly
    configurable and can manage with various data structures. These can also be loaded
    via AJAX from the server and be offered both in JSON and XML. We are only going
    to take a brief look at a variation in the default configuration (ch11_8.html).


