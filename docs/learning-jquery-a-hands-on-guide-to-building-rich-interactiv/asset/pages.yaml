  md: 'If the value of the referenced cell changes in any way, all other expressions
    that are bound to it change in the way that the binding rule (the formula) prescribes.
    This happens without delay and without the updating to be triggered manually.


    # 8.1.8 Trigger


    For reacting to certain events, there is also the mechanism referred to as trigger.
    This is fired for events that result from data modifications. In contrast to data
    binding, you can also include complex statements in the body of a trigger. This
    block is executed every time the specified event occurs. Triggers are useful if
    the code you want to execute for a value change in a variable is flexible or complex.


    # 8.2 The Event Object in jQuery


    As the warnings and comments in this chapter have made clear, the native working
    with the event object is much less than sensible programming if you want to support
    more than just one browser. Plus there is a whole range of techniques for dealing
    with events. Fortunately, jQuery encapsulates the problem and standardizes the
    syntax. The jQuery event system normalizes the event object via jquery.Event (including
    the names of the available properties and methods) corresponding to the W3C standards
    and ensures standardized handling in all supported browsers. In particular, this
    guarantees the event object is passed on reliably to the event handlers.


    # 8.2.1 The Constructor of jQuery.Event


    The constructor of the event object in jQuery is open and can be used in any form
    by triggers. As a parameter, you specify a jQuery event handler.11 Remarkably,
    you can also create an object with the constructor without using the new operator.
    Or you can use new if you want. The result is the same. You get an event object
    of the type jQuery.Event.


    +   Listing 8.5 Creating a New Object of the Type jQuery.Event Without Using new

    var e = jQuery.Event("click");


    The following syntax works exactly the same.


    +   Listing 8.6 Here, We Use new

    evar e = new jQuery.Event("click");


    > 11. Not a classic event handler that starts with on. In jQuery, these are also
    referred to as event helpers. More on this later.'
