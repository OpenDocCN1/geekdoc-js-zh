    matching element in pixels. If you specify a numeric parameter instead, however,
    you are setting the height or width of the element.


    > Tip

    As in pure HTML, you only need to specify either the height or the width of an
    element. The corresponding property is usually scaled automatically by the browser.
    The reduced specification of only one property is by no uncommon. On the contrary,
    specifying both values can cause distortions, an effect that you might, of want
    want intentionally in some cases. If you are manipulating only one property, however,
    you need to ensure that the other property is really "clear.\ Certain measures
    such as applying certain jQuery methods can have specified both the height and
    the width in the background. Or dimensions may have been'
