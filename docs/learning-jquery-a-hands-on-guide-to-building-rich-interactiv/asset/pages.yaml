  md: '# Chapter 12 Plug-Ins


    Table 12.3 Methods of the Plug-In

    | Method | Description |

    |---|---|

    | validate(options) | The already used validation of a form. Returns a Boolean
    value indicating whether the checked form is valid. |

    | rules() | Returns the validation rules of the first selected element. |

    | rules("add", rules ) | Adds the specified rules and returns all rules of the
    first matched element. Such a rule could, for example, be as follows: `("name").rules("add",
    { minlength: 5 });` The requirement is that the parent form has been previously
    checked with validate(). |

    | rules("remove", rules ) | Removes the specified rules and returns all rules
    of the first matched element. |

    | removeAttrs(attributes) | Removes the specified attributes of the first matched
    element and returns these attributes. |


    Let''s output the options that describe the rules for the email fields in the
