  md: '# 8.5 Expanded Methods for Event Handling


    # 8.5.3 The trigger()


    To the trigger(), you pass as a parameter the event and the desired data that
    you want to trigger “manually”.⁴ Using triggers in jQuery is linked to the default
    reaction of the browser for a specific event that you have specified elsewhere
    or is automatically triggered by the browser. If you call the trigger() method,
    this calls the default reaction of the browser that has the same name as function.
    For example, if you pass ''submit'' on to trigger(), this forces the browser to
    send data¹⁵ if you set off the trigger in a form.


    > Tip

    The triggered events are not limited to browser-based events. You can also use
    adapted events. Remember, that with triggers the implementation has changed in
    the different versions of jQuery. So, if you are changing over previous versions,
    take a look at the documentation to see whether any changes have been made (Mostly
    these are very specialized details).


    The event handlers of an element get a normalized object when a trigger is set
    off, without any browser-specific attributes as keyCode, pageX, or pageY.


    For triggers, you can specify the type of an event in three different ways:


    +   - You can specify the name of the event as string.

    - You can use an object of the type jquery.Event. If you do this, you can pass
    data to this object and this data will recall the triggered handlers.

    - You can pass a literal object with data. This is copied into a real object of
    the type jQuery.Event. In this case, you need to specify a type attribute.


