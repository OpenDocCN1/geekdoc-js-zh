    # 13.5 The Transitions


    The jQuery Mobile framework currently has CSS-based transition effects between
    pages or objects that you assign for a page change event or to display a new element.
    In the default setting, transitions are carried out from right to left. If you
    want to change this, you can use the attribute data-transition for the link that
    triggers the transition.


    ```

    Listing 13.6 Explicitly Specifying the Transition Effect

    <a href="index.html" data-transition="pop">Home</a>

    ```


    > Caution

    Transition effects make massive use of CSS3 and are not fully supported by some
    older platforms. In this case, the new content is simply displayed immediately.


    Possible values are slide, slideup, slidown, pop, fade, and flip. You know these
    transitions from the animation effects of jQuery itself and jQuery UI.


    > Tip

    You can specify the same transition for the way back via data-direction="reverse".


    # 13.6 Dialogs


    Dialogs are also generated in the framework in the simplest way via attributes.
    You merely need to specify data-rel="dialog" in the link to a new page or a new
    page segment. The framework automatically ensures that the new content is displayed
    in a “dialog window” with rounded corners and appropriate spacing. These dialogs
    are generally created as modal in the framework and during the display the background
    is darkened and the application is paused.


    ```

    Listing 13.7 Opening a Dialog

    <a href="dialog.html" data-rel="dialog">New Dialog</a>

    ```


    8. The double notation makes sense because that way you ensure in some not fully
    compatible platforms for jumping back still works.'
