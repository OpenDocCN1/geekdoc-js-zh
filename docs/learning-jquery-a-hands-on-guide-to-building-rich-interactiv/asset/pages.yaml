    # 4.5.2 Placing document.ready() into an External JavaScript File


    If you look at the structure of the examples we have used up to now, you will
    see that the JQuery library was integrated as an external JavaScript file, but
    calling the functions and methods (including document.ready()) took place in an
    internal script container. For our examples, this is usually convenient in terms
    of description, but not obligatory. You can separate structure and function completely
    and remove these to an external file as well. In fact, this is highly recommended
    as a general rule in practice. But then you have to provide the reference to the
    JavaScript file with calls after the reference to the JQuery library.


    > Note All JavaScript files combined within a web page, as well as the internal
    script containers and inline scripts, share a common global namespace. That is
    why the framework has its own namespace jquery within its functionalities. This
    means that in a script container you can access all components of an external
    JavaScript file, but you can also access components of another external JavaScript
    file from one within another (the order is observed).


    Such an external JavaScript file then consists of only one or more calls of document.ready()
    in any permitted notation. Other calls beyond this should, of course, be avoided
    in any case if you are assuming a completed DOM. If required, you can write down
    additional declarations in the external JavaScript file. I would even remove these
    in larger projects and modularize the project even more; the same with all calls
    of functions loading the site that are not (for whatever reason) supposed to be
    packed into the protected area of document.ready().


    > Note If you are using style sheets in your web page, all style sheets should
    be integrated before the scripts. In particular, the integration should take place
    before the ready() methods are called. If you do not do this, it can cause problems
    in some browsers.


    # 4.5.3 Example of Creating a Basic Structure for a Modularized jQuery Web Application


    Let''s look at a complete example that shows a practical web application structure
    that attempts to work with jQuery consistently (ch4_7.html).'
