    # 10.1.5 The Data Format in an AJAX Communication


    If the client requests data from the web server via AJAX, the web server always
    sends plain text10 as a response (as you saw in the first example). This plain
    text can be generated by a server-side script or program (as in Java, PHP, or
    ASP.NET) or can be present as a text file on the server.¹ completely unstructured
    or have various internal structures. For structured text, a specific MIME type
    is usually specified in the HTTP header, but it remains completely irrelevant
    whether the plain text is generated by a script or program on the server or already
    present as a finished file.


    In practice, four variations of transfer formats have become established, and
    these are also reflected in different AJAX methods in jQuery:


    +   - Plain text without any structure.


    +   - Plain text with HTML tags; in other words, HTML fragments. These can even
    contain scripts, although some browsers do not execute the scripts that are loaded
    with this approach.


    +   - XML.


    +   - JSON.


    If pure text or plain text with HTML tags is sent by the server, this is usually
    integrated via Dynamic HTML (HTML) or jQuery) into the web page in the server,
    mostly without further processing of the response in the client. The response
    by the web server is displayed mostly unchanged and has to be put into its final
    form beforehand on the server—in other words, the form you want to use in the
    client. In many AJAX applications, this will suffice.


    > CautionnIf you send HTML via AJAX, this will only be a fragment. You should
    not reload an entire page via AJAX.


    You will be able to create more demanding applications if you expand the server
    response by a structured format that can be used in a targeted way in the client.
    Structuring the transmitted information gives you more options for distributing
    business processes. A structuring format in AJAX, there is usually only JSON or
    XML, as mentioned previously. So, if the web server sends XML or JSON, you can
    operate on the response in the client and move business logic to the client.


    10. No multimedia data such as images or other binary data; that has nothing to
    do with AJAX.


    11. It does not matter exactly how the web server generates the response.'
