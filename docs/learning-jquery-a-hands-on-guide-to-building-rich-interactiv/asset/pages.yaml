  md: "# Function Call Versus Function Reference\n\nLet's move on to the difference\
    \ between calling a function and function references. If you have declared a function,\
    \ this has to be called to come to life. But how? One is through a function call.\
    \ In general, such function call takes place if you write the identifier of the\
    \ function followed by a pair or brackets where you place any required values\
    \ you are passing as parameters. A function call ends with a semicolon; as for\
    \ a JavaScript statement in a script. When this point of the script is processed,\
    \ the function is executed.\n\nIn contrast to a call and purely in terms of form,\
    \ a function reference does not have any brackets. This is only a reference to\
    \ the function; it does not call the function. So, the question with function\
    \ references is: When is the referenced function executed? The easy answer is\
    \ this: Function references are usually combined with event handlers that call\
    \ the reference if a specific event occurs.\n\n# Function Arguments: arguments\n\
    \nAs mentioned previously, you can pass any values or parameters to a function.\
    \ Within a function, there is a special variable with the name arguments. This\
    \ is always available and contains specific information about the parameters.\
    \ In particular, information about the number, because for an array there is a\
    \ length property.\n\n# Named Versus Anonymous Function\n\nWhen declaring a function,\
    \ you can (but do not have to) omit the function name. This is referred to as\
    \ an anonymous function (as opposed to a named function).\n\nAn anonymous function\
    \ declaration is appropriate if it only has to be available at this point. Then\
    \ you do not need a function identifier either. Such an anonymous function can\
    \ be assigned to a variable or passed to a method.\n\n# Listing A.2 An Anonymous\
    \ Function as a Parameter of a Method\n\n```\n$(\"toggle\").click(function({\n\
    \  $(\"img\").attr(src\":\"http://rjs.de/bilder/ducky.gif\");\n});\n```\n\n> Note\
    \ jQuery works intensively with anonymous functions. Both in the application programming\
    \ interface (API) and also if you are creating your own scripts with jQuery.\n\
    \n# Callbacks\n\nA callback function, or callback for short, is a JavaScript function\
    \ (with or without return value) that is passed to method argument or option.\
    \ This is exactly what we can see in the preceding example with the anonymous\
    \ function that is passed to the click() method as a"
