  md: "notation in the document.ready() method can also be significant if you expect\
    \ things too\nearly early that are only declared further down.\n\nMore serious\
    \ when using hierarchy specifications is that you have to be careful certain\n\
    things might not work as you would probably expect. And in some cases it is not\
    \ intuitively\nclear why. For example, you can specify a selection of a div element\
    \ in a paragraph and basi-\ncally also rules for a paragraph in a div element.\
    \ But in the later case it can happen that the\nselector does not seem to work.\
    \ Yet speaking, it is not the selector or jQuery that is\nlimited or has an error;\
    \ instead, you have to watch out for how the browser renders the DOM\ntree.8 You\
    \ can see that very clearly in Firebug.\n\nTake a look at the following file ch5_9_error.html.\n\
    \n# 5.10 A div Element in a Paragraph\n\n```\n```html\n<script type=\"text/javascript\"\
    >\n$(function() {\n  $('p div').css(\"background\", \"red\");\n});\n</script>\n\
    </head>\n<body>\n<p>\nMany thanks.\n<div>\n  I look forward to hearing from you.\n\
    </div>\n</p>\n</body>\n</html>\n```\n```\n\nIf you try the example, the assignment\
    \ of the CSS rules is not going to work. The reason is\nthat the paragraph and\
    \ div container are no longer nested in one another in the actually\nrendered\
    \ DOM (even though you have nested them in the HTML—but the standard does not\n\
    permit this). In the paragraph, there is only the text, and the div container\
