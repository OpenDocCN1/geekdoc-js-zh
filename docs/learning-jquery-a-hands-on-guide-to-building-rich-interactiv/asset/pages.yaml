    # 8.5.4 triggerHandler()


    The triggerHandler() method is very similar to the trigger() method. It, too,
    executes all connected event handlers of elements for a specific event type. The
    important difference with trigger() is that this method neither passes the default
    action of the browser passes the event object to parent elements via the bubble
    phase, nor executes any live events (see next section).


