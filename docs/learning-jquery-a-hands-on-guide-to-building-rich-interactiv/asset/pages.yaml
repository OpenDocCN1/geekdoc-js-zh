  md: "# 444 Chapter 13 jQuery Mobile\n\nThe form elements should be enclosed in the\
    \ usual <form> container.\n\n> Caution\nIf you are working with IDs in forms (or\
    \ other elements), ensure that these are unique in the web page. This rule is\
    \ somewhat blurry due to the option of structuring several pages within a web\
    \ page. But even then, the IDs should be unique across the whole page.\n\nFundamentally,\
    \ all form elements are assigned a dynamic width to adapt to varying screen sizes.\
    \ The arrangement between different elements can also differ depending on screen\
    \ width (above or next to one another).\n\n# 13.10.1 Field Containers\n\nTo ensure\
