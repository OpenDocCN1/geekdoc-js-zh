    instead of rsedv, you can use any Twitter alias whose tweets are publicly accessible.


    This example is somewhat complicated because we operate explicitly on the structure
    of the Twitter tweets. We cannot and are not going to discuss this structure in
    detail here. But, of course, I will explain the specific structures that we are
    using in this example. These are also the most important keys that occur in the
    JSON format.


    In the JSON format of Twitter, there is a key with the name text. As you can probably
    guess, it contains the text of the relevant tweets. There is also a key with the
    name created_at. This takes you to the creation date of the relevant tweet. In
    lines 38-49, we use each() to iterate over all tweets that we have received via
