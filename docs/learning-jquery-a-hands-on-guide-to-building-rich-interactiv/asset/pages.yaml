  md: '# 7.3.1 Determining the Position with position()


    Via the position() method, you determine the top and left values of an element
    relative to its offset parent element, for elements positioned via CSS and those
    that are simply arranged in the text flow by the browser. This means that the
    positioning data in pixels is always to be in relation to the top-left corner
    of the surrounding offset parent element. In many cases, the offset parent is
    the web page itself (the DOM object document), but it can also be a div element
    or another container object that the child element is contained in.


    But (as you probably know) this first element has to be explicitly turned into
    an offset element,10 for example, by absolutely positioning it (as shown in the
