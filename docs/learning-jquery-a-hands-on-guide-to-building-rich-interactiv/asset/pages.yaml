  md: '# 13.11 Special Events 449


    | Table 13.3 Reacting to the Device Being Rotated |

    | Event | Description |

    |---|--|

    | orientationchange | If the device is rotated, you can evaluate the orientation
    in the callback function via the second parameter and the values "portrait" or
    "landscape". |


    # ## 13.11.3 Scroll Events


    You can also react to various events in connection with the content being scrolled.


    | Table 13.4 Scrolling Events |

    | Event | Description |

    |---|--|

    | scrollstart | Scrolling starts. |

    | scrollstop | Scrolling stops. |


    # ## 13.11.4 Page Events


    Initializing, showing, and hiding pages are connected to the following events.


    | Table 13.5 Page Events |

    | Event | Description |

    |---|--|

    | pagebeforecreate | An initialization event that is triggered before creating
    the page. |

    | pagebeforehide | Hiding starts. This describes an event that is triggered before
    the page is actually hidden. |

    | pagebeforeshow | Showing starts (usually in animation). This describes an event
    that is triggered before the page is actually shown. |

    | pagecreate | An initialization event that is triggered after the page has been
    created. |

    | pagehide | The page is fully hidden. |

    | pageshow | The page is fully shown. |


    As an example for the reaction to events, let''s take a web page with two page
    segments and react to hiding and showing the start page (ch13_7.html).'
