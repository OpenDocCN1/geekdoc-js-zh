    # 6.8.2 Replacing All with `replaceAll()`


    With `replaceAll()`, you specify a selector as parameter. All elements that match
    the selector are replaced by the element to which the method is applied. As a
    return value, you get all *inserted* elements. So, this is the inverted syntax
    of `replaceAll`; when using it, you have to watch out if you still want to use
    the original elements. As mentioned before, the return value contains the inserted
    elements. If you need the original elements or their content, you need to save
    them in a variable before you replace them. This is generally more complicated
    than working with `replaceAll()`. The method `replaceAll()` is above all useful
    if you want to replace an element completely with an identical structure or always
    the same passage with a different fixed structure (ch6_15.html).


