  md: '# 5.1.3 XPath as Basis


    To understand selectors and filters in jQuery work and comprehend the various
    tokens for describing the selectors and filters, it makes sense to take a closer
    look at the basics of navigation in trees. Let''s take a brief look at XPath without
    going too much into detail with this rather complex XML technique.


    The XML Path Language (XPath) refers to a query language developed by W3C for
    addressing components in an XML document (or a tree/DOM in general). XPath is
    often seen for XML as what SQL is for databases—a universal query language that
    can be used in many situations.


    > Note

    In jQuery, selectors and filters are a composition of classic CSS selectors and
    XPath. An extension of CSS (version 1.3) with an added subset based on XPath is
    perhaps a good description. True XPath selectors are available as plug-in in jQuery.


    Basically, you can use XPath expressions to address specific content in a document
    with a tree-like structure. The central concept involved in these selections is
    the tree or DOM.


    # Trees, Nodes, and Elements


    Such a tree consists of nodes and axes that develop from a single root. The nodes
    of the tree are all elements contained in it. The subelements contained in an
    element are child elements. The element superior to the child in the tree hierarchy
    is referred to as parent element.


    All other node types belong to the same hierarchy level of the tree as the node
    that contains them. These are referred to as siblings.


    Axes are seen as the trunk or the branches of the tree and also take into account
    the order of the element declarations (seen sequentially from the root of the
    tree). Accordingly, there are ancestors and descendants in the tree.


    Let''s take a look at selected terms of XPath that refer to the elements in this
    way.


    Table 5.1 Selected XPath Terms


    | Token | Addressed Nodes |

    | Token | Addressed Nodes |

    | --- | --- |

    | Ancestor | All superior nodes. Refers to all ancestors of the current node in
    the tree, its root. |

    | Child | All nodes that are directly subordinate to the current node. |

    | Descendant | All nodes that are directly or indirectly subordinate to the current
    node. |


    +   4. As well as similarly structured selection techniques.


    +   5. We are not going into the fine details of XPath regarding attributes, comments,
    namespaces, Plis, and so on. We are using the term elements in a universal sense.'
