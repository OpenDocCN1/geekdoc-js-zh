  md: "# 6.5.2 appendTo() and prependTo()\n\nTo append or move nodes, you have other\
    \ options than working with append() and prepend(). There is the alternative method\
    \ appendTo(). But you have to watch out; this method has a different syntax from\
    \ the other two methods that are based in their application on the classic DOM\
    \ method appendChild().\n\nThis alternative method moves the nodes selected with\
    \ a preceding selector to the existing content that is specified with a selector\
    \ as parameter of appendTo(). Or to put it differently, the objects via which\
    \ the method is called are the objects that are specified as parameters. That\
    \ is the exact opposite of appendTo(). Entirely consistently, the method prependTo()\
    \ inserts nodes before the existing content.\n\nBut now we need to distinguish\
    \ if the methods are applied to elements or if we are looking at elements we need\
    \ to create first. Because if we apply them to nodes that already exist in the\
    \ web page, these nodes are moved again. But the issue with moving nodes can be\
    \ tricky in certain constellations. So let's take a look at appendTo() in a situation\
    \ of a somewhat but expressive application.\n\nWe apply the methods to elements\
    \ that are already present in the web page and move the appended nodes in the\
    \ tree. In other words, the appended content is no longer in the same place in\
    \ the tree where it was before we appendTo(). And indeed it is not just the text\
    \ content that is removed and appended in the new node, the entire node (including\
    \ specific node properties such as Cascading Style Sheets [CSS] formatting). The\
    \ behavior can be analyzed very well in Firefox and was also present in the previous\
    \ example for append() (ch6_5.html).\n\n# Listing 6.11 Moving Elements to Another\
    \ Place with appendTo()\n\n```\n...\n<script type=\"text/javascript\">\n  src=\"\
    lib/ch6_ready.js\"></script>\n</head>\n<body>\n  <button>append()</button>\n \
    \ <button>appendTo() one node</button>\n  <button>appendTo() several nodes</button>\n\
    \  <hr/><span id=\"a\" style=\"color:cyan;background:red\">\n    - 1st Node -\
    \ </span>\n  <span id=\"b\" style=\"color:white;background:cyan\">\n    - 2nd\
    \ Node - </span>\n  <span id=\"c\" style=\"color:green;background:yellow\">\n\
    \    - 3rd Node - </span>\n  <div id=\"output\" style=\"n    color:red;background:lightgray\"\
    >Target area</div></div>\n</body>\n</html>\n```"
  merge: -1
