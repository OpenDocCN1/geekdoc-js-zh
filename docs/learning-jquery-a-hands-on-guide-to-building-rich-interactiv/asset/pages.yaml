    \ wtai: and dc: for phone.\n\n# 13.4.2 Internal Links and the Special Interpretation\
    \ of a Page\n\nUnder jQuery Mobile, a single HTML document can contain several\
    \ pages in the sense of the framework. This approach makes sense because traditional\
    \ web pages are too large for small cellphone and smartphone screens. In a normal\
    \ web page, the visitor with a mobile device almost always has to scroll to the\
    \ content of the whole web page. Subdividing the contents of a web page by the\
    \ web creator into fixed segments with logically grouped information is entirely\
    \ appropriate. And downloading these segments together is also logical in the\
    \ mobile environment, where bandwidth is still mostly low. Preloaded but not yet\
    \ displayed segments can be linked via special links and be quickly displayed\
