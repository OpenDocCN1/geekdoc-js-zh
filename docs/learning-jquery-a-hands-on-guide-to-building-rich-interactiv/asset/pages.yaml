    > Note

    You might be surprised by the small number of widgets in jQuery UI. From other
    frameworks, you might know many more components. Just think of navigation trees.
    In jQuery, however, there is the concept of plug-ins, and many widgets are extended
    via these external plug-ins. You will see this in the following chapter.


    # 11.1.3 Extended Effects


    jQuery itself already offers numerous effects, as you have already seen. With
    jQuery UI, these effects are expanded by several other effect methods, such as
    effect(), show(), hide(), toggle(), animate(), addClass(), removeClass(). Most
    of the names of the effect of effect methods sound familiar to you. In fact, these
    already familiar methods are usually just extended in their capacity in jQuery
    UI, but sometimes considerably extended. For example, you can also change colors
    in animation via animate() in jQuery UI, which you cannot do in the basic version.
    Fundamentally, though, you use the methods of the same name in the core framework,
    so they are fairly straightforward.


    > Tip

    You can find the documentation on jQuery UI at http://jquery.com/demos/. For extended
    and special questions on jQuery UI, take a look in the Support Center at http://jquery.com/


    # 11.1.4 The Theme Framework and ThemeRoller


    Another component of jQuery UI is an extensive theme framework based on CSS. It
    is a pure CSS library. It also has a ThemeRoller tool for selecting, adapting,
    and using premade designs and a gallery with premade designs for the available
    components of the framework.


    > Note

    The book is based on the stable version 1.8.24⁴ and a beta version 1.9 of jQuery
    UI. It is unlikely that incompatibilities will arise with the next few versions,
    but over, we cannot rule it out. Much is already known about the future versions.
    In version 2.0, we will see the introduction of a widget factory with free prototype
    inheritance, direct instancing without calling'
