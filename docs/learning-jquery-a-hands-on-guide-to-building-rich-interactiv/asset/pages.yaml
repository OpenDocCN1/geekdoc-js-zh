    # toggle()


    The toggle() method is used in almost the same way as hover(). It just reacts
    to a click and toggles with each click between two or more functions that are
    passed to the method as parameters. If a matching element is clicked, the first
    specified function is fired. A second click on the same elements fires the second
    function. If there are other function references, this goes on accordingly. Then
    it back to the first function. All subsequent clicks result in a rotation through
    the specified function calls. This method is in principle very similar to hover(),
    so we are not providing a complete example.


    > Tip

    Apart from function references as parameters, the toggle() method can also be
    used entirely without parameters. In this case, the visibility of each matching
    element is toggled on and off. This involves calling the hide() and show() methods
    indirectly. You can also use the method with a Boolean value as a parameter. Depending
    on the value of the parameter, all elements are shown (true) or hidden (false).
    If you bear in mind that the numeric 0 in JavaScript represents true, you can
    also use numeric algorithms for setting the parameter.'
