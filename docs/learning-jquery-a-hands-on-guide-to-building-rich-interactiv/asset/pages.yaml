    # 6.13 The jQuery Method each() for Iterating over Arrays and Objects


    We move on to a very fundamental and important section. In JavaScript, we usually
    use dot notation to access the components of an object, as you know. The alternative
    is referred to as array notation. data field notation, permitting meaningful indices.
    In JavaScript, objects are implemented completely identical to arrays with value
    pairs of property and associated value. For methods, the value is a function return.


    Let''s look at a little example in native JavaScript where we create an object
    and access it via array notation.


    **Listing 6.54** Accessing an Object via Array Notation


    ```

    var x = {

    name: "Felix", age: 11, occupation: "Student"

    };

    var index = "name"

    document.write(x[index]); // "Felix"

    document.write(x[age]); // 11

    ```


    This procedure is also referred to as **associative array**. In JavaScript, in
    particular when iterating over properties and methods of an object, you can proceed
    completely consistently as you would for an array. And as the indices are not
    numbers¹⁶ in case of objects, but names of properties, and you just need to use
    the techniques for an associative array when iterating. A for-in loop is well
    suited for this.


    Let''s make it clearer by looking at a complete example that for once manages
    entirely without jQuery and also works with an internal JavaScript (ch6_2.html).


    16. Strictly speaking, numeric indices in JavaScript are also strings, just with
    numbers as content.'
