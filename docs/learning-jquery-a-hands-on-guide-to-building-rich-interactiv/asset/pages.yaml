    # 4.8 Using jQuery in Combination with Other Frameworks


    The jQuery library offers a multitude of functions. Generally, these should offer
    adequate solutions for most problems occurring in web programming. If this is
    not sufficient for you, there are extensions based on jQuery, such as the jQuery
    UI or Mobile jQuery, the many jQuery plug-ins that are compatible without limitations.
    But another library or framework might contain a specific function that is not
    implemented in jQuery quite the same way. Or perhaps you prefer the solution offered
    in another framework. In this case, you may want to use jQuery together with other
    libraries or frameworks within a website. You might want to integrate these together
    within a page, according to the rules described earlier.


    To ensure several libraries or frameworks operate as smoothly as possible, the
    jQuery library with all plug-ins uses—as discussed earlier—a separate namespace.9
    If you are using several libraries or frameworks in combination, this should ensure
    that an identifier in one framework does not conflict with a potentially identical
    identifier in another framework. But, of course, this applies only if all used
    libraries and frameworks support or implement the namespace technique.


    9. Within the limitations arising as a result of the concept of JavaScript.'
