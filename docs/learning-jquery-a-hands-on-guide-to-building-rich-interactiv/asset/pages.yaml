  md: '# 4.10.1 Executing Function Calls Sequentially: The jQuery Queue


    In connection with self-calls, chained calls, or generally delayed calls of functions
    in jQuery, delayed calls are held in a queue. This term is also part of the name
    of several methods in the framework that take care of the queuing.


    If several function calls are to be executed sequentially, they have to be managed
    in a queue. Strictly speaking, a queue is an array of function references. The
    jQuery framework manages this queue automatically in the background (for example,
    in case of call chaining), or you can use various methods to manually access this
    queue (for example, the queue () and dequeue() or methods). With the dequeue()
    method, you get a reference to the element (the first function) in the queue.
    As a parameter, you can specify a string via which you identify the queue. The
    default is fx. If you specify a second parameter, this is a callback. Then you
    add a new function at the end of the queue, which is executed when all previous
    functions have been completed. If you specify the name of another queue as a second
    parameter, the existing queue is replaced with the new one. You can also specify
    an array with functions.


    With the dequeue() method, you take a function from the beginning of the queue
    and execute it. An optional parameter is the name of the queue from which you
    want to take the function. The delay() method that was added in jQuery 1.4 enables
    you to delay the execution of methods that follow in the queue. Another method
    added in version 1.4 is clearQueue(), used to remove all calls to not-yet-executed
    functions from the queue. As with clearQueue(), you can access the default queue
    fx by omitting a parameter or specify the name of the queue as string.


