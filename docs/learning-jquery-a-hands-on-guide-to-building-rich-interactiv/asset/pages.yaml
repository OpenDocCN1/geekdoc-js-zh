    # 9.5 Individual Animations with animate()


    The default methods in jQuery for firing an effect or time-controlled animation
    are already powerful and impressive. You can easily imagine different situations
    that are not covered by these and that you still want to animate. Imagine, for
    example, moving the position of an element.


    In direct programming, you would probably work with window.setTimeout() to control
    the time periods in animations and it to change CSS properties dynamically. And
    probably you would optimize the animations using recursive calls. This kind of
    effort is not necessary in jQuery because it offers the animate() method. This
    method is available in several variations with different (optional) parameters.
    The general version looks schematically like Listing 9.11.


    +   Listing 9.11 Pattern for Applying()

    animate(style object with properties, [time factor], [easing], [callback])


    An alternative variation works with two parameters, as shown in listing 9.12.


    +   Listing 9.12 Pattern for Variation with Two Parameters

    animate(style object with properties, options)


    For the options, you can set the following specifications described in Table 9.1.


    | Table 9.1 Options for the More Precisely Specified Call of animate() |

    | Option | Description |

    | duration | Specifies the duration via the usual tokens "slow", "normal", or
    "fast" or period in milliseconds. |

    | easing | Specifies a specific effect when ending the animation as string. The
    default is "swing". |

    | complete | Specifies a function that is to be executed once the animation ends.
    The function is called for each affected element. |'
