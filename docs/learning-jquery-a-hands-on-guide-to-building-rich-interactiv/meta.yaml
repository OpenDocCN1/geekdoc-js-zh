- img_proc: false
  md: '# Name


    # Description


    .class1 .class2


    This selection returns an element or an array of elements whose classes (the class
    attribute or dynamically assigned classes) match the given group of classes. The
    list of hits consists of the elements that were assigned both (or several) classes
    simultaneously. Note the preceding dot that indicates the class chaining. This
    statement is somewhat tricky because it does not mean that an element has been
    assigned two or more classes as individual attributes, but that there is descendant
    nesting, so that the parent elements have been assigned the preceding classes.
    This is a special case of the hierarchical descendant route.


    parent > child


    This variation of a hierarchical selection returns an element or array of all
    elements that are child elements of the selected parent element.


    prev + next


    In this case element specified by the second selector has to be immediately preceding
    as sibling by the element that the first selector specifies. So, you get an element
    of the type that is next to the element specified by previous. This is also a
    hierarchical selection.


    prev - siblings


    This further hierarchical variation of the selection returns an element or array
    of elements with all sibling elements following after the first specified element
    that correspond to the filtering of the second selector.


