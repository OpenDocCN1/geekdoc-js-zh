    # attr(), prop(), and removeProp()


    Also, the internal workings of the attr() method have been rewritten. Since jQuery
    1.6, the handling of DOM attributes and properties is separated. For the latter,
    jQuery 1.6 introduced the prop() and removeProp() methods. The new method prop()
    sets the properties (hence the name of) DOM elements or returns the corresponding
    values. Corresponding, removeProp() removes the properties.


    The background is this: In the previous versions, jQuery did not separate DOM
    attributes and properties clearly. But there are small differences. Generally,
    DOM attributes represent the status of DOM information that is delivered by the
    document (for example, the value of the attribute value in <input type="text"
    value="abc">). So is the static value of the HTML markup. DOM properties, in contrast,
    represent the status of the document. This can differ from the static preset value,
    as the example shows. If the user in the described case enters a value in the
    form, the method prop("value") returns the input of the user rather than the preset
    value. Up to now you should have been working with the val() method anyway in
    case of elements, but you could also have used attr("value").


    In most cases, browsers return the value of the attribute value as the start value
    for the corresponding property, but with Boolean attributes as checked or disabled
    there are certain problems (yet you need to avoid such Boolean attributes if you
    want to take XHTML logic into account—and then the problem does not arise.


