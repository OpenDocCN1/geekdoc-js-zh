    # 5.3 Filtering Selectors


    Filtering selectors in jQuery correspond roughly to the node tests in XPath. With
    these, you specify further conditions for a preceding group of elements, separated
    by a colon. In this section, we subdivide this filtering into several categories
    by their effect.


    > Tip

    You can write down a filter without preceding selector. Then you just start with
    the colon. This applies the filter to all elements of the web page. You can also
    chain any filters. Just write them down one after the other, separated by colons.


    # 5.3.1 Basic Filters


    These are the basic filter selectors available in jQuery.


    Table 5.3 All Basic Filters

    | Name | Description |

    | :--- | :--- |

    | :first | The first selected element from the preceding set of elements |

    | :last | The last selected element from the preceding set of elements |'
