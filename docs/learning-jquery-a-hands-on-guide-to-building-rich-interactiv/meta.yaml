    # 1.2 Writing Conventions


    This book uses various writing conventions intended to help you keep track of
    things more easily. Important terms are **emphasized in bold**. Sometimes it in
    *italics*. Above all, you are meant to be able to see if it is normal text or
    program `code`. Keyboard shortcuts and some other special things are also highlighted.
