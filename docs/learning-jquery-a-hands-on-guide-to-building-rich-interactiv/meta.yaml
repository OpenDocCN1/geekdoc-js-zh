    programming, and whereas the jQuery UI builds it on an independent framework and
    excels with visually advanced components and a CSS framework. Of course, we also
    take a closer look at the jQuery UI in this book and work through many examples
    with the various widgets it offers. In addition, you will learn in detail how
    to use options, events, methods, and then to adapt it for yourself. The framework
    and the ThemeRoller of the jQuery UI are also covered in detail.


    Then there are also plug-ins in jQuery, as extensions of the framework. You will
    learn how to use foreign plug-ins in case you cannot find a certain function in
    the jQuery core libraries, and you will learn how to create and publish your own
    plug-ins.


    Last but not least, this book describes how you can create mobile apps based on
    jQuery. This involves using the mobile framework that is directly based on native
    jQuery (just as the jQuery UI is).


