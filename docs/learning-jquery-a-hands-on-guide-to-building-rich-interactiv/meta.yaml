  md: '# 3.4 DOM and Objects 47


    Central to object-oriented programming is that the methods and properties (attributes
    or data) are always assigned to an object together. This means that there are
    no methods or properties without an associated object.


    Class elements are special properties and methods that are not available via a
    specific object but already via the class. You can use these without first creating
    an object.


    # 3.4.1 DOM and Accessing the Elements of a Web Page


    It will happen very often that you create an object in JavaScript itself or use
    class elements. Practically you will use objects in your JavaScript codes that
    have been made available to you automatically by the browser. These objects are
    based on an object model but describe the structures of almost any treelike structures—the
    repeatedly mentioned DOM concept. Or to put it even more drastically, without
    using the DOM, JavaScript programming is pointless!


    You can use this object library via various techniques, both from within programming
    or script languages and applications. With DOM, accessing a web page under this
    object is based on a concept that deals a cross-platform and operating language-independent
    interface.


    In this concept, an (X)HTML site (or generally a treelike structure—so, for example,
    an XML document as well) is not perceived as a statically structured, finished,
    and indistinguishable unit, but as a structure that, individual components of
    a web page individually even if the web page has been loaded into the browser.
    This treatment goes far beyond the simple interpretation through the browser on
    loading a document from top to bottom.


    The DOM concept comprises several partial aspects. For example, it causes a browser
    to read an (X)HTML site like a normal text file and execute the corresponding
    (X)HTML statements. But beyond this, the browser will also index on loading all
    the elements of a web page that are known within the concept (and individually
    identifiable) regarding their type, their relevant properties, and their position
    within the web page.


    This kind of tree in the computer''s main memory is constructed on loading the
    web page and deleted when the user leaves the site. The elements are referred
    to as nodes.


    Similar elements are managed together in a field where the browser indexes them.
    So on loading the site, the browser has exact knowledge of all relevant data of
    the elements it can independently address in the web page. But which ones are
    they and what the browser can do with differ greatly between various browsers.


    Each addressable element (for example, a specific (X)HTML tag) can also be updated
    while the web page is loaded in the browser (for example, if a script is used
    to dynamically change the layout of an element after the web page or style sheets
    are used to change what we did in the examples in Chapter 2, “First Examples with
    jQuery.”'
