  md: '# 5.2 The Basic Selectors and the Hierarchical Selectors


    The selection options grouped under basic selectors in jQuery correspond to the
    classic CSS selectors. Via an element, an ID, and so on, you access the components
    of a web page and as result get an element or array with elements.6


    As mentioned in XPath, you can also describe the position in a tree in terms of
    parent-child relationships, siblings, and ancestors or descendants. These relationships
    also occur in CSS.


    This type of selection allows a very comfortable description of a group of elements
    that belong to hierarchy levels. Some sources therefore refer to these selectors
    as hierarchical selectors and functionally distinguish them from the basic selectors.
    We do not examine the exact distinction between basic selectors and hierarchical
    selectors in most cases; for their application, this is not necessary in any case.


    | Name | Description |

    | --- | --- |

    | #id | Specify an ID to get the specified element. Note the preceding # Usually,
    you get exactly one element, as an ID should be unique within a document. But
    because of the error tolerance of browsers, this uniqueness is not ensured in
    a document. Although jQuery can handle this situation, the page is full of errors,
    and then you cannot program properly. In that case, you might have to correct
    the selector. |

    | element | Specify a specific element as selector to get an array with all elements
    that match that name. |

    | .class | An array with all elements whose class (the class attribute or a dynamically
    assigned class) matches the given class. Note the dot preceding selector. |

    | * | The universal selector. Selects all elements. |

    | selector1, selector2,..., selector | A combination of different selectors. You
    get an element or an array with all elements that match one of the specified conditions.
    |

    | ancestor descendant | This hierarchical selection returns an element or an array
    with all elements that are descendants of the preceding ancestor in the tree.
    The elements selected via the second selector have to be descendants of the first
    result. This is also referred to as context-sensitive selectors because an element
    is selected if it lies within another element (context). In terms of notation,
    the descendant simply follows the ancestor element, separated by a space.


    6. Strictly speaking, an array can also be only one element or even be empty.'
  merge: -1
