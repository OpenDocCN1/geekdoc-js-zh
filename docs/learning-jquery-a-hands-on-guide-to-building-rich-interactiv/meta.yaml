    output document. the description of the transformation or formatting usually occurs
    in the form of an external file can also be in some situations be written directly
    in the file with the data(for example, a web page). So, style sheets simply give
    a new look to information that is already present. To achieve this, the data and
    formatting information is processed by an interpreting system and then presented
    differently.


    Basically, style rules in web pages can be applied to any HTML or XHTML elements.
    But some elements are specifically suited for applying style sheets, and their
    entire benefit is that they are formatted via style sheets.


    Style sheets generally consist of various rules for formatting elements. To use
    style sheets as CSS in a web page, you need to add them to an HTML, XHTML, or
    XML site. This site can be done by embedding style sheets into a document or importing
    them from an external file. If and how this can done depends on the type of the
    date you want to apply the CSS formatting.


    Embedding an internal style sheet into a web page is done via the <style> tag,
    a pure HTML container. In it, all style rules are defined. In HTML, you can write
    such a style area anywhere in the web page.


    A style sheet in HTML is schematically integrated as shown in Listing 3.13.


    # Listing 3.13 Schema of a Style Container in HTML


    ```

    <style type="text/css">

    ... any CSS formattings ...

    </style>

    ```


    > Note

    You often find HTML comments in containers. These are not necessary (as in the
    case of integration via JavaScript).


    In a web page, you add a reference to an external style sheet via the <link> tag.
    As in the case of JavaScript, referencing external files is practically the preferred
    option. In case of style sheets, this is the only way of achieving the usually
    desired separation of structure and layout.


    Listing 3.14 shows the schema for referencing an external CSS file.


    # Listing 3.14 Integrating an External CSS File


    ```

    <link type="text/css" rel="stylesheet"

    href="[URL of CSS file]" />

    ```


