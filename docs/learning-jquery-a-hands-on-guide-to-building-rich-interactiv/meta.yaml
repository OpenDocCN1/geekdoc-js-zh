    effect, it is removed from the text flow.)


    But what happens in the example if you click the same button several times? This
    answer might surprise you: The events are cumulated. This means they are executed
    consecutively; the next event is executed only when the previous one has been
    fully processed. So, clicking the button again does not cause the current animation
    to stop and the next one to commence immediately. If that is what you want to
    achieve, you have to program explicitly.


