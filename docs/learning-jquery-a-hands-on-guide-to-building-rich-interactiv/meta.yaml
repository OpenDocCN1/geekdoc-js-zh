  md: '32 Chapter 3 Basic Knowledge


    # 3.1 The Web, Web 2.0, and the Client/Server Principle on the Internet


    For start with, let''s take a brief look at the WWW. At its core, the Web is based
    on the service protocol Hypertext Transfer Protocol (HTTP) for communication,
    the document description language HTML, and its strict XML-based twin XHTML plus
    program types web server and web browser.


    Just like all services available on the Internet, the Web is a classic client/server
    system, where each action consists of a cycle of requesting a service and providing
    the service. Specifically, this means that on the Web it is always a situation
    of a browser (the client) requesting a file (a web page or content that is to
    be integrated into a web page) and in some cases further requests for external
    resources referenced within this site (for example, graphics, videos, flash animations,
    or external JavaScript or CSS files). These are then displayed in the browser
    with the web page or are otherwise processed. The central control mechanism is
    always the (X)HTML file.


    # 3.1.1 Programming on the Web


    Over the years, the Web has evolved into a system where both the program and the
    client in terms of offering content. The hysteria about the dangers of client-side
    programming seems to have calmed down in recent years, and nearly all modern websites
    use client-side programming for that part of the business logic that should sensibly
    be taken care of in the client. After all these years, the only relevant representative
    of the client-side field that is still around is JavaScript, but by now it is
    accepted and widely used. Just take a look at some popular websites on the Internet.
    Not one of these sites can manage without JavaScript. And almost all users on
    the Web have JavaScript enabled in their browser. After all, who wants to do without
    the full and unlimited use of popular websites as Google, Amazon, eBay, Facebook,
    Twitter, Wikipedia, or Yahoo! As a creator of websites, you can, in turn, assume
    that most clients have JavaScript plus This means many arguments using JavaScript
    frameworks such as jQuery or Dojo Toolkit, Prototype, YUI, and so are no longer
    valid.


    > Note

    As mentioned earlier in this book, various manufacturers are trying to establish
    proprietary techniques such as Silverlight in the client system to break through
    the limitations of JavaScript and web browsers as clients. But it will take some
    time before these are supported and accepted on a wide scale. It is unclear at
    point, whether these proprietary efforts will succeed.


    +   1. According to the statistics I consulted, the support for JavaScript fluctuating
    massively. Some statistics assume 99.9% availability, others perceive "only" 99.1%
    availability. I hope you are aware of the irony in my statement to it out, you
    can currently assume that there is almost unlimited availability.'
  merge: -1
  pgno: 49
- img_proc: false
  md: '# 3.1.2 The Web 2.0


    As ingenious and fundamentally simple as the concept of the Web, there is a basic
    and serious problem with HTTP, HTML, and the concept of classic web browsers.
    When the browser requests new data from a web server, the latter always to send
    a complete web page response. Or to be more precise, the browser interprets the
    response in such a way that it replaces the site previously displayed in the browser
    with this new content. Obviously this is very inefficient. This is where AJAX
    enters the stage. (You will read more about its technical background shortly.)


    Generally, this is a procedure that ensures a reaction from a web application
    in (almost) real time, although new data is being requested from the web server.
    Instead of replacing a complete web page with data that is in principle already
    present in the browser, an AJAX data request will result only in the really new
    data sent by the web server and then using HTML methods to "build it in" the web
    page that is already loaded in the client. This does not usually interrupt the
    normal interaction with the web application by loading new data. Therefore you
    can now create sites on the web that are much more focused on interaction with
    the user. Thanks to Google, in particular, AJAX has become standard procedure
    for such interactive websites. And since 2005, the buzzword Web 2.0 has become
    a collective term for most interactive websites. Often, Web 2.0 is also referred
    to as "participatory" or "interactive", because users are no longer consumers
    but also contribute content themselves. Just like blogs; tweets; wikis; or communities
    such as Xing, Facebook, MySpace, and so on. But even if users, enter data in an
    online calendar, this will result in a different representation of the website
    (for example, the event is displayed—and, of course, also saved on the server).
    In this respect, that is also a form of participating in the Web 2.0.


    # 3.2 JavaScript and Its Relationship to jQuery


    jQuery is fundamentally a JavaScript library by, of course, need to take a closer
    look at this language. Although making statements of jQuery and various other
    frameworks claim it will do many things with regard to JavaScript for you to use
    jQuery ought to have basic knowledge of JavaScript. And if you want to use jQuery
    really effectively (for example, to create plug-ins), you should even have good
    knowledge of JavaScript.


    > Note

    The next few chapters lead you deeper into the world of JavaScript, where it is
    appropriate in connection with jQuery. For now, just a bit of basic information
    on JavaScript will suffice. For more basic concepts and information on JavaScript,
    see the appendix.


    Generally, script languages on the Web are some of the most important extensions
    of HTML or XHTML and implement the client-side logic of a web application. These
    script languages are interpreter languages that are translated and executed within
    a host program (the browser) at runtime. This particularly applies to JavaScript.'
