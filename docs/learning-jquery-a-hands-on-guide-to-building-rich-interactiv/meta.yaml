  md: '# Summary


    In this extensive chapter, you have seen how to use selectors and filters corresponding
    filter methods under jQuery that are available in various variations. With these,
    the framework considerably expands the native possibilities of DOM selections
    and the historic variations such as object fields and names. Yet the filters and
    selectors remain browser consistent and easy to apply. With jQuery, the syntax
    of selectors and filters was conceived as a kind of composition of classic CSS
    selectors and XPath expressions. The approach of jQuery is rather intelligent
    for several reasons in my opinion (because many users already know CSS selectors
    and because the ideas from XPath have been integrated into the concept harmoniously
    and simplified). Beyond this, there are filter methods that make the selection
    of elements even more flexible.'
