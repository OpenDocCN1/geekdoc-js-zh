  md: '# Chapter 3 Basic Knowledge


    bottom. So, obviously, the script statements (functions) that are written further
    down in a website will be available only after the site has been loaded up to
    that point. A common approach is therefore to place a <script> container before
    the body and embed the declarations of important functions into it. These functions
    are available for the entire document.


    In practice, it has become clear that there are many situations in programming
    with JavaScript where the position of the <script> element massively influences
    the execution. Many web pages, for example, force you to place the <script> container
