    # 3.5.2 The Specific Syntax of CSS Declarations


    Let''s turn briefly to the specific syntax of CSS declarations and the options
    of specifying formatting rules. The syntax of a CSS declaration always follows
    the same structure. You specify a name, a colon, and the property to be formatted.


    The schematic representation of the syntax of a CSS declaration looks like this:


    ```

    Listing 3.15 Schema of a CSS Declaration

    [name] : [value]

    ```


    # 3.5.3 Selectors


    The element to be formatted (referred to as selector) is placed before a rule.
    Several formatting rules for an element are separated via semicolons and usually
    enclosed by curly brackets. There are different forms of selectors:


    +   - Element selectors

    - Attribute selectors

    - Generation selectors

    - The universal selector

    - Pseudo classes


    In the area of selectors, jQuery offers one of its most practical highlights.


