  md: '# 1.5 About the Author


    To include this chapter, I give you a bit of information about myself. You will
    already know my name from the cover of this book or from reading the preface,
    for the sake of politeness, let me introduce myself once more: My name is Ralph
    Steyer. I went to university in Frankfurt/Main (Germany) and studied mathematics
    (Diploma). I spent seven years working as a programmer and conceptual project
    member for a large insurance company in the Rhine-Main area, first with Turbo
    Pascal, later with C and C++. After 4 years, I spent1 year working in database
    conception for a mainframe database under MVS. This experience was a great motivation
    for my step toward being self-employed because I realized that I did not want
    to do this long term.


    Since 1995, I have been earning living as a freelancer, switching-on-the-fly working
    as technical author, specialized journalist, IT lecturer, consultant, and programmer.
    In addition to these roles, I sometimes give lectures on web conferences, teach
    at various academies and one university, occasionally translate specialist books,
    and record online training videos. In my opinion, this makes quite a good mixture,
    preserves me from professional apathy, and keeps me close to the practice and
    at the forefront of development. In particular, I have the pleasure also the burden
    of having to constantly stay current with new developments because the half-life
    of computer knowledge is rather short. Correspondingly, my job is sometimes tiring,
    always exciting.


