    # 5.3.5 Attribute Filters


    Attribute filters are among the most useful filters in jQuery. You can use them
    to filter either the presence or content of attributes for HTML tags or elements.
    For most filters, it is surely a highlight that they are easy to apply.114 You
    enclose attribute filters in square brackets.


    | Name | Description |

    | --- | --- |

    | [attribute] | All elements that have the specified attribute, irrespective of
    the value. |

    | [attribute=value] | All elements that have the specified attribute and where
    the value matches the specified test value. |

    | [attribute!=value] | All elements that have the specified attribute and where
    the value does not match the specified test value. |

    | [attribute^=value] | All elements that have the specified attribute and where
    the value begins with the specified test value. |

    | [attribute$=value] | All elements that have the specified attribute and where
    the value ends with the specified test value. |


    114. In contrast to true regular expressions that tend to cause some people headache.
    But even XPath is not totally straightforward.'
