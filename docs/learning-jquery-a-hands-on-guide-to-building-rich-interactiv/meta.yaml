  md: '# Chapter 1 Introduction


    # Note


    The version numbers are rather high, but users with older browsers hardly stand
    a chance in the current Web, if we do not take jquery into account. The situation
    has changed from what it was a few years ago. Now, more and more website creators
    no longer support as many browsers as possible. Instead, they explicitly set a
    minimum level. Certain functions cannot be realized at all older browsers, or
    only with an exorbitant amount of effort, and hardly anyone is prepared to pay
    this price given that a handful of users still have old-timers. Some developers
    even cease supporting certain browser types, to give the impression that they
    are producing particularly modern websites. It seems to almost a "mark of quality"
    if sites do not work with Internet Explorer or not displayed correctly (as far
    as I can determine, this has almost become a national sport in the United States).
    This trend is essentially the opposite of what was going on 10 years ago. Back
    then, you would find many websites with the note Optimized for Internet Explorer.
    Now, it means many websites want to demonstrate their exceptional quality by not
    working in Internet Explorer (at least in the really old versions, up to 7). Perhaps
    this is their motto: We are making modern websites, and to use these, you need
    to have a modern and powerful browser.


    I believe this is our approach. I think that Internet Explorer 9 is now available
    and a really good browser, we should still offer a kind of protected-specified
    supports for versions 7 and 8 (and to a certain even version 6). Because of company
    policies or because users on the Internet are forced to use Internet Explorer
    because not have sufficient knowledge to use an alternative browser or are just
    happy with a particular browser. I believe that jQuery is the sensible approach
    in supporting the older versions of Internet Explorer, and we can live with the
    limitations of the jQuery UI regarding Internet Explorer; more on this in the
    relevant chapters (and the explicit Microsoft support reflects this, too).


    Unless you have one of the listed browsers, you cannot reliably test your jQuery
    application. As a creator of websites, you should ideally have several browsers
    available. Because even when using a reliable and well-established framework like
    jQuery, you still need to test web applications in all relevant browsers.


    And generally, you do not know which browsers the visitors of your websites are
    using. So, it is a good idea to test with browsers that do not have guaranteed
    support for jQuery. For example, even though there are problems with Firefox 1.0.x,
    Internet Explorer 1.0 to 5.x, Safari 1.0 to 2.0.1, Opera 1.0 to 9.x, and Conqueror,
    jQuery generally does work with Conqueror or Firefox 1.0.x. Just not with all
    components. Ultimately, it depends on the feature you are using, and you can go
    and test it in the relevant browsers.


    # 1.4.4 Different Operating Systems and Virtual Machines for Testing


    As previously mentioned, the choice of operating system for working with jQuery
    when creating a website is largely one of personal preference or any given constraints.
    This does not concern the choice of a test environment. Ideally, you have several
    operating systems available


    Even still occasionally in the antiquated version 6, as I was appalled to realize
    in 2010/2011 during my seminars (and those were really big companies, too).'
