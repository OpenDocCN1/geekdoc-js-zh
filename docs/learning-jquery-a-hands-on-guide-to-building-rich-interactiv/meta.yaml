    # 4.4 The Function jquery() and the Alis ($)


    One of the most important functions in the entire framework is definitely jQuery().
    It is available with various parameters, and you can also use it via the alias
    ($). It is oriented towards the token for the jQuery namespace or the jquery object.
    With it, you can reliably select an object or several objects in the DOM and assign
    it to the jquery namespace. So, you are creating a jquery object by cloning the
    original objects from the DOM, and then you have a new object that refers to the
    original objects. This means you have all methods of the framework for such objects
    available, to apply them via the framework to the embedded elements.


    > Note Through the integration of such a powerful and robust framework, a jQuery
    object makes numerous functions available to you in the background that could
    easily be overlooked even though they are immensely important. For example, it
    identifies a browser or an operating system and offers adapted measures in the
    background. In representing a collection of elements,3 it ensures that certain
    steps of a called method actually reliably to all elements. Many methods of the
    framework iterate in a kind of loop or recursive over all elements of a collection
    to achieve this. Or it ensures invisibly that extensions that adhere to certain
    rules can be seamlessly integrated into the framework (plugins).


    As first parameter, you can pass to the function anything that can describe an
    element or a group of elements in the web page. This includes a CSS selector as
    a string, an HTML tag as a string, one or several DOM elements, or a callback
    to a function (including anonymous, of course).


