    components of a web page. This is the basis of all dynamic processes in a web
    page, but also of the targeted formatting of individual web page areas. The classic
    approach is selecting via names, object fields, or native Document Object Model
    (DOM) methods because every web page is represented as DOM in the browser.¹ Object
    fields are—as the name indicates—available via an array notation (and limited
    to it) and only work for a few elements.³ Access via the name from JavaScript
    is only possible to a limited extent.² With regard to conceivable options, the
    native DOM methods only permit selected options (for example, only selecting an
    ID or a class, a few relationship specifications, or just specifying the name
    of a Hypertext Markup Language [HTML] element). The conclusion is that in the
    classic DOM access, many conceivable selection options are almost altogether,
    have different effects, or are only supported by a few browsers.


    Undoubtedly, one of the biggest strengths of the jQuery framework is that you
    can use it to select elements in a web page in an easy, reliable, and universal
    way across all common browsers. Essentially, you are determining a selection of
    elements via the jquery() method or its alias $() and parameters that select the
    elements.


    > Note

    The significance of a targeted selection is also indicated by the name of the
    framework that contains the term query. When selecting an element or a group of
    elements in a web page, you are specifying a query based on selectors and filters.
    The extensive options for specifying selection criteria are, I think, among the
