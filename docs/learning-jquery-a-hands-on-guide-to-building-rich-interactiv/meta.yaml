    of jQuery as quickly as possible and just have some fun playing around, which
    means creating examples.


    > Note

    For the examples in this chapter, also most examples in the following chapters,
    it is not relevant which specific version of jQuery you are using. The examples
    in this book have been created with jQuery 1.8.2 or later, but often any version
    from 1.3 or at least 1.4.1 onward is sufficient.


