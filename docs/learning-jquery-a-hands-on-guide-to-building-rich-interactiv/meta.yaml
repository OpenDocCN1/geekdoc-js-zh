  md: 'I also want to add a special comment on source text passages of complete listings.
    For all complete listings and some larger source code fragments, you will see
    numbering of the source text lines. The numbers are, of course, not part of the
    source text itself; they are only meant to make it easier for you to find your
    way around, to point out a new line in the source code, and to make it clearer
    which part of the source code I am referring to. In rare cases, it might be necessary
    because of technical reasons to split a source text line over several lines. In
    this case, the numbering of the source code lines indicates which passages are
    to be written into one line in the editor. So long as you do not see a new line
    in the book listing, you will still have to type everything into a single line
    in the editor. This is particularly important for longer strings (texts in quotation
    marks) that must not be divided up several lines.


    # 1.3 Who Is the Target Audience for This Book?


    It is always tricky to anticipate who may be interested in a particular topic.
    But I have ideas and now quite a lot of experience from jQuery about who would
    be interested in finding out more about RIAs in the context of jQuery, their potential
    concerns, and the most likely reading of this book. I assume that you have already
    created websites and have already been programming in one form or other. JavaScript
    would be a great basis, but other programming techniques are just as welcome,
    although your learning curve will be slightly steeper as you go along. Style sheets
    should also be a familiar concept to you. If you do not have any previous experience
    with creating websites or working with HTML or jQuery, this will probably pose
    a challenge for you (but this should not discourage you from reading it). I also
    assume that you are tired of the limitations of a static HTML site. Perhaps you
    have some experience with dynamic websites (at least a user), and you would probably
    like to find an easy way to create such interactive modern sites. jQuery is a
    fantastic method for achieving this.


    More and more programmers of powerful techniques and environments as Java or .NET
    are pressing into the area of web programming. Correspondingly, I want to also
    address readers with this type of background knowledge. For programmers who switch
    over from such powerful and strict worlds, it is often hard to find their way
    in the seemingly trivial (but, in fact, rather distinctive) world of web programming.


    # 1.4 What Do You Need?


    Let''s turn to the requirements you should meet for working with this book and
    jQuery.


    # 1.4.1 Hardware and Operating System


    We are dealing with the Internet. So, of course, you need to have a computer with
    Internet access. No special requirements apply as far as the computer itself is
    concerned, but your hardware should be at least reasonable quality. The requirements
    of modern operating systems already determine the minimum level of the required
    hardware. All graphic operating systems such as Linux, Windows, or OS X will work
    fine as long as they are relatively up-to-date.'
