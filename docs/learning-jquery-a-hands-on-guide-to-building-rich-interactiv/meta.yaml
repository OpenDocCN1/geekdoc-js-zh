  md: '# 4.3 Special Data Types and Structures in jQuery


    separated by the dots are different namespaces.2 But these are “voluntary” rules,
    so to speak, that you can adhere or break with unfortunate syntax structures.
    It requires a great deal of discipline to avoid wasting the effect of the concept
    with careless programming.


    jQuery attempts to introduce a proper namespace concept in the world of JavaScript
    and the framework itself. In the framework, all global objects within a namespace
    are assigned, and the namespace is defined by identifiers starting with the token
    jquery and separated by a dot following actual names. The identified elements—from
    the point of view of the framework—are assigned to the jQuery namespace. And you
    access it via the token jquery or in an even shorter form via its alias $.


    > Caution

    So, with jquery or $, you refer in the framework to both the namespace and an
    object (or more precisely, an array with elements), which constitutes a consistent
    implementation of a proper namespace concept (if it is upheld in the entire framework).


    # 4.3 Special Data Types and Structures in jQuery


    Of course, jQuery is based on the standard data types of JavaScript. These are
    String, Number, Boolean, Object, and Function; arrays; callbacks; the XMLHttpRequest
    object; prototyping technique; and several other things. As mentioned before,
    this discussion assumes you have basic knowledge in this area and does not go
    into much detail here. (The appendix contains a brief summary.) Beyond these,
    there are some special types or structures (built-in) in jQuery that we should
    remind ourselves of, at least to some extent.


    # 4.3.1 Options


    The most important thing should be mentioned right away: in the jQuery framework,
    you work intensively with options in various places. The term options in jQuery
    refers only to pure JavaScript objects, but by a special notation. These options
    are usually used declaratively in jQuery via a block indicated by curly brackets.
    The various options are separated by commas, where applicable, and consist of
    an object identifier (that you can enclose in quotation marks), a colon; and then
    the value (in other words, a value pair). A definition with this notation in JavaScript
    is referred to as an object literal.


    # Listing 4.2 Options in the Function of an Object Literal


    ```

    {

    border: "5px outset", cursor: "move", opacity: 0.5, statusinfo: true

    }

    ```


    In fact, in JavaScript, the prepended identifier means the specification of an
    object and the appended identifier a property. This is close to a real namespace
    concept, but not quite the same.'
