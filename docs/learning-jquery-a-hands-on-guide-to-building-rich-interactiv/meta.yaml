    In each of the following examples, we work with the following HTML file that contains
    the main structures for allowing us to demonstrate the basic selectors and hierarchical
    selectors. To that purpose, the HTML files contain class assignments, IDs, child
    elements, descendants, and so on (ch5_1.html).'
