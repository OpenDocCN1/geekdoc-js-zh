    # 4.2 The jQuery Namespace and the jQuery Object


    A namespace designates a scope where a certain identifier is unique. You not only
    find this in programming but also, for example, in Extensible Markup Language
    (XML) (and in a file system). Directories can also be regarded as namespaces.
    Within a directory, a filename may only appear once. It has to be unique. But
    in different directories, you can have the same filename appearing repeatedly
    within a file system. This is the benefit of namespaces. You can use certain identifiers
    repeatedly with different meanings within a context, as long as they are in different
    namespaces.


    This is also useful in programming. In particular, if you want to combine functions
    and variables from different libraries. How would you keep programmers on different
    projects from giving the same names to certain functions or variables, causing
    a conflict when they are combined? If each project had its own namespace, you
    could avoid the conflicts.


    But JavaScript does not really support the concept of namespaces (in contrast
    to C# or Java, where namespaces are simply separated via dot notation). This namespace
    technique is effectively and robustly integrated into the overall concept, and
    a packet structure ensures a separation of namespaces.


    In JavaScript, you kind of have to act as if you were one of the "big" programming
    languages. So, to implement a namespace concept, you use the dot notation with
    its separation of object and property as a template and act as the components
    of an identifier'
