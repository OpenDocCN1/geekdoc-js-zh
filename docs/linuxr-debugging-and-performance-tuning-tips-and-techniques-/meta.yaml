    # Dumb Dialogs


    We define a “dumb” dialog to be a dialog whose widgets are set to their initial
    values by the dialog''s caller, and final values are obtained directly from the
    widgets, again by the dialog''s caller. A dumb dialog has no knowledge of what
    data its widgets are used to present and edit. We can apply some basic validation
    to a dumb dialog''s widgets, but it is not common (or always possible) to set
    up validation that incorporates interdependencies between widgets; in other words,
    form-level validation is usually not done in dumb dialogs. Dumb dialogs are normally
    modal dialogs with an “accept” button (e.g., OK) and a “reject” (e.g., Cancel).


    The main advantages of using dumb dialogs are that we do not have to write any
    code to provide them with an API, nor any code for additional logic. Both of these
    benefits are a consequence of all their widgets being publicly accessible. The
    main disadvantages are that the code that uses them is tied to their user interface
    (we access the widgets directly), so we cannot easily implement complex validation—and
    they are much less convenient than a standard smart dialog if needed more than
    one place.


    We will begin with a concrete example. Suppose we have a graphics application
    and want to let the user set some properties—for example, the pen’s width, style,
    and whether lines drawn with it have beveled edges. Figure 5.1 shows what we want
    to achieve.


    ![](bbox=[0.375, 0.648, 0.625, 0.758])


