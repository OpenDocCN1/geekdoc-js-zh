    ```

    >>> line = "The quick brown fox."

    >>> line.find("q")

    4

    ```


    The find() method returns the index position of the leftmost occurrence of the
    string it is given as an argument, the string it is applied to. It returns -1
    on failure.


    Python also provides an index() method that has identical usage, but which raises
    a ValueError exception on failure. Other sequence classes (such as lists) also
    have an index() method, so having for one gives consistency.


    Since we use either find() or index() on strings, is there any reason to prefer
    one over the other? For one-off searches, it is often convenient to use find()
    and just check the return value. But if we have a block of code we are performing
    lots of searches, using find() forces us to check the return value of every search,
    whereas index() allows us to assume the result is always valid, and if it isn''t,
    to handle any errors in a single exception handler. Of, if we don''t catch the
    exception, it will be passed up the call stack, and if it isn''t caught anywhere
    it will cause the application to terminate. We use both approaches throughout
    the book, whichever one is most appropriate on a case-by-case basis.


    ![](bbox=[0.883, 0.323, 0.952, 0.413])


    String methods can be applied to both strings and string literals:


    ```

    >>> ''malthusian catastrophe''.title()

    ''Malthusian Catastrophe''

    ```


    The title() method returns a string that is a copy of the string it is applied
    to, with the first letter of every word capitalized. Python provides string formatting
    of data types using a syntax that is similar to the C library''s printf() function.


    To achieve formatting we use the binary % operator, which takes a format string
    left-hand argument and a right-hand object (often a tuple of objects), which are
    to be formatted. For example:


    ![](bbox=[0.883, 0.672, 0.952, 0.704])


    ```

    >>> "There are % items" % 5

    ''There are 5 items''

    ```


    The %i in the string is replaced by the number 5. The letter following the % in
    a string format specifies the type of object that is expected, with %i signifying
    an integer.


    Here is an example that shows three different types being replaced, arrows showing
    which % item is replaced by which tuple element:


    ```

    >>> "We %s cost %f dollars" % (3, "fish", 17.49)

    ''The 3 fish cost 17.490000 dollars''

    ```'
