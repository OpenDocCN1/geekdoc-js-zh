  md: '# Chapter 6. Main Windows


    ![](bbox=[0.383, 0.096, 0.616, 0.332])


    Figure 6.8 The File menu with recently used files


    The approach to handling recently used files that we have taken here is just one
    of many possibilities. An alternative is to create the File menu just once, with
    a set of actions at the end for recently used files. When the menu is used, instead
    of being cleared and re-created, the actions aside for recently used files are
    simply hidden or shown, or in the latter case having their filenames updated to
    reflect the current set of recently used files. From the user''s point of view,
    there is no discernible difference whichever approach we take under the hood,
    so in either case the File menu will look similar to the one shown in Figure 6.8.


    Both approaches can be used to implement recently used files in a File menu, adding
    the list at the end as we have done in the Image Changer application, just before
    the Quit option. They can also be used to implement the Open Recent file option
    that has all the recent files as a submenu, as used by OpenOffice.org and some
    other applications. The benefits of using a separate Recent File option is that
    the menu is always the same, and full paths can be shown in the submenu—something
    we avoid when putting recently used files directly in the File menu so that it
    doesn''t become extremely wide (and, therefore, ugly).


