  md: '# Chapter 7. Using Qt Designer


    In this section, we have confined ourselves to using Qt Designer to create a custom
    dialog using one of the “Dialog” templates, since this is sufficient to learn
    the basics of how to use Qt Designer. However, Qt Designer can be used to create
    more complex dialogs than the one we have created, including dialogs with tab
    widgets and widget stacks that are often used for configuration dialogs that have
    dozens or even scores of options. It is also possible to extend Qt Designer with
    plug-ins that contain custom widgets. These widgets are normally written in C++,
    but PyQt 4.2, it is also possible to incorporate custom widgets in Python.


    The Qt documentation includes a comprehensive Qt Designer manual that goes into
    more depth and covers more of the facilities available. The material covered in
    this section is sufficient to get started, but the only way to learn Qt Designer
    properly is to use it.


    Having designed a user interface, the next step is to make it usable in our code.


    # Implementing Dialogs


    When we create a user interface with Qt Designer, we create a subclass using multiple
    inheritance in which we put the code we need to give the user interface behavior
    we need.* The first class we inherit is QDialog. If we were using the “Widget”
    template our first inherited class is QWidget, and if we were using the “Main
    Window” template our first inherited class is QMainWindow. The second class we
    inherit is the class that represents the user interface we designed using Qt Designer.


    In the preceding section, we created a user with a form object name of “FindAndReplaceDlg”,
    stored in the file findandreplaced.ui. We must run pyuic (directly, or via mkpy.py
    or Make Qt) to generate the ui_findandreplaced.py module. The module has a class
    in whose name is the form''s object name with a Ui_ prefix, so in this case the
    class name is Ui_FindAndReplaceDlg.


    We will call our subclass FindAndReplaceDlg, and put it in the file findandreplaced.py.


    Before we look at the class declaration and initializer, we will look at the imports.


    ```

    import re

    from PyQt4.QtCore import *

    from PyQt4.QtGui import *

    import ui_findandreplacedlg

    ```


    > *Other approaches are possible, and they are covered in the online documentation.
    None of them is quite convenient as the approach we use here, though.'
