    # Summary


    This chapter took us from being users of classes to creators of classes. We saw
    how to initialize newly created instances using the __init__() special method,
    and how to implement many of the other special methods so that our custom data
    types (classes) behave just like Python’s built-in classes. We also learned how
    to create both ordinary methods and static methods, and how to store and access
    both per-instance and static data.


    We reviewed two examples. The Length class, a numeric data type, and the OrderedDict
    class, a collection class. We also made use of much of the knowledge gained from
    the previous chapters, including some of Python’s advanced features, such as list
    comprehensions and generator methods.


    This chapter also showed how to do both single and multiple inheritance, and gave
    an example of how to create a simple interface class. We learned more about using
    isinstance() for type testing, and hasattr() and duck typing.


    We concluded the chapter with an overview of how Python modules and applications
    work. We also looked at the doctest module and saw how easy it is to create unit
    tests that like examples in our docstrings.


    We now know the Python fundamentals. We create variables, collections, and create
    our own data types and collection types. We can branch, loop, call functions and
    methods, and raise and handle exceptions. Clearly, there is a lot more to learn,
    but we can cover everything else we require as the need arises. We are now ready
    to start GUI application programming, a topic that begins in the next chapter
    and which occupies the rest of the book.'
