  md: '# Modules and Multifle Applications


    Object-oriented programming allows us to package up functionality (e.g., methods
    and data attributes), into classes. Python modules allow us to package up functionality
    at a higher level—for example, entire sets of classes, functions, and instance
    variables. A module is simple with a .py extension. Modules may have code that
    is executed when they are imported, but more commonly they provide functions and
    classes which are instantiated when they are imported. We have already seen examples
    of this: The Length class is in a file called length.py, and is therefore accessible
    as the length module. When importing a module, we specify the name of the module
    without the extension. For example:


    ```

    import length

    a = length.Length("4.5 yd")

    ```


    Only modules that are in the current directory, or in Python’s sys.path list,
    can be imported. If we need access to modules that are elsewhere in the filesystem,
    we can add additional paths to .path. In addition to a file, a module can be an
    entire directory of files. In these cases, the directory must contain a file __init__.py.
    This file can be (and often is) empty; it is simply used as a marker to tell Python
    that the directory contains .py files and the directory name is the top-level
    module name. For example we might create a directory mylibrary and put mylibrary.py,
    ordereddict.py, and an empty __init__.py in it. As long as we add the directory
    that contains the mylibrary directory to Python’s path, we could do this:


    ```

    import mylibrary.length

    a = mylibrary.Length("14.3 km")

    ```


    In practice, we might prefer to alias mylibrary.length to something shorter. For
    example:


    ```

    import mylibrary.length as length

    a = length.Length("948mm")

    ```


    Python’s module handling is a lot more sophisticated than we have shown, but what
    we have covered is sufficient for the GUI programming which is our main concern.*
    Python and PyQt applications can be written in a single file or be spread over
    multiple files. We will show both approaches in the coming chapters.


    > *The module import semantics are due to change in Python 2.7, with imports becoming
    absolute than relative. See http://www.python.org/dev/peps/pep-0328 for details.'
