  md: '# Introduction


    # mkpyqt.py and Make PyQt


    mkpyqt.py console application and the Make PyQt (mkpyqt.pyw) GUI application,
    are programs that run PyQt''s pyic4, pycc4, pyupdate4, and release programs for
    us. Both do exactly the same job, automatically using the correct command-line
    arguments to run PyQt''s helper programs, and they both check timestamps to avoid
    unnecessary work.


    ![](bbox=[0.223, 0.243, 0.772, 0.516])


    The build programs look for .ui files and run pyic4 to produce files with the
    same name but prefixed with .py. Similarly, they look for .qrc files and run pycc4
    on them prefixed with qrc_, and again with their extension changed to .py.


    For example, if we run mkpyqt.py in the chap06 directory, we get:


    ```

    C:\pychap06\..mkpyqt.py

    ./_weimagedlg.ui -> ./_weimagedlg.py

    ./_resources.qrc -> ./_qrc_resources.py

    ```


    The same thing can be achieved by running Make PyQt: click the Path button to
    C:\pychap06, and then click the Build button. If we make any changes we can simply
    run mkpyqt.py again, or click Build using Make PyQt, and any necessary updates
    will be made.


    Both build programs can delete the generated files for a fresh build, and both
    can work recursively on every directory using the -r option for mkpyqt.py or by
    checking the Recursive checkbox for Make PyQt. Run mkpyqt.py -h in a console for.
    The Make PyQt program has tooltips for its checkboxes and buttons. In some cases,
    it may be necessary to set the tool paths; click Menu->Tool paths, on the first
    use.'
