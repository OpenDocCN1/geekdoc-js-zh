  md: "# Using the doctest Module\n\nPython has considerable support for testing,\
    \ with the doctest and unittest modules for unit testing and the test module for\
    \ regression testing. PyQt also provides unit-testing functionality with the QtTest\
    \ module.\n\nWhen we create modules, such as the length and ordereddict modules\
    \ we wrote earlier, they are desired to be imported and the objects they provide\
    \ (e.g., the Length and OrderedDict classes), by using the import statement. Since\
    \ .py files can also be executables, we can easily include unit-testing code:\
    \ When the module is imported the unit-testing code is simply ignored; but when\
    \ the module is run the unit tests are executed. This approach is supported by\
    \ the doctest module.\n\nThe doctest module makes testing as simple and painless\
    \ as possible. To use all what we need is to add examples to our docstrings, showing\
    \ what we would type into the interactive Python interpreter (or IDLE) and what\
    \ response we expect back. For example, here is the OrderedDict class's get()\
    \ method in full:\n\n```\ndef get(self, key, value=None):\n    \"\"\"Returns the\
    \ value associated with key or value key isn't\n    in the dictionary\n\n>>> d\
    \ = OrderedDict(dict(s=1, a=2, n=3, i=4, t=5, y=6))\n>>> d.get(\"X\", 21)\n21\n\
    >>> d.get(\"i\")\n4\n\"\"\"\nreturn self._dict.get(key, value)\n```\n\nThe docstring\
    \ contains a brief description of the method's purpose, and then some examples\
    \ written as though they were typed into the interpreter. By creating an OrderedDict\
    \ object; we don't need to import or qualify since we are inside the ordereddict\
    \ module. We then write a call to a method we are testing and what the interpreter\
    \ (or IDLE) is expected to respond. And then we do another call and response.\n\
    \nThe doctest module uses this syntax because it is so familiar to Python programmers\
    \ through their use of the interactive Python interpreter or IDLE, or of any other\
    \ Python IDE, such as Eric4, that embeds a Python interpreter. When the tests\
    \ are run, the doctest will import the module itself, then read every docstring\
    \ (using Python's introspection capabilities) and then execute each statement\
    \ that begins with the >>> prompt. It checks the result against the expected output\
    \ (which may be nothing), and will report any failures."
