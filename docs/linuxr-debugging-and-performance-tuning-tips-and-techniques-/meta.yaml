    In this case, we don’t need “live” or interactive updating of the pen’s properties,
    so a modal dialog is sufficient. And since the validation required is quite simple,
    we can use a dumb dialog in this situation.


    We would use the dialog by popping it modally in a slot that is connected to a
    menu option, toolbar button, or dialog button. If the user clicked OK, we would
    then update our properties; if they clicked Cancel, we would do nothing. Here
