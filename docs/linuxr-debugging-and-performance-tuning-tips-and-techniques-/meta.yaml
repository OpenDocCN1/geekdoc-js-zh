    of updating. Modal dialogs are the easiest to program because they block any other
    interaction with the dialog''s parent windows and their sibling windows, reducing
    the risk that the data they are working on is changed from under them.


    But modeless dialogs are preferred by some users, and are particularly convenient
    when users want to try out various options before deciding which ones they want.
    Modal dialogs can also be used for this purpose; for example, font dialogs are
    often modal, and show sample text that reflects the user''s font settings as they
    change them.


    The validation strategies that we have looked at, post-mortem and preventative,
    can be used on their own or in combination. From a usability point of view, preventative
    is often considered to be superior, although it can lead to user frustration.
    For example, a user might claim “I want to to five but not let me” when the setting
    is invalid of another setting elsewhere on the form.


    Another possibility is to avoid using a dialog at all and to allow the user to
    edit data in-place—for example, in a list or table. This approach is covered in
    the chapters on model/view programming.


