    # # Introduction to GUI Programming


    In this chapter we begin with brief reviews of three tiny yet useful applications
    written in PyQt. We will take the opportunity to highlight some of the issues
    involved in GUI programming, but we will defer most of the details to later chapters.
    Once we have a feel for PyQt GUI programming, we will discuss PyQt’s “signals
    and slots” mechanism—this is a high-level communication mechanism for responding
    to user interaction that allows us to ignore irrelevant detail.


    Although PyQt is used commercially to build applications that vary in size from
    hundreds of lines of code to more than 100 000 lines of code, the applications
    we will build in this chapter are all less than 100 lines, and they show how much
    can be done with very little code.


    In this chapter we will design our user interfaces purely by writing code, but
    in Chapter 7, we will learn how create user interfaces using Qt’s visual design
    tool, Qt Designer.


    Python console applications and Python modules always have a .py extension, but
    for GUI applications we use a .pyw extension. .py works on Linux, but on Windows,
    .py ensures that Windows uses the python.exe interpreter instead of python, and
    this in turn ensures that when we execute a PyQt application, no unnecessary console
    window will appear.* On Mac OS X, it is essential to use the .py extension.


    The PyQt documentation is provided as a set of HTML files, independent of the
    Python documentation. The most commonly referred to documents are those covering
    the PyQt API. These files have been converted from the original C++/Qt documentation
    files, and their index page is called classes.html; Win-


    > *If you use Windows and an error message box title,"pythonw.exe- Unable To Locate
    Component" pops up, almost certainly means that you have not set your path correctly.
    See Appendix A, page 564, for how to fix this.'
