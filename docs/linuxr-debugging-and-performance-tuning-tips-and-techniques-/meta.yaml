  md: "# Functions\n\n```\ninc = 1.0\nif arg2 is not None:    # 3 arguments given\n\
    \    start = arg0\n    stop = arg1\n    inc = arg2\nelif arg1 is not None:   \
    \ # 2 arguments given\n    start = arg0\n    stop = arg1\nelse:\n    stop = arg0\
    \    # 1 argument given\n# Build and return a list\nresult = []\nwhile start <\
    \ (stop - (inc / 2.0)):\n    result.append(start)\n    start += inc\nreturn result\n\
    ```\n\nFor example, frange(5) returns [0.0, 1.0, 2.0, 3.0, 4.0], frange(5, 10)\
    \ returns [5.0, 6.0, 7.0, 8.0, 9.0], and frange(2, 5, 0.5) returns [2.5, 3.0,\
    \ 3.5, 4.0].\n\nThe loop condition is different from the one we used. It is designed\
    \ to prevent you from accidentally reaching the stop value due to floating-point\
    \ rounding errors.\n\nAfter the def line, we have a triple-quoted string—and the\
    \ string is not assigned to anything. An unassigned string that follows a def\
    \ statement—or the first thing in a .py or .py file that follows a class statement,\
    \ as we will see later in Part I—is called a \"docstring\". It is the natural\
    \ place to document functions. By convention, the first line is a brief summary,\
    \ separating the rest by a blank line.\n\nIn most of the examples shown in the\
    \ rest of the book, we will omit the docstrings they are included in the source\
    \ code that accompanies the book where appropriate.\n\nThe use of None is a more\
    \ convenient default than, say, 0 since 0 might be a legitimate upper bound. arg2\
    \ != None, but using it is not more efficient and better Python style. This is\
    \ because if we use identity comparison rather than value comparison, which is\
    \ fast because we are comparing two addresses and don't have to look at the objects\
    \ themselves. Python has one global None object, so comparing with it is or not\
    \ very fast.\n\nThe parameters passed to Python functions are always object references.\
    \ In the case of references to immutable objects like strings and numbers, we\
    \ can treat the parameters as though they were passed by value. This is because\
    \ if an immutable parameter is \"changed\" inside a function, the parameter is\
    \ simply bound to a new object, and the original object referred to is left intact."
