  md: "# Conditional Branching\n\n# Table 2.1 Logical Operations\n\n| Group | Operators\
    \ | Description |\n| --- | --- | --- |\n| Comparison | <\n\n```\nif x > 0:\\ \
    \   print x\n```\n\nIn this case, the suite is just one statement (print x). In\
    \ general, a suite is a single statement, or an indented block of statements (which\
    \ may contain nested suites), or the keyword pass which absolutely nothing. The\
    \ reason we need pass is because Python's syntax requires a suite, so if we want\
    \ to put in a suite, or indicate that we are handling a \"do nothing\" case, we\
    \ must use something, Python provides pass; for example:\n\n```\nif x == 5:\n\
    \    pass # do nothing in this case\n```\n\nIn general, whenever Python's syntax\
    \ has a colon followed by a suite, the suite can be on the same line if it is\
    \ just a single statement. For example:\n\n```\nif x == 5:    pass\n```\n\nIf\
    \ the suite is more than a single statement, it must begin on the following line\
    \ at the next level of indentation.\n\nPython supports the standard comparison\
    \ operators, and for logical operations it uses names (not, and, and or) rather\
    \ than symbols. It is also possible to combine comparison expressions in a way\
    \ that is familiar to mathematicians:\n\n```\nif 1 <= x <= 10:\n    print x\n\
    ```\n\nHere, we print x if it is between 1 and 10. If x is an expression with\
    \ no side effects, the above statement is equivalent to:\n\n```\nif 1 <= x and\
    \ x <= 10:\n    print x\n```"
