  md: 'When using PyQt we have access to an additional string type, QString. Unlike
    Python''s str and unicode, QString is mutable; this means that we can change QString
    in place, inserting and removing strings, and changing individual characters.
    QString has a rather different API from that provided by str and unicode. (Qt
    provides QString because Qt is written in C++, which does not yet have built-in
    Unicode support.)

    string holds Unicode characters, but depending on version of Python we are using,
    the internal representation may be different from Python''s Unicode representation;
    this doesn''t really matter, since PyQt can easily convert between unicode and
    QString. For example:


    ```

    >>> from PyQt4.QtCore import *

    >>> a = QString("apple")

    >>> b = unicode("baker")

    >>> print a + b

    appleaker

    >>> type(a + b)

    <class ''PyQt4.QtCore.QString''>

    ```


    Here we import all the classes from the QtCore module, available to us through
    the PyQt module. When we perform operations involving QStrings and Python strings,
    the resultant strings are always QStrings as the type() reveals.


    When using PyQt, Qt methods that take string arguments can be given str, unicode,
    or QString types, and PyQt will perform any necessary conversion automatically.
    Qt methods that return strings always return QStrings. In view of Python''s dynamic
    typing, we can easily become confused and not sure whether we have a QString or
    a Python string. For this reason, it is wise to decide on a policy for string
    usage so that we always know where we stand.


    The policy we use with PyQt is as follows:


    +   - Use str only when working strictly with 7-bit ASCII strings or with 8-bit
    data, that is, with raw bytes.

    - For strings that will be used only by PyQt functions, for example, strings that
    are returned by one PyQt function only to be passed at some point to another PyQt
    function—do not convert such strings. Simply keep them as QStrings.

    - In all other cases, use unicode, converting QStrings to unicode as soon as possible.
    In other words, as soon as a QString has been returned from a Qt function, always
    convert it to unicode.


    ![](bbox=[0.048, 0.66, 0.99, 0.72])


    This policy means that we avoid making incorrect assumptions about 8-bit string
    encoding (because we use Unicode). It also ensures that the strings we pass to
    PyQt functions have the methods that PyQt expects: QStrings have different methods
    from str and unicode, so passing them to Python functions'
