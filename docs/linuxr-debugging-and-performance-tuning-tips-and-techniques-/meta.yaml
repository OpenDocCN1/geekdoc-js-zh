  md: "# Exception Handling\n\n```\nexcept IndexError: pass\nexcept ValueError, e:\
    \ pass\nexcept (IOError, OSError), e: pass\nexcept: pass\n```\n\nIn the first\
    \ case we are asking to handle IndexError exceptions but do not require any information\
    \ about the exception if it is raised. In the second case we handle ValueError\
    \ exceptions, and we want the exception object (which is in variable e). In the\
    \ third case we handle both IOError and OSError exceptions, and if either occurs,\
    \ we also want the exception object, and again this is put in variable e. The\
    \ last case should not be used, since it will catch any exception: Using such\
    \ a broad exception handler is usually unwise because it will catch all kinds\
    \ of exception, including those we don't expect, thereby masking logical errors\
    \ in our code. Because we used pass for, if an exception is caught, no further\
    \ action is taken, and execution will continue until the finally block if there\
    \ is one, and then from the statement following the try block.\n\n![](bbox=[0.137,\
    \ 0.423, 0.862, 0.573])\n\n**Figure 2.1** *Some of Python's exception hierarchy*\n\
    \nIt is also possible for a single try block to have more than one exception handler:\n\
    \n```\ntry:\n    process()\n    except IndexError, e:\n        print \"Error:\
    \ %s\" % e\n    except LookupError, e:\n        print \"Error: %s\" % e\n```\n\
    \nThe order of the handlers is important. In this case, IndexError is a subclass\
    \ of LookupError, so if we had LookupError first, control would never pass to\
    \ the IndexError handler. This is because LookupError matches both itself and\
    \ its subclasses. Just like C++ and Java, when we have multiple exceptions for\
    \ the same try block they are examined in the order that they appear. This means\
    \ that we must order them from most specific to least specific. Some of Python's\
    \ exception hierarchy is shown in Figure 2.1; the least specific exception is\
    \ at the top, going down to the most specific at the bottom."
