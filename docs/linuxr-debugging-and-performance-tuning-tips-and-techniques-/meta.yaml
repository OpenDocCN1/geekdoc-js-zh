    \ the target is found, we raise the exception and handle that situation. If no\
    \ exception is raised, the try block's else block is executed.\n\nIn some situations,\
    \ we want some cleanup to be called no matter what. For example we may want to\
    \ guarantee that we close a file or a network or database connection even if our\
    \ code has a bug. This is achieved using a try... finally, as the next example\
    \ shows:\n\n```\nfilehandle = open(filename)\ntry:\n    for line in filehandle:\n\
    \        process(line)\nfinally:\n    filehandle.close()\n```\n\nHere we open\
    \ a file with the given filename and get a file handle. We then iterate over the\
    \ file—which is a generator and gives us one line at a time in the context of\
    \ a for loop. If any exception occurs, the interpreter looks for the except or\
    \ finally that is nearest in scope. In this case, it does not find an exception,\
    \ but it does find a finally, so the interpreter switches to the finally and executes\
    \ it. If no exception occurs, the finally block will be executed after the try\
    \ suite has finished. So either way, the file will be closed.\n\nPython versions\
    \ prior to 2.5 do not support try ... except ... finally blocks. If we need both\
    \ except and finally we must use two blocks, a try ... except and a try ... finally,\
    \ with one nested inside the other. For example, in Python versions up to 2.4,\
    \ the most robust way to open and process a file is like this:\n\n```\nfh = None\n\
    try:\n    fh = open(filename)\n    process(fh)\nexcept IOError, e:\n    print(\"\
    I/O error: %s\") % e\n```\n\n```\nfinally:\n    if fh:\n        fh.close()\n```"
