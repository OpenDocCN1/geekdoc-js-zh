  md: "# A Pop-Up Alert in 25 Lines\n\nIn PyQt, any widget can be used as a top-level\
    \ window, ever button or a label. When a widget is used like this, PyQt automatically\
    \ gives it a title bar. We don't want a title bar for this application, so we\
    \ set the label's flags those used for splash screens which they have no title\
    \ bar. We have set up the label to be our window, we call show() on it. The call\
    \ to show() merely schedules a \"paint event\", that is, adds a new event to the\
    \ QApplication's event queue which is a request to paint the specified widget.\n\
    \nNext, we set up a single-shot timer. Whereas the Python library's time.sleep()\
    \ function takes a number of seconds, the QTimer.singleShot() function takes a\
    \ number of milliseconds. We give the singleShot() method two arguments: how long\
    \ until it times out (one minute in this case), and a function or method for it\
    \ to call it times out.\n\nIn PyQt terminology, the function or method we have\
    \ given is a \"slot\", although in the PyQt documentation the terms \"callable\"\
    , \"Python slot\", and \"Q slot\" are used to distinguish slots from Python's\
    \ _, a feature of new-style classes that is described in the Python Language Reference.\
    \ In this book we will use the PyQt terminology, since we never use slots_.\n\n\
    Now we have two events scheduled: A paint event that wants to take place immediately,\
    \ and a timer timeout event that takes place in a minute's time.\n\nThe call to\
    \ exec_() starts off the QApplication's event loop. The first event it gets is\
    \ the paint event, so the label window pops up on-screen with the given message.\
    \ About one minute later the timeout event occurs and the QApplication.quit()\
    \ method is called. This method performs a clean termination of the GUI application.\
    \ It closes any open windows, frees up any resources it has acquired, and exits.\n\
    \nEvent loops are used by all GUI applications. In pseudocode, an event loop looks\
    \ like this:\n\n```\nwhile True:\n    event = getNextEvent()\n    if event:\n\
    \        if event == Terminate:\n            break\n        processEvent(event)\n\
    ```\n\nWhen the user interacts with the application, or when other things occur,\
    \ such as a timer out or the application's window being uncovered (maybe another\
    \ application was closed), an event is generated inside PyQt and added to the\
    \ event queue. The application's event loop continuously\n\n> *PyQt uses exec_()\
    \ rather than exec() to avoid conflicting with Python's built-in exec statement."
