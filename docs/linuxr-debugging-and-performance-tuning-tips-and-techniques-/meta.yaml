  md: "# Conditional Branching\n\nPython 2.5 introduced a conditional expression.\
    \ It is a kind of if statement that can be used in expressions, and it is equivalent\
    \ to the ternary operators used by other languages. The Python syntax is different\
    \ from C++s and Java's, which use ? : for ternary operators, and it has the form\
    \ trueResult if expression falseResult; so the expression is in the middle:\n\n\
    ```\nprint \"x is zero or positive\" if x >= 0 \"x is negative\"\n```\n\nThis\
    \ will print \"x is zero or positive\" if x >= 0 evaluates to True; otherwise,\
    \ it will print \"x is negative\".**\n\n# Looping\n\nPython provides two loop\
    \ constructs. One is the while loop, whose basic syntax is:\n\n```\nwhile expression:\n\
    suite\n```\n\nHere is an example:\n\n```\ncount = 10\nwhile count != 0:\n  print\
    \ count,\n  count -= 1\n```\n\nThis will print \"1098765432\"—all on one line,\
    \ due to the print statement's trailing comma. Notice that we have a colon before\
    \ the indented suite.\n\nLoops can be broken out of prematurely, using the break\
    \ statement. This is particularly helpful in loops which will not otherwise terminate,\
    \ that is, because their conditional expression is always true:\n\n```\nwhile\
    \ True:\n  item = getNext()\n  if not item:\n    break\n  processItem(item)\n\
    ```\n\nPython's while loop can also have an associated else statement using the\
    \ following syntax:\n\n```\nwhile expression:\n  suite\nelse:\n  suite2\n```\n\
    \n> * Kuchling, author of the \"What's New in Python\" documents, recommends always\
    \ using parentheses with conditional expressions. In this book, we use them only\
    \ when necessary."
