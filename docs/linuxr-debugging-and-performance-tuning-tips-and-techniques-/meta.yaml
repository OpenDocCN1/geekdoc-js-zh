  md: "# Functions 59\n\nBecause the function is a generator (and this is the case\
    \ purely because we have used yield), when it finishes it does not return a value,\
    \ but instead raises a StopIteration exception. In the context of a for loop,\
    \ the gracefully handles this particular exception, taking it not as an error,\
    \ but as an indication that the iteration has completed, so the for loop ends\
    \ and the flow of control moves to the loop's else suite, or to the statement\
    \ following the loop's suite, if there is no else. Similarly, if we coerce a generator\
    \ into a list, the constructor will automatically handle the StopIteration exception.\n\
    \nA generator is an object that has a next() function, so we can explore the behavior\
    \ of our frange() generator interactively if we wish:\n\n```\n>>> list(frange(1,\
    \ 3, 0.75))\n[1, 1.75, 2.5]\n>>> gen = frange(1, 3, 0.75)\n>>> gen.next()\n1\n\
    >>> gen.next()\n1.75\n>>> gen.next()\n2.5\n>>> gen.next()\nTraceback (most recent\
    \ call last):\nFile <psyshell#126>, line 1, in -topoplevel-\n  gen.next()\nStopIteration\n\
    ```\n\nWe generated the whole three-item list using list(), and then we used the\
    \ generator returned by frange() to produce each successive value in the same\
    \ way that a for loop does.\n\n# Using Keyword Arguments\n\nPython's argument-handling\
