    perhaps changing their choices a few times until they are satisfied. These\nsituation\
    \ dialogs may be inconvenient since the user must invoke the\ndialog, perform\
    \ their edits, see the results, and then repeat the cycle\nuntil they are happy.\
    \ If the dialog is modelless and was able to update the\napplication's state without\
    \ being closed, the user could simply invoke the dialog\nonce, perform their edits,\
    \ see the effects, and then do more edits, and so on:\nmuch faster cycle. We will\
    \ see how to achieve this in the next section; we will\nalso look at a much simpler\
    \ and more active validation strategy—preventative\nvalidation.\n\n# Smart Dialogs\n\
    \nWe define a “smart” dialog to be one that initializes its widgets in accordance\n\
    with data references or data structures that are passed to its initializer, and\n\
    is capable of updating the data directly in response to user interaction.\n dialogs\
    \ can have both widget-level and form-level validation. Smart\ndialogs are usually\
    \ modelless, with “apply” and “close” buttons, although they\ncan also be “live”,\
    \ in which case they may have no buttons, with changes to\nwidgets reflected directly\
    \ into the data they have access to. Smart dialogless\n\nTable 5.3 Selected QDialog\
    \ Methods\n\n| Syntax | Description |\n| --- | --- |\n| d.accept() | Closes (hides)\
    \ QDialog, stops its event loop, and causes\nexec () to return with a True value.\
    \ The dialog is deleted\nif Qt.WAClose is set |\n| d.reject() | Closes (hides)\
    \ QDialog, stops its event loop, and causes\nexec () to return with a False value\
    \ |\n| d.done(i) | Closes (hides) QDialog, stops its event loop, and causes\n\
    exec () to return int i |\n| d.exec() | Shows QDialog modally, blocking until\
    \ it is closed |\n| d.show() | Shows QDialog modellessly; inherited from QWidget\
    \ |\n| d.setSizeGripEnabled(b) | Shows or hides QDialog's size depending on bool\
    \ b |"
