  md: '# 4 Introduction


    Part II begins by showing three tiny PyQt GUI applications to give an initial
    impression of what PyQt programming is like. It also explains some of the fundamental
    concepts in GUI programming, including PyQt''s high-level signals and slots communication
    mechanism. Chapter 5 shows how to create dialogues and how to lay out widgets
    (“controls” in Windows-the graphical elements that make up a user interface such
    as buttons, listboxes, and such) in dialog. Dialogs are central to PyQt programming:
