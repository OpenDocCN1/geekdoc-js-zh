  md: "# Functions\n\n```\ndef partial(func, arg):\n    def callme():\n        return\
    \ func(arg)\n    return callme\n```\n\nInside the partial() function we create\
    \ an inner function, callme(),that, when called, will call the function and argument\
    \ that were passed to the partial() function. After creating the callme() function,\
    \ we then return an object reference to it so it can be called later.\n\nThis\
    \ means that we can now write:\n\n```\nbuttonOneFunc = partial(action, \"One\"\
    )\nbuttonTwoFunc = partial(action, \"Two\")\n```\n\nIdeally it would be nice to\
    \ use functions.partial() when it is available, and fall back on our simple partial()\
    \ function otherwise. Well, since we can define functions at runtime, this is\
    \ perfectly possible:\n\n```\nimport sys\nif sys.version.info[:2] < (2, 5):\n\
    \    def partial(func, arg):\n        def callme():\n            return func(arg)\n\
    else:\n    from functools import partial\n```\n\nThe statement ensures that if\
    \ we are using a version of Python older than 2.5 we create a partial() function\
    \ that takes a function and a single argument and returns a function that, called,\
    \ will call the function passed in the argument. But if we are using a later version\
    \ of Python, we use the functools.partial() function, in our code we can call\
    \ partial(), and whichever version was created will be the one used.\n\nNow, as\
    \ just before, we can write:\n\n```\nbuttonOneFunc = partial(action, \"One\")\n\
    buttonTwoFunc = partial(action, \"Two\")\n```\n\nOnly this time code will work\
    \ with both old and new versions of Python.\n\nThe partial() function we have\
    \ defined is just about the simplest possible. It is also possible to create much\
    \ more sophisticated wrappers that can take positional and keyword arguments at\
    \ the time they are wrapped, and additional positional and keyword arguments at\
    \ the time they are called; functionality that functools.partial() already provides.\
    \ We use partial() in several places from Part II onward, but in each case the\
    \ simple partial() function shown in this section could be used if Python 2.5\
    \ or later was not available."
