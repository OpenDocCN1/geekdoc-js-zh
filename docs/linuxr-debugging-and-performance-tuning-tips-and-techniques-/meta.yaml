  md: '# The IDLE Development Environment


    The full installation of Python IDLE, includes a basic but very useful integrated
    development environment. When IDLE is launched (click Start→All Programs Python→2.x→IDLE
    on Windows, or click Finder→Applications→Python 2.x on Mac OS, or run idle & in
    a console on Linux), it presents its Python shell.


    As the screenshot in Figure 1.1 shows, IDLE has a retro look. This is because
    it is written in Tkinter rather than in PyQt. We''ve chosen to use IDLE because
    IDLE comes as standard with Python and is modern-looking IDLE. If you want to
    use a much more powerful and simple to use, you might prefer Eric which is written
    in PyQt, or one of the other Python IDEs that are available. However, if you are
    new to Python, we recommend that you start with the simpler IDLE, and once you
    are more experienced with PyQt, then trying the other IDEs to see which one you
    prefer. And of course, you could simply use a plain text editor and debug using
    print statements and not use an IDE at all.


    IDLE provides three key facilities: the ability to enter Python expressions and
    code to see the results in the Python Shell; a code editor that provides Python-specific
    color syntax highlighting; and a debugger that can be used to step through code
    to help identify and kill bugs. The Python Shell is especially useful for trying
    out simple algorithms, snippets of code, and regular expressions, and can also
    be used as a very powerful flexible calculator.


    # Executing Python Code


    Before we can really explore the Python language we need to know how to execute
    Python code. We will show this by reviewing a tiny example that is just one line
    long.


    We use a plain text editor for working with Python files.* On Windows it is possible
    to use Notepad, but IDLE includes a suitable Python designer specifically for
    editing Python code: Simply start IDLE and then click File→New Window.


    We will type the following line into a file, called hello.py:


    ```

    print("Hello World")

    ```


    Note that no semicolon is necessary: In Python newline acts as a statement separator,
    we do not need a newline, "\n", in the string, since print automatically adds
    a newline unless we suppress it with a trailing comma.


    > *The programs in this book are written using ASCII characters, with escape sequences
    when required. It is possible to use Latin-1, UTF-8, or other encodings for strings
    and comments in Python programs, as explained in the documentation under "Encoding
    declarations".'
