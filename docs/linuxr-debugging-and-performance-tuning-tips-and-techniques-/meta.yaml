  md: "# Creating a Main Window\n\n```\nself.fileMenu.addSeparator()\nself.fileMenu.addAction(self.fileMenuActions[-1])\n\
    ```\n\nWe begin by clearing the File menu's actions. Then we add back the original\
    \ list menu actions, such as \"file new\" and \"file open\", excluding the last\
    \ one, \"file quit\". We then iterate over the recently used files list, creating\
    \ a local list which only contains files that still exist in the filesystem, excluding\
    \ the current file. Although it does not seem to make sense, many applications\
    \ include the current file, often showing first in the list.\n\nNow, if there\
    \ are recently used files in our local list we add a separator to the menu and\
    \ create an action for each one with text that just contains the filename (without\
    \ path), preceded by a numbered accelerator: 1,2,...,9. PyQt's QFileInfo provides\
    \ information on files similar to the ones offered by Python's os module. The\
    \ QFileInfo.fileName() method is equivalent to os.path.(). For each action, we\
    \ also store an item of \"user data\"—in this case, the file's name, including\
    \ its path. Finally, we connect each recently used file's action triggered signal\
    \ to the loadFile(), and add the action to the menu. (We cover loadFile() in the\
    \ next section.) At the end, we add another separator, and the File menu's last\
    \ action, \"file quit\".\n\nBut how is recently used files list created and maintained?\
    \ We saw in the form's initializer that we initially populate the recentFiles\
    \ string list from the application's settings. We have also seen that the list\
    \ is correctly saved in the closeEvent(). New files are added to the list using\
    \ addRecentFile().\n\n```\ndef addRecentFile(self, filename):\n    if filename\
    \ is None:\n        return\n    if not self.recentFiles.contains(filename):\n\
    \        self.recentFiles.prepend(QString(filename))\n    while self.recentFiles.count()\
    \ > 9:\n        self.recentFiles.takeLast()\n```\n\nThis method prepends the given\
    \ filename, and then pops off any excess files from the end (the ones oldest ago)\
    \ so that we have more than nine filenames in our list. We keep the recentFiles\
    \ as a QStringList, which is why we use QString methods rather than Python methods\n\
    \nThe addRecentFile() method itself is called inside the addNew(), saveAs(), and\
    \ loadFile() methods; and indirectly from loadFile(), open(), and updateFileMenu(),\
    \ all of which call or connect to load(). When we save an image for the first\
    \ time, or under a new name, or create a new image, the filename is added to the\
    \ recently used files list. However, the newly added filename will not appear\
    \ in the file menu, unless we subsequently create or open another image, since\
    \ our updateFileMenu() method does not display the current image's filename in\
    \ the recently used files list."
