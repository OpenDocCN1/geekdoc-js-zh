  md: "In the next section, we will continue to take a fairly high-level view of functions,\
    \ and look at the possibilities that are available to us for the notification\
    \ and handling of error conditions.\n\n# Exception Handling\n\nMany primers push\
    \ exception handling quite far back, often after covering object-oriented programming.\
    \ We put them here in the control structures chapter because exception handling\
    \ is relevant in both procedural and object-oriented programming, and because\
    \ exception handling can cause the flow of execution to change dramatically, which\
    \ certainly qualifies exception handlers as a kind of control structure.\n\nAn\
    \ exception is an object that is \"raised\" (or \"thrown\") under some specific\
    \ circumstances. When an exception is raised, the normal flow of execution ceases\
    \ and the interpreter looks for a suitable exception handler to pass the exception\
    \ to. It begins by looking at the enclosing block and works its way out. If no\
    \ suitable exception handler is found in the current function, the interpreter\
    \ will go up the stack, looking for a handler in the function's caller, and if\
    \ it fails in the caller's caller, and so on.\n\nAs the interpreter searches for\
    \ a suitable exception handler, it may encounter finally blocks; any such blocks\
    \ are executed, after which the search for an exception handler is resumed. (We\
    \ use finally blocks for cleaning up—for example, to ensure that a file is closed,\
    \ as we will see shortly.)\n\nIf a handler is found, the interpreter passes control\
    \ to the handler, and execution continues from there. Having gone all the way\
    \ up the stack to the top level, no handler is found, the application will terminate\
    \ and report the exception that was caused.\n\nIn Python, exceptions can be raised\
    \ by built-in or library functions and methods, or by us in our code. The exceptions\
    \ that are raised can be any of the built-in exception types or our custom exception\
    \ types.\n\nException handlers are blocks with the general syntax:\n\n```\ntry:\n\
    \    suite1\n    except exceptions:\n    suite2\n    else:\n    suite3\n```\n\n\
    The code in suite1 is executed, and if an exception occurs, control will pass\
    \ to the except statement. If the except statement is suitable, suite2 will be\
    \ executed; we will discuss what happens otherwise shortly. If no exception occurs,\
    \ suite3 is executed after suite1 is finished.\n\nThe except statement has more\
    \ than one syntax; here are some examples:"
