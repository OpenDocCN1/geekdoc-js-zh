  md: '# Creating a Main Window


    We begin by creating a QSettings object. Since we passed no arguments, the names
    held by the application object are used to locate the settings information. We
    begin by retrieving the recently used files list. The QSettings::value() method
    always returns QVariant, so we must convert it to the data type we are expecting.


    Next, we use the two-argument form of value(), where the second argument is a
    default value. This means that the first time the application runs, it has no
    settings at all, so we will get a QSize() object with a width of 600 pixels and
    a height of 500 pixels.* On subsequent runs, the size returned will be whatever
    the size of the main window was when the application was terminated—so long as
    we remember to save the size when the application terminates.—so we have a size,
    we resize the main window to get the size. After getting the previous (or) size,
    we retrieve and set the position in exactly the same way.


    There is no flickering, because the resizing and positioning are done in the main
    window''s initializer, before the window is actually shown to the user.


    Qt 4.2 introduced two methods for resizing and restoring a top-level window''s
    geometry. Unfortunately, a bug meant that they were not reliable in all situations
    on X11-based systems, and for this reason we have restored the window''s size
    and position as separate items. Qt 4.3 has fixed this bug, so with Qt 4.3 (e.g.,
    with PyQt 4.3), instead of retrieving the size and position by calling resize()
    and move(), everything can be done using a single line:


    ```

    self.restoreGeometry(settings.value("Geometry").toByteArray())

    ```


    This assumes the geometry was saved when the application was terminated, and we
    will see when we look at the closeEvent().


    The MainWindow class provides a restoreState() method and a setState() method;
    these methods restore from state and save to a QByteArray. The data they save
    and restore are the dock window sizes and positions—but they work only for dock
    widgets and toolbars that have unique object names.


    After setting the window''s title, we call updateMenu() to create the File menu.
    Unlike the other menus, the File menu is generated dynamically; so that it can
    show(). The connection from the File menu''s aboutToShow() to updateMenu() method
    means that the File menu is created whenever the user clicks the menu bar, or
    presses Alt+F—but until this method has been called for the first time, the File
    menu does not exist—which means the keyboard shortcuts for actions that have not
    been added to a toolbar, such as Ctrl+Q for "file quit", will not work. In this
    of view, we explicitly call updateMenu() to create an initial File menu and activate
    the keyboard shortcuts.


    *PyQt 4 gives units of measurement because it is assumed that the units are pixels,
    except for QPrinter, which uses points.'
