  md: '# Introduction


    This book teaches how to write GUI applications using the Python programming language
    and the Qt application development framework. The only essential prior knowledge
    is that you can program in some object-oriented programming language, such as
    C++, C#, Java, or of course, Python itself. For the rich text chapter, some familiarity
    with HTML and with regular expressions are assumed, and the databases and threading
    chapters assume some basic knowledge of these topics. A knowledge of GUI programming
    is not required, since all the key concepts are covered.


    The book will be useful to people who program professionally as part of their
    job, whether as full-time software developers, or those from other disciplines,
    including scientists and engineers, who need to do some programming in sport of
    their work. It is also suitable for undergraduate and post-graduate students,
    particularly those doing courses or research that includes a substantial computing
    element. The exercises (with solutions) are provided especially to help students.


    Python is probably the easiest to learn and nicest scripting language in widespread
    use, and Qt is the best library for developing GUI applications. The combination
    of Python and Qt "PyQt," makes it possible to develop applications on any supported
    platform—for example, all modern versions of Windows, Linux, Mac OS X, and most
    Unix-based systems. No compilation is required for Python to be interpreted, and
    no source code changes to adapt to different operating systems are required thanks
    to Qt abstracting away the platformspecific details. We only have to copy the
    source file or files to a target machine that has both Python and PyQt installed
    and the application will run.


    If you are new to Python: Welcome! You are about to discover a language that is
    clear to read, and that is concise without being cryptic. Python supports many
    programming paradigms, but because our focus is on GUI programming, we will take
    an object-oriented approach everywhere except in the early chapters.


    Python is a very expressive language, which means that we can usually write fewer
    lines of Python code than would be required for an equivalent application written
    in, C++ or Java. This makes it possible to show some small but complete examples
    throughout the text, and makes PyQt an ideal tool for rapidly and easily developing
    GUI applications, whether for prototyping or for production use.'
  merge: -1
  pgno: 15
- img_proc: false
  md: '# Introduction


    ![](bbox=[0.133, 0.093, 0.866, 0.458])


    Figure 1 The Eric4 IDE—a PyQt4 application


    The emphasis of the book is on GUI programming, Part I provides a fast-paced tutorial
    as well as some PyQt coverage. This material is clearly marked (like this paragraph,
    with “Qt” in the margin) to make it easy for experienced programmers to skip the
    parts they already know. Parts II, III, and IV of the book are all PyQt-specific
    and assume that readers can easily program in Python, whether from previous experience
    or from reading Part I.


    Often in programming we reach decision points when there are several approaches
    we could take. Reference books and the online documentation identify what classes,
    methods, and functions are, and in some cases provide examples, but such documents
    rarely provide a broader context. This book gives the necessary context, highlighting
    the key decision points for GUI programming and offering insights into the pros
    and cons so you can decide for yourself what the right policy is for your particular
    circumstances. For example, when you create a dialog, should it be modal or modeless?
    (See Chapter 5 for an explanation and policy recommendations on this issue.)


    PyQt is used to write all kinds of GUI applications, from applications to visualization
    tools used by scientists and engineers. Figure 1, for example, a powerful integrated
    development environment that is written in PyQt. It is possible to write PyQt
    applications that are just tens of lines long, and medium-size projects of 1000
    to 10000 lines are very common. Some commercial companies have built 100 000-line
    PyQt applications, with'
  merge: -1
  pgno: 16
- img_proc: false
  md: '# Introduction


    programming teams varying in size from just one person to more than a dozen people.
    Many in-house tools are written using PyQt, but because these are used to gain
    competitive advantage, the companies involved generally do not permit their use
    of PyQt to be public. PyQt is also used in the open source world, with games,
    utilities, visualization tools, and IDEs all written using it.


    This book is specifically about PyQt4, the Python bindings for the Qt 4 C++ application
    development framework.* PyQt4 is provided in the form of ten Python modules between
    which they contain around 400 classes and about 6000 methods and functions. All
    the example programs have been tested on Windows, Linux, and Mac OS X, using Python
    2.5, Qt 4.2, and PyQt 4.2, and additionally on Windows and Linux using Qt 4.3
    and PyQt 4.4. Backporting to earlier versions is possible in some cases, but we
    recommend using the most-to-date versions of Python, Qt, and PyQt.


    Python, PyQt, and Qt can be used free of charge for noncommercial purposes, but
    the license used by Python is different from that by PyQt and Qt. Python is available
    with a very liberal license that allows it to be used to develop both commercial
    and noncommercial applications. PyQt and Qt are dual-licensed:This essentially
    allows them to be develop noncommercial applications—which must in turn be licensed
    using an acceptable open source license such as the GNU General Public License
    (GPL); or to be used to develop commercial applications—in this case, a commercial
    PyQt license and a commercial Qt license must be purchased.


    # The Structure of the Book


    The book is divided into four parts. Part I is primarily a rapid course aimed
    at non-Python programmers who are familiar with an object-oriented language, although
    it has some (clearly marked) PyQt content. Because the core Python language is
    mostly simple and is quite small, these chapters can teach the basics of Python
    to a sufficient extent that real Python applications can be written.


    If you think you can pick up the Python syntax simply through reading, it might
    be tempted to skip Part I and dive straight into the GUI programming that begins
    in Part II. The early chapters in Part II include backreferences to the relevant
    pages in Part I to support readers who choose this approach. However, even for
    readers familiar with Python, we recommend reading about Qt in Chapter 1. If you
    are unfamiliar with partial function application (currying), it is important to
    read the subsection that covers this in Chapter 2, since this technique is sometimes
    used in GUI programming.


    > *There are also PyQt bindings for the older Qt 3 library, but there is no reason
    to use that for new projects, especially since Qt 4 offers far more functionality
    and is easier to use.'
  merge: -1
