    \ _area(self):\n        return self.width * self.height\n    area = property(fget=\\\
    _area)\n```\n\nThis allows us to create code like this:\n\n```\nrect = Rectangle(5,\
    \ 4)\nprint rect.width, rect.height, rect.area  # Prints (5, 4, 20)\nrect.width\
    \ = 6\n```\n\nPython's property() function can be used to specify a getter, a\
