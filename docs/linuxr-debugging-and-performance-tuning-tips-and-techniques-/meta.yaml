  md: 'We are not using testing tools, adding testing code that is executed only if
    the form is run stand-alone does not affect the performance of our dialogs, and
    can be very convenient during development and maintaining a dialog. If complex
    objects the dialog depends on are not available, we can often create a "fake"
    class that provides the same methods as the complex object, and pass an instance
    of the fake class for testing purposes.


    All PyQt programs can be written by hand; here use Qt Designer. However, designing
    dialogs with a visual tool can be very helpful, since changes to designs can be
    made quickly and easily. Another benefit of using Qt Designer is that a lot of
    fairly repetitive code for creating, laying out, and connecting widgets can be
    automatically generated rather than written by hand. Qt Designer was used to create
    a dialog in this chapter, and the preceding one. We will see many more examples
    of dialogs created with Qt Designer in the following chapters.


    # Exercise


    Use Qt Designer to create a user interface with one of the designs shown in Figure
    7.11, or with a design of your own. You will probably need to use a Grid Layout,
    as Vertical and Horizontal Layouts. For grid layouts, you may have to try a few
    times, perhaps resizing and positioning widgets to help Qt Create the dialog you
    want. QDialogButtonBoxes for the buttons.


    ![](bbox=[0.129, 0.532, 0.869, 0.683])


    The price spinbox should have a range of 0.00-5000.00, be right-aligned and have
    a prefix of "$ ", as shown in Figure 7.11. The quantity spinbox should have a
    range of 1-50 and also be right-aligned. Set the date format to be whatever you
    prefer if you don''t like the.


    The widgets you will refer to in code should have sensible names—for example,
    customerEdit and priceSpinBox.


    Make the appropriate buddies, that is, from the "customer" Label to its Line Edit,
    from the "when" Label to the Date Time Edit, and so on. Also make sure that the
    Tab order is customer, when date, price, quantity, button box.'
