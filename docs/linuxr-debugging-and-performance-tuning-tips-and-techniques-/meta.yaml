  md: "Looping\n\nadvanced and relatively new feature of Python, cannot easily be\
    \ mimicked. We will create a simple generator function in the next section, and\
    \ some very short generator methods in an example class in Chapter 3.\n\n# Functions\n\
    \nIn general, functions allow us to package up and parameterize commonly used\
    \ functionality. Python provides three types of functions: ordinary functions,\
    \ lambda functions, and methods. In this section, we will concentrate on ordinary\
    \ functions, with a very brief mention of lambda functions; we will cover methods\
    \ in Chapter 3.\n\nIn Python, every function has either \"global\" or \"local\"\
    \ scope. Broadly speaking, global scope means that the function is visible within\
    \ the file in which it is defined and accessible from any file that imports it.\
    \ Local scope means that the function was defined inside another scope (e.g.,\
    \ inside another function) and is visible only within the enclosing local scope.\
    \ We will not concern ourselves further with this issue here, but return to it\
    \ in Chapter 3.\n\nFunctions are defined using the def statement, using the syntax:\n\
    \n```\ndef functionName(optional_parameters):\n    suite\n```\n\nFor example:\n\
    \n```\ndef greeting():\n    print \"Welcome to Python\"\n```\n\nThe function name\
    \ must be a valid identifier. Functions are called using parentheses, so to execute\
    \ the greeting() function we do this:\n\n```\ngreeting()          # Prints \"\
    Welcome to Python\"\n```\n\nA function name is an object reference to the function,\
    \ and like any other object reference it can be assigned to another variable or\
    \ stored in a data structure:\n\n```\ng = greeting\ng()          # Prints \"Welcome\
    \ to Python\"\n```\n\nThis makes keeping lists or dictionaries of functions trivial\
    \ in Python.\n\nFunctions that accept parameters can be given by the parameter\
    \ values by position (\"positional arguments\\ by name (\"keyword arguments\"\
    ; but nothing to do with the language's keywords), or by a combination of both.\
    \ Let us look at a concrete example: Python does not provide a range() function\
    \ that operates on floats, so we will create one ourselves."
