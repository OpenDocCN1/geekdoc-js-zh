  md: "# Exception Handling\n\nThis code makes use of things we have already discussed,\
    \ but to make sure we have a firm grip on exception handling, we will consider\
    \ the code in detail.\n\nIf the file cannot be opened in the first place, the\
    \ except block is executed and then the finally block—which will do nothing since\
    \ the file handler will still be None because the file could not be opened. On\
    \ the other hand, if the file is opened and processing commences, there might\
    \ be an I/O error. If this happens, the except block is executed, and again control\
    \ will pass to the finally block, and the file will be closed.\n\nIf an exception\
    \ occurs that is not an IOError or an OSError subclass, for example, a ValueError\
    \ in our process() function—the interpreter will consider the except block to\
    \ be unsuitable and will look for the nearest enclosing exception handler that\
    \ is suitable. As it looks, the interpreter will first encounter the finally block\
    \ which will then execute, after which, (i.e., closing the file), it will then\
    \ look for a suitable exception handler.\n\nIf the file is opened and processing\
    \ completes with no exception raised, the except block is skipped, but the finally\
    \ block is still executed since finally blocks are executed matter what happens.\
    \ So, in all cases, apart from the interpreter being killed by the user (or, in\
    \ very rare cases, crashing), if the file was opened, it will be closed.\n\nIn\
    \ Python 2.5 and later, we can use a simpler approach that has the same semantics\
    \ because we can try ... except ... finally blocks:\n\n```\nfh = None\ntry:\n\
    \    fh = open(fname)\n    process(fh)\nexcept IOError, e:\n    print(\"I/O error:\
    \ %s\" % e)\nfinally:\n    if fh:\n        fh.close()\n```\n\nUsing this syntax,\
    \ it is still possible to have an else block for when no exception occurred; it\
    \ is placed after the last except block and before the one and only finally block.\
    \ We will revisit this topic in the context of files in Chapter 6.\n\nNo matter\
    \ version of Python we use, finally blocks are always executed whether an exception\
    \ occurs or not, exactly once, either when the try is finished, or when an exception\
    \ is raised that shifts the flow of control outside the try block.\n\nPython 2.6\
    \ (and Python 2.5 with a __future__import_with_statement) offers another approach\
    \ entirely: \"context managers\". For handling, we prefer the try ... finally\
    \ approach, but in other cases, we prefer context managers for locking and unlocking\
    \ read/write locks used by threads in Chapter 19."
