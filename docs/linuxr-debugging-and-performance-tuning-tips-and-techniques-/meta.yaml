  md: '# An Expression Evaluator in 30 Lines


    # Object Ownership


    All PyQt classes that derive from QObject—and this includes all the widgets, since
    QWidget is a Qobject subclass—can have a "parent". The parent-child relationship
    is used for two complementary purposes. A widget that has no parent is a top-level
    window, and a widget that has a parent (always another widget) is contained (displayed)
    within its parent. The relationship also defines ownership, with parents owning
    their children.


    PyQt uses the parent-child ownership model to ensure that if a parent—for example,
    a top-level window—is deleted, all its children, for example, the widgets window,
    are automatically deleted as well. To avoid memory leaks, we should always make
    sure that any QObject, including QWidgets, a sole exception being top-level windows.


    Most PyQt Qobject subclasses have constructors that take a parent object as their
    last (optional) argument. But for widgets we generally do not (and not need) pass
    this argument. This is because widgets used in dialogs are laid out with layout
    managers, and when they are automatically reparented to the widget in which they
    are laid out, they end up with the correct parent without requiring us to take
    any special action.


    There are cases where we must explicitly take a parent—for example, when constructing
    Qobject objects that are not widgets, or that are widgets which will not be laid
    out (such as dock widgets); we will see several examples of such cases in later
    chapters.


    One final point is that it is possible to get situations where a Python variable
    is referring to an underlying PyQt "object" that no longer exists. This issue
    is covered in Chapter 9, in the "liveness" discussion starting on page 287.


    The widgets on a form can be laid out a variety of techniques. We can use the
    resize() and move() methods to give them absolute sizes and positions; we can
    reimplement resizeEvent() method and calculate their sizes and positions dynamically,
    or we can use PyQt''s layout managers. Using absolute sizes and positions is very
    inconvenient. For one thing, we have to perform lots of manual calculations, and
    for another, if we change the layout we have to redo the calculations. Calculating
    the sizes and positions dynamically is a better approach, but still requires us
    to write quite a lot of tedious calculating code.


    Using layout managers makes it quite smart: They automatically adapt to resize
    events and to content changes. Anyone used to dialogs in many versions of Windows
    will appreciate the benefits of having dialogs that are resized (and that so sensibly),
    rather than being forced to use small, nonresizable dialogs when their contents
    are too large to fit. Layout managers also make life easier for internationalized
    programs since they adapt to content, so translated labels will not be "chopped
    off" if the target language is more verbose than the original.


    ![](bbox=[0.905, 0.273, 0.953, 0.323])'
