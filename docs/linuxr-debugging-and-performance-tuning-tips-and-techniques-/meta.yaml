  md: '# Sets


    Python provides two set types: set and frozenset. Both are unordered, so neither
    is a sequence. Sets are mutable, so items can be added and removed. Frozensets
    are immutable and cannot be changed; however, this means that they are suitable
    as dictionary keys.


    Every item in a set is unique; if we try to add an item that is already in a set
    the add() does nothing. Two sets are equal if they contain the same items, no
    matter what order those items were inserted. Sets are similar to dictionaries
    that have only keys and no values. Lists, on the other hand, keep their items
    in insertion order (unless they are sorted), and allow duplicates.


    A frozenset is constructed with a single sequence parameter—for example a tuple
    or a list. A set can be constructed in the same way. For example:


    ```

    >>> unicorns = set((''Narwhal'', ''Oryx'', ''Eland''))

    >>> ''Mutant Goat'' in unicorns

    False

    >>> ''Oryx'' in unicorns

    True

    ```


    Since we created a rather than a frozenset we can add and remove items. For example:


    ```

    >>> unicorns.add(''Mutant Goat'')

    >>> unicorns

    set([''Oryx'', ''Mutant Goat'', ''Eland'', ''Narwhal'']

    >>> unicorns.add(''Eland'')

    >>> unicorns

    set([''Oryx'', ''Mutant Goat'', ''Eland'', ''Narwhal'']

    >>> unicorns.remove(''Narwhal'')

    >>> unicorns

    set([''Oryx'', ''Mutant Goat'', ''Eland''])

    ```


    The set classes also support the standard set operations—for example, union, intersection,
    and difference—and for some operations provide both methods and operators, as
    Table 1.6 shows.


    # Built-in Functions


    As we have already seen, Python has a number of built-in functions and operators:
    for example, del, print, len(), and type(). Tables 1.7–1.9 show others that are
    useful, some of which we will discuss here.


    In IDLE, or using the Python interpreter directly, we can use the help() function
    to get information about an object, or to enter Python''s interactive help system.
    For example:


    ```

    >>> help(str)

    ```'
