    # Summary


    We categorized dialogs into three “intelligences", dumb, standard, and smart,
    and showed they can be used modally or modelelessly. Dumb dialogs are easy to
    create, and are perfectly adequate for widget-level validation. Dumb dialogs are
    normally used modally, and if we are careful they can be generalized since they
    are very loosely coupled to the application''s logic. Nonetheless, using dumb
    dialogs usually ends up leading to programmer frustration and the need to rewrite
    it for the form of a standard or smart dialog, so it is often best to avoid them
    except for very simple cases where one or two values are required and the built-in
    InputDialog static dialogs are not suitable.


