  md: '# Numbers and Strings


    cess than the int type. The int type is the same signed integer type provided
    by most programming languages; however, if an operation is applied to an int that
    would make its value exceed its range (for example, a value greater than 2^31
    - 1 or less than -2^31 on some machines), the int is automatically promoted to
    int long.


    Python uses the suffix L to signify a long, and we can do the same in code when
    necessary. For example:


    ```

    >>> p = 5 ** 35

    >>> q = 7L

    >>> r = 2 + q

    >>> p, q, r

    (29103830456733063128125, 7L)

    ```


    Integers are assumed to be base 10 (decimal) numbers, except those that start
    with a 0x, which are treated as hexadecimal (base 16), for example, 0xF3, which
    is decimal 63, and those that start with 0 are treated as octal (base 8). Any
    kind of integer literal has L appended to make it into a long.


    Python supports the common operators that we expect for numbers, including +,
    -, *, /, and their augmented cousins, +=, -=, *=, /=, and %= Python also provides
    ** for raising to a power.


    By default, Python''s division operator performs trunc division when both operands
    are of type int. For example, 5 /3 produces 1. This is the norm in most programming
    languages, but it can be inconvenient in Python dynamic typing means that a variable
    might be an int or a float at different times. The solution is to tell Python
    to do “true division”, which produces floating point results whenever necessary,
    and to use the // operator when we really want truncation to occur. We will see
    how to do this in Chapter 3.


    # Floats and Decimals


    Python provides three kinds of floating-point values: float, Decimal, and complex.
    Type float holds double-precision floating-point numbers whose range depends on
    the C (or Java) compiler Python was built with; they have limited precision and
    cannot be reliably compared for equality. Numbers of type float are written with
    a decimal point, or using scientific notation, for example, 0.5, 8.9e-4. It is
    salutary to type these into IDLE:


    ```

    >>> 0.0, 5.7, 8.9e-4

    (0.0, 5.700000000000001, 0.0088999999999999999)

    ```


    The inaccuracy is not a Python-problem: Computers represent floating point numbers
    using base 2, which can represent some decimals exactly (such as 0.5) but others
    approximately (such as 0.1). Furthermore, the representation uses a fixed number
    of bits, so there is a limit to the number of digits that can be held.'
