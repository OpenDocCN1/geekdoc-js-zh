    # Main Windows


    Most applications are main-window-style applications, that is, they have a menu
    bar, toolbars, a status bar, a central area, and possibly dock windows, to provide
    the user with a rich yet navigable and comprehensible user interface. In this
    chapter, we will see how to create a main-window-style application which demonstrates
    how to create and use all of these features.


    ![](bbox=[0.257, 0.442, 0.742, 0.743])


    Figure 6.1 The Image Changer application


    We will use the Image Changer application shown in Figure 6.1 to demonstrate how
    to create a main-window-style application. Like most such applications it has
    menus, toolbars, and a status bar; it also has a dock window. In addition to seeing
    how to create all these user interface elements, we will cover how to relate user
    interactions with them, to methods that perform the relevant actions.'
