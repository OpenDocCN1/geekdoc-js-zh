    The creation of the form’s widgets is very similar to what we did before, but
    this time we are using preventative validation exclusively. We set a one-character
    maximum length on the thousands separator and decimal marker line edits, and in
    both cases we set a QExpValidator. A validator will only allow the user to enter
    valid characters, and in the case of a regular expression validator, only characters
    that match the regular expression.* PyQt uses regular expression syntax that is
    essentially a subset of the syntax offered by Python’s re


    The RegExpValidator’s initializer requires both a regular expression and a parameter,
    which is why we have passed self in addition to the regular expression.


    In this case, we have set the regular expression to “[,,;]. The character class
    means that the only characters that are valid are those contained in the square
    brackets, that is, space, comma, semicolon, colon, and period. Notice that the
    regular expression string is preceded by “r”. This signifies a “raw” string and
    means that (most) all of the characters inside the string are be taken as literals.
    This considerably reduces the need to escape regular expression special characters
    such as "", although it does not matter. Nonetheless, we always use “r” with regular
    expression strings as a matter of good practice.


    Although we are happy to accept empty thousands separators, we require a decimal
    marker. For this reason we have used an input mask. A mask of “X” says that any
    character of kind is required—we do not to concern ourselves with what the character
    will be because the regular expression validator will ensure that it is valid.
    Format masks are explained using the QLineEdit.inputMask property’s documentation.


    The only other difference to the way we created the widgets in the modal version
    of the dialog is that we create Apply and Close buttons rather than OK and Cancel
    buttons.


    *The RegExp documentation provides a brief introduction to regular expressions.
    For in-depth coverage, Mastering Regular Expressions by Jeffrey Friedl.


    ° Every PyQt object and widget has “properties”. These are similar to Python properties,
    except they can be accessed using the property() and setProperty() methods.'
