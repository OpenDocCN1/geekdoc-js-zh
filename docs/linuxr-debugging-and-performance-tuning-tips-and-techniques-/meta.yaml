  md: "# Smart Dialogs\n\ndialogs that have “apply” buttons notify state changes through\
    \ signal and slot connections.\n\nThe main benefit of using a smartless dialog\
    \ is seen at the point of use. When the dialog is created, it is given references\
    \ to the calling form's data structures so that the dialog can update the data\
    \ structures directly with no further code required at the call point. The downsides\
    \ are that the dialog must have knowledge of the calling form's data structures\
    \ so that it correctly reflects the data values into its widgets and only applies\
    \ changes that are valid, and that, being modelless, there is a risk of the data\
    \ dialog depends on being changed from under it if the user interacts with some\
    \ other part of the application.\n\nIn this section we are going to continue with\
    \ the theme of number format dialogs so that we can compare the various approaches.\n\
    \n# Modelless Apply/Close-Style Dialogs\n\nIf we want to be able to repeatedly\
    \ change the number format and see the results, it will be much more convenient\
    \ for them if they could so without having keeping invokes and accepting the number\
    \ format dialog. The solution is to use a modelless dialog which allows them to\
    \ interact with the number format widgets and to apply their changes and see the\
    \ effect, as they often like. Dialog like this usually have an Apply and a Close\
    \ button. Unlike a modal OK/Cancel-style dialog, which can be canceled, leaving\
    \ everything as it was before, once Apply has been clicked the user cannot revert\
    \ their changes. Or we could provide a Revert button or a Defaults button, but\
    \ this would require more work.\n\nSuperficially, the only difference between\
    \ the modeless and the modal versions of the dialog is the button text. However,\
    \ there are two other important differences: The calling form's method creates\
    \ and invokes the dialog differently, and the dialog must make sure it is deleted,\
    \ not hidden, when it is closed. Let us begin by looking at how the dialog is\
    \ invoked.\n\n```\ndef numberFormat2(self):\n    dialog = numberformatdlg2.NumberFormatDlg(self,\
    \ self)\n    self.connect(dialog, SIGNAL(\"changed\"), self.refreshTable)\n  \
    \  dialog.show()\n```\n\nWe create the dialog in the same way we created the modal\
    \ version earlier; it is shown in Figure 5.6. We then connect the dialog's Python\
    \ signal to the calling form's refreshTable() method, and then we just show()\
    \ on the dialog. When we call show(), the dialog is popped up as a modeless dialog.\
    \ Application execution continues concurrently with the dialog, and the user can\
    \ interact with both the dialog and other windows in the application.\n\nWhenever\
    \ the dialog emits its changed signal, the main form's refreshTable() method is\
    \ called, and this willformat all the numbers in the table using"
