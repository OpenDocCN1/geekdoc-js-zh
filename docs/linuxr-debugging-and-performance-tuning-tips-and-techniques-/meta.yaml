  md: '# Importing Objects


    Python has a large and comprehensive library of modules that provides a huge amount
    of predefined functionality. We can use this functionality by importing the constants,
    variables, functions, and classes that we want. The general syntax for importing
    is:


    ```

    import moduleName

    ```


    We can then access objects inside the module using the dot operator. For example,
    the random module provides the randint() function, which can be imported and used
    like this:


    ```

    import random

    x = random.randint(1, 10)

    ```


    Note that it is common to put import statements at the beginning of .py files,
    but they can be put elsewhere—for example, inside a function definition.


    One benefit of Python''s module collisions is that each module acts as a name-space,
    so we avoid name collisions effortlessly. For example, we may have defined our
    randint() function, but there is no name conflict because the imported one is
    accessed using the fully qualified name random.randint(). And as we will see in
    Chapter 3, we can create our own modules and import our objects.


    Modules themselves can contain other modules, and for very large modules, it is
    more convenient to import objects directly into the current namespace. Python
    provides a syntax for this. For example:


    ```

    from PyQt4.QtCore import *

    x = QString()

