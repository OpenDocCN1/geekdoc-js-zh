    # Chapter 6. Main Windows


    This chapter also explains how to handle the creation of new files and the opening
    of existing files, including keeping the user interface synchronized with the
    application''s state. Also covered is how to give the user the opportunity to
    save unsaved changes, and how to manage a recently used files list. We will also
    show how to save and restore user preferences, including the sizes and positions
    of the main window and of the toolbars and dock windows.


    Most applications have a data structure for holding their data, and one more widgets
    through which users can view and edit the data. The Image Changer application
    holds its data in a QImage object, and uses a QLabel widget as its data viewer.
    In Chapter 8, we will see a main-window-style application that is used to present
    and edit lots data items, and in Chapter 9, we will see how to create main window
    applications that can handle multiple documents.


    Before looking at how to create the application, we will discuss some of the state
    that a user interface must maintain. Often, some menu options and toolbar buttons
    are "checkable", that they can be, in one of two states. For example, in a word
    processor, a toolbar button for toggling italic text could be on "on" (pushed
    down) or "off". If there is an italic menu option, we must make sure that the
    menu option and the toolbar button are kept in sync. Fortunately, PyQt makes it
    easy to automate synchronization.


    Some options may be interdependent. For example, we can have text leftaligned,
    or right-aligned, but only one of these can be "on" at any time. So if the user
    switched on center alignment, the left and right toolbar buttons and menu options
    must be switched off. Again, PyQt makes it straightforward to synchronize interdependent
    options. In this chapter, we will cover options that are noncheckable, as "file
    open", and both independent and interdependent changeable options.


    Although some menu and toolbar options can have an immediate effect on the application''s
    data, others are used to invoke dialogs through which users can specify precisely
    what they want done. Since we have given so much coverage to dialogs in the preceding
    two chapters, we will concentrate on how they are used rather than how they are
    created. In this chapter we will see how to invoke custom dialogs, and also how
    to use many of PyQt''s built-in dialogs, including dialogs for choosing a filename,
    the print dialog, and dialogs for asking the user for an item of data, such as
    a string or number.


    # Creating a Main Window


