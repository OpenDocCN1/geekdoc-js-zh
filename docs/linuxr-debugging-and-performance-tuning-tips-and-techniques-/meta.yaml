  md: '# 206 Chapter 7. Using Qt Designer


    or even. The Image Changer application from the preceding chapter had two custom
    dialogs: the ResizeDlg, which was created purely in code (in the exercise), and
    the NewImageDlg, which was created using Qt Designer. We showed how to do things
    in code so that you would get a strong sense of how the layout managers work.
    But in this chapter we are going to create dialogs using Qt Designer, which is
    shown in Figure 7.1.


    Qt Designer can be used to create user interfaces for dialogs, custom widgets,
    and main windows. We will only cover dialogs; custom widgets are almost the same,
    only they are based on the "Widget" template rather than one of the "Dialog" templates.
    Using Qt Designer for main windows offers fewer advantages, apart from the convenience
    of a visual Qt editor. Qt Designer can also be used to create and edit resource
    files.


    The user interfaces are stored in .ui files, and include details of a form''s
    widgets and layouts. In Qt Designer we can associate labels with their buddies,
    and set the tab-order, that is, the order in which widgets get focus when the
    user presses the Tab key. This can also be done in code with .setTabOrder(), but
    it is really necessary for hand-coded forms, where the default is the order of
    widget creation, which is usually what we want. Qt Designer can also be used to
    make signal-slot connections, but only between built-in signals and slots.


    Once a user interface has been designed and saved in a .ui file, it must be converted
    into code before it can be used. This is done using the pyic4 command-line.


    ```

    C:\pychat07\pyic4 -o ui_findreplacedlg.py findreplacedlg.ui

    ```


    As mentioned in the previous chapter, we can use either PyQt or PyQt with PyQt4.
    However, generating a Python module (a .py file) from a .ui file is not enough
    to make the user interface usable. Note that the generated code (in the ui .py
    files) should never be hand-edited because any changes will be overwritten the
    next time PyQt4 is run.


    From the end-user''s perspective, it makes no difference whether a dialog''s interface
    is hand-coded or created with Qt Designer. However, there is a significant difference
    in the implementation of a dialog''s initializer; we must create, lay out, and
    connect the dialog''s widgets if hand-coding, but we only need to call a particular
    method to achieve the same thing with a dialog that uses a Qt user interface.


    One great benefit of Qt Designer, in addition to the convenience of designing
    dialogs visually, is that if we change the user interface module (using pyic4
    directly, or via mkpyqt.py or Make PyQt), we do not need to change our code. The
    only time that we must change our code is if we add code, or rename widgets that
    we refer to in our code.


    > *It is possible, though uncommon, to load and use the .ui file directly using
    PyQt4.u.loadUI().


    ![](bbox=[0.0, 0.375, 0.125, 0.42])'
