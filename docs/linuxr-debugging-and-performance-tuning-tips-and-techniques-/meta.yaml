    | len(s) | Returns the length of s; this is a count if s is of type str and a
    character count if s is type unicode |

    | s.count(x) | Returns the number of times x occurs in string s. This method,
    and others, can take optional start and end arguments to restrict the search to
    a slice of the string they are called on |

    | s.endswith(x) | Returns True if s ends with string x |

    | s.startswith(x) | Returns True if s starts with string x |

    | s.find(x) | Returns the index of the leftmost occurrence of x in s; -1 if x
    is not found |

    | s.rfind(x) | Like find(), but searches from right to left |

    | s.index(x) | Returns the index of the leftmost occurrence of x in s; raises
    ValueError if x is not found |

    | s.rindex(x) | Like index(), but searches from right to left |

    | s.isdigit() | Returns True if the string is not empty or all characters are
    all digits |

    | s.isalpha() | Like isdigit(), but checks for letters |

    | s.join(x,... ) | Returns a string which is the concatenation of the sequence
    delimited by the string on which the method is called. For example, ":".join("A","BB","CCC")
    returns "A:BB:CCC". The delimiter can be empty. |

    | s.lower() | Returns a lower-case copy of string s |

    | s.upper() | Returns an upper-case copy of string s |

    | s.replace(x, y) | Returns a copy of string with all occurrences of x replaced
    by copy of y |

    | s.split() | Returns a list of strings, splitting on whitespace. For example,
    "ab\t cd".split() returns ["ab", "c", "d"]. This method can be given a first argument
