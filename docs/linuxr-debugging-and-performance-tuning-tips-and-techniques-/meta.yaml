    # Numbers and Strings


    Python provides several numeric types and two string types. What all these have
    in common is that they are immutable. This means that in Python, numbers and strings
    cannot be changed. This sounds rather limiting, but thanks to Python''s augmented
    assignment operators (+=, *= etc.), it simply is not problem.


    Before looking at the specific data types we will look at one important consequence
    of the immutability. Let us use some simple expressions in IDLE:


    ```

    >>> x = 5

    >>> y = x

    >>> x, y

    (5, 5)

    ```


    Here we have created an object of int with the value 5 and bound the name x to
    y which has the effect of binding y to the same object x is bound to. So, when
    we print x, y, but in IDLE (in a program we IDLE automatically prints it), IDLE
    outputs the values as a tuple–essentially a read-list of values.


    Now we increment y:


    ```

    >>> y += 1

    >>> x, y

    (5, 6)

    ```


    We might have expected both x and y to have the value 6 since both referred to
    the same integer object. But because Python numbers (and strings) are immutable,
    this does not happen. The augmented assignment operators applied to immutable
    objects are mere syntactic sugar: They do not change'
