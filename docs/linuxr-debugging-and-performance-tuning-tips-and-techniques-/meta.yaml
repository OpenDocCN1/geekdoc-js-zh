  md: "# Static Data, and Static Methods and Decorators\n\nIn some situations it is\
    \ useful to have data that is associated with a class as a whole rather than with\
    \ its instances. For example, if we have a Balloon class, we might want to know\
    \ how many unique colors have been used:\n\n```\nclass Balloon(object):\n    unique_colors\
    \ = set()\n    def __init__(self, color):\n        self.color = color\n      \
    \  Balloon.unique_colors.add(color)\n\n    @staticmethod\n    def uniqueCount():\n\
    \        return len(Balloon.unique_colors)\n\n    @staticmethod\n    def uniqueColors():\n\
    \        return Balloon.unique_colors.copy()\n```\n\nStatic data is created inside\
    \ a class block, but outside of any def statements. To access static data, we\
    \ must qualify the name, and the easiest way to do is by using the class name,\
    \ as we do in the Balloon class's static methods. We will see static data and\
    \ methods in more realistic contexts in the next subsection.\n\nThe @staticmethod\
    \ is a decorator. A decorator is a function that takes a function as an argument,\
    \ wraps it in some way, and assigns the wrapped function back to the original\
    \ function's name, so it has the same effect as writing this:\n\n```\ndef uniqueColors():\n\
    \    return Balloon.unique_colors.copy()\nuniqueColors = staticmethod(uniqueColors)\n\
    ```\n\nThe @ symbol is used to sign a decorator. The staticmethod() is one of\
    \ Python's built-in functions.\n\nWe can use more than one decorator. For example,\
    \ a suitable decorator can be written to instrument functions and methods, or\
    \ to log each time a method is called. For example:\n\n```\n@logger\n@recalculate\n\
    def changeWidth(self, width):\n    self.width = width\n```\n\nHere, whenever the\
    \ object's width is changed two decorators are applied: logger(), which might\
    \ record the change in a log file or database, and recalculate(), which might\
    \ update the object's area."
