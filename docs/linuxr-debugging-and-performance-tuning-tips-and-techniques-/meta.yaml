    a similar pattern. We begin by creating and initializing some data structures,
    then we create a "central widget" which will occupy the mainwindow''s central
    area, and then we set and up any dock windows. Next, we create "actions" and insert
    them into menus and toolbars. It is quite common to also read in the application''s
    settings, and for applications that restore the'
