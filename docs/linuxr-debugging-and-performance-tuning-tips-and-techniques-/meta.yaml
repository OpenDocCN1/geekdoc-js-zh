  md: "# Signals and Slots\n\nA signal with no arguments (and therefore no parentheses)\
    \ is a short-circuit Python signal. When such a signal is emitted, any data can\
    \ be passed as additional arguments to the emit() method, and they are passed\
    \ as Python objects. This avoids the overhead of converting arguments to and from\
    \ C++ data types, and also means that arbitrary Python objects can be passed,\
    \ even ones which cannot be converted to and from C++ data types. A signal with\
    \ at least one argument is either a Qt signal or a non-shortcircuit Python signal.\
    \ In these cases, PyQt will check whether the signal is a Qt signal, and if it\
    \ is not assume that it is a Python signal. In either case, the arguments are\
