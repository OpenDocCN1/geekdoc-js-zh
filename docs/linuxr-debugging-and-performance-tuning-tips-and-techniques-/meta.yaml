    \ its Boolean value by converting it to a bool type.\nFor example:\n\n```\nfrom\
    \ PyQt4.QtCore import *\nnow = QDate.currentDate()\nnever = QDate()\nprint bool(now),\
    \ bool(never)    # Prints \"True False\"\n```\n\nThe QDate() constructor with\
    \ no arguments creates a null date; the QDate.\ncurrentDate() static method returns\
    \ today's date which, of course, is not null.\n\n# Conditional Branching\n\nPython\
    \ provides an if statement with the same semantics as languages like\nC++ and\
    \ Java, although with its own sparse syntax:\n\n```\nif expression1:\n  suite1\n\
    elif expression2:\n  suite2\nelse:\n  suite3\n```\n\nThe first thing that stands\
    \ out to programmers used to C++ or Java is that\nare are no parentheses or braces.\
    \ The other thing to notice is the\ncolon: This is part of the syntax and is easy\
    \ to forget when starting out. Colons:\nare used with else, elif, and in many\
    \ other places to indicate that a block of\ncode (a suite in Python-speak) is\
    \ to follow. As we would expect, there can be any\nnumber of elifs (including\
    \ none), and optionally, there can be a single else at\nthe end.\n\nUnlike most\
    \ programming languages, Python uses indentation to signify\nits block structure.\
    \ Some programmers do not like this, at least for, and some\nget emotional about\
    \ the issue. But it takes just a few days to get used to,\nan after a few months,\
    \ brace-free code seems much nicer and less cluttered to\nthan code that uses\
    \ braces.\n\nSinceSince are using indentation, the question that naturally arises\n\
    “What kind of indentation?”. The Python style guidelines recommend four\nspaces\
    \ per level of indentation, and only spaces (no tabs). Most text ed-\nitors can\
    \ be set up to handle this automatically (IDLE's editor does, of course).\nPython\
    \ will fine with any number of spaces or tabs, providing that the\nindentation\
    \ used is consistent. In this book, we will follow the official\nPython guidelines.\n\
    \nLet’s begin with a very simple example:"
