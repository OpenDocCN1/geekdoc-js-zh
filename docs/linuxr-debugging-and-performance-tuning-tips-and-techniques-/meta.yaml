  md: '# Collection Classes


    In Python, sequences are such as lists and strings, mappings as dictionaries,
    or sets. If we implement our own collection classes we can use special methods
    to make our collections usable with the same syntax and semantics as the built-in
    collection types. Table 3.3 lists the special methods common to collections, and
    in this section we discuss some the specifics of each kind of collection.


    In the case of sequences, it is common to implement `add_()` and `radd_()` to
    support concatenation with `+`, and in the case of a mutable collection, to implement
    `iadd_()`, for `+=`. Similarly, the `mul()` methods should be implemented to support
    `*` for repeating the collection. If an invalid index is given, we should raise
    an `IndexError` exception. In addition to special methods, a custom sequence collection
    should implement `append()`, `count()`, `index()`, `insert()`, `extend()`, `pop()`,
    `remove()`, and `sort().


    For mappings, we should raise `KeyError` if an invalid key is given, and in addition
    to the special methods, we should implement at least `copy()` and `get()`, along
    with `items()`, `keys()`, and `values()`, and their iterator versions, `iter()`.
    A Python iterator is a function or method that returns successive values—for each
    character in a string, or each item in a dictionary. They are often implemented
    by generators.


    For sets, we should also raise `KeyError` if an invalid key is used; for example,
    when calling `remove()`. Set collections should implement `issubset()`, `isserset()`,
    `union()`, `intersection()`, `difference()`, `symmetric_difference()`, and `copy()`.
    For mutable sets, additional methods should be provided, including `add()`, `remove()`,
    and `discard().


    # Example: The OrderedDict Class


    A rare omission from Python''s standard library is an ordered dictionary. Plain
    dictionaries provide fast lookup, but do not provide ordering. For example, if
    we wanted to iterate over a dictionary''s values in key order, we would copy the
    keys to a list, sort the list, and iterate over the list, using the list''s elements
    to access the dictionary''s values. For small dictionaries, or where we do not
    care, rarely sorting may be fine, but when the dictionary is large or sorted frequently,
    sorting every time might be computationally expensive.


    An obvious solution is to create an OrderedDict, and that is what we will do here.


    Understanding the OrderedDict example is not necessary for learning GUI programming,
    but do use the techniques and methods explained here in some of the programs that
    we will cover later. For now, you could safely skip to the next section, starting
    on page 99, and then return here to understand the techniques when you encounter
    them in later chapters.'
