    the flow of control, so we also cover both handling and creating exceptions.


    One fundamental way of encapsulating functionality is to put into functions and
    methods. This chapter shows how to define functions, and the next chapter shows
    how to define classes and methods. Programmers coming from a C++ or similar background
    are used to functions being defined just once. This is true in Python, but with
    an additional possibility: In Python, we can create functions at runtime in a
    way that reflects the current circumstances, so we will later in this chapter.


