  md: '# Designing User Interfaces


    ure 7.1, click Edit→User Interface Mode→Docked Window.* Qt Designer will remember
    this setting, so it needs to be done only once.


    Qt Designer is not difficult to use, but it does take some practice. One thing
    that helps is to do things in a particular order, as shown in the following list
    of steps. For steps 1 and 2, always work from “back” to “front”, that is, always
    start with containers (group boxes, tab widgets, frames), and then go to the normal
    widgets that belong inside them, that is, on top of them. We will go through an
    example step-by-step in a moment, but first here is how to create a dialog using
    Qt Designer.


    +   1. Drag a widget onto the form and place it in approximately the right position;
    there is no place to place it exactly, and normally only container widgets need
    to be resized.

    2. Set the widget’s properties if necessary; if the widget will be referred to
    in code, at least give it a sensible name.

    3. Repeat steps 1 and 2 until all the required widgets are on the form.

    4. If there are large gaps, drag in horizontal or vertical spacers to fill them;
    (these appear as blue springs) sometimes, when gaps are obvious, spacers are added
    during steps 1 and 2.

    5. Select two or more widgets (or spacers or layouts) to be laid out (Shift+Click
    each one), and then lay them out using a layout manager or a splitter.

    6. Repeat step 5 until all the widgets and spacers are in layouts.

    7. Click the form (to deselect everything) and lay out the form by one of the
    layout managers.

    8. Create buddies for the form’s labels.

    9. Set the form’s tab order if the order is wrong.

    10. Create signal–slot connections between built-in signals and slots where appropriate.


    +   11. Preview the form and check that everything works as intended.


    +   12. Set the form’s object name (this is used in its class name), and the form’s
    title, and save so that it has a filename. For example, if the object name is
    “PaymentDig”, we would probably give it a title of “Payment” and a filename of
    paymentdtg.ui.


    If the layout is wrong, use to go back to where you could start laying things
    out, and have another one. If that is not possible or does not work, or if the
