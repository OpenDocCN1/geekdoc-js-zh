  md: "# Handling Help Actions\n\nWhen we created the main window's actions, we provided\
    \ each with help text, and set it as their status text and as their tooltip text.\
    \ This means that when the user navigates the application's menu system, the status\
    \ text of the currently highlighted option will automatically appear in the status\
    \ bar. Similarly, if the user hovers the mouse over a toolbar button, the corresponding\
    \ tooltip text will be displayed in a tooltip.\n\nFor an application as small\
    \ and simple as the Image Changer, status tips and tooltips might be entirely\
    \ adequate. Nonetheless, we have provided an online help system to show how it\
    \ can be done, although we defer until Chapter 17 (from page 510).\n\n![](bbox=[0.263,\
    \ 0.342, 0.736, 0.501])\n\n**Figure 6.10** The about Image Changer box\n\nWhether\
    \ or not we provide online help, it is always a good idea to provide an \"about\"\
    \ box. This should at least show the application's version and copyright notice,\
    \ as Figure 6.10 illustrates.\n\n```\ndef helpAbout(self):\n    QMessageBox.about(self,\
    \ \"About Image Changer\",\n        \"\"%<b>Image Changer</b> v %s\"\n       \
    \ <p>Copyright&copy; 2007 Qtrac Ltd.\n        All rights reserved.</p>\n     \
    \   <p>This application can be used to perform\n        simple image manipulations.</p>\n\
    \        <p>PyQt %s - Qt %s - PyQt %s on \"%s\" %% (\n        version , platform.python_version(),\n\
    \        QT_VERSION, PYQT_STR, platform.system()))\n```\n\nThe QMessageBox::static()\
    \ convenience method pops a modal OK-style message box with the given caption\
    \ and text. The text can be HTML, as it is here. The message box will use the\
    \ application's icon if there is one.\n\nWe display the application's version,\
    \ and version information about the Python, Qt, and PyQt libraries, as well as\
    \ the platform the application is running on. The library version information\
    \ is probably of no direct use to the user, but it may be very helpful to support\
    \ staff who are being asked for help by the user."
