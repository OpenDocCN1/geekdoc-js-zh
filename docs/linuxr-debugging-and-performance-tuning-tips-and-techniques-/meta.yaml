    Notice that we assigned string s to u. Intuitively we would expect that u holds
    the value, and we do not expect applying += to s will have any side effects, though
    both s and u refer to the same string. And our intuition is: u''s value is not
    changed because += is applied to s, a new string object is created and bound to
    s, and u is left as the only object referring to the original “Bath” string.


