    ![](bbox=[0.292, 0.098, 0.707, 0.373])


    Figure 6.3 QWindow''s areas


    Toolbars are suitable for holding toolbar buttons, and some other kinds of widgets
    such as comboboxes and spinboxes. For larger widgets, for tool palettes, or for
    any widget that the user wants to be able to drag out of the window to float freely
    as an independent window in its own right, using a dock window is often the right
    choice.


    Dock windows are windows that can appear in the dock areas shown in Figure 6.3.
    They have a small caption, and restore and close buttons, and they can be dragged
    from one dock area to another, or float freely as independent windows in their
    own right. When they are docked they automatically provide a splitter between
    themselves and the central area, and this makes them easy to resize.


    In PyQt, dock windows are instances of the QWidget class. We can add a single
    dock widget to a dock widget, just as we can have a single widget in a main window''s
    central area, and in this case there is no limitation, since the widget added
    be composite.


    ```

    logDockWidget = QDockWidget("Log", self)

    logDockWidget.setObjectName("DockWidget")

    logDockWidget.setAllowedAreas(Qt.LeftDockWidgetArea|Qt.RightDockWidgetArea)

    self.listWidget = QListWidget(self)

    logDockWidget.setWidget(self.listWidget)

    self.addDockWidget(Qt.RightDockWidgetArea, logDockWidget)

    ```


    Dock widgets are not put into a layout, when we create them, in addition to providing
    their window caption, we must give them a parent. By setting a parent, we ensure
    that the dock widget does not go out of scope and get a garbage-'
