    This completes our formal coverage of the signals and slots mechanism. We will
    see many more examples of signals and slots in practice in all the examples shown
    in the rest of the book. Most GUI libraries have copied the mechanism in some
    form or other. This is because the signals and slots mechanism is very useful
    and powerful, and leaves programmers to focus on the logic of their applications
    rather than to concern themselves with the details of how the user invoked a particular
    operation.


    # # Summary


    In this chapter, we saw that it is possible to create hybrid console–GUI applications.
    This can actually be taken much further—for example, including all the GUI code
    within the scope of an block and executing it by PyQt. This would allow us to
    create a GUI application that could fall back to “console” if some of our users
    did not use PyQt.


    We also saw that unlike conventional batch-processing programs, GUI applications
    have an event loop that runs continuously, checking for events like mouse clicks
    and key presses, and system events timing out or being revealed, and terminating
    only when requested to do.


    The Calculate application showed us a very simple but structurally typical dialog
    _init__(). method. The widgets are created, laid out, and connected, and one or
    more methods are used to respond to user interaction. The Currency application
    used the same approach, only with a more sophisticated interface, and more complex
    behavior and processing. The Currency application also showed that we can connect
    multiple signals to a single slot without formality.


    PyQt''s signals and slots mechanism allows us to handle user interaction at a
    higher level of abstraction than the specific details of mouse clicks and key
    presses. It lets focus on what users want to do rather than how they asked to
    it. All the PyQt widgets signal state changes and other important occurrences;
    and most of the time we can ignore the signals. But for those that we are interested
    in, it is easy to use connect() to ensure that the function or method of our choice
    is called when the signal is emitted so we respond to it. Unlike C++/Qt, which
    must designate certain methods specially as slots, in PyQt we are free to use
    any callable, that is, any function or method as.


    We also saw how to connect multiple signals to a single slot, and how to use partial
    function application or the sender() method that the slot can respond appropriately
    depending on which widget signalled it.'
