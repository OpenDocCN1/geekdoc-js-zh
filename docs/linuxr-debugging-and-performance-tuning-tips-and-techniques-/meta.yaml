  md: "# No Dangling Else Trap\n\nOne additional benefit of using indentation is that\
    \ the “dangling else ambiguity” is impossible in Python. For example, here is\
    \ some C++ code:\n\n```\nif (x > 0)\n    if (y > 0)\n        z = 1;\nelse\n  \
    \  z = 5;\n```\n\nThe code sets z to 1 if both x and y are greater than 0, and\
    \ it looks like it will set z to 5 if x is less than or equal to 0. But in fact,\
    \ it sets z to 5 only if x is greater than 0 **and** y is less than or equal to\
    \ 0. Here is what it means in Python:\n\n```\nif x > 0:\n    if y > 0:\n     \
    \   z = 1\nelse:\n    z = 5\n```\n\nAnd if we really want z set to 5 if x is less\
    \ than or equal to 0, we would write this:\n\n```\nif x > 0:\n    if y > 0:\n\
    \        z = 1\nelse:\n    z = 5\n```\n\nThanks to Python’s indentation-based\
    \ block structure, we avoid the “dangling else” trap.\n\nThe first form is preferred:\
    \ It is clearer and simpler, it is more efficient (since x may be a complex expression\
    \ involving some overhead to evaluate), and it is easier to maintain (again because\
    \ the x is used only once rather than twice).\n\nPython provides multiway branching\
    \ using elif and else; there is no case (or switch) statement.\n\n```\nif x <\
    \ 10:\n    print \"small\"\nelif x < 100:\n    print \"medium\"\nelif x < 1000:\n\
    \    print \"large\"\nelse:\n    print \"huge\"\n```"
