  md: "Python also provides an xrange() function with the same semantics, but is more\
    \ memory-efficient in a for loop, because it evaluates lazily rather than generating\
    \ the entire list of integers in one go. We will normally use range() and substitute\
    \ it with xrange() only if it makes a significant difference to performance.\n\
    \nIf the loop's iterable is mutable (e.g., a list or dictionary), it must not\
    \ be changed inside the loop. If we want to change a key or dictionary as we iterate\
    \ over it, we must iterate over a list of the list's indices or a list of the\
    \ dictionary's keys, or use a shallow copy, rather than working directly on the\
    \ collections themselves. For example:\n\n```\npresidents = dict(Washington=(1789,\
    \ 1797), Adams=(1797, 1801),\nJefferson=(1801, 1809), Madison=(1809, 1817))\n\
    if key == \"Adams\":\n    del presidents[key]\nelse:\n    print presidents[key]\n\
    ```\n\nThis removes the \"Adams\" key (and its associated value) from the presidents\
    \ dictionary, and prints:\n\n```\nMadison (1809, 1817)\nJefferson (1801, 1809)\n\
    Washington (1789, 1797)\n```\n\nNotice that Python normally uses newline as a\
    \ statement separator, this does not occur inside parentheses. The same is true\
    \ when we create lists in square brackets or dictionaries in braces. This is why\
    \ we can spread the construction of the presidents dictionary over a couple of\
    \ lines without having to escape the intervening newline with a backslash (\\\n\
    \nSince dictionaries hold pairs of keys and values, Python provides methods for\
    \ iterating over the keys, the values, and the pairs. And as a convenience, if\
    \ we simply iterate over a dictionary, we don't have to call the keys() method\
    \ to get the keys:\n\n```\npresidents = dict(Washington=(1789, 1797), Adams=(1797,\
    \ 1801),\nJefferson=(1801, 1809), Madison=(1809, 1817))\n```\n\n```\nfor key in\
    \ presidents:\n    print \"%s: %d-%d\" %% (key, presidents[key][0], presidents[key][1])\n\
    ```\n\nThis prints (not necessarily in this order):\n\n```\nMadison: 1809-1817\n\
    Jefferson: 1801-1809\nWashington: 1789-1797\nAdams: 1797-1801\n```\n\n![](bbox=[0.89,\
    \ 0.575, 0.96, 0.635])"
