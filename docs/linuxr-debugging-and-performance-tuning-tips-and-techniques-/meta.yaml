  md: "# Shallow and Deep Copying\n\nWe saw earlier (on page 16) if we have two variables\
    \ referring to the same string and we change one of them, for example using +=\
    \ to append—Python creates a new string. This occurs because Python strings are\
    \ immutable. For mutable types such as lists (dictionaries, covered shortly),\
    \ the situation is different.\n\nFor example, if we create a list with two variables\
    \ referring to it, and we change the list through one of the variables, both variables\
    \ refer to the same changed list:\n\n```\n>>> seaweed = [\"Aonori\", \"Carola\"\
    , \"Dulse\"]\n>>> macroalgae = seaweed\n>>> seaweed, macroalgae\n    (['Aonori',\
    \ 'Carola', 'Dulse'], ['Aonori', 'Carola', 'Dulse'])\n>>> macroalgae[2] = \"Hijiki\"\
    \n>>> seaweed, macroalgae\n    (['Aonori', 'Carola', 'Hijiki'], ['Aonori', 'Carola',\
    \ 'Hijiki'])\n```\n\nThis is by default, Python uses shallow copying when copying\
    \ mutable. We can force Python to do a deep copy by taking a slice that consists\
    \ of the entire list:\n\n```\n>>> seaweed = [\"Aonori\", \"Carola\", \"Dulse\"\
    ]\n>>> macroalgae = seaweed[:]\n>>> seaweed, macroalgae\n    (['Aonori', 'Carola',\
    \ 'Dulse'], ['Aonori', 'Carola', 'Dulse'])\n>>> macroalgae[2] = \"Hijiki\"\n>>>\
    \ seaweed, macroalgae\n    (['Aonori', 'Carola', 'Hijiki'], ['Aonori', 'Carola',\
    \ 'Hijiki'])\n```\n\nSlices copy the items sliced, whether we slice a slice of\
    \ a list, or the whole list as we do here. However, this works only one level\
    \ deep, so if we have a list of lists, the sublists will only be shallow-copying.\
    \ Some other collection types—for example, dict—provide a copy() method which\
    \ is their equivalent of [:].\n\nFor deep copying that works to depth we must\
    \ import the copy module and use the deepcopy() function. In practice, this is\
    \ very rarely a problem, and when it trips us up, using deepcopy() sorts it out\
    \ for us.\n\nWe have replaced a slice of length one, fruit[2:3] ['quat'], with\
    \ a slice of length two. We have also inserted a slice of three items without\
    \ removing any. In the last example we copied all of fruit's items to bag; this\
    \ could have been done using bag = fruit, but with different semantics; see the\
    \ Shallow and Deep Copying sidebar for more about copying lists."
