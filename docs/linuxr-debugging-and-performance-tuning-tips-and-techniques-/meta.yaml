  md: '# Summary


    Main-window-style applications are created by subclassing MainWindow. The window
    has a single widget (which may be composite and so contain other widgets) as its
    central widget.


    Actions are used to represent the functionality the application provides to its
    users. These actions are held as QAction objects which have text (used in menus),
    icons (used both menus and toolbars), tooltips and status updates, and that are
    connected to slots, when invoked, will perform the appropriate action. Usually,
    all the actions are added to the main window''s menu, and the most commonly ones
    are added to toolbars. To support keyboard users, we provide keyboard shortcuts
    for frequently used actions, and menu accelerators to make menu navigation as
    quick and convenient as possible.


    Some actions are changeable, and some groups of changeable actions may be mutually
    exclusive, that is, and only one may be checked at any time. PyQt supports changeable
    actions by the setting of a single property, and supports mutually exclusive groups
    of actions through QAction objects.


    Dock windows are represented by docks and are easy to set up. Arbitrary widgets
    can be added to dock widgets and to toolbars, although in practice we usually
    add small or letterbox-shaped widgets to toolbars.


    Actions, group, and dock windows must all be given a parent—explicit the main
    window, when—to ensure that they are deleted at the right time. This is not necessary
    for the application''s other widgets and objects because they are all owned by
    the main window or by one of the main window''s children. The application''s non-QObject
    objects can be left to be deleted by Python''s garbage collector.


    Applications often use resources (small files, such as icons, and data files),
    and PyQt''s resource mechanism making accessing and using them quite easy. They
    do require an extra build step, though, either using PyQt''s pyrcc4 console application,
    or myqt.py or Make PyQt programs supplied with the book''s examples.


    Dialogs can be created entirely in code as we did in the preceding chapter, or
    using Qt Designer, as we will see in the next chapter. If we need to incorporate
    Designer interface files in our application, like resources require an extra build
    step, either using PyQtuic4 console application, or again, using myqt.py or Make
    PyQt.


    Once the main window''s visual appearance has been set by its central widget and
    by menus, toolbars, and perhaps dock windows, we can concern others with loading
    and saving application settings. Many settings are commonly loaded in the main
    window''s initializer, and settings are normally saved (and the user given the
    chance to save unsaved changes) in a reimplementation of the closeEvent() method.'
  merge: -1
