  md: '# Chapter 4. Introduction to GUI Programming


    For PyQt 4.0, 4.1, and 4.2, we can still use partial(): We just need to keep a
    reference to the wrapper—we will not use the reference except for the connect()
    call, but the fact that it is an attribute of the instance instance will ensure
    that the wrapper function will not go out of scope while the form exists, and
    will work. So the connection is actually made like this:


    ```

    self.button2callback = partial(self.anyButton, "Two")

    self.connect(button2, SIGNAL("clicked()"))

    self.button2callback

    ```


    When button2 is clicked, the any() method will be called with a string parameter
    containing the text "Two". Here is what this method looks like:


    ```

    def anyButton(self, who):

    self.label.setText("You clicked ''%s''" % who)

    ```


    We could have this slot for all the buttons using the partial() function that
    we have just shown. And in fact, we could avoid using partial() at all and get
    the results:


    ```

    self.button3callback = lambda who="Three": self.anyButton(who)

    self.connect(button3, SIGNAL("clicked()"))

    self.button3callback

    ```


    Here''ve created a lambda function that is parameterized by the button''s name.
    It works the same as the partial() technique, and calls the same AttributeError()
    method, only with lambda being used to create the wrapper.


    Both button2callback() and button3callback() call anyButton(); the only difference
    between them is that the first "Two" as its parameter and the second passes "Three".


    If we are using PyQt 4.1.1 or later, and we use lambda callbacks, we don''t have
    to keep a reference to ourselves. This PyQt treats lambda specially when used
    to create wrappers in a connection. (This is the same treatment that is extended
    to functools.partial() in PyQt 4.3.) For this reason we can use lambda directly
    in connect()) For example:


    ```

    self.connect(button3, SIGNAL("clicked()"))

    lambda who="Three": self.anyButton(who)

    ```


    The wrapping technique works perfectly well, but there is an alternative approach
    that is slightly more involved, which may be useful in some cases, particularly
    when we don''t want to wrap our calls. This other technique is to respond to button4
    and button5. Here are their connections:


    ```

    self.connect(button4, SIGNAL("clicked()"), self.clicked)

    self.connect(button5, SIGNAL("clicked()"), self.clicked)

    ```'
