    to read line by line by using the file as an iterable.


    Here is the data from the exchange_csv file on one particular date. Some columns,
    and rows, have been omitted; these are indicated by ellipses.


    ```

    #

    Date (<m></year>),01/05/2007,...,01/12/2007,01/15/2007

    Closing/US Exchange Rate,1.1725,...,1.1688,1.1667

    U.S. Dollar (Noon),1.1755,...,1.1702,1.1681

    Argentina Peso (Floating Rate),0.3797,...,0.3773,0.3767

    Australian Dollar,0.9164,...,0.9157,0.9153

    ...

    Vietnamese Dong,0.000073,...,0.000073

    ```


    The exchange_csv file''s format uses several different kinds of lines. Lines begin
    with "#", and there may also be blank lines; we ignore all these. The rates are
    listed by name, followed by rates, comma separated. The rates are those applying
    on particular dates, with the last on each line being the most recent. We split
    each of these lines by commas and take the first item to be the currency name,
    and the last item to be the exchange rate. There is also a line that begins with
    "Date"; this lists the dates applying to each column. When we encounter this line
    we take the last date, since is the one that corresponds with the exchange rates
    we are using. There is also a line that begins "Closing"; we ignore it.


    For each exchange rate we insert an item into the self.rates dictionary, using
    the currency''s name for the key and the exchange rate as the value. We have assumed
    that the file text is either 7-bit ASCII or Unicode; if it isn''t one of these
    we may get an encoding error. If we know the encoding, we could specify it as
    a second argument to decode().


