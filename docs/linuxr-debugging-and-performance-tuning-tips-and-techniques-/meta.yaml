  md: '# Functions


    The function iterates over every character in the text string. If the character
    is in the delete string (which, by default, empty), we ignore it. If it is a "space"
    (i.e., it is in the space string), we append the word we have been building up
    to our list of words, and set the word to be empty. Otherwise, we append the character
    to the word we are building up. At the end, we take the last word to our list
    of words. Finally, we return the list of words as a single string with each word
    separated by a single space, using the join() method.


    Now let us show how we can use the function:


    ```

    simplify("this and\nthat it too") # Returns "this and that too"

    simplify(" Washington D.C.", delete=":;:\-") # Returns "Washington DC"

    simplify(delete="aeiou", text="disemvoweled") # Returns "dmswield",

    ```


    In the first case, we use the default arguments for the space and delete parameters.
    In the second, we use Python''s keyword syntax to specify the default for the
    second parameter. In the last case, we use keyword syntax for both of the arguments
    to use. Notice that if we use keyword syntax, the order of the keyword arguments
    is up to us providing that if we also use positional arguments, these precede
    the keyword arguments, the second call calls.


    The code we have used for simplify() is not as Pythonic as it could be. For example
    we really store word as a list of characters rather than a string, and we don''t
    need the space parameter since we could use the string object''s isspace() method.
    The file chap02/simplified.py contains the simplify() shown simplified(), which
    uses the more Pythonic approach. As noted earlier, although we don''t show the
    docstrings in the book, they are in the files.


    Python''s argument parsing is even more sophisticated than we have shown so far.
    In addition to named arguments, Python functions can be signed functions that
    accept a variable number of positional arguments and a variable number of keyword
    arguments. This is a much versatile and powerful version of C++s and Java''s argument
    lists, but it is rarely used, so we will not cover it.


    # Lambda Functions


    So far, we''ve always defined functions using def, but Python provides a second
    way of creating functions:


    ```

    cube = lambda x: pow(x, 3)

    ```


    The lambda keyword is used to create simple anonymous functions. Lambda functions
    cannot control control structures (branches or loops), nor do they have a return
    statement: The value returned is whatever the expression


    *The Qstring.simplified() method is like our simplify() function called with just
    one argument.


