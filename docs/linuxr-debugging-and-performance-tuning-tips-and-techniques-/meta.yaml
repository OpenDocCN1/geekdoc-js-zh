    # Classes and Modules


    Python fully supports procedural and object-oriented programming, and leaves us
    free to use either approach, or to combine the two. So far we have done procedural
    programming, although we have already used some Python classes—for example, the
    str string class. We have not yet defined our own classes. In this chapter we
    will learn how to create classes and methods, and how to do object-oriented programming
    with Python. And in all subsequent chapters, we will almost always use an object-oriented
    approach in the programs we write.


    We assume that are familiar with object-oriented programming—for example using
    C++ or Java—but will take the opportunity to clarify our terminology. We use the
    term “object”, and occasionally the term “instance”, to refer to an instance of
    a particular class. We use the terms “class”, “type”, and “data type”. Variables
    that belong to a specific instance are called “attributes” or “instance variables”.
    Variables that are used inside methods that are not instance variables are called
    “local variables”, or simply “variables”. We use the term “base class” to refer
    to a class that is inherited from; a base class may be the immediate ancestor,
    or may be further up the inheritance tree. Some people use the “super class” for
    this concept. We use the terms “subclass” and “derived class” for a class that
    inherits from-another class.


    In Python, any method can be overridden (reimplemented) in a subclass; this is
    the same as Java (apart from Java’s final methods). Overloading, that having methods
    with the same name but different parameter lists in the same class, is not supported,
    although this is not a limitation in practice because of Python’s versatile argument-handling
    capabilities. In fact, the underlying Qt C++ API makes extensive use of overloading,
    but PyQt handles this seamlessly behind the scenes, so in practice, we can call
    any “overloaded” Qt method and rely on PyQt to do the right thing.


    > *In C++ terminology, all Python methods are virtual.


