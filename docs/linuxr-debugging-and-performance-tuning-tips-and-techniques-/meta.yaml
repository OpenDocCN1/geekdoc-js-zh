  md: '# Designing User Interfaces


    We can now preview the form to see what the layout really looks like, and during
    the preview we can drag the form''s corner to make it smaller and larger to check
    that its resizing behavior is sensible. To preview, Form→Preview (or Ctrl+R).
    It is also possible to preview in different styles using the Form→Preview in menu
    option. The form should now look like the one in Figure 10. If this is not the
    case, use Edit→Undo to unwind your changes, and then lay things out. If you have
    to redo a layout, it sometimes helps to resize and reposition of the widgets to
    give Qt Designer more of a clue about how you want the layout to go, especially
    when using grid layouts.


    ![](bbox=[0.291, 0.273, 0.708, 0.436])


    Figure 10.1 a Find and Replace dialog


    We are now ready to set the labels'' buddy, set the form''s tab order, or any
    connections we need, and save the form.


    We will start with buddies. Click Edit→Edit Buddies to switch on buddy. To set
    up buddy relationships we will click a Label and drag the widget we want to be
    its buddy. In this example, we must click the Find what Label and drag to its
    Line Edit, and then do the for the Replace with Label and its Line Edit, and then
    for the Syntax Label and the Combo Box. To leave buddy mode, press F3. Now, no
    ampersands (&) should be visible in the Labels.


    Next we will set the form order. Click Edit→Edit Tab Order, and then click each
    number box in turn, in the tab order that you want. To leave tab order, press
    F3.


    The Find, Replace, and Replace All buttons will be connected to our own custom
    methods; we will be outside of Qt Designer. The Close button can be connected
    to the dialog''s reject() slot. To do this, click Edit→Edit Signals/Slots, and
    then drag from the Close button to the form. When you release, the Connection
    dialog will pop up. Click the (no-argument)clicked() signal from the list of slots
    on the left, and the reject() slot of slots on the right, and then click OK. To
    leave signal–slot mode, press F3.


    Click the form to deselect everything. This also has the effect of making the
    property editor show the form''s properties. Set the dialog''s object name (which
    will be used in its class name) to “FindAndReplaceDlg”, and set the “windowTitle”
    property to “Find and Replace”. Now click File→Save to save the user interface,
    giving it a filename of findandreplacedlg.ui.'
