  md: '# Summary


    Qt Designer provides a quick and easy way to create user interfaces. Using a visual
    design tool makes it much easier to see whether a design “works”. Another benefit
    of Qt Designer is if we change a design, providing we have not added, removed,
    or renamed widgets we refer to in code, code will not need to be changed at all.
    And if we do add, remove or move widgets, the changes to our code may be quite
    small, since Qt Designer handles all the widget creation and laying out for us.


    The fundamental principles of using Qt Designer are always the same: We drag widgets
    onto a form, containers (as frames, group boxes, and tab widgets) first, then
    ordinary widgets, and we set their properties. Then we add spacers to occupy gaps.
    Next we select particular widgets, spacers, and layouts, and apply layouts to
    them, repeating this process until everything is laid out. Then at the end we
    set buddies, the tab order, and signal-slot connections.


    Implementing dialogues with user interfaces that have been created by Qt Designer
    is similar to implementing them by hand. The biggest difference is the initializer,
    where we simply call setup() to create and lay out the widgets, and create the
    signal-slot connections. The methods we implement can be just as we have done
    before (and their code will be no different), usually we use the widgetName_signal
    naming convention, along with the @qtSignature decorator to take advantage of
    setup()’s ability to automatically create connections.


    A case that we have not covered is to use the “Widget” template to create composite
    widgets (widgets made of two or more widgets laid out together). In some cases
    these widget designs can be used for entire forms, and in other cases they can
    be used as components of forms—for example, to provide the page of a tab widget
    or of a stack order or two more composite widgets laid out together in a form
    to create a more complex form. This is possible by using Qt Designer and generating
    the Python modules in the normal way. Then we can import the modules, and in our
    class, we call each custom widget setup() to create the user interface.


    The questions about how smart a dialog is, what modality it should have, and how
    it validates are no different for dialogues created with Qt Designer than those
    created by hand. The only exception is that we can set widget properties in Qt
    Designer—for example, we could set a spinbox’s range and initial value. We can,
    of course, do the same thing in code, but for widgets that need only simple validation,
    doing it all in Qt Designer is usually convenient.


    We must use pyic4 to generate Python modules from Qt Designer .ui files, either
    by running pyic4 directly or using mkpyqt.py or Make PyQt, both of which also
    generate Python modules for resource files .qrc files are present.'
