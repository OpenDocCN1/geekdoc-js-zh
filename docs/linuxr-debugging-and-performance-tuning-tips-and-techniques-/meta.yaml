    \ function takes a sorted sequence, such as a sorted list, and an item to insert.\
    \ It locates the position in the sequence where the item should go to preserve\
    \ the sequence's order, and inserts the item there. The insert_left() function,\
    \ like all the bisect module's functions, uses a binary chop, so performance is\
    \ excellent on very long sequences.\n\nAnother approach would be to simply append\
    \ the new key and then sort() on the list. Python's sorting functionality is highly\
    \ optimized for partially sorted data, so performance might not be too bad, but\
    \ we prefer the more efficient solution.\n\n```\ndef __del__(self, key):\n   \
    \ i = bisect.bisect_left(self.__keys, key)\n    del self.__keys[i]\n    del self.__dict__[key]\n\
