    # Collections


    Once we have variables, that is, individual named object references to objects
    of particular types, it is natural to have entire collections of object references.
    Python''s standard collection types hold object references, so they can, in effect,
    hold collections of any type of object. Another consequence of collections using
    object references is that they can refer to objects of different types: They are
    not restricted to holding items that are all of a single type.


    The built-in collection types are tuple, list, dict (dictionary), set, and frozenset.
    All except tuple are mutable, so items can be added and deleted from lists, dictionaries,
    and sets. Some additional collection types are provided in the collections module.


    Python has one collection type in its standard library that does not hold object
    references; instead, it holds numbers of a specified type. This is the array type
    and it is used in situations where large numbers of numbers need to be stored
    and processed as efficiently as possible.


    In this section, we will look at Python''s built-in collection types.


    # Tuples


    A tuple is an ordered sequence of zero or more object references. Like strings
    (and as we will see shortly, lists) tuples support sequence functions such as
    len() as well as the slicing syntax that we said earlier. This makes it easy to
    extract items from a tuple. However, tuples are immutable so we cannot replace
    or delete any of their items. If we want to be able to modify an ordered sequence,
    we must use a list of a tuple; or if we already have a tuple but want to modify
    it, we convert it to a list and then apply our changes.


    We already had some informal exposure to tuples; for example, some of our interactions
    in IDLE produced results that were wrapped up as tuples, and we also used tuples
    to provide multiple arguments to the % operator.


    Here are some examples of how to construct tuples:


    ```

    >>> empty = ()

    >>> type(empty)

    <type ''tuple''>n>>> one = ("Canary")

    ```


    *The Qt library provides its rich set of container classes for C++, but these
    are not available in PyQt, and in any case, Python''s own collection classes are
    perfectly good to use.'
