  md: "# 56 Chapter 2. Control Structures\n\n```\ndef frange(start, stop, inc):\n\
    \    result = []\n    while start < stop:\n        result.append(start)\n    \
    \    start += inc\n```\n\nIf we call this function as frange(0, 5, 0.5) the list\
    \ we get back is [0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5], as we expect.\n\
    \nLike normal variables, we do not specify types for our parameters. And since\
    \ we have not given any default arguments, every parameter must be specified,\
    \ otherwise we will get a TypeError. For those unfamiliar with default arguments,\
    \ Python allows to give values to a parameter in a function signature. Each value\
    \ is a “default argument”, and it is used if the corresponding argument is not\
    \ given when the function is called.\n\nIn many cases we create functions where\
    \ one or more arguments will almost always have the same values. Python allows\
    \ us to provide default arguments for such situations, and we have taken advantage\
    \ of this to provide a default argument for the third parameter, as this revised\
    \ def shows:\n\n```\ndef frange(start, stop, inc=1):\n```\n\nThis works fine;\
    \ for example, we can now call frange(0, 5) to get [0, 1.0, 2.0, 3.0, 4.0] since\
    \ the increment by 1.0. With other languages that allow default arguments, Python\
    \ does not permit a parameter without a default argument to follow one that has\
    \ a default argument; so we could not have frange(start=0, 5). Nor does Python\
    \ overloaded overloaded. Neither of these restrictions is ever a problem in practice,\
    \ as we will see shortly when we discuss keyword arguments.\n\nUnfortunately,\
    \ our frange() function does not provide the same argument logic as range() provides.\
    \ For frange(), if one argument is given it is the upper bound, if two are given\
    \ they are the lower and upper bounds, and if three are given they are the bounds\
    \ and the step size. So we will create a frange() function, which mimics frange()'s\
    \ behavior:*\n\n```\ndef frange(arg0, arg1=None, arg2=None):\n    \"\"Returns\
    \ a list of floats using range-like syntax\"\"\n```\n\n```\nfrange(start, stop)\
    \      # start = arg0  stop = arg1  inc = arg2\nfrange(start, stop)    # start\
    \ = arg0  stop = arg1  inc = 1.0\nfrange(stop)           # start = 0.0   stop\
    \ = arg0  inc = 1.0\n\nstart = 0.0\n```\n\n> *For a more sophisticated frange(),\
    \ we see “Writing a range-like Function with Float Increments” in the Python Cookbook."
