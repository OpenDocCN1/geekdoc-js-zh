    # 35


    Multiple consecutive items can be deleted using del a slice, or by assigning a
    zero-length slice to a slice. To insert multiple items we can use slicing, or
    we can slice with operator +, and to add at the end we use extend(). See Table
    1.4 for a summary of the methods and functions applicable to lists.


    # Dictionaries


    The dict type is a data dictionary, also known as an associative array. A dictionary
    holds a set of unordered key-value pairs and provides very fast lookup. Keys are
    unique and must be of an immutable type, such as a Python string, a number, or
    a tuple; the value can be of any type including collection types so it is possible
    to create arbitrarily nested data structures. dictionaries are not sequences,
    we can get sequences of their keys and values, as we will see in the next chapter.


    Similar data structures exist in other languages—for example, Perl''s hash, Java''s
    HashMap, and C++''s unordered_map.


    Notice that a dictionary can be deleted by key, but a list cannot, since a dictionary''s
    keys must be immutable. In languages that offer only slice keys like strings and
    numbers, programmers who want multi-item keys resort to converting their items
    into a string, but thanks to tuples this kind of hack is not necessary in Python.


    Here are some examples of how to create a dictionary and access items in it:


    ```

    >>> insects = {"Dragonfly": 5000, "Praying Mantis": 2000,

    "Fly": 120000, "Beetle": 350000}

    >>> insects

    {''Fly'': 120000, ''Dragonfly'': 5000, ''Praying Mantis'': 2000,

    ''Beetle'': 350000}

    >>> insects["Dragonfly"]

    5000

    >>> insects["Grasshopper"] = 20000

    >>> insects

    {''Fly'': 120000, ''Dragonfly'': 5000, ''Praying Mantis'': 2000,

    ''Grasshopper'': 20000, ''Beetle'': 350000}

    ```


    Items can be deleted from a dictionary in the same way they can be deleted from
    a list. For example:


    ```

    >>> del insects["Fly"]

    >>> insects

    {''Dragonfly'': 5000, ''Praying Mantis'': 2000, ''Grasshopper'': 20000,

    ''Beetle'': 350000}

    >>> insects.pop("Beetle")

    350000

    >>> insects

    {''Dragonfly'': 5000, ''Praying Mantis'': 2000, ''Grasshopper'': 20000}

    ```'
