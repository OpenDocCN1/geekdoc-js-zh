  md: "# Functions\n\nSince def statements are executed at runtime, it is possible\
    \ to use different definitions depending on the situation. This is especially\
    \ useful when we want to use functionality in one version of Python that is not\
    \ available in an earlier one, without forcing us to upgrade.\n\nFor example,\
    \ Python 2.4 introduced the sorted() function. What if we had some code that needed\
    \ sorted(), but some of our users were using Python 2.3 and some were using 2.4\
    \ or later? We could simply replace on the sorted() method for 2.4 or later, and\
    \ provide our equivalent function for older Pythons:\n\n```\nimport sys\nsys.version_info[:2]\
    \ < (2, 4):\n  def sorted(items):\n    items = list(items)\n    items.sort()\n\
    \    return items\n```\n\nWe begin by importing the sys module, which provides\
    \ the version_info tuple. Then we use this tuple to get the major and minor version\
    \ numbers. Only if the version is lower than 2.4 do we define our sorted() function.\
    \ Notice also that we can compare tuples: Python can compare data structures,\
    \ including nested ones, providing all the types they contain can be compared.\n\
    \n# Partial Function Application\n\nAs we will see when we begin GUI programming,\
    \ we sometimes have situations where we need to call a particular function, but\
    \ we actually know what one of the parameters will be when we are writing the\
    \ code. For example, we might have several buttons that all need to invoke the\
    \ same function, but parameterized in some way by which particular button is the\
    \ cause of the invocation.\n\nIn the simplest case we want to store a function\
    \ (i.e., an object reference to a function) that we can then call later. A function\
    \ stored like this is known as a callback. Here is a trivial example:\n\n```\n\
    def hello(who):\n  print(\"Hello\", who)\ndef goodbye(who):\n  print(\"Goodbye\"\
    , who)\nfunclist = [hello, goodbye]\n# Some time later\nfor func in funclist:\n\
    \  func(\"Me\")\n```\n\nThis prints \"Hello Me\", and \"Goodbye Me\". Here, we\
    \ have stored two functions and called them later on. Notice that we passed the\
    \ same argument, \"Me\", each time we called func(). Since we know that the argument\
    \ is in-\n\n![](bbox=[0.915, 0.5103, 0.965, 0.5703])"
