    corresponding way. Finally, we set the window''s title.


    For small dumb dialogs that are only ever called from one place, it is possible
    to avoid creating a dialog class at all. Instead, we can simply create all the
    widgets in the invoking method, lay them out, connect them, and call exec(). If
    exec() returns True, then we can extract the values from the widgets and we are
    done. See the chapter 05/pen.py which contains the Properties dialog and we have
    just reviewed and another that does everything. Creating dialog inline is not
    an approach that we would recommend, so we will not review the code for doing
    it, but it is mentioned and provided in the example''s setPenInline() method for
    completeness.


    Dumb dialogs are easy to understand and use, but setting and getting values using
    a dialog''s widgets is not recommended except for the very simplest dialogs, where
    only one, two, or at most, a few values are involved. We have shown them primarily
    as a gentle introduction to dialogs, since creating, laying out, and connecting
    the widgets is the same in any kind of dialog. In the next section, we will look
    at standard dialogs, both modal and modeless ones.


    # Standard Dialogs


    We consider a dialog to be a “standard” dialog if it initializes its widgets in
    accordance with the values it sets through its methods and whose final values
    are obtained by method calls or through instance variables—not directly from the
    dialog''s widgets. A standard dialog can have both widget-level and form-level
    validation. Standard dialogs are either modal, with “accept” and “reject” buttons,
    or (less commonly) modeless, in which case they have “apply” and “close” buttons
    and notify changes through slot connections.


    One advantage of standard dialogs is that the caller does not need to know about
    their implementation, only how to get the resultant values when the user clicked
    OK. Another advantage, at least for modal dialogs, is that the user cannot interact
    with the dialog''s parent windows and their sibling windows, the relevant parts
