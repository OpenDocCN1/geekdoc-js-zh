    is composed of other widgets, laid out like those in a dialog), as a list or table,
    but here a single QLabel is sufficient. A QLabel can display text, HTML, or an
    image in any of the image formats that PyQt supports; later on we will see how
    to discover what these formats are, since they can vary. We have a minimum size
    because initially the label has nothing to show, and would take up no space, which
    would look peculiar. We have chosen to align our widgets vertically and horizontally
    centered.


