  md: "# Handling User Actions\n\nWe begin by using one of the QInputDialog class's\
    \ static methods to obtain a zoom factor. The getInteger() method takes a parent\
    \ (over which the dialog will center itself), a caption, text describing what\
    \ data is wanted, an initial value, and, optionally, minimum and maximum values.\n\
    \nThe QInputDialog provides some other static convenience methods, including getDouble()\
    \ to get a floating-point value, getItem() to choose a string from a list, and\
    \ getText() to get a string. For all of them, the return value is a two-tuple,\
    \ containing the value and a Boolean flag indicating whether the user entered\
    \ and accepted a value.\n\nIf the user clicked OK, we set the spinbox's value\
    \ to the given integer. If this value is different from the current value, the\
    \ spinbox will emit avalueChanged() signal. This signal is connected to the showImage()\
    \ slot, so the slot will be called if the user chose a new zoom percentage value.\n\
    \n```\ndef showImage(self, percent=None):\n    if self.image.isNull():\n     \
    \   return\n    if percent is None:\n        percent = self.zoomSpinBox.value()\n\
    \        factor = percent / 100.0\n        width = self.image.width() * factor\n\
    \        height = self.image.height() * factor\n        image = self.image.scaled(width,\
    \ height, Qt.KeepAspectRatio)\n        self.imageLabel.setPixmap(QPixmap.fromImage(image))\n\
    ```\n\nThis slot is called when a new image is created or loaded, whenever a transformation\
    \ is applied, and in response to the spinbox's valueChanged() signal. This signal\
    \ is emitted whenever the user changes the toolbar zoom spinbox's value, either\
    \ directly using the mouse, or indirectly through the \"edit zoom\" action described\
    \ earlier.\n\nWe retrieve the percentage and turn it into a zoom factor that we\
    \ can use to produce the image's new width and height. We create a copy of the\
    \ image scaled to the new size and preserving the aspect ratio, and set the imageLabel\
    \ to display this image. The label requires an image as a QPixmap, so we use the\
    \ static QPixmap.fromImage() method to convert the QImage to a QPixmap.\n\nNotice\
    \ that zooming the image has no effect on the original image; it is purely a change\
    \ in view, not an edit. This is why the dirty flag does not need to be set.\n\n\
    According to PyQt's documentation, QPixmaps are optimized for on-screen display\
    \ (so they are fast to draw), and QImages are optimized for editing (which is\
    \ why we have used them to hold the image data)."
