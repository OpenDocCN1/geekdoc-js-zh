  md: "# 52 Chapter 2. Control Structures\n\nWhen we iterate over a dictionary in\
    \ a for loop the variable is set to each dictionary key in turn.* Dictionaries\
    \ are unordered, so their keys are returned in an undefined order.\n\nTo get the\
    \ values rather than the keys we can use the values() method—for example, for\
    \ dates in presidents.values(): and to get pairs we can use the items() method.\
    \ For example:\n\n```\nfor item in presidents.items():\n    print(\"%s: %-%d\"\
    \ % (item[0], item[1][0], item[1][1]))\n```\n\nThis produces the same output as\
    \ the previous example, as does the following:\n\n```\nfor president, dates in\
    \ presidents.items():\n    print(\"%s: %-%d\" % (president, dates[0], dates)\n\
    ```\n\nWe have now unpacked each pair returned by the items() method, the dates\
    \ being the two-element tuple of dates.\n\nIf we want to iterate in order, we\
    \ must explicitly sort the list we iterate on it. For example, to iterate by name\
    \ we can do:\n\n```\nfor key in sorted(presidents):\n    print(\"%s: %-%d\" %\
    \ (key, presidents[key][0], presidents[key]))\n```\n\nBoth for loops and the sorted()\
    \ function can work on sequences or iterators. Iterators are objects that support\
    \ Python's iterator protocol, which means that they provide a next() method, and\
    \ raise a StopIteration exception when they have no more items. Surprisingly,\
    \ list returns each item in the list and strings, and a string iterator returns\
    \ each character of the string in turn. Dictionaries also support the protocol:\
    \ they return each of their keys in turn (in an arbitrary order). So, when we\
    \ use a for loop or call sorted() on a dictionary, we actually operate on the\
    \ dictionary's keys. For example:\n\n```\nnames = list(presidents)\n# names =\
    \ ['Madison', 'Jefferson', 'Washington', 'Adams']\n```\n\nSo in the for loop,\
    \ we effectively sorted(list(presidents)) which is the same as sorted(presidents.keys()).\
    \ If we want to be more explicit, we could break things down into steps:\n\n```\n\
    keys = presidents.keys() # Or: keys = list(presidents)\nkeys.sort()\nfor key in\
    \ keys:\n    print(\"%s: %-%d\" % (key, presidents[key][0], presidents[key]))\n\
    ```\n\n> *Note for C++/Qt programmers: Python's for loop iterates over a dictionary's\
    \ keys, whereas Qt loop iterates over a QMap's."
