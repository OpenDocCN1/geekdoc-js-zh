  md: "# Handling User Actions\n\ndiscussion of it later. The technique it uses is\
    \ shown in the Printing Images sidebar, and coverage of the filePrint() method\
    \ itself is in Chapter 13 (from page 400), where we also discuss approaches to\
    \ printing documents in general.\n\nThe only action we have not reviewed is the\
    \ \"file quit\" action. This action is connected to the main window's close()\
    \ method, which in turn causes a close event to be on the event queue. We provided\
    \ a reimplementation of the closeEvent() handler in which we made sure the user\
    \ had the chance to save unsaved changes, using a call to goToContinue(), and\
    \ where we saved the application's settings.\n\n# Handling Edit Actions\n\nMost\
    \ of the functionality of the file actions was provided by the MainWindow subclass\
    \ itself. The only work passed on was the image loading and saving, which the\
    \ Q instance variable was required to do. This particular division of responsibilities\
    \ between a main window and the data structure that holds the data is very common.\
    \ The main window handles the high-level file new, open, save, and recently used\
    \ files functionality, and the data structure loading and saving.\n\nIt is also\
    \ common for most, or even all, the editing functionality to be provided either\
    \ by the widget or the data structure. In the Image Changer application, the data\
    \ manipulation is handled by the data structure (the QImage), and the presentation\
    \ of the data is handled by the data viewer (the imageLabel). Again, this is a\
    \ very common separation of responsibilities.\n\nIn this section, we will review\
    \ some of the edit actions, omitting a couple that are almost identical to ones\
    \ that are shown. We will be brief here, since the functionality is specific to\
    \ the Image Changer application.\n\n```\ndef editInvert(self, on):\n    if self.image.isNull():n\
    \        return\n    self.image.invertPixels()\n    self.showImage()\n    self.dirty\
    \ = True\n    self.updateStatus(\"Inverted\") if on else \"Uninverted\")\n```\n\
    \nIf the user invokes the \"edit invert\" action, it will be checked (or unchecked).\
    \ In either case, we simply invert the image's pixels using the functionality\
    \ provided by QImage, which changed the image, the dirty flag, and call updateStatus()\
    \ so that the status bar briefly shows the action that was performed, and an additional\
    \ item is added to list.\n\nThe editSwapRedBlue() method (not shown) is the same\
    \ except that it uses the QImage, rgbSwapped() method, and it has different status\
    \ text."
