  trans: "\n嵌套媒体查询（media queries）可以避免在每次需要针对不同断点进行调整时，都重写选择器（在本例中为 `section.main`）。\n\
    \n此外，媒体查询声明直接插入到原始选择器下方，这非常方便。我发现，将媒体查询放在就近的上下文中来理解元素在不同视口下的变化，要比将它们聚集在样式表末尾或单独的文档中要容易得多。\n\
    \n### 使用变量定义断点\n\n媒体查询冒泡（Media-query bubbling）是 Sass 为响应式设计带来的极佳便利，但仍然存在大量的重复工作。在每个声明中，我们都要指定断点（上一个示例中的\
    \ `800px` 和 `500px`）。在设计过程中，我经常会根据正在处理的具体设计以及对布局反应的观察来微调这些断点，而不是依赖静态设备宽度。换句话说，你在每个嵌套媒体查询中指定的这些断点可能会发生变化。如果能定义一次并在一处进行编辑，那就太好了。Sass\
    \ 变量来救场！\n\n让我们为媒体查询中将使用的三个断点创建一些变量。我将给它们起一个灵活的名字，不绑定到特定的设备或有限的值。\n\n```\n$width-small:\
    \  500px;\n$width-medium: 800px;\n$width-large:  1200px;\n```\n\n将断点定义为 Sass 变量后，我们（从\
    \ Sass 3.2 开始）可以在整个文档中使用嵌套媒体查询时随时引用这些变量。例如：\n\n```\nsection.main {\n  font-size:\
    \ 16px;\n  line-height: 1.4;\n\n  @media screen and (max-width: $width-large)\
    \ {\n    float: left;\n    width: 65%;\n  }\n\n  @media screen and (max-width:\
    \ $width-medium) {\n    float: none;\n    width: auto;\n  }\n\n  @media screen\
    \ and (max-width: $width-small) {\n    font-size: 12px;\n    line-height: 1.4;\n\
    \  }\n}\n```\n\n它将编译为：\n\n```\nsection.main {\n  font-size: 16px;\n  line-height:\
    \ 1.4;\n\n  @media screen and (max-width: 1200px) {\n    float: left;\n    width:\
    \ 65%;\n  }\n\n  @media screen and (max-width: 800px) {\n    float: none;\n  \
    \  width: auto;\n  }\n\n  @media screen and (max-width: 500px) {\n    font-size:\
    \ 12px;\n    line-height: 1.4;\n  }\n}\n```\n\n如果我们之后决定微调这些断点，只需要编辑一次变量，Sass 就会处理所有使用过它们的地方更新。\n\
    \n```\n$width-small:  400px;\n$width-medium: 760px;\n$width-large:  1100px;\n\
    ```\n\n这在响应式设计的初始开发阶段非常有帮助，因为根据设计需求和设计需要适应的方式，这些断点是一个不断变动的目标。\n\n在这里甚至进行数学运算，因为我们可以对断点的值进行加法或减法：\n\
    \n```\n@media screen and (max-width: $width-small + 1) {\n  font-size: 12px;\n\
    \  line-height: 1.4;\n}\n```\n\n它将编译为：\n\n```\n@media screen and (max-width: 401px)\
    \ {\n  font-size: 12px;\n  line-height: 1.4;\n}\n```\n\n而：\n\n```\n@media screen\
    \ and (max-width: $width-small - 1) {\n  font-size: 12px;\n  line-height: 1.4;\n\
    }\n```\n\n它将编译为：\n\n```\n@media screen and (max-width: 399px) {\n  font-size:\
    \ 12px;\n  line-height: 1.4;\n}\n```\n\n更进一步，你还可以将整个媒体查询定义为变量（而不仅仅是数值）：\n\n```\n\
    $mobile-first: \"screen and (min-width: 300px)\";\n\n@media #{$mobile-first} {\n\
    \  #content {\n    font-size: 14px;\n    line-height: 1.5;\n  }\n}\n```\n\n注意包裹\
    \ `$mobile-first` 变量的插值括号——`#{}`。这是一种提醒 Sass 在选择器或属性名称内部编译内容的特殊方法。\n\n上面的 SCSS\
    \ 将编译为：\n\n```\n@media screen and (min-width: 300px) {\n  #content {\n    font-size:\
    \ 14px;\n    line-height: 1.5;\n  }\n}\n```\n\n当你将媒体查询嵌套在受影响的声明内部时，变量可以节省大量的重复工作。但我们甚至可以使用\
    \ Sass 3.2 引入的 `@content` 块进一步简化问题。\n\n### 结合 @content 块和混合入（mixins）\n\n通过使用 Sass\
    \ 的 `@content` 指令，你可以将整个样式块传递给 mixin，Sass 会把这些块放回调用 mixin 的声明中。这听起来很困惑，但处于上下文位置的媒体查询让响应式设计变得简单得多。让我们创建一个处理三个断点的响应式\
    \ mixin。\n\n```scss\n@mixin responsive {\n  @media screen and (max-width: $width-large)\
    \ {\n    @content;\n  }\n  @media screen and (max-width: $width-medium) {\n  \
    \  @content;\n  }\n  @media screen and (max-width: $width-small) {\n    @content;\n\
    \  }\n}\n```\n\n现在我们可以这样使用它：\n\n```scss\nsection.main {\n  font-size: 16px;\n\
    \  line-height: 1.4;\n\n  @include responsive {\n    float: left;\n    width:\
    \ 65%;\n  }\n\n  @include responsive {\n    float: none;\n    width: auto;\n \
    \ }\n\n  @include responsive {\n    font-size: 12px;\n    line-height: 1.4;\n\
    \  }\n}\n```\n\n它将编译为：\n\n```css\nsection.main {\n  font-size: 16px;\n  line-height:\
    \ 1.4;\n}\n\n@media screen and (max-width: 1200px) {\n  section.main {\n    float:\
    \ left;\n    width: 65%;\n  }\n}\n\n@media screen and (max-width: 800px) {\n \
    \ section.main {\n    float: none;\n    width: auto;\n  }\n}\n\n@media screen\
    \ and (max-width: 500px) {\n  section.main {\n    font-size: 12px;\n    line-height:\
    \ 1.4;\n  }\n}\n```\n\n等一下，上面的示例由于 `@content` 的工作方式有一点缺陷。让我们完善 mixin 使其更实用：\n\n\
    ```scss\n@mixin responsive($breakpoint) {\n  @media screen and (max-width: $breakpoint)\
    \ {\n    @content;\n  }\n}\n```\n\n使用方法如下：\n\n```scss\nsection.main {\n  font-size:\
    \ 16px;\n  line-height: 1.4;\n\n  @include responsive($width-large) {\n    float:\
    \ left;\n    width: 65%;\n  }\n\n  @include responsive($width-medium) {\n    float:\
    \ none;\n    width: auto;\n  }\n\n  @include responsive($width-small) {\n    font-size:\
    \ 12px;\n    line-height: 1.4;\n  }\n}\n```\n\n这要干净得多！通过使用变量和 mixin，你避免了重复媒体查询语法，并保持了代码的可维护性。\n"
- fmt: "\nFor a large stylesheet that uses responsive design with frequent media queries\
    \ for multiple viewports, this would reduce the compiled CSS file quite a bit.\
    \ Unfortunately, Sass doesn’t (yet?) support this “aggregated media query bubbling,”\
    \ as I’m coining it, but for most projects, the trade-off of a slightly larger\
    \ compiled stylesheet is worth the ease and sensibility of nesting media queries\
    \ inline. So for now, that’s how we’ll roll.\n\n## “RETINIZING” HIDPI BACKGROUND\
    \ IMAGES\n\nAs if things weren’t complicated enough for us web designers, the\
    \ rise of High Dots Per Inch (HiDPI) screens has created another challenge. Apple’s\
    \ gorgeous Retina screens, for example, squeeze twice the number of pixels compared\
    \ to that of a normal display. That means beautiful clarity and saying goodbye\
    \ to fuzzy pixels! But only if you take the time to create graphics that reflect\
    \ this super-sharp new world.\n\nFor `<img>` elements on the page, this typically\
    \ means creating images twice as large and compressing them to half their size\
    \ by using the `width` attribute in the markup. Alternatively, there are craftier\
    \ ways to handle selective image-serving via media queries and JavaScript, such\
    \ as Scott Jehl’s brilliant Picturefill project ([http://bkaprt.com/sass/14/](http://bkaprt.com/sass/14/)).\n\
    \nTo share an example of handling HiDPI images, let’s take a look at the Sasquatch\
    \ Records logo, which is 133×121 pixels (Fig 4.1). For devices that support the\
    \ extra pixels, we’ll create a second version that’s twice as large (266×242)\
    \ and reduce it to 133 pixels in the markup for twice the clarity (Fig 4.2):\n\
    \n```\n<img src=\"-/img/logo-peek-2x.png\" width=\"133\" />\n```\n\n![](image/4-1_4-2.gif)\n\
    \nFIG 4.1–FIG 4.2: Normal-resolution logo on the left, HiDPI version on the right.\n\
    \nFor background images, we simply use CSS media queries (in modern browsers that\
    \ support them) to determine whether the display is HiDPI and render the appropriately\
    \ sized image.\n\nOn the Sasquatch Records site, for instance, we have a little\
    \ list of social network links in the sidebar. Each link’s icon has a background\
    \ image specified in the stylesheet (Fig 4.3).\n\n![4-3.tif](image/4-3.gif)\n\n\
    FIG 4.3: Social network links in the sidebar of the Sasquatch Records site.\n\n\
    In the Dribbble link, the CSS to align a normal-resolution icon to the left of\
    \ the text might look like this:\n\n```\nul.follow li.dribbble a {\n  padding-left:\
    \ 30px;\n  background-repeat: no-repeat;\n  background-position: 0 50%;\n  background-image:\
    \ url(../img/icon-dribbble.png);\n}\n```\n\nFor HiDPI displays, we override the\
    \ icon with one that is twice as large, and then “squeeze” it down to the right\
    \ dimensions using the CSS3 `background-size` property. To detect whether the\
    \ display is HiDPI, we use a media query and the `min-device-pixel-ratio` property\
    \ in CSS3 (which varies depending on the browser vendor).\n\n```\n@media (-webkit-min-device-pixel-ratio:\
    \ 1.5),\n       (min--moz-device-pixel-ratio: 1.5),\n       (-o-min-device-pixel-ratio:\
    \ 3/2),\n       (min-device-pixel-ratio: 1.5),\n       (min-resolution: 1.5dppx)\
    \ {\n  ul.follow li.dribbble a {\n    padding-left: 30px;\n    background-repeat:\
    \ no-repeat;\n    background-position: 0 50%;\n    background-image: url(../img/icon-dribbble-2x.png);\n\
    \    -webkit-background-size: 24px 24px;\n       -moz-background-size: 24px 24px;\n\
    \            background-size: 24px 24px;\n  }\n}\n```\n\nEssentially, we’re saying\
    \ that if the display’s pixel ratio is at least 1.5 times the normal density,\
    \ let’s use a larger, 48×48 icon (`icon-dribbble-2x.png`) and squash it down to\
    \ 24×24 when displayed on the screen.\n\nThe difference, when viewed on a HiDPI\
    \ display, is stunningly sharp. All those fuzzy edges disappear (Fig 4.4).\n\n\
    ![4-4.tif](image/4-4.gif)\n\nFIG 4.4: Crisp, Hi-DPI icons by the power of Sass!\n\
    \nAs you can imagine, “retinizing” your interfaces can result in a pile of repetition,\
    \ referencing that media query and a second image every time you’d like to override\
    \ your normal-resolution background images. Here’s where Sass can make this process\
    \ rather painless.\n\nWe can create a Sass mixin that handles all the heavy lifting,\
    \ even forming two different file names with a bit of crafty concatenation.\n\n\
    Here’s the `retinize` mixin I use in my everyday projects—I’ll break down each\
    \ important section.\n\n```\n @mixin retinize($file, $type, $width, $height) {\n\
    \  background-image: url('../img/' + $file + '.' + $type);\n\n  @media (-webkit-min-device-pixel-ratio:\
    \ 1.5),\n         (min--moz-device-pixel-ratio: 1.5),\n         (-o-min-device-pixel-ratio:\
    \ 3/2),\n         (min-device-pixel-ratio: 1.5),\n         (min-resolution: 1.5dppx)\
    \ {\n    & {\n      background-image: url('../img/' + $file + '-2x.' + $type);\n\
    \      -webkit-background-size: $width $height;\n         -moz-background-size:\
    \ $width $height;\n              background-size: $width $height;\n    }\n  }\n\
    }\n```\n\nThe first line of the mixin sets up the four arguments we need to build\
    \ the right compiled code:\n\n* The file name\n* The type of image (JPG, GIF,\
    \ PNG)\n* Image width on screen\n* Image height on screen\n\nThose four arguments\
    \ are listed like so:\n\n```\n@mixin retinize($file, $type, $width, $height) {\n\
    ```\n\nCalling the `retinize` mixin is as simple as plugging in those values anytime\
    \ you’d like. For example:\n\n```\nli.dribbble {\n  @include retinize('icon-dribbble',\
    \ 'png', 24px, 24px);\n}\n\nli.flickr {\n  @include retinize('icon-flickr', 'png',\
    \ 24px, 24px);\n}\n\nli.facebook {\n  @include retinize('icon-facebook', 'png',\
    \ 24px, 24px);\n}\n```\n"
  raw: "For a large stylesheet that uses responsive design with frequent media queries\
    \ for multiple viewports, this would reduce the compiled CSS file quite a bit.\
    \ Unfortunately, Sass doesn’t (yet?) support this “aggregated media query bubbling,”\
    \ as I’m coining it, but for most projects, the trade-off of a slightly larger\
    \ compiled stylesheet is worth the ease and sensibility of nesting media queries\
    \ inline. So for now, that’s how we’ll roll.\n\n## “RETINIZING” HIDPI BACKGROUND\
    \ IMAGES\n\nAs if things weren’t complicated enough for us web designers, the\
    \ rise of High Dots Per Inch (HiDPI) screens has created another challenge. Apple’s\
    \ gorgeous Retina screens, for example, squeeze twice the number of pixels compared\
    \ to that of a normal display. That means beautiful clarity and saying goodbye\
    \ to fuzzy pixels! But only if you take the time to create graphics that reflect\
    \ this super-sharp new world.\n\nFor `<img>` elements on the page, this typically\
    \ means creating images twice as large and compressing them to half their size\
    \ by using the `width` attribute in the markup. Alternatively, there are craftier\
    \ ways to handle selective image-serving via media queries and JavaScript, such\
    \ as Scott Jehl’s brilliant Picturefill project ([http://bkaprt.com/sass/14/](http://bkaprt.com/sass/14/)).\n\
    \nTo share an example of handling HiDPI images, let’s take a look at the Sasquatch\
    \ Records logo, which is 133×121 pixels (**Fig 4.1**). For devices that support\
    \ the extra pixels, we’ll create a second version that’s twice as large (266×242)\
    \ and reduce it to 133 pixels in the markup for twice the clarity (**Fig 4.2**):\n\
    \n```\n<img src=\"-/img/logo-peek-2x.png\" width=\"133\" />\n```\n\n![](image/4-1_4-2.gif)\n\
    \nFIG 4.1–FIG 4.2: Normal-resolution logo on the left, HiDPI version on the right.\n\
    \nFor background images, we simply use CSS media queries (in modern browsers that\
    \ support them) to determine whether the display is HiDPI and render the appropriately\
    \ sized image.\n\nOn the Sasquatch Records site, for instance, we have a little\
    \ list of social network links in the sidebar. Each link’s icon has a background\
    \ image specified in the stylesheet (**Fig 4.3**).\n\n![4-3.tif](image/4-3.gif)\n\
    \nFIG 4.3: Social network links in the sidebar of the Sasquatch Records site.\n\
    \nIn the Dribbble link, the CSS to align a normal-resolution icon to the left\
    \ of the text might look like this:\n\n```\nul.follow li.dribbble a {\n  padding-left:\
    \ 30px;\n  background-repeat: no-repeat;\n  background-position: 0 50%;\n  background-image:\
    \ url(../img/icon-dribbble.png);\n}\n```\n\nFor HiDPI displays, we override the\
    \ icon with one that is twice as large, and then “squeeze” it down to the right\
    \ dimensions using the CSS3 `background-size` property. To detect whether the\
    \ display is HiDPI, we use a media query and the `min-device-pixel-ratio` property\
    \ in CSS3 (which varies depending on the browser vendor).\n\n```\n@media (-webkit-min-device-pixel-ratio:\
    \ 1.5),\n       (min--moz-device-pixel-ratio: 1.5),\n       (-o-min-device-pixel-ratio:\
    \ 3/2),\n       (min-device-pixel-ratio: 1.5),\n       (min-resolution: 1.5dppx)\
    \ {\n  ul.follow li.dribbble a {\n    padding-left: 30px;\n    background-repeat:\
    \ no-repeat;\n    background-position: 0 50%;\n    background-image: url(../img/icon-dribbble-2x.png);\n\
    \    -webkit-background-size: 24px 24px;\n       -moz-background-size: 24px 24px;\n\
    \            background-size: 24px 24px;\n  }\n}\n```\n\nEssentially, we’re saying\
    \ that if the display’s pixel ratio is at least 1.5 times the normal density,\
    \ let’s use a larger, 48×48 icon (`icon-dribbble-2x.png`) and squash it down to\
    \ 24×24 when displayed on the screen.\n\nThe difference, when viewed on a HiDPI\
    \ display, is stunningly sharp. All those fuzzy edges disappear (**Fig 4.4**).\n\
    \n![4-4.tif](image/4-4.gif)\n\nFIG 4.4: Crisp, Hi-DPI icons by the power of Sass!\n\
    \nAs you can imagine, “retinizing” your interfaces can result in a pile of repetition,\
    \ referencing that media query and a second image every time you’d like to override\
    \ your normal-resolution background images. Here’s where Sass can make this process\
    \ rather painless.\n\nWe can create a Sass mixin that handles all the heavy lifting,\
    \ even forming two different file names with a bit of crafty concatenation.\n\n\
    Here’s the `retinize` mixin I use in my everyday projects—I’ll break down each\
    \ important section.\n\n```\n @mixin retinize($file, $type, $width, $height) {\n\
    \  background-image: url('../img/' + $file + '.' + $type);\n\n  @media (-webkit-min-device-pixel-ratio:\
    \ 1.5),\n         (min--moz-device-pixel-ratio: 1.5),\n         (-o-min-device-pixel-ratio:\
    \ 3/2),\n         (min-device-pixel-ratio: 1.5),\n         (min-resolution: 1.5dppx)\
    \ {\n    & {\n      background-image: url('../img/' + $file + '-2x.' + $type);\n\
    \      -webkit-background-size: $width $height;\n         -moz-background-size:\
    \ $width $height;\n              background-size: $width $height;\n    }\n  }\n\
    }\n```\n\nThe first line of the mixin sets up the four arguments we need to build\
    \ the right compiled code:\n\n*   The file name\n\n*   The type of image (JPG,\
    \ GIF, PNG)\n\n*   Image width on screen\n\n*   Image height on screen\n\nThose\
    \ four arguments are listed like so:\n\n```\n@mixin retinize($file, $type, $width,\
    \ $height) {\n```\n\nCalling the retinize mixin is as simple as plugging in those\
    \ four values anytime you’d like. For example, let’s call the mixin for the Dribbble\
    \ icon, a PNG that should be rendered at 24×24:\n\n```\nli.dribbble a {\n  @include\
    \ retinize('icon-dribbble', 'png', 24px, 24px);\n}\nli.flickr a {\n  @include\
    \ retinize('icon-flickr', 'png', 24px, 24px);\n}\nli.facebook a {\n  @include\
    \ retinize('icon-facebook', 'png', 24px, 24px);\n}\n```\n\nBack to the mixin itself,\
    \ the second line forms the normal-resolution `background-image` rule by stringing\
    \ the arguments together. Sass can concatenate!\n\n```\n background-image: url('../img/'\
    \ + $file + '.' + $type);\n```\n\nWe’re adding the file path to the image, then\
    \ adding the file name and the period and the file type, which will compile like\
    \ this:\n\n```\nbackground-image: url(../img/icon-dribbble.png);\n```\n\nWith\
    \ the normal background image in place, we’ll now add the media query that will\
    \ override that image with the @2× version for devices that support a 1.5 pixel\
    \ ratio or higher. Again, we’re including all the vendor-prefixed properties to\
    \ ensure this will work across as many browsers as possible.\n\n```\n@mixin retinize($file,\
    \ $type, $width, $height) {\n  background-image: url('../img/' + $file + '.' +\
    \ $type);\n\n  @media (-webkit-min-device-pixel-ratio: 1.5),\n         (min--moz-device-pixel-ratio:\
    \ 1.5),\n         (-o-min-device-pixel-ratio: 3/2),\n         (min-device-pixel-ratio:\
    \ 1.5),\n         (min-resolution: 1.5dppx) {\n    & {\n      background-image:\
    \ url('../img/' + $file + '-2x.' + $type);\n    }\n  }\n}\n```\n\nNext we need\
    \ a way to reference whatever selector we’re applying this media query to, and\
    \ that depends on where we’ve called the mixin from. Fortunately, we can use the\
    \ special `&` placeholder, which you’ll remember from the previous chapter, and\
    \ which inserts whatever the “current selector” is. (In our example case, it’s\
    \ `li.dribbble a`).\n\n```\n@mixin retinize($file, $type, $width, $height) {\n\
    \  background-image: url('../img/' + $file + '.' + $type);\n\n  @media (-webkit-min-device-pixel-ratio:\
    \ 1.5),\n         (min--moz-device-pixel-ratio: 1.5),\n         (-o-min-device-pixel-ratio:\
    \ 3/2),\n         (min-device-pixel-ratio: 1.5),\n         (min-resolution: 1.5dppx)\
    \ {\n    & {\n      background-image: url('../img/' + $file + '-2x.' + $type);\n\
    \    }\n  }\n}\n```\n\nNotice also that we’re using Sass’s concatenation ability\
    \ to append a `-2x` to the file name to refer to the larger image. It’s a good\
    \ idea to settle on a naming convention like this—a short bit of text that makes\
    \ managing assets and calling file names in Sass easier:\n\n*   Normal image:\
    \ `file-name.png`\n\n*   @2× image for HiDPI: `file-name-2x.png`\n\nYou don’t\
    \ need to use `-2x`; you can use whatever you’d like: `file-name-jumbo`, `file-name-twice-as-big`,\
    \ `file-name-at-two-times`, etc. But I think `-2x` works just fine."
