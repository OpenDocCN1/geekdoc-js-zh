  trans: "\n\n```\n<h2 class=\"alert alert-positive\">这是一个积极提示！</h2>\n```\n\n如果每个提示的样式设置如下所示：\n\
    \n```css\n.alert {\n  padding: 15px;\n  font-size: 1.2em;\n  font-weight: normal;\n\
    \  text-transform: uppercase;\n  line-height: 1;\n  letter-spacing: 3px;\n  text-align:\
    \ center;\n  color: #fff;\n  background: $color-accent;\n  @include shadow(0,\
    \ 1px, 2px, rgba(0,0,0,.5));\n  @include rounded(10px);\n}\n.alert-positive {\n\
    \  background: #9c3;\n}\n```\n\n我们不需要在标记语言中充斥额外的类来处理这些细小的异常，而是可以使用 Sass 的 `@extend`\
    \ 函数将多个选择器之间共享的样式“链”在一起。此外，我们还可以添加额外的覆盖规则，创建一个创建一个新的唯一样式，而无需重复共享的样式。\n\n因此，如果我们想使用\
    \ `@extend` 来处理两种类型的提示消息，可以将标记简化为仅一个类：\n\n```html\n<h2 class=\"alert-positive\"\
    >这是一个积极提示！</h2>\n```\n\n然后使用 `@extend` 包含 `h2.alert` 类的样式，加上 `background-color`\
    \ 异常：\n\n```css\n.alert-positive {\n  @extend .alert;\n  background: #9c3;\n}\n\
    ```\n\nSass 将会高效地编译扩展类，如下所示：\n\n```css\n.alert, .alert-positive {\n  padding:\
    \ 15px;\n  font-size: 1.2em;\n  font-weight: normal;\n  text-transform: uppercase;\n\
    \  line-height: 1;\n  letter-spacing: 3px;\n  text-align: center;\n  color: #fff;\n\
    \  background: #ea4c89;\n       -webkit-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n\
    \       moz-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n       box-shadow: 0 1px\
    \ 2px rgba(0, 0, 0, 0.5);\n    -webkit-border-radius: 10px;\n       -moz-border-radius:\
    \ 10px;\n       border-radius: 10px;\n}\n.alert-positive {\n  background: #9c3;\n\
    }\n```\n\n现在，当然，我们从一开始就可以这样写 CSS，但 `@extend` 语法让它更快——更不用说哪些样式在类之间是共享的了。这更容易理解正在发生什么。\n\
    \n使用 `@extend` 还允许我们在语义上更加简洁，根据含义而非外观来定义类名。\n\n### 多个 @extends\n\n你还可以在声明中 `@extend`\
    \ 多个类，这会将每个类的所有样式链在一起：\n\n```css\n.alert {\n  padding: 15px;\n  font-size: 1.2em;\n\
    \  text-align: center;\n  background: $color-accent;\n}\n.important {\n  font-size:\
    \ 4em;\n}\n.alert-positive {\n  @extend .alert;\n  @extend .important;\n  background:\
    \ #9c3;\n}\n```\n\n将其编译为：\n\n```css\n.alert, alert-positive {\n  padding: 15px;\n\
    \  font-size: 1.2em;\n  text-align: center;\n  background: #ea4c89;\n}\n.important,\
    \ .alert-positive {\n  font-size: 4em;\n}\n.alert-positive {\n  background: #9c3;\n\
    }\n```\n\n同样，Sass 高效地组织内容，使用逗号分隔的选择器将共享样式分组，然后为任何异常创建单一声明。\n\n####  @extend 使用占位符选择器\n\
    \n如果你扩展的类仅仅是为了扩展其他样式而存在呢？换句话说，可能会创建一个不会单独使用的类。\n\n这就是占位符选择器（placeholder selectors），它允许你定义“虚拟”类，这些类本身不会出现在输出的\
    \ CSS 中。你可以使用 `@extend` 引用占位符。\n\n让我们在实践中看看。我们将为一组定义按钮的样式块创建一个类。我们将使用占位符选择器，在\
    \ Sass 中，这意味着用 `%` 而不是 `.` 作为类名前。\n\n```css\n%button {\n  padding: 10px;\n  font-weight:\
    \ bold;\n  background: blue;\n  border-radius: 6px;\n}\n```\n\n我们可以像以前一样使用 `@extend`\
    \ 在其他类中调用此规则集：\n\n```css\n.buy {\n  @extend %button;\n}\n.submit {\n  @extend\
    \ %button;\n  background: green;\n}\n```\n\nSass 将其编译为扩展类，但 `%button` 占位符规则集不会出现在输出中：\n\
    \n```css\n.buy, .submit {\n  padding: 10px;\n  font-weight: bold;\n  background:\
    \ blue;\n  border-radius: 6px;\n}\n.submit {\n  background: green;\n}\n```\n\n"
- fmt: "\nNesting media queries avoids rewriting the selector (`section.main` in this\
    \ example) each time you’d like to make adjustments for various breakpoints.\n\
    \nIt’s also immensely convenient that the media-query declarations slot right\
    \ under the original selector. I’ve found it much easier to understand what’s\
    \ happening to an element under varying viewports by having the media queries\
    \ nearby in context, rather than gathered at the end of the stylesheet or in a\
    \ separate document.\n\n### Using variables to define breakpoints\n\nMedia-query\
    \ bubbling is a wonderful convenience that Sass brings to responsive design, but\
    \ there is still quite a bit of repetition. In each declaration, we’re specifying\
    \ the breakpoints (`800px` and `500px` in the previous example). Often while designing,\
    \ I tweak those breakpoints based on the particular design I’m working on and\
    \ observations on how the layout reacts, instead of relying on static device widths.\
    \ In other words, those breakpoints that you’re specifying in each nested media\
    \ query could change. It’d be great to define those once and be able to edit them\
    \ in one spot. Sass variables to the rescue!\n\nLet’s create some variables for\
    \ three breakpoints we’ll use in our media queries. I’m going to name them something\
    \ flexible and not tied down to a specific device or finite value.\n\n```\n$width-small:\
    \  500px;\n$width-medium: 800px;\n$width-large:  1200px;\n```\n\nWith the breakpoints\
    \ defined as Sass variables, we can (as of Sass 3.2) refer to these whenever we\
    \ use nested media queries throughout the document. For example:\n\n```\nsection.main\
    \ {\n  font-size: 16px;\n  line-height: 1.4;\n\n  @media screen and (max-width:\
    \ $width-large) {\n    float: left;\n    width: 65%;\n  }\n\n  @media screen and\
    \ (max-width: $width-medium) {\n    float: none;\n    width: auto;\n  }\n\n  @media\
    \ screen and (max-width: $width-small) {\n    font-size: 12px;\n    line-height:\
    \ 1.4;\n  }\n}\n```\n\nWhich will compile to:\n\n```\nsection.main {\n  font-size:\
    \ 16px;\n  line-height: 1.4;\n\n  @media screen and (max-width: 1200px) {\n  \
    \  float: left;\n    width: 65%;\n  }\n\n  @media screen and (max-width: 800px)\
    \ {\n    float: none;\n    width: auto;\n  }\n\n  @media screen and (max-width:\
    \ 500px) {\n    font-size: 12px;\n    line-height: 1.4;\n  }\n}\n```\n\nIf we\
    \ later decide to tweak those breakpoints, we need only edit the variables once,\
    \ and Sass will take care of updating them wherever we used them.\n\n```\n$width-small:\
    \  400px;\n$width-medium: 760px;\n$width-large:  1100px;\n```\n\nThis helps tremendously\
    \ during the initial development of a responsive design, when those breakpoints\
    \ are a moving target depending on the design requirements and the way the design\
    \ needs to adapt.\n\nEven math is possible here, as we can add to or subtract\
    \ from the breakpoint’s value:\n\n```\n@media screen and (max-width: $width-small\
    \ + 1) {\n  font-size: 12px;\n  line-height: 1.4;\n}\n```\n\nWill compile to:\n\
    \n```\n@media screen and (max-width: 401px) {\n  font-size: 12px;\n  line-height:\
    \ 1.4;\n}\n```\n\nWhile:\n\n```\n@media screen and (max-width: $width-small -\
    \ 1) {\n  font-size: 12px;\n  line-height: 1.4;\n}\n```\n\nWill compile to:\n\n\
    ```\n@media screen and (max-width: 399px) {\n  font-size: 12px;\n  line-height:\
    \ 1.4;\n}\n```\n\nGoing a step further, you can also define an entire media query\
    \ as a variable (not just the numeric value):\n\n```\n$mobile-first: \"screen\
    \ and (min-width: 300px)\";\n\n@media #{$mobile-first} {\n  #content {\n    font-size:\
    \ 14px;\n    line-height: 1.5;\n  }\n}\n```\n\nNotice the interpolation brackets—`#{}`—surrounding\
    \ the `$mobile-first` variable. That’s a special way to alert Sass to compile\
    \ something within a selector or property name.\n\nThe above SCSS will compile\
    \ to:\n\n```\n@media screen and (min-width: 300px) {\n  #content {\n    font-size:\
    \ 14px;\n    line-height: 1.5;\n  }\n}\n```\n\nWhen you nest media queries within\
    \ the declarations they affect, variables save you a ton of repetition. But we\
    \ can even simplify things further with `@content` blocks, also introduced in\
    \ Sass 3.2.\n\n### Combining @content blocks and mixins\n\nBy using Sass’s `@content`\
    \ directive, you can pass entire blocks of styles to a mixin, and Sass will place\
    \ those blocks back into the declaration that calls the mixin. That sounds confusing,\
    \ but contextually-placed media queries make responsive design much easier. Let’s\
    \ create a responsive mixin that handles three breakpoints.\n\n```scss\n@mixin\
    \ responsive {\n  @media screen and (max-width: $width-large) {\n    @content;\n\
    \  }\n  @media screen and (max-width: $width-medium) {\n    @content;\n  }\n \
    \ @media screen and (max-width: $width-small) {\n    @content;\n  }\n}\n```\n\n\
    Now we can use it like this:\n\n```scss\nsection.main {\n  font-size: 16px;\n\
    \  line-height: 1.4;\n\n  @include responsive {\n    float: left;\n    width:\
    \ 65%;\n  }\n\n  @include responsive {\n    float: none;\n    width: auto;\n \
    \ }\n\n  @include responsive {\n    font-size: 12px;\n    line-height: 1.4;\n\
    \  }\n}\n```\n\nThis will compile to:\n\n```css\nsection.main {\n  font-size:\
    \ 16px;\n  line-height: 1.4;\n}\n\n@media screen and (max-width: 1200px) {\n \
    \ section.main {\n    float: left;\n    width: 65%;\n  }\n}\n\n@media screen and\
    \ (max-width: 800px) {\n  section.main {\n    float: none;\n    width: auto;\n\
    \  }\n}\n\n@media screen and (max-width: 500px) {\n  section.main {\n    font-size:\
    \ 12px;\n    line-height: 1.4;\n  }\n}\n```\n\nWait, the example above is slightly\
    \ flawed because of how `@content` works. Let's refine the mixin to be more practical:\n\
    \n```scss\n@mixin responsive($breakpoint) {\n  @media screen and (max-width: $breakpoint)\
    \ {\n    @content;\n  }\n}\n```\n\nAnd usage:\n\n```scss\nsection.main {\n  font-size:\
    \ 16px;\n  line-height: 1.4;\n\n  @include responsive($width-large) {\n    float:\
    \ left;\n    width: 65%;\n  }\n\n  @include responsive($width-medium) {\n    float:\
    \ none;\n    width: auto;\n  }\n\n  @include responsive($width-small) {\n    font-size:\
    \ 12px;\n    line-height: 1.4;\n  }\n}\n```\n\nThis is much cleaner! By using\
    \ variables and mixins, you avoid repeating the media query syntax and keep your\
    \ code maintainable.\n"
  raw: "Nesting media queries avoids rewriting the selector (`section.main` in this\
    \ example) each time you’d like to make adjustments for various breakpoints.\n\
    \nIt’s also immensely convenient that the media-query declarations slot right\
    \ under the original selector. I’ve found it much easier to understand what’s\
    \ happening to an element under varying viewports by having the media queries\
    \ nearby in context, rather than gathered at the end of the stylesheet or in a\
    \ separate document.\n\n### Using variables to define breakpoints\n\nMedia-query\
    \ bubbling is a wonderful convenience that Sass brings to responsive design, but\
    \ there is still quite a bit of repetition. In each declaration, we’re specifying\
    \ the breakpoints (`800px` and `500px` in the previous example). Often while designing,\
    \ I tweak those breakpoints based on the particular design I’m working on and\
    \ observations on how the layout reacts, instead of relying on static device widths.\
    \ In other words, those breakpoints that you’re specifying in each nested media\
    \ query could change. It’d be great to define those once and be able to edit them\
    \ in one spot. Sass variables to the rescue!\n\nLet’s create some variables for\
    \ three breakpoints we’ll use in our media queries. I’m going to name them something\
    \ flexible and not tied down to a specific device or finite value.\n\n```\n$width-small:\
    \  500px;\n$width-medium: 800px;\n$width-large:  1200px;\n```\n\nWith the breakpoints\
    \ defined as Sass variables, we can (as of Sass 3.2) refer to these whenever we\
    \ use nested media queries throughout the document. For example:\n\n```\nsection.main\
    \ {\n  font-size: 16px;\n  line-height: 1.4;\n\n  @media screen and (max-width:\
    \ $width-large) {\n    float: left;\n    width: 65%;\n  }\n\n  @media screen and\
    \ (max-width: $width-medium) {\n    float: none;\n    width: auto;\n  }\n\n  @media\
    \ screen and (max-width: $width-small) {\n    font-size: 12px;\n    line-height:\
    \ 1.4;\n  }\n}\n```\n\nWhich will compile to:\n\n```\nsection.main {\n  font-size:\
    \ 16px;\n  line-height: 1.4;\n\n  @media screen and (max-width: 1200px) {\n  \
    \  float: left;\n    width: 65%;\n  }\n\n  @media screen and (max-width: 800px)\
    \ {\n    float: none;\n    width: auto;\n  }\n\n  @media screen and (max-width:\
    \ 500px) {\n    font-size: 12px;\n    line-height: 1.4;\n  }\n}\n```\n\nIf we\
    \ later decide to tweak those breakpoints, we need only edit the variables once,\
    \ and Sass will take care of updating them wherever we used them.\n\n```\n$width-small:\
    \  400px;\n$width-medium: 760px;\n$width-large:  1100px;\n```\n\nThis helps tremendously\
    \ during the initial development of a responsive design, when those breakpoints\
    \ are a moving target depending on the design requirements and the way the design\
    \ needs to adapt.\n\nEven math is possible here, as we can add to or subtract\
    \ from the breakpoint’s value:\n\n```\n@media screen and (max-width: $width-small\
    \ + 1) {\n  font-size: 12px;\n  line-height: 1.4;\n}\n```\n\nWill compile to:\n\
    \n```\n@media screen and (max-width: 401px) {\n  font-size: 12px;\n  line-height:\
    \ 1.4;\n}\n```\n\nWhile:\n\n```\n@media screen and (max-width: $width-small -\
    \ 1) {\n  font-size: 12px;\n  line-height: 1.4;\n}\n```\n\nWill compile to:\n\n\
    ```\n@media screen and (max-width: 399px) {\n  font-size: 12px;\n  line-height:\
    \ 1.4;\n}\n```\n\nGoing a step further, you can also define an entire media query\
    \ as a variable (not just the numeric value):\n\n```\n$mobile-first: \"screen\
    \ and (min-width: 300px)\";\n\n@media #{$mobile-first} {\n  #content {\n    font-size:\
    \ 14px;\n    line-height: 1.5;\n  }\n}\n```\n\nNotice the interpolation brackets—`#{}`—surrounding\
    \ the `$mobile-first` variable. That’s a special way to alert Sass to compile\
    \ something within a selector or property name.\n\nThe above SCSS will compile\
    \ to:\n\n```\n@media screen and (min-width: 300px) {\n  #content {\n    font-size:\
    \ 14px;\n    line-height: 1.5;\n  }\n}\n```\n\nWhen you nest media queries within\
    \ the declarations they affect, variables save you a ton of repetition. But we\
    \ can even simplify things further with `@content` blocks, also introduced in\
    \ Sass 3.2.\n\n### Combining @content blocks and mixins\n\nBy using Sass’s `@content`\
    \ directive, you can pass entire blocks of styles to a mixin, and Sass will place\
    \ those blocks back into the declaration that calls the mixin. That sounds confusing,\
    \ but in practice it’s simple and handy.\n\nLet’s create a responsive mixin that\
    \ handles three different breakpoints, with `@content` placeholders for whatever\
    \ styles we’d like to include for each breakpoint. We’ll also use variables to\
    \ define the small, medium, and large breakpoint widths as we did earlier in the\
    \ chapter.\n\n```\n $width-small:  400px;\n$width-medium: 760px;\n$width-large:\
    \  1200px;\n\n@mixin responsive($width) {\n  @if $width == wide-screens {\n  \
    \  @media only screen and (max-width: $width-large) { @content; }\n  }\n  @else\
    \ if $width == medium-screens {\n    @media only screen and (max-width: $width-medium)\
    \ { @content; }\n  }\n  @else if $width == small-screens {\n    @media only screen\
    \ and (max-width: $width-small) { @content; }\n  }\n}\n```\n\nNotice Sass also\
    \ supports `@if` and `@else` statements, which we’re using to evaluate the `$width`\
    \ variable we’ll pass when including the mixin. For example, if we pass the mixin\
    \ the `medium-screens` variable, Sass will compile the media query with our `max-width`\
    \ set to the `$width-medium` variable (`760px`). The `@content` placeholder allows\
    \ us to further pass blocks of styles to the mixin that get inserted inside the\
    \ media query.\n\nWith this single mixin set up, we can now call it from any declaration\
    \ using a compact pattern that reflects the way we think about things:\n\n```\n\
    #content {\n  float: left;\n  width: 70%;\n  @include responsive(wide-screens)\
    \ {\n    width: 80%;\n  }\n  @include responsive(medium-screens) {\n    width:\
    \ 50%;\n    font-size: 14px;\n  }\n  @include responsive(small-screens) {\n  \
    \  float: none;\n    width: 100%;\n    font-size: 12px;\n  }\n}\n```\n\nWhich\
    \ will compile to:\n\n```\n#content {\n  float: left;\n  width: 70%;\n}\n@media\
    \ only screen and (max-width: 1200px) {\n  #content {\n    width: 80%;\n  }\n\
    }\n@media only screen and (max-width: 760px) {\n  #content {\n    width: 50%;\n\
    \    font-size: 14px;\n  }\n}\n@media only screen and (max-width: 400px) {\n \
    \ #content {\n    float: none;\n    width: 100%;\n    font-size: 12px;\n  }\n\
    }\n```\n\nMagical! Sass feeds any styles to the appropriate media query and reconstructs\
    \ the declaration with everything in its right place. Using `@content` blocks\
    \ for writing contextually-placed media queries makes responsive design a heck\
    \ of a lot simpler—with less repetition.\n\nIt’s also easier to grasp how an element\
    \ will be adjusted across device widths—such as how a heading’s font size will\
    \ vary as the width of the viewport narrows. The entire progression is spelled\
    \ out in one spot:\n\n```\nh1 {\n  font-size: 40px;\n  @include responsive(wide-screens)\
    \ { font-size: 48px; }\n  @include responsive(medium-screens) { font-size: 32px;\
    \ }\n  @include responsive(small-screens){ font-size: 20px; }\n}\n```\n\nWhich\
    \ will compile to:\n\n```\nh1 {\n  font-size: 40px;\n}\n@media only screen and\
    \ (max-width: 1200px) {\n  h1 {\n    font-size: 48px;\n  }\n}\n@media only screen\
    \ and (max-width: 760px) {\n  h1 {\n    font-size: 32px;\n  }\n}\n@media only\
    \ screen and (max-width: 400px) {\n  h1 {\n    font-size: 20px;\n  }\n}\n```\n\
    \n### Keep the output in mind\n\nIt’s important to point out that this method\
    \ results in a lot of repeated media queries for each selector in the compiled\
    \ CSS. Ideally, Sass would let us nest the queries to keep the contextual connection\
    \ of rules collected in one space, but then group shared media query rules when\
    \ compiled.\n\nFor example:\n\n```\nblockquote {\n  width: 100%;\n  @include responsive(wide-screens)\
    \ { width: 80%; }\n}\nfigure {\n  margin: 0 0 20px 0;\n  @include responsive(wide-screens)\
    \ { margin: 0 0 30px 0; }\n}\n```\n\nWould compile more efficiently, with shared\
    \ rules wrapped into one media query:\n\n```\nblockquote {\n  width: 100%;\n}\n\
    figure {\n  margin: 0 0 20px 0;\n}\n\n@media only screen and (max-width: 1200px)\
    \ {\n  blockquote {\n    width: 80%;\n  }\n  figure {\n    margin: 0 0 30px 0;\n\
    \  }\n}\n```"
