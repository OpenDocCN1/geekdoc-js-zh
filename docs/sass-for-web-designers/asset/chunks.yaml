- fmt: "\nIf we peer into the world of software engineering (and I much prefer to\
    \ peer than hang out and get comfortable there), we can quickly see how organization,\
    \ variables, constants, partials, etc., are an ingrained, crucial way of working\
    \ for folks building complex systems.\n\nYou may have heard of the “don’t repeat\
    \ yourself” (DRY) principle. Coined and defined by Andy Hunt and Dave Thomas in\
    \ their book, *The Pragmatic Programmer* ([http://bkaprt.com/sass/1/](http://bkaprt.com/sass/1/)),\
    \ DRY declares:\n\n> Every piece of knowledge must have a single, unambiguous,\
    \ authoritative representation within a system.\n\nThe idea is that duplicating\
    \ code can cause failure and confusion for developers ([http://bkaprt.com/sass/2/](http://bkaprt.com/sass/2/)).\
    \ It’s common sense as well: write commonly-repeated patterns once, and reuse\
    \ those bits throughout the application. It’s more efficient and far easier to\
    \ maintain code this way.\n\nCSS is anything but DRY. At times, it drips with\
    \ repeated rules, declarations, and values. We’re constantly writing the same\
    \ snippets of code for colors, fonts, and frequently-used patterns of style throughout\
    \ our stylesheets. One look through a decent-sized CSS file, and a DRY software\
    \ developer will weep, first with bewilderment, then frustration.\n\n“How the\
    \ !@#$ do you maintain this?!” they’ll ask.\n\n“Have I also told you about IE\
    \ bugs?” you’ll reply with a bit of self-loathing.\n\n### So why is CSS so difficult\
    \ to work with?\n\nWe can gather a hint of understanding why CSS has had its syntax\
    \ limitations over the years from an essay by CSS co-inventor, Bert Bos ([http://bkaprt.com/sass/3/](http://bkaprt.com/sass/3/)):\n\
    \n> CSS stops short of even more powerful features that programmers use in their\
    \ programming languages: macros, variables, symbolic constants, conditionals,\
    \ expressions over variables, etc. That is because these things give power-users\
    \ a lot of rope, but less experienced users will unwittingly hang themselves;\
    \ or, more likely, be so scared that they won’t even touch CSS. It’s a balance.\
    \ And for CSS the balance is different than for some other things.\n\nThe original\
    \ architects of CSS were concerned with adoption. They (rightfully) wanted as\
    \ many people as possible creating websites. They wanted CSS to be powerful enough\
    \ to style web pages and separate content from presentation, while being easy\
    \ to understand and use. I can certainly respect that. At the same time, we have\
    \ work to do, and that work is getting more complicated, more nuanced, and challenging\
    \ to maintain and to future-proof.\n\nFortunately, there are options to help us\
    \ out here, and one of them is Sass.\n\n## WHAT IS SASS?\n\nSass is a CSS preprocessor—a\
    \ layer between the stylesheets you author and the `.css` files you serve to the\
    \ browser. Sass (short for Syntactically Awesome Stylesheets) plugs the holes\
    \ in CSS as a language, allowing you to write DRY code that’ll be faster, more\
    \ efficient, and easier to maintain (**Fig 1**).\n\n![](image/1-1.gif)\n\nFIG\
    \ 1: Sass converts its own “power syntax” to plain old CSS.\n\nThe Sass website\
    \ ([http://bkaprt.com/sass/4/](http://bkaprt.com/sass/4/)) describes itself succinctly:\n\
    \n> Sass is a meta-language on top of CSS that’s used to describe the style of\
    \ a document cleanly and structurally, with more power than flat CSS allows. Sass\
    \ both provides a simpler, more elegant syntax for CSS and implements various\
    \ features that are useful for creating manageable stylesheets.\n\nSo while normal\
    \ CSS doesn’t yet allow things like variables, mixins (reusable blocks of styles),\
    \ and other goodies, Sass provides a syntax that does all of that and more—enabling\
    \ “super functionality” in addition to your normal CSS. It then translates (or\
    \ compiles) that syntax into regular ol’ CSS files via a command-line program\
    \ or web-framework plugin.\n\nMore specifically, Sass is an extension of CSS3,\
    \ and its SCSS (“Sassy CSS”) syntax—which we’ll talk about in just a moment—is\
    \ a superset of CSS3. Meaning, any valid CSS3 document is a valid SCSS document\
    \ as well. This is integral to Sass being something you can “ease into.” Getting\
    \ starting with Sass syntax is painless, and you can use as little or as much\
    \ as you’d like. Which also means converting an existing stylesheet from CSS to\
    \ SCSS can be done in stages, as you learn and pick up more of Sass’s functionality.\n\
    \nLater, when you’ve become fluent with Sass (and it won’t take long), it really\
    \ does feel like a natural extension of CSS—as if it’s filling holes we all wish\
    \ were filled by the CSS spec itself. This is why, once I started using Sass,\
    \ I never once thought it was awkward or laborious—it just feels like CSS should\
    \ feel. Once you try it, you’ll likely stick with it permanently.\n\nFurthermore,\
    \ Sass is helping CSS get better. By fast-tracking certain features that aren’t\
    \ currently possible without the help of a preprocessor, it’s giving CSS authors\
    \ real-world implementation and feature experimentation. When and if it makes\
    \ sense, certain Sass functionality could very well inform future CSS specifications.\n\
    \n## SASS SYNTAX\n\nThere are actually two different syntaxes in Sass. The latest\
    \ is the aforementioned SCSS syntax. SCSS files use an `.scss` file extension.\
    \ This is the syntax I prefer using and advocate for these reasons:\n\n*   Since\
    \ SCSS is a superset of CSS3, I can write CSS as I have for the last ten years\
    \ and it’ll still work just fine.\n*   It’s easy to convert existing stylesheets\
    \ to use Sass.\n*   It doesn’t require a shift in code formatting.\n\n### A simple\
    \ SCSS example\n\nHere’s an example of how SCSS works. It defines a variable and\
    \ uses it in a declaration.\n\n```scss\n$pink: #ea489;\n\np {\n  font-size: 12px;\n\
    \  color: $pink;\n}\np strong {\n  text-transform: uppercase;\n}\n```\n\nWhich\
    \ will compile to:\n\n```css\np {\n  font-size: 12px;\n  color: #ea489;\n}\np\
    \ strong {\n  text-transform: uppercase;\n}\n```\n\nThat should look very familiar,\
    \ aside from the `$pink` variable, and we’ll go into variables later. SCSS works\
    \ around the CSS you already know. And for that, I very much like it.\n\n####\
    \ The original “indented” Sass syntax\n\nThe original Sass syntax, on the other\
    \ hand, is a different animal. Some folks prefer its stripped-down, no-curly-braces-or-semicolons,\
    \ indented syntax. If you’re used to the terseness of programming languages like\
    \ Ruby or Python, the Sass syntax will look familiar, and you might feel more\
    \ home.\n\nHere’s the simple example in the original Sass syntax, which will compile\
    \ exactly the same as the previous snippet.\n\n```sass\n$pink: #ea489\n\np\n \
    \ font-size: 12px\n  color: $pink\n\np strong\n  text-transform: uppercase\n```\n\
    \n## SASS MISCEPTIONS\n\nI mentioned earlier that I was reluctant to try Sass.\
    \ This was partly due to a lot of misconceptions I had prior to using it. Do I\
    \ need to know Ruby or advanced command-line shenanigans? Will I need to completely\
    \ change the way I’ve been writing stylesheets? Will the CSS it outputs be bloated\
    \ and unreadable?\n\nThankfully, the answer is “nope” for each of those questions,\
    \ of course—but I do hear them pop up whenever someone mentions Sass on various\
    \ internet channels.\n\n### I’m afraid of the command line!\n"
