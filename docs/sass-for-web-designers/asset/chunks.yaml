  trans: "\nmixin 的最后一部分是 `background-size` 属性（以及带有 `-webkit-` 和 `-moz-` 前缀的等效属性），它告诉浏览器将较大的图片放入多大的尺寸中：\n\
    \n```scss\n@mixin retinize($file, $type, $width, $height) {\n  background-image:\
    \ url('../img/' + $file + '.' + $type);\n\n  @media (-webkit-min-device-pixel-ratio:\
    \ 1.5),\n         (min--moz-device-pixel-ratio: 1.5),\n         (-o-min-device-pixel-ratio:\
    \ 3/2),\n         (min-device-pixel-ratio: 1.5),\n         (min-resolution: 1.5dppx)\
    \ {\n    & {\n      background-image: url('../img/' + $file + '-2x.' + $type);\n\
    \      -webkit-background-size: $width $height;\n         -moz-background-size:\
    \ $width $height;\n              background-size: $width $height;\n    }\n  }\n\
    }\n```\n\n就是这样——这是一个可重用的 mixin，可以从你喜欢的任何选择器提供 HiDPI 背景图片，只需创建两个图像资源和一行 SCSS 即可：\n\
    \n```scss\nli.dribbble a {\n  @include retinize('icon-dribbble', 'png', 24px,\
    \ 24px);\n}\n```\n\n### Mixin 嵌套 mixin！\n\nMixins 可以包含其他 mixins。可以说这是一种“mixin\
    \ 嵌套（mixinception）”。别担心，宇宙不会爆炸的！事实上，我们可以进一步实现这段代码的 DRY 化（减少重复），将带有厂商前缀的 `min-device-pixel-ratio`\
    \ 规则提取到变量，并将 `background-size` 属性栈提取到自己的 mixin 中。然后，这些提取部分就可以在样式表的其他部分或其他 mixin\
    \ 中重用。这里的另一个优势是将任何带有厂商前缀的属性保留在一个地方，这样当规范发生变化或不再需要缀时，我们就可以编辑或修剪它们（那将是一个值得庆祝的日子）。\n\
    \n首先，让我们用一个可重用的变量来替换媒体查询中的像素比例部分。正如本章前面提到的，出现在选择器内部的变量需要在它周围使用特殊的插值字符：\n\n```scss\n\
    @mixin retinize($file, $type, $width, $height) {\n  background-image: url('../img/'\
    \ + $file + '.' + $type);\n\n  @media #{$is-hidpi} {\n    & {\n      background-image:\
    \ url('../img/' + $file + '-2x.' + $type);\n      -webkit-background-size: $width\
    \ $height;\n         -moz-background-size: $width $height;\n              background-size:\
    \ $width $height;\n    }\n  }\n}\n```\n\n然后我们用像素比例规则栈定义该变量，如果需要，它也可以样式表的其他地方重用：\n\
    \n```scss\n$is-hidpi: \"(-webkit-min-device-pixel-ratio: 1.5), (min--moz-device-pixel-ratio:\
    \ 1.5), (-o-min-device-pixel-ratio: 3/2), (min-device-pixel-ratio: 1.5),(min-resolution:\
    \ 1.5dppx)\";\n```\n\n接下来，让我们为 `background-size` 创建一个 mixin，它接收 `width` 和 `height`\
    \ 属性，并包含厂商前缀的属性以及“真实的”、无前缀的属性。现在每当我们想在选择器上使用 `background-size` 时，都可以调用这个 mixin：\n\
    \n```scss\n@mixin background-size($width, $height) {\n  -webkit-background-size:\
    \ $width $height;\n     -moz-background-size: $width $height;\n          background-size:\
    \ $width $height;\n}\n```\n\n我们将这个 `background-size` mixin 包含在 `retinize` mixin\
    \ 中，并传递它已经收集的 `$width` 和 `$height` 变量：\n\n```scss\n@mixin retinize($file, $type,\
    \ $width, $height) {\n  background-image: url('../img/' + $file + '.' + $type);\n\
    \n  @media #{$is-hidpi} {\n    & {\n      background-image: url('../img/' + $file\
    \ + '-2x.' + $type);\n      @include background-size($width, $height);\n    }\n\
    \  }\n}\n```\n\n搞定了。我们重构了原始的 `retinize` mixin，使其包含了可以在其他样式或 mixin 中重用的代码。这将减少我们\
    \ Sass 代码中的重复量，并使共享样式尽可能留在尽可能少的地方，以便未来的更新和维护。\n\n## 结语\n\n希望这本小粉书能帮助你上手 Sass 并熟悉它的核心功能。我希望它也消除了对\
    \ Sass 有时会带的一些误解：\n\n*   你必须学习 Ruby。\n*   你需要改变整个 CSS 流程。\n*   你需要成为命令行专家。\n\n\
    正如我们所讨论的，情况要简单得多。但 Sass 可以变得随你心意的强大。至少，它是一个极佳的工具，可以很好地融入你的系统和工作流，而不会干扰你编写了多年的\
    \ CSS（如果你只写了几个月的 CSS，那么好吧……几个月而已了）。\n\n# 资源\n\n### 网站与文章\n\n*   **Sass reference**:\
    \ Sass 的官方文档。\n*   **The Sass Way**: Chris Eppstein 深入讲解了 Sass。\n*   **CSS Tricks**:\
    \ Chris Coyier 同样也涵盖了 Sass。\n*   **Getting started with Sass**: Code School 关于\
    \ Sass 的全面课程。\n*   **Looking into the future of Sass**: David Walsh 评估了 Sass 即将推出的特性。\n\
    \n### Mixin 库\n\n*   **Compass**: 由 Blueprint 创建的功能强大的 Sass 框架。即使你不使用 Compass，它的文档也是一个宝库。\n\
    *   **Bourbon**: 自称为“一个用于 Sass 的简单轻量级 mixin 库”，Bourbon 提供了来自 thoughtbot 的大量 mixin\
    \ 概念。\n*   **Handy Sass Mixins**: Jake Bresnehan 的优秀 Sass mixins 集合。\n\n### 更多\
    \ Sass 与响应式设计\n\n*   **Breakpoint**: 一个 Sass 插件，让媒体查询变得更加简单。\n*   **Susy**: 用于\
    \ Compass 和 Sass 创建响应式网格系统的辅助工具。\n*   **Sassaparilla**: 一个使用 Compass 和 Sass 创建响应式\
    \ Web 设计项目的启动框架。\n\n### 工具\n\n*   **FireSass for Firebug**: 一个实用的 Firefox 扩展，可以显示\
    \ Sass 编译样式表的原始 文件名和行号，方便调试。\n*   **Developing with Sass and Chrome DevTools**:\
    \ 关于如何在开发 Sass 时最好地使用 Chrome 的教程。\n\n### 其他 CSS 预处理器\n\n虽然 Sass 是本书的主题，但它并不是唯一的\
    \ CSS 预处理器。如果你染上了预处理的毒（我真心希望你染上了），那么可能值得看看这些替代方案——注意它们与 Sass 的不同之处。\n\n#### LESS\n\
    \n"
- fmt: '

    LESS is another popular choice for designers and front-end craftspeople. It’s
    very similar to Sass in that it also supports variables, mixins, and other functions,
    but it uses a slightly different syntax. Like Sass’s SCSS, LESS is an extension
    of CSS, which means it plays nicely with existing stylesheets and can be gradually
    folded in ([http://bkaprt.com/sass/32/]).


    LESS also has a client-side option for compiling, which serves `.less` files to
    the browser that JavaScript compiles into regular CSS when the page loads. It’s
    a handy way to work locally and in development, as no command line or app needs
    to run the conversion for you. However, client-side compiling is not recommended
    for production sites.


    Like Sass, LESS has a command-line program as well as third-party apps that convert
    LESS files into CSS files.


    Feature-wise, in comparison to Sass, LESS does a little…well, less. From my perspective,
    Sass has a more active development cycle and community behind it, and is a bit
    more robust in its functionality. That said, what LESS does support is the important
    stuff—features that will help you write DRY stylesheets more efficiently. You’re
    already winning if you’re using a preprocessor, regardless of which one.


    For a great comparison of Sass versus LESS, have a gander at Chris Coyier’s thorough
    article, in which he breaks down the differences and pros and cons ([http://bkaprt.com/sass/33/]).


    These debates can at times become religious warfare, but the key thing is to use
    what you’re most comfortable with. Both will help immensely in easing the creation
    of smart stylesheets.


    ### Stylus


    Stylus is a bit younger than LESS and Sass, and it has a broad feature set. Its
    syntax is more like Sass’s original syntax (optional indenting, optional omission
    of braces and semicolons). I like tools that don’t alter my normal workflow too
    much, so for that reason I haven’t checked out Stylus extensively. But I’m mentioning
    it here because, again, if it feels right for you, then go for it. The important
    thing is to take advantage of one of these tools to make your life a little easier
    ([http://bkaprt.com/sass/34/]).


