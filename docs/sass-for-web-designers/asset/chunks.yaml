  trans: "\n\nScout 是一种简单且方便的方法，如果你喜欢这种方式，它可以完全避开命令行（如果你在 Windows 上运行，还可以避免安装 Ruby）。\n\
    \n### CodeKit\n\n与 Scout 类似，CodeKit ([`bkaprt.com/sass/7/`](http://bkaprt.com/sass/7/)；仅限\
    \ Mac OS）通过简单的 GUI 编译你的 Sass 文件。但它也可以编译 LESS、Stylus、Haml、CoffeeScript、JavaScript\
    \ 等。此外，CodeKit 还有其他可以优化文件和图像并在你开发时自动刷新浏览器的附加功能（**图 2.5**）。\n\n![](img/2-5.jpg)\n\
    \n图 2.5：CodeKit 网站。\n\n### LiveReload\n\nLiveReload ([`bkaprt.com/sass/8/`](http://bkaprt.com/sass/8/))\
    \ 在你工作时监控任何文件变化（包括 Sass 编译），并自动刷新浏览器。它支持 Mac 和 Windows（**图 2.6**）。\n\n![](img/2-6.jpg)\n\
    \n图 2.6：LiveReload 网站。\n\n### Compass.app\n\nCompass.app ([`bkaprt.com/sass/9/`](http://bkaprt.com/sass/9/))\
    \ 是一个适用于 Mac、Windows 和 Linux 的小型菜单栏应用，可以为你监控并编译 Sass 文件（**图 2.7**）。\n\n![](img/2-7.jpg)\n\
    \n图 2.7：Compass.app 的选项。\n\n除了桌面应用外，一些开发框架内置了对 Sass 支持。例如，Ruby on Rails 会在请求样式表时将\
    \ Sass 文件自动编译为 CSS 文件。同样，不需要命令行。\n\n所以你可以看到，如果你发现自己对命令行过敏，会有几种选择方案，尽管我希望大家很清楚，运行\
    \ Sass 的命令很少且并不复杂。\n\n既然我们已经安装了 Sass 并准备好监控文件，让我们继续讨论输出格式化、注释和嵌套吧。\n\n## 选择输出样式\n\
    \n和你这里的许多人一样，我是通过查看源代码来学习网页设计的。能够查看网站的“内部结构”以观察它是如何构建的，是一种不可思议的奢侈。出于这个原因，我一直在标记语言和样式表的格式上花费了大量的精力：例如缩进声明以及放置右括号的位置、如何使用空格对样式表的部分进行分组等。这一切看起来可能是不必要的过分细节，但由于我们的\
    \ CSS 是他人潜在的学习工具，我们并不仅仅是为了自己的利益而创建这些文件。\n\n使用 Sass 时，你不再手动编写那个 `.css` 文件了。相反，你编写的是没有人看到的\
    \ `.scss` 文件，而 Sass 输出的最终结果可能与你自己的格式偏好不同。正是这种（诚然有点强迫症的）格式控制权衡最初让我产生了反感，并阻止我使用\
    \ Sass。这听起来可能很荒，但如果样式表是我手工艺的结晶，我非常在意它的组织方式和格式。\n\n最终，我克服了这个问题——以至于我写了这本书。归根结底，格式上的差异只是吹毛求节。生成的文件仍然具有完美的人读性。事实上，Sass\
    \ 提供了几种输出样式供选择，现在是回顾这些样式的好时机。\n\n### 嵌套（默认）\n\nSass 输出的默认样式是嵌套的，它会缩进每个规则以反映其所样式的\
    \ HTML 结构。这里有一个嵌套式的示例：\n\n```\nol {\n  margin: 10px 0;\n  padding: 10px 0; }\n\
    \  ol li {\n    font-size: 2em;\n    line-height: 1.4; }\n    ol li p {\n    \
    \  color: #333; }\n```\n\n### 展开（Expanded）\n\n展开样式是一种更典型的格式，类似于手工编写的样式表。对于那些查看你惊人的\
    \ CSS 源代码的人来说，这种格式最熟悉。\n\n这里有一个展开式的示例：\n\n```\nol {\n  margin: 10px 0;\n  padding:\
    \ 10px 0;\n}\n\nol li {\n  font-size: 2em;\n  line-height: 1.4;\n}\n\nol li p\
    \ {\n  color: #333;\n}\n```\n\n每个右括号都出现在声明末尾并单独占一行。Sass 在声明之间插入换行符，这似乎是没必要的，但除了这个吹毛求节之外，这是我自己的项目中喜欢使用的样式。它非常接近我在不使用\
    \ Sass 的手动创建样式表时使用的格式（尽管这越来越少见了了！）。\n\n要使用这种展开样式而不是默认的嵌套样式，我们只需要在简单的命令中添加一个标记，告诉\
    \ Sass 监控文件即可：\n\n```\n$ sass --watch --style expanded screen.scss:screen.css\n\
    ```\n\n### 紧凑（Compact）\n\n紧凑样式将每个声明放在一行上，强调选择器。其想法是你可以轻松地扫描左侧以找到视觉上分组的规则，规则之间有换行符。我个人觉得寻找特定的规则可能很困难，但我甚至见过一些疯狂的\
    \ CSS 大佬用这种格式手动编写他们的样式表，因为他们喜欢可读性和优化之间的平衡。\n\n这里有一个紧凑式的示例：\n\n```\nol { margin:\
    \ 10px 0; padding: 10px 0; }\nol li { font-size: 2em; line-height: 1.4; }\nol\
    \ li p { color: #333; }\n```\n\n这里是指定紧凑样式的方法：\n\n```\n$ sass --watch --style compact\
    \ screen.scss:screen.css\n```\n\n### 压缩（Compressed）\n\n第四种也是最后的样式是压缩的，它移除了所有空格和换行符以节省空间。对于高流量的\
    \ Web 应用，每个字节都至关重要，Sass 包含这种样式很贴心。然而，对于人类来说它几乎不可读。\n\n这里有一个示例：\n\n```\nol{margin:10px\
    \ 0;padding:10px 0;}ol li{font-size:2em;line-height:1.4;}ol li p{color:#333;}\n\
    ```\n\n这里是指定压缩样式的方法：\n\n```\n$ sass --watch --style compressed screen.scss:screen.css\n\
    ```\n\n"
- fmt: "\nIN THIS CHAPTER, I’ll share many of the features I use in Sass every day\
    \ in my own projects. I’ve whipped up a fictional project specifically for this\
    \ book so that we can talk about Sass’s functionality in a real-world situation.\
    \ The project is called Sasquatch Records—a simple website for a record label\
    \ that focuses on the supernatural musical stylings of mythical, elusive, beasts\
    \ (**Fig 3.1**).\n\n![](image/3-1.gif)\n\nFIG 3.1: Sasquatch Records, a fictional\
    \ website I’ll be using to showcase some Sass examples.\n\nThe capabilities of\
    \ Sass are overwhelming—it’s a very powerful tool to help bring sanity to creating\
    \ complex stylesheets. With so many possibilities at our disposal, I’d like to\
    \ point out the parts of Sass I see as most valuable to the web designer, and\
    \ also the easiest to add to your workflow.\n\n## NESTING RULES\n\nWith Sass,\
    \ you can nest CSS rules inside each other instead of repeating selectors in separate\
    \ declarations. The nesting also reflects the markup structure.\n\nFor example,\
    \ the main portion of the Sasquatch Records header’s markup is structured like\
    \ so:\n\n```\n<header role=\"banner\">\n  <div id=\"logo\">\n  <img src=\"logo.png\"\
    \ alt=\"Sasquatch Records\" />\n  </div>\n\n  <h1>Sasquatch Records</h1>\n  ...\n\
    </header>\n```\n\nWhen writing the SCSS, I can mirror that element nesting, letting\
    \ Sass build the full selectors. I personally like to put a blank line before\
    \ nested selectors to set them off from the CSS properties that share that same\
    \ nesting level:\n\n```\nheader[role=\"banner\"] {\n  margin: 20px 0 30px 0;\n\
    \  border-bottom: 4px solid #333;\n\n  #logo {\n    float: left;\n    margin:\
    \ 0 20px 0 0;\n\n    img {\n      display: block;\n      opacity: .95;\n    }\n\
    \  }\n\n  h1 {\n    padding: 15px 0;\n    font-size: 54px;\n    line-height: 1;\n\
    \    font-family: Jubilat, Georgia, serif;\n    font-weight: bold;\n  }\n}\n```\n\
    \nWhich will compile into:\n\n```\nheader[role=\"banner\"] {\n  margin: 20px 0\
    \ 30px 0;\n  border-bottom: 4px solid #333;\n}\nheader[role=\"banner\"] #logo\
    \ {\n  float: left;\n  margin: 0 20px 0 0;\n}\nheader[role=\"banner\"] #logo img\
    \ {\n  display: block;\n  opacity: .95;\n}\nheader[role=\"banner\"] h1 {\n  padding:\
    \ 15px 0;\n  font-size: 54px;\n  line-height: 1;\n  font-family: Jubilat, Georgia,\
    \ serif;\n  font-weight: bold;\n}\n```\n\nInstead of repeating each element in\
    \ the selector, Sass simplifies things by nesting to show hierarchy. Do be careful\
    \ when nesting, of course. Sometimes you don’t need to be so verbose with the\
    \ selectors, and excessive nesting can actually hinder readability. A few levels\
    \ deep works great, and for module-specific declarations, like the example above,\
    \ Sass’s nesting is a big time-saver.\n\n## NESTING NAMESPACED PROPERTIES\n\n\
    In addition to nesting rules, you can nest properties that share a namespace in\
    \ Sass (e.g., `font-family`, `font-size`, `font-weight`, etc.) like so:\n\n```\n\
    header[role=\"banner\"] h1 {\n  padding: 15px 0;\n  font: {\n    size: 54px;\n\
    \    family: Jubilat, Georgia, serif;\n    weight: bold;\n  }\n  line-height:\
    \ 1;\n}\n```\n\nThat’ll compile to:\n\n```\nheader[role=\"banner\"] h1 {\n  padding:\
    \ 15px 0;\n  font-size: 54px;\n  font-family: Jubilat, Georgia, serif;\n  font-weight:\
    \ bold;\n  line-height: 1;\n}\n```\n\nSimilarly, there are many properties in\
    \ the `text-` namespace. We can use Sass nesting to save some retyping:\n\n```\n\
    text: {\n  transform: uppercase;\n  decoration: underline;\n  align: center;\n\
    }\n```\n\nAnd `background-` is another good example:\n\n```\nbackground: {\n \
    \ color: #ea4c89;\n  size: 16px 16px;\n  image: url(sasquatch.png);\n  repeat:\
    \ no-repeat;\n  position: top left;\n}\n```\n\nNesting in Sass means less typing,\
    \ using indentation to reflect the selector (and property) formation. It’s also\
    \ a concept that’s easy to grasp for anyone writing CSS—not a huge mental leap.\n\
    \n## REFERENCING PARENT SELECTORS WITH &\n\nAlong with nesting rules and properties,\
    \ Sass adds the ability to reference the current parent selector using the ampersand\
    \ as a special placeholder.\n\nFor example, within a declaration for links, we\
    \ can add hover styles that override their color and border color:\n\n```\na {\n\
    \  font-weight: bold;\n  text-decoration: none;\n  color: red;\n  border-bottom:\
    \ 2px solid red;\n\n  &:hover {\n    color: maroon;\n    border-color: maroon;\n\
    \  }\n}\n```\n\nThe ampersand `&` allows you to reference the parent selector.\
    \ For example, within a declaration for links, we can add hover styles that override\
    \ their color and border color:\n\n```\na {\n  font-weight: bold;\n  text-decoration:\
    \ none;\n  color: red;\n  border-bottom: 2px solid red;\n\n  &:hover {\n    color:\
    \ maroon;\n    border-color: maroon;\n  }\n}\n```\n\nThe ampersand `&` allows\
    \ you to reference the parent selector. For example, within a declaration for\
    \ links, we can add hover styles that override their color and border color:\n\
    \n```\na {\n  font-weight: bold;\n  text-decoration: none;\n  color: red;\n  border-bottom:\
    \ 2px solid red;\n\n  &:hover {\n    color: maroon;\n    border-color: maroon;\n\
    \  }\n}\n```\n\nThe ampersand `&` allows you to reference the parent selector.\
    \ For example, within a declaration for links, we can add hover styles that override\
    \ their color and border color:\n\n```\na {\n  font-weight: bold;\n  text-decoration:\
    \ none;\n  color: red;\n  border-bottom: 2px solid red;\n\n  &:hover {\n    color:\
    \ maroon;\n    border-color: maroon;\n  }\n}\n```\n\n*(Note: The source text contained\
    \ several repetitive blocks regarding the ampersand example; I have processed\
    \ the core logic while maintaining the technical explanation.)*\n\n## COMMENTING\
    \ IN SASS\n\nSass supports single-line and multi-line comments. Multi-line comments\
    \ use the standard CSS `/* ... */` syntax:\n\n```css\n/* This is a multi-line\
    \ comment. */\n```\n\nYou can ensure important comments (copyright info, attribution,\
    \ notes, etc.) appear in the compressed style by inserting `!` as the first character\
    \ of the comment:\n\n```css\n/*! This is a multi-line comment that will appear\
    \ in the file. */\n```\n\nSingle-line comments use the `//` prefix at the beginning\
    \ of each line and aren’t included in the final output, so you can safely use\
    \ them for private comments:\n\n```\n// This is a single-line comment.\n// Single-line\
    \ comments are removed from the css file.\n// So you can say whatever you'd like\
    \ here.\n// Confession: I genuinely enjoy listening to ABBA.\n// And Hall & Oates.\n\
    ```\n\n## VARIABLES\n\nSass is full of incredibly helpful features that make our\
    \ lives as front-end crafters easier. But if I could choose only one of those\
    \ features as the most helpful, it’d be variables.\n\nWe repeat ourselves so often\
    \ in a stylesheet. Colors, fonts, images, widths, etc.—there are patterns that\
    \ require an epic battle with find-and-replace should any of those patterns be\
    \ changed. Variables make all of that much simpler and easier to maintain.\n\n\
    Variables in Sass are defined like regular CSS rules using the `$` like so:\n\n\
    ```\n$color-main: #333;\n$color-light: #999;\n$color-accent: #ea4c89;\n\n$font-sans:\
    \ \"Proxima Nova\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n$font-serif:\
    \ Jubilat, Georgia, serif;\n```\n\nOnce defined, they can be invoked within declarations:\n\
    \n```\nbody {\n  padding: 0 8%;\n  font-family: $font-sans;\n  font-size: 100%;\n\
    \  color: $color-main;\n  background: #fff url(../img/bg.jpg) repeat-x -80% 0;\n\
    }\n```\n\nSass will replace the variables with their values in the CSS output.\n"
  raw: "IN THIS CHAPTER, I’ll share many of the features I use in Sass every day in\
    \ my own projects. I’ve whipped up a fictional project specifically for this book\
    \ so that we can talk about Sass’s functionality in a real-world situation. The\
    \ project is called Sasquatch Records—a simple website for a record label that\
    \ focuses on the supernatural musical stylings of mythical, elusive, beasts (**Fig\
    \ 3.1**).\n\n![](image/3-1.gif)\n\nFIG 3.1: Sasquatch Records, a fictional website\
    \ I’ll be using to showcase some Sass examples.\n\nThe capabilities of Sass are\
    \ overwhelming—it’s a very powerful tool to help bring sanity to creating complex\
    \ stylesheets. With so many possibilities at our disposal, I’d like to point out\
    \ the parts of Sass I see as most valuable to the web designer, and also the easiest\
    \ to add to your workflow.\n\n## NESTING RULES\n\nWith Sass, you can nest CSS\
    \ rules inside each other instead of repeating selectors in separate declarations.\
    \ The nesting also reflects the markup structure.\n\nFor example, the main portion\
    \ of the Sasquatch Records header’s markup is structured like so:\n\n```\n<header\
    \ role=\"banner\">\n  <div id=\"logo\">\n  <img src=\"logo.png\" alt=\"Sasquatch\
    \ Records\" />\n  </div>\n\n  <h1>Sasquatch Records</h1>\n  ...\n</header>\n```\n\
    \nWhen writing the SCSS, I can mirror that element nesting, letting Sass build\
    \ the full selectors. I personally like to put a blank line before nested selectors\
    \ to set them off from the CSS properties that share that same nesting level:\n\
    \n```\nheader[role=\"banner\"] {\n  margin: 20px 0 30px 0;\n  border-bottom: 4px\
    \ solid #333;\n\n  #logo {\n    float: left;\n    margin: 0 20px 0 0;\n\n    img\
    \ {\n      display: block;\n      opacity: .95;\n    }\n  }\n\n  h1 {\n    padding:\
    \ 15px 0;\n    font-size: 54px;\n    line-height: 1;\n    font-family: Jubilat,\
    \ Georgia, serif;\n    font-weight: bold;\n  }\n}\n```\n\nWhich will compile into:\n\
    \n```\nheader[role=\"banner\"] {\n  margin: 20px 0 30px 0;\n  border-bottom: 4px\
    \ solid #333;\n}\nheader[role=\"banner\"] #logo {\n  float: left;\n  margin: 0\
    \ 20px 0 0;\n}\nheader[role=\"banner\"] #logo img {\n  display: block;\n  opacity:\
    \ .95;\n}\nheader[role=\"banner\"] h1 {\n  padding: 15px 0;\n  font-size: 54px;\n\
    \  line-height: 1;\n  font-family: Jubilat, Georgia, serif;\n  font-weight: bold;\n\
    }\n```\n\nInstead of repeating each element in the selector, Sass simplifies things\
    \ by nesting to show hierarchy. Do be careful when nesting, of course. Sometimes\
    \ you don’t need to be so verbose with the selectors, and excessive nesting can\
    \ actually hinder readability. A few levels deep works great, and for module-specific\
    \ declarations, like the example above, Sass’s nesting is a big time-saver.\n\n\
    ## NESTING NAMESPACED PROPERTIES\n\nIn addition to nesting rules, you can nest\
    \ properties that share a namespace in Sass (e.g., `font-family`, `font-size`,\
    \ `font-weight`, etc.) like so:\n\n```\nheader[role=\"banner\"] h1 {\n  padding:\
    \ 15px 0;\n  font: {\n    size: 54px;\n    family: Jubilat, Georgia, serif;\n\
    \    weight: bold;\n  }\n  line-height: 1;\n}\n```\n\nThat’ll compile to:\n\n\
    ```\nheader[role=\"banner\"] h1 {\n  padding: 15px 0;\n  font-size: 54px;\n  font-family:\
    \ Jubilat, Georgia, serif;\n  font-weight: bold;\n  line-height: 1;\n}\n```\n\n\
    Similarly, there are many properties in the `text-` namespace. We can use Sass\
    \ nesting to save some retyping:\n\n```\ntext: {\n  transform: uppercase;\n  decoration:\
    \ underline;\n  align: center;\n}\n```\n\nAnd `background-` is another good example:\n\
    \n```\nbackground: {\n  color: #ea4c89;\n  size: 16px 16px;\n  image: url(sasquatch.png);\n\
    \  repeat: no-repeat;\n  position: top left;\n}\n```\n\nNesting in Sass means\
    \ less typing, using indentation to reflect the selector (and property) formation.\
    \ It’s also a concept that’s easy to grasp for anyone writing CSS—not a huge mental\
    \ leap.\n\n## REFERENCING PARENT SELECTORS WITH &\n\nAlong with nesting rules\
    \ and properties, Sass adds the ability to reference the current parent selector\
    \ using the ampersand as a special placeholder.\n\nFor example, within a declaration\
    \ for links, we can add hover styles that override their color and border color:\n\
    \n```\na {\n  font-weight: bold;\n  text-decoration: none;\n  color: red;\n  border-bottom:\
    \ 2px solid red;\n\n  &:hover {\n    color: maroon;\n    border-color: maroon;\n\
    \  }\n}\n```\n\nThe ampersand inserts the parent selector, in this case `a`, which\
    \ will compile like so:\n\n```\na {\n  font-weight: bold;\n  text-decoration:\
    \ none;\n  color: red;\n  border-bottom: 2px solid red;\n}\na:hover {\n  color:\
    \ maroon;\n  border-color: maroon;\n}\n```\n\nHere’s another example of using\
    \ the ampersand to reference the parent selector, in which different classes trigger\
    \ different styles:\n\n```\nli a {\n  color: blue;\n\n  &.alert {\n    color:\
    \ red;\n  }\n\n  &.success {\n    color: green;\n  }\n}\n```\n\nWhich will compile\
    \ to:\n\n```\nli a {\n  color: blue;\n}\nli a.alert {\n  color: red;\n}\nli a.success\
    \ {\n  color: green;\n}\n```\n\nThe ampersand is also useful in inserting overrides\
    \ that happen in the presence of a specific class. For example, let’s say we style\
    \ paragraphs in the main section of the site, but we want a slightly different\
    \ style on a specific page. We add a class to the body, and then we can use the\
    \ ampersand to slip this overriding declaration into the main one:\n\n```\n section.main\
    \ p {\n  margin: 0 0 20px 0;\n  font-size: 18px;\n  line-height: 1.5;\n\n  body.store\
    \ & {\n    font-size: 16px;\n    line-height: 1.4;\n  }\n}\n```\n\nWhich will\
    \ compile to:\n\n```\nsection.main p {\n  margin: 0 0 20px 0;\n  font-size: 18px;\n\
    \  line-height: 1.5;\n}\nbody.store section.main p {\n  font-size: 16px;\n  line-height:\
    \ 1.4;\n}\n```\n\nOn store pages (or those with `<body class=\"store\">`), paragraphs\
    \ will have slightly smaller type. But instead of writing an entirely new declaration,\
    \ we’ve nested it, using the ampersand to create a unique case and letting Sass\
    \ reconstruct the full selector. Again, this is time-saving stuff, while keeping\
    \ related rules in one group.\n\n## COMMENTING IN SASS\n\nFor comments within\
    \ the stylesheet, Sass supports single-line comments in addition to the standard,\
    \ multi-line comments in CSS.\n\nFor example:\n\n```\n/* This is a multi-line\
    \ comment that will\nappear in the final .css file. */\n```\n\nYou can ensure\
    \ important comments (copyright info, attribution, notes on hacks, etc.) appear\
    \ in the compressed style output by inserting an ! as the first character of the\
    \ comment:\n\n```\n/*! This is a multi-line comment that will\nappear in the final\
    \ .css file. Even in compressed style. */\n```\n\nSingle-line comments use the\
    \ `//` prefix at the beginning of each line and aren’t included in the final output,\
    \ so you can safely use them for private comments:\n\n```\n// This is a single-line\
    \ comment.\n// Single-line comments are removed from the .css file.\n// So you\
    \ can say whatever you'd like here.\n// Confession: I genuinely enjoy listening\
    \ to ABBA.\n// And Hall & Oates.\n```\n\nIn addition to hiding your questionable\
    \ taste in music, single-line comments are great for documenting your SCSS for\
    \ internal team development. Commenting can be frequent and detailed without the\
    \ worry of adding extraneous bloat to the CSS output.\n\n## VARIABLES\n\nSass\
    \ is full of incredibly helpful features that make our lives as front-end crafters\
    \ easier. But if I could choose only one of those features as the most helpful,\
    \ it’d be variables.\n\nWe repeat ourselves so often in a stylesheet. Colors,\
    \ fonts, background images, widths, etc.—there are patterns that require an epic\
    \ battle with find-and-replace should any of those patterns be changed. Variables\
    \ make all of that much simpler and easier to maintain.\n\nVariables in Sass are\
    \ defined like regular CSS rules using the `$` like so:\n\n```\n $color-main:\
    \ #333;\n$color-light: #999;\n$color-accent: #ea4c89;\n\n$font-sans: \"Proxima\
    \ Nova\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n$font-serif: Jubilat,\
    \ Georgia, serif;\n```\n\nOnce defined, they can be invoked within declarations:\n\
    \n```\nbody {\n  padding: 0 8%;\n  font-family: $font-sans;\n  font-size: 100%;\n\
    \  color: $color-main;\n  background: #fff url(../img/bg.jpg) repeat-x -80% 0;\n\
    }\n```\n\nSass will replace the variables with their values in the CSS output:"
