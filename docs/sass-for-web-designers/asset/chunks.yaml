    现在我们已经知道了 Sass 是什么，让我们进行环境配置以便开始使用它。我们的第一个任务是在你选择的计算设备上安装它。我在第 1 章中提到过 Sass 是一个用
    `Ruby` 编写的程序，它将其原生语法翻译成纯 `CSS`。因此，在我们开始使用 Sass 之前，我们需要 Sass。


    ## 在 Mac 上安装 Sass


    如果你使用的是 Mac（如果你运气足够的话，那恭喜你），安装 Sass 再简单不过了。Mac OS X 预装了 `Ruby`，而 Sass 被封装成一个 Ruby
    “gem”，这是程序员对 Ruby 应用程序的一种巧妙术语。


    只需启动 `Terminal.app`（不要慌！），在提示符处输入以下内容并按回车：


    ```

    $ gem install sass

    ```


    这并不那么糟糕，对吧？按下回车后，你会看到以下结果在 Terminal 中流过：


    ```

    Fetching: sass-3.2.10.gem (100%)

    Successfully installed sass-3.2.10

    1 gem installed

    Installing ri documentation for sass-3.2.10...

    Installing RDoc documentation for sass-3.2.10...

    ```


    恭喜！你刚刚安装了 Sass。


    在编写本文时，Sass 的最新官方版本是 `3.2.10`，Terminal 足够友好地将这条信息传给了我们。


    ### 安装最新的预发布版本


    你也可以选择留在最前沿，通过在命令末尾添加 `pre` 标志来安装最新的 alpha 版本。使用最新的 alpha 版本不仅安全，还能让你利用最新的功能。


    要获取最新最强大的版本，请在终端提示符中输入以下并按回车：


    ```

    $ gem install sass --pre

    ```


    你将再次看到结果流过，这次确认了 `3.3.0` alpha 版本已安装。


    ```

    Fetching: sass-3.3.0.alpha.3.gem (100%)

    Successfully installed sass-3.3.0.alpha.3

    1 gem installed

    Installing ri documentation for sass-3.3.0.alpha.3...

    Installing RDoc documentation for sass-3.3.0.alpha.3...

    ```


    你现在生活在边缘，我向你这勇敢的信仰之之跃致敬。


    ## 在 Windows 上安装 Sass


    与 Mac OS X 不同，Windows 没有预装 Ruby。Sass 官方网站推荐 Windows 用户使用 `RubyInstaller` 来让程序运行起来（[`bkaprt.com/sass/5/`](http://bkaprt.com/sass/5/)）。一旦安装了
    Ruby，你就可以遵循本章讨论的其余命令。


    ## 告诉 Sass 要监控哪些文件


    好了。我们已经安装了 Sass，现在该怎么办？我们需要告诉 Sass 要监控（watch）哪些文件。这意味着当我们编辑样式表时，我们希望 Sass 监控该文件，并在每次我们更改时，将带有我们所有巧妙
    Sass 语法的 `.scss` 文件转换为浏览器可用的 `.css` 文件。有几种方法可以实现：


    *   通过命令行使用简单的命令。

    *   一个桌面应用程序（有几个），可以帮助你管理 Sass 文件及其输出。


    让我们先处理命令行。


    ```

    $ sass --watch.scss:.css

    ```


    运行该命令后，Sass 将开始监控。你会看到这条消息：


    ```

    >>> Sass is watching for changes. Press Ctrl-C to stop.

    ```


    文件名不需要匹配。例如，这种写法同样有效：


    ```

    $ sass --watch..scss:.css

    ```


    此外，文件不需要在同一个目录中。事实上，我发现将 `.scss` 文件与 `.css` 文件分离开很有用。


    ### Sass 文件组织


    **图 2.1** 显示了一个典型的设置，包含一个 `stylesheets` 目录（包含 `.css` 文件）和一个 `sass` 目录（包含我正在处理的
    `.scss` 文件）。


    ![Sass 组织](img/2-1.gif)


    你也可以告诉 Sass 监控整个目录，而不是单个样式表。因此，使用上面的文件结构，可以使用以下 `watch` 命令监控项目中的任何 `.scss` 文件：


    ```

    $ sass --watch stylesheets/sass

    ```


    ## 使用应用程序代替命令行


    我们到为止学过的命令都非常简单，我相信你作为一个敏锐的前端手工艺者，不会觉得将这些输入工作加入你的工作流是件困难的。尽管如此，有一些桌面应用程序可以让你更容易地管理
    Sass 文件的输出。无论你对命令线的熟悉程度如何，它们都值得一看。


    ### Scout


    Scout ([`bkaprt.com/sass/6/`](http://bkaprt.com/sass/6/)) 是一个适用于 Mac 和 Windows
    的免费桌面应用，它提供了一个“自包含的 Ruby 环境，让你通过几次点击就能轻松管理所有的 Sass 项目”。换句话说，Scout 为你提供了一个良好的视觉化界面来设置监控的目录和文件，而不是使用命令行（**图
    2.2**–**图 2.3**）。


    ![Scout 网站](img/2-2.gif)

    ![Scout 设置](img/2-3.gif)


    一旦选择了输入和输出文件夹，只需点击项目的播放按钮，Scout 就会监控文件。“Log”部分将显示终端更新（**图 2.4**）。


