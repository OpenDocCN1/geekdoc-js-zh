    \ $to);\n  /* Opera */\n  background-image:-o-linear-gradient($from, $to);\n \
    \ /* WebKit (Safari 4+, Chrome 1+) */\n  background-image:-webkit-gradient(linear,\
    \ left top, left bottom, color-stop(0, $from), color-stop(1, $to));\n  /* WebKit\
    \ (Chrome 11+) */\n  background-image: -webkit-linear-gradient($from, $to);\n\
    \  /* IE10 */\n  background-image: -ms-linear-gradient($from, $to);\n  /* W3C\
    \ */\n  background-image: linear-gradient($from, $to);\n}\n```\n\n注意，我正在使用 `$to`\
    \ 颜色为不支持 CSS 渐变的浏览器指定 `background-color` 的回退方案。\n\n幸运的是，我们只需要写一次这个怪物代码。\n\n现在，当我们想要创建一个简单的线性渐变时，只需使用两个选择的颜色调用\
    \ mixin，Sass 就会完成剩下的工作。对于 Sasquatch 网站，激活标签页样式的声明如下：\n\n```scss\n&.active a {\n\
    \  padding: 3px 8px;\n  color: #fff;\n  @include rounded(4px);\n  @include linear-gradient(#ff70b1,\
    \ #d42a78);\n}\n```\n\n这不仅是可以接受的，而且非常符合逻辑！就像是用英语编写的一样。而且我还可以复用这个模式，例如对于一个蓝色按钮（**图\
    \ 3.5**），将其应用于样式表中的不同选择器上，而不需要重新记住那些复杂的渐变语法垃圾：\n\n```scss\nbutton {\n  padding:\
    \ 5px 10px;\n  color: #fff;\n  @include rounded(6px);\n  @include linear-gradient(#42b3e2,\
    \ #1a6798);\n}\n```\n\n![](img/3-5.gif)\n\n图 3.5：使用 Sass mixin 可以轻松实现渐变按钮。\n\n\
    正如你可能知道的，在这里使用的线性渐变只是一个简单的例子，CSS 渐变能够处理更复杂的情况，例如颜色停止点、径向渐变、多方向等。Sass 也能帮助处理这些情况，将任何共享的模式抽象为可重用的\
    \ mixin。\n\n## 创建 Mixin 库\n\nMixins 是奇妙的，因为它们可以编写一次并在整个样式表中使用。但通常这些 mixins 甚至会在项目之间被重复使用。你可能会发现自己在为常见的\
    \ CSS3 属性编写 mixins，如 `box-shadow`、渐变、CSS 过渡以及如自动清除浮动、`box-sizing`、表单元素等模式。如果能将所有这些都写一次，并复用到任何使用\
    \ Sass 的项目中，难道不是更高效吗？\n\n### @import\n\n引入 `@import` 规则，Sass 扩展了它以允许导入多个 SCSS\
    \ 文件，并在编译时将它们合并成单个 CSS 文件。这出于许多原因而非常方便：\n\n*   单个 CSS 文件意味着更少的 HTTP 连接。提升性能！\n\
