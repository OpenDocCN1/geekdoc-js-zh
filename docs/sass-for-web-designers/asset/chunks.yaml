    \ line if that’s your thing (and to avoid Ruby installation if you’re running\
    \ Windows).\n\n### CodeKit\n\nLike Scout, CodeKit ([http://bkaprt.com/sass/7/](http://bkaprt.com/sass/7/);\
    \ for Mac OS only) compiles your Sass files with a simple GUI. But it also compiles\
    \ LESS, Stylus, Haml, CoffeeScript, JavaScript, and others. Additionally, CodeKit\
    \ has other bells and whistles that optimize files and images and automatically\
    \ reload your browser as you develop (**Fig 2.5**).\n\n![](image/2-5.jpg)\n\n\
    FIG 2.5: The CodeKit website.\n\n### LiveReload\n\nLiveReload ([http://bkaprt.com/sass/8/](http://bkaprt.com/sass/8/))\
    \ monitors any file changes, including Sass compiling, as you work and automatically\
    \ reloads the browser. It’s available for both Mac and Windows (**Fig 2.6**).\n\
    \n![](image/2-6.jpg)\n\nFIG 2.6: The LiveReload website.\n\n### Compass.app\n\n\
    Compass.app ([http://bkaprt.com/sass/9/](http://bkaprt.com/sass/9/)) is a little\
    \ menu bar app for Mac, Windows, and Linux that watches and compiles Sass files\
    \ for you (**Fig 2.7**).\n\n![](image/2-7.jpg)\n\nFIG 2.7: Compass.app’s menubar\
    \ options.\n\nIn addition to desktop apps, some development frameworks have built-in\
    \ support for Sass. Ruby on Rails, for instance, will auto-compile Sass files\
    \ into CSS files when the stylesheets are requested. Again, no command line required.\n\
    \nSo, you can see there are several options should you find yourself allergic\
    \ to the command-line, though I hope it’s clear that the commands for running\
    \ Sass are few and uncomplicated.\n\nNow that we have Sass installed and ready\
    \ to watch files, let’s move on and talk about output formatting, commenting,\
    \ and nesting.\n\n## CHOOSING AN OUTPUT STYLE\n\nLike many of you, I learned web\
    \ design by viewing source. It’s an incredible luxury to be able to look under\
    \ the hood of a website to see how it’s put together. For that reason, I’ve always\
    \ put a fair amount of care into formatting my markup and stylesheets: the way\
    \ I indent declarations where the closing brackets go, how I group sections of\
    \ the stylesheet using whitespace, etc. All of this might seem like unnecessary\
    \ particularity, but since our CSS is a potential learning tool for others, we’re\
    \ not just creating these files for our own benefit.\n\nWith Sass, you’re no longer\
    \ crafting that `.css` file. Instead, you’re authoring the `.scss` file that no\
    \ one sees, and Sass’s output of the final might differ from your own formatting\
    \ preference. It was this (admittedly OCD-ish) formatting control trade-off that\
    \ initially turned me off and prevented me from using Sass. That may sound ridiculous,\
    \ but if the stylesheet was a product of my craftsmanship, I very much cared about\
    \ how it was organized and formatted.\n\nEventually I got over it—so much so,\
    \ that I wrote this book. In the end, the formatting differences were nitpicks.\
    \ The resulting files are still perfectly human-readable. In fact, Sass offers\
    \ several output styles to choose from, and it’s a good time to go over those\
    \ now.\n\n### Nested (the default)\n\nThe default style that Sass spits out is\
    \ nested, which indents each rule to reflect the structure of the HTML it’s styling.\
    \ Here’s an example of the nested style:\n\n```\nol {\n  margin: 10px 0;\n  padding:\
    \ 10px 0; }\n  ol li {\n    font-size: 2em;\n    line-height: 1.4; }\n    ol li\
    \ p {\n      color: #333; }\n```\n\n### Expanded\n\nThe expanded style is a more\
    \ typical format similar to stylesheets that are crafted by hand. For those viewing\
    \ source on your amazing CSS, this format will be most familiar.\n\nHere’s an\
    \ example of the expanded style:\n\n```\nol {\n  margin: 10px 0;\n  padding: 10px\
    \ 0;\n}\n\nol li {\n  font-size: 2em;\n  line-height: 1.4;\n}\n\nol li p {\n \
    \ color: #333;\n}\n```\n\nEach closing bracket appears on its own line at the\
    \ end of the declaration. Sass inserts a line break between declarations, which\
    \ seems unnecessary, but aside from that nitpick, this is the style I like to\
    \ use in my own projects. It closely resembles the format I use when creating\
    \ stylesheets by hand without Sass (which is increasingly rare!).\n\nTo use this\
    \ expanded style instead of the default nested style, we just add a flag to the\
    \ simple command that tells Sass to watch files:\n\n```\n$ sass --watch --style\
    \ expanded screen.scss:screen.css\n```\n\n### Compact\n\nThe compact style puts\
    \ each declaration on one line, emphasizing the selectors. The idea is you can\
    \ easily scan the left side to find visually grouped rules, with line breaks between.\
    \ Personally, I find it difficult to find particular rules, but I’ve even seen\
    \ some crazy CSS-ers hand-code their stylesheets in this format because they like\
    \ the balance between readability and optimization.\n\nHere’s an example of the\
    \ compact style:\n\n```\nol { margin: 10px 0; padding: 10px 0; }\nol li { font-size:\
    \ 2em; line-height: 1.4; }\nol li p { color: #333; }\n```\n\nAnd here’s how you\
    \ specify the compact style when running the sass command:\n\n```\n$ sass --watch\
    \ --style compact screen.scss:screen.css\n```\n\n### Compressed\n\nThe fourth\
    \ and final style is compressed, which removes all spaces and line breaks to reduce\
    \ the stylesheet’s file size. It’s nearly impossible to read, but that’s intentional:\
    \ the compressed style is meant for efficiency, not humans.\n\nHere’s an example:\n\
    \n```\nol{margin:10px 0;padding:10px 0;}ol li{font-size:2em;line-height:1.4;}ol\
    \ li p{color:#333;}\n```\n\nAnd here’s how to specify the compressed style:\n\n\
    ```\n$ sass --watch --style compressed screen.scss:screen.css\n```\n\nBrowsers\
    \ don’t need spaces and line breaks, so why not take them out to save space? I’d\
    \ argue this format isn’t conducive to learning from, but for large stylesheets,\
    \ every byte counts, and it’s nice of Sass to include this option.\n\nThe compressed\
    \ style lends itself particularly well to highly-trafficked web apps, in which\
    \ the performance of every file is crucial. For a personal website this may not\
    \ matter as much, and a more human-readable style might be a nicer option for\
    \ those who are looking to learn from your source code.\n\nIt’s also worth mentioning\
    \ that with the prevalence of inspector tools built into browsers, the formatting\
    \ of the `.css` file matters less today than it did several years ago. Instead\
    \ of viewing source to dissect a stylesheet, you can inspect a website with browser\
    \ tools to gain much stronger insight into how the CSS is constructed, and these\
    \ tools will display the CSS in an easy-to-read format regardless of what the\
    \ `.css` file looks like.\n\nWhichever style you choose to output your CSS, it\
    \ doesn’t much matter for your own workflow. Since you’ll be living in the `.scss`\
    \ file for authoring, you can still do all the personalized formatting you’re\
    \ used to obsessing over. So treat the `.scss` as your perfectly-crafted document,\
    \ and let Sass output the results into a stylesheet browsers (and humans) can\
    \ understand.\n\n## DON’T EDIT YOUR OUTPUT!\n\nAt this point, it’s important to\
    \ note that when you’re using Sass, you’ll no longer be editing any `.css` files.\
    \ The `.scss` files are where you’ll live and breathe. The reason being, any changes\
    \ you make to the `.css` file will eventually get overridden as soon as you update\
    \ the `.scss` and Sass compiles the output. So stick to the `.scss` and blissfully\
    \ ignore its output.\n\n## WE HAVE A WORKFLOW, NOW LET’S WORK\n\nWe’ve talked\
    \ about how to set up Sass. We’ve also talked about how to add Sass to your workflow\
    \ by using either the command line or a third-party app. Finally, we talked about\
    \ choosing an output style for your Sass-ified CSS. We’re now ready to start using\
    \ Sass, taking advantage of all the time-saving features it injects into our daily\
    \ work on increasingly complex web projects. Off we go, to Chapter 3…\n\n![Chapter\
    \ 3: Using Sass](image/ch03.gif)"
