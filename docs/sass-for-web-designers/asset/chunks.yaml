    \ #d42a78);\n  /* IE10 */\n  background-image: -ms-linear-gradient(#ff70b1, #d42a78);\n\
    \  /* W3C */\n  background-image: linear-gradient(#ff70b1, #d42a78);\n}\n```\n\
    \n![](image/3-4.gif)\n\nFIG: 3.4: Shared heading styles on the Sasquatch Records\
    \ site.\n\nNotice each vendor-prefixed property takes the same “from” and “to”\
    \ hex colors to create the gradient going from top to bottom. Using a Sass mixin,\
    \ we can make this much simpler to call by plugging in the gradient’s colors as\
    \ variables passed to the mixin. Who can remember all of these variations each\
    \ time a gradient is needed? Let’s make this easier on ourselves.\n\nFirst, let’s\
    \ build a mixin called `linear-gradient`, taking out the hex colors so that we\
    \ can pass those in as `$from` and `$to` variables throughout the stylesheet using\
    \ whatever hues we’d like."
