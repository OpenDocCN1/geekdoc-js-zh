    LESS 是设计师和前端手工艺人员的另一个流行选择。它与 Sass 非常相似，因为它也支持变量、混合器（mixins）和其他函数，但它使用的语法略有不同。就像
    Sass 的 SCSS 一样，LESS 是 CSS 的扩展，这意味着它可以与现有的样式表良好地配合，并可以逐步引入（[http://bkaprt.com/sass/32/]）。


    LESS 还有一个一个客户端编译选项，它将 `.less` 文件提供给浏览器，浏览器在页面加载时通过 JavaScript 将其编译为普通的 CSS。这在本地工作和开发中是一种非常方便的方法，因为不需要运行命令行或应用程序来为你进行转换。然而，不建议在生产网站中使用客户端编译。


    与 Sass 一样，LESS 也有一个命令行程序以及一些可以将 LESS 文件转换为 CSS 文件的第三方应用。


    在功能方面，与 Sass 相比，LESS 做的稍微……嗯，更少一点。在我看来，Sass 拥有更活跃的开发周期和后端社区，而且功能上更健壮一些。尽管如此，LESS
    支持的都是重要内容——那些能帮助你更高效地编写 DRY（不重复）样式表的功能。无论你使用哪一个预处理器，只要你在用，你就已经赢了。


    想要对 Sass 和 LESS 进行极佳对比，请看看 Chris Coyier 的那篇详尽的文章，他在文中详细分析了差异以及优缺点（[http://bkaprt.com/sass/33/]）。


    这些争论有时会变成宗教战争，但关键在于使用你最熟悉的工具。两者对于减轻创建智能样式表的压力都将有巨大的帮助。


    ### Stylus


    Stylus 比 LESS 和 Sass 稍微年轻一点，它拥有广泛的功能集。它的语法更像 Sass 的原始语法（可选的缩进、可选省略大括号和分号）。我喜欢那些不会过度打乱我正常工作流的工具，因此由于这个原因，我没有深入研究过
    Stylus。但我在这里提到它是因为，再次，如果你觉得它适合你，那就尽管去用吧。重要的是利用这些工具中的一个让你的生活变得轻松一点（[http://bkaprt.com/sass/34/]）。


