    首先，最重要的是，我要感谢我在 Dribbble 的战友 Rich Thornett。在我们开发这个小社区期间，通过不断的推动治愈了我对 Sass 的抵触。这花了一整年的时间。感谢
    Rich！


    我还想感谢 A Book 让我在这里创作。他们是一个非常棒的团队，坦率地说，很难想象还有其他地方。感谢 Mandy Brown、Jason Maria 和
    Jeffrey Zeldman——感谢你们创造了如此美好的作品。


    特别感谢经理 Katel Du。你让一切井井有条。感谢 Erin Kissane，让我听起来比实际上写得好。由你来做那是我的荣幸。感谢 Hampton Catlin
    发明了 Sass，感谢 Nathan Weizenbaum 和 Chris Eppstein 开发了 Sass 并使其成为今天不可或缺的工具。


    感谢 Jina Bolton 担任出色的技术编辑和 Sass 大使。


    最后，感谢你的阅读。


