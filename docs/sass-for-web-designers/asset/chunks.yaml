    \n### 使用变量创建样式指南\n\nJina Bolton 写了一非常棒的文章，探讨了 Sass 变量如何帮助根据品牌调色板创建样式指南（[`bkaprt.com/sass/10/`](http://bkaprt.com/sass/10/)）。\n\
    \n> 为了保持我们的样式指南相关性，它存在于我们描述的内部部分。我们与相关的 Sass 变量一起显示我们的调色板，由于我们在相同的前端使用了正在引用的变量来渲染此调色板。当我们更改这些变量的值时，调色板会自动更新（图\
    \ 3.2）。\n\n![](img/3-2.gif)\n\n图 3.2：Jina 使用 Sass 来创建样式指南。\n\n与其创建一个可能会过时且相关的静态样式指南，使用\
    \ Sass 变量定义品牌调色板意味着帮助样式指南保持更新和可维护。\n\n使用样式指南的变量作为基础，Jina 继续讨论利用 Sass 函数在调色板中创建变体。例如，这是\
    \ Sasquatch Records 网站的小型调色板，使用单行注释标记颜色：\n\n```\n$color-main: #333;       // 黑色\n\
    $color-light: #999;      // 灰色\n$color-accent: #ea4c9;  // 粉色\n```\n\n接下来，使用 Sass\
    \ 中的 `darken` 或 `lighten` 函数可以生成基于调色板的不同色深。让我们将粉色（`#ea4c9`）加深 30%：\n\n```\nsection.secondary\
    \ {\n  background: darken($color-accent, 30%);\n}\n```\n\n![109850.jpg](img/109850.jpg)\n\
    \n编译时，Sass 将通过原始粉色加深 30% 来计算颜色等效值：\n\n```\nsection.secondary {\n  background:\
    \ #8d1040;\n}\n```\n\n我们也可以浅化：\n\n```\nsection.secondary {\n  background: lighten($color-accent,\
    \ 30%);\n}\n```\n\n![109864.jpg](img/109864.jpg)\n\n这将编译为：\n\n```\nsection.secondary\
    \ {\n  background: #fad5e3;\n}\n```\n\n### CSS 变量如何？\n\nSass（以及一般的 CSS 预处理器）的伟大之处之一是，它为可能加入拟标准的功能提供了测试场。也就是说，Sass\
    \ 可以以更快的速度实现 CSS 规范中尚未的功能。如果这些功能足够成功，它们就可以合并到标准中。\n\n变量是其中的很好的例子，可能是 CSS 预处理器中最常用的功能。通过\
    \ Sass 和 LESS 的使用，变量作为官方 CSS 功能的支持得到了增强。目前，W3C 草案“CSS Variables Module 1”正在开发中（[`bkaprt.com/sass/11/`](http://bkaprt.com/sass/11/)），并且最新的\
    \ WebKit 测试版本已经实现了对变量的支持。这意味着原生支持 CSS 变量已经在。\n\n遗憾的是，在编写期间，CSS 变量语法与 Sass 不同，并不优雅或易理解。例如，这是为文档根元素定义\
    \ CSS 变量的方法：\n\n```\n:root {\n  --color-main: #333;\n}\n```\n\n以及在声明中使用变量的方法：\n\
    \n```\n#main p {\n  color: var(--color-main);\n}\n```\n\n该提案使用 `--` 前缀定义变量，但使用\
    \ `var(variable-name)` 语法表示值。这有点笨拙且混乱，但仍在进行中，许多人要求在两种情况下使用类似 Sass 的 `$foo` 语法。希望最终能这样解决。\n\
    \n最重要的是，由于浏览器支持限于预览版的 WebKit，CSS 变量在生产环境中是不可用的——这是坚持使用 Sass 的另一个理由。\n\n## MIXINS（混合）\n\
    \n让我们来看看我第二个喜欢的 Sass 特性：mixin。变量允许你在整个样式表中定义和复用值，而 mixins 则允许你定义和复用样式块。与其在各种声明中反复输入相同的规则，不如使用\
    \ mixins 只定义一组样式，并在需要这些样式时随时引用它。\n\n为了说明，让我们为我在 Sasquatch Records 网站几处区域使用的标题样式创建一个\
    \ mixin（图 3.3）。虽然这些标题可能出现在页面的不同位置，但它们的 CSS 是相同的，这正是 mixin 的完美场景。\n\n![](img/3-3.gif)\n\
    \n图 3.3：Sasquatch Records 网站上的共享标题样式。\n\n首先，我们将在 `.scss` 顶部使用 `@mixin` 指令在 Sass\
    \ 中定义一个 mixin。我将其命名为 `title-style`，并定义边距和字体的规则：\n\n```\n@mixin title-style {\n\
    \  margin: 0 0 20px 0;\n  font-family: $font-serif;\n  font-size: 20px;\n  font-weight:\
    \ bold;\n  text-transform: uppercase;\n}\n```\n\n一旦定义，我们现在可以使用 `@include` 指令在任何想要插入这些样式的地方引用此\
    \ mixin。\n\n在 Sasquatch 网站上，我们的样式表有一部分定义了页面主部分的规则，我们想样式 `<h2>` 元素：\n\n```\nsection.main\
    \ h2 {\n  @include title-style;\n}\n```\n\n这将编译为：\n\n```\nsection.main h2 {\n\
    \  margin: 0 0 20px 0;\n  font-family: 'Georgia', serif;\n  font-size: 20px;\n\
    \  font-weight: bold;\n  text-transform: uppercase;\n}\n```\n\n但我们只想样式侧边栏的 `<h3>`\
    \ 元素，因此在样式表稍后处调用 mixin，结果是相同的：\n\n```\nsection.secondary h3 {\n  @include title-style;\n\
    }\n```\n\nMixins 可以包含额外的规则：\n\n```css\nsection.secondary h3 {\n  margin: 0 0 20px\
    \ 0;\n  font-family: 'Georgia', serif;\n  font-size: 20px;\n  font-weight: bold;\n\
    \  text-transform: uppercase;\n  color: #999;\n}\n```\n\n共享样式可以抽象为 mixins，你仍然有能力通过额外的规则来覆盖或增强这些样式。强大的功能！\n\
    \n### Mixin 参数\n\nSass mixins 还可以接收我们在调用时传递给 mixin 的参数。例如，为我们的 `title-style` mixin\
    \ 添加一个指定颜色的参数。\n\n在定义 mixin 时在括号内指定变量：\n\n```scss\n@mixin title-style($color)\
    \ {\n  margin: 0 0 20px 0;\n  font-family: $font-serif;\n  font-size: 20px;\n\
    \  font-weight: bold;\n  text-transform: uppercase;\n  color: $color;\n}\n```\n\
    \n调用 mixin 时，我们现在可以向它传递颜色（这里是漂亮的焦橙色），以及其他规则：\n\n```scss\nsection.main h2 {\n \
    \ @include title-style(#c63);\n}\n```\n\n这将编译为：\n\n```css\nsection.main h2 {\n\
    \  margin: 0 0 20px 0;\n  font-family: 'Georgia', serif;\n  font-size: 20px;\n\
    \  font-weight: bold;\n  text-transform: uppercase;\n  color: #c63;\n}\n```\n\n\
    #### 多参数\n\n通过在 mixin 定义中用逗号分隔值，可以传递多个参数：\n\n```scss\n@mixin title-style($color,\
    \ $background) {\n  margin: 0 0 20px 0;\n  font-family: $font-serif;\n  font-size:\
    \ 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color: $color;\n\
    \  background: $background;\n}\n```\n\n这里是 mixin 从两个不同的选择器被调用的，为颜色和背景传递了不同的参数：\n\
    \n"
- fmt: "\n```scss\nsection.main h2 {\n  @include title-style(#c63, #eee);\n}\nsection.secondary\
    \ h3 {\n  @include title-style(#39c, #333);\n}\n```\n\nWhich in this case will\
    \ compile to:\n\n```css\nsection.main h2 {\n  margin: 0 0 20px 0;\n  font-family:\
    \ Jubilat, Georgia, serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform:\
    \ uppercase;\n  color: #c63;\n  background: #eee;\n}\nsection.secondary h3 {\n\
    \  margin: 0 0 20px 0;\n  font-family: Jubilat, Georgia, serif;\n  font-size:\
    \ 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color: #39c;\n\
    \  background: #333;\n}\n```\n\nYou can start to see how flexible mixins can be.\
    \ Through arguments, consistently-shared rules can sit alongside those that differ\
    \ slightly.\n\n### Defining defaults for arguments\n\nWhen you use mixin arguments,\
    \ it’s often convenient to define defaults. That way, you simply call the mixin\
    \ with no arguments, if that’s the norm, but can still pass in overrides.\n\n\
    ```scss\n@mixin title-style($color, $background: #eee) {\n  margin: 0 0 20px 0;\n\
    \  font-family: $font-serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform:\
    \ uppercase;\n  color: $color;\n  background: $background;\n}\n```\n\nEven though\
    \ we’ve defined a light gray default for the mixin’s background, we can pass an\
    \ argument for something different:\n\n```scss\nsection.main h2 {\n  @include\
    \ title-style(#c63);\n}\nsection.secondary h3 {\n  @include title-style(#39c,\
    \ #333);\n}\n```\n\nWhich will again compile to:\n\n```css\nsection.main h2 {\n\
    \  margin: 0 0 20px 0;\n  font-family: Jubilat, Georgia, serif;\n  font-size:\
    \ 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color: #c63;\n\
    \  background: #eee;\n}\nsection.secondary h3 {\n  margin: 0 0 20px 0;\n  font-family:\
    \ Jubilat, Georgia, serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform:\
    \ uppercase;\n  color: #39c;\n  background: #333;\n}\n```\n\nAdditionally, when\
    \ you have multiple, default arguments defined for a mixin, you can override those\
    \ selectively without having to redefine them all.\n\nFor example, let’s say our\
    \ mixin defined values for both `$color` and `$background`:\n\n```scss\n@mixin\
    \ title-style($color: blue, $background: green) {\n  margin: 0 0 20px 0;\n  font-family:\
    \ $font-serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n\
    \  color: $color;\n  background: $background;\n}\n```\n\nAnd if we want the color\
    \ to be the default blue, but we want to override the background to be pink, we\
    \ only need to pass the background:\n\n```scss\nsection.main h2 {\n  @include\
    \ title-style($background: pink);\n}\n```\n\nWhich will compile to:\n\n```css\n\
    section.main h2 {\n  margin: 0 0 20px 0;\n  font-family: Jubilat, Georgia, serif;\n\
    \  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color:\
    \ blue;\n  background: pink;\n}\n```\n\nA nice time-saver, which keeps those arguments\
    \ defined in one place (the mixin).\n\n## CSS3 LOVES MIXINS\n\nThe use of mixins\
    \ with arguments really shines in CSS3, where we often repeat vendor-prefixed\
    \ rules throughout the stylesheet to achieve rounded corners, drop shadows, gradients,\
    \ transitions, etc. While the values might differ for these properties throughout\
    \ the design, so much is shared and repeated, and Sass makes dealing with CSS3\
    \ “stacks” an absolute breeze. Can’t remember the syntax for creating CSS gradients?\
    \ Make it a mixin!\n\n### border-radius\n\nHere’s a mixin for handling CSS3 rounded\
    \ corners in all browsers, with an argument for the radius value:\n\n```scss\n\
    @mixin rounded($radius) {\n  -webkit-border-radius: $radius;\n     -moz-border-radius:\
    \ $radius;\n          border-radius: $radius;\n}\n```\n\nWe can then make anything\
    \ on the page rounded by calling that mixin:\n\n```scss\nol.slats li a img {\n\
    \  float: left;\n  margin: 0 10px 0 0;\n  padding: 4px;\n  border: 1px solid #ddd;\n\
    \  @include rounded(3px);\n}\ndiv.module {\n  padding: 20px;\n  background: #eee;\n\
    \  @include rounded(10px);\n}\n```\n\nWhich will compile to:\n\n```css\nol.slats\
    \ li a img {\n  float: left;\n  margin: 0 10px 0 0;\n  padding: 4px;\n  border:\
    \ 1px solid #ddd;\n  -webkit-border-radius: 3px;\n     -moz-border-radius: 3px;\n\
    \          border-radius: 3px;\n}\ndiv.module {\n  padding: 20px;\n  background:\
    \ #eee;\n  -webkit-border-radius: 10px;\n     -moz-border-radius: 10px;\n    \
    \      border-radius: 10px;\n}\n```\n\n### box-shadow\n\nHere’s another example\
    \ using multiple arguments: a mixin for creating drop shadows in CSS3 that gives\
    \ us the ability to pass in values for the vertical and horizontal positions of\
    \ the shadow, the amount of blur, and the color:\n\n```scss\n@mixin shadow($x,\
    \ $y, $blur, $color) {\n  -webkit-box-shadow: $x $y $blur $color;\n     -moz-box-shadow:\
    \ $x $y $blur $color;\n          box-shadow: $x $y $blur $color;\n}\n```\n\nLet’s\
    \ add this mixin to the previous `div.module` example, making the shadow appear\
    \ from the top, with `1px` of `2px`, at 50% opacity:\n\n```scss\ndiv.module {\n\
    \  padding: 20px;\n  background: #eee;\n  @include shadow(1px, 2px, 3px, rgba(0,0,0,0.5));\n\
    }\n```\n\nWhich will compile to:\n\n```css\ndiv.module {\n  padding: 20px;\n \
    \ background: #eee;\n  -webkit-box-shadow: 1px 2px 3px rgba(0,0,0,0.5);\n    \
    \ -moz-box-shadow: 1px 2px 3px rgba(0,0,0,0.5);\n          box-shadow: 1px 2px\
    \ 3px rgba(0,0,0,0.5);\n}\n```\n\n### CSS3 gradients\n\nCSS3 gradient syntax is\
    \ ugly. It differs depending on the browser, it’s not easy to remember, and historically\
    \ the spec has evolved quite a bit, forcing authors to update their stylesheets.\
    \ For all these reasons, Sass (and specifically the mixin) makes using CSS3 bearable\
    \ and future-proof. Should the spec change again, we’ll only need to update the\
    \ syntax once, in the mixin.\n\nFor example, let’s add a CSS linear gradient to\
    \ the active tab style on the Sasquatch design (Fig 3.4):\n\n```scss\nheader nav[role=\"\
    navigation\"] ul li.active a {\n  padding: 3px 8px;\n  color: #fff;\n  -webkit-border-radius:\
    \ 4px;\n     -moz-border-radius: 4px;\n          border-radius: 4px;\n  /* Fallback\
    \ for sad browsers */\n  background-color: #d4278;\n  /* Mozilla Firefox */\n\
    \  background-image: -moz-linear-gradient(#ff0b1, #d4278);\n  /* Opera */\n  background-image:\
    \ -o-linear-gradient(#ff0b1, #d4278);\n  /* WebKit (Safari/Chrome 10) */\n  background-image:\
    \ -webkit-gradient(linear, left top, left bottom, color-stop(0, #ff0b1), color-stop(1,\
    \ #d4278));\n  /* WebKit (Chrome 11+) */\n  background-image: -webkit-linear-gradient(#ff0b1,\
    \ #d4278);\n  /* IE10 */\n  background-image: -ms-linear-gradient(#ff0b1, #d4278);\n\
    \  /* W3C */\n  background-image: linear-gradient(#ff0b1, #d4278);\n}\n```\n\n\
