    \          box-shadow: 0, 1px, 2px, rgba(0,0,0,.5);\n}\n```\n\nNo need to write\
    \ those vendor-prefix stacks over and over. Write once, reuse whenever you’d like.\n\
    \n### CSS3 gradients\n\nCSS3 gradient syntax is ugly. It differs depending on\
    \ the browser, it’s not easy to remember, and historically the spec has evolved\
