    I am by no means a command-line expert, but I’ve learned a bit here and there
    over the years—just enough to get me into trouble. I’m not afraid to traverse
    the file system with it or use `Git` commands, etc.


    That said, I sympathize with designers and front-end developers who don’t want
    to go there. There’s a command-line phobia that exists among some folks. For Sass,
    there’s very little command-line action required—in fact, a single command is
    all you need to grasp. Additionally, there are apps and web frameworks that will
    obviate the need for the command line. (I’ll be introducing those in the next
    chapter).


    So, if you’re a command-line avoider, don’t let that stop you from trying Sass!


    ## I don’t want to change the way I write CSS!


    This was the misconception that I suffered from. I’m particular about the way
    my stylesheets are set up and organized. There’s a certain amount of craft that
    goes into the document. But remember, since the `SCSS` syntax is a superset of
    `CSS3`, you don’t have to change anything about the way you write CSS. Commenting,
    indenting, or not indenting, all your formatting preferences can remain the same
    when working in `.scss` files. Once I realized this, I could dive in without fear.


    ## I don’t want Sass to change the way I design!


    On the flip side, Sass won’t solve all of your problems or cure your bad habits.
    Inefficient, bloated stylesheets can be just as inefficient and bloated when using
    Sass. Good organization and smart thinking still apply here. In fact, there are
    instances where Sass can magnify bad practices, and we’ll go into that a bit as
    well. But when used properly and intelligently, Sass can be such a massive assist
    in creating websites.


    Okay. Now that we have the particulars out of the way, let’s start having some
    fun. I think you’ll be amazed at what Sass can do. In the next chapter, we’ll
    set up our workflow—how Sass can fit into your process and how easy it is to use
    the command-line or apps. Let’s get Sassing, people.


    ![Chapter 2: Sass Workflow](image/ch02.gif)


    NOW THAT we know what Sass is, let’s get set up so that we can start using it.
    Our first task is to install it on your computering device of choice. I mentioned
    in Chapter 1 that Sass is a program written in `Ruby`, which translates its native
    syntax into plain `CSS`. So, before we start using Sass, we need to install Sass.


    ## INSTALLING SASS ON A MAC


    If you’re on a Mac (and hooray for you, should you be so lucky), installing Sass
    couldn’t be simpler. Mac OS X comes preinstalled with `Ruby`, and Sass is packaged
    as a Ruby “gem,” which is a clever programmer term for a Ruby application.


    Simply fire up `Terminal.app` (don’t panic!), and at the prompt type the following
    and hit enter:


    ```

    $ gem install sass

    ```


    That wasn’t so bad, right? After you hit enter, you’ll see the following results
    stream by in Terminal:


    ```

    Fetching: sass-3.2.10.gem (100%)

    Successfully installed sass-3.2.10

    1 gem installed

    Installing ri documentation for sass-3.2.10...

    Installing RDoc documentation for sass-3.2.10...

    ```


    Congratulations! You’ve just installed Sass.


    At the time of this writing, the latest official version of Sass is `3.2.10`,
    and Terminal is nice enough to relay that bit of info to us.


    ### Installing the latest pre-release version


    You can also choose to live on the bleeding edge, and install the latest alpha
    version by adding a `pre` flag at the end of the command. Using the latest alpha
    is not only safe, but it also enables you to take advantage of the latest functionality.


    To get the latest and greatest, type this in the terminal prompt and hit enter:


    ```

    $ gem install sass --pre

    ```


    You’ll see the results stream by once again, this time confirming the `3.3.0`
    alpha has been installed.


    ```

    Fetching: sass-3.3.0.alpha.3.gem (100%)

    Successfully installed sass-3.3.0.alpha.3

    1 gem installed

    Installing ri documentation for sass-3.3.0.alpha.3...

    Installing RDoc documentation for sass-3.3.0.alpha.3...

    ```


    You’re now living on the edge, and I salute your daring leap of faith.


    ## INSTALLING SASS ON WINDOWS


    Unlike Mac OS X, Windows doesn’t come with Ruby pre-installed. The official Sass
    website recommends `RubyInstaller` for Windows to get things running on your PC
    ([http://bkaprt.com/sass/5/](http://bkaprt.com/sass/5/)). Once Ruby is installed,
    you’ll be able to follow the rest of the commands discussed in this chapter.


    ## TELLING SASS WHICH FILES TO WATCH


    Okay. We’ve installed Sass, so now what? We need to tell Sass which files to “watch.”
    Meaning, while we’re editing a stylesheet, we want Sass to monitor that file and
    convert the `.scss` file with all our nifty Sass syntax to the browser-ready `.css`
    file every time we make changes. There are a few ways to do this:


    *   A simple command via the command line.

    *   A desktop app (there are several) that will help you manage your Sass files
    and their output.


    Let’s tackle the command line first.


    ```

    $ sass --watch.scss:.css

    ```


    After you run the command, Sass will start monitoring. You will see this message:


    ```

    >>> Sass is watching for changes. Press Ctrl-C to stop.

    ```


    The file names don’t have to match. For instance, this would work just well:


    ```

    $ sass --watch..scss:.css

    ```


    Furthermore, the files don’t have to be in the same directory. In fact, I find
    it useful to separate my `.scss` files from my `.css` files.


    ### Sass File Organization


    **Figure 2.1** shows a typical setup, with a `stylesheets` directory, which contains
    the `.css` files and a `sass` directory that contains the `.scss` that I’m working
    with.


    ![Sass Organization](image/2-1.gif)


    You can also tell Sass to watch an entire directory, rather than a single stylesheet.
    So using the above file structure, I could use the following `watch` command to
    monitor any of the `.scss` files in my project:


    ```

    $ sass --watch stylesheets/sass

    ```


    ## USING APPS INSTEAD OF THE COMMAND LINE


    The commands we’ve gone over so far are extremely simple, and I have faith that
    you, astute front-end crafter that you are, wouldn’t find it difficult to add
    those bits of typing to your workflow. That said, there are desktop applications
    that make it even easier to manage the output of Sass files. They’re worth a look
    regardless of your comfort level with the command line.


    ### Scout


    Scout ([http://bkaprt.com/sass/6/](http://bkaprt.com/sass/6/)) is a free desktop
    app for both Mac and Windows that provides “a self-contained Ruby environment,
    letting you effortlessly manage all of your Sass projects with a handful of clicks.”
    In other words, Scout gives you a nice, visual interface to set up your watched
    directories and files rather than using the command line (**Fig 2.2**–**Fig 2.3**).


    ![Scout Website](image/2-2.gif)

    ![Scout Setup](image/2-3.gif)


    Once you’ve chosen input and output folders, simply click the play button for
    your project and Scout will start monitoring files. The “Log” section will display
    the terminal updates (**Fig 2.4**).


    ![Scout Log](image/2-4.gif)

