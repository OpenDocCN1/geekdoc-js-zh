  raw: 'LESS is another popular choice for designers and front-end craftspeople. It’s
    very similar to Sass in that it also supports variables, mixins, and other functions,
    but it uses a slightly different syntax. Like Sass’s SCSS, LESS is an extension
    of CSS, which means it plays nicely with existing stylesheets and can be gradually
    folded in ([http://bkaprt.com/sass/32/](http://bkaprt.com/sass/32/)).


    LESS also has a client-side option for compiling, which serves `.less` files to
    the browser that JavaScript compiles into regular CSS when the page loads. It’s
    a handy way to work locally and in development, as no command line or app needs
    to run the conversion for you. However, client-side compiling is not recommended
    for production sites.


    Like Sass, LESS has a command-line program as well as third-party apps that convert
    LESS files into CSS files.


    Feature-wise, in comparison to Sass, LESS does a little…well, less. From my perspective,
    Sass has a more active development cycle and community behind it, and is a bit
    more robust in its functionality. That said, what LESS does support is the important
    stuff—features that will help you write DRY stylesheets more efficiently. You’re
    already winning if you’re using a preprocessor, regardless of which one.


    For a great comparison of Sass versus LESS, have a gander at Chris Coyier’s thorough
    article, in which he breaks down the differences and pros and cons ([http://bkaprt.com/sass/33/](http://bkaprt.com/sass/33/)).


    These debates can at times become religious warfare, but the key thing is to use
    what you’re most comfortable with. Both will help immensely in easing the creation
    of smart stylesheets.


    #### Stylus


    Stylus is a bit younger than LESS and Sass, and it has a broad feature set. Its
    syntax is more like Sass’s original syntax (optional indenting, optional omission
    of braces and semicolons). I like tools that don’t alter my normal workflow too
    much, so for that reason I haven’t checked out Stylus extensively. But I’m mentioning
    it here because, again, if it feels right for you, then go for it. The important
    thing is to take advantage of one of these tools to make your life a little easier
    ([http://bkaprt.com/sass/34/](http://bkaprt.com/sass/34/)).


