    \ Should the spec change again, we’ll only need to update the syntax once, in\
    \ the mixin.\n\nFor example, let’s add a CSS linear gradient to the active tab\
    \ style on the Sasquatch Records design (**Fig 3.4**). To ensure the gradient\
    \ works in the most browsers possible and falls back to a solid color should the\
    \ browser not support CSS gradients, we’ll need a hefty stack of properties:\n\
