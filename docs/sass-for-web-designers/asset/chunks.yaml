    \ {\n  padding: 20px;\n  background: #eee;\n  -webkit-border-radius: 10px;\n \
    \    -moz-border-radius: 10px;\n          border-radius: 10px;\n}\n```\n\n###\
    \ box-shadow\n\nHere’s another example using multiple arguments: a mixin for creating\
    \ drop shadows in CSS3 that gives us the ability to pass in values for the vertical\
    \ and horizontal positions of the shadow, the amount of blur, and the color:\n\
    \n```\n@mixin shadow($x, $y, $blur, $color) {\n  -webkit-box-shadow: $x $y $blur\
