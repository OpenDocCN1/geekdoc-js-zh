  trans: "\n\n```scss\nsection.main h2 {\n  @include title-style(#c63, #eee);\n}\n\
    section.secondary h3 {\n  @include title-style(#39c, #333);\n}\n```\n\n在这种情况下，上述代码将将编译为：\n\
    \n```css\nsection.main h2 {\n  margin: 0 0 20px 0;\n  font-family: Jubilat, Georgia,\
    \ serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n\
    \  color: #c63;\n  background: #eee;\n}\nsection.secondary h3 {\n  margin: 0 0\
    \ 20px 0;\n  font-family: Jubilat, Georgia, serif;\n  font-size: 20px;\n  font-weight:\
    \ bold;\n  text-transform: uppercase;\n  color: #39c;\n  background: #333;\n}\n\
    ```\n\n你可以开始看到 mixins（混合宏）是多么的灵活。通过参数，一致共享的规则可以与略有差异的规则并存。\n\n### 为参数定义默认值\n\n\
    当你使用 mixin 参数时，定义默认值通常非常方便。这样一来，如果这是常态，你只需要不带参数地调用 mixin，但仍然传入覆盖值。\n\n```scss\n\
    @mixin title-style($color, $background: #eee) {\n  margin: 0 0 20px 0;\n  font-family:\
    \ $font-serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n\
    \  color: $color;\n  background: $background;\n}\n```\n\n尽管我们为 mixin 的背景定义了浅灰色默认值，但我们可以传递一个不同的参数：\n\
    \n```scss\nsection.main h2 {\n  @include title-style(#c63);\n}\nsection.secondary\
    \ h3 {\n  @include title-style(#39c, #333);\n}\n```\n\n这再次将编译为：\n\n```css\nsection.main\
    \ h2 {\n  margin: 0 0 20px 0;\n  font-family: Jubilat, Georgia, serif;\n  font-size:\
    \ 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color: #c63;\n\
    \  background: #eee;\n}\nsection.secondary h3 {\n  margin: 0 0 20px 0;\n  font-family:\
    \ Jubilat, Georgia, serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform:\
    \ uppercase;\n  color: #39c;\n  background: #333;\n}\n```\n\n此外，当你为 mixin 定义了多个默认参数时，你可以选择性地覆盖这些参数，而无需重新定义所有参数。\n\
    \n例如，假设我们的 mixin 为 `$color` 和 `$background` 都定义了值：\n\n```scss\n@mixin title-style($color:\
    \ blue, $background: green) {\n  margin: 0 0 20px 0;\n  font-family: $font-serif;\n\
    \  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color:\
    \ $color;\n  background: $background;\n}\n```\n\n如果我们想让颜色保持默认的蓝色，但想将背景覆盖为粉色，我们只需要传递背景：\n\
    \n```scss\nsection.main h2 {\n  @include title-style($background: pink);\n}\n\
    ```\n\n这将将编译为：\n\n```css\nsection.main h2 {\n  margin: 0 0 20px 0;\n  font-family:\
    \ Jubilat, Georgia, serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform:\
    \ uppercase;\n  color: blue;\n  background: pink;\n}\n```\n\n这是一个非常省时间的方法，它将这些参数定义在一个地方（即\
    \ mixin 中）。\n\n## CSS3 喜爱 MIXINS\n\n带参数的 mixins 使用在 CSS3 中非常大放异彩，在 CSS3 中，我们经常在整个样式表中重复带有厂商前缀的规则，以实现圆角、阴影、渐变、过渡等。虽然这些属性的值在整个设计中可能有所不同，但有大量内容是共享和重复的，而\
    \ Sass 处理 CSS3 “堆栈”变得轻而易举。不记得创建 CSS 渐变的语法了吗？把它写成 mixin 吧！\n\n### border-radius\n\
    \n这是一个用于在所有浏览器中处理 CSS3 圆角的 mixin，带一个用于半径值的参数：\n\n```scss\n@mixin rounded($radius)\
    \ {\n  -webkit-border-radius: $radius;\n     -moz-border-radius: $radius;\n  \
    \        border-radius: $radius;\n}\n```\n\n我们随后可以通过调用该 mixin 让页面上的任何内容变为圆角：\n\
    \n```scss\nol.slats li a img {\n  float: left;\n  margin: 0 10px 0 0;\n  padding:\
    \ 4px;\n  border: 1px solid #ddd;\n  @include rounded(3px);\n}\ndiv.module {\n\
    \  padding: 20px;\n  background: #eee;\n  @include rounded(10px);\n}\n```\n\n\
    这将其编译为：\n\n```css\nol.slats li a img {\n  float: left;\n  margin: 0 10px 0 0;\n\
    \  padding: 4px;\n  border: 1px solid #ddd;\n  -webkit-border-radius: 3px;\n \
    \    -moz-border-radius: 3px;\n          border-radius: 3px;\n}\ndiv.module {\n\
    \  padding: 20px;\n  background: #eee;\n  -webkit-border-radius: 10px;\n     -moz-border-radius:\
    \ 10px;\n          border-radius: 10px;\n}\n```\n\n### box-shadow\n\n这是另一个使用多个参数的示例：一个在\
    \ CSS3 中创建投影的 mixin，它使我们能够传入阴影的垂直和水平位置、模糊程度以及颜色：\n\n```scss\n@mixin shadow($x,\
    \ $y, $blur, $color) {\n  -webkit-box-shadow: $x $y $blur $color;\n     -moz-box-shadow:\
    \ $x $y $blur $color;\n          box-shadow: $x $y $blur $color;\n}\n```\n\n让我们将这个\
    \ mixin 添加到之前的 `div.module` 示例中，让阴影从顶部出现，带有 `1px` 的 `2px` 偏移，以及 50% 的透明度：\n\n\
    ```scss\ndiv.module {\n  padding: 20px;\n  background: #eee;\n  @include shadow(1px,\
    \ 2px, 3px, rgba(0,0,0,0.5));\n}\n```\n\n这将其编译为：\n\n```css\ndiv.module {\n  padding:\
    \ 20px;\n  background: #eee;\n  -webkit-box-shadow: 1px 2px 3px rgba(0,0,0,0.5);\n\
    \     -moz-box-shadow: 1px 2px 3px rgba(0,0,0,0.5);\n          box-shadow: 1px\
    \ 2px 3px rgba(0,0,0,0.5);\n}\n```\n\n### CSS3 渐变\n\nCSS3 渐变语法很丑。它根据浏览器而不同，很难记忆，而且在历史上规范发生了很大变化，迫使作者更新样式表。由于所有这些原因，Sass（特别是\
    \ mixin）使得使用 CSS3 变得可行且具有前瞻性。如果规范再次发生变化，我们只需要在 mixin 中更新一次语法。\n\n例如，让我们为 Sasquatch\
    \ 设计（图 3.4）中的活动标签页样式添加一个 CSS 线性渐变：\n\n```scss\nheader nav[role=\"navigation\"\
    ] ul li.active a {\n  padding: 3px 8px;\n  color: #fff;\n  -webkit-border-radius:\
    \ 4px;\n     -moz-border-radius: 4px;\n          border-radius: 4px;\n  /* 针对旧浏览器的备选\
    \ */\n  background-color: #d4278;\n  /* Mozilla Firefox */\n  background-image:\
    \ -moz-linear-gradient(#ff0b1, #d4278);\n  /* Opera */\n  background-image: -o-linear-gradient(#ff0b1,\
    \ #d4278);\n  /* WebKit (Safari/Chrome 10) */\n  background-image: -webkit-gradient(linear,\
    \ left top, left bottom, color-stop(0, #ff0b1), color-stop(1, #d4278));\n  /*\
    \ WebKit (Chrome 11+) */\n  background-image: -webkit-linear-gradient(#ff0b1,\
    \ #d4278);\n  /* IE10 */\n  background-image: -ms-linear-gradient(#ff0b1, #d4278);\n\
    \  /* W3C */\n  background-image: linear-gradient(#ff0b1, #d4278);\n}\n```\n\n\
    ![](img/3-4.gif)\n\n图: 3.4: Sasquatch 网站上的共享标题样式。\n\n"
- fmt: "\n```scss\n@mixin linear-gradient($from, $to) {\n  /* Fallback for sad browsers\
    \ */\n  background-color: $to;\n  /* Mozilla Firefox */\n  background-image:-moz-linear-gradient($from,\
    \ $to);\n  /* Opera */\n  background-image:-o-linear-gradient($from, $to);\n \
    \ /* WebKit (Safari 4+, Chrome 1+) */\n  background-image:-webkit-gradient(linear,\
    \ left top, left bottom, color-stop(0, $from), color-stop(1, $to));\n  /* WebKit\
    \ (Chrome 11+) */\n  background-image: -webkit-linear-gradient($from, $to);\n\
    \  /* IE10 */\n  background-image: -ms-linear-gradient($from, $to);\n  /* W3C\
    \ */\n  background-image: linear-gradient($from, $to);\n}\n```\n\nNotice that\
    \ I’m using the `$to` color to specify the `background-color` fallback for browsers\
    \ that don’t support CSS gradients.\n\nThankfully, we only have to write this\
    \ monstrosity once. Now, when we want to create a simple linear gradient, we just\
    \ call the mixin with two colors of our choosing and Sass does the rest. For the\
    \ Sasquatch site, the declaration for the active tab style goes like this:\n\n\
    ```scss\n&.active a {\n  padding: 3px 8px;\n  color: #fff;\n  @include rounded(4px);\n\
    \  @include linear-gradient(#ff70b1, #d42a78);\n}\n```\n\nThat is not only bearable,\
    \ it just makes sense! As if it’s written in English. And I can reuse this pattern,\
    \ for say a blue button (**Fig 3.5**), on a different selector in the stylesheet\
    \ without recalling all that gradient syntax garbage:\n\n```scss\nbutton {\n \
    \ padding: 5px 10px;\n  color: #fff;\n  @include rounded(6px);\n  @include linear-gradient(#42b3e2,\
    \ #1a6798);\n}\n```\n\n![](image/3-5.gif)\n\nFIG 3.5: Gradient-ified buttons are\
    \ easy with a Sass mixin.\n\nAs you may know, the linear gradient we’re using\
    \ here is one simple example, and CSS gradients are capable of much more complexity,\
    \ like color stops, radial gradients, multiple directions, etc. Sass can help\
    \ with those situations as well, abstracting any shared patterns into a reusable\
    \ mixin.\n\n## CREATING A MIXIN LIBRARY\n\nMixins are wonderful because they can\
    \ be written once and used throughout the stylesheet. But often these mixins are\
    \ even repeated across projects. You’ll likely find yourself writing mixins for\
    \ common CSS3 properties like `box-shadow`, gradients, CSS transitions, and patterns\
    \ like self-clearing floats, `box-sizing`, form elements, etc. Wouldn’t it be\
    \ efficient to also write all of these once and reuse them for any project where\
    \ you’re using Sass?\n\n### @import\n\nEnter the `@import` rule, which Sass extends\
    \ to allow the importing of multiple SCSS files, merging them into a single CSS\
    \ file when compiled. This is handy for a variety of reasons:\n\n* A single CSS\
    \ means fewer HTTP connections. Performance!\n* Variables can be defined in their\
    \ own file, then imported whenever needed, regardless of layout and other page-specific\
    \ styles.\n* Imported SCSS files can contain project-agnostic mixins that can\
    \ be shared and reused.\n\nHere’s how `@import` works in practice.\n\nI have a\
    \ `mixins.scss` file that’s imported to all my projects. In that file I’ve defined\
    \ some common patterns I’ll use in every project. Here’s an example of what’s\
    \ inside `mixins.scss`:\n\n```scss\n@mixin rounded($radius) {\n  -webkit-border-radius:\
    \ $radius;\n     -moz-border-radius: $radius;\n          border-radius: $radius;\n\
    }\n@mixin shadow($x, $y, $blur, $color) {\n  -webkit-box-shadow: $x $y $blur $color;\n\
    \     -moz-box-shadow: $x $y $blur $color;\n          box-shadow: $x $y $blur\
    \ $color;\n}\n@mixin shadow-inset($x, $y, $blur, $color) {\n  -webkit-box-shadow:\
    \ inset $x $y $blur $color;\n     -moz-box-shadow: inset $x $y $blur $color;\n\
    \          box-shadow: inset $x $y $blur $color;\n}\n@mixin transition($property)\
    \ {\n  -webkit-transition: $property .2s ease;\n     -moz-transition: $property\
    \ .2s ease;\n       -o-transition: $property .2s ease;\n          transition:\
    \ $property .2s ease;\n}\n@mixin box-sizing {\n  -webkit-box-sizing: border-box;\n\
    \     -moz-box-sizing: border-box;\n          box-sizing: border-box;\n}\n@mixin\
    \ linear-gradient($from, $to) {\n  /* Fallback for sad browsers */\n  background-color:\
    \ $to;\n  /* Mozilla Firefox */\n  background-image:-moz-linear-gradient($from,\
    \ $to);\n  /* Opera */\n  background-image:-o-linear-gradient($from, $to);\n \
    \ /* WebKit (Chrome 11+) */\n  background-image:-webkit-gradient(linear, left\
    \ top, left bottom, color-stop(0, $from), color-stop(1, $to));\n  /* WebKit (Safari\
    \ 5.1+, Chrome 10+) */\n  background-image: -webkit-linear-gradient($from, $to);\n\
    \  /* IE10 */\n  background-image: -ms-linear-gradient($from, $to);\n  /* W3C\
    \ */\n  background-image: linear-gradient($from, $to);\n}\n```\n\nAt the top of\
    \ my main stylesheet (`screen.scss` in this case) where I define all of my layout\
    \ and other site-specific styles, I use the `@import` rule to pull those in so\
    \ that the mixins are available. I also import a reset stylesheet that’s reused\
    \ in every project (again saving on HTTP connections and avoiding copying and\
    \ pasting the same code) as well as a variables file where I keep variables for\
    \ site colors, fonts, etc. (**Fig 3.6**). That allows me to import those same\
    \ variables in other stylesheets—for example, in other pages or sections of the\
    \ same project, where the style guide applies—without also importing the rest\
    \ of the layout.\n\n![](image/3-6.gif)\n\nFIG 3.6: Use @import to merge chunks\
    \ into one file.\n\n```scss\n // Import other files\n\n@import \"reset.scss\"\
    ;\n@import \"variables.scss\";\n@import \"mixins.scss\";\n\n// Site-specific styles\n\
    \n.foo {\n  ...\n}\n```\n\n### The Compass framework\n\nI always suggest creating\
    \ your own frameworks, as it’s best to understand what is happening with your\
    \ code as much as possible. But as a learning experience, other frameworks can\
    \ be incredibly beneficial—they let you see how others set up projects and increase\
    \ their efficiency. And Compass is no exception.\n\n### The Bourbon library\n\n\
    The folks at design/development shop thoughtbot have put together an extensive\
    \ mixin library, called Bourbon—which, coincidentally, I’ve been drinking too\
    \ much of, with vermouth and bitters and muddled sugar and fruit (**Fig 3.8**).\n\
    \nA little Googling will unearth many helpful Sassers sharing their mixins on\
    \ GitHub or their own sites. Chances are, that CSS3 stack that looks ugly and\
    \ unmaintainable already has a mixin written for it, so take advantage of the\
    \ community!\n\n### @extend\n\nEver find yourself writing a CSS class that has\
    \ the same styles as another class, except for just a few other rules?\n\nHere’s\
    \ an example. You have an alert message style with two options at the top of the\
    \ page. One style handles standard alerts (**Fig 3.9**), while the second style\
    \ handles positive alerts (**Fig 3.10**). These styles are almost identical, save\
    \ for the background color.\n\nTypically, we might create a base class for normal\
    \ alerts and then a second class that overrides the background color only.\n"
