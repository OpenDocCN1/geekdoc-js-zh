    Web 框架可以消除对命令行的需求。（我将在下一章介绍这些内容）。


    所以，如果你是一个命令行规避者，不要让这阻碍你尝试 Sass！


    ## 我不想改变我编写 CSS 的方式！


    这是我曾受过的一个误区。我对样式表的设置和组织方式非常讲究。文档的编写包含某种手工艺。但请记住，由于 `SCSS` 语法是 `CSS3` 的超集，你不需要改变编写
    CSS 的任何方式。在处理 `.scss` 文件时，无论注释、缩进还是不缩进，你所有的格式偏好都可以保持不变。一旦我意识到这一点，就可以毫无恐惧地深入其中了。


    ## 我不想让 Sass 我的设计方式！


    相反，Sass 并不会解决你所有的问题，也不会治愈你的坏习惯。低效、臃肿的样式表在使用 Sass 时可能同样低效且臃肿。良好的组织和聪明的思维在这里仍然适用。事实上，在某些情况下
    Sass 会放大糟糕的做法，我们也会对此进行讨论。但当正确且智能地使用时，Sass 可以成为创建网站的巨大助力。


