    # 关于这本书 (ABOUT A BOOK APART)


    我们以风格化、清晰且最重要的是简洁的方式，涵盖了 Web 设计和开发中新兴且至关重要的主题——因为兼任设计师的开发者无法浪费时间。


    ## 版记 (COLOPHON)


    正文使用 `FF Yoga` 及其配套字体 `FF Yoga Sans` 排版，均由 Xavier Dupré 设计。标题和封面使用 David Berlow
    的 `Titling Gothic` 字体。


    # 关于作者 (ABOUT THE AUTHOR)


    ![Dan Cederholm](img/dancederholm-sfwd-fixed_fmt.png)


    `Dan Cederholm` 是一位住在马萨诸塞州萨勒姆的设计师、作者和演讲者。他是设计师社区 `Dribbble` 的联合创始人，也是微型设计工作室 `SimpleBits`
    的创始人。作为基于标准的 Web 设计长期倡者，Dan 曾与 `YouTube`、`Microsoft`、`Google`、`MTV`、`ESPN` 等机构合作。他写过几本关于
    Web 设计的热门书籍，并于 2012 年初获得 `TechFellow` 奖。他目前是一名有抱的爪 banjo 琴演奏手，偶尔会戴棒球帽。


