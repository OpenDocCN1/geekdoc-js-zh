  trans: "\n\n对于一个使用响应式设计并针对多个视图频繁使用媒体查询的大型样式表，这样做可以大幅减少编译后的 CSS 文件体积。遗憾的是，Sass 目前（暂？）不支持我所说的“聚合媒体查询冒泡（aggregated\
    \ media query bubbling）”，但对于大多数项目来说，牺牲稍微大一点的编译样式表来换取内联嵌套媒体查询的便利性和合理性是完全值得的。所以，目前，我们就打算这么做。\n\
    \n## “视网膜化”HiDPI 背景图像\n\n仿佛对于我们网页设计师来说，事情还不够复杂似的，高像素密度（HiDPI）屏幕的兴起又带来了另一个挑战。例如，苹果精美的\
    \ Retina 屏幕像素数量是普通显示器的两倍。这意味着它拥有了极佳的清晰度，并从此告别模糊的像素！但前提是你花时间创建能够反映这个超锐利新世界的图形。\n\
    \n对于页面上的 `<img>` 元素，这通常意味着创建尺寸是倍数的图像，并在标记中使用 `width` 属性将其压缩为一半大小。或者，还有更巧妙的方法通过媒体查询和\
    \ JavaScript 来处理选择性图像服务，例如 Scott Jehl 出色的 Picturefill 项目 ([`bkaprt.com/sass/14/`](http://bkaprt.com/sass/14/))。\n\
    \n为了分享处理 HiDPI 图像的示例，让我们来看 Sasquatch Records 的标志，它是 133×121 像素（图 4.1）。对于支持额外像素的设备，我们将创建一个更大的版本（266×242），并在标记中将其还原为\
    \ 133 像素以获得双倍清晰度（图 4.2）：\n\n```\n<img src=\"-/img/logo-peek-2x.png\" width=\"\
    133\" />\n```\n\n![](img/4-1_4-2.gif)\n\n图 4.1–图 4.2：左侧为普通分辨率标志，右侧为 HiDPI 版本。\n\
    \n对于背景图像，我们只需使用 CSS 媒体查询（在支持它们的现代浏览器中）判断显示器是否为 HiDPI，并渲染适当大小的图像。\n\n例如，在 Sasquatch\
    \ Records 网上，侧边栏有一个社交网络链接列表。每个链接的图标在样式表中都指定了背景图像（图 4.3）。\n\n![4-3.tif](img/4-3.gif)\n\
    \n图 4.3：Sasquatch Records 网站侧边栏的社交网络链接。\n\n在 Dribbble 链接中，将普通分辨率图标对齐到文本左侧的 CSS\
    \ 可能如下：\n\n```\nul.follow li.dribbble a {\n  padding-left: 30px;\n  background-repeat:\
    \ no-repeat;\n  background-position: 0 50%;\n  background-image: url(../img/icon-dribbble.png);\n\
    }\n```\n\n对于 HiDPI 显示器，我们用一个倍大的图标覆盖，然后使用 CSS3 的 `background-size` 属性将其“挤”回目标尺寸。为了检测显示器是否为\
    \ HiDPI，我们使用媒体查询和 CSS3 中的 `min-device-pixel-ratio` 属性（这取决于浏览器厂商）。\n\n```\n@media\
    \ (-webkit-min-device-pixel-ratio: 1.5),\n       (min--moz-device-pixel-ratio:\
    \ 1.5),\n       (-o-min-device-pixel-ratio: 3/2),\n       (min-device-pixel-ratio:\
    \ 1.5),\n       (min-resolution: 1.5dppx) {\n  ul.follow li.dribbble a {\n   \
    \ padding-left: 30px;\n    background-repeat: no-repeat;\n    background-position:\
    \ 0 50%;\n    background-image: url(../img/icon-dribbble-2x.png);\n    -webkit-background-size:\
    \ 24px 24px;\n       -moz-background-size: 24px 24px;\n            background-size:\
    \ 24px 24px;\n  }\n}\n```\n\n本质上，我们的意思是如果显示器的像素密度至少是正常密度的 1.5 倍，让我们使用一个较大的 48×48\
    \ 图标（`icon-dribbble-2x.png`），并在屏幕显示时将其压缩为 24×24。\n\n在 HiDPI 显示器上查看，这种差异是极其锐利的。所有模糊的边缘都消失了（图\
    \ 4.4）。\n\n![4-4.tif](img/4-4.gif)\n\n图 4.4：借助 Sass 力量的清晰 Hi-DPI 图标！\n\n你可以想象，对界面进行“视网膜化”会导致大量的重复工作，每当你想要覆盖普通分辨率的背景图像时，都要引用该媒体查询和第二个图像。这正是\
    \ Sass 可以让这个过程变得不再痛苦的地方。\n\n我们可以创建一个 Sass mixin 来处理所有繁重工作，甚至通过一点巧妙的拼接形成两个不同的文件名。\n\
    \n这里是我在日常项目中使用的 `retinize` mixin——我将拆解每个重要部分。\n\n```\n @mixin retinize($file,\
    \ $type, $width, $height) {\n  background-image: url('../img/' + $file + '.' +\
    \ $type);\n\n  @media (-webkit-min-device-pixel-ratio: 1.5),\n         (min--moz-device-pixel-ratio:\
    \ 1.5),\n         (-o-min-device-pixel-ratio: 3/2),\n         (min-device-pixel-ratio:\
    \ 1.5),\n         (min-resolution: 1.5dppx) {\n    & {\n      background-image:\
    \ url('../img/' + $file + '-2x.' + $type);\n      -webkit-background-size: $width\
    \ $height;\n         -moz-background-size: $width $height;\n              background-size:\
    \ $width $height;\n    }\n  }\n}\n```\n\nMixin 的第一行设置了构建正确的编译代码所需的全部四个参数：\n\n\
    *   文件名\n*   图像类型（JPG, GIF, PNG）\n*   图像在屏幕上的宽度\n*   图像在屏幕上的高度\n\n这四个参数列出如下：\n\
    \n```\n@mixin retinize($file, $type, $width, $height) {\n```\n\n调用 `retinize`\
    \ mixin 只需要在你任何需要的时候插入这些值即可简单。例如：\n\n```\nli.dribbble {\n  @include retinize('icon-dribbble',\
    \ 'png', 24px, 24px);\n}\n\nli.flickr {\n  @include retinize('icon-flickr', 'png',\
    \ 24px, 24px);\n}\n\nli.facebook {\n  @include retinize('icon-facebook', 'png',\
    \ 24px, 24px);\n}\n```\n"
- fmt: "\nThe final piece of the mixin is the `background-size` property (and its\
    \ `-webkit-` and `-moz-` prefixed equivalents), which tells the browser what dimensions\
    \ it’s going to stuff that larger image into:\n\n```scss\n@mixin retinize($file,\
    \ $type, $width, $height) {\n  background-image: url('../img/' + $file + '.' +\
    \ $type);\n\n  @media (-webkit-min-device-pixel-ratio: 1.5),\n         (min--moz-device-pixel-ratio:\
    \ 1.5),\n         (-o-min-device-pixel-ratio: 3/2),\n         (min-device-pixel-ratio:\
    \ 1.5),\n         (min-resolution: 1.5dppx) {\n    & {\n      background-image:\
    \ url('../img/' + $file + '-2x.' + $type);\n      -webkit-background-size: $width\
    \ $height;\n         -moz-background-size: $width $height;\n              background-size:\
    \ $width $height;\n    }\n  }\n}\n```\n\nAnd that’s it—a reusable mixin for serving\
    \ HiDPI background images from any selector you’d like, just by creating two image\
    \ assets and one line of SCSS:\n\n```scss\nli.dribbble a {\n  @include retinize('icon-dribbble',\
    \ 'png', 24px, 24px);\n}\n```\n\n### Mixins inside mixins!\n\nMixins can include\
    \ other mixins. A mixinception, if you will. Don’t worry, the universe won’t explode!\
    \ In fact, we can go a step further in DRY-ing up this code, extracting the vendor-prefixed\
    \ `min-device-pixel-ratio` rules into a variable and the `background-size` property\
    \ stack into its own mixin. Then these extracted parts could be reused in other\
    \ sections of the stylesheet or additional mixins. The other advantage here is\
    \ keeping any vendor-prefixed properties in one spot so we can edit or prune them\
    \ if the specs change, or once prefixes are no longer necessary (and won’t that\
    \ be a celebratory day).\n\nFirst, let’s replace the pixel-ratio portion of the\
    \ media query with a reusable variable. As mentioned earlier in the chapter, a\
    \ variable that appears within a selector needs special interpolation characters\
    \ around it:\n\n```scss\n@mixin retinize($file, $type, $width, $height) {\n  background-image:\
    \ url('../img/' + $file + '.' + $type);\n\n  @media #{$is-hidpi} {\n    & {\n\
    \      background-image: url('../img/' + $file + '-2x.' + $type);\n      -webkit-background-size:\
    \ $width $height;\n         -moz-background-size: $width $height;\n          \
    \    background-size: $width $height;\n    }\n  }\n}\n```\n\nThen we’ll define\
    \ that variable with the stack of pixel-ratio rules, which is also reusable elsewhere\
    \ in the stylesheet if needed:\n\n```scss\n$is-hidpi: \"(-webkit-min-device-pixel-ratio:\
    \ 1.5), (min--moz-device-pixel-ratio: 1.5), (-o-min-device-pixel-ratio: 3/2),\
    \ (min-device-pixel-ratio: 1.5),(min-resolution: 1.5dppx)\";\n```\n\nNext, let’s\
    \ create a mixin for `background-size` that takes a `width` and `height` attribute\
    \ and includes the vendor-prefixed properties as well as the “real,” un-prefixed\
    \ one. Anytime we want to use `background-size` on a selector, we can now call\
    \ this mixin:\n\n```scss\n@mixin background-size($width, $height) {\n  -webkit-background-size:\
    \ $width $height;\n     -moz-background-size: $width $height;\n          background-size:\
    \ $width $height;\n}\n```\n\nLet’s include this `background-size` mixin within\
    \ the `retinize` mixin, passing along the `$width` and `$height` variables it’s\
    \ already collecting:\n\n```scss\n@mixin retinize($file, $type, $width, $height)\
    \ {\n  background-image: url('../img/' + $file + '.' + $type);\n\n  @media #{$is-hidpi}\
    \ {\n    & {\n      background-image: url('../img/' + $file + '-2x.' + $type);\n\
    \      @include background-size($width, $height);\n    }\n  }\n}\n```\n\nAnd there\
    \ you have it. We’ve refactored the original `retinize` mixin to include code\
    \ that can be reused in additional styles or mixins. That’ll reduce the amount\
    \ of repetition throughout our Sass code, and keep shared styles in as few places\
    \ as possible for future updates and maintenance.\n\n## WRAPPING UP\n\nI hope\
    \ this little pink book has helped you get started with Sass and become familiar\
    \ with its core features. I also hope that it’s dispelled some of the misunderstandings\
    \ that Sass sometimes bears:\n\n*   You have to learn Ruby.\n*   You need to change\
    \ your entire CSS process.\n*   You need to be an expert with the command line.\n\
    \nAs we’ve discussed, it’s much simpler than that. But Sass can be as powerful\
    \ as you want it to be. At the least, it’s a fantastic tool that can fit nicely\
    \ beside your systems and workflow without disturbing the CSS you’ve been writing\
    \ for years (or if you’ve only been writing CSS for months, well then…months—and).\n\
    \n# RESOURCES\n\n### Websites and articles\n\n*   **Sass reference**: The official\
    \ documentation for Sass.\n*   **The Sass Way**: Chris Eppstein has covered Sass\
    \ extensively.\n*   **CSS Tricks**: Chris Coyier has covered Sass similarly.\n\
    *   **Getting started with Sass**: Code School’s comprehensive course on Sass.\n\
    *   **Looking into the future of Sass**: David Walsh assesses what’s coming down\
    \ the pipeline for Sass.\n\n### Mixin libraries\n\n*   **Compass**: An extensive\
    \ framework for Sass created by Blueprint. Even if you’re not using Compass, the\
    \ documentation is a goldmine.\n*   **Bourbon**: Billing itself as “A simple and\
    \ lightweight mixin library for Sass,” Bourbon offers a ton of mixin concepts\
    \ from thoughtbot.\n*   **Handy Sass Mixins**: A nice collection of Sass mixins\
    \ from Jake Bresnehan.\n\n### More Sass and responsive design\n\n*   **Breakpoint**:\
    \ A plugin for Sass that makes media queries even simpler.\n*   **Susy**: A helper\
    \ for Compass and Sass for creating responsive grid systems.\n*   **Sassaparilla**:\
    \ A kick-start framework for creating responsive web design projects using Compass\
    \ and Sass.\n\n### tools\n\n*   **FireSass for Firebug**: A handy Firefox add-on\
    \ that will display the original Sass filename and line number of Sass-compiled\
    \ stylesheets, for debugging.\n*   **Developing with Sass and Chrome DevTools**:\
    \ A tutorial on how to best use Chrome while developing with Sass.\n\n### Other\
    \ CSS preprocessors\n\nWhile Sass is the subject of this little book, it’s not\
    \ the only CSS preprocessor out there. If you’ve caught the preprocessing bug\
    \ (and I surely hope you have), it might be worth checking out these alternatives—noting\
    \ how they differ from Sass.\n\n#### LESS\n"
  raw: "The final piece of the mixin is the `background-size` property (and its `-webkit-`\
    \ and `-moz-` prefixed equivalents), which tells the browser what dimensions it’s\
    \ going to stuff that larger image into:\n\n```\n@mixin retinize($file, $type,\
    \ $width, $height) {\n  background-image: url('../img/' + $file + '.' + $type);\n\
    \n  @media (-webkit-min-device-pixel-ratio: 1.5),\n         (min--moz-device-pixel-ratio:\
    \ 1.5),\n         (-o-min-device-pixel-ratio: 3/2),\n         (min-device-pixel-ratio:\
    \ 1.5),\n         (min-resolution: 1.5dppx) {\n    & {\n      background-image:\
    \ url('../img/' + $file + '-2x.' + $type);\n      -webkit-background-size: $width\
    \ $height;\n         -moz-background-size: $width $height;\n              background-size:\
    \ $width $height;\n    }\n  }\n}\n```\n\nAnd that’s it—a reusable mixin for serving\
    \ HiDPI background images from any selector you’d like, just by creating two image\
    \ assets and one line of SCSS:\n\n```\n li.dribbble a {\n  @include retinize('icon-dribbble',\
    \ 'png', 24px, 24px);\n}\n```\n\n### Mixins inside mixins!\n\nMixins can include\
    \ other mixins. A mixinception, if you will. Don’t worry, the universe won’t explode!\
    \ In fact, we can go a step further in DRY-ing up this code, extracting the vendor-prefixed\
    \ `min-device-pixel-ratio` rules into a variable and the `background-size` property\
    \ stack into its own mixin. Then these extracted parts could be reused in other\
    \ sections of the stylesheet or additional mixins. The other advantage here is\
    \ keeping any vendor-prefixed properties in one spot so we can edit or prune them\
    \ if the specs change, or once prefixes are no longer necessary (and won’t that\
    \ be a celebratory day).\n\nFirst, let’s replace the pixel-ratio portion of the\
    \ media query with a reusable variable. As mentioned earlier in the chapter, a\
    \ variable that appears within a selector needs special interpolation characters\
    \ around it:\n\n```\n@mixin retinize($file, $type, $width, $height) {\n  background-image:\
    \ url('../img/' + $file + '.' + $type);\n\n  @media #{$is-hidpi} {\n    & {\n\
    \      background-image: url('../img/' + $file + '-2x.' + $type);\n      -webkit-background-size:\
    \ $width $height;\n         -moz-background-size: $width $height;\n          \
    \    background-size: $width $height;\n    }\n  }\n}\n```\n\nThen we’ll define\
    \ that variable with the stack of pixel-ratio rules, which is also reusable elsewhere\
    \ in the stylesheet if needed:\n\n```\n$is-hidpi: \"(-webkit-min-device-pixel-ratio:\
    \ 1.5), (min--moz-device-pixel-ratio: 1.5), (-o-min-device-pixel-ratio: 3/2),\
    \ (min-device-pixel-ratio: 1.5),(min-resolution: 1.5dppx)\";\n```\n\nNext, let’s\
    \ create a mixin for `background-size` that takes a `width` and `height` attribute\
    \ and includes the vendor-prefixed properties as well as the “real,” un-prefixed\
    \ one. Anytime we want to use `background-size` on a selector, we can now call\
    \ this mixin:\n\n```\n@mixin background-size($width, $height) {\n  -webkit-background-size:\
    \ $width $height;\n     -moz-background-size: $width $height;\n          background-size:\
    \ $width $height;\n}\n```\n\nLet’s include this `background-size` mixin within\
    \ the `retinize` mixin, passing along the `$width` and `$height` variables it’s\
    \ already collecting:\n\n```\n@mixin retinize($file, $type, $width, $height) {\n\
    \  background-image: url('../img/' + $file + '.' + $type);\n\n  @media #{$is-hidpi}\
    \ {\n    & {\n      background-image: url('../img/' + $file + '-2x.' + $type);\n\
    \      @include background-size($width, $height);\n    }\n  }\n}\n```\n\nAnd there\
    \ you have it. We’ve refactored the original `retinize` mixin to include code\
    \ that can be reused in additional styles or mixins. That’ll reduce the amount\
    \ of repetition throughout our Sass code, and keep shared styles in as few places\
    \ as possible for future updates and maintenance.\n\n## WRAPPING UP\n\nI hope\
    \ this little pink book has helped you get started with Sass and become familiar\
    \ with its core features. I also hope that it’s dispelled some of the misunderstandings\
    \ that Sass sometimes bears:\n\n*   You have to learn Ruby.\n\n*   You need to\
    \ change your entire CSS process.\n\n*   You need to be an expert with the command\
    \ line.\n\nAs we’ve discussed, it’s much simpler than that. But Sass can be as\
    \ powerful as you want it to be. At the least, it’s a fantastic tool that can\
    \ fit nicely beside your systems and workflow without disturbing the CSS you’ve\
    \ been writing for years (or if you’ve only been writing CSS for months, well\
    \ then…months—and bravo!).\n\nNow go simplify your stylesheets with reusable blocks\
    \ of Sassy CSS, save yourself a boatload of time, and, most important, build awesome\
    \ things!\n\n# RESOURCES\n\n### Websites and articles\n\n*   **Sass reference:**\
    \ The official documentation for all things Sass ([http://bkaprt.com/sass/15/](http://bkaprt.com/sass/15/)).\n\
    \n*   **The Sass Way:** “...covers the latest news and topics on crafting CSS\
    \ using Sass and Compass.” Great articles and resources on how to best put Sass\
    \ to use ([http://bkaprt.com/sass/16/](http://bkaprt.com/sass/16/)).\n\n*   **CSS\
    \ Tricks:** Chris Coyier has covered Sass pretty extensively, and we share very\
    \ similar views on how Sass can help the CSS hand-coder ([http://bkaprt.com/sass/17/](http://bkaprt.com/sass/17/)).\
    \ In particular, be sure to check out his Sass Style Guide ([http://bkaprt.com/sass/18/](http://bkaprt.com/sass/18/)).\n\
    \n*   **Assembling Sass:** Code School’s comprehensive course on learning Sass,\
    \ soup to nuts ([http://bkaprt.com/sass/19/](http://bkaprt.com/sass/19/)).\n\n\
    *   **Getting started with Sass:** Great intro article on A List Apart by David\
    \ Demaree ([http://bkaprt.com/sass/20/](http://bkaprt.com/sass/20/)).\n\n*   **Looking\
    \ into the future of Sass:** David Walsh assesses what’s coming down the pipeline\
    \ for future Sass features. Lots of great insight on where Sass is headed ([http://bkaprt.com/sass/21/](http://bkaprt.com/sass/21/)).\n\
    \n### Mixin libraries\n\n*   **Compass:** An extensive framework for Sass created\
    \ by Chris Eppstein. Even if you’re not using Compass, the documentation is a\
    \ goldmine for mixin ideas ([http://bkaprt.com/sass/22/](http://bkaprt.com/sass/22/)).\n\
    \n*   **Bourbon:** Billing itself as “A simple and lightweight mixin library for\
    \ Sass,” Bourbon offers a ton of great mixin concepts from fellow Bostonians,\
    \ thoughtbot ([http://bkaprt.com/sass/23/](http://bkaprt.com/sass/23/)).\n\n*\
    \   **Handy Sass Mixins:** A nice collection of Sass mixins from Jake Bresnehan\
    \ ([http://bkaprt.com/sass/24/](http://bkaprt.com/sass/24/)).\n\n### More Sass\
    \ and responsive design\n\nIn particular, these two articles on responsive web\
    \ design in Sass and media queries helped me craft Chapter 4 ([http://bkaprt.com/sass/25/](http://bkaprt.com/sass/25/),\
    \ [http://bkaprt.com/sass/26/](http://bkaprt.com/sass/26/)).\n\n*   **Breakpoint:**\
    \ A plugin for Sass that makes writing media queries even simpler ([http://bkaprt.com/sass/27/](http://bkaprt.com/sass/27/)).\n\
    \n*   **Susy:** A helper for Compass and Sass for creating responsive grid systems\
    \ ([http://bkaprt.com/sass/28/](http://bkaprt.com/sass/28/)).\n\n*   **Sassaparilla:**\
    \ A kick-start framework for creating responsive web design projects using Compass\
    \ and Sass. Also has a great name ([http://bkaprt.com/sass/29/](http://bkaprt.com/sass/29/)).\n\
    \n### Sass tools\n\n*   **FireSass for Firebug:** A handy Firefox add-on that\
    \ will display the original Sass filename and line number of Sass-compiled stylesheets,\
    \ for debugging ([http://bkaprt.com/sass/30/](http://bkaprt.com/sass/30/)).\n\n\
    *   **Developing with Sass and Chrome DevTools:** A tutorial on how to best use\
    \ Chrome while developing with Sass. Some of it is experimental, but you can bet\
    \ more of this kind of thing will emerge as Sass continues to gain steam ([http://bkaprt.com/sass/31/](http://bkaprt.com/sass/31/)).\n\
    \n### Other CSS preprocessors\n\nWhile Sass is the subject of this little book,\
    \ it’s not the only CSS preprocessor out there. If you’ve caught the preprocessing\
    \ bug (and I surely hope you have), it might be worth checking out these alternatives—noting\
    \ how they differ from Sass.\n\n#### LESS"
