  trans: "\n在本章中，我将分享许多我在自己的项目每天经常使用的 Sass 功能。我专门为这本书构思了一个虚拟项目，以便我们能够在现实世界的应用场景中讨论\
    \ Sass 的功能。该项目名为 Sasquatch Records——这是一个为唱片公司的简单网站，专注于神话中难以捉摸的野兽超自然音乐风格（**图 3.1**）。\n\
    \n![](img/3-1.gif)\n\n图 3.1：Sasquatch Records，我将用这个虚拟网站展示一些 Sass 示例。\n\nSass 的功能令人惊叹——它是非常强大的工具，可以帮助在创建复杂的样式表时保持理性。由于我们有许多选择，我想指出我认为对\
    \ Web 设计师最有价值且最容易添加到工作流中的 Sass 部分。\n\n## 嵌套规则\n\n在 Sass 中，你可以将 CSS 规则嵌套在彼此内部，而不是在单独的声明中重复选择器。嵌套也反映了标记结构。\n\
    \n例如，Sasquatch Records 头部标记的主要结构如下：\n\n```\n<header role=\"banner\">\n  <div id=\"\
    logo\">\n  <img src=\"logo.png\" alt=\"Sasquatch Records\" />\n  </div>\n\n  <h1>Sasquatch\
    \ Records</h1>\n  ...\n</header>\n```\n\n编写 SCSS 时，我可以镜像这种元素嵌套，让 Sass 构建完整的选择器。我个人喜欢在嵌套选择器之前留一个空行，将它们与具有相同嵌套层级的\
    \ CSS 属性隔离开：\n\n```\nheader[role=\"banner\"] {\n  margin: 20px 0 30px 0;\n  border-bottom:\
    \ 4px solid #333;\n\n  #logo {\n    float: left;\n    margin: 0 20px 0 0;\n\n\
    \    img {\n      display: block;\n      opacity: .95;\n    }\n  }\n\n  h1 {\n\
    \    padding: 15px 0;\n    font-size: 54px;\n    line-height: 1;\n    font-family:\
    \ Jubilat, Georgia, serif;\n    font-weight: bold;\n  }\n}\n```\n\n它将编译为：\n\n\
    ```\nheader[role=\"banner\"] {\n  margin: 20px 0 30px 0;\n  border-bottom: 4px\
    \ solid #333;\n}\nheader[role=\"banner\"] #logo {\n  float: left;\n  margin: 0\
    \ 20px 0 0;\n}\nheader[role=\"banner\"] #logo img {\n  display: block;\n  opacity:\
    \ .95;\n}\nheader[role=\"banner\"] h1 {\n  padding: 15px 0;\n  font-size: 54px;\n\
    \  line-height: 1;\n  font-family: Jubilat, Georgia, serif;\n  font-weight: bold;\n\
    }\n```\n\nSass 不需要在选择器中重复每个元素，而是通过嵌套来显示层级关系从而简化问题。当然，嵌套时要小心。有时你不需要选择器写得那么冗长，过度嵌套实际上会阻可读性。嵌套几层效果非常好，而对于特定模块的声明（如上面的示例），Sass\
    \ 的嵌套可以节省大量时间。\n\n## 嵌套命名空间属性\n\n除了嵌套规则外，你还可以在 Sass 中嵌套共享同一命名空间的属性（例如 `font-family`、`font-size`、`font-weight`\
    \ 等），如下：\n\n```\nheader[role=\"banner\"] h1 {\n  padding: 15px 0;\n  font: {\n\
    \    size: 54px;\n    family: Jubilat, Georgia, serif;\n    weight: bold;\n  }\n\
    \  line-height: 1;\n}\n```\n\n它将编译为：\n\n```\nheader[role=\"banner\"] h1 {\n  padding:\
    \ 15px 0;\n  font-size: 54px;\n  font-family: Jubilat, Georgia, serif;\n  font-weight:\
    \ bold;\n  line-height: 1;\n}\n```\n\n同样，`text-` 命名空间中也有许多属性。我们可以使用 Sass 嵌套来节省重复输入：\n\
    \n```\ntext: {\n  transform: uppercase;\n  decoration: underline;\n  align: center;\n\
    }\n```\n\n`background-` 是另一个很好的例子：\n\n```\nbackground: {\n  color: #ea4c89;\n\
    \  size: 16px 16px;\n  image: url(sasquatch.png);\n  repeat: no-repeat;\n  position:\
    \ top left;\n}\n```\n\n在 Sass 中嵌套意味着更少的输入，使用缩进来反映选择器（以及属性）的形成。对于任何编写 CSS 的人来说，这也是一个容易理解的概念——并不是巨大的思维跨跃。\n\
    \n## 使用 & 引用父选择器\n\n除了嵌套规则和属性外，Sass 还增加了使用符号 `&` 作为特殊占位符来引用当前父选择器的功能。\n\n例如，在链接的声明中，我们可以添加悬停样式来覆盖它们的颜色和边框颜色：\n\
    \n```\na {\n  font-weight: bold;\n  text-decoration: none;\n  color: red;\n  border-bottom:\
    \ 2px solid red;\n\n  &:hover {\n    color: maroon;\n    border-color: maroon;\n\
    \  }\n}\n```\n\n（注：原文中包含多个关于 `&` 示例的重复区块；我在保持技术解释完整的同时处理了核心逻辑。）\n\n## 在 Sass 中注释\n\
    \nSass 支持单行注释和多行注释。多行注释使用标准的 CSS `/* ... */` 语法：\n\n```css\n/* 这是一条多行注释。 */\n\
    ```\n\n通过在注释的第一个字符插入 `!`，你可以确保重要的注释（版权信息、归属、备注等）在压缩样式中出现：\n\n```css\n/*! 这是一条将出现在文件中的多行注释。\
    \ */\n```\n\n单行注释在每行开头使用 `//` 前缀，并且不会包含在最终输出中，因此你可以安全地将其用于私注释：\n\n```\n// 这是一个单行注释。\n\
    // 单行注释会从 css 文件中移除。\n// 所以你可以在这里说你想说的。\n// 坦白：我真的喜欢听 ABBA 的歌。\n// 还有 Hall & Oates。\n\
    ```\n\n## 变量\n\nSass 充满了许多非常有用的功能，让我们作为前端开发者的生活变得更容易。但如果我只能从这些功能中选择一个最有帮助的，那将是变量。\n\
    \n我们在样式表中经常重复某些内容。颜色、字体、图像、宽度等——如果其中任何一个模式发生变化，都需要进行一场查找替换的史诗级斗争。变量让这一切变得简单得多且易于维护。\n\
    \nSass 中的变量定义方式类似于普通的 CSS 规则，使用 `$` 符号如下：\n\n```\n$color-main: #333;\n$color-light:\
    \ #999;\n$color-accent: #ea4c89;\n\n$font-sans: \"Proxima Nova\", \"Helvetica\
    \ Neue\", Helvetica, Arial, sans-serif;\n$font-serif: Jubilat, Georgia, serif;\n\
    ```\n\n一旦定义，就可以在声明中调用：\n\n```\nbody {\n  padding: 0 8%;\n  font-family: $font-sans;\n\
    \  font-size: 100%;\n  color: $color-main;\n  background: #fff url(../img/bg.jpg)\
    \ repeat-x -80% 0;\n}\n```\n\nSass 会在 CSS 输出中将变量替换为它们的值。\n\n"
- fmt: "\n```\nbody {\n  padding: 0 8%;\n  font-family: \"Proxima Nova\", \"Helvetica\
    \ Neue\", Helvetica, Arial, sans-serif;\n  font-size: 100%;\n  color: #333;\n\
    \  background: #fff url(../img/bg.jpg) repeat-x -80% 0;\n}\n```\n\nWith Sass variables,\
    \ wholesale changes to a stylesheet’s repeated patterns are updated in seconds,\
    \ so you don’t need to hunt through the entire file. Hooray!\n\n### Using variables\
    \ for style guides\n\nJina Bolton wrote a great article on how Sass variables\
    \ can help with creating a style guide from a brand palette ([http://bkaprt.com/sass/10/](http://bkaprt.com/sass/10/)).\
    \ Says Jina:\n\n> To keep our style guide relevant, it lives in our internal-only\
    \ admin section on the very same application it describes. We display our color\
    \ palette alongside the relevant Sass variables and since we’ve built the style\
    \ guide into the application using the same front-end, we can use the same variables\
    \ we’re referencing to render this palette. When we change values to these variables,\
    \ the palette updates automatically (Fig 3.2).\n\n![](image/3-2.gif)\n\nFIG 3.2:\
    \ Jina Bolton uses Sass to help create style guides.\n\nRather than creating a\
    \ static style guide that can become outdated and irrelevant, using Sass variables\
    \ to define a brand’s palette means everyone can help keep the style guide up\
    \ to date and maintainable.\n\nUsing the style guide’s variables as a foundation,\
    \ Jina goes on to talk about tapping into Sass’s color functions to create variations\
    \ within the brand palette.\n\nFor example, here’s the tiny color palette for\
    \ the Sasquatch Records site, using single-line comments to note each color since\
    \ it’s not crucial to the CSS output:\n\n```\n$color-main: #333;       // black\n\
    $color-light: #999;      // grey\n$color-accent: #ea4c89;  // pink\n```\n\nNext,\
    \ using the `darken` or `lighten` color function in Sass, we can generate different\
    \ shades of color that will always be based on the brand palette.\n\nLet’s darken\
    \ the pink (`#ea4c89`) by 30%:\n\n```\nsection.secondary {\n  background: darken($color-accent,\
    \ 30%);\n}\n```\n\n![109850.jpg](image/109850.jpg)\n\nWhen compiled, Sass will\
    \ calculate the color by darkening the original pink by 30% and referencing the\
    \ hex color equivalent:\n\n```\nsection.secondary {\n  background: #8d1040;\n\
    }\n```\n\nWe can also lighten colors:\n\n```\nsection.secondary {\n  background:\
    \ lighten($color-accent, 30%);\n}\n```\n\n![109864.jpg](image/109864.jpg)\n\n\
    Which will compile to:\n\n```\nsection.secondary {\n  background: #fad5e3;\n}\n\
    ```\n\n### What about CSS variables?\n\nOne of the terrific things about Sass\
    \ (and CSS preprocessors in general) is that it provides a testing ground for\
    \ features that might join the ranks of a proposed standard. In other words, Sass\
    \ can move at a quicker pace, implementing features that don’t yet exist in the\
    \ CSS spec. If these prove successful enough, they could be folded into the standard.\n\
    \nVariables are a good example of this, and are probably the most used feature\
    \ of CSS preprocessors. The groundswell of support for including variables as\
    \ an official CSS feature has been magnified by the use of Sass and LESS. Currently\
    \ a W3C working draft, “CSS Variables Module Level 1,” is being developed ([http://bkaprt.com/sass/11/](http://bkaprt.com/sass/11/)),\
    \ and the latest WebKit nightly builds have implemented support for variables.\
    \ That means native support for CSS variables is on its way.\n\nUnfortunately,\
    \ at the time of this writing, the CSS variable syntax differs from that of Sass,\
    \ and is not as elegant or simple to grasp. For example, here is how you define\
    \ a CSS variable for the root element of the document:\n\n```\n:root {\n  var-color-main:\
    \ #333;\n}\n```\n\nAnd here is how you would use the variable within a declaration:\n\
    \n```\n#main p {\n  color: var(color-main);\n}\n```\n\nThe proposal uses a `var`\
    \ prefix to define the variable but a `var(variable-name)` syntax for values.\
    \ It’s a bit clumsy and confusing, but this is a work in progress, and many are\
    \ clamoring for the Sass-like `$foo` syntax in both types of use. Here’s hoping\
    \ it eventually works out this way.\n\nMost important, with browser support limited\
    \ to bleeding-edge versions of WebKit, CSS variables aren’t usable in production\
    \ anyway—yet another reason to stick to Sass.\n\n## MIXINS\n\nLet’s move on to\
    \ my second favorite Sass feature: mixins. Where variables let you define and\
    \ reuse values throughout the stylesheet, mixins allow you to define and reuse\
    \ blocks of styles. Rather than typing the same rules over and over again in various\
    \ declarations, you can use mixins to define a group of styles just once and refer\
    \ to it anytime those styles are needed.\n\nTo illustrate, let’s create a mixin\
    \ for a heading style that I’m using in a few areas on the Sasquatch Records site\
    \ (Fig 3.3). While these titles may appear in various locations on the page, their\
    \ CSS is identical, which is a perfect situation for a mixin.\n\n![](image/3-3.gif)\n\
    \nFIG: 3.3: Shared heading styles on the Sasquatch Records site.\n\nFirst, we’ll\
    \ define a mixin in Sass using the `@mixin` directive at the top of the `.scss`\
    \ file. I’ll name it `title-style`, and I’ll define the rules for margins and\
    \ fonts:\n\n```\n@mixin title-style {\n  margin: 0 0 20px 0;\n  font-family: $font-serif;\n\
    \  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n}\n```\n\
    \nOnce it’s defined, we can now refer to this mixin anywhere we’d like to insert\
    \ those styles by using the `@include` directive.\n\nOn the Sasquatch site, we\
    \ have a section of the stylesheet that defines rules for the page’s main section,\
    \ and we want the mixin to style all `<h2>` elements:\n\n```\nsection.main h2\
    \ {\n  @include title-style;\n}\n```\n\nThis will compile to:\n\n```\nsection.main\
    \ h2 {\n  margin: 0 0 20px 0;\n  font-family: Jubilat, Georgia, serif;\n  font-size:\
    \ 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n}\n```\n\nBut we\
    \ also want to style `<h3>` elements in the sidebar. So, later in the stylesheet\
    \ we can call the mixin, which will compile the same:\n\n```\nsection.secondary\
    \ h3 {\n  @include title-style;\n}\n```\n\nMixins can be included with additional\
    \ rules:\n\n```\nsection.secondary h3 {\n  @include title-style;\n  color: #999;\n\
    }\n```\n\nWhich will compile to:\n\n```\nsection.secondary h3 {\n  margin: 0 0\
    \ 20px 0;\n  font-family: Jubilat, Georgia, serif;\n  font-size: 20px;\n  font-weight:\
    \ bold;\n  text-transform: uppercase;\n  color: #999;\n}\n```\n\nShared styles\
    \ can be abstracted into mixins, and you’ll still have the ability to override\
    \ or augment those styles with additional rules. Powerful stuff!\n\n### Mixin\
    \ arguments\n\nSass mixins can also take arguments that we pass to the mixin when\
    \ we call it. For example, let’s add an argument for specifying a color along\
    \ with our `title-style` mixin.\n\nSpecify arguments with variables inside parentheses\
    \ when defining the mixin:\n\n```\n@mixin title-style($color) {\n  margin: 0 0\
    \ 20px 0;\n  font-family: $font-serif;\n  font-size: 20px;\n  font-weight: bold;\n\
    \  text-transform: uppercase;\n  color: $color;\n}\n```\n\nWhen calling the mixin,\
    \ we can now pass a color to it (here a lovely burnt orange), along with the other\
    \ rules:\n\n```\nsection.main h2 {\n  @include title-style(#c63);\n}\n```\n\n\
    Which will compile to:\n\n```\nsection.main h2 {\n  margin: 0 0 20px 0;\n  font-family:\
    \ Jubilat, Georgia, serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform:\
    \ uppercase;\n  color: #c63;\n}\n```\n\n#### Multiple arguments\n\nYou can pass\
    \ multiple arguments by separating the values with commas in the mixin definition:\n\
    \n```\n@mixin title-style($color, $background) {\n  margin: 0 0 20px 0;\n  font-family:\
    \ $font-serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n\
    \  color: $color;\n  background: $background;\n}\n```\n\nAnd here’s the mixin\
    \ being called from two different selectors, passing differing arguments for color\
    \ and background:\n"
