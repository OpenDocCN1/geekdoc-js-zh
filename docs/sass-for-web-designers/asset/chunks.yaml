    \ $color;\n}\n@mixin shadow-inset($x, $y, $blur, $color) {\n  -webkit-box-shadow:\
    \ inset $x $y $blur $color;\n     -moz-box-shadow: inset $x $y $blur $color;\n\
    \          box-shadow: inset $x $y $blur $color;\n}\n@mixin transition($property)\
    \ {\n  -webkit-transition: $property .2s ease;\n     -moz-transition: $property\
    \ .2s ease;\n       -o-transition: $property .2s ease;\n          transition:\
    \ $property .2s ease;\n}\n@mixin box-sizing {\n  -webkit-box-sizing: border-box;\n\
    \     -moz-box-sizing: border-box;\n          box-sizing: border-box;\n}\n@mixin\
    \ linear-gradient($from, $to) {\n  /* Fallback for sad browsers */\n  background-color:\
    \ $to;\n  /* Mozilla Firefox */\n  background-image:-moz-linear-gradient($from,\
    \ $to);\n  /* Opera */\n  background-image:-o-linear-gradient($from, $to);\n \
    \ /* WebKit (Chrome 11+) */\n  background-image:-webkit-gradient(linear, left\
    \ top, left bottom, color-stop(0, $from), color-stop(1, $to));\n  /* WebKit (Safari\
    \ 5.1+, Chrome 10+) */\n  background-image: -webkit-linear-gradient($from, $to);\n\
    \  /* IE10 */\n  background-image: -ms-linear-gradient($from, $to);\n  /* W3C\
    \ */\n  background-image: linear-gradient($from, $to);\n}\n```\n\n在我的主样式表（在本例中为\
    \ `screen.scss`）顶部，我定义了所有的布局和其他网站特定的样式，我使用 `@import` 规则将它们拉进来，以便 mixins 可用。我还导入了一个每个项目中都复用的重置样式表（再次节省了\
    \ HTTP 连接并避免了复制粘贴相同的代码），以及一个存放了网站颜色、字体等变量的变量文件（**图 3.6**）。这允许我在其他样式表中导入这些相同的变量——例如，在同一个项目中应用样式指南的其他页面或部分——而无需同时导入剩余的布局。\n\
    \n![](img/3-6.gif)\n\n图 3.6：使用 @import 将分块合并为一个文件。\n\n```scss\n // 导入其他文件\n\n\
    @import \"reset.scss\";\n@import \"variables.scss\";\n@import \"mixins.scss\"\
    ;\n\n// 网站特定样式\n\n.foo {\n  ...\n}\n```\n\n### Compass 框架\n\n我总是建议创建你自己的框架，因为尽可能了解你的代码中发生了什么是最好的。但作为一种学习体验，其他框架可能非常有益——它们能让你看到别人是如何构建项目并提高效率的。Compass\
    \ 也不例外。\n\n### Bourbon 库\n\n设计/开发公司 thoughtbot 的伙伴们汇集了一个丰富的 mixin 库，称为 Bourbon——巧合的是，我也一直在喝过这种酒，加了苦味酒、苦味精、捣碎的糖和水果（**图\
    \ 3.8**）。\n\n稍手搜一下 Google 就能发现许多非常有用的 Sass 使用者在 GitHub 或他们自己的网站上分享他们的 mixins。很有可能，那个看起来很丑且难以维护的\
    \ CSS3 堆栈已经有人为它写好了 mixin，所以请利用好社区的力量吧！\n\n### @extend\n\n你是否曾发现自己正在编写一个 CSS 类，它与另一个类具有相同的样式，除了少数其他规则外？\n\
    \n这是一个示例。你在页面顶部有一个有两个选项的警报消息样式。一种样式处理标准警报（图 3.9），而另一种样式处理正向警报（图 3.10）。这些样式几乎相同，只有背景颜色不同。\n\
    \n通常，我们可能会为普通警报创建一个基础类，然后创建另一个仅覆盖背景颜色的类。\n\n"
- fmt: "\n```\n<h2 class=\"alert alert-positive\">This is a positive alert!</h2>\n\
    ```\n\nWith the styles for each alert set up like so:\n\n```css\n.alert {\n  padding:\
    \ 15px;\n  font-size: 1.2em;\n  font-weight: normal;\n  text-transform: uppercase;\n\
    \  line-height: 1;\n  letter-spacing: 3px;\n  text-align: center;\n  color: #fff;\n\
    \  background: $color-accent;\n  @include shadow(0, 1px, 2px, rgba(0,0,0,.5));\n\
    \  @include rounded(10px);\n}\n.alert-positive {\n  background: #9c3;\n}\n```\n\
    \nInstead of littering the markup with extra classes to handle those small exceptions,\
    \ we can use Sass’s `@extend` function to “chain together” styles that are shared\
    \ amongst multiple selectors. Additionally, we can then add extra overriding rules\
    \ to make a new unique style without duplicating the shared styles.\n\nSo if we\
    \ wanted to use `@extend` to handle the two types of alert messages, we could\
    \ simplify the markup to just one class:\n\n```html\n<h2 class=\"alert-positive\"\
    >This is a positive alert!</h2>\n```\n\nThen use `@extend` to include the styles\
    \ from the `h2.alert` class, plus the `background-color` exception:\n\n```css\n\
    .alert-positive {\n  @extend .alert;\n  background: #9c3;\n}\n```\n\nSass will\
    \ then efficiently compile the extended class like this:\n\n```css\n.alert, .alert-positive\
    \ {\n  padding: 15px;\n  font-size: 1.2em;\n  font-weight: normal;\n  text-transform:\
    \ uppercase;\n  line-height: 1;\n  letter-spacing: 3px;\n  text-align: center;\n\
    \  color: #fff;\n  background: #ea4c89;\n       -webkit-box-shadow: 0 1px 2px\
    \ rgba(0, 0, 0, 0.5);\n       moz-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n\
    \       box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n    -webkit-border-radius:\
    \ 10px;\n       -moz-border-radius: 10px;\n       border-radius: 10px;\n}\n.alert-positive\
    \ {\n  background: #9c3;\n}\n```\n\nNow, sure, we could’ve written our CSS this\
    \ way from the beginning, but the `@extend` syntax makes it faster—not to mention\
    \ it’s clearer which styles are shared between classes. It’s far easier to wrap\
    \ your head around what’s happening.\n\nUsing `@extend` also allows us to be terser\
    \ in our semantics, defining class names based on meaning rather than appearance.\n\
    \n### Multiple @extends\n\nYou can also `@extend` multiple classes within a declaration,\
    \ which chains together all the styles from each class:\n\n```css\n.alert {\n\
    \  padding: 15px;\n  font-size: 1.2em;\n  text-align: center;\n  background: $color-accent;\n\
    }\n.important {\n  font-size: 4em;\n}\n.alert-positive {\n  @extend .alert;\n\
    \  @extend .important;\n  background: #9c3;\n}\n```\n\nWhich will compile to:\n\
    \n```css\n.alert, alert-positive {\n  padding: 15px;\n  font-size: 1.2em;\n  text-align:\
    \ center;\n  background: #ea4c89;\n}\n.important, .alert-positive {\n  font-size:\
    \ 4em;\n}\n.alert-positive {\n  background: #9c3;\n}\n```\n\nAgain, Sass efficiently\
    \ organizes things, grouping the shared styles together using comma-separated\
    \ selectors and then creating single declarations for any exceptions.\n\n### Using\
    \ placeholder selectors with @extend\n\nWhat if the class you’re extending exists\
    \ solely for the purpose of extending other styles? In other words, you might\
    \ create a class that’s not used on its own.\n\nEnter placeholder selectors, which\
    \ allow you to define “phantom” classes that won’t appear in the outputted CSS\
    \ on their own. You can reference placeholders using `@extend`.\n\nLet’s take\
    \ a look at this in practice. We’ll create a class for a block of styles that\
    \ define a button. We’ll use a placeholder selector, which in Sass means prefixing\
    \ the class name with a `%` instead of a period.\n\n```css\n%button {\n  padding:\
    \ 10px;\n  font-weight: bold;\n  background: blue;\n  border-radius: 6px;\n}\n\
    ```\n\nWe can call this rule set in other classes as we did previously, using\
    \ `@extend`.\n\n```css\n.buy {\n  @extend %button;\n}\n.submit {\n  @extend %button;\n\
    \  background: green;\n}\n```\n\nSass will compile this like an extended class,\
    \ but the `%button` placeholder rule set won’t appear in the output:\n\n```css\n\
    .buy, .submit {\n  padding: 10px;\n  font-weight: bold;\n  background: blue;\n\
    \  border-radius: 6px;\n}\n.submit {\n  background: green;\n}\n```\n"
  raw: "```\n <h2 class=\"alert alert-positive\">This is a positive alert!</h2>\n\
    ```\n\nWith the styles for each alert set up like so:\n\n```\n.alert {\n  padding:\
    \ 15px;\n  font-size: 1.2em;\n  font-weight: normal;\n  text-transform: uppercase;\n\
    \  line-height: 1;\n  letter-spacing: 3px;\n  text-align: center;\n  color: #fff;\n\
    \  background: $color-accent;\n  @include shadow(0, 1px, 2px, rgba(0,0,0,.5));\n\
    \  @include rounded(10px);\n}\n.alert-positive {\n  background: #9c3;\n}\n```\n\
    \nInstead of littering the markup with extra classes to handle those small exceptions,\
    \ we can use Sass’s `@extend` function to “chain together” styles that are shared\
    \ amongst multiple selectors. Additionally, we can then add extra overriding rules\
    \ to make a new unique style without duplicating the shared styles.\n\nSo if we\
    \ wanted to use `@extend` to handle the two types of alert messages, we could\
    \ simplify the markup to just one class:\n\n```\n<h2 class=\"alert-positive\"\
    >This is a positive alert!</h2>\n```\n\nThen use `@extend` to include the styles\
    \ from the `h2.alert` class, plus the `background-color` exception:\n\n```\n.alert-positive\
    \ {\n  @extend .alert;\n  background: #9c3;\n}\n```\n\nSass will then efficiently\
    \ compile the extended class like this:\n\n```\n.alert, .alert-positive {\n  padding:\
    \ 15px;\n  font-size: 1.2em;\n  font-weight: normal;\n  text-transform: uppercase;\n\
    \  line-height: 1;\n  letter-spacing: 3px;\n  text-align: center;\n  color: #fff;\n\
    \  background: #ea4c89;\n       -webkit-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n\
    \           moz-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n               box-shadow:\
    \ 0 1px 2px rgba(0, 0, 0, 0.5);\n    -webkit-border-radius: 10px;\n       -moz-border-radius:\
    \ 10px;\n            border-radius: 10px;\n}\n.alert-positive {\n  background:\
    \ #9c3;\n}\n```\n\nNow, sure, we could’ve written our CSS this way from the beginning,\
    \ but the `@extend` syntax makes it faster—not to mention it’s clearer which styles\
    \ are shared between classes. It’s far easier to wrap your head around what’s\
    \ happening.\n\nUsing `@extend` also allows us to be terser in our semantics,\
    \ defining class names based on meaning rather than appearance.\n\n### Multiple\
    \ @extends\n\nYou can also `@extend` multiple classes within a declaration, which\
    \ chains together all the styles from each class:\n\n```\n.alert {\n  padding:\
    \ 15px;\n  font-size: 1.2em;\n  text-align: center;\n  background: $color-accent;\n\
    }\n.important {\n  font-size: 4em;\n}\n.alert-positive {\n  @extend .alert;\n\
    \  @extend .important;\n  background: #9c3;\n}\n```\n\nWhich will compile to:\n\
    \n```\n.alert, alert-positive {\n  padding: 15px;\n  font-size: 1.2em;\n  text-align:\
    \ center;\n  background: #ea4c89;\n}\n.important, .alert-positive {\n  font-size:\
    \ 4em;\n}\n.alert-positive {\n  background: #9c3;\n}\n```\n\nAgain, Sass efficiently\
    \ organizes things, grouping the shared styles together using comma-separated\
    \ selectors and then creating single declarations for any exceptions.\n\n### Using\
    \ placeholder selectors with @extend\n\nWhat if the class you’re extending exists\
    \ solely for the purpose of extending other styles? In other words, you might\
    \ create a class that’s not used on its own.\n\nEnter placeholder selectors, which\
    \ allow you to define “phantom” classes that won’t appear in the outputted CSS\
    \ on their own. You can reference placeholders using `@extend`.\n\nLet’s take\
    \ a look at this in practice. We’ll create a class for a block of styles that\
    \ define a button. We’ll use a placeholder selector, which in Sass means prefixing\
    \ the class name with a `%` instead of a period.\n\n```\n%button {\n  padding:\
    \ 10px;\n  font-weight: bold;\n  background: blue;\n  border-radius: 6px;\n}\n\
    ```\n\nWe can call this rule set in other classes as we did previously, using\
    \ `@extend`.\n\n```\n.buy {\n  @extend %button;\n}\n.submit {\n  @extend %button;\n\
    \  background: green;\n}\n```\n\nSass will compile this like an extended class,\
    \ but the `%button` placeholder rule set won’t appear in the output:\n\n```\n\
    .buy, .submit {\n  padding: 10px;\n  font-weight: bold;\n  background: blue;\n\
    \  border-radius: 6px;\n}\n.submit {\n  background: green;\n}\n```\n\nPlaceholder\
    \ selectors are especially helpful in creating blocks of styles for design patterns\
    \ that may or may not be used (in frameworks, style guides, or starter templates,\
    \ for example), since unused placeholder classes won’t litter the compiled stylesheet.\n\
    \n### @extend versus @mixin\n\nWhere a mixin will write the same rules in each\
    \ declaration it’s called from, `@extend` will create multiple, comma-separated\
    \ selectors for shared styles. It’s good to keep that difference in mind when\
    \ you’re debating which to use.\n\nFor example, overuse of a mixin can result\
    \ in a bloated CSS file in which the contents of the mixin are present in the\
    \ compiled CSS every time it’s called in Sass. If you find yourself using a mixin\
    \ over and over throughout the stylesheet, keep in mind how that will compile,\
    \ and consider whether it makes sense to use `@extend` or turn those repeated\
    \ styles into a class that gets reused in the markup instead.\n\n### Don’t over\
    \ @extend yourself\n\nUsing `@extend` is a powerful way to share styles between\
    \ classes, but be careful; when used too much, the compiled CSS starts to get\
    \ a bit hairy. Extending the same class repeatedly throughout the stylesheet can\
    \ result in a monster declaration. When using Sass, it’s easy to forget what the\
    \ compiled stylesheet will ultimately look like—make sure to keep tabs on how\
    \ Sass outputs your work.\n\nOkay. You now have the power! We’ve covered the basics\
    \ of Sass: how to set it up, how the syntax works, how it can fit neatly beside\
    \ your current coding habits, and how to use the core features through nesting,\
    \ variables, mixins, and `@extend`.\n\nSass is capable of even more, if you want\
    \ to dive deeper. In the next chapter, we’re going to talk about how Sass can\
    \ help with responsive design and media queries. Let’s take the plunge.\n\n![Chapter\
    \ 4: Sass and Media Queries](image/ch04.gif)\n\nI WANTED THE main focus of this\
    \ book to be the basics of Sass, proving that Sass doesn’t have to mean ripping\
    \ apart your workflow. But in this final chapter, I do want to talk about some\
    \ advanced techniques with Sass and media queries that have greatly simplified\
    \ some otherwise complex CSS in my daily work.\n\nSass is as powerful as you want\
    \ it to be. Using it for variables and a few mixins will make your life easier.\
    \ But it can go beyond that if you want it to. I’d like to share how I’ve used\
    \ Sass to build responsive, HiDPI-capable projects, and how it once again makes\
    \ the heavy lifting quite manageable.\n\n## NESTED MEDIA QUERIES\n\nOne of the\
    \ foundations of building responsive websites is the CSS media query. The ability\
    \ to “listen” to the browser’s viewport for varying dimensions and then apply\
    \ certain styles based on those dimensions is the cornerstone of creating flexible\
    \ layouts that adapt to different devices.\n\nFor instance, you may want to adjust\
    \ the width of a containing element should the browser be less than 800 pixels\
    \ wide, using a media query:\n\n```\nsection.main {\n  float: left;\n  width:\
    \ 65%;\n  font-size: 16px;\n  line-height: 1.4;\n}\n@media screen and (max-width:\
    \ 800px) {\n  section.main {\n    float: none;\n    width: auto;\n  }\n}\n```\n\
    \nIn Sass, you can nest media queries inside the original declaration, and they\
    \ will “bubble up” into their own separate declarations when the stylesheet is\
    \ compiled. It’s wonderful.\n\n```\nsection.main {\n  float: left;\n  width: 65%;\n\
    \  font-size: 16px;\n  line-height: 1.4;\n\n  @media screen and (max-width: 800px)\
    \ {\n    float: none;\n    width: auto;\n  }\n\n  @media screen and (max-width:\
    \ 500px) {\n    font-size: 12px;\n    line-height: 1.4;\n  }\n}\n```\n\nThe above\
    \ will compile to:\n\n```\nsection.main {\n  float: left;\n  width: 65%;\n  font-size:\
    \ 16px;\n  line-height: 1.4;\n}\n@media screen and (max-width: 800px) {\n  section.main\
    \ {\n    float: none;\n    width: auto;\n  }\n}\n@media screen and (max-width:\
    \ 500px) {\n  section.main {\n    font-size: 12px;\n    line-height: 1.4;\n  }\n\
    }\n```"
