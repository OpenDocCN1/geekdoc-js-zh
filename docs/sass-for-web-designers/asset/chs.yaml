  \n`Dan Cederholm` 是一位住在马萨诸塞州萨勒姆的设计师、作者和演讲者。他是设计师社区 `Dribbble` 的联合创始人，也是微型设计工作室 `SimpleBits`\
  \ 的创始人。作为基于标准的 Web 设计长期倡者，Dan 曾与 `YouTube`、`Microsoft`、`Google`、`MTV`、`ESPN` 等机构合作。他写过几本关于\
  \ Web 设计的热门书籍，并于 2012 年初获得 `TechFellow` 奖。他目前是一名有抱的爪 banjo 琴演奏手，偶尔会戴棒球帽。\n\n"
