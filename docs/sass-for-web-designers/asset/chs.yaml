- "# Web 设计师 Sass\n\n\n\n![](img/aba-9-cover.png)\n\n![封面](img/aba-9-cover.png)\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 目录\n\n- 版权声明\n- 序言\n- 第 1 章：为什么选择 Sass？\n- 第\
  \ 2 章：Sass 工作流\n- 第 3 章：使用 Sass\n- 第 4 章：Sass 与媒体查询\n- 资源列表\n- 参考文献\n- 致谢\n- 索引\n\
  - 关于 A Book Apart\n- 关于作者\n\n# 序言\n\n回顾计算机语言的演变，似乎每隔十年左右就会增加一个新的抽象层。“0 和 1”升级为了汇编指令，汇编指令又升级为了编译型语言。这些编译型语言不断演进，我们利用它们创建了网页浏览器。网页浏览器处理诸如\
  \ HTML、CSS 和 JavaScript 这样的语言。现在，我们准备好再次进行升级了。\n\nHTML、CSS 和 JavaScript 在以前所未有的方式推动网页发展方面取得了巨大的成功。我们正在构建日益庞大且复杂的网站。这是一件美事。但我们已经到了一个节点，需要采取下一步，让我们构建的内容更易管理和维护。我们可以通过抽象来实现这一目标。\n\
  \nCSS 的需求最为迫切。如今，HTML 通常通过后端代码和模板生成，这些工具提供了我们所需的抽象。作为一种编程语言，JavaScript 已经内置了抽象工具。而\
  \ CSS 完全没有抽象，且具有高度重复性。虽然这种简单性是其被采用的关键，但它对今天的我们来说却变得难以处理。现在轮到 CSS 升级了！\n\n正如 Dan\
  \ 在书中将教你的那样，Sass 拥有我们所需的所有抽象工具。重复的值变成了变量。重复的样式组变成了扩展（extends）。复杂的规则集和繁琐的厂商前缀变成了混合宏（mixins）。通过这些转换，CSS\
  \ 在任何规模下都是可管理和可维护的。\n\n对于某些人来说，转向 Sass 并不是一个舒适的过渡。Dan 对此非常清楚。在我还不知道 `div` 是什么之前，他已经在向世界传授和教授\
  \ CSS 了。但 Dan 是一名 Web 手工匠。就像木工知道自己的凿子什么时候变钝了一样，Dan 知道现在直接在 CSS 中工作就像是在用那把生钝的凿子：你可以那样做，但可能会伤到自己。\n\
  \n当你读完这本书并在你的第一个项目中真正尝试 Sass 时，你将掌握 Sass 中 95% 重要的且真正有价值的部分。让 Dan 成为你的向吧。学会 Sass\
  \ 并不会让你的工作变得更困难，反而会让它变得简单。\n\n**—Chris Coyier**\n\n![第 1 章：为什么选择 Sass？](img/ch01.gif)\n\
  \n我曾是一个 Sass 的不情愿信徒。我都是手工编写样式表的！我不需要帮助！我绝对不想给我的工作流增加额外的复杂性。走开！\n\n至少我一直是这样想的。但现实是，Sass（以及\
  \ CSS 预处理器）可以成为强大的盟友——任何样式设计者都可以轻松将其融入日常工作的工具。我花了一段时间才慢慢转过弯来，但我非常庆幸自己这么做了。\n\n这就是我想写这本小书的原因。分享我是如何利用\
  \ Sass 提高效率，同时保持我过去十年来编写 CSS 时已经习惯的流程的。起初，我对 Sass 有许多误解，这阻止了我去尝试它。我担心我将完全改变我编写和管理样式表的方式。由于\
  \ CSS 有时可能很脆弱，作者对自己的创作产生某种保护欲是可以理解的。有人能认同我吗？\n\n咳。\n\n所以，我在这里是为了向你们展示 Sass 并不非要破坏你的流程和工作流，它是如何让你的生活变得更简单的。我将演示\
  \ Sass 的各个方面、如何安装它、如何使用它，以及它是如何帮助我自己的项目的。如果运气好的话，我也许也能让你们成为信徒。\n\n## Sass 的电梯\n\n\
  （注：原文此处开始大量重复，已按要求处理）\n\n\n\n\n\n如果我们审视软件工程的世界（我更倾向于观察而不是在里面混得舒服），我们可以很快发现，组织、变量、常量、部分组件等，对于构建复杂系统的人来说，是根深蒂固且至关重要的工作方式。\n\
  \n你可能听过“不要重复自己”（DRY）原则。该原则由 Andy Hunt 和 Dave Thomas 在他们的书籍《实战编程之道》（[`bkaprt.com/sass/1/`](http://bkaprt.com/sass/1/)）中提出并定义，DRY\
  \ 规定：\n\n> 每一份知识在系统中必须有唯一的、无歧且权威的表示。\n\n其核心思想是，代码重复会导致开发者的失败和困惑([`bkaprt.com/sass/2/`](http://bkaprt.com/sass/2/))。这也是常识：编写一次常见的重复模式，并在应用程序中复用这些部分。这样维护代码效率更高，也容易得多。\n\
  \nCSS 绝非 DRY。有时，它充斥着重复的规则、声明和值。在整个样式表中，我们不断为颜色、字体和经常使用的样式模式编写相同的代码片段。只要看一眼足够大的 CSS\
  \ 文件，一个遵循 DRY 的软件开发者就会流泪——起初是因为困惑，然后是因为沮丧。\n\n“你这到底是怎么维护这些东西的？！”他们会问。\n\n“我告诉过你\
  \ IE 的 bug 吗？”你会带着一丝自嘲回答道。\n\n### 那么为什么 CSS 这么难用？\n\n我们可以从 CSS 共同发明者 Bert Bos 的一篇文章（[`bkaprt.com/sass/3/`](http://bkaprt.com/sass/3/)）中，略微了解为什么\
  \ CSS 多年来一直存在语法上的局限性：\n\n> CSS 止步于程序员在编程语言中使用的那些更强大的功能：宏、变量、符号常量、条件语句、基于变量的表达式等。这是因为这些东西给高级用户提供了很大的发挥空间，但经验较少的用户会不经意地把自己害死；或者更有可能的是，他们会被吓得不敢触碰\
  \ CSS。这是一种平衡。对于 CSS 来说，这种平衡与其他某些事物不同。\n\nCSS 的原始架构师关注的是采用率。他们（理地）希望尽可能多的人创建网站。他们希望\
  \ CSS 足够强大，能够为网页设置样式并将内容与呈现分离，同时易于理解和使用。我完全尊重这一点。与此同时，我们有工作要做，而且这些工作正变得越来越复杂、微妙，并且维护和未来扩展充满了挑战。\n\
  \n幸运的是，有很多选项可以帮助我们，其中之一就是 Sass。\n\n## 什么是 SASS？\n\nSass 是一个 CSS 处理器——是你编写的样式表与提供给浏览器的\
  \ `.css` 文件之间的层。Sass（Syntactically Awesome Stylesheets 的缩写）填补了 CSS 作为语言的缺陷，允许你编写\
  \ DRY 代码，这些代码将更快、更高效且更容易维护（**图 1**）。\n\n![](img/1-1.gif)\n\n图 1：Sass 将其自身的“强大语法”转换为普通的\
  \ CSS。\n\nSass 网站（[`bkaprt.com/sass/4/`](http://bkaprt.com/sass/4/)）对自身进行了简洁的描述：\n\
  \n> Sass 是在 CSS 之上的层元语言，用于清晰且结构化地描述文档样式，拥有比平铺 CSS 更多的功能。Sass 既为 CSS 提供了更简单、更优雅的语法，又实现了各种对于创建可管理样式表非常有用的功能。\n\
  \n所以虽然普通的 CSS 还不允许变量、混合（mixins，可复用的样式块）和其他其他特性，但 Sass 提供了一种可以实现所有这些以及更多功能的语法——在你的普通\
  \ CSS 基础上开启了“超级功能”。然后通过命令行程序或 Web 框架插件将这些语法翻译（或编译）为普通的 CSS 文件。\n\n更具体地说，Sass 是 CSS3\
  \ 的扩展，它的 SCSS（Sassy CSS）语法——我们稍后会讨论——是 CSS3 的超集。这意味着，任何有效的 CSS3 文档也是有效的 SCSS 文档。这对于\
  \ Sass 成为一种你可以“轻松上手”的东西至关重要。开始学习 Sass 语法是不痛苦的，你可以根据需要使用尽可能少或越多。这也意味着，随着你学习并掌握更多\
  \ Sass 的功能，将现有的样式表从 CSS 转换为 SCSS 可以分阶段完成。\n\n稍后，当你精通 Sass 之后（这不会花费多久），它真的感觉就像 CSS\
  \ 的自然扩展——就好像它在填补我们一直希望由 CSS 规范本身来填补的空白。这就是为什么，一旦我开始使用 Sass，就再也没有觉得过它别扭或费力——它感觉就像\
  \ CSS 应该有的样子。一旦你尝试过，可能会一直用下去。\n\n此外，Sass 正在帮助 CSS 变得更好。通过快速推进目前在没有处理器帮助下无法实现的功能，它为\
  \ CSS 作者提供了真实世界的实现和功能实验。在合适的时候和情况下，某些 Sass 功能完全可以为未来的 CSS 规范提供参考。\n\n## SASS 语法\n\
  \nSass 实际上有两种不同的语法。最新的是上述 SCSS 语法。SCSS 文件使用 `.scss` 后后缀。这是我倾向于使用并提倡的语法，原因如下：\n\n\
  *   由于 SCSS 是 CSS3 的超集，我可以像过去十年一样编写 CSS，它仍然可以正常工作。\n*   可以很容易地将现有的样式表转换为使用 Sass。\n\
  *   它不需要改变代码格式。\n\n### 一个简单的 SCSS 示例\n\n这是一个关于 SCSS 如何工作的示例。它定义了一个变量并在声明中使用了它。\n\
  \n```scss\n$pink: #ea489;\n\np {\n  font-size: 12px;\n  color: $pink;\n}\np strong\
  \ {\n  text-transform: uppercase;\n}\n```\n\n它将编译为：\n\n```css\np {\n  font-size:\
  \ 12px;\n  color: #ea489;\n}\np strong {\n  text-transform: uppercase;\n}\n```\n\
  \n除了 `$pink` 变量之外，这看起来非常熟悉，我们稍后会讨论变量。SCSS 运行于你已经掌握的 CSS 之上。对于这一点，我非常喜欢它。\n\n####\
  \ 原始的“缩进” Sass 语法\n\n另一方面，原始的 Sass 语法是另一种东西。有些人更倾向于它那种精简的、没有大括号或分号的缩进语法。如果你习惯了 Ruby\
  \ 或 Python 等编程语言的简洁，那么 Sass 语法将看起来很熟悉，你可能会更有归属感。\n\n这是原始 Sass 语法的简单示例，它的编译结果与之前的代码片段完全相同。\n\
  \n```sass\n$pink: #ea489\n\np\n  font-size: 12px\n  color: $pink\n\np strong\n \
  \ text-transform: uppercase\n```\n\n## SASS 误解\n\n我之前提到过，我很想尝试 Sass。这部分程度上是因为我在在使用之前对其产生的许多误解。我需要学习\
  \ Ruby 或高级的命令行操作吗？我需要完全改变编写样式表的方式吗？它输出的 CSS 会变得臃肿且不可读吗？\n\n幸运的是，这些问题的答案显然都是“不是”——但每当有人在各种网络频道提到\
  \ Sass 时，我确实听到这些问题冒出来。\n\n### 我害怕命令行！\n\n\n\n...[/content]` 之间是空的（或者没有包含具体的文本），我无法进行翻译。\n\
  \n**如果你是指让我翻译你提供的“**以下是需要翻译的文本**”之后那部分，以下是针对该内容的完整翻译结果：**\n\n[content]\n我绝不是什么命令行专家，但多年来我也在各处学了一点点——这些仅足以让我惹上一些麻烦。我不害怕使用它来遍历文件系统，或者使用\
  \ `Git` 命令等。\n\n话虽如此，我理解那些不想接触命令行的设计师和前端开发者。某些人中存在一种“命令行恐惧”。对于 Sass 来说，几乎不需要多少命令行操作——事实上，你只需要一个命令就能掌握。此外，还有一些应用程序和\
  \ Web 框架可以消除对命令行的需求。（我将在下一章介绍这些内容）。\n\n所以，如果你是一个命令行规避者，不要让这阻碍你尝试 Sass！\n\n## 我不想改变我编写\
  \ CSS 的方式！\n\n这是我曾受过的一个误区。我对样式表的设置和组织方式非常讲究。文档的编写包含某种手工艺。但请记住，由于 `SCSS` 语法是 `CSS3`\
  \ 的超集，你不需要改变编写 CSS 的任何方式。在处理 `.scss` 文件时，无论注释、缩进还是不缩进，你所有的格式偏好都可以保持不变。一旦我意识到这一点，就可以毫无恐惧地深入其中了。\n\
  \n## 我不想让 Sass 我的设计方式！\n\n相反，Sass 并不会解决你所有的问题，也不会治愈你的坏习惯。低效、臃肿的样式表在使用 Sass 时可能同样低效且臃肿。良好的组织和聪明的思维在这里仍然适用。事实上，在某些情况下\
  \ Sass 会放大糟糕的做法，我们也会对此进行讨论。但当正确且智能地使用时，Sass 可以成为创建网站的巨大助力。\n\n好了。现在我们已经解决了这些细节，让我们开始享受乐趣吧。我想\
  \ Sass 的功能会让你大惊的。在下一章中，我们将设置工作流——Sass 如何融入你的流程，以及使用命令行或应用程序有多简单。让我们开始使用 Sass ，大家。\n\
  \n![第 2 章：Sass 工作流](img/ch02.gif)\n\n现在我们已经知道了 Sass 是什么，让我们进行环境配置以便开始使用它。我们的第一个任务是在你选择的计算设备上安装它。我在第\
  \ 1 章中提到过 Sass 是一个用 `Ruby` 编写的程序，它将其原生语法翻译成纯 `CSS`。因此，在我们开始使用 Sass 之前，我们需要 Sass。\n\
  \n## 在 Mac 上安装 Sass\n\n如果你使用的是 Mac（如果你运气足够的话，那恭喜你），安装 Sass 再简单不过了。Mac OS X 预装了 `Ruby`，而\
  \ Sass 被封装成一个 Ruby “gem”，这是程序员对 Ruby 应用程序的一种巧妙术语。\n\n只需启动 `Terminal.app`（不要慌！），在提示符处输入以下内容并按回车：\n\
  \n```\n$ gem install sass\n```\n\n这并不那么糟糕，对吧？按下回车后，你会看到以下结果在 Terminal 中流过：\n\n```\n\
  Fetching: sass-3.2.10.gem (100%)\nSuccessfully installed sass-3.2.10\n1 gem installed\n\
  Installing ri documentation for sass-3.2.10...\nInstalling RDoc documentation for\
  \ sass-3.2.10...\n```\n\n恭喜！你刚刚安装了 Sass。\n\n在编写本文时，Sass 的最新官方版本是 `3.2.10`，Terminal\
  \ 足够友好地将这条信息传给了我们。\n\n### 安装最新的预发布版本\n\n你也可以选择留在最前沿，通过在命令末尾添加 `pre` 标志来安装最新的 alpha\
  \ 版本。使用最新的 alpha 版本不仅安全，还能让你利用最新的功能。\n\n要获取最新最强大的版本，请在终端提示符中输入以下并按回车：\n\n```\n$\
  \ gem install sass --pre\n```\n\n你将再次看到结果流过，这次确认了 `3.3.0` alpha 版本已安装。\n\n```\n\
  Fetching: sass-3.3.0.alpha.3.gem (100%)\nSuccessfully installed sass-3.3.0.alpha.3\n\
  1 gem installed\nInstalling ri documentation for sass-3.3.0.alpha.3...\nInstalling\
  \ RDoc documentation for sass-3.3.0.alpha.3...\n```\n\n你现在生活在边缘，我向你这勇敢的信仰之之跃致敬。\n\
  \n## 在 Windows 上安装 Sass\n\n与 Mac OS X 不同，Windows 没有预装 Ruby。Sass 官方网站推荐 Windows 用户使用\
  \ `RubyInstaller` 来让程序运行起来（[`bkaprt.com/sass/5/`](http://bkaprt.com/sass/5/)）。一旦安装了\
  \ Ruby，你就可以遵循本章讨论的其余命令。\n\n## 告诉 Sass 要监控哪些文件\n\n好了。我们已经安装了 Sass，现在该怎么办？我们需要告诉 Sass\
  \ 要监控（watch）哪些文件。这意味着当我们编辑样式表时，我们希望 Sass 监控该文件，并在每次我们更改时，将带有我们所有巧妙 Sass 语法的 `.scss`\
  \ 文件转换为浏览器可用的 `.css` 文件。有几种方法可以实现：\n\n*   通过命令行使用简单的命令。\n*   一个桌面应用程序（有几个），可以帮助你管理\
  \ Sass 文件及其输出。\n\n让我们先处理命令行。\n\n```\n$ sass --watch.scss:.css\n```\n\n运行该命令后，Sass\
  \ 将开始监控。你会看到这条消息：\n\n```\n>>> Sass is watching for changes. Press Ctrl-C to stop.\n\
  ```\n\n文件名不需要匹配。例如，这种写法同样有效：\n\n```\n$ sass --watch..scss:.css\n```\n\n此外，文件不需要在同一个目录中。事实上，我发现将\
  \ `.scss` 文件与 `.css` 文件分离开很有用。\n\n### Sass 文件组织\n\n**图 2.1** 显示了一个典型的设置，包含一个 `stylesheets`\
  \ 目录（包含 `.css` 文件）和一个 `sass` 目录（包含我正在处理的 `.scss` 文件）。\n\n![Sass 组织](img/2-1.gif)\n\
  \n你也可以告诉 Sass 监控整个目录，而不是单个样式表。因此，使用上面的文件结构，可以使用以下 `watch` 命令监控项目中的任何 `.scss` 文件：\n\
  \n```\n$ sass --watch stylesheets/sass\n```\n\n## 使用应用程序代替命令行\n\n我们到为止学过的命令都非常简单，我相信你作为一个敏锐的前端手工艺者，不会觉得将这些输入工作加入你的工作流是件困难的。尽管如此，有一些桌面应用程序可以让你更容易地管理\
  \ Sass 文件的输出。无论你对命令线的熟悉程度如何，它们都值得一看。\n\n### Scout\n\nScout ([`bkaprt.com/sass/6/`](http://bkaprt.com/sass/6/))\
  \ 是一个适用于 Mac 和 Windows 的免费桌面应用，它提供了一个“自包含的 Ruby 环境，让你通过几次点击就能轻松管理所有的 Sass 项目”。换句话说，Scout\
  \ 为你提供了一个良好的视觉化界面来设置监控的目录和文件，而不是使用命令行（**图 2.2**–**图 2.3**）。\n\n![Scout 网站](img/2-2.gif)\n\
  ![Scout 设置](img/2-3.gif)\n\n一旦选择了输入和输出文件夹，只需点击项目的播放按钮，Scout 就会监控文件。“Log”部分将显示终端更新（**图\
  \ 2.4**）。\n\n![Scout 日志](img/2-4.gif)\n\n\n\n\nScout 是一种简单且方便的方法，如果你喜欢这种方式，它可以完全避开命令行（如果你在\
  \ Windows 上运行，还可以避免安装 Ruby）。\n\n### CodeKit\n\n与 Scout 类似，CodeKit ([`bkaprt.com/sass/7/`](http://bkaprt.com/sass/7/)；仅限\
  \ Mac OS）通过简单的 GUI 编译你的 Sass 文件。但它也可以编译 LESS、Stylus、Haml、CoffeeScript、JavaScript\
  \ 等。此外，CodeKit 还有其他可以优化文件和图像并在你开发时自动刷新浏览器的附加功能（**图 2.5**）。\n\n![](img/2-5.jpg)\n\
  \n图 2.5：CodeKit 网站。\n\n### LiveReload\n\nLiveReload ([`bkaprt.com/sass/8/`](http://bkaprt.com/sass/8/))\
  \ 在你工作时监控任何文件变化（包括 Sass 编译），并自动刷新浏览器。它支持 Mac 和 Windows（**图 2.6**）。\n\n![](img/2-6.jpg)\n\
  \n图 2.6：LiveReload 网站。\n\n### Compass.app\n\nCompass.app ([`bkaprt.com/sass/9/`](http://bkaprt.com/sass/9/))\
  \ 是一个适用于 Mac、Windows 和 Linux 的小型菜单栏应用，可以为你监控并编译 Sass 文件（**图 2.7**）。\n\n![](img/2-7.jpg)\n\
  \n图 2.7：Compass.app 的选项。\n\n除了桌面应用外，一些开发框架内置了对 Sass 支持。例如，Ruby on Rails 会在请求样式表时将\
  \ Sass 文件自动编译为 CSS 文件。同样，不需要命令行。\n\n所以你可以看到，如果你发现自己对命令行过敏，会有几种选择方案，尽管我希望大家很清楚，运行\
  \ Sass 的命令很少且并不复杂。\n\n既然我们已经安装了 Sass 并准备好监控文件，让我们继续讨论输出格式化、注释和嵌套吧。\n\n## 选择输出样式\n\
  \n和你这里的许多人一样，我是通过查看源代码来学习网页设计的。能够查看网站的“内部结构”以观察它是如何构建的，是一种不可思议的奢侈。出于这个原因，我一直在标记语言和样式表的格式上花费了大量的精力：例如缩进声明以及放置右括号的位置、如何使用空格对样式表的部分进行分组等。这一切看起来可能是不必要的过分细节，但由于我们的\
  \ CSS 是他人潜在的学习工具，我们并不仅仅是为了自己的利益而创建这些文件。\n\n使用 Sass 时，你不再手动编写那个 `.css` 文件了。相反，你编写的是没有人看到的\
  \ `.scss` 文件，而 Sass 输出的最终结果可能与你自己的格式偏好不同。正是这种（诚然有点强迫症的）格式控制权衡最初让我产生了反感，并阻止我使用 Sass。这听起来可能很荒，但如果样式表是我手工艺的结晶，我非常在意它的组织方式和格式。\n\
  \n最终，我克服了这个问题——以至于我写了这本书。归根结底，格式上的差异只是吹毛求节。生成的文件仍然具有完美的人读性。事实上，Sass 提供了几种输出样式供选择，现在是回顾这些样式的好时机。\n\
  \n### 嵌套（默认）\n\nSass 输出的默认样式是嵌套的，它会缩进每个规则以反映其所样式的 HTML 结构。这里有一个嵌套式的示例：\n\n```\n\
  ol {\n  margin: 10px 0;\n  padding: 10px 0; }\n  ol li {\n    font-size: 2em;\n\
  \    line-height: 1.4; }\n    ol li p {\n      color: #333; }\n```\n\n### 展开（Expanded）\n\
  \n展开样式是一种更典型的格式，类似于手工编写的样式表。对于那些查看你惊人的 CSS 源代码的人来说，这种格式最熟悉。\n\n这里有一个展开式的示例：\n\n\
  ```\nol {\n  margin: 10px 0;\n  padding: 10px 0;\n}\n\nol li {\n  font-size: 2em;\n\
  \  line-height: 1.4;\n}\n\nol li p {\n  color: #333;\n}\n```\n\n每个右括号都出现在声明末尾并单独占一行。Sass\
  \ 在声明之间插入换行符，这似乎是没必要的，但除了这个吹毛求节之外，这是我自己的项目中喜欢使用的样式。它非常接近我在不使用 Sass 的手动创建样式表时使用的格式（尽管这越来越少见了了！）。\n\
  \n要使用这种展开样式而不是默认的嵌套样式，我们只需要在简单的命令中添加一个标记，告诉 Sass 监控文件即可：\n\n```\n$ sass --watch\
  \ --style expanded screen.scss:screen.css\n```\n\n### 紧凑（Compact）\n\n紧凑样式将每个声明放在一行上，强调选择器。其想法是你可以轻松地扫描左侧以找到视觉上分组的规则，规则之间有换行符。我个人觉得寻找特定的规则可能很困难，但我甚至见过一些疯狂的\
  \ CSS 大佬用这种格式手动编写他们的样式表，因为他们喜欢可读性和优化之间的平衡。\n\n这里有一个紧凑式的示例：\n\n```\nol { margin:\
  \ 10px 0; padding: 10px 0; }\nol li { font-size: 2em; line-height: 1.4; }\nol li\
  \ p { color: #333; }\n```\n\n这里是指定紧凑样式的方法：\n\n```\n$ sass --watch --style compact\
  \ screen.scss:screen.css\n```\n\n### 压缩（Compressed）\n\n第四种也是最后的样式是压缩的，它移除了所有空格和换行符以节省空间。对于高流量的\
  \ Web 应用，每个字节都至关重要，Sass 包含这种样式很贴心。然而，对于人类来说它几乎不可读。\n\n这里有一个示例：\n\n```\nol{margin:10px\
  \ 0;padding:10px 0;}ol li{font-size:2em;line-height:1.4;}ol li p{color:#333;}\n\
  ```\n\n这里是指定压缩样式的方法：\n\n```\n$ sass --watch --style compressed screen.scss:screen.css\n\
  ```\n\n\n\n\n在本章中，我将分享许多我在自己的项目每天经常使用的 Sass 功能。我专门为这本书构思了一个虚拟项目，以便我们能够在现实世界的应用场景中讨论\
  \ Sass 的功能。该项目名为 Sasquatch Records——这是一个为唱片公司的简单网站，专注于神话中难以捉摸的野兽超自然音乐风格（**图 3.1**）。\n\
  \n![](img/3-1.gif)\n\n图 3.1：Sasquatch Records，我将用这个虚拟网站展示一些 Sass 示例。\n\nSass 的功能令人惊叹——它是非常强大的工具，可以帮助在创建复杂的样式表时保持理性。由于我们有许多选择，我想指出我认为对\
  \ Web 设计师最有价值且最容易添加到工作流中的 Sass 部分。\n\n## 嵌套规则\n\n在 Sass 中，你可以将 CSS 规则嵌套在彼此内部，而不是在单独的声明中重复选择器。嵌套也反映了标记结构。\n\
  \n例如，Sasquatch Records 头部标记的主要结构如下：\n\n```\n<header role=\"banner\">\n  <div id=\"\
  logo\">\n  <img src=\"logo.png\" alt=\"Sasquatch Records\" />\n  </div>\n\n  <h1>Sasquatch\
  \ Records</h1>\n  ...\n</header>\n```\n\n编写 SCSS 时，我可以镜像这种元素嵌套，让 Sass 构建完整的选择器。我个人喜欢在嵌套选择器之前留一个空行，将它们与具有相同嵌套层级的\
  \ CSS 属性隔离开：\n\n```\nheader[role=\"banner\"] {\n  margin: 20px 0 30px 0;\n  border-bottom:\
  \ 4px solid #333;\n\n  #logo {\n    float: left;\n    margin: 0 20px 0 0;\n\n  \
  \  img {\n      display: block;\n      opacity: .95;\n    }\n  }\n\n  h1 {\n   \
  \ padding: 15px 0;\n    font-size: 54px;\n    line-height: 1;\n    font-family:\
  \ Jubilat, Georgia, serif;\n    font-weight: bold;\n  }\n}\n```\n\n它将编译为：\n\n```\n\
  header[role=\"banner\"] {\n  margin: 20px 0 30px 0;\n  border-bottom: 4px solid\
  \ #333;\n}\nheader[role=\"banner\"] #logo {\n  float: left;\n  margin: 0 20px 0\
  \ 0;\n}\nheader[role=\"banner\"] #logo img {\n  display: block;\n  opacity: .95;\n\
  }\nheader[role=\"banner\"] h1 {\n  padding: 15px 0;\n  font-size: 54px;\n  line-height:\
  \ 1;\n  font-family: Jubilat, Georgia, serif;\n  font-weight: bold;\n}\n```\n\n\
  Sass 不需要在选择器中重复每个元素，而是通过嵌套来显示层级关系从而简化问题。当然，嵌套时要小心。有时你不需要选择器写得那么冗长，过度嵌套实际上会阻可读性。嵌套几层效果非常好，而对于特定模块的声明（如上面的示例），Sass\
  \ 的嵌套可以节省大量时间。\n\n## 嵌套命名空间属性\n\n除了嵌套规则外，你还可以在 Sass 中嵌套共享同一命名空间的属性（例如 `font-family`、`font-size`、`font-weight`\
  \ 等），如下：\n\n```\nheader[role=\"banner\"] h1 {\n  padding: 15px 0;\n  font: {\n \
  \   size: 54px;\n    family: Jubilat, Georgia, serif;\n    weight: bold;\n  }\n\
  \  line-height: 1;\n}\n```\n\n它将编译为：\n\n```\nheader[role=\"banner\"] h1 {\n  padding:\
  \ 15px 0;\n  font-size: 54px;\n  font-family: Jubilat, Georgia, serif;\n  font-weight:\
  \ bold;\n  line-height: 1;\n}\n```\n\n同样，`text-` 命名空间中也有许多属性。我们可以使用 Sass 嵌套来节省重复输入：\n\
  \n```\ntext: {\n  transform: uppercase;\n  decoration: underline;\n  align: center;\n\
  }\n```\n\n`background-` 是另一个很好的例子：\n\n```\nbackground: {\n  color: #ea4c89;\n  size:\
  \ 16px 16px;\n  image: url(sasquatch.png);\n  repeat: no-repeat;\n  position: top\
  \ left;\n}\n```\n\n在 Sass 中嵌套意味着更少的输入，使用缩进来反映选择器（以及属性）的形成。对于任何编写 CSS 的人来说，这也是一个容易理解的概念——并不是巨大的思维跨跃。\n\
  \n## 使用 & 引用父选择器\n\n除了嵌套规则和属性外，Sass 还增加了使用符号 `&` 作为特殊占位符来引用当前父选择器的功能。\n\n例如，在链接的声明中，我们可以添加悬停样式来覆盖它们的颜色和边框颜色：\n\
  \n```\na {\n  font-weight: bold;\n  text-decoration: none;\n  color: red;\n  border-bottom:\
  \ 2px solid red;\n\n  &:hover {\n    color: maroon;\n    border-color: maroon;\n\
  \  }\n}\n```\n\n（注：原文中包含多个关于 `&` 示例的重复区块；我在保持技术解释完整的同时处理了核心逻辑。）\n\n## 在 Sass 中注释\n\
  \nSass 支持单行注释和多行注释。多行注释使用标准的 CSS `/* ... */` 语法：\n\n```css\n/* 这是一条多行注释。 */\n```\n\
  \n通过在注释的第一个字符插入 `!`，你可以确保重要的注释（版权信息、归属、备注等）在压缩样式中出现：\n\n```css\n/*! 这是一条将出现在文件中的多行注释。\
  \ */\n```\n\n单行注释在每行开头使用 `//` 前缀，并且不会包含在最终输出中，因此你可以安全地将其用于私注释：\n\n```\n// 这是一个单行注释。\n\
  // 单行注释会从 css 文件中移除。\n// 所以你可以在这里说你想说的。\n// 坦白：我真的喜欢听 ABBA 的歌。\n// 还有 Hall & Oates。\n\
  ```\n\n## 变量\n\nSass 充满了许多非常有用的功能，让我们作为前端开发者的生活变得更容易。但如果我只能从这些功能中选择一个最有帮助的，那将是变量。\n\
  \n我们在样式表中经常重复某些内容。颜色、字体、图像、宽度等——如果其中任何一个模式发生变化，都需要进行一场查找替换的史诗级斗争。变量让这一切变得简单得多且易于维护。\n\
  \nSass 中的变量定义方式类似于普通的 CSS 规则，使用 `$` 符号如下：\n\n```\n$color-main: #333;\n$color-light:\
  \ #999;\n$color-accent: #ea4c89;\n\n$font-sans: \"Proxima Nova\", \"Helvetica Neue\"\
  , Helvetica, Arial, sans-serif;\n$font-serif: Jubilat, Georgia, serif;\n```\n\n\
  一旦定义，就可以在声明中调用：\n\n```\nbody {\n  padding: 0 8%;\n  font-family: $font-sans;\n \
  \ font-size: 100%;\n  color: $color-main;\n  background: #fff url(../img/bg.jpg)\
  \ repeat-x -80% 0;\n}\n```\n\nSass 会在 CSS 输出中将变量替换为它们的值。\n\n\n\n\n\n```\nbody {\n\
  \  padding: 0 8%;\n  font-family: \"Proxima Nova\", \"Helvetica Neue\", Helvetica,\
  \ Arial, sans-serif;\n  font-size: 100%;\n  color: #333;\n  background: #fff url(../img/bg.jpg)\
  \ repeat-x -80% 0;\n}\n```\n\n通过 Sass 变量，样式表中重复模式的批量更改可以在几秒内完成更新，因此你不需要在整个文件中查找。太棒了！\n\
  \n### 使用变量创建样式指南\n\nJina Bolton 写了一非常棒的文章，探讨了 Sass 变量如何帮助根据品牌调色板创建样式指南（[`bkaprt.com/sass/10/`](http://bkaprt.com/sass/10/)）。\n\
  \n> 为了保持我们的样式指南相关性，它存在于我们描述的内部部分。我们与相关的 Sass 变量一起显示我们的调色板，由于我们在相同的前端使用了正在引用的变量来渲染此调色板。当我们更改这些变量的值时，调色板会自动更新（图\
  \ 3.2）。\n\n![](img/3-2.gif)\n\n图 3.2：Jina 使用 Sass 来创建样式指南。\n\n与其创建一个可能会过时且相关的静态样式指南，使用\
  \ Sass 变量定义品牌调色板意味着帮助样式指南保持更新和可维护。\n\n使用样式指南的变量作为基础，Jina 继续讨论利用 Sass 函数在调色板中创建变体。例如，这是\
  \ Sasquatch Records 网站的小型调色板，使用单行注释标记颜色：\n\n```\n$color-main: #333;       // 黑色\n\
  $color-light: #999;      // 灰色\n$color-accent: #ea4c9;  // 粉色\n```\n\n接下来，使用 Sass\
  \ 中的 `darken` 或 `lighten` 函数可以生成基于调色板的不同色深。让我们将粉色（`#ea4c9`）加深 30%：\n\n```\nsection.secondary\
  \ {\n  background: darken($color-accent, 30%);\n}\n```\n\n![109850.jpg](img/109850.jpg)\n\
  \n编译时，Sass 将通过原始粉色加深 30% 来计算颜色等效值：\n\n```\nsection.secondary {\n  background: #8d1040;\n\
  }\n```\n\n我们也可以浅化：\n\n```\nsection.secondary {\n  background: lighten($color-accent,\
  \ 30%);\n}\n```\n\n![109864.jpg](img/109864.jpg)\n\n这将编译为：\n\n```\nsection.secondary\
  \ {\n  background: #fad5e3;\n}\n```\n\n### CSS 变量如何？\n\nSass（以及一般的 CSS 预处理器）的伟大之处之一是，它为可能加入拟标准的功能提供了测试场。也就是说，Sass\
  \ 可以以更快的速度实现 CSS 规范中尚未的功能。如果这些功能足够成功，它们就可以合并到标准中。\n\n变量是其中的很好的例子，可能是 CSS 预处理器中最常用的功能。通过\
  \ Sass 和 LESS 的使用，变量作为官方 CSS 功能的支持得到了增强。目前，W3C 草案“CSS Variables Module 1”正在开发中（[`bkaprt.com/sass/11/`](http://bkaprt.com/sass/11/)），并且最新的\
  \ WebKit 测试版本已经实现了对变量的支持。这意味着原生支持 CSS 变量已经在。\n\n遗憾的是，在编写期间，CSS 变量语法与 Sass 不同，并不优雅或易理解。例如，这是为文档根元素定义\
  \ CSS 变量的方法：\n\n```\n:root {\n  --color-main: #333;\n}\n```\n\n以及在声明中使用变量的方法：\n\n\
  ```\n#main p {\n  color: var(--color-main);\n}\n```\n\n该提案使用 `--` 前缀定义变量，但使用 `var(variable-name)`\
  \ 语法表示值。这有点笨拙且混乱，但仍在进行中，许多人要求在两种情况下使用类似 Sass 的 `$foo` 语法。希望最终能这样解决。\n\n最重要的是，由于浏览器支持限于预览版的\
  \ WebKit，CSS 变量在生产环境中是不可用的——这是坚持使用 Sass 的另一个理由。\n\n## MIXINS（混合）\n\n让我们来看看我第二个喜欢的\
  \ Sass 特性：mixin。变量允许你在整个样式表中定义和复用值，而 mixins 则允许你定义和复用样式块。与其在各种声明中反复输入相同的规则，不如使用\
  \ mixins 只定义一组样式，并在需要这些样式时随时引用它。\n\n为了说明，让我们为我在 Sasquatch Records 网站几处区域使用的标题样式创建一个\
  \ mixin（图 3.3）。虽然这些标题可能出现在页面的不同位置，但它们的 CSS 是相同的，这正是 mixin 的完美场景。\n\n![](img/3-3.gif)\n\
  \n图 3.3：Sasquatch Records 网站上的共享标题样式。\n\n首先，我们将在 `.scss` 顶部使用 `@mixin` 指令在 Sass\
  \ 中定义一个 mixin。我将其命名为 `title-style`，并定义边距和字体的规则：\n\n```\n@mixin title-style {\n \
  \ margin: 0 0 20px 0;\n  font-family: $font-serif;\n  font-size: 20px;\n  font-weight:\
  \ bold;\n  text-transform: uppercase;\n}\n```\n\n一旦定义，我们现在可以使用 `@include` 指令在任何想要插入这些样式的地方引用此\
  \ mixin。\n\n在 Sasquatch 网站上，我们的样式表有一部分定义了页面主部分的规则，我们想样式 `<h2>` 元素：\n\n```\nsection.main\
  \ h2 {\n  @include title-style;\n}\n```\n\n这将编译为：\n\n```\nsection.main h2 {\n  margin:\
  \ 0 0 20px 0;\n  font-family: 'Georgia', serif;\n  font-size: 20px;\n  font-weight:\
  \ bold;\n  text-transform: uppercase;\n}\n```\n\n但我们只想样式侧边栏的 `<h3>` 元素，因此在样式表稍后处调用\
  \ mixin，结果是相同的：\n\n```\nsection.secondary h3 {\n  @include title-style;\n}\n```\n\
  \nMixins 可以包含额外的规则：\n\n```css\nsection.secondary h3 {\n  margin: 0 0 20px 0;\n \
  \ font-family: 'Georgia', serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform:\
  \ uppercase;\n  color: #999;\n}\n```\n\n共享样式可以抽象为 mixins，你仍然有能力通过额外的规则来覆盖或增强这些样式。强大的功能！\n\
  \n### Mixin 参数\n\nSass mixins 还可以接收我们在调用时传递给 mixin 的参数。例如，为我们的 `title-style` mixin\
  \ 添加一个指定颜色的参数。\n\n在定义 mixin 时在括号内指定变量：\n\n```scss\n@mixin title-style($color) {\n\
  \  margin: 0 0 20px 0;\n  font-family: $font-serif;\n  font-size: 20px;\n  font-weight:\
  \ bold;\n  text-transform: uppercase;\n  color: $color;\n}\n```\n\n调用 mixin 时，我们现在可以向它传递颜色（这里是漂亮的焦橙色），以及其他规则：\n\
  \n```scss\nsection.main h2 {\n  @include title-style(#c63);\n}\n```\n\n这将编译为：\n\n\
  ```css\nsection.main h2 {\n  margin: 0 0 20px 0;\n  font-family: 'Georgia', serif;\n\
  \  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color:\
  \ #c63;\n}\n```\n\n#### 多参数\n\n通过在 mixin 定义中用逗号分隔值，可以传递多个参数：\n\n```scss\n@mixin\
  \ title-style($color, $background) {\n  margin: 0 0 20px 0;\n  font-family: $font-serif;\n\
  \  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color:\
  \ $color;\n  background: $background;\n}\n```\n\n这里是 mixin 从两个不同的选择器被调用的，为颜色和背景传递了不同的参数：\n\
  \n\n\n\n\n```scss\nsection.main h2 {\n  @include title-style(#c63, #eee);\n}\nsection.secondary\
  \ h3 {\n  @include title-style(#39c, #333);\n}\n```\n\n在这种情况下，上述代码将将编译为：\n\n```css\n\
  section.main h2 {\n  margin: 0 0 20px 0;\n  font-family: Jubilat, Georgia, serif;\n\
  \  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color:\
  \ #c63;\n  background: #eee;\n}\nsection.secondary h3 {\n  margin: 0 0 20px 0;\n\
  \  font-family: Jubilat, Georgia, serif;\n  font-size: 20px;\n  font-weight: bold;\n\
  \  text-transform: uppercase;\n  color: #39c;\n  background: #333;\n}\n```\n\n你可以开始看到\
  \ mixins（混合宏）是多么的灵活。通过参数，一致共享的规则可以与略有差异的规则并存。\n\n### 为参数定义默认值\n\n当你使用 mixin 参数时，定义默认值通常非常方便。这样一来，如果这是常态，你只需要不带参数地调用\
  \ mixin，但仍然传入覆盖值。\n\n```scss\n@mixin title-style($color, $background: #eee) {\n\
  \  margin: 0 0 20px 0;\n  font-family: $font-serif;\n  font-size: 20px;\n  font-weight:\
  \ bold;\n  text-transform: uppercase;\n  color: $color;\n  background: $background;\n\
  }\n```\n\n尽管我们为 mixin 的背景定义了浅灰色默认值，但我们可以传递一个不同的参数：\n\n```scss\nsection.main h2 {\n\
  \  @include title-style(#c63);\n}\nsection.secondary h3 {\n  @include title-style(#39c,\
  \ #333);\n}\n```\n\n这再次将编译为：\n\n```css\nsection.main h2 {\n  margin: 0 0 20px 0;\n\
  \  font-family: Jubilat, Georgia, serif;\n  font-size: 20px;\n  font-weight: bold;\n\
  \  text-transform: uppercase;\n  color: #c63;\n  background: #eee;\n}\nsection.secondary\
  \ h3 {\n  margin: 0 0 20px 0;\n  font-family: Jubilat, Georgia, serif;\n  font-size:\
  \ 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color: #39c;\n  background:\
  \ #333;\n}\n```\n\n此外，当你为 mixin 定义了多个默认参数时，你可以选择性地覆盖这些参数，而无需重新定义所有参数。\n\n例如，假设我们的\
  \ mixin 为 `$color` 和 `$background` 都定义了值：\n\n```scss\n@mixin title-style($color:\
  \ blue, $background: green) {\n  margin: 0 0 20px 0;\n  font-family: $font-serif;\n\
  \  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n  color:\
  \ $color;\n  background: $background;\n}\n```\n\n如果我们想让颜色保持默认的蓝色，但想将背景覆盖为粉色，我们只需要传递背景：\n\
  \n```scss\nsection.main h2 {\n  @include title-style($background: pink);\n}\n```\n\
  \n这将将编译为：\n\n```css\nsection.main h2 {\n  margin: 0 0 20px 0;\n  font-family: Jubilat,\
  \ Georgia, serif;\n  font-size: 20px;\n  font-weight: bold;\n  text-transform: uppercase;\n\
  \  color: blue;\n  background: pink;\n}\n```\n\n这是一个非常省时间的方法，它将这些参数定义在一个地方（即 mixin\
  \ 中）。\n\n## CSS3 喜爱 MIXINS\n\n带参数的 mixins 使用在 CSS3 中非常大放异彩，在 CSS3 中，我们经常在整个样式表中重复带有厂商前缀的规则，以实现圆角、阴影、渐变、过渡等。虽然这些属性的值在整个设计中可能有所不同，但有大量内容是共享和重复的，而\
  \ Sass 处理 CSS3 “堆栈”变得轻而易举。不记得创建 CSS 渐变的语法了吗？把它写成 mixin 吧！\n\n### border-radius\n\
  \n这是一个用于在所有浏览器中处理 CSS3 圆角的 mixin，带一个用于半径值的参数：\n\n```scss\n@mixin rounded($radius)\
  \ {\n  -webkit-border-radius: $radius;\n     -moz-border-radius: $radius;\n    \
  \      border-radius: $radius;\n}\n```\n\n我们随后可以通过调用该 mixin 让页面上的任何内容变为圆角：\n\n```scss\n\
  ol.slats li a img {\n  float: left;\n  margin: 0 10px 0 0;\n  padding: 4px;\n  border:\
  \ 1px solid #ddd;\n  @include rounded(3px);\n}\ndiv.module {\n  padding: 20px;\n\
  \  background: #eee;\n  @include rounded(10px);\n}\n```\n\n这将其编译为：\n\n```css\nol.slats\
  \ li a img {\n  float: left;\n  margin: 0 10px 0 0;\n  padding: 4px;\n  border:\
  \ 1px solid #ddd;\n  -webkit-border-radius: 3px;\n     -moz-border-radius: 3px;\n\
  \          border-radius: 3px;\n}\ndiv.module {\n  padding: 20px;\n  background:\
  \ #eee;\n  -webkit-border-radius: 10px;\n     -moz-border-radius: 10px;\n      \
  \    border-radius: 10px;\n}\n```\n\n### box-shadow\n\n这是另一个使用多个参数的示例：一个在 CSS3 中创建投影的\
  \ mixin，它使我们能够传入阴影的垂直和水平位置、模糊程度以及颜色：\n\n```scss\n@mixin shadow($x, $y, $blur, $color)\
  \ {\n  -webkit-box-shadow: $x $y $blur $color;\n     -moz-box-shadow: $x $y $blur\
  \ $color;\n          box-shadow: $x $y $blur $color;\n}\n```\n\n让我们将这个 mixin 添加到之前的\
  \ `div.module` 示例中，让阴影从顶部出现，带有 `1px` 的 `2px` 偏移，以及 50% 的透明度：\n\n```scss\ndiv.module\
  \ {\n  padding: 20px;\n  background: #eee;\n  @include shadow(1px, 2px, 3px, rgba(0,0,0,0.5));\n\
  }\n```\n\n这将其编译为：\n\n```css\ndiv.module {\n  padding: 20px;\n  background: #eee;\n\
  \  -webkit-box-shadow: 1px 2px 3px rgba(0,0,0,0.5);\n     -moz-box-shadow: 1px 2px\
  \ 3px rgba(0,0,0,0.5);\n          box-shadow: 1px 2px 3px rgba(0,0,0,0.5);\n}\n\
  ```\n\n### CSS3 渐变\n\nCSS3 渐变语法很丑。它根据浏览器而不同，很难记忆，而且在历史上规范发生了很大变化，迫使作者更新样式表。由于所有这些原因，Sass（特别是\
  \ mixin）使得使用 CSS3 变得可行且具有前瞻性。如果规范再次发生变化，我们只需要在 mixin 中更新一次语法。\n\n例如，让我们为 Sasquatch\
  \ 设计（图 3.4）中的活动标签页样式添加一个 CSS 线性渐变：\n\n```scss\nheader nav[role=\"navigation\"] ul\
  \ li.active a {\n  padding: 3px 8px;\n  color: #fff;\n  -webkit-border-radius: 4px;\n\
  \     -moz-border-radius: 4px;\n          border-radius: 4px;\n  /* 针对旧浏览器的备选 */\n\
  \  background-color: #d4278;\n  /* Mozilla Firefox */\n  background-image: -moz-linear-gradient(#ff0b1,\
  \ #d4278);\n  /* Opera */\n  background-image: -o-linear-gradient(#ff0b1, #d4278);\n\
  \  /* WebKit (Safari/Chrome 10) */\n  background-image: -webkit-gradient(linear,\
  \ left top, left bottom, color-stop(0, #ff0b1), color-stop(1, #d4278));\n  /* WebKit\
  \ (Chrome 11+) */\n  background-image: -webkit-linear-gradient(#ff0b1, #d4278);\n\
  \  /* IE10 */\n  background-image: -ms-linear-gradient(#ff0b1, #d4278);\n  /* W3C\
  \ */\n  background-image: linear-gradient(#ff0b1, #d4278);\n}\n```\n\n![](img/3-4.gif)\n\
  \n图: 3.4: Sasquatch 网站上的共享标题样式。\n\n\n\n\n\n```scss\n@mixin linear-gradient($from,\
  \ $to) {\n  /* Fallback for sad browsers */\n  background-color: $to;\n  /* Mozilla\
  \ Firefox */\n  background-image:-moz-linear-gradient($from, $to);\n  /* Opera */\n\
  \  background-image:-o-linear-gradient($from, $to);\n  /* WebKit (Safari 4+, Chrome\
  \ 1+) */\n  background-image:-webkit-gradient(linear, left top, left bottom, color-stop(0,\
  \ $from), color-stop(1, $to));\n  /* WebKit (Chrome 11+) */\n  background-image:\
  \ -webkit-linear-gradient($from, $to);\n  /* IE10 */\n  background-image: -ms-linear-gradient($from,\
  \ $to);\n  /* W3C */\n  background-image: linear-gradient($from, $to);\n}\n```\n\
  \n注意，我正在使用 `$to` 颜色为不支持 CSS 渐变的浏览器指定 `background-color` 的回退方案。\n\n幸运的是，我们只需要写一次这个怪物代码。\n\
  \n现在，当我们想要创建一个简单的线性渐变时，只需使用两个选择的颜色调用 mixin，Sass 就会完成剩下的工作。对于 Sasquatch 网站，激活标签页样式的声明如下：\n\
  \n```scss\n&.active a {\n  padding: 3px 8px;\n  color: #fff;\n  @include rounded(4px);\n\
  \  @include linear-gradient(#ff70b1, #d42a78);\n}\n```\n\n这不仅是可以接受的，而且非常符合逻辑！就像是用英语编写的一样。而且我还可以复用这个模式，例如对于一个蓝色按钮（**图\
  \ 3.5**），将其应用于样式表中的不同选择器上，而不需要重新记住那些复杂的渐变语法垃圾：\n\n```scss\nbutton {\n  padding:\
  \ 5px 10px;\n  color: #fff;\n  @include rounded(6px);\n  @include linear-gradient(#42b3e2,\
  \ #1a6798);\n}\n```\n\n![](img/3-5.gif)\n\n图 3.5：使用 Sass mixin 可以轻松实现渐变按钮。\n\n正如你可能知道的，在这里使用的线性渐变只是一个简单的例子，CSS\
  \ 渐变能够处理更复杂的情况，例如颜色停止点、径向渐变、多方向等。Sass 也能帮助处理这些情况，将任何共享的模式抽象为可重用的 mixin。\n\n## 创建\
  \ Mixin 库\n\nMixins 是奇妙的，因为它们可以编写一次并在整个样式表中使用。但通常这些 mixins 甚至会在项目之间被重复使用。你可能会发现自己在为常见的\
  \ CSS3 属性编写 mixins，如 `box-shadow`、渐变、CSS 过渡以及如自动清除浮动、`box-sizing`、表单元素等模式。如果能将所有这些都写一次，并复用到任何使用\
  \ Sass 的项目中，难道不是更高效吗？\n\n### @import\n\n引入 `@import` 规则，Sass 扩展了它以允许导入多个 SCSS 文件，并在编译时将它们合并成单个\
  \ CSS 文件。这出于许多原因而非常方便：\n\n*   单个 CSS 文件意味着更少的 HTTP 连接。提升性能！\n*   变量可以在单独的文件中定义，然后在需要时导入，无论布局和其他页面特定的样式如何。\n\
  *   导入的 SCSS 文件可以包含与项目无关的 mixins，可以进行共享和复用。\n\n以下是 `@import` 在实践中的工作方式。\n\n我有一个\
  \ `mixins.scss` 文件，被导入到我所有的项目中。在该文件中，我定义了一些每个项目中都会用的常用模式。以下是 `mixins.scss` 内容的示例：\n\
  \n```scss\n@mixin rounded($radius) {\n  -webkit-border-radius: $radius;\n     -moz-border-radius:\
  \ $radius;\n          border-radius: $radius;\n}\n@mixin shadow($x, $y, $blur, $color)\
  \ {\n  -webkit-box-shadow: $x $y $blur $color;\n     -moz-box-shadow: $x $y $blur\
  \ $color;\n          box-shadow: $x $y $blur $color;\n}\n@mixin shadow-inset($x,\
  \ $y, $blur, $color) {\n  -webkit-box-shadow: inset $x $y $blur $color;\n     -moz-box-shadow:\
  \ inset $x $y $blur $color;\n          box-shadow: inset $x $y $blur $color;\n}\n\
  @mixin transition($property) {\n  -webkit-transition: $property .2s ease;\n    \
  \ -moz-transition: $property .2s ease;\n       -o-transition: $property .2s ease;\n\
  \          transition: $property .2s ease;\n}\n@mixin box-sizing {\n  -webkit-box-sizing:\
  \ border-box;\n     -moz-box-sizing: border-box;\n          box-sizing: border-box;\n\
  }\n@mixin linear-gradient($from, $to) {\n  /* Fallback for sad browsers */\n  background-color:\
  \ $to;\n  /* Mozilla Firefox */\n  background-image:-moz-linear-gradient($from,\
  \ $to);\n  /* Opera */\n  background-image:-o-linear-gradient($from, $to);\n  /*\
  \ WebKit (Chrome 11+) */\n  background-image:-webkit-gradient(linear, left top,\
  \ left bottom, color-stop(0, $from), color-stop(1, $to));\n  /* WebKit (Safari 5.1+,\
  \ Chrome 10+) */\n  background-image: -webkit-linear-gradient($from, $to);\n  /*\
  \ IE10 */\n  background-image: -ms-linear-gradient($from, $to);\n  /* W3C */\n \
  \ background-image: linear-gradient($from, $to);\n}\n```\n\n在我的主样式表（在本例中为 `screen.scss`）顶部，我定义了所有的布局和其他网站特定的样式，我使用\
  \ `@import` 规则将它们拉进来，以便 mixins 可用。我还导入了一个每个项目中都复用的重置样式表（再次节省了 HTTP 连接并避免了复制粘贴相同的代码），以及一个存放了网站颜色、字体等变量的变量文件（**图\
  \ 3.6**）。这允许我在其他样式表中导入这些相同的变量——例如，在同一个项目中应用样式指南的其他页面或部分——而无需同时导入剩余的布局。\n\n![](img/3-6.gif)\n\
  \n图 3.6：使用 @import 将分块合并为一个文件。\n\n```scss\n // 导入其他文件\n\n@import \"reset.scss\"\
  ;\n@import \"variables.scss\";\n@import \"mixins.scss\";\n\n// 网站特定样式\n\n.foo {\n\
  \  ...\n}\n```\n\n### Compass 框架\n\n我总是建议创建你自己的框架，因为尽可能了解你的代码中发生了什么是最好的。但作为一种学习体验，其他框架可能非常有益——它们能让你看到别人是如何构建项目并提高效率的。Compass\
  \ 也不例外。\n\n### Bourbon 库\n\n设计/开发公司 thoughtbot 的伙伴们汇集了一个丰富的 mixin 库，称为 Bourbon——巧合的是，我也一直在喝过这种酒，加了苦味酒、苦味精、捣碎的糖和水果（**图\
  \ 3.8**）。\n\n稍手搜一下 Google 就能发现许多非常有用的 Sass 使用者在 GitHub 或他们自己的网站上分享他们的 mixins。很有可能，那个看起来很丑且难以维护的\
  \ CSS3 堆栈已经有人为它写好了 mixin，所以请利用好社区的力量吧！\n\n### @extend\n\n你是否曾发现自己正在编写一个 CSS 类，它与另一个类具有相同的样式，除了少数其他规则外？\n\
  \n这是一个示例。你在页面顶部有一个有两个选项的警报消息样式。一种样式处理标准警报（图 3.9），而另一种样式处理正向警报（图 3.10）。这些样式几乎相同，只有背景颜色不同。\n\
  \n通常，我们可能会为普通警报创建一个基础类，然后创建另一个仅覆盖背景颜色的类。\n\n\n\n\n\n```\n<h2 class=\"alert alert-positive\"\
  >这是一个积极提示！</h2>\n```\n\n如果每个提示的样式设置如下所示：\n\n```css\n.alert {\n  padding: 15px;\n\
  \  font-size: 1.2em;\n  font-weight: normal;\n  text-transform: uppercase;\n  line-height:\
  \ 1;\n  letter-spacing: 3px;\n  text-align: center;\n  color: #fff;\n  background:\
  \ $color-accent;\n  @include shadow(0, 1px, 2px, rgba(0,0,0,.5));\n  @include rounded(10px);\n\
  }\n.alert-positive {\n  background: #9c3;\n}\n```\n\n我们不需要在标记语言中充斥额外的类来处理这些细小的异常，而是可以使用\
  \ Sass 的 `@extend` 函数将多个选择器之间共享的样式“链”在一起。此外，我们还可以添加额外的覆盖规则，创建一个创建一个新的唯一样式，而无需重复共享的样式。\n\
  \n因此，如果我们想使用 `@extend` 来处理两种类型的提示消息，可以将标记简化为仅一个类：\n\n```html\n<h2 class=\"alert-positive\"\
  >这是一个积极提示！</h2>\n```\n\n然后使用 `@extend` 包含 `h2.alert` 类的样式，加上 `background-color`\
  \ 异常：\n\n```css\n.alert-positive {\n  @extend .alert;\n  background: #9c3;\n}\n\
  ```\n\nSass 将会高效地编译扩展类，如下所示：\n\n```css\n.alert, .alert-positive {\n  padding: 15px;\n\
  \  font-size: 1.2em;\n  font-weight: normal;\n  text-transform: uppercase;\n  line-height:\
  \ 1;\n  letter-spacing: 3px;\n  text-align: center;\n  color: #fff;\n  background:\
  \ #ea4c89;\n       -webkit-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n       moz-box-shadow:\
  \ 0 1px 2px rgba(0, 0, 0, 0.5);\n       box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n\
  \    -webkit-border-radius: 10px;\n       -moz-border-radius: 10px;\n       border-radius:\
  \ 10px;\n}\n.alert-positive {\n  background: #9c3;\n}\n```\n\n现在，当然，我们从一开始就可以这样写\
  \ CSS，但 `@extend` 语法让它更快——更不用说哪些样式在类之间是共享的了。这更容易理解正在发生什么。\n\n使用 `@extend` 还允许我们在语义上更加简洁，根据含义而非外观来定义类名。\n\
  \n### 多个 @extends\n\n你还可以在声明中 `@extend` 多个类，这会将每个类的所有样式链在一起：\n\n```css\n.alert {\n\
  \  padding: 15px;\n  font-size: 1.2em;\n  text-align: center;\n  background: $color-accent;\n\
  }\n.important {\n  font-size: 4em;\n}\n.alert-positive {\n  @extend .alert;\n  @extend\
  \ .important;\n  background: #9c3;\n}\n```\n\n将其编译为：\n\n```css\n.alert, alert-positive\
  \ {\n  padding: 15px;\n  font-size: 1.2em;\n  text-align: center;\n  background:\
  \ #ea4c89;\n}\n.important, .alert-positive {\n  font-size: 4em;\n}\n.alert-positive\
  \ {\n  background: #9c3;\n}\n```\n\n同样，Sass 高效地组织内容，使用逗号分隔的选择器将共享样式分组，然后为任何异常创建单一声明。\n\
  \n#### @extend 使用占位符选择器\n\n如果你扩展的类仅仅是为了扩展其他样式而存在呢？换句话说，可能会创建一个不会单独使用的类。\n\n这就是占位符选择器（placeholder\
  \ selectors），它允许你定义“虚拟”类，这些类本身不会出现在输出的 CSS 中。你可以使用 `@extend` 引用占位符。\n\n让我们在实践中看看。我们将为一组定义按钮的样式块创建一个类。我们将使用占位符选择器，在\
  \ Sass 中，这意味着用 `%` 而不是 `.` 作为类名前。\n\n```css\n%button {\n  padding: 10px;\n  font-weight:\
  \ bold;\n  background: blue;\n  border-radius: 6px;\n}\n```\n\n我们可以像以前一样使用 `@extend`\
  \ 在其他类中调用此规则集：\n\n```css\n.buy {\n  @extend %button;\n}\n.submit {\n  @extend %button;\n\
  \  background: green;\n}\n```\n\nSass 将其编译为扩展类，但 `%button` 占位符规则集不会出现在输出中：\n\n```css\n\
  .buy, .submit {\n  padding: 10px;\n  font-weight: bold;\n  background: blue;\n \
  \ border-radius: 6px;\n}\n.submit {\n  background: green;\n}\n```\n\n\n\n\n嵌套媒体查询（media\
  \ queries）可以避免在每次需要针对不同断点进行调整时，都重写选择器（在本例中为 `section.main`）。\n\n此外，媒体查询声明直接插入到原始选择器下方，这非常方便。我发现，将媒体查询放在就近的上下文中来理解元素在不同视口下的变化，要比将它们聚集在样式表末尾或单独的文档中要容易得多。\n\
  \n### 使用变量定义断点\n\n媒体查询冒泡（Media-query bubbling）是 Sass 为响应式设计带来的极佳便利，但仍然存在大量的重复工作。在每个声明中，我们都要指定断点（上一个示例中的\
  \ `800px` 和 `500px`）。在设计过程中，我经常会根据正在处理的具体设计以及对布局反应的观察来微调这些断点，而不是依赖静态设备宽度。换句话说，你在每个嵌套媒体查询中指定的这些断点可能会发生变化。如果能定义一次并在一处进行编辑，那就太好了。Sass\
  \ 变量来救场！\n\n让我们为媒体查询中将使用的三个断点创建一些变量。我将给它们起一个灵活的名字，不绑定到特定的设备或有限的值。\n\n```\n$width-small:\
  \  500px;\n$width-medium: 800px;\n$width-large:  1200px;\n```\n\n将断点定义为 Sass 变量后，我们（从\
  \ Sass 3.2 开始）可以在整个文档中使用嵌套媒体查询时随时引用这些变量。例如：\n\n```\nsection.main {\n  font-size:\
  \ 16px;\n  line-height: 1.4;\n\n  @media screen and (max-width: $width-large) {\n\
  \    float: left;\n    width: 65%;\n  }\n\n  @media screen and (max-width: $width-medium)\
  \ {\n    float: none;\n    width: auto;\n  }\n\n  @media screen and (max-width:\
  \ $width-small) {\n    font-size: 12px;\n    line-height: 1.4;\n  }\n}\n```\n\n\
  它将编译为：\n\n```\nsection.main {\n  font-size: 16px;\n  line-height: 1.4;\n\n  @media\
  \ screen and (max-width: 1200px) {\n    float: left;\n    width: 65%;\n  }\n\n \
  \ @media screen and (max-width: 800px) {\n    float: none;\n    width: auto;\n \
  \ }\n\n  @media screen and (max-width: 500px) {\n    font-size: 12px;\n    line-height:\
  \ 1.4;\n  }\n}\n```\n\n如果我们之后决定微调这些断点，只需要编辑一次变量，Sass 就会处理所有使用过它们的地方更新。\n\n```\n\
  $width-small:  400px;\n$width-medium: 760px;\n$width-large:  1100px;\n```\n\n这在响应式设计的初始开发阶段非常有帮助，因为根据设计需求和设计需要适应的方式，这些断点是一个不断变动的目标。\n\
  \n在这里甚至进行数学运算，因为我们可以对断点的值进行加法或减法：\n\n```\n@media screen and (max-width: $width-small\
  \ + 1) {\n  font-size: 12px;\n  line-height: 1.4;\n}\n```\n\n它将编译为：\n\n```\n@media\
  \ screen and (max-width: 401px) {\n  font-size: 12px;\n  line-height: 1.4;\n}\n\
  ```\n\n而：\n\n```\n@media screen and (max-width: $width-small - 1) {\n  font-size:\
  \ 12px;\n  line-height: 1.4;\n}\n```\n\n它将编译为：\n\n```\n@media screen and (max-width:\
  \ 399px) {\n  font-size: 12px;\n  line-height: 1.4;\n}\n```\n\n更进一步，你还可以将整个媒体查询定义为变量（而不仅仅是数值）：\n\
  \n```\n$mobile-first: \"screen and (min-width: 300px)\";\n\n@media #{$mobile-first}\
  \ {\n  #content {\n    font-size: 14px;\n    line-height: 1.5;\n  }\n}\n```\n\n\
  注意包裹 `$mobile-first` 变量的插值括号——`#{}`。这是一种提醒 Sass 在选择器或属性名称内部编译内容的特殊方法。\n\n上面的 SCSS\
  \ 将编译为：\n\n```\n@media screen and (min-width: 300px) {\n  #content {\n    font-size:\
  \ 14px;\n    line-height: 1.5;\n  }\n}\n```\n\n当你将媒体查询嵌套在受影响的声明内部时，变量可以节省大量的重复工作。但我们甚至可以使用\
  \ Sass 3.2 引入的 `@content` 块进一步简化问题。\n\n### 结合 @content 块和混合入（mixins）\n\n通过使用 Sass\
  \ 的 `@content` 指令，你可以将整个样式块传递给 mixin，Sass 会把这些块放回调用 mixin 的声明中。这听起来很困惑，但处于上下文位置的媒体查询让响应式设计变得简单得多。让我们创建一个处理三个断点的响应式\
  \ mixin。\n\n```scss\n@mixin responsive {\n  @media screen and (max-width: $width-large)\
  \ {\n    @content;\n  }\n  @media screen and (max-width: $width-medium) {\n    @content;\n\
  \  }\n  @media screen and (max-width: $width-small) {\n    @content;\n  }\n}\n```\n\
  \n现在我们可以这样使用它：\n\n```scss\nsection.main {\n  font-size: 16px;\n  line-height: 1.4;\n\
  \n  @include responsive {\n    float: left;\n    width: 65%;\n  }\n\n  @include\
  \ responsive {\n    float: none;\n    width: auto;\n  }\n\n  @include responsive\
  \ {\n    font-size: 12px;\n    line-height: 1.4;\n  }\n}\n```\n\n它将编译为：\n\n```css\n\
  section.main {\n  font-size: 16px;\n  line-height: 1.4;\n}\n\n@media screen and\
  \ (max-width: 1200px) {\n  section.main {\n    float: left;\n    width: 65%;\n \
  \ }\n}\n\n@media screen and (max-width: 800px) {\n  section.main {\n    float: none;\n\
  \    width: auto;\n  }\n}\n\n@media screen and (max-width: 500px) {\n  section.main\
  \ {\n    font-size: 12px;\n    line-height: 1.4;\n  }\n}\n```\n\n等一下，上面的示例由于 `@content`\
  \ 的工作方式有一点缺陷。让我们完善 mixin 使其更实用：\n\n```scss\n@mixin responsive($breakpoint) {\n \
  \ @media screen and (max-width: $breakpoint) {\n    @content;\n  }\n}\n```\n\n使用方法如下：\n\
  \n```scss\nsection.main {\n  font-size: 16px;\n  line-height: 1.4;\n\n  @include\
  \ responsive($width-large) {\n    float: left;\n    width: 65%;\n  }\n\n  @include\
  \ responsive($width-medium) {\n    float: none;\n    width: auto;\n  }\n\n  @include\
  \ responsive($width-small) {\n    font-size: 12px;\n    line-height: 1.4;\n  }\n\
  }\n```\n\n这要干净得多！通过使用变量和 mixin，你避免了重复媒体查询语法，并保持了代码的可维护性。\n\n\n\n\n对于一个使用响应式设计并针对多个视图频繁使用媒体查询的大型样式表，这样做可以大幅减少编译后的\
  \ CSS 文件体积。遗憾的是，Sass 目前（暂？）不支持我所说的“聚合媒体查询冒泡（aggregated media query bubbling）”，但对于大多数项目来说，牺牲稍微大一点的编译样式表来换取内联嵌套媒体查询的便利性和合理性是完全值得的。所以，目前，我们就打算这么做。\n\
  \n## “视网膜化”HiDPI 背景图像\n\n仿佛对于我们网页设计师来说，事情还不够复杂似的，高像素密度（HiDPI）屏幕的兴起又带来了另一个挑战。例如，苹果精美的\
  \ Retina 屏幕像素数量是普通显示器的两倍。这意味着它拥有了极佳的清晰度，并从此告别模糊的像素！但前提是你花时间创建能够反映这个超锐利新世界的图形。\n\n\
  对于页面上的 `<img>` 元素，这通常意味着创建尺寸是倍数的图像，并在标记中使用 `width` 属性将其压缩为一半大小。或者，还有更巧妙的方法通过媒体查询和\
  \ JavaScript 来处理选择性图像服务，例如 Scott Jehl 出色的 Picturefill 项目 ([`bkaprt.com/sass/14/`](http://bkaprt.com/sass/14/))。\n\
  \n为了分享处理 HiDPI 图像的示例，让我们来看 Sasquatch Records 的标志，它是 133×121 像素（图 4.1）。对于支持额外像素的设备，我们将创建一个更大的版本（266×242），并在标记中将其还原为\
  \ 133 像素以获得双倍清晰度（图 4.2）：\n\n```\n<img src=\"-/img/logo-peek-2x.png\" width=\"133\"\
  \ />\n```\n\n![](img/4-1_4-2.gif)\n\n图 4.1–图 4.2：左侧为普通分辨率标志，右侧为 HiDPI 版本。\n\n对于背景图像，我们只需使用\
  \ CSS 媒体查询（在支持它们的现代浏览器中）判断显示器是否为 HiDPI，并渲染适当大小的图像。\n\n例如，在 Sasquatch Records 网上，侧边栏有一个社交网络链接列表。每个链接的图标在样式表中都指定了背景图像（图\
  \ 4.3）。\n\n![4-3.tif](img/4-3.gif)\n\n图 4.3：Sasquatch Records 网站侧边栏的社交网络链接。\n\n\
  在 Dribbble 链接中，将普通分辨率图标对齐到文本左侧的 CSS 可能如下：\n\n```\nul.follow li.dribbble a {\n  padding-left:\
  \ 30px;\n  background-repeat: no-repeat;\n  background-position: 0 50%;\n  background-image:\
  \ url(../img/icon-dribbble.png);\n}\n```\n\n对于 HiDPI 显示器，我们用一个倍大的图标覆盖，然后使用 CSS3\
  \ 的 `background-size` 属性将其“挤”回目标尺寸。为了检测显示器是否为 HiDPI，我们使用媒体查询和 CSS3 中的 `min-device-pixel-ratio`\
  \ 属性（这取决于浏览器厂商）。\n\n```\n@media (-webkit-min-device-pixel-ratio: 1.5),\n       (min--moz-device-pixel-ratio:\
  \ 1.5),\n       (-o-min-device-pixel-ratio: 3/2),\n       (min-device-pixel-ratio:\
  \ 1.5),\n       (min-resolution: 1.5dppx) {\n  ul.follow li.dribbble a {\n    padding-left:\
  \ 30px;\n    background-repeat: no-repeat;\n    background-position: 0 50%;\n  \
  \  background-image: url(../img/icon-dribbble-2x.png);\n    -webkit-background-size:\
  \ 24px 24px;\n       -moz-background-size: 24px 24px;\n            background-size:\
  \ 24px 24px;\n  }\n}\n```\n\n本质上，我们的意思是如果显示器的像素密度至少是正常密度的 1.5 倍，让我们使用一个较大的 48×48\
  \ 图标（`icon-dribbble-2x.png`），并在屏幕显示时将其压缩为 24×24。\n\n在 HiDPI 显示器上查看，这种差异是极其锐利的。所有模糊的边缘都消失了（图\
  \ 4.4）。\n\n![4-4.tif](img/4-4.gif)\n\n图 4.4：借助 Sass 力量的清晰 Hi-DPI 图标！\n\n你可以想象，对界面进行“视网膜化”会导致大量的重复工作，每当你想要覆盖普通分辨率的背景图像时，都要引用该媒体查询和第二个图像。这正是\
  \ Sass 可以让这个过程变得不再痛苦的地方。\n\n我们可以创建一个 Sass mixin 来处理所有繁重工作，甚至通过一点巧妙的拼接形成两个不同的文件名。\n\
  \n这里是我在日常项目中使用的 `retinize` mixin——我将拆解每个重要部分。\n\n```\n @mixin retinize($file, $type,\
  \ $width, $height) {\n  background-image: url('../img/' + $file + '.' + $type);\n\
  \n  @media (-webkit-min-device-pixel-ratio: 1.5),\n         (min--moz-device-pixel-ratio:\
  \ 1.5),\n         (-o-min-device-pixel-ratio: 3/2),\n         (min-device-pixel-ratio:\
  \ 1.5),\n         (min-resolution: 1.5dppx) {\n    & {\n      background-image:\
  \ url('../img/' + $file + '-2x.' + $type);\n      -webkit-background-size: $width\
  \ $height;\n         -moz-background-size: $width $height;\n              background-size:\
  \ $width $height;\n    }\n  }\n}\n```\n\nMixin 的第一行设置了构建正确的编译代码所需的全部四个参数：\n\n* \
  \  文件名\n*   图像类型（JPG, GIF, PNG）\n*   图像在屏幕上的宽度\n*   图像在屏幕上的高度\n\n这四个参数列出如下：\n\n\
  ```\n@mixin retinize($file, $type, $width, $height) {\n```\n\n调用 `retinize` mixin\
  \ 只需要在你任何需要的时候插入这些值即可简单。例如：\n\n```\nli.dribbble {\n  @include retinize('icon-dribbble',\
  \ 'png', 24px, 24px);\n}\n\nli.flickr {\n  @include retinize('icon-flickr', 'png',\
  \ 24px, 24px);\n}\n\nli.facebook {\n  @include retinize('icon-facebook', 'png',\
  \ 24px, 24px);\n}\n```\n\n\n\nmixin 的最后一部分是 `background-size` 属性（以及带有 `-webkit-`\
  \ 和 `-moz-` 前缀的等效属性），它告诉浏览器将较大的图片放入多大的尺寸中：\n\n```scss\n@mixin retinize($file, $type,\
  \ $width, $height) {\n  background-image: url('../img/' + $file + '.' + $type);\n\
  \n  @media (-webkit-min-device-pixel-ratio: 1.5),\n         (min--moz-device-pixel-ratio:\
  \ 1.5),\n         (-o-min-device-pixel-ratio: 3/2),\n         (min-device-pixel-ratio:\
  \ 1.5),\n         (min-resolution: 1.5dppx) {\n    & {\n      background-image:\
  \ url('../img/' + $file + '-2x.' + $type);\n      -webkit-background-size: $width\
  \ $height;\n         -moz-background-size: $width $height;\n              background-size:\
  \ $width $height;\n    }\n  }\n}\n```\n\n就是这样——这是一个可重用的 mixin，可以从你喜欢的任何选择器提供 HiDPI\
  \ 背景图片，只需创建两个图像资源和一行 SCSS 即可：\n\n```scss\nli.dribbble a {\n  @include retinize('icon-dribbble',\
  \ 'png', 24px, 24px);\n}\n```\n\n### Mixin 嵌套 mixin！\n\nMixins 可以包含其他 mixins。可以说这是一种“mixin\
  \ 嵌套（mixinception）”。别担心，宇宙不会爆炸的！事实上，我们可以进一步实现这段代码的 DRY 化（减少重复），将带有厂商前缀的 `min-device-pixel-ratio`\
  \ 规则提取到变量，并将 `background-size` 属性栈提取到自己的 mixin 中。然后，这些提取部分就可以在样式表的其他部分或其他 mixin\
  \ 中重用。这里的另一个优势是将任何带有厂商前缀的属性保留在一个地方，这样当规范发生变化或不再需要缀时，我们就可以编辑或修剪它们（那将是一个值得庆祝的日子）。\n\
  \n首先，让我们用一个可重用的变量来替换媒体查询中的像素比例部分。正如本章前面提到的，出现在选择器内部的变量需要在它周围使用特殊的插值字符：\n\n```scss\n\
  @mixin retinize($file, $type, $width, $height) {\n  background-image: url('../img/'\
  \ + $file + '.' + $type);\n\n  @media #{$is-hidpi} {\n    & {\n      background-image:\
  \ url('../img/' + $file + '-2x.' + $type);\n      -webkit-background-size: $width\
  \ $height;\n         -moz-background-size: $width $height;\n              background-size:\
  \ $width $height;\n    }\n  }\n}\n```\n\n然后我们用像素比例规则栈定义该变量，如果需要，它也可以样式表的其他地方重用：\n\
  \n```scss\n$is-hidpi: \"(-webkit-min-device-pixel-ratio: 1.5), (min--moz-device-pixel-ratio:\
  \ 1.5), (-o-min-device-pixel-ratio: 3/2), (min-device-pixel-ratio: 1.5),(min-resolution:\
  \ 1.5dppx)\";\n```\n\n接下来，让我们为 `background-size` 创建一个 mixin，它接收 `width` 和 `height`\
  \ 属性，并包含厂商前缀的属性以及“真实的”、无前缀的属性。现在每当我们想在选择器上使用 `background-size` 时，都可以调用这个 mixin：\n\
  \n```scss\n@mixin background-size($width, $height) {\n  -webkit-background-size:\
  \ $width $height;\n     -moz-background-size: $width $height;\n          background-size:\
  \ $width $height;\n}\n```\n\n我们将这个 `background-size` mixin 包含在 `retinize` mixin\
  \ 中，并传递它已经收集的 `$width` 和 `$height` 变量：\n\n```scss\n@mixin retinize($file, $type,\
  \ $width, $height) {\n  background-image: url('../img/' + $file + '.' + $type);\n\
  \n  @media #{$is-hidpi} {\n    & {\n      background-image: url('../img/' + $file\
  \ + '-2x.' + $type);\n      @include background-size($width, $height);\n    }\n\
  \  }\n}\n```\n\n搞定了。我们重构了原始的 `retinize` mixin，使其包含了可以在其他样式或 mixin 中重用的代码。这将减少我们\
  \ Sass 代码中的重复量，并使共享样式尽可能留在尽可能少的地方，以便未来的更新和维护。\n\n## 结语\n\n希望这本小粉书能帮助你上手 Sass 并熟悉它的核心功能。我希望它也消除了对\
  \ Sass 有时会带的一些误解：\n\n*   你必须学习 Ruby。\n*   你需要改变整个 CSS 流程。\n*   你需要成为命令行专家。\n\n正如我们所讨论的，情况要简单得多。但\
  \ Sass 可以变得随你心意的强大。至少，它是一个极佳的工具，可以很好地融入你的系统和工作流，而不会干扰你编写了多年的 CSS（如果你只写了几个月的 CSS，那么好吧……几个月而已了）。\n\
  \n## 资源\n\n## 网站与文章\n\n*   **Sass reference**: Sass 的官方文档。\n*   **The Sass Way**:\
  \ Chris Eppstein 深入讲解了 Sass。\n*   **CSS Tricks**: Chris Coyier 同样也涵盖了 Sass。\n* \
  \  **Getting started with Sass**: Code School 关于 Sass 的全面课程。\n*   **Looking into\
  \ the future of Sass**: David Walsh 评估了 Sass 即将推出的特性。\n\n## Mixin 库\n\n*   **Compass**:\
  \ 由 Blueprint 创建的功能强大的 Sass 框架。即使你不使用 Compass，它的文档也是一个宝库。\n*   **Bourbon**: 自称为“一个用于\
  \ Sass 的简单轻量级 mixin 库”，Bourbon 提供了来自 thoughtbot 的大量 mixin 概念。\n*   **Handy Sass\
  \ Mixins**: Jake Bresnehan 的优秀 Sass mixins 集合。\n\n## 更多 Sass 与响应式设计\n\n*   **Breakpoint**:\
  \ 一个 Sass 插件，让媒体查询变得更加简单。\n*   **Susy**: 用于 Compass 和 Sass 创建响应式网格系统的辅助工具。\n*  \
  \ **Sassaparilla**: 一个使用 Compass 和 Sass 创建响应式 Web 设计项目的启动框架。\n\n## 工具\n\n*   **FireSass\
  \ for Firebug**: 一个实用的 Firefox 扩展，可以显示 Sass 编译样式表的原始 文件名和行号，方便调试。\n*   **Developing\
  \ with Sass and Chrome DevTools**: 关于如何在开发 Sass 时最好地使用 Chrome 的教程。\n\n## 其他 CSS\
  \ 预处理器\n\n虽然 Sass 是本书的主题，但它并不是唯一的 CSS 预处理器。如果你染上了预处理的毒（我真心希望你染上了），那么可能值得看看这些替代方案——注意它们与\
  \ Sass 的不同之处。\n\n### LESS\n\n\n\n\nLESS 是设计师和前端手工艺人员的另一个流行选择。它与 Sass 非常相似，因为它也支持变量、混合器（mixins）和其他函数，但它使用的语法略有不同。就像\
  \ Sass 的 SCSS 一样，LESS 是 CSS 的扩展，这意味着它可以与现有的样式表良好地配合，并可以逐步引入（[http://bkaprt.com/sass/32/]）。\n\
  \nLESS 还有一个一个客户端编译选项，它将 `.less` 文件提供给浏览器，浏览器在页面加载时通过 JavaScript 将其编译为普通的 CSS。这在本地工作和开发中是一种非常方便的方法，因为不需要运行命令行或应用程序来为你进行转换。然而，不建议在生产网站中使用客户端编译。\n\
  \n与 Sass 一样，LESS 也有一个命令行程序以及一些可以将 LESS 文件转换为 CSS 文件的第三方应用。\n\n在功能方面，与 Sass 相比，LESS\
  \ 做的稍微……嗯，更少一点。在我看来，Sass 拥有更活跃的开发周期和后端社区，而且功能上更健壮一些。尽管如此，LESS 支持的都是重要内容——那些能帮助你更高效地编写\
  \ DRY（不重复）样式表的功能。无论你使用哪一个预处理器，只要你在用，你就已经赢了。\n\n想要对 Sass 和 LESS 进行极佳对比，请看看 Chris\
  \ Coyier 的那篇详尽的文章，他在文中详细分析了差异以及优缺点（[http://bkaprt.com/sass/33/]）。\n\n这些争论有时会变成宗教战争，但关键在于使用你最熟悉的工具。两者对于减轻创建智能样式表的压力都将有巨大的帮助。\n\
  \n### Stylus\n\nStylus 比 LESS 和 Sass 稍微年轻一点，它拥有广泛的功能集。它的语法更像 Sass 的原始语法（可选的缩进、可选省略大括号和分号）。我喜欢那些不会过度打乱我正常工作流的工具，因此由于这个原因，我没有深入研究过\
  \ Stylus。但我在这里提到它是因为，再次，如果你觉得它适合你，那就尽管去用吧。重要的是利用这些工具中的一个让你的生活变得轻松一点（[http://bkaprt.com/sass/34/]）。\n\
