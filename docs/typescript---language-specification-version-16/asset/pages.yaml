  md: "22 \n\n \n\n \n\nIntuitively, the root container of an entity is the outermost\
    \ module or namespace body from within which \n\nthe entity is reachable. \n\n\
    Interfaces, enums, and namespaces are \"open ended,\" meaning that interface,\
    \ enum, and namespace \n\ndeclarations with the same qualified name relative to\
    \ a common root are automatically merged. For \n\nfurther details, see sections\
    \ 7.2, 9.3, and 10.5. \n\nInstance and static members in a class are in separate\
    \ declaration spaces. Thus the following is permitted: \n\n`class`` C { `\n\n\
    ` x: number; ``// Instance member`` `\n\n` ``static`` x: string; ``// Static member``\
    \ `\n\n`} `\n\n2.4 Scopes \n\nThe ***scope*** of a name is the region of program\
    \ text within which it is possible to refer to the entity \n\ndeclared by that\
    \ name without qualification of the name. The scope of a name depends on the context\
    \ in \n\nwhich the name is declared. The contexts are listed below in order from\
    \ outermost to innermost: \n\n \n\nThe scope of a name declared in the global\
    \ namespace is the entire program text. \n\n \n\nThe scope of a name declared\
    \ in a module is the source file of that module. \n\n \n\nThe scope of an exported\
    \ name declared within a namespace declaration is the body of that \n\nnamespace\
    \ declaration and every namespace declaration with the same root and the same\
    \ \n\nqualified name relative to that root. \n\n \n\nThe scope of a non-exported\
    \ name declared within a namespace declaration is the body of that \n\nnamespace\
    \ declaration. \n\n \n\nThe scope of a type parameter name declared in a class\
    \ or interface declaration is that entire \n\ndeclaration, including constraints,\
    \ extends clause, implements clause, and declaration body, but \n\nnot including\
    \ static member declarations. \n\n \n\nThe scope of a type parameter name declared\
    \ in a type alias declaration is that entire type alias \n\ndeclaration. \n\n\
     \n\nThe scope of a member name declared in an enum declaration is the body of\
    \ that declaration and \n\nevery enum declaration with the same root and the same\
    \ qualified name relative to that root. \n\n \n\nThe scope of a type parameter\
    \ name declared in a call or construct signature is that entire \n\nsignature\
    \ declaration, including constraints, parameter list, and return type. If the\
    \ signature is part \n\nof a function implementation, the scope includes the function\
    \ body. \n\n \n\nThe scope of a parameter name declared in a call or construct\
    \ signature is the remainder of the \n\nsignature declaration. If the signature\
    \ is part of a function-like declaration with a body (including \n\na function\
    \ declaration, constructor declaration, member function declaration, member accessor\
    \ \n\ndeclaration, function expression, or arrow function), the scope includes\
    \ the body of that function-\n\nlike declaration."
