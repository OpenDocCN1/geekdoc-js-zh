  md: "19 \n\n \n\n \n\n*ComputedPropertyName:* \n\n`\\[` *AssignmentExpression* `\\\
    ]` \n\nA property name can be any identifier (including a reserved word), a string\
    \ literal, a numeric literal, or a \n\ncomputed property name. String literals\
    \ may be used to give properties names that are not valid \n\nidentifiers, such\
    \ as names containing blanks. Numeric literal property names are equivalent to\
    \ string literal \n\nproperty names with the string representation of the numeric\
    \ literal, as defined in the ECMAScript \n\nspecification. \n\n2.2.3 Computed\
    \ Property Names \n\nECMAScript 6 permits object literals and classes to declare\
    \ members with computed property names. A \n\ncomputed property name specifies\
    \ an expression that computes the actual property name at run-time. \n\nBecause\
    \ the final property name isn't known at compile-time, TypeScript can only perform\
    \ limited checks \n\nfor entities declared with computed property names. However,\
    \ a subset of computed property names \n\nknown as ***well-known symbols*** can\
    \ be used anywhere a *PropertyName* is expected, including property \n\nnames\
    \ within types. A computed property name is a well-known symbol if it is of the\
    \ form \n\n`\\[ Symbol . xxx \\] `\n\nIn a well-known symbol, the identifier to\
    \ the right of the dot must denote a property of the primitive type \n\n`symbol`\
    \ in the type of the global variable 'Symbol', or otherwise an error occurs. \n\
    \nIn a *PropertyName* that specifies a *ComputedPropertyName*, the computed property\
    \ name is required to \n\ndenote a well-known symbol unless the property name\
    \ occurs in a property assignment of an object \n\nliteral (4.5) or a property\
    \ member declaration in a non-ambient class (8.4). \n\nBelow is an example of\
    \ an interface that declares a property with a well-known symbol name: \n\n`interface``\
    \ Iterable<T> { `\n\n` \\[Symbol.iterator\\](): Iterator<T>; `\n\n`} `\n\n2.3\
    \ Declarations \n\nDeclarations introduce names in their associated ***declaration\
    \ spaces***. A name must be unique in its \n\ndeclaration space and can denote\
    \ a ***value***, a ***type***, or a ***namespace***, or some combination thereof.\
    \ \n\nEffectively, a single name can have as many as three distinct meanings.\
    \ For example: \n\n`var`` X: ``string``; ``// Value named X`` `\n\n`type`` X =\
    \ ``number``; ``// Type named X`` `"
