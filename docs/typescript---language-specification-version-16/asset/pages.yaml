  md: "17 \n\n \n\n \n\n2 Basic Concepts \n\nThe remainder of this document is the\
    \ formal specification of the TypeScript programming language and \n\nis intended\
    \ to be read as an adjunct to the ECMAScript Language Specification (specifically,\
    \ the ECMA-\n\n262 Standard, 6^(th) Edition). This document describes the syntactic\
    \ grammar added by TypeScript along \n\nwith the compile-time processing and type\
    \ checking performed by the TypeScript compiler, but it only \n\nminimally discusses\
    \ the run-time behavior of programs since that is covered by the ECMAScript \n\
    \nspecification. \n\n2.1 Grammar Conventions \n\nThe syntactic grammar added by\
    \ TypeScript language is specified throughout this document using the \n\nexisting\
    \ conventions and production names of the ECMAScript grammar. In places where\
    \ TypeScript \n\naugments an existing grammar production it is so noted. For example:\
    \ \n\n*Declaration:* *( Modified )* \n\n… \n\n*InterfaceDeclaration* \n\n*TypeAliasDeclaration*\
    \ \n\n*EnumDeclaration* \n\nThe '*( Modified )*' annotation indicates that an\
    \ existing grammar production is being replaced, and the '…' \n\nreferences the\
    \ contents of the original grammar production. \n\nSimilar to the ECMAScript grammar,\
    \ if the phrase \"*\\[no LineTerminator here\\]*\" appears in the right-hand \n\
    \nside of a production of the syntactic grammar, it indicates that the production\
    \ is not a match if a \n\n*LineTerminator* occurs in the input stream at the indicated\
    \ position. \n\n2.2 Names \n\nA core purpose of the TypeScript compiler is to\
    \ track the named entities in a program and validate that \n\nthey are used according\
    \ to their designated meaning. Names in TypeScript can be written in several ways,\
    \ \n\ndepending on context. Specifically, a name can be written as \n\n \n\n\
    an *IdentifierName*, \n\n \n\na *StringLiteral* in a property name, \n\n \n\n\
    a *NumericLiteral* in a property name, or \n\n \n\na *ComputedPropertyName* that\
    \ denotes a well-known symbol (2.2.3). \n\nMost commonly, names are written to\
    \ conform with the *Identifier* production, which is any *IdentifierName* \n\n\
    that isn't a reserved word."
