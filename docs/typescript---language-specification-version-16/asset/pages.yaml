    Namespaces are either ***instantiated*** or ***non-instantiated***. A non-instantiated\
    \ namespace is a namespace \n\ncontaining only interface types, type aliases,\
    \ and other non-instantiated namespace. An instantiated \n\nnamespace is a namespace\
