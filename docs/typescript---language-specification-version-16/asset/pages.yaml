  md: "25 \n\n \n\n \n\n3 Types \n\nTypeScript adds optional static types to JavaScript.\
    \ Types are used to place static constraints on program \n\nentities such as functions,\
    \ variables, and properties so that compilers and development tools can offer\
    \ \n\nbetter verification and assistance during software development. TypeScript's\
    \ *static* compile-time type \n\nsystem closely models the *dynamic* run-time\
    \ type system of JavaScript, allowing programmers to \n\naccurately express the\
    \ type relationships that are expected to exist when their programs run and have\
    \ \n\nthose assumptions pre-validated by the TypeScript compiler. TypeScript's\
    \ type analysis occurs entirely at \n\ncompile-time and adds no run-time overhead\
    \ to program execution. \n\nAll types in TypeScript are subtypes of a single top\
    \ type called the Any type. The `any` keyword references \n\nthis type. The Any\
    \ type is the one type that can represent *any* JavaScript value with no constraints.\
    \ All \n\nother types are categorized as ***primitive types***, ***object types***,\
    \ ***union types***, ***intersection types***, or ***type ***\n\n***parameters***.\
    \ These types introduce various static constraints on their values. \n\nThe primitive\
    \ types are the Number, Boolean, String, Symbol, Void, Null, and Undefined types\
    \ along with \n\nuser defined enum types. The `number`, `boolean`, `string`, `symbol`,\
    \ and `void` keywords reference the \n\nNumber, Boolean, String, Symbol, and Void\
    \ primitive types respectively. The Void type exists purely to \n\nindicate the\
    \ absence of a value, such as in a function with no return value. It is not possible\
    \ to explicitly \n\nreference the Null and Undefined types—only *values* of those\
    \ types can be referenced, using the `null` and \n\n`undefined` literals. \n\n\
    The object types are all class, interface, array, tuple, function, and constructor\
    \ types. Class and interface \n\ntypes are introduced through class and interface\
    \ declarations and are referenced by the name given to \n\nthem in their declarations.\
    \ Class and interface types may be ***generic types*** which have one or more\
    \ type \n\nparameters. \n\nUnion types represent values that have one of multiple\
    \ types, and intersection types represent values that \n\nsimultaneously have\
    \ more than one type. \n\nDeclarations of classes, properties, functions, variables\
    \ and other language entities associate types with \n\nthose entities. The mechanism\
    \ by which a type is formed and associated with a language entity depends \n\n\
    on the particular kind of entity. For example, a namespace declaration associates\
    \ the namespace with an \n\nanonymous type containing a set of properties corresponding\
    \ to the exported variables and functions in \n\nthe namespace, and a function\
    \ declaration associates the function with an anonymous type containing a \n\n\
    call signature corresponding to the parameters and return type of the function.\
    \ Types can be associated \n\nwith variables through explicit ***type annotations***,\
    \ such as \n\n`var`` x: ``number``; `\n\nor through implicit ***type inference***,\
    \ as in"
