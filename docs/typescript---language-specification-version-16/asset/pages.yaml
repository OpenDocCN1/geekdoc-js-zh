  md: "35 \n\n \n\n \n\nThe union and intersection type operators can be applied to\
    \ type parameters. This capability can for \n\nexample be used to model functions\
    \ that merge objects: \n\n`function`` extend<T, U>(first: T, second: U): T & U\
    \ { `\n\n` ``// Extend first with properties of second`` `\n\n`} `\n\n`var`` x\
    \ = extend({ a: ``\"hello\"`` }, { b: ``42`` }); `\n\n`var`` s = x.a; `\n\n`var``\
    \ n = x.b; `\n\nIt is possible to create intersection types for which no values\
    \ other than null or undefined are possible. For \n\nexample, intersections of\
    \ primitive types such as `string & number` fall into this category. \n\n3.6 Type\
    \ Parameters \n\nA type parameter represents an actual type that the parameter\
    \ is bound to in a generic type reference or \n\na generic function call. Type\
    \ parameters have constraints that establish upper bounds for their actual type\
    \ \n\narguments. \n\nSince a type parameter represents a multitude of different\
    \ type arguments, type parameters have certain \n\nrestrictions compared to other\
    \ types. In particular, a type parameter cannot be used as a base class or \n\n\
    interface. \n\n3.6.1 \n\nType Parameter Lists \n\nClass, interface, type alias,\
    \ and function declarations may optionally include lists of type parameters \n\
    \nenclosed in < and > brackets. Type parameters are also permitted in call signatures\
    \ of object, function, \n\nand constructor type literals. \n\n*TypeParameters:*\
    \ \n\n`<` *TypeParameterList* `\\>` \n\n*TypeParameterList:* \n\n*TypeParameter*\
    \ \n\n*TypeParameterList* `,` *TypeParameter* \n\n*TypeParameter:* \n\n*BindingIdentifier*\
    \ *Constraint**opt* \n\n*Constraint:* \n\n`extends` *Type* \n\nType parameter\
    \ names must be unique. A compile-time error occurs if two or more type parameters\
    \ in \n\nthe same *TypeParameterList* have the same name."
