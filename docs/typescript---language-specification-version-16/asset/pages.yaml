    \n1.6 Classes \n\nJavaScript practice has two very common design patterns: the\
    \ module pattern and the class pattern. \n\nRoughly speaking, the module pattern\
    \ uses closures to hide names and to encapsulate private data, while \n\nthe class\
    \ pattern uses prototype chains to implement many variations on object-oriented\
    \ inheritance \n\nmechanisms. Libraries such as 'prototype.js' are typical of\
    \ this practice. TypeScript's namespaces are a \n\nformalization of the module\
    \ pattern. (The term \"module pattern\" is somewhat unfortunate now that \n\n\
    ECMAScript 6 formally supports modules in a manner different from what the module\
    \ pattern prescribes. \n\nFor this reason, TypeScript uses the term \"namespace\"\
    \ for its formalization of the module pattern.) \n\nThis section and the namespace\
    \ section below will show how TypeScript emits consistent, idiomatic \n\nJavaScript\
    \ when emitting ECMAScript 3 or 5 compliant code for classes and namespaces. The\
    \ goal of \n\nTypeScript's translation is to emit exactly what a programmer would\
    \ type when implementing a class or \n\nnamespace unaided by a tool. This section\
    \ will also describe how TypeScript infers a type for each class \n\ndeclaration.\
    \ We'll start with a simple BankAccount class. \n\n`class`` BankAccount { `\n\n\
    ` balance = ``0``; `\n\n` deposit(credit: ``number``) { `\n\n` ``this``.balance\
    \ += credit; `\n\n` ``return`` ``this``.balance; `\n\n` } `\n\n`} `\n\nThis class\
    \ generates the following JavaScript code."
