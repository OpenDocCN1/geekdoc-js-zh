  md: "3 \n\n \n\n \n\n`function`` f(s) { `\n\n` ``return`` s; `\n\n`} `\n\nIn the\
    \ JavaScript output, all type annotations have been erased. In general, TypeScript\
    \ erases all type \n\ninformation before emiting JavaScript. \n\n1.1 \n\nAmbient\
    \ Declarations \n\nAn ambient declaration introduces a variable into a TypeScript\
    \ scope, but has zero impact on the emitted \n\nJavaScript program. Programmers\
    \ can use ambient declarations to tell the TypeScript compiler that some \n\n\
    other component will supply a variable. For example, by default the TypeScript\
    \ compiler will print an error \n\nfor uses of undefined variables. To add some\
    \ of the common variables defined by browsers, a TypeScript \n\nprogrammer can\
    \ use ambient declarations. The following example declares the 'document' object\
    \ \n\nsupplied by browsers. Because the declaration does not specify a type, the\
    \ type 'any' is inferred. The type \n\n'any' means that a tool can assume nothing\
    \ about the shape or behavior of the document object. Some of \n\nthe examples\
    \ below will illustrate how programmers can use types to further characterize\
