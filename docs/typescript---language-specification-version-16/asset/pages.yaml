    \ then processing the module as described below to form \n\nthe full set of exported\
    \ members in *E*. Processing a module *M* consists of these steps: \n\n \n\n\
    Add *M* to *P*. \n\n \n\nAdd to *E* each member in the export declaration space\
    \ of *M* with a name that isn't already in *E*. \n\n \n\nFor each export star\
    \ declaration in *M*, in order of declaration, process the referenced module if\
    \ it \n\nis not already in *P*. \n\nA module's ***instance type*** is an object\
    \ type with a property for each member in the module's export \n\nmember set that\
    \ denotes a value. \n\nIf a module contains an export assignment it is an error\
    \ for the module to also contain export \n\ndeclarations. The two types of exports\
    \ are mutually exclusive. \n\n11.3.5 Export Assignments \n\nExport assignments\
    \ exist for backward compatibility with earlier versions of TypeScript. An export\
    \ \n\nassignment designates a module member as the entity to be exported in place\
    \ of the module itself. \n\n*ExportAssignment:* \n\n`export` `\\=` *IdentifierReference*\
    \ `;`"
