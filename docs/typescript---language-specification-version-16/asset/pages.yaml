    \n` (name: ``string``): ``string``; `\n\n` (name: ``string``, value: ``string``):\
    \ Accessor; `\n\n` (map: ``any``): Accessor; `\n\n`}; `\n\nNote that the signature\
    \ of the actual function implementation is not included in the type. \n\n6.3 Function\
    \ Implementations \n\nA function implementation without a return type annotation\
    \ is said to be an ***implicitly typed function***. \n\nThe return type of an\
    \ implicitly typed function *f* is inferred from its function body as follows:\
    \ \n\n \n\nIf there are no return statements with expressions in *f*'s function\
    \ body, the inferred return type is \n\nVoid. \n\n \n\nOtherwise, if *f*'s function\
    \ body directly references *f* or references any implicitly typed functions \n\
