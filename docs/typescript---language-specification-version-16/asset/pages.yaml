  md: "2 \n\n \n\n \n\n`function`` f() { `\n\n` ``return`` ``\"hello\"``; `\n\n`}\
    \ `\n\nTo benefit from this inference, a programmer can use the TypeScript language\
    \ service. For example, a \n\ncode editor can incorporate the TypeScript language\
    \ service and use the service to find the members of a \n\nstring object as in\
    \ the following screen shot. \n\n \n\nIn this example, the programmer benefits\
    \ from type inference without providing type annotations. Some \n\nbeneficial\
    \ tools, however, do require the programmer to provide type annotations. In TypeScript,\
    \ we can \n\nexpress a parameter requirement as in the following code fragment.\
    \ \n\n`function`` f(s: ``string``) { `\n\n` ``return`` s; `\n\n`} `\n\n`f({});\
    \ ``// Error`` `\n\n`f(``\"hello\"``); ``// Ok`` `\n\nThis optional type annotation\
    \ on the parameter 's' lets the TypeScript type checker know that the \n\nprogrammer\
    \ expects parameter 's' to be of type 'string'. Within the body of function 'f',\
    \ tools can assume \n\n's' is of type 'string' and provide operator type checking\
    \ and member completion consistent with this \n\nassumption. Tools can also signal\
    \ an error on the first call to 'f', because 'f' expects a string, not an object,\
    \ \n\nas its parameter. For the function 'f', the TypeScript compiler will emit\
    \ the following JavaScript code: \n\n![](img/f387abceb8a76be65171e781940b5e80_9_0.png)"
