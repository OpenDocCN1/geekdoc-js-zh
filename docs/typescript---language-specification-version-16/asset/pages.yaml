  md: "26 \n\n \n\n \n\n`var`` x = ``1``; `\n\nwhich infers the type of 'x' to be\
    \ the Number primitive type because that is the type of the value used to \n\n\
    initialize 'x'. \n\n3.1 The Any Type \n\nThe Any type is used to represent any\
    \ JavaScript value. A value of the Any type supports the same \n\noperations as\
    \ a value in JavaScript and minimal static type checking is performed for operations\
    \ on Any \n\nvalues. Specifically, properties of any name can be accessed through\
    \ an Any value and Any values can be \n\ncalled as functions or constructors with\
    \ any argument list. \n\nThe `any` keyword references the Any type. In general,\
    \ in places where a type is not explicitly provided and \n\nTypeScript cannot\
    \ infer one, the Any type is assumed. \n\nThe Any type is a supertype of all types,\
    \ and is assignable to and from all types. \n\nSome examples: \n\n`var`` x: ``any``;\
    \ ``// Explicitly typed`` `\n\n`var`` y; ``// Same as y: any`` `\n\n`var`` z:\
    \ { a; b; }; ``// Same as z: { a: any; b: any; }`` `\n\n`function`` f(x) { ``//\
