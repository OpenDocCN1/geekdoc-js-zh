  md: "1 \n\n \n\n \n\n1 Introduction \n\nJavaScript applications such as web e-mail,\
    \ maps, document editing, and collaboration tools are \n\nbecoming an increasingly\
    \ important part of the everyday computing. We designed TypeScript to meet the\
    \ \n\nneeds of the JavaScript programming teams that build and maintain large\
    \ JavaScript programs. TypeScript \n\nhelps programming teams to define interfaces\
    \ between software components and to gain insight into the \n\nbehavior of existing\
    \ JavaScript libraries. TypeScript also enables teams to reduce naming conflicts\
    \ by \n\norganizing their code into dynamically-loadable modules. TypeScript's\
    \ optional type system enables \n\nJavaScript programmers to use highly-productive\
    \ development tools and practices: static checking, \n\nsymbol-based navigation,\
    \ statement completion, and code re-factoring. \n\nTypeScript is a syntactic sugar\
    \ for JavaScript. TypeScript syntax is a superset of ECMAScript 6 (ES6) syntax.\
    \ \n\nEvery JavaScript program is also a TypeScript program. The TypeScript compiler\
    \ performs only file-local \n\ntransformations on TypeScript programs and does\
    \ not re-order variables declared in TypeScript. This \n\nleads to JavaScript\
    \ output that closely matches the TypeScript input. TypeScript does not transform\
    \ \n\nvariable names, making tractable the direct debugging of emitted JavaScript.\
    \ TypeScript optionally \n\nprovides source maps, enabling source-level debugging.\
    \ TypeScript tools typically emit JavaScript upon \n\nfile save, preserving the\
    \ test, edit, refresh cycle commonly used in JavaScript development. \n\nTypeScript\
    \ syntax includes all features of ECMAScript 6 (ES6), including classes and modules,\
    \ and provides \n\nthe ability to translate these features into ECMAScript 3 or\
    \ 5 compliant code. \n\nClasses enable programmers to express common object-oriented\
    \ patterns in a standard way, making \n\nfeatures like inheritance more readable\
    \ and interoperable. Modules enable programmers to organize their \n\ncode into\
    \ components while avoiding naming conflicts. The TypeScript compiler provides\
    \ module code \n\ngeneration options that support either static or dynamic loading\
    \ of module contents. \n\nTypeScript also provides to JavaScript programmers a\
    \ system of optional type annotations. These type \n\nannotations are like the\
    \ JSDoc comments found in the Closure system, but in TypeScript they are \n\n\
    integrated directly into the language syntax. This integration makes the code\
    \ more readable and reduces \n\nthe maintenance cost of synchronizing type annotations\
    \ with their corresponding variables. \n\nThe TypeScript type system enables programmers\
    \ to express limits on the capabilities of JavaScript \n\nobjects, and to use\
    \ tools that enforce these limits. To minimize the number of annotations needed\
    \ for \n\ntools to become useful, the TypeScript type system makes extensive use\
    \ of type inference. For example, \n\nfrom the following statement, TypeScript\
    \ will infer that the variable 'i' has the type number. \n\n`var`` i = 0; `\n\n\
    TypeScript will infer from the following function definition that the function\
    \ f has return type string."
