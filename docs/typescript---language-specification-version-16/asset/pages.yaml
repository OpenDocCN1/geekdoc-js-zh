  md: "14 \n\n \n\n \n\n`class`` List<T ``extends`` NamedItem> { `\n\n` next: List<T>\
    \ = ``null``; `\n\n` ``constructor``(``public`` item: T) { `\n\n` } `\n\n` insertAfter(item:\
    \ T) { `\n\n` ``var`` temp = ``this``.next; `\n\n` ``this``.next = ``new`` List(item);\
    \ `\n\n` ``this``.next.next = temp; `\n\n` } `\n\n` log() { `\n\n` console.log(``this``.item.name);\
    \ `\n\n` } `\n\n` ``// ...`` `\n\n`} `\n\nSection 3.7 provides further information\
    \ about generic types. \n\n1.10 Namespaces \n\nClasses and interfaces support\
    \ large-scale JavaScript development by providing a mechanism for \n\ndescribing\
    \ how to use a software component that can be separated from that component's\
    \ \n\nimplementation. TypeScript enforces *encapsulation* of implementation in\
    \ classes at design time (by \n\nrestricting use of private and protected members),\
    \ but cannot enforce encapsulation at runtime because \n\nall object properties\
    \ are accessible at runtime. Future versions of JavaScript may provide *private\
    \ names* \n\nwhich would enable runtime enforcement of private and protected members.\
    \ \n\nIn JavaScript, a very common way to enforce encapsulation at runtime is\
    \ to use the module pattern: \n\nencapsulate private fields and methods using\
    \ closure variables. The module pattern is a natural way to \n\nprovide organizational\
    \ structure and dynamic loading options by drawing a boundary around a software\
    \ \n\ncomponent. The module pattern can also provide the ability to introduce\
