  md: "20 \n\n \n\n \n\n`namespace`` X { ``// Namespace named X`` `\n\n` ``type``\
    \ Y = ``string``; `\n\n`} `\n\nA name that denotes a value has an associated type\
    \ (section 3) and can be referenced in expressions \n\n(section 4.3). A name that\
    \ denotes a type can be used by itself in a type reference or on the right hand\
