  md: "13 \n\n \n\n \n\nthrough library code, and back into client code, generic types\
    \ may do more than any other TypeScript \n\nfeature to support detailed API descriptions.\
    \ \n\nTo illustrate this, let's take a look at part of the TypeScript interface\
    \ for the built-in JavaScript array type. \n\nYou can find this interface in the\
    \ 'lib.d.ts' file that accompanies a TypeScript distribution. \n\n`interface``\
    \ Array<T> { `\n\n` reverse(): T\\[\\]; `\n\n` sort(compareFn?: (a: T, b: T) =>\
    \ ``number``): T\\[\\]; `\n\n` ``// ... `` `\n\n`} `\n\nInterface definitions,\
    \ like the one above, can have one or more *type parameters*. In this case the\
    \ 'Array' \n\ninterface has a single parameter, 'T', that defines the element\
    \ type for the array. The 'reverse' method \n\nreturns an array with the same\
    \ element type. The sort method takes an optional parameter, 'compareFn', \n\n\
    whose type is a function that takes two parameters of type 'T' and returns a number.\
    \ Finally, sort returns \n\nan array with element type 'T'. \n\nFunctions can\
    \ also have generic parameters. For example, the array interface contains a 'map'\
    \ method, \n\ndefined as follows: \n\n`map<U>(func: (value: T, index: ``number``,\
    \ array: T\\[\\]) => U, thisArg?: ``any``): U\\[\\]; `\n\nThe map method, invoked\
    \ on an array 'a' with element type 'T', will apply function 'func' to each element\
    \ \n\nof 'a', returning a value of type 'U'. \n\nThe TypeScript compiler can often\
    \ infer generic method parameters, making it unnecessary for the \n\nprogrammer\
    \ to explicitly provide them. In the following example, the compiler infers that\
    \ parameter 'U' of \n\nthe map method has type 'string', because the function\
    \ passed to map returns a string. \n\n \n\n`function`` numberToString(a: ``number``\\\
    [\\]) { `\n\n` ``var`` stringArray = a.map(v => v.toString()); `\n\n` ``return``\
    \ stringArray; `\n\n`} `\n\nThe compiler infers in this example that the 'numberToString'\
    \ function returns an array of strings. \n\nIn TypeScript, classes can also have\
    \ type parameters. The following code declares a class that implements \n\na linked\
    \ list of items of type 'T'. This code illustrates how programmers can *constrain*\
    \ type parameters to \n\nextend a specific type. In this case, the items on the\
    \ list must extend the type 'NamedItem'. This enables \n\nthe programmer to implement\
    \ the 'log' function, which logs the name of the item. \n\n`interface`` NamedItem\
