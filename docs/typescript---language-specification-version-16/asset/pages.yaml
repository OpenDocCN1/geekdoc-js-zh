    \ types, tuple types, function types, and constructor types are all \n\nclassified\
    \ as object types. Multiple constructs in the TypeScript language create object\
    \ types, including: \n\n \n\nObject type literals (section 3.8.3). \n\n \n\n\
    Array type literals (section 3.8.4). \n\n \n\nTuple type literals (section 3.8.5).\
