    \ assignment is processed without a contextual type. \n\nThe type of a property\
    \ introduced by a property assignment of the form *Name* `:` *Expr* is the type\
    \ of *Expr*. \n\nA get accessor declaration is processed in the same manner as\
    \ an ordinary function declaration (section \n\n6.1) with no parameters. A set\
    \ accessor declaration is processed in the same manner as an ordinary \n\nfunction\
    \ declaration with a single parameter and a Void return type. When both a get\
    \ and set accessor is \n\ndeclared for a property: \n\n \n\nIf both accessors\
    \ include type annotations, the specified types must be identical. \n\n \n\n\
    If only one accessor includes a type annotation, the other behaves as if it had\
