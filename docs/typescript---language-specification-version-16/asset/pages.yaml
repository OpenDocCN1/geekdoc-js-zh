    \ the exported variables and \n\nfunctions of the module. Simple modules may create\
    \ and return the module object. The module above \n\ntakes the module object as\
    \ a parameter, 'exports', and adds the 'sendMessage' property to the module \n\
    \nobject. This *augmentation* approach simplifies dynamic loading of modules and\
    \ also supports separation \n\nof module code into multiple files. \n\nThe example\
    \ assumes that an outer lexical scope defines the functions 'generateSecretKey'\
    \ and \n\n'sendSecureMessage'; it also assumes that the outer scope has assigned\
    \ the module object to the variable \n\n'MessageModule'. \n\nTypeScript namespaces\
    \ provide a mechanism for succinctly expressing the module pattern. In TypeScript,\
    \ \n\nprogrammers can combine the module pattern with the class pattern by nesting\
