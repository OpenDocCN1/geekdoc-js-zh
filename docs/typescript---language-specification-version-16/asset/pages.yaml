  md: "161 \n\n \n\n \n\n11.3.7 AMD Modules \n\nThe Asynchronous Module Definition\
    \ (AMD) specification extends the CommonJS Modules specification \n\nwith a pattern\
    \ for authoring asynchronously loadable modules with associated dependencies.\
    \ Using the \n\nAMD pattern, modules are emitted as calls to a global 'define'\
    \ function taking an array of dependencies, \n\nspecified as module names, and\
    \ a callback function containing the module body. The global 'define' \n\nfunction\
    \ is provided by including an AMD compliant loader in the application. The loader\
    \ arranges to \n\nasynchronously load the module's dependencies and, upon completion,\
    \ calls the callback function passing \n\nresolved module instances as arguments\
    \ in the order they were listed in the dependency array. \n\nThe \"main\" and\
    \ \"log\" example from above generates the following JavaScript code when compiled\
    \ for the \n\nAMD pattern. \n\nFile main.js: \n\n`define(\\[``\"require\"``, ``\"\
    exports\"``, ``\"./log\"``\\], ``function``(require, exports, log) { `\n\n` log.message(``\"\
    hello\"``); `\n\n`} `\n\nFile log.js: \n\n`define(\\[``\"require\"``, ``\"exports\"\
    ``\\], ``function``(require, exports) { `\n\n` exports.message = ``function``(s)\
    \ { `\n\n` console.log(s); `\n\n` } `\n\n`} `\n\nThe special 'require' and 'exports'\
    \ dependencies are always present. Additional entries are added to the \n\ndependencies\
    \ array and the parameter list as required to represent imported modules. Similar\
    \ to the code \n\ngeneration for CommonJS Modules, a dependency entry is generated\
    \ for a particular imported module \n\nonly if the imported module is referenced\
    \ as a *PrimaryExpression* somewhere in the body of the importing \n\nmodule.\
    \ If an imported module is referenced only as a *NamespaceName*, no dependency\
    \ is generated for \n\nthat module."
