  md: "18 \n\n \n\n \n\n2.2.1 \n\nReserved Words \n\nThe following keywords are reserved\
    \ and cannot be used as an *Identifier*: \n\n`break case catch class `\n\n`const\
    \ continue debugger default `\n\n`delete do else enum `\n\n`export extends false\
    \ finally `\n\n`for function if import `\n\n`in instanceof new null `\n\n`return\
    \ super switch this `\n\n`throw true try typeof `\n\n`var void while with `\n\n\
    The following keywords cannot be used as identifiers in strict mode code, but\
    \ are otherwise not restricted: \n\n`implements interface let package `\n\n`private\
    \ protected public static `\n\n`yield `\n\nThe following keywords cannot be used\
    \ as user defined type names, but are otherwise not restricted: \n\n`any boolean\
    \ number string `\n\n`symbol `\n\nThe following keywords have special meaning\
    \ in certain contexts, but are valid identifiers: \n\n`abstract as async await\
    \ `\n\n`constructor declare from get `\n\n`is module namespace of `\n\n`require\
    \ set type `\n\n2.2.2 Property Names \n\nThe *PropertyName* production from the\
    \ ECMAScript grammar is reproduced below: \n\n*PropertyName:* \n\n*LiteralPropertyName*\
    \ \n\n*ComputedPropertyName* \n\n*LiteralPropertyName:* \n\n*IdentifierName* \n\
    \n*StringLiteral* \n\n*NumericLiteral*"
