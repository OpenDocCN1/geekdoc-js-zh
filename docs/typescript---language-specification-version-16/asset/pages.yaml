    \ a public base type property with the same name. \n\n \n\nA string index signature\
    \ declaration hides a base type string index signature. \n\n \n\nA numeric index\
    \ signature declaration hides a base type numeric index signature. \n\nThe following\
    \ constraints must be satisfied by an interface declaration or otherwise a compile-time\
