    \ are being made, the \n\ncorresponding inferred type arguments to become ***fixed***\
    \ and no further candidate inferences are \n\nmade for them. \n\n \n\nIf *e*\
    \ is an expression of a function type that contains exactly one generic call signature\
    \ and no \n\nother members, and *T* is a function type with exactly one non-generic\
    \ call signature and no other \n\nmembers, then any inferences made for type parameters\
    \ referenced by the parameters of *T*'s call \n\nsignature are ***fixed***, and\
    \ *e*'s type is changed to a function type with *e*'s call signature instantiated\
    \ \n\nin the context of *T*'s call signature (section 3.11.6). \n\nAn example:\
    \ \n\n`function`` choose<T>(x: T, y: T): T { `\n\n` ``return`` Math.random() <\
    \ ``0.5`` ? x : y; `\n\n`} `\n\n`var`` x = choose(``10``, ``20``); ``// Ok, x\
    \ of type number`` `\n\n`var`` y = choose(``\"Five\"``, ``5``); ``// Error`` `\n\
    \nIn the first call to 'choose', two inferences are made from 'number' to 'T',\
    \ one for each parameter. Thus, \n\n'number' is inferred for 'T' and the call\
    \ is equivalent to \n\n`var`` x = choose<``number``\\>(``10``, ``20``); `\n\n\
    In the second call to 'choose', an inference is made from type 'string' to 'T'\
    \ for the first parameter and an \n\ninference is made from type 'number' to 'T'\
    \ for the second parameter. Since neither 'string' nor 'number' is \n\na supertype\
    \ of the other, type inference fails. That in turn means there are no applicable\
    \ signatures and \n\nthe function call is an error."
