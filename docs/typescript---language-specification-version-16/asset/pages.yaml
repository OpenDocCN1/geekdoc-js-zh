  md: "63 \n\n \n\n \n\n4 Expressions \n\nThis chapter describes the manner in which\
    \ TypeScript provides type inference and type checking for \n\nJavaScript expressions.\
    \ TypeScript's type analysis occurs entirely at compile-time and adds no run-time\
    \ \n\noverhead to expression evaluation. \n\nTypeScript's typing rules define\
    \ a type for every expression construct. For example, the type of the literal\
    \ \n\n123 is the Number primitive type, and the type of the object literal { a:\
    \ 10, b: \"hello\" } is { a: number; b: \n\nstring; }. The sections in this chapter\
    \ describe these rules in detail. \n\nIn addition to type inference and type checking,\
    \ TypeScript augments JavaScript expressions with the \n\nfollowing constructs:\
    \ \n\n \n\nOptional parameter and return type annotations in function expressions\
    \ and arrow functions. \n\n \n\nType arguments in function calls. \n\n \n\n\
    Type assertions. \n\nUnless otherwise noted in the sections that follow, TypeScript\
    \ expressions and the JavaScript expressions \n\ngenerated from them are identical.\
    \ \n\n4.1 Values and References \n\nExpressions are classified as ***values***\
    \ or ***references***. References are the subset of expressions that are \n\n\
    permitted as the target of an assignment. Specifically, references are combinations\
    \ of identifiers (section \n\n4.3), parentheses (section 4.8), and property accesses\
    \ (section 4.13). All other expression constructs \n\ndescribed in this chapter\
    \ are classified as values. \n\n4.2 The this Keyword \n\nThe type of `this` in\
    \ an expression depends on the location in which the reference takes place: \n\
    \n \n\nIn a constructor, instance member function, instance member accessor,\
    \ or instance member \n\nvariable initializer, `this` is of the class instance\
    \ type of the containing class. \n\n \n\nIn a static member function or static\
    \ member accessor, the type of `this` is the constructor \n\nfunction type of\
    \ the containing class. \n\n \n\nIn a function declaration or a function expression,\
    \ `this` is of type Any. \n\n \n\nIn the global namespace, `this` is of type\
    \ Any. \n\nIn all other contexts it is a compile-time error to reference `this`.\
    \ \n\nNote that an arrow function (section 4.11) has no `this` parameter but rather\
    \ preserves the `this` of its \n\nenclosing context."
