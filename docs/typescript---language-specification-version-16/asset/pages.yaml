  md: "163 \n\n \n\n \n\n12 Ambients \n\nAmbient declarations are used to provide\
    \ static typing over existing JavaScript code. Ambient declarations \n\ndiffer\
    \ from regular declarations in that no JavaScript code is emitted for them. Instead\
    \ of introducing new \n\nvariables, functions, classes, enums, or namespaces,\
    \ ambient declarations provide type information for \n\nentities that exist \"\
    ambiently\" and are included in a program by external means, for example by \n\
    \nreferencing a JavaScript library in a <script/> tag. \n\n12.1 Ambient Declarations\
    \ \n\nAmbient declarations are written using the `declare` keyword and can declare\
    \ variables, functions, classes, \n\nenums, namespaces, or modules. \n\n*AmbientDeclaration:*\
    \ \n\n`declare` *AmbientVariableDeclaration* \n\n`declare` *AmbientFunctionDeclaration*\
    \ \n\n`declare` *AmbientClassDeclaration* \n\n`declare` *AmbientEnumDeclaration*\
    \ \n\n`declare` *AmbientNamespaceDeclaration* \n\n12.1.1 Ambient Variable Declarations\
    \ \n\nAn ambient variable declaration introduces a variable in the containing\
    \ declaration space. \n\n*AmbientVariableDeclaration:* \n\n`var` *AmbientBindingList*\
    \ `;` \n\n`let` *AmbientBindingList* `;` \n\n`const` *AmbientBindingList* `;`\
    \ \n\n*AmbientBindingList:* \n\n*AmbientBinding* \n\n*AmbientBindingList* `,`\
    \ *AmbientBinding* \n\n*AmbientBinding:* \n\n*BindingIdentifier* *TypeAnnotation**opt*\
    \ \n\nAn ambient variable declaration may optionally include a type annotation.\
