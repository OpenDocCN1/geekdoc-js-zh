  md: "116 \n\n \n\n \n\nThe body of class may optionally contain a single constructor\
    \ declaration. Constructor declarations are \n\ndescribed in section 8.3. \n\n\
    Member declarations are used to declare instance and static members of the class.\
    \ Property member \n\ndeclarations are described in section 8.4 and index member\
    \ declarations are described in section 8.5. \n\n8.2 Members \n\nThe members of\
    \ a class consist of the members introduced through member declarations in the\
    \ class \n\nbody and the members inherited from the base class. \n\n8.2.1 \n\n\
    Instance and Static Members \n\nMembers are either ***instance members*** or ***static\
    \ members***. \n\nInstance members are members of the class type (section 8.2.4)\
    \ and its associated instance type. Within \n\nconstructors, instance member functions,\
    \ and instance member accessors, the type of `this` is the instance \n\ntype (section\
    \ 3.7.1) of the class. \n\nStatic members are declared using the `static` modifier\
    \ and are members of the constructor function type \n\n(section 8.2.5). Within\
    \ static member functions and static member accessors, the type of `this` is the\
    \ \n\nconstructor function type. \n\nClass type parameters cannot be referenced\
    \ in static member declarations. \n\n8.2.2 Accessibility \n\nProperty members\
    \ have either ***public***, ***private***, or ***protected*** accessibility. The\
    \ default is public \n\naccessibility, but property member declarations may include\
    \ a `public`, `private`, or `protected` modifier to \n\nexplicitly specify the\
    \ desired accessibility. \n\nPublic property members can be accessed everywhere\
    \ without restrictions. \n\nPrivate property members can be accessed only within\
    \ their declaring class. Specifically, a private member \n\n*M* declared in a\
    \ class *C* can be accessed only within the class body of *C*. \n\nProtected property\
    \ members can be accessed only within their declaring class and classes derived\
    \ from \n\ntheir declaring class, and a protected instance property member must\
    \ be accessed *through* an instance of \n\nthe enclosing class. Specifically,\
    \ a protected member *M* declared in a class *C* can be accessed only within \n\
    \nthe class body of *C* or the class body of a class derived from *C*. Furthermore,\
    \ when a protected instance \n\nmember *M* is accessed in a property access *E*`.`*M*\
    \ within the body of a class *D*, the type of *E* is required to \n\nbe *D* or\
    \ a type that directly or indirectly has *D* as a base type, regardless of type\
    \ arguments. \n\nPrivate and protected accessibility is enforced only at compile-time\
    \ and serves as no more than an \n\n*indication of intent*. Since JavaScript provides\
    \ no mechanism to create private and protected properties on \n\nan object, it\
    \ is not possible to enforce the private and protected modifiers in dynamic code\
    \ at run-time."
