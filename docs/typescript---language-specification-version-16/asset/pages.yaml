    combination thereof, and those members may be local or exported. The body of a\
    \ namespace \n\ncorresponds to a function that is executed once, thereby providing\
    \ a mechanism for maintaining local \n\nstate with assured isolation. Namespaces\
    \ can be thought of as a formalization of the immediately-invoked \n\nfunction\
    \ expression (IIFE) pattern. \n\n10.1 Namespace Declarations \n\nA namespace declaration\
    \ introduces a name with a namespace meaning and, in the case of an \n\ninstantiated\
