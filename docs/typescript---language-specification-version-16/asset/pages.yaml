    \ where `this` (section 4.2) references a derived class instance or a derived\
    \ class constructor \n\nfunction. Specifically: \n\n \n\nIn a constructor, instance\
    \ member function, instance member accessor, or instance member \n\nvariable initializer\
    \ where `this` references a derived class instance, a super property access is\
    \ \n\npermitted and must specify a public instance member function of the base\
    \ class. \n\n \n\nIn a static member function or static member accessor where\
    \ `this` references the constructor \n\nfunction object of a derived class, a\
    \ super property access is permitted and must specify a public \n\nstatic member\
