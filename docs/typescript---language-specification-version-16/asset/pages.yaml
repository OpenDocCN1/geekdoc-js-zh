  md: "99 \n\n \n\n \n\n6 Functions \n\nTypeScript extends JavaScript functions to\
    \ include type parameters, parameter and return type \n\nannotations, overloads,\
    \ default parameter values, and rest parameters. \n\n6.1 Function Declarations\
    \ \n\nFunction declarations are extended to permit the function body to be omitted\
    \ in overload declarations. \n\n*FunctionDeclaration:* *( Modified )* \n\n`function`\
    \ *BindingIdentifier**opt* *CallSignature* `{` *FunctionBody* `}` \n\n`function`\
    \ *BindingIdentifier**opt* *CallSignature* `;` \n\nA *FunctionDeclaration* introduces\
    \ a named value of a function type in the containing declaration space. \n\nThe\
    \ *BindingIdentifier* is optional only when the function declaration occurs in\
    \ an export default declaration \n\n(section 11.3.4.2). \n\nFunction declarations\
    \ that specify a body are called ***function implementations*** and function declarations\
    \ \n\nwithout a body are called ***function overloads***. It is possible to specify\
    \ multiple overloads for the same \n\nfunction (i.e. for the same name in the\
    \ same declaration space), but a function can have at most one \n\nimplementation.\
    \ All declarations for the same function must specify the same set of modifiers\
    \ (i.e. the \n\nsame combination of `declare`, `export`, and `default`). \n\n\
    When a function has overload declarations, the overloads determine the call signatures\
    \ of the type given \n\nto the function object and the function implementation\
    \ signature (if any) must be assignable to that type. \n\nOtherwise, the function\
    \ implementation itself determines the call signature. \n\nWhen a function has\
    \ both overloads and an implementation, the overloads must precede the \n\nimplementation\
    \ and all of the declarations must be consecutive with no intervening grammatical\
    \ \n\nelements. \n\n6.2 Function Overloads \n\nFunction overloads allow a more\
    \ accurate specification of the patterns of invocation supported by a \n\nfunction\
    \ than is possible with a single signature. The compile-time processing of a call\
    \ to an overloaded \n\nfunction chooses the best candidate overload for the particular\
    \ arguments and the return type of that \n\noverload becomes the result type the\
    \ function call expression. Thus, using overloads it is possible to \n\nstatically\
    \ describe the manner in which a function's return type varies based on its arguments.\
    \ Overload \n\nresolution in function calls is described further in section 4.15.\
    \ \n\nFunction overloads are purely a compile-time construct. They have no impact\
    \ on the emitted JavaScript \n\nand thus no run-time cost."
