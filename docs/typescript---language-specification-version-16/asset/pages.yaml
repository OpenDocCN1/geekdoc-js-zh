  md: "91 \n\n \n\n \n\n5 Statements \n\nThis chapter describes the static type checking\
    \ TypeScript provides for JavaScript statements. TypeScript \n\nitself does not\
    \ introduce any new statement constructs, but it does extend the grammar for local\
    \ \n\ndeclarations to include interface, type alias, and enum declarations. \n\
    \n5.1 Blocks \n\nBlocks are extended to include local interface, type alias, and\
    \ enum declarations (classes are already \n\nincluded by the ECMAScript 6 grammar).\
    \ \n\n*Declaration:* *( Modified )* \n\n… \n\n*InterfaceDeclaration* \n\n*TypeAliasDeclaration*\
    \ \n\n*EnumDeclaration* \n\nLocal class, interface, type alias, and enum declarations\
    \ are block scoped, similar to let and const \n\ndeclarations. \n\n5.2 Variable\
    \ Statements \n\nVariable statements are extended to include optional type annotations.\
    \ \n\n*VariableDeclaration:* *( Modified )* \n\n*SimpleVariableDeclaration* \n\
    \n*DestructuringVariableDeclaration* \n\nA variable declaration is either a simple\
    \ variable declaration or a destructuring variable declaration. \n\n5.2.1 \n\n\
    Simple Variable Declarations \n\nA ***simple variable declaration*** introduces\
    \ a single named variable and optionally assigns it an initial \n\nvalue. \n\n\
    *SimpleVariableDeclaration:* \n\n*BindingIdentifier* *TypeAnnotation**opt* *Initializer**opt*\
    \ \n\nThe type *T* of a variable introduced by a simple variable declaration is\
    \ determined as follows: \n\n \n\nIf the declaration includes a type annotation,\
    \ *T* is that type. \n\n \n\nOtherwise, if the declaration includes an initializer\
    \ expression, *T* is the widened form (section 3.12) \n\nof the type of the initializer\
    \ expression. \n\n \n\nOtherwise, *T* is the Any type."
