  md: "5 \n\n \n\n \n\n`add({ name: ``\"Fred\"`` }); ``// Ok`` `\n\n`add({ favoriteColor:\
    \ ``\"blue\"`` }); ``// Error, name required`` `\n\n`add({ name: ``\"Jill\"``,\
    \ favoriteColor: ``\"green\"`` }); ``// Ok`` `\n\nTypeScript object types model\
    \ the diversity of behaviors that a JavaScript object can exhibit. For example,\
    \ \n\nthe jQuery library defines an object, '$', that has methods, such as 'get'\
    \ (which sends an Ajax message), \n\nand fields, such as 'browser' (which gives\
    \ browser vendor information). However, jQuery clients can also \n\ncall '$' as\
    \ a function. The behavior of this function depends on the type of parameters\
    \ passed to the \n\nfunction. \n\nThe following code fragment captures a small\
    \ subset of jQuery behavior, just enough to use jQuery in a \n\nsimple way. \n\
    \n`interface`` JQuery { `\n\n` text(content: ``string``); `\n\n`} `\n\n` `\n\n\
    `interface`` JQueryStatic { `\n\n` get(url: ``string``, callback: (data: ``string``)\
    \ => ``any``); `\n\n` (query: ``string``): JQuery; `\n\n`} `\n\n`declare`` ``var``\
    \ $: JQueryStatic; `\n\n`$.get(``\"http://mysite.org/divContent\"``, `\n\n` ``function``\
    \ (data: ``string``) { `\n\n` $(``\"div\"``).text(data); `\n\n` } `\n\n`); `\n\
    \nThe 'JQueryStatic' interface references another interface: 'JQuery'. This interface\
    \ represents a collection of \n\none or more DOM elements. The jQuery library\
    \ can perform many operations on such a collection, but in \n\nthis example the\
    \ jQuery client only needs to know that it can set the text content of each jQuery\
    \ element \n\nin a collection by passing a string to the 'text' method. The 'JQueryStatic'\
    \ interface also contains a \n\nmethod, 'get', that performs an Ajax get operation\
    \ on the provided URL and arranges to invoke the \n\nprovided callback upon receipt\
    \ of a response. \n\nFinally, the 'JQueryStatic' interface contains a bare function\
    \ signature \n\n`(query: ``string``): JQuery; `\n\nThe bare signature indicates\
    \ that instances of the interface are callable. This example illustrates that\
    \ \n\nTypeScript function types are just special cases of TypeScript object types.\
    \ Specifically, function types are \n\nobject types that contain one or more call\
    \ signatures. For this reason we can write any function type as an \n\nobject\
    \ type literal. The following example uses both forms to describe the same type."
