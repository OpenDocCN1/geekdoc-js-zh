    \ the global object 'Symbol' defines a number of well-known symbols (2.2.3) that\
    \ can be used in \n\na manner similar to identifiers. Note that the 'Symbol' object\
    \ is available only in ECMAScript 6 \n\nenvironments. \n\nFor purposes of determining\
    \ type relationships (section 3.11) and accessing properties (section 4.13), the\
    \ \n\nSymbol primitive type behaves as an object type with the same properties\
    \ as the global interface type \n\n'Symbol'. \n\nSome examples: \n\n`var`` secretKey\
    \ = Symbol(); `\n\n`var`` obj = {}; `\n\n`obj\\[secretKey\\] = ``\"secret message\"\
    ``; ``// Use symbol as property key`` `\n\n`obj\\[Symbol.toStringTag\\] = ``\"\
    test\"``; ``// Use of well-known symbol`` `\n\n3.2.5 The Void Type \n\nThe Void\
    \ type, referenced by the `void` keyword, represents the absence of a value and\
    \ is used as the \n\nreturn type of functions with no return value. \n\nThe only\
    \ possible values for the Void type are `null` and `undefined`. The Void type\
    \ is a subtype of the Any \n\ntype and a supertype of the Null and Undefined types,\
    \ but otherwise Void is unrelated to all other types. \n\n*NOTE: We might consider\
    \ disallowing declaring variables of type Void as they serve no useful purpose.\
    \ *\n\n*However, because Void is permitted as a type argument to a generic type\
    \ or function it is not feasible to *\n\n*disallow Void properties or parameters*.\
    \ \n\n3.2.6 The Null Type \n\nThe Null type corresponds to the similarly named\
    \ JavaScript primitive type and is the type of the `null` \n\nliteral. \n\nThe\
    \ `null` literal references the one and only value of the Null type. It is not\
    \ possible to directly reference \n\nthe Null type itself. \n\nThe Null type is\
