    \ \n\nInherited properties with the same name must be identical (section 3.11.2).\
    \ \n\n \n\nAll properties of the interface must satisfy the constraints implied\
    \ by the index signatures of the \n\ninterface as specified in section 3.9.4.\
    \ \n\n \n\nThe instance type (section 3.7.1) of the declared interface must be\
