  md: "12 \n\n \n\n \n\n1.8 Overloading on String Parameters \n\nAn important goal\
    \ of TypeScript is to provide accurate and straightforward types for existing\
    \ JavaScript \n\nprogramming patterns. To that end, TypeScript includes generic\
    \ types, discussed in the next section, and \n\n*overloading on string parameters*,\
    \ the topic of this section. \n\nJavaScript programming interfaces often include\
    \ functions whose behavior is discriminated by a string \n\nconstant passed to\
    \ the function. The Document Object Model makes heavy use of this pattern. For\
    \ \n\nexample, the following screen shot shows that the 'createElement' method\
    \ of the 'document' object has \n\nmultiple signatures, some of which identify\
    \ the types returned when specific strings are passed into the \n\nmethod. \n\n\
    \ \n\nThe following code fragment uses this feature. Because the 'span' variable\
    \ is inferred to have the type \n\n'HTMLSpanElement', the code can reference without\
    \ static error the 'isMultiline' property of 'span'. \n\n`var`` span = document.createElement(``\"\
    span\"``); `\n\n`span.isMultiLine = ``false``; ``// OK: HTMLSpanElement has isMultiline\
    \ property`` `\n\nIn the following screen shot, a programming tool combines information\
    \ from overloading on string \n\nparameters with contextual typing to infer that\
    \ the type of the variable 'e' is 'MouseEvent' and that \n\ntherefore 'e' has\
    \ a 'clientX' property. \n\n \n\nSection 3.9.2.4 provides details on how to use\
    \ string literals in function signatures. \n\n1.9 Generic Types and Functions\
    \ \n\nLike overloading on string parameters, *generic types* make it easier for\
    \ TypeScript to accurately capture \n\nthe behavior of JavaScript libraries. Because\
    \ they enable type information to flow from client code, \n\n![](img/f387abceb8a76be65171e781940b5e80_19_0.png)![](img/f387abceb8a76be65171e781940b5e80_19_1.png)"
