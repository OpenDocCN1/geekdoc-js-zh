    \ ``// Ok`` `\n\n` a.y = 1; ``// Ok`` `\n\n` b.y = 1; ``// Ok`` `\n\n` } `\n\n\
    `} `\n\n`class`` B ``extends`` A { `\n\n` ``static`` f(a: A, b: B) { `\n\n` a.x\
    \ = 1; ``// Error, x only accessible within A`` `\n\n` b.x = 1; ``// Error, x\
    \ only accessible within A`` `\n\n` a.y = 1; ``// Error, y must be accessed through\
    \ instance of B`` `\n\n` b.y = 1; ``// Ok`` `\n\n` } `\n\n`} `\n\nIn class 'A',\
    \ the accesses to 'x' are permitted because 'x' is declared in 'A', and the accesses\
    \ to 'y' are \n\npermitted because both take place through an instance of 'A'\
    \ or a type derived from 'A'. In class 'B', access \n\nto 'x' is not permitted,\
    \ and the first access to 'y' is an error because it takes place through an instance\
    \ of \n\n'A', which is not derived from the enclosing class 'B'. \n\n8.2.3 Inheritance\
    \ and Overriding \n\nA derived class ***inherits*** all members from its base\
