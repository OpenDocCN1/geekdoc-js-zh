  md: "79 \n\n \n\n \n\nIn a type assertion expression of the form < *T* > *e*, *e*\
    \ is contextually typed (section 4.23) by *T* and the \n\nresulting type of* e*\
    \ is required to be assignable to *T*, or *T* is required to be assignable to\
    \ the widened form \n\nof the resulting type of *e*, or otherwise a compile-time\
    \ error occurs. The type of the result is *T*. \n\nType assertions check for assignment\
    \ compatibility in both directions. Thus, type assertions allow type \n\nconversions\
    \ that *might* be correct, but aren't *known* to be correct. In the example \n\
    \n`class`` Shape { ... } `\n\n`class`` Circle ``extends`` Shape { ... } `\n\n\
    `function`` createShape(kind: ``string``): Shape { `\n\n` ``if`` (kind === ``\"\
    circle\"``) ``return`` ``new`` Circle(); `\n\n` ... `\n\n`} `\n\n`var`` circle\
    \ = <Circle> createShape(``\"circle\"``); `\n\nthe type annotations indicate that\
    \ the 'createShape' function *might* return a 'Circle' (because 'Circle' is a\
    \ \n\nsubtype of 'Shape'), but isn't *known* to do so (because its return type\
    \ is 'Shape'). Therefore, a type \n\nassertion is needed to treat the result as\
    \ a 'Circle'. \n\nAs mentioned above, type assertions are not checked at run-time\
    \ and it is up to the programmer to guard \n\nagainst errors, for example using\
    \ the `instanceof` operator: \n\n`var`` shape = createShape(shapeKind); `\n\n\
    `if`` (shape ``instanceof`` Circle) { `\n\n` ``var`` circle = <Circle> shape;\
    \ `\n\n` ... `\n\n`} `\n\n4.17 JSX Expressions \n\n*TODO: Document **JSX expressions*.\
