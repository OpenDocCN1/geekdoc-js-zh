  md: "32 \n\n \n\n \n\n \n\n***Construct signatures***, which define the possible\
    \ parameter lists and return types associated with \n\napplying the `new` operator\
    \ to objects of the given type. \n\n \n\n***Index signatures***, which define\
    \ type constraints for properties in the given type. An object type \n\ncan have\
    \ at most one string index signature and one numeric index signature. \n\nProperties\
    \ are either ***public***, ***private***, or ***protected*** and are either ***required***\
    \ or ***optional***: \n\n \n\nProperties in a class declaration may be designated\
    \ public, private, or protected, while properties \n\ndeclared in other contexts\
    \ are always considered public. Private members are only accessible \n\nwithin\
    \ their declaring class, as described in section 8.2.2, and private properties\
    \ match only \n\nthemselves in subtype and assignment compatibility checks, as\
    \ described in section 3.11. \n\nProtected members are only accessible within\
    \ their declaring class and classes derived from it, as \n\ndescribed in section\
    \ 8.2.2, and protected properties match only themselves and overrides in \n\n\
    subtype and assignment compatibility checks, as described in section 3.11. \n\n\
     \n\nProperties in an object type literal or interface declaration may be designated\
    \ required or \n\noptional, while properties declared in other contexts are always\
    \ considered required. Properties \n\nthat are optional in the target type of\
    \ an assignment may be omitted from source objects, as \n\ndescribed in section\
    \ 3.11.4. \n\nCall and construct signatures may be ***specialized*** (section\
    \ 3.9.2.4) by including parameters with string \n\nliteral types. Specialized\
    \ signatures are used to express patterns where specific string values for some\
    \ \n\nparameters cause the types of other parameters or the function result to\
    \ become further specialized. \n\n3.4 Union Types \n\n***Union types*** represent\
    \ values that may have one of several distinct representations. A value of a union\
    \ \n\ntype *A* | *B* is a value that is *either* of type *A* or type *B*. Union\
    \ types are written using union type literals \n\n(section 3.8.6). \n\nA union\
    \ type encompasses an ordered set of constituent types. While it is generally\
    \ true that *A* | *B* is \n\nequivalent to *B* | *A*, the order of the constituent\
    \ types may matter when determining the call and construct \n\nsignatures of the\
    \ union type. \n\nUnion types have the following subtype relationships: \n\n\
    \ \n\nA union type *U* is a subtype of a type *T* if each type in *U* is a subtype\
    \ of *T*. \n\n \n\nA type *T* is a subtype of a union type *U* if *T* is a subtype\
    \ of any type in *U*. \n\nSimilarly, union types have the following assignability\
    \ relationships: \n\n \n\nA union type *U* is assignable to a type *T* if each\
    \ type in *U* is assignable to *T*. \n\n \n\nA type *T* is assignable to a union\
    \ type *U* if *T* is assignable to any type in *U*. \n\nThe || and conditional\
    \ operators (section 4.19.7 and 4.20) may produce values of union types, and array\
    \ \n\nliterals (section 4.6) may produce array values that have union types as\
    \ their element types."
