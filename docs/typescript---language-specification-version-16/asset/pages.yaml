  md: "65 \n\n \n\n \n\nThe type of an object literal is an object type with the set\
    \ of properties specified by the property \n\nassignments in the object literal.\
    \ A get and set accessor may specify the same property name, but \n\notherwise\
    \ it is an error to specify multiple property assignments for the same property.\
    \ \n\nA shorthand property assignment of the form \n\n`prop `\n\nis equivalent\
    \ to \n\n`prop : prop `\n\nLikewise, a property assignment of the form \n\n`f\
    \ ( ... ) { ... } `\n\nis equivalent to \n\n`f : ``function`` ( ... ) { ... }\
    \ `\n\nEach property assignment in an object literal is processed as follows:\
    \ \n\n \n\nIf the object literal is contextually typed and the contextual type\
    \ contains a property with a \n\nmatching name, the property assignment is contextually\
    \ typed by the type of that property. \n\n \n\nOtherwise, if the object literal\
    \ is contextually typed, if the contextual type contains a numeric \n\nindex signature,\
