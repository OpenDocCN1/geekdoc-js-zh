  md: "36 \n\n \n\n \n\nThe scope of a type parameter extends over the entire declaration\
    \ with which the type parameter list is \n\nassociated, with the exception of\
    \ static member declarations in classes. \n\nEach type parameter has an associated\
    \ type parameter ***constraint*** that establishes an upper bound for \n\ntype\
    \ arguments. Omitting a constraint or specifying type `any` as the constraint\
    \ corresponds to specifying \n\nthe empty object type `{}`. Type parameters declared\
    \ in a particular type parameter list may not be \n\nreferenced in constraints\
    \ in that type parameter list. \n\nThe ***base constraint*** of a type parameter\
    \ *T* is defined as follows: \n\n \n\nIf *T* has no declared constraint, *T*'s\
    \ base constraint is the empty object type `{}`. \n\n \n\nIf *T*'s declared constraint\
    \ is a type parameter, *T*'s base constraint is that of the type parameter. \n\
    \n \n\nOtherwise, *T*'s base constraint is *T*'s declared constraint. \n\nIn\
    \ the example \n\n`interface`` G<T, U ``extends`` Function> { `\n\n` f<V ``extends``\
    \ U>(x: V): V; `\n\n`} `\n\nthe base constraint of 'T' is the empty object type,\
