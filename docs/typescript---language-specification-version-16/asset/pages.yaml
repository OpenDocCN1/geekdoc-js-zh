  md: "21 \n\n \n\n \n\n \n\nThe global namespace, each module, and each declared\
    \ namespace has a declaration space for its \n\ncontained entities (whether local\
    \ or exported). \n\n \n\nEach module has a declaration space for its exported\
    \ entities. All export declarations in the \n\nmodule contribute to this declaration\
    \ space. \n\n \n\nEach declared namespace has a declaration space for its exported\
    \ entities. All export declarations \n\nin the namespace contribute to this declaration\
    \ space. A declared namespace’s declaration space \n\nis shared with other declared\
    \ namespaces that have the same root container and the same \n\nqualified name\
    \ starting from that root container. \n\n \n\nEach class declaration has a declaration\
    \ space for instance members and type parameters, and a \n\ndeclaration space\
    \ for static members. \n\n \n\nEach interface declaration has a declaration space\
    \ for members and type parameters. An \n\ninterface's declaration space is shared\
    \ with other interfaces that have the same root container and \n\nthe same qualified\
    \ name starting from that root container. \n\n \n\nEach enum declaration has\
    \ a declaration space for its enum members. An enum's declaration \n\nspace is\
    \ shared with other enums that have the same root container and the same qualified\
    \ name \n\nstarting from that root container. \n\n \n\nEach type alias declaration\
    \ has a declaration space for its type parameters. \n\n \n\nEach function-like\
    \ declaration (including function declarations, constructor declarations, member\
    \ \n\nfunction declarations, member accessor declarations, function expressions,\
    \ and arrow functions) \n\nhas a declaration space for locals and type parameters.\
    \ This declaration space includes parameter \n\ndeclarations, all local var and\
    \ function declarations, and local let, const, class, interface, type alias, \n\
    \nand enum declarations that occur immediately within the function body and are\
    \ not further \n\nnested in blocks. \n\n \n\nEach statement block has a declaration\
    \ space for local let, const, class, interface, type alias, and \n\nenum declarations\
    \ that occur immediately within that block. \n\n \n\nEach object literal has\
    \ a declaration space for its properties. \n\n \n\nEach object type literal has\
    \ a declaration space for its members. \n\nTop-level declarations in a source\
    \ file with no top-level import or export declarations belong to the \n\n***global\
    \ namespace***. Top-level declarations in a source file with one or more top-level\
    \ import or export \n\ndeclarations belong to the ***module*** represented by\
    \ that source file. \n\nThe ***container*** of an entity is defined as follows:\
    \ \n\n \n\nThe container of an entity declared in a namespace declaration is\
    \ that namespace declaration. \n\n \n\nThe container of an entity declared in\
