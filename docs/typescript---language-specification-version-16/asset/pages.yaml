    \ age: ``number`` }>( `\n\n` names, ages, s => n => ({ name: s, age: n })); `\n\
    \nand the resulting type of 'pairs' is therefore '{ name: string; age: number\
    \ }\\[\\]'. \n\n4.15.3 Grammar Ambiguities \n\nThe inclusion of type arguments\
    \ in the *Arguments* production (section 4.15) gives rise to certain \n\nambiguities\
    \ in the grammar for expressions. For example, the statement \n\n`f(g<A, B>(``7``));\
    \ `\n\ncould be interpreted as a call to 'f' with two arguments, 'g < A' and 'B\
    \ > (7)'. Alternatively, it could be \n\ninterpreted as a call to 'f' with one\
    \ argument, which is a call to a generic function 'g' with two type \n\narguments\
    \ and one regular argument. \n\nThe grammar ambiguity is resolved as follows:\
    \ In a context where one possible interpretation of a \n\nsequence of tokens is\
    \ an *Arguments* production, if the initial sequence of tokens forms a syntactically\
    \ \n\ncorrect *TypeArguments* production and is followed by a '`(`' token, then\
    \ the sequence of tokens is \n\nprocessed an *Arguments* production, and any other\
    \ possible interpretation is discarded. Otherwise, the \n\nsequence of tokens\
    \ is not considered an *Arguments* production. \n\nThis rule means that the call\
    \ to 'f' above is interpreted as a call with one argument, which is a call to\
    \ a \n\ngeneric function 'g' with two type arguments and one regular argument.\
    \ However, the statements \n\n`f(g < A, B > ``7``); `\n\n`f(g < A, B > +(``7``));\
    \ `\n\nare both interpreted as calls to 'f' with two arguments. \n\n4.16 Type\
    \ Assertions \n\nTypeScript extends the JavaScript expression grammar with the\
    \ ability to assert a type for an expression: \n\n*UnaryExpression:* *( Modified\
    \ )* \n\n… \n\n`<` *Type* `\\>` *UnaryExpression* \n\nA type assertion expression\
    \ consists of a type enclosed in `<` and `\\>` followed by a unary expression.\
    \ Type \n\nassertion expressions are purely a compile-time construct. Type assertions\
    \ are *not* checked at run-time \n\nand have no impact on the emitted JavaScript\
    \ (and therefore no run-time cost). The type and the \n\nenclosing `<` and `\\\
    >` are simply removed from the generated code."
