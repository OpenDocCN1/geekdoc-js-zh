  md: "33 \n\n \n\n \n\nType guards (section 4.24) may be used to narrow a union type\
    \ to a more specific type. In particular, type \n\nguards are useful for narrowing\
    \ union type values to a non-union type values. \n\nIn the example \n\n`var``\
    \ x: ``string`` | ``number``; `\n\n`var`` test: ``boolean``; `\n\n`x = ``\"hello\"\
    ``; ``// Ok`` `\n\n`x = ``42``; ``// Ok`` `\n\n`x = test; ``// Error, boolean\
    \ not assignable`` `\n\n`x = test ? ``5`` : ``\"five\"``; ``// Ok`` `\n\n`x =\
    \ test ? ``0`` : ``false``; ``// Error, number | boolean not asssignable`` `\n\
    \nit is possible to assign 'x' a value of type `string`, `number`, or the union\
    \ type `string | number`, but not any \n\nother type. To access a value in 'x',\
    \ a type guard can be used to first narrow the type of 'x' to either `string`\
    \ \n\nor `number`: \n\n`var`` n = ``typeof`` x === ``\"string\"`` ? x.length :\
    \ x; ``// Type of n is number`` `\n\nFor purposes of property access and function\
    \ calls, the apparent members (section 3.11.1) of a union type \n\nare those that\
    \ are present in every one of its constituent types, with types that are unions\
    \ of the \n\nrespective apparent members in the constituent types. The following\
    \ example illustrates the merging of \n\nmember types that occurs when union types\
    \ are created from object types. \n\n`interface`` A { `\n\n` a: ``string``; `\n\
    \n` b: ``number``; `\n\n`} `\n\n`interface`` B { `\n\n` a: ``number``; `\n\n`\
    \ b: ``number``; `\n\n` c: ``number``; `\n\n`} `\n\n`var`` x: A | B; `\n\n`var``\
    \ a = x.a; ``// a has type string | number`` `\n\n`var`` b = x.b; ``// b has type\
    \ number`` `\n\n`var`` c = x.c; ``// Error, no property c in union type `\n\n\
    Note that 'x.a' has a union type because the type of 'a' is different in 'A' and\
    \ 'B', whereas 'x.b' simply has \n\ntype number because that is the type of 'b'\
    \ in both 'A' and 'B'. Also note that there is no property 'x.c' \n\nbecause only\
    \ 'A' has a property 'c'. \n\nWhen used as a contextual type (section 4.23), a\
    \ union type has those members that are present in any of \n\nits constituent\
    \ types, with types that are unions of the respective members in the constituent\
    \ types."
