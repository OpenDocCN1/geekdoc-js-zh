  md: "34 \n\n \n\n \n\nSpecifically, a union type used as a contextual type has the\
    \ apparent members defined in section 3.11.1, \n\nexcept that a particular member\
    \ need only be present in one or more constituent types instead of all \n\nconstituent\
    \ types. \n\n3.5 Intersection Types \n\n***Intersection types*** represent values\
    \ that simultaneously have multiple types. A value of an intersection \n\ntype\
    \ *A* & *B* is a value that is *both* of type *A* and type *B*. Intersection types\
    \ are written using intersection \n\ntype literals (section 3.8.7). \n\nAn intersection\
    \ type encompasses an ordered set of constituent types. While it is generally\
    \ true that *A* & *B* \n\nis equivalent to *B* & *A*, the order of the constituent\
    \ types may matter when determining the call and \n\nconstruct signatures of the\
    \ intersection type. \n\nIntersection types have the following subtype relationships:\
    \ \n\n \n\nAn intersection type *I* is a subtype of a type *T* if any type in\
    \ *I* is a subtype of *T*. \n\n \n\nA type *T* is a subtype of an intersection\
    \ type *I* if *T* is a subtype of each type in *I*. \n\nSimilarly, intersection\
    \ types have the following assignability relationships: \n\n \n\nAn intersection\
    \ type *I* is assignable to a type *T* if any type in *I* is assignable to *T*.\
    \ \n\n \n\nA type *T* is assignable to an intersection type *I* if *T* is assignable\
    \ to each type in *I*. \n\nFor purposes of property access and function calls,\
    \ the apparent members (section 3.11.1) of an \n\nintersection type are those\
    \ that are present in one or more of its constituent types, with types that are\
    \ \n\nintersections of the respective apparent members in the constituent types.\
    \ The following examples \n\nillustrate the merging of member types that occurs\
    \ when intersection types are created from object types. \n\n`interface`` A {\
    \ a: ``number`` } `\n\n`interface`` B { b: ``number`` } `\n\n`var`` ab: A & B\
    \ = { a: ``1``, b: ``1`` }; `\n\n`var`` a: A = ab; ``// A & B assignable to A``\
    \ `\n\n`var`` b: B = ab; ``// A & B assignable to B`` `\n\n`interface`` X { p:\
    \ A } `\n\n`interface`` Y { p: B } `\n\n`var`` xy: X & Y = { p: ab }; ``// X &\
    \ Y has property p of type A & B`` `\n\n`type`` F1 = (a: ``string``, b: ``string``)\
    \ => ``void``; `\n\n`type`` F2 = (a: ``number``, b: ``number``) => ``void``; `\n\
    \n`var`` f: F1 & F2 = (a: ``string`` | ``number``, b: ``string`` | ``number``)\
    \ => { }; `\n\n`f(``\"hello\"``, ``\"world\"``); ``// Ok`` `\n\n`f(``1``, ``2``);\
