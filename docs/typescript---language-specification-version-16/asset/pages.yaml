    \ value?: ``string``): ``any`` { `\n\n` ``if`` (nameOrMap && ``typeof`` nameOrMap\
    \ === ``\"string\"``) { `\n\n` ``// handle string case`` `\n\n` } `\n\n` ``else``\
    \ { `\n\n` ``// handle map case`` `\n\n` } `\n\n`} `\n\nNote that each overload\
    \ and the final implementation specify the same identifier. The type of the local\
