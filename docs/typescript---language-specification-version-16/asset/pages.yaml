  md: "107 \n\n \n\n \n\n7 Interfaces \n\nInterfaces provide the ability to name and\
    \ parameterize object types and to compose existing named \n\nobject types into\
    \ new ones. \n\nInterfaces have no run-time representation—they are purely a compile-time\
    \ construct. Interfaces are \n\nparticularly useful for documenting and validating\
    \ the required shape of properties, objects passed as \n\nparameters, and objects\
    \ returned from functions. \n\nBecause TypeScript has a structural type system,\
    \ an interface type with a particular set of members is \n\nconsidered identical\
    \ to, and can be substituted for, another interface type or object type literal\
    \ with an \n\nidentical set of members (see section 3.11.2). \n\nClass declarations\
    \ may reference interfaces in their implements clause to validate that they provide\
    \ an \n\nimplementation of the interfaces. \n\n7.1 Interface Declarations \n\n\
    An interface declaration declares an ***interface type***. \n\n*InterfaceDeclaration:*\
    \ \n\n`interface` *BindingIdentifier* *TypeParameters**opt* *InterfaceExtendsClause**opt*\
    \ *ObjectType* \n\n*InterfaceExtendsClause:* \n\n`extends` *ClassOrInterfaceTypeList*\
    \ \n\n*ClassOrInterfaceTypeList:* \n\n*ClassOrInterfaceType* \n\n*ClassOrInterfaceTypeList*\
    \ `,` *ClassOrInterfaceType* \n\n*ClassOrInterfaceType:* \n\n*TypeReference* \n\
    \nAn *InterfaceDeclaration* introduces a named type (section 3.7) in the containing\
    \ declaration space. The \n\n*BindingIdentifier* of an interface declaration may\
    \ not be one of the predefined type names (section 3.8.1). \n\nAn interface may\
    \ optionally have type parameters (section 3.6.1) that serve as placeholders for\
    \ actual \n\ntypes to be provided when the interface is referenced in type references.\
    \ An interface with type \n\nparameters is called a ***generic interface***. The\
    \ type parameters of a generic interface declaration are in \n\nscope in the entire\
    \ declaration and may be referenced in the *InterfaceExtendsClause* and *ObjectType*\
    \ body. \n\nAn interface can inherit from zero or more ***base types*** which\
    \ are specified in the *InterfaceExtendsClause*. \n\nThe base types must be type\
    \ references to class or interface types."
