  md: "23 \n\n \n\n \n\n \n\nThe scope of a local var or function name declared anywhere\
    \ in the body of a function-like \n\ndeclaration is the body of that function-like\
    \ declaration. \n\n \n\nThe scope of a local let, const, class, interface, type\
    \ alias, or enum declaration declared \n\nimmediately within the body of a function-like\
    \ declaration is the body of that function-like \n\ndeclaration. \n\n \n\nThe\
    \ scope of a local let, const, class, interface, type alias, or enum declaration\
    \ declared \n\nimmediately within a statement block is the body of that statement\
    \ block. \n\nScopes may overlap, for example through nesting of namespaces and\
    \ functions. When the scopes of two \n\nnames overlap, the name with the innermost\
    \ declaration takes precedence and access to the outer name \n\nis either not\
    \ possible or only possible by qualification. \n\nWhen an identifier is resolved\
    \ as a *PrimaryExpression* (section 4.3), only names in scope with a value \n\n\
    meaning are considered and other names are ignored. \n\nWhen an identifier is\
    \ resolved as a *TypeName* (section 3.8.2), only names in scope with a type meaning\
    \ are \n\nconsidered and other names are ignored. \n\nWhen an identifier is resolved\
    \ as a *NamespaceName* (section 3.8.2), only names in scope with a \n\nnamespace\
    \ meaning are considered and other names are ignored. \n\nNote that class members\
    \ are never directly in scope—they can only be accessed by applying the dot ('.')\
    \ \n\noperator to a class instance. This even includes members of the current\
    \ instance in a constructor or \n\nmember function, which are accessed by applying\
    \ the dot operator to `this`. \n\nAs the rules above imply, locally declared entities\
    \ in a namespace are closer in scope than exported \n\nentities declared in other\
    \ namespace declarations for the same namespace. For example: \n\n`var`` x = ``1``;\
    \ `\n\n`namespace`` M { `\n\n` ``export`` ``var`` x = ``2``; `\n\n` console.log(x);\
