  mdcn: "\n\ndocument.getElementsByTagName 的工作方式与 `getById` 相同，但它需要一个标签名称（例如 `a`、`li`\
    \ 或 `ul`），而不是一个 ID。它将返回一个 `NodeList`，这本质上是一个来自 DOM 的元素列表或数组。\n\n例如，如果你只有如下的两个\
    \ `<p>` 元素：\n\nCode:\n```html\n<p>This is one paragraph</p>\n<p>This is another\
    \ paragraph</p>\n```\n\n那么你可以使用以下代码将这两个元素存储在 `paragraphs` 变量中：\n\nCode:\n```javascript\n\
    var paragraphs = document.getElementsByTagName(\"p\");\nalert(paragraphs[0].innerHTML);\n\
    alert(paragraphs[1].innerHTML);\n```\n\n`alert` 函数将显示第一个段落的内容，然后显示第二个段落的内容。\n\n\
    ## Class name\n\nDocument.getElementsByClassName 返回与标签名方法相同的列表。最大的区别在于，你必须传递一个匹配的类名，而不是标签名。\n\
    \n## CSS\n\n在现代浏览器中，有几个新方法供你使用，它们通过使用 CSS 选择器更轻松地选择元素。CSS 的语法为：`document.querySelector`\
    \ 和 `document.querySelectorAll`。\n\nCode:\n```javascript\nvar pageHeader = document.querySelector(\"\
    #example\");\nvar buttons = document.querySelectorAll(\".btn\");\n```\n\n`querySelector`\
    \ 的作用类似于通过 ID 搜索元素，它只会返回一个元素。但是，`querySelectorAll` 会返回一个 `NodeList`。因此，如果有多个元素匹配你的搜索标准，你就需要使用\
    \ `querySelector`，以便只获取返回的第一个元素，而不是所有元素。\n\n## 第 12 章：JavaScript 中的回调函数与事件 (Callbacks\
    \ and Events with JavaScript)\n\n位于浏览器内部的代码将是事件驱动的，当你编写交互式应用程序时，你必须等待并响应那些最终改变浏览器行为的事件。当页面加载或用户与页面上的某些内容交互时，就会发生事件。还有其他触发时间，但那些必须手动完成。\n\
    \n当你需要对事件做出响应时，你必须监听它以便提供一个函数。当事件发生时，浏览器会调用该函数，这被称为回调（callback）。\n\nCode:\n```javascript\n\
    var handleClick = function(event) {\n    // 选择不同的动作！\n};\n\nvar button = document.querySelector('#big-button');\n\
    button.addEventListener('click', handleClick);\n```\n\n`addEventListener` 是一个可以在所有\
    \ DOM 元素使用的方法。当它被调用时，元素将被保存在变量 `button` 中。字符串中第一个列出的参数是你应该监听的事件名称。这段代码中的事件是鼠标点击或手指轻触。回调是\
    \ `handleClick`。\n\n如果你在使用 Internet Explorer，且运行的版本早于版本 9，则不支持 `addEventListener`。在这种情况下，你应该改用\
    \ `attachEvent`。\n\nCode:\n```javascript\nbutton.attachEvent('onclick', handleClick);\n\
    ```\n\n如果你仔细看，会发现需要使用 `onclick` 而不是 `click`。这种情况在你遇到的大多数事件中都会发生。正是这样的对象创建了像 jQuery\
    \ 这样的库来帮助你，即使两个浏览器之间的监听方式不同，但得益于作为回调传递的事件，这并不重要。\n\n传递给任何特定事件的数据是一个回调。当你查看上面声明的\
    \ `handleClick` 时，你会发现参数 `event`（事件）是描述对象属性的地方。\n\nCode:\n```javascript\n{\n \
    \   offsetX: 74,\n    offsetY: 10,\n    pageX: 154,\n    pageY: 698,\n    target:\
    \ h2,\n    timestamp: 215897564812,\n    type: \"click\",\n    x: 154,\n    y:\
    \ 395\n}\n```\n\n## 第 13 章：JavaScript 中的 AJAX (AJAX with JavaScript)\n\n在进入这一节之前，非常重要的一点是，许多浏览器会自动阻止直接从用户机器调用的\
    \ AJAX。为了让 AJAX 正常工作，你需要一个 Web 托管主机或安装 localhost。\n\n当 Web 最初出现时，情况比现在简单。现在的页面有文本和样式，同时可能带有引导你进入不同网络页面的链接。要在页面上放置新内容，你必须从一个页面移动到另一个页面。网页开发者变得更有野心，试图让网页具有交互性。但显而易见，需要一种方法将新内容加载到页面，而不是每次都完全重新加载。\n\
    \n在获取新内容时，有一种名为 XHR 或 XML HTTP 请求的软件辅助。互联网应用程序使用 AJAX 应用。AJAX 的字母代表异步 JavaScript\
    \ 和 XML。大多数网页都能通过这种技术在无需重新加载页的情况下获取新内容。微软实际上在创建 Outlook 时决定使用 XML HTTP 请求。\n\n\
    ## XML HTTP 请求 (XML HTTP Request)\n\n你知道什么是 XML HTTP 请求，但它是如何显示的呢？\n\nCode:\n\
    ```javascript\nvar req = new XMLHttpRequest();\nreq.onload = function (event)\
    \ { ... };\nreq.open('get', 'some-file.txt', true);\nreq.send();\n```\n\n在创建 `XMLHttpRequest`\
    \ 时，你需要一个新的关键字来调用 `XMLHttpRequest`，类似于调用函数的方式。回调将在信息可用的时间点发生，然后会将该事件的输入传递到第一个参数。\n\
    \n数据将通过 `req.open` 提取。调度（dispatch）是 HTTP 技术。下一步是 URL 提取，它与链接的 `href` 属性相同。\n\n\
    下一个是布尔值，用于指定异步请求是否为 `true`。因此，`XMLHttpRequest` 将被触发，随后执行的代码将继续运行，直到系统给出答案导致回调被执行。\n\
    \n异步的参数默认为 `false`，这会导致代码执行暂停，直到请求到适当的数据，这被称为同步（synchronous）。同步 `XMLHttpRequest`\
    \ 很少使用，因为它向系统提供了有时需要很长时间加载的内容。最后一行允许网页拒绝对任何信息的请求。\n\n在使用 `XMLHttpRequest` 时，你可以在\
    \ HTTP 和 HTTPS 服务器上加载 JSON、XML、HTML 以及一系列文本，同时继续支持 FTP 等规则。最终，它们对于 JavaScript\
    \ 应用程序开发中涉及的一系列任务是非常有用的。\n\n## AJAX 与库 (AJAX and Libraries)\n\n用于 AJAX 的技术正在不断发展，因此现在有了单页应用程序，按需调出\
    \ JavaScript 脚本，从而允许异步加载任何其他需要从服务器加载的脚本。有整个库和框架是为了实现这一点而构建的。\n\n## 第 14 章：JSON\n\
    \nJSON 代表 JavaScript Object Notation（JavaScript 对象表示法）。这是一组文本格式规则，用于在机器中存储和移动数据，以便人类阅读。它看起来看起来类似于在\
    \ JavaScript 中使用的对象字面量语法，但这是 JSON 的起源。\n\nJSON 可能不是 JavaScript 官方代码的一部分，但它是 JavaScript\
    \ 的重要部分，所以虽然它是一种不同的语言，当它与 JavaScript 工作时，理解它的工作原理仍然非常重要。\n\n```json\n{ \"name\"\
    \ : \"Luke\", age: 894, \"lightsaber\" : { \"color\" : \"green\" }\n```\n\n就像普通的\
    \ JavaScript 代码一样，括号用于标记代码的特定部分。\n\n"
