    var one = '1';\nvar negativeNumberOne = -one; // 数字 -1\n```\n\n### 将真值/假值转换为布尔值\n\
    \n你可以使用 ‘!!’ 将真值或假值转换为布尔值 true。\n\n```javascript\n!!\"\" // false\n!!0 // false\n\
    !!null // false\n!!undefined // false\n!!NaN // false\n!!\"hello\" // true\n!!1\
    \ // true\n!!{} // true\n!![] // true\n```\n\n### 使用 JSON.Stringify\n\n假设有一个具有属性“prop1”、“prop2”、“prop3”的对象。可以向\
