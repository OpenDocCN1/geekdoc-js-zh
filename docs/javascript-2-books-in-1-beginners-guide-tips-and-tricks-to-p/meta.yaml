    To do this, you can utilize the eval() function however this bracket


    notation shorthand technique is much simpler than an evaluation


    Longhand:


    "myString".charAt(0);


    Shorthand:


    "myString"[0]; // Returns ''m''


    Strings convert to


    Numbers


    The fastest and easiest (jsPerf) way to do this would be using


    the + (plus) operator.


    var one = ''1'';


    var numberOne = +one; // Number 1'
