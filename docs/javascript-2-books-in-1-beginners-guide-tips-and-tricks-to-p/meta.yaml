    \ == 10 // 为 true\n'10' === 10 // 为 false\n[] == 0 // 为 true\n[] === 0 // 为 false\n\
    '' == false // 为 true 但 true == \"a\" 为 false\n'' === false // 为 false\n```\n\n\
    ### charAt() 简写\n\n要实现这一点，你可以利用 `eval()` 函数，但这种括号表示法的简写技术比求值要简单得多。\n\n完整形式：\n\
    `\"myString\".charAt(0);`\n\n简写形式：\n`\"myString\"[0]; // 返回 'm'`\n\n### 字符串转换为数字\n\
    \n实现此操作最快且简单（jsPerf）的方法是使用 +（加号）运算符。\n\n```javascript\nvar one = '1';\nvar numberOne\
