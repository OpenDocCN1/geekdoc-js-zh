    \  UserAgent.prototype.toString = function() {\n    return _toString.call(this).toUpperCase();\n\
    \  };\n})(UserAgent);\n\nvar userAgent = new UserAgent;\n\n// ...\n\n// EVILCORPBROWSER/1.2\
    \ (X11; LINUX; EN-US) BLINK/20420101\n\nuserAgent.toString();\n\nIn this case,\
    \ giving users access to your library’s namespace also gives you\nless control\
