    effect on different websites and programs.


    **So what makes a JavaScript Library?**


    Here are a few distinct features of a JavaScript Library:


    - It has one file or several files in a single folder


    - Its coding must be maintained separately and remain as-is when you use it


    to implement a project


    - It should allow the user to set project-specific behavior or configuration


    In this chapter, we will talk about why you should build a JavaScript library


    and how they are built- in the simplest ways possible.


    **Why build your own JavaScript Library?**


    Firstly, it makes things convenient for programmers and web developers alike,


    especially if you code and develop plenty of programs, websites, and web


    applications. Having a library with existing codes makes your job easier and


    saves you time since you do not need to keep digging up old projects from


    some obscure folder in your hard drive. All you just need to is pull it out of


    your library. You have a convenient place to store all your codes; you have a


    place to fragment all your applications and keep them all in an easier to


    maintain location.


    Essentially, any code that makes your work easier and which can be reused is a


    great component to be added to the library. One such good example is jQuery.


    jQuery’s API is a more simplified DOM API. Back when cross-browser DOM


    manipulation was difficult, jQuery was essential.'
