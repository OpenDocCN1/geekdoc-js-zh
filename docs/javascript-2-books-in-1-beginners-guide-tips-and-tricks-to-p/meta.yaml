    ## 引言


    恭喜你下载《JavaScript：初学者编程代码指南》，感谢你的支持。


    后续章节将讨论 JavaScript 以及你理解这种流行脚本语言所需要的所有知识。


    JavaScript 是一种复杂的语言，需要很多耐心来学习。然而，当你学会它时，你就可以为你开发的网页实现许多不同的功能，因为你的浏览器会执行你在网页页面上输入的
    JavaScript 代码。通过 JavaScript 提供的功能，你的网页可以变得更具交互性且更符合用户习惯。


    本书针对了解一些 HTML 和 CSS 的读者——因为 JavaScript 是一种与网页协作并处理网页的语言。如果你不熟悉这两项技术，市场上确实有几本书你可以查阅。但即使你本身不是程序员也没关系。你即使没有计算机编程背景也可以学习
    JavaScript。市场上上有许多关于此主题的 JavaScript 书籍，再次感谢你选择这一本！


    我们已尽力确保包含尽可能实用的信息，请尽用！


    ## 第一章：JavaScript……它是什么？它将带给我什么好处？


    JavaScript 是一种客户端脚本语言。这意味着该语言或代码被发送到用户的计算机，并在那里执行。这与 ASP.NET 或 PHP 等服务器端技术不同，在后者中，代码首先在
    Web 服务器上运行，然后将结果传递给用户的计算机。


    通过 JavaScript，你将与不同的网页交互，从而创建一个网络应用程序。Netscape Communications 在 1995 年首次实现了 JavaScript。


    在构建网页时，你通常会遇到三种主要语言之一的 JavaScript，另外两种是 HTML 和 CSS。所以，HTML 负责网页的内容和结构，CSS 负责页面的呈现（如指定背景颜色），而
    JavaScript 则充当页面交互和行为的编程语言。


    例如，当你在“联系我们”表单页面的字段中输入错误值时会发生什么？让网页具有交互性并执行 HTML 和 CSS 无法实现的额外功能的能力，让你发现 JavaScript
    对网站的用处。


    但我必须指出，JavaScript 的创建并不是为了作为一种通用的、万能的语言；它有其局限性。例如，它无法访问你的计算机文件系统，无法与数据库通信。但尽管如此，它在使网页交互化方面做得非常出色。


    JavaScript 经常与 Java 混淆，因为它们的名称非常相似；然而，它们并不是一回事。但好处是，它们可以在客户端（例如你的网络浏览器）上共同交互，因为它们可以直接嵌入网络源码中。


    每当你查看 JavaScript 的支持时，你都会惊讶地发现它几乎在处处可见。在 Firefox、Google Chrome 和 Safari 等浏览器中，如果你不确定你的浏览器是否是
    JavaScript 授权的厂商，可以去设置查看是否可以启用或禁用 JavaScript。如果可以，你的浏览器就获得了 JavaScript 授权。


