- md: "\ndocument.getElementsByTagName is going to work the same way that the getById\
    \ does but it is going to need a tag name such as a, li, or ul instead of having\
    \ an ID. It will then be returned to the NodeList which is basically a list or\
    \ array of elements from DOM.\n\nIf you have for example only two <p> elements\
    \ like this:\n\nCode:\n```html\n<p>This is one paragraph</p>\n<p>This is another\
    \ paragraph</p>\n```\n\nThen you can store these two elements in paragraphs variable\
    \ using:\n\nCode:\n```javascript\nvar paragraphs = document.getElementsByTagName(\"\
    p\");\nalert(paragraphs[0].innerHTML);\nalert(paragraphs[1].innerHTML);\n```\n\
    \nAlert functions will display the content of the first paragraph, and then the\
    \ content of the second paragraph.\n\n## Class name\n\nDocument.getElementsByClassName\
    \ will return the same list that the tag name method does. The biggest difference\
    \ is that you are going to have to pass a class name that will match instead of\
    \ a tag name.\n\n## CSS\n\nWith modern browsers, there are a few new methods available\
    \ for you to use that makes selecting elements easier through the use of a CSS\
    \ selector. The syntax for CSS is: document.querySelector and document.querySelectorAll.\n\
    \nCode:\n```javascript\nvar pageHeader = document.querySelector(\"#example\");\n\
    var buttons = document.querySelectorAll(\".btn\");\n```\n\nThe querySelector is\
    \ going to be like when you search for an element by the ID, you are going to\
    \ have only one element that is returned. But, queryAll is going to return the\
    \ NodeList. So, if multiple elements match your search criteria, then you are\
    \ going to need to use the querySelector so that you are only getting the first\
    \ one returned instead of all of them.\n\n## Chapter 12: Callbacks and Events\
    \ with JavaScript\n\nThe code that is located inside of a browser is going to\
    \ be event driven and when you are writing applications that are interactive,\
    \ you are going to have to wait for as well as react to the events that are going\
    \ to ultimately alter the behavior from the browser. An event is going to occur\
    \ when the page has been loaded, or the user has interacted with something on\
    \ the page. There are also other times that are going to be triggered, but these\
    \ have to be done manually.\n\nWhen you need to react to an event, you are going\
    \ to have to listen for it so that you can supply a function. The function is\
    \ going to be called by the browser whenever the event has occurred and it is\
    \ known as a callback.\n\nCode:\n```javascript\nvar handleClick = function(event)\
    \ {\n    // choose a different action !\n};\n\nvar button = document.querySelector('#big-button');\n\
    button.addEventListener('click', handleClick);\n```\n\naddEventListener is a method\
    \ that is going to be found on all of the DOM elements. When it is called upon,\
    \ the element is going to be saved in the variable of button. The argument that\
    \ is listed first in the string is going to be the name of the event that you\
    \ should be listening for. The event in this code is the tapping of a mouse or\
    \ someone’s finger. The callback is going to be the handleClick.\n\nIf you are\
    \ using Internet Explorer, addEventListener is not going to be supported if you\
    \ are running a version that is earlier than version 9. In that case, you should\
    \ use attachEvent instead.\n\nCode:\n```javascript\nbutton.attachEvent('onclick',\
    \ handleClick);\n```\n\nIf you look, you will notice that the onclick is required\
    \ over a click. This is going to happen for a majority of the events that you\
    \ come across. It is objects such as this that have created the libraries such\
    \ as jQuery to aid you so that even if the way of listening is different between\
    \ two browsers, it is not going to matter thanks to the event that was passed\
    \ as a callback.\n\nData for any particular event that has been passed is a callback.\
    \ When you look at the handleClick that was declared above, you are going to realize\
    \ that the argument or the event is going to be where the object’s properties\
    \ are described.\n\nCode:\n```javascript\n{\n    offsetX: 74,\n    offsetY: 10,\n\
    \    pageX: 154,\n    pageY: 698,\n    target: h2,\n    timestamp: 215897564812,\n\
    \    type: \"click\",\n    x: 154,\n    y: 395\n}\n```\n\n## Chapter 13: AJAX\
    \ with JavaScript\n\nBefore moving to this section, it is very important to notice\
    \ that a lot of browsers automatically block AJAX, if it is invoked directly from\
    \ a user's machine. In order for AJAX to work properly, you will either need a\
    \ webhost or localhost installed.\n\nWhenever the web first came around, things\
    \ were simpler than they are now. The page now has text and styles while possibly\
    \ having links that are going to take you to a different web page. To put new\
    \ content on a page, you have to move it from one page to another. The developers\
    \ of web pages have been more ambitious trying to get web pages to be interactive.\
    \ But, it is obvious that new content needs a new way to be loaded onto the page\
    \ without fully reloading the page each time.\n\nIn retrieving new content, there\
    \ is software that will help known as XHR or XML HTTP Request that is applied.\
    \ Applications for the internet use AJAX applications. The letters of AJAX mean\
    \ Asynchronous JavaScript and XML. Most web pages are going to be able to pull\
    \ the new content without having to reload the page with this technique. Microsoft\
    \ is actually the one who decided that XML HTTP Request should be used when they\
    \ were creating Outlook.\n\n## XML HTTP Request\n\nYou know what XML HTTP Request\
    \ is, but how is it displayed?\n\nCode:\n```javascript\nvar req = new XMLHttpRequest();\n\
    req.onload = function (event) { ... };\nreq.open('get', 'some-file.txt', true);\n\
    req.send();\n```\n\nWhen creating a XMLHttpRequest, you are going to need a new\
    \ keyword that is going to call upon XMLHttpRequest similar to how a function\
    \ is called upon. The callback will happen at the point in time that the information\
    \ has been made available and then it will skip the input from that event into\
    \ the first argument.\n\nThe data is going to be extracted by using req.open.\
    \ The dispatch will be the HTTP technique. Next is going to be the URL fetch that\
    \ will be identical to the aspect of a link by href.\n\nThe next one will be a\
    \ Boolean that is going to specify if the request of asynchronous can be found\
    \ as true. therefore, the XMLHttpRequest will be fired off and then the code that\
    \ is executed will continue to be executed until there is an answer from the system\
    \ that cause the callback to be executed.\n\nThe parameters for an asynchronous\
    \ is going to be defaulted to false which is going to cause the execution of the\
    \ code to be paused until the appropriate data has been requested which is called\
    \ synchronous. Synchronous XMLHttpRequest are very rarely used which is an offer\
    \ to the system that can sometimes take a long time to load. The last line is\
    \ going to allow the web page to deny the request for any information.\n\nIn using\
    \ XMLHttpRequest, you are going to be able to load JSON, XML, HTML, and a series\
    \ of text over the HTTP and HTTPS servers while continuing to support rules such\
    \ as FTP. Ultimately they are useful when it comes to a range of tasks that are\
    \ going to be involved in the development of JavaScript applications.\n\n## AJAX\
    \ and Libraries\n\nTechniques used with AJAX are being created so that there are\
