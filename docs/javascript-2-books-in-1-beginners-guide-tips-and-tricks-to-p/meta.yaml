    Miles: 5023

    } ) ;

    ```


    `JSON.stringify` 将把一个对象转换为 JSON 字符串。如代码所示，`jsonString` 将变为 `{ "make": "McLaren",
    "model": "MP4-12C", "miles": 5023 }`。


    代码：


    ```javascript

    var car = JSON.parse(jsonString);

    ```


    `JSON.parse` 允许字符串被转换为 JavaScript 对象，其中 `car` 现在是一个 JavaScript 对象，你可以在设置属性的地方使用它。


    代码：


    ```javascript

    car.model = "P1";

