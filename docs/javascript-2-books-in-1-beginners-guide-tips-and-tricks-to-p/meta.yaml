- img_proc: true
  md: '**Chapter 1:**


    **JavaScript…What is it and How**


    **will it Benefit me?**


    JavaScript is a client-side, scripting language. What this means is that the


    language or code is sent to a user’s computer and it executes the code there.


    This is in contrast with server-side technologies such as ASP.NET or PHP


    where the code is being run on the web server first before the results are


    delivered to the user’s computer.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'With JavaScript you are going to be interacting with different web pages so


    that you are able to create a web application. Netscape Communications first


    implemented JavaScript in 1995.


    In building web pages, you usually come across JavaScript as part of the three


    main languages being used, with the other two being HTML and CSS.


    So while HTML does the content and structure of web pages and CSS works


    on the presentation of the page like specifying its background color, it is


    JavaScript that functions as the programming language for the interactivity and


    behavior on the page.


    For example, what happens when you type the wrong value in a form field on a


    Contact Us form page? The ability to make a web page interactive and


    perform added functionality that HTML and CSS cannot do makes you


    discover the usefulness of JavaScript for a website.


    Let me point out though that JavaScript wasn’t created to be used as a general,


    do-it-all language; it has it limits. For instance, it cannot have access to your


    computer’s file system nor communicate with a database. But while this is the


    case, what it does in terms of making web pages interactive, it does really


    well.


    JavaScript is easily confused with Java because the two of them have very


    similar names; however, they are not the same thing. The good thing though is


    that it can interact together on the client side like your web browser for


    instance, because they can be embedded directly into the web source.


    Whenever you are looking at where JavaScript is supported, you are going to


    be surprised to find that it is supported almost everywhere. In browsers such


    as Firefox, Google Chrome, and Safari, if you are unsure if your browser is a


    vendor that has been licensed by JavaScript, you can go to your settings and


    see if you can enable or disable JavaScript. If you can, then your browser was


    licensed by JavaScript.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '**Benefits**


    Knowing JavaScript is going to benefit you in being able to either advance you


    in your career or find a different career. If you want to go into I.T. or even
    web


    design, JavaScript is a must.


    Should you already have a job in one of these areas, you are going to be able
    to


    advance in your career because you have furthered your knowledge in


    something that is going to be beneficial to you.


    JavaScript is not only good if you are in I.T. or web design. JavaScript can be


    used in any job, if you are unsure if it can be used in your job, ask your boss.


    Showing an initiative to learn beyond what your job calls for is going to


    impress your boss and earn you favor.'
