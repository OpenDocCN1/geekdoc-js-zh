    一种更易于管理的语言。


    微软公司去年积极推行 .NET，因为它开源了许多元素，并努力让微软工具对开发者来说更易用。在重写之后，团队希望解决 Angular 1 应用中出现的任何升级问题，而且到目前为止性能非常出色。Angular
    2 的开发是为了支持 Web 组件，根据 Google 的说法，它是 Web 开发的未来。然而，AngularJS 社区对 Angular 采取的发展方向持有不同意见——尽管
    Angular 团队已经投入了大量精力帮助开发者从 Angular 1 顺利过渡到 Angular 2。


    这次重写也让 React 得以发展和成熟，其社区日益壮大。正因如此，程序员怀疑 Angular 2 是否会像 Angular 1 那样成功。然而，如上述所示，科技世界是不断变化的，因此
    Angular 2 可能在 2017 年有增长空间。Angular 2 仍然被视为 React 应用的备选方案。


    ## Meteor


    另一个值得关注的趋势是 Meteor，它一直保持着稳定的下载量和 GitHub 星数。它与 React 和 Angular 集成良好，并具有许多巧妙的功能。作为一个轻量级的全栈
    JavaScript 框架，开发者发现 Meteor 框架用起来非常愉快。Meteor 一直被认为是一个可靠的初学者框架，也非常适合原型设计。


    阻碍 Meteor 成为主流成功的是随着时间推移不断出现的隐藏复杂性，特别是在生产环境中。尽管 Meteor 募集了大量资金，但它并没有像 React 和
    AngularJS 那样拥有庞大工程师标准的领先科技企业支持。尽管 AngularJS 有很多问题，但它有 Google 支撑；另一方面，Meteor 被认为是一项投资风险，因为它是一个兼顾后端和前端开发的框架。为了最大限地利用部署的便利性，Meteor
    还需要托管。


    目前让 Meteor 不尽理想的另一个问题是，许多开发者并不喜欢 MongoDB，而 Mongo 正是 Meteor 的默认数据库。Meteor 在 2017
    年可能仍是一个不错的选择，因为更多开发者可能会等待更可靠的证据，证明 Meteor 可用于大型且更复杂的应用开发。不言而喻，Meteor 在 2016 年甚至
    2017 年可能仍保持小众化。大多数专业开发者将等待任何关于它可以用于开发大型、复杂应用的证据。


    ## ES6 终于到来


    JavaScript 开发者在 2016 年迈向 2017 年期间要做的事情之一，是确保他们所有的应用符合 ES2015 标准。但就像科技应用和编程语言中的许多其他问题一样，我们面临着
    Babel 与 TypeScript 问题。


    Babel 主要将 ES6 代码翻译为 ES5，而 TypeScript 实际上是 JavaScript 的超集，它为 JavaScript 添加了必要但可选的静态类型，然后将所有内容编译为纯
    JavaScript。Babel 和 TypeScript 的创建目的完全不同，因此没有可比性。


    由 Facebook 开发的 Babel 支持 Flow，Flow 也为 JavaScript 添加了静态类型检查。使用 Babel 稍微更有意义，因为你可以连续使用这两种。Babel
    也是第一个帮助桥接 ES5 和 ES6 应用之间差异的工具。


    另一方面，TypeScript 只支持 ES6，因此在演进性方面次于 Babel。查看 GitHub 星数发现，Babel 是最受欢迎的转换器。React
    开发者也倾向于使用 Babel + Webpack 的组合。


    尽管有星数支持，TypeScript 似乎要可行得多，且有时甚至是更青睐的选择，特别是当你正在寻找一种能让你的 JavaScript 代码库更易于管理的解决方案时。JavaScript
    一直以来被认为是一种难以阅读的语言，由于其弱类型检查系统，这使得调试变得更加困难。因此在支持方面，TypeScript 的追随者比 Flow 多。


    下图显示了 Google 趋势图，展示了对 TypeScript 兴趣的增长。


    TypeScript 可能流行的另一个原因是 Angular 2，但并仅仅因为 JavaScript 应用受到更多关注，这并不是 TypeScript 流行的流行的贡献原因。


    虽然 Redux 让测试变得简单得多，但 TypeScript 让代码库变得更易维护。除外，Google、Facebook 和微软正在合作为 JavaScript
    添加静态类型，从而为 ECMAScript 铺平道路。


    与此同时，Google 放弃了 Script 和 AngularJS，转而采用微软的 TypeScript。另一方面，Facebook 的 Flow 并没有像
    TypeScript 那样的社区普及度。


    这表明静态类型 JavaScript 是一个活跃且不断增长的趋势，即使是 JavaScript 的不信者也会认可，而 TypeScript 是最可靠的解决方案。


    ## 函数式编程正成为主流


    许多函数式编程平台正在进入主流编程领域，但最近，“函数式编程模型”引起了大量关注，特别是随着复杂 Web 应用的兴起。


    **Scala** 回成为想要拥抱函数式编程的后端开发者的喜爱语言。然而，Facebook 的 React 则鼓励前端 JavaScript 开发者使用一种实用的方法来承担
    UI 开发。


    对于函数式编程的积极反馈越来越多，看起来它可能将在 2017 年成为主流。在此时，前端 Web 开发正处于响应式和函数式编程的前沿。


    因此，React+Redux 方案对于那些熟悉面向对象编程的人来说，确实是最受青睐的初学者友好解决方案。换句话说，React 只需要开发者对 UI 使用函数式方法，而
    Redux 主要是一个鼓励使用实用方法处理数据的系统。所有其他事情都以 OOP 风格完成。


    ## RxJS


    但对于那些仍然想坚持完全函数式响应式编程（被认为是“真正的”FRP）并且仍然想使用 JavaScript 的人，RxJS 是一项必须学习的技能。RxJS 是
    JavaScript 的响应式扩展，可以取代 Flux 架构。对于简单小小的应用，这听起来可能过过了，但实际上，它为通过复杂处理流的 Web 应用构建了强大的基础。


    Netflix 使用 RxJS，而 Angular 2 也依赖 RxJS。由微软开发的 RxJS 与 TypeScript 配合得非常完美，因此开发者可以预期
    RxJS 将继续改进。


    然而，学习 RxJS 是一个完全不同的领域。它具有陡峭的学习曲线，导致大多数开发者放弃在 JavaScript 中进行任何 FRP，转而选择其他与 JavaScript
    兼容的函数式编程语言。


    开发者选择替代 RxJS 的一些兼容编程是 ClojureScript 和 Elm。然而，所有这些程序的增长和流行与 Redux+React 相比都显得黯然逊色。


    问题在于，考虑到函数式编程如何完美地解决 Web 开发中的现代问题，人们必须承认函数式编程范式及其等概念将作为 JavaScript 开发者需要掌握和学习的技能持续存在。


    ## 桌面框架对决：Nw.js vs. Electron


    如今数据需要从各种平台（如桌面和移动）同步数据。然而，许多服务大多以 Web 应用的形式开始，然后转换为桌面应用以增强用户体验。这样做是因为 Web 应用的开发快得多且更容易更新。此外，用户还可以更快速地尝试
    Web 应用，而无需安装任何其他东西。


    过去，开发者如果想使用 Web 技术为桌面应用创建前端 UI，受限于使用 CEF。这不是一个容易的过程，而且应用程序本身并不是真正的跨平台兼容。尽管如此，Node.js
    让桌面框架的跨平台应用变得更加简单。使用 Web 技术进行桌面应用开发的趋势开始兴起。

