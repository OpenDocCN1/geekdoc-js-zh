    \n```javascript\nfunction selectedProperties(key, val) {\n  //第一个 val 是整个对象，key\
    \ 是空字符串\n  if (!key) {\n    return val;\n  }\n  if (key === 'prop1' || key ===\
    \ 'prop2') {\n    return val;\n  }\n  return;\n}\n```\n\n最后一个可选参数用于修改将对象写入字符串的方式。\n\
    \n```javascript\nvar str = JSON.stringify(obj, selectedProperties, '\\t\\t');\n\
    /* str 输出在每行都有双制表符。\n{\n  \"prop1\": \"value1\",\n  \"prop2\": \"value2\"\n}\n\
    */\n```\n\n### 数组和写入单个元素的单一方法\n\n与其编写单独的方法来存放数组和单个元素参数，你可以编写函数使其能够同时处理两者。\n\n\
