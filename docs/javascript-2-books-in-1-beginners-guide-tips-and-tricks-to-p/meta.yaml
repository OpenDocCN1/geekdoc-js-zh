- img_proc: true
  md: 'The variables that you declare in JavaScript can use the strings that are stored


    along with any numbers that are stored. But, when you are doing math,


    JavaScript is going to focus mainly on numbers.


    In your script, you are going to create two different variables with two


    different numbers.


    Code:


    var apples = 5, oranges = 10;


