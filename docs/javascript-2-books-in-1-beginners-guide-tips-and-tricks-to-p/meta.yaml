    ## Introduction


    Congratulations on downloading *JavaScript: Beginner’s Guide to Programming Code
    with JavaScript* and thanks for doing so.


    The following chapters will discuss JavaScript and everything that you need to
    know to understand this popular scripting language.


    JavaScript is a complex language that is going to take a lot of patience to learn.
    However, when you do learn it, you are going to be able to do a lot of different
    things for the web pages you develop as your browser executes the JavaScript code
    you have inputted on your web pages. With JavaScript, your web pages can become
    more interactive and more user-friendly with the functionality it provides.


    This book is targeted to readers who know some HTML and CSS – since JavaScript
    is a language that works with and handles web pages. If you aren’t familiar with
    both technologies, there are definitely several titles out there that you can
    check out. But even if you are not a programmer per se, this is fine. You can
    learn JavaScript even without a computer programming background. There are plenty
    of JavaScript books on this subject on the market, so thanks again for choosing
    this one!


    Every effort was made to ensure it is full of as much useful information as possible,
    please enjoy!


    ## Chapter 1: JavaScript…What is it and How will it Benefit me?


    JavaScript is a client-side, scripting language. What this means is that the language
    or code is sent to a user’s computer and it executes the code there. This is in
    contrast with server-side technologies such as ASP.NET or PHP where the code is
    being run on the web server first before the results are delivered to the user’s
    computer.


    With JavaScript you are going to be interacting with different web pages so that
    you are able to create a web application. Netscape Communications first implemented
    JavaScript in 1995.


    In building web pages, you usually come across JavaScript as part of the three
    main languages being used, with the other two being HTML and CSS. So while HTML
    does the content and structure of web pages and CSS works on the presentation
    of the page like specifying its background color, it is JavaScript that functions
    as the programming language for the interactivity and behavior on the page.


    For example, what happens when you type the wrong value in a form field on a Contact
    Us form page? The ability to make a web page interactive and perform added functionality
    that HTML and CSS cannot do makes you discover the usefulness of JavaScript for
    a website.


    Let me point out though that JavaScript wasn’t created to be used as a general,
    do-it-all language; it has it limits. For instance, it cannot have access to your
    computer’s file system nor communicate with a database. But while this is the
    case, what it does in terms of making web pages interactive, it does really well.


    JavaScript is easily confused with Java because the two of them have very similar
    names; however, they are not the same thing. The good thing though is that it
    can interact together on the client side like your web browser for instance, because
    they can be embedded directly into the web source.


    Whenever you are looking at where JavaScript is supported, you are going to be
    surprised to find that it is supported almost everywhere. In browsers such as
    Firefox, Google Chrome, and Safari, if you are unsure if your browser is a vendor
    that has been licensed by JavaScript, you can go to your settings and see if you
    can enable or disable JavaScript. If you can, then your browser was licensed by
    JavaScript.

