    ## Chapter 15: Scopes with JavaScript


    A scope is going to be the term that will determine what the variable visibility
    is. The variables scope is going to be the part of the code that is going to access
    as well as modify the variable. There is a function scope that is going to be
    used with JavaScript.


    Scope going to be dictated by the block of code where the variable has been declared.
    The block will be anything that is contained inside of two curly brackets or is
    indented.


    Code:


    ```javascript

    var a = 10 ;

    if(a > 5) {

    var b = 5;

    }

    var c = a + b; // this is bad programming practice!

    ```


    Global variables are going to be read and modified wherever you put them in your
    application, but they are not going to be the best to use because they are going
    to expose the security issues in the code which is ultimately going to make the
    code harder to maintain.


    It is important to remember that your code needs to read more than it is written.
    Whenever code is read by a human but is unable to be determined as to where the
    variable has come from or what potential values there are, you are going to have
    a problem.


    You are going to get your best results when you limit the scope of the variable
    as much as you possibly can which will make it visible to as few parts of the
    code as possible.


    ### Function scope


    Since JavaScript does things differently, it is going to use a function scope.
    A function scope is going to mean that the variables will not be visible when
    they are outside of the function where they were declared. If they have not been
    declared in a function, then they are going to be visible globally.


    Code:


    ```javascript

    var doSomething = function() {

    var a = 10 ;

    } ;

    doSomething () ;

    console.log(a) // this shows that a has been undefined.

    ```


    ### Child scopes


    Variables are also going to come in child scopes that will have their own scopes.
    For the code, if the doSomethingElse is a child of the doSomething function then
    the variable "a" will be visible when it is placed inside of doSomethingElse.


    Code:


    ```javascript

    var doSomething = function() {

    var a = 10;

    var doSomethingElse = function() {

    console.log(a); // a will be 10

    } ;

    doSomethingElse ();

    } ;

    doSomething() ;

    ```


    Functional scopes are going to be very powerful tools when it comes to creating
    elegant codes, but it takes a while to actually get the hang of it.


    ## Chapter 16: jQuery in JavaScript


    There is going to be a set of tools that is going to be used when modifying and
    controlling the DOM. This is a little bit messy though because there are different
    DOMs across the browser types. So that you can make the coding experience simpler,
    there are a large amount of resources that have been set up so the large mistakes
    are hidden and it makes a more uniform way for when it interacts with the DOM.
    Most of the time it is also going to provide the AJAX functionality which will
    then take the stress of how complex coding is away.


    jQuery is a well-known DOM library that is going to be used across a variety of
    pages. But, the process you use to communicate with the DOM will be called an
    Application Programming Interface or API.


    jQuery is going to have a syntax that is very distinctive because it is going
    to be based on the dollar symbol.


    Code:


    ```javascript

    $(''.btn'').click (

    function() {

    // choose a different action

    }

    ) ;

    ```


    The code for this is going to attach to the click handler of all the elements
    that are listed in the btn class. The selector syntax will be the core of jQuery.
    jQuery can be placed on the website with the file like a scripting element. You
    can pull the file from jquery.com or you can add from a CDN.


    Code:


    ```html

    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js"></script>

    ```


    You should not always use a library, but you should choose if it is going to have
    a structure that is established on the product of the developers choosing. For
    example, if jQuery has an extensive document that needs to be introduced, then
    the downloading is going to be slow for the page, especially when it comes to
    mobile browsers that might have weak connections.


    ## Chapter 17: jQuery DOMs and APIs


    When elements are selected and then interacting with the DOM, jQuery is most likely
    going to be used. Thankfully, it is easy for you to be able to use since the syntax
    is simple when it comes to choosing an element or even a set of elements. This
    is almost exactly like the CSS.


    jQuery allows the performance of actions that are done on elements to be done
    at the same time which saves some time in your coding process.


    The $(''.note'') is going to be selecting all of the elements that has "note"
    class.


    Code:


    ```javascript

    $(''.note'').css(''background'', ''red'').height(100);

    ```


    jQuery has a syntax that is chainable which will work when you are setting any
    kind of method. jQuery will return the same element as the selector function.
    The dollar sign is going to be a function that helps to return a jQuery wrapped
    that is around an element. The .css method is going to change the background color
    to red and .height sets the height of the element that you have selected. There
    is also one that can be used for the width.


    ### Getters and Setters


    As shown above, the .css and .height are going to be there to set the value for
    the element, but these methods are also known as getters. When you call on the
    .height without having any value to be set, then the current height of the element
    will call the .css with a simple CSS property to retrieve the value of the property.


    Code:


    ```javascript

    var currentHeight = $(''.note'').height(),

    currentColor = $ (''.note'').css(''color'') ;

    ```


    When there is more than one element that has been selected, then the getter is
    going to retrieve the value for the first one of them.


    ### Context


    There are going to be times that the DOM needs to be limited from where the element
    can be selected. The area for the DOM being used is going to be known as a different
    context.


    You will need to tell the jQuery the area that you want selected form the second
    argument that will be a DOM element or a string selector or even a jQuery object.
    The jQuery is only going to search for the context with your selector and nothing
    else.


    Code:


    ```javascript

    var $header = $(''header''),

    $headerBoxes = $(''.note'' , $header);

    ```


    ## Chapter 18: jQuery and AJAX


    There are some AJAX helper methods when it comes to jQuery that are going to allow
    you to save time and make your code painless to look at. They are going to be
    methods of the $ variable: $.get, $.post, and $.ajax. The . AJAX strategies will
    be the primary technique that is going to be the main method you will use in order
    to construct the AJAX request. The other methods are going to be used as shortcuts
    for configurations such as getting data or posting it.


    Code:


    ```javascript

    $.ajax( {

    url: ''/data.json'',

    method: ''GET'',

    success: function (data) {

    console.log(data);

    }

    } ) ;

    ```


    The configuration of an object is going to be used whenever jQuery needs to retrieve
