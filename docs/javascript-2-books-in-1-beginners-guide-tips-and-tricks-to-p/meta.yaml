    even preferred choice especially if you are looking for a solution to make your
    JavaScript codebase much more manageable. JavaScript has always been known to
    be a difficult to read language making it even more difficult to debug, due to
    its weak type-checking system. So in terms of support, TypeScript has enjoyed
    a larger following than Flow.


    The graph below shows the Google Trends Graph showing the growth of interest for
    TypeScript.


    Another reason that TypeScript could be getting popular is because of Angular
    2, but just because JavaScript apps get larger focus, that isn’t the contributing
    reason of why TypeScript becomes popular.


    While Redux has made testing much easier, TypeScript makes codebase a lot easier
    to maintain. Apart from this, Google, Facebook, and Microsoft are collaborating
    to add on static typing to JavaScript and thus paving the way to ECMAScript.


    At the same time, Google dropped Script and AngularJS in favor for TypeScript
    by Microsoft. Flow by Facebook, on the other hand, doesn’t have the same community
    popularity as TypeScript.


    This goes to show that statically typed JavaScript is an active and growing trend
    that even JavaScript non-believers will approve of where TypeScript is the most
    solid solution.


    ## Functional Programming is Becoming Mainstream


    Plenty of functional programming platforms have been making their way into mainstream
    programming but very recently, the ‘functional programming model’ has gained plenty
    of attention especially with the rise of complex web apps.


    **Scala** is coming back as a favored language among backend developers who want
    to embrace functional programming. However, Facebook’s React, on the other hand,
    has encouraged front-end JavaScript developers to take on UI development using
    a practical approach.


    More and more positive feedback is coming in for functional programming, and it
    looks like it will become mainstream in 2017. At this point of time, front-end
    web development is taking the forefront in reactive and functional programming.


    So the React+Redux agenda is really the most sought after beginner-friendly solution
    for those that are comfortable with programming that is object-oriented. In other
    words, React only needs developers to take a functional approach to UI whereas
    Redux is mostly a system that encourages a practical approach to handling data.
    All other things are done in the OOP-style.


    ## RxJS


    But for those who still want to go on track with the full-on functional reactive
    programming, which is considered the ‘true’ FRP and still want to use JavaScript,
    then RxJS is a necessary skill to learn. RxJS is an extension of JavaScript that
    is reactive that can be used to replace the Flux architecture. It may sound like
    overkill for simple and small apps but in truth, it builds a powerful foundation
    for web applications that will go through a complicated stream of processing.


    Netflix uses RxJS while Angular 2 also relies on RxJS. Developed by Microsoft,
    RxJS works incredibly well with TypeScript thus developers can expect that RxJS
    will continue to be improved.


    Learning RxJS though is an entirely different arena. It has a steep learning curve
    that make most developers give up on doing any FRP in JavaScript and pick up other
    functional programming languages that are compatible with JavaScript.


    Some of the compatible programming that developers choose to use instead of RxJS
    is ClojureScript and Elm. However all these program’s growth and popularity pales
    in comparison with Redux+React.


    The thing is, looking at how functional programming fits perfectly with addressing
    modern issues in web development, one has to agree that functional programming
    paradigm and its equivalent concepts will stick around as a necessary skill that
    JavaScript developers will need to harness and learn.


    ## Desktop Framework Showdown: Nw.js vs. Electron


    Plenty of data nowadays requires synchronizing data from various platforms such
    as a desktop and mobile. However, many services mostly start out as web apps before
    they are converted as desktop apps for enhanced user-experience. It is done this
    way because web app developments are a lot faster and more easily updated. Above
    all, users can also try out web apps more instantly without having to install
    anything else.


    Developers in the past were confined to using CEF if they wanted to use web technologies
    to create front-end UI for desktop apps. Not an easy process and the apps themselves
    weren’t truly cross-platform compatible. Though that, Node.js has made cross-platform
    apps easier for desktop frameworks. The shift of using web technologies for desktop
    app development began to rise.

