    \ i++) {\n    console.log(elements[i].toUpperCase());\n  }\n}\n```\n\nprintUpperCase\
    \ 现在准备好接受单个节点或节点数组作为其参数。它还避免了未传递参数时可能抛出的潜在 TypeError。\n\n```javascript\nprintUpperCase(\"\
