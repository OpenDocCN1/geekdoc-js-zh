  md: '**Introduction**


    Congratulations on downloading *JavaScript: Beginner’s Guide to*


    *Programming Code with JavaScript* and thanks for doing so.


    The following chapters will discuss JavaScript and everything that you need to


    know to understand this popular scripting language.


    JavaScript is a complex language that is going to take a lot of patience to learn.


    However, when you do learn it, you are going to be able to do a lot of different


    things for the web pages you develop as your browser executes the JavaScript


    code you have inputted on your web pages. With JavaScript, your web pages


    can become more interactive and more user-friendly with the functionality it


    provides.


    This book is targeted to readers who know some HTML and CSS – since


    JavaScript is a language that works with and handles web pages. If you aren’t


    familiar with both technologies, there are definitely several titles out there
    that


    you can check out. But even if you are not a programmer per se, this is fine.


    You can learn JavaScript even without a computer programming background.


    There are plenty of JavaScript books on this subject on the market, so thanks


    again for choosing this one!


    Every effort was made to ensure it is full of as much useful information as


    possible, please enjoy!'
