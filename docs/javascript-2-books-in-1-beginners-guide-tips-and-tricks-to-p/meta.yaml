  md: '**About the Author**


    Charlie Masterson is a computer programmer and instructor who have


    developed several applications and computer programs.


    As a computer science student, he got interested in programming early but got


    frustrated learning the highly complex subject matter.


    Charlie wanted a teaching method that he could easily learn from and develop


    his programming skills. He soon discovered a teaching series that made him


    learn faster and better.


    Applying the same approach, Charlie successfully learned different


    programming languages and is now teaching the subject matter through writing


    books.


    With the books that he writes on computer programming, he hopes to provide


    great value and help readers interested to learn computer-related topics.'
