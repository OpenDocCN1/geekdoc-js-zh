- md: "\nNow you have your library available for everyone to use in their Node projects\
    \ or on the web!\n\n**Conclusion**\n\nRemember that your code development is the\
    \ library. Make sure your library solves a problem, it is convenient and easy\
    \ to use and above all stable. This will ensure that you and many other developers\
    \ who use it are happy.\n\nThe tasks explained above are easily automated such\
    \ as running tests and creating tags, updating your versions and publishing your\
    \ packages.\n\n## Chapter 4: JavaScript Tips & Tricks to Keep and Remember\n\n\
    In this chapter, we will look into some short and useful tips related to improving\
    \ your JavaScript skills and enhancing your code writing.\n\n### USING === Instead\
    \ of ==\n\nThe == (or !=) operator performs an automatic type conversion if needed.\
    \ The === (or !==) operator will not perform any conversion. \n\nWhat it will\
    \ do is compare the value and the type, which could be considered faster (jsPerf)\
    \ than ==.\n\n```javascript\n[10] == 10 // is true\n[10] === 10 // is false\n\
    '10' == 10 // is true\n'10' === 10 // is false\n[] == 0 // is true\n[] === 0 //\
    \ is false\n'' == false // is true but true == \"a\" is false\n'' === false //\
    \ is false\n```\n\n### charAt() Shorthand\n\nTo do this, you can utilize the eval()\
    \ function however this bracket notation shorthand technique is much simpler than\
    \ an evaluation.\n\nLonghand:\n`\"myString\".charAt(0);`\n\nShorthand:\n`\"myString\"\
    [0]; // Returns 'm'`\n\n### Strings convert to Numbers\n\nThe fastest and easiest\
    \ (jsPerf) way to do this would be using the + (plus) operator.\n\n```javascript\n\
    var one = '1';\nvar numberOne = +one; // Number 1\n```\n\nYou can also use the\
    \ - (minus) operator which type-converts the value into number but also negates\
    \ it.\n\n```javascript\nvar one = '1';\nvar negativeNumberOne = -one; // Number\
    \ -1\n```\n\n### Truthy/falsy values converted to boolean\n\nYou can convert a\
    \ Truthy or Falsy value to true boolean with ‘!!’\n\n```javascript\n!!\"\" //\
    \ false\n!!0 // false\n!!null // false\n!!undefined // false\n!!NaN // false\n\
    !!\"hello\" // true\n!!1 // true\n!!{} // true\n!![] // true\n```\n\n### Using\
    \ JSON.Stringify\n\nLet’s say there is an object with properties “prop1”, “prop2”,\
    \ “prop3”. Additional params can be passed to **JSON.stringify** to selectively\
    \ write properties of the object to string like:\n\n```javascript\nvar obj = {\n\
    \  'prop1': 'value1',\n  'prop2': 'value2',\n  'prop3': 'value3'\n};\nvar selectedProperties\
    \ = ['prop1', 'prop2'];\nvar str = JSON.stringify(obj, selectedProperties);\n\
    // str\n// {\"prop1\":\"value1\",\"prop2\":\"value2 \"}\n```\n\nThe “str” will\
    \ contain only info on selected properties only. Instead of array we can pass\
    \ a function also.\n\n```javascript\nfunction selectedProperties(key, val) {\n\
    \  // the first val will be the entire object, key is empty string\n  if (!key)\
    \ {\n    return val;\n  }\n  if (key === 'prop1' || key === 'prop2') {\n    return\
    \ val;\n  }\n  return;\n}\n```\n\nThe last optional param takes is to modify the\
    \ way it writes the object to string.\n\n```javascript\nvar str = JSON.stringify(obj,\
    \ selectedProperties, '\\t\\t');\n/* str output with double tabs in every line.\n\
    {\n  \"prop1\": \"value1\",\n  \"prop2\": \"value2\"\n}\n*/\n```\n\n### Single\
    \ Method for Arrays and Writing Single Element\n\nInstead of writing separate\
    \ methods to hold an array and a single element parameter, you can write functions\
    \ so that they can handle both.\n\nYou just have to concat everything into an\
    \ array first. Array.concat will accept an array or a single element.\n\n```javascript\n\
    function printUpperCase(words) {\n  var elements = [].concat(words || []);\n \
    \ for (var i = 0; i < elements.length; i++) {\n    console.log(elements[i].toUpperCase());\n\
    \  }\n}\n```\n\nPrintUpperCase is now ready to accept a single node or an array\
    \ of nodes as its parameter. It also avoids the potential TypeError that would\
    \ be thrown if no parameter was passed.\n\n```javascript\nprintUpperCase(\"cactus\"\
    );\n// => CACTUS\n\nprintUpperCase([\"cactus\", \"bear\", \"potato\"]);\n// =>\
    \ CACTUS\n// BEAR\n// POTATO\n```\n\n### Measure performance for a JavaScript\
    \ Block\n\nFor quickly measuring performance of a JavaScript block, we can use\
    \ the console functions like console.time(label) and console.timeEnd(label)\n\n\
    ```javascript\nconsole.time(\"Array initialize\");\nvar arr = new Array(100),\n\
    len = arr.length,\ni;\nfor (i = 0; i < len; i++) {\n  arr[i] = new Object();\n\
    };\nconsole.timeEnd(\"Array initialize\"); // Outputs: Array initialize: 0.711ms\n\
    ```\n\n### Hoisting\n\nHoisting will help you manage your function scope. Variable\
    \ declarations and functions are hoisted to the top where as variable definitions\
    \ are not.\n\n```javascript\nfunction doTheThing() {\n  // ReferenceError: notDeclared\
    \ is not defined\n  console.log(notDeclared);\n  // Outputs: undefined\n  console.log(definedLater);\n\
    \  var definedLater;\n  definedLater = 'I am defined!'\n  // Outputs: 'I am defined!'\n\
    \  console.log(definedLater)\n  // Outputs: undefined\n  console.log(definedSimulateneously);\n\
    \  var definedSimulateneously = 'I am defined!'\n  // Outputs: 'I am defined!'\n\
    \  console.log(definedSimulateneously)\n  // Outputs: 'I did it!'\n}\ndoSomethingElse();\n\
    function doSomethingElse(){\n  console.log('I did it!');\n}\n\n// TypeError: undefined\
    \ is not a function\nfunctionVar();\nvar functionVar = function(){\n  console.log('I\
    \ did it!');\n}\n```\n\n## Chapter 5: JavaScript Skills to Know Moving Forward\n\
    \nWhether you like it or not, as a programmer or web or app developer, you need\
    \ to learn JavaScript. It is considered the computer language of the future simply\
    \ because it is an integral part of web and app development.\n\nAs common as it\
    \ is, JavaScript is pretty complicated especially when trends keep changing and\
    \ with that, comes the ensuing chaos. Despite all that, things are improving in\
    \ the JavaScript landscape, and with technology evolving, old problems with JavaScript\
    \ are fixed, no doubt with new ones coming in.\n\nIf you are a new developer in\
    \ 2016, your willingness and ability to learn JavaScript will definitely contribute\
    \ to the success of your career and your skills as a programmer/coder/hacker or\
    \ developer.\n\nSo what are the trends of JavaScript development should programmers\
    \ work on going forward?\n\nIn this chapter, we will look at the various things\
    \ that will go big in the programming language world.\n\n### React & Redux\n\n\
    In 2015, React gained traction especially when more and more programmers started\
    \ complaining about the AngularJS framework as 2014 came to an end. The fact that\
    \ news broke out that Angular 2 will be unsuitable to run with Angular 1 made\
    \ it even worse for the Angular community. React came in and closed this gap in\
    \ 2016.\n\n![](img/f55b088b60008aab90a6ca2520da3303_137_0.png)\nEstimates based\
    \ on screenshots from the internet archive. Perhaps a more telling pointer would\
    \ be the npm download count for react, angular, and Angular2 packages:\n\n![](img/f55b088b60008aab90a6ca2520da3303_137_1.png)\n\
    \nFor the past year, React has been getting more traction from the JavaScript\
    \ community than AngularJS has. So if you look at the graph above, you are probably\
    \ wondering what happened after August? It shows that npm downloads for React\
    \ have surged significantly and it also shows exactly when GitHub stars for React\
    \ being to catch up with Angular’s stars.\n\nThe change is due to Redux, created\
    \ by Dan Abramov during the ReactEurope2015 conference. Redux had a simple flux\
    \ implementation that convinced many programmers that it was time to adopt the\
    \ one and only React. Before the materialization of Redux, React was turbulent\
    \ as people were trying to figure out how to best execute the ‘Flux’ architecture.\
    \ Since then, many other implementations begin surfacing, and while they aren’t\
    \ bad, they weren’t exactly solving any issues that made JavaScript developers\
    \ wary.\n\nIn spite of the universal rendering and the gold stars for React and\
    \ its virtual DOM, programmers were still cautious about using it in their projects.\
    \ Despite this, Netflix, Yahoo!, and Dropbox have all adopted React into their\
    \ tech arsenal, giving it a confidence boost. Even so, Facebook’s Relay looks\
    \ like a prospective contender in 2017.\n\n### Other Frameworks of Interest\n\n\
    Other frameworks may come into the foray and while they aren’t comparable but\
    \ here’s a general overview of what other frameworks are out there. Again, things\
    \ may change with anything regarding technology. What may not work so well this\
    \ year might end up becoming top of the league the next year.\n\nWithout further\
    \ ado, here are some other frameworks to look into.\n\n**Angular2**\n\nPlenty\
    \ of non-tech companies will be looking into using Angular 2 especially businesses\
    \ that use Microsoft's .NET framework. Angular 2, developed through a partnership\
    \ between Google and Microsoft was designed to make JavaScript"
