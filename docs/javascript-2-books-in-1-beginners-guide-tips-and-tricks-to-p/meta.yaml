    \n## 文档\n\n你需要从基础信息开始编写文档，例如你的项目名称以及关于其内容的简要描述。这将帮助他人理解你的库旨在做什么，以及使用你的库对他们来说是否是一个良好的选择。你还可以包含更多关于范围和目标等信息，以便用户获得更充分的信息。\n\
    \n你还可以包含路线图，让用户知道他们对你库的未来开发可以期待什么，以及他们如何对此做出贡献。\n\n## API、教程和示例\n\nAPI 文档也是文档不可或缺的一部分，因为它会告诉用户具体如何使用你的库。其他很好的补充还有示例和教程。这可能花费一些时间，所以你可以在库开发过程中进行。\n\
    \n## 元任务\n\n用户还可能希望对你的库进行更改，这通常以贡献的形式出现，但某些人可能想创建一个仅供私下使用的自定义构建。对于这些用户，你可以包含元任务文档，其中包含一个构建库、运行测试、生成和转换或下载数据的命令列表。\n\
    \n## 贡献\n\n贡献是非常好的，特别是当你开源你的库时。你可以添加的另一个文档是引导贡献者解释向库做出贡献的步骤，以及他们在贡献之前应该填写哪些标准。这将使你的评审过程更容易接受能够积极升级和增强你库的贡献。\n\
    \n## 许可证\n\n许可证也很重要。包含许可证让每个人知道哪些材料受版权保护。推荐 ChooseALicense.com 作为没有法律顾问的情况下获取许可证的优秀资源。将选择的许可证以\
    \ LICENSE.txt 格式保存在项目根目录下。\n\n##向你的 Git 仓库添加版本/发布\n\n对于一个好的库来说，版本控制是必要的。当前版本命名的标准是\
    \ SemVer（语义化）。该版本由三个数字组成，表示主、次和补丁版本的更改。如果你有 git 仓库，你也可以添加版本号。考虑你仓库的快照或标签（Tags）。要创建一个标签，打开终端执行以下操作：\n\
    \n```bash\n# git tag -a [version] -m [version message]\ngit tag -a v1.2.0 -m \"\
    Awesome Library v1.2.0\"\n```\n\n例如，GitHub 提供了所有版本的完整视图以及每个版本的下载链接。\n\n## 发布到公共仓库\n\
    \n### npm\n\n大多数编程语言都配备了包管理器，或者至少有一个第三方包管理器，允许用户拉取针对特定语言的特定库。例如，PHP 的管理器是 Composer，Ruby\
    \ on Rails 是 RubyGems。对于像 Node.js 这样独立的 JavaScript 引擎，你有 npm。默认情况下，你的 npm 包将公开可用。但你也可以选择发布：\n\
    \n- 私有包\n- 设置私有注册表\n- 完全避免发布\n\n然而，如果你决定发布你的包，你就需要 package.json 文件。你可以手动执行，也可以使用交互式向导来实现。要启动此向导，首先输入：\n\
    \n```bash\nnpm init\n```\n\nversion 属性应该匹配你的 git tag。包含 README.md 文件。就像 GitHub\
    \ 一样，npm 使用它作为展示你包的页面。完成后，输入以下命令发布你的包：\n\n```bash\nnpm publish\n```\n\n搞定！你成功发布了你的\
    \ npm 包。\n\n### Bower\n\n另一个名为 Bower 的实用包管理器几年前出现。这是一个为 Web 设计的管理器。在这里，你可以找到所有的前端断言。只是，如果你的库被设置为浏览器兼容，那么使用\
    \ Bower 发布你的包将受益。npm 包主要用于 JavaScript，许多前端包仍在使用 npm，但 Bower 从根本上仍然是流行的，所以尽管继续使用\
    \ Bower 发布吧。\n\n要生成 bower.json 文件，输入：\n\n```bash\nbower init\n```\n\n就像 npm init\
    \ 一样，指令是自解释其它的。最后，发布你的包：\n\n```bash\nbower register awesomelib https://github.com/you/awesomelib\n\
    ```\n\n"
