  md: '**A Brief History of JavaScript**


    Back in the 1990s when the world wide web was still in its developing stages,


    all web pages were static- there was no way of interaction between user and


    the website. What you saw was exactly what was set up.


    Two of the most popular browsers at that time were Internet Explorer and


    Netscape Navigator. While the Internet Explorer was a lot more famous,


    Netscape was the first to bring about a programming language that enabled a


    webpage to be interactive with the user. This language was called LiveScript


    and it was integrated into Netscape’s browsers. Anyone using Netscape could


    now interact with the pages thanks to this language. LiveScript did not need a


    plugin.


    On another note, there was another programming language that required a


    separate plugin to run and that was called Java. At this point, Java became


    very well known and Netscape decided to cash in on this by renaming


    LiveScript to JavaScript.


    As mentioned earlier, there is a wide difference between Java and JavaScript,


    although their codes appear similar.


    And then Internet Explorer, with the need to innovate, is updated and supported


    by two integrated languages which was called vbscript based on BASIC


    programming and another called Jscript which was similar to JavaScript.


    By the time Internet Explore became the most used browser, JavaScript also


    became the most accepted and widely used programming language to be used


    in up and coming web browsers.


    Fast forward to 1996, scripting language became so important that it was risky


    to leave it to competing browser developers. In that same year, JavaScript was


    given to the ECMA, the international standards body who was responsible for


    the development of programming language. This language was officially


    renamed to ECMAScript but programmers and everyone else still know it as


    JavaScript.


    It’s a lot cooler sounding too.'
