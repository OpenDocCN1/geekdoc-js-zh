- img_proc: true
  md: 'Data is normally stored so that it can be used at a later date. This is a very


    important aspect of writing code. JavaScript is a wonderful programming


    language that is going to store the data so that you can use it later and do not


    have to worry about it getting lost.


    When you are writing code, you are going to be able to have it interact with the


    users by asking for information that may be able to be used at a later time.


    **Code**


    You would like for the user to enter their last name so that you can personalize


    a greeting for them.


    var surname = prompt(“Greetings user, may I ask what your surname is?”);'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'After the code has been run, a box is going to appear asking the user what
    their


    last name is. All the user is going to need to do is type in their last name before


    they hit enter or click the okay button for the information to be moved and


    stored in the proper place.


    Congratulations, you have now created a variable that will be the surname of


    the user.


    **Variables**


    Variables are going to be easier to understand if you think of them as shelves.


    Each shelf has a name that is created once the variable has been created. So,


    for the previous code, your shelf’s name is going to be “surname” and the


    object that is setting on that shelf is the user’s surname.


    Anything you want to make as a variable can be made. But, it is recommended


    that you name your variables first so that you know which variable is which


    instead of naming them things such as numbers or letters.


    At the point in time that you tell the browser that you are using to locate a


    variable, it is not only going to be located, but the data on that “shelf” is
    going


    to be given back to you. The object on the shelf is also known as a value.


    The data that is stored in the value is called a string. So the letters that make
    up


    someone’s last name are going to be the surname variables value and string.


    Strings do not just have to be letters; they can be numbers as well. Basically,


    string is an array of any possible character to be used.


    Essentially, every variable is going to have a value as well as a name and this


    is how data is going to be stored.


    Variables are created through two parts an initialization and a declaration.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'After you create it, you will then assign it to the proper value.


    **Declaration**


    The declaration process will declare that the variable exists. Back to thinking


    of the variable like a shelf, the declaration is like when you are first picking


    out the shelf in the store.


    To set a variable aside, the word var is used before the name of the variable
    is


    written in. This tells the code what the variable is named and how it should be


    run.


    Code:


    var birthday;


    var first_name;


    Note: Every line in JavaScript is going to end in a semicolon so that the code


    is run as JavaScript and not as regular text.


    **Initialization**


    To give a variable the value that it needs, you will use the initialization


    process. These values can be changed at a later date, but it is only going to
    be


    initialized one time.


    The initialization of a variable will use the equals sign so that the statement


    reads that the value from the variable that is listed on the left side of the
    equals


    sign will be with the data that is on the left.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Code:


    var name = “Sue”;


    The string is going to be the name Sue and that string is going to be surrounded


    by a set of quotes either double or single.


    Code:


    var age = 22;


    Since the value for the variable is a number, it must not be in quotes to be


    recognized as a number. This type of variable is called an integer.


    **Assigning**


    Setting the value to the variable is known as assigning. The value can be


    assigned to the variable an unlimited number of times. It is going to be much


    like the initialization process that was mentioned earlier.


    There is going to be an equals sign used but you are not going to need to use
    the


    var keyword since the code already knows that the value is a variable.


    Code:


    Name = “Sue”;


    Age = 22;


    But the variable has to be declared first before it can be assigned!'
