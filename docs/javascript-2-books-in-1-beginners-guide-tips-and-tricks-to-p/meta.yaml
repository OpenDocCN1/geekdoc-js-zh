- img_proc: true
  md: '![](img/f55b088b60008aab90a6ca2520da3303_146_0.png)


    The thing is, looking at how functional programming fits perfectly with


    addressing modern issues in web development, one has to agree that functional


    programming paradigm and its equivalent concepts will stick around as a


    necessary skill that JavaScript developers will need to harness and learn.


    **Desktop Framework Showdown: Nw.js vs. Electron**


    Plenty of data nowadays requires synchronizing data from various platforms


    such a desktop and mobile. However, many services mostly start out as web


    apps before they are converted as desktop apps for enhanced user-experience.


    It is done this way because web app developments are a lot faster and more


    easily updated. Above all, users can also try out web apps more instantly


    without having to install anything else.


    Developers in the past were confined to using CEF if they wanted to use web


    technologies to create front-end UI for desktop apps. Not an easy process and


    the apps themselves weren’t truly cross-platform compatible. Though that,


    Node.js has made cross-platform apps easier for desktop frameworks. The


    shift of using web technologies for desktop app development began to rise'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'starting 2014.


    Thus, let’s take a look at the GitHub Star history for both projects:


    ![](img/f55b088b60008aab90a6ca2520da3303_147_0.png)


    Although Nw.js broke into the scene much earlier and is considered older, it


    looks like Electron is growing at an explosive rate, while nw.js is growing at
    a


    monotonous linear rate.


    ![](img/f55b088b60008aab90a6ca2520da3303_147_1.png)'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'While Electron is pretty new, it is used by several established organizations


    like Slack, Microsoft (Visual Studio Code), WordPress, and Sencha. But with


    the ease of use that Electron’s has, the network and community grew very fast.


    This wave of popularity is very likely to go on into 2017, thus enabling


    Electron to become the framework of choice for desktop and web app


    development.


    **Mobile App Framework Showdown: React Native vs. Ionic**


    When Reactive Native came out, it was predicted that it would take over and


    charts the course of mobile development with web technologies since it can be


    used to develop cross-platform apps natively. So is 2017 the year of React


    Native? There might be some expectations to that through this graph:


    ![](img/f55b088b60008aab90a6ca2520da3303_148_0.png)


    At this moment, React Native has not yet released any updated software as it is


    still at version 0.26\. Whether or not it will become mainstream in 2017


    depends largely on developer’s patience to deal with app- development


    changes that needs refactoring the whole codebase together with other issues.


    Therefore, let’s take a look at the approximate npm downloads of React Native


    vs Ionic:'
  merge: -1
  pgno: 148
- img_proc: true
  md: '![](img/f55b088b60008aab90a6ca2520da3303_149_0.png)


    From the graph, it seems that React Native is on track to overtake ionic as the


    framework of choice for cross-platform mobile development using web


    technologies.


    In terms of the job market, React Native is also becoming more in-demand than


    Ionic:


    ![](img/f55b088b60008aab90a6ca2520da3303_149_1.png)


    A quick search on job postings, show that at least 75 job postings are looking


    for developers with ionic skills whereas 65 job postings are looking for


    developers with React skills. This shows that there is an increasing surge of


    the familiarity with React Native that will most likely be a huge push to any
    up


    and coming developers going forward 2017.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '**The Future of Web API: GraphQL vs REST**


    Soon after Facebook mentioned that they were open-sourcing GraphQL, plenty


    of JavaScript developers jumped onto the hype train earlier on in 2016,


    especially since Facebook turned into the Apple of JavaScript when it came to


    open source projects.


    ![](img/f55b088b60008aab90a6ca2520da3303_150_0.png)


    GraphQL was aiming to sort of replace REST APIs, but considering how


    ubiquitous REST APIs are, this is an unlikely scenario:


    ![](img/f55b088b60008aab90a6ca2520da3303_150_1.png)


    GraphQL would do well with REST APIs, but it will definitely not replace


    REST as some developers thought it would have. Even more to do with this is'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'that GraphQL is relatively new and linked with Facebook Relay, so there


    aren’t any learning resources or best practices for programmers and


    developers to pick the skill up elsewhere. With that said, 2017 is still too early


    for GraphQL to be going mainstream despite the strong hype it has now.


    **JavaScript Trends Conclusion**


    In conclusion, the community of JavaScript moves and changes at a fast pace,


    keeping up with any upcoming trends and in line with mainstream technology


    which means more support, relevance, and resources. Based on the trends


    discussed in this chapter, JavaScript developers should equip themselves with


    Redux & React and also with other familiar functional programming such as


    TypeScript. Not only that, having experience with React Native and Electron


    will definitely give upcoming programmers a lot more push and credibility in a


    job search.'
  merge: -1
  pgno: 151
