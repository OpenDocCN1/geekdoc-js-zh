    ![](img/f55b088b60008aab90a6ca2520da3303_147_1.png)


    虽然 Electron 还相当新，但它已经被 Slack、Microsoft (Visual Studio Code)、WordPress 和 Sencha
    等多家成熟机构使用。但由于 Electron 的易用性，网络和社区增长得非常快。这股热潮很可能会持续到 2017 年，从而使 Electron 成为桌面和
    Web 应用开发的首选框架。


    ## 移动应用框架对决：React Native vs. Ionic


    当 React Native 出世时，人们预测它将接管并利用 Web 技术引领移动开发方向，因为它可以被用于开发原生跨平台应用。那么 2017 年是 React
    Native 的年吗？通过这张图表，可能会产生一些预期：


    ![](img/f55b088b60008aab90a6ca2520da3303_148_0.png)


    此时，React Native 尚未发布任何更新的软件，因为它仍然处于 0.26 版本。它是否会在 2017 年成为主流，很大程度上取决于开发者处理应用开发变化的耐心，这些变化需要同时重构整个代码库以及其他问题。因此，让我们来看看
    React Native 与 Ionic 的近似 npm 下载量：


    ![](img/f55b088b60008aab90a6ca2520da3303_149_0.png)


    从图表中可以看出，React Native 进展有望超越 Ionic，成为使用 Web 技术进行跨平台移动开发的首选框架。


    在就业市场方面，React Native 的需求也比 Ionic 更大：


    ![](img/f55b088b60008aab90a6ca2520da3303_149_1.png)


    招聘信息的快速搜索显示，至少有 75 个职位招聘在寻找 Ionic 技能开发者，而 65 个职位招聘在寻找 React 技能开发者。这表明人们对 React
    Native 的熟悉程度正在增加，这很可能为 2017 年之后的任何新兴开发者提供巨大的推动力。


    ## Web API 的未来：GraphQL vs. REST


    在 Facebook 提到他们将开源 GraphQL 后不久，许多 JavaScript 开发者在 2016 年初就追上了热潮，尤其是因为 Facebook
    在开源项目方面已变成了 JavaScript 界的苹果。


    ![](img/f55b088b60008aab90a6ca2520da3303_150_0.png)


    GraphQL 旨在某种取代 REST API，但考虑到 REST API 的无处不在，这种情形不太可能：


    ![](img/f55b088b60008aab90a6ca2520da3303_150_1.png)


    GraphQL 与 REST API 结合得很好，但它绝对不会像某些开发者认为的那样取代 REST。与此更相关的是，GraphQL 相对较新，并与 Facebook
    Relay 关联，因此程序员和开发者在其他地方没有学习资源或最佳实践来掌握这项技能。尽管如此，尽管 GraphQL 现在有强烈的炒作，但 2017 年对于它成为主流仍然为过早。


    ## JavaScript 趋势总结


    总之，JavaScript 社区的发展变化非常快，跟上任何即将出现的趋势并与主流技术保持一致，这意味着更多的支持、相关性和资源。根据本章讨论的趋势，JavaScript
    开发者应该让自己掌握 Redux & React，以及其他熟悉的函数式编程语言，如 TypeScript。不仅如此，拥有 React Native 和 Electron
    的经验无疑会为未来的程序员在求职时提供更多推动力和信誉。


    ## 结论


    感谢你读完 *JavaScript: Tips and Tricks to Programming Code with JavaScript.*。希望它对你有所启发，并能够为你提供实现目标（无论目标是什么）所需的所有工具。


    下一步是使用你所学到的编码技能将其应用到你自己的项目中。学习需要时间，但你应该保持耐心，因为就像学习任何新事物一样，你会犯错。再次复习书中的课程并重读它们。由于你要学习的所有不同的条件和异常，学习编写代码将令人困惑，直到你掌握了窍门。


    最后，如果你发现这本书在任何方面都有帮助，我们将非常感谢你在 Amazon 上给出评价！


    ## 关于作者


    Charlie Masterson 是一位计算机程序员和导师，开发过多个应用程序和计算机程序。


    作为一名计算机科学学生，他很早就对编程感兴趣，但对学习高度复杂的课题感到沮丧。


    Charlie 想要一种他可以轻松学习并提高编程技能的教学方法。他很快发现了一系列让他学得更快、更好的教程。


    通过同样的方法，Charlie 成功学习了不同的编程语言，现在通过写书籍教授这些主题。


    通过他编写的计算机编程书籍，他希望提供巨大的价值，并帮助对学习计算机相关主题感兴趣的读者。

