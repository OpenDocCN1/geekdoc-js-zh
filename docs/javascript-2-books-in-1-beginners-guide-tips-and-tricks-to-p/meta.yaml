  md: '**The Importance of JavaScript**


    To understand how JavaScript is used is to understand the basic roles of other


    programming that goes into the development of a webpage.


    Simply put:


    1- HTML is the language that is used to markup content. HTML defines what


    the content is, and not how it looks on a webpage.


    2- CSS is used to define the appearance of a webpage. This entails


    specifying which media corresponds to which command


    Just by using these two languages, you can already create a static webpage that


    can be easily accessed regardless of what device you view the webpage on


    and what browser is used to access it.


    However, the biggest disadvantage of web pages like these is that the only way


    your visitor can interact with your static site is by filling up a form and waiting


    for a new page to load.


    That’s where JavaScript comes in.


    JavaScript converts static pages into one that is interactive so that site visitors


    won’t need to wait for a new page to load every time they make a request.


    JavaScript enables your web pages to have a behavior - to make them capable


    of responding to a variety of actions in real-time.


    With JavaScript, you can:


    -  Validate each field in a form as a user enters the information and not


    fill up the whole form and only be told the user made a typo after


    submitting the form.


    -  Enables your page to be interactive in more ways than involving


    forms'
