    你的总和将不是`pieces of fruit`而是`piecesOfFruit`，因为你的变量不能包含任何空格。很容易注意到 `Of` 和 `Fruit`
    中的 `O` 和 `F` 是大写的。这被称为驼峰命名法（camel casing），它有助于变量更易读。


    记住，代码的阅读方式有很多。因此，确保你的代码易于阅读和理解是极其重要的。


    ## 分割


    当你做数学题时，不仅仅有加法。对于代码来说，还有除法。


    代码：

    ```javascript

    var piecesForEachPerson = piecesOfFruit / 3 ;

    ```


    JavaScript 能够完成这些计算，而你无需取出计算器来确保计算正确。


    除法通过正斜杠 `/` 完成，以确保你将左侧除以右侧。


    ## 运算符


    为了得到一组数字的和，你将为每种操作使用符号。


    - 乘法 ( * )

    - 加法 ( + )

    - 除法 ( / )

    - 减法 ( - )


    每个符号被称为运算符，因为它们将操作某些数学数据。就像任何数学题一样，事情的执行有一个特定的顺序，这被称为运算符优先级（operator precedence）。


    看到一组括号意味着在执行乘法、除法、加法或减法过程之前需要先执行它们。记住这种运算顺序的简单方法是 PEMDAS（括号、指数、乘除法以及加减法）。


    代码：

    ```javascript

    (10+2) / 2 + 4 * 2

    12 / 2 + 4 * 2

    6 + 4 * 2

    6 + 8

    ```


    ## 第 5 章：JavaScript 逻辑


    在编程时，能够比较不同的值很重要，这样在涉及代码及其如何执行时就可以做出决策。比较将使你的结果变为 `false` 或 `true`。然后，有一种特殊的数据类型被称为布尔类型（Boolean
    data type）。


    使用 JavaScript 进行数学计算将引入一组处理布尔值的运算符。这些比较将在你在控制台操作时进行。每一行得到的任何结果将显示为 `true` 或 `false`。


    ##相等


    要确定两个不同的值是否相等，你将使用三个等号 ( ===)。


    代码：

    ```javascript

    15.234 === 15.234

    True

    ```


    要检查两个变量是否不相等，你需要使用两个等号并在它们前面加一个感叹号 ( !== )。


    代码：

    ```javascript

    15.234 !== 18.4545

    True

    ```


    包含数字的字符串在数值上与该数字相等，但类型不同，因此 === 比较将返回 `false`：

    ```javascript

    "10" === 10

    False

    ```


    然而，如果你使用两个等号 ( == ) 比较这两个值，它将返回 `true`，因为两个等号只比较变量的值，而不是类型！所以这将返回 `true`：

    ```javascript

    "10" == 10

    True

    ```


    ## 大于/小于


    两个数字可以比较为一个比另一个大或小。当一个数字大于另一个数字时，你将使用大于符号 >。


    代码：

    ```javascript

    10 > 5

    True

    ```


    小于符号是大于符号 (< ) 的反面。


    代码：

    ```javascript

    20.4 < 20.2

    False

    ```


    ## 组合比较


    当数字相等且需要比较大小时，可以使用大于等于 ( >= ) 或小于等于 ( <= ) 运算符进行比较。


    代码：

    ```javascript

    10 >= 10

    True

    10 <= 5

    False

    ```


    ## 第 6 章：JavaScript 条件


    使用 JavaScript 逻辑将根据所做的比较类型为代码做出决策。在进行比较之前，必须设置一个条件。JavaScript 中使用了几种条件，但最常用的是
    `If` 语句。


    ## If 语句


    当发现条件为 `true` 时，代码将按照预期方式运行。得益于 `if` 语句，你可以在条件不为真时添加必须的额外代码。当条件返回 `false` 时，将会有额外的条件和代码块供选择执行。这种选项就是
    `if-else` 语句。


    代码：

    ```javascript

    if(10 > 5) {

    // 在此处运行代码

    }

    ```


    放在大括号之间的任何代码都将被视为一个代码块，并与 `If` 语句连接。然而，只有当括号内的条件结果为 `true` 时，它才会被执行。


    注意：双斜杠 `//` 表示代码中放置的注释，它不会作为代码执行。放置注释是为了让其他人更容易理解代码。


    ## If-else


    `if-else` 语句是 `If` 语句的另一种形式，当条件返回 `false` 时，它将使用一段代码并运行它而不是原始代码。`If` 代码块中的代码将被忽略，以便运行
    `else` 块。


    代码：

    ```javascript

    if ( 43 < 2) {

    // 在此处运行代码

    } else {

    // 运行不同的代码

    }

    ```


    ## 第 7 章：JavaScript 循环


    就像圆圈一样，循环将多次重复相同的代码。循环通常用于需要为数组中的对象执行代码的情况。


    你最常用的两种循环是 *while 循环* 和 *for 循环*。条件将组合在一起，然后将运行代码块，直到条件被强制不再为真。


    ## While 循环


    `while` 循环将在条件为 `true` 时重复代码。`while` 循环与 `if` 语句非常相似，且括号内的条件必须为 `true`。


    代码：

    ```javascript

    var i = 1;

    while ( i < 10 ) {

    alert (i);

    i = i + 1 ;

    }

    // i 现在将是 10

    ```


    一旦循环完成，代码在闭括号后将继续运行。这段代码将产生显示从 1 到 9 数字的弹出警告框，当循环完成时，`i` 的值将等于 10。


    ## For 循环


    `for` 循环也类似于 `if` 语句，主要区别在于使用三个分号来分离放在括号内的信息部分。`for` 循环将初始化条件以获取最终表达式。


    在初始化时，你将创建变量，以便跟踪你进入循环的深度，就像你对 `while` 语句执行的那样。你的条件是放置循环逻辑的地方。最终表达式将在循环结束时运行。


    代码：

    ```javascript

    for(var i = 1 ; i < 10 ; i++ ) {

    alert (i) ;

    }

    ```


    在代码中，将弹出一个警告框按顺序给出 1 到 10 的数字。`i++` 等于 `i = i + 1`。`( i )` 被称为增增 `i` 的值。正如所见，在这种情况下
    `for` 循环和 `while` 循环的作用是相同的。你可能想知道什么时候使用 `for`，什么时候使用 `while` 循环。这是一个简短的解释。


    `while` 循环通常用于不知道循环运行次数的情况。例如，用户正在玩一个游戏，需要猜隐藏的数字。你永远不知道用户的运气，所以你不知道他们何时会选正确的数字。这就是为什么你设置
    `while` 循环并等待正确数字出现。


    代码：

    ```javascript

    var number = 0;

    // 7 是隐藏的数字！

    prompt("尝试猜猜数字!");

    while (number !== 7)

    {

    number = parseInt(prompt("数字错误，请重试!"));

    }

    alert("恭喜，你猜对了！");

    ```


    当用户输入数字 7 时，它将显示庆祝消息，但如果用户输入任何其他数字，它将继续显示错误消息，直到用户输入数字 7。


    相反，在使用 `for` 循环时，我们确切知道需要执行循环的次数；它主要用于处理数组，我们将在后的章节中学习。


