    \ is going to use the length property to tell you how many elements there are.\n\
    \nCode:\n```javascript\nshoppingList.length; // 3\n```\n\nThe push and pop methods\
    \ can be used so that elements can be added and removed from the finish of the\
    \ array.\n\nCode:\n```javascript\nshoppingList.push('A new car'); // shoppingList\
    \ ['Soda', 'Buns', 'Rice', 'A new car']\nshoppingList.pop(); // shoppingList is\
    \ now ['Soda', 'Buns', 'Rice']\n```\n\nThe code below is going to create a push,\
    \ pop, and then iterate it over the array so that it can be passed to the name\
    \ of the function that is labeled as helloFrom.\n\nThen helloFrom is going to\
    \ be returned to the string for the greeting of: \"Hello from\" and then the user’s\
    \ name. After you have finished with the push and pop method, the list of user’s\
    \ name is going to be \"Burt\", \"Luke\", \"Ron\", and \"Tim\".\n\nCode:\n```javascript\n\
    var helloFrom = function(personName) {\n  return \"Hello from\" + personName;\n\
    }\n\nvar people = ['Burt', 'Luke', 'Ron'];\npeople.push('Tim');\npeople.push('Dr\
    \ Evil');\npeople.pop();\n\nfor(var I = 0; I < people.length; I++) {\n  var greeting\
    \ = helloFrom(people[I]);\n  alert(greeting);\n}\n```\n\n## Chapter 11\n## DOM\n\
    \nDOM stands for Document Object Model and it will manipulate how an HTML page\
    \ is structured and styled. It is going to be represented by the internal pages\
    \ that the browser is going to see so that the developer is able to alter the\
    \ JavaScript code.\n\nIn order to look at the DOM for a page, you are going to\
    \ open the developer tool inside of the browser that you are using and locate\
    \ the \"elements\" pane.\n\nYou can do this by clicking right click somewhere\
    \ on the page in your browser and clicking \"Inspect Element\" from the menu list\
    \ that appears. This will give you a good insight as to how the browser thinks.\
    \ In most browsers, you are going to have the ability to modify and remove elements\
    \ directly without asking for permission.\n\n### Trees and Branches\n\nHTML is\
    \ similar to the structure of an XML in that the elements are going to contain\
    \ parent nodes from the structure that it creates along with children nodes. It\
    \ is much like tree branches. HTML is going to have a single root element that\
    \ contains branches much like a head and body and the limbs that are going to\
    \ be attached to it. Because of this, DOM is also known as a DOM tree.\n\nWhen\
    \ altering a DOM, you are going to pick an element and change whatever you want\
    \ about it. This process is normally done with JavaScript. In order to access\
    \ DOM from JavaScript, you are going to need the document for the object that\
    \ is being used. It will be provided by the browser so that the code is allowed\
    \ to interact with the code that is on the page.\n\n### Getting Elements\n\nWhen\
    \ you are getting an element, you are going to have several ways that you can\
    \ do it depending on the browser that you are using.\n\n### ID\n\ndocument.getElementById\
    \ will be the method that you use when you are trying to retrieve an item with\
    \ its Id.\n\nCode:\n```javascript\nvar pageHeader = document.getElementById('pageheader');\n\
    ```\n\nUsing this code, you can select element with ID of pageheader and store\
    \ it in the pageHeader variable. Later on, you can modify it, get its content,\
    \ or even hide and display it. Here is one example.\n\nCode:\n```javascript\n\
    alert(pageHeader.innerHTML);\n```\n\nThis will popup the contents of element with\
    \ ID of pageHeader. For example, if pageheader looks like this:\n\nCode:\n```html\n\
    <p id=\"pageheader\">This is the page header</p>\n```\n\nIt will popup \"This\
    \ is the page header\" text.\n\nYou are going to notice that getElementById is\
    \ going to be the method that is used with an object of a document. Some of the\
    \ other methods are going to have access to the page that has been located on\
    \ the file for the element.\n\n### Tag name\n"
  mdcn: "\n\n## 第8章\n## JavaScript 中使用的函数\n\n函数用于重用代码块，以便执行特定的任务。为了执行你调用的函数内部的代码，该函数将允许传递任何用到的参数，以便将值返回给最初调用它的地方。\n\
    \n函数可以保存为你的变量的值。该函数将使用该变量和括号来调用函数。\n\n代码：\n```javascript\ndoSomething();\nfindAnInterestingThing();\n\
    ```\n\n创建一个函数意味着你将使用 `function` 关键字。在使用该关键字之后，参数将列在一组括号内，以便该代码块拥有函数的代码。\n\n代码：\n\
    ```javascript\nvar add = function(a, b) {\n  return a + b;\n};\n```\n\n`a` 和 `b`\
    \ 是函数的参数，而值将通过 `return` 关键字返回。\n\n用于返回的关键字将停止执行放在函数中的代码；因此，在它之后将不会有任何代码运行。\n\n\
    代码：\n```javascript\nvar result = add(1, 2); // 结果将是 3.\n```\n\n调用将加上参数 1 和 2，它们已经被保存到变量\
    \ `a` 和 `b` 中。\n\n## 第9章\n## JavaScript 中的对象\n\n当在 JavaScript 中找到一个对象时，它非常像现实生活中的对象，包含一组属性和能力。\n\
    \n对象将拥有一组命名的属性，以及决定其如何运行的方法。\n\n对象将被保存到变量中，而其他所有内容都可以通过使用点符号表示（dot notation）的短语获取。\n\
    \n作为一个类比，如果你看一个人，他们会有名字、有年龄，并且能够移动、学习和说话。如果将这个人放入 JavaScript 中，他们的名字和年龄将被视为属性，这些无非是数据片段。移动、说话和学习的能力将是人的函数，因为它们是复杂的行为。拥有这些能力的对象被称为方法（method）。\n\
    \n变量可以持有对象，它们通过使用封装在括号内的特殊语法来创建对象。\n\n代码：\n```javascript\nvar jedi = {\n  Name:\
    \ \"Luke\",\n  Age: 899,\n  Talk: function() {\n    alert(\"another... Sky...\
    \ walk ...\");\n  }\n};\n```\n\n绝地武（Jedi）的名字和年龄将是对象内部的属性或变量。对象可以存储变量可以存储的任何数据。绝地武可以进行的说话是持有函数的属性，也被称为方法。数据可以通过使用点符号表示的短语从对象返回。\n\
    \n代码：\n```javascript\njedi.Name; // Luke\njedi.Age; // 899\njedi.Talk(); // 将产生一个警告框。\n\
    ```\n\n属性也可以重新赋值给该对象。\n\n代码：\n```javascript\njedi.Name = \"Mace Windu\";\n```\n\
    \n或者你可以添加早期没有添加过的新变量对象。\n```javascript\njedi.lightsaber = \"purple\";\n```\n\n\
    属性不需要是任何特定数据；它们也可以是任何内容，如对象和数组。当一个对象被列为另一个对象的属性时，你就成功地创建了一个嵌套对象。\n\n代码：\n```javascript\n\
    var person = {\n  age: 122\n};\n\nperson.name = {\n  First: \"Jeanne\",\n  Last:\
    \ \"Calment\"\n};\n```\n\n现在，如果你想知道这个人的名字是什么，你将使用这个。\n\n代码：\n```javascript\nalert(person.name.First);\n\
    ```\n\n要创建一个将的项，你需要添加属性和方法。\n\n代码：\n```javascript\nvar dog = {};\ndog.bark = function()\
    \ {\n  alert(\"Woof!\");\n};\n```\n\n## 第10章\n## JavaScript 数组\n\n数组是任何类型数据的列表，它不限于包含其他数组。列在数组中的每一个项都有一个索引，该索引将用于从数组中检索元素。\n\
    \n索引始终从 0 开始，所有排序的元素都会增加 1，因此最后一个元素将比数组总长度少 1。\n\n在 JavaScript 中创建数组意味着你使用数组字面量语法。\n\
    \n代码：\n```javascript\nvar emptyArray = [];\nvar shoppingList = ['Rice', 'Soda',\
    \ 'Buns'];\n```\n\n你可以使用方括号语法获取特定的元素。\n\n代码：\n```javascript\nshoppingList[0];\
    \ // Rice\n```\n\n你也可以通过使用方括号语法设置特定索引的值。\n\n代码：\n```javascript\nshoppingList[1]\
    \ = \"Water\";\n```\n\n数组的长度将告诉你数组中有多少元素。\n\n```javascript\nshoppingList.length;\
    \ // 3\n```\n\n你可以使用 `push` 方法向数组添加新元素。\n\n```javascript\nshoppingList.push('Apples');\
    \ // 4\n```\n\n你可以使用 `pop` 方法从数组移除最后一个元素。\n\n```javascript\nshoppingList.pop();\
    \ // 3\n```\n\n你可以使用 `shift` 方法从数组移除第一个元素。\n\n```javascript\nshoppingList.shift();\
    \ // 2\n```\n\n你可以使用 `unshift` 方法在数组开头添加新元素。\n\n```javascript\nshoppingList.unshift('Bread');\
    \ // 3\n```\n\n你可以使用 `splice` 方法在数组的任何位置添加或删除元素。\n\n```javascript\nshoppingList.splice(1,\
    \ 1, 'Milk'); // 从索引1 处删除 1 个元素并插入 'Milk'\n```\n\n"
