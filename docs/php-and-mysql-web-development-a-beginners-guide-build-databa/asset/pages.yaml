    # NOTE


    To keep this code as simple as possible, I have not escaped all user input, as
    such $classid in the classupdate.php script in Listing 13-13. In a production
    environment, all user-inputted values should be escaped to protect from hackers.


    # NOTE


    In the classupdate.php you''ll see that I added a zero to the Class Cost. The
    reason is that when the user inputs the value, it is a string that causes the
    MySQL UPDATE to produce (+ 0) forces PHP to convert the field to a number, which
    can then be inserted into a decimal field. Adding the zero is probably more elegant
    to cast it back to a floating point number using (float) $_POST[''class_cost'']
    instead of adding the 0.


    Deleting a Class classdelete.php has many of the elements of classupdate.php.
    The PHP at the beginning of the script is exactly the same and won''t be repeated
    in the listing that follows. It simply gets the class or record that will be deleted.
    This record is presented in a table like classupdate.php, but here there are no
    input fields, the HTML table is in a form that the contents can be passed on deleteclass.php,
    which does the actual deletion using MySQL’s DELETE. Figure 13-16 shows classdelete.php
    on the screen, while Listings 13-15 and 13-16 show portions of classdelete.php
    and deleteclass.php, respectively.'
