  md: '# Customer Sign-in and Verification


    If the customer decides to buy a book, they are sent to signin.php, which brings
    the selected book along with it, asking returning customers to enter their email
    address and password and click Continue, or if an existing customer, to click
    Register. If they enter an email address and password, their presence is validated
    with signinvalid.js and verified in the database with verify.php. If the entry
    was successful, the customer is passed on custdate.php where they can update their
    customer record if they, which is written to the database with updatecust.php.
    Otherwise, they are sent to the database with entercust.php, where they can register.
    In turn this is validated with regvalid.js and written to custentry.php. Eight
    scripts in three are used 위해서 in this process:


    +   - signin.php, which is validated with signinvalid.js and verified with verify.php

    - custdate.php, which is written to the database with updatecust.php

    - custentry.php, which is validated with regvalid.js and written to the database
    with entercust.php


    # NOTE


    regvalid.js is a simple validating script similar to those in Chapter 13 and to
    signinvalid.js, shown later in this chapter, that makes the customer information
    is entered as requested.


    # signin.php


    signin.php is an entry form for customers to enter their email address and password.
    It displays the book the customer is purchasing. It allows the customer to click
    Continue if they are an existing customer or to click Register if not. The script
    is partially shown in Listing 14-4, Figure 14-6 shows what sign-in looks like
    on the screen.


    > Listing 14-4 signin.php'
