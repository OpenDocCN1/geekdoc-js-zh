  md: 'With REPLACE you include either the primary key or unique index in the list
    of column names and in the list of values. If there is no match with an existing
    primary key or unique index value, then the REPLACE acts exactly INSERT and a
    new record is added to the table. If there is a match with an existing primary
    key or unique index value, then the existing record is deleted and its replacement
    is added to the table.


    One REPLACE statement can have multiple rows of values, each row enclosed in parentheses
    and separated by commas.


    # Keywords Used with REPLACE


    The common keywords (or phrases) that can be used with REPLACE


    +   - DEFAULT sets a named column to its default value, which is automatically
    done if you do not name the column. You can also use DEFAULT(column_name) with
    the same result.


    +   - DELAYED puts the replaced values into a buffer and waits until the table
    is not in use to add the rows.


    +   - INTO is an optional keyword for readability.


    +   - LOW PRIORITY replaces to the rows and prevents the client from doing anything
    else until no one is reading the table. This may be a long time. In contrast,
    DELAYED lets the client go on about their work.


    +   - VALUES OR VALUE, which are synonymous, provides a list of values for, and
    in the order of, the columns in the columns list.


