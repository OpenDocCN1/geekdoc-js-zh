  md: '# Coding Conventions


    PHP is fairly easygoing as far as conventions are concerned. In the first three
    listings, though you have probably noticed several conventions that should be
    added to your PHP rules:


    +   - Each PHP statement should end with a semicolon (;). The only exception is
    the last statement before the closing ?> which can have a semicolon, but it is
    not required.


    +   - Text, any combination of letters and numbers, also called a string, in an
    argument needs to be enclosed in quotation marks, either single ('' '') or double
    ("). Some differences are explained in a Note later in this section.) Quotation
    marks must be in pairs.


    +   - Legitimate numbers, which can have a decimal point, do not have to be in
    quotation marks.


    +   - Multiple arguments are separated by commas (,).


    +   - Most functions require that their arguments be enclosed in parentheses.


    # TIP


    When you are debugging script and you get the message "Syntax Error," check if
    a semicolon is missing at the end of the previous line or if you have an un/unmatched
    quote mark. One of these is the problem.


    You may have wondered since quotation marks are used to identify a string, how
    you display a quotation mark that is part of the string to be printed or echoed.
    For this purpose, PHP uses the backslash (\) in what is called an escape sequence,
    like this:


    ```

    print "My name is \"Marty\";

    ```


    Most of the characters PHP assigns a special use for be used as a literal character
    by preceding it with a backslash. In addition, PHP has defined several escape
    sequences. Here are some of the most common sequences:


    +   - \" produces a double quotation mark.


    +   - \'' produces a single quotation mark.


    +   - \\ produces a backslash.


    +   - \$ produces a dollar sign.


    +   - \r produces a carriage return.


    +   - \n produces a linefeed.


    +   - \t produces a tab.


    # NOTE


    While either single or double quotation marks can be used to enclose a string,
    in some circumstances, one or the other is preferable. With single quotation marks
    enclosing the'
