  md: "# If/Else Statements\n\nThe if/else statement is the primary decision-making\
    \ construct in JavaScript. It allows you to specify that if some expression is\
    \ true, then a group of statements will be executed, else a different group of\
    \ statements will be executed. It takes this form:\n\n```\nif (conditional expression)\
    \ {\n    statements executed if true;\n}\nelse {\n    statements executed if false;\n\
    }\nif (outer conditional expression) {\n    statements executed if first conditional\
    \ is true;\n    if (inner/nested conditional expression) {\n        statements\
    \ executed if second conditional is true;\n    }\n    else {\n        statements\
    \ executed if second conditional is false;\n    }\nnelse {\n    statements executed\
    \ if first conditional is false;\n}\n```\n\nIn all cases, the conditional expression\
    \ must result in a Boolean true or false (1 or 0). If a variable simply exists,\
    \ that is, it has been defined as containing something other than null, false,\
    \ or 0, then it is true.\n\n# CAUTION\n\nIf you define a variable as containing\
    \ a constant like null, true, or false, you must remember not to put the constant\
    \ in quotation marks.\n\n+   - Many conditional expressions are comparisons that\
    \ test if two elements are equal, greater than, or less than. Remember that when\
    \ you test for equality in JavaScript, you must use a double equal sign (==),\
    \ not a single one, which means assignment."
  merge: -1
