    # NOTE


    There are two SQL and MySQL coding practices that are followed in this book and
    that are important to understand:


    +   - Here, and in most other publications, you''ll see SQL and MySQL commands
    and keywords in all uppercase. This is not necessary for the commands and keywords
    to operate correctly—they are not case sensitive—but it helps to identify words
    from other text, and so is recommended.


    +   - Because MySQL and some other implementations of SQL allow multiple statements
    in the same call to the server, each statement must end with a semicolon (;).
    I believe that all MySQL statements should end with a semicolon to be consistent
    with PHP and have followed that practice throughout the remaining chapters of
    this book.


    # TIP


    In this book I have followed the practice of making object names, such as databases,
    tables, and columns, all lowercase for human readability. On Windows computers,
    such names are not case sensitive, so they may be any mixture of cases without
    affecting machine readability. On Apple Mac and Linux computers, these names are
    case sensitive,'
