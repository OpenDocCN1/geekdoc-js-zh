  md: "# Figure 7-1 PHP's ability to immediately have available information entered\
    \ into a\nform is one of its greatest strengths.\n\n# TIP\n\nA common question\
    \ is whether to use $_REQUEST in place of either $_GET or $_POST. There\nis no\
    \ inherent difference. They work the same way and give you the same information.\n\
    The principal reason to use $_GET or $_POST is that it clearly communicates to\
    \ the script\nreader how the array gets its information, and the reader can then\
    \ look for the get or post\nthat generated the data.\n\n# Writing Data to a File\n\
    \nWhile it is nice to display information entered into a form, you most likely\
    \ want to save it\nin a file. This is done by:\n\n+   - Converting the $_GET array\
    \ to a string\n- Appending the /r/n carriage return and linefeed escape characters\
    \ to the end of the\nnew string\n- Opening the file so you can write at its end\n\
    - Writing an entry or record onto the file and testing to see that that was done\n\
    \nThis is done by adding the PHP script to the top of Listing 7-17 as shown here:\n\
    \n```\n<?php\nprint_r($_GET);\n$regrec = implode(\", \", $_GET); //turn array\
    \ into a string\n$finalrec = $regrec . \"\\r\\n\"; //add carriage return linefeed\n\
    $fp = fopen(\"regfile.txt\", \"a\"); //open file to write at end\nif (fwrite($fp,\
    \ $finalrec) == FALSE) { //write the record\n\techo \"Cannot write file.\", \"\
    <br />\";\n}\nelse {\n\techo \"File written.\", \"<br />\";\n}\n?>\n<!DOCTYPE\
    \ html>\n<html>\n```\n\nSee the discussion of the implode() array function earlier\
    \ in this chapter, and review\nt file handling discussion in Chapter 6. There\
    \ are several ways to join or concatenate\ntwo strings, but probably the simplest\
    \ is the concatenation string operator, which is\nsimple period that is used in\
    \ the preceding script to join a carriage return and linefeed to\none person's\
    \ registration record. The reason you want to do that is to provide delineation\n\
    between records so you know where one ends and another begins. Several PHP file\n\
    functions depend on the linefeed character(\\n) to identify the end of the record,\
