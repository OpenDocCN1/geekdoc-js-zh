    # Conventions Used in This Book


    PHP and MySQL Web Development: A Beginner''s Guide uses several conventions designed
    to make the book easier for you to follow:


    +   - **Bold type** is used for user input.

    - *Italic type* is used for a word or phrase that is being defined or otherwise
    deserves special emphasis.

    - A monospaced `typeface` is used for code snippets and listings.

    - SMALL CAPITAL LETTERS are used for keys on the keyboard such as ENTER and SHIFT.


    # How This Book Is Organized


    Although the focus of this book is dynamic web programming with PHP and MySQL,
    it is important that we have a common foundation with HTML, CSS, JavaScript, and
    the programming tools to create dynamic web pages.


    Part I of the book is dedicated to establishing a common foundation with HTML,
    CSS, and JavaScript.


    Chapter 2 discusses the tools needed to create, test, and support the coding of
    clean, error-free web pages. This includes an integrated development environment
    (IDE), with to write the code that will provide support for not only HTML, but
    also JavaScript and PHP. You also need a test server running on your computer
    that supports all the languages, especially PHP and MySQL. Finally, you will need
    access to several popular browsers for reviewing HTML, CSS, and JavaScript (PHP
    runs in a server and is browser neutral).


    Chapter 3 covers HTML and how it is the language of the Web and the structuring
    providing the backbone of all web pages. To keep up with the latest browsers and
    web accessing devices, especially mobile devices, the chapter focuses on the most
    recent revision of HTML, HTML5, and how it has changed from its recent predecessors.
    The chapter looks at both the commonly used legacy tags and attributes, as well
    as what is new to HTML5.


    Chapter 3 covers CSS, which has the job of making all the pages in a website look
    good in many browsers. The chapter explains how CSS is a collection of rules for
    specifying the colors, fonts, and layout of a web page, and it is not only the
    primary way of formatting a web page, but it is also the most efficient. It allows
    you to separate the formatting of a web page from the content of a web page and
    be able to reuse the formatting on other pages.


    Chapter 4 provides an overview of JavaScript that starts out by reviewing the
    JavaScript basics and describing the elements and syntax of JavaScript. It looks
    at various types of events that can occur on a web page, how JavaScript event
    handlers respond to them, and demonstrates several examples of their use. Finally,
    the chapter'
  merge: -1
