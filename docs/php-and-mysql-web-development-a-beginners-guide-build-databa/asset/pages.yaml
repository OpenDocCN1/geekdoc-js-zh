    # NOTE


    Someone may tell you that Microsoft Word will produce an HTML file from text and

    graphics that you lay out on a page in the word processor. Although this is true,
    the code

    is produced is neither efficient nor easy to change or customize. Also, Word does

    not offer any web programming support. Therefore, I strongly recommend against
    using

    Word for website development.


    # Full-Featured Development Packages


    At the other end of the spectrum from Windows Notepad are Adobe Dreamweaver (see

    Figure 1-2) and Microsoft Visual Studio 2012. Both packages offer a great deal
    more than

    an editor are meant to tie into the other tools offered by Adobe or Microsoft.
    Other

    anthan cost, I have several major problems with these packages that prevent me
    from

    recommending them use:'
