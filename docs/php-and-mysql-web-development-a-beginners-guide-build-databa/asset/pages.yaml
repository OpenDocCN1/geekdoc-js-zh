    as table_name.column_name. WHERE precedes a conditional expression that selects
    the rows to be displayed–example, amount > 600. ORDER BY precedes a column name
    on which the selection will be sorted. Here is an example of a full SELECT command
    with actual column names (see Figure 11-4):


    ![](img/b6e70110b29dfbddc8d9869df75d697f_411_0.png)


    # Figure 11-4 The SELECT command''s versatility lets it span simple to complex
    constructs.


    SELECT buyer, product, amount FROM sales WHERE amount > 600 ORDER BY buyer;


    # Keywords Used with SELECT


    The common keywords (or phrases) that can be used with SELECT


    +   * indicates that all columns will be included in the selection.


    +   * AS assigns as an alias to a column or table name that precedes it in the
    column name AS alias name. The alias name can be used anywhere in the statement,
    even before the alias assignment. Tables can also be aliased without AS by simply
    putting the alias name immediately after the table name.


    +   * DISTINCT removes duplicate values in the selection columns.


    +   * FROM precedes the table or tables from which the selection will be drawn.
    Multiple tables are only used when performing a join.'
