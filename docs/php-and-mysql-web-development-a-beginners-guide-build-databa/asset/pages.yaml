    # Create an Index Script


    When a site is loaded, the script that automatically opens without being specifically
    requested is this script, in case, index.php. For that reason, the user authentication
    system will use this script to start the authentication. If any other script in
    the site is opened, the script will check to see if the user has signed in and,
    if not, direct the user to sign in. The user will not be able to enter any page
    of the site if the page has protection on it.


