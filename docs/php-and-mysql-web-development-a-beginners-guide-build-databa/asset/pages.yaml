  md: 'SQL as the foundation of MySQL, the structure and use of the MySQL command
    language, and the basics of working with MySQL directly with a command-line interface
    and phpMyAdmin.


    # Installing and Using MySQL Workbench


    The MySQL Workbench is a recent graphic interface distributed and maintained by
    Oracle that allows users to create, manage, and administer MySQL databases. There
    are two versions of the Workbench: the free Community Edition that can be downloaded
    from mysql.com, and the extended Standard Edition that can be purchased.


    # NOTE


    phpMyAdmin is an early graphic user interface for MySQL that has been significantly
    upgraded over time, so it is a comprehensive and reliable tool. Because it has
    been free and open source for some time and included in WAMP, XAMPP, and LAMP
    (Linux servers for Apache, MySQL, and PHP) server packages, many people (including
    myself) became familiar with and continue to use it as the MySQL interface of
    choice. MySQL Workbench is a fully capable interface that many people like. It
    and phpMyAdmin are much like Ford and Chevy—it depends on your preferences. Try
    both and for yourself (and there are at least half a dozen MySQL front ends if
    you want to search them out).


    # Download and Install MySQL Workbench


    Download and install the MySQL Workbench Community Edition with the following
    steps.


    +   1. Open a browser to mysql.com and click the Downloads tab. Scroll down to
    MySQL Community Edition and click Download From MySQL Developer Zone.

    2. Scroll down to MySQL Workbench and click Download. Scroll down until you see
    Generally Available (GA) releases and click Download opposite MSI Installer (assuming
    you are getting the Windows version).

    3. Enter your Oracle user id and password or sign up for a new one, go through
    Oracle''s questions (part of the reason people say with phpMyAdmin), and click
    Download for the third time. Click Run.

    4. Click Next three times and then click Install. Click Yes to allow the installation,
    and when it is done, click Finish. MySQL Workbench will appear as you can see
    in


    Figure 10-2.'
