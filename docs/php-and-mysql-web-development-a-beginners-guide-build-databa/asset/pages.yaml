    HTML (Hypertext Markup Language) is the foundation programming language of the
    Web and provides the backbone of all web pages. You may add JavaScript and PHP
    to your pages, but the structure around that code is HTML. Although HTML provides
    the critical infrastructure on a web page, it has around for a while, and browsers
    and devices, especially mobile devices, put pressure on it for an update. As a
    result, there is a recent revision of HTML and a significant supplement to it:


    +   - HTML5 is the first major standardized revision to HTML in 15 years. It replaces
    both HTML 4.01 and XHTML 1.1, as well as may hoc additions and revisions in common
    usage. A new number of tags and attributes were added, such as `<audio>`, `<video>`,
    `<section>`, and `<header>`. Other elements have been redefined, modified, or
    deprecated (no longer officially part of the language and whose use is discouraged).
