  md: '+   Mouse event handlers work with the actions of the mouse pointer, such as
    clicking or double-clicking an element, or moving the mouse pointer to or off
    of an element.


    +   Keyboard event handlers respond to key presses on the keyboard.


    +   Form event handlers react to the user''s actions within a data collection
    form, such as selecting form elements, resetting the values in a form, or submitting
    the form to a recipient or database (covered in this chapter).


    When a browser interprets an event as happening, it invokes, or triggers, a JavaScript
    object, called an **event handler**, see the list of JavaScript event handlers
    earlier in this chapter. For example, when you move your mouse pointer over a
    link or image, you will see a pop-up message informing you about the nature of
    the link or image. In this case, the event of placing the mouse pointer over the
    link *triggers* the *onmouseover event handler* to display the message. When you
    move the mouse pointer away from the link or image, typically, the *onmouseout*
    event handler closes the message.


    # NOTE


    Not every event handler listed in this chapter is fully described or demonstrated.
    Many are so closely related that to detail their use would be redundant.


    # Placing Event Handlers in Your Code


    Event handlers are a unique feature of JavaScript in that they can be used outside
    of the `<script>` tags normally used to encapsulate scripts.


    You can add JavaScript event handlers to a number of HTML tags as an attribute.
    Which tags are available depends on the particular event handler. For example,
    the window-event handler `onload` can be used with the `<body>`, `<frame>`, `<frameset>`,
    `<iframe>`, `<img>`, `<link>`, and `<script>` tags, while a click-type event handler
    as `onclick` is compatible with dozens of tags. The majority of common uses occur
    within the `<body>`, `<form>`, and `<link>` tags. An example of this usage


    ```

    <body onload="window.alert(''Welcome to Past Times Antiques'');">

    ```


    which adds the JavaScript event handler to the HTML <body> tag as an attribute.


    # Understanding Event Handler Syntax and Usage


    When using JavaScript as an आयु in an HTML statement, you need to surround the
    JavaScript in double quotes. Text strings within the double quotes, as message
    text for alert boxes, are identified using single quotes. Event handlers are added
    to HTML tags in the form:


    ```

    <HTML tagname="JavaScript Statement; JavaScript Statement;...">

    ```


    where:


    +   < identifies the start of an HTML tag'
