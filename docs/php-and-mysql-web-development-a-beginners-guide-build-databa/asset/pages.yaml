    # CSS Properties and Values


    The properties and values that you can use in a CSS rule are many and varied,
    but roughly fall into three groups: text properties, page properties, and layout
    properties, which are discussed in their own section later in this chapter. To
    understand and appropriately use these properties and values require an initial
    understanding of the fundamental concepts upon which CSS is built.


    # Applying CSS Concepts


    Seven fundamental concepts underlie CSS:


    +   - Cascading and inheritance

    - Box and visual models of page layout

    - Element positioning

    - Units of measure

    - Use of color

    - Text and fonts

    - Tables and lists


    Text and fonts are discussed with the text properties. The box and visual models
    of page layout, as well as positioning and tables and lists, are discussed with
    layout properties. The rest are discussed here.


    # Cascading and Inheritance


    In CSS, every property must have a value. That value can be specific, computed,
    or inherited. To arrive at the actual or final value that will be used with a
    property, a browser must go through three sets of processes. The first of these
    is the cascade, which determines the order of precedence of various factors that
    can influence the final'
