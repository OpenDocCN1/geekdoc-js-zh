  md: '# Parts of JavaScript


    Much as a spoken language comprises elements of speech such as nouns, verbs, adverbs,
    adjectives, and other parts of speech, programming languages have their own set
    of components. In this part, we''ll cover the more common elements of JavaScript,
    providing the groundwork for constructing scripts in later parts of the chapter.
    In this section, we explore JavaScript information types, variables, operators,
    statements, and functions. In the following part, we explore statements that act
    as control structures.


    # NOTE


    As with any language, JavaScript contains many elements in each part of the language,
    far more than can be covered here. To at a comprehensive list, go javascript.com/jsref/,
    w3schools.com/js/, or webreference.com/javascript/reference/core_ref/contents.html.


    # Variables and Constants


    Information (or data) used in JavaScript falls into one of two categories. Either
    case, it is defined by a name you assign to it and its category of data, or data
    type.


    +   - Variables, which are items that can contain different values at different
    times during script execution, start with the keyword var and are followed by
    a name that you give them.

    - Constants contain the same value throughout the execution of your script.


    # Types of Data


    JavaScript will generally recognize the data type you are using by its context
    within scripts, shielding you from assigning a specific type. However, in instances
    where JavaScript misinterpreted your intent, it''s helpful to have an understanding
    of the available data types and some of their characteristics. The more common
    data types are shown in Table 4-2. Here are some points to keep in mind:'
  merge: -1
