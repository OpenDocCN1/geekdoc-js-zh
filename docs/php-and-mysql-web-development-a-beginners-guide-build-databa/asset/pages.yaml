    # Reviewing HTML


    HTML is a series of tags that identify the elements in a web page. Tags, or markup
    tags, consist of a tag name enclosed in brackets (<>) and normally come in pairs.
    Tags are placed at the beginning and end of an element, often text that you want
    to identify; the ending tag name is preceded by a slash. For example,


    ```

    <title>This is a title</title>

    ```


    uses the <title> to identify text that will be placed in the title bar of the
    browser window. Tags are placed around text to identify it and specify how it
    is handled.'
