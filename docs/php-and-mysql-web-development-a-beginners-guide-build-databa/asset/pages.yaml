  md: 'limited flexibility it provides, as well as the difficulty of maintenance.
    Tables divide an area of a web page, or the whole page and columns, creating cells
    where the two intersect. Lists are an indented set of items, which can be automatically
    numbered or have a small image at the beginning of each line, a bullet. As shown
    in Chapter 2, there is an an extensive set of HTML tags for making tables and
    lists, but there is an equally extensive set of CSS properties and values that
    can be applied for formatting and laying out tables and lists.


    # NOTE


    The table values in the display property (table, table-row, table-row-group, table-column,
    table-column-group, table-cell, table-caption, table-header-group, table-footer-group),
    which are meant for creating table elements, for languages other than HTML, like
    XML, that do not define table elements. In HTML, this function is performed with
    the table tags, and the display properties are ignored when applied to HTML table
    elements.


    Table Layout and Formatting A table''s formatting is the sum of the applied to
    the various table elements based on a hierarchy that can be thought of as a set
    of layers. For formatting—for example, a border or a background—to appear to the
    viewer, it either must be applied on the top layer, or the layers above it must
    be transparent, which is the default. The layers, from top (closest to the viewer)
    to bottom, are


    +   1. Cells (<td>) or <th>

    2. Rows (<tr>)

    3. Row groups (<tbody>)

    4. Columns (<col>)

    5. Column groups (<colgroup>)

    6. Table (<table>)


