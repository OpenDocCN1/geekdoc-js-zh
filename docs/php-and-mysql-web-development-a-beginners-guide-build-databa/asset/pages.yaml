  md: '# Part I


    # Getting Ready


    Although the focus of this book is dynamic web programming with PHP and MySQL,
    it is important that we have a common foundation with HTML, CSS, JavaScript, and
    the programming tools to create dynamic web pages. Therefore, this part of the
    book is dedicated to establishing that foundation. In Chapter 1, we''ll talk about
    the tools needed to create and test dynamic web pages. In Chapter 2, we''ll review
    HTML; Chapter 3 will cover CSS; and Chapter 4 will provide a brief refresher of
    JavaScript. It is assumed that you already have some experience with all three
    or more of these tools and what is presented here will reinforce what you already
    know.


    Since you are reading this book, it is a pretty good bet that you already have
    a good idea what the acronyms in the previous paragraph stand for, but just so
    we all start with the same understanding, and here is the definition of each of
    them that I use:


    +   - HTML stands for Hypertext Markup Language. It is the basic language used
    to build web pages, using tags to identify various elements of the page. HTML
    is used in a web browser to display a static web page. HTML5 is the latest version
    of HTML, and as of December 2012, it is going through the official approval process
    by the World Wide Web Consortium (W3C). XHTML is a predecessor to HTML5 and was
    an attempt to use a number of the acronyms in HTML before HTML5 was officially
    recognized. This book will focus on HTML5. HTML5 files have the extension .html
    or .htm.


    +   - CSS stands for Cascading Style Sheets. It is a language used to define styles
    that can be reused on one or more web pages without having to repeat the style
    definitions. CSS files have the extension .css.


    +   - JavaScript is a programming language used to interact with the end user
    of a web page. JavaScript can be used on a static HTML page and have it respond
    to the end user selecting or entering something on the page. JavaScript is included
    and can operate in more browsers (called "client side”), but it can also work
    in a server that is delivering the web page (called "server side”). The most recent
    version of JavaScript is 1.8.5, which was released in March 2011 and is available
    for free. JavaScript has no relationship to Java. JavaScript files have the extension
    .js.


    +   - PHP originally stood for Personal Home Page, but now stands for PHP: Hypertext
    Preprocessor. PHP is a general-purpose programming language used primarily with'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'web applications to both automate a website and utilize a MySQL database. PHP
    runs in a server and so provides server-side processing. The most recent version
    of PHP is 5.5, which was released in June 2013 and is available for free. PHP
    files have the extension .php.


    +   - MySQL stands for My Structured Query Language. It is pronounced either “My
    S-Q-L” or “My Sequel.” MySQL is a relational database management system (RDMS)
    widely used in web applications, often with PHP. MySQL is an implementation of
    the standard SQL, as is Microsoft’s SQL. MySQL is owned by Oracle Corporation,
    but available for free. The latest version of MySQL is 5.6.15, released in December
    2013. MySQL files have the extension .sql.'
  merge: -1
  pgno: 20
