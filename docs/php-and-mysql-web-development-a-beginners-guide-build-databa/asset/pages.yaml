  md: 'GROUP BY groups selected rows by one of the columns in a table. This works
    well with the COUNT () function. See the Tip on COUNT () following this and the
    example in “Select from the Example Table."


    HAVING provides a secondary conditional expression after WHERE that allows you
    to further reduce the selection. This is typically used with GROUP BY to filter
    after the grouping.


    LIMIT limits the number of rows that are returned. A single number following LIMIT
    returns the number of rows starting with the first row. Two numbers following
    LIMIT, such as LIMIT a, b, returns rows beginning with the aᵗ row. There is a
    hitch though. Rows begin at 0, so LIMIT 1, returns four rows beginning with the
