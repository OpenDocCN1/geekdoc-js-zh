    Again, this chapter, like Chapter 13, combines many of the elements described
    in the first 12 chapters of this book into a single web app to demonstrate how
    they fit together using HTML, CSS, JavaScript, PHP, and MySQL. We''ll briefly
    modify the template and CSS from Chapter 13, quickly create the database tables
    with phpMyAdmin, use JavaScript scripts for validating the input, and go through
    the sign-in and authentication process, while it follows what was done in Chapter
    13, there are some significant differences. We''ll then go into more depth with
    the invoice processing setup elements and needed scripts, which are all new.


    In summary, this chapter shows you how to repurpose existing scripts and then
    provides a comprehensive example of invoice processing utilizing the HTML, CSS,
    JavaScript, PHP, and MySQL fundamentals from the earlier chapters to build another
    significant, data-driven website.'
