    # TIP


    Database information functions are particularly useful to debug a script; to find
    what is happening in your database; to find what table, row, and field you are
    accessing; or to find what error messages you are receiving.


    How you use the database information functions depends on what you want to do.
    Here are some examples:


    +   * mysqli_affected_rows(), which gets the number of rows affected by the last
    INSERT, UPDATE, REPLACE, or DELETE SQL query, provides this information to use
    with control functions to iterate through a set of rows. It is for types of queries
    other than SELECT or SHOW, which get the same information from mysqli_num_rows().'
