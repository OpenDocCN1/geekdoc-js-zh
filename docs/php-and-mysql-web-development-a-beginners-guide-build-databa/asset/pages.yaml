  md: '# Class Update and Delete


    The Class Update and Delete function has three subelements:


    +   - Displaying the list of classes and letting the user select one to update
    or delete


    +   - Displaying and updating the class selected


    +   - Displaying and deleting the class selected


    These three elements have in total five scripts, as discussed next.


    **Display the Class List** To update or delete a class, you must first have a
    list of classes from which to choose the one you want to update or delete. That
    is the function of classlist.php. This script begins with a PHP/MySQL section
    using SELECT to get all the records from the class table and ordering them by
    the class date. The first record or row in the database table is then picked and
