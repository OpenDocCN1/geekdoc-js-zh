    \n+   - Use a constructor function to create the first structure of the object,\
    \ and then use the new keyword to create an instance of the object.\n\n+   - Use\
    \ an object initializer to name the object and to assign property values in one\
    \ statement.\n\nUsing the constructor function, you first name an object, and\
    \ then its parameter values are assigned to the properties of the object. For\
    \ example:\n\n```\nfunction furniture(era, wood)\n{\n  this.era=era;\n  this.wood=wood;\n\
    }\n```\n\n# NOTE\n\nThe JavaScript keyword is used in the sense this object, that\
    \ is, the parameter, is assigned to this object being defined.\n\nNext, you have\
    \ to create an instance of the object as a variable, using the keyword new, and\
    \ assign it values. For example:\n\nvar buffet = furniture(“Eastlake”, “Oak”);\n\
    \nThe object initializer accomplishes the same result, but in a more shorthand\
    \ fashion, directly creating an object instance:\n\nvar buffet = {era: “Eastlake”,\
    \ wood: “Oak”};\n\nUsing objects in scripting will be covered in greater depth\
    \ later in this chapter.\n\n# Properties\n\nObjects have properties that allow\
    \ you to describe an object, distinguishing different variations of the same object\
    \ from one another, as well as customize an object to fit your needs. For example,\
    \ you can modify a window by its outer height and width dimensions (outerHeight/outerwidth),\
    \ as well as its inner, or display area, dimensions (innerHeight/innerwidth).\
    \ Some objects have several properties (such as a window), while others have few\
    \ (the string object has only one property, length). Also, different types of\
    \ objects can have the same property (but they would be unlikely to share the\
    \ same values of those properties).\n\nProperties are applied to an object using\
    \ the dot syntax in the form\nobjectname.propertyname=\"value\"; You’ll see many\
    \ examples of this in this chapter."
