- img_proc: true
  md: 'CHANGE COLUMN old_column_name new_column_name column_definition FIRST or AFTER
    column_name


    DROP COLUMN column_name


    MODIFY COLUMN column_name column_definition FIRST or AFTER column_name


    RENAME TO new_table_name


    # NOTE


    In the ALTER alterations, the word "COLUMN" is optional and can be left out. I
    believe, though, it helps in understanding of what is being done, so I recommend
    that it be included.


    The column_name column_definition clause is the same as that used in CREATE TABLE
    described earlier in this chapter. Also, the keyword IGNORE, described earlier,
    can be used with ALTER TABLE. MODIFY COLUMN is used to change only the column_definition
    including the data type.


    The default is that new columns are added at the end after the last existing column.
    You can change this with the FIRST or AFTER column_name clause. FIRST will make
    the new column the first column; AFTER column_name places the new column after
    the named column. In the CHANGE and MODIFY keywords, this clause will reorder
    an existing column.


    You can use several ADD, ALTER, CHANGE, and DROP alteration clauses in the same
    ALTER TABLE statement if you separate them with commas,


    Here are three examples of ALTER TABLE command statements:


    ALTER TABLE sales ADD column tax DECIMAL(10,2);

    | id | ondate | buyer | product | amount | tax |

    |---|---|---|---|---|---|

    | 1 | 2014-05... | Jones | Tablet AP6 | 794.23 | HULL |

    | 2 | 2014-05... | Miller | Phone AP5s | 655.49 | HULL |

    | 5 | 2014-05... | Connor | Tablet AP6 | 851.73 | HULL |

