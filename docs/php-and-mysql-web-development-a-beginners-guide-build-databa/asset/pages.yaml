    # Displaying Messages When a Page Opens/Closes


    Very common uses for event handlers are to display messages when users first open
    a web page or when they leave the page. An example of an onload event handler
    would be to pop up a modal message box when the page finishes loading that requires
    the user to click OK to close the box (presumably after reading the message).
    A modal window (in this case, an alert message box) is a window that requires
    user input to close it before the focus can change to another window or web page.
    The event handler that triggers the message box is onload.'
