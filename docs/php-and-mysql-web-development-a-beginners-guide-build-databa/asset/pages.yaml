  md: 'PHP provides a number of array sorting functions, including


    +   - sort() sorts the values in an array in ascending order and reassigns the
    keys as the default integers 0–9.

    - rsort() sorts the values in an array in reverse order and reassigns the keys
    as the default integers 0–9.

    - ksort() sorts the keys in an array in ascending order and maintains the association
    between values and keys.

    - krsort() sorts the keys in an array in reverse order and maintains the association
    between values and keys.

    - asort() sorts the values in an array in ascending order and maintains the association
    between values and keys.

    - arsort() sorts the values in an array in reverse order and maintains the association
    between values and keys.


    Using the array sort functions is a straightforward process, as you can see in
    Listing 7-7 with the results shown next:'
