  md: "# Control Structures\n\nThe scripts so far in this section have been executed\
    \ from the first statement to the last statement without interruption or change\
    \ of direction, with the exception of repeated function calls. Often, you will\
    \ want to ask if the script should go one way or another, go back and re-execute\
    \ a particular piece of code. That is the purpose of control structures, which\
    \ include if/else statements; while, do-while, for statements; and switch statements.\n\
    \n# if/else Statements\n\nif/else statements are the primary decision-making construct\
    \ in PHP. They allow you to specify if some expression is TRUE, then a group of\
    \ statements will be executed, else a different group of statements will be executed.\
    \ It takes this form:\n\n```\nif (conditional expression) {\n    statements executed\
    \ if TRUE;\n} else {\n    statements executed if FALSE;\n}\n```\n\nThe else group\
    \ of statements is optional and is needed only if you want to do something other\
    \ than continue the script with the conditional expression is FALSE. Also, you\
    \ can nest if/else statements using elseif, like this:\n\n```\nif (conditional\
    \ expression) {\n    statements executed if TRUE;\n} elseif (second conditional\
    \ expression) {\n    statements executed if second conditional is TRUE;\n} else\
    \ {\n    statements executed if second conditional is FALSE;\n}\n```\n\nIn all\
    \ cases, the conditional expression must result in a Boolean TRUE or FALSE (1\
    \ or 0). If a variable simply exists, that is, it has been defined as containing\
    \ something other than NULL, FALSE, or 0, then it is TRUE.\n\n# TIP\n\nIf you\
    \ define a variable as containing a constant like NULL, TRUE, or FALSE, you must\
    \ remember not to put it in quotation marks.\n\nMany conditional expressions are\
    \ comparisons that test if two elements are equal, greater than, or less than.\
    \ Remember when you test for equality in PHP, you must use a double equal sign\
    \ (==), not a single one, which means assignment."
