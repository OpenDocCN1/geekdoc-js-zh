    # Administrator Authentication


    Administrator Authentication is the User Authentication application that was built
    in [Chapter 8](https://example.com/chapter8), except that we are now going to
    use MySQL and the Administrator table in place of the PHP direct disk access.
    As we saw in the flowchart in Figure 8-1, the User Authentication application
    has six scripts:


    +   - Index.php (adminAuthen.php in Class Registration) checks if a cookie is
    on the user''s computer.

    - Registration Page (register.php) provides for the entry of a new administrator.

    - Enter Name Page (enterName.php) encrypts the password and writes the record
    to the table.

    - Sign-In Page (sign.php) provides for the entry of a user ID and password.

    - Verify Page (verify.php) checks to see if the user ID and password are on the
    table.

    - Each Page (enterSite.php) (the other pages in the application) checks if a session
    variable is present.


    These will mostly be used as they were written in [Chapter 8](https://example.com/chapter8).
    Begin with these steps to create the necessary project and folder in Zend Studio,
    and then import the User Authentication scripts into it.


    +   1. In Zend Studio, click File | New | Local PHP Project.

    2. Type **ClassRegistration** as the project name, and click Finish.

    3. In the Project list on the left, right-click ClassRegistration and click New
    | Folder. Type **AdministratorAuthentication** as the folder name, and click Finish.

    4. Right-click **Authentication** and click Import. Click File System and click
    Next.

    5. Click Browse | This PC, locate the Authentication folder from [Chapter 8](https://example.com/chapter8)
    (it should be in C:\Program File (x86)\Zend\Apack2\docs\project08\), click each
    of the six PHP scripts (leave out namelist.txt), as shown in Figure [13-9](https://example.com/figure13-9),
    and click Finish.'
