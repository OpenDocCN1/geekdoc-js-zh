  md: '# Chapter 10


    # Fundamentals of MySQL and SQL


    # Key Skills & Concepts


    +   - Installing and Using the MySQL Workbench

    - Understanding SQL

    - Using MySQL

    - Reviewing MySQL Word Usage

    - Using MySQL Operators

    - Exploring MySQL Functions


    MySQL is a relational database management system that uses the Structured Query
    Language (SQL) to store, work with, and retrieve information over the Internet.
    MySQL is called “the world’s most popular open-source database,” with many millions
    of websites using it as a web resource that runs on PHP. We will discuss it here,
    but MySQL can also run on a stand-alone server not connected to the Web. MySQL
    is built to handle large-volume, multiuser database access. mysql.com says “many
    of the world’s largest and fastest-growing organizations including Facebook, Google,
    Alcatel Lucent, and Zappos rely on MySQL.” MySQL’s low or no cost, ease of use,
    reliability, and usability for large sites makes it easy to we to see why it has
    widespread use.


    > NOTE


    The GNU General Public License discussed here is a model license for free software
    that was developed for the Swedish GNU operating system. “GNU” is not an acronym,
    but the name of an antelope-like animal.


    # About MySQL


    MySQL was developed and first released in 1995 by MySQL AB, a Swedish company
    that is now a part of Oracle. Oracle makes the program available at a number of
    levels, including under a free-to-the-user GNU General Public License (GPL) in
    addition to'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'proprietary licenses. GPL stipulates that any system that uses MySQL may be
    distributed under a similar license. It is this arrangement that makes MySQL available
    of free with the free Zend Server, as well as with WAMP (Windows servers for Apache,
    MySQL, and PHP) and XAMP (cross platform servers for Apache, MySQL, PHP, and Perl).
    As this is written (summer 2014), Zend Server includes MySQL 5.5.23. Oracle offers
    the MySQL Community Server with MySQL for Windows, Linux, and other operating
    systems, which can be freely downloaded, but requires some effort to download,
    setup, integrate, and manage. It also offers MySQL Enterprise, which comes with
    many tools and technical support to make the job much easier, but for a hefty
    price. Zend Server, WAMP, and XAMP using MySQL relatively easy, free, and a good
    way to start a project. MySQL is a mature, full-featured, professional relational
    database management system (RDBMS), as you can see from its website, mysql.com.
    Many professional developers believe that PHP and MySQL are the best way to add
    a database to a website of any size.


    # TIP


    This and the following chapters will require Zend Server to be running and at
    least one browser to be opened to localhost. With the standard setup you will
    be guided through earlier chapters, Zend Server with MySQL should automatically
    start when you start your computer. As described in the last chapter, load a browser,
    and in the address bar, localhost/phpmyadmin, where you see on the right that
    MySQL is installed as the database server (see Figure 10-1). On the left, you
    see that MySQL has its own database with a number of tables that support its use.'
