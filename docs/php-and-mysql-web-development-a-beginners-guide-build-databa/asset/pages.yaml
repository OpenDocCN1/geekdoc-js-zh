    px or pixel, which scales the element to the viewed resolution. On a computer
    screen at 96 dpi (dots per inch) viewed at arm’s length, or around 28 inches,
    1px is approximately 0.01 inch or 0.26 mm, and is slightly smaller (72 percent)
    than a point (pt, see next list), which is 0.0138 inch.


    # NOTE


    When em is used with a font, it is relative to or a percent of the parent element’s
    font units:


    Absolute units of measurement are specific measurements in any of the following


    +   - cm, centimeters, 0.3937 inch


    +   - in, inches, 0.1 centimeter, 0.03937 inch


    +   - mm, millimeters, 0.1 centimeter, 0.03937 inch


    +   - pc, picas, 1/6 of an inch, 12 points


    +   - pt, points, 1/72 of an inch, 1/12 inch


    # TIP


    When you use absolute units, you should be pretty certain of the dimensions of
    the displaying device. As handheld devices become more common, using relative
