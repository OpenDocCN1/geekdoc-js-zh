    # # Control Structures


    Simple scripts are executed from the first statement to the last statement without
    interruption or change of direction. Often, you will want to ask if the script
    should go one way or another, or go back and re-execute a particular piece of
    code. That is the purpose of control structures, which include if/else statements
    and while, do-while, for, and'
