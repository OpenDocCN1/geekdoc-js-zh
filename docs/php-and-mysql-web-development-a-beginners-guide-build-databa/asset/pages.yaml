  md: '# Choosing a Testing Server


    Static web pages, and even dynamic web pages that use JavaScript, client-side
    scripts and run totally in a browser. All you need to test these pages is a browser.
    Dynamic web pages that use server-side features and run in the server instead
    of the client''s browser, such as those written in PHP and that in MySQL, require
    that you have a server on your development computer if you want to test your pages
    there. There are actually three server components that you need: a local web server,
    which is most often the Apache server; a PHP server; and a MySQL server. These
    three servers can be downloaded for free and individually installed. That process,
    however, is complex with a number of opportunities for error. As an alternative,
    there are independent packages that provide a much simpler installation of all
    three servers at the same time. These include WAMP (Windows servers for Apache,
    MySQL, and PHP), XAMPP (X for cross-platform servers for Apache, MySQL, PHP, and
    Perl), and Zend Server. All of these have versions for Windows, macOS, and Linux.


    All three, WAMP, XAMPP, and Zend, include full versions of Apache, MySQL, and
    PHP (generally one version the latest), as well phpMyAdmin, which is used for
    manual maintenance of a MySQL database. XAMPP, the oldest of the three, has a
    bit dated and the most difficult to use. WAMP is a more basic package, but has
    all the server and development tools you will probably need on your computer,
    and all you''ll need for this book. Zend Server provides all you need and adds
    extra support for PHP, but I have found it difficult and time consuming to install.
    I assume that you will be using either WAMP or Zend Server, and I recommend that
    you download and install one of them now if you don''t already have one (you can''t
    use both at the same time). I''m going to be principally using WAMP.


    # Installing WAMP


    If you do a search on WAMP, you''ll see you can get it from either wampserver.com
    or from sourceforge.org. In neither case, what you will find is VampServer. Wampserver.com
    skips the advertising and gives you several choices in the server to install.
    In this winter (2014), you want VampServer 2.4, either 32- or 64-bit, depending
    on your computer. VampServer uses standard Windows installer techniques to download
    and install Apache, PHP, and MySQL.


    +   On the computer where you want to have your testing server, open the upper-right
    corner if it isn''t already displayed, and then click wampserver.com website.
    Click your language choice at the top of the page, which will display the Download
    the VampServer choices, as shown in Figure 1-13.'
  merge: -1
