- img_proc: true
  md: 'Code completion Automatically provides the ending tag for the opening tag you
    typed.


    Code highlighting Provides color-coding for various parts of the code so you can
    easily recognize it.


    Code validation Reviews your code and tells you if it finds something that does
    not look correct—in essence, pointing out potential errors in your code.


    ![](img/b6e70110b29dfbddc8d9869df75d697f_27_0.png)


    Browser view Displays your code as it would appear in a browser within the development
    tool.


    Outline view Provides an outline of your code, like this:


    ![](img/b6e70110b29dfbddc8d9869df75d697f_27_1.png)


    Line numbers Numbers each line of your code so that you can quickly find the line
    referred to in an error message.


    Auto-indentation Provides automatic indentation for subordinate elements as you
    add new lines (see Figure 1-5).'
