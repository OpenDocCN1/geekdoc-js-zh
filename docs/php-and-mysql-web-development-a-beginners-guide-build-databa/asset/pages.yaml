  md: '# Part IV


    # Powering Databases with MySQL and PHP


    In previous chapters you saw how PHP provides a strong programming language, and
    then how MySQL provides a full-featured relational database. In Part IV you''ll
    see how PHP and MySQL work together with HTML, CSS, and JavaScript to allow you
    to build extremely capable and powerful applications to handle a wide range of
    needs.


    Chapter 12 describes how PHP is used with MySQL to create, access, and query a
    database. It reviews the types of queries; how information entered into website
    forms is used to create new records in database tables; and then how information
    in a database is read, formatted, and displayed on a web page. Finally, the chapter
    looks at how to detect and handle errors and security issues.


    Chapter 13 demonstrates the use of PHP and MySQL to create a web app to register
    students and the courses they sign up for, including constructing the forms and
    database tables, validating the data that is entered, querying the database, and
    presenting the information.


    Chapter 14 demonstrates the use of PHP and MySQL to create a web app to handle
    online purchases. This will include presenting a catalog of items for sale, allowing
    the selection of items to be purchased, and handling the final checkout. In addition
    to the database aspects of this, the discussion will include authentication and
    access control, as well as protecting and encrypting vulnerable information.'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# Chapter 12


    # Using a MySQL Database with PHP


    # Key Skills & Concepts


    +   - Database Manipulation

    - Database Information

    - Combining PHP MySQL Functions

    - Expanding PHP Form Handling

    - Facilitating User Interaction

    - Interacting with a Database

    - Improving Security


    PHP and MySQL are like a teacup and a saucer—you can use either without the other,
    but they are meant to be used together. Yes, there are other languages that can
    be used with MySQL and other databases that can be used with PHP, but I believe
    that PHP and MySQL is the most frequently used combination. That combination is,
    of course, the purpose of this book, and bringing the two together is the purpose
    of this chapter.


    # Bringing PHP and MySQL Together


    PHP and MySQL together is relatively easy. Almost all web-hosting sites provide
    both PHP and MySQL, and you have Zend Server or WAMP (Windows servers for Apache,
    MySQL, and PHP) to test the pair on your computer. Creating web apps with MySQL
    and PHP is straightforward and not difficult. It is an extension of what you have
    already learned about PHP and MySQL.


    PHP works with MySQL through a set of functions that perform the SQL commands
    and more. These functions can be split into three categories: database manipulation,
    database information, and database administration.


    # Database Manipulation'
  merge: -1
  pgno: 434
- img_proc: true
  md: 'Manipulating an existing MySQL database with PHP can be broken into these steps:


    +   - Connect to MySQL..


    +   - Perform a query.


    +   - Process the results.


    +   - Release the results from memory.


    +   - Disconnect from MySQL.


    The last two steps are optional, but they are a good practice and become mandatory
    if you are working with multiple databases.


    PHP''s database manipulation functions for MySQL are the heavy lifters of the
    group, opening and closing the database, and querying and retrieving database
    contents, as shown in Table 12-1. There are detailed explanations of these functions
    in the following sections and many examples of their use in this and the following
    two chapters. Use Table 12-1 as a reference to come back to after you have seen
    the function explanations and examples of your use.


    | Function | Description | Arguments and Comments |

    | mysqli_close() | Disconnects from MySQL | Connection ID. Returns TRUE for success
    or FALSE for failure. |

    | mysqli_connect() | Connects to MySQL | Host server name, username, password,
    database name. Returns the connection ID or FALSE for failure. |

    | mysqli_create_db() | Creates a MySQL database | Name of db to be created. Optionally,
    the connection ID. |

    | mysqli_fetch_all() | Gets all result rows as any type of array | Result of a
    query, type of array: mysqli_assoc, mysqli_num, or mysqli_both (the default).
    |

    | mysqli_fetch_array() | Gets a row as any type of array | Result of a query,
    type of array: mysqli_assoc, mysqli_num, or mysqli_both (the default). |

    | mysqli_fetch_assoc() | Gets a row as an associative array | Result of a query.
    Field names are the indexes. |

    | mysqli_fetch_object() | Gets one or more fields in a row | Result of a query.
    Optionally, the class name and an array of parameters. |

    | mysqli_fetch_row() | Gets a row as an enumerated array | Result of a query.
    Field numbers are the indexes, beginning with 0. |

    | mysqli_query() | Queries a MySQL database | Connection ID. SQL query statement.
    Returns the result of the query or TRUE if successful, FALSE otherwise. |


    Table 12-1 Database Manipulation Functions


