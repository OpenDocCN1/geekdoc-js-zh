  md: '# Naming Forms on a Web Page


    Forms are identified in one of two ways. The most straightforward of the two conventions,
    and the one described here, is to simply name the form (the other method, detailed
    in the following section, utilizes the length property of the form object). By
    naming forms, you create an instance of the form object.


    # NOTE


    A downside of naming forms instead of using the document.forms.length property
    to identify forms is you cannot use a form array to loop through each of the elements
    in your forms. This limitation is normally outweighed by the convenience of knowing
    knowing form is without having to figure out the index number of a particular
    form. Of course, if you''re working with only a couple of forms, either method
    is fine.


    Naming forms allows you to access forms on a web page by a unique, meaningful
    name. To name a form, add the name attribute to the <form> tag, as in the following
    syntax:


    ```

    <form name="formname">

    ```


    To call the form from a statement in your scripts, use this method:

    document.formname


    Listing 4-16 employs the length property of the form object to count the number
    of elements in a form (the length property is described later in the chapter and
    is used in other examples and listings). Note the naming of the form at the beginning
    of the <body> section and how it''s called the alert statement to provide information
    for the text in the message box. Several form elements are added using the HTML
    <input> tag set, shown next. These, and others like them, will be the basis on
    which we add scripting statements later in the chapter.


    ![](img/b6e70110b29dfbddc8d9869df75d697f_194_0.png)'
  merge: -1
  pgno: 194
- img_proc: true
