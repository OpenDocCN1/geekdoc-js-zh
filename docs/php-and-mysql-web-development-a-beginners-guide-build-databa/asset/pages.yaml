  md: '![](img/b6e70110b29dfbddc8d9869df75d697f_467_0.png)


    Figure 13-4 The CSS makes major changes in the appearance of the template.


    For the most part, the Registration CSS reflects the work that was done in Chapter
    3 and shown in Listing 3-12. The major exceptions are the selectors for the <a>
    tag, the links used in the horizontal and vertical navigation bars. The CSS provides
    formatting for four states of the <a> tag with these selectors:


    +   - a:link represents the link before it has been clicked, selected, or pointed
    at.


    +   - a:visited represents the link after it has been clicked and the associated
    code has been executed.


    +   - a:focus represents the link as it has been selected but not executed with
    the keyboard.


    +   - a:hover represents the link as it is being pointed at by the mouse.


    The :link, :visited, :focus, and :hover selectors are called pseudo-classes, which
    allow us to format specific states. Actually, there is another, :active, which
    is the tag as it is being clicked and the associated code executed, something
    that generally happens rather rapidly. The :link pseudo-class is the tag by itself
    (just a), but just also covers anchors to bookmarks or named areas on the current
    page, so :link is preferable.


    When using the link pseudo-classes, it is important to put them in the order :link,
    :visited, :focus, :hover, and :active; because of the cascading of the style sheet,
    the last element takes precedence, so if :link is last, :hover would not appear.


