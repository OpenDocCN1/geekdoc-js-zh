    callalert(logic_list[2]);\" \\\n</body>\n</html>\n```\n\n# Other Mouse Click Handlers\n\
    \nThe ondclick event handler functions identically to the onclick handler, except\
    \ it requires a little extra effort on benefit of the user (a second click!).\
    \ Two event handlers react to mouse clicks: mousedown and mouseup. Depending on\
    \ the action you are expecting the user to perform, these event handlers can provide\
    \ less error-prone results than onclick and ondclick. Take, for example, the situation\
    \ where a user clicks a link or button, but moves the mouse pointer off the target\
    \ before releasing the mouse button. Remember the definition of a click: that\
    \ a click involves both the pressing and releasing of the mouse button. If you\
    \ use the onclick event handler, the trigger will not fire. If you use the ondousedown\
    \ event handler, the trigger will fire on the initial press, irrespective of where\
    \ the mouse pointer is released.\n\n# Moving the Mouse Pointer to Trigger Events\n\
    \nLike the click-type event handlers, a few handlers work when the mouse pointer\
    \ is moved over an element or off an element. The most common is the mouseover\
