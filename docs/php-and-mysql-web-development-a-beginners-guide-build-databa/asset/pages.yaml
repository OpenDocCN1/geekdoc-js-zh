    this chapter and used throughout this book.


    +   * CSS (Cascading Style Sheets) is a language used to describe the layout,
    formatting, and look of a web page. It is also used to carry a consistent set
    of styles across a number of pages in a website or even several websites. CSS
    defines a prioritization scheme, and “cascade,” to use when several style rules
    overlap. CSS is covered in Chapter 3.


    This first part of the book provides an up-to-date foundation with HTML5 and CSS
    upon which you can build dynamic websites with JavaScript, PHP, and MySQL. Where
    throughout the book, CSS and HTML5 replace the equivalent HTML.


    HTML, HTML5, and CSS are also controlled by recommended standards by the World
    Wide Consortium (W3C—see w3.org). As of this writing, the CSS recommendation is
    CSS 2 dated June 2011. There are draft proposals for CSS 3 and CSS 4. HTML5, is
    a candidate for recommendation and has taken 15 years to get to status. It is
    awaiting the full approval of the many constituents of the W3C, which is expected
    to happen in 2014. Newer standards are in the works—CSS 3, CSS 4, HTML5.1, and
    HTML5.2—but the process is very slow, in part because the consortium is very,
    including many organizations, academics, and individuals who are active on the
    Web.


    # CAUTION


    To be sure that your websites are viewable in the maximum number of browsers,
    use only the recommended standards for HTML5 and CSS 2.1.


    # HTML5


    HTML5 is a standard method of producing a web page. Being a standard means that
    many browsers can display the web page, so long as they are written to that standard.
    The standard defines what the tags do and how they are processed. The standard
    also presents a set of rules that determine how conflicts are handled—for example,
    how two tags with overlapping definitions work together—so that it’s easier for
    a browser to interpret what you want to do.


    This chapter will provide a good review of HTML and then talk primarily about
    HTML5. For simplicity, I''ll just say “HTML,” unless I''m specifically talking
    about changes in HTML5. Much of what is said also applies to HTML 4, but I recommend
    that you pay attention to the changes in HTML5 and use them even though it may
    mean that you change what you have been doing in the past. Some of HTML5 are easier
    to use, but I agree that is not universally true. Significant thought and effort
    by many people into creating HTML5, and every new browser is reasonably compliant
    with it. Learn about the changes in HTML5, including the new rules, tags, and
    other modifications, and ignore the older tags that have been replaced with CSS
    or otherwise deprecated. This book assumes that is what you want to do, and the
    examples'
  merge: -1
