    PHP file functions, which number many more than mentioned in this and the previous
    section, provide a comprehensive ability to work with files. To see the full set
    of file functions, see php.net/manual/en/ref.filesystem.php.


    # Cookies and Session and Server Variables


    Web pages use variables to temporarily store information while that page is being
    used. It is likely, that you will want to collect and store information from the
    user, from the script being run, and from the server and use that information
    on other pages during the current session, or across multiple sessions. In this
    section, we''ll discuss creating and using variables, cookies, and server variables
    to perform that function of collecting and storing. Start by comparing the three
    objects in Table 6-4.


    | Object | Created With | Accessed With | Stored On | Duration |

    |---| Session variable | $_SESSION | $_SESSION | Server | Session or less |

    | Cookie | setcookie() | $_COOKIE | Client | Until expires |

    | Server variable | Automatically | $_SERVER | Server | Unlimited |


    Table 6-4 Comparison of External Variables


    Session variables, cookies, and server variables are all PHP predefined, or built-in,
    variables called superglobals because they are available throughout as many pages
    as contained in the domain. The superglobals used here are $_SESSION, $_COOKIE,
    and $_SERVER. Their use is explained in the following sections. All the superglobals
    discussed in this book have the $_ leading characters here, as well as in many
    other reference sources, are displayed in all capital letters, although that is
    not a requirement. You''ll see superglobals later in this book.


    Superglobals are associative arrays, whose key is an element name, or array index,
    is a string instead of an integer. Generally, the key is the element value. For
    example: $_SESSION["name"] = $Name; where ["name"] is the key for the array element
    and contents of $Name is its value. Super global arrays, such as $_SESSION and
    $_COOKIE, allow you to define the keys, while others, such as $_SERVER, have predefined
    keys. You will see examples of these in the sections that follow.'
