  md: '# Part III


    # Creating and Using Relational Databases with MySQL


    In Chapters 7 and 8, you saw how with PHP you can read and write a disk file.
    While that worked, it was limited in that you had to read the entire file into
    memory and search it to do what was needed. In Part III, you’ll see how MySQL,
    a full-fledged relational database management system (RDBMS), greatly enhances
    the process of reading, writing, maintaining, searching, and rearranging information
    stored in computer files. It is the third major tool used to make websites dynamic,
    and while a website requires HTML and PHP in addition to MySQL, MySQL does the
    heavy lifting when it comes to the handling of data.


    Chapter 9 introduces databases and describes what makes them relational; how tables,
    records, fields, keys, and relationships are used; and how to select the data
    types for different fields. In addition, the chapter shows how to create, initialize,
    and maintain a MySQL database using phpMyAdmin.


    Chapter 10 explores SQL (Structured Query Language), the foundation of MySQL,
    discussing the basic characteristics of the language. We then introduce MySQL
    and describe how SQL has been implemented in MySQL. The basic command set for
    MySQL is described, as making a database secure.


    Chapter 11 describes using the command line to create and use a database and its
    tables. This will include building, inserting, locating, and deleting records
    and tables.


    Chapter 12 demonstrates how to query, retrieve, and use data from single and multiple
    tables, including ordering and grouping information and keeping track of where
    in the table it is being read from or written to.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Chapter 9


    # Introduction to Relational Databases


    # Key Skills & Concepts


    +   - Understanding Databases

    - Understanding a Relational Database

    - Get and Install phpMyAdmin

    - Opening and Exploring phpMyAdmin

    - Create and Use a Database in phpMyAdmin


    With PHP alone, you saw how to use arrays to quickly collect, store, and retrieve
    small amounts of information and save that information on disk. While the PHP
    tools work, you can readily see that they would not work well with large volumes
    of information. For that task, you need a more robust tool, a “database” able
    to securely handle such volume and provide the means to quickly search for retrieve
    information in a number of different ways. In this chapter, we''ll look at what
    a database is, the different kinds of databases, the parts of a database, how
    a database is used, and how to use phpMyAdmin to set up and maintain a database
    for use on the Web.


    # Databases and Relational Databases


    A database is an organized way of storing information. The key is the word “organized.”
    The primary purpose of a database is to store information in such a way that it
    can be easily and quickly found and retrieved. A database must facilitate the
    easy and quick retrieval and use of the data it has collected.


    # Understanding Databases


    In its simplest form, a database is a table of information, as shown in the Excel
    list of books in Figure 9-1. Each book entry is a row in the table and is called
    a record. Each piece of information in a book entry, such as the title or author,
    is a column in the table, and is called a field.'
  merge: -1
  pgno: 338
