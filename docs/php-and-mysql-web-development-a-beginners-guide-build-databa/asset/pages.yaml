    # Using Arrays


    Arrays are a means of grouping and handling several values with a single entity.
    Arrays are common in programming languages, but PHP provides an uncommon number
    of tools to make extensive use of arrays. The values in arrays are generally variables,
    either strings or numbers, but they can also be constants. Arrays have a single
    name that stores multiple values using an index, or key, to identify individual
    values. The key can be either an integer or a unique string.'
