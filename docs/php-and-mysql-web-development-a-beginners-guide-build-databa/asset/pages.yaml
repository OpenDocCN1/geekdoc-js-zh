    characters plus . (period), _ (underscore), and $ (dollar sign), and are not case
    sensitive. User variables are assigned a value with the assignment character :=
    (semicolon equal sign) or, in the SET clause with just an = (equal sign). Examples
    of user-defined variables are


    +   @book := ''Nightfall''


    +   SET price = 7.99


    **Expressions** are a word or phrase, which can include names, literals, user
    variables, operators, and functions that provide a value in a MySQL statement.


