    # # Select, Replace, Update, and Delete Data in Tables


    Once you have data in a table, you can work with it using the SELECT, REPLACE,
    UPDATE, and DELETE commands, which retrieve, change, and delete data in a table
    and allow you to use it in many ways.


    # ## Selecting Data


    To select data, you enter the command followed by the columns to select from,
    the keyword WHERE, and a conditional expression, and optionally the keyword ORDER
    BY and a column name. The SELECT command takes the following general form with
    several of its optional keywords:


    ```

    SELECT column_names FROM table_name WHERE conditional_expression ORDER BY column_name;

    ```


    In its simplest form, the SELECT command can be used by itself without column
    names or any keywords to, among other purposes, try out MySQL commands, as you
    have seen in earlier chapters. The first "column" represents one or more columns
    that are to be returned in the selection. You can use an asterisk (*) to represent
    all columns. The FROM keyword is used to identify the table from which the columns
    are to be selected, and is'
