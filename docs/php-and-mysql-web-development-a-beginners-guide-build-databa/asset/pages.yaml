  md: '# Statements and Expressions


    JavaScript scripts contain either comments or statements. A statement is a line
    of code that is complete and correct in its syntax to perform a task, typically
    anything that is between semicolons and the opening and closing <script> tags.
    Often, a statement is a single line of code ending in a semicolon, but you can
    have statements that take several lines. Statements contain one or more expressions.


    Expressions are anything that has a value. Values are anything that can be assigned
    to a variable, so values can be any of the data types: integer, floating point,
    string, or Boolean. While the null data type is the absence of a value, it is
    still considered a value for this discussion.


    Expressions contain expressions, or said another way, expressions are building
    blocks that can be used to build other expressions. For example, a = 2, a and
    a = 2 is three expressions:


    # Global Functions


    A function is a piece of script (a snippet) that does something and can be repeatedly
    called within a larger script. Global functions already exist, and you write user-defined
    functions. Some functions require that you pass them values or arguments, which
    the function uses to return a value to you. Other functions simply return a value
    when they are called.


    # Global Functions


    Unlike other languages and programs as PHP or Microsoft Excel, JavaScript does
    not have a large library of internal, global functions to perform day-to-day tasks
    that are not object-specific. On the other hand, JavaScript contains a full complement
    of methods, which are function calls that are related to objects. (Methods and
    objects are described later in the chapter.) In this manner, you can achieve essentially
    the same results using JavaScript methods as you can using internal functions
    found in other languages and programs. The most commonly used JavaScript global
    functions are listed in Table 4-4.


    | Function | Description |

    | --- | --- |

    | eval() | Evaluates a string of JavaScript code without reference to a specific
    object |

    | isFinite() | Evaluates an argument to determine if it''s a finite number |

    | isNaN() | Evaluates an argument to determine if it''s not a number (NaN) |

    | parseFloat() | Parses a string argument and returns a floating point number
    |

    | parseInt() | Parses a string argument and returns an integer |


    Table 4-4 Global Functions'
  merge: -1
