    # Logical Operators


    Table 10-4 lists MySQL logical operators that allow you to include logical expressions
    within statements.


    | Operator | Description |

    | --- | --- |

    | AND or && | Logical AND. Both values must be TRUE for the result to be TRUE.
    |

    | NOT or ! | Negates value. NOT TRUE is FALSE. |

    | OR or || | Logical OR. Either or both values may be TRUE for the result to be
    TRUE. |

