- img_proc: true
  md: 'Earlier in the chapter, the basic functioning and layout of a form were reviewed,
    and the sections that followed illustrated ways you could use JavaScript to get
    your forms to perform actions. The one aspect so far is not of the most common
    ways JavaScript is used in forms. This section discusses form validation and demonstrates
    ways you can use it in your forms.


    # Understanding Validation


    Validation is a way of checking for correctness of user input in a form. Since
    most input is typically to be sent to a database for further processing and future
    use, it''s imperative that the data coming in is accurate and in the correct format.
    Submitted data is generally sent to a CGI or PHP script running on a server that
    certainly has the whatever to handle validation tasks, which requires a return
    trip to the browser, which can slow down the response to the user. A faster way
    to handle the validation is to perform it locally on the user''s computer in conjunction
    with the web browser—client-side validation.


    For the most part, client-side validation can be as simple as verifying that a
    form element has not been left blank, checking for the presence of required characters,
    or accessing external databases for security confirmation.


    # Using Validation with Passwords


    One of the best demonstrations of client-side validation is ensuring basic information
    is provided correctly by the users. You can check that users enter characters
    they believe to be their password by having them enter it twice. (The actual verification
    to determine if the password is stored in a database is handled on the server
    side.) Listing 4-21 at first glance appears to be an overly complex script, especially
    for the minimal output shown here, taken in pieces related to the ways a validation
    script works and the different ways validation can be performed, it becomes quite
    tame.'
  merge: -1
  pgno: 204
