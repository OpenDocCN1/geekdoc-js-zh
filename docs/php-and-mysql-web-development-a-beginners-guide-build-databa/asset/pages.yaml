    # Alter, Rename, Drop Tables and Databases


    In the previous section we talked about querying, changing, and deleting data
    within one or more tables. Here''ll talk about changing and deleting tables and
    databases themselves. While these actions are important and you will most likely
    need to use them, they are not part of your everyday use of MySQL like SELECT,
    REPLACE, and UPDATE are. As a result, I''ll be briefer with these descriptions
    and you may need to use the MySQL Manual if you need to delve deeply into these
    commands.


    # Altering Tables and Databases


    Altering tables and databases allows you to change the structure of your database.
    There is a lot of difference between what you can change in a table and in a database,
    so they will be discussed separately.


    # Altering Tables


    Altering tables is really altering a table’s columns, adding, changing, and dropping
    (deleting) columns. The general form of an ALTER TABLE statement is


    ```

    ALTER TABLE table_name alteration;

    ```


    There are a number of types of alterations; among these are


    +   - ADD COLUMN column_name column_definition FIRST OR AFTER column_name

    - ALTER COLUMN column_name SET DEFAULT literal or DROP DEFAULT'
