    # Working with Images and Image Maps


    Images are added to a web page using the \<img /> tag, which specifies the path
    and filename of the image, as well as a number of attributes, such as size, positioning,
    margins, and border. One of the attributes, ismap, identifies the image as having
    an image map attached to it. The image map is a separate MAP file used by the
    server to relate areas of the image to URLs. To use ismap, you must include the
    Image tag in an anchor tag (the next section, "Adding Hyperlinks and Bookmarks").
    A couple of examples are given in Listing 2-4 and shown in Figure 2-7. Many attributes
    are described in Table 2-6.


    # Listing 2-4 Image Tag Examples


    ```

    <p><img src="hibiscus.jpg" alt="A picture of a hibiscus width="166" height="190"
    /> This is a picture of a hibiscus...</p>

    <p>&nbsp;</p>

    <p><img src="undercon.gif" alt="Under Construction width="40" height="38" />This
    is the Under Construction symbol...\</p>

    ```


    | Tag or Attribute | Description |

    |---|---|n| img | Defines an image that will be linked to a page |

    | alt | Identifies alternative text that is displayed if the image cannot be displayed
    |

    | height | Specifies the height, in pixels, of the image |

    | ismap | Specifies a server-side image map |

    | src | Identifies the path and filename or URL of the attributes |

    | usemap | Specifies a client-side image map |

    | width | Specifies the width, in pixels, of the image |


