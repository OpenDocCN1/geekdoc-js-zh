  md: 'As mentioned earlier in this chapter, JavaScript is an object-based programming
    language. Objects can be the visual elements of a web page such as windows, buttons,
    check boxes, dates, and they can be more abstract elements such as math calculations
    and arrays. You will probably find that the predefined objects in JavaScript are
    all you need for your basic programming work, but you can also create your own
    objects. And to make things even more interesting, objects can have child-objects,
    which can begin to resemble a family-tree hierarchy of the elements that constitute
    a web page.


    # TIP


    There are dozens of predefined JavaScript objects, many associated with several
    properties and methods—far too many to list in this book. I suggest you obtain
    both online and hardcopy reference charts that list objects with their constituents.
    I''ve found useful examples in javascriptkit and JavaScript: The Complete Reference,
    Third Edition by Thomas Powell and Fritz Schneider (McGraw-Hill Education, 2012).


    Predefined objects are identified by a key name, and custom objects are given
    a unique name, using the same naming rules as described earlier in the chapter
    for naming variables. You can have several instances of an object in a web page.
    There, for example, the window object. Each window or frame in a web page is uniquely
    identified by name; further defined by its characteristics, or properties; the
    things it can do, called methods; by which user events (for example, a mouse click)
    affect it. The relationship of an object to its constituents is shown through
    the use of the dot syntax, where the object name is separated from its constituent
    by a period. At the beginning of this chapter (Listing 4-2), you saw the use of
    the alert method being applied to the window object to produce an dialog box (Hello
    World)!


    ```

    window.alert("Hello, World!");

    ```


    where window is the predefined object, alert is a method that displays an alert
    message box, and "Hello, World!" is the method value that displays text in the
    message box.


    # TIP


    The object is implicit in the method alert and you don''t need it, which is why
    alert works by itself, and as window.alert.


    Another example of the dot syntax you''ve seen so far in this chapter is the commonly
    used statement that displays scripting results to the browser:


    ```

    document.write("From the highway right,<br />");

    ```


