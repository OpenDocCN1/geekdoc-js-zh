  md: 'CREATE VIEW view_name AS select_statement;


    An example of creating a VIEW statement and then using it

    CREATE VIEW tables AS SELECT * FROM sales HAVING PRODUCT LIKE

    ''Tablet%%'' ORDER BY buyer;

    SELECT * FROM tables;


    ![](img/b6e70110b29dfbddc8d9869df75d697f_429_0.png)


    # Alter and Drop Views


    ALTER VIEW allows you to make changes to an existing view. It has the following
    general form:


    ALTER VIEW view_name AS select_statement;


    This allows you to change any aspect of the view with the contents of the ALTER
    statement.


    DROP VIEW allows you to delete an existing view. It has this general form:


    DROP VIEW view_name;


    # Using Triggers


    Triggers are one or more statements that are executed on each row of a particular
    table when an event occurs within the table.


    # Create Triggers


    The general form of a CREATE TRIGGER statement is


    CREATE TRIGGER trigger_name trigger_time trigger_event ON table_name EACH ROW'
  merge: -1
