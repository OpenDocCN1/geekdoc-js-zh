    to a destination, typically a URL where a server-side CGI or PHP processing script
    appends the data to a database. Alternatively, the form data could be directed
    to a JavaScript function that would handle the processing, or to an e-mail address.
    The action property allows you to recall these values, an example of which is
    shown here and coded in Listing 4-17. In the listing, the script has a write statement
    containing one argument with a concatenated literal value and the dot syntax:


    ```

    +document.mailto(action);

    ```


