  md: '# Chapter 14


    # Handling Online Purchases


    # Key Skills & Concepts


    +   - Design Template and CSS

    - Database Design

    - Book List and Selection

    - Customer Sign-in and Verification

    - Sales and Confirmation

    - Building an Invoice

    - Deleting Sales

    - Writing an Invoice Record


    This chapter takes over what you did in Chapter 13 a step further by applying
    much of the Student Registration System to the sales of books to customers. It
    will have three similar tables, Books, Customer, and Sales, and one unique table,
    Invoice. It will use scripts similar to Chapter 8''s User Authentication System
    to register and sign in customers and to add and update the Customer. The display
    of books will be a single display page which you could add further pages if you
    wish. When the customer decides to purchase a product, they are taken through
    the sign-in and sales process and then to the concluding of the sale. The major
    new material in this chapter will be the conclusion of the sale in which an invoice
    is produced and the information emailed to the customer. You could, of course,
    add options to this a means of payment, such as PayPal, which provides an easy-to-use
    process for payment. Figure 14-1 shows a summary flowchart. Individual detail
    will be presented as we move through the creation process.'
