    large number of reserved words to list here. For that reason, it is a good practice
    to enclose names, such as database, table, and column names, in either single
    or double quotes whenever it is possible. Also, if you are getting errors for
    things that you cannot find another reason, try putting names in your quotes.


    **Comments** are in one of three forms:


