    validate the login information. This is not meant to be a system that you might
    use, but rather an example of how PHP can be used.


    # User Authentication


    User authentication allows you to limit who has access to a website. It requires
    that all users register for the site, providing a name, a unique ID (usually an
    email address), and a password. This information is stored in a disk file with
    the ID and password encrypted so they cannot be misused. The fact that a person
    has registered (not their ID and password) is placed in a cookie on the user''s
    computer, so he or she will not be asked to register again. A user wishing to
    enter a site is asked to enter his ID or password, which are encrypted and compared
    against the encrypted value in the file of registered users. If the ID and password
    correctly match a file entry, the user is admitted to the site. The fact that
    a user has been admitted to the site (not or her ID and password) is stored in
    a session variable so the user can freely move from one site to another without
    having to reenter the information.


    Figure 8-1 shows a flowchart of a system to perform the user authentication function.
    It includes six scripts in four areas:'
