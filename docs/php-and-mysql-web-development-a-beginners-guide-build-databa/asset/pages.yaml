  md: 'Throughout this and the remaining chapters’ discussion of the PHP MySQL functions,
    we will precede each function with mysqli, which is the newer “improved (i)” version
    of the PHP MySQL functions that uses the latest features of MySQL. There is an
    earlier set of functions preceded with mysqli that has been deprecated as of PHP
    5.5. There are also two styles of mysqli functions, an object-oriented style (“OOP”
    for object-oriented programming), and a procedural style. In line with the “Beginner’s
    Guide” nature of this book, we will only discuss the procedural style. For further
    information about the object-oriented style, see php.net/manual/en/book.mysql.php.
    For use in this book and for much of your work, the procedural style functions
    provide everything that is needed to create full-featured web apps.


    # NOTE


    As with the rest of the book, there are many more PHP MySQL functions than can
    be discussed here. For the full list, see php.net/mysql.


    # Connect to MySQL


    Connecting to MySQL is really “logging into” a particular MySQL database server
    with a username, password, and database name. Like this:


    ```

    mysqli_connect("host_name", "user_name", "password", "database_name");

    ```


    In this book I assume you have installed Zend Server (Chapter 5) on your computer,
    used the default username root, and set up password of your choosing. If that
    is correct, then you could create a variable $conid


    ```

    $conid = mysqli_connect("localhost", "root", "password", "database_name");

    ```


    If mysqli_connect is used to connect, the variable $conid contains the connection
    identifier that is used in the other PHP MySQL functions. This connection remains
    open for as long as the script is running. When the script ends, the connection
    is deleted. As a general rule, you need to specify the connection identifier in
    each PHP MySQL functions. If a connection is not made, then $conid contains FALSE.
    Listings 12-a and 12-b show how this can be used with the results, first on the
    left with the words “password” and “database_name” for those values, and then
    on the right with your password and “books” for the database.


    ![](img/b6e70110b29dfbddc8d9869df75d697f_436_0.png)


