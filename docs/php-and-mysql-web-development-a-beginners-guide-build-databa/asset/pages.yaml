  md: '# # Chapter 6


    # # PHP Control and File Handling


    # ## Key Skills & Concepts


    +   - if/else Statements

    - while and do-while Statements

    - for and foreach Statements

    - switch Statements

    - Basic File Functions

    - Additional File Functions

    - Session Variables

    - Cookies

    - Server Variables


    PHP is often thought of as simply the mechanism for working with a MySQL database.
    It is though, a full-featured programming language with all the features you saw
    in Chapter 5, as well as a full set of control structures and powerful file-handling
    tools, browser information features, and techniques for creating and using cookies
    and session variables. This chapter explores these powerful capabilities of PHP
    and in the process describes how to use if-else and switch statements and the
    conditions that control them, along with for, while, and loops. The chapter also
    looks at PHP file management and functions, the ability to determine the type
    of browser being used, and how to establish session variables that protect access
    to a website. Finally, passing data among web pages using session variables and
    cookies is discussed.


    > TIP


    It is useful to have the PHP Manual and the PHP Function Reference bookmarked
    or set up as favorites in your browser, if you don''t already, so you can quickly
    refer to them. The manual is at php.net/manual/en/, and the function reference
    is at php.net/manual/en/funcref.php.'
