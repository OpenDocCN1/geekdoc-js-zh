    # Application of Fonts


    The key ingredient in the application of fonts is for the browser to present to
    the user the font that the web designer specified in the correct size, weight,
    variant, and style. Most browsers have an algorithm for choosing a substitute
    font if the specified one with its attributes is not available. The W3C provides
    a model for such substitution at http://www.w3.org/TR/CSS21/fonts.html. As a designer,
    you can do several things to assist this with process: choose common fonts, add
    alternatives, and add a generic font.


    For example, if you wanted to specify Garamond as the font family for the main
    division of your page, you might use the following rule:


    ```

    div.main { font-family : "Garamond", "Palatino Linotype", "Times", "serif"; }

    ```


    The fonts are listed in priority order from left to right, so Garamond is used
    first if it is available, and the generic serif font is only used if all three
    of the named fonts cannot be found.


    # NOTE


    Font names do not need to be in quotes if they do not contain a space or a special
    character. Nevertheless, it''s a good practice to put all font names in quotes.


    Considerations to keep in mind with the various font properties include the following:


    +   - A value of italic for the font-style will select both italic and oblique
    font names, while a value of oblique will only select oblique font names.


    +   - The numeric values for font-weight, such as 200 and 600, are names, and
    you cannot interpolate between them, for example, by using 250. The value 400
    is the same as normal, and 700 is the same as bold. Fonts with “light” in their
    name are 300; “book,” “regular,” and “roman” are all normal or 400; “medium” or
    “demi” is 500; “heavy” is 800; and “black” is 900.'
