  md: "# while and do-while Statements\n\nThe while and do-while statements are looping\
    \ constructs that allow you to repeatedly execute a piece of code until a conditional\
    \ expression is no longer TRUE. The while statement is the foundation of this\
    \ set of statements and takes one of the following forms:\n\n```\nwhile (conditional\
    \ expression) {\n  statements executed while TRUE;\n}\n```\n\n```\nwhile (conditional\
    \ expression) :\n  statements executed while TRUE;\n  endwhile;\n```\n\nThe do-while\
    \ statement is similar to the while statement, except that the conditional expression\
    \ is at the end of the statement instead of the beginning. The do-while statement\
    \ takes this form:\n\n```\ndo {\n  statements executed while TRUE;\n}\n```\n\n\
    ```\nwhile (conditional expression);\n```\n\nThe most common conditional expression\
    \ is to compare a counter with some end value. In other words, to initialize a\
    \ counter and then to loop some statements, incrementing the counter with each\
    \ loop, until the counter exceeds the end value. Listing 6-2 shows examples of\
    \ this for both while and do-while using the array function chr(), which returns\
    \ a character based on its number in the standard set of characters, with the\
    \ results shown next. You can see that in this case there is no difference between\
    \ while and do-while.\n\n> Listing 6-2 while and do-while Examples"
  merge: -1
  pgno: 257
- img_proc: true
  md: "```\n<html>\n<head>\n  <title>Listing 6-2</title>\n</head>\n<body>\n<h1>While\
    \ and Do-While Examples</h1>\n<?php\n  echo \"<b>Partial Character Set with While/</b><br\
    \ />: \";\n  $i = 33;\n  while ($i <= 41) {\n    echo \"Character #, $i, \\\"\
    \ is\\\", chr($i);\n    echo \"&nbsp;&nbsp;&nbsp; Character # \\\", $i + 1, \\\
    \\n      \\\" is\\\", chr($i + 1);\n    echo \"&nbsp;&nbsp;&nbsp; Character #\
    \ \\\", $i + 2, \\\\n      \\\" is\\\", chr($i + 2), \\<br />: \\\";\n    $i =\
    \ $i + 3;\n  }\n  \n  do {\n    echo \"Character #, $i, \\\" is\\\", chr($i);\n\
    \    echo \"&nbsp;&nbsp;&nbsp; Character # \\\", $i + 1, \\\\n      \\\" is\\\"\
    , chr($i + 1);\n    echo \"&nbsp;&nbsp;&nbsp; Character # \\\", $i + 2, \\\\n\
    \      \\\" is\\\", chr($i + 2), \\<br />: \\\";\n    $i = $i + 3;\n  } while\
    \ ($i <= 41);\n?>\n</body>\n</html>\n```\n\n# # NOTE\n\nCode in **do-while** is\
    \ guaranteed to execute at least once, since the condition isn’t checked until\
    \ after the first execution. A **while** statement may never execute if the condition\
    \ immediately evaluates to false."
