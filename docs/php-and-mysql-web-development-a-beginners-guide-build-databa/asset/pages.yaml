  md: '# NOTE


    You should not get to signin.php without being registered, but the “Not registered?
    Click here!” is added so you can get back to register.php without having to delete
    the cookie.


    # Verifying the Input


    The verify.php script, which you can see in Listing 8-5, reads the entire namelist.txt
    file into the $namelist string using the file_get_contents() function. It then
    combines the user ID and password that were entered at sign-in and encrypts that
    combination. The stropos() function is then used to see if the encrypted combination
    is contained in $namelist. If the encryption is there, the session variable is
    updated, and execution is transferred to the original site scripts. If the encryption
    is not found on the disk file, the $retry variable is incremented and checked
    to see if it is greater than 3. If so, execution is transferred to register.php;
    otherwise, the $retry variable execution is stored in the $_SESSION variable,
    and execution is transferred to signin.php.


