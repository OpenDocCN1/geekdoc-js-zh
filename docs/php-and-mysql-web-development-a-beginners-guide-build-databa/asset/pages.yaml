  md: '# Class, a list of available classes


    +   • Student, a list of students

    • Registration, a list of students registered for a particular class

    • Administrator, a list of administrators allowed to edit the database


    Three of the tables—Class, Student, and Registration—form a relational database
    with the Class ID and Student Email being foreign keys used in the Registration
    table. This allows the storing of only the keys in the Registration table, yet
    having all of the information in the Class and Student tables while looking at
    a registration.


    The tables will be built in phpMyAdmin to quickly get them online. Assuming you
    Zend Server installed with the Apache2 web server, as discussed in earlier chapters,
    use these steps to do:


    +   1. Start a browser and in the address bar, type localhost:phpmyadmin, and
    press ENTER.

