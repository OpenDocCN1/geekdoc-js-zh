    # Deleting Data


    The DELETE statement deletes rows FROM name to the table, optionally using WHERE
    with a conditional expression to select the rows, and optionally the keyword ORDER
    BY and a column name to specify the order in which the deletion occurs. You can
    also use LIMIT to limit the deletion to a certain number of rows. The DELETE command
    takes the following general form with several of its optional keywords:


    ```

    DELETE table_name WHERE conditional_expression ORDER BY column_name LIMIT number_of_rows;

    ```


    If there is not a WHERE clause, all rows are deleted.


    # Keywords Used with DELETE


    The common keywords (or phrases) that can be used with the DELETE are


    +   * FROM precedes the table in which the deletion will occur.

    * IGNORE prevents DELETE from aborting if there is an error.

    * LIMIT limits the number of rows that are deleted. A single number following
    LIMIT deletes rows starting with the first row deleted. Two numbers following
    LIMIT, such as LIMIT a, b, deletes rows beginning with the ath row. There is a
    hitch, though. Row numbers begin at 0, so LIMIT 1, 4 deletes four rows beginning
    with the second row.

    * LOW priority waits to delete the rows and prevents the client from doing anything
    until one is reading from the table.

    * ORDER precedes the column or columns used in sorting the deleted rows. Normal
    sorting is in ascending order (a to z, 0 to 9). You can sort in reverse order
    by adding the keyword DESC following the column name in ORDER BY.

    * WHERE provides the conditional expression that must be satisfied (be TRUE) for
    a row to be deleted. The expression can contain conditional functions and operators.

    * QUICK pauses some indexing operations to slightly speed up the deletion.'
