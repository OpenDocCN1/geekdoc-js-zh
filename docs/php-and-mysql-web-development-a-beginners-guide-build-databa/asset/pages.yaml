  md: '# Altering Databases


    ALTER DATABASE allows you to change the default character set and the collation
    sequence used in the database. The general form of an ALTER DATABASE statement
    is


    > ALTER DATABASE database_name CHARACTER SET = character_set_name or COLLATE =
    collation_name;


    The commands SHOW CHARACTER SET; and show COLLATE will provide lists of the character
    sets and collation sequences that you can use.


    ![](img/b6e70110b29dfbddc8d9869df75d697f_424_0.png)'
