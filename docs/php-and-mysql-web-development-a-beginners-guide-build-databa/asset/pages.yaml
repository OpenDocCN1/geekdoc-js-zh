  md: '# saleconfirmshop.php


    The only difference between salesconfirmshop.php and salesconfirm.php is that
    salesconfirmshop.php allows the customer to return to shopping instead of checking
    out, and so the last line of code is changed to:


    ```

    header ( "Location: repbooks.php?email=$email");

    ```


    # NOTE


    You could use one file with a different query parameter instead of two separate
    files, but I wanted to leave it to emphasize the difference.


    # repbooks.php


    repbooks.php is the same as the original books list books.php, except that repbooks.php
    handles an active customer that is already in the process of buying and so doesn''t
    need to enter their email and password upon selecting a book. Their email address
    is passed to repbooks.php by salesconfirmshop.php and goes directly to confirm.php,
    passing along email address with this changed line of code:


    ```

    <a href="confirm.php?bookisbn=<?php echo $book[''book_isbn'']; ?>&email=<?php
    echo $_GET[''email'']; ?>">Purchase</a></td>

    ```


    # Invoicing


    The invoicing section of the book sales app has three elements: invoicing, which
    creates and displays the books purchased on an invoice; writing a record to the
    Invoicing table and an email invoice to the customer; and deleting a sales record
    if the customer decides at the last minute they do not want to buy.


    # Building an Invoice


    Building an invoice is done with the checkout. script, which picks up unvoiced
    sales for a particular customer from the Sales table, places them in a list, adds
    up the total of the sales, and adds tax and freight to produce the total invoice
    amount.


    checkout.php is called by salesconfirm.php, which passes the customer''s email
    address. The email address is used to get the customer''s record from the Customer
    table to provide the name and address information for the invoice.


    Next, or the most recently written record number is retrieved from the Invoice
    table to get the last invoice number, which 1 is added for the invoice number
    of the current invoice being built. This is done by ordering a select of the Invoice
    table by invoice number in descending (DESC) order, as you see in this statement:


    ```

    $query = "SELECT * From invoice ORDER By invoice_no DESC";

    ```


    The invoice itself is made of three sections:


    +   * The name and address section, which also includes the current date and the
    invoice'
