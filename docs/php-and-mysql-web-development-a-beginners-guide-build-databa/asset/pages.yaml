    # Statements and Expressions


    PHP scripts contain either comments or statements. A statement is anything that
    is in between semicolons and the opening and closing PHP tags. Often, a statement
    is a single line of code ending in a semicolon, but you can have several statements
    on a single line, and you can have statements that take several lines. Most statements
    contain one or more expressions, but a few are only a single keyword, such as
    break or else.


    Expressions are anything that has a value and evaluates to a value. Values are
    anything that can be assigned to any of the data types: integer, floating point,
    string, Boolean, array, or object. While the NULL data type is the absence of
    a value, it still considered a value for this discussion.


    Expressions can contain expressions, or said another way, expressions are building
    blocks that can be used to build other expressions. For example, Sa = 2 is three
    expressions, 2, Sa, and Sa = 2.


    # Functions


    A function is a piece of script that does something and can be repeatedly called
    within a larger script. Some internal functions already exist, and some user-defined
    functions you write. Some functions require arguments, which are values that you
    pass to the function, which uses them to compute a return value. Other functions
    simply return a value when they are called.'
  merge: -1
