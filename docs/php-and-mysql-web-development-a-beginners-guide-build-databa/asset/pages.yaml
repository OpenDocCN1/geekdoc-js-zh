  md: 'As your scripts get longer, it becomes very tempting to close up your code,
    such as putting if statements on one line and not indenting. The problem with
    that is the code becomes harder to visually check and therefore is prone to problems.


    # Additional File Functions


    Although fread() and fwrite() are very functional, as you''ve seen, PHP provides
    a number of other ways to read and write data on a server''s storage devices.
    Both fread() and fwrite() are aimed at reading or writing parts of a file or from
    strings. PHP can also read from an array, read a character at a time, read a line
    at a time, and move within a file using the functions described in Table 6-3,
    which are demonstrated in Listing 6-2.


    | Function | Description | Explanation |

    |---|---|--|

    | feof() | Determines the pointer is at end of file (EOF) | The only argument
    is the file pointer created with fopen(). Returns TRUE if the EOF is reached and
    FALSE otherwise. |

    | fgetc() | Reads a single character from an open file | The only argument is
    the file pointer created with fopen(). Returns a string with the character read
    or FALSE if EOF is reached. |

    | fgets() | Reads a line designated by \n from an open file | The only argument
    is the file pointer created with fopen(), and optionally, the number of bytes
    to read. Returns a string with data or FALSE. |

    | file() | Reads an entire file into an array, where each element is a line designated
    by \n | The required argument is a string with the path and filename. The default
    is to read as binary data, but you can change that with the FILE_TEXT constant
    as the second argument. |

    | filesize() | Determines the size of a file | The only argument is a string with
    the path and filename. Returns the size in bytes or FALSE. |

    | fseek() | Moves the pointer of an open file | The required arguments are the
    file pointer created with fopen() and the number of bytes to move the pointer.
    The default is to move from the beginning of the file, but adding the SEEK_CUR
    constant as the third argument number of bytes to the current position, using
    the SEEK_END constant as the third argument adds the bytes to the EOF. Returns
    a 0 for success; otherwise, -1. |

    | ftell() | Provides the current position of the file pointer of an open file
    | The only argument is the file pointer created with fopen(). Returns the number
    of bytes from the beginning of the file as an integer, or FALSE. |


    Table 6-3 Additional File Functions'
