  md: '+   Slice, array_slice(), removes a sequence of elements from an array based
    on an offset and optionally a length. If the offset is positive, the starting
    element is that number of elements from the beginning of the array. If the offset
    is negative, the starting element is that number of elements from the end of the
    array. If the length is positive and less than the total number of elements in
    the array, then the slice will include the length number of elements. If the length
    is positive and greater than the number in the array, the slice will include the
    remaining elements in the array. If the length is negative, then the slice will
    stop that number of elements from the end of the array. By default, a new set
    of numeric keys will be created for the array, but you can include the $preserve_keys
    variable set to TRUE to change that behavior. Said another way, you can pass an
    optional fourth parameter set to TRUE to change that behavior.


    +   Chunk, array_chunk(), divides an array into chunks of equal size based on
    a size parameter, except that the last chunk may be and produces a multidimensional
    array with the results. By default, a new set of numeric keys will be created
    for the resulting arrays, but you can include the $preserve_keys variable set
    to TRUE to change that behavior.


    +   Splice, array_splice(), removes a sequence of elements based on offset and
    length parameters in array_slice(), and provides for the insertion of an optional
    replacement array where the sequence was removed. Keys are replaced by a new set.


    +   Flip, array_flip(), exchanges keys and values in an array. If there are multiple
    occurrences of a value in the original array, only the last one will be used and
    the others will be lost.'
