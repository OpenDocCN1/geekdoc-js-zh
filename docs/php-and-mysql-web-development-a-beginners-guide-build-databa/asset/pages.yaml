    # Insert Data into Tables


    The next step is to load data into a table using the INSERT command, which creates
    a new row or record (“row” and “record” are synonymous) in the table. INSERT adds
    a new row at the end of the inserting rows in a table. Instead of INSERT, you
    can use REPLACE, which will overwrite an existing row if it already exists; otherwise,
    it will perform a standard INSERT. See “Replacing Data” later in this chapter.


    # Inserting Data


    To insert data, enter the command followed optionally, but traditionally, by the
    keyword INTO, then the table, the list of column names that will receive values,
    the keyword VALUES or VALUE, and one or more sets of values. The INSERT command
    can use one of the following options:


    ```

    INSERT INTO table_name (column1_name,.... columnn_name) VALUES (column1_value,...,
    columnn_value1),... (column1_value,.... columnn_value);

    ```


    or


    ```

    INSERT INTO table_name SET column1_name = value,.... columnn_name = value;

    ```


    or


    ```

    INSERT INTO table_name (column1_name,.... columnn_name) SELECT...

    ```'
