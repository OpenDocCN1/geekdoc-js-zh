  md: '# # The Box and Visual Models of Page Layout


    In the simplest sense, a web page is a series of boxes within boxes, next to other
    boxes, and above and below still other boxes. The process of laying out a web
    page can be thought of as sizing and arranging the boxes so they all fit in the
    order you want, like this:


    ![](img/b6e70110b29dfbddc8d9869df75d697f_124_0.png)


    Elements on a web page are in one of two classes:


    +   - Block-level elements take a specific, unique area of the screen and generate
    a block that is a containing block for its descendants. This called a block-level
    box, or just a “block box.” Block-level elements include `<body>`, `<div>`, `<article>`,
    `<aside>`, `<footer>`, `<header>`, `<nav>`, `<section>`, `<h1>`, and `<p>`.


    +   - Inline-level elements do not take a unique area of the screen, nor by default,
    form a unique box. Inline-level elements are inside (in line with) the boxes created
    by block-level elements. Inline-level elements include `<em>`, `cite`, `<strong>`,
    and `<b>`. For the sake of layout, inline-level elements can be thought of as
    contained in an “inline box.”


    The `display` property can make block-level elements inline-level and make inline-level
    elements block-level.


    Block-level elements not only have an invisible box that contains them, but also
    the box can be contained in up to three additional boxes associated with the element:'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'Padding, the area separating the content from the border.


    Border, the normally visible line or decoration that surrounds the padding.


    Margin, the area separating the border from its containing block, such as a page
    or a parent block.


    The total size of a block-level element is the sum of the content, padding, border,
    and margin, as shown next. If the padding, border, and margin are all 0, which
    is the default, the content immediately abuts its containing block.


    ![](img/b6e70110b29dfbddc8d9869df75d697f_125_0.png)


    As a web page is rendered on a screen or other device, it flows in on a specific
    order, and later elements can both affect and be affected by earlier elements.
    As each element comes in, it generates none, one, or more boxes. How these boxes
    appear on the screen and affect other boxes is called the visual formatting model,
    or just “visual model.” Components of the visual model affect how the final page
    appears on the screen and include


    +   - Viewpoint, the area that the user sees; I have called this the screen. This
    may be larger or smaller than the designer’s page or canvas, and has to be considered
    by both the browser and the designer.


    +   - Containing block is a block created by an element higher in the hierarchy,
    either a parent or an ancestor, which contains the current element, itself may
    be a containing block for its children and descendants. For example, as shown
    next, the <body> element contains a <div> element, which contains <h1> and <p>
    elements. The <body> element containing block holds the other three elements as
    either a child or descendants. The <h1> and <p> elements are in the containing
    blocks of both the <div> and <body> elements, which are parent and ancestor, respectively.'
