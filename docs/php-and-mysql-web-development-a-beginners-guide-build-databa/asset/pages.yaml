    them.

    - Constants, which will contain the same value throughout the execution of your
    script, are by convention, all uppercase names that you give them, NULL is a constant.


    The name that you give either variables or constants (or any label in PHP) is
    case sensitive; can begin with the letters a-z or A-Z, or an underscore (_); can
    be of any length; and can contain letters, numbers, underscores, and the characters
    in Western European alphabets. While you may find that some special characters
