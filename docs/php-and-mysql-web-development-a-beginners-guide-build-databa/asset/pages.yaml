  md: "# Using the onsubmit Event Handler\n\nThe <body> section in Listing 4-21 appears\
    \ much the same as you've seen in other examples in this chapter, producing the\
    \ basic short form. The one interesting aspect in this construction is the argument\
    \ in the **onsubmit** attribute, that is, onclick=\"return validateform(); This\
    \ construction is a key element in how the validation process works.\n\nWhen the\
    \ user clicks the Submit Valid Form button, instead of sending the form values\
    \ to the server specified in the **action** attribute, as has been the case in\
    \ previous examples, the **onsubmit** event handler in the <form> tag set intercepts\
    \ the request, calls the `validateform()` function (which is described in the\
    \ next section), and using the return keyword, sees if the function returns a\
    \ *true* or *false*. If *true*, the values are sent to the server; if *false*,\
    \ no data is sent.\n\n# Dissecting the Function\n\nThe `validateform()` box comprises\
    \ several *if* statements that perform the validation checks within the text box\
    \ and password boxes. If the condition of an *if statement is true, the code continues\
    \ running uninterrupted. If the condition is false, an alert message appears to\
    \ the user apprising them of a problem.\n\nThe first two *if* statements in Listing\
    \ 4-21 are nearly identical and simply check to make sure the Name box and password\
    \ box are not blank. If either is blank, an alert is displayed, a *false* is returned\
    \ to the onsubmit event handler in the <body> section, and no form data is sent.\n\
    \n```\ndocument.passwordform.fullname=\"\"\n  window.alert(\"Please provide your\
    \ full name\");\n  document.passwordform.fullname.focus();\nreturn false;\n}\n\
    ```\n\n# NOTE\n\nIt important to use fully qualified form field names—**document.passwordform\
    \ .fullname** and not **passwordform.fullname**—if you want to write scripts in\
    \ older browsers, where \"document\" refers to the page being displayed in the\
    \ browser.\n\nIf an alert is displayed, note that the focus is brought back to\
    \ the affected element when the user closes the message box.\n\nIn the third *if*\
    \ statement, the length of the password entered by the user is compared with the\
    \ length specified in the **minlength** variable. If it's less than the value,\
    \ an alert is displayed, a *false* is returned to the onsubmit event handler in\
    \ the <body> section, and no form data is sent.\n\nIn the fourth and final *if*\
    \ statement, the values of the two password boxes are compared to ensure the entered\
    \ password is identical to the password entered in"
  merge: -1
  pgno: 207
- img_proc: true
  md: 'confirmation box. As in the other if statements, false generates an alert,
    and a true continues the script.


    # TIP


    If you were to just compare the two passwords (passwordform.pwd1 != passwordform.pwd2)
    and not their values, it is possible that you would not get equality when the
    two passwords are the same because the other attributes of the variable, such
    as length, may differ.


    The final actions in the function are handled by the else and final return statements.
    When all the if statements return true, the code processing reaches the else statement,
    which displays a confirmation alert to acknowledge to the user that all is well.
    When the alert is acknowledged, the function returns a true, which is received
    by the onSubmit event handler, which finally gives the green light for the form
    to be sent to the URL action attribute.


    While this is a rather long example, it is really the tip of the iceberg in terms
    of validation checks you can perform. For example, in addition to what was checked,
    you could check to see that the password was a "strong" password by verifying
    that capital letters, numbers, and special characters were included. Or, in the
    case of an e-mail text box, you could check to see if the user included both the
    @ character and a period (you''ll see an example of this later in the book). Using
    variations on the examples in Listing 4-21, you can construct your own validators
    to check the parameters important to your forms.


    # Try This 4-1 Create a Registration Form


    Create a form to collect registration information for an individual using JavaScript
