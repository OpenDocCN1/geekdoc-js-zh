    # Accepting and Filing Form Data in PHP


    The big difference between PHP and JavaScript is that JavaScript operates in the
    client and PHP operates in the server and allows you to accept data entered by
    the user and save it on the server. In this section, we''ll use PHP to take the
    data enters into an HTML form, put it into an array, and write it onto a database.
    To do this, the form must have names in all `<input>` fields and must have a Submit
    button. The form shown in Listing 7-17 meets both of these requirements, and it
    has been shown that data can be entered into this form and validated, making it
    a good candidate to demonstrate the collection and filing of data with PHP.


    # Collecting Data in a Form


    To collect the data that is entered into the form requires that Listing 7-17 be
    modified to identify the method used to transfer the data to PHP, and optionally
    you identify where to send the data so PHP can use it.


    The HTML `<form>` tag is used to specify both method of transferring the data
    in the form and to transfer it. The primary methods used to transfer form data
    are get and post. These are added to the `<form>` tag using one of the method
    attributes: method="post" or method="get". The major difference between the two
    is how the data is transferred.


    ```

    http://localhost/project07/listing07-18.php?fullname=Marty+Matthews&email=marty@ansisp.com#bachelors-on&online-onInterests=socialwork

    ```


    The data is added after the actual URL with a ? separating the two. Spaces are
    marked by a + and successive fields are separated by &.


    The post method transfers data in the HTTP header that is sent to the server with
    a web page request URL, but not in it. This provides a bit of security, the data
    being transferred is not quite obvious.


    Identifying where transfer data is done in the `<form>` tag with the action attribute.
    If there is no action attribute, it is expected that the current web page will
    use the form data (see the next section); otherwise, an action attribute is added
    to the `<form>` tag with a page name (such as `webpage.php`), either if it is
    in the same directory or folder as the current page, or with a path in the front
    of the page name (for example, `/parentfolder/webpage.php`). Here is an example
    of the `<form>` tag with both the method and action attributes:


    ```

    <form name="regform" method="get" action="webpage.php">

    ```


