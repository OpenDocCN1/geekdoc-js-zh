  md: '# NOTE


    There are some similarities between JavaScript and PHP. To provide the necessary

    coverage of both topics, some duplication occurs between the two discussions.


    Chapter 4 provides an introduction and review of JavaScript and assumes that the
    user

    already has some knowledge of the subject or will other means to supplement the

    present here. The chapter starts out by reviewing the JavaScript basics and then

    describing the elements and syntax of JavaScript. It next looks at various types
    of events

    can occur on a web page, how JavaScript event handlers respond to them, and

    demonstrates several examples of their use. Finally, the chapter looks at forms,
    which are

    the web mechanism by which information flows from the user to the web page. JavaScript
    can add automation to form

    to respond to the user enters. The chapter discusses how forms are created and
    used,

    ttheir methods and properties, how information in the form is validated, and how
    to carry

    out navigation in a website based on JavaScript navigation elements.


    # NOTE


    JavaScript has no direct connection with Java, except that they both come from
    Sun

    Micystems, now part of Oracle, and share some common syntax and keywords.


    # Introducing JavaScript


    JavaScript is a programming language designed for web computing. A programming

    language is simply a set of rules, called syntax, that govern how you communicate
    with a

    computer using various elements of the language. JavaScript uses a model called
    OOP

    (object-oriented programming). You have objects (such as a window) that have properties

    (say, length) and methods, or actions, that the object can perform (such as open),
    while

    responding to events, or actions performed upon the objects (for example, a click).
    Once

    you are familiar with the basic terminology and syntax, JavaScript programming
    is only

    matter of writing a sequential set of statements for the computer and its software
    to

    understand and act upon.


    # Characteristics of JavaScript


    How and when this interaction takes place between the computer and the user is
    what

    differentiates JavaScript (and other scripting languages) from conventional languages,

    asuch C or Java. Programming languages that create applications (for example,
    the,

    Word.exe for Microsoft Word) require special software to create the code and then

    it be run through a compiler to become computer readable. A compiler is

    software that checks the code for errors and then translates the written code
    into the

    computer’s machine code. Although this method allows for very serious computing,
    it

    takes time and resources to accomplish.


    # JavaScript Is Interpreted'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'In contrast, JavaScript is referred to as an interpreted language, which means
    its code is run on the fly, without the need to compile it. All that is needed
    is a text editor to create the files that contain the code, and a web browser
    that provides the underlying interpretation of the code, as is with HTML and CSS.
    While JavaScript tends to not perform as efficiently or as quickly as compiled
    code, its performance for the sorts of tasks used in creating dynamic web pages
    is good enough, and its advantages of being easy to edit and embed on a page more
    than make up for its shortcomings. Also, compiled code tends to be platform specific
    (Windows versus Mac), while JavaScript is not.


    # # JavaScript Is Client-Side Computing


    As the names imply, client-side and server-side computing refer to where the programming
    code is being executed. With server-side programming such as PHP, a request from
    a user''s web page is sent to the hosting web server, is executed, and then the
    results are sent back to a web page in the user''s browser. While having a server
    and its available networked resources and databases allows a round-trip of information
    to pass from client to the server and back. In addition, a server resources are
    shared among users, thus opportunities exist for delays. Client-side computing
    performs the execution on the client''s computer, freeing the server to perform
    more intensive tasks and providing the user with a faster experience. (Many applications
    use both server-side and client-side computing to split the workload and take
    advantage of the benefits offered by each.) JavaScript is a client-side program,
    which allows for faster execution of code in the client and more responsive feedback
    to the user. You may want to do any checks on the server too even if they are
    duplicated from the client.


    # # JavaScript Programming Tools


    To work effectively with JavaScript, you need to have a development environment
    that supports both the writing and the testing of JavaScript. You''ll need tools
    for


    +   * JavaScript writing, with code assistance and validation as you write the
    script

    * JavaScript script testing on your development computer

    * Developmental support in a browser, to help debug

    The tools described and recommended in Chapter 1 work well with JavaScript, including

    * Aptana Studio integrated development environment

    * WAMP, a combination of the Apache web server, the MySQL database server, and
    the PHP server

    * Internet Explorer, Chrome, and Firefox browsers, needed to test and debug your
    scripts'
