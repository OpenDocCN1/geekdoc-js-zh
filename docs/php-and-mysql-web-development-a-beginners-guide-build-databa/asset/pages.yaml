    ORDER precedes the column or columns used in sorting the selected rows. Normal
    sorting is in ascending order (a to z, 0 to 9). You can sort in reverse order
    by adding the keyword DESC the column name in ORDER BY.


    WHERE provides the conditional expression that must be satisfied (TRUE) for a
    row to be selected. The expression can contain conditional functions and operators.


    # NOTE


    The order of the keywords in a SELECT statement is important and should normally
    follow this order: ALL, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT. An exception
    is that INTO also follow the initial set of column names.


    # TIP


    The function COUNT() can be used in a SELECT statement with the initial select
    column names as arguments in COUNT (). This counts the number of rows that are
