- img_proc: true
  md: '![](img/b6e70110b29dfbddc8d9869df75d697f_425_0.png)


    # # Renaming Tables


    Only tables can be renamed—databases cannot. Also, while RENAME TABLE is being
    executed, no other session can access any of the tables in the RENAME. Finally,
    temporary tables cannot be renamed with RENAME TABLE, but you can use ALTER TABLE
    RENAME (see "Altering Tables" earlier in this chapter). The general form of an
    ALTER DATABASE statement is:


    > RENAME TABLE table_name1 TO new_table_name1, ... table_namen TO new_table_name;


    # # Dropping Tables and Databases


    Dropping tables and databases removes or deletes them. This means that all data
    contained in the table or tables in the database are lost—they are permanently
    deleted.


    ```

    DROP TABLE table_name, ... table_name;

    DROP DATABASE database_name;

    ```


    The keyword (phrase) IF EXISTS can be used to make sure the table or database
    to be dropped exists. If it doesn''t, the statement stops execution and doesn''t
    produce an error message. Also, you can use the TEMPORARY keyword to drop a temporary
    table. These objects challenge the name "Beginner''s Guide," but I think it is
    important to know they exist.


    # # Create and Use Events, Views, and Triggers


    MySQL supports a number of other objects, including events, views, and triggers
    that as a'
  merge: -1
  pgno: 425
- img_proc: true
  md: 'group are called "stored programs." Stored programs are MySQL statements and
    additional keywords that are stored with a database and executed at a later time,
    based on a schedule or when they are otherwise called. Events, views, and triggers
    are examples of stored programs. These are relatively new in the MySQL syntax
    and are on the borderline of being a "Beginner’s Guide" subject, though they are
    important to know about. As a result, we''ll briefly look at them here.


    # Using Events


    Events are the scheduled execution of MySQL statements. Use the MySQL Event Scheduler,
    which by default is turned off. You can turn it on and prove to yourself that
    it is by executing these two command statements:


    ```

    SET GLOBAL event_scheduler = ON;

    SHOW PROCESSLIST;

    ```


    ![](img/b6e70110b29dfbddc8d9869df75d697f_426_0.png)


    When the Event Scheduler is turned off, it will not show up on the process list.
    Once turned off, you can turn it off with:


    ```

    SET GLOBAL event_scheduler = OFF;

    ```


    Events can be created, altered, and dropped.


    # Create Events


    The general form of a CREATE EVENT statement is


    ```

    CREATE EVENT event_name ON SCHEDULE schedule do mysql_statement;

    ```


    All parts of this CREATE EVENT statement are required. The schedule can be'
  merge: -1
  pgno: 426
- img_proc: true
  md: 'At a particular date and time timestamp

    AT CURRENT_TIMESTAMP + INTERVAL 30 MINUTE


    On a periodic interval

    EVERY 10 MINUTE


    On or within a start/or end date and time

    EVENT 10 MINUTES STARTS CURRENT_TIMESTAMP ENDS CURRENT_TIMESTAMP +

    INTERVAL 30 MINUTE


    # NOTE


    The time and date values can be in SECOND, MINUTE, HOUR, DAY, WEEK, MONTH,

    QUARTER, YEAR, and several combinations.


    For the mysql_statement, you can use the majority of MySQL statements, but some

    SELECT and all SHOW statements that simply display information from a table and
    don''t

    change it have no effect when used in an event, which doesn''t display or save
    information.


    Additional keywords that you can use with CREATE EVENT include


    +   IF NOT EXISTS prevents the execution of CREATE EVENT if an event of the same

    already exists.


    +   ON COMPLETION PRESERVE, in the ON SCHEDULE clause, preserves the CREATE EVENT

    statement after it expires; otherwise, it is automatically and immediately dropped.


    +   COMMENT allows you to add a comment within quotes in the ON SCHEDULE clause.


    An example of using an event:


    ```

    CREATE EVENT addtax ON SCHEDULE AT CURRENT_TIMESTAMP + INTERVAL 2 MINUTE

    DO UPDATE sales SET tax = ROUND(amount*.092, 2);

    ```


    This statement allows you to calculate the tax on a group of records on a time-delayed

    basis, as you can see in Figure 11-10.'
  merge: -1
