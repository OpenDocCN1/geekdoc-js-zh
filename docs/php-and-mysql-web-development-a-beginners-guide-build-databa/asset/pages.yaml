  md: '# Coding Conventions


    JavaScript is fairly easygoing as far as conventions are concerned, but there
    are some conventions you need to be aware of:


    +   - Some JavaScript elements are case sensitive—in particular, function and
    variable names. For example, if you define person as a variable name and later
    use the word Person, JavaScript will not recognize the second instance as the
    original. The best rule of thumb is to use all lowercase. When employing other
    JavaScript elements such as objects, properties, methods, and event handlers from
    other sources, use the case referenced in the source you are using to assist you.

