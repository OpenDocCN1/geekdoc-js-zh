    # # Consider Devices


    I touched on tablets, smart phones, and smaller laptops in the discussion of displays,
    but if those devices are part of your target audience, you also need to consider
    how your website operates. The majority of smaller devices do not use a mouse,
    and many use only touch. How do you handle that? It is a serious question that
    can affect whether your site is appreciated or not. Handling tablets and smartphones
