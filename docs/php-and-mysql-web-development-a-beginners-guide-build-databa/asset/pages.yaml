  md: '# TIP


    To delete, or unset, a cookie, set a new one with the same name, a value of "",
    and a date prior to the current date, such as time() -3600. If you set an array
    of cookies, you must delete them all. For the cookies in Listings 6-8a and b,
    Listing 6-8c shows what is needed to delete them:


    # Listing 6-8c Deleting a Cookie


    ```

    <?php

    //Delete cookies for name, date, and type of purchase

    $expire = time() - (60*60);

    setcookie("MatTech[name]", "", $expire, "//");

    setcookie("MatTech[date]", "", $expire, "//");

    setcookie("MatTech[type]", "", $expire, "//");

    ?>

    ```


    # Server Variables


    Server variables provide information about the server, the software that is running
    on, the current script that produced the request, and the client and its software.
    The server in communication with the client produces this information and stores
    it in the superglobal array $_SERVER. Each web server produces a slightly different
    set of elements in the array, which are defined by their associative keys. Listing
    6-9 is a short script for displaying the $_SERVER array elements on your server.
    Figure 6-3 shows the variables generated by the Apache server in Zend Server on
    my computer.


    # Listing 6-9 Server Variables Generator


    ```

    <html>

    <head>

    <title>Listing 6-9</title>

    </head>

    <body>

    <h1>Exploring Server Variables</h1>

    <?php

    foreach ($_SERVER as $key => $value) {

    echo "<b>" . $key . "&nbsp;:nbsp" . $value . "</b><br/>";

    }

    ?>

    </body>

    </html>

    ```'
