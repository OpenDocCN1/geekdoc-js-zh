    # Navigating in Arrays


    In addition to looping, PHP provides several functions to allow you to move one
    element at a time through any array. These make use of an internal pointer that
    is initially set at the start of the session and reset it to the first element
    in the array. You can move this pointer within the array and reset it to the first
    element with these functions:


    +   - current() returns the value currently at the pointer in an array and does
    not move the pointer.


    +   - key() returns the key currently at the pointer in an array and does not
    move the pointer.


    +   - next() moves the pointer one element forward in an array and returns the
    value.


    +   - prev() moves the pointer one element back in an array and returns the value.


    +   - end() moves the pointer to the last element in an array and returns the
    value.


    +   - reset() moves the pointer to the first element in an array and returns the
    value.


    Listing 7-8 demonstrates moving within an array with the results shown next.'
