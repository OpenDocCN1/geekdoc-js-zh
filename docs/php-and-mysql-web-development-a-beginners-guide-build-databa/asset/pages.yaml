  md: 'and can contain letters, numbers, underscores, and the characters in Western
    European alphabets. While you may find that some characters will be allowed, the
    best practice is to not use them. Blank spaces are not allowed.


    A good practice is to make variable and constant names more self-descriptive,
    and in the process, stay away from any possibility of conflict with a predefined
    name. For example, if you are collecting a buyer''s name and address, you might
    be tempted to use **name**, **street**, and **city**. While there is nothing wrong
    with those names, it is better to get in the habit of using compound names that
    are both more descriptive and to stay away from common names—for example, `buyer_name`,
    `buyer_street`, and `buyer_city`. You may take a couple of seconds to type these
    names, but they won''t be confused with other names. Also, most programmers get
    really good at cutting and pasting to reduce typing.


    It is a good practice to declare a variable such as the keyword. JavaScript may
    often declare this without var, but humans may not be so smart. Begin the statement
    with var and end it with a semicolon. You may declare variables with a single
    var by putting a comma between them. Once you declare a variable, you don''t have
    to repeat it. For example:


    ```

    var a = 7;

    var car = "Ford";

    var city = "Seattle", state = "WA";

    ```


    # TIP


    If you are having trouble finding a problem, or bug, in a program, look at the
    names you have assigned to variables and constants; try changing any that could
    possibly have a conflict with predefined or reserved names, such as changing name
    to buyer_name, or private to my_own.


    # Operators


    Having created a variable or a constant, you are going to want to give it a value
    through assignment, calculation, or comparison. JavaScript has defined a number
    of operators of various types, as shown in Table 4-3, to do this.'
