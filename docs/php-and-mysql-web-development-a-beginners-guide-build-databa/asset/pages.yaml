  md: 'When designing a form, ask yourself what type of information you want from
    the user, for example, contact information, account information, or ordering information.
    The answer to that question will dictate the questions you need to ask. For example,
    when soliciting contact information, ask for a name (and the format, as Full or
    Last, First), title, address, e-mail address, and phone numbers. Make sure your
    text labels clearly convey to what you want from the user, as shown in Figure
    4-3.


    Next, consider which form elements serve the type of information you are gathering.
    Each form element, described in Table 4-10, caters to a specific purpose, and
    with the exception of fieldset, also has associated JavaScript objects, which
    allow you to validate and set values from a script. Many of these JavaScript objects
    are demonstrated in this chapter.


    | Form Element | JavaScript Object Name | Usage |

    |---|---|---|

    | Button | button | Directs the user to another URL |

    | Check box | checkbox | Obtains a yes/no-type response; can be used in a mutually
    exclusive grouping |

    | Fieldset | NA | Allows you to group other form elements in a visible framed
    box, optionally with a legend (nonscripting element) |

    | Hidden field | hidden | Creates a field invisible to the user; commonly used
    to index submissions to the server |

    | Password field | password | Creates a text box that displays asterisks (*) to
    mask entered characters |

    | Radio button | radio | Obtains a yes/no-type response within a mutually exclusive
    grouping |

    | Reset button | reset | Returns a form to its default settings |

    | Select box | select | Creates the infrastructure for a drop-down list box |

    | Submit button | submit | Sends the data entered into a form to a destination
    such as a database or e-mail address |

    | Text area | textarea | Allows large amounts of text to be entered, typically
    constrained by the browser; useful for paragraphs, blogs, and essays |

    | Text box | text | Allows for shorter, one-line text entries; typically 20 characters
    by default |


    Table 4-10 Form Elements


