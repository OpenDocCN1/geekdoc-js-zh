  md: 'A form in HTML is defined by the input fields that it contains. Each input
    field is defined by its type, name, and potentially a default value. There are
    a number of field types which you can wrap text and formatting to get virtually
    any form you want to define. One example is shown in Listing 2-6 and displayed
    in Figure 2-9. Table 2-8 describes the tags and attributes related to forms.


    # Listing 2-6 Form Example


