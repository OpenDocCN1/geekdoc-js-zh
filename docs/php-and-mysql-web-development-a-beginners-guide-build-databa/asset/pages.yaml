  md: 'If you do not already have Aptana Studio, WAMP, Internet Explorer, Chrome,
    and Firefox, return to Chapter 1, and follow the instructions to download and
    install them. They are recommended for the discussion in the remaining chapters
    of this book.


    # JavaScript Introduction


    The elements of any language only work together in an understandable form if they
    all operate in concert, according to a set of rules and a given format. This section
    describes the basic techniques and conventions used in JavaScript to get you started,
    and offers you shortcuts and suggestions to make working with scripts easier and
    more efficient.


    # Using JavaScript with HTML Pages


    You can use JavaScript code on HTML pages in one of two ways: directly on the
    HTML page where it’s used, or in a separate file. Scripts for singular uses are
    most easily written directly on the affected page. As you become better acquainted
    with JavaScript and develop more advanced uses, you will find saving your scripts
    to separate .js files provides for cleaner web pages and the ability to use the
    same code on several pages within your website.


    # NOTE


    The terms “code” and “script” are used interchangeably for describing the various
    elements of the JavaScript language placed within the `<script>` tag found on
    HTML pages and in separate .js files.


    # Entering JavaScript Directly on an HTML Page


    An easy way to start coding JavaScript is to enter the script directly on an HTML
    page within the tag `<script></script>`. The `<script>` tag can be placed either
    in the `<head>` or `<body>` section of the page. Typically, code that writes output
    directly to the page is placed within the HTML in the `<body>` section. Scripts
    placed in the `<head>` section are generally used for linking to external JavaScript
    pages, with functions called by code in the `<body>` section. Firefox and Chrome,
    for the most part, active JavaScript that tries to change elements on the page
    in the `<head>` section, works well with Internet Explorer. Listing 4-1 shows
    how the `<script>` tag can be inserted in both the `<head>` and `<body>` sections.
    Listing 4-4 later in this chapter shows how both of these are used.


    +   Listing 4-1 Example Script Placement'
