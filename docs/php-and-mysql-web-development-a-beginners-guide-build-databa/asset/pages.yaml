    # # Comparing Arrays


    You can compare arrays in PHP with both array operators and functions. If you
    have two arrays, $scars1 and $scars2, you can compare them with these operators:


    +   * **Equality, $scars1 == $scars2**, is TRUE if $scars1 and $scars2 have the
    same key => value pairs.


    +   * **Identity, $scars1 === $scars2**, is TRUE if $scars1 and $scars2 have the
    same key => value pairs, in the same order, and of the same type.


    +   * **Inequality, $scars1 != $scars2 <> $scars2**, is TRUE if $scars1 and $scars2
    are not equal.


    +   * **Non-identity, $scars1 !== $scars2**, is TRUE if $scars1 and $scars2 are
    not identical.

    You can also compare arrays with these functions:


    +   * **array_diff()** compares two arrays and creates a new array with the values
    in the first array that are not in the second.


    +   * **array_diff_assoc()** compares two arrays and creates a new array with
    the key => value pairs in the first array that are not in the second.


    +   * **array_intersect()** compares two arrays and creates a new array with the
    values in'
