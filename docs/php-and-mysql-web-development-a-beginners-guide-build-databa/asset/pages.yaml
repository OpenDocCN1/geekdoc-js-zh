  md: '# NOTE


    This chapter will not provide exhaustive coverage of HTML, nor will it cover every
    nuance of every HTML or attribute. Both areas are fully covered by sites on the
    Web, in particular, w3c.org and w3school.com, and in the excellent book HTML:
    A Beginner’s Guide, Fifth Edition by Wendy Willard, published by McGraw-Hill Education.


    In addition to a tag, a tag may contain one or more attributes that modify what
    the tags do. For example, if you want to display an image on your web page, you
    could use this tag:


    ```

    <img src="rodie.jpg" />

    ```


    An attribute of the img /> tag is src, and the value of the src attribute is rodie.jpg.
    Attributes are related to their value with an equal sign, and the value is placed
    in full (double) quotation marks (single quotation marks are referred to as “apostrophes”
    and continuation lines are indented from their HTML for readability. Dark red
    is used for tags, bright red is used for attribute names, blue is used for attribute
    values, black is used for plain text, and green is used for comments.


    # NOTE


    In the listings and HTML examples in this chapter, tags are shown in bold, whereas
    attributes and their values are not. Also, continuation lines are indented from
    their parents. These conventions are used solely for readability. Aptana, by default,
    color-codes and indents HTML for readability. Dark red is used for tags, bright
    red is used for attribute names, blue is used for attribute values, black is used
    for plain text, and green is used for comments.


