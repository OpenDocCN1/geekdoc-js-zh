    # Keywords Used with Column Characteristics


    As you see in the example table discussed here, column characteristics have their
    own set of keywords. Among the most common are (many keywords can only be used
    with specific data types):


    +   - AUTO_INCREMENT automatically increments an integer or floating point data
    type by 1. There can be only one AUTO_INCREMENT column in a table and it cannot
    have a DEFAULT value.


    +   - CURRENT TIMESTAMP adds the time and date to a TIMESTAMP column.


    +   - DEFAULT provides a value that immediately follows the keyword. It must be
    a constant (not an expression or a variable, so you cannot use NOW() or CURRENT_DATE()
    as a default for a date column, although you can use DEFAULT_TIMESTAMP to a TIMESTAMP
    column) and cannot be used with BLOB and TEXT data types.


    +   - FOREIGN KEY specifies the column contains a link to another table''s PRIMARY
    KEY.


    +   - NULL_NULL specifies that the column does not need to have a value. If a
    column does not NOT_NULL, MySQL assumes it is NULL and does not need to have a
    value.


    +   - ON_UPDATE takes some action, as inserting the CURRENT_TIMESTAMP, when the
    record is updated.


    +   - PRIMARY KEY specifies the column is the index for the table and each value
    is, definition, both UNIQUE and NOT NULL.


    +   - UNIQUE cannot duplicate any other entry in the column.


    # NOTE


    The TIMESTAMP data type by itself automatically inserts the current date and time
    when a new record is created and it automatically updates the field when the record
    is updated. This is the same as having both DEFAULT CURRENT_TIMESTAMP and ON_UPDATE
    CURRENT_TIMESTAMP. If you only have DEFAULT CURRENT_TIMESTAMP the current date
    and time is added when the record is created but not updated. If you have only
    ON_UPDATE CURRENT_TIMESTAMP the current date and time is added when the record
    is updated but not when it is created.


