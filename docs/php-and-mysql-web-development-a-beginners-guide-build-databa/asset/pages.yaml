    # While and Do-While Statements\n\nThe while and do-while statements are looping\
    \ constructs that allow you to repeatedly execute a piece of code until a conditional\
    \ expression is no longer true. The while statement is the foundation of this\
    \ set of statements and takes the following form:\n\n```\nwhile (conditional expression)\
    \ {\n  statements executed while true;\n}\n```\n\nThe do-while statement is similar\
    \ to the while statement, except that the conditional expression is at the end\
    \ of the statement instead of at the beginning, allowing the do portion to execute\
    \ even if the while statement is false. The do-while statement takes this form:\n\
    \n```\ndo {\n  statements executed while true;\n} while (conditional expression);\n\
    ```\n\nThe most common conditional expression is to compare a counter with some\
    \ end value—in other words, to initialize a counter and then loop though some\
    \ statements, incrementing the counter with each loop, until the counter exceeds\
    \ the end value. Listing 4-6 shows examples of this for both while and do-while,\
    \ with the results shown next. You can see that the while statement runs until\
    \ the counter ends. In the case of the do-while statements, the do statement is\
    \ true and executes once, but the while statement is false, doesn't loop, and\
    \ doesn't execute the write statement."
