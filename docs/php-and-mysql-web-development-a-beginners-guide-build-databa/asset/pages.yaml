  md: '# Displaying Special Characters


    HTML defines the less-than, greater-than, and ampersand characters as having special
    meanings, and therefore they cannot be used as normal text. Also, the quote mark
    and apostrophe can be problematic. To use these characters normally, replace them
    as follows:


    | To Display | Type |

    | --- | --- |

    | Quote mark (") | &quot; or &#34; |

    | Ampersand (&) | &amp; or &#38; |

    | Apostrophe ('''') | &apos; or &#39; |

    | Less than (<) | &lt; or &#60; |

    | Greater than (>) | &gt; or &#62; |


    # NOTE


    Unlike the rest of HTML, escape sequences are case-sensitive—for example, you
    cannot use &LT; for the less-than symbol.


    All other characters that you type on your keyboard will be displayed as they
    are typed. In addition, HTML has defined a number of other characters that can
    be displayed based on entering an escape sequence where you want the character
    displayed. The escape sequence can take either a numeric or a textual format,
    as was shown just mentioned. In either case, the escape sequence begins with an
    ampersand (&) and ends with a semicolon (;). In the numeric format, the ampersand
    is followed by a number symbol (#) and a number that represents the character.
    All characters, whether they are on the keyboard or not, can be represented with
    a numeric escape sequence. The textual format has been defined only for some characters
    and excludes most characters on the keyboard. Additional examples of the two formats
    are shown in Table 2-5.'
  merge: -1
