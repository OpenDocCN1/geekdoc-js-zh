    <form action="saverults" method="post">

    Name: &nbsp; &nbsp; <input type="text" size="50" maxlength="256"

    name="name"/<br />

    Address: <input type="text" size="50" maxlength="256"

    name="address"/<br /> /<br />

    Send Data? Yes <input type="radio" name="Send" value="Yes" />

    No <input type="radio" name="Send" value="No"&nbsp; &nbsp;

