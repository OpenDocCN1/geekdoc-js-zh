    # HTML <input type="submit">


    HTML <input type="submit"> creates a button on the form that the user can click
    to indicate they have completed entry. The name and value of the button do not
    have to be "submit" and can be anything the web page creator wants. The type,
    of course, must be "submit". The name is what is used in the superglobal array,
    and the value is what is actually displayed on the button. When it is selected
    on the form, the <form action takes over and PHP can learn of this the $_POST[''submit'']
    superglobal element.


    # HTML <form action


    The HTML <form tag also uses the action attribute or its absence to determine
    where the focus—in this instance, PHP—should go to processing the form that has
    been submitted by you. If there is no action attribute, the focus is transferred
    to the first PHP code at the beginning of the script. This can be before or after
    the start of the HTML. The action attribute can also use the URL (web address)
    of a script to which the focus is transferred. Finally, as is in Listing 12-3,
    the action attribute can have a snippet of PHP code to transfer the focus to PHP
    in the current script. This is exactly the same as not having an action attribute.
    The only reason for action="<?\$_SERVER[''PHP_SELF'']?> is that it is more obvious
    to the human reader what is happening.


    # PHP $_POST[''submit'']


    PHP, for its part, watches the global array $_POST[''submit''] in Listing 12-3),
    which is initially NULL or FALSE, and goes to work when it sees the submit entry
    has something in it. PHP does this by asking $_POST[''submit''] is FALSE. In other
    words, the form has not been submitted. If correct, HTML displays the form, and
    PHP waits until the form is submitted. When it it can go on and interact with
    MySQL and the database.


    # Interacting with a Database


    When PHP sees that the form has been submitted, it connects with the database,
    removes any white space in the entry, and determines if the entry is blank. If
    so, it asks for a title to be entered, the superglobal array $_POST[''submit'']
    to NULL and goes back to watching for the form to be submitted. When happens,
    and the title is found to be blank, PHP looks for escapes (places backslashes
    in front of) any special characters. (This may seem like it''s not an important
    step, but just adding this line of code greatly increases the security of your
    program.) Finally, the Books table is queried for the title and, if it is found,
    or record in the table with that title is fetched and displayed.


