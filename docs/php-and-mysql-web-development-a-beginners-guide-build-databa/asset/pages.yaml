    # TIP


    Specifying the height and the width speeds up loading because a quick placeholder
    will be drawn for the image, allowing the text to continue to be loaded while
    the image is drawn. Without these dimensions, the loading of the text must wait
    for the image to be drawn and thereby determine where the remaining text will
    go. Current browsers will automatically scale the other dimension based on the
    current aspect ratio of the image if just one of the dimensions (height or width)
    is given.


    # Adding Hyperlinks and Bookmarks


    Hyperlinks provide the ability to click an object and transfer what is displayed
    by the browser (the focus) to an address associated with the object. HTML implements
    hyperlinks with the Anchor tag `<a></a>`, which specifies that the text or graphic
    that it contains a hyperlink or a bookmark or not. If the tag is a hyperlink and
    the contents are selected, then the focus is moved either to another location
    in the current page or website, or to another website. If the tag is a bookmark,
    then another Anchor tag may reference it and potentially transfer the focus to
    it.


    An image used as just described assumes that the entire image is the hyperlink.
