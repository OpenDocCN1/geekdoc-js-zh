  md: '# Introduction


    If you have done some website building with HTML, CSS, and possibly JavaScript
    and want to add more user interaction with better handling, greater ease of moving
    information among pages, and a fully relational database to your sites with PHP
    and MySQL, then this is the book to help you do that.


    PHP and MySQL Web Development: A Beginner''s Guide takes the reader with hands-on
    approach from building static web pages to creating comprehensive database-driven
    web applications. To do this, the most commonly used web programming languages
    (HTML, CSS, JavaScript, PHP, and MySQL) are introduced, and demonstrated through
    the common dynamic web elements.


    The reader is assumed to have some experience with the creation of static web
    pages and wants to add database elements to their pages. To create a common foundation
    for all readers, the book starts with a review of creating static web pages using
    HTML5 (Hypertext Markup Language) and CSS (Cascading Style Sheets) templates to
    apply common functions and formatting across a series of web pages. Next, the
    book provides an overview of JavaScript and how it is used to implement such client-side
    effects as changing an image when the mouse rolls over it, implementing a pop-up
    window, positioning the cursor in a form, and validating form entries.


    PHP and MySQL Web Development: A Beginner''s Guide provides an in-depth discussion
    of PHP, including the parts of PHP, how it is used with HTML; its structure, control
    statements, arrays, and functions; and its use with forms. The discussion ends
    with a detailed demonstration of PHP''s form and file handling capabilities to
    provide a secure login and validation, along with controls to limit access to
    web pages and pass information among web pages.


    Next, the book looks in detail at MySQL and the SQL language to discuss how it
    is used to store, select, and update information on a web page. The basic characteristics
    of the language, its command set, key words, operators, and functions, are all
    described and demonstrated to let the reader explore the full power of MySQL.


    Finally, the book discusses how PHP and MySQL are combined with HTML, CSS, and
    JavaScript to exercise the full power of a relational database system. In particular,
    the PHP MySQL functions are reviewed to show how information is entered into website
    forms and is used to create new records in database tables, and then how information
    in a database is read, formatted, and displayed on a web page. Finally, the book
    looks at how to detect and handle errors and security issues.


    PHP and MySQL Web Development: A Beginner''s Guide is a solution-oriented guide
    that concludes with the building of two detailed websites that demonstrate the
    full capability of PHP and MySQL. These are meant to be directly usable by the
    reader as templates with all the necessary code for building their own web pages
    with dynamic


    ![](img/b6e70110b29dfbddc8d9869df75d697f_15_0.png)'
