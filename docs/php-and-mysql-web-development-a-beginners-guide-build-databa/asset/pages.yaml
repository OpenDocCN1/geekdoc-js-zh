  md: 'If you want a single image centered horizontally and vertically on a page,
    you need to use the no-repeat value, but one center value.


    With border-style and border-width properties, if there is one value, it applies
    to all sides; if two values, the first refers to the top and bottom, and the second
    refers to the left and right; if three values, the first is the top, the second
    is the left and right sides, and the third is the bottom; if four values, the
    order is top, right, bottom, and left.


    Borders produced with the border property are placed outside of the element’s
    content plus any padding that has been added, but on the inside of the margin.
    See “The Box and Visual Models of Page Layout” in the “Laying Out with CSS” section
    in this chapter.


    Similar to the background property, if you add a border, you will want to add
    some padding around the <p> and other content areas to place the border slightly
    outside the text.


    The outline property draws lines on top of, outside, like borders, and therefore
    the lines do not take space. They take the shape of the object, which may be nonrectangular,
    such as a button. The outline is the same on all sides.


    The orphan and widow properties are only considered if there is not enough room
    on the first page for a block of text. Also, if there is not text to satisfy both
    an orphan and widow properties, and there is not enough room on the first page
    for the full block of text, then the full block of text is moved to the second
    page.


    The three page-break properties control whether page breaks can occur before,
    after, or within an element block, such as a paragraph, an image, or a table.
    The default is that all three are allowed but not forced. If page breaks are allowed,
    then the widow and orphan properties control how that is done.


    # Laying Out with CSS


    While CSS is often thought of for formatting and styling a web page, it is at
    least equally useful for laying out a web page. With CSS’ layout properties, shown
    in Table 3–4, you can position an element on a page of number different ways:
    you can determine how elements interact with each other and the amount of separation
    between them, how lists and tables are formed, and the characteristics and behavior
    of a page. As mentioned earlier in this chapter, several basic concepts are important
    to the layout properties, including the box and visual models, positioning, and
    tables and lists.'
