  md: '# Chapter 1


    # Setting Up Your Workstation


    # Key Skills & Concepts


    +   - Picking a Development Tool

    - Choosing a Testing Server

    - Using Testing Browsers

    - Considering Other Factors


    As you get into dynamic web programming, you will be doing extensive coding and
    wanting all the support you can get to produce clean, error-free code. You will
    need to test not only how your code is structured, as you would with static web
    pages, but also how it runs, and not just on one browser, but on several. Therefore,
    you will need a text editor, or its more advanced form—an integrated development
    environment (IDE)—with which to write the code that will support for not only
    HTML, but also JavaScript and PHP. You also want a test server environment running
    on your computer that supports all the languages, especially PHP and MySQL. Finally,
    you will need access to several popular browsers for testing HTML, CSS, and JavaScript
    (PHP runs in a server and so is neutral).


    # NOTE


    This book is written for users of Microsoft Windows, from Windows XP to Windows
    8.1. Although most of the discussion in the book is also applicable for Mac and
    Linux users, this particular section is dedicated to Windows. Mac and Linux have
    their own sets of editors, servers, and browsers, many of which are Mac versions
    of Windows apps.


    # Picking a Development Tool


    The most important item that you need for dynamic web programming is a highly
    capable text editor or IDE that supports you in writing code without trying to
    do it for you. A number of tools are available, ranging from Notepad (see Figure
    1-1), which comes free with Windows and allows you to type in and save code to
    a file, to Adobe Dreamweaver, which creates dynamic web code for you in a quasi-WYSIWYG
    (what you see is what you get) environment. Windows Notepad might do enter a little'
