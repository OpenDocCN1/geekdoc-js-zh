    # Reviewing MySQL Data Types


    Chapter 9 provides a detailed list of common column data types. Here, let''s review
    the most frequently used types for you to keep in mind:


    +   - INT(n), integer number of up to n total digits.

    - DECIMAL(n, d), double-point number of up to n total digits, of which d are decimal
    digits.

    - DOUBLE(n, d), double-precision floating point number of n total digits, of which
    d are decimal digits.

    - CHAR(n), string value of a fixed maximum of n characters padded with blanks
    on the right, but removed when retrieved.

    - VARCHAR(n), string value of a variable number of characters up to a maximum
    of n, not padded.'
