  md: '# Chapter 3


    # Styling with CSS


    # Key Skills & Concepts


    +   - Attaching CSS

    - Understanding CSS Rules

    - Selecting What to Format

    - Applying CSS Concepts

    - Using Text Properties

    - Implementing Page Properties

    - Laying Out with CSS


    With HTML5, you can build the structure of a web page, but if you follow the strict
    definition of HTML5 and don''t use any of the deprecated HTML tags, you can''t
    make the page look very good, and it may look different in different browsers.
    Making a page consistently look good in many browsers is the job of CSS (Cascading
    Style Sheets). CSS is a collection of rules for specifying the colors, fonts,
    and layout of a web page. Today, it is not only the primary way of formatting
    a web page, but it is also the most efficient. It allows you to separate the formatting
    of a web page from the content of a web page and able to reuse the formatting
    on other pages.


    In this chapter, we will look at the structure of CSS rules, how style sheets
    are added to a web page, what the more common rules are, and examples of their
    use. We will be talking about CSS 2.1, which became a formal World Wide Web Consortium
    (W3C) recommendation in June 2011. While CSS 2.1 was working its way to a formal
    recommendation (it was first proposed in February 2004), proposals for both CSS
    3 and CSS 4 have been put forth with many additions to CSS. For the most part,
    I have ignored the CSS 3 and 4 additions for two reasons: they are still fluid,
    and many of them are not implemented in the latest browsers. Also, as I mentioned
    in Chapter 2, you should not consider this chapter an exhaustive review of CSS
    2.1; rather have tried to briefly cover the most important aspects of CSS that
    are in common usage.


    # NOTE'
