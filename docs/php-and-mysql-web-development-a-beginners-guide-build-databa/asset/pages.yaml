    # Date and Time Constants


    ```

    Atom: 2014-02-16T18:35:23+00:00

    RFC822: Sun, 16 Feb 14 18:35:23 +0000

    RFC850: Sunday, 16-Feb-14 18:35:23 UTC

    RSS: Sun, 16 Feb 2014 18:35:23 +0000

    ```


    Thirty-five formatting codes can be used to format a date and time in PHP. The
    codes are case-sensitive—“d” and a “D” mean different formats. Here are four commonly
    used sets of formatting codes, which are explained in Table 5-6. You can see all
    of the PHP formatting codes at php.net/manual/en/function.date.php.


    # Date Time Formatting Codes


    ```

    I, F JS, Y : Sunday, February 16th, 2014

    D, M d, y : Sun, Feb 16, 14

    n/y gy:is a : 2/16/14 6:35:23 pm

    Y-m-d G:is : 2014-02-16 18:35:23

    ```'
