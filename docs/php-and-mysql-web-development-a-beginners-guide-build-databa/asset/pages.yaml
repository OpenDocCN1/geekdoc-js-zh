  md: '# NOTE


    Session variables have a limited life, which is set by the session.cache_expire
    value in the pnp.ini file on the server. Depending on the use, this can be set
    from a few minutes to a number of hours in increments of a minute. The default
    is 180 minutes, or three hours.


    # Cookies


    Cookies store information on client computers. Once a cookie has been stored,
    or set, the same site (really domain) that created it will automatically receive
    that information the next time it is connected to the client. This allows the
    site to recognize a returning client. Cookies are created with the setcookie()
    function and accessed with the $_COOKIE global array.


    # NOTE


    Some people do not allow cookies to be stored on their computer due to security
    concerns.


    # Using setcookie()


    You create and store a cookie using the setcookie() function, which must be placed
    before any other output in your script, including the <html> and <head> tags.
    The default is following:


    ```

    setcookie(name [,value [,expire, [,path, [,domain [,secure

    [,httponly]]]]]])

    ```


    The argument is the only one required. The rest are optional and may be left blank
    if none of the right are present. If you wish to skip an argument and enter one
    to the right, fill in with the empty string (""), except for $expire, which requires
    (0). The meaning of the arguments is as follows:


    +   name is the name of the cookie and can be any label using upper- and lowercase
    letters, numbers, and the underscore.


    +   value is the information you wanted store with the cookie, as a string.


    +   expire is the time in seconds since 1/1/1970 that you want the cookie to expire.
    You can create this with the time() function, which will give you the number of
    seconds since 1/1/1970 to the current moment, and then add the number of seconds
    you want the cookie active. For example, time()+(60*60*24*10) would let the cookie
    be active for ten days from the current time. The default is 0, which means the
    cookie will expire at the end of the session.


    +   path is the path on the server where the cookie will be available. If the
    path is set to "/", the entire domain will have access to the cookie.


    +   domain is the domain where the cookie will be available. If you want the cookie
    available to all subdomains, precede the domain with a period. For example, somedomain.com.'
  merge: -1
