  md: "There is an even bigger reason for using functions. Up to now, all the PHP\
    \ code in this chapter is meant to run, or execute, as the page is loaded, but\
    \ after the page is displayed, in contrast to JavaScript that executes before\
    \ the page is displayed. If you don't want the PHP script executed as the page\
    \ is loaded, you can create a function, place it above the <!DOCTYPE html> start\
    \ of the HTML, and it won't be run until it is called.\n\nLike predefined or internal\
    \ functions, user-defined (just “user”) from functions may optionally have arguments\
    \ that are passed to them, and return a value after they are executed. Once a\
    \ user function is defined, it is called, or used, just like an internal function.\
    \ The function itself can do anything you can do with PHP, using all of the features\
    \ of PHP, including other functions, or even calling itself to create a recursive\
    \ function. (You need to limit recursive functions to make sure they can't endlessly\
    \ act recursively, or an error will result. A good rule of thumb is to limit recursion\
    \ to no more 100 times.)\n\nUser functions are defined with the function and return\
    \ keywords by using this form:\n\n```\nfunction name($argument1, $argument2,...)\n\
    {\n    [any PHP statements];\n    return $returnValue;\n}\n```\n\nThe name that\
    \ you give to a function uses same naming rules as variables, constants, and other\
    \ labels. It is case sensitive; can begin with either the letters a–z or A–Z,\
    \ or an underscore (_); can be of any length; and can contain letters, numbers,\
    \ underscores, and the characters in Western alphabets.\n\nListing 5-9 shows an\
    \ example of a user function with the result shown next. Many other examples are\
    \ shown in the following chapters.\n\n![](img/b6e70110b29dfbddc8d9869df75d697f_249_0.png)\n\
    \nListing 5-9 User-Defined Function"
