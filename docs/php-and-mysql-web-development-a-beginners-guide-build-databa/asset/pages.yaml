    # Table 3-1 Style and Link Tags


    # NOTE


    CSS style elements can also be applied directly to HTML tags using the style attribute,
    but that negates the benefit of CSS being able to apply consistent styles to multiple
    tags. The style attribute is and should be frequently used.


    # Understanding CSS Rules


    A CSS rule in its simplest form is a line of text with three components: a selector,
    a property, and a value. For example:


    ![](img/b6e70110b29dfbddc8d9869df75d697f_101_0.png)


    where the selector is generally a tag, such as <body>; the property is a feature
    of the tag, such as background; and the value is an aspect of the feature, such
    as yellow. The property and value are separated by a colon, and they form the
    declaration, which is enclosed in curly braces {}. A single selector can have
    multiple property/value pairs, as shown in Listing 3-1, which are separated by
    a semicolon. With only a single property/value pair, or for the last property/value
    pair, a semicolon is not necessary, but it is suggested simply for consistency
    and to good habits.


    Within CSS rules, you can add as many spaces, tabs, and newlines as you want to'
  merge: -1
  pgno: 101
- img_proc: true
  md: "make CSS easy to read. It is recommended that you spread out the rules so that\
    \ you can easily see what is affecting the various parts of your web pages.\n\n\
    You can both help your own memory of what you did in a style sheet and tell others\
    \ about it by adding comments, either after completing a rule on the same line,\
    \ or on a separate line. To do this, enclose the text comment within a /* */ pair,\
    \ as shown here:\n\n```\nbody { background : yellow; } /* Makes the background\
    \ yellow */\n```\n\n# Selecting What to Format\n\nThe selector part of a CSS rule\
    \ identifies the element of a web page that will be affected by the rule. You\
    \ can have selectors that cover the entire page, such as body, or a single type\
    \ of tag, such as h1, as you have seen in Listings 3-1 and 3-2. You can also have\
    \ selectors that identify parts of a page, or just some of a particular tag, some\
    \ h1s, for example. So a selector can be a tag name; a tag name modified by a\
    \ class, an ID, an attribute, or its context; parts of an element identified by\
    \ a tag.\n\n# Class and ID Selectors\n\nYou can add class names and/or IDs to\
    \ most tags to identify the ones that you want affected by a style by adding the\
    \ class or ID to the selector. A class is added to a selector by following the\
    \ tag name with a period (.) and the class name. An ID is added to a selector\
    \ by following the tag name with a pound sign (#) and the ID. For, Listing 3-4\
