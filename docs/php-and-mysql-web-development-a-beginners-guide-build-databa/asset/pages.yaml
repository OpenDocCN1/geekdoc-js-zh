- img_proc: true
  md: 'secure, if set to TRUE, says that the cookie should be sent only over a secure
    connection over HTTPS. The default is FALSE.


    httpOnly, if set to TRUE, says the cookie should only be accessible with the HTTP
    protocol and not on the client via JavaScript. The default is FALSE.


    The value argument can be anything that you can put in a string, such as a name
    or an amount. If you need to store several pieces of information in a cookie,
    you need to use several cookies to do that. From the standpoint of PHP and the
    server, you, think of any of cookies from one site to one client as an array.
    On the client, they are stored as separate pieces of information, but in PHP,
    you can address them as elements of a single array. Listing 6-8, later in this
    chapter, will provide an example of this.


    # CAUTION


    Cookies are view by spyware applications, so do not use cookies to store sensitive
    information like usernames, passwords, and account numbers.


    # Using $_COOKIE


    After a cookie has been set, the next time the domain set it reconnects with the
    client, the client will automatically return the cookie information to the server,
    and it will be stored in $_COOKIE superglobal array. You must close the connection
    with the client in which you set the cookie and reopen the connection before $_COOKIE
    will contain the information.


    Listing 6-Ba demonstrates a website named “MatTech” storing a customer’s first
    name, the date of or her last order, and the type of purchased using cookies that
    don’t expire for 90 days and that are available throughout the domain that the
    cookies. Listing 6-8b demonstrates retrieving and displaying the information,
    like this:


    ![](img/b6e70110b29dfbddc8d9869df75d697f_276_0.png)'
