  md: 'Earlier in the chapter, Table 4-10 listed the form elements that a form comprises.
    Here, Table 4-12 lists several properties and methods that are applicable to each.
    As you can see, many of these properties/methods are shared by several elements.


    | Property/Method | Used by These Elements | Description |

    |---|---|---|\| checked | Check box, radio button | Indicates if a check box is
    checked (true) or not (false) |

    | defaultChecked | Check box, radio button | Indicates whether a check box is
    checked by default (true) |

    | defaultValue | Text area, text box | Indicates the default value in a text area
    or text box |

    | form | All | Returns the name of the parent form |

    | name | All | Sets or returns the name of the element |

    | options[] | Select box | Provides an array for options within an option list
    |

    | selectedIndex | Select box | Indicates the index value of the selected option
    within the option list |

    | type | All | Returns the type value of the element; for the type value for a
    check box is checkbox |

    | value | All except select box | Sets the value of a specified element |

    | blur() | All except hidden field | Removes the focus from an element |

    | click() | All except hidden field, select box, text area, and text box | Acts
    as a click event on an element |

    | focus() | All except hidden field | Places focus on an element |

    | select() | Text area, text box | Selects the text area or text box |


    # Table 4-12 Form Element Properties and Methods


    This section provides an example of how these properties and methods are used
    with form elements to achieve certain results. Many of the properties/methods
    that are not shown behave in a very similar manner to the one being demonstrated.


    # defaultValue Property


    In boxes and text areas, you can display a default value for your users. If they
    change that value and decide to return to the default value, they might be tempted
    to reset the entire form, which works obliterates any other entries they may have
    made. A slicker way to handle this is to create a way that simply returns an element
    to its default value.

    Listing 4-19 shows the code for creating a function that returns the value of
    a text box to its default value when called by clicking the Return to Default
    Citizenship button. An onclick event handler handles the calling in the <body>
    section. Try it for yourself, as shown in Figure 4-5.'
