  md: "# # PHP Basics\n\nPHP has several basic facilities that both give it power\
    \ and make it easier to use. These include the ability to display information\
    \ at any point in your script, adding comments in several ways, and a set of useful\
    \ coding conventions.\n\n# # Display Information\n\nIn debugging script, it is\
    \ often helpful to display a comment or a variable while the script is running.\
    \ PHP gives you two ways to do this with the echo() and print() functions, which\
    \ are very similar, and for many purposes, they are the same. Listing 5-2 shows\
    \ both functions, which produce this with the Run command in Zend Studio:\n\n\
    ![](img/b6e70110b29dfbddc8d9869df75d697f_227_0.png)\n\nListing 5-2 print/echo\
    \ Example\n\n```\n<html>\n<head>\n  <title>Listing 5-2</title>\n</head>\n<body>\n\
    \  <h1>This Shows the Print and Echo Functions</h1>\n  <?php\n    print \"This\
    \ was produced by Print <br />\";\n    echo \"This was produced by Echo\";\n \
    \ ?>\n</body>\n</html>\n```\n\nBoth print and echo, while called \"functions\"\
    \ and included in function lists, are unlike functions in their arguments are\
    \ not required to be in parentheses, although you can use parentheses if you want.\
    \ The quote marks are required unless the argument is a number, although you can\
    \ use either single or double quote marks."
