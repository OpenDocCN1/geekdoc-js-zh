  md: "# User-Defined Functions\n\nAs you write JavaScript, you'll find that you want\
    \ to repeatedly use the same code. You could simply copy the code to all the places\
    \ you want to use it, but if you want to change code, you would have to change\
    \ it everywhere it was copied. The solution for this is to create a function containing\
    \ the code you want to repeat and simply call that function everywhere you want\
    \ to use it. Functions also let you segment or compartmentalize your code, which\
    \ makes it easier to debug and maintain.\n\nThere is even a bigger reason for\
    \ using functions. Up to now, when the page is loaded. But if you don't want that,\
    \ you can create a function, place it in the HTML <head> section, and it won't\
    \ be run until it is called.\n\nLike predefined or global functions, user-defined\
    \ (just \"user\" from here on) functions may have arguments that are passed to\
    \ them and return a value after they are executed. Once a function has been defined,\
    \ it is called, that is, a statement in the script requests the function to perform\
    \ the action it is designed to do. The function itself can do anything you can\
    \ do with JavaScript using all of the features of JavaScript, including calling\
    \ other functions, or even calling itself to create a recursive function (this\
    \ should not be done over 100 times, or errors may occur).\n\nUser functions are\
    \ defined with the function keyword using this form:\n\n```\nfunction name(argument1,\
    \ argument2,...)\n{\n  [any JavaScript statements];\n  return returnValue;\n}\n\
    ```\n\nFunctions are called to perform their actions in a script in this form:\n\
    \n```\nname(argument1, argument2,...)\n```\n\n# NOTE\n\nFunctions without arguments\
    \ are defined by providing a name and an empty set of parentheses, for example:\
    \ function calrate().\n\nThe name that you give to a function uses the same naming\
    \ rules as variables, constants, and other labels. It is case sensitive; can begin\
    \ with the letters a–z or A–Z or an underscore (_); can be of any length; and\
    \ can contain numbers, underscores, and the characters in Western European alphabets.\n\
