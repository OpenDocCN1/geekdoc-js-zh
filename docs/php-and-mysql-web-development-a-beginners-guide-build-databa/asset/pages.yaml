    # NOTE


    In the tables of tags and attributes in this chapter, tags are shown with angle
    brackets, and attributes are indented from the left.


    # Using Global Attributes


    Global attributes are attributes that can be used with virtually any HTML tag.
    Assume that these attributes, shown in Table 2-2, are added to the following lists
    of tag attributes in this chapter.


    | Tag or Attribute | Description |

    | --- | --- |

    | accesskey | Specifies a set of keystrokes (shortcut key) to go to (place the
    focus) a particular element on a page |

    | class | Identifies the class of an element for applying styles |

    | dir | Sets the direction of text in an element |

    | draggable | Specifies whether an element can be dragged |

