- img_proc: true
  md: '# Creating Arrays


    Arrays can be created either through assignment, as you do a variable, or through
    the array() function, as you do in Chapter 5. For example, here are four methods
    of creating a four-element array of cars:


    +   - Method 1: individual integer assignment


    $cars[0] = "Ford"

    $cars[1] = "Chevy"

    $cars[2] = "Honda"

    $cars[3] = "BMW"

    - Method 2: array() function integer assignment


    $cars = array(0 => "Ford", 1 => "Chevy", 2 => "Honda", 3 => "BMW"

    - Method 3: array() function implied assignment


    $cars = array("Ford", "Chevy", "Honda", "BMW")

    - Method 4: array() function-associative assignment


    $cars = array("Ed" => "Ford", "Sue" => "Chevy", "Kate" => "Honda", "Bob" => "BMW")


    The first three methods produce the exact same arrays. In the third method, the
    numeric key is implied with the default start at 0. You can start at 1 or any
    other number using the array operator ->. For example, Listing 7-1 produces the
    array shown next. The fourth method associates a string key with a value, which
    works as well as an integer, and can be more meaningful.


    ![](img/b6e70110b29dfbddc8d9869df75d697f_284_0.png)


    Listing 7-1 Implied Array Key with a Non-zero Start'
