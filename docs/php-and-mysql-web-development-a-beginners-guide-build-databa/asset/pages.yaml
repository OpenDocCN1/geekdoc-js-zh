  md: '# Part II


    # Exercising the Server with PHP


    In Part I of this book, you saw how JavaScript activated dynamic web elements
    scripts running in the client browser. In Part II, you''ll see how PHP, running
    in the server, provides another level of automation, including dynamically handling
    information and determining what a user views next.


    Chapter 5 introduces PHP, what it is, how it is used, how it is installed, the
    use of its many online resources, and what tools you should have to work with
    PHP. The chapter discusses the parts of PHP, how it is tied into and used with
    HTML code, and the rules that need to be followed for good PHP code. Chapter 5
    also discusses the structure of PHP, including strings, numbers, comments, constants,
    variables, arrays, and operators with examples shown of their use.


    Chapter 6 covers if-else and switch statements and the conditions that control
    them, along with for, foreach, while, and do-while loops. The chapter also covers
    PHP''s file-handling capabilities, including opening, reading, writing, and closing
    files, as well as determining a file size and setting a pointer to a particular
    record. Finally, the chapter describes cookies and session and server variables
    and how to use them.


    Chapter 7 describes and demonstrates PHP arrays, in both single and multidimensional,
    how to work with them in loops, and with the many array functions. The chapter
    then looks at form creation and handling, including checking the existence of
    form data and accepting, validating, and transferring data into an array.


    Chapter 8 demonstrates how to use PHP form and file-handling capabilities to set
    up a user login form, validate login information against a file, and establish
    controls that can restrict access to forms and information. Passing data among
    web pages is discussed and how the URL, session variables, and cookies are used
    to do that. Cookies are also discussed in terms of how they can be used to customize
    a page to a particular user.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Chapter 5


    # Fundamentals of PHP


    # Key Skills & Concepts


    +   * Preparing a PHP Workstation

    * Integrating PHP with HTML

    * Writing and Testing PHP

    * PHP Basics

    * Types of Information

    * Variables and Constants

    * Operators

    * Statements and Expressions

    * Functions


    PHP provides server-side programming, giving the web developer access to the web
    server that is hosting the website, and to everything that is stored and/or runs
    there. Among these are other web pages, stored on that or another server; web
    applications such as shopping carts and billing programs; and databases to both
    collect and display information. PHP also access to the server''s file system
    it can read and write information independent of the database. Most importantly,
    PHP can be used to build the web pages that are sent to the client so the pages
    are customized to the person at the client, for example, to display an invoice
    of purchases or selected information in a class.


    This chapter will introduce PHP, how it is integrated with HTML, and how it is
    written and tested on your computer. The chapter will then discuss the parts of
    PHP and the rules that you need to be followed for good PHP code.


    # About PHP


    PHP is a scripting language for developing dynamic web pages. PHP, which runs
    in a web server, is interpreted, meaning that the original human-readable script
    written by the developer is converted to computer instructions each time it is
    used. This contrasts with languages such as C and Java (not JavaScript), which
    are compiled instead of interpreted,'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'meaning the original code is converted to computer instructions as a one-time
    process and stored in the converted form, so when it is used, it can be immediately
    executed and does not have to wait for interpretation. While interpreted languages
    like PHP may be slightly slower, they can be changed immediately before they are
    used, giving them a lot of flexibility and making development easier—something
    you''ll appreciate as you go through the remainder of the book.


    PHP began in 1994 when Rasmus Lerdorf developed it to help add some dynamic elements
    to his personal home page, hence PHP. Since then, it has spread wildfire because
    it is powerful and easy to use, it integrates well with HTML, and it supports
    a number of databases, most importantly, MySQL. Rasmus also put it in the public
    domain, which means that it is not free to use, but anybody with the skill can
    enhance it. As a result, a number of people have worked on it. Today, it is in
    its fifth major revision (PHP 5), with a number of minor revisions along the way
    (as this is written, the latest version is PHP 5.5.9, with PHP 5.6 in development
    testing). PHP is now a fully mature scripting language, as you can see from its
    website, php.net. It has a large number of users all over the world (valuable
    for getting help—the PHP site for one in your area), sizable testing and documentation
    committees, and many developers working on it, for the most part, on a volunteer
    basis. It also has many official sounding, if recursive, name—“PHP: Hypertext
    Preprocessor While it is impossible to get an accurate count, millions of web
    pages have been developed using it, and many professional web developers believe
    that PHP and MySQL are the best way to add a database to a website of any size.


    # Tools Needed for PHP


    To effectively work with PHP, you need to have a development environment that
    supports both the writing and the testing of PHP scripts. You''ll need tools for:


    +   - PHP script writing, with code assistance and validation as you write the
    script

    - PHP script testing on your development computer

    - Developmental support in a browser, to help debug


    Chapter 1 describes and recommends packages that you can download for these tools.
    For the first part of this book, I recommended that you use Aptana Studio development
    environment (IDE) and the WAMP (Windows servers for Apache, MySQL, and PHP) server
    group. While you can continue to use these if you wish, I recommend that you switch
    to Zend Studio IDE and Zend Server because both provide powerful support for PHP
    (they were developed by a couple of the PHP developers). Zend Studio, which uses
    the same foundation as Aptana, provides better debugging help.


    # Preparing a PHP Workstation


    If you do not already have Zend Studio and Zend Server, return to Chapter 1 and
    follow the instructions to download and install them. They are used in the discussion
    in the remaining chapters of this book and will prove very beneficial to your
    PHP work.'
  merge: -1
  pgno: 212
