  md: '# Table 4-7 Click Event Handlers


    In the next few, I''ll use several of the mouse event handlers to demonstrate
    how these can be used in your code.


    # Working with onclick, ondblclick, and Arrays


    While any number of elements on a web page can react to a user''s click, none
    is more ubiquitous than the button. In this first example, along with the onclick
    event handler, I add a couple of other scripting elements to make things a little
    more interesting. First, an array is set up to more efficiently handle multiple
    variables. Next, a function is created to display messages when called. Finally,
    the onclick event handler is attached to screen elements to trigger the action.


    # Introducing Arrays


    An array is a JavaScript object that allows you to store variables, indexed by
    number, so they can be used later in your script. By assigning values to an array,
    not only do you reduce typing when you want to use them (write once, use many),
    but then you can also employ other scripting features such as loops to further
    your efficiency. An array is created from a morphing of how we create variables
    and functions, in the form:


    ```

    var arrayname=new Array()

    ```


    where arrayname is a unique name you provide using the standard JavaScript syntax
    for naming variables and objects, and var, new, and Array() are scripting keywords
    that assign the son-to-be-added variables to a new array.


    You can assign variables (or parameters) to an array at the time you create the
    array (typically in the <head> section) or anywhere in your script thereafter.
    To assign variables after creating an array, you list them in the form:


    ```

    var arrayname=new Array(3)

    arrayname[0]="variablename"

    arrayname[1]="variable1"

    arrayname[2]="variable2"

    ```


    In this case, we have three parameters in this array, so we set up the array containing
    them, new Array(3). Later in our script, we can add parameters in sequence, by
    continuing the original list, or simply adding a line of code with the assignment.
    Alternatively, we could create the array with no parameters, that is, new Array(),
    and add variables as we need them. As objects, arrays have properties and methods
    that make them very useful in your scripting toolbox.


    # CAUTION


    Arrays are efficient data-storage mechanisms that can easily lose their efficiency
    if used incorrectly. When you run a script with say, a 100-parameter array hundreds
    of bytes of data is placed in the memory stack. If you create a 100-parameter
    array but inadvertently assign the last parameter an index of 500—for example,
    DogsInKernel[500]="lassie";—'
