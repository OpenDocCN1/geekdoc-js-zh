  md: '# Reviewing Forms


    This section provides a short primer on forms and how to create them using HTML.
    Several of the event handlers that focus on actions in a form are listed in Table
    4-9. Many of these are demonstrated in the following discussion.


    | Event Handler | Event Trigger |

    | --- | --- |

    | onsubmit | A user submits a form. |

    | onselect | A field in a form is selected. |

    | onreset | A form is reset. |

    | onchange | Contents of a form are changed. |


    Table 4-9 Form Event Handlers


    # Understanding Forms


    A form, much like its paper incarnation, is an area on a page that contains subelements
    to allow a user to input information, an example of which is shown in Figure 4-3.
    The user is given be boxes to fill in, options to select, and choices to make.
    Online forms have several advantages over paper forms:


    +   - Online forms are easily and cheaply produced.


    +   - Input elements can be constructed to enforce user discipline, that is, data
    can be verified to exist (no blank fields), to be of a certain length, or to otherwise
    fit certain criteria.


    +   - Data is provided in digital form and is immediately able to be entered into
    a database.'
