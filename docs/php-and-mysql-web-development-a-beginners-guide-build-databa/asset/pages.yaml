  md: '# Function | Description | Explanation


    | Function | Description | Explanation |

    | count_chars() | Counts occurrence of characters in a string | Arguments are
    the string and optionally a mode, which determines if the return is an array or
    string and what is to be counted. See Note following the illustration. |

    | implode() or join() | Joins array elements to form a string | Arguments are
    the array and optionally the character, which defaults to a space, to be placed
    between elements. |

    | is_string() | Determines if a value is a string | Argument is a variable, which
    is evaluated and returns TRUE if it is a string. |

    | ltrim() | String formed by removing white space and specified characters on
    left | Arguments are the string and optionally a list of characters to remove.
    Without a list, spaces, tabs, carriage returns, newlines, and vertical tabs are
    removed. |

    | number_format() | String formed by formatting a number with a decimal point
    and thousands separator | A floating point number is formatted with an optional
    integer number of decimal digits (1, 2, 4, or not 3). Optionally, the decimal
    point and thousands separator characters can be specified. |

    | str_split() | Splits a string into array elements | Arguments are the string
    and optionally the number of characters in each element, with a default of 1.
    |

    | strval() | Converts a numeric variable to a string | Argument must be an integer
    or floating point number.


