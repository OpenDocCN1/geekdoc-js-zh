  md: 'related to one another through their key, or index, a unique value assigned
    to each record in the table. That it indexes, the key is called the primary key.
    When key is used in another table, it is called a foreign key. For example, in
    the Authors table, the Aid (author ID) is the primary key, but in the Books table,
    the Aid is a foreign key relating the full set of relationships in the Books database
    is shown now.


    | Authors | Books | Publishers |

    |---|---|---|

    | Aid | Bkid | Pid |

    | Last Name | Book Title | Publisher |

    | First Name | Aid | Address |

    | | Pid | City |

    | | Price | |

    | | Cid | |


    The process of taking a field with repeated values and placing the field in its
    own table is called normalization. It not only reduces the space taken up by a
    database, but it also significantly enhances the maintainability of a database.
    If you wanted to change a value in a field, you would have to change all occurrences
    of the value everywhere in the database. With normalization, you only have to
    change a single occurrence.


    # Using phpMyAdmin


    phpMyAdmin is an online graphical user interface for working with a MySQL database
    and is written in PHP. It is an app that can be added into Zend Server. The principal
    use of phpMyAdmin is to initially create databases and their tables that will
    be exercised programmatically with PHP and to do occasional maintenance on these
    databases.


    In this section, we''ll look at how to get and install phpMyAdmin, explore its
    interface, review its security and how to change it, create a database with a
    table, and look at the details of a database specification, including the various
    data types.


