    # Creating and Using a Database


    To create a database, you simply enter the command and give the database name.
    Then you must tell MySQL to use that database with the statements that follow.
    The CREATE DATABASE and USE database commands have the following common formats:


    ```

    CREATE DATABASE database_name;

    USE database_name;

    ```


    # Keywords Used with CREATE DATABASE


    The keywords that can be used with CREATE DATABASE are


    +   - IF NOT EXISTS prevents creating the database if a database of that name
    already exists.

    - CHARACTER SET specifies a default character set to be used with the database.
    See the MySQL Manual for available character sets. If no character set is specified,
    the currently active or set as the MySQL default will be used.

    - COLLATE specifies a default collation sequence to be used with the database.
    See the MySQL Manual for available collation sequences. If no collation sequence
    is specified, the currently active or set as the MySQL default will be used.


    # Creating a Table and Its Columns


    To create a table, you once again enter the command followed by a name, but in
    the same statement you must also list the columns in the table along with their
    data types, size, and special characteristics. The CREATE TABLE command has the
    following common format:


    ```

    CREATE TABLE table_name (column_name type(size) characteristics,...,column_name
    type(size) characteristics);

    ```


    # Keywords Used with CREATE TABLE


    There are three common keywords (or phrases) that you can use with CREATE TABLE:


    +   - IF NOT EXISTS prevents creating the table if a table of that name already
    exists.

    - LIKE old_table_name creates a new table with the same column names, types, sizes,
    and characteristics as another table.

    - TEMPORARY creates a table that only exists for the current user and is automatically'
