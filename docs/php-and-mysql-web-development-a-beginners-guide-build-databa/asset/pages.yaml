  md: '# ABRAHAM LINCOLN


    # GETTYSBURG ADDRESS


    Four score and seven years ago our fathers brought forth on this continent, a
    new nation, conceived in Liberty, and dedicated to the proposition that all men
    are created equal.


    Now we are engaged in a great civil war, testing whether that nation, or any nation
    so conceived and so dedicated, can long endure. We are met on a great battle-field
    of that war. We have come to dedicate a portion of that field, as a final resting
    place for those who here gave their lives that that nation might live.


    Figure 3-4 If you use a background image, be sure that the text can be read against
    it.


    +   - The background property can be a color, an image, or both. If you have both,
    the color will be displayed until the image is generated. The color will also
    show any transparent areas of the image. The background covers the content, padding,
    and border of the element to it is assigned.

    - Backgrounds, colors, or images are at the “bottom” (furthest away from the viewer)
    of the stack of elements on the screen and can be covered by other elements. This
    can be controlled by the z-index property, discussed in “Laying Out with CSS”
    later in this chapter.

    - If you use the background property with, for example, the <p> tag, you will
    want to add some padding around the <p> to allow the background to extend slightly
    beyond the text.

    - If you use an image as the background, you normally want to use a small image
    so that it will download quickly. To have the image cover the element, it will
    probably have to be repeated, which is the default of the background-repeat property,
    so it does not need to be stated.'
