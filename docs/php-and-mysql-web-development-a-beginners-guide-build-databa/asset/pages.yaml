  md: '![](img/b6e70110b29dfbddc8d9869df75d697f_428_0.png)


    # # Alter and Drop Events


    ALTER EVENT allows you to make changes to an existing event. It has the following
    general form:


    ```

    ALTER EVENT event_name ON SCHEDULE do mysql_statement;

    ```


    This allows you to change any aspect of the event with the contents of the ALTER
    EVENT statement, including using the keyword RENAME to change the name of the
    event.


    DROP EVENT allows you to delete an existing event. It has this general form:


    ```

    DROP EVENT event_name;

    ```


    # # Using Views


    Views are, in essence, SELECT statements that you can repeatedly call using only
    the name without specifying the FULL SELECT statement.


    # # Create Views


    The general form of a CREATE VIEW statement is'
