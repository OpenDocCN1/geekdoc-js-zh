- img_proc: true
  md: '**Dedicated environment** Both packages, but especially Visual Studio, assume,
    or even require, that you use into other programming tools provided by that company.


    **Marginal WYSIWYG** The display of a web page depends on the browser that is
    used. Dreamweaver''s attempts to allow you to edit in a page image that is close
    to the final displayed page is marginal at best and can significantly differ from
    the actual display. This can lead you to lay out a page differently than you would
    otherwise.


    **Complex and inefficient code** The automatically generated code by Dreamweaver,
    especially using PHP, is complex, inefficient, and difficult to change and customize.
    If you want to do anything in PHP on your own with a page in which Dreamweaver
    has PHP code, it is difficult.


    ![](img/b6e70110b29dfbddc8d9869df75d697f_23_0.png)


    Figure 1-2 Adobe Dreamweaver, shown in code view, may do more than you may want.


