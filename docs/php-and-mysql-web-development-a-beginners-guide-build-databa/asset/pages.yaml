  md: '# Methods


    The actions that can perform are called methods. In many cases, you can think
    of methods as being predefined functions for an object. For example, to return
    the square root of three, you would use the math object''s square root method.
    Using the syntax, this would be in the form: math.sqrt(3). Another example of
    using methods to elicit actions from an object was shown in the earlier section
    on objects where the alert() method was used to display a message box. As with
    properties, different object and object types share many of the same methods.


    # TIP


    Since both an object''s properties and methods are written in the form object.method
    or object.property, how can you determine which is which? The values associated
    with a property are set by the use of the equal sign and by enclosing the value
    in quotes (document.backgroundColor="dodgerblue"). Values used in methods are
    enclosed in parentheses alone (Math.sqrt(3)).


    # Event Handlers


    JavaScript allows you to easily take advantage of events, or triggers, such as
    mouse clicks and page openings performed by a user on your web page, through the
    use of predefined event handlers. The event handlers recognize the event taking
    place and then perform one or more tasks, adding interactivity between the web
    page and the user. For example, when a user hovers the mouse pointer over a button,
    an alert dialog box opens, warning of the consequences of clicking the button
    (the clicking action directed to another action by a second event handler). You''ll
    see examples of event handlers later in this chapter.


    Table 4–5 lists the most common JavaScript event handlers and the triggers needed
    to perform their assigned tasks.'
