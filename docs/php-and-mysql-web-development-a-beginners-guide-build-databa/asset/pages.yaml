  md: '# Looping Through Arrays


    As you have seen, the print_r() function automatically loops through an array
    and displays the key=>value pairs in an array. You can also do this using for,
    while, and foreach loops.


    # Using foreach


    foreach is structured for use with arrays and uses the simple form foreach ($arrayname
    as $value); to successively place each of the values in $arrayname into $value,
    as shown in Listing 7-3 with an HTML ordered list and displayed next (notice that
    even though the default numeric keys in an array start with 0, HTML ordered list
    starts at 1).


    ![](img/b6e70110b29dfbddc8d9869df75d697f_287_0.png)


    Listing 7-3 Using foreach with a Numeric Array'
