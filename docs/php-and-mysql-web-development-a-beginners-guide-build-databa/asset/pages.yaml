  md: '# TIP


    Once more, all the scripts in this chapter are available online. See the book’s
    Introduction.


    # Application Design


    This chapter will build an application to display books, handle a customer registration
    and signing in, conclude a purchase, and prepare an invoice. It is based on the
    four database tables and four sets of scripts shown schematically in Figure 14-1.
    The major components are


    +   - Book Display and Selection

    - Customer Sign-in and Authentication

    - Confirmation of Individual Sale

    - Invoice Preparation and Email


    Each of the sections has one or more scripts interacts with one or more tables.
    We will pick up and modify for this purpose scripts from Chapter 13 as applicable.

    The functioning of the application will follow these steps:


    +   - Customer will come to the site and review a list of books to buy and possibly
    select a book that they want to purchase.

    - If the customer selects a book to buy, he or she will be asked to register if
    they are a first-time buyer, or returning buyer. If the script finds the email
    address and password in the database, the user’s name and address information
    will be presented for them to update. If the email address and password are not
    found, the customer is given three tries and asked to register.

    - With the selected book information and the user’s information, a sales record
    is built and presented to the user to confirm.

    - With a sale confirmation, a sales record will be written and the customer asked
    if they want to shop for another book.


    When the customer is done shopping, an invoice is created and presented to the
    customer for approval. When the customer approves, the invoice is written in the
    Invoice table and an email is sent to the customer to complete the transaction.


    # Design Template and CSS


    As in Chapter 13 and with larger web apps, a template is useful to provide a consistent
    look over a number of separate web pages. You also want a single CSS for use throughout
    the application. Here, we’ll start off with the CSS and template from Chapter
    13 and make only minor modifications to them.


    # TIP'
