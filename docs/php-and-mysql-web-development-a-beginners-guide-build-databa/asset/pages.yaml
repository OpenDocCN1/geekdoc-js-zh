    # # PHP Introduction


    PHP is a way within a web page of telling the server that you want something done.
    It may be to open another web page, write in a file, or extract information from
    a database. Whatever it is, in an HTML page, the developer has decided that he
    or she needs something from the server. This is the job of PHP. Note that it started
    from an HTML page, the first question is how to put PHP on an HTML page. The second
    question is what can be done with it once it is there.


    # # Integrating PHP with HTML'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'Putting PHP in an HTML file is very simple:


    +   - You change the PHP code with <?php ... ?>.


    +   - You surround the PHP code with <?php ... ?>.


    The .php extension tells the server that the file needs to go through the PHP
    interpreter. The <?php ... ?> tells the PHP interpreter that it needs to process
    whatever is in the middle and replace the PHP lines of script with HTML code sent
    to the browser so it can interact with the server.


    # NOTE


    In some situations, you can use <?? ... without the php, but unless you are developing
    for a very controlled environment like an intranet, we strongly suggest that you
    include the php to make your script works in all environments and to simply alert
    or remind whoever is looking at the script that they are looking at PHP.


    Given two rules, you can put PHP script anywhere in an HTML file. For example,
    Listing 5-1 shows a single PHP statement to open information about your PHP server
    in the body of an HTML page that is saved with a .php extension. The result is
    shown in Figure 5-4.


    # Listing 5-1 PHP Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Listing 5-1</title>

    </head>

    <body>

    <h1>This is an Example of PHP Embedded in HTML</h1>

    <p>The PHP code displays information about the PHP server.</p>

    <?php

    phpinfo();

    ?>

    </body>

    </html>

    ```'
