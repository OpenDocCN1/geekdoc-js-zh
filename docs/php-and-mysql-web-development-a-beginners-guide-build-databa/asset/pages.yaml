    # # Creating the Scripts


    As so you in Figure 13-31, the Class Selection and Registration Application has
    five modules:


    +   - Administrator Authentication

    - Database Entry and Maintenance

    - Class List and Selection

    - Student Entry and Update

    - Registration and Confirmation


    Each of these modules will have one or more scripts and will interact with one
    or more of the database tables. We will address them in the order shown in the
    preceding list, primarily because we need a method to enter classes into the database.
    (The class entry could be done in phpMyAdmin, but we need an online way to do
    this for a complete system.)


    # # NOTE


    In the following scripts, as was true with User Authentication, often, a given
    function is handled with a pair of scripts: one with the HTML and possibly a small
    amount of PHP, and another with just PHP and MySQL. While these could be combined
    in a single script, we prefer to do it with two scripts because we believe it''s
    easier to debug, it keeps each script simpler, and it''s a more intuitive way
    of transferring information to and from'
