    # Consider Display Size


    When you lay out a web page, you need to consider the display real estate you
    have to work with. That is a combination of the display''s physical size and its
    resolution. W3Schools.com has a display statistics table, shown that reveals the
    change in the screen resolution of their site''s visitors over time. The summary
    message of the table is that the majority of screens are now high resolution,
    but it says nothing about screen size. It is my supposition, I can''t find any
    statistics, that the average screen size is getting smaller because of the new
    laptops with smaller screens and the proliferation of tablets and smart phones.
    The resolution can stay and still display the content on the smaller screen, but
    the size of the content is to the point where it is uncomfortable to view. The
    point is if you think your audience is going to view your site on smaller displays,
    you need to test it out and see if it works. This is especially true if'
