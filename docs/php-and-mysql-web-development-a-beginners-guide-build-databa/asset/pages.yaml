  md: 'the sides of the containing block by using the values of the top, right, bottom,
    and left elements. An absolute-positioned element has no impact on the layout
    of the other elements, and its margins do not collapse with other margins.


    +   Fixed positioning is the same as absolute positioning, and additionally, the
    element remains at a fixed position (its original position) on the screen as a
    page is scrolled.


    **Normal Flow** In the normal flow, block flow onto the page, starting at the
    top, and are positioned one after the other, separated by their margins. The left
    edge of a block is positioned against the left edge of the containing block. Inline
    boxes flow onto the page starting at the top left and are positioned horizontally
    across the containing block to the right edge, where they move down and start
    another horizontal set of boxes. Such a set of inline boxes that stretches across
    the width of a containing block is called a line box. A set of inline boxes may
    be aligned within the line box horizontally with the vertical-align property and
    aligned vertically with the text-align property.


    **Float Positioning** Float positioning allows you to pull a block out of its
    normal flow''s vertical position and attach it to the left or right side of the
    containing block. Once attached, the floated block will allow other blocks on
    its unattached side. This is the primary and recommended way of producing multiple
    columns. Tables, discussed later in this chapter, can produce sure placement of
    information on a page if your only audience is a 1920×1080-pixel computer screen.
    The beauty of a floated block is that it is flexible and can look good on many
    different viewing devices, if you can get all the pieces to “float” where you
    want them.


    In Listing 3-12, you''ll see a CSS and the related HTML5 used to create a common
    three-column page with header and footer blocks, as shown in Figure 3-5.'
