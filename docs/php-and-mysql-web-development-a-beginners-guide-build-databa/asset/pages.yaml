    # Session Variables


    Session variables allow you to collect and use information across multiple pages
    in a website during a single session, or encounter between a user and a website.
    To define a session, you must start it with the session_start() function, which
    must precede all other code sent to the client, including <html> and <head>. You
    can then store information in the $SESSION array. If you go back to another page
    and start it again with the session_start() function, you can retrieve the information
    in the $SESSION array. [Listing 6-7a](#) [Listing 6-7b](#) demonstrate this with
    the results shown here:


    ![](img/b6e70110b29dfbddc8d9869df75d697f_273_0.png)


    ![](img/b6e70110b29dfbddc8d9869df75d697f_273_1.png)


    Listing 6-7a Creating a Session Variable


    ```

    <?php

    session_start()

    ?>

    <!DOCTYPE html>

    <html>

    <head>

    <title>Listing 6-7a</title>

    </head>

    ```'
