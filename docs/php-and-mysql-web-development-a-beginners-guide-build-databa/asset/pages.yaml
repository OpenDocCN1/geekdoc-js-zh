  md: 'value. The second is inheritance, which considers the influence of values determined
    by elements that are parents to the current element. The third process is the
    calculation of the final value.


    # Cascading Order. In cascading order, a value is determined by the influence
    that is found to be most important in a given hierarchy. For CSS, the cascading
    order of precedence, in ascending order where 1 is least important and 6 is most
    important, is


    +   1. Conventions and settings in the browser or viewing software.

    2. Default settings made by the user or viewer of the web page.

    3. Imported or linked style property values.

    4. If a selector, for example <p>, appears more than once in a style sheet and
    refers to the same property, the last one in the sheet takes precedence over earlier
    ones.

    5. Embedded style property values.

    6. Inline style attribute property values.

    7. Settings by the user or viewer as the page is being viewed.


    In other words, the browser begins with its own settings, which may be changed
    by the user, replaced by an external style sheet and then by an embedded style
    sheet, and is finally adjusted in the viewed program by the user.


    If you want a particular style to override what would otherwise occur with the
    cascade, you can give that style a !important declaration and it will do so. An
    example of such a declaration is


    ```

    h1 { font : 24pt "Arial Black" !important ; }

    ```


    Inheritance Through inheritance, an element''s value can be determined by the
    values of elements that are earlier in the document tree. For example, Listing
    3-6 shows a simple web page with the document tree displayed as Aptana''s outline
    view, shown next:


    ![](img/b6e70110b29dfbddc8d9869df75d697f_107_0.png)


