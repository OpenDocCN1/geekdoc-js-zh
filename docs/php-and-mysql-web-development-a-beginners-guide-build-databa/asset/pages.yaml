    \ as is in Listing 6-10. The PHP Manual talks of this as finding a \"needle in\
    \ the haystack.\" There is one catch to using the strpos() function if you are\
    \ checking for is the very beginning of the string. For example, if you use strpos(\"\
    Christie is my name\", \"Christie\") it would return 0, or FALSE, since the position\
    \ is 0. To correct for this, you would need to use\n\n```\nif (strpos(\"Christie\
