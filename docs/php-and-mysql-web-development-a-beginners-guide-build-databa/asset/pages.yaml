    bulleted, numbered, and definition lists; preformatted paragraphs; comments; and
    horizontal lines or rules. Unless the preformatted style is used, normal line
    endings, more than one extra space, and tabs are ignored in HTML. Lines simply
    wrap to fit the space allotted for them unless you use the paragraph tag. Listing
    2-2 shows examples of paragraph styles. This listing is combined with the tags
    in Listing 2-1 to produce the web page shown in Aptana in Figure 2-4 and in the
    Chrome browser Figure 2-5. Paragraph styles are described in Table 2-3.'
