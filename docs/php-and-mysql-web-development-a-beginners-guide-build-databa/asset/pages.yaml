  md: '# Basic File Functions


    The basic PHP file process has the following elements:


    +   - Establish a file connection, or file pointer (also called a “handle”), between
    PHP a file using the fopen() function.


    +   - Write a data string to an opened file using the fwrite() function.


    +   - Read a certain number of bytes into a string from an opened file using the
    fread() function.


    +   - Terminate a file pointer with the fclose() function.


    Table 6-1 provides more information about these basic file functions, and Listing
    6-5 provides a brief demonstration of how these functions are used.


    | Function | Description | Explanation |

    | --- | --- | --- |

    | fclose() | Terminates a file pointer | The only argument is the file pointer
    created with fopen(). Returns TRUE for a successful close and FALSE otherwise.
    |

    | fopen() | Connects to a file and creates a file pointer | The required arguments
    are the string with the filename, and a string with the mode (see Table 6-2 for
    the list of modes). Returns a file pointer that can be used with other file functions
    or FALSE. |

    | fread() | Reads a certain number of bytes into a string | The required arguments
    are the file pointer created with fopen() and the number of bytes to be read.
    Returns a string with data read or FALSE. |

    | fwrite() | Writes a string to a file | The required arguments are the file pointer
    created with fopen() and the string to be written. Optionally, the number of bytes
    to be added. Returns the number of bytes written or FALSE. |

    | rewind() | Resets the file pointer to the beginning of the file | The only argument
    is the file pointer created with fopen(). Returns TRUE if successful, and FALSE
    otherwise. |


    Table 6-1 Basic File Functions'
  merge: -1
