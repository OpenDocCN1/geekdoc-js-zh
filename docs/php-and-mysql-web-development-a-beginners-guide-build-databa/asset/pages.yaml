    # Understanding SQL


    SQL, or the Structured Query Language, is an efficient means of working with data
    using statements similar to spoken English. SQL was originally developed at IBM
    and has since become an international standard that is used by a number of RDBMSs.
    SQL was designed as a structured, declarative query language for relational databases.
    SQL statements generally begin with a declarative command, such as CREATE, DELETE,
    INSERT, OPEN, SELECT, and UPDATE. This is followed by one or more clauses beginning
    with one or more of these keywords: FROM, GROUP BY, HAVING, JOIN, ORDER BY, and
    WHERE. For example, using the Books database and table defined in Chapter 9, a
    query might be:


    ```

    SELECT * FROM books WHERE price > 5.00 ORDER BY title;

    ```


    This will select all (the asterisk) in records from the Books table where the
    Price is greater than $5.00, and order the resulting list by Title. Listing 10-1
    shows additional examples of SQL statements that build the Books table used with
    phpMyAdmin in Chapter 8 with five fields, three of which are variable-character
    strings of either 255 or 60 maximum characters. The Bkid field is an integer that
    has a value (NOT NULL) and is the primary key for the table. The data for six
    books is inserted into the table. The first five of them, each field has a value,
    so the fields are not specified. For the sixth book, two of the fields are missing,
    the ones that are present must be specified. Then the table is updated to change
    the price for book 3 and to change the title for book 5 to correct a misspelling.
    Finally, book 6 is removed from the table.


