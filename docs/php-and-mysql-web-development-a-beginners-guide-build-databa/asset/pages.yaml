  md: 'reflect it.


    # Using HTML5


    Having said that I strongly recommend using the changes in HTML5, I want to clarify
    that mean I recommend using the HTML5 changes, additions, and deprecations to
    HTML tags and attributes, as described in this chapter. On the other hand, HTML5
    loosened several of the rules of syntax in HTML (the way elements are formed,
    appear, and are arranged in a well-formed script) that I discourage you from following.
    In particular:


    +   HTML5 tags and attributes can be either upper- or lowercase, but for ease
    of identification and use, and to maintain an XHTML rule, I recommend using all
    lowercase for both tags and attributes.


    +   HTML5 doesn''t require elements to have a closing tag or slash (/). I recommend
    you include all closing tags and slashes. For example, in HTML5, you can use <p>
    and <img> by themselves. I recommend you use <p></p> and <img>. Aptana, Zend Studio,
    and other integrated development environments (IDEs) provide ending tags and slashes
    automatically; they help you see where an element ends; and assure that embedded
    CSS and JavaScript operate properly.


    +   HTML5 doesn''t require the <html>, <head>, and <body> elements. I recommend
    that you keep them for the simple reason that they provide structure to your script,
    as does indentation, which is not required.


    +   HTML5 doesn''t require quotes around attribute values in some cases. I recommend
    that you use the quotes because of the last two words "some cases" and remove
    any ambiguity.


    I will use all of these recommended syntax conventions in this book.


    # NOTE


    A powerful reason for using a stricter syntax than allowed by HTML5 is not that
    browsers need it to better display your page, although it can help in certain
    circumstances, but that humans, including the programmer, need it to better understand
    and follow a script. For the most part, browsers are good at rendering HTML, but
    that doesn''t mean you should depend on it.


