  md: "In hopes of simplifying the discussion in this chapter, several terms are meant\
    \ their generic sense. These include the following:\n\n**Page** or “web page”\
    \ is the original area or “canvas” on which the web designer lays out the elements\
    \ to be displayed.\n\n**Browser** is any software that can render the page so\
    \ it can be read. **Screen** is any device that can display the page, including\
    \ handheld devices and printers.\n\n# Creating CSS\n\nCSS is simply lines of text\
    \ (the rules) embedded in an HTML5 (from here referred to as HTML) page, or more\
    \ commonly, in a separate CSS file, which can be applied to a number of HTML pages.\
    \ CSS is designed to be very compact, with many features that keep it from being\
    \ verbose, as shown in Listing 3-1.\n\nListing 3-1 CSS Example\n\n```\nbody {\n\
    \  background:yellow;\n  color:red;\n  font: 12pt Arial;\n}\nh1, h2 {\n  color:blue;\n\
    \  font: 24pt \"Comic Sans MS\";\n}\n```\n\nIn the CSS listing shown in Listing\
    \ 3-1, the HTML<body> tag on the web page to which this CSS is attached is assigned\
    \ a background color of yellow, a text color of red, and a font of 12-point Arial.\
    \ In addition, the <h1> and <h2> heading tags are assigned a text color of blue\
    \ and a font of 24-point Comic Sans. This shows how CSS cascades: body attributes\
    \ are assigned to the elements on the page, except the h1 and h2 elements, which\
    \ have their own attribute assignments.\n\n# Attaching CSS\n\nA CSS is attached\
    \ to HTML pages or files in one, two, or both ways:\n\n+   * Embedded in the HTML\
    \ file using the <style> tag.\n\n+   * Linked to an external CSS file using the\
    \ <link> tag.\n\nListing 3-2 shows how the <style> tag is used. Note that the\
    \ CSS is embedded in the <head> section of an HTML document, but you can have\
    \ multiple <link> tags if needed. Both of these only appear in the <head> section\
    \ of an document. Figure 3-1 shows that the two methods of attaching a CSS produce\
    \ exactly the same result (you have to use your imagination for the color, but\
    \ as it is stated), while Table 3-1 shows the tags and their attributes.\n\nListing\
    \ 3-2 HTML Page with <style> Tag"
  merge: -1
