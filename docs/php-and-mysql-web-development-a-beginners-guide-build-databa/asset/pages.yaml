  md: '| Data Type/Subtitle | Name | Description | Examples |

    | --- | --- | --- | --- |

    | Boolean | bool | Either true or false is case sensitive | true, false |

    | Numeric/Floating point numbers | float | A fractional number with a decimal;
    may be negative, and may use scientific notation | 7.34, -21.89, 2.31e3 |

    | Numeric/Integers | int | A whole number without a decimal; may be negative |
    43, 928, -4 |

    | Numeric/Null | null | The absence of any value | null |

    | String | string | A series of characters (one of 256 letters, numbers, and special
    characters) enclosed in either single or double quotation marks | "Mike'', ''Seattle'',
    ''14 W. 18th St" |


    # Table 4-2 JavaScript Data Types


    +   * The Boolean false is equivalent to the integer 0, the floating point number
    0.0, an empty string or a string of "0", an array of zero elements, or null. Everything
    else is true.

    * Integers are, by default, decimal (base 10) numbers. To make a octal (base 8),
    precede it with 0 (zero). To make a hexadecimal (base 16), precede it with 0x.

    * Very integers (larger than 2,147,483,647) are considered floating point numbers.

    * If you divide two integers, you get a floating point number, unless the numbers
    are evenly divisible.

    * Floating point numbers are not accurate to the last digit because of the infinite
    progression of fractions like one-third. Therefore, you should not compare two
    floating point numbers for equality.

    * A string containing a number (either integer or floating point) immediately
    following the left quote can be used as a number. For example, "18.2" and "4 cars"
    can both be used as numbers, while "his 4 cars" cannot.


    # NOTE


    In this book, two additional pseudo-types are used for discussion purposes only:
    "mixed" is used for any combination of other types, and "numbers" is used for
    a combination of integers and floating numbers.


    # Naming Conventions


    The name that you give to variables or constants (or any other label in JavaScript)
    is case sensitive (see "JavaScript Basics" earlier in the chapter); can begin
    with either the letters a–z (or A–Z, though not recommended) or an underscore
    (_); can be of any length;'
