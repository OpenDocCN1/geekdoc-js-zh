- img_proc: true
  md: 'Trigger times can be either BEFORE OR AFTER the trigger event. Trigger events
    can be INSERT, UPDATE, or DELETE actions on rows within the named table. FOR EACH
    ROW executes the following statement(s) on each row affected by the trigger event.
    There can be only one trigger with a given table with the same trigger time and
    event. Also, the table must be a permanent (not temporary) table.


    An example of creating a TRIGGER statement and then using it is

    CREATE TRIGGER taxcalc BEFORE INSERT ON sales FOR EACH ROW SET NEW.tax = ROUND(NEW.amount*.092,
    2);

    INSERT INTO sales (buyer, product, amount) VALUES

    (''Linden'', ''Tablet AP6'', 784.46),

    (''Meyers'', ''Phone Ap5c'', 469.95),

    (''Bitts'', ''Laptop HP567'', 932.75);


    This allows you to insert the tax after inserting the record, even though you
    could have done it with the INSERT.


    # Drop Triggers


    DROP TRIGGER allows you to delete an existing trigger. It has this general form:


    DROP TRIGGER trigger_name;


    # NOTE


    Triggers cannot be altered.


