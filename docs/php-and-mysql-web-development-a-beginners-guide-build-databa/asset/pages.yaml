    The result of a logical expression is TRUE (1), FALSE (0), or NULL, where NULL
    is the absence of a value or is unknown. Examples of logical expressions where
    x is TRUE and y is FALSE are


    +   * x AND is FALSE, but if y is TRUE, x AND is TRUE.

    * x OR is TRUE, but if y is TRUE, x OR is still TRUE.

    * x XOR is TRUE, but if y is TRUE, x XOR is FALSE.

    * x AND is NOT TRUE, but if y is TRUE, x AND NOT is FALSE.


    # Assignment Operators


    Assignment operators allow you to assign a value to a user variable. := is the
    primary assignment operator, but in the SET clause, you can use=. In all cases
    other than the SET clause, = is considered a comparison operator. Examples of
    assignment operators are


    +   * @name := ''Michael''

