  md: '# Internal Functions


    You can use an internal or predefined PHP function to do many different tasks.
    The full set of PHP functions, see the online PHP Manual - Function Reference
    at php.net/manual/en/funref.php.


    The following sections describe a few of the more heavily used internal functions
    as examples in the given category. Again, these are only a small sample of the
    available functions.


    Array Functions Array functions provide the means to work with arrays in a number
    of ways. Several of these are shown in Table 5-4 and are demonstrated in Listing
    5-5.


    ![](img/b6e70110b29dfbddc8d9869df75d697f_240_0.png)


    | Function | Description |

    | --- | --- |

    | array() | Builds an array of arguments | Arguments are a series of key => value
    statements separated by commas, Keys can be integers or strings. Values can be
    any type. |

    | count() | Counts elements in an array | Argument is an array name; the elements
    are the number of key/value pairs. |

    | print_r() | Prints a variable, including an array, in readable form | Argument
    is a variable (or array) name. With an optional second argument = TRUE, the contents
    of the variable or array are returned for use by another variable instead of being
    printed. |


    Table 5-4 Several Array Functions


