    \ Step away and do something else. Your brain will subconsciously work on the\
    \ problem and wake you at 4am with a solution. Even if that doesn’t happen, fresh\
    \ eyes will spot that obvious missing semicolon.\n\n## Node.js Debugging: Environment\
    \ Variables\n\n[Environment variables](https://nodejs.org/api/cli.html#cli_environment_variables)\
    \ that are set within the host operating system can be used to control Node.js\
    \ application settings. The most common is `NODE_ENV`, which is typically set\
    \ to `development` when debugging.\n\nEnvironment variables can be set on Linux/macOS:\n\
    \n```\nNODE_ENV=development\n```\n\nWindows `cmd`:\n\n```\nset NODE_ENV=development\n\
    ```\n\nOr Windows Powershell:\n\n```\n$env:NODE_ENV=\"development\"\n```\n\nInternally,\
    \ an application will enable further debugging features and messages. For example:\n\
    \n```\n// (Example code block for debugging)\n```\n\n## Node.js Debugging: Command\
    \ Line Options\n\nVarious [command-line options](https://nodejs.org/api/cli.html)\
    \ can be passed to `node` when launching an application. One of the most useful\
    \ is `--trace-warnings`, which outputs stack traces for process warnings (including\
    \ deprecations).\n\nAny number of options can be set, including:\n\n*   `--enable-source-maps`:\
    \ enable source maps (experimental)\n*   `--throw-deprecation`: throw errors when\
