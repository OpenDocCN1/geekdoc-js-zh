    ## 1. 卷 (Volumes)

    由 Docker 管理的文件系统


    ## 2. 绑定挂载 (Bind mounts)

    主机上的文件或目录。


    两者均可将目录挂载到容器中，例如用于 MongoDB 数据存储的 `/data/db`。


    卷是持久化数据的推荐方式。在某些情况下，它是唯一的选择。MongoDB 目前不支持在 Windows 和 macOS 主机上的绑定挂载。


    ## 网络 (Networks)


    容器可以使用其各自隔离网络内的标准协议和端口与另一个容器通信。根据需要可以将特定端口暴露给其他容器和主机。


    例如，你可以有一个运行在 `nodejs` 容器 `3000` 端口的 Node.js 应用，它与 `mysql` 容器的 `3306` 端口通信。如果这两个端口都暴露给主机，就可以从
    `http://localhost:3000/` 启动应用程序，并且 MySQL 客户端可以到 `http://localhost:3306/`。


    ## Docker Compose


    Docker Compose 是用于管理多个关联卷和网络的容器的工具。一个名为 `docker-compose.yml` 的文件定义了所有配置。


    ## 开发环境与生产环境


    开发环境通常：


    * 设置环境变量，如 `NODE_ENV=development`

    * 对代码更改做出响应，可能使用如 [nodemon](https://nodemon.io/) 等工具进行自动加载

    * 启用调试消息和协议

    * 暴露目录和端口，以便检查数据库和文件


    生产服务器的限制更多，且有不同的扩展需求，但 Docker 提供了若干机会：


    1. Docker 可以启动（并重启）任意数量的 Node.js 应用容器。无需使用 [clustering](https://nodejs.org/dist/latest/docs/api/cluster.html)
    或如 [PM2](https://pm2.keymetrics.io/) 和 [forever](https://www.npmjs.com/package/forever)
    等解决方案。

    2. 数据库容器可以仅供应用程序使用。与多个应用程序共享的数据库相比，安全和维护问题更少。

    3. 端口只需要在容器网络内暴露。考虑使用 NGINX 容器作为反向代理访问 Node.js 容器，后者再访问 MySQL 容器。只需要将 NGINX 端口暴露给主机（HTTP
    的 80 或 HTTPS 的 443）。通过两个或更多网络，可以限制 MySQL 仅供 Node.js 容器访问。

    4. 可以开发特定于的 Docker Compose 配置。也可以采用其他的容器管理系统，如 [Docker Swarm](https://docs.docker.com/engine/swarm/swarm-tutorial/)、Kubernetes](https://kubernetes.io/)
    或 [AWS Fargate](https://aws.amazon.com/fargate/)。


    将容器部署到生产服务器有好处，但并非绝对必要。也许你的主机不支持 Docker，或者你更倾向于云服务而非本地安装的数据库？在这种情况下，在开发期间可以使用与生产系统高度匹配的配置使用
    Docker。


    ## 如何安装 Docker


    在 Linux 上安装最新版本 Docker 的说明请参考 [Docker Docs](https://docs.docker.com/install/linux/docker-ce/ubuntu/)。你也可以使用官方仓库，尽管版本可能较旧。例如，在
    Ubuntu 上：


    ```

    sudo apt-get update

    sudo apt-get remove docker docker-engine docker.io

    sudo apt install docker.io

    sudo systemctl start docker

    sudo systemctl enable docker

    ```


    Docker Compose 在 Linux 上是[单独安装的](https://docs.docker.com/compose/install/)：


    ```

    sudo curl -L "https://github.com/docker/compose/releases/download/<VERSION>/docker-compose-$(uname
    -s)-$(uname -m)" -o /usr/local/bin/docker-compose

    sudo chmod +x /usr/local/bin/docker-compose

    ```


    在这里，`<VERSION>` 是[最新的发布版本](https://docs.docker.com/compose/releases)——例如 `1.25.3`。


    安装方法随 Linux 版本而异。*请搜索网络获取相应的说明。*


    [适用于 macOS Sierra 10.12 及更高版本的 Docker CE Desktop](https://hub.docker.com/editions/community/docker-ce-desktop-mac)
    和 [适用于 Windows 10 专业版的 Docker CE Desktop](https://hub.docker.com/editions/community/docker-ce-desktop-windows)
    可以安装包的形式提供，包含了 Docker 和 Docker Compose。你必须在 [Docker Hub](https://hub.docker.com)
    注册并登录后下载。


    Windows 10  Docker 使用 [Hyper-V 虚拟化平台](https://docs.microsoft.com/en-us/virtualization/hyper-v-on-windows/)，你可以在控制面板的**程序和功能**中的**启用或关闭
    Windows 功能**来启用它。Docker 还可以使用[适用于 Linux 的 Windows 子系统 2](https://docs.microsoft.com/en-us/windows/wsl/wsl2)（WSL2—*目前对
    Windows Insider 用户处于测试阶段*）。


    要确保 Docker 可以访问 Windows 文件系统，请从 Docker 托盘图标菜单选择 **Settings**，导航到 **Shared Drives**
    格，并选择服务器允许使用的驱动器。


    ### Windows 10 家庭版


    如果你运行 Windows 10 家庭版，请查看我们的文章[如何在 Windows 10 家庭版上安装 Docker](https://www.sitepoint.com/docker-windows-10-home/)。


    在命令行提示符中输入 `docker version` 检查 Docker 是否安装成功。可选，尝试 `docker version` 进行验证。


    ## 权限错误


    在 Linux 上，如果你遇到 `permission denied while trying to connect to the Docker daemon`
    错误，可以通过以下方式解决：


    ```

    sudo groupadd docker

    sudo usermod -aG docker $USER

    ```


    然后重启机器。


    ## 如何启动数据库容器


    输入以下命令启动 MongoDB：


    ```

    docker run -d --rm --name mongodb -p 27017:27017 --mount "src=mongodata,target=/data/db"
    mongo:4

    ```


    第一次运行此命令时，Docker 会下载并初始化 MongoDB，这可能需要几分钟时间。现在任何 MongoDB 客户端都可以连接到 `localhost:27017`（不需要用户
    ID 或密码）。或者，从另一个终端直接连接到容器 shell：


    ```

    docker exec -it mongodb sh

    ```


    启动 MongoDB 命令行：


    ```

    mongo

    ```


    然后运行任何数据库命令。例如：


    ```

    test;

    db.apps.insertOne({ name: ''Docker'' });

    db.apps.find();

    ```


    输入 `exit` 退出 MongoDB 客户端，再次输入 `exit` 退出 shell。


    使用以下命令列出运行中的容器：


    ```

    docker container ls

    ```


    停止并移除 MongoDB 容器，输入：


    ```

    docker container stop mongodb

    ```


    同样，你可以使用命令启动 MySQL 8 容器：


    ```

    docker run -d --rm --name mysql -p 3306:3306 --mount "src=mysqldata,target=/var/lib/mysql"
    -e MYSQL_ROOT_PASSWORD=mysecret mysql:8

    ```


    一旦启动完成（可能需要几分钟），使用任何 MySQL 客户端通过用户 ID `root` 和密码 `mysecret` 连接到 `localhost:3306`。例如：


    ```

    docker exec -it mysql sh

    mysql -u root -pmysecret

    ```


    可以使用以下命令停止 MySQL 容器：


    ```

    docker container stop mysql

    ```


    #### 端口已被占用


