    \ from the [Docker Hub](https://hub.docker.com/_/node). In general:\n\n*   most\
    \ images are large and require a 100MB+ download\n\n*   `alpine` images have the\
    \ smallest 5MB download, but may not provide some OS dependencies your application\
    \ requires\n\n*   `slim` images are are cut-down versions of the main Linux images,\
    \ which may be a reasonable pragmatic choice\n\nIn this case, we can use `lts-alpine`—the\
    \ smallest image with the most recent LTS (even-numbered) version of Node.js.\n\
    \nA `Dockerfile` defines the build steps required to create an image for the application.\
    \ Various [commands can be used](https://docs.docker.com/engine/reference/builder/),\
    \ including these:\n\n| command | description |\n\n| --- | --- |\n\n| `FROM` |\
    \ build the image from a [Docker hub](https://hub.docker.com/) starting image\
    \ |\n\n| `ENV` | set an environment variable |\n\n| `WORKDIR` | set a working\
    \ directory |\n\n| `USER` | set an active user |\n\n| `RUN` | execute an installation\
    \ command, such as `npm install` |\n\n| `COPY` | copy files from the host machine\
    \ |\n\n| `EXPOSE` | expose a port to the host |\n\n| `CMD` | the container launch\
    \ command |\n\n**Dockerfile**\n\n```\nFROM node:lts-alpine\n\nENV HOME=/home/node/app\n\
    ENV NODE_ENV=production\n\nRUN mkdir -p $HOME && chown -R node:node $HOME\n\n\
    WORKDIR $HOME\nUSER node\n\nCOPY --chown=node:node package*.json $HOME/\nRUN npm\
    \ i && npm cache clean --force\n\nCOPY --chown=node:node . .\n\nEXPOSE 3000\n\n\
    CMD npm start\n```\n\nThis example presumes a production environment. However,\
    \ we’ll override some settings on the Docker command line and in Docker Compose\
    \ during development.\n\nAlso create a `.dockerignore` file to ensure non-essential\
    \ files are not copied to the image:\n\n**.dockerignore**\n\n```\n.git\n.gitignore\n\
    .config\n.npm\n.vscode\nnode_modules\n```\n\nTo build a new image named `nodetest`,\
    \ from within the project root, enter:\n\n```\ndocker image build -t nodetest\
    \ .\n```\n\nThe period at the end of the command is essential! Use `-f <file>`\
    \ if you didn’t name your build file “`Dockerfile`”.\n\nDocker creates a separate\
    \ (hidden) image at each build step (enter `docker image ls -a` to view them all).\
    \ This allows changes to be made more efficiently. For example, modifying the\
    \ `EXPOSE` port is instantaneous because none of the previous build steps need\
    \ to change. However, using a different `FROM` image would require a complete\
    \ rebuild.\n\nFor this reason, Dockerfile commands should be ordered from least\
    \ likely to most likely to change. In this case:\n\n1.  The starting image and\
    \ environment variables are set.\n\n2.  A home directory is created and the `node`\
    \ user is granted ownership.\n\n3.  The working directory and user is defined.\n\
    \n4.  `package.json` is copied from the host and npm dependencies are installed.\n\
    \n5.  The rest of the application files are copied from the host.\n\n6.  Port\
    \ 3000 is exposed on the host.\n\n7.  `npm start` is executed.\n\nAn interactive\
    \ container named `nodeapp` can now be started from this image:\n\n```\ndocker\
    \ run -it --rm --name nodeapp -p 3000:3000 nodetest\n```\n\nOpen [http://localhost:3000/](http://localhost:3000/)\
    \ in a browser to see “Hello from Docker!”\n\nThe container runs in production\
    \ mode. Any changes you make to `index.js` (or another application file) will\
