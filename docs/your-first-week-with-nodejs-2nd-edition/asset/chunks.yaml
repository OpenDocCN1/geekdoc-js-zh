    \ with Git:\n\n```\ngit clone -b starter https://github.com/sitepoint-editors/node-forms.git\
    \ node-forms-starter\ncd node-forms-starter\nnpm install\nnpm start\n```\n\n###\
    \ Repo Branches\n\nThe repo has two branches, `starter` and `master`. The `starter`\
    \ branch contains the minimum setup you need to follow this guide. The `master`\
    \ branch contains a full, working demo (link above).\n\nThere’s not *too much*\
    \ code in there. It’s just a bare-bones Express setup with [EJS templates](https://www.npmjs.com/package/ejs)\
    \ and error handlers:\n\n```\n// server.js\nconst path = require('path');\nconst\
    \ express = require('express');\nconst layout = require('express-layout');\n\n\
    const routes = require('./routes');\nconst app = express();\n\napp.set('views',\
    \ path.join(__dirname, 'views'));\napp.set('view engine', 'ejs');\n\nconst middlewares\
    \ = [\n  layout(),\n  express.static(path.join(__dirname, 'public')),\n];\napp.use(middlewares);\n\
    \napp.use('/', routes);\n\napp.use((req, res, next) => {\n  res.status(404).send(\"\
    Sorry can't find that!\");\n});\n\napp.use((err, req, res, next) => {\n  console.error(err.stack);\n\
    \  res.status(500).send('Something broke!');\n});\n\napp.listen(3000, () => {\n\
    \  console.log('App running at http://localhost:3000');\n});\n```\n\nThe root\
    \ url `/` simply renders the `index.ejs` view:\n\n```\n// routes.js\nconst express\
    \ = require('express');\nconst router = express.Router();\n\nrouter.get('/', (req,\
