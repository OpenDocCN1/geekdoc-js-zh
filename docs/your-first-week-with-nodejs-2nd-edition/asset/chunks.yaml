    \ JavaScript landscape without bumping into them. They can be used for anything\
    \ from bundling your JavaScript files and dependencies into static assets, to\
    \ running tests, or automatic code linting and style checking.\n\nWe have a wide\
    \ range of articles covering build tooling on SitePoint. Here’s a short selection\
    \ of my favorites:\n\n*   [A Beginner’s Guide to Webpack](https://www.sitepoint.com/webpack-beginner-guide/)\n\
