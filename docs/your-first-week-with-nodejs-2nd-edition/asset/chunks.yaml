- fmt: "\nIf you get an `address already in use` error, the chances are that you already\
    \ have a MongoDB or MySQL service running on the port in question. Try stopping\
    \ the service and re-running the `docker` command.\n\n## How to Launch a Node.js\
    \ Container\n\nRunning your Node.js application within a Docker container provides\
    \ a more consistent environment than your host PC. Presume we want to `Dockerize`\
    \ a simple Express.js application which shows a message when browsing to `http://localhost:3000/`.\
    \ The starting files:\n\n### package.json\n\n```\n{\n  \"name\": \"docker-test\"\
    ,\n  \"version\": \"1.0.0\",\n  \"description\": \"Docker test\",\n  \"main\"\
    : \"index.js\",\n  \"scripts\": {\n    \"start\": \"node ./index.js\",\n    \"\
    debug\": \"nodemon --inspect ./index.js\"\n  },\n  \"dependencies\": {\n    \"\
    express\": \"^4.17.1\"\n  },\n  \"devDependencies\": {\n    \"nodemon\": \"^2.0.2\"\
    \n  }\n}\n```\n\n### nodemon.json\n\n```\n{\n  \"script\": \"./index.js\",\n \
    \ \"ext\": \"js\",\n  \"ignore\": [\n    \".git/\",\n    \"node_modules/\"\n \
    \ ],\n  \"legacyWatch\": true,\n  \"delay\": 200,\n  \"verbose\": true\n}\n```\n\
    \n(Note that `legacyWatch` uses an older file-watching process which is more reliable\
    \ on most devices.)\n\n### index.js\n\n```\n'use strict';\nconst\n  port = 3000,\n\
    \  express = require('express'),\n  app = express();\n\napp.get('/', (req, res)\
    \ => {\n  res.send('Hello from Docker!');\n});\n\napp.listen(port, () =>\n  console.log(`server\
    \ running on port ${port}`)\n);\n```\n\nAn appropriate Node.js image can be selected\
    \ from the [Docker Hub](https://hub.docker.com/_/node). In general:\n\n*   most\
    \ images are large and require a 100MB+ download\n*   `alpine` images have the\
    \ smallest 5MB download, but may not provide some OS dependencies your application\
    \ requires\n*   `slim` images are are cut-down versions of the main Linux images,\
    \ which may be a reasonable pragmatic choice\n\nIn this case, we can use `lts-alpine`—the\
    \ smallest image with the most recent LTS (even-numbered) version of Node.js.\n\
    \nA `Dockerfile` defines the build steps required to create an image for the application.\
    \ Various [commands can be used](https://docs.docker.com/engine/reference/builder/),\
    \ including these:\n\n| command | description |\n| --- | --- |\n| `FROM` | build\
    \ the image from a [Docker hub](https://hub.docker.com/) starting image |\n| `ENV`\
    \ | set an environment variable |\n| `WORKDIR` | set a working directory |\n|\
    \ `USER` | set an active user |\n| `RUN` | execute an installation command, such\
    \ as `npm install` |\n| `COPY` | copy files from the host machine |\n| `EXPOSE`\
    \ | expose a port to the host |\n| `CMD` | the container launch command |\n\n\
    ### Dockerfile\n\n```\nFROM node:lts-alpine\n\nENV HOME=/home/node/app\nENV NODE_ENV=production\n\
    \nRUN mkdir -p $HOME && chown -R node:node $HOME\n\nWORKDIR $HOME\nUSER node\n\
    \nCOPY --chown=node:node package*.json $HOME/\nRUN npm i && npm cache clean --force\n\
    \nCOPY --chown=node:node . .\n\nEXPOSE 3000\n\nCMD npm start\n```\n\nThis example\
    \ presumes a production environment. However, we’ll override some settings on\
    \ the Docker command line and in Docker Compose during development.\n\nAlso create\
    \ a `.dockerignore` file to ensure non-essential files are not copied to the image:\n\
    \n### .dockerignore\n\n```\n.git\n.gitignore\n.config\n.npm\n.vscode\nnode_modules\n\
    ```\n\nTo build a new image named `nodetest`, from within the project root, enter:\n\
    \n```\ndocker image build -t nodetest .\n```\n\nThe period at the end of the command\
    \ is essential! Use `-f <file>` if you didn’t name your build file `Dockerfile`.\n\
    \nDocker creates a separate (hidden) image at each build step (enter `docker image\
    \ ls -a` to view them all). This allows changes to be made more efficiently. For\
    \ example, modifying the `EXPOSE` port is instantaneous because none of the previous\
    \ build steps need to change. However, using a different `FROM` image would require\
    \ a complete rebuild.\n\nFor this reason, Dockerfile commands should be ordered\
    \ from least likely to most likely to change. In this case:\n\n1.  The starting\
    \ image and environment variables are set.\n2.  A home directory is created and\
    \ the `node` user is granted ownership.\n3.  The working directory and user is\
    \ defined.\n4.  `package.json` is copied from the host and npm dependencies are\
    \ installed.\n5.  The rest of the application files are copied from the host.\n\
    6.  Port 3000 is exposed on the host.\n7.  `npm start` is executed.\n\nAn interactive\
    \ container named `nodeapp` can now be started from this image:\n\n```\ndocker\
    \ run -it --rm --name nodeapp -p 3000:3000 nodetest\n```\n\nOpen [http://localhost:3000/](http://localhost:3000/)\n\
    \n## Using Docker Compose During Development\n\nStarting containers individually\
    \ is awkward, especially when commands are so complex! Fortunately, Docker Compose\
    \ can manage any number of containers quickly.\n\nPresume we want to launch three\
    \ containers in development within a Docker network named `localnet`:\n\n1.  A\
    \ MySQL database container `mysql` saves data to a Docker volume `mysqldata` and\
    \ exposes port 3306.\n2.  The [Adminer database client](https://www.adminer.org/)\
    \ named `adminer` exposes the web application on port 8080.\n3.  The Node.js Express\
    \ application defined above runs nodemon and exposes port 3000.\n\nCreate a file\
    \ named `docker-compose.yml` in your project folder with the following content\
    \ (tabs are critical):\n\n```\nversion: '3'\n\nservices:\n\n  mysql:\n    environment:\n\
    \      - MYSQL_ROOT_PASSWORD=mysecret\n    image: mysql:8\n    container_name:\
    \ mysql\n    volumes:\n      - mysqldata:/var/lib/mysql\n    ports:\n      - \"\
    3306:3306\"\n    networks:\n      - localnet\n\n  adminer:\n    image: adminer\n\
    \    container_name: adminer\n    depends_on:\n      - mysql\n    ports:\n   \
    \   - \"8080:8080\"\n    networks:\n      - localnet\n\n  nodejs:\n    environment:\n\
    \      - NODE_ENV=development\n    build:\n      context: ./\n      dockerfile:\
    \ Dockerfile\n    container_name: nodejs\n    depends_on:\n      - mysql\n   \
    \ command: /bin/sh -c 'npm i && npm run debug'\n    volumes:\n      - ./:/home/node/app\n\
    \    ports:\n      - \"3000:3000\"\n    networks:\n      - localnet\n\nvolumes:\n\
    \  mysqldata:\n\nnetworks:\n  localnet\n```\n\nDocker Compose configurations can\
    \ use [many commands](https://docs.docker.com/compose/compose-file/), but this\
    \ example sets similar options to the Docker development CLI commands used above.\
    \ Notes:\n\n*   The `mysql volumes` setting uses a Docker volume, while `node\
    \ volumes` mounts the host’s file system (Docker Compose permits relative paths\
    \ references on any OS).\n*   [`depends_on`](https://docs.docker.com/compose/compose-file/#depends_on)\
    \ defines start-up dependences. In this case, `adminer` and `nodejs` start after\
    \ `mysql` has launched.\n"
