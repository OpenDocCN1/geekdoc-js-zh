  trans: "\n完成完成后，你可以访问 [`localhost`](http://localhost) 查看我们的代理运行情况。虽然你访问的是 NGINX\
    \ Web 服务器，但你将获得来自 Node.js 服务器的实际响应。\n\n## 端口 80\n\n你需要确保端口 80 上没有其他程序（如 Apache）在运行。\n\
    \n## 设置 SSL\n\n为了与用户的浏览器建立安全连接，我们需要获取一个数字证书。通常情况下，你可以从像 [Let’s Encrypt](https://letsencrypt.org/)\
    \ 这样的证书颁发机构获取证书。如果你选择 Let’s Encrypt 方案，请务必使用 [Certbot](https://certbot.eff.org/instructions)\
    \ 安装证书，它将为你负责重新配置 NGINX。\n\n对于本地开发（以及跟进本教程），你也可以[创建一个自签名证书](https://www.digitalocean.com/community/tutorials/how-to-create-a-ssl-certificate-on-nginx-for-ubuntu-12-04)。唯一的问题是，当有人访问你的网站时，浏览器会显示“证书不受信任”的警告。但在你的本地机器上进行测试，这是完全没问题的。\n\
    \n一旦你有了证书和私钥，就可以在 NGINX 中设置 SSL。你需要将我们之前的服务器块修改为如下内容：\n\n```\nserver {\n  listen\
    \       80;\n  listen       443 ssl;\n  server_name  localhost;\n\n  ssl_certificate\
    \  /etc/nginx/ssl/server.crt;\n  ssl_certificate_key /etc/nginx/ssl/server.key;\n\
    \n  location / {\n    proxy_pass http://localhost:3000;\n    proxy_http_version\
    \ 1.1;\n    proxy_set_header Upgrade $http_upgrade;\n    proxy_set_header Connection\
    \ 'upgrade';\n    proxy_set_header Host $host;\n    proxy_cache_bypass $http_upgrade;\n\
    \  }\n}\n```\n\n搞定！\n\n现在，如果你访问 [`localhost`](https://localhost)，你的连接将是安全的。上面的配置假设证书和私钥分别位于\
    \ `/etc/nginx/ssl/server.crt` 和 `/etc/nginx/ssl/server.key`，但你可以根据需要更改这些位置。\n\n\
    ## 额外福利：提供静态资源\n\n在我们的 Node.js 服务器前面设置 NGINX 的额外好处是，我们可以轻松地配置它来提供应用程序所需的任何静态资源。这将节省通过\
    \ Node 处理这些请求时所付的开销。\n\n要实现此点，我们需要在服务器配置中添加一个新的 `location` 块：\n\n```\nserver {\n\
    \  listen       80;\n  server_name  localhost;\n\n  location / {\n    ...\n  }\n\
    \n  location /public {\n    root /usr/local/var/www;\n  }\n}\n```\n\n在这个 `location`\
    \ 块内部，我们将根目录设置为 `/usr/local/var/www`，但如果你喜欢也可以选择不同的目录。结果是，当有类似 `http://localhost/public/somepath/file.html`\
    \ 的请求时，NGINX 将直接从 `/usr/local/var/www/public/somepath/file.html` 提供文件。\n\n## 结论\n\
    \n在本短教程中，我们学习了如何使用 NGINX 作为 Node.js 应用的反向代理并配置 SSL。通过使用 NGINX 处理静态资源，你还可以减轻 Node\
    \ 应用程序的负载。\n\n# 第 12 章：使用 Docker 进行 Node.js 开发\n\n### 作者：Craig Buckler\n\nNode.js\
    \ 很少孤立存在。你可能需要数据库、缓存、消息队列、反向代理、搜索、电子邮件路由、进程监控、其他语言运行时等！通过 Docker，在你的开发用 PC 上管理这些依赖项将变得简单得多。\n\
    \n本指南提供了 Docker 介绍。它侧重于 Node.js，但这些概念适用于任何开发语言或框架。\n\n## “这在我的机器上运行得好的！”\n\n想象一下你用\
    \ Node.js 和 MongoDB 数据库创建了一个非常棒的应用。它是如此成功，以至于不得不聘佣另一个开发者来添加新功能。他们克隆了仓库，运行 `npm\
    \ install && npm start`，砰的一声——失败了，并弹出一个模糊的错误信息。\n\n尽管初意良好，但你们的环境是不同的：\n\n- 你使用\
    \ Mac，他们使用 Windows\n- 你使用 Node.js v12 开发，但他们安装了 v10\n- 你正在使用 MongoDB v3.6，他们使用的是\
    \ v4.2\n\n你可能可以在几小时内解决这些问题，但必须永远保持每个依赖项的同步。随着团队的扩大，这可行吗？它与你的线上服务器兼容吗？\n\n## 虚拟机\n\
    \n虚拟机（VM）是一个模拟的计算机系统。它不是在硬件上安装操作系统（OS），而是在服务器硬件的软件仿真中运行的。跨平台虚拟机选项包括 [VMware](https://www.vmware.com/)\
    \ 和 [VirtualBox](https://www.virtualbox.org/)。\n\n你可以创建一个包含所有应用程序依赖项的 Linux 虚拟机，它可以在\
    \ Windows、macOS 或 Linux 上运行。每个开发者和线上服务器将拥有相同的环境。遗憾的是，虚拟机很快就会变得不实际：\n\n- 它们的磁盘镜像巨大且难以复制\n\
    - 单个虚拟机可以自动更新或由开发者更新，导致它与其他虚拟机不同步\n- 虚拟机需要大量的资源：一个完整的操作系统\n\n## Docker 概述\n\n\
    [Docker](https://www.docker.com/) 是一个允许你构建、共享和运行容器应用程序的平台。将容器想象成带有操作系统的虚拟机。\n\n\
    Docker 的优势包括：\n\n- 所有开发者可以在 macOS、Linux 上使用 Docker 镜像\n- 相同的容器可以在开发和生产环境中使用\n\
    - 应用程序的安装、配置和维护变得更容易\n- 开发者可以进行实验而不产生风险\n- 容器可以轻松扩展——例如增加 Node.js 进程\n\n容器是共享宿主机资源的轻量级进程。\n\
    \n## Docker 概念与术语\n\n初接触 Docker 可能有些，但理解一些概念有助于开发。\n\nDocker 是一个客户端服务器应用程序。服务器负责容器管理并通过\
    \ API 控制。命令行界面与 API 通信，因此可以在任何地方运行服务器。\n\n### 镜像\n\nDocker 镜像是文件系统和应用程序文件的快照。在某些情况下，你会直接从\
    \ [Docker Hub](https://hub.docker.com/) 使用镜像。它提供了广泛的热门应用程序包括 [MySQL](https://hub.docker.com/_mysql)\
    \ 和 [MongoDB](https://hub.docker.com/_mongo)。\n\nNode.js 应用通常会使用[基础 Node.js 镜像](https://hub.docker.com/_node)，通过\
    \ Dockerfile 配置，描述了所有的安装和执行步骤。生成的镜像配置可以推送到 Docker Hub。这在开发期间或其他人需要你的应用时是可能的。\n\
    \n### 容器\n\n容器是镜像的运行实例。可以从同一个镜像启动一个或多个容器，并在需要停止。\n\n默认情况下，停止的容器仍然可用并可以重启。但在开发过程中，通常在容器停止后将其删除是实际的。\n\
    \n重要的是，容器不保留状态。保在文件或数据库中的数据在容器重启时都会丢失。因此你需要卷。\n\n### 卷\n\nDocker 提供了两种存储类型来保留容器状态。\n"
- fmt: "\n## 1. Volumes\na Docker-managed file system\n\n## 2. Bind mounts\na file\
    \ or directory on the host machine. \n\nEither can be used to mount a directory\
    \ on the container, such as `/data/db` for MongoDB data storage.\n\nVolumes are\
    \ the recommended way to persist data. In some cases, they’re the only option.\
    \ MongoDB doesn’t currently support bind mounts on Windows and macOS hosts.\n\n\
    ## Networks\n\nA container can communicate with another using standard protocols\
    \ and ports within their own isolated network. Specific ports can be exposed to\
    \ other containers and the host machine as necessary.\n\nFor example, you could\
    \ have a Node.js application running on port `3000` of a `nodejs` container which\
    \ communicates with port `3306` of a `mysql` container. If both ports are exposed\
    \ to the host, the application can be launched from `http://localhost:3000/` and\
    \ MySQL clients can connect to `http://localhost:3306/`.\n\n## Docker Compose\n\
    \nDocker Compose is a tool for managing multiple containers with associated volumes\
    \ and networks. A single file named `docker-compose.yml` defines the configuration.\n\
    \n## Development and Production Environments\n\nDevelopment environments typically:\n\
    \n* set environment variables such as `NODE_ENV=development`\n* react to code\
    \ changes, perhaps autoloading using tools such as [nodemon](https://nodemon.io/)\n\
    * enable debugging messages and protocols\n* expose directories and ports so databases\
    \ and files can be inspected\n\nA live production server is more restricted and\
    \ has different scaling requirements, but Docker provides several opportunities:\n\
    \n1. Docker can launch (and restart) any number of Node.js application containers.\
    \ There’s no need to use [clustering](https://nodejs.org/dist/latest/docs/api/cluster.html)\
    \ or processing solutions such as [PM2](https://pm2.keymetrics.io/) and [forever](https://www.npmjs.com/package/forever).\n\
    2. Database containers can be solely used by the application. There are fewer\
    \ security and maintenance issues than a database shared by multiple applications.\n\
    3. Ports need only be exposed within the container network. Consider an NGINX\
    \ container used as a reverse proxy to a Node.js container which accesses a MySQL\
    \ container. Only the NGINX port need be exposed to the host (80 for HTTP or 443\
    \ for HTTPS). With two or more networks, it becomes possible to restrict MySQL\
    \ access to the Node.js container only.\n4. A production-specific Docker Compose\
    \ configuration can be developed. Alternative container management systems such\
    \ as [Docker Swarm](https://docs.docker.com/engine/swarm/swarm-tutorial/), [Kubernetes](https://kubernetes.io/),\
    \ or [AWS Fargate](https://aws.amazon.com/fargate/) can also be adopted.\n\nDeploying\
    \ containers to production servers has benefits, but it’s not absolutely necessary.\
    \ Perhaps your host doesn’t support Docker or you prefer cloud-based services\
    \ to locally installed databases? In that situation, Docker can still be used\
    \ during development with a configuration which closely matches the production\
    \ system.\n\n## How to Install Docker\n\nInstructions for installing the latest\
    \ version of Docker on Linux are available on [Docker Docs](https://docs.docker.com/install/linux/docker-ce/ubuntu/).\
    \ You can also use official repositories, although these are likely to have older\
    \ editions. For example, on Ubuntu:\n\n```\nsudo apt-get update\nsudo apt-get\
    \ remove docker docker-engine docker.io\nsudo apt install docker.io\nsudo systemctl\
    \ start docker\nsudo systemctl enable docker\n```\n\nDocker Compose is [installed\
    \ separately](https://docs.docker.com/compose/install/) on Linux:\n\n```\nsudo\
    \ curl -L \"https://github.com/docker/compose/releases/download/<VERSION>/docker-compose-$(uname\
    \ -s)-$(uname -m)\" -o /usr/local/bin/docker-compose\nsudo chmod +x /usr/local/bin/docker-compose\n\
    ```\n\nHere, `<VERSION>` is the [latest release number](https://docs.docker.com/compose/releases)—such\
    \ as `1.25.3`.\n\nInstallation will vary across editions of Linux. *Search the\
    \ web for appropriate instructions.*\n\n[Docker CE Desktop for macOS Sierra 10.12\
    \ and above](https://hub.docker.com/editions/community/docker-ce-desktop-mac)\
    \ and [Docker CE Desktop for Windows 10 Professional](https://hub.docker.com/editions/community/docker-ce-desktop-windows)\
    \ are available as installable packages which contain both Docker and Docker Compose.\
    \ You must register at [Docker Hub](https://hub.docker.com) and sign in to download.\n\
    \nDocker on Windows 10 uses the [Hyper-V virtualization platform](https://docs.microsoft.com/en-us/virtualization/hyper-v-on-windows/),\
    \ which you can enable from **Turn Windows features on or off** in **Programs\
    \ and Features** from the Control Panel. Docker can also use the [Windows Subsystem\
    \ for Linux 2](https://docs.microsoft.com/en-us/windows/wsl/wsl2-index) (WSL2—*currently\
    \ in beta for Windows Insider users*).\n\nTo ensure Docker can access the Windows\
    \ file system, choose **Settings** from the Docker tray icon menu, navigate to\
    \ the **Shared Drives** pane, and select which drives the server is permitted\
    \ to use.\n\n### Windows 10 Home\n\nIf you’re running Windows 10 Home, check out\
    \ our article [How to Install Docker on Windows 10 Home](https://www.sitepoint.com/docker-windows-10-home/).\n\
    \nCheck Docker has successfully installed by entering `docker version` at your\
    \ command prompt. Optionally, try `docker version` to verify.\n\n## Permission\
    \ Errors\n\nOn Linux, if you experience a `permission denied while trying to connect\
    \ to the Docker daemon` error, you can remedy this as follows:\n\n```\nsudo groupadd\
    \ docker\nsudo usermod -aG docker $USER\n```\n\nThen reboot your machine.\n\n\
    ## How to Launch Database Container\n\nEnter the following command to launch MongoDB:\n\
    \n```\ndocker run -d --rm --name mongodb -p 27017:27017 --mount \"src=mongodata,target=/data/db\"\
    \ mongo:4\n```\n\nThe first time you run this command, Docker downloads and initializes\
    \ MongoDB which can take a few minutes. Any MongoDB client can now connect to\
    \ `localhost:27017` (no user ID or password is necessary). Alternatively, connect\
    \ directly to the container shell from another terminal:\n\n```\ndocker exec -it\
    \ mongodb sh\n```\n\nStart the MongoDB command line:\n\n```\nmongo\n```\n\nThen\
    \ run any database commands. For example:\n\n```\ntest;\ndb.apps.insertOne({ name:\
    \ 'Docker' });\ndb.apps.find();\n```\n\nType `exit` to quit the MongoDB client,\
    \ then `exit` again to quit the shell.\n\nList running containers with:\n\n```\n\
    docker container ls\n```\n\nTo stop and remove the MongoDB container, enter:\n\
    \n```\ndocker container stop mongodb\n```\n\nSimilarly, you can start a MySQL\
    \ 8 container using:\n\n```\ndocker run -d --rm --name mysql -p 3306:3306 --mount\
    \ \"src=mysqldata,target=/var/lib/mysql\" -e MYSQL_ROOT_PASSWORD=mysecret mysql:8\n\
    ```\n\nOnce it has launched (which can take several minutes), use any MySQL client\
    \ to connect to `localhost:3306` with the user ID `root` and password `mysecret`.\
    \ for example:\n\n```\ndocker exec -it mysql sh\nmysql -u root -pmysecret\n```\n\
    \nThe MySQL container can be stopped with:\n\n```\ndocker container stop mysql\n\
    ```\n\n#### Address Already in Use\n"
  raw: '1.  **Volumes**: a Docker-managed file system


    2.  **Bind mounts**: a file or directory on the host machine.


    Either can be used to mount a directory on the container, such as `/data/db` for
    MongoDB data storage.


    Volumes are the recommended way to persist data. In some cases, they’re the only
    option. MongoDB doesn’t currently support bind mounts on Windows and macOS hosts.


    ### Networks


    A container can communicate with another using standard protocols and ports within
    their own isolated network. Specific ports can be exposed to other containers
    and the host machine as necessary.


    For example, you could have a Node.js application running on port 3000 of a `nodejs`
    container which communicates with port `3306` of a `mysql` container. If both
    ports are exposed to the host, the application can be launched from `http://localhost:3000/`
    and MySQL clients can connect to `http://localhost:3306/`.


    ### Docker Compose


    Docker Compose is a tool for managing multiple containers with associated volumes
    and networks. A single file named `docker-compose.yml` defines the configuration.


    ### Development and Production Environments


    Development environments typically:


    *   set environment variables such as `NODE_ENV=development`


    *   react to code changes, perhaps autoloading using tools such as [nodemon](https://nodemon.io/)


    *   enable debugging messages and protocols


    *   expose directories and ports so databases and files can be inspected


    A live production server is more restricted and has different scaling requirements,
    but Docker provides several opportunities:


    1.  Docker can launch (and restart) any number of Node.js application containers.
    There’s no need to use [clustering](https://nodejs.org/dist/latest/docs/api/cluster.html)
    or processing solutions such as [PM2](https://pm2.keymetrics.io/) and [forever](https://www.npmjs.com/package/forever).


    2.  Database containers can be solely used by the application. There are fewer
    security and maintenance issues than a database shared by multiple applications.


    3.  Ports need only be exposed within the container network. Consider an NGINX
    container used as a reverse proxy to a Node.js container which accesses a MySQL
    container. Only the NGINX port need be exposed to the host (80 for HTTP or 443
    for HTTPS). With two or more networks, it becomes possible to restrict MySQL access
    to the Node.js container only.


    4.  A production-specific Docker Compose configuration can be developed. Alternative
    container management systems such as [Docker Swarm](https://docs.docker.com/engine/swarm/swarm-tutorial/),
    [Kubernetes](https://kubernetes.io/), or [AWS Fargate](https://aws.amazon.com/fargate/)
    can also be adopted.


    Deploying containers to production servers has benefits, but it’s not absolutely
    necessary. Perhaps your host doesn’t support Docker or you prefer cloud-based
    services to locally installed databases? In that situation, Docker can still be
    used during development with a configuration which closely matches the production
    system.


    ### How to Install Docker


    Instructions for installing the latest version of Docker on Linux are available
    on [Docker Docs](https://docs.docker.com/install/linux/docker-ce/ubuntu/). You
    can also use official repositories, although these are likely to have older editions.
    For example, on Ubuntu:


    ```

    sudo apt-get update

    sudo apt-get remove docker docker-engine docker.io

    sudo apt install docker.io

    sudo systemctl start docker

    sudo systemctl enable docker

    ```


    Docker Compose is [installed separately](https://docs.docker.com/compose/install/)
    on Linux:


    ```

    sudo curl -L "https://github.com/docker/compose/releases/download/<VERSION>/docker-compose-$(uname
    -s)-$(uname -m)" -o /usr/local/bin/docker-compose

    sudo chmod +x /usr/local/bin/docker-compose

    ```


    Here, `<VERSION>` is the [latest release number](https://github.com/docker/compose/releases)—such
    as `1.25.3`.


    Installation will vary across editions of Linux. *Search the web for appropriate
    instructions.*


    [Docker CE Desktop for macOS Sierra 10.12 and above](https://hub.docker.com/editions/community/docker-ce-desktop-mac)
    and [Docker CE Desktop for Windows 10 Professional](https://hub.docker.com/editions/community/docker-ce-desktop-windows)
    are available as installable packages which contain both Docker and Docker Compose.
    You must register at [Docker Hub](https://hub.docker.com) and sign in to download.


    Docker on Windows 10 uses the [Hyper-V virtualization platform](https://docs.microsoft.com/en-us/virtualization/hyper-v-on-windows/),
    which you can enable from **Turn Windows features on or off** in **Programs and
    Features** from the Control Panel. Docker can also use the [Windows Subsystem
    for Linux 2](https://docs.microsoft.com/en-us/windows/wsl/wsl2-index) (WSL2—*currently
    in beta for Windows Insider users*).


    To ensure Docker can access the Windows file system, choose **Settings** from
    the Docker tray icon menu, navigate to the **Shared Drives** pane, and select
    which drives the server is permitted to use.


    #### Windows 10 Home


    If you’re running Windows 10 Home, check out our article [How to Install Docker
    on Windows 10 Home](https://www.sitepoint.com/docker-windows-10-home/).


    Check Docker has successfully installed by entering `docker version` at your command
    prompt. Optionally, try `docker run hello-world` to verify Docker can pull images
    and start containers as expected.


    ### Permission Errors


    On Linux, if you experience a `permission denied while trying to connect to the
    Docker daemon` error, you can remedy this as follows:


    ```

    sudo groupadd docker

    sudo usermod -aG docker $USER

    ```


    Then reboot your machine.


    You can find [more details in this Stack Overflow question](https://stackoverflow.com/questions/48957195/how-to-fix-docker-got-permission-denied-issue).


    ## How to Launch a Database Container


    Enter the following command in your terminal to launch a MongoDB container:


    ```

    docker run -d --rm --name mongodb -p 27017:27017 --mount "src=mongodata,target=/data/db"
    mongo:4

    ```


    The first time you run this command, Docker downloads and initializes the latest
    MongoDB 4 image which can take a few minutes. The [command line switches](https://docs.docker.com/engine/reference/commandline/run/)
    include:


    | switch | description |


    | --- | --- |


    | `-d` | run a container as a background process |


    | `-it` | run in interactive mode; you’ll see an activity log |


    | `--rm` | remove the container after it stops |


    | `--name` | a name given to the container (a random GUID is used otherwise) |


    | `-p` | map a host port to a container port |


    | `--mount` | create a persistent Docker-managed volume to retain data |


    | `-e` | define one or more environment variables |


    | `--env-file` | read environment variables from a file |


    | `--entrypoint` | overrides the default starting application |


    Any MongoDB client can now connect to `localhost:27017` (no user ID or password
    is necessary). Alternatively, connect directly to the container shell from another
    terminal:


    ```

    docker exec -it mongodb sh

    ```


    Start the MongoDB command line:


    ```

    mongo

    ```


    Then run any database commands. For example:


    ```

    use test;

    db.apps.insertOne({ name: ''Docker'' });

    db.apps.find();

    ```


    Type `exit` to quit the MongoDB client, then `exit` again to quit the shell.


    List running containers with:


    ```

    docker container ls

    ```


    To stop and remove the MongoDB container, enter:


    ```

    docker container stop mongodb

    ```


    Similarly, you can start a MySQL 8 container using:


    ```

    docker run -d --rm --name mysql -p 3306:3306 --mount "src=mysqldata,target=/var/lib/mysql"
    -e MYSQL_ROOT_PASSWORD=mysecret mysql:8

    ```


    Once it has launched (which can take several minutes), use any MySQL client to
    connect to `localhost:3306` with the user ID `root` and password `mysecret`. for
    example:


    ```

    docker exec -it mysql sh

    mysql -u root -pmysecret

    ```


    The MySQL container can be stopped with:


    ```

    docker container stop mysql

    ```


