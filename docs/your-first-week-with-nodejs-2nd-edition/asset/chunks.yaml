    There are other test doubles as well that do things like provide feedback about
    the return values of code while it’s running. Some testing frameworks come with
    the ability to define many types of test doubles, or can be extended to include
    more than you get by default. Once you dive into the world of software testing,
    you may be amazed to discover what’s possible.


    You could try writing all the tools to handle these testing needs yourself, or
    you could opt for an off-the-shelf testing framework with all the bells and whistles.
    So let’s talk about some of the options you have in the Node world.


    ## Frameworks for Automated Testing


    Once we decide that we need to graduate from the built-in `assert` functionality
    of Node and start using a dedicated testing framework, we’re presented with a
    wide range of options. And there’s a lot of overlap across the various options,
    since they all do similar things in slightly different ways to suit different
    types of development. We can consider these in terms of their superlatives.


    ### Jasmine is the Oldest


    Dating back to the pre-2010 days when JavaScript was primarily known as a browser-based,
    front-end development solution, [Jasmine](https://jasmine.github.io/) has a long
    history of bringing behavior-driven development to the community. It’s kept up
    well with the Node ecosystem, and remains a viable option.


    Jasmine works great standalone, but you’ll need to rely on a separate test runner
    like [Karma](https://karma-runner.github.io/2.0/index.html) for deeper automation
    of test suites. It’s battle-tested and well documented, so you can usually find
    help when you need it.


    ### Jest is the Most Popular


    One of the fastest ways to get started testing your Node apps these days is with
    [Jest](https://jestjs.io/), which is a relative newcomer to the Node testing scene.
    Its fast rise to popularity may be due to its roots in the Facebook engineering
    community, where [React](https://reactjs.org/) came from, and its associated ease
    of use for both server- and client-side React development.


    If you’re an old-school JavaScript developer familiar with tools like Jasmine,
    you might notice a lot of similarities, since Facebook used Jasmine as a foundation
    when they built Jest. But Jest has been completely reworked from the inside out
    to provide faster, cleaner, and easier-to-manage tests.


    ### Mocha/Chai is the Most Comprehensive


    While [Mocha](https://mochajs.org/) requires more configuration than some other
    solutions, and can take advantage of Node’s built in `assert` method, it also
    has access to a wider toolset when paired with the [Chai](https://www.chaijs.com/)
    library of assertions. Because it’s been around longer and has a well-supported
    suite of potential plugins, it may be the most versatile testing option.


    Mocha relies on you to tell it what you need it to do to support all the features
    and behaviors you may desire. In exchange, it gives you access to a wide range
    of plugins and extensions that can grow with you as your testing needs mature,
    as well as a deep community of users to call on if you need help.


    ### Cypress is the Newest


    Taking advantage of the end-to-end nature of modern Node development, [Cypress](https://www.cypress.io/)
    provides an integrated way to test your application from the back end to the browser.
    Cypress does away with older tools like Selenium to check what’s happening on
    the front end, and it’s built on top of Mocha and Chai.


    Cypress [has been criticized](https://help.testim.io/docs/why-not-cypress) for
    trying to control everything in JavaScript at a potential cost to its versatility,
    and carrying forward some baggage from older legacy JavaScript apis. That may
    or may not be an issue for most use cases, and it’s being actively developed and
    supported, so it’s definitely an option worth checking out.


    ## Get Started Now


    Testing can seem like an unwelcome intrusion on your work if you haven’t done
    it before. That’s true whether you’re a web development pioneer from the days
    when the idea of using JavaScript on the server seemed bizarre, or a fresh-faced
    explorer born into a world already used to the convenience of Node’s single-language,
    end-to-end development.


    But any amount of testing is better than nothing. You wouldn’t stroll casually
    out onto a frozen lake without at least poking the ice ahead of you with a toe
    to see if it’s thick enough to keep you from falling in. Doesn’t your application
    deserve at least as much care?


    No matter how big and unwieldy your code is now, it’s never a bad time to start
    writing tests. Write a few tests for every new piece of functionality you add.
    Write some tests to verify the most critical behaviors so you can be reassured
    that they won’t break as your code evolves. Start out just using `assert` in a
    flat file right now if that’s all you have. You can always refactor into something
    more sophisticated when you need it. Just get started!


    # Chapter 10: How to Use SSL/TLS with Node.js


    ### by Florian Rappl and Almir Bijedic


    In 2020, there’s no reason for your website not to use HTTPS. Visitors expect
    it, Google uses it as a ranking factor and browser makers will happily name and
    shame those sites not using it.


    In this tutorial, I’ll walk you through a practical example of how to add a [Let’s
    Encrypt](https://letsencrypt.org/)–generated certificate to your Express.js server.


    But protecting our sites and apps with HTTPS isn’t enough. We should also demand
    encrypted connections from the servers we’re talking to. We’ll see that possibilities
    exist to activate SSL/TLS even it’s not enabled by default.


    #### SSL with NGINX


    If you’re looking for instructions on how to set up SSL with NGINX when configuring
    it as a reverse proxy for a Node app, check out our quick tip, “[Configuring NGINX
    and SSL with Node.js](https://www.sitepoint.com/configuring-nginx-ssl-node-js/)”.


    ## HTTPS Everywhere


    [The HTTP/2 specification](https://en.wikipedia.org/wiki/HTTP/2) was published
    as RFC 7540 in May 2015, which means at this point it’s a part of the standard.
    This was a major milestone. Now we can all upgrade our servers to use HTTP/2.
    One of the most important aspects is the backwards compatibility with HTTP 1.1
    and the negotiation mechanism to choose a different protocol. Although the standard
    doesn’t specify encryption, currently no browser supports HTTP/2 unencrypted.
    This gives HTTPS another boost. Finally we’ll get HTTPS everywhere!


    What does our stack actually look like? From the perspective of a website running
    in the browser (at the application level) we have to traverse the following layers
    to reach the IP level:


    1.  Client browser

    2.  HTTP

    3.  SSL/TLS

    4.  TCP

    5.  IP


    HTTPS is nothing more than the HTTP protocol on top of SSL/TLS. Hence all of HTTP’s
    rules still apply. What does this additional layer actually give us? There are
    multiple advantages: we get authentication by having keys and certificates; a
    certain kind of privacy and confidentiality is guaranteed, as the connection is
    encrypted in an asymmetric manner; and data integrity is also preserved, as transmitted
    data can’t be changed during transit.


    One of the most common myths is that using SSL/TLS is computationally expensive
    and slows the server down. This is certainly not true anymore. We also don’t need
    any specialized hardware with cryptography units. Even for Google, [the SSL/TLS
    layer accounts for less than 1% of the CPU load and the network overhead of HTTPS
    as compared to HTTP is below 2%](https://www.imperialviolet.org/2010/06/25/overclocking-ssl.html).
    All in all, it wouldn’t make sense to forgo HTTPS for the sake of a little overhead.


    As Ilya Grigorik puts it, there is but one performance problem:


    > TLS has exactly one performance problem: it is not used widely enough. Everything
    else can be optimized.

