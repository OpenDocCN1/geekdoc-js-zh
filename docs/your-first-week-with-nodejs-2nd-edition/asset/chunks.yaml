  trans: "\n\n在继续之前，请确保你已经停止了所有运行中的容器。建议通过运行以下命令来删除现有的镜像、容器和网络，以确保你的系统是干净的：\n\n```\n\
    docker system prune -af\n```\n\n现在可以通过输入以下命令启动所有三个容器：\n\n```\ndocker-compose up\n\
    ```\n\n大搞定。第一次运行将需要一些时间，因为需要下载并构建镜像，但所有消息都会记录在终端中。\n\n你现在可以通过 [`localhost:3000/`](http://localhost:3000/)\
    \ 访问 Node.js Web 服务。当 `index.js` 被修改时，Nodemon 会自动重启应用程序。\n\n你可以使用任何 MySQL 客户端连接到\
    \ `localhost:3306` 数据库。或者，在浏览器中打开 [`localhost:8080/`](http://localhost:8080/)\
    \ 中的 Adminer，并使用凭据访问数据库：\n\n- 系统：`MySQL`\n- 服务器：`mysql`\n- 用户名：`root`\n- 密码：`mysecret`\n\
    \n可以通过另一个终端使用以下命令访问任何容器 shell：\n\n```\ndocker-compose exec <name> sh\n```\n\n\
    在这里，`<name>` 是容器名称（`nodejs`、`mysql` 或 `adminer`）。\n\n任务完成后，在 `docker-compose`\
    \ 终端中按下 `Ctrl` / `Cmd` + `C`，所有三个容器将优雅地关闭并自动删除。后续运行 `docker-compose up` 几乎是瞬间完成的。\n\
    \n## 在生产环境中使用 Docker Compose\n\n生产环境可以使用类似的 Docker Compose 配置。主要区别在于：\n\n- 应用程序应以生产模式运行（我们的\
    \ `Dockerfile` 默认如此）。\n- 不需要像 Adminer 等开发类应用程序。（诚然，它们在直播服务器上可能有用，但它们会增加安全性和人为错误风险！）\n\
    - 为了额外的安全，像 MySQL `3306` 等端口只需要在 Docker 网络内部暴露，而不是在宿主机上暴露。使用更强的密码或 `.env` 文件也大益！\n\
    - 可以添加容器 [`restart`](https://docs.docker.com/compose/compose-file/#restart) 类似的生产选项。\n\
    \n为生产环境创建一个新的 Docker Compose 文件——即 `docker-compose-production.yml`：\n\n```\nversion:\
    \ '3'\n\nservices:\n\n  mysql:\n    environment:\n      - MYSQL_ROOT_PASSWORD=mysecret\n\
    \    image: mysql:8\n    container_name: mysql\n    volumes:\n      - mysqldata:/var/lib/mysql\n\
    \    ports:\n      - \"3306\"\n    networks:\n      - localnet\n    restart: on-failure\n\
    \n  nodejs:\n    build:\n      context: ./\n      dockerfile: Dockerfile\n   \
    \ container_name: nodejs\n    depends_on:\n      - mysql\n    ports:\n      -\
    \ \"3000:3000\"\n    restart: on-failure\n\nvolumes:\n  mysqldata:\n\nnetworks:\n\
    \  localnet:\n```\n\n现在可以将 Docker 容器作为后台服务在生产服务器上启动：\n\n```\n docker-compose -f\
    \ .\\docker-compose-production.yml up -d\n```\n\n理想情况下，你还需要一个如 [NGINX](https://www.nginx.com/)\
    \ 这样的前端 Web 服务器作为 Node.js 应用程序的启用 SSL 的反向代理，但它可以安装在宿主机上或作为[另一个容器](https://hub.docker.com/_/nginx)。\n\
    \n停止容器请输入：\n\n```\ndocker-compose stop\n```\n\n## 清理\n\nDocker 可能会占用大量的磁盘空间：输入\
    \ `docker system df` 查看使用统计信息。\n\n要清理停止的容器以及悬空的镜像、卷和未与任何容器关联的网络，请输入：\n\n```\n\
    docker system prune\n```\n\n添加 `-a` 来移除镜像，或使用 `-af` 同时包含容器和网络。\n\n可以使用 `docker\
    \ volume prune -f` 删除所有卷，但请记住在此之前备份你需要的任何数据！\n\n## 下一步\n\nDocker 是一个复杂的课题，但本指南涵盖了\
    \ Node.js 开发的核心内容。然而，虽然上面的示例启动了 Node.js 和数据库容器，但应用程序在任何时候都没有访问或使用数据库！\n\n这是第 5\
    \ 章的主题。你将发现：\n\n1. 为什么 Web 应用程序需要数据库\n2. SQL 和 NoSQL 数据库之间的区别和优势\n3. 如何使用 MongoDB、MySQL\
    \ 和 Sequelize ORM 编写 Node.js 应用程序。\n\n"
