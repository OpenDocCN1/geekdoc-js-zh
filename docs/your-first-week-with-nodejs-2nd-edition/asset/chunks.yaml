    \ Container\n\nRunning your Node.js application within a Docker container provides\
    \ a more consistent environment than your host PC. Presume we want to *Dockerize*\
    \ a simple Express.js application which shows a message when browsing to `http://localhost:3000/`.\
    \ The starting files:\n\n**package.json**\n\n```\n{\n  \"name\": \"docker-test\"\
    ,\n  \"version\": \"1.0.0\",\n  \"description\": \"Docker test\",\n  \"main\"\
    : \"index.js\",\n  \"scripts\": {\n    \"start\": \"node ./index.js\",\n    \"\
    debug\": \"nodemon --inspect ./index.js\"\n  },\n  \"dependencies\": {\n    \"\
