  trans: "\n\n最新版本是 TLS 1.3。`TLS` 是 `SSL` 的继任者，后者在其最新版本 `SSL 3.0` 中可用。从 `SSL` 到 `TLS`\
    \ 的变化使得两者无法互操作，但基本流程保持不变。我们有三种不同的加密通道。第一个是用于证书链的公密钥基础设施。第二个提供用于密钥交换的公钥加密。最后，第三个是对称加密。这里我们有了数据传输的加密。\n\
    \n`TLS 1.3 在一些重要操作中使用哈希算法。理论上讲，可以使用任何哈希算法，但强烈建议使用 `SHA2` 或更强的算法。`SHA1` 长期以来一直是标准，但最近已经过时。\n\
    \n`HTTPS` 也受到客户端越来越多的关注。隐私和安全问题一直存在，但随着在线可访问数据和服务的增长，人们变得越来越关注。对于那些没有实现该协议的网站，有一个非常有用的浏览器扩展——[EFF\
    \ 提供的 HTTPS Everywhere](https://www.eff.org/https-everywhere)，它可以加密我们与大多数网站的通信。\n\
    \n![HTTPS-everywhere](img/https-everywhere.png)\n\n创建者意识到许多网站仅部分提供 `HTTPS`。该插件允许我们对那些仅提供部分\
    \ `HTTPS` 支持的网站重写请求。或者，我们也可以完全阻止 `HTTP`（见上面的截图）。\n\n## 基本通信\n\n证书的验证过程涉及验证证书签名和过期时间。我们还需要验证它是否链到一个受信任的根证书。最后，我们需要检查它是否被撤销。世界上有专门的受信任机构来授予证书。如果这些机构中的一个遭到破解，来自该机构的所有其他证书都将被撤销。\n\
    \n`HTTPS` 握手的序列图所示。我们从客户端的初始化开始，随后是带有证书和密钥交换的消息。在服务器发送其完成的数据包后，客户端可以开始密钥交换和密码套规范传输。此时，客户端已完成。最后，服务器确认密码套规范的选择并关闭握手。\n\
    \n![HTTPS-sequence](img/sequence.png)\n\n整个序列是独立于 `HTTP` 触发。如果我们决定使用 `HTTPS`，只有套接字（socket）处理发生了变化。客户端仍然发出\
    \ `HTTP` 请求，但套接字将执行之前描述的握手并加密内容（头部和正文）。\n\n那么，我们需要什么来让 `SSL/TLS` 在 `Express.js`\
    \ 服务器上工作？\n\n## HTTPS\n\n默认情况下，`Node.js` 通过 `HTTP` 提供服务。但我们必须使用 [HTTPS 模块](https://nodejs.org/api/https.html)\
    \ 来与客户端通过安全通道进行通信。这是一个内置模块，用法与我们使用 `HTTP` 模块的方式非常相似：\n\n```\nconst https = require(\"\
    https\"),\n  fs = require(\"fs\");\n\nconst options = {\n  key: fs.readFileSync(\"\
    /srv/www/keys/my-site-key.pem\"),\n  cert: fs.readFileSync(\"/srv/www/keys/chain.pem\"\
    )\n};\n\nconst app = express();\n\napp.use((req, res) => {\n  res.writeHead(200);\n\
    \  res.end(\"hello world\\n\");\n});\n\napp.listen(8000);\n\nhttps.createServer(options,\
    \ app).listen(8080);\n```\n\n暂时忽略 `/srv/www/keys/my-site-key.pem` 和 `/srv/www/keys/chain.pem`\
    \ 文件。这些是我们需要生成的 `SSL` 证书，我们稍后会进行。这是随着 Let’s Encrypt 变化的部分。以前，我们必须生成私钥/公钥对，将其发送给受信任机构，付费并可能需要等待一段时间才能获得\
    \ `SSL` 证书。现在，Let’s Encrypt 免费生成并验证你的证书！\n\n## 生成证书\n\n### Certbot\n\n`TLS` 规范要求一个证书，该证书由受信任的证书颁发机构\
    \ (`CA`) 签名。CA 确保证书持有者确实是其声称的。所以基本上当你看到绿色锁图标（或浏览器 URL 左侧的任何绿色标志）时，意味着你与之通信的服务器确实是其声称的。如果你在\
    \ `facebook.com` 上并看到绿色锁，几乎可以确定你确实在和 Facebook 通，没有其他人可以看到你的通信——或者说，没有其他人可以读取它。\n\
    \n值得注意的是，此证书并不一定由 Let’s Encrypt 这样的机构验证。还有其他付费服务。[从技术上你可以自己签名](https://stackoverflow.com/q/10175812)，但这样（因为你不是受信任的\
    \ `CA`）访问你网站的用户可能会看到巨大的、吓人的警告，建议他们返回安全区域。\n\n在接下来的示例中，我们将使用 `Certbot`，它用于使用 Let’s\
    \ Encrypt 生成和管理证书。在 [Certbot 网站](https://certbot.eff.org/) 上，你可以找到几乎任何操作系统/服务器组合安装\
    \ `Certbot` 的说明。你应该选择适用于你的选项。\n\n部署 Node 应用的常用组合是在最新的 LTS 版本 `Ubuntu` 上运行 `NGINX`，这就是我在这里将使用的。\n\
    \n```\nsudo apt-get update\nsudo apt-get install software-properties-common\n\
    sudo add-apt-repository universe\nsudo add-apt-repository ppa:certbot/certbot\n\
    sudo apt-get update\n```\n\n#### Webroot\n\n[Webroot 是一种](https://certbot.eff.org/docs/using.html#webroot)，除了\
    \ Certbot 默认方式（将某些验证代码放入名为 `.well-known` 的隐藏目录）外，还会将证书复制到你的 webroot。为了手动跳过其中的一些步骤，我们将使用它：\n\
    \n```\ncertbot certonly --webroot -w /var/www/example/ -d www.example.com -d example.com\n\
    ```\n\n你可能需要以 sudo 身份运行此命令，因为它会尝试写入 `/var/log`。系统还会要求你输入电子邮件地址。建议填写一个你经常使用的真实地址，因为如果证书即将过期，你会收到通知。Let’s\
    \ Encrypt 颁发免费证书的代价是它的有效期为三个月。幸运的是，续期就像运行一个简单的命令一样容易，我们可以将其[分配给 cron 任务](https://www.howogeek.com/101288/how-to-schedule-tasks-on-linux-an-introduction-crontab-files/)然后无需担心过期。此外，更新\
    \ `SSL` 证书是一种良好的安全实践，因为这减少了攻击者破解加密的时间。有时开发者甚至会将此 cron 设置每天运行一次，这是完全可以的也是推荐的。\n\
    \n请记住，你必须在 `-d`（域名）标志指定的域名解析到的服务器上运行此命令——即你的生产服务器。即使你在本地 hosts 文件中设置了 DNS 解析，这起不起作用，因为域名将从外部进行验证。所以，如果你在本地进行此操作，很可能会失败，除非你从本地机器向外部开放了端口，并让它运行在一个解析到你机器的域名之后。这是一种极罕见的情况。\n\
    \n最后，运行此命令后，输出将包含私钥和证书文件的路径。将这些值复制到之前的代码段中——到 `cert` 属性用于证书，到 `key` 属性用于密钥：\n\n\
    ```javascript\n// ...\n\nconst options = {\n  key: fs.readFileSync(\"/var/www/example/sslcert/privkey.pem\"\
    ),\n  cert: fs.readFileSync(\"/var/www/example/sslcert/fullchain.pem\") // 这些路径可能与你处的不同，请确保从\
    \ certbot 输出中复制\n};\n\n// ...\n```\n\n"
- fmt: "\n# Tighetning It Up\n\n## HTTP Strict Transport Security\n\nHave you ever\
    \ had a website where you switched from HTTP to HTTPS and there were some residual\
    \ redirects still redirecting to HTTP? [HTTP Strict Transport Security](https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security)\
    \ (HSTS) is a web security policy mechanism to mitigate protocol downgrade attacks\
    \ and cookie hijacking.\n\nHSTS effectively forces the client (browser accessing\
    \ your server) to direct all traffic through HTTPS—a “secure or not at all” ideology!\n\
    \nExpress JS doesn’t allow us to add this header by default, so we’ll use [Helmet](https://www.npmjs.com/package/helmet),\
    \ a Node module that allows us to do this. Install `Helmet` by running the following:\n\
    \n```\nnpm install helmet\n```\n\nThen we just have to add it as a middleware\
    \ to our Express server:\n\n```\nconst https = require(\"https\"),\n  fs = require(\"\
    fs\"),\n  helmet = require(\"helmet\");\n\nconst options = {\n  key: fs.readFileSync(\"\
    /srv/www/keys/my-site-key.pem\"),\n  cert: fs.readFileSync(\"/srv/www/keys/chain.pem\"\
    )\n};\n\nconst app = express();\n\napp.use(helmet()); // Add Helmet as a middleware\n\
    \napp.use((req, res) => {\n  res.writeHead(200);\n  res.end(\"hello world\\n\"\
    );\n});\n\napp.listen(8000);\n\nhttps.createServer(options, app).listen(8080);\n\
    ```\n\n### Diffie–Hellman Strong(er) Parameters\n\nIn order to skip some complicated\
    \ math, let’s cut to the chase. In very simple terms, there are two different\
    \ keys used for encryption: the certificate we get from the certificate authority,\
    \ and one that’s generated by the server for key exchange. The default key for\
    \ key exchange (also called [Diffie–Hellman key exchange](https://en.wikipedia.org/wiki/Diffie%E2%80%93Hellman_key_exchange,\
    \ or DH) uses a “smaller” key than the one for the certificate. In order to remedy\
    \ this, we’ll generate a strong DH key and feed it to our secure server for use.\n\
    \nIn order to generate a longer (2048 bit) key, you’ll need `openssl`, which you\
    \ probably have installed by default. In case you’re unsure, run `openssl -v`.\
    \ If the command isn’t found, install `openssl` by running `sudo apt install openssl`\
    \ (or visit their download page [here](https://www.openssl.org/source/)):\n\n\
    ```\nopenssl dhparam -out /var/www/example/sslcert/dh-strong.pem 2048\n```\n\n\
    Then copy the path to the file to our configuration:\n\n```javascript\n// ...\n\
    \nconst options = {\n  key: fs.readFileSync(\"/var/www/example/sslcert/privkey.pem\"\
    ),\n  cert: fs.readFileSync(\"/var/www/example/sslcert/fullchain.pem\"), // these\
    \ paths might differ for you, make sure to copy from the certbot output\n  dhparam:\
    \ fs.readFileSync(\"/var/www/example/sslcert/dh-strong.pem\")\n};\n\n// ...\n\
    ```\n\n## Conclusion\n\nIn 2020 and beyond, there’s no excuse to dismiss HTTPS.\
    \ The future direction is clearly visible: HTTPS everywhere! In Node.js, we have\
    \ lots of options for utilizing SSL/TLS. We can publish our websites in HTTPS,\
    \ we can create requests to encrypted websites, and we can authorize otherwise\
    \ untrusted certificates.\n\n# Chapter 11: Configuring NGINX and SSL with Node.js\n\
    \n### by Nilson Jacques\n\n[NGINX](https://www.nginx.com/) is a high-performance\
    \ HTTP server as well as a [reverse proxy](https://medium.com/intrinsic/why-should-i-use-a-reverse-proxy-if-node-js-is-production-ready-5a079408b2ca).\
    \ Unlike traditional servers, NGINX follows an event-driven, asynchronous architecture.\
    \ As a result, the memory footprint is low and performance is high. If you’re\
    \ running a Node.js-based web app, you should seriously consider using NGINX as\
    \ a reverse proxy.\n\nNGINX can be very efficient in serving static assets. For\
    \ all other requests, it will talk to your Node.js back end and send the response\
    \ to the client. In this tutorial, we’ll discuss how to configure NGINX to work\
    \ with Node.js. We’ll also see how to setup SSL in the NGINX server.\n\n### Node’s\
    \ Built-in HTTPS Module\n\nNode also has a built-in HTTPS module and can be configured\
    \ to read the necessary certificate files without the need for a reverse proxy.\
    \ You can find out more about this in our article [How to Use SSL/TLS with Node.js](https://www.sitepoint.com/how-to-use-ssltls-with-node-js/).\n\
    \n## Installing NGINX\n\nAssuming you already have Node.js installed on your machine\
    \ (if not, check [here](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)),\
    \ let’s see how to install NGINX.\n\n### Installation on Linux\n\nIf you’re running\
    \ Ubuntu, you can use the following command to install NGINX:\n\n```\nsudo apt-get\
    \ update\nsudo apt-get install nginx\n```\n\nIf you’re running a Linux distro\
    \ other than Ubuntu, check out [the NGINX installation docs](https://docs.nginx.com/nginx/admin-guide/).\n\
    \n### Installation on macOS\n\nIf you’re running Ubuntu, you can use the following\
    \ command to install NGINX:\n\n```\nsudo apt-get update\nsudo apt-get install\
    \ nginx\n```\n\n### Installation on Windows\n\nFor Windows, head over to [downloads](https://nginx.org/en/download/)\
    \ page and get the zip.\n\n## Setting Up a Node.js Server\n\nFirst, let’s create\
    \ a simple Node.js server.\n\n```\nmkdir node-demo && cd node-demo\nnpm init -y\n\
    npm i express\n```\n\nCreate a file called `server.js`, with the following contents:\n\
    \n```javascript\nconst express = require('express')\nconst app = express()\nconst\
    \ port = 3000\n\napp.get('/', (req, res) => res.send('Hello World!'))\n\napp.listen(port,\
    \ () => console.log(`Example app listening on ${port}`))\n```\n\nYou can start\
    \ the server by running `node server.js`.\n\n## Configuring NGINX\n\nNow let’s\
    \ open up the NGINX default site config:\n\n```\nsudo nano /etc/nginx/sites-available/default\n\
    ```\n\nWe configure the `server` block to suit our needs. We use `proxy_pass`\
    \ to point to our Node.js application.\n\n```nginx\nserver {\n  listen       80;\n\
    \  server_name  localhost;\n\n  location / {\n    proxy_pass http://localhost:3000;\n\
    \    proxy_http_version 1.1;\n    proxy_set_header Upgrade $http_upgrade;\n  \
    \  proxy_set_header Connection 'upgrade';\n    proxy_set_header Host $host;\n\
    \    proxy_cache_bypass $http_upgrade;\n  }\n}\n```\n"
