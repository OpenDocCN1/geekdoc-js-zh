  trans: "\n我们的第一个路由是主页（`/`），由于它只返回信息，因此我们为它分配了一个 `GET` 方法。目前，它只会向我们返回“所有笔记将将显示在此处”的消息，我们稍后会将其更改为控制器函数。`config`\
    \ 部分中的 `description` 字段仅用于文档说明。\n\n然后，我们在 `/note/` 路径下为我们的笔记创建四个路由。由于我们正在构建一个\
    \ [CRUD](https://en.wikipedia.org/wiki/Create_read_update_and_delete) 应用，我们需要为每个操作准备一个路由，并配有相应的\
    \ [HTTP 方法](http://www.w3schools.com/tags/ref_httpmethods.asp)。\n\n在之前的路由旁边添加以下定义：\n\
    \n```\n{\n  method: \"POST\",\n  path: \"/note\",\n  handler: (request, h) =>\
    \ {\n    return \"New note\";\n  },\n  config: {\n    description: \"添加一条新笔记\"\
    \n  }\n},\n{\n  method: \"GET\",\n  path: \"/note/{slug}\",\n  handler: (request,\
    \ h) => {\n    return \"This is a note\";\n  },\n  config: {\n    description:\
    \ \"获取笔记内容\"\n  }\n},\n{\n  method: \"PUT\",\n  path: \"/note/{slug}\",\n  handler:\
    \ (request, h) => {\n    return \"Edit a note\";\n  },\n  config: {\n    description:\
    \ \"更新选定的笔记\"\n  }\n},\n{\n  method: \"GET\",\n  path: \"/note/{slug}/delete\"\
    ,\n  handler: (request, h) => {\n    return \"Delete a note\";\n  },\n  config:\
    \ {\n    description: \"删除选定的笔记\"\n  }\n},\n```\n\n（注：原文从 \"Our first route...\"\
    \ 之后出现了大量重复且无意义的英文单词组合，为了保证文档质量，此处仅翻译了清晰的路由定义部分。若有更完整的后续文本，请提供。）\n"
- fmt: "\n```javascript\nawait Models.sequelize.sync();\n\nawait server.start();\n\
    console.log(`Server running at: ${server.info.uri}`);\n```\n\nThis code is going\
    \ to synchronize the models to our database. Once that’s done, the server will\
    \ be started.\n\n## Building the Controllers\n\nControllers are functions that\
    \ accept the [request](https://hapi.dev/api#request-properties) and [response\
    \ toolkit](https://hapi.dev/api/#response-toolkit) objects from Hapi.js. The `request`\
    \ object contains information about the requested resource, and we use `reply`\
    \ to return information to the client.\n\nIn our application, we’re going to return\
    \ only a JSON object for now, but we’ll add the views once we build them.\n\n\
    We can think of controllers as functions that will join our models with our views;\
    \ they will communicate with our models to get the data, and then return that\
    \ data inside a view.\n\n### The Home Controller\n\nThe first controller that\
    \ we’re going to build will handle the home page of our site. Create a `home.js`\
    \ file inside a `lib/controllers` directory with the following content:\n\n```javascript\n\
    \"use strict\";\n\nconst Models = require(\"../models/\");\n\nmodule.exports =\
    \ async (request, h) => {\n  const result = await Models.Note.findAll({\n    order:\
    \ [[\"date\", \"DESC\"]]\n  });\n\n  return {\n    data: {\n      notes: result\n\
    \    },\n    page: \"Home—Notes Board\",\n    description: \"Welcome to my Notes\
    \ Board\"\n  };\n};\n```\n\nFirst, we get all the notes in our database using\
    \ the [`findAll`](https://sequelize.org/master/manual/model-querying-basics.html)\
    \ method of our model. This function will return a Promise and, if it resolves,\
    \ we’ll get an array containing all the notes in our database.\n\nWe can arrange\
    \ the results in descending order, using the `order` parameter in the options\
    \ object passed to the `findAll` method, so the last item will appear first. You\
    \ can check all the available options in the [Sequelize.js documentation](https://sequelize.org/master/class/lib/model.js~Model.html#static-method-findAll).\n\
    \nOnce we have the home controller, we can edit our `routes.js` file. First, we\
    \ import the module at the top of the file, next to the `Path` module import:\n\
    \n```javascript\nconst Home = require(\"./controllers/home\");\n```\n\nThen we\
    \ add the controller we just made to the array:\n\n```javascript\n{\n  method:\
    \ \"GET\",\n  path: \"/\",\n  handler: Home,\n  config: {\n    description: \"\
    Gets all the notes available\"\n  }\n},\n```\n\nYou can check things are working\
    \ at this point by restarting the server (`node server.js`) and visiting [http://localhost:3000/](http://localhost:3000/).\
    \ You should see the following response:\n\n```json\n{\n  \"data\": { \"notes\"\
    : [] },\n  \"page\":\"Home—Notes Board\",\n  \"description\":\"Welcome to my Notes\
    \ Board\"\n}\n```\n\n### Boilerplate of the Note Controller\n\nSince we’re going\
    \ to identify our notes with a slug, we can generate one using the title of the\
    \ note and the [slug](https://www.npmjs.com/package/slug) library, so let’s install\
    \ it and include it as a dependency with the following command:\n\n```bash\nnpm\
    \ install slug\n```\n\nThe last controller that we have to define in our application\
    \ will allow us to create, read, update, and delete notes.\n\nWe can proceed to\
    \ create a `note.js` file inside the `lib/controllers` directory and add the following\
    \ content:\n\n```javascript\n\"use strict\";\n\nconst { Note } = require(\"../models/\"\
    );\nconst Slugify = require(\"slug\");\nconst Path = require(\"path\");\n\nmodule.exports\
    \ = {\n  // Here we’re going to include our functions that will handle the remaining\
    \ requests in the routes.js file.\n};\n```\n\n### The `create` Function\n\nTo\
    \ add a note to our database, we’re going to write a `create` function that’s\
    \ going to wrap the `create` method on our model using the data contained in the\
    \ payload object.\n\nAdd the following inside the object that we’re exporting:\n\
    \n```javascript\ncreate: async (request, h) => {\n  const result = await Note.create({\n\
    \    date: new Date(),\n    title: request.payload.noteTitle,\n    slug: Slugify(request.payload.noteTitle,\
    \ { lower: true }),\n    description: request.payload.noteDescription,\n    content:\
    \ request.payload.noteContent\n  });\n\n  // Generate a new note with the 'result'\
    \ data\n  return result;\n},\n```\n\nOnce the note is created, we’ll get back\
    \ the note data and send it to the client as JSON using the `reply` function.\n\
    \nFor now, we just return the result, but once we build the views in the next\
    \ section, we’ll be able to generate the HTML with the new note and add it dynamically\
    \ on the client. Although this is not completely necessary and will depend on\
    \ how you’re going to handle your front-end logic, we’re going to return an HTML\
    \ block to simplify the logic on the client.\n\nAlso, note that the date is being\
    \ generated on the fly when we execute the function, using `new Date()`.\n\n###\
    \ The `read` Function\n\nTo search just one element, we use the `findOne` method\
    \ on our model. Since we identify notes by their slug, the `where` filter must\
    \ contain the slug provided by the client in the URL (`http://localhost:3000/`).\n\
    \n```javascript\nread: async (request, h) => {\n  const note = await Note.findOne({\n\
    \    where: {\n      slug: request.params.slug\n    }\n  });\n\n  return note;\n\
    },\n```\n\n### The `update` Function\n\nTo update a note, we use the `update`\
    \ method on our model. It takes two objects—the new values we’re updating, and\
    \ the options containing a `where` filter.\n\n```javascript\nupdate: async (request,\
    \ h) => {\n  const values = {\n    title: request.payload.noteTitle,\n    description:\
    \ request.payload.noteDescription,\n    content: request.payload.noteContent\n\
    \  };\n\n  const options = {\n    where: {\n      slug: request.params.slug\n\
    \    }\n  };\n\n  await Note.update(values, options);\n  const result = await\
    \ Note.findOne(options);\n\n  return result;\n},\n```\n\n### The `delete` Function\n\
    \nThe delete controller will remove the note by providing the slug to the `destroy`\
    \ function of our model. Then, once the note is deleted, we redirect to the home\
    \ page. To accomplish this, we use the [redirect](https://hapi.dev/api/?v=18.4.0#hredirect)\
    \ function of Hapi’s response toolkit:\n\n```javascript\ndelete: async (request,\
    \ h) => {\n  await Note.destroy({\n    where: {\n      slug: request.params.slug\n\
    \    }\n  });\n\n  return h.redirect(\"/\");\n}\n```\n\n### Using the Note Controller\
    \ in Our Routes\n\nAt this point, we should have our note controller ready with\
    \ all the CRUD actions. But to use them, we have to include it in our routes file.\n\
    \nFirst, let’s import our controller at the top of the `routes.js` file:\n\n```javascript\n\
    const Note = require(\"./controllers/note\");\n```\n\nWe have to replace each\
    \ handler with our new functions, so we should have our routes file as follows:\n\
    \n```javascript\n{\n  method: \"POST\",\n  path: \"/note\",\n  handler: Note.create,\n\
    \  config: {\n    description: \"Adds a new note\",\n    payload: {\n      multipart:\
    \ true,\n    }\n  }\n},\n{\n  method: \"GET\",\n  path: \"/note/{slug}\",\n  handler:\
    \ Note.read,\n  config: {\n    description: \"Gets the content of a note\"\n \
    \ }\n},\n{\n  method: \"PUT\",\n  path: \"/note/{slug}\",\n  handler: Note.update,\n\
    \  config: {\n    description: \"Updates the selected note\",\n    payload: {\n\
    \      multipart: true,\n    }\n  }\n},\n{\n  method: \"GET\",\n  path: \"/note/{slug}/delete\"\
    ,\n  handler: Note.delete,\n  config: {\n    description: \"Deletes the selected\
    \ note\"\n  }\n}\n```\n\n#### Referencing without Calling\n\nWe’re including our\
    \ functions without `()` at the end, because we’re referencing our functions without\
    \ calling them.\n"
