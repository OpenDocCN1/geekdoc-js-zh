  trans: "\n\n| term | description |\n| :--- | :--- |\n| **log point** | 日志点：指示调试器在执行过程中的某一点显示变量的值\
    \ |\n| **logging** | 日志：将运行时信息输出到控制台或文件 |\n| **logic error** | 逻辑错误：程序运行但行为不符合预期\
    \ |\n| **priority** | 优先级：bug 在计划更新列表中的分配位置 |\n| **race condition** | 竞态条件：依赖于不可控事件的顺序或时机的难以追踪的\
    \ bug |\n| **refactoring** | 重构：重写代码以提高可读性和维护性 |\n| **regression** | 回归：之前已修复的\
    \ bug 重新出现，可能是由于其他更新引起的 |\n| **related** | 相关：与另一个 bug 相似或相关的 bug |\n| **reproduce**\
    \ | 复现：导致错误所需的步骤 |\n| **RTFM error** | RTFM 错误：伪装成 bug 报告的用户无能行为，通常会收到“去读那本*该死的*手册”的回复\
    \ |\n| **step into** | 入：在调试器中逐行执行代码时，进入被调用的函数 |\n| **step out** | 出：在逐行执行时，完成当前函数的执行并返回到调用代码\
    \ |\n| **step over** | 跳：在逐行执行时，完成命令的执行，而不进入其调用的函数 |\n| **severity** | 严重程度：bug\
    \ 对系统的影响。例如，数据丢失通常被认为比 UI 问题更严重，除非发生频率非常低 |\n| **stack trace** | 堆栈追踪：错误发生前调用的所有函数历史列表\
    \ |\n| **syntax error** | 语法错误：拼写错误，例如 `console.lug()` |\n| **user error** | 用户错误：由用户而非应用程序引起的错误，但根据该用户的资历，可能仍需要更新\
    \ |\n| **watch** | 监视：在调试器执行期间检查的变量 |\n| **watchpoint** | 监视点：类似于断点，但当变量被设置为特定值时程序会停止\
    \ |\n\n## 如何避免 Bug\n\n在测试应用程序之前，通常就可以防止 bug 的发生……\n\n### 使用良好的代码编辑器\n\n良好的编辑器将提供许多功能，包括行号、自动补全、代码着色、括号匹配、格式化、自动缩进、变量重命名、代码片段复用、对象检查、函数导航、参数提示、重构、不可达代码检测、建议、类型检查等。\n\
    \nNode.js 开发者有很多免费编辑器可以选择，如 [VS Code](https://code.visualstudio.com/)、[Atom](https://atom.io/)\
    \ 和 [Brackets](http://brackets.io/)，以及许多商业替代方案。\n\n### 使用代码检查 (Linter)\n\nLinter\
    \ 可以在你保存和测试代码之前报告代码故障，如语法错误、缩进不当、未声明变量和括号不匹配。JavaScript 和 Node.js 的流行选项包括 [ESLint](https://eslint.org/)、[JSLint](https://www.jslint.com/)\
    \ 和 [JSHint](https://jshint.com/)。\n\n这些通常作为全局 Node.js 模块安装，你可以从命令行运行检查：\n\n```\n\
    eslint myfile.js\n```\n\n然而，大多数 linter 都有代码编辑器插件，例如 [VS Code 中的 ESLint](https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint)\
    \ 和 [Atom 中的 linter-eslint](https://atom.io/packages/linter-eslint)，它们会在你输入代码时检查代码：\n\
    \n![ESLint for VS Code](img/eslint.png)\n\n### 使用版本控制\n\n如 [Git](https://git-scm.com/)\
    \ 等版本控制系统可以帮助保护你的代码并管理版本。这使得发现 bug 在何处、何时引入以及谁应该承担责任变得更容易！在线仓库如 [GitHub](https://github.com/)\
    \ 和 [Bitbucket](https://bitbucket.org/) 提供了免费空间和管理工具。\n\n### 采用问题跟踪系统\n\n*如果没人知道，bug\
    \ 算存在吗？* 问题跟踪系统用于报告 bug、发现重复项、记录复现步骤、确定严重程度、计算优先级、分配开发人员、记录讨论并跟踪任何修复的进度。\n\n在线源码库通常提供基础的问题跟踪，但对于较大的团队和项目，[专门的](https://en.wikipedia.org/wiki/Comparison_of_issue_tracking_systems)\
    \ 可能更合适。\n\n### 使用测试驱动开发\n\n[测试驱动开发](https://www.sitepoint.com/learning-javascript-test-driven-development-by-example/)\
    \ (TDD) 是一种开发流程，鼓励开发者在编写代码之前编写测试函数操作的代码——例如，*当向函数 Y 输入 Z 时，是否返回了 X*。\n\n可以在开发过程中运行测试，以证明函数正常工作并在进行进一步更改时发现任何问题。话虽如此，你的测试也可能存在\
    \ bug……\n\n### 离开一下\n\n通宵达夜试图定位一个棘手 bug 的根源是很诱人的。不要这样做。离开一下去做点别的事。你的大脑会在潜意识里处理这个问题，并在凌晨\
    \ 4 点带着解决方案唤醒你。即使没有发生这种情况，清醒的眼睛也会发现那个明显遗漏的分号。\n\n## Node.js 调试：环境变量\n\n在宿主机操作系统设置的[环境变量](https://nodejs.org/api/cli.html#cli_environment_variables)可以控制\
    \ Node.js 应用程序设置。最常见的是 `NODE_ENV`，在调试时通常设置为 `development`。\n\n在 Linux/macOS 上可以设置环境变量：\n\
    \n```\nNODE_ENV=development\n```\n\nWindows `cmd`：\n\n```\nset NODE_ENV=development\n\
    ```\n\n或者 Windows PowerShell：\n\n```\n$env:NODE_ENV=\"development\"\n```\n\n内部，应用程序将启用更多调试功能和消息。例如：\n\
    \n```\n// (示例代码)\n```\n\n## Node.js 调试：命令行选项\n\n启动应用程序时可以向 `node` 传递各种[命令行选项](https://nodejs.org/api/cli.html)。最有用的选项之一是\
    \ `--trace-warnings`，它会输出进程警告（包括弃用警告）。\n\n可以设置任意选项，包括：\n\n*   `--enable-source-maps`:启用源映射（实验性）\n\
    *   `--throw-deprecation`: 使用弃用功能时抛出错误\n*   `--inspect`:  V8 调试器（见下文）\n\n通过示例，让我们尝试记录\
    \ [crypto 模块的 `ENCODING` 属性](https://nodejs.org/api/crypto.html#crypto_encoding)，该属性在\
    \ Node v10 中被弃用：\n\n```javascript\nconst crypto = require('crypto');\n\nfunction\
    \ bar() {\n  console.log(crypto.DEFAULT_ENCODING);\n}\n\nfunction foo(){\n  bar();\n\
    }\n\nfoo();\n```\n\n现在使用以下命令运行它：\n\n```\nnode index.js\n```\n\n我们将看到：\n\n```\n\
    buffer\n(node:7405) [DEP0091] DeprecationWarning: crypto.DEFAULT_ENCODING is deprecated.\n\
    ```\n\n然而，我们也可以这样做：\n\n```\nnode --trace-warnings index.js\n```\n\n那产生以下输出：\n\n\
    ```\nbuffer\n(node:7502) [DEP0091] DeprecationWarning: crypto.DEFAULT_ENCODING\
    \ is deprecated.\n    at bar (/home/Desktop/index.js:4:22)\n    at foo (/home/Desktop/index.js:8:3)\n\
    \    at Object.<anonymous> (/home/Desktop/index.js:11:1)\n```\n\n"
- fmt: '

    This tells us that the deprecation warning comes from the code in line 4 (the
    `console.log` statement), which was executed when the `bar` function ran. The
    `bar` function was called by the `foo` function on line 8 and the `foo` function
    was called on line 11 of our script.


    Note that the same options can also be passed to [nodemon](https://nodemon.io/).


    ## Console Debugging


    One of the easiest ways to debug an application is to output values to the console
    during execution:


    ```javascript

    console.log( myVariable );

    ```


    Few developers delve beyond this humble debugging command, but they’re missing
    out on [many more possibilities](https://nodejs.org/api/console.html), including
    these:


    | `console` method | description |

    | --- | --- |

    | [`.log(msg)`](https://nodejs.org/api/console.html#console_console_log_data_args)
    | output a message to the console |

    | [`.dir(obj,opt)`](https://nodejs.org/api/console.html#console_console_dir_obj_options)
    | uses [`util.inspect`](https://nodejs.org/api/util.html#util_util_inspect_object_options)
    to pretty-print objects and properties |

    | [`.table(obj)`](https://nodejs.org/api/console.html#console_console_table_tabulardata_properties)
    | outputs arrays of objects in tabular format |

    | [`.error(msg)`](https://nodejs.org/api/console.html#console_console_error_data_args)
    | output an error message |

    | [`.count(label)`](https://nodejs.org/api/console.html#console_console_count_label)
    | a named counter reporting the number of times the line has been executed |

    | [`.countReset[label]`](https://nodejs.org/api/console.html#console_console_countreset_label)
    | resets a named counter |

    | [`.group(label)`](https://nodejs.org/api/console.html#console_console_group_label)
    | indents a group of log messages |

    | [`.groupEnd(label)`](https://nodejs.org/api/console.html#console_console_groupend)
    | ends the indented group |

    | [`.time(label)`](https://nodejs.org/api/console.html#console_console_time_label)
    | starts a timer to calculate the duration of an operation |

    | [`.timeLog([label]`](https://nodejs.org/api/console.html#console_console_timelog_label_data)
    | reports the elapsed time since the timer started |

    | [`.timeEnd(label)`](https://nodejs.org/api/console.html#console_console_timeend_label)
    | stops the timer and reports the total duration |

    | [`.trace()`](https://nodejs.org/api/console.html#console_console_trace_message_args)
    | outputs a stack trace (a list of all calling functions) |

    | [`.clear()`](https://nodejs.org/api/console.html#console_console_clear) | clear
    the console |


    `console.log()` accepts a list of comma-separated values. For example:


    ```javascript

    let x = 123;

    console.log(''x:'', x);

    // x: 123

    ```


    However, [ES6 destructuring](https://www.sitepoint.com/es6-destructuring-assignment/)
    can offer similar output with less typing effort:


    ```javascript

    console.log({x});

    // { x: 123 }

    ```


    Larger objects can be output as a condensed string using this:


    ```javascript

    console.log( JSON.stringify(obj) );

    ```


    [`util.inspect`](https://nodejs.org/api/util.html#util_util_inspect_object_options)
    will format objects for easier reading, but `console.dir()` does the hard work
    for you.


    ## Node.js `util.debuglog`


    The Node.js `util` module offers a built-in [`debuglog`](https://nodejs.org/api/util.html#util_util_debuglog_section)
    method which conditionally writes messages to `STDERR`:


    ```javascript

    const util = require(''util'');

    const debuglog = util.debuglog(''myapp'');


    debuglog(''myapp debug message [%d]'', 123);

    ```


    When the `NODE_DEBUG` environment variable is set to `myapp` (or a wildcard such
    as `*` or `my*`), messages are displayed in the console:


    ```bash

    NODE_DEBUG=myapp node index.js

    MYAPP 9876: myapp debug message [123]

    ```


    Here, `9876` is the Node.js process ID.


    By default, `util.debuglog` is silent. If you were to run the above script without
    setting a `NODE_DEBUG` variable, nothing would be output to the console. This
    allows you to leave helpful debug logging in your code without cluttering the
    console for regular use.


    ## Debugging with Log Modules


    Third-party logging modules are available should you require more sophisticated
    options for messaging levels, verbosity, sorting, file output, profiling, and
    more. Popular options include:


    * [cabin](https://www.npmjs.com/package/cabin)

    * [loglevel](https://www.npmjs.com/package/loglevel)

    * [morgan](https://www.npmjs.com/package/morgan) (Express.js middleware)


    ## Node.js V8 Inspector


    The Node.js inspector (without the debugger client) is started with the `--inspect`
    flag:


    ```bash

    node --inspect ./index.js

    ```


    #### `nodemon`


    `nodemon` can be used instead of `node` if necessary.


    This starts the debugger listening on `127.0.0.1:9229`, which any local debugging
    client can attach to:


    ```

    Debugger listening on ws://127.0.0.1:9229/20ac75ae-90c5-4db6-af6b-d9d7459257f

    ```


    If you’re running the Node.js application on another device or Docker container,
    ensure port `9229` is accessible and grant remote access using this:


    ```bash

    node --inspect=0.0.0.0:9229 ./index.js

    ```


    Alternatively, you can use `--inspect-brk` to set a breakpoint on the first statement
    so the application is paused immediately.


    Open Chrome and enter `chrome://inspect` in the address bar.


    #### Remote Target


    If the Node.js application doesn’t appear as a **Remote Target**, ensure **Discover
    network targets** is checked, then click **Configure** to add the IP address and
    port of the device where the application is running.


    Click the Target’s **inspect** link to launch DevTools. It will be immediately
    familiar to anyone with browser debugging experience.


    The **+ Add folder to workspace** link allows you to select where the Node.js
    files are located on your system, so it becomes easier to load other modules and
    make changes.

