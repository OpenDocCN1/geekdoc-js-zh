    The output looks a little different, but we can read it the same way as before.
    We can see that there was an `AssertionError` and that doesn’t tell us much by
    itself. We can also see that “isEven(5) returns true” according to the start of
    the error trace. That’s the test failure message we wrote for ourselves. Below
    the trace we can see more details about what message was generated, the actual
    and expected values, and even the comparison operator used.


    With all this, we know that we need to improve our `isEven()` method to handle
    this new case. We have two tests defined that address our two most likely scenarios
    of even and odd numbers. Once we get both tests passing we’ll know a lot about
    the functionality of our new method.


    There are a few ways to modify `isEven()` in our `app.js` file, but one simple
    approach to get both our tests to pass might be changing the definition to this:


    ```javascript

    const isEven = (value) => value % 2 === 0;

    ```


    Now `isEven()` takes in a value and returns the result of applying `% 2` to the
    value and seeing if the remainder equals `0`. With that change, running `node
    tests.js` in our terminal now returns nothing—which means both our tests passed!


    Now that your tests are all passing again, this is another a good time to commit
    your code to version control if you’re doing that, and to look for any ways you
    might want to refactor.


    ### Testing Edge Cases


    Depending on the desired resiliency of our code, we may be done. The question
    to ask is whether our application’s behavior meets the acceptance criteria we
    agreed to before we started coding. For example, what if `isEven()` gets called
    with something other than an integer? Do we think it might be called with a floating
    point value? A negative number? How about a string? Could we find it getting called
    with no value at all passed in, an object, or `NaN`?


    With the basic `assert` functionality built into Node, we now know we can write
    tests for any of these scenarios to see what happens. And if all the tests pass,
    we can trust the functionality of our code in all these scenarios. If one of them
    fails, we’ll get direction from the failure message telling us what we need to
    do next.


    For example, let’s see what happens if we pass a string to our `isEven()` method.
    We’ll start by adding two lines to our `tests.js` file—one to define a new constant,
    and another to test a new assertion to see if it will fail:


    ```javascript

    const assert = require(''assert'');

    const { isEven } = require(''./app'');

    const isFourEven = isEven(4);

    const isFiveEven = isEven(5);

    const isStringEven = isEven("A");


    assert(isFourEven, ''isEven(4) does not return falsy'');

    assert.equal(isFiveEven, false, ''isEven(5) returns true'');

    assert.equal(isStringEven, false, ''isEven("A") returns true'');

    ```


    Running `node tests.js` in our terminal after adding that test produces no result.
    That means our method is cleanly rejecting strings. This is good news, and another
    opportunity to commit to our version control system.


    At this point we could add more tests for this method, or if we’re feeling confident
    that we’ve covered all the likely edge cases, we could refactor our code or start
    writing the first test for the next bit of behavior we’ll need.


    ### Structuring Your Tests


    We’ve already written more test code than application code, but it’s pretty clear
    why we need everything we’ve written. And you can probably see already that writing
    all of your tests this way could start to make your test code pretty unreadable.


    Our tests are all sitting at the same level in our `test.js` file, with our constants
    being declared further and further away from our assertions. Imagine trying to
    build out all the necessary tests for any real-world application with organization
    like this.


    Ideally our tests should read like documentation, explaining clearly what we want
    each aspect of the code to do, and providing concrete examples of how it should
    behave under different conditions. A single flat file with no structure isn’t
    going to cut it.


    To help address this concern, software tests are usually organized into patterns
    that make them easier to read, maintain, and run efficiently. It’s all about grouping
    like tests together logically, providing them with the resources they need to
    run the same way every time, and calling them in an organized way so you always
    know what you’re testing.


    As you start researching potential frameworks and thinking about how they might
    help you take advantage of your new test writing superpowers, it might help if
    we define a few terms.


    ### Test Cases


    What we’ve been writing in this guide are test cases. Each behavioral requirement
    usually calls for at least two test cases: one to show we get the expected result
    with the correct data, and one to prove that we don’t get the expected result
    with the wrong data.


    ### Test Suites


    Once we have a set of test cases defined, we may want to keep them organized by
    defining a `test suite`. This can be a section of code within a test file, a separate
    file with a set of related tests, or even a nested directory structure depending
    on how complex your needs. Different testing frameworks recommend different ways
    of structuring and organizing test code, but the same concepts apply regardless.


    ### Test Harnesses


    A `test harness` is a system of organization and facilities that supports an automated
    approach for running a set of test cases consistently within any framework. The
    harness should include any resources and data necessary to populate and execute
    the tests the same way every time, so they can be checked for consistent results.


    ### Fixtures


    A `fixture` helps define all the setup required to initialize a system for testing
    testing a specific fixed context. Defining the context before each test is run
    is essential, so you always know you’re starting from the same place with all
    the same inputs. Otherwise, your tests could produce different results every time
    you run them, even if the code you’re testing hasn’t changed.


    ### Test Doubles


    In the real world, our software may have complex, brittle, resource-intensive
    dependencies. We can’t always rely on having access to these in every environment
    where we want to run our tests. They may be too expensive to keep running just
    for testing purposes, they may rely on sensitive data that would be difficult
    to version and update if we made a mistake, or may simply not be available in
    our testing environment due to regulations and other practical issues.


    But we still need to make sure our code will work as expected under any of these
    conditions. That’s where test doubles such as mocks and stubs come in handy. They
    simulate real-world contexts so we don’t need to have the real thing handy all
    the time.


    A `mock` sits inside of our test fixture and simulates the behavior of a real-world
    object our test may be expecting. Any call for that real-world object in our test
    gets intercepted and provided with the mock object we’ve created. This is very
    useful when the real-world object might vary depending on the time when it was
    called, the precise state of a complex system with many moving parts, a slow or
    expensive data source that would keep our tests from running efficiently as often
    as we need them to, or even a resource that hasn’t been created yet.


    A `stub` provides similar artificial results as a mock, but for functions and
    methods. All calls to a given method are intercepted, providing instead a call
    to the stubbed version of that method.

