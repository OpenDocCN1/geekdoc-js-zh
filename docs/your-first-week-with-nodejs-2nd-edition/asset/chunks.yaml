  trans: "\n每当用户在模态窗口中提交表单时，我们都会从表单元素获取信息并发送到后端，具体取决于操作 URL 和方法（`POST` 或 `PUT`）。然后，我们将获得一个包含我们新笔记数据的\
    \ HTML 块作为结果。当我们添加笔记时，我们将将其添加到首页列表的顶部；当我们更新笔记时，我们将用新内容替换笔记视图中的旧内容。\n\n### 为服务器端添加视图（Views）支持\n\
    \n为了使用我们的视图，我们必须在控制器中包含它们并添加必要的设置。\n\n在我们的 `server.js` 文件中，让我们在文件顶部导入 Node 的 [Path](https://nodejs.org/api/path.html)\
    \ 实用程序，因为我们将在代码中使用它来指明视图的路径：\n\n```\nconst Path = require(\"path\");\n```\n\n\
    现在，将 `server.route(Routes);` 一行替换为以下代码块：\n\n```\nawait server.register([require(\"\
    @hapi/vision\")]);\n\nserver.views({\n  engines: { pug: require(\"pug\") },\n\
    \  path: Path.join(__dirname, \"lib/views\"),\n  compileOptions: {\n    pretty:\
    \ false\n  },\n  isCached: Settings.env === \"production\"\n});\n\n// Add routes\n\
    server.route(Routes);\n```\n\n在我们添加的代码中，我们首先向 Hapi.js 服务器注册了 [Vision](https://github.com/hapijs/vision)\
    \ 插件，该插件将提供视图功能。然后，我们为视图添加了设置——例如我们将使用的引擎以及视图所在的路径。在代码块的末尾，我们重新添加了路由。\n\n这将使视图在服务器上运行，但我们仍然需要为每个路由声明将要使用的视图。\n\
    \n### 设置首页视图\n\n打开 `lib/controllers/home.js` 文件，并将 `return` 语句替换为以下内容：\n\n```\n\
    return h.view('home', {\n  data: {\n    notes: result\n  },\n  page: 'Home—Notes\
    \ Board',\n  description: 'Welcome to my Notes Board'\n});\n```\n\n注册 Vision 插件后，我们现在可以在\
    \ `reply` 对象上使用 `view` 方法。我们将使用它来选择 `views` 目录中的 `home` 视图，并发送渲染视图时将使用的数据。\n\n\
    在提供给视图的数据中，我们还包含了页面标题和用于搜索引擎的元描述（meta description）。\n\n如果你想在此时尝试一下，请访问 [`localhost:3000/`](http://localhost:3000/)。你应该能看到一个样式精美的笔记板，上面有一个没有任何作用的\
    \ `Publish`（发布）按钮。\n\n### 设置笔记视图：`create` 函数\n\n现在，每当我们创建一个笔记时，都会从服务器向客户端发送一个\
    \ JSON 对象。但由于我们使用 Ajax 进行此过程，我们可以将新笔记作为 HTML 格式发送，以便直接添加到页面。要实现这一点，我们使用现有的数据渲染\
    \ *note* 组件。\n\n首先在 `controllers/note.js` 文件的顶部引入 Pug：\n\n```\nconst Pug = require(\"\
    pug\");\n```\n\n然后，在 `create` 方法中，将 `return result;` 一行替换为以下代码块：\n\n```\n// Generate\
    \ a new note with the 'result' data\nreturn Pug.renderFile(\n  Path.join(__dirname,\
    \ \"../views/components/note.pug\"),\n  {\n    note: result\n  }\n);\n```\n\n\
    我们使用 Pug 的 `renderFile` 方法根据刚刚从模型中接收的数据来渲染笔记模板。\n\n### 设置笔记视图：`read` 函数\n\n当我们进入笔记页面时，应该获取包含笔记内容的笔记模板。为了实现这一点，我们必须将\
    \ `read` 函数中的 `return note;` 行替换为以下内容：\n\n```\nreturn h.view(\"note\", {\n  note,\n\
    \  page: `${note.title}—Notes Board`,\n  description: note.description\n});\n\
    ```\n\n与首页一样，我们将视图作为第一个参数，并将将要使用的数据作为第二个参数。\n\n### 设置笔记视图：`update` 函数\n\n每当我们更新笔记时，回复方式与创建新笔记时类似。将\
    \ `update` 函数中的 `return result;` 行替换为以下代码：\n\n```\n// Generate a new note with\
    \ the updated data\nreturn Pug.renderFile(\n  Path.join(__dirname, \"../views/components/note.pug\"\
    ),\n  {\n    note: result\n  }\n);\n```\n\n#### 不需要视图\n\n删除函数不需要视图，因为一旦笔记被删除，它将直接重定向到首页。\n\
    \n## 托管静态文件\n\n我们在客户端使用的 JavaScript 和 CSS 文件由 Hapi.js 从 `static/public/` 目录。但这不会自动发生；我们必须告诉服务器我们想要将此文件夹定义公共目录。这是通过\
    \ [Inert](https://github.com/hapijs/inert) 包实现的，你可以通过以下命令安装它：\n\n```\nnpm install\
    \ @hapi/inert\n```\n\n在 `server.js` 文件的 `server.register` 函数中，导入 Inert 插件并按如下方式向\
    \ Hapi 注册：\n\n```\nawait server.register([require(\"@hapi/vision\"), require(\"\
    @hapi/inert\")]);\n```\n\n现在我们必须定义提供静态文件的路由。在 `routes.js` 的最后添加以下条目：\n\n```\n\
    {\n  // Static files\n  method: \"GET\",\n  path: \"/static*\",\n  handler: {\n\
    \    directory: {\n      path: Path.join(__dirname, \"../static/public\")\n  \
    \  }\n  },\n  config: {\n    description: \"Provides static resources\"\n  }\n\
    }\n```\n\n你可以在 [Hapi.js 文档](https://hapi.dev/tutorials/servingfiles/) 中找到更多关于托管静态内容的信息。\n\
    \n## 结论\n\n到目前，我们已经有一个使用 MVC 架构的非常基础的 Hapi.js 应用。尽管在应用投入生产之前还有一些我们需要处理的事情（例如输入验证、错误处理、错误页面），但这应该作为学习和构建你自己的应用的基础。\n\
    \n如果你想让这个示例更进一步，在完成所有（与架构无关）的小细节以使其成为一个健壮的应用之后，你可以实现一个身份验证系统，使得只有注册用户能够发布和编辑笔记。你的想象力就是限制，尽管克隆该[应用](https://github.com/sitepoint-editors/notes-board)\
    \ 并尽情发挥吧！\n"
- fmt: "\nMongoDB comes in various editions. The one we’re interested in is the `MongoDB\
    \ Community Edition`.\n\nThe project’s home page has excellent documentation and\
    \ I won’t try to replicate that here. Rather, I’ll offer you links to instructions\
    \ for each of the main operating systems:\n\n* [Install MongoDB Community Edition\
    \ on Windows](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-windows/)\n\
    * [Install MongoDB Community Edition on macOS](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-os-x/)\n\
    * [Install MongoDB Community Edition on Ubuntu](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-ubuntu/)\n\
    \nIf you use a non-Ubuntu–based version of Linux, you can check out [this page](https://docs.mongodb.com/manual/installation/#mongodb-community-edition-installation-tutorials)\
    \ for installation instructions for other distros. MongoDB is also normally available\
    \ through the official Linux software channels, but sometimes this will pull in\
    \ an outdated version.\n\n### Name and Address\n\nYou don’t need to enter your\
    \ name and address to download MongoDB. If prompted, you can normally dismiss\
    \ the dialog.\n\nIf you’d like a quick refresher on using MongoDB, check out our\
    \ beginner’s guide, “[An Introduction to MongoDB](https://www.sitepoint.com/an-introduction-to-mongodb/)”.\n\
    \n## Authentication Strategies: Session vs. JWT\n\nBefore we begin, let’s talk\
    \ briefly about authentication choices.\n\nMany of the tutorials online today\
    \ will opt for token-based authentication using [JSON Web Tokens](https://www.sitepoint.com/using-json-web-tokens-node-js/)\
    \ (JWTs). This approach is probably the simplest and most popular one nowadays.\
    \ It relegates part of the authentication responsibility to the client and makes\
    \ them sign a token that’s sent with every request, to keep the user authenticated.\n\
    \nSession-based authentication has been around longer. This method relegates the\
    \ weight of the authentication to the server. It uses cookies and sees the Node\
    \ application and database work together to keep track of a user’s authentication\
    \ state.\n\nIn this tutorial, we’ll be using session-based authentication, which\
    \ is at the heart of the [passport-local strategy](http://www.passportjs.org/packages/passport-local/).\n\
    \nBoth methods have their advantages and drawbacks. If you’d like to read more\
    \ into the difference between the two, [this Stack Overflow thread](https://stackoverflow.com/q/43452896)\
    \ might be a good place to start.\n\n## Creating the Project\n\nOnce all of the\
    \ prerequisite software is set up, we can get started.\n\nWe’ll begin by creating\
    \ the folder for our app and then accessing that folder on the terminal:\n\n```\n\
    mkdir AuthApp\ncd AuthApp\n```\n\nTo create the node app, we’ll use the following\
    \ command:\n\n```bash\nnpm init\n```\n\nYou’ll be prompted to provide some information\
    \ for Node’s `package.json`. Just keep hitting `Return` to accept the default\
    \ configuration (or use the `-y` flag).\n\n## Setting up Express\n\nNow we need\
    \ to install [Express](http://expressjs.com/). Go to the terminal and enter this\
    \ command:\n\n```bash\nnpm install express\n```\n\nWe’ll also need to install\
    \ the [body-parser](https://www.npmjs.com/package/body-parser) middleware which\
    \ is used to parse the request body that Passport uses to authenticate the user.\
    \ And we’ll need to install the [express-session](https://www.npmjs.com/package/express-session)\
    \ middleware.\n\nLet’s do that. Run the following command:\n\n```bash\nnpm install\
    \ body-parser express-session\n```\n\nWhen that’s done, create an `index.js` file\
    \ in the root folder of your app and add the following content to it:\n\n```javascript\n\
    /*  EXPRESS SETUP  */\n\nconst express = require('express');\nconst app = express();\n\
    \napp.use(express.static(__dirname));\n\nconst bodyParser = require('body-parser');\n\
    const expressSession = require('express-session')({\n  secret: 'secret',\n  resave:\
    \ false,\n  saveUninitialized: false\n});\n\napp.use(bodyParser.json());\napp.use(bodyParser.urlencoded({\
    \ extended: true }));\napp.use(expressSession);\n\nconst port = process.env.PORT\
    \ || 3000;\napp.listen(port, () => console.log('App listening on port ' + port));\n\
    ```\n\nFirst, we `require` Express and create our Express app by calling `express()`](http://expressjs.com/en/api.html#express).\
    \ Then we define the directory from which to serve our static files.\n\nThe next\
    \ line sees us `require` the body-parser middleware, which will help us parse\
    \ the body of our requests. We’re also adding the express-session middleware to\
    \ help us save the session cookie.\n\nAs you can, see we’re configuring express-session\
    \ with a `secret` to sign the session ID cookie (you should choose a unique value\
    \ here), and two other fields, [resave](https://github.com/expressjs/session#resave)\
    \ and [saveUninitialized](https://github.com/expressjs/session#saveuninitialized).\
    \ The `resave` field forces the session to be saved back to the session store,\
    \ and the `saveUninitialized` field forces a session that is “uninitialized” to\
    \ be saved to the store. To learn more about them, check out their documentation,\
    \ but for now it’s enough to know that for our case we want to keep them `false`.\n\
    \nThen, we use `process.env.PORT` to set the port to the environment port variable\
    \ if it exists. Otherwise, we’ll default to `3000`, which is the port we set up.\
    \ This port might be set by a service provider like, for instance, [Heroku](https://www.heroku.com/).\
    \ Right below that, we called `app.listen()`](http://expressjs.com/en/api.html#app.listen)\
    \ with the port we set up and a simple log to let us know it’s all working.\n\n\
    That’s all for the Express setup. Now it’s on to setting up `Passport`.\n\n##\
    \ Setting up Passport\n\nFirst, we install Passport with the following command:\n\
    \n```bash\nnpm install passport\n```\n\nThen we need to add the following lines\
    \ to the bottom of `index.js` file:\n\n```javascript\n/*  PASSPORT SETUP  */\n\
    \nconst passport = require('passport');\n\napp.use(passport.initialize());\napp.use(passport.session());\n\
    ```\n\nHere, we require `passport` and initialize it along with its session middleware,\
    \ inside our Express app.\n\n## Creating a MongoDB Data Store\n\nSince we’re assuming\
    \ you’ve already installed Mongo, you should be able to start the Mongo shell\
    \ using the following command:\n\n```bash\nmongo\n```\n\nWithin the shell, issue\
    \ the following command:\n\n```javascript\nuse MyDatabase;\n```\n\nThis simply\
    \ creates a datastore named `MyDatabase`.\n\nLeave the terminal there; we’ll come\
    \ back to it later.\n\n## Connecting Mongo to Node with Mongoose\n\nNow that we\
    \ have a database with records in it, we need a way to communicate with it from\
    \ our application. We’ll be using [Mongoose](http://mongoosejs.com/) to achieve\
    \ this. Why don’t we just use plain Mongo? Well, as the Mongoose devs like to\
    \ say [on their website](https://mongoosejs.com/docs/unstable/index.html):\n\n\
    > writing MongoDB validation, casting and business logic boilerplate is a drag.\n\
    \nMongoose will simply make our lives easier and our code more elegant.\n\nLet’s\
    \ go ahead and install it with the following command:\n\n```bash\nnpm install\
    \ mongoose\n```\n\nWe’ll also be using [passport-local-mongoose](https://www.npmjs.com/package/passport-local-mongoose),\
    \ which will simplify the integration between Mongoose and Passport for local\
    \ authentication. It will add a `hash` and `salt` field to our Schema in order\
    \ to store the hashed password and the salt value. This is great, as [passwords\
    \ should never be stored as plain text in a database](https://security.stackexchange.com/a/120541).\n\
    \nLet’s install the package:\n\n```bash\nnpm install passport-local-mongoose\n\
    ```\n\nNow we have to configure Mongoose. Hopefully you know the drill by now:\
    \ add the following code to the bottom of your `index.js` file.\n"
  raw: "MongoDB comes in various editions. The one we’re interested in is the MongoDB\
    \ Community Edition.\n\nThe project’s home page has excellent documentation and\
    \ I won’t try to replicate that here. Rather, I’ll offer you links to instructions\
    \ for each of the main operating systems:\n\n*   [Install MongoDB Community Edition\
    \ on Windows](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-windows/)\n\
    \n*   [Install MongoDB Community Edition on macOS](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-os-x/)\n\
    \n*   [Install MongoDB Community Edition on Ubuntu](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-ubuntu/)\n\
    \nIf you use a non-Ubuntu–based version of Linux, you can check out [this page](https://docs.mongodb.com/manual/installation/#mongodb-community-edition-installation-tutorials)\
    \ for installation instructions for other distros. MongoDB is also normally available\
    \ through the official Linux software channels, but sometimes this will pull in\
    \ an outdated version.\n\n#### Name and Address\n\nYou don’t need to enter your\
    \ name and address to download MongoDB. If prompted, you can normally dismiss\
    \ the dialog.\n\nIf you’d like a quick refresher on using MongoDB, check out our\
    \ beginner’s guide, “[An Introduction to MongoDB](https://www.sitepoint.com/an-introduction-to-mongodb/)”.\n\
    \n## Authentication Strategies: Session vs JWT\n\nBefore we begin, let’s talk\
    \ briefly about authentication choices.\n\nMany of the tutorials online today\
    \ will opt for token-based authentication using [JSON Web Tokens](https://www.sitepoint.com/using-json-web-tokens-node-js/)\
    \ (JWTs). This approach is probably the simplest and most popular one nowadays.\
    \ It relegates part of the authentication responsibility to the client and makes\
    \ them sign a token that’s sent with every request, to keep the user authenticated.\n\
    \nSession-based authentication has been around longer. This method relegates the\
    \ weight of the authentication to the server. It uses cookies and sees the Node\
    \ application and database work together to keep track of a user’s authentication\
    \ state.\n\nIn this tutorial, we’ll be using session-based authentication, which\
    \ is at the heart of the [passport-local strategy](http://www.passportjs.org/packages/passport-local/).\n\
    \nBoth methods have their advantages and drawbacks. If you’d like to read more\
    \ into the difference between the two, [this Stack Overflow thread](https://stackoverflow.com/q/43452896)\
    \ might be a good place to start.\n\n## Creating the Project\n\nOnce all of the\
    \ prerequisite software is set up, we can get started.\n\nWe’ll begin by creating\
    \ the folder for our app and then accessing that folder on the terminal:\n\n```\n\
    mkdir AuthApp\ncd AuthApp\n```\n\nTo create the node app, we’ll use the following\
    \ command:\n\n```\nnpm init\n```\n\nYou’ll be prompted to provide some information\
    \ for Node’s `package.json`. Just keep hitting `Return` to accept the default\
    \ configuration (or use the `-y` flag).\n\n## Setting up Express\n\nNow we need\
    \ to install [Express](http://expressjs.com/). Go to the terminal and enter this\
    \ command:\n\n```\nnpm install express\n```\n\nWe’ll also need to install the\
    \ [body-parser](https://www.npmjs.com/package/body-parser) middleware which is\
    \ used to parse the request body that Passport uses to authenticate the user.\
    \ And we’ll need to install the [express-session](https://www.npmjs.com/package/express-session)\
    \ middleware.\n\nLet’s do that. Run the following command:\n\n```\nnpm install\
    \ body-parser express-session\n```\n\nWhen that’s done, create an `index.js` file\
    \ in the root folder of your app and add the following content to it:\n\n```\n\
    /*  EXPRESS SETUP  */\n\nconst express = require('express');\nconst app = express();\n\
    \napp.use(express.static(__dirname));\n\nconst bodyParser = require('body-parser');\n\
    const expressSession = require('express-session')({\n  secret: 'secret',\n  resave:\
    \ false,\n  saveUninitialized: false\n});\n\napp.use(bodyParser.json());\napp.use(bodyParser.urlencoded({\
    \ extended: true }));\napp.use(expressSession);\n\nconst port = process.env.PORT\
    \ || 3000;\napp.listen(port, () => console.log('App listening on port ' + port));\n\
    ```\n\nFirst, we `require` Express and create our Express app by calling [express()](http://expressjs.com/en/api.html#express).\
    \ Then we define the directory from which to serve our static files.\n\nThe next\
    \ line sees us `require` the body-parser middleware, which will help us parse\
    \ the body of our requests. We’re also adding the express-session middleware to\
    \ help us save the session cookie.\n\nAs you can, see we’re configuring express-session\
    \ with a `secret` to sign the session ID cookie (you should choose a unique value\
    \ here), and two other fields, [resave](https://github.com/expressjs/session#resave)\
    \ and [saveUninitialized](https://github.com/expressjs/session#saveuninitialized).\
    \ The `resave` field forces the session to be saved back to the session store,\
    \ and the `saveUninitialized` field forces a session that is “uninitialized” to\
    \ be saved to the store. To learn more about them, check out their documentation,\
    \ but for now it’s enough to know that for our case we want to keep them `false`.\n\
    \nThen, we use `process.env.PORT` to set the port to the environment port variable\
    \ if it exists. Otherwise, we’ll default to `3000`, which is the port we’ll be\
    \ using locally. This gives you enough flexibility to switch from development,\
    \ directly to a production environment where the port might be set by a service\
    \ provider like, for instance, [Heroku](https://www.heroku.com/). Right below\
    \ that, we called [app.listen()](http://expressjs.com/en/api.html#app.listen)\
    \ with the port variable we set up and a simple log to let us know that it’s all\
    \ working fine and on which port is the app listening.\n\nThat’s all for the Express\
    \ setup. Now it’s on to setting up `Passport`.\n\n## Setting up Passport\n\nFirst,\
    \ we install Passport with the following command:\n\n```\nnpm install passport\n\
    ```\n\nThen we need to add the following lines to the bottom of the `index.js`\
    \ file:\n\n```\n/*  PASSPORT SETUP  */\n\nconst passport = require('passport');\n\
    \napp.use(passport.initialize());\napp.use(passport.session());\n```\n\nHere,\
    \ we require `passport` and initialize it along with its session authentication\
    \ middleware, directly inside our Express app.\n\n## Creating a MongoDB Data Store\n\
    \nSince we’re assuming you’ve already installed Mongo, you should be able to start\
    \ the Mongo shell using the following command:\n\n```\nmongo\n```\n\nWithin the\
    \ shell, issue the following command:\n\n```\nuse MyDatabase;\n```\n\nThis simply\
    \ creates a datastore named `MyDatabase`.\n\nLeave the terminal there; we’ll come\
    \ back to it later.\n\n## Connecting Mongo to Node with Mongoose\n\nNow that we\
    \ have a database with records in it, we need a way to communicate with it from\
    \ our application. We’ll be using [Mongoose](http://mongoosejs.com/) to achieve\
    \ this. Why don’t we just use plain Mongo? Well, as the Mongoose devs like to\
    \ say [on their website](https://mongoosejs.com/docs/unstable/index.html):\n\n\
    > writing MongoDB validation, casting and business logic boilerplate is a drag.\n\
    \nMongoose will simply make our lives easier and our code more elegant.\n\nLet’s\
    \ go ahead and install it with the following command:\n\n```\nnpm install mongoose\n\
    ```\n\nWe’ll also be using [passport-local-mongoose](https://www.npmjs.com/package/passport-local-mongoose),\
    \ which will simplify the integration between Mongoose and Passport for local\
    \ authentication. It will add a `hash` and `salt` field to our Schema in order\
    \ to store the hashed password and the salt value. This is great, as [passwords\
    \ should never be stored as plain text in a database](https://security.stackexchange.com/a/120541).\n\
    \nLet’s install the package:\n\n```\nnpm install passport-local-mongoose\n```\n\
    \nNow we have to configure Mongoose. Hopefully you know the drill by now: add\
    \ the following code to the bottom of your `index.js` file:"
