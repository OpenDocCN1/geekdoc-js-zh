    \n### Node.js File System API\n\nNode.js provides an extensive [File System (`fs`)\
    \ API](https://nodejs.org/dist/latest/docs/api/fs.html) which can manipulate,\
    \ read, and write files and directories. Early releases of Node.js provided callback-based\
    \ functions which are still available. For example:\n\n```\n// append the current\
    \ date to a file\nconst fs = require('fs');\n\nfs.appendFile('myfile.txt', new\
    \ Date(), (err) => {\n\n  if (err) {\n    console.log('file update failed:', err);\n\
    \  }\n  else {\n    console.log('file updated');\n  }\n\n});\n```\n\nSynchronous\
    \ `'sync'` equivalents are also available. However, these are not Promise-based\
    \ and block the entire Node.js process until they complete. They’re best avoided\
    \ unless you’re writing application initialization functions for older releases\
    \ of Node.js:\n\n```\n// append the current date to a file\nconst fs = require('fs');\n\
    \ntry {\n  fs.appendFileSync('myfile.txt', new Date());\n  console.log('file updated');\n\
    }\ncatch (err) {\n  console.log('file update failed:', err);\n}\n```\n\nIt’s possible\
    \ to *Promisify* any file system function using [`util.promisify`](https://nodejs.org/dist/latest/docs/api/util.html#util_util_promisify_original):\n\
    \n```\nconst\n  util = require('util'),\n  fs = require('fs'),\n  appendFilePromise\
    \ = util.promisify(fs.appendFile);\n\nappendFilePromise('myfile.txt', new Date())\n\
    \  .then(() => console.log('file updated'))\n  .catch(err => console.log('file\
    \ update failed:', err));\n```\n\nHowever, this is no longer necessary in recent\
    \ versions of Node.js, because [`fs.promises`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fs_promises_api)\
    \ provides Promise-based equivalents of all file system functions:\n\n```\nconst\n\
    \  fs = require('fs'),\n  fsPromise = fs.promise;\n\nfsPromise.appendFile('myfile.txt',\
    \ new Date())\n  .then(() => console.log('file updated'))\n  .catch(err => console.log('file\
    \ update failed:', err));\n```\n\nIf you’d like a refresher on callbacks, Promises\
    \ and async/await, check out our tutorial on [flow control in modern JavaScript](https://www.sitepoint.com/flow-control-callbacks-promises-async-await/).\n\
    \n### Step 1: File Utilities\n\nTo help save page counter data, we’re going to\
    \ add a number of utility functions to [`lib/fileutil.js`](https://github.com/sitepoint-editors/pagehit-file/blob/master/lib/fileutil.js).\
    \ Create this file and add a reference to the file system objects:\n\n```\n'use\
    \ strict';\n\nconst\n  fs = require('fs'),\n  fsPromise = fs.promises;\n```\n\n\
    An `info()` function returns an object containing information about a file or\
    \ directory, such as its type, permissions, and creation time. It uses two `fs`\
    \ functions:\n\n*   [access(path, mode)](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_access_path_mode):\
    \ can test for existence, read, and write permissions\n\n*   [stat](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_stat_path_options):\
    \ returns meta information including the type (file or directory) and creation\
    \ time\n\n```\n// returns information about a file/folder\nfunction info(fn) {\n\
    \n  const file = {\n    path:   fn,\n    exists: false,\n    read:   false,\n\
    \    write:  false,\n    isFile: false,\n    isDir:  false,\n    time:   0\n \
    \ };\n\n  // If the accessibility checks are successful, Promises are resolved\
    \ with no value\n  return Promise.all([\n    fsPromise.access(fn, fs.constants.F_OK),\n\
    \    fsPromise.access(fn, fs.constants.R_OK),\n    fsPromise.access(fn, fs.constants.W_OK)\n\
    \  ])\n    .then(fInfo => {\n\n      file.exists = !fInfo[0];\n\n      if (!file.exists)\
    \ return file;\n      else {\n\n        file.read  = !fInfo[1];\n        file.write\
    \ = !fInfo[2];\n\n        // Promise is resolved with the fs.Stats object for\
    \ the given path\n        return fsPromise.stat(fn)\n          .then(fStat =>\
    \ {\n\n            file.isFile = fStat.isFile();\n            file.isDir  = fStat.isDirectory();\n\
    \            file.time   = fStat.mtimeMs;\n            return file;\n\n      \
    \    })\n          .catch(() => file);\n\n      }\n\n    })\n    .catch(() =>\
    \ file);\n\n}\n```\n\nA `folderUsable()` function uses `info()` to check whether\
    \ a directory exists, creates it if necessary, and returns an associated information\
    \ object. The `fs` [`mkdir`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_mkdir_path_options)\
    \ method is used to create the directory:\n\n```\n// return folder info object\
    \ if it can be used\nasync function folderUsable(folder) {\n\n  try {\n\n    //\
    \ fetch folder information\n    let fInfo = await info(folder);\n\n    // create\
    \ folder if required\n    if (!fInfo.isDir) {\n      await fsPromise.mkdir(folder);\n\
    \      fInfo = await info(folder);\n    }\n\n    // folder accessible?\n    return\
    \ (fInfo.isDir && fInfo.read && fInfo.write ? fInfo : false);\n\n  }\n  catch\
    \ (err) {\n    console.log('folderUsable error:', err);\n    return false;\n \
    \ }\n\n}\n```\n\nA `folderList()` function returns an information object for every\
    \ file in a directory. It can optionally filter by file extension and sort by\
    \ a factor such as the creation date. The `fs` [`readdir`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_readdir_path_options)\
    \ method fetches all file names into an array. These are converted into information\
    \ objects using [`Promise.all`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all),\
    \ which executes asynchronous code in parallel:"
