    \n### Step 2: Main File (`index.js`)\n\nNode.js applications are launched from\
    \ a single file which loads all modules and implements the core logic. It’s named\
    \ `index.js` in this project, so create that file and add the following code:\n\
    \n```javascript\n'use strict';\n\nconst\n  // default HTTP port\n  port = 3000,\n\
    \n  // Node.js modules\n  http = require('http'),\n  url = require('url');\n\n\
    // new server\nhttp.createServer((req, res) => {\n\n  let uri = url.parse(req.url).pathname;\n\
    \  res.end(uri);\n\n}).listen(port);\n\nconsole.log(`page hit web service running\
    \ on port ${port}`);\n```\n\nSave the file and run it from the console using `npm\
    \ run debug`. Wait for the message:\n\n```\npage hit web service running on port\
    \ 3000\n```\n\nThen load [http://localhost:3000/hello/world](http://localhost:3000/hello/world)\
    \ in your browser. You should see this:\n\n```\n/hello/world\n```\n\nThe code\
    \ uses functionality in two Node.js modules: [HTTP](https://nodejs.org/dist/latest/docs/api/http.html)\
    \ and [URL](https://nodejs.org/dist/latest/docs/api/url.html). By default, Node.js\
    \ uses CommonJS `require` statements to reference code, although [experimental\
    \ support](https://nodejs.org/dist/latest/docs/api/esm.html) for [ES6 Modules](https://www.sitepoint.com/understanding-es6-modules/)\
    \ is available.\n\nThe code uses [`http.createServer`](https://nodejs.org/dist/latest/docs/api/http.html#http_http_createserver_options_requestlistener).\
    \ This returns an [`http.Server`](https://nodejs.org/dist/latest/docs/api/http.html#http_class_http_server)\
    \ object which [listens](https://nodejs.org/dist/latest/docs/api/http.html#http_server_listen)\
    \ for HTTP requests on port 3000 (defined as a constant).\n\nA function is passed\
    \ to `http.createServer` which is used to handle incoming requests. Two parameters\
    \ are defined:\n\n1. `req`: an incoming [HTTP request](https://nodejs.org/dist/latest/docs/api/http.html#http_http_request_url_options_callback)\
    \ information object\n\n2. `res`: an outgoing [HTTP response](https://nodejs.org/dist/latest/docs/api/http.html#http_class_http_serverresponse)\
    \ object for returning data\n\nThe code extracts the full URL used from `req.url`\
    \ (`http://localhost:3000/hello/world`) and passes it to the Node.js `URL` parsing\
    \ module to extract the [`pathname`](https://nodejs.org/dist/latest/docs/api/url.html#url_urlobject_pathname)\
    \ (`/hello/world`). The path is returned to the browser using [res.end()](https://nodejs.org/dist/latest/docs/api/http.html#http_response_end_data_encoding_callback).\n\
