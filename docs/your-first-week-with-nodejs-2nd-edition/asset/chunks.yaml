  trans: "\n\n```\n/* MONGOOSE SETUP */\n\nconst mongoose = require('mongoose');\n\
    const passportLocalMongoose = require('passport-local-mongoose');\n\nmongoose.connect('mongodb://localhost/MyDatabase',\n\
    \  { useNewUrlParser: true, useUnifiedTopology: true });\n\nconst Schema = mongoose.Schema;\n\
    const UserDetail = new Schema({\n  username: String,\n  password: String\n});\n\
    \nUserDetail.plugin(passportLocalMongoose);\nconst UserDetails = mongoose.model('userInfo',\
    \ UserDetail, 'userInfo');\n```\n\n在这里，我们引入了之前安装的包。然后，我们使用 `mongoose.connect`\
    \ 连接到数据库并提供数据库的路径。接下来，我们利用一个[Schema](http://mongoosejs.com/docs/guide.html) 来定义我们的数据结构。在这种情况下，我们正在创建一个包含\
    \ `username` 和 `password` 字段的 `UserDetail` 架构。\n\n最后，我们将 `passportLocalMongoose`\
    \ 作为插件添加到我们的 `Schema` 中。这将实现我们之前讨论过的那些“魔法”功能的一部分。然后，我们从该架构创建一个[model](http://mongoosejs.com/docs/models.html)。第一个参数是数据库中集合的名称。第二个参数是对我们\
    \ `Schema` 的引用，第三个参数是分配给 Mongoose 内部集合的名称。\n\nMongoose 的设置到此。我们现在可以继续实现 Passport\
    \ 策略了。\n\n## 实现本地身份验证 (Implementing Local Authentication)\n\n最后，这正是我们来此的目的！让我们设置本地身份验证。正如你在下方看到的，我们只需要编写为我们完成设置的代码：\n\
    \n```\n/* PASSPORT LOCAL AUTHENTICATION */\n\npassport.use(UserDetails.createStrategy());\n\
    \npassport.serializeUser(UserDetails.serializeUser());\npassport.deserializeUser(UserDetails.deserializeUser());\n\
    ```\n\n这里发生了一些非常神奇的操作。首先，通过在我们的 `UserDetails` 模型上调用 `createStrategy()`（多亏了 `passport-local-mongoose`\
    \ 的帮助），我们让 `passport` 使用本地策略——它会处理一切，这样我们就不需要设置策略了。非常方便。\n\n然后，我们正在使用 `serializeUser`（序列化用户）和\
    \ `deserializeUser`（反序列化用户）回调函数。第一个会在身份验证时调用，它的任务是用我们传递它的信息序列化用户实例，并通过 cookie\
    \ 将其存储在会话中。第二个会在后的每个请求中调用，以反序列化实例，提供唯一的 cookie 标识符作为“凭据”。你可以在[Passport 文档](http://www.passportjs.org/docs/configure/#sessions)中阅读更多信息。\n\
    \n## 路由 (Routes)\n\n现在让我们添加一些路由来将所有内容整合在一起。首先，我们将添加最后一个包。进入终端并运行以下命令：\n\n```\n\
    npm install connect-ensure-login\n```\n\n[connect-ensure-login](https://www.npmjs.com/package/connect-ensure-login)\
    \ 包是一个确保用户已登录的中间件。如果接收到未认证的请求，该请求将重定向到登录页面。我们将使用它来保护我们的路由。\n\n现在，在 `index.js`\
    \ 的底部添加以下内容：\n\n```\n/* ROUTES */\n\nconst connectEnsureLogin = require('connect-ensure-login');\n\
    \napp.post('/login', (req, res, next) => {\n  passport.authenticate('local',\n\
    \  (err, user, info) => {\n    if (err) {\n      return next(err);\n    }\n\n\
    \    if (!user) {\n      return res.redirect('/login?info=' + info);\n    }\n\n\
    \    req.logIn(user, function(err) {\n      if (err) {\n        return next(err);\n\
    \      }\n\n      return res.redirect('/');\n    });\n\n  })(req, res, next);\n\
    });\n\napp.get('/login',\n  (req, res) => res.sendFile('html/login.html',\n  {\
    \ root: __dirname })\n);\n\napp.get('/',\n  connectEnsureLogin.ensureLoggedIn(),\n\
    \  (req, res) => res.sendFile('html/index.html', {root: __dirname})\n);\n\napp.get('/private',\n\
    \  connectEnsureLogin.ensureLoggedIn(),\n  (req, res) => res.sendFile('html/private.html',\
    \ {root: __dirname})\n);\n\napp.get('/user',\n  connectEnsureLogin.ensureLoggedIn(),\n\
    \  (req, res) => res.send({user: req.user})\n);\n```\n\n在顶部，我们引入了 `connect-ensure-login`。我们稍后会回到这里。\n\
    \n接下来，我们设置了一个路由来处理对 `/login` 路径的 POST 请求。在处理程序内部，我们使用 [passport.authenticate](http://www.passportjs.org/docs/authenticate/)\
    \ 方法，它尝试用其作为第一个参数接收的策略进行身份验证——在这种情况下是 `local`。如果身份验证失败，它会将我们重定向到 `/login`，但它会添加一个查询参数——`info`，其中包含错误消息。否则，如果身份验证成功，它会将我们重定向到\
    \ `'/'` 路由。\n\n然后我们设置了 `/login` 路由，它将发送登录页面。为此，我们使用 [res.sendFile()](http://expressjs.com/en/api.html#res.sendFile)\
    \ 并传入文件路径和我们的根目录，即我们正在工作的目录——因此使用了 `__dirname`）。\n\n`/login` 任何人都可以访问，但我们后面的路由不会。\n\
    \n## 客户端 (The Client)\n\n客户端应该非常简单。让我们从主页开始。在项目根目录下创建一个 `html` 文件夹，并添加一个 `index.html`\
    \ 文件。添加以下内容：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta\
    \ charset=\"UTF-8\" />\n  <title> Home </title>\n  <link rel=\"stylesheet\" href=\"\
    css/styles.css\">\n</head>\n\n<body>\n  <div class=\"message-box\">\n    <h1 id=\"\
    welcome-message\"></h1>\n    <a href=\"/private\">Go to private area</a>\n  </div>\n\
    \n  <script>\n    const req = new XMLHttpRequest();\n    req.onreadystatechange\
    \ = function () {\n      if (req.readyState == 4 && req.status == 200) {\n   \
    \     const user = JSON.parse(req.response).user;\n        document.getElementById(\"\
    welcome-message\").innerText = `Welcome ${user.username}!!`;\n      }\n    };\n\
    \    req.open(\"GET\", \"http://localhost:3000/user\", true);\n    req.send();\n\
    \  </script>\n</body>\n</html>\n```\n\n这里有一个空的 h1 标签，我们将在其中放置欢迎消息，下方是一个指向 `/private`\
    \ 的链接。这里的关键是底部的 `script` 标签，我们将在这里处理用户名以创建欢迎消息。\n\n这分为四个部分：\n\n1.  使用 `new XMLHttpRequest()`\
    \ 实例化请求对象。\n2.  设置 `onreadystatechange` 属性，该函数将在收到答案后被调用。在回调函数中，我们检查是否收到了成功响应，如果是，我们解析响应，获取用户对象（我们在\
    \ `/user` 路由中发送的那个，记得吗？），并找到 `welcome-message` 元素设置其 `innerText`。\n3.  使用 `open()`\
    \ 打开用户 URL 的 `GET` 请求，并将最后一个参数设置为 `true` 以使其变为异步的。\n4.  最后，我们调用 `send()` 请求。\n\
    \n现在我们将创建登录页面。和之前一样，在 HTML 文件夹中创建一个名为 `login.html` 的文件并向其中添加以下内容：\n\n"
