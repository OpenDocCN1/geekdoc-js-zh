    form-actions\">\n    <button class=\"btn\" type=\"submit\">Send</button>\n  </div>\n\
    </form>\n```\n\n在 `http://localhost:3000/contact` 提交表单以查看运行效果。这就是我们在视图端需要的所有内容。\n\
    \n## 验证与清洗\n\n有一个名为 [express-validator](https://www.npmjs.com/package/express-validator)\
    \ 的方便中间件，用于使用 [validator.js](https://github.com/chriso/validator.js) 库对数据进行验证和清洗。让我们将其添加到应用程序中。\n\
    \n### 验证\n\n通过提供的[验证器]，我们可以轻松地检查是否提供了消息和有效的电子邮件地址：\n\n"
- fmt: "\n```javascript\n// routes.js\nconst { check, validationResult, matchedData\
    \ } = require('express-validator');\n\nrouter.post('/contact', [\n  check('message')\n\
    \    .isLength({ min: 1 })\n    .withMessage('Message is required'),\n  check('email')\n\
    \    .isEmail()\n    .withMessage('That email doesn‘t look right')\n], (req, res)\
    \ => {\n  const errors = validationResult(req);\n  res.render('contact', {\n \
    \   data: req.body,\n    errors: errors.mapped()\n  });\n});\n```\n\n### Sanitization\n\
    \nWith the [sanitizers](https://github.com/chriso/validator.js#sanitizers) provided,\
    \ we can trim whitespace from the start and end of the values, and normalize the\
    \ email address into a consistent pattern. This can help remove duplicate contacts\
    \ being created by slightly different inputs. For example, `' Mark@gmail.com'`\
    \ and `'mark@gmail.com '` would both be sanitized into `'mark@gmail.com'`.\n\n\
    Sanitizers can simply be chained onto the end of the validators:\n\n```javascript\n\
    // routes.js\nrouter.post('/contact', [\n  check('message')\n    .isLength({ min:\
    \ 1 })\n    .withMessage('Message is required')\n    .trim(),\n  check('email')\n\
    \    .isEmail()\n    .withMessage('That email doesn‘t look right')\n    .bail()\n\
    \    .trim()\n    .normalizeEmail()\n], (req, res) => {\n  const errors = validationResult(req);\n\
    \  res.render('contact', {\n    data: req.body,\n    errors: errors.mapped()\n\
    \  });\n\n  const data = matchedData(req);\n  console.log('Sanitized:', data);\n\
    });\n```\n\nThe `matchedData` function returns the output of the sanitizers on\
    \ our input.\n\nAlso, notice our use of the [bail](https://express-validator.github.io/docs/validation-chain-api.html#bail)\
    \ method, which stops running validations if any of the previous ones have failed.\
    \ We need this because if a user submits the form without entering a value into\
    \ the email field, the `normalizeEmail` will attempt to normalize an empty string\
    \ and convert it to an `@`. This will then be inserted into our email field when\
    \ we re-render the form.\n\n## The Valid Form\n\nIf there are errors, we need\
    \ to re-render the view. If not, we need to do something useful with the data\
    \ and then show that the submission was successful. Typically, the person is redirected\
    \ to a success page and shown a message.\n\nHTTP is stateless, so you can’t redirect\
    \ to another page *and* pass messages along without the help of a [session cookie](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies)\
    \ to persist that message between HTTP requests. A “flash message” is the name\
    \ given to this kind of one-time-only message we want to persist across a redirect\
    \ and then disappear.\n\nThere are three middlewares we need to include to wire\
    \ this up:\n\n```javascript\n// server.js\nconst cookieParser = require('cookie-parser');\n\
    const session = require('express-session');\nconst flash = require('express-flash');\n\
    \nconst middlewares = [\n  // ...\n  cookieParser(),\n  session({\n    secret:\
    \ 'super-secret-key',\n    key: 'super-secret-cookie',\n    resave: false,\n \
    \   saveUninitialized: false,\n    cookie: { maxAge: 60000 }\n  }),\n  flash(),\n\
    ];\n```\n\nThe `express-flash` middleware adds `req.flash(type, message)`, which\
    \ we can use in our route handlers:\n\n```javascript\n// routes\nrouter.post('/contact',\
    \ [\n  // validation ...\n], (req, res) => {\n  const errors = validationResult(req);\n\
    \  if (!errors.isEmpty()) {\n    return res.render('contact', {\n      data: req.body,\n\
    \      errors: errors.mapped()\n    });\n  }\n\n  const data = matchedData(req);\n\
    \  console.log('Sanitized: ', data);\n  // Homework: send sanitized data in an\
    \ email or persist to a db\n\n  req.flash('success', 'Thanks for the message!\
    \ I‘ll be in touch :)');\n  res.redirect('/');\n});\n```\n\nThe `express-flash`\
    \ middleware adds `messages` to `req.locals` which all views have access to:\n\
    \n```html\n<!-- views/index.ejs -->\n<% if (messages.success) { %>\n  <div class=\"\
    flash flash-success\"><%= messages.success %></div>\n<% } %>\n\n<h1>Working With\
    \ Forms in Node.js</h1\n```\n\nYou should now be redirected to the `index` view\
    \ and see a success message when the form is submitted with valid data. Huzzah!\
    \ We can now deploy this to production and be sent messages by the prince of Nigeria.\
    \ You can [find an online demo of this at CodeSandbox](https://codesandbox.io/embed/priceless-butterfly-u3557).\n\
    \n### Sending Email with Node\n\nYou might have noticed that the actual sending\
    \ of the mail is left to the reader as homework. This is not as difficult as it\
    \ might sound and can be accomplished using the [Nodemailer package](https://www.npmjs.com/package/nodemailer).\
    \ You can find [bare-bones instructions on how to set this up here](https://www.w3schools.com/nodejs/nodejs_email.asp),\
    \ or a [more in-depth tutorial here].\n\n## Security Considerations\n\nYou need\
    \ to take care when displaying user-submitted data in an HTML view as it can open\
    \ you up to [cross-site scripting(XSS)](https://developer.mozilla.org/en-US/docs/Glossary/Cross-site_scripting).\
    \ All template languages provide different methods for outputting values. The\
    \ EJS `<%= value %>` outputs the *HTML escaped* value to protect you from XSS,\
    \ whereas `<%- value %>` outputs a raw string.\n\n### TLS over HTTPS\n\nAlways\
    \ use TLS over `https`. There’s a neat little called [helmet](https://helmetjs.io/)\
    \ that adds some security headers include right at the top of your middlewares:\n\
    \n```javascript\n// server.js\nconst helmet = require('helmet');\n\nmiddlewares\
    \ = [\n  helmet(),\n  // ...\n];\n```\n\n### Cross-site Request Forgery (CSRF)\n\
    \nYou can protect yourself against [cross-site request forgery](https://en.wikipedia.org/wiki/Cross-site_forgery)\
    \ by generating a unique token when the user is presented with a form and then\
    \ validating that token before the POST data is processed. There’s [middleware](https://expressjs.com/resources/middleware/)\
    \ to help you out as well:\n\n```javascript\n// routes.js\nconst csrf = require('csurf');\n\
    const csrfProtection = csrf({ cookie: true });\n```\n\nIn the GET request, we\
    \ generate a token:\n\n```javascript\n// routes.js\nrouter.get('/contact', csrfProtection,\
    \ (req, res) => {\n  res.render('contact', {\n    data: {},\n    errors: {},\n\
    \    csrfToken: req.csrfToken()\n  });\n});\n```\n\nAnd also in the validation\
    \ errors:\n\n```javascript\n// routes.js\nrouter.post('/contact', csrfProtection,\
    \ [\n  // validations ...\n], (req, res) => {\n  const errors = validationResult(req);\n\
    \  if (!errors.isEmpty()) {\n    return res.render('contact', {\n      data: req.body,\n\
    \      errors: errors.mapped(),\n      csrfToken: req.csrfToken()\n    });\n \
    \ }\n\n  // ...\n});\n```\n\nThen we just need include the token in a hidden input:\n\
    \n```html\n<!-- view/contact.ejs -->\n<form method=\"post\" action=\"/contact\"\
    \ novalidate>\n  <input type=\"hidden\" name=\"_csrf\" value=\"<%= csrfToken %>\"\
    >\n  <!-- ... -->\n</form>\n```\n\nThat’s all that’s required.\n\nWe don’t need\
    \ to modify our POST request handler, as all POST requests will now require a\
    \ valid token by the `csurf` middleware. If a valid CSRF token isn’t provided,\
    \ a `ForbiddenError` will be thrown, which can be handled by the error handler\
    \ defined at the end of `server.js`.\n\nYou can test this out yourself by editing\
    \ or removing the token from the form with your browser’s developer tools and\
    \ submitting.\n"
