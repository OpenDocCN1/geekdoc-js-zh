  trans: "\n\n# 优化 JavaScript 代码\n\nHTML 是一项健壮的技术；即使是不支持 HTML5 的旧版浏览器也能显示内容。同样，CSS\
    \ 可能会下载失败或存在代码错误，但页面仍然可见。相比之下，JavaScript 是脆弱的且计算开销巨大的。单个错误、不支持的命令或长运行任务都可能阻止后续代码的执行。\n\
    \n很难推荐具体的 JavaScript 优化方案，因为所有应用程序各不相同，但有一些通用的技巧可以提高性能。尽管如此，要警惕微优化（micro-optimizations），这些优化可能只能节省几毫秒，但调用频率不足以产生显著影响。请使用浏览器的开发者工具来检查是否获得了任何提升。\n\
    \n### 谨慎使用 JavaScript\n\n如果浏览器仅通过 HTML 和或 CSS 就能完成某些操作，那应该是你的首选。你可以在需要时应用渐进式增强（下文讨论）。\n\
    \n现代浏览器已经实现了许多以前需要的功能，例如[表单验证](https://developer.mozilla.org/docs/Learn/HTML/Forms/Form_validation)、[字段自动补全](https://developer.mozilla.org/docs/Web/HTML/Element/datalist)、[动画](https://developer.mozilla.org/docs/Web/CSS/animation)、[视频](https://developer.mozilla.org/docs/Web/HTML/Element/video)、[展开文本](https://developer.mozilla.org/docs/Web/HTML/Element/details)、[模态对话框](https://developer.mozilla.org/docs/Web/HTML/Element/dialog)等。虽然会面临挑战——问问任何尝试过为`<select>`\
    \ 下拉菜单设置样式的人——但原生功能总是更快且使用的代码更少。\n\n考虑使用 HTML `<button>` 而不是 `<div>` 作为表单提交按钮。HTML\
    \ 代码的起始方式相似：\n\n```\n<button>submit</button>\n```\n\n在 CSS 中设置 `div` 样式可能更简单：\n\
    \n```\n<div class=\"button\">submit</div>\n```\n\n然而，HTML `<button>`：\n\n1. 提供了默认样式，看起来像操作系统的按钮\n\
    2. 即使 CSS 或 JavaScript 失败，在所有浏览器中也均可工作\n3. 在页面加载时且 JavaScript 开始执行之前立即生效\n4. 会自动提交其父级\
    \ `<form>`（如果通过了有效性检查）\n5. 可以通过鼠标、触摸屏、键盘或任何输入设备操作\n6. 可以接收焦点，并接受按键快捷键\n7. 不需要\
    \ ARIA 角色或其他辅助功能\n\n在 CSS 和 JavaScript 模拟的按钮需要投入大量精力，而且其功能性永远不如原生的 HTML 方案。\n\n\
    ### 避免长运行任务\n\n长运行任务通常会触发浏览器“无响应”消息，提示用户停止 JavaScript 执行。复杂的处理最好交由 [Web Worker](https://developer.mozilla.org/docs/Web/API/Web_Workers_API/Using_web_workers)\
    \ 处理，它允许脚本在后台线程中运行。\n\nWeb Worker 脚本是有限制的。它们无法与页面 DOM 交互，必须使用消息 API 与主脚本进行通信，但它们能够执行\
    \ Ajax 请求并启动自己的子 Worker。\n\n### 谨慎绑定事件\n\n应用程序可能会有几十个事件处理器。当事件在特定的 DOM 元素上触发时，处理函数就会注册到该事件上——例如在\
    \ `myElement` 节点上检测到点击时运行 `doSomething()` 函数：\n\n```\nmyElement.addEventListener('click',\
    \ doSomething);\n```\n\n每个绑定的事件都有性能损耗。理想情况下，你应该只添加所需的事件，从处理函数中快速返回，并在事件不再需要时使用\
    \ [removeEventListener](https://developer.mozilla.org/docs/Web/API/EventTarget/removeEventListener)\
    \ 解绑。\n\n同样要警惕如 `mousemove` 和 `scroll` 等快速触发的事件，它们可能会触发处理函数快速且浪费的重新运行。解决此问题的方法是使用节流（throttling），确保事件每\
    \ `N` 毫秒最多调用一次。例如：\n\n```javascript\n// 节流事件以延迟 ms\nfunction eventThrottle(element,\
    \ event, callback, delay = 300) {\n\n  let throttle;\n  element.addEventListener(event,\
    \ (e) => {\n\n    throttle = throttle || setTimeout(() => {\n      throttle =\
    \ null;\n      callback(e);\n    }, delay);\n\n  }, false);\n\n}\n\n// 每 300ms\
    \ 不多调用一次 windowScrollHandler\neventThrottle(window, 'scroll', windowScrollHandler);\n\
    ```\n\n或者，可以使用防抖（debouncing）来确保处理器在事件停止被触发 `N` 毫秒后才被调用：\n\n```javascript\n// 直到事件不再发生\
    \ delay ms 后防抖事件\nfunction eventDebounce(element, event, callback, delay = 300)\
    \ {\n\n  let debounce;\n  element.addEventListener(event, (e) => {\n    clearTimeout(debounce);\n\
    \    debounce = setTimeout(() => callback(e), delay);\n  }, false);\n\n}\n\n//\
    \ 当距离上一次事件至少过去 300ms 后调用 windowScrollHandler\neventThrottle(window, 'scroll',\
    \ windowScrollHandler);\n```\n\n最后，记住有效利用事件委托。例如，假设你有一个有一个包含数千个单元格的 HTML `<table>`，并想对\
    \ `<td>` 的点击做出反应。在每个单元格上附加事件需要大量的处理，并且如果表格发生变化需要重新应用。相反，你可以在 `<table>` 元素上挂载单个事件处理器并检查目标。例如：\n\
    \n```javascript\n// 处理对任何 <td> 的点击\ndocument.getElementById('mytable').addEventListener('click',\
    \ (e) => {\n\n  let t = e.target.closest('td');\n  if (!t) return;\n\n  console.log('clicked\
    \ cell', t);\n\n});\n```\n\n### 分析修改后的代码\n\n很少遇到在到达浏览器之前未经过修改的代码\n\n* 代码压缩工具（Minifiers）尝试进行优化，如重新排列行或扩展循环。\n\
    * 如 Babel 等转译器将 ES6 转换为 ES5。\n* TypeScript、CoffeeScript 和 Flow 等编译器将备选语法或超集语法转换为\
    \ JavaScript。\n* 诸如 [Blazor](https://dotnet.microsoft.com/apps/aspnet/web-apps/blazor)的项目将\
    \ C# 转换为 [WebAssembly](https://webassembly.org/)——这是一种类似于汇编的底层语言，在 JavaScript\
    \ 引擎中提供接近原生的性能。\n\n所有这些都提供了稳定性能优势，但请检查转换是否优化，并确保没有必要地导入几 KB 的转换器代码。例如，考虑以下用于 32\
    \ 字节的 ES6 [for...of](https://developer.mozilla.org/docs/Web/JavaScript/Reference/Statements/for...of)\
    \ 循环：\n\n```javascript\nfor (let p of n) console.log(p);\n```\n\n这会导致 598 字节的\
    \ Babel 转换代码。每个额外的循环都会添加类似数量的代码，且没有任何一个可以在 IE11 中运行——这在某种违背了转换的意义！可以考虑的选项：\n\n\
    * 使用 ES5 或更高效的转译器 ES6 代码来实现相同结果。\n* 使用差异化加载（differential loading），为现代浏览器提供[基于\
    \ ES6 模块的代码](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules)，并为旧版应用程序提供较大的转换脚本。\n\
    * 放弃对不支持 ES6 的浏览器（主要是 IE）。如果你采用服务器端渲染和渐进式增强技术，你的网站或应用程序可以保持可用。\n\n### 有效地修改 DOM\n\
    \n某些现代 JavaScript 框架实现了虚拟 DOM。当你更改页面元素时，虚拟 DOM 会计算出哪些变化，并决定如何以及何时进行修改。最终，它仍然必须更改真实的\
    \ DOM，你可以进行类似的优化以提高性能，而无需虚拟 DOM 计算的额外开销。\n\n### 缓存频繁使用的节点\n\n频繁使用的 DOM 节点应该存储在\
    \ JavaScript 变量中，这样它们就不需要重新获取。即使修改其他树节点，DOM 引用也会保留。\n\n"
- fmt: "\n```javascript\nconst\n  main    = document.getElementsByTagName('main')[0],\n\
    \  heading = main.querySelector('h1'),\n  tables  = main.getElementsByTagName('table');\n\
    ```\n\n### Search from Any Node\n\nRather than searching the whole tree from `document`,\
    \ many DOM methods allow you to start from any node. The example above searches\
    \ for the first heading and tables within the `<main>` element.\n\n[`querySelector()`](https://developer.mozilla.org/docs/Web/API/Element/querySelector)\
    \ and [`querySelectorAll()`](https://developer.mozilla.org/docs/Web/API/Element/querySelector)\
    \ can find elements using jQuery-like CSS selectors. They’re usually slower than\
    \ [`getElementById()`](https://developer.mozilla.org/docs/Web/API/Document/getElementById),\
    \ [`getElementsByTagName()`](https://developer.mozilla.org/docs/Web/API/Element/getElementsByTagName)\
    \ and [`getElementsByClassName()`](https://developer.mozilla.org/docs/Web/API/Element/getElementsByClassName),\
    \ although the speed difference is unlikely to affect most applications.\n\n###\
    \ Running Benchmarks\n\nTools such as [jsPerf.com](https://jsperf.com/) provide\
    \ a way to create code snippets and run benchmarks on any browser to prove the\
    \ efficiency—or inefficiency—of alternative functions.\n\n[`getElementsByTagName()`](https://developer.mozilla.org/docs/Web/API/Element/getElementsByTagName)\
    \ and [`getElementsByClassName()`](https://developer.mozilla.org/docs/Web/API/Element/getElementsByClassName)\
    \ also return `live` HTMLCollections, which update automatically as the DOM is\
    \ modified—so that it’s not necessary to rerun the query.\n\n### Minimize Reflows\n\
    \nWhen an element is added, modified, or removed from a page, it can trigger a\
    \ cascade of layout changes to surrounding elements. For example, increasing a\
    \ width by 1px could result in a neighboring element wrapping to the next line,\
    \ which pushes all subsequent content down the page. It’s therefore more efficient\
    \ to make changes that can’t impact the layout. For example:\n\n* use [opacity](https://developer.mozilla.org/docs/Web/CSS/opacity)\
    \ and/or [transform](https://developer.mozilla.org/docs/Web/CSS/transform) to\
    \ translate (move), scale, or rotate an element\n\n* limit the scope of the reflow\
    \ by changing elements low in the DOM tree (those without deeply nested children)\n\
    \n* update elements in their own `position: absolute;` or `position: fixed;` layer\n\
    \n* modify hidden elements (`display: none;`), then show them after the change\
    \ has been applied\n\n### Batch-update Styles\n\nThe following example could cause\
    \ three reflows:\n\n```javascript\nlet myelement = document.getElementById('myelement');\n\
    myelement.width = '100px';\nmyelement.height = '200px';\nmyelement.style.margin\
    \ = '10px';\n```\n\nPerformance can be improved by appending a class:\n\n```javascript\n\
    let myelement = document.getElementById('myelement');\nmyelement.classList.add('newstyles');\n\
    ```\n\nThis applies CSS properties in one reflow operation:\n\n```css\n.newstyles\
    \ {\n  width: 100px;\n  height: 200px;\n  margin: 10px;\n}\n```\n\n### Batch-update\
    \ Elements\n\nTry to minimize the number of times you interact with the DOM. An\
    \ empty [DocumentFragment](https://developer.mozilla.org/docs/Web/API/DocumentFragment)\
    \ can be used to build elements in memory before applying those changes to the\
    \ page. For example, you can create an unordered list with three items like so:\n\
    \n```javascript\n// create list\nlet\n  frag = document.createDocumentFragment(),\n\
    \  ul = frag.appendChild( document.createElement('ul') );\n\nfor (let i = 1; i\
    \ <= 3; i++) {\n  let li = ul.appendChild( document.createElement('li') );\n \
    \ li.textContent = 'item ' + i;\n}\n\n// append list to the DOM\ndocument.body.appendChild(frag);\n\
    ```\n\nThe DOM is only modified on the last line.\n\n### Use requestAnimationFrame\n\
    \nThe [window.requestAnimationFrame()](https://developer.mozilla.org/docs/Web/API/window/requestAnimationFrame)\
    \ method calls a function just before the browser performs the next repaint—normally\
    \ once every sixtieth of a second (approximately every 17ms, presuming no other\
    \ render-blocking processes are occurring). It’s normally used for animating frames\
    \ in HTML5 games, although running it before any DOM update will be beneficial.\
    \ For example:\n\n```javascript\nfunction updateDOM() {\n  let p = document.createElement('p');\n\
    \  p.textContent = 'new element';\n  document.body.appendChild( p );\n}\n\nrequestAnimationFrame(\
    \ updateDOM );\n```\n\n### Consider Progressive Rendering\n\nRather than using\
    \ a single site-wide CSS file, `progressive rendering` is a technique that defines\
    \ individual style sheets for separate components. Each is loaded immediately\
    \ before the component is referenced in the HTML:\n\n```html\n<head>\n  <!-- core\
    \ styles used across components -->\n  <link rel='stylesheet' href='base.css'\
    \ />\n</head>\n<body>\n  <!-- header component -->\n  <link rel='stylesheet' href='header.css'\
    \ />\n  <header>...</header>\n\n  <!-- primary content -->\n  <link rel='stylesheet'\
    \ href='content.css' />\n  <main>\n    <!-- form styling -->\n    <link rel='stylesheet'\
    \ href='form.css' />\n    <form>...</form>\n  </main>\n\n  <!-- header component\
    \ -->\n  <link rel='stylesheet' href='footer.css' />\n  <footer>...</footer>\n\
    </body>\n```\n\nEach `link` still blocks rendering, but the file is smaller. The\
    \ page is usable sooner, since content loads. There’s [some variation in how browsers\
    \ treat progressive rendering](https://jakearchibald.com/2016/link-in-body/),\
    \ but the worst-case scenario is that the browser blocks until all discovered\
    \ CSS files have loaded.\n"
  raw: "```\nconst\n  main    = document.getElementsByTagName('main')[0],\n  heading\
    \ = main.querySelector('h1'),\n  tables  = main.getElementsByTagName('table');\n\
    ```\n\n#### Search from Any Node\n\nRather than searching the whole tree from\
    \ `document`, many DOM methods allow you to start from any node. The example above\
    \ searches for the first heading and tables within the `<main>` element.\n\n[`querySelector()`](https://developer.mozilla.org/docs/Web/API/Element/querySelector)\
    \ and [`querySelectorAll()`](https://developer.mozilla.org/docs/Web/API/Element/querySelector)\
    \ can find elements using jQuery-like CSS selectors. They’re usually slower than\
    \ [`getElementById()`](https://developer.mozilla.org/docs/Web/API/Document/getElementById),\
    \ [`getElementsByTagName()`](https://developer.mozilla.org/docs/Web/API/Element/getElementsByTagName)\
    \ and [`getElementsByClassName()`](https://developer.mozilla.org/docs/Web/API/Element/getElementsByClassName),\
    \ although the speed difference is unlikely to affect most applications.\n\n####\
    \ Running Benchmarks\n\nTools such as [jsPerf.com](https://jsperf.com/) provide\
    \ a way to create code snippets and run benchmarks on any browser to prove the\
    \ efficiency—or inefficiency—of alternative functions.\n\n[`getElementsByTagName()`](https://developer.mozilla.org/docs/Web/API/Element/getElementsByTagName)\
    \ and [`getElementsByClassName()`](https://developer.mozilla.org/docs/Web/API/Element/getElementsByClassName)\
    \ also return *live* HTMLCollections, which update automatically as the DOM is\
    \ modified—so that it’s not necessary to rerun the query.\n\n### Minimize Reflows\n\
    \nWhen an element is added, modified, or removed from a page, it can trigger a\
    \ cascade of layout changes to surrounding elements. For example, increasing a\
    \ width by 1px could result in a neighboring element wrapping to the next line,\
    \ which pushes all subsequent content down the page. It’s therefore more efficient\
    \ to make changes that can’t impact the layout. For example:\n\n*   use [opacity](https://developer.mozilla.org/docs/Web/CSS/opacity)\
    \ and/or [transform](https://developer.mozilla.org/docs/Web/CSS/transform) to\
    \ translate (move), scale, or rotate an element\n\n*   limit the scope of the\
    \ reflow by changing elements low in the DOM tree (those without deeply nested\
    \ children)\n\n*   update elements in their own `position: absolute;` or `position:\
    \ fixed;` layer\n\n*   modify hidden elements (`display: none;`), then show them\
    \ after the change has been applied\n\n### Batch-update Styles\n\nThe following\
    \ example could cause three reflows:\n\n```\nlet myelement = document.getElementById('myelement');\n\
    myelement.width = '100px';\nmyelement.height = '200px';\nmyelement.style.margin\
    \ = '10px';\n```\n\nPerformance can be improved by appending a class:\n\n```\n\
    let myelement = document.getElementById('myelement');\nmyelement.classList.add('newstyles');\n\
    ```\n\nThis applies CSS properties in one reflow operation:\n\n```\n.newstyles\
    \ {\n  width: 100px;\n  height: 200px;\n  margin: 10px;\n}\n```\n\n### Batch-update\
    \ Elements\n\nTry to minimize the number of times you interact with the DOM. An\
    \ empty [DocumentFragment](https://developer.mozilla.org/docs/Web/API/DocumentFragment)\
    \ can be used to build elements in memory before applying those changes to the\
    \ page. For example, you can create an unordered list with three items like so:\n\
    \n```\n// create list\nlet\n  frag = document.createDocumentFragment(),\n  ul\
    \ = frag.appendChild( document.createElement('ul') );\n\nfor (let i = 1; i <=\
    \ 3; i++) {\n  let li = ul.appendChild( document.createElement('li') );\n  li.textContent\
    \ = 'item ' + i;\n}\n\n// append list to the DOM\ndocument.body.appendChild(frag);\n\
    ```\n\nThe DOM is only modified on the last line.\n\n### Use requestAnimationFrame\n\
    \nThe [window.requestAnimationFrame()](https://developer.mozilla.org/docs/Web/API/window/requestAnimationFrame)\
    \ method calls a function just before the browser performs the next repaint—normally\
    \ once every sixtieth of a second (approximately every 17ms, presuming no other\
    \ render-blocking processes are occurring). It’s normally used for animating frames\
    \ in HTML5 games, although running it before any DOM update will be beneficial.\
    \ For example:\n\n```\nfunction updateDOM() {\n  let p = document.createElement('p');\n\
    \  p.textContent = 'new element';\n  document.body.appendChild( p );\n}\n\nrequestAnimationFrame(\
    \ updateDOM );\n```\n\n## Consider Progressive Rendering\n\nRather than using\
    \ a single site-wide CSS file, **progressive rendering** is a technique that defines\
    \ individual style sheets for separate components. Each is loaded immediately\
    \ before the component is referenced in the HTML:\n\n```\n<head>\n\n  <!-- core\
    \ styles used across components -->\n  <link rel='stylesheet' href='base.css'\
    \ />\n\n</head>\n<body>\n\n  <!-- header component -->\n  <link rel='stylesheet'\
    \ href='header.css' />\n  <header>...</header>\n\n  <!-- primary content -->\n\
    \  <link rel='stylesheet' href='content.css' />\n  <main>\n\n    <!-- form styling\
    \ -->\n    <link rel='stylesheet' href='form.css' />\n    <form>...</form>\n\n\
    \  </main>\n\n  <!-- header component -->\n  <link rel='stylesheet' href='footer.css'\
    \ />\n  <footer>...</footer>\n\n</body>\n```\n\nEach `<link>` still blocks rendering,\
    \ but for a shorter time, because the file is smaller. The page is usable sooner,\
    \ since each component renders in sequence; the top of the page can be viewed\
    \ while remaining content loads. A similar approach is often adopted by [Web Components](https://developer.mozilla.org/docs/Web/Web_Components),\
    \ which encapsulate CSS within the code.\n\nThe technique can be less practical\
    \ in templates where the content dictates the layout (Flexbox and tables), since\
    \ reflows are triggered more frequently as the page loads. Grid-based page layouts\
    \ are generally more suitable.\n\nThere’s [some variation in how browsers treat\
    \ progressive rendering](https://jakearchibald.com/2016/link-in-body/#changes-to-chrome),\
    \ but the worst-case scenario is that the browser blocks rendering until all discovered\
    \ CSS files have loaded. That’s no worse than loading each in the `<head>`.\n\n\
    Progressive rendering could benefit large sites where individual pages are constructed\
    \ from a varied selection of different components.\n\n## Use Server-side Rendering\n\
    \nWhich process is quicker?\n\nProcess 1 (typically used by JavaScript frameworks):\n\
    \n1.  Request a URL.\n\n2.  Respond with a (mostly) empty HTML file.\n\n3.  Download\
    \ and execute JavaScript.\n\n4.  Use Ajax or similar techniques to fetch content\
    \ according to the URL.\n\n5.  Load the content into the page body.\n\nProcess\
    \ 2 (old-school method):\n\n1.  Request a URL.\n\n2.  Respond with the full HTML.\n\
    \nServer-side rendering is always quicker for the initial page load.\n\nLoading\
    \ a second page can be faster in Process 1, since it’s able to start at step 4\\\
    . Assets such as style sheets, JavaScript, and images may already be available\
    \ and parsed. Unfortunately, a large proportion of visitors may only view a single\
    \ page, and the payload is higher because a larger quantity of JavaScript is necessary.\n\
    \nThis is a better-performing process:\n\n1.  Request a URL.\n\n2.  Load HTML\
    \ directly from the server into the browser.\n\n3.  Download and execute JavaScript.\
    \ Some *rehydration* may be necessary to initiate components with HTML data.\n\
    \n4.  Use Ajax or similar techniques to fetch and populate content according to\
    \ URL navigation changes.\n\nThis can be more difficult to manage, since not all\
    \ JavaScript frameworks provide server-based rendering capabilities using Node.js,\
    \ PHP, Ruby, Python, and so on.\n\n## Do You Need a JavaScript or CSS Framework?\n\
    \nA CSS and/or JavaScript framework can provide a good development structure for\
    \ teams working on larger sites or applications. However, most are general-purpose\
    \ tools: they provide a range of features you may not need or may have to adapt.\
    \ Optimizing performance is often difficult because the core code isn’t under\
    \ your control."
