    \n```\n'use strict';\n\nconst\n  // default HTTP port\n  port = 3000,\n\n  //\
    \ Node.js modules\n  http = require('http'),\n  url = require('url');\n\n// new\
    \ server\nhttp.createServer((req, res) => {\n\n  let uri = url.parse(req.url).pathname;\n\
    \  res.end(uri);\n\n}).listen(port);\n\nconsole.log(`page hit web service running\
    \ on port ${port}`);\n```\n\nSave the file and run it from the console using `npm\
    \ run debug`. Wait for the message:\n\n```\npage hit web service running on port\
    \ 3000\n```\n\nThen load [http://localhost:3000/hello/world](http://localhost:3000/hello/world)\
    \ in your browser. You should see this:\n\n```\n/hello/world\n```\n\nThe code\
    \ uses functionality in two Node.js modules: [HTTP](https://nodejs.org/dist/latest/docs/api/http.html)\
    \ and [URL](https://nodejs.org/dist/latest/docs/api/url.html). By default, Node.js\
    \ uses CommonJS `require` statements to reference code, although [experimental\
    \ support](https://nodejs.org/dist/latest/docs/api/esm.html) for [ES6 Modules](https://www.sitepoint.com/understanding-es6-modules/)\
    \ is available.\n\nThe code uses [`http.createServer`](https://nodejs.org/dist/latest/docs/api/http.html#http_http_createserver_options_requestlistener).\
    \ This returns an [`http.Server`](https://nodejs.org/dist/latest/docs/api/http.html#http_class_http_server)\
    \ object which [listens](https://nodejs.org/dist/latest/docs/api/http.html#http_server_listen)\
    \ for HTTP requests on port 3000 (defined as a constant).\n\nA function is passed\
    \ to `http.createServer` which is used to handle incoming requests. Two parameters\
    \ are defined:\n\n1.  `req`: an incoming [HTTP request](https://nodejs.org/dist/latest/docs/api/http.html#http_http_request_url_options_callback)\
    \ information object\n\n2.  `res`: an outgoing [HTTP response](https://nodejs.org/dist/latest/docs/api/http.html#http_class_http_serverresponse)\
    \ object for returning data\n\nThe code extracts the full URL used from `req.url`\
    \ (`http://localhost:3000/hello/world`) and passes it to the Node.js `URL` parsing\
    \ module to extract the [`pathname`](https://nodejs.org/dist/latest/docs/api/url.html#url_urlobject_pathname)\
    \ (`/hello/world`). The path is returned to the browser using [res.end()](https://nodejs.org/dist/latest/docs/api/http.html#http_response_end_data_encoding_callback).\n\
    \nNode.js server frameworks such as [Express.js](https://expressjs.com/) all act\
    \ in a similar way. They parse an incoming request, route to code which can handle\
    \ that request, and output a response.\n\nPress `Ctrl`/`Cmd` + `C` to stop the\
    \ Node.js application running.\n\n### Step 3: Additional Modules\n\nIt’s practical\
    \ to split code into other files with reusable chucks of related functionality.\
    \ Create a new `lib` directory. You can use any name you prefer except for `node_modules`.\
    \ Then add the following files within it:\n\n*   `lib/httpreferrer.js`: exports\
    \ a function which accepts an HTTP request object as a parameter. If this object\
    \ has a referer set, the function will concatinate its `protocol`, `host` and\
    \ `pathname` values, then return a 32-character MD5 hash of this string. The URL\
    \ and [Crypto](https://nodejs.org/dist/latest/docs/api/crypto.html) modules are\
    \ used:\n\n    ```\n     'use strict';\n\n      const\n        url = require('url'),\n\
    \        crypto = require('crypto');\n\n      module.exports = (req) => {\n\n\
    \        let\n          r = url.parse(req.headers.referer || ''),\n          ref\
    \ = r.href ? r.protocol + r.host + r.pathname : null;\n\n        return ref ?\
    \ crypto.createHash('md5').update(ref).digest('hex') : null;\n\n      };\n   \
    \ ```\n\n*   `lib/httpresponse.js`: exports a function which, when passed an object\
    \ containing an HTTP response object, responds with the appropriate HTTP headers\
    \ and content:\n\n    ```\n     'use strict';\n\n      module.exports = ({\n \
    \       res     = null,\n        status  = 200,\n        mime    = 'text/plain',\n\
    \        content = ''\n      }) => {\n\n        res.writeHead(status, {\n    \
    \      'Access-Control-Allow-Origin': '*',\n          'Content-Type': mime,\n\
    \          'Cache-Control': 'must-revalidate, max-age=0',\n          'Content-Length':\
    \ Buffer.byteLength(content)\n        });\n        res.end(content);\n\n     \
    \ };\n    ```\n\n    Note that `Access-Control-Allow-Origin` is a [cross-origin\
    \ resource sharing (CORS)](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS)\
    \ header which allows any page to use the page hit service.\n\n*   `lib/pagehit.js`:\
    \ exports a JavaScript class responsible for recording page hits in a `this.counter`\
    \ property:\n\n    ```\n     const httpReferrer = require('./httpreferrer');\n\
    \n      module.exports = class {\n\n        // initialize\n        constructor()\
    \ {\n\n          // counter storage\n          this.counter = {};\n\n        }\n\
    \n        // increase URL counter\n        count(req) {\n\n          let hash\
    \ = httpReferrer(req);\n          if (!hash) return null;\n\n          // define\
    \ count default\n          this.counter[ hash ] = this.counter[ hash ] || 0;\n\
    \n          // return incremented count\n          return ++this.counter[ hash\
    \ ];\n        }\n\n      };\n    ```\n\nWhen the `count()` method is passed an\
    \ HTTP request object, it generates a hash (using `lib/httpreferrer.js` above).\
    \ This is used to initialize and increment a property of the `this.counter` object\
    \ which has its total count value returned.\n\nWe can now change `index.js` to\
    \ use these modules and implement a page hit system:\n\n```\n'use strict';\n\n\
    const\n  // default HTTP port\n  port = 3000,\n\n  // Node.js modules\n  http\
    \ = require('http'),\n  url = require('url'),\n\n  // page counter object\n  pagehit\
    \ = new (require('./lib/pagehit'))(),\n\n  // HTTP response\n  httpResponse =\
    \ require('./lib/httpresponse');\n\n// new server\nhttp.createServer((req, res)\
    \ => {\n\n  // get referring page count\n  let count = pagehit.count(req);\n\n\
    \  // error: referring page not found\n  if (!count) {\n\n    httpResponse({ res,\
    \ status: 400, content: 'No referrer' });\n    return;\n\n  }\n\n  // send appropriate\
    \ response\n  let uri = url.parse(req.url).pathname;\n  switch (uri) {\n\n   \
    \ // JavaScript document.write() counter\n    case '/counter.js':\n\n      httpResponse({\n\
    \        res,\n        mime: 'application/javascript',\n        content: `document.write('<span\
    \ class=\"pagecounter\">${count}</span>');`\n      });\n      break;\n\n    //\
    \ error: invalid HTTP request\n    default:\n      httpResponse({ res, status:\
    \ 404, content: 'Not found' });\n      break;\n\n  }\n\n}).listen(port);\n\nconsole.log(`page\
    \ hit web service running on port ${port}`);\n```\n\nThe line `pagehit = new (require('./lib/pagehit'))()`\
    \ initializes an object from the `lib/pagehit.js` class, so the `count()` method\
    \ can be called in the server function.\n\nIn situations where no referring page\
    \ is found, `pagehit.count` returns `null`, so an HTTP 400 error response is returned.\n\
    \nThe `switch()` statement handles routing. In this case, only requests to `/counter.js`\
    \ are valid; a JavaScript `document.write()` statement is returned, which outputs\
    \ the value of `count`.\n\nThe [full `index.js` code](https://github.com/sitepoint-editors/pagehit-ram/blob/master/index.js)\
    \ provides additional responses for deferred JavaScript, Ajax, and SVG requests.\
    \ All other requests trigger an HTTP 404 error.\n\nStart the server again using\
    \ `npm run debug`.\n\n### Step 4: Test Page\n\nA counter must be added to a test\
    \ page to see the service in action. Create another folder, such as `testpages`,\
    \ with a file named `page-jswrite.html` containing the following code:"
