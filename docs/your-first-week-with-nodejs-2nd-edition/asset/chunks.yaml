  trans: "\n模型-视图-控制器（或 MVC）可能是应用程序中最流行的架构之一。正如[计算机历史上的许多酷酷事物](https://youtu.be/NdSD07U5uBs?t=29m2s)\
    \ 中的许多其他事物一样，MVC 模型最初是在 [PARC](https://en.wikipedia.org/wiki/PARC_(company)) 为\
    \ Smalltalk 语言设计的，用于解决具有图形用户界面的应用程序组织问题。它最初为桌面应用程序创建，但从那时起这一理念被应用到包括 Web 在内的其他媒介。\n\
    \n我们可以用简单的语言描述 MVC 架构：\n\n* **Model（模型）**：应用程序中处理数据库或任何数据相关功能的部分。\n* **View（视图）**：用户看到的一切——基本上就是我们要发送给客户端的页面。\n\
    * **Controller（控制器）**：网站的逻辑，以及模型与视图之间的胶水。在这里我们调用模型获取数据，然后将这些数据放在视图上发送给用户。\n\n\
    我们的应用程序将允许我们创建、查看、编辑和删除纯文本笔记。它不会有其他功能，但由于我们已经定义了稳固的架构，以后添加新功能时就不会遇到太大麻烦。\n\n本教程假设你的机器上安装了较新版本的\
    \ Node。如果不是如此，请参考我们的[Node 快速上手与运行教程](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。\n\
    \n你可以在[附的 GitHub 仓库](https://github.com/sitepoint-editors/notes-board) 中查看最终应用程序，这样你可以对应用程序结构有一个整体了解。\n\
    \n## 搭建基础\n\n构建任何 Node.js 应用程序的第一步是创建一个 `package.json` 文件，它将包含我们所有的依赖和脚本。与其手动创建此文件，不如\
    \ npm 使用 `init` 命令为我们完成这项工作：\n\n```\nmkdir notes-board\ncd notes-board\nnpm init\
    \ -y\n```\n\n过程完成后，我们将准备好一个可用的 `package.json` 文件。\n\n### npm 命令\n\n如果你熟悉这些命令，请查看我们的[npm\
    \ 入门指南](https://www.sitepoint.com/beginners-guide-node-package-manager/)。\n\n\
    我们将开始安装 Hapi.js——本教程首选的框架。它在简单性、稳定性和非常适合我们用例的功能之间取得了良好的平衡（尽管也有其他可以行的选项）。\n\n```\n\
    npm install @hapi/hapi@18.4.0\n```\n\n此命令将下载 Hapi.js 并其作为依赖项添加到 `package.json`\
    \ 文件中。\n\n### 版本\n\n我指定了 Hapi.js 的 v18.4.0 版本，因为它兼容 Node 8、10 和 12 版本。如果你使用的是\
    \ Node 12，可以选择安装最新版本（Hapi v19.1.0）。\n\n现在我们可以创建入口文件——启动一切的 Web 服务器。在你的应用程序目录中创建一个\
    \ `server.js` 文件并向其中添加以下代码：\n\n```\n\"use strict\";\n\nconst Hapi = require(\"\
    @hapi/hapi\");\nconst Settings = require(\"./settings\");\n\nconst init = async\
    \ () => {\n  const server = new Hapi.Server({ port: Settings.port });\n\n  server.route({\n\
    \    method: \"GET\",\n    path: \"/\",\n    handler: (request, h) => {\n    \
    \  return \"Hello, world!\";\n    }\n  });\n\n  await server.start();\n  console.log(`Server\
    \ running at: ${server.info.uri}`);\n};\n\nprocess.on(\"unhandledRejection\",\
    \ err => {\n  console.log(err);\n  process.exit(1);\n});\n\ninit();\n```\n\n这将是我们应用程序的基础。\n\
    \n首先，我们指出将要使用[严格模式](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode)，这是在使用\
    \ Hapi.js 框架时的一种[常见做法](https://hapi.dev/policies/styleguide/#strict-mode)。\n\n\
    接下来，我们包含了依赖项并实例化了一个新的服务器对象，我们将连接端口设置为 `3000`（端口可以是任何[1023 以上且 65535 以下]的数字](http://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xml)）。\n\
    \n我们服务器的第一个路由将作为一个测试，检查一切是否运行正常，所以一条“Hello, world!”消息对我们来说足够了。在每个路由中，我们必须定义它响应的\
    \ HTTP 方法和路径（URL），以及一个处理器（handler），这是一个处理 HTTP 请求的函数。处理器函数可以接受两个参数：`request` 和\
    \ `h`。第一个包含有关 HTTP 调用的信息，第二个将为我们提供处理该调用响应的方法。\n\n最后，我们通过 `server.start()` 方法启动服务器。\n\
    \n## 存储我们的设置\n\n将配置变量存储在专用文件中是一个良好的习惯。该文件导出一个包含我们数据的 JSON 对象，其中每个键都从环境变量赋值——但不要忘记设置回退值。\n\
    \n在此文件中，我们还可以根据环境（如开发或生产）拥有不同的设置。\n\n### 使用 .env 文件\n\n如果你决定使用 `.env`，请确保安装了 dotenv\
    \ 并将其添加到 `.gitignore`。\n\n我们的 `settings.js` 文件看起来如下：\n\n```\n// 这将加载我们的 .env 并添加到\
    \ process.env\n// 重要：如果你不想使用此项，请省略此行\nrequire(\"dotenv\").config({ silent: true\
    \ });\n\nmodule.exports = {\n  port: process.env.PORT || 3000,\n  env: process.env.NODE_ENV\
    \ || \"development\",\n\n  // 环境依赖的设置\n  development: {\n    db: {\n      dialect:\
    \ \"sqlite\",\n      storage: \":memory:\"\n    }\n  },\n  production: {\n   \
    \ db: {\n      dialect: \"sqlite\",\n      storage: \"db/database.sqlite\"\n \
    \   }\n  }\n};\n```\n\n现在我们可以通过执行以下命令并在 Web 浏览器中导航到 [`localhost:3000`](http://localhost:3000)\
    \ 来启动应用程序：\n\n```\nnode server.js\n```\n\n## 定义路由\n\n路由定义为我们提供了应用程序的功能概述。要创建额外的路由，我们只需要复制\
    \ `server.js` 文件中已有的路由结构，并更改每个的内容。\n\n让我们在项目中创建一个名为 `lib` 的新目录。在这里我们将所有的 JS 组件。\n\
    \n在 `lib` 内部，创建一个 `routes.js` 文件并向其中添加以下内容：\n\n```javascript\n\"use strict\";\n\
    const Path = require(\"path\");\n\nmodule.exports = [\n  // 我们在这里定义路由\n];\n```\n\
    \n在此文件中，我们将导出一个包含应用程序每个路由的对象的数组。要定义第一个路由，向数组添加以下对象：\n\n```javascript\n{\n  method:\
    \ \"GET\",\n  path: \"/\",\n  handler: (request, h) => {\n    return \"All the\
    \ notes will appear here\";\n  },\n  config: {\n    description: \"Gets all the\
    \ notes available\"\n  }\n},\n```\n"
- fmt: "\nOur first route is for the home page (`/`), and since it will only return\
    \ information, we assign it a `GET` method. For now, it will only give us the\
    \ message “All the notes will appear here”, which we’re going to change later\
    \ for a controller function. The `description` field in the `config` section is\
    \ only for documentation purposes.\n\nThen, we create the four routes for our\
    \ notes under the `/note/` path. Since we’re building a [CRUD](https://en.wikipedia.org/wiki/Create_read_update_and_delete)\
    \ application, we’ll need one route for each action with the corresponding [HTTP\
    \ methods](http://www.w3schools.com/tags/ref_httpmethods.asp).\n\nAdd the following\
    \ definitions next to the previous route:\n\n```\n{\n  method: \"POST\",\n  path:\
    \ \"/note\",\n  handler: (request, h) => {\n    return \"New note\";\n  },\n \
    \ config: {\n    description: \"Adds a new note\"\n  }\n},\n{\n  method: \"GET\"\
    ,\n  path: \"/note/{slug}\",\n  handler: (request, h) => {\n    return \"This\
    \ is a note\";\n  },\n  config: {\n    description: \"Gets the content of a note\"\
    \n  }\n},\n{\n  method: \"PUT\",\n  path: \"/note/{slug}\",\n  handler: (request,\
    \ h) => {\n    return \"Edit a note\";\n  },\n  config: {\n    description: \"\
    Updates the selected note\"\n  }\n},\n{\n  method: \"GET\",\n  path: \"/note/{slug}/delete\"\
    ,\n  handler: (request, h) => {\n    return \"This note no longer exists\";\n\
    \  },\n  config: {\n    description: \"Deletes the selected note\"\n  }\n}\n```\n\
    \nWe’ve done the same as in the previous route definition, but this time we’ve\
    \ changed the method to match the action we want to execute.\n\nThe only exception\
    \ is the delete route. In this case, we’re going to define it with the `GET` method\
    \ rather than `DELETE` and add an extra `/delete` in the path. This way, we can\
    \ call the delete action just by visiting the corresponding URL.\n\n### Strict\
    \ REST\n\nIf you plan to implement a strict REST interface, then you would have\
    \ to use the `DELETE` method and remove the `/delete` part of the path.\n\nWe\
    \ can name parameters in the path by surrounding the word in curly braces. Since\
    \ we’re going to identify notes by a slug, we add `{slug}` to each path, with\
    \ the exception of the `POST` route; we don’t need it there because we’re not\
    \ going to interact with a specific note, but to create one.\n\nYou can read more\
    \ about Hapi.js routes on the [official documentation](https://hapi.dev/tutorials/routing/?lang=en_US).\n\
    \nNow, we have to add our new routes to the `server.js` file. Let’s import the\
    \ routes file at the top of the file:\n\n```\nconst Routes = require(\"./lib/routes\"\
    );\n```\n\nThen let’s replace our current test route with the following:\n\n```\n\
    server.route(Routes);\n```\n\n## Building the Models\n\nModels allow us to define\
    \ the structure of the data and all the functions to work with it.\n\nIn this\
    \ example, we’re going to use the [SQLite](https://www.sqlite.org/index.html)\
    \ database with [Sequelize.js](https://sequelize.org/v3/), which is going to provide\
    \ us with a better interface using the ORM ([Object-Relational Mapping](https://en.wikipedia.org/wiki/Object-relational_mapping))\
    \ technique. It will also provide us a database-independent interface.\n\n###\
    \ Setting up the Database\n\nYou can install SQLite and Sequelize by executing\
    \ the following command:\n\n```\nnpm install sequelize sqlite3\n```\n\nNow create\
    \ a `models` directory inside `lib/` with a file called `index.js`, which is going\
    \ to contain the database and Sequelize.js setup, and include the following content:\n\
    \n```javascript\n\"use strict\";\n\nconst Fs = require(\"fs\");\nconst Path =\
    \ require(\"path\");\nconst Sequelize = require(\"sequelize\");\nconst Settings\
    \ = require(\"../../settings\");\nconst dbSettings = Settings[Settings.env].db;\n\
    \nconst sequelize = new Sequelize(\n  dbSettings.database,\n  dbSettings.user,\n\
    \  dbSettings.password,\n  dbSettings\n);\nconst db = {};\n\nFs.readdirSync(__dirname)\n\
