    # Chapter 5: Working with Databases in Node\n\n### by Craig Buckler\n\nThe performance\
    \ techniques described in this chapter are more radical and could be difficult\
    \ to apply to an existing project. Fortunately, there are no such limitations\
    \ when embarking on a new site or app, so we look deeper into CMS issues, JavaScript\
    \ optimization, DOM handling, server-side rendering, static site generators (SSGs),\
    \ and development processes.\n\n## Evaluate CMS Templates and Plugins\n\nContent\
    \ management systems such as WordPress don’t generate bloated, badly performing\
    \ pages … *until you start adding stuff!*\n\nFree or commercial templates make\
    \ financial sense. Why employ a developer when an off-the-shelf solution does\
    \ everything you need for a few dollars? Unfortunately, there’s a hidden cost.\
    \ Generic templates must sell hundreds of copies—if not thousands—to recoup the\
    \ development effort. To attract buyers, the developers bundle every conceivable\
    \ feature. Your site may only use a fraction of those facilities, but they can\
    \ still be present in the code, so the download weight and processing are affected.\n\
    \nSimilarly, be wary about plugins, since their quality and effectiveness vary.\
    \ The best plugins can improve performance by optimizing database tables, caching\
    \ data, and removing redundant code. The worst will duplicate assets, make convoluted\
    \ configuration changes (such as `.htaccess` files), add unnecessary bloat, and\
    \ affect responsiveness even though they’re inactive on a particular page.\n\n\
    Always evaluate page cost and performance when considering new templates and plugins.\
    \ Where possible, choose more lightweight options, even if the purchase price\
    \ is higher.\n\n## Reduce Client-side Code\n\nBlindingly obvious statement alert:\
    \ *smaller files results in faster pages.*\n\nNot all assets are created equal,\
    \ though. 500KB of image data has a relatively low performance hit, since it’s\
    \ downloaded once, cached in the browser, and positioned on the page. The same\
    \ quantity of HTML, CSS, or JavaScript has a far bigger impact, because it must\
    \ be downloaded, parsed, and processed.\n\nIdeally, the number of HTML DOM nodes\
    \ should be reduced to a minimum. A shallower tree depth means rendering and reflows\
    \ are performed more effectively. Modern layout tools such as [Flexbox](https://www.sitepoint.com/flexbox-css-flexible-box-layout/)\
    \ and [Grid](https://www.sitepoint.com/introduction-css-grid-layout-module/) allow\
    \ you to remove wrapper elements that may have been necessary in float-based designs.\
    \ Keep the document small and look out for signs of [DIVitis](https://en.wiktionary.org/wiki/divitis)!\n\
    \nSimilarly, the fewer CSS rules you require, the quicker a document can be rendered.\
    \ Look our for complex selectors, especially when using preprocessors such as\
    \ [Sass](https://sass-lang.com/), which expand deeply nested rule sets. Check\
    \ your compiled style sheet output to ensure it’s as efficient as is practical.\n\
    \nTry to embrace the [CSS cascade](https://developer.mozilla.org/docs/Web/CSS/Cascade)\
    \ rather than working against it! A little understanding can reduce code and improve\
    \ performance. For example, you can set default fonts, colors, sizes, tables,\
    \ grids, and form fields that are universally applied but can be tweaked for individual\
    \ components.\n\nAlso be wary of using CSS resets, which means having to re-apply\
    \ default styling to every element. CSS normalization, such as [Normalize.css](https://necolas.github.io/normalize.css/),\
    \ *could* be a better alternative, since it makes browsers render more consistently.\
    \ That said, default styling between browsers is closer than ever."
