  raw: "Our first route is for the home page (`/`), and since it will only return\
    \ information, we assign it a `GET` method. For now, it will only give us the\
    \ message “All the notes will appear here”, which we’re going to change later\
    \ for a controller function. The `description` field in the `config` section is\
    \ only for documentation purposes.\n\nThen, we create the four routes for our\
    \ notes under the `/note/` path. Since we’re building a [CRUD](https://en.wikipedia.org/wiki/Create,_read,_update_and_delete)\
    \ application, we’ll need one route for each action with the corresponding [HTTP\
    \ methods](http://www.w3schools.com/tags/ref_httpmethods.asp).\n\nAdd the following\
    \ definitions next to the previous route:\n\n```\n{\n  method: \"POST\",\n  path:\
    \ \"/note\",\n  handler: (request, h) => {\n    return \"New note\";\n  },\n \
    \ config: {\n    description: \"Adds a new note\"\n  }\n},\n{\n  method: \"GET\"\
    ,\n  path: \"/note/{slug}\",\n  handler: (request, h) => {\n    return \"This\
    \ is a note\";\n  },\n  config: {\n    description: \"Gets the content of a note\"\
    \n  }\n},\n{\n  method: \"PUT\",\n  path: \"/note/{slug}\",\n  handler: (request,\
    \ h) => {\n    return \"Edit a note\";\n  },\n  config: {\n    description: \"\
    Updates the selected note\"\n  }\n},\n{\n  method: \"GET\",\n  path: \"/note/{slug}/delete\"\
    ,\n  handler: (request, h) => {\n    return \"This note no longer exists\";\n\
    \  },\n  config: {\n    description: \"Deletes the selected note\"\n  }\n}\n```\n\
    \nWe’ve done the same as in the previous route definition, but this time we’ve\
    \ changed the method to match the action we want to execute.\n\nThe only exception\
    \ is the delete route. In this case, we’re going to define it with the `GET` method\
    \ rather than `DELETE` and add an extra `/delete` in the path. This way, we can\
    \ call the delete action just by visiting the corresponding URL.\n\n#### Strict\
    \ REST\n\nIf you plan to implement a strict REST interface, then you would have\
    \ to use the `DELETE` method and remove the `/delete` part of the path.\n\nWe\
    \ can name parameters in the path by surrounding the word in curly braces. Since\
    \ we’re going to identify notes by a slug, we add `{slug}` to each path, with\
    \ the exception of the `POST` route; we don’t need it there because we’re not\
    \ going to interact with a specific note, but to create one.\n\nYou can read more\
    \ about Hapi.js routes on the [official documentation](https://hapi.dev/tutorials/routing/?lang=en_US).\n\
    \nNow, we have to add our new routes to the `server.js` file. Let’s import the\
    \ routes file at the top of the file:\n\n```\nconst Routes = require(\"./lib/routes\"\
    );\n```\n\nThen let’s replace our current test route with the following:\n\n```\n\
    server.route(Routes);\n```\n\n## Building the Models\n\nModels allow us to define\
    \ the structure of the data and all the functions to work with it.\n\nIn this\
    \ example, we’re going to use the [SQLite](https://www.sqlite.org/index.html)\
    \ database with [Sequelize.js](https://sequelize.org/v3/), which is going to provide\
    \ us with a better interface using the ORM ([Object-Relational Mapping](https://en.wikipedia.org/wiki/Object-relational_mapping))\
    \ technique. It will also provide us a database-independent interface.\n\n###\
    \ Setting up the Database\n\nYou can install SQLite and Sequelize by executing\
    \ the following command:\n\n```\nnpm install sequelize sqlite3\n```\n\nNow create\
    \ a `models` directory inside `lib/` with a file called `index.js`, which is going\
    \ to contain the database and Sequelize.js setup, and include the following content:\n\
    \n```\n\"use strict\";\n\nconst Fs = require(\"fs\");\nconst Path = require(\"\
    path\");\nconst Sequelize = require(\"sequelize\");\nconst Settings = require(\"\
    ../../settings\");\nconst dbSettings = Settings[Settings.env].db;\n\nconst sequelize\
    \ = new Sequelize(\n  dbSettings.database,\n  dbSettings.user,\n  dbSettings.password,\n\
    \  dbSettings\n);\nconst db = {};\n\nFs.readdirSync(__dirname)\n  .filter(file\
    \ => file.indexOf(\".\") !== 0 && file !== \"index.js\")\n  .forEach(file => {\n\
    \    const model = sequelize.import(Path.join(__dirname, file));\n    db[model.name]\
    \ = model;\n  });\n\ndb.sequelize = sequelize;\ndb.Sequelize = Sequelize;\n\n\
    module.exports = db;\n```\n\nFirst, we include the modules that we’re going to\
    \ use:\n\n*   `Fs`, to read the files inside the `models` folder, which is going\
    \ to contain all the models\n\n*   `Path`, to join the path of each file in the\
    \ current directory\n\n*   `Sequelize`, which will allow us to create a new Sequelize\
    \ instance\n\n*   `Settings`, which contains the data of our `settings.js` file\
    \ from the root of our project\n\nNext, we create a new `sequelize` variable that\
    \ will contain a `Sequelize` instance with our database settings for the current\
    \ environment. We’re going to use `sequelize` to import all the models and make\
    \ them available in our `db` object.\n\nThe `db` object is going to be exported\
    \ and will contain our database methods for each model. It will be available in\
    \ our application when we need to do something with our data.\n\nTo load all the\
    \ models, instead of defining them manually, we look for all the files inside\
    \ the `models` directory (with the exception of the `index.js` file) and load\
    \ them using the `import` function. The returned object will provide us with the\
    \ CRUD methods, which we then add to the `db` object.\n\nAt the end, we add `sequelize`\
    \ and `Sequelize` as part of our `db` object. The first one is going to be used\
    \ in our `server.js` file to connect to the database before starting the server,\
    \ and the second one is included for convenience if you need it in other files\
    \ too.\n\n### Creating Our Note Model\n\nIn this section, we’re going to use the\
    \ [Moment.js](http://momentjs.com/) package to help with date formatting. You\
    \ can install it and include it as a dependency with the following command:\n\n\
    ```\nnpm install moment\n```\n\nWe’re going to create a `note.js` file inside\
    \ the `models` directory, which is going to be the only model in our application.\
    \ It will provide us with all the functionality we need.\n\nAdd the following\
    \ content to that file:\n\n```\n\"use strict\";\n\nconst Moment = require(\"moment\"\
    );\n\nmodule.exports = (sequelize, DataTypes) => {\n  const Note = sequelize.define(\"\
    Note\", {\n    date: {\n      type: DataTypes.DATE,\n      get: function() {\n\
    \        return Moment(this.getDataValue(\"date\")).format(\"MMMM Do, YYYY\");\n\
    \      }\n    },\n    title: DataTypes.STRING,\n    slug: DataTypes.STRING,\n\
    \    description: DataTypes.STRING,\n    content: DataTypes.STRING\n  });\n\n\
    \  return Note;\n};\n```\n\nWe export a function that accepts a `sequelize` instance,\
    \ to define the model, and a `DataTypes` object with all the types available in\
    \ our database.\n\nNext, we define the structure of our data using an object where\
    \ each key corresponds to a database column and the value of the key defines the\
    \ type of data we’re going to store. You can see the list of data types in the\
    \ [Sequelize.js documentation](http://docs.sequelizejs.com/en/latest/api/datatypes/).\
    \ The tables in the database are going to be created automatically based on this\
    \ information.\n\nIn the case of the date column, we also define a how Sequelize\
    \ should return the value using a [getter](https://sequelize.org/master/manual/getters-setters-virtuals.html)\
    \ function (`get` key). We indicate that before returning the information. It\
    \ should be first passed through the Moment utility to be formatted in a more\
    \ readable way (`MMMM Do, YYYY`).\n\n#### A Non-destructive Operation\n\nAlthough\
    \ we’re getting a simple and easy-to-read date string, it’s stored as a precise\
    \ date string product of JavaScript’s [Date](https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/Date)\
    \ object. So this is not a destructive operation.\n\nFinally, we return our model.\n\
    \n### Synchronizing the Database\n\nWe now have to synchronize our database before\
    \ we’re able to use it in our application. In `server.js`, import the models at\
    \ the top of the file:\n\n```\n// Import the index.js file inside the models directory\n\
    const Models = require(\"./lib/models/\");\n```\n\nNext, remove the following\
    \ code block:\n\n```\nawait server.start();\nconsole.log(`Server running at: ${server.info.uri}`);\n\
    ```\n\nReplace it with this one:"
