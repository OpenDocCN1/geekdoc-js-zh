    ```\nnode index.js\n```\n\nNow navigate to [http://localhost:3000/](http://localhost:3000/)\
    \ in your browser. You should be redirected to the login page. If you try to go\
    \ to [http://localhost:3000/private](http://localhost:3000/private), it should\
    \ redirect you to the login page again. There’s our route guard doing its job.\n\
    \nPress `Ctrl` + `C` in the terminal window to stop our server. Then head back\
    \ to the `index.js` file and, at the bottom of the file, add the following lines:\n\
    \n```\n/* REGISTER SOME USERS */\n\nUserDetails.register({username:'paul', active:\
    \ false}, 'paul');\nUserDetails.register({username:'jay', active: false}, 'jay');\n\
    UserDetails.register({username:'roy', active: false}, 'roy');\n```\n\nThis uses\
    \ the passport-local-mongoose `register` method to salt the password for us. We\
    \ just have to pass it in in plain text.\n\nNow we run `node index.js`. The users\
    \ will be created. You should comment those last lines now.\n\nRemember the MongoDB\
    \ shell terminal we left open? Go back to it and type:\n\n```\ndb.userInfo.find()\n\
    ```\n\nThis should show your three users and, as you can see, the salt and hash\
    \ now occupy a good portion of the space on the terminal.\n\nThat’s all we need\
    \ for the app to work. We’re done!\n\nHead back to the browser, try to log in\
    \ with one of the credentials we entered and you’ll see the login message with\
    \ the given username in it.\n\n## Next Steps\n\nWe only added the necessary modules\
    \ for this app to work—nothing more, nothing less. For a production app, you’ll\
    \ need to add other middleware and separate your code in modules. You can take\
    \ that as a challenge to set up a clean and scalable environment and grow it into\
    \ something useful!\n\nThe first and easiest thing you should try is adding the\
    \ `logout`, using Passport’s [req.logout()](http://www.passportjs.org/docs/logout/)\
    \ method.\n\nThen you could try implementing a register flow. You’ll need a registration\
    \ form and a route to talk to. You should use the `UserDetails.register()` we\
    \ added earlier as a template. For email confirmation, you should check out [nodemailer](https://www.npmjs.com/package/nodemailer).\n\
    \nAnother thing you could do is try to apply these concepts to a single page application.\
    \ Perhaps using Vue.js and its router. And there goes your weekend!\n\n## Conclusion\n\
    \nWell, we’re finally at the end. In this article, we learned how to implement\
    \ local authentication using `Passport` in a `Node.js` application. In the process,\
    \ we also learned how to connect to `MongoDB` using `Mongoose`.\n\nPerhaps this\
    \ wasn’t as easy for you as I tried to paint it, but at least you got to see that\
    \ it gets easier with these tools that work some magic in the background, letting\
    \ us worry only about what we’re trying to build.\n\n“Magic” tools are not always\
    \ ideal, but reputable and actively maintained tools help us write less code—and\
    \ code you don’t write is code you don’t maintain, and code you don’t maintain\
    \ is code you don’t break.\n\nAlso, keep in mind that if a tool is actively maintained\
    \ by a core team, chances are they know what they’re doing better than any of\
    \ us. Delegate whenever possible.\n\nI hope you enjoyed this tutorial, and maybe\
    \ got some inspiration for your next project. Happy coding!\n\n# Chapter 8: How\
    \ to Debug a Node App\n\n### by Craig Buckler\n\nSoftware development is complex\
    \ and, at some point, your Node.js application will fail. If you’re *lucky*, your\
    \ code will crash with an obvious error message. If you’re unlucky, your application\
    \ will carry on regardless but not generate the results you expect. If you’re\
    \ really unlucky, everything will work fine until the first user discovers a catastrophic\
    \ disk-wiping bug.\n\n## What is Debugging?\n\n**Debugging** is the black art\
    \ of fixing software defects. Fixing a bug is often easy—a corrected character\
    \ or additional line of code solves the problem. Finding that bug is another matter,\
    \ and developers can spend many unhappy hours trying to locate the source of an\
    \ issue. Fortunately, Node.js has some great tools to help trace errors.\n\n###\
    \ Terminology\n\nDebugging has its own selection of obscure jargon, including\
    \ the following:\n\n| Term | Explanation |\n\n| --- | --- |\n\n| breakpoint |\
    \ the point at which a debugger stops a program so its state can be inspected\
    \ |\n\n| debugger | a tool which offers debugging facilities such as running code\
    \ line by line to inspect internal variable states |\n\n| feature | as in the\
    \ claim: “it’s not a bug, it’s a feature”. All developers say it at some point\
    \ during their career |\n\n| frequency | how often or under what conditions a\
    \ bug will occur |\n\n| it doesn’t work | the most-often made but least useful\
    \ bug report |"
