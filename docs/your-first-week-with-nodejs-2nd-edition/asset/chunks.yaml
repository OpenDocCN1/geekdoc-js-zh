    \    ports:\n      - \"8080:8080\"\n    networks:\n      - localnet\n\n  nodejs:\n\
    \    environment:\n      - NODE_ENV=development\n    build:\n      context: ./\n\
    \      dockerfile: Dockerfile\n    container_name: nodejs\n    depends_on:\n \
    \     - mysql\n    command: /bin/sh -c 'npm i && npm run debug'\n    volumes:\n\
    \      - ./:/home/node/app\n    ports:\n      - \"3000:3000\"\n    networks:\n\
    \      - localnet\n\nvolumes:\n  mysqldata:\n\nnetworks:\n  localnet:\n```\n\n\
