    \n## Trademark Notice\n\nRather than indicating every occurrence of a trademarked\
    \ name as such, this book uses the names only in an editorial fashion and to the\
    \ benefit of the trademark owner with no intention of infringement of the trademark.\n\
    \n![SitePoint logo](Images/sitepoint-logo-2012.png)\n\nPublished by SitePoint\
    \ Pty. Ltd.\nLevel 1, 110 Johnston St, Fitzroy\nVIC Australia 3065\nWeb: www.sitepoint.com\n\
    Email: books@sitepoint.com\n\n## About SitePoint\n\nSitePoint specializes in publishing\
    \ fun, practical, and easy-to-understand content for web professionals. Visit\
    \ [http://www.sitepoint.com/](http://www.sitepoint.com/) to access our blogs,\
    \ books, newsletters, articles, and community forums. You’ll find a stack of information\
    \ on JavaScript, PHP, design, and more.\n\n## About Craig Buckler\n\n[Craig](https://craigbuckler.com/)\
    \ is a freelance developer, author, and speaker who never shuts up about the web.\n\
    \nHe started coding in the 1980s when applications had to squeeze into a few kilobytes\
    \ of RAM. His passion for the Web was ignited in the mid 1990s when 28K modems\
    \ were typical and 100KB pages were considered extravagant.\n\nOver the past decade,\
    \ Craig has written 1,200 tutorials for SitePoint as web standards evolved. Despite\
    \ living in a technically wondrous future, he has never forgotten what could be\
    \ achieved with modest resources.\n\n# Preface\n\nWhile there have been quite\
    \ a few attempts to get JavaScript working as a server-side language, Node.js\
    \ (frequently just called Node) has been the first environment that's gained any\
    \ traction. It's now used by companies such as Netflix, Uber and Paypal to power\
    \ their web apps. Node allows for blazingly fast performance; thanks to its event\
    \ loop model, common tasks like network connection and database I/O can be executed\
    \ very quickly indeed.\n\nFrom a beginner's point of view, one of Node's obvious\
    \ advantages is that it uses JavaScript, a ubiquitous language that many developers\
    \ are comfortable with. If you can write JavaScript for the client-side, writing\
    \ server-side applications with Node should not be too much of a stretch for you.\n\
    \nIn this book, we'll offer a beginner's introduction to Node and its related\
    \ technologies, and get you under way writing your first Node applications.\n\n\
    ## Who Should Read This Book?\n\nThis book is for web developers who want to make\
    \ a start using Node. It's assumed that you have a good understanding of JavaScript.\n\
    \n## Conventions Used\n\n### Code Samples\n\nCode in this book is displayed using\
    \ a fixed-width font, like so:\n\n```\n <h1>A Perfect Summer's Day</h1>\n<p>It\
    \ was a lovely day for a walk in the park.\nThe birds were singing and the kids\
    \ were all back at school.</p> \n```\n\nWhere existing code is required for context,\
    \ rather than repeat all of it, ⋮ will be displayed:\n\n```\n function animate()\
    \ {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\nSome lines of code should be\
    \ entered on one line, but we’ve had to wrap them because of page constraints.\
    \ An ➥ indicates a line break that exists for formatting purposes only, and should\
    \ be ignored:\n\n```\n URL.open(\"http://www.sitepoint.com/responsive-web-\n➥design-real-user-testing/?responsive1\"\
    );\n```\n\nYou’ll notice that we’ve used certain layout styles throughout this\
    \ book to signify different types of information. Look out for the following items.\n\
    \n### Tips, Notes, and Warnings\n\n#### Hey, You!\n\nTips provide helpful little\
    \ pointers.\n\n#### Ahem, Excuse Me ...\n\nNotes are useful asides that are related—but\
    \ not critical—to the topic at hand. Think of them as extra tidbits of information.\n\
    \n#### Make Sure You Always ...\n\n... pay attention to these important points.\n\
    \n#### Watch Out!\n\nWarnings highlight any gotchas that are likely to trip you\
    \ up along the way.\n\n## Supplementary Materials\n\n* [https://www.sitepoint.com/community/](https://www.sitepoint.com/community/)\
    \ are SitePoint’s forums, for help on any tricky problems.\n* **books@sitepoint.com**\
    \ is our email address, should you need to contact us to report a problem, or\
    \ for any other reason.\n\n# Chapter 1: What Is Node and When Should I Use It?\n\
    \n### by James Hibbard\n\nSo you’ve heard of Node.js, but aren’t quite sure what\
    \ it is or where it fits into your workflow. Or maybe you’ve heard people singing\
    \ Node’s praises and now you’re wondering if it’s something you need.\n\nIf that\
    \ sounds like you, keep reading. In this guide, I’ll take a beginner-friendly,\
    \ high-level look at Node and its paradigms. I’ll examine Node’s main use cases,\
    \ as well as the current state of the landscape, and offer you a wide range of\
    \ jumping points (for further reading) along the way.\n\n#### “Node” or “Node.js”?\n\
    \nPlease note that, throughout the guide, I’ll use `Node` and `Node.js` interchangeably.\n\
    \n## What Is Node.js?\n\nThere are plenty of definitions to be found online. Let’s\
    \ take a look at a couple of more popular ones. This is what the project’s home\
    \ page has to say (https://nodejs.org/en/):\n\n> Node.js® is a JavaScript runtime\
    \ built on Chrome’s V8 JavaScript engine.\n\nAnd this is what Stack Overflow has\
    \ to offer (https://stackoverflow.com/tags/node.js/info):\n\n> Node.js is an event-based,\
    \ non-blocking, asynchronous I/O runtime that uses Google’s V8 JavaScript engine\
    \ and libuv library.\n\nHmmm, “event-based”, “non-blocking”, “asynchronous I/O”—that’s\
    \ quite a lot to digest in one go. So let’s approach this from a different angle\
    \ and begin by focusing on the other detail both descriptions mention—the V8 engine.\n\
    \n### Node Is Built on Google Chrome’s V8 JavaScript Engine\n\nThe V8 engine (https://v8.dev/)\
    \ is the open-source JavaScript engine that runs in Google Chrome and other Chromium-based\
    \ web browsers, including Brave, Opera, and Vivaldi. It was designed with performance\
    \ in mind and is responsible for compiling JavaScript directly to native machine\
    \ code that your computer can execute.\n\nHowever, when we say that Node is built\
    \ on the V8 engine, we don’t mean that Node programs are executed in a browser.\
    \ They aren’t. Rather, the creator of Node ([Ryan Dahl](https://en.wikipedia.org/wiki/Ryan_Dahl))\
    \ took the V8 engine and enhanced it with various features, such as a file system\
    \ API, an HTTP library, and a number of operating system–related utility methods.\n\
    \nThis means that Node.js is a program we can use to execute JavaScript on our\
    \ computers. In other words, it’s a JavaScript runtime.\n\n## How Do I Install\
    \ Node.js?\n\nIn this next section, we’ll install Node and write a couple of simple\
    \ programs. We’ll also look at [npm](https://www.npmjs.com/), a package manager\
    \ that comes bundled with Node.\n\n### Node Binaries vs Version Manager\n"
