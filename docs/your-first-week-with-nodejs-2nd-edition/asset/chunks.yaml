  trans: "\n最后，JavaScript 是无处不在的：我们大多数人都熟悉 JavaScript，或者在某个时候用过它。这意味着过渡到 Node 开发可能比转向其他后端语言更容易。正如\
    \ Craig Buckler 在他的 [Node vs PHP 对决](https://www.sitepoint.com/sitepoint-smackdown-php-vs-node-js/)中所说，JavaScript\
    \ 可能仍然是[世界上最被误解的语言](http://www.crockford.com/javascript/javascript.html)—但一旦理解了这些概念，它会让其他语言显得非常笨拙。\n\
    \n## Node 的其他用途\n\n它并不仅限于服务端。Node.js 还有许多其他令人兴奋且多样的用途！\n\n例如，[它可以作为脚本语言](https://www.sitepoint.com/shell-scripts-javascript/)来自动化你\
    \ PC 上的重复或易出错的任务。它还可以用于编写你自己的命令行工具，例如这个 [Yeoman 风格的生成器](https://www.sitepoint.com/scaffolding-tool-caporal-js/)来为新项目搭建脚。\n\
    \nNode.js 还可以用于[构建跨平台桌面应用](https://www.sitepoint.com/premium/books/build-a-native-desktop-gif-search-app-using-nodegui/read/)，甚至[创建你自己的机器人](https://www.sitepoint.com/an-introduction-to-nodebots/)。这有什么不爱的呢？\n\
    \n## 结论\n\nJavaScript 无处不在，而 Node 是一个庞大且广泛的主题。尽管如此，我希望在本指南中，我像我在开头承诺的那样，为你提供了初学者友的、\
    \ Node.js 及其主要范式的概述。我也希望当你重新阅读之前看过的定义时，这些事情会变得更有意义。\n\n> Node.js 是一个基于事件、非阻塞、异步的\
    \ I/O 运行时，它使用了 Google 的 V8 JavaScript 引擎和 libuv 库。\n\n# 第 2 章：使用 Node.js 构建一个简单的页面计数服务\n\
    \n### 作者：Craig Buckler\n\n你已经了解 Node.js 是什么。你已经读过它可以做什么。开始做一个真实项目是提升你 Node.js\
    \ 知识的最佳方式！\n\n本教程介绍了如何构建一个简单的页面计数服务。任何页面都可以使用它来显示“此已被访问 X 次”，就像二十年前 HTML 开发者做的那样。\n\
    \n该服务将使用标准的 [Node.js API](https://nodejs.org/dist/latest/docs/api/) 开发，以演示 HTTP\
    \ 处理、URL 解析、存储和文件操作等概念。在项目的生产过程中不会使用任何预构建的第三方模块或应用程序：*我们要自力更生！*\n\n## 前提条件\n\n\
    在您选择的平台上下载并[安装 Node.js](https://nodejs.org/en/download/)。支持 Windows、macOS 和 Linux（使用\
    \ [包管理器](https://nodejs.org/en/download/package-manager/) 或 [Snap 软件包](https://snapcraft.io/node)）。你也可以[使用如\
    \ nvm 这样的版本管理器](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。最新的\
    \ LTS（偶数版本）Node 版本是一个不错的选择。\n\n一个良好的文本编辑器会让编码更高效、更愉快。流行的选项包括 [VS Code](https://code.visualstudio.com/)、[Atom](https://atom.io/)、[Sublime\
    \ Text](https://www.sublimetext.com/) 和 [Brackets](http://brackets.io/)。\n\n你将频繁使用命令行，所以请确保你知道如何启动终端应用程序。要开始的话，请安装\
    \ [nodemon](https://nodemon.io/) 和 [small-static-server](https://www.npmjs.com/package/small-static-server)\
    \ 作为全局 `npm` 包：\n\n```bash\nnpm install -g nodemon small-static-server\n```\n\n\
    *   `nodemon` 可在源代码更改时启动并重启 Node.js 应用程序\n*   `ss` 可在任何目录下启动一个基于文件的静态 Web 服务器\n\
    \n最后，一点点 JavaScript 知识将大有可为！\n\n## 项目概览\n\n在开发期间，我们的 Node.js Web 服务器将在 `http://localhost:3000/`\
    \ 运行。任何页面都可以通过添加一段 HTML 代码来使用它显示计数器。例如：\n\n```html\n<script src=\"http://localhost:3000/counter.js\"\
    ></script>\n```\n\n在这种情况下，会发生以下事情：\n\n1.  服务器通过检查 HTTP 请求头中的 `referer` 来找到调用页面的\
    \ URL。\n2.  服务器提取引用者的协议、主机和路径（忽略查询字符串），并生成一个 32 位的 MD5 哈希。这比保留一个长 URL 更高效。\n3.\
    \  URL 哈希的计数器加 1。\n4.  服务器通过 JavaScript `document.write()` 响应并在页面上显示计数器。\n\n`document.write()`\
    \ 虽然简单但会影响性能，因为它会阻塞浏览器渲染直到接收完整响应。还提供了其他三个计数选项：\n\n*   [一个 SVG 计数器](https://github.com/sitepoint-editors/pagehit-ram/blob/master/testpages/page-svg.html)，它返回一个包含在\
    \ `<text>` 块中的计数器生成图像：\n\n    ```html\n     <img src=\"http://localhost:3000/counter.svg\"\
    \ />\n    ```\n\n*   [一个延迟脚本计数器](https://github.com/sitepoint-editors/pagehit-ram/blob/master/testpages/page-svg.html)，它返回一个包含在\
    \ `<text>` 块中的计数器生成图像：\n\n    ```html\n     <img src=\"http://localhost:3000/counter.svg\"\
    \ />\n    ```\n\n*   [一个延迟脚本计数器](https://github.com/sitepoint-editors/pagehit-ram/blob/master/testpages/page-svg.html)，它返回一个包含在\
    \ `<text>` 块中的计数器生成图像：\n\n    ```html\n     <img src=\"http://localhost:3000/counter.svg\"\
    \ />\n    ```\n\n## 内存存储\n\n初始实现使用内存对象来存储计数器。这对于来自其他技术领域的人来说可能很不寻常。Node.js 通常启动一个实现\
    \ Web 服务器的应用程序。一旦返回响应，该代码中的任何状态都会丢失。\n\n"
- fmt: "\n- `npm run debug` runs the `debug` script. It uses `nodemon` to monitor\
    \ file changes and reports full stack traces (useful for `Promise` debugging).\n\
    \nIf you’d like to find out more about `npm` scripts and how they work, please\
    \ consult [this tutorial](https://www.sitepoint.com/guide-to-npm-as-a-build-tool/).\n\
    \n### Step 2: Main File (`index.js`)\n\nNode.js applications are launched from\
    \ a single file which loads all modules and implements the core logic. It’s named\
    \ `index.js` in this project, so create that file and add the following code:\n\
    \n```javascript\n'use strict';\n\nconst\n  // default HTTP port\n  port = 3000,\n\
    \n  // Node.js modules\n  http = require('http'),\n  url = require('url');\n\n\
    // new server\nhttp.createServer((req, res) => {\n\n  let uri = url.parse(req.url).pathname;\n\
    \  res.end(uri);\n\n}).listen(port);\n\nconsole.log(`page hit web service running\
    \ on port ${port}`);\n```\n\nSave the file and run it from the console using `npm\
    \ run debug`. Wait for the message:\n\n```\npage hit web service running on port\
    \ 3000\n```\n\nThen load [http://localhost:3000/hello/world](http://localhost:3000/hello/world)\
    \ in your browser. You should see this:\n\n```\n/hello/world\n```\n\nThe code\
    \ uses functionality in two Node.js modules: [HTTP](https://nodejs.org/dist/latest/docs/api/http.html)\
    \ and [URL](https://nodejs.org/dist/latest/docs/api/url.html). By default, Node.js\
    \ uses CommonJS `require` statements to reference code, although [experimental\
    \ support](https://nodejs.org/dist/latest/docs/api/esm.html) for [ES6 Modules](https://www.sitepoint.com/understanding-es6-modules/)\
    \ is available.\n\nThe code uses [`http.createServer`](https://nodejs.org/dist/latest/docs/api/http.html#http_http_createserver_options_requestlistener).\
    \ This returns an [`http.Server`](https://nodejs.org/dist/latest/docs/api/http.html#http_class_http_server)\
    \ object which [listens](https://nodejs.org/dist/latest/docs/api/http.html#http_server_listen)\
    \ for HTTP requests on port 3000 (defined as a constant).\n\nA function is passed\
    \ to `http.createServer` which is used to handle incoming requests. Two parameters\
    \ are defined:\n\n1. `req`: an incoming [HTTP request](https://nodejs.org/dist/latest/docs/api/http.html#http_http_request_url_options_callback)\
    \ information object\n\n2. `res`: an outgoing [HTTP response](https://nodejs.org/dist/latest/docs/api/http.html#http_class_http_serverresponse)\
    \ object for returning data\n\nThe code extracts the full URL used from `req.url`\
    \ (`http://localhost:3000/hello/world`) and passes it to the Node.js `URL` parsing\
    \ module to extract the [`pathname`](https://nodejs.org/dist/latest/docs/api/url.html#url_urlobject_pathname)\
    \ (`/hello/world`). The path is returned to the browser using [res.end()](https://nodejs.org/dist/latest/docs/api/http.html#http_response_end_data_encoding_callback).\n\
    \nNode.js server frameworks such as [Express.js](https://expressjs.com/) all act\
    \ in a similar way. They parse an incoming request, route to code which can handle\
    \ that request, and output a response.\n\nPress `Ctrl`/`Cmd` + `C` to stop the\
    \ Node.js application running.\n\n### Step 3: Additional Modules\n\nIt’s practical\
    \ to split code into other files with reusable chunks of related functionality.\
    \ Create a new `lib` directory. You can use any name you prefer except for `node_modules`.\
    \ Then add the following files within it:\n\n- `lib/httpreferrer.js`: exports\
    \ a function which accepts an HTTP request object as a parameter. If this object\
    \ has a referer set, the function will concatenate its `protocol`, `host` and\
    \ `pathname` values, then return a 32-character MD5 hash of this string. The URL\
    \ and [Crypto](https://nodejs.org/dist/latest/docs/api/crypto.html) modules are\
    \ used:\n\n```javascript\n  'use strict';\n\n  const\n    url = require('url'),\n\
