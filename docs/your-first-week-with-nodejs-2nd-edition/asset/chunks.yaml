    \ = 3000,\n  express = require('express'),\n  app = express();\n\napp.get('/',\
    \ (req, res) => {\n  res.send('Hello from Docker!');\n});\n\napp.listen(port,\
    \ () =>\n  console.log(`server running on port ${port}`)\n);\n```\n\n可以从 [Docker\
    \ Hub](https://hub.docker.com/_/node) 选择合适的 Node.js 镜像。通常情况下：\n\n*   大多数镜像都很大，需要\
    \ 100MB 以上的下载量\n*   `alpine` 镜像下载量最小（仅 5MB），但可能无法提供应用程序所需的某些 OS 依赖项\n*   `slim`\
    \ 镜像是主 Linux 镜像的精简版本，可能是一个务实的合理的选择\n\n在这种情况下，我们可以使用 `lts-alpine`——它是包含最新 Node.js\
    \ LTS（偶数版本）的最小的镜像。\n\n`Dockerfile` 定义了创建应用镜像所需的构建步骤。可以使用多种[命令](https://docs.docker.com/engine/reference/builder/)，包括以下这些：\n\
    \n| command | 描述 |\n| --- | --- |\n| `FROM` | 从 [Docker hub](https://hub.docker.com/)\
    \ 启动镜像构建镜像 |\n| `ENV` | 设置环境变量 |\n| `WORKDIR` | 设置工作目录 |\n| `USER` | 设置活动用户 |\n\
    | `RUN` | 执行安装命令，例如 `npm install` |\n| `COPY` | 从宿主机拷贝文件 |\n| `EXPOSE` | 向宿主机暴露端口\
    \ |\n| `CMD` | 容器启动命令 |\n\n### Dockerfile\n\n```\nFROM node:lts-alpine\n\nENV\
    \ HOME=/home/node/app\nENV NODE_ENV=production\n\nRUN mkdir -p $HOME && chown\
    \ -R node:node $HOME\n\nWORKDIR $HOME\nUSER node\n\nCOPY --chown=node:node package*.json\
    \ $HOME/\nRUN npm i && npm cache clean --force\n\nCOPY --chown=node:node . .\n\
    \nEXPOSE 3000\n\nCMD npm start\n```\n\n此示例假设了一个生产环境。然而，在开发期间我们会在 Docker 命令行和 Docker\
    \ Compose 中覆盖某些设置。\n\n同时创建一个 `.dockerignore` 文件以确保非本质文件不会拷贝到镜像中：\n\n### .dockerignore\n\
    \n```\n.git\n.gitignore\n.config\n.npm\n.vscode\nnode_modules\n```\n\n在项目根目录下输入以下命令来构建名为\
    \ `nodetest` 的新镜像：\n\n```\ndocker image build -t nodetest .\n```\n\n命令末尾的点至关重要！如果你的构建文件命名不是\
    \ `Dockerfile`，请使用 `-f <file>`。\n\nDocker 在每个构建步骤都会创建一个独立的（隐藏）镜像（输入 `docker image\
    \ ls -a` 查看所有）。这使得更改变得更加高效。例如，修改 `EXPOSE` 端口是瞬间完成的，因为之前的任何构建步骤都不需要更改。然而，使用不同的\
    \ `FROM` 镜像将需要完全重新构建。\n\n出于这个原因，Dockerfile 命令的顺序应该从最不可能发生更改的到最可能发生更改的排序。在这种情况下：\n\
    \n1. 设置启动镜像和环境变量。\n2. 创建家目录并授予 `node` 用户所有权。\n3. 定义工作目录和用户。\n4. 从宿主机拷贝 `package.json`\
    \ 并安装 npm 依赖项。\n5. 从宿主机拷贝其余应用文件。\n6. 在宿主机上暴露 3000 端口。\n7. 执行 `npm start`。\n\n\
    现在可以从此镜像启动一个名为 `nodeapp` 的交互式容器：\n\n```\ndocker run -it --rm --name nodeapp -p\
    \ 3000:3000 nodetest\n```\n\n打开 [`localhost:3000/`](http://localhost:3000/)\n\n\
    ## 在开发期间使用 Docker Compose\n\n单独启动容器非常笨拙，尤其是当命令如此复杂时！幸运的是，Docker Compose 可以快速管理多个容器。\n\
    \n假设我们要在名为 `localnet` 的 Docker 网络中启动三个容器：\n\n1. MySQL 数据库容器 `mysql` 将数据保存到 Docker\
    \ 卷 `mysqldata` 中并暴露 3306 端口。\n2. 名为 `adminer` 的 [数据库客户端](https://www.adminer.org/)\
    \ 暴露 8080 端口。\n3. 上文定义的 Node.js Express 应用运行 nodemon 并暴露 3000 端口。\n\n在项目文件夹中创建一个名为\
    \ `docker-compose.yml` 的文件，内容如下（使用 Tab 键）：\n\n```\nversion: '3'\n\nservices:\n\
    \n  mysql:\n    environment:\n      - MYSQL_ROOT_PASSWORD=mysecret\n    image:\
    \ mysql:8\n    container_name: mysql\n    volumes:\n      - mysqldata:/var/lib/mysql\n\
    \    ports:\n      - \"3306:3306\"\n    networks:\n      - localnet\n\n  adminer:\n\
    \    image: adminer\n    container_name: adminer\n    depends_on:\n      - mysql\n\
    \    ports:\n      - \"8080:8080\"\n    networks:\n      - localnet\n\n  nodejs:\n\
    \    environment:\n      - NODE_ENV=development\n    build:\n      context: ./\n\
    \      dockerfile: Dockerfile\n    container_name: nodejs\n    depends_on:\n \
    \     - mysql\n    command: /bin/sh -c 'npm i && npm run debug'\n    volumes:\n\
    \      - ./:/home/node/app\n    ports:\n      - \"3000:3000\"\n    networks:\n\
    \      - localnet\n\nvolumes:\n  mysqldata:\n\nnetworks:\n  localnet\n```\n\n\
    Docker Compose 配置可以使用许多[命令](https://docs.docker.com/compose/compose-file/)，但此示例设置的选项与上面使用的\
    \ Docker 开发命令行相似。注意：\n\n*   `mysql volumes` 设置使用了 Docker 卷，而 `node volumes` 挂载了主机的文件系统（Docker\
    \ Compose 允许在任何操作系统上引用相对路径）。\n*   [`depends_on`](https://docs.docker.com/compose/compose-file/#depends_on)\
    \ 定义了启动依赖。在这种情况下，`adminer` 和 `nodejs` 在 `mysql` 启动后启动。\n\n"
- fmt: "\nBefore going any further, ensure you’ve stopped any running containers.\
    \ It’s also advisable to [ensure your system is clean](#node11-ch12.xhtml_cleaning-up)\
    \ by deleting existing images, containers, and networks by running:\n\n```\ndocker\
    \ system prune -af\n```\n\nAll three containers can now be launched by entering:\n\
    \n```\ndocker-compose up\n```\n\nThat’s it. The first run will take some time\
    \ as images download and build, but all messages will be logged to the terminal.\n\
    \nYou can now access the Node.js web service at [http://localhost:3000/](http://localhost:3000/).\
    \ Nodemon will restart the application when `index.js` is modified.\n\nYou can\
    \ use any MySQL client to connect to the database at `localhost:3306`. Alternatively,\
    \ open Adminer in your browser at [http://localhost:8080/](http://localhost:8080/)\
    \ and access the database using the credentials:\n\n- System: `MySQL`\n- Server:\
    \ `mysql`\n- Username: `root`\n- Password: `mysecret`\n\nAny container shell can\
    \ be accessed from another terminal using:\n\n```\ndocker-compose exec <name>\
    \ sh\n```\n\nHere, `<name>` is the container name (`nodejs`, `mysql`, or `adminer`).\n\
    \nWhen you’re finished, press `Ctrl` / `Cmd` + `C` in the `docker-compose` terminal\
    \ and all three containers will gracefully shut down and remove themselves. Subsequent\
    \ runs of `docker-compose up` will be almost instantaneous.\n\n## Using Docker\
    \ Compose in Production\n\nA similar Docker Compose configuration can be used\
    \ in production. The main differences:\n\n- Applications should run in production\
    \ mode (our `Dockerfile` default).\n- Development applications such as Adminer\
    \ are not required. *(Admittedly, they can be useful on live servers, but they\
    \ increase security and human error risks!)*\n- For additional security, ports\
    \ such as MySQL `3306` need only to be exposed within the Docker network rather\
    \ than on the host. Using stronger passwords or `.env` files may also be beneficial!\n\
    - Container [`restart`](https://docs.docker.com/compose/compose-file/#restart)\
    \ and similar production options can be added.\n\nCreate a new Docker Compose\
    \ file for production—that is, `docker-compose-production.yml`:\n\n```\nversion:\
    \ '3'\n\nservices:\n\n  mysql:\n    environment:\n      - MYSQL_ROOT_PASSWORD=mysecret\n\
    \    image: mysql:8\n    container_name: mysql\n    volumes:\n      - mysqldata:/var/lib/mysql\n\
    \    ports:\n      - \"3306\"\n    networks:\n      - localnet\n    restart: on-failure\n\
    \n  nodejs:\n    build:\n      context: ./\n      dockerfile: Dockerfile\n   \
    \ container_name: nodejs\n    depends_on:\n      - mysql\n    ports:\n      -\
    \ \"3000:3000\"\n    restart: on-failure\n\nvolumes:\n  mysqldata:\n\nnetworks:\n\
    \  localnet:\n```\n\nDocker containers can now be started as a background service\
    \ on the live server:\n\n```\n docker-compose -f .\\docker-compose-production.yml\
    \ up -d\n```\n\nIdeally, you’d also require a front-end web server such as [NGINX](https://www.nginx.com/)\
    \ to act as an SSL-enabled reverse proxy to the Node.js application, but that\
    \ could be installed on the host or as [another container](https://hub.docker.com/_/nginx).\n\
    \nTo stop the containers, enter:\n\n```\ndocker-compose stop\n```\n\n## Cleaning\
    \ Up\n\nDocker can use significant disk space: enter `docker system df` to view\
    \ usage statistics.\n\nTo clean up stopped containers and dangling images, volumes,\
    \ and networks not currently associated with a container, enter:\n\n```\ndocker\
    \ system prune\n```\n\nAdd `-a` to remove images, or `-af` to also include containers\
    \ and networks.\n\nAll volumes can be removed with `docker volume prune -f`, but\
    \ remember to back up any data you require before doing so!\n\n## Next Steps\n\
    \nDocker is a complex topic, but this guide covers the essentials for Node.js\
    \ development. However, while the examples above launch Node.js and database containers,\
    \ the application does not access or use a database at any point!\n\nThat’s the\
    \ topic of Chapter 5. You’ll discover:\n\n1. why databases are necessary for web\
    \ applications\n2. the differences and benefits offered by SQL and NoSQL databases\n\
    3. how to write a Node.js application using MongoDB, MySQL, and the Sequelize\
    \ ORM.\n"
