- fmt: "\n* The search box is device agnostic and works in all browsers—old, current,\
    \ and those released tomorrow.\n* Assuming the HTML loads, the search box is always\
    \ operational. This includes the period before `CSS` and/or `JavaScript` is downloaded\
    \ and parsed. In performance terms, the feature is responsive immediately.\n*\
    \ The user gets the best possible experience their device can handle. Performance\
    \ isn’t affected when an enhancement can’t be added. \n* The search box is fault-tolerant:\
    \ any enhancement can work or fail without breaking the system. It doesn’t matter\
    \ whether `CSS` and/or `JavaScript` are blocked, are slow to arrive, or fail to\
    \ download.\n* It’s the responsible option, and doesn’t require more development\
    \ effort in most situations.\n\nThe approach has no downsides. Progressive enhancement\
    \ only breaks when:\n\n1. It isn’t considered from the start. It may be difficult\
    \ to retrospectively enhance a feature that already requires a high base-level\
    \ of `CSS` and `JavaScript`.\n2. You try to support all browsers equally. It’s\
    \ futile to expect a decade-old version of `IE` to behave the same as a modern\
    \ application. Progressive enhancement means you never need to worry about old\
    \ browsers. Their users may not receive the best experience, but the feature remains\
    \ usable.\n\n## Adopt a Performance Budget\n\nA performance budget imposes a limit\
    \ on related metrics. Typical options include:\n\n* quantity-based limits, such\
    \ as the maximum number of fonts, images, scripts, etc.\n* time-based limits,\
    \ such as the first meaningful paint or interactive times\n* rule-based limits,\
    \ such as a minimum performance and accessibility score in `Lighthouse` audits\n\
    \nYou should experiment and discuss options with stakeholders to establish baseline\
    \ criteria, such as:\n\n* the total size of a page must not exceed 500KB\n* a\
    \ single image must be no more than 150KB\n* the home page must deliver less than\
    \ 100KB of `JavaScript`\n* all pages must be readable within five seconds on a\
    \ mid-range mobile device operating on an average `3G` connection\n\nIdeally,\
    \ these criteria can be added to your build process. Tools such as the [Lighthouse\
    \ module](https://www.npmjs.com/package/lighthouse) and file size plugins can\
    \ report—and potentially block—any deviation from the budget. Exceeding the budget\
    \ means you must either:\n\n1. optimize an existing feature/asset\n2. lazy load\
    \ an existing feature/asset on demand\n3. remove an existing feature/asset\n4.\
    \ reject the new feature/asset\n\nThe limitations can help teams prioritize features.\
    \ Increasing the budget should always be tougher than implementing another solution!\
    \ For example, a budget increase must be discussed, justified, and agreed to by\
    \ a two-thirds majority at a monthly progress meeting!\n\nPerformance budget tools:\n\
    \n* [performancebudget.io](https://performancebudget.io/): estimate file sizes\
    \ according to download timings\n* [bundlesize](https://github.com/siddharthkp/bundlesize):\
    \ calculate file sizes during the build process\n* [SpeedCurve](https://speedcurve.com/):\
    \ track real-world performance (commercial)\n\n## Create a Style Guide\n\nA style\
    \ guide is a set of agreed brand, content, design, and coding standards for teams\
    \ generally working on large codebases developed over a long period. A good style\
    \ guide promotes consistency and illustrates how developers should approach solutions.\
    \ Front-end components can be demonstrated with example code that shows styling,\
    \ animation, functionality, and restrictions. The benefits include:\n\n* new team\
    \ members can become productive quickly\n* components are reused: developers are\
    \ less likely to introduce their own `HTML`, `CSS`, and `JavaScript`\n* it becomes\
    \ easier to update, maintain, and improve component performance when the same\
    \ code is used throughout\n* code can be tested and quality assurance becomes\
