    \n### 第 2 ：主文件 (`index.js`)\n\nNode.js 应用从单个文件启动，该文件加载所有模块并实现核心逻辑。在该项目中它命名为 `index.js`，因此创建该文件并添加以下代码：\n\
    \n```javascript\n'use strict';\n\nconst\n  // 默认 HTTP 端口\n  port = 3000,\n\n \
    \ // Node.js 模块\n  http = require('http'),\n  url = require('url');\n\n// 新服务器\n\
    http.createServer((req, res) => {\n\n  let uri = url.parse(req.url).pathname;\n\
    \  res.end(uri);\n\n}).listen(port);\n\nconsole.log(`page hit web service running\
    \ on port ${port}`);\n```\n\n保存文件并在控制台中通过 `npm run debug` 运行。等待消息出现：\n\n```\n\
    page hit web service running on port 3000\n```\n\n然后在浏览器中加载 [`localhost:3000/hello/world`](http://localhost:3000/hello/world)。你应该能看到此内容：\n\
    \n```\n/hello/world\n```\n\n代码使用了两个 Node.js 模块的功能：[HTTP](https://nodejs.org/dist/latest/docs/api/http.html)\
    \ 和 [URL](https://nodejs.org/dist/latest/docs/api/url.html)。默认情况下，Node.js 使用 CommonJS\
    \ `require` 语句来引用代码，尽管已经提供了对 [ES6 Modules](https://www.sitepoint.com/understanding-es6-modules/)\
    \ 的[实验性支持](https://nodejs.org/dist/latest/docs/api/esm.html)。\n\n代码使用了 [`http.createServer`](https://nodejs.org/dist/latest/docs/api/http.html#http_http_createserver_options_requestlistener)。它返回一个\
    \ [`http.Server`](https://nodejs.org/dist/latest/docs/api/http.html#http_class_http_server)\
    \ 对象，该对象在端口 3000（定义为常量）上[监听](https://nodejs.org/dist/latest/docs/api/http.html#http_server_listen)\
    \ HTTP 请求。\n\n向 `http.createServer` 传递了一个用于处理传入请求的函数。定义了两个参数：\n\n1. `req`: 传入[HTTP\
    \ 请求](https://nodejs.org/dist/latest/docs/api/http.html#http_http_request_url_options_callback)\
    \ 信息对象\n\n2. `res`: 用于返回数据的[HTTP 响应](https://nodejs.org/dist/latest/docs/api/http.html#http_class_http_serverresponse)\
    \ 对象\n\n代码从 `req.url` 提取使用的完整 URL (`http://localhost:3000/hello/world`) 并将其传递给\
    \ Node.js 的 `URL` 解析模块以提取 [`pathname`](https://nodejs.org/dist/latest/docs/api/url.html#url_urlobject_pathname)\
    \ (`/hello/world`)。路径通过 [res.end()](https://nodejs.org/dist/latest/docs/api/http.html#http_response_end_data_encoding_callback)\
    \ 返回给浏览器。\n\nNode.js 服务器框架（如 [Express.js](https://expressjs.com/)）都以类似的方式运行。它们解析传入请求，路由到可以处理该请求的代码并输出响应。\n\
    \n按下 `Ctrl`/`Cmd` + `C` 停止运行的 Node.js 应用。\n\n### 第 3 步附加模块\n\n将代码拆分为具有可重用功能块的文件是很有用的。创建一个\
    \ `lib` 目录。除了 `node_modules` 之外，你可以使用任何名称。然后在其中添加以下文件：\n\n- `lib/httferrer.js`:\
    \ 导出一个接受 HTTP 请求对象作为参数的函数。如果该对象设置了 refer，该函数将拼接它的 `protocol`、`host` 和 `pathname`\
    \ 值，然后返回该字符串的 32 位 MD5 哈希值。使用了 [Crypto](https://nodejs.org/dist/latest/docs/api/crypto.html)\
    \ 模块：\n\n```javascript\n  'use strict';\n\n  const\n    url = require('url'),\n\
    \    crypto = require('crypto');\n\n  module.exports = (req) => {\n\n    let\n\
    \      r = url.parse(req.headers.referer || ''),\n      ref = r.href ? r.protocol\
    \ + r.host + r.pathname : null;\n\n    return ref ? crypto.createHash('md5').update(ref).digest('hex')\
    \ : null;\n\n  };\n```\n\n- `lib/httpresponse.js`: 导出一个函数，当传递一个包含 HTTP 响应的对象时，它用相应的\
    \ HTTP 头部和内容响应：\n\n```javascript\n  'use strict';\n\n  module.exports = ({\n \
    \   res     = null,\n    status  = 200,\n    mime    = 'text/plain',\n    content\
    \ = ''\n  }) => {\n\n    res.writeHead(status, {\n      'Access-Control-Allow-Origin':\
    \ '*',\n      'Content-Type': mime\n    });\n    res.end(content);\n\n  };\n```\n\
    \n### 第 4 步：测试页面\n\n必须在测试页面上添加计数器以查看服务的运行。创建另一个文件夹（例如 `testpages`），并在其中名为 `page-jswrite.html`\
    \ 的文件，包含以下代码：\n"
- fmt: "\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
    UTF-8\">\n  <title>page hits</title>\n</head>\n<body>\n\n<p>\n  This page has\
    \ been viewed\n    <script src=\"http://localhost:3000/counter.js\"></script>\n\
    \  times.\n</p>\n\n</body>\n</html>\n```\n\nRun `ss` from this folder in another\
    \ terminal:\n\n```\ncd testpages\nss\n```\n\nStart a static file web server at\
    \ `http://localhost:8888`:\n\n```\nserver address: http://localhost:8888\nroot\
    \ folder   : ./testpages/\n```\n\nOpen [http://localhost:8888/page-jswrite.html](http://localhost:8888/page-jswrite.html)\
    \ in your browser and watch the number of views increase as you refresh the page.\
    \ You can use similar code in other HTML files so each have their own unique hit\
    \ counter.\n\nThe full example code is available from [https://github.com/sitepoint-editors/pagehit-ram](https://github.com/sitepoint-editors/pagehit-ram).\n\
    \nPress `Ctrl`/`Cmd` + `C` in both terminals to stop the Node.js applications\
    \ running.\n\n# Page Hit v2.0: File Storage\n\nStoring page counters in memory\
    \ means they reset every time the Node.js application is restarted. The system\
    \ can be improved by saving counters to a file at regular intervals. The following\
    \ are steps for achieving this:\n\n1. When the application starts, if necessary,\
    \ a `data` directory is created in the project. (If you’re using Git, add `data/`\
    \ to your `.gitignore` file.)\n2. When a page counter is incremented, the server\
    \ will trigger a save event after ten seconds. (This ensures saving occurs as\
    \ a background task and is throttled during times of high load.)\n3. The `this.counter`\
    \ property of `pagehit.js` is converted to a JSON string and saved to a file with\
    \ a unique name (based on the current date/time).\n4. Once the file has successfully\
    \ saved, all previously saved files are deleted from the `data` directory. These\
    \ may be present if a user has manually added their own, or if older files haven’t\
    \ been deleted (due to altered permissions, the process having crashed, and so\
    \ on).\n5. On subsequent launches, the application looks for the most recent JSON\
    \ file in the `data` directory and imports it into `this.counter`.\n\nThe page\
    \ hit server doesn’t care how `lib/pagehit.js` is implemented as long as it can\
    \ execute the `count()` method. We need only update that logic; changes to `index.js`\
    \ are unnecessary.\n\nThe full example code is available from [https://github.com/sitepoint-editors/pagehit-file](https://github.com/sitepoint-editors/pagehit-file).\n\
    \n## Node.js File System API\n\nNode.js provides an extensive [File System (`fs`)\
    \ API](https://nodejs.org/dist/latest/docs/api/fs.html) which can manipulate,\
    \ read, and write files and directories. Early releases of Node.js provided callback-based\
    \ functions which are still available. For example:\n\n```javascript\n// append\
    \ the current date to a file\nconst fs = require('fs');\n\nfs.appendFile('myfile.txt',\
    \ new Date(), (err) => {\n  if (err) {\n    console.log('file update failed:',\
    \ err);\n  }\n  else {\n    console.log('file updated');\n  }\n});\n```\n\nSynchronous\
    \ `'sync'` equivalents are also available. However, these are not Promise-based\
    \ and block the entire Node.js process until they complete. They’re best avoided\
    \ unless you’re writing application initialization functions for older releases\
    \ of Node.js:\n\n```javascript\n// append the current date to a file\nconst fs\
    \ = require('fs');\n\ntry {\n  fs.appendFileSync('myfile.txt', new Date());\n\
    \  console.log('file updated');\n}\ncatch (err) {\n  console.log('file update\
    \ failed:', err);\n}\n```\n\nIt’s possible to `Promisify` any file system function\
    \ using [`util.promisify`](https://nodejs.org/dist/latest/docs/api/util.html#util_util_promisify_original):\n\
    \n```javascript\nconst\n  util = require('util'),\n  fs = require('fs'),\n  appendFilePromise\
    \ = util.promisify(fs.appendFile);\n\nappendFilePromise('myfile.txt', new Date())\n\
    \  .then(() => console.log('file updated'))\n  .catch(err => console.log('file\
    \ update failed:', err));\n```\n\nHowever, this is no longer necessary in recent\
    \ versions of Node.js, because [`fs.promises`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fs_promises_api)\
    \ provides Promise-based equivalents of all file system functions:\n\n```javascript\n\
    const\n  fs = require('fs'),\n  fsPromise = fs.promises;\n\nfsPromise.appendFile('myfile.txt',\
    \ new Date())\n  .then(() => console.log('file updated'))\n  .catch(err => console.log('file\
    \ update failed:', err));\n```\n\n## Step 1: File Utilities\n\n```javascript\n\
    'use strict';\n\nconst fs = require('fs');\nconst fsPromise = fs.promises;\n\n\
    function info(fn) {\n  const file = {\n    path: fn,\n    exists: false,\n   \
    \ read: false,\n    write: false,\n    isFile: false,\n    isDir: false,\n   \
    \ time: 0\n  };\n\n  return Promise.all([\n    fsPromise.access(fn, fs.constants.F_OK),\n\
    \    fsPromise.access(fn, fs.constants.R_OK),\n    fsPromise.access(fn, fs.constants.W_OK)\n\
    \  ])\n  .then(fInfo => {\n    file.exists = !fInfo[0];\n\n    if (!file.exists)\
    \ return file;\n    else {\n      file.read = !fInfo[1];\n      file.write = !fInfo[2];\n\
    \n      return fsPromise.stat(fn)\n        .then(fStat => {\n          file.isFile\
    \ = fStat.isFile();\n          file.isDir = fStat.isDirectory();\n          file.time\
    \ = fStat.mtimeMs;\n          return file;\n        })\n        .catch(() => file);\n\
    \    }\n  })\n  .catch(() => file);\n}\n```\n\n```javascript\n// return folder\
    \ info object if it can be used\nasync function folderUsable(folder) {\n  try\
    \ {\n    // fetch folder information\n    let fInfo = await info(folder);\n\n\
    \    // create folder if required\n    if (!fInfo.isDir) {\n      await fsPromise.mkdir(folder);\n\
    \      fInfo = await info(folder);\n    }\n\n    // folder accessible?\n    return\
    \ (fInfo.isDir && fInfo.read && fInfo.write ? fInfo : false);\n  }\n  catch (err)\
    \ {\n    console.log('folderUsable error:', err);\n    return false;\n  }\n}\n\
    ```\n\nA `folderList()` function returns an information object for every file\
    \ in a directory. It can optionally filter by file extension and sort by a factor\
    \ such as the creation date. The `fs` [`readdir`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_readdir_path_options)\
    \ method fetches all file names into an array. These are converted into information\
    \ objects using [`Promise.all`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all),\
    \ which executes asynchronous code in parallel:\n"
